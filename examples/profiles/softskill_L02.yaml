# ═══ MẪU HỒ SƠ `softskill` (kỹ năng mềm) — lv.py new … --profile softskill ═══
# Khung: tình huống thật → mô hình có nguồn → làm mẫu từng bước (câu nói cụ thể) → luyện tập có tiêu chí → sai lầm → quyết định.
# Không hứa kết quả (lint E46). Nguồn: Center for Creative Leadership, mô hình Situation–Behavior–Impact (SBI), ccl.org (đọc 2026-10-31).
id: L02
course: DEMO
series: "DEMO · Mẫu hồ sơ chuyên ngành"
title: "Mẫu softskill"
profile: softskill
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "Center for Creative Leadership — Situation-Behavior-Impact (SBI) feedback model, ccl.org, đọc 2026-10-31"
assumes: []
objectives:
  - "Nói một lời góp ý theo ba phần: tình huống, hành vi, tác động"
  - "Phân biệt mô tả hành vi với phán xét con người"
asr_reviewed: []
scenes:
  - id: hook
    kind: hook
    title: "Góp ý xong, đồng nghiệp tự ái"
    steps:
      - show: |
          <p>Bạn nói với đồng nghiệp: <b>“Anh lúc nào cũng cẩu thả.”</b> Anh ấy phản ứng gay gắt, và lỗi vẫn lặp lại tuần sau.</p>
          <div class="box key">Hôm nay: góp ý sao cho người nghe biết <b>chính xác</b> cần đổi điều gì.</div>
        focus: [1, 2]
        say: "Chào bạn, bạn nói với đồng nghiệp rằng anh lúc nào cũng cẩu thả, và anh ấy phản ứng gay gắt, rồi lỗi vẫn lặp lại tuần sau. Hôm nay ta học cách góp ý để người nghe biết chính xác cần đổi điều gì."
  - id: prereq
    kind: prereq
    title: "Bạn đã biết: sự kiện và nhận xét"
    steps:
      - show: "<table class='t'><tr><th>sự kiện (ai cũng kiểm được)</th><th>nhận xét (ý kiến của bạn)</th></tr><tr><td>báo cáo nộp lúc 17 giờ 40, hạn là 17 giờ</td><td>anh ấy thiếu trách nhiệm</td></tr></table>"
        focus: ["1.2", "1.2"]
        say: "Sự kiện là điều ai cũng kiểm được, ví dụ báo cáo nộp lúc 17 giờ 40 trong khi hạn là 17 giờ. Còn thiếu trách nhiệm là nhận xét của bạn, người nghe có thể không đồng ý."
  - id: model
    kind: model
    title: "Mô hình SBI: tình huống, hành vi, tác động"
    steps:
      - show: |
          <div class="chain"><span class="n">Tình huống: khi nào, ở đâu</span><span class="a">→</span><span class="n">Hành vi: điều quan sát được</span><span class="a">→</span><span class="n">Tác động: hậu quả lên bạn, nhóm</span></div>
          <p class="note">Mô hình do Trung tâm Lãnh đạo Sáng tạo (Center for Creative Leadership, Mỹ) phổ biến.</p>
        focus: [1, 1, 1, 2]
        say: "Mô hình có ba phần. Tình huống nói khi nào và ở đâu. Hành vi nói điều bạn quan sát được, không phán xét. Tác động nói hậu quả của hành vi đó lên bạn hoặc lên nhóm, và mô hình này do một trung tâm đào tạo lãnh đạo ở Mỹ phổ biến."
  - id: scenario
    kind: scenario
    title: "Làm mẫu từng bước"
    steps:
      - show: "<table class='t'><tr><th>phần</th><th>câu nói</th></tr><tr><td>Tình huống</td><td>“Trong buổi họp khách hàng sáng thứ Hai,”</td></tr></table>"
        focus: ["1.2", "1.2"]
        say: "Bước một là tình huống, nêu đúng buổi họp và thời điểm. Nhờ vậy người nghe biết bạn đang nói về lần nào, không phải lúc nào cũng thế."
      - show: "<table class='t'><tr><th>phần</th><th>câu nói</th></tr><tr><td>Hành vi</td><td>“số liệu doanh thu trên trang 3 là của quý trước,”</td></tr></table>"
        focus: ["1.2", "1.2"]
        say: "Bước hai là hành vi, chỉ nói điều quan sát được. Câu này không có từ cẩu thả, mà nói chính xác số liệu nào sai."
      - show: "<table class='t'><tr><th>phần</th><th>câu nói</th></tr><tr><td>Tác động</td><td>“nên khách hỏi lại hai lần và mình mất 15 phút giải thích.”</td></tr></table>"
        focus: ["1.2", "1.2"]
        say: "Bước ba là tác động, nói hậu quả cụ thể. Người nghe hiểu vì sao việc này quan trọng, và tự đề xuất cách sửa."
  - id: example
    kind: example
    title: "So hai cách nói"
    steps:
      - show: "<table class='t'><tr><th>cách nói</th><th>người nghe hiểu</th></tr><tr><td>“Anh cẩu thả.”</td><td>bị chê con người, không biết sửa gì</td></tr><tr><td>câu SBI ở trên</td><td>biết đúng trang, đúng số, đúng hậu quả</td></tr></table>"
        focus: [1, "1.2", "1.3"]
        say: "Đặt hai cách nói cạnh nhau. Câu chê cẩu thả khiến người nghe thấy bị chê con người, mà không biết sửa gì. Câu theo mô hình cho biết đúng trang, đúng số, và đúng hậu quả."
  - id: practice
    kind: practice
    title: "Luyện tập"
    steps:
      - show: "<p>Viết lại theo SBI: <b>“Em toàn trả lời tin nhắn chậm.”</b> Dữ kiện: hôm thứ Tư khách nhắn lúc 9 giờ, em trả lời lúc 15 giờ; khách đã gọi lên sếp.</p>"
        say: "Bạn hãy viết lại câu trên màn hình theo ba phần. Dữ kiện là hôm thứ Tư khách nhắn lúc 9 giờ, em trả lời lúc 15 giờ, và khách đã gọi lên sếp. Dừng video và viết ra giấy."
        pause: 20
      - show: "<table class='t'><tr><th>tiêu chí</th><th>đạt khi</th></tr><tr><td>Tình huống</td><td>có ngày, có việc cụ thể</td></tr><tr><td>Hành vi</td><td>có giờ nhắn, giờ trả lời; không có “toàn”, “luôn”</td></tr><tr><td>Tác động</td><td>nêu khách gọi lên sếp</td></tr></table>"
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Tự chấm theo ba tiêu chí. Phần tình huống có ngày và việc cụ thể. Phần hành vi có giờ nhắn, giờ trả lời, và không có những từ như toàn hay luôn. Phần tác động nêu việc khách đã gọi lên sếp."
  - id: pitfalls
    kind: pitfall
    title: "Sai lầm hay gặp"
    steps:
      - show: |
          <div class="box warn"><b>Sai lầm 1.</b> Đưa nhận xét vào phần hành vi (“anh thiếu chuyên nghiệp”) <b class="red">(người nghe tự vệ)</b></div>
          <div class="box warn"><b>Sai lầm 2.</b> Góp ý sau ba tuần <b class="red">(không ai nhớ tình huống)</b></div>
        focus: [1, 2]
        say: "Sai lầm thứ nhất là đưa nhận xét vào phần hành vi, như nói anh thiếu chuyên nghiệp, nên người nghe tự vệ. Sai lầm thứ hai là góp ý quá muộn, khi không ai còn nhớ tình huống."
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì?"
    steps:
      - show: "<ol><li>Câu nào là hành vi: “bạn đến muộn 20 phút” hay “bạn không tôn trọng giờ giấc”?</li></ol>"
        focus: [0, "1.1", 0]
        say: "Bây giờ đến lượt bạn tự làm. Trong hai câu trên màn hình, câu nào mô tả hành vi? Dừng video và chọn."
        pause: 10
      - show: "<p>“Bạn đến muộn 20 phút” — vì đo được, ai cũng kiểm được.</p>"
        say: "Đáp án là câu đến muộn 20 phút, vì con số đó đo được và ai cũng kiểm được."
      - show: "<p class='note'>“Không tôn trọng giờ giấc” là nhận xét — có thể đúng, nhưng để người nghe tự rút ra.</p>"
        say: "Câu còn lại là nhận xét, có thể đúng, nhưng nên để người nghe tự rút ra từ sự kiện."
  - id: recap
    kind: recap
    title: "Tổng kết"
    steps:
      - show: "<div class='chain'><span class='n'>tình huống cụ thể</span><span class='a'>→</span><span class='n'>hành vi quan sát được</span><span class='a'>→</span><span class='n'>tác động đo được</span><span class='a'>→</span><span class='n'>người nghe tự đề xuất cách sửa</span></div>"
        say: "Tổng kết lại, nêu tình huống cụ thể, mô tả hành vi quan sát được, nói tác động đo được, rồi để người nghe tự đề xuất cách sửa."
      - show: "<div class='box key'><b>Tư duy:</b> góp ý là chuyển thông tin, không phải chấm điểm con người.</div>"
        say: "Điều cần mang theo, góp ý là chuyển thông tin cho người nghe, không phải chấm điểm con người."
