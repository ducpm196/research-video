# Hồ sơ KỸ NĂNG MỀM (giao tiếp, quản lý thời gian, làm việc nhóm, thuyết trình, đàm phán, phản hồi…).
# Khung: tình huống thật → mô hình/khung làm việc có nguồn → làm mẫu từng bước → luyện tập có tiêu chí → lỗi hay gặp → quyết định.
# Không hứa hẹn kết quả (“chắc chắn thành công”); nghiên cứu được dẫn thì ghi tác giả, năm và mức bằng chứng.
