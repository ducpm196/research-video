# mô tả cảnh bằng lời và sơ đồ (bố cục khung hình, trục máy, dòng thời gian cốt truyện). Ảnh nào dùng thì khai `assets:` có giấy phép.
# Không tiết lộ nội dung quan trọng (spoiler) mà không báo trước. Phân biệt dữ kiện (năm, đạo diễn, doanh thu có nguồn) với nhận định.
