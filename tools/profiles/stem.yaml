# Hồ sơ chuyên ngành STEM (toán, khoa học máy tính, dữ liệu, AI, hệ thống, kỹ thuật) — hồ sơ MẶC ĐỊNH.
# Đúng y hành vi của lv.py trước khi có hồ sơ (2026-10-31): 476 bài đã dựng không đổi khung hình, không đổi dấu băm.
# Mỗi hồ sơ khai: phân cảnh hợp lệ + nhãn hiện trên khung (label, cls = lớp màu trong player.css), phân cảnh bắt buộc,
# chuẩn độ sâu (E39), chính sách bằng chứng, luật riêng. Đọc: .claude/skills/lecture-video/references/profiles.md
name: stem
title: "Khoa học, công nghệ, kỹ thuật, toán"
kinds:
  hook:      {label: "Vì sao cần học?",        cls: k-hook}
  prereq:    {label: "Ôn kiến thức nền",       cls: k-prereq}
  intuition: {label: "Trực giác",              cls: k-intuition}
  symbol:    {label: "Giải mã ký hiệu",        cls: k-symbol}
  concept:   {label: "Khái niệm",              cls: k-concept}
  formula:   {label: "Công thức",              cls: k-formula}
  example:   {label: "Ví dụ bằng số",          cls: k-example}
  check:     {label: "Kiểm tra lại",           cls: k-check}
  pitfall:   {label: "Lỗi thường gặp",         cls: k-pitfall}
  quiz:      {label: "Tự kiểm tra",            cls: k-quiz}
  recap:     {label: "Tổng kết & chuỗi logic", cls: k-recap}
  mindset:   {label: "Tư duy",                 cls: k-mindset}
  practice:  {label: "Tự làm",                 cls: k-practice}   # AF2: việc cụ thể người học tự làm, có lab + kết quả đối chiếu
required: [hook, symbol, example, pitfall, quiz, recap]
depth:                       # E39 khi bài khai `depth: full` (pedagogy.md luật 22)
  need: [prereq, check]      # phân cảnh phải có
  need_any: [[intuition, concept]]
  visual: svg                # svg = phải có hình cơ chế <svg> ở phần giảng; any = bảng/chuỗi/hình/ảnh đều được
  visual_kinds: [intuition, concept, formula, example, check]
  worked_kinds: [example, check]
  min_worked: 4
  min_words: 900
evidence: numbers            # mọi con số trên màn hình có `checks` chạy bằng máy
rules: []
