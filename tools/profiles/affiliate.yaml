# Hồ sơ VIDEO GIỚI THIỆU SẢN PHẨM CÓ TIẾP THỊ LIÊN KẾT (affiliate) — dạy người xem CHỌN đúng, không phải thúc mua.
# Bắt buộc (lint): công bố quan hệ liên kết ngay trong 2 phân cảnh đầu (`disclosure`); mọi con số về giá, thông số, thời hạn có nguồn kèm
# ngày xem (`claims:`); không dùng từ tuyệt đối (“tốt nhất”, “số 1”, “rẻ nhất”, “cam kết”, “100%”) khi không có nguồn; không có lời
# khen “của khách hàng” bịa ra; luôn nêu ai KHÔNG nên mua và phương án thay thế. Tuân thủ quy định quảng cáo nơi phát hành
# (ở Việt Nam: Luật Quảng cáo; quy định của nền tảng về nội dung có trả tiền) — người dùng chịu trách nhiệm xác nhận khi phát hành.
name: affiliate
title: "Giới thiệu sản phẩm có tiếp thị liên kết"
kinds:
  hook:       {label: "Vấn đề của bạn",     cls: k-hook}
  disclosure: {label: "Công bố liên kết",   cls: k-pitfall}
  need:       {label: "Bạn cần gì?",        cls: k-prereq}
  criteria:   {label: "Tiêu chí chọn",      cls: k-formula}
  compare:    {label: "So sánh",            cls: k-concept}
  example:    {label: "Tính chi phí thật",  cls: k-example}
  check:      {label: "Tự kiểm",            cls: k-check}
  pitfall:    {label: "Bẫy hay gặp",        cls: k-pitfall}
  fit:        {label: "Ai nên / không nên", cls: k-symbol}
  quiz:       {label: "Bạn chọn gì?",       cls: k-quiz}
  recap:      {label: "Tổng kết",           cls: k-recap}
required: [hook, disclosure, need, criteria, compare, fit, recap]
depth:
  need: [example, pitfall]
  need_any: []
  visual: any
  visual_kinds: [criteria, compare, example]
  worked_kinds: [compare, example, check]
  min_worked: 3
  min_words: 600
evidence: claims             # mỗi con số/khẳng định về sản phẩm khai trong `claims:` có nguồn và ngày xem
rules: [disclosure_first, no_absolute_claims, no_fake_testimonial, claims_dated, fit_both_ways]
