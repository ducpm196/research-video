# Hồ sơ NGOẠI NGỮ (tiếng Anh, Nhật, Trung… dạy bằng lời giảng tiếng Việt).
# Lời giảng: một giọng Việt cho cả bài (luật “không trộn giọng” giữ nguyên). Câu mẫu tiếng nước ngoài: cả STEP đọc bằng giọng bản ngữ
# (`voice:` của step, ví dụ en-US-AvaNeural) — không bao giờ đổi giọng giữa một câu. Step có giọng bản ngữ không qua lexicon tiếng Việt,
# và máy nghe (ASR) nghe bằng đúng ngôn ngữ đó (lv.py lấy mã ngôn ngữ từ tên giọng).
name: language
title: "Ngoại ngữ"
kinds:
  hook:          {label: "Vì sao cần học?",    cls: k-hook}
  prereq:        {label: "Ôn lại",             cls: k-prereq}
  vocab:         {label: "Từ vựng",            cls: k-symbol}
  pronunciation: {label: "Phát âm",            cls: k-intuition}
  pattern:       {label: "Mẫu câu",            cls: k-formula}
  dialogue:      {label: "Hội thoại",          cls: k-concept}
  example:       {label: "Ví dụ",              cls: k-example}
  practice:      {label: "Luyện tập",          cls: k-check}
  pitfall:       {label: "Lỗi người Việt hay mắc", cls: k-pitfall}
  culture:       {label: "Văn hoá",            cls: k-mindset}
  quiz:          {label: "Tự kiểm tra",        cls: k-quiz}
  recap:         {label: "Tổng kết",           cls: k-recap}
required: [hook, vocab, pattern, example, pitfall, quiz, recap]
depth:
  need: [prereq, practice]
  need_any: [[dialogue, pronunciation]]
  visual: any
  visual_kinds: [vocab, pattern, dialogue, example, practice]
  worked_kinds: [example, practice, dialogue]
  min_worked: 6
  min_words: 450              # bài ngoại ngữ ngắn, câu mẫu lặp lại nhiều lần; thời lượng nghe thật dài hơn số từ lời giảng
evidence: sources            # nghĩa, ngữ pháp, cách dùng dẫn từ điển/giáo trình chuẩn (ghi ở `source`); không có checks số bắt buộc
rules: [target_language_voice]
