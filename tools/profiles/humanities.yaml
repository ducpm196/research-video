# Hồ sơ KHOA HỌC XÃ HỘI, ĐỜI SỐNG, TRIẾT HỌC, LỊCH SỬ.
# Khung: câu hỏi thật → bối cảnh (ai, khi nào, vì sao) → khái niệm → lập luận từng bước (tiền đề → kết luận) → ví dụ đời sống
# → phản biện mạnh nhất (steelman) → tự kiểm → nhầm lẫn hay gặp → câu hỏi mở. Trích dẫn ghi tác giả, tác phẩm, năm (bản dịch nếu có);
# phân biệt rõ điều tác giả viết với cách hiểu phổ biến. Chủ đề gây tranh cãi: trình bày các quan điểm chính, không áp đặt.
