# Sổ ký hiệu PHỦ THÊM cho khoá DAN · Phân tích dữ liệu — CHÉP từ symbols.DSC.yaml (cùng quy ước; lv.registry("DAN") = chung + tệp này).
# Quy ước chung của khoá:
#   - mã (Python, C, SQL) viết trong <div class="code"> hoặc <code>, KHÔNG đặt trong $…$; lời đọc mô tả bằng tiếng Việt;
#   - mảng đánh số từ 0, a[i] trong <code>; khoảng nửa mở [lo, hi) viết trong <code>;
#   - dấu < > trong công thức viết \lt, \gt (như DMS, DBS, ESY).
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: floor,    pattern: '\\lfloor|\\rfloor', name: "làm tròn xuống ⌊x⌋: số nguyên lớn nhất không vượt x", read: "phần nguyên"}
  - {id: absval,   pattern: '\\lvert|\\rvert', name: "trị tuyệt đối |a|: độ lớn, bỏ dấu", read: "trị tuyệt đối của a"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
