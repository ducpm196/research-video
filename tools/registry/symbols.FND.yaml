# Sổ ký hiệu PHỦ THÊM cho khoá FND · Nền thực hành (lv.registry("FND") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá: lệnh và tên tệp đặt trong <code>…</code>; khung <div class="code"> là cửa sổ lệnh (dòng bắt đầu "$ " là lệnh người học gõ);
# dấu < > trong HTML viết &lt; &gt;; ← trong bài L00 nghĩa là "ghi giá trị bên phải vào ô bên trái".
# Mục có `term:` là thuật ngữ CHỮ (cổng E52): bài `af2: true` phải giảng ở step có `introduces: [id]` trước khi dùng, hoặc khai `assumes: [id]`
# khi một bài đứng trước TRONG DÃY đã giảng. `pattern: (?!)` = không bao giờ khớp công thức. Thêm 2026-11-13 (sửa theo báo cáo người đọc S01); fnd_bash, fnd_stderr, fnd_as thêm 2026-11-15 (vòng 5, R5_FND).
symbols:
- id: fnd_heredoc
  name: khối chữ nhúng (here-document)
  pattern: (?!)
  term: '(?i)khối chữ nhúng|&lt;&lt;\s*''?EOF'
  read: khối chữ nhúng
- id: fnd_nen
  name: chạy nền, số tiến trình, kill
  pattern: (?!)
  term: '(?i)chạy nền|chạy ngầm|&amp;\s+SV=|\bkill\b'
  read: chạy nền
- id: fnd_bash
  name: bash, Git Bash (vỏ lệnh)
  pattern: (?!)
  term: '(?i)git bash|\bbash\b'
  read: Git Bash
- id: fnd_stderr
  name: gộp luồng lỗi vào luồng thường (2>&1)
  pattern: (?!)
  term: '2(&gt;|>)(&amp;|&)1'
  read: gộp luồng lỗi
- id: fnd_as
  name: bí danh cột (AS)
  pattern: (?!)
  term: '\bAS\b'
  read: bí danh
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
