# Sổ ký hiệu PHỦ THÊM cho khoá FND · Nền thực hành (lv.registry("FND") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá: lệnh và tên tệp đặt trong <code>…</code>; khung <div class="code"> là cửa sổ lệnh (dòng bắt đầu "$ " là lệnh người học gõ);
# dấu < > trong HTML viết &lt; &gt;; ← trong bài L00 nghĩa là "ghi giá trị bên phải vào ô bên trái".
symbols: []
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
