# Luật đọc PHỦ THÊM cho khoá IRS · Truy hồi thông tin và hệ gợi ý (chạy TRƯỚC luật chung; không đổi văn bản TTS của khoá khác).
# Bằng chứng: audit/irs/probes/p1_ten.md (2026-11-03; mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, có đối chứng âm; ĐÃ ĐỌC BẢN CHÉP).
# Quy ước lời đọc của khoá (mọi bài L00–L13 soạn theo quy ước này):
#   - KHÔNG đọc trong lời (chỉ trên màn hình): TF-IDF → “trọng số tần suất nhân độ hiếm”; BM25 → “công thức xếp hạng có bão hoà” (như DEN);
#     nDCG/DCG → “độ lợi tích luỹ có chiết khấu (chuẩn hoá)”; MRR → “hạng nghịch đảo trung bình”; RRF → “hợp nhất thứ hạng nghịch đảo”;
#     MMR → “cách chọn cân liên quan với khác biệt”; IPS → “trọng số nghịch đảo xu hướng”; FAISS, HNSW, IVF → “chỉ mục chia cụm”,
#     “đồ thị nhiều tầng”; RankNet, word2vec, Netflix, tên tác giả → mô tả (“mạng xếp hạng theo cặp năm 2005”, “cuộc thi gợi ý phim”).
#   - SGD: luật chung “ét-giê-đê” chỉ 5/6 ở CS115 → không đọc; nói “bước cập nhật theo từng lượt chấm”.
#   - “văn bản” = document (lint E29 dành chữ “tài liệu” cho việc nhắc nguồn); P@k, R@k đọc “độ chuẩn xác / độ phủ ở k kết quả đầu”.
# p1 (audit/irs/probes/p1_ten.md):
#   YouTube: thô 7/8 (small “du tuyếp” 1 lần), “Diu-túp” 7/8, “du túp” 7/8 (bản chép “YouTube”); đối chứng “Diu-tắc” 0/8 (“du tắc”)
#     → cùng luật đã dựng ở NET (p3: “Diu-túp” 7/8, đối chứng 0/8).
#   Thompson: thô 0/8 (“tung sưng / tông sân”), “Tôm-xơn” 4/8, “Thôm-xơn” 0/8 (“thông sơn”); đối chứng “Tôm-mơn” 0/8 → dưới ngưỡng:
#     KHÔNG đọc; lời đọc nói “lấy mẫu theo niềm tin”, chữ Thompson chỉ trên màn hình.
#   cosin: thô 8/8 (bản chép “cô xin / cosine / cô sinh” — đúng âm định đọc), “cô-sin” 7/8, “cô sin” 8/8; đối chứng “cô-tin” 0/8
#     → đọc thô “cosin” (foreign_ok), phụ đề khớp chữ trên màn hình.
#   Beta: thô 8/8, “bê-ta” 8/8 (luật chung `beta → bê-ta`, ci), “bê ta” 8/8; đối chứng “bê-la” 0/8 (“Bella”) → giữ luật chung.
#   lambda: luật chung “lam-đa” 7/8 (bản chép “Lamda / Lambda / Lam Da”, 1 lần “làm ra”); thô 1/8 (“lam 3”); đối chứng “lam-ba” 1/8
#     (medium chép “lambda” 1 lần — ASR kéo về từ quen) → giữ luật chung, PARTIAL: cần người nghe.
#   Google: thô 8/8; đối chứng “Gu-ồng” 0/8 → đọc thô (như NET, DEN, DSY).
rules:
  - {pat: 'YouTube', say: 'Diu-túp'}
  # Đơn vị dung lượng: cùng luật đã dựng và ASR ở NET (p2: “mê-ga-byte” 8/8), PAR, DEN.
  - {pat: 'MB', say: 'mê-ga-byte'}
  - {pat: 'GB', say: 'ghi-ga-byte'}
must_not_change: []
# byte: mượn probe CSA p1_thuat_ngu (bản chép “bay” 8/8, đối chứng 0/8) như NET, PAR, DEN.
foreign_ok: [cosin, google, byte]
