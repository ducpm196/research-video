# Sổ ký hiệu PHỦ THÊM cho khoá DBS · Cơ sở dữ liệu (lv.registry("DBS") = symbols.yaml chung + tệp này).
# `replaces: <id>` bỏ mục cùng mẫu của sổ chung vì ở khoá này ký hiệu mang nghĩa KHÁC (lv.registry):
#   σ là phép CHỌN dòng (không phải độ lệch chuẩn), π là phép CHIẾU cột (không phải số pi — khoá này không dùng số pi),
#   ∩ là giao hai TẬP (không phải “A và B cùng xảy ra” của xác suất), \{ là ngoặc tập hợp (không phải bộ vector).
# Quy ước chung của khoá:
#   - câu SQL viết trong <pre class="code"> hoặc <code>, KHÔNG đặt trong $…$; từ khoá SQL viết HOA;
#   - lược đồ R(A, B, C), thuộc tính là chữ hoa đơn; phụ thuộc hàm X → Y viết $A \to B$; tập thuộc tính viết liền AB;
#   - dấu < > trong công thức viết \lt, \gt (HTML không cho gõ thẳng — như DMS).
symbols:
  - {id: set,      replaces: set, pattern: '\\\{', name: "ngoặc móc nhọn: tập hợp", read: "tập gồm"}
  - {id: cap,      replaces: cap, unicode: '∩', pattern: '\\cap\b', name: "giao: phần tử chung của hai tập", read: "giao"}
  - {id: cup,      unicode: '∪', pattern: '\\cup\b', name: "hợp hai tập", read: "hợp"}
  - {id: subseteq, unicode: '⊆', pattern: '\\subseteq', name: "là tập con của", read: "là tập con của"}
  - {id: supseteq, unicode: '⊇', pattern: '\\supseteq', name: "chứa (là tập cha của)", read: "chứa"}
  - {id: emptyset, unicode: '∅', pattern: '\\emptyset|\\varnothing', name: "tập rỗng", read: "tập rỗng"}
  - {id: notin,    unicode: '∉', pattern: '\\notin', name: "không thuộc", read: "không thuộc"}
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: select,   replaces: sigma, unicode: 'σ', pattern: '\\sigma', name: "phép chọn σ: giữ các dòng thoả điều kiện", read: "chọn"}
  - {id: proj,     replaces: pi, unicode: 'π', pattern: '\\pi(?![a-zA-Z])', name: "phép chiếu π: giữ các cột được nêu, bỏ dòng trùng", read: "chiếu"}
  - {id: join,     unicode: '⋈', pattern: '\\bowtie|\\Join', name: "phép nối ⋈: ghép dòng hai bảng khớp điều kiện", read: "nối"}
  - {id: fd,       pattern: '\\to\b|\\rightarrow', name: "phụ thuộc hàm X → Y: cùng giá trị X thì cùng giá trị Y", read: "X xác định Y"}
  - {id: closure,  pattern: '\^\+|\^\{\+\}', name: "bao đóng X⁺: mọi thuộc tính suy ra được từ X", read: "bao đóng của X"}
  - {id: card,     pattern: '\\lvert|\\rvert|\|[A-Z](\s*\\c[au]p\s*[A-Z]|\s*\\times\s*[A-Z])?\|', name: "số dòng (số phần tử) |R|", read: "số dòng của R"}
  - {id: mod,      pattern: '\\bmod|\\pmod|\\mod(?![a-zA-Z])', name: "chia lấy dư: k mod 4 là số dư khi chia k cho 4", read: "chia lấy dư cho"}
  - {id: ceil,     pattern: '\\lceil|\\rceil', name: "làm tròn lên ⌈x⌉: số nguyên nhỏ nhất không bé hơn x", read: "làm tròn lên"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small, underline]
consistency:
  - name: "Phụ thuộc hàm"
    variants: ['\\to\b', '\\rightarrow']
    fix: "Dùng một kiểu \\to cho phụ thuộc hàm."
