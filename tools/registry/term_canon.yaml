# E55 (AF3, 2026-11-13): MỘT thuật ngữ MỘT cách viết trên màn hình và lời đọc, liên khoá. Chỉ áp cho bài `af2: true`
# (tránh nợ dựng lại 650 bài cũ; khi một khoá được nâng AF2 thì tự áp). Dạng chuẩn = dạng chiếm đa số khi đo ngày 2026-11-13
# (grep trên lessons/: số bài chứa từ). `bad` là regex áp lên chữ của show (đã bỏ thẻ) + say; `canon` là dạng chuẩn.
# Mẫu F ghi: hàm tạo ↔ hàm khởi tạo; chú thích ghi đè ↔ nhãn (annotation); nhân Linux ↔ nhân hệ điều hành; commit ↔ ghi nhận (DBS L13).
rules:
  - {bad: '(?i)hàm khởi tạo', canon: 'hàm tạo', note: "hàm tạo 15 bài, hàm khởi tạo 1 bài"}
  - {bad: '(?i)tập tin', canon: 'tệp', note: "tệp 150 bài, tập tin 2 bài"}
  - {bad: '(?i)\bkhóa\b', canon: 'khoá', note: "khoá 331 bài, khóa 57 bài (cùng quy ước SPELL_CANON: tuỳ, huỷ, khoẻ)"}
  - {bad: '(?i)chú thích ghi đè', canon: 'nhãn (annotation) ghi đè', note: "annotation: dùng “nhãn”; không dùng “chú thích” cho annotation (chú thích = comment)"}
  - {bad: '(?i)đối số hàm tạo|tham số thực', canon: 'tham số', note: "tham số 115 bài, đối số 12 bài; một từ cho cả khai báo và lúc gọi, nói rõ “khi khai báo/khi gọi” nếu cần"}
