# Sổ ký hiệu PHỦ THÊM cho khoá GFX · Đồ hoạ máy tính (lv.registry("GFX") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá (mọi bài giữ một kiểu):
#   - điểm và vector viết in đậm hoặc bộ toạ độ (x, y, z, w); ma trận biến đổi 3 × 3 hoặc 4 × 4;
#   - bộ đệm độ sâu: mặt phẳng gần n, mặt phẳng xa f, khoảng cách z, số bit b;
#   - chiếu sáng: vector pháp tuyến đơn vị \mathbf{n}, hướng sáng đơn vị \mathbf{l}, hướng nửa đường \mathbf{h}, số mũ bóng sáng s;
#   - dấu < > trong công thức viết \lt, \gt; dấu nhân hai số là \cdot; số thập phân dùng dấu phẩy {,}; mã trong <code>.
#   - tên riêng / viết tắt (Lambert, Blinn, Schlick, Fresnel, Pineda, sRGB, mipmap, Nyquist) chỉ hiện trên màn hình; lời đọc dùng tiếng Việt.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: min_fn,   pattern: '\\min(?![a-zA-Z])', name: "min(a, b): lấy số nhỏ hơn trong hai số", read: "số nhỏ hơn trong"}
  - {id: absval,   pattern: '\\lvert|\\rvert', name: "trị tuyệt đối |a|: độ lớn, bỏ dấu", read: "trị tuyệt đối của a"}
  - {id: ceil,     pattern: '\\lceil|\\rceil', name: "làm tròn lên ⌈x⌉: số nguyên nhỏ nhất không nhỏ hơn x", read: "làm tròn lên"}
  - {id: floor,    pattern: '\\lfloor|\\rfloor', name: "làm tròn xuống ⌊x⌋: số nguyên lớn nhất không lớn hơn x", read: "làm tròn xuống"}
  - {id: prime,    base: true, pattern: "\\'", name: "dấu phẩy trên (x′): toạ độ sau khi biến đổi hoặc chiếu", read: "phẩy"}
  - {id: cos_fn,   pattern: '\\cos(?![a-zA-Z])', name: "cô-sin của góc giữa hai hướng", read: "cô-sin"}
  - {id: sin_fn,   pattern: '\\sin(?![a-zA-Z])', name: "sin của góc", read: "sin"}
  - {id: tan_fn,   pattern: '\\tan(?![a-zA-Z])', name: "tang của góc", read: "tang"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
