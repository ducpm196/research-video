# Sổ ký hiệu PHỦ THÊM cho khoá DMS · Toán rời rạc (lv.registry("DMS") = symbols.yaml chung + tệp này).
# Tách riêng để mẫu mới không bắt nhầm trong 74 bài CS115/CS112 đã dựng.
# Hai chỗ tránh có chủ đích:
#  - tập lũy thừa viết $\mathcal{P}\!(A)$ (có \! trước ngoặc) để mẫu “xác suất” `[Pp]\(` của sổ chung không khớp nhầm;
#  - quan hệ chia hết KHÔNG dùng \mid (sổ chung: \mid = “khi biết” của xác suất có điều kiện) — viết bằng lời “a chia hết b”.
symbols:
  # L00–L01: phép toán lôgic. Kéo theo CHỈ viết \to trong công thức. Ký tự → gõ thẳng là mũi tên nối ô của chuỗi tổng kết (dùng chung
  #   mọi khoá), nên lto không khai unicode. ⇒ (\implies, sổ chung) là “suy ra” trong lập luận, không phải phép toán.
  - {id: lnot,     unicode: '¬', pattern: '\\neg|\\lnot', name: "phủ định (không)", read: "không p"}
  - {id: land,     unicode: '∧', pattern: '\\land|\\wedge', name: "hội (và)", read: "p và q"}
  - {id: lor,      unicode: '∨', pattern: '\\lor|\\vee', name: "tuyển (hoặc, bao hàm)", read: "p hoặc q"}
  - {id: lto,      pattern: '\\to\b|\\rightarrow', name: "kéo theo (phép toán lôgic)", read: "p kéo theo q"}
  - {id: lbic,     unicode: '↔', pattern: '\\leftrightarrow', name: "tương đương hai chiều (phép toán lôgic)", read: "p khi và chỉ khi q"}
  - {id: equiv,    unicode: '≡', pattern: '\\equiv', name: "tương đương lôgic (L01); đồng dư theo mô-đun (L13)", read: "tương đương với / đồng dư với"}
  # Dấu < > trong công thức: HTML không cho gõ thẳng (&lt; làm KaTeX lỗi), nên viết \lt, \gt — kiến thức nền như ≤ ≥.
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  # L02: lượng từ, tập số
  - {id: forall,   unicode: '∀', pattern: '\\forall', name: "với mọi", read: "với mọi"}
  - {id: exists,   unicode: '∃', pattern: '\\exists', name: "tồn tại", read: "tồn tại"}
  - {id: naturals, unicode: 'ℕ', pattern: '\\mathbb\{N\}', name: "tập số tự nhiên 0, 1, 2, …", read: "N"}
  - {id: integers, unicode: 'ℤ', pattern: '\\mathbb\{Z\}', name: "tập số nguyên", read: "Z"}
  - {id: rationals, unicode: 'ℚ', pattern: '\\mathbb\{Q\}', name: "tập số hữu tỉ", read: "Q"}
  - {id: notin,    unicode: '∉', pattern: '\\notin', name: "không thuộc", read: "không thuộc"}
  # L05: tập hợp
  - {id: subseteq, unicode: '⊆', pattern: '\\subseteq', name: "là tập con của", read: "là tập con của"}
  - {id: cup,      unicode: '∪', pattern: '\\cup\b', name: "hợp", read: "hợp"}
  - {id: emptyset, unicode: '∅', pattern: '\\emptyset|\\varnothing', name: "tập rỗng", read: "tập rỗng"}
  - {id: setminus, unicode: '∖', pattern: '\\setminus', name: "hiệu hai tập (bỏ đi)", read: "bỏ đi"}
  - {id: powerset, pattern: '\\mathcal\{P\}', name: "tập lũy thừa (tập mọi tập con)", read: "tập lũy thừa của A"}
  - {id: card,     pattern: '\|[A-Z](\s*\\c[au]p\s*[A-Z])?\|', name: "số phần tử của tập |A|", read: "số phần tử của A"}
  # L06: hàm. f: A → B viết $f\colon A \to B$ — \colon là dấu riêng của hàm, để người học không lẫn mũi tên với “kéo theo”.
  - {id: func,     pattern: '\\colon', name: "hàm f đi từ tập A sang tập B", read: "f đi từ A sang B"}
  # L09–L12: đếm
  - {id: factorial, pattern: '[0-9a-zA-Z\)]!', name: "giai thừa n! = 1·2·…·n", read: "n giai thừa"}
  - {id: binom,    pattern: '\\binom', name: "tổ hợp chập k của n", read: "tổ hợp chập k của n"}
  # L13–L15: số học mô-đun
  - {id: mod,      pattern: '\\bmod|\\pmod|\\mod(?![a-zA-Z])', name: "chia lấy dư / theo mô-đun", read: "mô-đun n"}
  - {id: gcd,      pattern: '\\gcd(?![a-zA-Z])', name: "ước chung lớn nhất", read: "ước chung lớn nhất của a và b"}
  # L16–L18: đồ thị
  - {id: deg,      pattern: '\\deg(?![a-zA-Z])', name: "bậc của đỉnh", read: "bậc của v"}
layout_commands: [texttt, small, mathtt, hline, quad, qquad, text, textbf, mathbf, mathcal]
consistency:
  - name: "Phép kéo theo"
    variants: ['\\to\b', '\\rightarrow']
    fix: "Dùng một kiểu \\to cho phép kéo theo."
