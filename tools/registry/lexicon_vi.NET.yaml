# Luật đọc PHỦ THÊM cho khoá NET · Mạng máy tính (chạy TRƯỚC luật chung).
# Bằng chứng: audit/net/probes/p1_viet_tat.md, p2_tu_ngoai.md (4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng 0/8). Đọc BẢN CHÉP.
rules:
  # p1: thô 7/8, “hát tê tê pê” 8/8; đối chứng “hát tê tê ca” 0/8.
  - {pat: 'HTTP', say: 'hát tê tê pê'}
  # p1: thô 5/8 (“mạc / ma / Mark”), “mác” 3/8, “em a xê” 8/8 (bản chép “MAC”); đối chứng “mát” 3/8.
  - {pat: 'MAC', say: 'em a xê'}
  # p1: thô 0/8 (“e thân”), “I-tơ-nét” 3/8 (lẫn Internet), “Ê-thơ-nét” 8/8; đối chứng “I-tơ-lét” 2/8.
  - {pat: 'Ethernet', say: 'Ê-thơ-nét'}
  # p1: thô 2/8 (“ai lo”), “A-lô-ha” 8/8; đối chứng “A-lô-ma” 0/8.
  - {pat: 'ALOHA', say: 'A-lô-ha'}
  # p1: thô 4/8, “đê en ét” 5/8 (tốt nhất), “đi en ét” 2/8; đối chứng 0/8 → NOT_VERIFIED bằng tai người.
  - {pat: 'DNS', say: 'đê en ét'}
  # p1: thô 6/8, “Đi-phi Hen-man” 8/8 nhưng đối chứng “Đi-phi Hen-nan” 6/8 (ASR không tách m/n) → NOT_VERIFIED.
  - {pat: 'Diffie–Hellman', say: 'Đi-phi Hen-man'}
  # p2: HTML thô 3/8 (“hát thêm mơ lờ”), “hát tê em eo” 8/8; đối chứng “hát tê em ca” 0/8.
  - {pat: 'HTML', say: 'hát tê em eo'}
  # p2: MB thô 4/8, “mê-ga-byte” 8/8 (bản chép “Megabyte”); đối chứng “mê-ga-oát” 0/8 (“Megawatt”).
  - {pat: 'MB', say: 'mê-ga-byte'}
  # p3 (audit/net/probes/p3_hanh_trinh.md, 2026-11-02): YouTube thô 6/8 (small “du tuyếp”), “Diu-túp” 7/8 (bản chép “YouTube”),
  #   “du túp” 7/8; đối chứng “Diu-tắc” 0/8 (“du tắc”). Chỉ dùng ở L15 → không bài cũ nào đổi văn bản TTS.
  - {pat: 'YouTube', say: 'Diu-túp'}
must_not_change: []
# p3: Google thô 8/8 (bản chép “Google”), đối chứng “Gu-ồng” 0/8 → đọc thô.
# p3: QUIC thô 0/8 (“quy u i xê”), “quých” 3/8, “quích” 1/8 (chép “quít / quýt / quyết”) → KHÔNG đọc; lời đọc nói “giao thức giao vận
#   mới (năm 2021)”, chữ QUIC chỉ trên màn hình. BBR thô 6/8 (small “bb error”, medium “BBR” 4/4), “bê bê e-rờ” 5/8; đối chứng
#   “bê bê en-nờ” 0/8 → dưới ngưỡng 7/8: KHÔNG đọc; lời đọc nói “thuật toán mới của Google”, chữ BBR chỉ trên màn hình.
# p1: TCP thô 8/8 (“tê xê pê” 8/8); UDP thô 7/8; IP thô 8/8; đối chứng đều 0/8 → đọc thô.
# CRC: thô 4/8, “xê e xê”, “xê a xê” 0/8 (chép “CEC”, “CAC”) → đọc thô, NOT_VERIFIED.
# TLS: mọi cách ≤ 3/8 → KHÔNG đọc tên; lời đọc nói “giao thức bảo mật của web”, chữ TLS chỉ trên màn hình.
# byte: mượn probe CSA (bản chép “bay” 8/8, đối chứng 0/8).
# p2: Internet thô 8/8, web thô 8/8 (đối chứng “oen” 0/8), IPv4 thô 8/8 (đối chứng “IPv5” chép đúng số 5) → đọc thô.
# p2: XOR thô 6/8 (medium chép đúng “XOR” 4/4) → đọc thô, NOT_VERIFIED. checksum: mọi cách 0/8 (“chát sung”) →
#   KHÔNG đọc; lời đọc nói “tổng kiểm tra”, chữ checksum chỉ trên màn hình.
foreign_ok: [tcp, udp, crc, byte, internet, web, ipv, xor, google]
