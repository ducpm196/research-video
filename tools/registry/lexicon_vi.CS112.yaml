# Luật đọc PHỦ THÊM cho khoá CS112 (lv.lexicon("CS112") = các luật ở đây, chạy TRƯỚC luật chung lexicon_vi.yaml).
# Tách riêng để không đổi văn bản gửi TTS của 44 video CS115 đã dựng (đổi lexicon chung → video cũ thành STALE).
# Mọi luật phải có bằng chứng dò ASR: audit/cs112/probes/<tên>.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8,
# đối chứng âm phải 0/8 hoặc gần 0). Cách viết chưa đạt ngưỡng → tránh từ đó trong lời đọc.
rules:
  # p1_tiem_can 2026-10-26T20:39Z: “Tê-ta” 8/8, “tê-ta” 8/8, thô “Theta” 7/8, “thê-ta” 6/8; đối chứng “tê-pa” 0/8 → dùng Tê-ta.
  - {pat: 'Theta', say: 'Tê-ta'}
  - {pat: 'theta', say: 'tê-ta'}
  # p2_tu_ngoai 2026-10-26: thô “Fibonacci” 3/8, “Phi-bô-na-xi” 6/8, “Fi-bô-na-chi” 8/8; đối chứng “Phi-bô-na-ni” 0/8.
  - {pat: 'Fibonacci', say: 'Fi-bô-na-chi'}
  # p3_ten_rieng 2026-10-26: “Đan-xích” 7/8, “Đăn-xích” 5/8, thô 0/8; đối chứng “Đan-xinh” 0/8.
  #   “Euclid”: mọi cách viết 0/8 và đối chứng “Ơ-clép” cũng bị chép “ở clip” → NOT_VERIFIED, không nói tên trong lời đọc.
  - {pat: 'Dantzig', say: 'Đan-xích'}
  # p5_do_thi 2026-10-27T08:53Z: thô “NP” 4/8, “N P” 6/8, “en-pê” 8/8, “en pê” 8/8; đối chứng “em bê” 0/8 → dùng en-pê.
  #   Dijkstra (mọi cách viết 0/8: “Dextra”, “Đích Chà”), Kruskal (tối đa 5/8 “Cơ-rút-can”), Prim (tối đa 3/8: “phim”),
  #   Bellman (thô 6/8; “Beo-man” 8/8 nhưng là cách đọc lạ) → NOT_VERIFIED: tên chỉ hiện trên màn hình, lời đọc dùng tên mô tả
  #   (như CS115 L39 với Bellman). Bài L24–L26 CS112.
  - {pat: 'NP', say: 'en-pê'}
must_not_change: []
# p2_tu_ngoai 2026-10-26 (audit/cs112/probes/p2_tu_ngoai.md):
#   AVL: thô 8/8, “a vê eo” 8/8; đối chứng “a vê em” 0/8 → đọc thô (foreign_ok).
#   Catalan: thô 8/8, “Ca-ta-lan” 8/8; đối chứng “Ca-ta-man” 0/8 → đọc thô.
#   byte: thô 1/8, “bai” 1/8, “bai-tơ” 5/8, nhưng đối chứng “bài” 8/8 (khoá chấm lỏng) → NOT_VERIFIED: lời đọc nói “ô nhớ”.
#   Bland: thô 8/8 nhưng đối chứng “Bờ-lăng” 8/8 → NOT_VERIFIED: lời đọc nói “quy tắc chọn chỉ số nhỏ nhất”, tên chỉ trên màn hình.
#   Python: mọi cách viết ≤ 3/8 → không nói tên trong lời đọc.
# Từ ngoại đọc thô đạt ngưỡng (ghi bằng chứng):
#   omega: p1_tiem_can thô “Omega” 8/8, đối chứng “ô-mê-na” 0/8 (small + medium chép “Omena”).
#   “O lớn” không cần luật: thô 8/8, đối chứng “ô nhỏ” 0/8. “log”: thô 4/8, “lốc” 4/8, “lóc” 8/8 nhưng đối chứng “lốp” 2/8
#   (khoá chấm lỏng) → KHÔNG thêm luật; lời đọc nói “lôgarit”.
#   fi: âm tiết đầu của “Fi-bô-na-chi” (p2_tu_ngoai 8/8).
# p6_hanh_trinh 2026-11-02T09:20Z (bài L29): Java thô 8/8 (bản chép “Java”), “Gia-va” 8/8; đối chứng “Gia-la” 0/8 → đọc thô (foreign_ok).
#   Timsort: thô 7/8 (bản chép “tim sóc / tìm sót / TeamShop”), “Tim-sót” 6/8, “Tim sọt” 5/8, nhưng đối chứng “Tim-xốp” cũng 4/8
#   (khoá chấm không dấu lỏng) → NOT_VERIFIED: KHÔNG đọc tên, chỉ trên màn hình; lời đọc nói “thuật toán sắp xếp ấy”.
#   Python, Powersort, KeY, OpenJDK: không đọc (Python ≤ 3/8 ở p2).
foreign_ok: [omega, avl, catalan, fi, java]
