# Sổ ký hiệu PHỦ THÊM cho khoá PYT · Python từ con số 0 (lv.registry("PYT") = symbols.yaml chung + tệp này).
# Mỗi ký hiệu mới: {id, pattern (regex trên LaTeX/HTML), name (nghĩa đọc được), read (cách đọc)}; `replaces: <id>` khi khoá dùng nghĩa khác sổ chung.
# Ghi quy ước chung của khoá ở đây (mã trong <code>, dấu < > viết \lt \gt …) để mọi bài giữ một kiểu.
# Mục `term:` (E52, 2026-11-14): thuật ngữ CHỮ phải được giảng tại chỗ (`introduces`) trước khi dùng; bài sau ghi `assumes` (bài đứng trước trong dãy đã giảng).
symbols:
- id: pyt_perf_counter
  name: đồng hồ đo thời gian (time.perf_counter)
  term: '\bperf_counter\b'
- id: pyt_getsizeof
  name: lệnh hỏi kích thước một giá trị (sys.getsizeof)
  term: '\bgetsizeof\b'
- id: pyt_tracemalloc
  name: công cụ theo dõi bộ nhớ (tracemalloc)
  term: '\btracemalloc\b'
- id: pyt_isinstance
  name: lệnh hỏi một đối tượng thuộc lớp nào (isinstance)
  term: '\bisinstance\b'
- id: pyt_pass
  name: câu lệnh không làm gì (pass)
  term: '\bpass\b'
- id: pyt_ngoai_suy
  name: ngoại suy (nhân theo tỉ lệ từ số đã đo)
  term: '(?i)ngoại suy'
- id: pyt_pip
  name: công cụ cài thư viện (pip)
  term: '(?i)\bpip\b'
- id: pyt_site_packages
  name: thư mục thư viện đã cài (site-packages)
  term: 'site-packages'
- id: pyt_sys_prefix
  name: thư mục của bản Python đang chạy (sys.prefix)
  term: 'sys\.(base_)?prefix'
- id: pyt_cut
  name: lệnh cắt ký tự đầu dòng (cut -c)
  term: '\bcut -c'
- id: pyt_bien_dich
  name: mã đã biên dịch
  term: '(?i)biên dịch'
- id: pyt_loc
  name: chọn dòng và cột bằng .loc
  term: '\.loc\b'
- id: pyt_datetime64
  name: kiểu ngày giờ của bảng (datetime64)
  term: 'datetime64'
- id: pyt_idxmax
  name: nhãn của giá trị lớn nhất (idxmax)
  term: '\bidxmax\b'
- id: pyt_assert
  name: khẳng định (assert)
  term: '\bassert\b'
- id: pyt_decorator
  name: dòng trang trí hàm bắt đầu bằng @ (@pytest.mark)
  term: '@pytest\.mark'
- id: pyt_subprocess
  name: chạy chương trình khác từ chương trình (subprocess)
  term: '\bsubprocess\b'
- id: pyt_ham_thuan
  name: hàm thuần
  term: '(?i)hàm thuần'
- id: pyt_chunksize
  name: số dòng mỗi khối khi đọc (chunksize)
  term: '\bchunksize\b'
- id: pyt_trung_vi
  name: trung vị
  term: '(?i)trung vị'
- id: pyt_tempfile
  name: thư mục tạm (tempfile)
  term: '\btempfile\b'
- id: pyt_diem_anh
  name: điểm ảnh
  term: '(?i)điểm ảnh'
- id: pyt_luc_giac
  name: ô lục giác (hexbin)
  term: '(?i)lục giác|hexbin'
- id: pyt_get_offsets
  name: lấy lại toạ độ các điểm đã vẽ (get_offsets)
  term: '\bget_offsets\b'
- id: pyt_sys_executable
  name: đường dẫn tới chính bản Python đang chạy (sys.executable)
  term: 'sys\.executable'
- id: pyt_capture_output
  name: giữ đầu ra của chương trình con (capture_output)
  term: '\bcapture_output\b'
- id: pyt_ngoai_le
  name: ngoại lệ (lỗi được báo ra, có tên loại và lý do)
  term: '(?i)ngoại lệ'
- id: pyt_repr
  name: lệnh in giá trị kèm cặp nháy (repr)
  term: '\brepr\b'
- id: pyt_rstrip
  name: lệnh cắt bỏ ký tự ở cuối chuỗi (rstrip)
  term: '\brstrip\b'
- id: pyt_cd
  name: lệnh đổi thư mục và lệnh hỏi thư mục đang đứng (cd, pwd)
  term: '\bcd\b|\bpwd\b'
- id: pyt_sys_path
  name: danh sách thư mục máy tìm mô-đun (sys.path)
  term: 'sys\.path'
- id: pyt_items
  name: lấy từng cặp khoá–giá trị (.items) và từ điển suy ra
  term: '\.items\(\)'
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
