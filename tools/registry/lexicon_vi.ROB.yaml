# Luật đọc PHỦ THÊM cho khoá ROB · Robot tự hành — CHÉP NGUYÊN từ lexicon_vi.RBM.yaml (cùng bằng chứng dò audit/rbm/probes/p1_ten.md, p2_tu.md). Thêm: lidar không đọc (audit/aif/probes/p2: 6/8).
# Bằng chứng dò: audit/rbm/probes/p1_ten.md, p2_tu.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm 0/8).
#   Đọc BẢN CHÉP, không chỉ điểm khoá: ASR chép “r” đầu âm tiết thành “tr”, và khoá ngắn (“robo”, “atan”) khớp giả trong từ khác.
rules:
  # p1: thô 6/8 (“căn mang”), “Ca-man” 8/8 (bản chép “ca man / ca mang”), “Can-man” 5/8; đối chứng “Ca-nan” 0/8 (“ca năng”).
  - {pat: 'Kalman', say: 'Ca-man'}
  # p1: thô 3/8 (“dim bầu”), “gim-bồ” 7/8 (bản chép “gimbal / Gimbo”), “dim-bồ” 5/8; đối chứng “gim-bàn” 0/8 (“ghim bàn”).
  - {pat: 'gimbal', say: 'gim-bồ'}
  # p1: thô 0/8 (“Furi / Fuji”), “Phu-ri-ê” 8/8 (bản chép “Fourier”), “Phu-ri-e” 7/8; đối chứng “Phu-li-ê” 0/8 (“folie”).
  - {pat: 'Fourier', say: 'Phu-ri-ê'}
  # p1: thô 0/8 (“ơ lưu”), “Ơ-le” 8/8 (bản chép “ơ le / ở lê”) — trùng probe DMS p1_ten; đối chứng “Ơ-me” 0/8.
  - {pat: 'Euler', say: 'Ơ-le'}
  # p1: thô 2/8 (“Pyrrê / PIRE”), “pê i đê” 6/8, “pi ai đi” 7/8 (bản chép “PID”); đối chứng “pê i bê” 0/8 (“PIB”).
  - {pat: 'PID', say: 'pi ai đi'}
  # p1: Hz thô, “héc”, “hẹc” đều bị chép “hét / hạt” 0/8, và đối chứng “hét” cũng chép “hét”: ASR không tách âm cuối c/t (cùng
  #   nhóm Fermat → “phét ma”). Dùng cách đọc chuẩn “héc” — NOT_VERIFIED bằng tai người.
  - {pat: 'Hz', say: 'héc'}
  # p2: cos thô 5/8 (bản chép “COS / code / coach”), “cốt” 6/8 (“cố / cốt”), “cô-sin” 3/8 theo khoá nhưng bản chép là
  #   “cô xin / cô sinh / coxin” — đúng âm định đọc (khoá “cosin” không bắt chữ x); đối chứng “cốc” 0/8 → “cô-sin” (cách đọc chuẩn).
  - {pat: 'cos', say: 'cô-sin', ci: true}
  # p2: theta thô 4/8 (“thay ta / theo ta”), “tê-ta” 7/8 (bản chép “tê ta / theta / Teta”), “thê-ta” 4/8; đối chứng “bê-ta” 0/8.
  - {pat: 'theta', say: 'tê-ta', ci: true}
  # p2: RK4 thô 5/8 (“Erika 4”), “R K 4” 6/8, “e rờ ca 4” 7/8 (medium chép “RK4” 4/4); đối chứng “R K 5” giữ đúng số 5.
  - {pat: 'RK4', say: 'e rờ ca 4'}
  # p1 + p2: quaternion mọi cách ≤ 4/8; “qua-tơ-ni-ơn” cho bản chép cùng dáng âm (“qua tơ niên / qua tên niơn / Quaternion”);
  #   đối chứng “qua-tơ-li-ơn” chép “liên / liêng” (phân biệt n/l) → dùng “qua-tơ-ni-ơn”, NOT_VERIFIED bằng tai người.
  - {pat: 'quaternion', say: 'qua-tơ-ni-ơn', ci: true}
must_not_change: []
# p1: radian thô 8/8, “ra-đi-an” 8/8; đối chứng “ra-đi-ô” 0/8 (“radio”) → đọc thô.
# p1: robot thô 7/8 (bản chép “robot” ở 6 lần, “trôi bốt” r → tr); đối chứng “rô-bông” 7/8 là khớp GIẢ (khoá “robo” nằm trong
#   “robong”), bản chép đối chứng luôn là “rô bông”, không lần nào “robot” → đọc thô.
# p1: atan2 viết “a-tan 2” trong lời: 8/8 (bản chép “ATAN 2 / A tan 2”); đối chứng “a-tan 3” 6/8 là khớp giả (khoá “atan”), bản chép
#   giữ đúng số 3 → hai chữ số được phân biệt. “a-tan” là âm tiết Việt, không cần luật.
# p1: Runge–Kutta mọi cách ≤ 3/8 (“rung cua ta”, “dung cơ của ta”); Nyquist mọi cách 0/8 (“ní quyết”, “nai quyết”) → KHÔNG đọc tên:
#   lời đọc nói “định lý lấy mẫu” (bài 14); tên Runge–Kutta xem p2 (RK4). Quaternion: tốt nhất “qua-tơ-ni-ơn” 4/8 → xem p2.
# Không dò, không đọc trong lời (tên chỉ trên màn hình): Nyquist, Shannon, Dijkstra (CS112 p5: mọi cách 0/8), Student, Simpson.
# p2: sin thô 8/8 (bản chép “xin / sinh”, đúng cách đọc tiếng Việt), đối chứng “xinh” 8/8 là khớp giả (khoá “xin”) → đọc thô.
# p2: camera thô 8/8, “ca-mê-ra” 8/8; đối chứng “ca-mê-la” chép “Camela / Camilla” → đọc thô.
# p2: Runge–Kutta không đọc tên (p1 ≤ 3/8): lời đọc nói “phương pháp RK4”.
# byte: probe NET p2 (như các khoá CSA, OSY, SEC).
foreign_ok: [radian, robot, camera, sin, byte]
