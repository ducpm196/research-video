# Luật đọc PHỦ THÊM cho khoá MLO · MLOps (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò: audit/mlo/probes/p1_ten.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm). Đọc BẢN CHÉP.
#   Không đọc trong lời: PSI (“chỉ số ổn định quần thể”), int8 / float32 (“số nguyên 8 bit”, “số thực 32 bit”), A/B (“thử nghiệm hai nhóm”).
#   GPU: thô 5/8 (“GoPro”), “gờ pê u” 5/8 → không đọc; lời đọc nói “bộ xử lý đồ hoạ”.
#   Brier: thô 0/8 (“Bride / barrier”), “Brai-ơ” 3/8, “Bri-ơ” 0/8 → KHÔNG đọc; lời đọc nói “điểm sai lệch bình phương”.
rules:
  # p1: “em eo óp” 7/8 (bản chép “ml op / MLOP”); thô 0/8 (“malloc”), “em-en-óp” 0/8; đối chứng “em-en-ót” 0/8.
  - {pat: 'MLOps', say: 'em eo óp'}
  # Đơn vị: cùng luật đã dựng và ASR ở OSY/NET/SDP/CLD.
  - {pat: 'MB', say: 'mê-ga-byte'}
  - {pat: 'GB', say: 'ghi-ga-byte'}
must_not_change: []
# cpu: probe CLD p1 (thô 7/8). byte: probe CSA p1_thuat_ngu. container: probe CLD p1 (thô 5/8, NOT_VERIFIED, xem lexicon_vi.CLD.yaml).
# devops: probe DVO p1 (thô 6/8, NOT_VERIFIED, xem lexicon_vi.DVO.yaml).
# google (bài L14, 2026-11-02): mượn probe NET p3 (thô 8/8, bản chép “Google”; đối chứng “Gu-ồng” 0/8), cùng kết quả ở DSY, DEN.
# p2 (2026-11-02, bài L14, audit/mlo/probes/p2_hanh_trinh.md):
#   TFX: thô 8/8 (bản chép “TFX/tfx” cả 8), “tê ép ích” 7/8, “ti ép ích” 1/8; đối chứng “tê ép xê” 0/8 (“TFC”) → đọc thô (foreign_ok).
#   KHÔNG đọc — chỉ trên màn hình, lời đọc dùng tên mô tả:
#   TensorFlow: thô 2/8, “Ten-xơ-phlâu” 5/8, “Ten-sơ-lâu” 1/8; đối chứng “Ten-xơ-phlây” 4/8 (ASR tự sửa) → không đọc.
#   Sibyl: thô 7/8 và “Xi-bin” 7/8 nhưng bản chép là “si bin/si bình” (khoá chấm “sibin” — điểm giả), “Xi-biu” 5/8; đối chứng “Xi-ba” 0/8
#     → không đọc; lời đọc nói “nền tảng đầu tiên năm 2007”.
foreign_ok: [byte, cpu, container, devops, google, tfx]
