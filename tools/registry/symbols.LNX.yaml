# Sổ ký hiệu PHỦ THÊM cho khoá LNX · Linux và Container thực chiến.
symbols:
- id: lnx_inode
  name: nút chỉ mục mô tả tệp (inode)
  pattern: (?!)
  term: '\binode\b'
- id: lnx_quyen_bat_phan
  name: quyền tệp dạng bát phân (rwx, chmod)
  pattern: (?!)
  term: '\bchmod\b'
- id: lnx_tin_hieu
  name: tín hiệu điều khiển tiến trình (SIGTERM/SIGKILL)
  pattern: (?!)
  term: '\b(SIGTERM|SIGKILL)\b'
- id: lnx_namespace
  name: không gian tên cô lập và giới hạn tài nguyên
  pattern: (?!)
  term: '\b(namespaces?|cgroups?)\b'
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
