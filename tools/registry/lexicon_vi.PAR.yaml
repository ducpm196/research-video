# Luật đọc PHỦ THÊM cho khoá PAR · Tính toán song song và GPU (chạy TRƯỚC luật chung; không đổi văn bản TTS của khoá khác).
# Mỗi từ ngoại / tên riêng: thử 2–3 cách viết, cho ASR nghe lại (audit/par/probes/), ghi điểm “k/8” và đối chứng vào chú thích.
# Không đạt 7/8 → không đọc trong lời: chỉ hiện trên màn hình, lời đọc dùng tên tiếng Việt.
# Quy ước lời đọc của khoá (2026-11-02; mọi bài L00–L13 soạn theo quy ước này, KHÔNG câu `say` nào chứa GPU, CUDA, NVIDIA, SIMD):
#   GPU → “thẻ đồ hoạ” / “bộ xử lý đồ hoạ”; CPU → “bộ xử lý trung tâm”; warp → “nhóm 32 luồng chạy chung lệnh”; SIMD → “một lệnh nhiều
#   dữ liệu”; roofline → “mô hình mái nhà”; all-reduce → “gộp toàn phần (theo vòng)”. GHz → “tỉ nhịp mỗi giây”; ms → “mi li giây”.
# Probe p1 (audit/par/probes/p1_ten.md, 2026-11-02/03, small + medium, 4 ngữ cảnh, ĐÃ ĐỌC BẢN CHÉP; edge-tts bị chặn nhiều lượt, chạy lại tới đủ):
#   GPU: thô 6/8, “Gi-pi-diu” 8/8 (bản chép “GPU” cả 8), “Giê-pê-u” 6/8; đối chứng “Gi-pi-ti” 0/8 (“GPT”) → luật “Gi-pi-diu” (để sẵn).
#   CUDA: thô 0/8 (“Surya”), “Cu-đa” 7/8 (bản chép “CUDA” 7, “cua đa” 1), “Kiu-đa” 4/8; đối chứng “Cu-ba” 0/8 → luật “Cu-đa” (để sẵn).
#   NVIDIA: thô 1/8 (“video”), “En-vi-đi-a” 8/8 (bản chép “Nvidia/NVIDIA”), đối chứng “En-vi-đi-ô” 2/8 (ASR kéo về từ quen) → luật,
#     PARTIAL: đối chứng chưa sạch, cần người nghe.
#   SIMD: thô 1/8, “Xim-đi” 6/8, “Xim-đê” 7/8 (small chép “SIM-D / xin đê”, medium “SIMD”); đối chứng “Xim-bê” 0/8 → luật “Xim-đê”, PARTIAL.
#   KHÔNG đọc (dưới 7/8 hoặc điểm giả): warp ≤ 2/8 (“úp/quốc”); Gustafson ≤ 5/8; Brent ≤ 5/8 (“bờ đen”); Horovod ≤ 4/8; AlexNet ≤ 4/8;
#     roofline 0/8; all-reduce 0/8; ImageNet “Im-mịt-nét” 7/8 nhưng phần lớn bản chép chỉ lặp lại cách viết (“im mịt nét”, khoá chấm chứa
#     chính cách viết — điểm giả) → không đọc.
#   Các bài hiện có không đọc tên nào ở trên trong lời; luật GPU/CUDA/NVIDIA/SIMD để sẵn cho lần sửa sau, không đổi văn bản TTS bài nào.
rules:
  # Amdahl: lexicon_vi.CSA.yaml p1_thuat_ngu — “Am-đan” 8/8, thô 0/8, đối chứng “Am-đam” 2/8 (cùng luật ở CSA, DSY).
  - {pat: 'Amdahl', say: 'Am-đan'}
  - {pat: 'GPU', say: 'Gi-pi-diu'}
  - {pat: 'CUDA', say: 'Cu-đa'}
  - {pat: 'NVIDIA', say: 'En-vi-đi-a'}
  - {pat: 'SIMD', say: 'Xim-đê'}
  # Đơn vị dung lượng: cùng luật đã dựng và ASR ở OSY, NET, SDP, CLD, SEC, MLO, LLM (GB), DSY (KB, TB).
  - {pat: 'KB', say: 'ki-lô-byte'}
  - {pat: 'MB', say: 'mê-ga-byte'}
  - {pat: 'GB', say: 'ghi-ga-byte'}
  - {pat: 'TB', say: 'tê-ra-byte'}
must_not_change: []
# byte: mượn probe CSA p1_thuat_ngu (bản chép “bay” 8/8, đối chứng “bò” 0/8) như NET, DBS, ESY, SWF, LLM, DSY.
foreign_ok: [byte]
