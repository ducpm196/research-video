# Sổ ký hiệu PHỦ THÊM cho khoá CS112 (lv.registry("CS112") = symbols.yaml chung + tệp này).
# Đặt riêng để mẫu mới không bắt nhầm trong 44 bài CS115 đã dựng (production.md: mẫu quá rộng bắt nhầm bài cũ).
# Cùng định dạng symbols.yaml: id, pattern (regex trên mã LaTeX), unicode (ký tự gõ trong chữ), name, read (cách đọc).
symbols:
  # L00: làm tròn xuống / lên, giai thừa, chia lấy dư, lôgarit cơ số 2 viết tắt
  - {id: floor,     unicode: '⌊⌋', pattern: '\\lfloor|\\rfloor', name: "làm tròn xuống ⌊x⌋ (số nguyên lớn nhất ≤ x)", read: "làm tròn xuống của x"}
  - {id: ceil,      unicode: '⌈⌉', pattern: '\\lceil|\\rceil', name: "làm tròn lên ⌈x⌉ (số nguyên nhỏ nhất ≥ x)", read: "làm tròn lên của x"}
  - {id: factorial, pattern: '[0-9a-zA-Z\)]!', name: "giai thừa n! = 1·2·…·n", read: "n giai thừa"}
  - {id: mod,       pattern: '\\bmod|\\pmod|\\mod(?![a-zA-Z])', name: "chia lấy dư", read: "chia lấy dư cho"}
  # L01: năm ký hiệu tiệm cận, lượng từ, giới hạn, vô cùng
  - {id: bigO,      pattern: '(?<![a-zA-Z\\])O\s*(\(|\\big|\\left)', name: "O lớn: chặn trên tiệm cận", read: "ô lớn của g"}
  - {id: bigOmega,  pattern: '\\Omega', name: "Omega lớn: chặn dưới tiệm cận", read: "Omega lớn của g"}
  - {id: bigTheta,  pattern: '\\Theta', name: "Theta lớn: chặn chặt (cùng bậc)", read: "Theta lớn của g"}
  - {id: smallo,    pattern: '(?<![a-zA-Z\\])o\s*(\(|\\big|\\left)', name: "o nhỏ: tăng chậm hẳn", read: "ô nhỏ của g"}
  - {id: smallomega, pattern: '\\omega', name: "omega nhỏ: tăng nhanh hẳn", read: "omega nhỏ của g"}
  - {id: forall,    unicode: '∀', pattern: '\\forall', name: "với mọi", read: "với mọi"}
  - {id: exists,    unicode: '∃', pattern: '\\exists', name: "tồn tại", read: "tồn tại"}
  - {id: lim,       pattern: '\\lim(?![a-zA-Z])', name: "giới hạn khi n tiến tới vô cùng", read: "giới hạn khi n tiến tới vô cùng của"}
  - {id: infty,     unicode: '∞', pattern: '\\infty', name: "vô cùng (lớn hơn mọi số)", read: "vô cùng"}
  - {id: min_fn,    pattern: '\\min(?![a-zA-Z])', name: "min: lấy số nhỏ nhất", read: "số nhỏ nhất trong"}
  # L02: f ≺ g — f tăng chậm hẳn g (f ∈ o(g)); dùng để viết chuỗi tăng trưởng
  - {id: prec,      unicode: '≺', pattern: '\\prec(?![a-zA-Z])', name: "tăng chậm hẳn: f ≺ g nghĩa là f ∈ o(g)", read: "tăng chậm hẳn"}
  # L13: ước chung lớn nhất (thuật toán Euclid)
  - {id: gcd,       pattern: '\\gcd(?![a-zA-Z])', name: "ước chung lớn nhất gcd(a, b)", read: "ước chung lớn nhất của a và b"}
  # L07: số phần tử của tập đỉnh / tập cạnh (vạch đứng đơn quanh chữ V, E — không phải trị tuyệt đối)
  - {id: card,      pattern: '\|[VE]\|', name: "số phần tử của tập: |V| số đỉnh, |E| số cạnh", read: "số đỉnh, số cạnh"}
  # L26 (2026-10-27): lớp bài toán và quy dẫn
  - {id: subseteq,  unicode: '⊆', pattern: '\\subseteq', name: "nằm trong (là tập con của)", read: "nằm trong"}
  - {id: setminus,  unicode: '∖', pattern: '\\setminus', name: "bỏ đi (hiệu hai tập): V ∖ S = các đỉnh không thuộc S", read: "bỏ đi"}
  - {id: polyred,   pattern: '\\le_\{?p', name: "quy dẫn trong thời gian đa thức: A ≤ₚ B", read: "A quy dẫn về B"}
# Lệnh chỉ để trình bày trong bài CS112 (không mang nghĩa toán mới)
layout_commands: [texttt, tt, small, mathtt, hline, cdots]
consistency:
  - name: "Lôgarit cơ số 2"
    variants: ['\\lg(?![a-zA-Z])', '\\log_\{?2']
    fix: "Một bài chỉ dùng một cách viết lôgarit cơ số 2: \\log_2 n (khuyên dùng); \\lg n chỉ xuất hiện ở step notation_note."
