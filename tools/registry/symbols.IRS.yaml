# Sổ ký hiệu PHỦ THÊM cho khoá IRS · Truy hồi thông tin và hệ gợi ý (lv.registry("IRS") = symbols.yaml chung + tệp này).
# Mỗi ký hiệu mới: {id, pattern (regex trên LaTeX/HTML), name (nghĩa đọc được), read (cách đọc)}; `replaces: <id>` khi khoá dùng nghĩa khác sổ chung.
# Quy ước chung của khoá (mọi bài giữ một kiểu):
#   - thuật ngữ theo CS115 bài 21: precision = “độ chuẩn xác”, recall = “độ phủ”; P@k, R@k viết chữ thường trên màn hình (không phải
#     ký hiệu xác suất: KHÔNG viết “P(”); hạng nghịch đảo RR = 1 chia vị trí của kết quả đúng đầu tiên;
#   - vị trí trong danh sách đánh số từ 1; mức liên quan viết rel_i (i nhỏ dưới chân = vị trí thứ i);
#   - lôgarit tự nhiên viết \ln, lôgarit cơ số 2 viết \log_2 (mỗi bài chỉ dùng một kiểu, theo luật nhất quán của sổ chung);
#   - vector viết in đậm chữ thường (\mathbf{u}); cosin viết \cos(\mathbf{u}, \mathbf{v}) như LLM bài 3; dấu nhân hai số là ·;
#   - dấu < > trong công thức viết \lt, \gt; số thập phân dùng dấu phẩy {,}; mã, tên thư viện trong <code>.
#   - tên viết tắt (TF-IDF, BM25, nDCG, MRR, RRF, MMR, IPS, FAISS, HNSW) chỉ trên màn hình; lời đọc dùng tên tiếng Việt (lexicon_vi.IRS.yaml).
symbols:
  # ── chung (bài 0–4, bài 13) ──
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: min_fn,   pattern: '\\min(?![a-zA-Z])', name: "min(a, b): lấy số nhỏ hơn trong hai số", read: "giá trị nhỏ hơn"}
  - {id: lambda,   replaces: lambda, pattern: '\\lambda', name: "hệ số lam-đa: trọng số cân bằng do người làm chọn (bài 7: mức phạt độ lớn vector; bài 11: cân liên quan với khác biệt)", read: "lam-đa"}
  # ── nhánh A (bài 5–8): thêm bên dưới dòng này ──
  # ── nhánh B (bài 9–12): thêm bên dưới dòng này ──
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
