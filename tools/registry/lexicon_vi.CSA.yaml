# Luật đọc PHỦ THÊM cho khoá CSA · Hệ thống máy tính (chạy TRƯỚC luật chung; không đổi văn bản TTS của khoá khác).
# Bằng chứng dò: audit/csa/probes/p1_thuat_ngu.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm 0/8).
rules:
  # mượn từ DMS: probe audit/dms/probes/p1_ten.md — “Đơ Mo-gần” 8/8, đối chứng “Đờ Moóc-tan” 0/8.
  - {pat: 'De Morgan', say: 'Đơ Mo-gần'}
  # p1_thuat_ngu 2026-10-28: “Am-đan” 8/8, “Em-đan” 8/8, thô “Amdahl” 0/8; đối chứng “Am-đam” 2/8 → dùng Am-đan (bài 13).
  - {pat: 'Amdahl', say: 'Am-đan'}
  # p2_hanh_trinh 2026-11-02 (bài L16): Spectre thô 4/8, “Xpéc-tơ” 8/8, “Xờ-péc-tơ” 8/8 (bản chép “Spectre/spectre” cả 8),
  #   đối chứng “Xờ-pếch-ti” 0/8 → “Xờ-péc-tơ” (“Xpéc” không phải âm tiết tiếng Việt, lint chặn). ASR-checked, chưa có tai người.
  - {pat: 'Spectre', say: 'Xờ-péc-tơ'}
  # p2: AMD thô 5/8, “a em đê” 6/8, “ây em đi” 8/8 (bản chép “AMD” 4 lần, “AM đi / A em đi / A.M.D” — khoá chuỗi con lỏng),
  #   đối chứng “a em bê” 0/8 → “ây em đi”: PARTIAL, cần người nghe.
  - {pat: 'AMD', say: 'ây em đi'}
must_not_change: []
# p1_thuat_ngu 2026-10-28 (đọc bản chép ASR, không chỉ điểm khoá):
#   byte: thô → ASR chép “bay” 8/8 lần — cùng âm với cách đọc chuẩn /bai/ (điểm khoá 0/8 chỉ vì khoá là “bai”); đối chứng “bò” 0/8
#     → đọc thô (foreign_ok).
#   bit: thô chép “bích/bit” 4/8, “biết” 4/8; “bít” tương tự. ASR lẫn âm cuối t/ch và nguyên âm i/iê; không cách viết nào phân định được
#     → giữ thô, NOT_VERIFIED bằng tai người. Câu ASR gắn cờ vì “bit” ghi lý do này.
#   GHz: “ghi-ga-héc” 7/8, “gi-ga-héc” 6/8, thô 0/8 → lời đọc nói “tỉ nhịp mỗi giây” (bài 8), không cần luật.
# p2 (bài L16): Intel thô 8/8 (bản chép “Intel” 7, “íntel” 1), “In-teo” 8/8, đối chứng “In-tem” 0/8 → đọc thô (foreign_ok).
#   ARM: thô 0/8 (“ăn/em”), “Am” 0/8, “A-rờ-mờ” 0/8 → KHÔNG đọc; lời đọc nói “nhiều chip trong điện thoại”, chữ ARM chỉ trên màn hình.
foreign_ok: [byte, Intel]
