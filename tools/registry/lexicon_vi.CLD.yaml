# Luật đọc PHỦ THÊM cho khoá CLD · Hệ thống hướng dịch vụ (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò: audit/cld/probes/p1_thuat_ngu.md, p2_ten.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm). Đọc BẢN CHÉP.
#   “microservice”: thô 2/8, “mai-crô-xơ-vít” 2/8 (bản chép “Microsoft”) → KHÔNG đọc; lời đọc nói “vi dịch vụ”.
#   Linux: thô 4/8 (“ly nút”), “Li-nớt” 4/8, “Li-núc” 4/8 → KHÔNG đọc; lời đọc nói “nhân hệ điều hành”, chữ Linux chỉ trên màn hình.
#   Đơn vị: “na-nô giây” (đã dựng và ASR ở CSA), “mi-crô giây” (âm tiết “crô”: lexicon_vi.ESY.yaml, mi-crô-am-pe 8/8).
rules:
  # p1: “Ku-bơ-nét-tít” 7/8 (bản chép “Kubernetes”), “Cu-bơ-nê-tít” 7/8, thô 3/8 (“khu bừng Thét”); đối chứng “Ku-bơ-lét-tít” 4/8
  #   → đối chứng chưa sạch (ASR thiên về từ quen): PARTIAL, cần người nghe xác nhận.
  - {pat: 'Kubernetes', say: 'Ku-bơ-nét-tít'}
  # p1: “xa-ga” 8/8, “sa-ga” 8/8, thô 7/8 (small chép “xe gà” 1 lần); đối chứng “xa-la” 0/8.
  - {pat: 'saga', say: 'xa-ga', ci: true}
  # Đơn vị: cùng luật đã dựng và ASR ở OSY/NET/SDP.
  # p3/p4 (2026-10-31, bài L15): Borg thô 0/8 (bản chép “bốt/bút”), “Boóc-gơ” 2/8, “Bo-rơ-gơ” 3/8, “Bo-gờ” 7/8 (bản chép “bo gờ / bó gờ /
  #   blogger / BOGER”), đối chứng “Bo-lơ” 0/8 → “Bo-gờ”: PARTIAL, bản chép gần âm chứ không ra “Borg”, cần người nghe xác nhận.
  - {pat: 'Borg', say: 'Bo-gờ'}
  # Omega: thô 8/8 ở p3 (cùng kết quả CS112 p1_tiem_can), đối chứng “Ô-mê-na” 0/8 → đọc thô (foreign_ok).
  - {pat: 'MB', say: 'mê-ga-byte'}
  - {pat: 'GB', say: 'ghi-ga-byte'}
must_not_change: []
# cpu: thô 7/8 (“CPU”), “xê pê u” 8/8; đối chứng “xê bê u” 0/8 → đọc thô.
# container: thô 5/8 — medium chép đúng “container” 3/4, small chép “cần tên nơi / cần theo nơi” (đúng âm Việt hoá “công-ten-nơ”);
#   “công-te-nơ”, “công-ten-nơ” cũng 5/8; đối chứng “công-te-lơ” 1/8 → đọc thô, NOT_VERIFIED bằng tai người (như DNS ở NET 5/8).
# pod: thô 5/8 — bản chép “pốt” 5/8, lệch “phút / pút / POOC” (một âm tiết, ASR nghe nhầm nguyên âm); đối chứng “pém” 0/8 → đọc thô, NOT_VERIFIED.
# windows: thô 8/8, “Uyn-đâu” 8/8; đối chứng “Uyn-lâu” 0/8 → đọc thô.
# little: thô 5/8, “Lít-tồ” 5/8 — bản chép “lít tồ / Litto / LITO” (đúng âm, ASR viết khác); “Lít-tơn” 0/8; đối chứng “Lít-xồ” 0/8
#   → đọc thô, NOT_VERIFIED bằng tai người.
# byte, web: probe NET p2 (web thô 8/8) và CSA p1_thuat_ngu (byte → “bay” 8/8). crô: xem trên.
foreign_ok: [crô, byte, web, cpu, container, pod, windows, little, omega]
