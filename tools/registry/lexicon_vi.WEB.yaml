# Luật đọc PHỦ THÊM cho khoá WEB · Ứng dụng web và di động (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò riêng: audit/web/probes/p1_thuat_ngu.md, p2_phim_don_vi.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm).
# Không đọc trong lời (chỉ trên màn hình): Python (CS112: mọi cách ≤ 3/8), TLS (NET: ≤ 3/8), tên thẻ HTML (div, nav, button…), tên thư viện,
#   tên tiêu đề HTTP (Cache-Control, ETag…) — lời đọc mô tả bằng tiếng Việt.
rules:
  # NET p1, p2: HTTP “hát tê tê pê” 8/8, HTML “hát tê em eo” 8/8 (đối chứng 0/8).
  - {pat: 'HTTP', say: 'hát tê tê pê'}
  - {pat: 'HTML', say: 'hát tê em eo'}
  # Đơn vị: cùng luật đã dựng và ASR ở OSY/NET/SDP/CLD/SEC/LLM; KB như OSY (ghép âm tiết Việt).
  - {pat: 'KB', say: 'ki-lô-byte'}
  - {pat: 'MB', say: 'mê-ga-byte'}
  - {pat: 'GB', say: 'ghi-ga-byte'}
  # p1 (audit/web/probes/p1_thuat_ngu.md): API thô 6/8, “ây-pi-ai” 8/8 (bản chép “API”), đối chứng “a-ki-ai” 2/8.
  - {pat: 'API', say: 'ây-pi-ai'}
  # p1: DOM thô 1/8, “đôm” 1/8, “đê ô em” 8/8 (bản chép “DOM”), đối chứng “đôn” 0/8.
  - {pat: 'DOM', say: 'đê ô em'}
  # p1: GET thô 7/8, “gét” 8/8, đối chứng “ghép” 0/8.
  - {pat: 'GET', say: 'gét'}
  # p1: POST thô 0/8, “pốt” 5/8, “pâu-xt” 8/8 (bản chép “post”), đối chứng “pốc” 0/8.
  - {pat: 'POST', say: 'pâu-xt'}
  # Hz: như RBM (“héc”; ASR không tách c/t — NOT_VERIFIED bằng ASR, giữ luật đã dựng).
  - {pat: 'Hz', say: 'héc'}
must_not_change: []
# byte, web: probe NET p2; cookie: probe SEC p1 thô 8/8.
# p2: Enter thô 8/8 (bản chép “Enter”), đối chứng “en-cơ” 0/8 → đọc thô. Tab thô 5/8, “táp” 5/8 (chép “tác”: ASR lẫn âm cuối p/c) → KHÔNG đọc;
#   lời đọc nói “phím chuyển tiêu điểm”. URL: “u rờ lờ” 7/8 (chưa dùng trong lời). SHA: mọi cách ≤ 4/8 → không đọc. Node: “nâu” 7/8, thô 4/8 → không đọc.
# p1: JavaScript thô 8/8 (bản chép “JavaScript” cả 8 lần); đối chứng “Gia-va-xcrát” 5/8 dưới ngưỡng nhưng gần → đọc thô, NOT_VERIFIED bằng tai người.
#   CSS (≤ 5/8), JSON (≤ 4/8), PUT (≤ 4/8), DELETE (≤ 5/8) → KHÔNG đọc; lời đọc nói “phần kiểu dáng”, “phương thức đặt”, “phương thức xoá”.
#   server 8/8 thô (không dùng: lời đọc nói “máy chủ”).
# xt: phần đuôi của cách đọc “pâu-xt” (POST) đã dò 8/8 ở p1.
# p3 (audit/web/probes/p3_hanh_trinh.md, 2026-11-02, bài L15): TCP thô 8/8, UDP thô 8/8 (đối chứng “tê xê ca”, “u đê ca” 0/8) → đọc thô;
#   Internet: probe NET p2 thô 8/8. QUIC thô 0/8, “quých”, “quích” 1/8 → KHÔNG đọc; lời đọc nói “giao thức giao vận mới dựa trên UDP”.
foreign_ok: [byte, web, cookie, enter, javascript, xt, tcp, udp, internet]
