# Sổ ký hiệu PHỦ THÊM cho khoá LLM · Mô hình ngôn ngữ lớn (lv.registry("LLM") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá:
#   - từ tố (token) viết w_1, w_2, …; xác suất có điều kiện P(w_t | w_{1..t-1}) như CS115 bài 13;
#   - σ là hàm sigmoid (CS115 bài 20) khi viết σ(x); không dùng σ cho độ lệch chuẩn trong khoá này;
#   - mã, tên thư viện, số kiểu (fp16) viết trong <code>; lời đọc mô tả bằng tiếng Việt;
#   - dấu < > trong công thức viết \lt, \gt.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: sigm,     replaces: sigma, pattern: '\\sigma', name: "hàm sigmoid σ(x) = 1 / (1 + e mũ âm x): biến số thực thành xác suất", read: "sigmoid"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
