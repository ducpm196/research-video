# Sổ ký hiệu PHỦ THÊM cho khoá HCI · Tương tác người–máy (lv.registry("HCI") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá (mọi bài giữ một kiểu):
#   - thời gian thao tác T (giây hoặc mi li giây), khoảng cách D (điểm ảnh), bề rộng đích W (điểm ảnh), độ khó ID = log_2(D/W + 1);
#   - số lựa chọn n; tỉ lệ phát hiện vấn đề của một người thử \lambda;
#   - dấu < > trong công thức viết \lt, \gt; số thập phân dùng dấu phẩy {,}; mã trong <code>.
#   - tên viết tắt và tên riêng (Fitts, Hick, Hyman, KLM, SUS, WCAG, FCC, Hawaii) chỉ hiện trên màn hình; lời đọc dùng tiếng Việt.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: min_fn,   pattern: '\\min(?![a-zA-Z])', name: "min(a, b): lấy số nhỏ hơn trong hai số", read: "số nhỏ hơn trong"}
  - {id: ceil,     pattern: '\\lceil|\\rceil', name: "làm tròn lên ⌈x⌉: số nguyên nhỏ nhất không nhỏ hơn x", read: "làm tròn lên"}
  - {id: lambda,   replaces: lambda, pattern: '\\lambda', name: "tỉ lệ phát hiện vấn đề của một người thử (từ 0 tới 1)", read: "lam-đa"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
