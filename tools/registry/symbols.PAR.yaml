# Sổ ký hiệu PHỦ THÊM cho khoá PAR · Tính toán song song và GPU (lv.registry("PAR") = symbols.yaml chung + tệp này).
# Mỗi ký hiệu mới: {id, pattern (regex trên LaTeX/HTML), name (nghĩa đọc được), read (cách đọc)}; `replaces: <id>` khi khoá dùng nghĩa khác sổ chung.
# Ghi quy ước chung của khoá ở đây (mã trong <code>, dấu < > viết \lt \gt …) để mọi bài giữ một kiểu.
symbols:
  # ── nhánh A (bài 2–6) ──
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: infty,    unicode: '∞', pattern: '\\infty', name: "vô số lõi (T∞ = thời gian khi có vô số lõi = độ dài đường găng)", read: "tê vô cùng"}
  - {id: ceil,     pattern: '\\lceil|\\rceil', name: "làm tròn lên ⌈x⌉: số nguyên nhỏ nhất không nhỏ hơn x", read: "làm tròn lên"}
  - {id: floor,    pattern: '\\lfloor|\\rfloor', name: "làm tròn xuống ⌊x⌋: số nguyên lớn nhất không vượt x (bỏ phần dư)", read: "làm tròn xuống"}
  # ── nhánh B (bài 7–12): thêm bên dưới dòng này ──
  - {id: min_fn,   pattern: '\\min(?![a-zA-Z])', name: "min(a, b): lấy số nhỏ hơn trong hai số", read: "giá trị nhỏ hơn"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
