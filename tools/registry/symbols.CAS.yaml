# Sổ ký hiệu PHỦ THÊM cho khoá CAS · Tình huống chuyên gia: phân tích sự cố có thật (lv.registry("CAS") = symbols.yaml chung + tệp này).
# Mỗi ký hiệu mới: {id, pattern (regex trên LaTeX/HTML), name (nghĩa đọc được), read (cách đọc)}; `replaces: <id>` khi khoá dùng nghĩa khác sổ chung.
# Ghi quy ước chung của khoá ở đây (mã trong <code>, dấu < > viết \lt \gt …) để mọi bài giữ một kiểu.
symbols: []
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
