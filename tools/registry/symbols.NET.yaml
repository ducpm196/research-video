# Sổ ký hiệu PHỦ THÊM cho khoá NET · Mạng máy tính (lv.registry("NET") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá: đơn vị (B, bit, ms, Mbps) viết chữ thường ngoài công thức; phép nhân giữa hai số dùng ×;
#   địa chỉ IP, chuỗi bit, tên trường gói tin (seq, ack) viết trong <code> hoặc chữ thường, không đặt trong $…$.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: mod,      pattern: '\\bmod|\\pmod|\\mod(?![a-zA-Z])', name: "chia lấy dư", read: "chia lấy dư cho"}
  - {id: min_fn,   pattern: '\\min(?![a-zA-Z])', name: "min: lấy số nhỏ nhất trong các số", read: "số nhỏ nhất trong"}
  - {id: equiv_mod, unicode: '≡', pattern: '\\equiv', name: "đồng dư: hai số có cùng số dư khi chia cho p", read: "đồng dư với"}
  - {id: ceil,     pattern: '\\lceil|\\rceil', name: "làm tròn lên ⌈x⌉: số nguyên nhỏ nhất không nhỏ hơn x", read: "làm tròn lên"}
  - {id: xor,      unicode: '⊕', pattern: '\\oplus', name: "phép XOR (cộng không nhớ theo từng bit)", read: "xo"}
layout_commands: [texttt, small, mathtt, text, textbf, mathbf, mathrm, quad, qquad]
consistency: []
