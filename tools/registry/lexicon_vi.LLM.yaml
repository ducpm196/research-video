# Luật đọc PHỦ THÊM cho khoá LLM · Mô hình ngôn ngữ lớn (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Theo CS115 bài 20, 41 đã dựng: lời đọc dùng tên tiếng Việt — “hàm chuẩn hoá mũ” (softmax: probe chung ≤ 3/8), “cơ chế chú ý”,
#   “từ tố” (token), “vector nhúng”, “độ hỗn loạn” (perplexity), “mã hoá cặp byte” (BPE), “sinh có truy xuất” (RAG), “tinh chỉnh hạng thấp” (LoRA),
#   “lấy mẫu hạt nhân” (top-p), “giữ k từ tố đầu” (top-k). Tên gốc chỉ trên màn hình; không dò vì không đọc trong lời.
#   sigmoid theo luật chung (“xích-moi”, PARTIAL ở sổ chung) — khoá này nói “hàm sigmoid” → dùng lời “hàm biến điểm thành xác suất”.
rules:
  # GB: cùng luật đã dựng và ASR ở OSY/NET/SDP/CLD/SEC. GiB không đọc (chưa dò) — lời đọc nói số byte.
  - {pat: 'GB', say: 'ghi-ga-byte'}
  # p1 (audit/llm/probes/p1_thuat_ngu.md): n-gram thô 0/8 (“nực ram”), “en-gram” 8/8 (bản chép “Engram / ngram / n-gram”), đối chứng “en-gam” 0/8.
  - {pat: 'n-gram', say: 'en-gram'}
  # p2 (2026-11-02, bài L14; audit/llm/probes/p2_hanh_trinh.md): GPT-3 thô 5/8, “Gi-pi-ti 3” 8/8 (bản chép “GPT-3 / GPT 3” cả 8),
  #   “Giê-pê-tê 3” 5/8, đối chứng “Gi-pi-ét 3” 0/8 → “Gi-pi-ti 3”.
  - {pat: 'GPT-3', say: 'Gi-pi-ti 3'}
  # p2: Chinchilla thô 0/8, “Chin-chi-la” 8/8 (bản chép “Chinchilla / chinchila”, một lần “chín chi la”), “Chin-chi-lơ” 6/8,
  #   đối chứng “Chin-chi-na” 0/8 → “Chin-chi-la”.
  - {pat: 'Chinchilla', say: 'Chin-chi-la'}
must_not_change: []
# p1: bigram thô 2/8, “bai-gram” 2/8, “bi-gram” 0/8 (bản chép “Bgram / B-gram”) → KHÔNG đọc; lời đọc nói “mô hình cặp từ”.
# entropy: sổ chung (8/8). byte: probe NET p2. alpha: probe AIF p1 thô 7/8 (bản chép “an pha”).
# p2, KHÔNG đọc — chỉ trên màn hình, lời đọc dùng tên mô tả: Transformer thô 0/8, “Trans-phóc-mơ” 4/8, “Tren-phom-mơ” 5/8, đối chứng
#   “Trans-pót-tơ” 0/8 → “kiến trúc chỉ dùng chú ý”; Gopher thô 6/8, “Gâu-phơ” 5/8, “Gô-phơ” 5/8, đối chứng “Gâu-đơ” 0/8 → “mô hình 280 tỉ tham số”.
# google: mượn probe NET p3 (thô 8/8, đối chứng “Gu-ồng” 0/8), DEN, DSY cùng kết quả → đọc thô.
foreign_ok: [byte, entropy, alpha, google]
