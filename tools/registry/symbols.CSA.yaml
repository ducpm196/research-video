# Sổ ký hiệu PHỦ THÊM cho khoá CSA · Hệ thống máy tính (lv.registry("CSA") = symbols.yaml chung + tệp này).
# Tách riêng để không đổi lint của CS115/CS112/DMS. Quy ước chung của khoá:
#   - cơ số ghi bằng chỉ số dưới: $101111_2$, $2F_{16}$ (ký hiệu `sub`, `sub2` của sổ chung); trong khối mã dùng tiền tố 0b, 0x;
#   - dấu nhân giữa hai số: × (\times, lệnh trình bày); < > trong công thức viết \lt, \gt (giống DMS).
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: shl,      pattern: '\\ll\b|\\gg\b', name: "dịch bit trái / phải", read: "dịch trái"}
  - {id: sin,      pattern: '\\sin\b', name: "sin của góc", read: "sin x"}
  - {id: mod,      pattern: '\\bmod|\\pmod|\\mod(?![a-zA-Z])', name: "chia lấy dư", read: "chia lấy dư cho"}
  # L05: đại số Boole (cùng ý nghĩa và cách viết với DMS bài 0, nhắc lại vì khoá CSA dùng sổ riêng)
  - {id: lnot,     unicode: '¬', pattern: '\\neg|\\lnot', name: "không (phủ định)", read: "không a"}
  - {id: land,     unicode: '∧', pattern: '\\land|\\wedge', name: "và", read: "a và b"}
  - {id: lor,      unicode: '∨', pattern: '\\lor|\\vee', name: "hoặc (bao hàm)", read: "a hoặc b"}
  - {id: xor,      unicode: '⊕', pattern: '\\oplus', name: "hoặc loại trừ", read: "a hoặc loại trừ b"}
layout_commands: [texttt, small, mathtt, text, textbf, mathbf, quad, qquad]
consistency: []
