# Luật đọc PHỦ THÊM cho khoá RLN · Học tăng cường (chạy TRƯỚC luật chung; không đổi văn bản TTS của khoá khác).
# Bằng chứng dò: audit/rln/probes/p1_thuat_ngu.md (checked_at 2026-11-02T19:35:26Z; mỗi cách viết × 4 ngữ cảnh × small + medium,
#   ngưỡng 7/8, đối chứng âm). Đã ĐỌC BẢN CHÉP, không chỉ điểm.
# ĐỌC ĐƯỢC (≥ 7/8, bản chép đúng tên, đối chứng âm không đạt):
#   PPO: thô 5/8, “pi pi âu” 8/8 (bản chép “PPO” cả 8), “pê pê ô” 8/8 (bản chép lẫn “PP ô / pppo”); đối chứng “pi pi ai” 0/8 → “pi pi âu”.
#   UCB: thô 7/8, “diu xi bi” 8/8 (bản chép “UCB” 8, một lần “UC B”), “u xê bê” 7/8; đối chứng “u xê đê” 0/8 → “diu xi bi”.
#   Atari: thô 8/8 (bản chép “Atari” cả 8), “A-ta-ri” 8/8; đối chứng “A-ta-li” 2/8 → đọc thô (foreign_ok).
#   theta: thô 6/8, “tê-ta” 7/8 (bản chép “theta / Teta / tê ta / θ”), “thê-ta” 5/8; đối chứng “bê-ta” 0/8 → “tê-ta”
#     (khớp RBM p2 “tê-ta” 7/8 và CS112 p1_tiem_can 8/8).
# KHÔNG ĐỌC (chỉ hiện trên màn hình; lời đọc dùng tên tiếng Việt):
#   Q-learning: thô 0/8, “Kiu-lơ-ninh” 2/8, “Quy-lơ-ninh” 5/8 → “phương pháp học Q”.
#   SARSA: thô 3/8, “Xa-sa” 0/8; “Xác-xa” 8/8 là ĐIỂM GIẢ (bản chép là hai chữ Việt “xác xa”, không lần nào “SARSA”) → “học theo
#     hành động thật vừa chọn”.
#   epsilon: thô 3/8, “ép-xi-lôn” 3/8, “ép-si-lon” 6/8 (small chép “FCLON”) → dưới ngưỡng: lời đọc nói “xác suất khám phá” (bài 3–6)
#     hoặc “biên cắt” (bài 9); chữ ε chỉ trên màn hình.
#   Monte Carlo: thô 0/8, “Môn-tê Cạc-lô” 4/8, “Mon-tê-các-lô” 4/8 (như AIF p1 ≤ 6/8) → “ước lượng bằng trung bình lượt chơi”.
#   TD: thô 7/8, “tê đê” 7/8, “ti đi” 8/8 nhưng bản chép lẫn “T đi / tì đi / thế đê” → không dùng tên; nói “sai phân thời gian”.
#   DQN: thô 2/8, “đê quy en” 3/8, “đi kiu en” 4/8 → “mạng Q sâu”.
#   REINFORCE: thô 0/8, “Ri-in-pho” 4/8, “Ri-in-phốt” 2/8 → “gradient chính sách cơ bản”.
#   Bradley–Terry: thô 1/8, hai cách viết 0/8 → “mô hình so cặp”.
#   Montezuma: cả ba cách viết 0/8 → “trò khám phá kim tự tháp” / “một trò cần khám phá rất xa”.
rules:
  - {pat: 'theta', say: 'tê-ta', ci: true}
  - {pat: 'PPO', say: 'pi pi âu'}
  - {pat: 'UCB', say: 'diu xi bi'}
must_not_change: []
# byte: probe CSA p1_thuat_ngu (thô → bản chép “bay” 8/8), đã dựng ở CSA/LLM/CLD. robot: probe RBM p1 (thô 7/8; đối chứng khớp giả đã loại
#   bằng bản chép), đã dựng ở RBM/AIF. atari: p1 ở trên.
foreign_ok: [byte, robot, atari]
