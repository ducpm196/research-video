# Sổ ký hiệu PHỦ THÊM cho khoá RLN · Học tăng cường (lv.registry("RLN") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá (theo Sutton & Barto bản 2, 2018, và CS115 bài 39 / AIF bài 12 đã dựng):
#   - trạng thái s, hành động a, phần thưởng r; trạng thái kế tiếp s′ (viết s'); bước thời gian t; lợi nhuận G (G_t khi cần bước);
#   - giá trị trạng thái V(s), giá trị hành động Q(s, a) — luôn nói rõ "theo chính sách nào" bằng lời; giá trị tối ưu viết V^*, Q^*;
#   - chính sách π(a | s): xác suất chọn a khi ở s (KHÔNG phải số pi) → replaces pi;
#   - gam-ma = hệ số chiết khấu (replaces gamma, như AIF); an-pha = tốc độ học (replaces alpha, như CS115 bài 39);
#   - epsilon = một số nhỏ do người chọn: xác suất khám phá (bài 3–6) hoặc biên cắt tỉ số (bài 9) — replaces epsilon;
#   - tê-ta = bộ tham số của chính sách (replaces theta); đen-ta nhỏ = sai số sai phân thời gian; rô = tỉ số xác suất mới/cũ (replaces rho);
#   - sigma = hàm sigmoid σ(x) = 1 / (1 + e mũ âm x) (replaces sigma, như LLM); bê-ta = hệ số phạt độ lệch (replaces beta);
#   - lôgarit tự nhiên chỉ viết \ln; dấu < > trong công thức viết \lt, \gt; dấu nhân viết \cdot.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: disc,     replaces: gamma, pattern: '\\gamma', name: "hệ số chiết khấu gamma: phần thưởng sau k bước được nhân gamma mũ k", read: "gam-ma"}
  - {id: lr,       replaces: alpha, pattern: '\\alpha', name: "tốc độ học alpha: dịch giá trị cũ một phần alpha về phía đích", read: "an-pha"}
  - {id: eps,      replaces: epsilon, pattern: '\\varepsilon|\\epsilon', name: "epsilon: số nhỏ do người chọn (xác suất khám phá, hoặc biên cắt tỉ số)", read: "ép-xi-lôn"}
  - {id: policy,   replaces: pi, pattern: '\\pi(?![a-zA-Z])', name: "chính sách pi: pi(a | s) là xác suất chọn hành động a khi ở trạng thái s", read: "pi"}
  - {id: param,    replaces: theta, pattern: '\\theta', name: "tê-ta: bộ tham số của chính sách", read: "tê-ta"}
  - {id: tderr,    pattern: '\\delta(?![a-zA-Z])', name: "đen-ta nhỏ: sai số sai phân thời gian = đích trừ giá trị cũ", read: "đen-ta"}
  - {id: ratio,    replaces: rho, pattern: '\\rho', name: "rô: tỉ số xác suất của chính sách mới chia chính sách cũ", read: "rô"}
  - {id: sigm,     replaces: sigma, pattern: '\\sigma', name: "hàm sigmoid σ(x) = 1 / (1 + e mũ âm x): biến số thực thành xác suất", read: "sigmoid"}
  - {id: klcoef,   replaces: beta, pattern: '\\beta', name: "bê-ta: hệ số phạt độ lệch so với mô hình gốc", read: "bê-ta"}
  - {id: clipfn,   pattern: '\\operatorname\{clip\}', name: "clip(x, a, b): kẹp x vào khoảng từ a tới b", read: "kẹp x vào khoảng a tới b"}
  - {id: absval,   pattern: '\\lvert|\\rvert', name: "trị tuyệt đối |a|: độ lớn, bỏ dấu", read: "trị tuyệt đối của a"}
  - {id: min_fn,   pattern: '\\min(?![a-zA-Z])', name: "min(a, b): lấy số nhỏ hơn trong hai số", read: "số nhỏ hơn trong"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
