# Sổ ký hiệu PHỦ THÊM cho khoá AGT · AI agent (lv.registry("AGT") = symbols.yaml chung + tệp này).
# Quy ước: xác suất mỗi bước p, số bước n; pass@k, pass^k viết bằng chữ trên màn hình (không dùng ^ trong chữ thường).
#   Mã, tên công cụ, tham số viết trong <code>; dấu < > trong công thức viết \lt, \gt.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: binom,    pattern: '\\binom', name: "tổ hợp chập k của n: số cách chọn k phần tử trong n (DMS bài 10)", read: "tổ hợp chập k của n"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
