# Luật đọc PHỦ THÊM cho khoá ESY · Hệ thống nhúng và thời gian thực (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò: audit/esy/probes/p1_vt.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm). Đọc BẢN CHÉP.
#   KHÔNG đọc trong lời (chỉ trên màn hình): UART (thô 4/8, “u a ẹt tê” 2/8, “iu át” 0/8 → nói “giao tiếp nối tiếp không đồng bộ”),
#   PWM (mọi cách ≤ 1/8 → nói “điều chế độ rộng xung”), ADC (nói “bộ chuyển đổi tương tự số”), baud (nói “bit mỗi giây”),
#   LED (≤ 5/8 → nói “đèn”), UBRR, CMP (nói “hệ số chia”, “giá trị so sánh”), dB (nói “đề-xi-ben”, xem dưới).
rules:
  # p1: “I²C” thô 8/8 là điểm GIẢ — bản chép “IC” cả 8: TTS bỏ mất chữ số mũ “²”. “I hai C” 2/8 theo khoá nhưng bản chép
  #   “I2C / Y2C / E2C / y2c” 7/8 (đọc đúng, ASR viết “y” cho “i”); đối chứng “I ba C” chép “I3C / Y3C” → phân biệt được 2/3.
  #   → đọc “I hai C”; NOT_VERIFIED bằng tai người.
  - {pat: 'I²C', say: 'I hai C'}
  # p1: SPI thô 4/8 (“SPE / FTE / SP”), “ét pê i” 4/8, “ét pi ai” 5/8 (bản chép “SPI” 5, “FBI” 2, “xpa” 1); đối chứng
  #   “ét pê u” 0/8 → dùng “ét pi ai”, dưới ngưỡng nên NOT_VERIFIED bằng tai người.
  - {pat: 'SPI', say: 'ét pi ai'}
  # p2_hanh_trinh 2026-11-02 (bài L15, audit/esy/probes/p2_hanh_trinh.md; đọc BẢN CHÉP): Pathfinder thô 6/8 (“tháp Finder / Puff
  #   Finder”), “Pát-phai-đơ” 7/8, “Pát-phai-nđơ” 7/8; đối chứng “Pát-ti-xơ” 0/8 → “Pát-phai-đơ”. ASR-checked, chưa có tai người.
  - {pat: 'Pathfinder', say: 'Pát-phai-đơ'}
  # p2: Spirit thô 6/8, “Xpi-rít” 0/8, “Xờ-pi-rít” 8/8 (bản chép “Spirit” cả 8); đối chứng “Xờ-pi-nát” 0/8 → “Xờ-pi-rít”.
  - {pat: 'Spirit', say: 'Xờ-pi-rít'}
  # p2: Opportunity thô 0/8, “Óp-po-tiu-ni-ti” 8/8, “Ọp-pơ-chiu-nờ-ti” 4/8; đối chứng “Óp-po-ma-ni-a” 0/8 → “Óp-po-tiu-ni-ti”.
  - {pat: 'Opportunity', say: 'Óp-po-tiu-ni-ti'}
must_not_change: []
# mi-crô-am-pe: p1 8/8 (bản chép “microampe”), đối chứng “mi-crô-mét” 0/8 → âm tiết “crô” đọc đúng.
# mi-li-am-pe: p1 8/8. mê-ga-héc: p1 1/8 theo khoá, bản chép “Mega-H / MegaHect / Megahat” — đọc đúng “mê-ga”, ASR không có
#   từ “héc”; đối chứng “ki-lô-héc” chép “kilo hét” → mê/ki-lô phân biệt được. NOT_VERIFIED phần “héc” (như RBM).
# đề-xi-ben: p1 0/8 theo khoá, bản chép “Deciban / Deciben / DeciBank” — đúng âm, ASR không có từ; đối chứng “đề-xi-mét” chép
#   “decimal / Desimet” → phân biệt được. NOT_VERIFIED bằng tai người.
# byte: mượn probe CSA p1_thuat_ngu (bản chép “bay” 8/8, đối chứng 0/8) như NET, DBS. robot: mượn RBM (foreign_ok).
# p2: flash thô 6/8 (bản chép “flash/Flash” 6, “phá lát”, “phở last”), “phờ-lát” 5/8, “phlát” 6/8; đối chứng “phờ-lan” 0/8 →
#   giữ thô (cao nhất, không cách nào đạt ngưỡng 7/8): PARTIAL, NOT_VERIFIED bằng tai người.
# p2: NASA thô 8/8, “Na-xa” 8/8 nhưng đối chứng “Na-ta” 3/8 (ASR thiên về “NASA”) → phép thử không phân định; bài L15 KHÔNG đọc
#   NASA (nói “cơ quan vũ trụ”), không thêm luật.
foreign_ok: [byte, robot, crô, flash]
