# Sổ ký hiệu PHỦ THÊM cho khoá BCH · Blockchain và sổ cái phân tán (lv.registry("BCH") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá (như DSY, DEN):
#   - mã và mã băm viết trong <code>, KHÔNG đặt trong $…$; lời đọc mô tả bằng tiếng Việt;
#   - dấu < > trong công thức viết \lt, \gt; chia lấy dư viết \bmod (như NET, CSA);
#   - giai thừa k! dùng trong công thức Poisson của Nakamoto (như AIF, DMS).
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: floor,    pattern: '\\lfloor|\\rfloor', name: "làm tròn xuống ⌊x⌋: số nguyên lớn nhất không vượt x", read: "phần nguyên"}
  - {id: mod,      pattern: '\\bmod|\\pmod|\\mod(?![a-zA-Z])', name: "chia lấy dư: a mod n là số dư khi chia a cho n", read: "chia lấy dư cho"}
  - {id: factorial, pattern: '[0-9a-zA-Z\)]!', name: "giai thừa k! = 1·2·…·k", read: "k giai thừa"}
  - {id: equiv_mod, unicode: '≡', pattern: '\\equiv', name: "đồng dư: hai số có cùng số dư khi chia cho n", read: "đồng dư với"}
  - {id: lambda_rate, replaces: lambda, pattern: '\\lambda', name: "λ: số khối kỳ vọng kẻ tấn công đào được (tham số Poisson)", read: "lam-đa"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small, left, right]
