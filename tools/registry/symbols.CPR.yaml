# Sổ ký hiệu PHỦ THÊM cho khoá CPR · Lập trình C và bộ nhớ.
# Quy ước: mã C hiện nguyên văn trong <div class="code"> hoặc <code>; lời đọc giảng hoàn toàn bằng tiếng Việt.
symbols:
- id: cpr_con_tro
  name: con trỏ (biến lưu địa chỉ ô nhớ)
  pattern: (?!)
  term: '\*\w+|con trỏ'
- id: cpr_cap_phat_dong
  name: cấp phát động trên vùng nhớ mở (malloc/calloc/free)
  pattern: (?!)
  term: '\b(malloc|calloc|realloc|free)\b'
- id: cpr_padding
  name: byte đệm căn lề trong cấu trúc (padding)
  pattern: (?!)
  term: '(?i)căn lề|padding'
- id: cpr_ub
  name: hành vi không xác định (UB)
  pattern: (?!)
  term: '(?i)hành vi không xác định'
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
