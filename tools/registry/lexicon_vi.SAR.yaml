# Luật đọc PHỦ THÊM cho khoá SAR · Kiến trúc hệ thống (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò: audit/sar/probes/p1_thuat_ngu.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm). Đọc BẢN CHÉP.
#   Không đọc trong lời: cache (“bộ nhớ đệm”), shard (“mảnh”), ADR (“bản ghi quyết định”), base62 (“cơ số 62”), SPOF (“điểm hỏng đơn”).
rules:
  # p1: “tâu-cần” 8/8 (bản chép “tâu cần / tấu cần”); thô 5/8 (“tu cưng / tô cần”), “tô-cần” 4/8; đối chứng “tô-lần” 0/8.
  - {pat: 'token', say: 'tâu-cần', ci: true}
  # Đơn vị: cùng luật đã dựng và ASR ở OSY/NET/SDP/CLD.
  - {pat: 'MB', say: 'mê-ga-byte'}
  - {pat: 'GB', say: 'ghi-ga-byte'}
  - {pat: 'KB', say: 'ki-lô-byte'}
  # p2 (2026-11-02, bài L13): Twitter thô 6/8 (bản chép “tuyết tơ” 2/8), “Tuýt-tơ” 7/8 (bản chép “Twitter” 7 lần, 1 lần “tuyết tư”),
  #   “Tu-ýt-tơ” 4/8; đối chứng “Tuýt-lơ” 1/8 (bản chép “tuyết lơ”) → “Tuýt-tơ”, đạt ngưỡng 7/8; cần người nghe xác nhận.
  - {pat: 'Twitter', say: 'Tuýt-tơ'}
must_not_change: []
# byte, web, cpu: như lexicon_vi.CLD.yaml (probe NET p2, CSA p1, CLD p1).
# “tê-ra-byte”, “mê-ga-bít”: đã dựng và ASR ở OSY, NET. “ghi-ga-bít”: ghép âm tiết “ghi-ga” (probe CSA) + “bít” — NOT_VERIFIED riêng cụm.
# p2 (bài L13): Ruby thô 8/8 (bản chép “Ruby” cả 8), đối chứng “Ru-mi” 0/8 → đọc thô.
#   Java thô 8/8 (bản chép “Java / gia va”), đối chứng “Gia-la” 0/8 → đọc thô.
#   Scala thô 8/8, đối chứng “Xì-ma-la” 0/8 — bài L13 không đọc tên này (nói “một ngôn ngữ khác chạy trên máy ảo Java”).
# p3 (bài L13), KHÔNG đọc — chỉ trên màn hình: tweet thô 1/8 (bản chép “tuyết”), “tuýt” 0/8, “tu-ít” 0/8, đối chứng “túi” 4/8
#   → lời đọc nói “bài đăng”.
foreign_ok: [byte, web, cpu, ruby, java]
