# Sổ ký hiệu PHỦ THÊM cho khoá SEC · An toàn thông tin (lv.registry("SEC") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá:
#   - mã, tên tệp, chuỗi đầu vào viết trong <div class="code"> hoặc <code>, KHÔNG đặt trong $…$; lời đọc mô tả bằng tiếng Việt;
#   - dấu < > trong công thức viết \lt, \gt (như DMS, DBS, ESY, CLD); ⊕ (XOR) giới thiệu ở bài dùng nó.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: floor,    pattern: '\\lfloor|\\rfloor', name: "làm tròn xuống ⌊x⌋: số nguyên lớn nhất không vượt x", read: "làm tròn xuống"}
  - {id: xor_op,   unicode: '⊕', pattern: '\\oplus', name: "⊕: cộng loại trừ từng bit (XOR)", read: "xor"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
