# Sổ ký hiệu PHỦ THÊM cho khoá TOC · Lý thuyết tính toán (lv.registry("TOC") = symbols.yaml chung + tệp này).
# `replaces: <id>` bỏ mục cùng mẫu của sổ chung vì ở khoá này ký hiệu mang nghĩa KHÁC (lv.registry):
#   \Sigma là bảng chữ cái (không phải ma trận hiệp phương sai), \varepsilon là chuỗi rỗng (không phải số rất nhỏ),
#   ^* là bao đóng sao (không phải điểm tối ưu), \mid ngăn các vế phải của quy tắc (không phải “khi biết”),
#   ⇒ là suy dẫn một bước (khoá này không dùng ⇒ cho “suy ra” để một hình dạng chỉ có một nghĩa — lập luận viết bằng lời).
# Quy ước chung của khoá:
#   - biểu thức chính quy viết trong <code>…</code> theo cú pháp thường gặp: (0|1)*01 — không đặt trong $…$;
#   - 0^{3} trong công thức là CHUỖI ba chữ 0 ghép lại (000), không phải lũy thừa của số — mẫu strpow bắt buộc giải thích;
#   - tên trạng thái q_0, q_1 (chỉ số dưới, `sub` học ở CS115); tập trạng thái viết \{A, B\}.
symbols:
  - {id: alpha,    replaces: Sigma_mat, pattern: '\\Sigma', name: "bảng chữ cái Σ (tập các ký hiệu được dùng)", read: "bảng chữ cái"}
  - {id: sigk,     pattern: '\\Sigma\^\{?[0-9kn]', name: "Σ mũ k: tập mọi chuỗi có độ dài đúng k", read: "các chuỗi độ dài k"}
  - {id: kstar,    replaces: star, pattern: '\^\*|\^\{\*\}', name: "bao đóng sao: ghép 0, 1, 2, … lần (Σ* = mọi chuỗi)", read: "sao"}
  - {id: eps,      replaces: epsilon, unicode: 'ε', pattern: '\\varepsilon|\\epsilon', name: "chuỗi rỗng ε (độ dài 0)", read: "chuỗi rỗng"}
  - {id: strlen,   pattern: '\|(?:[a-z0-9]+|\\varepsilon)\|', name: "độ dài chuỗi |w| (số ký hiệu)", read: "độ dài của w"}
  - {id: strpow,   pattern: '(?<![0-9])[01]\^|[wxyz]\^\{?[a-z0-9]', name: "lũy thừa chuỗi: 0³ = 000, yⁱ = y ghép i lần", read: "0 lặp ba lần"}
  - {id: delta,    unicode: 'δ', pattern: '\\delta', name: "hàm chuyển δ(q, a): ở trạng thái q đọc a thì sang trạng thái nào", read: "đen-ta"}
  - {id: prod,     pattern: '\\to\b|\\rightarrow', name: "quy tắc sinh A → w: được thay biến A bằng chuỗi w", read: "A sinh ra w"}
  - {id: alt,      replaces: given, pattern: '\\mid', name: "dấu | giữa các vế phải: A → u | v là hai quy tắc A → u và A → v", read: "hoặc"}
  - {id: derive,   replaces: implies, unicode: '⇒', pattern: '\\Rightarrow|\\implies', name: "suy dẫn một bước: thay một biến theo một quy tắc", read: "suy dẫn ra"}
  # tập hợp (dạy ở DMS L05) — khai lại vì sổ của khoá chỉ gồm sổ chung + tệp này
  - {id: set,      replaces: set, pattern: '\\\{', name: "ngoặc móc nhọn: tập hợp", read: "tập gồm"}
  - {id: notin,    unicode: '∉', pattern: '\\notin', name: "không thuộc", read: "không thuộc"}
  - {id: subseteq, unicode: '⊆', pattern: '\\subseteq', name: "là tập con của", read: "là tập con của"}
  - {id: cup,      unicode: '∪', pattern: '\\cup\b', name: "hợp", read: "hợp"}
  - {id: emptyset, unicode: '∅', pattern: '\\emptyset|\\varnothing', name: "tập rỗng (ngôn ngữ không có chuỗi nào)", read: "tập rỗng"}
  - {id: card,     pattern: '\|[A-Z](\s*\\c[au]p\s*[A-Z])?\|', name: "số phần tử của tập |A|", read: "số phần tử của A"}
  - {id: prime,    replaces: prime, unicode: '′', pattern: "[a-zA-Z0-9\\}]'|\\\\prime", name: "dấu phẩy trên: q′ là một trạng thái nữa (thường khác q)", read: "q phẩy"}
  - {id: enc,      replaces: dotprod, pattern: '\\langle|\\rangle', name: "mã hoá ⟨M⟩: viết máy M (bảng chuyển) thành một chuỗi", read: "mã của M"}
  - {id: mod,      pattern: '\\bmod|\\pmod|\\mod(?![a-zA-Z])', name: "chia lấy dư", read: "chia lấy dư cho"}
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
layout_commands: [texttt, small, mathtt, text, textbf, mathbf, mathrm, quad, qquad]
consistency:
  - name: "Chuỗi rỗng"
    variants: ['\\varepsilon', '\\epsilon']
    fix: "Dùng một kiểu \\varepsilon cho chuỗi rỗng."
  - name: "Quy tắc sinh"
    variants: ['\\to\b', '\\rightarrow']
    fix: "Dùng một kiểu \\to cho quy tắc sinh."
