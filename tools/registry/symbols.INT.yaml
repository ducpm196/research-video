# Sổ ký hiệu bổ sung cho khoá INT (Phỏng vấn Tích hợp Ngân hàng Toàn diện)
symbols:
  - id: log
    replaces: log
    pattern: '\\log|\\ln'
    name: 'logarit'
    read: 'log'
    base: true
  - id: cdot
    replaces: cdot
    unicode: '·'
    pattern: '\\cdot(?![a-z])'
    name: 'dấu nhân dạng chấm giữa'
    read: 'nhân'
    base: true
  - id: cos
    replaces: cos
    pattern: '\\cos'
    name: 'cos của góc'
    read: 'cos theta'
    base: true
  - id: hat
    replaces: hat
    pattern: '\\hat'
    name: 'dấu mũ'
    read: 'mũ'
    base: true
  - id: mu
    replaces: mu
    pattern: '\\mu|\\boldsymbol{\\mu}'
    name: 'trung bình mu'
    read: 'mu'
    base: true
  - id: norm
    replaces: norm
    unicode: '‖'
    pattern: '\\\\||\\lVert|\\rVert'
    name: 'chuẩn độ dài vector'
    read: 'độ dài của u'
    base: true
  - id: sub
    replaces: sub
    pattern: '[a-zA-Z\\}]_\\{?[0-9a-zA-Z]'
    name: 'chỉ số dưới'
    read: 'x một, x i'
    base: true
  - id: vec
    replaces: vec
    pattern: '\\mathbf\\{[a-z]\\}|\\vec\\{'
    name: 'vector'
    read: 'vector x'
    base: true
