# Sổ ký hiệu bổ sung cho khoá INT (Phỏng vấn Tích hợp Ngân hàng Toàn diện)
symbols:
  - id: log
    replaces: log
    pattern: '\\log|\\ln'
    name: 'logarit'
    read: 'log'
    base: true
  - id: cdot
    replaces: cdot
    unicode: '·'
    pattern: '\\cdot(?![a-z])'
    name: 'dấu nhân dạng chấm giữa'
    read: 'nhân'
    base: true
  - id: cos
    replaces: cos
    pattern: '\\cos'
    name: 'cos của góc'
    read: 'cos theta'
    base: true
  - id: hat
    replaces: hat
    pattern: '\\hat'
    name: 'dấu mũ'
    read: 'mũ'
    base: true
  - id: mu
    replaces: mu
    pattern: '\\mu|\\boldsymbol{\\mu}'
    name: 'trung bình mu'
    read: 'mu'
    base: true
  - id: norm
    replaces: norm
    unicode: '‖'
    pattern: '\\\\||\\lVert|\\rVert'
    name: 'chuẩn độ dài vector'
    read: 'độ dài của u'
    base: true
  - id: sub
    replaces: sub
    pattern: '[a-zA-Z\\}]_\\{?[0-9a-zA-Z]'
    name: 'chỉ số dưới'
    read: 'x một, x i'
    base: true
  - id: vec
    replaces: vec
    pattern: '\\mathbf\\{[a-z]\\}|\\vec\\{'
    name: 'vector'
    read: 'vector x'
    base: true
  # ── Thuật ngữ CHỮ (E52, AF2 WP4 2026-11-14): `term:` áp lên chữ của show + say; `introduces: [id]` ở step giảng, `assumes: [id]` ở bài sau ──
  # Quy ước id: `int_<chữ không dấu>`; mỗi mục thuộc bài đầu tiên giảng nó (INT là một dãy L00→L07, mỗi bài `requires` mọi bài trước).
  # L00
  - id: int_gross
    name: lương gross (lương ghi trong hợp đồng, trước thuế và bảo hiểm)
    term: '(?i)\bgross\b'
  - id: int_luy_dang
    name: lũy đẳng (gửi một lần hay nhiều lần, kết quả vẫn như một lần)
    term: '(?i)lũy đẳng|idempotency|idempotent'
  - id: int_nguyen_tu
    name: nguyên tử (kiểm tra và đặt trong một bước)
    term: '(?i)nguyên tử'
  - id: int_be_ket_noi
    name: bể kết nối (nhóm kết nối cơ sở dữ liệu mở sẵn, dùng lại)
    term: '(?i)bể kết nối'
  - id: int_cong_tich_hop
    name: cổng tích hợp (lớp phần mềm đứng giữa ứng dụng của khách và hệ thống bên trong ngân hàng, nhận rồi chuyển yêu cầu)
    term: '(?i)cổng tích hợp'
  - id: int_chi_muc
    name: chỉ mục (bảng tra phụ của cơ sở dữ liệu, như mục lục sách, để nhảy tới đúng dòng thay vì đọc từng dòng)
    term: '(?i)chỉ mục'
  - id: int_luong
    name: luồng (một dòng công việc chạy riêng trong chương trình; luồng nặng của hệ điều hành, luồng nhẹ/ảo rất ít bộ nhớ)
    term: '(?i)\bluồng (nhẹ|nặng|ảo|hệ điều hành|truyền thống)\b|\bbể luồng\b|\bđa luồng\b'
  # L01
  - id: int_hikari
    name: HikariCP (thư viện bể kết nối của Java)
    term: '\bHikariCP\b'
  - id: int_ofs
    name: OFS (bản tin dạng chữ để ra lệnh cho hệ lõi T24)
    term: '\bOFS\b'
  - id: int_iso8583
    name: ISO 8583 (chuẩn bản tin giao dịch thẻ)
    term: '\bISO 8583\b'
  # L02
  - id: int_lop_vo
    name: lớp vỏ ủy quyền (proxy, đối tượng bọc quanh đối tượng của bạn)
    term: '(?i)lớp vỏ'
  - id: int_bean
    name: bean (đối tượng do Spring tạo và quản lý)
    term: '(?i)\bbeans?\b'
  # L04
  - id: int_hsm
    name: HSM (thiết bị phần cứng chống can thiệp giữ khoá mật mã)
    term: '\bHSM\b'
  - id: int_stan
    name: STAN (số theo dõi 6 chữ số do bên gửi đặt cho mỗi bản tin)
    term: '\bSTAN\b'
  # L04 (fix4 fork B)
  - id: int_hex
    name: hệ mười sáu (hex, mỗi chữ số thay cho bốn bit)
    term: '(?i)hệ mười sáu|\bhex\b'
  # L08 (bài cuối khoá: tín dụng bán lẻ và đối soát cuối ngày)
  - id: int_ltv
    name: LTV (tỉ lệ cho vay trên giá trị tài sản bảo đảm)
    term: '\bLTV\b'
  - id: int_dti
    name: DTI (tỉ lệ tiền trả nợ mỗi tháng trên thu nhập)
    term: '\bDTI\b'
  - id: int_cic
    name: CIC (Trung tâm Thông tin Tín dụng Quốc gia)
    term: '\bCIC\b'
  - id: int_eod
    name: EOD (xử lý cuối ngày)
    term: '\bEOD\b'
