# Sổ ký hiệu PHỦ THÊM cho khoá AIF · Nền tảng trí tuệ nhân tạo (lv.registry("AIF") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá:
#   - A* viết bằng chữ thường (A*) ngoài công thức; trong công thức: f(n) = g(n) + h(n); h* là chi phí thật (viết h^*);
#   - alpha, beta của cắt tỉa viết \alpha, \beta nhưng MANG NGHĨA KHÁC sổ chung (sổ chung: nhân tử KKT, hệ số động lượng) → replaces;
#   - gamma là hệ số chiết khấu của quá trình quyết định Markov (sổ chung: hệ số co giãn chuẩn hoá theo lô) → replaces;
#   - phép toán lôgic theo DMS bài 0–1 (¬ ∧ ∨, kéo theo viết \Rightarrow chỉ khi là luật; ⊨ là kéo theo LÔGIC giữa tri thức và câu);
#   - dấu < > trong công thức viết \lt, \gt.
symbols:
  - {id: absval,   pattern: '\\lvert|\\rvert', name: "trị tuyệt đối |a|: độ lớn, bỏ dấu", read: "trị tuyệt đối của a"}   # AIF L02 (khoảng cách Manhattan)
  - {id: lnot,     unicode: '¬', pattern: '\\neg|\\lnot', name: "phủ định (không)", read: "không p"}
  - {id: land,     unicode: '∧', pattern: '\\land|\\wedge', name: "hội (và)", read: "p và q"}
  - {id: lor,      unicode: '∨', pattern: '\\lor|\\vee', name: "tuyển (hoặc, bao hàm)", read: "p hoặc q"}
  - {id: lto,      pattern: '\\to\b|\\rightarrow', name: "kéo theo (phép toán lôgic, như DMS bài 0)", read: "p kéo theo q"}
  - {id: entails,  unicode: '⊨', pattern: '\\models', name: "kéo theo lôgic: câu đúng ở MỌI mô hình của tri thức", read: "kéo theo lôgic"}
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: factorial, pattern: '[0-9a-zA-Z\)]!', name: "giai thừa n! = 1·2·…·n (DMS bài 9)", read: "n giai thừa"}
  - {id: star,     replaces: star, pattern: '\^\*|\^\{\*\}', name: "dấu sao trên: giá trị thật / tối ưu (h* chi phí thật, C* chi phí tối ưu, b* hệ số nhánh hiệu dụng)", read: "h sao"}
  - {id: ab_alpha, replaces: alpha, pattern: '\\alpha', name: "alpha: giá trị tốt nhất mà người đi MAX chắc chắn có được trên đường đang xét", read: "an-pha"}
  - {id: ab_beta,  replaces: beta, pattern: '\\beta', name: "beta: giá trị tốt nhất (nhỏ nhất) mà người đi MIN chắc chắn có được", read: "bê-ta"}
  - {id: delta_sym, replaces: det, pattern: '\\Delta', name: "Δ: độ chênh (lượng xấu đi của hàm mục tiêu)", read: "đen-ta"}
  - {id: disc,     replaces: gamma, pattern: '\\gamma', name: "hệ số chiết khấu gamma: phần thưởng sau k bước được nhân gamma mũ k", read: "gam-ma"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
