# Sổ ký hiệu PHỦ THÊM cho khoá BNX · Backend ngân hàng mở rộng theo JD (lv.registry("BNX") = symbols.yaml chung + tệp này).
# Mỗi ký hiệu mới: {id, pattern (regex trên LaTeX/HTML), name (nghĩa đọc được), read (cách đọc)}; `replaces: <id chung>` khi khoá dùng nghĩa khác sổ chung.
# Ghi quy ước chung của khoá ở đây (mã trong <code>, dấu < > viết \lt \gt …) để mọi bài giữ một kiểu.
# Mục `term:` (E52, 2026-11-13): thuật ngữ CHỮ phải được giảng tại chỗ (`introduces`) trước khi dùng; bài sau ghi `assumes`.
# Quy ước id: `bnx_<chữ không dấu>`; mỗi mục thuộc bài đầu tiên giảng nó (chú thích ở đầu nhóm).
