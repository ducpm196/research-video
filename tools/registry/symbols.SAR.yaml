# Sổ ký hiệu PHỦ THÊM cho khoá SAR · Kiến trúc hệ thống (lv.registry("SAR") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá:
#   - mã và cấu hình viết trong <div class="code"> hoặc <code>, KHÔNG đặt trong $…$; lời đọc mô tả bằng tiếng Việt;
#   - dấu < > trong công thức viết \lt, \gt (như DMS, DBS, ESY, CLD);
#   - λ, μ, ρ giữ nghĩa hàng đợi như CLD (tốc độ đến, tốc độ phục vụ, mức tải), nếu dùng thì giới thiệu lại trong bài.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: floor,    pattern: '\\lfloor|\\rfloor', name: "làm tròn xuống ⌊x⌋: số nguyên lớn nhất không vượt x", read: "làm tròn xuống"}
  - {id: ceil,     pattern: '\\lceil|\\rceil', name: "làm tròn lên ⌈x⌉: số nguyên nhỏ nhất không nhỏ hơn x", read: "làm tròn lên"}
  - {id: lambda_q, replaces: lambda, unicode: 'λ', pattern: '\\lambda', name: "λ: tốc độ yêu cầu đến (yêu cầu mỗi giây)", read: "lam-đa"}
  - {id: mu_q,     replaces: mu, unicode: 'μ', pattern: '\\mu(?![a-z])', name: "μ: tốc độ phục vụ (yêu cầu mỗi giây)", read: "muy"}
  - {id: rho_q,    replaces: rho, unicode: 'ρ', pattern: '\\rho', name: "ρ = λ/μ: mức tải", read: "rô"}
  - {id: min_fn,   pattern: '\\min(?![a-zA-Z])', name: "min(a, b): lấy số nhỏ hơn trong hai số", read: "giá trị nhỏ hơn"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
