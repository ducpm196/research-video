# Luật đọc PHỦ THÊM cho khoá AGT · AI agent (chạy TRƯỚC luật chung).
# Lời đọc dùng tên tiếng Việt: “tác tử” (agent), “lời nhắc” (prompt), “công cụ” (tool), “từ tố” (token), “vết truy vết” (trace).
#   Tên ReAct, pass@k, pass^k, OWASP chỉ trên màn hình; lời đọc mô tả bằng tiếng Việt.
rules: []
must_not_change: []
# byte, web: probe NET p2 (như lexicon_vi.SEC.yaml).
# p2 (2026-11-02, bài L12 hành trình; audit/agt/probes/p2_hanh_trinh.md, 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm):
#   Wikipedia: thô 8/8 (bản chép “Wikipedia” cả 8), “Uy-ki-pi-đi-a” 8/8, “Wi-ki-pê-đi-a” 0/8; đối chứng “Uy-ki-lê-đi-a” 0/8
#     → đọc thô, thêm vào foreign_ok (bài L12 vẫn nói “bách khoa toàn thư mở”).
#   KHÔNG đọc — chỉ trên màn hình, lời đọc dùng tên mô tả:
#   ReAct: thô 0/8, “Ri-ác” 5/8, “Ri-ác-tơ” 7/8 nhưng là ĐIỂM GIẢ (bản chép “reactor” cả 8 — khoá chuỗi con “react” khớp), đối chứng
#     “Ri-ốp” 0/8 → nói “cách xen kẽ suy nghĩ và hành động”;
#   Toolformer: thô 0/8, “Tun-pho-mơ” 0/8, “Tun phóc-mơ” 0/8, đối chứng 0/8 → nói “mô hình tự học dùng công cụ”;
#   SWE-bench: thô 0/8, “Xuy ben-chờ” 5/8, “Xuy-bếch” 0/8, đối chứng “Xuy phen-chờ” 0/8 → nói “bộ đề sửa lỗi phần mềm thật”.
#   GitHub, Python: theo lexicon_vi.DBS.yaml p2 (≤ 3/8) và lexicon_vi.CS112.yaml (≤ 3/8) — không đọc.
foreign_ok: [byte, web, Wikipedia]
