# Sổ ký hiệu PHỦ THÊM cho khoá OSY · Hệ điều hành (lv.registry("OSY") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá: tên thuật toán viết tắt (FCFS, SJF, LRU…) chỉ hiện trên màn hình, lời đọc dùng tên tiếng Việt mô tả;
#   < > trong công thức viết \lt, \gt; dấu nhân giữa hai số ×; địa chỉ hệ 16 ghi 0x… trong khối mã hoặc \texttt.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: shl,      pattern: '\\ll\b|\\gg\b', name: "dịch bit trái / phải", read: "dịch phải"}
  - {id: mod,      pattern: '\\bmod|\\pmod|\\mod(?![a-zA-Z])', name: "chia lấy dư", read: "chia lấy dư cho"}
layout_commands: [texttt, small, mathtt, text, textbf, mathbf, quad, qquad]
consistency: []
