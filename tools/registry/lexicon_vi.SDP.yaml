# Luật đọc PHỦ THÊM cho khoá SDP · Kỹ thuật lập trình và mẫu thiết kế (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò: audit/sdp/probes/p1_ten.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm). Đọc BẢN CHÉP.
#   KHÔNG đọc trong lời (không cách viết nào đạt 7/8):
#     Liskov — thô 0/8 (“lịch cốc / Lycop”), “Lít-xcốp” 0/8, “Lít-cốp” 0/8 → nói “nguyên lý thay thế”;
#     McCabe — thô 0/8 (“HKB / MKB”), “Mắc-kây-bơ” 0/8, “Mắc-kếp” 1/8 → nói “độ phức tạp vòng”;
#     SOLID — thô 0/8, “xô-lít” 0/8, “sô-lít” 3/8 (“số lít”) → nói “nguyên lý thiết kế”.
#   Tên mẫu tiếng Anh (Factory, Builder, Singleton, Adapter, Decorator, Composite, Strategy, Observer, Command, State, Iterator,
#   Template Method) và tên tác giả (Gamma, Martin, Parnas, Meyer, Fowler) chỉ ghi trên màn hình; lời đọc dùng tên tiếng Việt.
rules:
  # Cùng luật đã kiểm bằng ASR ở khoá NET và OSY (lexicon_vi.NET.yaml, lexicon_vi.OSY.yaml).
  - {pat: 'MB', say: 'mê-ga-byte'}
  # p2 (2026-11-02, bài L17, audit/sdp/probes/p2_hanh_trinh.md): Shopify thô 0/8 (“Shopee / Sophi / SOP”), “Sóp-pi-phai” 8/8 (bản chép
  #   “Shopify” cả 8), “Sốp-pi-phai” 7/8; đối chứng “Sóp-pi-lai” 4/8 theo khoá chấm nhưng bản chép khác khi ĐỌC (“supply /
  #   Shoppealight / Shoppealife”) → dùng “Sóp-pi-phai”; ASR-checked, chưa có tai người.
  - {pat: 'Shopify', say: 'Sóp-pi-phai'}
  # API: cùng luật đã dò ở khoá WEB (audit/web/probes/p1_thuat_ngu.md: thô 6/8, “ây-pi-ai” 8/8, đối chứng “a-ki-ai” 2/8).
  - {pat: 'API', say: 'ây-pi-ai'}
must_not_change: []
# p2 (bài L17): Ruby thô 8/8 (bản chép “Ruby” cả 8), “Ru-bi” 8/8, đối chứng “Ru-mi” 0/8 (“Rumi”) → đọc thô, foreign_ok.
#   Packwerk: thô 0/8 (“phát quốc / Packwood”), “Pác-vớc” 0/8 (“bác vớt”), “Pắc-uốc” 0/8 (“Bắc Quốc”), đối chứng “Pác-lớc” 0/8
#   → KHÔNG đọc: chỉ trên màn hình nguồn, lời đọc nói “công cụ phân tích tĩnh”.
foreign_ok: [byte, Ruby]   # “mê-ga-byte”: ASR xác nhận ở khoá NET, OSY
