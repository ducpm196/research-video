# Luật đọc PHỦ THÊM cho khoá SEC · An toàn thông tin (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò: audit/sec/probes/p1_thuat_ngu.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm). Đọc BẢN CHÉP.
#   Không đọc trong lời: STRIDE, HMAC, TLS (probe NET: mọi cách ≤ 3/8), ECB, SameSite, PBKDF2, RFC — lời đọc mô tả bằng tiếng Việt
#   (“mã xác thực thông điệp”, “giao thức bảo mật của web”, “chế độ mã từng khối độc lập”, “cờ cùng trang”, “hàm băm chậm”).
rules:
  # Đơn vị: cùng luật đã dựng và ASR ở OSY/NET/SDP/CLD.
  - {pat: 'MB', say: 'mê-ga-byte'}
  - {pat: 'GB', say: 'ghi-ga-byte'}
  # L15 (2026-11-02): KB như OSY/WEB (“ki-lô-byte”); HTTP như NET p1 (thô 7/8, “hát tê tê pê” 8/8, đối chứng “hát tê tê ca” 0/8).
  #   Trước khi thêm đã kiểm: không bài SEC cũ nào có KB hay HTTP trong lời đọc → không bài nào đổi văn bản TTS.
  - {pat: 'KB', say: 'ki-lô-byte'}
  - {pat: 'HTTP', say: 'hát tê tê pê'}
must_not_change: []
# p2 (audit/sec/probes/p2_hanh_trinh.md, 2026-11-02, bài L15) → KHÔNG đọc, chỉ hiện trên màn hình:
#   Heartbleed thô 0/8, “Hát-blít” 0/8, “hát bờ líp” 1/8; OpenSSL thô 0/8 (“Opens”), “ô pừn ét ét eo” 6/8, “Ô-pần ét ét eo” 4/8;
#   Let's Encrypt thô 1/8, “Lét en-críp” 2/8; HTTPS thô 5/8, “hát tê tê pê ét” 7/8 nhưng đối chứng “hát tê tê pê ép” 5/8 (ASR tự sửa)
#   → lời đọc nói “HTTP có mã hoá”, “một thư viện mã hoá rất phổ biến”, “một tổ chức cấp chứng chỉ mới”.
# byte, web, cpu: như lexicon_vi.CLD.yaml (probe NET p2, CSA p1, CLD p1).
# cookie: p1 thô 8/8 (bản chép “cookie / cookies”), “cúc-ki” 8/8; đối chứng “cúc-li” 0/8 → đọc thô.
foreign_ok: [byte, web, cpu, cookie]
