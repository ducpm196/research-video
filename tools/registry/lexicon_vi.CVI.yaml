#   ngưỡng 7/8, đối chứng âm). Đã ĐỌC BẢN CHÉP, không chỉ điểm (khoá chấm chuỗi con dễ khớp giả).
# ĐỌC ĐƯỢC (≥ 7/8, bản chép đúng tên, đối chứng âm 0/8):
#   ImageNet: thô 0/8, “I-mịt-nét” 8/8 (bản chép “ImageNet / image net” 6, lặp cách viết 2), “Im-mịt-nét” 7/8; đối chứng “Im-mịt-két” 0/8
#     → luật “I-mịt-nét” (PAR p1 trước đây chỉ thử “Im-mịt-nét”).
#   YOLO: thô 0/8, “Giô-lô” 7/8 (bản chép “YOLO / Yolo” 5, “dô lô / vô lô” 2), “Dô-lô” 6/8; đối chứng “Dô-ma” 0/8 → luật “Giô-lô”
#     (PARTIAL: 2/8 bản chép là chữ Việt — chỉ đọc tên ở 1–2 câu, câu khác nói “mạng nhìn một lần”).
#   Harris: thô 7/8 (bản chép “Harris” 7, “Hadrix” 1); đối chứng “Ha-mít” 0/8 → đọc thô (foreign_ok).
# KHÔNG ĐỌC (chỉ hiện trên màn hình; lời đọc dùng tên tiếng Việt):
#   Sobel: thô 2/8, “Xô-ben” 5/8, “Sô-ben” 2/8 → “bộ lọc tìm cạnh”.
#   Otsu: mọi cách viết 0/8 → “phương pháp chọn ngưỡng tự động”.
#   RANSAC: thô 1/8, “Ren-xắc” 2/8 → “phép đồng thuận mẫu ngẫu nhiên” / “cách bốc thử ngẫu nhiên”.
#   SIFT: thô 6/8 → dưới ngưỡng: “bộ mô tả điểm đặc trưng”.
#   IoU: thô 1/8, “ai âu diu” 4/8 → “giao trên hợp”.
#   Dice: thô 5/8, “Đai-xơ” 5/8 → “hệ số chồng lấp”.
#   Gauss: ≤ 4/8 → “làm mờ hình chuông”.
#   ResNet: ≤ 4/8 → “mạng có lối tắt”, “mạng dư”.
#   PASCAL: thô 6/8; “Pa-xcan” 8/8 là ĐIỂM GIẢ (bản chép “Pascal” chỉ 2, còn lại “PaScan / pascan”) → “bộ dữ liệu thi đấu châu Âu”.
rules:
