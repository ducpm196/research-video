# Sổ ký hiệu phủ thêm cho ACB (lv.registry("ACB") = symbols.yaml chung + tệp này).
# Mục `term:` (E52, 2026-11-13): thuật ngữ CHỮ phải được giảng tại chỗ (`introduces: [id]` ở step giảng nó) trước khi dùng; bài sau trong dãy
# ghi `assumes: [id]` (lv.py curriculum kiểm assumes ⊂ bao đóng tiên quyết). WP4 2026-11-14: thêm cho thuật ngữ then chốt của khoá.
# Dãy học: L00 → (L01, L02) → L03, L04 (cần L00, L01) → L05 (cần L00, L01, L03) → L06, L07, L08 (cần L00, L01, L02).
symbols:
- id: acb_saga
  name: mô hình SAGA (chuỗi bước có bước bù trừ)
  term: '\bSAGA\b'
- id: acb_redis
  name: Redis (kho khoá–giá trị trong bộ nhớ)
  term: '\bRedis\b'
- id: acb_kafka
  name: Kafka (hàng đợi sự kiện)
  term: '\bKafka\b'
- id: acb_hsm
  name: thiết bị HSM (phần cứng giữ khoá mật mã)
  term: '\bHSM\b'
- id: acb_mti
  name: mã loại bản tin MTI
  term: '\bMTI\b'
- id: acb_stan
  name: số vết STAN và số tham chiếu RRN
  term: '\bSTAN\b|\bRRN\b'
- id: acb_mac
  name: mã xác thực bản tin MAC
  term: '\bMAC\b'
- id: acb_hmac
  name: mã xác thực HMAC
  term: '\bHMAC\b'
- id: acb_idem
  name: khoá lũy đẳng
  term: '(?i)lũy đẳng|idempoten'
- id: acb_dedup
  name: khử trùng lặp
  term: '(?i)khử trùng lặp'
- id: acb_deadlock
  name: bế tắc khoá
  term: '(?i)bế tắc khoá|deadlock|ORA-00060'
- id: acb_outbox
  name: mẫu Transactional Outbox (hộp thư giao dịch)
  term: '(?i)outbox|hộp thư giao dịch'
- id: acb_cic
  name: Trung tâm Thông tin tín dụng CIC
  term: '\bCIC\b'
- id: acb_mtls
  name: mTLS (TLS hai chiều)
  term: '\bmTLS\b'
- id: acb_ltv
  name: tỉ lệ cấp vốn LTV
  term: '\bLTV\b'
- id: acb_cdc
  name: bắt thay đổi dữ liệu CDC
  term: '\bCDC\b'
- id: acb_dlq
  name: hàng đợi thư lỗi (Dead Letter Queue)
  term: '(?i)dead letter|hàng đợi thư lỗi|hàng đợi tin lỗi'
- id: acb_webhook
  name: webhook (bên gửi chủ động gọi sang bên nhận)
  term: '(?i)webhook'
- id: acb_liveness
  name: kiểm tra độ sống (Liveness Detection)
  term: '(?i)liveness|độ sống'
- id: acb_p99
  name: độ trễ P99
  term: '\bP99\b'
- id: acb_ofs
  name: bản tin OFS của T24
  term: '\bOFS\b'
- id: acb_mq
  name: IBM MQ (phần mềm hàng đợi tin nhắn)
  term: 'IBM MQ'
# fix4 (2026-11-15): thuật ngữ nền giảng tại chỗ ở L00–L03 (chỉ thêm, không sửa mục cũ)
- id: acb_napas
  name: NAPAS (tổ chức vận hành mạng chuyển tiền giữa các ngân hàng ở Việt Nam)
  term: '\bNAPAS\b'
- id: acb_core
  name: hệ thống lõi / Core Banking (phần mềm giữ sổ cái và số dư của ngân hàng)
  term: '(?i)\bcore\b|hệ thống lõi'
- id: acb_tcp
  name: kết nối TCP (đường truyền hai chiều giữa hai chương trình, dữ liệu đến đủ và đúng thứ tự)
  term: '\bTCP\b'
- id: acb_spring
  name: Spring / Spring Boot (bộ khung Java dựng dịch vụ máy chủ)
  term: '\bSpring\b'
- id: acb_jms
  name: JMS (chuẩn tin nhắn của Java; JMSCorrelationID là mã ghép cặp yêu cầu–trả lời)
  term: '\bJMS'
- id: acb_microservice
  name: microservice / vi dịch vụ (chương trình nhỏ chạy riêng, lo đúng một việc)
  term: '(?i)microservice'
- id: acb_consumer
  name: consumer (chương trình đọc tin ra khỏi hàng đợi)
  term: '(?i)\bconsumer'
- id: acb_byte
  name: byte (đơn vị nhớ nhỏ, đủ chứa một chữ cái)
  term: '(?i)\bbytes?\b'
- id: acb_partition
  name: phân vùng Kafka (một ngăn của chủ đề, giữ một phần sự kiện, mỗi ngăn do một tiến trình đọc)
  term: '(?i)phân vùng|\bpartition'
# fix5 (2026-11-15)
- id: acb_ttl
  name: thời gian sống TTL (khoảng thời gian khoá còn hiệu lực, hết giờ thì tự xoá)
  term: '\bTTL\b'
- id: acb_unique
  name: ràng buộc duy nhất / UNIQUE (luật của cơ sở dữ liệu từ chối ghi dòng thứ hai có cùng mã)
  term: '(?i)ràng buộc (duy nhất|UNIQUE)|\bUNIQUE\b'
