# Luật đọc PHỦ THÊM cho khoá FND · Nền thực hành: dòng lệnh, tệp, dữ liệu, HTTP, SQL, Git (chạy TRƯỚC luật chung).
# Từ đã qua ASR ở khoá khác được chép lại (nguồn ghi bên cạnh); từ dò mới của FND: audit/fnd/probes/f1.md (small + medium, 4 ngữ cảnh, ngưỡng 7/8).
# Từ không đạt 7/8 thì KHÔNG đọc trong lời: tên gốc chỉ hiện trên màn hình, lời đọc dùng tiếng Việt (Git, Python, tên lệnh dài…).
# Mẻ dò f1 (2026-11-13, small + medium, 4 ngữ cảnh, GPU): chỉ HTTP (8/8) và rm (8/8, TTS đọc «rơ mờ») đạt với đối chứng âm 0/8; cd 8/8 nhưng đối chứng âm 6/8 (khoá ngắn
# dễ trùng → không kết luận). Còn lại ≤ 5/8: ls 4/8, cp 4/8, mv 4/8, csv 5/8, grep 3/8, utf-8 4/8, sqlite 2/8, linux 1/8, bash 2/8, curl 1/8, ascii 2/8, pwd 0/8, cat 2/8, echo 2/8.
# LƯU Ý: nhiều ô của mẻ này bị edge-tts trả «không có âm thanh» (ghi trong f1.md) nên điểm thấp một phần do dịch vụ, không hẳn do từ → NOT_VERIFIED, vẫn không đọc.
rules:
- pat: CPU          # lexicon_vi.CS115/BNK: C P U 8/8
  say: C P U
- pat: RAM
  say: Ram
- pat: JDK
  say: J D K
- pat: API
  say: A P I
- pat: SQL          # BNK
  say: ét-cu-l
- pat: JSON         # BNX x1: Giây-sơn 8/8
  say: Giây-sơn
- pat: YAML         # BNX x1: Giam-mồ 8/8
  say: Giam-mồ
- pat: Java         # JVA/BNK: Gia-va (đã ASR ở các khoá đó)
  say: Gia-va
- pat: byte         # JVA/BNK
  say: bai
must_not_change: []
foreign_ok: [http]   # HTTP đọc nguyên: audit/fnd/probes/f1.md, small+medium 8/8 (đối chứng âm 0/8); luật «H T T P» của BNK chỉ 3/8 ở mẻ này
