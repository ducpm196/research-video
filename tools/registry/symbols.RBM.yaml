# Sổ ký hiệu PHỦ THÊM cho khoá RBM · Toán cho robot và hệ động lực (lv.registry("RBM") = symbols.yaml chung + tệp này).
# `replaces: <id>` bỏ mục cùng mẫu của sổ chung vì ở khoá này ký hiệu mang nghĩa KHÁC (lv.registry):
#   H in đậm là ma trận đo của lọc Kalman (không phải Hessian — khoá này không dùng Hessian).
# Quy ước chung của khoá (theo CS115 bài 2, 5, 6, 7):
#   - ma trận chữ hoa in đậm (R, T, J, A, F, P); vectơ chữ thường in đậm; chuyển vị ^T; nhân hai số: ·; nhân ma trận viết sát;
#   - góc theo độ trên màn hình (30^\circ), radian chỉ khi tính đạo hàm hay sin của số thực; góc θ với chỉ số (θ_1, θ_x);
#   - bước thời gian là h (như CS115 bài 6) — KHÔNG viết Δt vì \Delta trong sổ chung là định thức;
#   - đạo hàm theo thời gian viết x' (dấu phẩy trên, CS115 bài 6), không dùng dấu chấm trên;
#   - không dùng α, β, γ, φ (sổ chung gán nghĩa khác) — góc Euler viết θ_x, θ_y, θ_z.
symbols:
  - {id: sin,      pattern: '\\sin', name: "sin của góc", read: "sin"}
  - {id: deg,      pattern: '\^\\circ|\^\{\\circ\}', name: "độ (đơn vị góc): 360° là một vòng", read: "độ"}
  - {id: atan2,    pattern: '\\operatorname\{atan2\}', name: "atan2(y, x): góc của điểm (x, y), đúng cả bốn góc phần tư", read: "a-tan 2 của y và x"}
  - {id: arctan,   pattern: '\\arctan', name: "arctan: góc có tan bằng số đã cho, chỉ trong khoảng −90° đến 90°", read: "a-tan"}
  - {id: absval,   pattern: '\\lvert|\\rvert', name: "trị tuyệt đối |a| (độ lớn, cả với số phức)", read: "trị tuyệt đối của a"}
  - {id: re_part,  pattern: '\\operatorname\{Re\}', name: "phần thực của số phức", read: "phần thực"}
  - {id: hmeas,    replaces: hessian, pattern: '\\mathbf\{H\}', name: "ma trận đo H: chọn phần trạng thái mà cảm biến đo được", read: "ma trận đo H"}
  - {id: frame2,   replaces: sub2, pattern: '[a-zA-Z\}\)]_\{[0-9a-zA-Z]{2}\}', name: "hai chỉ số dưới: cặp khung T_{WB} (đổi từ khung B sang khung W), hoặc tổng hai góc s_{12} = sin(θ₁ + θ₂)", read: "T từ B sang W"}
  - {id: thetavec, replaces: theta_b, pattern: '\\boldsymbol\{\\theta\}', name: "vector góc khớp θ = (θ₁, θ₂)ᵀ (θ′: tốc độ khớp)", read: "vector góc khớp"}
layout_commands: [text, textbf, mathbf, mathrm, quad, qquad, small, circ, boldsymbol]
consistency:
  - name: "Đơn vị góc"
    variants: ['\^\\circ', '\^\{\\circ\}']
    fix: "Viết độ một kiểu: ^\\circ."
