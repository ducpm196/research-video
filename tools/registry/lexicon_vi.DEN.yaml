# Luật đọc PHỦ THÊM cho khoá DEN · Kỹ thuật dữ liệu (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Theo DSY (audit/dsy/probes/p1_ten.md): Bloom, MapReduce KHÔNG đọc — lời nói “bộ lọc nhiều hàm băm”, “ánh xạ rồi rút gọn”.
# Tên sản phẩm (MongoDB, Cassandra, Kafka, Parquet, Neo4j, Elasticsearch, Flink, Spark) và tên kỹ thuật viết tắt (LSM, OLTP, OLAP, TF-IDF, BM25,
#   CDC, SCD) chỉ trên màn hình; lời đọc dùng tên tiếng Việt: “cây gộp theo nhật ký”, “tải giao dịch”, “tải phân tích”, “công thức xếp hạng”,
#   “thu thập thay đổi”, “chiều thay đổi chậm”. TB không đọc (chưa dò) — lời đọc nói “1000 GB”.
rules:
  # MB, GB: cùng luật đã dựng và ASR ở NET (p2: “mê-ga-byte” 8/8), OSY, SDP, CLD, SEC, LLM.
  - {pat: 'MiB', say: 'mê-ga-byte'}
  - {pat: 'MB', say: 'mê-ga-byte'}
  - {pat: 'GB', say: 'ghi-ga-byte'}
must_not_change: []
# byte: probe NET p2 (như DSY, DBS, ESY, SWF). web: probe NET p2_tu_ngoai (thô 8/8), như CLD, CLC, AGT.
# p1_hanh_trinh (2026-11-02, bài L14; audit/den/probes/p1_hanh_trinh.md, 4 ngữ cảnh × small + medium, ngưỡng 7/8):
#   Google: thô 8/8, “Gu-gồ” 8/8, “Gu-gơn” 8/8; đối chứng “Gu-đơn” 1/8 → đọc thô (foreign_ok).
#   Spark: thô 8/8, “Xờ-pác” 8/8, “Sờ-pác” 8/8, đối chứng “Xờ-lác” 0/8 → đọc thô được, nhưng bài L14 vẫn nói “hệ tính toán trong bộ nhớ”
#     (chưa thêm vào foreign_ok vì lời đọc không dùng).
#   Hadoop: thô 5/8, “Ha-đúp” 2/8, “Hơ-đúp” 0/8, đối chứng “Ha-lúp” 0/8 → dưới ngưỡng, KHÔNG đọc: nói “bản mã nguồn mở của ánh xạ rồi rút gọn”.
foreign_ok: [byte, web, google]
