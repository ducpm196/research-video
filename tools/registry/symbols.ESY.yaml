# Sổ ký hiệu PHỦ THÊM cho khoá ESY · Hệ thống nhúng và thời gian thực (lv.registry("ESY") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá:
#   - mã C (thao tác bit, thanh ghi) viết trong <div class="code"> hoặc <code>, KHÔNG đặt trong $…$; lời đọc mô tả bằng tiếng Việt;
#   - tác vụ đặt tên A, B, C; tác vụ i có thời gian chạy C_i, chu kỳ T_i (hạn = chu kỳ), thời gian đáp ứng R_i (chỉ số dưới, CS115);
#   - đơn vị viết bằng chữ ngoài công thức (ms, MHz, mA); số thập phân dấu phẩy kiểu Việt;
#   - dấu < > trong công thức viết \lt, \gt (như DMS, DBS).
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: ceil,     pattern: '\\lceil|\\rceil', name: "làm tròn lên ⌈x⌉: số nguyên nhỏ nhất không bé hơn x", read: "làm tròn lên"}
  - {id: floor,    pattern: '\\lfloor|\\rfloor', name: "làm tròn xuống ⌊x⌋: số nguyên lớn nhất không vượt x", read: "làm tròn xuống"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
