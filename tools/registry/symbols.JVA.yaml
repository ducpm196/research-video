# Sổ ký hiệu PHỦ THÊM cho khoá JVA · Lập trình Java từ con số 0 (lv.registry("JVA") = symbols.yaml chung + tệp này).
# Mỗi ký hiệu mới: {id, pattern (regex trên LaTeX/HTML), name (nghĩa đọc được), read (cách đọc)}; `replaces: <id>` khi khoá dùng nghĩa khác sổ chung.
# Ghi quy ước chung của khoá ở đây (mã trong <code>, dấu < > viết \lt \gt …) để mọi bài giữ một kiểu.
# Mục `term:` (E52, 2026-11-13): thuật ngữ CHỮ phải được giảng tại chỗ (`introduces`) trước khi dùng; bài sau ghi `assumes`.
symbols:
- id: jva_import
  name: dòng nhập (import)
  term: '(?i)\bimport\b'
- id: jva_new
  name: từ khoá tạo mới (new)
  term: '\bnew\b'
- id: jva_throws
  name: khai báo ném ngoại lệ (throws)
  term: '\bthrows\b'
- id: jva_hashmap
  name: bản đồ HashMap
  term: '\bHashMap\b'
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
