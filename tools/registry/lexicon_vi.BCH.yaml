# Luật đọc PHỦ THÊM cho khoá BCH · Blockchain và sổ cái phân tán (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò: audit/bch/probes/p1_thuat_ngu.md. Lời đọc dùng “chuỗi khối” (blockchain), “mã băm” (hash), “số dùng một lần” (nonce),
#   “đơn vị tính toán” (gas). SHA-256: probe WEB p2 mọi cách ≤ 4/8 → lời đọc nói “hàm băm hai trăm năm mươi sáu bit”.
rules:
  # p1 (audit/bch/probes/p1_thuat_ngu.md): Merkle thô 0/8 (“Maker / marker”), “Mơ-cồ” 7/8 (bản chép “mưa cổ / Merkle / mơ cô”), đối chứng “Mơ-tồ” 0/8.
  - {pat: 'Merkle', say: 'Mơ-cồ'}
  - {pat: 'MB', say: 'mê-ga-byte'}
must_not_change: []
# byte: probe NET p2. p1: Nakamoto thô 8/8 (bản chép “Nakamoto”), đối chứng “Na-ka-mô-cô” 3/8 → đọc thô.
#   blockchain (mọi cách 2/8, chép “blog trên”), Bitcoin (≤ 4/8) → KHÔNG đọc: lời đọc “chuỗi khối”, “đồng tiền số đầu tiên”.
#   Ethereum 8/8 nhưng đối chứng “ê-thê-ri-an” 7/8; gas 8/8 nhưng đối chứng “gan” 7/8 → ASR không phân định, KHÔNG đọc: “đơn vị tính toán”, “đồng tiền gốc của chuỗi”.
# p2 (2026-11-02, bài L12 hành trình; audit/bch/probes/p2_hanh_trinh.md), KHÔNG đọc — chỉ trên màn hình, lời đọc dùng tên Việt mô tả:
#   SegWit: thô 0/8, “Xét-uýt” 0/8, “Xéc-quít” 0/8, đối chứng “Xét-út” 0/8 → nói “nhân chứng tách riêng”, “tách chữ ký”.
#   BIP: thô 5/8, “bíp” 7/8 (bản chép là chữ Việt “bíp”, không phải tên), “bi ai pi” 4/8, đối chứng “bóp” 0/8 → nói “đề xuất cải tiến số 141”.
#   Merge (The Merge): thô 0/8 (“mát / Mac”), “Mơ-giơ” 3/8 (“mơ dơ / mơ giờ”), “Mớt” 1/8, đối chứng “Mơ-bơ” 0/8 → nói “Hợp nhất”.
#   Ethereum, Bitcoin, ETH, TWh: theo p1 không đọc → “chuỗi hợp đồng thông minh”, “đồng tiền số đầu tiên”, “tỉ số điện” (1 số điện = 1 kWh).
#   Không thêm luật mới cho bài L12: mọi từ ngoại còn lại trong lời đọc (Nakamoto, Merkle, byte, MB) đã có bằng chứng ở p1 / luật cũ.
foreign_ok: [byte, nakamoto]
