# Sổ ký hiệu PHỦ THÊM cho khoá CVI · Thị giác máy tính (lv.registry("CVI") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá (giữ như CS115 bài 34 và ROB bài 11 đã dựng):
#   - ảnh I, chỉ số [hàng, cột] = (v, u) khi nói toạ độ điểm ảnh: u = cột đếm từ trái, v = hàng đếm từ trên, góc trên trái (0, 0);
#   - bộ lọc (kernel) K kích thước k × k; “tích chập” của thư viện = tương quan chéo (không lật), viết \star; tích chập toán học viết \ast;
#   - camera: tiêu cự f (điểm ảnh), tâm ảnh (c_x, c_y), ma trận nội \mathbf{K} (chữ K in đậm) — KHÁC bộ lọc K thường; X, Y, Z mét;
#   - hai camera: khoảng cách B (mét), chênh lệch d (điểm ảnh), Z = f·B / d;
#   - hộp (x1, y1, x2, y2) toạ độ liên tục; IoU, Dice, AP viết \text{IoU}… (chữ thường trong công thức, đọc bằng lời Việt);
#   - dấu < > trong công thức viết \lt, \gt; dấu nhân viết \cdot; kích thước ảnh “1920 × 1080” trong chữ thường là kích thước, không phải phép nhân.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
  - {id: min_fn,   pattern: '\\min(?![a-zA-Z])', name: "min(a, b): lấy số nhỏ hơn trong hai số", read: "số nhỏ hơn trong"}
  - {id: absval,   pattern: '\\lvert|\\rvert', name: "trị tuyệt đối |a|: độ lớn, bỏ dấu", read: "trị tuyệt đối của a"}
  - {id: ceil,     pattern: '\\lceil|\\rceil', name: "làm tròn lên ⌈x⌉: số nguyên nhỏ nhất không nhỏ hơn x", read: "làm tròn lên"}
  - {id: floor,    pattern: '\\lfloor|\\rfloor', name: "làm tròn xuống ⌊x⌋: số nguyên lớn nhất không lớn hơn x", read: "làm tròn xuống"}
  - {id: xcorr,    pattern: '\\star(?![a-zA-Z])', name: "tương quan chéo I ⋆ K: trượt bộ lọc, nhân từng ô, cộng lại (không lật)", read: "tương quan chéo"}
  - {id: conv,     pattern: '\\ast(?![a-zA-Z])', name: "tích chập I ∗ K: như tương quan chéo nhưng lật bộ lọc 180 độ trước", read: "tích chập"}
  - {id: cup,      pattern: '\\cup\b', name: "hợp: phần thuộc A hoặc B", read: "hợp"}
  - {id: setcard,  pattern: '\\#', name: "dấu thăng #: số phần tử (đếm)", read: "số"}
  - {id: tan_fn,   pattern: '\\tan(?![a-zA-Z])', name: "tang của góc: cạnh đối chia cạnh kề trong tam giác vuông", read: "tang"}
  - {id: smalldelta, pattern: '\\delta(?![a-zA-Z])', name: "đen-ta nhỏ δ: một lượng thay đổi nhỏ (δd: sai lệch của chênh lệch; δZ: sai lệch độ sâu kéo theo)", read: "sai lệch nhỏ của"}
  # ── nhánh A (bài 4–7) thêm ký hiệu NGAY TRÊN dòng này ──
  # ── nhánh B (bài 8–11) thêm ký hiệu NGAY TRÊN dòng này ──
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
