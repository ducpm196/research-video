# Luật đọc PHỦ THÊM cho khoá DVO · DevOps (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò: audit/dvo/probes/p1_ten.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm). Đọc BẢN CHÉP.
#   Không đọc trong lời: commit, merge, pipeline, canary, DORA, MTBF, MTTR — lời đọc dùng “lần ghi thay đổi”, “hợp nhất”, “đường ống”,
#   “phát hành thử”, “bốn chỉ số giao hàng”, “thời gian trung bình giữa hai lần hỏng”, “thời gian trung bình để khôi phục”.
#   Git: thô 0/8 (“ghét / gích”), “ghít” 2/8, “gít” 2/8 → KHÔNG đọc; lời đọc nói “kho mã”.
rules:
  # Đơn vị: cùng luật đã dựng và ASR ở OSY/NET/SDP/CLD.
  - {pat: 'MB', say: 'mê-ga-byte'}
  - {pat: 'GB', say: 'ghi-ga-byte'}
  # p2 (2026-11-02, bài L13): DORA thô 1/8, “Đo-ra” 8/8 (bản chép “Dora” cả 8), “Đô-ra” 5/8; đối chứng “Cô-ra” 0/8 → “Đo-ra”.
  #   Bài L13 vẫn không đọc DORA (lời đọc: “nhóm nghiên cứu”, “báo cáo Hiện trạng DevOps”); luật để dành, không bài nào đổi văn bản TTS.
  - {pat: 'DORA', say: 'Đo-ra'}
must_not_change: []
# web: probe NET p2 (thô 8/8, đối chứng “oen” 0/8). cpu: probe CLD p1 (thô 7/8, đối chứng 0/8).
# devops: thô 6/8 (bản chép “DevOps” 6 lần, small lệch “devolve” 1 lần), “Đép-ốp” 6/8, “Đép-óp” 5/8; đối chứng “Đép-ót” 1/8
#   → đọc thô, dưới ngưỡng 7/8 một điểm: NOT_VERIFIED bằng tai người.
foreign_ok: [byte, web, cpu, devops]
# p2 (bài L13), KHÔNG đọc — chỉ trên màn hình / trong source:
#   Puppet: thô 2/8, “Páp-pợt” 1/8, “Pắp-pít” 1/8, đối chứng “Pắp-lít” 0/8 → không nhắc tên công ty trong lời đọc;
#   Goodhart: thô 0/8, “Gút-hát” 0/8, “Gút-hác” 0/8, đối chứng 0/8 → lời đọc nói “một định luật kinh tế” và nêu nội dung luật.
