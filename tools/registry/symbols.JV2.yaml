# Sổ ký hiệu PHỦ THÊM cho khoá JV2 · Java trung cấp (lv.registry("JV2") = symbols.yaml chung + tệp này).
# Mỗi ký hiệu mới: {id, pattern (regex trên LaTeX/HTML), name (nghĩa đọc được), read (cách đọc)}; `replaces: <id>` khi khoá dùng nghĩa khác sổ chung.
# Ghi quy ước chung của khoá ở đây (mã trong <code>, dấu < > viết \lt \gt …) để mọi bài giữ một kiểu.
symbols:
# Mục `term:` (E52, 2026-11-13): thuật ngữ CHỮ giảng tại chỗ (`introduces`) trước khi dùng; bài sau ghi `assumes`. Sửa ở nguồn audit/jv2/src (bước gán introduces cuối build()).
- {id: jv2_protected, name: "mức truy cập protected", term: '(?i)\bprotected\b'}
- {id: jv2_default_pkg, name: "gói mặc định (không khai báo gói)", term: '(?i)gói mặc định'}
- {id: jv2_eff_final, name: "effectively final (biến chỉ gán một lần)", term: '(?i)effectively final'}
- {id: jv2_javap, name: "javap (in nội dung tệp lớp)", term: '(?i)\bjavap\b'}
- {id: jv2_class_wild, name: "Class<?> (mô tả của một lớp nào đó)", term: 'Class&lt;\?&gt;|Class<\?>'}
- {id: jv2_barrier, name: "hàng rào CyclicBarrier", term: '(?i)CyclicBarrier|hàng rào'}
- {id: jv2_deadlock_tool, name: "findDeadlockedThreads (công cụ đếm luồng bế tắc)", term: 'findDeadlockedThreads'}
- {id: jv2_handler, name: "nơi nhận nhật ký (Handler)", term: '(?<![.\w])Handler\b|(?i:nơi nhận)'}
- {id: jv2_supplier, name: "Supplier (hàm không nhận gì, trả giá trị)", term: '\bSupplier\b'}
- {id: jv2_pan, name: "PAN (số thẻ)", term: '\bPAN\b'}
- {id: jv2_log2, name: "log₂ n (lôgarit cơ số hai: số lần nhân đôi từ 1 để tới n)", term: '(?i)lôgarit|logarit|log₂|\blog2\b'}
- {id: jv2_sort_flags, name: "cờ của lệnh sort (-t, -k, n, r)", term: '-k2,2|-k3,3nr'}
- {id: jv2_ctor_ref, name: "TreeMap::new (tham chiếu hàm tạo) và tham số giữa của groupingBy", term: 'TreeMap::new'}
- {id: jv2_utc, name: "UTC và hậu tố Z (giờ quốc tế)", term: '\bUTC\b|\d{2}:\d{2}:\d{2}Z'}
- {id: jv2_iso_dur, name: "ký hiệu khoảng thời gian PT23H / P3M", term: '\bPT?\d+[HM]\b'}
- {id: jv2_iana, name: "tên múi giờ IANA (Asia/Ho_Chi_Minh)", term: 'Asia/Ho_Chi_Minh|America/New_York|\bIANA\b'}
- {id: jv2_consumer, name: "Consumer (hàm nhận một giá trị, không trả gì)", term: '\bConsumer\b'}
- {id: jv2_bound_ref, name: "ds::add / t::them (tham chiếu hàm gắn với đối tượng)", term: '\bds::add|\bt::them'}
- {id: jv2_static_init, name: "khối static { } (khởi tạo tĩnh)", term: 'static\s*\{'}
- {id: jv2_fmt02d, name: "%02d (định dạng số rộng 2 chữ số, đệm số 0)", term: '%02d'}
- {id: jv2_tail, name: "tail -n +2 (in từ dòng thứ 2)", term: 'tail -n \+2'}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
consistency: []
