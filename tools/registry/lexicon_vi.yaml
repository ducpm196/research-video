# Từ điển phát âm — CHỈ áp dụng cho văn bản gửi TTS, phụ đề giữ nguyên chữ gốc.
# Mỗi luật: pat (regex), say (cách đọc), ci (true = không phân biệt hoa thường; mặc định false).
# Engine TỰ BỌC ranh giới từ Unicode: luật chỉ khớp NGUYÊN TỪ.
#   Bài học (lỗi thật ở L01 v1): luật 'AI' chạy không phân biệt hoa thường và không ranh giới
#   đã biến "hai" → "hây ai", "sai" → "sây ai" ở 32 câu.
# Thứ tự quan trọng: luật dài/cụ thể đặt trước.
rules:
  - {pat: 'Gram-Schmidt', say: 'Gram Smít'}
  # KKT (L24, L25): đọc từng chữ “ca ca tê”; ASR small + medium đều chép lại đúng “KKT” (out/L24/asr_report.md, 2026-10-25)
  - {pat: 'KKT', say: 'ca ca tê'}
  # Tên riêng (L26, L28, L29, L36, L39): trước đây phiên âm gõ thẳng vào say → phụ đề hiện phiên âm (lint E28). Cách đọc giữ NGUYÊN
  #   như bản đã dựng (tts_digest không đổi); ASR từng bài ở out/<id>/asr_report.md
  - {pat: 'AdaBoost', say: 'A-đa-bút'}
  - {pat: 'Gini', say: 'Gi-ni'}
  - {pat: 'Laplacian', say: 'Láp-la-xi-an'}
  - {pat: 'Markov', say: 'Mác-cốp'}
  - {pat: 'Fisher', say: 'Phi-sơ'}
  - {pat: 'vectors?', say: 'véc tơ', ci: true}
  - {pat: 'Euclid(ean)?', say: 'Ơ-clít'}
  - {pat: 'Manhattan', say: 'Man-hát-tần'}
  - {pat: 'dot product', say: 'đót prô-đắc', ci: true}
  - {pat: 'projection', say: 'prô-giéc-sần', ci: true}
  - {pat: 'proj', say: 'prô-giéc'}
  - {pat: 'logic', say: 'lô-gíc', ci: true}
  # “lambda”: đối chứng L04 2026-10-23 — audio “lambda” và “lam đa” dài bằng nhau (3,264 s); “lam-đa” → small nghe “Lam Đa”.
  - {pat: 'lambda', say: 'lam-đa', ci: true}
  # “nabla”: đối chứng L05 2026-10-23 (l05_probe.py) — đọc thô ra “náp-la” (medium: “nắp la”, y hệt bản viết “náp-la”);
  #   viết “na-bla” thì small và medium đều nghe “Nabla”.
  - {pat: 'nabla', say: 'na-bla', ci: true}
  # “Hessian”: L06 2026-10-24 (scratchpad h_probe.py + h_probe2.py, 4 ngữ cảnh × small + medium, 13 cách viết):
  #   cách cũ “Hét-xi-ần” bị medium nghe “hết xương” 3/4 — trùng đối chứng âm “Hét-xương”; bản thô “Hessian” và
  #   “Hét-xi-an” cho bản chép y hệt nhau (“hết xe ăn”, “hét xiang”). “Hết-sen” là cách viết duy nhất được cả hai mô
  #   hình chép đúng nguyên văn 8/8, đối chứng âm “Hết-sương” không bị nghe thành “sen”. ASR không phân biệt e/ê ở đây
  #   (“Hét-sen” cũng được chép “hết sen”) → độ tự nhiên cần người nghe (NOT_VERIFIED bằng tai).
  - {pat: 'Hessian', say: 'Hết-sen'}
  # “Jacobian”: L05 2026-10-23 (scratchpad jh_probe.py, 3 ngữ cảnh): “Gia-cô-bi-ần” và “Gia-cô-biên” cho audio lệch ≤ 72 ms,
  #   small + medium chép cả hai là “Gia Cô Biên”/“da cô biên” → dùng cách viết ASR kiểm được; đối chứng âm
  #   “Gia-cô-bi-nhỏ” bị nghe ra khác.
  - {pat: 'Jacobian', say: 'Gia-cô-biên'}
  # “gradient”: L05 2026-10-23 (scratchpad grad_probe.py, 3 ngữ cảnh × small + medium): “gờ-ra-đi-ần” bị medium nghe
  #   “gửi ra điền”, “G ra đường” ở 2/3 câu; “grê-đi-ần” được CẢ HAI mô hình nghe “Gradient” 6/6; đối chứng âm
  #   “gửi ra điền” viết hẳn thì vẫn bị nghe ra đúng như thế.
  - {pat: 'gradient', say: 'grê-đi-ần', ci: true}
  # “Descent”: đọc thô và “đi-xen” cho audio lệch 24 ms, medium nghe cả hai là “Descent” (L05 2026-10-23).
  - {pat: 'Descent', say: 'đi-xen', ci: true}
  # L09 2026-10-24 (scratchpad l09_probe.py: mỗi cách viết × 3 ngữ cảnh × small + medium, chấm bỏ dấu, ngưỡng 5/6, có đối chứng âm):
  #   “eta” thô 1/6 (nghe “y ta”, “ITA”); “ê-ta” 6/6; đối chứng “ê-va” 0/6.
  - {pat: 'eta', say: 'ê-ta', ci: true}
  #   “beta” thô 6/6, “bê-ta” 6/6; đối chứng “bê-la” 0/6 → dùng cách đọc Việt.
  - {pat: 'beta', say: 'bê-ta', ci: true}
  #   “SGD” thô 0/6 — cả hai mô hình nghe “đô la Singapore”; “ét-giê-đê” 5/6; đối chứng “ét gờ bê” 0/6.
  - {pat: 'SGD', say: 'ét-giê-đê'}
  #   “Adam” thô 6/6, “A-đam” 6/6; đối chứng “A-năm” 0/6.
  - {pat: 'Adam', say: 'A-đam'}
  #   “Momentum”: thô 6/6, “mô-men-tum” 6/6 nhưng đối chứng “mô-men-tôm” CŨNG 6/6 → ASR tự sửa về “momentum”, phép thử
  #   KHÔNG phân biệt được. Chọn cách viết Việt hoá; độ đúng: NOT_VERIFIED, cần người nghe (REVIEW_L09.md).
  - {pat: 'Momentum', say: 'mô-men-tum', ci: true}
  #   “epsilon” (l09_probe.py + l09_probe2.py, 6 cách viết): thô 0/6 (nghe “FC lân”); tốt nhất “ép-xi-lôn” 4/6 < ngưỡng 5/6.
  #   medium chép đúng “epsilon” ở MỌI cách viết (15/15 lượt), small luôn chép “ép xi” thành “FC”; đối chứng “ép-xi-măng”
  #   0/6 → giọng đọc nhiều khả năng đúng, small nghe nhầm (INFERRED). Nút thắt B27 còn mở: cần người nghe.
  - {pat: 'epsilon', say: 'ép-xi-lôn', ci: true}
  # L10 2026-10-24 (scratchpad l10_probe.py + l10_probe2.py, 3 ngữ cảnh × small + medium, ngưỡng 5/6, đối chứng âm 0/6 cả 4 từ):
  #   “Nesterov”: thô 0/6 (“Nestle Vault”); “Nê-xtê-rốp” 0/6 (“nơi xe trốt”); “Nê-sờ-tê-rốp” 5/6 → CLOSED.
  - {pat: 'Nesterov', say: 'Nê-sờ-tê-rốp'}
  #   “Adadelta”: thô 0/6 (“AdaData”); “A-đa-đen-ta” 4/6; “A-đa-đeo-ta” 5/6 → CLOSED.
  - {pat: 'Adadelta', say: 'A-đa-đeo-ta'}
  #   “Adagrad”: thô 0/6 (“A đắt gác”); tốt nhất “A-đa-grát” chặt 1/6, tiền tố “adagra…” 5/6 (nghe “Adagrack”, “Adagrak”:
  #   chỉ lệch phụ âm cuối) → OPEN, cần người nghe. Lời đọc L10 chỉ nói tên 3 lần, còn lại gọi “cách cộng dồn”.
  - {pat: 'Adagrad', say: 'A-đa-grát'}
  #   “RMSprop”: thô 0/6 (“mơ pop”); tốt nhất “a-rờ em ét prốp” 2/6 → OPEN, cần người nghe. Lời đọc L10 chỉ nói tên ở 3 câu,
  #   còn lại gọi “cách trung bình trượt”.
  - {pat: 'RMSprop', say: 'a-rờ em ét prốp'}
  # L11 2026-10-24 (scratchpad l11_probe.py, 3 ngữ cảnh × small + medium): “Newton” thô 2/6; “Niu-tơn” 3/6 — medium chép
  #   đúng “Newton” 3/3 ở mọi cách viết, small chép theo âm Việt “nêu tân”; đối chứng “Niu-xơn” 0/6. “Niu-tơn” là cách viết
  #   phiên âm dùng trong tài liệu phổ thông (INFERRED, 1 nguồn web). B34: PARTIAL — cần người nghe.
  - {pat: 'Newton', say: 'Niu-tơn'}
  # L12 2026-10-25 (scratchpad l12_probe.py, 4 ngữ cảnh × small + medium; L00 log_probe.py): small 0/4 với mọi cách viết
  #   (chép “logo trích”, “logatic”); “lôgarit” (chính tả SGK Toán 11, CITED hoatieu.vn/loigiaihay.com 2026-10-25): medium
  #   chép đúng 3/4; lô-ga-dít 0/8, lốc-ga-rít 0/8, Logarithm 0/8; đối chứng “lô-ga-ních” 0/8. B20: PARTIAL — cần người nghe.
  - {pat: 'logarit', say: 'lôgarit'}
  - {pat: 'Logarit', say: 'Lôgarit'}
  # L13 2026-10-25 (scratchpad l13_probe.py + l13_probe2.py, 4 ngữ cảnh × small + medium, ngưỡng 7/8):
  #   “Bernoulli”: thô 0/8 (“Becnulli”, “Badnuly”); Béc-nu-li 0/8; Bec-nu-li 1/8; “Bơ-nu-li” 8/8 (cả hai mô hình chép đúng
  #   “Bernoulli”); đối chứng “Béc-nu-ti” 0/8 → B42 CLOSED (ASR-checked).
  - {pat: 'Bernoulli', say: 'Bơ-nu-li'}
  #   “Bayes”: thô 2/8, Bay-ét 3/8, Bây-ét 3/8 (lỗi ở phụ âm cuối: “bay ếch”, “bay ép”, “bay x”); Bây-dơ 0/8 (= “bây giờ”, trùng
  #   đối chứng âm); Bai-ét, Bay-ết, Bay-dét, Bầy-ét 0/8; “Bay-ẹt” 6/8 nhưng thanh nặng không phải cách đọc thường gặp (INFERRED);
  #   đối chứng “Bay-ếch” 0/8. Chọn “Bay-ét” (cách đọc tự nhiên); B41 PARTIAL — xem ASR toàn bài L13, cần người nghe.
  - {pat: 'Bayes', say: 'Bay-ét'}
  # L20 2026-10-25 (scratchpad l20_probe.py, 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm 0/8 cả 4 từ):
  #   “logistic”: thô 3/8 (“lobby stick”), lô-gít-tích 2/8, lô-dít-tích 0/8; “lô-gi-xtích” 8/8 → B46 CLOSED (ASR-checked).
