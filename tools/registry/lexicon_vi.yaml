  - {pat: 'Lagrange', say: 'La-gơ-răng'}
  - {pat: 'Sigma', say: 'xích ma'}
  - {pat: 'PCA', say: 'pê xê a'}
  - {pat: 'SVD', say: 'ét vê đê'}
  - {pat: 'AI', say: 'ây ai'}
