  #   “sigmoid”: thô 0/8 (“SIGOI”), xích-ma-ít 0/8, xíc-mô-ít 4/8; “xích-moi” 6/8 < ngưỡng → B43 PARTIAL, cần người nghe.
  - {pat: 'sigmoid', say: 'xích-moi', ci: true}
  #   “softmax”: thô 1/8, xóp-mắc 1/8, xốp-mắc 0/8; tốt nhất “sóp-mác” 3/8 (lỗi: “sóc mắt/sóc mác”) → B44 OPEN: lời đọc ưu tiên
  #   “hàm chuẩn hoá mũ”, tên chỉ hiện trên màn hình; cần người nghe.
  - {pat: 'softmax', say: 'sóp-mác', ci: true}
  #   “entropy”: thô 8/8, en-trô-pi 8/8, entrôpi 8/8; đối chứng “en-trô-ni” 0/8 (“Anthony”) → B45 CLOSED, đọc nguyên văn (foreign_ok).
  # L23 2026-10-25 (scratchpad l23_probe.py): “ReLU”: thô 6/8, Rê-lu 5/8, Rây-lu 4/8, “Re-lu” 8/8 — NHƯNG khoá chấm “relu” cũng khớp
  #   “re lưu” (bỏ dấu) nên điểm có thể cao hơn thực tế; đối chứng “Rê-mu” 0/8 → B47 PARTIAL, cần người nghe.
  - {pat: 'ReLU', say: 'Re-lu'}
  #   “Xavier”: thô 0/8 (“Savi”), Gia-vi-ê 2/8, Da-vi-ê 3/8, “Xa-vi-ê” 6/8; đối chứng “Xa-vi-a” 1/8 (khoá chấm hơi lỏng) → B48 PARTIAL.
  - {pat: 'Xavier', say: 'Xa-vi-ê'}
  # L24 2026-10-25 (scratchpad l24_probe.py): “Lagrange” thô 1/8, La-grăng 2/8, La-răng 0/8, “La-gơ-răng” 3/8; đối chứng “La-bàng” 0/8
