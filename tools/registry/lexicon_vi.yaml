  - {pat: 'w', say: 'vê kép'}

# Từ tiếng Việt TUYỆT ĐỐI không được bị luật nào thay đổi (lint tự kiểm mỗi lần chạy).
must_not_change: [hai, sai, mai, tai, ai, hay, bài, cái, phải, vai, lại, này, ngoài, trai, chai, nai, dài, ngày, tay, máy, thay, quay, vậy, đây, proje]

# Từ không theo cấu trúc âm tiết tiếng Việt nhưng giọng đọc đã được nghe/ASR xác nhận đọc ổn.
# Từ lạ khác trong `say` sẽ bị lint cảnh báo để người soạn thêm luật đọc hoặc thêm vào đây sau khi nghe.
# Đã xác nhận bằng ASR (faster-whisper small) ngày 2026-10-22, xem out/_probe & báo cáo phiên:
#   'Gram Smít' → nghe 'Gram Smith'; 'prô-giéc' → 'Project'; 'prô-giéc-sần' → 'Projection'; 'video' → 'video'.
# 'bla' (của “na-bla”): small + medium nghe “Nabla”/“NABLA”, L05 2026-10-23.
# 'grê' (của “grê-đi-ần”): small + medium nghe “Gradient” 6/6 câu, L05 2026-10-23.
# 'grát', 'prốp' (của “A-đa-grát”, “a-rờ em ét prốp”): cách viết tốt nhất tìm được nhưng CHƯA đạt ngưỡng ASR (l10_probe2.py,
#   1/6 và 2/6) — cho qua lint để dùng, nút thắt B33 vẫn OPEN, cần người nghe (REVIEW_L10.md).
# parabol: L11 ASR 2026-10-24 — 7 câu, cả small lẫn medium chép “parabon”/“para-bôn”/“parabola” (đúng âm Việt pa-ra-bôn)
# lôgarit: L12 ASR toàn bài 2026-10-25 — 39 câu, small chép “logarit/logarith” 32/39, medium 33/39, cả hai sai 6/39 (“logatrix”) (B20 PARTIAL)
# entropy: l20_probe.py 8/8 đọc nguyên văn (B45). xtích: của “lô-gi-xtích” (l20_probe.py 8/8, B46).
# elip: L15 ASR toàn bài 2026-10-25 — mọi câu có “elip” small/medium chép “elip/elipse/ellipse/elit” (đúng âm e-líp; bí danh ASR
#   elipse/ellipse); câu “elit” đã ghi asr_reviewed.
foreign_ok: [gram, smít, prô, video, bla, grê, grát, prốp, parabol, lôgarit, entropy, xtích, elip]
