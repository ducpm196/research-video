# Luật đọc PHỦ THÊM cho khoá DMS · Toán rời rạc (lv.lexicon("DMS") = các luật ở đây, chạy TRƯỚC luật chung lexicon_vi.yaml).
# Tách riêng để không đổi văn bản gửi TTS của 74 video CS115/CS112 đã dựng.
# Mọi luật có bằng chứng dò ASR: audit/dms/probes/<tên>.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8,
# đối chứng âm phải 0/8). Cách viết chưa đạt ngưỡng → không nói tên đó trong lời đọc.
rules:
  # p1_ten 2026-10-27T14:53Z, chấm lại từ bản chép (khoá thêm “morgan”, “mogan”): “Đơ Mo-gần” 8/8, “Đờ Moóc-gan” 6/8,
  #   thô “De Morgan” 4/8; đối chứng “Đờ Moóc-tan” 0/8. (Khoá hẹp ban đầu cho 6/8: 2 lần “tên Đơ” bị chép “tên đơn” nhưng
  #   phần tên vẫn đúng.) → dùng Đơ Mo-gần.
  - {pat: 'De Morgan', say: 'Đơ Mo-gần'}
  # p1_ten: “Phéc-ma” 8/8, “Phec-ma” 8/8 khi khoá chấm nhận “phét ma” (ASR không phân biệt âm cuối c/t), thô “Fermat” 1/8
  #   (chép “format”, “firmware”); đối chứng “Phéc-na” 0/8 → dùng Phéc-ma. Bài L14.
  - {pat: 'Fermat', say: 'Phéc-ma'}
  # p1_ten: “Ơ-le” 8/8, “Ơ-lơ” 6/8, thô “Euler” 0/8; đối chứng “Ơ-me” 0/8 → dùng Ơ-le. Bài L16–L17.
  - {pat: 'Euler', say: 'Ơ-le'}
  # p1_ten: “Kê-li” 8/8, thô “Cayley” 7/8; đối chứng “Kê-mi” 0/8 → dùng Kê-li. Bài L18.
  - {pat: 'Cayley', say: 'Kê-li'}
  # p6_sha 2026-11-02 (bài L20; p5 bị trùng tên tệp âm thanh “sha” nên bỏ, ghi chú ở p5_bam.md): SHA-1 thô 0/8 (“xa 1”),
  #   “ét hát a một” 6/8, “ét-hát-a một” 7/8 (bản chép “SHA-1 / SHA 1 / S.H.A một”); đối chứng “ét hát e một” 0/8 (“SHE1”)
  #   → dùng “ét-hát-a một” (đạt ngưỡng 7/8; vẫn cần người nghe xác nhận).
  - {pat: 'SHA-1', say: 'ét-hát-a một'}
must_not_change: []
# Đọc thô đạt ngưỡng: “Pascal” thô 7/8 (p1_ten), đối chứng “Pát-xcam” 2/8 → foreign_ok.
# p2_chu_p 2026-10-27T14:57Z: chữ cái “p” (tên mệnh đề) thô 7/8, “pê” 6/8, “pờ” 5/8; đối chứng “tê” 0/8 → giữ thô, KHÔNG thêm luật.
#   Lần trượt: “cột p” → “cột tê” (sau âm cuối t) — ASR lẫn p/t, không phải TTS đọc sai; câu gắn cờ kiểu này ghi asr_reviewed.
# NOT_VERIFIED (không nói trong lời đọc, chỉ hiện trên màn hình): “RSA” mọi cách viết ≤ 5/8 — lời đọc nói “hệ mã khoá công khai”.
#   “Python”, “all”, “any” (xem lexicon_vi.CS112.yaml: Python ≤ 3/8) — lời đọc nói “một số ngôn ngữ lập trình”, “hàm đầu tiên”.
# p3_tu_ngoai 2026-10-27T15:04Z: “domino” thô/“đô-mi-nô” 8/8 nhưng đối chứng “đô-mi-lô” 4/8 (ASR tự sửa về “domino”) → phép thử
#   không phân định, NOT_VERIFIED: lời đọc nói “hàng quân cờ dựng đứng”, chữ domino chỉ trên màn hình (L04).
#   “Hasse”: thô 0/8, “Ha-xơ” 0/8, “Hát-xơ” 5/8 → không nói tên; lời đọc “biểu đồ thứ tự” (L08).
# p4_ten_2 2026-10-27T15:41Z (mọi cách viết dưới ngưỡng 7/8, đối chứng 0/8) → KHÔNG nói tên, chỉ hiện trên màn hình:
#   Bézout ≤ 2/8 (L13: “cặp hệ số biểu diễn ước chung”), Königsberg ≤ 1/8 (L16: “một thành phố châu Âu”),
#   Hamilton ≤ 6/8 (L16: “đường đi qua mọi đỉnh”), Carmichael ≤ 6/8 (L14: “số giả nguyên tố”).
#   SHA-256 ≤ 6/8 (“ét-hát-a hai trăm năm mươi sáu” 6/8, “ét hát a hai năm sáu” 5/8, thô 0/8), SHA-3 ≤ 4/8, SHA-2 ≤ 4/8; đối chứng 0/8
#   → KHÔNG đọc tên: lời đọc L20 nói “hàm băm 256 bit”, “họ hàm băm thứ hai”, “hàm (băm) chuẩn thứ ba”; tên chỉ trên màn hình.
# p5_bam 2026-11-02: MD5 thô 8/8 (medium chép “MD5”, small “em đi năm”), “em đê năm” 8/8; đối chứng “em bê năm” 0/8 (“MB5”) → đọc thô
#   (foreign_ok “md”, token lint của “MD5”). byte: mượn probe CSA p1_thuat_ngu (bản chép “bay” 8/8, đối chứng 0/8) như NET, DBS.
foreign_ok: [pascal, md, byte]
