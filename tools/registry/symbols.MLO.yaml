# Sổ ký hiệu PHỦ THÊM cho khoá MLO · MLOps (lv.registry("MLO") = symbols.yaml chung + tệp này).
# Quy ước chung của khoá:
#   - mã, tên tệp, kiểu số (int8, float32) viết trong <code>, KHÔNG đặt trong $…$; lời đọc mô tả bằng tiếng Việt;
#   - dấu < > trong công thức viết \lt, \gt (như DMS, DBS, ESY, CLD, DVO);
#   - ln là logarit tự nhiên (dạy ở CS115), dùng trong chỉ số ổn định quần thể.
symbols:
  - {id: ltgt,     base: true, pattern: '\\lt\b|\\gt\b', name: "nhỏ hơn / lớn hơn", read: "nhỏ hơn"}
layout_commands: [text, textbf, mathbf, mathrm, mathtt, texttt, quad, qquad, small]
