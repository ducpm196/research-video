# Sổ đăng ký ký hiệu toán học dùng cho bước lint "ký hiệu phải được giải thích trước khi dùng".
# - pattern: regex Python áp lên mã LaTeX của từng đoạn toán trong `show`.
# - base: true  -> kiến thức phổ thông, không bắt buộc giải thích.
# - read: cách đọc thành lời tiếng Việt (dùng khi viết `say`).
# Thêm ký hiệu mới vào đây khi bài giảng mới dùng ký hiệu chưa có.
symbols:
  # ── nền tảng phổ thông ──
  - {id: arith,   base: true, pattern: '[-+=<>]|\\times', name: "phép tính số học", read: "cộng, trừ, nhân, bằng"}
  # Dấu chấm giữa · KHÔNG phải kiến thức mặc định của người mất gốc (dễ nhầm với dấu thập phân / tích vô hướng).
  - {id: cdot,      unicode: '·', pattern: '\\cdot(?![a-z])', name: "dấu nhân dạng chấm giữa", read: "nhân"}
  - {id: frac,    base: true, pattern: '\\frac|\\dfrac', name: "phân số", read: "a trên b"}
  - {id: power,   base: true, pattern: '\^\{?[0-9]', name: "lũy thừa", read: "a mũ hai"}
  - {id: neq,     base: true, pattern: '\\neq|\\ne\b', name: "khác", read: "khác"}
  - {id: approx,  base: true, pattern: '\\approx', name: "xấp xỉ", read: "xấp xỉ"}
  - {id: geq,     base: true, pattern: '\\geq?\b|\\leq?\b', name: "lớn hơn hoặc bằng / nhỏ hơn hoặc bằng", read: "lớn hơn hoặc bằng"}
  - {id: sqrt,    base: true, pattern: '\\sqrt', name: "căn bậc hai", read: "căn của"}
  - {id: pm,      base: true, pattern: '\\pm', name: "cộng trừ", read: "cộng trừ"}
  - {id: pi,      base: true, pattern: '\\pi(?![a-zA-Z])', name: "số pi ≈ 3,14", read: "pi"}
  # ── đại số tuyến tính ──
  - {id: vec,       pattern: '\\mathbf\{[a-z]\}|\\vec\{', name: "vector (chữ thường in đậm)", read: "vector x"}
  - {id: mat,       pattern: '\\mathbf\{[A-Z]\}', name: "ma trận (chữ hoa in đậm)", read: "ma trận A"}
  # Kích thước M × N viết bằng macro \sz{M}{N} (katex_macros.json), KHÔNG gõ \times: dấu × ở đây là “M hàng, N cột”,
  # không phải phép nhân hai số (phép nhân dùng ·, xem consistency). Macro riêng giúp lint phân biệt hai nghĩa.
  - {id: dim,       pattern: '\\sz\{', name: "kích thước ma trận M × N (M hàng, N cột)", read: "M nhân N"}
  - {id: sub2,      pattern: '[a-zA-Z\}\)]_\{[0-9a-zA-Z]{2}\}', name: "hai chỉ số dưới (hàng i, cột j)", read: "a một hai: hàng 1, cột 2"}
  - {id: zero_vec,  pattern: '\\mathbf\{0\}', name: "vector không", read: "vector không"}
  # Ngoặc móc nhọn \{ \} gom vector thành một bộ (tập hợp) — dùng từ L03 (cơ sở {x₁, x₂}).
  - {id: set,       pattern: '\\\{', name: "ngoặc móc nhọn: một bộ (tập hợp) vector", read: "bộ x một, x hai"}
  - {id: sub,       pattern: '[a-zA-Z\}]_\{?[0-9a-zA-Z]', name: "chỉ số dưới (thành phần thứ i)", read: "x một, x i"}
  - {id: reals,     unicode: 'ℝ', pattern: '\\mathbb\{R\}', name: "tập số thực R, không gian R^D", read: "R, R mũ D"}
  - {id: in,        unicode: '∈', pattern: '\\in\b', name: "thuộc", read: "thuộc"}
  - {id: transpose, pattern: '\^\{?T\}?(?![a-zA-Z])|\^\\top', name: "chuyển vị", read: "chuyển vị"}
  - {id: dots,      pattern: '\\dots|\\ldots|\\cdots|\\vdots', name: "dấu ba chấm (cứ thế tiếp tục)", read: "và cứ thế tiếp tục"}
  - {id: sum,       unicode: 'Σ∑', pattern: '\\sum', name: "dấu tổng Sigma", read: "tổng khi i chạy từ 1 đến D"}
  - {id: norm,      unicode: '‖', pattern: '\\\||\\lVert|\\rVert', name: "chuẩn / độ dài vector", read: "độ dài của u"}
  - {id: dotprod,   pattern: '\\langle|\\rangle', name: "tích vô hướng (dạng ngoặc nhọn)", read: "tích vô hướng của y và u"}
  - {id: proj,      pattern: 'proj', name: "phép chiếu", read: "hình chiếu của y lên u"}
  - {id: perp,      unicode: '⊥', pattern: '\\perp', name: "vuông góc", read: "vuông góc với"}
  - {id: cos,       pattern: '\\cos', name: "cos của góc", read: "cos theta"}
  - {id: theta,     pattern: '\\theta', name: "góc theta", read: "theta"}
  - {id: implies,   unicode: '⇒', pattern: '\\implies|\\Rightarrow', name: "suy ra", read: "suy ra"}
  - {id: iff,       unicode: '⇔', pattern: '\\iff|\\Leftrightarrow', name: "tương đương", read: "khi và chỉ khi"}
  - {id: identity,  pattern: '\\mathbf\{I\}', name: "ma trận đơn vị", read: "ma trận đơn vị"}
  # Bài 3 (hệ phương trình): ma trận mở rộng có vạch đứng ngăn vế phải; hạng viết bằng chữ tiếng Anh “rank” (đọc “hạng”).
  - {id: aug,       pattern: '\\begin\{array\}\{[^}]*\|', name: "ma trận mở rộng [A | b] (vạch đứng ngăn vế trái, vế phải)", read: "ma trận mở rộng"}
  - {id: rank,      pattern: '\\operatorname\{rank\}', name: "hạng của ma trận", read: "hạng của A"}
  - {id: inverse,   pattern: '\^\{-1\}', name: "nghịch đảo", read: "nghịch đảo"}
  # ── giải tích / tối ưu ──
  - {id: partial,   unicode: '∂', pattern: '\\partial', name: "đạo hàm riêng", read: "đạo hàm riêng của f theo x"}
  - {id: nabla,     unicode: '∇', pattern: '\\nabla', name: "gradient (nabla)", read: "gradient của f"}
  # L17: \operatorname{arg\,max} (có khoảng trắng \,) cũng phải khớp — trước đây lọt qua lint vì `operatorname` là lệnh trình bày
  # L22: hàm lấy số lớn hơn (cổng max) và mũi tên gán (thay giá trị cũ bằng giá trị mới, như bước cập nhật của gradient descent)
  - {id: max_fn,    pattern: '\\max(?![a-zA-Z])', name: "max: lấy số lớn hơn", read: "số lớn hơn trong hai số"}
  - {id: assign,    unicode: '←', pattern: '\\leftarrow', name: "mũi tên gán: thay bằng giá trị mới", read: "thay bằng"}
  # L23: hàm kích hoạt và tham số co giãn của chuẩn hoá theo lô
  - {id: relu,      pattern: '\\operatorname\{ReLU\}', name: "hàm kích hoạt ReLU = max(0, z)", read: "rê-lu của z"}
  - {id: tanh,      pattern: '\\tanh', name: "hàm tanh (tang hyperbolic), giá trị trong (−1; 1)", read: "tanh của z"}
  - {id: gamma,     pattern: '\\gamma', name: "hệ số co giãn gamma (chuẩn hoá theo lô)", read: "gam-ma"}
  # L24: hàm Lagrange (chữ L uốn cong) và nhân tử an-pha cho ràng buộc bất đẳng thức (cùng chữ với SVM bài 25)
  - {id: lagr,      pattern: '\\mathcal\{L\}', name: "hàm Lagrange (chữ L uốn cong)", read: "hàm La-grăng"}
  - {id: alpha,     pattern: '\\alpha', name: "nhân tử an-pha (ràng buộc bất đẳng thức)", read: "an-pha"}
  # L26: tỉ số Fisher J(w)
  - {id: fisher_J,  pattern: '(?<![a-zA-Z\\])J\(\\mathbf', name: "tỉ số Fisher J(w)", read: "J của w"}
  # L27: khoảng cách L1, L2 viết d₁(x, z), d₂(x, z)
  - {id: dist,      pattern: '(?<![a-zA-Z\\])d_\{?[12]\}?\(', name: "khoảng cách L1 / L2", read: "khoảng cách L một / L hai"}
  # L29: ma trận Laplacian L = D − W (chữ L in đậm)
  - {id: laplacian, pattern: '\\mathbf\{L\}', name: "ma trận Laplacian L = D − W", read: "ma trận La-pla-xi-an"}
  # L31: nhân từng phần tử (tích Hadamard)
  - {id: hadamard,  unicode: '⊙', pattern: '\\odot', name: "nhân từng phần tử", read: "nhân từng phần tử với"}
  # L32: xác suất láng giềng của t-SNE và độ lệch KL
  - {id: p_cond,    pattern: 'p_\{j\s*\\mid', name: "xác suất i chọn j làm láng giềng", read: "p của j khi biết i"}
  - {id: q_ij,      pattern: 'q_\{ij\}', name: "độ giống của i và j trên mặt phẳng", read: "q i j"}
  - {id: kl,        pattern: '\\operatorname\{KL\}', name: "độ lệch KL giữa hai phân phối", read: "độ lệch KL"}
  # L36: hàm lấy dấu
  - {id: sign_fn,   pattern: '\\operatorname\{sign\}', name: "hàm lấy dấu (+1 nếu dương, −1 nếu âm)", read: "dấu của"}
  # L43: gạch ngang trên — tên một đại lượng gộp (ᾱ = tích các 1 − β)
  - {id: bar,       pattern: '\\bar\{', name: "gạch ngang trên (đại lượng gộp)", read: "an-pha ngang"}
  - {id: argmin,    pattern: '\\arg\\?(min|max)|arg\\,(min|max)|argmin|argmax', name: "arg min / arg max", read: "giá trị x làm f nhỏ nhất"}
  - {id: eta,       pattern: '\\eta', name: "tốc độ học eta", read: "eta"}
  # Bài 9 (Gradient Descent, Momentum, Adam): hệ số giữ lại của trung bình trượt và số rất nhỏ chống chia cho 0.
  - {id: beta,      pattern: '\\beta', name: "hệ số beta (phần giữ lại của trung bình trượt / động lượng)", read: "bê-ta"}
  - {id: epsilon,   pattern: '\\varepsilon|\\epsilon', name: "số rất nhỏ epsilon (chống chia cho 0)", read: "ép-xi-lon"}
  - {id: hessian,   pattern: 'H_f|\\mathbf\{H\}', name: "ma trận Hessian", read: "Hessian của f"}
  # L06: J in đậm = ma trận Jacobian (cũng khớp `mat`); ∂² = đạo hàm riêng cấp 2 (số 2 ở đây KHÔNG phải luỹ thừa,
  # nên cần ký hiệu riêng dù `power` là kiến thức nền).
  - {id: jacobian,  pattern: '\\mathbf\{J\}', name: "ma trận Jacobian", read: "Jacobian của f"}
  # L07: dấu sao trên = “điểm đang xét / điểm tối ưu” (tài liệu dòng 226, 249: x^*); KHÔNG phải phép nhân
  - {id: star,      pattern: '\^\*|\^\{\*\}', name: "dấu sao trên: điểm đang xét (điểm dừng / điểm tối ưu)", read: "x sao"}
  - {id: second_partial, pattern: '\\partial\^\{?2', name: "đạo hàm riêng cấp 2", read: "đạo hàm riêng cấp 2 của f theo x rồi theo y"}
  - {id: det,       pattern: '\\det|\\Delta', name: "định thức", read: "định thức"}
  - {id: lambda,    pattern: '\\lambda', name: "trị riêng lambda", read: "lambda"}
  # ── xác suất ──
  - {id: prob,      pattern: '(?<![a-zA-Z\\])[Pp]\(', name: "xác suất", read: "xác suất của A"}
  - {id: given,     pattern: '\\mid', name: "khi biết (điều kiện)", read: "khi biết"}
  # L13: giao hai biến cố (A và B cùng xảy ra); phương sai — mẫu bắt cả \text{Var}, \mathrm{Var} để luật nhất quán bên dưới thấy được
  - {id: cap,       unicode: '∩', pattern: '\\cap\b', name: "giao: A và B cùng xảy ra", read: "A và B cùng xảy ra"}
  - {id: var,       pattern: '\\(operatorname|text|mathrm)\{Var\}', name: "phương sai", read: "phương sai của X"}
  # L15: hiệp phương sai và hệ số tương quan
  - {id: cov,       pattern: '\\(operatorname|text|mathrm)\{Cov\}', name: "hiệp phương sai", read: "hiệp phương sai của X và Y"}
  - {id: rho,       pattern: '\\rho', name: "hệ số tương quan rô", read: "rô"}
  - {id: expect,    pattern: '\\mathbb\{E\}', name: "kỳ vọng", read: "kỳ vọng"}
  - {id: normal,    pattern: '\\mathcal\{N\}', name: "phân phối chuẩn", read: "phân phối chuẩn"}
  - {id: mu,        pattern: '\\mu|\\boldsymbol\{\\mu\}', name: "trung bình mu", read: "mu"}
  - {id: sigma,     pattern: '\\sigma', name: "độ lệch chuẩn sigma / hàm sigmoid", read: "sigma"}
  - {id: Sigma_mat, pattern: '\\Sigma|\\mathbf\{\\Sigma\}', name: "ma trận hiệp phương sai / ma trận giá trị kỳ dị", read: "Sigma hoa"}
  - {id: log,       pattern: '\\log|\\ln', name: "logarit", read: "log"}
  - {id: exp,       pattern: '\\exp|e\^', name: "hàm mũ e", read: "e mũ"}
  - {id: data,      pattern: '\\mathcal\{D\}', name: "tập dữ liệu D (chữ D uốn cong)", read: "dữ liệu D"}
  # L18: vector đặc trưng phi(x) của hồi quy đa thức (ML24: f(x; w) = w^T phi(x))
  - {id: phi,       pattern: '\\phi|\\varphi', name: "vector đặc trưng φ(x) (các cột 1, x, x², …)", read: "phi của x"}
  - {id: prod,      pattern: '\\prod', name: "dấu tích Pi", read: "tích khi i chạy từ 1 đến N"}
  # L14: tích phân = diện tích dưới đường cong (người học chưa học giải tích tích phân — dạy như “tổng các cột hẹp”)
  - {id: integral,  unicode: '∫', pattern: '\\int(?![a-zA-Z])', name: "tích phân: diện tích dưới đường cong", read: "tích phân từ a đến b của f"}
  - {id: theta_b,   pattern: '\\boldsymbol\{\\theta\}', name: "bộ tham số theta", read: "theta"}
  - {id: hat,       pattern: '\\hat', name: "dấu mũ (giá trị dự đoán/ước lượng)", read: "y mũ"}
  # Dấu phẩy trên (u′, f′) không phải lệnh LaTeX nên phải bắt bằng mẫu riêng (lỗi thật L01 v2: u′ chưa giải thích).
  - {id: prime,     unicode: '′', pattern: "[a-zA-Z0-9\\}]'|\\\\prime", name: "dấu phẩy trên (vector/hàm khác, hoặc đạo hàm)", read: "u phẩy"}

# Lệnh LaTeX chỉ để trình bày (không mang nghĩa toán học mới) — không cần giải thích.
# Mọi lệnh KHÔNG nằm ở đây và KHÔNG khớp ký hiệu nào ở trên sẽ bị lint cảnh báo (WARN) để người soạn tự quyết.
layout_commands: [mathbf, text, textbf, quad, qquad, begin, end, bmatrix, pmatrix, matrix, cases, left, right, underbrace,
  overbrace, hl, hlb, hlg, hlo, color, textcolor, dfrac, frac, sqrt, checkmark, xrightarrow, rightarrow, to, operatorname,
  proj, times, mathrm, boxed, displaystyle, big, Big, bigg, ",", ";", " ", "!", phantom, quad, cr, "\\", mathit, overline]

# Luật nhất quán: trong MỘT bài, mỗi khái niệm chỉ được viết một kiểu. Lint FAIL nếu ≥ 2 kiểu cùng xuất hiện,
# trừ step có `notation_note: true` (step nói rõ hai cách viết là một).
# Bài học (lỗi thật ở L01 v1): viết lẫn ‖u‖₂² và ‖u‖² — người học thấy "dư hai số 2" mà không ai giải thích chỉ số dưới.
consistency:
  - name: "Phương sai"
    variants: ['\\operatorname\{Var\}', '\\(text|mathrm)\{Var\}']
    fix: "Dùng \\operatorname{Var}(X) (tài liệu dòng 298 viết \\text{Var}); cùng một chữ thì phải cùng một kiểu."
  - name: "Lôgarit tự nhiên"
    variants: ['\\ln\b', '\\log\b']
    fix: "Trong bài dùng một kiểu (khuyến nghị ln); nói “tài liệu viết log nghĩa là ln” trong step `notation_note: true`."
  - name: "Hàm mũ cơ số e"
    variants: ['\\exp\b', '(?<![a-zA-Z\\])e\^']
    fix: "Dùng e^{x}; giải thích exp(x) = e^x một lần trong step `notation_note: true`."
  - name: "Độ dài vector (chuẩn)"
    variants: ['[\}\)]\\\|_', '[\}\)]\\\|(?!_)']
    fix: "Chọn một kiểu: nếu cả bài chỉ dùng chuẩn L2 thì viết ‖x‖ (không chỉ số dưới) và giải thích ‖x‖₂ một lần trong step `notation_note: true`."
  - name: "Chuyển vị"
    variants: ['\^\{?T\}?(?![a-zA-Z])', '\^\{?\\top']
    fix: "Dùng một ký hiệu chuyển vị (khuyến nghị ^T, giống tài liệu môn học)."
  - name: "Dấu nhân giữa hai số"
    variants: ['[0-9]\s*\\times\s*[0-9(]', '[0-9]\s*\\cdot\s*[0-9(]']
    # kích thước 2 × 3 dùng \sz{2}{3} nên không bị tính là phép nhân ở đây
    fix: "Chọn × hoặc · cho phép nhân hai số; nếu dùng cả hai, giới thiệu sự tương đương trong step `notation_note: true`."
