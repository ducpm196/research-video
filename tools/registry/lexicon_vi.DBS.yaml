# Luật đọc PHỦ THÊM cho khoá DBS · Cơ sở dữ liệu (chạy TRƯỚC luật chung; không đổi văn bản TTS khoá khác).
# Bằng chứng dò: audit/dbs/probes/p1_sql.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm).
#   Từ khoá SQL (SELECT, WHERE…) KHÔNG đọc trong lời: lời đọc mô tả mệnh đề bằng tiếng Việt, từ khoá chỉ trên màn hình.
#   Cũng không đọc: commit (nói “ghi nhận”), NoSQL (nói “không quan hệ”), tên sản phẩm (PostgreSQL, MySQL, Redis…).
rules:
  # p1: SQL thô 6/8 (“Equiala”), “ét quy eo” 8/8 (bản chép “SQL” cả 8), “ét-kiu-eo” 6/8; đối chứng “ét quy em” 1/8 (“SQM / FQM”).
  - {pat: 'SQL', say: 'ét quy eo'}
  # p1: BCNF thô 3/8 (“PCNX / PCNF”), “bê xê en ép” 6/8 (bản chép “bcnf / BCNF / PC en ép”), “bi xi en ép” 5/8;
  #   đối chứng “bê xê em ép” 0/8 (chép “BCMF”: phân biệt n/m) → dùng “bê xê en ép”, dưới ngưỡng nên NOT_VERIFIED.
  - {pat: 'BCNF', say: 'bê xê en ép'}
  # p1: ACID thô 6/8 (“ASIC / acid”), “a-xít” 5/8, “a xê i đê” 8/8 (bản chép “ACID / ACI để” — đánh vần từng chữ);
  #   đối chứng “a-xích” cũng 8/8 vì ASR chép nó thành “acid” — khoá không phân biệt được → NOT_VERIFIED; chọn đánh vần vì
  #   bản chép giữ đủ bốn chữ cái.
  - {pat: 'ACID', say: 'a xê i đê'}
  # p2 (2026-11-02, bài L17): Stripe thô 0/8 (“stray / sai / trai”), “Xờ-trai” 0/8, “Xờ-trai-pơ” 8/8 (bản chép “Striper” cả 8 —
  #   gần âm, ASR thêm “-er”), đối chứng “Xờ-tai” 0/8 (“style”) → “Xờ-trai-pơ”: PARTIAL, cần người nghe xác nhận.
  - {pat: 'Stripe', say: 'Xờ-trai-pơ'}
  # p2: MySQL thô 1/8 (“MISCO / Mixco”), “Mai ét quy eo” 7/8 (bản chép “MySQL” 7 lần), “Mai-ét-kiu-eo” 0/8 (“máy QL”);
  #   đối chứng “Mai ét quy em” 6/8 theo khoá chấm (bản chép “MySQL em / XQI-M” — khác khi ĐỌC bản chép, khoá chuỗi con không phân biệt)
  #   → dùng “Mai ét quy eo”, NOT_VERIFIED bằng tai người; bài L17 chỉ nhắc tên ở ít câu.
  - {pat: 'MySQL', say: 'Mai ét quy eo'}
  # GB: cùng luật đã dựng và ASR ở OSY/NET/SDP/CLD/SEC/LLM (“ghi-ga” theo probe CSA).
  - {pat: 'GB', say: 'ghi-ga-byte'}
must_not_change: []
# p1: sigma (chữ thường) thô 8/8 (bản chép “xích ma / sít ma / sigma”); đối chứng “xích na” 0/8 → đọc thô. Sigma hoa: luật chung.
# byte: mượn probe CSA p1_thuat_ngu (bản chép “bay” 8/8, đối chứng 0/8) như NET.
# p2 (bài L17), KHÔNG đọc — chỉ trên màn hình, lời đọc dùng tên mô tả:
#   GitHub: thô 0/8 (“dít thuốc”), “Gít-háp” 3/8, “Ghít hắp” 2/8, đối chứng “Gít-lắp” 0/8 → nói “một nền tảng lưu trữ mã nguồn lớn”;
#   PostgreSQL: thô 2/8, “Pốt-grét” 0/8, “Pốt-grét ét quy eo” 4/8, đối chứng “Pốt-tơ-rét” 0/8 → nói “một hệ quản trị mã nguồn mở khác, bản 11”.
foreign_ok: [sigma, byte]
