# Luật đọc PHỦ THÊM cho khoá OSY · Hệ điều hành (chạy TRƯỚC luật chung; không đổi văn bản TTS của khoá khác).
# Bằng chứng dò: audit/osy/probes/p1_thuat_ngu.md (mỗi cách viết × 4 ngữ cảnh × small + medium, ngưỡng 7/8, đối chứng âm 0/8).
rules:
  # p1_thuat_ngu 2026-10-28: “xe-ma-pho” 7/8 (bản chép “semaphore”), “xê-ma-pho” 5/8, thô 4/8; đối chứng “xê-ma-lo” 0/8.
  - {pat: 'semaphore', say: 'xe-ma-pho'}
  - {pat: 'Semaphore', say: 'Xe-ma-pho'}   # cùng cách viết, đầu câu
  # KB: ghép từ âm tiết tiếng Việt “ki”, “lô” và “byte” (byte đã dò ở CSA); NOT_VERIFIED riêng cụm — xem asr của bài 8.
  - {pat: 'KB', say: 'ki-lô-byte'}
  - {pat: 'KiB', say: 'ki-lô-byte'}   # màn hình giữ KiB (= 1024 byte); lời đọc theo cách nói thông dụng
  - {pat: 'MiB', say: 'mê-ga-byte'}
  - {pat: 'MB', say: 'mê-ga-byte'}
  # GB: “ghi-ga” theo probe CSA (“ghi-ga-héc” 7/8); TiB: “tê-ra” ghép âm tiết Việt — NOT_VERIFIED riêng cụm, xem asr bài 12.
  - {pat: 'GB', say: 'ghi-ga-byte'}
  - {pat: 'TiB', say: 'tê-ra-byte'}
must_not_change: []
# p1_thuat_ngu 2026-10-28 (đọc bản chép ASR, không chỉ điểm khoá):
#   mutex: thô 1/8, “miu-tếch” 0/8, “mu-tếch” 1/8 — ASR chép “mưu tét / mua tết” → lời đọc nói “khoá”; chữ mutex chỉ trên màn hình.
#   fork: thô 4/8 (“phốc / phóp / pháp”), “phóc” 5/8; “pho” 8/8 là ĐIỂM GIẢ — bản chép “phó / phò / phô”, khớp khoá chỉ vì so không dấu
#     → không dùng; lời đọc nói “lời gọi tạo tiến trình con”, chữ fork() chỉ trên màn hình.
#   byte: mượn audit/csa/probes/p1_thuat_ngu.md — thô, ASR chép “bay” 8/8 (đúng âm /bai/); đối chứng 0/8 → foreign_ok.
# p2_hanh_trinh 2026-11-02 (bài L15, audit/osy/probes/p2_hanh_trinh.md), KHÔNG thêm luật — tên chỉ trên màn hình, lời đọc dùng tên mô tả:
#   Linux: thô 4/8, “Li-nắc” 2/8, “Li-nớc” 4/8; đối chứng “Li-nốp” 7/8 (khoá chấm lỏng → phép thử không phân định) → nói “nhân hệ điều hành”
#     (khớp kết luận probe CLD: Linux ≤ 4/8).
#   CFS: thô 1/8, “xê ép ét” 3/8, “xi ép ét” 5/8; đối chứng “xê ép đê” 0/8 → dưới ngưỡng 7/8; nói “bộ lập lịch hoàn toàn công bằng”.
#   EEVDF: thô 0/8, “i i vi đi ép” 1/8, “e e vê đê ép” 1/8; đối chứng 0/8 → nói “bộ lập lịch hạn chót ảo”.
#   CPU, ms, µs, ns, web: theo quy ước cũ của khoá, lời đọc nói “bộ xử lý”, “mi li giây”, “phần triệu giây”, “phần tỉ giây”, “trang mạng”.
foreign_ok: [byte]
