# ═══ ĐẶC TẢ BÀI GIẢNG (lesson spec) — tạo bằng: python tools/lv.py new lessons/<khoá>/<id>_<slug>.yaml --id <id> --title "..." ═══
# Mẫu này dùng cho MỌI chuyên ngành. Khung sư phạm: .claude/skills/lecture-video/references/pedagogy.md; bài tình huống chuyên gia:
#   dùng `--kind case` (tools/templates/case_lesson_template.yaml, references/case-lessons.md).
# Quy tắc vàng cho người mới / mất gốc:
#   1 step = 1 ý.  1 câu ≤ 38 từ, ≤ 170 ký tự.  Mọi ký hiệu phải được giải mã (introduces) TRƯỚC khi dùng.
#   Mọi con số trên màn hình phải có `checks` (biểu thức Python trả về True; hàm dùng chung đặt trong tools/checklib.py, tên có tiền tố khoá).
#   `say` là lời nói: KHÔNG dùng $, \, _, ^, { } — viết thành lời ("x một", "mũ hai"); số âm đọc "âm 2"; chuỗi hệ 16 tách từng chữ số.
#   `show` là HTML; công thức trong $...$ hoặc $$...$$. Macro tô màu: \hl{} đỏ, \hlb{} xanh, \hlg{} lục, \hlo{} cam.
#   Bước ≥ 3 câu nói về khối ≥ 3 phần cần `focus` (mỗi câu một mục). Nhắc “bài N”: bài trước phải nói lại nội dung; bài sau chỉ ở hook/recap,
#   có `forward_ref: true`. Không nhắc “tài liệu”, “slide”, “dòng N”. Chính tả theo SPELL_CANON trong tools/lv.py (lũy, tuỳ, huỷ, lôgarit, tỉ, vector).
# QUY ƯỚC KÝ HIỆU CỦA BÀI (ghi ở đây, giữ nguyên cả bài; kiểu khác chỉ ở step `notation_note: true`):
#   ...
id: __ID__
course: __COURSE__
series: "__SERIES__"
title: "__TITLE__"
voice: vi-VN-NamMinhNeural      # một giọng cho cả bài; giọng dự phòng do hàng đợi dựng tự chọn cho CẢ bài (tools/registry/tts_fallback.yaml)
rate: "-5%"
depth: full                    # chuẩn độ sâu cho người mới / mất gốc (pedagogy.md luật 22, lint E39) — mọi bài mới và bài viết lại
source: "curriculum/__COURSE_LC__.yaml __ID__; audit/__COURSE_LC__/verify___COURSE_LC__.py __ID__; <tác giả, năm>"   # nguồn đối chiếu (không đọc trong video)
assumes: []                    # id ký hiệu đã được bài tiên quyết giới thiệu (tools/registry/symbols*.yaml)
objectives:                    # sau bài này người học LÀM ĐƯỢC gì (động từ đo được: tính, đọc, so sánh, chọn, kiểm)
  - "Tính ... cho ví dụ ..."
  - "Nhận ra ... khi ..."
asr_reviewed: []               # câu `lv.py asr` gắn cờ đã xem xét: - {sentence: "...", reason: "ASR chép “…”: … (dẫn bản chép)"}
scenes:
  # Khung 10 nhịp (pedagogy.md mục 1). `depth: full` bắt buộc: prereq, intuition|concept có <svg>, ≥ 4 step example+check,
  # check bằng ĐƯỜNG KHÁC, quiz có pause + ≥ 2 step đáp án, recap có chuỗi logic; ≤ 3 khung liền chỉ có chữ; lời giảng ≥ 900 từ.
  - id: hook
    kind: hook                 # hook|prereq|intuition|symbol|concept|formula|example|check|pitfall|quiz|recap|mindset
    title: "Vì sao cần ...?"
    steps:
      - show: |
          <p>Một tình huống thật có con số: ...</p>
          <div class="box key">Hôm nay ta trả lời: ...? ...? ...?</div>
        focus: [1, 2]
        say: "Chào bạn, một tình huống thật có con số cụ thể. Hôm nay ta trả lời ba câu hỏi."
  - id: prereq
    kind: prereq
    title: "Ôn lại điều sẽ dùng"
    checks: ["2 + 3 == 5"]
    steps:
      - show: "<p><b>①</b> ... Ví dụ: $2 + 3 = 5$.</p>"
        say: "Điều thứ nhất, ... Ví dụ hai cộng ba bằng năm."
  - id: sym
    kind: symbol
    title: "Giải mã: ..."
    steps:
      - show: "<p>$2 \\cdot 3 = 6$: dấu chấm giữa dòng là phép nhân.</p>"
        introduces: [cdot]
        say: "Dấu chấm nằm giữa dòng là dấu nhân, nên hai nhân ba bằng sáu."
  - id: intuition
    kind: intuition
    title: "Hình dung cơ chế"
    steps:
      - show: |
          <div><svg width="900" height="220" viewBox="0 0 900 220"><rect x="40" y="60" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="160" y="113" font-size="24" text-anchor="middle" fill="#1f2937">đầu vào</text></svg></div>
        say: "Hình cho thấy dữ liệu đi từ đâu tới đâu, cái gì được lưu, và cái gì phải chờ."
  - id: formula
    kind: formula
    title: "Suy ra từng bước"
    checks: ["2 * 3 == 6"]
    steps:
      - show: "<p><b>Bước 1.</b> Vì ..., nên ...</p>"
        say: "Bước một, vì ..., nên ..."
      - show: "<p><b>Bước 2.</b> Thay ..., được ... <span class='note'>Làm thử với số nhỏ: ... ✓</span></p>"
        say: "Bước hai, thay ... vào, được ... Làm thử với số nhỏ, kết quả khớp."
  - id: example
    kind: example
    title: "Ví dụ bằng số, từng phép tính"
    checks: ["2 * 3 == 6"]
    steps:
      - show: "<p>① $2 \\cdot 3 = \\hl{6}$</p>"
        say: "Phép tính thứ nhất, hai nhân ba bằng sáu, vì nhân là cộng lặp lại."
      - show: "<p>① $2 \\cdot 3 = 6$. ② $6 + 1 = \\hlg{7}$</p>"
        say: "Phép tính thứ hai, dùng lại số sáu, cộng một được bảy."
  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks: ["3 + 3 + 1 == 7"]
    steps:
      - show: "<p>Đường khác: $3 + 3 + 1 = 7$ ✓ — khớp kết quả ②.</p>"
        say: "Kiểm bằng đường khác, vì hai nhân ba là ba cộng ba, nên ba cộng ba cộng một cũng bằng bảy, khớp kết quả."
      - show: "<table class='t'><tr><th>câu hỏi kiểm</th><th>trả lời</th></tr><tr><td>đơn vị có khớp?</td><td>...</td></tr></table>"
        say: "Câu hỏi kiểm thứ hai, đơn vị có khớp không."
  - id: pitfalls
    kind: pitfall
    title: "Lỗi hay gặp, có lỗi của người đã đi làm"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> ... <b class="red">(hậu quả)</b>
          <br><span class="note">Phép thử nào bắt được lỗi này.</span></div>
        say: "Lỗi thứ nhất là ..., nên ... Phép thử ... sẽ bắt được ngay."
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks: ["3 * 4 == 12"]
    steps:
      - show: "<ol><li>Tính $3 \\cdot 4$.</li><li>Quyết định: ...?</li></ol>"
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ba nhân bốn bằng bao nhiêu? Câu hai, bạn sẽ chọn gì? Dừng video và làm ra giấy."
        pause: 15
      - show: "<p>① $3 \\cdot 4 = \\hl{12}$, vì ...</p>"
        say: "Đáp án câu một, ba nhân bốn bằng mười hai, vì ..."
      - show: "<table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>...</td><td>...</td><td>...</td></tr></table>"
        say: "Đáp án câu hai là một đánh đổi giữa được và mất."
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: "<div class='chain'><span class='n'>A</span><span class='a'>→</span><span class='n'>B</span></div>"
        say: "Tổng kết lại, từ A ta suy ra B."
      - show: "<div class='box key'><b>Tư duy:</b> ...</div>"
        say: "Điều cần mang theo là ..."
