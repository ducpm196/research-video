# ═══ BÀI TÌNH HUỐNG CHUYÊN GIA — tạo bằng: python tools/lv.py new lessons/<khoá>/<id>_<slug>.yaml --id <id> --title "..." --kind case ═══
# Đọc trước: .claude/skills/lecture-video/references/case-lessons.md. Khung 6 nhịp giữ đúng các phân cảnh bắt buộc của lint:
#   hook    = sự cố / quyết định thật: ai, khi nào, con số quan sát được (mỗi sự kiện có nguồn CITED trong `source`, đã đọc nguyên văn);
#   symbol  = thuật ngữ người điều tra dùng (dòng thời gian, nguyên nhân góp phần, lớp phòng vệ…);
#   example = TÁI HIỆN CƠ CHẾ bằng số — tính lại con số của báo cáo bằng kiến thức các bài trước (checks chạy thật);
#   pitfall = các “bài học sai” hay gặp (đổ lỗi cá nhân, “cẩn thận hơn”, sửa triệu chứng);
#   quiz    = “bạn sẽ làm gì”: một biến thể của tình huống, người học ra quyết định, đáp án nêu đánh đổi;
#   recap   = thay đổi hệ thống rút ra + một câu tư duy của chuyên gia.
# Luật riêng của bài tình huống: chỉ khẳng định điều nguồn gốc ghi; con số suy đoán ghi “(số minh hoạ)”; không nêu tên cá nhân gây lỗi;
#   nội dung an ninh chỉ ở mức khái niệm phòng thủ; giọng điềm tĩnh, không giật gân.
id: __ID__
course: __COURSE__
series: "__SERIES__"
title: "__TITLE__"
voice: vi-VN-NamMinhNeural
rate: "-5%"
source: "curriculum/__COURSE_LC__.yaml __ID__; audit/__COURSE_LC__/verify___COURSE_LC__.py __ID__; <báo cáo điều tra gốc: cơ quan, tên, ngày — đã đọc nguyên văn ngày …>"
assumes: []
objectives:
  - "Dựng dòng thời gian của sự cố từ dữ kiện đã ghi"
  - "Tính lại con số then chốt của sự cố bằng ..."
  - "Đề xuất thay đổi hệ thống, không chỉ thay đổi con người"
asr_reviewed: []
scenes:
  - id: hook
    kind: hook
    title: "Điều đã xảy ra"
    steps:
      - show: |
          <p>Ngày ..., hệ thống ... (theo báo cáo ... năm ...).</p>
          <div class="box key">Hôm nay: tái hiện cơ chế bằng số, và tìm các lớp phòng vệ đã thiếu.</div>
        say: "Chào bạn, hôm nay ta đọc một sự cố có thật theo cách người điều tra làm, bắt đầu từ dữ kiện đã được ghi lại."
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của người điều tra"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>dòng thời gian</b></td><td>chuỗi sự kiện có giờ, tách khỏi suy đoán</td></tr>
          <tr><td><b>nguyên nhân góp phần</b></td><td>mỗi điều kiện mà thiếu nó sự cố đã không xảy ra</td></tr>
          <tr><td><b>lớp phòng vệ</b></td><td>cơ chế lẽ ra chặn được lỗi trước khi thành hậu quả</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng có ba thuật ngữ. Dòng thời gian là chuỗi sự kiện có giờ, tách khỏi suy đoán. Nguyên nhân góp phần là mỗi điều kiện mà thiếu nó thì sự cố đã không xảy ra. Lớp phòng vệ là cơ chế lẽ ra chặn được lỗi trước khi thành hậu quả."
  - id: example
    kind: example
    title: "Tái hiện cơ chế bằng số"
    checks:
      - "2 * 3 == 6"
    steps:
      - show: "<p>Con số của báo cáo, tính lại: ...</p>"
        say: "Ta tính lại con số của báo cáo bằng chính phép tính đã học, và thấy nó khớp."
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    steps:
      - show: |
          <div class="box warn"><b>Bài học sai 1.</b> “Người vận hành cẩn thận hơn là xong” <b class="red">(lỗi sẽ lặp lại)</b>
          <br><span class="note">Hỏi: vì sao hệ thống cho phép một thao tác gây hậu quả lớn như vậy?</span></div>
        say: "Bài học sai thứ nhất, cho rằng người vận hành cẩn thận hơn là xong, nên lỗi sẽ lặp lại với người khác. Câu hỏi đúng là vì sao hệ thống cho phép một thao tác gây hậu quả lớn như vậy."
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì?"
    checks: ["3 * 4 == 12"]
    steps:
      - show: "<ol><li>Một biến thể của tình huống: ... Bạn chọn cách nào, vì sao?</li></ol>"
        say: "Bây giờ đến lượt bạn ra quyết định. Câu một, trong biến thể này, bạn chọn cách nào và vì sao? Dừng video và viết ra giấy."
        pause: 15
      - show: "<p>① Cách ... — đánh đổi: ...</p>"
        say: "Đáp án câu một, chọn cách ..., đổi lại phải chấp nhận ..."
  - id: recap
    kind: recap
    title: "Thay đổi hệ thống & tư duy chuyên gia"
    steps:
      - show: "<div class='chain'><span class='n'>dữ kiện</span><span class='a'>→</span><span class='n'>cơ chế (tính lại)</span><span class='a'>→</span><span class='n'>lớp phòng vệ thiếu</span><span class='a'>→</span><span class='n'>thay đổi hệ thống</span></div>"
        say: "Tổng kết lại, đi từ dữ kiện tới cơ chế đã tính lại, tìm các lớp phòng vệ đã thiếu, rồi thay đổi hệ thống."
      - show: "<div class='box key'><b>Tư duy:</b> ...</div>"
        say: "Điều cần mang theo là ..."
