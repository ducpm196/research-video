# ═══ BÀI HÀNH TRÌNH (tình huống chuyên gia theo trục thời gian) — tạo bằng:
#     python tools/lv.py new lessons/<khoá>/<id>_<slug>.yaml --id <id> --title "..." --kind journey ═══
# Đọc trước: .claude/skills/lecture-video/references/case-lessons.md mục 5. Mẫu đã dựng: lessons/cld/L15_hanh_trinh_borg_kubernetes.yaml.
# Ý tưởng: một hệ thống / một lĩnh vực THẬT đi từ lúc khai sinh → tăng trưởng → quy mô lớn (rất nhiều người dùng) → ổn định → tiếp tục
#   phát triển. Ở MỖI chặng: quy mô lúc đó (con số có nguồn) → điểm nghẽn xuất hiện ở quy mô ấy → chuyên gia đã xử lý thế nào →
#   thực hành tốt rút ra (best practice) → một con số tính lại bằng kiến thức các bài trước (`checks`).
# Luật (lint E39 vì `depth: full`, E40 vì `case: journey`):
#   - ≥ 4 chặng, mỗi chặng là một scene có `stage: {year, scale, source, practice}`; năm không giảm dần; tiêu đề chặng ghi năm.
#   - Mỗi sự kiện, con số trong `show`/`say` có trong nguồn đã ĐỌC NGUYÊN VĂN (ghi câu trích vào audit/<khoá>/sources_<id>.md).
#     Con số không có trong nguồn: hoặc tính lại (checks), hoặc ghi “(minh hoạ)” trên màn hình và “một số minh hoạ” trong lời.
#   - Không nêu tên cá nhân trong lời đọc; tên tác giả nguồn chỉ ở `source`. Nội dung an ninh chỉ ở mức phòng thủ.
#   - Pitfall = “bài học sai” khi đọc lịch sử (chép quy mô của người khổng lồ, tin công cụ giải quyết mọi thứ…).
#   - Quiz = quyết định có đánh đổi ở MỘT quy mô cụ thể của người học; đáp án nêu điều kiện khi nào chọn cách kia.
id: __ID__
course: __COURSE__
series: "__SERIES__"
title: "__TITLE__"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
case: journey
source: "curriculum/__COURSE_LC__.yaml __ID__; audit/__COURSE_LC__/sources___ID__.md; [NGUON] <nguồn chặng 1: tác giả, tên, nơi đăng, năm>; <nguồn chặng 2> …"
assumes: []
objectives:
  - "Kể lại hành trình của ... qua các chặng, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt của từng chặng bằng kiến thức các bài trước"
  - "Chọn thực hành phù hợp với quy mô của chính mình, không chép quy mô của người khác"
asr_reviewed: []
scenes:
  - id: hook
    kind: hook
    title: "Từ ... tới ..."
    steps:
      - show: |
          <p>Năm ..., ... (con số khởi đầu). Năm ..., ... (con số quy mô lớn).</p>
          <div class="box key">Hôm nay: đi lại hành trình đó, xem mỗi quy mô đã làm lộ ra điểm nghẽn nào, và chuyên gia đã xử lý ra sao.</div>
        focus: [1, 2]
        say: "Chào bạn, hôm nay ta đi lại hành trình của một hệ thống thật, từ lúc nhỏ tới lúc phục vụ rất nhiều người dùng. Ở mỗi chặng, ta xem điểm nghẽn nào xuất hiện và chuyên gia đã xử lý ra sao."
  - id: prereq
    kind: prereq
    title: "Ôn lại kiến thức sẽ dùng"
    checks: ["2 * 3 == 6"]
    steps:
      - show: "<p>Ở bài ..., ta đã ... (nói lại nội dung, kèm một ví dụ số).</p>"
        say: "Ở bài trước, ta đã học ..., ví dụ ..."
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>quy mô</b></td><td>số máy, số người dùng, số yêu cầu mỗi giây lúc đó</td></tr>
          <tr><td><b>điểm nghẽn</b></td><td>chỗ hỏng hoặc chậm đầu tiên khi quy mô tăng</td></tr>
          <tr><td><b>thực hành tốt</b></td><td>cách xử lý đã được kiểm chứng ở nhiều nơi, kèm điều kiện áp dụng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng có ba thuật ngữ. Quy mô là số máy, số người dùng, hay số yêu cầu mỗi giây lúc đó. Điểm nghẽn là chỗ hỏng hoặc chậm đầu tiên khi quy mô tăng. Thực hành tốt là cách xử lý đã được kiểm chứng ở nhiều nơi, kèm điều kiện áp dụng."
  - id: intuition
    kind: intuition
    title: "Dòng thời gian"
    steps:
      - show: "<div><svg width='1000' height='200' viewBox='0 0 1000 200'><line x1='40' y1='100' x2='960' y2='100' stroke='#1f2937' stroke-width='3'/><text x='60' y='80' font-size='22'>chặng 1</text></svg></div>"
        say: "Hình là dòng thời gian của hành trình, mỗi mốc là một chặng ta sẽ đi qua."
  - id: stage1
    kind: example
    title: "Năm ... — khai sinh: ..."
    stage: {year: "....", scale: "...", source: "[NGUON]", practice: "..."}
    checks: ["2 * 3 == 6"]
    steps:
      - show: "<p>Quy mô: ... → điểm nghẽn: ... → cách xử lý: ... → con số tính lại: ...</p>"
        say: "Ở chặng đầu, quy mô là ..., điểm nghẽn là ..., và cách xử lý là ..."
  - id: stage2
    kind: example
    title: "Năm ... — tăng trưởng: ..."
    stage: {year: "....", scale: "...", source: "[NGUON]", practice: "..."}
    checks: ["2 * 3 == 6"]
    steps:
      - show: "<table class='t'><tr><th>quy mô</th><th>điểm nghẽn</th><th>cách xử lý</th><th>con số tính lại</th></tr><tr><td>...</td><td>...</td><td>...</td><td>...</td></tr></table>"
        say: "Ở chặng 2, quy mô là ..., điểm nghẽn là ..., và chuyên gia đã xử lý bằng ..."
  - id: stage3
    kind: example
    title: "Năm ... — quy mô lớn: ..."
    stage: {year: "....", scale: "...", source: "[NGUON]", practice: "..."}
    checks: ["2 * 3 == 6"]
    steps:
      - show: "<table class='t'><tr><th>quy mô</th><th>điểm nghẽn</th><th>cách xử lý</th><th>con số tính lại</th></tr><tr><td>...</td><td>...</td><td>...</td><td>...</td></tr></table>"
        say: "Ở chặng 3, quy mô là ..., điểm nghẽn là ..., và chuyên gia đã xử lý bằng ..."
  - id: stage4
    kind: example
    title: "Năm ... — ổn định và tiếp tục phát triển: ..."
    stage: {year: "....", scale: "...", source: "[NGUON]", practice: "..."}
    checks: ["2 * 3 == 6"]
    steps:
      - show: "<table class='t'><tr><th>quy mô</th><th>điểm nghẽn</th><th>cách xử lý</th><th>con số tính lại</th></tr><tr><td>...</td><td>...</td><td>...</td><td>...</td></tr></table>"
        say: "Ở chặng 4, quy mô là ..., điểm nghẽn là ..., và chuyên gia đã xử lý bằng ..."
  - id: check
    kind: check
    title: "Tự kiểm các con số của hành trình"
    checks: ["2 * 3 == 6"]
    steps:
      - show: "<p>Tính lại con số ... theo đường khác: ... ✓</p>"
        say: "Ta kiểm lại con số ... theo một đường khác, vì ..., và kết quả khớp."
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc lịch sử"
    steps:
      - show: |
          <div class="box warn"><b>Bài học sai 1.</b> Chép nguyên kiến trúc của hệ thống lớn <b class="red">(trả giá của quy mô mình chưa có)</b>
          <br><span class="note">Hỏi: mình đang ở chặng nào của hành trình?</span></div>
        say: "Bài học sai thứ nhất là chép nguyên kiến trúc của hệ thống lớn, nên trả giá cho quy mô mình chưa có. Câu hỏi đúng là mình đang ở chặng nào của hành trình."
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks: ["3 * 4 == 12"]
    steps:
      - show: "<ol><li>Tình huống ở quy mô ...: bạn chọn cách nào, vì sao?</li></ol>"
        say: "Bây giờ đến lượt bạn ra quyết định. Dừng video và viết ra giấy."
        pause: 20
      - show: "<table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>...</td><td>...</td><td>...</td></tr></table>"
        say: "Đáp án, so hai lựa chọn theo được và mất."
      - show: "<table class='t'><tr><th>khi nào đổi lựa chọn</th></tr><tr><td>...</td></tr></table>"
        say: "Và đây là điều kiện để đổi sang lựa chọn kia."
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: "<div class='chain'><span class='n'>khai sinh</span><span class='a'>→</span><span class='n'>tăng trưởng</span><span class='a'>→</span><span class='n'>quy mô lớn</span><span class='a'>→</span><span class='n'>ổn định, tiếp tục phát triển</span></div>"
        say: "Tổng kết lại, mỗi chặng làm lộ ra một điểm nghẽn, và mỗi thực hành tốt là câu trả lời cho điểm nghẽn ở đúng quy mô đó."
      - show: "<div class='box key'><b>Tư duy:</b> ...</div>"
        say: "Điều cần mang theo là ..."
