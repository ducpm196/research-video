# ═══ MẪU HỒ SƠ `language` (ngoại ngữ) — bài thật, dựng được: lv.py new … --profile language ═══
# Hai luật giọng (lint E50 + cảnh báo phát âm):
#   1) Lời giảng tiếng Việt: một giọng Việt cả bài, KHÔNG đọc từ tiếng Anh (giọng Việt đọc sai) — nói nghĩa tiếng Việt, chữ tiếng Anh
#      chỉ hiện trên màn hình.
#   2) Câu/từ mẫu tiếng Anh: một step RIÊNG có `voice:` bản ngữ, cả step chỉ có tiếng Anh. Không bao giờ đổi giọng giữa một câu.
# Nguồn ngữ pháp: Cambridge Dictionary, mục Grammar “Present perfect simple” và “Past simple” (dictionary.cambridge.org, đọc 2026-10-31).
id: __ID__
course: __COURSE__
series: "__SERIES__"
title: "__TITLE__"
profile: language
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "Cambridge Dictionary — Grammar: Present perfect simple; Past simple (dictionary.cambridge.org/grammar/british-grammar/), đọc 2026-10-31"
assumes: []
objectives:
  - "Chọn đúng hiện tại hoàn thành hay quá khứ đơn theo mốc thời gian"
  - "Nói được câu mẫu với have/has + quá khứ phân từ"
asr_reviewed: []
scenes:
  - id: hook
    kind: hook
    title: "Vì sao câu này sai?"
    steps:
      - show: |
          <p>Người Việt hay nói <b>“I have seen him yesterday”</b>. Câu này sai, vì có mốc thời gian đã kết thúc.</p>
          <div class="box key">Hôm nay: khi nào dùng <b>hiện tại hoàn thành</b>, khi nào dùng <b>quá khứ đơn</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, câu trên màn hình là lỗi người Việt rất hay mắc. Câu này sai, vì nó dùng thì hiện tại hoàn thành với từ hôm qua, một mốc đã kết thúc. Hôm nay ta học khi nào dùng hiện tại hoàn thành, khi nào dùng quá khứ đơn."
      - show: "<p>I have seen him yesterday. <b class='red'>(sai)</b></p>"
        voice: en-US-AvaNeural
        say: "I have seen him yesterday."
  - id: prereq
    kind: prereq
    title: "Ôn lại: động từ có ba dạng"
    steps:
      - show: |
          <table class="t"><tr><th>nguyên mẫu</th><th>quá khứ</th><th>quá khứ phân từ</th></tr>
          <tr><td>see</td><td>saw</td><td>seen</td></tr>
          <tr><td>live</td><td>lived</td><td>lived</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Mỗi động từ có ba dạng, nguyên mẫu, quá khứ, và quá khứ phân từ. Động từ nhìn thấy có ba dạng khác nhau. Động từ sống thì dạng quá khứ và quá khứ phân từ giống nhau."
      - show: "<p>I see her every day. I saw her yesterday. I have seen her today.</p>"
        voice: en-US-AvaNeural
        say: "I see her every day. I saw her yesterday. I have seen her today."
  - id: vocab
    kind: vocab
    title: "Từ chỉ thời gian quyết định thì"
    steps:
      - show: |
          <table class="t"><tr><th>đi với quá khứ đơn (mốc đã xong)</th><th>đi với hiện tại hoàn thành (tới nay / không nêu mốc)</th></tr>
          <tr><td>yesterday, last week, in 2019, ago</td><td>ever, never, already, yet, since, for</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Bảng chia từ chỉ thời gian thành hai nhóm. Cột trái là các mốc đã kết thúc, như hôm qua, tuần trước, năm 2019, đi với quá khứ đơn. Cột phải là khoảng thời gian kéo dài tới nay hoặc không nêu mốc, như từng, chưa bao giờ, kể từ, đi với hiện tại hoàn thành."
      - show: "<p>yesterday, last week, ago — ever, never, since, for</p>"
        voice: en-US-AvaNeural
        say: "Yesterday, last week, ago. Ever, never, since, for."
  - id: pattern
    kind: pattern
    title: "Mẫu câu"
    steps:
      - show: |
          <div class="chain"><span class="n">chủ ngữ</span><span class="a">+</span><span class="n">have / has</span><span class="a">+</span><span class="n">quá khứ phân từ</span></div>
        say: "Mẫu câu hiện tại hoàn thành gồm chủ ngữ, rồi trợ động từ có, rồi dạng quá khứ phân từ của động từ."
      - show: "<p>I have lived here since 2020. She has never seen snow.</p>"
        voice: en-US-AvaNeural
        say: "I have lived here since 2020. She has never seen snow."
  - id: dialogue
    kind: dialogue
    title: "Hội thoại ngắn"
    steps:
      - show: |
          <p>A: Have you ever been to Hue?</p>
          <p>B: Yes, I went there last summer.</p>
        voice: en-US-AvaNeural
        focus: [1, 2]
        say: "Have you ever been to Hue? Yes, I went there last summer."
      - show: "<div class='box key'>Câu hỏi dùng <b>ever</b> → hiện tại hoàn thành; câu trả lời nêu mốc <b>last summer</b> → quá khứ đơn.</div>"
        say: "Câu hỏi dùng từ từng, không nêu mốc, nên dùng hiện tại hoàn thành. Câu trả lời nêu mốc mùa hè năm ngoái, nên chuyển sang quá khứ đơn."
  - id: example
    kind: example
    title: "Sửa câu từng bước"
    steps:
      - show: "<table class='t'><tr><th>câu sai</th><th>dấu hiệu</th><th>câu đúng</th></tr><tr><td>I have seen him yesterday.</td><td>yesterday = mốc đã xong</td><td>I saw him yesterday.</td></tr></table>"
        focus: ["1.2", "1.2"]
        say: "Câu thứ nhất có từ hôm qua, là mốc đã xong. Vì vậy ta bỏ trợ động từ, và dùng dạng quá khứ của động từ nhìn thấy."
      - show: "<p>I saw him yesterday. ✓</p>"
        voice: en-US-AvaNeural
        say: "I saw him yesterday."
      - show: "<table class='t'><tr><th>câu sai</th><th>dấu hiệu</th><th>câu đúng</th></tr><tr><td>I live here since 2020.</td><td>since = từ đó tới nay</td><td>I have lived here since 2020.</td></tr></table>"
        focus: ["1.2", "1.2"]
        say: "Câu thứ hai có từ kể từ, nghĩa là việc kéo dài từ đó tới nay. Vì vậy ta dùng hiện tại hoàn thành."
      - show: "<p>I have lived here since 2020. ✓</p>"
        voice: en-US-AvaNeural
        say: "I have lived here since 2020."
  - id: practice
    kind: practice
    title: "Luyện nói theo"
    steps:
      - show: "<p>I have already finished my homework.</p>"
        voice: en-US-AvaNeural
        say: "I have already finished my homework."
      - show: "<p class='note'>Dừng lại, nói to câu trên hai lần, nhấn vào <b>have</b>.</p>"
        say: "Bạn hãy dừng lại, nói to câu vừa nghe hai lần, và nhấn vào trợ động từ."
        pause: 8
  - id: pitfalls
    kind: pitfall
    title: "Lỗi người Việt hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng hiện tại hoàn thành với mốc đã xong (yesterday, ago) <b class="red">(sai ngữ pháp)</b></div>
          <div class="box warn"><b>Lỗi 2.</b> Dùng hiện tại đơn với since, for khi việc kéo dài tới nay <b class="red">(sai nghĩa)</b></div>
        focus: [1, 2]
        say: "Lỗi thứ nhất là dùng hiện tại hoàn thành với mốc đã xong, như hôm qua hay cách đây. Lỗi thứ hai là dùng hiện tại đơn với kể từ hay trong khoảng, khi việc kéo dài tới nay."
  - id: quiz
    kind: quiz
    title: "Tự kiểm tra"
    steps:
      - show: "<ol><li>I ___ (visit) Hanoi in 2019.</li><li>We ___ (know) each other for ten years.</li></ol>"
        focus: [0, "1.1", "1.2", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một có mốc năm 2019. Câu hai có khoảng mười năm, kéo dài tới nay. Dừng video và điền động từ."
        pause: 15
      - show: "<p>① visited — vì in 2019 là mốc đã xong. ② have known — vì for ten years kéo dài tới nay.</p>"
        focus: [1, 1]
        say: "Câu một dùng quá khứ đơn, vì năm 2019 là mốc đã xong. Câu hai dùng hiện tại hoàn thành, vì mười năm kéo dài tới hiện tại."
      - show: "<p>I visited Hanoi in 2019. We have known each other for ten years.</p>"
        voice: en-US-AvaNeural
        say: "I visited Hanoi in 2019. We have known each other for ten years."
  - id: recap
    kind: recap
    title: "Tổng kết"
    steps:
      - show: "<div class='chain'><span class='n'>có mốc đã xong?</span><span class='a'>→</span><span class='n'>quá khứ đơn</span><span class='a'>/</span><span class='n'>tới nay hoặc không mốc</span><span class='a'>→</span><span class='n'>have + quá khứ phân từ</span></div>"
        say: "Tổng kết lại, câu có mốc đã xong thì dùng quá khứ đơn. Việc kéo dài tới nay hoặc không nêu mốc thì dùng hiện tại hoàn thành."
