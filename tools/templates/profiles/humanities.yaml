# ═══ MẪU HỒ SƠ `humanities` (xã hội, đời sống, triết học) — lv.py new … --profile humanities ═══
# Khung: câu hỏi → bối cảnh → khái niệm → lập luận từng bước → ví dụ đời sống → phản biện → tự kiểm → hiểu nhầm → câu hỏi mở.
# Trích dẫn khai trong `quotes` (lint E47). Nguồn: Plutarch, Cuộc đời Theseus §23 (bản dịch Dryden); T. Hobbes, De Corpore (1655),
# phần II, ch. 11, mục 7 — đọc 2026-10-31.
id: __ID__
course: __COURSE__
series: "__SERIES__"
title: "__TITLE__"
profile: humanities
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "Plutarch, Life of Theseus §23 (Dryden transl.); Thomas Hobbes, De Corpore (1655), Part II ch. 11 §7 — đọc 2026-10-31"
assumes: []
quotes:
  - {text: "một bên cho rằng con thuyền vẫn là nó, bên kia cãi rằng nó không còn là nó", author: "Plutarch", work: "Cuộc đời Theseus §23 (khoảng năm 100), lược dịch từ bản tiếng Anh của Dryden"}
objectives:
  - "Phát biểu câu hỏi về sự đồng nhất qua thay đổi"
  - "Trình bày hai lập luận đối lập và tiêu chí mỗi bên dùng"
asr_reviewed: []
scenes:
  - id: hook
    kind: hook
    title: "Thay hết ván, thuyền còn là thuyền cũ?"
    steps:
      - show: |
          <p>Chiếc xe máy của bạn đã thay máy, thay khung, thay bánh. Giấy tờ vẫn là xe cũ. Vậy nó có còn là <b>chiếc xe đó</b> không?</p>
          <div class="box key">Hôm nay: câu hỏi về <b>sự đồng nhất qua thay đổi</b>, từ con thuyền của Theseus.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, chiếc xe máy của bạn đã thay máy, thay khung, thay bánh, mà giấy tờ vẫn là xe cũ. Vậy nó có còn là chiếc xe đó không? Hôm nay ta bàn câu hỏi về sự đồng nhất qua thay đổi, bắt đầu từ con thuyền của một vị anh hùng Hy Lạp, tên ông ghi trên màn hình."
  - id: context
    kind: context
    title: "Bối cảnh: Plutarch kể lại"
    steps:
      - show: |
          <p>Khoảng năm 100, nhà viết tiểu sử Plutarch kể: người Athens giữ con thuyền của Theseus rất lâu, thay dần những tấm ván đã mục bằng ván mới.</p>
          <p class="note">“một bên cho rằng con thuyền vẫn là nó, bên kia cãi rằng nó không còn là nó” — Plutarch, Cuộc đời Theseus §23</p>
        focus: [1, 2]
        say: "Khoảng năm 100, nhà viết tiểu sử Plutarch kể rằng người Athens giữ con thuyền của vị anh hùng ấy rất lâu, thay dần những tấm ván đã mục bằng ván mới. Ông ghi rằng các triết gia chia làm hai phe, một bên cho rằng con thuyền vẫn là nó, bên kia cho rằng không."
  - id: concept
    kind: concept
    title: "Hai tiêu chí của “cùng một vật”"
    steps:
      - show: "<table class='t'><tr><th>tiêu chí</th><th>“cùng một vật” khi…</th></tr><tr><td>vật chất</td><td>còn cùng các bộ phận</td></tr><tr><td>liên tục</td><td>thay dần, chức năng và lịch sử không đứt</td></tr></table>"
        focus: [1, "1.2", "1.3"]
        say: "Có hai tiêu chí thường dùng. Theo tiêu chí vật chất, hai vật là một khi còn cùng các bộ phận. Theo tiêu chí liên tục, vật vẫn là nó khi thay dần từng phần mà chức năng và lịch sử không đứt."
  - id: argument
    kind: argument
    title: "Lập luận từng bước"
    steps:
      - show: "<div class='box'><b>Bước 1.</b> Thay 1 tấm ván trong 100 tấm: hầu như ai cũng nói vẫn là thuyền cũ.</div>"
        say: "Bước một, thay một tấm ván trong một trăm tấm, hầu như ai cũng nói đó vẫn là thuyền cũ."
      - show: "<div class='box'><b>Bước 2.</b> Nếu thay 1 tấm không đổi danh tính, thì thay thêm 1 tấm nữa cũng không đổi.</div>"
        say: "Bước hai, nếu thay một tấm không làm đổi danh tính, thì thay thêm một tấm nữa cũng không đổi."
      - show: "<div class='box key'><b>Bước 3.</b> Lặp lại 100 lần → mọi ván đã mới, mà theo lập luận vẫn là thuyền cũ.</div>"
        say: "Bước ba, lặp lại một trăm lần, mọi tấm ván đều mới, mà theo lập luận thì vẫn là thuyền cũ. Tiêu chí liên tục dẫn tới kết luận này."
  - id: counter
    kind: counter
    title: "Phản biện: phiên bản của Hobbes"
    steps:
      - show: "<p>Năm 1655, Hobbes thêm: nếu ai đó <b>gom các tấm ván cũ</b> và ráp lại, ta có hai con thuyền. Con nào là thuyền của Theseus?</p>"
        say: "Năm 1655, triết gia Hobbes thêm một chi tiết. Nếu có người gom các tấm ván cũ rồi ráp lại, ta có hai con thuyền, và cả hai đều có lý do để được gọi là con thuyền gốc."
      - show: "<table class='t'><tr><th>thuyền</th><th>tiêu chí ủng hộ</th></tr><tr><td>thuyền thay ván dần</td><td>liên tục</td></tr><tr><td>thuyền ráp từ ván cũ</td><td>vật chất</td></tr></table>"
        focus: [1, "1.2", "1.3"]
        say: "Bảng cho thấy mỗi tiêu chí chọn một con thuyền khác. Thuyền thay ván dần thắng theo tiêu chí liên tục. Thuyền ráp từ ván cũ thắng theo tiêu chí vật chất."
  - id: example
    kind: example
    title: "Ví dụ đời sống"
    steps:
      - show: "<table class='t'><tr><th>trường hợp</th><th>xã hội đang dùng tiêu chí</th></tr><tr><td>xe máy thay máy, giữ số khung</td><td>giấy tờ theo số khung (một bộ phận được chọn làm mốc)</td></tr><tr><td>cơ thể thay tế bào</td><td>liên tục</td></tr></table>"
        focus: [1, "1.2", "1.3"]
        say: "Trong đời sống, ta dùng cả hai tiêu chí tuỳ việc. Giấy tờ xe gắn với số khung, tức chọn một bộ phận làm mốc. Còn với cơ thể thay tế bào liên tục, ta dùng tiêu chí liên tục."
  - id: check
    kind: check
    title: "Tự kiểm"
    steps:
      - show: "<p>Một ban nhạc đổi hết thành viên nhưng giữ tên. Theo tiêu chí <b>liên tục</b>, đó có là ban nhạc cũ?</p>"
        say: "Tự kiểm, một ban nhạc đổi hết thành viên nhưng giữ tên và thay người dần dần. Theo tiêu chí liên tục, đó có còn là ban nhạc cũ không?"
        pause: 8
      - show: "<p>Có, nếu thay dần và hoạt động không đứt — vì tiêu chí liên tục xét quá trình, không xét bộ phận.</p>"
        say: "Có, nếu thay người dần dần và hoạt động không đứt, vì tiêu chí liên tục xét quá trình, không xét từng bộ phận."
  - id: pitfalls
    kind: pitfall
    title: "Hiểu nhầm hay gặp"
    steps:
      - show: |
          <div class="box warn"><b>Hiểu nhầm 1.</b> Cho rằng câu hỏi có một đáp án đúng duy nhất <b class="red">(thật ra phụ thuộc tiêu chí)</b></div>
          <div class="box warn"><b>Hiểu nhầm 2.</b> Gán chi tiết “gom ván cũ” cho Plutarch <b class="red">(đó là của Hobbes)</b></div>
        focus: [1, 2]
        say: "Hiểu nhầm thứ nhất là cho rằng câu hỏi có một đáp án đúng duy nhất, trong khi đáp án phụ thuộc tiêu chí. Hiểu nhầm thứ hai là gán chi tiết gom ván cũ cho Plutarch, trong khi đó là phần Hobbes thêm vào."
  - id: quiz
    kind: quiz
    title: "Bạn nghĩ sao?"
    steps:
      - show: "<ol><li>Một trang web viết lại toàn bộ mã nhưng giữ tên miền. Bạn dùng tiêu chí nào để nói nó là “cùng một trang”?</li></ol>"
        focus: [0, "1.1", "1.1", 0]
        say: "Bây giờ đến lượt bạn tự làm. Một trang mạng viết lại toàn bộ mã nhưng giữ tên miền. Bạn dùng tiêu chí nào để nói đó là cùng một trang? Dừng video và nêu lý do."
        pause: 15
      - show: "<p>Gợi ý: tên miền là một <b>mốc được chọn</b>, như số khung xe.</p>"
        say: "Gợi ý, tên miền đóng vai một mốc được chọn, giống số khung xe."
      - show: "<p>Hoặc tiêu chí liên tục: người dùng, dữ liệu, chức năng chuyển tiếp không đứt.</p>"
        say: "Một câu trả lời khác dùng tiêu chí liên tục, vì người dùng, dữ liệu và chức năng được chuyển tiếp không đứt."
  - id: recap
    kind: recap
    title: "Tổng kết & chuỗi ý"
    steps:
      - show: "<div class='chain'><span class='n'>câu hỏi đồng nhất</span><span class='a'>→</span><span class='n'>hai tiêu chí</span><span class='a'>→</span><span class='n'>lập luận thay dần</span><span class='a'>→</span><span class='n'>phản biện hai thuyền</span><span class='a'>→</span><span class='n'>chọn tiêu chí theo mục đích</span></div>"
        say: "Tổng kết lại, từ câu hỏi về sự đồng nhất, ta có hai tiêu chí, lập luận thay dần, phản biện hai con thuyền, và kết luận rằng phải chọn tiêu chí theo mục đích."
