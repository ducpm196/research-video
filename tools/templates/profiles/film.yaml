# ═══ MẪU HỒ SƠ `film` (phân tích phim ảnh) — lv.py new … --profile film ═══
# Không chèn khung phim, ảnh tác phẩm có bản quyền (lint E48): mô tả bằng lời + sơ đồ tự vẽ. Phân biệt dữ kiện có nguồn với nhận định.
# Nguồn: V. Pudovkin kể lại thí nghiệm (Film Technique, bản Anh 1929); S. Prince & W. E. Hensley, “The Kuleshov Effect: Recreating the
# Classic Experiment”, Cinema Journal 31(2), 1992; D. Barratt và cộng sự, “Does the Kuleshov Effect Really Exist?”, Perception 45(8),
# 2016 — đọc 2026-10-31. Chỉ khẳng định điều các nguồn ghi; năm làm thí nghiệm gốc không chắc chắn → nói “khoảng cuối thập niên 1910”.
id: __ID__
course: __COURSE__
series: "__SERIES__"
title: "__TITLE__"
profile: film
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "Pudovkin, Film Technique (1929); Prince & Hensley, Cinema Journal 31(2) 1992; Barratt et al., Perception 45(8) 2016 — đọc 2026-10-31"
assumes: []
objectives:
  - "Giải thích hiệu ứng Kuleshov bằng sơ đồ dựng phim"
  - "Phân biệt câu chuyện được kể lại với kết quả kiểm chứng lặp lại"
asr_reviewed: []
scenes:
  - id: hook
    kind: hook
    title: "Cùng một khuôn mặt, ba cảm xúc"
    steps:
      - show: |
          <p>Một khuôn mặt không biểu cảm, đặt sau ba cảnh khác nhau, khán giả lại “thấy” ba cảm xúc khác nhau. Vì sao?</p>
          <div class="box key">Hôm nay: <b>hiệu ứng Kuleshov</b> — dựng phim tạo ra nghĩa — và nó đứng vững tới đâu khi được kiểm lại.</div>
        focus: [1, 2]
        say: "Chào bạn, một khuôn mặt không biểu cảm, đặt sau ba cảnh khác nhau, khán giả lại thấy ba cảm xúc khác nhau. Hôm nay ta học hiệu ứng mang tên một nhà làm phim Xô viết, ý tưởng rằng việc dựng phim tạo ra nghĩa, và xem nó đứng vững tới đâu khi được kiểm lại."
  - id: context
    kind: context
    title: "Bối cảnh: điện ảnh Xô viết thời đầu"
    steps:
      - show: "<p>Khoảng cuối thập niên 1910, nhà làm phim Lev Kuleshov thử ghép một cảnh mặt diễn viên với các cảnh khác. Phim gốc không còn; ta biết qua lời kể của học trò ông, Pudovkin.</p>"
        say: "Khoảng cuối thập niên 1910, nhà làm phim Xô viết này thử ghép một cảnh mặt diễn viên với các cảnh khác. Phim gốc không còn, và ta biết chủ yếu qua lời kể của một học trò của ông."
  - id: concept
    kind: concept
    title: "Khái niệm: dựng phim (montage)"
    steps:
      - show: "<table class='t'><tr><th>thuật ngữ</th><th>nghĩa</th></tr><tr><td>cảnh quay</td><td>một đoạn liền mạch từ lúc bật tới lúc tắt máy</td></tr><tr><td>dựng phim</td><td>sắp các cảnh quay nối nhau; người xem tự nối nghĩa giữa hai cảnh</td></tr></table>"
        focus: [1, "1.2", "1.3"]
        say: "Bảng có hai thuật ngữ. Cảnh quay là một đoạn liền mạch từ lúc bật tới lúc tắt máy. Dựng phim là sắp các cảnh quay nối nhau, và người xem tự nối nghĩa giữa hai cảnh liền kề."
  - id: scene
    kind: scene
    title: "Sơ đồ thí nghiệm theo lời kể"
    steps:
      - show: |
          <div><svg width="1500" height="260" viewBox="0 0 1500 260"><g font-size="26" text-anchor="middle" fill="#1f2937">
          <rect x="40" y="40" width="380" height="80" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="230" y="90">bát súp</text>
          <rect x="560" y="40" width="380" height="80" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="750" y="90">quan tài một bé gái</text>
          <rect x="1080" y="40" width="380" height="80" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="1270" y="90">người phụ nữ trên sofa</text>
          <rect x="40" y="150" width="380" height="80" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="230" y="200">cùng khuôn mặt</text>
          <rect x="560" y="150" width="380" height="80" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="750" y="200">cùng khuôn mặt</text>
          <rect x="1080" y="150" width="380" height="80" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="1270" y="200">cùng khuôn mặt</text>
          </g></svg></div>
        focus: [1, 1]
        say: "Theo lời kể, cùng một cảnh mặt diễn viên được ghép sau ba cảnh, một bát súp, một quan tài bé gái, và một người phụ nữ trên ghế. Mỗi cặp ghép là một đoạn phim ngắn riêng."
      - show: "<table class='t'><tr><th>cảnh đứng trước</th><th>khán giả được kể là đã thấy</th></tr><tr><td>bát súp</td><td>đói</td></tr><tr><td>quan tài bé gái</td><td>buồn</td></tr><tr><td>người phụ nữ</td><td>say mê</td></tr></table>"
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Theo lời kể của người học trò, khán giả khen diễn xuất ở cả ba đoạn. Đặt sau cảnh bát súp, họ thấy nhân vật đang đói. Sau quan tài, họ thấy buồn. Sau người phụ nữ, họ thấy say mê, dù khuôn mặt hoàn toàn giống nhau."
  - id: technique
    kind: technique
    title: "Kỹ thuật: ghép hai cảnh"
    steps:
      - show: "<div class='chain'><span class='n'>cảnh A: đối tượng</span><span class='a'>→</span><span class='n'>cảnh B: khuôn mặt</span><span class='a'>→</span><span class='n'>người xem suy ra: B đang nhìn A</span></div>"
        say: "Kỹ thuật cốt lõi là ghép cảnh đối tượng ngay trước cảnh khuôn mặt. Người xem tự suy ra nhân vật đang nhìn đối tượng đó, và gán cảm xúc phù hợp."
  - id: theme
    kind: theme
    title: "Chủ đề: nghĩa nằm ở chỗ nối"
    steps:
      - show: "<div class='box key'>Ý tưởng lớn: nghĩa của một cảnh phụ thuộc cảnh đứng cạnh nó — nền tảng của dựng phim hiện đại.</div>"
        say: "Ý tưởng lớn là nghĩa của một cảnh phụ thuộc cảnh đứng cạnh nó, và đó là nền tảng của dựng phim hiện đại."
  - id: example
    kind: example
    title: "Kiểm chứng lặp lại: kết quả không đơn giản"
    steps:
      - show: "<table class='t'><tr><th>năm</th><th>nghiên cứu</th><th>kết quả</th></tr><tr><td>1992</td><td>Prince và Hensley dựng lại thí nghiệm</td><td>không thấy hiệu ứng rõ</td></tr><tr><td>2016</td><td>Barratt và cộng sự, nhiều khuôn mặt và ngữ cảnh</td><td>có hiệu ứng, nhưng tuỳ loại cảm xúc</td></tr></table>"
        focus: [1, "1.2", "1.3"]
        say: "Khi kiểm chứng lại, kết quả không đơn giản. Năm 1992, một nghiên cứu dựng lại thí nghiệm và không thấy hiệu ứng rõ. Năm 2016, một nghiên cứu khác với nhiều khuôn mặt và ngữ cảnh tìm thấy hiệu ứng, nhưng mức độ tuỳ loại cảm xúc."
  - id: pitfalls
    kind: pitfall
    title: "Đọc sai hay gặp"
    steps:
      - show: |
          <div class="box warn"><b>Đọc sai 1.</b> Coi lời kể là kết quả thí nghiệm đã kiểm chứng <b class="red">(phim gốc không còn)</b></div>
          <div class="box warn"><b>Đọc sai 2.</b> Cho rằng diễn xuất không quan trọng <b class="red">(hiệu ứng tuỳ cảm xúc và ngữ cảnh)</b></div>
        focus: [1, 2]
        say: "Đọc sai thứ nhất là coi lời kể là kết quả đã kiểm chứng, trong khi phim gốc không còn. Đọc sai thứ hai là cho rằng diễn xuất không quan trọng, trong khi hiệu ứng tuỳ cảm xúc và ngữ cảnh."
  - id: quiz
    kind: quiz
    title: "Bạn thấy gì?"
    steps:
      - show: "<ol><li>Bạn dựng một quảng cáo: cảnh mặt người mẫu ngay sau cảnh mưa ngoài cửa sổ. Người xem dễ gán cảm xúc gì, và vì sao?</li></ol>"
        focus: [0, "1.1", 0]
        say: "Bây giờ đến lượt bạn tự làm. Cảnh mặt người mẫu đặt ngay sau cảnh mưa ngoài cửa sổ, người xem dễ gán cảm xúc gì, và vì sao? Dừng video và trả lời."
        pause: 12
      - show: "<p>Thường là trầm lắng hoặc buồn — vì người xem nối cảnh mưa với điều nhân vật đang nhìn.</p>"
        say: "Thường là trầm lắng hoặc buồn, vì người xem nối cảnh mưa với điều nhân vật đang nhìn."
      - show: "<p class='note'>Nhưng theo nghiên cứu 2016, mức độ tuỳ người xem và loại cảm xúc — hãy thử với khán giả thật.</p>"
        say: "Nhưng theo nghiên cứu năm 2016, mức độ tuỳ người xem và loại cảm xúc, nên hãy thử với khán giả thật."
  - id: recap
    kind: recap
    title: "Tổng kết"
    steps:
      - show: "<div class='chain'><span class='n'>ghép cảnh</span><span class='a'>→</span><span class='n'>người xem tự nối nghĩa</span><span class='a'>→</span><span class='n'>lời kể kinh điển</span><span class='a'>→</span><span class='n'>kiểm chứng: có, nhưng có điều kiện</span></div>"
        say: "Tổng kết lại, ghép cảnh khiến người xem tự nối nghĩa. Đó là lời kể kinh điển, và khi kiểm chứng thì hiệu ứng có thật nhưng có điều kiện."
