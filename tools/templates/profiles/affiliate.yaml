# ═══ MẪU HỒ SƠ `affiliate` (giới thiệu sản phẩm có tiếp thị liên kết) — lv.py new … --profile affiliate ═══
# Mục tiêu: dạy người xem CHỌN đúng. Bắt buộc (lint E41–E45): công bố liên kết trong 2 phân cảnh đầu; `claims` có nguồn + ngày; không từ
# tuyệt đối không nguồn; không lời khen khách hàng bịa; luôn nêu ai KHÔNG nên mua. Tên sản phẩm cụ thể chỉ dùng khi có thông số từ nhà sản
# xuất (claims); ở mẫu này dùng “máy A/B (minh hoạ)”.
# Nguồn quy định mang lên máy bay: IATA, Lithium Battery Guidance Document (bản hiện hành) — pin dự phòng ≤ 100 Wh mang theo người, không
# ký gửi; 100–160 Wh cần hãng chấp thuận. Đọc 2026-10-31; người phát hành phải xem lại bản mới nhất và quy định của hãng bay.
id: __ID__
course: __COURSE__
series: "__SERIES__"
title: "__TITLE__"
profile: affiliate
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "IATA Lithium Battery Guidance Document (đọc 2026-10-31); công thức năng lượng Wh = mAh × V / 1000"
affiliate:
  disclosure: "Video có đường dẫn tiếp thị liên kết: nếu bạn mua qua đường dẫn, kênh nhận hoa hồng, giá bạn trả không đổi. Kênh không nhận sản phẩm miễn phí để đánh giá."
claims:
  - {text: "100 Wh", source: "IATA Lithium Battery Guidance Document — giới hạn pin dự phòng mang theo người không cần hãng duyệt", checked: "2026-10-31"}
  - {text: "20000 mAh", source: "minh hoạ: dung lượng ghi trên vỏ máy A (giả định)", checked: "2026-10-31"}
  - {text: "10000 mAh", source: "minh hoạ: dung lượng ghi trên vỏ máy B (giả định)", checked: "2026-10-31"}
  - {text: "5000 mAh", source: "minh hoạ: pin điện thoại (giả định)", checked: "2026-10-31"}
  - {text: "12494 mAh", source: "tính lại trong bài: 20000 × 3,7 ÷ 3,85 × 0,65 (checks)", checked: "2026-10-31"}
  - {text: "26800 mAh", source: "minh hoạ: dung lượng ghi trên vỏ máy trong câu hỏi (giả định)", checked: "2026-10-31"}
assumes: []
objectives:
  - "Đổi mAh sang Wh để so sánh và kiểm giới hạn mang lên máy bay"
  - "Ước lượng số lần sạc thật, không tin số ghi trên vỏ"
asr_reviewed: []
scenes:
  - id: hook
    kind: hook
    title: "20 nghìn mAh mà chỉ sạc được hơn 2 lần?"
    checks: ["round(20000 * 3.7 / 1000) == 74"]
    steps:
      - show: |
          <p>Sạc dự phòng ghi 20000 mAh, điện thoại pin 5000 mAh. Nhiều người nghĩ sạc được 4 lần — thực tế thường chỉ khoảng 2 đến 3 lần.</p>
          <div class="box key">Hôm nay: cách đọc thông số để chọn đúng — và cách tự tính.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, sạc dự phòng ghi 20 nghìn mAh, điện thoại pin 5 nghìn mAh, nhiều người nghĩ sạc được 4 lần. Thực tế thường chỉ khoảng 2 đến 3 lần. Hôm nay ta học cách đọc thông số để chọn đúng, và cách tự tính."
  - id: disclosure
    kind: disclosure
    title: "Công bố liên kết"
    steps:
      - show: "<div class='box warn'>Video có đường dẫn tiếp thị liên kết: nếu bạn mua qua đường dẫn, kênh nhận hoa hồng, giá bạn trả không đổi. Kênh không nhận sản phẩm miễn phí để đánh giá.</div>"
        say: "Trước khi bắt đầu, video này có đường dẫn tiếp thị liên kết. Nếu bạn mua qua đường dẫn, kênh nhận hoa hồng, và giá bạn trả không đổi. Kênh không nhận sản phẩm miễn phí để đánh giá."
  - id: need
    kind: need
    title: "Bạn cần gì?"
    steps:
      - show: "<table class='t'><tr><th>câu hỏi</th><th>vì sao quan trọng</th></tr><tr><td>sạc cho thiết bị nào?</td><td>quyết định dung lượng và công suất</td></tr><tr><td>có đi máy bay không?</td><td>có giới hạn năng lượng</td></tr></table>"
        focus: [1, "1.2", "1.3"]
        say: "Hãy trả lời hai câu hỏi trước. Bạn sạc cho thiết bị nào, vì điều đó quyết định dung lượng và công suất cần có. Bạn có đi máy bay không, vì pin mang lên máy bay có giới hạn năng lượng."
  - id: criteria
    kind: criteria
    title: "Tiêu chí: đổi mAh sang Wh"
    checks: ["20000 * 3.7 / 1000 == 74.0 and 74 <= 100"]
    steps:
      - show: |
          <p>Năng lượng (Wh) = dung lượng (mAh) nhân điện áp (V), chia 1000. Pin lithium thường có điện áp danh định 3,7 V.</p>
          <p>20000 mAh nhân 3,7 V, chia 1000 = <b>74 Wh</b> — dưới mức 100 Wh mang theo người theo hướng dẫn của IATA.</p>
        focus: [1, 1, 2]
        say: "Muốn so sánh, hãy đổi dung lượng sang năng lượng. Năng lượng tính bằng oát giờ bằng mAh nhân điện áp chia 1000, với pin lithium điện áp danh định thường là 3 phẩy 7 vôn. Máy 20 nghìn mAh có 74 oát giờ, dưới mức 100 oát giờ được mang theo người theo hướng dẫn của Hiệp hội Vận tải Hàng không Quốc tế."
  - id: compare
    kind: compare
    title: "So sánh hai máy (minh hoạ)"
    checks: ["round(20000 * 3.7 / 1000) == 74 and round(10000 * 3.7 / 1000) == 37"]
    steps:
      - show: "<table class='t'><tr><th></th><th>máy A (minh hoạ)</th><th>máy B (minh hoạ)</th></tr><tr><td>ghi trên vỏ</td><td>20000 mAh</td><td>10000 mAh</td></tr><tr><td>năng lượng</td><td>74 Wh</td><td>37 Wh</td></tr><tr><td>hợp với</td><td>đi vài ngày, nhiều thiết bị</td><td>đi trong ngày, gọn nhẹ</td></tr></table>"
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng so hai máy minh hoạ. Máy A ghi 20 nghìn mAh, máy B ghi 10 nghìn mAh. Đổi ra năng lượng là 74 và 37 oát giờ. Máy A hợp đi vài ngày với nhiều thiết bị, còn máy B gọn hơn cho đi trong ngày."
  - id: example
    kind: example
    title: "Tính số lần sạc thật"
    checks:
      - "round(5000 * 3.85 / 1000, 2) == 19.25"
      - "round(74 * 0.65 / 19.25, 1) == 2.5"
    steps:
      - show: "<p>① Pin điện thoại 5000 mAh ở 3,85 V: 5000 nhân 3,85, chia 1000 = <b>19,25 Wh</b>.</p>"
        say: "Bước một, pin điện thoại 5 nghìn mAh ở 3 phẩy 85 vôn có 19 phẩy 25 oát giờ."
      - show: "<p>② Hao phí khi đổi điện áp và khi sạc: giả định <b>65%</b> năng lượng tới được pin điện thoại (minh hoạ).</p>"
        say: "Bước hai, năng lượng bị hao khi đổi điện áp và khi sạc. Ta giả định khoảng 65 phần trăm tới được pin điện thoại, đây là một số minh hoạ."
      - show: "<p>③ 74 nhân 0,65, chia 19,25 ≈ <b>2,5 lần sạc</b> — không phải 4.</p>"
        say: "Bước ba, 74 nhân 0 phẩy 65 chia 19 phẩy 25, được khoảng 2 phẩy 5 lần sạc, không phải 4 lần."
  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks: ["round(20000 * 3.7 / 3.85 * 0.65 / 5000, 1) == 2.5"]
    steps:
      - show: "<table class='t'><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr><tr><td>quy về 3,85 V, trừ hao</td><td>20000 nhân 3,7, chia 3,85, nhân 0,65</td><td>≈ 12494 mAh</td></tr><tr><td>chia pin điện thoại</td><td>12494 chia 5000</td><td>≈ <b>2,5</b> ✓</td></tr></table>"
        focus: ["1.2", "1.3"]
        say: "Kiểm bằng đường khác, vì hai pin khác điện áp nên quy dung lượng máy A về 3 phẩy 85 vôn, nhân hiệu suất, được khoảng 12 nghìn 494 mAh. Chia cho 5 nghìn được 2 phẩy 5, khớp kết quả."
  - id: pitfalls
    kind: pitfall
    title: "Bẫy hay gặp"
    steps:
      - show: |
          <div class="box warn"><b>Bẫy 1.</b> Chia thẳng mAh của hai pin khác điện áp <b class="red">(ra 4 lần, sai)</b></div>
          <div class="box warn"><b>Bẫy 2.</b> Mua máy trên 100 Wh rồi mang lên máy bay <b class="red">(cần hãng chấp thuận)</b></div>
        focus: [1, 2]
        say: "Bẫy thứ nhất là chia thẳng mAh của hai pin khác điện áp, nên ra 4 lần, một kết quả sai. Bẫy thứ hai là mua máy trên 100 oát giờ rồi mang lên máy bay, trong khi loại đó cần hãng bay chấp thuận."
  - id: fit
    kind: fit
    title: "Ai nên, ai không nên mua"
    steps:
      - show: "<table class='t'><tr><th>nên chọn máy lớn (A)</th><th>không nên — chọn khác</th></tr><tr><td>đi nhiều ngày, sạc cả máy tính bảng</td><td>chỉ cần sạc thêm nửa ngày: máy B nhẹ hơn, hoặc không cần mua</td></tr></table>"
        focus: ["1.2", "1.2"]
        say: "Máy lớn hợp với người đi nhiều ngày và sạc cả máy tính bảng. Còn nếu bạn chỉ cần thêm nửa ngày pin, bạn không nên mua máy lớn, hãy chọn máy nhỏ nhẹ hơn, hoặc không cần mua."
  - id: quiz
    kind: quiz
    title: "Bạn chọn gì?"
    checks: ["round(26800 * 3.7 / 1000, 2) == 99.16"]
    steps:
      - show: "<ol><li>Máy 26800 mAh, 3,7 V: có được mang theo người lên máy bay mà không cần hãng duyệt?</li></ol>"
        focus: [0, "1.1", 0]
        say: "Bây giờ đến lượt bạn tự làm. Máy 26 nghìn 800 mAh ở 3 phẩy 7 vôn có được mang theo người lên máy bay mà không cần hãng duyệt không? Dừng video và tính."
        pause: 12
      - show: "<p>26800 nhân 3,7, chia 1000 = 99,16 Wh ≤ 100 Wh → được (theo hướng dẫn IATA; vẫn kiểm quy định của hãng).</p>"
        say: "Đáp án, 26 nghìn 800 nhân 3 phẩy 7 chia 1000 được 99 phẩy 16 oát giờ, dưới 100, nên được mang theo người. Bạn vẫn nên kiểm quy định riêng của hãng bay."
      - show: "<p class='note'>Không được ký gửi trong hành lý — pin dự phòng phải mang theo người.</p>"
        say: "Lưu ý thêm, pin dự phòng không được ký gửi trong hành lý, mà phải mang theo người."
  - id: recap
    kind: recap
    title: "Tổng kết"
    steps:
      - show: "<div class='chain'><span class='n'>xác định nhu cầu</span><span class='a'>→</span><span class='n'>đổi mAh sang Wh</span><span class='a'>→</span><span class='n'>tính lần sạc thật</span><span class='a'>→</span><span class='n'>kiểm giới hạn bay</span><span class='a'>→</span><span class='n'>chọn đủ, không thừa</span></div>"
        say: "Tổng kết lại, xác định nhu cầu, đổi dung lượng sang năng lượng, tính số lần sạc thật, kiểm giới hạn bay, rồi chọn máy vừa đủ, không thừa."
