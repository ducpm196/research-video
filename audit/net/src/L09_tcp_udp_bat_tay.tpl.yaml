    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>tcp_echo=PONG</div><div>syn_ack_ack=101</div><div>final_ack=501</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">cổng → đúng tiến trình</span><span class="a">→</span>

      <span class="n">UDP: nhẹ, không bảo đảm</span><span class="a">→</span>

      <span class="n">TCP: đánh số, xác nhận</span><span class="a">→</span>

      <span class="n">bắt tay: 1 lượt đi về</span></div>

      '
    say: Tổng kết lại, số cổng đưa dữ liệu tới đúng tiến trình. UDP nhẹ nhưng không bảo đảm, TCP đánh số và xác nhận từng byte, và bắt tay tốn một lượt đi về. Nắm chi phí một lượt bắt tay cho mỗi kết nối mới giúp tránh lãng phí hàng trăm mi-li-giây khi thiết kế dịch vụ gọi mạng liên tục. Bắt tay ba bước thiết lập đồng bộ số thứ tự hai chiều tạo nền vững chắc cho truyền dữ liệu tin cậy.
  - show: '<div class="box key"><b>Tư duy:</b> chọn giao thức theo điều ứng dụng <b>không chịu được</b>: mất dữ liệu, hay chậm trễ.</div>

      '
    say: Điều cần mang theo, hãy chọn giao thức theo điều ứng dụng không chịu được, mất dữ liệu, hay chậm trễ. Chọn giao thức vận chuyển phù hợp giữa đảm bảo toàn vẹn và độ trễ tối thiểu giúp dịch vụ mượt mà nhất.
  - clear: true
    show: '<p class="note">Bài sau (bài 10): TCP bảo đảm đủ dữ liệu bằng cách nào mà vẫn nhanh? <b>Truyền tin cậy</b>: dừng–chờ và cửa sổ trượt.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 10, ta xem TCP bảo đảm đủ dữ liệu bằng cách nào mà vẫn nhanh, qua truyền tin cậy với dừng chờ và cửa sổ trượt. Hẹn gặp bạn ở bài tiếp theo.
