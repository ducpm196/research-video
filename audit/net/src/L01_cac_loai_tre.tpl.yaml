scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mạng nhanh gấp 10 lần, sao vẫn chậm?"
    checks:
      - "abs((1500 * 8 / 100e6 + 1000e3 / 2e8) * 1e3 - 5.12) < 1e-9 and abs((1500 * 8 / 1e9 + 1000e3 / 2e8) * 1e3 - 5.012) < 1e-9"
    steps:
      - show: |
          <p>Gửi một gói 1500 byte tới máy cách 1000 km. Liên kết 100 Mbps: mất khoảng 5,12 ms. Nâng lên 1 Gbps — nhanh gấp 10 lần: vẫn khoảng 5,012 ms.</p>
          <p>Tốc độ tăng 10 lần mà thời gian gần như không đổi. Thời gian đó đi đâu?</p>
          <div class="box key">Hôm nay: bốn loại trễ — truyền, lan truyền, xử lý, hàng đợi — và loại nào đổi được bằng tiền.</div>
        focus: [1, 1, 1, 2, 3]
        say: "Chào bạn, gửi một gói 1500 byte tới một máy cách 1000 cây số. Với liên kết 100 triệu bit mỗi giây, mất khoảng 5 phẩy 12 mi li giây. Nâng lên 1 tỉ bit mỗi giây, nhanh gấp 10 lần, thì vẫn mất khoảng 5 phẩy 0 1 2 mi li giây. Tốc độ tăng 10 lần mà thời gian gần như không đổi, vậy thời gian đó đi đâu? Hôm nay ta học bốn loại trễ, và loại nào đổi được bằng tiền."

  # ───────────────────────── 2. CHUẨN BỊ ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: thời gian = lượng chia tốc độ, và đổi đơn vị"
    checks:
      - "120 / 60 == 2"
      - "10**3 == 1000 and 10**6 == 1000000 and 10**9 == 1000000000 and round(0.004 * 1000, 9) == 4"
    steps:
      - show: |
          <p>Xe chạy 60 km mỗi giờ, đi 120 km mất bao lâu? Thời gian $=$ lượng việc chia tốc độ làm việc:</p>
          $$\frac{120}{60} = 2 \text{ giờ}$$
        focus: [0, 2, 1]
        say: "Trước khi vào bài, ta ôn một phép tính quen thuộc. Một xe chạy 60 cây số mỗi giờ, đi 120 cây số thì mất 120 chia 60, bằng 2 giờ, vì thời gian bằng lượng việc cần làm chia cho tốc độ làm việc. Cả hai loại trễ chính của bài này đều tính đúng theo kiểu đó."
      - show: |
          <table class="t"><tr><th>viết</th><th>đọc</th><th>bằng</th></tr>
          <tr><td>$10^3$, k</td><td>nghìn (km = nghìn mét)</td><td>1000</td></tr>
          <tr><td>$10^6$, M</td><td>triệu (Mbps = triệu bit mỗi giây)</td><td>1 000 000</td></tr>
          <tr><td>$10^9$, G</td><td>tỉ (Gbps = tỉ bit mỗi giây)</td><td>1 000 000 000</td></tr>
          <tr><td>ms</td><td>mi li giây = một phần nghìn giây</td><td>0,004 giây = 4 ms</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Mạng dùng các con số rất lớn và rất nhỏ, nên ta viết gọn bằng lũy thừa của 10. Mười mũ ba là một nghìn, chữ k đứng trước mét thành cây số. Mười mũ sáu là một triệu, nên chữ M đứng trước bit mỗi giây nghĩa là triệu bit mỗi giây. Mười mũ chín là một tỉ, nên chữ G đứng trước bit mỗi giây nghĩa là tỉ bit mỗi giây. Còn mi li giây là một phần nghìn giây, ví dụ 0 phẩy 0 0 4 giây nhân 1000 thành 4 mi li giây."

  # ───────────────────────── 2b. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bốn loại trễ"
    steps:
      - show: |
          <table class="t"><tr><th>trễ</th><th>là thời gian để…</th><th>công thức</th></tr>
          <tr><td><b>truyền</b></td><td>đẩy <b>hết</b> các bit của gói ra đường dây</td><td>$\frac{L}{R}$ (độ dài gói chia tốc độ liên kết)</td></tr>
          <tr><td><b>lan truyền</b></td><td>một bit đi hết <b>quãng đường</b></td><td>$\frac{d}{v}$ (quãng đường chia tốc độ tín hiệu)</td></tr>
          <tr><td><b>xử lý</b></td><td>đọc phần đầu, kiểm lỗi, chọn cổng ra</td><td>cỡ micro giây</td></tr>
          <tr><td><b>hàng đợi</b></td><td>chờ các gói đến trước được gửi đi</td><td>từ 0 tới rất lớn, theo tải</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Một gói tin chịu bốn loại trễ. Trễ truyền là thời gian đẩy hết các bit của gói ra đường dây, bằng độ dài gói chia tốc độ liên kết. Trễ lan truyền là thời gian một bit đi hết quãng đường, bằng quãng đường chia tốc độ tín hiệu. Trễ xử lý là thời gian đọc phần đầu, kiểm lỗi và chọn cổng ra, thường rất nhỏ. Trễ hàng đợi là thời gian chờ các gói đến trước, có thể bằng 0 hoặc rất lớn, tuỳ tải."

  # ───────────────────────── 3. HÌNH ─────────────────────────
  - id: picture
    kind: concept
    title: "Nhìn hai loại trễ trên sơ đồ thời gian"
    steps:
      - show: |
          <div>{{DELAY_SHORT}}</div>
          <p>Thời gian chạy xuống. Độ <b>dày</b> của dải = trễ truyền (bit đầu tới bit cuối rời A). Độ <b>nghiêng</b> = trễ lan truyền (một bit đi từ A tới B).</p>
        focus: [1, 2, 2]
        say: "Trong sơ đồ này, thời gian chạy từ trên xuống, mỗi bên là một trục dọc. Độ dày của dải là trễ truyền, tính từ lúc bit đầu tới lúc bit cuối rời máy A. Độ nghiêng của dải là trễ lan truyền, thời gian một bit đi từ A tới B."
      - clear: true
        show: |
          <div class="box key">Hai loại trễ <b>độc lập</b>: trễ truyền phụ thuộc tốc độ liên kết, trễ lan truyền chỉ phụ thuộc quãng đường và vật lý của tín hiệu.</div>
        say: "Hai loại trễ này độc lập với nhau. Trễ truyền phụ thuộc tốc độ liên kết, còn trễ lan truyền chỉ phụ thuộc quãng đường và tốc độ của tín hiệu."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "1500 byte, 100 Mbps, 1000 km"
    checks:
      - "abs(1500 * 8 / 100e6 - 0.12e-3) < 1e-15"
      - "abs(1000e3 / 2e8 - 5e-3) < 1e-15"
      - "abs(3 * 0.12e-3 + 3 * 5e-3 - 15.36e-3) < 1e-12"
      - "abs(3 * 0.12 - 0.36) < 1e-12 and 3 * 5 == 15 and abs(0.36 + 15 - 15.36) < 1e-12"
      - "abs(1500 * 8 / 1e9 * 1e3 - 0.012) < 1e-12 and abs(3 * 0.012 + 15 - 15.036) < 1e-12"
    steps:
      - show: |
          <p><b>Bước 1 — trễ truyền</b>: đổi 1500 byte ra $1500 \times 8 = 12\,000$ bit rồi chia cho tốc độ liên kết.</p>
          $$\frac{12\,000}{100 \times 10^6} = 0{,}000\,12 \text{ giây} = \hl{0{,}12} \text{ ms}$$
        focus: [1, 2]
        say: "Bước một, tính trễ truyền, tốc độ liên kết đo bằng bit, nên trước hết đổi 1500 byte thành 1500 nhân 8, bằng 12 nghìn bit. Chia 12 nghìn bit cho 100 triệu bit mỗi giây, được 0 phẩy 0 0 0 1 2 giây, tức 0 phẩy 12 mi li giây."
      - show: |
          <p><b>Bước 2 — trễ lan truyền</b>: đổi 1000 km ra $1000 \times 10^3$ mét rồi chia cho tốc độ tín hiệu.</p>
          $$\frac{1000 \times 10^3}{2 \times 10^8} = 0{,}005 \text{ giây} = \hl{5} \text{ ms}$$
        focus: [1, 2]
        say: "Bước hai, tính trễ lan truyền, tốc độ tín hiệu đo bằng mét mỗi giây, nên đổi 1000 cây số thành 1 triệu mét. Chia cho 200 triệu mét mỗi giây, được 0 phẩy 0 0 5 giây, tức 5 mi li giây."
      - clear: true
        show: |
          <p><b>Bước 3 — đặt lên sơ đồ:</b> trễ truyền 0,12 ms là độ dày dải, trễ lan truyền 5 ms là độ nghiêng.</p>
          <div>{{DELAY_REAL}}</div>
          <p>Vẽ đúng tỉ lệ, dải gói tin mỏng gần như một đường: trễ lan truyền lớn gấp $\frac{5}{0{,}12} \approx 42$ lần.</p>
        focus: [1, 2, 3]
        say: "Bước ba, đặt hai con số vừa tính lên sơ đồ thời gian, trễ truyền là độ dày của dải, trễ lan truyền là độ nghiêng. Hình này vẽ đúng tỉ lệ thời gian. Dải gói tin mỏng gần như một đường, vì trễ lan truyền lớn gấp khoảng 42 lần trễ truyền."
      - clear: true
        show: |
          <p><b>Bước 4 —</b> qua 3 chặng, mỗi bộ định tuyến <b>lưu</b> trọn gói rồi mới <b>chuyển</b> đi, nên mỗi chặng tốn một lần trễ truyền:</p>
          <table class="t"><tr><th>phần</th><th>mỗi chặng</th><th>3 chặng</th></tr>
          <tr><td>truyền</td><td>0,12 ms</td><td>$3 \times 0{,}12 = 0{,}36$ ms</td></tr>
          <tr><td>lan truyền</td><td>5 ms</td><td>$3 \times 5 = 15$ ms</td></tr></table>
          <p><b>Bước 5 —</b> cộng: $0{,}36 + 15 = \hl{15{,}36}$ ms (bỏ qua xử lý và hàng đợi).</p>
          <div class="box key">Nâng lên 1 Gbps: trễ truyền còn 0,012 ms mỗi chặng, nhưng 15 ms lan truyền vẫn nguyên.</div>
        focus: [1, "2.2", "2.3", 3, 4, 4]
        say: "Bước bốn, nếu gói đi qua 3 chặng, mỗi chặng dài như vậy, thì mỗi bộ định tuyến lưu trọn gói rồi mới chuyển đi, nên mỗi chặng tốn một lần trễ truyền. Phần truyền là 3 nhân 0 phẩy 12, bằng 0 phẩy 36 mi li giây. Phần lan truyền là 3 nhân 5, bằng 15 mi li giây. Bước năm, cộng hai phần, tổng là 3 nhân 0 phẩy 12 cộng 3 nhân 5, bằng 15 phẩy 36 mi li giây. Nâng liên kết lên 1 tỉ bit mỗi giây thì trễ truyền còn 0 phẩy 0 1 2 mi li giây mỗi chặng. Nhưng 15 mi li giây lan truyền vẫn còn nguyên."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: đơn vị"
    checks:
      - "1500 * 8 == 12000"
      - "100e6 / 1000 == 100000 and 12000 / 100000 == 0.12"
      - "2e8 / 1000 / 1000 == 200 and 1000 / 200 == 5"
    steps:
      - show: |
          <p><b>Đường khác:</b> đổi tốc độ sang “mỗi mi li giây” rồi chia thẳng.</p>
          <table class="t"><tr><th></th><th>tốc độ mỗi ms</th><th>chia</th><th>kết quả</th></tr>
          <tr><td>truyền</td><td>$\frac{100 \times 10^6}{1000} = 100\,000$ bit</td><td>$\frac{12\,000}{100\,000}$</td><td>0,12 ms ✓</td></tr>
          <tr><td>lan truyền</td><td>$\frac{2 \times 10^8}{1000}$ m $= 200$ km</td><td>$\frac{1000}{200}$</td><td>5 ms ✓</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Tự kiểm bằng một đường khác, đổi tốc độ sang đơn vị mỗi mi li giây rồi chia thẳng, không qua giây. Liên kết 100 triệu bit mỗi giây đẩy được 100 nghìn bit mỗi mi li giây, nên 12 nghìn bit mất 12 nghìn chia 100 nghìn, bằng 0 phẩy 12 mi li giây. Tín hiệu đi 200 triệu mét mỗi giây, tức 200 cây số mỗi mi li giây, nên 1000 cây số mất 1000 chia 200, bằng 5 mi li giây. Hai kết quả khớp với cách tính trước, vì ta chỉ đổi đơn vị chứ không đổi phép chia."
      - show: |
          <ol><li><b>Byte hay bit?</b> Tốc độ liên kết tính bằng bit mỗi giây, nên đổi 1500 byte thành $1500 \times 8 = 12\,000$ bit trước khi chia.</li>
          <li><b>Mét hay km?</b> Đổi cùng đơn vị với tốc độ tín hiệu (mét mỗi giây).</li>
          <li><b>Độ lớn hợp lý?</b> Trong thành phố, lan truyền chỉ cỡ phần trăm mi li giây; xuyên đại dương thì cỡ chục mi li giây.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng cách soát đơn vị. Một, tốc độ liên kết tính bằng bit mỗi giây, nên đổi 1500 byte thành 12 nghìn bit trước khi chia. Hai, đổi quãng đường sang mét cho cùng đơn vị với tốc độ tín hiệu. Ba, xem độ lớn có hợp lý không, trong thành phố lan truyền chỉ cỡ phần trăm mi li giây, còn xuyên đại dương thì cỡ chục mi li giây."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay gặp"
    checks:
      - "abs(1500 / 100e6 * 1e3 - 0.015) < 1e-12"
      - "abs(3000e3 / 2e8 * 1e3 - 15) < 1e-9 and 2 * 15 == 30"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ băng thông lớn làm giảm trễ lan truyền <b class="red">(sai)</b>
          <br><span class="note">Băng thông chỉ làm dải <b>mỏng</b> đi. Độ nghiêng do khoảng cách và vật lý quyết định.</span></div>
        say: "Lỗi thứ nhất, nghĩ băng thông lớn làm giảm trễ lan truyền. Băng thông chỉ làm dải gói tin mỏng đi, còn độ nghiêng do khoảng cách và vật lý quyết định."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên đổi byte sang bit <b class="red">(sai 8 lần)</b>
          <br><span class="note">1500 byte là 12 000 bit. Quên nhân 8 thì trễ truyền nhỏ đi 8 lần.</span></div>
          $$\frac{1500}{100 \times 10^6} = 0{,}015 \text{ ms thay vì } 0{,}12 \text{ ms}$$
        focus: [1, 1, 2]
        say: "Lỗi thứ hai, quên đổi byte sang bit, kết quả sai 8 lần. 1500 byte là 12 nghìn bit, quên nhân 8 thì trễ truyền tính ra nhỏ đi 8 lần. Trong ví dụ của ta, kết quả sai sẽ là 0 phẩy 0 1 5 mi li giây thay vì 0 phẩy 12 mi li giây."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng tốc độ ánh sáng trong chân không <b class="red">(sai)</b>
          <br><span class="note">Trong cáp quang và cáp đồng, tín hiệu đi khoảng $2 \times 10^8$ m/s — chừng hai phần ba tốc độ ánh sáng trong chân không.</span></div>
        say: "Lỗi thứ ba, dùng tốc độ ánh sáng trong chân không. Trong cáp quang và cáp đồng, tín hiệu chỉ đi khoảng 200 triệu mét mỗi giây, chừng hai phần ba tốc độ ánh sáng trong chân không."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Coi trễ hàng đợi là hằng số <b class="red">(sai)</b>
          <br><span class="note">Nó phụ thuộc lúc đó có bao nhiêu gói đang chờ: lúc vắng gần 0, lúc nghẽn có thể lớn hơn mọi loại trễ khác cộng lại.</span></div>
        say: "Lỗi thứ tư, coi trễ hàng đợi là hằng số. Nó phụ thuộc lúc đó có bao nhiêu gói đang chờ, lúc vắng gần bằng 0, lúc nghẽn có thể lớn hơn mọi loại trễ khác cộng lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5 — người đã đi làm.</b> Đo thời gian đi và về giữa hai thành phố cách nhau 3000 km thấy 30 ms, liền thuê đường truyền nhanh hơn <b class="red">(không giảm được)</b></div>
          <table class="t"><tr><th>phần của 30 ms</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>lan truyền một chiều</td><td>$\frac{3000 \times 10^3}{2 \times 10^8}$</td><td>15 ms</td></tr>
          <tr><td>đi và về</td><td>$2 \times 15$</td><td>30 ms — toàn bộ là khoảng cách</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Lỗi thứ năm hay gặp ở người đã đi làm, đo thời gian một gói đi tới và lời đáp quay về giữa hai thành phố cách nhau 3000 cây số. Thấy 30 mi li giây, họ liền thuê đường truyền nhanh hơn. Riêng lan truyền một chiều đã là 3 triệu mét chia 200 triệu mét mỗi giây, bằng 15 mi li giây. Đi và về là 2 nhân 15, bằng 30 mi li giây, tức toàn bộ con số đo được đến từ khoảng cách. Vì vậy hãy tách xem trễ thuộc loại nào trước khi bỏ tiền ra mua băng thông."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(1250 * 8 / 10e6 - 1e-3) < 1e-15 and abs(300e3 / 2e8 - 1.5e-3) < 1e-15"
      - "1250 * 8 == 10000 and abs(10000 / 100e6 * 1e3 - 0.1) < 1e-12 and abs(0.1 + 1.5 - 1.6) < 1e-12 and 1.6 < 2"
    steps:
      - show: |
          <p>Gói 1250 byte, liên kết 10 Mbps, cáp quang dài 300 km, một chặng.</p>
          <table class="t"><tr><th>câu</th><th>hỏi</th></tr>
          <tr><td>1</td><td>Trễ truyền và trễ lan truyền là bao nhiêu?</td></tr>
          <tr><td>2</td><td>Tổng (bỏ qua xử lý và hàng đợi)?</td></tr>
          <tr><td>3</td><td>Cần tổng dưới 2 ms. Chỉ nâng liên kết lên 100 Mbps có đủ không?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Một gói 1250 byte, liên kết 10 triệu bit mỗi giây, cáp quang dài 300 cây số, chỉ một chặng. Câu một, trễ truyền và trễ lan truyền là bao nhiêu? Câu hai, tổng là bao nhiêu, nếu bỏ qua xử lý và hàng đợi? Câu ba, cần tổng dưới 2 mi li giây, chỉ nâng liên kết lên 100 triệu bit mỗi giây có đủ không? Dừng video và làm ra giấy."
        pause: 12
      - show: |
          <p>① Truyền: $1250 \times 8 = 10\,000$ bit, nên $\frac{10\,000}{10 \times 10^6} = \hl{1}$ ms.</p>
        say: "Đáp án câu một, trước hết đổi 1250 byte thành 1250 nhân 8, bằng 10 nghìn bit. Trễ truyền bằng 10 nghìn bit chia 10 triệu bit mỗi giây, được 1 mi li giây."
      - show: |
          <p>① Lan truyền: $\frac{300 \times 10^3}{2 \times 10^8} = \hl{1{,}5}$ ms.</p>
          <p>② Tổng $1 + 1{,}5 = \hl{2{,}5}$ ms.</p>
        focus: [1, 2]
        say: "Trễ lan truyền bằng 300 cây số chia 200 triệu mét mỗi giây, được 1 phẩy 5 mi li giây. Câu hai, tổng là 2 phẩy 5 mi li giây."
      - show: |
          <p>③ Ở 100 Mbps: truyền $\frac{10\,000}{100 \times 10^6} = 0{,}1$ ms; tổng $0{,}1 + 1{,}5 = \hl{1{,}6}$ ms $< 2$ ms → <b>đủ</b>.</p>
          <p class="note">Nhưng nếu yêu cầu là dưới 1,5 ms thì không băng thông nào đủ — phần lan truyền đã chiếm 1,5 ms.</p>
        focus: [1, 1, 2]
        say: "Câu ba, ở 100 triệu bit mỗi giây, trễ truyền còn 10 nghìn chia 100 triệu, bằng 0 phẩy 1 mi li giây. Tổng là 0 phẩy 1 cộng 1 phẩy 5, bằng 1 phẩy 6 mi li giây, nhỏ hơn 2, nên nâng liên kết là đủ. Nhưng nếu yêu cầu là dưới 1 phẩy 5 mi li giây thì không băng thông nào đủ, vì riêng phần lan truyền đã chiếm 1 phẩy 5 mi li giây."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">truyền = L / R</span><span class="a">→</span>
          <span class="n">lan truyền = d / v</span><span class="a">→</span>
          <span class="n">lưu–chuyển: mỗi chặng một lần truyền</span><span class="a">→</span>
          <span class="n">hàng đợi theo tải</span></div>
        say: "Tổng kết lại, trễ truyền bằng độ dài gói chia tốc độ liên kết, trễ lan truyền bằng quãng đường chia tốc độ tín hiệu. Mỗi chặng lưu và chuyển tốn thêm một lần trễ truyền, còn trễ hàng đợi thay đổi theo tải."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi mua đường truyền nhanh hơn, hãy hỏi thời gian đang mất vào <b>đâu</b> — băng thông không mua được khoảng cách.</div>
        say: "Điều cần mang theo, trước khi mua đường truyền nhanh hơn, hãy hỏi thời gian đang mất vào đâu, vì băng thông không mua được khoảng cách."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): bao nhiêu dữ liệu đang “bay” trên dây cùng lúc? <b>Thông lượng</b> và <b>tích băng thông–trễ</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta hỏi có bao nhiêu dữ liệu đang bay trên dây cùng một lúc, qua thông lượng và tích băng thông nhân trễ. Hẹn gặp bạn ở bài tiếp theo."
