# Quy ước: L = độ dài gói (bit), R = tốc độ liên kết (bit mỗi giây), d = quãng đường, v = tốc độ tín hiệu (≈ 2·10⁸ m/s trong cáp
#   quang và cáp đồng). Lời đọc nói “triệu bit mỗi giây”, “mi li giây”; màn hình giữ Mbps, ms, µs. Hình sinh bằng audit/net/seq_svg.py
#   ĐÚNG TỈ LỆ thời gian (trễ truyền 0,12 ms so với lan truyền 5 ms cho dải rất mỏng — cố ý).
objectives:
  - "Phân biệt trễ truyền với trễ lan truyền"
  - "Tính trễ đầu–cuối qua nhiều chặng lưu–chuyển"
  - "Hiểu vì sao tăng băng thông không làm giảm trễ lan truyền"
