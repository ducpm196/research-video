source: "curriculum/net.yaml L10; audit/net/verify_net.py L10; J. Kurose, K. Ross, mục 3.4 (rdt, Go-Back-N, lặp chọn lọc)"
assumes: [arith, frac, power, approx, sub, min_fn, dots]
# Quy ước: L = độ dài gói (bit), R = tốc độ liên kết, t = L/R = thời gian phát một gói, RTT = thời gian đi về (lời đọc: “một lượt đi về”).
#   Hiệu suất U = phần thời gian bên gửi thật sự đang phát. Bỏ qua thời gian phát gói xác nhận. Mọi hiệu suất do alg.stop_wait_util /
#   alg.window_util tính. Hình dừng–chờ vẽ với t phóng to (không đúng tỉ lệ) để thấy được dải gói — ghi rõ trên màn hình.
objectives:
  - "Tính hiệu suất của dừng–chờ"
  - "Chọn kích thước cửa sổ đủ lấp đường truyền"
  - "Biết hai cách gửi lại khi mất gói"
asr_reviewed:
