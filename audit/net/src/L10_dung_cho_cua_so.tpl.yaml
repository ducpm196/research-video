  - {sentence: "Còn 10 gói phát trong 12 mi li giây, đủ lấp cả chu kỳ.", reason: "ASR chép “Còn 10 gói phát trong 12ml đủ lấp cả cho kỳ.” (0.786): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: chu/cho — NOT_VERIFIED bằng tai người"}
