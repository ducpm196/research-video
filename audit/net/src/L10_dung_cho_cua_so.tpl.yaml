  - {sentence: "Ba, kiểm ngược, 3751 nhân 0 phẩy 0 0 8 xấp xỉ 30 phẩy 0 0 8 mi li giây.", reason: "ASR chép “3751 nhân 0.008 xếp xỉ 30.008 mili giây”: mọi số đúng; xấp/xếp lệch vần"}
