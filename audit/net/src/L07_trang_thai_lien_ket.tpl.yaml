assumes: [arith, dots]
# Quy ước: tên Dijkstra chỉ ghi trên màn hình (lexicon_vi.CS112.yaml: mọi cách viết 0/8); lời đọc nói “thuật toán chốt đỉnh gần nhất”,
#   như CS112 bài 24. Bản đồ là bản đồ 5 đỉnh của CS112 bài 24, coi mỗi cạnh là liên kết HAI chiều cùng chi phí. Bảng chuyển tiếp do
#   alg.next_hops tính; cây tô xanh trong hình suy từ cùng kết quả (audit/net/graph_figs.py).
objectives:
  - "Hiểu bộ định tuyến phát tán trạng thái liên kết để ai cũng có cùng bản đồ"
  - "Chạy thuật toán chốt đỉnh gần nhất để lập bảng chuyển tiếp"
  - "Biết bảng chỉ ghi chặng kế tiếp, và vì sao chi phí theo tải gây dao động"
asr_reviewed:
  - {sentence: "Đáp án, ta chạy lại thuật toán từ S với liên kết S, B nay tốn 10.", reason: "ASR chép “Đáp án, ta chạy lại thuộc toán từ F với liên kết S, B này tốn 10.” (0.824): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: thuật/thuộc, nay/này — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước một, chốt S với khoảng cách 0.", reason: "ASR chép “Bước 1, chốt ét với khoảng cách 0.” (0.875): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, còn A tạm 3, C tạm 6, D tạm 9, nên chốt A với khoảng cách 3.", reason: "ASR chép “Bước 3 còn A tạm 3, C tạm 6, G tạm 9, nền chốt A với khoảng cách 3.” (0.895): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: nên/nền — NOT_VERIFIED bằng tai người"}
  - {sentence: "Kiểm bằng đường khác, không chạy thuật toán mà liệt kê hết mọi đường đơn từ S tới D, tức đường không ghé một bộ định tuyến hai lần.", reason: "ASR chép “Kiểm bằng đường khác, không chạy thuộc toán mà liệt kê hết mọi đường đơn từ S tới G, tức đường không ghé 1 bộ định tuyến 2 lần.” (0.931): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: thuật/thuộc — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ nhất, nghĩ bảng ghi cả đường đi.", reason: "ASR chép “Lội thứ nhất, nghĩ bản ghi cả đường đi”: lỗi/lội (cặp đã gặp ở TOC L06), bảng/bản âm cuối ng/n — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ví dụ tới B giờ đi S, A, B, tốn 4 cộng 2 bằng 6, nhỏ hơn 10 của liên kết thẳng.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Khi B nhận gói tới D, nó tự gửi tiếp qua A rồi C, đúng con đường mà S đã tính.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ai cũng cầm cùng một tấm bản đồ"
    steps:
      - show: |
          <p>Ở khoá thuật toán, ta tìm đường ngắn nhất khi đã có <b>cả</b> bản đồ. Trên Internet không ai đưa sẵn bản đồ: mỗi bộ định tuyến chỉ biết các liên kết của chính nó.</p>
          <p>Cách giải: mỗi bộ định tuyến <b>kể cho tất cả</b> về hàng xóm của mình, rồi ai cũng tự tính.</p>
          <div class="box key">Hôm nay: định tuyến trạng thái liên kết — phát tán, dựng bản đồ, chạy thuật toán chốt đỉnh gần nhất, lập bảng chuyển tiếp.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ở khoá thuật toán, ta tìm đường đi ngắn nhất khi đã có cả bản đồ. Trên Internet không ai đưa sẵn bản đồ, mỗi bộ định tuyến chỉ biết các liên kết của chính nó. Cách giải là mỗi bộ định tuyến kể cho tất cả về hàng xóm của mình, rồi ai cũng tự tính. Hôm nay ta học định tuyến trạng thái liên kết, gồm phát tán, dựng bản đồ, chạy thuật toán chốt đỉnh gần nhất, và lập bảng chuyển tiếp."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cộng dọc đường, giữ số nhỏ hơn"
    checks:
      - "1 + 2 == 3 and 3 < 4"
      - "sum(len(v) for v in alg.undirected([('S', 'A', 4), ('S', 'B', 1), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)]).values()) == 14 == 2 * 7 and 2 + 3 + 4 + 3 + 2 == 14"
      - "alg.undirected([('S', 'A', 4), ('S', 'B', 1), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)])['S'] == {'A': 4, 'B': 1} and alg.undirected([('S', 'A', 4), ('S', 'B', 1), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)])['D'] == {'B': 8, 'C': 3}"
    steps:
      - show: |
          <table class="t"><tr><th>từ S tới A</th><th>cộng dọc đường</th><th>chi phí</th></tr>
          <tr><td>đi thẳng S → A</td><td>4</td><td>4</td></tr>
          <tr><td>vòng S → B → A</td><td>$1 + 2$</td><td><b>3</b></td></tr></table>
          <p>$3 \lt 4$ → giữ đường vòng: <b>ít chặng chưa chắc rẻ</b>.</p>
        focus: [0, 0, "1.2", "1.3", 2]
        say: "Trước hết, ôn hai phép tính mà cả bài dùng đi dùng lại. Chi phí của một đường đi bằng tổng chi phí các liên kết nằm trên đường đó. Từ S tới A, đi thẳng thì tốn 4. Đi vòng qua B thì tốn 1 cộng 2, bằng 3. Ta giữ đường có tổng nhỏ hơn, ở đây là đường vòng tốn 3, dù nó đi qua nhiều chặng hơn."
      - show: |
          <table class="t"><tr><th>bộ định tuyến</th><th>hàng xóm (chi phí)</th><th>số mục</th></tr>
          <tr><td>S</td><td>A 4, B 1</td><td>2</td></tr>
          <tr><td>A</td><td>S 4, B 2, C 1</td><td>3</td></tr>
          <tr><td>B</td><td>S 1, A 2, C 5, D 8</td><td>4</td></tr>
          <tr><td>C</td><td>A 1, B 5, D 3</td><td>3</td></tr>
          <tr><td>D</td><td>B 8, C 3</td><td>2</td></tr></table>
          <p>$2 + 3 + 4 + 3 + 2 = 14$ mục, đúng bằng 2 lần 7 liên kết: mỗi liên kết hai chiều được ghi ở <b>hai</b> dòng.</p>
        focus: [0, 1, "1.2", 2]
        say: "Một bản đồ mạng gồm các bộ định tuyến và các liên kết có chi phí, giống đồ thị có trọng số ở khoá thuật toán. Bảng này ghi, với mỗi bộ định tuyến, các hàng xóm và chi phí tới từng hàng xóm. Ví dụ S có hai hàng xóm, A với chi phí 4 và B với chi phí 1. Cộng cột cuối được 2 cộng 3 cộng 4 cộng 3 cộng 2 bằng 14 mục, đúng bằng 2 lần 7 liên kết, vì mỗi liên kết hai chiều được ghi ở hai dòng."

  - id: sym
    kind: symbol
    title: "Giải mã: trạng thái liên kết và bảng chuyển tiếp"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>trạng thái liên kết</b></td><td>danh sách hàng xóm của một bộ định tuyến kèm chi phí mỗi liên kết</td></tr>
          <tr><td><b>phát tán</b></td><td>gửi gói trạng thái của mình cho <b>mọi</b> bộ định tuyến, qua từng hàng xóm</td></tr>
          <tr><td><b>bảng chuyển tiếp</b></td><td>với mỗi đích: gửi tới <b>hàng xóm nào</b> (chặng kế tiếp) — không ghi cả đường</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ba thuật ngữ cần nắm. Trạng thái liên kết là danh sách hàng xóm của một bộ định tuyến, kèm chi phí của mỗi liên kết. Phát tán là gửi gói trạng thái của mình tới mọi bộ định tuyến, chuyền qua từng hàng xóm. Bảng chuyển tiếp ghi, với mỗi đích, gói phải gửi tới hàng xóm nào, gọi là chặng kế tiếp, chứ không ghi cả đường đi."

  # ───────────────────────── 3. NHẮC THUẬT TOÁN ─────────────────────────
  - id: algo
    kind: concept
    title: "Nhắc lại: thuật toán chốt đỉnh gần nhất"
    steps:
      - show: |
          <div>{{RT_MAP}}</div>
          <ol><li>Gốc có khoảng cách 0, mọi đỉnh khác là vô cùng.</li>
          <li>Lặp: <b>chốt</b> đỉnh chưa chốt có khoảng cách nhỏ nhất; cập nhật hàng xóm của nó nếu đi qua nó ngắn hơn.</li>
          <li>Đỉnh đã chốt thì khoảng cách không bao giờ giảm nữa (chi phí không âm).</li></ol>
        focus: [1, "2.1", "2.2", "2.3"]
        say: "Bản đồ năm bộ định tuyến này chính là bản đồ ở khoá thuật toán, giờ mỗi liên kết dùng được hai chiều. Thuật toán chốt đỉnh gần nhất bắt đầu với gốc có khoảng cách 0, mọi đỉnh khác là vô cùng. Mỗi vòng, chốt đỉnh chưa chốt có khoảng cách nhỏ nhất, rồi cập nhật các hàng xóm nếu đi qua nó ngắn hơn. Vì chi phí không âm, đỉnh đã chốt thì khoảng cách không bao giờ giảm nữa."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Bảng chuyển tiếp của S"
    checks:
      - "alg.dijkstra(alg.undirected([('S', 'A', 4), ('S', 'B', 1), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)]), 'S')[1] == [('S', 0), ('B', 1), ('A', 3), ('C', 4), ('D', 7)]"
      - "[tuple(s[v] for v in 'AC') for s in alg.dijkstra(alg.undirected([('S', 'A', 4), ('S', 'B', 1), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)]), 'S')[2][1:3]] == [(3, 6), (3, 4)] and alg.dijkstra(alg.undirected([('S', 'A', 4), ('S', 'B', 1), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)]), 'S')[2][1]['D'] == 9"
      - "0 + 4 == 4 and 0 + 1 == 1 and 1 + 2 == 3 < 4 and 1 + 5 == 6 and 1 + 8 == 9 and 3 + 1 == 4 < 6 and 4 + 3 == 7 < 9"
      - "alg.next_hops(alg.undirected([('S', 'A', 4), ('S', 'B', 1), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)]), 'S') == {'A': ('B', 3), 'B': ('B', 1), 'C': ('B', 4), 'D': ('B', 7)}"
      - "1 + 2 + 1 + 3 == 7 and 1 + 2 == 3 < 4"
    steps:
      - show: |
          <div class="code"><div>liên kết: S–A 4, S–B 1, A–C 1, A–B 2, B–C 5, B–D 8, C–D 3</div></div>
          <p><b>Bước 1 — chốt S</b> (khoảng cách 0): hàng xóm A tạm $0 + 4 = 4$, B tạm $0 + 1 = 1$.</p>
        focus: [1, 2, 2]
        say: "Ta chạy thuật toán từ S, từng vòng một, trên bản đồ có bảy liên kết ghi ở dòng trên. Bước một, chốt S với khoảng cách 0. Hai hàng xóm của S được tạm tính, A là 0 cộng 4 bằng 4, B là 0 cộng 1 bằng 1."
      - show: |
          <p><b>Bước 2 — chốt B</b> (1 nhỏ hơn 4): A: $1 + 2 = 3 \lt 4$ → sửa thành 3; C: $1 + 5 = 6$; D: $1 + 8 = 9$.</p>
        say: "Bước hai, trong các đỉnh chưa chốt, B có khoảng cách 1, nhỏ hơn 4 của A, nên chốt B. Đi qua B tới A tốn 1 cộng 2 bằng 3, nhỏ hơn 4, nên sửa A thành 3. Tới C qua B tốn 1 cộng 5 bằng 6, tới D qua B tốn 1 cộng 8 bằng 9."
      - show: |
          <p><b>Bước 3 — chốt A</b> (3 nhỏ nhất trong 3, 6, 9): C: $3 + 1 = 4 \lt 6$ → sửa thành 4.</p>
        say: "Bước ba, còn A tạm 3, C tạm 6, D tạm 9, nên chốt A với khoảng cách 3. Đi qua A tới C tốn 3 cộng 1 bằng 4, nhỏ hơn 6, nên sửa C thành 4."
      - show: |
          <p><b>Bước 4 — chốt C</b> (4 nhỏ hơn 9): D: $4 + 3 = 7 \lt 9$ → sửa thành 7; cuối cùng chốt D với 7.</p>
        say: "Bước bốn, chốt C với khoảng cách 4, nhỏ hơn 9 của D. Đi qua C tới D tốn 4 cộng 3 bằng 7, nhỏ hơn 9, nên sửa D thành 7. Chỉ còn D, ta chốt nốt D với khoảng cách 7."
      - clear: true
        show: |
          <div>{{RT_TREE}}</div>
          <table class="t"><tr><th>đích</th><th>A</th><th>B</th><th>C</th><th>D</th></tr>
          <tr><td>chi phí</td><td>3</td><td>1</td><td>4</td><td>7</td></tr>
          <tr><td>chặng kế tiếp</td><td><b>B</b></td><td><b>B</b></td><td><b>B</b></td><td><b>B</b></td></tr></table>
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Chạy thuật toán từ S, cây đường đi ngắn nhất là các cạnh tô xanh. Chi phí tới A, B, C, D lần lượt là 3, 1, 4 và 7. Đường tới A đi qua B, vì 1 cộng 2 bằng 3, nhỏ hơn liên kết trực tiếp có chi phí 4. Vì thế cả bốn đích đều có chặng kế tiếp là B, bảng của S chỉ cần một cột thông tin này."
      - show: |
          <div class="box key">Mỗi bộ định tuyến chạy <b>cùng</b> thuật toán trên <b>cùng</b> bản đồ, nên các bảng khớp nhau: B nhận gói tới D sẽ tự gửi tiếp qua A, rồi C, đúng đường đã tính ở S.</div>
        say: "Mỗi bộ định tuyến chạy cùng thuật toán trên cùng bản đồ, nên các bảng khớp nhau. Khi B nhận gói tới D, nó tự gửi tiếp qua A rồi C, đúng con đường mà S đã tính."

  # ───────────────────────── 5. BẢNG CỦA D ─────────────────────────
  - id: tableD
    kind: concept
    title: "Một bộ định tuyến khác, một bảng khác"
    checks:
      - "alg.next_hops(alg.undirected([('S', 'A', 4), ('S', 'B', 1), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)]), 'D') == {'A': ('C', 4), 'B': ('C', 6), 'C': ('C', 3), 'S': ('C', 7)}"
      - "3 + 1 + 2 == 6 < 8"
    steps:
      - show: |
          <table class="t"><tr><th>bảng của D: đích</th><th>A</th><th>B</th><th>C</th><th>S</th></tr>
          <tr><td>chi phí</td><td>4</td><td>6</td><td>3</td><td>7</td></tr>
          <tr><td>chặng kế tiếp</td><td>C</td><td>C</td><td>C</td><td>C</td></tr></table>
          <p>D có liên kết thẳng tới B (chi phí 8), nhưng đi qua C, A tới B chỉ tốn $3 + 1 + 2 = 6$.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bảng của D thì khác. Chi phí tới A, B, C, S là 4, 6, 3 và 7. Mọi đích đều gửi qua C. Dù D có liên kết thẳng tới B với chi phí 8, đi qua C rồi A tới B chỉ tốn 3 cộng 1 cộng 2 bằng 6."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "3 + 4 == 7"
      - "sorted([4 + 1 + 3, 1 + 8, 1 + 5 + 3, 1 + 2 + 1 + 3, 4 + 2 + 8, 4 + 2 + 5 + 3, 4 + 1 + 5 + 8]) == [7, 8, 9, 9, 14, 14, 18]"
      - "alg.shortest_brute(alg.undirected([('S', 'A', 4), ('S', 'B', 1), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)]), 'S', 'D') == 7"
    steps:
      - show: |
          <table class="t"><tr><th>đường đơn từ S tới D</th><th>cộng chi phí</th><th>tổng</th></tr>
          <tr><td><b>S, B, A, C, D</b></td><td>$1 + 2 + 1 + 3$</td><td><b>7</b></td></tr>
          <tr><td>S, A, C, D</td><td>$4 + 1 + 3$</td><td>8</td></tr>
          <tr><td>S, B, D</td><td>$1 + 8$</td><td>9</td></tr>
          <tr><td>S, B, C, D</td><td>$1 + 5 + 3$</td><td>9</td></tr>
          <tr><td>S, A, B, D</td><td>$4 + 2 + 8$</td><td>14</td></tr>
          <tr><td>S, A, B, C, D</td><td>$4 + 2 + 5 + 3$</td><td>14</td></tr>
          <tr><td>S, A, C, B, D</td><td>$4 + 1 + 5 + 8$</td><td>18</td></tr></table>
        focus: [0, 1, "1.2", "1.2"]
        say: "Kiểm bằng đường khác, không chạy thuật toán mà liệt kê hết mọi đường đơn từ S tới D, tức đường không ghé một bộ định tuyến hai lần. Bản đồ nhỏ nên chỉ có 7 đường, mỗi dòng cộng chi phí dọc đường như bảng. Đường rẻ nhất là S, B, A, C, D, tốn 1 cộng 2 cộng 1 cộng 3 bằng 7, đúng bằng con số thuật toán tìm ra. Chặng đầu của đường đó là B, khớp với cột chặng kế tiếp trong bảng của S."
      - clear: true
        show: |
          <table class="t"><tr><th>ba phép tự kiểm</th></tr>
          <tr><td><b>Cộng dọc đường:</b> S tới D đi S, B, A, C, D: $1 + 2 + 1 + 3 = 7$, đúng bằng chi phí trong bảng.</td></tr>
          <tr><td><b>Hai đầu khớp nhau:</b> chi phí D tới S bằng S tới D (liên kết hai chiều cùng chi phí).</td></tr>
          <tr><td><b>Mỗi chặng kế tiếp là hàng xóm thật:</b> S chỉ có hàng xóm A và B, nên bảng chỉ có thể ghi A hoặc B.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, cộng dọc đường, S tới D đi qua B, A, C, tổng 1 cộng 2 cộng 1 cộng 3 bằng 7, đúng bằng chi phí trong bảng. Hai, hai đầu phải khớp nhau, chi phí từ D tới S bằng từ S tới D, vì mỗi liên kết có cùng chi phí hai chiều. Ba, chặng kế tiếp phải là hàng xóm thật, S chỉ có hàng xóm A và B, nên bảng chỉ có thể ghi A hoặc B."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ bảng ghi cả đường đi <b class="red">(sai)</b>
          <br><span class="note">Chỉ chặng kế tiếp. Phần còn lại của đường do các bộ định tuyến sau tự quyết, nhờ ai cũng tính trên cùng bản đồ.</span></div>
        say: "Lỗi thứ nhất, nghĩ bảng ghi cả đường đi. Bảng chỉ ghi chặng kế tiếp, phần còn lại do các bộ định tuyến sau tự quyết, nhờ ai cũng tính trên cùng một bản đồ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên chi phí của việc phát tán <b class="red">(thiếu)</b>
          <br><span class="note">Mỗi khi một liên kết đổi, gói trạng thái phải tới <b>mọi</b> bộ định tuyến, và mọi bộ phải tính lại — mạng lớn được chia thành nhiều vùng để giới hạn việc này.</span></div>
        say: "Lỗi thứ hai, quên chi phí của việc phát tán. Mỗi khi một liên kết thay đổi, gói trạng thái phải tới mọi bộ định tuyến, và bộ nào cũng phải tính lại, nên mạng lớn được chia thành nhiều vùng để giới hạn việc này."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đặt chi phí bằng tải hiện tại của liên kết <b class="red">(gây dao động)</b>
          <br><span class="note">Mọi người dồn sang đường đang vắng → đường đó thành đông → lần tính sau lại dồn sang đường kia, lặp mãi. Chi phí nên ổn định.</span></div>
          <table class="t"><tr><th>lần tính</th><th>đường X</th><th>đường Y</th><th>mọi gói chọn</th></tr>
          <tr><td>1</td><td>vắng</td><td>đông</td><td>X</td></tr><tr><td>2</td><td>đông</td><td>vắng</td><td>Y</td></tr><tr><td>3</td><td>vắng</td><td>đông</td><td>X</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ ba, đặt chi phí bằng tải hiện tại của liên kết. Mọi người dồn sang đường đang vắng, đường đó thành đông, lần tính sau lại dồn sang đường kia, cứ thế dao động mãi, nên chi phí cần ổn định. Bảng nhỏ bên dưới cho thấy hai đường X và Y đổi vai sau mỗi lần tính, lần lẻ mọi gói dồn sang X, lần chẵn lại dồn sang Y."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ mọi bản đồ luôn giống nhau <b class="red">(chỉ khi đã ổn định)</b>
          <br><span class="note">Trong lúc gói trạng thái còn đang lan, hai bộ định tuyến có thể cầm hai bản đồ khác nhau và tạm thời đá gói qua lại.</span></div>
        say: "Lỗi thứ tư, nghĩ các bản đồ luôn giống nhau. Điều đó chỉ đúng khi mạng đã ổn định, trong lúc gói trạng thái còn đang lan, hai bộ định tuyến có thể cầm hai bản đồ khác nhau và tạm thời đá gói qua lại."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.dijkstra(alg.undirected([('S', 'A', 4), ('S', 'B', 10), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)]), 'S')[1] == [('S', 0), ('A', 4), ('C', 5), ('B', 6), ('D', 8)]"
      - "4 + 2 == 6 < 10 and 4 + 1 == 5 and 5 + 3 == 8 and 5 + 5 == 10 > 6 and 6 + 8 == 14 > 8"
      - "(lambda g: alg.next_hops(g, 'S'))({**alg.undirected([('S', 'A', 4), ('S', 'B', 10), ('A', 'C', 1), ('A', 'B', 2), ('B', 'C', 5), ('B', 'D', 8), ('C', 'D', 3)])}) == {'A': ('A', 4), 'B': ('A', 6), 'C': ('A', 5), 'D': ('A', 8)}"
    steps:
      - show: |
          <div>{{RT_QUIZ}}</div>
          <p>Liên kết S–B bị nghẽn, chi phí tăng từ 1 lên 10. Lập lại bảng chuyển tiếp của S.</p>
        focus: [1, 2, 0]
        say: "Bây giờ đến lượt bạn tự làm. Liên kết giữa S và B bị nghẽn, chi phí tăng từ 1 lên 10, hãy lập lại bảng chuyển tiếp của S. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p><b>Chạy từng vòng</b> (S–B nay là 10):</p>
          <table class="t"><tr><th>chốt</th><th>tính lại</th></tr>
          <tr><td>S (0)</td><td>A tạm 4, B tạm 10</td></tr>
          <tr><td>A (4)</td><td>B: $4 + 2 = 6 \lt 10$; C: $4 + 1 = 5$</td></tr>
          <tr><td>C (5)</td><td>D: $5 + 3 = 8$; B: $5 + 5 = 10$, không nhỏ hơn 6</td></tr>
          <tr><td>B (6)</td><td>D: $6 + 8 = 14$, không nhỏ hơn 8</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Đáp án, ta chạy lại thuật toán từ S với liên kết S, B nay tốn 10. Chốt S, tạm có A bằng 4, B bằng 10. Chốt A với 4, đi qua A tới B tốn 4 cộng 2 bằng 6, nhỏ hơn 10, còn tới C tốn 4 cộng 1 bằng 5. Chốt C với 5, tới D tốn 5 cộng 3 bằng 8, còn đường qua C tới B tốn 10, không tốt hơn 6. Chốt B với 6, tới D qua B tốn 6 cộng 8 bằng 14, không tốt hơn 8, nên D chốt với 8."
      - show: |
          <table class="t"><tr><th>đích</th><th>A</th><th>B</th><th>C</th><th>D</th></tr>
          <tr><td>chi phí</td><td>4</td><td>6</td><td>5</td><td>8</td></tr>
          <tr><td>chặng kế tiếp</td><td><b>A</b></td><td><b>A</b></td><td><b>A</b></td><td><b>A</b></td></tr></table>
          <p>Tới B giờ đi S, A, B: $4 + 2 = 6 \lt 10$. Mọi đích chuyển sang chặng kế tiếp A.</p>
        focus: [1, 2]
        say: "Gom lại, chi phí tới A, B, C, D là 4, 6, 5 và 8, và mọi đích chuyển sang chặng kế tiếp A. Ví dụ tới B giờ đi S, A, B, tốn 4 cộng 2 bằng 6, nhỏ hơn 10 của liên kết thẳng."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mỗi bộ kể về hàng xóm</span><span class="a">→</span>
          <span class="n">phát tán: ai cũng có bản đồ</span><span class="a">→</span>
          <span class="n">chốt đỉnh gần nhất</span><span class="a">→</span>
          <span class="n">bảng: chặng kế tiếp</span></div>
        say: "Tổng kết lại, mỗi bộ định tuyến kể về hàng xóm của mình và phát tán, để ai cũng có cùng bản đồ. Rồi mỗi bộ chạy thuật toán chốt đỉnh gần nhất, và ghi chặng kế tiếp vào bảng chuyển tiếp."
      - show: |
          <div class="box key"><b>Tư duy:</b> cho mọi bên cùng dữ liệu và cùng thuật toán, chúng tự đi tới quyết định nhất quán mà không cần một trung tâm ra lệnh.</div>
        say: "Điều cần mang theo, khi mọi bên có cùng dữ liệu và cùng thuật toán, chúng tự đi tới quyết định nhất quán mà không cần một trung tâm ra lệnh."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): cách ngược lại, mỗi bộ chỉ nói chuyện với hàng xóm — <b>vector khoảng cách</b>, và hiện tượng <b>đếm tới vô cùng</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta xem cách ngược lại, khi mỗi bộ định tuyến chỉ nói chuyện với hàng xóm, gọi là định tuyến véc-tơ khoảng cách, và hiện tượng đếm tới vô cùng. Hẹn gặp bạn ở bài tiếp theo."
