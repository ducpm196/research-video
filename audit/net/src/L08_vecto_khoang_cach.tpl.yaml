id: L08
course: NET
series: "NET · Mạng máy tính"
title: "Bài 8 — Định tuyến vector khoảng cách và đếm tới vô cùng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/net.yaml L08; audit/net/verify_net.py L08; CS112 bài 24 (Bellman-Ford); RFC 2453 (RIP, vô cùng = 16); J. Kurose, K. Ross, mục 5.2.2"
assumes: [arith, sub, dots]
# Quy ước: D_x(y) = ước lượng chi phí nhỏ nhất từ x tới y mà x đang tin; c(x, v) = chi phí liên kết x–v. Tên Bellman-Ford chỉ ghi
#   trên màn hình (lexicon_vi.CS112.yaml: NOT_VERIFIED). Mọi vòng cập nhật do alg.count_to_infinity mô phỏng ĐỒNG THỜI (B và C cùng
#   dùng vector của nhau ở vòng trước); 16 là “vô cùng” của RIP.
objectives:
  - "Cập nhật vector khoảng cách bằng phương trình Bellman-Ford"
  - "Giải thích đếm tới vô cùng trên mạng ba nút"
  - "Thấy đầu độc ngược sửa được trường hợp hai nút, và giới hạn của nó"
asr_reviewed:
  - {sentence: "Khi liên kết đứt, B nghe C báo vô cùng nên biết ngay ở vòng 1, còn C biết ở vòng 2.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Chào bạn, ở cách định tuyến hôm nay, mỗi bộ định tuyến chỉ nói với hàng xóm của mình, tôi tới A mất bao nhiêu.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tin xấu đi chậm"
    checks:
      - "alg.count_to_infinity(20)[15] == (16, 16) and alg.count_to_infinity(20)[14] != (16, 16)"
    steps:
      - show: |
          <div>{{DV_CUT}}</div>
          <p>Mỗi bộ định tuyến chỉ nói với hàng xóm: “tôi tới A mất bao nhiêu”. Liên kết A–B đứt — vậy mà B và C phải nói qua lại <b>15 vòng</b> mới cùng chịu rằng A không tới được.</p>
          <div class="box key">Hôm nay: định tuyến vector khoảng cách, phương trình cập nhật, và hiện tượng đếm tới vô cùng.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, ở cách định tuyến hôm nay, mỗi bộ định tuyến chỉ nói với hàng xóm của mình, tôi tới A mất bao nhiêu. Liên kết giữa A và B bị đứt. Vậy mà B và C phải nói qua lại 15 vòng mới cùng chịu rằng A không tới được nữa. Hôm nay ta học định tuyến véc-tơ khoảng cách, phương trình cập nhật, và hiện tượng đếm tới vô cùng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: thử một đường mới, và con số “vô cùng”"
    checks:
      - "2 + 3 == 5 < 7 and 5 + 4 == 9 > 7"
      - "min(16, 15 + 1) == 16 and min(16, 16 + 1) == 16 and min(16, 14 + 1) == 15"
    steps:
      - show: |
          <table class="t"><tr><th>đang tin tới đích</th><th>hàng xóm cách</th><th>hàng xóm báo</th><th>thử</th><th>quyết định</th></tr>
          <tr><td>7</td><td>2</td><td>3</td><td>$2 + 3 = 5$</td><td>5 nhỏ hơn 7 → sửa thành <b>5</b></td></tr>
          <tr><td>7</td><td>5</td><td>4</td><td>$5 + 4 = 9$</td><td>9 lớn hơn 7 → giữ <b>7</b></td></tr></table>
        focus: [0, 1, "1.2", "1.3"]
        say: "Trước hết, ôn phép thử một đường mới mà ta đã gặp ở khoá thuật toán, khi tìm đường ngắn nhất bằng cách nới từng cạnh. Mỗi dòng của bảng bắt đầu từ việc ta đang tin đường tới đích tốn 7. Ở dòng đầu, một hàng xóm cách 2 báo nó tới đích mất 3, thử 2 cộng 3 bằng 5, nhỏ hơn 7, nên sửa thành 5. Ở dòng sau, hàng xóm cách 5 báo 4, thử 5 cộng 4 bằng 9, lớn hơn 7, nên giữ nguyên 7."
      - show: |
          <table class="t"><tr><th>con số</th><th>nghĩa</th></tr>
          <tr><td>1 tới 15</td><td>số chặng thật tới đích (mỗi liên kết tốn 1)</td></tr>
          <tr><td>16</td><td><b>vô cùng</b>: không tới được</td></tr>
          <tr><td>$15 + 1 = 16$, $16 + 1$</td><td>đều ghi <b>16</b> — không có số nào lớn hơn vô cùng</td></tr></table>
        focus: [0, 0, "1.2", "1.3", "1.4"]
        say: "Trong ví dụ chính của bài, mỗi liên kết tốn 1, nên chi phí chính là số chặng tới đích. Cách định tuyến này cần một con số mang nghĩa không tới được, gọi là vô cùng. Các số từ 1 tới 15 là số chặng thật. Con số 16 được quy ước là vô cùng. Vì thế 15 cộng 1 cho 16, tức không tới được, còn 16 cộng 1 vẫn ghi là 16."

  - id: sym
    kind: symbol
    title: "Giải mã: phương trình Bellman-Ford"
    checks:
      - "min(1 + 4, 5 + 2) == 5"
    steps:
      - show: |
          <p>$D_x(y)$ = chi phí nhỏ nhất từ $x$ tới $y$ mà $x$ <b>đang tin</b>. $c(x, v)$ = chi phí liên kết từ $x$ tới hàng xóm $v$.</p>
          <div class="box key">$D_x(y) = \min_{v} \big( c(x, v) + D_v(y) \big)$ — đi tới hàng xóm $v$, rồi dùng con số mà $v$ báo.</div>
          <p>Ví dụ: hàng xóm $v_1$ cách 1 và báo 4; hàng xóm $v_2$ cách 5 và báo 2. Vậy $D_x(y) = \min(1 + 4, 5 + 2) = 5$, đi qua $v_1$.</p>
        introduces: [min_fn]
        focus: [1, 1, 2, 3, 3]
        say: "D x của y là chi phí nhỏ nhất từ x tới y mà x đang tin. C của x và v là chi phí liên kết từ x tới hàng xóm v. Phương trình cập nhật nói, x thử từng hàng xóm v, đi tới v rồi cộng con số mà v báo, và lấy giá trị nhỏ nhất. Ví dụ hàng xóm thứ nhất cách 1 và báo 4, hàng xóm thứ hai cách 5 và báo 2. Vậy D bằng số nhỏ hơn trong 5 và 7, tức 5, đi qua hàng xóm thứ nhất."

  # ───────────────────────── 3. ĐẾM TỚI VÔ CÙNG ─────────────────────────
  - id: example
    kind: example
    title: "Đếm tới vô cùng trên A — B — C"
    checks:
      - "alg.count_to_infinity(6)[:5] == [(1, 2), (3, 2), (3, 4), (5, 4), (5, 6)]"
      - "alg.count_to_infinity(20)[15] == (16, 16)"
      - "1 + 2 == 3 and 1 + 1 == 2 and 1 + 3 == 4 and 1 + 4 == 5"
    steps:
      - show: |
          <div>{{DV_LINE}}</div>
          <p>Trước khi đứt: $D_B(A) = 1$, $D_C(A) = 2$ (C đi qua B).</p>
        say: "Trước khi đứt, B tới A mất 1, còn C tới A mất 2, và đường của C đi qua B."
      - clear: true
        show: |
          <div>{{DV_CUT}}</div>
          <table class="t"><tr><th>vòng</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>…</th><th>15</th></tr>
          <tr><td>$D_B(A)$</td><td>1</td><td>3</td><td>3</td><td>5</td><td>5</td><td>…</td><td>16</td></tr>
          <tr><td>$D_C(A)$</td><td>2</td><td>2</td><td>4</td><td>4</td><td>6</td><td>…</td><td>16</td></tr></table>
        focus: [1, 2]
        say: "Liên kết A, B đứt, bảng ghi khoảng cách tới A sau mỗi vòng. Mỗi vòng, B và C cùng lúc tính lại, dùng con số mà hàng xóm báo ở vòng trước."
      - clear: true
        show: |
          <table class="t"><tr><th>vòng</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>$D_B(A)$</td><td>1</td><td>3</td><td>3</td><td>5</td></tr>
          <tr><td>$D_C(A)$</td><td>2</td><td>2</td><td>4</td><td>4</td></tr></table>
          <p><b>Bước 1 — vòng 1, B:</b> đường thẳng tới A đã mất; hàng xóm duy nhất là C, báo 2 (C không biết đường đó đi <b>qua chính B</b>) → $D_B(A) = 1 + 2 = 3$.</p>
        focus: [1, 2, 2]
        say: "Ta soi bốn ô đầu của bảng, từng bước một. Bước một, ở vòng 1, B mất đường thẳng, chỉ còn nghe C báo 2. Nhưng C không biết đường của nó đi qua chính B, nên B tin 1 cộng 2 bằng 3."
      - show: |
          <p><b>Bước 2 — vòng 1, C:</b> tính cùng lúc với B, nên dùng số B báo ở vòng 0 là 1 → $D_C(A) = 1 + 1 = 2$, chưa đổi.</p>
        say: "Bước hai, cũng ở vòng 1, C tính cùng lúc với B, nên vẫn dùng con số cũ mà B báo ở vòng 0, là 1. Vậy C tin 1 cộng 1 bằng 2, chưa có gì thay đổi."
      - show: |
          <p><b>Bước 3 — vòng 2:</b> C nghe B báo 3 → $D_C(A) = 1 + 3 = 4$; B nghe C báo 2 → vẫn $1 + 2 = 3$.</p>
        say: "Bước ba, ở vòng 2, C nghe B báo 3, nên tin 1 cộng 3 bằng 4. Còn B nghe C báo con số 2 của vòng 1, nên vẫn tin 1 cộng 2 bằng 3."
      - show: |
          <p><b>Bước 4 — vòng 3:</b> B nghe C báo 4 → $D_B(A) = 1 + 4 = 5$; C vẫn 4. Cứ thế mỗi bên tăng 2 sau mỗi hai vòng, tới 16 thì dừng.</p>
        say: "Bước bốn, ở vòng 3, B nghe C báo 4, nên tin 1 cộng 4 bằng 5, còn C vẫn là 4. Cứ thế mỗi bên tăng thêm 2 sau mỗi hai vòng, tới 16, con số được coi là vô cùng, thì mới dừng."

  # ───────────────────────── 4. ĐẦU ĐỘC NGƯỢC ─────────────────────────
  - id: poison
    kind: concept
    title: "Đầu độc ngược"
    checks:
      - "alg.count_to_infinity(3, poison=True)[:3] == [(1, 2), (16, 2), (16, 16)]"
    steps:
      - show: |
          <p>Quy tắc: nếu đường của C tới A đi <b>qua B</b>, thì C báo cho B rằng “tôi tới A mất vô cùng”.</p>
          <p>Liên kết đứt: B nghe C báo vô cùng → $D_B(A) = 16$ ngay vòng 1; C nghe B → 16 ở vòng 2. Hết đếm.</p>
          <table class="t"><tr><th>vòng</th><th>0</th><th>1</th><th>2</th></tr><tr><td>$D_B(A)$</td><td>1</td><td>16</td><td>16</td></tr><tr><td>$D_C(A)$</td><td>2</td><td>2</td><td>16</td></tr></table>
          <div class="box warn">Chỉ chữa được vòng lặp giữa <b>hai</b> nút. Vòng lặp qua ba nút trở lên vẫn có thể đếm tới vô cùng.</div>
        focus: [1, 1, 3, 4, 4]
        say: "Cách sửa thứ nhất là đầu độc ngược. Nếu đường của C tới A đi qua B, thì C báo cho B rằng tôi tới A mất vô cùng. Khi liên kết đứt, B nghe C báo vô cùng nên biết ngay ở vòng 1, còn C biết ở vòng 2. Nhưng cách này chỉ chữa được vòng lặp giữa hai nút. Vòng lặp qua ba nút trở lên vẫn có thể đếm tới vô cùng."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "all(alg.count_to_infinity(20)[r][0] == min(16, r + 2) for r in range(1, 20, 2))"
      - "all(alg.count_to_infinity(20)[r][1] == min(16, r + 2) for r in range(2, 20, 2))"
      - "1 + 2 == 3 and 3 + 2 == 5 and 13 + 2 == 15 and 15 + 2 == 17 and 2 + 2 == 4 and 14 + 2 == 16"
    steps:
      - show: |
          <table class="t"><tr><th>quy luật</th><th>thử với bảng</th><th>đi tới cuối</th></tr>
          <tr><td>vòng lẻ $r$: $D_B(A) = r + 2$</td><td>vòng 1: $1 + 2 = 3$ ✓; vòng 3: $3 + 2 = 5$ ✓</td><td>vòng 13: 15; vòng 15: $15 + 2 = 17$ → ghi <b>16</b></td></tr>
          <tr><td>vòng chẵn $r$: $D_C(A) = r + 2$</td><td>vòng 2: $2 + 2 = 4$ ✓</td><td>vòng 14: $14 + 2 = 16$</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Kiểm bằng đường khác, thay vì chép bảng từng vòng, ta tìm quy luật rồi nhảy thẳng tới cuối. Ở vòng lẻ r, B tin khoảng cách bằng r cộng 2, thử với vòng 1 được 3, với vòng 3 được 5, khớp bảng. Đi tới vòng 13, B tin 15, tới vòng 15 thì 15 cộng 2 bằng 17, vượt vô cùng nên ghi 16. Ở vòng chẵn r, C tin r cộng 2, nên tới vòng 14 thì C chạm 16. Vậy từ vòng 15 cả hai cùng ghi 16, đúng con số 15 vòng ở đầu bài."
      - clear: true
        show: |
          <table class="t"><tr><th>ba thói quen tự kiểm</th></tr>
          <tr><td><b>Mỗi ô của bảng</b> = chi phí liên kết + con số hàng xóm báo ở <b>vòng trước</b>: $D_C(A)$ vòng 2 $= 1 + D_B(A)$ vòng 1 $= 1 + 3$.</td></tr>
          <tr><td><b>Hỏi “đường này đi qua ai?”</b> — tin của C về A vô giá trị với B nếu nó đi qua B.</td></tr>
          <tr><td><b>So với trạng thái liên kết:</b> ở đó B biết cả bản đồ, thấy ngay A bị cô lập.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, mỗi ô của bảng bằng chi phí liên kết cộng con số hàng xóm báo ở vòng trước, ví dụ C ở vòng 2 bằng 1 cộng 3 của B ở vòng 1. Hai, luôn hỏi đường này đi qua ai, vì tin của C về A vô giá trị với B nếu nó đi qua B. Ba, so với định tuyến trạng thái liên kết, ở đó B có cả bản đồ, nên thấy ngay A bị cô lập."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.count_to_infinity(1)[1][1] == 1 + 1 == 2 and 1 + 3 == 4"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ tin nào cũng lan chậm <b class="red">(sai)</b>
          <br><span class="note">Tin <b>tốt</b> (một đường mới ngắn hơn) lan nhanh: mỗi vòng một chặng. Chỉ tin <b>xấu</b> mới gây đếm dần lên.</span></div>
        say: "Lỗi thứ nhất, nghĩ tin nào cũng lan chậm. Tin tốt, như một đường mới ngắn hơn, lan nhanh, mỗi vòng thêm một chặng, chỉ tin xấu mới gây đếm dần lên."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tin đầu độc ngược giải quyết mọi trường hợp <b class="red">(sai)</b>
          <br><span class="note">Với vòng ba nút, mỗi nút nghe tin từ một nút không nằm trên đường của mình. Vì vậy cần thêm giới hạn “vô cùng = 16”.</span></div>
        say: "Lỗi thứ hai, tin đầu độc ngược giải quyết mọi trường hợp. Với vòng ba nút, mỗi nút nghe tin từ một nút không nằm trên đường của mình, nên vẫn cần thêm giới hạn vô cùng bằng 16."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên rằng bảng dùng số của <b>vòng trước</b> <b class="red">(tính sai bảng)</b>
          <br><span class="note">Trong mô hình đồng thời, mọi nút cập nhật cùng lúc từ vector cũ của hàng xóm. Dùng số mới của vòng hiện tại sẽ ra dãy khác.</span></div>
          <table class="t"><tr><th>vòng 1, C tính từ</th><th>$D_C(A)$</th></tr>
          <tr><td>số cũ của B (đúng mô hình): 1</td><td>$1 + 1 = 2$</td></tr>
          <tr><td>số mới của B (sai mô hình): 3</td><td>$1 + 3 = 4$</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ ba, quên rằng mỗi vòng dùng số của vòng trước. Trong mô hình đồng thời, mọi nút cập nhật cùng lúc từ véc-tơ cũ của hàng xóm, dùng số mới của vòng hiện tại sẽ ra một dãy khác. Ví dụ ở vòng 1, nếu C lấy ngay con số 3 mới của B thì ra 4, chứ không phải 2 như bảng đồng thời."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Coi 16 là chi phí thật <b class="red">(sai)</b>
          <br><span class="note">16 là quy ước “không tới được”. Hệ quả: mạng dùng cách này không được dài quá 15 chặng.</span></div>
        say: "Lỗi thứ tư, coi 16 là chi phí thật. 16 chỉ là quy ước không tới được, và hệ quả là mạng dùng cách này không được dài quá 15 chặng."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "min(2 + 3, 1 + 6, 4 + 0) == 4"
      - "min(2 + 3, 1 + 6) == 5"
    steps:
      - show: |
          <p>Bộ định tuyến $x$ có ba hàng xóm:</p>
          <table class="t"><tr><th>hàng xóm</th><th>$c(x, v)$</th><th>$v$ báo khoảng cách tới $y$</th></tr>
          <tr><td>$v_1$</td><td>2</td><td>3</td></tr><tr><td>$v_2$</td><td>1</td><td>6</td></tr><tr><td>$y$</td><td>4</td><td>0</td></tr></table>
          <p>① Tính $D_x(y)$ và chặng kế tiếp. ② Liên kết thẳng $x$–$y$ đứt (đường của $v_1$, $v_2$ tới $y$ không đi qua $x$): tính lại.</p>
        focus: [1, 2, 3, 3, 0]
        say: "Bây giờ đến lượt bạn tự làm. Bộ định tuyến x có ba hàng xóm như trong bảng, hàng xóm thứ ba chính là đích y. Hãy tính chi phí nhỏ nhất từ x tới y, và chặng kế tiếp. Câu hai, nếu liên kết thẳng từ x tới y bị đứt, và đường của v một, v hai tới y không đi qua x, thì kết quả mới là gì? Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <table class="t"><tr><th>đi qua</th><th>$c(x, v)$ + $v$ báo</th><th>tổng</th></tr>
          <tr><td>$v_1$</td><td>$2 + 3$</td><td>5</td></tr><tr><td>$v_2$</td><td>$1 + 6$</td><td>7</td></tr><tr><td>thẳng tới $y$</td><td>$4 + 0$</td><td>4</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đáp án, ta thử từng hàng xóm một. Đi qua v một tốn 2 cộng 3 bằng 5. Đi qua v hai tốn 1 cộng 6 bằng 7. Đi thẳng tới y tốn 4 cộng 0 bằng 4."
      - show: |
          <p>① $D_x(y) = \min(2 + 3, 1 + 6, 4 + 0) = \min(5, 7, 4) = \hl{4}$, chặng kế tiếp là <b>chính $y$</b> (liên kết thẳng).</p>
        say: "Câu một, ta lấy số nhỏ nhất trong 2 cộng 3, 1 cộng 6, và 4 cộng 0, tức nhỏ nhất của 5, 7 và 4, bằng 4. Chặng kế tiếp là chính y, đi bằng liên kết thẳng."
      - show: |
          <p>② Bỏ dòng “thẳng tới $y$”: $D_x(y) = \min(5, 7) = \hl{5}$, chặng kế tiếp đổi sang $v_1$. Đây là <b>tin xấu</b> được xử lý đúng, vì đường của $v_1$ không đi qua $x$.</p>
        say: "Câu hai, liên kết thẳng đứt thì bỏ dòng cuối của bảng, còn lại số nhỏ nhất của 5 và 7, bằng 5. Chặng kế tiếp đổi sang v một. Đây là một tin xấu được xử lý đúng ngay, vì con số v một báo không phải tin cũ của chính x quay về."

