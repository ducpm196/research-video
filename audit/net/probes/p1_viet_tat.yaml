name: net_p1_viet_tat
# Từ viết tắt của khoá NET (và “đen-ta” cho TOC L01–L02). Đọc BẢN CHÉP: bare() bỏ dấu và dấu cách rồi tìm chuỗi con,
#   nên khoá ngắn (“ip”, “mac”) dễ khớp giả — kết luận theo bản chép, không theo điểm.
ctx:
  - "Giao thức {} chạy trên mọi máy trong mạng."
  - "Ta dùng {} để gửi dữ liệu đi xa."
  - "Phần đầu của {} có nhiều trường."
  - "Hãy nhớ {} khi học phần này."
terms:
  - key: tcp
    variants: ["TCP", "tê xê pê", "ti xi pi"]
    negative: "tê xê ca"
    keys: ["tcp", "texepe", "tixipi", "tecepe", "tesepe"]
  - key: udp
    variants: ["UDP", "u đê pê", "diu đi pi"]
    negative: "u đê ca"
    keys: ["udp", "udepe", "diudipi", "udipi"]
  - key: ip
    variants: ["IP", "i pê", "ai pi"]
    negative: "i ca"
    keys: ["ip", "ipe", "aipi", "aipe"]
  - key: dns
    variants: ["DNS", "đê en ét", "đi en ét"]
