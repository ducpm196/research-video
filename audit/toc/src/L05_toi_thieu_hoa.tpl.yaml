id: L05
course: TOC
series: "TOC · Lý thuyết tính toán"
title: "Bài 5 — Tối thiểu hoá DFA"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/toc.yaml L05; audit/toc/verify_toc.py L05; J. Myhill (1957), A. Nerode (1958); J. Hopcroft, J. Ullman, Introduction to Automata Theory, mục 4.4"
assumes: [arith, sub, set, in, alpha, eps, strpow, delta, dots]
# Quy ước: trạng thái của máy 4 trạng thái đặt tên chữ thường s, a, b, c (và d không tới được) để không lẫn với A, AB, AC của bài 2.
#   Mọi lớp tương đương và cặp bị đánh dấu do alg.minimize (thuật toán lấp bảng) tính; ánh xạ sang máy bài 2 do check kiểm từng chuyển.
objectives:
  - "Hiểu hai trạng thái tương đương: mọi chuỗi đọc tiếp đều cho cùng kết quả"
  - "Chạy thuật toán đánh dấu cặp để gộp trạng thái"
  - "Biết DFA tối tiểu là duy nhất, sai khác tên trạng thái"
asr_reviewed:
  - {sentence: "Xuất phát từ trạng thái chẵn và đọc 1 0 1, máy đi chẵn, lẻ, lẻ, chẵn, nên nhận.", reason: "ASR chép “Xuất phát từ trạng thái chẳng và đọc 101. Máy đi chẳng, lẻ, lẻ, chẳng, nên nhận.” (0.769): lệch âm/thanh thuần Việt: chẵn/chẳng, không/trăm linh, chẵn/chẳng, chẵn/chẳng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Không chuỗi nào cho kết quả khác nhau, nên khớp với kết luận gộp s với c.", reason: "ASR chép “không chuổi nào cho kết quả khác nhau, nên khớp với kết luận gột F với C.” (0.824): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: chuỗi/chuổi, gộp (trong “gộp s” → “gột f”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Kết quả, 5 trong 6 cặp bị đánh dấu, chỉ còn một cặp trống là s với c.", reason: "ASR chép “Kết quả, 5 trong 6 cặp bị đánh dấu, chỉ còn 1 cặp trống là F với C.” (0.944): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Trạng thái a nghĩa là vừa đọc 0.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai máy, một ngôn ngữ"
    steps:
      - show: |
          <p>Một người thiết kế máy cho “kết thúc bằng $01$” với <b>5</b> trạng thái, trong đó có một trạng thái thừa. Ở bài 2, dựng tập con cho máy <b>3</b> trạng thái. Cả hai đều đúng.</p>
          <p>Có máy nào ít trạng thái hơn nữa không? Và có cách nào <b>tự động</b> bỏ phần thừa?</p>
          <div class="box key">Hôm nay: tối thiểu hoá — gộp các trạng thái “không phân biệt được”, và vì sao kết quả là <b>duy nhất</b>.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, một người thiết kế máy đơn định cho ngôn ngữ kết thúc bằng 0 1 với 5 trạng thái, trong đó có một trạng thái thừa. Ở bài 2, phép dựng tập con cho một máy 3 trạng thái, và cả hai máy đều đúng. Có máy nào ít trạng thái hơn nữa không, và có cách nào tự động bỏ phần thừa không? Hôm nay ta học tối thiểu hoá, gộp các trạng thái không phân biệt được, và vì sao kết quả là duy nhất."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chạy máy từ một trạng thái bất kỳ, đếm cặp"
    checks:
      - "alg.dfa_run({('C', '0'): 'C', ('C', '1'): 'L', ('L', '0'): 'L', ('L', '1'): 'C'}, 'C', {'C'}, '101') == (True, ['C', 'L', 'L', 'C'])"
      - "alg.dfa_run({('C', '0'): 'C', ('C', '1'): 'L', ('L', '0'): 'L', ('L', '1'): 'C'}, 'L', {'C'}, '101') == (False, ['L', 'C', 'C', 'L'])"
      - "len(list(__import__('itertools').combinations('sabc', 2))) == 6 == 4 * 3 // 2"
    steps:
      - show: |
          <table class="t"><tr><th>$\delta$</th><th>đọc 0</th><th>đọc 1</th></tr>
          <tr><td>C (chẵn, nhận)</td><td>C</td><td>L</td></tr>
          <tr><td>L (lẻ)</td><td>L</td><td>C</td></tr></table>
          <p>Từ C đọc $101$: C → L → L → C, <b>nhận</b>. Từ L đọc $101$: L → C → C → L, <b>từ chối</b>.</p>
        focus: [1, 1, 2, 2]
        say: "Ở bài 1, ta chạy máy đơn định bằng cách đọc từng ký hiệu rồi tra bảng chuyển đen-ta. Máy nhỏ này đếm số chữ 1, trạng thái chẵn là trạng thái nhận, đọc 1 thì đổi sang trạng thái kia. Xuất phát từ trạng thái chẵn và đọc 1 0 1, máy đi chẵn, lẻ, lẻ, chẵn, nên nhận. Cũng chuỗi đó nhưng xuất phát từ trạng thái lẻ thì máy đi lẻ, chẵn, chẵn, lẻ, nên từ chối."
      - show: |
          <div class="box key">Hôm nay ta chạy máy từ <b>mọi</b> trạng thái, không chỉ trạng thái đầu: cùng một chuỗi, hai điểm xuất phát, có thể ra hai kết quả.</div>
        say: "Hôm nay ta sẽ chạy máy từ mọi trạng thái, không chỉ từ trạng thái đầu. Như vừa thấy, cùng một chuỗi mà hai điểm xuất phát khác nhau thì có thể ra hai kết quả khác nhau."
      - show: |
          <p>Máy sắp gặp, sau khi bỏ trạng thái thừa, còn 4 trạng thái $s, a, b, c$. Ghép đôi không kể thứ tự:</p>
          <table class="t"><tr><td>$(s, a)$</td><td>$(s, b)$</td><td>$(s, c)$</td><td>$(a, b)$</td><td>$(a, c)$</td><td>$(b, c)$</td></tr></table>
          <p>Mỗi trạng thái ghép với 3 trạng thái kia: $4 \times 3 = 12$, mỗi cặp bị đếm hai lần, còn $12 : 2 = \hl{6}$ cặp.</p>
        focus: [2, 3, 3]
        say: "Việc thứ hai là đếm cặp, máy sắp gặp, sau khi bỏ trạng thái thừa, còn bốn trạng thái s, a, b, c, và bảng liệt kê mọi cách ghép đôi chúng, không kể thứ tự. Mỗi trạng thái ghép được với 3 trạng thái kia, 4 nhân 3 bằng 12. Nhưng mỗi cặp bị đếm hai lần, nên chỉ còn 12 chia 2, bằng 6 cặp."

  - id: sym
    kind: symbol
    title: "Giải mã: tương đương và phân biệt được"
    steps:
      - show: |
          <p>Hai trạng thái $p, q$ <b>phân biệt được</b> nếu có một chuỗi $w$ mà đọc $w$ từ $p$ thì nhận, còn từ $q$ thì từ chối (hoặc ngược lại).</p>
          <p>Không có chuỗi nào như vậy → $p$ và $q$ <b>tương đương</b>: từ đây về sau chúng cư xử y hệt, nên <b>gộp</b> được.</p>
          <div class="box">Ví dụ: trạng thái nhận và trạng thái không nhận luôn phân biệt được — bằng chính chuỗi rỗng $\varepsilon$.</div>
        focus: [1, 2, 2, 3]
        say: "Hai trạng thái p và q gọi là phân biệt được nếu có một chuỗi w mà đọc w từ p thì nhận, còn từ q thì từ chối, hoặc ngược lại. Nếu không có chuỗi nào như vậy thì p và q tương đương. Từ đó về sau chúng cư xử y hệt nhau, nên gộp được thành một. Ví dụ, một trạng thái nhận và một trạng thái không nhận luôn phân biệt được, bằng chính chuỗi rỗng."

  # ───────────────────────── 3. THUẬT TOÁN ─────────────────────────
  - id: algo
    kind: concept
    title: "Thuật toán đánh dấu cặp"
    steps:
      - show: |
          <ol><li>Bỏ mọi trạng thái <b>không tới được</b> từ trạng thái đầu.</li>
          <li>Đánh dấu mọi cặp gồm một trạng thái nhận và một trạng thái không nhận.</li>
          <li>Lặp: đánh dấu cặp $(p, q)$ nếu có ký hiệu $a$ đưa nó tới một cặp <b>đã</b> đánh dấu, tức $(\delta(p, a), \delta(q, a))$ đã đánh dấu. Dừng khi một vòng không đánh dấu thêm cặp nào.</li>
          <li>Các cặp còn trống là tương đương → gộp.</li></ol>
        focus: ["1.1", "1.2", "1.3", "1.3", "1.4"]
        say: "Thuật toán đánh dấu cặp có bốn bước. Một, bỏ mọi trạng thái không tới được từ trạng thái đầu. Hai, đánh dấu mọi cặp gồm một trạng thái nhận và một trạng thái không nhận. Ba, lặp lại, đánh dấu cặp p, q nếu có ký hiệu a đưa cặp đó tới một cặp đã đánh dấu, và dừng khi một vòng không đánh dấu thêm cặp nào. Bốn, các cặp còn trống là tương đương, nên gộp lại."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai trạng thái có tương lai giống hệt"
    steps:
      - show: |
          <div><svg width="760" height="560" viewBox="0 0 760 560"><defs><marker id="m5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 z" fill="#374151"/></marker></defs><path d="M147,270 Q250,228 350,186" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#m5)"/><path d="M147,300 Q250,342 350,384" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#m5)"/><path d="M370,135 C336,52 444,52 410,135" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#m5)"/><path d="M423,147 Q520,78 615,145" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#m5)"/><path d="M617,193 Q520,262 425,195" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#m5)"/><path d="M620,197 Q520,285 422,372" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#m5)"/><path d="M390,360 Q390,285 390,213" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#m5)"/><path d="M370,435 C336,518 444,518 410,435" fill="none" stroke="#374151" stroke-width="3.5" marker-end="url(#m5)"/><line x1="8" y1="285" x2="66" y2="285" stroke="#374151" stroke-width="3.5" marker-end="url(#m5)"/><circle cx="110" cy="285" r="40" fill="#eff6ff" stroke="#dc2626" stroke-width="6"/><text x="110" y="295" font-size="30" font-weight="700" text-anchor="middle">s</text><circle cx="390" cy="170" r="40" fill="#eff6ff" stroke="#2563eb" stroke-width="3.5"/><text x="390" y="180" font-size="30" font-weight="700" text-anchor="middle">a</text><circle cx="650" cy="170" r="40" fill="#dcfce7" stroke="#2563eb" stroke-width="3.5"/><circle cx="650" cy="170" r="32" fill="none" stroke="#2563eb" stroke-width="3"/><text x="650" y="180" font-size="30" font-weight="700" text-anchor="middle">b</text><circle cx="390" cy="400" r="40" fill="#eff6ff" stroke="#dc2626" stroke-width="6"/><text x="390" y="410" font-size="30" font-weight="700" text-anchor="middle">c</text><text x="240" y="215" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="258" y="329" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text><text x="390" y="56" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="519" y="97" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text><text x="521" y="261" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="536" y="311" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text><text x="366" y="295" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">0</text><text x="390" y="532" font-size="28" font-weight="700" fill="#b45309" text-anchor="middle">1</text></svg></div>
          <p>$s$ và $c$ (viền đỏ): đọc 0 đều sang $a$, đọc 1 đều sang $c$. Từ đây về sau hai máy con đi cùng một đường.</p>
        focus: [1, 1, 2, 2]
        say: "Hình vẽ 4 trạng thái tới được của máy mà ta sắp tối thiểu hoá, trạng thái b có viền đôi là trạng thái nhận. Hãy nhìn hai trạng thái có viền đỏ, s và c. Đọc 0 thì cả hai đều sang a, đọc 1 thì cả hai đều sang c. Vì vậy, dù đọc tiếp chuỗi nào, hai điểm xuất phát này luôn đi cùng một đường và cho cùng một kết quả, nên gộp được."
      - clear: true
        show: |
          <div class="box key">Thuật toán làm ngược lại: không đi tìm cặp giống nhau, mà đánh dấu dần các cặp <b>chắc chắn khác</b>. Cặp nào không bao giờ bị đánh dấu thì gộp.</div>
        say: "Thuật toán đánh dấu cặp làm theo hướng ngược lại. Nó không đi tìm cặp giống nhau, mà đánh dấu dần những cặp chắc chắn khác nhau. Cặp nào đến cuối vẫn không bị đánh dấu thì gộp lại."

  - id: example
    kind: example
    title: "Máy 5 trạng thái: bỏ 1, gộp còn 3"
    checks:
      - "alg.minimize(['s', 'a', 'b', 'c', 'd'], '01', {('s', '0'): 'a', ('s', '1'): 'c', ('a', '0'): 'a', ('a', '1'): 'b', ('b', '0'): 'a', ('b', '1'): 'c', ('c', '0'): 'a', ('c', '1'): 'c', ('d', '0'): 'b', ('d', '1'): 'd'}, 's', {'b'})[1] == {'d'}"
      - "sorted(sorted(c) for c in alg.minimize(['s', 'a', 'b', 'c', 'd'], '01', {('s', '0'): 'a', ('s', '1'): 'c', ('a', '0'): 'a', ('a', '1'): 'b', ('b', '0'): 'a', ('b', '1'): 'c', ('c', '0'): 'a', ('c', '1'): 'c', ('d', '0'): 'b', ('d', '1'): 'd'}, 's', {'b'})[0]) == [['a'], ['b'], ['c', 's']]"
      - "all(alg.dfa_run({('s', '0'): 'a', ('s', '1'): 'c', ('a', '0'): 'a', ('a', '1'): 'b', ('b', '0'): 'a', ('b', '1'): 'c', ('c', '0'): 'a', ('c', '1'): 'c'}, 's', {'b'}, w)[0] == w.endswith('01') for w in alg.strings('01', 10))"
    steps:
      - show: |
          <table class="t"><tr><th>$\delta$</th><th>đọc 0</th><th>đọc 1</th><th>ý nghĩa</th></tr>
          <tr><td>$s$ (đầu)</td><td>$a$</td><td>$c$</td><td>chưa đọc gì</td></tr>
          <tr><td>$a$</td><td>$a$</td><td>$b$</td><td>vừa đọc 0</td></tr>
          <tr><td>$b$ (nhận)</td><td>$a$</td><td>$c$</td><td>vừa đọc $01$</td></tr>
          <tr><td>$c$</td><td>$a$</td><td>$c$</td><td>vừa đọc 1, không phải $01$</td></tr>
          <tr><td>$d$</td><td>$b$</td><td>$d$</td><td>không mũi tên nào tới $d$</td></tr></table>
        focus: ["1.1", "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng chuyển có 5 trạng thái, nhưng chỉ 4 trạng thái tới được từ s. Trạng thái s là trạng thái đầu, chưa đọc gì. Trạng thái a nghĩa là vừa đọc 0. Trạng thái b là trạng thái nhận, vừa đọc 0 1. Trạng thái c nghĩa là vừa đọc 1 mà không phải 0 1. Còn d không có mũi tên nào tới, nên ta bỏ d ngay, trước khi bắt đầu đánh dấu."
      - clear: true
        show: |
          <p><b>Bước 1</b> — vòng đầu: chỉ $b$ là trạng thái nhận.</p>
          <table class="t"><tr><th>cặp</th><th>một nhận, một không?</th><th>dấu</th></tr>
          <tr><td>$(s, b)$</td><td>có</td><td>đánh dấu</td></tr>
          <tr><td>$(a, b)$</td><td>có</td><td>đánh dấu</td></tr>
          <tr><td>$(c, b)$</td><td>có</td><td>đánh dấu</td></tr></table>
        focus: [1, 2, 2]
        say: "Bước một, vòng đầu, đánh dấu mọi cặp có đúng một trạng thái nhận. Chỉ b là trạng thái nhận, nên ba cặp có b bị đánh dấu ngay, đó là s với b, a với b, và c với b. Trong 6 cặp, còn lại ba cặp chưa đánh dấu là s với a, a với c, và s với c."
      - show: |
          <p><b>Bước 2</b> — cặp $(s, a)$:</p>
          $$(\delta(s, 0), \delta(a, 0)) = (a, a) \qquad (\delta(s, 1), \delta(a, 1)) = (c, b)$$
        focus: [1, 2, 2]
        say: "Bước hai, xét cặp s với a, cho cả hai cùng đọc từng ký hiệu. Đọc 0, cả hai cùng tới a, cặp a với a không phải hai trạng thái khác nhau. Đọc 1, s tới c còn a tới b, mà cặp c với b đã đánh dấu, nên cặp s với a bị đánh dấu."
      - show: |
          <p><b>Bước 3</b> — cặp $(a, c)$:</p>
          $$(\delta(a, 0), \delta(c, 0)) = (a, a) \qquad (\delta(a, 1), \delta(c, 1)) = (b, c)$$
        focus: [1, 2, 2]
        say: "Bước ba, xét cặp a với c theo cùng cách đó. Đọc 0, cả hai cùng tới a, cặp a với a không phải hai trạng thái khác nhau. Đọc 1, a tới b còn c tới c, mà cặp b với c đã đánh dấu, nên cặp a với c cũng bị đánh dấu."
      - clear: true
        show: |
          <p><b>Bước 4</b> — cặp $(s, c)$:</p>
          $$(\delta(s, 0), \delta(c, 0)) = (a, a) \qquad (\delta(s, 1), \delta(c, 1)) = (c, c)$$
        focus: [1, 2]
        say: "Bước bốn, xét cặp s với c theo cùng cách đó. Đọc 0 cùng tới a, đọc 1 cùng tới c, không tới cặp nào đã đánh dấu, nên cặp này để trống."
      - show: |
          <p><b>Bước 5</b> — vòng sau chỉ còn xét lại $(s, c)$: vẫn tới $(a, a)$ và $(c, c)$, không đổi → <b>dừng</b>.</p>
          <table class="t"><tr><th>6 cặp</th><th>đánh dấu</th><th>trống</th><th>số trạng thái sau khi gộp</th></tr>
          <tr><td>6</td><td>5</td><td>1: $(s, c)$</td><td>$4 - 1 = \hl{3}$</td></tr></table>
        focus: [1, 2, 2]
        say: "Bước năm, vòng sau chỉ còn cặp s với c để xét lại, và nó vẫn tới hai cặp không đánh dấu, nên không có gì thay đổi và thuật toán dừng. Kết quả, 5 trong 6 cặp bị đánh dấu, chỉ còn một cặp trống là s với c. Gộp s với c thì từ 4 trạng thái còn 4 trừ 1, bằng 3 trạng thái."

  # ───────────────────────── 5. DUY NHẤT ─────────────────────────
  - id: unique
    kind: concept
    title: "Kết quả trùng với máy của bài 2"
    checks:
      - "all({'s': 'A', 'c': 'A', 'a': 'AB', 'b': 'AC'}[{('s', '0'): 'a', ('s', '1'): 'c', ('a', '0'): 'a', ('a', '1'): 'b', ('b', '0'): 'a', ('b', '1'): 'c', ('c', '0'): 'a', ('c', '1'): 'c'}[(q, x)]] == {('A', '0'): 'AB', ('A', '1'): 'A', ('AB', '0'): 'AB', ('AB', '1'): 'AC', ('AC', '0'): 'AB', ('AC', '1'): 'A'}[({'s': 'A', 'c': 'A', 'a': 'AB', 'b': 'AC'}[q], x)] for q in 'sabc' for x in '01')"
    steps:
      - show: |
          <div>{{DFA01}}</div>
          <p>Đặt $\{s, c\}$ thành $A$, $a$ thành $AB$, $b$ thành $AC$: <b>từng mũi tên</b> trùng với máy dựng tập con ở bài 2.</p>
          <div class="box key">Định lý Myhill–Nerode: mỗi ngôn ngữ chính quy có <b>đúng một</b> DFA tối tiểu, sai khác tên trạng thái.</div>
        focus: [2, 2, 3]
        say: "Đặt nhóm s, c thành A, trạng thái a thành A B, và trạng thái b thành A C. Khi đó từng mũi tên trùng với máy dựng tập con ở bài 2, máy nhận các chuỗi kết thúc bằng 0 1. Đó không phải tình cờ, một định lý từ cuối những năm 1950 nói mỗi ngôn ngữ chính quy có đúng một máy đơn định tối tiểu, chỉ sai khác tên trạng thái."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "(lambda D: all(alg.dfa_run(D, p, {'b'}, w)[0] != alg.dfa_run(D, q, {'b'}, w)[0] for p, q, w in [('s', 'b', ''), ('a', 'b', ''), ('c', 'b', ''), ('s', 'a', '1'), ('a', 'c', '1')]))({('s', '0'): 'a', ('s', '1'): 'c', ('a', '0'): 'a', ('a', '1'): 'b', ('b', '0'): 'a', ('b', '1'): 'c', ('c', '0'): 'a', ('c', '1'): 'c'})"
      - "(lambda D: [alg.dfa_run(D, q, {'b'}, '1')[0] for q in 'sac'] == [False, True, False])({('s', '0'): 'a', ('s', '1'): 'c', ('a', '0'): 'a', ('a', '1'): 'b', ('b', '0'): 'a', ('b', '1'): 'c', ('c', '0'): 'a', ('c', '1'): 'c'})"
      - "(lambda D: len(alg.strings('01', 3)) == 15 and sum(alg.dfa_run(D, 's', {'b'}, w)[0] != alg.dfa_run(D, 'c', {'b'}, w)[0] for w in alg.strings('01', 3)) == 0)({('s', '0'): 'a', ('s', '1'): 'c', ('a', '0'): 'a', ('a', '1'): 'b', ('b', '0'): 'a', ('b', '1'): 'c', ('c', '0'): 'a', ('c', '1'): 'c'})"
      - "all(alg.dfa_run({('A', '0'): 'AB', ('A', '1'): 'A', ('AB', '0'): 'AB', ('AB', '1'): 'AC', ('AC', '0'): 'AB', ('AC', '1'): 'A'}, 'A', {'AC'}, w)[0] == alg.dfa_run({('s', '0'): 'a', ('s', '1'): 'c', ('a', '0'): 'a', ('a', '1'): 'b', ('b', '0'): 'a', ('b', '1'): 'c', ('c', '0'): 'a', ('c', '1'): 'c'}, 's', {'b'}, w)[0] for w in alg.strings('01', 10))"
    steps:
      - show: |
          <table class="t"><tr><th>cách kiểm</th><th>kết quả</th></tr>
          <tr><td><b>Cùng ngôn ngữ:</b> máy chạy hai máy trên mọi chuỗi độ dài tới 10</td><td>kết quả trùng từng chuỗi</td></tr>
          <tr><td><b>Lý do của mỗi dấu:</b> mỗi cặp bị đánh dấu có một chuỗi phân biệt, ví dụ $(s, a)$ tách bằng chuỗi $1$</td><td>từ $a$ được nhận, từ $s$ thì không</td></tr>
          <tr><td><b>Không gộp được nữa:</b> ba trạng thái còn lại</td><td>phân biệt được từng đôi một</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, máy chạy hai máy trên mọi chuỗi độ dài tới 10, kết quả trùng từng chuỗi. Hai, mỗi cặp bị đánh dấu phải có một chuỗi phân biệt, ví dụ cặp s, a tách được bằng chuỗi 1, vì từ a đọc 1 thì nhận, còn từ s thì không. Ba, ba trạng thái còn lại phân biệt được từng đôi một, nên không gộp được nữa."
      - clear: true
        show: |
          <p>Đường khác: với mỗi cặp bị đánh dấu, <b>chỉ ra</b> một chuỗi tách được nó — chạy thẳng, không dùng bảng đánh dấu.</p>
          <table class="t"><tr><th>cặp</th><th>chuỗi tách</th><th>từ trạng thái trái</th><th>từ trạng thái phải</th></tr>
          <tr><td>$(s, b)$, $(a, b)$, $(c, b)$</td><td>$\varepsilon$</td><td>từ chối</td><td>nhận</td></tr>
          <tr><td>$(s, a)$</td><td>$1$</td><td>$s$ sang $c$: từ chối</td><td>$a$ sang $b$: nhận</td></tr>
          <tr><td>$(a, c)$</td><td>$1$</td><td>$a$ sang $b$: nhận</td><td>$c$ ở lại $c$: từ chối</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bây giờ kiểm bằng một đường khác, với mỗi cặp bị đánh dấu, ta chỉ ra một chuỗi tách được nó bằng cách chạy thẳng máy. Ba cặp có b tách bằng chuỗi rỗng, vì đứng yên thì b nhận còn trạng thái kia từ chối. Cặp s với a tách bằng chuỗi 1, từ s đọc 1 tới c và từ chối, từ a đọc 1 tới b và nhận. Cặp a với c cũng tách bằng chuỗi 1, từ a thì nhận, từ c đọc 1 vẫn ở c nên từ chối."
      - show: |
          <table class="t"><tr><th>cặp trống</th><th>số chuỗi độ dài tới 3</th><th>số chuỗi cho kết quả khác nhau</th></tr>
          <tr><td>$(s, c)$</td><td>$1 + 2 + 4 + 8 = 15$</td><td>$\hl{0}$</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Còn cặp trống s với c, máy chạy cả hai trên mọi chuỗi độ dài tới 3, gồm 1 cộng 2 cộng 4 cộng 8, bằng 15 chuỗi. Không chuỗi nào cho kết quả khác nhau, nên khớp với kết luận gộp s với c. Lần chạy thử này chỉ phủ chuỗi ngắn, còn lập luận cùng mũi tên ra thì phủ mọi chuỗi."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.dfa_run({('d', '0'): 'b', ('b', '0'): 'a'}, 'd', {'b'}, '0')[0] and not any(alg.dfa_run({('s', '0'): 'a', ('a', '0'): 'a', ('c', '0'): 'a', ('b', '0'): 'a'}, q, {'b'}, '0')[0] for q in 'sabc')"
      - "len(alg.subset_construct({(0, '0'): {0}, (0, '1'): {0, 1}} | {(i, a): {i + 1} for i in range(1, 3) for a in '01'}, 0, '01')[0]) == 8"
      - "(lambda o, tr: len(alg.minimize(o, '01', tr, o[0], {S for S in o if 3 in S})[0]) == 8)(*alg.subset_construct({(0, '0'): {0}, (0, '1'): {0, 1}} | {(i, a): {i + 1} for i in range(1, 3) for a in '01'}, 0, '01'))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Không bỏ trạng thái không tới được trước <b class="red">(sai)</b>
          <br><span class="note">$d$ phân biệt được với mọi trạng thái khác (từ $d$ đọc 0 là nhận ngay), nên giữ $d$ lại thì máy còn thừa một trạng thái vô dụng.</span></div>
        say: "Lỗi thứ nhất, không bỏ trạng thái không tới được trước. Trạng thái d phân biệt được với mọi trạng thái khác, vì từ d đọc 0 là nhận ngay, nên giữ d lại thì máy vẫn thừa một trạng thái vô dụng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Gộp hai trạng thái chỉ vì cùng là trạng thái nhận <b class="red">(sai)</b>
          <br><span class="note">Cùng nhận mới là vòng đầu. Phải xét tiếp mọi ký hiệu: tương lai của chúng có giống nhau không.</span></div>
        say: "Lỗi thứ hai, gộp hai trạng thái chỉ vì cùng là trạng thái nhận. Cùng nhận mới là vòng đầu, phải xét tiếp mọi ký hiệu xem tương lai của chúng có giống nhau không."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ chạy một vòng đánh dấu <b class="red">(thiếu)</b>
          <br><span class="note">Một cặp mới được đánh dấu có thể kéo theo cặp khác. Phải lặp đến khi một vòng không đổi gì.</span></div>
        say: "Lỗi thứ ba, chỉ chạy một vòng đánh dấu. Một cặp vừa được đánh dấu có thể kéo theo cặp khác, nên phải lặp cho đến khi một vòng không đổi gì."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ DFA tối tiểu là máy nhỏ nhất mọi loại <b class="red">(sai)</b>
          <br><span class="note">Tối tiểu trong các DFA. NFA có thể nhỏ hơn nhiều:</span></div>
          <table class="t"><tr><th>máy cho “ký hiệu thứ 3 từ cuối là 1”</th><th>số trạng thái</th></tr>
          <tr><td>NFA</td><td>4</td></tr><tr><td>DFA tối tiểu</td><td>8</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ tư, nghĩ máy đơn định tối tiểu là máy nhỏ nhất trong mọi loại máy. Nó tối tiểu trong các máy đơn định thôi, máy không đơn định có thể nhỏ hơn nhiều, như ví dụ 4 so với 8 trạng thái ở bài 2."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "sorted(sorted(c) for c in alg.minimize([0, 1, 2, 3], '01', {(r, b): (r + int(b)) % 4 for r in range(4) for b in '01'}, 0, {0, 2})[0]) == [[0, 2], [1, 3]]"
      - "len(list(__import__('itertools').combinations(range(4), 2))) - sum((p in (0, 2)) != (q in (0, 2)) for p, q in __import__('itertools').combinations(range(4), 2)) == 6 - 4 == 2"
      - "[((p + 1) % 4, (q + 1) % 4) for p, q in [(0, 2), (1, 3)]] == [(1, 3), (2, 0)]"
    steps:
      - show: |
          <p>Máy đếm số chữ 1 theo số dư khi chia 4: trạng thái $q_0, q_1, q_2, q_3$; đọc 0 đứng yên, đọc 1 sang dư kế tiếp. Nhận khi ở $q_0$ hoặc $q_2$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Vòng đầu đánh dấu những cặp nào?</td></tr>
          <tr><td>2</td><td>Tối thiểu hoá còn mấy trạng thái, gộp những cặp nào?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Một máy đếm số chữ 1 theo số dư khi chia 4, có bốn trạng thái, đọc 0 thì đứng yên, đọc 1 thì sang số dư kế tiếp, và nhận khi ở q 0 hoặc q 2. Câu một, vòng đầu đánh dấu những cặp nào? Câu hai, tối thiểu hoá còn mấy trạng thái, và gộp những cặp nào? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① 4 trạng thái cho 6 cặp. Bốn cặp nhận–không nhận bị đánh dấu: $(q_0, q_1)$, $(q_0, q_3)$, $(q_2, q_1)$, $(q_2, q_3)$.</p>
        say: "Đáp án câu một, vòng đầu đánh dấu bốn cặp gồm một trạng thái nhận và một trạng thái không nhận. Bốn trạng thái cho 6 cặp, nên còn 6 trừ 4, bằng 2 cặp chưa đánh dấu."
      - clear: true
        show: |
          <p>② Xét hai cặp còn trống:</p>
          <table class="t"><tr><th>cặp</th><th>đọc 0 tới</th><th>đọc 1 tới</th><th>tới cặp đã đánh dấu?</th></tr>
          <tr><td>$(q_0, q_2)$</td><td>$(q_0, q_2)$</td><td>$(q_1, q_3)$</td><td>không</td></tr>
          <tr><td>$(q_1, q_3)$</td><td>$(q_1, q_3)$</td><td>$(q_2, q_0)$</td><td>không</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Câu hai, xét hai cặp còn trống, mỗi cặp đọc thử cả 0 và 1. Cặp q 0, q 2 đọc 0 thì đứng yên, đọc 1 tới cặp q 1, q 3 chưa đánh dấu. Cặp q 1, q 3 đọc 0 đứng yên, đọc 1 tới cặp q 2, q 0, cũng chưa đánh dấu."
      - show: |
          <p>Không đánh dấu thêm → còn $\hl{2}$ trạng thái: $\{q_0, q_2\}$ và $\{q_1, q_3\}$ — chính là “số chữ 1 chẵn / lẻ”.</p>
        say: "Vì vậy không đánh dấu thêm cặp nào, và máy còn 2 trạng thái, gồm nhóm q 0, q 2 và nhóm q 1, q 3. Đó chính là máy chẵn lẻ ở phần chuẩn bị, đếm số chữ 1 chẵn hoặc lẻ."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bỏ trạng thái không tới được</span><span class="a">→</span>
          <span class="n">đánh dấu nhận / không nhận</span><span class="a">→</span>
          <span class="n">lặp đến khi không đổi</span><span class="a">→</span>
          <span class="n">gộp: máy tối tiểu, duy nhất</span></div>
        say: "Tổng kết lại, bỏ trạng thái không tới được, đánh dấu các cặp nhận và không nhận, lặp đánh dấu cho đến khi không đổi, rồi gộp các cặp còn trống. Kết quả là máy tối tiểu, và nó duy nhất."
      - show: |
          <div class="box key"><b>Tư duy:</b> hai thứ là “một” nếu không thí nghiệm nào phân biệt được chúng — tư duy này dùng lại khi rút gọn mạch, gộp trạng thái giao thức, so sánh chương trình.</div>
        say: "Điều cần mang theo, hai thứ là một nếu không có thí nghiệm nào phân biệt được chúng. Tư duy này dùng lại khi rút gọn mạch, gộp trạng thái giao thức, hay so sánh hai chương trình."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): vượt khỏi ngôn ngữ chính quy — <b>văn phạm phi ngữ cảnh</b> sinh được $\{0^n 1^n\}$ và ngoặc cân bằng, cùng cây suy dẫn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta vượt khỏi ngôn ngữ chính quy với văn phạm phi ngữ cảnh. Văn phạm này sinh được ngôn ngữ n chữ 0 rồi n chữ 1, các chuỗi ngoặc cân bằng, và đi kèm cây suy dẫn. Hẹn gặp bạn ở bài tiếp theo."
