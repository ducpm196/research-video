title: "Bài 9 — Máy Turing: băng, đầu đọc và bảng chuyển"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/toc.yaml L09; audit/toc/verify_toc.py L09; A. M. Turing (1936), “On Computable Numbers, with an Application to the Entscheidungsproblem”; M. Sipser, mục 3.1"
assumes: [arith, sub, set, in, alpha, delta, dots]
# Quy ước: “Turing” đọc “Tua-rinh” (lexicon_vi.TOC.yaml, probe p2 — 6/8, NOT_VERIFIED). Ô trống in để trống trong hình, gọi là “ô trống”.
#   Chiều đi: T (trái), P (phải), Đ (đứng yên). q_0 = đang cộng (còn nhớ 1), q_1 = dừng. Mọi băng trong hình do alg.tm_run chạy ra
#   (audit/toc/fsm_svg.py); máy được kiểm cộng đúng với mọi n = 0..2047 và số bước = số chữ 1 ở cuối + 1.
objectives:
  - "Mô tả máy Turing: băng, đầu đọc, trạng thái, bảng chuyển"
  - "Chạy máy cộng một vào số nhị phân và đếm số bước"
  - "Hiểu băng vô hạn là mô hình về khả năng tính, không về bộ nhớ thật"
asr_reviewed:
