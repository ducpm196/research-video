  - {sentence: "Khác với ô-tô-mát, đầu đọc ghi được và đi hai chiều, nên băng vừa là đầu vào vừa là giấy nháp.", reason: "“ô-tô-mát” ASR chép “Automat / Otomac / automatic”: đúng từ mượn, chỉ khác cách viết; chép đúng ở mọi bài TOC có từ này"}
  - {sentence: "Hôm nay ta học máy Turing, gồm băng, đầu đọc, trạng thái và bảng chuyển, qua một máy cộng một vào số nhị phân.", reason: "Turing đọc “Tua-rinh” (lexicon_vi.TOC.yaml, probe p1+p2 6/8 — tốt nhất trong 6 cách viết); ASR chép “Turing / Turin / tu trinh / tô rinh”: đổi r → tr như “Rai” → “trai” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tổng kết lại, máy Turing có một băng và đầu đọc ghi được, đi được hai chiều, điều khiển bằng một bảng chuyển hữu hạn.", reason: "Turing đọc “Tua-rinh” (lexicon_vi.TOC.yaml, probe p1+p2 6/8 — tốt nhất trong 6 cách viết); ASR chép “Turing / Turin / tu trinh / tô rinh”: đổi r → tr như “Rai” → “trai” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở bài sau, bài 10, ta xem vì sao người ta tin máy Turing tính được mọi thứ tính được, qua luận đề mang tên Turing.", reason: "Turing đọc “Tua-rinh” (lexicon_vi.TOC.yaml, probe p1+p2 6/8 — tốt nhất trong 6 cách viết); ASR chép “Turing / Turin / tu trinh / tô rinh”: đổi r → tr như “Rai” → “trai” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ta cũng học máy Turing vạn năng, một máy chạy được mọi máy khác.", reason: "Turing đọc “Tua-rinh” (lexicon_vi.TOC.yaml, probe p1+p2 6/8 — tốt nhất trong 6 cách viết); ASR chép “Turing / Turin / tu trinh / tô rinh”: đổi r → tr như “Rai” → “trai” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Máy Turing có một băng gồm các ô kéo dài vô hạn hai phía, ô chưa ghi gọi là ô trống.", reason: "Turing đọc “Tua-rinh” (lexicon_vi.TOC.yaml, probe p1+p2 6/8 — tốt nhất trong 6 cách viết); ASR chép “Turing / Turin / tu trinh / tô rinh”: đổi r → tr như “Rai” → “trai” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chào bạn, năm 1936, nhà toán học Turing hỏi một người tính toán bằng tay thực ra làm gì.", reason: "Turing đọc “Tua-rinh” (lexicon_vi.TOC.yaml, probe p1+p2 6/8 — tốt nhất trong 6 cách viết); ASR chép “Turing / Turin / tu trinh / tô rinh”: đổi r → tr như “Rai” → “trai” — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một người làm toán với giấy và bút chì"
    steps:
      - show: |
          <p>Năm 1936, Alan Turing hỏi: một người tính toán bằng tay làm gì? Nhìn một ô trên giấy, nhớ mình đang ở bước nào, viết hoặc xoá một ký hiệu, rồi chuyển sang ô bên cạnh.</p>
          <p>Ghi lại đúng từng ấy hành động, ta được một cỗ máy — và mọi máy tính ngày nay không tính được nhiều hơn nó.</p>
          <div class="box key">Hôm nay: máy Turing — băng, đầu đọc, trạng thái, bảng chuyển — qua một máy cộng một vào số nhị phân.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, năm 1936, nhà toán học Turing hỏi một người tính toán bằng tay thực ra làm gì. Họ nhìn một ô trên giấy, nhớ mình đang ở bước nào, viết hoặc xoá một ký hiệu, rồi chuyển sang ô bên cạnh. Ghi lại đúng từng ấy hành động, ta được một cỗ máy, và mọi máy tính ngày nay không tính được nhiều hơn nó. Hôm nay ta học máy Turing, gồm băng, đầu đọc, trạng thái và bảng chuyển, qua một máy cộng một vào số nhị phân."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đọc số nhị phân, cộng một bằng tay"
    checks:
      - "int('1011', 2) == 8 + 0 + 2 + 1 == 11"
      - "int('1100', 2) == 8 + 4 == 12 == 11 + 1"
      - "[(1 + 1) % 2, (1 + 1) // 2] == [0, 1] and 0 + 1 == 1"
      - "format(int('1011', 2) + 1, 'b') == '1100'"
    steps:
      - show: |
          <table class="t"><tr><th>giá trị cột</th><th>8</th><th>4</th><th>2</th><th>1</th><th>tổng</th></tr>
          <tr><td>$1011$</td><td>1</td><td>0</td><td>1</td><td>1</td><td>$8 + 2 + 1 = 11$</td></tr>
          <tr><td>$1100$</td><td>1</td><td>1</td><td>0</td><td>0</td><td>$8 + 4 = 12$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn cách đọc số nhị phân, mỗi cột có giá trị 8, 4, 2, 1 tính từ trái sang. Chuỗi 1 0 1 1 có chữ 1 ở các cột 8, 2 và 1, nên bằng 8 cộng 2 cộng 1, tức là 11. Chuỗi 1 1 0 0 có chữ 1 ở cột 8 và cột 4, nên bằng 12."
      - show: |
          <table class="t"><tr><th>cột (từ phải)</th><th>phép tính</th><th>ghi</th><th>nhớ sang trái</th></tr>
          <tr><td>thứ nhất</td><td>$1 + 1 = 2$</td><td>0</td><td>1</td></tr>
          <tr><td>thứ hai</td><td>$1 + 1 = 2$</td><td>0</td><td>1</td></tr>
          <tr><td>thứ ba</td><td>$0 + 1 = 1$</td><td>1</td><td>0 — xong</td></tr>
          <tr><td>thứ tư</td><td>không cộng gì</td><td>1</td><td>—</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bây giờ cộng một vào 1 0 1 1 bằng tay, đi từ cột bên phải nhất. Cột thứ nhất, 1 cộng 1 bằng 2, trong hệ nhị phân là ghi 0 và nhớ 1 sang trái. Cột thứ hai lại là 1 cộng với số nhớ 1, nên cũng ghi 0 và nhớ 1. Cột thứ ba, 0 cộng 1 bằng 1, ghi 1 và hết nhớ, nên dừng ở đây. Cột thứ tư giữ nguyên chữ 1, kết quả là 1 1 0 0, đúng bằng 12."

  - id: sym
    kind: symbol
    title: "Giải mã: băng, đầu đọc, bảng chuyển"
    steps:
      - show: |
          <div>{{TM0}}</div>
          <table class="t"><tr><th>thành phần</th><th>nghĩa</th></tr>
          <tr><td><b>băng</b></td><td>dãy ô kéo dài vô hạn hai phía; ô chưa ghi là <b>ô trống</b></td></tr>
          <tr><td><b>đầu đọc</b> (tam giác đỏ)</td><td>đứng ở một ô, đọc và ghi được ô đó</td></tr>
          <tr><td>$\delta(q, a) = (q', b, D)$</td><td>ở trạng thái $q$ đọc $a$: <b>ghi</b> $b$, <b>đi</b> theo $D$ (T trái, P phải, Đ đứng yên), sang $q'$</td></tr></table>
        introduces: [prime]
        focus: ["2.2", "2.3", "2.4", "2.4"]
        say: "Máy Turing có một băng gồm các ô kéo dài vô hạn hai phía, ô chưa ghi gọi là ô trống. Đầu đọc, vẽ bằng tam giác đỏ, đứng ở một ô và đọc ghi được ô đó. Hàm chuyển nhận trạng thái q và ký hiệu đang đọc a, rồi trả về ba thứ. Đó là ký hiệu b để ghi đè, chiều đi sang trái, sang phải hay đứng yên, và trạng thái mới."
      - show: |
          <div class="box key">Khác ôtômat: đầu đọc <b>ghi</b> được và đi <b>hai chiều</b>, nên băng vừa là đầu vào vừa là bộ nhớ nháp. Máy dừng khi vào trạng thái dừng, hoặc khi không có chuyển nào áp dụng.</div>
        say: "Khác với ô-tô-mát, đầu đọc ghi được và đi hai chiều, nên băng vừa là đầu vào vừa là giấy nháp. Máy dừng khi vào trạng thái dừng, hoặc khi không có chuyển nào áp dụng được."

  # ───────────────────────── 3. MÁY CỘNG MỘT ─────────────────────────
  - id: design
    kind: concept
    title: "Thiết kế: cộng một như cộng tay"
    steps:
      - show: |
          <p>Cộng một bằng tay: từ chữ số <b>bên phải nhất</b>, gặp 1 thì đổi thành 0 và nhớ 1 sang trái; gặp 0 hoặc ô trống thì đổi thành 1 và xong.</p>
          <table class="t"><tr><th>$\delta$</th><th>đọc 1</th><th>đọc 0</th><th>đọc ô trống</th></tr>
          <tr><td>$q_0$ (đang nhớ 1)</td><td>ghi 0, đi T, ở $q_0$</td><td>ghi 1, Đ, sang $q_1$</td><td>ghi 1, Đ, sang $q_1$</td></tr></table>
          <p>$q_1$ là trạng thái dừng. Đầu đọc bắt đầu ở chữ số bên phải nhất, trạng thái $q_0$.</p>
        focus: [1, 2, 2, 3]
        say: "Thiết kế máy giống hệt cộng tay. Bắt đầu từ chữ số bên phải nhất, gặp 1 thì đổi thành 0 và nhớ 1 sang trái, gặp 0 hoặc ô trống thì đổi thành 1 và xong. Bảng chuyển chỉ có một hàng, ở trạng thái q 0 là đang nhớ 1. Đọc 1 thì ghi 0 và đi sang trái, còn đọc 0 hay ô trống thì ghi 1, đứng yên và sang q 1, trạng thái dừng."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chạy máy trên 1011"
    checks:
      - "alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '1011', 3, 'C')[:3] == ('1100', 3, 'H')"
      - "int('1011', 2) + 1 == int('1100', 2) == 12"
    steps:
      - show: |
          <div>{{TM1}}</div>
          <p>Bước 1: đọc 1 ở ô cuối → ghi 0, sang trái.</p>
        focus: [1, 2]
        say: "Chạy máy trên 1 0 1 1, đầu đọc bắt đầu ở chữ số bên phải nhất, trạng thái q 0. Bước 1 đọc chữ 1 ở ô cuối, ghi 0 và sang trái, như hình đang ở sau bước 1."
      - show: |
          <table class="t" style="width:100%"><tr><td style="width:14%">Bước 2</td><td style="width:40%">đọc 1 ở ô thứ ba, trạng thái $q_0$</td><td>ghi 0, đi T, vẫn ở $q_0$</td></tr></table>
        say: "Bước 2, đầu đọc gặp chữ 1 ở ô thứ ba, nên lại ghi 0 và sang trái, vẫn ở q 0 vì còn nhớ 1."
      - clear: true
        show: |
          <div>{{TM2}}</div>
          <p>Bước 3: đọc 0 → ghi 1, đứng yên, sang $q_1$ (dừng).</p>
        focus: [1, 2]
        say: "Sau bước 2, đầu đọc đứng ở chữ 0. Bước 3 đọc 0, ghi 1, đứng yên và sang trạng thái dừng."
      - show: |
          <div>{{TMEND}}</div>
          <p>Kết quả $1100$ sau $\hl{3}$ bước. Đúng: $1011$ là 11, cộng một được 12 $= 1100$.</p>
        focus: [1, 2]
        say: "Băng cuối cùng là 1 1 0 0. Kết quả có sau 3 bước, đúng vì 1 0 1 1 là 11, cộng một được 12, tức 1 1 0 0."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "int('1011', 2) == 8 + 2 + 1 == 11 and int('1100', 2) == 8 + 4 == 12 == 11 + 1"
      - "len('1011') - len('1011'.rstrip('1')) + 1 == 3 == alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '1011', 3, 'C')[1]"
      - "all(alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, format(n, 'b'), len(format(n, 'b')) - 1, 'C')[0] == format(n + 1, 'b') for n in range(2048))"
      - "all(alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, format(n, 'b'), len(format(n, 'b')) - 1, 'C')[1] == len(format(n, 'b')) - len(format(n, 'b').rstrip('1')) + 1 for n in range(1, 2048))"
    steps:
      - show: |
          <table class="t"><tr><th>cách kiểm</th><th>nội dung</th></tr>
          <tr><td><b>Đối chiếu</b></td><td>máy chạy mọi số từ 0 đến 2047 — băng cuối luôn là số đó cộng một</td></tr>
          <tr><td><b>Số bước</b></td><td>= số chữ 1 liên tiếp ở cuối, cộng 1: $1011$ có hai chữ 1 ở cuối → 3 bước</td></tr>
          <tr><td><b>Trường hợp biên</b></td><td>$111$ — nhớ tràn ra ô trống bên trái, được $1000$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, đối chiếu, máy chạy mọi số từ 0 đến 2047, băng cuối luôn là số đó cộng một. Hai, số bước bằng số chữ 1 liên tiếp ở cuối cộng 1, vì mỗi chữ 1 ở cuối tốn một bước, rồi thêm một bước ghi 1 vào chữ 0 hoặc ô trống. Ba, thử trường hợp biên 1 1 1, số nhớ tràn ra ô trống bên trái, được 1 0 0 0."
      - clear: true
        show: |
          <p>Đường khác: không nhìn máy, đổi sang hệ mười rồi đếm.</p>
          <table class="t"><tr><th>đại lượng</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>đầu vào $1011$</td><td>$8 + 2 + 1$</td><td>11</td></tr>
          <tr><td>băng cuối $1100$</td><td>$8 + 4$</td><td>12</td></tr>
          <tr><td>số bước dự đoán</td><td>2 chữ 1 ở cuối, cộng 1</td><td>3</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bây giờ kiểm bằng một đường khác, không nhìn máy mà đổi sang hệ mười rồi đếm. Đầu vào 1 0 1 1 là 8 cộng 2 cộng 1, bằng 11. Băng cuối 1 1 0 0 là 8 cộng 4, bằng 12, đúng là 11 cộng 1. Số bước dự đoán theo công thức là 2 chữ 1 ở cuối cộng 1, bằng 3, khớp với 3 bước vừa chạy."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '111', 2, 'C')[:2] == ('1000', 4)"
      - "[alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '111', 2, 'C', limit=k)[0] for k in range(1, 5)] == ['110', '100', '000', '1000']"
      - "alg.tm_run({('R', '_'): ('R', '_', 'R')}, '', 0, 'R', limit=500)[1:3] == (500, 'R')"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ băng vô hạn là “máy có bộ nhớ vô hạn” thật <b class="red">(hiểu sai mục đích)</b>
          <br><span class="note">Mỗi lần chạy dừng chỉ dùng <b>hữu hạn</b> ô. Băng vô hạn để không phải chọn trước giới hạn — mô hình nói về <b>cái gì tính được</b>.</span></div>
        say: "Lỗi thứ nhất, nghĩ băng vô hạn nghĩa là máy có bộ nhớ vô hạn thật. Mỗi lần chạy có dừng chỉ dùng hữu hạn ô, băng vô hạn là để không phải chọn trước giới hạn, vì mô hình này nói về cái gì tính được."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ máy nào cũng dừng <b class="red">(sai)</b>
          <br><span class="note">Máy “gặp ô trống thì ghi ô trống, đi phải, giữ trạng thái” chạy mãi: máy kiểm cho chạy 500 bước vẫn chưa dừng.</span></div>
        say: "Lỗi thứ hai, nghĩ máy nào cũng dừng. Một máy gặp ô trống thì ghi ô trống, đi sang phải và giữ nguyên trạng thái sẽ chạy mãi, máy kiểm cho chạy 500 bước nó vẫn chưa dừng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên trường hợp tràn nhớ <b class="red">(thiếu)</b>
          <br><span class="note">Với $111$, sau ba lần đổi 1 thành 0, đầu đọc gặp <b>ô trống</b>. Thiếu chuyển cho ô trống thì máy kẹt và cho kết quả sai.</span></div>
          <table class="t"><tr><th>sau bước</th><th>1</th><th>2</th><th>3</th><th>4 (ô trống → 1)</th></tr>
          <tr><td>băng</td><td>$110$</td><td>$100$</td><td>$000$</td><td>$1000$</td></tr></table>
        focus: [1, 2, 1]
        say: "Lỗi thứ ba, quên trường hợp tràn nhớ. Với 1 1 1, sau ba lần đổi 1 thành 0, đầu đọc gặp ô trống. Nếu thiếu chuyển cho ô trống thì máy kẹt lại và cho kết quả sai."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Lẫn trạng thái với nội dung băng <b class="red">(sai)</b>
          <br><span class="note">Trạng thái là <b>hữu hạn</b> và cố định trong bảng. Thứ lớn dần không giới hạn là băng.</span></div>
        say: "Lỗi thứ tư, lẫn trạng thái với nội dung băng. Số trạng thái là hữu hạn và cố định trong bảng, còn thứ lớn dần không giới hạn là băng."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '1001', 3, 'C')[:2] == ('1010', 2)"
      - "alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '1001', 3, 'C', limit=1)[0] == '1000' and int('1001', 2) + 1 == 10 == int('1010', 2)"
      - "int('111', 2) + 1 == 8 == int('1000', 2)"
      - "alg.tm_run({('C', '1'): ('C', '0', 'L'), ('C', '0'): ('H', '1', 'S'), ('C', '_'): ('H', '1', 'S')}, '111', 2, 'C')[:2] == ('1000', 4)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chạy máy trên $1001$: băng cuối là gì, sau mấy bước?</td></tr>
          <tr><td>2</td><td>Chạy trên $111$: sau mấy bước, băng cuối là gì?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chạy máy trên 1 0 0 1, băng cuối là gì, và sau mấy bước? Câu hai, chạy trên 1 1 1, sau mấy bước, và băng cuối là gì? Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1, $1001$</th><th>đọc</th><th>làm</th><th>băng</th></tr>
          <tr><td>bước 1</td><td>1 ở ô cuối</td><td>ghi 0, đi T</td><td>$1000$</td></tr>
          <tr><td>bước 2</td><td>0</td><td>ghi 1, dừng</td><td>$1010$</td></tr></table>
          <p>① Một chữ 1 ở cuối → $\hl{2}$ bước, băng $1010$ (9 + 1 = 10).</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu một, chạy từng bước trên 1 0 0 1. Bước 1 đọc chữ 1 ở ô cuối, ghi 0 và sang trái, băng thành 1 0 0 0. Bước 2 đọc chữ 0, ghi 1 và dừng, băng thành 1 0 1 0. Có một chữ 1 ở cuối nên mất 2 bước, đúng vì 9 cộng 1 bằng 10."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2, $111$</th><th>bước 1</th><th>bước 2</th><th>bước 3</th><th>bước 4</th></tr>
          <tr><td>băng</td><td>$110$</td><td>$100$</td><td>$000$</td><td>$1000$</td></tr></table>
          <p>② Ba chữ 1 ở cuối → $\hl{4}$ bước, băng $1000$ (7 + 1 = 8).</p>
        focus: [1, 1, 2]
        say: "Câu hai, ba bước đầu đổi lần lượt ba chữ 1 thành 0, băng thành 0 0 0. Bước 4 đầu đọc gặp ô trống bên trái, ghi 1 và dừng, băng là 1 0 0 0. Có ba chữ 1 ở cuối nên mất 4 bước, đúng vì 7 cộng 1 bằng 8."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">băng + đầu đọc ghi, đi hai chiều</span><span class="a">→</span>
          <span class="n">bảng chuyển hữu hạn</span><span class="a">→</span>
          <span class="n">dừng hoặc chạy mãi</span><span class="a">→</span>
          <span class="n">mô hình của “tính được”</span></div>
        say: "Tổng kết lại, máy Turing có một băng và đầu đọc ghi được, đi được hai chiều, điều khiển bằng một bảng chuyển hữu hạn. Máy có thể dừng hoặc chạy mãi, và nó là mô hình chuẩn của khái niệm tính được."
      - show: |
          <div class="box key"><b>Tư duy:</b> một thuật toán, dù phức tạp đến đâu, cuối cùng chỉ là: nhìn ký hiệu, nhớ bước đang làm, ghi, rồi đi tiếp.</div>
        say: "Điều cần mang theo, một thuật toán dù phức tạp đến đâu, cuối cùng cũng chỉ là nhìn ký hiệu, nhớ bước đang làm, ghi, rồi đi tiếp."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): vì sao tin rằng máy Turing tính được mọi thứ “tính được” — <b>luận đề Church–Turing</b>, và <b>máy Turing vạn năng</b> chạy mọi máy khác.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta xem vì sao người ta tin máy Turing tính được mọi thứ tính được, qua luận đề mang tên Turing. Ta cũng học máy Turing vạn năng, một máy chạy được mọi máy khác. Hẹn gặp bạn ở bài tiếp theo."
