- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">NFA: $\delta$ cho một tập</span><span class="a">→</span>

      <span class="n">nhận nếu có một nhánh nhận</span><span class="a">→</span>

      <span class="n">chạy bằng tập trạng thái</span><span class="a">→</span>

      <span class="n">dựng tập con → DFA</span></div>

      '
    say: Tổng kết lại, ở máy không đơn định, hàm chuyển cho một tập trạng thái, máy nhận nếu có một nhánh nhận. Ta chạy nó bằng tập trạng thái, và phép dựng tập con biến mỗi tập thành một trạng thái của máy đơn định. Hiểu rõ phép dựng tập con giúp bạn dung hòa dễ dàng giữa sự gọn nhẹ khi viết đặc tả và tốc độ khi chạy máy. Khi thiết kế mẫu nhận diện, hãy cứ tư duy theo hướng không đơn định và cho phép nhiều mũi tên cùng nhãn để giữ mô hình thật tự nhiên.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
  - show: '<div class="chain"><span class="n">NFA: $\delta$ cho một tập</span><span class="a">→</span>

      <span class="n">nhận nếu có một nhánh nhận</span><span class="a">→</span>

      <span class="n">chạy bằng tập trạng thái</span><span class="a">→</span>

      <span class="n">dựng tập con → DFA</span></div>

      '
    say: Sau đó máy tính sẽ tự động gộp tập hợp các nhánh thành trạng thái cụ thể khi biên dịch mẫu. Tuy nhiên cần cảnh giác trường hợp cực hạn khiến số trạng thái bùng nổ theo hàm mũ như bài toán ký tự thứ k từ cuối. Khi đó ta chủ động mô phỏng trực tiếp tập trạng thái ngay trên bộ nhớ nhỏ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
  - show: '<div class="box key"><b>Tư duy:</b> “đoán” trong lý thuyết tính toán nghĩa là “thử mọi khả năng cùng lúc” — tiện để <b>thiết kế</b>, rồi dựng tập con để <b>chạy</b>.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Nhớ 2 bit cuối NFA cho 3 trạng thái và DFA dựng tập con còn 3 trạng thái, nhưng bài toán “ký tự thứ k = 10 từ cuối là 1” làm DFA nổ lên 2^10 = 1 024 trạng thái — đánh đổi giữa bộ nhớ và chạy một nhánh.</p>

      '
    say: Điều cần mang theo, đoán trong lý thuyết tính toán nghĩa là thử mọi khả năng cùng lúc. Nó tiện để thiết kế, rồi ta dựng tập con để có máy chạy được. Nhớ 2 bit cuối cho 3 trạng thái ở máy đơn định. Nhưng bài toán tìm ký tự thứ 10 từ cuối đẩy máy đơn định lên 1 024 trạng thái, đánh đổi giữa bộ nhớ và số nhánh. Với bài toán tìm ký tự thứ k từ cuối chuỗi, số trạng thái tăng theo hai mũ k nên mô phỏng tập trạng thái trực tiếp giữ bộ nhớ gọn hơn nhiều.
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
  - clear: true
    show: '<p class="note">Bài sau (bài 3): mô tả ngôn ngữ bằng một dòng chữ — <b>biểu thức chính quy</b>, và định lý Kleene nối nó với ôtômat.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 3, ta mô tả ngôn ngữ bằng một dòng chữ, gọi là biểu thức chính quy, và học định lý nối nó với ô-tô-mát. Hẹn gặp bạn ở bài tiếp theo.
