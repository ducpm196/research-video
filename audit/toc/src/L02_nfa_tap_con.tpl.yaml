id: L02
course: TOC
series: "TOC · Lý thuyết tính toán"
title: "Bài 2 — Ôtômat không đơn định và phép dựng tập con"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/toc.yaml L02; audit/toc/verify_toc.py L02; M. Rabin, D. Scott (1959), “Finite Automata and Their Decision Problems”; M. Sipser, mục 1.2"
assumes: [arith, power, sub, set, in, emptyset, alpha, eps, delta, dots]
# Quy ước: NFA/DFA chỉ trên màn hình; lời đọc nói “máy không đơn định / máy đơn định”. Trạng thái của DFA dựng ra là một TẬP
#   trạng thái của NFA, viết \{A, B\} trong công thức và “AB” trong hình (ghi chú ở khung đầu). Mọi tập trạng thái do
#   alg.nfa_run / alg.subset_construct tính; hình sinh bằng audit/toc/fsm_svg.py (check_edges kiểm đủ cạnh).
objectives:
  - "Chạy NFA bằng tập trạng thái"
  - "Đổi NFA thành DFA bằng phép dựng tập con"
  - "Biết NFA và DFA mạnh như nhau, nhưng DFA có thể lớn gấp 2ⁿ"
asr_reviewed:
  - {sentence: "Liệt kê ra để kiểm, 1 cộng 3 cộng 3 cộng 1 bằng 8, khớp với 2 mũ 3.", reason: "ASR chép “Li kê ra để kiểm 1 cọng 3 cọng 3 cọng 1 bằng 8 khớp với 2 mũ 3.” (0.789): lệch âm/thanh thuần Việt: liệt/li, cộng/cọng, cộng/cọng, cộng/cọng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Từ A, C đọc 1 về tập A.", reason: "ASR chép “Từ A, sẽ đọc một về tập A.” (0.875): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một cỗ máy biết đoán"
    steps:
      - show: |
          <p>Ngôn ngữ: chuỗi nhị phân <b>kết thúc bằng</b> $01$. Máy đơn định phải nhớ hai bit cuối — dễ nhầm khi thiết kế.</p>
          <p>Nếu máy được <b>đoán</b>: cứ đọc, đến lúc nào đoán “đây là chữ 0 cuối cùng” thì rẽ sang kiểm tiếp chữ 1 rồi hết chuỗi.</p>
          <div class="box key">Hôm nay: ôtômat không đơn định, cách chạy nó, và vì sao máy biết đoán <b>không</b> mạnh hơn máy đơn định.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, xét ngôn ngữ các chuỗi nhị phân kết thúc bằng 0 1. Máy đơn định phải nhớ hai bit cuối, và rất dễ nhầm khi thiết kế. Nếu máy được đoán thì đơn giản hơn nhiều, cứ đọc, đến lúc nào đoán đây là chữ 0 cuối cùng thì rẽ sang kiểm tiếp chữ 1 rồi hết chuỗi. Hôm nay ta học ô-tô-mát không đơn định, cách chạy nó, và vì sao máy biết đoán không mạnh hơn máy đơn định."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hợp hai tập và số tập con"
    checks:
      - "{'A'} | {'A', 'B'} == {'A', 'B'} and {'A', 'B'} | {'C'} == {'A', 'B', 'C'} and {'A', 'B'} | set() == {'A', 'B'}"
      - "len([s for k in range(4) for s in __import__('itertools').combinations('ABC', k)]) == 8 == 2 ** 3"
    steps:
      - show: |
          <table class="t"><tr><th>phép hợp $\cup$: gộp, không lặp</th><th>kết quả</th></tr>
          <tr><td>$\{A\} \cup \{A, B\}$</td><td>$\{A, B\}$</td></tr>
          <tr><td>$\{A, B\} \cup \{C\}$</td><td>$\{A, B, C\}$</td></tr>
          <tr><td>$\{A, B\} \cup \emptyset$</td><td>$\{A, B\}$</td></tr></table>
        introduces: [cup]
        focus: [0, 1, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn hai điều về tập hợp. Điều thứ nhất là phép hợp, viết bằng chữ U lớn, nghĩa là gộp hai tập lại, phần tử nào trùng thì chỉ giữ một lần. Tập A hợp với tập A, B được A, B, vì A đã có rồi. Tập A, B hợp với tập C được A, B, C. Còn hợp với tập rỗng thì không đổi gì."
      - show: |
          <table class="t"><tr><th>số phần tử của tập con</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>các tập con của $\{A, B, C\}$</td><td>$\emptyset$</td><td>$\{A\}, \{B\}, \{C\}$</td><td>$\{A, B\}, \{A, C\}, \{B, C\}$</td><td>$\{A, B, C\}$</td></tr></table>
          $$1 + 3 + 3 + 1 = 8 = 2^3$$
        focus: [0, 1, 2]
        say: "Điều thứ hai là đếm số tập con của một tập. Mỗi trạng thái A, B, C hoặc có mặt hoặc vắng mặt, hai lựa chọn cho mỗi phần tử, nên có 2 mũ 3 tập con. Liệt kê ra để kiểm, 1 cộng 3 cộng 3 cộng 1 bằng 8, khớp với 2 mũ 3."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: δ trả về một tập trạng thái"
    steps:
      - show: |
          <div>{{NFA01}}</div>
          <p>Ở NFA (viết tắt của ôtômat hữu hạn không đơn định), $\delta(q, a)$ là một <b>tập</b> trạng thái: $\delta(A, 0) = \{A, B\}$ (hai lựa chọn), $\delta(B, 0) = \emptyset$ (không có mũi tên: nhánh đó chết).</p>
          <div class="box key">NFA <b>nhận</b> $w$ nếu có <b>ít nhất một</b> cách đi theo mũi tên, đọc hết $w$, dừng ở trạng thái nhận.</div>
        focus: [1, 2, 2, 3]
        say: "Đây là máy không đơn định cho ngôn ngữ kết thúc bằng 0 1. Ở máy này, đen-ta của q và a là một tập trạng thái. Từ A đọc 0 có hai lựa chọn, ở lại A hoặc sang B, còn từ B đọc 0 thì không có mũi tên nào, nhánh đó chết. Máy nhận một chuỗi nếu có ít nhất một cách đi theo mũi tên, đọc hết chuỗi, và dừng ở trạng thái nhận."

  # ───────────────────────── 3. CHẠY BẰNG TẬP ─────────────────────────
  - id: run
    kind: concept
    title: "Chạy NFA: theo dõi mọi nhánh cùng lúc"
    checks:
      - "[sorted(s) for s in alg.nfa_run({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}, 'A', {'C'}, '1101')[1]] == [['A'], ['A'], ['A'], ['A', 'B'], ['A', 'C']]"
    steps:
      - show: |
          <p>Không cần thử từng cách đoán: giữ <b>tập</b> mọi trạng thái có thể đang đứng.</p>
          <table class="t"><tr><th>đã đọc</th><th>$\varepsilon$</th><th>1</th><th>11</th><th>110</th><th>1101</th></tr>
          <tr><td>tập trạng thái</td><td>$\{A\}$</td><td>$\{A\}$</td><td>$\{A\}$</td><td>$\{A, B\}$</td><td>$\{A, C\}$</td></tr></table>
          <p>Tập cuối chứa $C$ (trạng thái nhận) → <b>nhận</b> $1101$.</p>
        focus: [1, "2.2", "2.2", 3]
        say: "Không cần thử từng cách đoán, ta giữ tập mọi trạng thái máy có thể đang đứng. Đọc hai chữ 1 đầu tiên, máy ở A và tập vẫn chỉ là A. Đọc 0 thì A sinh ra A và B, rồi đọc 1, A về A còn B sang C, được tập A, C. Tập cuối chứa C là trạng thái nhận, nên máy nhận chuỗi 1 1 0 1."

  # ───────────────────────── 4. DỰNG TẬP CON ─────────────────────────
  - id: example
    kind: example
    title: "Dựng tập con: mỗi tập trạng thái thành một trạng thái"
    checks:
      - "[sorted(s) for s in alg.subset_construct({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}, 'A', '01')[0]] == [['A'], ['A', 'B'], ['A', 'C']]"
      - "2 ** 3 == 8"
      - "all(alg.nfa_run({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}, 'A', {'C'}, w)[0] == w.endswith('01') for w in alg.strings('01', 10))"
    steps:
      - show: |
          <p><b>Bước 1.</b> Bắt đầu từ $\{A\}$. Mỗi ô = hợp các tập $\delta$ của từng trạng thái trong tập:</p>
          <table class="t"><tr><th>từ tập</th><th>đọc</th><th>hợp</th><th>được</th></tr>
          <tr><td>$\{A\}$</td><td>0</td><td>$\delta(A, 0) = \{A, B\}$</td><td>$\{A, B\}$ mới</td></tr>
          <tr><td>$\{A\}$</td><td>1</td><td>$\delta(A, 1) = \{A\}$</td><td>$\{A\}$</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Bước một, bắt đầu từ tập chỉ có A. Mỗi ô của máy mới là hợp các tập đen-ta của từng trạng thái trong tập. Từ tập A đọc 0, được đúng đen-ta của A và 0, là tập A, B, một tập mới. Từ tập A đọc 1 được tập A, không có gì mới."
      - show: |
          <p><b>Bước 2.</b> Xử lý tập mới $\{A, B\}$:</p>
          <table class="t"><tr><th>từ tập</th><th>đọc</th><th>hợp</th><th>được</th></tr>
          <tr><td>$\{A, B\}$</td><td>0</td><td>$\{A, B\} \cup \emptyset$</td><td>$\{A, B\}$</td></tr>
          <tr><td>$\{A, B\}$</td><td>1</td><td>$\{A\} \cup \{C\}$</td><td>$\{A, C\}$ mới</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước hai, xử lý tập mới A, B. Đọc 0, A cho A, B còn B không có mũi tên nên cho tập rỗng, hợp lại vẫn là A, B. Đọc 1, A cho A còn B cho C, hợp lại được A, C, lại một tập mới."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Xử lý tập mới $\{A, C\}$ ($C$ không có mũi tên nào đi ra):</p>
          <table class="t"><tr><th>từ tập</th><th>đọc</th><th>hợp</th><th>được</th></tr>
          <tr><td>$\{A, C\}$</td><td>0</td><td>$\{A, B\} \cup \emptyset$</td><td>$\{A, B\}$</td></tr>
          <tr><td>$\{A, C\}$</td><td>1</td><td>$\{A\} \cup \emptyset$</td><td>$\{A\}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, xử lý tập A, C, để ý C không có mũi tên nào đi ra. Đọc 0 được A, B hợp rỗng, là A, B. Đọc 1 được A hợp rỗng, là A, cả hai đều là tập đã có."
      - show: |
          <p><b>Bước 4.</b> Gom lại thành bảng chuyển của máy mới:</p>
          <table class="t"><tr><th>tập</th><th>đọc 0</th><th>đọc 1</th></tr>
          <tr><td>$\{A\}$</td><td>$\{A, B\}$</td><td>$\{A\}$</td></tr>
          <tr><td>$\{A, B\}$</td><td>$\{A, B\}$</td><td>$\{A, C\}$</td></tr>
          <tr><td>$\{A, C\}$</td><td>$\{A, B\}$</td><td>$\{A\}$</td></tr></table>
          <p>Không sinh thêm tập mới → dừng. Chỉ <b>3</b> trong $2^3 = 8$ tập có thể tới được.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bước bốn, gom ba bước lại thành bảng chuyển của máy mới. Từ tập A, đọc 0 được A, B, đọc 1 được A. Từ tập A, B, đọc 0 vẫn là A, B, đọc 1 được A, C. Từ A, C, đọc 0 được A, B, đọc 1 được A. Không sinh thêm tập mới nên dừng, chỉ 3 trong 8 tập có thể tới được."
      - clear: true
        show: |
          <div>{{DFA01}}</div>
          <p>Trong hình, “AB” là trạng thái $\{A, B\}$. Trạng thái nhận = mọi tập <b>có chứa</b> $C$: chỉ $\{A, C\}$.</p>
        focus: [1, 2, 2]
        say: "Đây là máy đơn định thu được, trong hình chữ A B nghĩa là tập A, B. Trạng thái nhận là mọi tập có chứa C, ở đây chỉ có tập A, C. Máy này đơn định, vì mỗi trạng thái có đúng một mũi tên cho mỗi ký hiệu."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "all(alg.nfa_run({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}, 'A', {'C'}, w)[0] == w.endswith('01') for w in alg.strings('01', 10))"
      - "len(alg.strings('01', 10)) == 2047"
      - "(lambda d: [p for p in __import__('itertools').product('ABC', repeat=3) if all(p[i] in d.get(((('A',) + p)[i], '101'[i]), set()) for i in range(3))])({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}) == [('A', 'A', 'A'), ('A', 'B', 'C')]"
      - "[sorted(s) for s in alg.nfa_run({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}, 'A', {'C'}, '101')[1]] == [['A'], ['A'], ['A', 'B'], ['A', 'C']]"
    steps:
      - show: |
          <table class="t"><tr><th>cách kiểm</th><th>nội dung</th></tr>
          <tr><td><b>Ý nghĩa tập</b></td><td>$\{A, C\}$ = “vừa đọc xong $01$”; $\{A, B\}$ = “vừa đọc chữ 0”; $\{A\}$ = các trường hợp còn lại</td></tr>
          <tr><td><b>Đối chiếu</b></td><td>máy chạy NFA trên cả 2047 chuỗi độ dài tới 10 — nhận đúng các chuỗi kết thúc bằng $01$</td></tr>
          <tr><td><b>Đơn định</b></td><td>mỗi ô của bảng có đúng một tập</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, đặt tên ý nghĩa cho từng tập, tập A, C nghĩa là vừa đọc xong 0 1, tập A, B nghĩa là vừa đọc chữ 0, còn tập A là các trường hợp khác. Hai, đối chiếu, máy chạy thử trên cả 2047 chuỗi độ dài tới 10, nhận đúng các chuỗi kết thúc bằng 0 1. Ba, kiểm đơn định, mỗi ô của bảng có đúng một tập."
      - clear: true
        show: |
          <p>Làm thử bằng tay với $101$ theo <b>hai đường</b>. Đường 1, liệt kê từng nhánh đoán của NFA:</p>
          <table class="t"><tr><th>nhánh</th><th>đọc 1</th><th>đọc 0</th><th>đọc 1</th><th>dừng ở</th></tr>
          <tr><td>luôn ở lại $A$</td><td>$A$</td><td>$A$</td><td>$A$</td><td>$A$: không nhận</td></tr>
          <tr><td>đoán 0 là chữ áp chót</td><td>$A$</td><td>$B$</td><td>$C$</td><td>$C$: <b>nhận</b></td></tr></table>
          <p>Đường 2, chạy máy đơn định: $\{A\} \xrightarrow{1} \{A\} \xrightarrow{0} \{A, B\} \xrightarrow{1} \{A, C\}$, chứa $C$ → <b>nhận</b> ✓</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Làm thử bằng tay với chuỗi 1 0 1 theo hai đường khác nhau. Đường một là liệt kê từng nhánh đoán, nhánh luôn ở lại A dừng ở A, không nhận. Nhánh đoán chữ 0 là chữ áp chót đi A, B rồi C, dừng ở trạng thái nhận. Đường hai là chạy máy đơn định vừa dựng, tập đi từ A, vẫn A, sang A, B rồi A, C, có chứa C nên nhận. Có một nhánh nhận, và máy đơn định cũng nhận, hai đường khớp nhau."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "len(alg.subset_construct({(0, '0'): {0}, (0, '1'): {0, 1}} | {(i, a): {i + 1} for i in range(1, 3) for a in '01'}, 0, '01')[0]) == 8"
      - "len(alg.subset_construct({(0, '0'): {0}, (0, '1'): {0, 1}} | {(i, a): {i + 1} for i in range(1, 2) for a in '01'}, 0, '01')[0]) == 4"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ NFA đoán ngẫu nhiên <b class="red">(sai)</b>
          <br><span class="note">Không có xác suất: nhận khi <b>tồn tại</b> một nhánh nhận. Ta mô phỏng mọi nhánh cùng lúc bằng tập.</span></div>
        say: "Lỗi thứ nhất, nghĩ máy không đơn định đoán ngẫu nhiên. Ở đây không có xác suất nào, máy nhận khi tồn tại một nhánh nhận, và ta mô phỏng mọi nhánh cùng lúc bằng tập."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Bỏ quên tập rỗng $\emptyset$ <b class="red">(thiếu)</b>
          <br><span class="note">Nếu mọi nhánh chết, tập là $\emptyset$ — nó cũng là một trạng thái của DFA (trạng thái chết, không bao giờ nhận).</span></div>
        say: "Lỗi thứ hai, bỏ quên tập rỗng. Nếu mọi nhánh đều chết thì tập là rỗng, và nó cũng là một trạng thái của máy đơn định, gọi là trạng thái chết, không bao giờ nhận."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ coi tập bằng đúng $\{C\}$ là nhận <b class="red">(sai)</b>
          <br><span class="note">Một tập là trạng thái nhận khi nó <b>chứa</b> ít nhất một trạng thái nhận của NFA.</span></div>
        say: "Lỗi thứ ba, chỉ coi tập bằng đúng C là trạng thái nhận. Một tập là trạng thái nhận khi nó chứa ít nhất một trạng thái nhận của máy không đơn định."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ DFA dựng ra luôn nhỏ <b class="red">(sai)</b>
          <br><span class="note">“Ký hiệu thứ 3 tính từ cuối là 1”: NFA có 4 trạng thái, nhưng DFA cần đủ $2^3 = 8$. Nói chung $n + 1$ so với $2^n$: mạnh như nhau, <b>không</b> nhỏ như nhau.</span></div>
          <table class="t"><tr><th>“ký hiệu thứ $n$ tính từ cuối là 1”</th><th>NFA</th><th>DFA dựng ra</th></tr>
          <tr><td>$n = 2$</td><td>3</td><td>$2^2 = 4$</td></tr><tr><td>$n = 3$</td><td>4</td><td>$2^3 = 8$</td></tr></table>
        focus: [1, 2, 1]
        say: "Lỗi thứ tư, nghĩ máy đơn định dựng ra luôn nhỏ. Với ngôn ngữ ký hiệu thứ 3 tính từ cuối là 1, máy không đơn định có 4 trạng thái, nhưng máy đơn định cần đủ 8. Hai loại máy mạnh như nhau, nhưng không nhỏ như nhau."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[sorted(s) for s in alg.nfa_run({('A', '0'): {'A', 'B'}, ('A', '1'): {'A'}, ('B', '1'): {'C'}}, 'A', {'C'}, '0110')[1]] == [['A'], ['A', 'B'], ['A', 'C'], ['A'], ['A', 'B']]"
      - "len(alg.subset_construct({(0, '0'): {0}, (0, '1'): {0, 1}} | {(i, a): {i + 1} for i in range(1, 4) for a in '01'}, 0, '01')[0]) == 16 == 2 * 2 * 2 * 2"
    steps:
      - show: |
          <div>{{NFA01}}</div>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chạy NFA trên $0110$ bằng tập trạng thái. Nhận hay từ chối?</td></tr>
          <tr><td>2</td><td>NFA cho “ký hiệu thứ 4 tính từ cuối là 1” có 5 trạng thái. Dựng tập con được bao nhiêu trạng thái?</td></tr></table>
        focus: [0, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chạy máy không đơn định trên chuỗi 0 1 1 0 bằng tập trạng thái, máy nhận hay từ chối? Câu hai, máy không đơn định cho ngôn ngữ ký hiệu thứ 4 tính từ cuối là 1 có 5 trạng thái. Dựng tập con thì được bao nhiêu trạng thái? Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <table class="t"><tr><th>tập đang có</th><th>đọc</th><th>tra bảng của bước 4</th></tr>
          <tr><td>$\{A\}$</td><td>0</td><td>$\{A, B\}$</td></tr><tr><td>$\{A, B\}$</td><td>1</td><td>$\{A, C\}$</td></tr>
          <tr><td>$\{A, C\}$</td><td>1</td><td>$\{A\}$</td></tr><tr><td>$\{A\}$</td><td>0</td><td>$\{A, B\}$</td></tr></table>
          <p>① Tập cuối $\{A, B\}$ không chứa $C$ → <b>từ chối</b> (chuỗi kết thúc bằng $10$).</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Đáp án câu một, tra từng ô của bảng chuyển đã dựng. Từ tập A đọc 0 sang A, B. Từ A, B đọc 1 sang A, C. Từ A, C đọc 1 về tập A. Từ tập A đọc 0 lại sang A, B. Tập cuối không chứa C nên máy từ chối, đúng vì chuỗi kết thúc bằng 1 0."
      - show: |
          <p>② Máy đơn định phải nhớ đủ <b>4 bit cuối</b>, mỗi bit 2 khả năng:</p>
          $$2 \times 2 \times 2 \times 2 = 2^4 = \hl{16}$$
        focus: [1, 2]
        say: "Câu hai, máy đơn định phải nhớ đủ 4 bit cuối, vì chưa biết chuỗi còn dài bao nhiêu nữa. Mỗi bit có 2 khả năng, nên dựng tập con được 2 nhân 2 nhân 2 nhân 2, tức 2 mũ 4, bằng 16 trạng thái."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">NFA: $\delta$ cho một tập</span><span class="a">→</span>
          <span class="n">nhận nếu có một nhánh nhận</span><span class="a">→</span>
          <span class="n">chạy bằng tập trạng thái</span><span class="a">→</span>
          <span class="n">dựng tập con → DFA</span></div>
        say: "Tổng kết lại, ở máy không đơn định, hàm chuyển cho một tập trạng thái, máy nhận nếu có một nhánh nhận. Ta chạy nó bằng tập trạng thái, và phép dựng tập con biến mỗi tập thành một trạng thái của máy đơn định."
      - show: |
          <div class="box key"><b>Tư duy:</b> “đoán” trong lý thuyết tính toán nghĩa là “thử mọi khả năng cùng lúc” — tiện để <b>thiết kế</b>, rồi dựng tập con để <b>chạy</b>.</div>
        say: "Điều cần mang theo, đoán trong lý thuyết tính toán nghĩa là thử mọi khả năng cùng lúc. Nó tiện để thiết kế, rồi ta dựng tập con để có máy chạy được."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): mô tả ngôn ngữ bằng một dòng chữ — <b>biểu thức chính quy</b>, và định lý Kleene nối nó với ôtômat.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta mô tả ngôn ngữ bằng một dòng chữ, gọi là biểu thức chính quy, và học định lý nối nó với ô-tô-mát. Hẹn gặp bạn ở bài tiếp theo."
