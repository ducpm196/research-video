- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">quy tắc: một biến → chuỗi</span><span class="a">→</span>

      <span class="n">suy dẫn tới khi hết biến</span><span class="a">→</span>

      <span class="n">cây suy dẫn</span><span class="a">→</span>

      <span class="n">mạnh hơn chính quy</span></div>

      '
    say: Tổng kết lại, mỗi quy tắc thay một biến bằng một chuỗi, ta suy dẫn cho đến khi hết biến, và cây suy dẫn ghi lại quá trình đó. Văn phạm phi ngữ cảnh mạnh hơn ngôn ngữ chính quy, vì nó có đệ quy.
  - show: '<div class="box key"><b>Tư duy:</b> cấu trúc <b>lồng nhau</b> (ngoặc, khối lệnh, thẻ HTML — ngôn ngữ đánh dấu trang mạng) cần đệ quy — tức văn phạm, không phải biểu thức chính quy.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Văn phạm 2 quy tắc sinh hết chuỗi ngoặc dài 6 ($C_3 = 5$), còn ở trình biên dịch thật phân tích tệp mã 10 000 dòng cần hàng trăm quy tắc phi ngữ cảnh nhưng vẫn không thừa vì mỗi biến chỉ thay độc lập ngữ cảnh.</p>

      '
    say: Điều cần mang theo, cấu trúc lồng nhau như ngoặc, khối lệnh hay thẻ lồng trong trang mạng cần đệ quy, tức là văn phạm, không phải biểu thức chính quy. Văn phạm 2 quy tắc sinh hết chuỗi ngoặc dài 6. Ở trình biên dịch thật với tệp 10 nghìn dòng cần hàng trăm quy tắc nhưng mỗi biến vẫn thay độc lập.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: '<p class="note">Bài sau (bài 7): một chuỗi có <b>hai</b> cây suy dẫn thì sao? <b>Văn phạm mơ hồ</b> và cách trình biên dịch phân tích $1 + 2 \times 3$.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 7, ta xem điều gì xảy ra khi một chuỗi có hai cây suy dẫn, gọi là văn phạm mơ hồ. Ta cũng xem cách trình biên dịch phân tích cú pháp biểu thức 1 cộng 2 nhân 3. Hẹn gặp bạn ở bài tiếp theo.
