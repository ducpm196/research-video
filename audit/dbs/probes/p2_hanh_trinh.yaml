name: dbs_p2_hanh_trinh
# Vòng 2 (2026-11-02, bài L17 hành trình tiến hoá lược đồ): tên tổ chức / sản phẩm cần gọi tên nguồn trong lời đọc.
ctx:
  - "Theo {}, ta xét hệ thống này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "github"
    variants: ["GitHub", "Gít-háp", "Ghít hắp"]
    negative: "Gít-lắp"
    keys: ["github", "githap", "githup", "githab", "githubs"]
  - key: "stripe"
    variants: ["Stripe", "Xờ-trai", "Xờ-trai-pơ"]
    negative: "Xờ-tai"
    keys: ["stripe", "stryp", "xotrai", "sotrai", "strai"]
  - key: "mysql"
    variants: ["MySQL", "Mai ét quy eo", "Mai-ét-kiu-eo"]
    negative: "Mai ét quy em"
    keys: ["mysql", "maietquyeo", "myetquyeo", "maisql", "myesql"]
  - key: "postgresql"
    variants: ["PostgreSQL", "Pốt-grét", "Pốt-grét ét quy eo"]
    negative: "Pốt-tơ-rét"
    keys: ["postgres", "potgret", "postgre", "potgres", "postgret"]
