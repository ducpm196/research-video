name: dbs_p1_sql
# Vòng 1 cho DBS: tên viết tắt và chữ Hy Lạp có trong LỜI ĐỌC (từ khoá SQL không đọc — lời đọc mô tả mệnh đề bằng tiếng Việt).
#   Đọc BẢN CHÉP (khoá ngắn dễ khớp giả). Chú ý YAML: `key: null` không ngoặc là giá trị rỗng — mọi key viết trong ngoặc kép.
ctx:
  - "Ta viết {} ở đầu câu truy vấn."
  - "Phần {} được xử lý ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "sql"
    variants: ["SQL", "ét quy eo", "ét-kiu-eo"]
    negative: "ét quy em"
    keys: ["sql", "etquyeo", "etkiueo", "esqueel", "etkieo", "etquieo", "esql"]
  - key: "bcnf"
    variants: ["BCNF", "bê xê en ép", "bi xi en ép"]
    negative: "bê xê em ép"
    keys: ["bcnf", "bexeenep", "bixienep", "bcenep"]
  - key: "acid"
    variants: ["ACID", "a-xít", "a xê i đê"]
    negative: "a-xích"
    keys: ["acid", "axit", "axeide", "aceid"]
  - key: "nosql"
    variants: ["NoSQL", "nô ét quy eo", "nâu ét quy eo"]
    negative: "nô ét quy em"
    keys: ["nosql", "noetquyeo", "nauetquyeo", "noesqueel", "nosequel"]
  - key: "sigma"
    variants: ["sigma", "xích ma", "xích-ma"]
    negative: "xích na"
    keys: ["sigma", "xichma", "sitma", "sichma"]
