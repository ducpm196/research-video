id: L03
course: PLC
series: "PLC · Ngôn ngữ lập trình và trình biên dịch"
title: "Bài 3 — Cây cú pháp trừu tượng, tính kết hợp và đánh giá"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/plc.yaml L03; audit/plc/verify_plc.py L03; R. Nystrom, Crafting Interpreters (2021), chương 5 và 7; ISO/IEC 9899:2018 (C17), mục 6.5.5 (chia nguyên làm tròn về 0)"
assumes: [arith, power]
# Quy ước: cây viết tiền tố (− (− 8 3) 2) và vẽ từ alg.parse_expr (assoc='left' hoặc 'right'). “**” là lũy thừa trong mã; trên
#   màn hình toán viết a^b. Chia nguyên: C làm tròn về 0, Python “//” làm tròn xuống — nêu ở lỗi 3. Mọi giá trị do alg.* / Python.
objectives:
  - "Phân biệt cây cú pháp đầy đủ và cây cú pháp trừu tượng"
  - "Hiểu tính kết hợp trái, phải và cách văn phạm quyết định nó"
  - "Đánh giá cây bằng đệ quy duyệt sau"
asr_reviewed:
  - {sentence: "In không ngoặc thành 8 trừ 3 trừ 2.", reason: "ASR chép “tình không hoạt thành 8 trừ 3 trừ 2.” (0.778): lệch âm/thanh thuần Việt: in/tình, ngoặc/hoạt — NOT_VERIFIED bằng tai người"}
  - {sentence: "Âm 7 chia nguyên cho 2, ngôn ngữ C làm tròn về 0 được âm 3, còn có ngôn ngữ làm tròn xuống được âm 4.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "8 − 3 − 2 bằng 3 hay 7?"
    checks:
      - "(8 - 3) - 2 == 3 and 8 - (3 - 2) == 7"
    steps:
      - show: |
          <p>Hai phép trừ cùng mức ưu tiên. Gộp bên trái trước: 3. Gộp bên phải trước: 7. Ưu tiên toán tử (bài 2) không trả lời được câu này.</p>
          <div class="box key">Hôm nay: <b>cây cú pháp trừu tượng</b>, <b>tính kết hợp</b>, và cách máy <b>đánh giá</b> một cây.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, trong 8 trừ 3 trừ 2, hai phép trừ có cùng mức ưu tiên. Gộp bên trái trước thì được 3, gộp bên phải trước thì được 7. Độ ưu tiên toán tử ở bài 2 không trả lời được câu này. Hôm nay ta học cây cú pháp trừu tượng, tính kết hợp, và cách máy đánh giá một cây."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cây của bài 2 và hàm tự gọi chính nó"
    checks:
      - "alg.ast_str(alg.parse_expr('2+3*4')) == '(+ 2 (* 3 4))' and alg.ast_eval(alg.parse_expr('2+3*4')) == 14 and 3 * 4 == 12"
      - "(lambda d: exec('def tong(n):\\n    return 0 if n == 0 else n + tong(n - 1)\\nr = [tong(k) for k in range(4)]\\n', d) or d['r'] == [0, 1, 3, 6])({})"
    steps:
      - show: |
          <p>Ở bài 2, hàm phân tích có một tầng cho cộng, trừ và một tầng <b>sâu hơn</b> cho nhân, chia. Vì thế với <code>2 + 3 * 4</code>:</p>
          <table class="t"><tr><th>phần của cây</th><th>nội dung</th></tr>
          <tr><td>gốc</td><td>phép <code>+</code></td></tr>
          <tr><td>con trái</td><td>lá <code>2</code></td></tr>
          <tr><td>con phải</td><td>cây con <code>(* 3 4)</code> = 12 → cả cây = $\hl{14}$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Trước hết, ở bài 2, hàm phân tích có một tầng cho cộng trừ và một tầng sâu hơn cho nhân chia. Vì thế phép nhân nằm sâu hơn trong cây và được tính trước. Với 2 cộng 3 nhân 4, gốc của cây là phép cộng. Con trái là lá 2. Con phải là cây con 3 nhân 4 bằng 12, nên cả cây bằng 14."
      - show: |
          <div class="code"><div>def tong(n):</div><div>    return 0 nếu n = 0, còn không thì n + tong(n − 1)</div></div>
          <p><b>Đệ quy</b>: hàm gọi chính nó với bài toán nhỏ hơn, tới khi gặp trường hợp dừng. <code>tong(3)</code> = 3 + <code>tong(2)</code> = 3 + 2 + <code>tong(1)</code> = 3 + 2 + 1 + 0 = $\hl{6}$.</p>
        focus: [1, 2, 2, 2]
        say: "Điều thứ hai là đệ quy, một hàm gọi chính nó với bài toán nhỏ hơn, cho tới khi gặp trường hợp dừng. Hàm tổng của n trả 0 khi n bằng 0, còn không thì trả n cộng tổng của n trừ 1. Tổng của 3 bằng 3 cộng tổng của 2, tức 3 cộng 2 cộng tổng của 1. Cuối cùng là 3 cộng 2 cộng 1 cộng 0, bằng 6."

  - id: sym
    kind: symbol
    title: "Giải mã: cây đầy đủ và cây trừu tượng"
    steps:
      - show: |
          <p><b>Cây cú pháp đầy đủ</b> có một nút cho mỗi bước dùng luật: biểu thức, hạng, nguyên tố, dấu ngoặc…</p>
          <p><b>Cây cú pháp trừu tượng</b> chỉ giữ phần mang nghĩa: mỗi phép một nút, hai con là hai toán hạng. Dấu ngoặc biến mất — vị trí trong cây đã nói ai được tính trước.</p>
          <div class="box key">Các pha sau (kiểm kiểu, tối ưu, sinh mã) đều làm việc trên cây trừu tượng.</div>
        focus: [1, 2, 2, 3]
        say: "Cây cú pháp đầy đủ có một nút cho mỗi bước dùng luật, như biểu thức, hạng, nguyên tố, dấu ngoặc. Cây cú pháp trừu tượng chỉ giữ phần mang nghĩa, mỗi phép một nút, hai con là hai toán hạng. Dấu ngoặc biến mất, vì vị trí trong cây đã nói cái nào được tính trước. Các pha sau, như kiểm kiểu, tối ưu và sinh mã, đều làm việc trên cây trừu tượng."

  # ───────────────────────── 3. KẾT HỢP ─────────────────────────
  - id: assoc
    kind: concept
    title: "Tính kết hợp do văn phạm quyết định"
    checks:
      - "alg.ast_str(alg.parse_expr('8-3-2')) == '(- (- 8 3) 2)' and alg.ast_eval(alg.parse_expr('8-3-2')) == 3"
      - "alg.ast_str(alg.parse_expr('8-3-2', 'right')) == '(- 8 (- 3 2))' and alg.ast_eval(alg.parse_expr('8-3-2', 'right')) == 7"
    steps:
      - show: |
          <div>{{LR}}</div>
          <p>Vòng lặp của bài 2 ghép cây cũ vào <b>bên trái</b> nút mới → <b>kết hợp trái</b>: <code>(- (- 8 3) 2)</code> = $\hl{3}$, đúng quy ước toán học.</p>
          <p class="note">Viết <code>expr ::= term "-" expr</code> (gọi đệ quy bên phải) sẽ ra kết hợp phải = 7 — sai cho phép trừ.</p>
        focus: [1, 2, 2, 3]
        say: "Hai cây trên hình khác nhau ở chỗ ghép. Vòng lặp của bài 2 luôn ghép cây cũ vào bên trái nút mới, nên cho kết hợp trái. Kết quả là 8 trừ 3 trước, rồi trừ 2, được 3, đúng quy ước toán học. Nếu viết văn phạm gọi đệ quy ở bên phải, ta được kết hợp phải, ra 7, sai cho phép trừ."
      - clear: true
        show: |
          <p>Phép <b>lũy thừa</b> thì quy ước kết hợp <b>phải</b>: $2^{3^2} = 2^{9} = \hl{512}$, không phải $(2^3)^2 = 64$.</p>
          <div class="box key">Phép cộng và nhân kết hợp được nên thứ tự gộp không đổi kết quả. Trừ, chia, lũy thừa thì <b>có</b>: văn phạm phải chọn đúng hướng cho từng phép.</div>
        focus: [1, 2, 2]
        say: "Phép lũy thừa thì quy ước kết hợp phải, 2 mũ 3 mũ 2 bằng 2 mũ 9, tức 512, chứ không phải 2 mũ 3 rồi bình phương, bằng 64. Phép cộng và phép nhân có tính kết hợp nên thứ tự gộp không đổi kết quả. Trừ, chia và lũy thừa thì có đổi, nên văn phạm phải chọn đúng hướng cho từng phép."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: giá trị chảy từ lá lên gốc"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><g stroke="#1f2937" stroke-width="3"><line x1="750" y1="70" x2="450" y2="200"/><line x1="750" y1="70" x2="1050" y2="200"/><line x1="450" y1="200" x2="300" y2="330"/><line x1="450" y1="200" x2="600" y2="330"/></g><circle cx="750" cy="70" r="42" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="750" y="81" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">−</text><circle cx="450" cy="200" r="42" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="450" y="211" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">−</text><circle cx="1050" cy="200" r="42" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1050" y="211" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">2</text><circle cx="300" cy="330" r="42" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="300" y="341" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">8</text><circle cx="600" cy="330" r="42" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="600" y="341" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><g font-size="26" font-weight="bold"><text x="810" y="40" fill="#059669">lượt 5: 5 − 2 = 3</text><text x="385" y="185" text-anchor="end" fill="#059669">lượt 3: 8 − 3 = 5</text><text x="1050" y="275" text-anchor="middle" fill="#eb6834">lượt 4: lá 2</text><text x="300" y="405" text-anchor="middle" fill="#eb6834">lượt 1: lá 8</text><text x="600" y="405" text-anchor="middle" fill="#eb6834">lượt 2: lá 3</text></g><text x="1200" y="390" font-size="24" text-anchor="middle" fill="#1f2937">con trước, cha sau</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cây kết hợp trái của 8 trừ 3 trừ 2, chữ lượt cho biết thứ tự máy chạm tới từng nút. Máy đi xuống tận lá trước, lượt một là lá 8, lượt hai là lá 3. Có đủ hai con rồi, lượt ba mới tính được nút trừ bên trái, 8 trừ 3 bằng 5. Lượt bốn lấy lá 2, và lượt năm tính gốc, 5 trừ 2 bằng 3, nên giá trị chảy từ lá lên gốc."

  - id: example
    kind: example
    title: "Đánh giá cây bằng đệ quy"
    checks:
      - "alg.ast_eval(('-', ('-', 8, 3), 2)) == 3 and alg.ast_eval(('-', 8, 3)) == 5"
    steps:
      - show: |
          <div class="code"><div>def eval(n):</div><div>    if n là số: return n</div><div>    a = eval(con trái); b = eval(con phải)</div><div>    return a (phép) b</div></div>
          <p><b>Bước một — đứng ở gốc</b> <code>(- (- 8 3) 2)</code>: gốc là phép trừ, hai con chưa có giá trị → chưa tính được, đi xuống con trái.</p>
        focus: [1, 1, 2, 2]
        say: "Đánh giá cây rất ngắn gọn. Nếu nút là một số thì trả về số đó, còn không thì đánh giá con trái, đánh giá con phải, rồi áp dụng phép của nút. Bước một, ta đứng ở gốc của cây kết hợp trái, gốc là phép trừ. Hai con của gốc chưa có giá trị, nên chưa tính được gì, ta đi xuống con trái trước."
      - show: |
          <p><b>Bước 2 — con trái</b> <code>(- 8 3)</code>: hai con là lá 8 và lá 3, trả ngay → $8 - 3 = \hl{5}$.</p>
        say: "Bước hai, con trái là cây con 8 trừ 3. Hai con của nó đều là lá, lá 8 và lá 3, nên trả về ngay, và cây con này bằng 8 trừ 3, tức là 5."
      - show: |
          <p><b>Bước 3 — con phải</b> của gốc là lá <code>2</code> → trả ngay $\hl{2}$.</p>
        say: "Bước ba, quay lên gốc rồi đi xuống con phải. Con phải là lá 2, một con số, nên hàm đánh giá trả về 2 ngay lập tức."
      - show: |
          <p><b>Bước 4 — quay về gốc</b>: đã có hai giá trị 5 và 2 → $5 - 2 = \hl{3}$.</p>
          <p class="note">Hai con được tính trước nút cha: đây là <b>duyệt sau</b>.</p>
        focus: [1, 2]
        say: "Bước bốn, quay về gốc, lúc này đã có đủ hai giá trị là 5 và 2, nên gốc bằng 5 trừ 2, tức là 3. Hai con được tính trước nút cha, cách đi như vậy gọi là duyệt sau."

  - id: check
    kind: check
    title: "Tự kiểm: hỏi trình phân tích của một ngôn ngữ thật"
    checks:
      - "(lambda b: type(b.left).__name__ == 'BinOp' and type(b.right).__name__ == 'Constant')(__import__('ast').parse('8-3-2', mode='eval').body) and eval('8-3-2') == 3"
      - "(lambda b: type(b.left).__name__ == 'Constant' and type(b.right).__name__ == 'BinOp')(__import__('ast').parse('2**3**2', mode='eval').body) and eval('2**3**2') == 512"
    steps:
      - show: |
          <table class="t"><tr><th>biểu thức</th><th>cây do trình phân tích thật dựng</th><th>chạy thật</th><th>khớp?</th></tr>
          <tr><td><code>8-3-2</code></td><td>con <b>trái</b> là phép trừ, con phải là lá 2</td><td>3</td><td>✓ kết hợp trái</td></tr>
          <tr><td><code>2**3**2</code></td><td>con trái là lá 2, con <b>phải</b> là phép lũy thừa</td><td>512</td><td>✓ kết hợp phải</td></tr></table>
        focus: [1, "1.2", "1.3", 1]
        say: "Kiểm bằng đường khác, thay vì tự vẽ cây, ta hỏi chính trình phân tích của một ngôn ngữ thật, nó cho xem cây nó dựng ra. Với 8 trừ 3 trừ 2, con trái của gốc là một phép trừ, con phải là lá 2, đúng là kết hợp trái, và chạy thật ra 3. Với 2 mũ 3 mũ 2, con trái là lá 2, con phải là một phép lũy thừa, đúng là kết hợp phải, và chạy thật ra 512. Cả hai khớp với những gì ta vừa suy ra bằng tay."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "alg.ast_eval(alg.parse_expr('16/4/2')) == 2 and alg.ast_eval(alg.parse_expr('16/4/2', 'right')) == 8"
      - "int(-7 / 2) == -3 and -7 // 2 == -4"
      - "alg.ast_eval(('-', 8, ('-', 3, 2))) == 7 and alg.parse_expr('8-3-2') == ('-', ('-', 8, 3), 2) and alg.ast_eval(alg.parse_expr('8-3-2')) == 3 and alg.parse_expr('8-(3-2)') == ('-', 8, ('-', 3, 2))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng đệ quy phải cho mọi phép cho gọn <b class="red">(sai)</b>
          <br><span class="note"><code>16/4/2</code>: trái → 2, phải → 8. Trừ và chia phải kết hợp trái.</span></div>
        say: "Lỗi thứ nhất, dùng đệ quy phải cho mọi phép cho gọn. Với 16 chia 4 chia 2, kết hợp trái cho 2, kết hợp phải cho 8, nên trừ và chia phải kết hợp trái."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Giữ dấu ngoặc trong cây trừu tượng <b class="red">(thừa)</b>
          <br><span class="note">Ngoặc chỉ để pha cú pháp dựng đúng cây. Dựng xong, hình dạng cây đã mang thông tin đó.</span></div>
        say: "Lỗi thứ hai, giữ dấu ngoặc trong cây trừu tượng. Ngoặc chỉ giúp pha cú pháp dựng đúng cây, dựng xong thì hình dạng cây đã mang thông tin đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ mọi ngôn ngữ chia nguyên giống nhau <b class="red">(sai)</b>
          <br><span class="note">$-7$ chia nguyên cho 2: C làm tròn về 0 → $-3$; phép <code>//</code> của Python làm tròn xuống → $-4$. Cùng cây, khác quy tắc đánh giá.</span></div>
        say: "Lỗi thứ ba, nghĩ mọi ngôn ngữ chia nguyên giống nhau. Âm 7 chia nguyên cho 2, ngôn ngữ C làm tròn về 0 được âm 3, còn có ngôn ngữ làm tròn xuống được âm 4. Cùng một cây, nhưng quy tắc đánh giá khác nhau."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Viết công cụ in cây ra chữ (định dạng mã, sinh mã) mà bỏ hết ngoặc.</div>
          <table class="t"><tr><th>giai đoạn</th><th>nội dung</th><th>giá trị</th></tr>
          <tr><td>cây gốc</td><td><code>(- 8 (- 3 2))</code></td><td>7</td></tr>
          <tr><td>in không ngoặc</td><td><code>8 - 3 - 2</code></td><td>—</td></tr>
          <tr><td>đọc lại</td><td><code>(- (- 8 3) 2)</code></td><td><b class="red">3</b></td></tr></table>
          <p class="note">Người có kinh nghiệm chạy <b>phép thử khứ hồi</b>: in cây ra chữ, đọc lại, so hai cây. In đúng phải giữ ngoặc: <code>8 - (3 - 2)</code>.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, viết công cụ in cây ra chữ, như bộ định dạng mã hay bộ sinh mã, mà bỏ hết dấu ngoặc cho gọn. Cây gốc là 8 trừ cho cây con 3 trừ 2, có giá trị 7. In không ngoặc thành 8 trừ 3 trừ 2. Đọc lại chuỗi đó, trình phân tích dựng cây kết hợp trái, và giá trị đổi thành 3. Người có kinh nghiệm luôn chạy phép thử khứ hồi, in cây ra chữ, đọc lại rồi so hai cây, và chỉ bỏ ngoặc khi chắc rằng cây không đổi."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.ast_eval(alg.parse_expr('20/5/2')) == 2 and alg.ast_str(alg.parse_expr('20/5/2')) == '(/ (/ 20 5) 2)'"
      - "2 ** 2 ** 3 == 256 and (2 ** 2) ** 3 == 64"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Viết cây kết hợp trái của <code>20/5/2</code> và tính.</td></tr>
          <tr><td>2</td><td>$2^{2^3}$ theo quy ước kết hợp phải bằng bao nhiêu? Nếu kết hợp trái?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, viết cây kết hợp trái của 20 chia 5 chia 2 và tính giá trị. Câu hai, 2 mũ 2 mũ 3 theo quy ước kết hợp phải bằng bao nhiêu? Nếu kết hợp trái thì sao? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1 — từng bước</th><th>giá trị</th></tr>
          <tr><td>cây: <code>(/ (/ 20 5) 2)</code>, gốc là phép chia</td><td>—</td></tr>
          <tr><td>con trái <code>(/ 20 5)</code></td><td>4</td></tr>
          <tr><td>gốc: 4 chia 2</td><td>$\hl{2}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, giải từng bước. Kết hợp trái cho cây có phép chia ở gốc, con trái là cây con 20 chia 5, con phải là lá 2. Duyệt sau tính con trái trước, 20 chia 5 bằng 4. Rồi tính gốc, 4 chia 2 bằng 2."
      - show: |
          <table class="t"><tr><th>câu 2</th><th>bước 1</th><th>bước 2</th></tr>
          <tr><td>kết hợp phải: $2^{(2^3)}$</td><td>$2^3 = 8$</td><td>$2^8 = \hl{256}$</td></tr>
          <tr><td>kết hợp trái: $(2^2)^3$</td><td>$2^2 = 4$</td><td>$4^3 = 64$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu hai, cũng tính từ trong ra ngoài. Kết hợp phải tính số mũ trên cùng trước, 2 mũ 3 bằng 8, rồi 2 mũ 8 bằng 256. Kết hợp trái tính 2 mũ 2 bằng 4 trước, rồi 4 mũ 3 bằng 64, nên hai cách lệch nhau rất xa."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cây trừu tượng: mỗi phép một nút</span><span class="a">→</span>
          <span class="n">vòng lặp → kết hợp trái</span><span class="a">→</span>
          <span class="n">lũy thừa: kết hợp phải</span><span class="a">→</span>
          <span class="n">đánh giá: duyệt sau</span></div>
        say: "Tổng kết lại, cây trừu tượng có mỗi phép một nút. Vòng lặp trong hàm phân tích cho kết hợp trái, lũy thừa thì kết hợp phải, và cây được đánh giá bằng duyệt sau."
      - show: |
          <div class="box key"><b>Tư duy:</b> một khi đã có đúng cấu trúc (cây), mọi việc sau đó — tính, kiểm, dịch — chỉ là một lần duyệt cây.</div>
        say: "Điều cần mang theo, một khi đã có đúng cấu trúc là cây, mọi việc sau đó, tính, kiểm hay dịch, chỉ là một lần duyệt cây."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): một tên trỏ tới biến nào? <b>Phạm vi tĩnh và động</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta trả lời câu hỏi một tên trỏ tới biến nào, với phạm vi tĩnh và phạm vi động. Hẹn gặp bạn ở bài tiếp theo."
