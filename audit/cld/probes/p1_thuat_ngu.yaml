name: cld_p1_thuat_ngu
# Vòng 1 cho CLD: thuật ngữ hạ tầng. Đọc BẢN CHÉP (khoá ngắn dễ khớp giả). Mọi key trong ngoặc kép.
ctx:
  - "Theo {}, ta xét hệ thống này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "kubernetes"
    variants: ["Kubernetes", "Ku-bơ-nét-tít", "Cu-bơ-nê-tít"]
    negative: "Ku-bơ-lét-tít"
    keys: ["kubernetes", "kubonettit", "cubonetit", "kubernetis", "cubernetes"]
  - key: "container"
    variants: ["container", "công-te-nơ", "công-ten-nơ"]
    negative: "công-te-lơ"
    keys: ["container", "congteno", "congtenno", "contener", "congtenơ"]
  - key: "pod"
    variants: ["Pod", "pót", "pốt"]
    negative: "pém"
    keys: ["pod", "pot", "pốt", "pót"]
  - key: "cpu"
    variants: ["CPU", "xê pê u", "xi pi iu"]
    negative: "xê bê u"
    keys: ["cpu", "xepeu", "xipiiu", "xêpêu"]
  - key: "microservice"
    variants: ["microservice", "mai-crô-xơ-vít", "mai crô sơ vít"]
    negative: "mai-crô-xơ-lít"
    keys: ["microservice", "maicroxovit", "maicrosovit", "micro service"]
  - key: "saga"
    variants: ["saga", "xa-ga", "sa-ga"]
    negative: "xa-la"
    keys: ["saga", "xaga", "sa ga", "xa ga"]
