id: L10
course: CLD
series: "CLD · Hệ thống hướng dịch vụ"
title: "Bài 10 — Dung lượng và hàng đợi: định luật Little, M/M/1"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cld.yaml L10; audit/cld/verify_cld.py L10; J. D. C. Little, A Proof for the Queuing Formula L = λW, Operations Research 9(3), 1961; L. Kleinrock, Queueing Systems, Vol. 1 (1975), mục 3.2 (M/M/1); CS115 (xác suất, kỳ vọng)"
assumes: [arith, cdot, frac, approx, ltgt]
# Quy ước: λ = tốc độ đến, μ = tốc độ phục vụ (yêu cầu/giây), ρ = λ/μ. M/M/1: đến theo quá trình Poisson, thời gian phục vụ mũ, một máy phục vụ,
#   λ < μ; thời gian trong hệ W = 1/(μ − λ), số yêu cầu trong hệ L = λW (alg.mm1). verify_cld.py mô phỏng sự kiện rời rạc để kiểm lại.
#   Hình: audit/cld/figs.py latency_curve (μ = 100). Tệp mẫu — sửa ở đây rồi chạy audit/cld/fill_all.py.
objectives:
  - "Dùng định luật Little"
  - "Giải thích vì sao độ trễ bùng nổ khi tải gần công suất"
  - "Chọn mức tải mục tiêu có dư địa"
asr_reviewed:
  - {sentence: "Đảo định luật Little ở tải 95, W bằng 19 chia 95 giây, đúng 200 mi li giây.", reason: "ASR chép “Đảo định lực liếc tổ ở tải 95, về đút bằng 19 chia 95 giây, đúng 200 mili giây.” (0.776): Little đọc thô (probe CLD p1: 5/8, ASR viết “lít tồ”); chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: luật (trong “luật little” → “lực liếc tổ”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Thời gian chờ bằng rô chia muy trừ lam-đa, tức 0 phẩy 8 chia 20 giây, bằng 40 mi li giây, cộng 10 mi li giây phục vụ là 50.", reason: "ASR chép “Thời gian chờ bằng row chi mươi trừ lambda tức 0,8 chia 20 giây bằng 40 ms cộng 10 ms phục vụ là 50.” (0.781): muy (μ) ASR viết “my/nguy”; tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: rô chia (trong “rô chia muy” → “row chi mươi”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Làm thử khi gần như không có tải, lam-đa xấp xỉ 0, thì W bằng 1 phần 100 giây, tức 10 mi li giây.", reason: "ASR chép “Làm thử khi gần như không có tải, làm đa xắp xỉ không, thì về đúc bằng 1 phần 100 giây, tức 10 mili giây.” (0.808): lam-đa (λ), ASR viết “lambda”; chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: xấp/xắp — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, dùng định luật Little để đếm số yêu cầu trong hệ.", reason: "ASR chép “Bước 3 Dùng định lực liết tồ để đếm số yêu cầu trong hệ.” (0.815): Little đọc thô (probe CLD p1: 5/8, ASR viết “lít tồ”); lệch âm/thanh thuần Việt: luật (trong “luật little” → “lực liết tồ”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cách này luôn dùng được, vì định luật Little đúng cho mọi hệ ổn định.", reason: "ASR chép “Cách này luôn dùng được vì định lực lít tô đúng cho mọi hệ ổn định.” (0.839): Little đọc thô (probe CLD p1: 5/8, ASR viết “lít tồ”); lệch âm/thanh thuần Việt: luật (trong “luật little” → “lực lít tô”) — NOT_VERIFIED bằng tai người"}
