  - {sentence: "Câu hai, theo Little, W bằng 30 chia 600 giây, tức 50 mi li giây, không cần biết phân phối.", reason: "ASR chép “Câu 2, theo liếc tụ, về đút bằng 30 chia 600 giây tức 50 mili giây không cần biết phân phối.” (0.809): Little đọc thô (probe CLD p1: 5/8, ASR viết “lít tồ”); W đọc tên chữ cái “vê đúp”, ASR viết “vê đúc/về đút” (đã chấp nhận ở các khoá trước); tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
