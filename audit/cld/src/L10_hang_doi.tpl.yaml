  - {sentence: "Lam-đa bằng 95 thì W bằng 1 phần 5 giây, tức 200 mi li giây, và có 19 yêu cầu trong hệ.", reason: "ASR chép “Lam đa bằng 95 thì về đúc bằng 1 phần 5 giây, tức 200 mili giây và có 19 yêu cầu trong hệ.” (0.889): W đọc tên chữ cái “vê đúp”, ASR viết “vê đúc/về đút” (đã chấp nhận ở các khoá trước); tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Theo Little, số yêu cầu trong hệ là 80 nhân 0 phẩy 05, bằng 4.", reason: "ASR chép “Theo listo, số yêu cầu trong hệ là 80 nhân 0.05 bằng 4.” (0.903): Little đọc thô (probe CLD p1: 5/8, ASR viết “lít tồ”); “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với mô hình hàng đợi một máy cơ bản, yêu cầu đến ngẫu nhiên, phục vụ ngẫu nhiên, và lam-đa nhỏ hơn muy, thời gian trong hệ W bằng 1 chia muy trừ lam-đa.", reason: "ASR chép “Với mô hình hàng đợi một máy cơ bản, yêu cầu đến ngẫu nhiên, phục vụ ngẫu nhiên và lambda nhỏ hơn nguy, thời gian trong hệ vê đúc bằng một chia nguy trừ lambda.” (0.904): muy (μ) ASR viết “my/nguy”; W đọc tên chữ cái “vê đúp”, ASR viết “vê đúc/về đút” (đã chấp nhận ở các khoá trước) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Định luật Little nói số yêu cầu đang ở trong hệ bằng tốc độ đến nhân thời gian mỗi yêu cầu ở trong hệ.", reason: "ASR chép “Định luật Lycto nói số yêu cầu đang ở trong hệ bằng tốc độ đến dân thời gian mỗi yêu cầu ở trong hệ.” (0.917): Little đọc thô (probe CLD p1: 5/8, ASR viết “lít tồ”); lệch âm/thanh thuần Việt: nhân/dân — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nhưng hình dạng dựng đứng gần công suất thì hệ nào cũng có, và định luật Little thì luôn đúng.", reason: "ASR chép “Nhưng hình dạng dựng đứng gần công suất thì hệ nào cũng có, và định luật liết tổ thì luôn đúng.” (0.927): Little đọc thô (probe CLD p1: 5/8, ASR viết “lít tồ”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tải tăng 19%, độ trễ tăng 4 lần"
    checks:
      - "round(alg.mm1(80, 100)[0] * 1000) == 50 and round(alg.mm1(95, 100)[0] * 1000) == 200 and round((95 - 80) / 80 * 100) == 19"
    steps:
      - show: |
          <p>Máy chủ xử lý được 100 yêu cầu mỗi giây. Lúc 80 yêu cầu mỗi giây, mỗi yêu cầu mất trung bình 50 ms. Tải tăng lên 95 — chỉ thêm 19% — và độ trễ thành $\hl{200}$ ms, gấp 4 lần.</p>
          <div class="box key">Hôm nay: <b>hàng đợi</b> — vì sao máy “chưa đầy” mà người dùng đã thấy chậm.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, máy chủ xử lý được 100 yêu cầu mỗi giây. Lúc tải 80 yêu cầu mỗi giây, mỗi yêu cầu mất trung bình 50 mi li giây. Tải tăng lên 95, chỉ thêm 19 phần trăm, mà độ trễ thành 200 mi li giây, gấp 4 lần. Hôm nay ta học hàng đợi, vì sao máy chưa đầy mà người dùng đã thấy chậm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tốc độ và thời gian, trung bình của số yêu cầu đến"
    checks:
      - "1000 / 100 == 10 and 1000 / 200 == 5 and 1000 / 20 == 50"
      - "sum([75, 90, 70, 85, 80]) == 400 and __import__('statistics').mean([75, 90, 70, 85, 80]) == 80"
    steps:
      - show: |
          <table class="t"><tr><th>máy phục vụ</th><th>mỗi yêu cầu mất</th></tr>
          <tr><td>100 yêu cầu/giây</td><td>1000 ms chia 100 = 10 ms</td></tr>
          <tr><td>200 yêu cầu/giây</td><td>1000 ms chia 200 = 5 ms</td></tr>
          <tr><td>20 yêu cầu/giây</td><td>1000 ms chia 20 = 50 ms</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước hết, ta ôn cách đổi tốc độ thành thời gian. Máy phục vụ 100 yêu cầu mỗi giây thì mỗi yêu cầu mất 1000 mi li giây chia 100, tức 10 mi li giây. Máy phục vụ 200 yêu cầu mỗi giây thì mỗi yêu cầu mất 1000 chia 200, bằng 5 mi li giây. Còn 20 yêu cầu mỗi giây thì mỗi yêu cầu mất 50 mi li giây."
      - show: |
          <table class="t"><tr><th>giây thứ</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>số yêu cầu đến</td><td>75</td><td>90</td><td>70</td><td>85</td><td>80</td></tr></table>
          <p>Trung bình $\frac{75 + 90 + 70 + 85 + 80}{5} = \frac{400}{5} = 80$ yêu cầu/giây — nhưng từng giây, và cả trong một giây, yêu cầu đến lúc thưa lúc dồn.</p>
        focus: [0, 1, 2, 2]
        say: "Ở khoá Toán cho khoa học máy tính, ta đã học trung bình, hay kỳ vọng. Giả sử đếm số yêu cầu đến trong 5 giây liền, được 75, 90, 70, 85 và 80. Trung bình là 400 chia 5, bằng 80 yêu cầu mỗi giây. Nhưng từng giây, và ngay trong một giây, yêu cầu đến lúc thưa lúc dồn, nên lúc dồn thì có yêu cầu phải đứng chờ."

  - id: sym
    kind: symbol
    title: "Giải mã: λ, μ, ρ, định luật Little"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$\lambda$</td><td>tốc độ yêu cầu <b>đến</b> (yêu cầu/giây)</td></tr>
          <tr><td>$\mu$</td><td>tốc độ <b>phục vụ</b> tối đa (yêu cầu/giây)</td></tr>
          <tr><td>$\rho = \frac{\lambda}{\mu}$</td><td><b>mức tải</b>: phần thời gian máy bận</td></tr></table>
          <p><b>Định luật Little</b> (1961): $L = \lambda \cdot W$ — số yêu cầu đang trong hệ bằng tốc độ đến nhân thời gian mỗi yêu cầu ở trong hệ. Đúng cho mọi hệ ổn định, không cần giả thiết phân phối.</p>
        introduces: [lambda_q, mu_q, rho_q]
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Bảng giới thiệu ba ký hiệu. Lam-đa là tốc độ yêu cầu đến, tính bằng yêu cầu mỗi giây. Muy là tốc độ phục vụ tối đa. Rô bằng lam-đa chia muy, là mức tải, tức phần thời gian máy bận. Định luật Little nói số yêu cầu đang ở trong hệ bằng tốc độ đến nhân thời gian mỗi yêu cầu ở trong hệ. Định luật này đúng cho mọi hệ ổn định, không cần giả thiết gì về phân phối."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cùng một máy, hai mức tải"
    checks:
      - "alg.mm1(80, 100)[:2] == (0.05, 4.0) and alg.mm1(95, 100)[:2] == (0.2, 19.0)"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><g fill="#1f2937"><text x="1180" y="34" text-anchor="middle" font-size="22" fill="#059669">máy: 100 yêu cầu/s</text><text x="20" y="108" font-size="24">tải 80/s</text><line x1="200" y1="100" x2="1100" y2="100" stroke="#6b7280" stroke-width="2"/><rect x="1064" y="85" width="30" height="30" rx="4" fill="#2a78d6"/><rect x="1028" y="85" width="30" height="30" rx="4" fill="#2a78d6"/><rect x="992" y="85" width="30" height="30" rx="4" fill="#2a78d6"/><circle cx="1180" cy="100" r="45" fill="#dcfce7" stroke="#059669" stroke-width="3"/><rect x="1165" y="85" width="30" height="30" rx="4" fill="#2a78d6"/><line x1="1225" y1="100" x2="1340" y2="100" stroke="#6b7280" stroke-width="2"/><text x="1350" y="108" font-size="22">xong</text><text x="700" y="170" text-anchor="middle" font-size="22" fill="#2a78d6">trung bình 4 yêu cầu trong hệ, mỗi yêu cầu ở lại 50 ms</text><text x="20" y="278" font-size="24">tải 95/s</text><line x1="200" y1="270" x2="1100" y2="270" stroke="#6b7280" stroke-width="2"/><rect x="1064" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="1028" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="992" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="956" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="920" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="884" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="848" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="812" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="776" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="740" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="704" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="668" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="632" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="596" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="560" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="524" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="488" y="255" width="30" height="30" rx="4" fill="#eb6834"/><rect x="452" y="255" width="30" height="30" rx="4" fill="#eb6834"/><circle cx="1180" cy="270" r="45" fill="#dcfce7" stroke="#059669" stroke-width="3"/><rect x="1165" y="255" width="30" height="30" rx="4" fill="#eb6834"/><line x1="1225" y1="270" x2="1340" y2="270" stroke="#6b7280" stroke-width="2"/><text x="1350" y="278" font-size="22">xong</text><text x="700" y="340" text-anchor="middle" font-size="22" fill="#eb6834">trung bình 19 yêu cầu trong hệ, mỗi yêu cầu ở lại 200 ms</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cùng một máy phục vụ 100 yêu cầu mỗi giây, ở hai mức tải. Ở tải 80, trung bình chỉ có 4 yêu cầu trong hệ, mỗi yêu cầu ở lại 50 mi li giây. Ở tải 95, máy hiếm khi rảnh nên lúc yêu cầu đến dồn thì hàng không kịp vơi, trung bình có 19 yêu cầu trong hệ và mỗi yêu cầu ở lại 200 mi li giây. Thời gian ở trong hệ gồm thời gian đứng chờ cộng thời gian được phục vụ, và phần tăng lên chủ yếu là đứng chờ."

  - id: example
    kind: example
    title: "Hàng đợi một máy: độ trễ theo tải"
    checks:
      - "alg.mm1(80, 100)[:2] == (0.05, 4.0) and alg.mm1(95, 100)[:2] == (0.2, 19.0) and round(alg.mm1(50, 100)[0] * 1000) == 20"
    steps:
      - show: |
          <p><b>Bước 1</b> — hàng đợi một máy cơ bản (đến ngẫu nhiên, phục vụ ngẫu nhiên, $\lambda \lt \mu$):</p>
          $$W = \frac{1}{\mu - \lambda}$$
          <p>Làm thử khi gần như không có tải, $\lambda \approx 0$: $W = \frac{1}{100}$ s = 10 ms — đúng bằng thời gian phục vụ, không ai phải chờ.</p>
        introduces: [ltgt]
        focus: [1, 2, 3, 3]
        say: "Bước một, ta dùng công thức của hàng đợi một máy. Với mô hình hàng đợi một máy cơ bản, yêu cầu đến ngẫu nhiên, phục vụ ngẫu nhiên, và lam-đa nhỏ hơn muy, thời gian trong hệ W bằng 1 chia muy trừ lam-đa. Làm thử khi gần như không có tải, lam-đa xấp xỉ 0, thì W bằng 1 phần 100 giây, tức 10 mi li giây. Đó đúng bằng thời gian phục vụ một yêu cầu, vì không ai phải chờ."
      - show: |
          <p><b>Bước 2</b> — $\mu = 100$, $\lambda = 80$, phần công suất còn trống $100 - 80 = 20$:</p>
          $$W = \frac{1}{20} = 0{,}05\ \text{giây} = \hl{50}\ \text{ms}$$
          <p>Gấp 5 lần thời gian phục vụ 10 ms: phần thêm là thời gian đứng chờ.</p>
        focus: [1, 1, 2, 3]
        say: "Bước hai, xét tải 80. Phần công suất còn trống là 100 trừ 80, bằng 20. Muy bằng 100, lam-đa bằng 80 thì W bằng 1 phần 20 giây, tức 50 mi li giây. Con số này gấp 5 lần thời gian phục vụ 10 mi li giây, vì phần thêm là thời gian đứng chờ."
      - clear: true
        show: |
          <p><b>Bước 3</b> — định luật Little đếm số yêu cầu trong hệ:</p>
          $$L = \lambda \cdot W = 80 \cdot 0{,}05 = \hl{4}$$
          <p>Trung bình lúc nào cũng có 4 yêu cầu đang chờ hoặc đang được phục vụ.</p>
        focus: [1, 2, 3]
        say: "Bước ba, dùng định luật Little để đếm số yêu cầu trong hệ. Theo Little, số yêu cầu trong hệ là 80 nhân 0 phẩy 05, bằng 4. Nghĩa là trung bình lúc nào cũng có 4 yêu cầu đang chờ hoặc đang được phục vụ."
      - clear: true
        show: |
          <table class="t"><tr><th>tải $\lambda$</th><th>phần trống $\mu - \lambda$</th><th>$W$</th><th>$L = \lambda \cdot W$</th></tr>
          <tr><td>50</td><td>50</td><td>20 ms</td><td>1</td></tr>
          <tr><td>80</td><td>20</td><td>50 ms</td><td>4</td></tr>
          <tr><td>95</td><td>5</td><td>$\hl{200}$ ms</td><td>19</td></tr></table>
          <p><b>Bước 4</b> — phần trống giảm 50 → 20 → 5, độ trễ tăng 20 → 50 → 200 ms.</p>
        focus: [0, "1.4", 2]
        say: "Bước bốn, lặp lại cho tải 95 rồi đặt cạnh các mức tải khác. Lam-đa bằng 95 thì W bằng 1 phần 5 giây, tức 200 mi li giây, và có 19 yêu cầu trong hệ. Từ tải 50 lên 80 rồi 95, phần trống giảm từ 50 xuống 20 rồi xuống 5, còn độ trễ tăng từ 20 lên 50 rồi vọt lên 200 mi li giây."
      - clear: true
        show: |
          <div>{{LC}}</div>
          <div class="box key">Mẫu số $\mu - \lambda$ là <b>phần công suất còn trống</b>. Trống còn 20 → 50 ms; còn 5 → 200 ms; tiến tới 0 → độ trễ tiến tới vô cùng.</div>
        focus: [1, 1, 2, 2]
        say: "Bước năm, vẽ cả đường cong độ trễ theo tải, với công suất 100 yêu cầu mỗi giây. Đường cong gần như phẳng khi tải thấp, rồi dựng đứng khi tải tiến sát công suất. Mẫu số muy trừ lam-đa chính là phần công suất còn trống. Còn trống 20 thì 50 mi li giây, còn trống 5 thì 200 mi li giây, và tiến tới 0 thì độ trễ tiến tới vô cùng."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(19 / 95, 2) == 0.2 and round(0.8 / (100 - 80) * 1000) == 40 and round(0.8 / (100 - 80) * 1000) + 1000 // 100 == 50"
      - "(lambda R, n: round(__import__('functools').reduce(lambda s, a: (max(a[0], s[0]) + a[1], s[1] + max(a[0], s[0]) + a[1] - a[0]), zip(__import__('itertools').accumulate(R.expovariate(80) for _ in range(n)), (R.expovariate(100) for _ in range(n))), (0.0, 0.0))[1] / n * 1000, 1))(__import__('random').Random(7), 200000) == 49.6"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>đảo Little ở tải 95</td><td>$W = \frac{L}{\lambda} = \frac{19}{95}$ giây</td><td>200 ms ✓</td></tr>
          <tr><td>tách chờ và phục vụ ở tải 80</td><td>chờ $\frac{\rho}{\mu - \lambda} = \frac{0{,}8}{20}$ giây = 40 ms, cộng 10 ms phục vụ</td><td>50 ms ✓</td></tr>
          <tr><td>máy mô phỏng 200 000 yêu cầu ngẫu nhiên ở tải 80</td><td>đo thời gian từng yêu cầu ở trong hệ, lấy trung bình</td><td>≈ 49,6 ms ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Kiểm bằng ba đường khác, vì mỗi đường dựa vào một điều khác nhau. Đảo định luật Little ở tải 95, W bằng 19 chia 95 giây, đúng 200 mi li giây. Ở tải 80, ta tách thời gian thành hai phần. Thời gian chờ bằng rô chia muy trừ lam-đa, tức 0 phẩy 8 chia 20 giây, bằng 40 mi li giây, cộng 10 mi li giây phục vụ là 50. Cuối cùng, cho máy mô phỏng 200 nghìn yêu cầu đến và phục vụ ngẫu nhiên ở tải 80. Trung bình đo được khoảng 49 phẩy 6 mi li giây, rất sát 50."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "180 / 3 == 60 and 180 / 2 == 90 and alg.mm1(60, 100)[0] == 0.025 and alg.mm1(90, 100)[0] == 0.1 and alg.mm1(180, 100)[0] == float('inf') and round(alg.mm1(90, 100)[0] / alg.mm1(60, 100)[0]) == 4"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chạy máy ở 95% “cho tiết kiệm” <b class="red">(độ trễ bùng nổ)</b>
          <br><span class="note">Từ 80% lên 95% công suất, độ trễ trung bình tăng gấp 4. Đặt mục tiêu tải có dư địa (thường 60–70%) cho dịch vụ cần phản hồi nhanh.</span></div>
        say: "Lỗi thứ nhất, chạy máy ở 95 phần trăm công suất cho tiết kiệm. Từ 80 lên 95 phần trăm, độ trễ trung bình tăng gấp 4. Hãy đặt mục tiêu tải có dư địa, thường 60 đến 70 phần trăm, cho dịch vụ cần phản hồi nhanh."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ước lượng dung lượng bằng trung bình cả ngày <b class="red">(bỏ qua đỉnh)</b>
          <br><span class="note">Trung bình 50 yêu cầu/s nhưng giờ cao điểm 120/s với máy 100/s: trong giờ đó $\lambda \gt \mu$, hàng đợi dài mãi. Ước lượng theo <b>đỉnh</b>.</span></div>
        say: "Lỗi thứ hai, ước lượng dung lượng bằng trung bình cả ngày. Trung bình 50 yêu cầu mỗi giây nhưng giờ cao điểm lên 120, với máy 100 mỗi giây, thì trong giờ đó lam-đa lớn hơn muy và hàng đợi dài mãi. Hãy ước lượng theo đỉnh."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Áp công thức một máy cho mọi hệ <b class="red">(quá tin mô hình)</b>
          <br><span class="note">$W = \frac{1}{\mu - \lambda}$ đúng với giả thiết đến và phục vụ ngẫu nhiên kiểu mũ. Hệ thật lệch giả thiết; nhưng hình dạng “dựng đứng gần công suất” thì hệ nào cũng có. Định luật Little thì luôn đúng.</span></div>
        say: "Lỗi thứ ba, áp công thức một máy cho mọi hệ. Công thức này đúng với giả thiết đến và phục vụ ngẫu nhiên kiểu mũ, hệ thật thì lệch giả thiết. Nhưng hình dạng dựng đứng gần công suất thì hệ nào cũng có, và định luật Little thì luôn đúng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Thấy máy chạy 60% liền cắt bớt máy “vì còn dư 40%” <b class="red">(độ trễ gấp 4)</b></div>
          <table class="t"><tr><th>tổng tải 180 yêu cầu/s, mỗi máy 100/s</th><th>tải mỗi máy</th><th>độ trễ trung bình</th></tr>
          <tr><td>3 máy</td><td>60/s</td><td>$\frac{1}{100 - 60}$ giây = 25 ms</td></tr>
          <tr><td>bớt còn 2 máy</td><td>90/s</td><td>$\frac{1}{100 - 90}$ giây = 100 ms</td></tr>
          <tr><td>bớt còn 1 máy</td><td>180/s, vượt công suất</td><td>hàng đợi dài mãi</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, thấy máy chỉ chạy 60 phần trăm liền cắt bớt máy, vì nghĩ còn dư 40 phần trăm. Tổng tải 180 yêu cầu mỗi giây chia đều cho 3 máy thì mỗi máy 60, độ trễ 25 mi li giây. Bớt còn 2 máy thì mỗi máy 90, độ trễ 100 mi li giây, gấp 4 lần, dù số máy chỉ giảm một phần ba. Bớt còn 1 máy thì tải vượt công suất, hàng đợi dài mãi. Người làm nghề tính lại độ trễ theo công thức hoặc thử tải trước khi cắt máy, chứ không nhìn phần trăm còn dư."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.mm1(180, 200)[0] * 1000) == 50 and round(alg.mm1(190, 200)[0] * 1000) == 100 and alg.mm1(60, 100)[1] == 1.5"
      - "200 - 180 == 20 and 200 - 190 == 10 and round((190 - 180) / 180 * 100, 1) == 5.6 and round(30 / 600 * 1000) == 50"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Máy phục vụ 200 yêu cầu/s. Tải 180/s và 190/s: độ trễ trung bình mỗi trường hợp?</td></tr>
          <tr><td>2</td><td>Một hệ có trung bình 30 yêu cầu đang xử lý, tốc độ đến 600 yêu cầu/s. Mỗi yêu cầu ở trong hệ bao lâu?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, máy phục vụ 200 yêu cầu mỗi giây, tải 180 và tải 190, độ trễ trung bình mỗi trường hợp là bao nhiêu? Câu hai, một hệ có trung bình 30 yêu cầu đang xử lý, tốc độ đến 600 yêu cầu mỗi giây. Mỗi yêu cầu ở trong hệ bao lâu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>tải</th><th>phần trống</th><th>$W$</th></tr>
          <tr><td>180/s</td><td>$200 - 180 = 20$</td><td>$\frac{1}{20}$ giây = $\hl{50}$ ms</td></tr>
          <tr><td>190/s</td><td>$200 - 190 = 10$</td><td>$\frac{1}{10}$ giây = $\hl{100}$ ms</td></tr></table>
          <p>① Tải chỉ tăng khoảng 5,6% mà độ trễ gấp đôi, vì phần trống giảm một nửa.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Đáp án câu một, ta tính phần trống trước. Tải 180 thì phần trống là 20, nên 1 chia 20 giây bằng 50 mi li giây. Tải 190 thì phần trống là 10, nên 1 chia 10 giây bằng 100 mi li giây. Tải chỉ tăng khoảng 5 phẩy 6 phần trăm mà độ trễ gấp đôi, vì phần trống giảm một nửa."
      - show: |
          <p>② Little: $L = \lambda \cdot W$, đảo lại $W = \frac{L}{\lambda} = \frac{30}{600}$ giây = $\hl{50}$ ms — không cần biết phân phối.</p>
        focus: [1, 1, 1]
        say: "Câu hai, theo Little, W bằng 30 chia 600 giây, tức 50 mi li giây, không cần biết phân phối. Ta đảo định luật Little, lấy 30 yêu cầu trong hệ chia cho tốc độ đến 600 mỗi giây. Cách này luôn dùng được, vì định luật Little đúng cho mọi hệ ổn định."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$L = \lambda W$ luôn đúng</span><span class="a">→</span>
          <span class="n">một máy: $W = \frac{1}{\mu - \lambda}$</span><span class="a">→</span>
          <span class="n">gần công suất: dựng đứng</span><span class="a">→</span>
          <span class="n">ước lượng theo đỉnh, chừa dư địa</span></div>
        say: "Tổng kết lại, định luật Little luôn đúng. Với hàng đợi một máy, độ trễ bằng 1 chia phần công suất còn trống, nên dựng đứng khi gần công suất. Hãy ước lượng theo đỉnh và chừa dư địa."
      - show: |
          <div class="box key"><b>Tư duy:</b> công suất còn trống không phải lãng phí — nó là thứ giữ độ trễ thấp.</div>
        say: "Điều cần mang theo, công suất còn trống không phải lãng phí, nó chính là thứ giữ độ trễ thấp."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>quan sát được</b> — nhật ký, chỉ số, vết truy vết, phân vị.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta học về khả năng quan sát được, với nhật ký, chỉ số, vết truy vết, và phân vị. Hẹn gặp bạn ở bài tiếp theo."
