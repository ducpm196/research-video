scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cụm còn 30% CPU trống mà không xếp được Pod mới"
    steps:
      - show: |
          <p>Bảng theo dõi báo cụm còn 30% CPU trống. Vậy mà Pod mới cứ nằm chờ “không đủ tài nguyên”. Phần trống bị chia vụn trên nhiều nút, không nút nào đủ một Pod.</p>
          <div class="box key">Hôm nay: <b>xếp lịch Pod</b> — yêu cầu, giới hạn, và bài toán <b>xếp thùng</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, bảng theo dõi báo cụm còn 30 phần trăm CPU trống. Vậy mà Pod mới cứ nằm chờ vì không đủ tài nguyên. Phần trống bị chia vụn trên nhiều nút, và không nút nào đủ chỗ cho một Pod. Hôm nay ta học xếp lịch Pod, với yêu cầu, giới hạn, và bài toán xếp thùng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: phần nguyên, phép chia có dư, xếp tham lam, bộ xếp lịch"
    checks:
      - "math.floor(8 / 3) == 2 and 8 - 2 * 3 == 2 and math.floor(4 / 1.5) == 2"
      - "alg.first_fit([3, 3], [1, 1, 2, 2]) == ([0, 0, 1, None], [1.0, 1.0]) and alg.first_fit([3, 3], [2, 2, 1, 1]) == ([0, 1, 0, 1], [0.0, 0.0])"
    steps:
      - show: |
          <table class="t"><tr><th>phép</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td>$\lfloor x \rfloor$</td><td>phần nguyên: bỏ phần lẻ, làm tròn xuống</td><td>$\lfloor 8 : 3 \rfloor = \lfloor 2{,}67 \rfloor = 2$</td></tr>
          <tr><td>chia có dư</td><td>số bị chia = thương nhân số chia + dư</td><td>$8 = 2 \cdot 3 + 2$: vừa 2 hộp, dư 2</td></tr></table>
          <p><b>Bộ xếp lịch</b> (bài 5 của khoá này): khi bộ điều khiển tạo một Pod mới, bộ xếp lịch chọn <b>nút</b>, tức máy, sẽ chạy nó.</p>
        introduces: [floor]
        focus: ["1.2", "1.3", 2]
        say: "Bài này dùng phần nguyên, tức bỏ phần lẻ và làm tròn xuống, ví dụ 8 chia 3 bằng 2 phẩy 67, phần nguyên là 2. Chia có dư nói cùng điều đó, 8 bằng 2 nhân 3 cộng 2, nên vừa 2 hộp cỡ 3 và còn dư 2. Ở bài 5 của khoá này, khi bộ điều khiển thấy thiếu và tạo một Pod mới, bộ xếp lịch là phần chọn nút, tức chọn máy sẽ chạy Pod đó."
      - show: |
          <p><b>Xếp tham lam</b>: mỗi món vào <b>chỗ đầu tiên còn vừa</b>, không quay lại sửa. Nhanh, nhưng thứ tự ảnh hưởng kết quả.</p>
          <table class="t"><tr><th>hai thùng cỡ 3, thứ tự xếp</th><th>kết quả</th></tr>
          <tr><td>1, 1, 2, 2</td><td>thùng một: 1 + 1, thùng hai: 2 → món 2 cuối <b>không vừa</b></td></tr>
          <tr><td>2, 2, 1, 1 (lớn trước)</td><td>mỗi thùng 2 + 1 = 3 → vừa hết</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Trước hết, ta cần hiểu cách xếp tham lam, tức đặt mỗi món vào chỗ đầu tiên còn vừa, không quay lại sửa. Cách này nhanh, nhưng thứ tự xếp ảnh hưởng kết quả. Hai thùng cỡ 3, xếp theo thứ tự 1, 1, 2, 2 thì thùng một nhận hai món 1, thùng hai nhận món 2, và món 2 cuối không vừa đâu cả. Xếp món lớn trước, theo thứ tự 2, 2, 1, 1, thì mỗi thùng nhận 2 cộng 1 bằng 3, vừa hết."

  - id: sym
    kind: symbol
    title: "Giải mã: yêu cầu và giới hạn"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>yêu cầu (request)</th><th>giới hạn (limit)</th></tr>
          <tr><td>ai dùng</td><td><b>bộ xếp lịch</b>: chỉ đặt Pod lên nút còn đủ tổng yêu cầu</td><td><b>nhân hệ điều hành</b> lúc chạy</td></tr>
          <tr><td>vượt CPU</td><td>—</td><td>bị <b>hãm</b>: chạy chậm lại, không chết</td></tr>
          <tr><td>vượt bộ nhớ</td><td>—</td><td>bị <b>giết</b> vì hết bộ nhớ, rồi khởi động lại</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng so yêu cầu và giới hạn tài nguyên. Yêu cầu được bộ xếp lịch dùng, nó chỉ đặt Pod lên nút còn đủ tổng yêu cầu, còn giới hạn được nhân hệ điều hành áp lúc chạy. Vượt giới hạn CPU thì tiến trình bị hãm, chạy chậm lại nhưng không chết. Vượt giới hạn bộ nhớ thì tiến trình bị giết vì hết bộ nhớ, rồi khởi động lại."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Trống nhiều mà vẫn không xếp được"
    checks:
      - "alg.first_fit([4, 4, 4], [1.5] * 6 + [1.5]) == ([0, 0, 1, 1, 2, 2, None], [1.0, 1.0, 1.0]) and 3 / 12 == 0.25"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><g font-size="24" fill="#1f2937"><text x="350" y="40" text-anchor="middle" font-weight="bold">ba nút, mỗi nút 4 CPU</text><text x="40" y="105">nút 1</text><rect x="150" y="60" width="400" height="70" rx="6" fill="none" stroke="#1f2937" stroke-width="2.5"/><rect x="153" y="63" width="146" height="64" rx="4" fill="#2a78d6"/><text x="225" y="105" text-anchor="middle" fill="#ffffff">1,5</text><rect x="303" y="63" width="146" height="64" rx="4" fill="#2a78d6"/><text x="375" y="105" text-anchor="middle" fill="#ffffff">1,5</text><rect x="453" y="63" width="94" height="64" rx="4" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="8 6"/><text x="500" y="105" text-anchor="middle" fill="#eb6834">trống 1</text><text x="40" y="200">nút 2</text><rect x="150" y="155" width="400" height="70" rx="6" fill="none" stroke="#1f2937" stroke-width="2.5"/><rect x="153" y="158" width="146" height="64" rx="4" fill="#2a78d6"/><text x="225" y="200" text-anchor="middle" fill="#ffffff">1,5</text><rect x="303" y="158" width="146" height="64" rx="4" fill="#2a78d6"/><text x="375" y="200" text-anchor="middle" fill="#ffffff">1,5</text><rect x="453" y="158" width="94" height="64" rx="4" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="8 6"/><text x="500" y="200" text-anchor="middle" fill="#eb6834">trống 1</text><text x="40" y="295">nút 3</text><rect x="150" y="250" width="400" height="70" rx="6" fill="none" stroke="#1f2937" stroke-width="2.5"/><rect x="153" y="253" width="146" height="64" rx="4" fill="#2a78d6"/><text x="225" y="295" text-anchor="middle" fill="#ffffff">1,5</text><rect x="303" y="253" width="146" height="64" rx="4" fill="#2a78d6"/><text x="375" y="295" text-anchor="middle" fill="#ffffff">1,5</text><rect x="453" y="253" width="94" height="64" rx="4" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="8 6"/><text x="500" y="295" text-anchor="middle" fill="#eb6834">trống 1</text><text x="1050" y="40" text-anchor="middle" font-weight="bold">Pod mới cần 1,5 CPU</text><rect x="975" y="80" width="150" height="70" rx="6" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1050" y="125" text-anchor="middle">1,5</text><line x1="960" y1="115" x2="600" y2="115" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="1050" y="200" text-anchor="middle" fill="#b91c1c" font-weight="bold">không vừa nút nào</text><text x="1050" y="250" text-anchor="middle">tổng trống: 1 + 1 + 1 = 3 CPU</text><text x="1050" y="290" text-anchor="middle">tức 3 trên 12, bằng 25% cụm</text><text x="750" y="385" text-anchor="middle" fill="#059669">phải có MỘT nút còn đủ 1,5 CPU, tổng trống của cụm không giúp được</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ đúng chuyện ở đầu bài, thu nhỏ lại còn ba nút, mỗi nút 4 CPU. Mỗi nút đã chạy hai Pod 1 phẩy 5 CPU, nên nút nào cũng chỉ trống 1 CPU. Cộng lại, cụm trống 3 trên 12 CPU, tức 25 phần trăm, nghe có vẻ thoải mái. Nhưng Pod mới cần 1 phẩy 5 CPU trên một nút, nên không vừa nút nào cả, vì bộ xếp lịch phải tìm một nút còn đủ chỗ chứ không gom phần trống của nhiều nút."

  - id: example
    kind: example
    title: "Nút 4 CPU, Pod yêu cầu 1,5 CPU"
    checks:
      - "alg.pods_fit(4, 1.5) == (2, 1.0)"
      - "round(4 / 1.5, 2) == 2.67 and 2 * 1.5 == 3 and 4 - 3 == 1 and alg.first_fit([4], [1.5, 1.5, 1]) == ([0, 0, 0], [0.0])"
      - "alg.pods_fit(4, 1) == (4, 0.0) and alg.pods_fit(8, 3) == (2, 2.0) and min(4, 2) == 2"
    steps:
      - show: |
          <div>{{BP}}</div>
          <p><b>Bước 1</b> — số Pod vừa: $\lfloor 4 : 1{,}5 \rfloor = \lfloor 2{,}67 \rfloor = \hl{2}$.</p>
        focus: [0, 1, 2]
        say: "Bước một, đọc hình. Hình vẽ một nút có 4 CPU, mỗi Pod yêu cầu 1 phẩy 5 CPU. Số Pod vừa là phần nguyên của 4 chia 1 phẩy 5, bằng 2."
      - show: |
          <table class="t"><tr><th>đặt thêm</th><th>CPU đã giữ</th><th>còn trống</th></tr>
          <tr><td>Pod 1</td><td>1,5</td><td>2,5</td></tr>
          <tr><td>Pod 2</td><td>$2 \cdot 1{,}5 = 3$</td><td>$4 - 3 = 1$</td></tr>
          <tr><td>Pod 3 (cần 1,5)</td><td>—</td><td><b>không vừa</b>: còn 1, nhỏ hơn 1,5</td></tr></table>
        focus: [0, "1.3", "1.4"]
        say: "Bước hai, đặt từng Pod để thấy phần thừa. Hai Pod dùng 3 CPU, thừa 1 CPU, không đủ cho Pod thứ ba. Vì Pod thứ ba cần 1 phẩy 5 mà nút chỉ còn 1, nên một phần tư nút bị bỏ không."
      - clear: true
        show: |
          <table class="t"><tr><th>cùng nút 4 CPU</th><th>đã giữ</th><th>còn trống</th></tr>
          <tr><td>chỉ Pod lớn 1,5</td><td>3</td><td>1</td></tr>
          <tr><td>thêm một Pod nhỏ 1 CPU</td><td>$3 + 1 = 4$</td><td>$\hl{0}$</td></tr></table>
          <div class="box key"><b>Bước 3</b> — tổng CPU trống của cụm không nói được gì: phải có <b>một nút</b> đủ chỗ. Trộn Pod lớn và nhỏ giúp lấp chỗ thừa.</div>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước ba, lấp chỗ thừa. Chỉ có Pod lớn thì nút còn trống 1. Thêm một Pod nhỏ 1 CPU thì nút giữ đủ 4, không còn trống. Tổng CPU trống của cụm không nói được gì, phải có một nút đủ chỗ, và trộn Pod lớn với Pod nhỏ giúp lấp chỗ thừa."
      - show: |
          <table class="t"><tr><th>nút 4 CPU, 8 GB; Pod yêu cầu 1 CPU, 3 GB</th><th>số Pod vừa</th></tr>
          <tr><td>chỉ xét CPU</td><td>$\lfloor 4 : 1 \rfloor = 4$</td></tr>
          <tr><td>chỉ xét bộ nhớ</td><td>$\lfloor 8 : 3 \rfloor = 2$, dư 2 GB</td></tr>
          <tr><td>phải vừa <b>cả hai</b></td><td>số nhỏ hơn: $\hl{2}$</td></tr></table>
          <p><b>Bước 4</b> — mỗi loại tài nguyên là một thùng riêng; loại hết trước quyết định.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước bốn, thật ra mỗi Pod yêu cầu nhiều loại tài nguyên cùng lúc. Nút có 4 CPU và 8 GB bộ nhớ, Pod yêu cầu 1 CPU và 3 GB. Chỉ xét CPU thì vừa 4 Pod, chỉ xét bộ nhớ thì phần nguyên của 8 chia 3 là 2, dư 2 GB. Pod phải vừa cả hai, nên chỉ đặt được 2, là số nhỏ hơn. Mỗi loại tài nguyên là một thùng riêng, và loại hết trước sẽ quyết định."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "(lambda f: f(f, 40, 15))(lambda g, r, p: (0, r) if r < p else (lambda k, d: (k + 1, d))(*g(g, r - p, p))) == (2, 10)"
      - "40 // 15 == 2 and 40 % 15 == 10 and 80 // 30 == 2 and 80 % 30 == 20"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>2 Pod, thừa 1 CPU</td><td>trừ dần: $4 - 1{,}5 = 2{,}5$; $2{,}5 - 1{,}5 = 1$; còn 1 nhỏ hơn 1,5 thì dừng</td><td>trừ được 2 lần, còn 1 ✓</td></tr>
          <tr><td>tránh sai số số lẻ</td><td>đổi ra phần mười CPU: 40 chia 15</td><td>thương 2, dư 10 phần mười = 1 CPU ✓</td></tr>
          <tr><td>bộ nhớ: 2 Pod</td><td>đổi ra phần mười GB: 80 chia 30</td><td>thương 2, dư 20 = 2 GB ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, vì máy tính hay sai ở số lẻ như 1 phẩy 5. Trừ dần, 4 trừ 1 phẩy 5 còn 2 phẩy 5, trừ tiếp còn 1, nhỏ hơn 1 phẩy 5 thì dừng, nên trừ được 2 lần và còn 1. Đổi ra phần mười CPU để chỉ dùng số nguyên, 40 chia 15 được thương 2, dư 10 phần mười, tức 1 CPU. Bộ nhớ cũng vậy, 80 chia 30 được thương 2, dư 20 phần mười, tức 2 GB."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "alg.first_fit([4, 4, 4], [1, 1, 1]) == ([0, 0, 0], [1.0, 4.0, 4.0]) and 3 / 3 == 1.0 and round(1 / 3 * 100) == 33"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Không đặt yêu cầu <b class="red">(xếp mù)</b>
          <br><span class="note">Không có cả yêu cầu lẫn giới hạn (có giới hạn mà thiếu yêu cầu thì yêu cầu lấy bằng giới hạn): bộ xếp lịch coi Pod cần 0 tài nguyên, nhồi quá nhiều Pod vào một nút; lúc tải lên, tất cả cùng chậm hoặc bị giết.</span></div>
        say: "Lỗi thứ nhất, không đặt yêu cầu tài nguyên. Nếu không có cả yêu cầu lẫn giới hạn, bộ xếp lịch coi Pod cần 0 tài nguyên và nhồi quá nhiều Pod vào một nút. Còn nếu có giới hạn mà thiếu yêu cầu, thì yêu cầu được lấy bằng giới hạn. Lúc tải tăng, tất cả cùng chậm hoặc bị giết."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đặt yêu cầu quá cao “cho chắc” <b class="red">(lãng phí)</b>
          <br><span class="note">Pod thật dùng 0,2 CPU nhưng yêu cầu 2: chỗ giữ trống, nút “đầy” mà máy rảnh. Đặt yêu cầu theo mức dùng đo được, ví dụ phân vị 90 (mức mà 90% số lần đo Pod dùng không vượt quá), giới hạn cao hơn một chút.</span></div>
        say: "Lỗi thứ hai, đặt yêu cầu quá cao cho chắc. Pod thật dùng 0 phẩy 2 CPU mà yêu cầu 2, nên chỗ giữ trống, nút báo đầy mà máy vẫn rảnh. Hãy đặt yêu cầu theo mức dùng đo được, chẳng hạn phân vị 90, tức mức mà 90 phần trăm số lần đo Pod dùng không vượt quá, và giới hạn cao hơn một chút."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lẫn hậu quả của hai loại giới hạn <b class="red">(chẩn đoán sai)</b>
          <br><span class="note">Pod khởi động lại liên tục: thường là vượt <b>bộ nhớ</b>. Pod chậm bất thường mà không chết: thường là bị <b>hãm CPU</b>. Hai triệu chứng, hai cách sửa.</span></div>
        say: "Lỗi thứ ba, lẫn hậu quả của hai loại giới hạn. Pod khởi động lại liên tục thường là vượt giới hạn bộ nhớ. Pod chậm bất thường mà không chết thường là bị hãm CPU, hai triệu chứng khác nhau cần hai cách sửa khác nhau."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Xếp thật chặt “cho tiết kiệm máy”, dồn mọi bản của một dịch vụ lên cùng một nút <b class="red">(một nút chết là mất hết)</b></div>
          <table class="t"><tr><th>3 bản, mỗi bản 1 CPU, ba nút 4 CPU</th><th>một nút chết thì mất</th></tr>
          <tr><td>xếp tham lam: cả 3 bản vào nút đầu tiên</td><td>3 trên 3 bản = 100%</td></tr>
          <tr><td>trải mỗi nút một bản</td><td>1 trên 3 bản, khoảng 33%</td></tr></table>
          <p class="note">Bộ xếp lịch thật của Kubernetes lọc các nút còn đủ chỗ rồi <b>chấm điểm</b> để chọn; mặc định nó ưu tiên nút còn trống nhiều, nhưng khi cấu hình chấm điểm kiểu “xếp chặt” thì có thể dồn như hàng đầu.</p>
        focus: [1, "2.2", "2.3", 3, 3, 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, xếp thật chặt cho tiết kiệm máy, dồn mọi bản của một dịch vụ lên cùng một nút. Ba bản, mỗi bản 1 CPU, xếp tham lam thì cả 3 cùng vào nút đầu tiên, và nút đó chết là mất cả 3 bản. Trải ra mỗi nút một bản thì một nút chết chỉ mất 1 trên 3, khoảng 33 phần trăm. Bộ xếp lịch thật của Kubernetes lọc các nút còn đủ chỗ rồi chấm điểm để chọn, mặc định ưu tiên nút còn trống nhiều. Nhưng khi cấu hình chấm điểm kiểu xếp chặt, nó có thể dồn như hàng đầu. Người làm nghề khai báo thêm quy tắc trải các bản ra nhiều nút, vì xếp chặt tiết kiệm máy nhưng không được đổi lấy việc mất cả dịch vụ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.pods_fit(8, 2.5) == (3, 0.5)"
      - "alg.first_fit([4, 4], [1.5, 1.5, 1.5, 1.5, 1]) == ([0, 0, 1, 1, 0], [0.0, 1.0])"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nút 8 CPU, Pod yêu cầu 2,5 CPU: vừa mấy Pod, thừa bao nhiêu?</td></tr>
          <tr><td>2</td><td>Hai nút 4 CPU. Xếp lần lượt 4 Pod 1,5 CPU rồi 1 Pod 1 CPU, mỗi Pod vào nút đầu tiên còn đủ chỗ. Pod 1 CPU vào nút nào? Còn thừa bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, nút 8 CPU, Pod yêu cầu 2 phẩy 5 CPU, vừa mấy Pod và thừa bao nhiêu? Câu hai, có hai nút 4 CPU. Xếp lần lượt 4 Pod 1 phẩy 5 CPU rồi 1 Pod 1 CPU, mỗi Pod vào nút đầu tiên còn đủ chỗ. Pod 1 CPU vào nút nào, và còn thừa bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $8 : 2{,}5 = 3{,}2$, nên $\lfloor 8 : 2{,}5 \rfloor = \hl{3}$ Pod; đã giữ $3 \cdot 2{,}5 = 7{,}5$, thừa $8 - 7{,}5 = 0{,}5$ CPU.</p>
        focus: [1, 1]
        say: "Đáp án câu một, phần nguyên của 8 chia 2 phẩy 5 bằng 3 Pod, thừa 0 phẩy 5 CPU. Lý do là 8 chia 2 phẩy 5 bằng 3 phẩy 2, ba Pod giữ 7 phẩy 5 CPU, nên còn 8 trừ 7 phẩy 5 bằng 0 phẩy 5."
      - show: |
          <table class="t"><tr><th>Pod</th><th>nút một còn</th><th>nút hai còn</th><th>vào</th></tr>
          <tr><td>1 (1,5)</td><td>2,5</td><td>4</td><td>nút một</td></tr>
          <tr><td>2 (1,5)</td><td>1</td><td>4</td><td>nút một</td></tr>
          <tr><td>3 (1,5)</td><td>1</td><td>2,5</td><td>nút hai: nút một chỉ còn 1</td></tr>
          <tr><td>4 (1,5)</td><td>1</td><td>1</td><td>nút hai</td></tr>
          <tr><td>5 (1 CPU)</td><td>$\hl{0}$</td><td>$\hl{1}$</td><td><b>nút một</b>: nút đầu tiên còn đủ 1</td></tr></table>
        focus: [0, "1.2", "1.4", "1.6"]
        say: "Câu hai, ta lập bảng đặt từng Pod vào các nút theo đúng thứ tự. Câu hai, nút một nhận 2 Pod lớn và còn 1, nút hai nhận 2 Pod lớn và còn 1. Pod thứ ba vào nút hai vì nút một chỉ còn 1, không đủ 1 phẩy 5. Pod 1 CPU vào nút một, nên nút một còn 0 và nút hai còn 1."

