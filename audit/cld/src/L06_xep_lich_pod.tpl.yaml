id: L06
course: CLD
series: "CLD · Hệ thống hướng dịch vụ"
title: "Bài 6 — Xếp lịch Pod: yêu cầu, giới hạn tài nguyên và xếp thùng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cld.yaml L06; audit/cld/verify_cld.py L06; Kubernetes Docs, Resource Management for Pods and Containers (kubernetes.io, đọc 2026-10-28); Kubernetes Docs, Kubernetes Scheduler (chọn nút qua hai bước: lọc, chấm điểm), Resource Bin Packing (MostAllocated ưu tiên nút đã dùng nhiều) và Scheduling Framework config (NodeResourcesFit: “LeastAllocated (default)”) (kubernetes.io, truy cập 2026-11-09, no revision given); E. G. Coffman Jr., M. R. Garey, D. S. Johnson, Approximation Algorithms for Bin Packing: A Survey (1996); CS112 (thuật toán tham lam)"
assumes: [arith, cdot, floor]
# Quy ước: “yêu cầu” (request) = phần tài nguyên bộ xếp lịch giữ chỗ cho Pod; “giới hạn” (limit) = mức tối đa nhân cho phép dùng. Bộ xếp lịch chỉ
#   nhìn YÊU CẦU. alg.pods_fit tính bằng phân số; alg.first_fit xếp tham lam theo thứ tự. Hình: audit/cld/figs.py binpack. Tệp mẫu — sửa ở đây
#   rồi chạy audit/cld/fill_all.py.
objectives:
  - "Phân biệt yêu cầu và giới hạn tài nguyên"
  - "Ước lượng số Pod vừa một nút"
  - "Thấy xếp thùng để lại phần thừa"
