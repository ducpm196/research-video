- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">bộ xếp lịch nhìn yêu cầu</span><span class="a">→</span>

      <span class="n">nhân áp giới hạn: CPU hãm, bộ nhớ giết</span><span class="a">→</span>

      <span class="n">xếp thùng để lại phần thừa</span><span class="a">→</span>

      <span class="n">đặt yêu cầu theo số đo</span></div>

      '
    say: Tổng kết lại, bộ xếp lịch nhìn yêu cầu, còn nhân áp giới hạn, vượt CPU thì bị hãm, vượt bộ nhớ thì bị giết. Xếp thùng
      thường để lại phần thừa, nên hãy đặt yêu cầu theo số đo thật. Đặt chính xác mức yêu cầu theo đo đạc thật tối đa hoá
      công suất phần cứng mà vẫn giữ bình yên giữa các dịch vụ. Khai báo sát mức yêu cầu thường dùng kết hợp hạn mức trần
      hợp lý giúp xếp thùng tối ưu mà không tranh chấp tài nguyên.
  - show: '<div class="box key"><b>Tư duy:</b> “còn trống” chỉ có nghĩa khi phần trống nằm ở <b>đúng chỗ</b> và <b>đủ lớn</b>
      cho thứ cần đặt vào.</div>

      <p class="note"><b>So sánh hai quy mô:</b> trên 1 nút 4 CPU chỉ đặt được 2 Pod 1,5 CPU (dư 1 CPU mảnh không dùng được);
      trên cụm nhiều nút, xếp 5 Pod cần tối thiểu 3 nút — chừa chỗ trống phân mảnh và đặt yêu cầu theo số đo thật.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Điều cần mang theo, còn trống chỉ có nghĩa khi phần trống nằm ở đúng chỗ và đủ lớn cho thứ cần đặt vào. Xét hai mức
      quy mô, 1 nút 4 đơn vị chỉ đặt lọt 2 khối nên dư kẹt phần thừa. Trên cụm lớn phải tính trước phần phân mảnh và đặt đúng
      hạn mức theo số đo thực tế. Khi cấu trúc đặt gói đã cân bằng, bài tiếp sẽ bật cơ chế tự động co giãn số bản sao theo
      tải thật.
  - clear: true
    show: '<p class="note">Bài sau (bài 7): <b>tự co giãn</b> theo chỉ số.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 7, ta học cách tự co giãn theo chỉ số. Hẹn gặp bạn ở bài tiếp theo.
