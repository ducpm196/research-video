      2, ba Pod giữ 7 phẩy 5 CPU, nên còn 8 trừ 7 phẩy 5 bằng 0 phẩy 5. Tính số nút vật lý tối thiểu chứa gọn danh sách gói
      chạy theo mức yêu cầu và kiểm tra điều kiện trần bộ nhớ.
  - show: '<table class="t"><tr><th>Pod</th><th>nút một còn</th><th>nút hai còn</th><th>vào</th></tr>

