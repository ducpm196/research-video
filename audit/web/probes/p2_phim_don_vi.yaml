name: web_p2_phim_don_vi
# Vòng 2 cho WEB: tên phím và vài từ viết tắt hay gặp. Đọc BẢN CHÉP. Mọi key trong ngoặc kép.
ctx:
  - "Theo {}, ta xét bài toán này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "tab"
    variants: ["Tab", "táp", "tép"]
    negative: "tát"
    keys: ["tab", "tap", "tep"]
  - key: "enter"
    variants: ["Enter", "en-tơ", "en-thơ"]
    negative: "en-cơ"
    keys: ["enter", "ento", "entho", "en to"]
  - key: "url"
    variants: ["URL", "u rờ lờ", "diu a eo"]
    negative: "u rờ mờ"
    keys: ["url", "urolo", "diuaeo"]
  - key: "sha"
    variants: ["SHA", "sa", "ét hát a"]
    negative: "ét hát e"
    keys: ["sha", "ethata"]
  - key: "node"
    variants: ["Node", "nốt", "nâu"]
    negative: "nốc"
    keys: ["node", "not", "nau"]
