sources:
  L34_MayTrangThai:
    lang: python
    timeout: 120
    reason: 'MayTrangThai: chạy nguyên văn.'
    claims:
    - máy trạng thái chặn nhảy cóc và quay lui; 5 chuyển hợp lệ ghi nhật ký; trạng thái cuối GIAI_NGAN
    expect_stdout: 'KHOI_TAO -> GIAI_NGAN: tu choi

      KHOI_TAO -> THAM_DINH: an ghi nhan

      THAM_DINH -> CHAM_DIEM: binh ghi nhan

      CHAM_DIEM -> CHO_DUYET: he_thong ghi nhan

      CHO_DUYET -> DA_DUYET: chi ghi nhan

      DA_DUYET -> KHOI_TAO: tu choi

      DA_DUYET -> GIAI_NGAN: he_thong ghi nhan

      nhat ky: 5 dong; trang thai cuoi: GIAI_NGAN'
    code: "import sqlite3\n\ndb = sqlite3.connect(\":memory:\")\ndb.executescript(\"\"\"\nCREATE TABLE cho_phep (tu TEXT, den TEXT);\nCREATE TABLE ho_so (id INTEGER PRIMARY KEY, loai TEXT, tt TEXT);\nCREATE\
      \ TABLE lich_su (hs INTEGER, tu TEXT, den TEXT, nguoi TEXT);\n\"\"\")\nCANH = [(\"KHOI_TAO\", \"THAM_DINH\"), (\"THAM_DINH\", \"CHAM_DIEM\"),\n        (\"THAM_DINH\", \"TU_CHOI\"), (\"CHAM_DIEM\"\
      , \"CHO_DUYET\"),\n        (\"CHO_DUYET\", \"DA_DUYET\"), (\"CHO_DUYET\", \"TU_CHOI\"),\n        (\"DA_DUYET\", \"GIAI_NGAN\")]\ndb.executemany(\"INSERT INTO cho_phep VALUES (?, ?)\", CANH)\ndb.execute(\"\
      INSERT INTO ho_so VALUES (1, 'CN', 'KHOI_TAO')\")\n\n\ndef chuyen(hs, den, nguoi):\n    sql = \"SELECT tt FROM ho_so WHERE id = ?\"\n    tu = db.execute(sql, (hs,)).fetchone()[0]\n    sql = \"SELECT\
      \ 1 FROM cho_phep WHERE tu = ? AND den = ?\"\n    if not db.execute(sql, (tu, den)).fetchone():\n        print(f\"{tu} -> {den}: tu choi\")\n        return\n    db.execute(\"UPDATE ho_so SET tt =\
      \ ? WHERE id = ?\", (den, hs))\n    db.execute(\"INSERT INTO lich_su VALUES (?, ?, ?, ?)\",\n               (hs, tu, den, nguoi))\n    print(f\"{tu} -> {den}: {nguoi} ghi nhan\")\n\n\nchuyen(1, \"\
      GIAI_NGAN\", \"an\")\nchuyen(1, \"THAM_DINH\", \"an\")\nchuyen(1, \"CHAM_DIEM\", \"binh\")\nchuyen(1, \"CHO_DUYET\", \"he_thong\")\nchuyen(1, \"DA_DUYET\", \"chi\")\nchuyen(1, \"KHOI_TAO\", \"chi\"\
      )\nchuyen(1, \"GIAI_NGAN\", \"he_thong\")\nn = db.execute(\"SELECT COUNT(*) FROM lich_su\").fetchone()[0]\ntt = db.execute(\"SELECT tt FROM ho_so\").fetchone()[0]\nprint(\"nhat ky:\", n, \"dong; trang\
      \ thai cuoi:\", tt)"
  L34_PhanQuyen:
    lang: python
    timeout: 120
    reason: 'PhanQuyen: chạy nguyên văn.'
    claims:
    - quyền duyệt theo bậc và theo tổng dư nợ; ba hồ sơ 90 gộp thành 270 cần trưởng phòng; tự duyệt và thiếu quyền bị từ chối (số minh hoạ)
    expect_stdout: 'CN xin 80: tong 80 -> chuyen vien

      CN xin 300: tong 300 -> truong phong

      CN xin 900: tong 900 -> hoi dong

      DN xin 3000: tong 3000 -> giam doc khoi

      ho so 90: rieng le chuyen vien; theo tong 90 -> chuyen vien

      ho so 90: rieng le chuyen vien; theo tong 180 -> truong phong

      ho so 90: rieng le chuyen vien; theo tong 270 -> truong phong

      an tao, an duyet: tu choi (tu duyet)

      an tao, binh duyet (chuyen vien): tu choi (thieu quyen)

      an tao, chi duyet (truong phong): dong y'
    code: "BAC = {\"CN\": [(100, \"chuyen vien\"), (500, \"truong phong\"),\n              (None, \"hoi dong\")],\n       \"DN\": [(2000, \"truong phong\"), (10000, \"giam doc khoi\"),\n              (None,\
      \ \"hoi dong\")]}\nHANG = {\"chuyen vien\": 1, \"truong phong\": 2,\n        \"giam doc khoi\": 3, \"hoi dong\": 4}\n\n\ndef can_ai(loai, du_no, moi):\n    tong = du_no + moi\n    for tran, vai in\
      \ BAC[loai]:\n        if tran is None or tong <= tran:\n            return tong, vai\n\n\ndef duoc_duyet(tao, duyet, vai_duyet, can):\n    if tao == duyet:\n        return \"tu choi (tu duyet)\"\n\
      \    if HANG[vai_duyet] < HANG[can]:\n        return \"tu choi (thieu quyen)\"\n    return \"dong y\"\n\n\nfor loai, moi in [(\"CN\", 80), (\"CN\", 300), (\"CN\", 900), (\"DN\", 3000)]:\n    tong,\
      \ vai = can_ai(loai, 0, moi)\n    print(f\"{loai} xin {moi}: tong {tong} -> {vai}\")\ndu_no = 0\nfor moi in (90, 90, 90):\n    tong, vai = can_ai(\"CN\", du_no, moi)\n    rieng = can_ai(\"CN\", 0,\
      \ moi)[1]\n    print(f\"ho so {moi}: rieng le {rieng}; theo tong {tong} -> {vai}\")\n    du_no += moi\nprint(\"an tao, an duyet:\", duoc_duyet(\"an\", \"an\", \"truong phong\", \"truong phong\"))\n\
      print(\"an tao, binh duyet (chuyen vien):\", duoc_duyet(\"an\", \"binh\", \"chuyen vien\", \"truong phong\"))\nprint(\"an tao, chi duyet (truong phong):\", duoc_duyet(\"an\", \"chi\", \"truong phong\"\
      , \"truong phong\"))"
  L34_LichSuTinDung:
    lang: python
    timeout: 120
    reason: 'LichSuTinDung: chạy nguyên văn.'
    claims:
    - 'tra cứu lịch sử chỉ khi có đồng ý còn hạn, đúng mục đích, chưa thu hồi; nhật ký ghi cả lần từ chối: 1 cho phép, 4 từ chối (số minh hoạ)'
    expect_stdout: 'K1 tham dinh: cho phep, nhom cao nhat 2

      K2 tham dinh: tu choi, nhom cao nhat None

      K3 tham dinh: tu choi, nhom cao nhat None

      K4 tham dinh: tu choi, nhom cao nhat None

      K1 tiep thi: tu choi, nhom cao nhat None

      nhat ky cho phep: 1

      nhat ky tu choi: 4'
    code: "import sqlite3\n\ndb = sqlite3.connect(\":memory:\")\ndb.executescript(\"\"\"\nCREATE TABLE dong_y (khach TEXT, muc_dich TEXT,\n                     het_han TEXT, thu_hoi INT);\nCREATE TABLE\
      \ ls (khach TEXT, thang TEXT, nhom INT);\nCREATE TABLE nhat_ky (nguoi TEXT, khach TEXT, muc_dich TEXT,\n                      ngay TEXT, kq TEXT);\n\"\"\")\ndb.executemany(\"INSERT INTO dong_y VALUES\
      \ (?, ?, ?, ?)\", [\n    (\"K1\", \"tham dinh\", \"2026-12-31\", 0),\n    (\"K3\", \"tham dinh\", \"2026-01-31\", 0),\n    (\"K4\", \"tham dinh\", \"2026-12-31\", 1)])\ndb.executemany(\"INSERT INTO\
      \ ls VALUES (?, ?, ?)\", [\n    (\"K1\", \"2026-01\", 1), (\"K1\", \"2026-02\", 2), (\"K1\", \"2026-03\", 1),\n    (\"K2\", \"2026-02\", 5), (\"K3\", \"2026-02\", 3), (\"K4\", \"2026-03\", 4)])\n\n\
      \ndef tra_cuu(nguoi, khach, muc_dich, ngay):\n    sql = (\"SELECT 1 FROM dong_y WHERE khach = ? AND muc_dich = ? \"\n           \"AND het_han >= ? AND thu_hoi = 0\")\n    ok = db.execute(sql, (khach,\
      \ muc_dich, ngay)).fetchone()\n    kq = \"cho phep\" if ok else \"tu choi\"\n    db.execute(\"INSERT INTO nhat_ky VALUES (?, ?, ?, ?, ?)\",\n               (nguoi, khach, muc_dich, ngay, kq))\n  \
      \  if not ok:\n        return kq, None\n    sql = \"SELECT MAX(nhom) FROM ls WHERE khach = ?\"\n    return kq, db.execute(sql, (khach,)).fetchone()[0]\n\n\nCA = [(\"an\", \"K1\", \"tham dinh\", \"\
      2026-03-10\"),\n      (\"an\", \"K2\", \"tham dinh\", \"2026-03-10\"),\n      (\"an\", \"K3\", \"tham dinh\", \"2026-03-10\"),\n      (\"an\", \"K4\", \"tham dinh\", \"2026-03-10\"),\n      (\"an\"\
      , \"K1\", \"tiep thi\", \"2026-03-10\")]\nfor nguoi, khach, md, ngay in CA:\n    kq, nhom = tra_cuu(nguoi, khach, md, ngay)\n    print(f\"{khach} {md}: {kq}, nhom cao nhat {nhom}\")\nsql = \"SELECT\
      \ kq, COUNT(*) FROM nhat_ky GROUP BY kq ORDER BY kq\"\nfor kq, dem in db.execute(sql):\n    print(\"nhat ky\", kq + \":\", dem)"
  L34_KiemNhatKy:
    lang: python
    timeout: 120
    reason: 'KiemNhatKy: chạy nguyên văn.'
    claims:
    - 'nhật ký đúng: 0 cạnh sai, 0 chỗ đứt, dựng lại GIAI_NGAN; xoá một dòng thì 1 chỗ đứt'
    expect_stdout: 'canh sai trong nhat ky: 0

      cho dut: 0 ; trang thai dung lai: GIAI_NGAN

      xoa dong 3: 1 cho dut'
    code: "LOG = [(\"KHOI_TAO\", \"THAM_DINH\"), (\"THAM_DINH\", \"CHAM_DIEM\"),\n       (\"CHAM_DIEM\", \"CHO_DUYET\"), (\"CHO_DUYET\", \"DA_DUYET\"),\n       (\"DA_DUYET\", \"GIAI_NGAN\")]\nDUOC = {\"\
      KHOI_TAO\": {\"THAM_DINH\"},\n        \"THAM_DINH\": {\"CHAM_DIEM\", \"TU_CHOI\"},\n        \"CHAM_DIEM\": {\"CHO_DUYET\"},\n        \"CHO_DUYET\": {\"DA_DUYET\", \"TU_CHOI\"},\n        \"DA_DUYET\"\
      : {\"GIAI_NGAN\"}}\n\n\ndef canh_sai(log):\n    return sum(1 for tu, den in log if den not in DUOC.get(tu, set()))\n\n\ndef cho_dut(log):\n    return sum(1 for a, b in zip(log, log[1:]) if a[1] !=\
      \ b[0])\n\n\nprint(\"canh sai trong nhat ky:\", canh_sai(LOG))\nprint(\"cho dut:\", cho_dut(LOG), \"; trang thai dung lai:\", LOG[-1][1])\nprint(\"xoa dong 3:\", cho_dut(LOG[:2] + LOG[3:]), \"cho\
      \ dut\")"
  L34_HaiNguoiCungDuyet:
    lang: python
    timeout: 120
    reason: 'HaiNguoiCungDuyet: chạy nguyên văn.'
    claims:
    - 'hai người cùng thấy CHO_DUYET: ghi không điều kiện cho cả hai thành công, ghi có điều kiện chỉ một người thành công'
    expect_stdout: 'khong dieu kien: an thanh cong, binh thanh cong

      co dieu kien: an thanh cong, binh bi tu choi'
    code: "import sqlite3\n\n\ndef thu(co_dieu_kien):\n    db = sqlite3.connect(\":memory:\")\n    db.execute(\"CREATE TABLE ho_so (id INTEGER PRIMARY KEY, tt TEXT)\")\n    db.execute(\"INSERT INTO ho_so\
      \ VALUES (1, 'CHO_DUYET')\")\n    kq = []\n    for ai in (\"an\", \"binh\"):\n        sql = \"UPDATE ho_so SET tt = 'DA_DUYET' WHERE id = 1\"\n        if co_dieu_kien:\n            sql += \" AND tt\
      \ = 'CHO_DUYET'\"\n        ok = db.execute(sql).rowcount\n        kq.append(ai + (\" thanh cong\" if ok else \" bi tu choi\"))\n    return \", \".join(kq)\n\n\nprint(\"khong dieu kien:\", thu(False))\n\
      print(\"co dieu kien:\", thu(True))"
  L34_QuyMoTraCuu:
    lang: python
    timeout: 200
    reason: 'QuyMoTraCuu: chạy nguyên văn.'
    claims:
    - 'tra lịch sử một khách: không chỉ mục quét hết 1 000 và 1 000 000 dòng; có chỉ mục chỉ đọc 5 dòng ở cả hai cỡ'
    expect_stdout: '1000 dong: khong chi muc SCAN doc 1000; co chi muc SEARCH doc 5

      1000000 dong: khong chi muc SCAN doc 1000000; co chi muc SEARCH doc 5'
    code: "import sqlite3\ndem = 0\ndef tick():\n    global dem\n    dem += 1\n    return 1\nSQL = \"SELECT COUNT(*) FROM ls WHERE tick() AND khach = 7\"\nfor n in (1000, 1000000):\n    db = sqlite3.connect(\"\
      :memory:\")\n    db.create_function(\"tick\", 0, tick)\n    db.execute(\"CREATE TABLE ls (khach INT, thang INT, nhom INT)\")\n    db.executemany(\"INSERT INTO ls VALUES (?, ?, ?)\",\n            \
      \       ((i // 5, i % 5, i % 3) for i in range(n)))\n    kq = []\n    for co_chi_muc in (False, True):\n        if co_chi_muc:\n            db.execute(\"CREATE INDEX ix ON ls (khach)\")\n        kh\
      \ = db.execute(\"EXPLAIN QUERY PLAN \" + SQL).fetchone()[3]\n        dem = 0\n        db.execute(SQL).fetchone()\n        kq.append(f\"{kh.split()[0]} doc {dem}\")\n    print(f\"{n} dong: khong chi\
      \ muc {kq[0]}; co chi muc {kq[1]}\")"
  LAB_L34:
    lang: python
    expect_stdout: 'ho so A: tong 220 -> hoi dong

      ho so B: tong 40 -> chuyen vien

      THAM_DINH -> KHOI_TAO: tu choi

      K9 tham dinh 2026-05-31: cho phep

      K9 tham dinh 2026-07-01: tu choi (het han)'
    code: "import sqlite3\n\nBAC = [(50, \"chuyen vien\"), (200, \"truong phong\"), (None, \"hoi dong\")]\nCANH = {(\"KHOI_TAO\", \"THAM_DINH\"), (\"THAM_DINH\", \"DUYET\"),\n        (\"THAM_DINH\", \"\
      TU_CHOI\")}\n\n\ndef can_ai(du_no, moi):\n    tong = du_no + moi\n    for tran, vai in BAC:\n        if tran is None or tong <= tran:\n            return tong, vai\n\n\ndef chuyen(tu, den):\n    return\
      \ \"cho phep\" if (tu, den) in CANH else \"tu choi\"\n\n\ndb = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE dong_y (khach TEXT, muc_dich TEXT, het_han TEXT, thu_hoi INT)\")\ndb.execute(\"\
      INSERT INTO dong_y VALUES ('K9', 'tham dinh', '2026-06-30', 0)\")\n\n\ndef tra_cuu(khach, muc_dich, ngay):\n    sql = \"SELECT het_han, thu_hoi FROM dong_y WHERE khach = ? AND muc_dich = ?\"\n   \
      \ row = db.execute(sql, (khach, muc_dich)).fetchone()\n    if row is None:\n        return \"tu choi (khong co dong y)\"\n    if row[1]:\n        return \"tu choi (da thu hoi)\"\n    if row[0] < ngay:\n\
      \        return \"tu choi (het han)\"\n    return \"cho phep\"\n\n\nfor ten, du_no, moi in ((\"A\", 120, 100), (\"B\", 0, 40)):\n    tong, vai = can_ai(du_no, moi)\n    print(f\"ho so {ten}: tong\
      \ {tong} -> {vai}\")\nprint(\"THAM_DINH -> KHOI_TAO:\", chuyen(\"THAM_DINH\", \"KHOI_TAO\"))\nfor ngay in (\"2026-05-31\", \"2026-07-01\"):\n    print(\"K9 tham dinh\", ngay + \":\", tra_cuu(\"K9\"\
      , \"tham dinh\", ngay))"
