sources:
  L19_PhanBo:
    lang: python
    timeout: 300
    reason: 'PhanBo: chạy nguyên văn.'
    claims:
    - 3 000 và 300 000 khoá dedup:TX… chia cho ba nút theo dải khe; cùng thẻ băm thì dồn hết về một nút
    expect_stdout: '3000 khoa, nut 1-2-3: [994, 994, 1012] | chung the bam: [0, 0, 3000]

      300000 khoa, nut 1-2-3: [100008, 99949, 100043] | chung the bam: [0, 0, 300000]'
    code: "import binascii\ndai = [(0, 5460), (5461, 10922), (10923, 16383)]\ndef nut(khoa):\n    a = khoa.find(\"{\")\n    b = khoa.find(\"}\", a + 1)\n    if a >= 0 and b > a + 1:         # thẻ băm: chỉ\
      \ băm phần trong {}\n        khoa = khoa[a + 1:b]\n    k = binascii.crc_hqx(khoa.encode(), 0) % 16384\n    return next(i for i, (x, y) in enumerate(dai) if x <= k <= y)\nfor n in (3000, 300000):\n\
      \    dem, the = [0, 0, 0], [0, 0, 0]\n    for i in range(n):\n        dem[nut(f\"dedup:TX{i}\")] += 1\n        the[nut(f\"dedup:{{tx}}:{i}\")] += 1\n    print(n, \"khoa, nut 1-2-3:\", dem, \"| chung\
      \ the bam:\", the)"
  LAB_L19:
    lang: python
    expect_stdout: 'loan:disb:B7 -> khe 13590, nut 4

      dedup:TX9 -> khe 11819, nut 3

      {acc}:5 -> khe 12007, nut 3

      {acc}:6 -> khe 12007, nut 3

      giay 0 OK

      giay 45 None

      giay 90 OK

      giay 91 None

      han danh sach den: 360'
    code: "import binascii\n\nKHE = 16384\nSO_NUT = 4\n\n\ndef khe(khoa):\n    a = khoa.find(\"{\")\n    b = khoa.find(\"}\", a + 1)\n    if a >= 0 and b > a + 1:          # thẻ băm: chỉ băm phần trong\
      \ {}\n        khoa = khoa[a + 1:b]\n    return binascii.crc_hqx(khoa.encode(), 0) % KHE\n\n\nfor khoa in (\"loan:disb:B7\", \"dedup:TX9\", \"{acc}:5\", \"{acc}:6\"):\n    k = khe(khoa)\n    print(f\"\
      {khoa} -> khe {k}, nut {k // (KHE // SO_NUT) + 1}\")\n\n\nclass Kho:\n    def __init__(self):\n        self.het, self.t = {}, 0\n\n    def set_nx_ex(self, khoa, han):\n        if self.het.get(khoa,\
      \ 0) > self.t:\n            return None\n        self.het[khoa] = self.t + han\n        return \"OK\"\n\n\nkho = Kho()\nfor kho.t in (0, 45, 90, 91):\n    print(\"giay\", kho.t, kho.set_nx_ex(\"dedup:TX9\"\
      , 90))\n\nprint(\"han danh sach den:\", 1000 - 640)"
