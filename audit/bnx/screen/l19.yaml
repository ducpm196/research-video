    sha: 73aab28347116383
    kind: run
    lang: python
    claims:
    - Chuỗi thử chuẩn ra ba một C ba ở hệ mười sáu
    - Khoá mẫu ra bốn mươi tư nghìn chín trăm năm mươi, và khe là mười hai nghìn một trăm tám mươi hai
    expect_stdout: '0x31c3 44950 12182

      [(0, 5460), (5461, 10922), (10923, 16383)]

      '
    post: 'assert crc16(b''hello'') % 16384 == 866 and crc16(b''hello'') == 50018

      '
    note: 'CRC16 XMODEM theo Redis cluster specification (Poly 1021, Init 0000, Output for "123456789": 31C3). Ba dải khe là số redis-cli thật
      in ra (khối example 3 0).'
