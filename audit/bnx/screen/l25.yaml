    - đầu ra thật của ChaySpring
    expect_stdout: 'ct la proxy: true

      1 REQUIRED, loi chay: so du 1000, nhat ky 0

      2 REQUIRES_NEW, loi chay: so du 1000, nhat ky 1

      3 loi kiem tra, mac dinh: so du 900, nhat ky 0

      4 loi kiem tra, rollbackFor: so du 1000, nhat ky 0

      goi qua proxy: giao dich true

      goi noi bo: giao dich false

      doan cat chay 1 lan, khong am true

      READ_COMMITTED: 1000 -> 1050

      REPEATABLE_READ: 1000 -> 1000

      SERIALIZABLE: 1000 -> 1000

      3 luong, be 3 ket noi: 3 luong het gio

      3 luong, be 4 ket noi: 0 luong het gio

      6 luong, be 6 ket noi: 6 luong het gio

      6 luong, be 7 ket noi: 0 luong het gio'
    files:
      Cfg.java: src:BNX:L25_Cfg
      NhatKy.java: src:BNX:L25_NhatKy
      ChuyenTien.java: src:BNX:L25_ChuyenTien
      DoGio.java: src:BNX:L25_DoGio
      DemTx.java: src:BNX:L25_DemTx
      DemCoLap.java: src:BNX:L25_DemCoLap
      DemBe.java: src:BNX:L25_DemBe
    code: "D=/d/research-video/audit/bnx/deps/l25\nls $D/spring-tx-7.0.10.jar >/dev/null 2>&1 || { echo \"NOT_VERIFIED: thiếu jar\" >&2; exit 97; }\nmkdir -p lib out && cp $D/*.jar lib/\njavac -encoding\
      \ UTF-8 -cp \"lib/*\" -d out *.java\nfor c in DemTx DemCoLap DemBe; do\n  java -Dstdout.encoding=UTF-8 -cp \"out;lib/*\" $c 2>/dev/null\ndone"
  LAB_L25:
    lang: python
    expect_stdout: 'IllegalArgumentException + khong khai: hoan tac

      IOException + khong khai: chot

      IOException + Exception: hoan tac

      Error + khong khai: hoan tac

      khong loi + khong khai: chot'
    code: "LOI_KIEM_TRA = {\"IOException\", \"SQLException\", \"Exception\"}   # kiểm tra: phải khai hoặc bắt\nLOI_KHONG_KIEM_TRA = {\"IllegalArgumentException\", \"RuntimeException\", \"NullPointerException\"\
      }\n\n\ndef hoan_tac(loi, rollback_for=()):\n    if loi is None:\n        return False\n    if loi == \"Error\":\n        return True\n    if loi in LOI_KHONG_KIEM_TRA:\n        return True\n    return\
      \ loi in rollback_for or (\"Exception\" in rollback_for and loi in LOI_KIEM_TRA)\n\n\nCAC_CA = [\n    (\"IllegalArgumentException\", ()),\n    (\"IOException\", ()),\n    (\"IOException\", (\"Exception\"\
      ,)),\n    (\"Error\", ()),\n    (None, ()),\n]\nfor loi, khai in CAC_CA:\n    print(f\"{loi or 'khong loi'} + {','.join(khai) or 'khong khai'}: {'hoan tac' if hoan_tac(loi, khai) else 'chot'}\")"
