blocks:
  BNX L04 formula 3 0:
    sha: 0444379ad268d689
    kind: other
    lang: http
    reason: Bản tin HTTP xin mã của luồng thông tin máy khách; không có máy chủ ủy quyền thật để gửi.
    read_check: 'Đã đọc RFC 6749 (rfc-editor.org, 2026-11-11): mục 4.4.2 có ví dụ “POST /token HTTP/1.1”, “Host: server.example.com”, “Authorization:
      Basic czZCaGRSa3F0MzpnWDFmQmF0M2JW”, “Content-Type: application/x-www-form-urlencoded”, thân “grant_type=client_credentials”; màn hình thêm
      “&scope=payments:write” (tham số scope là OPTIONAL ở mục 4.4.2, cú pháp danh sách ngăn bằng dấu cách ở mục 3.3). Giá trị Basic giải mã base64
      thật (audit/bnx/ver/l04.py) = “s6BhdRkqt3:gX1fBat3bV” = client_id:client_secret của ví dụ RFC. Có dòng trống giữa phần đầu và thân như RFC
      9112.'
    unverified_claims:
    - máy chủ ủy quyền sẽ cấp mã với phạm vi payments:write — hành vi máy chủ, không có máy chủ để chạy
  BNX L04 formula 4 0:
    sha: 12e0fa78827915ed
    kind: other
    lang: json
    reason: Phản hồi JSON của máy chủ ủy quyền (minh hoạ); chuỗi mã truy cập rút gọn bằng “…”.
    read_check: 'JSON được phân tích thật. Đã đọc RFC 6749 mục 5.1 (2026-11-11): access_token REQUIRED, token_type REQUIRED, expires_in RECOMMENDED
      (“lifetime in seconds”), scope OPTIONAL nếu trùng phạm vi đã xin; token_type Bearer theo RFC 6750. Phần đầu của mã rút gọn là base64url
      của {"typ":"at+jwt","alg":… (RFC 9068 mục 2.1: typ at+jwt) — kiểm ở ver/l04.py.'
  BNX L04 example 5 0:
    sha: 2602cfefdaa7663b
    kind: run
    lang: python
    claims:
    - tên mình không có trong aud (chuỗi hoặc danh sách) → 401; bây giờ ≥ exp + 60 → 401 (RFC 7519 §4.1.4, như bài 3); thiếu phạm vi → 403; còn
      lại 200
    post: 'c = {''aud'': ''api-a'', ''exp'': 1300, ''scope'': ''accounts:read''}

      assert kiem(c, ''payments:write'', ''api-a'', 1010) == 403

      assert kiem(c, ''accounts:read'', ''api-a'', 1359) == 200

      assert kiem(c, ''accounts:read'', ''api-a'', 1360) == 401

      assert kiem(c, ''accounts:read'', ''api-b'', 1010) == 401

      assert kiem(dict(c, aud=[''api-b'', ''api-a'']), ''accounts:read'', ''api-a'', 1010) == 200

      assert kiem(c, ''accounts:read'', ''api-a'', 1300, lech=0) == 401

      '
    note: 'Kết quả năm ca thử kiểm ở khối example 6 0 (expect_stdout). Giây biên sửa 2026-11-11 theo rà độc lập: > thành ≥ (khớp RFC 7519 và bài
      3).'
