sources:
  L28_ASql:
    lang: sql
    kind: other
    reason: 'Phiên A của PostgreSQL: giữ khoá dòng 30 giây, đủ dài cho máy bận (tạo tệp /tmp/a.ok khi đã giữ khoá để phiên B biết lúc nào thử).'
    read_check: Chạy nguyên văn bởi psql trong container postgres (nguồn L28_ChayPg); đầu ra phiên B khớp từng dòng.
    code: 'begin;

      select 1 from tk where id = 1 for update;

      \! touch /tmp/a.ok

      select pg_sleep(30);

      commit;'
  L28_ChayPg:
    lang: bash
    timeout: 900
    reason: 'ChayPg: chạy nguyên văn.'
    claims:
    - 'không chỉ mục: quét tuần tự, loại bỏ N−1 dòng; có chỉ mục: quét theo chỉ mục, không loại dòng nào'
    - 'NOWAIT: báo lỗi could not obtain lock on row ngay khi dòng đang bị giữ'
    expect_stdout: "phien ban: 17.12\n1000 dong, khong chi muc:\nSeq Scan on t1000 (actual rows=1 loops=1)\n  Rows Removed by Filter: 999\n1000 dong, co chi muc:\nIndex Scan using t1000_so_idx on t1000\
      \ (actual rows=1 loops=1)\n100000 dong, khong chi muc:\nSeq Scan on t100000 (actual rows=1 loops=1)\n  Rows Removed by Filter: 99999\n100000 dong, co chi muc:\nIndex Scan using t100000_so_idx on t100000\
      \ (actual rows=1 loops=1)\n1000000 dong, khong chi muc:\nSeq Scan on t1000000 (actual rows=1 loops=1)\n  Rows Removed by Filter: 999999\n1000000 dong, co chi muc:\nIndex Scan using t1000000_so_idx\
      \ on t1000000 (actual rows=1 loops=1)\nERROR:  could not obtain lock on row in relation \"tk\""
    files:
      a.sql: src:BNX:L28_ASql
    code: "export MSYS_NO_PATHCONV=1\nC=bnx-l28-pg\nIMG=postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065\ncommand -v docker >/dev/null || { echo \"NOT_VERIFIED:\
      \ thiếu docker\" >&2; exit 97; }\ndocker image inspect $IMG >/dev/null 2>&1 || docker pull -q $IMG >/dev/null 2>&1 || { echo \"NOT_VERIFIED: không có ảnh PostgreSQL\" >&2; exit 97; }\ndocker rm -f\
      \ $C >/dev/null 2>&1\ndocker run --rm -d --name $C -e POSTGRES_PASSWORD=bnx_pass $IMG >/dev/null\nfor i in $(seq 1 90); do\n  [ \"$(docker logs $C 2>&1 | grep -c 'ready to accept connections')\" -ge\
      \ 2 ] && break\n  sleep 1\ndone\nP=\"docker exec -i -e PGOPTIONS=-cmax_parallel_workers_per_gather=0 $C psql -U postgres -v ON_ERROR_STOP=1 -tA\"\nEX=\"explain (analyze, costs off, timing off, summary\
      \ off)\"\nloc() { grep -E \"Scan|Rows Removed\"; }\necho \"phien ban: $($P -c 'show server_version')\"\nfor n in 1000 100000 1000000; do\n  $P -q -c \"create table t$n (id int primary key, so text)\"\
      \n  $P -q -c \"insert into t$n select g, 'K'||g from generate_series(1,$n) g\"\n  $P -q -c \"analyze t$n\"\n  echo \"$n dong, khong chi muc:\"\n  $P -c \"$EX select * from t$n where so = 'K7'\" |\
      \ loc\n  $P -q -c \"create index on t$n(so)\"\n  $P -q -c \"analyze t$n\"\n  echo \"$n dong, co chi muc:\"\n  $P -c \"$EX select * from t$n where so = 'K7'\" | loc\ndone\n$P -q -c \"create table tk\
      \ (id int primary key, so_du bigint)\" -c \"insert into tk values (1, 1000)\"\ndocker cp a.sql $C:/a.sql\ndocker exec -d $C psql -U postgres -q -o /dev/null -f /a.sql\nuntil docker exec $C test -f\
      \ /tmp/a.ok; do sleep 0.5; done\n$P -c \"select * from tk where id = 1 for update nowait\" 2>&1 | head -1\ndocker rm -f $C >/dev/null 2>&1"
  L28_ChayMg:
    lang: bash
    timeout: 600
    reason: 'ChayMg: chạy nguyên văn.'
    claims:
    - tài liệu lồng nhau đọc trong một lần; không chỉ mục xem 100000 tài liệu, có chỉ mục xem 1; cập nhật có điều kiện trên một tài liệu là nguyên tử
    expect_stdout: 'phien ban: 8.3.17

      {"_id":"001","ten":"An","so_du":1000,"gd":[{"so":600,"loai":"nap"},{"so":50,"loai":"rut"}]}

      co gd rut: 1

      khong chi muc: xem 100000 tai lieu

      co chi muc: xem 1 tai lieu

      rut 600 lan 1: 1

      rut 600 lan 2: 0

      so du con lai: 400'
    code: "export MSYS_NO_PATHCONV=1\nC=bnx-l28-mg\nIMG=mongo:8@sha256:0f64db83d5926400d1cbcbaf35fbf2b0dfa6a4eaa71e04a26481a38cd803b27b\ncommand -v docker >/dev/null || { echo \"NOT_VERIFIED: thiếu docker\"\
      \ >&2; exit 97; }\ndocker image inspect $IMG >/dev/null 2>&1 || docker pull -q $IMG >/dev/null 2>&1 || { echo \"NOT_VERIFIED: không có ảnh MongoDB\" >&2; exit 97; }\ndocker rm -f $C >/dev/null 2>&1\n\
      docker run --rm -d --name $C $IMG >/dev/null\nfor i in $(seq 1 90); do\n  docker exec $C mongosh --quiet --eval \"db.runCommand({ping: 1}).ok\" 2>/dev/null | grep -q 1 && break\n  sleep 1\ndone\n\
      js() { docker exec $C mongosh --quiet --eval \"$1\"; }\njs 'print(\"phien ban: \" + db.version())'\njs '\ndb.tk.insertMany([\n  {_id: \"001\", ten: \"An\", so_du: 1000, gd: [{so: 600, loai: \"nap\"\
      }, {so: 50, loai: \"rut\"}]},\n  {_id: \"002\", ten: \"Binh\", so_du: 300, gd: []}]);\nprint(JSON.stringify(db.tk.findOne({_id: \"001\"})));\nprint(\"co gd rut: \" + db.tk.countDocuments({\"gd.loai\"\
      : \"rut\"}))'\njs '\nvar lo = [];\nfor (var i = 1; i <= 100000; i++) lo.push({_id: \"T\" + i, so: \"S\" + i});\ndb.lon.insertMany(lo);\nvar kieu = () => JSON.stringify(db.lon.find({so: \"S777\"}).explain(\"\
      executionStats\").executionStats).match(/\"totalDocsExamined\":(\\d+)/)[1];\nprint(\"khong chi muc: xem \" + kieu() + \" tai lieu\");\ndb.lon.createIndex({so: 1});\nprint(\"co chi muc: xem \" + kieu()\
      \ + \" tai lieu\")'\njs '\nvar rut = () => db.tk.updateOne({_id: \"001\", so_du: {$gte: 600}}, {$inc: {so_du: -600}}).modifiedCount;\nprint(\"rut 600 lan 1: \" + rut());\nprint(\"rut 600 lan 2: \"\
      \ + rut());\nprint(\"so du con lai: \" + db.tk.findOne({_id: \"001\"}).so_du)'\ndocker rm -f $C >/dev/null 2>&1"
  L28_MysqlA:
    lang: sql
    kind: other
    reason: 'Phiên A của MySQL: giữ khoá dòng 30 giây, đủ dài cho máy bận (container bị gỡ ngay sau khi phiên B thử).'
    read_check: Chạy nguyên văn bởi mysql trong container mysql (nguồn L28_ChayMy).
    code: 'begin;

      select 1 from tk where id = 1 for update;

      select sleep(30);

      commit;'
  L28_ChayMy:
    lang: bash
    timeout: 900
    reason: 'ChayMy: chạy nguyên văn.'
    claims:
    - 'MySQL: không chỉ mục kiểu truy cập ALL, có chỉ mục ref; NOWAIT báo lỗi ngay khi dòng bị giữ'
    expect_stdout: 'phien ban: 8.4.13

      so dong: 20000

      khong chi muc: ALL

      co chi muc: ref

      ERROR 3572 (HY000) at line 1: Statement aborted because lock(s) could not be acquired immediately and NOWAIT is set.'
    files:
      mysqla.sql: src:BNX:L28_MysqlA
    code: "export MSYS_NO_PATHCONV=1\nC=bnx-l28-my\nIMG=mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902\ncommand -v docker >/dev/null || { echo \"NOT_VERIFIED: thiếu docker\"\
      \ >&2; exit 97; }\ndocker image inspect $IMG >/dev/null 2>&1 || docker pull -q $IMG >/dev/null 2>&1 || { echo \"NOT_VERIFIED: không có ảnh MySQL\" >&2; exit 97; }\ndocker rm -f $C >/dev/null 2>&1\n\
      docker run --rm -d --name $C -e MYSQL_ROOT_PASSWORD=bnx_pass -e MYSQL_DATABASE=bnx $IMG >/dev/null\nfor i in $(seq 1 180); do\n  docker logs $C 2>&1 | grep -q 'Ready for start up' && break\n  sleep\
      \ 1\ndone\nfor i in $(seq 1 180); do\n  docker exec $C mysqladmin -uroot -pbnx_pass ping 2>/dev/null | grep -q alive && break\n  sleep 1\ndone\nM=\"docker exec -i $C mysql -uroot -pbnx_pass bnx -N\"\
      \nq() { $M -e \"$1\" 2>&1 | grep -v \"Using a password\"; }\nwait_lock() { for i in $(seq 1 60); do [ \"$(q \"select count(*) from performance_schema.data_locks where lock_type = 'RECORD'\" | tail\
      \ -1)\" -gt 0 ] 2>/dev/null && return; sleep 1; done; }\necho \"phien ban: $(q 'select version()')\"\nq \"create table tk (id int primary key, so varchar(20), so_du bigint)\"\nq \"set session cte_max_recursion_depth\
      \ = 100000; insert into tk select seq, concat('K', seq), seq * 10 from (with recursive s(seq) as (select 1 union all select seq + 1 from s where seq < 20000) select seq from s) x\"\necho \"so dong:\
      \ $(q 'select count(*) from tk')\"\necho \"khong chi muc: $(q \"explain select * from tk where so = 'K7'\" | cut -f5)\"\nq \"create index idx_so on tk(so)\"\necho \"co chi muc: $(q \"explain select\
      \ * from tk where so = 'K7'\" | cut -f5)\"\ndocker cp mysqla.sql $C:/mysqla.sql\ndocker exec -d $C sh -c \"mysql -uroot -pbnx_pass bnx < /mysqla.sql > /dev/null 2>&1\"\nwait_lock\nq \"select * from\
      \ tk where id = 1 for update nowait\" | head -1\ndocker rm -f $C >/dev/null 2>&1"
  L28_SoSanhKhoa:
    lang: python
    timeout: 300
    reason: Hai phiên song song trên Oracle (bnx-ora) và SQL Server (bnx-mss) của khoá BNX; bảng riêng bnx_l28_tk / cơ sở dữ liệu bnx_l28, tự dọn.
    claims:
    - 'Oracle: FOR UPDATE NOWAIT báo ORA-00054; SQL Server: LOCK_TIMEOUT 0 báo Msg 1222'
    expect_stdout: 'Oracle: ORA-00054: Failed to acquire a lock

      SQL Server: Msg 1222: Lock request time out period exceeded.'
    code: "import sys, threading, time, re\nsys.path.insert(0, \"D:/research-video/audit/bnx\")\nimport dbrun\n\ndbrun.ora(\"\"\"\nBEGIN EXECUTE IMMEDIATE 'DROP TABLE bnx_l28_tk'; EXCEPTION WHEN OTHERS\
      \ THEN NULL; END;\n/\nCREATE TABLE bnx_l28_tk (id NUMBER PRIMARY KEY, so_du NUMBER);\nINSERT INTO bnx_l28_tk VALUES (1, 1000);\nCOMMIT;\n\"\"\")\na = threading.Thread(target=dbrun.ora, args=(\"\"\"\
      \nDECLARE x NUMBER;\nBEGIN\n  SELECT so_du INTO x FROM bnx_l28_tk WHERE id = 1 FOR UPDATE;\n  DBMS_SESSION.SLEEP(9);\n  ROLLBACK;\nEND;\n/\n\"\"\",))\na.start()\ntime.sleep(5)\no = dbrun.ora(\"SELECT\
      \ so_du FROM bnx_l28_tk WHERE id = 1 FOR UPDATE NOWAIT;\")\na.join()\nprint(\"Oracle:\", re.search(r\"ORA-\\d+: [^\\n(]+\", o).group(0).strip())\ndbrun.ora(\"DROP TABLE bnx_l28_tk PURGE;\")\n\ndbrun.mss(\"\
      IF DB_ID('bnx_l28') IS NULL CREATE DATABASE bnx_l28\")\ndbrun.mss(\"DROP TABLE IF EXISTS tk; CREATE TABLE tk (id INT PRIMARY KEY, so_du BIGINT); INSERT INTO tk VALUES (1, 1000)\", db=\"bnx_l28\")\n\
      giu = \"\"\"BEGIN TRAN;\nUPDATE tk SET so_du = so_du WHERE id = 1;\nWAITFOR DELAY '00:00:09';\nROLLBACK\"\"\"\nb = threading.Thread(target=dbrun.mss, args=(giu,), kwargs={\"db\": \"bnx_l28\"})\nb.start()\n\
      time.sleep(5)\nxin = \"\"\"SET LOCK_TIMEOUT 0;\nSELECT so_du FROM tk WITH (UPDLOCK, ROWLOCK) WHERE id = 1\"\"\"\no = dbrun.mss(xin, db=\"bnx_l28\")\nb.join()\nm = re.search(r\"Msg (\\d+), Level \\\
      d+, State \\d+, Server \\S+, Line \\d+\\s*\\n?(.+)\", o)\nprint(\"SQL Server: Msg \" + m.group(1) + \": \" + m.group(2).strip())\ndbrun.mss(\"DROP TABLE IF EXISTS tk\", db=\"bnx_l28\")"
  L28_RutTien:
    lang: python
    timeout: 120
    reason: 'RutTien: chạy nguyên văn.'
    claims:
    - 'rút có điều kiện: lần 1 được, lần 2 bị từ chối, còn 400; đọc rồi ghi: còn 400 nhưng đã chi 1200'
    expect_stdout: 'co dieu kien: 1 0 con 400

      doc roi ghi: con 400 , chi ra 1200 nhung chi bi tru 600'
    code: "tk = {\"so_du\": 1000}\n\ndef rut_co_dieu_kien(so):\n    if tk[\"so_du\"] >= so:        # kiểm và trừ trong MỘT bước\n        tk[\"so_du\"] -= so\n        return 1\n    return 0\n\nprint(\"co\
      \ dieu kien:\", rut_co_dieu_kien(600), rut_co_dieu_kien(600), \"con\", tk[\"so_du\"])\ndoc_a = doc_b = 1000             # hai bên cùng đọc trước khi ai ghi\nso_du = doc_a - 600              # A ghi\n\
      so_du = doc_b - 600              # B ghi đè\nprint(\"doc roi ghi: con\", so_du, \", chi ra 1200 nhung chi bi tru 600\")"
  LAB_L28:
    lang: python
    expect_stdout: 'co dieu kien: 1 0 1 con 0

      doc roi ghi: A doc 700, B doc 700, ghi 200 va 200, con 200 (mat 500)'
    code: "def rut_co_dieu_kien(tk, so):\n    if tk[\"so_du\"] >= so:\n        tk[\"so_du\"] -= so\n        return 1\n    return 0\n\n\ntk = {\"so_du\": 700}\nkq = [rut_co_dieu_kien(tk, r) for r in (500,\
      \ 500, 200)]\nprint(\"co dieu kien:\", *kq, \"con\", tk[\"so_du\"])\n\nso_du = 700\ndoc_a = doc_b = so_du                 # hai bên cùng đọc trước khi ai ghi\nso_du = doc_a - 500                 \
      \  # A ghi\nso_du = doc_b - 500                   # B ghi đè\nmat = 500 + 500 - (700 - so_du)\nprint(f\"doc roi ghi: A doc {doc_a}, B doc {doc_b}, ghi 200 va 200, con {so_du} (mat {mat})\")"
