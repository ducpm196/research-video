sources:
  L16_be_luong:
    lang: java
    java_class: BeLuong
    code: "import java.util.*;\nimport java.util.concurrent.*;\npublic class BeLuong {\n  public static void main(String[] a) throws Exception\
      \ {\n    ExecutorService be = Executors.newFixedThreadPool(4);\n    Set<String> luong = ConcurrentHashMap.newKeySet();\n    List<Future<Integer>>\
      \ hen = new ArrayList<>();\n    for (int i = 1; i <= 10; i++) {\n      int so = i;\n      hen.add(be.submit(() -> {\n        Thread.sleep(100);\
      \               // mỗi việc chờ 100 ms\n        luong.add(Thread.currentThread().getName());\n        return so * so;\n      }));\n    }\n\
      \    int tong = 0;\n    for (Future<Integer> h : hen) tong += h.get();  // chờ kết quả\n    be.shutdown();\n    System.out.println(\"số\
      \ luồng đã dùng: \" + luong.size());\n    System.out.println(\"tổng 10 kết quả: \" + tong);\n    System.out.println(\"số lượt: \" + (10\
      \ + 4 - 1) / 4);\n  }\n}\n"
    reason: Tệp BeLuong.java đầy đủ (hằng J_POOL ở audit/bnx/src/l16.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - 10 việc chỉ dùng đúng 4 luồng
    - tổng các bình phương từ 1 tới 10 là 385
    - số lượt là 3
    expect_stdout: 'số luồng đã dùng: 4

      tổng 10 kết quả: 385

      số lượt: 3

      '
    timeout: 120
  L16_hang_doi:
    lang: java
    java_class: HangDoi
    code: "import java.util.concurrent.*;\npublic class HangDoi {\n  public static void main(String[] a) {\n    CountDownLatch cua = new CountDownLatch(1);\
      \  // giữ việc lại\n    ThreadPoolExecutor be = new ThreadPoolExecutor(4, 4, 0,\n        TimeUnit.SECONDS, new ArrayBlockingQueue<>(2));\n\
      \    int nhan = 0, tuChoi = 0;\n    for (int i = 1; i <= 10; i++) {\n      try {\n        be.execute(() -> {\n          try { cua.await();\
      \ } catch (InterruptedException e) { }\n        });\n        nhan++;\n      } catch (RejectedExecutionException e) { tuChoi++; }\n    }\n\
      \    System.out.println(\"số luồng: \" + be.getPoolSize());\n    System.out.println(\"trong hàng đợi: \" + be.getQueue().size());\n    System.out.println(\"\
      nhận \" + nhan + \", từ chối \" + tuChoi);\n    cua.countDown();\n    be.shutdown();\n  }\n}\n"
    reason: Tệp HangDoi.java đầy đủ (hằng J_QUEUE ở audit/bnx/src/l16.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - 4 luồng, 2 việc trong hàng đợi, nhận 6 và từ chối 4
    expect_stdout: 'số luồng: 4

      trong hàng đợi: 2

      nhận 6, từ chối 4

      '
    timeout: 120
  L16_ghep_loi_goi:
    lang: java
    java_class: GhepLoiGoi
    code: "import java.util.*;\nimport java.util.concurrent.*;\nimport static java.util.concurrent.CompletableFuture.*;\npublic class GhepLoiGoi\
      \ {\n  static Queue<String> xong = new ConcurrentLinkedQueue<>();\n  static int goi(String ten, int ms, int giaTri) {\n    try { Thread.sleep(ms);\
      \ } catch (InterruptedException e) { }\n    xong.add(ten);                     // ghi lại thứ tự xong\n    return giaTri;\n  }\n  public\
      \ static void main(String[] a) {\n    ExecutorService be = Executors.newFixedThreadPool(3);\n    long t0 = System.nanoTime();\n    var diem\
      \ = supplyAsync(() -> goi(\"điểm\", 400, 700), be);\n    var soDu = supplyAsync(() -> goi(\"số dư\", 200, 500), be);\n    var hanMuc = supplyAsync(()\
      \ -> goi(\"hạn mức\", 300, 300), be);\n    var khaDung = soDu.thenCombine(hanMuc, (x, y) -> x + y);\n    allOf(diem, khaDung).join();  \
      \     // chờ cả ba lời gọi\n    long ms = (System.nanoTime() - t0) / 1_000_000;\n    System.out.println(\"thứ tự xong: \" + xong);\n   \
      \ System.out.println(\"khả dụng: \" + khaDung.join());\n    System.out.println(\"điểm: \" + diem.join());\n    System.out.println(\"chờ\
      \ dưới 900 ms: \" + (ms < 900));\n    be.shutdown();\n  }\n}\n"
    reason: Tệp GhepLoiGoi.java đầy đủ (hằng J_CF ở audit/bnx/src/l16.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - thứ tự xong là số dư, hạn mức, điểm dù gửi lời gọi chậm nhất trước
    - khả dụng 800, điểm 700, thời gian chờ dưới 900 ms
    expect_stdout: 'thứ tự xong: [số dư, hạn mức, điểm]

      khả dụng: 800

      điểm: 700

      chờ dưới 900 ms: true

      '
    timeout: 120
  L16_chia_doi:
    lang: java
    java_class: ChiaDoi
    code: "import java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\npublic class ChiaDoi extends RecursiveTask<Long> {\n  static\
      \ final int NGUONG = 10_000;\n  static AtomicInteger la = new AtomicInteger();\n  final int tu, den;                   // cộng các số từ\
      \ tu tới den\n  ChiaDoi(int tu, int den) { this.tu = tu; this.den = den; }\n  protected Long compute() {\n    if (den - tu + 1 <= NGUONG)\
      \ {      // đủ nhỏ: tự cộng, là việc lá\n      la.incrementAndGet();\n      long s = 0;\n      for (int i = tu; i <= den; i++) s += i;\n\
      \      return s;\n    }\n    int giua = (tu + den) / 2;\n    ChiaDoi trai = new ChiaDoi(tu, giua);\n    ChiaDoi phai = new ChiaDoi(giua\
      \ + 1, den);\n    trai.fork();                       // đẩy nửa trái vào hàng việc\n    return phai.compute() + trai.join();  // tự làm\
      \ nửa phải\n  }\n  public static void main(String[] a) {\n    ForkJoinPool be = new ForkJoinPool(4);\n    long tong = be.invoke(new ChiaDoi(1,\
      \ 1_000_000));\n    System.out.println(\"tổng: \" + tong);\n    System.out.println(\"số việc lá: \" + la.get());\n  }\n}\n"
    reason: Tệp ChiaDoi.java đầy đủ (hằng J_FJ ở audit/bnx/src/l16.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - tổng 500000500000
    - đúng 128 việc lá
    expect_stdout: 'tổng: 500000500000

      số việc lá: 128

      '
    timeout: 120
  L16_dung_chung:
    lang: java
    java_class: DungChung
    code: "import java.util.*;\nimport java.util.concurrent.*;\npublic class DungChung {\n  static void thu(Executor io, Executor cpu) throws\
      \ Exception {\n    List<String> xong = new CopyOnWriteArrayList<>();\n    CountDownLatch het = new CountDownLatch(3);\n    for (int ms :\
      \ new int[] {300, 400}) {\n      io.execute(() -> {               // việc chờ vào ra\n        try { Thread.sleep(ms); } catch (InterruptedException\
      \ e) { }\n        xong.add(\"chờ \" + ms); het.countDown();\n      });\n    }\n    cpu.execute(() -> { xong.add(\"tính\"); het.countDown();\
      \ });\n    het.await();\n    System.out.println(xong);\n  }\n  public static void main(String[] a) throws Exception {\n    ExecutorService\
      \ chung = Executors.newFixedThreadPool(2);\n    ExecutorService rieng = Executors.newFixedThreadPool(2);\n    thu(chung, chung);       \
      \          // một bể cho cả hai loại việc\n    thu(chung, rieng);                 // tách bể cho việc tính\n    chung.shutdown(); rieng.shutdown();\n\
      \  }\n}\n"
    reason: Tệp DungChung.java đầy đủ (hằng J_SHARED ở audit/bnx/src/l16.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - 'dùng chung bể: việc tính chỉ xong sau việc chờ 300'
    - 'tách bể: việc tính xong trước tiên'
    expect_stdout: '[chờ 300, tính, chờ 400]

      [tính, chờ 300, chờ 400]

      '
    timeout: 120
