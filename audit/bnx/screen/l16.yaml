sources:
  L16_be_luong:
    lang: java
    java_class: BeLuong
    timeout: 120
    reason: 'be_luong: chạy nguyên văn.'
    claims:
    - 10 việc chỉ dùng đúng 4 luồng
    - tổng các bình phương từ 1 tới 10 là 385
    - số lượt là 3
    expect_stdout: 'số luồng đã dùng: 4

      tổng 10 kết quả: 385

      số lượt: 3'
    code: "import java.util.*;\nimport java.util.concurrent.*;\npublic class BeLuong {\n  public static void main(String[] a) throws Exception {\n    ExecutorService be = Executors.newFixedThreadPool(4);\n\
      \    Set<String> luong = ConcurrentHashMap.newKeySet();\n    List<Future<Integer>> hen = new ArrayList<>();\n    for (int i = 1; i <= 10; i++) {\n      int so = i;\n      hen.add(be.submit(() -> {\n\
      \        Thread.sleep(100);               // mỗi việc chờ 100 ms\n        luong.add(Thread.currentThread().getName());\n        return so * so;\n      }));\n    }\n    int tong = 0;\n    for (Future<Integer>\
      \ h : hen) tong += h.get();  // chờ kết quả\n    be.shutdown();\n    System.out.println(\"số luồng đã dùng: \" + luong.size());\n    System.out.println(\"tổng 10 kết quả: \" + tong);\n    System.out.println(\"\
      số lượt: \" + (10 + 4 - 1) / 4);\n  }\n}"
  L16_hang_doi:
    lang: java
    java_class: HangDoi
    timeout: 120
    reason: 'hang_doi: chạy nguyên văn.'
    claims:
    - bể 4 luồng + hàng 2 chỗ nhận 6 việc, từ chối 4
    expect_stdout: 'số luồng: 4

      trong hàng đợi: 2

      nhận 6, từ chối 4'
    code: "import java.util.concurrent.*;\npublic class HangDoi {\n  public static void main(String[] a) {\n    CountDownLatch cua = new CountDownLatch(1);  // giữ việc lại\n    ThreadPoolExecutor be =\
      \ new ThreadPoolExecutor(4, 4, 0,\n        TimeUnit.SECONDS, new ArrayBlockingQueue<>(2));\n    int nhan = 0, tuChoi = 0;\n    for (int i = 1; i <= 10; i++) {\n      try {\n        be.execute(() ->\
      \ {\n          try { cua.await(); } catch (InterruptedException e) { }\n        });\n        nhan++;\n      } catch (RejectedExecutionException e) { tuChoi++; }\n    }\n    System.out.println(\"số\
      \ luồng: \" + be.getPoolSize());\n    System.out.println(\"trong hàng đợi: \" + be.getQueue().size());\n    System.out.println(\"nhận \" + nhan + \", từ chối \" + tuChoi);\n    cua.countDown();\n\
      \    be.shutdown();\n  }\n}"
  L16_ghep_loi_goi:
    lang: java
    java_class: GhepLoiGoi
    timeout: 120
    reason: 'ghep_loi_goi: chạy nguyên văn.'
    claims:
    - thứ tự xong số dư, hạn mức, điểm; khả dụng 800; chờ dưới 900 ms
    expect_stdout: 'thứ tự xong: [số dư, hạn mức, điểm]

      khả dụng: 800

      điểm: 700

      chờ dưới 900 ms: true'
    code: "import java.util.*;\nimport java.util.concurrent.*;\nimport static java.util.concurrent.CompletableFuture.*;\npublic class GhepLoiGoi {\n  static Queue<String> xong = new ConcurrentLinkedQueue<>();\n\
      \  static CountDownLatch xuat = new CountDownLatch(1); // chốt\n  static final int K = 4;      // thời gian ×4 cho ổn định\n  static int goi(String ten, int ms, int giaTri) {\n    try { xuat.await();\
      \ Thread.sleep(ms * K); }\n    catch (InterruptedException e) { }\n    xong.add(ten);                     // ghi lại thứ tự xong\n    return giaTri;\n  }\n  public static void main(String[] a) {\n\
      \    ExecutorService be = Executors.newFixedThreadPool(3);\n    var diem = supplyAsync(() -> goi(\"điểm\", 400, 700), be);\n    var soDu = supplyAsync(() -> goi(\"số dư\", 200, 500), be);\n    var\
      \ hanMuc = supplyAsync(() -> goi(\"hạn mức\", 300, 300), be);\n    var khaDung = soDu.thenCombine(hanMuc, (x, y) -> x + y);\n    long t0 = System.nanoTime();\n    xuat.countDown();               \
      \   // cả ba cùng xuất phát\n    allOf(diem, khaDung).join();       // chờ cả ba lời gọi\n    long ms = (System.nanoTime() - t0) / 1_000_000 / K;\n    System.out.println(\"thứ tự xong: \" + xong);\n\
      \    System.out.println(\"khả dụng: \" + khaDung.join());\n    System.out.println(\"điểm: \" + diem.join());\n    System.out.println(\"chờ dưới 900 ms: \" + (ms < 900));\n    be.shutdown();\n  }\n\
      }"
  L16_chia_doi:
    lang: java
    java_class: ChiaDoi
    timeout: 120
    reason: 'chia_doi: chạy nguyên văn.'
    claims:
    - tổng 500000500000 và 128 việc lá
    expect_stdout: 'tổng: 500000500000

      số việc lá: 128'
    code: "import java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\npublic class ChiaDoi extends RecursiveTask<Long> {\n  static final int NGUONG = 10_000;\n  static AtomicInteger la = new\
      \ AtomicInteger();\n  final int tu, den;                   // cộng các số từ tu tới den\n  ChiaDoi(int tu, int den) { this.tu = tu; this.den = den; }\n  protected Long compute() {\n    if (den - tu\
      \ + 1 <= NGUONG) {      // đủ nhỏ: tự cộng, là việc lá\n      la.incrementAndGet();\n      long s = 0;\n      for (int i = tu; i <= den; i++) s += i;\n      return s;\n    }\n    int giua = (tu +\
      \ den) / 2;\n    ChiaDoi trai = new ChiaDoi(tu, giua);\n    ChiaDoi phai = new ChiaDoi(giua + 1, den);\n    trai.fork();                       // đẩy nửa trái vào hàng việc\n    return phai.compute()\
      \ + trai.join();  // tự làm nửa phải\n  }\n  public static void main(String[] a) {\n    ForkJoinPool be = new ForkJoinPool(4);\n    long tong = be.invoke(new ChiaDoi(1, 1_000_000));\n    System.out.println(\"\
      tổng: \" + tong);\n    System.out.println(\"số việc lá: \" + la.get());\n  }\n}"
  L16_dung_chung:
    lang: java
    java_class: DungChung
    timeout: 120
    reason: 'dung_chung: chạy nguyên văn.'
    claims:
    - 'dùng chung một bể: việc tính xong sau việc chờ 300; tách bể: xong trước'
    expect_stdout: '[chờ 300, tính, chờ 400]

      [tính, chờ 300, chờ 400]'
    code: "import java.util.*;\nimport java.util.concurrent.*;\npublic class DungChung {\n  static void thu(Executor io, Executor cpu) throws Exception {\n    List<String> xong = new CopyOnWriteArrayList<>();\n\
      \    CountDownLatch het = new CountDownLatch(3);\n    for (int ms : new int[] {300, 400}) {\n      io.execute(() -> {               // việc chờ vào ra\n        try { Thread.sleep(4*ms); } catch (InterruptedException\
      \ e) { }\n        xong.add(\"chờ \" + ms); het.countDown();\n      });\n    }\n    cpu.execute(() -> { xong.add(\"tính\"); het.countDown(); });\n    het.await();\n    System.out.println(xong);\n \
      \ }\n  public static void main(String[] a) throws Exception {\n    ExecutorService chung = Executors.newFixedThreadPool(2);\n    ExecutorService rieng = Executors.newFixedThreadPool(2);\n    thu(chung,\
      \ chung);                 // một bể cho cả hai loại việc\n    thu(chung, rieng);                 // tách bể cho việc tính\n    chung.shutdown(); rieng.shutdown();\n  }\n}"
  L16_kiem_lai:
    lang: java
    java_class: KiemLai
    timeout: 120
    reason: 'kiem_lai: chạy nguyên văn.'
    claims:
    - vòng lặp một luồng ra 500000500000 và 128 lá
    expect_stdout: 'vòng lặp: 500000500000

      số việc lá: 128'
    code: "public class KiemLai {\n  static int la(int n) {               // đếm việc lá theo số phần tử\n    return n <= 10_000 ? 1 : la(n - n / 2) + la(n / 2);\n  }\n  public static void main(String[]\
      \ a) {\n    long s = 0;\n    for (int i = 1; i <= 1_000_000; i++) s += i;   // một luồng\n    System.out.println(\"vòng lặp: \" + s);\n    System.out.println(\"số việc lá: \" + la(1_000_000));\n \
      \ }\n}"
  L16_HangQuyMo:
    lang: java
    java_class: HangQuyMo
    timeout: 120
    reason: 'HangQuyMo: chạy nguyên văn.'
    claims:
    - 'bể 4 luồng, hàng không giới hạn: 6, 996, 99 996 việc nằm chờ ở 10, 1 000, 100 000 việc'
    - 'bể 4 luồng, hàng 2 chỗ: nhận 6 việc, từ chối 4, 994, 99 994'
    expect_stdout: '10 viec, hang vo han: trong hang 6, tu choi 0

      10 viec, hang 2 cho: trong hang 2, tu choi 4

      1000 viec, hang vo han: trong hang 996, tu choi 0

      1000 viec, hang 2 cho: trong hang 2, tu choi 994

      100000 viec, hang vo han: trong hang 99996, tu choi 0

      100000 viec, hang 2 cho: trong hang 2, tu choi 99994'
    code: "import java.util.concurrent.*;\npublic class HangQuyMo {\n  static void thu(int n, int cho) {\n    CountDownLatch cua = new CountDownLatch(1);   // giữ việc lại\n    BlockingQueue<Runnable> q\
      \ = cho < 0 ? new LinkedBlockingQueue<>()\n        : new ArrayBlockingQueue<>(cho);\n    ThreadPoolExecutor be = new ThreadPoolExecutor(4, 4, 0,\n        TimeUnit.SECONDS, q);\n    int tuChoi = 0;\n\
      \    for (int i = 0; i < n; i++) {\n      try {\n        be.execute(() -> {\n          try { cua.await(); } catch (InterruptedException e) { }\n        });\n      } catch (RejectedExecutionException\
      \ e) { tuChoi++; }\n    }\n    System.out.println(n + \" viec, hang \" + (cho < 0 ? \"vo han\"\n        : cho + \" cho\") + \": trong hang \" + be.getQueue().size()\n        + \", tu choi \" + tuChoi);\n\
      \    cua.countDown();\n    be.shutdown();\n  }\n  public static void main(String[] a) {\n    for (int n : new int[] {10, 1000, 100000}) {\n      thu(n, -1);\n      thu(n, 2);\n    }\n  }\n}"
  LAB_L16:
    lang: java
    java_class: Lab
    expect_stdout: 'so luong: 3

      trong hang doi: 5

      nhan 8, tu choi 6

      so luot cho 14 viec: 5

      so viec la: 32'
    code: "import java.util.concurrent.*;\n\npublic class Lab {\n    static int la(int n) {\n        return n <= 5000 ? 1 : la(n - n / 2) + la(n / 2);\n    }\n\n    public static void main(String[] args)\
      \ {\n        CountDownLatch cua = new CountDownLatch(1);\n        ThreadPoolExecutor be = new ThreadPoolExecutor(3, 3, 0,\n                TimeUnit.SECONDS, new ArrayBlockingQueue<>(5));\n       \
      \ int nhan = 0, tuChoi = 0;\n        for (int i = 1; i <= 14; i++) {\n            try {\n                be.execute(() -> {\n                    try { cua.await(); } catch (InterruptedException e)\
      \ { }\n                });\n                nhan++;\n            } catch (RejectedExecutionException e) {\n                tuChoi++;\n            }\n        }\n        System.out.println(\"so luong:\
      \ \" + be.getPoolSize());\n        System.out.println(\"trong hang doi: \" + be.getQueue().size());\n        System.out.println(\"nhan \" + nhan + \", tu choi \" + tuChoi);\n        System.out.println(\"\
      so luot cho 14 viec: \" + (14 + 3 - 1) / 3);\n        System.out.println(\"so viec la: \" + la(100000));\n        cua.countDown();\n        be.shutdown();\n    }\n}"
