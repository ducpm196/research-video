sources:
  L10_Compact:
    lang: python
    timeout: 120
    reason: 'Compact: chạy nguyên văn.'
    claims:
    - đầu ra thật của Compact
    expect_stdout: '8 -> [(5, ''A'', 120), (6, ''C'', 75), (7, ''B'', 260)]

      9 -> [(5, ''A'', 120), (7, ''B'', 260)]'
    unverified_claims:
    - Mô hình bỏ hẳn khoá có bia mộ = trạng thái SAU delete.retention.ms; ngay sau lần nén, Kafka thật còn giữ bia mộ (đã thấy thật ở khối BNX L10 check 2 0). Thời điểm Kafka thật dọn bia mộ KHÔNG kiểm
      (phụ thuộc lần nén sau, không tất định).
    code: "log = [(\"A\", 100), (\"B\", 200), (\"A\", 150), (\"C\", 50),\n       (\"B\", 180), (\"A\", 120), (\"C\", 75), (\"B\", 260)]\ndef compact(log):\n    last = {}\n    for off, (key, val) in enumerate(log):\n\
      \        last[key] = (off, val)        # bản sau đè bản trước\n    return sorted((off, k, v) for k, (off, v) in last.items()\n                  if v is not None)   # bia mộ: khoá biến mất\nprint(len(log),\
      \ \"->\", compact(log))\nlog.append((\"C\", None))               # bia mộ cho C\nprint(len(log), \"->\", compact(log))"
  L10_Schema:
    lang: python
    timeout: 120
    reason: 'Schema: chạy nguyên văn.'
    claims:
    - đầu ra thật của Schema
    expect_stdout: 'v2: (True, [])

      v3: (False, [''fee''])'
    unverified_claims:
    - 'Phép kiểm là GIẢN LƯỢC quy tắc BACKWARD của Confluent Schema Registry (Platform 8.4 ''Schema Evolution and Compatibility'': bên đọc mới đọc được dữ liệu cũ; thêm trường phải có mặc định, bỏ trường
      được). Không chạy Schema Registry thật.'
    code: "v1 = {\"account\": False, \"amount\": False}  # trường: có mặc định?\nv2 = {**v1, \"channel\": True}              # thêm trường có mặc định\nv3 = {**v1, \"fee\": False}                 # thêm\
      \ trường không mặc định\ndef backward_ok(new, old):\n    # bên đọc dùng lược đồ mới có đọc được dữ liệu cũ không?\n    bad = [f for f, has_default in new.items()\n           if f not in old and not\
      \ has_default]\n    return len(bad) == 0, bad\nprint(\"v2:\", backward_ok(v2, v1))\nprint(\"v3:\", backward_ok(v3, v1))"
  L10_Topic:
    lang: python
    timeout: 120
    reason: 'Topic: chạy nguyên văn.'
    claims:
    - đầu ra thật của Topic
    expect_stdout: 'payment.*.napas True

      payment.# True

      payment.* False'
    unverified_claims:
    - Hàm match tái hiện luật sàn topic; audit/bnx/ver/l10.py đối chiếu đủ 9 ví dụ của RabbitMQ tutorial 5 bằng chính hàm này. Không chạy RabbitMQ thật (máy không có ảnh RabbitMQ).
    code: "def match(pattern, key):\n    p, k = pattern.split(\".\"), key.split(\".\")\n    def m(i, j):\n        if i == len(p):\n            return j == len(k)\n        if p[i] == \"#\":             \
      \          # không hoặc nhiều từ\n            return any(m(i + 1, t) for t in range(j, len(k) + 1))\n        ok = j < len(k) and p[i] in (\"*\", k[j])   # * đúng một từ\n        return ok and m(i\
      \ + 1, j + 1)\n    return m(0, 0)\nfor pat in [\"payment.*.napas\", \"payment.#\", \"payment.*\"]:\n    print(pat, match(pat, \"payment.vn.napas\"))"
  L10_Check:
    lang: python
    timeout: 120
    reason: 'Check: chạy nguyên văn.'
    claims:
    - đầu ra thật của Check
    expect_stdout: 3 2
    code: "def compact_back(log):\n    seen, kept = set(), []\n    for off in range(len(log) - 1, -1, -1):   # đi ngược từ cuối\n        key, val = log[off]\n        if key not in seen:\n            seen.add(key)\n\
      \            if val is not None:\n                kept.append((off, key, val))\n    return sorted(kept)\nlog = [(\"A\", 100), (\"B\", 200), (\"A\", 150), (\"C\", 50),\n       (\"B\", 180), (\"A\"\
      , 120), (\"C\", 75), (\"B\", 260)]\nprint(len(compact_back(log)), len(compact_back(log + [(\"C\", None)])))"
  L10_Scale:
    lang: python
    timeout: 300
    reason: 'Scale: chạy nguyên văn.'
    claims:
    - đầu ra thật của Scale
    expect_stdout: '8 -> [(5, ''A'', 120), (6, ''C'', 75), (7, ''B'', 260)]

      9 -> [(5, ''A'', 120), (7, ''B'', 260)]

      1000 ban ghi, 100 tai khoan: doc lai 1000 | sau nen 100

      100000 ban ghi, 100 tai khoan: doc lai 100000 | sau nen 100

      1000000 ban ghi, 100 tai khoan: doc lai 1000000 | sau nen 100'
    code: "log = [(\"A\", 100), (\"B\", 200), (\"A\", 150), (\"C\", 50),\n       (\"B\", 180), (\"A\", 120), (\"C\", 75), (\"B\", 260)]\ndef compact(log):\n    last = {}\n    for off, (key, val) in enumerate(log):\n\
      \        last[key] = (off, val)        # bản sau đè bản trước\n    return sorted((off, k, v) for k, (off, v) in last.items()\n                  if v is not None)   # bia mộ: khoá biến mất\nprint(len(log),\
      \ \"->\", compact(log))\nlog.append((\"C\", None))               # bia mộ cho C\nprint(len(log), \"->\", compact(log))\nfor n in (1000, 100000, 1000000):\n    log = [(f\"TK{i % 100}\", i) for i in\
      \ range(n)]\n    con = compact(log)\n    print(n, \"ban ghi, 100 tai khoan: doc lai\", n,\n          \"| sau nen\", len(con))"
  L10_Lab:
    lang: python
    timeout: 120
    reason: 'Lab: chạy nguyên văn.'
    claims:
    - đầu ra thật của Lab
    expect_stdout: 'con bia mo: 4:N:- 5:M:12 6:Q:7 7:P:9

      het han bia mo: 5:M:12 6:Q:7 7:P:9

      payment.eu.sepa.eur voi payment.*.sepa: khong

      payment.eu.sepa.eur voi payment.#.eur: co

      payment.eu.sepa.eur voi *.eu.#: co'
    code: "log = [(\"M\", 10), (\"N\", 20), (\"M\", 15), (\"P\", 5),\n       (\"N\", None), (\"M\", 12), (\"Q\", 7), (\"P\", 9)]\ndef nen(log, giu_bia_mo):\n    cuoi = {}\n    for off, (k, v) in enumerate(log):\n\
      \        cuoi[k] = (off, v)\n    return sorted((off, k, v) for k, (off, v) in cuoi.items()\n                  if giu_bia_mo or v is not None)\ndef hien(ds):\n    return \" \".join(f\"{o}:{k}:{'-'\
      \ if v is None else v}\" for o, k, v in ds)\nprint(\"con bia mo:\", hien(nen(log, True)))\nprint(\"het han bia mo:\", hien(nen(log, False)))\ndef khop(mau, khoa):\n    p, k = mau.split(\".\"), khoa.split(\"\
      .\")\n    def m(i, j):\n        if i == len(p):\n            return j == len(k)\n        if p[i] == \"#\":\n            return any(m(i + 1, t) for t in range(j, len(k) + 1))\n        return j < len(k)\
      \ and p[i] in (\"*\", k[j]) and m(i + 1, j + 1)\n    return m(0, 0)\nfor mau in [\"payment.*.sepa\", \"payment.#.eur\", \"*.eu.#\"]:\n    ket_qua = \"co\" if khop(mau, \"payment.eu.sepa.eur\") else\
      \ \"khong\"\n    print(\"payment.eu.sepa.eur voi \" + mau + \":\", ket_qua)"
  LAB_L10:
    lang: python
    expect_stdout: 'con bia mo: 4:N:- 5:M:12 6:Q:7 7:P:9

      het han bia mo: 5:M:12 6:Q:7 7:P:9

      payment.eu.sepa.eur voi payment.*.sepa: khong

      payment.eu.sepa.eur voi payment.#.eur: co

      payment.eu.sepa.eur voi *.eu.#: co'
    code: "log = [(\"M\", 10), (\"N\", 20), (\"M\", 15), (\"P\", 5),\n       (\"N\", None), (\"M\", 12), (\"Q\", 7), (\"P\", 9)]\ndef nen(log, giu_bia_mo):\n    cuoi = {}\n    for off, (k, v) in enumerate(log):\n\
      \        cuoi[k] = (off, v)\n    return sorted((off, k, v) for k, (off, v) in cuoi.items()\n                  if giu_bia_mo or v is not None)\ndef hien(ds):\n    return \" \".join(f\"{o}:{k}:{'-'\
      \ if v is None else v}\" for o, k, v in ds)\nprint(\"con bia mo:\", hien(nen(log, True)))\nprint(\"het han bia mo:\", hien(nen(log, False)))\ndef khop(mau, khoa):\n    p, k = mau.split(\".\"), khoa.split(\"\
      .\")\n    def m(i, j):\n        if i == len(p):\n            return j == len(k)\n        if p[i] == \"#\":\n            return any(m(i + 1, t) for t in range(j, len(k) + 1))\n        return j < len(k)\
      \ and p[i] in (\"*\", k[j]) and m(i + 1, j + 1)\n    return m(0, 0)\nfor mau in [\"payment.*.sepa\", \"payment.#.eur\", \"*.eu.#\"]:\n    ket_qua = \"co\" if khop(mau, \"payment.eu.sepa.eur\") else\
      \ \"khong\"\n    print(\"payment.eu.sepa.eur voi \" + mau + \":\", ket_qua)"
