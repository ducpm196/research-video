sources:
  L08_Inv:
    lang: python
    timeout: 120
    reason: 'Inv: chạy nguyên văn.'
    claims:
    - đầu ra thật của Inv
    expect_stdout: 'tiền [''d1'', ''d2'', ''d3'', ''d4'']

      chuyển [''d1'', ''d3'']

      napas [''d1'']

      chuyển và napas: [''d1'']'
    code: "docs = {\"d1\": \"chuyển tiền napas\", \"d2\": \"nạp tiền ví\",\n        \"d3\": \"chuyển tiền quốc tế\", \"d4\": \"rút tiền atm\"}\nindex = {}\nfor doc_id, text in docs.items():\n    for word\
      \ in text.split():\n        index.setdefault(word, set()).add(doc_id)\nfor word in [\"tiền\", \"chuyển\", \"napas\"]:\n    print(word, sorted(index[word]))\nboth = index[\"chuyển\"] & index[\"napas\"\
      ]\nprint(\"chuyển và napas:\", sorted(both))"
  L08_Route:
    lang: python
    timeout: 120
    reason: 'Route: chạy nguyên văn.'
    claims:
    - đầu ra thật của Route
    expect_stdout: 'h = 17: 2 -> 1

      giữ mảnh: [0, 1, 2] 3 / 12'
    code: "def shard(h, n_primary):\n    return h % n_primary      # mảnh = băm mod số mảnh chính\nprint(\"h = 17:\", shard(17, 3), \"->\", shard(17, 4))\nsame = [h for h in range(12) if shard(h, 3) ==\
      \ shard(h, 4)]\nprint(\"giữ mảnh:\", same, len(same), \"/ 12\")"
  L08_Crc:
    lang: python
    timeout: 120
    reason: 'Crc: chạy nguyên văn.'
    claims:
    - đầu ra thật của Crc
    expect_stdout: '315 / 1200 = 0.263

      tách 3 -> 6, mảnh mới nằm trong mảnh cũ: True'
    code: "import zlib\ndef shard(doc_id, n):         # băm minh hoạ: CRC32\n    return zlib.crc32(doc_id.encode()) % n\nids = [f\"tx{i}\" for i in range(1, 1201)]\nstay = sum(shard(d, 3) == shard(d, 4)\
      \ for d in ids)\nprint(stay, \"/\", len(ids), \"=\", round(stay / len(ids), 3))\nsplit = all(shard(d, 6) % 3 == shard(d, 3) for d in ids)\nprint(\"tách 3 -> 6, mảnh mới nằm trong mảnh cũ:\", split)"
  L08_Refresh:
    lang: python
    timeout: 120
    reason: 'Refresh: chạy nguyên văn.'
    claims:
    - đầu ra thật của Refresh
    expect_stdout: 'ngay sau khi ghi: []

      sau lần làm tươi: [''chuyển tiền napas'']'
    code: "buffer, searchable = [], []\ndef write(doc):\n    buffer.append(doc)\ndef refresh():                # mặc định mỗi 1 giây\n    searchable.extend(buffer)\n    buffer.clear()\ndef search(word):\n\
      \    return [d for d in searchable if word in d.split()]\nwrite(\"chuyển tiền napas\")\nprint(\"ngay sau khi ghi:\", search(\"napas\"))\nrefresh()\nprint(\"sau lần làm tươi:\", search(\"napas\"))"
  L08_QmSearch:
    lang: python
    timeout: 300
    reason: 'QmSearch: chạy nguyên văn.'
    claims:
    - đầu ra thật của QmSearch
    expect_stdout: '1200 mo ta: quet doc 1200 mo ta, chi muc doc 2 dong

      120000 mo ta: quet doc 120000 mo ta, chi muc doc 120 dong

      1200000 mo ta: quet doc 1200000 mo ta, chi muc doc 1200 dong'
    code: "for n in (1200, 120000, 1200000):\n    mo_ta = [(\"chuyen tien napas\" if i % 1000 == 0\n              else \"chuyen tien the\") for i in range(n)]\n    chi_muc = {}\n    for i, m in enumerate(mo_ta):\n\
      \        for tu in m.split():\n            chi_muc.setdefault(tu, []).append(i)\n    print(n, \"mo ta: quet doc\", n, \"mo ta, chi muc doc\",\n          len(chi_muc[\"napas\"]), \"dong\")"
  L08_QmRoute:
    lang: python
    timeout: 300
    reason: 'QmRoute: chạy nguyên văn.'
    claims:
    - đầu ra thật của QmRoute
    expect_stdout: '1200 ban ghi: doi 3 -> 4 manh 885 = 74 %

      120000 ban ghi: doi 3 -> 4 manh 89991 = 75 %

      1200000 ban ghi: doi 3 -> 4 manh 899480 = 75 %'
    code: "import zlib\ndef manh(i, n):\n    return zlib.crc32(f\"tx{i}\".encode()) % n\nfor n in (1200, 120000, 1200000):\n    doi = sum(manh(i, 3) != manh(i, 4) for i in range(n))\n    print(n, \"ban\
      \ ghi: doi 3 -> 4 manh\", doi, \"=\", round(100 * doi / n), \"%\")"
  LAB_L08:
    lang: python
    expect_stdout: 'tien: a1 a2 a4

      the: a2 a4

      chuyen: a2 a3

      chuyen va the: a2

      manh cua 29, 41, 50 voi 5 manh chinh: 4 1 0

      doi 4 -> 6 manh chinh: giu manh 4 / 12'
    code: "docs = {\"a1\": \"rut tien atm\", \"a2\": \"chuyen tien the\",\n        \"a3\": \"chuyen khoan napas\", \"a4\": \"nap tien the\"}\nchi_muc = {}\nfor ma, mo_ta in docs.items():\n    for tu in\
      \ mo_ta.split():\n        chi_muc.setdefault(tu, set()).add(ma)\nfor tu in [\"tien\", \"the\", \"chuyen\"]:\n    print(tu + \":\", *sorted(chi_muc[tu]))\nprint(\"chuyen va the:\", *sorted(chi_muc[\"\
      chuyen\"] & chi_muc[\"the\"]))\nprint(\"manh cua 29, 41, 50 voi 5 manh chinh:\", *[h % 5 for h in (29, 41, 50)])\ngiu = sum(h % 4 == h % 6 for h in range(12))\nprint(\"doi 4 -> 6 manh chinh: giu manh\"\
      , giu, \"/ 12\")"
