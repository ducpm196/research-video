  "BNX L21 formula 4 0":
    sha: 5c4eba5d9627b8b2
    kind: run
    lang: python
    claims:
      - "nhóm nợ từ hai trở lên thì chuyển cho người xét; tỉ lệ vượt ngưỡng hoặc điểm dưới ngưỡng thì từ chối, còn lại là duyệt"
      - "phép so tỉ lệ dùng nhân chéo: hồ sơ 50,95% không bị cho qua"
    post: |
      assert tham_dinh(20_000_000, 4_000_000, 5_000_000, 1, 36) == (45.0, 80, "DUYET")
      assert tham_dinh(20_000_000, 4_000_000, 6_190_000, 1, 36)[2] == "TU_CHOI"
      assert tham_dinh(20_000_000, 4_000_000, 6_000_000, 1, 36)[2] == "DUYET"
      assert tham_dinh(20_000_000, 0, 1_000_000, 3, 36)[2] == "XET_TAY"
      assert tham_dinh(12_000_000, 0, 1_000_000, 1, 12)[1:] == (55, "TU_CHOI")
    unverified_claims:
      - "ngưỡng 50%, 70 điểm và trọng số 35/25/20 là số minh hoạ của bài (ghi trên màn hình), không đối chiếu chính sách của tổ chức nào"
