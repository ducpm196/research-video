  "BNX L21 formula 6 0":
    sha: 1d96ce39e9802b9a
    kind: run
    lang: bash
    timeout: 120
    claims:
      - "lần kiểm thứ nhất trên tệp gốc báo hợp lệ; lần thứ hai trên tệp đã sửa một ký tự báo thất bại; lần thứ ba kiểm bản sao mang tên khác vẫn hợp lệ"
    expect_stdout: |
      Verified OK
      Verification failure
      Verified OK
    post: |
      cmp -s hd.txt ten_khac.txt && test "$(cmp -l hd.txt hd_sua.txt | wc -l)" -eq 1 && test "$(wc -c < hd.sig)" -eq 256
    note: "Git Bash + OpenSSL 3.5.5 (mingw64). Cặp khoá RSA 2048 sinh mới mỗi lần chạy nên chữ ký khác nhau từng lần; ba dòng kết quả kiểm thì cố định. Lần kiểm thất bại còn in hai dòng lỗi ra stderr (không hiện trên màn hình). Mã thoát của khối = của lệnh cuối = 0."
    unverified_claims:
      - "“với ký số từ xa, khoá riêng nằm ở nơi cấp chứng thư, người ký xác nhận từng lần ký, ví dụ bằng mã OTP” (hình SVG 2): mô tả khái quát theo bài ACB L08 trong kho; không chạy được dịch vụ ký số từ xa thật trên máy, không đối chiếu quy trình của nhà cung cấp nào"
      - "bài không trích điều khoản nào của Luật Giao dịch điện tử 2023 (chưa mở văn bản gốc); chỉ dạy cơ chế chữ ký trên mã băm của nội dung"
