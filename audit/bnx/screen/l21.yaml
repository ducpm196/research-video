sources:
  L21_QuyMo:
    lang: python
    timeout: 120
    reason: 'QuyMo: chạy nguyên văn.'
    claims:
    - 'luật gắn cờ từ 3 giấy tờ trên cùng dấu vân tay: 0 hồ sơ bị gắn cờ ở 5 hồ sơ, 500 ở 500 hồ sơ, 50 000 ở 50 000 hồ sơ (chỉ 24 mã)'
    expect_stdout: '5 ho so, 5 ma khac nhau, 0 ho so bi gan co

      500 ho so, 24 ma khac nhau, 500 ho so bi gan co

      50000 ho so, 24 ma khac nhau, 50000 ho so bi gan co'
    code: "import hashlib\ndef dau_van_tay(may):\n    chuoi = \"|\".join(may[k] for k in sorted(may))\n    return hashlib.sha256(chuoi.encode()).hexdigest()[:12]\nHE = [\"Android 13\", \"Android 14\", \"\
      iOS 17\", \"iOS 18\"]\nMAN = [\"720x1600\", \"1080x2400\", \"1170x2532\", \"1290x2796\", \"1440x3200\", \"1080x1920\"]\ndef ho_so(i):\n    h = int(hashlib.sha256(f\"hs{i}\".encode()).hexdigest(),\
      \ 16)\n    return {\"he\": HE[h % 4], \"man\": MAN[h // 4 % 6], \"mui\": \"UTC+7\"}\nfor n in (5, 500, 50_000):\n    dem = {}\n    for i in range(n):\n        dem.setdefault(dau_van_tay(ho_so(i)),\
      \ set()).add(f\"CCCD {i}\")\n    co = sum(len(v) for v in dem.values() if len(v) >= 3)\n    print(n, \"ho so,\", len(dem), \"ma khac nhau,\", co, \"ho so bi gan co\")"
  L21_LabL21:
    lang: python
    timeout: 120
    reason: 'LabL21: chạy nguyên văn.'
    claims:
    - đầu ra thật của LabL21
    expect_stdout: 'DTI: 42.9 %

      Diem: 65

      Quyet dinh: TU_CHOI

      Ma bam goc: ab9bd3255a16

      Vi tri khac: 60'
    code: 'import hashlib

      thu, dang, moi = 14_000_000, 3_000_000, 3_000_000

      dti = (dang + moi) * 100 / thu

      diem = (35 if thu >= 15_000_000 else 20) + 25 + 20

      kq = "TU_CHOI" if (dang + moi) * 100 > 50 * thu or diem < 70 else "DUYET"

      hd = "Hop dong vay 14000000 dong, ky han 24 thang\n"

      sua = hd.replace("24", "25")

      a = hashlib.sha256(hd.encode()).hexdigest()

      b = hashlib.sha256(sua.encode()).hexdigest()

      print(f"DTI: {dti:.1f} %")

      print("Diem:", diem)

      print("Quyet dinh:", kq)

      print("Ma bam goc:", a[:12])

      print("Vi tri khac:", sum(x != y for x, y in zip(a, b)))'
  LAB_L21:
    lang: python
    expect_stdout: 'DTI: 42.9 %

      Diem: 65

      Quyet dinh: TU_CHOI

      Ma bam goc: ab9bd3255a16

      Vi tri khac: 60'
    code: 'import hashlib

      thu, dang, moi = 14_000_000, 3_000_000, 3_000_000

      dti = (dang + moi) * 100 / thu

      diem = (35 if thu >= 15_000_000 else 20) + 25 + 20

      kq = "TU_CHOI" if (dang + moi) * 100 > 50 * thu or diem < 70 else "DUYET"

      hd = "Hop dong vay 14000000 dong, ky han 24 thang\n"

      sua = hd.replace("24", "25")

      a = hashlib.sha256(hd.encode()).hexdigest()

      b = hashlib.sha256(sua.encode()).hexdigest()

      print(f"DTI: {dti:.1f} %")

      print("Diem:", diem)

      print("Quyet dinh:", kq)

      print("Ma bam goc:", a[:12])

      print("Vi tri khac:", sum(x != y for x, y in zip(a, b)))'
