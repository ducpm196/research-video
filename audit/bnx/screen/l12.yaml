sources:
  L12_Limit:
    lang: python
    timeout: 120
    reason: 'Limit: chạy nguyên văn.'
    claims:
    - 'bước 5: ba giao dịch đầu được chấp nhận, tổng chạy lên 95 triệu; giao dịch thứ tư 10 triệu bị từ chối vì 95 + 10 = 105 triệu vượt hạn mức 100 triệu'
    expect_stdout: 'chap nhan 30000000 da dung 30000000

      chap nhan 45000000 da dung 75000000

      chap nhan 20000000 da dung 95000000

      tu choi 10000000 da dung 95000000'
    unverified_claims:
    - 'con số 100 000 000 đồng/tháng theo Thông tư 40/2024/TT-NHNN: bản hợp nhất 76/VBHN-NHNN (audit/legal/registry.yaml, CITED LF2); chú thích trên mã và bảng văn bản ghi kiểm lại văn bản hiện hành; loại
      giao dịch nào tính vào hạn mức không kiểm bằng máy'
    code: "HAN_MUC = 100_000_000   # theo Thông tư 40/2024; kiểm lại văn bản\ngiao_dich = [30_000_000, 45_000_000, 20_000_000, 10_000_000]\nda_dung = 0\nfor so_tien in giao_dich:\n    if da_dung + so_tien\
      \ > HAN_MUC:\n        print(\"tu choi\", so_tien, \"da dung\", da_dung)\n    else:\n        da_dung += so_tien\n        print(\"chap nhan\", so_tien, \"da dung\", da_dung)"
  L12_Replay:
    lang: python
    timeout: 120
    reason: 'Replay: chạy nguyên văn.'
    claims:
    - 'chạy lại nhật ký: ví A 1 200 000, ví B 300 000, ví C 500 000, tổng 2 000 000, tài khoản đảm bảo 2 000 000 — khớp tính tay (phép ③, ④)'
    expect_stdout: '{''A'': 1200000, ''B'': 300000, ''C'': 500000} tong vi 2000000 dam bao 2000000'
    code: "bao_dam, vi = 500_000, {\"A\": 0, \"B\": 0, \"C\": 500_000}\nnhat_ky = [(\"nap\", \"A\", 2_000_000), (\"chuyen\", \"A\", \"B\", 800_000),\n           (\"rut\", \"B\", 500_000)]\nfor g in nhat_ky:\n\
      \    if g[0] == \"chuyen\":\n        vi[g[1]] -= g[3]\n        vi[g[2]] += g[3]\n    else:\n        dau = 1 if g[0] == \"nap\" else -1\n        vi[g[1]] += dau * g[2]\n        bao_dam += dau * g[2]\n\
      print(vi, \"tong vi\", sum(vi.values()), \"dam bao\", bao_dam)"
  L12_Tax:
    lang: python
    timeout: 120
    reason: 'Tax: chạy nguyên văn.'
    claims:
    - 'bước 6: máy báo R2 chưa sang phía Kho bạc nên ngân hàng chưa xong việc, phải tra soát; R1 và R3 khớp'
    expect_stdout: 'R1 khop

      R2 chua sang Kho bac: phai tra soat

      R3 khop'
    unverified_claims:
    - ngày đã nộp thuế = ngày ngân hàng trích tiền (Luật Quản lý thuế 108/2025/QH15 Điều 14 khoản 5, nguồn tổng hợp, chưa đối chiếu bản gốc; luật cũ 38/2019/QH14 Điều 58 hết hiệu lực 30/6/2026) — điều pháp
      lý, máy không kiểm
    - R1, R2, R3 là nhãn minh hoạ (bài nói rõ không phải cấu trúc số thật); cấu trúc số tham chiếu theo Thông tư 19/2021/TT-BTC không dạy vì nguồn đã đọc không nêu
    code: "ngan_hang = {\"R1\": 1_500_000, \"R2\": 2_000_000, \"R3\": 800_000}\nkho_bac = {\"R1\": 1_500_000, \"R3\": 800_000}\nfor so_tc, tien in ngan_hang.items():\n    if so_tc not in kho_bac:\n    \
      \    print(so_tc, \"chua sang Kho bac: phai tra soat\")\n    elif kho_bac[so_tc] != tien:\n        print(so_tc, \"lech so tien\")\n    else:\n        print(so_tc, \"khop\")"
  L12_Scale:
    lang: python
    timeout: 240
    reason: 'Scale: chạy nguyên văn.'
    claims:
    - 'số phép so sánh khi đối soát bằng vòng lặp lồng: 5 050 (n = 100) và 50 005 000 (n = 10 000), đo thật bằng bộ đếm; n = 1 000 000 chỉ tính (n(n+1)/2)'
    - 'tra bảng: đúng n lần tra, đo thật ở 100, 10 000 và 1 000 000'
    expect_stdout: 'n = 100 danh sach 5050 bang tra 100

      n = 10000 danh sach 50005000 bang tra 10000

      n = 1000000 danh sach (tinh) 500000500000 bang tra 1000000'
    code: "def quet_danh_sach(n):\n    kho_bac = list(range(n))\n    dem = 0\n    for so_nh in range(n):\n        for so_kb in kho_bac:\n            dem += 1\n            if so_kb == so_nh:\n          \
      \      break\n    return dem\n\ndef tra_bang(n):\n    kho_bac = set(range(n))\n    dem = 0\n    for so_nh in range(n):\n        dem += 1\n        if so_nh not in kho_bac:\n            print(\"thieu\"\
      , so_nh)\n    return dem\n\nfor n in (100, 10_000):\n    ds, bt = quet_danh_sach(n), tra_bang(n)\n    print(\"n =\", n, \"danh sach\", ds, \"bang tra\", bt)\nn = 1_000_000\ntinh = n * (n + 1) // 2\n\
      print(\"n =\", n, \"danh sach (tinh)\", tinh, \"bang tra\", tra_bang(n))"
  LAB_L12:
    lang: python
    expect_stdout: 'tu choi rut Y 2000000

      vi 1800000 1050000 500000

      tong vi 3350000 dam bao 3350000 dat True

      chap nhan 20000000 da dung 20000000

      chap nhan 25000000 da dung 45000000

      tu choi 10000000 da dung 45000000

      chap nhan 5000000 da dung 50000000'
    code: "bao_dam = 250_000\nvi = {\"X\": 0, \"Y\": 250_000, \"Z\": 0}\nnhat_ky = [(\"nap\", \"X\", 3_000_000), (\"chuyen\", \"X\", \"Z\", 1_200_000),\n           (\"rut\", \"Z\", 400_000), (\"nap\", \"\
      Y\", 500_000),\n           (\"rut\", \"Y\", 2_000_000), (\"chuyen\", \"Z\", \"Y\", 300_000)]\nfor g in nhat_ky:\n    if g[0] == \"chuyen\":\n        vi[g[1]] -= g[3]\n        vi[g[2]] += g[3]\n  \
      \  elif g[0] == \"rut\" and vi[g[1]] < g[2]:\n        print(\"tu choi rut\", g[1], g[2])\n    else:\n        dau = 1 if g[0] == \"nap\" else -1\n        vi[g[1]] += dau * g[2]\n        bao_dam +=\
      \ dau * g[2]\ntong = sum(vi.values())\nprint(\"vi\", *vi.values())\nprint(\"tong vi\", tong, \"dam bao\", bao_dam, \"dat\", bao_dam >= tong)\nHAN_MUC = 50_000_000\nda_dung = 0\nfor so_tien in [20_000_000,\
      \ 25_000_000, 10_000_000, 5_000_000]:\n    if da_dung + so_tien > HAN_MUC:\n        print(\"tu choi\", so_tien, \"da dung\", da_dung)\n    else:\n        da_dung += so_tien\n        print(\"chap nhan\"\
      , so_tien, \"da dung\", da_dung)"
