sources:
  L35_NganSach:
    lang: python
    timeout: 120
    reason: 'NganSach: chạy nguyên văn.'
    claims:
    - 'ngân sách ngừng tối đa: 99% → 432 phút; 99,9% → 43,2; 99,95% → 21,6; 99,99% → 4,32'
    expect_stdout: '99% mot thang 30 ngay: toi da 432 phut ngung

      99.9% mot thang 30 ngay: toi da 43.2 phut ngung

      99.95% mot thang 30 ngay: toi da 21.6 phut ngung

      99.99% mot thang 30 ngay: toi da 4.32 phut ngung'
    code: "from decimal import Decimal as D\n\nTHANG = 30 * 24 * 60                      # 43 200 phút trong tháng 30 ngày\nfor muc in (\"99\", \"99.9\", \"99.95\", \"99.99\"):\n    ns = THANG * (100 -\
      \ D(muc)) / 100\n    print(f\"{muc}% mot thang 30 ngay: toi da {ns.normalize():f} phut ngung\")"
  L35_ChuoiPhuThuoc:
    lang: python
    timeout: 120
    reason: 'ChuoiPhuThuoc: chạy nguyên văn.'
    claims:
    - ba dịch vụ nối tiếp 99,95%, 99,9%, 99,9% cho 99,7502%; ngân sách 107,91 phút
    expect_stdout: '3 dich vu noi tiep (99.95, 99.9, 99.9): 99.7502%

      ngan sach neu cam ket chung: 107.91 phut/thang'
    code: 'from decimal import Decimal as D


      THANG = 30 * 24 * 60

      ba = D("0.9995") * D("0.999") * D("0.999")

      print(f"3 dich vu noi tiep (99.95, 99.9, 99.9): {ba * 100:.4f}%")

      print(f"ngan sach neu cam ket chung: {THANG * (1 - ba):.2f} phut/thang")'
  L35_SuCoThang:
    lang: python
    timeout: 120
    reason: 'SuCoThang: chạy nguyên văn.'
    claims:
    - sự cố 12 + 30 + 5 = 47 phút vượt ngân sách 43,2 phút của SLA 99,9% một khoảng 3,8 phút
    expect_stdout: 'su co: 12 + 30 + 5 = 47 phut; ngan sach 43.2 phut

      san sang thuc te: 99.8912%

      vuot ngan sach 3.8 phut'
    code: 'from decimal import Decimal as D


      THANG = 30 * 24 * 60

      ngan_sach = THANG * D("0.1") / 100         # SLA 99,9% → 43,2 phút

      su_co = [(12, "P2"), (30, "P1"), (5, "P3")]

      tong = sum(p for p, _ in su_co)

      cac = " + ".join(str(p) for p, _ in su_co)

      print(f"su co: {cac} = {tong} phut; ngan sach {ngan_sach} phut")

      print(f"san sang thuc te: {100 - D(tong) / THANG * 100:.4f}%")

      kq = "vuot ngan sach" if tong > ngan_sach else "con trong ngan sach"

      print(kq, f"{abs(tong - ngan_sach)} phut")'
  L35_QuyMoChuoi:
    lang: python
    timeout: 120
    reason: 'QuyMoChuoi: chạy nguyên văn.'
    claims:
    - 'chuỗi dịch vụ 99,9%: 1 → 99,9%; 100 → 90,4792%; 10000 → 0,0045%'
    expect_stdout: '1 dich vu 99.9% noi tiep: 99.9000% ; ngung toi da 43.2 phut/thang

      100 dich vu 99.9% noi tiep: 90.4792% ; ngung toi da 4113.0 phut/thang

      10000 dich vu 99.9% noi tiep: 0.0045% ; ngung toi da 43198.0 phut/thang'
    code: "from decimal import Decimal as D, getcontext\n\ngetcontext().prec = 50\nTHANG = 30 * 24 * 60\nfor n in (1, 100, 10000):\n    a = D(\"0.999\") ** n\n    print(f\"{n} dich vu 99.9% noi tiep: {a\
      \ * 100:.4f}% ; \"\n          f\"ngung toi da {THANG * (1 - a):.1f} phut/thang\")"
  L35_KiemTaiLieu:
    lang: python
    timeout: 120
    reason: 'KiemTaiLieu: chạy nguyên văn.'
    claims:
    - bản tốt đạt; bản xấu thiếu 3 mục và các yêu cầu khác
    expect_stdout: "tot: dat\nxau: 5 loi\n  thieu Boi canh\n  thieu Quyet dinh\n  thieu He qua\n  quyet dinh khong viet 'Chung toi se ...'\n  he qua khong neu mat tieu cuc"
    code: "TOT = \"\"\"# ADR 7: Dung hang doi cho thong bao sao ke\nTrang thai: Da duyet\n## Boi canh\nSao ke dem co 2 trieu dong; goi truc tiep tung tin se nghen cong SMS.\n## Quyet dinh\nChung toi se\
      \ dua tin vao hang doi va gui theo toc do cong cho phep.\n## He qua\nTich cuc: cong SMS khong bi nghen. Tieu cuc: tin den tre toi 15 phut.\n\"\"\"\nXAU = \"\"\"# Thiet ke thong bao\nDung hang doi\
      \ cho nhanh.\n\"\"\"\n\ndef kiem(vb):\n    loi = []\n    for muc in (\"## Boi canh\", \"## Quyet dinh\", \"## He qua\"):\n        if muc not in vb:\n            loi.append(\"thieu \" + muc[3:])\n\
      \    if \"Chung toi se\" not in vb:\n        loi.append(\"quyet dinh khong viet 'Chung toi se ...'\")\n    if \"Tieu cuc\" not in vb:\n        loi.append(\"he qua khong neu mat tieu cuc\")\n    return\
      \ loi\n\nfor ten, vb in ((\"tot\", TOT), (\"xau\", XAU)):\n    loi = kiem(vb)\n    print(f\"{ten}:\", \"dat\" if not loi else f\"{len(loi)} loi\")\n    for x in loi:\n        print(\"  \" + x)"
  L35_Phanso:
    lang: python
    timeout: 120
    reason: 'Phanso: chạy nguyên văn.'
    claims:
    - 'phân số: ngân sách 216/5 = 43,2 phút; tỉ lệ ngừng của chuỗi 0,002498; 43200 phút'
    expect_stdout: '216/5

      0.002498

      43200'
    code: 'from fractions import Fraction as F


      thang = 30 * 24 * 60

      print(thang * (1 - F(999, 1000)))

      print(f"{float(1 - F(9995, 10000) * F(999, 1000) ** 2):.6f}")

      print(sum(1 for _ in range(thang)))'
  L35_PhieuSuCo:
    lang: yaml
    kind: other
    reason: 'Phiếu sự cố môi trường thật (ví dụ minh hoạ, số minh hoạ): các trường cần để người nhận không phải hỏi lại.'
    read_check: Phân tích được bằng yaml.safe_load (cổng làm khi kind other + lang yaml); đây là mẫu của bài, không phải mẫu của tổ chức nào.
    code: "ma: PRD-1042\nmuc: P2\ntom_tat: Tra cuu so du cham tren ung dung\nanh_huong: khach le, khoang 15 phan tram yeu cau, tu 09:10\nbang_chung:\n  - nhat_ky: ma tuong quan 7f3a\n  - chi_so: p95 do\
      \ tre 4,2 giay (binh thuong 0,8)\nbuoc_tai_hien: goi dich vu so du voi tai khoan co nhieu giao dich\nhanh_dong_tam_thoi: tang so ban dich vu tu 3 len 5\nnguoi_nhan: ho tro muc 3\nhan_phan_hoi: 15\
      \ phut"
