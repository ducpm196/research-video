sources:
  L18_BoCa:
    lang: java
    java_class: BoCa
    timeout: 180
    reason: 'BoCa: chạy nguyên văn.'
    claims:
    - k mốc, bộ ca giữa khoảng k + 1 ca bỏ lọt k lỗi nhầm dấu; bộ ca sát mốc 2k + 1 ca bỏ lọt 0 (k = 2, 200, 2000), mô phỏng đột biến bằng Java thuần
    expect_stdout: '2 moc: giua khoang 3 ca, lot 2; sat moc 5 ca, lot 0

      200 moc: giua khoang 201 ca, lot 200; sat moc 401 ca, lot 0

      2000 moc: giua khoang 2001 ca, lot 2000; sat moc 4001 ca, lot 0'
    code: "import java.util.Arrays;\npublic class BoCa {\n  static int[] moc;\n  static int dem(long x) {               // số mốc ≤ x\n    int i = Arrays.binarySearch(moc, (int) x);\n    return i >= 0 ?\
      \ i + 1 : -i - 1;\n  }\n  static int tinh(long x, int loi) {     // loi: chỉ số mốc bị nhầm < thành <=\n    return dem(x) - (loi >= 0 && x == moc[loi] ? 1 : 0);\n  }\n  static int lot(long[] ca, int\
      \ k) {     // số lỗi mà bộ ca không bắt được\n    int song = 0;\n    for (int loi = 0; loi < k; loi++) {\n      boolean bat = false;\n      for (long x : ca) if (tinh(x, loi) != tinh(x, -1)) bat =\
      \ true;\n      if (!bat) song++;\n    }\n    return song;\n  }\n  public static void main(String[] a) {\n    for (int k : new int[] {2, 200, 2000}) {\n      moc = new int[k];\n      long[] giua =\
      \ new long[k + 1], bien = new long[2 * k + 1];\n      for (int i = 0; i < k; i++) {\n        moc[i] = (i + 1) * 10;\n        bien[2 * i] = moc[i];\n        bien[2 * i + 1] = moc[i] - 1;\n      }\n\
      \      for (int i = 0; i <= k; i++) giua[i] = i * 10 + 5;\n      bien[2 * k] = 5;\n      String s = k + \" moc: giua khoang \" + giua.length + \" ca, lot \"\n          + lot(giua, k);\n      System.out.println(s\
      \ + \"; sat moc \" + bien.length\n          + \" ca, lot \" + lot(bien, k));\n    }\n  }\n}"
  LAB_L18:
    lang: java
    java_class: Lab
    expect_stdout: 'ca 1999999: mong doi 0, nhan 0, DAT

      ca 2000000: mong doi 3000, nhan 3000, DAT

      ca 19999999: mong doi 3000, nhan 3000, DAT

      ca 20000000: mong doi 4000, nhan 3000, TRUOT

      ca 30000000: mong doi 4000, nhan 4000, DAT

      tong: 4 dat, 1 truot

      cong goi 1 lan, so tien 12003000

      true

      false'
    code: "import java.time.*;\n\npublic class Lab {\n    interface Cong { boolean chuyen(String tk, long soTien); }\n\n    // Đề: dưới 2 000 000: 0; từ 2 000 000 tới dưới 20 000 000: 3 000; từ 20 000 000:\
      \ 4 000\n    static long tinh(long soTien) {\n        if (soTien < 2_000_000) return 0;\n        if (soTien <= 20_000_000) return 3_000;   // nhầm dấu: phải là <\n        return 4_000;\n    }\n\n\
      \    static long chuyen(Cong cong, String tk, long soTien) {\n        long phi = tinh(soTien);\n        if (!cong.chuyen(tk, soTien + phi)) throw new IllegalStateException();\n        return phi;\n\
      \    }\n\n    static boolean kip(Clock dongHo) {\n        return LocalTime.now(dongHo).isBefore(LocalTime.of(17, 0));\n    }\n\n    static int dat = 0, truot = 0;\n\n    static void ca(long vao, long\
      \ mongDoi) {\n        long nhan = tinh(vao);\n        boolean ok = nhan == mongDoi;\n        if (ok) dat++; else truot++;\n        System.out.println(\"ca \" + vao + \": mong doi \" + mongDoi + \"\
      , nhan \" + nhan\n                + \", \" + (ok ? \"DAT\" : \"TRUOT\"));\n    }\n\n    public static void main(String[] args) {\n        ca(1_999_999, 0);\n        ca(2_000_000, 3_000);\n       \
      \ ca(19_999_999, 3_000);\n        ca(20_000_000, 4_000);\n        ca(30_000_000, 4_000);\n        System.out.println(\"tong: \" + dat + \" dat, \" + truot + \" truot\");\n\n        long[] ghi = new\
      \ long[2];\n        Cong gia = (tk, soTien) -> { ghi[0]++; ghi[1] = soTien; return true; };\n        chuyen(gia, \"TK07\", 12_000_000);\n        System.out.println(\"cong goi \" + ghi[0] + \" lan,\
      \ so tien \" + ghi[1]);\n\n        ZoneOffset vn = ZoneOffset.ofHours(7);\n        Instant t = Instant.parse(\"2026-11-11T16:59:00+07:00\");\n        System.out.println(kip(Clock.fixed(t, vn)));\n\
      \        System.out.println(kip(Clock.fixed(t.plusSeconds(60), vn)));\n    }\n}"
