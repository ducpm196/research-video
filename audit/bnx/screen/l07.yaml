sources:
  L07_aq_clean:
    lang: oracle
    code: |
      BEGIN
        DBMS_AQADM.STOP_QUEUE('bnx_l07_q');
        DBMS_AQADM.DROP_QUEUE('bnx_l07_q');
        DBMS_AQADM.DROP_QUEUE_TABLE('bnx_l07_qt');
      EXCEPTION WHEN OTHERS THEN NULL;
      END;
      /
      DROP TYPE IF EXISTS bnx_l07_msg FORCE;
    reason: Dọn hàng đợi, bảng hàng đợi và kiểu thông điệp của lần chạy trước để khối formula 6 0 chạy lại được (không hiện trên màn hình; bài không nói
      gì về bước dọn). Chép từ hằng AQ_CLEAN của audit/bnx/src/l07.py.
    no_claim_reason: chỉ dọn dẹp; bài không nói kết quả nào của bước này
