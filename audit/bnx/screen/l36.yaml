sources:
  L36_UocLuong:
    lang: python
    timeout: 120
    reason: 'UocLuong: chạy nguyên văn.'
    claims:
    - 'ước lượng ×1, ×100, ×10 000: 200 000 / 20 triệu / 2 tỉ giao dịch mỗi ngày; trung bình 2,3 / 231,5 / 23 148,1; đỉnh 23 / 2 315 / 231 481; 0,1 / 10 / 1 000 GB mỗi ngày; 1 / 2 / 116 nút ghi (số minh
      hoạ)'
    expect_stdout: "x1: 200000 gd/ngay, tb 2.3/s, dinh 23/s\n      0.1 GB/ngay, 1 nut ghi\nx100: 20000000 gd/ngay, tb 231.5/s, dinh 2315/s\n      10.0 GB/ngay, 2 nut ghi\nx10000: 2000000000 gd/ngay, tb\
      \ 23148.1/s, dinh 231481/s\n      1000.0 GB/ngay, 116 nut ghi"
    code: "import math\n\n# so minh hoa: 100000 khach, 2 gd/khach/ngay, he so dinh 10\n# moi giao dich 500 byte; moi nut ghi chiu 2000 gd/s (gia dinh)\nKHACH, GD_KHACH, DINH = 100_000, 2, 10\nBYTE, NUT\
      \ = 500, 2000\nfor he_so in (1, 100, 10_000):\n    gd = KHACH * he_so * GD_KHACH\n    tb = gd / 86_400\n    dinh = tb * DINH\n    gb = gd * BYTE / 10**9\n    nut = math.ceil(dinh / NUT)\n    print(f\"\
      x{he_so}: {gd} gd/ngay, tb {tb:.1f}/s, dinh {dinh:.0f}/s\")\n    print(f\"      {gb:.1f} GB/ngay, {nut} nut ghi\")"
  L36_KhoaLuyDang:
    lang: python
    timeout: 120
    reason: 'KhoaLuyDang: chạy nguyên văn.'
    claims:
    - 'không có khoá: gửi 2 lần bị trừ 2 lần (A 400, B 600); có khoá: lần 2 bị bỏ qua (A 700, B 300); cùng khoá khác nội dung bị từ chối'
    expect_stdout: 'khong khoa, gui 2 lan: {''A'': 400, ''B'': 600}

      co khoa K1, lan 1: da chuyen

      co khoa K1, lan 2: trung khoa, bo qua

      so du: {''A'': 700, ''B'': 300}

      cung khoa K1, 500: 422: cung khoa, noi dung khac'
    code: "import sqlite3\n\n\ndef tao_hub():\n    db = sqlite3.connect(\":memory:\")\n    db.executescript(\"\"\"\nCREATE TABLE tk (ma TEXT PRIMARY KEY, so_du INTEGER);\nCREATE TABLE yeu_cau (khoa TEXT\
      \ PRIMARY KEY,\n                      tu TEXT, den TEXT, tien INTEGER);\nINSERT INTO tk VALUES ('A', 1000), ('B', 0);\n\"\"\")\n    return db\n\n\ndef chuyen(db, khoa, tu, den, tien):\n    with db:\n\
      \        if khoa is not None:\n            sql = \"SELECT tu, den, tien FROM yeu_cau WHERE khoa = ?\"\n            cu = db.execute(sql, (khoa,)).fetchone()\n            if cu == (tu, den, tien):\n\
      \                return \"trung khoa, bo qua\"\n            if cu:\n                return \"422: cung khoa, noi dung khac\"\n            db.execute(\"INSERT INTO yeu_cau VALUES (?, ?, ?, ?)\",\n\
      \                       (khoa, tu, den, tien))\n        db.execute(\"UPDATE tk SET so_du = so_du - ? WHERE ma = ?\",\n                   (tien, tu))\n        db.execute(\"UPDATE tk SET so_du = so_du\
      \ + ? WHERE ma = ?\",\n                   (tien, den))\n    return \"da chuyen\"\n\n\ndef so_du(db):\n    return dict(db.execute(\"SELECT ma, so_du FROM tk\"))\n\n\ndb = tao_hub()\nfor _ in range(2):\n\
      \    chuyen(db, None, \"A\", \"B\", 300)\nprint(\"khong khoa, gui 2 lan:\", so_du(db))\ndb = tao_hub()\nfor lan in (1, 2):\n    print(f\"co khoa K1, lan {lan}:\", chuyen(db, \"K1\", \"A\", \"B\",\
      \ 300))\nprint(\"so du:\", so_du(db))\nprint(\"cung khoa K1, 500:\", chuyen(db, \"K1\", \"A\", \"B\", 500))"
  L36_DoiSoat:
    lang: python
    timeout: 120
    reason: 'DoiSoat: chạy nguyên văn.'
    claims:
    - 'cứ 500 lệnh hỏng 1 bước ghi có: 1 000 lệnh → 2 lệch (200 đồng treo, 0,3 giờ xử lý tay); 100 000 lệnh → 200 lệch (20 000 đồng, 33,3 giờ) (số minh hoạ)'
    expect_stdout: '1000 lenh: 2 lech, 200 dong treo; tay 0.3 gio

      100000 lenh: 200 lech, 20000 dong treo; tay 33.3 gio'
    code: "def chay(n):\n    ghi_no, ghi_co = {}, {}\n    for i in range(n):\n        ghi_no[i] = 100\n        if i % 500 != 499:\n            ghi_co[i] = 100\n    lech = [i for i in ghi_no if i not in\
      \ ghi_co]\n    return len(lech), sum(ghi_no[i] for i in lech)\n\n\nfor n in (1000, 100_000):\n    so, tien = chay(n)\n    gio = so * 10 / 60\n    print(f\"{n} lenh: {so} lech, {tien} dong treo; tay\
      \ {gio:.1f} gio\")"
  L36_KiemCanBang:
    lang: python
    timeout: 120
    reason: 'KiemCanBang: chạy nguyên văn.'
    claims:
    - 'ước lượng bằng phân số: 125/54 = 2,3148 giao dịch/giây, đỉnh 23,1481; tổng tiền không đổi 1 000 kể cả khi bị trừ hai lần'
    expect_stdout: 'tb 125/54 = 2.3148 gd/s; dinh 23.1481

      tong tien dau: 1000

      tong tien 1 lan: 1000

      tong tien 2 lan sai: 1000'
    code: "from fractions import Fraction as F\n\ntb = F(100_000 * 2, 86_400)\nprint(f\"tb {tb} = {float(tb):.4f} gd/s; dinh {float(tb * 10):.4f}\")\nfor ten, a, b in ((\"dau\", 1000, 0), (\"1 lan\", 700,\
      \ 300),\n                  (\"2 lan sai\", 400, 600)):\n    print(f\"tong tien {ten}: {a + b}\")"
  L36_DocCau:
    lang: python
    timeout: 120
    reason: 'DocCau: chạy nguyên văn.'
    claims:
    - 'bộ lọc chữ MUST/SHOULD/MAY: câu 3 vừa cấm tuyệt đối vừa bắt buộc, câu 9 là nên, câu 7 bắt buộc và câu 8 là nên theo văn thường, sáu câu còn lại là mô tả'
    expect_stdout: '1 RFC 9110: mo ta | conflict

      2 draft-key: mo ta | idempot,retr,unique

      3 draft-key: cam tuyet doi + bat buoc | idempot,payload,unique

      4 Stripe: mo ta | retr

      5 Stripe: mo ta | idempot

      6 PostgreSQL: mo ta | isolation

      7 PostgreSQL: bat buoc (van thuong) | retr,serializ

      8 SRE: nen (van thuong) | retr,budget

      9 RFC 9110: nen | conflict

      10 RFC 9110: mo ta | idempot'
    code: "import re\n\nCAU = [\n    (\"RFC 9110\", \"The 409 (Conflict) status code indicates that the \"\n     \"request could not be completed due to a conflict with the \"\n     \"current state of the\
      \ target resource.\"),\n    (\"draft-key\", \"An idempotency key is a unique value generated by the \"\n     \"client which the resource uses to recognize subsequent retries \"\n     \"of the same\
      \ request.\"),\n    (\"draft-key\", \"The idempotency key MUST be unique and MUST NOT be \"\n     \"reused with another request with a different request payload.\"),\n    (\"Stripe\", \"Retries with\
      \ the same key return the saved response, \"\n     \"including 500 errors.\"),\n    (\"Stripe\", \"For API v1, Stripe saves the status code and body of the \"\n     \"first request made with a given\
      \ idempotency key after endpoint \"\n     \"execution begins.\"),\n    (\"PostgreSQL\", \"Read Committed is the default isolation level in \"\n     \"PostgreSQL.\"),\n    (\"PostgreSQL\", \"Applications\
      \ using this level must be prepared to \"\n     \"retry transactions due to serialization failures.\"),\n    (\"SRE\", \"Consider having a server-wide retry budget.\"),\n    (\"RFC 9110\", \"The server\
      \ SHOULD generate content that includes \"\n     \"enough information for a user to recognize the source of the \"\n     \"conflict.\"),\n    (\"RFC 9110\", \"Of the request methods defined by this\
      \ specification, \"\n     \"PUT, DELETE, and safe request methods are idempotent.\"),\n]\nMUC = [(\"MUST NOT\", \"cam tuyet doi\"), (\"MUST\", \"bat buoc\"),\n       (\"SHOULD\", \"nen\"), (\"MAY\"\
      , \"tuy chon\")]\nTU = [\"idempot\", \"payload\", \"retr\", \"conflict\", \"isolation\",\n      \"serializ\", \"budget\", \"unique\"]\n\n\ndef doc(cau):\n    muc = []\n    for tu, y in MUC:\n    \
      \    mau = r\"\\b\" + tu + r\"\\b\" + (r\"(?! NOT)\" if tu != \"MAY\" else \"\")\n        if re.search(mau, cau):\n            muc.append(y)\n    if not muc and re.search(r\"\\bmust\\b\", cau):\n\
      \        muc.append(\"bat buoc (van thuong)\")\n    if not muc and re.search(r\"\\b(Consider|should)\\b\", cau):\n        muc.append(\"nen (van thuong)\")\n    return muc or [\"mo ta\"]\n\n\nfor i,\
      \ (nguon, cau) in enumerate(CAU, 1):\n    tu = [t for t in TU if t in cau.lower()]\n    print(i, nguon + \":\", \" + \".join(doc(cau)), \"|\", \",\".join(tu))"
  LAB_L36:
    lang: python
    expect_stdout: 'x1: tb 2.3/s, dinh 19/s, 1 nut -> mot nut

      x1000: tb 2314.8/s, dinh 18519/s, 38 nut -> chia theo khoa

      lan 1: da chuyen

      lan 2: trung khoa, bo qua

      so du: A=300 B=200'
    code: "import math\n\nKHACH, GD_KHACH, DINH, NUT = 50_000, 4, 8, 500\nfor he_so in (1, 1000):\n    gd = KHACH * he_so * GD_KHACH\n    tb = gd / 86_400\n    dinh = tb * DINH\n    nut = math.ceil(dinh\
      \ / NUT)\n    if nut == 1:\n        chon = \"mot nut\"\n    elif nut <= 10:\n        chon = \"nhom nut\"\n    else:\n        chon = \"chia theo khoa\"\n    print(f\"x{he_so}: tb {tb:.1f}/s, dinh {dinh:.0f}/s,\
      \ {nut} nut -> {chon}\")\n\nso_du = {\"A\": 500, \"B\": 0}\nda_xu_ly = {}\n\n\ndef chuyen(khoa, tu, den, tien):\n    if khoa in da_xu_ly:\n        return \"trung khoa, bo qua\"\n    da_xu_ly[khoa]\
      \ = (tu, den, tien)\n    so_du[tu] -= tien\n    so_du[den] += tien\n    return \"da chuyen\"\n\n\nfor lan in (1, 2):\n    print(f\"lan {lan}:\", chuyen(\"K9\", \"A\", \"B\", 200))\nprint(f\"so du:\
      \ A={so_du['A']} B={so_du['B']}\")"
