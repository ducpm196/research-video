sources:
  LAB_L02:
    lang: python
    expect_stdout: '08 14 30 f0 a2 04 3a 05 41 54 4d 30 31

      13 byte'
    code: "def varint(n):\n    out = []\n    while True:\n        b, n = n & 0x7F, n >> 7\n        out.append(b | 0x80 if n else b)\n        if n == 0:\n            return bytes(out)\n\n\ndef field(num,\
      \ wire, payload):\n    return varint(num << 3 | wire) + payload\n\n\nm = field(1, 0, varint(20))\nm += field(6, 0, varint(70000))\nm += field(7, 2, varint(5) + b\"ATM01\")\nprint(m.hex(\" \"))\nprint(len(m),\
      \ \"byte\")"
