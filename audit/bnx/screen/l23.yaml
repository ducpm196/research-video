sources:
  L23_QuyMo:
    lang: python
    timeout: 400
    reason: 'QuyMo: chạy nguyên văn.'
    claims:
    - 'rừng cô lập tỉ lệ nhiễm 1% trên 1 010, 10 100, 101 000 điểm: gắn 11, 101, 1 005 nhãn -1, bắt đủ 10, 100, 1 000 điểm lạ; tổng số nút của rừng quanh 11 400 ở cả ba cỡ'
    expect_stdout: '1010 diem: 11 bi gan -1, 10 la that, 11384 nut cua rung

      10100 diem: 101 bi gan -1, 100 la that, 11802 nut cua rung

      101000 diem: 1005 bi gan -1, 1000 la that, 11436 nut cua rung'
    code: "import sys\nsys.path.insert(0, \"D:/research-video/audit/bnx/deps/l23/venv/Lib/site-packages\")\nimport numpy as np\nfrom sklearn.ensemble import IsolationForest\nfor n_la in (10, 100, 1000):\n\
      \    rng = np.random.default_rng(42)\n    thuong = rng.normal(500, 50, n_la * 100)\n    la = rng.normal(50_000, 2_000, n_la)\n    X = np.concatenate([thuong, la]).reshape(-1, 1)\n    mm = IsolationForest(n_estimators=100,\
      \ contamination=0.01,\n                         random_state=42).fit(X)\n    p = mm.predict(X)\n    nut = sum(t.tree_.node_count for t in mm.estimators_)\n    print(len(X), \"diem:\", (p == -1).sum(),\
      \ \"bi gan -1,\",\n          (p[len(thuong):] == -1).sum(), \"la that,\", nut, \"nut cua rung\")"
  L23_LabL23:
    lang: python
    timeout: 120
    reason: 'LabL23: chạy nguyên văn.'
    claims:
    - đầu ra thật của LabL23
    expect_stdout: 'c(128) = 8.8584

      A diem -0.8551 quyet dinh -0.2551 nhan -1

      B diem -0.4945 quyet dinh 0.1055 nhan 1

      bi gan -1: 90 | gan oan: 65'
    code: "import math\nn = 128\nc = 2 * (math.log(n - 1) + 0.5772156649) - 2 * (n - 1) / n\noffset = -0.6\nprint(\"c(128) =\", round(c, 4))\nfor ten, h in ((\"A\", 2), (\"B\", 9)):\n    diem = -2 ** (-h\
      \ / c)\n    qd = diem - offset\n    print(ten, \"diem\", round(diem, 4), \"quyet dinh\", round(qd, 4), \"nhan\", -1 if qd < 0 else 1)\nso = math.ceil(0.03 * (3000 - 1))\nprint(\"bi gan -1:\", so,\
      \ \"| gan oan:\", so - 25)"
  LAB_L23:
    lang: python
    expect_stdout: 'c(128) = 8.8584

      A diem -0.8551 quyet dinh -0.2551 nhan -1

      B diem -0.4945 quyet dinh 0.1055 nhan 1

