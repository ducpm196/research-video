    code: "import os, sys\nSP = \"D:/research-video/audit/bnx/deps/l23/venv/Lib/site-packages\"\nif not os.path.isdir(SP):\n    print(\"NOT_VERIFIED: thiếu audit/bnx/deps/l23/venv (xem audit/bnx/deps/l23/README.md)\"\
      , file=sys.stderr)\n    sys.exit(97)\nsys.path.insert(0, SP)\n"
