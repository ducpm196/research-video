    code: "import math\nn = 128\nc = 2 * (math.log(n - 1) + 0.5772156649) - 2 * (n - 1) / n\noffset = -0.6\nprint(\"c(128) =\", round(c, 4))\nfor ten, h in ((\"A\", 2), (\"B\", 9)):\n    diem = -2 ** (-h\
      \ / c)\n    qd = diem - offset\n    print(ten, \"diem\", round(diem, 4), \"quyet dinh\", round(qd, 4), \"nhan\", -1 if qd < 0 else 1)\nso = math.ceil(0.03 * (3000 - 1))\nprint(\"bi gan -1:\", so,\
      \ \"| gan oan:\", so - 25)"
