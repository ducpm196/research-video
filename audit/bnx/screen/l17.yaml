sources:
  L17_cauhinh:
    lang: java
    kind: other
    code: "import static java.nio.charset.StandardCharsets.UTF_8;\nimport jakarta.servlet.*;\nimport java.io.IOException;\nimport javax.crypto.spec.SecretKeySpec;\n\
      import org.springframework.context.annotation.*;\nimport org.springframework.security.config.Customizer;\nimport org.springframework.security.config.annotation.web.builders.*;\n\
      import org.springframework.security.config.annotation.web.configuration.*;\nimport org.springframework.security.oauth2.jwt.*;\nimport org.springframework.security.oauth2.server.resource.web.authentication.*;\n\
      import org.springframework.security.web.SecurityFilterChain;\n@Configuration\n@EnableWebSecurity\npublic class CauHinh {\n  static final\
      \ String KHOA = \"khoa-bi-mat-chi-de-hoc-dai-32-byte!!\";\n  @Bean\n  SecurityFilterChain chuoi(HttpSecurity http) throws Exception {\n\
      \    http.authorizeHttpRequests(q -> q\n        .requestMatchers(\"/han-muc\").hasAuthority(\"SCOPE_han_muc\")\n        .anyRequest().authenticated());\n\
      \    http.oauth2ResourceServer(m -> m.jwt(Customizer.withDefaults()));\n    http.addFilterAfter(new TramQuanSat(),\n        BearerTokenAuthenticationFilter.class);\n\
      \    return http.build();\n  }\n  @Bean\n  JwtDecoder giaiMa() {                // kiểm chữ ký bằng khoá chung\n    var khoa = new SecretKeySpec(KHOA.getBytes(UTF_8),\
      \ \"HmacSHA256\");\n    return NimbusJwtDecoder.withSecretKey(khoa).build();\n  }\n  static class TramQuanSat implements Filter {   // trạm\
      \ quan sát\n    public void doFilter(ServletRequest q, ServletResponse d,\n        FilterChain c) throws IOException, ServletException {\n\
      \      System.out.println(\"  qua trạm quan sát\");\n      c.doFilter(q, d);\n    }\n  }\n}\n"
    reason: CauHinh.java đầy đủ (hằng J_CFG ở audit/bnx/src/l17.py); màn hình hiện từng đoạn liên tiếp.
    read_check: Cần jar Spring ở classpath nên trình kiểm java của cổng không biên dịch riêng được; tệp được ghi NGUYÊN VĂN, biên dịch bằng javac
      -cp lib/* và chạy trong nguồn src:BNX:L17_spring (Spring Security 7.1.2); khớp từng ký tự đầu ra.
  L17_chaythu:
    lang: java
    kind: other
    code: "import static java.nio.charset.StandardCharsets.UTF_8;\nimport jakarta.servlet.Filter;\nimport java.util.Base64;\nimport javax.crypto.Mac;\n\
      import javax.crypto.spec.SecretKeySpec;\nimport org.springframework.mock.web.*;\nimport org.springframework.security.web.FilterChainProxy;\n\
      import org.springframework.web.context.support.*;\npublic class ChayThu {\n  static Filter chuoi;\n  static String ky(String than, String\
      \ khoa) throws Exception {\n    var b = Base64.getUrlEncoder().withoutPadding();\n    String p = b.encodeToString(\"{\\\"alg\\\":\\\"HS256\\\
      \"}\".getBytes(UTF_8))\n        + \".\" + b.encodeToString(than.getBytes(UTF_8));\n    Mac m = Mac.getInstance(\"HmacSHA256\");\n    m.init(new\
      \ SecretKeySpec(khoa.getBytes(UTF_8), \"HmacSHA256\"));\n    return p + \".\" + b.encodeToString(m.doFinal(p.getBytes(UTF_8)));\n  }\n \
      \ static void thu(String ten, String pt, String ma) throws Exception {\n    System.out.println(ten);\n    var q = new MockHttpServletRequest(pt,\
      \ \"/han-muc\");\n    if (ma != null) q.addHeader(\"Authorization\", \"Bearer \" + ma);\n    var d = new MockHttpServletResponse();\n  \
      \  chuoi.doFilter(q, d,\n        (x, y) -> System.out.println(\"  tới dịch vụ\"));\n    System.out.println(\"  mã trạng thái \" + d.getStatus());\n\
      \    String h = d.getHeader(\"WWW-Authenticate\");\n    if (h != null) System.out.println(\"  \" + h);\n  }\n  public static void main(String[]\
      \ a) throws Exception {\n    var ctx = new AnnotationConfigWebApplicationContext();\n    ctx.setServletContext(new MockServletContext());\n\
      \    ctx.register(CauHinh.class);\n    ctx.refresh();\n    chuoi = ctx.getBean(\"springSecurityFilterChain\", Filter.class);\n    int i\
      \ = 0;\n    for (Filter f : ((FilterChainProxy) chuoi).getFilters(\"/han-muc\"))\n      System.out.println(++i + \" \" + f.getClass().getSimpleName());\n\
      \    String k = CauHinh.KHOA, han = \",\\\"exp\\\":4102444800}\";\n    String an = ky(\"{\\\"scope\\\":\\\"so_du\\\"\" + han, k);\n    String\
      \ binh = ky(\"{\\\"scope\\\":\\\"so_du han_muc\\\"\" + han, k);\n    String gia = ky(\"{\\\"scope\\\":\\\"han_muc\\\"\" + han,\n       \
      \ \"khoa-cua-ke-gian-cung-dai-32-byte!!!\");\n    String cu = ky(\"{\\\"scope\\\":\\\"han_muc\\\",\\\"exp\\\":1700000000}\", k);\n    thu(\"\
      A. không mang mã\", \"GET\", null);\n    thu(\"B. mã ký bằng khoá khác\", \"GET\", gia);\n    thu(\"C. mã thật, thiếu quyền\", \"GET\",\
      \ an);\n    thu(\"D. mã thật, đủ quyền\", \"GET\", binh);\n    thu(\"E. mã thật, đã hết hạn\", \"GET\", cu);\n    thu(\"F. lệnh POST, không\
      \ mang mã\", \"POST\", null);\n    thu(\"G. lệnh POST, đủ quyền\", \"POST\", binh);\n  }\n}\n"
    reason: ChayThu.java đầy đủ (hằng J_RUN); màn hình hiện từng đoạn liên tiếp.
    read_check: 'Như CauHinh.java: ghi nguyên văn, biên dịch cùng CauHinh.java và chạy trong nguồn src:BNX:L17_spring.'
  L17_spring:
    lang: bash
    kind: run
    timeout: 300
    code: 'D=/d/research-video/audit/bnx/deps/l17

      ls $D/spring-security-web-7.1.2.jar >/dev/null 2>&1 || { echo "NOT_VERIFIED: thiếu jar" >&2; exit 97; }

      mkdir -p lib && cp $D/*.jar lib/

      javac -encoding UTF-8 -cp "lib/*" -d out CauHinh.java ChayThu.java

      java -Dstdout.encoding=UTF-8 -cp "out;lib/*" ChayThu

      '
    files:
      CauHinh.java: src:BNX:L17_cauhinh
      ChayThu.java: src:BNX:L17_chaythu
    reason: Chạy THẬT Spring Security 7.1.2 + Spring Framework 7.0.10 (jar ở audit/bnx/deps/l17, sha256 ở README.md); thiếu jar thì thoát 97 kèm
      NOT_VERIFIED.
    claims:
    - yêu cầu không mang mã nhận 401
    - mã thật thiếu quyền nhận 403
    - mã đủ quyền nhận 200
    - chuỗi bộ lọc gồm mười bốn trạm, trạm đọc mã ở vị trí 8, trạm kiểm quyền ở vị trí 14
    - lệnh POST không mang mã nhận 403 từ trạm chống giả mạo (vị trí 5)
    expect_stdout: "1 DisableEncodeUrlFilter\n2 WebAsyncManagerIntegrationFilter\n3 SecurityContextHolderFilter\n4 HeaderWriterFilter\n5 CsrfFilter\n\
      6 LogoutFilter\n7 OAuth2ProtectedResourceMetadataFilter\n8 BearerTokenAuthenticationFilter\n9 TramQuanSat\n10 RequestCacheAwareFilter\n\
      11 SecurityContextHolderAwareRequestFilter\n12 AnonymousAuthenticationFilter\n13 ExceptionTranslationFilter\n14 AuthorizationFilter\nA.\
      \ không mang mã\n  qua trạm quan sát\n  mã trạng thái 401\n  Bearer resource_metadata=\"http://localhost/.well-known/oauth-protected-resource\"\
      \nB. mã ký bằng khoá khác\n  mã trạng thái 401\n  Bearer error=\"invalid_token\", error_description=\"An error occurred while attempting\
      \ to decode the Jwt: Signed JWT rejected: Invalid signature\", error_uri=\"https://tools.ietf.org/html/rfc6750#section-3.1\", resource_metadata=\"\
      http://localhost/.well-known/oauth-protected-resource\"\nC. mã thật, thiếu quyền\n  qua trạm quan sát\n  mã trạng thái 403\n  Bearer error=\"\
      insufficient_scope\", error_description=\"The request requires higher privileges than provided by the access token.\", error_uri=\"https://tools.ietf.org/html/rfc6750#section-3.1\"\
      \nD. mã thật, đủ quyền\n  qua trạm quan sát\n  tới dịch vụ\n  mã trạng thái 200\nE. mã thật, đã hết hạn\n  mã trạng thái 401\n  Bearer error=\"\
      invalid_token\", error_description=\"An error occurred while attempting to decode the Jwt: Jwt expired at 2023-11-14T22:13:20Z\", error_uri=\"\
      https://tools.ietf.org/html/rfc6750#section-3.1\", resource_metadata=\"http://localhost/.well-known/oauth-protected-resource\"\nF. lệnh\
      \ POST, không mang mã\n  mã trạng thái 403\nG. lệnh POST, đủ quyền\n  qua trạm quan sát\n  tới dịch vụ\n  mã trạng thái 200\n"
  L17_chiatai:
    lang: java
    java_class: ChiaTai
    timeout: 120
    code: "import java.util.*;\npublic class ChiaTai {   // MÔ PHỎNG, không phải Spring Cloud\n  record Ban(String ten, boolean khoe) { }\n  static\
      \ Map<String, Integer> chia(List<Ban> so, int n) {\n    List<Ban> song = so.stream().filter(Ban::khoe).toList();\n    Map<String, Integer>\
      \ dem = new TreeMap<>();\n    for (int i = 0; i < n; i++) {\n      Ban b = song.get(i % song.size());   // xoay vòng\n      dem.merge(b.ten(),\
      \ 1, Integer::sum);\n    }\n    return dem;\n  }\n  public static void main(String[] a) {\n    List<Ban> so = List.of(new Ban(\"bản 1\"\
      , true),\n        new Ban(\"bản 2\", true), new Ban(\"bản 3\", true));\n    System.out.println(\"ba bản khoẻ: \" + chia(so, 100));\n   \
      \ so = List.of(new Ban(\"bản 1\", true),\n        new Ban(\"bản 2\", false), new Ban(\"bản 3\", true));\n    System.out.println(\"bản 2\
      \ trượt: \" + chia(so, 100));\n  }\n}\n"
    reason: 'ChiaTai.java đầy đủ (hằng J_LB): MÔ PHỎNG xoay vòng bằng Java thuần, không phải Spring Cloud.'
    claims:
    - 'ba bản khoẻ: 100 yêu cầu chia 34, 33, 33'
    - 'bản 2 trượt: bản 1 và bản 3 mỗi bản 50'
    expect_stdout: 'ba bản khoẻ: {bản 1=34, bản 2=33, bản 3=33}

      bản 2 trượt: {bản 1=50, bản 3=50}

      '
  L17_kiem:
    lang: python
    timeout: 60
    code: "def kiem(ma, quyen_can):\n    if ma is None:\n        return 401                     # chưa biết bạn là ai\n    if not ma[\"chu_ky_dung\"\
      ] or ma[\"het_han\"]:\n        return 401                     # mã không tin được\n    if quyen_can not in ma[\"quyen\"]:\n        return\
      \ 403                     # biết rồi nhưng không cho\n    return 200\nan = {\"chu_ky_dung\": True, \"het_han\": False, \"quyen\": [\"so_du\"\
      ]}\nbinh = dict(an, quyen=[\"so_du\", \"han_muc\"])\ngia, cu = dict(binh, chu_ky_dung=False), dict(binh, het_han=True)\nprint([kiem(m, \"\
      han_muc\") for m in (None, gia, an, binh, cu)])\nprint(100 // 2, [len(range(i, 100, 3)) for i in range(3)])\n"
    reason: Bảng quyết định viết tay (hằng PY_CHECK), không dùng Spring.
    claims:
    - năm ca cho 401, 401, 403, 200, 401
    - 100 chia 2 là 50; ba bản là 34, 33, 33
    expect_stdout: '[401, 401, 403, 200, 401]

      50 [34, 33, 33]

      '
