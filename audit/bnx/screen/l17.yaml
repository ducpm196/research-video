    - lệnh POST không mang mã nhận 403 từ trạm chống giả mạo (vị trí 5)
    expect_stdout: "1 DisableEncodeUrlFilter\n2 WebAsyncManagerIntegrationFilter\n3 SecurityContextHolderFilter\n4 HeaderWriterFilter\n5 CsrfFilter\n6 LogoutFilter\n7 OAuth2ProtectedResourceMetadataFilter\n\
      8 BearerTokenAuthenticationFilter\n9 TramQuanSat\n10 RequestCacheAwareFilter\n11 SecurityContextHolderAwareRequestFilter\n12 AnonymousAuthenticationFilter\n13 ExceptionTranslationFilter\n14 AuthorizationFilter\n\
      A. không mang mã\n  qua trạm quan sát\n  mã trạng thái 401\n  Bearer resource_metadata=\"http://localhost/.well-known/oauth-protected-resource\"\nB. mã ký bằng khoá khác\n  mã trạng thái 401\n  Bearer\
      \ error=\"invalid_token\", error_description=\"An error occurred while attempting to decode the Jwt: Signed JWT rejected: Invalid signature\", error_uri=\"https://tools.ietf.org/html/rfc6750#section-3.1\"\
      , resource_metadata=\"http://localhost/.well-known/oauth-protected-resource\"\nC. mã thật, thiếu quyền\n  qua trạm quan sát\n  mã trạng thái 403\n  Bearer error=\"insufficient_scope\", error_description=\"\
      The request requires higher privileges than provided by the access token.\", error_uri=\"https://tools.ietf.org/html/rfc6750#section-3.1\"\nD. mã thật, đủ quyền\n  qua trạm quan sát\n  tới dịch vụ\n\
      \  mã trạng thái 200\nE. mã thật, đã hết hạn\n  mã trạng thái 401\n  Bearer error=\"invalid_token\", error_description=\"An error occurred while attempting to decode the Jwt: Jwt expired at 2023-11-14T22:13:20Z\"\
      , error_uri=\"https://tools.ietf.org/html/rfc6750#section-3.1\", resource_metadata=\"http://localhost/.well-known/oauth-protected-resource\"\nF. lệnh POST, không mang mã\n  mã trạng thái 403\nG. lệnh\
      \ POST, đủ quyền\n  qua trạm quan sát\n  tới dịch vụ\n  mã trạng thái 200\n"
  L17_chiatai:
    lang: java
    java_class: ChiaTai
    timeout: 120
    code: "import java.util.*;\npublic class ChiaTai {   // MÔ PHỎNG, không phải Spring Cloud\n  record Ban(String ten, boolean khoe) { }\n  static Map<String, Integer> chia(List<Ban> so, int n) {\n   \
      \ List<Ban> song = so.stream().filter(Ban::khoe).toList();\n    Map<String, Integer> dem = new TreeMap<>();\n    for (int i = 0; i < n; i++) {\n      Ban b = song.get(i % song.size());   // xoay vòng\n\
