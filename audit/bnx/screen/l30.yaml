sources:
  L30_ThuLai:
    lang: java
    java_class: ThuLai
    kind: other
    reason: 'ThuLai.java: thử lại có lùi theo luỹ thừa 2, cộng thời gian chờ (đồng hồ giả, không ngủ thật).'
    read_check: Biên dịch và chạy trong nguồn L30_ChayTuCai.
    code: "public class ThuLai {\n  static String chay(int hong, int toiDa, int goc) {\n    int cho = 0;\n    for (int lan = 1; lan <= toiDa; lan++) {\n      if (lan > hong)\n        return \"thanh cong\
      \ o lan \" + lan + \", cho tong \" + cho + \" ms\";\n      if (lan == toiDa)\n        return \"that bai sau \" + toiDa + \" lan, cho tong \" + cho + \" ms\";\n      cho += goc << (lan - 1);      \
      \    // 100, 200, 400, ...\n    }\n    return \"\";\n  }\n  public static void main(String[] a) {\n    System.out.println(\"hong 2 lan, toi da 4: \" + chay(2, 4, 100));\n    System.out.println(\"\
      hong 5 lan, toi da 4: \" + chay(5, 4, 100));\n    System.out.println(\"hong 0 lan, toi da 4: \" + chay(0, 4, 100));\n  }\n}"
  L30_CauDao:
    lang: java
    java_class: CauDao
    kind: other
    reason: 'CauDao.java: cầu dao ba trạng thái với đồng hồ giả (mili giây truyền vào).'
    read_check: Biên dịch và chạy trong nguồn L30_ChayTuCai.
    code: "public class CauDao {\n  enum T { DONG, MO, NUA_MO }\n  T t = T.DONG;\n  int hong = 0;\n  long moLuc;\n  static final int NGUONG = 3;\n  static final long CHO = 1000;\n  boolean choPhep(long\
      \ ms) {\n    if (t == T.MO) {\n      if (ms - moLuc < CHO) return false;\n      t = T.NUA_MO;                      // hết thời gian chờ: cho thử một cuộc\n    }\n    return true;\n  }\n  void ghi(boolean\
      \ tot, long ms) {\n    if (t == T.NUA_MO) {\n      if (tot) { t = T.DONG; hong = 0; } else { t = T.MO; moLuc = ms; }\n    } else if (tot) {\n      hong = 0;\n    } else if (++hong >= NGUONG) {\n \
      \     t = T.MO;\n      moLuc = ms;\n    }\n  }\n  public static void main(String[] a) {\n    CauDao c = new CauDao();\n    int that = 0, tuChoi = 0;\n    for (long ms = 0; ms <= 4000; ms += 500) {\n\
      \      boolean tot = ms > 2500;           // dịch vụ hỏng tới 2500 ms rồi hồi phục\n      if (!c.choPhep(ms)) {\n        tuChoi++;\n        System.out.println(\"t=\" + ms + \" tu choi (cau dao MO)\"\
      );\n        continue;\n      }\n      c.ghi(tot, ms);\n      System.out.println(\"t=\" + ms + (tot ? \" thanh cong\" : \" that bai\") + \" -> \" + c.t);\n    }\n    System.out.println(\"tong: \" +\
      \ (9 - tuChoi) + \" cuoc goi that, \" + tuChoi + \" cuoc bi chan\");\n  }\n}"
  L30_VachNgan:
    lang: java
    java_class: VachNgan
    kind: other
    reason: 'VachNgan.java: vách ngăn bằng Semaphore: hạn chế số cuộc gọi đồng thời tới một dịch vụ phụ thuộc.'
    read_check: Biên dịch và chạy trong nguồn L30_ChayTuCai.
    code: "import java.util.concurrent.*;\npublic class VachNgan {\n  public static void main(String[] a) throws Exception {\n    Semaphore ngan = new Semaphore(2);\n    CountDownLatch dangGiu = new CountDownLatch(2),\
      \ nha = new CountDownLatch(1);\n    for (int i = 0; i < 2; i++)\n      new Thread(() -> {\n        ngan.tryAcquire();\n        dangGiu.countDown();\n        try { nha.await(); } catch (InterruptedException\
      \ e) { }\n        ngan.release();\n      }).start();\n    dangGiu.await();\n    int nhan = 0, tuChoi = 0;\n    for (int i = 0; i < 3; i++)\n      if (ngan.tryAcquire()) nhan++; else tuChoi++;\n  \
      \  System.out.println(\"2 cuoc dang cham: them 3 cuoc -> nhan \" + nhan + \", tu choi \" + tuChoi);\n    nha.countDown();\n    Thread.sleep(200);\n    System.out.println(\"sau khi 2 cuoc cham xong:\
      \ con \" + ngan.availablePermits() + \" cho trong\");\n  }\n}"
  L30_GioiHan:
    lang: java
    java_class: GioiHan
    kind: other
    reason: 'GioiHan.java: giới hạn tốc độ kiểu xô token với đồng hồ giả.'
    read_check: Biên dịch và chạy trong nguồn L30_ChayTuCai.
    code: "public class GioiHan {\n  double thung = 5;                       // xô token, dung tích 5\n  long truoc = 0;\n  boolean cho(long ms) {\n    thung = Math.min(5, thung + (ms - truoc) / 1000.0\
      \ * 2);   // nạp 2 token mỗi giây\n    truoc = ms;\n    if (thung >= 1) { thung -= 1; return true; }\n    return false;\n  }\n  public static void main(String[] a) {\n    GioiHan g = new GioiHan();\n\
      \    int ok = 0;\n    for (int i = 0; i < 12; i++) if (g.cho(0)) ok++;\n    System.out.println(\"12 yeu cau cung luc luc 0 ms: nhan \" + ok + \", tu choi \" + (12 - ok));\n    ok = 0;\n    for (int\
      \ i = 0; i < 12; i++) if (g.cho(1000)) ok++;\n    System.out.println(\"12 yeu cau cung luc sau 1 giay: nhan \" + ok);\n  }\n}"
  L30_CanBang:
    lang: java
    java_class: CanBang
    kind: other
    reason: 'CanBang.java: so sánh chia xoay vòng với chia cho máy ít kết nối nhất (mô phỏng, đồng hồ giả).'
    read_check: Biên dịch và chạy trong nguồn L30_ChayTuCai.
    code: "public class CanBang {\n  static int[] chay(boolean it) {\n    int[] dur = {100, 10, 10, 10, 10, 10, 10, 10};   // mili giây mỗi yêu cầu\n    int[] max = {0, 0};\n    long[][] ketThuc = new long[2][8];\n\
      \    int[] soCuoc = {0, 0};\n    for (int i = 0; i < dur.length; i++) {\n      long ms = i * 10L;                 // yêu cầu i đến lúc i × 10 ms\n      int[] dang = new int[2];\n      for (int s =\
      \ 0; s < 2; s++)\n        for (int k = 0; k < soCuoc[s]; k++) if (ketThuc[s][k] > ms) dang[s]++;\n      int s = it ? (dang[1] < dang[0] ? 1 : 0) : i % 2;\n      ketThuc[s][soCuoc[s]++] = ms + dur[i];\n\
      \      dang[s]++;\n      max[s] = Math.max(max[s], dang[s]);\n    }\n    return max;\n  }\n  public static void main(String[] a) {\n    int[] v = chay(false), l = chay(true);\n    System.out.println(\"\
      xoay vong: toi da dong thoi may 1 = \" + v[0] + \", may 2 = \" + v[1]);\n    System.out.println(\"it ket noi nhat: toi da dong thoi may 1 = \" + l[0] + \", may 2 = \" + l[1]);\n  }\n}"
  L30_QuyMo:
    lang: java
    java_class: QuyMo
    kind: other
    reason: 'QuyMo.java: số cuộc gọi tới dịch vụ đang hỏng, có và không có cầu dao (dùng lớp CauDao).'
    read_check: Biên dịch cùng CauDao.java và chạy trong nguồn L30_ChayTuCai.
    code: "public class QuyMo {\n  public static void main(String[] a) {\n    for (int n : new int[] {100, 10000}) {\n      CauDao c = new CauDao();\n      int that = 0;\n      for (int i = 0; i < n; i++)\
      \ {\n        long ms = i * 10000L / n;          // n yêu cầu rải đều trong 10 giây sự cố\n        if (!c.choPhep(ms)) continue;\n        c.ghi(false, ms);\n        that++;\n      }\n      System.out.println(n\
      \ + \" yeu cau, 10 giay su co: thu lai 3 lan khong cau dao \"\n          + 4 * n + \" cuoc goi, co cau dao \" + that);\n    }\n  }\n}"
  L30_R4j:
    lang: java
    java_class: R4j
    kind: other
    reason: 'R4j.java: cùng mô hình cầu dao bằng Resilience4j 2.3.0 thật (cửa sổ đếm 4, ngưỡng 50%, chờ 1 giây).'
    read_check: Biên dịch cùng jar Resilience4j và chạy trong nguồn L30_ChayR4j.
    code: "import io.github.resilience4j.circuitbreaker.*;\nimport java.time.Duration;\npublic class R4j {\n  public static void main(String[] a) throws Exception {\n    var cfg = CircuitBreakerConfig.custom()\n\
      \        .slidingWindowType(CircuitBreakerConfig.SlidingWindowType.COUNT_BASED)\n        .slidingWindowSize(4).minimumNumberOfCalls(4)\n        .failureRateThreshold(50)\n        .waitDurationInOpenState(Duration.ofMillis(1000))\n\
      \        .permittedNumberOfCallsInHalfOpenState(1).build();\n    CircuitBreaker cb = CircuitBreaker.of(\"dich-vu\", cfg);\n    cb.getEventPublisher().onStateTransition(e ->\n        System.out.println(\"\
      chuyen: \" + e.getStateTransition()));\n    int tuChoi = 0;\n    for (int i = 1; i <= 6; i++) {\n      try {\n        cb.executeRunnable(() -> { throw new IllegalStateException(\"hong\"); });\n  \
      \    } catch (CallNotPermittedException e) {\n        tuChoi++;\n      } catch (IllegalStateException e) { }\n    }\n    System.out.println(\"sau 6 cuoc hong: trang thai \" + cb.getState() + \", bi\
      \ chan \" + tuChoi);\n    Thread.sleep(1100);\n    cb.executeRunnable(() -> { });\n    System.out.println(\"sau khi cho 1,1 giay va 1 cuoc tot: \" + cb.getState());\n  }\n}"
  L30_ChayTuCai:
    lang: bash
    timeout: 200
    reason: 'ChayTuCai: chạy nguyên văn.'
    claims:
    - 'thử lại: hỏng 2 lần thì thành công ở lần 3 chờ 300 ms; hỏng 5 lần thì thất bại sau 4 lần chờ 700 ms'
    - 'cầu dao ba trạng thái: 7 cuộc gọi thật, 2 cuộc bị chặn'
    - 'vách ngăn: 2 chỗ, thêm 3 cuộc thì nhận 0 từ chối 3'
    - 'xô token: 5 nhận 7 từ chối, sau 1 giây nhận 2'
    - 'chia xoay vòng: máy 1 chồng tới 4 cuộc đồng thời; ít kết nối nhất: 2'
    expect_stdout: 'hong 2 lan, toi da 4: thanh cong o lan 3, cho tong 300 ms

      hong 5 lan, toi da 4: that bai sau 4 lan, cho tong 700 ms

      hong 0 lan, toi da 4: thanh cong o lan 1, cho tong 0 ms

      t=0 that bai -> DONG

      t=500 that bai -> DONG

      t=1000 that bai -> MO

      t=1500 tu choi (cau dao MO)

      t=2000 that bai -> MO

      t=2500 tu choi (cau dao MO)

      t=3000 thanh cong -> DONG

      t=3500 thanh cong -> DONG

      t=4000 thanh cong -> DONG

      tong: 7 cuoc goi that, 2 cuoc bi chan

      2 cuoc dang cham: them 3 cuoc -> nhan 0, tu choi 3

      sau khi 2 cuoc cham xong: con 2 cho trong

      12 yeu cau cung luc luc 0 ms: nhan 5, tu choi 7

      12 yeu cau cung luc sau 1 giay: nhan 2

      xoay vong: toi da dong thoi may 1 = 2, may 2 = 1

      it ket noi nhat: toi da dong thoi may 1 = 1, may 2 = 1

      100 yeu cau, 10 giay su co: thu lai 3 lan khong cau dao 400 cuoc goi, co cau dao 12

      10000 yeu cau, 10 giay su co: thu lai 3 lan khong cau dao 40000 cuoc goi, co cau dao 12'
    files:
      ThuLai.java: src:BNX:L30_ThuLai
      CauDao.java: src:BNX:L30_CauDao
      VachNgan.java: src:BNX:L30_VachNgan
      GioiHan.java: src:BNX:L30_GioiHan
      CanBang.java: src:BNX:L30_CanBang
      QuyMo.java: src:BNX:L30_QuyMo
    code: "javac -encoding UTF-8 ThuLai.java CauDao.java VachNgan.java GioiHan.java CanBang.java QuyMo.java\nfor c in ThuLai CauDao VachNgan GioiHan CanBang QuyMo; do\n  java -Dstdout.encoding=UTF-8 $c\n\
      done"
  L30_ChayR4j:
    lang: bash
    timeout: 200
    reason: 'ChayR4j: chạy nguyên văn.'
    claims:
    - 'Resilience4j thật: CLOSED → OPEN sau 4 cuộc hỏng, các cuộc sau bị chặn, sau 1 giây OPEN → HALF_OPEN → CLOSED'
    expect_stdout: 'chuyen: State transition from CLOSED to OPEN

      sau 6 cuoc hong: trang thai OPEN, bi chan 2

      chuyen: State transition from OPEN to HALF_OPEN

      chuyen: State transition from HALF_OPEN to CLOSED

      sau khi cho 1,1 giay va 1 cuoc tot: CLOSED'
    files:
      R4j.java: src:BNX:L30_R4j
    code: 'D=/d/research-video/audit/bnx/deps/l30

      ls $D/resilience4j-circuitbreaker-2.3.0.jar >/dev/null 2>&1 || { echo "NOT_VERIFIED: thiếu jar" >&2; exit 97; }

      mkdir -p lib out && cp $D/*.jar lib/

      javac -encoding UTF-8 -cp "lib/*" -d out R4j.java

      java -Dstdout.encoding=UTF-8 -cp "out;lib/*" R4j 2>/dev/null'
  LAB_L30:
    lang: python
    expect_stdout: 't=0 hong -> DONG

      t=300 hong -> MO

      t=600 chan

      t=900 hong -> MO

      t=1200 chan

      t=1500 tot -> DONG

      t=1800 tot -> DONG

      t=2100 tot -> DONG

      t=2400 tot -> DONG

      t=2700 tot -> DONG

      t=3000 tot -> DONG

      goi that 9, bi chan 2'
    code: "class CauDao:\n    def __init__(self, nguong, cho):\n        self.nguong, self.cho = nguong, cho\n        self.t, self.hong, self.mo_luc = \"DONG\", 0, 0\n\n    def cho_phep(self, ms):\n    \
      \    if self.t == \"MO\":\n            if ms - self.mo_luc < self.cho:\n                return False\n            self.t = \"NUA_MO\"\n        return True\n\n    def ghi(self, tot, ms):\n        if\
      \ self.t == \"NUA_MO\":\n            if tot:\n                self.t, self.hong = \"DONG\", 0\n            else:\n                self.t, self.mo_luc = \"MO\", ms\n        elif tot:\n            self.hong\
      \ = 0\n        else:\n            self.hong += 1\n            if self.hong >= self.nguong:\n                self.t, self.mo_luc = \"MO\", ms\n\n\nc = CauDao(2, 600)\nthat = chan = 0\nfor ms in range(0,\
      \ 3001, 300):\n    tot = ms >= 1500\n    if not c.cho_phep(ms):\n        chan += 1\n        print(f\"t={ms} chan\")\n        continue\n    c.ghi(tot, ms)\n    that += 1\n    print(f\"t={ms} {'tot'\
      \ if tot else 'hong'} -> {c.t}\")\nprint(f\"goi that {that}, bi chan {chan}\")"
