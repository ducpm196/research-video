sources:
  L14_Bucket:
    lang: python
    timeout: 120
    reason: 'Bucket: chạy nguyên văn.'
    claims:
    - 'thùng token 5/giây, sức chứa 10: 30 yêu cầu cùng lúc nhận 10; rải đều trong 1 giây nhận 14'
    expect_stdout: '10

      14'
    code: "from fractions import Fraction as F\ndef cong(rate, cap, times):          # cổng: tốc độ, sức chứa\n    tok, last, ok = F(cap), F(0), 0  # thùng đầy lúc đầu\n    for t in times:\n        tok\
      \ = min(F(cap), tok + (t - last) * rate)\n        last = t\n        if tok >= 1:                 # còn ít nhất 1 thẻ\n            tok, ok = tok - 1, ok + 1\n    return ok\nprint(cong(5, 10, [F(0)]\
      \ * 30))                    # cùng lúc\nprint(cong(5, 10, [F(i, 30) for i in range(30)]))  # rải đều"
  L14_Quymo:
    lang: python
    timeout: 240
    reason: 'Quymo: chạy nguyên văn.'
    claims:
    - '1, 100 và 10 000 bên thứ ba, mỗi bên gửi 30 yêu cầu: cùng lúc nhận 10, 1 000, 100 000 (từ chối 20, 2 000, 200 000); rải đều nhận 14, 1 400, 140 000'
    expect_stdout: '1 10 14 20

      100 1000 1400 2000

      10000 100000 140000 200000'
    unverified_claims:
    - 'hậu phương chịu 2 000 yêu cầu/giây và thời gian 5 ms, 0,5 giây, 50 giây để xử lý hết: số minh hoạ tính từ số yêu cầu đo thật chia cho 2 000; không đo hệ thống thật'
    code: "from fractions import Fraction as F\ndef nhan(rate, cap, times):\n    tok, last, ok = F(cap), F(0), 0\n    for t in times:\n        tok = min(F(cap), tok + (t - last) * rate)\n        last =\
      \ t\n        if tok >= 1:\n            tok, ok = tok - 1, ok + 1\n    return ok\n\ndong = [F(0)] * 30\nrai = [F(i, 30) for i in range(30)]\nfor n in (1, 100, 10_000):\n    a = sum(nhan(5, 10, dong)\
      \ for _ in range(n))\n    b = sum(nhan(5, 10, rai) for _ in range(n))\n    print(n, a, b, 30 * n - a)"
  LAB_L14:
    lang: python
    expect_stdout: 'dong 20 yeu cau: nhan 6 tu choi 14

      rai deu: nhan 13 can tren 13

      50 ben dong: 300 qua cong, 700 tu choi

      hang cho 2.5 giay neu hau phuong chiu 120 yeu cau/giay'
    code: "from fractions import Fraction as F\n\n\ndef nhan(rate, cap, times):\n    tok, last, ok = F(cap), F(0), 0\n    for t in times:\n        tok = min(F(cap), tok + (t - last) * rate)\n        last\
      \ = t\n        if tok >= 1:\n            tok, ok = tok - 1, ok + 1\n    return ok\n\n\ndong = [F(0)] * 20\nrai = [F(i, 10) for i in range(20)]\na = nhan(4, 6, dong)\nprint(\"dong 20 yeu cau: nhan\"\
      , a, \"tu choi\", 20 - a)\nb = nhan(4, 6, rai)\nprint(\"rai deu: nhan\", b, \"can tren\", int(6 + 4 * F(19, 10)))\nn = 50\nprint(n, \"ben dong:\", n * a, \"qua cong,\", n * (20 - a), \"tu choi\")\n\
      print(\"hang cho\", n * a / 120, \"giay neu hau phuong chiu 120 yeu cau/giay\")"
