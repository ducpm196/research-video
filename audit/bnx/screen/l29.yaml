sources:
  L29_KhoSuKien:
    lang: python
    timeout: 120
    reason: 'KhoSuKien: chạy nguyên văn.'
    claims:
    - 'kho sự kiện chỉ thêm: UPDATE và DELETE bị chặn, còn 3 sự kiện'
    expect_stdout: 'sua su kien: kho su kien chi them, khong sua

      xoa su kien: kho su kien chi them, khong xoa

      so su kien: 3'
    code: "import sqlite3\n\ndb = sqlite3.connect(\":memory:\")\ndb.executescript(\"\"\"\nCREATE TABLE su_kien (seq INTEGER PRIMARY KEY AUTOINCREMENT, tk TEXT, loai TEXT, tien INTEGER);\nCREATE TRIGGER\
      \ khong_sua BEFORE UPDATE ON su_kien\nBEGIN SELECT RAISE(ABORT, 'kho su kien chi them, khong sua'); END;\nCREATE TRIGGER khong_xoa BEFORE DELETE ON su_kien\nBEGIN SELECT RAISE(ABORT, 'kho su kien\
      \ chi them, khong xoa'); END;\n\"\"\")\ndef ghi(tk, loai, tien):\n    db.execute(\"INSERT INTO su_kien (tk, loai, tien) VALUES (?, ?, ?)\", (tk, loai, tien))\nghi(\"001\", \"NAP\", 1000)\nghi(\"001\"\
      , \"RUT\", 300)\nghi(\"001\", \"NAP\", 50)\ntry:\n    db.execute(\"UPDATE su_kien SET tien = 900 WHERE seq = 2\")\nexcept sqlite3.DatabaseError as e:\n    print(\"sua su kien:\", e)\ntry:\n    db.execute(\"\
      DELETE FROM su_kien WHERE seq = 2\")\nexcept sqlite3.DatabaseError as e:\n    print(\"xoa su kien:\", e)\nprint(\"so su kien:\", db.execute(\"SELECT COUNT(*) FROM su_kien\").fetchone()[0])"
  L29_PhatLai:
    lang: python
    timeout: 120
    reason: 'PhatLai: chạy nguyên văn.'
    claims:
    - 'số dư dựng lại bằng phát lại sự kiện: 1000, 700, 750, 630'
    expect_stdout: 'sau su kien 1: 1000

      sau su kien 2: 700

      sau su kien 3: 750

      sau su kien 4: 630

      phat lai tu dau: 4 su kien -> 630'
    code: "SU_KIEN = [(\"NAP\", 1000), (\"RUT\", 300), (\"NAP\", 50), (\"RUT\", 120)]\n\ndef ap_dung(so_du, su_kien):\n    loai, tien = su_kien\n    return so_du + tien if loai == \"NAP\" else so_du - tien\n\
      \nso_du = 0\nfor i, sk in enumerate(SU_KIEN, 1):\n    so_du = ap_dung(so_du, sk)\n    print(f\"sau su kien {i}: {so_du}\")\nprint(\"phat lai tu dau:\", sum(1 for _ in SU_KIEN), \"su kien ->\", so_du)"
  L29_BuChu:
    lang: python
    timeout: 120
    reason: 'BuChu: chạy nguyên văn.'
    claims:
    - 'sửa sai bằng sự kiện bù: số dư đúng 580, kho có 7 sự kiện'
    expect_stdout: 'sau su kien sai: 130

      sau khi bu: 580 | 7 su kien'
    code: "from functools import reduce\n\ndef ap_dung(so_du, su_kien):\n    loai, tien = su_kien\n    return so_du + tien if loai == \"NAP\" else so_du - tien\n\nkho = [(\"NAP\", 1000), (\"RUT\", 300),\
      \ (\"NAP\", 50), (\"RUT\", 120)]\nsai = (\"RUT\", 500)       # ghi nhầm, đáng ra 50\nkho.append(sai)\nprint(\"sau su kien sai:\", reduce(ap_dung, kho, 0))\nkho.append((\"NAP\", 500))  # sự kiện bù\n\
      kho.append((\"RUT\", 50))   # sự kiện đúng\nprint(\"sau khi bu:\", reduce(ap_dung, kho, 0), \"|\", len(kho), \"su kien\")"
  L29_BanChup:
    lang: python
    timeout: 120
    reason: 'BanChup: chạy nguyên văn.'
    claims:
    - 'quy mô: 2 500 và 2 500 500 sự kiện; có bản chụp mỗi 1000 sự kiện thì chỉ đọc 500'
    expect_stdout: '2500 su kien: khong ban chup doc 2500, chup moi 1000 su kien doc 500

      2500500 su kien: khong ban chup doc 2500500, chup moi 1000 su kien doc 500'
    code: "def doc_bao_nhieu(n, k):\n    \"\"\"Số sự kiện phải đọc tại sự kiện thứ n.\n    k = 0: không bản chụp, đọc hết n; k > 0: nạp bản chụp, đọc phần dư.\"\"\"\n    return n if k == 0 else n % k\n\n\
      for n in (2500, 2500500):\n    print(f\"{n} su kien: khong ban chup doc {doc_bao_nhieu(n, 0)}, chup moi 1000 su kien doc {doc_bao_nhieu(n, 1000)}\")"
  L29_DocTre:
    lang: python
    timeout: 120
    reason: 'DocTre: chạy nguyên văn.'
    claims:
    - 'mô hình đọc đọc trễ: 700 khi mới chiếu 2/3 sự kiện, 750 khi chiếu hết'
    expect_stdout: 'doc sau khi chieu 2/3 su kien: 700 (da xu ly 2 / 3 )

      doc sau khi chieu het: 750 (da xu ly 3 / 3 )'
    code: "su_kien = []                       # kho ghi: nguồn sự thật\ndoc = {\"001\": 0}                   # mô hình đọc (bảng tóm tắt)\nda_xu_ly = 0                       # vị trí đã chiếu\n\ndef ghi(loai,\
      \ tien):\n    su_kien.append((loai, tien))\n\ndef chieu(toi_da):\n    global da_xu_ly\n    while da_xu_ly < len(su_kien) and toi_da > 0:\n        loai, tien = su_kien[da_xu_ly]\n        doc[\"001\"\
      ] += tien if loai == \"NAP\" else -tien\n        da_xu_ly += 1\n        toi_da -= 1\n\nghi(\"NAP\", 1000); ghi(\"RUT\", 300); ghi(\"NAP\", 50)\nchieu(2)\nprint(\"doc sau khi chieu 2/3 su kien:\",\
      \ doc[\"001\"], \"(da xu ly\", da_xu_ly, \"/\", len(su_kien), \")\")\nchieu(5)\nprint(\"doc sau khi chieu het:\", doc[\"001\"], \"(da xu ly\", da_xu_ly, \"/\", len(su_kien), \")\")"
  L29_QuyMoPhat:
    lang: python
    timeout: 200
    reason: 'QuyMoPhat: chạy nguyên văn.'
    claims:
    - 'dựng lại số dư từ 10^3 và 10^6 sự kiện: đọc đúng ngần ấy sự kiện'
    expect_stdout: '1000 su kien: da doc 1000 su kien, so du -15

      1000000 su kien: da doc 1000000 su kien, so du 35'
    code: "import sqlite3\ndb = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE sk (seq INTEGER PRIMARY KEY, loai INTEGER, tien INTEGER)\")\ndb.executemany(\"INSERT INTO sk (loai, tien) VALUES\
      \ (?, ?)\",\n               ((i % 2, i % 97 + 1) for i in range(1000000)))\ndef dung_lai(toi):\n    so_du, dem = 0, 0\n    for loai, tien in db.execute(\"SELECT loai, tien FROM sk WHERE seq <= ?\"\
      , (toi,)):\n        so_du += tien if loai == 0 else -tien\n        dem += 1\n    return so_du, dem\nfor n in (1000, 1000000):\n    so_du, dem = dung_lai(n)\n    print(f\"{n} su kien: da doc {dem}\
      \ su kien, so du {so_du}\")"
  L29_BangSoDu:
    lang: python
    timeout: 120
    reason: 'BangSoDu: chạy nguyên văn.'
    claims:
    - bảng số dư chỉ giữ giá trị cuối 630
    expect_stdout: 'bang so du: 630 - khong the biet 630 den tu dau

      so_du sau 3 lan cap nhat dau tien: khong con de doc lai'
    code: "import sqlite3\n\ndb = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE tk (so TEXT PRIMARY KEY, so_du INTEGER)\")\ndb.execute(\"INSERT INTO tk VALUES ('001', 0)\")\nfor loai, tien in\
      \ [(\"NAP\", 1000), (\"RUT\", 300), (\"NAP\", 50), (\"RUT\", 120)]:\n    dau = 1 if loai == \"NAP\" else -1\n    db.execute(\"UPDATE tk SET so_du = so_du + ? WHERE so = '001'\", (dau * tien,))\nprint(\"\
      bang so du:\", db.execute(\"SELECT so_du FROM tk\").fetchone()[0], \"- khong the biet 630 den tu dau\")\nprint(\"so_du sau 3 lan cap nhat dau tien: khong con de doc lai\")"
  LAB_L29:
    lang: python
    expect_stdout: 'phat lai het: 500 (doc 6 su kien)

      ban chup tai su kien 4 : 550

      phat lai tu ban chup: 500 (doc 2 su kien)

      sau khi bu su kien rut nham: 500'
    code: "def ap_dung(so_du, sk):\n    loai, tien = sk\n    return so_du + tien if loai == \"NAP\" else so_du - tien\n\n\ndef phat_lai(kho, tu=0, so_du=0):\n    for sk in kho[tu:]:\n        so_du = ap_dung(so_du,\
      \ sk)\n    return so_du\n\n\nkho = [(\"NAP\", 500), (\"RUT\", 100), (\"NAP\", 200), (\"RUT\", 50), (\"NAP\", 25), (\"RUT\", 75)]\nprint(\"phat lai het:\", phat_lai(kho), \"(doc\", len(kho), \"su kien)\"\
      )\nban_chup = (4, phat_lai(kho[:4]))\nprint(\"ban chup tai su kien\", ban_chup[0], \":\", ban_chup[1])\nprint(\"phat lai tu ban chup:\", phat_lai(kho, ban_chup[0], ban_chup[1]), \"(doc\", len(kho)\
      \ - ban_chup[0], \"su kien)\")\nkho += [(\"RUT\", 300), (\"NAP\", 300)]\nprint(\"sau khi bu su kien rut nham:\", phat_lai(kho))"
