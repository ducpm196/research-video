sources:
  L06_ora_proc:
    lang: oracle
    code: |
      CREATE OR REPLACE PROCEDURE bnx_l06_chuyen_tien (
        p_from   IN  NUMBER,
        p_to     IN  NUMBER,
        p_amt    IN  NUMBER,
        p_status OUT VARCHAR2) AS
        v_x   NUMBER;
        v_bal NUMBER;
      BEGIN
        IF p_amt IS NULL OR p_amt <= 0 THEN
          RAISE_APPLICATION_ERROR(-20002, 'So tien phai lon hon 0');
        END IF;
        SELECT so_du INTO v_x FROM bnx_l06_tk
         WHERE id = LEAST(p_from, p_to) FOR UPDATE;
        SELECT so_du INTO v_x FROM bnx_l06_tk
         WHERE id = GREATEST(p_from, p_to) FOR UPDATE;
        SELECT so_du INTO v_bal FROM bnx_l06_tk WHERE id = p_from;
        IF v_bal < p_amt THEN
          RAISE_APPLICATION_ERROR(-20001, 'So du khong du');
        END IF;
        UPDATE bnx_l06_tk SET so_du = so_du - p_amt WHERE id = p_from;
        UPDATE bnx_l06_tk SET so_du = so_du + p_amt WHERE id = p_to;
        COMMIT;
        p_status := 'OK';
      EXCEPTION
        WHEN OTHERS THEN
          ROLLBACK;
          RAISE;
      END;
      /
    prelude_keys:
    - BNX L06 example 0 0
    reason: Thủ tục PL/SQL đầy đủ; màn hình hiện từng đoạn ở cảnh formula bước 1–5 (khối formula 0 0 … 4 0 là fragment within nguồn này). audit/bnx/ver/l06.py
      kiểm văn bản nguồn này trùng từng ký tự với hằng ORA_PROC của audit/bnx/src/l06.py.
    post: SELECT object_name, status FROM user_objects WHERE object_name = 'BNX_L06_CHUYEN_TIEN';
    claims:
    - thủ tục biên dịch được (trạng thái VALID) trên Oracle AI Database 26ai Free 23.26.3
    expect_stdout: "OBJECT_NAME\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t STATUS\n--------------------------------------------------------------------------------------------------------------------------------\
      \ -------\nBNX_L06_CHUYEN_TIEN\t\t\t\t\t\t\t\t\t\t\t\t\t\t VALID\n"
  L06_mss_base:
    lang: mssql
    code: |
      IF DB_ID('bnx_l06') IS NULL CREATE DATABASE bnx_l06;
      GO
      USE bnx_l06;
      GO

      DROP TABLE IF EXISTS dbo.tk;
      CREATE TABLE dbo.tk (
        id    INT PRIMARY KEY,
        ten   VARCHAR(10),
        so_du BIGINT CONSTRAINT ck_so_du CHECK (so_du >= 0));
      INSERT INTO dbo.tk VALUES (1, 'A', 300000), (2, 'B', 1000000);
      GO
    reason: 'Tạo database bnx_l06 và bảng dbo.tk hai tài khoản A = 300 000, B = 1 000 000 (bài nói ở cảnh check: ''chạy trên SQL Server'' với cùng hai tài
      khoản như Oracle); bảng không hiện thành mã trên màn hình, giống bảng Oracle ở khối example 0 0. Chép từ MSS_DB + MSS_SETUP của audit/bnx/src/l06.py.'
    post: SELECT SUM(so_du) AS tong FROM dbo.tk;
    claims:
    - hai tài khoản tổng 1 300 000
    expect_stdout: |
      Changed database context to 'bnx_l06'.

      (2 rows affected)
      1300000

      (1 rows affected)
  L06_mss_proc:
    lang: mssql
    code: |
      CREATE OR ALTER PROCEDURE dbo.chuyen_tien
        @from   INT,
        @to     INT,
        @amt    BIGINT,
        @status VARCHAR(20) OUTPUT
      AS
      BEGIN
        SET NOCOUNT ON;
        SET XACT_ABORT ON;
        DECLARE @x BIGINT, @bal BIGINT;
        BEGIN TRY
          IF @amt IS NULL OR @amt <= 0
            THROW 50002, 'So tien phai lon hon 0', 1;
          BEGIN TRAN;
          SELECT @x = so_du FROM dbo.tk WITH (UPDLOCK, ROWLOCK)
           WHERE id = LEAST(@from, @to);
          SELECT @x = so_du FROM dbo.tk WITH (UPDLOCK, ROWLOCK)
           WHERE id = GREATEST(@from, @to);
          SELECT @bal = so_du FROM dbo.tk WHERE id = @from;
          IF @bal < @amt
            THROW 50001, 'So du khong du', 1;
          UPDATE dbo.tk SET so_du = so_du - @amt WHERE id = @from;
          UPDATE dbo.tk SET so_du = so_du + @amt WHERE id = @to;
          COMMIT;
          SET @status = 'OK';
        END TRY
        BEGIN CATCH
          IF @@TRANCOUNT > 0 ROLLBACK;
          THROW;
        END CATCH
      END;
      GO
    prelude_keys:
    - src:BNX:L06_mss_base
    reason: Thủ tục T-SQL đầy đủ; màn hình hiện ba đoạn ở cảnh check bước 0–2 (fragment within nguồn này). ver/l06.py kiểm trùng hằng MSS_PROC.
    post: SELECT CASE WHEN OBJECT_ID('dbo.chuyen_tien', 'P') IS NOT NULL THEN 'co thu tuc' ELSE 'khong co' END;
    claims:
    - CREATE OR ALTER PROCEDURE chạy được trên SQL Server 2022 CU27 (LEAST/GREATEST có từ bản 2022)
    expect_stdout: |
      Changed database context to 'bnx_l06'.

      (2 rows affected)
      co thu tuc

      (1 rows affected)
