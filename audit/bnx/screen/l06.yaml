sources:
  L06_DemCau:
    lang: python
    timeout: 120
    reason: 'DemCau: chạy nguyên văn.'
    claims:
    - 'ứng dụng tự làm logic: 5 câu lệnh mỗi lần chuyển (BEGIN, SELECT, 2 UPDATE, COMMIT): 10 → 50, 1000 → 5000, 100000 → 500000 câu'
    expect_stdout: '10 chuyen: 50 cau | thu tuc: 10 goi

      1000 chuyen: 5000 cau | thu tuc: 1000 goi

      100000 chuyen: 500000 cau | thu tuc: 100000 goi'
    code: "import sqlite3\ndb = sqlite3.connect(\":memory:\", isolation_level=None)\ndb.execute(\"CREATE TABLE tk (id INT, so_du INT)\")\ndb.execute(\"INSERT INTO tk VALUES (1, 99999999), (2, 0)\")\ndem\
      \ = []\ndb.set_trace_callback(dem.append)      # ghi mỗi câu gửi tới CSDL\ndef chuyen():                          # logic nằm ở ứng dụng\n    for c in (\"BEGIN\", \"SELECT so_du FROM tk WHERE id =\
      \ 1\",\n              \"UPDATE tk SET so_du = so_du - 1 WHERE id = 1\",\n              \"UPDATE tk SET so_du = so_du + 1 WHERE id = 2\", \"COMMIT\"):\n        db.execute(c)\nfor n in (10, 1000, 100000):\n\
      \    dem.clear()\n    for _ in range(n): chuyen()\n    print(n, \"chuyen:\", len(dem), \"cau | thu tuc:\", n, \"goi\")"
  L06_MoHinh:
    lang: python
    timeout: 120
    reason: 'MoHinh: chạy nguyên văn.'
    claims:
    - 'mô hình Python: chuyển 500 000 bị từ chối (loi), số dư giữ nguyên, tổng 1 300 000; chuyển 200 000 thành OK, A 100 000, B 1 200 000, tổng 1 300 000'
    expect_stdout: '500000 loi {1: 300000, 2: 1000000} 1300000

      200000 OK {1: 100000, 2: 1200000} 1300000'
    code: "so_du = {1: 300000, 2: 1000000}\n\n\ndef chuyen(tu, den, tien):\n    if tien <= 0 or so_du[tu] < tien:\n        return \"loi\"\n    so_du[tu] -= tien\n    so_du[den] += tien\n    return \"OK\"\
      \n\n\nfor tien in (500000, 200000):\n    kq = chuyen(1, 2, tien)\n    print(tien, kq, so_du, sum(so_du.values()))"
  LAB_L06:
    lang: python
    expect_stdout: 'chuyen 1->2 300: OK

      chuyen 2->3 900: loi so du khong du

      chuyen 3->1 50: OK

      chuyen 1->3 250: OK

      tong tien: 1200'
    code: "import sqlite3\n\ndb = sqlite3.connect(\":memory:\", isolation_level=None)\ndb.executescript(\"\"\"\nCREATE TABLE tk (id INTEGER PRIMARY KEY, so_du INTEGER CHECK (so_du >= 0));\nINSERT INTO tk\
      \ VALUES (1, 500), (2, 400), (3, 300);\n\"\"\")\n\n\ndef chuyen(a, b, tien):\n    try:\n        db.execute(\"BEGIN\")\n        db.execute(\"UPDATE tk SET so_du = so_du + ? WHERE id = ?\", (tien, b))\n\
      \        db.execute(\"UPDATE tk SET so_du = so_du - ? WHERE id = ?\", (tien, a))\n        db.execute(\"COMMIT\")\n        return \"OK\"\n    except sqlite3.IntegrityError:\n        db.execute(\"ROLLBACK\"\
      )\n        return \"loi so du khong du\"\n\n\nfor a, b, t in [(1, 2, 300), (2, 3, 900), (3, 1, 50), (1, 3, 250)]:\n    print(f\"chuyen {a}->{b} {t}: {chuyen(a, b, t)}\")\nprint(\"tong tien:\", db.execute(\"\
      SELECT SUM(so_du) FROM tk\").fetchone()[0])"
  L06_ora_proc:
    lang: oracle
    code: "CREATE OR REPLACE PROCEDURE bnx_l06_chuyen_tien (\n  p_from   IN  NUMBER,\n  p_to     IN  NUMBER,\n  p_amt    IN  NUMBER,\n  p_status OUT VARCHAR2) AS\n  v_x   NUMBER;\n  v_bal NUMBER;\nBEGIN\n\
      \  IF p_amt IS NULL OR p_amt <= 0 THEN\n    RAISE_APPLICATION_ERROR(-20002, 'So tien phai lon hon 0');\n  END IF;\n  SELECT so_du INTO v_x FROM bnx_l06_tk\n   WHERE id = LEAST(p_from, p_to) FOR UPDATE;\n\
      \  SELECT so_du INTO v_x FROM bnx_l06_tk\n   WHERE id = GREATEST(p_from, p_to) FOR UPDATE;\n  SELECT so_du INTO v_bal FROM bnx_l06_tk WHERE id = p_from;\n  IF v_bal < p_amt THEN\n    RAISE_APPLICATION_ERROR(-20001,\
      \ 'So du khong du');\n  END IF;\n  UPDATE bnx_l06_tk SET so_du = so_du - p_amt WHERE id = p_from;\n  UPDATE bnx_l06_tk SET so_du = so_du + p_amt WHERE id = p_to;\n  COMMIT;\n  p_status := 'OK';\n\
      EXCEPTION\n  WHEN OTHERS THEN\n    ROLLBACK;\n    RAISE;\nEND;\n/\n"
    prelude_keys:
    - BNX L06 prereq 2 0
    reason: Thủ tục PL/SQL đầy đủ; màn hình hiện từng đoạn ở cảnh formula bước 1–5 (khối formula 0 0 … 4 0 là fragment within nguồn này). audit/bnx/ver/l06.py kiểm văn bản nguồn này trùng từng ký tự với
      hằng ORA_PROC của audit/bnx/src/l06.py.
    post: SELECT object_name, status FROM user_objects WHERE object_name = 'BNX_L06_CHUYEN_TIEN';
    claims:
    - thủ tục biên dịch được (trạng thái VALID) trên Oracle AI Database 26ai Free 23.26.3
    expect_stdout: "OBJECT_NAME\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t STATUS\n-------------------------------------------------------------------------------------------------------------------------------- -------\n\
      BNX_L06_CHUYEN_TIEN\t\t\t\t\t\t\t\t\t\t\t\t\t\t VALID\n"
