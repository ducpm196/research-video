sources:
  L31_NhatKy:
    lang: python
    timeout: 120
    reason: 'NhatKy: chạy nguyên văn.'
    claims:
    - nhật ký JSON mỗi dòng một sự kiện; lọc theo mã tương quan a1 dựng lại đường đi cong > tt > sc > cong và mất 35 ms
    expect_stdout: '{"t":1000,"dv":"cong","cid":"a1","ev":"nhan","duong":"/chuyen"}

      {"t":1007,"dv":"cong","cid":"b2","ev":"nhan","duong":"/so-du"}

      {"t":1014,"dv":"tt","cid":"a1","ev":"tru-tien","tien":500}

      {"t":1021,"dv":"tt","cid":"b2","ev":"doc-so-du"}

      {"t":1028,"dv":"sc","cid":"a1","ev":"loi","ma":"HET_GIO"}

      {"t":1035,"dv":"cong","cid":"a1","ev":"tra","http":504}

      a1: cong:nhan > tt:tru-tien > sc:loi > cong:tra

      a1 mat 35 ms'
    code: "import json\ngio = iter(range(1000, 2000, 7))              # dong ho gia, mili giay\nnhat_ky = []\ndef ghi(dv, cid, ev, **them):\n    nhat_ky.append({\"t\": next(gio), \"dv\": dv, \"cid\": cid,\
      \ \"ev\": ev, **them})\nghi(\"cong\", \"a1\", \"nhan\", duong=\"/chuyen\")\nghi(\"cong\", \"b2\", \"nhan\", duong=\"/so-du\")\nghi(\"tt\", \"a1\", \"tru-tien\", tien=500)\nghi(\"tt\", \"b2\", \"doc-so-du\"\
      )\nghi(\"sc\", \"a1\", \"loi\", ma=\"HET_GIO\")\nghi(\"cong\", \"a1\", \"tra\", http=504)\nfor d in nhat_ky:\n    print(json.dumps(d, separators=(\",\", \":\")))\na1 = [d for d in nhat_ky if d[\"\
      cid\"] == \"a1\"]\nprint(\"a1:\", \" > \".join(d[\"dv\"] + \":\" + d[\"ev\"] for d in a1))\nprint(\"a1 mat\", a1[-1][\"t\"] - a1[0][\"t\"], \"ms\")"
  L31_ChiMuc:
    lang: python
    timeout: 180
    reason: 'ChiMuc: chạy nguyên văn.'
    claims:
    - 'chỉ mục đảo: 1 000 dòng xét 2 dòng, 1 000 000 dòng xét 2 000 dòng (khớp 1 và 1 000); quét hết phải đọc cả 1 000 và 1 000 000 dòng'
    expect_stdout: '1000 dong: khop 1 | quet 1000 dong | chi muc xet 2 dong

      1000000 dong: khop 1000 | quet 1000000 dong | chi muc xet 2000 dong'
    code: "DV = [\"cong\", \"tt\", \"sc\", \"kh\", \"tb\"]\nfor n in (1000, 1000000):\n    dong = [(DV[i % 5], \"ERROR\" if i % 1000 in (7, 8) else \"INFO\")\n            for i in range(n)]\n    chi_muc\
      \ = {}\n    for i, (dv, muc) in enumerate(dong):\n        chi_muc.setdefault(muc, []).append(i)\n        chi_muc.setdefault(dv, []).append(i)\n    a, b = chi_muc[\"ERROR\"], set(chi_muc[\"sc\"])\n\
      \    khop = [i for i in a if i in b]\n    print(n, \"dong: khop\", len(khop), \"| quet\", n, \"dong |\",\n          \"chi muc xet\", len(a), \"dong\")"
  L31_XuatChiSo:
    lang: java
    java_class: XuatChiSo
    kind: other
    reason: 'XuatChiSo.java: in văn bản chỉ số theo định dạng văn bản của Prometheus (bộ đếm có nhãn route, code; tuỳ chọn thêm nhãn user).'
    read_check: Chạy bằng `java XuatChiSo.java` trong nguồn L31_ChayMay và L31_DemChuoi; đầu ra khớp từng dòng.
    code: "public class XuatChiSo {\n  public static void main(String[] a) {\n    int nguoi = Integer.parseInt(a[0]);       // 0 = khong gan nhan user\n    String[] duong = {\"/chuyen\", \"/so-du\"};\n\
      \    String[] ma = {\"200\", \"500\"};\n    int[][] so = {{980, 20}, {4990, 10}};\n    StringBuilder s = new StringBuilder();\n    s.append(\"# HELP http_requests_total So yeu cau da nhan.\\n\");\n\
      \    s.append(\"# TYPE http_requests_total counter\\n\");\n    for (int d = 0; d < 2; d++)\n      for (int c = 0; c < 2; c++) {\n        String nhan = \"route=\\\"\" + duong[d] + \"\\\",code=\\\"\"\
      \ + ma[c] + \"\\\"\";\n        if (nguoi == 0)\n          s.append(\"http_requests_total{\" + nhan + \"} \" + so[d][c] + \"\\n\");\n        else\n          for (int u = 1; u <= nguoi; u++)\n     \
      \       s.append(\"http_requests_total{\" + nhan + \",user=\\\"u\" + u + \"\\\"} 1\\n\");\n      }\n    s.append(\"# TYPE dang_xu_ly gauge\\ndang_xu_ly 3\\n\");\n    System.out.print(s);\n  }\n}"
  L31_ChayTest:
    lang: bash
    timeout: 300
    reason: 'ChayTest: chạy nguyên văn.'
    claims:
    - 'promtool (Prometheus 3.16.0) kiểm luật: tốc độ đốt ngân sách lỗi 5 ở phút 10; cảnh báo chưa bắn ở phút 2 (for 2m), bắn ở phút 4; chuỗi lỗi 0,1% không bắn'
    expect_stdout: "Processing test file: test.yml\n  SUCCESS"
    code: "IMG=prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06\ncommand -v docker >/dev/null || { echo \"NOT_VERIFIED: thieu docker\" >&2; exit 97; }\ndocker image\
      \ inspect $IMG >/dev/null 2>&1 || docker pull -q $IMG >/dev/null 2>&1 || { echo \"NOT_VERIFIED: khong co anh Prometheus\" >&2; exit 97; }\ncat > rules.yml <<'EOF'\ngroups:\n- name: bnx\n  rules:\n\
      \  - alert: NganSachChayNhanh\n    expr: |\n      sum(rate(http_requests_total{code=~\"5..\"}[5m]))\n        / sum(rate(http_requests_total[5m])) / 0.001 > 2\n    for: 2m\n    labels: {severity: page}\n\
      EOF\ncat > test.yml <<'EOF'\nrule_files: [rules.yml]\nevaluation_interval: 1m\ntests:\n- interval: 1m\n  input_series:\n  - series: 'http_requests_total{code=\"200\"}'\n    values: '0+995x12'\n  -\
      \ series: 'http_requests_total{code=\"500\"}'\n    values: '0+5x12'\n  promql_expr_test:\n  - expr: |\n      sum(rate(http_requests_total{code=~\"5..\"}[5m]))\n        / sum(rate(http_requests_total[5m]))\
      \ / 0.001\n    eval_time: 10m\n    exp_samples:\n    - value: 5\n  alert_rule_test:\n  - {eval_time: 2m, alertname: NganSachChayNhanh, exp_alerts: []}\n  - eval_time: 4m\n    alertname: NganSachChayNhanh\n\
      \    exp_alerts:\n    - exp_labels: {severity: page}\n- interval: 1m\n  input_series:\n  - series: 'http_requests_total{code=\"200\"}'\n    values: '0+999x12'\n  - series: 'http_requests_total{code=\"\
      500\"}'\n    values: '0+1x12'\n  alert_rule_test:\n  - {eval_time: 10m, alertname: NganSachChayNhanh, exp_alerts: []}\nEOF\ntar cf - rules.yml test.yml | docker run --rm -i --entrypoint sh $IMG \\\
      \n  -c 'cd /tmp && tar x && promtool test rules test.yml'"
  L31_ChayMay:
    lang: bash
    timeout: 300
    reason: 'ChayMay: chạy nguyên văn.'
    claims:
    - 'Prometheus 3.16.0 thật kéo văn bản chỉ số: up = 1; tổng lỗi 500 là 30; tỉ lệ lỗi 0,005'
    expect_stdout: '# HELP http_requests_total So yeu cau da nhan.

      # TYPE http_requests_total counter

      http_requests_total{route="/chuyen",code="200"} 980

      http_requests_total{route="/chuyen",code="500"} 20

      http_requests_total{route="/so-du",code="200"} 4990

      http_requests_total{route="/so-du",code="500"} 10

      # TYPE dang_xu_ly gauge

      dang_xu_ly 3

      up = 1

      loi 500 = 30

      ty le loi = 0.005'
    files:
      XuatChiSo.java: src:BNX:L31_XuatChiSo
    code: "IMG=prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06\ncommand -v docker >/dev/null || { echo \"NOT_VERIFIED: thieu docker\" >&2; exit 97; }\ndocker image\
      \ inspect $IMG >/dev/null 2>&1 || docker pull -q $IMG >/dev/null 2>&1 || { echo \"NOT_VERIFIED: khong co anh Prometheus\" >&2; exit 97; }\njava XuatChiSo.java 0 > metrics\ncat metrics\ncat > prom.yml\
      \ <<'EOF'\nglobal: {scrape_interval: 1s}\nscrape_configs:\n- job_name: bnx\n  fallback_scrape_protocol: PrometheusText0.0.4\n  static_configs: [{targets: ['localhost:9100']}]\nEOF\ncat > in.sh <<'EOF'\n\
      mkdir -p www && cp metrics www/\nbusybox httpd -p 9100 -h www\nprometheus --config.file=prom.yml --storage.tsdb.path=d >/dev/null 2>&1 &\nq() {\n  wget -qO- --post-data \"query=$1\" \\\n    http://localhost:9090/api/v1/query\
      \ 2>/dev/null |\n  sed 's/.*\"value\":\\[[0-9.]*,\"\\([^\"]*\\)\"\\].*/\\1/'\n}\nfor i in $(seq 1 60); do [ \"$(q up)\" = 1 ] && break; sleep 1; done\necho \"up = $(q up)\"\nL='sum(http_requests_total{code=\"\
      500\"})'\necho \"loi 500 = $(q \"$L\")\"\necho \"ty le loi = $(q \"$L/sum(http_requests_total)\")\"\nEOF\ntar cf - metrics prom.yml in.sh | docker run --rm -i --entrypoint sh $IMG \\\n  -c 'cd /tmp\
      \ && tar x && sh in.sh'"
  L31_DemChuoi:
    lang: bash
    timeout: 200
    reason: 'DemChuoi: chạy nguyên văn.'
    claims:
    - 'một lần kéo số liệu: 5 chuỗi 324 byte; thêm nhãn user 100 giá trị: 401 chuỗi 24 287 byte; 10 000 giá trị: 40 001 chuỗi 2 495 695 byte'
    expect_stdout: '0 gia tri nhan user: 5 chuoi, 324 byte

      100 gia tri nhan user: 401 chuoi, 24287 byte

      10000 gia tri nhan user: 40001 chuoi, 2495695 byte'
    files:
      XuatChiSo.java: src:BNX:L31_XuatChiSo
    code: "for n in 0 100 10000; do\n  java XuatChiSo.java $n > m$n\n  echo \"$n gia tri nhan user: $(grep -vc '^#' m$n) chuoi, $(wc -c < m$n) byte\"\ndone"
  LAB_L31:
    lang: python
    expect_stdout: 'c9: gw:nhan > pay:tru > led:ghi > gw:tra

      c9 mat 60 ms

      so dong loi: 1

      toc do dot: 3.0'
    code: "import json\nNK = [\n    '{\"t\":500,\"dv\":\"gw\",\"cid\":\"c9\",\"ev\":\"nhan\"}',\n    '{\"t\":505,\"dv\":\"gw\",\"cid\":\"d4\",\"ev\":\"nhan\"}',\n    '{\"t\":520,\"dv\":\"pay\",\"cid\":\"\
      c9\",\"ev\":\"tru\"}',\n    '{\"t\":526,\"dv\":\"pay\",\"cid\":\"d4\",\"ev\":\"loi\"}',\n    '{\"t\":560,\"dv\":\"gw\",\"cid\":\"c9\",\"ev\":\"tra\"}',\n    '{\"t\":545,\"dv\":\"led\",\"cid\":\"c9\"\
      ,\"ev\":\"ghi\"}',\n]\nSU_KIEN = [json.loads(d) for d in NK]\nc9 = sorted((d for d in SU_KIEN if d[\"cid\"] == \"c9\"), key=lambda d: d[\"t\"])\nprint(\"c9:\", \" > \".join(d[\"dv\"] + \":\" + d[\"\
      ev\"] for d in c9))\nprint(\"c9 mat\", c9[-1][\"t\"] - c9[0][\"t\"], \"ms\")\nloi = sum(1 for d in SU_KIEN if d[\"ev\"] == \"loi\")\nprint(\"so dong loi:\", loi)\nYEU_CAU, YEU_CAU_LOI, SLO = 200,\
      \ 6, 0.99\nprint(\"toc do dot:\", round(YEU_CAU_LOI / YEU_CAU / (1 - SLO), 1))"
