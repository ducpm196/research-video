sources:
  LAB_L05:
    lang: python
    expect_stdout: 'so_cai: xoay 2026-05-30, het han 2026-06-19: can xoay, con 4 ngay

      bao_cao: xoay 2026-09-10, het han 2027-01-10: chua den han xoay

      doi_soat: xoay 2026-05-21, het han 2026-05-31: da het han

      So chung chi can xu ly: 2'
    code: "from datetime import date, timedelta\n\nHOM_NAY = date(2026, 6, 15)\nCHUNG_CHI = [(\"so_cai\", \"2026-04-20\", 60),\n             (\"bao_cao\", \"2026-01-10\", 365),\n             (\"doi_soat\"\
      , \"2026-05-01\", 30)]\n\ncan_xu_ly = 0\nfor ten, cap, han in CHUNG_CHI:\n    ngay_cap = date.fromisoformat(cap)\n    xoay = ngay_cap + timedelta(days=han * 2 // 3)\n    het = ngay_cap + timedelta(days=han)\n\
      \    if HOM_NAY > het:\n        tt = \"da het han\"\n    elif HOM_NAY >= xoay:\n        tt = f\"can xoay, con {(het - HOM_NAY).days} ngay\"\n    else:\n        tt = \"chua den han xoay\"\n    if tt\
      \ != \"chua den han xoay\":\n        can_xu_ly += 1\n    print(f\"{ten}: xoay {xoay}, het han {het}: {tt}\")\nprint(\"So chung chi can xu ly:\", can_xu_ly)"
  L05_certs:
    lang: python
    code: 'import shutil, subprocess

      subprocess.run([shutil.which(''bash''), ''-c'', ''cat ca.sh may.sh xau.sh | bash''], capture_output=True)

      '
    files:
      ca.sh: BNX L05 example 1 0
      may.sh: BNX L05 example 3 0
      xau.sh: BNX L05 example 4 0
    post: 'import os

      assert all(os.path.getsize(f) > 0 for f in [''ca1.crt'', ''ca2.crt'', ''may_chu.crt'', ''may_chu.key'', ''thanh_toan.crt'', ''la_mat.crt'', ''het_han.crt'', ''het_han.key''])

      '
    reason: 'Không hiện trên màn hình: chạy lại NGUYÊN VĂN ba khối bash bước A, B, C (đã ghim sha, ghi vào thư mục chạy qua files) trong một phiên bash để sinh chứng chỉ cho khối Python example 6 0 — bài
      nói rõ chứng chỉ do ba khối đó sinh ra.'
