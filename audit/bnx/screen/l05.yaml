# Sổ mã trên màn hình bài BNX L05 (người soạn bài viết; người điều phối gộp vào audit/review/screen_code/BNX.yaml).
# Mã là hằng ở audit/bnx/src/l05.py; đầu ra trên màn hình dán từ lần chạy thật 2026-11-11.
blocks:
  BNX L05 example 0 0:
    sha: 2ad115fd6348dc5b
    kind: run
    lang: bash
    claims:
    - hai nơi cấp tự ký ca1, ca2; cờ keyUsage keyCertSign (Python 3.13 đòi khi kiểm nghiêm)
    post: 'openssl x509 -in ca1.crt -noout -ext keyUsage | grep -q ''Certificate Sign'' && test -s ca2.crt && test -s ca2.key && echo ok

      '
    expect_stdout: 'ok

      '
    note: 'Chạy bằng Git Bash + OpenSSL 3.5.5 (mingw64). MSYS_NO_PATHCONV=1 chặn Git Bash đổi “/CN=ca1” thành đường dẫn Windows (thử 2026-11-11:
      không có dòng này thì openssl báo “This name is not in that format: ''C:/Program Files/Git/CN=ca1''”).'
  BNX L05 example 1 0:
    sha: 393128fae3ab3cb1
    kind: run
    lang: bash
    prelude_keys:
    - BNX L05 example 0 0
    claims:
    - ca1 ký chứng chỉ máy chủ (tên localhost) và hai khách thanh_toan, ke_toan, hạn 90 ngày
    post: 'openssl verify -CAfile ca1.crt may_chu.crt thanh_toan.crt ke_toan.crt

      openssl x509 -in may_chu.crt -noout -ext subjectAltName | grep -q ''DNS:localhost'' && echo san-ok

      '
    expect_stdout: 'may_chu.crt: OK

      thanh_toan.crt: OK

      ke_toan.crt: OK

      san-ok

      '
  BNX L05 example 2 0:
    sha: 7f101f44f00aaab3
    kind: run
    lang: bash
    prelude_keys:
    - BNX L05 example 0 0
    - BNX L05 example 1 0
    claims:
    - 'openssl verify: thanh_toan OK; la_mat lỗi 20 (unable to get local issuer certificate); het_han lỗi 10 (certificate has expired)'
    expect_rc: 2
    expect_stdout: 'thanh_toan.crt: OK

      '
    expect_stderr_contains: 'error 20 at 0 depth lookup: unable to get local issuer certificate

      error la_mat.crt: verification failed

      error 10 at 0 depth lookup: certificate has expired

      error het_han.crt: verification failed

      '
    note: het_han có hạn 1/1/2025 → 1/4/2025 (tuỳ chọn -not_before/-not_after của openssl req, có từ OpenSSL 3.4; đã chạy với 3.5.5).
  BNX L05 example 3 0:
    sha: d828a1e34fd0dcaf
    kind: syntax
    lang: python
    note: Chạy thật trong khối example 6 0 (prelude_keys nối nguyên văn khối này cùng hai khối Python kia, sau khi sinh chứng chỉ bằng ba khối
      bash đã hiện). Ở đây chỉ kiểm cú pháp vì đứng riêng thì thiếu tệp chứng chỉ / thiếu hàm của khối trước.
  BNX L05 example 4 0:
    sha: b353569bed5af507
    kind: syntax
    lang: python
    note: Chạy thật trong khối example 6 0 (prelude_keys nối nguyên văn khối này cùng hai khối Python kia, sau khi sinh chứng chỉ bằng ba khối
      bash đã hiện). Ở đây chỉ kiểm cú pháp vì đứng riêng thì thiếu tệp chứng chỉ / thiếu hàm của khối trước.
  BNX L05 example 5 0:
    sha: ec419732f942e03d
    kind: syntax
    lang: python
    note: Chạy thật trong khối example 6 0 (prelude_keys nối nguyên văn khối này cùng hai khối Python kia, sau khi sinh chứng chỉ bằng ba khối
      bash đã hiện). Ở đây chỉ kiểm cú pháp vì đứng riêng thì thiếu tệp chứng chỉ / thiếu hàm của khối trước.
  BNX L05 example 6 0:
    sha: d8e3bf9421e94fa7
    kind: run
    lang: python
    prelude_keys:
    - src:BNX:L05_certs
    - BNX L05 example 3 0
    - BNX L05 example 4 0
    - BNX L05 example 5 0
    files:
      ca.sh: BNX L05 example 0 0
      may.sh: BNX L05 example 1 0
      xau.sh: BNX L05 example 2 0
    claims:
    - không chứng chỉ → máy chủ PEER_DID_NOT_RETURN_A_CERTIFICATE; la_mat → unable to get local issuer certificate; het_han → certificate has
      expired; ke_toan (do ca1 ký, còn hạn) → bị cửa ④ từ chối (khách “từ chối”, máy chủ ghi “tên không được phép”); thanh_toan → chào thanh_toan; lỗi phía khách hiện ở lần đọc đầu (TLS 1.3)
    expect_stdout: |
      None
        khách: TLSV13_ALERT_CERTIFICATE_REQUIRED
        máy chủ: ['PEER_DID_NOT_RETURN_A_CERTIFICATE']
      la_mat
        khách: TLSV1_ALERT_UNKNOWN_CA
        máy chủ: ['unable to get local issuer certificate']
      het_han
        khách: SSLV3_ALERT_CERTIFICATE_EXPIRED
        máy chủ: ['certificate has expired']
      ke_toan
        khách: từ chối
        máy chủ: ['tên không được phép']
      thanh_toan
        khách: chào thanh_toan
        máy chủ: []
    timeout: 120
    note: Máy chủ TLS thật (ssl, CERT_REQUIRED) ở 127.0.0.1 cổng ngẫu nhiên. Nguồn src:BNX:L05_certs chỉ chạy lại ba khối bash đã hiện (ghi vào
      thư mục chạy qua files) để có tệp chứng chỉ, rồi ba khối Python đã hiện được nối nguyên văn. 30/30 lần chạy 2026-11-11 cho cùng đầu ra (máy
      chủ đợi khách đọc xong mới đóng, tránh RST trên Windows).
