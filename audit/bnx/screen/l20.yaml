sources:
  L20_loi:
    lang: go
    code: "package main\n\nimport (\n  \"errors\"\n  \"fmt\"\n)\n\ntype TaiKhoan struct {\n  So   string\n  SoDu int\n}\n\nfunc rut(tk TaiKhoan,\
      \ tien int) (TaiKhoan, error) {\n  if tien > tk.SoDu {\n    return tk, errors.New(\"không đủ số dư\")\n  }\n  tk.SoDu -= tien\n  return\
      \ tk, nil\n}\n\nfunc main() {\n  tk := TaiKhoan{So: \"001\", SoDu: 500}\n  for _, tien := range []int{200, 400} {\n    moi, err := rut(tk,\
      \ tien)\n    if err != nil {\n      fmt.Println(\"rút\", tien, \"lỗi:\", err, \"- số dư vẫn\", tk.SoDu)\n      continue\n    }\n    tk =\
      \ moi\n    fmt.Println(\"rút\", tien, \"xong, còn\", tk.SoDu)\n  }\n}\n"
    reason: Tệp main.go (TaiKhoanLoi) đầy đủ (hằng G_LOI ở audit/bnx/src/l20.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - rút 200 xong còn 300; rút 400 báo không đủ số dư và số dư vẫn 300
    expect_stdout: 'rút 200 xong, còn 300

      rút 400 lỗi: không đủ số dư - số dư vẫn 300

      '
    timeout: 240
  L20_dem:
    lang: go
    code: "package main\n\nimport (\n  \"fmt\"\n  \"sync\"\n)\n\nfunc main() {\n  var nhom sync.WaitGroup\n  var khoa sync.Mutex\n  dem := 0\n\
      \  for i := 0; i < 1000; i++ {\n    nhom.Add(1)\n    go func() {\n      defer nhom.Done()\n      khoa.Lock()\n      dem++\n      khoa.Unlock()\n\
      \    }()\n  }\n  nhom.Wait()\n  fmt.Println(\"bộ đếm:\", dem)\n}\n"
    reason: Tệp main.go (DemCoKhoa) đầy đủ (hằng G_DEM ở audit/bnx/src/l20.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - một nghìn luồng nhẹ, mỗi luồng cộng một trong khoá, bộ đếm đúng một nghìn
    expect_stdout: 'bộ đếm: 1000

      '
    timeout: 240
  L20_khong:
    lang: go
    kind: syntax
    code: "package main\n\nimport (\n  \"fmt\"\n  \"sync\"\n)\n\nfunc main() {\n  var nhom sync.WaitGroup\n  dem := 0\n  for i := 0; i < 1000;\
      \ i++ {\n    nhom.Add(1)\n    go func() {\n      defer nhom.Done()\n      dem++\n    }()\n  }\n  nhom.Wait()\n  fmt.Println(\"bộ đếm:\"\
      , dem)\n}\n"
    reason: 'Tệp DemKhongKhoa (hằng G_KHONG): kiểm cú pháp bằng gofmt -e; kết quả của nó ngẫu nhiên nên không ghim đầu ra, chỉ khối go run -race
      (example 5 1) chạy nó.'
    unverified_claims:
    - 'bộ đếm không khoá thường thấp hơn 1000 (ver/l20.py: 30 lần, 28 lần thấp hơn)'
  L20_kenh:
    lang: go
    code: "package main\n\nimport \"fmt\"\n\nfunc thuGui(ch chan int, v int) {\n  select {\n  case ch <- v:\n    fmt.Println(\"gửi\", v, \"xong,\
      \ đang chứa\", len(ch))\n  default:\n    fmt.Println(\"gửi\", v, \"phải chờ bên nhận\")\n  }\n}\n\nfunc main() {\n  ch := make(chan int,\
      \ 3)\n  for v := 1; v <= 4; v++ {\n    thuGui(ch, v)\n  }\n  fmt.Println(\"nhận\", <-ch)\n  thuGui(ch, 4)\n  khong := make(chan int)\n \
      \ thuGui(khong, 1)\n}\n"
    reason: Tệp main.go (KenhCoDem) đầy đủ (hằng G_KENH ở audit/bnx/src/l20.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - ba giá trị đầu vào đệm, giá trị thứ bốn phải chờ, nhận một rồi gửi bốn được; kênh không đệm không bên nhận thì phải chờ
    expect_stdout: 'gửi 1 xong, đang chứa 1

      gửi 2 xong, đang chứa 2

      gửi 3 xong, đang chứa 3

      gửi 4 phải chờ bên nhận

      nhận 1

      gửi 4 xong, đang chứa 3

      gửi 1 phải chờ bên nhận

      '
    timeout: 240
  L20_http:
    lang: go
    code: "package main\n\nimport (\n  \"fmt\"\n  \"io\"\n  \"net\"\n  \"net/http\"\n  \"strings\"\n)\n\nfunc sucKhoe(w http.ResponseWriter, r\
      \ *http.Request) {\n  w.Header().Set(\"Content-Type\", \"application/json\")\n  fmt.Fprint(w, `{\"trang_thai\":\"ok\"}`)\n}\n\nfunc main()\
      \ {\n  mux := http.NewServeMux()\n  mux.HandleFunc(\"GET /suc-khoe\", sucKhoe)\n  ln, err := net.Listen(\"tcp\", \"127.0.0.1:0\")\n  if\
      \ err != nil {\n    fmt.Println(\"không mở được cổng:\", err)\n    return\n  }\n  go http.Serve(ln, mux)\n  goc := \"http://\" + ln.Addr().String()\n\
      \  goi(goc, \"GET\", \"/suc-khoe\")\n  goi(goc, \"POST\", \"/suc-khoe\")\n  goi(goc, \"GET\", \"/khong-co\")\n}\n\nfunc goi(goc, pt, duong\
      \ string) {\n  req, err := http.NewRequest(pt, goc+duong, nil)\n  if err != nil {\n    fmt.Println(\"lỗi tạo yêu cầu:\", err)\n    return\n\
      \  }\n  tl, err := http.DefaultClient.Do(req)\n  if err != nil {\n    fmt.Println(\"lỗi gọi:\", err)\n    return\n  }\n  defer tl.Body.Close()\n\
      \  than, err := io.ReadAll(tl.Body)\n  if err != nil {\n    fmt.Println(\"lỗi đọc:\", err)\n    return\n  }\n  kq := strings.TrimSpace(string(than))\n\
      \  fmt.Println(pt, duong, tl.StatusCode, kq)\n}\n"
    reason: Tệp main.go (HttpNho) đầy đủ (hằng G_HTTP ở audit/bnx/src/l20.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - đúng tuyến mã hai trăm và thân JSON; sai phương thức bốn trăm linh năm; đường dẫn lạ bốn trăm linh bốn
    expect_stdout: 'GET /suc-khoe 200 {"trang_thai":"ok"}

      POST /suc-khoe 405 Method Not Allowed

      GET /khong-co 404 404 page not found

      '
    timeout: 240
  L20_fiber:
    lang: go
    kind: syntax
    code: "package main\n\nimport (\n  \"fmt\"\n  \"io\"\n  \"net\"\n  \"net/http\"\n\n  \"github.com/gofiber/fiber/v2\"\n)\n\nfunc main() {\n\
      \  app := fiber.New(fiber.Config{DisableStartupMessage: true})\n  app.Get(\"/suc-khoe\", func(c *fiber.Ctx) error {\n    return c.JSON(fiber.Map{\"\
      trang_thai\": \"ok\"})\n  })\n  app.Get(\"/tai-khoan/:so\", func(c *fiber.Ctx) error {\n    return c.JSON(fiber.Map{\"so\": c.Params(\"\
      so\")})\n  })\n  ln, err := net.Listen(\"tcp\", \"127.0.0.1:0\")\n  if err != nil {\n    fmt.Println(\"không mở được cổng:\", err)\n   \
      \ return\n  }\n  go app.Listener(ln)\n  goc := \"http://\" + ln.Addr().String()\n  for _, duong := range []string{\"/suc-khoe\", \"/tai-khoan/001\"\
      } {\n    tl, err := http.Get(goc + duong)\n    if err != nil {\n      fmt.Println(\"lỗi gọi:\", err)\n      return\n    }\n    than, _ :=\
      \ io.ReadAll(tl.Body)\n    tl.Body.Close()\n    fmt.Println(duong, tl.StatusCode, string(than))\n  }\n  app.Shutdown()\n}\n"
    reason: 'Tệp FiberNho (hằng G_FIBER = audit/bnx/deps/l20/fiber/main.go, ver/l20.py so từng byte): gofmt -e kiểm cú pháp; chạy thật cần thư
      viện nên nguồn L20_chay_fiber chạy go run . trong thư mục deps.'
  L20_chay_fiber:
    lang: bash
    code: 'cd /d/research-video/audit/bnx/deps/l20/fiber && go run .

      '
    claims:
    - tuyến kiểm sức khoẻ trả hai trăm với cùng thân JSON; đường dẫn tài khoản không không một trả lại phần cuối đường dẫn trong thân
    expect_stdout: '/suc-khoe 200 {"trang_thai":"ok"}

      /tai-khoan/001 200 {"so":"001"}

      '
    timeout: 300
    note: Fiber v2.52.16 (audit/bnx/deps/l20/README.md); máy chủ nghe 127.0.0.1 cổng do hệ điều hành chọn, tự tắt. Đường /d/research-video là
      đường Git Bash của kho này.
  L20_boqua:
    lang: go
    code: "package main\n\nimport (\n  \"fmt\"\n  \"strconv\"\n)\n\nfunc main() {\n  so, _ := strconv.Atoi(\"12a\")\n  fmt.Println(\"bỏ qua lỗi,\
      \ số đọc được:\", so)\n  so, err := strconv.Atoi(\"12a\")\n  fmt.Println(\"kiểm lỗi:\", so, err)\n}\n"
    reason: Tệp main.go (BoQuaLoi) đầy đủ (hằng G_BOQUA ở audit/bnx/src/l20.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - bỏ qua lỗi in số không; giữ lỗi in số không kèm lỗi nói rõ chuỗi không phải số
    expect_stdout: 'bỏ qua lỗi, số đọc được: 0

      kiểm lỗi: 0 strconv.Atoi: parsing "12a": invalid syntax

      '
    timeout: 240
  L20_roiri:
    lang: go
    code: "package main\n\nimport (\n  \"fmt\"\n  \"runtime\"\n  \"time\"\n)\n\nfunc thu(dem int) int {\n  for i := 0; i < 1000; i++ {\n    kq\
      \ := make(chan int, dem)\n    go func() { kq <- i }() // bên nhận đã bỏ đi, không ai nhận\n  }\n  time.Sleep(200 * time.Millisecond)\n \
      \ return runtime.NumGoroutine()\n}\n\nfunc main() {\n  fmt.Println(\"kênh đệm 1, còn sống:\", thu(1))\n  fmt.Println(\"kênh không đệm, còn\
      \ sống:\", thu(0))\n}\n"
    reason: Tệp main.go (RoiRi) đầy đủ (hằng G_ROIRI ở audit/bnx/src/l20.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
    - kênh đệm một còn sống một luồng; kênh không đệm còn sống một nghìn không trăm linh một luồng
    expect_stdout: 'kênh đệm 1, còn sống: 1

      kênh không đệm, còn sống: 1001

      '
    timeout: 240
  L20_kiem:
    lang: go
    code: "package main\n\nimport (\n  \"fmt\"\n  \"sync\"\n  \"sync/atomic\"\n)\n\nfunc main() {\n  var nhom sync.WaitGroup\n  var a atomic.Int64\n\
      \  ch := make(chan int, 1000)\n  for i := 0; i < 1000; i++ {\n    nhom.Add(1)\n    go func() {\n      defer nhom.Done()\n      a.Add(1)\n\
      \      ch <- 1\n    }()\n  }\n  nhom.Wait()\n  close(ch)\n  tong := 0\n  for v := range ch {\n    tong += v\n  }\n  fmt.Println(\"atomic:\"\
      , a.Load(), \"- qua kênh:\", tong)\n}\n"
    reason: Tệp main.go (KiemLai) đầy đủ (hằng G_KIEM ở audit/bnx/src/l20.py); màn hình hiện từng đoạn liên tiếp của tệp này.
    claims:
