sources:
  L20_goLoi:
    lang: go
    kind: other
    reason: Chương trình Go đầy đủ của bài (màn hình hiện từng đoạn liên tiếp); chạy thật bằng `go run main.go` ở chương trình bash đi kèm.
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`), khớp từng ký tự đầu ra; Go 1.25.5.
    code: "package main\nimport (\"errors\"; \"fmt\")\ntype TaiKhoan struct{ So string; SoDu int }\nfunc rut(tk TaiKhoan, tien int) (TaiKhoan, error) {\n  if tien > tk.SoDu {\n    return tk, errors.New(\"\
      khong du so du\")\n  }\n  tk.SoDu -= tien\n  return tk, nil\n}\nfunc main() {\n  tk := TaiKhoan{So: \"001\", SoDu: 500}\n  for _, tien := range []int{200, 400} {\n    moi, err := rut(tk, tien)\n \
      \   if err != nil {\n      fmt.Println(\"rut\", tien, \"loi:\", err, \"- so du van\", tk.SoDu)\n      continue\n    }\n    tk = moi\n    fmt.Println(\"rut\", tien, \"xong, con\", tk.SoDu)\n  }\n}"
  L20_Loi:
    lang: bash
    timeout: 240
    reason: 'Loi: chạy nguyên văn.'
    claims:
    - rút 200 xong còn 300; rút 400 báo không đủ số dư và số dư vẫn 300
    expect_stdout: 'rut 200 xong, con 300

      rut 400 loi: khong du so du - so du van 300'
    files:
      main.go: src:BNX:L20_goLoi
    code: go run main.go
  L20_goDem:
    lang: go
    kind: other
    reason: Chương trình Go đầy đủ của bài (màn hình hiện từng đoạn liên tiếp); chạy thật bằng `go run main.go` ở chương trình bash đi kèm.
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`), khớp từng ký tự đầu ra; Go 1.25.5.
    code: "package main\nimport (\"fmt\"; \"sync\")\nfunc main() {\n  var nhom sync.WaitGroup\n  var khoa sync.Mutex\n  dem := 0\n  for i := 0; i < 1000; i++ {\n    nhom.Add(1)\n    go func() {\n      defer\
      \ nhom.Done()\n      khoa.Lock()\n      dem++\n      khoa.Unlock()\n    }()\n  }\n  nhom.Wait()\n  fmt.Println(\"bo dem:\", dem)\n}"
  L20_Dem:
    lang: bash
    timeout: 240
    reason: 'Dem: chạy nguyên văn.'
    claims:
    - một nghìn luồng nhẹ, mỗi luồng cộng một trong khoá, bộ đếm đúng 1000
    expect_stdout: 'bo dem: 1000'
    files:
      main.go: src:BNX:L20_goDem
    code: go run main.go
  L20_goKhong:
    lang: go
    kind: other
    reason: Biến thể không khoá của goDem; kết quả ngẫu nhiên nên bài chỉ chạy nó với cờ -race (chương trình bash Race) và lấy hai dòng cố định.
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`), khớp từng ký tự đầu ra; Go 1.25.5.
    code: "package main\nimport (\"fmt\"; \"sync\")\nfunc main() {\n  var nhom sync.WaitGroup\n  dem := 0\n  for i := 0; i < 1000; i++ {\n    nhom.Add(1)\n    go func() {\n      defer nhom.Done()\n    \
      \  dem++\n    }()\n  }\n  nhom.Wait()\n  fmt.Println(\"bo dem:\", dem)\n}"
  L20_Race:
    lang: bash
    timeout: 400
    reason: 'Race: chạy nguyên văn.'
    claims:
    - 'bỏ khoá: trình phát hiện tranh chấp báo WARNING: DATA RACE và thoát với mã 66'
    expect_stdout: 'WARNING: DATA RACE

      exit status 66'
    files:
      main.go: src:BNX:L20_goKhong
    code: go run -race main.go 2>&1 | grep -E "DATA RACE|exit status" | uniq
  L20_goKenh:
    lang: go
    kind: other
    reason: Chương trình Go đầy đủ của bài (màn hình hiện từng đoạn liên tiếp); chạy thật bằng `go run main.go` ở chương trình bash đi kèm.
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`), khớp từng ký tự đầu ra; Go 1.25.5.
    code: "package main\nimport \"fmt\"\nfunc thuGui(ch chan int, v int) {\n  select {\n  case ch <- v:\n    fmt.Println(\"gui\", v, \"xong, dang chua\", len(ch))\n  default:\n    fmt.Println(\"gui\", v,\
      \ \"phai cho ben nhan\")\n  }\n}\nfunc main() {\n  ch := make(chan int, 3)\n  for v := 1; v <= 4; v++ {\n    thuGui(ch, v)\n  }\n  fmt.Println(\"nhan\", <-ch)\n  thuGui(ch, 4)\n  khong := make(chan\
      \ int)\n  thuGui(khong, 1)\n}"
  L20_Kenh:
    lang: bash
    timeout: 240
    reason: 'Kenh: chạy nguyên văn.'
    claims:
    - kênh đệm 3 nhận 3 giá trị, giá trị thứ 4 phải chờ; sau khi nhận một thì gửi được; kênh không đệm gửi phải chờ
    expect_stdout: 'gui 1 xong, dang chua 1

      gui 2 xong, dang chua 2

      gui 3 xong, dang chua 3

      gui 4 phai cho ben nhan

      nhan 1

      gui 4 xong, dang chua 3

      gui 1 phai cho ben nhan'
    files:
      main.go: src:BNX:L20_goKenh
    code: go run main.go
  L20_goHttp:
    lang: go
    kind: other
    reason: Chương trình Go đầy đủ của bài (màn hình hiện từng đoạn liên tiếp); chạy thật bằng `go run main.go` ở chương trình bash đi kèm.
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`), khớp từng ký tự đầu ra; Go 1.25.5.
    code: "package main\nimport (\"fmt\"; \"io\"; \"net\"; \"net/http\"; \"strings\")\nfunc sucKhoe(w http.ResponseWriter, r *http.Request) {\n  w.Header().Set(\"Content-Type\", \"application/json\")\n\
      \  fmt.Fprint(w, `{\"trang_thai\":\"ok\"}`)\n}\nfunc main() {\n  mux := http.NewServeMux()\n  mux.HandleFunc(\"GET /suc-khoe\", sucKhoe)\n  ln, _ := net.Listen(\"tcp\", \"127.0.0.1:0\")\n  go http.Serve(ln,\
      \ mux)\n  goc := \"http://\" + ln.Addr().String()\n  for _, yc := range []string{\"GET /suc-khoe\", \"POST /suc-khoe\", \"GET /khong-co\"} {\n    pt, duong, _ := strings.Cut(yc, \" \")\n    req, _\
      \ := http.NewRequest(pt, goc+duong, nil)\n    tl, err := http.DefaultClient.Do(req)\n    if err != nil {\n      fmt.Println(\"loi goi:\", err)\n      return\n    }\n    than, _ := io.ReadAll(tl.Body);\
      \ tl.Body.Close()\n    fmt.Println(yc, tl.StatusCode, strings.TrimSpace(string(than)))\n  }\n}"
  L20_Http:
    lang: bash
    timeout: 240
    reason: 'Http: chạy nguyên văn.'
    claims:
    - GET /suc-khoe trả 200 với JSON; POST trả 405; đường dẫn lạ trả 404
    expect_stdout: 'GET /suc-khoe 200 {"trang_thai":"ok"}

      POST /suc-khoe 405 Method Not Allowed

      GET /khong-co 404 404 page not found'
    files:
      main.go: src:BNX:L20_goHttp
    code: go run main.go
  L20_goFiber:
    lang: go
    kind: other
    reason: main.go của mô-đun Fiber v2.52.16 ở audit/bnx/deps/l20/fiber (chép nguyên văn vào đó lúc import, ver/l20.py so từng byte); cần mô-đun ngoài nên chương trình bash `go run .` chạy ngay trong thư
      mục ấy.
    read_check: Chạy bằng chương trình bash đi kèm (`go run .` trong audit/bnx/deps/l20/fiber, mô-đun nằm trong bộ nhớ đệm Go); khớp từng ký tự đầu ra.
    code: "package main\nimport (\"fmt\"; \"io\"; \"net\"; \"net/http\"; \"github.com/gofiber/fiber/v2\")\nfunc main() {\n  app := fiber.New(fiber.Config{DisableStartupMessage: true})\n  app.Get(\"/suc-khoe\"\
      , func(c *fiber.Ctx) error {\n    return c.JSON(fiber.Map{\"trang_thai\": \"ok\"})\n  })\n  app.Get(\"/tai-khoan/:so\", func(c *fiber.Ctx) error {\n    return c.JSON(fiber.Map{\"so\": c.Params(\"\
      so\")})\n  })\n  ln, _ := net.Listen(\"tcp\", \"127.0.0.1:0\")\n  go app.Listener(ln)\n  goc := \"http://\" + ln.Addr().String()\n  for _, duong := range []string{\"/suc-khoe\", \"/tai-khoan/001\"\
      } {\n    tl, err := http.Get(goc + duong)\n    if err != nil {\n      fmt.Println(\"loi goi:\", err)\n      return\n    }\n    than, _ := io.ReadAll(tl.Body); tl.Body.Close()\n    fmt.Println(duong,\
      \ tl.StatusCode, string(than))\n  }\n  app.Shutdown()\n}"
  L20_Fiber:
    lang: bash
    timeout: 400
    reason: 'Fiber: chạy nguyên văn.'
    claims:
    - 'hai tuyến Fiber trả 200: /suc-khoe và /tai-khoan/001 với tham số đường dẫn'
    expect_stdout: '/suc-khoe 200 {"trang_thai":"ok"}

      /tai-khoan/001 200 {"so":"001"}'
    code: cd "D:/research-video/audit/bnx/deps/l20/fiber" && go run .
  L20_goBoqua:
    lang: go
    kind: other
    reason: Chương trình Go đầy đủ của bài (màn hình hiện từng đoạn liên tiếp); chạy thật bằng `go run main.go` ở chương trình bash đi kèm.
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`), khớp từng ký tự đầu ra; Go 1.25.5.
    code: "package main\nimport (\"fmt\"; \"strconv\")\nfunc main() {\n  so, _ := strconv.Atoi(\"12a\")\n  fmt.Println(\"bo qua loi, so doc duoc:\", so)\n  so, err := strconv.Atoi(\"12a\")\n  fmt.Println(\"\
      kiem loi:\", so, err)\n}"
  L20_Boqua:
    lang: bash
    timeout: 240
    reason: 'Boqua: chạy nguyên văn.'
    claims:
    - bỏ qua lỗi thì số đọc được là 0 mà không ai biết; kiểm lỗi thấy parsing error
    expect_stdout: 'bo qua loi, so doc duoc: 0

      kiem loi: 0 strconv.Atoi: parsing "12a": invalid syntax'
    files:
      main.go: src:BNX:L20_goBoqua
    code: go run main.go
  L20_goRoiri:
    lang: go
    kind: other
    reason: Chương trình Go đầy đủ của bài (màn hình hiện từng đoạn liên tiếp); chạy thật bằng `go run main.go` ở chương trình bash đi kèm.
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`), khớp từng ký tự đầu ra; Go 1.25.5.
    code: "package main\nimport (\"fmt\"; \"runtime\"; \"time\")\nfunc thu(dem int) int {\n  for i := 0; i < 1000; i++ {\n    kq := make(chan int, dem)\n    go func() { kq <- i }() // ben nhan da bo di,\
      \ khong ai nhan\n  }\n  time.Sleep(200 * time.Millisecond)\n  return runtime.NumGoroutine()\n}\nfunc main() {\n  fmt.Println(\"kenh dem 1, con song:\", thu(1))\n  fmt.Println(\"kenh khong dem, con\
      \ song:\", thu(0))\n}"
  L20_Roiri:
    lang: bash
    timeout: 240
    reason: 'Roiri: chạy nguyên văn.'
    claims:
    - 'kênh đệm 1: còn sống 1 luồng; kênh không đệm: còn sống 1001 luồng nhẹ (rò rỉ)'
    expect_stdout: 'kenh dem 1, con song: 1

      kenh khong dem, con song: 1001'
    files:
      main.go: src:BNX:L20_goRoiri
    code: go run main.go
  L20_goKiem:
    lang: go
    kind: other
