sources:
  L38_DemO:
    lang: python
    timeout: 120
    reason: 'DemO: chạy nguyên văn.'
    claims:
    - 'mô hình đếm ô, 8 cột: 1 000 dòng đọc theo hàng 8 000 ô, theo cột 1 000 ô; 100 000 dòng: 800 000 ô và 100 000 ô; hai cách cùng tổng (số minh hoạ, không đo thời gian)'
    expect_stdout: '1000 dong: hang 8000 o, cot 1000 o, cung tong True

      100000 dong: hang 800000 o, cot 100000 o, cung tong True'
    code: "COT = 8\n\ndef doc_theo_hang(bang, c):\n    o, tong = 0, 0\n    for hang in bang:\n        o += len(hang)\n        tong += hang[c]\n    return tong, o\n\ndef doc_theo_cot(cot, c):\n    return\
      \ sum(cot[c]), len(cot[c])\n\nfor n in (1000, 100_000):\n    bang = [tuple(range(i, i + COT)) for i in range(n)]\n    cot = [[h[c] for h in bang] for c in range(COT)]\n    t1, o1 = doc_theo_hang(bang,\
      \ 3)\n    t2, o2 = doc_theo_cot(cot, 3)\n    print(f\"{n} dong: hang {o1} o, cot {o2} o, cung tong {t1 == t2}\")"
  L38_MoHinh:
    lang: python
    timeout: 120
    reason: 'MoHinh: chạy nguyên văn.'
    claims:
    - 'mô hình hàng đợi có giao dịch: gửi 101 rồi huỷ, gửi 102 rồi chốt → ([], 1); nhận thêm một lần → ([102], 0), khớp Oracle'
    expect_stdout: '([], 1)

      ([102], 0)'
    code: "def chay(thao_tac):\n    hang, cho, nhan = [], [], []\n    for t in thao_tac:\n        if t[0] == \"gui\":\n            cho.append(t[1])\n        elif t[0] == \"huy\":\n            cho = []\n\
      \        elif t[0] == \"chot\":\n            hang, cho = hang + cho, []\n        elif t[0] == \"nhan\" and hang:\n            nhan.append(hang.pop(0))\n    return nhan, len(hang)\n\nCA1 = [(\"gui\"\
      , 101), (\"huy\",), (\"gui\", 102), (\"chot\",)]\nprint(chay(CA1))\nprint(chay(CA1 + [(\"nhan\",)]))"
  L38_XuyenManh:
    lang: python
    timeout: 120
    reason: 'XuyenManh: chạy nguyên văn.'
    claims:
    - '60 tài khoản, mảnh = mã chia lấy dư: 1 mảnh 0/3540; 3 mảnh 2 400/3 540 (67,8%); 30 mảnh 3 480/3 540 (98,3%) lệnh chuyển xuyên mảnh (số minh hoạ)'
    expect_stdout: '1 manh: 0/3540 lenh xuyen manh, 0.0%

      3 manh: 2400/3540 lenh xuyen manh, 67.8%

      30 manh: 3480/3540 lenh xuyen manh, 98.3%'
    code: "def xuyen(tk, manh):\n    cap = [(a, b) for a in range(tk) for b in range(tk) if a != b]\n    x = sum(1 for a, b in cap if a % manh != b % manh)\n    return len(cap), x\n\nfor manh in (1, 3,\
      \ 30):\n    n, x = xuyen(60, manh)\n    print(f\"{manh} manh: {x}/{n} lenh xuyen manh, {100 * x / n:.1f}%\")"
  L38_DoiManh:
    lang: python
    timeout: 120
    reason: 'DoiManh: chạy nguyên văn.'
    claims:
    - 'quy tắc chia lấy dư: thêm một mảnh (3 → 4) làm 748 trong 1 000 tài khoản đổi mảnh (số minh hoạ)'
    expect_stdout: '3 -> 4 manh: 748/1000 tai khoan doi manh'
    code: 'chuyen = sum(1 for a in range(1000) if a % 3 != a % 4)

      print(f"3 -> 4 manh: {chuyen}/1000 tai khoan doi manh")'
  LAB_L38:
    lang: python
    expect_stdout: 'sau gui: 3 thong diep

      nhan: 201 750000

      nhan: 203 120000

      con lai: 1

      xuyen manh: 3/5'
    code: "import sqlite3\n\ndb = sqlite3.connect(\":memory:\", isolation_level=None)\ndb.execute(\"CREATE TABLE hang_doi (id INTEGER PRIMARY KEY AUTOINCREMENT,\"\n           \" ma_gd INTEGER, so_tien INTEGER)\"\
      )\n\n\ndef gui(ma, tien, chot):\n    db.execute(\"BEGIN\")\n    db.execute(\"INSERT INTO hang_doi (ma_gd, so_tien) VALUES (?, ?)\", (ma, tien))\n    db.execute(\"COMMIT\" if chot else \"ROLLBACK\"\
      )\n\n\ndef nhan():\n    db.execute(\"BEGIN\")\n    dong = db.execute(\"SELECT id, ma_gd, so_tien FROM hang_doi\"\n                      \" ORDER BY id LIMIT 1\").fetchone()\n    if dong:\n       \
      \ db.execute(\"DELETE FROM hang_doi WHERE id = ?\", (dong[0],))\n    db.execute(\"COMMIT\")\n    return dong\n\n\ndef dem():\n    return db.execute(\"SELECT COUNT(*) FROM hang_doi\").fetchone()[0]\n\
      \n\ngui(201, 750000, True)\ngui(202, 300000, False)\ngui(203, 120000, True)\ngui(204, 900000, True)\nprint(\"sau gui:\", dem(), \"thong diep\")\nfor _ in range(2):\n    _, ma, tien = nhan()\n    print(\"\
      nhan:\", ma, tien)\nprint(\"con lai:\", dem())\nLENH = [(3, 8), (4, 9), (7, 11), (10, 14), (6, 13)]\nxuyen = sum(1 for a, b in LENH if a % 4 != b % 4)\nprint(f\"xuyen manh: {xuyen}/{len(LENH)}\")"
  L38_aq_clean:
    lang: oracle
    code: "\nBEGIN\n  DBMS_AQADM.STOP_QUEUE('bnx_l38_q');\n  DBMS_AQADM.DROP_QUEUE('bnx_l38_q');\n  DBMS_AQADM.DROP_QUEUE_TABLE('bnx_l38_qt');\nEXCEPTION WHEN OTHERS THEN NULL;\nEND;\n/\nDROP TYPE IF EXISTS\
      \ bnx_l38_msg FORCE;\n"
    reason: Dọn hàng đợi, bảng hàng đợi và kiểu thông điệp của lần chạy trước để khối formula 0 0 chạy lại được (không hiện trên màn hình; bài không nói gì về bước dọn). Chép từ hằng AQ_CLEAN của audit/bnx/src/l38.py.
    no_claim_reason: chỉ dọn dẹp; bài không nói kết quả nào của bước này
