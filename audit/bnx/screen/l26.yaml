sources:
  L26_Pom:
    lang: xml
    kind: other
    reason: 'pom.xml của dự án thử: hai phụ thuộc trực tiếp; ghi nguyên văn vào thư mục chạy của Maven thật.'
    read_check: Phân tích được bằng trình đọc XML (ElementTree) và chạy nguyên văn bởi Maven 3.9.11 trong nguồn L26_ChayCay (đầu ra thật khớp từng dòng).
    code: "<project xmlns=\"http://maven.apache.org/POM/4.0.0\">\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>bnx</groupId>\n  <artifactId>l26</artifactId>\n  <version>1</version>\n  <properties>\n\
      \    <maven.compiler.release>21</maven.compiler.release>\n  </properties>\n  <dependencies>\n    <dependency>\n      <groupId>org.apache.commons</groupId>\n      <artifactId>commons-text</artifactId>\n\
      \      <version>1.10.0</version>\n    </dependency>\n    <dependency>\n      <groupId>org.apache.commons</groupId>\n      <artifactId>commons-lang3</artifactId>\n      <version>3.9</version>\n   \
      \ </dependency>\n  </dependencies>\n</project>"
  L26_PomTT:
    lang: xml
    kind: other
    reason: 'pom.xml thứ hai: chỉ thêm project.build.outputTimestamp (theo hướng dẫn dựng tái lập của Maven).'
    read_check: Phân tích được bằng XML và chạy nguyên văn bởi Maven 3.9.11 trong nguồn L26_ChayTaiLap (so sha256 hai lần dựng).
    code: "<project xmlns=\"http://maven.apache.org/POM/4.0.0\">\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>bnx</groupId>\n  <artifactId>l26</artifactId>\n  <version>1</version>\n  <properties>\n\
      \    <maven.compiler.release>21</maven.compiler.release>\n    <project.build.outputTimestamp>2026-01-01T00:00:00Z</project.build.outputTimestamp>\n  </properties>\n</project>"
  L26_Chao:
    lang: java
    java_class: Chao
    kind: other
    reason: 'Chao.java: mã nguồn để Maven biên dịch.'
    read_check: Biên dịch bởi Maven (maven-compiler-plugin) trong nguồn L26_ChayVongDoi.
    code: "public class Chao {\n  public static void main(String[] a) {\n    System.out.println(\"xin chao\");\n  }\n}"
  L26_ChayCay:
    lang: bash
    timeout: 300
    reason: 'ChayCay: chạy nguyên văn.'
    claims:
    - 'cây phụ thuộc: commons-lang3 3.9 (trực tiếp) thắng 3.12.0 (bắc cầu qua commons-text)'
    - 'Maven báo: omitted for conflict with 3.9'
    expect_stdout: 'bnx:l26:jar:1

      +- org.apache.commons:commons-text:jar:1.10.0:compile

      \- org.apache.commons:commons-lang3:jar:3.9:compile

      -- che do chi tiet (-Dverbose):

      bnx:l26:jar:1

      +- org.apache.commons:commons-text:jar:1.10.0:compile

      |  \- (org.apache.commons:commons-lang3:jar:3.12.0:compile - omitted for conflict with 3.9)

      \- org.apache.commons:commons-lang3:jar:3.9:compile'
    files:
      pom.xml: src:BNX:L26_Pom
      Chao.java: src:BNX:L26_Chao
    code: 'M=/d/research-video/audit/bnx/deps/_tools/apache-maven-3.9.11/bin/mvn

      test -x $M || { echo "NOT_VERIFIED: thiếu Maven" >&2; exit 97; }

      mkdir -p src/main/java && cp Chao.java src/main/java/

      $M -B -q dependency:tree -DoutputFile=cay.txt && cat cay.txt

      echo "-- che do chi tiet (-Dverbose):"

      $M -B -q dependency:tree -Dverbose -DoutputFile=cay2.txt && cat cay2.txt'
  L26_ChayVongDoi:
    lang: bash
    timeout: 300
    reason: 'ChayVongDoi: chạy nguyên văn.'
    claims:
    - 'các pha dựng theo thứ tự: resources, compile, testResources, testCompile, test, jar'
    expect_stdout: '--- resources:3.3.1:resources (default-resources) @ l26 ---

      --- compiler:3.13.0:compile (default-compile) @ l26 ---

      --- resources:3.3.1:testResources (default-testResources) @ l26 ---

      --- compiler:3.13.0:testCompile (default-testCompile) @ l26 ---

      --- surefire:3.2.5:test (default-test) @ l26 ---

      --- jar:3.4.1:jar (default-jar) @ l26 ---'
    files:
      pom.xml: src:BNX:L26_Pom
      Chao.java: src:BNX:L26_Chao
    code: 'M=/d/research-video/audit/bnx/deps/_tools/apache-maven-3.9.11/bin/mvn

      test -x $M || { echo "NOT_VERIFIED: thiếu Maven" >&2; exit 97; }

      mkdir -p src/main/java && cp Chao.java src/main/java/

      $M -B package | grep -- ''--- '' | cut -c8-'
  L26_PomGoc:
    lang: xml
    kind: other
    reason: pom.xml gốc không đặt outputTimestamp.
    read_check: Phân tích được bằng XML và chạy nguyên văn bởi Maven trong nguồn L26_ChayTaiLap.
    code: "<project xmlns=\"http://maven.apache.org/POM/4.0.0\">\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>bnx</groupId>\n  <artifactId>l26</artifactId>\n  <version>1</version>\n  <properties>\n\
      \    <maven.compiler.release>21</maven.compiler.release>\n  </properties>\n</project>"
  L26_ChayTaiLap:
    lang: bash
    timeout: 400
    reason: 'ChayTaiLap: chạy nguyên văn.'
    claims:
    - 'không đặt outputTimestamp: hai lần dựng ra jar khác nhau'
    - 'đặt outputTimestamp: hai lần dựng ra jar giống nhau từng bit'
    expect_stdout: 'khong dat outputTimestamp: KHAC

      co outputTimestamp: GIONG'
    files:
      pom.xml: src:BNX:L26_PomGoc
      pom-tt.xml: src:BNX:L26_PomTT
      Chao.java: src:BNX:L26_Chao
    code: "M=/d/research-video/audit/bnx/deps/_tools/apache-maven-3.9.11/bin/mvn\ntest -x $M || { echo \"NOT_VERIFIED: thiếu Maven\" >&2; exit 97; }\nmkdir -p src/main/java && cp Chao.java src/main/java/\n\
      dung() {\n  $M -B -q -f $1 clean package > /dev/null 2>&1\n  sha256sum target/l26-1.jar | cut -d' ' -f1\n}\nso() {\n  a=$(dung $1); sleep 2; b=$(dung $1)\n  [ \"$a\" = \"$b\" ] && echo \"$2: GIONG\"\
      \ || echo \"$2: KHAC\"\n}\nso pom.xml \"khong dat outputTimestamp\"\nso pom-tt.xml \"co outputTimestamp\""
  L26_PomA:
    lang: xml
    kind: other
    reason: 'pom: 1 phụ thuộc trực tiếp (commons-lang3).'
    read_check: XML; chạy nguyên văn bởi Maven trong nguồn L26_ChayQuyMo.
    code: "<project xmlns=\"http://maven.apache.org/POM/4.0.0\">\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>bnx</groupId><artifactId>a</artifactId><version>1</version>\n  <dependencies>\n    <dependency><groupId>org.apache.commons</groupId><artifactId>commons-lang3</artifactId><version>3.9</version></dependency>\n\
      \  </dependencies>\n</project>"
  L26_PomB:
    lang: xml
    kind: other
    reason: 'pom: 1 phụ thuộc trực tiếp (spring-context).'
    read_check: XML; chạy nguyên văn bởi Maven trong nguồn L26_ChayQuyMo.
    code: "<project xmlns=\"http://maven.apache.org/POM/4.0.0\">\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>bnx</groupId><artifactId>b</artifactId><version>1</version>\n  <dependencies>\n    <dependency><groupId>org.springframework</groupId><artifactId>spring-context</artifactId><version>7.0.10</version></dependency>\n\
      \  </dependencies>\n</project>"
  L26_PomC:
    lang: xml
    kind: other
    reason: 'pom: 1 phụ thuộc trực tiếp (spring-boot-starter-web).'
    read_check: XML; chạy nguyên văn bởi Maven trong nguồn L26_ChayQuyMo.
    code: "<project xmlns=\"http://maven.apache.org/POM/4.0.0\">\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>bnx</groupId><artifactId>c</artifactId><version>1</version>\n  <dependencies>\n    <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId><version>3.5.7</version></dependency>\n\
      \  </dependencies>\n</project>"
  L26_ChayQuyMo:
    lang: bash
    timeout: 600
    reason: 'ChayQuyMo: chạy nguyên văn.'
    claims:
    - 'đồ thị phụ thuộc: 1 phụ thuộc trực tiếp kéo theo nhiều jar bắc cầu'
    expect_stdout: 'a: 1 phu thuoc truc tiep -> 1 jar

      b: 1 phu thuoc truc tiep -> 9 jar

      c: 1 phu thuoc truc tiep -> 34 jar'
    files:
      pom-a.xml: src:BNX:L26_PomA
      pom-b.xml: src:BNX:L26_PomB
      pom-c.xml: src:BNX:L26_PomC
    code: "M=/d/research-video/audit/bnx/deps/_tools/apache-maven-3.9.11/bin/mvn\ntest -x $M || { echo \"NOT_VERIFIED: thiếu Maven\" >&2; exit 97; }\nfor d in a b c; do\n  mkdir -p $d && cp pom-$d.xml $d/pom.xml\n\
      \  (cd $d && $M -B -q dependency:list -DoutputFile=ds.txt)\n  echo \"$d: 1 phu thuoc truc tiep -> $(grep -c ':jar:' $d/ds.txt) jar\"\ndone"
  L26_Jenkinsfile:
    lang: groovy
    kind: other
    reason: Jenkinsfile khai báo (Declarative Pipeline) theo mẫu của tài liệu Jenkins; KHÔNG chạy trên máy này (cần máy chủ Jenkins).
    read_check: Kiểm CÚ PHÁP Groovy bằng GroovyShell.parse thật (Groovy 4.0.27) trong nguồn L26_KiemGroovy; cấu trúc pipeline/agent/stages/stage/steps/post theo tài liệu Jenkins đã đọc (audit/bnx/sources_l26.md,
      [JKSYN]); không kiểm ngữ nghĩa Declarative vì cần Jenkins.
    code: "pipeline {\n  agent any\n  stages {\n    stage('Build') {\n      steps { sh 'mvn -B package' }\n    }\n    stage('Test') {\n      steps { sh 'mvn -B verify' }\n    }\n    stage('Deploy') {\n\
      \      steps { sh './trien-khai.sh' }\n    }\n  }\n  post {\n    failure { echo 'dung that bai' }\n  }\n}"
  L26_BuildGradle:
    lang: groovy
    kind: other
    reason: build.gradle (Groovy DSL) tương đương pom.xml của bài; KHÔNG chạy Gradle trên máy này.
    read_check: Kiểm CÚ PHÁP Groovy bằng GroovyShell.parse thật trong nguồn L26_KiemGroovy; tên khối plugins/repositories/dependencies và `implementation`/`mavenCentral()` theo tài liệu Gradle đã đọc ([GRDL]);
      không chạy Gradle nên không kiểm kết quả phân giải.
    code: "plugins {\n    id 'java'\n}\nrepositories {\n    mavenCentral()\n}\ndependencies {\n    implementation 'org.apache.commons:commons-text:1.10.0'\n    implementation 'org.apache.commons:commons-lang3:3.9'\n\
      }"
  L26_KiemGroovy:
    lang: java
    java_class: KiemGroovy
    kind: other
    reason: Chương trình kiểm cú pháp Groovy (chỉ biên dịch, không chạy tệp).
    read_check: Biên dịch cùng Groovy 4.0.27 và chạy trong nguồn L26_KiemGroovy.
    code: "import groovy.lang.GroovyShell;\nimport java.nio.file.*;\npublic class KiemGroovy {\n  static String thu(String ten) throws Exception {\n    String ma = Files.readString(Path.of(ten));\n    try\
      \ {\n      new GroovyShell().parse(ma);\n      return \"cu phap hop le\";\n    } catch (Exception e) {\n      return \"loi cu phap\";\n    }\n  }\n  public static void main(String[] a) throws Exception\
      \ {\n    for (String t : a)\n      System.out.println(t + \": \" + thu(t));\n  }\n}"
  L26_JenkinsfileHong:
    lang: groovy
    kind: other
    reason: Jenkinsfile cố ý thiếu hai dấu đóng ngoặc, để thấy trình kiểm bắt lỗi.
    read_check: 'Phải bị GroovyShell.parse từ chối: nguồn L26_KiemGroovy in ''loi cu phap''.'
    code: "pipeline {\n  agent any\n  stages {\n    stage('Build') {\n      steps { sh 'mvn -B package'\n    }\n  }\n}"
  L26_ChayKiem:
    lang: bash
    timeout: 200
    reason: 'ChayKiem: chạy nguyên văn.'
    claims:
    - Jenkinsfile và build.gradle đúng cú pháp Groovy; tệp thiếu ngoặc bị từ chối
    expect_stdout: 'Jenkinsfile: cu phap hop le

      build.gradle: cu phap hop le

      JenkinsfileHong: loi cu phap'
    files:
      KiemGroovy.java: src:BNX:L26_KiemGroovy
      Jenkinsfile: src:BNX:L26_Jenkinsfile
      build.gradle: src:BNX:L26_BuildGradle
      JenkinsfileHong: src:BNX:L26_JenkinsfileHong
    code: 'D=/d/research-video/audit/bnx/deps/l26

      ls $D/groovy-4.0.27.jar >/dev/null 2>&1 || { echo "NOT_VERIFIED: thiếu jar" >&2; exit 97; }

      mkdir -p lib out && cp $D/*.jar lib/

      javac -encoding UTF-8 -cp "lib/*" -d out KiemGroovy.java

      java -Dstdout.encoding=UTF-8 -cp "out;lib/*" KiemGroovy Jenkinsfile build.gradle JenkinsfileHong'
  L26_MoPhong:
    lang: python
    timeout: 120
    reason: 'MÔ PHỎNG (không phải Jenkins): thứ tự các giai đoạn và hành vi `post failure`.'
    claims:
    - Test hỏng thì Deploy không chạy và nhánh post failure chạy
    expect_stdout: 'Build: xong

      Test: that bai

      post failure: dung that bai'
    code: "def chay(cac_buoc, hong=None):\n    ket = []\n    for ten in cac_buoc:\n        if hong == ten:\n            ket.append(ten + \": that bai\")\n            break\n        ket.append(ten + \":\
      \ xong\")\n    else:\n        return ket\n    ket.append(\"post failure: dung that bai\")\n    return ket\nfor dong in chay([\"Build\", \"Test\", \"Deploy\"], hong=\"Test\"):\n    print(dong)"
  L26_GiaiPhuThuoc:
    lang: python
    timeout: 120
    reason: 'Bộ phân giải tự viết: duyệt theo độ sâu, người đến trước thắng (đường khác với Maven thật).'
    claims:
    - 'kết quả khớp mvn dependency:tree: lang3 3.9'
    expect_stdout: 'bo lang3 3.12.0 (sau 2): da co 3.9

      {''text'': ''1.10.0'', ''lang3'': ''3.9''}'
    code: "CAY = {\"du an\": [(\"text\", \"1.10.0\"), (\"lang3\", \"3.9\")],\n       (\"text\", \"1.10.0\"): [(\"lang3\", \"3.12.0\")]}\nda, hang = {}, [(k, v, 1) for k, v in CAY[\"du an\"]]\nwhile hang:\n\
      \    ten, ban, sau = hang.pop(0)\n    if ten in da:\n        print(f\"bo {ten} {ban} (sau {sau}): da co {da[ten]}\")\n        continue\n    da[ten] = ban\n    hang += [(k, v, sau + 1) for k, v in\
      \ CAY.get((ten, ban), [])]\nprint(da)"
  LAB_L26:
    lang: python
    expect_stdout: 'maven A 1.0

      maven B 1.0

      maven X 1.0

      maven Y 2.0

      maven Z 1.0

      gradle X 2.0

      gradle Y 3.0

      gradle Z 1.0'
    code: "DU_AN = [(\"A\", \"1.0\"), (\"B\", \"1.0\")]\nCAY = {(\"A\", \"1.0\"): [(\"X\", \"1.0\"), (\"Y\", \"2.0\")],\n       (\"B\", \"1.0\"): [(\"Y\", \"3.0\"), (\"Z\", \"1.0\")],\n       (\"Z\", \"\
      1.0\"): [(\"X\", \"2.0\")]}\n\n\ndef so(v):\n    return tuple(int(p) for p in v.split(\".\"))\n\n\ndef maven():\n    chon, hang = {}, [(t, v) for t, v in DU_AN]\n    while hang:\n        ten, ban\
      \ = hang.pop(0)\n        if ten in chon:\n            continue\n        chon[ten] = ban\n        hang += CAY.get((ten, ban), [])\n    return chon\n\n\ndef gradle():\n    chon, hang = {}, [(t, v) for\
