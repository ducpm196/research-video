sources:
  L32_DoiChieu:
    lang: python
    timeout: 120
    reason: 'DoiChieu: chạy nguyên văn.'
    claims:
    - 'vòng đối chiếu GitOps mô phỏng với git thật: commit đầu tạo 2 dịch vụ; sửa tay không tự chữa khi tắt cờ (lệch 1), bật cờ thì chữa; revert đưa ảnh về bản cũ; xoá tệp trong Git chỉ thành lệch 1 nếu
      chưa bật prune, bật prune thì xoá'
    expect_stdout: '1. commit 1-2: tao so-cai, tao thanh-toan | lech 0

      2. khong doi gi: khong viec | lech 0

      3. sua tay ban 3 -> 9: khong viec | lech 1

      4. bat tu chua: sua thanh-toan | lech 0

      5. commit anh v1.5: sua thanh-toan | lech 0

      6. git revert: sua thanh-toan | lech 0

      7. xoa so-cai.json trong Git: khong viec | lech 1

      8. bat prune: xoa so-cai | lech 0

      them thanh-toan

      A thanh-toan.json

      them so-cai

      A so-cai.json

      thanh-toan v1.5

      M thanh-toan.json

      Revert "thanh-toan v1.5"

      M thanh-toan.json

      go so-cai

      D so-cai.json'
    code: "import json, os, pathlib, subprocess, tempfile\n\nkho = pathlib.Path(tempfile.mkdtemp())\nENV = dict(os.environ, GIT_AUTHOR_NAME=\"b\", GIT_AUTHOR_EMAIL=\"b@x\",\n           GIT_COMMITTER_NAME=\"\
      b\", GIT_COMMITTER_EMAIL=\"b@x\")\n\ndef git(*a):\n    r = subprocess.run([\"git\", *a], cwd=kho, env=ENV, text=True,\n                       capture_output=True, check=True)\n    return r.stdout\n\
      \ndef mong_muon():                      # trang thai MONG MUON: doc tu HEAD\n    tep = git(\"ls-tree\", \"--name-only\", \"HEAD\").split()\n    return {t[:-5]: json.loads(git(\"show\", \"HEAD:\" +\
      \ t)) for t in tep}\n\ncum, cuoi = {}, None                  # trang thai THAT (gia lap), commit da dong bo\n\ndef lech():\n    mm = mong_muon()\n    return sorted({t for t in mm if cum.get(t) !=\
      \ mm[t]} | (set(cum) - set(mm)))\n\ndef dong_bo(tu_chua=False, prune=False):\n    global cuoi\n    mm, viec = mong_muon(), []\n    rev = git(\"rev-parse\", \"HEAD\").strip()\n    moi, cuoi = rev !=\
      \ cuoi, rev\n    for ten, ch in mm.items():\n        if cum.get(ten) != ch and (moi or tu_chua or ten not in cum):\n            viec.append((\"sua \" if ten in cum else \"tao \") + ten)\n        \
      \    cum[ten] = dict(ch)\n    for ten in sorted(set(cum) - set(mm)):\n        if prune:\n            viec.append(\"xoa \" + ten)\n            del cum[ten]\n    return viec\n\ndef ghi(ten, noi_dung,\
      \ thong_diep):\n    (kho / (ten + \".json\")).write_text(json.dumps(noi_dung, sort_keys=True))\n    git(\"add\", \"-A\")\n    git(\"commit\", \"-q\", \"-m\", thong_diep)\n\ndef buoc(i, mo_ta, **kw):\n\
      \    viec = dong_bo(**kw)\n    print(f\"{i}. {mo_ta}: {', '.join(viec) or 'khong viec'} | lech {len(lech())}\")\n\ngit(\"init\", \"-q\")\nghi(\"thanh-toan\", {\"anh\": \"v1.4\", \"ban\": 3}, \"them\
      \ thanh-toan\")\nghi(\"so-cai\", {\"anh\": \"v2.0\", \"ban\": 2}, \"them so-cai\")\nbuoc(1, \"commit 1-2\")\nbuoc(2, \"khong doi gi\")\ncum[\"thanh-toan\"][\"ban\"] = 9\nbuoc(3, \"sua tay ban 3 ->\
      \ 9\")\nbuoc(4, \"bat tu chua\", tu_chua=True)\nghi(\"thanh-toan\", {\"anh\": \"v1.5\", \"ban\": 3}, \"thanh-toan v1.5\")\nbuoc(5, \"commit anh v1.5\")\ngit(\"revert\", \"--no-edit\", \"HEAD\")\n\
      buoc(6, \"git revert\")\ngit(\"rm\", \"-q\", \"so-cai.json\")\ngit(\"commit\", \"-q\", \"-m\", \"go so-cai\")\nbuoc(7, \"xoa so-cai.json trong Git\")\nbuoc(8, \"bat prune\", prune=True)\nfor dong\
      \ in git(\"log\", \"--reverse\", \"--name-status\", \"--format=%s\").split(\"\\n\"):\n    if dong:\n        print(dong.replace(\"\\t\", \" \"))"
  L32_QuyMo:
    lang: python
    timeout: 300
    reason: 'QuyMo: chạy nguyên văn.'
    claims:
    - đọc trạng thái mong muốn từng tệp tốn 1 + n lần gọi git (11 ở 10 ứng dụng, 201 ở 200); đọc một lần bằng cat-file --batch luôn 2 lần; kết quả giống nhau
    expect_stdout: '10 ung dung: tung tep 11 lan goi git, mot lan 2 | giong nhau: True

      200 ung dung: tung tep 201 lan goi git, mot lan 2 | giong nhau: True'
    code: "import json, pathlib, subprocess, tempfile\n\ndem = 0\n\ndef git(kho, *a, vao=None):\n    global dem\n    dem += 1\n    return subprocess.run([\"git\", *a], cwd=kho, input=vao, text=True,\n \
      \                         capture_output=True, check=True).stdout\n\ndef tao_kho(n):\n    kho = pathlib.Path(tempfile.mkdtemp())\n    git(kho, \"init\", \"-q\")\n    for i in range(n):\n        (kho\
      \ / f\"u{i}.json\").write_text(json.dumps({\"ban\": 3}))\n    git(kho, \"add\", \"-A\")\n    git(kho, \"-c\", \"user.name=b\", \"-c\", \"user.email=b@x\", \"commit\", \"-q\", \"-m\", \"m\")\n    return\
      \ kho\n\ndef doc_tung_tep(kho):                       # 1 + n lan goi git\n    tep = git(kho, \"ls-tree\", \"--name-only\", \"HEAD\").split()\n    return {t: json.loads(git(kho, \"show\", \"HEAD:\"\
      \ + t)) for t in tep}\n\ndef doc_mot_lan(kho):                        # 2 lan goi git\n    tep = git(kho, \"ls-tree\", \"--name-only\", \"HEAD\").split()\n    ra = git(kho, \"cat-file\", \"--batch\"\
      , vao=\"\".join(f\"HEAD:{t}\\n\" for t in tep))\n    dong = ra.split(\"\\n\")\n    return {t: json.loads(dong[2 * i + 1]) for i, t in enumerate(tep)}\n\nfor n in (10, 200):\n    kho = tao_kho(n)\n\
      \    dem = 0\n    a = doc_tung_tep(kho)\n    lan_a, dem = dem, 0\n    b = doc_mot_lan(kho)\n    print(n, \"ung dung: tung tep\", lan_a, \"lan goi git, mot lan\", dem,\n          \"| giong nhau:\"\
      , a == b)"
  L32_ChinhSach:
    lang: python
    timeout: 120
    reason: 'ChinhSach: chạy nguyên văn.'
    claims:
    - 'mô phỏng đánh giá chính sách quyền: Allow khớp thì cho phép; không có Allow thì từ chối mặc định; Deny rõ ràng thắng Allow'
    expect_stdout: 's3:GetObject bao-cao/2026/a.csv -> cho phep

      s3:PutObject bao-cao/2026/a.csv -> tu choi (mac dinh)

      s3:GetObject bao-cao/rieng/b.csv -> tu choi (Deny ro rang)'
    code: "import fnmatch\n\nCHINH_SACH = [\n    {\"hieu_luc\": \"Allow\", \"viec\": \"s3:Get*\", \"tai_nguyen\": \"bao-cao/*\"},\n    {\"hieu_luc\": \"Deny\", \"viec\": \"s3:*\", \"tai_nguyen\": \"bao-cao/rieng/*\"\
      },\n]\n\ndef quyet_dinh(viec, tai_nguyen):\n    khop = [c[\"hieu_luc\"] for c in CHINH_SACH\n            if fnmatch.fnmatch(viec, c[\"viec\"])\n            and fnmatch.fnmatch(tai_nguyen, c[\"tai_nguyen\"\
      ])]\n    if \"Deny\" in khop:\n        return \"tu choi (Deny ro rang)\"\n    if \"Allow\" in khop:\n        return \"cho phep\"\n    return \"tu choi (mac dinh)\"\n\nfor v, t in [(\"s3:GetObject\"\
      , \"bao-cao/2026/a.csv\"),\n             (\"s3:PutObject\", \"bao-cao/2026/a.csv\"),\n             (\"s3:GetObject\", \"bao-cao/rieng/b.csv\")]:\n    print(v, t, \"->\", quyet_dinh(v, t))"
  L32_ChayVault:
    lang: bash
    timeout: 300
    reason: 'ChayVault: chạy nguyên văn.'
    claims:
    - 'Vault 2.2.2 dev: ghi hai phiên bản, đọc bản mới xyz789 và bản 1 abc123; thẻ chính sách chỉ đọc có hạn 4 giây: đọc được lúc đầu, ghi bị từ chối, sau 6 giây đọc cũng bị từ chối'
    expect_stdout: 'ban moi nhat: xyz789

      ban 1: abc123

      the doc luc 0 giay: xyz789

      the ghi luc 0 giay: permission denied

      the doc sau 6 giay: permission denied'
    code: "IMG=hashicorp/vault@sha256:dfa48c2fa2b0099ccb47681ec5c4804bf5aec9d6879ecfee07ad4b92a5427ad6\ncommand -v docker >/dev/null || { echo \"NOT_VERIFIED: thieu docker\" >&2; exit 97; }\ndocker image\
      \ inspect $IMG >/dev/null 2>&1 || docker pull -q $IMG >/dev/null 2>&1 || { echo \"NOT_VERIFIED: khong co anh Vault\" >&2; exit 97; }\ncat > in.sh <<'EOF'\nexport VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root\n\
      vault server -dev -dev-root-token-id=root >/dev/null 2>&1 &\nfor i in $(seq 1 30); do vault status >/dev/null 2>&1 && break; sleep 1; done\nvault kv put -mount=secret thanh-toan db_pass=abc123 >/dev/null\n\
      vault kv put -mount=secret thanh-toan db_pass=xyz789 >/dev/null\necho \"ban moi nhat: $(vault kv get -mount=secret -field=db_pass thanh-toan)\"\necho \"ban 1: $(vault kv get -mount=secret -version=1\
      \ -field=db_pass thanh-toan)\"\nvault policy write chi-doc - >/dev/null <<'P'\npath \"secret/data/thanh-toan\" { capabilities = [\"read\"] }\nP\nT=$(vault token create -policy=chi-doc -ttl=4s -field=token)\n\
      doc() {\n  VAULT_TOKEN=$T vault kv get -mount=secret -field=db_pass \\\n    thanh-toan 2>&1\n}\nghi() {\n  VAULT_TOKEN=$T vault kv put -mount=secret thanh-toan \\\n    db_pass=x 2>&1 | grep -o 'permission\
      \ denied' | head -1\n}\necho \"the doc luc 0 giay: $(doc | head -1)\"\necho \"the ghi luc 0 giay: $(ghi)\"\nsleep 6\necho \"the doc sau 6 giay: $(doc | grep -o 'permission denied' | head -1)\"\nEOF\n\
      tar cf - in.sh | docker run --rm -i --entrypoint sh $IMG -c 'cd /tmp && tar x && sh in.sh'"
  LAB_L32:
    lang: python
    expect_stdout: 'lech: a, b, c

      dong bo (khong prune): sua a, tao b | lech: c

      dong bo (prune): xoa c | lech: -'
    code: "MONG_MUON = {\"a\": 2, \"b\": 1}\nTHAT = {\"a\": 5, \"c\": 1}\n\n\ndef lech():\n    return sorted({t for t in MONG_MUON if THAT.get(t) != MONG_MUON[t]} | (set(THAT) - set(MONG_MUON)))\n\n\ndef\
      \ dong_bo(prune):\n    viec = []\n    for ten, ban in MONG_MUON.items():\n        if THAT.get(ten) != ban:\n            viec.append((\"sua \" if ten in THAT else \"tao \") + ten)\n            THAT[ten]\
      \ = ban\n    if prune:\n        for ten in sorted(set(THAT) - set(MONG_MUON)):\n            viec.append(\"xoa \" + ten)\n            del THAT[ten]\n    return viec\n\n\ndef hien(ds):\n    return \"\
      , \".join(ds) or \"-\"\n\n\nprint(\"lech:\", hien(lech()))\nprint(\"dong bo (khong prune):\", hien(dong_bo(False)), \"| lech:\", hien(lech()))\nprint(\"dong bo (prune):\", hien(dong_bo(True)), \"\
      | lech:\", hien(lech()))"
