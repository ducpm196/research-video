    lang: bash
    reason: 'Kiểm thật Dockerfile sai (khối BNX L13 pitfalls 0 0): chỉ báo mật khẩu trong ENV, không báo thẻ latest.'
    files:
      Dockerfile: BNX L13 pitfalls 0 0
    code: 'docker build --check . 2>&1 | grep -A3 ''Check complete''

      docker build --check . 2>&1 | grep ''>>>''

      '
    expect_stdout: "Check complete, 1 warning has been found!\n\nWARNING: SecretsUsedInArgOrEnv - https://docs.docker.com/go/dockerfile/rule/secrets-used-in-arg-or-env/\nDo not use ARG or ENV instructions\
      \ for sensitive data (ENV \"DB_PASSWORD\")\n   2 | >>> ENV DB_PASSWORD=MatKhau123\n"
    timeout: 240
