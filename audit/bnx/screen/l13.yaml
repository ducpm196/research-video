sources:
  L13_Dot:
    lang: python
    timeout: 120
    reason: 'Dot: chạy nguyên văn.'
    claims:
    - 'mô phỏng số đợt cập nhật cuốn chiếu: thiếu 1, thừa 1 cần 2, 20, 200 đợt ở 4, 40, 400 bản; mặc định 25% cần 2 đợt ở 4, 40, 400 bản (D chia 4 dư 3, như 3 hay 7, cần 3 đợt); cấu hình (0, 40) ở 400 bản
      cần 10 đợt'
    - số bản sẵn sàng tối thiểu D − thiếu và số Pod tối đa D + thừa ở từng cấu hình
    expect_stdout: '4 1 1 2 3 5

      40 1 1 20 39 41

      400 1 1 200 399 401

      4 1 1 2 3 5

      40 10 10 2 30 50

      400 100 100 2 300 500

      400 0 40 10 400 440'
    unverified_claims:
    - đây là mô phỏng bằng công thức đợt = ceil(D / (thiếu + thừa)), đối chiếu với bộ điều khiển mô phỏng theo mã nguồn Kubernetes ở ver/l13.py trên lưới D ≤ 60; KHÔNG chạy trên cụm Kubernetes thật; 30
      giây mỗi đợt là số minh hoạ
    code: "def so_dot(D, mu, ms):\n    san, dot = 0, 0\n    while san < D:\n        san += min(mu + ms, D - san)\n        dot += 1\n    return dot\n\ndef hang(D, mu, ms):\n    print(D, mu, ms, so_dot(D,\
      \ mu, ms), D - mu, D + ms)\n\nfor D in (4, 40, 400):\n    hang(D, 1, 1)\nfor D in (4, 40, 400):\n    hang(D, D // 4, -(-D // 4))\nhang(400, 0, 40)"
  LAB_L13:
    lang: python
    expect_stdout: 'sua src/Dao.java: lop 5 6 - 27 giay

      sua pom.xml: lop 3 4 5 6 - 108 giay

      sai thu tu, sua src/Dao.java: 108 giay

      D=12 thieu 1 thua 2: 4 dot, toi thieu 11 toi da 14

      D=10 25%/25%: 2 dot, toi thieu 8 toi da 13'
    code: "tot = [(\"FROM\", [], 5), (\"WORKDIR\", [], 1), (\"COPY pom.xml\", [\"pom.xml\"], 1),\n       (\"RUN tai phu thuoc\", [], 80),\n       (\"COPY src\", [\"src/Dao.java\", \"src/Main.java\"], 2),\
      \ (\"RUN dong goi\", [], 25)]\nxau = [(\"FROM\", [], 5),\n       (\"COPY . .\", [\"pom.xml\", \"src/Dao.java\", \"src/Main.java\"], 3),\n       (\"RUN tai va dong goi\", [], 105)]\n\n\ndef dung_lai(lop,\
      \ sua):\n    for i, (ten, dau_vao, giay) in enumerate(lop):\n        if sua in dau_vao:\n            return list(range(i + 1, len(lop) + 1)), sum(l[2] for l in lop[i:])\n    return [], 0\n\n\ndef\
      \ so_dot(D, mu, ms):\n    san, dot = 0, 0\n    while san < D:\n        san += min(mu + ms, D - san)\n        dot += 1\n    return dot\n\n\nfor sua in (\"src/Dao.java\", \"pom.xml\"):\n    cac, giay\
      \ = dung_lai(tot, sua)\n    print(\"sua\", sua + \":\", \"lop\", *cac, \"-\", giay, \"giay\")\nprint(\"sai thu tu, sua src/Dao.java:\", dung_lai(xau, \"src/Dao.java\")[1], \"giay\")\nD, mu, ms = 12,\
      \ 1, 2\nprint(f\"D={D} thieu {mu} thua {ms}:\", so_dot(D, mu, ms), \"dot, toi thieu\", D - mu, \"toi da\", D + ms)\nD = 10\nmu, ms = D // 4, -(-D // 4)\nprint(f\"D={D} 25%/25%:\", so_dot(D, mu, ms),\
      \ \"dot, toi thieu\", D - mu, \"toi da\", D + ms)"
  L13_df_good:
    lang: bash
    reason: Kiểm thật Dockerfile của bài (khối BNX L13 formula 0 0) bằng bộ kiểm tích hợp của BuildKit.
    files:
      Dockerfile: BNX L13 formula 0 0
    code: 'docker build --check . 2>&1 | tail -1

      '
    expect_stdout: 'Check complete, no warnings found.

      '
    timeout: 240
