sources:
  LAB_L03:
    lang: python
    expect_stdout: '2u2clZLfYxRXtF71hz8jZrR1eoKZh8OoqbdfEAFV5_w

      nhan

      het han

      chu ky sai

      sai nguoi nhan'
    code: "import base64, hmac, hashlib, json\n\nKHOA = b\"khoa-lab-l03\"\n\n\ndef b64u(b):\n    return base64.urlsafe_b64encode(b).rstrip(b\"=\").decode()\n\n\ndef ky(dau, than):\n    vao = b64u(dau) +\
      \ \".\" + b64u(than)\n    mac = hmac.new(KHOA, vao.encode(), hashlib.sha256).digest()\n    return vao + \".\" + b64u(mac)\n\n\ndef kiem(ma, aud, bay_gio):\n    d, t, s = ma.split(\".\")\n    mac =\
      \ hmac.new(KHOA, (d + \".\" + t).encode(), hashlib.sha256).digest()\n    if not hmac.compare_digest(b64u(mac), s):\n        return \"chu ky sai\"\n    c = json.loads(base64.urlsafe_b64decode(t + \"\
      =\" * (-len(t) % 4)))\n    if bay_gio >= c[\"exp\"]:\n        return \"het han\"\n    if c[\"aud\"] != aud:\n        return \"sai nguoi nhan\"\n    return \"nhan\"\n\n\ndau = b'{\"alg\":\"HS256\"\
      ,\"typ\":\"JWT\"}'\nthan = b'{\"sub\":\"u42\",\"aud\":\"app-b\",\"exp\":2000}'\nma = ky(dau, than)\nprint(ma.split(\".\")[2])\nprint(kiem(ma, \"app-b\", 1999))\nprint(kiem(ma, \"app-b\", 2000))\n\
      d, t, s = ma.split(\".\")\nsua = b64u(than.replace(b\"u42\", b\"u43\"))\nprint(kiem(d + \".\" + sua + \".\" + s, \"app-b\", 1000))\nprint(kiem(ma, \"app-c\", 1000))"
