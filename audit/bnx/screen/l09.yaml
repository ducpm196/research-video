sources:
  L09_Key:
    lang: python
    timeout: 120
    reason: 'Key: chạy nguyên văn.'
    claims:
    - đầu ra thật của Key
    expect_stdout: '2170508415 // 65536 = 33119 ; mod 32768 = 351

      1024 thùng: 351 | 128 thùng: 95'
    code: 'import zlib

      key = "customer::C1001"

      h = zlib.crc32(key.encode())

      r = (h >> 16) & 0x7FFF          # như thư viện Java của hãng

      print(h, "// 65536 =", h // 65536, "; mod 32768 =", r)

      print("1024 thùng:", r % 1024, "| 128 thùng:", r % 128)'
  L09_StoreUse:
    lang: python
    timeout: 120
    reason: 'StoreUse: chạy nguyên văn.'
    claims:
    - đầu ra thật của StoreUse
    expect_stdout: 'P1: ghi được, CAS mới = 8

      P2: từ chối: CAS lệch

      P2 lần 2: ghi được, CAS mới = 9

      ({''diem_thuong'': 180}, 9)'
    code: "class Store:                      # kho một bản ghi, có CAS\n    def __init__(self):\n        self.doc, self.cas = {\"diem_thuong\": 100}, 7\n    def get(self):\n        return dict(self.doc),\
      \ self.cas\n    def replace(self, doc, cas):\n        if cas != self.cas:\n            return \"từ chối: CAS lệch\"\n        self.doc, self.cas = doc, self.cas + 1\n        return \"ghi được, CAS\
      \ mới = %d\" % self.cas\ns = Store()\nd1, c1 = s.get()                  # P1 đọc: CAS 7\nd2, c2 = s.get()                  # P2 đọc: CAS 7\nd1[\"diem_thuong\"] += 50\nprint(\"P1:\", s.replace(d1,\
      \ c1))\nd2[\"diem_thuong\"] += 30\nprint(\"P2:\", s.replace(d2, c2))\nd2, c2 = s.get()                  # P2 đọc lại\nd2[\"diem_thuong\"] += 30\nprint(\"P2 lần 2:\", s.replace(d2, c2))\nprint(s.get())"
  L09_Inter:
    lang: python
    timeout: 120
    reason: 'Inter: chạy nguyên văn.'
    claims:
    - đầu ra thật của Inter
    expect_stdout: '6 thứ tự, CAS True [180]

      6 thứ tự, CAS False [130, 150, 180]'
    code: "from itertools import permutations\ndef f(order, cas_on):\n    v, ver, rd, add = 100, 7, {}, {\"P1\": 50, \"P2\": 30}\n    for p in order:\n        if p not in rd:                    # lần đầu:\
      \ đọc\n            rd[p] = (v, ver); continue\n        old = rd[p][0] if not cas_on or rd[p][1] == ver else v\n        v, ver = old + add[p], ver + 1     # ghi (lệch CAS: đọc lại)\n    return v\n\
      od = set(permutations([\"P1\", \"P1\", \"P2\", \"P2\"]))\nfor c in (True, False):\n    print(len(od), \"thứ tự, CAS\", c, sorted({f(o, c) for o in od}))"
  L09_Scale:
    lang: python
    timeout: 120
    reason: 'Scale: chạy nguyên văn.'
    claims:
    - đầu ra thật của Scale
    expect_stdout: '2 tien trinh: 3 lan ghi, diem 2

      20 tien trinh: 210 lan ghi, diem 20

      200 tien trinh: 20100 lan ghi, diem 200'
    code: "class Store:                      # kho một bản ghi, có CAS\n    def __init__(self):\n        self.doc, self.cas = {\"diem_thuong\": 100}, 7\n    def get(self):\n        return dict(self.doc),\
      \ self.cas\n    def replace(self, doc, cas):\n        if cas != self.cas:\n            return \"từ chối: CAS lệch\"\n        self.doc, self.cas = doc, self.cas + 1\n        return \"ghi được, CAS\
      \ mới = %d\" % self.cas\nfor n in (2, 20, 200):\n    s, chua, lan = Store(), n, 0\n    s.doc[\"diem_thuong\"] = 0\n    while chua:\n        bo = [s.get() for _ in range(chua)]    # cùng đọc\n    \
      \    chua = 0\n        for d, cas in bo:\n            d[\"diem_thuong\"] += 1\n            lan += 1\n            if s.replace(d, cas).startswith(\"từ\"):\n                chua += 1\n    print(n, \"\
      tien trinh:\", lan, \"lan ghi, diem\", s.doc[\"diem_thuong\"])"
  L09_Lab:
    lang: python
    timeout: 120
    reason: 'Lab: chạy nguyên văn.'
    claims:
    - đầu ra thật của Lab
    expect_stdout: 'thung ao (1024): 892 | (128): 124

      P1: ghi duoc, CAS moi = 5

      P2: tu choi

      P2 lan 2: ghi duoc, CAS moi = 6

      cuoi: 270 6'
    code: "import zlib\nkhoa = \"session::s77\"\nr = (zlib.crc32(khoa.encode()) >> 16) & 0x7FFF\nprint(\"thung ao (1024):\", r % 1024, \"| (128):\", r % 128)\ndoc, cas = 300, 4\ndef ghi(moi, cas_kem):\n\
      \    global doc, cas\n    if cas_kem != cas:\n        return \"tu choi\"\n    doc, cas = moi, cas + 1\n    return \"ghi duoc, CAS moi = %d\" % cas\nd1, c1 = doc, cas\nd2, c2 = doc, cas\nprint(\"P1:\"\
      , ghi(d1 + 20, c1))\nprint(\"P2:\", ghi(d2 - 50, c2))\nd2, c2 = doc, cas\nprint(\"P2 lan 2:\", ghi(d2 - 50, c2))\nprint(\"cuoi:\", doc, cas)"
  LAB_L09:
    lang: python
    expect_stdout: 'thung ao (1024): 892 | (128): 124

      P1: ghi duoc, CAS moi = 5

      P2: tu choi

      P2 lan 2: ghi duoc, CAS moi = 6

      cuoi: 270 6'
    code: "import zlib\nkhoa = \"session::s77\"\nr = (zlib.crc32(khoa.encode()) >> 16) & 0x7FFF\nprint(\"thung ao (1024):\", r % 1024, \"| (128):\", r % 128)\ndoc, cas = 300, 4\ndef ghi(moi, cas_kem):\n\
      \    global doc, cas\n    if cas_kem != cas:\n        return \"tu choi\"\n    doc, cas = moi, cas + 1\n    return \"ghi duoc, CAS moi = %d\" % cas\nd1, c1 = doc, cas\nd2, c2 = doc, cas\nprint(\"P1:\"\
      , ghi(d1 + 20, c1))\nprint(\"P2:\", ghi(d2 - 50, c2))\nd2, c2 = doc, cas\nprint(\"P2 lan 2:\", ghi(d2 - 50, c2))\nprint(\"cuoi:\", doc, cas)"
