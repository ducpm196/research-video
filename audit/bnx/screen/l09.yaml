      - "Dòng r = (h >> 16) & 0x7FFF rồi chia dư cho số thùng chép theo mã nguồn thư viện Java chính thức couchbase-jvm-clients, core-io KeyValueLocator.partitionForKey (đọc 2026-11-11: ((crc32 >> 16) & 0x7fff) & numPartitions - 1). KHÔNG chạy Couchbase thật nên chưa đối chiếu với vBucket máy chủ báo về."
