sources:
  L24_Khach:
    lang: java
    java_class: Khach
    kind: other
    reason: 'Khach: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import jakarta.persistence.*;\nimport java.util.*;\n@Entity\npublic class Khach {\n  @Id Long id;\n  String ten;\n  @OneToMany(mappedBy = \"khach\")\n  List<TaiKhoan> tk = new ArrayList<>();\n\
      }"
  L24_TaiKhoan:
    lang: java
    java_class: TaiKhoan
    kind: other
    reason: 'TaiKhoan: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import jakarta.persistence.*;\n@Entity\npublic class TaiKhoan {\n  @Id Long id;\n  @ManyToOne(fetch = FetchType.LAZY)\n  Khach khach;\n  long soDu;\n}"
  L24_Kho:
    lang: java
    java_class: Kho
    kind: other
    reason: 'Kho: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import org.hibernate.*;\nimport org.hibernate.cfg.Configuration;\npublic class Kho {\n  static SessionFactory mo(int n) {\n    SessionFactory sf = new Configuration()\n        .addAnnotatedClass(Khach.class)\n\
      \        .addAnnotatedClass(TaiKhoan.class)\n        .setProperty(\"hibernate.connection.url\", \"jdbc:h2:mem:bnx\")\n        .setProperty(\"hibernate.hbm2ddl.auto\", \"create-drop\")\n        .setProperty(\"\
      hibernate.generate_statistics\", \"true\")\n        .buildSessionFactory();\n    try (Session s = sf.openSession()) {\n      Transaction t = s.beginTransaction();\n      for (long i = 1; i <= n; i++)\
      \ {\n        Khach k = new Khach();\n        k.id = i;\n        k.ten = \"K\" + i;\n        s.persist(k);\n        for (long j = 1; j <= 2; j++) {\n          TaiKhoan a = new TaiKhoan();\n       \
      \   a.id = i * 10 + j;\n          a.khach = k;\n          a.soDu = 1000 * j;\n          s.persist(a);\n        }\n      }\n      t.commit();\n    }\n    return sf;\n  }\n  static SessionFactory xem()\
      \ {      // cùng CSDL trong bộ nhớ, bật in câu SQL\n    return new Configuration()\n        .addAnnotatedClass(Khach.class)\n        .addAnnotatedClass(TaiKhoan.class)\n        .setProperty(\"hibernate.connection.url\"\
      , \"jdbc:h2:mem:bnx\")\n        .setProperty(\"hibernate.show_sql\", \"true\")\n        .buildSessionFactory();\n  }\n}"
  L24_DemSql:
    lang: java
    java_class: DemSql
    kind: other
    reason: 'DemSql: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import org.hibernate.*;\npublic class DemSql {\n  public static void main(String[] x) {\n    SessionFactory goc = Kho.mo(2);\n    SessionFactory sf = Kho.xem();\n    try (Session s = sf.openSession())\
      \ {\n      for (Khach k : s.createQuery(\"select k from Khach k\",\n          Khach.class).getResultList())\n        System.out.println(k.ten + \": \" + k.tk.size() + \" tai khoan\");\n    }\n  }\n\
      }"
  L24_DemN1:
    lang: java
    java_class: DemN1
    kind: other
    reason: 'DemN1: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import org.hibernate.*;\nimport org.hibernate.stat.Statistics;\npublic class DemN1 {\n  static final String LUOI = \"select k from Khach k where k.id <= :n\";\n  static final String NHANH =\n\
      \      \"select k from Khach k join fetch k.tk where k.id <= :n\";\n  static long dem(SessionFactory sf, String q, long n) {\n    Statistics st = sf.getStatistics();\n    st.clear();\n    try (Session\
      \ s = sf.openSession()) {\n      for (Khach k : s.createQuery(q, Khach.class)\n          .setParameter(\"n\", n).getResultList())\n        k.tk.size();           // đụng vào danh sách tài khoản\n\
      \    }\n    return st.getPrepareStatementCount();\n  }\n  public static void main(String[] x) {\n    SessionFactory sf = Kho.mo(500);\n    for (long n : new long[] {5, 50, 500})\n      System.out.println(n\
      \ + \" khach: tai luoi \" + dem(sf, LUOI, n)\n          + \" cau, JOIN FETCH \" + dem(sf, NHANH, n) + \" cau\");\n  }\n}"
  L24_DemBan:
    lang: java
    java_class: DemBan
    kind: other
    reason: 'DemBan: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import org.hibernate.*;\nimport org.hibernate.stat.Statistics;\npublic class DemBan {\n  public static void main(String[] x) {\n    SessionFactory sf = Kho.mo(3);\n    Statistics st = sf.getStatistics();\n\
      \    try (Session s = sf.openSession()) {\n      st.clear();\n      TaiKhoan a = s.find(TaiKhoan.class, 11L);\n      TaiKhoan b = s.find(TaiKhoan.class, 11L);\n      System.out.println(\"doc hai lan:\
      \ cung doi tuong \" + (a == b)\n          + \", \" + st.getPrepareStatementCount() + \" cau SQL\");\n      Transaction t = s.beginTransaction();\n      a.soDu = a.soDu + 500;          // không gọi\
      \ hàm lưu nào\n      s.createQuery(\"select count(t) from TaiKhoan t\", Long.class)\n          .getSingleResult();\n      System.out.println(\"sau truy van, truoc chot: \"\n          + st.getEntityUpdateCount()\
      \ + \" UPDATE\");\n      t.commit();\n    }\n    try (Session s = sf.openSession()) {\n      st.clear();\n      TaiKhoan c = s.find(TaiKhoan.class, 12L);\n      s.detach(c);                    //\
      \ rời ngữ cảnh bền vững\n      Transaction t = s.beginTransaction();\n      c.soDu = c.soDu + 500;\n      t.commit();\n      System.out.println(\"sua doi tuong da roi: \"\n          + st.getEntityUpdateCount()\
      \ + \" UPDATE\");\n    }\n    try (Session s = sf.openSession()) {\n      System.out.println(\"so du 11: \" + s.find(TaiKhoan.class, 11L).soDu\n          + \", so du 12: \" + s.find(TaiKhoan.class,\
      \ 12L).soDu);\n    }\n  }\n}"
  L24_DemLoi:
    lang: java
    java_class: DemLoi
    kind: other
    reason: 'DemLoi: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import org.hibernate.*;\npublic class DemLoi {\n  public static void main(String[] x) {\n    SessionFactory sf = Kho.mo(3);\n    Khach k;\n    try (Session s = sf.openSession()) {\n      k =\
      \ s.find(Khach.class, 1L);\n    }                                 // phiên đã đóng\n    try {\n      System.out.println(k.tk.size());\n    } catch (LazyInitializationException e) {\n      System.out.println(\"\
      loi: \" + e.getClass().getSimpleName());\n    }\n  }\n}"
  L24_DemNho:
    lang: java
    java_class: DemNho
    kind: other
    reason: 'DemNho: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import org.hibernate.*;\npublic class DemNho {\n  public static void main(String[] x) {\n    SessionFactory sf = Kho.mo(500);\n    try (Session s = sf.openSession()) {\n      for (Khach k : s.createQuery(\"\
      select k from Khach k join fetch \"\n          + \"k.tk\", Khach.class).getResultList())\n        k.ten.length();\n      System.out.println(\"ngu canh giu: \"\n          + s.getStatistics().getEntityCount()\
      \ + \" doi tuong\");\n      s.clear();\n      System.out.println(\"sau clear: \"\n          + s.getStatistics().getEntityCount() + \" doi tuong\");\n    }\n  }\n}"
  L24_DemTrang:
    lang: java
    java_class: DemTrang
    kind: other
    reason: 'DemTrang: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    files:
      Khach.java: src:BNX:L24_Khach
      TaiKhoan.java: src:BNX:L24_TaiKhoan
      Kho.java: src:BNX:L24_Kho
    code: "import org.hibernate.*;\nimport java.util.*;\npublic class DemTrang {\n  static void in(String ten, Session s, List<Khach> ds, long cau) {\n    System.out.println(ten + \": \" + ds.size() + \"\
      \ khach, \" + cau\n        + \" cau, ngu canh giu \" + s.getStatistics().getEntityCount() + \" doi tuong\");\n  }\n  public static void main(String[] x) {\n    SessionFactory sf = Kho.mo(500);\n \
      \   try (Session s = sf.openSession()) {\n      sf.getStatistics().clear();\n      List<Khach> ds = s.createQuery(\"select k from Khach k join fetch k.tk\",\n          Khach.class).setMaxResults(20).getResultList();\n\
      \      in(\"cat tai cho (join fetch + trang)\", s, ds, sf.getStatistics().getPrepareStatementCount());\n    }\n    try (Session s = sf.openSession()) {\n      sf.getStatistics().clear();\n      List<Long>\
      \ ma = s.createQuery(\"select k.id from Khach k order by k.id\",\n          Long.class).setMaxResults(20).getResultList();\n      List<Khach> ds = s.createQuery(\"select k from Khach k join fetch\
      \ k.tk \"\n          + \"where k.id in :ma\", Khach.class).setParameter(\"ma\", ma).getResultList();\n      in(\"hai buoc (lay ma roi join fetch)\", s, ds, sf.getStatistics().getPrepareStatementCount());\n\
      \    }\n  }\n}"
  L24_ChayHib:
    lang: bash
    timeout: 400
    reason: 'ChayHib: chạy nguyên văn.'
    claims:
    - tải lười 6, 51, 501 câu SQL cho 5, 50, 500 khách; nối kèm tải luôn 1 câu
    - sửa đối tượng đang quản lý sinh một lệnh UPDATE ngay khi truy vấn kế tiếp, trước cả khi chốt
    - 'sửa đối tượng đã rời ngữ cảnh: 0 UPDATE'
    - đọc danh sách lười sau khi đóng phiên báo LazyInitializationException
    - ngữ cảnh giữ 1500 đối tượng, sau clear còn 0
    - 'phân trang cùng nối kèm tải danh sách: Hibernate cắt trong bộ nhớ (ngữ cảnh giữ cả 1500 đối tượng); hai bước (lấy mã rồi nối kèm) chỉ giữ 60'
    expect_stdout: 'Hibernate: select k1_0.id,k1_0.ten from Khach k1_0

      Hibernate: select t1_0.khach_id,t1_0.id,t1_0.soDu from TaiKhoan t1_0 where t1_0.khach_id=?

      K1: 2 tai khoan

      Hibernate: select t1_0.khach_id,t1_0.id,t1_0.soDu from TaiKhoan t1_0 where t1_0.khach_id=?

      K2: 2 tai khoan

      5 khach: tai luoi 6 cau, JOIN FETCH 1 cau

      50 khach: tai luoi 51 cau, JOIN FETCH 1 cau

      500 khach: tai luoi 501 cau, JOIN FETCH 1 cau

      doc hai lan: cung doi tuong true, 1 cau SQL

      sau truy van, truoc chot: 1 UPDATE

      sua doi tuong da roi: 0 UPDATE

      so du 11: 1500, so du 12: 2000

      loi: LazyInitializationException

      ngu canh giu: 1500 doi tuong

      sau clear: 0 doi tuong

      cat tai cho (join fetch + trang): 20 khach, 1 cau, ngu canh giu 1500 doi tuong

      hai buoc (lay ma roi join fetch): 20 khach, 2 cau, ngu canh giu 60 doi tuong'
    files:
      Khach.java: src:BNX:L24_Khach
      TaiKhoan.java: src:BNX:L24_TaiKhoan
      Kho.java: src:BNX:L24_Kho
      DemSql.java: src:BNX:L24_DemSql
      DemN1.java: src:BNX:L24_DemN1
      DemBan.java: src:BNX:L24_DemBan
      DemLoi.java: src:BNX:L24_DemLoi
      DemNho.java: src:BNX:L24_DemNho
      DemTrang.java: src:BNX:L24_DemTrang
    code: "D=/d/research-video/audit/bnx/deps/l24\nls $D/hibernate-core-7.1.0.Final.jar >/dev/null 2>&1 || { echo \"NOT_VERIFIED: thiếu jar\" >&2; exit 97; }\nmkdir -p lib out && cp $D/*.jar lib/\njavac\
      \ -encoding UTF-8 -cp \"lib/*\" -d out *.java\nfor c in DemSql DemN1 DemBan DemLoi DemNho DemTrang; do\n  java -Dstdout.encoding=UTF-8 -cp \"out;lib/*\" $c 2>/dev/null\ndone"
