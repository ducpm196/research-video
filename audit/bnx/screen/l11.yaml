    reason: "Bản tin pacs.008.001.08 RÚT GỌN (bài nói rõ “rút gọn”): chỉ giữ các phần tử bài giảng; không phải bản tin đầy đủ để gửi."
    read_check: >-
      (1) Phân tích thật bằng xml.etree.ElementTree trong audit/bnx/ver/l11.py (nhập hằng PACS008_XML): XML đúng cú pháp, gốc
      FIToFICstmrCdtTrf, có GrpHdr/MsgId = MSG-0001, CdtTrfTxInf/IntrBkSttlmAmt thuộc tính Ccy = "USD", giá trị 1000.00 (2 chữ số
      lẻ = CcyMnrUnts của USD theo ISO 4217, danh sách SIX 2026-09-17), ChrgBr = SHAR, CdtrAgt/FinInstnId/BICFI = WESTGB2L
      (8 ký tự, tách đúng 4+2+2 bằng alg.bnx_bic_parts). (2) Tên thẻ và đường dẫn đối chiếu nguyên văn với “CBPR+ Usage Guideline
      pacs.008.001.08 FIToFICustomerCreditTransfer, SR2025 (Combined), 13 December 2024” (bản PDF MyStandards do bnpparibas.pl
      đăng, đọc bằng pdftotext 2026-11-11): FIToFICstmrCdtTrf, GrpHdr, MsgId text{1,35}, CdtTrfTxInf, IntrBkSttlmAmt [1..1]
      với “Xml Attribute Currency <Ccy> [A-Z]{3,3}”, ChrgBr với mã DEBT/CRED/SHAR (Borne By Debtor/Creditor/Shared), CdtrAgt,
      BICFI. (3) Ánh xạ 71A ↔ ChrgBr (BEN↔CRED, OUR↔DEBT, SHA↔SHAR) theo BNY “A deep dive on pacs.008” (02/2021).
