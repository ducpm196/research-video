      - "Bản rút gọn thiếu các phần tử bắt buộc của CBPR+ (CreDtTm, NbOfTxs, SttlmInf, PmtId/UETR, IntrBkSttlmDt, Dbtr, DbtrAgt, Cdtr…) và không khai không gian tên (namespace) của lược đồ — không kiểm theo lược đồ XSD (máy không có XSD chính thức); bài chỉ dùng để đọc tên thẻ"
      - "BIC WESTGB2L là mã minh hoạ (bài ghi “mã minh hoạ”), không tra danh bạ BIC"
