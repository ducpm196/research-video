sources:
  L11_Iban:
    lang: python
    timeout: 120
    reason: 'Iban: chạy nguyên văn.'
    claims:
    - đầu ra thật của Iban
    expect_stdout: 'WEST12345698765432GB82

      3214282912345698765432161182

      1'
    code: "iban = \"GB82WEST12345698765432\"\ns = iban[4:] + iban[:4]     # đưa 4 ký tự đầu ra cuối\nso = \"\"\nfor c in s:\n    so += str(int(c, 36))   # chữ số giữ nguyên, A=10 … Z=35\nprint(s)\nprint(so)\n\
      print(int(so) % 97)"
  L11_Mod:
    lang: python
    timeout: 120
    reason: 'Mod: chạy nguyên văn.'
    claims:
    - đầu ra thật của Mod
    expect_stdout: '1'
    code: "so = \"3214282912345698765432161182\"\ndu = 0\nfor c in so:\n    du = (du * 10 + int(c)) % 97   # chỉ giữ số dư, số luôn nhỏ\nprint(du)"
  L11_Fx:
    lang: python
    timeout: 120
    reason: 'Fx: chạy nguyên văn.'
    claims:
    - đầu ra thật của Fx
    expect_stdout: '1000.00 USD -> 25400000 VND

      SHA: người nhận 985.00 USD'
    code: "from decimal import Decimal, ROUND_HALF_UP\nCHU_SO_LE = {\"USD\": 2, \"VND\": 0}          # ISO 4217\ndef tron(x, ccy):\n    mau = Decimal(1).scaleb(-CHU_SO_LE[ccy])\n    return x.quantize(mau,\
      \ rounding=ROUND_HALF_UP)\nusd = tron(Decimal(\"1000\"), \"USD\")\nti_gia = Decimal(\"25400\")                 # tỉ giá bán, số minh hoạ\nprint(usd, \"USD ->\", tron(usd * ti_gia, \"VND\"), \"VND\"\
      )\nphi = tron(Decimal(\"15\"), \"USD\")          # phí trung gian, minh hoạ\nprint(\"SHA: người nhận\", tron(usd - phi, \"USD\"), \"USD\")"
  L11_Scale:
    lang: python
    timeout: 300
    reason: 'Scale: chạy nguyên văn.'
    claims:
    - đầu ra thật của Scale
    expect_stdout: '10 lan cong 0.10: float 0.9999999999999999 | Decimal 1.00

      10000 lan cong 0.10: float 1000.0000000001588 | Decimal 1000.00

      1000000 lan cong 0.10: float 100000.00000133288 | Decimal 100000.00'
    code: "from decimal import Decimal\nfor n in (10, 10000, 1000000):\n    f, d = 0.0, Decimal(0)\n    for _ in range(n):\n        f += 0.10\n        d += Decimal(\"0.10\")\n    print(n, \"lan cong 0.10:\
      \ float\", f, \"| Decimal\", d)"
  L11_Lab:
    lang: python
    timeout: 120
    reason: 'Lab: chạy nguyên văn.'
    claims:
    - đầu ra thật của Lab
    expect_stdout: 'BIC ABCDDEFFXXX: to chuc ABCD, quoc gia DE, dia diem FF, chi nhanh XXX

      GB90BANK98765432101234: du 1 -> hop le

      GB90BANK98765432101243: du 50 -> khong hop le

      nguoi nhan: OUR 2000 SHA 1988 BEN 1980

      nguoi gui tra: OUR 2020'
    code: "def chu_so(s):\n    return \"\".join(str(int(c, 36)) for c in s)\ndef du97(iban):\n    return int(chu_so(iban[4:] + iban[:4])) % 97\nbic = \"ABCDDEFFXXX\"\nprint(f\"BIC {bic}: to chuc {bic[:4]},\
      \ quoc gia {bic[4:6]}, dia diem {bic[6:8]}, chi nhanh {bic[8:] or '-'}\")\niban = \"GB90BANK98765432101234\"\nsai = iban[:-2] + iban[-1] + iban[-2]\nfor x in (iban, sai):\n    r = du97(x)\n    print(x\
      \ + \": du\", r, \"->\", \"hop le\" if r == 1 else \"khong hop le\")\ntien, phi_gui, phi_tg = 2000, 8, 12\nprint(\"nguoi nhan: OUR\", tien, \"SHA\", tien - phi_tg, \"BEN\", tien - phi_gui - phi_tg)\n\
      print(\"nguoi gui tra: OUR\", tien + phi_gui + phi_tg)"
  LAB_L11:
    lang: python
    expect_stdout: 'BIC ABCDDEFFXXX: to chuc ABCD, quoc gia DE, dia diem FF, chi nhanh XXX

      GB90BANK98765432101234: du 1 -> hop le

      GB90BANK98765432101243: du 50 -> khong hop le

      nguoi nhan: OUR 2000 SHA 1988 BEN 1980

      nguoi gui tra: OUR 2020'
    code: "def chu_so(s):\n    return \"\".join(str(int(c, 36)) for c in s)\ndef du97(iban):\n    return int(chu_so(iban[4:] + iban[:4])) % 97\nbic = \"ABCDDEFFXXX\"\nprint(f\"BIC {bic}: to chuc {bic[:4]},\
      \ quoc gia {bic[4:6]}, dia diem {bic[6:8]}, chi nhanh {bic[8:] or '-'}\")\niban = \"GB90BANK98765432101234\"\nsai = iban[:-2] + iban[-1] + iban[-2]\nfor x in (iban, sai):\n    r = du97(x)\n    print(x\
      \ + \": du\", r, \"->\", \"hop le\" if r == 1 else \"khong hop le\")\ntien, phi_gui, phi_tg = 2000, 8, 12\nprint(\"nguoi nhan: OUR\", tien, \"SHA\", tien - phi_tg, \"BEN\", tien - phi_gui - phi_tg)\n\
      print(\"nguoi gui tra: OUR\", tien + phi_gui + phi_tg)"
