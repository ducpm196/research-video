sources:
  L15_Cap:
    lang: python
    timeout: 120
    reason: 'Cap: chạy nguyên văn.'
    claims:
    - 'một triệu giao dịch/ngày: trung bình 11,6, cao điểm (gấp 10, số minh hoạ) 116 giao dịch/giây; còn dư 225 ms; 4,63 lệnh cùng lúc ở Oracle (115,74 chưa làm tròn × 0,040; số minh hoạ)'
    expect_stdout: 'giay moi ngay: 86400

      trung binh: 11.6

      cao diem: 116

      con du (ms): 225

      cung luc o Oracle: 4.63'
    code: 'ngay = 24 * 60 * 60                 # giây trong một ngày

      tb = 1_000_000 / ngay               # giao dịch/giây, trung bình

      cao = 10 * tb                       # cao điểm gấp 10 (số minh hoạ)

      du = 300 - (10 + 5 + 20 + 40)       # ms còn dư (số minh hoạ)

      dong_thoi = cao * 40 / 1000         # lệnh cùng lúc ở Oracle

      print("giay moi ngay:", ngay)

      print("trung binh:", round(tb, 1))

      print("cao diem:", round(cao))

      print("con du (ms):", du)

      print("cung luc o Oracle:", round(dong_thoi, 2))'
  L15_CungLuc:
    lang: python
    timeout: 120
    reason: 'CungLuc: chạy nguyên văn.'
    claims:
    - 'đếm thật số lệnh chồng nhau ở Oracle (mỗi lệnh 40 ms): 5, 463, 46 297 ở cao điểm 116, 11 574, 1 157 407 giao dịch/giây (phép nhân Little: 4,64; 462,96; 46 296,28)'
    expect_stdout: '116 4.64 5

      11574 462.96 463

      1157407 46296.28 46297'
    unverified_claims:
    - tải cao điểm 116 / 11 574 / 1 157 407 giao dịch/giây là ×1, ×100, ×10 000 của số minh hoạ 1 triệu giao dịch/ngày × hệ số 10; bể 50 kết nối và 40 ms mỗi lệnh là số minh hoạ, không đo hệ thống thật
    code: "def cung_luc(tps, w=40_000):            # w: micro giay\n    vao = [i * 1_000_000 // tps for i in range(tps // 5)]\n    j = top = 0\n    for i, t in enumerate(vao):\n        while vao[j] + w\
      \ <= t:\n            j += 1\n        top = max(top, i - j + 1)\n    return top\n\nfor tps in (116, 11_574, 1_157_407):\n    print(tps, round(tps * 0.040, 2), cung_luc(tps))"
  LAB_L15:
    lang: python
    expect_stdout: 'trung binh 57.9 giao dich/giay

      cao diem 347 giao dich/giay

      con du 234 ms

      cung luc o Oracle 41.7

      be 30 ket noi: khong du - can it nhat 42'
    code: 'import math


      ngay = 24 * 60 * 60

      tb = 5_000_000 / ngay

      cao = 6 * tb

      chang = [12, 6, 25, 120, 3]

      du = 400 - sum(chang)

      dong_thoi = cao * 0.120

      print("trung binh", round(tb, 1), "giao dich/giay")

      print("cao diem", round(cao), "giao dich/giay")

      print("con du", du, "ms")

      print("cung luc o Oracle", round(dong_thoi, 1))

      print("be 30 ket noi:", "khong du" if dong_thoi > 30 else "du", "- can it nhat", math.ceil(dong_thoi))'
