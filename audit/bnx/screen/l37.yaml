sources:
  L37_Goi:
    lang: java
    java_class: Goi
    kind: other
    reason: 'Goi: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import java.sql.*;\n\npublic class Goi {\n  static void chuyen(Connection c, long tien) {\n    String goi = \"{call bnx_l06_chuyen_tien(?, ?, ?, ?)}\";\n    try (CallableStatement cs = c.prepareCall(goi))\
      \ {\n      cs.setLong(1, 1); cs.setLong(2, 2);\n      cs.setLong(3, tien);\n      cs.registerOutParameter(4, Types.VARCHAR);\n      cs.execute();\n      System.out.println(tien + \": \" + cs.getString(4));\n\
      \    } catch (SQLException e) {\n      System.out.println(tien + \": loi \" + e.getErrorCode());\n    }\n  }\n\n  public static void main(String[] args) throws Exception {\n    String url = \"jdbc:oracle:thin:@//localhost:1521/FREEPDB1\"\
      ;\n    String pass = System.getenv(\"BNX_PASS\");\n    try (Connection c = DriverManager.getConnection(\n             url, \"bnx\", pass)) {\n      chuyen(c, 500000);\n      chuyen(c, 200000);\n \
      \   }\n  }\n}"
  L37_Tim:
    lang: java
    java_class: Tim
    kind: other
    reason: 'Tim: nguồn cần thư viện ngoài, ghi nguyên văn vào thư mục chạy của chương trình chạy thật'
    read_check: Biên dịch và chạy cùng chương trình bash đi kèm (khối `files`); khớp từng ký tự đầu ra.
    code: "import java.sql.*;\n\npublic class Tim {\n  public static void main(String[] args) throws Exception {\n    String url = \"jdbc:oracle:thin:@//localhost:1521/FREEPDB1\";\n    String sql = \"SELECT\
      \ COUNT(*) FROM bnx_l06_tk WHERE ten = ?\";\n    try (Connection c = DriverManager.getConnection(\n             url, \"bnx\", System.getenv(\"BNX_PASS\"));\n         PreparedStatement ps = c.prepareStatement(sql))\
      \ {\n      for (String ten : new String[] {\"A\", \"X' OR '1'='1\"}) {\n        ps.setString(1, ten);\n        try (ResultSet rs = ps.executeQuery()) {\n          rs.next();\n          System.out.println(ten\
      \ + \": \" + rs.getInt(1) + \" dong\");\n        }\n      }\n    }\n  }\n}"
  L37_ChayJdbc:
    lang: bash
    timeout: 300
    reason: 'ChayJdbc: chạy nguyên văn.'
    claims:
    - 'gọi thủ tục Oracle qua CallableStatement: 500000 báo lỗi 20001, 200000 trả OK'
    - 'PreparedStatement: tên A trả 1 dòng, chuỗi tấn công trả 0 dòng'
    expect_stdout: '500000: loi 20001

      200000: OK

      A: 1 dong

      X'' OR ''1''=''1: 0 dong'
    files:
      Goi.java: src:BNX:L37_Goi
      Tim.java: src:BNX:L37_Tim
    code: "D=/d/research-video/audit/bnx/deps/l37\nls $D/ojdbc11-23.26.4.0.0.jar >/dev/null 2>&1 || { echo \"NOT_VERIFIED: thiếu jar\" >&2; exit 97; }\nexport BNX_PASS=bnx_pass\nMSYS_NO_PATHCONV=1 docker\
      \ exec -i bnx-ora sqlplus -s -L bnx/bnx_pass@//localhost/FREEPDB1 >/dev/null <<'SQL'\nDROP TABLE IF EXISTS bnx_l06_tk;\nCREATE TABLE bnx_l06_tk (\n  id    NUMBER PRIMARY KEY,\n  ten   VARCHAR2(10),\n\
      \  so_du NUMBER CONSTRAINT bnx_l06_ck CHECK (so_du >= 0));\nINSERT INTO bnx_l06_tk VALUES (1, 'A', 300000);\nINSERT INTO bnx_l06_tk VALUES (2, 'B', 1000000);\nCOMMIT;\nCREATE OR REPLACE PROCEDURE\
      \ bnx_l06_chuyen_tien (\n  p_from   IN  NUMBER,\n  p_to     IN  NUMBER,\n  p_amt    IN  NUMBER,\n  p_status OUT VARCHAR2) AS\n  v_x   NUMBER;\n  v_bal NUMBER;\nBEGIN\n  IF p_amt IS NULL OR p_amt <=\
      \ 0 THEN\n    RAISE_APPLICATION_ERROR(-20002, 'So tien phai lon hon 0');\n  END IF;\n  SELECT so_du INTO v_x FROM bnx_l06_tk\n   WHERE id = LEAST(p_from, p_to) FOR UPDATE;\n  SELECT so_du INTO v_x\
      \ FROM bnx_l06_tk\n   WHERE id = GREATEST(p_from, p_to) FOR UPDATE;\n  SELECT so_du INTO v_bal FROM bnx_l06_tk WHERE id = p_from;\n  IF v_bal < p_amt THEN\n    RAISE_APPLICATION_ERROR(-20001, 'So\
      \ du khong du');\n  END IF;\n  UPDATE bnx_l06_tk SET so_du = so_du - p_amt WHERE id = p_from;\n  UPDATE bnx_l06_tk SET so_du = so_du + p_amt WHERE id = p_to;\n  COMMIT;\n  p_status := 'OK';\nEXCEPTION\n\
      \  WHEN OTHERS THEN\n    ROLLBACK;\n    RAISE;\nEND;\n/\nexit\nSQL\nmkdir -p lib out && cp $D/*.jar lib/\njavac -encoding UTF-8 -cp \"lib/*\" -d out Goi.java Tim.java\njava -cp \"out;lib/*\" Goi\n\
      java -cp \"out;lib/*\" Tim"
  LAB_L37:
    lang: python
    expect_stdout: 'chuoi 1: ghep 1 dong, tham so 1 dong

      chuoi 2: ghep 4 dong, tham so 0 dong

      chuoi 3: ghep 2 dong, tham so 0 dong'
    code: "import sqlite3\n\ndb = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE tk (ten TEXT, so_du INTEGER)\")\ndb.executemany(\"INSERT INTO tk VALUES (?, ?)\",\n               [(\"An\", 500),\
      \ (\"Binh\", 700), (\"Chi\", 900), (\"Dung\", 100)])\n\n\ndef ghep(ten):\n    sql = \"SELECT ten FROM tk WHERE ten = '\" + ten + \"'\"\n    return db.execute(sql).fetchall()\n\n\ndef tham_so(ten):\n\
      \    sql = \"SELECT ten FROM tk WHERE ten = ?\"\n    return db.execute(sql, (ten,)).fetchall()\n\n\nCHUOI = (\"An\", \"X' OR '1'='1\", \"B' OR so_du > 600 --\")\nfor i, ten in enumerate(CHUOI, 1):\n\
      \    print(f\"chuoi {i}: ghep {len(ghep(ten))} dong, tham so {len(tham_so(ten))} dong\")"
  L37_mss_base:
    lang: mssql
    code: "\nIF DB_ID('bnx_l37') IS NULL CREATE DATABASE bnx_l37;\nGO\nUSE bnx_l37;\nGO\nDROP TABLE IF EXISTS dbo.tk;\nCREATE TABLE dbo.tk (\n  id    INT PRIMARY KEY,\n  ten   VARCHAR(10),\n  so_du BIGINT\
      \ CONSTRAINT ck_so_du CHECK (so_du >= 0));\nINSERT INTO dbo.tk VALUES (1, 'A', 300000), (2, 'B', 1000000);\nGO\n"
    reason: Tạo database bnx_l37 và bảng dbo.tk hai tài khoản A = 300 000, B = 1 000 000; màn hình hiện nguyên khối (cảnh prereq). Chép từ MSS_BASE của audit/bnx/src/l37.py.
    post: SELECT SUM(so_du) AS tong FROM dbo.tk;
    claims:
    - hai tài khoản tổng 1 300 000
    expect_stdout: 'Changed database context to ''bnx_l37''.


      (2 rows affected)

      1300000


      (1 rows affected)'
  L37_mss_proc:
    lang: mssql
    code: "\nCREATE OR ALTER PROCEDURE dbo.chuyen_tien\n  @from   INT,\n  @to     INT,\n  @amt    BIGINT,\n  @status VARCHAR(20) OUTPUT\nAS\nBEGIN\n  SET NOCOUNT ON;\n  SET XACT_ABORT ON;\n  DECLARE @x\
      \ BIGINT, @bal BIGINT;\n  BEGIN TRY\n    IF @amt IS NULL OR @amt <= 0\n      THROW 50002, 'So tien phai lon hon 0', 1;\n    BEGIN TRAN;\n    SELECT @x = so_du FROM dbo.tk WITH (UPDLOCK, ROWLOCK)\n\
      \     WHERE id = LEAST(@from, @to);\n    SELECT @x = so_du FROM dbo.tk WITH (UPDLOCK, ROWLOCK)\n     WHERE id = GREATEST(@from, @to);\n    SELECT @bal = so_du FROM dbo.tk WHERE id = @from;\n    IF\
      \ @bal < @amt\n      THROW 50001, 'So du khong du', 1;\n    UPDATE dbo.tk SET so_du = so_du - @amt WHERE id = @from;\n    UPDATE dbo.tk SET so_du = so_du + @amt WHERE id = @to;\n    COMMIT;\n    SET\
      \ @status = 'OK';\n  END TRY\n  BEGIN CATCH\n    IF @@TRANCOUNT > 0 ROLLBACK;\n    THROW;\n  END CATCH\nEND;\nGO\n"
    prelude_keys:
    - src:BNX:L37_mss_base
    reason: Thủ tục T-SQL đầy đủ; màn hình hiện ba đoạn ở cảnh formula bước 1–3 (fragment within nguồn này). ver/l37.py kiểm trùng hằng MSS_PROC.
    post: SELECT CASE WHEN OBJECT_ID('dbo.chuyen_tien', 'P') IS NOT NULL THEN 'co thu tuc' ELSE 'khong co' END;
    claims:
    - CREATE OR ALTER PROCEDURE chạy được trên SQL Server 2022 CU27 (LEAST/GREATEST có từ bản 2022)
    expect_stdout: 'Changed database context to ''bnx_l37''.


      (2 rows affected)

      co thu tuc


      (1 rows affected)'
  L37_mss_scale:
    lang: mssql
    code: "\nSET NOCOUNT ON;\nDECLARE @n INT = 2, @sql NVARCHAR(200);\nDECLARE @ten VARCHAR(50) = 'X'' OR ''1''=''1';\nWHILE @n <= 20000\nBEGIN\n  DROP TABLE IF EXISTS dbo.tk_lon;\n  SELECT TOP (@n) 'K'\
      \ AS ten INTO dbo.tk_lon\n    FROM sys.all_objects a, sys.all_objects b;\n  SET @sql = N'SELECT ''ghep'', COUNT(*) FROM dbo.tk_lon WHERE ten = '''\n           + @ten + N'''';\n  EXEC (@sql);\n  EXEC\
      \ sp_executesql\n    N'SELECT ''tham so'', COUNT(*) FROM dbo.tk_lon WHERE ten = @p',\n    N'@p VARCHAR(50)', @p = @ten;\n  SET @n = @n * 100;\nEND\n"
    prelude_keys:
    - src:BNX:L37_mss_base
    reason: 'Đo quy mô chèn mã: bảng dbo.tk_lon có 2, 200, 20 000 dòng; đếm dòng lộ ra (tất định); màn hình hiện hai đoạn (dòng 1–8 và 9–16) và kết quả.'
    post: ''
    claims:
    - ghép chuỗi lộ 2, 200, 20 000 dòng (bằng cả bảng), tham số hoá lộ 0 dòng ở mọi cỡ
    expect_stdout: 'Changed database context to ''bnx_l37''.


      (2 rows affected)

      ghep 2

      tham so 0

      ghep 200

      tham so 0

      ghep 20000

      tham so 0'
