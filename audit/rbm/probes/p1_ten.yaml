name: rbm_p1_ten
# Vòng 1 cho RBM: tên riêng và thuật ngữ ngoại. Đọc BẢN CHÉP (ASR đổi r → tr: khoá ngắn dễ khớp giả).
ctx:
  - "Ta dùng {} mỗi ngày khi điều khiển tay máy."
  - "Phần {} được tính ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: kalman
    variants: ["Kalman", "Ca-man", "Can-man"]
    negative: "Ca-nan"
    keys: ["kalman", "caman", "canman", "calman", "kaman"]
  - key: runge_kutta
    variants: ["Runge–Kutta", "Run-ghe Cút-ta", "Rung-gơ Cu-ta"]
    negative: "Run-ghe Bút-ta"
    keys: ["rungekutta", "runghecutta", "runghekutta", "runggocuta", "rungkutta", "rungecutta", "runghecuta", "rungcuta"]
  - key: quaternion
    variants: ["quaternion", "qua-tơ-ni-ơn", "quát-tơ-ni-ân"]
    negative: "qua-tơ-li-ơn"
    keys: ["quaternion", "quatonion", "quatoni", "quattonian", "quatonian", "quatternion"]
  - key: gimbal
    variants: ["gimbal", "gim-bồ", "dim-bồ"]
    negative: "gim-bàn"
    keys: ["gimbal", "gimbo", "dimbo", "gimbon", "gimball"]
  - key: nyquist
    variants: ["Nyquist", "Nai-quít", "Ny-quít"]
    negative: "Nai-quýt-tơ"
    keys: ["nyquist", "naiquit", "nyquit", "naiquist", "naikuit", "naiquis"]
  - key: fourier
    variants: ["Fourier", "Phu-ri-ê", "Phu-ri-e"]
    negative: "Phu-li-ê"
    keys: ["fourier", "phurie", "furie", "fourie", "phuriê"]
  - key: pid
    variants: ["PID", "pê i đê", "pi ai đi"]
    negative: "pê i bê"
    keys: ["pid", "peide", "piaidi", "peyde", "pede"]
  - key: hz
    variants: ["Hz", "héc", "hẹc"]
    negative: "hét"
    keys: ["hz", "hec", "hertz", "herz"]
  - key: radian
    variants: ["radian", "ra-đi-an", "ra-di-an"]
    negative: "ra-đi-ô"
    keys: ["radian", "radi an", "radians"]
  - key: robot
    variants: ["robot", "rô-bốt", "rô bốt"]
    negative: "rô-bông"
    keys: ["robot", "robot", "robo"]
  - key: euler
    variants: ["Euler", "Ơ-le"]
    negative: "Ơ-me"
    keys: ["euler", "ole", "olle", "oiler", "euler"]
  - key: atan2
    variants: ["atan2", "a-tan 2", "a tang 2"]
    negative: "a-tan 3"
    keys: ["atan2", "atanhai", "atang2", "atanghai", "atan"]
