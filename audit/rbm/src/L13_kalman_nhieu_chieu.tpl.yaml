# Quy ước: trạng thái x = (p, v)^T (vị trí, vận tốc); ước lượng \hat{\mathbf{x}}, hiệp phương sai P (2 × 2, CS115 bài 15);
#   ma trận chuyển F = [[1, h], [0, 1]]; ma trận đo H = [1, 0] (chỉ đo vị trí); nhiễu đo phương sai R (một số);
#   nhiễu quá trình Q (ví dụ chính đặt Q = 0 để số gọn; nói rõ trên bảng). Mọi số do alg.kalman_cv tính.
objectives:
  - "Viết mô hình vận tốc không đổi bằng ma trận F và H"
  - "Chạy một bước dự đoán – cập nhật bằng ma trận"
  - "Thấy hiệp phương sai làm phép đo vị trí sửa được cả vận tốc"
