scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chỉ đo vị trí, vẫn biết vận tốc?"
    steps:
      - show: |
          <p>Cảm biến chỉ báo vị trí robot. Nhưng để điều khiển, ta cần cả <b>vận tốc</b>.</p>
          <p>Lấy hiệu hai lần đo chia thời gian thì nhiễu bị khuếch đại. Có cách tốt hơn không?</p>
          <div class="box key">Hôm nay: lọc Kalman <b>nhiều chiều</b> — ước lượng cả vị trí lẫn vận tốc, và phép đo vị trí sửa được cả vận tốc.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, cảm biến chỉ báo vị trí của robot, nhưng để điều khiển, ta cần cả vận tốc. Lấy hiệu hai lần đo rồi chia cho thời gian thì nhiễu bị khuếch đại. Vậy có cách nào tốt hơn không? Hôm nay ta học lọc Kalman nhiều chiều, ước lượng cùng lúc vị trí và vận tốc, và thấy phép đo vị trí sửa được cả vận tốc."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: nhân hai ma trận, và lọc Kalman một chiều"
    checks:
      - "np.allclose(np.array([[1, 1], [0, 1]]) @ np.array([[1, 0], [1, 1]]), [[2, 1], [1, 1]])"
      - "1 * 1 + 1 * 1 == 2 and 1 * 0 + 1 * 1 == 1 and 0 * 1 + 1 * 1 == 1 and 0 * 0 + 1 * 1 == 1"
      - "alg.kalman1d_update(0, 1, 1, 1) == (0.5, 0.5, 0.5)"
    steps:
      - show: |
          <p>Nhân hai ma trận: ô hàng $i$, cột $j$ = hàng $i$ của ma trận trái nhân lần lượt với cột $j$ của ma trận phải rồi cộng. <b>Chuyển vị</b> $\mathbf{M}^T$: đổi hàng thành cột, $\begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix}^T = \begin{bmatrix} 1 & 0 \\ 1 & 1 \end{bmatrix}$.</p>
          <table class="t"><tr><th>ô</th><th>hàng của $\begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix}$ nhân cột của $\begin{bmatrix} 1 & 0 \\ 1 & 1 \end{bmatrix}$</th><th>kết quả</th></tr>
          <tr><td>trên trái</td><td>$1 \cdot 1 + 1 \cdot 1$</td><td>2</td></tr>
          <tr><td>trên phải</td><td>$1 \cdot 0 + 1 \cdot 1$</td><td>1</td></tr>
          <tr><td>dưới trái</td><td>$0 \cdot 1 + 1 \cdot 1$</td><td>1</td></tr>
          <tr><td>dưới phải</td><td>$0 \cdot 0 + 1 \cdot 1$</td><td>1</td></tr></table>
        focus: [1, 1, 1, "2.2", ["2.3", "2.4"], "2.5"]
        say: "Trước hết, ta cần hiểu hai điều. Điều thứ nhất là nhân hai ma trận, ô ở hàng i cột j bằng hàng i của ma trận trái nhân lần lượt với cột j của ma trận phải, rồi cộng các tích lại. Chuyển vị của một ma trận là đổi hàng thành cột, nên chuyển vị của ma trận 1, 1, 0, 1 có hàng trên 1, 0 và hàng dưới 1, 1. Ví dụ nhân ma trận 1, 1, 0, 1 với chuyển vị của nó, ô trên trái là 1 nhân 1 cộng 1 nhân 1, bằng 2. Hai ô chéo phụ đều bằng 1. Ô dưới phải bằng 1, nên kết quả là ma trận 2, 1, 1, 1, và ta sẽ gặp lại nó ngay trong ví dụ."
      - clear: true
        show: |
          <p>Lọc Kalman một chiều ở bài 12: $K = \dfrac{P}{P + R}$, ước lượng dịch về phía phép đo một phần $K$ của độ lệch, phương sai nhân với $1 - K$.</p>
          <table class="t"><tr><th>dự đoán</th><th>phép đo</th><th>$K$</th><th>ước lượng mới</th><th>phương sai mới</th></tr>
          <tr><td>0, $P = 1$</td><td>1, $R = 1$</td><td>0,5</td><td>0,5</td><td>0,5</td></tr></table>
        focus: [1, 1, "2.2"]
        say: "Điều thứ hai là lọc Kalman một chiều ở bài 12, hệ số K bằng P chia P cộng R. Ước lượng dịch về phía phép đo một phần K của độ lệch, và phương sai nhân với 1 trừ K. Ví dụ dự đoán 0 với phương sai 1, đo được 1 với R bằng 1, thì K bằng 0 phẩy 5, ước lượng mới 0 phẩy 5, phương sai mới 0 phẩy 5."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: F, H và hiệp phương sai P"
    checks:
      - "np.allclose(np.array([[1, 0.5], [0, 1]]) @ [2, 3], [3.5, 3])"
      - "(1 * 1 + (-1) * (-1)) / 2 == 1 and np.cov([1, -1], [1, -1], bias=True)[0][1] == 1 and np.array([[1, 1], [0, 1]]).T.tolist() == [[1, 0], [1, 1]]"
    steps:
      - show: |
          <p>Trạng thái $\mathbf{x} = (p, v)^T$. Mô hình vận tốc không đổi, bước $h$: $p \leftarrow p + h v$, $v \leftarrow v$.</p>
          <p>$\mathbf{F} = \begin{bmatrix} 1 & h \\ 0 & 1 \end{bmatrix}$ — ma trận chuyển. $\quad \mathbf{H} = \begin{bmatrix} 1 & 0 \end{bmatrix}$ — chỉ đọc ra vị trí.</p>
          <p>$\mathbf{P}$: ma trận <b>hiệp phương sai</b>. Đường chéo là phương sai, tức độ không chắc của $p$ và $v$; ô ngoài đường chéo là hiệp phương sai — trung bình của tích (sai số $p$) × (sai số $v$): dương nếu hai sai số hay cùng dấu, âm nếu hay trái dấu, 0 nếu không liên quan. Ví dụ hai khả năng như nhau $(1, 1)$ và $(-1, -1)$: $\frac{1 \cdot 1 + (-1)(-1)}{2} = 1$.</p>
        introduces: [hmeas]
        focus: [1, 1, 2, 2, 3, 3, 3, 3]
        say: "Trạng thái gồm vị trí p và vận tốc v. Theo mô hình vận tốc không đổi, sau một bước h, vị trí tăng thêm h v, còn vận tốc giữ nguyên. Viết thành ma trận chuyển F, hàng trên 1, h và hàng dưới 0, 1. Ma trận đo H bằng 1, 0, nghĩa là cảm biến chỉ đọc ra vị trí. P là ma trận hiệp phương sai, đường chéo là phương sai, tức độ không chắc của p và của v. Ô ngoài đường chéo là hiệp phương sai, tức trung bình của tích sai số p nhân sai số v. Nó dương khi hai sai số hay cùng dấu, âm khi hay trái dấu, và bằng 0 khi chúng không liên quan. Ví dụ hai sai số cùng bằng 1 hoặc cùng bằng âm 1, mỗi khả năng một nửa, thì hiệp phương sai là trung bình của 1 và 1, bằng 1."

  # ───────────────────────── 3. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Hai bước, viết bằng ma trận"
    checks:
      - "all(np.allclose(alg.kalman_cv((0, 0), np.eye(2) * s, 1.0, 1, np.zeros((2, 2)), 1)[2], (np.array([[1, 1], [0, 1]]) @ (np.eye(2) * s) @ np.array([[1, 0], [1, 1]]))[:, 0] / ((np.array([[1, 1], [0, 1]]) @ (np.eye(2) * s) @ np.array([[1, 0], [1, 1]]))[0, 0] + 1)) for s in (0.5, 1, 3))"
    steps:
      - show: |
          <p><b>Dự đoán</b>: $\quad \hat{\mathbf{x}} \leftarrow \mathbf{F}\hat{\mathbf{x}}$, $\quad \mathbf{P} \leftarrow \mathbf{F}\mathbf{P}\mathbf{F}^T + \mathbf{Q}$</p>
          <p><b>Cập nhật</b> (phép đo $z$, phương sai $R$):</p>
          <p>$S = \mathbf{H}\mathbf{P}\mathbf{H}^T + R$, $\quad \mathbf{K} = \mathbf{P}\mathbf{H}^T / S$</p>
          <p>$\hat{\mathbf{x}} \leftarrow \hat{\mathbf{x}} + \mathbf{K}(z - \mathbf{H}\hat{\mathbf{x}})$, $\quad \mathbf{P} \leftarrow (\mathbf{I}_2 - \mathbf{K}\mathbf{H})\mathbf{P}$</p>
          <div class="box key">Giống hệt bài 12: $S$ đóng vai $P + R$, và $\mathbf{K}$ giờ là một <b>cột</b> — mỗi thành phần trạng thái có trọng số riêng.</div>
        focus: [1, 2, 3, 4, 5, 5]
        say: "Bước dự đoán, nhân ước lượng với F, và P thành F P F chuyển vị cộng Q, vì sai số cũng bị F biến đổi như trạng thái. Bước cập nhật, khi có phép đo z với phương sai R. Ta tính S bằng H P H chuyển vị cộng R, và K bằng P H chuyển vị chia S. Ước lượng dịch theo K nhân độ lệch z trừ H x mũ, còn P nhân với I trừ K H. Mọi thứ giống hệt bài 12, S đóng vai P cộng R. Điểm mới là K bây giờ là một cột, mỗi thành phần của trạng thái có trọng số riêng."

  - id: intuition
    kind: intuition
    title: "Hình dung: đám mây nghiêng nối vị trí với vận tốc"
    checks:
      - "abs(1 / 2 - np.array([[2, 1], [1, 1]])[0, 1] / np.array([[2, 1], [1, 1]])[0, 0]) < 1e-12"
      - "round(1 + 2 / 3 * 0.5, 3) == 1.333 and round(1 / 3 * 0.5, 3) == 0.167 and round((4 / 3 - 1) * 0.5, 3) == 0.167"
    steps:
      - show: |
          <div><svg width="1200" height="450" viewBox="0 0 1200 450"><defs><marker id="km" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><line x1="52.0" y1="400" x2="700.0" y2="400" stroke="#6b7280" stroke-width="2"/><line x1="160" y1="442.0" x2="160" y2="50.0" stroke="#6b7280" stroke-width="2"/><text x="700.0" y="432" font-size="22" text-anchor="end" fill="#6b7280">vị trí p</text><text x="170" y="56.0" font-size="22" text-anchor="start" fill="#6b7280">vận tốc v</text><text x="340" y="430" font-size="20" text-anchor="middle" fill="#6b7280">1</text><text x="520" y="430" font-size="20" text-anchor="middle" fill="#6b7280">2</text><text x="148" y="267" font-size="20" text-anchor="end" fill="#6b7280">1</text><text x="148" y="127" font-size="20" text-anchor="end" fill="#6b7280">2</text><polygon points="594.6,161.0 593.6,152.8 590.7,145.3 585.9,138.8 579.2,133.1 570.7,128.4 560.5,124.8 548.5,122.1 535.0,120.5 520.0,120.0 503.6,120.5 486.0,122.1 467.3,124.8 447.6,128.4 427.1,133.1 405.9,138.8 384.2,145.3 362.2,152.8 340.0,161.0 317.8,170.0 295.8,179.7 274.1,190.0 252.9,200.8 232.4,212.1 212.7,223.8 194.0,235.7 176.4,247.8 160.0,260.0 145.0,272.2 131.5,284.3 119.5,296.2 109.3,307.9 100.8,319.2 94.1,330.0 89.3,340.3 86.4,350.0 85.4,359.0 86.4,367.2 89.3,374.7 94.1,381.2 100.8,386.9 109.3,391.6 119.5,395.2 131.5,397.9 145.0,399.5 160.0,400.0 176.4,399.5 194.0,397.9 212.7,395.2 232.4,391.6 252.9,386.9 274.1,381.2 295.8,374.7 317.8,367.2 340.0,359.0 362.2,350.0 384.2,340.3 405.9,330.0 427.1,319.2 447.6,307.9 467.3,296.2 486.0,284.3 503.6,272.2 520.0,260.0 535.0,247.8 548.5,235.7 560.5,223.8 570.7,212.1 579.2,200.8 585.9,190.0 590.7,179.7 593.6,170.0 594.6,161.0" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><line x1="70.0" y1="365.0" x2="664.0" y2="134.0" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="10 7"/><line x1="430.0" y1="442.0" x2="430.0" y2="50.0" stroke="#eb6834" stroke-width="3"/><text x="438.0" y="71.0" font-size="22" text-anchor="start" fill="#eb6834" font-weight="bold">phép đo: p = 1,5</text><circle cx="340" cy="260" r="8" fill="#1f2937"/><line x1="340" y1="260" x2="400.0" y2="236.7" stroke="#15803d" stroke-width="4" marker-end="url(#km)"/><circle cx="400.0" cy="236.7" r="8" fill="#15803d"/><text x="760" y="80" font-size="23" text-anchor="start" fill="#2a78d6" font-weight="bold">Elip xanh: dự đoán (1, 1), nghiêng lên</text><text x="760" y="126" font-size="23" text-anchor="start" fill="#2a78d6">vì p lớn thì v cũng thường lớn.</text><text x="760" y="172" font-size="23" text-anchor="start" fill="#2a78d6">Đường đứt nối hai mép, dốc 1/2.</text><text x="760" y="242" font-size="23" text-anchor="start" fill="#eb6834">Phép đo kéo p từ 1 lên 1,333,</text><text x="760" y="288" font-size="23" text-anchor="start" fill="#1f2937">dọc đường đứt nên v lên theo:</text><text x="760" y="334" font-size="23" text-anchor="start" fill="#15803d" font-weight="bold">0,333 nhân 1/2 = 0,167.</text><text x="760" y="380" font-size="23" text-anchor="start" fill="#15803d" font-weight="bold">Ước lượng mới (1,333; 1,167).</text></svg></div>
        focus: [1, 1, 1, 1, 1, 1, 1]
        say: "Hình này cho thấy vì sao đo vị trí lại sửa được vận tốc. Elip xanh gồm các trạng thái mà dự đoán cho là hợp lý, tâm ở vị trí 1, vận tốc 1. Elip nghiêng lên, vì nếu robot thật ra đi nhanh hơn thì nó cũng đã đi xa hơn. Phép đo màu cam báo vị trí 1 phẩy 5, nên bộ lọc kéo vị trí từ 1 lên 1 phẩy 333. Nhưng nó không kéo thẳng ngang, mà đi dọc đường nét đứt nối điểm trái nhất và điểm phải nhất của elip, có độ dốc một nửa. Đó là nơi vận tốc hợp lý nhất ứng với mỗi vị trí. Vì vậy vận tốc tăng theo 0 phẩy 333 nhân một nửa, tức 0 phẩy 167, dù ta không hề đo vận tốc."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Một bước: h = 1, P = I₂, đo z = 1,5"
    checks:
      - "np.allclose(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[0], [1, 1])"
      - "np.allclose(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[1], [[2, 1], [1, 1]])"
      - "np.allclose(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[2], [2 / 3, 1 / 3])"
      - "np.allclose(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[3], [4 / 3, 7 / 6])"
      - "np.allclose(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[4], [[2 / 3, 1 / 3], [1 / 3, 2 / 3]])"
    steps:
      - show: |
          <p>Bắt đầu $\hat{\mathbf{x}} = (0, 1)^T$, $\mathbf{P} = \mathbf{I}_2$; $Q = 0$ cho gọn; $R = 1$.</p>
          <p><b>Bước 1 —</b> dự đoán: $\hat{\mathbf{x}} = (1, 1)^T$, $\quad \mathbf{P} = \mathbf{F}\mathbf{I}_2\mathbf{F}^T = \begin{bmatrix} 2 & \hl{1} \\ \hl{1} & 1 \end{bmatrix}$</p>
          <p class="note">Ô ngoài đường chéo thành 1: sai vận tốc thì vị trí dự đoán cũng sai theo — hai sai số đã <b>gắn</b> với nhau.</p>
        focus: [1, 2, 3]
        say: "Bắt đầu với vị trí 0, vận tốc 1, P là ma trận đơn vị, Q bằng 0 cho gọn, và R bằng 1. Bước một là dự đoán, vị trí thành 1, vận tốc vẫn 1, và P thành ma trận 2, 1, 1, 1. Ô ngoài đường chéo bây giờ bằng 1, nghĩa là nếu vận tốc sai thì vị trí dự đoán cũng sai theo, hai sai số đã gắn với nhau."
      - clear: true
        show: |
          <p><b>Bước 2 —</b> đo $z = 1{,}5$: $S = \mathbf{H}\mathbf{P}\mathbf{H}^T + R = 2 + 1 = 3$, $\quad \mathbf{K} = (2, 1)^T / 3 = (0{,}667;\ 0{,}333)^T$.</p>
        say: "Bước hai, bây giờ đo được vị trí 1 phẩy 5. H P H chuyển vị chỉ lấy ô trên trái của P, bằng 2, nên S bằng 2 cộng 1, bằng 3, và K bằng cột 2, 1 chia 3."
      - show: |
          <p><b>Bước 3 —</b> độ lệch $z - \mathbf{H}\hat{\mathbf{x}} = 1{,}5 - 1 = 0{,}5$; $\ \hat{\mathbf{x}} = (1, 1)^T + 0{,}5\,\mathbf{K} = \hl{(1{,}333;\ 1{,}167)^T}$ — vận tốc được sửa dù không đo vận tốc.</p>
        say: "Bước ba, độ lệch là 1 phẩy 5 trừ 1, bằng 0 phẩy 5, nên vị trí thành 1 phẩy 333 và vận tốc thành 1 phẩy 167. Vận tốc được sửa dù ta không hề đo nó, nhờ ô liên kết trong P."
      - show: |
          <p><b>Bước 4 —</b> $\mathbf{P} \leftarrow (\mathbf{I}_2 - \mathbf{K}\mathbf{H})\mathbf{P}$:</p>
          <p>$$\mathbf{P} = \begin{bmatrix} 0{,}667 & 0{,}333 \\ 0{,}333 & 0{,}667 \end{bmatrix}$$</p>
        focus: [1, 2]
        say: "Bước bốn, P mới bằng I trừ K H, nhân với P cũ, cho ma trận 0 phẩy 667, 0 phẩy 333, 0 phẩy 333, 0 phẩy 667. Ma trận P mới nhỏ hơn ở cả hai số trên đường chéo, tức cả vị trí lẫn vận tốc đều chắc chắn hơn."
      - clear: true
        show: |
          <div>{{ELLIPSE}}</div>
          <p class="note">Mỗi elip gồm các trạng thái cách ước lượng một độ lệch chuẩn.</p>
        focus: [1, 2]
        say: "Trên hình, vòng xám ban đầu bị F kéo nghiêng thành elip xanh, rồi phép đo vị trí thu nhỏ nó thành elip cam. Mỗi elip gồm các trạng thái cách ước lượng đúng một độ lệch chuẩn."

  - id: check
    kind: check
    title: "Tự kiểm: quy về bài 12, rồi đi dọc đường đứt"
    checks:
      - "tuple(round(v, 3) for v in alg.kalman1d_update(1, 2, 1.5, 1)) == (0.667, 1.333, 0.667)"
      - "round(np.array([[2, 1], [1, 1]])[0, 1] / np.array([[2, 1], [1, 1]])[0, 0] * (4 / 3 - 1), 3) == 0.167 and round(1 + 1 / 6, 3) == 1.167"
      - "np.allclose(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[3], [1 + 1 / 3, 1 + 1 / 6])"
    steps:
      - show: |
          <p>Đường thứ nhất: chỉ nhìn vị trí, đây là bài toán một chiều của bài 12 với $P = 2$ (ô trên trái), $R = 1$.</p>
          <table class="t"><tr><th>đại lượng</th><th>một chiều</th><th>khớp ma trận?</th></tr>
          <tr><td>$K$</td><td>$\dfrac{2}{2 + 1} = 0{,}667$</td><td>thành phần đầu của $\mathbf{K}$ ✓</td></tr>
          <tr><td>vị trí mới</td><td>$1 + 0{,}667 \cdot 0{,}5 = 1{,}333$</td><td>✓</td></tr>
          <tr><td>phương sai vị trí</td><td>$(1 - 0{,}667) \cdot 2 = 0{,}667$</td><td>ô trên trái của $\mathbf{P}$ mới ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Làm sao biết kết quả đúng? Đường thứ nhất, nếu chỉ nhìn vị trí thì đây là bài toán một chiều của bài 12, với P bằng 2 là ô trên trái, và R bằng 1. Theo công thức một chiều, K bằng 2 chia 3,
 tức 0 phẩy 667, khớp thành phần đầu của cột K. Vị trí mới bằng 1 cộng 0 phẩy 667 nhân 0 phẩy 5, bằng 1 phẩy 333. Phương sai vị trí nhân với 1 trừ K, tức còn một phần ba của 2, tức 0 phẩy 667, khớp ô trên trái của P mới."
      - show: |
          <p>Đường thứ hai: vận tốc đi dọc đường đứt (nối điểm trái nhất và phải nhất của elip, nơi vận tốc hợp lý nhất ứng với mỗi vị trí), độ dốc = $\dfrac{\text{ô liên kết}}{\text{ô vị trí}} = \dfrac{1}{2}$.</p>
          <table class="t"><tr><th>vị trí tăng</th><th>nhân độ dốc</th><th>vận tốc mới</th></tr>
          <tr><td>$1{,}333 - 1 = 0{,}333$</td><td>$0{,}333 \cdot \dfrac{1}{2} = 0{,}167$</td><td>$1 + 0{,}167 = 1{,}167$ ✓</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Đường thứ hai, theo hình đám mây nghiêng, vận tốc đi dọc đường nét đứt có độ dốc bằng ô liên kết chia ô vị trí, tức 1 chia 2. Vị trí tăng 0 phẩy 333, nhân với một nửa được 0 phẩy 167. Vậy vận tốc mới là 1 phẩy 167, khớp với kết quả tính bằng ma trận."

  # ───────────────────────── 5. ĐỐI XỨNG ─────────────────────────
  - id: symm
    kind: concept
    title: "Giữ P đối xứng, xác định dương"
    checks:
      - "np.allclose(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[4], alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[4].T)"
      - "all(v > 0 for v in np.linalg.eigvalsh(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[4]))"
    steps:
      - show: |
          <p>$\mathbf{P}$ là hiệp phương sai nên phải <b>đối xứng</b> và mọi trị riêng (bài 9: số $\lambda$ với $\mathbf{P}\mathbf{v} = \lambda\mathbf{v}$) <b>không âm</b>, thực tế muốn dương. Ví dụ trên: trị riêng $1$ và $1/3$ — đúng.</p>
          <p>Sau hàng nghìn bước, sai số làm tròn có thể làm $\mathbf{P}$ lệch khỏi đối xứng, thậm chí có trị riêng âm — bộ lọc hỏng.</p>
          <div class="box key">Cách giữ: sau mỗi bước gán $\mathbf{P} \leftarrow (\mathbf{P} + \mathbf{P}^T)/2$, và kiểm trị riêng định kỳ.</div>
        introduces: [lambda]
        focus: [1, 1, 2, 3]
        say: "P là ma trận hiệp phương sai, nên nó phải đối xứng và mọi trị riêng phải không âm, thực tế muốn dương. Ở ví dụ trên, trị riêng là 1 và một phần ba, đúng như vậy. Nhưng sau hàng nghìn bước, sai số làm tròn có thể làm P lệch khỏi đối xứng, thậm chí có trị riêng âm, và bộ lọc hỏng. Cách giữ đơn giản là sau mỗi bước, thay P bằng trung bình của P và P chuyển vị, rồi kiểm trị riêng định kỳ."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "not np.allclose(np.array([[1, 1], [0, 1]]) @ np.eye(2), np.array([[1, 1], [0, 1]]) @ np.eye(2) @ np.array([[1, 0], [1, 1]]))"
      - "abs(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1)[3][1] - 1) > 0.1"
      - "np.allclose(np.array([[1, 1], [0, 1]]) @ np.eye(2), [[1, 1], [0, 1]]) and np.allclose(np.array([[1, 1], [0, 1]]) @ np.eye(2) @ np.array([[1, 0], [1, 1]]), [[2, 1], [1, 1]])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dự đoán $\mathbf{P} \leftarrow \mathbf{F}\mathbf{P}$ <b class="red">(sai)</b>
          <br><span class="note">Phải nhân hai phía: $\mathbf{F}\mathbf{P}\mathbf{F}^T$. Nhân một phía làm $\mathbf{P}$ mất đối xứng.</span></div>
          <p>$$\mathbf{P} = \mathbf{I}_2:\quad \mathbf{F}\mathbf{P} = \begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix} \ \text{(lệch)}, \qquad \mathbf{F}\mathbf{P}\mathbf{F}^T = \begin{bmatrix} 2 & 1 \\ 1 & 1 \end{bmatrix} \ \text{(đối xứng)}$$</p>
        focus: [1, 1, 1, 2]
        say: "Lỗi thứ nhất, dự đoán P bằng F nhân P. Phải nhân hai phía, F P F chuyển vị. Nhân một phía làm P mất đối xứng. Với P bằng ma trận đơn vị, F nhân P chính là F, ô trên phải bằng 1 mà ô dưới trái bằng 0, còn nhân hai phía cho ma trận 2, 1, 1, 1 đối xứng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cho $\mathbf{P}$ ban đầu chéo rồi nghĩ không cần ô ngoài <b class="red">(sai)</b>
          <br><span class="note">Chính ô ngoài đường chéo do $\mathbf{F}$ sinh ra mới cho phép đo vị trí sửa vận tốc.</span></div>
        say: "Lỗi thứ hai, cho P ban đầu là ma trận chéo rồi nghĩ không cần quan tâm ô ngoài. Chính ô ngoài đường chéo do F sinh ra mới cho phép đo vị trí sửa được vận tốc."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đặt $Q = 0$ trong hệ thật <b class="red">(sai)</b>
          <br><span class="note">Vận tốc thật thường không giữ đúng hằng số. $Q = 0$ làm $\mathbf{P}$ co dần về 0, bộ lọc dần dần gần như ngừng nghe phép đo. Ví dụ trên đặt $Q = 0$ chỉ để số gọn.</span></div>
        say: "Lỗi thứ ba, đặt Q bằng 0 trong hệ thật. Vận tốc thật thường không giữ đúng hằng số, và Q bằng 0 làm P co dần về 0, bộ lọc dần dần gần như ngừng nghe phép đo. Ví dụ vừa rồi đặt Q bằng 0 chỉ để số gọn."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Sai cỡ ma trận $\mathbf{H}$ <b class="red">(sai)</b>
          <br><span class="note">$\mathbf{H}$ có số hàng = số đại lượng đo, số cột = số thành phần trạng thái: ở đây 1 hàng, 2 cột.</span></div>
        say: "Lỗi thứ tư, viết sai cỡ ma trận H. H có số hàng bằng số đại lượng đo được, số cột bằng số thành phần trạng thái, ở đây là một nhân hai."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "np.allclose(alg.kalman_cv((0, 1), np.eye(2), 0.5, 1, np.zeros((2, 2)), 1)[3], [2 / 3, 5 / 6])"
      - "[round(v, 3) for v in np.array([2, 1]) / 1002] == [0.002, 0.001] and round(1 - 1 / 3, 3) == 0.667 and round(1 - 1 / 6, 3) == 0.833"
      - "np.all(np.abs(alg.kalman_cv((0, 1), np.eye(2), 1.5, 1, np.zeros((2, 2)), 1000)[2]) < 0.003)"
    steps:
      - show: |
          <p>Cùng ví dụ, cùng dự đoán $(1, 1)^T$, $\mathbf{K} = (2/3,\ 1/3)^T$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Nếu đo được $z = 0{,}5$, ước lượng mới là gì?</td></tr><tr><td>2</td><td>Nếu $R = 1000$ (cảm biến rất kém), $\mathbf{K}$ xấp xỉ bao nhiêu? Ý nghĩa?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, với cùng dự đoán 1, 1 và cùng K. Câu một, nếu đo được 0 phẩy 5, ước lượng mới là gì? Câu hai, nếu R bằng 1000, tức cảm biến rất kém, K xấp xỉ bao nhiêu? Điều đó có nghĩa gì? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Độ lệch $z - \mathbf{H}\hat{\mathbf{x}} = 0{,}5 - 1 = -0{,}5$.</p>
          <p>$\hat{\mathbf{x}} = (1, 1)^T - 0{,}5 \cdot (2/3,\ 1/3)^T = (1 - 1/3,\ 1 - 1/6) = \hl{(0{,}667;\ 0{,}833)^T}$ — đo thấy chậm hơn dự đoán, nên vận tốc cũng bị hạ.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, độ lệch là 0 phẩy 5 trừ 1, bằng âm 0 phẩy 5. Nhân với K rồi cộng vào dự đoán, vị trí thành 1 trừ một phần ba, tức 0 phẩy 667, và vận tốc thành 1 trừ một phần sáu, tức 0 phẩy 833. Đo thấy robot ở sau chỗ dự đoán, nên bộ lọc hiểu là robot chậm hơn, và vận tốc cũng bị hạ."
      - show: |
          <p>② $S = 2 + 1000 = 1002$, $\mathbf{K} = (2, 1)^T / 1002 \approx \hl{(0{,}002;\ 0{,}001)^T}$ — gần như bỏ qua phép đo, tin dự đoán.</p>
        say: "Câu hai, S bằng 2 cộng 1000, tức 1002, nên K chỉ còn cỡ 0 phẩy 002 và 0 phẩy 001. Nghĩa là bộ lọc gần như bỏ qua phép đo và tin dự đoán, đúng như ta muốn khi cảm biến rất kém."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$\mathbf{F}\mathbf{P}\mathbf{F}^T$ sinh liên kết</span><span class="a">→</span>
          <span class="n">$\mathbf{K}$ là một cột trọng số</span><span class="a">→</span>
          <span class="n">đo vị trí sửa cả vận tốc</span><span class="a">→</span>
          <span class="n">giữ $\mathbf{P}$ đối xứng, dương</span></div>
        say: "Tổng kết lại, bước dự đoán F P F chuyển vị sinh ra liên kết giữa vị trí và vận tốc. K là một cột trọng số, nên phép đo vị trí sửa được cả vận tốc. Và phải giữ P đối xứng, với trị riêng dương."
      - show: |
          <div class="box key"><b>Tư duy:</b> đại lượng không đo được vẫn ước lượng được, nếu mô hình nối nó với đại lượng đo được.</div>
        say: "Điều cần mang theo, một đại lượng không đo được vẫn ước lượng được, nếu mô hình nối nó với một đại lượng đo được."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 14): <b>lấy mẫu tín hiệu</b>, chồng phổ và biến đổi Fourier rời rạc — cảm biến đọc bao nhiêu lần mỗi giây là đủ?</p>
        forward_ref: true
        say: "Ở bài sau, bài 14, ta học lấy mẫu tín hiệu, hiện tượng chồng phổ và biến đổi Fourier rời rạc, để trả lời cảm biến cần đọc bao nhiêu lần mỗi giây là đủ. Hẹn gặp bạn ở bài tiếp theo."
