        focus: [1, 1, 1, 1, 1]
        say: "Hình này vẽ trạng thái của khớp trên một mặt phẳng, trục ngang là vị trí p, trục đứng là vận tốc v. Hai đường đứt là hai hướng riêng của A, hướng xanh 1, âm 1 và hướng cam 1, âm 2. Phần trạng thái nằm theo hướng xanh bị nhân với e mũ âm t, co chậm, còn phần theo hướng cam bị nhân với e mũ âm 2 t, co nhanh gấp đôi. Đường xanh lá là trạng thái thật khi thả từ 1, 0, đi qua 0 phẩy 6004, âm 0 phẩy 4651 tại t bằng 1. Vì phần nhanh tắt trước, về cuối trạng thái trượt dọc hướng chậm vào gốc, tức khớp về yên."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "A = [[0, 1], [−2, −3]]"
    checks:
      - "sorted(np.linalg.eigvals(np.array([[0, 1], [-2, -3]])).real.round(9)) == [-2.0, -1.0]"
      - "all(abs(l * l + 3 * l + 2) < 1e-12 for l in (-1, -2))"
      - "np.allclose(2 * np.array([1, -1]) - np.array([1, -2]), [1, 0])"
      - "np.allclose(alg.rk4_ode(lambda t, x: np.array([[0, 1], [-2, -3]]) @ x, np.array([1.0, 0.0]), 0.01, 100)[-1], 2 * math.exp(-1) * np.array([1, -1]) - math.exp(-2) * np.array([1, -2]), atol=1e-8)"
      - "[round(v, 4) for v in 2 * math.exp(-1) * np.array([1, -1]) - math.exp(-2) * np.array([1, -2])] == [0.6004, -0.4651]"
      - "round(2 * math.exp(-1), 4) == 0.7358 and round(math.exp(-2), 4) == 0.1353 and round(2 * math.exp(-2), 4) == 0.2707"
      - "np.allclose(np.array([[0, 1], [-2, -3]]) @ [1, -1], [-1, 1]) and np.allclose(np.array([[0, 1], [-2, -3]]) @ [1, -2], [-2, 4])"
    steps:
      - show: |
          <p><b>Bước 1 —</b> định thức của $\mathbf{A} - \lambda\mathbf{I}_2 = \begin{bmatrix} -\lambda & 1 \\ -2 & -3 - \lambda \end{bmatrix}$:</p>
          $$\det(\mathbf{A} - \lambda\mathbf{I}_2) = (-\lambda)(-3 - \lambda) + 2 = \lambda^2 + 3\lambda + 2$$
        focus: [1, 2]
        say: "Bước một, trừ lambda ở hai ô đường chéo của A, rồi tính định thức theo a nhân d trừ b nhân c. Tính định thức của A trừ lambda nhân ma trận đơn vị, ta được lambda bình phương cộng 3 lambda cộng 2."
      - show: |
          <p><b>Bước 2 —</b> phân tích như phần ôn: $\lambda^2 + 3\lambda + 2 = (\lambda + 1)(\lambda + 2)$. Trị riêng $\hl{-1}$ và $\hl{-2}$, đều âm: <b>ổn định</b>.</p>
        say: "Bước hai, như phần ôn đầu bài, biểu thức này phân tích thành lambda cộng 1 nhân lambda cộng 2. Vậy trị riêng là âm 1 và âm 2, đều âm, nên hệ ổn định."
      - show: |
          <p><b>Bước 3 —</b> vector riêng, kiểm bằng phép nhân:</p>
          <table class="t"><tr><th>$\mathbf{A}$ nhân với</th><th>kết quả</th><th>bằng</th></tr>
          <tr><td>$(1, -1)^T$</td><td>$(0 - 1;\ -2 + 3)^T = (-1, 1)^T$</td><td>$-1 \cdot (1, -1)^T$ ✓</td></tr>
          <tr><td>$(1, -2)^T$</td><td>$(0 - 2;\ -2 + 6)^T = (-2, 4)^T$</td><td>$-2 \cdot (1, -2)^T$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, hai vector riêng tương ứng là 1, âm 1 và 1, âm 2. Kiểm bằng phép nhân, A nhân 1, âm 1 được âm 1, 1, đúng bằng âm 1 lần vector đó. A nhân 1, âm 2 được âm 2, 4, đúng bằng âm 2 lần vector đó."
      - clear: true
        show: |
          <p><b>Bước 4 —</b> tách điểm thả: $(1, 0)^T = 2(1, -1)^T - (1, -2)^T = (2 - 1;\ -2 + 2)^T$ ✓</p>
          $$\mathbf{x}(t) = 2e^{-t}(1, -1)^T - e^{-2t}(1, -2)^T$$
        focus: [1, 1, 2]
        say: "Bước bốn, thả từ trạng thái 1, 0, mà 1, 0 bằng 2 lần vector thứ nhất trừ vector thứ hai. Cộng từng toạ độ, 2 trừ 1 bằng 1, âm 2 cộng 2 bằng 0, đúng điểm thả. Nên nghiệm là 2 e mũ âm t nhân vector thứ nhất, trừ e mũ âm 2 t nhân vector thứ hai."
      - show: |
          <p><b>Bước 5 —</b> tại $t = 1$: $2 \cdot 0{,}3679 = 0{,}7358$ và $e^{-2} \approx 0{,}1353$, nên $\mathbf{x}(1) = (0{,}7358 - 0{,}1353;\ -0{,}7358 + 0{,}2707) = \hl{(0{,}6004;\ -0{,}4651)}$. Mô phỏng RK4 của bài 8 cho cùng số.</p>
        say: "Bước năm, thử ngay tại t bằng 1, 2 nhân e mũ âm 1 là 0 phẩy 7358, còn e mũ âm 2 xấp xỉ 0 phẩy 1353. Vị trí là 0 phẩy 7358 trừ 0 phẩy 1353, bằng 0 phẩy 6004, vận tốc là âm 0 phẩy 7358 cộng 0 phẩy 2707, bằng âm 0 phẩy 4651. Công thức và mô phỏng RK4 của bài 8 cho cùng con số."

  - id: check
    kind: check
    title: "Tự kiểm: thế ngược vào phương trình, và tổng – tích trị riêng"
    checks:
      - "np.allclose(2 * np.array([1, -1]) - np.array([1, -2]), [1, 0]) and np.allclose(-2 * np.array([1, -1]) + 2 * np.array([1, -2]), [0, -2]) and np.allclose(np.array([[0, 1], [-2, -3]]) @ [1, 0], [0, -2])"
      - "-1 + -2 == 0 + -3 and (-1) * (-2) == 0 * (-3) - 1 * (-2)"
    steps:
      - show: |
          <p>Đường thứ nhất: <b>thế công thức vào phương trình</b> tại $t = 0$. Đạo hàm của $e^{-t}$ là $-e^{-t}$, của $e^{-2t}$ là $-2e^{-2t}$.</p>
          <table class="t"><tr><th>điều phải đúng</th><th>vế trái</th><th>vế phải</th></tr>
          <tr><td>$\mathbf{x}(0)$ = điểm thả</td><td>$2(1, -1)^T - (1, -2)^T = (1, 0)^T$</td><td>$(1, 0)^T$ ✓</td></tr>
          <tr><td>$\mathbf{x}'(0) = \mathbf{A}\mathbf{x}(0)$</td><td>$-2(1, -1)^T + 2(1, -2)^T = (0, -2)^T$</td><td>$\mathbf{A}(1, 0)^T = (0, -2)^T$ ✓</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.3"]
        say: "Làm sao biết nghiệm vừa tìm là đúng? Đường thứ nhất, thế ngược công thức vào phương trình tại t bằng 0. Ta dùng đạo hàm của e mũ âm t là âm e mũ âm t, của e mũ âm 2 t là âm 2 e mũ âm 2 t. Tại t bằng 0, công thức cho 1, 0, đúng điểm thả. Đạo hàm của công thức tại 0 là 0, âm 2. Còn A nhân 1, 0 là cột thứ nhất của A, vì nhân với 1, 0 là lấy cột đầu, cũng là 0, âm 2, nên hai vế khớp nhau."
      - show: |
          <p>Đường thứ hai: không giải lại phương trình bậc hai, dùng hai quy tắc của ma trận 2 × 2.</p>
          <table class="t"><tr><th>quy tắc</th><th>từ trị riêng</th><th>từ $\mathbf{A}$</th></tr>
          <tr><td>tổng trị riêng = tổng đường chéo</td><td>$-1 + (-2) = -3$</td><td>$0 + (-3) = -3$ ✓</td></tr>
          <tr><td>tích trị riêng = định thức</td><td>$(-1) \cdot (-2) = 2$</td><td>$0 \cdot (-3) - 1 \cdot (-2) = 2$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Đường thứ hai kiểm trị riêng mà không giải lại phương trình, nhờ hai quy tắc của ma trận hai nhân hai. Tổng hai trị riêng, âm 1 cộng âm 2, bằng âm 3, đúng bằng tổng đường chéo của A, 0 cộng âm 3. Tích hai trị riêng bằng 2, đúng bằng định thức của A, 0 nhân âm 3 trừ 1 nhân âm 2."

  # ───────────────────────── 5. TRỊ RIÊNG PHỨC ─────────────────────────
  - id: complex
    kind: concept
    title: "Trị riêng phức: dao động"
    checks:
      - "np.allclose(sorted(np.linalg.eigvals(np.array([[0, 1], [-5, -2]])), key=lambda z: z.imag), [-1 - 2j, -1 + 2j])"
      - "sorted(np.linalg.eigvals(np.array([[0, 1], [2, -1]])).real.round(9)) == [-2.0, 1.0]"
      - "abs(alg.rk4_ode(lambda t, x: np.array([[0, 1], [2, -1]]) @ x, np.array([1.0, 0.0]), 0.01, 500)[-1][0]) > 50"
    steps:
      - show: |
          <p>Lò xo mạnh hơn, giảm chấn yếu hơn: $\mathbf{A} = \begin{bmatrix} 0 & 1 \\ -5 & -2 \end{bmatrix}$, trị riêng $\lambda = -1 \pm 2i$, với $i^2 = -1$.</p>
          <p>Với $\lambda = a \pm bi$: $e^{\lambda t} = e^{at}(\cos bt \pm i\sin bt)$. Phần ảo $b$ cho <b>dao động</b>; phần thực $a$ cho biên độ co hay giãn.</p>
          <div>{{RESP}}</div>
        introduces: [re_part]
        focus: [1, 2, 2, 3, 3]
        say: "Bây giờ cho lò xo mạnh hơn và giảm chấn yếu hơn, A có hàng dưới âm 5, âm 2. Trị riêng thành số phức, âm 1 cộng trừ 2 i, với i bình phương bằng âm 1. Với trị riêng a cộng trừ b i, e mũ lambda t bằng e mũ a t nhân một tổ hợp của cos và sin của b t. Phần ảo b cho dao động, còn phần thực a cho biết biên độ co lại hay giãn ra. Trên hình, đường cam dao động quanh 0 và tắt dần, vì phần thực bằng âm 1."
      - clear: true
        show: |
          <div class="box key">Hệ liên tục $\mathbf{x}' = \mathbf{A}\mathbf{x}$ ổn định $\iff$ mọi trị riêng có $\operatorname{Re}\lambda < 0$.</div>
          <p>Phản ví dụ: $\mathbf{A} = \begin{bmatrix} 0 & 1 \\ 2 & -1 \end{bmatrix}$ có trị riêng $1$ và $-2$. Chỉ một trị riêng dương là đủ làm hệ văng ra: mô phỏng tới $t = 5$, vị trí đã vượt 50.</p>
        focus: [1, 2, 2]
        say: "Tóm lại, hệ liên tục ổn định khi và chỉ khi mọi trị riêng có phần thực âm. Phản ví dụ, nếu hàng dưới là 2, âm 1, thì trị riêng là 1 và âm 2. Chỉ một trị riêng dương là đủ làm hệ văng ra, mô phỏng tới t bằng 5 thì vị trí đã vượt quá 50."

  # ───────────────────────── 6. RỜI RẠC ─────────────────────────
  - id: discrete
    kind: concept
    title: "Hệ rời rạc: điều kiện khác"
    checks:
      - "all(abs(v) < 1e-9 for v in np.linalg.matrix_power(np.array([[0.5, 0], [0, 0.9]]), 300) @ [1, 1])"
      - "abs(math.exp(0.5 * 10)) > 100"
      - "np.allclose(np.linalg.matrix_power(np.array([[-1.5]]), 3), [[-3.375]])"
      - "[round((-1.5) ** k, 3) for k in range(4)] == [1.0, -1.5, 2.25, -3.375]"
    steps:
      - show: |
          <p>Hệ <b>rời rạc</b> $\mathbf{x}_{k+1} = \mathbf{M}\mathbf{x}_k$ (như mỗi bước Euler): theo hướng vector riêng, mỗi bước nhân với $\lambda$.</p>
          <div class="box key">Hệ rời rạc ổn định $\iff$ mọi trị riêng có $\lvert\lambda\rvert < 1$.</div>
          <table class="t"><tr><th>trị riêng</th><th>hệ liên tục: $e^{\lambda t}$</th><th>hệ rời rạc: $\lambda^k$</th></tr>
          <tr><td>$0{,}5$</td><td>bùng nổ ($e^{0{,}5t}$)</td><td>tắt dần ($0{,}5^k \to 0$)</td></tr>
          <tr><td>$-1{,}5$</td><td>tắt dần</td><td>dao động, lớn dần: $1;\ -1{,}5;\ 2{,}25;\ -3{,}375$</td></tr></table>
        introduces: [absval]
        focus: [1, 1, 2, 3, "3.2", "3.3"]
        say: "Còn hệ rời rạc, x k cộng 1 bằng M nhân x k, như mỗi bước của phương pháp Euler. Theo hướng vector riêng, mỗi bước nhân với lambda. Vì vậy hệ rời rạc ổn định khi mọi trị riêng có trị tuyệt đối nhỏ hơn 1. Hai điều kiện rất khác nhau. Cùng trị riêng 0 phẩy 5, hệ rời rạc tắt dần, còn hệ liên tục thì bùng nổ. Ngược lại, với trị riêng âm 1 phẩy 5, hệ liên tục tắt dần, còn hệ rời rạc dao động và lớn dần."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "all(abs(z.real) < 1e-12 for z in np.linalg.eigvals(np.array([[0, 1], [-4, 0]])))"
      - "max(np.linalg.eigvals(np.array([[0, 1], [2, -1]])).real) > 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng $\lvert\lambda\rvert < 1$ cho hệ liên tục <b class="red">(sai)</b>
          <br><span class="note">Hệ liên tục xét dấu phần thực; hệ rời rạc mới xét độ lớn so với 1.</span></div>
          <table class="t"><tr><th>hệ</th><th>ổn định khi mọi trị riêng</th></tr><tr><td>liên tục $\mathbf{x}' = \mathbf{A}\mathbf{x}$</td><td>có phần thực âm</td></tr><tr><td>rời rạc $\mathbf{x}_{k+1} = \mathbf{M}\mathbf{x}_k$</td><td>có trị tuyệt đối nhỏ hơn 1</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ nhất, dùng điều kiện trị tuyệt đối nhỏ hơn 1 cho hệ liên tục. Hệ liên tục xét dấu phần thực, chỉ hệ rời rạc mới so độ lớn với 1."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chỉ xét một trị riêng <b class="red">(thiếu)</b>
          <br><span class="note">Trị riêng $-2$ không cứu được trị riêng $1$: cần <b>mọi</b> trị riêng thoả.</span></div>
        say: "Lỗi thứ hai, chỉ xét một trị riêng. Trị riêng âm 2 không cứu được trị riêng 1, cần mọi trị riêng cùng thoả điều kiện."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Thấy trị riêng phức thì kết luận “không ổn định” <b class="red">(sai)</b>
          <br><span class="note">Phần ảo chỉ cho dao động. $-1 \pm 2i$ vẫn tắt dần vì phần thực âm.</span></div>
        say: "Lỗi thứ ba, thấy trị riêng phức thì kết luận hệ không ổn định. Phần ảo chỉ cho dao động, còn âm 1 cộng trừ 2 i vẫn tắt dần vì phần thực âm."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Coi phần thực bằng 0 là ổn định <b class="red">(thiếu)</b>
          <br><span class="note">$\pm 2i$: dao động mãi, không tắt. Không văng ra, nhưng cũng không về yên.</span></div>
        say: "Lỗi thứ tư, coi phần thực bằng 0 là ổn định. Với trị riêng cộng trừ 2 i, hệ dao động mãi, không văng ra, nhưng cũng không bao giờ về yên."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "sorted(np.linalg.eigvals(np.array([[-1, 2], [0, -3]])).real.round(9)) == [-3.0, -1.0]"
      - "np.allclose(sorted(np.linalg.eigvals(np.array([[0, 1], [-4, 0]])), key=lambda z: z.imag), [-2j, 2j])"
      - "-1 + -3 == -4 and round(np.linalg.det(np.array([[-1, 2], [0, -3]])), 9) == 3 and (2j) ** 2 == -4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$\mathbf{A} = \begin{bmatrix} -1 & 2 \\ 0 & -3 \end{bmatrix}$ ổn định không?</td></tr>
          <tr><td>2</td><td>$\mathbf{A} = \begin{bmatrix} 0 & 1 \\ -4 & 0 \end{bmatrix}$ (lò xo, không giảm chấn): hệ làm gì?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ma trận có hàng trên âm 1, 2 và hàng dưới 0, âm 3, hệ có ổn định không? Câu hai, ma trận có hàng trên 0, 1 và hàng dưới âm 4, 0, tức chỉ có lò xo mà không có giảm chấn, hệ sẽ làm gì? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $\det(\mathbf{A} - \lambda\mathbf{I}_2) = (-1 - \lambda)(-3 - \lambda) - 2 \cdot 0 = (\lambda + 1)(\lambda + 3)$</p>
          <p>Ma trận tam giác: trị riêng là đường chéo, $-1$ và $-3$, đều âm — <b>ổn định</b>. Kiểm: tổng $-4 = -1 + (-3)$, tích $3 = \det \mathbf{A}$ ✓</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, ô dưới bên trái bằng 0, nên định thức của A trừ lambda I chỉ còn tích hai ô đường chéo, âm 1 trừ lambda nhân âm 3 trừ lambda. Ma trận tam giác có trị riêng nằm trên đường chéo, âm 1 và âm 3, nên hệ ổn định. Kiểm nhanh, tổng hai trị riêng là âm 4, bằng tổng đường chéo, và tích bằng 3, đúng bằng định thức."
      - show: |
          <p>② $\det(\mathbf{A} - \lambda\mathbf{I}_2) = (-\lambda)(-\lambda) - 1 \cdot (-4) = \lambda^2 + 4$</p>
          <p>$\lambda^2 + 4 = 0 \Rightarrow \lambda = \pm 2i$ (vì $(2i)^2 = -4$): phần thực 0 — <b>dao động mãi</b> với tần số góc 2, không tắt.</p>
        focus: [1, 2, 2]
        say: "Câu hai, định thức là âm lambda nhân âm lambda trừ 1 nhân âm 4, tức lambda bình phương cộng 4. Đặt biểu thức đó bằng 0, ta được trị riêng cộng trừ 2 i, phần thực bằng 0, nên khớp dao động mãi mà không tắt. Đúng như lỗi thứ tư vừa nói, không có giảm chấn thì khớp không văng ra nhưng cũng không bao giờ về yên."

