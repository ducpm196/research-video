id: L09
course: RBM
series: "RBM · Toán cho robot và hệ động lực"
title: "Bài 9 — Hệ tuyến tính, trị riêng và ổn định"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rbm.yaml L09; audit/rbm/verify_rbm.py L09; K. J. Åström, R. M. Murray, Feedback Systems (2008), mục 5.2–5.3"
assumes: [arith, cdot, vec, mat, sub, transpose, identity, det, lambda, cos, sin, iff, prime, exp, frac, approx, power, pm, implies]
# Quy ước: trạng thái x = (x_1, x_2)^T (vị trí, vận tốc); x' = A x; trị riêng λ, vector riêng v như CS115 bài 5.
#   Số phức chỉ dùng ở mức: i^2 = −1, λ = a ± b i, phần thực Re λ = a; e^{(a + bi)t} = e^{at}(cos bt + i sin bt) nêu như sự kiện.
#   Mọi trị riêng do numpy.linalg.eigvals tính; nghiệm dạng đóng so với alg.rk4_ode (bước 0,01).
objectives:
  - "Viết hệ bậc hai thành x′ = Ax"
  - "Xét ổn định bằng phần thực của trị riêng"
  - "Phân biệt điều kiện ổn định của hệ liên tục và hệ rời rạc"
asr_reviewed:
  - {sentence: "Hai đường đứt là hai hướng riêng của A, hướng xanh 1, âm 1 và hướng cam 1, âm 2.", reason: "ASR chép “Hai đường đức là hai hướng riêng của á, hướng xanh một, âm một và hướng ca một, âm hai.” (0.85): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: đứt/đức, cam/ca — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước một, trừ lambda ở hai ô đường chéo của A, rồi tính định thức theo a nhân d trừ b nhân c.", reason: "ASR chép “Bước 1, trừ lambda ở 2 ô đường chéo qua, rồi tính định thức theo a nhân dê trừ b nhân c.” (0.936): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: của (trong “của a” → “qua”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nên nghiệm là 2 e mũ âm t nhân vector thứ nhất, trừ e mũ âm 2 t nhân vector thứ hai.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Với trị riêng a cộng trừ b i, e mũ lambda t bằng e mũ a t nhân một tổ hợp của cos và sin của b t.", reason: "sin đọc thô “sin” (foreign_ok trong lexicon_vi.RBM.yaml); ASR chép “sinh” — cùng âm, chỉ khác âm cuối n/nh mà tiếng Việt không phân biệt ở âm tiết này; hàm sin hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Khớp có lò xo và giảm chấn: có dừng yên không?"
    steps:
      - show: |
          <p>Một khớp tay máy gắn lò xo kéo về giữa và giảm chấn hãm tốc độ. Đẩy lệch rồi thả ra.</p>
          <p>Nó sẽ về yên? Dao động mãi? Hay văng ra xa? Không cần giải hết, chỉ cần vài con số.</p>
          <div class="box key">Hôm nay: hệ tuyến tính $\mathbf{x}' = \mathbf{A}\mathbf{x}$, và <b>trị riêng</b> của $\mathbf{A}$ quyết định ổn định.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, một khớp tay máy gắn lò xo kéo nó về giữa, và một bộ giảm chấn hãm tốc độ. Ta đẩy lệch rồi thả ra. Nó sẽ về yên, dao động mãi, hay văng ra xa? Câu trả lời không cần giải hết phương trình, chỉ cần vài con số. Hôm nay ta học hệ tuyến tính x phẩy bằng A nhân x, và thấy trị riêng của A quyết định hệ có ổn định hay không."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: vector riêng, hàm mũ e và phân tích bậc hai"
    checks:
      - "np.allclose(np.array([[2, 1], [1, 2]]) @ [1, 1], [3, 3]) and np.allclose(np.array([[2, 1], [1, 2]]) @ [1, -1], [1, -1])"
      - "round(math.exp(-1), 3) == 0.368 and round(math.exp(-2), 3) == 0.135 and round(math.exp(1), 3) == 2.718 and round(math.exp(2), 3) == 7.389"
      - "all(l * l + 3 * l + 2 == (l + 1) * (l + 2) for l in range(-5, 6)) and (-1) ** 2 + 3 * (-1) + 2 == 0 and (-2) ** 2 + 3 * (-2) + 2 == 0"
    steps:
      - show: |
          <p><b>Vector riêng</b> (khoá Toán cho khoa học máy tính): $\mathbf{M}\mathbf{v} = \lambda\mathbf{v}$ — nhân với $\mathbf{M}$ chỉ kéo dãn $\mathbf{v}$, không đổi hướng.</p>
          <table class="t"><tr><th>$\mathbf{M} = \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}$ nhân với</th><th>kết quả</th><th>trị riêng $\lambda$</th></tr>
          <tr><td>$(1, 1)^T$</td><td>$(3, 3)^T = 3 \cdot (1, 1)^T$</td><td>3</td></tr>
          <tr><td>$(1, -1)^T$</td><td>$(1, -1)^T = 1 \cdot (1, -1)^T$</td><td>1</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Trước khi vào bài, ta ôn ba điều sẽ dùng, trước hết là vector riêng, đã học ở khoá Toán cho khoa học máy tính. Vector v là vector riêng của M nếu nhân với M chỉ kéo dãn v mà không đổi hướng, M v bằng lambda v. Ví dụ ma trận 2, 1, 1, 2 nhân với 1, 1 được 3, 3, tức gấp 3 lần, nên trị riêng là 3. Nhân với 1, âm 1 thì được đúng 1, âm 1, trị riêng là 1."
      - show: |
          <p><b>Hàm mũ</b> $e^{\lambda t}$ với $e \approx 2{,}718$: dấu của $\lambda$ quyết định co hay giãn.</p>
          <table class="t"><tr><th></th><th>$t = 1$</th><th>$t = 2$</th><th>xu hướng</th></tr>
          <tr><td>$\lambda = -1$: $e^{-t}$</td><td>0,368</td><td>0,135</td><td>co về 0</td></tr>
          <tr><td>$\lambda = 1$: $e^{t}$</td><td>2,718</td><td>7,389</td><td>lớn mãi</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ hai, hàm mũ e mũ lambda t, với e xấp xỉ 2 phẩy 718. Khi lambda bằng âm 1, giá trị là 0 phẩy 368 tại t bằng 1 và 0 phẩy 135 tại t bằng 2, co dần về 0. Khi lambda bằng 1, giá trị là 2 phẩy 718 rồi 7 phẩy 389, lớn mãi không dừng."
      - clear: true
        show: |
          <p><b>Phân tích bậc hai:</b> nhân phá ngoặc để kiểm.</p>
          $$(\lambda + 1)(\lambda + 2) = \lambda^2 + 2\lambda + \lambda + 2 = \lambda^2 + 3\lambda + 2$$
          <p class="note">Nên $\lambda^2 + 3\lambda + 2 = 0$ khi $\lambda = -1$ hoặc $\lambda = -2$. Thử: $1 - 3 + 2 = 0$ và $4 - 6 + 2 = 0$.</p>
        focus: [1, 2, 3, 3]
        say: "Điều thứ ba, phân tích một biểu thức bậc hai thành tích, và kiểm bằng cách nhân phá ngoặc. Lambda cộng 1 nhân lambda cộng 2 bằng lambda bình phương cộng 2 lambda cộng lambda cộng 2, tức lambda bình phương cộng 3 lambda cộng 2. Vì một tích bằng 0 khi một thừa số bằng 0, biểu thức này bằng 0 khi lambda bằng âm 1 hoặc âm 2. Thử lại, 1 trừ 3 cộng 2 bằng 0, và 4 trừ 6 cộng 2 cũng bằng 0."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: trạng thái hai chiều và ma trận A"
    checks:
      - "np.allclose(np.array([[0, 1], [-2, -3]]) @ [0.5, 0.2], [0.2, -2 * 0.5 - 3 * 0.2])"
    steps:
      - show: |
          <p>Trạng thái gồm vị trí $p$ và vận tốc $v$: $\mathbf{x} = (p, v)^T$.</p>
          <p>Vị trí đổi theo vận tốc: $p' = v$. Vận tốc đổi do lò xo ($-2p$) và giảm chấn ($-3v$): $v' = -2p - 3v$.</p>
          <p>$\mathbf{x}' = \mathbf{A}\mathbf{x}$, $\quad \mathbf{A} = \begin{bmatrix} 0 & 1 \\ -2 & -3 \end{bmatrix}$</p>
          <div class="box key">Mỗi hàng của $\mathbf{A}$ là quy tắc thay đổi của một thành phần. Phương trình bậc hai thành hệ hai phương trình bậc nhất.</div>
        focus: [1, 2, 2, 3, 4, 4]
        say: "Trạng thái của khớp gồm hai con số, vị trí p và vận tốc v. Vị trí thay đổi theo vận tốc, nên p phẩy bằng v. Vận tốc thay đổi do lò xo kéo về, âm 2 p, và giảm chấn hãm lại, âm 3 v. Gom lại, x phẩy bằng A nhân x, với A có hàng trên 0, 1 và hàng dưới âm 2, âm 3. Mỗi hàng của A là quy tắc thay đổi của một thành phần. Nhờ thêm vận tốc vào trạng thái, một phương trình bậc hai thành hệ hai phương trình bậc nhất."

  # ───────────────────────── 3. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Vì sao trị riêng quyết định"
    checks:
      - "np.allclose(np.array([[0, 1], [-2, -3]]) @ [1, -1], -1 * np.array([1, -1])) and np.allclose(np.array([[0, 1], [-2, -3]]) @ [1, -2], -2 * np.array([1, -2]))"
    steps:
      - show: |
          <p>Nếu $\mathbf{A}\mathbf{v} = \lambda\mathbf{v}$ (CS115: vector riêng), thử $\mathbf{x}(t) = e^{\lambda t}\mathbf{v}$:</p>
          <p>$\mathbf{x}' = \lambda e^{\lambda t}\mathbf{v}$, còn $\mathbf{A}\mathbf{x} = e^{\lambda t}\mathbf{A}\mathbf{v} = \lambda e^{\lambda t}\mathbf{v}$ — bằng nhau, nên đó là một nghiệm.</p>
          <p>Theo hướng $\mathbf{v}$, hệ chỉ co giãn theo $e^{\lambda t}$: $\lambda < 0$ thì tắt về 0, $\lambda > 0$ thì lớn vô hạn.</p>
          <div class="box key">Nghiệm tổng quát là tổ hợp các nghiệm đó. Hệ ổn định khi <b>mọi</b> trị riêng có phần thực âm.</div>
        focus: [1, 2, 3, 3, 4, 4]
        say: "Nếu v là vector riêng của A với trị riêng lambda, như đã học, ta thử x của t bằng e mũ lambda t nhân v. Đạo hàm của nó là lambda e mũ lambda t nhân v, còn A nhân x cũng bằng đúng thứ đó, vì A nhân v bằng lambda v. Vậy đó là một nghiệm. Theo hướng v, hệ chỉ co giãn theo e mũ lambda t. Lambda âm thì tắt về 0, còn lambda dương thì lớn vô hạn. Nghiệm tổng quát là tổ hợp các nghiệm như thế, nên hệ ổn định khi mọi trị riêng đều có phần thực âm."

  - id: intuition
    kind: intuition
    title: "Hình dung: mỗi hướng riêng co theo nhịp riêng"
    checks:
      - "np.allclose(np.round(2 * math.exp(-1) * np.array([1, -1]) - math.exp(-2) * np.array([1, -2]), 4), [0.6004, -0.4651])"
    steps:
      - show: |
          <div><svg width="1300" height="470" viewBox="0 0 1300 470"><defs><marker id="lk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="lg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><line x1="69.0" y1="110.0" x2="804.0" y2="110.0" stroke="#6b7280" stroke-width="2" marker-end="url(#lk)"/><line x1="300.0" y1="467.0" x2="300.0" y2="5.0" stroke="#6b7280" stroke-width="2" marker-end="url(#lk)"/><text x="818" y="118" font-size="22" text-anchor="start" fill="#6b7280">p (vị trí)</text><text x="316" y="28" font-size="22" text-anchor="start" fill="#6b7280">v (vận tốc)</text><line x1="207.6" y1="17.6" x2="644.4" y2="454.4" stroke="#2a78d6" stroke-width="4" stroke-dasharray="10 7"/><line x1="253.8" y1="17.6" x2="476.4" y2="462.8" stroke="#eb6834" stroke-width="4" stroke-dasharray="10 7"/><polyline points="720.0,110.0 719.8,126.3 719.4,141.6 718.6,156.1 717.5,169.6 716.2,182.3 714.6,194.2 712.8,205.4 710.8,215.8 708.6,225.6 706.2,234.7 703.6,243.1 700.9,251.0 698.0,258.3 695.0,265.0 691.8,271.3 688.5,277.0 685.1,282.3 681.6,287.2 678.0,291.6 674.4,295.6 670.6,299.3 666.8,302.6 662.9,305.5 659.0,308.1 655.0,310.5 650.9,312.5 646.9,314.2 642.8,315.7 638.7,317.0 634.5,318.0 630.3,318.8 626.1,319.4 622.0,319.8 617.8,320.0 613.6,320.0 609.4,319.9 605.2,319.6 601.0,319.1 596.8,318.5 592.6,317.8 588.5,317.0 584.4,316.1 580.2,315.0 576.2,313.9 572.1,312.7 568.1,311.3 564.0,310.0 560.1,308.5 556.1,306.9 552.2,305.3 548.3,303.7 544.4,302.0 540.6,300.2 536.8,298.4 533.1,296.5 529.4,294.6 525.7,292.7 522.1,290.8 518.5,288.8 514.9,286.8 511.4,284.8 507.9,282.7 504.5,280.7 501.1,278.6 497.7,276.5 494.4,274.5 491.2,272.4 487.9,270.3 484.7,268.2 481.6,266.1 478.5,264.0 475.4,261.9 472.4,259.8 469.5,257.7 466.5,255.6 463.6,253.5