scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Vì sao tay duỗi thẳng thì giật?"
    steps:
      - show: |
          <p>Ra lệnh cho đầu tay đi thẳng ra xa với tốc độ đều. Khi tay gần duỗi thẳng, động cơ khớp bỗng quay rất nhanh, rồi tay không đi thêm được nữa.</p>
          <div class="box key">Hôm nay: <b>Jacobian vận tốc</b> — nối tốc độ khớp với tốc độ đầu tay — và <b>điểm kỳ dị</b>, nơi mối nối đó hỏng.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, hãy ra lệnh cho đầu tay đi thẳng ra xa với tốc độ đều. Khi tay gần duỗi thẳng, động cơ khớp bỗng quay rất nhanh, rồi tay không đi thêm được nữa. Hôm nay ta học Jacobian vận tốc, nối tốc độ các khớp với tốc độ đầu tay, và điểm kỳ dị, nơi mối nối đó bị hỏng."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đạo hàm, đạo hàm riêng, quy tắc chuỗi, định thức 2 × 2"
    checks:
      - "sp.diff(sp.Symbol('a') * sp.Symbol('b') ** 2, sp.Symbol('a')).subs({'a': 3, 'b': 2}) == 4 and sp.diff(sp.Symbol('a') * sp.Symbol('b') ** 2, sp.Symbol('b')).subs({'a': 3, 'b': 2}) == 12"
      - "round((2.001 ** 2 - 2 ** 2) / 0.001, 3) == 4.001 and round((math.sin(0.501) - math.sin(0.5)) / 0.001, 4) == 0.8773 and round(math.cos(0.5), 4) == 0.8776"
      - "round((math.cos(0.501) - math.cos(0.5)) / 0.001, 4) == -0.4799 and round(-math.sin(0.5), 4) == -0.4794 and round(math.pi, 4) == 3.1416 and round(math.pi / 180, 5) == 0.01745"
      - "4 * 1 + 12 * 0.5 == 10 and round(((3 + 1e-6) * (2 + 0.5e-6) ** 2 - 3 * 2 ** 2) / 1e-6, 3) == 10"
      - "round(np.linalg.det([[2, 1], [4, 3]]), 9) == 2 and 2 * 3 - 1 * 4 == 2"
      - "round(np.linalg.det([[1, 2], [2, 4]]), 9) == 0 and 1 * 4 - 2 * 2 == 0"
    steps:
      - show: |
          <p><b>Đạo hàm</b> $f'$ của hàm $f$: tốc độ $f$ thay đổi khi biến nhích một chút, $f'(u) \approx \dfrac{f(u + h) - f(u)}{h}$ với $h$ rất nhỏ.</p>
          <table class="t"><tr><th>hàm</th><th>đạo hàm</th><th>thử với $h = 0{,}001$</th></tr>
          <tr><td>$u^2$</td><td>$2u$</td><td>$u = 2$: $\dfrac{2{,}001^2 - 2^2}{0{,}001} = 4{,}001 \approx 2 \cdot 2$</td></tr>
          <tr><td>$\sin u$</td><td>$\cos u$</td><td>$u = 0{,}5$: $\approx 0{,}8773$; $\cos 0{,}5 \approx 0{,}8776$</td></tr>
          <tr><td>$\cos u$</td><td>$-\sin u$</td><td>$u = 0{,}5$: $\approx -0{,}4799$; $-\sin 0{,}5 \approx -0{,}4794$</td></tr></table>
          <p class="note">Hai dòng dưới chỉ đúng khi góc đo bằng <b>radian</b>: $180^\circ = \pi \approx 3{,}1416$ radian, nên $1^\circ \approx 0{,}01745$ radian.</p>
        focus: [1, 1, "2.2", "2.3", "2.4", 3]
        say: "Trước hết, ta cần hiểu đạo hàm của một hàm f, là tốc độ f thay đổi khi biến nhích đi một chút, tức lấy độ thay đổi của f chia cho bước nhích h rất nhỏ. Bước nhích càng nhỏ thì tỉ số này càng sát đạo hàm. Ví dụ u bình phương có đạo hàm 2 u, và tại u bằng 2, nhích 0 phẩy 001 cho tỉ số 4 phẩy 001, rất gần 2 nhân 2. Đạo hàm của sin u là cos u, thử tại u bằng 0 phẩy 5, tỉ số ra 0 phẩy 8773, sát cos của 0 phẩy 5 là 0 phẩy 8776. Đạo hàm của cos u là âm sin u, tỉ số ra âm 0 phẩy 4799, sát âm sin của 0 phẩy 5 là âm 0 phẩy 4794. Hai quy tắc của sin và cos chỉ đúng khi góc đo bằng radian, với 180 độ bằng pi radian, nên 1 độ xấp xỉ 0 phẩy 01745 radian."
      - clear: true
        show: |
          <p><b>Đạo hàm riêng:</b> giữ các biến khác đứng yên, chỉ cho một biến thay đổi. Ví dụ $f = a \cdot b^2$ tại $a = 3$, $b = 2$:</p>
          <table class="t"><tr><th>đạo hàm riêng</th><th>công thức</th><th>tại (3, 2)</th></tr>
          <tr><td>$\dfrac{\partial f}{\partial a}$</td><td>$b^2$</td><td>4</td></tr>
          <tr><td>$\dfrac{\partial f}{\partial b}$</td><td>$2 \cdot a \cdot b$</td><td>12</td></tr></table>
        introduces: [power]
        focus: [1, 1, 1, "2.2", "2.3"]
        say: "Khi hàm có nhiều biến, ta cần thêm ba điều nữa. Điều thứ nhất, đạo hàm riêng là đạo hàm theo một biến trong khi giữ các biến khác đứng yên, như thể chúng là hằng số. Ví dụ f bằng a nhân b bình phương, tại a bằng 3 và b bằng 2. Đạo hàm riêng theo a là b bình phương, bằng 4. Đạo hàm riêng theo b là 2 nhân a nhân b, tức 2 nhân 3 nhân 2, bằng 12."
      - show: |
          <p><b>Quy tắc chuỗi:</b> nếu $a$ và $b$ đều thay đổi theo thời gian thì tốc độ của $f$ là tổng hai phần:</p>
          <p>$$f' = \frac{\partial f}{\partial a}\,a' + \frac{\partial f}{\partial b}\,b' = 4 \cdot 1 + 12 \cdot 0{,}5 = 10$$</p>
          <p class="note">Với $a' = 1$, $b' = 0{,}5$. Máy thử bằng cách nhích $a$, $b$ đi một chút: tỉ số thay đổi cũng ra 10.</p>
        focus: [1, 1, 2, 3]
        say: "Điều thứ hai là quy tắc chuỗi, nếu cả a và b đều thay đổi theo thời gian thì tốc độ thay đổi của f là tổng của hai phần. Mỗi phần là một đạo hàm riêng nhân với tốc độ của biến đó. Với a phẩy bằng 1 và b phẩy bằng 0 phẩy 5, ta được 4 nhân 1 cộng 12 nhân 0 phẩy 5, bằng 10. Máy đã thử bằng cách nhích a và b đi một lượng rất nhỏ, tỉ số thay đổi cũng ra đúng 10."
      - clear: true
        show: |
          <p><b>Định thức 2 × 2:</b> $\det \begin{bmatrix} a & b \\ c & d \end{bmatrix} = a \cdot d - b \cdot c$.</p>
          <table class="t"><tr><th>ma trận</th><th>định thức</th><th>hai cột</th></tr>
          <tr><td>$\begin{bmatrix} 2 & 1 \\ 4 & 3 \end{bmatrix}$</td><td>$2 \cdot 3 - 1 \cdot 4 = 2$</td><td>khác phương, có nghịch đảo</td></tr>
          <tr><td>$\begin{bmatrix} 1 & 2 \\ 2 & 4 \end{bmatrix}$</td><td>$1 \cdot 4 - 2 \cdot 2 = 0$</td><td>cột 2 gấp đôi cột 1: cùng phương, không có nghịch đảo</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Điều thứ ba, định thức của ma trận hai nhân hai bằng a nhân d trừ b nhân c. Ma trận 2, 1, 4, 3 có định thức 6 trừ 4 bằng 2, hai cột khác phương nên có nghịch đảo. Ma trận 1, 2, 2, 4 có định thức 4 trừ 4 bằng 0, vì cột thứ hai gấp đôi cột thứ nhất, hai cột cùng phương nên không có nghịch đảo. Đó chính là điều sẽ xảy ra ở điểm kỳ dị."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: v = J θ′"
    checks:
      - "all(np.allclose(alg.jac2(1, 1, a, b), np.array([[(alg.fk2(1, 1, a + 1e-6 * 180 / math.pi, b)[1][i] - alg.fk2(1, 1, a, b)[1][i]) / 1e-6, (alg.fk2(1, 1, a, b + 1e-6 * 180 / math.pi)[1][i] - alg.fk2(1, 1, a, b)[1][i]) / 1e-6] for i in (0, 1)]), atol=1e-5) for a, b in ((30, 60), (0, 90), (120, -45)))"
    steps:
      - show: |
          <p>$\theta'_1$, $\theta'_2$: tốc độ quay của khớp (radian mỗi giây). $\mathbf{v} = (x', y')^T$: vận tốc đầu tay.</p>
          <p>Theo quy tắc chuỗi vừa ôn, $x' = \dfrac{\partial x}{\partial \theta_1}\theta'_1 + \dfrac{\partial x}{\partial \theta_2}\theta'_2$, và tương tự với $y'$. Gom lại:</p>
          <p>$\mathbf{v} = \mathbf{J}\,\boldsymbol{\theta}'$, $\quad \mathbf{J} = \begin{bmatrix} \partial x/\partial\theta_1 & \partial x/\partial\theta_2 \\ \partial y/\partial\theta_1 & \partial y/\partial\theta_2 \end{bmatrix}$</p>
          <div class="box key">$\mathbf{J}$ là Jacobian của động học thuận (bài 4): hàng là $x, y$; cột là hai khớp.</div>
        introduces: [thetavec]
        focus: [1, 2, 2, 3, 4]
        say: "Gọi theta 1 phẩy và theta 2 phẩy là tốc độ quay của hai khớp, đo bằng radian mỗi giây, và v là vận tốc của đầu tay. Theo quy tắc chuỗi vừa ôn, x phẩy bằng đạo hàm riêng của x theo theta 1 nhân theta 1 phẩy, cộng đạo hàm riêng theo theta 2 nhân theta 2 phẩy. Đạo hàm y phẩy cũng tính theo đúng cách đó. Gom lại thành một phép nhân ma trận, v bằng J nhân vector tốc độ khớp. J chính là Jacobian của công thức động học thuận ở bài 4, hàng ứng với x, y, cột ứng với hai khớp."
      - show: |
          <p>Lấy đạo hàm công thức bài 4 (viết tắt $s_1 = \sin\theta_1$, $s_{12} = \sin(\theta_1 + \theta_2)$, tương tự $c$):</p>
          <p>$\mathbf{J} = \begin{bmatrix} -L_1 s_1 - L_2 s_{12} & -L_2 s_{12} \\ L_1 c_1 + L_2 c_{12} & L_2 c_{12} \end{bmatrix}$</p>
          <p class="note">Ví dụ ô trên trái: $x = L_1\cos\theta_1 + L_2\cos(\theta_1 + \theta_2)$; giữ $\theta_2$ yên, đạo hàm của $\cos$ là $-\sin$, nên $\partial x/\partial\theta_1 = -L_1 s_1 - L_2 s_{12}$.</p>
          <p class="note">Máy đã so với đạo hàm số (lệch góc một phần triệu radian) ở ba tư thế: trùng nhau.</p>
        introduces: [frame2]
        focus: [1, 2, 3, 3, 4]
        say: "Lấy đạo hàm công thức ở bài 4, ta viết tắt s 1 là sin theta 1, s 1 2 là sin của theta 1 cộng theta 2, và tương tự với cos. Lấy ví dụ ô trên bên trái, x bằng L 1 cos theta 1 cộng L 2 cos của theta 1 cộng theta 2, ta giữ theta 2 đứng yên và lấy đạo hàm theo theta 1. Đạo hàm của cos là âm sin, nên ô đó bằng âm L 1 s 1 trừ L 2 s 1 2. Cột thứ hai chỉ có các số hạng của khâu 2, vì quay khớp 2 không làm khâu 1 chuyển động. Máy đã so ma trận này với đạo hàm tính bằng số ở ba tư thế, và chúng trùng nhau."

  - id: intuition
    kind: intuition
    title: "Hình dung: mỗi cột của J là một mũi tên vận tốc"
    checks:
