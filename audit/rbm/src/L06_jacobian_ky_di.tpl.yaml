assumes: [arith, cdot, vec, mat, sub, transpose, det, inverse, partial, jacobian, prime, absval, cos, sin, theta, deg, frac, approx, implies]
# Quy ước: θ' là vận tốc góc (radian mỗi giây, đạo hàm theo thời gian — dấu phẩy trên như CS115 bài 6); v là vận tốc đầu tay;
#   J cỡ 2 × 2, hàng = (x, y), cột = (θ_1, θ_2) như CS115 bài 7. Viết tắt trong lời: “sin của theta 1 cộng theta 2”.
#   det J = L_1 L_2 sin θ_2 rút gọn bằng sympy (audit/rbm/verify_rbm.py); mọi số do alg.jac2 / numpy.linalg.solve tính.
objectives:
  - "Lập Jacobian vận tốc của tay máy hai khâu"
  - "Tính det J = L₁L₂ sin θ₂ và nhận ra cấu hình kỳ dị"
  - "Thấy vận tốc khớp bùng nổ khi tiến gần điểm kỳ dị"
