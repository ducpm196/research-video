ize="22" text-anchor="start" fill="#1f2937">khớp 2</text><text x="576" y="169" font-size="22" text-anchor="start" fill="#15803d" font-weight="bold">đầu tay</text><text x="790" y="60" font-size="23" text-anchor="start" fill="#1f2937" font-weight="bold">Tư thế (30°, 60°), hai khâu dài 1</text><text x="790" y="122" font-size="23" text-anchor="start" fill="#2a78d6">Chỉ quay khớp 1: cả tay xoay quanh khớp 1,</text><text x="790" y="168" font-size="23" text-anchor="start" fill="#2a78d6">đầu tay đi trên vòng tròn xanh nhạt</text><text x="790" y="214" font-size="23" text-anchor="start" fill="#2a78d6" font-weight="bold">→ vận tốc = cột 1 = (−1,5; 0,866)</text><text x="790" y="276" font-size="23" text-anchor="start" fill="#eb6834">Chỉ quay khớp 2: khâu 2 xoay quanh khớp 2,</text><text x="790" y="322" font-size="23" text-anchor="start" fill="#eb6834">đầu tay đi trên vòng tròn cam nhạt</text><text x="790" y="368" font-size="23" text-anchor="start" fill="#eb6834" font-weight="bold">→ vận tốc = cột 2 = (−1; 0)</text><text x="790" y="430" font-size="23" text-anchor="start" fill="#1f2937" font-weight="bold">Quay cả hai: cộng hai mũi tên.</text></svg></div>
        focus: [1, 1, 1, 1, 1, 1]
        say: "Hình này cho thấy mỗi cột của J có nghĩa gì, ở tư thế 30 độ, 60 độ với hai khâu dài 1. Nếu chỉ quay khớp 1, cả cánh tay xoay quanh khớp 1 như một khối cứng, đầu tay chạy trên vòng tròn xanh nhạt. Vận tốc của nó là mũi tên xanh, chính là cột thứ nhất của J. Nếu chỉ quay khớp 2, chỉ khâu 2 xoay quanh khớp 2, đầu tay chạy trên vòng tròn cam nhạt, vận tốc là mũi tên cam, chính là cột thứ hai. Quay cả hai khớp cùng lúc thì vận tốc đầu tay là tổng hai mũi tên, mỗi mũi tên nhân với tốc độ của khớp tương ứng. Khi hai mũi tên này nằm cùng một phương, đầu tay mất một hướng đi, đó là điểm kỳ dị."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tư thế (30°, 60°) của bài 4"
    checks:
      - "np.allclose(alg.jac2(1, 1, 30, 60), [[-1.5, -1], [3 ** 0.5 / 2, 0]])"
      - "np.allclose(alg.jac2(1, 1, 30, 60) @ [1, 0], [-1.5, 3 ** 0.5 / 2])"
      - "abs(np.dot(alg.jac2(1, 1, 30, 60) @ [1, 0], alg.fk2(1, 1, 30, 60)[1])) < 1e-12"
      - "np.allclose(alg.jac2(1, 1, 30, 60) @ [0, 1], [-1, 0])"
      - "np.allclose(alg.jac2(1, 1, 30, 60) @ [1, 1], [-2.5, 3 ** 0.5 / 2]) and round(-0.5 - 1, 9) == -1.5"
    steps:
      - show: |
          <p><b>Bước 1 —</b> $L_1 = L_2 = 1$, $\theta_1 = 30^\circ$, $\theta_2 = 60^\circ$: $s_1 = 0{,}5$, $c_1 = 0{,}866$, $s_{12} = \sin 90^\circ = 1$, $c_{12} = 0$.</p>
        say: "Bước một, thử ở tư thế 30 độ, 60 độ của bài 4 với hai khâu dài 1. Sin 30 độ bằng 0 phẩy 5, cos 30 độ bằng 0 phẩy 866, còn theta 1 cộng theta 2 bằng 90 độ nên s 1 2 bằng 1 và c 1 2 bằng 0."
      - show: |
          <p><b>Bước 2 —</b> thế vào công thức của $\mathbf{J}$:</p>
          $$\mathbf{J} = \begin{bmatrix} -0{,}5 - 1 & -1 \\ 0{,}866 + 0 & 0 \end{bmatrix} = \begin{bmatrix} -1{,}5 & -1 \\ 0{,}866 & 0 \end{bmatrix}$$
        focus: [2, 2]
        say: "Bước hai, thế các số đó vào công thức của J, góc trên bên trái là âm 0 phẩy 5 trừ 1. Thay sin, cos vào, ta được J với hàng trên âm 1 phẩy 5 và âm 1, hàng dưới 0 phẩy 866 và 0."
      - show: |
          <p><b>Bước 3 —</b> chỉ quay khớp 1, $\boldsymbol{\theta}' = (1, 0)^T$: $\mathbf{v} = 1 \cdot (\text{cột } 1) + 0 \cdot (\text{cột } 2) = \hl{(-1{,}5;\ 0{,}866)^T}$.</p>
        say: "Bước ba, nếu chỉ quay khớp 1 với tốc độ 1 radian mỗi giây, ta lấy 1 lần cột thứ nhất cộng 0 lần cột thứ hai. Đầu tay có vận tốc âm 1 phẩy 5, 0 phẩy 866, đúng mũi tên xanh trong hình vừa rồi."
      - show: |
          <p><b>Bước 4 —</b> chỉ quay khớp 2, $\boldsymbol{\theta}' = (0, 1)^T$: $\mathbf{v} = \hl{(-1, 0)^T}$, tức cột 2.</p>
        say: "Bước bốn, nếu chỉ quay khớp 2 với tốc độ 1, ta lấy đúng cột thứ hai. Đầu tay đi theo hướng âm 1, 0, tức sang trái, đúng mũi tên cam."
      - show: |
          <p><b>Bước 5 —</b> quay cả hai, $\boldsymbol{\theta}' = (1, 1)^T$, cộng hai cột:</p>
          $$\mathbf{v} = (-1{,}5 - 1;\ 0{,}866 + 0)^T = \hl{(-2{,}5;\ 0{,}866)^T}$$
        focus: [1, 2]
        say: "Bước năm, nếu quay cả hai khớp cùng tốc độ 1, ta cộng hai cột lại. Toạ độ đầu là âm 1 phẩy 5 trừ 1, bằng âm 2 phẩy 5, toạ độ sau vẫn là 0 phẩy 866."

  - id: check
    kind: check
    title: "Tự kiểm: hình học vòng tròn và nhích khớp một độ"
    checks:
      - "abs(np.linalg.norm(alg.fk2(1, 1, 30, 60)[1]) - 3 ** 0.5) < 1e-12 and abs(np.linalg.norm(alg.jac2(1, 1, 30, 60)[:, 0]) - 3 ** 0.5) < 1e-12"
      - "round(-1.5 * 0.866 + 0.866 * 1.5, 9) == 0 and round(1.5 ** 2 + 0.866 ** 2, 2) == 3.0 and round(3 ** 0.5, 3) == 1.732"
      - "[round(v, 4) for v in np.array(alg.fk2(1, 1, 31, 60)[1]) - np.array(alg.fk2(1, 1, 30, 60)[1])] == [-0.0263, 0.0149] and round(math.radians(1), 5) == 0.01745"
      - "[round(v, 2) for v in (np.array(alg.fk2(1, 1, 31, 60)[1]) - np.array(alg.fk2(1, 1, 30, 60)[1])) / math.radians(1)] == [-1.51, 0.85]"
    steps:
      - show: |
          <p>Đường thứ nhất: <b>hình học</b>. Quay khớp 1 với tốc độ 1 thì đầu tay chạy trên vòng tròn tâm khớp 1, bán kính bằng khoảng cách tới đầu tay $(0{,}866;\ 1{,}5)$.</p>
          <table class="t"><tr><th>điều phải đúng</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>độ dài vận tốc = bán kính</td><td>$\sqrt{1{,}5^2 + 0{,}866^2}$ và $\sqrt{0{,}866^2 + 1{,}5^2}$</td><td>cả hai $\approx 1{,}732$ ✓</td></tr>
          <tr><td>vận tốc vuông góc bán kính</td><td>$-1{,}5 \cdot 0{,}866 + 0{,}866 \cdot 1{,}5$</td><td>$0$ ✓</td></tr></table>
        introduces: [sqrt]
        focus: [1, 1, 1, "2.2", "2.3", "2.3"]
        say: "Làm sao biết cột thứ nhất tính đúng mà không cần đạo hàm? Đường thứ nhất là hình học, quay khớp 1 với tốc độ 1 radian mỗi giây thì đầu tay chạy trên vòng tròn tâm khớp 1. Tốc độ của nó bằng đúng bán kính, vì mỗi radian quay đi một cung dài bằng bán kính. Bán kính là khoảng cách tới đầu tay 0 phẩy 866, 1 phẩy 5, xấp xỉ 1 phẩy 732, và độ dài của vector âm 1 phẩy 5, 0 phẩy 866 cũng xấp xỉ 1 phẩy 732. Thêm nữa, vận tốc trên vòng tròn phải vuông góc với bán kính, và tích vô hướng của hai vector đó đúng bằng 0. Tích vô hướng là nhân từng cặp toạ độ rồi cộng lại, và bằng 0 là dấu hiệu của hai hướng vuông góc."
      - show: |
          <p>Đường thứ hai: <b>nhích khớp 1 thêm $1^\circ$</b> ($\approx 0{,}01745$ radian) bằng động học thuận của bài 4, rồi chia.</p>
          <table class="t"><tr><th></th><th>$x$</th><th>$y$</th></tr>
          <tr><td>đầu tay ở $(31^\circ, 60^\circ)$ trừ ở $(30^\circ, 60^\circ)$</td><td>$-0{,}0263$</td><td>$0{,}0149$</td></tr>
          <tr><td>chia cho $0{,}01745$</td><td>$\approx -1{,}51$</td><td>$\approx 0{,}85$</td></tr></table>
          <p class="note">Gần đúng cột 1 $(-1{,}5;\ 0{,}866)$; lệch chút vì $1^\circ$ chưa thật nhỏ.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Đường thứ hai, ta không dùng J mà dùng động học thuận của bài 4, tính vị trí đầu tay khi khớp 1 nhích thêm 1 độ, tức khoảng 0 phẩy 01745 radian. Đầu tay dịch đi âm 0 phẩy 0263 theo trục ngang và 0 phẩy 0149 theo trục đứng. Chia cho 0 phẩy 01745, ta được xấp xỉ âm 1 phẩy 51 và 0 phẩy 85. Con số này rất gần cột thứ nhất âm 1 phẩy 5, 0 phẩy 866, chỉ lệch chút vì 1 độ chưa thật sự nhỏ."

  # ───────────────────────── 4. KỲ DỊ ─────────────────────────
  - id: singular
    kind: concept
    title: "det J = L₁L₂ sin θ₂ và điểm kỳ dị"
    checks:
      - "all(abs(np.linalg.det(alg.jac2(1.3, 0.7, a, b)) - 1.3 * 0.7 * math.sin(math.radians(b))) < 1e-12 for a in range(0, 360, 30) for b in range(-180, 180, 15))"
      - "abs(np.linalg.det(alg.jac2(1, 1, 30, 60)) - 3 ** 0.5 / 2) < 1e-12"
      - "abs(np.linalg.det(alg.jac2(1, 1, 20, 0))) < 1e-12 and abs(np.linalg.det(alg.jac2(1, 1, 20, 180))) < 1e-12"
      - "np.linalg.matrix_rank(alg.jac2(1, 1, 20, 0)) == 1"
    steps:
      - show: |
          <p>Khai triển $ad - bc$, hai số hạng $L_2^2 s_{12}c_{12}$ triệt tiêu nhau:</p>
          <p>$\det \mathbf{J} = (-L_1 s_1 - L_2 s_{12})L_2 c_{12} + L_2 s_{12}(L_1 c_1 + L_2 c_{12}) = L_1L_2\,(s_{12}c_1 - s_1c_{12}) = L_1L_2\sin\theta_2$</p>
          <p class="note">vì $\sin(a - b) = \sin a\cos b - \cos a\sin b$ với $a = \theta_1 + \theta_2$, $b = \theta_1$. Thử: $\sin 60^\circ = 0{,}866 = (-1{,}5)\cdot 0 - (-1)\cdot 0{,}866$.</p>
          <div class="box key">$\det \mathbf{J} = 0$ khi $\theta_2 = 0^\circ$ (duỗi thẳng) hoặc $180^\circ$ (gập hẳn): <b>điểm kỳ dị</b>.</div>
        focus: [1, 1, 2, 2, 3, 3, 4]
        say: "Khai triển định thức của J, các số hạng gộp lại thành L 1 L 2 nhân sin theta 2. Cụ thể, ta lấy a nhân d trừ b nhân c, và hai số hạng chứa L 2 bình phương triệt tiêu nhau. Chỉ còn lại L 1 L 2 nhân với s 1 2 c 1 trừ s 1 c 1 2. Bước gộp cuối dùng công thức sin của một hiệu, với a là theta 1 cộng theta 2 và b là theta 1. Thử bằng số ở ví dụ vừa rồi, âm 1 phẩy 5 nhân 0, trừ âm 1 nhân 0 phẩy 866, ra 0 phẩy 866, đúng bằng sin 60 độ. Định thức bằng 0 khi theta 2 bằng 0 độ, tay duỗi thẳng, hoặc 180 độ, tay gập hẳn. Những tư thế đó gọi là điểm kỳ dị."
      - clear: true
        show: |
          <div>{{SING}}</div>
          <p>Ở $\theta_2 = 0^\circ$, hai cột của $\mathbf{J}$ cùng phương: mọi $\boldsymbol{\theta}'$ chỉ cho vận tốc vuông góc với tay. Hướng dọc tay <b>không đạt được</b> — mất một hướng chuyển động.</p>
        focus: [1, 2, 2]
        say: "Ở tư thế duỗi thẳng, hai cột của J cùng phương. Vì vậy dù hai khớp quay thế nào, đầu tay chỉ đi được theo hướng vuông góc với tay, như mũi tên cam. Hướng dọc theo tay, mũi tên xám, không đạt được, tức mất một hướng chuyển động."

  # ───────────────────────── 5. GẦN KỲ DỊ ─────────────────────────
  - id: near
    kind: concept
    title: "Gần kỳ dị: tốc độ khớp bùng nổ"
    checks:
      - "(lambda w: [round(abs(w(t)[1]), 2) for t in (90, 30, 10, 1)] == [0.14, 0.39, 1.15, 11.46])(lambda t: np.linalg.solve(alg.jac2(1, 1, 0, t), 0.1 * np.array(alg.fk2(1, 1, 0, t)[1]) / np.linalg.norm(alg.fk2(1, 1, 0, t)[1])))"
      - "all(abs(abs(np.linalg.solve(alg.jac2(1, 1, 0, t), 0.1 * np.array(alg.fk2(1, 1, 0, t)[1]) / np.linalg.norm(alg.fk2(1, 1, 0, t)[1]))[1]) - 0.1 / math.sin(math.radians(t / 2))) < 1e-9 for t in (90, 30, 10, 1))"
    steps:
      - show: |
          <p>Muốn đầu tay đi ra xa với tốc độ $0{,}1$ m/s, cần $\boldsymbol{\theta}' = \mathbf{J}^{-1}\mathbf{v}$. Tốc độ khớp 2 cần có ($L_1 = L_2 = 1$, $\theta_1 = 0^\circ$):</p>
          <table class="t"><tr><th>$\theta_2$</th><th>$90^\circ$</th><th>$30^\circ$</th><th>$10^\circ$</th><th>$1^\circ$</th></tr>
          <tr><td>$\lvert \theta'_2 \rvert$ (rad/s)</td><td>0,14</td><td>0,39</td><td>1,15</td><td>11,46</td></tr></table>
          <div class="box key">Kỳ dị không chỉ hỏng <b>tại</b> $\theta_2 = 0^\circ$: ở <b>gần</b> đó, $\mathbf{J}^{-1}$ rất lớn, động cơ phải quay rất nhanh.</div>
        focus: [1, 1, 2, "2.2", 3, 3]
        say: "Bây giờ ta muốn đầu tay đi thẳng ra xa với tốc độ 0 phẩy 1 mét mỗi giây. Tốc độ khớp cần có bằng nghịch đảo của J nhân v. Bảng cho tốc độ khớp 2 cần có ở bốn tư thế. Khi theta 2 giảm từ 90 độ xuống 1 độ, con số tăng từ 0 phẩy 14 lên 11 phẩy 46 radian mỗi giây, gấp hơn 80 lần. Vậy kỳ dị không chỉ gây hỏng tại đúng 0 độ. Ở gần đó, nghịch đảo của J rất lớn, nên động cơ phải quay rất nhanh, chính là cú giật ở đầu bài."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "abs(math.pi / 180 - 0.01745) < 1e-5"
      - "not np.allclose(alg.jac2(1, 1, 30, 60), alg.jac2(1, 1, 0, 90))"
      - "abs(np.linalg.det(alg.jac2(1, 1, 0, 1))) > 0 and abs(np.linalg.det(alg.jac2(1, 1, 0, 1))) < 0.02"
      - "round(np.linalg.det(alg.jac2(1, 1, 0, 1)), 3) == 0.017 and round(np.linalg.det(alg.jac2(1, 1, 0, 90)), 9) == 1"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ né đúng điểm $\det \mathbf{J} = 0$ <b class="red">(thiếu)</b>
          <br><span class="note">Ở $\theta_2 = 1^\circ$, $\det \mathbf{J} \approx 0{,}017 \ne 0$ nhưng tốc độ khớp đã gấp hơn 80 lần. Phải giữ khoảng cách an toàn quanh điểm kỳ dị.</span></div>
          <table class="t"><tr><th>$\theta_2$</th><th>$\det \mathbf{J}$</th><th>$\lvert \theta'_2 \rvert$ cần có</th></tr><tr><td>$90^\circ$</td><td>1</td><td>0,14</td></tr><tr><td>$1^\circ$</td><td>0,017</td><td>11,46</td></tr></table>
        focus: [1, 2, 1]
        say: "Lỗi thứ nhất, chỉ né đúng điểm định thức bằng 0. Ở theta 2 bằng 1 độ, định thức xấp xỉ 0 phẩy 017, khác 0, nhưng tốc độ khớp đã gấp hơn 80 lần. Phải giữ một khoảng cách an toàn quanh điểm kỳ dị."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tính $\mathbf{J}$ một lần rồi dùng mãi <b class="red">(sai)</b>
          <br><span class="note">$\mathbf{J}$ phụ thuộc tư thế. Tay di chuyển thì phải tính lại.</span></div>
        say: "Lỗi thứ hai, tính J một lần rồi dùng mãi. J phụ thuộc vào tư thế, nên khi tay di chuyển thì phải tính lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đo tốc độ khớp bằng độ mỗi giây trong công thức <b class="red">(sai)</b>
          <br><span class="note">Đạo hàm của $\sin$, $\cos$ chỉ đúng với radian. 1 độ $\approx 0{,}01745$ radian.</span></div>
        say: "Lỗi thứ ba, dùng tốc độ khớp theo độ mỗi giây trong công thức. Đạo hàm của sin và cos chỉ đúng khi góc đo bằng radian, mà 1 độ chỉ xấp xỉ 0 phẩy 01745 radian."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ kỳ dị là hỏng cơ khí <b class="red">(sai)</b>
          <br><span class="note">Tay vẫn khoẻ. Kỳ dị là tư thế mà cách bố trí khớp mất một hướng chuyển động.</span></div>
        say: "Lỗi thứ tư, nghĩ kỳ dị là hỏng cơ khí. Tay máy vẫn hoàn toàn khoẻ, kỳ dị chỉ là tư thế mà cách bố trí khớp mất một hướng chuyển động."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "np.allclose(alg.jac2(1, 1, 0, 90), [[-1, -1], [1, 0]]) and abs(np.linalg.det(alg.jac2(1, 1, 0, 90)) - 1) < 1e-12"
      - "np.allclose(alg.jac2(1, 1, 0, 90) @ [0, 1], [-1, 0])"
      - "abs(np.linalg.det(alg.jac2(2, 1, 45, 180))) < 1e-12"
      - "abs(np.linalg.norm(alg.fk2(2, 1, 45, 180)[1]) - 1) < 1e-12 and (-1) * 0 - (-1) * 1 == 1 and np.allclose(alg.fk2(1, 1, 0, 90)[1], [1, 1])"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$L_1 = L_2 = 1$, $\theta_1 = 0^\circ$, $\theta_2 = 90^\circ$: viết $\mathbf{J}$, tính $\det \mathbf{J}$, và $\mathbf{v}$ khi chỉ quay khớp 2 với tốc độ 1.</td></tr>
          <tr><td>2</td><td>$L_1 = 2$, $L_2 = 1$, $\theta_2 = 180^\circ$: có phải điểm kỳ dị không?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hai khâu dài 1, theta 1 bằng 0, theta 2 bằng 90 độ, hãy viết J, tính định thức, và tìm vận tốc đầu tay khi chỉ quay khớp 2 với tốc độ 1. Câu hai, khâu 1 dài 2, khâu 2 dài 1, theta 2 bằng 180 độ, đó có phải điểm kỳ dị không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $s_1 = 0$, $c_1 = 1$, $s_{12} = \sin 90^\circ = 1$, $c_{12} = 0$: $\mathbf{J} = \begin{bmatrix} -1 & -1 \\ 1 & 0 \end{bmatrix}$</p>
          <p>$\det \mathbf{J} = (-1) \cdot 0 - (-1) \cdot 1 = 1 = \sin 90^\circ$ ✓</p>
        focus: [1, 2]
        say: "Đáp án câu một, thay sin, cos vào được J với hàng trên âm 1, âm 1 và hàng dưới 1, 0, định thức bằng 1, đúng bằng sin 90 độ. Tính tay theo a nhân d trừ b nhân c, ta có âm 1 nhân 0 trừ âm 1 nhân 1, cũng bằng 1."
      - show: |
          <p>Chỉ quay khớp 2: $\mathbf{v} = \text{cột } 2 = \hl{(-1, 0)^T}$. Kiểm hình học: khâu 2 đang chỉ thẳng lên, nên đầu tay quay quanh khớp 2 đi ngang sang trái ✓</p>
        say: "Vận tốc khi chỉ quay khớp 2 là cột thứ hai, âm 1, 0. Kiểm bằng hình, khâu 2 đang chỉ thẳng lên trên, nên khi nó quay quanh khớp 2 ngược chiều kim đồng hồ, đầu tay đi ngang sang trái."
      - show: |
          <p>② $\det \mathbf{J} = 2 \cdot 1 \cdot \sin 180^\circ = 0$: <b>có</b> — tay gập hẳn, đầu tay ở mép trong của vùng với tới, cách gốc $2 - 1 = 1$.</p>
        say: "Câu hai, định thức bằng 2 nhân 1 nhân sin 180 độ, bằng 0, nên đó là điểm kỳ dị, tay gập hẳn và đầu tay nằm ở mép trong của vùng với tới. Khi đó đầu tay cách gốc đúng 2 trừ 1, bằng 1."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đạo hàm động học thuận</span><span class="a">→</span>
          <span class="n">$\mathbf{v} = \mathbf{J}\boldsymbol{\theta}'$</span><span class="a">→</span>
          <span class="n">$\det \mathbf{J} = L_1L_2\sin\theta_2$</span><span class="a">→</span>
          <span class="n">gần 0: tốc độ khớp bùng nổ</span></div>
        say: "Tổng kết lại, lấy đạo hàm của động học thuận ta được Jacobian, nối tốc độ khớp với vận tốc đầu tay. Định thức của nó bằng L 1 L 2 sin theta 2. Khi định thức về gần 0, tốc độ khớp cần có bùng nổ."
      - show: |
          <div class="box key"><b>Tư duy:</b> định thức nhỏ nghĩa là nghịch đảo lớn. Ở đâu có “chia cho định thức”, ở đó cần kiểm xem nó gần 0 tới mức nào.</div>
        say: "Điều cần mang theo, định thức nhỏ nghĩa là nghịch đảo lớn. Ở đâu có phép chia cho định thức, ở đó cần kiểm xem nó gần 0 tới mức nào."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>phương trình vi phân</b> — mô tả chuyển động theo thời gian, và phương pháp Euler để giải gần đúng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học phương trình vi phân, cách mô tả chuyển động theo thời gian, và phương pháp Euler để giải gần đúng. Hẹn gặp bạn ở bài tiếp theo."
