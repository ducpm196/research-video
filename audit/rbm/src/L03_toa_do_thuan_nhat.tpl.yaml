id: L03
course: RBM
series: "RBM · Toán cho robot và hệ động lực"
title: "Bài 3 — Toạ độ thuần nhất và biến đổi cứng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rbm.yaml L03; audit/rbm/verify_rbm.py L03; K. M. Lynch, F. C. Park, Modern Robotics (2017), mục 3.3"
assumes: [arith, cdot, vec, mat, sub, transpose, identity, inverse, cos, sin, theta, deg, implies]
# Quy ước: điểm 2D viết thuần nhất (x, y, 1)^T; hướng (vector tự do) viết (x, y, 0)^T; T_{WB} đổi toạ độ từ khung B sang khung W
#   (chữ trái = khung đích, chữ phải = khung nguồn); ghép T_{WC} = T_{WB} T_{BC} (hai chữ B kề nhau “triệt tiêu”).
#   Mọi số do alg.homog2 tính; nghịch đảo kiểm bằng numpy.linalg.inv.
objectives:
  - "Viết ma trận thuần nhất 3 × 3 ghép quay và tịnh tiến"
  - "Ghép nhiều biến đổi đúng thứ tự và đổi khung qua chuỗi"
  - "Tính nghịch đảo của một biến đổi rigid"
asr_reviewed:
  - {sentence: "Lỗi thứ ba, lấy nghịch đảo của cả ma trận T bằng chuyển vị.", reason: "nghịch đảo → “nhiệt đạo”, cả → “cá”: nhầm phụ âm đầu ng/nh và thanh của ASR; “nghịch đảo” chép đúng ở các câu khác của L03 — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nghịch đảo của T có khối R chuyển vị và cột cuối âm R chuyển vị nhân t.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Ta ghép T W C bằng T W B nhân T B C, hai chữ B đứng kề nhau nối hai khung lại.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Ta viết p W bằng R nhân p B cộng t.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t, không phải TTS đọc sai; chữ hiện trên màn hình; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "T W B nhân T C B là vô nghĩa, hai chữ ở giữa phải trùng nhau, như T W B nhân T B C.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Ta ký hiệu T với hai chữ dưới W và B, nghĩa là đổi toạ độ từ khung B sang khung W.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Từ p W bằng R nhân p B cộng t, ta chuyển t sang vế trái, rồi nhân hai vế với R chuyển vị, vì R chuyển vị nhân R bằng ma trận đơn vị.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t, không phải TTS đọc sai; chữ hiện trên màn hình; tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Câu ba, T đưa hướng 1, 0 tới đâu?", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Từ B sang W, quay 90 độ được 0, 1 phẩy 5, cộng 2, 0, ra 2, 1 phẩy 5.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Muốn đi ngược từ bản đồ về khung robot, ta cần nghịch đảo của T.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
  - {sentence: "Nhân ma trận không giao hoán, và trong A nhân B nhân p thì B tác động trước.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t, không phải TTS đọc sai; chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Quay rồi dời: một ma trận cho cả hai"
    steps:
      - show: |
          <p>Robot đứng ở $(2, 0)$ trên bản đồ, quay mặt $90^\circ$. Cảm biến thấy vật ở $(1, 0)$ trong khung robot.</p>
          <p>Bài 0 chỉ có phép quay, mà quay luôn giữ gốc đứng yên. Ở đây gốc của robot đã <b>dời</b> khỏi gốc bản đồ.</p>
          <div class="box key">Hôm nay: <b>toạ độ thuần nhất</b> — gói quay và tịnh tiến vào một ma trận, ghép cả chuỗi khung bằng phép nhân.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, một robot đứng ở điểm 2, 0 trên bản đồ, quay mặt 90 độ. Cảm biến của nó thấy một vật ở 1, 0 trong khung robot. Ở bài 0 ta chỉ có phép quay, và phép quay luôn giữ gốc đứng yên. Nhưng ở đây gốc của robot đã dời khỏi gốc bản đồ. Hôm nay ta học toạ độ thuần nhất, gói cả quay và tịnh tiến vào một ma trận, rồi ghép cả chuỗi khung chỉ bằng phép nhân."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: quay, cộng vector, nhân hàng với cột"
    checks:
      - "np.allclose(alg.rot2(90) @ [1, 0], [0, 1]) and np.allclose(alg.rot2(90) @ [1, 0] + [2, 0], [2, 1])"
      - "list(np.array([[1, 0, 2], [0, 1, 0], [0, 0, 1]]) @ [1, 0, 1]) == [3, 0, 1]"
      - "1 * 1 + 0 * 0 + 2 * 1 == 3 and 0 * 1 + 1 * 0 + 0 * 1 == 0 and 0 * 1 + 0 * 0 + 1 * 1 == 1"
    steps:
      - show: |
          <table class="t"><tr><th>phép</th><th>làm</th><th>kết quả</th></tr>
          <tr><td>quay $90^\circ$ (bài 0)</td><td>$\mathbf{R}(90^\circ)(1, 0)^T$ = cột 1 của $\mathbf{R}$</td><td>$(0, 1)^T$</td></tr>
          <tr><td>tịnh tiến (cộng vector)</td><td>$(0, 1)^T + (2, 0)^T = (0 + 2;\ 1 + 0)^T$</td><td>$(2, 1)^T$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước khi vào bài, ta ôn ba phép tính sẽ dùng. Phép quay 90 độ ở bài 0, ma trận R nhân với 1, 0 là lấy cột thứ nhất, được 0, 1. Phép tịnh tiến chỉ là cộng vector, cộng từng toạ độ, 0, 1 cộng 2, 0 bằng 2, 1."
      - show: |
          <p>Nhân ma trận $3 \times 3$ với vector ba số: mỗi hàng nhân với vector rồi cộng ba tích.</p>
          <p>$$\begin{bmatrix} 1 & 0 & 2 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{bmatrix}\begin{bmatrix} 1 \\ 0 \\ 1 \end{bmatrix} = \begin{bmatrix} 1 \times 1 + 0 \times 0 + 2 \times 1 \\ 0 \times 1 + 1 \times 0 + 0 \times 1 \\ 0 \times 1 + 0 \times 0 + 1 \times 1 \end{bmatrix} = \begin{bmatrix} 3 \\ 0 \\ 1 \end{bmatrix}$$</p>
        focus: [1, 2, 2]
        say: "Phép thứ ba là nhân ma trận ba nhân ba với một vector ba số, mỗi hàng nhân với vector rồi cộng ba tích lại. Hàng trên là 1, 0, 2, nhân với 1, 0, 1 được 1 cộng 0 cộng 2, bằng 3. Hai hàng còn lại cho 0 và 1, nên kết quả là 3, 0, 1, và để ý số 2 ở góc trên bên phải đã được cộng vào nhờ số 1 cuối của vector."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: thêm số 1, được ma trận 3 × 3"
    checks:
      - "np.allclose(alg.homog2(30, 5, 7) @ [2, 1, 1], list(alg.rot2(30) @ [2, 1] + [5, 7]) + [1])"
      - "np.allclose(alg.homog2(30, 5, 7) @ [2, 1, 0], list(alg.rot2(30) @ [2, 1]) + [0])"
    steps:
      - show: |
          <p>Biến đổi cứng = quay rồi tịnh tiến (giữ nguyên mọi khoảng cách): $\mathbf{p}_W = \mathbf{R}\,\mathbf{p}_B + \mathbf{t}$. Đây chưa phải phép nhân ma trận vì có “$+\,\mathbf{t}$”.</p>
          <p>Mẹo: thêm toạ độ thứ ba bằng 1. Điểm $(x, y)$ viết $(x, y, 1)^T$, và</p>
          <p>$\mathbf{T} = \begin{bmatrix} \mathbf{R} & \mathbf{t} \\ 0\ \ 0 & 1 \end{bmatrix}$, $\quad \mathbf{T}\,(x, y, 1)^T = (\mathbf{R}(x, y)^T + \mathbf{t},\ 1)^T$</p>
          <div class="box key">Cột thứ ba gặp số 1, nên $\mathbf{t}$ được cộng vào đúng một lần.</div>
        focus: [1, 1, 1, 2, 3, 4]
        say: "Một biến đổi cứng là quay rồi tịnh tiến, nó giữ nguyên mọi khoảng cách. Ta viết p W bằng R nhân p B cộng t. Đây chưa phải một phép nhân ma trận, vì còn phép cộng t. Mẹo là thêm một toạ độ thứ ba bằng 1, điểm x, y được viết thành x, y, 1. Ta đặt R vào góc trên bên trái, t vào cột thứ ba, và hàng cuối là 0, 0, 1. Khi nhân, cột thứ ba gặp đúng số 1, nên t được cộng vào đúng một lần."
      - show: |
          <p>Hướng (vector tự do, như vận tốc) viết $(x, y, \hl{0})^T$: cột $\mathbf{t}$ gặp số 0, nên hướng chỉ bị quay, <b>không</b> bị dời.</p>
          <p>Ký hiệu $\mathbf{T}_{WB}$: đổi toạ độ từ khung B sang khung W. Chữ phải là khung nguồn, chữ trái là khung đích.</p>
        introduces: [frame2]
        focus: [1, 1, 2, 2]
        say: "Còn một hướng, như vận tốc hay trục của cảm biến, thì viết toạ độ thứ ba bằng 0. Khi đó cột t gặp số 0, nên hướng chỉ bị quay, không bị dời. Ta ký hiệu T với hai chữ dưới W và B, nghĩa là đổi toạ độ từ khung B sang khung W. Chữ bên phải là khung nguồn, chữ bên trái là khung đích."

  - id: intuition
    kind: intuition
    title: "Hình dung: số cuối là công tắc của phép dời"
    checks:
      - "np.allclose(alg.homog2(90, 2, 0) @ [1, 0, 1], [2, 1, 1]) and np.allclose(alg.homog2(90, 2, 0) @ [1, 0, 0], [0, 1, 0])"
      - "np.allclose(alg.homog2(90, 2, 0), [[0, -1, 2], [1, 0, 0], [0, 0, 1]])"
    steps:
      - show: |
          <div><svg width="1300" height="470" viewBox="0 0 1300 470"><defs><marker id="tk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="60" y="86" font-size="26" text-anchor="start" fill="#1f2937" font-weight="bold">Điểm (1, 0): số cuối là 1</text><rect x="60" y="110" width="64" height="52" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/><text x="92.0" y="145" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="124" y="110" width="64" height="52" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/><text x="156.0" y="145" font-size="26" text-anchor="middle" fill="#1f2937">−1</text><rect x="188" y="110" width="64" height="52" fill="#fed7aa" stroke="#ffffff" stroke-width="2"/><text x="220.0" y="145" font-size="26" text-anchor="middle" fill="#1f2937">2</text><rect x="60" y="162" width="64" height="52" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/><text x="92.0" y="197" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="124" y="162" width="64" height="52" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/><text x="156.0" y="197" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="188" y="162" width="64" height="52" fill="#fed7aa" stroke="#ffffff" stroke-width="2"/><text x="220.0" y="197" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="60" y="214" width="64" height="52" fill="#e5e7eb" stroke="#ffffff" stroke-width="2"/><text x="92.0" y="249" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="124" y="214" width="64" height="52" fill="#e5e7eb" stroke="#ffffff" stroke-width="2"/><text x="156.0" y="249" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="188" y="214" width="64" height="52" fill="#e5e7eb" stroke="#ffffff" stroke-width="2"/><text x="220.0" y="249" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="282" y="110" width="64" height="52" fill="#f3f4f6" stroke="#ffffff" stroke-width="2"/><text x="314.0" y="145" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="282" y="162" width="64" height="52" fill="#f3f4f6" stroke="#ffffff" stroke-width="2"/><text x="314.0" y="197" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="282" y="214" width="64" height="52" fill="#bbf7d0" stroke="#ffffff" stroke-width="2"/><text x="314.0" y="249" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">1</text><text x="376" y="198.0" font-size="32" text-anchor="middle" fill="#1f2937">=</text><rect x="406" y="110" width="64" height="52" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="438.0" y="145" font-size="26" text-anchor="middle" fill="#15803d" font-weight="bold">2</text><rect x="406" y="162" width="64" height="52" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="438.0" y="197" font-size="26" text-anchor="middle" fill="#15803d" font-weight="bold">1</text><rect x="406" y="214" width="64" height="52" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="438.0" y="249" font-size="26" text-anchor="middle" fill="#15803d" font-weight="bold">1</text><path d="M 220 270 C 220 312, 314 312, 314 274" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#tk)"/><text x="60" y="336" font-size="22" text-anchor="start" fill="#1f2937">cột cam t = (2, 0) nhân với số 1</text><text x="60" y="366" font-size="22" text-anchor="start" fill="#1f2937" font-weight="bold">→ cộng thêm (2, 0): điểm bị dời</text><text x="700" y="86" font-size="26" text-anchor="start" fill="#1f2937" font-weight="bold">Hướng (1, 0): số cuối là 0</text><rect x="700" y="110" width="64" height="52" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/><text x="732.0" y="145" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="764" y="110" width="64" height="52" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/><text x="796.0" y="145" font-size="26" text-anchor="middle" fill="#1f2937">−1</text><rect x="828" y="110" width="64" height="52" fill="#fed7aa" stroke="#ffffff" stroke-width="2"/><text x="860.0" y="145" font-size="26" text-anchor="middle" fill="#1f2937">2</text><rect x="700" y="162" width="64" height="52" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/><text x="732.0" y="197" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="764" y="162" width="64" height="52" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/><text x="796.0" y="197" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="828" y="162" width="64" height="52" fill="#fed7aa" stroke="#ffffff" stroke-width="2"/><text x="860.0" y="197" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="700" y="214" width="64" height="52" fill="#e5e7eb" stroke="#ffffff" stroke-width="2"/><text x="732.0" y="249" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="764" y="214" width="64" height="52" fill="#e5e7eb" stroke="#ffffff" stroke-width="2"/><text x="796.0" y="249" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="828" y="214" width="64" height="52" fill="#e5e7eb" stroke="#ffffff" stroke-width="2"/><text x="860.0" y="249" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="922" y="110" width="64" height="52" fill="#f3f4f6" stroke="#ffffff" stroke-width="2"/><text x="954.0" y="145" font-size="26" text-anchor="middle" fill="#1f2937">1</text><rect x="922" y="162" width="64" height="52" fill="#f3f4f6" stroke="#ffffff" stroke-width="2"/><text x="954.0" y="197" font-size="26" text-anchor="middle" fill="#1f2937">0</text><rect x="922" y="214" width="64" height="52" fill="#fecaca" stroke="#ffffff" stroke-width="2"/><text x="954.0" y="249" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">0</text><text x="1016" y="198.0" font-size="32" text-anchor="middle" fill="#1f2937">=</text><rect x="1046" y="110" width="64" height="52" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="1078.0" y="145" font-size="26" text-anchor="middle" fill="#15803d" font-weight="bold">0</text><rect x="1046" y="162" width="64" height="52" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="1078.0" y="197" font-size="26" text-anchor="middle" fill="#15803d" font-weight="bold">1</text><rect x="1046" y="214" width="64" height="52" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="1078.0" y="249" font-size="26" text-anchor="middle" fill="#15803d" font-weight="bold">0</text><path d="M 860 270 C 860 312, 954 312, 954 274" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#tk)"/><text x="700" y="336" font-size="22" text-anchor="start" fill="#1f2937">cột cam t = (2, 0) nhân với số 0</text><text x="700" y="366" font-size="22" text-anchor="start" fill="#1f2937" font-weight="bold">→ không cộng gì: hướng chỉ bị quay</text><text x="60" y="455" font-size="22" text-anchor="start" fill="#2a78d6">ô xanh: khối quay R</text><text x="330" y="455" font-size="22" text-anchor="start" fill="#c2410c">ô cam: cột tịnh tiến t</text><text x="620" y="455" font-size="22" text-anchor="start" fill="#6b7280">ô xám: hàng 0, 0, 1 giữ số cuối</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình này cho thấy số cuối của vector làm việc gì. Ma trận có khối quay R màu xanh, cột tịnh tiến t màu cam là 2, 0, và hàng dưới 0, 0, 1 màu xám. Bên trái, điểm 1, 0 viết thành 1, 0, 1, cột cam được nhân với số 1, nên 2, 0 được cộng vào, ra 2, 1, 1. Bên phải, hướng 1, 0 viết thành 1, 0, 0, cột cam được nhân với số 0, nên không cộng gì, ra 0, 1, 0. Vậy số cuối giống một công tắc, bằng 1 thì dời, bằng 0 thì chỉ quay."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Hai thứ tự, hai kết quả"
    checks:
      - "np.allclose(alg.homog2(90, 2, 0), [[0, -1, 2], [1, 0, 0], [0, 0, 1]])"
      - "np.allclose(alg.homog2(90, 2, 0) @ [1, 0, 1], [2, 1, 1])"
      - "np.allclose(alg.homog2(90, 0, 0) @ np.array([[1, 0, 2], [0, 1, 0], [0, 0, 1]]) @ [1, 0, 1], [0, 3, 1])"
      - "np.allclose(alg.homog2(90, 0, 0) @ np.array([[1, 0, 2], [0, 1, 0], [0, 0, 1]]), [[0, -1, 0], [1, 0, 2], [0, 0, 1]])"
      - "0 * 1 + (-1) * 0 + 0 * 1 == 0 and 1 * 1 + 0 * 0 + 2 * 1 == 3"
    steps:
      - show: |
          <p><b>Bước 1 —</b> trả lời câu mở đầu: $\mathbf{T}_{WB} = \begin{bmatrix} 0 & -1 & 2 \\ 1 & 0 & 0 \\ 0 & 0 & 1 \end{bmatrix}$ (quay $90^\circ$, dời $(2, 0)$).</p>
        say: "Bước một, trả lời câu mở đầu. Robot quay 90 độ và dời tới 2, 0, nên ma trận có khối quay 0, âm 1, 1, 0 và cột cuối là 2, 0, 1."
      - show: |
          <p><b>Bước 2 —</b> $\mathbf{T}_{WB}(1, 0, 1)^T = (0 + 2,\ 1 + 0,\ 1)^T = \hl{(2, 1, 1)^T}$: vật ở $(2, 1)$ trên bản đồ.</p>
          <div>{{ORDER}}</div>
        focus: [1, 1, 2, 2]
        say: "Bước hai, nhân với vật 1, 0, 1, phần quay cho 0, 1, cộng thêm 2, 0, ta được 2, 1. Vậy vật ở điểm 2, 1 trên bản đồ, chính là đường màu xanh trên hình, quay trước rồi tịnh tiến. Đường màu cam làm ngược lại, tịnh tiến trước tới 3, 0, rồi mới quay, nên ra 0, 3. Hai bước tiếp theo tính đường cam bằng ma trận."
      - clear: true
        show: |
          <p><b>Bước 3 —</b> tịnh tiến trước rồi quay là tích $\mathbf{R}\,\mathbf{D}$ với $\mathbf{D}$ là ma trận dời $(2, 0)$:</p>
          <p>$$\begin{bmatrix} 0 & -1 & 0 \\ 1 & 0 & 0 \\ 0 & 0 & 1 \end{bmatrix}\begin{bmatrix} 1 & 0 & 2 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{bmatrix} = \begin{bmatrix} 0 & -1 & 0 \\ 1 & 0 & 2 \\ 0 & 0 & 1 \end{bmatrix}$$</p>
        focus: [1, 2]
        say: "Bước ba, tịnh tiến trước rồi quay ứng với tích R nhân D, trong đó D là ma trận dời 2, 0. Nhân ra, cột cuối thành 0, 2, 1, vì phép dời cũng bị quay theo."
      - show: |
          <p><b>Bước 4 —</b> nhân với $(1, 0, 1)^T$: hàng trên $0 - 0 + 0 = 0$, hàng giữa $1 + 0 + 2 = 3$, nên $(1, 0) \to \hl{(0, 3)}$.</p>
          <div class="box key">Đọc chuỗi biến đổi <b>từ phải sang trái</b>: ma trận sát điểm tác động trước. Đổi thứ tự là đổi kết quả.</div>
        focus: [1, 1, 2, 2]
        say: "Bước bốn, nhân ma trận tích với 1, 0, 1. Hàng trên cho 0, hàng giữa cho 1 cộng 2 bằng 3, nên điểm 1, 0 đi tới 0, 3. Hãy đọc chuỗi biến đổi từ phải sang trái, ma trận sát điểm tác động trước. Đổi thứ tự là đổi kết quả."

  - id: check
    kind: check
    title: "Tự kiểm: làm từng phép, không dùng ma trận"
    checks:
      - "np.allclose(alg.rot2(90) @ [1, 0] + [2, 0], [2, 1]) and math.dist((2, 0), (2, 1)) == 1"
      - "np.allclose(alg.rot2(90) @ (np.array([1, 0]) + [2, 0]), [0, 3]) and math.dist((0, 0), (0, 3)) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>thứ tự</th><th>làm từng phép</th><th>kết quả</th><th>kiểm khoảng cách</th></tr>
          <tr><td>quay rồi dời</td><td>$\mathbf{R}(90^\circ)(1, 0)^T = (0, 1)^T$; cộng $(2, 0)^T$</td><td>$(2, 1)$ ✓</td><td>cách robot ở $(2, 0)$ đúng 1</td></tr>
          <tr><td>dời rồi quay</td><td>$(1, 0)^T + (2, 0)^T = (3, 0)^T$; quay $90^\circ$</td><td>$(0, 3)$ ✓</td><td>cách gốc đúng 3, như $(3, 0)$</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Để tự kiểm, ta bỏ ma trận đi và làm từng phép một. Quay rồi dời, quay 1, 0 đi 90 độ được 0, 1, cộng 2, 0 được 2, 1, khớp với ma trận. Kiểm thêm khoảng cách, vật cách robot 1 mét, và điểm 2, 1 cách vị trí robot 2, 0 đúng 1. Dời rồi quay, 1, 0 cộng 2, 0 được 3, 0, quay 90 độ thành 0, 3, khớp với tích R nhân D. Phép quay quanh gốc giữ khoảng cách tới gốc, nên 0, 3 vẫn cách gốc đúng 3 như 3, 0."

  # ───────────────────────── 4. CHUỖI KHUNG ─────────────────────────
  - id: chain
    kind: concept
    title: "Chuỗi khung và nghịch đảo"
    checks:
      - "np.allclose(alg.homog2(90, 2, 0) @ alg.homog2(0, 0.5, 0) @ [1, 0, 1], [2, 1.5, 1])"
      - "np.allclose(alg.homog2(0, 0.5, 0) @ [1, 0, 1], [1.5, 0, 1])"
      - "np.allclose(np.linalg.inv(alg.homog2(90, 2, 0)), [[0, 1, 0], [-1, 0, 2], [0, 0, 1]])"
      - "np.allclose(np.linalg.inv(alg.homog2(90, 2, 0)) @ [2, 1, 1], [1, 0, 1])"
      - "all(np.allclose(np.linalg.inv(alg.homog2(t, a, b))[:2, :2], alg.rot2(t).T) and np.allclose(np.linalg.inv(alg.homog2(t, a, b))[:2, 2], -alg.rot2(t).T @ [a, b]) for t, a, b in ((30, 1, 2), (90, 2, 0), (200, -3, 5)))"
    steps:
      - show: |
          <p>Camera gắn trên robot, cách tâm robot $0{,}5$ về phía trước, cùng hướng: $\mathbf{T}_{BC}$ = dời $(0{,}5;\ 0)$.</p>
          <p>Vật ở $(1, 0)$ trong khung camera C. Ghép: $\mathbf{T}_{WC} = \mathbf{T}_{WB}\,\mathbf{T}_{BC}$ — hai chữ B kề nhau nối khung.</p>
          <p>C sang B: $(1{,}5;\ 0)$; B sang W: $\mathbf{R}(90^\circ)(1{,}5;\ 0)^T + (2, 0)^T = \hl{(2;\ 1{,}5)}$.</p>
        focus: [1, 1, 2, 2, 3, 3]
        say: "Bây giờ thêm một khâu. Camera gắn trên robot, cách tâm robot 0 phẩy 5 về phía trước, cùng hướng. Vật nằm ở 1, 0 trong khung camera C. Ta ghép T W C bằng T W B nhân T B C, hai chữ B đứng kề nhau nối hai khung lại. Từ C sang B, vật ở 1 phẩy 5, 0. Từ B sang W, quay 90 độ được 0, 1 phẩy 5, cộng 2, 0, ra 2, 1 phẩy 5."
      - show: |
          <p>Đi ngược, từ W về B, cần $\mathbf{T}_{BW} = \mathbf{T}_{WB}^{-1}$. Từ $\mathbf{p}_W = \mathbf{R}\,\mathbf{p}_B + \mathbf{t}$, chuyển vế rồi nhân $\mathbf{R}^T$:</p>
          <p>$\mathbf{p}_B = \mathbf{R}^T\mathbf{p}_W - \mathbf{R}^T\mathbf{t}$, nên $$\mathbf{T}^{-1} = \begin{bmatrix} \mathbf{R}^T & -\mathbf{R}^T\mathbf{t} \\ 0\ \ 0 & 1 \end{bmatrix}$$</p>
          <p>Thử: $\mathbf{T}_{WB}^{-1} = \begin{bmatrix} 0 & 1 & 0 \\ -1 & 0 & 2 \\ 0 & 0 & 1 \end{bmatrix}$ đưa $(2, 1)$ về $\hl{(1, 0)}$ — đúng vật lúc đầu.</p>
        focus: [1, 1, 2, 3]
        say: "Muốn đi ngược từ bản đồ về khung robot, ta cần nghịch đảo của T. Từ p W bằng R nhân p B cộng t, ta chuyển t sang vế trái, rồi nhân hai vế với R chuyển vị, vì R chuyển vị nhân R bằng ma trận đơn vị. Kết quả, khối quay của nghịch đảo là R chuyển vị, còn cột cuối là âm R chuyển vị nhân t. Làm thử ngay bằng số, ma trận nghịch đảo đưa điểm 2, 1 về đúng 1, 0, chính là vật lúc đầu."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "not np.allclose(alg.homog2(90, 2, 0) @ [1, 0, 1], alg.homog2(90, 0, 0) @ np.array([[1, 0, 2], [0, 1, 0], [0, 0, 1]]) @ [1, 0, 1])"
      - "np.allclose(alg.homog2(90, 2, 0) @ [1, 0, 0], [0, 1, 0]) and np.allclose(alg.homog2(90, 2, 0) @ [1, 0, 1], [2, 1, 1])"
      - "not np.allclose(alg.homog2(90, 2, 0).T, np.linalg.inv(alg.homog2(90, 2, 0)))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đọc chuỗi từ trái sang phải <b class="red">(sai)</b>
          <br><span class="note">Nhân ma trận không giao hoán. Trong $\mathbf{A}\mathbf{B}\mathbf{p}$, $\mathbf{B}$ tác động trước.</span></div>
        say: "Lỗi thứ nhất, đọc chuỗi biến đổi từ trái sang phải. Nhân ma trận không giao hoán, và trong A nhân B nhân p thì B tác động trước."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cho hướng toạ độ cuối bằng 1 <b class="red">(sai)</b>
          <br><span class="note">Trục $(1, 0)$ của robot trên bản đồ là $(0, 1)$, không phải $(2, 1)$. Hướng không bị dời: dùng số 0.</span></div>
          <table class="t"><tr><th>viết trục phía trước</th><th>$\mathbf{T}_{WB}$ nhân ra</th><th>nghĩa</th></tr>
          <tr><td>$(1, 0, 1)^T$ (sai)</td><td>$(2, 1, 1)^T$</td><td>một điểm, không phải hướng</td></tr>
          <tr><td>$(1, 0, 0)^T$ (đúng)</td><td>$(0, 1, 0)^T$</td><td>hướng $(0, 1)$ ✓</td></tr></table>
        focus: [1, 2, 1]
        say: "Lỗi thứ hai, viết một hướng với toạ độ cuối bằng 1. Trục phía trước của robot, nhìn trên bản đồ, là 0, 1, chứ không phải 2, 1. Hướng không bị dời, nên toạ độ cuối phải là 0."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lấy nghịch đảo của $\mathbf{T}$ bằng chuyển vị <b class="red">(sai)</b>
          <br><span class="note">Chỉ khối $\mathbf{R}$ có nghịch đảo bằng chuyển vị. Cột cuối phải là $-\mathbf{R}^T\mathbf{t}$.</span></div>
        say: "Lỗi thứ ba, lấy nghịch đảo của cả ma trận T bằng chuyển vị. Chỉ khối R mới có nghịch đảo bằng chuyển vị, còn cột cuối phải là âm R chuyển vị nhân t."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Ghép hai khung không nối nhau <b class="red">(sai)</b>
          <br><span class="note">$\mathbf{T}_{WB}\mathbf{T}_{CB}$ vô nghĩa: hai chữ ở giữa phải trùng nhau, như $\mathbf{T}_{WB}\mathbf{T}_{BC}$.</span></div>
        say: "Lỗi thứ tư, ghép hai ma trận mà khung không nối nhau. T W B nhân T C B là vô nghĩa, hai chữ ở giữa phải trùng nhau, như T W B nhân T B C."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "np.allclose(alg.homog2(90, 1, 1) @ [2, 0, 1], [1, 3, 1])"
      - "np.allclose(np.linalg.inv(alg.homog2(90, 1, 1)) @ [1, 1, 1], [0, 0, 1])"
      - "np.allclose(alg.homog2(90, 1, 1) @ [1, 0, 0], [0, 1, 0])"
      - "np.allclose(alg.homog2(90, 1, 1), [[0, -1, 1], [1, 0, 1], [0, 0, 1]]) and np.allclose(alg.homog2(90, 1, 1) @ [0, 0, 1], [1, 1, 1]) and np.allclose(alg.rot2(90) @ [2, 0], [0, 2])"
    steps:
      - show: |
          <p>$\mathbf{T}$: quay $90^\circ$ rồi dời $(1, 1)$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$\mathbf{T}$ đưa điểm $(2, 0)$ tới đâu?</td></tr>
          <tr><td>2</td><td>$\mathbf{T}^{-1}$ đưa điểm $(1, 1)$ tới đâu? Vì sao không cần tính?</td></tr>
          <tr><td>3</td><td>$\mathbf{T}$ đưa hướng $(1, 0)$ tới đâu?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm, với T là quay 90 độ rồi dời 1, 1. Câu một, T đưa điểm 2, 0 tới đâu? Câu hai, nghịch đảo của T đưa điểm 1, 1 tới đâu, và vì sao không cần tính? Câu ba, T đưa hướng 1, 0 tới đâu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $\mathbf{T} = \begin{bmatrix} 0 & -1 & 1 \\ 1 & 0 & 1 \\ 0 & 0 & 1 \end{bmatrix}$. Quay: $\mathbf{R}(90^\circ)(2, 0)^T = (0, 2)^T$; dời: $(0 + 1;\ 2 + 1) = \hl{(1, 3)}$.</p>
        say: "Đáp án câu một, ma trận T có khối quay 90 độ và cột cuối 1, 1, 1. Quay điểm 2, 0 đi 90 độ được 0, 2, rồi dời thêm 1, 1 được 1, 3."
      - show: |
          <p>② $\hl{(0, 0)}$: $\mathbf{T}(0, 0, 1)^T = (1, 1, 1)^T$ — gốc tới $(1, 1)$ — nên đi ngược thì $(1, 1)$ về gốc.</p>
        say: "Câu hai, kết quả là gốc 0, 0. Vì T đưa gốc tới 1, 1, nên đi ngược thì 1, 1 về gốc. Nhân T với 0, 0, 1 chỉ còn lại cột cuối, đúng là 1, 1, 1."
      - show: |
          <p>③ Hướng viết $(1, 0, 0)^T$, số cuối 0 nên cột dời không tác dụng: $\mathbf{T}(1, 0, 0)^T = \hl{(0, 1, 0)^T}$.</p>
        say: "Câu ba, hướng viết với số cuối bằng 0, nên cột dời không có tác dụng, hướng chỉ bị quay và được 0, 1."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">thêm số 1</span><span class="a">→</span>
          <span class="n">$\mathbf{T} = [\mathbf{R}\ \ \mathbf{t}]$</span><span class="a">→</span>
          <span class="n">$\mathbf{T}_{WC} = \mathbf{T}_{WB}\mathbf{T}_{BC}$</span><span class="a">→</span>
          <span class="n">nghịch đảo: $\mathbf{R}^T$ và $-\mathbf{R}^T\mathbf{t}$</span></div>
        say: "Tổng kết lại, thêm toạ độ thứ ba bằng 1 thì quay và tịnh tiến gộp được thành một ma trận T. Ghép một chuỗi khung chỉ là nhân các T, sao cho chữ ở giữa trùng nhau. Nghịch đảo của T có khối R chuyển vị và cột cuối âm R chuyển vị nhân t."
      - show: |
          <div class="box key"><b>Tư duy:</b> đặt tên mỗi ma trận theo cặp khung. Khi chữ ở giữa không khớp, phép tính sai ngay trên giấy, trước khi chạy máy.</div>
        say: "Điều cần mang theo, hãy đặt tên mỗi ma trận theo cặp khung của nó. Khi chữ ở giữa không khớp, bạn thấy lỗi ngay trên giấy, trước khi chạy máy."
      - show: |
          <p class="note">Trong 3D: cùng cấu trúc, ma trận $4 \times 4$ với khối $\mathbf{R}$ cỡ $3 \times 3$ và cột $\mathbf{t}$ ba số.</p>
        say: "Trong không gian ba chiều, cấu trúc y hệt, chỉ là ma trận bốn nhân bốn, với khối quay ba nhân ba và cột tịnh tiến ba số."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>động học thuận</b> của tay máy hai khâu — từ góc khớp ra vị trí đầu tay.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học động học thuận của tay máy hai khâu, tính vị trí đầu tay từ các góc khớp. Hẹn gặp bạn ở bài tiếp theo."
