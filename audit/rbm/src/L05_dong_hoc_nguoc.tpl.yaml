scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Muốn kẹp ở đây thì đặt góc bao nhiêu?"
    steps:
      - show: |
          <p>Bài 4: biết góc khớp, tính đầu tay — một phép tính thẳng.</p>
          <p>Thực tế thường ngược lại: camera thấy vật ở $(0{,}866;\ 1{,}5)$, ta phải <b>chọn</b> $\theta_1$, $\theta_2$ để đầu tay tới đó.</p>
          <div class="box key">Hôm nay: <b>động học ngược</b> — có khi hai đáp án, có khi không đáp án nào.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, ở bài 4 ta biết góc khớp và tính ra đầu tay, đó là một phép tính thẳng. Nhưng thực tế thường ngược lại. Camera thấy vật ở 0 phẩy 866 và 1 phẩy 5, và ta phải chọn theta 1, theta 2 để đầu tay tới đúng chỗ đó. Hôm nay ta học động học ngược, bài toán có khi có hai đáp án, có khi không có đáp án nào."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chuyển vế, và hai góc cùng một cos"
    checks:
      - "Fraction(3 - 1 - 1, 2) == Fraction(1, 2) and 1 + 1 + 2 * Fraction(1, 2) == 3"
      - "abs(math.cos(math.radians(60)) - 0.5) < 1e-12 and abs(math.cos(math.radians(-60)) - 0.5) < 1e-12"
      - "abs(math.sin(math.radians(60)) - 3 ** 0.5 / 2) < 1e-12 and abs(math.sin(math.radians(-60)) + 3 ** 0.5 / 2) < 1e-12"
    steps:
      - show: |
          <p>Chuyển vế để tìm ẩn: từ $3 = 1 + 1 + 2c$, trừ hai vế cho $1 + 1$ rồi chia cho 2:</p>
          <p>$$c = \frac{3 - 1 - 1}{2} = \frac{1}{2} = 0{,}5$$</p>
          <p class="note">Làm thử ngược: $1 + 1 + 2 \cdot 0{,}5 = 3$ ✓</p>
        focus: [1, 1, 2, 3]
        say: "Trước khi vào bài, ta ôn hai điều. Điều thứ nhất là chuyển vế để tìm ẩn, từ 3 bằng 1 cộng 1 cộng 2 c, ta trừ hai vế cho 1 cộng 1, rồi chia cho 2. Được c bằng 3 trừ 1 trừ 1, chia 2, bằng 0 phẩy 5. Làm thử ngược, 1 cộng 1 cộng 2 nhân 0 phẩy 5 đúng bằng 3."
      - show: |
          <table class="t"><tr><th>góc</th><th>cos</th><th>sin</th></tr>
          <tr><td>$60^\circ$</td><td>0,5</td><td>0,866</td></tr>
          <tr><td>$-60^\circ$</td><td>0,5</td><td>$-0{,}866$</td></tr></table>
          <p>Biết $\cos\theta = 0{,}5$ chưa đủ để biết $\theta$: có <b>hai</b> góc đối nhau. Và vì $\cos$ luôn nằm giữa $-1$ và $1$, đòi $\cos\theta = 2$ là vô nghiệm.</p>
        focus: [1, 1, 2, 2]
        say: "Điều thứ hai, góc 60 độ và góc âm 60 độ có cùng cos bằng 0 phẩy 5, chỉ khác dấu của sin. Một mũi tên lật xuống dưới trục ngang có cùng bóng trên trục ngang với mũi tên ở trên. Vì vậy biết cos theta bằng 0 phẩy 5 thì có hai góc đối nhau. Còn cos luôn nằm giữa âm 1 và 1, nên đòi cos bằng 2 là vô nghiệm, hai ý này chính là hai nghiệm và vô nghiệm của bài hôm nay."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: atan2"
    checks:
      - "math.degrees(math.atan(-1 / -1)) == 45 and math.degrees(math.atan2(-1, -1)) == -135"
      - "math.degrees(math.atan2(1, 1)) == 45 and abs(math.degrees(math.atan2(1.5, 3 ** 0.5 / 2)) - 60) < 1e-9"
    steps:
      - show: |
          <p>$\operatorname{atan2}(y, x)$: góc từ trục $x$ tới điểm $(x, y)$, trong khoảng $-180^\circ$ đến $180^\circ$.</p>
          <p>Vì sao không dùng $\arctan(y/x)$? Phép chia làm mất dấu: điểm $(-1, -1)$ có $y/x = 1$, nên $\arctan$ cho $45^\circ$, trong khi góc thật là $-135^\circ$.</p>
          <div class="box key">$\operatorname{atan2}$ nhận riêng $y$ và $x$, nên biết điểm ở góc phần tư nào: $\operatorname{atan2}(-1, -1) = -135^\circ$.</div>
        introduces: [atan2, arctan]
        focus: [1, 1, 2, 2, 3]
        say: "Trước hết, một công cụ mới tên là a-tan 2 của y và x. Nó cho góc từ trục x tới điểm x, y, trong khoảng từ âm 180 độ đến 180 độ. Vì sao không dùng a-tan của y chia x? Vì phép chia làm mất dấu, điểm âm 1, âm 1 có y chia x bằng 1, nên a-tan cho 45 độ, trong khi góc thật là âm 135 độ. Hàm a-tan 2 nhận riêng y và x, nên biết điểm nằm ở góc phần tư nào."

  - id: intuition
    kind: intuition
    title: "Hình dung: hướng đích trừ góc lệch"
    checks:
      - "abs(math.degrees(math.atan2(1.5, 3 ** 0.5 / 2)) - 60) < 1e-9 and abs(math.degrees(math.atan2(math.sin(math.radians(60)), 1 + math.cos(math.radians(60)))) - 30) < 1e-9 and 60 - 30 == 30"
      - "np.allclose(alg.fk2(1, 1, 30, 60)[1], (3 ** 0.5 / 2, 1.5))"
    steps:
      - show: |
          <div><svg width="1320" height="460" viewBox="0 0 1320 460"><defs><marker id="ik" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><line x1="110.0" y1="440.0" x2="635.0" y2="440.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ik)"/><line x1="160.0" y1="465.0" x2="160.0" y2="2.5" stroke="#6b7280" stroke-width="2" marker-end="url(#ik)"/><line x1="160.0" y1="440.0" x2="393.8" y2="35.0" stroke="#15803d" stroke-width="3" stroke-dasharray="10 7"/><line x1="160.0" y1="440.0" x2="376.5" y2="315.0" stroke="#2a78d6" stroke-width="7"/><line x1="376.5" y1="315.0" x2="376.5" y2="65.0" stroke="#eb6834" stroke-width="7"/><circle cx="376.5" cy="65.0" r="10" fill="#15803d"/><text x="393" y="71" font-size="22" text-anchor="start" fill="#15803d" font-weight="bold">đích (0,866; 1,5)</text><circle cx="376.5" cy="315.0" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><polyline points="250.0,440.0 249.9,436.9 249.8,433.7 249.5,430.6 249.1,427.5 248.6,424.4 248.0,421.3 247.3,418.2 246.5,415.2 245.6,412.2 244.6,409.2 243.4,406.3 242.2,403.4 240.9,400.5 239.5,397.7 237.9,395.0" fill="none" stroke="#2a78d6" stroke-width="3"/><polyline points="281.2,370.0 278.7,365.8 276.1,361.7 273.3,357.7 270.3,353.8 267.2,350.0 264.0,346.3 260.7,342.7 257.3,339.3 253.7,336.0 250.0,332.8 246.2,329.7 242.3,326.7 238.3,323.9 234.2,321.3 230.0,318.8" fill="none" stroke="#b91c1c" stroke-width="3"/><text x="258" y="426" font-size="22" text-anchor="start" fill="#2a78d6" font-weight="bold">θ₁ = 30°</text><text x="204" y="276" font-size="22" text-anchor="end" fill="#b91c1c" font-weight="bold">góc lệch 30°</text><text x="296" y="180" font-size="22" text-anchor="end" fill="#15803d" font-weight="bold">hướng đích 60°</text><text x="391" y="351" font-size="22" text-anchor="start" fill="#2a78d6">khâu 1</text><text x="391" y="190" font-size="22" text-anchor="start" fill="#eb6834">khâu 2 (θ₂ = 60°)</text><text x="740" y="100" font-size="24" text-anchor="start" fill="#eb6834" font-weight="bold">Bước 1: khoảng cách tới đích → cos θ₂</text><text x="740" y="154" font-size="24" text-anchor="start" fill="#1f2937" font-weight="bold">Bước 2: θ₁ = hướng đích − góc lệch</text><text x="740" y="208" font-size="24" text-anchor="start" fill="#15803d">hướng đích = atan2(y, x) = 60° (nét đứt xanh lá)</text><text x="740" y="262" font-size="24" text-anchor="start" fill="#b91c1c">góc lệch = góc giữa khâu 1 và nét đứt,</text><text x="740" y="316" font-size="24" text-anchor="start" fill="#b91c1c">sinh ra vì khâu 2 bẻ cong = 30°</text><text x="740" y="370" font-size="24" text-anchor="start" fill="#2a78d6" font-weight="bold">θ₁ = 60° − 30° = 30°</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình này cho thấy cách giải trước khi viết công thức. Đường nét đứt xanh lá nối gốc với đích, và hướng của nó, 60 độ, đo được ngay bằng a-tan 2. Khâu 1 không nằm trên đường đó, vì khâu 2 bẻ cong một góc, nên khâu 1 lệch khỏi hướng đích một góc lệch, ở đây là 30 độ. Vì vậy theta 1 bằng hướng đích trừ góc lệch, 60 trừ 30, bằng 30 độ. Còn theta 2 thì tìm trước, chỉ từ khoảng cách giữa gốc và đích."

  # ───────────────────────── 3. CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Giải từng bước: θ₂ trước, θ₁ sau"
    checks:
      - "all(any(np.allclose(alg.fk2(1.5, 1, *s)[1], (x, y)) for s in alg.ik2(1.5, 1, x, y)) and len(alg.ik2(1.5, 1, x, y)) == 2 for x, y in ((1, 1), (-1.2, 0.7), (0.3, -2.1), (2.0, 0.1)))"
    steps:
      - show: |
          <p><b>Bước 1</b> — $\theta_2$ từ khoảng cách. Theo định lý cos ở bài 4, $x^2 + y^2 = L_1^2 + L_2^2 + 2L_1L_2\cos\theta_2$, chuyển vế:</p>
          <p>$$c = \cos\theta_2 = \dfrac{x^2 + y^2 - L_1^2 - L_2^2}{2L_1L_2}$$</p>
          <p>Nếu $\lvert c \rvert \le 1$: hai góc $\theta_2 = \pm$ (góc có cos bằng $c$). Nếu $\lvert c \rvert > 1$: <b>vô nghiệm</b>.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Bước một, tìm theta 2 từ khoảng cách. Theo định lý cos ở bài 4, x bình phương cộng y bình phương bằng L 1 bình phương cộng L 2 bình phương cộng 2 L 1 L 2 cos theta 2. Chuyển vế, ta được cos theta 2, gọi là c, bằng phân số này. Nếu trị tuyệt đối của c không quá 1, có hai góc theta 2 đối nhau cùng có cos bằng c. Nếu trị tuyệt đối của c lớn hơn 1 thì không có góc nào, bài toán vô nghiệm."
      - show: |
          <p><b>Bước 2</b> — $\theta_1$ từ hướng. Đầu tay nằm ở hướng $\operatorname{atan2}(y, x)$. Nhưng khâu 1 lệch khỏi hướng đó một góc, vì khâu 2 bẻ cong:</p>
          <p>$$\theta_1 = \operatorname{atan2}(y, x) - \operatorname{atan2}(L_2\sin\theta_2,\ L_1 + L_2\cos\theta_2)$$</p>
          <p class="note">Góc trừ đi là hướng của đầu tay nhìn trong khung khâu 1: đi $L_1$ dọc khâu, rồi $L_2$ theo hướng $\theta_2$.</p>
        focus: [1, 1, 1, 2, 3]
        say: "Bước hai, tìm theta 1 từ hướng. Đầu tay nằm theo hướng a-tan 2 của y và x. Nhưng khâu 1 lệch khỏi hướng đó một góc, vì khâu 2 bẻ cong. Nên theta 1 bằng hướng của đích trừ đi góc lệch này. Góc lệch chính là hướng của đầu tay nhìn trong khung khâu 1, đi L 1 dọc khâu rồi đi L 2 theo hướng theta 2."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Đích (0,866; 1,5), L₁ = L₂ = 1"
    checks:
      - "abs((3 - 1 - 1) / 2 - 0.5) < 1e-12 and abs(0.75 + 2.25 - 3) < 1e-12"
      - "alg.ik2(1, 1, 3 ** 0.5 / 2, 1.5) == [(30.0, 60.0), (90.0, -60.0)]"
      - "abs(math.degrees(math.atan2(math.sin(math.radians(60)), 1 + math.cos(math.radians(60)))) - 30) < 1e-9"
      - "all(np.allclose(alg.fk2(1, 1, *s)[1], (3 ** 0.5 / 2, 1.5)) for s in alg.ik2(1, 1, 3 ** 0.5 / 2, 1.5))"
      - "np.allclose(3 ** 0.5 * np.array([0.5, 3 ** 0.5 / 2]), [3 ** 0.5 / 2, 1.5]) and abs(math.degrees(math.atan2(-(3 ** 0.5) / 2, 1.5)) + 30) < 1e-9 and 60 - (-30) == 90"
      - "round(0.866 ** 2, 2) == 0.75 and 1.5 ** 2 == 2.25"
    steps:
      - show: |
          <p><b>Bước 1 —</b> $x^2 + y^2 = 0{,}75 + 2{,}25 = 3$, nên $$c = \dfrac{3 - 1 - 1}{2} = 0{,}5, \quad \theta_2 = \pm 60^\circ$$</p>
        say: "Làm thử với đích 0 phẩy 866, 1 phẩy 5 và hai khâu dài 1. Bước một, 0 phẩy 866 bình phương là 0 phẩy 75, 1 phẩy 5 bình phương là 2 phẩy 25. Tổng bình phương bằng 3, nên c bằng 3 trừ 1 trừ 1, chia 2, bằng 0 phẩy 5, và theta 2 bằng cộng hoặc trừ 60 độ."
      - show: |
          <p><b>Bước 2 —</b> hướng đích: $(0{,}866;\ 1{,}5) = \sqrt{3} \cdot (0{,}5;\ 0{,}866)$, nên $\operatorname{atan2}(1{,}5;\ 0{,}866) = 60^\circ$.</p>
        say: "Bước hai, hướng của đích là 60 độ, vì điểm 0 phẩy 866, 1 phẩy 5 bằng căn 3 nhân với cos 60 độ, sin 60 độ, tức nằm đúng trên tia 60 độ."
      - show: |
          <p><b>Bước 3 —</b> $\theta_2 = 60^\circ$: góc lệch $\operatorname{atan2}(\sin 60^\circ;\ 1 + \cos 60^\circ) = \operatorname{atan2}(0{,}866;\ 1{,}5) = 30^\circ$, nên $\theta_1 = 60^\circ - 30^\circ = \hl{30^\circ}$.</p>
        say: "Bước ba, xét theta 2 bằng 60 độ, góc lệch là a-tan 2 của sin 60 độ và 1 cộng cos 60 độ, tức của 0 phẩy 866 và 1 phẩy 5, bằng 30 độ. Vậy theta 1 bằng 60 trừ 30, bằng 30 độ, đúng đáp án của bài 4."
      - show: |
          <p><b>Bước 4 —</b> $\theta_2 = -60^\circ$: góc lệch $\operatorname{atan2}(-0{,}866;\ 1{,}5) = -30^\circ$, nên $\theta_1 = 60^\circ - (-30^\circ) = \hl{90^\circ}$.</p>
        say: "Bước bốn, sin của âm 60 độ đổi dấu, nên góc lệch cũng đổi dấu. Với theta 2 bằng âm 60 độ, góc lệch là âm 30 độ, nên theta 1 bằng 90 độ. Đó là vì 60 trừ đi âm 30 cũng là 60 cộng 30, bằng 90."
      - clear: true
        show: |
          <div>{{IK}}</div>
          <p>Hai tư thế $(30^\circ, 60^\circ)$ và $(90^\circ, -60^\circ)$ đối xứng qua đường nối gốc với đích. Động học thuận của bài 4 xác nhận cả hai cùng tới đích.</p>
        focus: [1, 2, 2]
        say: "Trên hình là hai tư thế, 30 độ, 60 độ màu xanh và 90 độ, âm 60 độ màu cam. Chúng đối xứng nhau qua đường nối gốc với đích. Thay ngược vào công thức động học thuận của bài 4, cả hai đều tới đúng đích."

  - id: check
    kind: check
    title: "Tự kiểm: thay ngược vào động học thuận"
    checks:
      - "np.allclose(alg.fk2(1, 1, 30, 60)[0], (3 ** 0.5 / 2, 0.5)) and np.allclose(alg.fk2(1, 1, 30, 60)[1], (3 ** 0.5 / 2, 1.5))"
      - "np.allclose(alg.fk2(1, 1, 90, -60)[0], (0, 1)) and np.allclose(alg.fk2(1, 1, 90, -60)[1], (3 ** 0.5 / 2, 1.5)) and 90 - 60 == 30"
    steps:
      - show: |
          <table class="t"><tr><th>nghiệm $(\theta_1, \theta_2)$</th><th>khuỷu</th><th>hướng khâu 2</th><th>đầu tay = khuỷu + khâu 2</th></tr>
          <tr><td>$(30^\circ, 60^\circ)$</td><td>$(0{,}866;\ 0{,}5)$</td><td>$30^\circ + 60^\circ = 90^\circ$: $(0;\ 1)$</td><td>$(0{,}866;\ 1{,}5)$ ✓</td></tr>
          <tr><td>$(90^\circ, -60^\circ)$</td><td>$(0;\ 1)$</td><td>$90^\circ - 60^\circ = 30^\circ$: $(0{,}866;\ 0{,}5)$</td><td>$(0{,}866;\ 1{,}5)$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Để tự kiểm, ta đi đường ngược lại, thay từng nghiệm vào động học thuận của bài 4. Nghiệm 30 độ, 60 độ cho khuỷu ở 0 phẩy 866, 0 phẩy 5, khâu 2 hướng 90 độ đi thẳng lên 1, nên đầu tay ở 0 phẩy 866, 1 phẩy 5. Nghiệm 90 độ, âm 60 độ cho khuỷu ở 0, 1, khâu 2 hướng 30 độ góp 0 phẩy 866 và 0 phẩy 5, cộng lại cũng ra 0 phẩy 866, 1 phẩy 5. Cả hai nghiệm đưa đầu tay về đúng đích, nên phép giải đúng."

  # ───────────────────────── 5. VÔ NGHIỆM ─────────────────────────
  - id: reach
    kind: concept
    title: "Khi nào vô nghiệm, khi nào một nghiệm"
    checks:
      - "alg.ik2(2, 1, 4, 0) == [] and abs((16 - 4 - 1) / 4 - 2.75) < 1e-12"
      - "alg.ik2(2, 1, 0.5, 0) == [] and abs((0.25 - 4 - 1) / 4 + 1.1875) < 1e-12"
      - "alg.ik2(2, 1, 3, 0) == [(0.0, 0.0)]"
      - "all((len(alg.ik2(2, 1, r, 0)) > 0) == (1 - 1e-12 <= r <= 3 + 1e-12) for r in [k / 10 for k in range(0, 41)])"
    steps:
      - show: |
          <div>{{REACH}}</div>
          <p>$L_1 = 2$, $L_2 = 1$: với tới được vành khuyên $1 \le r \le 3$ (bài 4: $\lvert L_1 - L_2 \rvert \le r \le L_1 + L_2$).</p>
        focus: [1, 2, 2]
        say: "Bây giờ lấy khâu 1 dài 2, khâu 2 dài 1. Theo bài 4, khoảng cách tới gốc nằm từ trị tuyệt đối của hiệu hai khâu đến tổng hai khâu, tức từ 1 đến 3. Vùng với tới được là vành khuyên tô xanh trên hình."
      - clear: true
        show: |
          <p>Đích $(4, 0)$: $c = \dfrac{16 - 4 - 1}{4} = 2{,}75 > 1$ — ngoài tầm. Đích $(0{,}5;\ 0)$: $c = -1{,}1875 < -1$ — lọt vào lỗ giữa.</p>
          <p>Đích $(3, 0)$ ngay mép ngoài: $c = 1$, chỉ <b>một</b> nghiệm $(0^\circ, 0^\circ)$ — tay duỗi thẳng.</p>
          <div class="box key">Bước 1 tự báo vô nghiệm qua $\lvert c \rvert > 1$. Chương trình phải kiểm điều này, không được đưa thẳng $c$ vào hàm tìm góc.</div>
        focus: [1, 1, 2, 3, 3]
        say: "Đích 4, 0 cho c bằng 2 phẩy 75, lớn hơn 1, tức nằm ngoài tầm với. Đích 0 phẩy 5, 0 cho c bằng âm 1 phẩy 1875, nhỏ hơn âm 1, tức lọt vào lỗ ở giữa. Đích 3, 0 ngay mép ngoài cho c đúng bằng 1, và chỉ có một nghiệm, tay duỗi thẳng. Như vậy bước một tự báo vô nghiệm khi trị tuyệt đối của c lớn hơn 1. Chương trình phải kiểm điều này, không được đưa thẳng c vào hàm tìm góc."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "math.degrees(math.atan(-1 / -1)) == 45 and math.degrees(math.atan2(-1, -1)) == -135"
      - "len(alg.ik2(1, 1, 1, 1)) == 2"
      - "abs(math.degrees(math.atan2(1, 1)) - 45) < 1e-12"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng $\arctan(y/x)$ <b class="red">(sai)</b>
          <br><span class="note">Mất góc phần tư: $(-1, -1)$ cho $45^\circ$ thay vì $-135^\circ$. Dùng $\operatorname{atan2}(y, x)$.</span></div>
          <table class="t"><tr><th>điểm $(-1, -1)$</th><th>tính</th><th>góc</th></tr>
          <tr><td>$\arctan(y/x)$</td><td>$\arctan(1)$</td><td>$45^\circ$ — sai góc phần tư</td></tr>
          <tr><td>$\operatorname{atan2}(y, x)$</td><td>$\operatorname{atan2}(-1, -1)$</td><td>$-135^\circ$ ✓</td></tr></table>
        focus: [1, 2, 1]
        say: "Lỗi thứ nhất, dùng a-tan của y chia x. Cách này mất thông tin góc phần tư, điểm âm 1, âm 1 cho 45 độ thay vì âm 135 độ. Hãy dùng a-tan 2."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chỉ trả một nghiệm <b class="red">(thiếu)</b>
          <br><span class="note">Nghiệm còn lại có thể là nghiệm duy nhất tránh được vật cản, hay gần tư thế hiện tại hơn.</span></div>
        say: "Lỗi thứ hai, chỉ trả về một nghiệm. Nghiệm còn lại có thể là nghiệm duy nhất tránh được vật cản, hoặc gần tư thế hiện tại hơn nên tay đi ít hơn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Không kiểm $\lvert c \rvert \le 1$ <b class="red">(sai)</b>
          <br><span class="note">Đích ngoài tầm cho $c > 1$; hàm tìm góc báo lỗi hoặc trả kết quả vô nghĩa.</span></div>
        say: "Lỗi thứ ba, không kiểm trị tuyệt đối của c có vượt quá 1 không. Đích ngoài tầm cho c lớn hơn 1, và hàm tìm góc sẽ báo lỗi hoặc trả về kết quả vô nghĩa."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin nghiệm mà không kiểm ngược <b class="red">(thiếu)</b>
          <br><span class="note">Thay $(\theta_1, \theta_2)$ vào động học thuận của bài 4: đầu tay phải về đúng đích.</span></div>
        say: "Lỗi thứ tư, tin nghiệm mà không kiểm ngược. Hãy thay hai góc tìm được vào động học thuận của bài 4, đầu tay phải về đúng đích."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.ik2(1, 1, 1, 1) == [(0.0, 90.0), (90.0, -90.0)]"
      - "alg.ik2(1, 1, 0, 2.5) == [] and (6.25 - 2) / 2 > 1"
      - "(2 - 1 - 1) / 2 == 0 and math.degrees(math.atan2(1, 1 + 0)) == 45 and (6.25 - 2) / 2 == 2.125 and 2.5 ** 2 == 6.25"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$L_1 = L_2 = 1$, đích $(1, 1)$: tìm cả hai nghiệm.</td></tr>
          <tr><td>2</td><td>Cùng tay máy, đích $(0;\ 2{,}5)$ có nghiệm không?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hai khâu dài 1, đích là 1, 1, hãy tìm cả hai nghiệm. Câu hai, cũng tay máy đó, đích 0, 2 phẩy 5 có nghiệm không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Bước 1: $x^2 + y^2 = 1 + 1 = 2$, $c = \dfrac{2 - 1 - 1}{2} = 0$, nên $\theta_2 = \pm 90^\circ$. Hướng đích $\operatorname{atan2}(1, 1) = 45^\circ$.</p>
        say: "Đáp án câu một, tổng bình phương bằng 2, nên c bằng 0 và theta 2 bằng cộng hoặc trừ 90 độ. Hướng của đích là 45 độ."
      - show: |
          <p>Bước 2: $\theta_2 = 90^\circ$: lệch $\operatorname{atan2}(1;\ 1 + 0) = 45^\circ$, $\hl{(0^\circ, 90^\circ)}$. $\theta_2 = -90^\circ$: lệch $-45^\circ$, $\hl{(90^\circ, -90^\circ)}$.</p>
        say: "Góc lệch là a-tan 2 của sin theta 2 và 1 cộng cos theta 2, với cos bằng 0 thì đó là a-tan 2 của 1 và 1. Với theta 2 bằng 90 độ, góc lệch là 45 độ, được nghiệm 0 độ, 90 độ, còn với âm 90 độ, được 90 độ, âm 90 độ, đúng tư thế ở câu đố bài 4."
      - show: |
          <p>② $x^2 + y^2 = 6{,}25$, $c = \dfrac{6{,}25 - 2}{2} = 2{,}125 > 1$: <b>vô nghiệm</b>, vì $2{,}5 > L_1 + L_2 = 2$.</p>
        say: "Câu hai, tổng bình phương là 2 phẩy 5 bình phương, bằng 6 phẩy 25. Vậy c bằng 2 phẩy 125, lớn hơn 1, nên vô nghiệm, vì 2 phẩy 5 xa hơn tổng hai khâu."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">khoảng cách → $c = \cos\theta_2$</span><span class="a">→</span>
          <span class="n">$\lvert c \rvert > 1$: vô nghiệm</span><span class="a">→</span>
          <span class="n">$\pm\theta_2$: hai tư thế</span><span class="a">→</span>
          <span class="n">$\theta_1$ bằng hai lần $\operatorname{atan2}$</span></div>
        say: "Tổng kết lại, khoảng cách tới đích cho ta cos theta 2. Nếu trị tuyệt đối của nó lớn hơn 1 thì vô nghiệm. Nếu không, theta 2 có hai giá trị đối nhau, ứng với hai tư thế. Cuối cùng theta 1 bằng hiệu của hai lần a-tan 2."
      - show: |
          <div class="box key"><b>Tư duy:</b> bài toán ngược thường không có đúng một đáp án. Luôn hỏi: có nghiệm không, có mấy nghiệm, chọn nghiệm nào?</div>
        say: "Điều cần mang theo, bài toán ngược thường không có đúng một đáp án. Hãy luôn hỏi ba câu, có nghiệm không, có mấy nghiệm, và chọn nghiệm nào."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>Jacobian vận tốc</b> và điểm kỳ dị — vì sao tay duỗi thẳng thì “kẹt”.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học Jacobian vận tốc và điểm kỳ dị, để hiểu vì sao khi tay duỗi thẳng thì nó bị kẹt một hướng. Hẹn gặp bạn ở bài tiếp theo."
