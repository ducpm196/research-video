# Quy ước như bài 4: θ_2 là góc tương đối; c = cos θ_2. Hai nghiệm gọi theo DẤU của θ_2 (θ_2 > 0, θ_2 < 0), không dùng tên
#   “khuỷu lên / khuỷu xuống” (sách đặt tên ngược nhau). Mọi số do alg.ik2 tính và được kiểm ngược bằng alg.fk2.
objectives:
  - "Giải động học ngược tay máy hai khâu bằng định lý cos và atan2"
  - "Tìm cả hai nghiệm và nhận ra điểm ngoài tầm với"
  - "Biết vì sao dùng atan2 thay cho arctan(y/x)"
