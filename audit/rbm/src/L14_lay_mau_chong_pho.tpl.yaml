id: L14
course: RBM
series: "RBM · Toán cho robot và hệ động lực"
title: "Bài 14 — Lấy mẫu tín hiệu, chồng phổ và biến đổi Fourier rời rạc"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rbm.yaml L14; audit/rbm/verify_rbm.py L14; H. Nyquist (1928), C. E. Shannon (1949); A. V. Oppenheim, R. W. Schafer, Discrete-Time Signal Processing (2010), mục 4.2 và 8.1"
assumes: [arith, cdot, sub, cos, sin, pi, sum, frac, sqrt, approx, implies, dots]
# Quy ước: tần số f đo bằng Hz (lần mỗi giây); tần số lấy mẫu f_s; mẫu x_n = x(n / f_s). Tín hiệu thử dùng cos (với sin, ảnh
#   chồng phổ đổi dấu). Tần số biểu kiến = khoảng cách từ f tới bội gần nhất của f_s, nằm trong [0, f_s/2] (alg.alias_freq).
#   DFT viết bằng cos, sin (tránh lũy thừa phức): |X_k| = căn(tổng cos² + tổng sin²) (alg.dft_mag).
objectives:
  - "Phát biểu định lý lấy mẫu: tần số lấy mẫu phải lớn hơn hai lần tần số cao nhất"
  - "Tính tần số biểu kiến khi chồng phổ"
  - "Đọc biểu đồ |X_k| của biến đổi Fourier rời rạc"
