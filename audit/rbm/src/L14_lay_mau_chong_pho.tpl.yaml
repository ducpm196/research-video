scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bánh xe quay ngược trong video"
    steps:
      - show: |
          <p>Trong phim, bánh xe đang lăn tới đôi khi như quay <b>ngược</b>. Máy quay chỉ chụp 24 khung mỗi giây, bỏ lỡ chuyển động giữa hai khung.</p>
          <p>Cảm biến của robot cũng chỉ đọc vài lần mỗi giây, và có thể bị lừa y như thế.</p>
          <div class="box key">Hôm nay: <b>lấy mẫu</b>, hiện tượng <b>chồng phổ</b>, định lý Nyquist, và <b>biến đổi Fourier rời rạc</b> để xem tín hiệu gồm những tần số nào.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, trong phim, bánh xe đang lăn tới đôi khi trông như đang quay ngược. Lý do là máy quay chỉ chụp 24 khung mỗi giây, và bỏ lỡ chuyển động xảy ra giữa hai khung. Cảm biến của robot cũng chỉ đọc vài lần mỗi giây, nên có thể bị lừa y như thế. Hôm nay ta học lấy mẫu, hiện tượng chồng phổ, định lý lấy mẫu, và biến đổi Fourier rời rạc để xem một tín hiệu gồm những tần số nào."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cos đếm theo vòng, và khoảng cách giữa hai lần đọc"
    checks:
      - "[round(math.cos(2 * math.pi * v), 3) for v in (0.3, 0.7, 1.3)] == [-0.309, -0.309, -0.309] and round(math.cos(2 * math.pi * 1), 6) == 1"
      - "round(1 / 10, 6) == 0.1 and round(7 * 0.1, 6) == 0.7 and round(3 * 0.1, 6) == 0.3"
    steps:
      - show: |
          <p>Viết góc theo <b>số vòng</b>: $\cos(2\pi \cdot v)$ với $v$ vòng; một vòng là $2\pi$. Cos chỉ phụ thuộc chỗ mũi tên dừng.</p>
          <table class="t"><tr><th>số vòng $v$</th><th>mũi tên dừng ở</th><th>$\cos(2\pi \cdot v)$</th></tr>
          <tr><td>0,3</td><td>0,3 vòng theo chiều dương</td><td>$-0{,}309$</td></tr>
          <tr><td>1,3</td><td>một vòng trọn rồi thêm 0,3 vòng</td><td>$-0{,}309$</td></tr>
          <tr><td>0,7</td><td>bằng lùi 0,3 vòng (cos không phân biệt chiều)</td><td>$-0{,}309$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.4"]
        say: "Trước khi vào bài, ta ôn cách đếm góc theo số vòng, một vòng trọn là 2 pi. Cos của một góc chỉ phụ thuộc chỗ mũi tên dừng lại, không phụ thuộc nó đã quay bao nhiêu vòng. Ví dụ 0 phẩy 3 vòng cho cos bằng âm 0 phẩy 309. Đi 1 phẩy 3 vòng, tức một vòng trọn rồi thêm 0 phẩy 3, mũi tên dừng đúng chỗ cũ, nên cos vẫn là âm 0 phẩy 309. Còn 0 phẩy 7 vòng thì mũi tên dừng ở chỗ của lùi 0 phẩy 3 vòng. Vì cos là bóng trên trục ngang, nó không phân biệt tiến hay lùi, nên cũng ra âm 0 phẩy 309."
      - show: |
          <p>Đọc $f_s = 10$ lần mỗi giây thì hai lần đọc cách nhau $\dfrac{1}{10} = 0{,}1$ giây. Trong 0,1 giây:</p>
          <table class="t"><tr><th>tín hiệu</th><th>quay được</th></tr>
          <tr><td>7 Hz</td><td>$7 \cdot 0{,}1 = 0{,}7$ vòng</td></tr>
          <tr><td>3 Hz</td><td>$3 \cdot 0{,}1 = 0{,}3$ vòng</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ hai, nếu đọc 10 lần mỗi giây thì hai lần đọc cách nhau 1 chia 10, tức 0 phẩy 1 giây. Trong khoảng đó, tín hiệu 7 dao động mỗi giây quay được 7 nhân 0 phẩy 1, bằng 0 phẩy 7 vòng. Tín hiệu 3 dao động mỗi giây quay được 0 phẩy 3 vòng, và hai con số này sẽ là chìa khoá của cả bài."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: tần số, tần số lấy mẫu và mẫu"
    checks:
      - "abs(1 / 10 - 0.1) < 1e-12 and abs(math.cos(2 * math.pi * 7 * 3 / 10) - math.cos(2 * math.pi * 7 * 0.3)) < 1e-12"
    steps:
      - show: |
          <p>Tín hiệu $\cos(2\pi f t)$ lặp $f$ lần mỗi giây; đơn vị Hz. Ví dụ $f = 7$: bảy dao động mỗi giây.</p>
          <p>Lấy mẫu $f_s$ lần mỗi giây, cách nhau $1/f_s$ giây. Mẫu thứ $n$: $\quad x_n = \cos\!\left(2\pi f \dfrac{n}{f_s}\right)$</p>
          <p class="note">$f_s = 10$: đọc lúc $0;\ 0{,}1;\ 0{,}2 \dots$ giây. Giữa hai lần đọc, ta không biết gì.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Tín hiệu cos của 2 pi f t lặp lại f lần mỗi giây, và đơn vị của f là Hz. Ví dụ f bằng 7 nghĩa là bảy dao động mỗi giây. Ta lấy mẫu f s lần mỗi giây, hai lần đọc cách nhau 1 chia f s giây. Mẫu thứ n là giá trị tín hiệu tại thời điểm n chia f s. Với f s bằng 10, ta đọc lúc 0, 0 phẩy 1, 0 phẩy 2 giây, và giữa hai lần đọc thì ta không biết gì cả."

  - id: intuition
    kind: intuition
    title: "Hình dung: bánh xe quay 7 vòng, chụp 10 lần mỗi giây"
    checks:
      - "[round((0.7 * n) % 1, 6) for n in range(4)] == [0, 0.7, 0.4, 0.1] and [round((-0.3 * n) % 1, 6) for n in range(4)] == [0, 0.7, 0.4, 0.1]"
      - "round(0.7 * 10, 6) == 7 and round(0.3 * 10, 6) == 3 and round(1 - 0.7, 6) == 0.3"
    steps:
      - show: |
          <div><svg width="1140" height="450" viewBox="0 0 1140 450"><defs><marker id="wh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><circle cx="150" cy="170" r="90" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><line x1="150" y1="170" x2="240.0" y2="170.0" stroke="#2a78d6" stroke-width="6"/><circle cx="240.0" cy="170.0" r="9" fill="#2a78d6"/><text x="150" y="315" font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">lần đọc 0</text><text x="150" y="345" font-size="21" text-anchor="middle" fill="#2a78d6">đã quay 0,0 vòng</text><circle cx="430" cy="170" r="90" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><line x1="430" y1="170" x2="520.0" y2="170.0" stroke="#9ca3af" stroke-width="3" stroke-dasharray="6 5"/><polyline points="538.0,170.0 537.5,180.2 536.1,190.2 533.7,200.1 530.4,209.8 526.2,219.0 521.2,227.9 515.3,236.2 508.7,243.9 501.4,251.0 493.5,257.4 485.0,263.0 476.0,267.7 466.6,271.6 456.9,274.6 446.9,276.7 436.8,277.8 426.6,277.9 416.5,277.1 406.4,275.4 396.6,272.7" fill="none" stroke="#eb6834" stroke-width="3" marker-end="url(#wh)"/><line x1="430" y1="170" x2="402.2" y2="255.6" stroke="#2a78d6" stroke-width="6"/><circle cx="402.2" cy="255.6" r="9" fill="#2a78d6"/><text x="430" y="315" font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">lần đọc 1</text><text x="430" y="345" font-size="21" text-anchor="middle" fill="#2a78d6">đã quay 0,7 vòng</text><circle cx="710" cy="170" r="90" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><line x1="710" y1="170" x2="682.2" y2="255.6" stroke="#9ca3af" stroke-width="3" stroke-dasharray="6 5"/><polyline points="676.6,272.7 667.1,269.1 658.0,264.6 649.3,259.3 641.2,253.2 633.6,246.4 626.8,238.8 620.7,230.7 615.4,222.0 610.9,212.9 607.3,203.4 604.6,193.6 602.9,183.5 602.1,173.4 602.2,163.2 603.3,153.1 605.4,143.1 608.4,133.4 612.3,124.0 617.0,115.0 622.6,106.5" fill="none" stroke="#eb6834" stroke-width="3" marker-end="url(#wh)"/><line x1="710" y1="170" x2="637.2" y2="117.1" stroke="#2a78d6" stroke-width="6"/><circle cx="637.2" cy="117.1" r="9" fill="#2a78d6"/><text x="710" y="315" font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">lần đọc 2</text><text x="710" y="345" font-size="21" text-anchor="middle" fill="#2a78d6">đã quay 1,4 vòng</text><circle cx="990" cy="170" r="90" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><line x1="990" y1="170" x2="917.2" y2="117.1" stroke="#9ca3af" stroke-width="3" stroke-dasharray="6 5"/><polyline points="902.6,106.5 909.0,98.6 916.1,91.3 923.8,84.7 932.1,78.8 941.0,73.8 950.2,69.6 959.9,66.3 969.8,63.9 979.8,62.5 990.0,62.0 1000.2,62.5 1010.2,63.9 1020.1,66.3 1029.8,69.6 1039.0,73.8 1047.9,78.8 1056.2,84.7 1063.9,91.3 1071.0,98.6 1077.4,106.5" fill="none" stroke="#eb6834" stroke-width="3" marker-end="url(#wh)"/><line x1="990" y1="170" x2="1062.8" y2="117.1" stroke="#2a78d6" stroke-width="6"/><circle cx="1062.8" cy="117.1" r="9" fill="#2a78d6"/><text x="990" y="315" font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">lần đọc 3</text><text x="990" y="345" font-size="21" text-anchor="middle" fill="#2a78d6">đã quay 2,1 vòng</text><text x="570" y="395" font-size="23" text-anchor="middle" fill="#2a78d6">Thật: mỗi lần đọc nan xanh tiến 0,7 vòng (7 vòng mỗi giây).</text><text x="570" y="430" font-size="23" text-anchor="middle" fill="#eb6834" font-weight="bold">Mắt chỉ thấy chỗ dừng: như lùi 0,3 vòng (mũi tên cam), tức 3 vòng mỗi giây.</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình này chính là bánh xe trong phim. Nan xanh quay 7 vòng mỗi giây, còn máy chỉ chụp 10 lần mỗi giây, nên giữa hai lần chụp nan đã tiến 0 phẩy 7 vòng. Nhưng ảnh chỉ cho biết nan dừng ở đâu, và chỗ dừng sau 0 phẩy 7 vòng tiến trùng với chỗ dừng sau 0 phẩy 3 vòng lùi, như mũi tên cam. Lần đọc 1, 2, 3 cho nan ở 0 phẩy 7, 0 phẩy 4, rồi 0 phẩy 1 vòng, đúng như lùi đều 0 phẩy 3 vòng mỗi lần. Mắt ta, hay một cảm biến, vì thế thấy bánh xe quay ngược 3 vòng mỗi giây."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "7 Hz lấy mẫu 10 lần mỗi giây"
    checks:
      - "max(abs(math.cos(2 * math.pi * 7 * n / 10) - math.cos(2 * math.pi * 3 * n / 10)) for n in range(100)) < 1e-12"
      - "alg.alias_freq(7, 10) == 3"
      - "all(abs(math.cos(2 * math.pi * 7 * n / 10) - math.cos(2 * math.pi * n - 2 * math.pi * 3 * n / 10)) < 1e-9 for n in range(20))"
      - "round(math.cos(2 * math.pi * 0.7), 3) == -0.309 and round(math.cos(2 * math.pi * 0.3), 3) == -0.309"
      - "round(math.cos(2 * math.pi * 1.4), 3) == -0.809 and round(math.cos(2 * math.pi * 0.4), 3) == -0.809 and round(math.cos(2 * math.pi * 0.6), 3) == -0.809"
    steps:
      - show: |
          <div>{{ALIAS}}</div>
          <p><b>Bước 1 —</b> vì $\cos$ lặp lại sau mỗi vòng $2\pi$: $\cos\!\left(2\pi \cdot \frac{7n}{10}\right) = \cos\!\left(2\pi n - 2\pi \cdot \frac{3n}{10}\right) = \cos\!\left(2\pi \cdot \frac{3n}{10}\right)$.</p>
          <div class="box key">Các mẫu của 7 Hz <b>trùng hệt</b> các mẫu của 3 Hz. Nhìn mẫu, ta thấy 3 Hz: đó là <b>chồng phổ</b>.</div>
        focus: [1, 2, 3, 3]
        say: "Trên hình, đường xám là tín hiệu thật 7 Hz, các chấm xanh là mẫu đọc 10 lần mỗi giây. Đường cam 3 Hz đi qua đúng mọi chấm xanh, vì cos lặp lại sau mỗi vòng 2 pi, và 7 n chia 10 vòng bằng n vòng trừ đi 3 n chia 10 vòng. Vậy các mẫu của tín hiệu 7 Hz trùng hệt các mẫu của tín hiệu 3 Hz. Nhìn vào mẫu, ta chỉ thấy 3 Hz, và hiện tượng đó gọi là chồng phổ."
      - clear: true
        show: |
          <p><b>Bước 2 —</b> thay số, mẫu $n = 1$ (lúc 0,1 giây):</p>
          <p>$$\cos(2\pi \cdot 0{,}7) = -0{,}309 \qquad \cos(2\pi \cdot 0{,}3) = -0{,}309$$</p>
        focus: [1, 2]
        say: "Bước hai, ta thay số cho mẫu đầu tiên sau gốc, lúc 0 phẩy 1 giây. Tín hiệu 7 Hz đã quay 0 phẩy 7 vòng, tín hiệu 3 Hz đã quay 0 phẩy 3 vòng, và cả hai đều cho cos bằng âm 0 phẩy 309."
      - show: |
          <p><b>Bước 3 —</b> mẫu $n = 2$ (lúc 0,2 giây): 7 Hz quay 1,4 vòng, chỗ dừng như 0,4 vòng; 3 Hz quay 0,6 vòng.</p>
          <p>$$\cos(2\pi \cdot 1{,}4) = \cos(2\pi \cdot 0{,}4) = -0{,}809 \qquad \cos(2\pi \cdot 0{,}6) = -0{,}809$$</p>
        focus: [1, 2]
        say: "Bước ba, mẫu lúc 0 phẩy 2 giây, tín hiệu 7 Hz quay 1 phẩy 4 vòng, bỏ vòng trọn thì dừng ở 0 phẩy 4 vòng, còn tín hiệu 3 Hz quay 0 phẩy 6 vòng. Hai chỗ dừng đối xứng nhau qua trục ngang, nên cos bằng nhau, cùng là âm 0 phẩy 809."
      - clear: true
        show: |
          <p><b>Bước 4 —</b> quy tắc: tần số biểu kiến là khoảng cách từ $f$ tới <b>bội gần nhất</b> của $f_s$.</p>
          <table class="t"><tr><th>$f$ thật</th><th>$f_s$</th><th>bội gần nhất</th><th>thấy</th></tr>
          <tr><td>7</td><td>10</td><td>10</td><td>3 Hz</td></tr>
          <tr><td>13</td><td>10</td><td>10</td><td>3 Hz</td></tr>
          <tr><td>7</td><td>15</td><td>0</td><td>7 Hz (đúng)</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Quy tắc chung, tần số ta thấy là khoảng cách từ f tới bội gần nhất của f s. Bảng có ba trường hợp. 7 Hz lấy mẫu 10 lần cách bội 10 ba đơn vị, nên thấy 3 Hz. 13 Hz cũng cách 10 ba đơn vị, nên cũng thấy 3 Hz. Còn lấy mẫu 15 lần mỗi giây thì 7 Hz gần bội 0 nhất, nên thấy đúng 7 Hz."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê mẫu, rồi đổi tần số lấy mẫu"
    checks:
      - "all([round(math.cos(2 * math.pi * f * n / 10), 3) for n in range(4)] == [1.0, -0.309, -0.809, 0.809] for f in (3, 7, 13))"
      - "[round(math.cos(2 * math.pi * 7 * n / 15), 3) for n in range(2)] == [1.0, -0.978] and [round(math.cos(2 * math.pi * 3 * n / 15), 3) for n in range(2)] == [1.0, 0.309]"
    steps:
      - show: |
          <p>Đường thứ nhất: không dùng quy tắc, máy tính thẳng 4 mẫu đầu, $f_s = 10$.</p>
          <table class="t"><tr><th>$f$</th><th>$n = 0$</th><th>$n = 1$</th><th>$n = 2$</th><th>$n = 3$</th></tr>
          <tr><td>3 Hz</td><td>1</td><td>$-0{,}309$</td><td>$-0{,}809$</td><td>$0{,}809$</td></tr>
          <tr><td>7 Hz</td><td>1</td><td>$-0{,}309$</td><td>$-0{,}809$</td><td>$0{,}809$</td></tr>
          <tr><td>13 Hz</td><td>1</td><td>$-0{,}309$</td><td>$-0{,}809$</td><td>$0{,}809$</td></tr></table>
        focus: [1, "2.2", ["2.3", "2.4"]]
        say: "Làm sao biết quy tắc bội gần nhất là đúng? Đường thứ nhất, bỏ quy tắc đi và thay số thẳng vào công thức mẫu, cho bốn mẫu đầu với 10 lần đọc mỗi giây. Ba hàng 3 Hz, 7 Hz và 13 Hz giống hệt nhau từng số, đúng như quy tắc nói cả ba đều trông như 3 Hz."
      - show: |
          <p>Đường thứ hai: đọc nhanh hơn, $f_s = 15$, thì 7 Hz và 3 Hz tách ra ngay ở mẫu $n = 1$.</p>
          <table class="t"><tr><th>$f$</th><th>số vòng tới mẫu $n = 1$</th><th>mẫu</th></tr>
          <tr><td>7 Hz</td><td>$\frac{7}{15} \approx 0{,}467$</td><td>$-0{,}978$</td></tr>
          <tr><td>3 Hz</td><td>$\frac{3}{15} = 0{,}2$</td><td>$0{,}309$</td></tr></table>
        focus: [1, "2.2", "2.3", 2]
        say: "Đường thứ hai, đổi sang đọc 15 lần mỗi giây. Lúc này 7 Hz quay khoảng 0 phẩy 467 vòng giữa hai lần đọc, cho mẫu âm 0 phẩy 978. Còn 3 Hz chỉ quay 0 phẩy 2 vòng, cho mẫu 0 phẩy 309. Hai dãy mẫu khác nhau ngay từ mẫu thứ hai, nên với 15 lần đọc mỗi giây ta thấy đúng 7 Hz, khớp với dòng cuối của bảng quy tắc."

  # ───────────────────────── 4. NYQUIST ─────────────────────────
  - id: nyquist
    kind: concept
    title: "Định lý lấy mẫu: lớn hơn hai lần"
    checks:
      - "all(alg.alias_freq(f, fs) == f for f in range(0, 50) for fs in range(2 * f + 1, 2 * f + 20))"
      - "max(abs(math.sin(2 * math.pi * 7 * n / 14)) for n in range(28)) < 1e-12"
      - "alg.alias_freq(7, 14) == 7"
    steps:
      - show: |
          <p>Muốn mọi tần số tới $f_{\text{max}}$ đều hiện đúng, cần $f$ nằm gần bội 0 hơn bội $f_s$, tức $f < f_s/2$ với mọi $f \le f_{\text{max}}$:</p>
          <div class="box key">$f_s > 2 f_{\text{max}}$ — <b>lớn hơn hẳn</b> hai lần tần số cao nhất (Nyquist, Shannon).</div>
          <p>7 Hz cần $f_s > 14$. Đúng bằng 14 thì sao? Mẫu của $\sin(2\pi \cdot 7t)$ rơi đúng vào các điểm qua 0: <b>toàn số 0</b> — tín hiệu biến mất.</p>
        focus: [1, 2, 3, 3, 3]
        say: "Muốn mọi tần số tới tần số cao nhất đều hiện đúng, f phải nằm gần bội 0 hơn bội f s, tức f nhỏ hơn một nửa f s. Đó là định lý lấy mẫu, mang tên hai nhà khoa học trên màn hình, tần số lấy mẫu phải lớn hơn hẳn hai lần tần số cao nhất. Ví dụ 7 Hz cần lấy mẫu hơn 14 lần mỗi giây. Nếu đúng bằng 14 thì sao? Mẫu của sin 7 Hz rơi đúng vào các điểm qua 0, nên toàn bộ mẫu bằng 0, tín hiệu biến mất."

  # ───────────────────────── 5. DFT ─────────────────────────
  - id: dft
    kind: concept
    title: "Biến đổi Fourier rời rạc: tín hiệu gồm những tần số nào"
    checks:
      - "[round(v, 3) for v in alg.dft_mag([math.cos(2 * math.pi * 2 * n / 10) + 0.5 * math.cos(2 * math.pi * 4 * n / 10) for n in range(10)])] == [0, 0, 5, 0, 2.5, 0, 2.5, 0, 5, 0]"
      - "[round(v, 3) for v in alg.dft_mag([math.cos(2 * math.pi * 7 * n / 10) for n in range(10)])] == [0, 0, 0, 5, 0, 0, 0, 5, 0, 0]"
    steps:
      - show: |
          <p>$N$ mẫu $x_0, \dots, x_{N-1}$. Với mỗi $k$, so tín hiệu với một sóng $k$ dao động:</p>
          <p>$C_k = \sum_{n=0}^{N-1} x_n \cos\dfrac{2\pi k n}{N}$, $\quad S_k = \sum_{n=0}^{N-1} x_n \sin\dfrac{2\pi k n}{N}$, $\quad \lvert X_k \rvert = \sqrt{C_k^2 + S_k^2}$</p>
          <p class="note">$\lvert X_k \rvert$ lớn khi tín hiệu “giống” sóng $k$ dao động. Lấy $N$ mẫu trong 1 giây thì chỉ số $k$ ứng với $k$ Hz.</p>
        introduces: [absval]
        focus: [1, 2, 3, 3]
        say: "Biến đổi Fourier rời rạc nhận N mẫu, và với mỗi k, nó so tín hiệu với một sóng có k dao động. Ta nhân từng mẫu với cos rồi cộng lại, được C k, làm tương tự với sin được S k, và độ lớn X k là căn của tổng hai bình phương. Độ lớn này lớn khi tín hiệu giống sóng k dao động. Nếu N mẫu được lấy trong đúng 1 giây, chỉ số k ứng với k Hz."
      - clear: true
        show: |
          <div>{{DFT}}</div>
          <p>Tín hiệu $\cos(2\pi \cdot 2t) + 0{,}5\cos(2\pi \cdot 4t)$, 10 mẫu: cột cao ở $k = 2$ (5) và $k = 4$ (2,5) — đúng hai thành phần, đúng tỉ lệ 1 : 0,5.</p>
          <p class="note">Nửa sau là ảnh gương, cột $k$ giống cột $N - k$: với 7 Hz lấy 10 mẫu, cột ở $k = 3$ và $k = 7$ cao như nhau — không phân biệt được, đúng như chồng phổ.</p>
        focus: [1, 2, 3, 3]
        say: "Thử với tổng của cos 2 Hz và một nửa cos 4 Hz, lấy 10 mẫu trong 1 giây. Biểu đồ có cột cao ở k bằng 2, giá trị 5, và ở k bằng 4, giá trị 2 phẩy 5, đúng hai thành phần với đúng tỉ lệ 1 trên 0 phẩy 5. Nửa sau màu xám là ảnh gương của nửa đầu, không thêm thông tin. Với tín hiệu 7 Hz lấy 10 mẫu, cột ở k bằng 3 và k bằng 7 cao như nhau, nên không phân biệt được, đúng như chồng phổ."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "max(abs(math.sin(2 * math.pi * 7 * n / 14)) for n in range(28)) < 1e-12"
      - "[round(math.sin(2 * math.pi * 7 * n / 15), 3) for n in range(4)] == [0.0, 0.208, -0.407, 0.588]"
      - "alg.alias_freq(13, 10) == alg.alias_freq(7, 10)"
      - "abs(10 / 10 - 1) < 1e-12 and abs(10 / 100 - 0.1) < 1e-12"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lấy mẫu đúng bằng $2f$ <b class="red">(sai)</b>
          <br><span class="note">Phải <b>lớn hơn</b> $2f$. Đúng bằng thì tín hiệu có thể mất hẳn.</span></div>
          <table class="t"><tr><th>mẫu của $\sin(2\pi \cdot 7t)$</th><th>$n = 0$</th><th>$n = 1$</th><th>$n = 2$</th><th>$n = 3$</th></tr><tr><td>$f_s = 14$</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>$f_s = 15$</td><td>0</td><td>$0{,}208$</td><td>$-0{,}407$</td><td>$0{,}588$</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ nhất, lấy mẫu đúng bằng hai lần tần số. Phải lớn hơn hẳn hai lần, vì đúng bằng thì tín hiệu có thể mất hẳn. Bảng cho thấy sin 7 Hz đọc 14 lần mỗi giây ra toàn số 0, còn đọc 15 lần mỗi giây thì các mẫu đã khác 0."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Mong sửa chồng phổ sau khi đã lấy mẫu <b class="red">(sai)</b>
          <br><span class="note">Mẫu của 7 Hz và 3 Hz giống hệt nhau, không còn gì để phân biệt. Phải lọc bỏ tần số cao <b>trước</b> khi lấy mẫu.</span></div>
        say: "Lỗi thứ hai, mong sửa chồng phổ sau khi đã lấy mẫu. Mẫu của 7 Hz và 3 Hz giống hệt nhau, không còn gì để phân biệt. Phải lọc bỏ tần số cao trước khi lấy mẫu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ nghĩ tới tần số của chuyển động mong muốn <b class="red">(thiếu)</b>
          <br><span class="note">Rung động cơ, nhiễu điện có tần số cao hơn nhiều. Không lọc trước, chúng chồng phổ thành tần số thấp giả.</span></div>
        say: "Lỗi thứ ba, chỉ nghĩ tới tần số của chuyển động mong muốn. Rung của động cơ hay nhiễu điện có tần số cao hơn nhiều. Không lọc trước, chúng sẽ chồng phổ thành một tần số thấp giả."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Đọc nửa sau của $\lvert X_k \rvert$ như tần số thật <b class="red">(sai)</b>
          <br><span class="note">Với tín hiệu thực, nửa sau là ảnh gương. Chỉ đọc $k$ từ 0 tới $N/2$.</span></div>
        say: "Lỗi thứ tư, đọc nửa sau của biểu đồ Fourier như tần số thật. Với tín hiệu số thực, nửa sau chỉ là ảnh gương, nên chỉ đọc k từ 0 tới N chia 2."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.alias_freq(9, 10) == 1 and alg.alias_freq(12, 10) == 2"
      - "all(alg.alias_freq(50, fs) == 50 for fs in range(101, 400)) and alg.alias_freq(50, 100) == 50 and alg.alias_freq(50, 90) == 40"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Lấy mẫu 10 lần mỗi giây. Tín hiệu 9 Hz trông như bao nhiêu Hz? Còn 12 Hz?</td></tr>
          <tr><td>2</td><td>Động cơ rung 50 Hz. Cảm biến phải đọc tối thiểu thế nào để thấy đúng rung động đó?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, lấy mẫu 10 lần mỗi giây, tín hiệu 9 Hz trông như bao nhiêu Hz? Còn 12 Hz thì sao? Câu hai, một động cơ rung 50 Hz. Cảm biến phải đọc tối thiểu thế nào để thấy đúng rung động đó? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① 9 Hz: bội gần nhất của 10 là 10, cách $10 - 9 = 1$: thấy $\hl{1}$ Hz — rung nhanh mà trông như trôi chậm.</p>
          <p>12 Hz: bội gần nhất là 10, cách $12 - 10 = 2$: thấy $\hl{2}$ Hz.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, 9 Hz cách bội 10 một đơn vị, nên ta thấy 1 Hz, rung rất nhanh mà trông như trôi chậm. 12 Hz thì thấy 2 Hz. Lý do là bội gần nhất của 10 với số 12 vẫn là 10, cách đúng hai đơn vị."
      - show: |
          <p>② $f_s > 2 \cdot 50 = 100$: <b>hơn</b> 100 lần mỗi giây.</p>
          <p class="note">Ví dụ đọc 90 lần mỗi giây: bội gần nhất của 90 với 50 là 90, cách $90 - 50 = 40$: thấy 40 Hz giả.</p>
        focus: [1, 2, 2]
        say: "Câu hai, tần số lấy mẫu phải lớn hơn 2 nhân 50, tức hơn 100 lần mỗi giây. Nếu chỉ đọc 90 lần mỗi giây, ta sẽ thấy một rung động 40 Hz giả. Vì bội gần nhất của 90 với số 50 là chính 90, cách 50 đúng 40 đơn vị."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chỉ biết giá trị tại các mẫu</span><span class="a">→</span>
          <span class="n">$f$ và $f \pm f_s$ cho cùng mẫu</span><span class="a">→</span>
          <span class="n">cần $f_s > 2f_{\text{max}}$, lọc trước khi lấy mẫu</span><span class="a">→</span>
          <span class="n">$\lvert X_k \rvert$ cho thấy các tần số</span></div>
        say: "Tổng kết lại, sau khi lấy mẫu ta chỉ biết giá trị tại các thời điểm đọc. Tần số f và f cộng hay trừ f s cho cùng một dãy mẫu. Vì vậy cần tần số lấy mẫu lớn hơn hai lần tần số cao nhất, và phải lọc trước khi lấy mẫu. Biến đổi Fourier rời rạc cho thấy tín hiệu gồm những tần số nào."
      - show: |
          <div class="box key"><b>Tư duy:</b> dữ liệu số chỉ là những lát cắt của thế giới thật. Trước khi tin một quy luật trong dữ liệu, hãy hỏi tần số đọc có đủ để thấy nó không.</div>
        say: "Điều cần mang theo, dữ liệu số chỉ là những lát cắt của thế giới thật. Trước khi tin một quy luật trong dữ liệu, hãy hỏi tần số đọc có đủ để thấy nó hay không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 15): <b>lập kế hoạch đường đi</b> với thuật toán A* trên lưới.</p>
        forward_ref: true
        say: "Ở bài sau, bài 15, ta học lập kế hoạch đường đi cho robot, với thuật toán A sao trên lưới ô vuông. Hẹn gặp bạn ở bài tiếp theo."
