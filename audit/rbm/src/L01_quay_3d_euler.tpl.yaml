id: L01
course: RBM
series: "RBM · Toán cho robot và hệ động lực"
title: "Bài 1 — Phép quay 3D, góc Euler và khoá gimbal"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rbm.yaml L01; audit/rbm/verify_rbm.py L01; K. M. Lynch, F. C. Park, Modern Robotics (2017), mục 3.2 và phụ lục B"
assumes: [arith, cdot, vec, mat, sub, transpose, identity, det, inverse, cos, sin, theta, deg, approx, implies]
# Quy ước: R_x(θ), R_y(θ), R_z(θ) quay ngược chiều kim đồng hồ khi nhìn từ đầu mút trục về gốc (quy tắc bàn tay phải);
#   góc Euler theo thứ tự Z-Y-X: R = R_z(θ_z) R_y(θ_y) R_x(θ_x), mọi phép quay quanh trục CỐ ĐỊNH của khung thế giới,
#   áp dụng từ phải sang trái (R_x trước). Không dùng tên roll/pitch/yaw trong lời đọc (chưa dò phát âm).
#   Mọi số do alg.rotx/roty/rotz tính; khoá gimbal kiểm bằng hạng đạo hàm số (3 → 2) và hai bộ góc cho cùng ma trận.
objectives:
  - "Viết ba ma trận quay quanh trục x, y, z và ghép chúng"
  - "Thấy thứ tự quay làm đổi kết quả"
  - "Giải thích khoá gimbal: mất một bậc tự do khi góc giữa bằng 90°"
