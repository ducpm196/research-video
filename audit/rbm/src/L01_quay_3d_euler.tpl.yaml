  - {sentence: "Câu hai, khi theta y bằng 90 độ thì ma trận chỉ phụ thuộc vào hiệu theta x trừ theta z, ở đây là 40 trừ 10, bằng 30 độ.", reason: "ASR chép “Câu 2. Khi TETA-I bằng 90 độ thì má trận chỉ phụ thuộc vào hiệu TETA-X trừ TETA-Z, ở đây là 40 trừ 10, bằng 30 độ.” (0.879): “theta” đọc “tê-ta” theo lexicon_vi.RBM.yaml (probe p2 7/8), ASR viết “teta/TETA” — đúng âm — NOT_VERIFIED bằng tai người"}
