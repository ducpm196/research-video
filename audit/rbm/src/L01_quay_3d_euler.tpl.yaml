scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Thứ tự quay có quan trọng không?"
    steps:
      - show: |
          <p>Cầm một cuốn sách. Quay nó $90^\circ$ quanh trục đứng rồi $90^\circ$ quanh trục ngang. Làm lại với thứ tự ngược.</p>
          <p>Hai lần, gáy sách chỉ về hai hướng <b>khác nhau</b>.</p>
          <div class="box key">Hôm nay: ma trận quay quanh từng trục trong không gian ba chiều, cách ghép chúng thành <b>góc Euler</b>, và chỗ hỏng của cách ghép đó.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, hãy cầm một cuốn sách, quay nó 90 độ quanh trục đứng, rồi 90 độ quanh trục ngang. Sau đó làm lại từ đầu với thứ tự ngược. Bạn sẽ thấy hai lần gáy sách chỉ về hai hướng khác nhau. Hôm nay ta học ma trận quay quanh từng trục trong không gian ba chiều, cách ghép chúng thành góc Euler, và chỗ hỏng của cách ghép đó."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ma trận quay phẳng, và nhân hai ma trận"
    checks:
      - "np.allclose(alg.rot2(90) @ [1, 0], [0, 1]) and np.allclose(alg.rot2(90) @ [0, 1], [-1, 0])"
      - "list(np.array([[2, 0], [0, 1]]) @ [1, 1]) == [2, 1] and np.allclose(alg.rot2(90) @ [2, 1], [-1, 2])"
      - "np.allclose(alg.rot2(90) @ np.array([[2, 0], [0, 1]]), [[0, -1], [2, 0]]) and np.allclose((alg.rot2(90) @ np.array([[2, 0], [0, 1]])) @ [1, 1], [-1, 2])"
      - "np.allclose((np.array([[2, 0], [0, 1]]) @ alg.rot2(90)) @ [1, 1], [-2, 1])"
    steps:
      - show: |
          <p>Ở bài 0: ma trận quay phẳng $\mathbf{R}(\theta)$ có cột 1 là trục ngang sau khi quay, cột 2 là trục đứng sau khi quay.</p>
          <table class="t"><tr><th>phép tính</th><th>đọc theo cột</th><th>kết quả</th></tr>
          <tr><td>$\mathbf{R}(90^\circ)(1, 0)^T$</td><td>lấy cột 1</td><td>$(0, 1)^T$</td></tr>
          <tr><td>$\mathbf{R}(90^\circ)(0, 1)^T$</td><td>lấy cột 2</td><td>$(-1, 0)^T$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Trước khi vào bài, ta nhắc lại điều đã học ở bài 0, ma trận quay trong mặt phẳng có cột thứ nhất là trục ngang sau khi quay, cột thứ hai là trục đứng sau khi quay. Vì vậy R 90 độ nhân với 1, 0 chính là lấy cột thứ nhất, được 0, 1, trục ngang quay thành trục đứng. Còn R 90 độ nhân với 0, 1 là lấy cột thứ hai, được âm 1, 0, trục đứng quay sang phía âm của trục ngang."
      - show: |
          <p>Nhân liền hai ma trận rồi nhân vector nghĩa là <b>làm lần lượt</b>: $\mathbf{A}\mathbf{B}\mathbf{v} = \mathbf{A}(\mathbf{B}\mathbf{v})$ — ma trận sát $\mathbf{v}$ làm trước. Ví dụ $\mathbf{B} = \begin{bmatrix} 2 & 0 \\ 0 & 1 \end{bmatrix}$ (kéo giãn ngang), $\mathbf{A} = \mathbf{R}(90^\circ)$, $\mathbf{v} = (1, 1)^T$:</p>
          <table class="t"><tr><th>thứ tự</th><th>bước 1</th><th>bước 2</th></tr>
          <tr><td>$\mathbf{A}\mathbf{B}\mathbf{v}$: giãn rồi quay</td><td>$\mathbf{B}\mathbf{v} = (2, 1)^T$</td><td>$\mathbf{A}(2, 1)^T = (-1, 2)^T$</td></tr>
          <tr><td>$\mathbf{B}\mathbf{A}\mathbf{v}$: quay rồi giãn</td><td>$\mathbf{A}\mathbf{v} = (-1, 1)^T$</td><td>$\mathbf{B}(-1, 1)^T = (-2, 1)^T$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 2]
        say: "Điều thứ hai, khi nhân liền hai ma trận rồi nhân với một vector, ta làm lần lượt, ma trận đứng sát vector làm trước. Lấy B là phép kéo giãn chiều ngang gấp đôi, A là phép quay 90 độ, và vector 1, 1. A nhân B nhân v nghĩa là giãn trước, được 2, 1, rồi quay 90 độ, được âm 1, 2. Đổi thứ tự thành B nhân A nhân v, ta quay trước được âm 1, 1, rồi giãn thành âm 2, 1. Hai thứ tự cho hai kết quả khác nhau, và hôm nay ta sẽ thấy hai phép quay ba chiều cũng như vậy."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: ba ma trận quay quanh trục"
    checks:
      - "np.allclose(alg.rotz(30)[:2, :2], alg.rot2(30)) and np.allclose(alg.rotz(30)[2], [0, 0, 1])"
      - "np.allclose(alg.rotx(90) @ [0, 1, 0], [0, 0, 1]) and np.allclose(alg.roty(90) @ [0, 0, 1], [1, 0, 0]) and np.allclose(alg.rotz(90) @ [1, 0, 0], [0, 1, 0])"
      - "all(abs(np.linalg.det(M(t)) - 1) < 1e-12 and np.allclose(M(t).T @ M(t), np.eye(3)) for M in (alg.rotx, alg.roty, alg.rotz) for t in range(0, 360, 15))"
    steps:
      - show: |
          <p>$\mathbf{R}_z(\theta) = \begin{bmatrix} \cos\theta & -\sin\theta & 0 \\ \sin\theta & \cos\theta & 0 \\ 0 & 0 & 1 \end{bmatrix}$</p>
          <p>Góc trên bên trái là ma trận quay mặt phẳng của bài 0; hàng và cột thứ ba giữ nguyên toạ độ $z$.</p>
          <p class="note">Chiều dương: nhìn từ đầu mút trục về gốc, quay ngược chiều kim đồng hồ.</p>
        focus: [1, 2, 2, 3]
        say: "Quay quanh trục z trước. Ma trận R z của theta có góc trên bên trái chính là ma trận quay mặt phẳng ở bài 0, quay cos, sin như đã học. Hàng và cột thứ ba là 0, 0, 1, nghĩa là toạ độ z giữ nguyên. Chiều dương được quy ước như sau, nhìn từ đầu mút trục về gốc thì quay ngược chiều kim đồng hồ."
      - clear: true
        show: |
          <p>$\mathbf{R}_x(\theta) = \begin{bmatrix} 1 & 0 & 0 \\ 0 & \cos\theta & -\sin\theta \\ 0 & \sin\theta & \cos\theta \end{bmatrix}$ — quay $y$ về phía $z$.</p>
          <p>$\mathbf{R}_y(\theta) = \begin{bmatrix} \cos\theta & 0 & \sin\theta \\ 0 & 1 & 0 \\ -\sin\theta & 0 & \cos\theta \end{bmatrix}$ — quay $z$ về phía $x$.</p>
          <div class="box key">Vòng $x \to y \to z \to x$: quanh $z$ thì $x$ sang $y$; quanh $x$ thì $y$ sang $z$; quanh $y$ thì $z$ sang $x$. Vì vậy dấu trừ của $\mathbf{R}_y$ nằm ở hàng dưới.</div>
        focus: [1, 1, 2, 3, 3]
        say: "Quay quanh trục x giữ nguyên x và quay y về phía z, theo cùng kiểu cos, sin. Quay quanh trục y giữ nguyên y và quay z về phía x. Cách nhớ là vòng x sang y, y sang z, z quay lại x. Vì quanh trục y thì z mới là trục đi trước, nên dấu trừ của R y nằm ở hàng dưới chứ không ở hàng trên. Cả ba đều là phép quay thật như ở bài 0, mỗi cột dài 1, các cột vuông góc với nhau, và hình không bị lật như qua gương."

  - id: intuition
    kind: intuition
    title: "Hình dung: vòng ba trục và hai đường đi"
    checks:
      - "np.allclose(alg.rotz(90) @ [1, 0, 0], [0, 1, 0]) and np.allclose(alg.rotx(90) @ [0, 1, 0], [0, 0, 1]) and np.allclose(alg.roty(90) @ [0, 0, 1], [1, 0, 0])"
      - "np.allclose(alg.rotx(90) @ [0, 1, 0], [0, 0, 1]) and np.allclose(alg.rotz(90) @ [0, 0, 1], [0, 0, 1])"
      - "np.allclose(alg.rotz(90) @ [0, 1, 0], [-1, 0, 0]) and np.allclose(alg.rotx(90) @ [-1, 0, 0], [-1, 0, 0])"
    steps:
      - show: |
          <div><svg width="1280" height="450" viewBox="0 0 1280 450"><defs><marker id="vk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="vb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="vo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><circle cx="200" cy="90" r="38" fill="#e0f2fe" stroke="#1f2937" stroke-width="3"/><text x="200" y="102" font-size="34" text-anchor="middle" fill="#1f2937" font-weight="bold">x</text><circle cx="330" cy="320" r="38" fill="#e0f2fe" stroke="#1f2937" stroke-width="3"/><text x="330" y="332" font-size="34" text-anchor="middle" fill="#1f2937" font-weight="bold">y</text><circle cx="70" cy="320" r="38" fill="#e0f2fe" stroke="#1f2937" stroke-width="3"/><text x="70" y="332" font-size="34" text-anchor="middle" fill="#1f2937" font-weight="bold">z</text><line x1="223" y1="130" x2="307" y2="280" stroke="#1f2937" stroke-width="3" marker-end="url(#vk)"/><text x="290" y="190" font-size="24" text-anchor="start" fill="#1f2937">quanh z</text><line x1="284" y1="320" x2="116" y2="320" stroke="#1f2937" stroke-width="3" marker-end="url(#vk)"/><text x="200" y="380" font-size="24" text-anchor="middle" fill="#1f2937">quanh x</text><line x1="93" y1="280" x2="177" y2="130" stroke="#1f2937" stroke-width="3" marker-end="url(#vk)"/><text x="110" y="190" font-size="24" text-anchor="end" fill="#1f2937">quanh y</text><text x="20" y="412" font-size="22" text-anchor="start" fill="#6b7280">quay 90° quanh một trục:</text><text x="20" y="440" font-size="22" text-anchor="start" fill="#6b7280">trục đi trước sang trục đi sau</text><text x="520" y="98" font-size="24" text-anchor="start" fill="#2a78d6" font-weight="bold">Trái: quay quanh x trước, rồi quanh z</text><rect x="520" y="120" width="170" height="60" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="605" y="159.1" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">(0, 1, 0)</text><line x1="690" y1="150" x2="800" y2="150" stroke="#2a78d6" stroke-width="3" marker-end="url(#vb)"/><text x="745" y="138" font-size="20" text-anchor="middle" fill="#2a78d6">quanh x</text><rect x="800" y="120" width="170" height="60" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="885" y="159.1" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">(0, 0, 1)</text><line x1="970" y1="150" x2="1080" y2="150" stroke="#2a78d6" stroke-width="3" marker-end="url(#vb)"/><text x="1025" y="138" font-size="20" text-anchor="middle" fill="#2a78d6">quanh z</text><rect x="1080" y="120" width="170" height="60" fill="#dcfce7" stroke="#2a78d6" stroke-width="3"/><text x="1165" y="159.1" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">(0, 0, 1)</text><text x="520" y="278" font-size="24" text-anchor="start" fill="#eb6834" font-weight="bold">Phải: quay quanh z trước, rồi quanh x</text><rect x="520" y="300" width="170" height="60" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="605" y="339.1" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">(0, 1, 0)</text><line x1="690" y1="330" x2="800" y2="330" stroke="#eb6834" stroke-width="3" marker-end="url(#vo)"/><text x="745" y="318" font-size="20" text-anchor="middle" fill="#eb6834">quanh z</text><rect x="800" y="300" width="170" height="60" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="885" y="339.1" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">(−1, 0, 0)</text><line x1="970" y1="330" x2="1080" y2="330" stroke="#eb6834" stroke-width="3" marker-end="url(#vo)"/><text x="1025" y="318" font-size="20" text-anchor="middle" fill="#eb6834">quanh x</text><rect x="1080" y="300" width="170" height="60" fill="#dcfce7" stroke="#eb6834" stroke-width="3"/><text x="1165" y="339.1" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">(−1, 0, 0)</text><text x="1250" y="430" font-size="22" text-anchor="end" fill="#b91c1c" font-weight="bold">cùng hai phép quay, khác thứ tự, khác kết quả</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình bên trái là vòng ba trục x, y, z. Quay 90 độ quanh trục z đưa x sang y, quanh trục x đưa y sang z, quanh trục y đưa z về x, và trục đang làm tâm quay thì đứng yên. Bên phải là hai đường đi của cùng một mũi tên 0, 1, 0, tức trục y. Đường trên quay quanh x trước, y lên thành z, rồi quay quanh z thì z đứng yên. Đường dưới quay quanh z trước, y sang âm x, rồi quay quanh x thì âm x đứng yên, nên hai đường dừng ở hai chỗ khác nhau."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Đổi thứ tự, đổi kết quả"
    checks:
      - "np.allclose(alg.rotx(90) @ [0, 1, 0], [0, 0, 1]) and np.allclose(alg.rotz(90) @ [0, 0, 1], [0, 0, 1])"
      - "np.allclose(alg.rotz(90) @ [0, 1, 0], [-1, 0, 0]) and np.allclose(alg.rotx(90) @ [-1, 0, 0], [-1, 0, 0])"
      - "not np.allclose(alg.rotz(90) @ alg.rotx(90), alg.rotx(90) @ alg.rotz(90))"
      - "np.allclose(alg.rotz(90), [[0, -1, 0], [1, 0, 0], [0, 0, 1]]) and np.allclose(alg.rotz(90)[:, 1], [-1, 0, 0])"
    steps:
      - show: |
          <div>{{ORDER3D}}</div>
          <p><b>Bước 1 —</b> trái, $\mathbf{R}_x$ làm trước: $\mathbf{R}_x(90^\circ)(0, 1, 0)^T = (0, 0, 1)^T$ — $y$ lên $z$.</p>
        focus: [2, 2, 1]
        say: "Thử với vector 0, 1, 0, tức trục y, trong hai tích R z nhân R x và R x nhân R z. Bước một, ở tích bên trái, R x đứng sát vector nên làm trước, nó đưa y lên thành z, được 0, 0, 1. Hình vẽ cho thấy đường đi bên trái và bên phải của cùng mũi tên đó."
      - show: |
          <p><b>Bước 2 —</b> rồi $\mathbf{R}_z(90^\circ)(0, 0, 1)^T = \hl{(0, 0, 1)^T}$ — $z$ là tâm quay nên đứng yên.</p>
        say: "Bước hai, quay tiếp quanh trục z, mà z là tâm quay nên đứng yên, kết quả bên trái là 0, 0, 1."
      - clear: true
        show: |
          <p><b>Bước 3 —</b> phải, $\mathbf{R}_z$ làm trước; nhân với $(0, 1, 0)^T$ là lấy cột 2:</p>
          <p>$$\mathbf{R}_z(90^\circ) = \begin{bmatrix} 0 & -1 & 0 \\ 1 & 0 & 0 \\ 0 & 0 & 1 \end{bmatrix} \Rightarrow \mathbf{R}_z(90^\circ)(0, 1, 0)^T = (-1, 0, 0)^T$$</p>
        introduces: [implies]
        focus: [1, 2, 2]
        say: "Bước ba, ở tích bên phải, R z làm trước. Thay theta bằng 90 độ, cos bằng 0 và sin bằng 1, ta được ma trận này. Nhân với 0, 1, 0 là lấy cột thứ hai, được âm 1, 0, 0, tức y quay sang phía âm của trục x."
      - show: |
          <p><b>Bước 4 —</b> rồi $\mathbf{R}_x(90^\circ)(-1, 0, 0)^T = \hl{(-1, 0, 0)^T}$ — vector nằm trên trục $x$, là tâm quay, nên đứng yên.</p>
        say: "Bước bốn, quay tiếp quanh trục x, mà vector âm 1, 0, 0 nằm ngay trên trục x, nên đứng yên. Cùng hai phép quay, khác thứ tự, một bên ra 0, 0, 1, một bên ra âm 1, 0, 0, hai hướng vuông góc nhau."
      - clear: true
        show: |
          <p>Nhân ma trận viết từ trái sang phải nhưng <b>áp dụng từ phải sang trái</b>: trong $\mathbf{R}_z\mathbf{R}_x\mathbf{v}$, ma trận sát $\mathbf{v}$ tác động trước.</p>
          <div class="box key">$\mathbf{R}_z(90^\circ)\mathbf{R}_x(90^\circ) \ne \mathbf{R}_x(90^\circ)\mathbf{R}_z(90^\circ)$: phép quay 3D <b>không giao hoán</b>.</div>
          <p class="note">Trong mặt phẳng thì giao hoán: $\mathbf{R}(30^\circ)\mathbf{R}(60^\circ) = \mathbf{R}(90^\circ)$ theo thứ tự nào cũng vậy, vì chỉ có một trục quay.</p>
        focus: [1, 1, 2, 3]
        say: "Lưu ý cách đọc, tích ma trận viết từ trái sang phải, nhưng áp dụng từ phải sang trái. Trong R z nhân R x nhân v, ma trận đứng sát v tác động trước. Vậy hai tích này khác nhau, phép quay ba chiều không giao hoán. Trong mặt phẳng thì khác, quay 30 độ rồi 60 độ hay ngược lại đều là quay 90 độ, vì chỉ có một trục quay."

  - id: check
    kind: check
    title: "Tự kiểm: nhân hai ma trận trước, rồi lấy cột 2"
    checks:
      - "np.allclose(alg.rotx(90), [[1, 0, 0], [0, 0, -1], [0, 1, 0]])"
      - "np.allclose(alg.rotz(90) @ alg.rotx(90), [[0, 0, 1], [1, 0, 0], [0, 1, 0]]) and np.allclose((alg.rotz(90) @ alg.rotx(90))[:, 1], [0, 0, 1])"
      - "np.allclose(alg.rotx(90) @ alg.rotz(90), [[0, -1, 0], [0, 0, -1], [1, 0, 0]]) and np.allclose((alg.rotx(90) @ alg.rotz(90))[:, 1], [-1, 0, 0])"
    steps:
      - show: |
          <p>Đường khác: nhân hai ma trận thành <b>một</b> ma trận trước, rồi mới nhân với $(0, 1, 0)^T$, tức lấy cột 2 của tích.</p>
          <p>$$\mathbf{R}_z(90^\circ)\mathbf{R}_x(90^\circ) = \begin{bmatrix} 0 & -1 & 0 \\ 1 & 0 & 0 \\ 0 & 0 & 1 \end{bmatrix}\begin{bmatrix} 1 & 0 & 0 \\ 0 & 0 & -1 \\ 0 & 1 & 0 \end{bmatrix} = \begin{bmatrix} 0 & \hl{0} & 1 \\ 1 & \hl{0} & 0 \\ 0 & \hl{1} & 0 \end{bmatrix}$$</p>
        focus: [1, 2, 2, 2]
        say: "Để tự kiểm, ta đi đường khác, nhân hai ma trận thành một ma trận trước, rồi mới nhân với 0, 1, 0, tức lấy cột thứ hai của tích. Ma trận R x 90 độ có hàng giữa là 0, 0, âm 1 và hàng dưới là 0, 1, 0. Theo quy tắc hàng nhân cột, ta nhân từng hàng của R z với từng cột của R x, và được tích như trên màn hình. Cột thứ hai của tích là 0, 0, 1, khớp với kết quả bên trái ở ví dụ."
      - show: |
          <p>$$\mathbf{R}_x(90^\circ)\mathbf{R}_z(90^\circ) = \begin{bmatrix} 0 & \hl{-1} & 0 \\ 0 & \hl{0} & -1 \\ 1 & \hl{0} & 0 \end{bmatrix}$$</p>
          <p>Cột 2 là $(-1, 0, 0)^T$ ✓ — và hai tích khác nhau, nên thứ tự quay đổi kết quả.</p>
        focus: [1, 2, 2]
        say: "Làm tương tự với thứ tự ngược, R x nhân R z cho ma trận này. Vì nhân với 0, 1, 0 là lấy cột thứ hai, ta đọc ngay được âm 1, 0, 0, khớp với kết quả bên phải. Hai ma trận tích khác hẳn nhau, đó là bằng chứng bằng số rằng phép quay ba chiều không giao hoán."

  # ───────────────────────── 4. GÓC EULER ─────────────────────────
  - id: euler
    kind: concept
    title: "Góc Euler: ba số cho một hướng"
    checks:
      - "len([s for s in __import__('itertools').product('xyz', repeat=3) if s[0] != s[1] and s[1] != s[2]]) == 12"
      - "np.allclose(alg.rotz(30) @ alg.roty(0) @ alg.rotx(0), alg.rotz(30))"
    steps:
      - show: |
          <p>Một hướng bất kỳ ghép từ ba lần quay. Bài này dùng thứ tự Z-Y-X:</p>
          <p>$$\mathbf{R} = \mathbf{R}_z(\theta_z)\,\mathbf{R}_y(\theta_y)\,\mathbf{R}_x(\theta_x)$$</p>
          <p>Đọc từ phải sang trái: quay $\theta_x$ quanh $x$, rồi $\theta_y$ quanh $y$, rồi $\theta_z$ quanh $z$ — cả ba trục là trục <b>cố định</b> của khung thế giới.</p>
          <div class="box warn">Có 12 thứ tự trục (hai trục liền nhau phải khác nhau: $3 \cdot 2 \cdot 2$), và mỗi thứ tự còn hiểu theo trục cố định hay trục gắn trên vật. Luôn ghi rõ quy ước.</div>
        focus: [1, 2, 3, 3, 4, 4]
        say: "Một hướng bất kỳ trong không gian ghép được từ ba lần quay. Bài này dùng thứ tự Z Y X, R bằng R z nhân R y nhân R x. Đọc từ phải sang trái, ta quay theta x quanh trục x, rồi theta y quanh y, rồi theta z quanh z. Cả ba trục là trục cố định của khung thế giới. Chú ý, có tới 12 thứ tự trục, vì trục đầu có 3 cách chọn, hai trục sau mỗi trục 2 cách. Mỗi thứ tự lại còn hiểu theo trục cố định hay trục gắn trên vật, nên luôn phải ghi rõ quy ước đang dùng."

  # ───────────────────────── 5. KHOÁ GIMBAL ─────────────────────────
  - id: gimbal
    kind: concept
    title: "Khoá gimbal: khi góc giữa bằng 90°"
    checks:
      - "np.allclose(alg.rotz(30) @ alg.roty(90) @ alg.rotx(10), alg.rotz(50) @ alg.roty(90) @ alg.rotx(30))"
      - "np.allclose(alg.rotz(30) @ alg.roty(90) @ alg.rotx(10), alg.rotz(0) @ alg.roty(90) @ alg.rotx(-20))"
      - "np.allclose(np.round(alg.rotz(30) @ alg.roty(90) @ alg.rotx(10), 3), [[0, -0.342, 0.94], [0, 0.94, 0.342], [-1, 0, 0]])"
      - "abs(math.sin(math.radians(20)) - 0.342) < 5e-4 and abs(math.cos(math.radians(20)) - 0.94) < 5e-4"
      - "(lambda d: [np.linalg.matrix_rank(np.array([((alg.rotz(30 + e[0]) @ alg.roty(y + e[1]) @ alg.rotx(10 + e[2])) - alg.rotz(30) @ alg.roty(y) @ alg.rotx(10)).ravel() / d for e in ((d, 0, 0), (0, d, 0), (0, 0, d))]).T, tol=1e-4) for y in (90, 45)])(1e-6) == [2, 3]"
    steps:
      - show: |
          <p>Đặt $\theta_y = 90^\circ$. Hai bộ góc $(\theta_z, \theta_y, \theta_x) = (30^\circ, 90^\circ, 10^\circ)$ và $(50^\circ, 90^\circ, 30^\circ)$ cho <b>cùng một</b> ma trận:</p>
          <p>$$\begin{bmatrix} 0 & -0{,}342 & 0{,}94 \\ 0 & 0{,}94 & 0{,}342 \\ -1 & 0 & 0 \end{bmatrix}$$ với $0{,}342 \approx \sin 20^\circ$, $0{,}94 \approx \cos 20^\circ$.</p>
          <p>Ma trận chỉ phụ thuộc vào hiệu $\theta_x - \theta_z = -20^\circ$.</p>
        focus: [1, 1, 2, 3]
        say: "Bây giờ đặt góc giữa theta y bằng 90 độ. Hai bộ góc 30, 90, 10 và 50, 90, 30 cho ra cùng một ma trận. Các số 0 phẩy 342 và 0 phẩy 94 trong đó là sin và cos của 20 độ. Máy kiểm thấy lúc này ma trận chỉ phụ thuộc vào hiệu theta x trừ theta z, ở đây là âm 20 độ."
      - show: |
          <p>Vì sao? Sau khi $\mathbf{R}_y(90^\circ)$ đưa trục $x$ về đúng phương của trục $z$, quay quanh $x$ và quay quanh $z$ thành quay quanh <b>cùng một</b> phương.</p>
          <div class="box key">Ba góc nhưng chỉ còn hai hướng chuyển động độc lập: <b>mất một bậc tự do</b>. Đó là khoá gimbal.</div>
          <p class="note">Máy kiểm: nhích từng góc một chút rồi đếm xem ma trận đổi theo mấy hướng độc lập (con số này gọi là <b>hạng</b>): 2 khi $\theta_y = 90^\circ$, 3 khi $\theta_y = 45^\circ$.</p>
        focus: [1, 1, 2, 2, 3, 3]
        say: "Vì sao lại thế? Phép quay R y 90 độ đưa trục x về đúng phương của trục z. Khi đó quay quanh x và quay quanh z trở thành quay quanh cùng một phương. Ta còn ba góc, nhưng chỉ còn hai hướng chuyển động độc lập, tức mất một bậc tự do, và đó gọi là khoá gimbal. Máy kiểm bằng cách nhích từng góc một chút, rồi đếm xem ma trận đổi theo mấy hướng độc lập, con số này gọi là hạng. Hạng chỉ còn 2 khi theta y bằng 90 độ, còn với 45 độ thì đủ 3."
      - clear: true
        show: |
          <p>Hậu quả: gần $\theta_y = 90^\circ$, một thay đổi hướng nhỏ có thể đòi $\theta_x$, $\theta_z$ đổi rất lớn; bộ điều khiển hay bộ nội suy góc sẽ giật.</p>
          <div class="box">Khoá gimbal là chỗ hỏng của <b>cách ghi ba góc</b>, không phải của vật. Vật vẫn quay được mọi hướng.</div>
        focus: [1, 2, 2]
        say: "Hậu quả là ở gần 90 độ, một thay đổi hướng rất nhỏ có thể đòi theta x và theta z thay đổi rất lớn, làm bộ điều khiển hay bộ nội suy góc bị giật. Cần nhớ, khoá gimbal là chỗ hỏng của cách ghi bằng ba góc, không phải của vật. Bản thân vật vẫn quay được về mọi hướng."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "not np.allclose(alg.rotz(90) @ alg.rotx(90), alg.rotx(90) @ alg.rotz(90))"
      - "not np.allclose(alg.rotx(30) @ alg.roty(40), alg.rotx(70) @ alg.roty(0))"
      - "np.allclose(alg.roty(30) @ [0, 0, 1], [0.5, 0, 3 ** 0.5 / 2])"
      - "np.allclose(alg.rotz(90) @ alg.roty(90) @ alg.rotx(0) @ [1, 0, 0], [0, 0, -1]) and np.allclose(alg.rotx(0) @ alg.roty(90) @ alg.rotz(90) @ [1, 0, 0], [0, 1, 0])"
      - "np.allclose(alg.roty(30), [[math.cos(math.radians(30)), 0, math.sin(math.radians(30))], [0, 1, 0], [-math.sin(math.radians(30)), 0, math.cos(math.radians(30))]])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đọc tích ma trận từ trái sang phải <b class="red">(sai)</b>
          <br><span class="note">Trong $\mathbf{R}_z\mathbf{R}_y\mathbf{R}_x\mathbf{v}$, phép quay quanh $x$ tác động trước.</span></div>
        say: "Lỗi thứ nhất, đọc tích ma trận từ trái sang phải. Trong R z nhân R y nhân R x nhân v, phép quay quanh x tác động trước tiên."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Không ghi quy ước góc Euler <b class="red">(thiếu)</b>
          <br><span class="note">Cùng ba con số, thứ tự Z-Y-X và X-Y-Z cho hai hướng khác nhau. Ghi rõ thứ tự và trục cố định hay trục động.</span></div>
          <table class="t"><tr><th>$(\theta_z, \theta_y, \theta_x) = (90^\circ, 90^\circ, 0^\circ)$</th><th>trục $(1, 0, 0)^T$ đi tới</th></tr>
          <tr><td>Z-Y-X: $\mathbf{R}_z\mathbf{R}_y\mathbf{R}_x$</td><td>$(0, 0, -1)^T$</td></tr>
          <tr><td>X-Y-Z: $\mathbf{R}_x\mathbf{R}_y\mathbf{R}_z$</td><td>$(0, 1, 0)^T$</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ hai, đưa ba góc mà không ghi quy ước. Cùng ba con số, thứ tự Z Y X và X Y Z cho hai hướng khác nhau, nên phải ghi rõ thứ tự và loại trục. Ví dụ với theta z và theta y cùng bằng 90 độ, theta x bằng 0, trục x đi tới âm z theo thứ tự Z Y X, nhưng đi tới y theo thứ tự X Y Z."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Cộng góc quanh các trục khác nhau <b class="red">(sai)</b>
          <br><span class="note">$\mathbf{R}_x(30^\circ)\mathbf{R}_y(40^\circ)$ không phải “quay $70^\circ$” theo trục nào cả. Chỉ quay quanh <b>cùng một</b> trục mới cộng góc được.</span></div>
        say: "Lỗi thứ ba, cộng các góc quay quanh những trục khác nhau. Quay 30 độ quanh x rồi 40 độ quanh y không phải là quay 70 độ theo trục nào cả. Chỉ khi quay quanh cùng một trục, góc mới cộng được."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Chép $\mathbf{R}_y$ theo mẫu của $\mathbf{R}_x$, $\mathbf{R}_z$ <b class="red">(sai dấu)</b>
          <br><span class="note">$\mathbf{R}_y$ có $+\sin\theta$ ở hàng trên. Kiểm: $\mathbf{R}_y(30^\circ)(0, 0, 1)^T = (0{,}5;\ 0;\ 0{,}866)^T$ — $z$ nghiêng về phía $+x$.</span></div>
          <p>$$\mathbf{R}_y(\theta) = \begin{bmatrix} \cos\theta & 0 & \hl{\sin\theta} \\ 0 & 1 & 0 \\ \hl{-\sin\theta} & 0 & \cos\theta \end{bmatrix}$$</p>
        focus: [1, 2, 1]
        say: "Lỗi thứ tư, chép R y theo đúng mẫu của R x và R z, làm sai dấu. R y có cộng sin theta ở hàng trên. Kiểm nhanh, quay trục z đi 30 độ quanh y được 0 phẩy 5, 0, 0 phẩy 866, tức z nghiêng về phía x dương."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "np.allclose(alg.rotz(90) @ alg.rotx(90) @ [1, 0, 0], [0, 1, 0]) and np.allclose(alg.rotx(90) @ alg.rotz(90) @ [1, 0, 0], [0, 0, 1])"
      - "np.allclose(alg.rotz(10) @ alg.roty(90) @ alg.rotx(40), alg.rotz(0) @ alg.roty(90) @ alg.rotx(30))"
      - "40 - 10 == 30 and 0 + 30 == 30"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $\mathbf{R}_z(90^\circ)\mathbf{R}_x(90^\circ)(1, 0, 0)^T$ và $\mathbf{R}_x(90^\circ)\mathbf{R}_z(90^\circ)(1, 0, 0)^T$.</td></tr>
          <tr><td>2</td><td>Với $\theta_y = 90^\circ$ và $(\theta_z, \theta_x) = (10^\circ, 40^\circ)$, tìm bộ góc khác có $\theta_z = 0^\circ$ cho cùng ma trận.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tính hai tích với trục x, một là quay quanh x rồi quanh z, hai là quay quanh z rồi quanh x. Câu hai, với theta y bằng 90 độ, theta z bằng 10 độ và theta x bằng 40 độ, hãy tìm một bộ góc khác có theta z bằng 0 cho cùng ma trận. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>tích</th><th>làm trước</th><th>làm sau</th><th>kết quả</th></tr>
          <tr><td>$\mathbf{R}_z\mathbf{R}_x(1, 0, 0)^T$</td><td>quanh $x$: $x$ là tâm, đứng yên</td><td>quanh $z$: $x$ sang $y$</td><td>$\hl{(0, 1, 0)^T}$</td></tr>
          <tr><td>$\mathbf{R}_x\mathbf{R}_z(1, 0, 0)^T$</td><td>quanh $z$: $x$ sang $y$</td><td>quanh $x$: $y$ lên $z$</td><td>$\hl{(0, 0, 1)^T}$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Đáp án câu một, với tích thứ nhất, quay quanh x giữ nguyên trục x, rồi quay quanh z đưa x sang y, được 0, 1, 0. Thứ tự kia, quay quanh z đưa x sang y trước, rồi quay quanh x đưa y lên z, được 0, 0, 1."
      - show: |
          <p>② Khi $\theta_y = 90^\circ$, ma trận chỉ phụ thuộc vào hiệu $\theta_x - \theta_z = 40^\circ - 10^\circ = 30^\circ$.</p>
          <p>Chọn $\theta_z = 0^\circ$ thì $\theta_x = 0^\circ + 30^\circ$: $(\theta_z, \theta_y, \theta_x) = \hl{(0^\circ, 90^\circ, 30^\circ)}$.</p>
        focus: [1, 2, 2]
        say: "Câu hai, khi theta y bằng 90 độ thì ma trận chỉ phụ thuộc vào hiệu theta x trừ theta z, ở đây là 40 trừ 10, bằng 30 độ. Muốn theta z bằng 0 thì theta x phải bằng 30 để giữ nguyên hiệu đó. Vậy bộ góc 0, 90, 30 cho cùng ma trận, máy đã kiểm hai ma trận trùng nhau."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$\mathbf{R}_x$, $\mathbf{R}_y$, $\mathbf{R}_z$</span><span class="a">→</span>
          <span class="n">ghép: áp dụng từ phải sang trái</span><span class="a">→</span>
          <span class="n">không giao hoán</span><span class="a">→</span>
          <span class="n">ba góc Euler, khoá gimbal ở $90^\circ$</span></div>
        say: "Tổng kết lại, ta có ba ma trận quay quanh ba trục. Ghép chúng thì áp dụng từ phải sang trái, và thứ tự làm đổi kết quả. Ba góc Euler ghi được mọi hướng, nhưng khi góc giữa bằng 90 độ thì mất một bậc tự do, gọi là khoá gimbal."
      - show: |
          <div class="box key"><b>Tư duy:</b> một cách ghi số có thể hỏng dù thứ được ghi không hỏng. Khi tính toán giật bất thường, hãy nghi cách biểu diễn trước.</div>
        say: "Điều cần mang theo, một cách ghi bằng số có thể hỏng dù thứ được ghi hoàn toàn bình thường. Khi phép tính giật bất thường, hãy nghi ngờ cách biểu diễn trước."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>quaternion đơn vị</b> — bốn con số ghi hướng mà không bị khoá gimbal.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học quaternion đơn vị, một cách ghi hướng bằng bốn con số mà không bị khoá gimbal. Hẹn gặp bạn ở bài tiếp theo."
