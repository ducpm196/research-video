id: L11
course: RBM
series: "RBM · Toán cho robot và hệ động lực"
title: "Bài 11 — Rời rạc hoá và ổn định số"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rbm.yaml L11; audit/rbm/verify_rbm.py L11; R. L. Burden, J. D. Faires, Numerical Analysis (2011), mục 5.10–5.11"
assumes: [arith, cdot, vec, mat, sub, identity, lambda, prime, exp, absval, eta, frac, approx, power, iff, implies, dots]
# Quy ước như bài 7: Euler x_{k+1} = x_k + h f(x_k); hệ thử x' = −a x với a > 0 (nghiệm đúng luôn giảm về 0).
#   Hệ số nhân mỗi bước 1 − h a; hệ nhiều chiều: I + h A, trị riêng 1 + h λ. Gradient Descent như CS115 bài 9:
#   w_{k+1} = w_k − η f'(w_k). Mọi số do alg.euler_ode / numpy.linalg.eigvals tính.
objectives:
  - "Tìm điều kiện bước để Euler ổn định: 0 < h < 2/a"
  - "Với hệ nhiều chiều, thấy trị riêng nhanh nhất quyết định bước"
  - "Thấy tốc độ học của Gradient Descent (bước ngược độ dốc để tìm đáy của hàm) tuân cùng điều kiện bước"
asr_reviewed:
  - {sentence: "Vậy hệ liên tục ổn định với mọi a dương, nhưng mô phỏng bằng Euler chỉ ổn định khi bước nhỏ hơn 2 chia a.", reason: "ASR chép “Vậy hệ liên tục ổn định với mọi a dương, nhưng mô phỏng bằng ơ le chỉ ổn định khi bước nhỏ hơn hai chia.” (0.98): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "W đổi dấu mỗi bước là dấu hiệu hệ số đã âm, tức tốc độ học đã quá 1 chia a.", reason: "ASR chép “Về đúc đổi dấu mỗi bước là dấu hiệu hệ số đà âm, tức tốc độ học đã quá một chia.” (0.857): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: đã/đà — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ngưỡng nằm đúng giữa hai bước này, nên kết quả khớp với công thức 2 chia a.", reason: "ASR chép “Ngưỡng nằm đúng giữa hai bước này nên kết quả khớp với công thức Hai Chia.” (0.97): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với bước h bằng 0 phẩy 05, hệ số bằng 0 phẩy 5, nên dãy hội tụ êm.", reason: "ASR chép “bước hát bằng 0.005, hệ số bằng 0.005 … hội tụi em”: ASR chuẩn hoá “không phẩy …” thành số theo kiểu riêng (cả hai số bị viết 0.005), h đọc tên chữ cái “hát”; hai số 0,05 và 0,5 hiện trên màn hình — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nói cách khác, Gradient Descent là Euler chạy trên dòng chảy xuống dốc, w phẩy bằng âm đạo hàm của f.", reason: "Gradient Descent đọc “grê-đi-ần đi-xen” (lexicon chung 6/6); ASR chép “gradient descent”: đúng; Euler → “ơ le”, w → “về kép”, f → “ép” là tên chữ cái kiểu Việt; chảy/chạy, phẩy/phải là nhầm thanh đã gặp ở bảng tham khảo — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tốc độ học của Gradient Descent tuân theo cùng một luật.", reason: "Descent đọc “đi-xen” (lexicon chung; medium chép “Descent” khi dò) → ASR chép “đi xem”: cùng âm, lệch âm cuối; “một luật” → “mục lực”: âm cuối t → c và lực/luật — NOT_VERIFIED bằng tai người"}
