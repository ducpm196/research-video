scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hệ ổn định, mô phỏng lại nổ tung"
    steps:
      - show: |
          <p>$x' = -10x$: nghiệm đúng $e^{-10t}$ giảm êm về 0. Chạy Euler với $h = 0{,}25$: $1;\ -1{,}5;\ 2{,}25;\ -3{,}375 \dots$ — nổ tung.</p>
          <p>Bộ điều khiển trên máy tính cũng chỉ chạy theo từng bước thời gian như vậy.</p>
          <div class="box key">Hôm nay: <b>rời rạc hoá</b> biến hệ liên tục thành hệ từng bước, và <b>điều kiện ổn định số</b> cho bước $h$.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, hệ x phẩy bằng âm 10 x có nghiệm đúng e mũ âm 10 t, giảm êm về 0. Thế nhưng chạy Euler với h bằng 0 phẩy 25, ta được 1, âm 1 phẩy 5, 2 phẩy 25, âm 3 phẩy 375, nổ tung. Bộ điều khiển chạy trên máy tính cũng chỉ làm việc theo từng bước thời gian như vậy. Hôm nay ta học rời rạc hoá, biến hệ liên tục thành hệ từng bước, và điều kiện ổn định số cho bước h."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: một bước Euler, và nhân mãi với cùng một số"
    checks:
      - "round(1 + 0.1 * (-1 * 1), 6) == 0.9 and alg.euler_ode(lambda t, x: -x, 1.0, 0.1, 1)[-1] == 0.9"
      - "[round(0.5 ** k, 4) for k in (1, 2, 3)] == [0.5, 0.25, 0.125] and [round((-0.5) ** k, 4) for k in (1, 2, 3)] == [-0.5, 0.25, -0.125]"
      - "[round((-1.5) ** k, 4) for k in (1, 2, 3)] == [-1.5, 2.25, -3.375] and abs(-0.6) == 0.6"
    steps:
      - show: |
          <p>Ở bài 7, Euler đi một bước: <b>giá trị mới = giá trị cũ + $h$ nhân độ dốc tại giá trị cũ</b>.</p>
          <p>$$x' = -x,\ x_0 = 1,\ h = 0{,}1:\quad x_1 = 1 + 0{,}1 \cdot (-1) = 0{,}9$$</p>
        focus: [1, 2, 2]
        say: "Trước khi vào bài, ta ôn hai điều. Điều thứ nhất, ở bài 7, phương pháp Euler đi một bước bằng cách lấy giá trị cũ cộng h nhân độ dốc tại giá trị cũ. Ví dụ với x phẩy bằng âm x, bắt đầu từ 1 và bước h bằng 0 phẩy 1, độ dốc là âm 1, nên giá trị mới bằng 1 trừ 0 phẩy 1, tức 0 phẩy 9."
      - show: |
          <p>Nhân mãi với cùng một số $q$: $x_k = q^k x_0$. Với $x_0 = 1$:</p>
          <table class="t"><tr><th>$q$</th><th>$k = 1$</th><th>$k = 2$</th><th>$k = 3$</th><th>dãy</th></tr>
          <tr><td>$0{,}5$</td><td>$0{,}5$</td><td>$0{,}25$</td><td>$0{,}125$</td><td>nhỏ dần</td></tr>
          <tr><td>$-0{,}5$</td><td>$-0{,}5$</td><td>$0{,}25$</td><td>$-0{,}125$</td><td>nhỏ dần, đổi dấu</td></tr>
          <tr><td>$-1{,}5$</td><td>$-1{,}5$</td><td>$2{,}25$</td><td>$-3{,}375$</td><td>lớn dần, đổi dấu</td></tr></table>
          <p class="note">Quyết định là <b>trị tuyệt đối</b> $\lvert q \rvert$ (bỏ dấu trừ): $\lvert -0{,}5 \rvert = 0{,}5 < 1$ nên nhỏ dần; $\lvert -1{,}5 \rvert = 1{,}5 > 1$ nên lớn dần.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Điều thứ hai, nếu mỗi bước ta nhân với cùng một số q, thì sau k bước giá trị là q mũ k nhân giá trị đầu. Với q bằng 0 phẩy 5, dãy là 0 phẩy 5, 0 phẩy 25, 0 phẩy 125, nhỏ dần. Với q bằng âm 0 phẩy 5, dãy cũng nhỏ dần nhưng đổi dấu mỗi bước. Với q bằng âm 1 phẩy 5, dãy là âm 1 phẩy 5, 2 phẩy 25, âm 3 phẩy 375, lớn dần. Cái quyết định là trị tuyệt đối của q, tức bỏ dấu trừ đi, nhỏ hơn 1 thì dãy tắt, lớn hơn 1 thì dãy nổ."

  # ───────────────────────── 2. CÔNG THỨC ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hệ số nhân mỗi bước"
    checks:
      - "all(abs(alg.euler_ode(lambda t, x: -a * x, 1.0, h, 1)[-1] - (1 - h * a)) < 1e-12 for a in (1, 4, 10) for h in (0.05, 0.1, 0.3))"
      - "all((abs(1 - h * 10) < 1) == (0 < h < 0.2) for h in [k / 1000 for k in range(1, 400)])"
      - "round(math.exp(-10 * 0.25), 3) == 0.082 and all(0 < math.exp(-10 * h) < 1 for h in (0.01, 0.25, 1, 10))"
    steps:
      - show: |
          <p>Euler cho $x' = -a x$: $\quad x_{k+1} = x_k + h \cdot (-a x_k) = (1 - h a)\,x_k$.</p>
          <p>Đây là hệ rời rạc một chiều với trị riêng $1 - ha$. Theo bài 9, nó ổn định $\iff \lvert 1 - ha \rvert < 1$.</p>
          <p>$-1 < 1 - ha < 1 \iff 0 < ha < 2 \iff \hl{0 < h < \dfrac{2}{a}}$</p>
          <div class="box key">Hệ liên tục ổn định với mọi $a > 0$, nhưng mô phỏng <b>bằng Euler</b> chỉ ổn định khi bước <b>nhỏ hơn</b> $2/a$.</div>
          <p class="note">Điều kiện này là của Euler. Cách rời rạc hoá chính xác $x_{k+1} = e^{-ah}x_k$ (với $a = 10$, $h = 0{,}25$: hệ số $e^{-2{,}5} \approx 0{,}082$) ổn định với mọi $h$.</p>
        focus: [1, 2, 2, 3, 4, 5, 5]
        say: "Áp dụng Euler cho x phẩy bằng âm a x, ta được x k cộng 1 bằng x k cộng h nhân âm a x k, tức 1 trừ h a nhân x k. Đây là một hệ rời rạc một chiều có trị riêng 1 trừ h a. Theo bài 9, hệ rời rạc ổn định khi và chỉ khi trị tuyệt đối của trị riêng nhỏ hơn 1. Giải bất đẳng thức, trừ 1 rồi đổi dấu, ta được h a nằm giữa 0 và 2, rồi chia cho a dương, tức h nhỏ hơn 2 chia a. Vậy hệ liên tục ổn định với mọi a dương, nhưng mô phỏng bằng Euler chỉ ổn định khi bước nhỏ hơn 2 chia a. Điều kiện bước nhỏ hơn 2 chia a là giới hạn của riêng phương pháp Euler, không phải của bản thân hệ liên tục. Cách rời rạc hoá chính xác nhân mỗi bước với e mũ âm a h, ổn định với mọi bước, ví dụ a bằng 10 và h bằng 0 phẩy 25 cho hệ số khoảng 0 phẩy 082."

  - id: intuition
    kind: intuition
    title: "Hình dung: hệ số trượt ra khỏi vùng ổn định"
    checks:
      - "[round(1 - 10 * h, 6) for h in (0, 0.05, 0.15, 0.2, 0.25)] == [1.0, 0.5, -0.5, -1.0, -1.5]"
      - "round((1 - 10 * 0.3) - (1 - 10 * 0.2), 6) == -1.0 and 2 / 10 == 0.2"
    steps:
      - show: |
          <div><svg width="1160" height="340" viewBox="0 0 1160 340"><defs><marker id="rk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="370" y="130" width="560" height="120" fill="#dcfce7"/><text x="650" y="120" font-size="22" text-anchor="middle" fill="#15803d" font-weight="bold">vùng ổn định: trị tuyệt đối của hệ số nhỏ hơn 1</text><line x1="62.0" y1="190" x2="1056.0" y2="190" stroke="#6b7280" stroke-width="3"/><line x1="90" y1="182" x2="90" y2="198" stroke="#6b7280" stroke-width="3"/><text x="90" y="224" font-size="22" text-anchor="middle" fill="#6b7280">−2</text><line x1="230.0" y1="182" x2="230.0" y2="198" stroke="#6b7280" stroke-width="3"/><text x="230.0" y="224" font-size="22" text-anchor="middle" fill="#6b7280">−1,5</text><line x1="370" y1="182" x2="370" y2="198" stroke="#6b7280" stroke-width="3"/><text x="370" y="224" font-size="22" text-anchor="middle" fill="#6b7280">−1</text><line x1="510.0" y1="182" x2="510.0" y2="198" stroke="#6b7280" stroke-width="3"/><text x="510.0" y="224" font-size="22" text-anchor="middle" fill="#6b7280">−0,5</text><line x1="650" y1="182" x2="650" y2="198" stroke="#6b7280" stroke-width="3"/><text x="650" y="224" font-size="22" text-anchor="middle" fill="#6b7280">0</text><line x1="790.0" y1="182" x2="790.0" y2="198" stroke="#6b7280" stroke-width="3"/><text x="790.0" y="224" font-size="22" text-anchor="middle" fill="#6b7280">0,5</text><line x1="930" y1="182" x2="930" y2="198" stroke="#6b7280" stroke-width="3"/><text x="930" y="224" font-size="22" text-anchor="middle" fill="#6b7280">1</text><circle cx="790.0" cy="190" r="11" fill="#2a78d6"/><text x="790.0" y="168" font-size="22" text-anchor="middle" fill="#2a78d6" font-weight="bold">h = 0,05</text><circle cx="510.0" cy="190" r="11" fill="#2a78d6"/><text x="510.0" y="168" font-size="22" text-anchor="middle" fill="#2a78d6" font-weight="bold">h = 0,15</text><circle cx="370" cy="190" r="11" fill="#eb6834"/><text x="370" y="168" font-size="22" text-anchor="middle" fill="#eb6834" font-weight="bold">h = 0,2</text><circle cx="230.0" cy="190" r="11" fill="#b91c1c"/><text x="230.0" y="168" font-size="22" text-anchor="middle" fill="#b91c1c" font-weight="bold">h = 0,25</text><circle cx="930" cy="190" r="11" fill="#6b7280"/><text x="930" y="168" font-size="22" text-anchor="middle" fill="#6b7280" font-weight="bold">h = 0</text><line x1="930" y1="260" x2="174.0" y2="260" stroke="#1f2937" stroke-width="3" marker-end="url(#rk)"/><text x="552.0" y="290" font-size="22" text-anchor="middle" fill="#1f2937">h tăng thêm 0,1 thì hệ số 1 − 10h lùi sang trái 1 đơn vị</text><text x="552.0" y="322" font-size="22" text-anchor="middle" fill="#b91c1c" font-weight="bold">qua mốc −1 đúng lúc h = 2/10 = 0,2: từ đó dãy nổ</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này đặt hệ số nhân mỗi bước lên một trục số, với a bằng 10, hệ số là 1 trừ 10 h. Dải màu xanh lá từ âm 1 đến 1 là vùng ổn định, hệ số nằm trong đó thì dãy tắt dần. Khi h bằng 0, hệ số bằng 1, và mỗi khi h tăng thêm 0 phẩy 1 thì hệ số lùi sang trái một đơn vị. Nó chạm mốc âm 1 đúng lúc h bằng 0 phẩy 2, và vượt qua mốc đó thì mô phỏng nổ tung."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "a = 10: ngưỡng h = 0,2"
    checks:
      - "[round(1 - h * 10, 6) for h in (0.25, 0.2, 0.15, 0.05)] == [-1.5, -1.0, -0.5, 0.5]"
      - "[round(v, 4) for v in alg.euler_ode(lambda t, x: -10 * x, 1.0, 0.25, 3)] == [1.0, -1.5, 2.25, -3.375]"
      - "[round(v, 4) for v in alg.euler_ode(lambda t, x: -10 * x, 1.0, 0.05, 3)] == [1.0, 0.5, 0.25, 0.125]"
      - "[round(v, 4) for v in alg.euler_ode(lambda t, x: -10 * x, 1.0, 0.2, 3)] == [1.0, -1.0, 1.0, -1.0]"
      - "round(1 - 10 * 0.25, 6) == -1.5 and round(-1.5 * -1.5, 6) == 2.25 and round(2.25 * -1.5, 6) == -3.375"
      - "[round(v, 2) for v in alg.euler_ode(lambda t, x: -10 * x, 1.0, 0.25, 6)[4:]] == [5.06, -7.59, 11.39]"
    steps:
