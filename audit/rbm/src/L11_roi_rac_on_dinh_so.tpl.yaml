          <p><b>Bước 1 —</b> $a = 10$, $h = 0{,}25$: hệ số $1 - 10 \cdot 0{,}25 = 1 - 2{,}5 = \hl{-1{,}5}$.</p>
        say: "Bước một, với a bằng 10 và h bằng 0 phẩy 25, hệ số nhân mỗi bước là 1 trừ 10 nhân 0 phẩy 25, tức 1 trừ 2 phẩy 5, bằng âm 1 phẩy 5."
      - show: |
          <p><b>Bước 2 —</b> nhân liên tiếp từ $x_0 = 1$: $x_1 = -1{,}5$; $x_2 = (-1{,}5)(-1{,}5) = 2{,}25$; $x_3 = 2{,}25 \cdot (-1{,}5) = -3{,}375$.</p>
        say: "Bước hai, nhân liên tiếp từ 1, ta được âm 1 phẩy 5, rồi âm 1 phẩy 5 nhân âm 1 phẩy 5 bằng 2 phẩy 25, rồi nhân tiếp được âm 3 phẩy 375. Đó đúng là dãy nổ tung ở đầu bài."
      - clear: true
        show: |
          <table class="t"><tr><th>bước $h$</th><th>hệ số $1 - 10h$</th><th>kết quả</th></tr>
          <tr><td>0,25</td><td>$-1{,}5$</td><td>dao động, lớn dần — phân kỳ</td></tr>
          <tr><td>0,2</td><td>$-1$</td><td>dao động mãi $1, -1, 1, \dots$</td></tr>
          <tr><td>0,15</td><td>$-0{,}5$</td><td>hội tụ nhưng đổi dấu mỗi bước</td></tr>
          <tr><td>0,05</td><td>$0{,}5$</td><td>hội tụ êm</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Với a bằng 10, ngưỡng là 2 chia 10, tức 0 phẩy 2. Với h bằng 0 phẩy 25, hệ số là âm 1 phẩy 5, dãy dao động và lớn dần. Đúng ngưỡng 0 phẩy 2, hệ số là âm 1, dãy dao động mãi giữa 1 và âm 1. Với 0 phẩy 15, hệ số âm 0 phẩy 5, dãy hội tụ nhưng đổi dấu mỗi bước, khác hẳn nghiệm thật. Với bước h bằng 0 phẩy 05, hệ số bằng 0 phẩy 5, nên dãy hội tụ êm."
      - clear: true
        show: |
          <div>{{STEPS}}</div>
          <p class="note">Đường cam bị cắt ở mép khung từ bước 3; giá trị thật là $-3{,}375;\ 5{,}06;\ -7{,}59;\ 11{,}39$ — lớn dần. Muốn mô phỏng giống thật (không đổi dấu), cần thêm $1 - ha > 0$, tức $h < 1/a$.</p>
        focus: [1, 2, 2]
        say: "Trên hình, đường cam với h bằng 0 phẩy 25 nhảy qua lại và lớn dần, đường xanh với h bằng 0 phẩy 05 giảm êm. Từ bước 3, đường cam đã vượt ra ngoài khung hình, giá trị thật là âm 3 phẩy 375, rồi 5 phẩy 06, âm 7 phẩy 59 và 11 phẩy 39. Muốn mô phỏng giống thật, không đổi dấu, ta cần thêm 1 trừ h a dương, tức h nhỏ hơn 1 chia a."

  - id: check
    kind: check
    title: "Tự kiểm: chạy thẳng công thức Euler, thử hai bên ngưỡng"
    checks:
      - "round(1 + 0.05 * (-10 * 1), 6) == 0.5 and round(0.5 + 0.05 * (-10 * 0.5), 6) == 0.25 and round(0.5 ** 2, 6) == 0.25"
      - "round(1 - 10 * 0.19, 6) == -0.9 and round(1 - 10 * 0.21, 6) == -1.1 and round(0.9 ** 10, 3) == 0.349 and round(1.1 ** 10, 3) == 2.594"
      - "abs(alg.euler_ode(lambda t, x: -10 * x, 1.0, 0.19, 10)[-1]) < 0.35 and abs(alg.euler_ode(lambda t, x: -10 * x, 1.0, 0.21, 10)[-1]) > 2.59"
    steps:
      - show: |
          <p>Đường thứ nhất: không dùng hệ số, đi thẳng công thức Euler với $h = 0{,}05$.</p>
          <table class="t"><tr><th>bước</th><th>độ dốc $-10x$</th><th>giá trị mới</th></tr>
          <tr><td>$x_1$</td><td>$-10 \cdot 1 = -10$</td><td>$1 + 0{,}05 \cdot (-10) = 0{,}5$</td></tr>
          <tr><td>$x_2$</td><td>$-10 \cdot 0{,}5 = -5$</td><td>$0{,}5 + 0{,}05 \cdot (-5) = 0{,}25$</td></tr></table>
          <p class="note">Khớp với nhân hệ số: $0{,}5^2 = 0{,}25$ ✓</p>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Làm sao biết bảng ở trên đúng? Đường thứ nhất, bỏ hệ số đi, chạy thẳng công thức Euler với h bằng 0 phẩy 05. Tại 1, độ dốc là âm 10, thay vào thì giá trị mới là 1 cộng 0 phẩy 05 nhân âm 10, bằng 0 phẩy 5. Tại 0 phẩy 5, độ dốc là âm 5, giá trị mới bằng 0 phẩy 25. Kết quả khớp với cách nhân hệ số, 0 phẩy 5 bình phương cũng bằng 0 phẩy 25."
      - show: |
          <p>Đường thứ hai: thử hai bước sát hai bên ngưỡng 0,2, chạy 10 bước từ $x_0 = 1$.</p>
          <table class="t"><tr><th>$h$</th><th>hệ số</th><th>độ lớn sau 10 bước</th><th>kết luận</th></tr>
          <tr><td>0,19</td><td>$-0{,}9$</td><td>$0{,}9^{10} \approx 0{,}349$</td><td>tắt dần ✓</td></tr>
          <tr><td>0,21</td><td>$-1{,}1$</td><td>$1{,}1^{10} \approx 2{,}594$</td><td>lớn dần ✓</td></tr></table>
        focus: [1, "2.2", "2.3", 2]
        say: "Đường thứ hai, thử hai bước nằm sát hai bên ngưỡng 0 phẩy 2 và chạy 10 bước. Với h bằng 0 phẩy 19, hệ số là âm 0 phẩy 9, sau 10 bước độ lớn chỉ còn khoảng 0 phẩy 349. Với h bằng 0 phẩy 21, hệ số là âm 1 phẩy 1, sau 10 bước độ lớn đã lên khoảng 2 phẩy 594. Ngưỡng nằm đúng giữa hai bước này, nên kết quả khớp với công thức 2 chia a."

  # ───────────────────────── 4. NHIỀU CHIỀU ─────────────────────────
  - id: system
    kind: concept
    title: "Hệ nhiều chiều: trị riêng nhanh nhất quyết định"
    checks:
      - "np.allclose(sorted(np.abs(np.linalg.eigvals(np.eye(2) + 0.9 * np.array([[0, 1], [-2, -3]])))), [0.1, 0.8])"
      - "np.allclose(sorted(np.abs(np.linalg.eigvals(np.eye(2) + 1.1 * np.array([[0, 1], [-2, -3]])))), [0.1, 1.2])"
      - "np.linalg.norm(np.linalg.matrix_power(np.eye(2) + 1.1 * np.array([[0, 1], [-2, -3]]), 200) @ [1, 0]) > 1e10"
    steps:
      - show: |
          <p>$\mathbf{x}' = \mathbf{A}\mathbf{x}$, Euler: $\mathbf{x}_{k+1} = (\mathbf{I}_2 + h\mathbf{A})\,\mathbf{x}_k$, trị riêng $1 + h\lambda$, vì nếu $\mathbf{A}\mathbf{v} = \lambda\mathbf{v}$ thì $(\mathbf{I}_2 + h\mathbf{A})\mathbf{v} = \mathbf{v} + h\lambda\mathbf{v} = (1 + h\lambda)\mathbf{v}$ ($\mathbf{I}_2$: ma trận đơn vị, nhân vào không đổi gì).</p>
          <p>Cần $\lvert 1 + h\lambda \rvert < 1$ cho <b>mọi</b> trị riêng. Với $\mathbf{A}$ của bài 9 ($\lambda = -1, -2$): trị riêng nhanh nhất $-2$ đòi $h < 1$.</p>
          <table class="t"><tr><th>$h$</th><th>độ lớn hai trị riêng của $\mathbf{I}_2 + h\mathbf{A}$</th><th>kết luận</th></tr><tr><td>$0{,}9$</td><td>$0{,}1$ và $0{,}8$</td><td>ổn định</td></tr><tr><td>$1{,}1$</td><td>$0{,}1$ và $1{,}2$</td><td>phân kỳ</td></tr></table>
          <div class="box key">Phần chậm nhất quyết định phải mô phỏng bao lâu; phần <b>nhanh nhất</b> quyết định bước được lớn bao nhiêu. Hai phần cách xa nhau là hệ cứng (bài 8): bước phải nhỏ theo phần nhanh dù ta chỉ cần theo dõi phần chậm.</div>
        focus: [1, 1, 2, 2, 3, 4, 4]
        say: "Với hệ nhiều chiều x phẩy bằng A x, Euler cho x k cộng 1 bằng I cộng h A, nhân x k, và trị riêng là 1 cộng h lambda. Đó là vì nếu A nhân vector riêng v bằng lambda v, thì I cộng h A nhân v bằng v cộng h lambda v, tức 1 cộng h lambda nhân v. Ta cần trị tuyệt đối của 1 cộng h lambda nhỏ hơn 1 cho mọi trị riêng. Với ma trận của bài 9 có trị riêng âm 1 và âm 2, trị riêng nhanh nhất âm 2 đòi h nhỏ hơn 1. Thử với h bằng 0 phẩy 9, hai trị riêng có độ lớn 0 phẩy 1 và 0 phẩy 8, ổn định, còn h bằng 1 phẩy 1 cho 1 phẩy 2, phân kỳ. Như vậy phần chậm nhất quyết định phải mô phỏng bao lâu, còn phần nhanh nhất quyết định bước được lớn bao nhiêu. Khi hai phần cách xa nhau, đó chính là hệ cứng ở bài 8, bước phải nhỏ theo phần nhanh dù ta chỉ cần theo dõi phần chậm."

  # ───────────────────────── 5. GRADIENT DESCENT ─────────────────────────
  - id: gd
    kind: concept
    title: "Cùng một bài toán: tốc độ học của Gradient Descent"
    checks:
      - "(lambda run: [round(v, 4) for v in run(0.15)] == [1.0, -0.5, 0.25, -0.125] and [round(v, 4) for v in run(0.25)] == [1.0, -1.5, 2.25, -3.375])(lambda eta: [1.0 * (1 - eta * 10) ** k for k in range(4)])"
      - "round(1 - 0.05 * 10, 9) == 0.5 and round(5 * 0.5 ** 2, 9) == 1.25 and round(1 - 0.25 * 10, 9) == -1.5 and round(5 * 1.5 ** 2, 9) == 11.25 and 5 * 1 ** 2 == 5"
      - "all(abs((w - eta * 10 * w) - alg.euler_ode(lambda t, x: -10 * x, w, eta, 1)[-1]) < 1e-12 for w in (1.0, -2.0) for eta in (0.05, 0.15, 0.25))"
    steps:
      - show: |
          <p><b>Bài toán tìm đáy</b> của một hàm $f(w)$, ví dụ $f(w) = 5w^2$ có đáy ở $w = 0$. Đứng ở $w$, đo độ dốc $f'(w)$: dốc dương thì đáy ở bên trái, nên bước <b>ngược</b> dốc:</p>
          <p>$w_{k+1} = w_k - \eta\, f'(w_k)$ — gọi là <b>Gradient Descent</b>; $\eta$ là cỡ bước, gọi là <b>tốc độ học</b>; $f$ hay gọi là hàm <b>mất mát</b>.</p>
          <table class="t"><tr><th>$f(w) = 5w^2$, $f'(w) = 10w$, $w_0 = 1$</th><th>$w_1$</th><th>$f(w_1)$</th></tr>
          <tr><td>$\eta = 0{,}05$</td><td>$1 - 0{,}05 \cdot 10 = 0{,}5$</td><td>$1{,}25 < 5$: xuống dốc</td></tr>
          <tr><td>$\eta = 0{,}25$</td><td>$1 - 0{,}25 \cdot 10 = -1{,}5$</td><td>$11{,}25 > 5$: nhảy quá đáy, lên cao hơn</td></tr></table>
        focus: [1, 1, 2, 2, "3.2", "3.3"]
        say: "Bây giờ ta xem cùng luật này trong một bài toán khác, tìm đáy của một hàm f của w, ví dụ f bằng 5 w bình phương có đáy ở w bằng 0. Đứng ở w, ta đo độ dốc, nếu dốc dương thì đáy nằm bên trái, nên ta bước ngược chiều dốc. Công thức là w k cộng 1 bằng w k trừ eta nhân độ dốc tại w k, và cách làm này gọi là Gradient Descent. Số eta là cỡ bước, gọi là tốc độ học, còn hàm f cần làm nhỏ thường gọi là hàm mất mát. Với độ dốc 10 w, bắt đầu từ 1 và eta bằng 0 phẩy 05, ta tới 0 phẩy 5, f giảm từ 5 xuống 1 phẩy 25. Với eta bằng 0 phẩy 25, ta nhảy quá đáy tới âm 1 phẩy 5, f lên tới 11 phẩy 25, cao hơn chỗ cũ."
      - clear: true
        show: |
          <p>Thay $f'(w) = 10w$: $w_{k+1} = (1 - 10\eta)\,w_k$ — <b>đúng</b> công thức Euler của $x' = -10x$ với $h = \eta$.</p>
          <div class="box key">Gradient Descent là Euler chạy trên “dòng chảy xuống dốc” $w' = -f'(w)$. Nên tốc độ học phải nhỏ hơn $2/a$, với $a$ là <b>độ cong</b> lớn nhất của hàm (độ dốc của độ dốc: với $5w^2$, độ dốc $10w$ tăng 10 mỗi đơn vị, nên $a = 10$).</div>
          <p class="note">$\eta = 0{,}15$: hội tụ, đổi dấu mỗi bước. $\eta = 0{,}25$: phân kỳ — đúng như bảng ở trên.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Với hàm f bằng 5 w bình phương, đạo hàm bằng 10 w. Thay vào, w k cộng 1 bằng 1 trừ 10 eta, nhân w k, đúng công thức Euler của x phẩy bằng âm 10 x, với h bằng eta. Nói cách khác, Gradient Descent là Euler chạy trên dòng chảy xuống dốc, w phẩy bằng âm đạo hàm của f. Vì thế tốc độ học phải nhỏ hơn 2 chia a, với a là độ cong lớn nhất của hàm, tức độ dốc của độ dốc, ở đây bằng 10. Eta bằng 0 phẩy 15 thì hội tụ nhưng đổi dấu, eta bằng 0 phẩy 25 thì phân kỳ, đúng như bảng ở trên."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "abs(1 - 0.199 * 10) > 0.98"
      - "round(abs(1 - 0.199 * 10) ** 100, 3) == 0.366 and 0.5 ** 100 < 1e-30"
      - "abs(1 + 1.1 * -1) < 1 and abs(1 + 1.1 * -2) > 1"
      - "(lambda ws: all(ws[k + 1] * ws[k] < 0 and 5 * ws[k + 1] ** 2 < 5 * ws[k] ** 2 for k in range(3)))([(1 - 0.15 * 10) ** k for k in range(4)]) and 5 * (1 - 0.25 * 10) ** 2 > 5 * 1 ** 2 and 0.1 < 0.15 < 0.2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ hệ ổn định thì mô phỏng cũng ổn định <b class="red">(sai)</b>
          <br><span class="note">$x' = -10x$ ổn định, nhưng Euler với $h = 0{,}25$ phân kỳ.</span></div>
        say: "Lỗi thứ nhất, nghĩ hệ thật ổn định thì mô phỏng cũng ổn định. Hệ x phẩy bằng âm 10 x ổn định, nhưng Euler với h bằng 0 phẩy 25 lại phân kỳ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn $h$ sát ngưỡng $2/a$ <b class="red">(sai)</b>
          <br><span class="note">$h = 0{,}199$: hệ số $-0{,}99$, dao động gần như không tắt. Chọn $h$ nhỏ hơn hẳn, tốt nhất dưới $1/a$.</span></div>
          <table class="t"><tr><th>$h$</th><th>hệ số</th><th>độ lớn sau 100 bước</th></tr><tr><td>0,199</td><td>$-0{,}99$</td><td>$\approx 0{,}366$</td></tr><tr><td>0,05</td><td>$0{,}5$</td><td>gần như 0</td></tr></table>
        focus: [1, 1, 1, 2]
        say: "Lỗi thứ hai, chọn h sát ngưỡng 2 chia a. Với h bằng 0 phẩy 199, hệ số là âm 0 phẩy 99, dãy dao động gần như không tắt. Hãy chọn h nhỏ hơn hẳn, tốt nhất dưới 1 chia a. Bảng cho thấy sau 100 bước, h bằng 0 phẩy 199 vẫn còn độ lớn khoảng 0 phẩy 366, còn h bằng 0 phẩy 05 đã gần như về 0."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn bước theo phần chậm của hệ <b class="red">(sai)</b>
          <br><span class="note">$h = 1{,}1$ ổn với $\lambda = -1$ nhưng hỏng với $\lambda = -2$. Bước phải theo phần nhanh nhất.</span></div>
        say: "Lỗi thứ ba, chọn bước theo phần chậm của hệ. H bằng 1 phẩy 1 ổn với trị riêng âm 1, nhưng hỏng với trị riêng âm 2. Bước phải theo phần nhanh nhất."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Thấy $w$ nhảy qua lại hai bên đáy thì tăng tốc độ học <b class="red">(sai)</b>
          <br><span class="note">$w$ đổi dấu mỗi bước là dấu hiệu hệ số âm: tốc độ học đã quá $1/a$. Nếu mất mát còn tăng lên thì hệ số đã vượt 1 về độ lớn. Cả hai trường hợp đều cần <b>giảm</b> tốc độ học.</span></div>
        say: "Lỗi thứ tư, khi thấy w nhảy qua lại hai bên đáy thì tăng tốc độ học cho nhanh. W đổi dấu mỗi bước là dấu hiệu hệ số đã âm, tức tốc độ học đã quá 1 chia a. Nếu hàm mất mát còn tăng lên thì độ lớn hệ số đã vượt quá 1. Cả hai trường hợp đều cần giảm tốc độ học."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(2 / 4 - 0.5) < 1e-12 and round(1 - 0.4 * 4, 6) == -0.6"
      - "all(abs(1 + 0.3 * l) < 1 for l in (-1, -5)) and abs(1 + 0.5 * -5) > 1"
      - "[round((1 - 4 * 0.4) ** k, 6) for k in (1, 2, 3)] == [-0.6, 0.36, -0.216] and round(abs(1 + 0.3 * -1), 6) == 0.7 and round(abs(1 + 0.5 * -1), 6) == 0.5 and 2 / 5 == 0.4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$x' = -4x$ với Euler: bước lớn nhất còn ổn định? Với $h = 0{,}4$, dãy trông thế nào?</td></tr>
          <tr><td>2</td><td>Hệ có trị riêng $-1$ và $-5$: $h = 0{,}3$ có ổn định không? $h = 0{,}5$ thì sao?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với x phẩy bằng âm 4 x, bước Euler lớn nhất còn ổn định là bao nhiêu? Với h bằng 0 phẩy 4, dãy trông thế nào? Câu hai, một hệ có trị riêng âm 1 và âm 5, h bằng 0 phẩy 3 có ổn định không? Còn h bằng 0 phẩy 5 thì sao? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $h < 2/4 = \hl{0{,}5}$. Với $h = 0{,}4$: hệ số $1 - 4 \cdot 0{,}4 = 1 - 1{,}6 = -0{,}6$ — hội tụ nhưng đổi dấu mỗi bước.</p>
          <p class="note">Ba bước đầu từ 1: $-0{,}6;\ 0{,}36;\ -0{,}216$.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, bước phải nhỏ hơn 2 chia 4, tức 0 phẩy 5. Với h bằng 0 phẩy 4, hệ số là 1 trừ 4 nhân 0 phẩy 4, tức âm 0 phẩy 6, dãy hội tụ nhưng đổi dấu mỗi bước. Ba giá trị đầu là âm 0 phẩy 6, 0 phẩy 36, rồi âm 0 phẩy 216."
      - show: |
          <p>② Trị riêng nhanh nhất $-5$: cần $h < 2/5 = 0{,}4$.</p>
          <table class="t"><tr><th>$h$</th><th>$\lambda = -1$</th><th>$\lambda = -5$</th><th>kết luận</th></tr>
          <tr><td>0,3</td><td>$\lvert 1 - 0{,}3 \rvert = 0{,}7$</td><td>$\lvert 1 - 1{,}5 \rvert = 0{,}5$</td><td><b>ổn định</b></td></tr>
          <tr><td>0,5</td><td>$\lvert 1 - 0{,}5 \rvert = 0{,}5$</td><td>$\lvert 1 - 2{,}5 \rvert = 1{,}5$</td><td><b>phân kỳ</b></td></tr></table>
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Câu hai, trị riêng nhanh nhất âm 5 đòi h nhỏ hơn 2 chia 5, tức 0 phẩy 4. Với h bằng 0 phẩy 3, hai hệ số có độ lớn 0 phẩy 7 và 0 phẩy 5, đều nhỏ hơn 1, nên ổn định. Với h bằng 0 phẩy 5, trị riêng âm 1 vẫn ổn với 0 phẩy 5. Nhưng trị riêng âm 5 cho hệ số âm 1 phẩy 5, nên cả hệ phân kỳ."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">Euler = hệ rời rạc, hệ số $1 + h\lambda$</span><span class="a">→</span>
          <span class="n">ổn định $\iff \lvert 1 + h\lambda \rvert < 1$</span><span class="a">→</span>
          <span class="n">phần nhanh nhất chọn $h$</span><span class="a">→</span>
          <span class="n">tốc độ học $\eta$ cùng luật</span></div>
        say: "Tổng kết lại, Euler biến hệ liên tục thành hệ rời rạc với hệ số 1 cộng h lambda. Mô phỏng ổn định khi trị tuyệt đối của hệ số đó nhỏ hơn 1 với mọi trị riêng, nên phần nhanh nhất quyết định bước. Tốc độ học của Gradient Descent tuân theo cùng một luật."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi khi một con số chạy theo từng bước, hãy viết nó thành “nhân với bao nhiêu mỗi bước”. Lớn hơn 1 về độ lớn là phân kỳ.</div>
        say: "Điều cần mang theo, mỗi khi một con số được cập nhật theo từng bước, hãy viết nó thành nhân với bao nhiêu mỗi bước. Độ lớn hệ số vượt quá 1 là phân kỳ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>lọc Kalman một chiều</b> — trộn dự đoán từng bước với phép đo có nhiễu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học lọc Kalman một chiều, cách trộn dự đoán từng bước với phép đo có nhiễu để ước lượng tốt hơn cả hai. Hẹn gặp bạn ở bài tiếp theo."
