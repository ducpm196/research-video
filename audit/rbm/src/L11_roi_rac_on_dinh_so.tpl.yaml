  - {sentence: "Tổng kết lại, Euler biến hệ liên tục thành hệ rời rạc với hệ số 1 cộng h lambda.", reason: "Euler đọc “Ơ-le” (probe p1_ten 8/8); ASR chép “ơ le/ở Lê/ở lè”, cùng âm hoặc lệch thanh"}
