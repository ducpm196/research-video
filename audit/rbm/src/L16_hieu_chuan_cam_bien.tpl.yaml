id: L16
course: RBM
series: "RBM · Toán cho robot và hệ động lực"
title: "Bài 16 — Hiệu chuẩn cảm biến bằng bình phương tối thiểu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rbm.yaml L16; audit/rbm/verify_rbm.py L16; D. C. Montgomery, G. C. Runger, Applied Statistics and Probability for Engineers (2014), mục 11.2–11.5"
assumes: [arith, cdot, sub, hat, bar, sum, frac, sqrt, pm, approx, power, implies, dots]
# Quy ước: x = giá trị chuẩn (biết chính xác), y = số đọc của cảm biến (có nhiễu); mô hình y ≈ a x + b; \bar{x}, \bar{y} trung bình
#   (gạch ngang như CS115 bài 44); phần dư e_i = y_i − (a x_i + b); s = độ lệch chuẩn phần dư với n − 2 bậc tự do.
#   Hệ số 4,30 là phân vị 97,5% của phân phối t với 2 bậc tự do (hàm phân phối đóng 1/2 + t/(2√(2 + t²)); verify_rbm.py so sympy.stats) — thay cho
#   1,96 của CS115 bài 44 vì chỉ có 4 điểm. Mọi số do alg.lsq_line tính.
objectives:
  - "Khớp mô hình hiệu chuẩn tuyến tính bằng bình phương tối thiểu"
  - "Dùng mô hình để sửa số đọc"
  - "Báo cáo sai số kèm khoảng tin cậy, và biết vì sao không nên dùng ngoài khoảng đã đo"
asr_reviewed:
  - {sentence: "Hàng cuối là bình phương độ lệch của x.", reason: "ASR chép “Hàng cuối là bình phương độ lệch cuối.” (0.824): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: của (trong “của x” → “cuối”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khớp tốt trong khoảng 0 đến 3 ki-lô-gam chưa nói gì về 10 ki-lô-gam.", reason: "ASR viết “ki-lô-gam” thành “kg” (đúng đơn vị, chỉ khác cách viết) nên độ khớp tụt; chưa/chứ là nhầm thanh; các số 0, 3, 10 khớp"}
  - {sentence: "Đảo mô hình để sửa số đọc.", reason: "đảo → “đạo”, đọc → “độc”: nhầm thanh của ASR ở câu 7 từ (độ khớp 0,714 ≥ 0,7); “sửa số đọc” chép đúng ở câu kế tiếp — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bây giờ sửa số đọc, nếu cảm biến báo 5 thì giá trị thật bằng 5 trừ 1 phẩy 03, chia 1 phẩy 98, xấp xỉ 2 phẩy 005 ki-lô-gam.", reason: "ASR viết số thành “5,1%3, chia 1,98, sắp xỉ 2,005 kg”: “trừ 1 phẩy 03” bị gộp thành “1%3” (ASR chuẩn hoá số), các chữ số 5, 1, 0, 3, 1, 98, 2, 005 đều có; kg là cách viết của ki-lô-gam; xấp/sắp là nhầm x/s — NOT_VERIFIED bằng tai người"}
  - {sentence: "Gọi x gạch và y gạch là trung bình.", reason: "gạch → “gạp”: nhầm âm cuối ch/p của ASR; x → “ít” là tên chữ cái kiểu Việt; ký hiệu x gạch, y gạch hiện trên màn hình — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nhiễu nằm ở số đọc y, mà bình phương tối thiểu giả định nhiễu ở biến được khớp.", reason: "nhiễu → “nhịu”, đọc → “độc”, khớp → “khấp”: nhầm vần và thanh của ASR; “bình phương tối thiểu” chép đúng — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cảm biến đọc lệch"
    steps:
      - show: |
          <p>Đặt cảm biến lực dưới các quả cân chuẩn 0, 1, 2, 3 kg. Số đọc: $1;\ 3;\ 5{,}1;\ 6{,}9$ — lệch, và mỗi lần lệch một kiểu.</p>
          <p>Muốn dùng được, phải tìm quy luật số đọc theo giá trị thật, rồi đảo ngược nó.</p>
          <div class="box key">Hôm nay: <b>hiệu chuẩn</b> bằng bình phương tối thiểu, sửa số đọc, và báo cáo độ tin cậy.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ta đặt một cảm biến lực dưới các quả cân chuẩn 0, 1, 2 và 3 ki-lô-gam. Số đọc được là 1, 3, 5 phẩy 1 và 6 phẩy 9, lệch so với giá trị thật, và mỗi lần lệch một kiểu. Muốn dùng được cảm biến, ta phải tìm quy luật của số đọc theo giá trị thật, rồi đảo ngược quy luật đó. Hôm nay ta học hiệu chuẩn bằng bình phương tối thiểu, cách sửa số đọc, và cách báo cáo độ tin cậy."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: trung bình, độ lệch, và đảo một đường thẳng"
    checks:
      - "sum([0, 1, 2, 3]) / 4 == 1.5 and [x - 1.5 for x in [0, 1, 2, 3]] == [-1.5, -0.5, 0.5, 1.5] and sum(x - 1.5 for x in [0, 1, 2, 3]) == 0"
      - "2 * 2 + 1 == 5 and (5 - 1) / 2 == 2"
    steps:
      - show: |
          <p>Trung bình $\bar{x}$ (đọc “x gạch”) = tổng chia số phần tử. Độ lệch = mỗi giá trị trừ trung bình.</p>
          <table class="t"><tr><th>$x$</th><th>0</th><th>1</th><th>2</th><th>3</th><th>trung bình</th></tr>
          <tr><td>độ lệch $x - \bar{x}$</td><td>$-1{,}5$</td><td>$-0{,}5$</td><td>$0{,}5$</td><td>$1{,}5$</td><td>$\bar{x} = \frac{6}{4} = 1{,}5$</td></tr></table>
          <p class="note">Các độ lệch luôn cộng lại bằng 0: $-1{,}5 - 0{,}5 + 0{,}5 + 1{,}5 = 0$.</p>
        focus: [1, 2, 2, 3]
        say: "Trước khi vào bài, ta ôn hai phép tính sẽ dùng. Trung bình, viết x gạch, bằng tổng chia số phần tử, với 0, 1, 2, 3 thì tổng là 6, chia 4 được 1 phẩy 5. Độ lệch là mỗi giá trị trừ trung bình, ở đây được âm 1 phẩy 5, âm 0 phẩy 5, 0 phẩy 5 và 1 phẩy 5. Các độ lệch luôn cộng lại bằng 0, vì phần thiếu bên dưới trung bình bù đúng phần dư bên trên."
      - show: |
          <p>Đảo một đường thẳng: biết $y = 2x + 1$, đọc được $y$, tìm $x$.</p>
          <p>$$y - 1 = 2x \ \Rightarrow\ x = \frac{y - 1}{2}; \qquad y = 5 \ \Rightarrow\ x = \frac{5 - 1}{2} = 2$$</p>
          <p class="note">Thử lại: $2 \cdot 2 + 1 = 5$ ✓</p>
        focus: [1, 2, 2, 3]
        say: "Điều thứ hai là đảo một đường thẳng. Biết y bằng 2 x cộng 1, ta đọc được y và muốn tìm x. Chuyển 1 sang vế trái được y trừ 1 bằng 2 x, rồi chia hai vế cho 2, nên x bằng y trừ 1, chia 2, với y bằng 5 thì x bằng 2. Thử lại, 2 nhân 2 cộng 1 đúng bằng 5."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: y ≈ a x + b và phần dư"
    checks:
      - "(lambda x, y: (sum((u - 1.5) ** 2 for u in x), round(sum((u - 1.5) * (v - 4) for u, v in zip(x, y)), 9), round(sum((v - 4) ** 2 for v in y), 9)))([0, 1, 2, 3], [1, 3, 5.1, 6.9]) == (5.0, 9.9, 19.62)"
      - "round(19.8 / 10, 9) == 1.98 and round(19.62 - 9.9 ** 2 / 5, 9) == 0.018 and round(5 * 1.98 ** 2 - 19.8 * 1.98 + 19.62, 9) == 0.018"
      - "all(abs(sum(v - (a * u + 4 - a * 1.5) for u, v in zip([0, 1, 2, 3], [1, 3, 5.1, 6.9]))) < 1e-9 for a in (1, 1.98, 3))"
    steps:
      - show: |
          <p>$x$: giá trị chuẩn (biết chính xác). $y$: số đọc (có nhiễu). Mô hình: $y \approx a x + b$, với $a$ là độ nhạy, $b$ là số đọc khi giá trị chuẩn bằng 0 (độ lệch điểm không).</p>
          <p>Phần dư của điểm thứ $i$: $e_i = y_i - (a x_i + b)$. Chọn $a$, $b$ để tổng $\sum e_i^2$ (cộng lần lượt mọi điểm) nhỏ nhất: <b>bình phương tối thiểu</b>.</p>
          <p>Lời giải, với $\bar{x}$, $\bar{y}$ là trung bình:</p>
          <p>$a = \dfrac{\sum (x_i - \bar{x})(y_i - \bar{y})}{\sum (x_i - \bar{x})^2}$, $\quad b = \bar{y} - a\bar{x}$</p>
        focus: [1, 1, 2, 2, 3, 4]
        say: "Gọi x là giá trị chuẩn, biết chính xác, và y là số đọc, có nhiễu. Mô hình là y xấp xỉ a x cộng b, với a là độ nhạy và b là số đọc khi giá trị chuẩn bằng 0, gọi là độ lệch điểm không. Phần dư của điểm thứ i là số đọc trừ đi giá trị mô hình dự đoán. Ta chọn a và b để tổng bình phương các phần dư nhỏ nhất, gọi là phương pháp bình phương tối thiểu. Gọi x gạch và y gạch là trung bình. Lời giải là a bằng tổng tích các độ lệch chia tổng bình phương độ lệch của x, còn b bằng y gạch trừ a nhân x gạch."
      - clear: true
        show: |
          <p>Vì sao lời giải như vậy? Với $a$ cố định, chọn $b = \bar{y} - a\bar{x}$ để đường đi qua điểm trung bình $(\bar{x}, \bar{y})$: tổng phần dư bằng 0, dịch đường lên hay xuống khỏi đó chỉ làm tổng bình phương tăng.</p>
          <p>Thay vào, với dữ liệu của bài ($\bar{x} = 1{,}5$, $\bar{y} = 4$): tổng bình phương phần dư theo $a$ là</p>
          $$5a^2 - 19{,}8a + 19{,}62$$
          <p class="note">Parabol mở lên, đáy ở chỗ độ dốc $10a - 19{,}8 = 0$, tức $a = 1{,}98$; giá trị nhỏ nhất $19{,}62 - \frac{9{,}9^2}{5} = 0{,}018$. Số 5 là $\sum (x_i - \bar{x})^2$, số $9{,}9$ là $\sum (x_i - \bar{x})(y_i - \bar{y})$.</p>
        focus: [1, 1, 1, 2, 3, 4, 4]
        say: "Vì sao lời giải lại như vậy? Khi giữ a cố định, ta chọn b sao cho đường thẳng đi qua điểm trung bình x gạch, y gạch, khi đó tổng các phần dư bằng 0. Dịch đường lên hay xuống khỏi đó chỉ làm tổng bình phương tăng thêm. Thay b đó vào, với dữ liệu của bài có x gạch bằng 1 phẩy 5 và y gạch bằng 4, tổng bình phương phần dư trở thành một biểu thức bậc hai theo a. Đó là 5 a bình phương trừ 19 phẩy 8 a cộng 19 phẩy 62. Đây là parabol mở lên, đáy ở chỗ độ dốc 10 a trừ 19 phẩy 8 bằng 0, tức a bằng 1 phẩy 98, và giá trị nhỏ nhất là 0 phẩy 018. Số 5 chính là tổng bình phương độ lệch của x, còn 9 phẩy 9 là tổng tích các độ lệch, đúng như công thức."

  - id: intuition
    kind: intuition
    title: "Hình dung: xoay đường cho tổng ô vuông nhỏ nhất"
    checks:
      - "[round(y - (2 * x + 0.5), 2) for x, y in zip([0, 1, 2, 3], [1, 3, 5.1, 6.9])] == [0.5, 0.5, 0.6, 0.4] and round(sum((y - (2 * x + 0.5)) ** 2 for x, y in zip([0, 1, 2, 3], [1, 3, 5.1, 6.9])), 4) == 1.02"
      - "round(sum(r * r for r in alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])[2]), 4) == 0.018"
    steps:
      - show: |
          <div><svg width="1300" height="450" viewBox="0 0 1300 450"><text x="220" y="40" font-size="22" text-anchor="middle" fill="#6b7280" font-weight="bold">đường thử y = 2x + 0,5</text><line x1="40.0" y1="390" x2="410.0" y2="390" stroke="#6b7280" stroke-width="2"/><line x1="50" y1="390" x2="50" y2="54" stroke="#6b7280" stroke-width="2"/><line x1="50.0" y1="385.8" x2="400.0" y2="91.8" stroke="#6b7280" stroke-width="3"/><rect x="74.0" y="348.0" width="21.0" height="21.0" fill="#eb6834" opacity="0.55"/><line x1="70" y1="348.0" x2="70" y2="369.0" stroke="#eb6834" stroke-width="3"/><circle cx="70" cy="348.0" r="7" fill="#1f2937"/><rect x="174.0" y="264.0" width="21.0" height="21.0" fill="#eb6834" opacity="0.55"/><line x1="170" y1="264.0" x2="170" y2="285.0" stroke="#eb6834" stroke-width="3"/><circle cx="170" cy="264.0" r="7" fill="#1f2937"/><rect x="274.0" y="175.8" width="25.2" height="25.2" fill="#eb6834" opacity="0.55"/><line x1="270" y1="175.8" x2="270" y2="201.0" stroke="#eb6834" stroke-width="3"/><circle cx="270" cy="175.8" r="7" fill="#1f2937"/><rect x="374.0" y="100.2" width="16.8" height="16.8" fill="#eb6834" opacity="0.55"/><line x1="370" y1="100.2" x2="370" y2="117.0" stroke="#eb6834" stroke-width="3"/><circle cx="370" cy="100.2" r="7" fill="#1f2937"/><text x="220" y="430" font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">tổng diện tích ô cam: 1,02</text><text x="740" y="40" font-size="22" text-anchor="middle" fill="#15803d" font-weight="bold">đường khớp y = 1,98x + 1,03</text><line x1="560.0" y1="390" x2="930.0" y2="390" stroke="#6b7280" stroke-width="2"/><line x1="570" y1="390" x2="570" y2="54" stroke="#6b7280" stroke-width="2"/><line x1="570.0" y1="363.4" x2="920.0" y2="72.3" stroke="#15803d" stroke-width="3"/><rect x="594.0" y="346.7" width="1.3" height="1.3" fill="#eb6834" opacity="0.55"/><line x1="590" y1="348.0" x2="590" y2="346.7" stroke="#eb6834" stroke-width="3"/><circle cx="590" cy="348.0" r="7" fill="#1f2937"/><rect x="694.0" y="263.6" width="0.4" height="0.4" fill="#eb6834" opacity="0.55"/><line x1="690" y1="264.0" x2="690" y2="263.6" stroke="#eb6834" stroke-width="3"/><circle cx="690" cy="264.0" r="7" fill="#1f2937"/><rect x="794.0" y="175.8" width="4.6" height="4.6" fill="#eb6834" opacity="0.55"/><line x1="790" y1="175.8" x2="790" y2="180.4" stroke="#eb6834" stroke-width="3"/><circle cx="790" cy="175.8" r="7" fill="#1f2937"/><rect x="894.0" y="97.3" width="2.9" height="2.9" fill="#eb6834" opacity="0.55"/><line x1="890" y1="100.2" x2="890" y2="97.3" stroke="#eb6834" stroke-width="3"/><circle cx="890" cy="100.2" r="7" fill="#1f2937"/><text x="740" y="430" font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">tổng diện tích ô cam: 0,018</text><text x="1000" y="200" font-size="22" text-anchor="start" fill="#1f2937">Mỗi đoạn cam là</text><text x="1000" y="232" font-size="22" text-anchor="start" fill="#1f2937">một phần dư;</text><text x="1000" y="264" font-size="22" text-anchor="start" fill="#1f2937">ô vuông cam là</text><text x="1000" y="296" font-size="22" text-anchor="start" fill="#1f2937">bình phương của nó.</text><text x="1000" y="340" font-size="22" text-anchor="start" fill="#15803d" font-weight="bold">Bình phương tối thiểu</text><text x="1000" y="372" font-size="22" text-anchor="start" fill="#15803d" font-weight="bold">= xoay, dịch đường cho</text><text x="1000" y="404" font-size="22" text-anchor="start" fill="#15803d" font-weight="bold">tổng diện tích nhỏ nhất.</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình này cho thấy bình phương tối thiểu làm gì. Mỗi đoạn cam đứng là một phần dư, khoảng cách theo chiều dọc từ điểm đo tới đường, và ô vuông cam dựng trên nó có diện tích bằng bình phương phần dư. Bên trái là một đường thử, y bằng 2 x cộng 0 phẩy 5, nằm thấp hơn mọi điểm, nên tổng diện tích các ô vuông là 1 phẩy 02. Bên phải là đường khớp, các ô vuông nhỏ đến mức gần như không thấy, tổng chỉ còn 0 phẩy 018. Bình phương tối thiểu chính là xoay và dịch đường thẳng cho đến khi tổng diện tích đó nhỏ nhất."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Khớp bốn điểm"
    checks:
      - "abs(sum([0, 1, 2, 3]) / 4 - 1.5) < 1e-12 and abs(sum([1, 3, 5.1, 6.9]) / 4 - 4) < 1e-12"
      - "abs(sum((x - 1.5) * (y - 4) for x, y in zip([0, 1, 2, 3], [1, 3, 5.1, 6.9])) - 9.9) < 1e-9 and sum((x - 1.5) ** 2 for x in [0, 1, 2, 3]) == 5"
      - "(round(alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])[0], 4), round(alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])[1], 4)) == (1.98, 1.03)"
      - "[round(r, 2) for r in alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])[2]] == [-0.03, -0.01, 0.11, -0.07]"
      - "sum([1, 3, 5.1, 6.9]) == 16 and [round(y - 4, 2) for y in [1, 3, 5.1, 6.9]] == [-3, -1, 1.1, 2.9] and [round((x - 1.5) * (y - 4), 2) for x, y in zip([0, 1, 2, 3], [1, 3, 5.1, 6.9])] == [4.5, 0.5, 0.55, 4.35]"
    steps:
      - show: |
          <p><b>Bước 1 —</b> $\bar{x} = \frac{0 + 1 + 2 + 3}{4} = 1{,}5$; $\quad \bar{y} = \frac{1 + 3 + 5{,}1 + 6{,}9}{4} = \frac{16}{4} = 4$.</p>
        say: "Bước một, trung bình của x là 6 chia 4, tức 1 phẩy 5. Trung bình của y là 16 chia 4, tức 4."
      - show: |
          <p><b>Bước 2 —</b> độ lệch, rồi nhân từng cặp:</p>
          <table class="t"><tr><th>$x - \bar{x}$</th><td>$-1{,}5$</td><td>$-0{,}5$</td><td>$0{,}5$</td><td>$1{,}5$</td></tr>
          <tr><th>$y - \bar{y}$</th><td>$-3$</td><td>$-1$</td><td>$1{,}1$</td><td>$2{,}9$</td></tr>
          <tr><th>tích</th><td>$4{,}5$</td><td>$0{,}5$</td><td>$0{,}55$</td><td>$4{,}35$</td></tr>
          <tr><th>$(x - \bar{x})^2$</th><td>$2{,}25$</td><td>$0{,}25$</td><td>$0{,}25$</td><td>$2{,}25$</td></tr></table>
        focus: [1, ["2.1", "2.2"], "2.3", "2.4"]
        say: "Bước hai, ta lấy từng giá trị trừ trung bình, được độ lệch của x và độ lệch của y. Hai hàng đầu của bảng là hai dãy độ lệch đó. Hàng thứ ba nhân từng cặp, ví dụ âm 1 phẩy 5 nhân âm 3 bằng 4 phẩy 5. Hàng cuối là bình phương độ lệch của x."
      - show: |
          <p><b>Bước 3 —</b> tử số $4{,}5 + 0{,}5 + 0{,}55 + 4{,}35 = 9{,}9$; $\quad$ mẫu số $2{,}25 + 0{,}25 + 0{,}25 + 2{,}25 = 5$.</p>
        say: "Bước ba, cộng hàng tích lại, tử số bằng 9 phẩy 9, còn mẫu số, tổng bình phương độ lệch của x, bằng 5."
      - show: |
          <p><b>Bước 4 —</b> $a = 9{,}9 / 5 = \hl{1{,}98}$; $\quad b = 4 - 1{,}98 \cdot 1{,}5 = \hl{1{,}03}$.</p>
        say: "Bước bốn, a bằng 9 phẩy 9 chia 5, tức 1 phẩy 98. Thay vào, b bằng 4 trừ 1 phẩy 98 nhân 1 phẩy 5, tức 1 phẩy 03."
      - clear: true
        show: |
          <div>{{FIT}}</div>
          <p>Phần dư (đoạn cam): $-0{,}03;\ -0{,}01;\ 0{,}11;\ -0{,}07$ — nhỏ, rải hai phía, không theo quy luật: mô hình đường thẳng hợp lý.</p>
          <p><b>Sửa số đọc</b>: đọc được $y = 5$ thì giá trị thật $x = \dfrac{y - b}{a} = \dfrac{5 - 1{,}03}{1{,}98} \approx \hl{2{,}005}$ kg.</p>
        focus: [1, 2, 2, 3]
        say: "Trên hình là đường khớp và bốn điểm đo. Các đoạn cam là phần dư, âm 0 phẩy 03, âm 0 phẩy 01, 0 phẩy 11 và âm 0 phẩy 07. Chúng nhỏ, rải đều hai phía, không theo quy luật nào, nên mô hình đường thẳng là hợp lý. Bây giờ sửa số đọc, nếu cảm biến báo 5 thì giá trị thật bằng 5 trừ 1 phẩy 03, chia 1 phẩy 98, xấp xỉ 2 phẩy 005 ki-lô-gam."

  - id: check
    kind: check
    title: "Tự kiểm: hai tính chất, rồi thử đường bên cạnh"
    checks:
      - "abs(sum(alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])[2])) < 1e-12 and round(-0.03 - 0.01 + 0.11 - 0.07, 9) == 0"
      - "round(1.98 * 1.5 + 1.03, 6) == 4"
      - "[round(sum((y - (a * x + b)) ** 2 for x, y in zip([0, 1, 2, 3], [1, 3, 5.1, 6.9])), 4) for a, b in ((1.98, 1.03), (2, 1), (1.96, 1.06))] == [0.018, 0.02, 0.02]"
    steps:
      - show: |
          <p>Đường thứ nhất: hai tính chất mà đường bình phương tối thiểu (có $b$) luôn có.</p>
          <table class="t"><tr><th>tính chất</th><th>thử</th></tr>
          <tr><td>phần dư cộng lại bằng 0</td><td>$-0{,}03 - 0{,}01 + 0{,}11 - 0{,}07 = 0$ ✓</td></tr>
          <tr><td>đường đi qua điểm trung bình $(\bar{x}, \bar{y})$</td><td>$1{,}98 \cdot 1{,}5 + 1{,}03 = 2{,}97 + 1{,}03 = 4$ ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Làm sao biết a và b tính đúng? Đường thứ nhất, kiểm hai tính chất mà đường bình phương tối thiểu luôn có. Các phần dư cộng lại bằng 0, và quả thật âm 0 phẩy 03, âm 0 phẩy 01, cộng 0 phẩy 11, trừ 0 phẩy 07 bằng đúng 0. Đường phải đi qua điểm trung bình, và thay x bằng 1 phẩy 5 thì được 2 phẩy 97 cộng 1 phẩy 03, bằng 4, đúng y gạch."
      - show: |
          <p>Đường thứ hai: thử hai đường bên cạnh, tổng bình phương phần dư phải <b>lớn hơn</b>.</p>
          <table class="t"><tr><th>đường</th><th>phần dư</th><th>tổng bình phương</th></tr>
          <tr><td>$1{,}98x + 1{,}03$</td><td>$-0{,}03;\ -0{,}01;\ 0{,}11;\ -0{,}07$</td><td>$\hl{0{,}018}$</td></tr>
          <tr><td>$2x + 1$</td><td>$0;\ 0;\ 0{,}1;\ -0{,}1$</td><td>$0{,}02$</td></tr>
          <tr><td>$1{,}96x + 1{,}06$</td><td>$-0{,}06;\ -0{,}02;\ 0{,}12;\ -0{,}04$</td><td>$0{,}02$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đường thứ hai, thay a, b bằng vài giá trị bên cạnh rồi tính lại tổng bình phương phần dư. Đường khớp cho 0 phẩy 018. Đường 2 x cộng 1 cho các phần dư 0, 0, 0 phẩy 1 và âm 0 phẩy 1, tổng bình phương 0 phẩy 02, lớn hơn. Đường 1 phẩy 96 x cộng 1 phẩy 06 cũng cho 0 phẩy 02, nên đường khớp đúng là nhỏ nhất trong các đường đã thử."

  # ───────────────────────── 4. ĐỘ TIN CẬY ─────────────────────────
  - id: confidence
    kind: concept
    title: "Báo cáo độ nhạy kèm khoảng tin cậy"
    checks:
      - "round(alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])[3], 4) == 0.0949 and round(alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])[4], 4) == 0.0424"
      - "abs(sum(r * r for r in alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])[2]) - 0.018) < 1e-9"
      - "abs(0.5 + 4.303 / (2 * math.sqrt(2 + 4.303 ** 2)) - 0.975) < 1e-4"
      - "all(abs((lambda n, t: 0.5 + sum(math.gamma((n + 1) / 2) / (math.sqrt(n * math.pi) * math.gamma(n / 2)) * (1 + ((k + 0.5) * t / 20000) ** 2 / n) ** (-(n + 1) / 2) for k in range(20000)) * t / 20000)(n, t) - 0.975) < 2e-4 for n, t in ((2, 4.303), (5, 2.571), (10, 2.228), (30, 2.042))) and round(math.erf(1.96 / math.sqrt(2)), 3) == 0.95 and 4 - 2 == 2"
      - "(lambda r: (round(r[0] - 4.303 * r[4], 2), round(r[0] + 4.303 * r[4], 2)))(alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])) == (1.8, 2.16)"
    steps:
      - show: |
          <p>Độ phân tán của phần dư (cỡ thường gặp của một phần dư): $s = \sqrt{\dfrac{\sum e_i^2}{n - 2}} = \sqrt{\dfrac{0{,}018}{2}} \approx 0{,}095$ — chia $n - 2$ vì đã dùng dữ liệu để ước lượng hai số $a$, $b$.</p>
          <p><b>Sai số chuẩn</b> của $a$ (làm lại buổi hiệu chuẩn với nhiễu mới thì $a$ dao động quanh giá trị thật cỡ bao nhiêu): $\dfrac{s}{\sqrt{\sum (x_i - \bar{x})^2}} = \dfrac{0{,}095}{\sqrt{5}} \approx 0{,}042$.</p>
          <p>Khoảng tin cậy 95%: $a = 1{,}98 \pm 4{,}30 \cdot 0{,}042$, tức từ $\hl{1{,}80}$ đến $\hl{2{,}16}$.</p>
          <p class="note">Nghĩa của “95%”: nếu làm lại cả buổi hiệu chuẩn rất nhiều lần, khoảng 95% các khoảng dựng theo cách này chứa độ nhạy thật. Đúng khi nhiễu các lần đo độc lập, cùng độ lớn và phân phối chuẩn.</p>
        focus: [1, 1, 1, 2, 2, 3, 4, 4]
        say: "Bây giờ báo cáo độ tin cậy. Độ phân tán của phần dư, s, tức cỡ thường gặp của một phần dư, bằng căn của tổng bình phương phần dư chia n trừ 2, xấp xỉ 0 phẩy 095. Ta chia n trừ 2 vì đã dùng chính dữ liệu để ước lượng hai số a và b. Sai số chuẩn của a cho biết nếu làm lại cả buổi hiệu chuẩn với nhiễu mới, con số a sẽ dao động quanh giá trị thật cỡ bao nhiêu. Nó bằng s chia căn 5, xấp xỉ 0 phẩy 042. Khoảng tin cậy 95 phần trăm là 1 phẩy 98 cộng trừ 4 phẩy 30 nhân 0 phẩy 042, tức từ 1 phẩy 80 đến 2 phẩy 16. Con số 95 phần trăm nghĩa là nếu làm lại cả buổi hiệu chuẩn rất nhiều lần, khoảng 95 phần trăm các khoảng dựng theo cách này chứa độ nhạy thật. Điều đó đúng khi nhiễu các lần đo độc lập, cùng độ lớn, và có phân phối chuẩn."
      - clear: true
        show: |
          <p>Vì sao nhân 4,30? Với phân phối chuẩn (đường hình chuông), 95% giá trị nằm trong $\pm 1{,}96$ <b>độ lệch chuẩn</b> (độ rộng của chuông: khoảng cách thường gặp từ một giá trị tới tâm) quanh tâm. Nhưng ở đây $s$ cũng chỉ ước lượng từ 4 điểm, nên dùng <b>phân phối t</b> (của Student): giống hình chuông nhưng đuôi dày hơn, càng ít dữ liệu càng dày. Số <b>bậc tự do</b> $= n - 2 = 2$ (4 điểm trừ 2 số đã ước lượng).</p>
          <table class="t"><tr><th>bậc tự do</th><th>2</th><th>5</th><th>10</th><th>30</th><th>rất nhiều</th></tr>
          <tr><td>hệ số cho 95%</td><td>4,303</td><td>2,571</td><td>2,228</td><td>2,042</td><td>1,960</td></tr></table>
        focus: [1, 1, 1, 1, 1, 2, 2]
        say: "Vì sao lại nhân với 4 phẩy 30? Với phân phối chuẩn, tức đường hình chuông, 95 phần trăm giá trị nằm trong cộng trừ 1 phẩy 96 độ lệch chuẩn quanh tâm. Độ lệch chuẩn đo độ rộng của chuông, tức khoảng cách thường gặp từ một giá trị tới tâm. Nhưng ở đây bản thân s cũng chỉ là ước lượng từ 4 điểm, nên ta dùng phân phối t, giống hình chuông nhưng đuôi dày hơn, càng ít dữ liệu càng dày. Số bậc tự do bằng 4 điểm trừ 2 số đã ước lượng, tức 2. Bảng cho hệ số 95 phần trăm theo số bậc tự do, 2 bậc là 4 phẩy 303, 5 bậc là 2 phẩy 571, 10 bậc là 2 phẩy 228. Khi có rất nhiều điểm, hệ số về gần 1 phẩy 96 của phân phối chuẩn."

  # ───────────────────────── 5. NGOẠI SUY ─────────────────────────
  - id: extrapolate
    kind: concept
    title: "Khớp tốt trong khoảng đo, chưa chắc tốt ngoài khoảng"
    checks:
      - "(lambda s: (round(s * math.sqrt(1 / 4 + (1.5 - 1.5) ** 2 / 5), 3), round(s * math.sqrt(1 / 4 + (10 - 1.5) ** 2 / 5), 3)))(alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])[3]) == (0.047, 0.364)"
    steps:
      - show: |
          <p>Độ không chắc của đường khớp tại $x$ (đường khớp ở đó có thể lệch khỏi đường thật cỡ bao nhiêu): $\quad s\sqrt{\dfrac{1}{n} + \dfrac{(x - \bar{x})^2}{\sum (x_i - \bar{x})^2}}$</p>
          <table class="t"><tr><th>$x$</th><th>1,5 (giữa dữ liệu)</th><th>10 (ngoài khoảng)</th></tr>
          <tr><td>độ không chắc</td><td>0,047</td><td>0,364</td></tr></table>
          <div class="box warn">Xa dữ liệu gấp 8 lần không chắc — mà đó là khi mô hình còn đúng. Cảm biến thật thường bão hoà hay cong ở tải lớn: phải đo thêm điểm chuẩn ở vùng sẽ dùng.</div>
        focus: [1, 1, 2, "2.2", 3, 3]
        say: "Độ không chắc của đường khớp tại một điểm x cho biết đường khớp ở đó có thể lệch khỏi đường thật cỡ bao nhiêu. Trong dấu căn của công thức, phần thứ hai tăng theo bình phương khoảng cách từ x tới trung bình, nên khi đi xa, độ không chắc tăng gần như tỉ lệ với khoảng cách. Ở giữa dữ liệu, x bằng 1 phẩy 5, nó chỉ là 0 phẩy 047. Nhưng ở x bằng 10, ngoài khoảng đã đo, nó lên tới 0 phẩy 364, gấp khoảng 8 lần. Và đó là khi mô hình đường thẳng còn đúng. Cảm biến thật thường bão hoà hay cong đi ở tải lớn, nên phải đo thêm điểm chuẩn ở chính vùng sẽ dùng."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda r: abs(r[0] - 1 / alg.lsq_line([1, 3, 5.1, 6.9], [0, 1, 2, 3])[0]) > 1e-4)(alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9]))"
      - "abs(4.303 / 1.96 - 2.195) < 0.001"
      - "(lambda r: (round(r[0] - 1.96 * r[4], 2), round(r[0] + 1.96 * r[4], 2)))(alg.lsq_line([0, 1, 2, 3], [1, 3, 5.1, 6.9])) == (1.9, 2.06)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Khớp $x$ theo $y$ thay vì $y$ theo $x$ <b class="red">(sai)</b>
          <br><span class="note">Nhiễu nằm ở số đọc $y$. Bình phương tối thiểu giả định nhiễu ở biến được khớp; đổi vai cho kết quả khác.</span></div>
        say: "Lỗi thứ nhất, khớp x theo y thay vì y theo x. Nhiễu nằm ở số đọc y, mà bình phương tối thiểu giả định nhiễu ở biến được khớp. Đổi vai hai biến sẽ cho kết quả khác."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng 1,96 khi chỉ có vài điểm <b class="red">(sai)</b>
          <br><span class="note">Với 4 điểm, hệ số đúng là 4,30: khoảng tin cậy rộng gấp hơn hai lần.</span></div>
          <table class="t"><tr><th>hệ số</th><th>khoảng cho $a$ ($1{,}98 \pm$ hệ số $\cdot\ 0{,}042$)</th></tr><tr><td>1,96 (sai với 4 điểm)</td><td>1,90 đến 2,06</td></tr><tr><td>4,30 (đúng)</td><td>1,80 đến 2,16</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ hai, dùng hệ số 1 phẩy 96 khi chỉ có vài điểm. Với 4 điểm, hệ số đúng là 4 phẩy 30, nên khoảng tin cậy rộng gấp hơn hai lần. Bảng cho thấy hệ số sai báo độ nhạy nằm từ 1 phẩy 90 đến 2 phẩy 06, tự tin hơn nhiều so với khoảng đúng từ 1 phẩy 80 đến 2 phẩy 16."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Ngoại suy xa khoảng đã đo <b class="red">(sai)</b>
          <br><span class="note">Khớp tốt trong khoảng 0 đến 3 kg chưa nói gì về 10 kg.</span></div>
        say: "Lỗi thứ ba, ngoại suy xa khoảng đã đo. Khớp tốt trong khoảng 0 đến 3 ki-lô-gam chưa nói gì về 10 ki-lô-gam."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Chỉ nhìn đường khớp, không nhìn phần dư <b class="red">(thiếu)</b>
          <br><span class="note">Phần dư theo hình cong (âm ở hai đầu, dương ở giữa) là dấu hiệu cảm biến không tuyến tính.</span></div>
        say: "Lỗi thứ tư, chỉ nhìn đường khớp mà không nhìn phần dư. Phần dư theo hình cong, âm ở hai đầu và dương ở giữa, là dấu hiệu cảm biến không tuyến tính."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(round(alg.lsq_line([0, 1, 2], [0, 2.1, 3.9])[0], 4), round(alg.lsq_line([0, 1, 2], [0, 2.1, 3.9])[1], 4)) == (1.95, 0.05)"
      - "(lambda r: round((3 - r[1]) / r[0], 3))(alg.lsq_line([0, 1, 2], [0, 2.1, 3.9])) == 1.513"
      - "round(sum([0, 2.1, 3.9]) / 3, 6) == 2 and round(1.95 * 1.513 + 0.05, 3) == 3.0 and round(3 - 0.05, 2) == 2.95"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ba điểm chuẩn $(0, 0)$, $(1;\ 2{,}1)$, $(2;\ 3{,}9)$: tìm $a$, $b$.</td></tr>
          <tr><td>2</td><td>Cảm biến báo $y = 3$: giá trị thật là bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với ba điểm chuẩn 0, 0, rồi 1, 2 phẩy 1, và 2, 3 phẩy 9, hãy tìm a và b. Câu hai, nếu cảm biến báo 3 thì giá trị thật là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $\bar{x} = 1$, $\bar{y} = \frac{0 + 2{,}1 + 3{,}9}{3} = 2$; độ lệch $y$: $-2;\ 0{,}1;\ 1{,}9$.</p>
          <p>Tử số $(-1)(-2) + 0 \cdot 0{,}1 + 1 \cdot 1{,}9 = 3{,}9$; mẫu số $1 + 0 + 1 = 2$. $a = \hl{1{,}95}$, $b = 2 - 1{,}95 \cdot 1 = \hl{0{,}05}$.</p>
        focus: [1, 1, 2, 2]
        say: "Đáp án câu một, trung bình của x là 1, của y là 2. Độ lệch của y là âm 2, 0 phẩy 1 và 1 phẩy 9. Tử số bằng 2 cộng 0 cộng 1 phẩy 9, tức 3 phẩy 9, mẫu số bằng 1 cộng 0 cộng 1, tức 2. Vậy a bằng 1 phẩy 95 và b bằng 2 trừ 1 phẩy 95, tức 0 phẩy 05."
      - show: |
          <p>② $x = \dfrac{3 - 0{,}05}{1{,}95} = \dfrac{2{,}95}{1{,}95} \approx \hl{1{,}513}$.</p>
          <p class="note">Thử lại: $1{,}95 \cdot 1{,}513 + 0{,}05 \approx 3{,}000$ ✓</p>
        focus: [1, 2]
        say: "Câu hai, giá trị thật bằng 3 trừ 0 phẩy 05, chia 1 phẩy 95, xấp xỉ 1 phẩy 513. Thử lại theo chiều xuôi, 1 phẩy 95 nhân 1 phẩy 513 cộng 0 phẩy 05 xấp xỉ 3, đúng số cảm biến báo."

