# Phép tính hiển thị mà arith_scan.py báo nhưng đúng có chủ ý. Khoá: "KHOÁ/Lxx: <vế trái> <= hoặc ≈> <vế phải>" đúng như bản in của máy quét.
# Mỗi mục kèm lý do; mục mới phải được người đọc xác nhận. KHÔNG thêm phép tính sai vào đây (sửa bài).
allow:
  - "DMS/L00: 2 + 2 = 5"            # ví dụ cố ý sai ("2 + 2 = 5" để dạy phản chứng/lỗi lôgic)
  - "PLC/L11: 255 + 1 = 0"         # tràn số 8 bit không dấu: 255 + 1 quay về 0
  - "CAS/L09: 16 − 1 = 65 535"     # 2^16 − 1 (số mũ bị mất khi bỏ thẻ <sup>)
  - "INT/L01: 1000 × 1000 = 1"     # "= 1 triệu" (đơn vị theo sau)
  - "INT/L07: 50 × (1 + 4) = 100"  # khoảng "100 đến 250 triệu"
  - "NET/L05: 0   /26 = 255.255.255.192"  # ký hiệu mặt nạ mạng, không phải phép chia
  - "CAS/L08: 60 + 30 = 1350"      # (23·60 + 30) − 1·60 = 1350: biểu thức thời gian bị cắt chuỗi
