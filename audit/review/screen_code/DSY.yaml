  DSY L14 example 0 0:
    sha: 48a554dae6ab79ea
    kind: pseudo
    reason: Mã giả tiếng Việt cho người nhận thông điệp (bắt đầu giao dịch, nếu …
      bỏ qua, cam kết). Điều bài nói về kết quả được kiểm bằng bản Python đối chiếu
      src:DSY:L14_doi_chieu (sqlite, giao dịch thật).
    claims:
    - 'bước 2–3: dãy #42 (+100), #43 (+50), #42 (lặp) → 100, 150, bỏ qua; tổng 150'
    - 'bước 4: hỏng trước khi cam kết → chưa cộng, bảng chưa có #42, gửi lại cộng
      100 lần đầu; hỏng sau cam kết, trước xác nhận → đã cộng, gửi lại bị bỏ qua'
    - 'quiz: (7,+10),(8,+5),(7,+10),(9,−3),(8,+5): không lọc trùng 27; lọc trùng theo
      mã 12'
    unverified_claims:
    - Các kết quả trên kiểm bằng bản Python đối chiếu src:DSY:L14_doi_chieu; độ trung
      thực bản dịch = INFERRED (mã giả không chạy được nguyên văn)
