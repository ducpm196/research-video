course: DSY
sources:
  L14_doi_chieu:
    lang: python
    twin_of: DSY L14 example 0 0
    reason: Dịch sát từng dòng mã giả của khối DSY L14 example 0 0 sang Python + sqlite
      (BEGIN/COMMIT/ROLLBACK thật); hỏng máy giả lập bằng ngoại lệ trước/sau cam kết.
      Độ trung thực bản dịch = INFERRED.
    code: "import sqlite3\nclass Hong(Exception):\n    pass\nclass NguoiNhan:\n  \
      \  def __init__(self):\n        self.con = sqlite3.connect(\":memory:\", isolation_level=None)\n\
      \        self.con.executescript(\"CREATE TABLE tk(so_du INTEGER); INSERT INTO\
      \ tk VALUES (0);\"\n                               \"CREATE TABLE da_xu_ly(ma\
      \ INTEGER PRIMARY KEY);\")\n    def nhan(self, ma, tien, hong=None):\n     \
      \   c = self.con\n        c.execute(\"BEGIN\")                             \
      \                       # bắt đầu giao dịch\n        try:\n            if not\
      \ c.execute(\"SELECT 1 FROM da_xu_ly WHERE ma = ?\", (ma,)).fetchone():  # nếu\
      \ đã có: bỏ qua\n                c.execute(\"UPDATE tk SET so_du = so_du + ?\"\
      , (tien,))         # cộng vào tài khoản\n                c.execute(\"INSERT\
      \ INTO da_xu_ly VALUES (?)\", (ma,))           # thêm vào da_xu_ly\n       \
      \     if hong == \"trước cam kết\":\n                raise Hong()\n        \
      \    c.execute(\"COMMIT\")                                               # cam\
      \ kết giao dịch\n        except Hong:\n            c.execute(\"ROLLBACK\")\n\
      \            raise\n        if hong == \"sau cam kết\":\n            raise Hong()\
      \                                                      # chết trước khi gửi\
      \ xác nhận\n        return \"xác nhận\"\n    def so_du(self):\n        return\
      \ self.con.execute(\"SELECT so_du FROM tk\").fetchone()[0]\n    def co(self,\
      \ ma):\n        return self.con.execute(\"SELECT 1 FROM da_xu_ly WHERE ma =\
      \ ?\", (ma,)).fetchone() is not None\na = NguoiNhan()\ntong = []\nfor ma, tien\
      \ in [(42, 100), (43, 50), (42, 100)]:\n    a.nhan(ma, tien)\n    tong.append(a.so_du())\n\
      ca_hong = {}\nfor luc in (\"trước cam kết\", \"sau cam kết\"):\n    b = NguoiNhan()\n\
      \    try:\n        b.nhan(42, 100, hong=luc)\n    except Hong:\n        pass\n\
      \    truoc = (b.so_du(), b.co(42))\n    b.nhan(42, 100)                    \
      \ # gửi lại sau khi khởi động\n    ca_hong[luc] = (truoc, b.so_du())\nq = NguoiNhan()\n\
      for ma, tien in [(7, 10), (8, 5), (7, 10), (9, -3), (8, 5)]:\n    q.nhan(ma,\
      \ tien)\n"
    post: 'assert tong == [100, 150, 150]

      assert ca_hong["trước cam kết"] == ((0, False), 100)

      assert ca_hong["sau cam kết"] == ((100, True), 100)

      assert q.so_du() == 12 and sum([10, 5, 10, -3, 5]) == 27

      '
