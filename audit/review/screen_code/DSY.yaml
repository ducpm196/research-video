sources:
  L14_doi_chieu:
    lang: python
    twin_of: "DSY L14 example 0 0"
    reason: "Dịch sát từng dòng mã giả của khối DSY L14 example 0 0 sang Python + sqlite (BEGIN/COMMIT/ROLLBACK thật); hỏng máy giả lập bằng ngoại lệ trước/sau cam kết. Độ trung thực bản dịch = INFERRED."
    code: |
      import sqlite3
      class Hong(Exception):
          pass
      class NguoiNhan:
          def __init__(self):
              self.con = sqlite3.connect(":memory:", isolation_level=None)
              self.con.executescript("CREATE TABLE tk(so_du INTEGER); INSERT INTO tk VALUES (0);"
                                     "CREATE TABLE da_xu_ly(ma INTEGER PRIMARY KEY);")
          def nhan(self, ma, tien, hong=None):
              c = self.con
              c.execute("BEGIN")                                                    # bắt đầu giao dịch
              try:
                  if not c.execute("SELECT 1 FROM da_xu_ly WHERE ma = ?", (ma,)).fetchone():  # nếu đã có: bỏ qua
                      c.execute("UPDATE tk SET so_du = so_du + ?", (tien,))         # cộng vào tài khoản
                      c.execute("INSERT INTO da_xu_ly VALUES (?)", (ma,))           # thêm vào da_xu_ly
                  if hong == "trước cam kết":
                      raise Hong()
                  c.execute("COMMIT")                                               # cam kết giao dịch
              except Hong:
                  c.execute("ROLLBACK")
                  raise
              if hong == "sau cam kết":
                  raise Hong()                                                      # chết trước khi gửi xác nhận
              return "xác nhận"
          def so_du(self):
              return self.con.execute("SELECT so_du FROM tk").fetchone()[0]
          def co(self, ma):
              return self.con.execute("SELECT 1 FROM da_xu_ly WHERE ma = ?", (ma,)).fetchone() is not None
      a = NguoiNhan()
      tong = []
      for ma, tien in [(42, 100), (43, 50), (42, 100)]:
          a.nhan(ma, tien)
          tong.append(a.so_du())
      ca_hong = {}
      for luc in ("trước cam kết", "sau cam kết"):
          b = NguoiNhan()
          try:
              b.nhan(42, 100, hong=luc)
          except Hong:
              pass
          truoc = (b.so_du(), b.co(42))
          b.nhan(42, 100)                     # gửi lại sau khi khởi động
          ca_hong[luc] = (truoc, b.so_du())
      q = NguoiNhan()
      for ma, tien in [(7, 10), (8, 5), (7, 10), (9, -3), (8, 5)]:
          q.nhan(ma, tien)
    post: |
      assert tong == [100, 150, 150]
      assert ca_hong["trước cam kết"] == ((0, False), 100)
      assert ca_hong["sau cam kết"] == ((100, True), 100)
      assert q.so_du() == 12 and sum([10, 5, 10, -3, 5]) == 27
