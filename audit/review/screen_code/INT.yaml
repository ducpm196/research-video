  L02_TuGoi:
    lang: java
    java_class: TuGoi
    code: |
      import java.lang.reflect.*;
      public class TuGoi {
          interface Dv { void chuyen(); void ghiVet(); }
          static int moGD = 0;
          static class DvThat implements Dv {
              public void chuyen() { ghiVet(); }
              public void ghiVet() { System.out.println("  ghiVet chay"); }
          }
          public static void main(String[] args) {
              Dv that = new DvThat();
              InvocationHandler vv = (p, m, a) -> {
                  moGD++; System.out.println("vo mo giao dich cho " + m.getName());
                  return m.invoke(that, a);
              };
              Class<?>[] gt = { Dv.class };
              Dv vo = (Dv) Proxy.newProxyInstance(Dv.class.getClassLoader(), gt, vv);
              vo.chuyen();
              System.out.println("so giao dich: " + moGD);
              vo.ghiVet();
              System.out.println("so giao dich: " + moGD);
          }
      }
    expect_stdout: |
      vo mo giao dich cho chuyen
        ghiVet chay
      so giao dich: 1
      vo mo giao dich cho ghiVet
        ghiVet chay
      so giao dich: 2
