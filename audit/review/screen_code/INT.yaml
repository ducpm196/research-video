    - '''Mục tiêu thiết kế: vài mili giây, phải đo bằng benchmark'' — bài tự ghi phải đo'
    - tên đầu ra 'scores' (float [N,1]) của mô hình Isolation Forest xuất bằng skl2onnx — theo bộ chuyển đổi skl2onnx (ghi nhớ), chưa chạy mô hình thật trên máy
