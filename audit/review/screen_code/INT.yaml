  L00_chen_lan_hai:
    lang: sqlite
    reason: "chạy văn bản khối 'INT L00 example 2 0' hai lần: '-- lần chèn thứ hai báo lỗi trùng khóa'"
    prelude_keys: ["src:INT:L00_bang_thanh_toan", "INT L00 example 2 0", "INT L00 example 2 0"]
    code: "SELECT 1;"
    expect_rc: 1
    expect_stderr_contains: "UNIQUE constraint failed: payment_transactions.idempotency_key"
  L01_so_thuc:
    lang: java
    java_class: SoThuc
    reason: >-
      Chương trình đầy đủ chứa nguyên văn hai dòng của khối 'INT L01 prereq 2 0' liền nhau; dòng sau nối tiếp biểu thức
      BigDecimal để in ra.
    code: |
      import java.math.BigDecimal;
      public class SoThuc {
          public static void main(String[] args) {
              double d = 0.1 + 0.2;   // in ra 0.30000000000000004
              new BigDecimal("0.1").add(new BigDecimal("0.2"))   // đúng 0.3
                  .toPlainString().lines().forEach(System.out::println);
              System.out.println(d);
          }
      }
    expect_stdout: "0.3\n0.30000000000000004"
  L01_cao_cay:
    lang: python
    twin_of: INT L01 symbol 1 0
    reason: "bản Python của công thức chiều cao cây; độ trung thực = INFERRED"
    code: |
      import math
      N, m = 10_000_000, 1000
      x = math.log(N, m)
      assert abs(x - 7 / 3) < 1e-9 and round(x, 2) == 2.33
      assert math.ceil(round(x, 9)) == 3
      assert m ** 2 == 1_000_000 and m ** 3 == 1_000_000_000 and m ** 2 < N <= m ** 3
    no_claim_reason: "khẳng định bằng assert trong mã"
  L03_so_lo:
    lang: python
    twin_of: INT L03 example 3 0
    reason: "mô phỏng vòng FETCH … LIMIT 1000 / EXIT WHEN COUNT = 0 / FORALL trên 10 000 dòng; độ trung thực = INFERRED"
    code: |
      rows = list(range(10_000)); pos = 0; lo = 0; fetch = 0; forall = 0
      while True:
          l_accounts = rows[pos:pos + 1000]; pos += len(l_accounts); fetch += 1
          if len(l_accounts) == 0:
              break
          forall += 1; lo += 1
      assert lo == 10 and forall == 10 and fetch == 11
      assert 10_000 * 2 == 20_000 and lo * 2 == 20
    no_claim_reason: "khẳng định bằng assert trong mã"
  L04_iso_so:
    lang: python
    reason: "số trên khối 'INT L04 symbol 1 0'"
    code: |
      assert str(50_000_000).zfill(12) == '000050000000' and len('000050000000') == 12
      assert len('123456') == 6 and len('202611070001') == 12
    no_claim_reason: "khẳng định bằng assert trong mã"
  L04_hai_con_tro:
    lang: python
    twin_of: INT L04 example 2 0
    reason: "bản Python dịch sát từng dòng thuật toán hai con trỏ trên màn hình; so với cách đối chiếu bằng tập hợp; độ trung thực = INFERRED"
    code: |
      import random
      def doi_soat(core, napas):
          i = j = 0; xem = 0; kq = {'khop': [], 'lech_tien': [], 'thieu_napas': [], 'thieu_core': []}
          def matchOrFlagAmount(a, b):
              kq['khop' if a[1] == b[1] else 'lech_tien'].append(a[0])
          while i < len(core) and j < len(napas):          # i, j chỉ tiến
              if core[i][0] == napas[j][0]:
                  matchOrFlagAmount(core[i], napas[j]); i += 1; j += 1; xem += 2
              elif core[i][0] < napas[j][0]:
                  kq['thieu_napas'].append(core[i][0]); i += 1; xem += 1
              else:
                  kq['thieu_core'].append(napas[j][0]); j += 1; xem += 1
          while i < len(core):
              kq['thieu_napas'].append(core[i][0]); i += 1; xem += 1   # phần dư = lệch
          while j < len(napas):
              kq['thieu_core'].append(napas[j][0]); j += 1; xem += 1
          return kq, xem
      random.seed(7)
      for _ in range(200):
          rrn = random.sample(range(1, 60), 40)
          core = sorted((r, random.choice([100, 200])) for r in rrn[:30])
          napas = sorted((r, random.choice([100, 200])) for r in rrn[10:])
          kq, xem = doi_soat(core, napas)
          C, Nn = dict(core), dict(napas)
          assert xem == len(core) + len(napas)                 # mỗi bản ghi xem đúng một lần
          assert sorted(kq['thieu_napas']) == sorted(set(C) - set(Nn))
          assert sorted(kq['thieu_core']) == sorted(set(Nn) - set(C))
          assert sorted(kq['khop'] + kq['lech_tien']) == sorted(set(C) & set(Nn))
          assert all(C[r] != Nn[r] for r in kq['lech_tien']) and all(C[r] == Nn[r] for r in kq['khop'])
    no_claim_reason: "khẳng định bằng assert trong mã"
  thu_tu_khoa:
    lang: python
    twin_of: INT L06 example 2 0
    reason: >-
      Mô hình hai phiên, mỗi phiên khoá hai tài khoản tuần tự (giữ khoá tới hết giao dịch); duyệt MỌI cách chen nhau.
      Khoá ngược thứ tự (A→B và B→A, khối INT L06 example 2 0) → có trạng thái bế tắc; khoá nhỏ trước, lớn sau (LEAST rồi
      GREATEST, khối INT L03 example 2 0) → không có. Độ trung thực = INFERRED.
    code: |
      def co_be_tac(p1, p2):
          # trạng thái: (bước của phiên 1, bước của phiên 2); khoá giữ = các tài khoản đã lấy ở các bước trước
          seen, stack = set(), [(0, 0)]
          while stack:
              s = stack.pop()
              if s in seen:
                  continue
              seen.add(s)
              # phiên đã lấy đủ khoá thì ghi nhận (COMMIT) và nhả hết khoá
              giu = [set(p1[:s[0]]) if s[0] < len(p1) else set(), set(p2[:s[1]]) if s[1] < len(p2) else set()]
              di = []
              for k, (p, b) in enumerate(((p1, s[0]), (p2, s[1]))):
                  if b < len(p) and p[b] not in giu[1 - k]:
                      di.append((b + 1, s[1]) if k == 0 else (s[0], b + 1))
              xong = s[0] == len(p1) and s[1] == len(p2)
              if not di and not xong:
                  return True
              stack += di
          return False
      assert co_be_tac(['A', 'B'], ['B', 'A'])
      for a, b in [('A', 'B'), ('B', 'A')]:
          for c, d in [('A', 'B'), ('B', 'A')]:
              assert not co_be_tac([min(a, b), max(a, b)], [min(c, d), max(c, d)])
    no_claim_reason: "khẳng định bằng assert trong mã"
