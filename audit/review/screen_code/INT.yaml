  L00_bang_thanh_toan:
    lang: sqlite
    reason: "bảng tối thiểu mà khối 'INT L00 example 2 0' nói ra trong chú thích: cột idempotency_key có ràng buộc UNIQUE, cột status"
    code: "CREATE TABLE payment_transactions (idempotency_key TEXT UNIQUE, status TEXT);"
    no_claim_reason: "chỉ tạo bảng cho khối khác"
  L06_bang_tai_khoan:
    lang: sqlite
    reason: "bảng tối thiểu cho hai khối 'INT L06 example 2 0/2 1': cột no (mã tài khoản), balance; số dư ban đầu 1000 là số minh hoạ"
    code: "CREATE TABLE account AS SELECT 'A' AS no, 1000 AS balance UNION ALL SELECT 'B', 1000;"
