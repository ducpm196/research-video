      \ gần 1 MB trên heap\n        WeakReference<Object> yeu = new WeakReference<>(tk);   // tham chiếu yếu: chỉ để hỏi, không giữ sống\n        System.out.println(\"con tham chieu: \" + (yeu.get() !=\
