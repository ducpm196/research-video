  "SWF L05 example 0 0":
    sha: 57ccbdca13fece0e
    kind: run
    lang: python
    claims:
      - "bước 2: hai ca (đúng, đúng, đúng) và (sai, sai, sai) phủ đủ 6 nhánh"
      - "bước 3: 2·2·2 = 8 đường; bảng (a, b, c) → s: sss 0, ssđ 4, sđs 2, sđđ 6, đss 1, đsđ 5, đđs 3, đđđ 7"
    post: |
      import itertools
      _bang = {(0, 0, 0): 0, (0, 0, 1): 4, (0, 1, 0): 2, (0, 1, 1): 6, (1, 0, 0): 1, (1, 0, 1): 5, (1, 1, 0): 3, (1, 1, 1): 7}
      assert {t: f(*map(bool, t)) for t in itertools.product((0, 1), repeat=3)} == _bang
      assert len(set(_bang.values())) == 8 == 2 ** 3
      assert f(True, True, True) == 1 + 2 + 4 and f(False, False, False) == 0
    note: "s = tổng các thân if đã chạy: (đ, đ, đ) → 7 nghĩa là cả ba nhánh đúng chạy; (s, s, s) → 0 nghĩa là cả ba nhánh sai; nên hai ca phủ 6 nhánh. 8 giá trị s khác nhau ↔ 8 đường đi."
