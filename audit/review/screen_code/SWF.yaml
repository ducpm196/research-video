  SWF L02 example 0 0:
    sha: 6f4b7f6b5a2c771f
    kind: run
    lang: python
    claims:
    - 'bảng bước 3: 252, 105 → a % b = 42, 21, 0; dừng, a = 21'
    - 'bước 4: b đi 105, 42, 21, 0: giảm và dừng sau 3 vòng'
    - 'quiz câu 2: (100, 35): b = 35, 30, 5, 0 → ước chung lớn nhất 5'
    prelude: a, b = 252, 105
    prelude_reason: 'lời đọc bước 3: "chạy thử với 252 và 105"'
    post: "assert (a, b) == (21, 0)\nimport sys\n_L = open(__file__, encoding=\"utf-8\").read().split(\"\\n\")\n_i = _L.index(\"\
      while b != 0:\")\n_k = \"\\n\".join(_L[_i:_i + 2])\ndef _chay(a0, b0):\n    ns, vet = {\"a\": a0, \"b\": b0}, []\n \
      \   def tr(fr, ev, arg):\n        if fr.f_code.co_filename == \"<khối>\":\n            if ev == \"line\" and fr.f_lineno\
      \ == 1:\n                vet.append(fr.f_globals[\"b\"])\n            return tr\n        return None\n    sys.settrace(tr);\
      \ exec(compile(_k, \"<khối>\", \"exec\"), ns); sys.settrace(None)\n    return ns[\"a\"], vet\nassert _chay(252, 105)\
      \ == (21, [105, 42, 21, 0])\nassert len([105, 42, 21, 0]) - 1 == 3\nassert _chay(100, 35) == (5, [35, 30, 5, 0])\n"
    note: vết b ghi ở mỗi lần kiểm điều kiện while (dòng 1 của khối).
  SWF L05 hook 0 0:
    sha: 0e24b16330051925
    kind: run
    lang: python
    claims:
    - g(5) chạy qua mọi dòng và trả 10 (độ phủ dòng 100%)
    - g(−1) chia cho 0
    post: "import sys\n_seen = set()\ndef _tr(fr, ev, arg):\n    if fr.f_code is g.__code__:\n        if ev == \"line\":\n\
      \            _seen.add(fr.f_lineno)\n        return _tr\n    return None\nsys.settrace(_tr); _r = g(5); sys.settrace(None)\n\
      _lines = {l for _, _, l in g.__code__.co_lines() if l is not None} - {g.__code__.co_firstlineno}\nassert _r == 10 and\
      \ len(_lines) == 3 and _lines <= _seen, (_lines, _seen)\ntry:\n    g(-1)\n    raise SystemExit(\"g(-1) phải chia cho\
      \ 0\")\nexcept ZeroDivisionError:\n    pass\n"
