  "SWF L09 example 0 0":
    sha: 94619314a7924e7f
    kind: run
    lang: python
    claims:
      - "luồng 1 lấy A rồi B; luồng 2 lấy B rồi A"
      - "bước 3: kiểm mọi trạng thái của hai luồng: có đúng 1 trạng thái bế tắc"
      - "bước 4: cả hai cùng lấy A trước rồi B: 0 trạng thái bế tắc"
    prelude: |
      import sys
      A, B = "A", "B"
      _log = {}
      def lay(k):
          _log.setdefault(sys._getframe(1).f_lineno, []).append(("lay", k))
      def nha(k):
          _log.setdefault(sys._getframe(1).f_lineno, []).append(("nha", k))
    prelude_reason: "lời đọc: luồng \"lấy khoá A rồi khoá B\" — lay là lấy khoá, nha là nhả khoá, A/B là khoá của hai tài khoản; prelude chỉ GHI LẠI thứ tự thao tác của mỗi dòng (mỗi dòng là một luồng) để post duyệt mọi cách xen kẽ"
    post: |
      _p = [ops for _, ops in sorted(_log.items())]
      assert _p == [[("lay", "A"), ("lay", "B"), ("nha", "B"), ("nha", "A")],
                    [("lay", "B"), ("lay", "A"), ("nha", "A"), ("nha", "B")]], _p
      def _be_tac(progs):
          start = (0, 0, frozenset())
          seen, stack, dead = {start}, [start], 0
          while stack:
              pa, pb, held = stack.pop()
              moves = []
              for t, pc in ((0, pa), (1, pb)):
                  if pc == len(progs[t]):
                      continue
                  op, k = progs[t][pc]
                  if op == "lay" and any(h[0] == k for h in held):
                      continue
                  nh = held | {(k, t)} if op == "lay" else held - {(k, t)}
                  moves.append((pa + 1, pb, frozenset(nh)) if t == 0 else (pa, pb + 1, frozenset(nh)))
              if not moves and (pa < len(progs[0]) or pb < len(progs[1])):
                  dead += 1
              for m in moves:
                  if m not in seen:
                      seen.add(m)
                      stack.append(m)
          return dead
      assert _be_tac(_p) == 1
      assert _be_tac([_p[0], _p[0]]) == 0
    note: "Khối chạy tuần tự một lần chỉ để ghi thứ tự thao tác thật của hai dòng; số trạng thái bế tắc tính bằng duyệt mọi trạng thái (cùng định nghĩa với checklib.deadlock_states). Bản sửa (bước 4) không hiện thành mã: post dùng thứ tự của luồng 1 cho cả hai luồng."
