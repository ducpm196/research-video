  SWF L05 example 0 0:
    sha: 57ccbdca13fece0e
    kind: run
    lang: python
    claims:
    - 'bước 2: hai ca (đúng, đúng, đúng) và (sai, sai, sai) phủ đủ 6 nhánh'
    - 'bước 3: 2·2·2 = 8 đường; bảng (a, b, c) → s: sss 0, ssđ 4, sđs 2, sđđ 6, đss 1, đsđ 5, đđs 3, đđđ 7'
    post: 'import itertools

      _bang = {(0, 0, 0): 0, (0, 0, 1): 4, (0, 1, 0): 2, (0, 1, 1): 6, (1, 0, 0): 1, (1, 0, 1): 5, (1, 1, 0): 3, (1, 1, 1):
      7}

      assert {t: f(*map(bool, t)) for t in itertools.product((0, 1), repeat=3)} == _bang

      assert len(set(_bang.values())) == 8 == 2 ** 3

      assert f(True, True, True) == 1 + 2 + 4 and f(False, False, False) == 0

      '
    note: 's = tổng các thân if đã chạy: (đ, đ, đ) → 7 nghĩa là cả ba nhánh đúng chạy; (s, s, s) → 0 nghĩa là cả ba nhánh
      sai; nên hai ca phủ 6 nhánh. 8 giá trị s khác nhau ↔ 8 đường đi.'
  SWF L08 hook 0 0:
    sha: 1603c992b543887f
    kind: run
    lang: python
    claims:
    - Ba biến đúng/sai cho 2^3 = 8 tổ hợp, nhưng đèn chỉ có 3 trạng thái hợp lệ. Năm tổ hợp còn lại là trạng thái không tên
    post: 'import itertools

      _th = list(itertools.product((True, False), repeat=3))

      _hl = [t for t in _th if sum(t) == 1]

      assert len(_th) == 8 and len(_hl) == 3 and len(_th) - len(_hl) == 5

      assert (dang_do, dang_xanh, dang_vang) in _hl

      '
  SWF L09 example 0 0:
    sha: 94619314a7924e7f
    kind: run
    lang: python
    claims:
    - luồng 1 lấy A rồi B; luồng 2 lấy B rồi A
    - 'bước 3: kiểm mọi trạng thái của hai luồng: có đúng 1 trạng thái bế tắc'
    - 'bước 4: cả hai cùng lấy A trước rồi B: 0 trạng thái bế tắc'
    prelude: "import sys\nA, B = \"A\", \"B\"\n_log = {}\ndef lay(k):\n    _log.setdefault(sys._getframe(1).f_lineno, []).append((\"\
      lay\", k))\ndef nha(k):\n    _log.setdefault(sys._getframe(1).f_lineno, []).append((\"nha\", k))\n"
    prelude_reason: 'lời đọc: luồng "lấy khoá A rồi khoá B" — lay là lấy khoá, nha là nhả khoá, A/B là khoá của hai tài khoản;
      prelude chỉ GHI LẠI thứ tự thao tác của mỗi dòng (mỗi dòng là một luồng) để post duyệt mọi cách xen kẽ'
    post: "_p = [ops for _, ops in sorted(_log.items())]\nassert _p == [[(\"lay\", \"A\"), (\"lay\", \"B\"), (\"nha\", \"\
      B\"), (\"nha\", \"A\")],\n              [(\"lay\", \"B\"), (\"lay\", \"A\"), (\"nha\", \"A\"), (\"nha\", \"B\")]], _p\n\
      def _be_tac(progs):\n    start = (0, 0, frozenset())\n    seen, stack, dead = {start}, [start], 0\n    while stack:\n\
      \        pa, pb, held = stack.pop()\n        moves = []\n        for t, pc in ((0, pa), (1, pb)):\n            if pc\
      \ == len(progs[t]):\n                continue\n            op, k = progs[t][pc]\n            if op == \"lay\" and any(h[0]\
      \ == k for h in held):\n                continue\n            nh = held | {(k, t)} if op == \"lay\" else held - {(k,\
      \ t)}\n            moves.append((pa + 1, pb, frozenset(nh)) if t == 0 else (pa, pb + 1, frozenset(nh)))\n        if\
      \ not moves and (pa < len(progs[0]) or pb < len(progs[1])):\n            dead += 1\n        for m in moves:\n      \
      \      if m not in seen:\n                seen.add(m)\n                stack.append(m)\n    return dead\nassert _be_tac(_p)\
      \ == 1\nassert _be_tac([_p[0], _p[0]]) == 0\n"
    note: 'Khối chạy tuần tự một lần chỉ để ghi thứ tự thao tác thật của hai dòng; số trạng thái bế tắc tính bằng duyệt mọi
      trạng thái (cùng định nghĩa với checklib.deadlock_states). Bản sửa (bước 4) không hiện thành mã: post dùng thứ tự của
      luồng 1 cho cả hai luồng.'
