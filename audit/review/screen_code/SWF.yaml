  "SWF L02 example 0 0":
    sha: 6f4b7f6b5a2c771f
    kind: run
    lang: python
    claims:
      - "bảng bước 3: 252, 105 → a % b = 42, 21, 0; dừng, a = 21"
      - "bước 4: b đi 105, 42, 21, 0: giảm và dừng sau 3 vòng"
      - "quiz câu 2: (100, 35): b = 35, 30, 5, 0 → ước chung lớn nhất 5"
    prelude: "a, b = 252, 105"
    prelude_reason: "lời đọc bước 3: \"chạy thử với 252 và 105\""
    post: |
      assert (a, b) == (21, 0)
      import sys
      _L = open(__file__, encoding="utf-8").read().split("\n")
      _i = _L.index("while b != 0:")
      _k = "\n".join(_L[_i:_i + 2])
      def _chay(a0, b0):
          ns, vet = {"a": a0, "b": b0}, []
          def tr(fr, ev, arg):
              if fr.f_code.co_filename == "<khối>":
                  if ev == "line" and fr.f_lineno == 1:
                      vet.append(fr.f_globals["b"])
                  return tr
              return None
          sys.settrace(tr); exec(compile(_k, "<khối>", "exec"), ns); sys.settrace(None)
          return ns["a"], vet
      assert _chay(252, 105) == (21, [105, 42, 21, 0])
      assert len([105, 42, 21, 0]) - 1 == 3
      assert _chay(100, 35) == (5, [35, 30, 5, 0])
    note: "vết b ghi ở mỗi lần kiểm điều kiện while (dòng 1 của khối)."
  "SWF L05 hook 0 0":
    sha: 0e24b16330051925
    kind: run
    lang: python
    claims: ["g(5) chạy qua mọi dòng và trả 10 (độ phủ dòng 100%)", "g(−1) chia cho 0"]
    post: |
      import sys
      _seen = set()
      def _tr(fr, ev, arg):
          if fr.f_code is g.__code__:
              if ev == "line":
                  _seen.add(fr.f_lineno)
              return _tr
          return None
      sys.settrace(_tr); _r = g(5); sys.settrace(None)
      _lines = {l for _, _, l in g.__code__.co_lines() if l is not None} - {g.__code__.co_firstlineno}
      assert _r == 10 and len(_lines) == 3 and _lines <= _seen, (_lines, _seen)
      try:
          g(-1)
          raise SystemExit("g(-1) phải chia cho 0")
      except ZeroDivisionError:
          pass
