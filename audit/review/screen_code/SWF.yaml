  SWF L12 sym 0 0:
    sha: 6d6440c60b26684b
    kind: run
    lang: python
    claims:
    - '# → SELECT name FROM users WHERE name = '''' OR ''1''=''1'''
    - 'tham số hoá: câu lệnh cố định, đầu vào chỉ là dữ liệu'
    - 'quiz câu 1: đầu vào x'' OR 1=1 -- : ghép chuỗi trả 2 dòng, tham số hoá trả 0 dòng'
    prelude: 'import sqlite3

      db = sqlite3.connect(":memory:")

      db.executescript("CREATE TABLE users(name TEXT); INSERT INTO users VALUES (''alice''), (''bob'');")

      ten = "'' OR ''1''=''1"

      '
    prelude_reason: đầu vào ten lấy từ chú thích của chính khối (kết quả '' OR '1'='1'); db là kết nối tới bảng users (cột
      name) mà bài tả ở cảnh chuẩn bị, 2 dòng như quiz nói
    post: 'assert q == "SELECT name FROM users WHERE name = '''' OR ''1''=''1''"

      assert len(db.execute(q).fetchall()) == 2

      assert db.execute("SELECT name FROM users WHERE name = ?", (ten,)).fetchall() == []

      _L = open(__file__, encoding="utf-8").read().split("\n")

      _dong_q = next(l for l in _L if l.startswith("q = \"SELECT"))

      _ns = {"ten": "x'' OR 1=1 --"}

      exec(_dong_q, _ns)

      assert len(db.execute(_ns["q"]).fetchall()) == 2

      assert db.execute("SELECT name FROM users WHERE name = ?", (_ns["ten"],)).fetchall() == []

      '
