sources:
  L01_khoang:
    lang: node
    reason: "chạy hai điều kiện của cảnh example (đúng nguyên văn hai dòng trên màn hình) với mọi số nguyên từ −50 đến 50"
    code: |
      let lech = 0, dung = 0, bang = [];
      for (let x = -50; x <= 50; x++) {
        let dau = false, moi = false;
        if (!(x > 0 && x < 10))   // x KHÔNG nằm hẳn giữa 0 và 10
          dau = true;
        if (x <= 0 || x >= 10)
          moi = true;
        if (dau !== moi) lech++;
        if (dau) dung++;
        if (x === -1 || x === 5 || x === 10) bang.push((dau ? "Đ" : "S") + (moi ? "Đ" : "S"));
      }
      console.log(lech, dung, bang.join(" "));
    expect_stdout: "0 92 ĐĐ SS ĐĐ"
    claims:
      - "bảng: x = −1: Đ, Đ; x = 5: S, S; x = 10: Đ, Đ"
      - "máy đã kiểm mọi số nguyên từ âm 50 đến 50 (hai điều kiện trùng nhau)"
      - "điều kiện đúng khi x không nằm trong khoảng (0; 10): 101 − 9 = 92 số"
    unverified_claims:
      - "bài không nêu tên ngôn ngữ; máy chạy bằng JavaScript (node). Nghĩa giống hệt trong C/Java là suy luận từ đặc tả (!, &&, || trên giá trị đúng/sai), không chạy C vì máy không có trình biên dịch C — INFERRED"
  L01_phu_dinh:
    lang: node
    reason: "chạy đáp án quiz câu 1 (đúng nguyên văn dòng trên màn hình) so với phủ định của điều kiện gốc x >= 0 || y % 2 == 0, cả x, y âm"
    code: |
      let lech = 0;
      const thu = {};
      for (let x = -5; x <= 5; x++) for (let y = -5; y <= 5; y++) {
        const goc = x >= 0 || y % 2 == 0;
        const phu = (
          x < 0 && y % 2 != 0     // x âm VÀ y lẻ
        );
        if (phu !== !goc) lech++;
        thu[x + "," + y] = [goc, phu];
      }
      console.log(lech, JSON.stringify(thu["-1,3"]), JSON.stringify(thu["2,3"]));
    expect_stdout: "0 [false,true] [true,false]"
    claims:
      - "bảng: (−1, 3): gốc S, phủ định Đ; (2, 3): gốc Đ, phủ định S"
      - "x âm VÀ y lẻ là phủ định của x không âm hoặc y chẵn"
    unverified_claims:
      - "bài không nêu tên ngôn ngữ; máy chạy bằng JavaScript (node). Nghĩa giống hệt trong C/Java là suy luận từ đặc tả (!, &&, || trên giá trị đúng/sai), không chạy C vì máy không có trình biên dịch C — INFERRED"
