sources:
  L01_hook_twin:
    lang: python
    twin_of: "CSA L01 hook 0 0"
    reason: "bản Python dịch sát 2 dòng C: int8_t x = 127; x = x + 1 (cộng ở kiểu int rồi đổi về int8_t theo quy ước quay vòng mod 2^8 của GCC/Clang); độ trung thực bản dịch = INFERRED"
    code: |
      def to_int8(v):            # đổi về int8_t: giữ 8 bit thấp, đọc theo bù 2
          v &= 0xFF
          return v - 256 if v >= 128 else v
      x = to_int8(127)           # int8_t x = 127;
      x = to_int8(x + 1)         # x = x + 1;   (x + 1 tính ở kiểu int = 128)
      print(x)
    expect_stdout: "-128"
  L03_repl:
    lang: python
    reason: "tái hiện phiên tương tác của khối CSA L03 hook 0 0: in dấu nhắc rồi để trình thông dịch hiển thị kết quả (sys.displayhook = repr)"
    code: |
      import code, sys
      ii = code.InteractiveInterpreter()
      for line in ["0.1 + 0.2", "0.1 + 0.2 == 0.3"]:
          print(">>> " + line)
          sys.stdout.flush()
          ii.runsource(line)
      assert repr(0.1 + 0.2).split(".")[1].index("4") == 16   # đuôi ở chữ số thứ mười bảy sau dấu phẩy
    expect_stdout: |
      >>> 0.1 + 0.2
      0.30000000000000004
      >>> 0.1 + 0.2 == 0.3
      False
  L04_repl:
    lang: python
    reason: "tái hiện phiên tương tác của khối CSA L04 hook 0 0"
    code: |
      import code, sys
      ii = code.InteractiveInterpreter()
      for line in ["(1e16 + 1) - 1e16"]:
          print(">>> " + line)
          sys.stdout.flush()
          ii.runsource(line)
    expect_stdout: |
      >>> (1e16 + 1) - 1e16
      0.0
  L07_vm:
    lang: python
    reason: "máy ảo nhỏ đọc NGUYÊN VĂN khối CSA L07 example 0 0 (prog.s) và chạy: li rd, k; add rd, rs, rt; addi rd, rs, k; ble rs, rt, nhãn (nhảy nếu rs ≤ rt) — đúng nghĩa bài giảng"
    files: {prog.s: "CSA L07 example 0 0"}
    code: |
      import re
      prog, labels = [], {}
      for raw in open("prog.s", encoding="utf-8").read().split("\n"):
          line = raw.split("#")[0].strip()
          if not line:
              continue
          m = re.match(r"^(\w+):\s*(.*)$", line)
          if m:
              labels[m.group(1)] = len(prog)
              line = m.group(2)
          op, rest = line.split(None, 1)
          prog.append((op, [a.strip() for a in rest.split(",")]))
      reg, pc, count, rounds = {}, 0, 0, []
      val = lambda a: reg.get(a, 0) if a.startswith("r") else int(a)
      while pc < len(prog):
          op, a = prog[pc]
          count += 1
          pc += 1
          if op == "li":
              reg[a[0]] = int(a[1])
          elif op == "add":
              reg[a[0]] = val(a[1]) + val(a[2])
          elif op == "addi":
              reg[a[0]] = val(a[1]) + int(a[2])
          elif op == "ble":
              jump = val(a[0]) <= val(a[1])
              rounds.append((reg["r1"], reg["r2"], jump))
              if jump:
                  pc = labels[a[2]]
          else:
              raise SystemExit("lệnh lạ " + op)
      assert [op for op, _ in prog] == ["li", "li", "li", "add", "addi", "ble"]
      assert rounds[:3] == [(1, 2, True), (3, 3, True), (6, 4, True)], rounds[:3]
      assert len(rounds) == 10 and rounds[8][0] == 45 and rounds[9] == (55, 11, False)
      assert reg["r1"] == 55 and count == 33 == 3 + 10 * 3
      print(reg["r1"], count)
    expect_stdout: "55 33"
  L07_ldst:
    lang: python
    reason: "máy ảo nhỏ đọc NGUYÊN VĂN khối CSA L07 loadstore 1 0 (prog.s): li, add, addi, ble như L07_vm, thêm sw rs, k(rb) (ô nhớ[rb + k] = rs) và lw rd, k(rb) (rd = ô nhớ[rb + k])"
    files: {prog.s: "CSA L07 loadstore 1 0"}
    code: |
      import re
      prog, labels = [], {}
      for raw in open("prog.s", encoding="utf-8").read().split("\n"):
          line = raw.split("#")[0].strip()
          if not line:
              continue
          m = re.match(r"^(\w+):\s*(.*)$", line)
          if m:
              labels[m.group(1)] = len(prog)
              line = m.group(2)
          op, rest = line.split(None, 1)
          prog.append((op, [a.strip() for a in rest.split(",")]))
      reg, mem, pc, count = {}, {}, 0, 0
      val = lambda a: reg.get(a, 0) if a.startswith("r") else int(a)
      def addr(a):
          k, b = re.match(r"^(-?\d+)\((r\d+)\)$", a).groups()
          return reg[b] + int(k)
      while pc < len(prog):
          op, a = prog[pc]
          count += 1
          pc += 1
          if op == "li":
              reg[a[0]] = int(a[1])
          elif op == "add":
              reg[a[0]] = val(a[1]) + val(a[2])
          elif op == "addi":
              reg[a[0]] = val(a[1]) + int(a[2])
          elif op == "ble":
              if val(a[0]) <= val(a[1]):
                  pc = labels[a[2]]
          elif op == "sw":
              mem[addr(a[1])] = reg[a[0]]
          elif op == "lw":
              reg[a[0]] = mem[addr(a[1])]
          else:
              raise SystemExit("lệnh lạ " + op)
      assert [op for op, _ in prog][-3:] == ["li", "sw", "lw"] and len(prog) == 9
      assert mem == {100: 55} and reg["r1"] == 55 and reg["r4"] == 100 and reg["r5"] == 55
      assert count == 36 == 33 + 3
      print(reg["r5"], count)
    expect_stdout: "55 36"
  L09_pipe:
    lang: python
    reason: "đọc NGUYÊN VĂN hai khối CSA L09 (files), chạy ngữ nghĩa lw/add trên thanh ghi + bộ nhớ nhỏ, và tính thời gian theo mô hình đường ống 5 tầng IF ID EX MEM WB mà bài nêu (lệnh k vào IF ở chu kỳ k + 1; có chuyển tiếp: kết quả lw dùng được ở EX sau MEM; không chuyển tiếp: ID của lệnh dùng ≥ WB của lệnh ghi, vì ghi nửa đầu/đọc nửa sau chu kỳ)"
    files: {pre.s: "CSA L09 prereq 0 0", ex.s: "CSA L09 example 0 0"}
    code: |
      import re
      def parse(fn):
          out = []
          for raw in open(fn, encoding="utf-8").read().split("\n"):
              line = raw.split("#")[0].strip()
              if line:
                  op, rest = line.split(None, 1)
                  out.append((op, [a.strip() for a in rest.split(",")]))
          return out
      for fn in ("pre.s", "ex.s"):
          p = parse(fn)
          assert [op for op, _ in p] == ["lw", "add"]
          reg, mem = {"r3": 7, "r4": 100}, {100: 35}
          for op, a in p:
              if op == "lw":
                  off, base = re.match(r"(-?\d+)\((r\d+)\)", a[1]).groups()
                  reg[a[0]] = mem[reg[base] + int(off)]
              else:
                  reg[a[0]] = reg[a[1]] + reg[a[2]]
          assert reg["r1"] == 35 and reg["r2"] == reg["r1"] + reg["r3"]
          (_, (rd, _)), (_, (_, s1, s2)) = p
          assert rd in (s1, s2)                                  # lệnh 2 dùng r1 do lệnh 1 nạp
      IF, ID, EX, MEM, WB = range(5)
      base_ex_add = 2 + EX                                        # lệnh thứ 2 vào IF ở chu kỳ 2 → EX ở chu kỳ 4 nếu không chờ
      lw_mem, lw_wb = 1 + MEM, 1 + WB                             # 4 và 5
      ex_fwd = max(base_ex_add, lw_mem + 1)
      id_nofwd = max(2 + ID, lw_wb); ex_nofwd = id_nofwd + 1
      assert (lw_mem, lw_wb) == (4, 5) and ex_fwd == 5 and ex_fwd - base_ex_add == 1
      assert id_nofwd == 5 and ex_nofwd == 6 and ex_nofwd - base_ex_add == 2
      n = 100
      assert 5 + n - 1 == 104 and 5 + n - 1 + (ex_fwd - base_ex_add) == 105 and 5 + n - 1 + (ex_nofwd - base_ex_add) == 106
      print("ok")
    expect_stdout: "ok"
