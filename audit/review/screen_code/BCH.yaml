sources:
  L01_chain:
    lang: python
    reason: "đọc NGUYÊN VĂN 4 khối example của BCH L01; mỗi dòng băm( \"A\" | \"B\" ) = xxxxxxxx… được tính lại bằng SHA-256(UTF-8 của A + \"|\" + B), với \"000…0\" = 64 chữ số 0 và mỗi mã rút gọn \"xxxxxxxx…\" thay bằng mã đầy đủ duy nhất có 8 ký tự đầu đó"
    files: {e0.txt: "BCH L01 example 0 0", e1.txt: "BCH L01 example 1 0", e3.txt: "BCH L01 example 3 0", e4.txt: "BCH L01 example 4 0"}
    code: |
      import hashlib, re
      H = lambda prev, data: hashlib.sha256((prev + "|" + data).encode("utf-8")).hexdigest()
      Z = "0" * 64
      datas = ["khối 0", "A trả B 5", "B trả C 2", "C trả A 1"]          # bảng bước 3 của cảnh
      chain, p = [], Z
      for d in datas:
          p = H(p, d); chain.append(p)
      known = set(chain)
      def full(arg):
          if arg == "000…0":
              return Z
          m = re.fullmatch(r"([0-9a-f]{8})…", arg); assert m, arg
          c = [h for h in known if h.startswith(m.group(1))]; assert len(c) == 1, (arg, c)
          return c[0]
      results = []
      for fn in ("e0.txt", "e1.txt", "e3.txt", "e4.txt"):
          for ln in open(fn, encoding="utf-8").read().strip("\n").split("\n"):
              m = re.search(r'băm\( "([^"]+)" \| "([^"]+)" \)(?: = ([0-9a-f]{8})…| khác mã đã lưu)?', ln)
              if m:
                  h = H(full(m.group(1)), m.group(2))
                  if m.group(3):
                      assert h.startswith(m.group(3)), (fn, ln, h[:8])
                  else:                                                  # “khác mã đã lưu” của khối 4
                      assert h != chain[3]
                  known.add(h); results.append(h[:8])
              for want in re.findall(r"(?:mã đã lưu của khối 3|vẫn ghi mã trước)\s+= ([0-9a-f]{8})…", ln):
                  assert chain[2].startswith(want)                       # mã đã lưu của khối 3 = adc720a0…
      assert results[:3] == ["7532f7b2", "fb7c50f3", "91a89d99"] and not chain[2].startswith("91a89d99")
      assert [h[:8] for h in chain] == ["7532f7b2", "fb7c50f3", "adc720a0", "febb5dfe"]
      print(results)
    expect_stdout: "['7532f7b2', 'fb7c50f3', '91a89d99', '4aa11acc']"
  L02_halve:
    lang: python
    reason: "đọc NGUYÊN VĂN dãy chia đôi của BCH L02 prereq"
    files: {h.txt: "BCH L02 prereq 0 0"}
    code: |
      import math
      xs = [int(x) for x in open("h.txt", encoding="utf-8").read().strip().split(" → ")]
      assert xs[0] == 1024 and xs[-1] == 1 and all(b * 2 == a for a, b in zip(xs, xs[1:]))
      assert len(xs) - 1 == 10 == math.log2(1024) and 2 ** 10 == 1024
      print(len(xs) - 1)
    expect_stdout: "10"
  L02_merkle:
    lang: python
    twin_of: "BCH L02 sym 0 0"
    reason: "đọc NGUYÊN VĂN sơ đồ cây Merkle, lấy mọi công thức tên = băm(…) trên sơ đồ, dựng cây bằng SHA-256 (dấu | như bài 1), rồi kiểm bằng chứng cho gd3 = [h4, h12] và việc đổi một giao dịch làm đổi gốc; gd1..gd4 là chuỗi mẫu"
    files: {t.txt: "BCH L02 sym 0 0"}
    code: |
      import hashlib, math, re
      H = lambda s: hashlib.sha256(s.encode("utf-8")).hexdigest()
      txt = open("t.txt", encoding="utf-8").read()
      leaf = dict(re.findall(r"(h\d)=băm\((gd\d)\)", txt))
      node = {n: (a, b) for n, a, b in re.findall(r"(\w+) = băm\((\w+) \| (\w+)\)", txt)}
      assert leaf == {"h1": "gd1", "h2": "gd2", "h3": "gd3", "h4": "gd4"}
      assert node == {"gốc": ("h12", "h34"), "h12": ("h1", "h2"), "h34": ("h3", "h4")}
      def build(gd):
          v = {h: H(gd[g]) for h, g in leaf.items()}
          for n in ("h12", "h34", "gốc"):
              a, b = node[n]; v[n] = H(v[a] + "|" + v[b])
          return v
      gd = {f"gd{i}": f"giao dịch mẫu {i}" for i in range(1, 5)}
      v = build(gd)
      proof = [("phải", v["h4"]), ("trái", v["h12"])]                   # anh em h4, rồi anh em của cha là h12
      x = H(gd["gd3"])
      for side, sib in proof:
          x = H(x + "|" + sib) if side == "phải" else H(sib + "|" + x)
      assert x == v["gốc"] and len(proof) == math.log2(len(leaf)) == 2
      for k in gd:
          assert build(dict(gd, **{k: gd[k] + "!"}))["gốc"] != v["gốc"]
      print(len(proof))
    expect_stdout: "2"
  L08_escrow:
    lang: python
    twin_of: "BCH L08 sym 0 0"
    reason: "đọc NGUYÊN VĂN bảng máy trạng thái ký quỹ, dựng bảng chuyển (hàm → người gọi được phép, trạng thái được phép, trạng thái mới), chạy đường đúng và thử các lời gọi sai"
    files: {s.txt: "BCH L08 sym 0 0"}
    code: |
      import re, sys
      sys.stdout.reconfigure(encoding="utf-8")                          # -I bỏ qua PYTHONIOENCODING
      L = open("s.txt", encoding="utf-8").read().strip("\n").split("\n")
      chain = [s.strip() for s in L[0].split(":", 1)[1].split("→")]
      T = {}
      for ln in L[1:]:
          f, who, st, nxt = re.fullmatch(r"(\S+)\(\)\s+chỉ (người \S+), chỉ khi (\S+?),?(?:\s.*?)?\s+→ (\S+)", ln).groups()
          T[f] = (who, st, nxt)
      assert chain == ["CHỜ_TIỀN", "ĐÃ_KÝ_QUỸ", "ĐÃ_GIAO", "HOÀN_TẤT"]
      def call(state, f, who):
          w, st, nxt = T[f]
          if who != w or state != st:
              return state, False                                       # bị từ chối, trạng thái giữ nguyên
          return nxt, True
      s, path = chain[0], [chain[0]]
      for f, who in (("gửi_tiền", "người mua"), ("xác_nhận_giao", "người mua"), ("rút_tiền", "người bán")):
          s, ok = call(s, f, who); assert ok; path.append(s)
      assert path == chain
      assert call("ĐÃ_KÝ_QUỸ", "rút_tiền", "người bán") == ("ĐÃ_KÝ_QUỸ", False)   # người bán chỉ rút được khi đã giao
      assert call("ĐÃ_GIAO", "rút_tiền", "người mua") == ("ĐÃ_GIAO", False)       # sai người
      assert call("CHỜ_TIỀN", "xác_nhận_giao", "người mua") == ("CHỜ_TIỀN", False)
      assert len({st for _, st, _ in T.values()}) == len(T) == 3                  # mỗi hàm một trạng thái riêng
      print(" → ".join(path))
    expect_stdout: "CHỜ_TIỀN → ĐÃ_KÝ_QUỸ → ĐÃ_GIAO → HOÀN_TẤT"
