    kind: run
    lang: sqlite
    claims:
    - 'chú thích ''-- 2'' và ''-- 4''; bước 1: bảng đơn 2 dòng, bảng dòng hàng 4 dòng'
    prelude: 'CREATE TABLE don(id INT, cua_hang TEXT, tong INT);

      INSERT INTO don VALUES (1,''A'',100),(2,''A'',50);

      CREATE TABLE dong(don INT, sp TEXT, sl INT);

      INSERT INTO dong VALUES (1,''a'',1),(1,''b'',2),(1,''c'',1),(2,''a'',3);

      '
    prelude_reason: 'Bài 2 nói ra dữ liệu bằng bảng, không hiện thành mã: bảng don 2 đơn, tổng 100 và 50 (cảnh check: "100 + 50 = 150"); bảng dong: đơn 1 có ba dòng hàng số lượng 1, 2, 1, đơn 2 có một dòng số lượng 3 (cảnh prereq bước 1). Cột sp (tên sản phẩm) và cua_hang không ảnh hưởng các câu trong khối.'
    expect_stdout: '2

      4'
