# Sổ mã trên màn hình khoá DAN (audit/review/screen_code.py; SC1 nhóm 3, 2026-11-10). Mỗi mục ghim sha của khối.
# Dữ liệu (_data) là bảng bài nói ra bằng bảng/lời (không hiện thành mã) — khớp tools/checklib.py dan_db().
_data:
  don: &don |
    CREATE TABLE don(id INT, cua_hang TEXT, tong INT);
    INSERT INTO don VALUES (1,'A',100),(2,'A',50);
    CREATE TABLE dong(don INT, sp TEXT, sl INT);
    INSERT INTO dong VALUES (1,'a',1),(1,'b',2),(1,'c',1),(2,'a',3);
  don_reason: &don_reason >-
    Bài 2 nói ra dữ liệu bằng bảng, không hiện thành mã: bảng don 2 đơn, tổng 100 và 50 (cảnh check: "100 + 50 = 150");
    bảng dong: đơn 1 có ba dòng hàng số lượng 1, 2, 1, đơn 2 có một dòng số lượng 3 (cảnh prereq bước 1). Cột sp
    (tên sản phẩm) và cua_hang không ảnh hưởng các câu trong khối.
  dt: &dt |
    CREATE TABLE dt(ngay INT, tien INT);
    INSERT INTO dt VALUES (1,10),(2,30),(3,20),(4,40);
  dt_reason: &dt_reason >-
    Bảng dt(ngay, tien) = (1, 10), (2, 30), (3, 20), (4, 40) bài 3 nói ra bằng bảng ở cảnh example bước 1–3, không hiện
    thành mã.
blocks:
  "DAN L02 example 0 0":
    sha: 0621f1cc4b009238
    kind: run
    lang: sqlite
    claims: ["chú thích '-- 2' và '-- 4'; bước 1: bảng đơn 2 dòng, bảng dòng hàng 4 dòng"]
    prelude: *don
    prelude_reason: *don_reason
    expect_stdout: "2\n4"
  "DAN L02 example 1 0":
    sha: c5e5168d925c8447
    kind: run
    lang: sqlite
    claims: ["chú thích '-- 350, 7, 4'; bước 2: kết quả 4 dòng, tổng tiền 350, số món 7"]
    prelude: *don
    prelude_reason: *don_reason
    expect_stdout: "350|7|4"
  "DAN L02 example 2 0":
    sha: 3ccb34b7b57f61c3
    kind: run
    lang: sqlite
    claims: ["chú thích '-- (1, 4), (2, 3)'; bước 3: đơn 1 có 4 món, đơn 2 có 3 món, còn 2 dòng"]
    prelude: *don
    prelude_reason: *don_reason
    expect_stdout: "1|4\n2|3"
  "DAN L02 example 3 0":
    sha: 8b07e7d86a14f1c2
    kind: run
    lang: sqlite
    claims: ["chú thích '-- 150, 7'; bước 4: tổng tiền 150, số món 7"]
    prelude: *don
    prelude_reason: *don_reason
    expect_stdout: "150|7"
  "DAN L03 example 3 0":
    sha: 55d9e08ebf79986c
    kind: run
    lang: sqlite
    claims:
      - "bảng bước 4 (ngày, tiền, lũy kế, so với hôm trước, hạng): 1 10 10 — 4; 2 30 40 +20 2; 3 20 60 −10 3; 4 40 100 +20 1"
      - "'Ngày đầu không có hôm trước nên chênh lệch để rỗng' (NULL)"
    prelude: *dt
    prelude_reason: *dt_reason
    expect_stdout: "1|10|10|NULL|4\n2|30|40|20|2\n3|20|60|-10|3\n4|40|100|20|1"
