    sha: aabf8fdfba1e1837
    kind: run
    lang: python
    claims:
    - 'khung.nbytes    # 6220800'
    - 'lời đọc: Máy trả lời 6 triệu 220 nghìn 800 … mỗi số 8 bit chiếm đúng một byte'
    post: |
      import ast as _a
      _k = "\n".join(open(__file__, encoding="utf-8").read().split("\n")[:3])
      _v = [eval(compile(_a.Expression(n.value), "<khối>", "eval")) for n in _a.parse(_k).body if isinstance(n, _a.Expr)]
      assert _v == [6220800] and khung.itemsize == 1 and khung.shape == (1080, 1920, 3), _v
    note: 'Sửa 2026-11-10 (SC1 nhóm 1): thêm dòng `import numpy as np` (bản cũ NameError: np). Chạy với numpy 2.5.4 của .venv.'
