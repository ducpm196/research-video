sources:
  L00_KiemMay:
    lang: bash
    profile: fnd
    fs:
      kiem.sh: |
        for ten in bash git javac java python; do
          if command -v "$ten" >/dev/null; then echo "✔ $ten"
          else echo "THIEU $ten"; fi
        done
        if python -c "import sqlite3" 2>/dev/null; then echo "✔ sql"
        else echo "THIEU sql"; fi
    session:
    - cmd: bash kiem.sh
      out: |-
        ✔ bash
        ✔ git
        ✔ javac
        ✔ java
        ✔ python
        ✔ sql
  L00_GoSai:
    lang: bash
    profile: fnd
    session:
    - cmd: pyton --version
      out: 'bash: pyton: command not found'
  L01_PhienDi:
    lang: bash
    profile: fnd
    fs:
      anh/meo.png: x
      anh/cho.png: x
      hoc/ghichu.txt: x
      hoc/nen/bai1.txt: x
      hoc/nen/bai2.txt: x
      hoc/toan/loi.txt: x
      tai_ve/phim.mp4: x
      .bashrc: ''
    session:
    - cmd: pwd
      out: /c/Users/ban
    - cmd: ls
      out: anh/  hoc/  tai_ve/
    - cmd: ls -a
      out: ./  ../  .bashrc  anh/  hoc/  tai_ve/
    - cmd: ls hoc
      out: ghichu.txt  nen/  toan/
    - cmd: cd hoc
      out: ''
    - cmd: pwd
      out: /c/Users/ban/hoc
    - cmd: cd nen
      out: ''
    - cmd: pwd
      out: /c/Users/ban/hoc/nen
    - cmd: cd ../../anh
      out: ''
    - cmd: pwd
      out: /c/Users/ban/anh
    - cmd: ls
      out: cho.png  meo.png
    - cmd: cd
      out: ''
    - cmd: pwd
      out: /c/Users/ban
    unverified_claims:
    - bố cục cột của `ls` là giả lập cửa sổ lệnh rộng 80 cột (alias -F -C -w 80 của runner), không phải cửa sổ thật
  L01_PhienHook:
    lang: bash
    profile: fnd
    fs:
      anh/meo.png: x
      anh/cho.png: x
      hoc/ghichu.txt: x
      hoc/nen/bai1.txt: x
      hoc/nen/bai2.txt: x
      hoc/toan/loi.txt: x
      tai_ve/phim.mp4: x
      .bashrc: ''
    session:
    - cmd: ls /c/Users/anhA/du_lieu.csv
      out: 'ls: cannot access ''/c/Users/anhA/du_lieu.csv'': No such file or directory'
    unverified_claims:
    - bố cục cột của `ls` là giả lập cửa sổ lệnh rộng 80 cột (alias -F -C -w 80 của runner), không phải cửa sổ thật
  L01_PhienKiem:
    lang: bash
    profile: fnd
    fs:
      anh/meo.png: x
      anh/cho.png: x
      hoc/ghichu.txt: x
      hoc/nen/bai1.txt: x
      hoc/nen/bai2.txt: x
      hoc/toan/loi.txt: x
      tai_ve/phim.mp4: x
      .bashrc: ''
    session:
    - cmd: cd /c/Users/ban/anh
      out: ''
    - cmd: pwd
      out: /c/Users/ban/anh
    - cmd: cd /c/Users/ban/hoc/nen
      out: ''
    - cmd: cd ../../anh
      out: ''
    - cmd: pwd
      out: /c/Users/ban/anh
  L01_PhienLoi:
    lang: bash
    profile: fnd
    fs:
      anh/meo.png: x
      anh/cho.png: x
      hoc/ghichu.txt: x
      hoc/nen/bai1.txt: x
      hoc/nen/bai2.txt: x
      hoc/toan/loi.txt: x
      tai_ve/phim.mp4: x
      .bashrc: ''
    session:
    - cmd: mkdir 'Tai lieu'
      out: ''
    - cmd: cd Tai lieu
      out: 'bash: cd: too many arguments'
    - cmd: cd 'Tai lieu'
      out: ''
    - cmd: pwd
      out: /c/Users/ban/Tai lieu
    - cmd: cd ~
      out: ''
    - cmd: cd C:\Users\ban
      out: 'bash: cd: C:Usersban: No such file or directory'
    - cmd: cd HOC
      out: ''
    - cmd: pwd
      out: /c/Users/ban/HOC
  L01_PhienQuiz:
    lang: bash
    profile: fnd
    fs:
      anh/meo.png: x
      anh/cho.png: x
      hoc/ghichu.txt: x
      hoc/nen/bai1.txt: x
      hoc/nen/bai2.txt: x
      hoc/toan/loi.txt: x
      tai_ve/phim.mp4: x
      .bashrc: ''
    session:
    - cmd: cd hoc/toan
      out: ''
    - cmd: cd ..
      out: ''
    - cmd: pwd
      out: /c/Users/ban/hoc
    - cmd: cd nen
      out: ''
    - cmd: pwd
      out: /c/Users/ban/hoc/nen
    - cmd: cd ../../anh
      out: ''
    - cmd: pwd
      out: /c/Users/ban/anh
    - cmd: cd
      out: ''
    - cmd: pwd
      out: /c/Users/ban
    - cmd: cd hoc/toan
      out: ''
    - cmd: pwd
      out: /c/Users/ban/hoc/toan
  L02_PhienHook:
    lang: bash
    profile: fnd
    session:
    - cmd: mkdir bc && cd bc
      out: ''
    - cmd: touch a.txt b.txt c.png
      out: ''
    - cmd: ls
      out: a.txt  b.txt  c.png
    - cmd: rm *.txt
      out: ''
    - cmd: ls
      out: c.png
    - cmd: touch a.txt b.txt
      out: ''
    - cmd: rm * .txt
      out: 'rm: cannot remove ''.txt'': No such file or directory'
    - cmd: ls
      out: ''
    unverified_claims:
    - bố cục cột của `ls` là giả lập cửa sổ lệnh rộng 80 cột (alias -F -C -w 80 của runner), không phải cửa sổ thật
  L02_PhienTep:
    lang: bash
    profile: fnd
    session:
    - cmd: mkdir -p du_an/nguon du_an/sao_luu
      out: ''
    - cmd: cd du_an
      out: ''
    - cmd: touch nguon/main.txt
      out: ''
    - cmd: ls -R
      out: |-
        .:
        nguon/  sao_luu/

        ./nguon:
        main.txt

        ./sao_luu:
    - cmd: echo "dong 1" > nguon/main.txt
      out: ''
    - cmd: echo "dong 2" >> nguon/main.txt
      out: ''
    - cmd: cat nguon/main.txt
      out: |-
        dong 1
        dong 2
    - cmd: echo "ghi de" > nguon/main.txt
      out: ''
    - cmd: cat nguon/main.txt
      out: ghi de
    - cmd: cp nguon/main.txt sao_luu/ban_sao.txt
      out: ''
    - cmd: mv sao_luu/ban_sao.txt sao_luu/ghi_chu.txt
      out: ''
    - cmd: ls nguon sao_luu
      out: |-
        nguon:
        main.txt

        sao_luu:
        ghi_chu.txt
    - cmd: rm sao_luu/ghi_chu.txt
      out: ''
    - cmd: ls sao_luu
      out: ''
    - cmd: ls nguon
      out: main.txt
    - cmd: rm nguon
      out: 'rm: cannot remove ''nguon'': Is a directory'
    - cmd: rm -r nguon
      out: ''
    - cmd: ls
      out: sao_luu/
    unverified_claims:
    - bố cục cột của `ls` là giả lập cửa sổ lệnh rộng 80 cột (alias -F -C -w 80 của runner), không phải cửa sổ thật
  L02_PhienSao:
    lang: bash
    profile: fnd
    session:
    - cmd: touch a.txt b.txt c.png
      out: ''
    - cmd: echo *.txt
      out: a.txt b.txt
    - cmd: echo *
      out: a.txt b.txt c.png
    - cmd: echo * .txt
      out: a.txt b.txt c.png .txt
    - cmd: echo ?.png
      out: c.png
    - cmd: echo ??.png
      out: ??.png
  L02_PhienKiem:
    lang: bash
    profile: fnd
    session:
    - cmd: mkdir p && cd p
      out: ''
    - cmd: touch a b c d e
      out: ''
    - cmd: ls | wc -l
      out: '5'
    - cmd: rm a b
      out: ''
    - cmd: ls | wc -l
      out: '3'
    - cmd: find . -type f | wc -l
      out: '3'
  L02_PhienQuyMo:
    lang: bash
    profile: fnd
    session:
    - cmd: mkdir q && cd q
      out: ''
    - cmd: touch t{1..3}.txt
      out: ''
    - cmd: ls *.txt | wc -l
      out: '3'
    - cmd: touch t{1..300}.txt
      out: ''
    - cmd: ls *.txt | wc -l
      out: '300'
    - cmd: touch t{1..3000}.txt
      out: ''
    - cmd: ls *.txt | wc -l
      out: '3000'
  L02_PhienDirRong:
    lang: bash
    profile: fnd
    session:
    - cmd: DIR=
      out: ''
    - cmd: echo "$DIR/"
      out: /
  L02_PhienQuiz:
    lang: bash
    profile: fnd
    session:
    - cmd: touch bao_cao_1.txt bao_cao_2.txt bao_cao_10.txt anh_1.png ghi_chu.txt
      out: ''
    - cmd: echo bao_cao_?.txt
      out: bao_cao_1.txt bao_cao_2.txt
    - cmd: echo bao_cao_*.txt
      out: bao_cao_1.txt bao_cao_10.txt bao_cao_2.txt
    - cmd: echo *.txt
      out: bao_cao_1.txt bao_cao_10.txt bao_cao_2.txt ghi_chu.txt
    - cmd: echo *_1.*
      out: anh_1.png bao_cao_1.txt
  L03_PhienDoc:
    lang: bash
    profile: fnd
    fs:
      giaodich.csv: |
        ma,loai,tai_khoan,so_tien
        1,chuyen,A01,500000
        2,nap,A02,2000000
        3,rut,A01,300000
        4,chuyen,A03,150000
        5,chuyen,A02,800000
        6,nap,A01,1000000
        7,rut,A03,200000
        8,chuyen,A01,50000
        9,nap,A03,750000
        10,chuyen,A02,120000
        11,rut,A02,400000
        12,chuyen,A03,900000
    session:
    - cmd: head -n 3 giaodich.csv
      out: |-
        ma,loai,tai_khoan,so_tien
        1,chuyen,A01,500000
        2,nap,A02,2000000
    - cmd: tail -n 2 giaodich.csv
      out: |-
        11,rut,A02,400000
        12,chuyen,A03,900000
    - cmd: wc -l giaodich.csv
      out: 13 giaodich.csv
    - cmd: tail -n +2 giaodich.csv | wc -l
      out: '12'
  L03_PhienLoc:
    lang: bash
    profile: fnd
    fs:
      giaodich.csv: |
        ma,loai,tai_khoan,so_tien
        1,chuyen,A01,500000
