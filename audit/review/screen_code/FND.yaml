      # may kiem chua cai sqlite3: dung ban thay the cua kho (hoc vien da cai sqlite3 thi bo qua hai dong nay)
      command -v sqlite3 > /dev/null 2>&1 || sqlite3() { cat > q.sql; python "$(dirname "$0")/../../sqlrun.py" q.sql; }
      {
