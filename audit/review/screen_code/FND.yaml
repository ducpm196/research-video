      out: |-
        HTTP/1.1 200 OK
        Content-Type: text/plain
        Content-Length: 7

        1500000
    - cmd: curl -s -o /dev/null -w "%{http_code}\n" $U/khong_co
      out: '404'
    - cmd: 'curl -s $U/khong_co; echo " ma thoat: $?"'
      out: 'khong thay ma thoat: 0'
    - cmd: 'curl -sf $U/khong_co; echo "ma thoat: $?"'
      out: 'ma thoat: 22'
    - cmd: curl -s -i -X POST -d a=1 $U/chuyen
      out: |-
        HTTP/1.1 201 Created
