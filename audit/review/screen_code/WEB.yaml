course: WEB
sources:
  L01_cay:
    lang: python
    reason: Dựng cây DOM của mã hiện nội dòng ở bước 1 (WEB L01 example) bằng html.parser
      của thư viện chuẩn, in theo đúng dạng sơ đồ; kiểm thêm số phần tử, độ sâu và
      hai mã ở quiz.
    code: "import sys\nsys.stdout.reconfigure(encoding=\"utf-8\")   # chạy với -I\
      \ nên PYTHONIOENCODING bị bỏ qua\nfrom html.parser import HTMLParser\nclass\
      \ P(HTMLParser):\n    def __init__(s):\n        super().__init__()\n       \
      \ s.stack, s.nodes = [], []\n    def handle_starttag(s, tag, a):\n        node\
      \ = {\"tag\": tag, \"text\": \"\", \"kids\": [], \"depth\": len(s.stack) + 1}\n\
      \        (s.stack[-1][\"kids\"] if s.stack else s.nodes).append(node)\n    \
      \    s.stack.append(node)\n    def handle_endtag(s, tag):\n        s.stack.pop()\n\
      \    def handle_data(s, d):\n        if s.stack and not s.stack[-1][\"text\"\
      ]:\n            s.stack[-1][\"text\"] = d\ndef doc(ma):\n    p = P()\n    p.feed(ma)\n\
      \    return p\ndef dem(nodes):\n    n, sau = 0, 0\n    for x in nodes:\n   \
      \     k, s2 = dem(x[\"kids\"])\n        n, sau = n + 1 + k, max(sau, x[\"depth\"\
      ], s2)\n    return n, sau\np = doc(\"<ul><li>A</li><li>B<b>!</b></li></ul>\"\
      )\nassert p.stack == []\nout = []\ndef ve(n, tien_to, cuoi, goc):\n    nhan\
      \ = n[\"tag\"] + (f'  \"{n[\"text\"]}\"' if n[\"text\"] else \"\")\n    dau\
      \ = \"\" if goc else tien_to + (\"└── \" if cuoi else \"├── \")\n    out.append((dau\
      \ + nhan).ljust(19) + f\"độ sâu {n['depth']}\")\n    con = \"\" if goc else\
      \ tien_to + (\"    \" if cuoi else \"│   \")\n    for i, k in enumerate(n[\"\
      kids\"]):\n        ve(k, con, i == len(n[\"kids\"]) - 1, False)\nfor n in p.nodes:\n\
      \    ve(n, \"\", True, True)\nprint(\"\\n\".join(out))\n"
    post: 'assert dem(p.nodes) == (4, 3)

      assert dem(doc("<article><h1>T</h1><p>a<em>b</em> c</p></article>").nodes) ==
      (4, 3)

      assert dem(doc("<nav><ul><li><a>A</a></li><li><a>B</a></li></ul></nav>").nodes)
      == (6, 4)

      '
