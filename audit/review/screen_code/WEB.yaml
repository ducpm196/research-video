  WEB L01 example 3 0:
    sha: 03aa5de4105eaef7
    kind: output
    of: src:WEB:L01_cay
    reason: Sơ đồ cây DOM của mã <ul><li>A</li><li>B<b>!</b></li></ul> (mã hiện nội
      dòng ở bước 1 cùng cảnh); nguồn L01_cay đọc mã đó bằng bộ đọc HTML của thư viện
      chuẩn và in cây cùng độ sâu.
    claims:
    - Cây có 4 phần tử, độ sâu 3; ul độ sâu 1, hai li độ sâu 2, b độ sâu 3; ngăn xếp
      rỗng ở cuối → mã lồng đúng
