  WEB L04 example 0 0:
    sha: fca7427bc7c71809
    kind: run
    lang: node
    prelude: 'const w = ms => new Promise(r => setTimeout(r, ms));

      const layNguoiDung = () => w(100), layDon = () => w(200), layGoiY = () => w(300);

      const t0 = Date.now();

      '
    prelude_reason: 'bước 4: “đo thật bằng Node (giả lập ba yêu cầu)”; thời lượng
      100/200/300 ms là số bài cho (chú thích khối, bảng bước 2–3). Ba hàm lấy dữ
      liệu là lời gọi mạng không có trên máy, nên giả lập đúng như bài nói.'
    claims:
    - 'chú thích: tuần tự ≈ 100 + 200 + 300 = 600 ms; bước 4: đo thật tuần tự ≈ 600
      ms (sai lệch vài chục ms khi máy bận)'
    post: 'taiTuanTu().then(() => {
      const dt = Date.now() - t0;
      if (!(dt >= 590 && dt < 900)) throw new Error("tuần tự đo được " + dt + " ms");
    });'
    note: 'Đã sửa 2026-11-10: trước đó hai cách nằm chung một khối, khai báo `const
      u, d, g` hai lần → SyntaxError “Identifier ''u'' has already been declared”;
      nay tách hai khối, mỗi khối là một chương trình riêng (Node 25 tự nhận await
      cấp cao nhất là mô-đun).'
  WEB L04 example 0 1:
