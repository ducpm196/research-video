    prelude_reason: 'như khối WEB L04 example 0 0: bước 4 nói đo bằng Node với ba
      yêu cầu giả lập 100/200/300 ms.'
    claims:
    - 'chú thích: đồng thời ≈ max(100, 200, 300) = 300 ms; bước 4: đo thật đồng thời
      ≈ 300 ms'
    post: 'taiDongThoi().then(() => {
      const dt = Date.now() - t0;
      if (!(dt >= 295 && dt < 500)) throw new Error("đồng thời đo được " + dt + " ms");
    });'
  WEB L06 example 2 0:
    sha: 9991b02bfb919c3f
    kind: other
    lang: http
    reason: Phác thảo một yêu cầu HTTP có chú thích tiếng Việt trong ngoặc; không
      có trình kiểm bản tin HTTP và không có máy chủ thật.
    read_check: 'Đã đọc kiểm: (1) tên trường Idempotency-Key và kiểu giá trị theo
      draft-ietf-httpapi-idempotency-key-header-08 (Internet-Draft, chưa là RFC; datatracker
      truy cập 2026-11-10, đọc qua công cụ tóm tắt): “Idempotency-Key is an Item Structured
      Header Field [RFC9651]. Its value MUST be a String”, ví dụ `Idempotency-Key:
      "8e03978e-…"` — bản cũ trên màn hình viết giá trị không có nháy (7f3c…), không
      phải String theo RFC 9651 mục 3.3.3, đã sửa thành "7f3c…". (2) Thân `{ "san_pham":
      9, "so_luong": 2 }` là JSON hợp lệ (json.loads). (3) Khối là bản rút gọn, không
      phải bản tin nguyên văn: dòng yêu cầu thiếu phiên bản HTTP, thiếu Host và Content-Type,
      thiếu dòng trống giữa phần đầu và thân (RFC 9112 mục 2.1, 3) — chấp nhận được
      vì bài dạy ý nghĩa khoá, không dạy cú pháp bản tin.'
    unverified_claims:
    - 'bảng bước 3: máy chủ gặp lại khoá 7f3c thì trả lại đơn 1, không tạo mới — hành
      vi máy chủ theo draft-08 (“SHOULD respond with a response consistent with the
      request being completed”), không có máy chủ để chạy; con số 10 233 / 10 000
      do checks alg.api_retry_sim kiểm, không phải cổng'
