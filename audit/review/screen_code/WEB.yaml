sources:
  L01_cay:
    lang: python
    reason: "Dựng cây DOM của mã hiện nội dòng ở bước 1 (WEB L01 example) bằng html.parser của thư viện chuẩn, in theo đúng dạng sơ đồ; kiểm thêm số phần tử, độ sâu và hai mã ở quiz."
    code: |
      import sys
      sys.stdout.reconfigure(encoding="utf-8")   # chạy với -I nên PYTHONIOENCODING bị bỏ qua
      from html.parser import HTMLParser
      class P(HTMLParser):
          def __init__(s):
              super().__init__()
              s.stack, s.nodes = [], []
          def handle_starttag(s, tag, a):
              node = {"tag": tag, "text": "", "kids": [], "depth": len(s.stack) + 1}
              (s.stack[-1]["kids"] if s.stack else s.nodes).append(node)
              s.stack.append(node)
          def handle_endtag(s, tag):
              s.stack.pop()
          def handle_data(s, d):
              if s.stack and not s.stack[-1]["text"]:
                  s.stack[-1]["text"] = d
      def doc(ma):
          p = P()
          p.feed(ma)
          return p
      def dem(nodes):
          n, sau = 0, 0
          for x in nodes:
              k, s2 = dem(x["kids"])
              n, sau = n + 1 + k, max(sau, x["depth"], s2)
          return n, sau
      p = doc("<ul><li>A</li><li>B<b>!</b></li></ul>")
      assert p.stack == []
      out = []
      def ve(n, tien_to, cuoi, goc):
          nhan = n["tag"] + (f'  "{n["text"]}"' if n["text"] else "")
          dau = "" if goc else tien_to + ("└── " if cuoi else "├── ")
          out.append((dau + nhan).ljust(19) + f"độ sâu {n['depth']}")
          con = "" if goc else tien_to + ("    " if cuoi else "│   ")
          for i, k in enumerate(n["kids"]):
              ve(k, con, i == len(n["kids"]) - 1, False)
      for n in p.nodes:
          ve(n, "", True, True)
      print("\n".join(out))
    post: |
      assert dem(p.nodes) == (4, 3)
      assert dem(doc("<article><h1>T</h1><p>a<em>b</em> c</p></article>").nodes) == (4, 3)
      assert dem(doc("<nav><ul><li><a>A</a></li><li><a>B</a></li></ul></nav>").nodes) == (6, 4)
