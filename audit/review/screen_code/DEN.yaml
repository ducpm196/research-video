sources:
  L03_van_ban:
    lang: node
    reason: "Đọc nguyên văn khối DEN L03 sym 0 0 như một biểu thức đối tượng JavaScript và kiểm các điều lời đọc nói về cấu trúc."
    files: {khoi.txt: "DEN L03 sym 0 0"}
    code: |
      const fs = require("fs");
      const doc = eval("(" + fs.readFileSync("khoi.txt", "utf8") + ")");
    post: |
      const ok = doc.ma_don === 1042 && doc.khach.ma === 7 && doc.khach.ten === "An"
        && Array.isArray(doc.dong) && doc.dong.length === 2 && doc.dong[0].sp === 3 && doc.dong[1].sl === 1
        && typeof doc.ma_kho === "number" && Object.keys(doc).join() === "ma_don,khach,dong,ma_kho";
      if (!ok) throw new Error("cấu trúc văn bản mẫu khác lời đọc: " + JSON.stringify(doc));
      let thuan = true;
      try { JSON.parse(fs.readFileSync("khoi.txt", "utf8")); } catch (e) { thuan = false; }
      if (thuan) throw new Error("ngờ: khối có chú thích mà JSON.parse lại nhận");
