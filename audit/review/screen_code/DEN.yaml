  DEN L03 sym 0 0:
    sha: 1baddc745b187798
    kind: other
    lang: js-object
    reason: Văn bản mẫu của cơ sở dữ liệu văn bản, viết như đối tượng JavaScript có chú thích // (kiểu vỏ lệnh của kho văn bản); JSON thuần không cho chú thích nên không khai lang json.
    read_check: 'Đã đọc kiểm: JSON (RFC 8259) không có cú pháp chú thích, nên khối không phải JSON thuần; khối là đối tượng JavaScript hợp lệ — nguồn src:DEN:L03_van_ban (node) eval đúng văn bản đã ghim và kiểm cấu trúc: khach nhúng {ma, ten}, dong là mảng 2 dòng nhúng, ma_kho chỉ là một số (tham chiếu). Bài gọi khối là “văn bản mẫu”, không gọi là JSON.'
    claims:
    - 'lời đọc: văn bản mẫu có mã đơn, nhúng bản sao tên khách, nhúng các dòng hàng, tham chiếu kho bằng cách chỉ giữ mã kho'
    unverified_claims:
    - 'bảng: tiêu chí chọn nhúng/tham chiếu (luôn đọc cùng nhau, số lượng có giới hạn / dùng chung, sửa thường xuyên, tăng không giới hạn) là quy tắc thiết kế, máy không kiểm được'
