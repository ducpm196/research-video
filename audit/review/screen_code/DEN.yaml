course: DEN
sources:
  L03_van_ban:
    lang: node
    reason: Đọc nguyên văn khối DEN L03 sym 0 0 như một biểu thức đối tượng JavaScript
      và kiểm các điều lời đọc nói về cấu trúc.
    files:
      khoi.txt: DEN L03 sym 0 0
    code: 'const fs = require("fs");

      const doc = eval("(" + fs.readFileSync("khoi.txt", "utf8") + ")");

      '
    post: "const ok = doc.ma_don === 1042 && doc.khach.ma === 7 && doc.khach.ten ===\
      \ \"An\"\n  && Array.isArray(doc.dong) && doc.dong.length === 2 && doc.dong[0].sp\
      \ === 3 && doc.dong[1].sl === 1\n  && typeof doc.ma_kho === \"number\" && Object.keys(doc).join()\
      \ === \"ma_don,khach,dong,ma_kho\";\nif (!ok) throw new Error(\"cấu trúc văn\
      \ bản mẫu khác lời đọc: \" + JSON.stringify(doc));\nlet thuan = true;\ntry {\
      \ JSON.parse(fs.readFileSync(\"khoi.txt\", \"utf8\")); } catch (e) { thuan =\
      \ false; }\nif (thuan) throw new Error(\"ngờ: khối có chú thích mà JSON.parse\
      \ lại nhận\");\n"
blocks:
  DEN L03 sym 0 0:
    sha: 1baddc745b187798
    kind: other
    lang: js-object
    reason: Văn bản mẫu của cơ sở dữ liệu văn bản, viết như đối tượng JavaScript có
      chú thích // (kiểu vỏ lệnh của kho văn bản); JSON thuần không cho chú thích
      nên không khai lang json.
    read_check: 'Đã đọc kiểm: JSON (RFC 8259) không có cú pháp chú thích, nên khối
      không phải JSON thuần; khối là đối tượng JavaScript hợp lệ — nguồn src:DEN:L03_van_ban
      (node) eval đúng văn bản đã ghim và kiểm cấu trúc: khach nhúng {ma, ten}, dong
      là mảng 2 dòng nhúng, ma_kho chỉ là một số (tham chiếu). Bài gọi khối là “văn
      bản mẫu”, không gọi là JSON.'
    claims:
    - 'lời đọc: văn bản mẫu có mã đơn, nhúng bản sao tên khách, nhúng các dòng hàng,
      tham chiếu kho bằng cách chỉ giữ mã kho'
    unverified_claims:
    - 'bảng: tiêu chí chọn nhúng/tham chiếu (luôn đọc cùng nhau, số lượng có giới
      hạn / dùng chung, sửa thường xuyên, tăng không giới hạn) là quy tắc thiết kế,
      máy không kiểm được'
  DEN L05 sym 1 0:
    sha: fd5a16d70c5a6e04
    kind: pseudo
    reason: 'Mô tả bảng bằng tiếng Việt (bảng …, khoá chính: …, truy vấn: …); dòng
      khoá chính dùng ký hiệu ((khoá phân vùng), khoá sắp xếp) như PRIMARY KEY của
      CQL nhưng khối không phải câu lệnh CQL.'
    unverified_claims:
    - 'bảng: khoá phân vùng (cam_bien, ngay) được băm để chọn máy giữ dữ liệu; khoá
      sắp xếp thoi_gian là thứ tự trên đĩa trong phân vùng — hành vi của kho cột rộng
      (Cassandra), không có Cassandra trên máy, chưa đối chiếu tài liệu chính thức
      trong phiên này'
