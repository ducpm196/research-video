course: CLD
sources:
  L02_bo_dem:
    lang: python
    reason: 'Đọc nguyên văn hai tệp dựng trên màn hình (bỏ số dòng), áp quy tắc bộ
      nhớ đệm của Docker Docs: COPY chạy lại khi một tệp nó chép đổi; một bước chạy
      lại thì mọi bước sau chạy lại. Độ trung thực mô phỏng = INFERRED.'
    files:
      chua_tot.txt: CLD L02 example 0 0
      tot.txt: CLD L02 example 0 1
    code: "import re\nTEP = {\"main.py\", \"requirements.txt\"}          # mã nguồn\
      \ của ví dụ\ndef doc(ten_tep):\n    buoc = []\n    for i, dong in enumerate(open(ten_tep,\
      \ encoding=\"utf-8\").read().strip(\"\\n\").split(\"\\n\"), 1):\n        m =\
      \ re.match(r\"^(\\d+) (FROM|COPY|RUN|CMD)\\b(.*)$\", dong)\n        assert m\
      \ and int(m.group(1)) == i, \"dòng không đọc được: \" + dong\n        buoc.append((m.group(2),\
      \ m.group(3).split()))\n    return buoc\ndef chay_lai(buoc, sua):\n    ra, doi\
      \ = [], False\n    for i, (lenh, ts) in enumerate(buoc, 1):\n        if lenh\
      \ == \"COPY\":\n            nguon = TEP if ts[0] == \".\" else {ts[0]}\n   \
      \         doi = doi or bool(nguon & sua)\n        if doi:\n            ra.append(i)\n\
      \    return ra\nxau, tot = doc(\"chua_tot.txt\"), doc(\"tot.txt\")\n"
    post: 'assert chay_lai(xau, {"main.py"}) == [2, 3, 4]

      assert chay_lai(tot, {"main.py"}) == [4, 5]

      assert chay_lai(tot, {"requirements.txt"}) == [2, 3, 4, 5]

      assert chay_lai(tot, set()) == []

      assert 2 + 300 == 302 and 10 * 302 == 3020 and round(3020 / 60) == 50 and 10
      * 2 == 20

      '
blocks:
  CLD L02 example 0 0:
    sha: 5fc994892fa1a320
    kind: other
    lang: dockerfile
    reason: 'Tệp dựng ảnh (Dockerfile) rút gọn có đánh số dòng và dấu … ở chỗ bỏ bớt;
      máy không có trình dựng (Docker cài nhưng dịch vụ không chạy: “open //./pipe/dockerDesktopLinuxEngine:
      The system cannot find the file specified”, 2026-11-10).'
    read_check: 'Đã đọc kiểm theo Docker Docs “Build cache invalidation” (docs.docker.com/build/cache/invalidation/,
      truy cập 2026-11-10, no revision given): “Once the cache is invalidated, all
      subsequent Dockerfile commands generate new images and the cache isn''t used”;
      với COPY/ADD “the builder calculates a cache checksum from file metadata”; với
      RUN “just the command string itself is used”. Bỏ số dòng và phần … thì FROM/COPY/RUN/CMD
      đúng cú pháp lệnh Dockerfile. Quy tắc trên được mô phỏng trên đúng văn bản khối
      bởi nguồn src:CLD:L02_bo_dem.'
    claims:
    - 'bước 2: thứ tự chưa tốt, sửa main.py → bước 1 dùng lại; chạy lại bước 2, 3,
      4'
    - 'bước 4: 2 + 300 = 302 s một lần sửa; 10 lần 3020 s ≈ 50 phút'
    unverified_claims:
    - Chưa chạy `docker build` thật (dịch vụ Docker không chạy); kết luận chạy lại/dùng
      lại chỉ kiểm bằng mô phỏng quy tắc tài liệu trong src:CLD:L02_bo_dem (độ trung
      thực = INFERRED); ảnh python:3.12.4 có trên Docker Hub chưa kiểm
  CLD L02 example 0 1:
    sha: 1613edd58f0c79dd
    kind: other
    lang: dockerfile
    reason: Tệp dựng ảnh rút gọn (thứ tự tốt), đánh số dòng, có …; như khối CLD L02
      example 0 0.
    read_check: Như khối CLD L02 example 0 0 (Docker Docs “Build cache invalidation”,
      truy cập 2026-11-10, no revision given); `COPY requirements.txt .` chép một
      tệp vào thư mục làm việc — đúng cú pháp. Mô phỏng trong src:CLD:L02_bo_dem.
    claims:
    - 'bước 3: thứ tự tốt, sửa main.py → bước 1–3 dùng lại; chạy lại bước 4, 5; 2
      s một lần, 20 s cho 10 lần'
    - 'quiz câu 1: sửa requirements.txt → chạy lại bước 2, 3, 4, 5'
    - 'quiz câu 2: không sửa gì → không bước nào chạy lại'
    unverified_claims:
    - Chưa chạy `docker build` thật; chỉ kiểm bằng mô phỏng quy tắc tài liệu (src:CLD:L02_bo_dem,
      độ trung thực = INFERRED)
