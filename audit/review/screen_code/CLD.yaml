sources:
  L02_bo_dem:
    lang: python
    reason: "Đọc nguyên văn hai tệp dựng trên màn hình (bỏ số dòng), áp quy tắc bộ nhớ đệm của Docker Docs: COPY chạy lại khi một tệp nó chép đổi; một bước chạy lại thì mọi bước sau chạy lại. Độ trung thực mô phỏng = INFERRED."
    files: {chua_tot.txt: "CLD L02 example 0 0", tot.txt: "CLD L02 example 0 1"}
    code: |
      import re
      TEP = {"main.py", "requirements.txt"}          # mã nguồn của ví dụ
      def doc(ten_tep):
          buoc = []
          for i, dong in enumerate(open(ten_tep, encoding="utf-8").read().strip("\n").split("\n"), 1):
              m = re.match(r"^(\d+) (FROM|COPY|RUN|CMD)\b(.*)$", dong)
              assert m and int(m.group(1)) == i, "dòng không đọc được: " + dong
              buoc.append((m.group(2), m.group(3).split()))
          return buoc
      def chay_lai(buoc, sua):
          ra, doi = [], False
          for i, (lenh, ts) in enumerate(buoc, 1):
              if lenh == "COPY":
                  nguon = TEP if ts[0] == "." else {ts[0]}
                  doi = doi or bool(nguon & sua)
              if doi:
                  ra.append(i)
          return ra
      xau, tot = doc("chua_tot.txt"), doc("tot.txt")
    post: |
      assert chay_lai(xau, {"main.py"}) == [2, 3, 4]
      assert chay_lai(tot, {"main.py"}) == [4, 5]
      assert chay_lai(tot, {"requirements.txt"}) == [2, 3, 4, 5]
      assert chay_lai(tot, set()) == []
      assert 2 + 300 == 302 and 10 * 302 == 3020 and round(3020 / 60) == 50 and 10 * 2 == 20
