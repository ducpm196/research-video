  CLD L02 example 0 0:
    sha: 5fc994892fa1a320
    kind: other
    lang: dockerfile
    reason: 'Tệp dựng ảnh (Dockerfile) rút gọn có đánh số dòng và dấu … ở chỗ bỏ bớt; máy không có trình dựng (Docker cài nhưng dịch vụ không chạy: “open //./pipe/dockerDesktopLinuxEngine: The system cannot find the file specified”, 2026-11-10).'
    read_check: 'Đã đọc kiểm theo Docker Docs “Build cache invalidation” (docs.docker.com/build/cache/invalidation/, truy cập 2026-11-10, no revision given): “Once the cache is invalidated, all subsequent Dockerfile commands generate new images and the cache isn''t used”; với COPY/ADD “the builder calculates a cache checksum from file metadata”; với RUN “just the command string itself is used”. Bỏ số dòng và phần … thì FROM/COPY/RUN/CMD đúng cú pháp lệnh Dockerfile. Quy tắc trên được mô phỏng trên đúng văn bản khối bởi nguồn src:CLD:L02_bo_dem.'
    claims:
    - 'bước 2: thứ tự chưa tốt, sửa main.py → bước 1 dùng lại; chạy lại bước 2, 3, 4'
    - 'bước 4: 2 + 300 = 302 s một lần sửa; 10 lần 3020 s ≈ 50 phút'
    unverified_claims:
    - Chưa chạy `docker build` thật (dịch vụ Docker không chạy); kết luận chạy lại/dùng lại chỉ kiểm bằng mô phỏng quy tắc tài liệu trong src:CLD:L02_bo_dem (độ trung thực = INFERRED); ảnh python:3.12.4 có trên Docker Hub chưa kiểm
  CLD L02 example 0 1:
