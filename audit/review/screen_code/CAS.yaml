# Sổ mã trên màn hình khoá CAS (audit/review/screen_code.py). Mỗi mục ghim sha của khối; xem docstring của screen_code.py.
# Nhóm 1, SC1, 2026-11-10.
blocks:
  "CAS L03 design 0 0":
    sha: 1787ec543f6f10df
    kind: run
    lang: python
    claims:
      - "bước 1: tu_pao_luc_giay(10).niuton_giay() = 10 nhân 4,448222 = 44,48222 newton giây"
      - "bước 2: tu_niuton_giay(10).niuton_giay() = 10 newton giây, giữ nguyên"
      - "bước 3: 44,48222 + 10 = 54,48222 newton giây"
      - "giá trị bên trong luôn tính bằng newton giây; chỉ có hai cửa tạo xung lực"
    post: |
      assert round(tu_pao_luc_giay(10).niuton_giay(), 5) == 44.48222
      assert tu_niuton_giay(10).niuton_giay() == 10
      assert round(tu_pao_luc_giay(10).niuton_giay() + tu_niuton_giay(10).niuton_giay(), 5) == 54.48222
      assert isinstance(tu_pao_luc_giay(1), XungLuc) and isinstance(tu_niuton_giay(1), XungLuc)
    unverified_claims:
      - "\"Tệp trao đổi cũng ghi thêm một trường đơn vị, và bên đọc từ chối tệp thiếu trường đó\" — khối không có mã đọc/ghi tệp, máy không kiểm được"
      - "hệ số 4,448222 N·s cho 1 lbf·s: đúng tới 6 chữ số thập phân theo NIST SP 811 (2008, phụ lục B: 1 lbf = 4,448 222 N) — dẫn theo hiểu biết, chưa mở lại nguồn trong đợt này; không phải kết quả chạy"
  "CAS L05 check 0 0":
    sha: 02b0cd8c11afb47b
    kind: run
    lang: python
    claims:
      - "8 máy đều chạy bản mới → đồng nhất: cho phép bật cờ"
      - "7 máy bản mới, máy 8 bản cũ → không đồng nhất: chặn bật cờ, chỉ ra máy 8"
    post: |
      ok, dau = kiem_dong_nhat({f"may{i}": "ban_moi" for i in range(1, 9)})
      assert ok is True and len(dau) == 8
      ok, dau = kiem_dong_nhat({**{f"may{i}": "ban_moi" for i in range(1, 8)}, "may8": "ban_cu"})
      assert ok is False
      from collections import Counter
      _pho_bien = Counter(dau.values()).most_common(1)[0][0]
      assert [t for t, d in dau.items() if d != _pho_bien] == ["may8"]
      assert all(len(d) == 12 for d in dau.values())
    note: "\"chỉ ra máy 8\": hàm trả cả từ điển dấu vân tay; post tìm máy có dấu khác số đông và được đúng may8. Mã nguồn của mỗi máy là chuỗi minh hoạ 'ban_moi'/'ban_cu'."
