sources:
  L12_luat:
    lang: python
    reason: "Đọc nguyên văn hai bộ luật trên màn hình, khớp luật đầu tiên từ trên xuống, không khớp luật nào → dòng (còn lại). Mọi dòng khác rỗng phải đọc được (không bỏ sót dòng)."
    files: {vi_du.txt: "SEC L12 example 0 0", quiz.txt: "SEC L12 quiz 2 0"}
    code: |
      import re
      def doc(ten_tep):
          luat, mac_dinh = [], None
          for dong in open(ten_tep, encoding="utf-8").read().split("\n"):
              if not dong.strip():
                  continue
              m = re.match(r"^\s*\d+\.\s*(.+?)\s*→\s*(.+?),\s*cổng\s*(\d+)\s*:\s*(\S+)\s*$", dong)
              if m:
                  luat.append((m.group(1), m.group(2), int(m.group(3)), m.group(4)))
                  continue
              m = re.match(r"^\s*\(còn lại\)\s*:\s*(\S+)\s*$", dong)
              assert m, "dòng không đọc được: " + dong
              mac_dinh = m.group(1)
          return luat, mac_dinh
      def xet(bo, nguon, dich, cong):
          luat, mac_dinh = bo
          for s, d, p, kq in luat:
              if s in ("*", nguon) and d == dich and p == cong:
                  return kq
          return mac_dinh
      vd, qz = doc("vi_du.txt"), doc("quiz.txt")
    post: |
      assert [xet(vd, *r) for r in [("ứng dụng", "csdl", 5432), ("Internet", "csdl", 5432),
              ("Internet", "web", 443), ("Internet", "web", 22), ("máy in", "csdl", 5432)]] == ["cho", "chặn", "cho", "chặn", "chặn"]
      assert xet(vd, "văn phòng", "web", 443) == "cho" and xet(vd, "ứng dụng", "csdl", 22) == "chặn"
      assert xet(qz, "trung chuyển", "csdl", 22) == "cho" and xet(qz, "văn phòng", "csdl", 22) == "chặn"
      assert len(vd[0]) == 2 and len(qz[0]) == 3 and vd[1] == qz[1] == "chặn"
