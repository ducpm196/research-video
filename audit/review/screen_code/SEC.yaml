blocks:
  "SEC L06 example 2 0":
    sha: a35e34ecc6c54638
    kind: run
    lang: python
    prelude: |
      import sqlite3
      _goc = sqlite3.connect(":memory:")
      _goc.executescript("CREATE TABLE users(name TEXT); INSERT INTO users VALUES ('alice'), ('bob');")
      class _GhiKetQua:          # chỉ ghi lại số dòng mỗi lần execute trả về, không đổi câu lệnh
          def __init__(self, c): self.c, self.kq = c, []
          def execute(self, *a):
              cur = self.c.execute(*a)
              self.kq.append(cur.fetchall())
              return cur
      con = _GhiKetQua(_goc)
      ten = "x' OR '1'='1"
    prelude_reason: "bước 1: chạy thật trên cơ sở dữ liệu “bảng có 2 người”, tên hợp lệ alice; bước 2: “chuỗi có dấu nháy và một điều kiện luôn đúng” (checks của cảnh dùng đúng x' OR '1'='1 và bảng alice, bob). Khối dùng con và ten mà bài cho bằng lời. Ca alice chạy lại đúng văn bản khối qua files/exec."
    files: {khoi.txt: "SEC L06 example 2 0"}
    claims:
      - "bảng bước 2: chuỗi có dấu nháy + điều kiện luôn đúng → tham số hoá trả 0 dòng (không ai tên như vậy)"
      - "bảng bước 1: alice → tham số hoá trả 1 dòng"
      - "lời đọc bước 3: dữ liệu gửi riêng ở đối số thứ hai, không dán vào câu lệnh"
    post: |
      assert con.kq[-1] == []
      ten = "alice"
      exec(open("khoi.txt", encoding="utf-8").read())
      assert con.kq[-1] == [("alice",)]
      # đối chứng: cùng chuỗi mà GHÉP vào câu lệnh thì lấy ra mọi người (bảng bước 2: 2 dòng)
      assert len(_goc.execute("SELECT name FROM users WHERE name = '" + "x' OR '1'='1" + "'").fetchall()) == 2
    note: "Đối chứng ghép chuỗi trong post chỉ để khẳng định số 2 dòng của bảng bước 2 (bảng ghi nhận, không hiện thành mã)."
