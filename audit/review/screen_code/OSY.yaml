sources:
  L01_fork_twin:
    lang: python
    twin_of: ["OSY L01 hook 0 0", "OSY L01 prereq 0 0", "OSY L01 fork 0 0", "OSY L01 quiz 0 0"]
    reason: "mô phỏng fork() bằng Python (Windows không có fork): mỗi tiến trình là một bản trạng thái {i, chỗ đang chạy, bộ đệm, x}; fork() đẩy một BẢN SAO chạy tiếp từ ngay sau lời gọi. Dịch sát các vòng for của khối hook/prereq (3 lượt), quiz (2 lượt, write ghi thẳng / printf có bộ đệm) và khối fork (x = 5); độ trung thực bản dịch = INFERRED"
    code: |
      def loop(n, write=False, printf=False):
          """for (int i = 0; i < n; i++) { fork(); [write(1, "x", 1); | printf("x");] }"""
          procs, printed, root_turns = 1, 0, 0
          stack = [{"i": 0, "pc": "cond", "buf": 0, "root": True}]
          while stack:
              p = stack.pop()
              while True:
                  if p["pc"] == "cond":                    # i < n ?
                      if p["i"] < n:
                          p["pc"] = "fork"
                          root_turns += p["root"]
                      else:
                          printed += p["buf"]              # kết thúc: bộ đệm printf được xả
                          break
                  elif p["pc"] == "fork":                  # fork(): con là bản sao, chạy tiếp từ sau lời gọi
                      p["pc"] = "after"
                      stack.append(dict(p, root=False))
                      procs += 1
                  else:                                    # thân sau fork, rồi i++
                      printed += write
                      p["buf"] += printf
                      p["i"] += 1
                      p["pc"] = "cond"
          return procs, printed, root_turns
      assert loop(3)[0] == 8 and loop(3)[2] == 3          # hook/prereq: 8 tiến trình; tiến trình gốc chạy 3 lượt
      assert loop(2, write=True)[:2] == (4, 6)            # quiz: 4 tiến trình, 6 chữ x
      assert loop(2, printf=True)[:2] == (4, 8)           # printf có bộ đệm: tới 8 chữ
      def fork_x():
          """int x = 5; if (fork() == 0) { x = x + 1; }"""
          parent = {"x": 5}
          child = dict(parent)                             # bản sao bộ nhớ
          ret = {"cha": 1234, "con": 0}                    # cha nhận số hiệu con, con nhận 0
          for who, mem in (("cha", parent), ("con", child)):
              if ret[who] == 0:
                  mem["x"] = mem["x"] + 1
          return parent["x"], child["x"]
      assert fork_x() == (5, 6)
      print(loop(3)[0], loop(2, write=True)[:2], loop(2, printf=True)[1], fork_x())
    expect_stdout: "8 (4, 6) 8 (5, 6)"
  L05_prodcons:
    lang: python
    twin_of: ["OSY L05 example 0 0", "OSY L05 example 0 1"]
    reason: "đọc NGUYÊN VĂN hai khối OSY L05 example (sản xuất, tiêu thụ), dịch mỗi dòng thành một thao tác nguyên tử (wait chặn khi semaphore = 0; lấy(khoá) chặn khi khoá = 0; đặt/lấy món đổi số món), rồi (1) chạy lại vết tay của bài, (2) duyệt MỌI cách xen kẽ với 7 vòng mỗi bên; độ trung thực bản dịch = INFERRED"
    files: {sx.txt: "OSY L05 example 0 0", tt.txt: "OSY L05 example 0 1"}
    code: |
      import re
      def parse(fn):
          ops = []
          for ln in open(fn, encoding="utf-8").read().strip().split("\n"):
              ln = ln.strip()
              m = re.fullmatch(r"(wait|signal)\((trống|đầy)\)", ln)
              if m: ops.append((m.group(1), m.group(2))); continue
              if ln == "lấy(khoá)": ops.append(("lock", None)); continue
              if ln == "trả(khoá)": ops.append(("unlock", None)); continue
              if ln == "đặt món": ops.append(("put", None)); continue
              if ln == "lấy món": ops.append(("take", None)); continue
              raise SystemExit("dòng lạ: " + ln)
          return ops
      P, C = parse("sx.txt"), parse("tt.txt")
      assert [o for o, _ in P] == ["wait", "lock", "put", "unlock", "signal"] and P[0][1] == "trống" and P[4][1] == "đầy"
      assert [o for o, _ in C] == ["wait", "lock", "take", "unlock", "signal"] and C[0][1] == "đầy" and C[4][1] == "trống"
      def step(st, who):
          """st = (pc_sx, pc_tt, trống, đầy, khoá, món, vòng_sx, vòng_tt); trả trạng thái mới, hoặc None nếu bị chặn."""
          pcs, s = [st[0], st[1]], {"trống": st[2], "đầy": st[3]}
          k, items, rounds = st[4], st[5], [st[6], st[7]]
          op, arg = (P, C)[who][pcs[who]]
          if op == "wait":
              if s[arg] == 0: return None
              s[arg] -= 1
          elif op == "signal": s[arg] += 1
          elif op == "lock":
              if k == 0: return None
              k = 0
          elif op == "unlock": k = 1
          elif op == "put": items += 1
          elif op == "take": items -= 1
          pcs[who] += 1
          if pcs[who] == 5: pcs[who] = 0; rounds[who] += 1
          return (pcs[0], pcs[1], s["trống"], s["đầy"], k, items, rounds[0], rounds[1])
      start = (0, 0, 5, 0, 1, 0, 0, 0)
      # (1) vết tay của bài
      st = start
      st = step(st, 0); assert st[2:5] == (4, 0, 1)                     # wait(trống): 5 − 1
      st = step(step(step(st, 0), 0), 0); assert st[4] == 1 and st[5] == 1
      st = step(st, 0); assert st[2:4] == (4, 1)                        # signal(đầy): 0 + 1
      for _ in range(4):
          for _ in range(5): st = step(st, 0)
      assert st[2:4] == (0, 5)                                          # sau 5 món
      assert step(st, 0) is None and st[0] == 0 and st[4] == 1          # món 6: đứng đợi ở wait(trống), chưa giữ khoá
      for _ in range(5): st = step(st, 1)
      assert st[2:4] == (1, 4)                                          # phục vụ lấy 1 món
      for _ in range(5): st = step(st, 0)
      assert st[2:4] == (0, 5)                                          # bếp đặt món 6
      # (2) mọi cách xen kẽ, 7 vòng mỗi bên
      R = 7
      seen, todo, deadlock, both, lo, hi = {start}, [start], False, False, 99, -99
      while todo:
          st = todo.pop()
          lo, hi = min(lo, st[5]), max(hi, st[5])
          both |= st[0] in (2, 3) and st[1] in (2, 3)          # cả hai cùng ở giữa lấy(khoá) và trả(khoá): đặt/lấy món
          nxt = [n for w in (0, 1) if st[6 + w] < R for n in [step(st, w)] if n is not None]
          if not nxt and (st[6] < R or st[7] < R): deadlock = True
          for n in nxt:
              if n not in seen: seen.add(n); todo.append(n)
      assert not deadlock and (lo, hi) == (0, 5) and not both
      print(len(seen) > 0, deadlock, lo, hi, both)
    expect_stdout: "True False 0 5 False"
  L07_banker:
    lang: python
    twin_of: "OSY L07 safe 0 0"
    reason: "dịch sát 4 dòng mã giả kiểm an toàn (tìm Pi chưa xong có cần thêm ≤ làm việc, chọn chỉ số nhỏ nhất; làm việc += đang giữ) trên bảng của cảnh example cùng bài; độ trung thực bản dịch = INFERRED"
    code: |
      giu = [[0, 1, 0], [2, 0, 0], [3, 0, 2], [2, 1, 1], [0, 0, 2]]       # bảng cảnh example: đang giữ
      toida = [[7, 5, 3], [3, 2, 2], [9, 0, 2], [2, 2, 2], [4, 3, 3]]     # tối đa
      con_ranh = [3, 3, 2]
      can = [[t - g for t, g in zip(toida[i], giu[i])] for i in range(5)]
      assert can == [[7, 4, 3], [1, 2, 2], [6, 0, 0], [0, 1, 1], [4, 3, 1]]
      lam_viec = list(con_ranh)                                          # làm việc = còn rảnh
      xong, thu_tu, vet = [False] * 5, [], []
      while True:                                                        # lặp: tìm Pi chưa xong mà cần thêm(Pi) ≤ làm việc
          i = next((i for i in range(5) if not xong[i] and all(c <= w for c, w in zip(can[i], lam_viec))), None)
          if i is None:
              break
          lam_viec = [w + g for w, g in zip(lam_viec, giu[i])]           # làm việc = làm việc + đang giữ(Pi)
          xong[i] = True; thu_tu.append(i); vet.append(tuple(lam_viec))  # đánh dấu Pi xong
      an_toan = all(xong)                                                # hết Pi: tất cả xong → an toàn
      assert an_toan and thu_tu == [1, 3, 0, 2, 4]
      assert vet == [(5, 3, 2), (7, 4, 3), (7, 5, 3), (10, 5, 5), (10, 5, 7)]
      print(thu_tu)
    expect_stdout: "[1, 3, 0, 2, 4]"
  L11_ws:
    lang: python
    reason: "đọc NGUYÊN VĂN hai khối chuỗi tham chiếu của OSY L11 và đếm lại"
    files: {a.txt: "OSY L11 example 0 0", b.txt: "OSY L11 example 2 0"}
    code: |
      from collections import Counter
      a, b = (open(f, encoding="utf-8").read().strip() for f in ("a.txt", "b.txt"))
      assert a == b
      phases = [[int(x) for x in p.split()] for p in a.split("|")]
      refs = sum(phases, [])
      assert [len(p) for p in phases] == [10, 6, 10] and len(refs) == 26
      first, last = refs[:10], refs[-10:]
      assert first == [1, 2, 1, 5, 7, 7, 7, 7, 5, 1] and last == [3, 4, 4, 4, 3, 4, 3, 4, 4, 4]
      c1, c2 = Counter(first), Counter(last)
      assert [c1[p] for p in (1, 2, 5, 7)] == [3, 1, 2, 4] and sorted(c1) == [1, 2, 5, 7] and len(c1) == 4
      assert [c2[p] for p in (3, 4)] == [3, 7] and sorted(c2) == [3, 4] and len(c2) == 2
      print(len(c1), len(c2))
    expect_stdout: "4 2"
  L14_perm:
    lang: python
    reason: "đọc NGUYÊN VĂN khối quyền rwx của OSY L14 và tính lại số bát phân"
    files: {p.txt: "OSY L14 sym 0 0"}
    code: |
      import stat
      l1, l2 = open("p.txt", encoding="utf-8").read().strip("\n").split("\n")
      groups, labels = l1.split(), l2.split()
      assert labels == ["chủ", "nhóm", "khác"] and len(groups) == 3
      val = {"r": 4, "w": 2, "x": 1}
      digits = [sum(val[c] for c in g if c != "-") for g in groups]
      assert all(len(g) == 3 and all(c in (k, "-") for c, k in zip(g, "rwx")) for g in groups)
      assert digits == [7, 5, 0] and 4 + 2 + 1 == 7 and 4 + 1 == 5
      assert stat.filemode(0o100750) == "-" + "".join(groups)
      print(oct(digits[0] * 64 + digits[1] * 8 + digits[2]))
    expect_stdout: "0o750"
