sources:
  L05_certs:
    lang: python
    code: 'import shutil, subprocess

      subprocess.run([shutil.which(''bash''), ''-c'', ''cat ca.sh may.sh xau.sh | bash''], capture_output=True)

      '
    files:
      ca.sh: BNX L05 example 0 0
      may.sh: BNX L05 example 1 0
      xau.sh: BNX L05 example 2 0
    post: 'import os

      assert all(os.path.getsize(f) > 0 for f in [''ca1.crt'', ''ca2.crt'', ''may_chu.crt'', ''may_chu.key'', ''thanh_toan.crt'', ''la_mat.crt'',
      ''het_han.crt'', ''het_han.key''])

      '
    reason: 'Không hiện trên màn hình: chạy lại NGUYÊN VĂN ba khối bash bước A, B, C (đã ghim sha, ghi vào thư mục chạy qua files) trong một phiên
      bash để sinh chứng chỉ cho khối Python example 6 0 — bài nói rõ chứng chỉ do ba khối đó sinh ra.'
  L06_mss_base:
    lang: mssql
    code: "IF DB_ID('bnx_l06') IS NULL CREATE DATABASE bnx_l06;\nGO\nUSE bnx_l06;\nGO\n\nDROP TABLE IF EXISTS dbo.tk;\nCREATE TABLE dbo.tk (\n\
      \  id    INT PRIMARY KEY,\n  ten   VARCHAR(10),\n  so_du BIGINT CONSTRAINT ck_so_du CHECK (so_du >= 0));\nINSERT INTO dbo.tk VALUES (1,\
      \ 'A', 300000), (2, 'B', 1000000);\nGO\n"
    reason: 'Tạo database bnx_l06 và bảng dbo.tk hai tài khoản A = 300 000, B = 1 000 000 (bài nói ở cảnh check: ''chạy trên SQL Server'' với
      cùng hai tài khoản như Oracle); bảng không hiện thành mã trên màn hình, giống bảng Oracle ở khối example 0 0. Chép từ MSS_DB + MSS_SETUP
      của audit/bnx/src/l06.py.'
    post: SELECT SUM(so_du) AS tong FROM dbo.tk;
    claims:
    - hai tài khoản tổng 1 300 000
    expect_stdout: 'Changed database context to ''bnx_l06''.


      (2 rows affected)

      1300000


      (1 rows affected)

      '
  L06_mss_proc:
    lang: mssql
    code: "CREATE OR ALTER PROCEDURE dbo.chuyen_tien\n  @from   INT,\n  @to     INT,\n  @amt    BIGINT,\n  @status VARCHAR(20) OUTPUT\nAS\nBEGIN\n\
      \  SET NOCOUNT ON;\n  SET XACT_ABORT ON;\n  DECLARE @x BIGINT, @bal BIGINT;\n  BEGIN TRY\n    IF @amt IS NULL OR @amt <= 0\n      THROW\
      \ 50002, 'So tien phai lon hon 0', 1;\n    BEGIN TRAN;\n    SELECT @x = so_du FROM dbo.tk WITH (UPDLOCK, ROWLOCK)\n     WHERE id = LEAST(@from,\
      \ @to);\n    SELECT @x = so_du FROM dbo.tk WITH (UPDLOCK, ROWLOCK)\n     WHERE id = GREATEST(@from, @to);\n    SELECT @bal = so_du FROM\
      \ dbo.tk WHERE id = @from;\n    IF @bal < @amt\n      THROW 50001, 'So du khong du', 1;\n    UPDATE dbo.tk SET so_du = so_du - @amt WHERE\
      \ id = @from;\n    UPDATE dbo.tk SET so_du = so_du + @amt WHERE id = @to;\n    COMMIT;\n    SET @status = 'OK';\n  END TRY\n  BEGIN CATCH\n\
      \    IF @@TRANCOUNT > 0 ROLLBACK;\n    THROW;\n  END CATCH\nEND;\nGO\n"
    prelude_keys:
    - src:BNX:L06_mss_base
    reason: Thủ tục T-SQL đầy đủ; màn hình hiện ba đoạn ở cảnh check bước 0–2 (fragment within nguồn này). ver/l06.py kiểm trùng hằng MSS_PROC.
    post: SELECT CASE WHEN OBJECT_ID('dbo.chuyen_tien', 'P') IS NOT NULL THEN 'co thu tuc' ELSE 'khong co' END;
    claims:
    - CREATE OR ALTER PROCEDURE chạy được trên SQL Server 2022 CU27 (LEAST/GREATEST có từ bản 2022)
    expect_stdout: 'Changed database context to ''bnx_l06''.


      (2 rows affected)

      co thu tuc


      (1 rows affected)

      '
  L06_ora_proc:
    lang: oracle
    code: "CREATE OR REPLACE PROCEDURE bnx_l06_chuyen_tien (\n  p_from   IN  NUMBER,\n  p_to     IN  NUMBER,\n  p_amt    IN  NUMBER,\n  p_status\
      \ OUT VARCHAR2) AS\n  v_x   NUMBER;\n  v_bal NUMBER;\nBEGIN\n  IF p_amt IS NULL OR p_amt <= 0 THEN\n    RAISE_APPLICATION_ERROR(-20002,\
      \ 'So tien phai lon hon 0');\n  END IF;\n  SELECT so_du INTO v_x FROM bnx_l06_tk\n   WHERE id = LEAST(p_from, p_to) FOR UPDATE;\n  SELECT\
      \ so_du INTO v_x FROM bnx_l06_tk\n   WHERE id = GREATEST(p_from, p_to) FOR UPDATE;\n  SELECT so_du INTO v_bal FROM bnx_l06_tk WHERE id =\
      \ p_from;\n  IF v_bal < p_amt THEN\n    RAISE_APPLICATION_ERROR(-20001, 'So du khong du');\n  END IF;\n  UPDATE bnx_l06_tk SET so_du = so_du\
      \ - p_amt WHERE id = p_from;\n  UPDATE bnx_l06_tk SET so_du = so_du + p_amt WHERE id = p_to;\n  COMMIT;\n  p_status := 'OK';\nEXCEPTION\n\
      \  WHEN OTHERS THEN\n    ROLLBACK;\n    RAISE;\nEND;\n/\n"
    prelude_keys:
    - BNX L06 example 0 0
    reason: Thủ tục PL/SQL đầy đủ; màn hình hiện từng đoạn ở cảnh formula bước 1–5 (khối formula 0 0 … 4 0 là fragment within nguồn này). audit/bnx/ver/l06.py
      kiểm văn bản nguồn này trùng từng ký tự với hằng ORA_PROC của audit/bnx/src/l06.py.
    post: SELECT object_name, status FROM user_objects WHERE object_name = 'BNX_L06_CHUYEN_TIEN';
    claims:
    - thủ tục biên dịch được (trạng thái VALID) trên Oracle AI Database 26ai Free 23.26.3
    expect_stdout: "OBJECT_NAME\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t STATUS\n--------------------------------------------------------------------------------------------------------------------------------\
      \ -------\nBNX_L06_CHUYEN_TIEN\t\t\t\t\t\t\t\t\t\t\t\t\t\t VALID\n"
  L07_aq_clean:
    lang: oracle
    code: "BEGIN\n  DBMS_AQADM.STOP_QUEUE('bnx_l07_q');\n  DBMS_AQADM.DROP_QUEUE('bnx_l07_q');\n  DBMS_AQADM.DROP_QUEUE_TABLE('bnx_l07_qt');\n\
      EXCEPTION WHEN OTHERS THEN NULL;\nEND;\n/\nDROP TYPE IF EXISTS bnx_l07_msg FORCE;\n"
    reason: Dọn hàng đợi, bảng hàng đợi và kiểu thông điệp của lần chạy trước để khối formula 6 0 chạy lại được (không hiện trên màn hình; bài
      không nói gì về bước dọn). Chép từ hằng AQ_CLEAN của audit/bnx/src/l07.py.
    no_claim_reason: chỉ dọn dẹp; bài không nói kết quả nào của bước này
  L13_df_bad:
    lang: bash
    reason: 'Kiểm thật Dockerfile sai (khối BNX L13 pitfalls 0 0): chỉ báo mật khẩu trong ENV, không báo thẻ latest.'
    files:
      Dockerfile: BNX L13 pitfalls 0 0
    code: 'docker build --check . 2>&1 | grep -A3 ''Check complete''

      docker build --check . 2>&1 | grep ''>>>''

      '
    expect_stdout: "Check complete, 1 warning has been found!\n\nWARNING: SecretsUsedInArgOrEnv - https://docs.docker.com/go/dockerfile/rule/secrets-used-in-arg-or-env/\n\
      Do not use ARG or ENV instructions for sensitive data (ENV \"DB_PASSWORD\")\n   2 | >>> ENV DB_PASSWORD=MatKhau123\n"
    timeout: 240
  L13_df_good:
    lang: bash
    reason: Kiểm thật Dockerfile của bài (khối BNX L13 formula 0 0) bằng bộ kiểm tích hợp của BuildKit.
    files:
      Dockerfile: BNX L13 formula 0 0
    code: 'docker build --check . 2>&1 | tail -1

      '
    expect_stdout: 'Check complete, no warnings found.

      '
    timeout: 240
