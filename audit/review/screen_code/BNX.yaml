    lang: java
    java_class: BoCa
    timeout: 180
    reason: 'BoCa: chạy nguyên văn.'
    claims:
    - k mốc, bộ ca giữa khoảng k + 1 ca bỏ lọt k lỗi nhầm dấu; bộ ca sát mốc 2k + 1 ca bỏ lọt 0 (k = 2, 200, 2000), mô phỏng đột biến bằng Java
      thuần
    expect_stdout: '2 moc: giua khoang 3 ca, lot 2; sat moc 5 ca, lot 0

      200 moc: giua khoang 201 ca, lot 200; sat moc 401 ca, lot 0

      2000 moc: giua khoang 2001 ca, lot 2000; sat moc 4001 ca, lot 0'
    code: "import java.util.Arrays;\npublic class BoCa {\n  static int[] moc;\n  static int dem(long x) {               // số mốc ≤ x\n    int\
      \ i = Arrays.binarySearch(moc, (int) x);\n    return i >= 0 ? i + 1 : -i - 1;\n  }\n  static int tinh(long x, int loi) {     // loi: chỉ\
      \ số mốc bị nhầm < thành <=\n    return dem(x) - (loi >= 0 && x == moc[loi] ? 1 : 0);\n  }\n  static int lot(long[] ca, int k) {     //\
      \ số lỗi mà bộ ca không bắt được\n    int song = 0;\n    for (int loi = 0; loi < k; loi++) {\n      boolean bat = false;\n      for (long\
      \ x : ca) if (tinh(x, loi) != tinh(x, -1)) bat = true;\n      if (!bat) song++;\n    }\n    return song;\n  }\n  public static void main(String[]\
      \ a) {\n    for (int k : new int[] {2, 200, 2000}) {\n      moc = new int[k];\n      long[] giua = new long[k + 1], bien = new long[2 *\
      \ k + 1];\n      for (int i = 0; i < k; i++) {\n        moc[i] = (i + 1) * 10;\n        bien[2 * i] = moc[i];\n        bien[2 * i + 1] =\
      \ moc[i] - 1;\n      }\n      for (int i = 0; i <= k; i++) giua[i] = i * 10 + 5;\n      bien[2 * k] = 5;\n      String s = k + \" moc: giua\
      \ khoang \" + giua.length + \" ca, lot \"\n          + lot(giua, k);\n      System.out.println(s + \"; sat moc \" + bien.length\n      \
      \    + \" ca, lot \" + lot(bien, k));\n    }\n  }\n}"
