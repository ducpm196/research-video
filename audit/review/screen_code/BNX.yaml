sources:
  L05_certs:
    lang: python
    code: 'import shutil, subprocess

      subprocess.run([shutil.which(''bash''), ''-c'', ''cat ca.sh may.sh xau.sh | bash''], capture_output=True)

      '
    files:
      ca.sh: BNX L05 example 0 0
      may.sh: BNX L05 example 1 0
      xau.sh: BNX L05 example 2 0
    post: 'import os

      assert all(os.path.getsize(f) > 0 for f in [''ca1.crt'', ''ca2.crt'', ''may_chu.crt'', ''may_chu.key'', ''thanh_toan.crt'', ''la_mat.crt'',
      ''het_han.crt'', ''het_han.key''])

      '
    reason: 'Không hiện trên màn hình: chạy lại NGUYÊN VĂN ba khối bash bước A, B, C (đã ghim sha, ghi vào thư mục chạy qua files) trong một phiên
      bash để sinh chứng chỉ cho khối Python example 6 0 — bài nói rõ chứng chỉ do ba khối đó sinh ra.'
  L06_mss_base:
    lang: mssql
    code: "IF DB_ID('bnx_l06') IS NULL CREATE DATABASE bnx_l06;\nGO\nUSE bnx_l06;\nGO\n\nDROP TABLE IF EXISTS dbo.tk;\nCREATE TABLE dbo.tk (\n\
      \  id    INT PRIMARY KEY,\n  ten   VARCHAR(10),\n  so_du BIGINT CONSTRAINT ck_so_du CHECK (so_du >= 0));\nINSERT INTO dbo.tk VALUES (1,\
      \ 'A', 300000), (2, 'B', 1000000);\nGO\n"
