      \ \"faultcode\")\n        + \", \" + lay(r[1], \"faultstring\"));\n    String xxe = \"<?xml version=\\\"1.0\\\"?><!DOCTYPE x [<!ENTITY e\
      \ SYSTEM \"\n        + \"\\\"file:///etc/passwd\\\">]>\" + xml;\n    r = gui(cong, xxe).split(\"\\\\|\", 2);\n    System.out.println(\"\
      tra loi \" + r[0] + \" khi yeu cau co DOCTYPE: \"\n        + lay(r[1], \"faultstring\"));\n    var w = doc(Files.readString(Path.of(\"bank.wsdl\"\
