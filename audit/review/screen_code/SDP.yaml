  "SDP L12 example 0 0":
    sha: 136f8102667f7eca
    kind: run
    lang: python
    claims:
      - "bước 2: f(5) có ghi nhớ: thật sự tính 6, chỉ tra bảng 3, tổng 9"
      - "bước 3: f(30) có ghi nhớ: 59 lời gọi, 31 lần thật sự tính, 28 chỉ tra bảng"
      - "bước 4: 2 692 537 : 59 ≈ 45 636"
      - "quiz: f(20) có ghi nhớ: 39 lời gọi, 21 lần tính, 18 tra bảng; f(20) = 6765"
    post: |
      _tong = [0]
      _goc = f
      def f(n):
          _tong[0] += 1
          return _goc(n)
      def _do(n):
          _goc.cache_clear()
          _tong[0] = 0
          v = f(n)
          i = _goc.cache_info()
          return v, _tong[0], i.misses, i.hits
      assert _do(5)[1:] == (9, 6, 3)
      assert _do(30) == (832040, 59, 31, 28)
      assert _do(20) == (6765, 39, 21, 18)
      assert round(2692537 / 59) == 45636
    note: "Đã sửa 2026-11-10: thêm `import functools` lên màn hình (trước đó khối báo NameError: functools)."
  "SDP L13 example 0 0":
    sha: a85425090170ac8e
    kind: run
    lang: python
    claims:
      - "bước 2: đơn 300 000, 8 km: thuế 30 000, phí giao 15 000 + 3 · 4 000 = 27 000, tổng 357 000"
      - "bước 3: đơn 600 000, 12 km: thuế 60 000, phí giao 0, tổng 660 000"
      - "mở đầu: đơn 300 000 giao 2 km bản cũ thu 345 000; bản “dọn dẹp” 15000 + (km - 5) * 4000 thu 333 000"
      - "bước 4: bản “dọn dẹp” quên max(0, …) lệch 817 trên 10 000 cặp (tiền, km) ngẫu nhiên"
      - "quiz: 200 000, 3 km → 235 000; 450 000, 10 km → phí 35 000, tổng 530 000"
    post: |
      assert round(thue(300000)) == 30000 and phi_giao(300000, 8) == 27000 and tong(300000, 8) == 357000
      assert round(thue(600000)) == 60000 and phi_giao(600000, 12) == 0 and tong(600000, 12) == 660000
      assert tong(300000, 2) == 345000
      def _don_dep(t, k):
          return round(t + t * 0.1 + (0 if t >= 500000 else 15000 + (k - 5) * 4000))
      assert _don_dep(300000, 2) == 333000
      import random
      _r = random.Random(1)
      _lech = 0
      for _ in range(10000):
          t, k = _r.randrange(0, 1000001, 1000), _r.randrange(0, 31)
          _lech += tong(t, k) != _don_dep(t, k)
      assert _lech == 817
      assert tong(200000, 3) == 235000 and phi_giao(450000, 10) == 35000 and tong(450000, 10) == 530000
    note: "Bản “dọn dẹp” trong post dựng từ đúng công thức bài viết ở cảnh mở đầu; dãy ngẫu nhiên Random(1) như checks của cảnh."
    unverified_claims:
      - "bước 4: “bản đã tách trùng hết bản cũ trên 10 000 cặp” — hàm dài ban đầu (bản cũ) không hiện thành mã trên màn hình; điều này chỉ được kiểm bởi checks (alg.refactor_check, alg.fee_old trong tools/checklib.py), không bởi cổng. Số 817 ở trên được cổng kiểm so với bản đã tách trên màn hình."
