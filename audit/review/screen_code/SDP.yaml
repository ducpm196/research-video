    sha: 2c3d6988d6f957c9
    kind: run
    lang: python
    claims:
      - "bảng đường cơ sở: x = 3 → \"dương\"; x = −1 → \"không dương\""
      - "lời đọc: hàm dấu chỉ có một câu điều kiện, nên M bằng 1 cộng 1, bằng 2; cần ít nhất 2 ca kiểm"
    post: |
      import ast as _ast
      def _M(ten):
          cay = _ast.parse(open(__file__, encoding="utf-8").read())
          f = next(n for n in _ast.walk(cay) if isinstance(n, _ast.FunctionDef) and n.name == ten)
          d = 0
          for n in _ast.walk(f):
              if isinstance(n, (_ast.If, _ast.For, _ast.While, _ast.ExceptHandler, _ast.IfExp)):
                  d += 1
              elif isinstance(n, _ast.BoolOp):
                  d += len(n.values) - 1
          return d + 1
      assert dau(3) == "dương" and dau(-1) == "không dương"
      assert _M("dau") == 2
