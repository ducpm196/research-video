  "SDP L06 example 0 0":
    sha: 09d638858af0eaf1
    kind: run
    lang: python
    claims:
      - "bước 2 (ChuNhat): dat_rong(5) → rộng 5, cao 0; dat_cao(4) → 5, 4; diện tích 20"
      - "bước 3 (Vuong): dat_rong(5) → 5, 5; dat_cao(4) → 4, 4; diện tích 16"
      - "bước 4: ChuNhat giữ rộng 5 → 5; Vuong rộng 5 → 4 (phá hậu điều kiện)"
      - "quiz: dat_rong(7), dat_cao(3): ChuNhat 7, 0 → 7, 3, diện tích 21; Vuong 7, 7 → 3, 3, diện tích 9"
    post: |
      def _chay(L, a, b):
          r = L()
          r.dat_rong(a)
          s1 = (r.w, r.h)
          r.dat_cao(b)
          return s1, (r.w, r.h), r.w * r.h
      assert _chay(ChuNhat, 5, 4) == ((5, 0), (5, 4), 20)
      assert _chay(Vuong, 5, 4) == ((5, 5), (4, 4), 16)
      assert _chay(ChuNhat, 7, 3) == ((7, 0), (7, 3), 21)
      assert _chay(Vuong, 7, 3) == ((7, 7), (3, 3), 9)
    note: "Đã sửa 2026-11-10: thêm `def __init__(self): self.w = self.h = 0` — trước đó bảng ghi “cao 0” sau dat_rong(5) nhưng đọc r.h báo AttributeError."
