      assert round(_tong, 2) == 21.14 and abs(_tong - (18 + math.pi)) < 0.00001
    note: "Đối tượng hình là SimpleNamespace dựng trong post (dữ liệu thử ở cảnh check), không thêm gì vào hàm."
