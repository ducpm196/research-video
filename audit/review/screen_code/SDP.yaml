    sha: 556192ce183b039c
    kind: run
    lang: python
    claims:
      - "Bước 1: doc_so_luong(\"12\") → int cho 12; 12 > 0 → trả 12"
      - "Bước 2: \"12a\" → ValueError ngay ở dòng int, chưa tới dòng kiểm dương"
      - "Bước 3: \"0\" → 0 ≤ 0 → lỗi “số lượng phải dương, nhận 0”"
      - "Bước 4: \" 7 \" → 7 (int bỏ dấu cách hai đầu)"
      - "Bước 5: \"\" → báo lỗi ngay"
      - "Bước 6: 12 × 5 000 = 60 000"
    post: |
      assert doc_so_luong("12") == 12
      for v in ("12a", ""):
          try:
              doc_so_luong(v)
              raise SystemExit(repr(v) + " phải báo lỗi")
          except ValueError as e:
              assert str(e).startswith("invalid literal for int()"), e
      try:
          doc_so_luong("0")
          raise SystemExit("0 phải báo lỗi")
      except ValueError as e:
          assert str(e) == "số lượng phải dương, nhận 0"
      assert doc_so_luong(" 7 ") == 7
      assert doc_so_luong("12") * 5000 == 60000
  "SDP L02 example 0 0":
    sha: a9aab6c89384c501
    kind: run
    lang: python
    claims:
      - "bảng bước 2: tạo 100, rút 150 → báo lỗi, số dư giữ 100"
      - "bảng bước 3–4: tạo 200, nạp 50 → 250; rút 100 → 150"
      - "quiz: mở 40, nạp 30 → 70; rút 80 bị từ chối, giữ 70; rút 50 → 20"
      - "lời đọc bước 1: hàm tạo kiểm số dư ban đầu không âm; nạp chỉ nhận số tiền dương (kiểm độc lập SC1 phần A: trước chưa kiểm hai nhánh này)"
    post: |
      for _goi, _thong_bao in ((lambda: TaiKhoan(-1), "số dư âm"), (lambda: TaiKhoan(10).nap(0), "số tiền phải dương"),
                               (lambda: TaiKhoan(10).nap(-5), "số tiền phải dương")):
          try:
              _goi(); raise SystemExit("phải báo lỗi: " + _thong_bao)
          except ValueError as _e:
              assert str(_e) == _thong_bao, _e
      assert TaiKhoan().so_du == 0
      a = TaiKhoan(100)
      try:
          a.rut(150)
          raise SystemExit("rút 150 từ 100 phải báo lỗi")
      except ValueError:
          pass
      assert a.so_du == 100
      b = TaiKhoan(200); b.nap(50); assert b.so_du == 250; b.rut(100); assert b.so_du == 150
      q = TaiKhoan(40); q.nap(30); assert q.so_du == 70
      try:
          q.rut(80); raise SystemExit("rút 80 từ 70 phải bị từ chối")
      except ValueError:
          pass
      assert q.so_du == 70; q.rut(50); assert q.so_du == 20
