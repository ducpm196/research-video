    sha: 7f252e252f37b440
    kind: run
    lang: python
    claims:
      - "lời đọc mở đầu: chữ nhật thì nhân hai cạnh, tròn thì pi r bình phương (3,14159), tam giác thì nửa đáy nhân cao"
      - "cảnh check: chuỗi câu điều kiện cũ cho ba hình (3 × 4, r = 1, đáy 6 cao 2) ≈ 21,14; chênh bản đa hình chưa tới 0,00001"
    post: |
      import math
      from types import SimpleNamespace as N
      assert dien_tich(N(loai="chu_nhat", w=3, h=4)) == 12
      assert dien_tich(N(loai="tron", r=1)) == 3.14159
      assert dien_tich(N(loai="tam_giac", b=6, h=2)) == 6
