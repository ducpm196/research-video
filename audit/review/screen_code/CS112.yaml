      def dung_lai(a):
          ra = []
          while a > 0:
              for c in COINS:
                  if c <= a and 1 + dp[a - c] == dp[a]:
                      ra.append(c)
                      a -= c
                      break
          return sorted(ra, reverse=True)


      def tham_lam(a):
          n = 0
          for c in sorted(COINS, reverse=True):
              n += a // c
              a %= c
          return n


