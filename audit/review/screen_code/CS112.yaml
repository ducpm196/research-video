              u = min(con, key=lambda v: (d[v], dinh.index(v)))
              xong.add(u)
              chot.append(u)
              for a, b, w in canh:
                  if a == u and b not in xong and d[u] + w < d[b]:
                      d[b] = d[u] + w
                      cha[b] = u
          return d, chot, cha


      def bellman_ford(dinh, canh, s):
