      cha = {1: 1, 2: 1, 3: 2, 4: 3, 5: 4}                        # chuỗi 5 → 4 → 3 → 2 → 1
      size = {v: 1 for v in cha}; size[1] = 5
      def find(x):
          if cha[x] != x:
              cha[x] = find(cha[x])
          return cha[x]
      def union(a, b):
          ra = find(a); rb = find(b)
          if ra == rb: return "đã cùng nhóm"
          if size[ra] < size[rb]: ra, rb = rb, ra
          cha[rb] = ra; size[ra] += size[rb]
      assert find(5) == 1 and cha == {1: 1, 2: 1, 3: 1, 4: 1, 5: 1}
      cha.update({6: 6, 7: 6}); size.update({6: 2, 7: 1})
      assert union(7, 2) is None and cha[6] == 1                   # nhóm nhỏ (gốc 6) gắn vào nhóm lớn (gốc 1)
      assert union(3, 7) == "đã cùng nhóm"                          # cạnh 3–7 tạo chu trình ⇔ cùng gốc
      print(find(5), find(7))
    expect_stdout: "1 1"
