      import random
      snaps = []
      def partition(a, lo, hi):
          p = a[hi]; i = lo - 1
          for j in range(lo, hi):
              if a[j] <= p:
                  i = i + 1; a[i], a[j] = a[j], a[i]
              snaps.append((j, i, list(a)))
          a[i + 1], a[hi] = a[hi], a[i + 1]
          return i + 1
      def quicksort(a, lo, hi):
          if lo < hi:
              q = partition(a, lo, hi); quicksort(a, lo, q - 1); quicksort(a, q + 1, hi)
      a = [4, 7, 2, 6, 1, 5]
      q = partition(a, 0, 5)
      j, i, s = snaps[2]
      assert s == [4, 2, 7, 6, 1, 5] and i == 1 and j == 2       # vùng nhỏ ô 0..1 (4, 2), vùng lớn ô 2 (7), chốt 5
      assert a[q] == 5 and all(x <= 5 for x in a[:q]) and all(x > 5 for x in a[q + 1:]) and sorted([4, 7, 2, 6, 1, 5])[q] == 5
      rnd = random.Random(1)
      for _ in range(300):
          b = [rnd.randint(0, 20) for _ in range(rnd.randint(0, 30))]; c = list(b)
          quicksort(c, 0, len(c) - 1); assert c == sorted(b)
