      class HopTim:
          def __init__(self):
              self.cha = {v: v for v in DINH}
              self.co = {v: 1 for v in DINH}

          def tim(self, x):
              if self.cha[x] != x:
                  self.cha[x] = self.tim(self.cha[x])
              return self.cha[x]

          def hop(self, a, b):
