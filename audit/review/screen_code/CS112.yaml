  L24_sp_twin:
    lang: python
    twin_of: ["CS112 L24 dijkstra 0 0", "CS112 L24 negative 1 0"]
    reason: "dịch sát hai mã giả của CS112 L24 (chốt đỉnh gần nhất; nới mọi cạnh n − 1 vòng rồi kiểm chu trình âm) trên đồ thị ví dụ chính và đồ thị có cạnh âm của bài"
    code: |
      import math
      def dijkstra(g, S):
          d = {v: math.inf for v in g}; d[S] = 0; done, order = set(), []
          while any(v not in done and d[v] < math.inf for v in g):
              u = min((v for v in g if v not in done), key=lambda v: (d[v], v)); done.add(u); order.append(u)
              for v, w in g[u].items():
                  if v not in done and d[u] + w < d[v]: d[v] = d[u] + w
          return d, order
      def bellman_ford(g, S):
          d = {v: math.inf for v in g}; d[S] = 0
          edges = [(u, v, w) for u in g for v, w in g[u].items()]; relax = 0
          for _ in range(len(g) - 1):
              for u, v, w in edges:
                  relax += 1
                  if d[u] + w < d[v]: d[v] = d[u] + w
          neg = any(d[u] + w < d[v] for u, v, w in edges)
          return d, relax, neg
      G = {"S": {"A": 4, "B": 1}, "A": {"C": 1}, "B": {"A": 2, "C": 5, "D": 8}, "C": {"D": 3}, "D": {}}
      d, order = dijkstra(G, "S")
      assert d == {"S": 0, "A": 3, "B": 1, "C": 4, "D": 7} and order == ["S", "B", "A", "C", "D"]
      d2, relax, neg = bellman_ford(G, "S")
      assert d2 == d and relax == 4 * 7 == 28 and not neg
      N = {"S": {"A": 2, "B": 3}, "A": {}, "B": {"A": -2}}
      assert dijkstra(N, "S")[0]["A"] == 2 and bellman_ford(N, "S")[0]["A"] == 1
      C = {"S": {"A": 1}, "A": {"B": 1}, "B": {"A": -3}}
      assert bellman_ford(C, "S")[2]                             # còn cạnh nới được → chu trình âm
      print(d["D"], relax, dijkstra(N, "S")[0]["A"], bellman_ford(N, "S")[0]["A"])
    expect_stdout: "7 28 2 1"
