sources:
  L00_round_twin:
    lang: python
    twin_of: "CS112 L00 sym_round 2 0"
    reason: "dịch sát int m = (l + r) / 2; với phép chia số nguyên C99 (cắt về 0)"
    code: |
      import math
      def c_div(a, b):                   # C99 §6.5.5p6: thương bỏ phần lẻ (cắt về phía 0)
          q = abs(a) // abs(b)
          return q if (a >= 0) == (b > 0) else -q
      l, r = 0, 7
      m = c_div(l + r, 2)                # int m = (l + r) / 2;
      assert m == 3
      assert all(c_div(a + b, 2) == math.floor((a + b) / 2) for a in range(60) for b in range(60))
      print(m)
    expect_stdout: "3"
  L00_loop_twin:
    lang: python
    twin_of: "CS112 L00 loop 0 0"
    reason: "for (i = 1; i <= n; i++) thân — dịch thành while, đếm mỗi lần kiểm điều kiện i <= n và mỗi lần chạy thân"
    code: |
      def count(n):
          comps = runs = 0; trace = []
          i = 1
          while True:
              comps += 1; ok = i <= n; trace.append((i, ok))
              if not ok: break
              runs += 1                    # thân vòng lặp
              i += 1
          return comps, runs, trace
      assert count(3) == (4, 3, [(1, True), (2, True), (3, True), (4, False)])
      assert count(0)[:2] == (1, 0)
      assert all(count(n)[:2] == (n + 1, n) for n in range(60))
      print(count(3)[:2])
    expect_stdout: "(4, 3)"
  L00_nested_twin:
    lang: python
    twin_of: "CS112 L00 nested 0 0"
    reason: "dịch sát hai vòng for lồng nhau (j từ n − y đến y), đếm số lần kiểm điều kiện j <= y"
    code: |
      def count(n):
          per_y = []
          y = 1
          while y <= n:
              c = 0; j = n - y
              while True:
                  c += 1
                  if not j <= y: break
                  j += 1                   # thân vòng trong
              per_y.append(c); y += 1
          return per_y
      assert count(4) == [1, 2, 4, 6] and sum(count(4)) == 13
      assert all(4 * sum(count(n)) == n * n + 8 * n + 4 for n in range(2, 80, 2))
      assert all(4 * sum(count(n)) == n * n + 8 * n + 3 for n in range(1, 80, 2)) and sum(count(3)) == 9
      print(sum(count(4)), sum(count(3)))
    expect_stdout: "13 9"
  L00_quiz_twin:
    lang: python
    twin_of: "CS112 L00 quiz 0 0"
    reason: "dịch sát hai vòng for lồng nhau (j từ 1 đến i), đếm số lần kiểm j <= i"
    code: |
      def count(n):
          per_i = []
          i = 1
          while i <= n:
              c = 0; j = 1
              while True:
                  c += 1
                  if not j <= i: break
                  j += 1
              per_i.append(c); i += 1
          return per_i
      assert count(4) == [2, 3, 4, 5] and sum(count(4)) == 14
      assert all(2 * sum(count(n)) == n * (n + 3) for n in range(1, 80))
      print(sum(count(4)))
    expect_stdout: "14"
  L03_insert_twin:
    lang: python
    twin_of: "CS112 L03 insert_head 0 0"
    reason: "nút là dict {v, next}; dịch sát ba dòng; thêm ca đảo thứ tự hai phép gán để kiểm tiêu đề “đúng thứ tự”"
    code: |
      def mk(vals):
          head = None
          for v in reversed(vals): head = {"v": v, "next": head}
          return head
      def to_list(h, lim=10):
          out = []
          while h and len(out) < lim: out.append(h["v"]); h = h["next"]
          return out
      head = mk([7, 3, 9])
      node = {"v": 4, "next": None}      # node = nút mới chứa 4;
      node["next"] = head                # node.next = head;
      head = node                        # head = node;
      assert to_list(head) == [4, 7, 3, 9]
      h2 = mk([7, 3, 9]); n2 = {"v": 4, "next": None}
      h2 = n2; n2["next"] = h2           # đảo thứ tự: mất danh sách cũ, nút tự trỏ vào chính nó
      assert to_list(h2, 5) == [4, 4, 4, 4, 4]
      print(to_list(head))
    expect_stdout: "[4, 7, 3, 9]"
  L04_fact_twin:
    lang: python
    twin_of: "CS112 L04 callstack 0 0"
    reason: "dịch sát hàm fact, ghi vết ngăn xếp lời gọi (đẩy khi gọi, lấy ra khi trả)"
    code: |
      stack, log, depth = [], [], [0]
      def fact(n):
          stack.append(n); depth[0] = max(depth[0], len(stack)); log.append(("gọi", tuple(stack)))
          if n == 1:
              r = 1                        # if (n == 1) return 1;
          else:
              r = n * fact(n - 1)          # return n * fact(n - 1);
          stack.pop(); log.append(("trả", n, r))
          return r
