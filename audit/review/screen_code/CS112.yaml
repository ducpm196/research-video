  L08_hanoi_twin:
    lang: python
    twin_of: "CS112 L08 model 0 0"
    reason: "dịch sát mã giả Hanoi đệ quy; mỗi lần chuyển kiểm không đặt đĩa lớn lên đĩa nhỏ"
    code: |
      def solve(n):
          pegs = {"nguồn": list(range(n, 0, -1)), "trung gian": [], "đích": []}
          moves = [0]
          def move(a, b):
              disk = pegs[a].pop()
              assert not pegs[b] or pegs[b][-1] > disk
              pegs[b].append(disk); moves[0] += 1
          def hanoi(k, src, mid, dst):
              if k == 1:
                  move(src, dst); return
              hanoi(k - 1, src, dst, mid)
              move(src, dst)
              hanoi(k - 1, mid, src, dst)
          hanoi(n, "nguồn", "trung gian", "đích")
          assert pegs["đích"] == list(range(n, 0, -1))
          return moves[0]
      T = [solve(n) for n in range(1, 5)]
      assert T == [1, 3, 7, 15] == [2 ** n - 1 for n in range(1, 5)]
      assert all(solve(n) == 2 * solve(n - 1) + 1 for n in range(2, 10))
      print(T)
    expect_stdout: "[1, 3, 7, 15]"
  L10_twin:
    lang: python
    twin_of: ["CS112 L10 binsearch 0 0", "CS112 L10 findmax 0 0", "CS112 L10 threeway 0 0"]
    reason: "dịch sát ba hàm của CS112 L10 (search, findMax chia đôi, findMax ba nhánh), “/” = chia số nguyên như bài 0; đếm lời gọi và phép so sánh như bài đếm"
    code: |
      import math
      def search(A, l, r, x, c):
          c[0] += 1
          if l > r: return -1
          m = (l + r) // 2
          if A[m] == x: return m
          elif x < A[m]: return search(A, l, m - 1, x, c)
          else: return search(A, m + 1, r, x, c)
      def worst(n):
          A = list(range(0, 2 * n, 2)); best = 0
          for x in range(-1, 2 * n + 1):
              c = [0]; i = search(A, 0, n - 1, x, c)
              assert (i >= 0) == (x in A)
              best = max(best, c[0])
          return best
      assert all(worst(n) == math.floor(math.log2(n)) + 2 for n in range(1, 260))
      assert worst(1000) == 11 == 9 + 2
      def findmax2(A, l, r, c):           # c = [lời gọi, phép so sánh]
          c[0] += 1
          if l == r: return A[l]
          m = (l + r) // 2
          a = findmax2(A, l, m, c)
          b = findmax2(A, m + 1, r, c)
          c[1] += 1
          return max(a, b)
      c = [0, 0]; assert findmax2([3, 1, 4, 1, 5, 9, 2, 6], 0, 7, c) == 9 and c == [15, 7]
      def findmax3(a, l, r, c):           # c = [so sánh điều kiện, so sánh trong max]
          if l == r: return a[l]
          m = (l + r) // 2
          c[0] += 1
          if a[m] < a[m + 1]: return findmax3(a, m + 1, r, c)
          c[0] += 1
          if a[m] > a[m + 1]: return findmax3(a, l, m, c)
          c[1] += 1
          return max(findmax3(a, m + 1, r, c), findmax3(a, l, m, c))
      assert findmax3([5, 1, 2, 3], 0, 3, [0, 0]) == 3 and findmax3([1, 4, 6, 9, 7, 3], 0, 5, [0, 0]) == 9
      c = [0, 0]; findmax3(list(range(1024)), 0, 1023, c); assert c == [10, 0]
      for n in (2, 4, 8, 16, 64):
          c = [0, 0]; findmax3([7] * n, 0, n - 1, c)
          assert c[0] == 2 * n - 2 and c[0] + c[1] == 3 * n - 3
      print(worst(1000), c)
    expect_stdout: "11 [126, 63]"
