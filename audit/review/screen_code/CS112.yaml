      n = 3
      used, x, out, log = [None] + [False] * n, [None] * (n + 1), [], []
      def backtrack(i):
          for j in range(1, n + 1):
              if not used[j]:
                  x[i] = j; used[j] = True                         # ① đánh dấu
                  log.append(("đánh dấu", j, tuple(x[1:i + 1]), tuple(used[1:])))
                  if i == n: out.append(tuple(x[1:]))              # ② In(x)
                  else: backtrack(i + 1)
                  used[j] = False                                  # ③ trả lại đánh dấu
                  log.append(("trả dấu", j, tuple(used[1:])))
