    lang: python
    reason: >-
      Các câu của khối "DBS L11 sym 0 0" (chép nguyên văn) chạy qua sqlite3 để kiểm hai nhánh bài nói: trong giao dịch, lỗi →
      ROLLBACK → A 100, B 50; mỗi câu tự ghi nhận → A 100, B 200 (tổng 300). Gate sqlite dừng ở lỗi đầu nên cần nguồn Python.
    code: |
      import sqlite3
      U1 = "UPDATE TaiKhoan SET so_du = so_du + 150 WHERE ten = 'B';"
      U2 = "UPDATE TaiKhoan SET so_du = so_du - 150 WHERE ten = 'A';"
      def moi():
          con = sqlite3.connect(':memory:', isolation_level=None)
          con.executescript("CREATE TABLE TaiKhoan (ten TEXT PRIMARY KEY, so_du INTEGER CHECK (so_du >= 0));"
                            "INSERT INTO TaiKhoan VALUES ('A', 100), ('B', 50);")
          return con
      bang = lambda con: dict(con.execute('SELECT ten, so_du FROM TaiKhoan'))
      con = moi(); con.execute('BEGIN;'); con.execute(U1)
      try:
          con.execute(U2); raise SystemExit('UPDATE A phải lỗi')
      except sqlite3.IntegrityError as ex:
          assert 'CHECK constraint failed' in str(ex)
      assert bang(con) == {'A': 100, 'B': 200}      # SQLite chỉ huỷ câu lệnh lỗi
      con.execute('ROLLBACK;')
      assert bang(con) == {'A': 100, 'B': 50} and sum(bang(con).values()) == 150
      con = moi(); con.execute(U1)                   # mỗi câu tự ghi nhận
      try:
          con.execute(U2)
      except sqlite3.IntegrityError:
          pass
      assert bang(con) == {'A': 100, 'B': 200} and sum(bang(con).values()) == 300
    no_claim_reason: "khẳng định bằng assert trong mã"
