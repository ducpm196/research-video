      "bật kiểm khoá ngoại": bài 0 cảnh example bước 4.'
    code: 'EXPLAIN QUERY PLAN

      SELECT ten, ten_lop FROM Lop JOIN SinhVien ON lop = ma_lop;

      '
    expect_stdout: '4|0|216|SCAN SinhVien

      6|0|47|SEARCH Lop USING INDEX sqlite_autoindex_Lop_1 (ma_lop=?)'
  L11_rollback:
    lang: python
    reason: 'Các câu của khối "DBS L11 sym 0 0" (chép nguyên văn) chạy qua sqlite3
      để kiểm hai nhánh bài nói: trong giao dịch, lỗi → ROLLBACK → A 100, B 50; mỗi
      câu tự ghi nhận → A 100, B 200 (tổng 300). Gate sqlite dừng ở lỗi đầu nên cần
      nguồn Python.'
    code: "import sqlite3\nU1 = \"UPDATE TaiKhoan SET so_du = so_du + 150 WHERE ten\
      \ = 'B';\"\nU2 = \"UPDATE TaiKhoan SET so_du = so_du - 150 WHERE ten = 'A';\"\
      \ndef moi():\n    con = sqlite3.connect(':memory:', isolation_level=None)\n\
      \    con.executescript(\"CREATE TABLE TaiKhoan (ten TEXT PRIMARY KEY, so_du\
      \ INTEGER CHECK (so_du >= 0));\"\n                      \"INSERT INTO TaiKhoan\
      \ VALUES ('A', 100), ('B', 50);\")\n    return con\nbang = lambda con: dict(con.execute('SELECT\
      \ ten, so_du FROM TaiKhoan'))\ncon = moi(); con.execute('BEGIN;'); con.execute(U1)\n\
      try:\n    con.execute(U2); raise SystemExit('UPDATE A phải lỗi')\nexcept sqlite3.IntegrityError\
      \ as ex:\n    assert 'CHECK constraint failed' in str(ex)\nassert bang(con)\
      \ == {'A': 100, 'B': 200}      # SQLite chỉ huỷ câu lệnh lỗi\ncon.execute('ROLLBACK;')\n\
      assert bang(con) == {'A': 100, 'B': 50} and sum(bang(con).values()) == 150\n\
      con = moi(); con.execute(U1)                   # mỗi câu tự ghi nhận\ntry:\n\
      \    con.execute(U2)\nexcept sqlite3.IntegrityError:\n    pass\nassert bang(con)\
      \ == {'A': 100, 'B': 200} and sum(bang(con).values()) == 300\n"
    no_claim_reason: khẳng định bằng assert trong mã
