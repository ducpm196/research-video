  L00_moi_gia_tri_lop:
    lang: python
    reason: 'check bước 1: thử mọi giá trị lớp K1, K2, K9, rỗng cho Em trên bảng tạo
      bằng câu CREATE TABLE của khối keys 0 0 (chép nguyên văn)'
    code: "import sqlite3\nddl = \"\"\"CREATE TABLE SinhVien (\n  mssv INTEGER PRIMARY\
      \ KEY,\n  ten  TEXT NOT NULL,\n  lop  TEXT REFERENCES Lop(ma_lop),\n  diem REAL);\"\
      \"\"\nkq = {}\nfor v in ['K1', 'K2', 'K9', None]:\n    con = sqlite3.connect(':memory:')\n\
      \    con.executescript(\"PRAGMA foreign_keys = ON; CREATE TABLE Lop (ma_lop\
      \ TEXT PRIMARY KEY, ten_lop TEXT NOT NULL);\"\n                      \"INSERT\
      \ INTO Lop VALUES ('K1', 'Khoa học máy tính'), ('K2', 'Kỹ thuật phần mềm');\"\
      \ + ddl)\n    try:\n        con.execute(\"INSERT INTO SinhVien VALUES (5, 'Em',\
      \ ?, 5)\", (v,)); kq[v] = 'nhận'\n    except sqlite3.IntegrityError:\n     \
      \   kq[v] = 'từ chối'\nassert kq == {'K1': 'nhận', 'K2': 'nhận', 'K9': 'từ chối',\
      \ None: 'nhận'}, kq\n"
    no_claim_reason: khẳng định bằng assert trong mã
  L02_left_join:
    lang: sqlite
    reason: 'Câu nối ngoài trái mà màn hình ghép từ dòng SELECT của khối "DBS L02
      joins 0 0" và dòng FROM của khối 0 1 (lời đọc: "Đổi sang nối ngoài trái"). Claim:
      "giữ mọi dòng bảng trái — 4 dòng; Dũng có tên lớp rỗng (NULL)".'
    prelude: 'PRAGMA foreign_keys = ON;

      CREATE TABLE Lop (ma_lop TEXT PRIMARY KEY, ten_lop TEXT NOT NULL);

      CREATE TABLE SinhVien (mssv INTEGER PRIMARY KEY, ten TEXT NOT NULL, lop TEXT
      REFERENCES Lop(ma_lop), diem REAL);

      INSERT INTO Lop VALUES (''K1'', ''Khoa học máy tính''), (''K2'', ''Kỹ thuật
      phần mềm'');

      INSERT INTO SinhVien VALUES (1, ''An'', ''K1'', 8), (2, ''Bình'', ''K1'', 6),
      (3, ''Chi'', ''K2'', 9), (4, ''Dũng'', NULL, 7);

      '
    prelude_reason: 'CSDL mẫu bài nói ra bằng bảng, không hiện thành mã: SinhVien
      4 dòng (1 An K1 8, 2 Bình K1 6, 3 Chi K2 9, 4 Dũng NULL 7) và Lop (K1 Khoa học
      máy tính, K2 Kỹ thuật phần mềm) — bảng ở bài 0 cảnh sym/intuition và các bảng
      kết quả từng bước của bài này; lược đồ đúng câu CREATE TABLE ở bài 0 cảnh keys.
      "bật kiểm khoá ngoại": bài 0 cảnh example bước 4.'
    code: 'SELECT ten, ten_lop

      FROM SinhVien LEFT JOIN Lop ON lop = ma_lop;

      '
    expect_stdout: 'An|Khoa học máy tính

      Bình|Khoa học máy tính

      Chi|Kỹ thuật phần mềm

      Dũng|NULL'
