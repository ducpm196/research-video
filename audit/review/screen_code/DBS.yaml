  L10_vong_long:
    lang: python
    twin_of: DBS L10 prereq 1 0
    reason: bản Python đối chiếu sát từng dòng của mã giả vòng lặp lồng (1..3 → range(1,
      4), 1..4 → range(1, 5)); độ trung thực = INFERRED
    code: "dem = 0\nfor i in range(1, 4):        # vòng ngoài: 3 lần\n    for j in\
      \ range(1, 5):    # vòng trong: 4 lần mỗi lượt\n        dem += 1           \
      \  # làm việc(i, j)\nassert dem == 3 * 4 == 12\n"
    no_claim_reason: khẳng định bằng assert trong mã
