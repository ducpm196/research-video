# Sổ mã trên màn hình khoá DBS (audit/review/screen_code.py; SC1 nhóm 3, 2026-11-10). Mỗi mục ghim sha của khối.
# Dữ liệu mẫu (_data) là CSDL bài nói ra bằng bảng (không hiện thành mã) — khớp tools/checklib.py DB_DEMO.
_data:
  lop: &lop |
    PRAGMA foreign_keys = ON;
    CREATE TABLE Lop (ma_lop TEXT PRIMARY KEY, ten_lop TEXT NOT NULL);
    INSERT INTO Lop VALUES ('K1', 'Khoa học máy tính'), ('K2', 'Kỹ thuật phần mềm');
  demo: &demo |
    PRAGMA foreign_keys = ON;
    CREATE TABLE Lop (ma_lop TEXT PRIMARY KEY, ten_lop TEXT NOT NULL);
    CREATE TABLE SinhVien (mssv INTEGER PRIMARY KEY, ten TEXT NOT NULL, lop TEXT REFERENCES Lop(ma_lop), diem REAL);
    INSERT INTO Lop VALUES ('K1', 'Khoa học máy tính'), ('K2', 'Kỹ thuật phần mềm');
    INSERT INTO SinhVien VALUES (1, 'An', 'K1', 8), (2, 'Bình', 'K1', 6), (3, 'Chi', 'K2', 9), (4, 'Dũng', NULL, 7);
  demo_reason: &demo_reason >-
    CSDL mẫu bài nói ra bằng bảng, không hiện thành mã: SinhVien 4 dòng (1 An K1 8, 2 Bình K1 6, 3 Chi K2 9, 4 Dũng NULL 7)
    và Lop (K1 Khoa học máy tính, K2 Kỹ thuật phần mềm) — bảng ở bài 0 cảnh sym/intuition và các bảng kết quả từng bước
    của bài này; lược đồ đúng câu CREATE TABLE ở bài 0 cảnh keys. "bật kiểm khoá ngoại": bài 0 cảnh example bước 4.
  dangky: &dangky |
    CREATE TABLE MonHoc (ma_mon TEXT PRIMARY KEY, ten_mon TEXT NOT NULL);
    INSERT INTO MonHoc VALUES ('M1', 'Cơ sở dữ liệu'), ('M2', 'Mạng máy tính'), ('M10', 'Lý thuyết tính toán');
  dangky_rows: &dangky_rows |
    INSERT INTO DangKy VALUES (1, 'M1', 8), (1, 'M2', 7), (2, 'M1', 6), (3, 'M10', 9);
  taikhoan: &taikhoan |
    CREATE TABLE TaiKhoan (ten TEXT PRIMARY KEY, so_du INTEGER CHECK (so_du >= 0));
    INSERT INTO TaiKhoan VALUES ('A', 100), ('B', 50);
  ban: &ban |
    CREATE TABLE Ban (a TEXT, b TEXT);
    INSERT INTO Ban VALUES ('An','Bình'),('Bình','An'),('An','Chi'),('Chi','An'),('Bình','Dũng'),('Dũng','Bình'),
      ('Chi','Dũng'),('Dũng','Chi'),('Chi','Em'),('Em','Chi'),('Dũng','Giang'),('Giang','Dũng');
