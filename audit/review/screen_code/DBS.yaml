sources:
  L00_fk_K9:
    lang: sqlite
    prelude_keys: ["DBS L00 keys 0 0"]
    prelude: |
      PRAGMA foreign_keys = ON;
      CREATE TABLE Lop (ma_lop TEXT PRIMARY KEY, ten_lop TEXT NOT NULL);
      INSERT INTO Lop VALUES ('K1', 'Khoa học máy tính'), ('K2', 'Kỹ thuật phần mềm');
      INSERT INTO SinhVien VALUES (1, 'An', 'K1', 8), (2, 'Bình', 'K1', 6), (3, 'Chi', 'K2', 9), (4, 'Dũng', NULL, 7);
    prelude_reason: "Lop và 4 dòng SinhVien: bảng ở cảnh sym/intuition bài 0; SinhVien tạo bằng đúng khối keys 0 0"
    code: "INSERT INTO SinhVien VALUES (5, 'Em', 'K9', 5);"
    expect_rc: 1
    expect_stderr_contains: "FOREIGN KEY constraint failed"
  L00_pk_2:
    lang: sqlite
    prelude_keys: ["DBS L00 keys 0 0"]
    prelude: |
      PRAGMA foreign_keys = ON;
      CREATE TABLE Lop (ma_lop TEXT PRIMARY KEY, ten_lop TEXT NOT NULL);
      INSERT INTO Lop VALUES ('K1', 'Khoa học máy tính'), ('K2', 'Kỹ thuật phần mềm');
      INSERT INTO SinhVien VALUES (1, 'An', 'K1', 8), (2, 'Bình', 'K1', 6), (3, 'Chi', 'K2', 9), (4, 'Dũng', NULL, 7);
    prelude_reason: "như L00_fk_K9"
    code: "INSERT INTO SinhVien VALUES (2, 'Giang', 'K1', 7);"
    expect_rc: 1
    expect_stderr_contains: "UNIQUE constraint failed: SinhVien.mssv"
  L00_xoa_K1:
    lang: sqlite
    prelude_keys: ["DBS L00 keys 0 0"]
    prelude: |
      PRAGMA foreign_keys = ON;
      CREATE TABLE Lop (ma_lop TEXT PRIMARY KEY, ten_lop TEXT NOT NULL);
      INSERT INTO Lop VALUES ('K1', 'Khoa học máy tính'), ('K2', 'Kỹ thuật phần mềm');
      INSERT INTO SinhVien VALUES (1, 'An', 'K1', 8), (2, 'Bình', 'K1', 6), (3, 'Chi', 'K2', 9), (4, 'Dũng', NULL, 7);
    prelude_reason: "như L00_fk_K9"
    code: "DELETE FROM Lop WHERE ma_lop = 'K1';"
    expect_rc: 1
    expect_stderr_contains: "FOREIGN KEY constraint failed"
  L00_moi_gia_tri_lop:
    lang: python
    reason: "check bước 1: thử mọi giá trị lớp K1, K2, K9, rỗng cho Em trên bảng tạo bằng câu CREATE TABLE của khối keys 0 0 (chép nguyên văn)"
    code: |
      import sqlite3
      ddl = """CREATE TABLE SinhVien (
        mssv INTEGER PRIMARY KEY,
        ten  TEXT NOT NULL,
        lop  TEXT REFERENCES Lop(ma_lop),
        diem REAL);"""
      kq = {}
      for v in ['K1', 'K2', 'K9', None]:
          con = sqlite3.connect(':memory:')
          con.executescript("PRAGMA foreign_keys = ON; CREATE TABLE Lop (ma_lop TEXT PRIMARY KEY, ten_lop TEXT NOT NULL);"
                            "INSERT INTO Lop VALUES ('K1', 'Khoa học máy tính'), ('K2', 'Kỹ thuật phần mềm');" + ddl)
          try:
              con.execute("INSERT INTO SinhVien VALUES (5, 'Em', ?, 5)", (v,)); kq[v] = 'nhận'
          except sqlite3.IntegrityError:
              kq[v] = 'từ chối'
      assert kq == {'K1': 'nhận', 'K2': 'nhận', 'K9': 'từ chối', None: 'nhận'}, kq
    no_claim_reason: "khẳng định bằng assert trong mã"
  L02_left_join:
    lang: sqlite
    reason: >-
      Câu nối ngoài trái mà màn hình ghép từ dòng SELECT của khối "DBS L02 joins 0 0" và dòng FROM của khối 0 1 (lời đọc:
      "Đổi sang nối ngoài trái"). Claim: "giữ mọi dòng bảng trái — 4 dòng; Dũng có tên lớp rỗng (NULL)".
    prelude: *demo
    prelude_reason: *demo_reason
    code: |
      SELECT ten, ten_lop
      FROM SinhVien LEFT JOIN Lop ON lop = ma_lop;
    expect_stdout: "An|Khoa học máy tính\nBình|Khoa học máy tính\nChi|Kỹ thuật phần mềm\nDũng|NULL"
  L06_trung_khoa:
    lang: sqlite
    prelude_keys: ["DBS L06 map 0 0"]
    prelude: |
      PRAGMA foreign_keys = ON;
      CREATE TABLE Lop (ma_lop TEXT PRIMARY KEY, ten_lop TEXT NOT NULL);
      CREATE TABLE SinhVien (mssv INTEGER PRIMARY KEY, ten TEXT NOT NULL, lop TEXT REFERENCES Lop(ma_lop), diem REAL);
      INSERT INTO Lop VALUES ('K1', 'Khoa học máy tính'), ('K2', 'Kỹ thuật phần mềm');
      INSERT INTO SinhVien VALUES (1, 'An', 'K1', 8), (2, 'Bình', 'K1', 6), (3, 'Chi', 'K2', 9), (4, 'Dũng', NULL, 7);
      CREATE TABLE MonHoc (ma_mon TEXT PRIMARY KEY, ten_mon TEXT NOT NULL);
      INSERT INTO MonHoc VALUES ('M1', 'Cơ sở dữ liệu'), ('M2', 'Mạng máy tính'), ('M10', 'Lý thuyết tính toán');
      INSERT INTO DangKy VALUES (1, 'M1', 8), (1, 'M2', 7), (2, 'M1', 6), (3, 'M10', 9);
    prelude_reason: "như mục DBS L06 example 0 0"
    code: "INSERT INTO DangKy VALUES (1, 'M1', 5);"
    expect_rc: 1
    expect_stderr_contains: "UNIQUE constraint failed: DangKy.mssv, DangKy.ma_mon"
  L10_vong_long:
    lang: python
    twin_of: DBS L10 prereq 1 0
    reason: "bản Python đối chiếu sát từng dòng của mã giả vòng lặp lồng (1..3 → range(1, 4), 1..4 → range(1, 5)); độ trung thực = INFERRED"
    code: |
      dem = 0
      for i in range(1, 4):        # vòng ngoài: 3 lần
