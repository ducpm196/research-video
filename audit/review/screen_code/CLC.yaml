  CLC L03 example 0 0:
    sha: ed4b6dd091bdd55e
    kind: pseudo
    reason: Hai câu lệnh chính sách quyền viết bằng tiếng Việt (cho phép/từ chối, thao tác, tài nguyên), không phải cú pháp chính sách của một nhà cung cấp thật. Điều bài nói được kiểm bằng nguồn src:CLC:L03_chinh_sach trên đúng văn bản đã ghim.
    claims:
    - 'bước 2: đọc kho bao-cao → ① cho phép khớp, không câu từ chối nào khớp → cho'
    - 'bước 3: xoá kho bao-cao → ① và ② cùng khớp → từ chối (từ chối tường minh thắng)'
    - 'bước 4: ghi kho kho-khac → không câu nào khớp → từ chối ngầm định'
    unverified_claims:
    - Quy tắc “từ chối tường minh thắng, không gì khớp thì từ chối ngầm định” được nguồn mô phỏng đúng như bài phát biểu; việc các dịch vụ đám mây thật đánh giá chính sách theo đúng quy tắc này chưa đối chiếu tài liệu nhà cung cấp trong phiên này
