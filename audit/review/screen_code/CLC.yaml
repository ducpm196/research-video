sources:
  L03_chinh_sach:
    lang: python
    reason: "Đọc nguyên văn hai cặp câu lệnh trên màn hình; đánh giá theo quy tắc bài nêu: có từ chối khớp → từ chối; không thì có cho phép khớp → cho; không gì khớp → từ chối ngầm định. Mọi dòng phải đọc được."
    files: {vi_du.txt: "CLC L03 example 0 0", quiz.txt: "CLC L03 quiz 0 0"}
    code: |
      import re
      def doc(ten_tep):
          cau = []
          for dong in open(ten_tep, encoding="utf-8").read().strip("\n").split("\n"):
              m = re.match(r'^[①②③]\s*(cho phép|từ chối)\s+thao tác:\s*(\S+)\s+tài nguyên:\s*(?:kho\s+"([^"]+)"|(\*))\s*$', dong)
              assert m, "dòng không đọc được: " + dong
              cau.append((m.group(1), m.group(2), m.group(3) or m.group(4)))
          return cau
      def xet(cau, thao_tac, tai_nguyen):
          khop = lambda a, r: a in ("*", thao_tac) and r in ("*", tai_nguyen)
          if any(e == "từ chối" and khop(a, r) for e, a, r in cau):
              return "từ chối"
          if any(e == "cho phép" and khop(a, r) for e, a, r in cau):
              return "cho"
          return "từ chối ngầm định"
      vd, qz = doc("vi_du.txt"), doc("quiz.txt")
    post: |
      assert [xet(vd, "đọc", "bao-cao"), xet(vd, "xoá", "bao-cao"), xet(vd, "ghi", "kho-khac")] == ["cho", "từ chối", "từ chối ngầm định"]
      assert [xet(qz, "đọc", "bao-cao"), xet(qz, "đọc", "luong"), xet(qz, "ghi", "bao-cao")] == ["cho", "từ chối", "từ chối ngầm định"]
