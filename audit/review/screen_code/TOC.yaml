    post: |
      class _Dem(dict):
          def __init__(self, d):
              super().__init__(d); self.n = 0; self.bang = None; self.vet = []
          def __getitem__(self, k):
              self.n += 1
              return dict.__getitem__(self, k)
      def _chuoi(bang):
          return "".join(bang[i] for i in sorted(bang)).strip("_")
      def _thu(bc, w, dau, q):
          d = _Dem(bc)
          bang = dict(enumerate(w))
          vet = []
          class _Ghi(dict):
              def __setitem__(s, k, v):
                  dict.__setitem__(s, k, v); vet.append(_chuoi(s))
          bang = _Ghi(bang)
          bang, q = chay(d, bang, dau, q)
          return _chuoi(bang), d.n, q, vet
      DAO = {("F", "0"): ("F", "1", "P"), ("F", "1"): ("F", "0", "P"), ("F", "_"): ("H", "_", "Đ")}
      CONG = {("C", "1"): ("C", "0", "T"), ("C", "0"): ("H", "1", "Đ"), ("C", "_"): ("H", "1", "Đ")}
      _R = {"R": "P", "L": "T", "S": "Đ"}
      GACH = {k: (v[0], v[1], _R[v[2]]) for k, v in {
          ("q0", "0"): ("q1", "x", "R"), ("q0", "y"): ("q3", "y", "R"), ("q0", "_"): ("H", "_", "S"),
          ("q1", "0"): ("q1", "0", "R"), ("q1", "y"): ("q1", "y", "R"), ("q1", "1"): ("q2", "y", "L"),
          ("q2", "0"): ("q2", "0", "L"), ("q2", "y"): ("q2", "y", "L"), ("q2", "x"): ("q0", "x", "R"),
          ("q3", "y"): ("q3", "y", "R"), ("q3", "_"): ("H", "_", "S")}.items()}
      assert _thu(DAO, "1011", 0, "F") == ("0100", 5, "H", ["0011", "0111", "0101", "0100", "0100"])
      assert _thu(CONG, "1011", 3, "C")[:3] == ("1100", 3, "H")
      assert _thu(GACH, "0011", 0, "q0")[1:3] == (13, "H")
      assert _thu(DAO, "0110", 0, "F") == ("1001", 5, "H", ["1110", "1010", "1000", "1001", "1001"])
    note: >-
      Số bước = số lần tra bảng chuyển (đếm bằng từ điển con _Dem); "dừng" là dòng (F, trống) → sang trạng thái H, nên bước 5 là
      một lần tra. Bảng gạch cặp không hiện trên màn hình (bài chỉ tả "gạch một chữ 0 rồi một chữ 1, lặp lại"): post lấy bảng từ
      checks của cảnh, đổi R/L/S thành P/T/Đ. Hai bảng kia đúng như màn hình (T trái, P phải, Đ đứng yên).
