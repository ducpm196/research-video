sources:
  L12_Q_doi_chieu:
    lang: python
    twin_of: "TOC L12 example 0 0"
    prelude_keys: ["TOC L10 universal 0 0"]
    reason: "dịch sát 3 dòng mã giả của Q bằng trình thông dịch chay ở bài 10 (nạp nguyên văn); \"tắt mọi lệnh in\" → redirect_stdout; giới hạn 10 000 lần tra bảng như bài nói"
    code: |
      import io, contextlib, sys
      sys.stdout.reconfigure(encoding="utf-8")  # cổng chạy python -I nên PYTHONIOENCODING bị bỏ qua
      class _Gioi(dict):
          def __init__(self, d, gioi=10000):
              super().__init__(d); self.n = 0; self.gioi = gioi
          def __getitem__(self, k):
              self.n += 1
              if self.n > self.gioi:
                  raise TimeoutError(self.gioi)
              return dict.__getitem__(self, k)
      def Q(y, P, q0, x):  # bỏ qua y
          with contextlib.redirect_stdout(io.StringIO()):  # tắt mọi lệnh in của P
              chay(P, dict(enumerate(x)), 0, q0)
          print("A")
      P1 = {("F", "0"): ("F", "1", "P"), ("F", "1"): ("F", "0", "P"), ("F", "_"): ("H", "_", "Đ")}
      P2 = {("R", "_"): ("R", "_", "P")}
      for y in ["0", "11", ""]:
          Q(y, P1, "F", "0110")
      for y in ["0", "11", ""]:
          try:
              Q(y, _Gioi(P2), "R", "")
          except TimeoutError as e:
              print("chưa dừng sau", e)
      _d = _Gioi(P1)
      chay(_d, dict(enumerate("0110")), 0, "F")
      print("P1 dừng sau", _d.n)
    expect_stdout: |
      A
      A
      A
      chưa dừng sau 10000
      chưa dừng sau 10000
      chưa dừng sau 10000
      P1 dừng sau 5
