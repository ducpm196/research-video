  TOC L10 universal 0 0:
    sha: f5573f2755ef3a54
    kind: run
    lang: python
    claims:
    - 'đảo bit, đầu vào 1011, đầu ở ô 0: băng sau từng bước 0011, 0111, 0101, 0100; băng cuối 0100 sau đúng 5 bước'
    - 'cộng một (bài 9), 1011, đầu ở ô 3: 1100 sau 3 bước'
    - 'gạch cặp, 0011: nhận sau 13 bước'
    - 'quiz câu 1: đảo bit, 0110: băng sau 1110, 1010, 1000, 1001; băng cuối 1001 sau 4 + 1 = 5 bước'
    - Cùng sáu dòng mã, chỉ đổi dữ liệu là bảng chuyển, ta được ba máy khác nhau
    post: "class _Dem(dict):\n    def __init__(self, d):\n        super().__init__(d); self.n = 0; self.bang = None; self.vet = []\n    def __getitem__(self, k):\n        self.n += 1\n        return dict.__getitem__(self, k)\ndef _chuoi(bang):\n    return \"\".join(bang[i] for i in sorted(bang)).strip(\"_\")\ndef _thu(bc, w, dau, q):\n    d = _Dem(bc)\n    bang = dict(enumerate(w))\n    vet = []\n    class _Ghi(dict):\n        def __setitem__(s, k, v):\n            dict.__setitem__(s, k, v); vet.append(_chuoi(s))\n    bang = _Ghi(bang)\n    bang, q = chay(d, bang, dau, q)\n    return _chuoi(bang), d.n, q, vet\nDAO = {(\"F\", \"0\"): (\"F\", \"1\", \"P\"), (\"F\", \"1\"): (\"F\", \"0\", \"P\"), (\"F\", \"_\"): (\"H\", \"_\", \"Đ\")}\nCONG = {(\"C\", \"1\"): (\"C\", \"0\", \"T\"), (\"C\", \"0\"): (\"H\", \"1\", \"Đ\"), (\"C\", \"_\"): (\"H\", \"1\", \"Đ\")}\n_R = {\"R\": \"P\", \"L\": \"T\", \"S\": \"Đ\"}\nGACH = {k: (v[0], v[1], _R[v[2]]) for k, v in {\n    (\"q0\", \"0\"): (\"q1\", \"x\", \"R\"), (\"q0\", \"y\"): (\"q3\", \"y\", \"R\"), (\"q0\", \"_\"): (\"H\", \"_\", \"S\"),\n    (\"q1\", \"0\"): (\"q1\", \"0\", \"R\"), (\"q1\", \"y\"): (\"q1\", \"y\", \"R\"), (\"q1\", \"1\"): (\"q2\", \"y\", \"L\"),\n    (\"q2\", \"0\"): (\"q2\", \"0\", \"L\"), (\"q2\", \"y\"): (\"q2\", \"y\", \"L\"), (\"q2\", \"x\"): (\"q0\", \"x\", \"R\"),\n    (\"q3\", \"y\"): (\"q3\", \"y\", \"R\"), (\"q3\", \"_\"): (\"H\", \"_\", \"S\")}.items()}\nassert _thu(DAO, \"1011\", 0, \"F\") == (\"0100\", 5, \"H\", [\"0011\", \"0111\", \"0101\", \"0100\", \"0100\"])\nassert _thu(CONG, \"1011\", 3, \"C\")[:3] == (\"1100\", 3, \"H\")\nassert _thu(GACH, \"0011\", 0, \"q0\")[1:3] == (13, \"H\")\nassert _thu(DAO, \"0110\", 0, \"F\") == (\"1001\", 5, \"H\", [\"1110\", \"1010\", \"1000\", \"1001\", \"1001\"])\n"
    note: 'Số bước = số lần tra bảng chuyển (đếm bằng từ điển con _Dem); "dừng" là dòng (F, trống) → sang trạng thái H, nên bước 5 là một lần tra. Bảng gạch cặp không hiện trên màn hình (bài chỉ tả "gạch một chữ 0 rồi một chữ 1, lặp lại"): post lấy bảng từ checks của cảnh, đổi R/L/S thành P/T/Đ. Hai bảng kia đúng như màn hình (T trái, P phải, Đ đứng yên).'
