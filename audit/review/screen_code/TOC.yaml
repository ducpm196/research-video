    reason: dịch sát 3 dòng mã giả của Q bằng trình thông dịch chay ở bài 10 (nạp nguyên văn); "tắt mọi lệnh in" → redirect_stdout; giới hạn 10 000 lần tra bảng như bài nói
    code: "import io, contextlib, sys\nsys.stdout.reconfigure(encoding=\"utf-8\")  # cổng chạy python -I nên PYTHONIOENCODING bị bỏ qua\nclass _Gioi(dict):\n    def __init__(self, d, gioi=10000):\n        super().__init__(d); self.n = 0; self.gioi = gioi\n    def __getitem__(self, k):\n        self.n += 1\n        if self.n > self.gioi:\n            raise TimeoutError(self.gioi)\n        return dict.__getitem__(self, k)\ndef Q(y, P, q0, x):  # bỏ qua y\n    with contextlib.redirect_stdout(io.StringIO()):  # tắt mọi lệnh in của P\n        chay(P, dict(enumerate(x)), 0, q0)\n    print(\"A\")\nP1 = {(\"F\", \"0\"): (\"F\", \"1\", \"P\"), (\"F\", \"1\"): (\"F\", \"0\", \"P\"), (\"F\", \"_\"): (\"H\", \"_\", \"Đ\")}\nP2 = {(\"R\", \"_\"): (\"R\", \"_\", \"P\")}\nfor y in [\"0\", \"11\", \"\"]:\n    Q(y, P1, \"F\", \"0110\")\nfor y in [\"0\", \"11\", \"\"]:\n    try:\n        Q(y, _Gioi(P2), \"R\", \"\")\n    except TimeoutError as e:\n        print(\"chưa dừng sau\", e)\n_d = _Gioi(P1)\nchay(_d, dict(enumerate(\"0110\")), 0, \"F\")\nprint(\"P1 dừng sau\", _d.n)\n"
    expect_stdout: 'A

      A

      A

      chưa dừng sau 10000

      chưa dừng sau 10000

      chưa dừng sau 10000

      P1 dừng sau 5

      '
