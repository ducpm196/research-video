  ESY L11 queue 0 0:
    sha: 25efb080e2a775e0
    kind: syntax
    lang: c
    c_typedefs: typedef unsigned char uint8_t;
    reason: C cho hệ điều hành thời gian thực với tên hàm hàng đợi chung (không thuộc thư viện cụ thể nào); cú pháp kiểm bằng
      cổng syntax/c (pycparser C99, cổng tự bỏ chú thích); hành vi chặn/ưu tiên cần nhân RTOS thật, không chạy được
    read_check: 'Cú pháp: cổng syntax/c PASS (typedef unsigned char uint8_t; UDR0, q, WAIT_FOREVER, queue_send_from_isr, queue_receive,
      parse là tên chưa khai báo — pycparser chỉ kiểm cú pháp). Đã đọc: UDR0 là thanh ghi dữ liệu UART0 của ATmega328P (datasheet
      ATmega328P, theo hiểu biết, chưa mở lại trong phiên). Tên hàm hàng đợi là tên minh hoạ chung; ở FreeRTOS tên thật là
      xQueueSendFromISR / xQueueReceive / portMAX_DELAY.'
    unverified_claims:
    - “tác vụ giải mã bị chặn tới khi có byte; hàng đợi trống thì không tốn gì; byte đến lúc nào cũng được ngắt cất vào hàng
      đợi, không mất” — hành vi của bộ lập lịch RTOS, không có nhân RTOS để chạy; đúng với FreeRTOS theo tài liệu (theo hiểu
      biết), và chỉ khi hàng đợi chưa đầy
