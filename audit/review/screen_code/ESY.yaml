  ESY L01 ops 0 0:
    sha: b38263b619324f8e
    kind: syntax
    lang: c
    c_wrap: |-
      void f(void) {
      unsigned char reg = 145, bit;
      {CODE}
      }
    reason: C cho vi điều khiển; máy không có trình biên dịch C — cú pháp bằng cổng syntax/c (pycparser C99, cổng tự bỏ chú thích); kết quả từng dòng (chú thích nhị phân) kiểm bằng bản Python đối chiếu src:ESY:L01_bits đọc NGUYÊN VĂN khối
    read_check: 'Cú pháp: cổng syntax/c PASS (pycparser 3.00 C99, bọc trong hàm có unsigned char reg = 145, bit). Ngữ nghĩa |=, &=, ^=, ~, <<, >> theo C99 §6.5.7, §6.5.10–12, §6.5.16.2; với reg 8 bit không dấu, ~(1 << 5) là int −33, reg & −33 rồi đổi về unsigned char giữ 8 bit thấp (C99 §6.3.1.3p2).'
    claims:
    - 'chú thích: bật bit 5 10010001 → 10110001; tắt bit 5 10110001 → 10010001; đảo bit 3 10010001 → 10011001; đọc bit 4 10011001 → 1'
    - 'lời đọc: 145 thành 177, trở về 145, được 153, đọc bit 4 được 1'
    unverified_claims:
    - các giá trị trong chú thích — kiểm bằng bản Python đối chiếu src:ESY:L01_bits; độ trung thực bản dịch = INFERRED (chưa chạy trình biên dịch C thật)
