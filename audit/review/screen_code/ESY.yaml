sources:
  L01_bits:
    lang: python
    twin_of: "ESY L01 ops 0 0"
    reason: "bản Python dịch sát từng dòng C (reg là thanh ghi 8 bit không dấu, giá trị đầu 145 = 10010001 như bài nêu); đọc NGUYÊN VĂN khối và đối chiếu chú thích “trước → sau” của từng dòng khi chạy LẦN LƯỢT 4 dòng; độ trung thực bản dịch = INFERRED"
    files: {ops.c: "ESY L01 ops 0 0"}
    code: |
      import re
      reg = 0b10010001                     # 145, trạng thái đầu của bài
      b8 = lambda v: format(v & 0xFF, "08b")
      seen = []
      for ln in open("ops.c", encoding="utf-8").read().strip("\n").split("\n"):
          code, cm = ln.split("//", 1)
          before, after = re.search(r"([01]{8}) → ([01]+)\s*$", cm).groups()
          assert b8(reg) == before, f"dòng {code.strip()!r}: chú thích ghi trước = {before}, chạy thật reg = {b8(reg)}"
          code = code.strip()
          if code == "reg |= (1 << 5);":
              reg = (reg | (1 << 5)) & 0xFF
          elif code == "reg &= ~(1 << 5);":
              reg = (reg & ~(1 << 5)) & 0xFF
          elif code == "reg ^= (1 << 3);":
              reg = (reg ^ (1 << 3)) & 0xFF
          elif code == "bit = (reg >> 4) & 1;":
              bit = (reg >> 4) & 1
              assert str(bit) == after
              seen.append(bit)
              continue
          else:
              raise SystemExit("dòng lạ " + code)
          assert b8(reg) == after, (code, b8(reg), after)
          seen.append(reg)
      print(seen)
    expect_stdout: "[177, 145, 153, 1]"
  L02_torn:
    lang: python
    twin_of: "ESY L02 isr 0 0"
    reason: "mô phỏng chip 8 bit đọc biến uint16_t dem làm hai lần (byte thấp rồi byte cao, như bài nêu); ngắt có thể chen giữa hai lần đọc trừ khi đã cli(); độ trung thực bản dịch = INFERRED"
    code: |
      def read16(mem, isr_between):
          lo = mem["dem"] & 0xFF                 # đọc byte thấp
          if isr_between:
              mem["dem"] = (mem["dem"] + 1) & 0xFFFF   # hàm xử lý ngắt: dem++
          hi = (mem["dem"] >> 8) & 0xFF          # đọc byte cao
          return hi << 8 | lo
      m = {"dem": 0x00FF}
      torn = read16(m, isr_between=True)
      assert torn == 0x01FF == 511 and m["dem"] == 256 and torn not in (255, 256)
      m = {"dem": 0x00FF}
      ok = read16(m, isr_between=False)          # cli(); x = dem; sei(): không ngắt nào chen giữa
      assert ok == 255
      print(torn, ok)
    expect_stdout: "511 255"
