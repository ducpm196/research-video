course: ESY
sources:
  L01_bits:
    lang: python
    twin_of: ESY L01 ops 0 0
    reason: bản Python dịch sát từng dòng C (reg là thanh ghi 8 bit không dấu, giá trị đầu 145 = 10010001 như bài nêu); đọc
      NGUYÊN VĂN khối và đối chiếu chú thích “trước → sau” của từng dòng khi chạy LẦN LƯỢT 4 dòng; độ trung thực bản dịch
      = INFERRED
    files:
      ops.c: ESY L01 ops 0 0
    code: "import re\nreg = 0b10010001                     # 145, trạng thái đầu của bài\nb8 = lambda v: format(v & 0xFF,\
      \ \"08b\")\nseen = []\nfor ln in open(\"ops.c\", encoding=\"utf-8\").read().strip(\"\\n\").split(\"\\n\"):\n    code,\
      \ cm = ln.split(\"//\", 1)\n    before, after = re.search(r\"([01]{8}) → ([01]+)\\s*$\", cm).groups()\n    assert b8(reg)\
      \ == before, f\"dòng {code.strip()!r}: chú thích ghi trước = {before}, chạy thật reg = {b8(reg)}\"\n    code = code.strip()\n\
      \    if code == \"reg |= (1 << 5);\":\n        reg = (reg | (1 << 5)) & 0xFF\n    elif code == \"reg &= ~(1 << 5);\"\
      :\n        reg = (reg & ~(1 << 5)) & 0xFF\n    elif code == \"reg ^= (1 << 3);\":\n        reg = (reg ^ (1 << 3)) &\
      \ 0xFF\n    elif code == \"bit = (reg >> 4) & 1;\":\n        bit = (reg >> 4) & 1\n        assert str(bit) == after\n\
      \        seen.append(bit)\n        continue\n    else:\n        raise SystemExit(\"dòng lạ \" + code)\n    assert b8(reg)\
      \ == after, (code, b8(reg), after)\n    seen.append(reg)\nprint(seen)\n"
    expect_stdout: '[177, 145, 153, 1]'
  L02_torn:
    lang: python
    twin_of: ESY L02 isr 0 0
    reason: mô phỏng chip 8 bit đọc biến uint16_t dem làm hai lần (byte thấp rồi byte cao, như bài nêu); ngắt có thể chen
      giữa hai lần đọc trừ khi đã cli(); độ trung thực bản dịch = INFERRED
    code: "def read16(mem, isr_between):\n    lo = mem[\"dem\"] & 0xFF                 # đọc byte thấp\n    if isr_between:\n\
      \        mem[\"dem\"] = (mem[\"dem\"] + 1) & 0xFFFF   # hàm xử lý ngắt: dem++\n    hi = (mem[\"dem\"] >> 8) & 0xFF \
      \         # đọc byte cao\n    return hi << 8 | lo\nm = {\"dem\": 0x00FF}\ntorn = read16(m, isr_between=True)\nassert\
      \ torn == 0x01FF == 511 and m[\"dem\"] == 256 and torn not in (255, 256)\nm = {\"dem\": 0x00FF}\nok = read16(m, isr_between=False)\
      \          # cli(); x = dem; sei(): không ngắt nào chen giữa\nassert ok == 255\nprint(torn, ok)\n"
    expect_stdout: 511 255
blocks:
  ESY L01 ops 0 0:
    sha: b38263b619324f8e
    kind: syntax
    lang: c
    c_wrap: 'void f(void) {

      unsigned char reg = 145, bit;

      {CODE}

      }'
    reason: C cho vi điều khiển; máy không có trình biên dịch C — cú pháp bằng cổng syntax/c (pycparser C99, cổng tự bỏ chú
      thích); kết quả từng dòng (chú thích nhị phân) kiểm bằng bản Python đối chiếu src:ESY:L01_bits đọc NGUYÊN VĂN khối
    read_check: 'Cú pháp: cổng syntax/c PASS (pycparser 3.00 C99, bọc trong hàm có unsigned char reg = 145, bit). Ngữ nghĩa
      |=, &=, ^=, ~, <<, >> theo C99 §6.5.7, §6.5.10–12, §6.5.16.2; với reg 8 bit không dấu, ~(1 << 5) là int −33, reg & −33
      rồi đổi về unsigned char giữ 8 bit thấp (C99 §6.3.1.3p2).'
    claims:
    - 'chú thích: bật bit 5 10010001 → 10110001; tắt bit 5 10110001 → 10010001; đảo bit 3 10010001 → 10011001; đọc bit 4 10011001
      → 1'
    - 'lời đọc: 145 thành 177, trở về 145, được 153, đọc bit 4 được 1'
    unverified_claims:
    - các giá trị trong chú thích — kiểm bằng bản Python đối chiếu src:ESY:L01_bits; độ trung thực bản dịch = INFERRED (chưa
      chạy trình biên dịch C thật)
