  MLO L03 example 0 0:
    sha: 2b462f5ef74b05e2
    kind: run
    lang: python
    claims:
    - 'bước 2: mô hình đúng chấm ba câu 1, 1, 1 → tập nhãn {tích cực} → đạt'
    - 'bước 3: mô hình học nhầm trừ thêm 2 khi gặp tên Hùng → 1, −1, 1 → tập nhãn
      có 2 phần tử → trượt, báo nhãn đổi theo tên'
    prelude: "def _diem(cau, hoc_nham=False):\n    w = cau.lower().split()\n    s\
      \ = w.count(\"tốt\") - w.count(\"chậm\")\n    if hoc_nham:\n        s -= 2 *\
      \ w.count(\"hùng\")\n    return s\ndef _nhan(s):\n    return \"tích cực\" if\
      \ s > 0 else (\"tiêu cực\" if s < 0 else \"trung tính\")\ndef mo_hinh_dung(cau):\n\
      \    return _nhan(_diem(cau))\ndef mo_hinh_hoc_nham(cau):\n    return _nhan(_diem(cau,\
      \ True))\n"
    prelude_reason: 'Bài tả hai mô hình đồ chơi bằng lời, không hiện thành mã: "mô
      hình đúng chấm cả ba câu được điểm 1, vì chỉ có chữ tốt"; "mô hình học nhầm
      trừ thêm 2 khi gặp tên Hùng"; quiz: "chữ tốt cộng 1, chữ chậm trừ 1, điểm bằng
      0, nên nhãn là trung tính"; điểm dương → tích cực, âm → tiêu cực. Prelude viết
      đúng các luật đó (như checklib.toy_sentiment, chỉ giữ hai chữ bài nói).'
    post: "_mau = \"{} nói dịch vụ này rất tốt\"\nassert [_diem(_mau.format(t)) for\
      \ t in [\"An\", \"Hùng\", \"Lan\"]] == [1, 1, 1]\nassert [_diem(_mau.format(t),\
      \ True) for t in [\"An\", \"Hùng\", \"Lan\"]] == [1, -1, 1]\nkiem_bat_bien(mo_hinh_dung)\n\
      try:\n    kiem_bat_bien(mo_hinh_hoc_nham)\n    raise SystemExit(\"mô hình học\
      \ nhầm phải trượt\")\nexcept AssertionError as e:\n    assert str(e).startswith(\"\
      nhãn đổi theo tên:\") and \"tích cực\" in str(e) and \"tiêu cực\" in str(e),\
      \ str(e)\n"
    note: '"tên làm đổi nhãn: Hùng" ở bảng là suy từ điểm 1, −1, 1 (post kiểm điểm
      từng câu); hàm của khối chỉ báo tập nhãn, không báo tên.'
