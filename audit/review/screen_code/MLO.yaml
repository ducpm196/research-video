# Nhóm 1, SC1, 2026-11-10.
blocks:
  "MLO L03 example 0 0":
    sha: 2b462f5ef74b05e2
    kind: run
    lang: python
    claims:
      - "bước 2: mô hình đúng chấm ba câu 1, 1, 1 → tập nhãn {tích cực} → đạt"
      - "bước 3: mô hình học nhầm trừ thêm 2 khi gặp tên Hùng → 1, −1, 1 → tập nhãn có 2 phần tử → trượt, báo nhãn đổi theo tên"
    prelude: |
      def _diem(cau, hoc_nham=False):
          w = cau.lower().split()
          s = w.count("tốt") - w.count("chậm")
          if hoc_nham:
              s -= 2 * w.count("hùng")
          return s
      def _nhan(s):
          return "tích cực" if s > 0 else ("tiêu cực" if s < 0 else "trung tính")
      def mo_hinh_dung(cau):
          return _nhan(_diem(cau))
      def mo_hinh_hoc_nham(cau):
          return _nhan(_diem(cau, True))
    prelude_reason: >-
      Bài tả hai mô hình đồ chơi bằng lời, không hiện thành mã: "mô hình đúng chấm cả ba câu được điểm 1, vì chỉ có chữ tốt";
      "mô hình học nhầm trừ thêm 2 khi gặp tên Hùng"; quiz: "chữ tốt cộng 1, chữ chậm trừ 1, điểm bằng 0, nên nhãn là trung tính";
      điểm dương → tích cực, âm → tiêu cực. Prelude viết đúng các luật đó (như checklib.toy_sentiment, chỉ giữ hai chữ bài nói).
    post: |
      _mau = "{} nói dịch vụ này rất tốt"
      assert [_diem(_mau.format(t)) for t in ["An", "Hùng", "Lan"]] == [1, 1, 1]
      assert [_diem(_mau.format(t), True) for t in ["An", "Hùng", "Lan"]] == [1, -1, 1]
      kiem_bat_bien(mo_hinh_dung)
      try:
          kiem_bat_bien(mo_hinh_hoc_nham)
          raise SystemExit("mô hình học nhầm phải trượt")
      except AssertionError as e:
          assert str(e).startswith("nhãn đổi theo tên:") and "tích cực" in str(e) and "tiêu cực" in str(e), str(e)
    note: "\"tên làm đổi nhãn: Hùng\" ở bảng là suy từ điểm 1, −1, 1 (post kiểm điểm từng câu); hàm của khối chỉ báo tập nhãn, không báo tên."
