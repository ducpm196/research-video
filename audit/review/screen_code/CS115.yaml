  LAB_L45:
    lang: python
    reason: lời giải thật của lab labs/CS115/L45 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "import math\n\nETA, BETA1, BETA2 = 0.001, 0.9, 0.999\nLAM = 0.0001\nW_A, W_B = 1.0, 1.0\n\n\ndef adam_cac_buoc(g, so_buoc):\n    # gradient của hàm mất mát không đổi qua các bước; trả về độ dài mỗi bước và căn của s hiệu chỉnh\n    m, s = 0.0, 0.0\n    buoc, can_s = [], 0.0\n    for k in range(1, so_buoc + 1):\n        m = BETA1 * m + (1 - BETA1) * g\n        s = BETA2 * s + (1 - BETA2) * g * g\n        m_hc = m / (1 - BETA1 ** k)\n        s_hc = s / (1 - BETA2 ** k)\n        can_s = math.sqrt(s_hc)\n        buoc.append(round(ETA * m_hc / can_s, 6))\n    return buoc, can_s\n\n\nbuoc_a, can_a = adam_cac_buoc(10.0, 3)\nbuoc_b, can_b = adam_cac_buoc(0.1, 3)\nprint(\"buoc Adam A (g=10):\", buoc_a)\nprint(\"buoc Adam B (g=0.1):\", buoc_b)\nprint(\"can s A:\", round(can_a, 4))\nprint(\"can s B:\", round(can_b, 4))\n\nl2_a = ETA * LAM * W_A / can_a\nl2_b = ETA * LAM * W_B / can_b\ntach_a = ETA * LAM * W_A\ntach_b = ETA * LAM * W_B\nprint(f\"phat L2 keo ve 0 A: {l2_a:.1e}\")\nprint(f\"phat L2 keo ve 0 B: {l2_b:.1e}\")\nprint(f\"tach roi keo ve 0 A: {tach_a:.1e}\")\nprint(f\"tach roi keo ve 0 B: {tach_b:.1e}\")\nprint(\"ti so B chia A, phat L2:\", round(l2_b / l2_a, 2))\nprint(\"ti so B chia A, tach roi:\", round(tach_b / tach_a, 2))\n"
    expect_stdout: 'buoc Adam A (g=10): [0.001, 0.001, 0.001]

      buoc Adam B (g=0.1): [0.001, 0.001, 0.001]

      can s A: 10.0

      can s B: 0.1

      phat L2 keo ve 0 A: 1.0e-08

      phat L2 keo ve 0 B: 1.0e-06

      tach roi keo ve 0 A: 1.0e-07

      tach roi keo ve 0 B: 1.0e-07

      ti so B chia A, phat L2: 100.0

      ti so B chia A, tach roi: 1.0

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L46:
    lang: python
    reason: lời giải thật của lab labs/CS115/L46 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "from fractions import Fraction\n\n\ndef dinh_thuc(M):\n    return M[0][0] * M[1][1] - M[0][1] * M[1][0]\n\n\ndef nghich_dao(M):\n    dt = Fraction(dinh_thuc(M))\n    return [[M[1][1] / dt, -M[0][1] / dt], [-M[1][0] / dt, M[0][0] / dt]]\n\n\ndef nhan_vec(A, v):\n    return [A[0][0] * v[0] + A[0][1] * v[1], A[1][0] * v[0] + A[1][1] * v[1]]\n\n\ndef chuoi(v):\n    if isinstance(v[0], list):\n        return \"[\" + \", \".join(chuoi(r) for r in v) + \"]\"\n    return \"[\" + \", \".join(str(t) for t in v) + \"]\"\n\n\nM, b = [[5, 2], [7, 3]], [9, 13]\nMn = nghich_dao(M)\nw = nhan_vec(Mn, b)\nprint(\"dinh thuc M:\", dinh_thuc(M))\nprint(\"M nghich dao:\", chuoi(Mn))\nprint(\"w:\", chuoi(w))\nprint(\"M.w:\", chuoi(nhan_vec(M, w)))\nfor t in (Fraction(1, 100), Fraction(1, 10000)):\n    Mt = [[1, 1], [1, 1 + t]]\n    Mi = nghich_dao(Mt)\n    lon = max(abs(x) for r in Mi for x in r)\n    print(f\"t={t}: dinh thuc {dinh_thuc(Mt)}, nghich dao lon nhat {lon}, w doi {chuoi(nhan_vec(Mi, [0, Fraction(1, 1000)]))}\")\nX = [[1, 1], [1, 2], [1, 3]]\ny = [2, 2, 4]\nXtX = [[sum(r[i] * r[j] for r in X) for j in range(2)] for i in range(2)]\nXty = [sum(r[i] * t for r, t in zip(X, y)) for i in range(2)]\nprint(\"hoi quy: w =\", chuoi(nhan_vec(nghich_dao(XtX), Xty)))\nX2 = [[1, 1], [3, 3], [5, 5]]\nA2 = [[sum(r[i] * r[j] for r in X2) for j in range(2)] for i in range(2)]\nprint(\"hai cot giong nhau: dinh thuc X^T X =\", dinh_thuc(A2))\n"
    expect_stdout: 'dinh thuc M: 1

      M nghich dao: [[3, -2], [-7, 5]]

      w: [1, 2]

      M.w: [9, 13]

      t=1/100: dinh thuc 1/100, nghich dao lon nhat 101, w doi [-1/10, 1/10]

      t=1/10000: dinh thuc 1/10000, nghich dao lon nhat 10001, w doi [-10, 10]

      hoi quy: w = [2/3, 1]

      hai cot giong nhau: dinh thuc X^T X = 0

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
