    code: "from fractions import Fraction\n\nnha = {\"P\": (3, 2, 2, 12), \"Q\": (8, 1, 3, 26)}\n\n\ndef sai_so_bp(w, dien_tich, phong, km, gia_that):\n    gia_doan = w * dien_tich + 2 * phong - 1 * km\n    return (gia_doan - gia_that) ** 2\n\n\ntot_nhat = None\nfor w in (2, 3, 4, 5):\n    p = sai_so_bp(w, *nha[\"P\"])\n    q = sai_so_bp(w, *nha[\"Q\"])\n    tong = p + q\n    print(f\"w={w} P={p} Q={q} tong={tong}\")\n    if tot_nhat is None or tong < tot_nhat[1]:\n        tot_nhat = (w, tong)\nprint(\"w tot nhat:\", tot_nhat[0])\nprint(\"tong nho nhat:\", tot_nhat[1])\n\n\ndef w_dung(dien_tich, phong, km, gia_that):\n    return Fraction(gia_that - 2 * phong + 1 * km, dien_tich)\n\n\nprint(f\"P dung khi w = {w_dung(*nha['P'])}, Q dung khi w = {w_dung(*nha['Q'])}\")\n"
    expect_stdout: 'w=2 P=16 Q=121 tong=137

      w=3 P=1 Q=9 tong=10

      w=4 P=4 Q=25 tong=29

      w=5 P=25 Q=169 tong=194

      w tot nhat: 3

      tong nho nhat: 10

      P dung khi w = 10/3, Q dung khi w = 27/8

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L01:
    lang: python
    reason: lời giải thật của lab labs/CS115/L01 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "from fractions import Fraction\n\n\ndef dot(u, v):\n    return sum(a * b for a, b in zip(u, v))\n\n\ndef chieu(y, u):\n    tu, mau = dot(y, u), dot(u, u)\n    c = Fraction(tu, mau)\n    hc = [c * x for x in u]\n    z = [a - b for a, b in zip(y, hc)]\n    return tu, mau, c, hc, z\n\n\ndef ghep(v):\n    return \"[\" + \", \".join(str(x) for x in v) + \"]\"\n\n\ny, u = [7, 4, 1], [2, 0, 1]\ntu, mau, c, hc, z = chieu(y, u)\nprint(\"tu so:\", tu)\nprint(\"mau so:\", mau)\nprint(\"c =\", c)\nprint(\"hinh chieu:\", ghep(hc))\nprint(\"phan con lai z:\", ghep(z))\nprint(\"z.u =\", dot(z, u))\nprint(f\"Pytago: {dot(y, y)} = {dot(hc, hc)} + {dot(z, z)}\")\n\ntu, mau, c, hc, z = chieu([2, 3], [4, 1])\nprint(\"c =\", c)\nprint(\"hinh chieu:\", ghep(hc))\n"
    expect_stdout: 'tu so: 15

      mau so: 5

      c = 3

      hinh chieu: [6, 0, 3]

      phan con lai z: [1, 4, -2]

      z.u = 0

      Pytago: 66 = 45 + 21

      c = 11/17

      hinh chieu: [44/17, 11/17]

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L02:
    lang: python
    reason: lời giải thật của lab labs/CS115/L02 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "from fractions import Fraction\n\n\ndef nhan(A, B):\n    return [[sum(A[i][k] * B[k][j] for k in range(len(B))) for j in range(len(B[0]))] for i in range(len(A))]\n\n\ndef dinh_thuc(M):\n    return M[0][0] * M[1][1] - M[0][1] * M[1][0]\n\n\ndef nghich_dao(M):\n    dt = dinh_thuc(M)\n    if dt == 0:\n        return None\n    a, b, c, d = M[0][0], M[0][1], M[1][0], M[1][1]\n    return [[Fraction(d, dt), Fraction(-b, dt)], [Fraction(-c, dt), Fraction(a, dt)]]\n\n\ndef chuoi(x):\n    if isinstance(x, list):\n        return \"[\" + \", \".join(chuoi(t) for t in x) + \"]\"\n    return str(x)\n\n\nA, B = [[2, 0], [1, 3]], [[1, 4], [2, 5]]\nprint(\"AB =\", chuoi(nhan(A, B)))\nprint(\"BA =\", chuoi(nhan(B, A)))\nprint(\"AB khac BA:\", nhan(A, B) != nhan(B, A))\n\nM, b = [[3, 1], [5, 2]], [13, 22]\nprint(\"dinh thuc M:\", dinh_thuc(M))\nMn = nghich_dao(M)\nprint(\"M nghich dao:\", chuoi(Mn))\nw = [sum(Mn[i][k] * b[k] for k in range(2)) for i in range(2)]\nprint(\"w =\", chuoi(w))\nprint(\"M.w =\", chuoi([sum(M[i][k] * w[k] for k in range(2)) for i in range(2)]))\n"
    expect_stdout: 'AB = [[2, 8], [7, 19]]

      BA = [[6, 12], [9, 15]]

      AB khac BA: True

      dinh thuc M: 1

      M nghich dao: [[2, -1], [-5, 3]]

      w = [4, 1]

      M.w = [13, 22]

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L03:
    lang: python
    reason: lời giải thật của lab labs/CS115/L03 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "from fractions import Fraction\n\nhe1 = [[2, 1, -1, 6], [1, 3, 2, 3], [1, 0, -2, 4]]\nhe2 = [[1, 2, 3, 4], [2, 4, 6, 9], [1, 0, 1, 1]]\nhe3 = [[1, 2, 3, 4], [2, 4, 6, 8], [1, 0, 1, 1]]\n\n\ndef khu(M):\n    M = [[Fraction(x) for x in hang] for hang in M]\n    so_cot = len(M[0])\n    r = 0\n    for c in range(so_cot):\n        p = next((i for i in range(r, len(M)) if M[i][c] != 0), None)\n        if p is None:\n            continue\n        M[r], M[p] = M[p], M[r]\n        for i in range(r + 1, len(M)):\n            k = M[i][c] / M[r][c]\n            M[i] = [a - k * b for a, b in zip(M[i], M[r])]\n        r += 1\n        if r == len(M):\n            break\n    return M\n\n\ndef hang(M):\n    return sum(1 for hang in khu(M) if any(x != 0 for x in hang))\n\n\ndef the_nguoc(B):\n    n = len(B)\n    x = [Fraction(0)] * n\n    for i in range(n - 1, -1, -1):\n        x[i] = (B[i][n] - sum(B[i][j] * x[j] for j in range(i + 1, n))) / B[i][i]\n    return x\n\n\nfor k, he in enumerate((he1, he2, he3), 1):\n    ra = hang([hang_[:3] for hang_ in he])\n    rm = hang(he)\n    if ra < rm:\n        kl = \"vo nghiem\"\n    elif ra < 3:\n        kl = \"vo so nghiem\"\n    else:\n        x, y, z = the_nguoc(khu(he))\n        kl = f\"nghiem duy nhat x={x}, y={y}, z={z}\"\n    print(f\"he {k}: hang A={ra}, hang mo rong={rm}, {kl}\")\n"
    expect_stdout: 'he 1: hang A=3, hang mo rong=3, nghiem duy nhat x=2, y=1, z=-1

      he 2: hang A=2, hang mo rong=3, vo nghiem

      he 3: hang A=2, hang mo rong=2, vo so nghiem

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L04:
    lang: python
    reason: lời giải thật của lab labs/CS115/L04 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "from fractions import Fraction\n\nx1, x2, x3 = [1, 1, 0], [1, 0, 1], [0, 1, 1]\ny = [3, 2, 1]\n\n\ndef dot(u, v):\n    return sum(Fraction(a) * b for a, b in zip(u, v))\n\n\ndef bong(x, v):\n    c = dot(x, v) / dot(v, v)\n    return [c * t for t in v]\n\n\ndef tru(x, cac_bong):\n    kq = [Fraction(t) for t in x]\n    for b in cac_bong:\n        kq = [a - c for a, c in zip(kq, b)]\n    return kq\n\n\ndef chuoi(v):\n    return \"[\" + \", \".join(str(t) for t in v) + \"]\"\n\n\nv1 = [Fraction(t) for t in x1]\nv2 = tru(x2, [bong(x2, v1)])\nv3 = tru(x3, [bong(x3, v1), bong(x3, v2)])\nprint(\"v1 =\", chuoi(v1))\nprint(\"v2 =\", chuoi(v2))\nprint(\"v3 =\", chuoi(v3))\nprint(\"v1.v2 =\", dot(v1, v2))\nprint(\"v1.v3 =\", dot(v1, v3))\nprint(\"v2.v3 =\", dot(v2, v3))\nprint(\"binh phuong do dai:\", chuoi([dot(v, v) for v in (v1, v2, v3)]))\nprint(\"toa do cua y:\", chuoi([dot(y, v) / dot(v, v) for v in (v1, v2, v3)]))\n"
    expect_stdout: 'v1 = [1, 1, 0]

      v2 = [1/2, -1/2, 1]

      v3 = [-2/3, 2/3, 2/3]

      v1.v2 = 0

      v1.v3 = 0

      v2.v3 = 0

      binh phuong do dai: [2, 3/2, 4/3]

      toa do cua y: [5/2, 1, 0]

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L05:
    lang: python
    reason: lời giải thật của lab labs/CS115/L05 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "import math\n\n\ndef tri_rieng(M):\n    (a, b), (c, d) = M\n    vet, dt = a + d, a * d - b * c\n    delta = vet * vet - 4 * dt\n    if delta < 0:\n        return None\n    r = math.isqrt(delta)\n    assert r * r == delta\n    return [(vet - r) // 2, (vet + r) // 2]\n\n\nM = [[5, 2], [2, 2]]\n(a, b), (c, d) = M\nprint(\"dinh thuc:\", a * d - b * c)\nprint(\"vet:\", a + d)\nlams = tri_rieng(M)\nprint(\"tri rieng:\", lams)\nfor lam in lams:\n    g = math.gcd(b, lam - a)\n    v = [b // g, (lam - a) // g]\n    print(f\"vector rieng cho {lam}: {v}\")\n    Mv = [a * v[0] + b * v[1], c * v[0] + d * v[1]]\n    print(f\"M.v = lambda.v (lambda={lam}):\", Mv == [lam * v[0], lam * v[1]])\nR = [[0, -2], [2, 0]]\nif tri_rieng(R) is None:\n    print(\"ma tran xoay: khong co tri rieng thuc\")\n"
    expect_stdout: 'dinh thuc: 6

      vet: 7

      tri rieng: [1, 6]

      vector rieng cho 1: [1, -2]

      M.v = lambda.v (lambda=1): True

      vector rieng cho 6: [2, 1]

      M.v = lambda.v (lambda=6): True

      ma tran xoay: khong co tri rieng thuc

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L06:
    lang: python
    reason: lời giải thật của lab labs/CS115/L06 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "import math\n\n\ndef f(x, y):\n    return 3 * x**2 + x * y - 2 * y**2\n\n\nx0, y0 = 2, 1\ngx, gy = 6 * x0 + y0, x0 - 4 * y0\nprint(f\"gradient bang cong thuc: [{gx}, {gy}]\")\nh = 0.0001\nax = (f(x0 + h, y0) - f(x0 - h, y0)) / (2 * h)\nay = (f(x0, y0 + h) - f(x0, y0 - h)) / (2 * h)\nprint(f\"gradient bang buoc nho: [{round(ax, 4)}, {round(ay, 4)}]\")\nprint(f\"do dai gradient: {round(math.sqrt(gx**2 + gy**2), 4)}\")\nx1, y1 = x0 - 0.01 * gx, y0 - 0.01 * gy\nprint(f\"f(2,1) = {f(x0, y0)}; sau buoc nguoc gradient 0.01: {round(f(x1, y1), 4)}\")\nprint(\"f giam:\", f(x1, y1) < f(x0, y0))\n"
    expect_stdout: 'gradient bang cong thuc: [13, -2]

      gradient bang buoc nho: [13.0, -2.0]

      do dai gradient: 13.1529

      f(2,1) = 12; sau buoc nguoc gradient 0.01: 10.3173

      f giam: True

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L07:
    lang: python
    reason: lời giải thật của lab labs/CS115/L07 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "def f(x, y):\n    return [x * y, x**2 - y, x + y**2]\n\n\ndef jacobian(x, y):\n    return [[y, x], [2 * x, -1], [1, 2 * y]]\n\n\nx0, y0 = 2, 3\nJ = jacobian(x0, y0)\nprint(\"J =\", J)\nbuoc = [0.1, -0.1]\ndu_doan = [round(J[i][0] * buoc[0] + J[i][1] * buoc[1], 4) for i in range(3)]\nf0, f1 = f(x0, y0), f(x0 + 0.1, y0 - 0.1)\nthuc_te = [round(f1[i] - f0[i], 4) for i in range(3)]\nprint(\"du doan:\", du_doan)\nprint(\"thuc te:\", thuc_te)\n\na, b, c = f(x0, y0)\nJ_ngoai = [2 * a, c, b]\nprint(\"Jacobian ngoai:\", J_ngoai)\nhop = [sum(J_ngoai[i] * J[i][j] for i in range(3)) for j in range(2)]\nprint(\"gradient hop (J ngoai nhan J):\", hop)\n\n\ndef H(x, y):\n    a, b, c = f(x, y)\n    return a**2 + b * c\n\n\ne = 0.00001\ngx = (H(x0 + e, y0) - H(x0 - e, y0)) / (2 * e)\ngy = (H(x0, y0 + e) - H(x0, y0 - e)) / (2 * e)\nprint(\"gradient truc tiep (buoc nho):\", [round(gx, 2), round(gy, 2)])\n"
    expect_stdout: 'J = [[3, 2], [4, -1], [1, 6]]

      du doan: [0.1, 0.5, -0.5]

      thuc te: [0.09, 0.51, -0.49]

      Jacobian ngoai: [12, 11, 1]

      gradient hop (J ngoai nhan J): [81, 19]

      gradient truc tiep (buoc nho): [81.0, 19.0]

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L08:
    lang: python
    reason: lời giải thật của lab labs/CS115/L08 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "from fractions import Fraction\n\nham = {\n    \"f1\": ([[2, 1], [1, 2]], [3, 0]),\n    \"f2\": ([[2, -3], [-3, 2]], [0, 0]),\n    \"f3\": ([[-2, 0], [0, -4]], [-4, 0]),\n    \"f4\": ([[2, 2], [2, 2]], [2, 2]),\n}\nfor ten, (H, v) in ham.items():\n    a, b, c = H[0][0], H[0][1], H[1][1]\n    m1, m2 = a, a * c - b * b\n    if m2 != 0:\n        x = Fraction(c * v[0] - b * v[1], m2)\n        y = Fraction(-b * v[0] + a * v[1], m2)\n        diem = f\"diem dung ({x}, {y})\"\n    else:\n        diem = \"khong co diem dung duy nhat\"\n    if m2 < 0:\n        kl = \"yen ngua\"\n    elif m2 == 0:\n        kl = \"chua ket luan\"\n    elif m1 > 0:\n        kl = \"day\"\n    else:\n        kl = \"dinh\"\n    print(f\"{ten}: {diem}, dinh thuc con: {m1} va {m2}, ket luan: {kl}\")\n"
    expect_stdout: 'f1: diem dung (2, -1), dinh thuc con: 2 va 3, ket luan: day

      f2: diem dung (0, 0), dinh thuc con: 2 va -5, ket luan: yen ngua

      f3: diem dung (2, 0), dinh thuc con: -2 va 8, ket luan: dinh

      f4: khong co diem dung duy nhat, dinh thuc con: 2 va 0, ket luan: chua ket luan

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L09:
    lang: python
    reason: lời giải thật của lab labs/CS115/L09 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "def dao_ham(w):\n    return 6 * (w - 2)\n\n\ndef chay(eta, so_buoc):\n    w = 10.0\n    ds = [w]\n    for _ in range(so_buoc):\n        w = w - eta * dao_ham(w)\n        ds.append(round(w, 4))\n    return ds\n\n\na = chay(0.1, 4)\nprint(\"eta=0.1:\", [round(x, 4) for x in a])\nb = chay(0.4, 3)\nprint(\"eta=0.4:\", [round(x, 4) for x in b])\nprint(\"phan ky:\", abs(b[3] - 2) > abs(b[0] - 2))\nN, D, B = 1000000, 100, 100\nprint(f\"GD 1 buoc: {N * D} phep; SGD 1 buoc: {B * D} phep; buoc SGD moi epoch: {N // B}\")\n"
    expect_stdout: 'eta=0.1: [10.0, 5.2, 3.28, 2.512, 2.2048]

      eta=0.4: [10.0, -9.2, 17.68, -19.952]

      phan ky: True

      GD 1 buoc: 100000000 phep; SGD 1 buoc: 10000 phep; buoc SGD moi epoch: 10000

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L10:
    lang: python
    reason: lời giải thật của lab labs/CS115/L10 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
    code: "import math\n\n\ndef f(x, y):\n    return x**2 + 16 * y**2\n\n\ndef grad(x, y):\n    return 2 * x, 32 * y\n\n\ndef chay(ten, buoc):\n    x, y = 1.0, 1.0\n    G = [0.0, 0.0]\n    for _ in range(3):\n        g = grad(x, y)\n        x, y, G = buoc((x, y), g, G)\n    print(f\"{ten}: x={round(x, 4)} y={round(y, 4)} f={round(f(x, y), 4)}\")\n\n\ndef sgd(w, g, G):\n    return w[0] - 0.03 * g[0], w[1] - 0.03 * g[1], G\n\n\ndef adagrad(w, g, G):\n    G = [G[0] + g[0] ** 2, G[1] + g[1] ** 2]\n    return (w[0] - 0.1 * g[0] / (math.sqrt(G[0]) + 1e-8), w[1] - 0.1 * g[1] / (math.sqrt(G[1]) + 1e-8), G)\n\n\ndef rmsprop(w, g, s):\n    s = [0.9 * s[0] + 0.1 * g[0] ** 2, 0.9 * s[1] + 0.1 * g[1] ** 2]\n    return (w[0] - 0.1 * g[0] / (math.sqrt(s[0]) + 1e-8), w[1] - 0.1 * g[1] / (math.sqrt(s[1]) + 1e-8), s)\n\n\nchay(\"SGD\", sgd)\nchay(\"Adagrad\", adagrad)\nchay(\"RMSprop\", rmsprop)\ng0 = grad(1.0, 1.0)\nprint(\"buoc dau Adagrad moi toa do:\", round(0.1 * g0[0] / (math.sqrt(g0[0] ** 2) + 1e-8), 4))\n"
    expect_stdout: 'SGD: x=0.8306 y=0.0001 f=0.6899

      Adagrad: x=0.7805 y=0.7805 f=10.3549

      RMSprop: x=0.3692 y=0.3692 f=2.317

      buoc dau Adagrad moi toa do: 0.1

      '
    claims:
    - 'Kết quả mong đợi (mong_doi.txt): mọi dòng hiện nguyên văn trên màn hình'
  LAB_L11:
    lang: python
    reason: lời giải thật của lab labs/CS115/L11 (lab_gate chạy lại qua labs/cham.sh); đầu ra là khối 'Kết quả mong đợi' hiện trên màn hình
