      Khop vong lap: true'
    code: "import java.util.List;\nimport java.util.Map;\nimport java.util.TreeMap;\nimport java.util.stream.Collectors;\n\npublic class ThongKeStream {\n    record GiaoDich(int ma, String loai, long soTien) {}\n\n    public static void main(String[] args) {\n        List<GiaoDich> ds = List.of(\n                new GiaoDich(1, \"nap\", 3000000), new GiaoDich(2, \"rut\", 450000),\n                new GiaoDich(3, \"chuyen\", 800000), new GiaoDich(4, \"rut\", 1200000),\n                new GiaoDich(5, \"nap\", 200000), new GiaoDich(6, \"chuyen\", 1500000),\n                new GiaoDich(7, \"rut\", 500000), new GiaoDich(8, \"nap\", 650000));\n        long rutLon = ds.stream().filter(g -> g.loai().equals(\"rut\") && g.soTien() >= 500000)\n                .mapToLong(GiaoDich::soTien).sum();\n        Map<String, Long> dem = ds.stream().collect(\n                Collectors.groupingBy(GiaoDich::loai, TreeMap::new, Collectors.counting()));\n        Map<String, Long> tong = ds.stream().collect(\n                Collectors.groupingBy(GiaoDich::loai, TreeMap::new, Collectors.summingLong(GiaoDich::soTien)));\n        Map<String, Long> tongVong = new TreeMap<>();\n        for (GiaoDich g : ds) {\n            tongVong.merge(g.loai(), g.soTien(), Long::sum);\n        }\n        System.out.println(\"Rut tu 500000: \" + rutLon);\n        System.out.println(\"Dem: \" + dem);\n        System.out.println(\"Tong: \" + tong);\n        System.out.println(\"Khop vong lap: \" + tong.equals(tongVong));\n    }\n}"
  LAB_L04:
    lang: java
    java_class: MiniDiKho
    java_release: 21
    expect_stdout: 'Tong gia tri kho: 540000

      Cung mot BangGia: true

      So thanh phan: 3'
    code: "import java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\nimport java.lang.reflect.Field;\nimport java.util.HashMap;\nimport java.util.Map;\n\npublic class MiniDiKho {\n    @Retention(RetentionPolicy.RUNTIME) @interface ThanhPhan {}\n    @Retention(RetentionPolicy.RUNTIME) @interface Tiem {}\n\n    @ThanhPhan static class KhoHang { int soLuong() { return 12; } }\n    @ThanhPhan static class BangGia { long gia() { return 45000; } }\n    @ThanhPhan static class DonHang {\n        @Tiem KhoHang kho;\n        @Tiem BangGia bang;\n        long tong() { return kho.soLuong() * bang.gia(); }\n    }\n\n    static Map<Class<?>, Object> hop = new HashMap<>();\n\n    static Object lay(Class<?> loai) throws Exception {\n        if (hop.containsKey(loai)) {\n            return hop.get(loai);\n        }\n        Object o = loai.getDeclaredConstructor().newInstance();\n        hop.put(loai, o);\n        for (Field f : loai.getDeclaredFields()) {\n            if (f.isAnnotationPresent(Tiem.class)) {\n                f.setAccessible(true);\n                f.set(o, lay(f.getType()));\n            }\n        }\n        return o;\n    }\n\n    public static void main(String[] args) throws Exception {\n        DonHang d = (DonHang) lay(DonHang.class);\n        System.out.println(\"Tong gia tri kho: \" + d.tong());\n        System.out.println(\"Cung mot BangGia: \" + (d.bang == lay(BangGia.class)));\n        System.out.println(\"So thanh phan: \" + hop.size());\n    }\n}"
  LAB_L05:
    lang: java
