        package soc;

        import java.util.Map;
        import java.util.TreeMap;

        public class TongHop {
            public final Map<String, Long> soDu = new TreeMap<>();
            public long nap, rut;

            public void them(GiaoDich g) {
                soDu.merge(g.taiKhoan(), g.dau(), Long::sum);
                if (g.loai().equals("nap")) {
                    nap += g.soTien();
                } else {
                    rut += g.soTien();
                }
            }
        }
