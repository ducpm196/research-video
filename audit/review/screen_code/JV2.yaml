                List<GiaoDich> ds = new ArrayList<>();
                int loi = DocSoCai.duyet(Path.of(args[0]), ds::add);
                System.out.println("Doc " + (ds.size() + loi) + " dong: " + ds.size() + " hop le, " + loi + " loi");
                Map<String, Long> soDu = BaoCao.soDu(ds);
