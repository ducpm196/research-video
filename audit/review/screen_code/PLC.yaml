  "PLC L02 sym 0 0":
    sha: 85664f702e282399
    kind: other
    lang: ebnf
    reason: "văn phạm dạng BNF mở rộng, không phải mã chạy được"
    read_check: >-
      Đọc theo ký pháp của W3C XML 1.0 (Fifth Edition, W3C Recommendation 26-11-2008) §6 Notation: `::=` định nghĩa luật,
      `|` là hoặc, `( … )*` là lặp không hay nhiều lần, chữ trong nháy là ký hiệu cuối — khớp lời giải thích trên màn hình.
      Ba tầng expr → term → atom: + − ở expr, * / ở term, atom = SO | TEN | "(" expr ")"; nhân nằm dưới cộng nên gắn chặt hơn.
      Tính đúng của văn phạm với hai câu quiz (2*3+4*5 → (+ (* 2 3) (* 4 5)) = 26; 2*(3+4) → (* 2 (+ 3 4)) = 14) được kiểm bằng
      mục run của "PLC L02 code 0 0" (bộ phân tích viết theo đúng ba luật này).
  "PLC L02 code 0 0":
    sha: 97295d082d3f993a
    kind: run
    lang: python
    claims:
      - "quiz câu 1: 2*3+4*5 → (+ (* 2 3) (* 4 5)) = 6 + 20 = 26"
      - "quiz câu 2: 2*(3+4) → (* 2 (+ 3 4)) = 2 × 7 = 14"
      - "cảnh prereq: 1+2*3 = 7; (1+2)*3 = 9"
    prelude: |
      import re
      _tt, _p = [], 0
      def phan_tich(s):
          global _tt, _p
          _tt, _p = re.findall(r"\d+|[A-Za-z_]\w*|[-+*/()]", s), 0
          return expr()
      def peek():
          return _tt[_p] if _p < len(_tt) else None
      def eat():
          global _p
          _p += 1
          return _tt[_p - 1]
      def term():
          v = atom()
          while peek() in ("*", "/"):
              op = eat(); v = (op, v, atom())
          return v
      def atom():
          t = eat()
          if t == "(":
              v = expr()
              assert eat() == ")"
              return v
          return int(t) if t.isdigit() else t
    prelude_reason: >-
      Cùng khung màn hình nói bằng chữ: "peek() nhìn từ tố kế tiếp, eat() lấy nó đi. term() viết y hệt với * và /; atom() lấy số,
      tên, hoặc gặp ( thì gọi lại expr()"; văn phạm ba tầng ở cảnh sym; bộ cắt từ tố là của bài 1. Prelude viết đúng các hàm đó,
      term là bản sao của expr đổi + − thành * /.
    post: |
      def ve(t):
          return f"({t[0]} {ve(t[1])} {ve(t[2])})" if isinstance(t, tuple) else str(t)
      def tinh(t):
          if not isinstance(t, tuple):
              return t
          a, b = tinh(t[1]), tinh(t[2])
          return {"+": a + b, "-": a - b, "*": a * b, "/": a / b}[t[0]]
      c1 = phan_tich("2*3+4*5"); assert ve(c1) == "(+ (* 2 3) (* 4 5))" and tinh(c1) == 26, ve(c1)
      c2 = phan_tich("2*(3+4)"); assert ve(c2) == "(* 2 (+ 3 4))" and tinh(c2) == 14, ve(c2)
      assert tinh(phan_tich("1+2*3")) == 7 and tinh(phan_tich("(1+2)*3")) == 9
    unverified_claims:
      - "các con số quiz (26, 14) và cảnh prereq (7, 9) phụ thuộc term()/atom()/peek()/eat() mà màn hình chỉ tả bằng lời; prelude là bản người điền sổ viết theo lời tả, nên phần này là bản đối chiếu, độ trung thực = INFERRED. Riêng expr() (5 dòng hiện trên màn hình) được chạy NGUYÊN VĂN (kiểm độc lập SC1 phần A: CHE)"
