  "PLC L11 example 0 0":
    sha: 407bb392e7432966
    kind: run
    lang: python
    claims:
      - "bảng bước 2: trước tối ưu 1000 lần lặp × 1 = 1000 phép nhân k * h"
      - "sau khi đưa t = k * h lên trước vòng lặp: 1 phép; bớt 1000 − 1 = 999; kết quả không đổi"
    prelude: |
      class _So:
          dem = 0
          def __init__(self, v):
              self.v = v
          def __mul__(self, o):
              _So.dem += 1
              return self.v * o
      k, h = _So(2), 5
      a = list(range(1000))
      s = 0
    prelude_reason: "bài nói vòng lặp cộng a[i] * (k * h) với k, h không đổi, không cho giá trị; prelude cho mảng a 1000 phần tử, s = 0, và k là số đếm số lần bị nhân"
    post: |
      assert _So.dem == 1000
      _So.dem = 0
      t = k * h
      s2 = 0
      for i in range(1000):
          s2 += a[i] * t
      assert _So.dem == 1 and s2 == s and 1000 - 1 == 999
    note: "Bản sau tối ưu (t = k * h; a[i] * t) chỉ hiện nội dòng; post chạy nó để kiểm \"1 phép\" và \"không đổi kết quả\"."
