      assert phi(10) == 50
      assert 10 * don_gia == 60
    note: "Sửa 2026-11-10 (SC1 nhóm 1): thêm dòng `from functools import lru_cache` (bản cũ NameError: lru_cache). Bản sửa phi(10, 6) = 60 chỉ hiện nội dòng; checks của cảnh chạy nó."
sources:
  L02_sau_doi_chieu:
    lang: python
    twin_of: "PLC L02 prereq 1 0"
    reason: "dịch sát từng dòng mã giả: \"s bắt đầu bằng (\" → s.startswith(\"(\"); \"phần bên trong\" → s[1:-1]"
    code: |
      def sau(s):
          if s.startswith("("): return 1 + sau(s[1:-1])
          return 0
    post: |
      assert [sau("((7))"), sau("(7)"), sau("7")] == [2, 1, 0]
  L03_tong_doi_chieu:
    lang: python
    twin_of: "PLC L03 prereq 1 0"
    reason: "dịch sát dòng mã giả \"0 nếu n = 0, còn không thì n + tong(n − 1)\""
    code: |
      def tong(n):
          return 0 if n == 0 else n + tong(n - 1)
    post: |
      assert [tong(3), tong(2), tong(1), tong(0)] == [6, 3, 1, 0]
  L03_eval_doi_chieu:
    lang: python
    twin_of: "PLC L03 example 0 0"
    reason: "dịch sát 4 dòng mã giả; cây viết (phép, con trái, con phải); thêm danh sách thu thứ tự trả về để kiểm duyệt sau"
    code: |
      thu_tu = []
      def eval(n):
          if not isinstance(n, tuple): thu_tu.append(n); return n
          a = eval(n[1]); b = eval(n[2])
          r = {"+": a + b, "-": a - b, "*": a * b, "/": a / b}[n[0]]
          thu_tu.append(r)
          return r
    post: |
      assert eval(("-", ("-", 8, 3), 2)) == 3
      assert thu_tu == [8, 3, 5, 2, 3]
  L05_doi_tuong_minh:
    lang: python
    reason: "dòng 2 của khối PLC L05 example 2 0 (khối dừng ở dòng 1 nên dòng 2 không chạy trong mục run của khối); đọc NGUYÊN VĂN dòng 2 từ văn bản đã ghim của khối (files) rồi exec — không chép tay (kiểm độc lập SC1 phần A: bản trước chép tay, không gắn sha)"
    files: {khoi.txt: "PLC L05 example 2 0"}
    code: |
      dong = open("khoi.txt", encoding="utf-8").read().strip("\n").split("\n")
      assert len(dong) == 2 and dong[1].startswith('x = "3" + str(1)')
      exec(dong[1])
    post: |
      assert x == "31"
  L10_gen_doi_chieu:
    lang: python
    twin_of: "PLC L10 gen 0 0"
    reason: "dịch sát 3 dòng mã giả: \"phát\" → thêm vào danh sách lệnh; tên lệnh theo bảng của bài (add, sub, mul)"
    code: |
      ma = []
      def gen(n):
          if not isinstance(n, tuple): ma.append(("push", n))
          else: gen(n[1]); gen(n[2]); ma.append(({"+": "add", "-": "sub", "*": "mul"}[n[0]],))
    post: |
      gen(("+", 1, ("*", 2, 3)))
      assert ma == [("push", 1), ("push", 2), ("push", 3), ("mul",), ("add",)]
      ma = []
      gen(("*", ("-", 8, 3), 2))
      assert ma == [("push", 8), ("push", 3), ("sub",), ("push", 2), ("mul",)]
