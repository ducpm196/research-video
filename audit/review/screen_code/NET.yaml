  NET L03 example 0 0:
    sha: d996c16d14b7bd60
    kind: other
    lang: text
    reason: phép chia CRC viết tay (dời từng hàng, XOR), không phải mã; src:NET:L03_crc
      đọc NGUYÊN VĂN khối, kiểm vị trí đặt 1011 dưới bit 1 đầu tiên, từng hàng kết
      quả, số bước và phần dư
    read_check: 'Đối chiếu cách tính CRC bằng phép chia đa thức trên GF(2) (Kurose
      & Ross, Computer Networking: A Top-Down Approach, mục 6.2.3 — theo hiểu biết,
      chưa mở sách trong phiên). Tính bằng máy: src:NET:L03_crc.'
    claims:
    - 'bước 0: nối 3 số 0; 3 bước XOR hiện ra; “… còn 6 bước XOR nữa …” (lời đọc:
      “Sau 9 lần XOR”); phần dư = 100'
    - 'bước 1: chuỗi gửi đi 14 + 3 = 17 bit'
    - 'bước 3: 3/17 ≈ 17,6 %; 4/1518 ≈ 0,26 %'
