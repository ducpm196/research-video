sources:
  L03_crc:
    lang: python
    reason: "đọc NGUYÊN VĂN bốn khối CRC của NET L03 và tính lại bằng XOR trên chuỗi bit: kiểm chỗ đặt đa thức sinh (dưới bit 1 đầu tiên), từng hàng kết quả (bỏ số 0 đầu hoặc viết đủ độ dài), số bước bị lược (“còn 6 bước”, “thêm 7 lần”) và phần dư"
    files: {ex.txt: "NET L03 example 0 0", ver.txt: "NET L03 verify 1 0", q1.txt: "NET L03 quiz 1 0", q2.txt: "NET L03 quiz 2 0"}
    code: |
      import re
      def xor_at(cur, g, col):
          assert "1" not in cur[:col] and cur[col] == "1", (cur, col)        # đặt g dưới bit 1 ĐẦU TIÊN
          return cur[:col] + "".join("01"[a != b] for a, b in zip(cur[col:col + len(g)], g)) + cur[col + len(g):]
      def first1(cur, r):
          i = cur.find("1")
          return i if 0 <= i < len(cur) - r else None
      def finish(cur, g, steps, extra):
          r = len(g) - 1
          for _ in range(extra):
              cur = xor_at(cur, g, first1(cur, r)); steps += 1
          assert first1(cur, r) is None                                       # hết bit 1 ngoài r bit cuối: xong
          return cur, steps
      def aligned(fn, data, g, extra_word):
          """khối viết kiểu dời hàng: hàng đa thức sinh rồi hàng kết quả (đã bỏ số 0 đầu)"""
          L = [l for l in open(fn, encoding="utf-8").read().split("\n") if l.strip()]
          r = len(g) - 1
          m = re.fullmatch(r"([01]+)  \(nối (\d) số 0\)", L[0]); assert m and m.group(1) == data + "0" * r and int(m.group(2)) == r
          cur, steps, i = m.group(1), 0, 1
          while i < len(L) and re.fullmatch(r" *" + g + r"  \(XOR bước \d+\)", L[i]):
              col = len(L[i]) - len(L[i].lstrip())
              steps += 1
              assert int(re.search(r"bước (\d+)", L[i]).group(1)) == steps
              cur = xor_at(cur, g, col)
              res = L[i + 1]; c2 = len(res) - len(res.lstrip())
              assert set(cur[:c2]) <= {"0"} and cur[c2:] == res.strip() and res.strip()[0] == "1", (cur, res)
              i += 2
          extra = 0
          if i < len(L) and extra_word in L[i]:
              extra = int(re.search(r"(\d+)", L[i]).group(1)); i += 1
          cur, steps = finish(cur, g, steps, extra)
          rem = re.fullmatch(r"phần dư = ([01]+)", L[i]).group(1)
          assert rem == cur[-r:] and i == len(L) - 1
          return rem, steps
      def full(fn, sent, g, extra_word, tail):
          """khối viết đủ độ dài: mỗi hàng = cả chuỗi sau một lần XOR ở bit thứ k"""
          L = [l for l in open(fn, encoding="utf-8").read().split("\n") if l.strip()]
          r = len(g) - 1
          cur = re.match(r"([01]+)  \(", L[0]).group(1); assert cur == sent
          steps, i = 0, 1
          while i < len(L) and re.fullmatch(r"[01]+  \(XOR ở bit thứ \d+\)", L[i]):
              bits, k = re.fullmatch(r"([01]+)  \(XOR ở bit thứ (\d+)\)", L[i]).groups()
              cur = xor_at(cur, g, int(k) - 1); steps += 1
              assert bits == cur, (bits, cur)
              i += 1
          extra = 0
          if extra_word in L[i]:
              extra = int(re.search(r"(\d+)", L[i]).group(1)); i += 1
          cur, steps = finish(cur, g, steps, extra)
          m = re.fullmatch(r"([01]+) → phần dư ([01]+)" + tail, L[i])
          if m:
              assert m.group(1) == cur
              rem = m.group(2)
          else:
              rem = re.fullmatch(r"phần dư ([01]+)" + tail, L[i]).group(1)
          assert rem == cur[-r:] == "0" * r and i == len(L) - 1
          return rem, steps
      D, G = "11010011101100", "1011"
      rem, n = aligned("ex.txt", D, G, "còn")
      assert rem == "100" and n == 9 and len(D) == 14 and len(D + rem) == 17
      assert round(100 * 3 / 17, 1) == 17.6 and round(100 * 4 / 1518, 2) == 0.26
      rem2, n2 = full("ver.txt", D + rem, G, "thêm", "")
      assert rem2 == "000" and n2 == 9
      def receiver_rem(s, g):
          cur, r = s, len(g) - 1
          while first1(cur, r) is not None:
              cur = xor_at(cur, g, first1(cur, r))
          return cur[-r:]
      flip = lambda s, js: "".join(("1" if c == "0" else "0") if j in js else c for j, c in enumerate(s))
      S = D + rem
      assert all(receiver_rem(flip(S, {j}), G) != "000" for j in range(17))
      assert receiver_rem(flip(S, {4}), G) == "111" and receiver_rem(flip(S, {0}), G) == "100" == receiver_rem(flip(S, {7}), G)
      assert receiver_rem(flip(S, {0, 7}), G) == "000"
      QD, QG = "101110", "1001"
      qrem, qn = aligned("q1.txt", QD, QG, "còn")
      assert qrem == "011" and qn == 4 and QD + qrem == "101110011"
      qrem2, qn2 = full("q2.txt", QD + qrem, QG, "thêm", " → đúng")
      assert qrem2 == "000" and qn2 == 4 and len(QD + qrem) == 9 and round(100 * 3 / 9, 1) == 33.3
      print(rem, n, rem2, n2, qrem, qn, qrem2, qn2)
    expect_stdout: "100 9 000 9 011 4 000 4"
  L05_bits:
    lang: python
    reason: "đọc NGUYÊN VĂN khối NET L05 bits và tính lại phần mạng/phần máy của byte cuối với /26"
    files: {b.txt: "NET L05 bits 0 0"}
    code: |
      import ipaddress, re
      L = open("b.txt", encoding="utf-8").read().strip("\n").split("\n")
      n, a, b = re.fullmatch(r"(\d+) = ([01]+) ([01]+)", L[0]).groups()
      net_bits = 26 - 24
      assert int(a + b, 2) == int(n) == 77 and len(a) == net_bits and len(b) == 8 - net_bits
      a2, z, v1 = re.fullmatch(r"phần mạng ([01]+) → mạng con bắt đầu ở ([01]+) ([01]+) = (\d+)", L[1]).groups()[1:]
      assert a2 == a and set(z) == {"0"} and len(z) == 6 and int(a + z, 2) == int(v1) == 64
      a3, o, v2 = re.fullmatch(r"phần máy toàn 1 → ([01]+) ([01]+) = (\d+) \(quảng bá\)", L[2]).groups()
      assert a3 == a and set(o) == {"1"} and int(a + o, 2) == int(v2) == 127
      net = ipaddress.ip_network("192.168.10.64/26")
      assert ipaddress.ip_address("192.168.10.77") in net and str(net.broadcast_address) == "192.168.10.127"
      print(net, net.broadcast_address)
    expect_stdout: "192.168.10.64/26 192.168.10.127"
  L06_cidr:
    lang: python
    reason: "đọc NGUYÊN VĂN bốn khối nhị phân của NET L06 và tính lại: số viết nhị phân, sáu bit đầu chung, khớp mục /20, /21 và gom tuyến"
    files: {agg.txt: "NET L06 aggregate 0 0", e1.txt: "NET L06 example 1 0", e3.txt: "NET L06 example 3 0", pit.txt: "NET L06 pitfalls 1 0"}
    code: |
      import ipaddress, re
      def rows(fn):
          return [l for l in open(fn, encoding="utf-8").read().split("\n") if l.strip()]
      def nums(fn):
          out = []
          for l in rows(fn):
              n, a, b = re.fullmatch(r"(\d+) = ([01]{6}) ([01]{2})", l).groups()
              assert format(int(n), "08b") == a + b, l
              out.append((int(n), a))
          return out
      agg = nums("agg.txt")
      assert [n for n, _ in agg] == [16, 17, 18, 19] and len({a for _, a in agg}) == 1 and 16 + 6 == 22
      blocks = [ipaddress.ip_network(f"200.23.{i}.0/24") for i in range(16, 20)]
      assert list(ipaddress.collapse_addresses(blocks)) == [ipaddress.ip_network("200.23.16.0/22")]
      pit = nums("pit.txt")
      assert [n for n, _ in pit] == [17, 20] and pit[0][1] != pit[1][1]
      assert len(list(ipaddress.collapse_addresses(ipaddress.ip_network(f"200.23.{i}.0/24") for i in range(17, 21)))) > 1
      table = {"/20": ipaddress.ip_network("200.23.16.0/20"), "/21": ipaddress.ip_network("200.23.24.0/21")}
      def lookup(fn, ip, want):
          L = rows(fn)
          n, hi, lo = re.fullmatch(r"byte thứ ba (\d+) = ([01]{4}) ([01]{4})", L[0]).groups()
          assert int(n) == int(ip.split(".")[2]) and format(int(n), "08b") == hi + lo
          got = {}
          for l in L[1:]:
              pre, h, t, mark = re.fullmatch(r"mục (/\d+) đòi  = ([01]{4}) ([01_]{4})  (✓|không khớp)", l).groups()
              k = int(pre[1:]) - 16                                   # số bit của byte thứ ba thuộc tiền tố
              want_bits = format(int(str(table[pre].network_address).split(".")[2]), "08b")[:k]
              assert (h + t).rstrip("_") == want_bits and (h + t)[k:] == "_" * (8 - k), l
              hit = ipaddress.ip_address(ip) in table[pre]
              assert hit == (mark == "✓") == format(int(n), "08b").startswith(want_bits), l
              got[pre] = hit
          best = max((p for p in got if got[p]), key=lambda p: int(p[1:]))
          assert {"/21": "B", "/20": "A"}[best] == want
          return got
      assert lookup("e1.txt", "200.23.25.7", "B") == {"/20": True, "/21": True}
      assert lookup("e3.txt", "200.23.18.1", "A") == {"/20": True, "/21": False}
      assert format(18, "08b")[4] == "0"                                # bit thứ 5 của 18 là 0
      print("ok")
    expect_stdout: "ok"
  L07_ls:
    lang: python
    reason: "đọc NGUYÊN VĂN danh sách liên kết của NET L07, chạy thuật toán chốt đỉnh gần nhất (Dijkstra) từ S, ghi vết từng lần chốt; chặng kế tiếp lấy theo cây đường đi"
    files: {l.txt: "NET L07 example 0 0"}
    code: |
      import math, re
      t = open("l.txt", encoding="utf-8").read().strip()
      assert t.startswith("liên kết: ")
      E = [(a, b, int(w)) for a, b, w in re.findall(r"(\w)–(\w) (\d+)", t)]
      assert len(E) == 7 == t.count("–")
      g = {}
      for a, b, w in E:
          g.setdefault(a, {})[b] = w; g.setdefault(b, {})[a] = w
      d = {v: math.inf for v in g}; d["S"] = 0; par = {"S": None}
      done, order, snaps = set(), [], []
      while len(done) < len(g):
          u = min((v for v in g if v not in done), key=lambda v: (d[v], v))
          done.add(u); order.append((u, d[u]))
          for v, w in g[u].items():
              if v not in done and d[u] + w < d[v]:
                  d[v], par[v] = d[u] + w, u
          snaps.append({v: d[v] for v in "ABCD"})
      assert order == [("S", 0), ("B", 1), ("A", 3), ("C", 4), ("D", 7)]
      assert snaps[0] == {"A": 4, "B": 1, "C": math.inf, "D": math.inf}
      assert snaps[1] == {"A": 3, "B": 1, "C": 6, "D": 9} and snaps[2]["C"] == 4 and snaps[3]["D"] == 7
      def path(v):
          p = []
          while v: p.append(v); v = par[v]
          return p[::-1]
      hops = {v: path(v)[1] for v in "ABCD"}
      assert hops == {"A": "B", "B": "B", "C": "B", "D": "B"}
      assert path("D") == ["S", "B", "A", "C", "D"]
      # Bước 5 "Khi B nhận gói tới D, nó tự gửi tiếp qua A rồi C": B tự chạy cùng thuật toán trên CÙNG bản đồ
      # (kiểm độc lập SC1 phần B: bản trước chỉ đọc cây của S — lỏng)
      dB = {v: math.inf for v in g}; dB["B"] = 0; pB = {"B": None}; doneB = set()
      while len(doneB) < len(g):
          u = min((v for v in g if v not in doneB), key=lambda v: (dB[v], v))
          doneB.add(u)
          for v, w in g[u].items():
              if v not in doneB and dB[u] + w < dB[v]:
                  dB[v], pB[v] = dB[u] + w, u
      pathB, v = [], "D"
      while v: pathB.append(v); v = pB[v]
      assert pathB[::-1] == ["B", "A", "C", "D"] and dB["D"] == 6
      print([d[v] for v in "ABCD"], hops)
    expect_stdout: "[3, 1, 4, 7] {'A': 'B', 'B': 'B', 'C': 'B', 'D': 'B'}"
