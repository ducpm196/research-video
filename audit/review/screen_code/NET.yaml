course: NET
sources:
  L03_crc:
    lang: python
    reason: 'đọc NGUYÊN VĂN bốn khối CRC của NET L03 và tính lại bằng XOR trên chuỗi
      bit: kiểm chỗ đặt đa thức sinh (dưới bit 1 đầu tiên), từng hàng kết quả (bỏ
      số 0 đầu hoặc viết đủ độ dài), số bước bị lược (“còn 6 bước”, “thêm 7 lần”)
      và phần dư'
    files:
      ex.txt: NET L03 example 0 0
      ver.txt: NET L03 verify 1 0
      q1.txt: NET L03 quiz 1 0
      q2.txt: NET L03 quiz 2 0
    code: "import re\ndef xor_at(cur, g, col):\n    assert \"1\" not in cur[:col]\
      \ and cur[col] == \"1\", (cur, col)        # đặt g dưới bit 1 ĐẦU TIÊN\n   \
      \ return cur[:col] + \"\".join(\"01\"[a != b] for a, b in zip(cur[col:col +\
      \ len(g)], g)) + cur[col + len(g):]\ndef first1(cur, r):\n    i = cur.find(\"\
      1\")\n    return i if 0 <= i < len(cur) - r else None\ndef finish(cur, g, steps,\
      \ extra):\n    r = len(g) - 1\n    for _ in range(extra):\n        cur = xor_at(cur,\
      \ g, first1(cur, r)); steps += 1\n    assert first1(cur, r) is None        \
      \                               # hết bit 1 ngoài r bit cuối: xong\n    return\
      \ cur, steps\ndef aligned(fn, data, g, extra_word):\n    \"\"\"khối viết kiểu\
      \ dời hàng: hàng đa thức sinh rồi hàng kết quả (đã bỏ số 0 đầu)\"\"\"\n    L\
      \ = [l for l in open(fn, encoding=\"utf-8\").read().split(\"\\n\") if l.strip()]\n\
      \    r = len(g) - 1\n    m = re.fullmatch(r\"([01]+)  \\(nối (\\d) số 0\\)\"\
      , L[0]); assert m and m.group(1) == data + \"0\" * r and int(m.group(2)) ==\
      \ r\n    cur, steps, i = m.group(1), 0, 1\n    while i < len(L) and re.fullmatch(r\"\
      \ *\" + g + r\"  \\(XOR bước \\d+\\)\", L[i]):\n        col = len(L[i]) - len(L[i].lstrip())\n\
      \        steps += 1\n        assert int(re.search(r\"bước (\\d+)\", L[i]).group(1))\
      \ == steps\n        cur = xor_at(cur, g, col)\n        res = L[i + 1]; c2 =\
      \ len(res) - len(res.lstrip())\n        assert set(cur[:c2]) <= {\"0\"} and\
      \ cur[c2:] == res.strip() and res.strip()[0] == \"1\", (cur, res)\n        i\
      \ += 2\n    extra = 0\n    if i < len(L) and extra_word in L[i]:\n        extra\
      \ = int(re.search(r\"(\\d+)\", L[i]).group(1)); i += 1\n    cur, steps = finish(cur,\
      \ g, steps, extra)\n    rem = re.fullmatch(r\"phần dư = ([01]+)\", L[i]).group(1)\n\
      \    assert rem == cur[-r:] and i == len(L) - 1\n    return rem, steps\ndef\
      \ full(fn, sent, g, extra_word, tail):\n    \"\"\"khối viết đủ độ dài: mỗi hàng\
      \ = cả chuỗi sau một lần XOR ở bit thứ k\"\"\"\n    L = [l for l in open(fn,\
      \ encoding=\"utf-8\").read().split(\"\\n\") if l.strip()]\n    r = len(g) -\
      \ 1\n    cur = re.match(r\"([01]+)  \\(\", L[0]).group(1); assert cur == sent\n\
      \    steps, i = 0, 1\n    while i < len(L) and re.fullmatch(r\"[01]+  \\(XOR\
      \ ở bit thứ \\d+\\)\", L[i]):\n        bits, k = re.fullmatch(r\"([01]+)  \\\
      (XOR ở bit thứ (\\d+)\\)\", L[i]).groups()\n        cur = xor_at(cur, g, int(k)\
      \ - 1); steps += 1\n        assert bits == cur, (bits, cur)\n        i += 1\n\
      \    extra = 0\n    if extra_word in L[i]:\n        extra = int(re.search(r\"\
      (\\d+)\", L[i]).group(1)); i += 1\n    cur, steps = finish(cur, g, steps, extra)\n\
      \    m = re.fullmatch(r\"([01]+) → phần dư ([01]+)\" + tail, L[i])\n    if m:\n\
      \        assert m.group(1) == cur\n        rem = m.group(2)\n    else:\n   \
      \     rem = re.fullmatch(r\"phần dư ([01]+)\" + tail, L[i]).group(1)\n    assert\
      \ rem == cur[-r:] == \"0\" * r and i == len(L) - 1\n    return rem, steps\n\
      D, G = \"11010011101100\", \"1011\"\nrem, n = aligned(\"ex.txt\", D, G, \"còn\"\
      )\nassert rem == \"100\" and n == 9 and len(D) == 14 and len(D + rem) == 17\n\
      assert round(100 * 3 / 17, 1) == 17.6 and round(100 * 4 / 1518, 2) == 0.26\n\
      rem2, n2 = full(\"ver.txt\", D + rem, G, \"thêm\", \"\")\nassert rem2 == \"\
      000\" and n2 == 9\ndef receiver_rem(s, g):\n    cur, r = s, len(g) - 1\n   \
      \ while first1(cur, r) is not None:\n        cur = xor_at(cur, g, first1(cur,\
      \ r))\n    return cur[-r:]\nflip = lambda s, js: \"\".join((\"1\" if c == \"\
      0\" else \"0\") if j in js else c for j, c in enumerate(s))\nS = D + rem\nassert\
      \ all(receiver_rem(flip(S, {j}), G) != \"000\" for j in range(17))\nassert receiver_rem(flip(S,\
      \ {4}), G) == \"111\" and receiver_rem(flip(S, {0}), G) == \"100\" == receiver_rem(flip(S,\
      \ {7}), G)\nassert receiver_rem(flip(S, {0, 7}), G) == \"000\"\nQD, QG = \"\
      101110\", \"1001\"\nqrem, qn = aligned(\"q1.txt\", QD, QG, \"còn\")\nassert\
      \ qrem == \"011\" and qn == 4 and QD + qrem == \"101110011\"\nqrem2, qn2 = full(\"\
      q2.txt\", QD + qrem, QG, \"thêm\", \" → đúng\")\nassert qrem2 == \"000\" and\
      \ qn2 == 4 and len(QD + qrem) == 9 and round(100 * 3 / 9, 1) == 33.3\nprint(rem,\
      \ n, rem2, n2, qrem, qn, qrem2, qn2)\n"
    expect_stdout: 100 9 000 9 011 4 000 4
  L05_bits:
    lang: python
    reason: đọc NGUYÊN VĂN khối NET L05 bits và tính lại phần mạng/phần máy của byte
      cuối với /26
    files:
      b.txt: NET L05 bits 0 0
    code: 'import ipaddress, re

      L = open("b.txt", encoding="utf-8").read().strip("\n").split("\n")

      n, a, b = re.fullmatch(r"(\d+) = ([01]+) ([01]+)", L[0]).groups()

      net_bits = 26 - 24

      assert int(a + b, 2) == int(n) == 77 and len(a) == net_bits and len(b) == 8
      - net_bits

      a2, z, v1 = re.fullmatch(r"phần mạng ([01]+) → mạng con bắt đầu ở ([01]+) ([01]+)
      = (\d+)", L[1]).groups()[1:]

      assert a2 == a and set(z) == {"0"} and len(z) == 6 and int(a + z, 2) == int(v1)
      == 64

      a3, o, v2 = re.fullmatch(r"phần máy toàn 1 → ([01]+) ([01]+) = (\d+) \(quảng
      bá\)", L[2]).groups()

      assert a3 == a and set(o) == {"1"} and int(a + o, 2) == int(v2) == 127

      net = ipaddress.ip_network("192.168.10.64/26")

      assert ipaddress.ip_address("192.168.10.77") in net and str(net.broadcast_address)
      == "192.168.10.127"

      print(net, net.broadcast_address)

      '
    expect_stdout: 192.168.10.64/26 192.168.10.127
  L06_cidr:
    lang: python
    reason: 'đọc NGUYÊN VĂN bốn khối nhị phân của NET L06 và tính lại: số viết nhị
      phân, sáu bit đầu chung, khớp mục /20, /21 và gom tuyến'
    files:
      agg.txt: NET L06 aggregate 0 0
      e1.txt: NET L06 example 1 0
      e3.txt: NET L06 example 3 0
      pit.txt: NET L06 pitfalls 1 0
    code: "import ipaddress, re\ndef rows(fn):\n    return [l for l in open(fn, encoding=\"\
      utf-8\").read().split(\"\\n\") if l.strip()]\ndef nums(fn):\n    out = []\n\
      \    for l in rows(fn):\n        n, a, b = re.fullmatch(r\"(\\d+) = ([01]{6})\
      \ ([01]{2})\", l).groups()\n        assert format(int(n), \"08b\") == a + b,\
      \ l\n        out.append((int(n), a))\n    return out\nagg = nums(\"agg.txt\"\
      )\nassert [n for n, _ in agg] == [16, 17, 18, 19] and len({a for _, a in agg})\
      \ == 1 and 16 + 6 == 22\nblocks = [ipaddress.ip_network(f\"200.23.{i}.0/24\"\
      ) for i in range(16, 20)]\nassert list(ipaddress.collapse_addresses(blocks))\
      \ == [ipaddress.ip_network(\"200.23.16.0/22\")]\npit = nums(\"pit.txt\")\nassert\
      \ [n for n, _ in pit] == [17, 20] and pit[0][1] != pit[1][1]\nassert len(list(ipaddress.collapse_addresses(ipaddress.ip_network(f\"\
      200.23.{i}.0/24\") for i in range(17, 21)))) > 1\ntable = {\"/20\": ipaddress.ip_network(\"\
      200.23.16.0/20\"), \"/21\": ipaddress.ip_network(\"200.23.24.0/21\")}\ndef lookup(fn,\
      \ ip, want):\n    L = rows(fn)\n    n, hi, lo = re.fullmatch(r\"byte thứ ba\
      \ (\\d+) = ([01]{4}) ([01]{4})\", L[0]).groups()\n    assert int(n) == int(ip.split(\"\
      .\")[2]) and format(int(n), \"08b\") == hi + lo\n    got = {}\n    for l in\
      \ L[1:]:\n        pre, h, t, mark = re.fullmatch(r\"mục (/\\d+) đòi  = ([01]{4})\
      \ ([01_]{4})  (✓|không khớp)\", l).groups()\n        k = int(pre[1:]) - 16 \
      \                                  # số bit của byte thứ ba thuộc tiền tố\n\
      \        want_bits = format(int(str(table[pre].network_address).split(\".\"\
      )[2]), \"08b\")[:k]\n        assert (h + t).rstrip(\"_\") == want_bits and (h\
      \ + t)[k:] == \"_\" * (8 - k), l\n        hit = ipaddress.ip_address(ip) in\
      \ table[pre]\n        assert hit == (mark == \"✓\") == format(int(n), \"08b\"\
      ).startswith(want_bits), l\n        got[pre] = hit\n    best = max((p for p\
      \ in got if got[p]), key=lambda p: int(p[1:]))\n    assert {\"/21\": \"B\",\
      \ \"/20\": \"A\"}[best] == want\n    return got\nassert lookup(\"e1.txt\", \"\
      200.23.25.7\", \"B\") == {\"/20\": True, \"/21\": True}\nassert lookup(\"e3.txt\"\
      , \"200.23.18.1\", \"A\") == {\"/20\": True, \"/21\": False}\nassert format(18,\
      \ \"08b\")[4] == \"0\"                                # bit thứ 5 của 18 là\
      \ 0\nprint(\"ok\")\n"
    expect_stdout: ok
  L07_ls:
    lang: python
    reason: đọc NGUYÊN VĂN danh sách liên kết của NET L07, chạy thuật toán chốt đỉnh
      gần nhất (Dijkstra) từ S, ghi vết từng lần chốt; chặng kế tiếp lấy theo cây
      đường đi
    files:
      l.txt: NET L07 example 0 0
    code: "import math, re\nt = open(\"l.txt\", encoding=\"utf-8\").read().strip()\n\
      assert t.startswith(\"liên kết: \")\nE = [(a, b, int(w)) for a, b, w in re.findall(r\"\
      (\\w)–(\\w) (\\d+)\", t)]\nassert len(E) == 7 == t.count(\"–\")\ng = {}\nfor\
      \ a, b, w in E:\n    g.setdefault(a, {})[b] = w; g.setdefault(b, {})[a] = w\n\
      d = {v: math.inf for v in g}; d[\"S\"] = 0; par = {\"S\": None}\ndone, order,\
      \ snaps = set(), [], []\nwhile len(done) < len(g):\n    u = min((v for v in\
      \ g if v not in done), key=lambda v: (d[v], v))\n    done.add(u); order.append((u,\
      \ d[u]))\n    for v, w in g[u].items():\n        if v not in done and d[u] +\
      \ w < d[v]:\n            d[v], par[v] = d[u] + w, u\n    snaps.append({v: d[v]\
      \ for v in \"ABCD\"})\nassert order == [(\"S\", 0), (\"B\", 1), (\"A\", 3),\
      \ (\"C\", 4), (\"D\", 7)]\nassert snaps[0] == {\"A\": 4, \"B\": 1, \"C\": math.inf,\
      \ \"D\": math.inf}\nassert snaps[1] == {\"A\": 3, \"B\": 1, \"C\": 6, \"D\"\
      : 9} and snaps[2][\"C\"] == 4 and snaps[3][\"D\"] == 7\ndef path(v):\n    p\
      \ = []\n    while v: p.append(v); v = par[v]\n    return p[::-1]\nhops = {v:\
      \ path(v)[1] for v in \"ABCD\"}\nassert hops == {\"A\": \"B\", \"B\": \"B\"\
      , \"C\": \"B\", \"D\": \"B\"}\nassert path(\"D\") == [\"S\", \"B\", \"A\", \"\
      C\", \"D\"]\n# Bước 5 \"Khi B nhận gói tới D, nó tự gửi tiếp qua A rồi C\":\
      \ B tự chạy cùng thuật toán trên CÙNG bản đồ\n# (kiểm độc lập SC1 phần B: bản\
      \ trước chỉ đọc cây của S — lỏng)\ndB = {v: math.inf for v in g}; dB[\"B\"]\
      \ = 0; pB = {\"B\": None}; doneB = set()\nwhile len(doneB) < len(g):\n    u\
      \ = min((v for v in g if v not in doneB), key=lambda v: (dB[v], v))\n    doneB.add(u)\n\
      \    for v, w in g[u].items():\n        if v not in doneB and dB[u] + w < dB[v]:\n\
      \            dB[v], pB[v] = dB[u] + w, u\npathB, v = [], \"D\"\nwhile v: pathB.append(v);\
      \ v = pB[v]\nassert pathB[::-1] == [\"B\", \"A\", \"C\", \"D\"] and dB[\"D\"\
      ] == 6\nprint([d[v] for v in \"ABCD\"], hops)\n"
    expect_stdout: '[3, 1, 4, 7] {''A'': ''B'', ''B'': ''B'', ''C'': ''B'', ''D'':
      ''B''}'
