sources:
  L01_so:
    lang: python
    reason: "Đọc các con số trong khối SAR L01 example 0 0 (văn bản đã ghim) và tính lại dư địa, ngưỡng xem lại."
    files: {adr.txt: "SAR L01 example 0 0"}
    code: |
      import re
      t = open("adr.txt", encoding="utf-8").read()
      tai = int(re.search(r"Tải ghi dự kiến (\d+)/s", t).group(1))
      suc = int(re.search(r"đo được (\d+) ghi/s", t).group(1))
      du_dia = re.search(r"dư địa ghi khoảng ([\d,]+) lần", t).group(1)
      nguong = int(re.search(r"tải ghi vượt (\d+)/s \(một nửa sức chịu\)", t).group(1))
    post: |
      assert (tai, suc) == (300, 5000)
      assert du_dia == f"{suc / tai:.1f}".replace(".", ",") == "16,7"
      assert nguong == suc // 2 == 2500
      assert round(suc / 900, 1) == 5.6 and round(suc / 2600, 2) == 1.92
