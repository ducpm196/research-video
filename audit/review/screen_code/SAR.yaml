course: SAR
sources:
  L01_so:
    lang: python
    reason: Đọc các con số trong khối SAR L01 example 0 0 (văn bản đã ghim) và tính lại dư địa, ngưỡng xem lại.
    files:
      adr.txt: SAR L01 example 0 0
    code: 'import re

      t = open("adr.txt", encoding="utf-8").read()

      tai = int(re.search(r"Tải ghi dự kiến (\d+)/s", t).group(1))

      suc = int(re.search(r"đo được (\d+) ghi/s", t).group(1))

      du_dia = re.search(r"dư địa ghi khoảng ([\d,]+) lần", t).group(1)

      nguong = int(re.search(r"tải ghi vượt (\d+)/s \(một nửa sức chịu\)", t).group(1))

      '
    post: 'assert (tai, suc) == (300, 5000)

      assert du_dia == f"{suc / tai:.1f}".replace(".", ",") == "16,7"

      assert nguong == suc // 2 == 2500

      assert round(suc / 900, 1) == 5.6 and round(suc / 2600, 2) == 1.92

      '
blocks:
  SAR L01 example 0 0:
    sha: 434433adf0f7f9b4
    kind: other
    lang: adr-text
    reason: Bản ghi quyết định kiến trúc viết bằng văn xuôi tiếng Việt theo khuôn của bài; không phải mã của ngôn ngữ nào,
      không có trình kiểm.
    read_check: 'Đã đọc kiểm: các mục của khối (Bối cảnh, Quyết định, Lựa chọn khác, Hệ quả, Xem lại khi) khớp khuôn bốn mục
      bài tự nêu ở cảnh sym cùng bài (lời đọc: “Bối cảnh … Quyết định … Các lựa chọn khác … Hệ quả ghi được gì, mất gì, và
      khi nào nên xem lại”). Các con số trong khối (300/s, 5000 ghi/s, 16,7 lần, 2500/s) được nguồn src:SAR:L01_so đọc từ
      đúng văn bản đã ghim và tính lại. Không đối chiếu với một chuẩn ADR bên ngoài trong phiên này.'
    claims:
    - 'Hệ quả: dư địa ghi khoảng 16,7 lần (= 5000 / 300)'
    - 'Xem lại khi: tải ghi vượt 2500/s (một nửa sức chịu 5000)'
    unverified_claims:
    - “bản thử đo được 5000 ghi/s”, “bản đã thử không hỗ trợ giao dịch nhiều bảng” là số liệu/tình huống minh hoạ của ví dụ,
      không có phép đo thật để kiểm
