  SAR L01 example 0 0:
    sha: 434433adf0f7f9b4
    kind: other
    lang: adr-text
    reason: Bản ghi quyết định kiến trúc viết bằng văn xuôi tiếng Việt theo khuôn của bài; không phải mã của ngôn ngữ nào, không có trình kiểm.
    read_check: 'Đã đọc kiểm: các mục của khối (Bối cảnh, Quyết định, Lựa chọn khác, Hệ quả, Xem lại khi) khớp khuôn bốn mục bài tự nêu ở cảnh sym cùng bài (lời đọc: “Bối cảnh … Quyết định … Các lựa chọn khác … Hệ quả ghi được gì, mất gì, và khi nào nên xem lại”). Các con số trong khối (300/s, 5000 ghi/s, 16,7 lần, 2500/s) được nguồn src:SAR:L01_so đọc từ đúng văn bản đã ghim và tính lại. Không đối chiếu với một chuẩn ADR bên ngoài trong phiên này.'
    claims:
    - 'Hệ quả: dư địa ghi khoảng 16,7 lần (= 5000 / 300)'
    - 'Xem lại khi: tải ghi vượt 2500/s (một nửa sức chịu 5000)'
    unverified_claims:
    - “bản thử đo được 5000 ghi/s”, “bản đã thử không hỗ trợ giao dịch nhiều bảng” là số liệu/tình huống minh hoạ của ví dụ, không có phép đo thật để kiểm
