sources:
  L03_dinh_tuyen:
    lang: sqlite
    twin_of: ACB L03 symbol 0 0
    reason: >-
      Bản sqlite của phần SELECT (giữ nguyên CASE và LEFT JOIN … ON; bỏ CREATE STREAM … AS và EMIT CHANGES); bốn sự kiện
      thử: đã cài ứng dụng, chưa cài + 60 000, chưa cài + 20 000, chưa có hồ sơ + 70 000. Độ trung thực = INFERRED.
    prelude: |
      CREATE TABLE s_balance_events (account_no TEXT, amount INTEGER, balance INTEGER);
      CREATE TABLE t_customer_preferences (account_no TEXT PRIMARY KEY, phone_number TEXT, email TEXT, is_app_installed BOOLEAN);
      INSERT INTO s_balance_events VALUES ('A1', 10000, 1), ('A2', 60000, 1), ('A3', 20000, 1), ('A4', 70000, 1);
      INSERT INTO t_customer_preferences VALUES ('A1', '090', 'a1@x', TRUE), ('A2', '091', 'a2@x', FALSE), ('A3', '092', 'a3@x', FALSE);
    prelude_reason: "dữ liệu thử do người kiểm đặt cho bốn nhánh lời đọc nêu (bài không cho dữ liệu)"
    code: |
      SELECT e.account_no, p.phone_number,
        CASE WHEN p.is_app_installed = TRUE THEN 'OTT_PUSH'
             WHEN e.amount >= 50000 THEN 'SMS_BRANDNAME' ELSE 'EMAIL' END AS target_channel
      FROM s_balance_events e LEFT JOIN t_customer_preferences p
      ON e.account_no = p.account_no ORDER BY e.account_no;
    expect_stdout: "A1|090|OTT_PUSH\nA2|091|SMS_BRANDNAME\nA3|092|EMAIL\nA4|NULL|SMS_BRANDNAME"
  L04_khoa_lac_quan:
    lang: python
    twin_of: ACB L04 symbol 0 0
    reason: >-
      Câu UPDATE của khối chạy qua sqlite3 (chỉ đổi NOW() → :now và "transaction" trong nháy kép); dữ liệu theo bước 1–2
      của bài: last_access = 10:00:00.100, người mua 1 gửi lúc .120, người mua 2 lúc .125 với thời điểm cũ. INFERRED.
    code: |
      import sqlite3
      con = sqlite3.connect(':memory:')
      con.execute('CREATE TABLE "transaction" (order_id TEXT, channel TEXT, order_date TEXT, status TEXT, receive_cif TEXT, last_access TEXT)')
      con.execute("""INSERT INTO "transaction" VALUES ('HD1', 'APP', '2026-11-10', 'OPEN', NULL, '10:00:00.100')""")
      U = '''UPDATE "transaction"
      SET status = 'PROCESSING', receive_cif = :cif, last_access = :now
      WHERE order_id = :id AND channel = :ch AND order_date = :dt AND last_access = :old_ts;'''
      p = dict(id='HD1', ch='APP', dt='2026-11-10', old_ts='10:00:00.100')
      n1 = con.execute(U, dict(p, cif='CIF_MUA1', now='10:00:00.120')).rowcount
      n2 = con.execute(U, dict(p, cif='CIF_MUA2', now='10:00:00.125')).rowcount
      assert (n1, n2) == (1, 0), (n1, n2)
      assert con.execute('SELECT status, receive_cif, last_access FROM "transaction"').fetchone() == ('PROCESSING', 'CIF_MUA1', '10:00:00.120')
      assert 125 - 120 == 5
    no_claim_reason: "khẳng định bằng assert trong mã"
  L07_hmac:
    lang: python
    twin_of: ACB L07 symbol 0 0
    reason: >-
      HMAC-SHA256 trên thân JSON của khối (chép nguyên văn) với một khoá thử: bên nhận tính lại thì khớp; sửa số tiền thì
      không khớp. Khoá và mã là của người kiểm, không phải giá trị trên màn hình (bị cắt "4f5d6e7a..."). INFERRED.
    code: |
      import hmac, hashlib
      body = b'{"virtual_account": "888800123456", "order_id": "ORD_9999", "amount": 1000000, "currency": "VND"}'
      khoa = b'khoa-bi-mat-thu'
      gui = 'sha256=' + hmac.new(khoa, body, hashlib.sha256).hexdigest()
      nhan = 'sha256=' + hmac.new(khoa, body, hashlib.sha256).hexdigest()
      assert hmac.compare_digest(gui, nhan)
      sua = body.replace(b'1000000', b'9000000')
      assert not hmac.compare_digest(gui, 'sha256=' + hmac.new(khoa, sua, hashlib.sha256).hexdigest())
    no_claim_reason: "khẳng định bằng assert trong mã"
