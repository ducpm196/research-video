sources:
  L03_dinh_tuyen:
    lang: sqlite
    twin_of: ACB L03 symbol 1 0
    reason: >-
      Bản sqlite của phần SELECT (giữ nguyên CASE và LEFT JOIN … ON; bỏ CREATE STREAM … AS và EMIT CHANGES); bốn sự kiện
      thử: đã cài ứng dụng, chưa cài + 60 000, chưa cài + 20 000, chưa có hồ sơ + 70 000. Độ trung thực = INFERRED.
    prelude: |
      CREATE TABLE s_balance_events (account_no TEXT, amount INTEGER, balance INTEGER);
      CREATE TABLE t_customer_preferences (account_no TEXT PRIMARY KEY, phone_number TEXT, email TEXT, is_app_installed BOOLEAN);
      INSERT INTO s_balance_events VALUES ('A1', 10000, 1), ('A2', 60000, 1), ('A3', 20000, 1), ('A4', 70000, 1);
      INSERT INTO t_customer_preferences VALUES ('A1', '090', 'a1@x', TRUE), ('A2', '091', 'a2@x', FALSE), ('A3', '092', 'a3@x', FALSE);
    prelude_reason: "dữ liệu thử do người kiểm đặt cho bốn nhánh lời đọc nêu (bài không cho dữ liệu)"
    code: |
      SELECT e.account_no, p.phone_number,
        CASE WHEN p.is_app_installed = TRUE THEN 'OTT_PUSH'
             WHEN e.amount >= 50000 THEN 'SMS_BRANDNAME' ELSE 'EMAIL' END AS target_channel
      FROM s_balance_events e LEFT JOIN t_customer_preferences p
      ON e.account_no = p.account_no ORDER BY e.account_no;
    expect_stdout: "A1|090|OTT_PUSH\nA2|091|SMS_BRANDNAME\nA3|092|EMAIL\nA4|NULL|SMS_BRANDNAME"
  L04_khoa_lac_quan:
    lang: python
    twin_of: ACB L04 symbol 0 0
    reason: >-
      Câu UPDATE của khối chạy qua sqlite3 (chỉ đổi NOW() → :now và "transaction" trong nháy kép); dữ liệu theo bước 1–2
      của bài: last_access = 10:00:00.100, người mua 1 gửi lúc .120, người mua 2 lúc .125 với thời điểm cũ. INFERRED.
    code: |
      import sqlite3
      con = sqlite3.connect(':memory:')
      con.execute('CREATE TABLE "transaction" (order_id TEXT, channel TEXT, order_date TEXT, status TEXT, receive_cif TEXT, last_access TEXT)')
      con.execute("""INSERT INTO "transaction" VALUES ('HD1', 'APP', '2026-11-10', 'OPEN', NULL, '10:00:00.100')""")
      U = '''UPDATE "transaction"
      SET status = 'PROCESSING', receive_cif = :cif, last_access = :now
      WHERE order_id = :id AND channel = :ch AND order_date = :dt AND last_access = :old_ts;'''
      p = dict(id='HD1', ch='APP', dt='2026-11-10', old_ts='10:00:00.100')
      n1 = con.execute(U, dict(p, cif='CIF_MUA1', now='10:00:00.120')).rowcount
      n2 = con.execute(U, dict(p, cif='CIF_MUA2', now='10:00:00.125')).rowcount
      assert (n1, n2) == (1, 0), (n1, n2)
      assert con.execute('SELECT status, receive_cif, last_access FROM "transaction"').fetchone() == ('PROCESSING', 'CIF_MUA1', '10:00:00.120')
      assert 125 - 120 == 5
    no_claim_reason: "khẳng định bằng assert trong mã"
  L07_hmac:
    lang: python
    twin_of: ACB L07 symbol 1 0
    reason: >-
      HMAC-SHA256 trên thân JSON của khối (chép nguyên văn) với một khoá thử: bên nhận tính lại thì khớp; sửa số tiền thì
      không khớp. Khoá và mã là của người kiểm, không phải giá trị trên màn hình (bị cắt "4f5d6e7a..."). INFERRED.
    code: |
      import hmac, hashlib
      body = b'{"virtual_account": "888800123456", "order_id": "ORD_9999", "amount": 1000000, "currency": "VND"}'
      khoa = b'khoa-bi-mat-thu'
      gui = 'sha256=' + hmac.new(khoa, body, hashlib.sha256).hexdigest()
      nhan = 'sha256=' + hmac.new(khoa, body, hashlib.sha256).hexdigest()
      assert hmac.compare_digest(gui, nhan)
      sua = body.replace(b'1000000', b'9000000')
      assert not hmac.compare_digest(gui, 'sha256=' + hmac.new(khoa, sua, hashlib.sha256).hexdigest())
    no_claim_reason: "khẳng định bằng assert trong mã"
  # GEN-WP4-SRC begin
  L00_code:
    lang: python
    reason: >-
      Cảnh `code` của bài L00: các khối mã Python hiện trên màn hình ghép NGUYÊN VĂN theo thứ tự (mô phỏng, chạy thật bằng Python/sqlite3/hashlib/heapq của máy; hệ thống ngân hàng thật không chạy trên máy). Khối kết quả là đầu ra thật của chương trình này.
    code: |
      tps = 10000
      phut = tps * 60
      gio = phut * 60
      tong = 120 + 35
      print(phut, gio)
      print(tong, "ms")
      if tong < 200:
          print("duoi 200")
    expect_stdout: |
      600000 36000000
      155 ms
      duoi 200
    no_claim_reason: "đầu ra so với expect_stdout"
  LAB_L00:
    lang: python
    code: |
      tps = 4000
      phut = tps * 60
      gio = phut * 60
      tong = 90 + 40
      ttl = 2 * 45
      so_du = 3000000
      so_du = so_du - 1200000   # core da tru
      so_du = so_du + 1200000   # boi hoan khi doi tac bao chua nhan tien
      print("moi phut:", phut)
      print("moi gio:", gio)
      if tong < 200:
          print("toan trinh:", tong, "ms, duoi 200")
      else:
          print("toan trinh:", tong, "ms, vuot 200")
      print("ttl:", ttl, "giay =", ttl * 1000, "ms")
      print("so du sau boi hoan:", so_du)
    expect_stdout: |
      moi phut: 240000
      moi gio: 14400000
      toan trinh: 130 ms, duoi 200
      ttl: 90 giay = 90000 ms
      so du sau boi hoan: 3000000
    no_claim_reason: "đầu ra so với expect_stdout"
  L01_code:
    lang: python
    reason: >-
      Cảnh `code` của bài L01: các khối mã Python hiện trên màn hình ghép NGUYÊN VĂN theo thứ tự (mô phỏng, chạy thật bằng Python/sqlite3/hashlib/heapq của máy; hệ thống ngân hàng thật không chạy trên máy). Khối kết quả là đầu ra thật của chương trình này.
    code: |
      def ofs(app, opts, user, tid, tien):
          kv = "DEBIT.AMOUNT=" + tien
          return ",".join([app, opts, user, tid, kv])

      tin = ofs("FUNDS.TRANSFER", "ACTR/I/PROCESS",
                "INPUTTER/******/VN0010001", "", "5000000")
      print(tin)
      print(tin.split(",")[4])

      cho = {"c1": "chuyen 5tr", "c2": "chuyen 2tr"}
      tra_loi = [("c2", "OK"), ("c1", "LOI")]
      for cid, kq in tra_loi:
          print(cid, cho.pop(cid), "->", kq)
      print("con cho:", len(cho))
    expect_stdout: |
      FUNDS.TRANSFER,ACTR/I/PROCESS,INPUTTER/******/VN0010001,,DEBIT.AMOUNT=5000000
      DEBIT.AMOUNT=5000000
      c2 chuyen 2tr -> OK
      c1 chuyen 5tr -> LOI
      con cho: 0
    no_claim_reason: "đầu ra so với expect_stdout"
  LAB_L01:
    lang: python
    code: |
      truong = {"DEBIT.ACCT.NO": "5550001111", "CREDIT.ACCT.NO": "6660002222", "DEBIT.AMOUNT": "1250000"}
      kv = ",".join(k + "=" + v for k, v in truong.items())
      tin = ",".join(["FUNDS.TRANSFER", "ACTR/I/PROCESS", "INPUTTER/******/VN0010002", "", kv])
      dau, cap = tin.split(",,")
      print("ofs dau:", dau + ",,")
      print("ofs cap:", cap)
      print("so truong:", len(tin.split(",")[4:]))

      cho = {"a1": "2tr", "a2": "1tr", "a3": "7tr"}
      for cid, kq in [("a3", "OK"), ("a1", "OK"), ("a2", "LOI")]:
          print(cid, cho.pop(cid), "->", kq)
      print("con cho:", len(cho))

      tai, ms = 2000, 45
      print("dang cho:", tai * ms // 1000)
      moi_ket_noi = 1000 // ms
      print("ket noi tuan tu:", -(-tai // moi_ket_noi))
    expect_stdout: |
      ofs dau: FUNDS.TRANSFER,ACTR/I/PROCESS,INPUTTER/******/VN0010002,,
      ofs cap: DEBIT.ACCT.NO=5550001111,CREDIT.ACCT.NO=6660002222,DEBIT.AMOUNT=1250000
      so truong: 3
      a3 7tr -> OK
      a1 2tr -> OK
      a2 1tr -> LOI
      con cho: 0
      dang cho: 90
      ket noi tuan tu: 91
    no_claim_reason: "đầu ra so với expect_stdout"
  L02_code:
    lang: python
    reason: >-
      Cảnh `code` của bài L02: các khối mã Python hiện trên màn hình ghép NGUYÊN VĂN theo thứ tự (mô phỏng, chạy thật bằng Python/sqlite3/hashlib/heapq của máy; hệ thống ngân hàng thật không chạy trên máy). Khối kết quả là đầu ra thật của chương trình này.
    code: |
      def bando(truong):
          bits = 0
          for n in truong:
              bits = bits | (1 << (64 - n))
          return format(bits, "016X")

      print(bando([3, 4, 11, 37]))
      print(bando([2, 3, 4, 7]))

      ket = {}
      def dat(khoa, bay_gio, ttl):
          if khoa in ket and ket[khoa] > bay_gio:
              return False
          ket[khoa] = bay_gio + ttl
          return True

      for giay in (0, 20, 61):
          print(dat("123456:0001", giay, 60))

      def giaima(chuoi):
          bits = int(chuoi, 16)
          ds = []
          for n in range(1, 65):
              if (bits >> (64 - n)) & 1:
                  ds.append(n)
          return ds

      print(giaima("7200000000000000"))
    expect_stdout: |
      3020000008000000
      7200000000000000
      True
      False
      True
      [2, 3, 4, 7]
    no_claim_reason: "đầu ra so với expect_stdout"
  LAB_L02:
    lang: python
    code: |
      def bando(truong):
          bits = 0
          for n in truong:
              bits = bits | (1 << (64 - n))
          return format(bits, "016X")


      def giai_ma(hex16):
          v = int(hex16, 16)
          return [n for n in range(1, 65) if v >> (64 - n) & 1]


      print("bitmap A:", bando([3, 4, 11, 37, 41]))
      cac_truong = [3, 4, 11, 37, 128]
      chinh = [1] + [n for n in cac_truong if n <= 64]
      phu = [n - 64 for n in cac_truong if n > 64]
      print("bitmap B:", bando(chinh), bando(phu))
      print("giai ma:", giai_ma("5030000000000000"))

      ket = {}


      def dat(khoa, bay_gio, ttl):
          if khoa in ket and ket[khoa] > bay_gio:
              return False
          ket[khoa] = bay_gio + ttl
          return True


      ttl = 2 * 40
      for t, nhan in ((0, "khoa moi"), (30, "khoa trung"), (95, "het han")):
          print("t=" + str(t), nhan + ":", dat("654321:000000000007", t, ttl))
      print("dang cho:", 2400 * 150 // 1000)
    expect_stdout: |
      bitmap A: 3020000008800000
      bitmap B: B020000008000000 0000000000000001
      giai ma: [2, 4, 11, 12]
      t=0 khoa moi: True
      t=30 khoa trung: False
      t=95 het han: True
      dang cho: 360
    no_claim_reason: "đầu ra so với expect_stdout"
  L03_code:
    lang: python
    reason: >-
      Cảnh `code` của bài L03: các khối mã Python hiện trên màn hình ghép NGUYÊN VĂN theo thứ tự (mô phỏng, chạy thật bằng Python/sqlite3/hashlib/heapq của máy; hệ thống ngân hàng thật không chạy trên máy). Khối kết quả là đầu ra thật của chương trình này.
    code: |
      def kenh(co_app, tien):
          if co_app:
              return "OTT_PUSH"
          if tien >= 50000:
              return "SMS_BRANDNAME"
          return "EMAIL"
      for co_app, tien in [(True, 20000), (False, 80000), (False, 30000), (None, 80000)]:
          print(co_app, tien, kenh(co_app, tien))

      import heapq
      hang = []
      heapq.heappush(hang, (2, "quang cao"))
      heapq.heappush(hang, (1, "ma OTP"))
      heapq.heappush(hang, (2, "tin thuong"))
      while hang:
          print(heapq.heappop(hang))
    expect_stdout: |
      True 20000 OTT_PUSH
      False 80000 SMS_BRANDNAME
      False 30000 EMAIL
      None 80000 SMS_BRANDNAME
      (1, 'ma OTP')
      (2, 'quang cao')
      (2, 'tin thuong')
    no_claim_reason: "đầu ra so với expect_stdout"
  LAB_L03:
    lang: python
