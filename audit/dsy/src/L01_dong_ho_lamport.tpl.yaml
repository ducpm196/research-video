id: L01
course: DSY
series: "DSY · Hệ phân tán và dữ liệu lớn"
title: "Bài 1 — Mô hình hỏng hóc và đồng hồ lôgic Lamport"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsy.yaml L01; audit/dsy/verify_dsy.py L01; L. Lamport, Time, Clocks, and the Ordering of Events in a Distributed System, CACM 21(7), 1978; M. Kleppmann, Designing Data-Intensive Applications (2017), chương 8"
assumes: [arith, ltgt]
# Quy ước: tiến trình P1, P2, P3; sự kiện cục bộ, gửi, nhận. Luật Lamport: cục bộ và gửi: C ← C + 1 (gửi kèm C); nhận nhãn t: C ← max(C, t) + 1.
#   Nhãn trên hình do alg.lamport_run tính (audit/dsy/figs.py LAMPORT_EV). “a xảy ra trước b” (a → b) theo nghĩa của Lamport (1978).
objectives:
  - "Phân biệt các mô hình hỏng hóc"
  - "Hiểu vì sao không dùng giờ hệ thống để xếp thứ tự"
  - "Gán nhãn thời gian Lamport"
asr_reviewed:
  - {sentence: "Chuỗi kia, P2 cục bộ rồi P2 nhận, chỉ có 2, nên nhãn là 3, khớp.", reason: "ASR chép “Chủy kia, P2 cuộc bộ rồi P2 nhận, chỉ có 2, nên nhẳng là 3, khúp.” (0.778): lệch âm/thanh thuần Việt: chuỗi/chuỷ, cục/cuộc, nhãn/nhẳng, khớp/khúp — NOT_VERIFIED bằng tai người"}
  - {sentence: "P2 cũng có một sự kiện cục bộ, nhãn 1.", reason: "ASR chép “Thế 2 cũng có một sự kiện cục bộ nhãn một.” (0.909): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước bốn, P3 chưa có sự kiện nào, đồng hồ là 0.", reason: "ASR chép “Bước 4, về 3 chưa có sự kiện nào, đồng hồ là không?” (0.923): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, P2 đang ở 7, thông điệp mang nhãn 1, số lớn hơn giữa 7 và 1, cộng 1, bằng 8, vì đồng hồ không bao giờ lùi.", reason: "ASR chép “Câu 2, T2 đang ở 7, thông điệp mang nhãn 1, số lớn hơn giữa 7 và 1, cộng 1 bằng 8 vì đồng hồ không bao giờ lui.” (0.933): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: lùi/lui — NOT_VERIFIED bằng tai người"}
  - {sentence: "P2 chưa có sự kiện nào nên đồng hồ là 0, khi nhận m thì lấy số lớn hơn giữa 0 và 3, cộng 1, được 4.", reason: "ASR chép “T2 chưa có sự kiện nào nên đồng hồ là không, khi nhận m thì lấy số lớn hơn giữa 0 và 3, cộng 1 được 4.” (0.964): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đồng hồ của máy B chạy chậm 5 mi li giây, thông điệp tới sau 3 mi li giây, nên B ghi là nhận lúc 98 mi li giây.", reason: "ASR chép “5 mili giây … 3 mili giây, nên BG là nhận lúc 98 mili giây”: “mi li” được viết liền “mili” (đúng từ), “B ghi” bị viết dính thành “BG”; các số 5, 3, 98 chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hôm nay ta học các kiểu hỏng hóc, và cách xếp thứ tự sự kiện mà không cần đồng hồ chung, với đồng hồ lô-gic của Lamport.", reason: "ASR chép “hỏng hốc … các xếp thứ tự … đồng hồ logic của Lampa”: hóc/hốc, cách/các lệch thanh–âm cuối, “lô-gic” viết “logic” (đúng từ), Lamport đọc “Lam-po” theo lexicon (probe DSY p1 8/8) nhưng câu này chép “Lampa” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, P2 đã có 7 sự kiện với nhãn tới 7, rồi nhận một thông điệp mang nhãn 1.", reason: "ASR chép “T2 đã có 7 sự kiện”: tên chữ cái P (“pê”) nghe thành “tê”; mọi con số chép đúng, P2 hiện trên màn hình — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, P1 có hai sự kiện cục bộ rồi gửi m, P2 nhận m ở sự kiện đầu tiên rồi có một sự kiện cục bộ.", reason: "ASR chép “P1 có 2 sự kiện … T2 nhận m”: P1 chép đúng, P2 (“pê hai”) nghe thành “T2”; phần còn lại đúng (0,966) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nhận trước khi gửi?"
    checks:
      - "98 < 100"
    steps:
      - show: |
          <p>Máy A gửi thông điệp lúc đồng hồ của A chỉ 100 ms. Đồng hồ máy B chạy chậm 5 ms; thông điệp tới sau 3 ms, B ghi “nhận lúc 98 ms”. Theo nhật ký, thông điệp được <b>nhận trước khi gửi</b>.</p>
          <div class="box key">Hôm nay: các kiểu <b>hỏng hóc</b>, và cách xếp thứ tự sự kiện không cần đồng hồ chung — <b>đồng hồ lôgic Lamport</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, máy A gửi một thông điệp lúc đồng hồ của A chỉ 100 mi li giây. Đồng hồ của máy B chạy chậm 5 mi li giây, thông điệp tới sau 3 mi li giây, nên B ghi là nhận lúc 98 mi li giây. Theo nhật ký, thông điệp được nhận trước khi gửi. Hôm nay ta học các kiểu hỏng hóc, và cách xếp thứ tự sự kiện mà không cần đồng hồ chung, với đồng hồ lô-gic của Lamport."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: số lớn hơn, phép gán, và điều bài 0 đã cho thấy"
    checks:
      - "max(3, 5) == 5 and max(4, 4) == 4 and 4 + 1 == 5"
      - "round(1 - 0.999 ** 100, 3) == 0.095 and 150 / 0.5 == 300"
    steps:
      - show: |
          <table class="t"><tr><th>phép</th><th>đọc là</th><th>ví dụ</th></tr>
          <tr><td>$\max(a, b)$</td><td>số lớn hơn trong hai số</td><td>$\max(3, 5) = 5$; $\max(4, 4) = 4$</td></tr>
          <tr><td>$C \leftarrow C + 1$</td><td>gán: tính vế phải rồi ghi vào $C$</td><td>$C$ đang là 4 → sau phép gán $C$ là 5</td></tr></table>
        introduces: [max_fn, assign]
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Bài này dùng hai phép nhỏ. Thứ nhất, ký hiệu này đọc là số lớn hơn trong hai số a và b. Số lớn hơn giữa 3 và 5 là 5, còn giữa 4 và 4 là 4. Thứ hai, mũi tên chỉ sang trái, C nhận C cộng 1, là phép gán, tính vế phải rồi ghi kết quả vào C. Nếu C đang là 4 thì sau phép gán, C là 5."
      - show: |
          <table class="t"><tr><th>ở bài 0 ta đã thấy</th><th>con số</th></tr>
          <tr><td>nhiều máy thì hỏng một phần là chuyện thường</td><td>100 máy, mỗi máy hỏng 0,1% số ngày: ≈ 9,5% số ngày có máy hỏng</td></tr>
          <tr><td>thông điệp qua mạng tới sau một khoảng trễ</td><td>khứ hồi ≈ 0,5 ms trong một trung tâm dữ liệu, ≈ 150 ms xuyên lục địa</td></tr>
          <tr><td>mỗi máy một đồng hồ riêng</td><td>không có đồng hồ chung để so</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bài này cũng dựa vào ba điều đã thấy ở bài 0. Với nhiều máy, hỏng một phần là chuyện thường, 100 máy mỗi máy hỏng 0 phẩy 1 phần trăm số ngày thì khoảng 9 phẩy 5 phần trăm số ngày có máy hỏng. Thông điệp qua mạng luôn tới sau một khoảng trễ, khứ hồi khoảng nửa mi li giây trong một trung tâm dữ liệu và khoảng 150 mi li giây xuyên lục địa. Và mỗi máy có một đồng hồ riêng, không có đồng hồ chung để so."

  - id: models
    kind: concept
    title: "Mô hình hỏng hóc"
    steps:
      - show: |
          <table class="t"><tr><th>mô hình</th><th>nút làm gì khi hỏng</th></tr>
          <tr><td>dừng hẳn</td><td>ngừng mọi hoạt động, không quay lại</td></tr>
          <tr><td>dừng rồi chạy lại</td><td>ngừng, rồi khởi động lại (mất bộ nhớ, còn ổ đĩa)</td></tr>
          <tr><td>mất thông điệp</td><td>vẫn chạy nhưng thỉnh thoảng không gửi, không nhận được</td></tr>
          <tr><td>tuỳ tiện</td><td>gửi nội dung sai, thậm chí cố ý lừa (hiếm trong một tổ chức, thường gặp với máy lạ)</td></tr></table>
          <div class="box key">Qua mạng, nút <b>chậm</b> và nút <b>chết</b> trông giống hệt nhau: chỉ thấy “chưa có trả lời”. Hết giờ chờ chỉ là <b>đoán</b>.</div>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Người ta thường dùng bốn mô hình hỏng hóc của một nút. Dừng hẳn, nút ngừng mọi hoạt động và không quay lại. Dừng rồi chạy lại, nút ngừng rồi khởi động lại, mất bộ nhớ nhưng còn ổ đĩa. Mất thông điệp, nút vẫn chạy nhưng thỉnh thoảng không gửi hay không nhận được. Tuỳ tiện, nút gửi nội dung sai, thậm chí cố ý lừa, hiếm trong một tổ chức nhưng thường gặp với máy lạ. Qua mạng, nút chậm và nút chết trông giống hệt nhau, ta chỉ thấy chưa có trả lời. Hết giờ chờ chỉ là một phỏng đoán."

  # ───────────────────────── 3. LAMPORT ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: xảy ra trước, đồng hồ Lamport"
    checks:
      - "alg.lamport_run([('P1', 'send', 'm'), ('P2', 'local', None), ('P2', 'recv', 'm')]) == [1, 1, 2]"
    steps:
      - show: |
          <p><b>a xảy ra trước b</b> (a → b): a, b cùng tiến trình và a trước; hoặc a là gửi, b là nhận cùng thông điệp; hoặc nối được qua một chuỗi như vậy.</p>
          <p><b>Đồng hồ Lamport</b> — mỗi tiến trình một số đếm $C$:</p>
          <ol><li>sự kiện cục bộ hoặc gửi: $C \leftarrow C + 1$; gửi kèm $C$;</li><li>nhận thông điệp mang nhãn $t$: $C \leftarrow \max(C, t) + 1$.</li></ol>
          <p class="note">Ví dụ: P1 gửi ở nhãn 1; P2 đã có một sự kiện nhãn 1 → nhận ở $\max(1, 1) + 1 = \hl{2}$.</p>
        focus: [1, 1, 2, "3.1", "3.2", 4]
        say: "A xảy ra trước b khi a và b cùng một tiến trình và a đến trước. Hoặc a là gửi và b là nhận cùng một thông điệp, hoặc hai sự kiện nối được qua một chuỗi như vậy. Đồng hồ Lamport cho mỗi tiến trình một số đếm C. Với sự kiện cục bộ hoặc gửi, C tăng thêm 1, và khi gửi thì kèm theo C. Khi nhận thông điệp mang nhãn t, C thành số lớn hơn giữa C và t, cộng 1. Ví dụ P1 gửi ở nhãn 1, P2 đã có một sự kiện nhãn 1, nên P2 nhận ở nhãn 2."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Giờ máy có thể đảo thứ tự, nhãn đi kèm thông điệp thì không"
    checks:
      - "100 - 5 + 3 == 98 and max(2, 4) + 1 == 5"
      - "(lambda r: (r[3], r[6]))(alg.lamport_run([('P1', 'local', None)] * 3 + [('P1', 'send', 'm'), ('P2', 'local', None), ('P2', 'local', None), ('P2', 'recv', 'm')])) == (4, 5)"
    steps:
      - show: |
          <div><svg width="1500" height="480" viewBox="0 0 1500 480"><defs><marker id="ah1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#eb6834"/></marker></defs><g font-size="23" fill="#1f2937"><text x="30" y="35" font-weight="bold" fill="#2a78d6">giờ hệ thống của từng máy</text><text x="30" y="98" font-weight="bold">máy A</text><line x1="150" y1="90" x2="1080" y2="90" stroke="#6b7280" stroke-width="3"/><text x="30" y="188" font-weight="bold">máy B</text><line x1="150" y1="180" x2="1080" y2="180" stroke="#6b7280" stroke-width="3"/><circle cx="400" cy="90" r="9" fill="#2a78d6"/><text x="400" y="72" text-anchor="middle">gửi: đồng hồ A = 100 ms</text><line x1="400" y1="90" x2="616" y2="176" stroke="#eb6834" stroke-width="4" marker-end="url(#ah1)"/><circle cx="620" cy="180" r="9" fill="#2a78d6"/><text x="620" y="215" text-anchor="middle">nhận: đồng hồ B = 98 ms</text><text x="1110" y="125" fill="#b91c1c">nhật ký: nhận trước gửi</text><text x="1110" y="157" fill="#b91c1c">(98 ms ghi trước 100 ms)</text><text x="30" y="270" font-weight="bold" fill="#059669">đồng hồ Lamport: nhãn đi kèm thông điệp</text><text x="30" y="338" font-weight="bold">P1</text><line x1="150" y1="330" x2="1080" y2="330" stroke="#6b7280" stroke-width="3"/><text x="30" y="428" font-weight="bold">P2</text><line x1="150" y1="420" x2="1080" y2="420" stroke="#6b7280" stroke-width="3"/><circle cx="400" cy="330" r="9" fill="#2a78d6"/><text x="400" y="312" text-anchor="middle">C = 4, gửi kèm nhãn 4</text><circle cx="250" cy="420" r="9" fill="#6b7280"/><text x="250" y="455" text-anchor="middle">C = 2</text><line x1="400" y1="330" x2="616" y2="416" stroke="#eb6834" stroke-width="4" marker-end="url(#ah1)"/><circle cx="620" cy="420" r="9" fill="#059669"/><text x="640" y="455" text-anchor="middle">nhận: max(2, 4) + 1 = 5</text><text x="1110" y="365" fill="#059669">nhận mang nhãn 5, lớn hơn 4:</text><text x="1110" y="397" fill="#059669">luôn đúng thứ tự</text></g></svg></div>
        focus: [1, 1, 1, 1, 1, 1]
        say: "Nửa trên là ví dụ mở đầu, dùng giờ hệ thống của từng máy. A gửi lúc đồng hồ A chỉ 100 mi li giây, B nhận khi đồng hồ B chỉ 98, vì đồng hồ B chậm 5 mà thông điệp chỉ đi mất 3. Nhật ký vì vậy ghi việc nhận trước việc gửi. Nửa dưới là đồng hồ Lamport, mỗi tiến trình một số đếm, và số đếm của người gửi đi kèm theo thông điệp. P1 gửi ở nhãn 4, P2 đang ở 2, nên khi nhận, P2 lấy số lớn hơn giữa 2 và 4, cộng 1, được 5. Vì người nhận luôn nhảy qua nhãn của người gửi, việc nhận luôn mang nhãn lớn hơn việc gửi, dù đồng hồ thật lệch bao nhiêu."

  - id: example
    kind: example
    title: "Ba tiến trình, hai thông điệp"
    checks:
      - "alg.lamport_run([('P1', 'local', None), ('P1', 'send', 'm1'), ('P2', 'local', None), ('P2', 'recv', 'm1'), ('P2', 'send', 'm2'), ('P3', 'recv', 'm2'), ('P3', 'local', None)]) == [1, 2, 1, 3, 4, 5, 6]"
    steps:
      - show: |
          <div>{{LAMPORT}}</div>
          <p><b>Bước 1</b> — mọi đồng hồ bắt đầu từ 0. P1: cục bộ $0 + 1 = 1$, gửi m1: $1 + 1 = 2$ (kèm nhãn 2). P2: cục bộ $0 + 1 = 1$.</p>
        focus: [1, 2, 2, 2]
        say: "Trên hình, mũi tên cam là thông điệp, số trên mỗi chấm là nhãn Lamport. Bước một, mọi đồng hồ bắt đầu từ 0. P1 có một sự kiện cục bộ, nhãn 1, rồi gửi thông điệp m1 ở nhãn 2, và nhãn 2 đi kèm thông điệp. P2 cũng có một sự kiện cục bộ, nhãn 1."
      - show: |
          <p><b>Bước 2</b> — P2 nhận m1 (nhãn 2) khi đồng hồ P2 là 1: $\max(1, 2) + 1 = \hl{3}$.</p>
        say: "Bước hai, P2 nhận thông điệp của P1 mang nhãn 2 khi đồng hồ của P2 đang là 1, nên nhãn mới là 3."
      - show: |
          <p><b>Bước 3</b> — P2 gửi m2: $3 + 1 = 4$, kèm nhãn 4.</p>
        say: "Bước ba, P2 gửi thông điệp m2, đồng hồ tăng từ 3 lên 4, và nhãn 4 đi kèm thông điệp."
      - clear: true
        show: |
          <p><b>Bước 4</b> — P3 chưa có sự kiện nào (đồng hồ 0), nhận m2 mang nhãn 4: $\max(0, 4) + 1 = \hl{5}$; rồi cục bộ: $5 + 1 = 6$.</p>
          <table class="t"><tr><th>xếp theo nhãn (hoà thì theo số hiệu tiến trình)</th><th>1</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
          <tr><td>sự kiện</td><td>P1 cục bộ</td><td>P2 cục bộ</td><td>P1 gửi m1</td><td>P2 nhận m1</td><td>P2 gửi m2</td><td>P3 nhận m2</td><td>P3 cục bộ</td></tr></table>
          <div class="box key">Tính chất: nếu a → b thì $C(a) \lt C(b)$. Xếp mọi sự kiện theo nhãn (hoà thì theo số hiệu tiến trình) cho một <b>thứ tự toàn phần</b> khớp với nhân quả.</div>
        focus: [1, 1, 2, 3, 3]
        say: "Bước bốn, P3 chưa có sự kiện nào, đồng hồ là 0. P3 nhận thông điệp mang nhãn 4, nên nhãn mới là 5, rồi sự kiện cục bộ sau đó mang nhãn 6. Bảng xếp cả bảy sự kiện theo nhãn, hai sự kiện cùng nhãn 1 thì P1 đứng trước P2. Tính chất quan trọng là nếu a xảy ra trước b thì nhãn của a nhỏ hơn nhãn của b. Xếp mọi sự kiện theo nhãn, hoà thì theo số hiệu tiến trình, ta được một thứ tự toàn phần khớp với quan hệ nhân quả."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: đếm chuỗi dài nhất"
    checks:
      - "(lambda pr: (lambda f: [f(f, i) for i in range(7)])(lambda f, i: 1 + max([f(f, j) for j in pr[i]], default=0)))({0: [], 1: [0], 2: [], 3: [2, 1], 4: [3], 5: [4], 6: [5]}) == alg.lamport_run([('P1', 'local', None), ('P1', 'send', 'm1'), ('P2', 'local', None), ('P2', 'recv', 'm1'), ('P2', 'send', 'm2'), ('P3', 'recv', 'm2'), ('P3', 'local', None)])"
    steps:
      - show: |
          <p>Nhãn Lamport = số sự kiện trên <b>chuỗi nhân quả dài nhất</b> dẫn tới sự kiện đó (đi theo thông điệp và theo trục mỗi tiến trình). Đếm thẳng, không dùng luật max:</p>
          <table class="t"><tr><th>sự kiện</th><th>chuỗi dài nhất dẫn tới nó</th><th>đếm</th><th>nhãn đã tính</th></tr>
          <tr><td>P2 nhận m1</td><td>P1 cục bộ → P1 gửi m1 → P2 nhận m1 (chuỗi kia: P2 cục bộ → P2 nhận m1, chỉ 2)</td><td>3</td><td>3 ✓</td></tr>
          <tr><td>P3 nhận m2</td><td>P1 cục bộ → P1 gửi m1 → P2 nhận m1 → P2 gửi m2 → P3 nhận m2</td><td>5</td><td>5 ✓</td></tr>
          <tr><td>P3 cục bộ</td><td>chuỗi trên, thêm P3 cục bộ</td><td>6</td><td>6 ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.2", "2.3", "2.4"]
        say: "Kiểm bằng một đường khác, không dùng luật lấy số lớn hơn. Với cách gán nhãn này, nhãn của một sự kiện đúng bằng số sự kiện trên chuỗi nhân quả dài nhất dẫn tới nó, đi theo thông điệp và theo trục mỗi tiến trình. Với P2 nhận m1, chuỗi dài nhất là P1 cục bộ, P1 gửi, rồi P2 nhận, có 3 sự kiện. Chuỗi kia, P2 cục bộ rồi P2 nhận, chỉ có 2, nên nhãn là 3, khớp. Với P3 nhận m2, chuỗi dài nhất đi qua cả P1 và P2, có 5 sự kiện, khớp nhãn 5. Thêm sự kiện cục bộ của P3 được 6, cũng khớp, và máy đếm lại cả bảy sự kiện đều trùng với nhãn đã tính."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "max(1, 5) + 1 == 6 and 1 + 1 == 2 and 2 < 5 < 6"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Xếp thứ tự sự kiện bằng giờ hệ thống của từng máy <b class="red">(sai)</b>
          <br><span class="note">Đồng hồ lệch nhau vài mi li giây tới vài giây, có thể nhảy lùi khi đồng bộ lại — như ví dụ mở đầu.</span></div>
        say: "Lỗi thứ nhất, xếp thứ tự sự kiện bằng giờ hệ thống của từng máy. Đồng hồ các máy lệch nhau từ vài mi li giây tới vài giây, và có thể nhảy lùi khi đồng bộ lại, như ví dụ mở đầu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đảo chiều tính chất: nhãn nhỏ hơn thì xảy ra trước <b class="red">(sai)</b>
          <br><span class="note">Ở ví dụ vừa rồi, P2 có sự kiện nhãn 1 và P1 có sự kiện nhãn 2, nhưng hai sự kiện đó không liên hệ nhân quả. Chỉ nhìn nhãn Lamport thì không biết chắc.</span></div>
        say: "Lỗi thứ hai, đảo chiều tính chất, cho rằng nhãn nhỏ hơn thì xảy ra trước. Ở ví dụ vừa rồi, P2 có sự kiện nhãn 1, P1 có sự kiện nhãn 2, nhưng hai sự kiện đó không có liên hệ nhân quả nào. Chỉ nhìn nhãn Lamport thì không biết chắc được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Coi hết giờ chờ là bằng chứng nút đã chết <b class="red">(sai)</b>
          <br><span class="note">Nút có thể chỉ chậm, rồi tiếp tục làm việc như chưa có gì. Thiết kế phải chịu được cả trường hợp “tưởng chết mà vẫn sống”.</span></div>
        say: "Lỗi thứ ba, coi hết giờ chờ là bằng chứng nút đã chết. Nút có thể chỉ chậm, rồi tiếp tục làm việc như chưa có gì, nên thiết kế phải chịu được cả trường hợp tưởng chết mà vẫn sống."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Cài đúng luật nhận ở đường chính, nhưng quên ở một đường phụ (ví dụ đoạn mã nhận lại thông điệp được gửi lại) <b class="red">(nhãn lùi)</b></div>
          <table class="t"><tr><th>P1 gửi kèm nhãn 5, P2 đang ở 1</th><th>nhãn của việc nhận</th><th>so với nhãn gửi 5</th></tr>
          <tr><td>đúng luật: $\max(1, 5) + 1$</td><td>6</td><td>lớn hơn ✓</td></tr>
          <tr><td>quên lấy max, chỉ cộng 1: $1 + 1$</td><td>2</td><td><b class="red">nhỏ hơn</b>: nhật ký lại “nhận trước khi gửi”</td></tr></table>
          <p class="note">Người có kinh nghiệm thêm một phép kiểm tự động: trong nhật ký, mọi cặp gửi–nhận phải có nhãn nhận lớn hơn nhãn gửi.</p>
        focus: [1, 2, "2.2", "2.3", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, cài đúng luật nhận ở đường chính, nhưng quên ở một đường phụ, ví dụ đoạn mã nhận lại một thông điệp được gửi lại. Giả sử P1 gửi kèm nhãn 5, còn P2 đang ở 1. Đúng luật thì P2 lấy số lớn hơn giữa 1 và 5, cộng 1, được 6, lớn hơn 5. Đường phụ quên lấy số lớn hơn, chỉ cộng 1, được 2, nhỏ hơn 5. Nhật ký lại ghi nhận trước khi gửi, đúng cái lỗi ở đầu bài. Người có kinh nghiệm thêm một phép kiểm tự động, trong nhật ký mọi cặp gửi và nhận phải có nhãn nhận lớn hơn nhãn gửi."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.lamport_run([('P1', 'local', None), ('P1', 'local', None), ('P1', 'send', 'm'), ('P2', 'recv', 'm'), ('P2', 'local', None)]) == [1, 2, 3, 4, 5]"
      - "alg.lamport_run([('P1', 'send', 'm')] + [('P2', 'local', None)] * 7 + [('P2', 'recv', 'm')])[-1] == 8"
      - "max(0, 3) + 1 == 4 and max(7, 1) + 1 == 8 and 1 + 1 == 2 < 7"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>P1: cục bộ, cục bộ, gửi m. P2: nhận m (sự kiện đầu tiên của P2), rồi cục bộ. Ghi nhãn mọi sự kiện.</td></tr>
          <tr><td>2</td><td>P2 đã có 7 sự kiện (nhãn tới 7), rồi nhận thông điệp nhãn 1. Nhãn của sự kiện nhận?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, P1 có hai sự kiện cục bộ rồi gửi m, P2 nhận m ở sự kiện đầu tiên rồi có một sự kiện cục bộ. Hãy ghi nhãn đồng hồ cho mọi sự kiện của cả hai tiến trình. Câu hai, P2 đã có 7 sự kiện với nhãn tới 7, rồi nhận một thông điệp mang nhãn 1. Nhãn của sự kiện nhận là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>luật</th><th>nhãn</th></tr>
          <tr><td>P1 cục bộ, cục bộ</td><td>$0 + 1$, rồi $1 + 1$</td><td>1, 2</td></tr>
          <tr><td>P1 gửi m (kèm nhãn)</td><td>$2 + 1$</td><td>3</td></tr>
          <tr><td>P2 nhận m (đồng hồ P2 đang 0)</td><td>$\max(0, 3) + 1$</td><td>$\hl{4}$</td></tr>
          <tr><td>P2 cục bộ</td><td>$4 + 1$</td><td>5</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, làm từng sự kiện. P1 có hai sự kiện cục bộ, nhãn 1 rồi 2. P1 gửi m ở nhãn 3, và nhãn 3 đi kèm thông điệp. P2 chưa có sự kiện nào nên đồng hồ là 0, khi nhận m thì lấy số lớn hơn giữa 0 và 3, cộng 1, được 4. Sự kiện cục bộ sau đó của P2 mang nhãn 5."
      - show: |
          <p>② P2 đang ở 7, thông điệp mang nhãn 1: $\max(7, 1) + 1 = \hl{8}$.</p>
          <p class="note">Nếu chỉ nhìn nhãn thông điệp ($1 + 1 = 2$) thì đồng hồ của P2 lùi từ 7 về 2 — luật lấy số lớn hơn chặn đúng chuyện này.</p>
        focus: [1, 2]
        say: "Câu hai, P2 đang ở 7, thông điệp mang nhãn 1, số lớn hơn giữa 7 và 1, cộng 1, bằng 8, vì đồng hồ không bao giờ lùi. Nếu chỉ nhìn nhãn của thông điệp mà lấy 1 cộng 1 bằng 2, đồng hồ của P2 sẽ lùi từ 7 về 2, và luật lấy số lớn hơn chặn đúng chuyện này."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chậm hay chết: không phân biệt được</span><span class="a">→</span>
          <span class="n">giờ hệ thống lệch</span><span class="a">→</span>
          <span class="n">Lamport: +1, nhận lấy max + 1</span><span class="a">→</span>
          <span class="n">a → b ⇒ C(a) &lt; C(b)</span></div>
        introduces: [implies]
        say: "Tổng kết lại, qua mạng ta không phân biệt được chậm hay chết, và giờ hệ thống của các máy bị lệch. Đồng hồ Lamport tăng 1 mỗi sự kiện, khi nhận thì lấy số lớn hơn rồi cộng 1, và nếu a xảy ra trước b thì nhãn của a nhỏ hơn."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi không đo được thời gian thật, hãy dựa vào <b>quan hệ nhân quả</b> — cái gì có thể ảnh hưởng tới cái gì.</div>
        say: "Điều cần mang theo, khi không đo được thời gian thật, hãy dựa vào quan hệ nhân quả, cái gì có thể ảnh hưởng tới cái gì."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>đồng hồ vector</b> — biết chắc hai sự kiện có liên hệ hay đồng thời.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học đồng hồ vector, biết chắc hai sự kiện có liên hệ nhân quả hay xảy ra đồng thời. Hẹn gặp bạn ở bài tiếp theo."
