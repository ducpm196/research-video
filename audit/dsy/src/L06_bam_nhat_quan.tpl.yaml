        focus: [1, 1, 1, 1]
        say: "Hình xếp 20 khoá, từ 0 tới 19, mỗi cột một khoá. Hàng giữa là máy giữ khoá khi có 4 máy, tức k chia 4 lấy dư, hàng dưới là máy khi có 5 máy, tức k chia 5 lấy dư. Chỉ 4 khoá đầu, 0, 1, 2, 3, có hai số dư bằng nhau và giữ máy cũ, tô xanh lục. 16 khoá còn lại, tô đỏ, đều phải chuyển, vì đổi số chia là đổi gần như mọi số dư."

  - id: ring
    kind: concept
    title: "Vòng băm nhất quán"
    steps:
      - show: |
          <div>{{RING}}</div>
          <p>Băm cả máy lẫn khoá lên cùng một vòng. Mỗi khoá thuộc máy <b>đầu tiên gặp theo chiều kim đồng hồ</b>. Thêm một máy: chỉ các khoá nằm giữa máy mới và máy liền trước nó đổi chủ.</p>
        focus: [1, 2, 2, 2]
        say: "Trên hình, các ô xanh là máy, các chấm cam là khoá, cả hai được băm lên cùng một vòng. Mỗi khoá thuộc máy đầu tiên gặp được khi đi theo chiều kim đồng hồ. Khi thêm một máy, chỉ các khoá nằm giữa máy mới và máy liền trước nó đổi chủ. Mọi khoá khác giữ nguyên."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Đo trên 20 000 khoá: nút ảo làm tải đều"
    checks:
      - "round(alg.ring_moved(4, 5), 2) == 0.21 and round(alg.ring_moved(4, 5, vnodes=1), 2) == 0.55"
      - "(lambda c: (max(c.values()), min(c.values())))(__import__('collections').Counter(alg.ring_owner_fn(range(4), 1)(k) for k in range(20000))) == (14850, 768)"
      - "(lambda c: (max(c.values()), min(c.values())))(__import__('collections').Counter(alg.ring_owner_fn(range(4), 200)(k) for k in range(20000))) == (5660, 4537)"
      - "20000 / 4 == 5000 and round(14850 / 768) == 19 and 20000 * 20 // 100 == 4000 and round(4221 / 20000 * 100) == 21"
    steps:
      - show: |
          <table class="t"><tr><th>4 máy, 20 000 khoá</th><th>máy nhiều nhất</th><th>máy ít nhất</th></tr>
          <tr><td>lý tưởng</td><td colspan="2">$20\,000 / 4 = 5000$ mỗi máy</td></tr>
          <tr><td>mỗi máy 1 điểm trên vòng</td><td>14 850</td><td>768</td></tr></table>
          <p><b>Bước 1</b> — một điểm mỗi máy: máy nhiều nhất gấp khoảng $\hl{19}$ lần máy ít nhất.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước một, đo trên 20 nghìn khoá với 4 máy. Lý tưởng là mỗi máy giữ 20 nghìn chia 4, bằng 5 nghìn khoá. Nếu mỗi máy chỉ có 1 điểm trên vòng, máy nhiều nhất giữ 14 nghìn 850 khoá, máy ít nhất chỉ 768. Máy nhiều nhất gấp khoảng 19 lần máy ít nhất, vì 4 điểm ngẫu nhiên chia vòng thành 4 cung dài ngắn rất khác nhau."
      - show: |
          <table class="t"><tr><th>4 máy, 20 000 khoá</th><th>máy nhiều nhất</th><th>máy ít nhất</th></tr>
          <tr><td>mỗi máy 1 điểm</td><td>14 850</td><td>768</td></tr>
          <tr><td>mỗi máy 200 <b>nút ảo</b></td><td>$\hl{5660}$</td><td>$\hl{4537}$</td></tr></table>
          <p><b>Bước 2</b> — nút ảo: mỗi máy đặt 200 điểm trên vòng, giữ 200 cung nhỏ. Tải sát mức 5000.</p>
        focus: [0, "1.3", 2, 2]
        say: "Bước hai, cho mỗi máy 200 nút ảo. Bây giờ máy nhiều nhất giữ 5 nghìn 660 khoá, máy ít nhất 4 nghìn 537 khoá. Nút ảo nghĩa là mỗi máy đặt 200 điểm trên vòng, và giữ 200 cung nhỏ. Cộng nhiều cung nhỏ ngẫu nhiên thì các máy gần bằng nhau, sát mức 5 nghìn."
      - clear: true
        show: |
          <table class="t"><tr><th>thêm máy thứ 5</th><th>khoá đổi máy</th></tr>
          <tr><td><code>k mod N</code> (4 → 5)</td><td>80%</td></tr>
          <tr><td>vòng, mỗi máy 1 điểm</td><td>55%</td></tr>
          <tr><td>vòng, mỗi máy 200 nút ảo</td><td>$\hl{21\%}$</td></tr></table>
          <p><b>Bước 3</b> — thêm máy thứ 5, đo tỉ lệ khoá phải chuyển.</p>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bước ba, thêm máy thứ 5 và đo tỉ lệ khoá phải chuyển. Với cách chia lấy dư, từ 4 lên 5 máy, 80 phần trăm khoá đổi máy, như hình 20 khoá ở trên. Với vòng mà mỗi máy 1 điểm, 55 phần trăm khoá đổi máy, vì điểm mới có thể rơi vào một cung rất dài. Với vòng 200 nút ảo, chỉ 21 phần trăm."
      - show: |
          $$\text{lý tưởng: } \frac{1}{5} = 20\% \;\Rightarrow\; 20\,000 \cdot 20\% = 4000 \text{ khoá}$$
          <div class="box key"><b>Bước 4</b> — máy mới nhận đúng phần của mình là 4000 khoá; vòng 200 nút ảo chuyển 4 221 khoá $\approx 21\%$. Nút ảo vừa <b>đều tải</b> vừa <b>gần lý tưởng</b>.</div>
        introduces: [implies]
        focus: [1, 2, 2]
        say: "Bước bốn, so với lý tưởng. Có 5 máy thì máy mới nên giữ một phần năm, tức 20 phần trăm, bằng 4 nghìn khoá, và chỉ những khoá đó cần chuyển. Vòng 200 nút ảo chuyển 4 nghìn 221 khoá, khoảng 21 phần trăm, nên nút ảo vừa đều tải vừa gần lý tưởng."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "[k for k in range(20) if k % 4 == k % 5] == [0, 1, 2, 3] and all(sum(k % n == k % (n + 1) for k in range(n * (n + 1))) == n for n in range(2, 12))"
      - "(lambda a, b: (sum(a(k) != b(k) for k in range(20000)), sum(b(k) == 4 for k in range(20000)), all(b(k) == 4 for k in range(20000) if a(k) != b(k))))(alg.ring_owner_fn(range(4), 200), alg.ring_owner_fn(range(5), 200)) == (4221, 4221, True)"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>80% của <code>k mod N</code></td><td>số dư lặp lại sau mỗi $4 \cdot 5 = 20$ khoá; dò cả 20 khoá: chỉ 4 khoá giữ máy</td><td>$16 / 20 = 80\%$ ✓</td></tr>
          <tr><td>quy luật N → N + 1</td><td>dò $N(N + 1)$ khoá: đúng N khoá giữ máy, với mọi N từ 2 tới 11</td><td>đổi máy $\frac{N}{N + 1}$</td></tr>
          <tr><td>21% của vòng</td><td>đếm thẳng số khoá máy mới đang giữ</td><td>4 221 = số khoá đổi máy ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Kiểm bằng đường khác, không dùng máy đo trên 100 nghìn khoá. Số dư khi chia cho 4 và cho 5 lặp lại sau mỗi 4 nhân 5 bằng 20 khoá. Vì vậy chỉ cần dò 20 khoá, và ta thấy đúng 4 khoá giữ máy, tức 16 trên 20, bằng 80 phần trăm. Dò tương tự N nhân N cộng 1 khoá thì luôn có đúng N khoá giữ máy, nên tỉ lệ đổi máy là N chia N cộng 1, với N bằng 4 là bốn phần năm. Với vòng băm, đếm thẳng số khoá máy mới đang giữ được 4 nghìn 221, đúng bằng số khoá đổi máy. Nghĩa là không khoá nào chuyển qua lại giữa 4 máy cũ, khoá chỉ chạy sang máy mới."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "(lambda a, b: round(sum(a(k) != b(k) for k in range(20000)) / 20000, 2))(alg.ring_owner_fn(range(4), 200), alg.ring_owner_fn(range(4), 100)) == 0.32"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Phân mảnh theo khoảng với khoá tăng dần <b class="red">(điểm nóng)</b>
          <br><span class="note">Khoá là thời điểm: mọi bản ghi mới dồn vào máy giữ khoảng mới nhất. Băm khoá, hoặc ghép thêm tiền tố ngẫu nhiên.</span></div>
        say: "Lỗi thứ nhất, phân mảnh theo khoảng với khoá tăng dần, như thời điểm. Mọi bản ghi mới dồn vào máy giữ khoảng mới nhất, nên hãy băm khoá, hoặc ghép thêm một tiền tố ngẫu nhiên."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng <code>k mod N</code> khi số máy sẽ thay đổi <b class="red">(chuyển gần hết)</b>
          <br><span class="note">Đổi N là đổi chỗ hầu hết khoá. Dùng vòng băm, hoặc chia trước một số mảnh cố định lớn hơn nhiều số máy.</span></div>
        say: "Lỗi thứ hai, dùng k chia N lấy dư khi số máy sẽ thay đổi. Đổi N là đổi chỗ hầu hết khoá, nên hãy dùng vòng băm, hoặc chia trước một số mảnh cố định lớn hơn nhiều số máy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Băm đều mà quên khoá “siêu nóng” <b class="red">(lệch tải)</b>
          <br><span class="note">Một người nổi tiếng có hàng triệu lượt đọc: băm tốt đến đâu, một khoá vẫn nằm trên một máy. Phải xử lý riêng khoá đó, như chép nó ra nhiều máy.</span></div>
        say: "Lỗi thứ ba, băm đều mà quên khoá siêu nóng. Một người nổi tiếng có hàng triệu lượt đọc, băm tốt đến đâu thì một khoá vẫn nằm trên một máy, nên phải xử lý riêng khoá đó, như chép nó ra nhiều máy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đổi số nút ảo hay hàm băm trong một lần nâng cấp, tưởng chỉ là cấu hình <b class="red">(chuyển dữ liệu ồ ạt)</b></div>
          <table class="t"><tr><th>thay đổi, 20 000 khoá</th><th>số máy</th><th>khoá đổi máy</th></tr>
          <tr><td>thêm máy thứ 5, giữ 200 nút ảo</td><td>4 → 5</td><td>21%</td></tr>
          <tr><td>giảm 200 xuống 100 nút ảo mỗi máy</td><td>4 → 4</td><td>$\hl{32\%}$</td></tr></table>
          <p class="note">Vị trí trên vòng là một phần của dữ liệu. Đổi nó phải lên kế hoạch như thêm máy: đo trước số khoá phải chuyển, chuyển dần.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đổi số nút ảo hay đổi hàm băm trong một lần nâng cấp, tưởng chỉ là sửa cấu hình. Thêm máy thứ 5 mà giữ 200 nút ảo thì 21 phần trăm khoá đổi máy, như ta vừa đo. Nhưng giữ nguyên 4 máy, chỉ giảm từ 200 xuống 100 nút ảo mỗi máy, thì 32 phần trăm khoá đổi máy, nhiều hơn cả lúc thêm máy, dù không có máy nào mới. Vị trí trên vòng là một phần của dữ liệu, nên đổi nó phải lên kế hoạch như thêm máy, đo trước số khoá phải chuyển và chuyển dần."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.mod_moved(10, 11), 3) == 0.909 and round(alg.ring_moved(10, 11), 2) == 0.09"
      - "sum(k % 10 == k % 11 for k in range(110)) == 10 and round(100 / 110 * 100, 1) == 90.9 and round(100 / 11, 1) == 9.1"
    steps:
      - show: |
          <p>Từ 10 máy lên 11 máy.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Với <code>k mod N</code>, khoảng bao nhiêu phần trăm khoá đổi máy?</td></tr>
          <tr><td>2</td><td>Với vòng băm nhiều nút ảo, khoảng bao nhiêu? Lý tưởng là bao nhiêu?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, khi tăng từ 10 máy lên 11 máy. Câu một, với k chia N lấy dư, khoảng bao nhiêu phần trăm khoá đổi máy? Câu hai, với vòng băm nhiều nút ảo thì khoảng bao nhiêu, và lý tưởng là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>làm</th><th>kết quả</th></tr>
          <tr><td>chu kỳ số dư</td><td>$10 \cdot 11 = 110$ khoá</td><td>trong đó đúng 10 khoá giữ máy</td></tr>
          <tr><td>tỉ lệ đổi máy</td><td>$\frac{100}{110} = \frac{10}{11}$</td><td>$\hl{\approx 90{,}9\%}$ (máy đo 100 000 khoá cũng ra 90,9%)</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Đáp án câu một, làm từng bước theo quy luật vừa kiểm. Số dư khi chia cho 10 và cho 11 lặp lại sau 10 nhân 11 bằng 110 khoá, và trong đó đúng 10 khoá giữ máy. Vậy 100 trên 110 khoá đổi máy, tức mười phần mười một, khoảng 90 phẩy 9 phần trăm, khớp với máy đo trên 100 nghìn khoá."
      - show: |
          <table class="t"><tr><th>câu 2</th><th>làm</th><th>kết quả</th></tr>
          <tr><td>lý tưởng</td><td>máy mới giữ $\frac{1}{11}$ số khoá</td><td>$\approx 9{,}1\%$</td></tr>
          <tr><td>vòng nhiều nút ảo</td><td>đo trên 20 000 khoá</td><td>$\hl{\approx 9\%}$, sát lý tưởng</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Câu hai, trước hết tính lý tưởng. Có 11 máy thì máy mới nên giữ một phần mười một số khoá, khoảng 9 phẩy 1 phần trăm. Vòng băm nhiều nút ảo, đo trên 20 nghìn khoá, chuyển khoảng 9 phần trăm, sát lý tưởng, so với hơn 90 phần trăm của cách chia lấy dư."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">khoảng: dải nhanh, dễ điểm nóng</span><span class="a">→</span>
          <span class="n">băm: đều tải</span><span class="a">→</span>
          <span class="n">k mod N: đổi N chuyển gần hết</span><span class="a">→</span>
          <span class="n">vòng băm + nút ảo: chuyển ≈ 1/N</span></div>
        say: "Tổng kết lại, phân mảnh theo khoảng thì truy vấn dải nhanh nhưng dễ có điểm nóng. Theo băm thì đều tải, nhưng k chia N lấy dư làm đổi N là chuyển gần hết. Vòng băm với nút ảo chỉ chuyển khoảng một phần N."
      - show: |
          <div class="box key"><b>Tư duy:</b> thiết kế cho thay đổi. Hỏi “khi thêm một máy, bao nhiêu thứ phải dịch chuyển?” — câu trả lời tốt là “chỉ phần tối thiểu”.</div>
        say: "Điều cần mang theo, hãy thiết kế cho thay đổi. Hỏi khi thêm một máy thì bao nhiêu thứ phải dịch chuyển, câu trả lời tốt là chỉ phần tối thiểu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): xử lý dữ liệu lớn theo lô — <b>ánh xạ, xáo trộn, rút gọn</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học xử lý dữ liệu lớn theo lô, với ba bước ánh xạ, xáo trộn, rút gọn. Hẹn gặp bạn ở bài tiếp theo."
