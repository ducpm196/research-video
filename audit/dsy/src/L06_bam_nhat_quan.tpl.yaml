0</text><rect x="974" y="200" width="56" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1002" y="239" text-anchor="middle">2</text><rect x="1036" y="40" width="56" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1064" y="79" text-anchor="middle">13</text><rect x="1036" y="120" width="56" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1064" y="159" text-anchor="middle">1</text><rect x="1036" y="200" width="56" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1064" y="239" text-anchor="middle">3</text><rect x="1098" y="40" width="56" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1126" y="79" text-anchor="middle">14</text><rect x="1098" y="120" width="56" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1126" y="159" text-anchor="middle">2</text><rect x="1098" y="200" width="56" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1126" y="239" text-anchor="middle">4</text><rect x="1160" y="40" width="56" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1188" y="79" text-anchor="middle">15</text><rect x="1160" y="120" width="56" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1188" y="159" text-anchor="middle">3</text><rect x="1160" y="200" width="56" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1188" y="239" text-anchor="middle">0</text><rect x="1222" y="40" width="56" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1250" y="79" text-anchor="middle">16</text><rect x="1222" y="120" width="56" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1250" y="159" text-anchor="middle">0</text><rect x="1222" y="200" width="56" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1250" y="239" text-anchor