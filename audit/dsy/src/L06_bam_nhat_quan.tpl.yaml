id: L06
course: DSY
series: "DSY · Hệ phân tán và dữ liệu lớn"
title: "Bài 6 — Phân mảnh dữ liệu và băm nhất quán"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsy.yaml L06; audit/dsy/verify_dsy.py L06; D. Karger và cộng sự, Consistent Hashing and Random Trees, STOC 1997; G. DeCandia và cộng sự, Dynamo, SOSP 2007; CS112 bài 6 (bảng băm); DMS bài 13 (đồng dư)"
assumes: [arith, frac, approx]
# Quy ước: khoá là số nguyên 0..N−1; băm k mod N (DMS bài 13); vòng băm dùng md5 (alg._h), mỗi nút thật có v nút ảo trên vòng, khoá thuộc nút ảo
#   đầu tiên theo chiều kim đồng hồ (alg.ring_owner_fn). Tỉ lệ khoá phải chuyển đếm trên 100 000 khoá (mod) và 20 000 khoá (vòng): alg.mod_moved,
#   alg.ring_moved. Hình vòng: audit/dsy/figs.py ring_fig (4 nút, 4 khoá minh hoạ).
objectives:
  - "Chia dữ liệu theo khoá ra nhiều máy"
  - "Biết vì sao băm k mod N tệ khi thêm máy"
  - "Hiểu băm nhất quán và nút ảo"
asr_reviewed:
  - {sentence: "Hàng giữa là máy giữ khoá khi có 4 máy, tức k chia 4 lấy dư, hàng dưới là máy khi có 5 máy, tức k chia 5 lấy dư.", reason: "ASR chép “Hàng giữa là máy giữ khóa khi có 4 máy, tất cả chia 4 lấy dư. Hàng dưới là máy khi có 5 máy, tất cả chia 5 lấy dư.” (0.867): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: tức (trong “tức k” → “tất cả”), tức (trong “tức k” → “tất cả”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Thêm một máy, chuyển 80% dữ liệu"
    checks:
      - "alg.mod_moved(4, 5) == 0.8"
    steps:
      - show: |
          <p>Dữ liệu chia cho 4 máy theo <code>k mod 4</code>. Thêm máy thứ 5, đổi thành <code>k mod 5</code>: $\hl{80\%}$ số khoá đổi máy — gần như phải chép lại toàn bộ dữ liệu, đúng lúc hệ đang quá tải.</p>
          <div class="box key">Hôm nay: <b>phân mảnh</b> dữ liệu, và <b>băm nhất quán</b> — thêm một máy chỉ chuyển khoảng phần cần chuyển.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, dữ liệu được chia cho 4 máy theo k chia 4 lấy dư. Thêm máy thứ 5 và đổi thành k chia 5 lấy dư, thì 80 phần trăm số khoá đổi máy, gần như phải chép lại toàn bộ dữ liệu, đúng lúc hệ đang quá tải. Hôm nay ta học phân mảnh dữ liệu, và băm nhất quán, khi thêm một máy chỉ chuyển đúng khoảng phần cần chuyển."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: chia lấy dư, hàm băm, phần trăm"
    checks:
      - "(13 % 4, 13 % 5, 7 % 4, 7 % 5) == (1, 3, 3, 2) and 13 == 3 * 4 + 1"
      - "29 % 8 == 5 and 16 / 20 == 0.8"
    steps:
      - show: |
          <p><b>Chia lấy dư</b> (khoá Toán rời rạc): <code>k mod N</code> là số dư khi chia k cho N, luôn nằm trong 0 … N − 1.</p>
          <table class="t"><tr><th>k</th><th>k mod 4</th><th>k mod 5</th></tr>
          <tr><td>13</td><td>1 (vì $13 = 3 \cdot 4 + 1$)</td><td>3</td></tr>
          <tr><td>7</td><td>3</td><td>2</td></tr></table>
        introduces: [cdot]
        focus: [1, 1, "2.2", "2.3"]
        say: "Ở khoá Toán rời rạc, ta đã học phép chia lấy dư. Số dư khi chia k cho N luôn nằm trong khoảng từ 0 tới N trừ 1. Ví dụ 13 chia 4 được 3, dư 1, vì 13 bằng 3 nhân 4 cộng 1, còn 13 chia 5 dư 3. Số 7 chia 4 dư 3, chia 5 dư 2."
      - show: |
          <p><b>Hàm băm</b> (khoá Thuật toán, phần bảng băm): biến một khoá bất kỳ, kể cả chuỗi chữ, thành một số. Cùng khoá luôn ra cùng số; các khoá khác nhau rải đều.</p>
          <table class="t"><tr><th>khoá</th><th>băm (giả sử)</th><th>bảng 8 ô: ô số</th></tr>
          <tr><td><code>"an"</code></td><td>29</td><td>29 mod 8 = 5</td></tr></table>
        focus: [1, 1, "2.2"]
        say: "Ở khoá Thuật toán, phần bảng băm, ta đã gặp hàm băm, biến một khoá bất kỳ, kể cả chuỗi chữ, thành một số. Cùng một khoá luôn ra cùng một số, còn các khoá khác nhau thì rải đều. Giả sử khoá an băm ra 29, bảng có 8 ô, thì khoá nằm ở ô 29 chia 8 dư 5, tức ô số 5."
      - show: |
          <p><b>Phần trăm</b>: 16 khoá trong 20 khoá phải chuyển là</p>
          $$\frac{16}{20} = 0{,}8 = 80\%$$
        focus: [1, 2]
        say: "Cuối cùng là phần trăm. Nếu 16 khoá trong 20 khoá phải chuyển máy, thì tỉ lệ là 16 chia 20, bằng 0 phẩy 8, tức 80 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: phân mảnh theo khoảng, theo băm"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>khoá → máy</th><th>ưu</th><th>nhược</th></tr>
          <tr><td>theo khoảng</td><td>A–F máy 1, G–M máy 2, …</td><td>truy vấn theo dải nhanh</td><td>khoá tăng dần (thời gian) dồn hết vào máy cuối: <b>điểm nóng</b></td></tr>
          <tr><td>theo băm</td><td>băm(k) quyết định máy</td><td>trải đều tải</td><td>truy vấn theo dải phải hỏi mọi máy</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3"]
        say: "Có hai cách phân mảnh. Theo khoảng, các khoá từ A tới F về máy 1, từ G tới M về máy 2, và cứ thế. Ưu điểm là truy vấn theo dải rất nhanh, nhược điểm là khoá tăng dần như thời gian sẽ dồn hết vào máy cuối, tạo điểm nóng. Theo băm, giá trị băm của khoá quyết định máy, ưu điểm là trải đều tải, nhược điểm là truy vấn theo dải phải hỏi mọi máy."

  # ───────────────────────── 3. VÒNG BĂM ─────────────────────────
