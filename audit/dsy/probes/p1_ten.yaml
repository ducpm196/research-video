name: dsy_p1_ten
# Vòng 1 cho DSY: tên người và tên hệ thống. Đọc BẢN CHÉP (khoá ngắn dễ khớp giả). Mọi key trong ngoặc kép (YAML: null).
ctx:
  - "Theo {}, ta xét thứ tự các sự kiện."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "lamport"
    variants: ["Lamport", "Lam-po", "Lam-pót"]
    negative: "Lam-pa"
    keys: ["lamport", "lampo", "lampot", "lamport"]
  - key: "bloom"
    variants: ["Bloom", "Blum", "Bờ-lum"]
    negative: "Bờ-lam"
    keys: ["bloom", "blum", "bolum", "bloum"]
  - key: "cap"
    variants: ["CAP", "xê a pê", "cáp"]
    negative: "xê a bê"
    keys: ["cap", "xeape", "cáp", "cap"]
  - key: "raft"
    variants: ["Raft", "Ráp", "Ráp-tờ"]
    negative: "Rát"
    keys: ["raft", "rap", "rapto", "raf"]
  - key: "mapreduce"
    variants: ["MapReduce", "Máp Ri-đu-xơ", "máp ri-điu"]
    negative: "Máp Ri-đi"
    keys: ["mapreduce", "mapriduxo", "mapridiu", "mapreduc"]
  - key: "paxos"
    variants: ["Paxos", "Pắc-xốt", "Pa-xốt"]
    negative: "Pa-xa"
    keys: ["paxos", "pacxot", "paxot", "pacxos"]
