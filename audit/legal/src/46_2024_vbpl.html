: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003eBộ trưởng Bộ Tài chính ban hành Thông tư quy định về hồ sơ, thủ tục quản lý thuế đối với hộ kinh doanh, cá nhân kinh doanh.\u003c/em\u003e\u003c/span\u003e\u003cspan style=\"vertical-align: super; color: #000000; font-family: Arial, serif; font-size: 6.5pt\"\u003e\u003cem\u003e1\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"192d8289-24a7-4bc5-a10f-63543bcf11b7\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eĐiều 1. Phạm vi điều chỉnh\u003c/strong\u003e\u003c/span\u003e\u003cspan style=\"vertical-align: super; color: #000000; font-family: Arial, serif; font-size: 6.5pt\"\u003e\u003cstrong\u003e2\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"192d8289-24a7-4bc5-a10f-63543bcf11b7\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003eThông tư này quy định chi tiết về hồ sơ, thủ tục thông báo doanh thu, kê khai thuế, nộp thuế, hoàn thuế, thông báo địa điểm kinh doanh, tạm ngừng, chấm dứt hoạt động kinh doanh đối với hộ kinh doanh, cá nhân kinh doanh tại khoản 6 Điều 13 Luật Quản lý thuế số \u003ca href=\"/van-ban/chi-tiet/187043\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e108/2025/QH15\u003c/a\u003e, Điều 8, Điều 11, Điều 12 Nghị định số \u003ca href=\"/van-ban/chi-tiet/fbf2f200-6002-11f1-babf-6bf011c15003\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2026/NĐ-CP\u003c/a\u003e của Chính phủ quy định về chính sách thuế và quản lý thuế đối với hộ kinh doanh, cá nhân kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"c5e0af45-0a03-45e0-8639-2b96064cbddd\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eĐiều 2. Đối tượng áp dụng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"c6e6e201-f63e-44a7-9ca7-fcfa5d1c7b6f\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e1. Người nộp thuế là hộ kinh doanh, cá nhân kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"420bd0ed-9eff-4cf0-bcec-a752e57813fd\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e2. Cơ quan thuế các cấp và công chức thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"5f03b3a5-ac28-4e49-8412-784dd4598e44\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e3. Các cơ quan, tổ chức, cá nhân khác có liên quan đến việc thực hiện nghĩa vụ thuế của hộ kinh doanh, cá nhân kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"9d990358-3e9c-46e1-888d-54e2aac0082c\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eĐiều 3. Thông báo địa điểm kinh doanh\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"3e0daa81-5723-46c8-9918-84c857a038c8\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e1. Hộ kinh doanh, cá nhân kinh doanh gửi Thông báo về việc thành lập địa điểm kinh doanh, thay đổi thông tin, tạm ngừng kinh doanh, chấm dứt hoạt động địa điểm kinh doanh đến cơ quan thuế quản lý trụ sở kinh doanh quy định tại điểm đ khoản 4 Điều 8 Nghị định số \u003ca href=\"/van-ban/chi-tiet/fbf2f200-6002-11f1-babf-6bf011c15003\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2026/NĐ-CP\u003c/a\u003e theo Mẫu số 01/TB-ĐĐKD ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"9f514948-fe12-44c6-8693-507f46c962a3\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e2. Cơ quan thuế gửi thông báo cho người nộp thuế biết theo Mẫu số 02/TB-ĐĐKD ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"403f7366-1494-448a-80b1-e82e76f85c3f\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eĐiều 4. Hồ sơ thông báo doanh thu, kê khai thuế\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8b44e75d-59c1-49ac-a178-eb81fd35a59f\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e1. Hồ sơ thông báo doanh thu, kê khai thuế đối với hộ kinh doanh, cá nhân kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"b66cad44-b139-4883-aacb-3ba2d3498f04\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003ea) Hộ kinh doanh, cá nhân kinh doanh thuộc đối tượng không chịu thuế giá trị gia tăng, không phải nộp thuế thu nhập cá nhân (bao gồm cả hộ kinh doanh, cá nhân kinh doanh mới ra kinh doanh) thông báo doanh thu thực tế phát sinh trong năm và kê khai các loại thuế khác theo Mẫu số 01/TKN-CNKD ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"42475597-3def-467d-a04e-f4bb3bffa84a\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003eb) Đối với hộ kinh doanh, cá nhân kinh doanh thuộc đối tượng nộp thuế thu nhập cá nhân theo phương pháp thuế suất nhân (x) với doanh thu tính thuế, hồ sơ khai thuế giá trị gia tăng, thuế thu nhập cá nhân và các loại thuế khác là Tờ khai theo Mẫu số 01/CNKD ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"bee23017-334f-4d66-ab1e-2c4ea4df8f29\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003ec) Đối với hộ kinh doanh, cá nhân kinh doanh thuộc đối tượng nộp thuế thu nhập cá nhân theo phương pháp thu nhập tính thuế nhân (x) với thuế suất\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"bee23017-334f-4d66-ab1e-2c4ea4df8f29\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e- Hồ sơ khai thuế giá trị gia tăng, thuế thu nhập cá nhân và các loại thuế khác trong năm là Tờ khai theo Mẫu số 01/CNKD ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"bee23017-334f-4d66-ab1e-2c4ea4df8f29\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e- Hồ sơ khai quyết toán thuế thu nhập cá nhân là Tờ khai quyết toán thuế thu nhập cá nhân theo Mẫu số 02/CNKD-TNCN-QTT ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"d2b3c980-a790-4bf9-a3a5-1dbaf414fb62\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003ed) Hộ kinh doanh, cá nhân kinh doanh đang hoạt động thuộc đối tượng quy định tại điểm b khoản 4 Điều 17 Nghị định số \u003ca href=\"/van-ban/chi-tiet/fbf2f200-6002-11f1-babf-6bf011c15003\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2026/NĐ-CP\u003c/a\u003e gửi Thông báo số tài khoản/số hiệu ví điện tử theo Mẫu số 01/BK-STK ban hành kèm theo Thông tư này chậm nhất là ngày 20 tháng 4 năm 2026.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"d2b3c980-a790-4bf9-a3a5-1dbaf414fb62\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003eHộ kinh doanh, cá nhân kinh doanh đang hoạt động thuộc đối tượng quy định tại điểm a khoản 4 Điều 17 Nghị định số \u003ca href=\"/van-ban/chi-tiet/fbf2f200-6002-11f1-babf-6bf011c15003\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2026/NĐ-CP\u003c/a\u003e gửi Thông báo số tài khoản/số hiệu ví điện tử theo Mẫu số 01/BK-STK ban hành kèm theo Thông tư này kèm theo Tờ khai thuế đầu tiên của năm 2026.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"d2b3c980-a790-4bf9-a3a5-1dbaf414fb62\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003eHộ kinh doanh, cá nhân kinh doanh mới ra kinh doanh gửi Thông báo số tài khoản/số hiệu ví điện tử theo Mẫu số 01/BK-STK ban hành kèm theo Thông tư này kèm theo Thông báo doanh thu hoặc Tờ khai thuế đầu tiên của năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"d2b3c980-a790-4bf9-a3a5-1dbaf414fb62\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003eHộ kinh doanh, cá nhân kinh doanh khi thay đổi thông tin số tài khoản/số hiệu ví điện tử thì thông báo cho cơ quan thuế theo quy định của pháp luật quản lý thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8348404d-29a2-46b5-9214-e16efc966c59\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e2. Hồ sơ khai thuế giá trị gia tăng, thuế thu nhập cá nhân đối với trường hợp tổ chức, cá nhân khấu trừ khai thuế thay, nộp thuế thay\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"8348404d-29a2-46b5-9214-e16efc966c59\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003ea)\u003c/span\u003e\u003cspan style=\"vertical-align: super; color: #000000; font-family: Arial, serif; font-size: 6.5pt\"\u003e3 \u003c/span\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003e\u003cem\u003e(được bãi bỏ)\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" id=\"0708e0d8-d6da-42a0-bb4b-4e0bb59fc717\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003eb) Đối với tổ chức khai thuế thay, nộp thuế thay cho cá nhân cho thuê bất động sản, trừ hoạt động kinh doanh lưu trú là Tờ khai theo Mẫu số 01/TCKT và Phụ lục Bảng kê chi tiết cá nhân cho thuê bất động sản theo Mẫu số 02/BK-KTBĐS ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"0708e0d8-d6da-42a0-bb4b-4e0bb59fc717\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003ec)\u003c/span\u003e\u003cspan style=\"vertical-align: super; color: #000000; font-family: Arial, serif; font-size: 6.5pt\"\u003e4\u003c/span\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e \u003cstrong\u003e\u003cem\u003e(được bãi bỏ)\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"0708e0d8-d6da-42a0-bb4b-4e0bb59fc717\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e3\u003c/span\u003e\u003cspan style=\"vertical-align: super; color: #000000; font-family: Arial, serif; font-size: 6.5pt\"\u003e5 \u003c/span\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003e\u003cem\u003e(được bãi bỏ)\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"0c3f430c-ab84-472a-94ec-b319af64bbec\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e4. Đối với cá nhân cho thuê bất động sản trực tiếp khai thuế với cơ quan thuế là Tờ khai thuế đối với hoạt động cho thuê bất động sản theo Mẫu số 01/BĐS và Phụ lục Bảng kê chi tiết bất động sản theo Mẫu số 01/BK-BĐS ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"b9cd209a-29ec-4ace-8173-e0840d2061e5\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eĐiều 5. Hồ sơ đề nghị hoàn thuế nộp thừa\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"60c52000-9419-433c-8bdc-6eef40bdea91\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e1. Hồ sơ đề nghị hoàn thuế nộp thừa đối với hộ kinh doanh, cá nhân kinh doanh nộp thuế thu nhập cá nhân theo phương pháp thuế suất nhân (x) với doanh thu tính thuế là Tờ khai thuế theo Mẫu số 01/TKN-CNKD ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"d009d8cd-ad1c-4ee7-922f-d387b24d5fd3\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e2.\u003c/span\u003e\u003cspan style=\"vertical-align: super; color: #000000; font-family: Arial, serif; font-size: 6.5pt\"\u003e6\u003c/span\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e Hồ sơ đề nghị hoàn thuế nộp thừa đối với hộ kinh doanh, cá nhân kinh doanh nộp thuế thu nhập cá nhân theo phương pháp thu nhập tính thuế nhân (x) với thuế suất là Tờ khai thuế theo Mẫu số 02/CNKD-TNCN-QTT ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"5250e626-c020-480b-b2d1-764ad2f19f7f\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eĐiều 6. Tiếp nhận, phân loại, giải quyết hồ sơ hoàn thuế nộp thừa\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"72bf79de-fbcc-4e53-8c97-463a60e7e477\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e1. Cơ quan thuế tiếp nhận, phân loại, giải quyết hồ sơ hoàn thuế nộp thừa của hộ kinh doanh, cá nhân kinh doanh theo quy định của pháp luật về quản lý thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8d2306d2-8ffa-4631-b134-55d574a742f4\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e2. Cơ quan thuế ban hành Quyết định hoàn thuế hoặc Quyết định hoàn thuế kiêm bù trừ thu ngân sách nhà nước theo quy định.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"409fd777-21f4-404d-a217-018201ce6290\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e3. Cơ quan thuế gửi Lệnh hoàn trả khoản thu ngân sách nhà nước hoặc Lệnh hoàn trả kiêm bù trừ khoản thu ngân sách nhà nước cho Kho bạc Nhà nước quản lý địa bàn tương ứng với cơ quan thuế ban hành Lệnh hoàn trả để thực hiện hạch toán hoàn trả và chuyển chứng từ cho Kho bạc Nhà nước nơi có khoản thu ngân sách nhà nước được bù trừ để hạch toán thu ngân sách nhà nước theo quy định để thực hiện hoàn thuế cho người nộp thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"14bb197e-2551-45b8-8a66-501b2e260337\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eĐiều 7. Trả kết quả giải quyết hoàn thuế\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"14bb197e-2551-45b8-8a66-501b2e260337\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003eCơ quan thuế gửi Quyết định hoàn thuế, Phụ lục số tiền thuế, tiền chậm nộp, tiền phạt nộp thừa được hoàn trả (nếu có) hoặc Quyết định hoàn thuế kiêm bù trừ thu ngân sách nhà nước, Phụ lục số tiền thuế, tiền chậm nộp, tiền phạt nộp thừa được hoàn trả kiêm bù trừ thu ngân sách nhà nước (nếu có) cho người nộp thuế, cơ quan, tổ chức có liên quan; trường hợp không được hoàn thuế thì cơ quan thuế gửi Thông báo về việc không được hoàn thuế cho hộ kinh doanh, cá nhân kinh doanh theo quy định tại Thông tư số \u003ca href=\"/van-ban/chi-tiet/151086\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e80/2021/TT-BTC\u003c/a\u003e ngày 29 tháng 9 năm 2021 của Bộ trưởng Bộ Tài chính hướng dẫn thi hành một số điều của Luật Quản lý thuế và Nghị định số \u003ca href=\"/van-ban/chi-tiet/146459\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e126/2020/NĐ-CP\u003c/a\u003e ngày 19 tháng 10 năm 2020 của Chính phủ quy định chi tiết một số điều của Luật Quản lý thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"107f764c-3b25-4ed5-ba50-31562af13490\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eĐiều 8. Điều khoản chuyển tiếp\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"935496b3-d7fe-4cc2-b35a-d6b2cf6a158b\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e1. Đối với trường hợp quy định tại khoản 3 Điều 18 Nghị định số \u003ca href=\"/van-ban/chi-tiet/fbf2f200-6002-11f1-babf-6bf011c15003\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2026/NĐ-CP\u003c/a\u003e ngày 05/03/2026 của Chính phủ thì được khai điều chỉnh theo Tờ khai thuế đối với hoạt động cho thuê tài sản Mẫu số 01/TTS ban hành kèm theo Thông tư số \u003ca href=\"/van-ban/chi-tiet/151002\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e40/2021/TT-BTC\u003c/a\u003e ngày 01 tháng 6 năm 2021 của Bộ trưởng Bộ Tài chính hướng dẫn thuế giá trị gia tăng, thuế thu nhập cá nhân và quản lý thuế đối với hộ kinh doanh, cá nhân kinh doanh theo doanh thu chịu thuế thực tế phát sinh trong năm 2025 và khai doanh thu năm 2026 theo Tờ khai thuế đối với hoạt động cho thuê bất động sản Mẫu số 01/BĐS ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"6def92b2-613a-4d80-945a-e0277e9a93d1\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e2. Đối với trường hợp đã kê khai, nộp thuế theo hướng dẫn tại Thông tư số \u003ca href=\"/van-ban/chi-tiet/151002\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e40/2021/TT-BTC\u003c/a\u003e thì không điều chỉnh lại. Trường hợp chưa khai thuế thì thực hiện theo hồ sơ, thủ tục quy định tại Thông tư này và không bị xử phạt.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"b3d23689-3294-412e-b93b-cd746a2f4341\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e3. Hộ kinh doanh, cá nhân kinh doanh lập và gửi Bảng kê hàng tồn kho, máy móc, thiết bị quy định tại khoản 4 Điều 18 Nghị định số \u003ca href=\"/van-ban/chi-tiet/fbf2f200-6002-11f1-babf-6bf011c15003\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e68/2026/NĐ-CP\u003c/a\u003e theo Mẫu số 01/BK-HTK ban hành kèm theo Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"6d5fb0d1-1801-47e7-8f61-ea7d1a937570\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eĐiều 9. Hiệu lực thi hành\u003c/strong\u003e\u003c/span\u003e\u003cspan style=\"vertical-align: super; color: #000000; font-family: Arial, serif; font-size: 6.5pt\"\u003e\u003cstrong\u003e7\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"60fa51ca-ff58-4f90-aa4a-d47130097a4b\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e1. Thông tư này có hiệu lực thi hành kể từ ngày ký ban hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"8e3aa44e-63f2-4a7c-94fc-ceba7d1c48e5\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e2. Thông tư này thay thế Thông tư số \u003ca href=\"/van-ban/chi-tiet/151002\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e40/2021/TT-BTC\u003c/a\u003e ngày 01 tháng 6 năm 2021 của Bộ trưởng Bộ Tài chính hướng dẫn thuế giá trị gia tăng, thuế thu nhập cá nhân và quản lý thuế đối với hộ kinh doanh, cá nhân kinh doanh; Thông tư số \u003ca href=\"/van-ban/chi-tiet/152502\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e100/2021/TT-BTC\u003c/a\u003e ngày 15 tháng 11 năm 2021 của Bộ trưởng Bộ Tài chính sửa đổi, bổ sung một số điều của Thông tư số \u003ca href=\"/van-ban/chi-tiet/151002\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e40/2021/TT-BTC\u003c/a\u003e ngày 01/6/2021 hướng dẫn thuế giá trị gia tăng, thuế thu nhập cá nhân và quản lý thuế đối với hộ kinh doanh, cá nhân kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4fc281e3-7686-4c7b-807b-f65f7fe8e41b\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e3. Trường hợp các văn bản quy phạm pháp luật quy định viện dẫn tại Thông tư này được sửa đổi, bổ sung hoặc thay thế thì thực hiện theo văn bản được sửa đổi, bổ sung hoặc thay thế đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"f87073e3-3339-4467-ae43-18a9a8c8c554\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e4. Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, đề nghị các đơn vị, cơ sở kinh doanh phản ánh kịp thời về Bộ Tài chính để được giải quyết./\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003ctable border=\"1\" class=\"prov-table\" style=\"border-collapse: collapse; width: 100%; margin: 15px 0;\" id=\"f87073e3-3339-4467-ae43-18a9a8c8c554\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\ c1f-d5486d652d26\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e6. Trường hợp các văn bản quy phạm pháp luật quy định viện dẫn tại Thông tư này được sửa đổi, bổ sung hoặc thay thế thì thực hiện theo văn bản sửa đổi, bổ sung hoặc thay thế đó.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"6b3526c2-ee6e-46c6-8b52-d077702f5008\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003eĐiều 100. Quy định chuyển tiếp\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"abcf844f-f036-45c1-85c9-33d4ba5f14b2\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e1. Đối với các hồ sơ khai thuế có kỳ tính thuế trước ngày 01 tháng 7 năm 2026, người nộp thuế thực hiện theo mẫu biểu áp dụng trước thời điểm Thông tư này có hiệu lực. Các quyết định, thông báo của cơ quan thuế đã ban hành trước ngày Thông tư này có hiệu lực thi hành thì tiếp tục được thực hiện theo nội dung đã ban hành cho đến khi hết thời hạn thực hiện hoặc hết hiệu lực.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"22495c21-7b05-4eb7-9749-da5cd0904340\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e2. Quy định tại điểm c.4 khoản 1; các điểm b, c, d, đ và điểm e.1 khoản 3; khoản 4 Điều 19 Thông tư này thực hiện đến hết ngày 31 tháng 12 năm 2026.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"35d49730-52c6-4fc7-9740-766e3e562f5b\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e3. Khoản tiền thuế, khoản thu khác, tiền chậm nộp, tiền phạt nộp thừa phát sinh trước ngày Thông tư này có hiệu lực thi hành nhưng chưa được xử lý trước ngày Thông tư này có hiệu lực thì được áp dụng quy định tại Thông tư này.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"dabac87f-e3f5-4d6c-ac12-95cda57940be\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e4. Đối với hồ sơ hoàn thuế giá trị gia tăng của dự án đầu tư xây dựng đường cao tốc theo phương thức đối tác công tư theo hình thức hợp đồng xây dựng - kinh doanh - chuyển giao đã được cơ quan thuế tiếp nhận, giải quyết xong hoặc cơ quan thuế tiếp nhận nhưng chưa giải quyết xong trước ngày Thông tư này có hiệu lực thi hành hoặc cơ quan thuế chưa tiếp nhận được áp dụng quy định về thành phần hồ sơ tại điểm b.4.1 khoản 1 Điều 46 Thông tư này.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"650a6fc0-e8d1-4043-b0c2-0c23387ec6b1\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e5. Đối với các hồ sơ hoàn thuế, hồ sơ miễn thuế, giảm thuế, xóa tiền thuế nợ đã phát sinh và được cơ quan thuế, cơ quan nhà nước có thẩm quyền tiếp nhận nhưng đến ngày Thông tư này có hiệu lực thi hành chưa giải quyết xong, cơ quan thuế, cơ quan nhà nước có thẩm quyền tiếp tục thực hiện theo trình tự, thủ tục xử lý hồ sơ áp dụng trước thời điểm Thông tư này có hiệu lực, trừ quy định tại khoản 4, khoản 6 Điều này. Hồ sơ khai thuế mà người nộp thuế đã khai chỉ tiêu đề nghị hoàn trên tờ khai thuế của kỳ tính thuế trước ngày 01 tháng 7 năm 2026 nhưng chưa gửi hồ sơ hoàn thuế đến cơ quan thuế thì áp dụng mẫu biểu đề nghị hoàn thuế theo quy định trước thời điểm Thông tư này có hiệu lực cho đến thời điểm quy định tại khoản 2 Điều 99 Thông tư này. Trường hợp người nộp thuế gửi hồ sơ hoàn thuế đến cơ quan thuế sau thời điểm quy định tại khoản 2 Điều 99 Thông tư này thì thực hiện đề nghị hoàn thuế theo mẫu biểu quy định tại điểm a.2, điểm b.2 khoản 1 hoặc điểm b khoản 2 Điều 46 Thông tư này.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"c3785ebc-97fc-4513-b306-1c817679b462\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e6. Đối với các hồ sơ miễn thuế, giảm thuế, hoàn thuế theo Điều ước quốc tế không phải là Hiệp định thuế đã được cơ quan thuế tiếp nhận trước ngày Thông tư này có hiệu lực thi hành, nếu hồ sơ đáp ứng đầy đủ thành phần, thông tin và tài liệu theo quy định tại Thông tư này thì cơ quan thuế tiếp tục xử lý theo quy định tại Thông tư này.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"dcee102a-8424-47dc-9545-722b095e1de6\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e7. Tổ chức đã tham gia kết nối với Hệ thống thông tin quản lý thuế trước thời điểm Thông tư này có hiệu lực thi hành tiếp tục kết nối nếu vẫn đáp ứng các tiêu chuẩn kỹ thuật kết nối theo quy định tại Thông tư này và Quy chế trao đổi, cung cấp thông tin phục vụ thu ngân sách nhà nước của Cục Thuế; trường hợp không đáp ứng các tiêu chuẩn kỹ thuật kết nối theo quy định thì tổ chức phải hoàn thiện để đảm bảo tiêu chuẩn kỹ thuật kết nối.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"4a3df4fb-f706-4264-bf71-2d08ceca156f\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e8. Đối với các thủ tục kết nối, chia sẻ thông tin giữa cơ quan thuế với cơ quan nhà nước có thẩm quyền, tổ chức, cá nhân trong tiếp nhận và giải quyết thủ tục hành chính thuế cho người nộp thuế bằng phương thức điện tử thực hiện theo mẫu biểu, thủ tục, phương thức giao dịch điện tử đang áp dụng trước thời điểm Thông tư này có hiệu lực, cho đến thời điểm cơ quan thuế thông báo chính thức áp dụng thống nhất trên Hệ thống thông tin quản lý thuế.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-article\" id=\"00941133-c010-45d6-a7ef-cd58d0dcdcc7\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003e\u003cem\u003eĐiều 101. Trách nhiệm thi hành\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"a09746ff-8990-41db-8bdd-6e4b83846d7c\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e1. Cơ quan thuế các cấp có trách nhiệm phổ biến, hướng dẫn các tổ chức, cá nhân, người nộp thuế thực hiện theo nội dung Thông tư này.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" id=\"5ceaf9e0-55b4-4234-973d-1798b32a0ebb\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e2. Tổ chức, cá nhân, người nộp thuế thuộc đối tượng điều chỉnh của Thông tư này thực hiện đầy đủ các hướng dẫn tại Thông tư này.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\" id=\"5ceaf9e0-55b4-4234-973d-1798b32a0ebb\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003eTrong quá trình thực hiện, nếu có khó khăn, vướng mắc, đề nghị các tổ chức, cá nhân phản ánh kịp thời về Bộ Tài chính để được giải quyết./.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp style=\"text-align: center; margin: 0pt 0 0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eDANH MỤC MẪU BIỂU\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: center; margin: 0pt 0 0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e(kèm Thông tư số \u003ca href=\"/van-ban/chi-tiet/c640e240-6005-11f1-bfbb-e599dc202167\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e18/2026/TT-BTC\u003c/a\u003e\u003c/em\u003e\u003cbr\u003e\u003cem\u003e ngày 05 tháng 3 năm 2026 của Bộ trưởng Bộ Tài chính)\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003ctable border=\"1\" class=\"prov-table\" style=\"border-collapse: collapse; width: 100%; margin: 15px 0;\" id=\"5ceaf9e0-55b4-4234-973d-1798b32a0ebb\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"vertical-align: middle; padding: 8px;\"\u003e\n      \u003cp style=\"text-align: center; margin: 2.0pt 0 2.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eSTT\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"vertical-align: middle; padding: 8px;\"\u003e\n      \u003cp style=\"text-align: center; margin: 2.0pt 0 2.0pt; line-height: 1.0\"\u003e\u003cspan style=\"color: #000000; font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eKý hiệu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"vertical-align: middle; padding: 8px;\"\u003e\n      \u00 u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e_______________________\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003e\u003cem\u003eGhi chú:\u003c/em\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003eTNCN: Thu nhập cá nhân\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003eGTGT: Giá trị gia tăng\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003eTTĐB: Tiêu thụ đặc biệt\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003eBVMT: Bảo vệ môi trường\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e-\u003c/em\u003e \u003cem\u003eChỉ tiêu [01a]: dành cho hộ kinh doanh, cá nhân kinh doanh có doanh thu năm trên 50 tỷ đồng.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e-\u003c/em\u003e \u003cem\u003eChỉ tiêu [01b]: dành cho hộ kinh doanh, cá nhân kinh doanh có doanh thu năm trên 01 tỷ đồng đến 50 tỷ đồng.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e-\u003c/em\u003e \u003cem\u003eChỉ tiêu [01c]: dành cho hộ kinh doanh, cá nhân kinh doanh thực hiện khai và nộp thuế trước khi được cơ quan thuế cấp hóa đơn điện tử có mã của cơ quan thuế theo từng lần phát sinh.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e-\u003c/em\u003e \u003cem\u003eSố thuế được miễn: là số tiền thuế phát sinh phải nộp được miễn theo mức quy định của Chính phủ.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e-\u003c/em\u003e \u003cem\u003eTrường hợp hộ kinh doanh, cá nhân kinh doanh nộp thuế thu nhập cá nhân theo phương pháp thuế suất nhân (x) với doanh thu tính thuế thì hộ kinh doanh, cá nhân kinh doanh kê khai doanh thu và số thuế giá trị gia tăng, thuế thu nhập cá nhân phải nộp theo từng địa điểm kinh doanh.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e-\u003c/em\u003e \u003cem\u003eTrường hợp hộ kinh doanh, cá nhân kinh doanh nộp thuế thu nhập cá nhân theo phương pháp thuế suất thu nhập tính thuế nhân (x) với thuế suất thì hộ kinh doanh, cá nhân kinh doanh kê khai doanh thu từng địa điểm kinh doanh và thực hiện nộp thuế giá trị gia tăng theo từng địa điểm kinh doanh, tạm nộp thuế thu nhập cá nhân tại trụ sở chính.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e-\u003c/em\u003e \u003cem\u003eChỉ tiêu [14]: Đối với cá nhân kinh doanh nộp thuế thu nhập cá nhân trên doanh thu tính thuế có nhiều ngành, nghề kinh doanh áp dụng thuế suất thuế thu nhập cá nhân khác nhau, có nhiều địa điểm kinh doanh thì được lựa chọn một (01) ngành, nghề hoặc một (01) địa điểm kinh doanh để áp dụng mức trừ 01 tỷ đồng trước khi tính thuế thu nhập cá nhân theo phương án có lợi nhất. Trường hợp ngành, nghề, địa điểm kinh doanh được lựa chọn chưa trừ đủ 01 tỷ đồng, cá nhân được tiếp tục lựa chọn thêm ngành, nghề, địa điểm kinh doanh khác để tiếp tục được trừ cho đến khi đủ 01 tỷ đồng.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e-\u003c/em\u003e \u003cem\u003eChỉ tiêu [3.1], [3.2]... tại khoản III, mục C: bao gồm khoáng sản và đất đá bóc, đất đá thải (nếu có).\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cem\u003e-\u003c/em\u003e \u003cem\u003eHệ số K tính phí bảo vệ môi trường đối với khai thác khoáng sản thực hiện theo quy định tại Nghị định số \u003ca href=\"/van-ban/chi-tiet/160628\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e27/2023/NĐ-CP\u003c/a\u003e và các văn bản sửa đổi bổ sung (nếu có).\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003ctable border=\"1\" class=\"prov-table\" style=\"border-collapse: collapse; width: 100%; margin: 15px 0;\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"background-color: #FFFFFF; padding: 8px;\"\ ơ khai thuế và lựa chọn một (01) cơ quan thuế nơi có bất động sản cho thuê để nộp hồ sơ khai thuế (trừ trường hợp tổ chức là bên đi thuê khai thuế thay, nộp thuế thay). Cá nhân thực hiện kê khai doanh thu, sổ thuế giá trị gia tăng, thuế thu nhập cá nhân phải nộp và nộp thuế theo từng địa điểm nơi có bất động sản cho thuê.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e____________________\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify; margin: 0pt 0 6.0pt; line-height: 1.0\"\u003e\u003cspan style=\"vertical-align: super; font-family: Arial, serif; font-size: 6.5pt\"\u003e26\u003c/span\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e Mẫu số 01/BĐS được thay thế bởi mẫu số 01/BĐS theo quy định tại Điều 3 của Thông tư số \u003ca href=\"/van-ban/chi-tiet/79c0b370-6643-11f1-b521-4310dea161ea\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e50/2026/TT-BTC\u003c/a\u003e, có hiệu lực kể từ ngày 13 tháng 5 năm 2026\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003ctable border=\"1\" class=\"prov-table\" style=\"border-collapse: collapse; width: 100%; margin: 15px 0;\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"background-color: #FFFFFF; padding: 8px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"background-color: #FFFFFF; padding: 8px;\"\u003e\n      \u003cp style=\"text-align: center; margin: 0pt 0 0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 10.0pt\"\u003e\u003cstrong\u003eMẫu số: 01/BK-BĐS\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp style=\"text-align: center; margin: 0pt 0 0pt; line-height: 1.0\"\u003e\u003cspan style=\"font-family: Arial, serif; font-size: 1
