icialGazette\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem 56-dcc326b2041b88f5.js\",\"119\",\"static/chunks/119-af8d6d47e84615fe.js\",\"6625\",\"static/chunks/6625-1107db2d5233eb73.js\",\"3954\",\"static/chunks/3954-946ccf0eafc577be.js\",\"5292\",\"static/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:T6496,"])</script><script>self.__next_f.push([1,"\u003chtml\u003e\n \u003chead\u003e\u003c/head\u003e\n \u003cbody\u003e\n  \u003cdiv\u003e\n   \u003ctable border=\"0\" style=\"width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 20px; border: none;\"\u003e\n    \u003ctbody\u003e\n     \u003ctr\u003e\n      \u003ctd style=\"vertical-align: top; text-align: center; border: none; padding: 5px; font-family: 'Times New Roman', serif;\"\u003e\n       \u003cp\u003e\u003cstrong\u003eBỘ KHOA HỌC VÀ CÔNG NGHỆ\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\n       \u003cp\u003eSố: 17/2025/TT-BKHCN\u003c/p\u003e\u003c/td\u003e\n      \u003ctd style=\"vertical-align: top; text-align: center; border: none; padding: 5px; font-family: 'Times New Roman', serif;\"\u003e\n       \u003cp\u003e\u003cstrong\u003eCỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM\u003cbr\u003e\n          Độc lập - Tự do - Hạnh phúc \u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\n       \u003cp\u003e\u003cem\u003e Hà Nội, ngày 05 tháng 9 năm 2025\u003c/em\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003c/tr\u003e\n    \u003c/tbody\u003e\n   \u003c/table\u003e\n   \u003cp align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003c/p\u003e\n   \u003cp align=\"center\"\u003e\u003cb\u003e\u003cspan\u003eTHÔNG TƯ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"text-align: center;\"\u003e\u003cstrong\u003eQUY ĐỊNH YÊU CẦU KỸ THUẬT PHỤC VỤ LIÊN THÔNG VỚI \u003c/strong\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"text-align: center; font-family: 'Times New Roman', Times, serif;\"\u003e\u003cstrong\u003eTRUNG TÂM CHỨNG THỰC ĐIỆN TỬ QUỐC GIA\u003c/strong\u003e\u003c/p\u003e\n   \u003cp\u003e\u003ci\u003e\u003cspan\u003eCăn cứ\u003cspan\u003e \u003c/span\u003eLuật giao dịch điện tử số 20/2023/QH15;\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp\u003e\u003ci\u003e\u003cspan\u003eCăn cứ\u003cspan\u003e \u003c/span\u003eLuật Ban hành văn bản quy phạm pháp luật số 64/2025/QH15\u003cspan\u003e\u0026nbsp;\u003c/span\u003eđược sửa đổi, bổ sung bởi Luật số\u003cspan\u003e \u003c/span\u003e87/2025/QH15;\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp\u003e\u003ci\u003e\u003cspan\u003eCăn cứ Nghị định số\u003cspan\u003e \u003c/span\u003e68/2024/NĐ-CP\u003cspan\u003e\u0026nbsp;\u003c/span\u003engày 25 tháng 6 năm 2024 của Chính phủ quy định về Chữ ký số chuyên dùng công vụ;\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp\u003e\u003ci\u003e\u003cspan\u003eCăn cứ Nghị định số\u003cspan\u003e \u003c/span\u003e23/2025/NĐ-CP\u003cspan\u003e\u0026nbsp;\u003c/span\u003engày 21 tháng 02 năm 2025 của Chính phủ quy định về chữ ký điện tử và dịch vụ tin cậy;\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp\u003e\u003ci\u003e\u003cspan\u003eCăn cứ Nghị định số\u003cspan\u003e \u003c/span\u003e55/2025/NĐ-CP\u003cspan\u003e\u0026nbsp;\u003c/span\u003engày 02 tháng 3 năm 2025 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Khoa học và Công nghệ;\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp\u003e\u003ci\u003e\u003cspan\u003eTheo đề nghị của Giám đốc Trung tâm Chứng thực điện tử quốc gia;\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp\u003e\u003ci\u003e\u003cspan\u003eBộ trưởng Bộ Khoa học và Công nghệ ban hành Thông tư quy định yêu cầu kỹ thuật phục vụ liên thông với Trung tâm Chứng thực điện tử quốc gia.\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp id=\"82296970-2fee-11f1-b086-7160394dc6e1\" class=\"prov-article\" style=\"font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều\u0026nbsp;1. Phạm vi điều chỉnh\u003c/b\u003e\u003c/strong\u003e\u003c/p\u003e\n   \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003eThông tư này quy định yêu cầu kỹ thuật phục vụ việc liên thông của Trung tâm Chứng thực điện tử quốc gia với tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng, với tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ; việc cập nhật trạng thái của chứng thư chữ ký điện tử nước ngoài vào hệ thống chứng thực dịch vụ tin cậy.\u003c/p\u003e\n   \u003cp id=\"82299080-2fee-11f1-842f-635a7c2ffd7d\" class=\"prov-article\" style=\"font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều\u0026nbsp;2. Đối tượng áp dụng\u003c/b\u003e\u003c/strong\u003e\u003c/p\u003e\n   \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003eThông tư này áp dụng đối với tổ chức, cá nhân sau:\u003c/p\u003e\n   \u003cp id=\"8229dea0-2fee-11f1-a4da-55dd1ddb9e83\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e1. Tổ chức cung cấp dịch vụ chứng thực điện tử quốc gia.\u003c/p\u003e\n   \u003cp id=\"bedca850-2fee-11f1-b5d9-231ba0fc909b\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e2. Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ.\u003c/p\u003e\n   \u003cp id=\"bedd6ba0-2fee-11f1-af25-5b5e424afab9\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e3. Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng.\u003c/p\u003e\n   \u003cp id=\"bede2ef0-2fee-11f1-9816-2b14e6bcbc3a\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e4. Tổ chức cung cấp dịch vụ chứng thực chữ ký điện tử nước ngoài được công nhận tại Việt Nam; cơ quan, tổ chức, cá nhân sử dụng chữ ký điện tử, chứng thư chữ ký điện tử nước ngoài được công nhận tại Việt Nam.\u003c/p\u003e\n   \u003cp id=\"bedef240-2fee-11f1-90b0-f9ce370df10a\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e5. Cơ quan, tổ chức, cá nhân khác có liên quan.\u003c/p\u003e\n   \u003cp id=\"822a05b0-2fee-11f1-b2cf-a91fa00bef48\" class=\"prov-article\" style=\"font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều\u0026nbsp;3. Giải thích từ ngữ\u003c/b\u003e\u003c/strong\u003e\u003c/p\u003e\n   \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003eTrong Thông tư này, các từ ngữ dưới đây được hiểu như sau:\u003c/p\u003e\n   \u003cp id=\"822a2cc0-2fee-11f1-aa17-cf07a3fd2bfb\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e1. “Chứng thư chữ ký số gốc của Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ” là chứng thư chữ ký số do Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ tự cấp cho mình.\u003c/p\u003e\n   \u003cp id=\"822a53d0-2fee-11f1-9482-d360d759b396\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e2. “Chứng thư chữ ký số chuyên dùng công vụ” là chứng thư chữ ký số do Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ cấp cho thuê bao.\u003c/p\u003e\n   \u003cp id=\"822a7ae0-2fee-11f1-acb8-77dee61fc308\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e3. “Mô hình công nhận chéo” là mô hình liên thông của hai Tổ chức cung cấp dịch vụ chứng thực chữ ký số, trong đó, các cơ quan, tổ chức và cá nhân sử dụng chứng thư chữ ký số được cấp bởi Tổ chức cung cấp dịch vụ chứng thực chữ ký số này tin cậy các chứng thư chữ ký số gốc của Tổ chức cung cấp dịch vụ chứng thực chữ ký số kia và ngược lại.\u003c/p\u003e\n   \u003cp id=\"822aa1f0-2fee-11f1-b831-cbc90c595ae4\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e4. “Danh sách chứng thư chữ ký số gốc tin cậy của Trung tâm Chứng thực điện tử quốc gia và Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ” gồm: Các chứng thư chữ ký số gốc của Trung tâm Chứng thực điện tử quốc gia và các chứng thư chữ ký số gốc của Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ.\u003c/p\u003e\n   \u003cp id=\"822ac900-2fee-11f1-ac84-af6683c219df\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e5. “Danh sách tin cậy” là tập hợp chứng thư chữ ký điện tử nước ngoài đã và đang được công nhận tại Việt Nam.\u003c/p\u003e\n   \u003cp id=\"822af010-2fee-11f1-8e04-d7f039eadf15\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e6. “Mô hình danh sách tin cậy” là mô hình phục vụ kiểm tra trạng thái chứng thư chữ ký điện tử, chữ ký điện tử nước ngoài trong Danh sách tin cậy.\u003c/p\u003e\n   \u003cp id=\"822b1720-2fee-11f1-a37e-83494b116210\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e7. “Hệ thống thông tin phục vụ liên thông của Trung tâm Chứng thực điện tử quốc gia với Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ” là tập hợp phần cứng, phần mềm và cơ sở dữ liệu được sử dụng phục vụ mục đích bảo đảm cho việc kiểm tra hiệu lực chữ ký số chuyên dùng công vụ và công bố danh sách chứng thư chữ ký số gốc tin cậy của Trung tâm Chứng thực điện tử quốc gia và Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ.\u003c/p\u003e\n   \u003cp id=\"822b6540-2fee-11f1-9053-517745975e25\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e8. “Hệ thống chứng thực dịch vụ tin cậy” là tập hợp phần cứng, phần mềm và cơ sở dữ liệu được sử dụng phục vụ mục đích công bố Danh sách tin cậy và thực hiện việc cập nhật trạng thái của chứng thư chữ ký điện tử nước ngoài được công nhận tại Việt Nam. Hệ thống chứng thực dịch vụ tin cậy được quản lý và vận hành bởi Tổ chức cung cấp dịch vụ chứng thực điện tử quốc gia.\u003c/p\u003e\n   \u003cp id=\"822bb360-2fee-11f1-be98-73521250454d\" class=\"prov-article\" style=\"font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều\u0026nbsp;4. Yêu cầu kỹ thuật về việc liên thông của Trung tâm Chứng thực điện tử quốc gia với Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng, Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ\u003c/b\u003e\u003c/strong\u003e\u003c/p\u003e\n   \u003cp id=\"822bda70-2fee-11f1-8856-2327ec9e8b89\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e1. Hệ thống thông tin phải bảo đảm cho việc kiểm tra trạng thái chứng thư chữ ký điện tử, chứng thư chữ ký số và kiểm tra hiệu lực chữ ký số, cụ thể:\u003c/p\u003e\n   \u003cp id=\"822c0180-2fee-11f1-b9fe-016ac1595bd1\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ea) Việc liên thông của Trung tâm Chứng thực điện tử quốc gia với tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng theo phương thức Tổ chức cung cấp dịch vụ chứng thực chữ ký số quốc gia cấp chứng thư chữ ký số cho Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng theo quy định tại Điều 4 Nghị định số 23/2025/NĐ-CP\u0026nbsp;ngày 21 tháng 02 năm 2025 của Chính phủ quy định về chữ ký điện tử và dịch vụ tin cậy (sau đây gọi là Nghị định số 23/2025/NĐ-CP);\u003c/p\u003e\n   \u003cp id=\"822c2890-2fee-11f1-8ff4-45fc09054a5d\" class=\"prov-item\" style=\"font-size: 14px;\"\u003eb) Việc liên thông của Trung tâm Chứng thực điện tử quốc gia với Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ theo mô hình công nhận chéo.\u003c/p\u003e\n   \u003cp id=\"822c289a-2fee-11f1-a881-1da74274b613\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e2. Hệ thống thông tin phục vụ liên thông của Trung tâm Chứng thực điện tử quốc gia với Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng, Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ phải có công cụ, biện pháp để bảo vệ dữ liệu và xác thực dữ liệu trong quá trình kết nối liên thông, cụ thể gồm các nội dung sau:\u003c/p\u003e\n   \u003cp id=\"822c76b0-2fee-11f1-ac0a-810216651e16\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ea) Có giao diện công bố danh sách chứng thư chữ ký số gốc tin cậy của Trung tâm Chứng thực điện tử quốc gia và Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ, chứng thư chữ ký số của Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng hoạt động 24/7; có cơ chế đảm bảo kiểm soát quyền truy cập hệ thống và không bị chỉnh sửa trái phép;\u003c/p\u003e\n   \u003cp id=\"822c9dc0-2fee-11f1-8217-dbc82f97cff4\" class=\"prov-item\" style=\"font-size: 14px;\"\u003eb) Quản lý, lưu trữ an toàn Danh sách chứng thư chữ ký số gốc tin cậy của Trung tâm Chứng thực điện tử quốc gia và Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ, chứng thư chữ ký số của Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng đảm bảo tính chính xác, không bị chỉnh sửa trái phép của dữ liệu trong quá trình trao đổi thông tin phục vụ liên thông;\u003c/p\u003e\n   \u003cp id=\"822cc4d0-2fee-11f1-a302-071d3d8cd4ea\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ec) Tuân thủ các quy định của pháp luật về bảo vệ dữ liệu cá nhân, các quy định về xác thực dữ liệu tại Điều 20 Luật Dữ liệu 60/2024/QH15\u0026nbsp;và các quy định pháp luật khác có liên quan.\u003c/p\u003e\n   \u003cp id=\"822cebe0-2fee-11f1-871f-790f26495f63\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e3. Các điều\u0026nbsp;kiện kỹ thuật phục vụ liên thông, kết nối cung cấp thông tin để kiểm tra trạng thái chứng thư chữ ký số và kiểm tra hiệu lực chữ ký số, cụ thể như sau:\u003c/p\u003e\n   \u003cp id=\"822d12f0-2fee-11f1-a3f6-e9b0e752afa0\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ea) Danh sách chứng thư chữ ký số gốc tin cậy của Trung tâm Chứng thực điện tử quốc gia và Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ, chứng thư chữ ký số của Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng được công bố đầy đủ, chính xác trên giao diện công bố quy định tại điểm a khoản 2 Điều này;\u003c/p\u003e\n   \u003cp id=\"822d3a00-2fee-11f1-8aca-2367be7e9d37\" class=\"prov-item\" style=\"font-size: 14px;\"\u003eb) Các trường thông tin trong chứng thư chữ ký số gốc của Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ theo quy định Danh mục tiêu chuẩn và các yêu cầu kỹ thuật bắt buộc áp dụng đối với hệ thống chứng thực chữ ký số chuyên dùng công vụ; các trường thông tin trong chứng thư chữ ký số gốc của Trung tâm Chứng thực điện tử quốc gia và Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng phải tuân thủ yêu cầu kỹ thuật và tiêu chuẩn quy chuẩn theo quy định của Bộ Khoa học và Công nghệ.\u003c/p\u003e\n   \u003cp id=\"822d6110-2fee-11f1-8179-0dbba9dd79be\" class=\"prov-article\" style=\"font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều\u0026nbsp;5. Yêu cầu kỹ thuật về việc cập nhật trạng thái của chứng thư chữ ký điện tử nước ngoài vào Hệ thống chứng thực dịch vụ tin cậy\u003c/b\u003e\u003c/strong\u003e\u003c/p\u003e\n   \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003eYêu cầu kỹ thuật về việc cập nhật trạng thái của chứng thư chữ ký điện tử nước ngoài vào hệ thống chứng thực dịch vụ tin cậy được quy định như sau:\u003c/p\u003e\n   \u003cp id=\"822d611a-2fee-11f1-994b-5594bbb559a9\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e1. Mô hình cập nhật trạng thái của chứng thư chữ ký điện tử nước ngoài vào hệ thống chứng thực dịch vụ tin cậy là mô hình danh sách tin cậy phục vụ việc kiểm tra trạng thái chứng thư chữ ký điện tử, chứng thư chữ ký số và kiểm tra hiệu lực chữ ký số theo quy định tại khoản 1 Điều 30 Nghị định số 23/2025/NĐ-CP.\u003c/p\u003e\n   \u003cp id=\"822d8820-2fee-11f1-8f98-692e99a9ef1f\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e2. Hệ thống chứng thực dịch vụ tin cậy sử dụng để cập nhật trạng thái của chứng thư chữ ký điện tử nước ngoài phải có công cụ, biện pháp để bảo vệ dữ liệu và xác thực dữ liệu trong quá trình cập nhật trạng thái, cụ thể:\u003c/p\u003e\n   \u003cp id=\"822dfd50-2fee-11f1-b9aa-33ec88107e20\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ea) Có giao diện công bố Danh sách tin cậy hoạt động 24/7; có cơ chế đảm bảo kiểm soát quyền truy cập hệ thống và không bị chỉnh sửa trái phép;\u003c/p\u003e\n   \u003cp id=\"822e2460-2fee-11f1-924a-e3947dc69449\" class=\"prov-item\" style=\"font-size: 14px;\"\u003eb) Quản lý, lưu trữ an toàn Danh sách tin cậy đảm bảo tính chính xác, không bị chỉnh sửa trái phép của dữ liệu trong quá trình trao đổi thông tin phục vụ liên thông;\u003c/p\u003e\n   \u003cp id=\"822e4b70-2fee-11f1-9186-3fcdf0b7d3e1\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ec) Tuân thủ các quy định của pháp luật về bảo vệ dữ liệu cá nhân, các quy định về xác thực dữ liệu tại Điều 20 Luật Dữ liệu 60/2024/QH15\u0026nbsp;và các quy định pháp luật khác có liên quan.\u003c/p\u003e\n   \u003cp id=\"822e7280-2fee-11f1-bb15-65d502fc8174\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e3. Các trường thông tin trong chứng thư chữ ký điện tử nước ngoài được công nhận tại Việt Nam phải tuân thủ tiêu chuẩn, quy chuẩn theo quy định của Bộ Khoa học và Công nghệ để phục vụ việc để kiểm tra trạng thái chứng thư chữ ký điện tử, chứng thư chữ ký số và kiểm tra hiệu lực chữ ký số theo quy định tại khoản 3 Điều 30 Nghị định số 23/2025/NĐ-CP.\u003c/p\u003e\n   \u003cp id=\"822e9990-2fee-11f1-9d96-1156f270ab0b\" class=\"prov-article\" style=\"font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều\u0026nbsp;6. Tổ chức thực hiện\u003c/b\u003e\u003c/strong\u003e\u003c/p\u003e\n   \u003cp id=\"822ec0a0-2fee-11f1-af89-113b1a129cfe\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e1. Đối với Trung tâm Chứng thực điện tử quốc gia\u003c/p\u003e\n   \u003cp id=\"822ee7b0-2fee-11f1-a028-d7ac0a61f492\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ea) Chủ trì, phối hợp với Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ hướng dẫn việc thực hiện quy định về các trường thông tin trong chứng thư chữ ký số của thuê bao; đảm bảo việc trao đổi các chứng thư chữ ký số gốc tin cậy của Trung tâm Chứng thực điện tử quốc gia và Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ chính xác và an toàn;\u003c/p\u003e\n   \u003cp id=\"822f0ec0-2fee-11f1-aea5-8d280b794137\" class=\"prov-item\" style=\"font-size: 14px;\"\u003eb) Quản lý và vận hành Hệ thống thông tin của Trung tâm Chứng thực điện tử quốc gia phục vụ liên thông giữa Trung tâm Chứng thực điện tử quốc gia với Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ;\u003c/p\u003e\n   \u003cp id=\"822f35d0-2fee-11f1-909e-39e545733142\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ec) Công bố danh sách chứng thư chữ ký số gốc tin cậy của Trung tâm Chứng thực điện tử quốc gia trên trang thông tin điện tử https://www.rootca.gov.vn;\u003c/p\u003e\n   \u003cp id=\"822f5ce0-2fee-11f1-ad89-93fad1ae1334\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ed) Tạo lập, công bố và cập nhật Danh sách tin cậy các chứng thư chữ ký điện tử nước ngoài được công nhận tại Việt Nam khi có sự thay đổi;\u003c/p\u003e\n   \u003cp id=\"822f83f0-2fee-11f1-8d83-a9d220318310\" class=\"prov-item\" style=\"font-size: 14px;\"\u003eđ) Rà soát, trình Bộ Khoa học và Công nghệ cập nhật, ban hành danh sách các chứng thư chữ ký số gốc tin cậy khi có sự thay đổi về các chứng thư chữ ký số gốc của Trung tâm Chứng thực điện tử quốc gia và Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ.\u003c/p\u003e\n   \u003cp id=\"822fab00-2fee-11f1-99b0-b9ee138b59aa\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e2. Đối với Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ:\u003c/p\u003e\n   \u003cp id=\"822fd210-2fee-11f1-9743-11809f99aaee\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ea) Thực hiện hướng dẫn về các trường thông tin trong chứng thư chữ ký số chuyên dùng công vụ;\u003c/p\u003e\n   \u003cp id=\"822ff920-2fee-11f1-b438-7b37d0092951\" class=\"prov-item\" style=\"font-size: 14px;\"\u003eb) Quản lý và vận hành Hệ thống thông tin của Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ phục vụ liên thông Trung tâm Chứng thực điện tử quốc gia với Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ của Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ;\u003c/p\u003e\n   \u003cp id=\"82304740-2fee-11f1-a214-4138ace6e4aa\" class=\"prov-item\" style=\"font-size: 14px;\"\u003ec) Công bố danh sách chứng thư chữ ký số gốc tin cậy của Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ trên trang thông tin điện tử https://ca.gov.vn.\u003c/p\u003e\n   \u003cp id=\"82306e50-2fee-11f1-a118-b35bc2d393f3\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e3. Các Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng có trách nhiệm thực hiện quy định về các trường thông tin trong chứng thư chữ ký số công cộng.\u003c/p\u003e\n   \u003cp id=\"82309560-2fee-11f1-819f-5303eebaab6c\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e4. Các Tổ chức cung cấp dịch vụ chứng thực chữ ký điện tử nước ngoài được công nhận tại Việt Nam và các thuê bao sử dụng chữ ký điện tử, chứng thư chữ ký điện tử nước ngoài được công nhận tại Việt Nam có trách nhiệm cập nhật trạng thái của chứng thư chữ ký điện tử nước ngoài vào hệ thống chứng thực dịch vụ tin cậy trực tiếp hoặc trực tuyến theo hướng dẫn kỹ thuật của Tổ chức cung cấp dịch vụ chứng thực chữ ký điện tử quốc gia và sử dụng đúng quyền hạn, phạm vi, mục đích sử dụng của chứng thư chữ ký điện tử nước ngoài được công nhận tại Việt Nam.\u003c/p\u003e\n   \u003cp id=\"8230bc70-2fee-11f1-8d31-fdcbb01bff9f\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e5. Cơ quan, tổ chức, cá nhân phát triển phần mềm sử dụng chữ ký số có trách nhiệm thực hiện quy định đối với chức năng ký số, kiểm tra hiệu lực chứng thư chữ ký số, chữ ký số của các ứng dụng sử dụng chữ ký số theo yêu cầu kỹ thuật đối với phần mềm ký số, phần mềm kiểm tra chữ ký số của Bộ Khoa học và Công nghệ.\u003c/p\u003e\n   \u003cp id=\"8230e380-2fee-11f1-817b-0d629b97aea1\" class=\"prov-article\" style=\"font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều\u0026nbsp;7. Điều khoản thi hành\u003c/b\u003e\u003c/strong\u003e\u003c/p\u003e\n   \u003cp id=\"82310a90-2fee-11f1-b8a3-75e577490177\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e1. Thông tư này có hiệu lực thi hành kể từ ngày ký ban hành.\u003c/p\u003e\n   \u003cp id=\"823131a0-2fee-11f1-8e70-53a94d3fef78\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e2. Thông tư số 04/2019/TT-BTTTT\u0026nbsp;ngày 05 tháng 7 năm 2019 của Bộ trưởng Bộ Thông tin và Truyền thông quy định việc liên thông giữa Tổ chức cung cấp dịch vụ chứng thực chữ ký số quốc gia và Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng Chính phủ hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành.\u003c/p\u003e\n   \u003cp id=\"823158b0-2fee-11f1-b180-c7f2184ce7c0\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e3. Chánh Văn phòng, Vụ trưởng Vụ Kinh tế và Xã hội số, Giám đốc Trung tâm Chứng thực điện tử quốc gia, Thủ trưởng Tổ chức cung cấp dịch vụ chứng thực chữ ký số chuyên dùng công vụ, Tổ chức cung cấp dịch vụ chứng thực chữ ký số công cộng, Tổ chức cung cấp dịch vụ chứng thực chữ ký điện tử nước ngoài được công nhận tại Việt Nam, Thủ trưởng các cơ quan, đơn vị thuộc Bộ, tổ chức và cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này.\u003c/p\u003e\n   \u003cp id=\"82317fc0-2fee-11f1-b7f6-ab8950c2fd75\" class=\"prov-clause\" style=\"font-size: 14px;\"\u003e4. Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, cơ quan, tổ chức và cá nhân phản ánh kịp thời về Bộ Khoa học và Công nghệ để xem xét, giải quyết./.\u003c/p\u003e\n   \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n   \u003ctable border=\"0\" cellspacing=\"0\" cellpadding=\"0\" width=\"100%\" style=\"border-collapse: collapse; width: 100%; border-spacing: 0px; border-color: #ffffff;\"\u003e\n    \u003ctbody\u003e\n     \u003ctr\u003e\n      \u003ctd width=\"54%\" valign=\"top\" style=\"border-color: #ffffff;\"\u003e\n       \u003cp\u003e\u003cb\u003e\u003ci\u003e\u003cspan\u003e\u003cbr\u003e\n            Nơi nh\u003c/span\u003eận:\u003c/i\u003e\u003c/b\u003e\u003cbr\u003e\u003cspan\u003e- Th\u003c/span\u003e\u003cspan\u003eủ tướng, các Phó Thủ tướng Chính phủ;\u003cbr\u003e\u003c/span\u003e\u003cspan\u003e- Các B\u003c/span\u003e\u003cspan\u003eộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ;\u003cbr\u003e\u003c/span\u003e\u003cspan\u003e- UBND các t\u003c/span\u003e\u003cspan\u003eỉnh, thành phố trực thuộc TW;\u003cbr\u003e\u003c/span\u003e\u003cspan\u003e- S\u003c/span\u003e\u003cspan\u003eở KHCN các tỉnh, thành phố trực thuộc TW;\u003cbr\u003e\u003c/span\u003e\u003cspan\u003e- C\u003c/span\u003e\u003cspan\u003eục Kiểm tra văn bản QPPL (Bộ Tư pháp);\u003cbr\u003e\u003c/span\u003e\u003cspan\u003e- Công báo, C\u003c/span\u003e\u003cspan\u003eổng thông tin điện tử Chính phủ;\u003cbr\u003e\u003c/span\u003e\u003cspan\u003e- B\u003c/span\u003e\u003cspan\u003eộ KH\u0026amp;CN: Bộ trưởng và các Thứ trưởng, các cơ quan, đơn vị thuộc Bộ;\u003cbr\u003e\u003c/span\u003e\u003cspan\u003e- C\u003c/span\u003e\u003cspan\u003eổng thông tin điện tử Bộ;\u003cbr\u003e\u003c/span\u003e\u003cspan\u003e- Lưu: VT, NEAC (20b).\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n      \u003ctd width=\"45%\" valign=\"top\" style=\"border-color: #ffffff;\"\u003e\n       \u003cp align=\"center\"\u003e\u003cb\u003e\u003cspan\u003eB\u003c/span\u003eỘ TRƯỞNG\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cem\u003e(Đã ký)\u003c/em\u003e\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eNguyễn Mạnh Hùng\u003c/b\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003c/tr\u003e\n    \u003c/tbody\u003e\n   \u003c/table\u003e\n   \u003cp align=\"center\" style=\"font-family: 'Times New Roman', serif; font-size: 14px; text-align: center;\"\u003e\u003c/p\u003e\n  \u003c/div\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Thông tư số 17/2025/TT-BKHCN Quy định yêu cầu kỹ thuật phục vụ liên thông với Trung tâm Chứng
