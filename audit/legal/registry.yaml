  38/2019/QH14:
    title: Luật Quản lý thuế 2019
    status: HET_HIEU_LUC
    replaced_by: 108/2025/QH15 (hiệu lực 01/7/2026; luật 38/2019 hết hiệu lực hết ngày 30/6/2026)
    basis: ORIGINAL
    read: '2026-11-18'
    source: https://vanban.chinhphu.vn/?pageid=27160&docid=197312 + https://vbpl.vn/van-ban/chi-tiet/luat-quan-ly-thue-so-38-2019-qh14--136036
      (audit/legal/src/38_2019_QH14.pdf sha256=a8efac5685b982e4, 38_2019_vbpl.html sha256=280bae9a8aff727f)
    note: 'Điều 58 luật cũ: ngày đã nộp thuế = ngày ngân hàng trích tiền (nộp không bằng tiền mặt). Luật mới Điều 14 khoản
      5 điểm a: nộp điện tử → ngày cơ quan/tổ chức trích tiền từ tài khoản người nộp thuế hoặc người nộp thay; điểm b: nộp
      trực tiếp → ngày thu tiền ghi trên chứng từ thu tiền.'
