    keys: ["toolformer", "tunphomo", "tulformer", "toolfomer", "tunphocmo", "toolforma"]
  - key: "swebench"
    variants: ["SWE-bench", "Xuy ben-chờ", "Xuy-bếch"]
    negative: "Xuy phen-chờ"
    keys: ["swebench", "swebenc", "xuybench", "xuybencho", "swibench", "suybench"]
  - key: "wikipedia"
    variants: ["Wikipedia", "Uy-ki-pi-đi-a", "Wi-ki-pê-đi-a"]
