name: agt_p2_hanh_trinh
# Vòng 2 (2026-11-02, bài L12 hành trình tác tử dùng công cụ): tên phương pháp / bộ đề cần gọi tên nguồn trong lời đọc.
ctx:
  - "Theo {}, ta xét hệ thống này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
