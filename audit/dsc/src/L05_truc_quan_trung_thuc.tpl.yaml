- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">cột: so chiều dài, trục từ 0</span><span class="a">→</span>
      <span class="n">đường: trục tuỳ ý, ghi rõ</span><span class="a">→</span>
      <span class="n">không trục kép, không 3D</span><span class="a">→</span>
      <span class="n">hệ số nói dối gần 1</span></div>
    say: Tổng kết lại, biểu đồ cột so chiều dài nên trục từ 0, biểu đồ đường thì trục tuỳ ý nhưng ghi rõ. Không dùng trục kép, không dùng hình ba chiều, và giữ hệ số nói dối gần 1. Biểu đồ không chỉ là hình minh họa đẹp mắt mà là một lập luận bằng hình ảnh cần trung thực tuyệt đối với tỉ lệ định lượng của số liệu gốc. Biểu đồ cột biểu diễn độ lớn bằng chiều dài thanh nên đáy trục tung bắt buộc xuất phát từ không để mắt người xem không hiểu nhầm chênh lệch vài phần trăm thành gấp đôi. Biểu đồ đường cho phép thu phóng trục tung nhằm quan sát độ dốc xu hướng với điều kiện phải chú thích rõ phạm vi giá trị trên mặt biểu đồ. Tránh dùng biểu đồ ba chiều làm méo góc nhìn hay trục tung kép hai đơn vị khác nhau dễ đánh lạc hướng người đọc ngay trong vài giây lướt qua. Ngoài ra việc kiểm tra hệ số phóng đại giữa diện tích hình vẽ và tỉ số dữ liệu thực tế giúp giữ sự trung thực trong mọi báo cáo trình bày. Một mẫu nhỏ lấy thiên lệch về những người chịu trả lời hay những ca bệnh nhập viện nặng không đại diện cho cả cộng đồng lớn. Mở rộng cỡ mẫu gấp mười lần nhưng giữ nguyên cách chọn thiên lệch chỉ giúp bạn tự tin hơn vào một kết luận sai. Trước khi phân tích, luôn hỏi xem dữ liệu đã chạm tới những người im lặng hoặc những giao dịch thất bại chưa. Khi tổng hợp kết quả khảo sát hay nhật ký ứng dụng, phần người dùng im lặng không để lại phản hồi thường mang tính quyết định đối với bức tranh toàn cảnh. Trước khi chốt bất kỳ nhận định nào từ mẫu lớn, hãy kiểm xem quy trình lấy mẫu có loại bỏ người rời bỏ sớm hay người dùng thiết bị cũ hay không. Mở rộng dữ liệu mà giữ nguyên sai lệch chọn mẫu chỉ làm sai số hệ thống bám chặt hơn. Kết hợp kiểm định trên một tập ngẫu nhiên nhỏ giúp hiệu chỉnh lại ước lượng thiên lệch một cách an toàn và minh bạch. Việc đặt câu hỏi về phần dữ liệu bị thiếu ngay từ bước đầu giúp tránh tự tin sai chỗ trên tập mẫu lớn. Kết hợp kiểm tra mẫu ngẫu nhiên giữ kết luận luôn bám sát thực tế khách quan. Thói quen đối chiếu xem nhóm dữ liệu bị sót mang đặc điểm gì khác nhóm có sẵn giúp ngăn chặn sai lệch hệ thống ngay từ khâu thu thập.
  - show: |
      <div class="box key"><b>Tư duy:</b> một biểu đồ là một lập luận. Hỏi: người xem lướt qua 3 giây sẽ kết luận gì — và kết luận đó có đúng với số liệu không?</div>
      <p class="note"><b>Hai mức quy mô:</b> Hai cột 51 và 52 cắt đáy trục 50 phóng đại chênh 2% thành gấp 2 lần trên 1 hình; trong báo cáo cho hàng nghìn người ra quyết định, sai lệch trục làm đổi lựa chọn đầu tư chỉ sau 3 giây liếc mắt.</p>
    say: Điều cần mang theo, một biểu đồ là một lập luận. Hãy hỏi người xem lướt qua 3 giây sẽ kết luận gì, và kết luận đó có đúng với số liệu không. Hai cột 51 và 52 cắt đáy trục ở 50 phóng đại chênh 2 phần trăm thành gấp đôi. Trong báo cáo nghìn người xem, sai trục làm đổi quyết định chỉ sau vài giây.
