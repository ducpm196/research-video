id: L06
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 6 — Tương quan: cách đo và giới hạn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L06; audit/dsc/verify_dsc.py L06; F. J. Anscombe, Graphs in Statistical Analysis, The American Statistician 27(1), 1973; CS115 bài 15 (hệ số tương quan)"
assumes: [arith, frac, approx, power]
# Quy ước: r là hệ số tương quan Pearson như CS115 bài 15 (alg.pearson); −1 ≤ r ≤ 1. Hình phân tán: audit/dsc/figs.py scatter_outlier.
#   Mọi giá trị r làm tròn 3 chữ số, tính trong checks.
objectives:
  - "Đọc đúng ý nghĩa của r"
  - "Thấy một ngoại lai đổi được dấu của r"
  - "Biết r = 0 không có nghĩa là không liên quan"
asr_reviewed:
  - {sentence: "Độ lệch là giá trị trừ trung bình.", reason: "ASR chép “Đỗ lịch là giá trị trừ trung bình.” (0.75): lệch âm/thanh thuần Việt: độ lệch/đỗ lịch — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là tính r chỉ trên những người đã qua vòng lọc.", reason: "ASR chép “Lỗi thứ 4, người đã đi làm cũng hay mắc là tính error chỉ trên những người đã qua vòng lộc.” (0.905): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: lọc/lộc — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ ba, gộp các nhóm khác nhau rồi tính một r.", reason: "ASR chép “gục các nhóm … rồi tính một error”: gộp/gục lệch vần, tên chữ cái r (“e-rờ”) được viết “error”; câu còn lại đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Năm 1973, một nhà thống kê đã dựng bốn bộ dữ liệu có cùng r khoảng 0 phẩy 82 nhưng hình dạng khác hẳn.", reason: "ASR chép “có cùng error khoảng 0,82”: tên chữ cái r (“e-rờ”) được viết “error”; năm 1973, số 4 và 0,82 chép đúng (0,969) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một điểm đổi dấu cả kết luận"
    checks:
      - "round(alg.pearson([1, 2, 3, 4, 5], [2, 4, 5, 4, 5]), 3) == 0.775 and round(alg.pearson([1, 2, 3, 4, 5, 20], [2, 4, 5, 4, 5, -10]), 3) == -0.933"
    steps:
      - show: |
          <div>{{SC}}</div>
          <p>Năm điểm: tương quan dương $r = 0{,}775$. Thêm <b>một</b> điểm (20, −10): $r = \hl{-0{,}933}$ — từ “cùng tăng” thành “ngược chiều mạnh”.</p>
        focus: [1, 2, 2, 2]
        say: "Chào bạn, năm điểm màu xanh có tương quan dương, r bằng 0 phẩy 775. Thêm đúng một điểm cam ở toạ độ 20 và âm 10, r thành âm 0 phẩy 933. Kết luận đổi từ cùng tăng sang ngược chiều mạnh. Hôm nay ta học cách đo tương quan, và những giới hạn của nó."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: cách tính r từ độ lệch"
    checks:
      - "[a - 2 for a in [1, 2, 3]] == [-1, 0, 1] and [b - 4 for b in [2, 4, 6]] == [-2, 0, 2] and (-1) * (-2) + 0 * 0 + 1 * 2 == 4"
      - "4 / math.sqrt(2 * 8) == 1.0 == round(alg.pearson([1, 2, 3], [2, 4, 6]), 9)"
    steps:
      - show: |
          <p>Ở khoá Toán cho khoa học máy tính: $r = \dfrac{\text{tổng các tích độ lệch}}{\sqrt{(\text{tổng bình phương độ lệch } x) \cdot (\text{tổng bình phương độ lệch } y)}}$.</p>
          <p>Độ lệch là giá trị trừ trung bình. Tích độ lệch <b>dương</b> khi điểm nằm cùng phía trung bình ở cả hai trục, <b>âm</b> khi khác phía.</p>
        introduces: [sqrt, cdot]
        focus: [1, 1, 2, 2]
        say: "Ở khoá Toán cho khoa học máy tính, ta đã tính hệ số tương quan r theo độ lệch. Tử số là tổng các tích độ lệch, mẫu số là căn của tổng bình phương độ lệch x nhân tổng bình phương độ lệch y. Độ lệch là giá trị trừ trung bình. Tích độ lệch dương khi điểm nằm cùng phía trung bình ở cả hai trục, và âm khi nằm khác phía."
      - show: |
          <table class="t"><tr><th>$x$</th><th>$y$</th><th>lệch $x$ (trừ 2)</th><th>lệch $y$ (trừ 4)</th><th>tích</th></tr>
          <tr><td>1</td><td>2</td><td>−1</td><td>−2</td><td>2</td></tr>
          <tr><td>2</td><td>4</td><td>0</td><td>0</td><td>0</td></tr>
          <tr><td>3</td><td>6</td><td>1</td><td>2</td><td>2</td></tr></table>
          <p>$r = \frac{4}{\sqrt{2 \cdot 8}} = \frac{4}{4} = 1$.</p>
        focus: [1, "1.2", 2]
        say: "Làm thử với x bằng 1, 2, 3 và y bằng 2, 4, 6, trung bình là 2 và 4. Các tích độ lệch là 2, 0, 2, cộng lại bằng 4. Tổng bình phương độ lệch của x là 2, của y là 8, nên r bằng 4 chia căn 16, bằng 1, đúng là thẳng hàng hoàn hảo."

  - id: sym
    kind: symbol
    title: "Giải mã: r đo gì, không đo gì"
    checks:
      - "round(alg.pearson([1, 2, 3, 4, 5], [10, 8, 6, 4, 2]), 3) == -1.0 and round(alg.pearson([1, 2, 3, 4, 5], [1, 1.1, 1.2, 1.3, 1.4]), 3) == 1.0"
    steps:
      - show: |
          <p>$r$ (như CS115): đo mức các điểm nằm gần một <b>đường thẳng</b>, từ $-1$ (ngược chiều hoàn hảo) qua 0 tới $+1$ (cùng chiều hoàn hảo).</p>
          <table class="t"><tr><th>r đo</th><th>r không đo</th></tr>
          <tr><td>độ thẳng hàng của quan hệ</td><td>độ <b>dốc</b>: y tăng 0,1 mỗi bước vẫn có $r = 1$</td></tr>
          <tr><td>chiều (cùng hay ngược)</td><td>quan hệ <b>cong</b></td></tr>
          <tr><td></td><td><b>nhân quả</b></td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Hệ số r, như ở khoá Toán cho khoa học máy tính, đo mức các điểm nằm gần một đường thẳng, từ âm 1 là ngược chiều hoàn hảo, qua 0, tới 1 là cùng chiều hoàn hảo. Bảng này so sánh điều hệ số tương quan đo được và điều nó không đo được. R đo độ thẳng hàng, không đo độ dốc, y chỉ tăng 0 phẩy 1 mỗi bước vẫn có r bằng 1. R đo chiều cùng hay ngược, không đo được quan hệ cong. Và r không bao giờ nói về nhân quả."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi điểm góp một hình chữ nhật có dấu"
    checks:
      - "(lambda X, Y: (round(sum(X) / 6, 2), round(sum(Y) / 6, 2), round(sum((a - sum(X) / 6) * (b - sum(Y) / 6) for a, b in list(zip(X, Y))[:5])), round((20 - sum(X) / 6) * (-10 - sum(Y) / 6))))([1, 2, 3, 4, 5, 20], [2, 4, 5, 4, 5, -10]) == (5.83, 1.67, -27, -165)"
    steps:
      - show: |
          <div><svg width="1500" height="410" viewBox="0 0 1500 410"><g fill="#1f2937" font-size="22"><line x1="120" y1="160" x2="1002" y2="160" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/><line x1="365" y1="64" x2="365" y2="388" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/><rect x="162" y="154" width="203" height="6" fill="#b91c1c" opacity="0.18" stroke="#b91c1c" stroke-width="1.5"/><rect x="204" y="118" width="161" height="42" fill="#b91c1c" opacity="0.18" stroke="#b91c1c" stroke-width="1.5"/><rect x="246" y="100" width="119" height="60" fill="#b91c1c" opacity="0.18" stroke="#b91c1c" stroke-width="1.5"/><rect x="288" y="118" width="77" height="42" fill="#b91c1c" opacity="0.18" stroke="#b91c1c" stroke-width="1.5"/><rect x="330" y="100" width="35" height="60" fill="#b91c1c" opacity="0.18" stroke="#b91c1c" stroke-width="1.5"/><rect x="365" y="160" width="595" height="210" fill="#b91c1c" opacity="0.18" stroke="#b91c1c" stroke-width="1.5"/><circle cx="162" cy="154" r="10" fill="#2a78d6"/><circle cx="204" cy="118" r="10" fill="#2a78d6"/><circle cx="246" cy="100" r="10" fill="#2a78d6"/><circle cx="288" cy="118" r="10" fill="#2a78d6"/><circle cx="330" cy="100" r="10" fill="#2a78d6"/><circle cx="960" cy="370" r="10" fill="#eb6834"/><text x="373" y="40" font-size="20">trung bình x 5,83</text><text x="120" y="190" font-size="20">trung bình y 1,67</text><text x="1040" y="90" fill="#2a78d6">5 điểm xanh: tổng tích −27</text><text x="1040" y="130" fill="#eb6834">điểm (20, −10): tích −165</text><text x="1040" y="185" font-size="20">mỗi hình chữ nhật đỏ:</text><text x="1040" y="215" font-size="20">một tích độ lệch âm,</text><text x="1040" y="245" font-size="20">to hay nhỏ theo diện tích</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ sáu điểm của ví dụ mở đầu, cùng hai đường nét đứt là trung bình x và trung bình y. Mỗi điểm góp vào tử số của r một tích độ lệch, chính là diện tích hình chữ nhật nối điểm đó với chỗ hai đường trung bình cắt nhau. Điểm cam ở xa kéo trung bình về phía nó, nên cả năm điểm xanh cũng thành khác phía. Hình chữ nhật của riêng điểm cam có diện tích âm 165, gấp hơn 6 lần tổng của năm điểm xanh là âm 27. Một điểm xa có hình chữ nhật khổng lồ, nên nó quyết định dấu của r."

  - id: example
    kind: example
    title: "r = 0 mà vẫn liên quan chặt"
    checks:
      - "round(alg.pearson([-3, -2, -1, 0, 1, 2, 3], [9, 4, 1, 0, 1, 4, 9]), 3) == 0.0"
    steps:
      - show: |
          <p><b>Bước 1</b> — $x = -3, -2, \dots, 3$ và $y = x^2$: 9, 4, 1, 0, 1, 4, 9. Biết $x$ là biết chính xác $y$.</p>
          <p>Trung bình $x = 0$; trung bình $y = \frac{28}{7} = 4$.</p>
        introduces: [dots]
        focus: [1, 1, 2]
        say: "Bước một, lấy x từ âm 3 tới 3 và y bằng x bình phương, được 9, 4, 1, 0, 1, 4, 9. Biết x là biết chính xác y. Trung bình x bằng 0, còn trung bình y bằng 28 chia 7, bằng 4."
      - show: |
          <table class="t"><tr><th>$x$</th><th>−3</th><th>−2</th><th>−1</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>lệch $y$ (trừ 4)</td><td>5</td><td>0</td><td>−3</td><td>−4</td><td>−3</td><td>0</td><td>5</td></tr>
          <tr><td>tích độ lệch</td><td>−15</td><td>0</td><td>3</td><td>0</td><td>−3</td><td>0</td><td>15</td></tr></table>
          <p><b>Bước 2</b> — nhân độ lệch $x$ (chính là $x$) với độ lệch $y$.</p>
        focus: [2, "1.2", "1.3"]
        say: "Bước hai, vì trung bình x bằng 0 nên độ lệch x chính là x, ta nhân nó với độ lệch y. Độ lệch y là y trừ 4, được 5, 0, âm 3, âm 4, âm 3, 0, 5. Nhân lên được âm 15, 0, 3, 0, âm 3, 0, 15."
      - show: |
          <p><b>Bước 3</b> — tổng các tích: $-15 + 0 + 3 + 0 - 3 + 0 + 15 = 0$ → tử số bằng 0 → $r = \hl{0}$.</p>
        say: "Bước ba, cộng các tích, âm 15 với 15 triệt tiêu, 3 với âm 3 triệt tiêu, được 0. Tử số bằng 0 nên r bằng 0, dù y phụ thuộc hoàn toàn vào x."
      - clear: true
        show: |
          <div class="box key"><b>Bước 4</b> — nửa trái đi xuống, nửa phải đi lên, hai nửa triệt tiêu nhau. $r = 0$ chỉ nghĩa là không có quan hệ <b>thẳng</b>. Luôn vẽ biểu đồ phân tán trước khi tin một con số $r$.</div>
        focus: [1, 1, 1]
        say: "Bước bốn, đọc kết quả. Nửa trái đi xuống, nửa phải đi lên, hai nửa triệt tiêu nhau, nên r bằng 0 chỉ có nghĩa là không có quan hệ thẳng. Hãy luôn vẽ biểu đồ phân tán trước khi tin một con số r."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(alg.pearson([0, 1, 2, 3], [0, 1, 4, 9]), 3) == 0.958 and round(alg.pearson([-3, -2, -1, 0], [9, 4, 1, 0]), 3) == -0.958"
      - "all((x * (x * x - 4)) + ((-x) * ((-x) * (-x) - 4)) == 0 for x in [1, 2, 3])"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>hai nửa triệt tiêu</td><td>tính $r$ riêng nửa phải ($x$ = 0 tới 3) và nửa trái ($x$ = −3 tới 0)</td><td>0,958 và −0,958 ✓</td></tr>
          <tr><td>tổng tích bằng 0</td><td>ghép cặp $x$ với $-x$: hai điểm có cùng $y$, tích độ lệch đối dấu nhau</td><td>mỗi cặp cộng lại 0 ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Tính r riêng cho nửa phải, x từ 0 tới 3, được 0 phẩy 958, gần thẳng và đi lên, còn nửa trái được âm 0 phẩy 958, đi xuống, đúng là hai nửa ngược nhau. Ghép cặp x với âm x, hai điểm có cùng y nên tích độ lệch đối dấu nhau, mỗi cặp cộng lại bằng 0, vì vậy cả tổng bằng 0 mà không cần tính từng số."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "round(alg.pearson(list(range(1, 11)), [2, 1, 4, 3, 6, 5, 8, 7, 10, 9]), 3) == 0.939 and round(alg.pearson([7, 8, 9, 10], [8, 7, 10, 9]), 3) == 0.6"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Báo $r$ mà không vẽ <b class="red">(mù)</b>
          <br><span class="note">Anscombe (1973) dựng bốn bộ dữ liệu có cùng $r \approx 0{,}82$ nhưng hình dạng khác hẳn: thẳng, cong, một ngoại lai, một điểm đòn bẩy.</span></div>
        say: "Lỗi thứ nhất, báo r mà không vẽ. Năm 1973, một nhà thống kê đã dựng bốn bộ dữ liệu có cùng r khoảng 0 phẩy 82 nhưng hình dạng khác hẳn. Một bộ thẳng, một bộ cong, một bộ có ngoại lai, một bộ có điểm đòn bẩy."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đọc $r$ lớn là “ảnh hưởng mạnh” <b class="red">(sai)</b>
          <br><span class="note">$r$ gần 1 với độ dốc rất nhỏ là quan hệ chắc nhưng yếu về độ lớn. Muốn biết “tăng bao nhiêu” phải xem độ dốc hồi quy.</span></div>
        say: "Lỗi thứ hai, đọc r lớn là ảnh hưởng mạnh. R gần 1 mà độ dốc rất nhỏ là một quan hệ chắc nhưng yếu về độ lớn, muốn biết tăng bao nhiêu phải xem độ dốc hồi quy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Gộp các nhóm khác nhau rồi tính một $r$ <b class="red">(lẫn lộn)</b>
          <br><span class="note">Mỗi nhóm có thể không tương quan, nhưng gộp lại thì có (như bảng cửa hàng ở bài 0). Cần tách theo nhóm rồi xem lại.</span></div>
        say: "Lỗi thứ ba, gộp các nhóm khác nhau rồi tính một r. Mỗi nhóm có thể không tương quan, nhưng gộp lại thì có, như bảng cửa hàng ở bài 0, nên cần tách theo nhóm rồi xem lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Tính $r$ chỉ trên những người đã qua vòng lọc <b class="red">(khoảng bị cắt)</b></div>
          <table class="t"><tr><th>số minh hoạ: điểm thi đầu vào → hiệu suất</th><th>số người</th><th>$r$</th></tr>
          <tr><td>mọi ứng viên: điểm 1 tới 10, hiệu suất 2, 1, 4, 3, 6, 5, 8, 7, 10, 9</td><td>10</td><td>0,939</td></tr>
          <tr><td>chỉ người được tuyển (điểm 7 tới 10)</td><td>4</td><td>0,6</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là tính r chỉ trên những người đã qua vòng lọc. Với số minh hoạ, nếu đo cả 10 ứng viên thì điểm thi đầu vào và hiệu suất có r bằng 0 phẩy 939. Nhưng công ty chỉ có dữ liệu của 4 người được tuyển, điểm từ 7 tới 10, và trên nhóm đó r chỉ còn 0 phẩy 6. Kết luận điểm thi ít liên quan tới hiệu suất là sai, vì khoảng điểm đã bị cắt hẹp, nên người làm nghề luôn hỏi dữ liệu này đã qua bộ lọc nào."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.pearson([1, 2, 3, 4], [4, 3, 2, 1]), 3) == -1.0 and round(alg.pearson([-2, -1, 0, 1, 2], [4, 1, 0, 1, 4]), 3) == 0.0"
      - "sum((a - 2.5) * (b - 2.5) for a, b in zip([1, 2, 3, 4], [4, 3, 2, 1])) == -5 and sum((a - 2.5) ** 2 for a in [1, 2, 3, 4]) == 5"
      - "[a * (b - 2) for a, b in zip([-2, -1, 0, 1, 2], [4, 1, 0, 1, 4])] == [-4, 1, 0, -1, 4]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$x$ = 1, 2, 3, 4 và $y$ = 4, 3, 2, 1: $r$ bằng bao nhiêu?</td></tr>
          <tr><td>2</td><td>$x$ = −2, −1, 0, 1, 2 và $y = x^2$: $r$? Có liên quan không?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, x là 1, 2, 3, 4 và y là 4, 3, 2, 1, r bằng bao nhiêu? Câu hai, x từ âm 2 tới 2 và y bằng x bình phương, r bằng bao nhiêu? Hai biến có liên quan không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Trung bình cả hai là 2,5. Lệch $x$: −1,5; −0,5; 0,5; 1,5. Lệch $y$: 1,5; 0,5; −0,5; −1,5.</p>
          <p>Tổng tích $= -2{,}25 - 0{,}25 - 0{,}25 - 2{,}25 = -5$; hai tổng bình phương đều bằng 5 → $r = \frac{-5}{\sqrt{5 \cdot 5}} = \hl{-1}$: thẳng hàng hoàn hảo, ngược chiều.</p>
        focus: [1, 1, 2, 2]
        say: "Đáp án câu một, trung bình của cả x và y đều là 2 phẩy 5. Độ lệch x là âm 1 phẩy 5, âm 0 phẩy 5, 0 phẩy 5, 1 phẩy 5, còn độ lệch y ngược dấu. Tổng các tích bằng âm 5, hai tổng bình phương đều bằng 5. Vậy r bằng âm 5 chia căn 25, bằng âm 1, thẳng hàng hoàn hảo và ngược chiều."
      - show: |
          <p>② $y$ = 4, 1, 0, 1, 4, trung bình 2; lệch $y$: 2, −1, −2, −1, 2. Tích với $x$: −4, 1, 0, −1, 4, tổng $= 0$ → $r = \hl{0}$.</p>
          <p>Nhưng $y$ được quyết định hoàn toàn bởi $x$: liên quan chặt, chỉ không thẳng.</p>
        focus: [1, 1, 2]
        say: "Câu hai, y là 4, 1, 0, 1, 4, trung bình bằng 2, nên độ lệch y là 2, âm 1, âm 2, âm 1, 2. Nhân với x được âm 4, 1, 0, âm 1, 4, cộng lại bằng 0, nên r bằng 0. Nhưng y được quyết định hoàn toàn bởi x, hai biến liên quan chặt, chỉ là không thẳng."

