name: rln_p1_thuat_ngu
# Vòng 1 cho RLN (2026-11-02): tên thuật toán / từ ngoại của học tăng cường. Đọc BẢN CHÉP (khoá chuỗi con dễ khớp giả).
# Mỗi cách viết × 4 ngữ cảnh × (small + medium) = 8 lần nghe; ngưỡng 7/8; đối chứng âm phải KHÔNG đạt.
ctx:
  - "Theo {}, ta xét bài toán này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "qlearning"
    variants: ["Q-learning", "Kiu-lơ-ninh", "Quy-lơ-ninh"]
    negative: "Kiu-lơ-minh"
    keys: ["qlearning", "qlerning", "kiulearning", "kiuloninh", "quyloninh", "quylearning", "qloninh", "cuelearning"]
  - key: "sarsa"
    variants: ["SARSA", "Xa-sa", "Xác-xa"]
    negative: "Xa-ta"
    keys: ["sarsa", "xasa", "sasa", "xacxa", "sacsa", "sacxa", "xacsa"]
  - key: "epsilon"
    variants: ["epsilon", "ép-xi-lôn", "ép-si-lon"]
    negative: "ép-xi-măng"
    keys: ["epsilon", "epxilon", "epsilon", "epxilon", "epsilong", "epxilong"]
  - key: "ppo"
    variants: ["PPO", "pi pi âu", "pê pê ô"]
    negative: "pi pi ai"
    keys: ["ppo", "pipiau", "pepeo", "pipio"]
  - key: "ucb"
    variants: ["UCB", "diu xi bi", "u xê bê"]
    negative: "u xê đê"
    keys: ["ucb", "diuxibi", "uxebe", "iucibi", "yucb"]
  - key: "montecarlo"
    variants: ["Monte Carlo", "Môn-tê Cạc-lô", "Mon-tê-các-lô"]
    negative: "Môn-tê Cạc-tô"
    keys: ["montecarlo", "montecaclo", "montecarlo", "montecaclo", "monteccarlo"]
  - key: "td"
    variants: ["TD", "tê đê", "ti đi"]
    negative: "tê bê"
    keys: ["td", "tede", "tidi"]
  - key: "dqn"
    variants: ["DQN", "đê quy en", "đi kiu en"]
    negative: "đê quy em"
    keys: ["dqn", "dequyen", "dikiuen", "dqen", "dequien"]
  - key: "reinforce"
    variants: ["REINFORCE", "Ri-in-pho", "Ri-in-phốt"]
    negative: "Ri-in-lốt"
    keys: ["reinforce", "riinpho", "reinfo", "riinphot", "rinfor"]
  - key: "atari"
    variants: ["Atari", "A-ta-ri", "A-ta-rì"]
    negative: "A-ta-li"
    keys: ["atari"]
  - key: "theta"
    variants: ["theta", "tê-ta", "thê-ta"]
    negative: "bê-ta"
    keys: ["theta", "teta", "theta", "thetas"]
  - key: "bradleyterry"
    variants: ["Bradley–Terry", "Brát-li Te-ri", "Brét-li Tê-ri"]
    negative: "Brát-li Pe-ri"
    keys: ["bradleyterry", "bratliteri", "bradlyterry", "bretliteri", "bradleyteri"]
  - key: "montezuma"
    variants: ["Montezuma", "Môn-tê-du-ma", "Mon-tê-zu-ma"]
    negative: "Môn-tê-du-na"
    keys: ["montezuma", "montesuma", "montezuma", "monteduma", "montedzuma"]
