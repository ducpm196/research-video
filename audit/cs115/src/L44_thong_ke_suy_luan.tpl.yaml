id: L44
series: "CS115 · Toán cho Khoa học Máy tính"
title: "Bài 44 (bổ sung) — Thống kê: trung bình mẫu, khoảng tin cậy, so sánh hai mô hình"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "Đề cương CS115 chương 1 “Ôn tập: Xác suất thống kê” (audit/SYLLABUS_CS115.md §2) — 44 bài trước chưa dạy thống kê suy luận (grep: chỉ L38 nhắc “giới hạn trung tâm” một lần); audit/verify_cs115_l44.py S1–S6, C1–C3, P1–P4, T1, Q1 (tích chập chính xác, cộng nhị thức chính xác); khoảng ghép cặp theo McNemar, 1947"
assumes: [cdot, sub, sum, frac, sqrt, pm, approx, geq, expect, var, mu, sigma, normal, hat, prob, in]
# Quy ước: x̄ (x có gạch ngang) = trung bình mẫu; σ/√n = sai số chuẩn (lời đọc: “sai số chuẩn”, không đọc chữ viết tắt SE);
#   1,96 là số sao cho ±1,96σ chứa 95% phân phối chuẩn; mọi khoảng ở đây là khoảng xấp xỉ, cần n đủ lớn và các mẫu độc lập.
# Bài bổ sung, đánh số sau phần mở rộng để không đổi số 44 bài đã dựng; học sau bài 21 (curriculum/cs115.yaml).
# Nối bài trước (luật 17): bài 13 — kỳ vọng, phương sai, Var(X + Y) = Var X + Var Y khi độc lập, Var(aX) = a²·Var X; bài 14 —
#   phân phối chuẩn, quy tắc 68 – 95 – 99,7; bài 19 — đo trên tập kiểm tra; bài 21 — tỉ lệ đúng.
objectives:
  - "Tính phương sai và sai số chuẩn σ/√n của trung bình mẫu từ các quy tắc phương sai"
  - "Phát biểu định lý giới hạn trung tâm và nhận ra nó trên phân phối chính xác của trung bình xúc xắc"
  - "Lập khoảng tin cậy 95% cho tỉ lệ đúng của một mô hình và hiểu đúng nghĩa của nó"
  - "So sánh hai mô hình trên cùng tập kiểm tra bằng khoảng tin cậy ghép cặp, và biết khi nào chưa đủ bằng chứng"
asr_reviewed:
  - {sentence: "Khi n đủ lớn, trung bình mẫu xấp xỉ phân phối chuẩn, kỳ vọng muy, phương sai xích ma bình phương chia n.", reason: "n đọc “en” (tên chữ cái) → ASR chép “Anna”; muy → nguy, xấp xỉ → sắp sĩ: nhầm âm đầu của ASR; chữ n, μ hiện trên màn hình"}
  - {sentence: "Mô hình A đúng 850 mẫu, tức 85 phần trăm.", reason: "A (tên chữ cái) → ASR chép “à”; chữ A hiện trên bảng"}
  - {sentence: "Với mô hình A, mỗi mẫu là đúng hay sai, ghi 1 hoặc 0, tức một biến Bernoulli như bài 13, có phương sai p nhân 1 trừ p.", reason: "A (tên chữ cái) → ASR chép “nha” (nối âm với “hình”); câu dài, các từ khác nghe đúng"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mô hình B đúng hơn 1,2 điểm — thật hay may?"
    checks:
      - "Rational(850, 1000) == Rational(17, 20) and 862 - 850 == 12 and Rational(12, 1000) == Rational(3, 250)"
    steps:
      - show: |
          <table class="t"><tr><th>trên cùng 1000 mẫu kiểm tra</th><th>tỉ lệ đúng (bài 21)</th></tr>
          <tr><td>mô hình A</td><td>850/1000 = 85,0%</td></tr>
          <tr><td>mô hình B</td><td>862/1000 = 86,2%</td></tr></table>
          <p>B hơn 1,2 điểm phần trăm. Đổi sang 1000 mẫu khác, con số sẽ dao động. <b>B tốt hơn thật, hay chỉ may?</b></p>
        focus: [0, "1.2", "1.3", 2, 2, 0]
        say: "Chào bạn, hai mô hình được chấm trên cùng 1000 mẫu kiểm tra. Mô hình A đúng 850 mẫu, tức 85 phần trăm. Mô hình B đúng 862 mẫu, tức 86 phẩy 2 phần trăm. Nhưng nếu đổi sang 1000 mẫu khác, các con số sẽ dao động. Vậy B tốt hơn thật, hay chỉ gặp may? Bài này cho ta công cụ để trả lời."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn nền: quy tắc phương sai và phân phối chuẩn"
    checks:
      - "abs(math.erf(2 / math.sqrt(2)) - 0.9545) < 0.0001"
      - "Rational(sum(range(1, 7)), 6) == Rational(7, 2) and sum((Rational(x) - Rational(7, 2))**2 for x in range(1, 7)) / 6 == Rational(35, 12)"
    steps:
      - show: |
          <table class="t"><tr><td>Bài 13</td><td>$\operatorname{Var}(aX) = a^2\operatorname{Var}(X)$; $\ X, Y$ độc lập thì $\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$</td></tr>
          <tr><td>Bài 13</td><td>một xúc xắc có $\mu = 3{,}5$, $\ \sigma^2 = \dfrac{35}{12} \approx 2{,}917$</td></tr>
          <tr><td>Bài 14</td><td>phân phối chuẩn có $95{,}45\%$ xác suất nằm trong $\mu \pm 2\sigma$</td></tr></table>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Ôn lại ba điều. Theo bài 13, nhân một biến với a thì phương sai nhân a bình phương, và hai biến độc lập thì phương sai của tổng bằng tổng hai phương sai. Cũng ở bài 13, một xúc xắc có kỳ vọng 3 phẩy 5 và phương sai 35 phần 12, khoảng 2 phẩy 917. Theo bài 14, phân phối chuẩn có khoảng 95 phẩy 45 phần trăm xác suất nằm trong muy cộng trừ 2 xích ma."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: trung bình mẫu x̄ và sai số chuẩn"
    checks:
      - "Rational(4 + 6 + 2 + 5, 4) == Rational(17, 4)"
    steps:
      - show: |
          <p>Lấy $n$ mẫu độc lập $x_1, \dots, x_n$ từ cùng một phân phối (kỳ vọng $\mu$, phương sai $\sigma^2$):</p>
          <div class="box key">$\bar{x} = \dfrac{x_1 + x_2 + \dots + x_n}{n}$ — <b>trung bình mẫu</b>, đọc “x gạch ngang”.</div>
          <p>Ví dụ tung 4 lần được 4, 6, 2, 5: $\ \bar{x} = \dfrac{17}{4} = 4{,}25$ — khác 3,5 vì mẫu ít.</p>
        introduces: [bar, dots]
        focus: [1, 2, 2, 3]
        say: "Lấy n mẫu độc lập, x 1 đến x n, từ cùng một phân phối có kỳ vọng muy và phương sai xích ma bình phương. Chữ x với một gạch ngang ở trên, đọc là x gạch ngang, là trung bình mẫu, tức tổng n mẫu chia n. Dấu ba chấm ở giữa nghĩa là cứ thế tiếp tục cho tới x n. Ví dụ tung xúc xắc 4 lần được 4, 6, 2, 5, trung bình mẫu là 17 phần 4, bằng 4 phẩy 25, lệch khá xa 3 phẩy 5 vì mẫu còn ít."

  # ───────────────────────── 4. PHƯƠNG SAI CỦA TRUNG BÌNH ─────────────────────────
  - id: se
    kind: formula
    title: "Trung bình mẫu dao động bao nhiêu: σ/√n"
    checks:
      - "sp.simplify(sp.Symbol('n') * sp.Symbol('s')**2 / sp.Symbol('n')**2 - sp.Symbol('s')**2 / sp.Symbol('n')) == 0"
      - "round(35 / 12 / 100, 6) == 0.029167 and round(math.sqrt(35 / 12 / 100), 4) == 0.1708"
    steps:
      - show: |
          <p>① Theo bài 13, các mẫu độc lập nên $\ \operatorname{Var}(x_1 + \dots + x_n) = n\,\sigma^2$.</p>
          <p>② Chia cho $n$ nên nhân phương sai với $\dfrac{1}{n^2}$: $\ \operatorname{Var}(\bar{x}) = \dfrac{n\,\sigma^2}{n^2} = \dfrac{\sigma^2}{n}$.</p>
          <div class="box key">Độ lệch chuẩn của $\bar{x}$: $\ \dfrac{\sigma}{\sqrt{n}}$ — gọi là <b>sai số chuẩn</b>. Kỳ vọng vẫn là $\mu$.</div>
        focus: [1, 2, 3, 3]
        say: "Trung bình mẫu dao động bao nhiêu? Bước một, theo bài 13, các mẫu độc lập nên phương sai của tổng bằng n lần xích ma bình phương. Bước hai, vì chia tổng cho n nên phương sai nhân với một phần n bình phương, được xích ma bình phương chia n. Lấy căn, độ lệch chuẩn của trung bình mẫu là xích ma chia căn n, gọi là sai số chuẩn, còn kỳ vọng vẫn là muy."
      - show: |
          <p>Làm thử ngay: 100 xúc xắc: $\ \operatorname{Var}(\bar{x}) = \dfrac{2{,}917}{100} \approx 0{,}0292$, sai số chuẩn $\approx \hlg{0{,}1708}$ — hẹp hơn một xúc xắc ($\sigma \approx 1{,}708$) đúng 10 lần, vì $\sqrt{100} = 10$.</p>
        say: "Làm thử ngay với 100 xúc xắc, phương sai của trung bình là 2 phẩy 917 chia 100, khoảng 0 phẩy 0292, nên sai số chuẩn khoảng 0 phẩy 1708. Con số này nhỏ hơn độ lệch chuẩn của một xúc xắc đúng 10 lần, vì căn của 100 bằng 10."

  # ───────────────────────── 5. GIỚI HẠN TRUNG TÂM ─────────────────────────
  - id: clt
    kind: intuition
    title: "Định lý giới hạn trung tâm: trung bình dần thành hình chuông"
    checks:
      - "(lambda p: max(p, key=p.get) == 35 and round(float(p[35]), 4) == 0.0727 and abs(float(p[35]) - 1 / math.sqrt(2 * math.pi * 10 * 35 / 12)) < 0.002)(__import__('functools').reduce(lambda p, _: {s: sum(p.get(s - k, 0) * Rational(1, 6) for k in range(1, 7)) for s in range(0, 61)}, range(10), {0: Rational(1)}))"
    steps:
      - show: |
          {{CLT}}
          <p class="note">Phân phối <b>chính xác</b> của trung bình $n$ xúc xắc (tính bằng máy, không mô phỏng); đường cam: hình chuông cùng kỳ vọng 3,5, phương sai $\frac{35/12}{n}$.</p>
        focus: [1, 1, 1, 2]
        say: "Hình này là phân phối chính xác của trung bình n xúc xắc, máy tính bằng cách cộng dồn mọi khả năng, không phải mô phỏng. Với một xúc xắc, sáu mặt đều nhau, phân phối phẳng, chẳng giống hình chuông chút nào. Với hai xúc xắc, nó thành hình tam giác, và với mười xúc xắc thì gần như khớp đường chuông màu cam. Đường cam là phân phối chuẩn có cùng kỳ vọng 3 phẩy 5 và phương sai 35 phần 12 chia n."
      - show: |
          <div class="box key"><b>Định lý giới hạn trung tâm</b>: với $n$ mẫu độc lập cùng phân phối (có phương sai hữu hạn), khi $n$ đủ lớn, $\ \bar{x} \approx \mathcal{N}\!\left(\mu,\ \dfrac{\sigma^2}{n}\right)$ — <b>dù</b> phân phối gốc không phải hình chuông.</div>
          <p class="note">Kiểm: tổng 10 xúc xắc bằng 35 có xác suất 0,0727; hình chuông cho 0,0739.</p>
        focus: [1, 1, 1, 2]
        say: "Đó là định lý giới hạn trung tâm, với n mẫu độc lập cùng phân phối có phương sai hữu hạn. Khi n đủ lớn, trung bình mẫu xấp xỉ phân phối chuẩn, kỳ vọng muy, phương sai xích ma bình phương chia n. Điều đáng chú ý là phân phối gốc không cần là hình chuông. Kiểm bằng số, tổng mười xúc xắc bằng 35 có xác suất 0 phẩy 0727, còn hình chuông cho 0 phẩy 0739, rất sát."

  # ───────────────────────── 6. KHOẢNG TIN CẬY ─────────────────────────
  - id: ci
    kind: formula
    title: "Khoảng tin cậy 95%: x̄ ± 1,96 · σ/√n"
    checks:
      - "abs(math.erf(1.96 / math.sqrt(2)) - 0.95) < 0.0001"
      - "(lambda p, sd: abs(float(sum(w for s, w in p.items() if 3.5 - 1.96 * sd <= s / 100 <= 3.5 + 1.96 * sd)) - 0.9503) < 0.0001)(__import__('functools').reduce(lambda p, _: {s: sum(p.get(s - k, 0) * Fraction(1, 6) for k in range(1, 7)) for s in range(0, 601)}, range(100), {0: Fraction(1)}), math.sqrt(35 / 12 / 100))"
    steps:
      - show: |
          <p>Theo định lý trên, $\bar{x}$ nằm trong $\ \mu \pm 1{,}96\,\dfrac{\sigma}{\sqrt{n}}\ $ với xác suất khoảng 95% (bài 14: $\pm 2\sigma$ là 95,45%; $\pm 1{,}96\sigma$ là đúng 95%).</p>
          <div class="box key">Đảo lại: <b>khoảng tin cậy 95%</b> cho $\mu$ là $$\bar{x} \pm 1{,}96\,\dfrac{\sigma}{\sqrt{n}}$$ (chưa biết $\sigma$ thì thay bằng độ lệch chuẩn của mẫu).</div>
          <p>Kiểm bằng máy: trung bình 100 xúc xắc nằm trong $3{,}5 \pm 1{,}96 \cdot 0{,}1708$ với xác suất chính xác $0{,}9503$ ✓</p>
        focus: [1, 1, 2, 2, 3]
        say: "Theo định lý trên, trung bình mẫu nằm trong muy cộng trừ 1 phẩy 96 lần sai số chuẩn với xác suất khoảng 95 phần trăm. Con số 1 phẩy 96 đến từ bài 14, vì cộng trừ 2 xích ma chứa 95 phẩy 45 phần trăm, nên muốn đúng 95 phần trăm thì lùi lại một chút. Đảo vai trò, khoảng tin cậy 95 phần trăm cho muy là trung bình mẫu cộng trừ 1 phẩy 96 lần sai số chuẩn. Khi chưa biết xích ma, ta thay bằng độ lệch chuẩn tính từ mẫu. Kiểm bằng máy với 100 xúc xắc, xác suất chính xác là 0 phẩy 9503."

  # ───────────────────────── 7. VÍ DỤ: TỈ LỆ ĐÚNG ─────────────────────────
  - id: example
    kind: example
    title: "Khoảng tin cậy cho tỉ lệ đúng 850/1000"
    checks:
      - "(lambda ph, n: (lambda se: round(se, 5) == 0.01129 and round(1.96 * se, 4) == 0.0221 and (round(ph - 1.96 * se, 3), round(ph + 1.96 * se, 3)) == (0.828, 0.872))(math.sqrt(ph * (1 - ph) / n)))(0.85, 1000)"
      - "(lambda n, P: abs(sum(math.comb(n, k) * P**k * (1 - P)**(n - k) for k in range(n + 1) if abs(k / n - P) <= 1.96 * math.sqrt((k / n) * (1 - k / n) / n)) - 0.947) < 0.001)(1000, 0.85)"
    steps:
      - show: |
          <p>Mỗi mẫu là đúng (1) hay sai (0): biến Bernoulli (bài 13) với $\sigma^2 = p(1 - p)$. Tỉ lệ đúng $\hat{p}$ chính là một trung bình mẫu.</p>
          <p>$\hat{p} = 0{,}85$: &nbsp; sai số chuẩn $\ \sqrt{\dfrac{0{,}85 \cdot 0{,}15}{1000}} \approx 0{,}0113$, &nbsp; $1{,}96 \cdot 0{,}0113 \approx 0{,}0221$</p>
          <div class="box ok">Khoảng tin cậy 95%: $\ 0{,}85 \pm 0{,}0221 = [\hlg{0{,}828};\ \hlg{0{,}872}]$</div>
        focus: [1, 1, 2, 2, 3]
        say: "Với mô hình A, mỗi mẫu là đúng hay sai, ghi 1 hoặc 0, tức một biến Bernoulli như bài 13, có phương sai p nhân 1 trừ p. Vì vậy tỉ lệ đúng p mũ chính là một trung bình mẫu. Thay số, sai số chuẩn là căn của 0 phẩy 85 nhân 0 phẩy 15 chia 1000, khoảng 0 phẩy 0113. Nhân 1 phẩy 96 được khoảng 0 phẩy 0221. Khoảng tin cậy 95 phần trăm là từ 0 phẩy 828 đến 0 phẩy 872."
      - show: |
          <div class="box key">Nghĩa đúng: nếu lặp lại việc lấy 1000 mẫu mới rồi lập khoảng theo cùng cách, thì trong khoảng 95% số lần, khoảng tính ra chứa tỉ lệ đúng thật. Máy tính chính xác với $p = 0{,}85$: cách làm này phủ đúng <b>94,7%</b> số lần.</div>
        focus: [1, 1]
        say: "Nghĩa đúng của nó là nếu lặp lại việc lấy 1000 mẫu mới rồi lập khoảng theo cùng cách, thì khoảng 95 phần trăm số lần, khoảng đó chứa tỉ lệ đúng thật. Máy tính chính xác với tỉ lệ thật 0 phẩy 85 cho thấy cách làm này phủ đúng 94 phẩy 7 phần trăm số lần, rất sát con số hứa hẹn."

  # ───────────────────────── 8. VÍ DỤ: HAI MÔ HÌNH ─────────────────────────
  - id: compare
    kind: example
    title: "So sánh A và B: ghép cặp từng mẫu"
    checks:
      - "(lambda b, c, n: (lambda d, se: round(d, 3) == 0.012 and round(se, 5) == 0.00848 and (round(d - 1.96 * se, 4), round(d + 1.96 * se, 4)) == (-0.0046, 0.0286))((c - b) / n, math.sqrt(b + c - (c - b)**2 / n) / n))(30, 42, 1000)"
      - "850 - 30 + 42 == 862 and 30 + 42 == 72"
      - "round(math.sqrt(0.85 * 0.15 / 1000 + 0.862 * 0.138 / 1000), 4) == 0.0157"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>B đúng</th><th>B sai</th></tr>
          <tr><td>A đúng</td><td>820</td><td>30</td></tr>
          <tr><td>A sai</td><td>42</td><td>108</td></tr></table>
          <p>Chỉ 72 mẫu hai mô hình bất đồng. Với mỗi mẫu, ghi hiệu $d_i$ = (B đúng) − (A đúng) $\in \{-1, 0, 1\}$: trung bình $\ \bar{d} = \dfrac{42 - 30}{1000} = 0{,}012$.</p>
        introduces: [set]
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Vì hai mô hình được chấm trên cùng 1000 mẫu, ta ghép cặp từng mẫu. 820 mẫu cả hai cùng đúng, 108 mẫu cả hai cùng sai. Chỉ có 72 mẫu hai mô hình bất đồng, 30 mẫu A đúng B sai, và 42 mẫu A sai B đúng. Với mỗi mẫu ta ghi hiệu, B đúng trừ A đúng, là một trong ba số âm 1, 0, 1 trong cặp ngoặc nhọn. Trung bình các hiệu là 42 trừ 30 chia 1000, bằng 0 phẩy 012."
      - show: |
          <p>Sai số chuẩn của $\bar{d}$ (độ lệch chuẩn của các $d_i$ chia $\sqrt{1000}$): $\ \sqrt{72 - 12^2/1000}\,/\,1000 \approx 0{,}00848$</p>
          <div class="box warn">Khoảng 95% cho hiệu: $\ 0{,}012 \pm 1{,}96 \cdot 0{,}00848 = [-0{,}0046;\ 0{,}0286]$ — <b>chứa 0</b> → chưa đủ bằng chứng B tốt hơn.</div>
        focus: [1, 2, 2]
        say: "Sai số chuẩn của trung bình hiệu bằng độ lệch chuẩn của các hiệu chia căn 1000, tính ra khoảng 0 phẩy 00848. Khoảng 95 phần trăm cho hiệu là 0 phẩy 012 cộng trừ 1 phẩy 96 lần con số đó, từ âm 0 phẩy 0046 đến 0 phẩy 0286. Khoảng này chứa số 0, nên với 1000 mẫu này ta chưa đủ bằng chứng nói B tốt hơn A."

  # ───────────────────────── 9. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: ba phép thử cho một khoảng tin cậy"
    checks:
      - "(lambda vals: abs(math.sqrt(sum((x - sum(vals) / 1000)**2 for x in vals) / 1000 / 1000) - math.sqrt(72 - 0.144) / 1000) < 1e-12)([1] * 42 + [-1] * 30 + [0] * 928)"
      - "820 + 30 + 42 + 108 == 1000"
    steps:
      - show: |
          <table class="t"><tr><td><b>Phép thử 1</b></td><td>bảng ghép cặp cộng lại đủ $820 + 30 + 42 + 108 = 1000$ mẫu ✓</td></tr>
          <tr><td><b>Phép thử 2</b></td><td>tính sai số chuẩn theo định nghĩa (1000 số $-1, 0, 1$) và theo công thức: trùng nhau ✓</td></tr>
          <tr><td><b>Phép thử 3</b></td><td>đơn vị — khoảng cho tỉ lệ phải nằm trong $[0; 1]$; nửa độ rộng giảm theo $\sqrt{n}$, không theo $n$ ✓</td></tr></table>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm ba điều, vì một chỗ nhầm căn hay nhầm n là khoảng sai hoàn toàn. Một, bảng ghép cặp cộng lại phải đủ 1000 mẫu. Hai, tính sai số chuẩn theo định nghĩa từ 1000 số âm 1, 0, 1, và theo công thức, hai cách phải trùng nhau. Ba, khoảng cho một tỉ lệ phải nằm trong đoạn từ 0 đến 1, và nửa độ rộng giảm theo căn n, không theo n."

  # ───────────────────────── 10. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi người mới hay mắc"
    checks:
      - "round(1.96 * math.sqrt(0.1275 / 1000), 4) == 0.0221 and round(1.96 * 0.1275 / 1000, 5) == 0.00025"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “Có 95% xác suất tỉ lệ thật nằm trong [0,828; 0,872]” <b class="red">(hiểu sai)</b>
          <br><span class="note">Tỉ lệ thật là một số cố định; 95% nói về <b>cách lập khoảng</b> khi lặp lại nhiều lần.</span></div>
        say: "Lỗi thứ nhất, nói có 95 phần trăm xác suất tỉ lệ thật nằm trong khoảng vừa tính. Tỉ lệ thật là một số cố định, con số 95 phần trăm nói về cách lập khoảng khi lặp lại nhiều lần."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chia cho $n$ thay vì $\sqrt{n}$ <b class="red">(sai)</b>
          <br><span class="note">Ví dụ 850/1000 sẽ ra nửa độ rộng 0,00025 thay vì 0,0221 — tự tin gấp gần 90 lần.</span></div>
          <table class="t"><tr><th>chia cho</th><th>nửa độ rộng</th></tr>
          <tr><td>$\sqrt{1000}$ (đúng)</td><td>0,0221</td></tr>
          <tr><td>$1000$ (sai)</td><td>0,00025</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ hai, chia cho n thay vì căn n. Ở ví dụ 850 trên 1000, nửa độ rộng sẽ thành 0 phẩy 00025 thay vì 0 phẩy 0221, tự tin quá mức gần 90 lần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Khoảng của hiệu chứa 0 mà vẫn kết luận “B tốt hơn” <b class="red">(sai)</b>
          <br><span class="note">Nói đúng: “chưa đủ bằng chứng”. Muốn chắc hơn: thêm mẫu kiểm tra.</span></div>
        say: "Lỗi thứ ba, khoảng của hiệu chứa số 0 mà vẫn kết luận B tốt hơn. Nói đúng là chưa đủ bằng chứng, và muốn chắc hơn thì cần thêm mẫu kiểm tra."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Mẫu ít (ví dụ $n = 10$) mà vẫn dùng 1,96 <b class="red">(thiếu điều kiện)</b>
          <br><span class="note">Định lý chỉ xấp xỉ khi $n$ lớn. Với $n = 10$, $\sigma$ ước lượng từ mẫu và dữ liệu gần phân phối chuẩn, dùng phân phối t: hệ số 2,262 thay cho 1,96.</span></div>
        say: "Lỗi thứ tư, mẫu ít, ví dụ 10 mẫu, mà vẫn dùng 1 phẩy 96. Định lý chỉ xấp xỉ khi n lớn, nên với 10 mẫu, xích ma ước lượng từ mẫu và dữ liệu gần phân phối chuẩn, người ta dùng phân phối t với hệ số 2 phẩy 262."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 5.</b> Các mẫu không độc lập mà vẫn dùng $\sigma/\sqrt{n}$ <b class="red">(sai)</b>
          <br><span class="note">Ví dụ 1000 ảnh mà chỉ của 50 người, mỗi người 20 ảnh: thông tin thật ít hơn 1000 mẫu, khoảng tính ra hẹp quá mức.</span></div>
        say: "Lỗi thứ năm, các mẫu không độc lập mà vẫn chia cho căn n. Ví dụ 1000 ảnh nhưng chỉ chụp 50 người, mỗi người 20 ảnh, thông tin thật ít hơn nhiều so với 1000 mẫu, và khoảng tính ra hẹp quá mức."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda ph, n: (lambda se: round(se, 3) == 0.015 and (round(ph - 1.96 * se, 3), round(ph + 1.96 * se, 3)) == (0.871, 0.929))(math.sqrt(ph * (1 - ph) / n)))(0.9, 400)"
      - "math.sqrt(4) == 2"
      - "Rational(360, 400) == Rational(9, 10) and round(0.9*0.1/400, 6) == 0.000225 and round(math.sqrt(0.000225), 6) == 0.015 and round(1.96*0.015, 4) == 0.0294"
      - "round(math.sqrt(0.09/1600), 6) == 0.0075 and round(math.sqrt(0.09/400)/math.sqrt(0.09/1600), 9) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Một mô hình đúng 360 trên 400 mẫu kiểm tra. Lập khoảng tin cậy 95% cho tỉ lệ đúng.</td></tr>
          <tr><td>2</td><td>Muốn nửa độ rộng khoảng còn một nửa, cần gấp bao nhiêu lần số mẫu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, một mô hình đúng 360 trên 400 mẫu kiểm tra, hãy lập khoảng tin cậy 95 phần trăm cho tỉ lệ đúng. Câu hai, muốn nửa độ rộng của khoảng còn một nửa, cần gấp bao nhiêu lần số mẫu? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Tỉ lệ đúng là trung bình mẫu của các số 0, 1, như ví dụ 850/1000:</p>
          $$\hat{p} = \frac{360}{400} = 0{,}9 \qquad \sqrt{\frac{0{,}9 \cdot 0{,}1}{400}} = \sqrt{0{,}000225} = 0{,}015 \qquad 1{,}96 \cdot 0{,}015 = 0{,}0294$$
          <p>Khoảng $\ 0{,}9 \pm 0{,}0294 = [\hlg{0{,}871};\ \hlg{0{,}929}]$.</p>
        focus: [1, 2, 2, 3]
        say: "Đáp án câu một, tỉ lệ đúng là trung bình mẫu của các số 0 và 1, làm giống ví dụ 850 trên 1000. P mũ bằng 360 chia 400, bằng 0 phẩy 9. Sai số chuẩn là căn của 0 phẩy 9 nhân 0 phẩy 1 chia 400, bằng 0 phẩy 015, nhân 1 phẩy 96 được 0 phẩy 0294. Khoảng là từ 0 phẩy 871 đến 0 phẩy 929."
      - show: |
          <p>② Nửa độ rộng tỉ lệ với $\dfrac{1}{\sqrt{n}}$; gấp 4 lần mẫu thì $\sqrt{4} = 2$, nên nửa độ rộng còn một nửa → gấp $\hlg{4}$ lần.</p>
          <table class="t"><tr><th>số mẫu</th><th>sai số chuẩn với $\hat{p} = 0{,}9$</th></tr>
          <tr><td>400</td><td>0,015</td></tr>
          <tr><td>1600</td><td>$\sqrt{0{,}09 / 1600} = 0{,}0075$ — đúng một nửa ✓</td></tr></table>
        focus: [1, 1, "2.3"]
        say: "Câu hai, nửa độ rộng tỉ lệ với một chia căn n. Gấp 4 lần số mẫu thì căn của 4 bằng 2, nên nửa độ rộng còn một nửa, vậy cần gấp 4 lần. Kiểm bằng số, với 1600 mẫu, sai số chuẩn bằng căn của 0 phẩy 09 chia 1600, bằng 0 phẩy 0075, đúng một nửa của 0 phẩy 015."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$\operatorname{Var}(\bar{x}) = \sigma^2/n$</span><span class="a">→</span>
          <span class="n">giới hạn trung tâm: $\bar{x} \approx$ chuẩn</span><span class="a">→</span>
          <span class="n">khoảng 95%: $\bar{x} \pm 1{,}96\,\sigma/\sqrt{n}$</span><span class="a">→</span>
          <span class="n">so hai mô hình: ghép cặp, xem khoảng có chứa 0</span></div>
        say: "Tổng kết chuỗi logic. Phương sai của trung bình mẫu là xích ma bình phương chia n. Định lý giới hạn trung tâm cho biết trung bình mẫu xấp xỉ phân phối chuẩn. Từ đó khoảng tin cậy 95 phần trăm là trung bình cộng trừ 1 phẩy 96 lần sai số chuẩn. Muốn so hai mô hình, ghép cặp từng mẫu và xem khoảng của hiệu có chứa 0 không."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi con số đo trên dữ liệu đều kèm một độ dao động. Báo cáo “85% ± 2,2%” trung thực hơn “85%”, và giúp tránh kết luận từ may rủi.</div>
        say: "Điều cần mang theo, mỗi con số đo trên dữ liệu đều kèm một độ dao động. Báo cáo 85 phần trăm, cộng trừ 2 phẩy 2 phần trăm, trung thực hơn chỉ nói 85 phần trăm, và giúp ta không kết luận từ may rủi."
      - clear: true
        show: |
          <p class="note">Bài này bổ sung cho bài 21 (chấm điểm mô hình). Học theo thứ tự lộ trình thì chuyển sang bài 22: <b>đồ thị tính toán và lan truyền ngược</b>.</p>
        say: "Bài này bổ sung cho bài 21 về cách chấm điểm một mô hình. Nếu bạn đang học theo thứ tự lộ trình, hãy chuyển sang bài 22, nơi ta học đồ thị tính toán và lan truyền ngược. Cảm ơn bạn đã theo dõi."
