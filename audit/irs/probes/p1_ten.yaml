name: irs_p1_ten
# Vòng 1 cho IRS (2026-11-03): tên riêng / từ ngoại định nói trong lời. Đọc BẢN CHÉP, không chỉ điểm.
# Quy ước khoá (không dò, không đọc trong lời — chỉ trên màn hình): TF-IDF, BM25, nDCG, MRR, RRF, MMR, RankNet, FAISS, HNSW, word2vec,
#   Netflix, tên tác giả. Lời đọc dùng tên tiếng Việt mô tả.
ctx:
  - "Theo {}, ta xét hệ thống này."
  - "Phần {} được giải thích ở bước tiếp theo."
