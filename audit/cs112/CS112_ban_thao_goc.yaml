  - id: L18
    orig: L18
    title: "Bản chất Quy hoạch động (DP): Cuốn sổ tay ghi nhớ, Bottom-up Tabulation & Top-down Memoization"
    source: "TLTK1#Ch8; TLTK2#Ch15; B08, B09"
    requires: [L02, L08]
    spec: "lessons/L18_ban_chat_quy_hoach_dong.yaml"
    pedagogy: "Tính tiền chuyến đi qua nhiều trạm -> Tính đoạn nào ghi sổ đoạn đó -> Tra sổ O(1) thay vì tính lại đệ quy"
    math_core:
      - "2 điều kiện bắt buộc của DP: 1. Optimal Substructure (Cấu trúc con tối ưu); 2. Overlapping Subproblems (Bài toán con gối nhau)"
      - "Top-down Memoization: Đệ quy tự nhiên có bảng lưu nhớ memo[] khởi tạo giá trị đặc biệt"
      - "Bottom-up Tabulation: Khởi tạo cơ sở, dùng vòng lặp điền bảng theo trật tự tô-pô không đệ quy"
    fix:
      - "Phân biệt DP và Chia để trị: Chia để trị các bài toán con ĐỘC LẬP HOÀN TOÀN; DP các bài toán con GỐI NHAU lặp lại liên tục"

  - id: L19
    orig: L19
    title: "Quy hoạch động Đặt dấu ngoặc tối ưu / Nhân chuỗi ma trận (Matrix Chain Multiplication - MCM)"
    source: "TLTK2#Ch15.2; B09, B10; CK25#Câu-3; BTL_M#MCM"
    requires: [L00, L18]
    spec: "lessons/L19_dp_dat_ngoac_mcm.yaml"
    pedagogy: "Thử mọi điểm cắt k chia chuỗi làm 2 nửa -> Tra chi phí 2 nửa trong bảng -> Cộng chi phí ghép -> Điền theo đường chéo"
    math_core:
      - "Mô hình biểu thức E = x_0 o_0 x_1 ... o_{n-1} x_n"
      - "Cơ sở: DP[i][i] = x_i, forall i in [0, n]"
      - "Truy hồi: DP[i][j] = max_{i <= k < j} { DP[i][k] o_k DP[k+1][j] }"
      - "Trật tự điền bảng: Duyệt theo độ dài đoạn L = j - i + 1 tăng dần từ 2..n+1"
      - "Bài mẫu thi A = 6 + 0 * 6 + 0.1: Đường chéo chính [6, 0, 6, 0.1]; L=2: [6, 0, 6.1]; L=3: [36, 0.1]; Ô đích DP[0][3] = 36.6 tại k=1"
      - "Truy vết (Traceback): Cắt tại k=1 (phép nhân o_1) -> (6+0) * (6+0.1) = 6 * 6.1 = 36.6"
    fix:
      - "BẪY THỨ TỰ ĐIỀN BẢNG: Không thể duyệt for i thông thường, bắt buộc phải duyệt theo độ dài đoạn L để các bài toán con có trước"
      - "Báo cáo BTL: Bắt buộc dùng chỉ số 1-based (i=1..n) để khớp với slide bài giảng của Cô Thương"

  - id: L20
    orig: L20
    title: "Các Bài toán Quy hoạch động Kinh điển: Dãy con tăng dài nhất (LIS) & Xâu con chung dài nhất (LCS)"
    source: "TLTK1#Ch8.2; TLTK2#Ch15.4; B09"
    requires: [L01, L18]
    spec: "lessons/L20_dp_lis_lcs.yaml"
    pedagogy: "Tìm chuỗi bước nhảy có thứ tự -> So khớp từng ký tự hai văn bản -> Bảng quy hoạch động 1D và 2D"
    math_core:
      - "LIS (Longest Increasing Subsequence): L[i] = 1 + max_{j < i, a[j] < a[i]} L[j]; độ phức tạp O(n^2), tối ưu O(n log n) bằng Binary Search"
      - "LCS (Longest Common Subsequence): Nếu X[i] == Y[j] thì c[i][j] = c[i-1][j-1] + 1; ngược lại max(c[i-1][j], c[i][j-1]); độ phức tạp O(m*n)"
      - "Truy vết LCS: Đi ngược từ c[m][n] theo hướng mũi tên chéo khi ký tự trùng nhau"
    fix:
      - "Phân biệt Substring (xâu con liên tiếp) và Subsequence (dãy con không nhất thiết liên tiếp nhưng phải giữ thứ tự)"

