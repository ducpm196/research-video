  - id: L00
    orig: L00
    title: "Bản chất toán học của máy tính: Phép đếm CPU, Chuỗi Sigma và Bẫy điểm âm ranh giới"
    source: "SYL#Ch1; B01; CS112.TX.Buoi1; 01. [C1W1]. Useful Formulas"
    requires: []
    spec: "lessons/L00_toan_so_cap_phep_dem.yaml"
    pedagogy: "Người soát vé rạp phim (so sánh vé vs vào cửa) -> Khối lệnh CPU -> Ký hiệu Sigma và hàm nguyên sàn/trần"
    math_core:
      - "Hàm sàn floor(x) và trần ceil(x): bản chất phép chia nguyên C++ int m = (l+r)/2"
      - "Logarithm cơ số 2: số lần bẻ đôi dữ liệu để về 1; đẳng thức a^(log_b c) = c^(log_b a)"
      - "Công thức đếm số phần tử đoạn [L, U] tăng bước 1: N = U - L + 1"
      - "Khử 5 tổng Sigma: tổng hằng số c, cấp số cộng n(n+1)/2, bình phương n(n+1)(2n+1)/6, cấp số nhân 2^(n+1)-1, tổng điều hòa ln(n)"
    fix:
      - "BẪY SO SÁNH CPU: Số lần so sánh điều kiện thoát = Số lần lặp thực tế + 1 (lần thứ N+1 trả FALSE để thoát)"
      - "BẪY TỔNG ÂM CÔ THƯƠNG: Vòng lặp trong j = n-y..y chỉ lặp khi y >= ceil(n/2); phải tách tổng cô lập phép so sánh ranh giới +1"
      - "Biến đổi đại số tổng lặp: Sum_{y=ceil(n/2)}^n (2y - n + 1) + Sum_{y=1}^n 1 = (n^2 + 8n + 4)/4 với n chẵn"

