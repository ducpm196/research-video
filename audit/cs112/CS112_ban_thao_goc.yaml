  - id: L08
    orig: L08
    title: "Hệ thức Truy hồi & Phương pháp Thế ngược (Backward Substitution) — Bài toán Tháp Hà Nội"
    source: "SL_DQ#Slide-1-33; 03. [C2W2]. Methods; B02; CK25#Câu-2"
    requires: [L00, L06]
    spec: "lessons/L08_the_nguoc_thap_ha_noi.yaml"
    pedagogy: "Búp bê Nga mở vỏ liên tiếp -> Truy vết quy luật tổng quát sau i bước thế -> Chạm đáy điều kiện dừng n-i=1"
    math_core:
      - "Hệ thức Tháp Hà Nội: T(1) = 1; T(n) = 2T(n-1) + 1 (n > 1)"
      - "Thế ngược 3 bước: T(n) = 2[2T(n-2) + 1] + 1 = 2^2 T(n-2) + 2 + 1 = 2^3 T(n-3) + 2^2 + 2 + 1"
      - "Quy luật sau i bước: T(n) = 2^i T(n-i) + Sum_{j=0}^{i-1} 2^j = 2^i T(n-i) + (2^i - 1)"
      - "Dừng khi n-i=1 <=> i=n-1 -> T(n) = 2^(n-1)(1) + 2^(n-1) - 1 = 2^n - 1 in Theta(2^n)"
    fix:
      - "Lỗi xác định mốc dừng: Mốc dừng là n-i=1 <=> i=n-1 (không phải i=n); nếu thế i=n sẽ làm lệch chỉ số T(0) không có trong đề"

  - id: L09
    orig: L09
    title: "Phương pháp Hàm sinh (Generating Function) giải Hệ thức Truy hồi"
    source: "SL_DQ#Slide-34-52; 03. [C2W2]. Methods; CK25#Câu-2-Cách-2"
    requires: [L00, L08]
    spec: "lessons/L09_ham_sinh.yaml"
    pedagogy: "Đóng gói dãy số vào đa thức vô hạn G(x) = Sum T(n)x^n -> Dùng đại số biến đổi đóng -> Khai triển Taylor đọc nghiệm"
    math_core:
      - "Định nghĩa hàm sinh: G(x) = Sum_{n=1}^inf T(n) x^n"
      - "Nhân x^n vào 2 vế của T(n) = 2T(n-1) + 1 và lấy tổng n=2..inf: G(x) - x = 2x G(x) + x^2 / (1-x)"
      - "Rút gọn đại số: G(x)(1 - 2x) = x / (1-x) -> G(x) = x / ((1-x)(1-2x))"
      - "Phân rã phân thức tối giản: G(x) = 1/(1-2x) - 1/(1-x) = Sum_{n=1}^inf (2^n - 1) x^n -> T(n) = 2^n - 1"
    fix:
      - "Cẩn thận trừ số hạng đầu T(1)x khi dịch chuyển chỉ số tổng; nếu không trừ sẽ bị sai vế trái"
      - "Phân rã A/(1-2x) + B/(1-x): đồng nhất hệ số tìm đúng A=1, B=-1"

  - id: L10
    orig: L10
    title: "Thuật toán findMax, Bẫy số nhánh đệ quy a in if-else & Chứng minh Quy nạp R(n) <= 0"
    source: "DethiCK#Câu-2; [HW#01] Bài 1; B02; SL_DQ#Slide-53-63"
    requires: [L00, L06, L08]
    spec: "lessons/L10_findmax_va_quy_nap.yaml"
    pedagogy: "Rẽ nhánh ngã ba đường loại trừ nhau -> Chỉ đi 1 nhánh -> Xác định đúng số nhánh a = 1"
    math_core:
      - "Mã nguồn findMax chứa 2 dòng đệ quy nhưng nằm trong if..else if.. loại trừ -> CPU chỉ chạy 1 nhánh -> a = 1"
      - "Best case: T(n) = T(n/2) + 1 -> Theta(log n)"
      - "Worst case (các phần tử bằng nhau rơi vào else): T(n) = 2T(n/2) + 2 -> Theta(n)"
      - "Quy nạp 3 bước chứng minh T(n) = 2n - 2: Cơ sở n=1 đúng; Giả thiết k < n; Bước quy nạp T(n) = 2(2(n/2)-2) + 2 = 2n - 2"
    fix:
      - "BẪY SỐ NHÁNH CÔ THƯƠNG: Thấy 2 dòng đệ quy kết luận a=2 là sai bản chất CPU trong cấu trúc if-else"
      - "BẪY PHẦN DƯ QUY NẠP: Muốn chứng minh T(n) <= f(n), biến đổi T(n) <= f(n) + R(n), BẮT BUỘC R(n) <= 0. Nếu R(n) > 0 bị vỡ bất đẳng thức"

  - id: L11
    orig: L11
    title: "Kỹ thuật Đổi biến số (Variable Transformation) giải Hệ thức Căn thức T(n) = sqrt(n)T(sqrt(n)) + n"
    source: "03. [C2W2]. Methods; [HW#01] Bài 4; B03"
    requires: [L00, L06, L08]
    spec: "lessons/L11_doi_bien_can_thuc.yaml"
    pedagogy: "Thay tọa độ phức tạp bằng hệ trục tuyến tính -> Đặt n = 2^m -> Tuyến tính hóa hệ thức phi tuyến"
    math_core:
      - "8 bước biến đổi chuẩn mực: 1. Đặt n = 2^m <=> m = log_2 n; 2. Thay T(2^m) = 2^(m/2) T(2^(m/2)) + 2^m"
      - "3. Đặt S(m) = T(2^m); 4. Chia 2 vế cho 2^m: S(m)/2^m = S(m/2)/2^(m/2) + 1"
      - "5. Đặt R(m) = S(m)/2^m -> R(m) = R(m/2) + 1; 6. Giải R(m) = log_2 m + c"
      - "7. Thế ngược S(m) = 2^m (log_2 m + c); 8. Thế ngược n: T(n) = n log_2 log_2 n + cn in Theta(n log log n)"
    fix:
      - "Không quên chia hai vế cho 2^m ở bước 4; đây là chìa khóa để triệt tiêu hệ số nhánh 2^(m/2)"

  # ══════════════════════════════════════════════════════════════════════════════
  # PHẦN 5: CÁC CHIẾN LƯỢC THIẾT KẾ THUẬT TOÁN (BÀI TỰ CHỌN - 2.5 ĐIỂM)
  # ══════════════════════════════════════════════════════════════════════════════
  - id: L12
    orig: L12
    title: "Chiến lược Chia để trị (Divide and Conquer) & Định lý Master (Master Theorem)"
    source: "TLTK1#Ch5; TLTK2#Ch4; B07#DandC; CS112_09. Chia để trị"
    requires: [L06, L08]
    spec: "lessons/L12_chia_de_tri_master.yaml"
    pedagogy: "Tổng đạo diễn chia sân vận động làm 2 nửa độc lập -> Giải từng nửa -> Nghiệm thu gộp kết quả"
    math_core:
      - "Phương trình tổng quát: T(n) = a T(n/b) + f(n)"
      - "3 trường hợp Định lý Master: So sánh f(n) với n^(log_b a)"
      - "Trường hợp 1 (Nhánh thắng): f(n) in O(n^(log_b a - eps)) -> T(n) in Theta(n^(log_b a))"
      - "Trường hợp 2 (Cân bằng): f(n) in Theta(n^(log_b a)) -> T(n) in Theta(n^(log_b a) * log n)"
      - "Trường hợp 3 (Gộp thắng): f(n) in Omega(n^(log_b a + eps)) và điều kiện đều a f(n/b) <= c f(n) -> T(n) in Theta(f(n))"
      - "Phân tích Mergesort: T(n) = 2T(n/2) + n -> a=2, b=2, log_2 2 = 1 -> Case 2 -> Theta(n log n)"
    fix:
      - "Điều kiện áp dụng Master: a >= 1, b > 1 và b phải là hằng số chia nguyên; không áp dụng được cho T(n) = T(n-1) + 1"

  - id: L13
    orig: L13
    title: "Chiến lược Giảm để trị (Decrease and Conquer) & Biến đổi để trị (Transform and Conquer)"
    source: "TLTK1#Ch4, Ch6; B07, B08"
    requires: [L06, L08]
    spec: "lessons/L13_giam_de_tri.yaml"
    pedagogy: "Bóc từng lớp vỏ hành tây (giảm 1 đơn vị) vs Sơ chế nguyên liệu trước khi nấu ăn (sắp xếp trước khi tìm)"
    math_core:
      - "Giảm một hằng số (Decrease-by-one): Insertion Sort T(n) = T(n-1) + (n-1) -> Theta(n^2)"
      - "Giảm một hằng số nhân (Decrease-by-constant-factor): Binary Search T(n) = T(n/2) + 1 -> Theta(log n)"
      - "Biến đổi để trị: Sắp xếp mảng trước để tìm Min/Max trong O(1), đếm tần suất, kiểm tra trùng lặp"
    fix:
      - "Phân biệt rạch ròi: Giảm để trị chỉ sinh RA DUY NHẤT 1 BÀI TOÁN CON; Chia để trị sinh ra từ 2 bài toán con trở lên (a >= 2)"

  - id: L14
    orig: L14
    title: "Chiến lược Quay lui (Backtracking) & Mấu chốt Phục hồi Trạng thái (Unmark State)"
    source: "TLTK1#Ch12.1; B06#Backtracking; CS112_0708; CK25#Câu-Tự-Chọn"
    requires: [L02, L05, L08]
    spec: "lessons/L14_quay_lui_backtracking.yaml"
    pedagogy: "Khám phá mê cung ngõ cụt -> Lùi lại ngã rẽ -> BẮT BUỘC xóa vết phấn đánh dấu cũ để nhánh khác đi vào"
    math_core:
      - "Không gian trạng thái cây tìm kiếm: n bước chọn x_1, x_2, ... x_n"
      - "Khung mã giả C++ Backtrack(i): Duyệt j=1..m; nếu Valid(i, j) thì { x[i]=j; visited[j]=true; if (i==n) Print(); else Backtrack(i+1); visited[j]=false; }"
      - "Mấu chốt sống còn: Dòng visited[j] = false (phục hồi trạng thái) giúp các nhánh khác tái sử dụng phần tử"
      - "Bài toán Hoán vị n phần tử: độ phức tạp O(n!)"
    fix:
      - "BẪY QUÊN PHỤC HỒI TRẠNG THÁI: Thiếu dòng visited[j] = false sẽ làm thuật toán chỉ tìm được đúng 1 nghiệm đầu rồi dừng"

  - id: L15
    orig: L15
    title: "Chiến lược Nhánh cận (Branch and Bound) & Kỹ thuật Ma trận Rút gọn (Reduced Matrix TSP)"
    source: "TLTK1#Ch12.2; B06; CS112_0708; CK25#Câu-Tự-Chọn"
    requires: [L04, L14]
    spec: "lessons/L15_nhanh_can_tsp.yaml"
    pedagogy: "Dự toán chi phí tối thiểu tương lai (Chặn dưới LB) -> Nhánh nào có dự toán đắt hơn phương án tốt nhất thì TỈA BỎ ngay"
    math_core:
      - "Ma trận chi phí C 5x5: đường chéo chính vô cùng"
      - "Rút gọn hàng: r_i = min_j C[i][j]; trừ hàng i cho r_i; tổng R = Sum r_i = 10+2+2+3+4 = 21"
      - "Rút gọn cột: c_j = min_i C'[i][j]; trừ cột j cho c_j; tổng C_col = Sum c_j = 1+0+3+0+0 = 4"
      - "Chặn dưới nút gốc: LB_gốc = R + C_col = 21 + 4 = 25"
      - "Quy tắc rẽ nhánh: chọn cạnh (i, j) có chi phí phạt rút gọn lớn nhất để phân nhánh"
    fix:
      - "Sau khi rút gọn hàng, ma trận C' ĐÃ THAY ĐỔI; bắt buộc phải tìm c_j nhỏ nhất TRÊN MA TRẬN MỚI C' (không tìm trên C gốc)"

  - id: L16
    orig: L16
    title: "Chiến lược Tham lam (Greedy Strategy 1): Bài toán Ba lô Phân rã (Fractional Knapsack)"
    source: "TLTK1#Ch9; B07, B09; CS112_11; CK25#Câu-Tự-Chọn"
    requires: [L06]
    spec: "lessons/L16_tham_lam_knapsack.yaml"
    pedagogy: "Nhặt vàng kim cương vào ba lô -> Đồ nào đắt giá nhất trên từng kg (v_i = p_i / w_i) thì nhét đầy trước"
    math_core:
      - "Tham số: Sức chứa M, trọng lượng w_i, giá trị p_i, tỷ lệ lấy x_i in [0, 1]"
      - "Đơn giá mật độ: v_i = p_i / w_i; sắp xếp v_i giảm dần"
      - "Quy tắc lấy: Nếu w_i <= Rem thì x_i = 1, Rem -= w_i; nếu w_i > Rem thì x_i = Rem / w_i, Rem = 0"
      - "Bài mẫu thi: M=20, w=(18, 15, 10), p=(25, 24, 15) -> v=(1.389, 1.6, 1.5). Ưu tiên: 2 -> 3 -> 1"
      - "Nghiệm x = (0, 1, 0.5), Tổng giá trị cực đại = 24 + 0.5*15 = 31.5"
    fix:
      - "Chỉ Fractional Knapsack mới dùng Tham lam cho nghiệm tối ưu; 0/1 Knapsack (đồ vật nguyên khối) dùng Tham lam sẽ SAI, phải dùng DP"

  - id: L17
    orig: L17
    title: "Chiến lược Tham lam (Greedy Strategy 2): Bài toán Lập lịch Hội trường (Activity Scheduler)"
    source: "TLTK2#Ch16.1; B09; CS112_12.Tham lam Scheduler"
    requires: [L06, L16]
    spec: "lessons/L17_tham_lam_scheduler.yaml"
    pedagogy: "Xếp lịch hội trường -> Chọn sự kiện KẾT THÚC SỚM NHẤT để giải phóng phòng sớm cho các sự kiện tiếp theo"
    math_core:
      - "Đầu vào: n sự kiện với thời gian bắt đầu s_i và kết thúc f_i"
      - "Sắp xếp danh sách sự kiện theo thời gian kết thúc f_i tăng dần: f_1 <= f_2 <= ... <= f_n"
      - "Duyệt chọn: Luôn chọn sự kiện 1; với k=2..n, nếu s_k >= last_finish thì chọn k và cập nhật last_finish = f_k"
      - "Độ phức tạp: O(n log n) sắp xếp + O(n) duyệt -> Theta(n log n)"
    fix:
      - "BẪY TIÊU CHUẨN THAM LAM: Sắp xếp theo giờ bắt đầu s_i sớm nhất hoặc thời lượng ngắn nhất đều SAI; duy nhất xếp theo f_i là ĐÚNG"

