  - id: L06
    orig: L06
    title: "5 Ký hiệu Tiệm cận Hình thức (O, Omega, Theta, o, omega) & Phương pháp Giới hạn"
    source: "TLTK1#Ch2.2; TLTK2#Ch1.3; B04#Asymptotics; HW1_2#HW02; CK25#Câu-1a"
    requires: [L00]
    spec: "lessons/L06_ky_hieu_tiem_can.yaml"
    pedagogy: "Đo khoảng cách xe máy vs máy bay -> Bỏ qua tiểu tiết khi đi cực xa (n -> vô cùng) -> Ranh giới chặn trên, dưới, kẹp chặt"
    math_core:
      - "Chặn trên Big-O: f(n) <= c * g(n), forall n >= n_0 (c > 0, n_0 > 0)"
      - "Chặn dưới Big-Omega: f(n) >= c * g(n), forall n >= n_0 (c > 0, n_0 > 0)"
      - "Chặn chặt Big-Theta: c_1 * g(n) <= f(n) <= c_2 * g(n), forall n >= n_0"
      - "Định lý: f(n) in Theta(g(n)) <=> f(n) in O(g(n)) và f(n) in Omega(g(n))"
      - "Phương pháp Giới hạn: L = lim_{n->inf} f(n)/g(n). L = 0 -> o; L = c > 0 -> Theta; L = inf -> omega"
    fix:
      - "BẪY THIẾU ĐIỀU KIỆN CÔ THƯƠNG: Trình bày định nghĩa thiếu 'tồn tại c > 0, n_0 > 0' hoặc thiếu 'với mọi n >= n_0' bị trừ sạch điểm"
      - "Bài mẫu 1a: Chứng minh 3n^2 + 5n + 2 in Theta(n^2) bằng giới hạn L = 3 > 0 hoặc chọn c_1=3, c_2=10, n_0=1"

  - id: L07
    orig: L07
    title: "Chuỗi 15 Bậc Thứ Tự Tăng Trưởng Tiệm Cận & Kỹ thuật Chuẩn hóa Cơ số Mũ"
    source: "TLTK3#Ch1.4; B04; HW1_2#HW02-Bài-9; CK25#Câu-1b"
    requires: [L06]
    spec: "lessons/L07_chuoi_tang_truong.yaml"
    pedagogy: "Bảng xếp hạng tốc độ các phương tiện giao thông -> Quy tắc triệt tiêu bậc thấp -> Sắp xếp chuỗi 7 hàm số đề thi"
    math_core:
      - "Chuỗi 15 bậc: 1 < loglog n < log n < log^2 n < n^(1/3) < n^(1/2) < n < n log n < n^2 < n^3 < n^4 < 2^n < 3^n < 4^n < n! < n^n"
      - "Bẫy đổi cơ số mũ: 2^(2n) = (2^2)^n = 4^n; do đó 4^n tăng nhanh hơn 3^n và 2^n"
      - "Quy tắc 3 bước giải bài 1b: 1. Bỏ hằng số nhân, giữ bậc cao nhất; 2. Đưa về cơ số 2; 3. Xếp vào chuỗi chuẩn"
    fix:
      - "BẪY ĐỒNG BẬC CƠ SỐ MŨ: Nhầm 2^(2n) cùng bậc 2^n. Chứng minh bằng giới hạn lim 4^n / 2^n = lim 2^n = inf -> 2^(2n) in omega(2^n)"
      - "Bài mẫu thi CK: 5*lg(n+100)^10 < ln^2 n < n^(1/3) < 0.001n^4 + 3n^3 + 1 < 3^n < 2^(2n) < (n-2)!"

