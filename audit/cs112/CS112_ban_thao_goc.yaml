  - id: L21
    orig: L21
    title: "Quy hoạch Tuyến tính (Linear Programming - LP 2D): Phương pháp Hình học & Định lý Đỉnh cực biên"
    source: "TLTK1#Ch10.1; TLTK2#Ch29; B05, B06; CK25#Câu-Tự-Chọn"
