    math_core:
      - "Stack: Push(x) O(1), Pop() O(1), Top() O(1). Ứng dụng kiểm tra ngoặc hợp lệ, chuyển đổi Ba Lan (Infix -> Postfix)"
      - "Queue: Enqueue(x) O(1), Dequeue() O(1). Hàng đợi vòng (Circular Queue) với chỉ số modulo (rear + 1) % MAX"
      - "Mô phỏng Call Stack đệ quy: mỗi lời gọi hàm cấp phát một Stack Frame lưu tham số và biến cục bộ"
    fix:
      - "Lỗi Stack Overflow xảy ra khi đệ quy thiếu điều kiện dừng (Base Case) làm cạn kiệt vùng nhớ Stack"
      - "Phân biệt rạch ròi Queue thông thường FIFO với Deque (hàng đợi 2 đầu) và Priority Queue"

