  - id: L22
    orig: L22
    title: "Tổng quan Thuật toán Đơn hình (Simplex Algorithm) & Phương pháp Khử biến Fourier-Motzkin"
    source: "TLTK1#Ch10.2; TLTK2#Ch29; [Đọc thêm] Simplex"
