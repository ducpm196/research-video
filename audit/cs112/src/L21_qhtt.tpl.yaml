id: L21
course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 21 — Quy hoạch tuyến tính hai biến: miền chấp nhận được và nghiệm tại đỉnh"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "audit/cs112/CS112_ban_thao_goc.yaml#L21 (bản thảo); audit/cs112/verify_cs112.py C27, C27b; hình sinh bằng audit/cs112/lp_svg.py; bài tự làm theo Hillier & Lieberman, Introduction to Operations Research (ví dụ Wyndor)"
assumes: [cdot, sub, implies]
# Quy ước: biến quyết định x₁, x₂ (số mẻ bánh loại 1, loại 2); hàm mục tiêu z = 15x₁ + 10x₂ (đơn vị tiền lãi, không gắn tên tiền
#   cụ thể); ràng buộc viết dạng “≤”; “miền chấp nhận được” = mọi điểm thoả hết ràng buộc; đỉnh = giao của hai đường biên.
# Sửa bản thảo (AUDIT_CS112 §2, C27b): thiếu điều kiện không âm thì MIỀN vô hạn, nhưng với z = 15x₁ + 10x₂ giá trị lớn nhất
#   vẫn là 280 (chứng chỉ 5·24 + 5·32); minh hoạ “mất chặn” bằng hàm mục tiêu khác (10x₁ + 20x₂).
# Nối bài trước (luật 17): bài 16 — tham lam, chọn theo đơn giá; bài 0 — đếm, so sánh; bài 1 — giới hạn khi n → ∞
#   (ở đây: “không bị chặn” = lớn mãi không dừng).
objectives:
  - "Lập mô hình quy hoạch tuyến tính: biến quyết định, hàm mục tiêu, ràng buộc"
  - "Vẽ miền chấp nhận được, tìm các đỉnh bằng cách giải hệ hai phương trình"
  - "Tìm nghiệm tối ưu bằng cách thử các đỉnh và kiểm bằng một chứng chỉ chặn trên"
  - "Nhận ra các trường hợp đặc biệt: vô số nghiệm, không bị chặn, quên điều kiện không âm"
asr_reviewed:
  - {sentence: "Đi kèm ba ràng buộc, về bột, về đường, và số mẻ không âm.", reason: "ràng buộc/tràng bụt, bột/bộ: nhầm âm đầu, âm cuối của ASR"}
  - {sentence: "Còn bỏ điều kiện đó, cho x một âm dần, z sẽ lớn mãi không dừng, và bài toán không có nghiệm tối ưu.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Xưởng bánh với bột và đường có hạn"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>bánh loại 1</th><th>bánh loại 2</th><th>có sẵn</th></tr>
          <tr><td>bột (kg / mẻ)</td><td>1</td><td>1</td><td>24</td></tr>
          <tr><td>đường (kg / mẻ)</td><td>2</td><td>1</td><td>32</td></tr>
          <tr><td>lãi (một mẻ)</td><td>15</td><td>10</td><td></td></tr></table>
          <p>Làm bao nhiêu mẻ mỗi loại để <b>lãi nhiều nhất</b>?</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Chào bạn, một xưởng làm hai loại bánh. Mỗi mẻ bánh loại 1 cần 1 ki-lô-gam bột, mỗi mẻ loại 2 cũng cần 1, và xưởng chỉ có 24. Về đường, mẻ loại 1 cần 2, mẻ loại 2 cần 1, xưởng có 32. Mỗi mẻ loại 1 lãi 15, loại 2 lãi 10, vậy làm bao nhiêu mẻ mỗi loại để lãi nhiều nhất?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: thay số kiểm bất đẳng thức và giải hệ hai phương trình"
    checks:
      - "10 + 10 == 20 <= 24 and 2*10 + 10 == 30 <= 32 and 12 + 12 <= 24 and 2*12 + 12 == 36 > 32"
      - "(lambda x, y: sp.solve([x + y - 5, 2*x + y - 7], [x, y]) == {x: 2, y: 3})(*sp.symbols('x y')) and 7 - 5 == 2 and 5 - 2 == 3 and 2*2 + 3 == 7"
    steps:
      - show: |
          <table class="t"><tr><th>làm thử</th><th>bột cần (có 24)</th><th>đường cần (có 32)</th><th>làm được?</th></tr>
          <tr><td>10 mẻ mỗi loại</td><td>$10 + 10 = 20 \le 24$ ✓</td><td>$2 \cdot 10 + 10 = 30 \le 32$ ✓</td><td>được</td></tr>
          <tr><td>12 mẻ mỗi loại</td><td>$12 + 12 = 24 \le 24$ ✓</td><td>$2 \cdot 12 + 12 = 36 > 32$ <b class="red">vượt</b></td><td>không</td></tr></table>
        introduces: [geq]
        focus: [0, 1, 1, "1.2", "1.3"]
        say: "Trước hết, ôn hai phép tính sẽ dùng suốt bài này. Thứ nhất, muốn biết một phương án có làm được không, ta thay số vào từng giới hạn rồi so sánh. Dấu nhỏ hơn hoặc bằng ở đây đọc là không vượt quá. Làm 10 mẻ mỗi loại thì cần 20 ki-lô-gam bột và 30 ki-lô-gam đường, cả hai đều không vượt mức có sẵn, nên làm được. Làm 12 mẻ mỗi loại thì vừa đúng hết 24 ki-lô-gam bột, nhưng cần 36 ki-lô-gam đường, vượt 32, nên không làm được."
      - show: |
          $$\begin{cases} x + y = 5 \\ 2x + y = 7 \end{cases}$$
          <p>Lấy dòng dưới trừ dòng trên, $y$ bị khử: $\ (2x + y) - (x + y) = 7 - 5 \implies x = 2$, rồi $y = 5 - 2 = 3$.</p>
          <p class="note">Làm thử vào dòng dưới: $2 \cdot 2 + 3 = 7$ ✓</p>
        focus: [0, 1, 2, 2, 3]
        say: "Thứ hai, giải hệ hai phương trình bậc nhất bằng cách trừ vế theo vế. Ví dụ x cộng y bằng 5, và 2 x cộng y bằng 7. Lấy phương trình dưới trừ phương trình trên, chữ y bị khử, còn lại x bằng 2. Thay vào phương trình đầu, y bằng 5 trừ 2, bằng 3. Làm thử vào phương trình dưới, 2 nhân 2 cộng 3 bằng 7, đúng như đề."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: biến quyết định, hàm mục tiêu, ràng buộc"
    steps:
      - show: |
          <p>$x_1, x_2$: số mẻ bánh loại 1, loại 2 (<b>biến quyết định</b>).</p>
          $$\max\ z = 15x_1 + 10x_2 \quad \text{với} \quad \begin{cases} x_1 + x_2 \le 24 & \text{(bột)} \\ 2x_1 + x_2 \le 32 & \text{(đường)} \\ x_1 \ge 0,\ x_2 \ge 0 & \text{(không âm)} \end{cases}$$
          <p class="note">“Tuyến tính”: mục tiêu và ràng buộc đều là tổng các biến nhân hằng số — không có $x_1^2$, $x_1 x_2$.</p>
        introduces: [max_fn]
        focus: [1, 2, 2, 3]
        say: "Gọi x một, x hai là số mẻ bánh loại 1 và loại 2, gọi là các biến quyết định. Ta cần làm cho z bằng 15 x một cộng 10 x hai lớn nhất, gọi là hàm mục tiêu. Đi kèm ba ràng buộc, về bột, về đường, và số mẻ không âm. Chữ tuyến tính nghĩa là mọi biểu thức đều là tổng các biến nhân hằng số, không có bình phương hay tích hai biến."

  # ───────────────────────── 3. MIỀN CHẤP NHẬN ─────────────────────────
  - id: region
    kind: intuition
    title: "Vẽ miền chấp nhận được"
    checks:
      - "(lambda x, y: sp.solve([x + y - 24, 2*x + y - 32], [x, y]) == {x: 8, y: 16})(*sp.symbols('x y'))"
      - "all(a + b <= 24 and 2*a + b <= 32 and a >= 0 and b >= 0 for a, b in ((0, 0), (16, 0), (8, 16), (0, 24)))"
    steps:
      - show: |
          <div class="row"><div>{{FIG}}</div>
          <div class="col"><p>Mỗi ràng buộc giữ lại một <b>nửa mặt phẳng</b>: bột, đường — phía dưới đường biên; không âm — phía phải trục $x_2$, phía trên trục $x_1$.</p>
          <p>Miền chấp nhận được (tô xanh) là tứ giác $OABC$.</p>
          <p>Đỉnh $B$: giao hai đường, trừ hai phương trình: $\ (2x_1 + x_2) - (x_1 + x_2) = 32 - 24 \Rightarrow x_1 = 8$, rồi $x_2 = 16$.</p></div></div>
        focus: ["1.2", "1.2", "1.2", "1.2"]
        say: "Mỗi ràng buộc giữ lại một nửa mặt phẳng, giới hạn bột và giới hạn đường giữ phần nằm dưới đường biên, đường xanh dương là bột, đường xanh lá là đường. Còn hai điều kiện không âm giữ phần bên phải trục đứng và phía trên trục ngang. Phần chung của tất cả, tô xanh nhạt, là tứ giác O A B C, gọi là miền chấp nhận được. Đỉnh B là giao hai đường biên, theo quy tắc chuyển vế, trừ hai phương trình cho nhau được x một bằng 8, rồi x hai bằng 16."

  # ───────────────────────── 4. ĐỊNH LÝ ĐỈNH ─────────────────────────
  - id: vertex
    kind: formula
    title: "Vì sao nghiệm tốt nhất nằm ở một đỉnh"
    steps:
      - show: |
          <div class="row"><div>{{FIGL}}</div>
          <div class="col"><p>Các điểm có cùng giá trị $z$ nằm trên một <b>đường thẳng</b> $15x_1 + 10x_2 = z$. Tăng $z$ thì đường dịch song song lên trên.</p>
          <p>Dịch tới khi chỉ còn chạm miền ở <b>một điểm cuối cùng</b>: đó là một <b>đỉnh</b> (hoặc cả một cạnh).</p>
          <div class="box key">Nếu bài toán có nghiệm tối ưu, thì có một <b>đỉnh</b> tối ưu → chỉ cần thử các đỉnh.</div></div></div>
        focus: ["1.2", "1.2", "1.2", "1.2"]
        say: "Vì sao chỉ cần xét đỉnh? Các điểm có cùng giá trị z nằm trên một đường thẳng, và khi tăng z thì đường này dịch song song lên trên. Ta dịch cho tới khi nó chỉ còn chạm miền ở điểm cuối cùng, và điểm đó là một đỉnh, hoặc cả một cạnh. Nên nếu bài toán có nghiệm tối ưu thì luôn có một đỉnh tối ưu."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Thử bốn đỉnh"
    checks:
      - "[15*a + 10*b for a, b in ((0, 0), (16, 0), (8, 16), (0, 24))] == [0, 240, 280, 240]"
      - "15*0 + 10*0 == 0 and min(24, 32 // 2) == 16 and 15*16 == 240 and 15*8 == 120 and 10*16 == 160 and 120 + 160 == 280 and min(24, 32) == 24 and 10*24 == 240"
    steps:
      - show: |
          <p><b>Bước 1</b> — đỉnh $\text{O}(0, 0)$, không làm mẻ nào:</p>
          $$z = 15 \cdot 0 + 10 \cdot 0 = 0$$
        focus: [1, 2]
        say: "Bước một, đỉnh O là gốc toạ độ, tức là không làm mẻ nào. Thay vào hàm mục tiêu, z bằng 15 nhân 0 cộng 10 nhân 0, bằng 0."
      - show: |
          <p><b>Bước 2</b> — đỉnh $A$ trên trục $x_1$ ($x_2 = 0$): bột cho $x_1 \le 24$, đường cho $2x_1 \le 32$, tức $x_1 \le 16$. Giới hạn chặt hơn là đường, nên $A(16, 0)$.</p>
          $$z = 15 \cdot 16 + 10 \cdot 0 = 240$$
        focus: [1, 1, 1, 2]
        say: "Bước hai, đỉnh A nằm trên trục x một, nghĩa là x hai bằng 0. Bột cho phép tối đa 24 mẻ loại 1, còn đường chỉ cho 2 x một không quá 32, tức tối đa 16 mẻ. Giới hạn chặt hơn là đường, nên A là điểm 16, 0. Thay vào, z bằng 15 nhân 16, bằng 240."
      - show: |
          <p><b>Bước 3</b> — đỉnh $B(8, 16)$, giao của đường bột và đường đường vừa giải ở trên:</p>
          $$z = 15 \cdot 8 + 10 \cdot 16 = 120 + 160 = 280$$
        focus: [1, 2]
        say: "Bước ba, đỉnh B là điểm 8, 16, giao của hai đường biên mà ta đã giải bằng cách trừ hai phương trình. Thay vào, z bằng 15 nhân 8 là 120, cộng 10 nhân 16 là 160, tổng cộng 280."
      - show: |
          <p><b>Bước 4</b> — đỉnh $C$ trên trục $x_2$ ($x_1 = 0$): bột cho $x_2 \le 24$, đường cho $x_2 \le 32$. Chặt hơn là bột, nên $C(0, 24)$.</p>
          $$z = 15 \cdot 0 + 10 \cdot 24 = 240$$
        focus: [1, 1, 2]
        say: "Bước bốn, đỉnh C nằm trên trục x hai, nghĩa là x một bằng 0. Lần này bột cho tối đa 24 mẻ loại 2, đường cho tối đa 32 mẻ, nên giới hạn chặt hơn là bột, và C là điểm 0, 24. Thay vào, z bằng 10 nhân 24, bằng 240."
      - clear: true
        show: |
          <table class="t"><tr><th>đỉnh</th><th>$\text{O}(0, 0)$</th><th>$A(16, 0)$</th><th>$B(8, 16)$</th><th>$C(0, 24)$</th></tr>
          <tr><td>$z = 15x_1 + 10x_2$</td><td>0</td><td>240</td><td>$\hlg{280}$</td><td>240</td></tr></table>
          <div class="box ok">Làm 8 mẻ loại 1, 16 mẻ loại 2: lãi lớn nhất $z = 120 + 160 = 280$.</div>
        focus: [1, 2]
        say: "Bước năm, đặt bốn kết quả cạnh nhau, O cho 0, A cho 240, B cho 280, C cho 240. Vậy làm 8 mẻ loại 1 và 16 mẻ loại 2, lãi lớn nhất là 120 cộng 160, bằng 280."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: một chứng chỉ chặn trên"
    checks:
      - "(lambda x, y: sp.expand(5*(x + y) + 5*(2*x + y) - (15*x + 10*y)))(*sp.symbols('x y')) == 0 and 5*24 + 5*32 == 280"
      - "8 + 16 == 24 and 2*8 + 16 == 32"
      - "(lambda a, b: sp.solve([a + 2*b - 15, a + b - 10], [a, b]) == {a: 5, b: 5})(*sp.symbols('a b')) and 15 - 10 == 5 and 10 - 5 == 5"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: $B$ dùng hết cả bột và đường: $\ 8 + 16 = 24$, $\ 2 \cdot 8 + 16 = 32$ ✓</p>
          <p><b>Phép thử 2</b> (chứng chỉ): $\ 15x_1 + 10x_2 = 5(x_1 + x_2) + 5(2x_1 + x_2) \le 5 \cdot 24 + 5 \cdot 32 = 280$</p>
          <p class="note">Mọi điểm thoả hai ràng buộc đều có $z \le 280$, mà $B$ đạt 280 → chắc chắn tối ưu.</p>
        focus: [1, 2, 3]
        say: "Phép thử đầu tiên, B dùng hết cả bột lẫn đường, 8 cộng 16 bằng 24, 2 nhân 8 cộng 16 bằng 32. Phép thử thứ hai mạnh hơn, viết hàm mục tiêu thành 5 lần ràng buộc bột cộng 5 lần ràng buộc đường, nên z không vượt quá 5 nhân 24 cộng 5 nhân 32, bằng 280. Vì mọi điểm hợp lệ đều có z không quá 280, mà B đạt đúng 280, nên B chắc chắn tối ưu."
      - clear: true
        show: |
          <p>Hai số 5 tìm ở đâu? Gọi $y_1$, $y_2$ là số lần lấy ràng buộc bột, ràng buộc đường. Muốn $y_1(x_1 + x_2) + y_2(2x_1 + x_2)$ <b>đúng bằng</b> $15x_1 + 10x_2$:</p>
          $$\begin{cases} y_1 + 2y_2 = 15 & (\text{hệ số của } x_1) \\ y_1 + y_2 = 10 & (\text{hệ số của } x_2) \end{cases} \implies y_2 = 5,\ \ y_1 = 5$$
          <p class="note">Cả hai số đều không âm, nên nhân vào hai bất đẳng thức “$\le$” không làm đổi chiều.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Hai số 5 đó tìm ở đâu ra? Gọi y một, y hai là số lần ta lấy ràng buộc bột và ràng buộc đường, và đòi tổng của chúng đúng bằng hàm mục tiêu. So hệ số của x một, y một cộng 2 y hai phải bằng 15, còn so hệ số của x hai, y một cộng y hai phải bằng 10. Trừ hai phương trình như phần ôn, y hai bằng 5, rồi y một bằng 10 trừ 5, bằng 5. Cả hai số đều không âm, nên nhân vào hai bất đẳng thức không làm đổi chiều, và chứng chỉ hợp lệ."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "2*24 + 0 == 48 > 32 and 15*24 == 360"
      - "[10*a + 20*b for a, b in ((0, 0), (16, 0), (8, 16), (0, 24))] == [0, 160, 400, 480] and (lambda t: 10*(-t) + 20*(24 + t) == 480 + 10*t and (-t) + (24 + t) <= 24 and 2*(-t) + (24 + t) <= 32)(100)"
      - "[10*a + 10*b for a, b in ((8, 16), (0, 24), (4, 20))] == [240, 240, 240]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lấy giao điểm của đường biên với trục làm “đỉnh” <b class="red">(sai)</b>
          <br><span class="note">$(24, 0)$ nằm trên đường bột nhưng cần $2 \cdot 24 = 48 > 32$ kg đường — không thuộc miền, dù cho $z = 360$ hấp dẫn. Phép thử: thay đỉnh vào <b>mọi</b> ràng buộc.</span></div>
        say: "Lỗi thứ nhất, lấy giao điểm của đường biên với trục làm đỉnh. Điểm 24, 0 nằm trên đường giới hạn bột, nhưng cần 48 ki-lô-gam đường, vượt 32, nên không thuộc miền, dù cho z bằng 360 trông rất hấp dẫn. Phép thử là thay mỗi đỉnh vào mọi ràng buộc."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên điều kiện không âm <b class="red">(sai)</b>
          <br><span class="note">Miền thành vô hạn. Với $z = 15x_1 + 10x_2$ kết quả tình cờ vẫn 280 (nhờ chứng chỉ). Nhưng với $z = 10x_1 + 20x_2$: có $x \ge 0$ thì lớn nhất 480 tại $C$; bỏ $x \ge 0$, lấy $x_1 = -t$, $x_2 = 24 + t$ thì $z = 480 + 10t$ — <b>lớn mãi</b>, không có nghiệm tối ưu.</span></div>
        say: "Lỗi thứ hai, quên điều kiện không âm. Miền khi đó vô hạn. Với hàm mục tiêu của bài, kết quả tình cờ vẫn là 280 nhờ chứng chỉ vừa rồi. Nhưng với z bằng 10 x một cộng 20 x hai, có điều kiện không âm thì lớn nhất là 480 tại C. Còn bỏ điều kiện đó, cho x một âm dần, z sẽ lớn mãi không dừng, và bài toán không có nghiệm tối ưu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ nghiệm tối ưu luôn duy nhất <b class="red">(sai)</b>
          <br><span class="note">$z = 10x_1 + 10x_2$ song song với cạnh bột: $B$, $C$ và mọi điểm giữa (như $(4, 20)$) đều cho 240 — <b>vô số nghiệm</b>.</span>
          <table class="t"><tr><th>điểm</th><th>$B(8, 16)$</th><th>$(4, 20)$</th><th>$C(0, 24)$</th></tr><tr><td>$10x_1 + 10x_2$</td><td>240</td><td>240</td><td>240</td></tr></table></div>
        say: "Lỗi thứ ba, nghĩ nghiệm tối ưu luôn duy nhất. Với z bằng 10 x một cộng 10 x hai, đường mức song song với cạnh giới hạn bột, nên B, C và mọi điểm ở giữa, như 4, 20, đều cho 240, tức có vô số nghiệm."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Không kiểm miền có rỗng không <b class="red">(sai)</b>
          <br><span class="note">Ví dụ thêm ràng buộc $x_1 + x_2 \ge 30$ vào bài: không điểm nào vừa $\le 24$ vừa $\ge 30$ → bài toán <b>vô nghiệm</b>.</span></div>
        say: "Lỗi thứ tư, không kiểm miền có rỗng hay không. Nếu thêm yêu cầu tổng số mẻ ít nhất 30, thì không điểm nào vừa không quá 24 vừa ít nhất 30, và bài toán vô nghiệm."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[3*a + 5*b for a, b in ((0, 0), (4, 0), (4, 3), (2, 6), (0, 6))] == [0, 12, 27, 36, 30]"
      - "all(a <= 4 and 2*b <= 12 and 3*a + 2*b <= 18 for a, b in ((0, 0), (4, 0), (4, 3), (2, 6), (0, 6)))"
      - "18 - 3*4 == 6 and 6 // 2 == 3 and 18 - 2*6 == 6 and 6 // 3 == 2"
      - "(lambda x, y: sp.expand(1*(3*x + 2*y) + Rational(3, 2)*(2*y) - (3*x + 5*y)) == 0)(*sp.symbols('x y')) and 18 + Rational(3, 2)*12 == 36 and 18 + 18 == 36"
    steps:
      - show: |
          $$\max\ z = 3x_1 + 5x_2 \quad \text{với} \quad x_1 \le 4,\ \ 2x_2 \le 12,\ \ 3x_1 + 2x_2 \le 18,\ \ x_1, x_2 \ge 0$$
          <p>Tìm các đỉnh và nghiệm tối ưu.</p>
        focus: [0, 1, 2, 0]
        say: "Đến lượt bạn, tìm giá trị lớn nhất của 3 x một cộng 5 x hai. Các ràng buộc là x một không quá 4, 2 x hai không quá 12, 3 x một cộng 2 x hai không quá 18, và hai biến không âm. Hãy tìm các đỉnh và nghiệm tối ưu. Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p><b>Bước 1</b> — tìm các đỉnh, mỗi đỉnh là giao của hai đường biên:</p>
          <table class="t"><tr><th>đỉnh</th><th>giao của</th><th>tính</th></tr>
          <tr><td>$(0, 0)$, $(4, 0)$, $(0, 6)$</td><td>một đường biên với một trục</td><td>đọc thẳng</td></tr>
          <tr><td>$(4, 3)$</td><td>$x_1 = 4$ và $3x_1 + 2x_2 = 18$</td><td>$2x_2 = 18 - 12 = 6 \implies x_2 = 3$</td></tr>
          <tr><td>$(2, 6)$</td><td>$2x_2 = 12$ và $3x_1 + 2x_2 = 18$</td><td>$3x_1 = 18 - 12 = 6 \implies x_1 = 2$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án, bước một, tìm các đỉnh, mỗi đỉnh là giao của hai đường biên. Ba đỉnh 0, 0, rồi 4, 0, và 0, 6 nằm trên trục, đọc thẳng từ các giới hạn x một không quá 4 và x hai không quá 6. Đỉnh 4, 3 là giao của x một bằng 4 với đường 3 x một cộng 2 x hai bằng 18, nên 2 x hai bằng 18 trừ 12, tức x hai bằng 3. Đỉnh 2, 6 là giao của x hai bằng 6 với cùng đường đó, nên 3 x một bằng 6, tức x một bằng 2."
      - clear: true
        show: |
          <p><b>Bước 2</b> — thay vào $z = 3x_1 + 5x_2$:</p>
          <table class="t"><tr><th>đỉnh</th><th>$(0, 0)$</th><th>$(4, 0)$</th><th>$(4, 3)$</th><th>$(2, 6)$</th><th>$(0, 6)$</th></tr>
          <tr><td>$z$</td><td>0</td><td>12</td><td>27</td><td>$\hlg{36}$</td><td>30</td></tr></table>
          <p>Tối ưu $z = 36$ tại $(2, 6)$. &nbsp; Kiểm: $\ 3 \cdot 2 + 2 \cdot 6 = 18$ ✓, $\ 2 \cdot 6 = 12$ ✓.</p>
        focus: [1, 2, 3, 3]
        say: "Bước hai, thay năm đỉnh vào z bằng 3 x một cộng 5 x hai. Các giá trị lần lượt là 0, 12, 27, 36 và 30. Tối ưu là 36 tại điểm 2, 6. Điểm này nằm đúng trên hai đường biên, 3 nhân 2 cộng 2 nhân 6 bằng 18, và 2 nhân 6 bằng 12."
      - show: |
          <p><b>Bước 3</b> — chứng chỉ, cùng cách tìm hai số nhân như trên:</p>
          $$3x_1 + 5x_2 = 1 \cdot (3x_1 + 2x_2) + \frac{3}{2} \cdot (2x_2) \le 18 + \frac{3}{2} \cdot 12 = 36$$
          <p class="note">Không điểm nào vượt 36, mà $(2, 6)$ đạt 36 → chắc chắn tối ưu.</p>
        focus: [1, 2, 2, 3]
        say: "Bước ba, dựng chứng chỉ như đã làm với xưởng bánh. Lấy 1 lần ràng buộc thứ ba để có đúng 3 x một, rồi cần thêm 3 x hai, nên lấy 3 phần 2 lần ràng buộc 2 x hai không quá 12. Vế phải là 18 cộng 3 phần 2 nhân 12, tức 18 cộng 18, bằng 36. Không điểm nào vượt 36, mà điểm 2, 6 đạt đúng 36, nên nó chắc chắn tối ưu."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mô hình: biến, mục tiêu, ràng buộc</span><span class="a">→</span>
          <span class="n">miền chấp nhận được (đa giác)</span><span class="a">→</span>
          <span class="n">đường mức dịch song song</span><span class="a">→</span>
          <span class="n">thử các đỉnh</span><span class="a">→</span>
          <span class="n">kiểm bằng chứng chỉ chặn trên</span></div>
        say: "Tổng kết chuỗi logic. Lập mô hình gồm biến, mục tiêu và ràng buộc, vẽ miền chấp nhận được là một đa giác. Đường mức dịch song song cho thấy nghiệm nằm ở đỉnh, nên ta thử các đỉnh, rồi kiểm bằng một chứng chỉ chặn trên."
      - show: |
          <div class="box key"><b>Tư duy:</b> một đáp số tối ưu đáng tin khi có <b>hai mặt</b>: một điểm đạt giá trị đó, và một lý do không điểm nào vượt được.</div>
        say: "Điều cần mang theo, một đáp số tối ưu đáng tin khi có hai mặt, một điểm đạt được giá trị đó, và một lý do không điểm nào vượt được."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 22): <b>thuật toán đơn hình</b> — khi có hàng trăm biến không vẽ được hình, đi từ đỉnh này sang đỉnh kề tốt hơn bằng các phép tính trên bảng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 22, ta học thuật toán đơn hình. Khi có hàng trăm biến, không vẽ được hình, ta đi từ đỉnh này sang đỉnh kề tốt hơn bằng các phép tính trên một bảng số. Hẹn gặp bạn ở bài tiếp theo."
