# Quy ước: đồ thị VÔ HƯỚNG, liên thông; trọng số w(u, v); n = số đỉnh, m = số cạnh; “cây khung” = tập cạnh nối mọi đỉnh, không chu
#   trình; “gốc” của một nhóm trong cấu trúc hợp–tìm = phần tử đại diện, find(x) trả gốc của nhóm chứa x.
# Tên Kruskal, Prim, Tarjan CHỈ hiện trên màn hình: dò phát âm p5_do_thi (2026-10-27) Kruskal tối đa 5/8, Prim tối đa 3/8 → lời đọc
#   gọi “thuật toán xét cạnh từ nhẹ đến nặng” và “thuật toán mở rộng cây từ một đỉnh”.
# Bài mới ngoài bản thảo (curriculum/cs112.yaml Phần 7).
# Nối bài trước (luật 17): bài 24 — cây đường đi ngắn nhất (khác cây khung nhỏ nhất); bài 16 — lập luận đổi chỗ chứng minh tham lam;
#   bài 7 — đồ thị vô hướng; bài 6 — đống nhị phân lấy cạnh nhẹ nhất; bài 12 — sắp xếp trộn Θ(m log m).
objectives:
  - "Phát biểu cây khung và cây khung nhỏ nhất; biết cây khung của n đỉnh có đúng n − 1 cạnh"
  - "Chứng minh tính chất lát cắt bằng lập luận đổi cạnh"
  - "Chạy tay thuật toán xét cạnh từ nhẹ đến nặng (Kruskal) với cấu trúc hợp–tìm, và thuật toán mở rộng cây từ một đỉnh (Prim)"
  - "Phân biệt cây khung nhỏ nhất với cây đường đi ngắn nhất"
