assumes: [sub, dots, log, floor, bigTheta, in]
# Quy ước: chiều cao h = số CẠNH trên đường dài nhất từ gốc xuống lá (cây 1 nút cao 0, cây rỗng cao −1); hệ số cân bằng
#   BF = h(trái) − h(phải); lôgarit cơ số 2 \log_2; tên tiếng Anh (pre-order, in-order, post-order, LL, RR, LR, RL) chỉ trên màn hình.
# Sửa bản thảo (AUDIT_CS112 §2): C8 chiều cao ⌊log₂ n⌋ là của cây nhị phân HOÀN CHỈNH; cây “đầy đủ” có thể cao (n − 1)/2.
# Nối bài trước (luật 17): bài 0 — số lần chia đôi n còn 1 là ⌊log₂ n⌋, tổng 1 + 2 + … + 2^h = 2^(h+1) − 1;
#   bài 4 — đệ quy chạy trên ngăn xếp lời gọi, mỗi lời gọi một khung nhớ; bài 3 — tìm trong mảng chưa sắp xếp tốn Θ(n).
objectives:
  - "Đọc đúng các khái niệm gốc, lá, chiều cao và biết vì sao cây hoàn chỉnh n nút cao ⌊log₂ n⌋"
  - "Duyệt một cây theo ba thứ tự trước, giữa, sau"
  - "Kiểm tra một cây có phải cây tìm kiếm nhị phân không bằng phép duyệt giữa"
  - "Tính hệ số cân bằng và chọn đúng phép xoay khi cây AVL lệch"
