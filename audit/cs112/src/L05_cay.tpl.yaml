  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cây hoàn chỉnh: cao $\lfloor \log_2 n \rfloor$</span><span class="a">→</span>
          <span class="n">tìm kiếm nhị phân: trái nhỏ, phải lớn</span><span class="a">→</span>
          <span class="n">tìm tốn tối đa chiều cao + 1 bước</span><span class="a">→</span>
          <span class="n">AVL: hệ số trong âm 1 đến 1, xoay khi lệch</span></div>
        say: "Cây hoàn chỉnh n nút chỉ cao làm tròn xuống của lôgarit cơ số 2 của n. Cây tìm kiếm nhị phân đặt khoá nhỏ bên trái, lớn bên phải, nên tìm tốn tối đa chiều cao cộng 1 bước. Cây AVL giữ mọi hệ số cân bằng trong khoảng âm 1 đến 1 bằng các phép xoay, nên chiều cao luôn nhỏ."
      - show: |
          <div class="box key"><b>Tư duy:</b> chi phí trên cây = chiều cao. Mọi câu hỏi “nhanh không?” quy về “cây có thấp không?”.</div>
        say: "Chi phí trên cây chính là chiều cao, nên mọi câu hỏi nhanh hay không đều quy về cây có thấp không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>bảng băm và đống nhị phân</b> — tra cứu gần như tức thì bằng hàm băm, và một cây hoàn chỉnh cất trong mảng để luôn lấy được phần tử ưu tiên nhất.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học bảng băm, cách tra cứu gần như tức thì, và đống nhị phân, một cây hoàn chỉnh cất gọn trong mảng để luôn lấy được phần tử ưu tiên nhất."
