scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tìm một số trong một triệu số: 20 bước hay một triệu bước?"
    checks:
      - "math.ceil(math.log2(10**6)) == 20 and round(math.log2(10**6), 1) == 19.9"
    steps:
      - show: |
          <p>Bài 3: tìm trong mảng chưa sắp xếp tốn $\Theta(n)$ — một triệu số, có thể một triệu lần so sánh.</p>
          <p>Cây tìm kiếm nhị phân <b>cân bằng</b>: khoảng $\log_2 10^6 \approx 19{,}9$ → chỉ <b>20 bước</b>.</p>
          <p class="note">Nhưng nếu cây bị lệch thành một hàng dài, lại quay về một triệu bước. Hôm nay: vì sao, và cách giữ cây cân bằng.</p>
        focus: [1, 2, 3]
        say: "Chào bạn, ở bài 3, tìm một số trong mảng chưa sắp xếp tốn Theta của n, tức một triệu số cần một triệu lần so sánh. Một cây tìm kiếm nhị phân cân bằng chỉ cần khoảng lôgarit cơ số 2 của một triệu, chừng 20 bước. Nhưng nếu cây lệch thành một hàng dài, ta lại về một triệu bước, và hôm nay ta học cách giữ cây cân bằng."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: chia đôi, tổng lũy thừa của 2, và đệ quy"
    checks:
      - "[10, 10 // 2, 10 // 4, 10 // 8] == [10, 5, 2, 1] and math.floor(math.log2(10)) == 3"
      - "1 + 2 + 4 == 7 == 2**3 - 1"
      - "(lambda f: f(f, 3, 1))(lambda f, n, d: d if n == 1 else f(f, n - 1, d + 1)) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>ôn lại</th><th>ví dụ số</th></tr>
          <tr><td>Bài 0: chia đôi $n$ (làm tròn xuống) đến khi còn 1 mất $\lfloor \log_2 n \rfloor$ lần</td><td>$10 \to 5 \to 2 \to 1$: 3 lần $= \lfloor \log_2 10 \rfloor$</td></tr>
          <tr><td>Bài 0: tổng lũy thừa của 2: $1 + 2 + \dots + 2^h = 2^{h+1} - 1$</td><td>$1 + 2 + 4 = 7 = 2^3 - 1$</td></tr>
          <tr><td>Bài 4: đệ quy là hàm tự gọi lại chính nó, mỗi lời gọi một khung nhớ trên ngăn xếp</td><td>fact(3) gọi fact(2), fact(2) gọi fact(1): 3 khung</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn ba điều sẽ dùng. Ở bài 0, chia đôi n, làm tròn xuống, tới khi còn 1 mất làm tròn xuống của lôgarit cơ số 2 của n lần. Ví dụ 10 thành 5, thành 2, thành 1 là 3 lần. Cũng ở bài 0, tổng các lũy thừa của 2 từ 1 tới 2 mũ h bằng 2 mũ h cộng 1, trừ 1, ví dụ 1 cộng 2 cộng 4 bằng 7. Ở bài 4, đệ quy là hàm tự gọi lại chính nó, mỗi lời gọi chiếm một khung nhớ, như giai thừa của 3 cần ba khung."

  # ───────────────────────── 2. KHÁI NIỆM ─────────────────────────
  - id: terms
    kind: symbol
    title: "Giải mã: gốc, con, lá, chiều cao"
    steps:
      - show: |
          {{T1}}
          <p>Mỗi nút có tối đa <b>2 con</b>: trái và phải. Một nút cùng mọi nút nằm dưới nó là một <b>cây con</b> của nút đó.</p>
          <p><b>Gốc</b>: 8 (không có cha). &nbsp; <b>Lá</b>: 1, 6, 14 (không có con).</p>
          <p><b>Chiều cao</b> $h$: số <b>cạnh</b> (đoạn nối nút cha với nút con) trên đường dài nhất từ gốc xuống lá. Ở đây $h = 2$.</p>
        focus: [2, 2, 3, 4, 4]
        say: "Cây nhị phân là cây mà mỗi nút có tối đa hai con, con trái và con phải. Một nút cùng mọi nút nằm dưới nó lập thành một cây con của nút đó. Nút trên cùng không có cha gọi là gốc, ở đây là 8, còn các nút không có con gọi là lá, ở đây là 1, 6 và 14. Chiều cao là số cạnh, tức số đoạn nối cha với con, trên đường dài nhất từ gốc xuống một lá, ở đây là 2. Quy ước cây một nút cao 0."

  - id: height
    kind: formula
    title: "Vì sao cây hoàn chỉnh n nút cao làm tròn xuống của lôgarit cơ số 2 của n"
    checks:
      - "all(sum(2**k for k in range(h + 1)) == 2**(h + 1) - 1 for h in range(0, 30))"
      - "all(math.floor(math.log2(m)) == m.bit_length() - 1 for m in range(1, 5000)) and math.floor(math.log2(7)) == 2 and math.floor(math.log2(10)) == 3"
      - "(7 - 1) // 2 == 3"
      - "all(2**(m.bit_length() - 1) <= m <= 2**m.bit_length() - 1 for m in range(1, 5000)) and 2**2 <= 7 <= 2**3 - 1 and 2**3 <= 10 <= 2**4 - 1"
    steps:
      - show: |
          <p>Tầng $k$ (gốc là tầng 0) có tối đa $2^k$ nút, vì mỗi nút sinh tối đa 2 con. Cây cao $h$ nên có tối đa</p>
          $$1 + 2 + 4 + \dots + 2^h = 2^{h+1} - 1 \ \text{nút} \quad (\text{tổng lũy thừa của 2, bài 0})$$
        focus: [1, 2]
        say: "Vì mỗi nút sinh tối đa hai con, tầng thứ k có tối đa 2 mũ k nút, với gốc là tầng 0. Theo tổng lũy thừa của 2 ở bài 0, cây cao h chứa tối đa 2 mũ h cộng 1, trừ 1 nút."
      - show: |
          <p><b>Cây hoàn chỉnh</b>: mọi tầng đầy, trừ tầng cuối được lấp từ trái sang. Khi đó $h$ tầng trên đầy có $2^h - 1$ nút, tầng cuối có ít nhất 1 nút, nên $2^h \le n \le 2^{h+1} - 1$, tức $\ h = \lfloor \log_2 n \rfloor$.</p>
          <p>Thử: $n = 7$ (3 tầng đầy) → $h = \lfloor \log_2 7 \rfloor = 2$ ✓; &nbsp; $n = 10$ → $h = 3$ ✓</p>
          <p class="note">Theo bài 0, $\lfloor \log_2 n \rfloor$ là số lần chia đôi $n$ còn 1: mỗi tầng xuống, số nút “gấp đôi”.</p>
        focus: [1, 1, 1, 2]
        say: "Cây hoàn chỉnh là cây có mọi tầng đều đầy, trừ tầng cuối được lấp từ trái sang phải. Khi đó các tầng phía trên đã đầy, có 2 mũ h trừ 1 nút, còn tầng cuối có ít nhất một nút. Nên n nằm từ 2 mũ h đến 2 mũ h cộng 1 trừ 1, và chiều cao đúng bằng làm tròn xuống của lôgarit cơ số 2 của n. Thử với 7 nút xếp đủ ba tầng, chiều cao là 2, còn 10 nút thì cao 3. "
      - show: |
          <div class="box warn">Chỉ cây <b>hoàn chỉnh</b> (hay cân bằng) mới thấp như vậy. Cây “đầy đủ” (mỗi nút 0 hoặc 2 con) vẫn có thể cao tới $\dfrac{n - 1}{2}$: 7 nút cao 3.</div>
        say: "Lưu ý, chỉ cây hoàn chỉnh, hay cây được giữ cân bằng, mới thấp như vậy. Cây đầy đủ, nghĩa là mỗi nút có 0 hoặc 2 con, vẫn có thể lệch về một phía, cao tới n trừ 1 chia 2, ví dụ 7 nút cao 3."

  # ───────────────────────── 3. BA CÁCH DUYỆT ─────────────────────────
  - id: traversal
    kind: concept
    title: "Ba cách duyệt cây bằng đệ quy"
    checks:
      - "(lambda t: (lambda pre, ino, post: (pre(pre, t), ino(ino, t), post(post, t)))(lambda f, n: [] if n is None else [n[0]] + f(f, n[1]) + f(f, n[2]), lambda f, n: [] if n is None else f(f, n[1]) + [n[0]] + f(f, n[2]), lambda f, n: [] if n is None else f(f, n[1]) + f(f, n[2]) + [n[0]]))((8, (3, (1, None, None), (6, None, None)), (10, None, (14, None, None)))) == ([8, 3, 1, 6, 10, 14], [1, 3, 6, 8, 10, 14], [1, 6, 3, 14, 10, 8])"
    steps:
      - show: |
          {{T1}}
          <table class="t"><tr><th>cách duyệt</th><th>thứ tự thăm</th><th>kết quả</th></tr>
          <tr><td>trước (pre-order)</td><td>nút → trái → phải</td><td>8 3 1 6 10 14</td></tr>
          <tr><td>giữa (in-order)</td><td>trái → nút → phải</td><td>1 3 6 8 10 14</td></tr>
          <tr><td>sau (post-order)</td><td>trái → phải → nút</td><td>1 6 3 14 10 8</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Có ba cách duyệt mọi nút. Duyệt trước thăm nút trước, rồi cây con trái, rồi cây con phải, được 8, 3, 1, 6, 10, 14. Duyệt giữa thăm cây con trái, rồi nút, rồi cây con phải, được 1, 3, 6, 8, 10, 14. Duyệt sau thăm hai cây con trước rồi mới tới nút, được 1, 6, 3, 14, 10, 8. Mỗi nút được thăm đúng một lần, nên cả ba tốn Theta của n."

  # ───────────────────────── 4. CÂY TÌM KIẾM NHỊ PHÂN ─────────────────────────
  - id: bst
    kind: concept
    title: "Cây tìm kiếm nhị phân: trái nhỏ hơn, phải lớn hơn"
    checks:
      - "(lambda t: (lambda f: f(f, t, 6, 0))(lambda f, n, x, c: None if n is None else (c + 1 if n[0] == x else f(f, n[1] if x < n[0] else n[2], x, c + 1))))((8, (3, (1, None, None), (6, None, None)), (10, None, (14, None, None)))) == 3"
    steps:
      - show: |
          <div class="box key"><b>Tính chất</b>: với <b>mọi</b> nút, mọi khoá (số cất trong nút, dùng để so sánh khi tìm) trong cây con trái <b>nhỏ hơn</b> nó, mọi khoá trong cây con phải <b>lớn hơn</b> nó.</div>
          <p>Hệ quả: duyệt giữa cho dãy <b>tăng dần</b> (1 3 6 8 10 14).</p>
        focus: [1, 1, 2]
        say: "Cây ví dụ có một tính chất về khoá, tức số cất trong mỗi nút để so sánh khi tìm. Với mọi nút, mọi khoá trong cây con trái đều nhỏ hơn nó, và mọi khoá trong cây con phải đều lớn hơn nó, gọi là cây tìm kiếm nhị phân. Hệ quả là duyệt giữa luôn cho dãy tăng dần, như 1, 3, 6, 8, 10, 14."
      - show: |
          <p><b>Tìm 6</b>: $6 < 8$ → sang trái; $\ 6 > 3$ → sang phải; gặp 6 → <b>3 lần so sánh</b>.</p>
          <p>Mỗi bước xuống một tầng → số bước $\le h + 1$. Cây cân bằng: $\Theta(\log n)$.</p>
        focus: [1, 2]
        say: "Tìm số 6, ta so với 8, nhỏ hơn nên sang trái, so với 3, lớn hơn nên sang phải, rồi gặp 6, tổng cộng 3 lần so sánh. Vì mỗi bước xuống một tầng, số bước không quá chiều cao cộng 1, nên với cây cân bằng, việc tìm tốn Theta của lôgarit của n."

  - id: degenerate
    kind: intuition
    title: "Chèn theo thứ tự tăng: cây suy biến thành một hàng"
    steps:
      - show: |
          <div class="row"><div>{{CHAIN}}</div>
          <div class="col"><p>Chèn 1, 2, 3, 4, 5 theo thứ tự: mỗi số lớn hơn mọi số trước → luôn đi sang <b>phải</b>; cây thành một hàng như vậy gọi là <b>suy biến</b>.</p>
          <p>Chiều cao $= n - 1 = 4$ → tìm số 5 tốn 5 lần so sánh: $\Theta(n)$, không hơn danh sách liên kết.</p></div></div>
        say: "Nhưng nếu chèn 1, 2, 3, 4, 5 theo thứ tự tăng, mỗi số mới lớn hơn mọi số cũ nên luôn đi sang phải, và cây thành một hàng dài, gọi là cây suy biến. Chiều cao bằng n trừ 1, tìm số 5 phải so sánh 5 lần, tức Theta của n."

  # ───────────────────────── 5. AVL ─────────────────────────
  - id: avl
    kind: formula
    title: "Cây AVL: hệ số cân bằng và phép xoay"
    checks:
      - "(lambda f: [f(f, h) for h in range(6)])(lambda f, h: 1 if h == 0 else 2 if h == 1 else f(f, h - 1) + f(f, h - 2) + 1) == [1, 2, 4, 7, 12, 20]"
      - "(lambda N: [N(N, h) for h in range(11)] == [1, 2, 4, 7, 12, 20, 33, 54, 88, 143, 232] and all(N(N, h) >= 2 * N(N, h - 2) for h in range(2, 30)) and all(N(N, h) >= 2 ** (h / 2) for h in range(30)) and N(N, 9) == 143 < 232)(lambda f, h: 1 if h == 0 else 2 if h == 1 else f(f, h - 1) + f(f, h - 2) + 1)"
      - "(lambda h: (h(h, (1, None, (2, None, (3, None, None)))[1]) - h(h, (1, None, (2, None, (3, None, None)))[2])) == -2)(lambda h, t: -1 if t is None else 1 + max(h(h, t[1]), h(h, t[2])))"
      - "(lambda h: [h(h, (2, (1, None, None), (3, None, None))[i]) for i in (1, 2)] == [0, 0])(lambda h, t: -1 if t is None else 1 + max(h(h, t[1]), h(h, t[2])))"
    steps:
      - show: |
          <div class="box key">$\text{BF} = h(\text{trái}) - h(\text{phải})$ (cây rỗng cao $-1$). &nbsp; <b>Cây AVL</b>: mọi nút có $\text{BF} \in \{-1, 0, 1\}$.</div>
          <p class="note">Hai nhà toán học Adelson-Velsky và Landis đề xuất năm 1962. Kết quả: chiều cao luôn $\Theta(\log n)$, nên tìm, chèn, xoá đều $\Theta(\log n)$.</p>
          <p class="note">Vì sao thấp: cây AVL cao $h$ ít nút nhất khi một con cao $h - 1$, con kia cao $h - 2$, nên số nút tối thiểu là $1, 2, 4, 7, 12, 20, \dots$ (mỗi số bằng tổng hai số trước cộng 1).</p>
        introduces: [set]
        focus: [1, 1, 1, 3, 3]
        say: "Cây AVL giữ cho cây luôn thấp. Với mỗi nút, hệ số cân bằng bằng chiều cao cây con trái trừ chiều cao cây con phải, theo quy ước cây con rỗng cao âm 1, để một lá cao đúng 0. Cây AVL đòi hỏi mọi nút có hệ số này là âm 1, 0 hoặc 1. Vì sao thấp, vì cây AVL cao h ít nút nhất khi một con cao h trừ 1 và con kia cao h trừ 2. Số nút tối thiểu khi đó là 1, 2, 4, 7, 12, 20, mỗi số bằng tổng hai số trước cộng 1."
      - clear: true
        show: |
          <table class="t"><tr><th>chiều cao $h$</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>…</td><td>10</td></tr><tr><th>số nút ít nhất $N(h)$</th><td>1</td><td>2</td><td>4</td><td>7</td><td>12</td><td>20</td><td>…</td><td>232</td></tr></table>
          <p>$N(h) = N(h-1) + N(h-2) + 1 \ge 2\,N(h-2)$. Thử số: $N(4) = 12 \ge 2 \cdot 4$, $N(10) = 232 \ge 2 \cdot 88$.</p>
          <div class="box key">Cứ hai tầng, số nút ít nhất gấp đôi: $n \ge N(h) \ge 2^{h/2}$, nên $h \le 2\log_2 n$, tức $\Theta(\log n)$. Cây AVL dưới 232 nút cao tối đa 9.</div>
        focus: [1, 2, 3, 3]
        say: "Mỗi số nút ít nhất bằng tổng hai số trước cộng 1, nên đến chiều cao 10 là 232 nút. Số này luôn lớn hơn hoặc bằng hai lần số ở hai tầng trước, ví dụ N của 4 là 12, lớn hơn 2 nhân 4, và N của 10 là 232, lớn hơn 2 nhân 88. Vậy cứ hai tầng số nút ít nhất gấp đôi, nên n lớn hơn hoặc bằng 2 mũ một nửa h, suy ra h nhỏ hơn hoặc bằng 2 lần lôgarit cơ số 2 của n. Nhờ vậy chiều cao luôn là Theta của lôgarit của n, nên tìm, chèn, xoá đều nhanh."

  - id: rotate
    kind: example
    title: "Hai ví dụ xoay: lệch phải phải và lệch trái phải"
    checks:
      - "(lambda h: (h(h, (3, (1, None, (2, None, None)), None)[1]) - h(h, (3, (1, None, (2, None, None)), None)[2])) == 2)(lambda h, t: -1 if t is None else 1 + max(h(h, t[1]), h(h, t[2])))"
    steps:
      - show: |
          <div class="row"><div><p class="note">Chèn 1, 2, 3: nút 1 có BF = −2 (lệch phải phải, <b>RR</b>)</p>{{RR}}</div>
          <div><p class="note">Xoay trái tại 1: 2 lên làm gốc</p>{{OK}}</div></div>
          <p>Cây con trái rỗng cao $-1$, cây con phải cao 1: $\ \text{BF}(1) = -1 - 1 = -2$ → vi phạm → <b>xoay trái</b>.</p>
          <p class="note">Xoay trái tại $x$: con phải $y$ của $x$ lên thay chỗ $x$; con trái của $y$ chuyển thành con phải của $x$; $x$ thành con trái của $y$.</p>
        focus: ["1.1", "1.1", "1.2", 3, 2]
        say: "Ví dụ, chèn 1, 2, 3 theo thứ tự tăng. Tại nút 1, cây con trái rỗng cao âm 1, cây con phải cao 1, nên hệ số cân bằng bằng âm 2, vi phạm. Ta xoay trái tại 1, đưa 2 lên làm gốc, 1 xuống làm con trái. Cụ thể, con phải y của nút x lên thay chỗ x, con trái của y chuyển thành con phải của x, rồi x làm con trái của y. Mọi hệ số trở về 0, và thứ tự duyệt giữa vẫn là 1, 2, 3."
      - clear: true
        show: |
          <p class="note">Chèn 3, 1, 2: BF(3) = +2, BF(1) = −1 (<b>LR</b>)</p>{{LR}}
          <table class="t"><tr><th>trường hợp</th><th>cách xoay</th></tr>
          <tr><td>LL (lệch trái, con trái lệch trái)</td><td>xoay phải 1 lần</td></tr>
          <tr><td>RR</td><td>xoay trái 1 lần</td></tr>
          <tr><td>LR (lệch trái, con trái lệch phải)</td><td>xoay trái ở con, rồi xoay phải ở nút</td></tr>
          <tr><td>RL</td><td>xoay phải ở con, rồi xoay trái ở nút</td></tr></table>
        focus: [[1, 2], [1, 2], "3.4", 3]
        say: "Trường hợp khó hơn, chèn 3, 1, 2. Nút 3 lệch trái với hệ số 2, nhưng con trái của nó lại lệch phải, gọi là trường hợp trái phải. Vì vậy phải xoay hai lần, xoay trái ở nút 1 rồi xoay phải ở nút 3, kết quả lại là cây có gốc 2. Tổng cộng có bốn trường hợp, như trong bảng."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: duyệt giữa phải tăng, mọi hệ số trong khoảng từ âm 1 đến 1"
    checks:
      - "[1, 2, 3] == sorted([1, 2, 3])"
      - "(lambda h: [h(h, n[1]) - h(h, n[2]) for n in [(1, None, None), (3, None, None), (2, (1, None, None), (3, None, None))]] == [0, 0, 0] and h(h, (1, None, None)) == 0)(lambda h, t: -1 if t is None else 1 + max(h(h, t[1]), h(h, t[2])))"
    steps:
      - show: |
          <p><b>Phép thử 1</b> (cây tìm kiếm): duyệt giữa phải ra dãy <b>tăng dần</b>.</p>
          <p><b>Phép thử 2</b> (AVL): tính lại hệ số cân bằng của <b>mọi</b> nút, không chỉ nút vừa chèn.</p>
          <p class="note">Sau phép xoay trái ở ví dụ: duyệt giữa 1, 2, 3 ✓; ba hệ số đều bằng 0 ✓.</p>
        focus: [0, 1, 2, 3]
        say: "Có hai phép thử nên làm sau mỗi lần sửa. Một, với cây tìm kiếm nhị phân, duyệt giữa phải cho dãy tăng dần. Hai, với cây AVL, tính lại hệ số cân bằng của mọi nút, không chỉ nút vừa chèn. Vì vậy sau phép xoay ở ví dụ, ta kiểm thấy duyệt giữa vẫn là 1, 2, 3 và ba hệ số đều bằng 0."
      - clear: true
        show: |
          <p>Làm phép thử 2 trên cây sau khi xoay (gốc 2, con trái 1, con phải 3), từng nút một:</p>
          <table class="t"><tr><th>nút</th><th>$h$(trái)</th><th>$h$(phải)</th><th>BF</th></tr>
          <tr><td>1 (lá)</td><td>−1</td><td>−1</td><td>0</td></tr>
          <tr><td>3 (lá)</td><td>−1</td><td>−1</td><td>0</td></tr>
          <tr><td>2 (gốc)</td><td>0</td><td>0</td><td>0 ✓</td></tr></table>
          <p class="note">Tính từ lá lên gốc: chiều cao của nút $= 1 + $ chiều cao lớn hơn của hai cây con.</p>
        focus: [1, ["2.2", "2.3"], "2.4"]
        say: "Làm phép thử hai trên cây sau khi xoay, đi từng nút một. Hai lá 1 và 3 có hai cây con rỗng, mỗi cây rỗng cao âm 1, nên hệ số bằng âm 1 trừ âm 1, bằng 0. Gốc 2 có hai cây con là hai lá cao 0, nên hệ số bằng 0 trừ 0, bằng 0."

  # ───────────────────────── 6b. QUY MÔ ─────────────────────────
  - id: scale
    kind: concept
    title: "Khi n lớn dần: thứ tự chèn quyết định chiều cao cây"
    checks:
      - "(lambda h: h(h, 1, 1000) == 9 and h(h, 1, 2000) == 10)(lambda h, lo, hi: -1 if lo > hi else 1 + max(h(h, lo, (lo + hi) // 2 - 1), h(h, (lo + hi) // 2 + 1, hi)))"
      - "1000 - 1 == 999 and 2000 - 1 == 1999 and math.floor(math.log2(1000)) == 9 and math.floor(math.log2(2000)) == 10 and math.floor(math.log2(10 ** 6)) == 19"
      - "1000 == 999 + 1 and 2000 == 1999 + 1 and 10 == 9 + 1 and 11 == 10 + 1 and 20 == 19 + 1 and 1000000 == 999999 + 1"
    steps:
      - clear: true
        show: |
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>x, d = goc, 0</code></td><td>gán hai biến cùng lúc: <code>x</code> bắt đầu ở gốc, độ sâu <code>d</code> bắt đầu bằng 0</td><td>sau dòng này d = 0</td></tr><tr><td><code>while True:</code></td><td>lặp lại các dòng thụt vào bên dưới mãi, tới khi gặp <code>return</code> (đưa kết quả ra và kết thúc hàm)</td><td>chạy tới lúc <code>return d</code> trả về độ sâu</td></tr><tr><td><code>i = 1 if k &lt; x[0] else 2</code></td><td><code>x[0]</code> là ô số 0 của danh sách <code>x</code> (đếm từ 0), tức khoá; nếu k nhỏ hơn khoá thì i = 1 (con trái), ngược lại i = 2 (con phải)</td><td>x = [8, A, B], k = 3: i = 1</td></tr></table>
        focus: ["1.1", "1.2", "1.3", "1.4"]
        say: "Hàm chèn dùng năm cách viết của ngôn ngữ lập trình, ta đọc từng cách. Một dòng gán hai biến cùng lúc: x bắt đầu ở gốc, và độ sâu d bắt đầu bằng 0. Vòng lặp này chạy lại các dòng thụt vào dưới nó mãi, tới khi gặp dòng trả về. Dấu ngoặc vuông lấy một ô của danh sách, đếm từ 0, nên ô số 0 của x là khoá; nếu k nhỏ hơn khoá thì i bằng 1, tức con trái, ngược lại i bằng 2."
      - clear: true
        show: |
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>x[i] is None</code></td><td><code>is None</code> hỏi ô <code>i</code> của x còn rỗng không; nếu rỗng, dòng dưới gắn nút mới <code>[k, None, None]</code> vào đó</td><td>ô rỗng: gắn nút mới</td></tr><tr><td><code>d += 1</code></td><td><code>+=</code> cộng thêm vào biến: tăng d thêm 1; dòng <code>x = x[i]</code> cuối cho x đi xuống con vừa chọn</td><td>d = 2 thì thành 3</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Cụm kiểm rỗng hỏi ô i của x còn trống không, và nếu trống thì dòng dưới gắn nút mới vào đó. Cộng bằng tăng độ sâu thêm 1, còn dòng cuối cho x đi xuống nút con vừa chọn."
      - clear: true
        show: |
          <p><b>Chèn một khoá</b> vào cây tìm kiếm nhị phân. Mỗi nút là danh sách <code>[khoá, con trái, con phải]</code>, <code>None</code> là không có con; hàm trả <b>độ sâu</b> của nút mới:</p>
          <div class="code"><div><span class="kw">def</span> them(goc, k):</div><div>    x, d = goc, 0</div><div>    <span class="kw">while</span> True:</div><div>        d += 1</div><div>        i = 1 <span class="kw">if</span> k &lt; x[0] <span class="kw">else</span> 2</div><div>        <span class="kw">if</span> x[i] <span class="kw">is</span> None:</div><div>            x[i] = [k, None, None]</div><div>            <span class="kw">return</span> d</div><div>        x = x[i]</div></div>
        focus: [1, 2, 2]
        say: "Để đo chiều cao thật, ta viết hàm chèn một khoá vào cây tìm kiếm nhị phân. Hàm đi xuống từ gốc, sang trái nếu khoá nhỏ hơn, sang phải nếu không, cho tới chỗ trống. Rồi nó gắn nút mới vào và trả về độ sâu của nút mới."
      - clear: true
        show: |
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>[them(goc, k) for k in thu_tu[1:]]</code></td><td>dựng danh sách mới: với mỗi k trong <code>thu_tu[1:]</code> (dãy bỏ ô đầu) tính <code>them(goc, k)</code> rồi gom lại</td><td><code>[k * 2 for k in [1, 2, 3]]</code> là [2, 4, 6]</td></tr><tr><td><code>max([0] + [...])</code></td><td>dấu cộng nối hai danh sách; <code>max</code> lấy số lớn nhất trong danh sách</td><td><code>max([0] + [3, 7])</code> là 7</td></tr><tr><td><code>(lo + hi) // 2</code></td><td><code>//</code> là chia lấy phần nguyên, bỏ phần lẻ: số ở giữa đoạn từ lo tới hi</td><td>lo = 1, hi = 6: m = 3</td></tr></table>
        focus: ["1.1", "1.2", "1.3", "1.4"]
        say: "Hàm đo chiều cao dùng năm cách viết mới, ta đọc từng cách. Dòng dựng danh sách mới: với mỗi k trong dãy bỏ ô đầu, tính độ sâu chèn k rồi gom lại. Dấu cộng giữa hai danh sách là nối chúng, còn hàm lấy lớn nhất trả về số lớn nhất. Hai dấu gạch chéo là chia lấy phần nguyên, nên đây là số ở giữa đoạn từ lo đến hi."
      - clear: true
        show: |
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>[m] + giua_truoc(lo, m - 1) + giua_truoc(m + 1, hi)</code></td><td>nối ba phần: số giữa m, rồi thứ tự nửa trái, rồi nửa phải; <code>[]</code> là danh sách rỗng</td><td><code>[2] + [1] + [3]</code> là [2, 1, 3]</td></tr><tr><td><code>list(range(1, n + 1))</code></td><td>danh sách các số từ 1 tới n (<code>range</code> không lấy số cuối)</td><td><code>list(range(1, 5))</code> là [1, 2, 3, 4]</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Dòng cuối nối ba phần: số giữa, thứ tự nửa trái, thứ tự nửa phải, và hai ngoặc rỗng là danh sách trống. Hàm tạo danh sách các số từ 1 tới n, vì dãy không lấy số cuối."
      - clear: true
        show: |
          <p>Chiều cao cả cây là độ sâu lớn nhất. Chèn $1, 2, \dots, n$ <b>theo thứ tự tăng</b>, rồi chèn cùng $n$ khoá theo thứ tự <b>giữa trước</b>:</p>
          <div class="code"><div><span class="kw">def</span> cao(thu_tu):</div><div>    goc = [thu_tu[0], None, None]</div><div>    <span class="kw">return</span> max([0] + [them(goc, k) <span class="kw">for</span> k <span class="kw">in</span> thu_tu[1:]])</div><div><span class="kw">def</span> giua_truoc(lo, hi):</div><div>    <span class="kw">if</span> lo &gt; hi:</div><div>        <span class="kw">return</span> []</div><div>    m = (lo + hi) // 2</div><div>    <span class="kw">return</span> [m] + giua_truoc(lo, m - 1) + giua_truoc(m + 1, hi)</div><div></div><div><span class="kw">for</span> n <span class="kw">in</span> (1000, 2000):</div><div>    print(n, cao(list(range(1, n + 1))), cao(giua_truoc(1, n)))</div></div>
          <div class="code"><div>1000 999 9</div><div>2000 1999 10</div></div>
        focus: [1, 2, 3, 3]
        say: "Chiều cao của cả cây là độ sâu lớn nhất của một nút. Ta chèn các số từ 1 đến n theo thứ tự tăng, rồi theo thứ tự giữa trước, tức số ở giữa trước rồi mới tới hai nửa. Với n bằng một nghìn, thứ tự tăng cho cây cao 999, còn giữa trước chỉ cao 9. Với n bằng hai nghìn, cây cao 1999 và 10."
      - clear: true
        show: |
          <table class="t"><tr><th>$n$</th><th>chèn tăng dần: cao</th><th>tìm khoá lớn nhất</th><th>chèn giữa trước: cao</th><th>tìm khoá lớn nhất</th></tr>
          <tr><td>1 000</td><td>999</td><td>1 000 lần so sánh</td><td>9</td><td>10 lần</td></tr>
          <tr><td>2 000</td><td>1 999</td><td>2 000 lần</td><td>10</td><td>11 lần</td></tr>
          <tr><td>1 000 000 (công thức)</td><td>999 999</td><td>1 000 000 lần</td><td>19</td><td>20 lần</td></tr></table>
          <div class="box key"><b>Đánh đổi:</b> dữ liệu thật hay đã gần sắp xếp, nên cây tìm kiếm không tự cân bằng có thể rơi từ $\Theta(\log n)$ xuống $\Theta(n)$. Cây AVL trả thêm vài phép xoay mỗi lần chèn để giữ chiều cao $\Theta(\log n)$.</div>
        focus: ["1.2", "1.4", 2]
        say: "Gấp đôi n, cây chèn tăng dần cao gấp đôi, còn cây giữa trước chỉ cao thêm 1. Với một triệu khoá, tìm khoá lớn nhất tốn một triệu lần so sánh ở cây suy biến, nhưng chỉ 20 lần ở cây thấp. Vì dữ liệu thật hay gần sắp xếp, cây AVL trả thêm vài phép xoay mỗi lần chèn để luôn thấp."

  # ───────────────────────── 7. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda f: f(f, (8, (3, (1, None, None), (9, None, None)), None)))(lambda f, n: [] if n is None else f(f, n[1]) + [n[0]] + f(f, n[2])) == [1, 3, 9, 8]"
      - "[1, 3, 9, 8] != sorted([1, 3, 9, 8])"
    steps:
      - show: |
          <div class="row"><div>{{BAD}}</div>
          <div class="col box warn"><b>Lỗi 1.</b> Chỉ so nút với <b>con trực tiếp</b> <b class="red">(sai)</b>
          <br><span class="note">9 &gt; 3 nên đúng chỗ so với cha, nhưng 9 nằm trong cây con <b>trái</b> của 8 mà lại lớn hơn 8. Phép thử: duyệt giữa ra 1, 3, 9, 8 — không tăng.</span></div></div>
        say: "Lỗi thứ nhất, kiểm tra cây tìm kiếm mà chỉ so mỗi nút với con trực tiếp. Ở cây này, 9 lớn hơn cha của nó là 3, có vẻ đúng, nhưng 9 lại nằm trong cây con trái của 8 mà lớn hơn 8, nên vi phạm. Phép thử duyệt giữa bắt được, vì dãy 1, 3, 9, 8 không tăng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 2.</b> Nói “cây tìm kiếm nhị phân luôn tìm trong $\Theta(\log n)$” <b class="red">(sai)</b>
          <br><span class="note">Chỉ khi cây cân bằng. Cây suy biến (chèn dữ liệu đã sắp xếp) tốn $\Theta(n)$.</span></div>
        say: "Lỗi thứ hai, nói cây tìm kiếm nhị phân luôn tìm trong Theta của lôgarit của n. Điều đó chỉ đúng khi cây cân bằng, còn nếu chèn dữ liệu đã sắp xếp, cây suy biến và việc tìm tốn Theta của n."
      - show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng “cây đầy đủ” mà nói chiều cao $\lfloor \log_2 n \rfloor$ <b class="red">(sai)</b>
          <br><span class="note">Công thức đó dành cho cây <b>hoàn chỉnh</b>. Cây đầy đủ 7 nút có thể cao 3.</span></div>
        say: "Lỗi thứ ba, dùng nhầm thuật ngữ, nói cây đầy đủ thì cao làm tròn xuống của lôgarit cơ số 2 của n. Công thức đó dành cho cây hoàn chỉnh, còn cây đầy đủ bảy nút vẫn có thể cao 3."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Trường hợp LR mà chỉ xoay phải một lần <b class="red">(sai)</b>
          <br><span class="note">Với 3, 1, 2: xoay phải tại 3 cho cây gốc 1 lệch sang phải (BF = −2) — vẫn vi phạm. Phải xoay trái ở con trước.</span></div>
        say: "Lỗi thứ tư, gặp trường hợp trái phải mà chỉ xoay phải một lần. Với ví dụ 3, 1, 2, xoay phải tại 3 cho một cây gốc 1 lệch sang phải với hệ số âm 2, vẫn vi phạm. Phải xoay trái ở nút con trước, rồi mới xoay phải."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda f: f(f, (20, (10, None, None), (30, None, None))))(lambda f, n: [] if n is None else f(f, n[1]) + [n[0]] + f(f, n[2])) == [10, 20, 30]"
      - "(lambda f: f(f, (50, (20, (10, None, None), (40, None, None)), (60, None, None))))(lambda f, n: [] if n is None else [n[0]] + f(f, n[1]) + f(f, n[2])) == [50, 20, 10, 40, 60]"
      - "(lambda h: [(h(h, n[1]), h(h, n[2]), h(h, n[1]) - h(h, n[2])) for n in [(30, None, None), (20, None, (30, None, None)), (10, None, (20, None, (30, None, None)))]] == [(-1, -1, 0), (-1, 0, -1), (-1, 1, -2)])(lambda h, t: -1 if t is None else 1 + max(h(h, t[1]), h(h, t[2])))"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chèn 10, 20, 30 vào cây AVL rỗng. Nút nào lệch, hệ số bao nhiêu, xoay thế nào?</td></tr>
          <tr><td>2</td><td>Cây gốc 50, con trái 20 (có hai con 10 và 40), con phải 60. Viết thứ tự duyệt trước.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Đến lượt bạn tự làm. Câu một, chèn 10, 20, 30 vào một cây AVL rỗng, hỏi nút nào lệch, hệ số bao nhiêu, và xoay thế nào? Câu hai, cây có gốc 50, con trái 20 với hai con 10 và 40, con phải 60, hãy viết thứ tự duyệt trước. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① Sau khi chèn, cây là một hàng 10 → 20 → 30 lệch phải. Tính hệ số từ lá lên:</p>
          <table class="t"><tr><th>nút</th><th>$h$(trái)</th><th>$h$(phải)</th><th>BF</th></tr>
          <tr><td>30</td><td>−1</td><td>−1</td><td>0</td></tr>
          <tr><td>20</td><td>−1</td><td>0</td><td>−1</td></tr>
          <tr><td>10</td><td>−1</td><td>1</td><td>$\hlo{-2}$</td></tr></table>
          <p>Nút 10 lệch phải, con phải 20 cũng lệch phải → <b>RR</b> → <b>xoay trái</b> tại 10 → gốc 20, con 10 và 30.</p>
        focus: [1, "2.3", "2.4", 3, 3]
        say: "Câu một, sau khi chèn, cây là một hàng 10, 20, 30 lệch sang phải, và ta tính hệ số từ lá lên gốc. Nút 20 có cây con trái rỗng cao âm 1 và cây con phải cao 0, nên hệ số là âm 1. Nút 10 có hệ số âm 1 trừ 1, bằng âm 2, vi phạm. Vì nút 10 lệch phải và con phải 20 cũng lệch phải, đây là trường hợp phải phải, nên xoay trái tại 10. Kết quả là gốc 20 với hai con 10 và 30."
      - clear: true
        show: |
          <p>② Duyệt trước: <b>nút → trái → phải</b>, làm đệ quy từ gốc 50:</p>
          <table class="t"><tr><th>lần thăm</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>nút</td><td>50</td><td>20</td><td>10</td><td>40</td><td>60</td></tr>
          <tr><td>vì sao</td><td>gốc</td><td>gốc cây con trái</td><td>con trái của 20</td><td>con phải của 20</td><td>cây con phải của 50</td></tr></table>
          <div class="box ok">$\hlg{50,\ 20,\ 10,\ 40,\ 60}$</div>
        focus: [1, "2.2", "2.2", "2.2", 3]
        say: "Câu hai, duyệt trước thăm nút trước, rồi cây con trái, rồi cây con phải, làm đệ quy từ gốc 50. Thăm 50, rồi vào cây con trái gốc 20, thăm 20. Trong cây con của 20, thăm con trái 10 rồi con phải 40. Xong cả cây con trái của 50 mới sang cây con phải, thăm 60. Kết quả là 50, 20, 10, 40, 60."

