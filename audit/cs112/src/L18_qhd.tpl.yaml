      - clear: true
        show: |
          <p>Ba cách viết trong gợi ý sắp tới:</p>
          <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
          <tr><td><code>dp[a - c]</code></td><td>ô của bảng ở vị trí a trừ c</td><td>a = 8, c = 4: ô dp[4]</td></tr>
