id: L17
course: CS112
series: "CS112 · Phân tích & Thiết kế Thuật toán"
title: "Bài 17 — Tham lam (2): xếp lịch hội trường — chọn hoạt động kết thúc sớm nhất"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "audit/cs112/CS112_ban_thao_goc.yaml#L17 (bản thảo); audit/cs112/verify_cs112.py C23, C23b; ví dụ 11 hoạt động theo Cormen và cộng sự, Introduction to Algorithms, mục 16.1"
assumes: [sub, bigTheta, log]
# Quy ước: hoạt động i bắt đầu sᵢ, kết thúc fᵢ, dùng hội trường trong [sᵢ, fᵢ); hai hoạt động TƯƠNG THÍCH khi cái này kết thúc
#   không muộn hơn lúc cái kia bắt đầu (f ≤ s — kết thúc lúc 4 thì cái bắt đầu lúc 4 vẫn dùng được). “last” = giờ kết thúc
#   của hoạt động vừa chọn.
# Sửa bản thảo (AUDIT_CS112 §2, C23b): KHÔNG nói “duy nhất xếp theo f là đúng” — chọn hoạt động bắt đầu muộn nhất (duyệt ngược)
#   cũng tối ưu; nói đúng: kết thúc sớm nhất là tiêu chí đã chứng minh; bắt đầu sớm nhất và ngắn nhất có phản ví dụ.
# Nối bài trước (luật 17): bài 16 — tham lam chọn ngay thứ có lợi nhất, cần lập luận đổi chỗ để chứng minh; bài 12 — sắp xếp
#   trộn Θ(n log n).
objectives:
  - "Áp dụng quy tắc chọn hoạt động kết thúc sớm nhất và đếm số hoạt động chọn được"
  - "Chứng minh tính tối ưu bằng lập luận đổi chỗ"
  - "Đưa phản ví dụ cho tiêu chí bắt đầu sớm nhất và tiêu chí ngắn nhất"
asr_reviewed:
  - {sentence: "Sự kiện i bắt đầu lúc s i và kết thúc lúc f i, ví dụ sự kiện a một bắt đầu lúc 1, kết thúc lúc 4.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (d→dây/G, f→S, j→gi/di, i→y, x→ích, g→v/dê) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một hội trường, nhiều sự kiện xin dùng"
    steps:
      - show: |
          {{TL}}
          <p>11 sự kiện xin dùng một hội trường. Chọn được <b>nhiều sự kiện nhất</b> mà không hai sự kiện nào chồng giờ.</p>
        focus: [1, 2]
        say: "Chào bạn, mười một sự kiện cùng xin dùng một hội trường, mỗi thanh trên hình là khoảng giờ của một sự kiện. Hãy chọn được nhiều sự kiện nhất, sao cho không hai sự kiện nào chồng giờ lên nhau."
      - show: |
          <div class="box key">Ba tiêu chí tham lam nghe đều hợp lý: bắt đầu <b>sớm nhất</b>? &nbsp; <b>ngắn nhất</b>? &nbsp; kết thúc <b>sớm nhất</b>? &nbsp; Chỉ một cái đúng — và ta sẽ chứng minh.</div>
        say: "Có ba tiêu chí tham lam nghe đều hợp lý, chọn sự kiện bắt đầu sớm nhất, chọn sự kiện ngắn nhất, hay chọn sự kiện kết thúc sớm nhất. Chỉ một trong ba luôn đúng, và hôm nay ta chứng minh điều đó."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn: tham lam cần chứng minh, và hai khoảng giờ có chồng nhau không"
    checks:
      - "(lambda ov: not ov((1, 4), (4, 6)) and ov((1, 4), (3, 5)))(lambda a, b: not (a[1] <= b[0] or b[1] <= a[0])) and sorted([(3, 5), (1, 4), (0, 6)], key=lambda a: a[1]) == [(1, 4), (3, 5), (0, 6)]"
    steps:
      - show: |
          <p>Bài 16: tham lam chọn ngay thứ lợi nhất lúc đó; nó chỉ đáng tin khi có <b>lập luận đổi chỗ</b> — ở cái túi phân số, đổi 1 kg món đơn giá thấp lấy 1 kg món đơn giá cao không bao giờ làm giảm giá trị.</p>
        say: "Ôn lại bài 16, tham lam chọn ngay thứ có lợi nhất lúc đó, và nó chỉ đáng tin khi có một lập luận đổi chỗ. Ở cái túi phân số, đổi một ki-lô-gam của món đơn giá thấp lấy một ki-lô-gam của món đơn giá cao không bao giờ làm giảm giá trị, nên tham lam theo đơn giá là tối ưu."
      - show: |
          <table class="t"><tr><th>khoảng giờ</th><th>so giờ kết thúc cái trước với giờ bắt đầu cái sau</th><th>kết luận</th></tr>
          <tr><td>[1, 4) và [4, 6)</td><td>$4 \le 4$</td><td>không chồng</td></tr>
          <tr><td>[1, 4) và [3, 5)</td><td>$4 > 3$</td><td>chồng nhau</td></tr></table>
          <p class="note">Sắp theo giờ kết thúc tăng dần: (3, 5), (1, 4), (0, 6) → (1, 4), (3, 5), (0, 6).</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Hôm nay ta chỉ cần so hai khoảng giờ. Khoảng từ 1 đến 4 và khoảng từ 4 đến 6 không chồng nhau, vì cái trước kết thúc lúc 4, không muộn hơn lúc cái sau bắt đầu. Khoảng từ 1 đến 4 và khoảng từ 3 đến 5 thì chồng nhau, vì 4 lớn hơn 3. Và sắp theo giờ kết thúc tăng dần nghĩa là xếp lại để số thứ hai tăng dần, như ba cặp ở dòng cuối."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: giờ bắt đầu, giờ kết thúc, tương thích"
    steps:
      - show: |
          <p>Sự kiện $i$: bắt đầu $s_i$, kết thúc $f_i$. &nbsp; Ví dụ $a_1$: $s_1 = 1$, $f_1 = 4$.</p>
          <p>Hai sự kiện <b>tương thích</b> khi cái trước kết thúc không muộn hơn lúc cái sau bắt đầu: $\ f_i \le s_j$.</p>
          <p class="note">$a_1$ (kết thúc 4) và $a_4$ (bắt đầu 5): tương thích. Một sự kiện kết thúc lúc 4 và một sự kiện bắt đầu đúng lúc 4 cũng tương thích.</p>
        focus: [1, 2, 3]
        say: "Sự kiện i bắt đầu lúc s i và kết thúc lúc f i, ví dụ sự kiện a một bắt đầu lúc 1, kết thúc lúc 4. Hai sự kiện tương thích khi cái trước kết thúc không muộn hơn lúc cái sau bắt đầu. Ví dụ a một kết thúc lúc 4 và a bốn bắt đầu lúc 5 là tương thích, và kết thúc lúc 4 với bắt đầu đúng lúc 4 cũng vẫn tương thích."

  # ───────────────────────── 3. QUY TẮC ─────────────────────────
  - id: rule
    kind: concept
    title: "Quy tắc: luôn chọn sự kiện kết thúc sớm nhất còn dùng được"
    steps:
      - show: |
          <div class="code"><div>sắp xếp theo f tăng dần;  last = -1   <span class="cm">// nhỏ hơn mọi giờ</span></div><div><span class="kw">for</span> mỗi sự kiện k theo thứ tự đó:</div><div>    <span class="kw">if</span> s[k] &gt;= last:  chọn k;  last = f[k]</div></div>
          <p class="note">Ý: kết thúc càng sớm, hội trường càng sớm trống cho phần còn lại. Chi phí: sắp xếp $\Theta(n\log n)$ + một vòng $\Theta(n)$.</p>
        focus: ["1.1", "1.3", 2]
        say: "Quy tắc là sắp các sự kiện theo giờ kết thúc tăng dần, rồi duyệt lần lượt. Sự kiện nào bắt đầu không sớm hơn giờ kết thúc của sự kiện vừa chọn thì chọn, và cập nhật giờ kết thúc đó. Ý tưởng là kết thúc càng sớm thì hội trường càng sớm trống cho phần còn lại, và chi phí là Theta của n lôgarit n do việc sắp xếp."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chạy tay với 11 sự kiện"
    checks:
      - "(lambda A: (lambda tr: tr)(__import__('functools').reduce(lambda st, i: (st[0] + [(i + 1, st[1], A[i][0] >= st[1])], A[i][1] if A[i][0] >= st[1] else st[1]), sorted(range(11), key=lambda i: A[i][1]), ([], -1))[0]))(list(zip((1, 3, 0, 5, 3, 5, 6, 8, 8, 2, 12), (4, 5, 6, 7, 9, 9, 10, 11, 12, 14, 16)))) == [(1, -1, True), (2, 4, False), (3, 4, False), (4, 4, True), (5, 7, False), (6, 7, False), (7, 7, False), (8, 7, True), (9, 11, False), (10, 11, False), (11, 11, True)]"
      - "(lambda A: (lambda g: g == [1, 4, 8, 11])((lambda st: st['sel'])(__import__('functools').reduce(lambda st, t: {'sel': st['sel'] + [t[0]], 'last': t[1][1]} if t[1][0] >= st['last'] else st, sorted(enumerate(A, 1), key=lambda t: t[1][1]), {'sel': [], 'last': -1}))))(list(zip((1, 3, 0, 5, 3, 5, 6, 8, 8, 2, 12), (4, 5, 6, 7, 9, 9, 10, 11, 12, 14, 16))))"
      - "(lambda A: max(L for L in range(1, 12) for S in __import__('itertools').combinations(A, L) if all(a[1] <= b[0] or b[1] <= a[0] for a, b in __import__('itertools').combinations(S, 2))) == 4)(list(zip((1, 3, 0, 5, 3, 5, 6, 8, 8, 2, 12), (4, 5, 6, 7, 9, 9, 10, 11, 12, 14, 16))))"
    steps:
      - show: |
          {{TLSEL}}
          <p>Chọn $a_1$ (kết thúc 4) → $a_4$ (bắt đầu 5, kết thúc 7) → $a_8$ (bắt đầu 8, kết thúc 11) → $a_{\,11}$ (bắt đầu 12). &nbsp; <b>4 sự kiện</b>.</p>
          <p class="note">Máy thử mọi tập con của 11 sự kiện: không tập tương thích nào có 5 sự kiện → 4 là tối ưu.</p>
        focus: [1, 2, 2, 2, 3]
        say: "Chạy tay theo giờ kết thúc. Chọn a một, kết thúc lúc 4. Các sự kiện bắt đầu trước 4 bị bỏ, sự kiện kế tiếp dùng được là a bốn, bắt đầu 5 kết thúc 7. Rồi đến a tám, bắt đầu 8 kết thúc 11, và cuối cùng a mười một, bắt đầu lúc 12. Tổng cộng 4 sự kiện, và máy đã thử mọi tập con, không có tập tương thích nào gồm 5 sự kiện."
      - clear: true
        show: |
          <p><b>Bước 1</b> — từng dòng của vòng lặp (đã sắp theo $f$), sáu sự kiện đầu:</p>
          <table class="t"><tr><th>sự kiện $(s, f)$</th><th>last trước</th><th>$s \ge$ last?</th><th>làm gì</th></tr>
          <tr><td>$a_1$ (1, 4)</td><td>$-1$</td><td>có</td><td>chọn, last = 4</td></tr>
          <tr><td>$a_2$ (3, 5)</td><td>4</td><td>$3 < 4$</td><td>bỏ</td></tr>
          <tr><td>$a_3$ (0, 6)</td><td>4</td><td>$0 < 4$</td><td>bỏ</td></tr>
          <tr><td>$a_4$ (5, 7)</td><td>4</td><td>có</td><td>chọn, last = 7</td></tr>
          <tr><td>$a_5$ (3, 9)</td><td>7</td><td>$3 < 7$</td><td>bỏ</td></tr>
          <tr><td>$a_6$ (5, 9)</td><td>7</td><td>$5 < 7$</td><td>bỏ</td></tr></table>
        focus: [1, "2.2", ["2.3", "2.4"], "2.5", ["2.6", "2.7"]]
        say: "Bước một, ghi lại từng vòng lặp, mỗi dòng một sự kiện theo thứ tự giờ kết thúc. Mốc kết thúc vừa chọn, ghi trên bảng là cột thứ hai, lúc đầu bằng trừ 1, nhỏ hơn mọi giờ, nên chọn a một và đặt mốc bằng 4. Sự kiện a hai bắt đầu lúc 3 và a ba bắt đầu lúc 0, đều sớm hơn 4, nên bỏ. Sự kiện a bốn bắt đầu lúc 5, không sớm hơn 4, nên chọn và mốc thành 7. Hai sự kiện tiếp theo bắt đầu lúc 3 và lúc 5, sớm hơn 7, nên bỏ."
      - clear: true
        show: |
          <p><b>Bước 2</b> — năm sự kiện còn lại:</p>
          <table class="t"><tr><th>sự kiện $(s, f)$</th><th>last trước</th><th>$s \ge$ last?</th><th>làm gì</th></tr>
          <tr><td>$a_7$ (6, 10)</td><td>7</td><td>$6 < 7$</td><td>bỏ</td></tr>
          <tr><td>$a_8$ (8, 11)</td><td>7</td><td>có</td><td>chọn, last = 11</td></tr>
          <tr><td>$a_9$ (8, 12)</td><td>11</td><td>$8 < 11$</td><td>bỏ</td></tr>
          <tr><td>$a_{\,10}$ (2, 14)</td><td>11</td><td>$2 < 11$</td><td>bỏ</td></tr>
          <tr><td>$a_{\,11}$ (12, 16)</td><td>11</td><td>có</td><td>chọn, last = 16</td></tr></table>
        focus: [1, "2.2", "2.3", ["2.4", "2.5"], "2.6"]
        say: "Bước hai, xét năm sự kiện còn lại. Sự kiện a bảy bắt đầu lúc 6, sớm hơn 7, nên bỏ. Sự kiện a tám bắt đầu lúc 8, chọn, mốc thành 11. Hai sự kiện bắt đầu lúc 8 và lúc 2 đều sớm hơn 11, nên bỏ. Cuối cùng a mười một bắt đầu lúc 12, chọn, và ta có đúng 4 sự kiện như trên hình."

  # ───────────────────────── 5. CHỨNG MINH ─────────────────────────
  - id: proof
    kind: formula
    title: "Vì sao đúng: lập luận đổi chỗ"
    steps:
      - show: |
          <p>Lấy một lời giải tối ưu bất kỳ $S$, sắp theo thời gian. Gọi $x$ là sự kiện đầu tiên của $S$, và $a_1$ là sự kiện <b>kết thúc sớm nhất</b> trong tất cả.</p>
          <p>Vì $f_1 \le f_x$, thay $x$ bằng $a_1$: $a_1$ kết thúc không muộn hơn $x$, nên vẫn tương thích với mọi sự kiện sau trong $S$. Số sự kiện không đổi.</p>
          <div class="box key">⟹ Luôn có một lời giải tối ưu chứa $a_1$. Bỏ $a_1$ và các sự kiện chồng với nó, lặp lại lập luận cho phần còn lại ⟹ tham lam tối ưu.</div>
        focus: [0, 1, 2, 3]
        say: "Vì sao đúng? Lấy một lời giải tối ưu bất kỳ, gọi x là sự kiện đầu tiên của nó, và a một là sự kiện kết thúc sớm nhất trong tất cả. Vì a một kết thúc không muộn hơn x, thay x bằng a một thì vẫn tương thích với mọi sự kiện phía sau, số sự kiện không đổi. Suy ra luôn có một lời giải tối ưu chứa a một, và lặp lại lập luận cho phần còn lại, ta được cách tham lam là tối ưu."

  # ───────────────────────── 6. PHẢN VÍ DỤ ─────────────────────────
  - id: counter
    kind: concept
    title: "Hai tiêu chí nghe hợp lý nhưng sai"
    checks:
      - "(lambda pick: pick([(0, 10), (1, 2), (3, 4)], lambda a: a[0]) == 1 and pick([(0, 5), (4, 7), (6, 11)], lambda a: a[1] - a[0]) == 1)(lambda A, key: len(__import__('functools').reduce(lambda ch, a: ch + [a] if all(a[1] <= c[0] or c[1] <= a[0] for c in ch) else ch, sorted(A, key=key), [])))"
    steps:
      - show: |
          <table class="t"><tr><th>tiêu chí</th><th>phản ví dụ</th><th>tham lam chọn</th><th>tối ưu</th></tr>
          <tr><td>bắt đầu sớm nhất</td><td>(0, 10), (1, 2), (3, 4)</td><td>(0, 10): <b>1</b></td><td>(1, 2), (3, 4): <b>2</b></td></tr>
          <tr><td>ngắn nhất</td><td>(0, 5), (4, 7), (6, 11)</td><td>(4, 7): <b>1</b></td><td>(0, 5), (6, 11): <b>2</b></td></tr></table>
          <p class="note">Còn một tiêu chí khác cũng đúng: chọn sự kiện <b>bắt đầu muộn nhất</b> rồi đi ngược thời gian (đối xứng). Vì vậy không nói “chỉ duy nhất” kết thúc sớm nhất là đúng.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Hai tiêu chí còn lại đều sai, và một phản ví dụ là đủ. Chọn sự kiện bắt đầu sớm nhất, với ba sự kiện này nó chọn sự kiện dài từ 0 đến 10 và chặn hết, chỉ được 1, trong khi chọn hai sự kiện ngắn được 2. Chọn sự kiện ngắn nhất, nó chọn sự kiện từ 4 đến 7 chồng lên cả hai sự kiện kia, chỉ được 1 thay vì 2. Lưu ý, chọn sự kiện bắt đầu muộn nhất rồi đi ngược thời gian cũng đúng, do đối xứng, nên không nói kết thúc sớm nhất là tiêu chí duy nhất."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: mọi cặp đã chọn đều tương thích, và vét cạn"
    checks:
      - "all(a[1] <= b[0] for a, b in zip([(1, 4), (5, 7), (8, 11), (12, 16)], [(5, 7), (8, 11), (12, 16)]))"
      - "(lambda A: [sum(1 for S in __import__('itertools').combinations(A, L) if all(a[1] <= b[0] or b[1] <= a[0] for a, b in __import__('itertools').combinations(S, 2))) for L in range(1, 6)] == [11, 24, 19, 4, 0])(list(zip((1, 3, 0, 5, 3, 5, 6, 8, 8, 2, 12), (4, 5, 6, 7, 9, 9, 10, 11, 12, 14, 16))))"
    steps:
      - show: |
          <p><b>Phép thử 1</b>: xếp các sự kiện đã chọn theo giờ, mỗi cái phải kết thúc trước khi cái sau bắt đầu:</p>
          $$4 \le 5, \qquad 7 \le 8, \qquad 11 \le 12 \ ✓$$
        focus: [1, 2]
        say: "Phép thử đầu tiên, xếp các sự kiện đã chọn theo giờ, vì mỗi cái phải kết thúc trước khi cái sau bắt đầu. Ta kiểm 4 không vượt 5, 7 không vượt 8, 11 không vượt 12, nên bốn sự kiện đều dùng được hội trường."
      - show: |
          <p><b>Phép thử 2</b> — đường khác: máy vét cạn mọi tập con của 11 sự kiện, đếm tập không chồng giờ theo kích thước:</p>
          <table class="t"><tr><th>số sự kiện trong tập</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>số tập không chồng giờ</td><td>11</td><td>24</td><td>19</td><td>$\hlg{4}$</td><td>0</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Phép thử thứ hai đi đường khác hẳn, không dùng quy tắc tham lam mà để máy vét cạn mọi tập con của 11 sự kiện. Máy đếm được 24 cặp không chồng giờ, 19 bộ ba, và 4 bộ bốn. Không có tập năm sự kiện nào, nên 4 đúng là số lớn nhất."

  # ───────────────────────── 8. LỖI THƯỜNG GẶP ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc"
    checks:
      - "(lambda pick: pick([(1, 4), (4, 6)], lambda a, last: a[0] > last) == 1 and pick([(1, 4), (4, 6)], lambda a, last: a[0] >= last) == 2)(lambda A, ok: len(__import__('functools').reduce(lambda st, a: (st[0] + [a], a[1]) if ok(a, st[1]) else st, sorted(A, key=lambda a: a[1]), ([], -1))[0]))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chọn theo giờ <b>bắt đầu sớm nhất</b> <b class="red">(sai)</b>
          <br><span class="note">Một sự kiện dài bắt đầu sớm chặn hết các sự kiện ngắn: (0, 10) chặn (1, 2) và (3, 4).</span></div>
        say: "Lỗi thứ nhất, chọn theo giờ bắt đầu sớm nhất. Một sự kiện dài bắt đầu sớm sẽ chặn hết các sự kiện ngắn, như sự kiện từ 0 đến 10 chặn hai sự kiện còn lại."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn sự kiện <b>ngắn nhất</b> <b class="red">(sai)</b>
          <br><span class="note">(4, 7) ngắn nhưng nằm vắt ngang (0, 5) và (6, 11).</span></div>
        say: "Lỗi thứ hai, chọn sự kiện ngắn nhất. Sự kiện từ 4 đến 7 ngắn, nhưng lại nằm vắt ngang hai sự kiện từ 0 đến 5 và từ 6 đến 11."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng điều kiện $s_k > \text{last}$ thay vì $s_k \ge \text{last}$ <b class="red">(sai)</b>
          $$(1, 4),\ (4, 6): \quad 4 \ge 4 \ \text{đúng (chọn được 2)}, \qquad 4 > 4 \ \text{sai (chỉ được 1)}$$</div>
        say: "Lỗi thứ ba, viết điều kiện bắt đầu lớn hơn hẳn giờ kết thúc vừa chọn, thay vì lớn hơn hoặc bằng. Với hai sự kiện từ 1 đến 4 và từ 4 đến 6, sự kiện thứ hai bắt đầu đúng lúc 4 vẫn dùng được. Nhưng dấu lớn hơn hẳn lại loại nó, nên chỉ được 1 thay vì 2."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quên sắp xếp theo giờ kết thúc trước khi duyệt <b class="red">(sai)</b>
          <br><span class="note">Duyệt theo thứ tự nhập vào thì “chọn cái đầu tiên dùng được” không còn là “kết thúc sớm nhất”.</span></div>
        say: "Lỗi thứ tư, quên sắp xếp theo giờ kết thúc trước khi duyệt. Duyệt theo thứ tự nhập vào thì việc chọn cái đầu tiên dùng được không còn là chọn cái kết thúc sớm nhất."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda A: [A.index(a) + 1 for a in __import__('functools').reduce(lambda st, a: (st[0] + [a], a[1]) if a[0] >= st[1] else st, sorted(A, key=lambda a: a[1]), ([], -1))[0]] == [1, 3, 6])([(1, 3), (2, 5), (4, 7), (1, 8), (5, 9), (8, 10), (9, 11)])"
    steps:
      - show: |
          <table class="t"><tr><th>sự kiện</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th></tr>
          <tr><td>$(s, f)$</td><td>(1, 3)</td><td>(2, 5)</td><td>(4, 7)</td><td>(1, 8)</td><td>(5, 9)</td><td>(8, 10)</td><td>(9, 11)</td></tr></table>
          <p>Chọn nhiều sự kiện nhất bằng tham lam.</p>
        focus: [1, 2, 0]
        say: "Đến lượt bạn, có bảy sự kiện với giờ bắt đầu và kết thúc như trên bảng, chúng đã được xếp theo giờ kết thúc. Hãy chọn nhiều sự kiện nhất bằng quy tắc tham lam. Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <table class="t"><tr><th>sự kiện</th><th>last trước</th><th>$s \ge$ last?</th><th>làm gì</th></tr>
          <tr><td>(1, 3)</td><td>$-1$</td><td>có</td><td>chọn, last = 3</td></tr>
          <tr><td>(2, 5)</td><td>3</td><td>$2 < 3$</td><td>bỏ</td></tr>
          <tr><td>(4, 7)</td><td>3</td><td>có</td><td>chọn, last = 7</td></tr>
          <tr><td>(1, 8), (5, 9)</td><td>7</td><td>$1 < 7$, $5 < 7$</td><td>bỏ cả hai</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án, bảy sự kiện đã xếp sẵn theo giờ kết thúc, nên chỉ cần duyệt từng dòng. Chọn sự kiện 1 đến 3, mốc kết thúc bằng 3. Sự kiện bắt đầu lúc 2 sớm hơn 3, bỏ. Sự kiện 4 đến 7 dùng được, chọn, mốc thành 7. Hai sự kiện bắt đầu lúc 1 và lúc 5 đều sớm hơn 7, bỏ cả hai."
      - show: |
          <table class="t"><tr><th>sự kiện</th><th>last trước</th><th>$s \ge$ last?</th><th>làm gì</th></tr>
          <tr><td>(8, 10)</td><td>7</td><td>có</td><td>chọn, last = 10</td></tr>
          <tr><td>(9, 11)</td><td>10</td><td>$9 < 10$</td><td>bỏ</td></tr></table>
          <div class="box ok">$\hlg{3}$ sự kiện: $(1, 3), (4, 7), (8, 10)$ &nbsp; — kiểm: $3 \le 4$, $7 \le 8$ ✓</div>
        focus: ["1.2", "1.3", 2]
        say: "Tiếp theo, sự kiện 8 đến 10 bắt đầu không sớm hơn 7, chọn, mốc thành 10. Sự kiện cuối bắt đầu lúc 9, sớm hơn 10, bỏ. Kết quả là 3 sự kiện, và kiểm lại, 3 không vượt 4, 7 không vượt 8, nên chúng không chồng giờ."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">sắp theo giờ kết thúc</span><span class="a">→</span>
          <span class="n">chọn nếu bắt đầu $\ge$ last</span><span class="a">→</span>
          <span class="n">đổi chỗ: luôn có lời giải tối ưu chứa sự kiện kết thúc sớm nhất</span><span class="a">→</span>
          <span class="n">tiêu chí khác: thử phản ví dụ</span></div>
        say: "Tổng kết chuỗi logic. Sắp theo giờ kết thúc, chọn sự kiện nếu nó bắt đầu không sớm hơn giờ kết thúc vừa chọn. Lập luận đổi chỗ cho thấy luôn có lời giải tối ưu chứa sự kiện kết thúc sớm nhất. Với tiêu chí khác, hãy thử tìm phản ví dụ."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi tin một quy tắc tham lam, hãy thử <b>phá</b> nó bằng ba bốn trường hợp nhỏ.</div>
        say: "Điều cần mang theo, trước khi tin một quy tắc tham lam, hãy thử phá nó bằng ba, bốn trường hợp nhỏ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 18): <b>bản chất quy hoạch động</b> — khi tham lam sai, ta ghi nhớ lời giải của các bài toán con gối nhau để khỏi tính lại.</p>
        forward_ref: true
        say: "Ở bài sau, bài 18, ta học bản chất quy hoạch động. Khi tham lam sai, ta ghi nhớ lời giải của các bài toán con gối nhau để khỏi phải tính lại. Hẹn gặp bạn ở bài tiếp theo."
