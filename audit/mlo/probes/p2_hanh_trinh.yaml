name: mlo_p2_hanh_trinh
# Vòng 2 (2026-11-02, bài L14 hành trình nợ kỹ thuật → nền tảng ML): tên nền tảng cần gọi tên nguồn trong lời đọc. Đọc BẢN CHÉP.
ctx:
  - "Theo {}, ta xét hệ thống này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "tfx"
    variants: ["TFX", "tê ép ích", "ti ép ích"]
    negative: "tê ép xê"
    keys: ["tfx", "teepich", "tiepich", "tepich", "tfich"]
  - key: "tensorflow"
    variants: ["TensorFlow", "Ten-xơ-phlâu", "Ten-sơ-lâu"]
    negative: "Ten-xơ-phlây"
    keys: ["tensorflow", "tensoflow", "tenxophlau", "tensorflo", "tensorphlow"]
  - key: "sibyl"
    variants: ["Sibyl", "Xi-biu", "Xi-bin"]
    negative: "Xi-ba"
    keys: ["sibyl", "sybil", "xibiu", "sibiu", "sibil", "xibin", "sibin"]
