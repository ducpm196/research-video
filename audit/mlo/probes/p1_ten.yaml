name: mlo_p1_ten
# Vòng 1 cho MLO: tên khoá và thuật ngữ. Đọc BẢN CHÉP (khoá ngắn dễ khớp giả). Mọi key trong ngoặc kép.
ctx:
  - "Theo {}, ta xét mô hình này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "mlops"
    variants: ["MLOps", "em-en-óp", "em eo óp"]
    negative: "em-en-ót"
    keys: ["mlops", "mlop", "em en óp", "em eo óp", "emelop", "em el ốp", "ml ops"]
  - key: "gpu"
    variants: ["GPU", "gờ pê u", "di pi iu"]
    negative: "gờ bê u"
    keys: ["gpu", "gờ pê u", "gpu"]
  - key: "brier"
    variants: ["Brier", "Brai-ơ", "Bri-ơ"]
    negative: "Brai-ân"
    keys: ["brier", "brai ơ", "bri ơ", "braiơ", "briơ", "bryer", "briar"]
