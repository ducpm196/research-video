name: cvi_p1_thuat_ngu
# Vòng 1 cho CVI (2026-11-03): tên riêng / từ ngoại của thị giác máy tính. Đọc BẢN CHÉP (khoá chuỗi con dễ khớp giả).
# Mỗi cách viết × 4 ngữ cảnh × (small + medium) = 8 lần nghe; ngưỡng 7/8; đối chứng âm phải KHÔNG đạt.
# Chạy: .venv/Scripts/python audit/cs112/probe_terms.py audit/cvi/probes/p1_thuat_ngu.yaml
ctx:
  - "Theo {}, ta xét bài toán này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "sobel"
    variants: ["Sobel", "Xô-ben", "Sô-ben"]
    negative: "Xô-pen"
    keys: ["sobel", "soben", "xoben", "sobell"]
  - key: "otsu"
    variants: ["Otsu", "Ốt-xu", "Ô-tsu"]
    negative: "Ốt-ku"
    keys: ["otsu", "otxu", "otsu", "otzu", "ochu"]
  - key: "ransac"
    variants: ["RANSAC", "Ran-xác", "Ren-xắc"]
    negative: "Ran-xát"
    keys: ["ransac", "ranxac", "renxac", "ransack", "rensac"]
  - key: "sift"
    variants: ["SIFT", "Xíp", "Xíp-tờ"]
    negative: "Xít"
    keys: ["sift", "xip", "sip", "xipto"]
  - key: "iou"
    variants: ["IoU", "ai âu diu", "i ô u"]
    negative: "ai âu bi"
    keys: ["iou", "aiaudiu", "ioudiu", "aioudiu", "iou"]
  - key: "dice"
    variants: ["Dice", "Đai-xơ", "Đai"]
    negative: "Đai-mơ"
    keys: ["dice", "daixo", "daix", "dais"]
  - key: "gauss"
    variants: ["Gauss", "Gao-xơ", "Gaoxơ"]
    negative: "Gao-mơ"
    keys: ["gauss", "gaoxo", "gaus", "gaox", "gaux"]
  - key: "yolo"
    variants: ["YOLO", "Dô-lô", "Giô-lô"]
    negative: "Dô-ma"
    keys: ["yolo", "dolo", "giolo", "jolo"]
  - key: "imagenet"
    variants: ["ImageNet", "Im-mịt-nét", "I-mịt-nét"]
    negative: "Im-mịt-két"
    keys: ["imagenet", "immitnet", "imitnet", "imagnet", "imaginet"]
  - key: "harris"
    variants: ["Harris", "Ha-rít", "Ha-ri"]
    negative: "Ha-mít"
    keys: ["harris", "harit", "hari", "haris"]
  - key: "resnet"
    variants: ["ResNet", "Rét-nét", "Rê-nét"]
    negative: "Rét-két"
    keys: ["resnet", "retnet", "renet", "rednet"]
  - key: "pascal"
    variants: ["PASCAL", "Pát-xcan", "Pa-xcan"]
    negative: "Pát-xcam"
    keys: ["pascal", "patxcan", "paxcan", "pascan"]
