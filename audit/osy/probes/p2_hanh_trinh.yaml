name: osy_p2_hanh_trinh
# Vòng 2 (2026-11-02, bài L15 hành trình bộ lập lịch Linux): tên hệ / tên bộ lập lịch có thể cần gọi trong lời đọc.
# Chạy: .venv/Scripts/python audit/cs112/probe_terms.py audit/osy/probes/p2_hanh_trinh.yaml (mỗi cách viết × 4 ngữ cảnh × small + medium).
ctx:
  - "Theo {}, ta xét bộ lập lịch này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "linux"
    variants: ["Linux", "Li-nắc", "Li-nớc"]
    negative: "Li-nốp"
    keys: ["linux", "linac", "linuc", "linox", "linut", "linus"]
  - key: "cfs"
    variants: ["CFS", "xê ép ét", "xi ép ét"]
    negative: "xê ép đê"
    keys: ["cfs", "xeepet", "ciepet", "siepet", "cepet"]
  - key: "eevdf"
    variants: ["EEVDF", "i i vi đi ép", "e e vê đê ép"]
    negative: "e e vê đê em"
    keys: ["eevdf", "iividiep", "eevedeep", "eevdep"]
