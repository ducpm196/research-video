name: aif_p2_thuat_ngu
# Vòng 2 cho AIF: tên người chơi MAX, MIN và lidar. Đọc BẢN CHÉP. Mọi key trong ngoặc kép.
ctx:
  - "Theo {}, ta xét bài toán này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "max"
    variants: ["MAX", "mắc", "mác"]
    negative: "mát"
    keys: ["max", "mắc", "mác", "mak", "mark"]
  - key: "min"
    variants: ["MIN", "min", "minh"]
    negative: "mít"
    keys: ["min", "minh"]
  - key: "lidar"
    variants: ["lidar", "lai-đa", "li-đa"]
    negative: "lai-ma"
    keys: ["lidar", "laida", "lida", "lai đa", "li đa", "lidda"]
