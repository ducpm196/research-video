name: aif_p1_thuat_ngu
# Vòng 1 cho AIF: thuật ngữ AI cổ điển. Đọc BẢN CHÉP (khoá ngắn dễ khớp giả). Mọi key trong ngoặc kép.
ctx:
  - "Theo {}, ta xét bài toán này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "minimax"
    variants: ["minimax", "mi-ni-mắc", "mi-ni-mác"]
    negative: "mi-ni-mát"
    keys: ["minimax", "minimac", "mini mắc", "mini mác", "minimắc", "minimác"]
  - key: "alpha"
    variants: ["alpha", "an-pha", "anh-pha"]
    negative: "an-ta"
    keys: ["alpha", "anpha", "an pha", "anh pha"]
  - key: "montecarlo"
    variants: ["Monte Carlo", "Mông-tê Các-lô", "Mon-tê Các-lô"]
    negative: "Mông-tê Các-tô"
    keys: ["monte carlo", "montecarlo", "mông tê các lô", "mongtecaclo", "monte cáclô", "mông tê carlo"]
  - key: "horn"
    variants: ["Horn", "Hoóc", "Hoọc"]
    negative: "Hoóng"
    keys: ["horn", "hoóc", "hooc", "hoọc", "hóc"]
