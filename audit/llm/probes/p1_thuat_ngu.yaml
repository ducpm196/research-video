name: llm_p1_thuat_ngu
# Vòng 1 cho LLM: bigram, n-gram. Đọc BẢN CHÉP. Mọi key trong ngoặc kép.
ctx:
  - "Theo {}, ta xét bài toán này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "bigram"
    variants: ["bigram", "bai-gram", "bi-gram"]
    negative: "bi-gam"
    keys: ["bigram", "baigram", "bai gram", "bi gram", "bi-gram"]
  - key: "ngram"
    variants: ["n-gram", "en-gram", "en gram"]
    negative: "en-gam"
    keys: ["ngram", "n-gram", "engram", "en gram", "n gram"]
