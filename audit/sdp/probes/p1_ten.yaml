name: sdp_p1_ten
# Vòng 1 cho SDP: tên người và tên nguyên lý. Đọc BẢN CHÉP (khoá ngắn dễ khớp giả). Mọi key trong ngoặc kép (YAML: null).
ctx:
  - "Theo {}, ta xét thiết kế này."
  - "Phần {} được giải thích ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "liskov"
    variants: ["Liskov", "Lít-xcốp", "Lít-cốp"]
    negative: "Lít-xtốp"
    keys: ["liskov", "litxcop", "litcop", "liscop"]
  - key: "mccabe"
    variants: ["McCabe", "Mắc-kây-bơ", "Mắc-kếp"]
    negative: "Mắc-kây-lơ"
    keys: ["mccabe", "mackaybo", "mackep", "mccab"]
  - key: "solid"
    variants: ["SOLID", "xô-lít", "sô-lít"]
    negative: "xô-líp"
    keys: ["solid", "xolit", "solit", "xolid"]
