name: esy_p1_vt
# Vòng 1 cho ESY: viết tắt phần cứng và đơn vị. Đọc BẢN CHÉP (khoá ngắn dễ khớp giả). Mọi key trong ngoặc kép (YAML: null).
ctx:
  - "Bộ {} được nối vào chân số hai."
  - "Phần {} được cấu hình ở bước tiếp theo."
  - "Hãy nhớ {} khi đọc bài này."
  - "Đây là ví dụ về {} trong thực tế."
terms:
  - key: "adc"
    variants: ["ADC", "a đê xê", "ây đi xi"]
    negative: "a đê xê ép"
    keys: ["adc", "adexe", "aydixi", "adexe"]
  - key: "pwm"
    variants: ["PWM", "pê vê kép em", "pi đắp bờ liu em"]
    negative: "pê vê kép en"
    keys: ["pwm", "pevekepem", "pidapboliuem", "pvkem"]
  - key: "uart"
    variants: ["UART", "u a ẹt tê", "iu át"]
    negative: "u a ẹt pê"
    keys: ["uart", "uaette", "iuat", "uaet", "uarte"]
  - key: "i2c"
    variants: ["I²C", "I hai C", "i bình phương xê"]
    negative: "I ba C"
    keys: ["i2c", "ihaic", "ihaixe", "ibinhphuongxe", "ihai"]
  - key: "spi"
    variants: ["SPI", "ét pê i", "ét pi ai"]
    negative: "ét pê u"
    keys: ["spi", "etpei", "etpiai", "spei"]
  - key: "mhz"
    variants: ["MHz", "mê-ga-héc", "mê ga héc"]
    negative: "ki-lô-héc"
    keys: ["mhz", "megahec", "megahet", "megahertz"]
  - key: "ma"
    variants: ["mA", "mi-li-am-pe", "mi li am pe"]
    negative: "mi-li-mét"
    keys: ["ma", "miliampe", "milliampere", "miliam"]
  - key: "ua"
    variants: ["µA", "mi-crô-am-pe", "mi crô am pe"]
    negative: "mi-crô-mét"
    keys: ["microampe", "micrôampe", "microam", "microampere", "mua"]
  - key: "db"
    variants: ["dB", "đề-xi-ben", "đê xi ben"]
    negative: "đề-xi-mét"
    keys: ["db", "dexiben", "decibel", "dexibel"]
  - key: "baud"
    variants: ["baud", "bốt", "bót"]
    negative: "bút"
    keys: ["baud", "bot", "baut", "bod"]
  - key: "led"
    variants: ["LED", "lét", "đèn lét"]
    negative: "lẹt"
    keys: ["led", "let"]
