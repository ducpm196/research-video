- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">$I = d \cdot I_{\text{thức}} + (1 - d) \cdot I_{\text{ngủ}}$</span><span class="a">→</span>

      <span class="n">tuổi thọ = dung lượng / $I$</span><span class="a">→</span>

      <span class="n">tìm phần đang lớn nhất</span><span class="a">→</span>

      <span class="n">đo trên mạch thật</span></div>

      <p class="note"><b>So sánh hai quy mô:</b> Thức 1% ở 10 mA thì dòng thức chi phối; ngủ 99,99% thì dòng ngủ và linh kiện ngoài quyết định pin.</p>

      '
    say: Tổng kết lại, dòng trung bình bằng tỉ lệ thức nhân dòng thức, cộng tỉ lệ ngủ nhân dòng ngủ. Tuổi thọ bằng dung lượng chia dòng trung bình. Hãy tìm phần đang lớn nhất để tối ưu, và đo trên mạch thật. Thức nhiều thì giảm dòng thức, còn ngủ gần cả ngày thì chính dòng ngủ, linh kiện ngoài và chân hở quyết định tuổi thọ pin.
    focus:
    - 1
    - 1
    - 1
    - 2
  - show: '<div class="box key"><b>Tư duy:</b> tối ưu phần đang chiếm nhiều nhất. Tính tỉ trọng trước, rồi mới bỏ công sức.</div>

      '
    say: Điều cần mang theo, hãy tối ưu phần đang chiếm nhiều nhất. Tính tỉ trọng trước, rồi mới bỏ công sức. Luôn phân tích tỉ trọng trước khi hành động bảo đảm kỹ sư nhúng đổ công sức vào đúng điểm nghẽn quyết định ngân sách năng lượng. Thiết lập ngân sách dòng ngủ chính xác bảo đảm tuổi thọ pin nhiều năm đúng như cam kết thiết kế phần cứng. Trước mỗi phương án tối ưu phần cứng, luôn tách riêng phần đóng góp dòng thức và dòng ngủ trên cùng chu kỳ chuẩn để chọn đúng khâu chi phối tuổi thọ pin.
  - clear: true
    show: '<p class="note">Bài sau (bài 14): <b>cập nhật phần sụn an toàn</b> và khởi động tin cậy.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài mười bốn, ta học cách cập nhật phần sụn an toàn hai vùng nhớ và cơ chế khởi động tin cậy để tránh biến thiết bị thành cục gạch. Ta cũng sẽ dùng lại các bài học độ tin cậy và ngân sách năng lượng vừa học trong thiết kế hoàn chỉnh. Hẹn gặp bạn ở bài tiếp theo.
