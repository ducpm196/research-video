id: L09
course: ESY
series: "ESY · Hệ thống nhúng và thời gian thực"
title: "Bài 9 — Lập lịch đơn điệu theo tần số và phân tích thời gian đáp ứng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/esy.yaml L09; audit/esy/verify_esy.py L09; C. L. Liu, J. W. Layland, Scheduling Algorithms for Multiprogramming in a Hard-Real-Time Environment, JACM 20(1), 1973; M. Joseph, P. Pandya, Finding Response Times in a Real-Time System, The Computer Journal 29(5), 1986"
assumes: [arith, cdot, frac, approx, power, ltgt, sub, sum, ceil]
# Quy ước: tác vụ i có thời gian chạy xấu nhất C_i, chu kỳ T_i, hạn = chu kỳ, mọi tác vụ thả cùng lúc ở 0 (thời điểm tới hạn),
#   một bộ xử lý, ưu tiên chiếm, bỏ qua chi phí chuyển ngữ cảnh. Đơn điệu theo tần số (RM): chu kỳ ngắn hơn → ưu tiên cao hơn.
#   Cận Liu–Layland n(2^{1/n} − 1) là điều kiện ĐỦ. Phân tích thời gian đáp ứng (Joseph–Pandya) là điều kiện cần và đủ với mô hình này.
#   Mọi số do alg.rm_bound / alg.rta / alg.schedule_sim; hình Gantt sinh từ alg.schedule_sim.
objectives:
  - "Tính độ sử dụng bộ xử lý và so với cận Liu–Layland"
  - "Tính thời gian đáp ứng xấu nhất bằng phép lặp"
  - "Biết cận chỉ là điều kiện đủ"
