scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chạy đủ nhanh “trung bình” vẫn có thể trễ"
    steps:
      - show: |
          <p>Bộ điều khiển phanh phải tính lại sau mỗi 4 ms, màn hình cập nhật mỗi 6 ms, ghi nhật ký mỗi 12 ms. Bộ xử lý bận 83% thời gian.</p>
          <p>Trễ hạn một lần ở phanh là lỗi, dù “trung bình” vẫn đủ nhanh.</p>
          <div class="box key">Hôm nay: <b>lập lịch đơn điệu theo tần số</b> và cách <b>chứng minh</b> không tác vụ nào trễ hạn.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, bộ điều khiển phanh phải tính lại sau mỗi 4 mi li giây, màn hình cập nhật mỗi 6 mi li giây, và ghi nhật ký mỗi 12 mi li giây. Bộ xử lý bận 83 phần trăm thời gian. Chỉ cần trễ hạn một lần ở phanh là lỗi, dù tính trung bình vẫn đủ nhanh. Hôm nay ta học lập lịch đơn điệu theo tần số, và cách chứng minh không tác vụ nào trễ hạn."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: làm tròn lên, tỉ lệ thời gian bận, ưu tiên chiếm"
    checks:
      - "[math.ceil(x / 4) for x in (3, 7, 8, 9)] == [1, 2, 2, 3] and [t for t in (0, 4, 8) if t < 7] == [0, 4]"
      - "abs(1 / 4 + 2 / 6 + 3 / 12 - 10 / 12) < 1e-12 and 3 + 4 + 3 == 10 and round(10 / 12, 3) == 0.833"
    steps:
      - show: |
          <table class="t"><tr><th>phép tính</th><th>kết quả</th><th>vì sao</th></tr>
          <tr><td>$\lceil 3/4 \rceil$</td><td>1</td><td>0,75 làm tròn lên</td></tr>
          <tr><td>$\lceil 7/4 \rceil$</td><td>2</td><td>1,75 làm tròn lên</td></tr>
          <tr><td>$\lceil 8/4 \rceil$</td><td>2</td><td>chia hết thì giữ nguyên</td></tr>
          <tr><td>$\lceil 9/4 \rceil$</td><td>3</td><td>2,25 làm tròn lên</td></tr></table>
          <p>Nghĩa đời thường: việc lặp lại mỗi 4 ms, thả ở 0, 4, 8. Trong 7 ms đầu nó được thả ở 0 và 4, tức $\lceil 7/4 \rceil = 2$ lần.</p>
        focus: [1, 1, 1, 2]
        say: "Trước hết, ôn phép làm tròn lên, ký hiệu bằng cặp ngoặc chỉ có móc ở phía trên. 3 chia 4 bằng 0 phẩy 75, làm tròn lên được 1, còn 7 chia 4 bằng 1 phẩy 75, làm tròn lên được 2. Chia hết thì giữ nguyên, như 8 chia 4 bằng 2, còn 9 chia 4 bằng 2 phẩy 25 thì làm tròn lên thành 3. Nghĩa đời thường của phép này là đếm số lần thả, một việc lặp lại mỗi 4 mi li giây thì trong 7 mi li giây đầu được thả ở 0 và 4, đúng 2 lần."
      - show: |
          <p>Tỉ lệ $\frac{C}{T}$ = phần thời gian một tác vụ chiếm bộ xử lý: chạy 1 mỗi 4 → $\frac{1}{4}$ = 25%.</p>
          <p>Cộng phân số bằng mẫu chung 12: $\frac{1}{4} + \frac{2}{6} + \frac{3}{12} = \frac{3 + 4 + 3}{12} = \frac{10}{12} \approx 0{,}833$.</p>
        focus: [1, 2, 2]
        say: "Tiếp theo, tỉ lệ thời gian chạy chia chu kỳ cho biết phần thời gian một tác vụ chiếm bộ xử lý, chạy 1 mỗi 4 nghĩa là chiếm 25 phần trăm. Để cộng ba tỉ lệ một phần tư, hai phần sáu và ba phần mười hai, ta quy về mẫu chung 12. Được 3 cộng 4 cộng 3, bằng 10 phần 12, khoảng 0 phẩy 833."
      - clear: true
        show: |
          <table class="t"><tr><th>thời điểm</th><th>sự kiện</th><th>bộ xử lý chạy</th></tr>
          <tr><td>3</td><td>tác vụ thấp đang chạy</td><td>tác vụ thấp</td></tr>
          <tr><td>4</td><td>tác vụ cao được thả</td><td>tác vụ cao, tác vụ thấp dừng giữa chừng</td></tr>
          <tr><td>5</td><td>tác vụ cao xong</td><td>tác vụ thấp chạy tiếp chỗ dở</td></tr></table>
          <p class="note"><b>Tác vụ</b>: một việc phần mềm làm đi làm lại. <b>Ưu tiên</b>: con số cho biết khi nhiều tác vụ cùng chờ thì ai được chạy trước. <b>Ưu tiên chiếm</b>: tác vụ ưu tiên cao vừa sẵn sàng là lấy ngay bộ xử lý, cắt ngang tác vụ thấp.</p>
        focus: [2, 2, 2, "1.2", "1.3", "1.4"]
        say: "Cuối cùng, nhắc lại từ đầu ba khái niệm, tác vụ là một việc phần mềm làm đi làm lại. Còn ưu tiên là con số cho biết khi nhiều tác vụ cùng chờ thì ai được chạy trước. Ưu tiên chiếm nghĩa là tác vụ ưu tiên cao vừa sẵn sàng là lấy ngay bộ xử lý, cắt ngang tác vụ thấp. Ví dụ ở thời điểm 3, tác vụ thấp đang chạy. Tới thời điểm 4 tác vụ cao được thả, nên tác vụ thấp dừng giữa chừng. Tới thời điểm 5 tác vụ cao xong, và tác vụ thấp chạy tiếp từ chỗ dở."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: thời gian chạy, chu kỳ, độ sử dụng"
    checks:
      - "abs(sum(c / t for c, t in [(1, 4), (2, 6), (3, 12)]) - 5 / 6) < 1e-12"
      - "round(alg.rm_bound(3), 4) == 0.7798 and round(alg.rm_bound(2), 4) == 0.8284"
    steps:
      - show: |
          <p>Tác vụ $i$: chạy tối đa $C_i$, lặp lại mỗi chu kỳ $T_i$, phải xong trước lần thả kế tiếp (hạn = chu kỳ).</p>
          <p><b>Đơn điệu theo tần số</b>: chu kỳ càng ngắn, ưu tiên càng cao; tác vụ ưu tiên cao chiếm bộ xử lý ngay khi sẵn sàng.</p>
          <p>Độ sử dụng $U = \sum \dfrac{C_i}{T_i}$. Ví dụ mở đầu: $\frac{1}{4} + \frac{2}{6} + \frac{3}{12} \approx \hl{0{,}833}$.</p>
          <p><b>Cận Liu–Layland</b>: nếu $U \le n\,(2^{1/n} - 1)$ thì chắc chắn không trễ hạn (với các giả thiết trên, và tác vụ không phải chờ nhau). Với $n = 3$: $\approx 0{,}780$.</p>
        introduces: [sum]
        focus: [1, 2, 2, 3, 3, 4, 4, 4]
        say: "Tác vụ i chạy tối đa C i đơn vị thời gian, lặp lại sau mỗi chu kỳ T i, và phải xong trước lần thả kế tiếp. Lập lịch đơn điệu theo tần số nghĩa là chu kỳ càng ngắn thì ưu tiên càng cao. Tác vụ ưu tiên cao chiếm bộ xử lý ngay khi nó sẵn sàng. Độ sử dụng U là tổng các tỉ số C i chia T i. Với ví dụ mở đầu, U khoảng 0 phẩy 833. Một cận kinh điển từ năm 1973 nói rằng, nếu U không vượt n nhân 2 mũ một phần n trừ 1, thì chắc chắn không tác vụ nào trễ hạn. Cận này đúng với các giả thiết vừa nêu, khi các tác vụ không phải chờ nhau. Với 3 tác vụ, cận này khoảng 0 phẩy 780."

  # ───────────────────────── 3. RTA ─────────────────────────
  - id: rta
    kind: formula
    title: "Phân tích thời gian đáp ứng"
    checks:
      - "alg.rta([(1, 4), (2, 6), (3, 12)])[2] == (10, [3, 6, 7, 9, 10, 10])"
      - "alg.rta([(1, 4), (2, 6), (3, 12)])[1][0] == 3"
    steps:
      - show: |
          <p>$0{,}833 \gt 0{,}780$: cận không kết luận được. Ta tính thẳng <b>thời gian đáp ứng</b> xấu nhất $R_i$ (từ lúc tác vụ được thả tới lúc nó chạy xong) — lúc mọi tác vụ thả cùng lúc:</p>
          <p>$R_i = C_i + \sum_{j \text{ ưu tiên cao hơn}} \left\lceil \dfrac{R_i}{T_j} \right\rceil C_j$</p>
          <p class="note">Vì trong khoảng $R_i$, tác vụ $j$ được thả $\lceil R_i / T_j \rceil$ lần, mỗi lần chen vào $C_j$. Bắt đầu từ $R_i = C_i$, lặp tới khi không đổi.</p>
        focus: [1, 1, 1, 2, 3, 3]
        say: "U bằng 0 phẩy 833, lớn hơn 0 phẩy 780, nên cận không kết luận được gì. Thời gian đáp ứng của một tác vụ là khoảng từ lúc nó được thả tới lúc nó chạy xong. Ta tính thẳng thời gian đáp ứng xấu nhất R i, xảy ra khi mọi tác vụ được thả cùng lúc. R i bằng C i cộng tổng, theo các tác vụ j ưu tiên cao hơn, của R i chia T j làm tròn lên, nhân C j. Lý do là trong khoảng thời gian R i, tác vụ j được thả chừng ấy lần, mỗi lần chen vào C j đơn vị. Ta bắt đầu từ R i bằng C i, rồi lặp tới khi giá trị không đổi."
      - show: |
          <p>Tác vụ C (3, 12), hai tác vụ trên nó (1, 4) và (2, 6):</p>
          <p>$R = 3 \to 3 + \lceil 3/4 \rceil \cdot 1 + \lceil 3/6 \rceil \cdot 2 = 6 \to 7 \to 9 \to \hl{10} \to 10$.</p>
          <p>$10 \le 12$: kịp hạn. Tương tự B: $R = 3 \le 6$; A: $R = 1 \le 4$. Cả ba đều kịp, dù $U$ vượt cận.</p>
        focus: [1, 2, 2, 3, 3]
        say: "Làm thử với tác vụ C, chạy 3 đơn vị mỗi 12, có hai tác vụ ưu tiên cao hơn. Bắt đầu từ 3, thay vào được 3 cộng 1 cộng 2, bằng 6. Lặp tiếp được 7, 9, rồi 10, và 10 cho lại chính nó. 10 không vượt 12, nên C kịp hạn, tương tự B có R bằng 3 và A có R bằng 1. Cả ba đều kịp hạn, dù U đã vượt cận."

  - id: intuition
    kind: intuition
    title: "Cửa sổ chờ lớn dần tới khi không ai chen thêm"
    checks:
      - "alg.rta([(1, 4), (2, 6), (3, 12)])[2][1] == [3, 6, 7, 9, 10, 10] and [3 + math.ceil(r / 4) + 2 * math.ceil(r / 6) for r in (3, 6, 7, 9, 10)] == [6, 7, 9, 10, 10]"
    steps:
      - show: |
          <div><svg width="1500" height="385" viewBox="0 0 1500 385"><g fill="#1f2937"><rect x="330" y="40" width="80" height="30" fill="#2a78d6"/><rect x="650" y="40" width="80" height="30" fill="#2a78d6"/><rect x="970" y="40" width="80" height="30" fill="#2a78d6"/><rect x="330" y="90" width="160" height="30" fill="#eb6834"/><rect x="810" y="90" width="160" height="30" fill="#eb6834"/><rect x="330" y="140" width="240" height="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/><rect x="330" y="178" width="480" height="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/><rect x="330" y="216" width="560" height="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/><rect x="330" y="254" width="720" height="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/><rect x="330" y="292" width="800" height="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/><line x1="650" y1="30" x2="650" y2="330" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 6"/><line x1="970" y1="30" x2="970" y2="330" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 6"/><line x1="810" y1="30" x2="810" y2="330" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 6"/><line x1="330" y1="340" x2="1310" y2="340" stroke="#6b7280" stroke-width="2"/><line x1="330" y1="340" x2="330" y2="348" stroke="#6b7280" stroke-width="2"/><text x="330" y="372" text-anchor="middle" font-size="19" fill="#1f2937">0</text><line x1="410" y1="340" x2="410" y2="348" stroke="#6b7280" stroke-width="2"/><text x="410" y="372" text-anchor="middle" font-size="19" fill="#1f2937">1</text><line x1="490" y1="340" x2="490" y2="348" stroke="#6b7280" stroke-width="2"/><text x="490" y="372" text-anchor="middle" font-size="19" fill="#1f2937">2</text><line x1="570" y1="340" x2="570" y2="348" stroke="#6b7280" stroke-width="2"/><text x="570" y="372" text-anchor="middle" font-size="19" fill="#1f2937">3</text><line x1="650" y1="340" x2="650" y2="348" stroke="#6b7280" stroke-width="2"/><text x="650" y="372" text-anchor="middle" font-size="19" fill="#1f2937">4</text><line x1="730" y1="340" x2="730" y2="348" stroke="#6b7280" stroke-width="2"/><text x="730" y="372" text-anchor="middle" font-size="19" fill="#1f2937">5</text><line x1="810" y1="340" x2="810" y2="348" stroke="#6b7280" stroke-width="2"/><text x="810" y="372" text-anchor="middle" font-size="19" fill="#1f2937">6</text><line x1="890" y1="340" x2="890" y2="348" stroke="#6b7280" stroke-width="2"/><text x="890" y="372" text-anchor="middle" font-size="19" fill="#1f2937">7</text><line x1="970" y1="340" x2="970" y2="348" stroke="#6b7280" stroke-width="2"/><text x="970" y="372" text-anchor="middle" font-size="19" fill="#1f2937">8</text><line x1="1050" y1="340" x2="1050" y2="348" stroke="#6b7280" stroke-width="2"/><text x="1050" y="372" text-anchor="middle" font-size="19" fill="#1f2937">9</text><line x1="1130" y1="340" x2="1130" y2="348" stroke="#6b7280" stroke-width="2"/><text x="1130" y="372" text-anchor="middle" font-size="19" fill="#1f2937">10</text><line x1="1210" y1="340" x2="1210" y2="348" stroke="#6b7280" stroke-width="2"/><text x="1210" y="372" text-anchor="middle" font-size="19" fill="#1f2937">11</text><line x1="1290" y1="340" x2="1290" y2="348" stroke="#6b7280" stroke-width="2"/><text x="1290" y="372" text-anchor="middle" font-size="19" fill="#b91c1c">12</text><g font-size="22"><text x="20" y="62" fill="#2a78d6">A: chạy 1, mỗi 4</text><text x="20" y="112" fill="#eb6834">B: chạy 2, mỗi 6</text><text x="20" y="372" font-size="19">thời gian</text><text x="1320" y="372" font-size="19" fill="#b91c1c">hạn của C</text></g><text x="20" y="161" font-size="20" fill="#059669">thử R = 3 → ra 6</text><text x="20" y="199" font-size="20" fill="#059669">thử R = 6 → ra 7</text><text x="20" y="237" font-size="20" fill="#059669">thử R = 7 → ra 9</text><text x="20" y="275" font-size="20" fill="#059669">thử R = 9 → ra 10</text><text x="20" y="313" font-size="20" fill="#059669">thử R = 10 → ra 10, dừng</text></g></svg></div>
        say: "Hình cho thấy vì sao phép lặp dừng lại. Hai hàng trên là các lần thả của A và B, mỗi khối là phần chúng chen vào, các vạch đứt nét đánh dấu lần thả mới. Mỗi thanh xanh lá là một cửa sổ chờ của C, bên trái ghi độ dài đang thử và độ dài tính ra. Cứ khi thanh vươn qua một vạch đứt nét thì có thêm một lần chen, nên cửa sổ phải dài thêm. Tới cửa sổ dài 10, không vạch mới nào bị vượt qua, phép lặp dừng ở 10, vẫn trước hạn 12."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính R từng tác vụ, rồi đối chiếu biểu đồ"
    checks:
      - "alg.schedule_sim([(1, 4), (2, 6), (3, 12)], 12, 'RM') == ([0, 1, 1, 2, 0, 2, 1, 1, 0, 2, None, None], [])"
    steps:
      - show: |
          <table class="t"><tr><th>tác vụ</th><th>$(C, T)$</th><th>ưu tiên</th><th>$\frac{C}{T}$</th></tr>
          <tr><td>A</td><td>(1, 4)</td><td>cao nhất (chu kỳ ngắn nhất)</td><td>0,25</td></tr>
          <tr><td>B</td><td>(2, 6)</td><td>giữa</td><td>$\approx 0{,}333$</td></tr>
          <tr><td>C</td><td>(3, 12)</td><td>thấp nhất</td><td>0,25</td></tr></table>
          <p><b>Bước 1 — sắp ưu tiên, tính $U$:</b> $U \approx 0{,}833 \gt 0{,}780$ → cận không kết luận, phải tính từng $R$.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước một, sắp ưu tiên theo chu kỳ, chu kỳ ngắn thì ưu tiên cao. A có chu kỳ 4 nên ưu tiên cao nhất, tỉ lệ 0 phẩy 25. B có chu kỳ 6, đứng giữa, tỉ lệ khoảng 0 phẩy 333. C có chu kỳ 12 nên thấp nhất, tỉ lệ 0 phẩy 25. Cộng lại U khoảng 0 phẩy 833, vượt cận 0 phẩy 780, nên phải tính thời gian đáp ứng của từng tác vụ."
      - show: |
          <p><b>Bước 2 — tác vụ A:</b> không ai ưu tiên cao hơn, nên không ai chen: $R_A = C_A = \hl{1} \le 4$.</p>
        say: "Bước hai, tác vụ A không có ai ưu tiên cao hơn, nên không ai chen vào được. Thời gian đáp ứng của A đúng bằng thời gian chạy, 1 đơn vị, nhỏ hơn chu kỳ 4."
      - show: |
          <p><b>Bước 3 — tác vụ B</b>, chỉ A chen: $R = 2 \to 2 + \lceil 2/4 \rceil \cdot 1 = 3 \to 2 + \lceil 3/4 \rceil \cdot 1 = 3$, dừng. $R_B = \hl{3} \le 6$.</p>
        say: "Bước ba, tác vụ B chỉ bị A chen vào. Bắt đầu từ 2, cộng 2 chia 4 làm tròn lên là 1, được 3. Thay 3 vào thì 3 chia 4 làm tròn lên vẫn là 1, lại được 3, nên phép lặp dừng, và thời gian đáp ứng của B là 3, nhỏ hơn chu kỳ 6."
      - clear: true
        show: |
          <p><b>Bước 4 — tác vụ C</b>, A và B cùng chen:</p>
          <table class="t"><tr><th>$R$ đang thử</th><th>A chen $\lceil R/4 \rceil \cdot 1$</th><th>B chen $\lceil R/6 \rceil \cdot 2$</th><th>$R$ mới $= 3 + \dots$</th></tr>
          <tr><td>3</td><td>1</td><td>2</td><td>6</td></tr>
          <tr><td>6</td><td>2</td><td>2</td><td>7</td></tr>
          <tr><td>7</td><td>2</td><td>4</td><td>9</td></tr>
          <tr><td>9</td><td>3</td><td>4</td><td>10</td></tr>
          <tr><td>10</td><td>3</td><td>4</td><td>$\hl{10}$ — không đổi, dừng</td></tr></table>
        introduces: [dots]
        focus: [1, "2.2", "2.3", "2.4", "2.6"]
        say: "Bước bốn, tác vụ C bị cả A và B chen vào, ta lập bảng, mỗi dòng một lần lặp. Thử R bằng 3, A chen 1, B chen 2, nên R mới là 6. Thử 6, A chen 2 vì 6 chia 4 làm tròn lên là 2, B vẫn chen 2, được 7. Thử 7, B đã được thả lần thứ hai nên chen 4, được 9, rồi thử 9 thì A chen 3, được 10. Thử 10 vẫn ra 10, không đổi, nên phép lặp dừng, thời gian đáp ứng của C là 10, nhỏ hơn hạn 12."
      - clear: true
        show: |
          <div>{{GANTT}}</div>
          <p><b>Bước 5 — đối chiếu biểu đồ:</b> A chạy ở 0–1, 4–5, 8–9; B chạy 1–3 và 6–8; C bị cắt thành ba mẩu 3–4, 5–6, 9–10 và xong ở thời điểm $\hl{10}$ — đúng con số tính được.</p>
        focus: [1, 1, 2, 2]
        say: "Bước năm, đối chiếu với biểu đồ thời gian vẽ 12 đơn vị đầu, mỗi hàng một tác vụ, vạch đen là lúc thả việc mới. Biểu đồ này do máy mô phỏng từng đơn vị thời gian, không dùng phép lặp. Tác vụ A chạy ngay sau mỗi lần thả, ở 0, 4 và 8, còn B chạy từ 1 tới 3 và từ 6 tới 8. C bị cắt thành ba mẩu và xong ở thời điểm 10, đúng con số vừa tính được."

  - id: check
    kind: check
    title: "Tự kiểm: đếm tổng việc phải làm trước mỗi thời điểm"
    checks:
      - "[math.ceil(t / 4) * 1 + math.ceil(t / 6) * 2 + 3 for t in (4, 6, 8, 9, 10)] == [6, 7, 9, 10, 10]"
      - "min(t for t in range(1, 13) if math.ceil(t / 4) + 2 * math.ceil(t / 6) + 3 <= t) == 10"
    steps:
      - show: |
          <p>Đường khác: C xong trước thời điểm $t$ chỉ khi tổng việc của A, B, C thả trước $t$ không vượt $t$.</p>
          <table class="t"><tr><th>$t$</th><th>việc A</th><th>việc B</th><th>việc C</th><th>tổng</th><th>tổng $\le t$?</th></tr>
          <tr><td>6</td><td>2</td><td>2</td><td>3</td><td>7</td><td>không</td></tr>
          <tr><td>8</td><td>2</td><td>4</td><td>3</td><td>9</td><td>không</td></tr>
          <tr><td>9</td><td>3</td><td>4</td><td>3</td><td>10</td><td>không</td></tr>
          <tr><td>10</td><td>3</td><td>4</td><td>3</td><td>10</td><td>có ✓</td></tr></table>
        focus: [1, 2, "2.2", "2.4", "2.5"]
        say: "Kiểm bằng đường khác, vì phép lặp có thể tính sai một lần làm tròn mà không ai thấy. Ta hỏi trực tiếp, trước thời điểm t, tổng việc mà A, B và C đã được thả có vừa trong t đơn vị không. Ở t bằng 6, tổng việc là 7, lớn hơn 6, nên C chưa thể xong. Ở t bằng 9, A đã được thả 3 lần, B 2 lần, tổng là 10, vẫn lớn hơn 9. Tới t bằng 10, tổng việc đúng bằng 10, vừa khít, nên C xong sớm nhất ở thời điểm 10, khớp với phép lặp."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.rta([(2, 4), (3, 6)])[1][0] is None and alg.schedule_sim([(2, 4), (3, 6)], 12, 'RM')[1] == [(1, 6)]"
      - "alg.schedule_sim([(2, 4), (3, 6)], 12, 'RM')[0][:6] == [0, 0, 1, 1, 0, 0] and 2 / 4 + 3 / 6 == 1"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thấy $U$ vượt cận là kết luận trễ hạn <b class="red">(sai)</b>
          <br><span class="note">Cận là điều kiện <b>đủ</b>, không phải cần. Ví dụ vừa rồi vượt cận mà vẫn kịp — phải phân tích thời gian đáp ứng.</span></div>
        say: "Lỗi thứ nhất, thấy U vượt cận là kết luận sẽ trễ hạn. Cận chỉ là điều kiện đủ, không phải điều kiện cần, như ví dụ vừa rồi vượt cận mà vẫn kịp, nên phải phân tích thời gian đáp ứng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ $U \le 1$ là đủ với ưu tiên cố định <b class="red">(sai)</b>
          <br><span class="note">(2, 4) và (3, 6): $U = 1$, nhưng tác vụ thứ hai trễ hạn ở thời điểm 6. $U \le 1$ chỉ là điều kiện <b>cần</b>.</span></div>
          <table class="t"><tr><th>thời điểm</th><th>0–2</th><th>2–4</th><th>4–6</th><th>tới hạn 6</th></tr><tr><td>chạy</td><td>(2, 4)</td><td>(3, 6)</td><td>(2, 4) thả lại, chen</td><td>(3, 6) mới làm 2 trong 3: trễ</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ hai, nghĩ U không vượt 1 là đủ với ưu tiên cố định. Hai tác vụ chạy 2 mỗi 4 và chạy 3 mỗi 6 có U đúng bằng 1, nhưng tác vụ thứ hai trễ hạn ở thời điểm 6, nên U không vượt 1 chỉ là điều kiện cần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng thời gian chạy trung bình làm $C_i$ <b class="red">(sai)</b>
          <br><span class="note">Phân tích chỉ đúng với thời gian chạy <b>xấu nhất</b>, đo hoặc phân tích trên đường mã dài nhất.</span></div>
        say: "Lỗi thứ ba, dùng thời gian chạy trung bình làm C i. Phân tích chỉ đúng khi dùng thời gian chạy xấu nhất, đo hoặc phân tích trên đường đi dài nhất của mã."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Bỏ qua thời gian ngắt và chặn <b class="red">(thiếu)</b>
          <br><span class="note">Hàm xử lý ngắt và đoạn khoá tài nguyên cũng chiếm bộ xử lý; phải cộng vào như một tác vụ ưu tiên cao hoặc một khoảng bị chặn.</span></div>
        say: "Lỗi thứ tư, bỏ qua thời gian ngắt và thời gian bị chặn. Hàm xử lý ngắt và các đoạn khoá tài nguyên cũng chiếm bộ xử lý, nên phải cộng vào như một tác vụ ưu tiên cao, hoặc như một khoảng bị chặn."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(sum(c / t for c, t in [(2, 5), (2, 7), (2, 10)]), 3) == 0.886"
      - "alg.rta([(2, 5), (2, 7), (2, 10)])[2] == (10, [2, 6, 8, 10, 10])"
      - "(round(2 / 5, 3), round(2 / 7, 3), round(2 / 10, 3)) == (0.4, 0.286, 0.2) and [(math.ceil(r / 5) * 2, math.ceil(r / 7) * 2) for r in (2, 6, 8, 10)] == [(2, 2), (4, 2), (4, 4), (4, 4)]"
      - "alg.rta([(2, 5), (2, 7), (3, 10)])[2] == (None, [3, 7, 9, 11]) and [(math.ceil(r / 5) * 2, math.ceil(r / 7) * 2) for r in (3, 7, 9)] == [(2, 2), (4, 2), (4, 4)] and round(2 / 5 + 2 / 7 + 3 / 10, 3) == 0.986"
    steps:
      - show: |
          <p>Ba tác vụ $(C, T)$: (2, 5), (2, 7), (2, 10).</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $U$, so với cận 0,780.</td></tr>
          <tr><td>2</td><td>Tính $R$ của tác vụ thứ ba. Có kịp hạn không?</td></tr>
          <tr><td>3</td><td>Khách hàng muốn tác vụ thứ ba chạy 3 thay vì 2. Có nhận được không?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm, với ba tác vụ chạy 2 mỗi 5, chạy 2 mỗi 7, và chạy 2 mỗi 10. Câu một, tính U và so với cận 0 phẩy 780. Câu hai, tính thời gian đáp ứng R của tác vụ thứ ba. Tác vụ đó có kịp hạn không? Câu ba, khách hàng muốn tác vụ thứ ba chạy 3 đơn vị thay vì 2, ta có nhận yêu cầu đó được không? Dừng video và làm ra giấy."
        pause: 20
      - show: |
          <p>① $U = \frac{2}{5} + \frac{2}{7} + \frac{2}{10} = 0{,}4 + 0{,}286 + 0{,}2 \approx \hl{0{,}886} \gt 0{,}780$: cận không kết luận được.</p>
        say: "Đáp án câu một, tính từng tỉ lệ, 2 chia 5 là 0 phẩy 4, 2 chia 7 khoảng 0 phẩy 286, 2 chia 10 là 0 phẩy 2. Cộng lại U khoảng 0 phẩy 886, lớn hơn cận 0 phẩy 780, vậy cận không kết luận được gì, phải tính thời gian đáp ứng."
      - clear: true
        show: |
          <table class="t"><tr><th>$R$ đang thử</th><th>$\lceil R/5 \rceil \cdot 2$</th><th>$\lceil R/7 \rceil \cdot 2$</th><th>$R$ mới $= 2 + \dots$</th></tr>
          <tr><td>2</td><td>2</td><td>2</td><td>6</td></tr><tr><td>6</td><td>4</td><td>2</td><td>8</td></tr>
          <tr><td>8</td><td>4</td><td>4</td><td>10</td></tr><tr><td>10</td><td>4</td><td>4</td><td>$\hl{10}$, dừng</td></tr></table>
          <p>② $R = 10 \le 10$ — <b>vừa kịp</b>, không còn chút dư nào.</p>
        focus: ["1.2", "1.3", 2]
        say: "Câu hai, ta lặp như bảng, bắt đầu từ 2, mỗi tác vụ trên chen 2, được 6. Thử 6 thì tác vụ chu kỳ 5 đã được thả lần hai nên chen 4, được 8, rồi thử 8 thì tác vụ chu kỳ 7 cũng chen 4, được 10. Thử 10 vẫn ra 10, nên R bằng đúng hạn 10, tác vụ thứ ba vừa kịp, không còn chút dư nào."
      - clear: true
        show: |
          <table class="t"><tr><th>$R$ đang thử</th><th>chen của hai tác vụ trên</th><th>$R$ mới $= 3 + \dots$</th></tr>
          <tr><td>3</td><td>2 + 2</td><td>7</td></tr><tr><td>7</td><td>4 + 2</td><td>9</td></tr><tr><td>9</td><td>4 + 4</td><td>$\hl{11} \gt 10$</td></tr></table>
          <p>③ <b>Không nhận được</b> với lịch này: tác vụ thứ ba sẽ trễ hạn.</p>
        focus: [1, "1.2", "1.4", 2]
        say: "Câu ba là một quyết định, ta lặp lại với thời gian chạy 3. Bắt đầu từ 3, hai tác vụ trên chen 2 cộng 2, được 7. Thử 7, chen 4 cộng 2, được 9, rồi thử 9 thì chen 4 cộng 4, được 11, đã vượt hạn 10. Vì vậy không nhận được yêu cầu này với lịch hiện tại, tác vụ thứ ba sẽ trễ hạn, dù U mới chỉ khoảng 0 phẩy 986."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
