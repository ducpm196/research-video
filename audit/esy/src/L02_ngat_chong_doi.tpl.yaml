scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bấm một lần, đếm ba lần"
    steps:
      - show: |
          <p>Bộ đếm số lần bấm nút: bấm đúng một lần, màn hình nhảy từ 0 lên 3.</p>
          <p>Tiếp điểm kim loại trong nút <b>nảy</b> vài lần trong vài mili giây trước khi chạm hẳn — chương trình thấy nhiều lần bấm.</p>
          <div class="box key">Hôm nay: hai cách phát hiện sự kiện — <b>thăm dò</b> và <b>ngắt</b> — và cách <b>chống dội</b> phím.</div>
        focus: [1, 2, 3]
        say: "Chào bạn, một bộ đếm số lần bấm nút, bạn bấm đúng một lần mà màn hình nhảy từ 0 lên 3. Lý do là tiếp điểm kim loại trong nút nảy lên xuống vài lần trong vài mi li giây trước khi chạm hẳn, nên chương trình thấy nhiều lần bấm. Hôm nay ta học hai cách phát hiện sự kiện, thăm dò và ngắt, và cách chống dội phím."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: byte cao, byte thấp và làm tròn lên"
    checks:
      - "15 * 16 + 15 == 255 == 0xFF and 0x00FF == 255 and 0x0100 == 256 == 1 * 256 + 0 and 0x01FF == 1 * 256 + 255 == 511"
      - "(511 >> 8, 511 & 0xFF) == (1, 255) and (256 >> 8, 256 & 0xFF) == (1, 0)"
      - "7 / 2 == 3.5 and math.ceil(7 / 2) == 4 and 3 * 2 == 6 and 4 * 2 == 8 and 6 < 7 <= 8"
    steps:
      - show: |
          <p>Ở khoá Hệ thống máy tính: một byte là 8 bit, viết bằng 2 chữ số hệ mười sáu; <code>FF</code> $= 15 \cdot 16 + 15 = 255$. Số 16 bit = <b>byte cao</b> $\cdot\, 256$ + <b>byte thấp</b>.</p>
          <table class="t"><tr><th>số</th><th>hệ mười sáu</th><th>byte cao</th><th>byte thấp</th></tr>
          <tr><td>255</td><td><code>0x00FF</code></td><td>00</td><td>FF</td></tr>
          <tr><td>256</td><td><code>0x0100</code></td><td>01</td><td>00</td></tr>
          <tr><td>511</td><td><code>0x01FF</code></td><td>01</td><td>FF</td></tr></table>
        introduces: [cdot]
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Trước hết, ôn lại cách viết số đã học ở khoá Hệ thống máy tính. Một byte gồm 8 bit, viết gọn bằng hai chữ số hệ mười sáu, chẳng hạn F F bằng 15 nhân 16 cộng 15, tức là 255. Một số 16 bit gồm hai byte, giá trị bằng byte cao nhân 256 rồi cộng byte thấp. Số 255 có byte cao 00 và byte thấp F F. Số 256 có byte cao 01 và byte thấp 00. Số 511 có byte cao 01 và byte thấp F F, vì 256 cộng 255 bằng 511."
      - show: |
          <p><b>Làm tròn lên</b>: cần phủ 7 ms bằng các khoảng 2 ms. $\frac{7}{2} = 3{,}5$ → phải lấy <b>4</b> khoảng, vì 3 khoảng chỉ phủ 6 ms $\lt$ 7 ms, còn 4 khoảng phủ 8 ms.</p>
        say: "Tiếp theo là phép làm tròn lên, ví dụ cần phủ kín 7 mi li giây bằng các khoảng dài 2 mi li giây. Chia 7 cho 2 được 3 phẩy 5, nhưng không thể lấy nửa khoảng, nên phải lấy 4 khoảng. Lý do là 3 khoảng chỉ phủ được 6 mi li giây, còn thiếu, còn 4 khoảng thì phủ được 8 mi li giây, đủ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: thăm dò và ngắt"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>vòng thăm dò</th><th>ngắt</th></tr>
          <tr><td>cách làm</td><td>vòng lặp chính tự đọc chân liên tục</td><td>phần cứng báo, bộ xử lý tạm dừng việc đang làm và chạy <b>hàm xử lý ngắt</b></td></tr>
          <tr><td>độ trễ phát hiện</td><td>tới một vòng lặp (vòng 10 ms → trễ tới 10 ms)</td><td>vài phần triệu giây</td></tr>
          <tr><td>tốn bộ xử lý</td><td>đọc cả khi không có gì</td><td>chỉ chạy khi có sự kiện</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Có hai cách phát hiện sự kiện. Với vòng thăm dò, vòng lặp chính tự đọc chân liên tục, còn với ngắt, phần cứng báo hiệu, bộ xử lý tạm dừng việc đang làm và chạy một hàm xử lý ngắt. Về độ trễ, thăm dò có thể trễ tới cả một vòng lặp, vòng 10 mi li giây thì trễ tới 10 mi li giây, còn ngắt chỉ vài phần triệu giây. Về công sức, thăm dò phải đọc cả khi không có gì xảy ra, còn ngắt chỉ chạy khi có sự kiện."

  - id: intuition
    kind: intuition
    title: "Ngắt chen vào giữa hai lần đọc"
    checks:
      - "(0x0100 >> 8) * 256 + (0x00FF & 0xFF) == 511 and 511 not in (255, 256)"
    steps:
      - show: |
          <div><svg width="1500" height="350" viewBox="0 0 1500 350"><g fill="#1f2937"><g font-size="22"><text x="20" y="98">vòng chính</text><text x="20" y="198">hàm ngắt</text><text x="20" y="293">biến đếm</text></g><rect x="170" y="60" width="330" height="60" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><rect x="520" y="160" width="330" height="60" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><rect x="870" y="60" width="330" height="60" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><rect x="1230" y="60" width="250" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><rect x="170" y="260" width="345" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><rect x="525" y="260" width="675" height="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><g fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="8 6"><line x1="500" y1="120" x2="520" y2="160"/><line x1="850" y1="160" x2="870" y2="120"/></g><g font-size="22" text-anchor="middle"><text x="335" y="98">đọc byte thấp: FF</text><text x="685" y="198">tăng đếm: 255 thành 256</text><text x="1035" y="98">đọc byte cao: 01</text><text x="1355" y="99" font-size="26" font-weight="bold" fill="#b91c1c">01FF = 511</text><text x="342" y="293">0x00FF = 255</text><text x="862" y="293">0x0100 = 256</text></g><text x="20" y="342" font-size="22" fill="#b91c1c">ghép byte cao của số mới với byte thấp của số cũ: 511 chưa từng nằm trong bộ nhớ</text></g></svg></div>
        say: "Hình vẽ theo trục thời gian từ trái sang phải điều xảy ra khi chip 8 bit đọc một biến đếm 16 bit. Vòng chính đọc byte thấp trước, lúc đó bộ nhớ đang là 255 nên byte thấp là F F. Ngay sau đó ngắt chen vào, bộ xử lý nhảy xuống hàm ngắt và tăng biến đếm lên 256. Quay lại vòng chính, ta đọc byte cao của số mới là 01, ghép với F F cũ thành 511, một số chưa từng nằm trong bộ nhớ."

  # ───────────────────────── 3. QUY TẮC NGẮT ─────────────────────────
  - id: isr
    kind: concept
    title: "Ba quy tắc cho hàm xử lý ngắt"
    checks:
      - "((0x0100 >> 8) & 0xFF) << 8 | (0x00FF & 0xFF) == 0x01FF == 511"
    steps:
      - show: |
          <ol><li><b>Ngắn</b>: chỉ ghi nhận sự kiện (tăng biến đếm, đặt cờ), việc nặng để vòng lặp chính làm.</li>
          <li>Biến dùng chung với ngắt khai báo <code>volatile</code>: bắt trình biên dịch đọc lại từ bộ nhớ mỗi lần, không giữ bản cũ trong thanh ghi.</li>
          <li>Đọc biến nhiều byte thì <b>tạm tắt ngắt</b>.</li></ol>
          <div class="code"><div>volatile uint16_t dem;      <span class="cm">// tăng trong hàm xử lý ngắt</span></div><div>cli(); uint16_t x = dem; sei();   <span class="cm">// tắt ngắt, đọc, bật lại</span></div></div>
          <p class="note">Vì sao? Chip 8 bit đọc số 16 bit làm hai lần. Đếm đang 255 (<code>0x00FF</code>): đọc byte thấp FF, ngắt chen vào tăng lên 256 (<code>0x0100</code>), đọc byte cao 01 → được <code>0x01FF</code> = $\hl{511}$, không phải 255 hay 256.</p>
        focus: ["1.1", "1.1", "1.2", 2, 3, 3, 3, 3]
        say: "Hàm xử lý ngắt có ba quy tắc. Một, phải ngắn, chỉ ghi nhận sự kiện như tăng biến đếm hay đặt cờ, việc nặng để vòng lặp chính làm. Hai, biến dùng chung với ngắt phải khai báo đặc biệt, để trình biên dịch đọc lại từ bộ nhớ mỗi lần mà không giữ một bản cũ trong thanh ghi. Ba, đọc một biến nhiều byte thì tạm tắt ngắt, như đoạn mã này. Vì sao cần tắt ngắt? Chip 8 bit đọc số 16 bit làm hai lần. Giả sử biến đếm đang là 255, ta đọc byte thấp được F F. Đúng lúc đó ngắt chen vào tăng lên 256, rồi ta đọc byte cao được 01, ghép lại thành 511, không phải 255 cũng không phải 256."

  # ───────────────────────── 4. CHỐNG DỘI ─────────────────────────
  - id: example
    kind: example
    title: "Chống dội bằng lấy mẫu"
    checks:
      - "alg.debounce([0, 1, 0, 1, 1, 0, 1, 1, 1, 1, 1, 1, 1, 1], 5).index(1) == 10"
      - "math.ceil(5 / 1) == 5"
    steps:
      - show: |
          <p><b>Bước 1 — số mẫu:</b> phím dội tối đa 5 ms, lấy mẫu mỗi 1 ms; chỉ chấp nhận trạng thái mới sau <b>5 mẫu liên tiếp</b> giống nhau ($\lceil 5 / 1 \rceil = 5$).</p>
        introduces: [ceil]
        say: "Giả sử phím dội tối đa 5 mi li giây. Bước một, ta lấy mẫu mỗi 1 mi li giây, và chỉ chấp nhận trạng thái mới sau 5 mẫu liên tiếp giống nhau, dấu ngoặc nghĩa là làm tròn lên. Năm mẫu cách nhau 1 mi li giây phủ kín 5 mi li giây dội, nên khi đủ 5 mẫu giống nhau thì phím chắc chắn đã hết nảy."
      - show: |
          <div>{{DEBOUNCE}}</div>
          <p><b>Bước 2 — đọc hình:</b> chân phím nảy ở mẫu 1–5; từ mẫu 6 ổn định ở 1.</p>
        focus: [1, 1, 2]
        say: "Bước hai, đọc hình, đường cam là chân phím, đường xanh là trạng thái sau chống dội. Hai đường cùng chạy theo các mẫu đánh số từ 0 đến 13 ở dưới. Chân phím nảy lên xuống ở các mẫu 1 đến 5, từ mẫu 6 thì ổn định ở mức 1."
      - clear: true
        show: |
          <table class="t"><tr><th>mẫu</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr>
          <tr><th>chân phím</th><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr>
          <tr><th>đếm liên tiếp</th><td>1</td><td>1</td><td>1</td><td>1</td><td>2</td><td>1</td><td>1</td><td>2</td><td>3</td><td>4</td><td>$\hl{5}$</td></tr>
          <tr><th>trạng thái sạch</th><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>$\hl{1}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Bước ba, lập bảng đếm từng mẫu một. Hàng thứ hai là giá trị chân phím ở mỗi mẫu. Hàng thứ ba đếm số mẫu liên tiếp giống mẫu trước, cứ đổi giá trị là đếm lại từ 1. Ở mẫu 3 và 4 đếm mới lên 2 thì mẫu 5 đã rơi về 0, chỉ từ mẫu 6 bộ đếm mới tăng đều 1, 2, 3, 4, 5. Vì thế trạng thái sạch ở hàng cuối giữ 0 suốt và chỉ chuyển thành 1 ở mẫu 10."
      - show: |
          <p><b>Bước 4 — kết luận:</b> đủ 5 mẫu liên tiếp (6, 7, 8, 9, 10) → trạng thái sạch đổi ở mẫu $\hl{10}$, và chỉ đổi <b>một</b> lần → bộ đếm tăng đúng 1.</p>
        say: "Bước bốn, kết luận, đủ 5 mẫu liên tiếp từ 6 đến 10 nên trạng thái sạch đổi ở mẫu 10, và chỉ đổi đúng một lần. Như vậy bộ đếm số lần bấm chỉ tăng đúng 1, đúng với một lần bấm thật."

  - id: check
    kind: check
    title: "Tự kiểm: đếm cạnh lên trước và sau chống dội"
    checks:
      - "(lambda r: sum(1 for a, b in zip(r, r[1:]) if (a, b) == (0, 1)))([0, 1, 0, 1, 1, 0, 1, 1, 1, 1, 1, 1, 1, 1]) == 3"
      - "(lambda r: sum(1 for a, b in zip(r, r[1:]) if (a, b) == (0, 1)))(alg.debounce([0, 1, 0, 1, 1, 0, 1, 1, 1, 1, 1, 1, 1, 1], 5)) == 1"
    steps:
      - show: |
          <table class="t"><tr><th>dãy</th><th>các chỗ đổi từ 0 lên 1</th><th>số lần đếm</th></tr>
          <tr><td>chân phím thô</td><td>mẫu 1, mẫu 3, mẫu 6</td><td>3 — đúng lỗi mở đầu “0 lên 3”</td></tr>
          <tr><td>sau chống dội</td><td>mẫu 10</td><td>$\hl{1}$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, vì bộ đếm thật đếm số lần đổi từ 0 lên 1, ta dò từng chỗ đổi trên hai dãy. Dãy chân phím thô đổi từ 0 lên 1 ở mẫu 1, mẫu 3 và mẫu 6, tức 3 lần, đúng như lỗi mở đầu màn hình nhảy từ 0 lên 3. Dãy sau chống dội chỉ đổi lên một lần ở mẫu 10, nên bộ đếm ra đúng 1."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "16_000_000 // 1000 * 5 == 80000"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Làm việc nặng trong hàm xử lý ngắt <b class="red">(sai)</b>
          <br><span class="note">In ra cổng nối tiếp, tính toán dài: các ngắt khác bị chặn, sự kiện bị lỡ. Chỉ đặt cờ, rồi xử lý ngoài.</span></div>
        say: "Lỗi thứ nhất, làm việc nặng trong hàm xử lý ngắt, như in ra cổng nối tiếp hay tính toán dài. Khi đó các ngắt khác bị chặn và sự kiện bị lỡ. Chỉ đặt cờ, rồi xử lý ở ngoài."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên <code>volatile</code> <b class="red">(sai)</b>
          <br><span class="note">Trình biên dịch tối ưu vòng chờ cờ thành đọc một lần: vòng lặp chờ mãi dù ngắt đã đặt cờ.</span></div>
        say: "Lỗi thứ hai, quên khai báo đặc biệt cho biến dùng chung. Trình biên dịch có thể tối ưu vòng chờ cờ thành chỉ đọc một lần, và vòng lặp chờ mãi dù ngắt đã đặt cờ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đếm cạnh của chân phím chưa chống dội <b class="red">(sai)</b>
          <br><span class="note">Mỗi lần nảy là một cạnh: một lần bấm thành nhiều lần đếm, như hình mở đầu.</span></div>
        say: "Lỗi thứ ba, đếm cạnh của chân phím chưa chống dội. Mỗi lần nảy là một cạnh, nên một lần bấm thành nhiều lần đếm, như ví dụ mở đầu."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Chờ trễ bằng vòng bận trong ngắt để chống dội <b class="red">(sai)</b>
          <br><span class="note">Chặn cả hệ thống 5 ms. Lấy mẫu bằng một bộ định thời đều đặn thì không chặn gì.</span></div>
          <table class="t"><tr><th>cách chống dội</th><th>bộ xử lý bị giữ</th></tr>
          <tr><td>vòng bận 5 ms trong hàm ngắt</td><td>5 ms = 80 000 nhịp ở 16 MHz, ngắt khác phải chờ</td></tr>
          <tr><td>bộ định thời lấy mẫu mỗi 1 ms</td><td>một lần đọc chân mỗi mẫu</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ tư, chờ trễ bằng một vòng lặp bận ngay trong ngắt để chống dội. Cách đó chặn cả hệ thống 5 mi li giây, còn lấy mẫu bằng một bộ định thời đều đặn thì không chặn gì."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "math.ceil(8 / 2) == 4 and 4 * 2 == 8 and 3 * 2 == 6"
      - "0x0200 == 512 == 2 * 256 and 0x02FF == 2 * 256 + 255 == 767"
      - "((0x0200 >> 8) & 0xFF) << 8 | (0x01FF & 0xFF) == 0x02FF == 767"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Phím dội tối đa 8 ms, lấy mẫu mỗi 2 ms: cần mấy mẫu liên tiếp giống nhau?</td></tr>
          <tr><td>2</td><td>Biến đếm 16 bit đang 511 (<code>0x01FF</code>). Đọc byte thấp, ngắt chen vào tăng lên 512, rồi đọc byte cao. Được số nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, phím dội tối đa 8 mi li giây, lấy mẫu mỗi 2 mi li giây, cần mấy mẫu liên tiếp giống nhau? Câu hai, biến đếm 16 bit đang là 511. Ta đọc byte thấp, ngắt chen vào tăng lên 512, rồi ta đọc byte cao, được số nào? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $\lceil 8 / 2 \rceil = \hl{4}$ mẫu. Thử lại: 4 mẫu cách 2 ms phủ $4 \cdot 2 = 8$ ms, đủ; 3 mẫu chỉ phủ 6 ms, thiếu.</p>
        say: "Đáp án câu một, 8 chia 2 bằng 4, cần 4 mẫu liên tiếp. Thử lại, 4 mẫu cách nhau 2 mi li giây phủ được 8 mi li giây, vừa đủ thời gian dội, còn 3 mẫu chỉ phủ 6 mi li giây, chưa đủ."
      - show: |
          <table class="t"><tr><th>lần đọc</th><th>biến lúc đó</th><th>đọc được</th></tr>
          <tr><td>byte thấp</td><td>511 = <code>0x01FF</code></td><td>FF</td></tr>
          <tr><td>byte cao (sau ngắt)</td><td>512 = <code>0x0200</code></td><td>02</td></tr>
          <tr><td>ghép</td><td></td><td><code>0x02FF</code> $= 2 \cdot 256 + 255 = \hl{767}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, byte thấp là F F của 511, byte cao là 02 của 512, ghép lại thành 767, sai hẳn, nên phải tắt ngắt khi đọc. Kiểm từng lần đọc như trong hình, lần đầu biến đang là 511 nên byte thấp đọc được F F. Ngắt chen vào tăng biến lên 512, viết là 02 00, nên lần sau byte cao đọc được 02. Ghép lại bằng 2 nhân 256 cộng 255, đúng là 767, một số không hề có trong bộ nhớ."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ngắt: phản ứng nhanh, tốn ít</span><span class="a">→</span>
          <span class="n">hàm ngắt ngắn, biến volatile</span><span class="a">→</span>
          <span class="n">đọc nhiều byte: tắt ngắt</span><span class="a">→</span>
          <span class="n">chống dội: n mẫu liên tiếp</span></div>
        say: "Tổng kết lại, ngắt phản ứng nhanh và tốn ít công sức. Hàm xử lý ngắt phải ngắn, biến dùng chung phải khai báo đặc biệt, đọc biến nhiều byte thì tắt ngắt, và chống dội bằng cách đợi đủ n mẫu liên tiếp."
      - show: |
          <div class="box key"><b>Tư duy:</b> tín hiệu từ thế giới thật luôn bẩn và đến bất ngờ. Lọc trước khi tin, và nghĩ xem điều gì xảy ra nếu bị cắt ngang giữa chừng.</div>
        say: "Điều cần mang theo, tín hiệu từ thế giới thật luôn bẩn và đến bất ngờ. Hãy lọc trước khi tin, và luôn nghĩ xem điều gì xảy ra nếu bị cắt ngang giữa chừng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>bộ định thời</b> và điều chế độ rộng xung.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học bộ định thời và điều chế độ rộng xung, cách tạo nhịp và điều khiển độ sáng, tốc độ động cơ. Hẹn gặp bạn ở bài tiếp theo."
