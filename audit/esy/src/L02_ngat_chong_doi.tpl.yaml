# Quy ước: số đếm 16 bit trên vi điều khiển 8 bit được đọc làm hai lần 8 bit (byte thấp trước). Chống dội: lấy mẫu mỗi 1 ms,
#   trạng thái ổn định chỉ đổi sau n mẫu liên tiếp giống nhau (alg.debounce, hình audit/esy/figs.py debounce_fig).
#   Số đọc rách tính trong checks. Mã C trong <div class="code">; lời đọc mô tả bằng tiếng Việt.
objectives:
  - "So sánh ngắt và vòng thăm dò"
  - "Viết hàm xử lý ngắt ngắn, dùng biến dùng chung an toàn"
  - "Chống dội phím bằng lấy mẫu"
