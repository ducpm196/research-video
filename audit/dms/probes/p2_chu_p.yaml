name: dms_p2_chu_p
# Chữ cái p là tên mệnh đề dùng suốt khoá DMS. ASR L00: “p” nghe thành “tệ”/“t” ở 2/4 câu gắn cờ (khung 16, 17).
# Khoá chấm gắn với từ đứng sau để chữ “P” ASR viết thành chữ cái vẫn tính đúng.
ctx:
  - "Mệnh đề {} đúng khi trời mưa."
  - "Nếu {} sai thì kéo theo luôn đúng."
  - "Cột {} có bốn dòng."
  - "Ta lấy phủ định của {} trước."
terms:
