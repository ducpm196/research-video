  - {sentence: "Công thức Cayley nói số cây trên n đỉnh có nhãn là n mũ n trừ 2.", reason: "Cayley đọc “Kê-li” (probe p1_ten 8/8); ASR chép “kê ly”, cùng âm"}
  - {sentence: "Lỗi thứ hai, dùng công thức Cayley để đếm hình dạng cây.", reason: "Cayley đọc “Kê-li” (probe p1_ten 8/8); ASR chép “kê ly”, cùng âm"}
  - {sentence: "Cộng lại 4 cộng 12 bằng 16, khớp với công thức Cayley.", reason: "Cayley đọc “Kê-li” (probe p1_ten 8/8); ASR chép “kê ly”, cùng âm"}
  - {sentence: "Câu hai, theo công thức Cayley, có 6 mũ 4, bằng 1296 cây.", reason: "Cayley đọc “Kê-li” (probe p1_ten 8/8); ASR chép “kê ly”, cùng âm"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nối 10 ngôi nhà bằng ít dây nhất"
    steps:
      - show: |
          <p>Kéo dây điện nối 10 ngôi nhà sao cho nhà nào cũng có điện (đi được tới mọi nhà) mà <b>ít dây nhất</b>.</p>
          <p>Nếu có một vòng khép kín thì cắt bớt một đoạn trên vòng vẫn đủ. Vậy mạng ít dây nhất <b>không có vòng</b> — đó là một <b>cây</b>. Cần bao nhiêu đoạn dây?</p>
        focus: [1, 2, 2, 2]
        say: "Chào bạn, kéo dây điện nối 10 ngôi nhà sao cho nhà nào cũng có điện, mà dùng ít dây nhất. Nếu mạng có một vòng khép kín, cắt bớt một đoạn trên vòng thì vẫn đi được tới mọi nhà. Vậy mạng ít dây nhất không có vòng nào, người ta gọi đó là một cây. Câu hỏi là cần bao nhiêu đoạn dây?"

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa, bổ đề bắt tay, quy nạp"
    checks:
      - "4 ** 2 == 4 * 4 == 16 and 5 ** 3 == 5 * 5 * 5 == 125 and 3 ** 1 == 3"
      - "3 + 3 + 4 + 4 + 2 == 16 == 2 * 8"
      - "all(sum(range(1, 2 * k, 2)) == k * k for k in range(1, 6)) and 1 == 1 ** 2"
    steps:
      - show: |
          <table class="t"><tr><th>viết gọn</th><th>nghĩa</th><th>kết quả</th></tr>
          <tr><td>$3^1$</td><td>một số 3</td><td>3</td></tr>
          <tr><td>$4^2$</td><td>4 × 4</td><td>16</td></tr>
          <tr><td>$5^3$</td><td>5 × 5 × 5</td><td>125</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước khi vào bài, ta ôn ba việc sẽ dùng đến. Việc thứ nhất là lũy thừa, a mũ k nghĩa là nhân k số a với nhau, nên 3 mũ 1 chỉ là 3. Bốn mũ hai bằng 4 nhân 4, bằng 16. Năm mũ ba bằng 5 nhân 5 nhân 5, bằng 125."
      - clear: true
        show: |
          <p>Việc thứ hai — <b>bổ đề bắt tay</b> của bài 16: tổng các bậc bằng hai lần số cạnh, vì mỗi cạnh có hai đầu.</p>
          <table class="t"><tr><th>đồ thị</th><th>các bậc</th><th>tổng</th><th>số cạnh</th></tr>
          <tr><td>phong bì</td><td>3, 3, 4, 4, 2</td><td>16</td><td>$8 = \frac{16}{2}$</td></tr></table>
        focus: [1, 2]
        say: "Việc thứ hai là bổ đề bắt tay ở bài 16, tổng các bậc bằng hai lần số cạnh, vì mỗi cạnh có hai đầu và góp 1 vào bậc của mỗi đầu. Hình phong bì ở bài 16 có các bậc 3, 3, 4, 4, 2, tổng là 16, nên có 16 chia 2, bằng 8 cạnh."
      - clear: true
        show: |
          <p>Việc thứ ba — <b>quy nạp</b> của bài 4: chứng minh cho $n = 1$ (cơ sở), rồi chứng minh “đúng cho $n$ thì đúng cho $n + 1$” (bước).</p>
          <table class="t"><tr><th>khẳng định</th><th>cơ sở $n = 1$</th><th>bước</th></tr>
          <tr><td>tổng $n$ số lẻ đầu tiên bằng $n^2$</td><td>$1 = 1^2$</td><td>thêm số lẻ thứ $n + 1$ là $2n + 1$: $n^2 + 2n + 1 = (n + 1)^2$</td></tr></table>
        focus: [1, 1, "2.2", "2.2"]
        say: "Việc thứ ba là quy nạp ở bài 4, như xếp hàng quân đô mi nô. Ta chứng minh cho n bằng 1, gọi là cơ sở, rồi chứng minh nếu đúng cho n thì đúng cho n cộng 1, gọi là bước. Ví dụ, tổng n số lẻ đầu tiên bằng n bình phương, với cơ sở là 1 bằng 1 bình phương. Bước là thêm số lẻ tiếp theo, 2n cộng 1, thì được n bình phương cộng 2n cộng 1, đúng bằng n cộng 1 tất cả bình phương."

  # ───────────────────────── 2. KÝ HIỆU / ĐỊNH NGHĨA ─────────────────────────
  - id: sym_tree
    kind: symbol
    title: "Giải mã: cây, lá, chu trình"
    steps:
      - show: |
          <p><b>Chu trình</b>: đường đi khép kín, không lặp cạnh, quay về đỉnh đầu. Bài này xét đồ thị <b>không có cạnh lặp</b>, nên chu trình có ít nhất 3 đỉnh.</p>
          <p><b>Cây</b>: đồ thị <b>liên thông</b> và <b>không có chu trình</b>.</p>
          <p><b>Lá</b>: đỉnh có bậc 1, tức $\deg(v) = 1$.</p>
        focus: [1, 1, 2, 3]
        say: "Chu trình là một đường đi khép kín, không lặp cạnh, quay về đỉnh xuất phát. Bài này xét đồ thị không có cạnh lặp như các cây cầu ở bài 16, nên một chu trình có ít nhất ba đỉnh. Cây là đồ thị liên thông và không có chu trình nào. Lá là đỉnh có bậc 1, chỉ có đúng một cạnh."

  # ───────────────────────── 3. TÍNH CHẤT TƯƠNG ĐƯƠNG ─────────────────────────
  - id: equiv_props
    kind: concept
    title: "Ba cách nhận ra một cây"
    steps:
      - show: |
          <p>Với đồ thị $n$ đỉnh, ba điều sau <b>tương đương</b> — đúng một điều là đúng cả ba:</p>
          <table class="t"><tr><th>điều</th><th>phát biểu</th></tr>
          <tr><td>1</td><td>liên thông và không có chu trình (định nghĩa)</td></tr>
          <tr><td>2</td><td>liên thông và có đúng $n - 1$ cạnh</td></tr>
          <tr><td>3</td><td>giữa hai đỉnh bất kỳ có <b>đúng một</b> đường đi</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Với đồ thị n đỉnh, ba điều sau là tương đương, đúng một điều thì đúng cả ba. Một, liên thông và không có chu trình, đó là định nghĩa. Hai, liên thông và có đúng n trừ 1 cạnh. Ba, giữa hai đỉnh bất kỳ có đúng một đường đi."
      - show: |
          <p class="note">Ý của điều 3: nếu có <b>hai</b> đường khác nhau giữa hai đỉnh, ghép chúng lại sẽ ra một chu trình — trái định nghĩa cây.</p>
        say: "Ý của điều ba, nếu giữa hai đỉnh có hai đường đi khác nhau, ghép chúng lại sẽ tạo ra một chu trình, trái với định nghĩa của cây."

  # ───────────────────────── 4. CHỨNG MINH n − 1 CẠNH ─────────────────────────
  - id: proof
    kind: concept
    title: "Vì sao cây n đỉnh có n − 1 cạnh"
    steps:
      - show: |
          <p><b>Bổ đề</b>: cây có từ 2 đỉnh trở lên luôn có lá. &nbsp; Lấy đường đi <b>dài nhất</b>; đỉnh cuối của nó không thể có hàng xóm ngoài đường (đường sẽ dài hơn) hay trên đường (sẽ có chu trình) — nên chỉ có 1 cạnh.</p>
          <p><b>Quy nạp</b> (bài 4) theo $n$: cơ sở $n = 1$: 0 cạnh ✓. &nbsp; Bước: cây $n + 1$ đỉnh có một lá; bỏ lá đó và cạnh của nó, còn một cây $n$ đỉnh, theo giả thiết quy nạp có $n - 1$ cạnh. Thêm lại: $n$ cạnh ✓</p>
        focus: [1, 1, 1, 1, 2, 2, 2]
        say: "Bổ đề trước, cây có từ hai đỉnh trở lên luôn có lá. Lấy một đường đi dài nhất trong cây. Đỉnh cuối của nó không thể có hàng xóm ở ngoài đường, vì như thế đường sẽ dài hơn. Nó cũng không thể có hàng xóm khác trên đường, vì sẽ tạo chu trình, nên nó chỉ có một cạnh. Giờ quy nạp theo số đỉnh, như bài 4. Bước cơ sở, cây chỉ có một đỉnh thì không có cạnh nào. Bước quy nạp, cây n cộng 1 đỉnh có một lá, bỏ lá đó đi thì còn một cây n đỉnh có n trừ 1 cạnh theo giả thiết, thêm lại lá thì có n cạnh."
      - show: |
          <div class="box ok">Câu trả lời đầu bài: 10 ngôi nhà cần đúng <b>9</b> đoạn dây.</div>
        say: "Vậy câu trả lời cho đầu bài là 10 ngôi nhà cần đúng 9 đoạn dây."

  # ───────────────────────── 4b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Tỉa lá: mỗi lần bớt đúng một đỉnh và một cạnh"
    checks:
      - "all(n - m == 1 for n, m in [(5, 4), (4, 3), (3, 2), (2, 1), (1, 0)])"
    steps:
      - show: |
          <div><svg width="1440" height="345" viewBox="0 0 1440 345"><rect x="10" y="8" width="270" height="292" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><line x1="85" y1="65" x2="40" y2="175" stroke="#6b7280" stroke-width="4"/><line x1="85" y1="65" x2="175" y2="140" stroke="#6b7280" stroke-width="4"/><line x1="175" y1="140" x2="120" y2="250" stroke="#6b7280" stroke-width="4"/><line x1="175" y1="140" x2="240" y2="245" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 7"/><circle cx="85" cy="65" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="85" y="74" font-size="24" text-anchor="middle">1</text><circle cx="40" cy="175" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="40" y="184" font-size="24" text-anchor="middle">2</text><circle cx="175" cy="140" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="175" y="149" font-size="24" text-anchor="middle">3</text><circle cx="120" cy="250" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="120" y="259" font-size="24" text-anchor="middle">4</text><circle cx="240" cy="245" r="24" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="240" y="254" font-size="24" text-anchor="middle">5</text><text x="145" y="330" font-size="24" text-anchor="middle">5 đỉnh, 4 cạnh</text><rect x="296" y="8" width="270" height="292" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><line x1="371" y1="65" x2="326" y2="175" stroke="#6b7280" stroke-width="4"/><line x1="371" y1="65" x2="461" y2="140" stroke="#6b7280" stroke-width="4"/><line x1="461" y1="140" x2="406" y2="250" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 7"/><circle cx="371" cy="65" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="371" y="74" font-size="24" text-anchor="middle">1</text><circle cx="326" cy="175" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="326" y="184" font-size="24" text-anchor="middle">2</text><circle cx="461" cy="140" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="461" y="149" font-size="24" text-anchor="middle">3</text><circle cx="406" cy="250" r="24" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="406" y="259" font-size="24" text-anchor="middle">4</text><text x="431" y="330" font-size="24" text-anchor="middle">4 đỉnh, 3 cạnh</text><rect x="582" y="8" width="270" height="292" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><line x1="657" y1="65" x2="612" y2="175" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 7"/><line x1="657" y1="65" x2="747" y2="140" stroke="#6b7280" stroke-width="4"/><circle cx="657" cy="65" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="657" y="74" font-size="24" text-anchor="middle">1</text><circle cx="612" cy="175" r="24" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="612" y="184" font-size="24" text-anchor="middle">2</text><circle cx="747" cy="140" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="747" y="149" font-size="24" text-anchor="middle">3</text><text x="717" y="330" font-size="24" text-anchor="middle">3 đỉnh, 2 cạnh</text><rect x="868" y="8" width="270" height="292" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><line x1="943" y1="65" x2="1033" y2="140" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 7"/><circle cx="943" cy="65" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="943" y="74" font-size="24" text-anchor="middle">1</text><circle cx="1033" cy="140" r="24" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="1033" y="149" font-size="24" text-anchor="middle">3</text><text x="1003" y="330" font-size="24" text-anchor="middle">2 đỉnh, 1 cạnh</text><rect x="1154" y="8" width="270" height="292" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><circle cx="1229" cy="65" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="1229" y="74" font-size="24" text-anchor="middle">1</text><text x="1289" y="330" font-size="24" text-anchor="middle">1 đỉnh, 0 cạnh</text><text x="288" y="160" font-size="26" text-anchor="middle" fill="#dc2626">→</text><text x="574" y="160" font-size="26" text-anchor="middle" fill="#dc2626">→</text><text x="860" y="160" font-size="26" text-anchor="middle" fill="#dc2626">→</text><text x="1146" y="160" font-size="26" text-anchor="middle" fill="#dc2626">→</text></svg></div>
          <p>Lá sắp bỏ tô đỏ, cạnh của nó nét đứt. Hiệu “số đỉnh trừ số cạnh” luôn bằng 1: $5 - 4 = 4 - 3 = 3 - 2 = 2 - 1 = 1 - 0 = 1$.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Hình này cho thấy chứng minh quy nạp chạy thế nào trên một cây cụ thể có 5 đỉnh và 4 cạnh. Lá sắp bỏ được tô đỏ, nó chỉ có một cạnh, vẽ nét đứt. Mỗi lần bỏ một lá, ta mất đúng một đỉnh và đúng một cạnh, và phần còn lại vẫn là một cây, vì bỏ lá không cắt đường đi giữa các đỉnh khác. Vì vậy hiệu giữa số đỉnh và số cạnh không đổi, luôn bằng 1. Tỉa tới khi còn một đỉnh và không cạnh nào, ta thấy cây ban đầu có đúng 5 trừ 1, bằng 4 cạnh."

  # ───────────────────────── 5. VÍ DỤ: ĐẾM CÂY CÓ NHÃN ─────────────────────────
  - id: example
    kind: example
    title: "Có bao nhiêu cây trên các đỉnh 1, 2, …, n?"
    checks:
      - "len(list(__import__('itertools').combinations([(1, 2), (1, 3), (2, 3)], 2))) == 3 == 3 ** (3 - 2)"
      - "sum(1 for es in __import__('itertools').combinations(list(__import__('itertools').combinations(range(4), 2)), 3) if len(set().union(*es)) == 4) == 16 == 4 ** 2"
      - "5 ** 3 == 125"
      - "10 - 1 == 9 and 10 ** (10 - 2) == 10 ** 8 == 100_000_000"
    steps:
      - show: |
          <div class="row"><div class="col">{{T3}}</div></div>
          <p>Với 3 đỉnh có nhãn 1, 2, 3: chọn 2 trong 3 cạnh có thể — cả 3 cách đều là cây.</p>
          <div class="box key"><b>Công thức Cayley</b>: số cây trên $n$ đỉnh có nhãn là $n^{n - 2}$. &nbsp; $n = 3$: $3^1 = 3$ ✓ &nbsp; $n = 4$: $4^2 = 16$ ✓ &nbsp; $n = 5$: $5^3 = 125$ ✓</div>
          <p class="note">Ba số này đều được máy vét cạn mọi cách chọn cạnh rồi đếm.</p>
        focus: [1, 2, 3, 3, 4]
        say: "Đếm các cây trên các đỉnh có nhãn 1, 2, cho đến n. Với 3 đỉnh, có 3 cạnh có thể, chọn 2 trong 3 cạnh thì cả 3 cách đều cho một cây. Công thức Cayley nói số cây trên n đỉnh có nhãn là n mũ n trừ 2. Với 3 đỉnh là 3, với 4 đỉnh là 16, với 5 đỉnh là 125. Cả ba con số đều được máy vét cạn mọi cách chọn cạnh rồi đếm."
      - clear: true
        show: |
          <p><b>Áp vào đầu bài</b> — 10 ngôi nhà có tên (có nhãn):</p>
          <table class="t"><tr><th>câu hỏi</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>mỗi mạng ít dây nhất cần mấy đoạn?</td><td>$n - 1 = 10 - 1$</td><td>9 đoạn</td></tr>
          <tr><td>có bao nhiêu mạng như thế?</td><td>$10^{10 - 2} = 10^8$</td><td>100 triệu</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3"]
        say: "Bây giờ áp vào đầu bài, 10 ngôi nhà có tên nên là cây có nhãn. Theo định lý vừa chứng minh, mỗi mạng ít dây nhất cần 10 trừ 1, bằng 9 đoạn dây. Theo công thức Cayley, số mạng như thế là 10 mũ 8, tức 100 triệu cách. Vì vậy tìm mạng rẻ nhất bằng cách thử hết từng cây là rất chậm, người ta dùng những thuật toán riêng, nhanh hơn rất nhiều."

  # ───────────────────────── 6. CÓ NHÃN VÀ KHÔNG NHÃN ─────────────────────────
  - id: labels
    kind: concept
    title: "Có nhãn khác không nhãn"
    checks:
      - "4 * 3 * 2 // 2 == 12 and 4 + 12 == 16"
    steps:
      - show: |
          <div class="row"><div class="col">{{S4}}</div></div>
          <p>Nếu <b>không</b> quan tâm nhãn, cây 4 đỉnh chỉ có <b>2 hình dạng</b>: đường thẳng và hình sao.</p>
          <p>Gắn nhãn: hình sao có 4 cách (chọn tâm); đường thẳng có $\frac{4!}{2} = 12$ cách (đảo đầu cuối là một). $\; 4 + 12 = 16$ ✓</p>
        focus: [1, 2, 3, 3]
        say: "Nếu không quan tâm nhãn, cây 4 đỉnh chỉ có hai hình dạng, đường thẳng và hình sao. Gắn nhãn vào, hình sao có 4 cách, chỉ cần chọn đỉnh ở tâm. Đường thẳng có 4 giai thừa chia 2 bằng 12 cách, chia 2 vì đọc từ đầu này hay đầu kia là cùng một cây. Cộng lại 4 cộng 12 bằng 16, khớp với công thức Cayley."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "2 * (10 - 1) == 18"
      - "4 * 3 // 2 == 6 and 6 * 5 * 4 // (3 * 2 * 1) == 20 == len(list(__import__('itertools').combinations(range(6), 3))) and len(list(__import__('itertools').combinations(range(4), 3))) == 4 and 20 - 4 == 16"
      - "(lambda E: sum(1 for es in __import__('itertools').combinations(E, 3) if len(set().union(*es)) == 3))(list(__import__('itertools').combinations(range(4), 2))) == 4"
    steps:
      - show: |
          <ol><li>Đếm cạnh: phải bằng $n - 1$; ít hơn là không liên thông, nhiều hơn là có chu trình.</li>
          <li>Tổng bậc của cây $= 2(n - 1)$ (bài 16) — cây 10 đỉnh có tổng bậc 18.</li>
          <li>Đếm thử với $n$ nhỏ (3 hoặc 4) trước khi tin một công thức đếm.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, đếm cạnh phải bằng n trừ 1, ít hơn thì không liên thông, nhiều hơn thì có chu trình. Hai, theo bổ đề bắt tay ở bài 16, tổng các bậc bằng hai lần số cạnh, nên cây 10 đỉnh có tổng bậc 18. Ba, luôn đếm thử với n nhỏ trước khi tin một công thức đếm."
      - clear: true
        show: |
          <p><b>Đường thứ ba để ra 16</b> (không dùng Cayley, không dùng hình dạng). 4 đỉnh có $\frac{4 \times 3}{2} = 6$ cạnh có thể; cây cần 3 cạnh.</p>
          <table class="t"><tr><th>bước</th><th>đếm</th><th>số cách</th></tr>
          <tr><td>chọn 3 trong 6 cạnh</td><td>$\frac{6 \times 5 \times 4}{3 \times 2 \times 1}$</td><td>20</td></tr>
          <tr><td>bỏ cách tạo tam giác (chọn 3 đỉnh làm tam giác)</td><td>4 cách</td><td>$20 - 4 = 16$ ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.3"]
        say: "Vì cần chắc chắn, ta tìm đường thứ ba để ra con số 16, không dùng công thức Cayley, cũng không dùng hình dạng. Bốn đỉnh có 4 nhân 3 chia 2, bằng 6 cạnh có thể, và một cây 4 đỉnh cần đúng 3 cạnh. Chọn 3 trong 6 cạnh có 6 nhân 5 nhân 4 chia 6, bằng 20 cách. Ba cạnh mà không phải cây thì phải có chu trình, mà chu trình với 3 cạnh chỉ có thể là tam giác, và có 4 cách chọn 3 đỉnh làm tam giác. Bỏ 4 cách đó, còn 20 trừ 4, bằng 16 cây, khớp với cả hai cách trước."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "4 - 1 == 3 and len([(1, 2), (2, 3), (1, 3)]) == 3"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Có $n - 1$ cạnh là kết luận cây <b class="red">(sai)</b>
          <br><span class="note">Tam giác 1–2–3 và đỉnh 4 đứng riêng: 4 đỉnh, 3 cạnh, nhưng có chu trình và không liên thông. Phải có thêm “liên thông”.</span></div>
          <table class="t"><tr><th>đồ thị</th><th>đỉnh</th><th>cạnh</th><th>liên thông?</th><th>chu trình?</th><th>cây?</th></tr>
          <tr><td>tam giác 1–2–3, đỉnh 4 riêng</td><td>4</td><td>3</td><td>không</td><td>có</td><td>không</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ nhất, thấy n trừ 1 cạnh là kết luận ngay là cây. Một tam giác cùng một đỉnh đứng riêng có 4 đỉnh, 3 cạnh, nhưng có chu trình và không liên thông, nên phải có thêm điều kiện liên thông. Bảng cho thấy số cạnh đúng bằng 4 trừ 1, nhưng hai tiêu chí còn lại đều hỏng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng $n^{n - 2}$ để đếm hình dạng cây <b class="red">(sai)</b>
          <br><span class="note">Công thức đếm cây <b>có nhãn</b>. Cây 4 đỉnh có 16 cây có nhãn nhưng chỉ 2 hình dạng.</span></div>
        say: "Lỗi thứ hai, dùng công thức Cayley để đếm hình dạng cây. Công thức chỉ đếm cây có nhãn, cây 4 đỉnh có 16 cây có nhãn nhưng chỉ 2 hình dạng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quy nạp “thêm một đỉnh nối vào cây” mà không chứng minh mọi cây đều dựng được như vậy <b class="red">(thiếu)</b>
          <br><span class="note">Bước đúng là đi ngược: lấy cây $n + 1$ đỉnh bất kỳ, <b>bỏ một lá</b> — bổ đề lá bảo đảm luôn làm được.</span></div>
        say: "Lỗi thứ ba, quy nạp bằng cách thêm một đỉnh vào cây mà không chứng minh mọi cây đều dựng được như vậy. Bước đúng là đi ngược, lấy một cây n cộng 1 đỉnh bất kỳ rồi bỏ một lá, và bổ đề về lá bảo đảm luôn làm được."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ cây phải có một “gốc” ở trên cùng <b class="red">(chưa đúng)</b>
          <br><span class="note">Cây trong đồ thị không có gốc; “cây có gốc” trong lập trình là cây ta chọn thêm một đỉnh làm gốc.</span></div>
        say: "Lỗi thứ tư, nghĩ cây nào cũng có một gốc ở trên cùng. Cây trong lý thuyết đồ thị không có gốc, còn cây có gốc trong lập trình là cây mà ta chọn thêm một đỉnh làm gốc."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "20 - 1 == 19 and 2 * 19 == 38"
      - "6 ** 4 == 1296 == 36 * 36 and 6 - 2 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Một cây có 20 đỉnh. Có bao nhiêu cạnh? Tổng bậc là bao nhiêu?</td></tr>
          <tr><td>2</td><td>Có bao nhiêu cây trên 6 đỉnh có nhãn 1 đến 6?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, một cây có 20 đỉnh thì có bao nhiêu cạnh, và tổng bậc là bao nhiêu? Câu hai, có bao nhiêu cây trên 6 đỉnh có nhãn từ 1 đến 6? Dừng video và làm ra giấy."
        pause: 8
      - clear: true
        show: |
          <p>① <b>Bước 1</b> — số cạnh: cây $n$ đỉnh có $n - 1$ cạnh, nên $20 - 1 = \hl{19}$ cạnh.</p>
          <p><b>Bước 2</b> — tổng bậc: theo bổ đề bắt tay, $2 \times 19 = \hl{38}$.</p>
        focus: [1, 2]
        say: "Đáp án câu một, bước một, cây n đỉnh có n trừ 1 cạnh, nên cây 20 đỉnh có 19 cạnh. Bước hai, theo bổ đề bắt tay, tổng bậc bằng hai lần số cạnh, tức 2 nhân 19, bằng 38."
      - show: |
          <p>② Cayley với $n = 6$: số mũ $6 - 2 = 4$; $6^4 = 6 \times 6 \times 6 \times 6 = 36 \times 36 = \hl{1296}$.</p>
        say: "Câu hai, theo công thức Cayley, có 6 mũ 4, bằng 1296 cây. Số mũ là 4 vì với n bằng 6, ta lấy 6 trừ 2. Sáu mũ bốn bằng 6 nhân 6, nhân 6 nhân 6, tức 36 nhân 36, cũng ra 1296."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cây: liên thông, không chu trình</span><span class="a">→</span>
          <span class="n">luôn có lá</span><span class="a">→</span>
          <span class="n">quy nạp bỏ lá: $n - 1$ cạnh</span><span class="a">→</span>
          <span class="n">có nhãn: $n^{n - 2}$ cây</span></div>
        say: "Tổng kết lại, cây là đồ thị liên thông không có chu trình. Cây luôn có lá, nên quy nạp bằng cách bỏ lá cho ta đúng n trừ 1 cạnh. Số cây trên n đỉnh có nhãn là n mũ n trừ 2."
      - show: |
          <div class="box key"><b>Tư duy:</b> cây là cấu trúc tối thiểu để giữ mọi thứ liên thông — gặp lại trong cây khung nhỏ nhất, cây tìm kiếm, cây quyết định.</div>
        say: "Điều cần mang theo, cây là cấu trúc tối thiểu để giữ mọi thứ liên thông, và ta sẽ gặp lại nó trong cây khung nhỏ nhất, cây tìm kiếm và cây quyết định."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 18): <b>đồ thị phẳng</b> — vẽ không có cạnh cắt nhau, công thức đỉnh trừ cạnh cộng mặt bằng 2, và tô màu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 18, ta học đồ thị phẳng, vẽ được mà không có cạnh nào cắt nhau, công thức số đỉnh trừ số cạnh cộng số mặt bằng 2, và bài toán tô màu. Hẹn gặp bạn ở bài tiếp theo."
