objectives:
  - "Nhận ra cây qua các tính chất tương đương"
  - "Chứng minh cây n đỉnh có n − 1 cạnh bằng quy nạp"
  - "Dùng công thức Cayley đếm cây có nhãn"
asr_reviewed:
  - {sentence: "Theo công thức Cayley, số mạng như thế là 10 mũ 8, tức 100 triệu cách.", reason: "ASR chép “Theo công thức kê ly, số mạng như thế là 10 mũ 8, tức 100 triệu cách.” (0.944): “Cayley” đọc theo lexicon_vi.DMS.yaml là “Kê-li” (probe p1_ten 8/8), ASR viết “kê ly” — đúng âm, chỉ khác cách viết — NOT_VERIFIED bằng tai người"}
