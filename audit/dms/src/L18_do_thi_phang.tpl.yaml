scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mạch in không được có dây cắt nhau"
    steps:
      - show: |
          <p>Trên một lớp mạch in, các đường dẫn <b>không được cắt nhau</b>. Nối 5 linh kiện, mỗi cặp một đường dẫn — làm được không?</p>
          <p>Bản đồ các tỉnh: tô màu sao cho hai tỉnh chung đường biên khác màu — cần bao nhiêu màu?</p>
        focus: [1, 1, 2]
        say: "Chào bạn, trên một lớp mạch in, các đường dẫn không được cắt nhau. Nối 5 linh kiện, mỗi cặp một đường dẫn, có làm được không? Tô màu bản đồ các tỉnh sao cho hai tỉnh chung đường biên thì khác màu, cần bao nhiêu màu?"
      - show: |
          <div class="box key">Câu thứ nhất: <b>không</b> — và ta sẽ chứng minh chỉ bằng đếm. Câu thứ hai: 4 màu là đủ cho mọi bản đồ mà mỗi vùng liền một khối (Appel, Haken, 1976, chứng minh có máy tính hỗ trợ).</div>
        say: "Câu thứ nhất, không làm được, và ta sẽ chứng minh chỉ bằng phép đếm. Câu thứ hai, bốn màu là đủ cho mọi bản đồ mà mỗi vùng liền một khối, đây là định lý bốn màu, được chứng minh năm 1976 với sự hỗ trợ của máy tính."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: số cạnh của cây và của đồ thị đầy đủ, biến đổi bất đẳng thức"
    checks:
      - "5 - 1 == 4 and 10 - 1 == 9"
      - "4 * 3 // 2 == 6 and 5 * 4 // 2 == 10"
      - "(lambda x: x + 6 <= 10)(4) and not (lambda x: x + 6 <= 10)(5) and 10 - 6 == 4 and 4 + 6 == 10 and 5 + 6 == 11"
      - "all(3 * (2 + x) == 6 + 3 * x for x in range(-5, 6)) and 3 * (2 + 1) == 9 == 6 + 3"
    steps:
      - show: |
          <table class="t"><tr><th>đồ thị</th><th>quy tắc</th><th>ví dụ</th></tr>
          <tr><td>cây $n$ đỉnh (bài 17)</td><td>$n - 1$ cạnh</td><td>5 đỉnh: $5 - 1 = 4$ cạnh</td></tr>
          <tr><td>đầy đủ $n$ đỉnh: mọi cặp nối nhau</td><td>$\frac{n \times (n - 1)}{2}$ cạnh</td><td>4 đỉnh: 6; &nbsp; 5 đỉnh: $\frac{5 \times 4}{2} = 10$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3"]
        say: "Trước khi vào bài, ta ôn hai việc sẽ dùng đến. Việc thứ nhất là đếm cạnh, như ở bài 17, cây n đỉnh luôn có n trừ 1 cạnh, nên cây 5 đỉnh có 4 cạnh. Đồ thị đầy đủ n đỉnh, mọi cặp đỉnh nối nhau, có n nhân n trừ 1 chia 2 cạnh, vì mỗi đỉnh nối với n trừ 1 đỉnh và mỗi cạnh được đếm ở cả hai đầu. Bốn đỉnh cho 6 cạnh, năm đỉnh cho 5 nhân 4 chia 2, bằng 10 cạnh."
      - clear: true
        show: |
          <p>Việc thứ hai — <b>biến đổi bất đẳng thức</b> (dấu $\le$ đọc là “nhỏ hơn hoặc bằng”):</p>
          <table class="t"><tr><th>phép làm</th><th>ví dụ</th><th>kiểm bằng số</th></tr>
          <tr><td>chuyển một số sang vế kia thì đổi dấu</td><td>$x + 6 \le 10 \implies x \le 10 - 6 = 4$</td><td>$x = 4$: $10 \le 10$ ✓; &nbsp; $x = 5$: $11 \le 10$ sai</td></tr>
          <tr><td>phá ngoặc: nhân số ngoài với từng số trong</td><td>$3 \times (2 + x) = 6 + 3x$</td><td>$x = 1$: $9 = 9$ ✓</td></tr></table>
        introduces: [geq]
        focus: [1, "2.2", "2.2", "2.3"]
        say: "Việc thứ hai là biến đổi bất đẳng thức, dấu nhỏ hơn hoặc bằng đọc đúng như tên của nó. Chuyển một số sang vế kia thì đổi dấu, nên x cộng 6 nhỏ hơn hoặc bằng 10 cho ta x nhỏ hơn hoặc bằng 4. Thử x bằng 4 được 10, vẫn thoả, còn x bằng 5 được 11, vượt quá 10. Phá ngoặc là nhân số bên ngoài với từng số bên trong, 3 nhân 2 cộng x bằng 6 cộng 3x, thử x bằng 1 thì hai vế cùng bằng 9."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym_planar
    kind: symbol
    title: "Giải mã: đồ thị phẳng, mặt, V, E, F"
    checks:
      - "len(list(__import__('itertools').combinations(range(4), 2))) == 6"
    steps:
      - show: |
          <div class="row"><div class="col">{{K4}}</div>
          <div class="col"><p><b>Đồ thị phẳng</b>: vẽ được trên mặt phẳng mà <b>không</b> cạnh nào cắt nhau.</p>
          <p><b>Mặt</b>: các vùng mà cạnh chia mặt phẳng ra, <b>kể cả vùng ngoài</b>.</p>
          <p>$K_4$ (4 đỉnh, mỗi cặp nối nhau): $V = 4$, $E = 6$, $F = 4$.</p></div></div>
        introduces: [sub]
        focus: ["1.2", "1.2", "1.1", "1.2"]
        say: "Đồ thị phẳng là đồ thị vẽ được trên mặt phẳng mà không có cạnh nào cắt nhau. Các cạnh chia mặt phẳng thành nhiều vùng, gọi là mặt, và tính cả vùng bên ngoài. Hình bên là K bốn, đồ thị 4 đỉnh mà mỗi cặp nối với nhau, vẽ với đỉnh 4 ở giữa nên không có cạnh cắt nhau. Nó có 4 đỉnh, 6 cạnh và 4 mặt, chỉ số dưới 4 chỉ số đỉnh."
      - show: |
          <div class="box warn">Ở bài này, $V$, $E$, $F$ là các <b>số</b> (số đỉnh, số cạnh, số mặt), không phải tập đỉnh, tập cạnh như bài 16.</div>
        notation_note: true
        say: "Chú ý, trong bài này V, E, F là các con số, số đỉnh, số cạnh và số mặt, không phải tập đỉnh và tập cạnh như ở bài 16."

  # ───────────────────────── 3. CÔNG THỨC EULER ─────────────────────────
  - id: euler_formula
    kind: concept
    title: "Công thức Euler: V − E + F = 2"
    checks:
      - "4 - 6 + 4 == 2"
      - "all(n - (n - 1) + 1 == 2 for n in range(1, 50))"
    steps:
      - show: |
          <div class="box key">Đồ thị phẳng <b>liên thông</b>: $V - E + F = 2$.</div>
          <p>$K_4$: $4 - 6 + 4 = 2$ ✓ &nbsp; Cây (bài 17): $V - (V - 1) + 1 = 2$ ✓ — cây chỉ có một mặt (mặt ngoài).</p>
          <p class="note">Ý chứng minh: bắt đầu từ một <b>cây khung</b> — một cây nối đủ mọi đỉnh, lấy từ các cạnh của đồ thị (đúng 2). Mỗi cạnh thêm vào nối hai đỉnh đã liên thông nên chia một mặt làm đôi: $E$ tăng 1, $F$ tăng 1, tổng không đổi.</p>
        focus: [1, 2, 2, 3, 3]
        say: "Công thức Euler, với đồ thị phẳng liên thông, số đỉnh trừ số cạnh cộng số mặt luôn bằng 2. Với K bốn, 4 trừ 6 cộng 4 bằng 2. Với một cây như bài 17, số cạnh bằng số đỉnh trừ 1 và chỉ có một mặt, nên cũng ra 2. Ý chứng minh, bắt đầu từ một cây khung, tức một cây nối đủ mọi đỉnh, lấy từ các cạnh của đồ thị, và với cây thì đã đúng bằng 2. Mỗi cạnh thêm vào chia một mặt làm đôi, nên số cạnh và số mặt cùng tăng 1, kết quả không đổi."

  # ───────────────────────── 4. VÍ DỤ: K5 KHÔNG PHẲNG ─────────────────────────
  - id: example
    kind: example
    title: "Chứng minh K₅ không phẳng"
    checks:
      - "len(list(__import__('itertools').combinations(range(5), 2))) == 10 and 3 * 5 - 6 == 9"
      - "3 * 4 == 12 == 2 * 6 and 6 - 3 * 4 + 3 * 6 == 12 and 3 * 4 - 6 == 6"
      - "all((3 * (2 - V + E) <= 2 * E) == (E <= 3 * V - 6) for V in range(3, 12) for E in range(0, 40))"
    steps:
      - show: |
          <div class="row"><div class="col">{{K5}}</div>
          <div class="col"><p><b>Bất đẳng thức</b>: đồ thị phẳng <b>đơn</b> (không có hai cạnh nối cùng một cặp đỉnh, không có cạnh nối một đỉnh với chính nó), <b>liên thông</b>, $V \ge 3$: $E \le 3V - 6$. (Chứng minh dưới đây cần $E \ge 3$; trường hợp $E < 3$ kiểm tay.)</p>
          <p>Vì sao: mỗi mặt có ít nhất 3 cạnh bao quanh, mỗi cạnh giáp nhiều nhất 2 mặt $\implies 3F \le 2E$. Thay $F = 2 - V + E$ rồi rút gọn.</p>
          <p>$K_5$: $E = 10$, còn $3V - 6 = 9$. &nbsp; $10 \gt 9$ $\implies$ $K_5$ <b>không phẳng</b>.</p></div></div>
        focus: ["1.2", "1.2", "1.2", "1.2", "1.1"]
        say: "Ta dùng một bất đẳng thức, với đồ thị phẳng đơn liên thông có từ 3 đỉnh và ít nhất 3 cạnh, số cạnh không vượt quá 3 lần số đỉnh trừ 6. Đồ thị đơn nghĩa là không có hai cạnh nối cùng một cặp đỉnh, và không có cạnh nào nối một đỉnh với chính nó. Lý do, khi có ít nhất 3 cạnh, sẽ được suy ra từng bước ngay sau đây. K năm có 10 cạnh, còn 3 nhân 5 trừ 6 chỉ bằng 9. Mười lớn hơn chín, nên K năm không phẳng, và 5 linh kiện ở đầu bài không nối được trên một lớp mạch."
      - clear: true
        show: |
          <p><b>Bước 1 — đếm cặp (mặt, cạnh giáp nó)</b> theo hai cách. Theo mặt: mỗi mặt có ít nhất 3 cạnh, nên số cặp $\ge 3F$. Theo cạnh: mỗi cạnh giáp nhiều nhất 2 mặt, nên số cặp $\le 2E$.</p>
          <div class="box key">$3F \le 2E$ &nbsp; — thử với $K_4$: $3 \times 4 = 12 \le 2 \times 6 = 12$ ✓</div>
        focus: [1, 1, 1, 1, 2]
        say: "Giờ ta suy ra bất đẳng thức đó từng bước. Bước một, đếm các cặp gồm một mặt và một cạnh giáp mặt đó, theo hai cách. Đếm theo mặt, mỗi mặt có ít nhất 3 cạnh bao quanh, nên số cặp ít nhất là 3 lần số mặt. Đếm theo cạnh thì mỗi cạnh giáp nhiều nhất 2 mặt, nên số cặp nhiều nhất là 2 lần số cạnh. Vì vậy 3F nhỏ hơn hoặc bằng 2E, thử với K bốn, 3 nhân 4 bằng 12, đúng bằng 2 nhân 6."
      - show: |
          <p><b>Bước 2 — thay $F$ theo công thức Euler (đồ thị liên thông)</b>: $F = 2 - V + E$, nên $3 \times (2 - V + E) \le 2E$, phá ngoặc: $6 - 3V + 3E \le 2E$.</p>
          <p class="note">Thử $K_4$ ($V = 4$, $E = 6$): $6 - 12 + 18 = 12 \le 12$ ✓</p>
        focus: [1, 1, 1, 2]
        say: "Bước hai, theo công thức Euler, dùng được vì ta xét đồ thị liên thông như K năm, số mặt F bằng 2 trừ V cộng E. Thay vào, ta được 3 nhân 2 trừ V cộng E, nhỏ hơn hoặc bằng 2E. Khi phá dấu ngoặc, vế trái trở thành 6 trừ 3V cộng 3E. Thử với K bốn, 6 trừ 12 cộng 18 bằng 12, vẫn nhỏ hơn hoặc bằng 12."
      - show: |
          <p><b>Bước 3 — chuyển vế</b>: đưa $2E$ sang trái, $6 - 3V$ sang phải: $3E - 2E \le 3V - 6$, tức $\hl{E \le 3V - 6}$.</p>
          <table class="t"><tr><th>đồ thị</th><th>$E$</th><th>$3V - 6$</th><th>kết luận</th></tr>
          <tr><td>$K_4$</td><td>6</td><td>$3 \times 4 - 6 = 6$</td><td>thoả (vừa khít)</td></tr>
          <tr><td>$K_5$</td><td>10</td><td>$3 \times 5 - 6 = 9$</td><td>vi phạm $\implies$ không phẳng</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, chuyển vế, đưa 2E sang trái và 6 trừ 3V sang phải, được E nhỏ hơn hoặc bằng 3V trừ 6, đúng bất đẳng thức đã dùng. K bốn có 6 cạnh, và 3 nhân 4 trừ 6 cũng bằng 6, nên thoả vừa khít. K năm có 10 cạnh nhưng giới hạn chỉ là 9, nên vi phạm, và vì thế không phẳng."

  # ───────────────────────── 5. TÔ MÀU ─────────────────────────
  - id: coloring
    kind: concept
    title: "Tô màu tham lam: thứ tự quyết định"
    checks:
      - "(lambda E, g: (max(g(E, [1, 2, 3, 4]).values()), max(g(E, [1, 4, 2, 3]).values())))([(1, 2), (2, 3), (3, 4)], lambda E, order: __import__('functools').reduce(lambda c, v: {**c, v: min(set(range(5)) - {c[u] for a, b in E for u in ((b,) if a == v else (a,) if b == v else ()) if u in c})}, order, {})) == (1, 2)"
    steps:
      - show: |
          <p><b>Tô màu</b>: hai đỉnh kề nhau phải khác màu. <b>Tham lam</b>: đi lần lượt từng đỉnh, tô màu có số nhỏ nhất chưa bị hàng xóm dùng.</p>
          <div class="row"><div class="col"><p>Thứ tự 1, 2, 3, 4: <b>2 màu</b></p>{{GG}}</div>
          <div class="col"><p>Thứ tự 1, 4, 2, 3: <b>3 màu</b></p>{{GB}}</div></div>
        focus: [1, 1, "2.1", "2.2"]
        say: "Tô màu đồ thị nghĩa là hai đỉnh kề nhau phải khác màu. Cách tham lam đi lần lượt từng đỉnh, và tô màu có số nhỏ nhất chưa bị hàng xóm dùng. Với đường đi 1, 2, 3, 4 theo đúng thứ tự, chỉ cần 2 màu xen kẽ. Nhưng theo thứ tự 1, 4, 2, 3, đỉnh 1 và 4 cùng nhận màu một, đỉnh 2 nhận màu hai, rồi đỉnh 3 kề cả hai nên phải dùng màu thứ ba."
      - show: |
          <div class="box key">Tham lam luôn dùng <b>không quá</b> $k + 1$ màu, với $k$ là bậc lớn nhất — nhưng có thể nhiều hơn số màu tối thiểu.</div>
        say: "Cách tham lam luôn dùng không quá bậc lớn nhất cộng 1 màu, vì mỗi đỉnh có không quá chừng đó hàng xóm. Nhưng nó có thể dùng nhiều hơn số màu tối thiểu, như ví dụ vừa rồi."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "4 - 6 + 4 == 2"
      - "2 - 5 + 10 == 7 and 3 * 7 == 21 and 2 * 10 == 20 and 21 > 20"
    steps:
      - show: |
          <ol><li>Đếm mặt nhớ tính <b>mặt ngoài</b>; rồi kiểm $V - E + F = 2$.</li>
          <li>Thấy $E \le 3V - 6$ <b>chưa</b> đủ kết luận phẳng — bất đẳng thức chỉ dùng để chứng minh <b>không</b> phẳng.</li>
          <li>Tô màu xong: kiểm từng cạnh, hai đầu phải khác màu.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, khi đếm mặt nhớ tính cả mặt ngoài, rồi kiểm lại công thức Euler. Hai, thấy số cạnh không vượt quá 3V trừ 6 thì chưa đủ để kết luận phẳng, vì bất đẳng thức chỉ là điều kiện cần. Ba, tô màu xong thì kiểm từng cạnh, hai đầu phải khác màu."
      - clear: true
        show: |
          <p><b>Đường khác cho $K_5$</b> — không dùng $3V - 6$, giả sử ngược lại $K_5$ phẳng (phản chứng, tức đi tới mâu thuẫn) rồi tính thẳng số mặt:</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>số mặt theo Euler</td><td>$F = 2 - 5 + 10$</td><td>7</td></tr>
          <tr><td>mỗi mặt ít nhất 3 cạnh: cần</td><td>$3F = 3 \times 7$</td><td>21 cặp</td></tr>
          <tr><td>mỗi cạnh nhiều nhất 2 mặt: có</td><td>$2E = 2 \times 10$</td><td>20 cặp</td></tr></table>
          <p>$21 \gt 20$: mâu thuẫn $\implies$ $K_5$ không phẳng ✓</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bây giờ kiểm kết luận về K năm bằng một đường khác, không dùng 3V trừ 6. Giả sử ngược lại K năm phẳng, cách này gọi là phản chứng, theo công thức Euler số mặt bằng 2 trừ 5 cộng 10, bằng 7. Vì mỗi mặt cần ít nhất 3 cạnh, ta cần ít nhất 3 nhân 7, bằng 21 cặp mặt và cạnh. Nhưng mỗi cạnh giáp nhiều nhất 2 mặt, nên chỉ có nhiều nhất 2 nhân 10, bằng 20 cặp. Hai mươi mốt lớn hơn hai mươi là mâu thuẫn, nên K năm không phẳng, khớp với kết luận trước."
  - id: quymo
    kind: example
    title: 'Khi đồ thị lớn dần: tô màu tham lam có thể phí gấp n/2 lần'
    checks:
    - '[(lambda n, order: max(__import__(''functools'').reduce(lambda mau, v: {**mau, v: min(c for c in range(2 * n) if c not in {mau[u] for u in mau if u[0] != v[0] and u[1] != v[1]})}, order, {}).values()) + 1)(n, o) for n, o in ((10, [(s, i) for i in range(10) for s in ''ab'']), (10, [(s, i) for s in ''ab'' for i in range(10)]), (100, [(s, i) for i in range(100) for s in ''ab'']))] == [10, 2, 100]'
    - '[(2 * n, n) for n in (10, 100, 1000000)] == [(20, 10), (200, 100), (2000000, 1000000)]'
    - max(sum(1 for u in range(20) if u // 2 != v // 2 and u % 2 != v % 2) for v in range(20)) + 1 == 10
    steps:
    - clear: true
      show: |
        <div class="row"><div class="col"><p><b>Thứ tự xen kẽ</b> a0, b0, a1, b1, a2, b2: <b>3 màu</b></p><svg width="440" height="350" viewBox="0 0 440 350"><line x1="110" y1="60" x2="330" y2="160" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="60" x2="330" y2="260" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="160" x2="330" y2="60" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="160" x2="330" y2="260" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="260" x2="330" y2="60" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="260" x2="330" y2="160" stroke="#6b7280" stroke-width="4"/><circle cx="110" cy="60" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><text x="110" y="70" font-size="26" text-anchor="middle">a0</text><text x="110" y="114" font-size="22" text-anchor="middle" fill="#374151">màu 0</text><circle cx="330" cy="60" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><text x="330" y="70" font-size="26" text-anchor="middle">b0</text><text x="330" y="114" font-size="22" text-anchor="middle" fill="#374151">màu 0</text><circle cx="110" cy="160" r="28" fill="#fde68a" stroke="#2563eb" stroke-width="4"/><text x="110" y="170" font-size="26" text-anchor="middle">a1</text><text x="110" y="214" font-size="22" text-anchor="middle" fill="#374151">màu 1</text><circle cx="330" cy="160" r="28" fill="#fde68a" stroke="#2563eb" stroke-width="4"/><text x="330" y="170" font-size="26" text-anchor="middle">b1</text><text x="330" y="214" font-size="22" text-anchor="middle" fill="#374151">màu 1</text><circle cx="110" cy="260" r="28" fill="#fecaca" stroke="#2563eb" stroke-width="4"/><text x="110" y="270" font-size="26" text-anchor="middle">a2</text><text x="110" y="314" font-size="22" text-anchor="middle" fill="#374151">màu 2</text><circle cx="330" cy="260" r="28" fill="#fecaca" stroke="#2563eb" stroke-width="4"/><text x="330" y="270" font-size="26" text-anchor="middle">b2</text><text x="330" y="314" font-size="22" text-anchor="middle" fill="#374151">màu 2</text></svg></div><div class="col"><p><b>Thứ tự a trước, b sau</b> a0, a1, a2, b0, b1, b2: <b>2 màu</b></p><svg width="440" height="350" viewBox="0 0 440 350"><line x1="110" y1="60" x2="330" y2="160" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="60" x2="330" y2="260" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="160" x2="330" y2="60" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="160" x2="330" y2="260" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="260" x2="330" y2="60" stroke="#6b7280" stroke-width="4"/><line x1="110" y1="260" x2="330" y2="160" stroke="#6b7280" stroke-width="4"/><circle cx="110" cy="60" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><text x="110" y="70" font-size="26" text-anchor="middle">a0</text><text x="110" y="114" font-size="22" text-anchor="middle" fill="#374151">màu 0</text><circle cx="330" cy="60" r="28" fill="#fde68a" stroke="#2563eb" stroke-width="4"/><text x="330" y="70" font-size="26" text-anchor="middle">b0</text><text x="330" y="114" font-size="22" text-anchor="middle" fill="#374151">màu 1</text><circle cx="110" cy="160" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><text x="110" y="170" font-size="26" text-anchor="middle">a1</text><text x="110" y="214" font-size="22" text-anchor="middle" fill="#374151">màu 0</text><circle cx="330" cy="160" r="28" fill="#fde68a" stroke="#2563eb" stroke-width="4"/><text x="330" y="170" font-size="26" text-anchor="middle">b1</text><text x="330" y="214" font-size="22" text-anchor="middle" fill="#374151">màu 1</text><circle cx="110" cy="260" r="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><text x="110" y="270" font-size="26" text-anchor="middle">a2</text><text x="110" y="314" font-size="22" text-anchor="middle" fill="#374151">màu 0</text><circle cx="330" cy="260" r="28" fill="#fde68a" stroke="#2563eb" stroke-width="4"/><text x="330" y="270" font-size="26" text-anchor="middle">b2</text><text x="330" y="314" font-size="22" text-anchor="middle" fill="#374151">màu 1</text></svg></div></div><p class="note">Đồ thị “vương miện” 3 cặp: $a_i$ nối $b_j$ <b>khi $i ≠ j$</b> (6 cạnh), không có cạnh nào nối hai đỉnh cùng hàng (đồ thị <b>hai phía</b>). Màu đánh số từ 0.</p>
      focus:
      - 1
      - 2
      - 2
      - '1.1'
      - '1.2'
      say: Trước khi chạy chương trình, ta vẽ đồ thị này với ba cặp đỉnh. Có hai hàng đỉnh a và b, mỗi hàng ba đỉnh đánh số từ 0 đến 2, và đỉnh a nối với đỉnh b khi chỉ số của chúng khác nhau. Không có cạnh nào nối hai đỉnh cùng hàng, nên chỉ cần 2 màu, một màu cho mỗi hàng, và đồ thị như vậy gọi là hai phía. Nhưng tô tham lam xen kẽ cho mỗi cặp a số i và b số i cùng một màu, cặp 0 màu 0, cặp 1 màu 1, cặp 2 màu 2, nên cần 3 màu. Nếu tô cả hàng a trước rồi mới tới hàng b, chỉ cần 2 màu.
    - clear: true
      show: |
        <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def so_mau(n, thu_tu): … return …</code></td><td>định nghĩa hàm so_mau nhận n và thu_tu (danh sách đỉnh theo thứ tự tô); <code>return</code> là kết quả hàm đưa ra</td><td>so_mau(10, xen_ke) đưa ra số màu đã dùng</td></tr><tr><td><code>mau = {}, mau[v] = …</code></td><td><code>{}</code> là từ điển rỗng, một bảng ghi “đỉnh → màu”; <code>mau[v] = …</code> ghi màu cho đỉnh v</td><td>mau[('a', 0)] = 0 ghi đỉnh ('a', 0) màu 0</td></tr><tr><td><code>for v in thu_tu: … v[0], v[1]</code></td><td>với mỗi đỉnh v lần lượt trong thứ tự; đỉnh là một cặp, <code>v[0]</code> là phần tử đầu (chữ a hoặc b: hàng), <code>v[1]</code> là phần tử thứ hai (chỉ số), đếm từ 0</td><td>v = ('a', 3): v[0] = 'a', v[1] = 3</td></tr><tr><td><code>{mau[u] for u in mau if u[0] != v[0] and u[1] != v[1]}</code></td><td>tập các màu <code>mau[u]</code> của mọi đỉnh u đã tô mà <code>!=</code> (khác) hàng <code>and</code> (và) khác chỉ số với v, tức u kề v</td><td>v = ('b', 1): u = ('a', 0) kề; u = ('a', 1) không kề</td></tr></table>
      focus:
      - '1.1'
      - '1.2'
      - '1.3'
      - '1.4'
      - '1.5'
      say: Chương trình tô màu dùng chín ký hiệu, ta đọc bốn cái đầu trước. Dòng đầu định nghĩa một hàm nhận n và thứ tự tô, và chữ trả về ở dòng cuối ghi kết quả hàm đưa ra. Dấu ngoặc nhọn rỗng tạo một từ điển, tức bảng ghi mỗi đỉnh với màu của nó, và dòng gán ghi màu cho đỉnh v. Vòng lặp lấy từng đỉnh theo thứ tự, mỗi đỉnh là một cặp, phần tử đầu là hàng a hoặc b, phần tử thứ hai là chỉ số, đếm từ 0. Dòng này lập tập màu của mọi đỉnh đã tô mà khác hàng và khác chỉ số với v, tức mọi đỉnh kề v.
    - clear: true
      show: |
        <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>min(c for c in range(2 * n) if c not in ke)</code></td><td>với c lần lượt 0, 1, 2, … tới 2n − 1, chỉ lấy c không thuộc tập ke (<code>not in</code> là không có trong); <code>min</code> chọn số nhỏ nhất</td><td>ke = {0, 1}: kết quả 2</td></tr><tr><td><code>max(mau.values()) + 1</code></td><td><code>mau.values()</code> là các màu đã ghi, <code>max</code> lấy màu lớn nhất; màu đánh số từ 0 nên cộng 1 ra số màu</td><td>màu lớn nhất là 2: đã dùng 3 màu</td></tr><tr><td><code>[(s, i) for i in range(n) for s in &#x27;ab&#x27;]</code></td><td>lập danh sách các cặp (s, i): vòng ngoài i từ 0 tới n − 1, vòng trong s là 'a' rồi 'b'; đảo hai vòng cho thứ tự a trước, b sau</td><td>n = 2: [('a', 0), ('b', 0), ('a', 1), ('b', 1)]</td></tr><tr><td><code>for n in (10, 100): print(2 * n, …)</code></td><td>với mỗi n lần lượt trong ngoặc; <code>2 * n</code> là số đỉnh; <code>print</code> in chữ trong dấu nháy và các giá trị ra cửa sổ</td><td>n = 10: in ra 20 dinh: xen ke 10 mau, …</td></tr></table>
      focus:
      - '1.1'
      - '1.2'
      - '1.3'
      - '1.4'
      - '1.5'
      say: Bốn ký hiệu còn lại nằm ở dòng chọn màu, dòng đếm màu và các dòng tạo thứ tự. Dòng này thử các màu từ 0 trở lên, bỏ màu đã nằm trong tập của hàng xóm, rồi chọn màu nhỏ nhất còn lại. Hàm lấy giá trị lớn nhất cho màu lớn nhất đã ghi trong từ điển, và vì màu đánh số từ 0 nên cộng 1 ra số màu đã dùng. Dòng này lập danh sách các cặp gồm chữ và chỉ số, và đổi thứ tự hai vòng thì được thứ tự a trước, b sau. Vòng lặp cho n là 10 rồi 100, số đỉnh là 2 nhân n, và hàm in đưa kết quả ra cửa sổ.
    - clear: true
      show: |
        <p><b>Chạy thật</b>: $2n$ đỉnh $a_i, b_i$; $a_i$ kề $b_j$ khi $i \ne j$ (hai phía). Tô tham lam theo hai thứ tự</p><div class="code"><div>def so_mau(n, thu_tu):</div><div>    mau = {}</div><div>    for v in thu_tu:</div><div>        ke = {mau[u] for u in mau if u[0] != v[0] and u[1] != v[1]}</div><div>        mau[v] = min(c for c in range(2 * n) if c not in ke)</div><div>    return max(mau.values()) + 1</div><div>for n in (10, 100):</div><div>    xen_ke = [(s, i) for i in range(n) for s in &#x27;ab&#x27;]</div><div>    ab = [(s, i) for s in &#x27;ab&#x27; for i in range(n)]</div><div>    print(2 * n, &#x27;dinh: xen ke&#x27;, so_mau(n, xen_ke), &#x27;mau, a truoc b sau&#x27;, so_mau(n, ab), &#x27;mau&#x27;)</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>20 dinh: xen ke 10 mau, a truoc b sau 2 mau</div><div>200 dinh: xen ke 100 mau, a truoc b sau 2 mau</div></div>
      focus:
      - 2
      - - '4.1'
        - '4.2'
      - - '4.1'
        - '4.2'
      say: Đây là chương trình chạy thật, trên đồ thị vương miện vừa vẽ nhưng với n bằng 10 và 100 cặp. Nếu đi xen kẽ a một, b một, a hai, b hai, thì với 20 đỉnh dùng 10 màu, với 200 đỉnh dùng tới 100 màu. Nếu tô hết các đỉnh a trước rồi mới tới b, chỉ cần 2 màu ở cả hai cỡ.
    - clear: true
      show: |
        <table class="t"><tr><th>số đỉnh $2n$</th><th>số màu tối thiểu</th><th>tham lam, thứ tự xen kẽ</th><th>tham lam, a trước b sau</th></tr><tr><td>20</td><td>2</td><td>10</td><td>2</td></tr><tr><td>200</td><td>2</td><td>100</td><td>2</td></tr><tr><td>2 000 000 (suy ra theo quy luật, chưa chạy)</td><td>2</td><td>1 000 000</td><td>2</td></tr></table><div class="box key">Bậc lớn nhất là $n - 1$, nên cận “bậc lớn nhất cộng 1” của bài là $n$: thứ tự xấu <b>đạt đúng cận đó</b>, phí gấp $n/2$ lần mức tối thiểu và phí tăng theo cỡ đồ thị. Đánh đổi: thứ tự tốt phải biết trước cấu trúc đồ thị, mà tìm số màu tối thiểu cho mọi đồ thị là bài toán khó.</div>
      focus:
      - 1
      - '1.3'
      - 2
      say: Bảng này cho thấy thứ tự quyết định. Số màu tối thiểu luôn là 2, nhưng thứ tự xen kẽ phí tăng theo cỡ đồ thị, gấp n chia 2 lần mức cần thiết, tức 5 lần với 20 đỉnh và 50 lần với 200 đỉnh. Đánh đổi của người làm nghề là, thứ tự tốt cần biết trước cấu trúc đồ thị, trong khi tìm số màu ít nhất cho mọi đồ thị là bài toán khó.


  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "3 * 3 == 9 and 3 * 6 - 6 == 12 and 9 <= 12"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên mặt ngoài <b class="red">(sai)</b>
          <br><span class="note">$K_4$ chỉ đếm 3 mặt trong thì ra $4 - 6 + 3 = 1$. Mặt ngoài cũng là một mặt.</span></div>
        say: "Lỗi thứ nhất, quên mặt ngoài. Nếu với K bốn chỉ đếm 3 mặt bên trong thì ra 1, sai, vì mặt ngoài cũng là một mặt."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Thoả $E \le 3V - 6$ nên kết luận phẳng <b class="red">(sai)</b>
          <br><span class="note">Đồ thị “3 nhà, 3 nguồn” (mỗi nhà nối điện, nước, ga): $V = 6$, $E = 9 \le 12$ nhưng vẫn không phẳng.</span></div>
          <table class="t"><tr><th>đồ thị</th><th>$V$</th><th>$E$</th><th>$3V - 6$</th><th>thoả?</th><th>phẳng?</th></tr>
          <tr><td>3 nhà, 3 nguồn</td><td>6</td><td>$3 \times 3 = 9$</td><td>12</td><td>có</td><td>không</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ hai, thấy đồ thị thoả bất đẳng thức rồi kết luận phẳng. Bài toán ba nhà ba nguồn, mỗi nhà nối với điện, nước, ga, có 6 đỉnh và 9 cạnh, không vượt quá 12, nhưng vẫn không phẳng. Bảng cho thấy phép thử bất đẳng thức qua được, nhưng qua được chưa có nghĩa là phẳng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Một hình vẽ có cạnh cắt nhau nên kết luận không phẳng <b class="red">(sai)</b>
          <br><span class="note">Phẳng nghĩa là <b>có một</b> cách vẽ không cắt. $K_4$ vẽ hình vuông có hai đường chéo thì cắt nhau, nhưng vẫn phẳng.</span></div>
        say: "Lỗi thứ ba, thấy một hình vẽ có cạnh cắt nhau rồi kết luận không phẳng. Phẳng nghĩa là có một cách vẽ không cắt, K bốn vẽ thành hình vuông với hai đường chéo thì cắt nhau, nhưng nó vẫn phẳng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin rằng tham lam cho số màu ít nhất <b class="red">(sai)</b>
          <br><span class="note">Tham lam phụ thuộc thứ tự. Tìm số màu ít nhất cho mọi đồ thị là một bài toán khó.</span></div>
        say: "Lỗi thứ tư, tin rằng cách tham lam cho số màu ít nhất. Kết quả phụ thuộc thứ tự, và tìm số màu ít nhất cho mọi đồ thị là một bài toán khó."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "13 > 3 * 6 - 6 == 12"
      - "2 - 8 + 12 == 6 and 8 - 12 + 6 == 2 and 3 * 6 == 18 <= 2 * 12 == 24 and 3 * 6 - 6 == 12"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Đồ thị đơn có 6 đỉnh và 13 cạnh có thể phẳng không?</td></tr>
          <tr><td>2</td><td>Đồ thị phẳng liên thông có 8 đỉnh, 12 cạnh. Có bao nhiêu mặt?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, đồ thị đơn có 6 đỉnh và 13 cạnh có thể phẳng không? Câu hai, đồ thị phẳng liên thông có 8 đỉnh và 12 cạnh thì có bao nhiêu mặt? Dừng video và làm ra giấy."
        pause: 30
      - clear: true
        show: |
          <p>① <b>Bước 1</b> — giới hạn: $3V - 6 = 3 \times 6 - 6 = 12$.</p>
          <p><b>Bước 2</b> — so sánh: $E = 13 \gt 12$, vi phạm $E \le 3V - 6$ $\implies$ <b>không</b> phẳng.</p>
        focus: [1, 2]
        say: "Đáp án câu một, bước một, tính giới hạn 3V trừ 6, bằng 3 nhân 6 trừ 6, bằng 12. Bước hai, đồ thị có 13 cạnh, lớn hơn 12, vi phạm bất đẳng thức, nên không thể phẳng."
      - show: |
          <p>② Từ $V - E + F = 2$, chuyển vế: $F = 2 - V + E = 2 - 8 + 12 = \hl{6}$ mặt. &nbsp; Kiểm: $8 - 12 + 6 = 2$ ✓; $3 \times 6 = 18 \le 2 \times 12 = 24$ ✓</p>
        say: "Câu hai, từ công thức Euler, chuyển vế để tìm số mặt, F bằng 2 trừ V cộng E, tức 2 trừ 8 cộng 12, bằng 6 mặt. Kiểm lại, 8 trừ 12 cộng 6 đúng bằng 2, và 3 nhân 6 bằng 18, không vượt quá 2 nhân 12 bằng 24."
  - id: practice
    kind: practice
    title: 'Tự làm: số mặt theo công thức Euler, giới hạn 3V − 6 và tô màu tham lam'
    steps:
    - show: |
        <p><b>Đề</b>: viết <code>phang.py</code> tính số mặt từ công thức Euler cho ba đồ thị phẳng, dùng $E \le 3V - 6$ để loại ba đồ thị, và tô màu tham lam hai thứ tự cho một đồ thị vương miện 4 cặp, 8 đỉnh, cùng một chu trình 5 đỉnh (tám dòng, định dạng ở <code>labs/DMS/L18/de.md</code>).</p><p class="note">Số liệu khác ví dụ trong bài. Đồ thị (6, 9) thoả bất đẳng thức mà vẫn không phẳng: máy chỉ nói “chưa kết luận”.</p>
      focus:
      - 1
      - 1
      - 1
      - 1
      - 2
      - 0
      pause: 420
      say: Bây giờ tới phần bạn tự làm. Hãy viết chương trình tính số mặt từ công thức Euler cho ba đồ thị phẳng. Sau đó dùng giới hạn số cạnh để loại ba đồ thị khác, và chú ý có một đồ thị thoả bất đẳng thức mà vẫn không phẳng. Cuối cùng tô màu tham lam một đồ thị vương miện bốn cặp, tám đỉnh, theo hai thứ tự, và một chu trình năm đỉnh. Tám dòng và định dạng nằm trong thư mục thực hành. Hãy dừng video và tự làm.
    - clear: true
      show: |
        <p><b>Kết quả mong đợi</b></p><div class="code"><div>V=10 E=15: F=7</div><div>V=7 E=6: F=1</div><div>V=12 E=30: F=20</div><div>V=7 E=19: khong phang</div><div>V=8 E=18: chua ket luan</div><div>V=6 E=9: chua ket luan</div><div>do thi 4 cap (8 dinh): xen ke 4 mau, a truoc b sau 2 mau</div><div>chu trinh 5 dinh: tham lam 3 mau, can tren 3</div></div><p class="note">Git Bash là cửa sổ gõ lệnh trên Windows (đi kèm Git for Windows): vào thư mục bài làm, bấm chuột phải vào chỗ trống, chọn <b>Open Git Bash here</b>. Chấm bằng Git Bash: <code>bash labs/cham.sh DMS L18 phang.py</code> — <code>bash</code> chạy một tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>DMS L18 phang.py</code> là khoá, bài và tên tệp của bạn. In <b>ĐÚNG</b> khi mọi dòng đầu ra trùng với kết quả mong đợi.</p>
      focus:
      - 2
      - 2
      - 3
      - 3
      say: 'Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng với màn hình. Muốn chấm bằng máy, gõ lệnh ở chân màn hình: nó chạy tệp chấm bài, kèm khoá học, mã bài và tên tệp của bạn. Lệnh in chữ ĐÚNG khi mọi dòng trùng, hoặc chỉ ra dòng nào khác.'
    - clear: true
      show: |
        <div class="box key"><b>Nếu kẹt:</b> $V - E + F = 2$ nên $F = 2 - V + E$. Giới hạn: $E > 3V - 6$ thì chắc chắn không phẳng; ngược lại chưa kết luận được. Tham lam: với mỗi đỉnh, lấy tập màu của các đỉnh kề đã tô, rồi chọn số nguyên không âm nhỏ nhất không thuộc tập đó. Lời giải ở <code>labs/DMS/L18/loi_giai.py</code> — chỉ mở sau khi đã thử.</div>
      say: Nếu kẹt, số mặt bằng hai trừ số đỉnh cộng số cạnh. Nếu số cạnh vượt ba lần số đỉnh trừ sáu thì đồ thị chắc chắn không phẳng, còn ngược lại thì chưa kết luận được. Với tô màu tham lam, mỗi đỉnh lấy tập màu của các đỉnh kề đã tô, rồi chọn số nhỏ nhất không thuộc tập đó. Lời giải nằm trong thư mục thực hành, và bạn chỉ nên mở sau khi đã thử.
    lab: labs/DMS/L18


  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">phẳng: có một cách vẽ không cắt</span><span class="a">→</span>
          <span class="n">$V - E + F = 2$</span><span class="a">→</span>
          <span class="n">$E \le 3V - 6$: chứng minh không phẳng</span><span class="a">→</span>
          <span class="n">tham lam: tối đa $k + 1$ màu ($k$: bậc lớn nhất)</span></div>
        say: "Tổng kết lại, đồ thị phẳng là đồ thị có một cách vẽ không cắt. Đồ thị phẳng liên thông thoả V trừ E cộng F bằng 2. Từ đó suy ra số cạnh không vượt quá 3V trừ 6, dùng để chứng minh không phẳng. Tô màu tham lam dùng tối đa bậc lớn nhất cộng 1 màu."
      - show: |
          <div class="box key"><b>Tư duy:</b> một đẳng thức đếm (như V − E + F = 2) thường cho ngay một bất đẳng thức — đủ để chứng minh “không thể” mà không cần thử mọi cách vẽ.</div>
        say: "Điều cần mang theo, một đẳng thức đếm thường cho ngay một bất đẳng thức, đủ để chứng minh điều không thể mà không cần thử mọi cách vẽ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 19): <b>xác suất rời rạc trong tin học</b> — biến chỉ báo, nghịch lý ngày sinh và va chạm băm.</p>
        forward_ref: true
        say: "Ở bài sau, bài 19, bài khép lại phần kiến thức của khoá, ta học xác suất rời rạc trong tin học, với biến chỉ báo, nghịch lý ngày sinh và va chạm băm. Hẹn gặp bạn ở bài tiếp theo."
