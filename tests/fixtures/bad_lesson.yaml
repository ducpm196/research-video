# Bài giảng CỐ TÌNH SAI để kiểm tra rằng lint bắt được từng loại lỗi. Mỗi lỗi có mã E# trong tests/test_lint.py.
id: BAD
ref_lesson_no: 3                              # E22–E23: coi như bài 3 để kiểm luật trích dẫn bài khác
series: "test"
title: "Bài lỗi"
assumes: [not_a_symbol]                       # E1: ký hiệu không tồn tại trong registry
objectives: ["x"]
asr_reviewed:
  - {sentence: "Câu không còn trong bài.", reason: "x"}   # E30: ghi chú xem xét mồ côi
scenes:
  - id: hook
    kind: hook
    title: "Mở đầu"
    steps:
      - show: "$$\\sum_{i=1}^{3} i$$"         # E2: dùng dấu tổng trước khi giải thích
        say: "Tổng là $\\sum$."               # E3: LaTeX thô trong lời đọc
      - show: "<p>a ⊥ b, $\\Omega$</p>"       # E4: ký tự unicode chưa giải thích; E10: lệnh \Omega chưa đăng ký
        say: "Vuông góc, mã 3E200000."             # E36: chuỗi hệ 16 viết liền trong lời đọc
      - show: "<p>Một.</p><p>Hai.</p><p>Ba.</p>"    # E32: 3 câu nói về khối 3 phần mà không có focus
        say: "Câu một ở đây. Câu hai ở đây. Câu ba ở đây."
      - show: "<p>$p equiv q$</p>"                  # E33: \equiv mất dấu “\” vẫn qua KaTeX
        say: "Biểu thức này rất ngắn gọn."
        set: "x"                                      # E34: khoá step lạ (gõ nhầm/thừa) bị bỏ qua lặng lẽ
      - show: "<p>Bốn.</p><p>Năm.</p>"             # E32 (ngưỡng 2026-10-27): 2 câu, khối 2 phần, thiếu focus
        say: "Câu bốn ở đây. Câu năm ở đây."
      - say: "Câu sáu nói tiếp. Câu bảy nói tiếp."  # E32: không `show`, nói tiếp về bảng nhiều khối, thiếu focus
      - show: "<p>Một.</p><p>Hai.</p>"
        focus: [1, 3]                                 # E31: khối chỉ có 2 phần, không có phần 3
        say: "Câu một ở đây. Câu hai ở đây."
      - show: "<p>Một.</p>"
        focus: [1]                                    # E31: 2 câu nhưng chỉ 1 mục focus
        say: "Câu một ở đây. Câu hai ở đây."
  - id: ex
    kind: example
    title: "Ví dụ"
    checks:
      - "Matrix([1,2]).dot(Matrix([3,4])) == 12"   # E5: phép tính sai
      - "abs(4.8111 - 4.81) < 0.01"                # E26: so hai hằng số chép tay
      - "[7, 5, 3] == [7, 5, 3]"                   # E35: hai vế giống hệt nhau — luôn đúng
    steps:
      - show: "$\\frac{1}{$"                  # E6: công thức KaTeX hỏng
        say: "Một câu rất dài để kiểm tra giới hạn ký tự của phụ đề, câu này cố tình được viết thật dài, dài hơn nhiều so với một trăm bảy mươi ký tự cho phép, để công cụ lint phải báo lỗi phụ đề tràn ra ngoài khung."  # E7
      - show: "<svg><defs><marker id='m'></marker></defs></svg>"   # E8: marker thiếu userSpaceOnUse
        say: "Hình."
  - id: f
    kind: formula
    title: "Công thức w_k (AUDIT A13)"   # E25: tiêu đề scene có ký tự LaTeX; E27: mã nội bộ
    steps:
      - show: "$\\|\\mathbf{u}\\|_2^2$"
        introduces: [vec, norm]
        say: "Độ dài bình phương, như tài liệu dòng 12."   # E29: nhắc nguồn người xem không có
      - show: "$\\|\\mathbf{u}\\|^2 = 5$"               # E12: viết lẫn ‖u‖₂ và ‖u‖ ; E13: bước '=' không nói lý do
        say: "Bằng năm."
      - show: "<p>Kết quả ✗</p>"                         # E16: ✗ hiển thị giống chữ X
        say: "Vì sai."
      - show: "$\\mathbf{u}' = 2$"                       # E15: dấu phẩy trên chưa giải thích
        say: "Vì u phẩy bằng hai, theo định lý Bay-ét."   # E28: phiên âm tên riêng gõ thẳng vào lời đọc
      - show: "<p>a ⇒ b, và $a \\implies b$</p>"       # E14: cùng ký hiệu, hai hình dạng (⇒ trong chữ, ⟹ trong công thức)
        introduces: [implies]
        say: "Vì a nên b."
      - show: "$x_{12} = 2$, $\\mathbb{R}^{\\sz{2}{3}}$, $\\mathbb{R}^{2\\times 3}$"   # E18: a₁₂ và kích thước chưa giải thích; E19: kích thước gõ \times
        introduces: [reals]
        say: "Vì vậy x một hai bằng hai."
      - show: "<p>Xem bài 99.</p>"                    # E22: bài không có trong lộ trình
        say: "Vì thế, bài 15 sẽ dùng lại kết quả này. Như bài 2."   # E22: nhắc bài sau thiếu forward_ref; E23: nhắc bài trước nói tắt
      - show: "<p>Bản đồ: bài 1–40; bài 99–100; luỹ thừa.</p>"   # E37: bản đồ bỏ sót bài 41–44; khoảng trỏ tới bài 100
        forward_ref: true
        say: "Vì vậy, bản đồ này cho thấy toàn bộ các phần của khoá."
      - show: "<p>Bài sau (bài 7): đạo hàm.</p>"     # E24: bài kế tiếp của bài 3 là bài 4 (Gram-Schmidt), không phải bài 7
        forward_ref: true
        say: "Vì vậy, bài sau học đạo hàm."           # E24: không nhắc cụm nào trong tên bài 4
  # E9: thiếu các phân cảnh bắt buộc symbol, pitfall, quiz, recap
