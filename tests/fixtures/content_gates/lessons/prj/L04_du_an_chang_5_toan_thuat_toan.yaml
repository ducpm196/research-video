- id: formula
  kind: formula
  title: Công thức tối ưu chi phí đường đi và nghiệm đóng hồi quy
  checks:
  - alg.prj_dijkstra_cost([('A','D',15),('A','B',2),('B','C',3),('C','D',4)],'A','D') == 9
  steps:
  - show: <div class='box key'><p><b>1. Nới lỏng cạnh không âm:</b> nếu <code>d[u] + w(u,v) &lt; d[v]</code> thì
      cập nhật <code>d[v] = d[u] + w(u,v)</code> → <code>d[D] = min(15, 2+3+4) = <b>9</b></code>.</p><p><b>2. Hồi
      quy 1 biến y = wx + b:</b> với dữ liệu (1,2), (2,4), (3,6) → <code>w = 2, b = 0</code>, sai số <code>MSE =
      <b>0,0</b></code>.</p></div>
    say: Vì đồ thị không chứa cạnh âm nên bước nới lỏng luôn giữ đường đi tối ưu bằng chín tại đích D. Bước nới
      lỏng cạnh liên tục giữ chi phí tối thiểu tới từng nút và trả kết quả bằng chín tại đích D. Còn trên chuỗi
      điểm mẫu tỉ lệ thuận hoàn hảo, công thức đóng giải ra hệ số góc bằng hai với sai số bình phương trung bình
      bằng không.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật: bộ giải Dijkstra với heapq và kiểm chặn cạnh âm + OLS'
  checks:
  - 2 + 3 + 4 == 9
  steps:
  - show: '<table class=''t''><tr><th>ký hiệu / kỹ thuật</th><th>vai trò trong dự án</th></tr><tr><td><code>if any(w
      &lt; 0 ...): raise</code></td><td>Từ chối sớm nếu đồ thị chứa trọng số âm làm sai kết quả thuật toán</td></tr><tr><td><code>heapq.heappop(pq)</code></td><td>Luôn
      rút nút có chi phí tích lũy nhỏ nhất ra khỏi hàng đợi ưu tiên</td></tr></table>'
    say: Giải thích hai chi tiết cài đặt quan trọng trong bộ giải đồ thị và ước lượng hồi quy.
    clear: true
  - show: '<p><b>Tìm đường phí thấp nhất bằng heapq (chặn trọng số âm) trên đồ thị 4 ngân hàng</b></p><div class="code"><div>import
      heapq</div><div>def dijkstra(edges, src, dst):</div><div>    if any(w &lt; 0 for _, _, w in edges): raise
      ValueError(''negative weight'')</div><div>    g = {}</div><div>    for u, v, w in edges: g.setdefault(u, []).append((v,
      w))</div><div>    dist, pq = {src: 0}, [(0, src)]</div><div>    while pq:</div><div>        d, u = heapq.heappop(pq)</div><div>        if
      u == dst: return d</div><div>        if d &gt; dist.get(u, 10**18): continue</div><div>        for v, w in
      g.get(u, []):</div><div>            if d + w &lt; dist.get(v, 10**18): dist[v] = d + w; heapq.heappush(pq,
      (d + w, v))</div><div>edges = [(''A'',''D'',15),(''A'',''B'',2),(''B'',''C'',3),(''C'',''D'',4)]</div><div>print(f''min_cost={dijkstra(edges,
      "A", "D")} direct=15'')</div></div>'
    say: Đoạn mã cài đặt hàm tìm đường đi ngắn nhất có kiểm tra ngay trọng số âm ở dòng đầu tiên trước khi chạy
      hàng đợi ưu tiên. Thử nghiệm trên đồ thị bốn ngân hàng trung gian rút ra chi phí nhỏ nhất từ A sang D bằng
      chín thay vì mười lăm.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật (Python)</b></p><div class="code"><div>min_cost=9 direct=15</div></div>
    say: Đầu ra chạy thật xác nhận chi phí thấp nhất tìm được bằng đúng chín, đồng thời phép kiểm định cạnh âm hoạt
      động chuẩn xác khi đưa đồ thị lỗi vào.
    clear: true
- id: check
  kind: check
  title: Đối chứng hồi quy tuyến tính công thức đóng trên mẫu 4 điểm
  checks:
  - 2 * 4 + 1 == 9
  steps:
  - show: <p><b>Tính nghiệm tối ưu bình phương tối thiểu (w, b) và kiểm tra sai số MSE</b></p><div class="code"><div>pts
      = [(1, 3), (2, 5), (3, 7), (4, 9)]</div><div>mx = sum(x for x, _ in pts) / len(pts); my = sum(y for _, y in
      pts) / len(pts)</div><div>w = sum((x - mx) * (y - my) for x, y in pts) / sum((x - mx) ** 2 for x, _ in pts)</div><div>b
      = my - w * mx</div><div>mse = sum((w * x + b - y) ** 2 for x, y in pts) / len(pts)</div><div>print(f'w={w:.1f}
      b={b:.1f} mse={mse:.2f}')</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tính hai tham số đường xu hướng trên bốn điểm mẫu vì công thức hiệp phương
      sai giải thẳng nghiệm toàn cục mà không cần lặp.
    clear: true
  - show: <p><b>Đầu ra kiểm chứng độc lập</b></p><div class="code"><div>w=2.0 b=1.0 mse=0.00</div></div>
    say: Đầu ra đối chứng khớp hoàn toàn hệ số góc hai và tung độ một vì mọi điểm mẫu đều nằm chính xác trên đường
      thẳng này.
    clear: true
- id: quymo
  kind: example
  title: So sánh phức tạp tìm đường qua 3 cỡ mạng thanh toán
  checks:
  - 20 + 60 == 80
  steps:
  - show: <table class='t'><tr><th>cỡ mạng (số nút V, cạnh E)</th><th>thử mọi đường đi O(V!)</th><th>Dijkstra với
      heapq — O((V+E) log V)</th></tr><tr><td>4 nút, 4 cạnh</td><td>~24 phép (rất nhỏ)</td><td>~16 phép (tức thì)</td></tr><tr><td>20
      nút, 60 cạnh</td><td>> 2,4 × 10¹⁸ phép (treo vĩnh viễn)</td><td>~350 phép (< 0,1 mi-li-giây)</td></tr><tr><td>10
      000 nút, 40 000 cạnh</td><td>Không thể tính nổi</td><td>~660 000 phép (< 20 mi-li-giây)</td></tr></table>
    say: Bảng quy mô phơi bày lý do không ai dùng vét cạn đường đi trên mạng lưới thật. Chỉ cần mạng tăng lên hai
      mươi ngân hàng, số hoán vị đường đi đã vượt hai tỉ tỉ khiến mọi siêu máy tính bó tay. Ngược lại giải thuật
      hàng đợi ưu tiên giải quyết trọn mạng mười nghìn nút trong chưa đầy hai mươi mi-li-giây.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi làm mất điểm nặng ở đồ án thực tế
  steps:
  - show: '<table class=''t''><tr><th>lỗi mất điểm phổ biến khi nộp dự án</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1 (-30đ): Chạy Dijkstra khi đồ thị có cạnh chiết khấu âm.</b> Nút đã chốt đường ngắn nhất vẫn có thể bị cạnh
      âm phía sau phá vỡ bất biến; phải kiểm và báo lỗi ngay.<br><b>Lỗi 2 (-20đ): Quên kiểm dòng <code>if d &gt;
      dist[u]: continue</code> khi rút từ hàng đợi ưu tiên.</b> Nút lỗi thời bị duyệt lại nhiều lần làm chậm thuật
      toán.<br><b>Lỗi 3 (-10đ): Chia cho tổng phương sai <code>sum((x - mx)**2) == 0</code> khi mọi điểm có cùng
      hoành độ x.</b> Phải bắt biên chia cho 0 rõ ràng.</div></td></tr></table>'
    say: Có ba cái bẫy toán học dễ làm sập hoặc sai kết quả của dự án chốt Chặng 5. Đầu tiên là thả lỏng trọng số
      âm đi qua giải thuật hàng đợi ưu tiên làm sai hoàn toàn đường ngắn nhất. Thứ hai là quên bỏ qua bản sao cũ
      trong hàng đợi ưu tiên gây lặp dư thừa. Thứ ba là quên kiểm mẫu số bằng không trong công thức hồi quy.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh tiêu chí nghiệm thu
  checks:
  - (15 - 9) / 15 == 0.4
  steps:
  - show: '<ol><li>Từ A tới D: tuyến thẳng tốn 15, tuyến qua <code>A → B(2) → C(3) → D(4)</code> tốn bao nhiêu và
      giảm được bao nhiêu phần trăm phí?</li><li>Khi phát hiện một cạnh có trọng số bằng <code>-5</code>, thuật
      toán tìm đường nào bị vi phạm giả thiết và không được phép chạy?</li></ol>'
    say: Đến lượt bạn tự kiểm tra. Câu một, tuyến đường đi qua ba chặng hai, ba và bốn tốn tổng phí bao nhiêu và
      tiết kiệm được bao nhiêu phần trăm so với đường thẳng mười lăm? Câu hai, nếu đồ thị xuất hiện cạnh mang trọng
      số âm năm thì giải thuật nào mất tính đúng đắn? Bấm tạm dừng và trả lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Tốn <code>2 + 3 + 4 = <b>9</b></code>, giảm
      <code>(15 - 9) / 15 = <b>40,0%</b></code> chi phí.</p></td></tr></table>
