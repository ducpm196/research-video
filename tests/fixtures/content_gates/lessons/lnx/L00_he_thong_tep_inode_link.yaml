- id: intuition
  kind: intuition
  title: 'Sơ đồ hai cách trỏ tới dữ liệu: cùng i-nốt vs qua tên tệp'
  steps:
  - show: '<div><svg width="960" height="215" viewBox="0 0 960 215"><rect x="40" y="22" width="240" height="68"
      rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="160.0" y="52" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">hard.txt (Tên A)</text><text x="160.0" y="72" font-size="15" text-anchor="middle"
      fill="#475569">Trỏ thẳng i-nốt #1001</text><line x1="280" y1="56" x2="390" y2="56" stroke="#475569" stroke-width="2"/><polygon
      points="390,56 382.0,61.0 382.0,51.0" fill="#475569"/><text x="335" y="48" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">nlinks=2</text><rect x="390" y="22" width="260" height="68" rx="10" fill="#fef3c7"
      stroke="#d97706" stroke-width="2"/><text x="520.0" y="52" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">i-nốt #1001 (Dữ liệu thật)</text><text x="520.0" y="72" font-size="15" text-anchor="middle"
      fill="#475569">Nội dung + quyền + kích thước</text><rect x="40" y="124" width="240" height="68" rx="10" fill="#dcfce7"
      stroke="#16a34a" stroke-width="2"/><text x="160.0" y="154" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">orig.txt (Tên B)</text><text x="160.0" y="174" font-size="15" text-anchor="middle" fill="#475569">Cùng
      trỏ i-nốt #1001</text><line x1="630" y1="158" x2="280" y2="158" stroke="#475569" stroke-width="2"/><polygon
      points="280,158 288.0,153.0 288.0,163.0" fill="#475569"/><text x="455" y="150" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">trỏ tên → đứt khi xoá orig</text><rect x="630" y="124" width="290" height="68"
      rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="775.0" y="154" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">sym.txt (Liên kết mềm)</text><text x="775.0" y="174" font-size="15" text-anchor="middle"
      fill="#475569">Lưu chuỗi tên ''orig.txt'' (#1002)</text></svg></div>'
    say: Nhìn sơ đồ so sánh hai cơ chế liên kết trên hệ thống tệp. Cả hai tên tệp cứng nằm bên trái đều trỏ trực
      tiếp vào chung khối mô tả i-nốt một nghìn không trăm linh một nên bộ đếm liên kết bằng hai. Trong khi đó liên
      kết mềm ở bên phải là một tệp nhỏ mang mã i-nốt riêng chỉ ghi mỗi dòng chữ tên tệp gốc. Vì thế khi xoá tên
      tệp gốc, dữ liệu vẫn còn nguyên cho liên kết cứng, còn liên kết mềm trở thành đường dẫn đứt đoạn.
    clear: true
- id: formula
  kind: formula
  title: Quy tắc thu hồi dữ liệu của nhân Linux
  checks:
  - (2 - 1) >= 1
  steps:
  - show: '<div class=''box key''><p><b>Quy tắc giải phóng ổ đĩa chuẩn POSIX:</b></p><p>Dữ liệu trên ổ đĩa chỉ bị
      thu hồi khi <b>cả hai điều kiện</b> cùng đạt 0: bộ đếm tên tệp <code>link_count == 0</code> <b>và</b> không
      còn tiến trình nào mở tệp.</p><p>Ví dụ: ban đầu <code>link_count = 2</code>; sau khi <code>rm orig.txt</code>,
      <code>link_count = 1 &gt; 0</code> nên dữ liệu giữ nguyên 100%.</p></div>'
    say: Quy tắc thu hồi dữ liệu rất nhất quán trên mọi máy chủ Li-núc. Nhân hệ điều hành chỉ đánh dấu thu hồi các
      khối dữ liệu khi bộ đếm liên kết giảm về không và không còn tiến trình nào đang mở tệp đó. Vì thế với hai
      tên tệp cứng ban đầu, khi xoá một tên thì bộ đếm vẫn bằng một lớn hơn không nên dữ liệu còn nguyên vẹn.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
