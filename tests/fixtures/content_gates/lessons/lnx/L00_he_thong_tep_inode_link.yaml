  - (2 - 1) >= 1
  steps:
  - show: '<table class=''t''><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>stat -c ''%i
      %h''</code></td><td>In ra đúng hai con số: mã số i-nốt và số liên kết trỏ tới nó (chuẩn POSIX = bộ quy ước
      chung Unix/Linux)</td></tr><tr><td><code>ln orig.txt hard.txt</code></td><td>Tạo liên kết cứng dùng chung
      i-nốt với tệp gốc</td></tr><tr><td><code>ln -s orig.txt sym.txt</code></td><td>Tạo liên kết mềm trỏ gián tiếp
      theo tên đường dẫn</td></tr><tr><td><code>MSYS_NO_PATHCONV=1</code></td><td>Biến môi trường Git Bash Windows
      cấm tự đổi đường dẫn Linux <code>/tmp</code></td></tr></table>'
    say: Trước khi xem kết quả chạy thật trên nhân Li-núc thật, ta giải mã bốn quy ước quan trọng. Hai lệnh đầu
      tạo hai kiểu liên kết, lệnh sau đọc mã i-nốt, và cờ môi trường giữ nguyên đường dẫn trên máy.
    focus:
    - '1.2'
    - '1.3'
    clear: true
  - show: '<p><b>Kiểm chứng thật trong container Alpine Linux về i-nốt và bộ đếm liên kết</b></p><div class="code"><div>MSYS_NO_PATHCONV=1
      docker run --rm postgres:17-alpine sh -c ''</div><div>  cd /tmp &amp;&amp; printf "hello_linux\n" &gt; orig.txt</div><div>  ln
      orig.txt hard.txt &amp;&amp; ln -s orig.txt sym.txt</div><div>  o=<span>&#36;</span>(stat -c %i:%h orig.txt)
      h=<span>&#36;</span>(stat -c %i:%h hard.txt)</div><div>  s=<span>&#36;</span>(stat -c %i:%h sym.txt); echo
      "before: <span>&#36;</span>o | <span>&#36;</span>h | <span>&#36;</span>s"</div><div>  rm orig.txt</div><div>  echo
      "hard_cat=<span>&#36;</span>(cat hard.txt) nlinks=<span>&#36;</span>(stat -c %h hard.txt)"</div><div>  cat
      sym.txt &gt;/dev/null 2&gt;&amp;1; echo "sym_rc=<span>&#36;</span>?"</div><div>  ls -d /etc /var /tmp /proc
      | tr "\n" " "</div><div>  echo ""</div><div>''</div></div>'
    say: Ta chạy trực tiếp một công-tai-nơ An-pin Li-núc thật để chứng minh hoạt động của bộ đếm liên kết và thư
      mục gốc. Kịch bản tạo một tệp văn bản, gắn thêm một liên kết cứng và một liên kết mềm, rồi xoá tệp nguồn và
      đo lại hai liên kết đó.
    focus:
    - 1
    - 2
    clear: true
  - show: '<p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>before: 258026:2 | 258026:2
      | 258033:1</div><div>hard_cat=hello_linux nlinks=1</div><div>sym_rc=1</div><div>/etc /proc /tmp /var </div></div>'
    say: Đầu ra thật xác nhận liên kết cứng và tệp gốc giữ cùng mã số i-nốt với bộ đếm bằng hai. Sau khi xoá tệp
      nguồn, liên kết cứng vẫn đọc trọn vẹn chuỗi dữ liệu còn liên kết mềm trả mã thoát một báo lỗi không tìm thấy
      tệp.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Đối chứng cục bộ: tạo liên kết cứng rồi xoá bản đầu'
  checks:
  - (2 - 1) >= 1
  steps:
  - show: '<p><b>Tạo liên kết cứng và kiểm tra cùng i-nốt trước khi xoá tên đầu</b></p><div class="code"><div>mkdir
      -p test_ln &amp;&amp; cd test_ln</div><div>printf ''data_v1\n'' &gt; a.txt</div><div>ln a.txt b.txt</div><div>inode_a=<span>&#36;</span>(stat
      -c ''%i'' a.txt)</div><div>inode_b=<span>&#36;</span>(stat -c ''%i'' b.txt)</div><div>rm a.txt</div><div>echo
      "same_inode=<span>&#36;</span>((inode_a == inode_b ? 1 : 0)) after_rm_read=<span>&#36;</span>(cat b.txt)"</div></div>'
    say: Ở đường kiểm chứng thứ hai, ta chạy thẳng trên tệp cục bộ để đối chiếu mã số i-nốt trước và sau khi xoá
      tên đầu tiên. Vì cả hai tên cùng nắm giữ một nút chỉ mục nên phép so sánh hai mã số bắt buộc bằng nhau.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>same_inode=1 after_rm_read=data_v1</div></div>
    say: Đầu ra thật trả về cờ cùng i-nốt bằng một và đọc lại nguyên vẹn giá trị dữ liệu, vì việc xoá một tên tệp
      chỉ giảm bộ đếm liên kết từ hai xuống một.
    clear: true
- id: quymo
  kind: example
  title: Ảnh hưởng của liên kết và hệ thống tệp ảo qua ba quy mô dự án
  checks:
  - 100 * 20 == 2000
  steps:
  - show: <table class='t'><tr><th>tình huống</th><th>dữ liệu sao lưu / lưu trữ</th><th>khác biệt khi dùng liên
      kết cứng</th></tr><tr><td>Dự án nhỏ (10 bản sao)</td><td>10 × 10 MB = 100 MB trùng lặp</td><td>Dùng 10 MB
      thật nhờ trỏ chung i-nốt (tiết kiệm 90%)</td></tr><tr><td>Dịch vụ vừa (100 tệp gói)</td><td>100 × 20 MB =
      2 000 MB</td><td>Kho gói toàn cầu giữ 1 bản 20 MB (giảm 99% đĩa)</td></tr><tr><td>Lịch sử lớn (1 000 ảnh chụp)</td><td>1
      000 × 50 MB = 50 GB</td><td>Chỉ tốn dung lượng cho phần tệp mới thay đổi</td></tr></table>
    say: Bảng quy mô giải thích vì sao các trình quản lý gói hiện đại và công cụ sao lưu gia tăng đều tận dụng liên
      kết cứng. Khi mười bản dự án cần cùng bộ thư viện mười mê-ga-bai, liên kết cứng giữ chỉ một bản duy nhất trên
      đĩa giúp tiết kiệm chín mươi phần trăm dung lượng. Lên tới quy mô một trăm đến một nghìn ảnh chụp, cách làm
      này giảm hàng chục gi-ga-bai sao chép thừa thãi.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: Nhầm liên kết mềm giống hệt liên kết cứng.</b> Khi tệp gốc đổi tên hoặc chuyển thư mục, mọi liên kết mềm
      trỏ tới nó lập tức hỏng.<br><b>Lỗi 2: Tạo liên kết cứng xuyên khác phân vùng đĩa.</b> Mỗi phân vùng đánh số
      i-nốt riêng nên liên kết cứng không vượt ranh giới phân vùng.<br><b>Lỗi 3: Chỉnh sửa cấu hình trong thư mục
      ảo /proc như tệp đĩa thường.</b> Các tệp trong đó là cửa sổ trực tiếp vào bộ nhớ nhân đang chạy.</div></td></tr></table>'
    say: Hãy tránh ba lỗi rất phổ biến khi thao tác cây thư mục Li-núc. Lỗi đầu là nhầm liên kết mềm bền vững như
      liên kết cứng khiến cấu hình đứt gãy ngay khi dời thư mục gốc. Lỗi thứ hai là cố tạo liên kết cứng băng qua
      hai phân vùng ổ đĩa độc lập dù bảng mã i-nốt nằm riêng từng phân vùng. Lỗi thứ ba là tưởng thư mục hệ thống
      tiến trình ảo giống tệp văn bản thông thường.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - (2 - 1) >= 1
  steps:
  - show: <ol><li>Ban đầu tệp A có <code>link_count = 2</code> do đã liên kết cứng với B. Nếu chạy <code>rm A</code>,
      dữ liệu có bị mất không?</li><li>Thư mục gốc nào chứa thông tin các tiến trình đang chạy trong bộ nhớ nhân?</li></ol>
    say: Đến lượt bạn tự kiểm tra kiến thức vừa học. Câu một, một tệp có hai tên liên kết cứng với nhau rồi xoá
      mất một tên thì dữ liệu có còn hay không? Câu hai, thư mục gốc nào hiển thị thông tin các tiến trình đang
      chạy trực tiếp từ nhân hệ điều hành? Hãy bấm tạm dừng và trả lời ra giấy.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Không mất, vì sau khi xoá A thì <code>link_count
      = 1 &gt; 0</code> nên B vẫn đọc đầy đủ dữ liệu.</p></td></tr></table>
    say: 'Đáp án câu một: dữ liệu không hề bị mất vì bộ đếm liên kết vẫn còn bằng một nên tên thứ hai tiếp tục đọc
      trọn vẹn.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Thư mục ảo <code>/proc</code> (mỗi thư mục
      con mang số PID của một tiến trình đang chạy).</p></td></tr></table>
    say: 'Đáp án câu hai: đó là thư mục ảo hệ thống tiến trình, nơi chứa từng thư mục đánh số theo mã tiến trình
      đang hoạt động.'
    clear: true
