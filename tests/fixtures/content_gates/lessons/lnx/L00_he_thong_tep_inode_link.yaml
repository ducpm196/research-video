    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Bài sau (bài 1):</b> Người dùng, nhóm và phân quyền bát phân theo chữ số</div>
    say: Bài tiếp theo là bài 1, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau.
