scenes:
- id: hook
  kind: hook
  title: 'Xoá tệp nguồn: vì sao một liên kết sống, một liên kết hỏng?'
  checks:
  - 2 - 1 == 1
  steps:
  - show: '<div class=''box key''><p>Trên Linux, một người tạo hai tệp cùng trỏ về dữ liệu <code>orig.txt</code>
      rồi xoá <code>orig.txt</code>.</p><p>Kết quả: <b>liên kết cứng</b> đọc trọn vẹn nội dung vì trỏ thẳng tới
      nút dữ liệu gốc; <b>liên kết mềm</b> hỏng ngay lập tức.</p></div>'
    say: Chào bạn đến với khoá Li-núc và công-tai-nơ thực chiến. Nhiều bạn rất ngạc nhiên khi thấy hai tệp cùng
      trỏ tới một nội dung nhưng lúc xoá tệp đầu thì tệp này còn nguyên còn tệp kia lại hỏng mất. Nguyên nhân nằm
      ở cách hệ điều hành tách biệt tên tệp trong thư mục với nút mô tả dữ liệu nằm trên ổ đĩa. Hôm nay ta học cấu
      trúc thư mục gốc, hệ thống tệp ảo tiến trình và hai loại liên kết này.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
  - show: <table class='t'><tr><th>phần</th><th>lộ trình mười bài từ bài 0 tới bài 9</th></tr><tr><td>Bài 0–2</td><td>Hệ
      thống tệp Linux, liên kết dữ liệu, phân quyền tệp và điều khiển tiến trình</td></tr><tr><td>Bài 3–6</td><td>Luồng
      chuẩn lọc nhật ký, hạn mức đĩa, cổng mạng và khoá bảo mật</td></tr><tr><td>Bài 7–9</td><td>Cô lập không gian
      chạy, ổ gắn bền vững và cụm nhiều dịch vụ</td></tr></table>
    say: Khoá này gồm mười bài thực chiến từ bài 0 đến bài 9. Ba bài đầu đào sâu hệ thống tệp, phân quyền bát phân
      và tín hiệu tiến trình. Bốn bài giữa luyện lọc nhật ký, hạn mức đĩa, cổng mạng và bảo mật bí mật. Ba bài từ
      bài 7 đến bài 9 làm chủ cơ chế cô lập nhân và dựng cụm dịch vụ nhiều container.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    forward_ref: true
