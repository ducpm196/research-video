      bản. Thứ nhất là thói quen chạy lệnh kiểm tra tệp và đối chiếu mã thoát sau mỗi thao tác. Thứ hai là phân
      biệt rạch ròi đường dẫn tuyệt đối bắt đầu từ gốc với đường dẫn tương đối.
