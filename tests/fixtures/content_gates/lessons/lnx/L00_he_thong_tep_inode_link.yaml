- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>Tên tệp → i-nốt</span><span class=''a''>|</span><span class=''n''>Cứng:
      chung i-nốt</span><span class=''a''>|</span><span class=''n''>Mềm: lưu đường dẫn</span></div>'
    say: Tổng kết chuỗi tư duy cốt lõi về hệ thống tệp Li-núc. Mỗi tệp giữ dữ liệu qua mã i-nốt duy nhất và chỉ
      giải phóng khi bộ đếm liên kết cùng số tiến trình đang mở cùng chạm không. Nắm vững cây thư mục gốc và phân
      biệt hai loại liên kết giúp bạn tự tin quản trị mọi máy chủ sau này.
