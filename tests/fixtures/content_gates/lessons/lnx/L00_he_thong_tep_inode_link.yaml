      A B</code></td><td>Tạo liên kết cứng B dùng chung số nút chỉ mục với A (nlinks tăng +1)</td></tr><tr><td><code>ln
      -s A C</code></td><td>Tạo liên kết mềm C chỉ lưu chuỗi đường dẫn trỏ sang tên tệp A</td></tr><tr><td><code>/etc
      /var /tmp /proc</code></td><td>Thư mục cấu hình tĩnh, nhật ký biến đổi, tệp tạm và thông số nhân đang chạy</td></tr></table>
    say: Bảng này giải mã bốn thành phần trọng tâm giúp bạn đọc hiểu toàn bộ hệ thống tệp Li-núc. Mỗi tệp thực chất
      được đại diện bởi một nút chỉ mục mang mã số duy nhất trên phân vùng đĩa gọi là i-nốt. Liên kết cứng tạo thêm
      tên mới bám chung vào i-nốt đó nên bộ đếm tăng một, còn liên kết mềm chỉ giữ tên đường dẫn. Bên dưới là bốn
