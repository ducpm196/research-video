scenes:
- id: hook
  kind: hook
  title: Gọi localhost trong container 200 OK, bên ngoài lỗi?
  checks:
  - 127 != 0
  steps:
  - show: '<div class=''box key''><p>Bạn khởi chạy dịch vụ web trên cổng <code>8080</code> rồi cấu hình chuyển cổng
      container, nhưng trình duyệt ngoài cứ báo <b>connection refused</b>.</p><p>Thủ phạm kinh điển: máy chủ bên
      trong chỉ lắng nghe trên giao diện vòng lặp nội bộ <code>127.0.0.1</code> thay vì <code>0.0.0.0</code>.</p></div>'
    say: Chào bạn, lỗi từ chối kết nối dù máy chủ bên trong vẫn báo chạy xanh mượt là tình huống khiến hàng loạt
      người mới bối rối khi đóng gói ứng dụng. Khi bạn kiểm tra ngay bên trong máy ảo hoặc công-tai-nơ thì phản
      hồi vẫn đạt hai trăm bình thường, nhưng hễ gọi từ bên ngoài qua cổng chuyển tiếp là bị cắt ngay. Hôm nay ta
      học cách phân biệt hai địa chỉ lắng nghe cốt lõi, thứ tự phân giải tên miền và cách dùng công cụ dòng lệnh
      chẩn đoán mạng Li-núc.
    focus:
    - 0
    - '1.1'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>liên kết với mạng máy chủ</th></tr><tr><td>Chuyển hướng
      kiểm tra lỗi ở luồng chuẩn (L03)</td><td>Bắt trọn mã lỗi và thông báo khi thử kết nối mạng</td></tr><tr><td>Tín
      hiệu dừng dịch vụ đúng cách (L02)</td><td>Giải phóng cổng TCP đang chiếm sau khi tắt máy chủ</td></tr></table>
    say: Trước khi soi cổng mạng đang mở, ta nối lại hai thói quen từ bài trước. Thứ nhất là quan sát cả thông báo
      lỗi lẫn mã thoát khi câu lệnh gọi mạng thất bại. Thứ hai là dừng đúng dịch vụ đang giữ cổng trước khi khởi
      chạy bản mới để tránh xung đột.
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và lệnh mới
  steps:
  - show: '<table class=''t''><tr><th>địa chỉ / tệp / lệnh</th><th>vai trò khi kết nối mạng</th></tr><tr><td><code>127.0.0.1</code></td><td>Giao
      diện vòng lặp cục bộ: chỉ tiếp nhận kết nối phát sinh từ cùng máy đó</td></tr><tr><td><code>0.0.0.0</code></td><td>Nghe
      trên mọi giao diện mạng: cho phép lưu lượng từ mạng ngoài đi vào cổng</td></tr><tr><td><code>/etc/hosts</code></td><td>Bảng
      ánh xạ tên miền sang địa chỉ IP được hệ thống tra CỨU TRƯỚC DNS</td></tr></table>'
    say: Bảng này giải mã ba quy ước mạng quan trọng nhất trên hệ điều hành Li-núc. Địa chỉ một hai bảy chấm không
      chấm không chấm một chỉ lắng nghe nội bộ bên trong chính máy hoặc công-tai-nơ đó. Ngược lại, địa chỉ không
      chấm không chấm không chấm không mở cửa đón kết nối trên mọi giao diện mạng. Còn tệp bản đồ máy chủ cục bộ
      luôn được kiểm tra trước khi hỏi máy chủ phân giải tên miền.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
