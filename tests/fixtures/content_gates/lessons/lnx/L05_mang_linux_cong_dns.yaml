    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Kiểm tra tệp <b><code>/etc/hosts</code></b>
      trước, không thấy tên đó mới hỏi tới máy chủ DNS.</p></td></tr></table>
    say: 'Đáp án câu hai: tệp ánh xạ cục bộ luôn được tra cứu trước, chỉ khi không khớp mới gửi câu hỏi ra máy chủ
      tên miền.'
