    focus:
    - '2.1'
    - '2.2'
    - '2.3'
    - '2.4'
    clear: true
    say: Tiến trình một ghi được, dấu mới là tám. Tiến trình hai bị từ chối vì dấu
      lệch. Lần hai, sau khi đọc lại, tiến trình hai ghi được, dấu là chín. Hồ sơ
      cuối cùng có một trăm tám mươi điểm, không mất cập nhật nào.
  - show: '<p><b>Bước 6.</b> Bản ghi phiên đăng nhập cần tự hết hạn, nên đặt hạn sống
      tính bằng giây khi ghi:</p>

      $$\text{tạo lúc 9:00:00} + 1\,800 \text{ giây} = \text{9:30:00}$$

      <span class=''note''>Số minh hoạ. Mỗi lần ghi lại bản ghi phải đặt lại hạn sống:
      ghi mà không đặt thì hạn sống về 0 (không bao giờ hết hạn), trừ khi dùng <code>preserve_expiry</code>
      hoặc thùng dữ liệu có hạn sống tối đa (<code>maxTTL</code>).</span>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước sáu, vì phiên đăng nhập phải tự hết hiệu lực, nên khi ghi bản ghi phiên
