      chấp nặng thì tải ghi lên kho tăng theo bình phương</td><td>ít tiến trình cùng
      sửa một bản ghi</td></tr><tr><td>khoá bi quan ngắn có thời hạn</td><td>tải ghi
      tăng thẳng theo n, không ghi thừa</td><td>người sau phải chờ; giữ lâu thì nghẽn,
