      lấy dư vẫn là 15 258.</p>

      $$15\,258 - 14 \cdot 1\,024 = 15\,258 - 14\,336 = \hlg{922}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một. Một tỉ chia nguyên cho sáu mươi lăm nghìn năm trăm ba mươi
      sáu được mười lăm nghìn hai trăm năm mươi tám, nhỏ hơn ba mươi hai nghìn bảy
      trăm sáu mươi tám. Lấy dư cho một nghìn không trăm hai mươi tư thì còn chín
