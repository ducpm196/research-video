      cuối chờ n lần thời gian giữ khoá, hai trăm tiến trình chờ hai trăm mili giây.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>CAS,
