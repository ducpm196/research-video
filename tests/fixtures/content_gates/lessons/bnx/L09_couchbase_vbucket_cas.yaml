      ghi xong</td></tr><tr><td><code>[s.get() for _ in range(chua)]</code></td><td>viết
      gọn: gọi <code>s.get()</code> đúng <code>chua</code> lần, gom kết quả vào danh
      sách; <code>_</code> là tên biến bỏ đi, không dùng giá trị</td></tr><tr><td><code>for
      d, cas in bo:</code></td><td>duyệt từng cặp (nội dung, dấu) trong danh sách
      <code>bo</code></td></tr><tr><td><code>….startswith("từ")</code></td><td>chuỗi
      bắt đầu bằng chữ <code>từ</code>, tức bị từ chối</td></tr></table>'
    clear: true
    say: Khối đếm dùng thêm vài cách viết, nên ta giải nghĩa trước. Vòng lặp chạy
      khi còn tiến trình chưa ghi xong, cách viết gọn gọi hàm đọc nhiều lần, và dấu
      gạch dưới là tên biến bỏ đi.
  - show: '<p><b>Đếm trên chính lớp Store của bài (kho mô phỏng, không phải Couchbase
      thật): trường hợp xấu nhất, n tiến trình cùng đọc rồi cùng ghi, thử lại ngay,
      không lùi</b></p><div class="code"><div>for n in (2, 20, 200):</div><div>    s,
      chua, lan = Store(), n, 0</div><div>    s.doc["diem_thuong"] = 0</div><div>    while
      chua:</div><div>        bo = [s.get() for _ in range(chua)]    # cùng đọc</div><div>        chua
      = 0</div><div>        for d, cas in bo:</div><div>            d["diem_thuong"]
      += 1</div><div>            lan += 1</div><div>            if s.replace(d, cas).startswith("từ"):</div><div>                chua
      += 1</div><div>    print(n, "tien trinh:", lan, "lan ghi, diem", s.doc["diem_thuong"])</div></div>'
    focus:
    - 2
    - 2
    - '2.9'
    clear: true
    say: 'Ta đếm bằng chính lớp kho mô phỏng, không phải kho thật. Đó là trường hợp
      xấu nhất: n tiến trình cùng đọc rồi cùng ghi, bị từ chối thì thử lại ngay. Mỗi
      vòng chỉ một tiến trình ghi khớp, những tiến trình còn lại sang vòng sau.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>2 tien trinh: 3 lan
      ghi, diem 2</div><div>20 tien trinh: 210 lan ghi, diem 20</div><div>200 tien
      trinh: 20100 lan ghi, diem 200</div></div><p class="note">Trường hợp xấu nhất
      (đồng bộ, thử lại ngay, không lùi): cộng đúng n lần, không mất cập nhật nào,
