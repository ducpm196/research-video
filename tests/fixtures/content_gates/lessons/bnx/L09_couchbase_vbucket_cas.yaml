- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: thử mọi thứ tự đọc và ghi'
  checks:
  - alg.bnx_interleavings(True) == (6, [180])
  - alg.bnx_interleavings(False) == (6, [130, 150, 180])
  steps:
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>def
      f(order, cas_on): … return v</code></td><td>định nghĩa hàm nhận hai đầu vào;
      <code>return</code> trả kết quả <code>v</code> ra</td></tr><tr><td><code>from
      itertools import permutations</code></td><td>nạp hàm <code>permutations</code>,
      liệt kê mọi cách xếp thứ tự</td></tr><tr><td><code>a; continue</code></td><td>dấu
      <code>;</code> đặt hai lệnh trên một dòng; <code>continue</code> bỏ qua phần
      còn lại của vòng lặp này, sang vòng kế tiếp</td></tr><tr><td><code>x = a if
      điều_kiện else b</code></td><td><code>x</code> lấy <code>a</code> nếu điều kiện
      đúng, không thì lấy <code>b</code></td></tr><tr><td><code>p not in rd</code></td><td><code>p</code>
      chưa có trong từ điển <code>rd</code></td></tr></table>'
    clear: true
    say: Hàm kiểm dùng thêm vài cách viết, nên ta giải nghĩa trước. Một dòng nạp hàm
      liệt kê mọi thứ tự. Hàm nhận đầu vào rồi trả kết quả ra. Dấu chấm phẩy đặt hai
      lệnh một dòng, lệnh bỏ qua chuyển sang vòng lặp kế tiếp, và cách viết chọn một
      trong hai giá trị tuỳ điều kiện.
  - show: '<p><b>Đường khác: liệt kê mọi thứ tự của 4 sự kiện</b></p><div class="code"><div>from
      itertools import permutations</div><div>def f(order, cas_on):</div><div>    v,
      ver, rd, add = 100, 7, {}, {"P1": 50, "P2": 30}</div><div>    for p in order:</div><div>        if
      p not in rd:                    # lần đầu: đọc</div><div>            rd[p] =
      (v, ver); continue</div><div>        old = rd[p][0] if not cas_on or rd[p][1]
      == ver else v</div><div>        v, ver = old + add[p], ver + 1     # ghi (lệch
      CAS: đọc lại)</div><div>    return v</div><div>od = set(permutations(["P1",
      "P1", "P2", "P2"]))</div><div>for c in (True, False):</div><div>    print(len(od),
      "thứ tự, CAS", c, sorted({f(o, c) for o in od}))</div></div><p class="note"><code>permutations([…])</code>:
      mọi cách xếp thứ tự các phần tử; <code>{f(o, c) for o in od}</code>: tập các
      kết quả, mỗi kết quả chỉ ghi một lần.</p>'
    focus:
    - 2
    clear: true
    say: Vì một kịch bản chưa đủ, ta liệt kê mọi thứ tự của bốn sự kiện, mỗi tiến
