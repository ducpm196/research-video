      chối thì nó đọc lại, cộng ba mươi vào giá trị mới, rồi ghi lần hai.
  - show: '<p><b>Bước 5. Kết quả chạy thật</b></p><div class="code"><div>P1: ghi được,
      CAS mới = 8</div><div>P2: từ chối: CAS lệch</div><div>P2 lần 2: ghi được, CAS
