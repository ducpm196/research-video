      <li>P1 ghi; P2 ghi (bị từ chối); P2 đọc lại, trừ 50 lần nữa rồi ghi lần hai;
      in giá trị và CAS cuối</li></ol>

      <p class="note">Số liệu khác ví dụ trong bài; chữ in ra phải đúng từng ký tự
      như kết quả mong đợi.</p>

      '
