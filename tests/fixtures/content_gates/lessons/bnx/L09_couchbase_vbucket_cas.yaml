scenes:
- id: hook
  kind: hook
  title: Vì sao cộng điểm thưởng hai lần mà chỉ thấy một lần?
  checks:
  - alg.bnx_cas_story(use_cas=False)[0] == 130
  - alg.bnx_cas_story()[0] == 100 + 50 + 30 == 180
  steps:
  - show: '<p>Hồ sơ khách hàng C1001 có $100$ điểm thưởng. Cùng một lúc, dịch vụ khuyến
      mãi cộng $50$ điểm, dịch vụ hoàn tiền cộng $30$ điểm (số minh hoạ).</p>

      <p>Mong đợi: $100 + 50 + 30 = 180$. Hồ sơ ghi: <b class="red">130</b>.</p>

      <div class="box key">Cả hai cùng đọc 100, mỗi bên tự cộng rồi ghi đè. Lần ghi
      sau xoá mất 50 điểm của lần ghi trước: <b>mất cập nhật</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Chào bạn, hồ sơ khách hàng C một nghìn không trăm linh một có một trăm điểm
      thưởng. Cùng một lúc, dịch vụ khuyến mãi cộng năm mươi điểm, dịch vụ hoàn tiền
      cộng ba mươi điểm, đây là số minh hoạ. Ta mong đợi một trăm tám mươi, nhưng
      hồ sơ chỉ ghi một trăm ba mươi. Cả hai cùng đọc một trăm, mỗi bên tự cộng rồi
      ghi đè, nên lần ghi sau xoá mất năm mươi điểm của lần ghi trước, gọi là mất
      cập nhật.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>lưu
      hồ sơ khách hàng thế nào để lấy ra nhanh</td><td>khoá bản ghi <code>customer::C1001</code></td></tr><tr><td>khoá
      nằm ở máy nào trong cụm (nhóm máy)</td><td>thùng ảo (vBucket) = băm khoá, rồi
      tra bản đồ cụm</td></tr><tr><td>làm sao không mất 50 điểm</td><td>dấu phiên
      bản CAS: ghi kèm dấu đã đọc, lệch thì bị từ chối</td></tr><tr><td>phiên đăng
      nhập tự hết hạn thế nào</td><td>hạn sống (TTL) tính bằng giây</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    introduces:
    - bnx_cas
    - bnx_vbucket
    say: Hôm nay ta trả lời bốn câu hỏi. Lưu hồ sơ để lấy ra nhanh thì thiết kế khoá
      bản ghi. Khoá nằm ở máy nào trong cụm, tức nhóm máy chạy chung kho, thì băm
      vào một thùng ảo rồi tra bản đồ cụm. Để không mất năm mươi điểm thì ghi kèm
      dấu phiên bản. Phiên đăng nhập tự hết hạn nhờ hạn sống tính bằng giây.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 100 + 50 == 150 and alg.bnx_cas_story(use_cas=False)[0] == 130
  - alg.bnx_cas_story(use_cas=False)[0] != alg.bnx_cas_story()[0]
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Kho khoá → giá trị</td><td>đưa khoá, nhận lại đúng một giá trị, không phải quét</td><td>khoá
      <code>so_du:TK-1001</code></td></tr><tr><td>② Băm rồi chia dư</td><td>cùng khoá
      luôn ra cùng số; số dư khi chia chọn ngăn</td><td>17 chia 3 dư 2</td></tr><tr><td>③
      Mất cập nhật</td><td>hai bên (hai <b>tiến trình</b>: hai chương trình đang chạy
      cùng lúc) đọc cùng giá trị cũ, cùng ghi; lần ghi sau xoá lần ghi trước</td><td>100
      → 150 rồi bị ghi đè thành 130</td></tr><tr><td>④ Hạn sống của khoá</td><td>mục
      tự biến mất sau một số giây</td><td>hạn 60 giây</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: 'Trước hết ta cần hiểu bốn điều. Kho khoá và giá trị nhận một khoá và trả
      lại đúng một giá trị, không phải quét cả kho. Băm rồi chia dư là cách chọn ngăn:
      cùng khoá luôn ra cùng số, và số dư chọn ra ngăn. Mất cập nhật là khi hai tiến
      trình, tức hai chương trình chạy cùng lúc, đọc cùng một giá trị cũ rồi cùng
      ghi, nên lần ghi sau xoá lần ghi trước. Hạn sống là số giây sau đó một mục tự
      biến mất.'
  - show: $$100 + 50 = 150, \qquad 100 + 30 = 130 \neq 180$$
    say: Một bên tính một trăm cộng năm mươi, bằng một trăm năm mươi. Bên kia tính
      từ cùng giá trị cũ, một trăm cộng ba mươi, bằng một trăm ba mươi, khác một trăm
      tám mươi.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>document
      key (khoá bản ghi)</td><td>tên duy nhất của một bản ghi dạng JSON (các cặp <code>tên:
      giá trị</code> trong ngoặc nhọn) trong kho, ví dụ <code>customer::C1001</code></td></tr><tr><td>bucket
      (thùng dữ liệu)</td><td>nơi chứa bản ghi, giống một cơ sở dữ liệu</td></tr><tr><td>vBucket
      (thùng ảo)</td><td>một phần của thùng dữ liệu; khoá → thùng ảo qua băm CRC32.
      <b>Bộ lưu</b> là cách kho ghi dữ liệu xuống đĩa: Couchstore (kiểu cũ) có 1024
      thùng ảo; Magma (kiểu mới) 128 hoặc 1024; từ bản 8.0, ở bản Enterprise (bản
      thương mại), thùng mới mặc định Magma 128. Bài lấy 1024 làm ví dụ</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.4'
    - '1.4'
    say: 'Bảng này giải mã sáu từ, ba từ đầu trước. Khoá bản ghi là tên duy nhất của
      một bản ghi trong kho. Bản ghi dạng JSON là các cặp tên và giá trị trong ngoặc
      nhọn. Thùng ảo là một phần của thùng dữ liệu, và khoá được băm để chọn thùng
      ảo. Bộ lưu là cách kho ghi dữ liệu xuống đĩa: kiểu cũ có một nghìn không trăm
      hai mươi tư thùng ảo, kiểu mới ở bản thương mại mặc định một trăm hai mươi tám.'
  - show: <table class='t'><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>cluster
      map (bản đồ cụm)</td><td>bảng thùng ảo → máy đang giữ bản chính; thư viện khách
      (mã của hãng, nằm trong ứng dụng, nói chuyện với kho) tải về và gọi thẳng máy
      đó</td></tr><tr><td>CAS (dấu phiên bản)</td><td>giá trị đổi mỗi lần bản ghi
      bị sửa; ghi kèm CAS đã đọc, lệch thì bị từ chối</td></tr><tr><td>TTL (hạn sống)</td><td>số
      giây bản ghi được tồn tại trước khi kho tự xoá</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Ba từ còn lại. Bản đồ cụm cho biết thùng ảo nào ở máy nào. Dấu phiên bản
      là giá trị đổi mỗi lần bản ghi bị sửa. Hạn sống là số giây bản ghi tồn tại trước
      khi kho tự xoá.
