  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>thung ao (1024): 892
      | (128): 124</div><div>P1: ghi duoc, CAS moi = 5</div><div>P2: tu choi</div><div>P2
      lan 2: ghi duoc, CAS moi = 6</div><div>cuoi: 270 6</div></div><p class="note">Chấm
      bằng Git Bash: <code>bash labs/cham.sh BNX L09 mau.py</code> — in <b>ĐÚNG</b>
      khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
