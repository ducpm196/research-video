  - show: '<p>Câu 2: P1 ghi $200 - 40 = 160$, CAS thành 13; P2 gửi CAS 12 → từ chối,
      đọc lại 160.</p>

      $$\text{có CAS: } 160 + 25 = \hlg{185}, \qquad \text{không CAS: } 200 + 25 =
      \hl{225}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu hai. Tiến trình một ghi hai trăm trừ bốn mươi, bằng một trăm sáu
      mươi, dấu thành mười ba. Có dấu thì một trăm sáu mươi cộng hai mươi lăm bằng
      một trăm tám mươi lăm. Không có dấu thì hai trăm hai mươi lăm, mất phần trừ
      bốn mươi.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>CAS
