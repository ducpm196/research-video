      chấp nặng thì bị từ chối nhiều lần, phải thử lại có giới hạn</td></tr><tr><td>khoá
      bi quan</td><td>người giữ khoá chắc chắn ghi được</td><td>người khác phải chờ;
      khoá phải có thời hạn, giữ lâu thì nghẽn</td></tr></table><div class="box key">Hạn
      mức có nhiều yêu cầu cùng lúc và phải kiểm điều kiện rồi mới ghi: chọn <b>khoá
      bi quan ngắn, có thời hạn</b>, vì nếu 200 yêu cầu đến cùng lúc, CAS bị từ chối
      nhiều lần (bảng ở cảnh quy mô). Nếu chỉ cộng dồn một số, ưu tiên <b>phép tăng
