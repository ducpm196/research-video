      số lần ghi</th><th>khoá bi quan: người cuối chờ (giữ khoá 1 ms, số minh hoạ)</th></tr><tr><td>2
      (×1)</td><td>3</td><td>2</td><td>2</td><td>2 ms</td></tr><tr><td>20 (×10)</td><td>210</td><td>20</td><td>20</td><td>20
      ms</td></tr><tr><td>200 (×100)</td><td>20 100</td><td>200</td><td>200</td><td>200
      ms</td></tr></table>'
    focus:
    - '1.3'
    - '1.4'
    clear: true
    say: Với dấu phiên bản, trường hợp xấu nhất có tổng lần ghi là n nhân n cộng một,
