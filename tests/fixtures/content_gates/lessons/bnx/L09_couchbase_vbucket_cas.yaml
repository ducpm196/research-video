      khuôn tạo ra một kho có dữ liệu và hàm riêng, và tham số đầu của hàm là chính
      cái kho đó. Dòng gán đặt nội dung và dấu phiên bản cùng lúc, còn lệnh trả về
      có thể trả hai giá trị một lúc.
  - show: '<p><b>Bước 4. Kho mô phỏng có CAS</b></p><div class="code"><div>class Store:                      #
      kho một bản ghi, có CAS</div><div>    def __init__(self):</div><div>        self.doc,
      self.cas = {"diem_thuong": 100}, 7</div><div>    def get(self):</div><div>        return
      dict(self.doc), self.cas</div><div>    def replace(self, doc, cas):</div><div>        if
