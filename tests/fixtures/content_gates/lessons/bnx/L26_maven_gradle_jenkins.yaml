source: 'curriculum/bnx.yaml L26; audit/bnx/verify_bnx.py L26; audit/bnx/sources_l26.md:
  hướng dẫn Maven (Lifecycle, Dependency Mechanism, Reproducible Builds), hướng dẫn
  chính thức Gradle (Dependency Resolution, Java plugin), hướng dẫn chính thức Jenkins
  (Pipeline Syntax, Jenkinsfile; đọc 2026-11-13); Maven 3.9.11 chạy thật trên Temurin
  JDK 21.0.13; Gradle và Jenkins không chạy (chỉ kiểm cú pháp Groovy 4.0.27 và mô
  phỏng nhỏ)'
assumes: []
objectives:
- Đọc vòng đời dựng mặc định của Maven qua các mục tiêu của phần mở rộng in ra khi
  chạy mvn package
- Đọc cây phụ thuộc bắc cầu của một pom.xml bằng dependency:tree và nhận ra dòng bị
  bỏ vì xung đột
- Xác định phiên bản được chọn theo luật gần nhất thắng của Maven
- Đọc một Jenkinsfile khai báo và nói thứ tự giai đoạn cùng nhánh post khi một giai
  đoạn hỏng
- Chứng minh dựng tái lập bằng cách dựng hai lần và so sha256 của jar
- Đọc số gói thư viện đo thật ở ba dự án thử và tính số máy dựng tối thiểu khi lượt
  dựng gấp 100 và 10 000 lần
- Viết bộ phân giải phiên bản theo luật gần nhất thắng của Maven và theo luật cao
  nhất của Gradle
