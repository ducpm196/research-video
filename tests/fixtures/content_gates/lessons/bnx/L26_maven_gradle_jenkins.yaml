- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_l26_agents(400, 10) == 67
  - 'alg.bnx_l26_maven([(''text'', ''1.10.0''), (''lang3'', ''3.9'')], {(''text'',
    ''1.10.0''): [(''lang3'', ''3.12.0'')]})[''lang3''] == ''3.9'''
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Tin rằng bản khai trong
      tệp mô tả là bản <b class="red">đang chạy</b>. Dự án khai <code>commons-lang3</code>
      3.9 thì được 3.9 vì khai thẳng; nhưng thư viện khai <b>bắc cầu</b>

      mà ta không khai thẳng thì bản thật do luật chọn quyết định. Cách xem: in cây
      phụ thuộc, tìm dòng <code>omitted for conflict</code>.</div><p><b>Kết quả chạy
      thật</b></p><div class="code"><div>bnx:l26:jar:1</div><div>+- org.apache.commons:commons-text:jar:1.10.0:compile</div><div>\-
      org.apache.commons:commons-lang3:jar:3.9:compile</div><div>-- che do chi tiet
      (-Dverbose):</div><div>bnx:l26:jar:1</div><div>+- org.apache.commons:commons-text:jar:1.10.0:compile</div><div>|  \-
      (org.apache.commons:commons-lang3:jar:3.12.0:compile - omitted for conflict
      with 3.9)</div><div>\- org.apache.commons:commons-lang3:jar:3.9:compile</div></div>

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là tin rằng bản khai là bản đang chạy. Thư viện
      bắc cầu thì luật chọn quyết định. Cách xem là in cây phụ thuộc và tìm dòng báo
      bỏ vì xung đột.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Khai
      bản <b class="red">cũ hơn</b> bản mà thư viện khác cần, để "cho khớp". Chạy
      thật: Maven ép bản cũ 3.9, thư viện <code>commons-text</code> được dựng và kiểm
      thử với bản 3.12.0

      nhưng chạy với bản 3.9: lỗi chỉ lộ lúc chạy, nếu hàm nó gọi chưa có ở bản cũ.</div>

      '
    clear: true
    say: 'Lỗi thứ hai: khai bản cũ hơn bản mà thư viện khác cần. Công cụ ép dùng bản
      cũ, nên thư viện kia chỉ lỗi lúc chạy nếu hàm nó gọi chưa có ở bản cũ.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc tải tăng).</b> Một
      máy dựng dùng chung, mỗi lượt 10 phút. Ở 4 lượt mỗi giờ thì ổn; ở 400 lượt mỗi
      giờ cần <b class="red">67 máy</b>:

      hàng đợi dựng dài thêm mãi, lập trình viên chờ hàng giờ. Phòng: đo thời gian
      chờ ở hàng đợi, và dự trù máy theo công thức trước khi đội lớn.</div>

      '
    clear: true
    say: 'Lỗi thứ ba, lộ ra khi tải tăng: một máy dựng dùng chung, mỗi lượt mười phút.
      Bốn trăm lượt mỗi giờ cần sáu mươi bảy máy, nếu không hàng đợi dài mãi. Cách
      phòng là dự trù số máy trước khi đội lớn.'
  - show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm, lúc vận hành lâu dài).</b>
      Khai phiên bản <b class="red">dạng khoảng hoặc <code>latest</code></b>, hoặc
      dựng không ghim: một lần dựng sau nhiều tháng kéo thư viện mới, sản phẩm đổi
      mà mã không đổi.

      Cách chữa: ghim phiên bản, đặt <code>outputTimestamp</code>, và so mã băm hai
      lần dựng trên máy chủ dựng; ai cũng dựng lại được đúng sản phẩm đã phát hành.</div>

      '
    clear: true
    say: 'Lỗi thứ tư, lộ ra khi vận hành lâu: khai phiên bản dạng khoảng hoặc không
      ghim. Dựng sau nhiều tháng kéo thư viện mới, nên sản phẩm đổi mà mã không đổi.
      Cách chữa là ghim phiên bản, đặt mốc cố định và so mã băm.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 'alg.bnx_l26_maven([(''P'', ''1.0''), (''Q'', ''1.0'')], {(''P'', ''1.0''): [(''Z'',
    ''2.0'')], (''Q'', ''1.0''): [(''Z'', ''3.0'')]})[''Z''] == ''2.0'''
  - 'alg.bnx_l26_gradle([(''P'', ''1.0''), (''Q'', ''1.0'')], {(''P'', ''1.0''): [(''Z'',
    ''2.0'')], (''Q'', ''1.0''): [(''Z'', ''3.0'')]})[''Z''] == ''3.0'''
  - alg.bnx_l26_agents(120, 15) == 30 and alg.bnx_l26_agents(120, 5) == 10
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Dự
      án khai <code>P 1.0</code> rồi <code>Q 1.0</code>. <code>P 1.0</code> cần <code>Z
      2.0</code>; <code>Q 1.0</code> cần <code>Z 3.0</code>. Cả hai ở cùng độ sâu
      2. Maven chọn <code>Z</code> bản nào? Gradle (mặc định) chọn bản nào?</td></tr><tr><td>2</td><td>Tính
      số máy dựng tối thiểu: 120 lượt dựng mỗi giờ, mỗi lượt 15 phút (số minh hoạ).
      Nếu mỗi lượt giảm còn 5 phút thì sao?</td></tr><tr><td>3</td><td>Quyết định:
      sản phẩm phát hành tháng trước cần dựng lại đúng từng bit để điều tra sự cố.
      Chọn: ghim phiên bản + <code>outputTimestamp</code>, chỉ ghim phiên bản, hay
      để mặc định? Vì sao?</td></tr></table>'
    pause: 30
    say: 'Đến lượt bạn, ba câu để làm ra giấy: hai công cụ chọn bản nào, cần bao nhiêu
      máy dựng, và chọn cách nào để dựng lại đúng từng bit. Hãy dừng lại làm ra giấy
      rồi xem đáp án.'
  - show: '<p>Câu 1: cùng độ sâu thì <b>khai báo trước thắng</b> (Maven); Gradle lấy
      cao nhất.</p>

      $$\text{Maven: } Z = \hlg{2.0} \;(\text{P khai trước Q}); \qquad \text{Gradle:
      } Z = \hlg{3.0}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu một, ở công cụ thứ nhất, cùng độ sâu thì khai báo trước thắng,
      nên chọn bản hai chấm không. Công cụ thứ hai lấy bản cao nhất, tức bản ba chấm
      không.
    clear: true
  - show: '<p>Câu 2: số máy = phút dựng mỗi giờ : 60, làm tròn lên.</p>

      $$120 \times 15 = 1800 \text{ phút}; \; 1800 : 60 = \hlg{30} \text{ máy}; \qquad
      120 \times 5 = 600; \; 600 : 60 = \hlg{10} \text{ máy}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu hai, một trăm hai mươi lượt nhân mười lăm phút là một nghìn tám
      trăm phút mỗi giờ, chia sáu mươi được ba mươi máy. Còn năm phút mỗi lượt thì
      sáu trăm phút, cần mười máy.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>ghim
      phiên bản + outputTimestamp</td><td>dựng lại ra đúng cùng mã băm; điều tra chắc
      chắn</td><td>phải cập nhật phiên bản chủ động, có việc bảo trì</td></tr><tr><td>chỉ
      ghim phiên bản</td><td>cùng thư viện, nhưng gói vẫn có thể khác bit do mốc thời
      gian</td><td>so sánh bằng mã băm sẽ lệch</td></tr><tr><td>để mặc định</td><td>không
      phải làm gì</td><td>bản phụ thuộc có thể đổi giữa hai lần dựng: không dựng lại
      được</td></tr></table>'
    say: Đáp án câu ba, ghim phiên bản cùng mốc cố định cho dựng lại ra đúng mã băm,
      đổi lại phải cập nhật chủ động. Chỉ ghim phiên bản thì gói vẫn có thể khác bit,
      để mặc định thì bản phụ thuộc đổi giữa hai lần dựng.
    clear: true
