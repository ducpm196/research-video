- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ tệp mô tả dự án tới sản phẩm dựng ra'
  checks:
  - 'alg.bnx_l26_maven([(''text'', ''1.10.0''), (''lang3'', ''3.9'')], {(''text'',
    ''1.10.0''): [(''lang3'', ''3.12.0'')]})[''lang3''] == ''3.9'''
  - 'alg.bnx_l26_gradle([(''text'', ''1.10.0''), (''lang3'', ''3.9'')], {(''text'',
    ''1.10.0''): [(''lang3'', ''3.12.0'')]})[''lang3''] == ''3.12.0'''
  - len(alg.bnx_l26_phases()) == 6 and len(alg.bnx_l26_phase_goals()) == 6 and alg.bnx_l26_phase_count()
    == 17
  - '[g.split('':'')[1] for p, g in alg.bnx_l26_phase_goals()] == alg.bnx_l26_phases()'
  steps:
  - show: '<p><b>Bước 1.</b> Muốn mọi máy dựng giống nhau, ta ghi mọi thứ vào <b>một
      tệp mô tả dự án</b>: tên dự án, bản Java, và danh sách phụ thuộc. Công cụ đọc
      tệp này rồi tự tải thư viện và dựng.</p><p><b>pom.xml (trích): hai phụ thuộc
      trực tiếp</b></p><div class="code"><div>  &lt;dependencies&gt;</div><div>    &lt;dependency&gt;</div><div>      &lt;groupId&gt;org.apache.commons&lt;/groupId&gt;</div><div>      &lt;artifactId&gt;commons-text&lt;/artifactId&gt;</div><div>      &lt;version&gt;1.10.0&lt;/version&gt;</div><div>    &lt;/dependency&gt;</div><div>    &lt;dependency&gt;</div><div>      &lt;groupId&gt;org.apache.commons&lt;/groupId&gt;</div><div>      &lt;artifactId&gt;commons-lang3&lt;/artifactId&gt;</div><div>      &lt;version&gt;3.9&lt;/version&gt;</div><div>    &lt;/dependency&gt;</div><div>  &lt;/dependencies&gt;</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Bước một: ghi mọi thứ vào một tệp mô tả dự án, gồm tên, bản Java và danh
      sách phụ thuộc. Công cụ đọc tệp nên tự tải thư viện và dựng.'
  - show: '<p><b>Bước 2. Vòng đời.</b> Một lệnh dựng đi qua <b>các pha nối tiếp</b>
      theo thứ tự cố định, từ pha đầu tới pha được gọi. Pha chỉ là chặng: việc làm
      thật do <b>mục tiêu</b> của phần mở rộng gắn vào pha.</p><table class=''t''><tr><th>pha</th><th>mục
      tiêu gắn vào (phần mở rộng:mục tiêu)</th></tr><tr><td>process-resources</td><td>resources:resources</td></tr><tr><td>compile</td><td>compiler:compile</td></tr><tr><td>process-test-resources</td><td>resources:testResources</td></tr><tr><td>test-compile</td><td>compiler:testCompile</td></tr><tr><td>test</td><td>surefire:test</td></tr><tr><td>package</td><td>jar:jar</td></tr></table>$$\text{gọi
      package} \Rightarrow 17 \text{ pha, } \hl{6} \text{ mục tiêu chạy theo thứ tự}$$'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Bước hai là vòng đời: một lệnh dựng đi qua các pha nối tiếp theo thứ tự
      cố định. Pha chỉ là chặng, việc làm thật do mục tiêu gắn vào pha. Gọi pha đóng
      gói đi qua mười bảy pha, trong đó sáu pha có mục tiêu như bảng.'
    introduces:
    - implies
  - show: '<p><b>Bước 3. Phụ thuộc bắc cầu.</b> Mỗi thư viện có tệp mô tả riêng, khai
      thư viện nó cần. Công cụ lần theo, nên một phụ thuộc trực tiếp kéo theo cả chùm:
      ở phần ví dụ, <b>1</b> phụ thuộc kéo <b>9</b>, rồi <b>34</b> gói thư viện tuỳ
      dự án.</p>

      $$1 \to 1; \qquad 1 \to 9; \qquad 1 \to 34 \;\; (\text{số đo thật ở phần ví
      dụ})$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước ba là phụ thuộc bắc cầu: công cụ lần theo tệp mô tả của từng thư viện.
      Nên một phụ thuộc trực tiếp kéo theo cả chùm: ba dự án thử là một, chín và ba
      mươi bốn gói.'
  - show: '<p><b>Bước 4. Xung đột.</b> Khi cùng một thư viện xuất hiện ở hai bản,
      công cụ phải chọn một. <b>Maven</b>: bản của khai báo <b>gần dự án nhất</b>
      (độ sâu nhỏ nhất); cùng độ sâu thì <b>khai báo trước</b> thắng. <b>Gradle</b>
      mặc định: bản <b>cao nhất</b>.</p><table class=''t''><tr><th>thư viện</th><th>yêu
      cầu</th><th>độ sâu</th><th>Maven chọn</th><th>Gradle chọn</th></tr><tr><td>lang3</td><td>3.9
      (dự án khai)</td><td>1</td><td><b>3.9</b></td><td>3.12.0</td></tr><tr><td>lang3</td><td>3.12.0
      (qua text)</td><td>2</td><td>bỏ</td><td>(cao nhất)</td></tr></table>'
    focus:
    - - 1
    - 1
    - 2
    clear: true
    say: 'Bước bốn là xung đột: cùng một thư viện ở hai bản thì chỉ một bản vào được,
      nên công cụ phải chọn. Công cụ thứ nhất chọn khai báo gần dự án nhất, cùng độ
      sâu thì khai báo trước thắng. Công cụ thứ hai chọn bản cao nhất.'
  - show: '<p><b>Bước 5. Đường ống.</b> Máy chủ dựng đọc <b>Jenkinsfile</b> nằm cùng
      mã nguồn, viết bằng <b>Groovy</b> (ngôn ngữ kịch bản chạy trên Java). <code>pipeline</code>
      chứa <code>stages</code>, mỗi <code>stage</code> có <code>steps</code>.

      <code>agent any</code>: chạy trên máy dựng nào đang rảnh. <code>sh ''…''</code>:
      chạy một lệnh như bạn gõ tay.</p><p><b>Jenkinsfile (trích, phần 1)</b></p><div
      class="code"><div>pipeline {</div><div>  agent any</div><div>  stages {</div><div>    stage(''Build'')
      {</div><div>      steps { sh ''mvn -B package'' }</div><div>    }</div><div>    stage(''Test'')
      {</div><div>      steps { sh ''mvn -B verify'' }</div><div>    }</div></div>

      '
    focus:
    - 1
    - 2
    - 3
    introduces:
    - bnx_groovy
    - bnx_agent
    - bnx_sh
    clear: true
    say: 'Bước năm là đường ống: máy chủ dựng đọc một tệp khai báo nằm cùng mã nguồn.
      Tệp viết bằng một ngôn ngữ kịch bản chạy trên Java, ta chỉ cần đọc các khối
      lồng nhau. Dòng chọn máy nghĩa là chạy trên máy đang rảnh, dòng lệnh chạy một
      lệnh như gõ tay.'
  - show: <p>Giai đoạn cuối triển khai; khối <code>post</code> chạy khi xong hoặc
      khi hỏng, và <code>failure</code> chỉ chạy khi có giai đoạn hỏng.</p><p><b>Jenkinsfile
      (trích, phần 2)</b></p><div class="code"><div>    stage('Deploy') {</div><div>      steps
      { sh './trien-khai.sh' }</div><div>    }</div><div>  }</div><div>  post {</div><div>    failure
      { echo 'dung that bai' }</div><div>  }</div><div>}</div></div>
    clear: true
    say: Giai đoạn cuối là triển khai, và khối sau cùng chạy khi xong hoặc khi hỏng,
      nghĩa là nhánh thất bại chỉ chạy khi có giai đoạn hỏng.
  - show: '<p><b>Bước 6. Dựng tái lập.</b> Một jar có chứa <b>mốc thời gian</b> của
      từng tệp bên trong, nên hai lần dựng cùng mã nguồn vẫn có thể ra hai jar khác
      nhau từng bit. Đặt <code>project.build.outputTimestamp</code> cố định mốc đó.
      Cách thử: dựng hai lần, so <b>mã băm</b> (sha256): dãy ký tự ngắn tính từ toàn
      bộ nội dung tệp; đổi một bit thì cả dãy đổi.</p>$$\text{sha256(gói lần 1)} =
      \text{sha256(gói lần 2)} \;\Rightarrow\; \text{dựng tái lập}$$'
    focus:
    - 1
    - - 1
      - 2
    introduces:
    - bnx_ma_bam
    clear: true
    say: 'Bước sáu là dựng tái lập: một gói chứa mốc thời gian của từng tệp bên trong,
      nên hai lần dựng cùng mã nguồn vẫn có thể khác nhau từng bit. Đặt mốc cố định
      thì hết khác, cách thử là so mã băm, dãy ký tự ngắn tính từ toàn bộ nội dung
      gói.'
- id: example
  kind: example
  title: Ví dụ chạy thật Maven, từng phép tính
  checks:
  - 'alg.bnx_l26_maven([(''text'', ''1.10.0''), (''lang3'', ''3.9'')], {(''text'',
    ''1.10.0''): [(''lang3'', ''3.12.0'')]})[''lang3''] == ''3.9'''
  - alg.bnx_l26_phases() == ['resources', 'compile', 'testResources', 'testCompile',
    'test', 'jar']
  steps:
  - show: '<p><b>Chạy thật: in cây phụ thuộc, rồi chạy lại ở chế độ chi tiết</b></p><div
      class="code"><div><span>&#36;</span>M -B -q dependency:tree -DoutputFile=cay.txt
      &amp;&amp; cat cay.txt</div><div>echo "-- che do chi tiet (-Dverbose):"</div><div><span>&#36;</span>M
      -B -q dependency:tree -Dverbose -DoutputFile=cay2.txt &amp;&amp; cat cay2.txt</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta chạy thật công cụ dựng thứ nhất, bản ba chấm chín mười một, trên tệp mô
      tả vừa xem. Lệnh đầu in cây thường, lệnh sau in thêm các bản bị bỏ vì xung đột.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>bnx:l26:jar:1</div><div>+-
      org.apache.commons:commons-text:jar:1.10.0:compile</div><div>\- org.apache.commons:commons-lang3:jar:3.9:compile</div><div>--
      che do chi tiet (-Dverbose):</div><div>bnx:l26:jar:1</div><div>+- org.apache.commons:commons-text:jar:1.10.0:compile</div><div>|  \-
      (org.apache.commons:commons-lang3:jar:3.12.0:compile - omitted for conflict
      with 3.9)</div><div>\- org.apache.commons:commons-lang3:jar:3.9:compile</div></div>$$①
      \; \text{lang3 3.9 ở độ sâu 1 thắng 3.12.0 ở độ sâu 2: } \hl{\text{omitted for
      conflict with 3.9}}$$'
    focus:
    - 1
    - 2
    clear: true
    say: 'Phép tính thứ nhất, kết quả thật: cây thường chỉ có hai phụ thuộc trực tiếp.
      Bản chi tiết cho thấy thư viện tiện ích bản ba chấm mười hai nằm dưới thư viện
      xử lý chữ, bị bỏ vì xung đột với bản ba chấm chín.'
  - show: '<p><b>Chạy thật: dựng tới pha package, chỉ giữ dòng tên mục tiêu</b></p><div
      class="code"><div><span>&#36;</span>M -B package | grep -- ''--- '' | cut -c8-</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>--- resources:3.3.1:resources (default-resources)
      @ l26 ---</div><div>--- compiler:3.13.0:compile (default-compile) @ l26 ---</div><div>---
      resources:3.3.1:testResources (default-testResources) @ l26 ---</div><div>---
      compiler:3.13.0:testCompile (default-testCompile) @ l26 ---</div><div>--- surefire:3.2.5:test
      (default-test) @ l26 ---</div><div>--- jar:3.4.1:jar (default-jar) @ l26 ---</div></div>$$②
      \; 6 \text{ mục tiêu của phần mở rộng chạy đúng thứ tự: resources} \to \text{jar}$$'
    focus:
    - 1
    - 4
    clear: true
    say: 'Phép tính thứ hai là vòng đời: gọi pha đóng gói, công cụ chạy sáu mục tiêu
      theo đúng thứ tự, mỗi mục tiêu gắn vào một pha như bảng vừa xem. Mỗi dòng ghi
      phần mở rộng, mục tiêu và phiên bản thật.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>M=…/bin/mvn</code>,
      <code>test -x <span>&#36;</span>M || { …; exit 97; }</code></td><td>đặt biến
      <code>M</code> là đường dẫn lệnh <code>mvn</code>; <code>test -x</code> hỏi
      tệp đó chạy được không; <code>||</code> làm vế sau nếu vế trước thất bại; <code>exit
      97</code> dừng với mã 97</td><td>thiếu <code>mvn</code> thì in lỗi rồi dừng</td></tr><tr><td><code>mkdir
      -p src/main/java &amp;&amp; cp Chao.java src/main/java/</code></td><td><code>mkdir
      -p</code>: tạo thư mục (cả thư mục cha nếu thiếu); <code>cp A B</code>: chép
      tệp A vào B; <code>&amp;&amp;</code>: chỉ chép khi tạo xong</td><td></td></tr><tr><td><code><span>&#36;</span>M
      -B -q -f <span>&#36;</span>1 clean package &gt; /dev/null 2&gt;&amp;1</code></td><td><code>-f
      <span>&#36;</span>1</code>: dùng tệp mô tả tên trong đối số đầu; <code>clean
      package</code>: xoá đầu ra cũ rồi dựng gói; <code>&gt; /dev/null</code>: bỏ
      chữ in ra; <code>2&gt;&amp;1</code>: bỏ luôn chữ báo lỗi</td><td></td></tr><tr><td><code>sha256sum
      target/l26-1.jar</code></td><td>in mã băm sha256 của tệp (cột đầu), rồi tên
      tệp</td><td></td></tr></table>'
    clear: true
    say: Biến chứa đường dẫn lệnh dựng, và dừng chương trình nếu lệnh ấy không chạy
      được. Tạo thư mục rồi chép tệp mã nguồn vào, chỉ khi tạo xong. Dựng sạch theo
      tệp mô tả đưa vào, và bỏ hết chữ in ra. Lệnh băm in mã băm rồi tên tệp, lệnh
      cắt giữ cột đầu.
  - show: '<p><b>Mã dựng hai lần (1/2): đặt lệnh, hàm dung dựng rồi in mã băm</b></p><div
      class="code"><div>M=/d/research-video/audit/bnx/deps/_tools/apache-maven-3.9.11/bin/mvn</div><div>test
      -x <span>&#36;</span>M || { echo "NOT_VERIFIED: thiếu Maven" &gt;&amp;2; exit
      97; }</div><div>mkdir -p src/main/java &amp;&amp; cp Chao.java src/main/java/</div><div>dung()
      {</div><div>  <span>&#36;</span>M -B -q -f <span>&#36;</span>1 clean package
      &gt; /dev/null 2&gt;&amp;1</div><div>  sha256sum target/l26-1.jar | cut -d''
      '' -f1</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba là dựng tái lập. Hàm này dựng sạch một lần theo tệp mô tả
      đưa vào, rồi in mã băm của gói.
  - show: '<p><b>Mã dựng hai lần (2/2): cách nhau 2 giây, so mã băm sha256 (kết quả
      ở khung sau)</b></p><div class="code"><div>so() {</div><div>  a=<span>&#36;</span>(dung
      <span>&#36;</span>1); sleep 2; b=<span>&#36;</span>(dung <span>&#36;</span>1)</div><div>  [
      "<span>&#36;</span>a" = "<span>&#36;</span>b" ] &amp;&amp; echo "<span>&#36;</span>2:
      GIONG" || echo "<span>&#36;</span>2: KHAC"</div><div>}</div><div>so pom.xml
      "khong dat outputTimestamp"</div><div>so pom-tt.xml "co outputTimestamp"</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Hàm so gọi hàm dựng hai lần cách nhau hai giây rồi so mã băm. Lần đầu dùng
      tệp không đặt mốc thời gian, lần sau dùng tệp có mốc cố định.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>khong dat outputTimestamp:
      KHAC</div><div>co outputTimestamp: GIONG</div></div>$$③ \; \text{không đặt mốc:
      } \hl{\text{khác}}; \qquad \text{đặt } 2026\text{-}01\text{-}01\text{: } \hlg{\text{giống}}$$'
    focus:
    - 1
    - 3
    clear: true
    say: Không đặt mốc thời gian thì hai gói khác nhau, đặt mốc cố định thì hai gói
      giống nhau từng bit. Đây là số đo cho gói một lớp nhỏ này, không nói mọi dự
      án tái lập được nhờ một thuộc tính.
  - show: '<p><b>Kiểm CÚ PHÁP bằng trình biên dịch Groovy thật (không chạy Jenkins,
      không chạy Gradle)</b></p><div class="code"><div>Jenkinsfile: cu phap hop le</div><div>build.gradle:
      cu phap hop le</div><div>JenkinsfileHong: loi cu phap</div></div>$$④ \; \text{chỉ
      kiểm cú pháp: 2 tệp đúng, 1 tệp thiếu ngoặc bị từ chối}$$'
    focus:
    - 1
    - 3
    clear: true
    say: 'Phép tính thứ tư: máy này không có máy chủ dựng, nên ta chỉ kiểm cú pháp
      bằng trình biên dịch của ngôn ngữ kịch bản thật. Tệp đúng thì qua, tệp thiếu
      ngoặc bị từ chối, nhưng chưa chứng minh đường ống chạy đúng.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def
      chay(cac_buoc, hong=None):</code></td><td>khai hàm Python: <code>def</code>,
      tên, tham số, dấu hai chấm; các dòng thụt vào là thân; <code>hong=None</code>:
      tham số có giá trị mặc định rỗng nếu không truyền</td><td><code>chay(["Build"])</code>
      thì <code>hong</code> là rỗng</td></tr><tr><td><code>ket = []</code>, <code>ket.append(x)</code>,
      <code>ten + ": xong"</code></td><td><code>[]</code>: danh sách rỗng; <code>append</code>:
      thêm một phần tử vào cuối danh sách; <code>+</code> giữa hai chuỗi: nối lại</td><td></td></tr><tr><td><code>if
      hong == ten:</code>, <code>break</code></td><td><code>==</code>: hỏi hai giá
      trị có bằng nhau; <code>break</code>: thoát vòng lặp ngay lập tức</td><td></td></tr><tr><td><code>for
      … : … else:</code></td><td>khối <code>else</code> của vòng <code>for</code>
      chỉ chạy khi vòng lặp chạy hết mà <b>không</b> gặp <code>break</code>; gặp <code>break</code>
      thì bỏ qua <code>else</code></td><td></td></tr></table>'
    clear: true
    say: Khai hàm, trong đó tham số có thể có giá trị mặc định rỗng. Danh sách rỗng,
      thêm phần tử vào cuối, và dấu cộng nối hai chuỗi. Hai dấu bằng so sánh hai giá
      trị, còn lệnh thoát rời khỏi vòng lặp ngay. Khối ngược lại của vòng lặp chạy
      khi vòng không gặp lệnh thoát.
  - show: '<p><b>MÔ PHỎNG bằng Python (không phải Jenkins): giai đoạn Test hỏng</b></p><div
      class="code"><div>def chay(cac_buoc, hong=None):</div><div>    ket = []</div><div>    for
      ten in cac_buoc:</div><div>        if hong == ten:</div><div>            ket.append(ten
      + ": that bai")</div><div>            break</div><div>        ket.append(ten
      + ": xong")</div><div>    else:</div><div>        return ket</div><div>    ket.append("post
      failure: dung that bai")</div><div>    return ket</div><div>for dong in chay(["Build",
      "Test", "Deploy"], hong="Test"):</div><div>    print(dong)</div></div>'
    focus:
