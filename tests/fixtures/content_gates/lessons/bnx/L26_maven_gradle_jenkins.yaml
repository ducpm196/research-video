    - 2
    clear: true
    say: Phép tính thứ năm là hành vi khi một giai đoạn hỏng, và đây là mô phỏng,
      không phải máy chủ thật. Hàm chạy các giai đoạn lần lượt, gặp giai đoạn hỏng
      thì dừng rồi chạy nhánh khi thất bại.
  - show: '<p><b>Kết quả mô phỏng (Python, không phải Jenkins)</b></p><div class="code"><div>Build:
      xong</div><div>Test: that bai</div><div>post failure: dung that bai</div></div>$$⑤
      \; \text{Test hỏng} \Rightarrow \text{Deploy không chạy; nhánh post failure
      chạy}$$'
    clear: true
    say: 'Kết quả mô phỏng: kiểm thử hỏng, giai đoạn triển khai không chạy và nhánh
      khi thất bại chạy, đúng như hướng dẫn mô tả.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: bộ phân giải tự viết'
  checks:
  - 'alg.bnx_l26_maven([(''text'', ''1.10.0''), (''lang3'', ''3.9'')], {(''text'',
    ''1.10.0''): [(''lang3'', ''3.12.0'')]})[''lang3''] == ''3.9'''
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>CAY
      = {"du an": [("text", "1.10.0"), …], ("text", "1.10.0"): […]}</code></td><td>từ
      điển: <code>{khoá: giá trị}</code>; khoá là chuỗi hoặc cặp (tên, bản); giá trị
      là danh sách các cặp mà nó cần; <code>CAY["du an"]</code> lấy giá trị của khoá
      <code>"du an"</code></td><td><code>CAY["du an"]</code> là hai cặp đầu tiên</td></tr><tr><td><code>da,
      hang = {}, [(k, v, 1) for k, v in CAY["du an"]]</code></td><td>gán hai biến
      một lúc: <code>da</code> là từ điển rỗng <code>{}</code>; <code>hang</code>
      là danh sách sinh sẵn: mỗi cặp <code>k, v</code> của dự án thành bộ ba <code>(k,
      v, 1)</code>, số 1 là độ sâu</td><td></td></tr><tr><td><code>while hang:</code></td><td>lặp
      chừng nào danh sách <code>hang</code> còn phần tử; danh sách rỗng thì dừng</td><td></td></tr><tr><td><code>ten,
      ban, sau = hang.pop(0)</code></td><td><code>pop(0)</code>: lấy phần tử đầu danh
      sách ra và bỏ nó khỏi danh sách; ba giá trị của bộ ba gán vào ba tên</td><td></td></tr></table>'
    clear: true
    say: 'Từ điển gồm các cặp khoá và giá trị, giá trị ở đây là danh sách thư viện.
      Gán hai biến một lúc: từ điển rỗng và danh sách sinh sẵn. Lặp chừng nào danh
      sách còn phần tử, rỗng thì dừng. Lấy phần tử đầu ra khỏi danh sách nên danh
      sách ngắn dần, rồi gán ba giá trị vào ba tên.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>if
      ten in da:</code> … <code>continue</code></td><td><code>in</code>: đúng khi
      <code>ten</code> đã là khoá của <code>da</code>; <code>continue</code>: bỏ phần
      còn lại của vòng này, sang vòng kế tiếp</td></tr><tr><td><code>print(f"bo {ten}
      {ban} (sau {sau}): da co {da[ten]}")</code></td><td>chuỗi f: phần trong ngoặc
      nhọn được thay bằng giá trị; <code>da[ten]</code>: giá trị của khoá <code>ten</code>
      trong <code>da</code></td></tr><tr><td><code>da[ten] = ban</code></td><td>ghi
      vào <code>da</code>: khoá <code>ten</code> có giá trị <code>ban</code> (người
      đến trước giữ chỗ)</td></tr><tr><td><code>hang += [(k, v, sau + 1) for k, v
      in CAY.get((ten, ban), [])]</code></td><td><code>CAY.get(khoá, [])</code>: giá
      trị của khoá, không có khoá thì trả danh sách rỗng; <code>+=</code>: nối thêm
      vào cuối <code>hang</code>; mỗi cặp mới có độ sâu <code>sau + 1</code></td></tr></table>'
    clear: true
    say: 'Phép thuộc hỏi tên đã có chưa, và lệnh tiếp tục bỏ phần còn lại của vòng
      này. Chuỗi f thay phần trong ngoặc nhọn bằng giá trị của biểu thức. Ghi vào
      từ điển: người đến trước giữ chỗ. Lấy các thư viện nó cần, không có thì rỗng,
      rồi nối vào cuối hàng với độ sâu tăng một.'
  - show: '<p><b>Bộ phân giải tự viết: duyệt theo độ sâu, người đến trước thắng</b></p><div
      class="code"><div>CAY = {"du an": [("text", "1.10.0"), ("lang3", "3.9")],</div><div>       ("text",
      "1.10.0"): [("lang3", "3.12.0")]}</div><div>da, hang = {}, [(k, v, 1) for k,
      v in CAY["du an"]]</div><div>while hang:</div><div>    ten, ban, sau = hang.pop(0)</div><div>    if
      ten in da:</div><div>        print(f"bo {ten} {ban} (sau {sau}): da co {da[ten]}")</div><div>        continue</div><div>    da[ten]
      = ban</div><div>    hang += [(k, v, sau + 1) for k, v in CAY.get((ten, ban),
      [])]</div><div>print(da)</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta kiểm bằng đường khác, không dùng công cụ dựng, vì bộ phân giải viết tay
      cho thấy rõ luật chọn. Nó duyệt hàng đợi theo thứ tự khai báo, thư viện đã chọn
      thì mọi yêu cầu sau về nó bị bỏ.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>bo lang3 3.12.0 (sau
      2): da co 3.9</div><div>{''text'': ''1.10.0'', ''lang3'': ''3.9''}</div></div><table
      class=''t''><tr><th>cách</th><th>lang3 được chọn</th><th>dòng bị bỏ</th></tr><tr><td>Maven
      chạy thật (dependency:tree -Dverbose)</td><td>3.9</td><td>omitted for conflict
      with 3.9</td></tr><tr><td>bộ phân giải tự viết</td><td>3.9</td><td>bo lang3
      3.12.0 (sau 2): da co 3.9</td></tr><tr><td>luật Gradle (theo hướng dẫn chính
      thức)</td><td>3.12.0</td><td>(không chạy Gradle)</td></tr></table>'
    focus:
    - 1
    - 3
    clear: true
    say: Bộ phân giải tự viết chọn bản ba chấm chín, giống công cụ dựng thật, và bỏ
      đúng bản ba chấm mười hai ở độ sâu hai. Hai đường độc lập khớp nhau nên ta tin
      luật gần nhất thắng; hàng cuối là luật theo hướng dẫn, ta không chạy.
