scenes:
- id: hook
  kind: hook
  title: Hai công cụ dựng, cùng một đồ thị phụ thuộc, hai phiên bản khác nhau
  checks:
  - 'alg.bnx_l26_maven([(''text'', ''1.10.0''), (''lang3'', ''3.9'')], {(''text'',
    ''1.10.0''): [(''lang3'', ''3.12.0'')]})[''lang3''] == ''3.9'''
  - 'alg.bnx_l26_gradle([(''text'', ''1.10.0''), (''lang3'', ''3.9'')], {(''text'',
    ''1.10.0''): [(''lang3'', ''3.12.0'')]})[''lang3''] == ''3.12.0'''
  steps:
  - show: '<p>Dự án khai thẳng thư viện <code>commons-lang3</code> bản <b>3.9</b>.
      Nhưng thư viện <code>commons-text</code> mà dự án dùng lại cần <code>commons-lang3</code>
      bản <b>3.12.0</b>.</p>

      <div class="box key">Chạy Maven thật: <b>3.9</b> thắng, và báo <code>omitted
      for conflict with 3.9</code>. Luật mặc định của <b>Gradle</b> (công cụ dựng
      thứ hai cho Java, đọc <code>build.gradle</code> thay cho <code>pom.xml</code>;
      theo hướng dẫn chính thức): lấy bản <b>cao nhất</b>, tức 3.12.0.

      Cùng đồ thị, hai công cụ, hai kết quả. Làm sao biết bản nào đang chạy, và làm
      sao để máy bạn và mọi máy khác dựng ra cùng một sản phẩm?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    introduces:
    - bnx_gradle
    say: Chào bạn, dự án khai thẳng một thư viện tiện ích ở bản ba chấm chín. Nhưng
      một thư viện khác cần chính nó ở bản ba chấm mười hai chấm không. Chạy công
      cụ dựng thật, bản ba chấm chín thắng và bản kia bị bỏ vì xung đột, còn công
      cụ dựng thứ hai mặc định lấy bản cao nhất. Vậy làm sao biết bản nào đang chạy,
      và làm sao để mọi máy cùng ra một sản phẩm?
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - 3 + 9 + 34 > 0
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      thư viện, phiên bản</td><td>gói mã người khác viết sẵn, đóng thành tệp <b>jar</b>;
      mỗi bản có số phiên bản</td><td>commons-lang3 bản 3.9 và bản 3.12.0 là hai tệp
      khác nhau</td></tr><tr><td>② phụ thuộc</td><td>thư viện mà dự án cần để biên
      dịch hoặc chạy</td><td>dự án cần commons-text</td></tr><tr><td>③ phụ thuộc bắc
      cầu</td><td>thư viện mình cần lại cần thư viện khác</td><td>commons-text cần
      commons-lang3</td></tr><tr><td>④ dựng (build)</td><td>biến mã nguồn thành sản
      phẩm chạy được: biên dịch, kiểm thử, đóng gói</td><td>ra một tệp jar</td></tr><tr><td>⑤
      tệp mô tả dự án</td><td>tệp chữ khai báo dự án cần gì, dựng thế nào; công cụ
      đọc rồi làm</td><td><code>pom.xml</code> (Maven), <code>build.gradle</code>
      (Gradle)</td></tr></table>'
    focus:
    - '1.2'
    - - '1.3'
      - '1.4'
    - '1.5'
    - '1.6'
    say: Trước hết ta cần hiểu năm điều, thư viện là gói mã người khác viết sẵn, mỗi
      bản có một số phiên bản. Phụ thuộc là thư viện mà dự án cần, và phụ thuộc bắc
      cầu là khi thư viện mình cần lại cần thêm thư viện khác. Dựng là biến mã nguồn
      thành sản phẩm chạy được, qua biên dịch, kiểm thử và đóng gói. Tệp mô tả dự
      án khai báo dự án cần gì và dựng thế nào.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - len(alg.bnx_l26_phases()) == 6
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>&lt;dependency&gt;</code></td><td>một
      phụ thuộc: <code>groupId</code> (nhóm), <code>artifactId</code> (tên), <code>version</code>
      (phiên bản)</td></tr><tr><td>pha (phase)</td><td>một chặng của vòng đời dựng,
      như <code>process-resources</code>, <code>compile</code>, <code>test</code>,
      <code>package</code></td></tr><tr><td>mục tiêu (goal)</td><td>việc cụ thể của
      một <b>phần mở rộng</b> (plugin), gắn vào một pha; ví dụ <code>compiler:compile</code>
      gắn vào pha <code>compile</code></td></tr><tr><td><code>mvn dependency:tree</code></td><td>lệnh
      in <b>cây phụ thuộc</b>: dự án ở gốc, mỗi cấp thụt vào là một tầng bắc cầu</td></tr><tr><td><code>omitted
      for conflict</code></td><td>báo: phiên bản này bị <b>bỏ</b> vì xung đột với
      phiên bản đã chọn</td></tr><tr><td><code>Jenkinsfile</code></td><td>tệp khai
      báo <b>đường ống</b> dựng cho <b>Jenkins</b>, phần mềm chạy trên <b>máy chủ
      dựng</b> (máy riêng chuyên dựng tự động khi có mã mới): <code>pipeline</code>,
      <code>stages</code>, <code>stage</code>, <code>steps</code>, <code>post</code></td></tr><tr><td><code>outputTimestamp</code></td><td>mốc
      thời gian cố định để ghi vào tệp dựng, thay cho giờ chạy thật</td></tr></table>'
    focus:
    - '1.2'
    - - '1.3'
      - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    introduces:
    - bnx_jenkins
    - bnx_may_dung
    say: Mỗi khối phụ thuộc có ba phần là nhóm, tên và phiên bản. Pha là một chặng
      của vòng đời dựng, còn mục tiêu là việc cụ thể của phần mở rộng, gắn vào một
      pha. Lệnh cây phụ thuộc in dự án ở gốc, mỗi cấp thụt vào là một tầng bắc cầu.
      Dòng báo bỏ vì xung đột cho biết phiên bản đó đụng phiên bản đã chọn. Tệp đường
      ống dành cho máy chủ dựng, máy riêng chuyên dựng tự động khi có mã mới. Mốc
      thời gian đầu ra là giờ cố định ghi vào tệp dựng.
  - show: '<table class=''t''><tr><th>viết trong lệnh</th><th>đọc là</th><th>ví dụ
      nhỏ</th></tr><tr><td><code>&#36;M -B -q dependency:tree -DoutputFile=cay.txt
      &amp;&amp; cat cay.txt</code></td><td><code>&#36;M</code>: biến chứa đường dẫn
      lệnh <code>mvn</code> (đặt ở dòng đầu); <code>-B</code> chạy không hỏi, <code>-q</code>
      ít chữ; <code>-Dx=y</code> đặt tham số <code>x</code> bằng <code>y</code>; <code>&amp;&amp;</code>
      chạy lệnh sau nếu lệnh trước thành công; <code>cat</code> in tệp</td><td><code>echo
      hi &amp;&amp; echo ok</code> in cả hai dòng</td></tr><tr><td><code>mvn -B package
      | grep -- ''--- '' | cut -c8-</code></td><td>dấu <code>|</code> đưa đầu ra lệnh
      trái làm đầu vào lệnh phải; <code>grep</code> giữ dòng có chuỗi <code>--- </code>
      (<code>--</code> báo hết tuỳ chọn); <code>cut -c8-</code> bỏ 7 ký tự đầu mỗi
      dòng</td><td><code>cut -c3-</code> biến <code>abcde</code> thành <code>cde</code></td></tr><tr><td><code>a=&#36;(dung
      &#36;1)</code>, <code>cut -d'' '' -f1</code></td><td><code>dung() { … }</code>
      là hàm; <code>&#36;1</code>, <code>&#36;2</code> là đối số đầu, đối số hai;
      <code>&#36;(…)</code> lấy đầu ra của lệnh gán cho biến <code>a</code>; <code>cut
      -d'' '' -f1</code> lấy cột đầu của dòng, các cột tách bằng dấu cách</td><td><code>a=&#36;(echo
      xin)</code> thì <code>a</code> là <code>xin</code>; <code>sleep 2</code> chờ
      2 giây; <code>[ x = y ] &amp;&amp; A || B</code>: x bằng y thì làm A, không
      thì làm B</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Trước hết, đọc vài ký hiệu của lệnh. Biến chứa đường dẫn lệnh dựng, các tuỳ
      chọn gạch ngang chọn chế độ chạy, hai dấu và nối lệnh sau chỉ chạy khi lệnh
      trước thành công. Dấu gạch đứng đưa đầu ra lệnh trái vào lệnh phải, lọc giữ
      dòng có chuỗi cho trước, rồi cắt bỏ vài ký tự đầu mỗi dòng. Cuối cùng là hàm
      với đối số đầu và đối số hai, lấy đầu ra lệnh gán vào biến, chờ một lúc, và
      phép so sánh chọn việc làm.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ nhỏ</th></tr><tr><td><code>for
      d in a b c; do … done</code></td><td>lặp: <code>d</code> lần lượt là <code>a</code>,
      <code>b</code>, <code>c</code>; mỗi lần chạy các dòng giữa <code>do</code> và
      <code>done</code></td><td><code>&#36;d</code> là giá trị hiện tại của <code>d</code></td></tr><tr><td><code>implementation
      ''org.apache.commons:commons-lang3:3.9''</code></td><td>Gradle: một phụ thuộc
      viết gọn thành <code>nhóm:tên:bản</code></td><td><code>mavenCentral()</code>
      là kho tải thư viện</td></tr><tr><td>phiên bản dạng khoảng, <code>latest</code></td><td>khoảng
      như <code>[3.0,4.0)</code>: bản nào trong khoảng cũng được; <code>latest</code>:
      bản mới nhất ở thời điểm dựng, nên mỗi lần dựng có thể một khác</td><td><code>[3.0,4.0)</code>
      gồm 3.0, không gồm 4.0</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Tiếp theo là vòng lặp liệt kê từng giá trị. Một phụ thuộc của công cụ dựng
      thứ hai viết gọn thành nhóm, tên và bản. Phiên bản dạng khoảng hay chữ mới nhất
      cho phép nhiều bản, nên mỗi lần dựng có thể một khác.
