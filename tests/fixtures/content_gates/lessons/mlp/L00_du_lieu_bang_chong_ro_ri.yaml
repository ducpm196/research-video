- id: pitfalls
  kind: pitfall
  title: Ba sai lầm làm sụp hệ thống học máy
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (-30đ):</b>
      Gọi <code>StandardScaler().fit_transform(X)</code> trước <code>train_test_split</code>.<br><b>Lỗi 2 (-20đ):</b>
      Quên <code>stratify=y</code> làm một tập thiếu lớp khi mẫu ít hoặc lệch.<br><b>Lỗi 3 (-10đ):</b> Gọi lại <code>fit_transform(X_test)</code>
      thay vì <code>transform(X_test)</code> khi đánh giá.</div></td></tr></table>
    say: Hãy lưu ý ba sai lầm khiến điểm mô hình ngoài thực tế tụt sâu so với lúc thử nghiệm. Lỗi nặng nhất là gọi
      chuẩn hóa trước khi chia tập. Thứ hai là quên giữ nguyên tỉ lệ nhãn, và thứ ba là gọi nhầm lệnh khớp lại trên
      tập kiểm tra thay vì chỉ biến đổi. Bạn hãy rà soát từng lỗi trên trước khi chuyển sang phần tự làm bài tập
      thực hành trên máy.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
