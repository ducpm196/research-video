- id: sym
  kind: symbol
  title: Viết trong mã → Đọc và hiểu là
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>train_test_split(X,
      y, stratify=y)</code></td><td>Chia giữ nguyên tỉ lệ nhãn ở hai tập, đặt random_state=42</td></tr><tr><td><code>StandardScaler()</code></td><td>Đưa
      mỗi cột về trung bình 0 và phương sai đơn vị</td></tr><tr><td><code>Pipeline([('sc', ...), ('clf', ...)])</code></td><td>Chuỗi
      xử lý khép kín fit từ Train và suy luận sang Test</td></tr><tr><td><code>mean_</code></td><td>Thuộc tính lưu
      vector trung bình cột đã học từ tập Train</td></tr></table>
    say: Bảng trên giải thích từng thành phần viết trong mã nguồn để bạn nhìn vào là đọc hiểu ngay. Hàm chia tách
      nhận thêm tham số giữ cân bằng tỉ lệ nhãn và hạt giống bốn hai để kết quả lặp lại y hệt nhau. Bộ chuẩn hóa
      đưa cột về cùng thang đo, còn đối tượng Pipeline xâu chuỗi gọn gàng hai bước ấy.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
