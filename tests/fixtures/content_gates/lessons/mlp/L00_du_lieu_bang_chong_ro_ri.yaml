scenes:
- id: hook
  kind: hook
  title: Dữ liệu bảng & Pipeline chia Train/Val/Test chống rò rỉ
  checks:
  - 80 + 20 == 100
  - abs(0.0) < 1e-9
  steps:
  - show: <div class='box key'><p>Chia <b>100 mẫu</b> tỉ lệ 80/20 có <code>80 mẫu Train</code> và <code>20 mẫu Test</code>.
      Khớp <b>Pipeline</b> giữ thống kê Test nằm ngoài lúc <code>fit()</code>, triệt tiêu hoàn toàn <b>rò rỉ dữ
      liệu</b> (độ lệch = <b>0</b>).</p></div>
    say: Rò rỉ dữ liệu là khi thông tin phân phối của tập kiểm tra vô tình thấm ngược vào bước huấn luyện mô hình.
      Nếu bạn gọi bộ chuẩn hóa trên toàn bộ bảng dữ liệu rồi mới chia đôi. Điểm số lúc thử nghiệm sẽ cao giả tạo
      vì mô hình đã nhìn trộm biên độ tương lai. Hôm nay ta dùng chuỗi xử lý khép kín để bảo đảm phần kiểm tra hoàn
      toàn vô hình khi khớp tham số.
    clear: true
    introduces:
    - mlp_leakage
    - mlp_pipeline
