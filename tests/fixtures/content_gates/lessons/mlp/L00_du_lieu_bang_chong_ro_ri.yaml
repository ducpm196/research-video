- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 80 + 20 == 100
  - abs(0.0) < 1e-9
  steps:
  - show: <div class='box key'><p><b>1. Chuẩn hóa đúng (chỉ từ Train):</b> <code>z = (x - mean_train) / std_train</code>.</p><p><b>2.
      Pipeline:</b> gói chuỗi biến đổi <code>fit_transform(X_train)</code> rồi <code>transform(X_test)</code> tự
      động trong một đối tượng.</p></div>
    say: Trên màn hình là công thức chuẩn hóa đúng nguyên tắc tách biệt hoàn toàn giữa huấn luyện và kiểm tra. Ta
      định nghĩa rò rỉ dữ liệu là việc tính trung bình và độ lệch chuẩn bằng dữ liệu gộp chung cả hai tập. Còn Pipeline
      là chuỗi xử lý đóng gói hai bước khớp và biến đổi, giúp mọi thước đo chỉ học duy nhất trên phần huấn luyện.
      Vì vậy công thức định lượng giúp kiểm soát sai số và biến đổi mô hình minh bạch hơn.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật trên CPU với dữ liệu chuẩn
  checks:
  - 80 + 20 == 100
  - abs(0.0) < 1e-9
  steps:
  - show: <p><b>Thực nghiệm Python (.venv-ml)</b></p><div class="code"><div>from sklearn.datasets import make_classification</div><div>from
      sklearn.model_selection import train_test_split</div><div>from sklearn.preprocessing import StandardScaler</div><div>from
      sklearn.linear_model import LogisticRegression</div><div>from sklearn.pipeline import Pipeline</div><div>X,
      y = make_classification(n_samples=120, n_features=4, random_state=42)</div><div>X_tr, X_te, y_tr, y_te = train_test_split(X,
      y, test_size=0.25, stratify=y, random_state=42)</div><div>pipe = Pipeline([('sc', StandardScaler()), ('clf',
      LogisticRegression(random_state=42))])</div><div>pipe.fit(X_tr, y_tr)</div><div>print(f'tr_n={len(X_tr)} te_n={len(X_te)}
      acc={pipe.score(X_te, y_te):.3f}')</div></div>
    say: Đoạn mã tạo một trăm hai mươi mẫu chuẩn bằng hạt giống bốn hai, rồi tách chín mươi mẫu huấn luyện và ba
      mươi mẫu kiểm tra. Nhờ bọc bộ chuẩn hóa và hồi quy vào cùng một chuỗi khép kín, lời gọi khớp chỉ tiếp xúc
      đúng phần chín mươi mẫu đầu. Ta chạy thực nghiệm này vì cần đo trực tiếp hành vi trên dữ liệu thật.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (scikit-learn / PyTorch CPU)</b></p><div class="code"><div>tr_n=90 te_n=30 acc=0.867</div></div>
    say: Đầu ra chạy thật trên CPU xác nhận kích thước hai tập đúng chuẩn chín mươi và ba mươi. Độ chính xác kiểm
      tra phản ánh trung thực năng lực mô hình vì tập kiểm tra chưa từng tham gia bước tính thang đo.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chứng đối lập độc lập
  checks:
  - 80 + 20 == 100
  - abs(0.0) < 1e-9
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import numpy as np</div><div>from sklearn.preprocessing
      import StandardScaler</div><div>X_tr = np.array([[0.0], [2.0]]); X_te = np.array([[10.0]])</div><div>sc_ok
      = StandardScaler().fit(X_tr)</div><div>sc_leak = StandardScaler().fit(np.vstack([X_tr, X_te]))</div><div>print(f'ok_mean={sc_ok.mean_[0]:.2f}
      leak_mean={sc_leak.mean_[0]:.2f}')</div></div>
    say: Để kiểm chứng tận mắt độ sai lệch khi làm ẩu, ta thử trên tập huấn luyện chỉ gồm hai số không và hai, còn
      tập kiểm tra chứa giá trị mười. Ta so sánh trung bình của bộ chuẩn hóa khớp sạch chỉ trên phần huấn luyện
      với bộ chuẩn hóa gộp chung cả hai tập. Phép kiểm chứng này rất quan trọng vì đối chiếu độc lập giúp phát hiện
      ngay sai lệch.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>ok_mean=1.00 leak_mean=4.00</div></div>
    say: Kết quả đối chiếu tách bạch rất rõ giữa hai cách làm. Bộ sạch cho trung bình bằng một, còn bộ rò rỉ bị
      kéo vọt lên bốn phẩy không do giá trị mười từ tập kiểm tra đã lọt sang lúc khớp.
    focus:
    - 1
    - 2
    clear: true
