  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Bằng <code><b>1.0</b></code> (trung bình của
      <code>[0, 2]</code>); tuyệt đối không tính phần tử <code>10</code> của Test.</p></td></tr></table>
    say: 'Đáp án câu một: trung bình hợp lệ đúng bằng một, vì chỉ được tính trên hai giá trị không và hai của phần
      huấn luyện.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Vì <code>fit_transform</code> học mean và
      std mới ngay trên tập Test, phá hỏng quy chuẩn so sánh và rò rỉ dữ liệu.</p></td></tr></table>
    say: 'Đáp án câu hai: vì nó tính lại trung bình và độ lệch chuẩn mới trên chính tập kiểm tra, làm hỏng thước
      đo đồng nhất và gây rò rỉ dữ liệu.'
    clear: true
