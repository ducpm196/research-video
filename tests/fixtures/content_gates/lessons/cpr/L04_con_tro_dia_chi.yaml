      fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="490.0" y="96" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Con trỏ p</text><text x="490.0" y="128" font-size="15" text-anchor="middle"
      fill="#475569">Giữ địa chỉ 0x7000</text><line x1="610" y1="102" x2="700" y2="102" stroke="#475569" stroke-width="2"/><polygon
      points="700,102 692.0,107.0 692.0,97.0" fill="#475569"/><text x="655" y="94" font-size="14" font-weight="600"
