scenes:
- id: hook
  kind: hook
  title: Làm sao một hàm sửa trực tiếp biến gốc ở bên ngoài?
  checks:
  - 10 != 25
  steps:
  - show: <div class='box key'><p>Ở bài 2, hàm hoán đổi thất bại vì chỉ sửa bản sao. Thay vì gửi giá trị <b>10</b>
      và <b>25</b>, ta gửi <b>địa chỉ ô nhớ</b> nơi hai biến đang nằm.</p><p>Biến đặc biệt chứa con số địa chỉ ấy
      là chìa khoá để C làm việc trực tiếp với bộ nhớ bên ngoài hàm.</p></div>
    say: Chào bạn, ở bài 2 hàm hoán đổi thất bại vì chỉ cầm bản sao giá trị. Hôm nay ta giải quyết dứt điểm bài
      toán đó bằng cách gửi thẳng con số địa chỉ ô nhớ của biến gốc vào hàm. Nhờ nắm đúng địa chỉ nhà, hàm mới có
      quyền mở cửa bước vào sửa giá trị thực sự.
    focus:
    - 0
    - '1.1'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>liên kết với địa chỉ ô nhớ</th></tr><tr><td>Mọi biến nằm
      tại ô nhớ RAM với địa chỉ 8 byte trên hệ 64-bit (L00)</td><td>Địa chỉ này là số nguyên xác định vị trí bắt
      đầu của biến</td></tr><tr><td>Hàm chỉ nhận bản sao đối số (L02)</td><td>Bản sao của địa chỉ vẫn trỏ tới đúng
      ô nhớ gốc</td></tr></table>
    say: Nhớ lại bài 0 và bài 2 trước khi viết ký hiệu mới. Trên hệ thống sáu mươi bốn bít, mọi biến đều có địa
      chỉ tám bai cố định trên bộ nhớ RAM. Dù hàm chỉ nhận bản sao của địa chỉ đó thì con số địa chỉ vẫn trỏ trúng
      ngay ô nhớ gốc.
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và quy ước mới
  steps:
  - show: '<table class=''t''><tr><th>ký hiệu mới</th><th>tên gọi và tác dụng</th></tr><tr><td><code>&amp;x</code></td><td>Lấy
      địa chỉ ô nhớ của biến <code>x</code></td></tr><tr><td><code>int *p</code></td><td>Khai báo biến con trỏ <code>p</code>
      chứa địa chỉ của một biến <code>int</code></td></tr><tr><td><code>*p</code></td><td>Giải tham chiếu: đọc hoặc
      ghi trực tiếp vào ô nhớ mà <code>p</code> đang trỏ tới</td></tr><tr><td><code>NULL</code></td><td>Địa chỉ
      rỗng đặc biệt báo hiệu con trỏ hiện không trỏ tới biến nào</td></tr></table>'
    say: Bảng này giải mã bốn ký hiệu trọng tâm của con trỏ trong C. Dấu và đứng trước biến lấy địa chỉ ô nhớ của
      biến đó. Dấu sao khi khai báo biến tạo thành con trỏ giữ địa chỉ, còn dấu sao đứng trong biểu thức nghĩa là
      đọc hoặc ghi tại ô nhớ đích. Cuối cùng là giá trị rỗng chuẩn báo hiệu con trỏ chưa trỏ tới đâu.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    introduces:
    - cpr_con_tro
- id: intuition
  kind: intuition
  title: Gửi địa chỉ nhà thay vì gửi bản photo tờ giấy
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="40" y="50" width="230" height="105"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="155.0" y="96" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Biến gốc x</text><text x="155.0" y="128" font-size="15" text-anchor="middle"
