      stroke="#16a34a" stroke-width="2"/><text x="810.0" y="96" font-size="18" font-weight="700" text-anchor="middle"
      fill="#1e293b">Ô nhớ 0x7000</text><text x="810.0" y="128" font-size="15" text-anchor="middle" fill="#475569">x
