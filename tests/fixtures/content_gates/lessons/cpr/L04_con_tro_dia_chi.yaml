    say: 'Nhìn sơ đồ: biến gốc x nằm tại ô nhớ đánh địa chỉ hệ thập lục phân bảy nghìn. Toán tử lấy địa chỉ đưa
      đúng con số vị trí ấy cất vào biến con trỏ p. Khi hàm thực hiện phép ghi qua dấu sao giải tham chiếu, giá
      trị tại đúng ô nhớ địa chỉ bảy nghìn đổi từ mười thành chín mươi chín. Hai khái niệm vị trí ô nhớ và giá trị
      bên trong ô nhớ luôn đi đôi nhưng hoàn toàn khác vai trò.'
    clear: true
- id: formula
  kind: formula
  title: Luật đọc/ghi an toàn qua con trỏ
  checks:
  - 10 + 15 == 25
  steps:
  - show: '<div class=''box key''><p>Ba quy tắc bất di bất dịch:</p><ol><li>Khởi tạo ngay lúc tạo: <code>int *p
      = &amp;x;</code> hoặc <code>int *p = NULL;</code></li><li>Chỉ giải tham chiếu sau khi kiểm: <code>if (p !=
      NULL) { *p = ...; }</code></li><li>Không trộn kiểu trỏ: địa chỉ của <code>int</code> đi với <code>int *</code>,
      của <code>double</code> đi với <code>double *</code>.</li></ol></div>'
    say: Ba quy tắc bảo vệ sau giúp tránh gần hết lỗi con trỏ kinh điển. Bạn hãy luôn gán giá trị ban đầu ngay khi
      khai báo biến trỏ. Sau đó luôn kiểm tra khác rỗng trước khi ghi và giữ đúng kiểu dữ liệu đích.
    focus:
    - 0
    - '1.1'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên GCC: hàm hoán đổi thật qua địa chỉ'
  checks:
  - '(lambda a, b: (b, a))(10, 25) == (25, 10)'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã C</th><th>nghĩa dễ hiểu</th></tr><tr><td><code>static void swap_ptr(int
      *pa, int *pb)</code></td><td>Hàm nhận hai địa chỉ kiểu <code>int *</code> để sửa trực tiếp biến gốc</td></tr><tr><td><code>swap_ptr(&amp;a,
      &amp;b);</code></td><td>Truyền địa chỉ của hai biến gốc từ <code>main</code> vào hàm</td></tr><tr><td><code>||</code>
      (HOẶC logic)</td><td>Đúng nếu ít nhất một vế đúng: <code>pa == NULL || pb == NULL</code></td></tr><tr><td><code>if
      (q)</code> / <code>0x7000</code></td><td><code>if (q)</code> viết gọn của <code>q != NULL</code>; <code>0x...</code>
      là số địa chỉ hệ thập lục phân</td></tr></table>'
    say: Ta giải mã đủ bốn ký hiệu trước khi đọc mã nguồn. Tham số nhận hai địa chỉ kiểu số nguyên, câu lệnh phép
      hoặc loại trừ ngay khi một con trỏ rỗng. Cách viết rút gọn kiểm tra trực tiếp con trỏ khác rỗng ngay trước
      dấu sao giải tham chiếu.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
  - show: '<p><b>Hoán đổi thật qua con trỏ và kiểm tra NULL an toàn</b></p><div class="code"><div>#include &lt;stdio.h&gt;</div><div>static
      void swap_ptr(int *pa, int *pb) {</div><div>    if (pa == NULL || pb == NULL) return;</div><div>    int tmp
      = *pa; *pa = *pb; *pb = tmp;</div><div>}</div><div>int main(void) {</div><div>    int a = 10, b = 25;</div><div>    swap_ptr(&amp;a,
      &amp;b);</div><div>    printf("after: a=%d b=%d\n", a, b);</div><div>    return 0;</div><div>}</div></div>'
    say: Hàm hoán đổi nhận vào hai con trỏ, chủ động kiểm tra cả hai đều khác rỗng trước khi giải tham chiếu. Nhờ
      trỏ trúng hai biến gốc, biến tạm bên trong hàm đổi được trực tiếp giá trị nằm ngoài hàm chính.
    focus:
    - 1
    - 2
    clear: true
  - show: '<p><b>Kết quả chạy thật (GCC)</b></p><div class="code"><div>after: a=25 b=10</div></div>'
    say: Đầu ra chạy thật cho thấy biến a và biến b ở hàm chính đã thực sự hoán đổi thành hai mươi lăm và mười.
      Phép hoán đổi này thành công hoàn toàn khác hẳn kết quả thất bại ở bài trước.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: 'Đường khác: dùng con trỏ trả về nhiều kết quả cùng lúc'
  checks:
  - 29 // 6 == 4
  - 29 % 6 == 5
  steps:
  - show: <p><b>Hàm trả cả phần nguyên và phần dư thông qua hai con trỏ đầu ra</b></p><div class="code"><div>#include
      &lt;stdio.h&gt;</div><div>static void divmod_i(int x, int d, int *q, int *r) {</div><div>    if (q) *q = x
      / d;</div><div>    if (r) *r = x % d;</div><div>}</div><div>int main(void) {</div><div>    int thuong = 0,
      du = 0;</div><div>    divmod_i(29, 6, &amp;thuong, &amp;du);</div><div>    printf("q=%d r=%d\n", thuong, du);</div><div>    return
      0;</div><div>}</div></div>
    say: Ở đường kiểm chứng thứ hai, ta giải bài toán trả về cả phần thương lẫn phần dư chỉ trong một lần gọi hàm.
      Vì ngôn ngữ C chỉ cho phép trả về một giá trị trực tiếp nên hàm kiểm tra khác rỗng rồi ghi song song hai kết
      quả qua hai con trỏ đầu ra.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>q=4 r=5</div></div>
    say: Đầu ra thật xác nhận thương bằng bốn và số dư bằng năm, nghĩa là hai mươi chín bằng sáu nhân bốn cộng năm
      khớp tuyệt đối mà vẫn an toàn trước con trỏ rỗng.
    clear: true
- id: quymo
  kind: example
  title: 'Bảng quy mô: chi phí truyền struct lớn theo giá trị vs qua con trỏ'
  checks:
  - 1_000_000 * 8 == 8_000_000
  - 4096 // 8 == 512
  steps:
  - show: <table class='t'><tr><th>số lượt gọi hàm truyền cấu trúc 4 KB</th><th>chép nguyên khối (tham trị)</th><th>truyền
      địa chỉ con trỏ (8 byte)</th></tr><tr><td><span style='white-space:nowrap'>100 lượt (×1)</span></td><td>400
      KB sao chép</td><td>800 byte địa chỉ</td></tr><tr><td><span style='white-space:nowrap'>10 000 lượt (×100)</span></td><td>40
      MB sao chép</td><td>80 KB địa chỉ</td></tr><tr><td><span style='white-space:nowrap'>1 000 000 lượt (×10 000)</span></td><td>4
      GB sao chép</td><td>8 MB địa chỉ (nhanh hơn ~500 lần)</td></tr></table>
    say: Ngoài việc sửa giá trị gốc, truyền địa chỉ còn tránh sao chép khối dữ liệu lớn. Ở mức một trăm lượt truyền
      cấu trúc bốn ki-lô-bai, truyền địa chỉ chỉ tốn tám trăm bai so với bốn trăm ki-lô-bai. Khi tăng lên một triệu
      lượt gọi hàm, truyền bản sao tốn bốn gi-ga-bai sao chép, còn truyền địa chỉ chỉ tốn tám mê-ga-bai, nhanh hơn
      gấp năm trăm lần.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp, kể cả người đã đi làm
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: Khai báo <code>int *p;</code> không gán giá trị rồi ghi <code>*p = 5;</code>.</b> Con trỏ mang địa chỉ
      rác làm sập chương trình ngay.<br><b>Lỗi 2: Giải tham chiếu con trỏ <code>NULL</code> khi chưa kiểm tra.</b>
      Luôn kiểm <code>if (p != NULL)</code> ở ranh giới hàm.<br><b>Lỗi 3: Trả về địa chỉ biến cục bộ <code>int x
      = 5; return &amp;x;</code>.</b> Khung ngăn xếp của hàm vừa bị huỷ, địa chỉ trả về thành con trỏ treo.</div></td></tr></table>'
    say: Có ba lỗi nghiêm trọng rất hay gặp khi mới làm việc với con trỏ. Lỗi thứ nhất là khai báo con trỏ chưa
      khởi tạo chứa địa chỉ rác rồi ghi thẳng vào đó. Lỗi thứ hai là quên kiểm tra khác rỗng trước khi giải tham
      chiếu. Lỗi thứ ba là trả về địa chỉ của một biến cục bộ vừa hết hạn.
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 12 + 8 == 20
  steps:
  - show: <ol><li>Cho <code>int a = 12; int *p = &amp;a; *p = *p + 8;</code> — sau ba lệnh, <code>a</code> bằng
      bao nhiêu?</li><li>Viết lệnh kiểm tra an toàn bắt buộc trước khi ghi vào <code>*out</code> trong hàm?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, biến a giữ mười hai, con trỏ p trỏ tới a, rồi tăng giá trị tại ô nhớ
      đích thêm tám đơn vị thì a bằng bao nhiêu? Câu hai, viết điều kiện kiểm tra bắt buộc trước khi ghi vào giá
      trị tại con trỏ đầu ra. Dừng vi-đê-ô và trả lời.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>*p</code> sửa trực tiếp ô nhớ của <code>a</code>
      nên $a = 12 + 8 = \hl{20}$.</p></td></tr></table>
    say: 'Đáp án câu một: ghi qua con trỏ làm biến a tăng từ mười hai lên hai mươi.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Luôn kiểm <code>if (out != NULL)</code> trước
      khi gán <code>*out = ...</code>.</p></td></tr></table>
    say: 'Đáp án câu hai: luôn kiểm tra con trỏ khác rỗng trước khi giải tham chiếu.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm bài thực hành C và chấm thật
  lab: labs/CPR/L04
  steps:
  - show: <div class='box key'><p><b>Bài thực hành L04:</b> mở đề tại <code>labs/CPR/L04/de.md</code>, viết mã C
      chuẩn C11 vào một tệp tạm rồi mở <b>Git Bash</b> (cài ở <code>Start → Git → Git Bash</code> hoặc chuột phải
      thư mục chọn <b>Open Git Bash here</b>) và chạy lệnh chấm thật bằng trình biên dịch G C C:</p><p><code>bash
      labs/cham.sh CPR L04 duong_dan/bai_cua_ban.c</code></p></div>
    say: Bây giờ đến phần bạn tự viết mã C và chấm thật trên máy. Bạn mở đề thực hành, viết lời giải vào tệp riêng,
      rồi mở cửa sổ dòng lệnh để chạy trình chấm biên dịch và đối chiếu kết quả. Hãy bấm tạm dừng và tự làm trước.
    clear: true
    pause: 30
  - show: '<p><b>Kết quả mong đợi cần khớp 100% (2 dòng)</b></p><div class="code"><div>swap: x=99 y=42</div><div>divmod:
      q=9 r=2</div></div>'
