# Giáo án KẾ HOẠCH — AIF · Nền tảng trí tuệ nhân tạo (tìm kiếm, ràng buộc, trò chơi, lôgic, lập kế hoạch, suy diễn xác suất)
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã AIF:Lxx (BFS thật trên 8-puzzle, vét cạn, lặp giá trị).
# Căn cứ phạm vi: CS2023 — Artificial Intelligence (AI): “Fundamental Issues”, “Search”, “Fundamental Knowledge Representation and Reasoning”,
#   “Planning”, “Reasoning Under Uncertainty” (“1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98);
#   S. Russell, P. Norvig, Artificial Intelligence: A Modern Approach (AIMA), bản 4 (2020) — các ví dụ kinh điển (8-puzzle, 8 hậu, bản đồ Úc,
#   cây minimax ba nhánh, mạng báo trộm, thế giới lưới 4×3) được TÍNH LẠI bằng máy, không chép số.
# Vì sao cần: CS115 dạy học máy và học sâu (L00–L44), CS112 dạy duyệt đồ thị, RBM L15 có A* trên lưới; nhưng chưa khoá nào dạy AI dựa trên
#   tìm kiếm, ràng buộc, lôgic, lập kế hoạch — nền của AI agent (khoá AGT) và của mọi hệ suy luận.
# Thứ tự học: sau CS112 L07, L14, L24; DMS L00–L02; CS115 L13 (xác suất có điều kiện), L39 (MDP, Bellman).
course: AIF
status: planned
lessons:
  - id: L00
    title: "Tác tử và môi trường: mô tả bài toán AI"
    spec: lessons/aif/L00_tac_tu_moi_truong.yaml
    requires: []
    requires_ext: ["CS115:L00"]
    objectives: ["Mô tả tác tử bằng hiệu năng, môi trường, cơ cấu chấp hành, cảm biến", "Phân loại môi trường theo năm tiêu chí", "Hiểu tác tử hợp lý là tối đa hoá hiệu năng kỳ vọng"]
    example: "máy hút bụi trên 2 ô: 2 vị trí × 2² trạng thái bẩn–sạch = 8 trạng thái; tác tử phản xạ đơn giản đủ cho môi trường này (VER AIF:L00)"
    fix: ["Tác tử “hợp lý” là tối đa hoá hiệu năng KỲ VỌNG theo những gì nó biết — không phải toàn tri"]
  - id: L01
    title: "Bài toán tìm kiếm: trạng thái, hành động, tìm theo chiều rộng và chi phí đều"
    spec: lessons/aif/L01_bai_toan_tim_kiem.yaml
    requires: [L00]
    requires_ext: ["CS112:L07", "CS112:L24"]
    objectives: ["Phát biểu bài toán tìm kiếm bằng năm thành phần", "So sánh tìm theo chiều rộng và tìm chi phí đều", "Hiểu vì sao cần tập đã thăm"]
    example: "8-puzzle có 9!/2 = 181 440 trạng thái đạt được từ một trạng thái cho trước — BFS thật duyệt đúng 181 440 trạng thái (VER AIF:L01)"
    fix: ["Tìm theo chiều rộng tối ưu chỉ khi mọi bước có cùng chi phí"]
  - id: L02
    title: "Tìm kiếm có thông tin: A* và hàm đánh giá chấp nhận được"
    spec: lessons/aif/L02_a_sao.yaml
    requires: [L01]
    requires_ext: ["RBM:L15"]
    objectives: ["Giải thích f = g + h", "Kiểm một hàm đánh giá có chấp nhận được không", "Thấy hàm đánh giá tốt giảm số nút phải mở"]
    example: "8-puzzle (trạng thái 7 2 4 / 5 _ 6 / 8 3 1): số ô sai chỗ h₁ = 8, tổng khoảng cách Manhattan h₂ = 18, chi phí thật (BFS) = 26 → cả hai không vượt chi phí thật (VER AIF:L02)"
    fix: ["h chấp nhận được là KHÔNG BAO GIỜ đánh giá quá chi phí thật — đoán thấp thì an toàn, đoán cao làm mất tính tối ưu"]
  - id: L03
    title: "Thiết kế hàm đánh giá: nới lỏng bài toán, trội, hệ số nhánh hiệu dụng"
    spec: lessons/aif/L03_thiet_ke_ham_danh_gia.yaml
    requires: [L02]
    objectives: ["Tạo hàm đánh giá bằng cách nới lỏng luật", "Hiểu trội và lấy lớn nhất của nhiều hàm", "Đo chất lượng hàm đánh giá bằng hệ số nhánh hiệu dụng"]
    example: "A* mở 52 nút để tìm lời giải độ sâu 5 → hệ số nhánh hiệu dụng b* thoả 1 + b* + … + b*⁵ = 53, b* ≈ 1,92 (VER AIF:L03)"
    fix: ["h₂ trội h₁ (h₂ ≥ h₁ ở mọi trạng thái) thì A* với h₂ không mở nhiều nút hơn (trừ chênh lệch nhỏ do phá hoà) — trội, không phải “trung bình lớn hơn”"]
  - id: L04
    title: "Tìm kiếm cục bộ: leo đồi, khởi động lại ngẫu nhiên, mô phỏng tôi luyện"
    spec: lessons/aif/L04_tim_kiem_cuc_bo.yaml
    requires: [L03]
    objectives: ["Giải thích cực tiểu địa phương và cao nguyên", "Ước lượng lợi ích của khởi động lại ngẫu nhiên", "Hiểu vai trò của nhiệt độ trong mô phỏng tôi luyện"]
    example: "8 hậu, leo đồi dốc nhất từ trạng thái ngẫu nhiên: mô phỏng 5000 lần thành công ≈ 14,9%, trung bình ≈ 4 bước khi thành công, ≈ 3 bước khi kẹt (VER AIF:L04)"
    fix: ["Leo đồi không đầy đủ — kẹt ở cực đại địa phương không có nghĩa là bài toán vô nghiệm"]
  - id: L05
    title: "Bài toán thoả ràng buộc: quay lui, lan truyền ràng buộc, chọn biến ít giá trị nhất"
    spec: lessons/aif/L05_thoa_rang_buoc.yaml
    requires: [L01]
    requires_ext: ["CS112:L14", "DMS:L18"]
    objectives: ["Mô hình hoá bằng biến, miền giá trị, ràng buộc", "Chạy quay lui có kiểm tra tiến", "Dùng chọn biến còn ít giá trị nhất"]
    example: "tô 3 màu bản đồ 7 vùng của Úc (Tasmania không giáp vùng nào): vét cạn 3⁷ = 2187 cách gán, đúng 18 lời giải (VER AIF:L05)"
    fix: ["Lan truyền ràng buộc thu hẹp miền giá trị nhưng không thay thế được tìm kiếm khi còn nhiều giá trị"]
  - id: L06
    title: "Trò chơi đối kháng: cực đại–cực tiểu và cắt tỉa alpha–beta"
    spec: lessons/aif/L06_tro_choi_doi_khang.yaml
    requires: [L01]
    objectives: ["Tính giá trị cực đại–cực tiểu của cây trò chơi", "Chạy cắt tỉa alpha–beta và chỉ ra lá bị bỏ", "Hiểu vì sao thứ tự xét nước đi quyết định lượng cắt tỉa"]
    example: "cây 3 nhánh, lá (3, 12, 8), (2, 4, 6), (14, 5, 2): giá trị minimax = 3; alpha–beta chỉ xét 7 trong 9 lá (VER AIF:L06)"
    fix: ["Thứ tự xét nước đi quyết định cắt tỉa được bao nhiêu — xếp nước tốt trước"]
  - id: L07
    title: "Tìm kiếm cây Monte Carlo và công thức UCB1"
    spec: lessons/aif/L07_cay_mo_phong_ngau_nhien.yaml
    requires: [L06]
    requires_ext: ["CS115:L13"]
    objectives: ["Mô tả bốn bước chọn, mở rộng, mô phỏng, lan truyền ngược", "Tính UCB1 và giải thích cân bằng khai thác–khám phá", "Biết chọn nước đi cuối cùng theo số lượt thăm"]
    example: "sau 13 lần mô phỏng: nước A thắng 7/10, nước B thắng 1/3; chỉ nhìn tỉ lệ thắng thì chọn A, nhưng UCB1 = tỉ lệ thắng + √(2 ln 13 / n) cho A ≈ 1,416, B ≈ 1,641 → thử B thêm để khám phá (VER AIF:L07)"
    fix: ["Chọn nước để CHƠI cuối cùng dựa vào số lần thăm, không dựa vào UCB1"]
  - id: L08
    title: "Lôgic mệnh đề cho tác tử: mô hình, kéo theo lôgic, kiểm mô hình"
    spec: lessons/aif/L08_logic_menh_de.yaml
    requires: [L00]
    requires_ext: ["DMS:L00", "DMS:L01"]
    objectives: ["Phân biệt mô hình, thoả được và kéo theo lôgic", "Kiểm KB ⊨ α bằng liệt kê mô hình", "Nhận ra lỗi khẳng định hệ quả"]
    example: "KB = {P ⇒ Q, Q ⇒ R, P}: trong 8 mô hình chỉ 1 mô hình thoả KB, và R đúng ở đó → KB ⊨ R (VER AIF:L08)"
    fix: ["KB ⊨ α nghĩa là α đúng ở MỌI mô hình của KB, không phải ở một mô hình nào đó"]
  - id: L09
    title: "Suy diễn tiến, suy diễn lùi và luật Horn"
    spec: lessons/aif/L09_suy_dien_tien_lui.yaml
    requires: [L08]
    objectives: ["Chạy suy diễn tiến đến khi không suy thêm được", "Chạy suy diễn lùi từ một mục tiêu", "So sánh hai chiều và giới hạn của luật Horn"]
    example: "luật Horn A ∧ B ⇒ L, A ∧ P ⇒ L, B ∧ L ⇒ M, L ∧ M ⇒ P, P ⇒ Q với sự kiện A, B: suy diễn tiến suy ra L, M, P, Q theo đúng thứ tự đó (VER AIF:L09)"
    fix: ["Suy diễn tiến/lùi chỉ đầy đủ cho luật Horn — lôgic mệnh đề tổng quát cần hợp giải hoặc kiểm mô hình"]
  - id: L10
    title: "Lập kế hoạch: biểu diễn hành động bằng điều kiện và hiệu ứng"
    spec: lessons/aif/L10_lap_ke_hoach.yaml
    requires: [L01, L09]
    objectives: ["Biểu diễn hành động bằng tiền điều kiện và hiệu ứng thêm, xoá", "Tìm kế hoạch bằng tìm kiếm trong không gian trạng thái", "Hiểu vì sao đạt từng mục tiêu con riêng lẻ có thể thất bại"]
    example: "thế giới khối A trên B trên C → mục tiêu C trên B trên A: BFS tìm kế hoạch ngắn nhất 3 hành động (A xuống bàn, B lên A, C lên B) (VER AIF:L10)"
    fix: ["Đạt từng mục tiêu con riêng lẻ có thể phá mục tiêu con khác (dị thường Sussman) — phải lập kế hoạch cho cả tổ hợp"]
  - id: L11
    title: "Mạng Bayes: phân rã phân phối đồng thời và suy diễn"
    spec: lessons/aif/L11_mang_bayes.yaml
    requires: [L08]
    requires_ext: ["CS115:L13"]
    objectives: ["Viết phân phối đồng thời bằng tích các bảng điều kiện", "Suy diễn bằng liệt kê", "Nhận ra hiện tượng giải thích loại trừ"]
    example: "mạng báo trộm (trộm 0,001, động đất 0,002): John và Mary cùng gọi → P(trộm | cả hai gọi) ≈ 0,284 (VER AIF:L11)"
    fix: ["Mũi tên trong mạng Bayes không bắt buộc là quan hệ nhân quả — nó mã hoá độc lập có điều kiện"]
  - id: L12
    title: "Lập kế hoạch khi bất định: lặp giá trị và lặp chính sách"
    spec: lessons/aif/L12_lap_gia_tri.yaml
    requires: [L10, L11]
    requires_ext: ["CS115:L39"]
    objectives: ["Viết phương trình Bellman cho quá trình quyết định Markov", "Chạy lặp giá trị và đọc chính sách tối ưu", "Thấy chính sách đổi theo thưởng mỗi bước"]
    example: "thế giới lưới 4×3, thưởng mỗi bước −0,04, đi đúng hướng 0,8: lặp giá trị cho U(ô đầu) ≈ 0,705, U(ô cạnh đích +1) ≈ 0,918 (VER AIF:L12)"
    fix: ["Chính sách tối ưu thay đổi theo thưởng mỗi bước — không phải lúc nào “đi đường ngắn nhất” cũng tốt nhất"]
  - id: L13
    title: "Tổng hợp: khi nào tìm kiếm, khi nào suy luận, khi nào học"
    spec: lessons/aif/L13_tong_hop.yaml
    requires: [L04, L05, L07, L12]
    objectives: ["Chọn cách tiếp cận theo loại môi trường và loại câu hỏi", "Giải thích vì sao trò chơi lớn cần hàm đánh giá học được", "Nối AI cổ điển với học máy"]
    example: "cờ vua: hệ số nhánh ≈ 35, ván ≈ 80 nước → cây cỡ 35⁸⁰ ≈ 10¹²³ nút, không thể duyệt hết → cắt độ sâu + hàm đánh giá (VER AIF:L13)"
    fix: ["Số 35 và 80 là ước lượng trung bình kinh điển, không phải hằng số chính xác"]
  - id: L14
    title: "Tình huống chuyên gia theo dòng thời gian: máy chơi cờ từ Deep Blue tới AlphaZero"
    spec: lessons/aif/L14_hanh_trinh_may_choi_co.yaml
    requires: [L03, L06, L07, L13]
    requires_ext: ["CS115:L19", "CS115:L34", "CS115:L39"]
    kind: journey
    objectives: ["Kể lại hành trình máy chơi cờ qua năm chặng từ 1988 tới 2018, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại tốc độ lý thuyết, hiệu suất song song, cỡ cây cờ vây, số mô phỏng mỗi giây và số ván hoà của trận 1000 ván", "Chọn giữa tìm kiếm có hàm đánh giá viết tay và tự học bằng tự chơi cho trò chơi của chính mình, kèm điều kiện đổi lựa chọn"]
    example: "1997: 30 nút × 16 chip = 480 chip, × 2,5 triệu = 1,2 tỉ thế/giây lý thuyết, đo được 126 triệu → ≈ 10,5% (DB02: 8–12%); cờ vây 250^150 ≈ 10^359; 1600 mô phỏng / 0,4 s = 4000 mỗi giây (AGZ17); 2018: 1000 − 155 − 6 = 839 ván hoà (VER AIF:L14)"
    fix: ["Chỉ khẳng định điều có trong DB02, AG16, AGZ17, AZ17, AZ18 (audit/aif/sources_L14.md); bài Science 2018 trên science.org bị 403 — dạy theo bản truy cập mở và blog DeepMind 6/12/2018", "839 ván hoà là phép tính (nguồn chỉ ghi 155 thắng, 6 thua); trò chơi 30 nước mỗi lượt, 1 triệu thế mỗi giây, 10 giây mỗi ván tự chơi là số minh hoạ", "Không nêu tên kỳ thủ, tác giả trong lời đọc; chuyện ngoài nguồn (nước đi gây tranh cãi, nghi gian lận, tháo dỡ máy) không dạy"]
