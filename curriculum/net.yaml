# Giáo án KẾ HOẠCH — NET · Mạng máy tính và an toàn cơ bản
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã NET:Lxx (85/85 PASS, 2026-10-27).
# Căn cứ phạm vi: CS2023 — Networking and Communication (NC, 7 giờ CS Core, 24 KA Core) và một phần Security (SEC)
#   (“1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98).
# Vì sao cần: robot (điều khiển từ xa, trễ), AI (huấn luyện phân tán, phục vụ mô hình qua mạng), phần mềm (dịch vụ web, bảo mật).
# Thứ tự học: sau CS112 L24 (định tuyến dùng Dijkstra, Bellman-Ford) và DMS L13–L15 (mật mã).
course: NET
status: planned
lessons:
  - id: L00
    title: "Mô hình phân tầng và đóng gói"
    spec: lessons/net/L00_phan_tang_dong_goi.yaml
    requires: []
    requires_ext: ["CS115:L01"]   # dấu ba chấm, chỉ số dưới (ký hiệu nền) học ở CS115 L01
    objectives: ["Kể năm tầng và việc của mỗi tầng", "Tính phần đầu (header) chiếm bao nhiêu"]
    example: "khung Ethernet đầy: 1460 dữ liệu + 20 TCP + 20 IP + 18 Ethernet = 1518 B, hiệu suất 96,2% (VER NET:L00)"
    fix: ["Mô hình 7 tầng OSI là mô hình tham chiếu; Internet dùng chồng giao thức TCP/IP"]
  - id: L01
    title: "Các loại trễ: truyền, lan truyền, xử lý, hàng đợi"
    spec: lessons/net/L01_cac_loai_tre.yaml
    requires: [L00]
    objectives: ["Phân biệt trễ truyền và trễ lan truyền", "Tính trễ đầu–cuối"]
    example: "1500 B ở 100 Mbps: trễ truyền 120 µs; 1000 km ở 2·10⁸ m/s: trễ lan truyền 5 ms (VER NET:L01)"
    fix: ["Băng thông cao không giảm trễ lan truyền (giới hạn bởi tốc độ tín hiệu)"]
  - id: L02
    title: "Thông lượng và tích băng thông–trễ"
    spec: lessons/net/L02_thong_luong_bdp.yaml
    requires: [L01]
    objectives: ["Tính lượng dữ liệu “đang bay” trên đường truyền"]
    example: "100 Mbps × 50 ms = 625 000 B (VER NET:L02)"
    fix: ["Thông lượng đầu–cuối bằng đoạn chậm nhất, không phải trung bình các đoạn"]
  - id: L03
    title: "Phát hiện lỗi: bit chẵn lẻ, checksum, CRC"
    spec: lessons/net/L03_phat_hien_loi.yaml
    requires: [L00]
    requires_ext: ["DMS:L13"]
    objectives: ["Tính CRC bằng phép chia đa thức mod 2", "So sánh khả năng phát hiện lỗi"]
    example: "dữ liệu 11010011101100, đa thức sinh 1011 → phần dư 100 (VER NET:L03)"
    fix: ["Phát hiện lỗi khác sửa lỗi; CRC không chống được kẻ tấn công cố ý (cần mã xác thực)"]
  - id: L04
    title: "Truy cập đường truyền chung, Ethernet và chuyển mạch"
    spec: lessons/net/L04_truy_cap_chung_chuyen_mach.yaml
    requires: [L01]
    objectives: ["Giải thích va chạm và lùi ngẫu nhiên", "Phân biệt bộ chuyển mạch và bộ định tuyến"]
    example: "ALOHA thuần tối đa 1/(2e) ≈ 18,4%; ALOHA chia khe 1/e ≈ 36,8% (VER NET:L04)"
    fix: ["Bộ chuyển mạch học địa chỉ MAC; bộ định tuyến chuyển theo địa chỉ IP"]
  - id: L05
    title: "Địa chỉ IPv4 và chia mạng con"
    spec: lessons/net/L05_ipv4_mang_con.yaml
    requires: [L00]
    requires_ext: ["CSA:L02"]
    objectives: ["Tính địa chỉ mạng, quảng bá, số máy", "Chia một mạng thành các mạng con"]
    example: "192.168.10.0/26: 4 mạng con của một /24, mỗi mạng 62 máy, quảng bá 192.168.10.63 (VER NET:L05)"
    fix: ["Số máy dùng được = 2^(32 − tiền tố) − 2 (bỏ địa chỉ mạng và quảng bá), trừ /31, /32"]
  - id: L06
    title: "CIDR, gom tuyến và khớp tiền tố dài nhất"
    spec: lessons/net/L06_cidr_khop_tien_to.yaml
    requires: [L05]
    objectives: ["Tra bảng định tuyến bằng khớp tiền tố dài nhất"]
    example: "địa chỉ khớp cả /20 (cổng A) và /21 (cổng B) → gửi theo B (VER NET:L06)"
    fix: ["Không chọn mục đầu tiên khớp, mà chọn mục khớp DÀI nhất"]
  - id: L07
    title: "Định tuyến trạng thái liên kết"
    spec: lessons/net/L07_trang_thai_lien_ket.yaml
    requires: [L06]
    requires_ext: ["CS112:L24"]
    objectives: ["Chạy thuật toán chốt đỉnh gần nhất để lập bảng định tuyến", "Giải thích dao động khi trọng số theo tải"]
    example: "dùng lại bản đồ 5 đỉnh của CS112 bài 24: bảng chuyển tiếp từ S suy ra từ cây đường đi ngắn nhất"
    fix: ["Mỗi bộ định tuyến cần toàn bộ bản đồ — chi phí phát tán trạng thái liên kết"]
  - id: L08
    title: "Định tuyến vector khoảng cách và đếm tới vô cùng"
    spec: lessons/net/L08_vecto_khoang_cach.yaml
    requires: [L07]
    requires_ext: ["CS112:L24"]
    objectives: ["Cập nhật bảng bằng phương trình Bellman-Ford", "Giải thích đếm tới vô cùng và chân trời phân tách"]
    example: "liên kết đứt trên đường thẳng A–B–C: B và C đẩy nhau khoảng cách tới A tăng dần 2, 3, 4, … nếu không có cơ chế chặn"
    fix: ["Tin xấu lan chậm, tin tốt lan nhanh"]
  - id: L09
    title: "Tầng vận chuyển: cổng, UDP, TCP và bắt tay ba bước"
    spec: lessons/net/L09_tcp_udp_bat_tay.yaml
    requires: [L00]
    objectives: ["Phân biệt UDP và TCP", "Theo dõi số thứ tự trong bắt tay ba bước"]
    example: "SYN seq = x; SYN-ACK seq = y, ack = x + 1; ACK ack = y + 1"
    fix: ["UDP không có nghĩa là luôn mất gói — nó chỉ không bảo đảm"]
  - id: L10
    title: "Truyền tin cậy: dừng–chờ và cửa sổ trượt"
    spec: lessons/net/L10_dung_cho_cua_so.yaml
    requires: [L09, L02]
    objectives: ["Tính hiệu suất dừng–chờ", "Chọn kích thước cửa sổ theo tích băng thông–trễ"]
    example: "gói 8000 bit, 1 Gbps, RTT 30 ms: dừng–chờ đạt hiệu suất ≈ 0,00027 (VER NET:L10)"
    fix: ["Cửa sổ quá nhỏ làm đường truyền nhanh vẫn chậm"]
  - id: L11
    title: "Điều khiển tắc nghẽn TCP: khởi động chậm và AIMD"
    spec: lessons/net/L11_tac_nghen_tcp.yaml
    requires: [L10]
    objectives: ["Vẽ cửa sổ tắc nghẽn theo thời gian", "Giải thích tăng cộng – giảm nhân"]
    example: "khởi động chậm tới ngưỡng 16 rồi tăng cộng: 1, 2, 4, 8, 16, 17 (VER NET:L11)"
    fix: ["“Khởi động chậm” tăng theo hàm mũ — tên gọi so với việc gửi cả cửa sổ ngay"]
  - id: L12
    title: "Tầng ứng dụng: DNS và HTTP"
    spec: lessons/net/L12_dns_http.yaml
    requires: [L09]
    objectives: ["Mô tả phân giải tên lặp", "Đếm RTT của HTTP bền và không bền"]
    example: "trang HTML + 10 đối tượng, HTTP không bền: 2 + 10·2 = 22 RTT (chưa kể thời gian truyền) (VER NET:L12)"
    fix: ["DNS chủ yếu dùng UDP nhưng chuyển TCP khi trả lời lớn"]
  - id: L13
    title: "Mật mã cơ bản: đối xứng, khoá công khai, trao đổi khoá"
    spec: lessons/net/L13_mat_ma_trao_doi_khoa.yaml
    requires: [L12]
    requires_ext: ["DMS:L15"]
    objectives: ["Phân biệt mã hoá đối xứng và khoá công khai", "Chạy Diffie–Hellman trên số nhỏ"]
    example: "Diffie–Hellman p = 23, g = 5, a = 6, b = 15: hai bên gửi 8 và 19, khoá chung 2 (VER NET:L13)"
    fix: ["Diffie–Hellman không xác thực — cần chữ ký để chống người đứng giữa"]
  - id: L14
    title: "Hàm băm, chữ ký số và chuỗi tin cậy TLS"
    spec: lessons/net/L14_bam_chu_ky_tls.yaml
    requires: [L13]
    objectives: ["Ký và kiểm chữ ký RSA đồ chơi", "Giải thích chứng chỉ và chuỗi tin cậy"]
    example: "n = 33, d = 7, e = 3: ký 4 → 16; kiểm 16³ mod 33 = 4 (VER NET:L14)"
    fix: ["Ký là dùng khoá BÍ MẬT; mã hoá cho người khác là dùng khoá CÔNG KHAI của họ"]
  - id: L15
    title: "Tình huống chuyên gia theo dòng thời gian: kiểm soát tắc nghẽn từ 1986 tới QUIC"
    spec: lessons/net/L15_hanh_trinh_tac_nghen.yaml
    requires: [L02, L09, L11]
    kind: journey
    objectives: ["Kể lại hành trình kiểm soát tắc nghẽn qua bốn chặng 1986, 1988, 2017, 2021–2026, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại con số then chốt của từng chặng", "Chọn thực hành phù hợp với đường truyền của mình, kèm điều kiện"]
    example: "1986: 32 000 → 40 bit/s, giảm 800 lần (J88); đường 10 tỉ bit/s × 100 ms → 125 MB đang bay; 9100 / 3,3 ≈ 2758 (“2700 lần”, G17); bộ đệm 1000 gói 1500 byte ở 10 triệu bit/s → 1,2 s; cửa sổ đầu QUIC với gói 1200 byte = 12 000 byte (RFC 9002 §7.2) (VER NET:L15)"
    fix: ["Chỉ khẳng định điều có trong J88, G17, B26, RFC 9000/9002 (audit/net/sources_L15.md); bài ACM Queue 2016 về BBR không tải được (403) — không dạy số chỉ có ở đó", "“Giảm một nghìn lần” là cách nói tròn của nguồn: 32 000 / 40 = 800", "Gói 1500 byte trong phép tính bộ đệm là giả định minh hoạ", "Không nói QUIC dùng BBR mặc định: RFC 9002 chỉ có bộ điều khiển mẫu giống NewReno, cho phép chọn thuật toán khác"]
