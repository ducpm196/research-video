# Giáo án Khoá BNK · Nền tảng Backend Ngân hàng cho người mất gốc (15 bài, 2026-11-07)
# Căn cứ phạm vi: khoảng trống đã đo ở interview/HANDOVER_INTERVIEW.md Mục 8 (CITED 2026-11-07): thư viện có 628 bài nền (toán, giải thuật, HĐH, mạng, CSDL, hệ phân tán) nhưng
#   không có bài về Spring Boot, PL/SQL và khoá hàng Oracle, luồng ảo Java 21, Redis, ISO 8583, NAPAS, T24. Khoá này lấp đúng các chủ đề phỏng vấn đó, bám 100 câu hỏi ở interview/06.
# Nguồn kiến thức bên ngoài: ghi trong trường `source` của từng bài; Oracle và T24 không có trên máy nên mô phỏng chỉ kiểm logic (NOT_VERIFIED cho cú pháp riêng).
# Thứ tự học: L01–L02 nền Java; L03–L04 dịch vụ web; L05–L07 dữ liệu và bộ đệm; L08–L09 hệ phân tán; L10–L14 nghiệp vụ ngân hàng; L15 tình huống.
course: BNK
profile: stem
status: active
lessons:
- id: L00
  title: 'Java hiện đại: bộ nhớ, đối tượng và bộ thu gom rác'
  spec: lessons/bnk/L00_java_bo_nho_gc.yaml
  requires: []
  requires_ext:
  - JVA:L12
  objectives:
  - Phân biệt dữ liệu nằm trên stack và trên heap
  - Xác định đối tượng nào bị thu gom từ đồ thị tham chiếu
  - Nhận ra rò rỉ bộ nhớ do tham chiếu static
  - Chọn kiểu dữ liệu đúng cho số tiền
  example: Sáu đối tượng, gốc trỏ tới A; sống A, B, C và rác 3 đối tượng, dọn 300 byte (số minh hoạ); cộng 10 lần 0,1 bằng double ra 0.9999999999999999 (VER BNK:L00)
  fix:
  - Rò rỉ bộ nhớ không phải “quên dọn” mà là “vẫn còn tham chiếu”; không dùng double cho tiền
- id: L01
  title: Đa luồng, khoá và luồng ảo Java 21
  spec: lessons/bnk/L01_da_luong_khoa_luong_ao.yaml
  requires:
  - L00
  objectives:
  - Liệt kê mọi cách xen kẽ của hai luồng và nhận ra mất cập nhật
  - Giải thích khoá làm các luồng chạy lần lượt
  - Tính thời gian xử lý theo lô và so với luồng ảo
  - Chọn giữa tăng luồng nền và luồng ảo
  example: 'Số dư 100, nạp 50 và 30 cùng lúc: 6 cách xen kẽ cho 3 kết quả {130, 150, 180}; 10 000 yêu cầu chờ 0,1 giây với 200 luồng mất 5 giây (VER BNK:L01)'
  fix:
  - count += n không nguyên tử; luồng ảo giúp việc chờ, không làm CPU nhanh hơn
- id: L02
  title: 'Spring Boot: bean, proxy và giao dịch'
  spec: lessons/bnk/L02_spring_boot_proxy_giao_dich.yaml
  requires:
  - L01
  objectives:
  - Giải thích Spring tạo bean và trao proxy cho người gọi
  - Dự đoán số giao dịch được mở khi gọi qua proxy hoặc gọi thẳng
  - Nhận ra lỗi gọi hàm cùng lớp làm mất nhãn giao dịch
  - Chọn nơi đặt hàm ghi vết để luôn lưu được
  example: Gọi ghi vết qua proxy mở 2 giao dịch, gọi thẳng this chỉ 1; giao dịch ngoài hỏng thì còn 1 dòng hay 0 dòng (VER BNK:L02)
  fix:
  - Nhãn @Transactional chỉ có tác dụng khi lời gọi đi qua proxy; gọi this bỏ qua nhãn
- id: L03
  title: REST API và khoá lũy đẳng
  spec: lessons/bnk/L03_rest_api_khoa_luy_dang.yaml
  requires:
  - L02
  objectives:
  - Giải thích vì sao thử lại là bình thường trong mạng
  - Tính số tiền bị trừ oan khi không có khoá lũy đẳng
  - Thiết kế bảng khoá để chặn xử lý trùng
  - Phân biệt phương thức an toàn và lũy đẳng
  example: 'Số dư 2 000 000, chuyển 500 000, thử 3 lần: không khoá còn 500 000, có khoá còn 1 500 000; UNIQUE giữ 1 dòng (VER BNK:L03)'
  fix:
  - Thử lại sau hết giờ chờ chỉ an toàn khi có khoá lũy đẳng và ràng buộc UNIQUE ở cơ sở dữ liệu
- id: L04
  title: SQL, chỉ mục và kế hoạch thực thi
  spec: lessons/bnk/L04_sql_chi_muc_ke_hoach.yaml
  requires:
  - L03
  objectives:
  - Tính số tầng của cây chỉ mục theo số dòng và số lối rẽ
  - Đọc kế hoạch thực thi để biết truy vấn quét hay tìm qua chỉ mục
  - Nhận ra điều kiện làm chỉ mục vô dụng
  - Cân nhắc lợi hại khi thêm chỉ mục
  example: '10 000 000 dòng, mỗi nút 100 lối rẽ: 4 tầng, 5 lần đọc; sqlite báo SCAN hay SEARCH tuỳ chỉ mục và điều kiện (VER BNK:L04)'
  fix:
  - 'Có chỉ mục chưa chắc được dùng: bọc cột trong hàm hay bỏ cột đầu làm chỉ mục vô dụng; đọc kế hoạch thực thi'
- id: L05
  title: PL/SQL, khoá hàng và bế tắc ORA-00060
  spec: lessons/bnk/L05_plsql_khoa_hang_deadlock.yaml
  requires:
  - L04
  objectives:
  - Vẽ đồ thị chờ và nhận ra vòng tròn gây bế tắc
  - Đếm số cặp thứ tự khoá gây bế tắc
  - Áp quy tắc khoá theo thứ tự id tăng dần
  - Xử lý đúng khi gặp ORA-00060
  example: Hai khoá, 4 cặp thứ tự, 2 cặp ngược nhau gây bế tắc; sắp thứ tự id tăng thì 0 bế tắc (mô phỏng; Oracle không chạy trên máy) (VER BNK:L05)
  fix:
  - SELECT thường của Oracle không khoá hàng; bế tắc chặn bằng thứ tự khoá, không bằng may rủi
- id: L06
  title: Redis, bộ đệm và khoá phân tán
  spec: lessons/bnk/L06_redis_cache_khoa_phan_tan.yaml
  requires:
  - L05
  objectives:
  - Tính độ trễ trung bình của bộ đệm theo tỉ lệ trúng
  - Giải thích vì sao khoá có hạn có thể bị hai người giữ
  - Áp mã chặn để nơi lưu từ chối người giữ khoá cũ
  - Quyết định đúng khi dùng khoá phân tán cho tiền
  example: Độ trễ trung bình 3 ms khi trúng 0,9 (tđệm 1 ms, tcsdl 20 ms); mã chặn khiến ghi cuối là B thay vì A (VER BNK:L06)
  fix:
  - Khoá có hạn có thể bị hai người cùng giữ; tính đúng đắn do cơ sở dữ liệu bảo đảm, không do khoá Redis
- id: L07
  title: 'Kafka: phân vùng, offset, chia lại và số lần xử lý'
  spec: lessons/bnk/L07_kafka_partition_offset.yaml
  requires:
  - L06
  objectives:
  - Chia phân vùng cho nhóm bộ đọc và tính số người ngồi không
  - Giải thích vì sao cùng khoá giữ đúng thứ tự
  - Dự đoán số lần xử lý theo thứ tự ghi nhớ và xử lý khi sập
  - Khử trùng ở phía xử lý để được hiệu quả đúng một lần
  example: '6 phân vùng chia cho 3 và 2 bộ đọc; sập ở thông điệp 2: [1,1,2,1,1] hay [1,1,0,1,1] tuỳ thứ tự ghi nhớ (VER BNK:L07)'
  fix:
  - Kafka đúng một lần chỉ bao trùm việc trong Kafka; tác dụng phụ bên ngoài vẫn cần khử trùng
- id: L08
  title: SAGA và Transactional Outbox
  spec: lessons/bnk/L08_saga_transactional_outbox.yaml
  requires:
  - L07
  objectives:
  - Đếm số dòng nhật ký và thứ tự bước bù khi một bước lỗi
  - Giải thích vì sao ghi kép làm mất sự kiện
  - Mô tả cách Outbox gộp lưu và báo thành một giao dịch
  - Chọn điều phối hay phối hợp theo sự kiện
  example: 'Bước lỗi i thì nhật ký 2i + 1 dòng; sập giữa lưu và báo: 0 sự kiện không outbox, 1 sự kiện có outbox (VER BNK:L08)'
  fix:
  - SAGA không cô lập như giao dịch thường; bước bù phải lũy đẳng; ghi kép làm mất sự kiện
- id: L09
  title: Sổ cái bút toán kép và kiểm cân đối
  spec: lessons/bnk/L09_so_cai_but_toan_kep.yaml
  requires:
  - L08
  objectives:
  - Ghi sổ một giao dịch có phí bằng các dòng cân đối
  - Tính số dư từ tổng các bút toán
  - Sửa sai bằng bút toán đảo mà không xoá dòng cũ
  - Dùng một câu truy vấn tổng nhóm để tìm giao dịch lệch
  example: 'Chuyển 500 000 phí 5 500 (số minh hoạ): ba dòng tổng 0; bút toán đảo đưa số dư về 0, sổ có 6 dòng (VER BNK:L09)'
  fix:
  - Không sửa hay xoá dòng sổ cái; sửa bằng bút toán đảo; số dư là kết quả suy ra
- id: L10
  title: 'Lõi ngân hàng T24: OFS, IBM MQ và mã tương quan'
  spec: lessons/bnk/L10_t24_ofs_ibm_mq_tuong_quan.yaml
  requires:
  - L09
  objectives:
  - Ghép phản hồi theo mã tương quan thay vì thứ tự đến
  - Tính xác suất phản hồi không trùng thứ tự gửi bằng vét cạn
  - 'Xử lý đúng khi hết giờ chờ: truy vấn trạng thái trước'
  - Tránh nhiều bản dịch vụ lấy nhầm phản hồi của nhau
  example: 'Phản hồi về theo thứ tự 2,0,1,4,3: ghép theo thứ tự đến đúng 0/5, theo mã tương quan 5/5; 44 trên 120 thứ tự không trùng vị trí nào (VER BNK:L10)'
  fix:
  - Phản hồi không về theo thứ tự gửi; hết giờ chờ là chưa biết, phải truy vấn trước khi gửi lại
- id: L11
  title: 'ISO 8583: bản đồ bit và cấu trúc bản tin'
  spec: lessons/bnk/L11_iso_8583_ban_do_bit.yaml
  requires:
  - L10
  objectives:
  - Dựng bản đồ bit từ danh sách trường có mặt
  - Tính độ dài một bản tin gồm trường cố định và trường LLVAR
  - Đọc ngược một bản tin thành các trường
  - Che số thẻ khi ghi nhật ký
  example: 'Bản tin 0200 trường 2, 3, 4, 11: bản đồ 7020000000000000, dài 62 ký tự; đọc ngược khớp (VER BNK:L11)'
  fix:
  - Mỗi mạng thanh toán có đặc tả riêng dù cùng ISO 8583; không ghi nguyên số thẻ vào nhật ký
- id: L12
  title: Chuyển mạch liên ngân hàng và đối soát hai bên
  spec: lessons/bnk/L12_napas_247_doi_soat.yaml
  requires:
  - L11
  objectives:
  - Vẽ đường đi của một lệnh chuyển nhanh và chỉ ra chỗ có thể mất dấu
  - Phân loại hai danh sách giao dịch thành bốn loại theo mã tham chiếu
  - Kiểm lại bằng đếm bù trừ và tổng tiền
  - Nêu hành động đầu tiên cho từng loại lệch
  example: 'Hai sổ 5 mã: 3 khớp, 1 chỉ ngân hàng, 1 chỉ chuyển mạch, 1 lệch tiền (số minh hoạ); 6 mã khác nhau (VER BNK:L12)'
  fix:
  - Ghép hai sổ theo mã tham chiếu, không theo số tiền; việc sửa sổ phải qua người duyệt
- id: L13
  title: 'Bảo mật thanh toán: khối PIN, HSM, MAC và sinh trắc học'
  spec: lessons/bnk/L13_bao_mat_thanh_toan_pin_hsm.yaml
  requires:
  - L12
  objectives:
  - Tính khối PIN định dạng 0 từ PIN thử và số thẻ thử
  - Giải thích vì sao sửa bản tin làm MAC không khớp
  - Áp quy tắc sinh trắc học theo giao dịch và cộng dồn trong ngày
  - Che số thẻ và không ghi PIN vào nhật ký
  example: 'Khối PIN định dạng 0 của PIN thử 1234 và thẻ thử: 041225EEEEEEEEEE; đổi số tiền thì MAC đổi; Luhn của số thẻ thử (VER BNK:L13)'
  fix:
  - Khoá không để trong mã nguồn; máy chủ tự kiểm điều kiện sinh trắc học; ranh giới ngưỡng theo văn bản hiện hành
- id: L14
  title: 'Tình huống giả định: từ triệu chứng tới thiết kế tốt hơn'
  spec: lessons/bnk/L14_tinh_huong_tru_tien_hai_lan.yaml
  requires:
  - L13
  objectives:
  - Đi từ triệu chứng tới nguyên nhân, bằng chứng, cách sửa và cách ngăn
  - Tính số tiền trừ dư và phân loại lệch bằng đối soát
  - Sửa sai bằng bút toán đảo
  - Kể một sự cố thật theo khung STAR, trung thực và có số liệu có nguồn
  example: 'Tình huống giả định: gửi 2 lần không khoá bị trừ dư 500 000; đối soát tìm 1 mã chỉ ở ngân hàng; bút toán đảo sửa (VER BNK:L14)'
  fix:
  - Chỉ kể sự cố thật của mình, số liệu có nguồn; bài này là tình huống giả định, không phải sự cố có thật
