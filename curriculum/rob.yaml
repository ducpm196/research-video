# Giáo án KẾ HOẠCH — ROB · Robot tự hành: định vị, lập bản đồ, lập kế hoạch, điều khiển
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã ROB:Lxx (numpy bình phương tối thiểu, Bayes rời rạc, log-odds).
# Căn cứ phạm vi: S. Thrun, W. Burgard, D. Fox, Probabilistic Robotics (2005) — chương 5 (mô hình chuyển động), 6 (mô hình đo), 8 (định vị
#   Monte Carlo), 9 (bản đồ lưới chiếm chỗ); R. Siegwart, I. Nourbakhsh, D. Scaramuzza, Introduction to Autonomous Mobile Robots (bản 2, 2011);
#   S. LaValle, Planning Algorithms (2006) — lập kế hoạch theo mẫu; R. C. Coulter (1992) — pure pursuit; D. Fox và cộng sự (1997) — cửa sổ động;
#   R. Hartley, A. Zisserman (2004) — mô hình camera lỗ kim. Tên phương pháp chỉ trên màn hình; lời đọc mô tả bằng tiếng Việt.
# Vì sao cần: RBM dạy TOÁN cho robot (phép quay, động học, PID, Kalman, A*); ESY dạy vi điều khiển. Còn thiếu mạch robot TỰ HÀNH: cảm nhận →
#   định vị → lập bản đồ → lập kế hoạch → điều khiển → an toàn.
# Thứ tự học: sau RBM (toàn khoá), CS115 L13–L15, AIF L02; ESY L09 (thời gian thực).
course: ROB
status: planned
lessons:
  - id: L00
    title: "Kiến trúc robot tự hành: cảm nhận, định vị, lập kế hoạch, điều khiển"
    spec: lessons/rob/L00_kien_truc_robot.yaml
    requires: []
    requires_ext: ["RBM:L10", "ESY:L09"]
    objectives: ["Mô tả các khối và luồng dữ liệu của robot tự hành", "Lập ngân sách trễ cho vòng điều khiển", "Hiểu kiểu xuất bản–đăng ký giữa các khối"]
    example: "vòng điều khiển 50 Hz có 20 ms: đọc cảm biến 4 ms + định vị 9 ms + điều khiển 2 ms + gửi lệnh 1 ms = 16 ms, dư 4 ms lúc bình thường; lúc khó nhất định vị 25 ms → 32 ms, trễ hạn (VER ROB:L00)"
    fix: ["Trễ trung bình thấp chưa đủ — vòng điều khiển cần trễ TỆ NHẤT trong hạn"]
  - id: L01
    title: "Mô hình chuyển động của xe hai bánh vi sai"
    spec: lessons/rob/L01_xe_vi_sai.yaml
    requires: [L00]
    requires_ext: ["RBM:L00", "RBM:L03"]
    objectives: ["Tính vận tốc thẳng và vận tốc góc từ hai bánh", "Tính bán kính quay", "Hiểu ràng buộc không trượt ngang"]
    example: "bánh trái 0,4 m/s, bánh phải 0,6 m/s, khoảng cách hai bánh 0,5 m: v = 0,5 m/s, ω = 0,4 rad/s, bán kính quay 1,25 m (VER ROB:L01)"
    fix: ["Xe vi sai không đi ngang được — ràng buộc không trượt ngang hạn chế đường đi khả thi"]
  - id: L02
    title: "Đo quãng đường bằng bánh xe và sai số tích lũy"
    spec: lessons/rob/L02_do_quang_duong.yaml
    requires: [L01]
    objectives: ["Đổi xung mã hoá thành quãng đường và góc quay", "Giải thích vì sao sai số hướng làm sai số vị trí lớn nhanh", "Biết vì sao cần cảm biến bên ngoài"]
    example: "bánh đường kính 0,1 m, 1000 xung mỗi vòng → 0,314 mm mỗi xung; lệch hướng 1° sau 10 m → lệch ngang ≈ 10 · sin 1° ≈ 0,175 m (VER ROB:L02)"
    fix: ["Đo quãng đường bằng bánh xe chỉ chính xác trong ngắn hạn — luôn cần cảm biến bên ngoài để sửa trôi"]
  - id: L03
    title: "Mô hình cảm biến: đo khoảng cách có nhiễu"
    spec: lessons/rob/L03_mo_hinh_cam_bien.yaml
    requires: [L00]
    requires_ext: ["CS115:L14"]
    objectives: ["Viết khả năng của một phép đo theo khoảng cách thật", "Hiểu vì sao cần thành phần đo hỏng", "Phân biệt mật độ và xác suất"]
    example: "khoảng cách thật 2,0 m, nhiễu chuẩn σ = 0,1 m: đo 2,1 m có mật độ ≈ 2,42, đo 2,3 m chỉ ≈ 0,044 — gấp ≈ 55 lần (VER ROB:L03)"
    fix: ["Mô hình chỉ có nhiễu chuẩn sẽ coi một phép đo hỏng là bằng chứng rất mạnh — cần thêm phần đo ngẫu nhiên, đo cực đại"]
  - id: L04
    title: "Định vị bằng bộ lọc Bayes rời rạc và bộ lọc hạt"
    spec: lessons/rob/L04_dinh_vi_loc_bayes.yaml
    requires: [L02, L03]
    requires_ext: ["CS115:L13"]
    objectives: ["Cập nhật niềm tin theo phép đo và chuyển động", "Thấy niềm tin nhiều đỉnh và cách nó hội tụ", "Giải thích lấy mẫu lại và kích thước mẫu hiệu dụng"]
    example: "hành lang vòng 10 ô (đi quá ô 9 thì về ô 0), cửa ở ô 1, 4, 7; nhìn thấy cửa (đúng 0,8, nhầm 0,1): niềm tin mỗi ô cửa ≈ 0,258, mỗi ô tường ≈ 0,032 (ba ô cửa cộng lại ≈ 0,774); đi đúng 3 ô rồi thấy cửa lần nữa: ô 4 và ô 7 mỗi ô ≈ 0,427 (VER ROB:L04)"
    fix: ["Một phép đo không đủ phân biệt các ô giống nhau — phải kết hợp chuyển động và nhiều phép đo"]
  - id: L05
    title: "Lọc Kalman mở rộng cho robot"
    spec: lessons/rob/L05_kalman_mo_rong.yaml
    requires: [L01, L04]
    requires_ext: ["RBM:L13", "CS115:L07"]
    objectives: ["Tuyến tính hoá mô hình chuyển động bằng Jacobian", "Thấy sai số hướng lan sang sai số vị trí", "Biết khi nào tuyến tính hoá thất bại"]
    example: "mô hình x' = x + v·h·cos θ, y' = y + v·h·sin θ tại θ = 0, v·h = 1 (h là bước thời gian): Jacobian theo (x, y, θ) có hàng đầu (1, 0, 0), hàng hai (0, 1, 1) (VER ROB:L05)"
    fix: ["Lọc Kalman mở rộng giả định sai số nhỏ — sai lệch hướng lớn làm tuyến tính hoá sai và bộ lọc phân kỳ"]
  - id: L06
    title: "Bản đồ lưới chiếm chỗ và cập nhật log-odds"
    spec: lessons/rob/L06_ban_do_luoi.yaml
    requires: [L03]
    objectives: ["Cập nhật xác suất ô bị chiếm bằng log-odds", "Giải thích vì sao cộng thay cho nhân", "Biết vì sao phải chặn giá trị"]
    example: "ô ban đầu 0,5; ba lần đo “bị chiếm” với mô hình 0,7: log-odds 3 · 0,847 ≈ 2,542 → xác suất ≈ 0,927 (VER ROB:L06)"
    fix: ["Cập nhật log-odds giả định các phép đo độc lập — đo lặp lại khi robot đứng yên làm bản đồ tự tin quá mức"]
  - id: L07
    title: "Định vị và lập bản đồ đồng thời: đồ thị tư thế và đóng vòng"
    spec: lessons/rob/L07_do_thi_tu_the.yaml
    requires: [L05, L06]
    requires_ext: ["RBM:L16"]
    objectives: ["Giải thích đồ thị tư thế", "Thấy đóng vòng chia đều sai số tích lũy", "Hiểu tác hại của đóng vòng sai"]
    example: "1 chiều: đo quãng đường 0 → 1 → 2 → 3 m nhưng đóng vòng báo điểm cuối cách đầu 2,7 m; bình phương tối thiểu chia đều sai số: 0,925; 1,850; 2,775 m (VER ROB:L07)"
    fix: ["Một lần đóng vòng sai (nhận nhầm nơi) làm hỏng cả bản đồ — cần kiểm tra trước khi chấp nhận"]
  - id: L08
    title: "Lập kế hoạch đường đi theo mẫu: bản đồ ngẫu nhiên và cây mở rộng nhanh"
    spec: lessons/rob/L08_lap_ke_hoach_theo_mau.yaml
    requires: [L00]
    requires_ext: ["AIF:L02", "RBM:L15"]
    objectives: ["Giải thích vì sao lưới đều không dùng được ở nhiều chiều", "Mô tả bản đồ ngẫu nhiên và cây mở rộng nhanh", "Ước lượng số mẫu cần cho lối hẹp"]
    example: "tay máy 6 khớp, chia mỗi khớp 100 mức: lưới có 100⁶ = 10¹² ô — quá lớn cho A* → lấy mẫu ngẫu nhiên (VER ROB:L08)"
    fix: ["Phương pháp lấy mẫu chỉ đầy đủ theo xác suất — không tìm thấy đường chưa chứng minh là không có đường"]
  - id: L09
    title: "Tránh vật cản cục bộ: cửa sổ động"
    spec: lessons/rob/L09_cua_so_dong.yaml
    requires: [L01, L08]
    objectives: ["Sinh các cặp vận tốc khả thi trong một chu kỳ", "Loại vận tốc không dừng kịp", "Chấm điểm và thấy ảnh hưởng của trọng số"]
    example: "ba ứng viên (v, ω) chấm điểm 0,4·hướng + 0,4·khoảng trống + 0,2·tốc độ: (0,5; 0) → 0,62, (0,3; 0,5) → 0,70, (0,1; 1) → 0,54 → chọn (0,3; 0,5) (số minh hoạ, VER ROB:L09)"
    fix: ["Tránh vật cản cục bộ có thể kẹt trong góc chết — cần bộ lập kế hoạch toàn cục ở trên"]
  - id: L10
    title: "Bám quỹ đạo: điểm nhìn trước"
    spec: lessons/rob/L10_bam_quy_dao.yaml
    requires: [L01]
    requires_ext: ["RBM:L10"]
    objectives: ["Tính độ cong lệnh từ điểm nhìn trước", "Đổi độ cong thành vận tốc góc", "Chọn khoảng nhìn trước theo tốc độ"]
    example: "khoảng nhìn trước 2 m, điểm đích lệch ngang 0,5 m: độ cong 2·0,5/2² = 0,25 m⁻¹ (bán kính 4 m) (VER ROB:L10)"
    fix: ["Khoảng nhìn trước ngắn bám sát nhưng dao động; dài thì êm nhưng cắt góc"]
  - id: L11
    title: "Thị giác cho robot: mô hình camera lỗ kim và hiệu chuẩn"
    spec: lessons/rob/L11_camera_lo_kim.yaml
    requires: [L00]
    requires_ext: ["RBM:L03", "RBM:L16"]
    objectives: ["Chiếu điểm 3D lên ảnh", "Hiểu vì sao một camera không đo được độ sâu", "Tính độ sâu từ hai camera và sai số của nó"]
    example: "tiêu cự 800 điểm ảnh, tâm ảnh 640; điểm X = 0,5 m, Z = 4 m: u = 800 · 0,5 / 4 + 640 = 740 (VER ROB:L11)"
    fix: ["Một camera không đo được độ sâu — điểm gần nhỏ và điểm xa lớn có thể cho cùng ảnh"]
  - id: L12
    title: "An toàn và kiểm thử robot: quãng dừng, mô phỏng và thực tế"
    spec: lessons/rob/L12_an_toan_kiem_thu.yaml
    requires: [L09, L10]
    requires_ext: ["ESY:L12"]
    objectives: ["Tính quãng dừng an toàn", "Tính tốc độ tối đa theo tầm phát hiện", "Giải thích khoảng cách giữa mô phỏng và thực tế"]
    example: "tốc độ 1,5 m/s, giảm tốc 1 m/s², trễ phản ứng 0,2 s: quãng dừng 1,5²/2 + 1,5 · 0,2 = 1,425 m → vùng an toàn phải lớn hơn (VER ROB:L12)"
    fix: ["Chạy tốt trong mô phỏng chưa chứng minh chạy tốt ngoài đời — ma sát, trễ, nhiễu cảm biến khác nhau"]
  - id: L13
    title: "Tình huống chuyên gia theo dòng thời gian: xe tự lái từ sa mạc tới đường phố"
    spec: lessons/rob/L13_hanh_trinh_xe_tu_lai.yaml
    requires: [L02, L05, L06, L12]
    see_also: ["RBM:L13"]
    kind: journey
    objectives: ["Kể lại hành trình xe tự lái qua năm chặng từ cuộc thi sa mạc 2004 tới dịch vụ không người lái năm 2025, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại quãng dừng so với tầm thấy của cảm biến, sai số độ cao do lệch góc nhỏ, quãng đường trung bình giữa hai lần can thiệp và tỉ lệ sự cố trên một triệu dặm", "Quyết định tốc độ, cảm biến và lúc bỏ người đi kèm cho một đội xe nhỏ, kèm điều kiện đổi lựa chọn"]
    example: "2004: không xe nào quá 5% của 142 dặm → < 7,1 dặm (ST06); laser ≈ 22 m đủ cho 25 dặm/giờ, 35 dặm/giờ cần ≈ 33,7 m với phanh 4 m/s², trễ 0,2 s (số minh hoạ) → camera ≈ 70 m (ST06); lệch 0,5° ở 30 m → ≈ 0,262 m > ngưỡng 15 cm; 47 sự kiện = 18 thật + 29 mô phỏng → người kèm ngăn ≈ 62% (WM20, KU25); 48 vụ thương tích / 56,7 triệu dặm ≈ 0,85 so với mốc 4,04 → giảm ≈ 79% (KU25) (VER ROB:L13)"
    fix: ["Chỉ khẳng định điều có trong ST06, WM20, WS20, KU24, KU25 (audit/rob/sources_L13.md); ST06 đọc bản của nhóm tác giả tại robots.stanford.edu (trang Wiley không đọc)", "Kết quả từng đội năm 2004, gia tốc phanh và trễ của xe thắng, nguyên nhân gốc của việc dữ liệu laser bị ngắt không có trong nguồn — không dạy; phanh 4 m/s², trễ 0,2 s và mọi số của câu đố là số minh hoạ", "Tỉ lệ trên một triệu dặm chỉ so được với mốc cùng thành phố, cùng loại đường, cùng ngưỡng báo; số dặm và số vụ sau 1/2025 không đọc — không dạy"]
