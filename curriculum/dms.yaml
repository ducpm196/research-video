# Lộ trình DMS · Toán rời rạc (nền cho Khoa học máy tính, phần mềm, mật mã). Kiểm: python tools/lv.py curriculum curriculum/dms.yaml
# Trạng thái: 20/20 bài có đặc tả (lessons/dms/, video out/DMS/<id>/), 2026-10-27. Mỗi bài giữ mục tiêu, ví dụ ĐÃ KIỂM BẰNG MÁY
#   (VER = audit/verify_plan_curricula.py, mã DMS:Lxx) và `fix` = điểm hay nói sai mà video phải nói đúng.
# Tách biệt khoá cũ: ký hiệu riêng tools/registry/symbols.DMS.yaml, luật đọc riêng lexicon_vi.DMS.yaml (bằng chứng: audit/dms/probes/).
#   Bài có hình sinh bằng máy (L08, L16–L18): sửa mẫu audit/dms/src/*.tpl.yaml rồi ghép bằng audit/cs112/fill_tpl.py.
# Căn cứ phạm vi: CS2023 (ACM/IEEE/AAAI), lĩnh vực Mathematical and Statistical Foundations (MSF) — kế thừa “Discrete Structures” của
#   CS2013 (tài liệu “1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98, đọc 2026-10-27). Bản nháp MSF liệt kê các đơn vị
#   tập hợp–quan hệ–hàm, lôgic, kỹ thuật chứng minh, đếm, xác suất rời rạc (CITED, bản Beta; số giờ bản cuối chưa kiểm).
# Vì sao cần: CS112 dùng quy nạp (L10), đếm (L00), đồ thị (L07) nhưng chưa dạy lôgic, tập hợp–quan hệ, đếm tổ hợp, số học mô-đun một cách
#   hệ thống; CS115 dạy xác suất (L13) nhưng không dạy đếm. Mật mã (khoá NET) cần số học mô-đun.
# Thứ tự học: DMS trước (hoặc song song) CS112 — DMS tự đủ, chỉ cần CS115 bài 13 cho L19; `see_also` = bài liên quan ở khoá khác (không bắt buộc).
#   L13–L15 trước NET:L13.
course: DMS
status: active
lessons:
  - id: L00
    title: "Mệnh đề và phép toán lôgic: bảng chân trị, phép kéo theo"
    requires: []
    spec: lessons/dms/L00_menh_de_bang_chan_tri.yaml
    objectives: ["Lập bảng chân trị cho ¬, ∧, ∨, →, ↔", "Giải thích vì sao p → q đúng khi p sai"]
    example: "p → q ≡ ¬p ∨ q; bốn dòng (Đ,Đ),(Đ,S),(S,Đ),(S,S) cho Đ, S, Đ, Đ (VER DMS:L00)"
    fix: ["“Nếu p thì q” KHÔNG nói gì khi p sai — kéo theo khi đó đúng (đúng hiển nhiên)", "p → q khác q → p (đảo) nhưng tương đương ¬q → ¬p (phản đảo)"]
  - id: L01
    title: "Tương đương lôgic, luật De Morgan và điều kiện trong mã"
    spec: lessons/dms/L01_tuong_duong_de_morgan.yaml
    requires: [L00]
    objectives: ["Chứng minh tương đương bằng bảng chân trị", "Phủ định một điều kiện phức trong câu lệnh if"]
    example: "¬(p ∧ q) ≡ ¬p ∨ ¬q, ¬(p ∨ q) ≡ ¬p ∧ ¬q, kiểm đủ 4 dòng (VER DMS:L01); trong mã: !(a && b) == (!a || !b)"
    fix: ["Phủ định của “và” là “hoặc” của các phủ định — không phải “và” của các phủ định"]
  - id: L02
    title: "Lượng từ “với mọi”, “tồn tại” và phủ định của chúng"
    spec: lessons/dms/L02_luong_tu.yaml
    requires: [L01]
    objectives: ["Đọc và viết câu có ∀, ∃", "Phủ định câu có lượng từ; nhận ra miền xác định làm đổi chân trị"]
    example: "∀x ∈ ℕ: x² ≥ x đúng (máy kiểm 0..9999), nhưng trên ℚ sai vì x = 1/2 cho 1/4 < 1/2 (VER DMS:L02)"
    fix: ["¬(∀x P(x)) ≡ ∃x ¬P(x), không phải ∀x ¬P(x)", "Một câu có lượng từ chỉ có chân trị khi đã nói rõ miền (ℕ, ℚ, ℝ…)"]
  - id: L03
    title: "Các kiểu chứng minh: trực tiếp, phản đảo, phản chứng"
    spec: lessons/dms/L03_kieu_chung_minh.yaml
    requires: [L02]
    objectives: ["Chọn kiểu chứng minh phù hợp", "Viết chứng minh √2 vô tỉ và “n² chẵn ⇒ n chẵn”"]
    example: "Phản đảo: n lẻ ⇒ n = 2k + 1 ⇒ n² = 2(2k² + 2k) + 1 lẻ; nên n² chẵn ⇒ n chẵn"
    fix: ["Thử vài ví dụ không phải chứng minh — một phản ví dụ đủ bác bỏ, nhưng nghìn ví dụ không đủ khẳng định"]
  - id: L04
    title: "Quy nạp toán học và quy nạp mạnh"
    spec: lessons/dms/L04_quy_nap.yaml
    requires: [L03]
    see_also: ["CS112:L10"]
    objectives: ["Viết đủ bước cơ sở và bước quy nạp", "Dùng quy nạp mạnh khi P(n + 1) cần nhiều giá trị trước"]
    example: "1 + 3 + … + (2n − 1) = n² (máy kiểm n = 1..199, VER DMS:L04); bước quy nạp: n² + (2n + 1) = (n + 1)²"
    fix: ["Thiếu bước cơ sở hoặc bước quy nạp hỏng ở n nhỏ cho “chứng minh” sai (ví dụ “mọi con ngựa cùng màu” hỏng ở n = 1 → 2)"]
  - id: L05
    title: "Tập hợp, phép toán tập hợp, tập lũy thừa, bao hàm–loại trừ hai tập"
    spec: lessons/dms/L05_tap_hop.yaml
    requires: [L03]   # ∉ (không thuộc) dạy ở L03
    objectives: ["Thực hiện ∪, ∩, \\, phần bù", "Đếm |A ∪ B| = |A| + |B| − |A ∩ B|"]
    example: "|P({a, b, c})| = 8; số từ 1..100 chia hết cho 2 hoặc 3: 50 + 33 − 16 = 67 (VER DMS:L05)"
    fix: ["∅ khác {∅}: tập rỗng có 0 phần tử, {∅} có 1 phần tử"]
  - id: L06
    title: "Hàm: đơn ánh, toàn ánh, song ánh; nguyên lý chuồng bồ câu"
    spec: lessons/dms/L06_ham_chuong_bo_cau.yaml
    requires: [L05]
    objectives: ["Phân loại một hàm", "Dùng chuồng bồ câu để chứng minh va chạm tất yếu"]
    example: "367 người, 366 ngày → chắc chắn 2 người trùng sinh nhật; 11 khoá vào 10 ô băm → chắc chắn va chạm (VER DMS:L06)"
    fix: ["Chuồng bồ câu nói CÓ va chạm, không nói ở ô nào hay bao nhiêu va chạm"]
  - id: L07
    title: "Quan hệ: phản xạ, đối xứng, bắc cầu; quan hệ tương đương và lớp tương đương"
    spec: lessons/dms/L07_quan_he.yaml
    requires: [L05]
    objectives: ["Kiểm ba tính chất của một quan hệ", "Chia tập thành các lớp tương đương"]
    example: "đồng dư mod 3 trên {0..8}: 3 lớp {0,3,6}, {1,4,7}, {2,5,8} (VER DMS:L07)"
    fix: ["Đối xứng và phản đối xứng không loại trừ nhau (quan hệ “bằng” có cả hai)"]
  - id: L08
    title: "Thứ tự bộ phận, biểu đồ Hasse và sắp xếp tô pô"
    spec: lessons/dms/L08_thu_tu_bo_phan.yaml
    requires: [L07]
    see_also: ["CS112:L07"]
    objectives: ["Vẽ biểu đồ Hasse", "Liệt kê một thứ tự tuyến tính tương thích (sắp xếp tô pô)"]
    example: "quan hệ chia hết trên {1, 2, 3, 4, 6, 12}: biểu đồ Hasse có 7 cạnh (VER DMS:L08)"
    fix: ["Hai phần tử có thể không so sánh được (2 và 3 với quan hệ chia hết) — thứ tự bộ phận không phải thứ tự toàn phần"]
  - id: L09
    title: "Quy tắc đếm: cộng, nhân, hoán vị, chỉnh hợp"
    spec: lessons/dms/L09_quy_tac_dem.yaml
    requires: [L05]
    objectives: ["Chọn quy tắc cộng hay nhân", "Đếm chỉnh hợp và hoán vị"]
    example: "mật khẩu 8 chữ thường: 26⁸ = 208 827 064 576 (VER DMS:L09)"
    fix: ["Quy tắc cộng chỉ đúng khi các trường hợp rời nhau; chồng nhau thì dùng bao hàm–loại trừ"]
  - id: L10
    title: "Tổ hợp, nhị thức Newton và tam giác Pascal"
    spec: lessons/dms/L10_to_hop_nhi_thuc.yaml
    requires: [L09]
    objectives: ["Tính C(n, k) và giải thích vì sao chia k!", "Khai triển nhị thức và chứng minh Σ C(n, k) = 2ⁿ"]
    example: "C(10, 3) = 120; hệ số (x + y)⁴: 1, 4, 6, 4, 1; Σₖ C(7, k) = 2⁷ (VER DMS:L10)"
    fix: ["Chọn có thứ tự (chỉnh hợp) khác chọn không thứ tự (tổ hợp) đúng k! lần"]
  - id: L11
    title: "Tổ hợp có lặp: bài toán chia kẹo"
    spec: lessons/dms/L11_chia_keo.yaml
    requires: [L10]
    objectives: ["Đếm nghiệm nguyên không âm của x₁ + … + x_k = n"]
    example: "x₁ + x₂ + x₃ = 10, xᵢ ≥ 0: C(12, 2) = 66 nghiệm (máy vét cạn, VER DMS:L11)"
    fix: ["Điều kiện xᵢ ≥ 1 khác xᵢ ≥ 0 — phải đổi biến yᵢ = xᵢ − 1 trước"]
  - id: L12
    title: "Bao hàm–loại trừ tổng quát và hoán vị không điểm cố định"
    spec: lessons/dms/L12_bao_ham_loai_tru.yaml
    requires: [L11]
    objectives: ["Áp dụng bao hàm–loại trừ cho k tập", "Đếm hoán vị không điểm cố định"]
    example: "D₄ = 9 (vét cạn); D₁₀/10! ≈ 0,36788 ≈ 1/e (VER DMS:L12)"
    fix: ["Dấu xen kẽ + − + − theo số tập trong giao, không phải theo vị trí số hạng"]
  - id: L13
    title: "Số học mô-đun: chia hết, đồng dư, thuật toán Euclid mở rộng"
    spec: lessons/dms/L13_so_hoc_mo_dun.yaml
    requires: [L07]
    see_also: ["CS112:L13"]
    objectives: ["Tính toán trong ℤₙ", "Tìm gcd và hệ số Bézout"]
    example: "gcd(252, 198) = 18 = 252·4 − 198·5 (VER DMS:L13)"
    fix: ["−7 mod 3 bằng 2 trong toán học; một số ngôn ngữ lập trình trả −1 — phải biết quy ước của ngôn ngữ"]
  - id: L14
    title: "Nghịch đảo mô-đun, định lý Fermat nhỏ, lũy thừa nhanh"
    spec: lessons/dms/L14_nghich_dao_fermat.yaml
    requires: [L13]
    objectives: ["Tìm a⁻¹ mod n khi gcd(a, n) = 1", "Tính aᵏ mod n bằng bình phương lặp"]
    example: "3⁻¹ ≡ 5 (mod 7); 3¹⁰⁰ ≡ 3⁴ = 81 ≡ 4 (mod 7) vì 3⁶ ≡ 1 (VER DMS:L14)"
    fix: ["Nghịch đảo chỉ tồn tại khi gcd(a, n) = 1", "Fermat nhỏ cần n nguyên tố; phép thử Fermat có số giả nguyên tố (Carmichael)"]
  - id: L15
    title: "RSA trên số nhỏ: khoá công khai từ số học mô-đun"
    spec: lessons/dms/L15_ma_khoa_cong_khai.yaml
    requires: [L14]
    objectives: ["Sinh khoá, mã hoá, giải mã RSA bằng tay", "Giải thích vì sao an toàn dựa vào độ khó phân tích thừa số"]
    example: "p = 3, q = 11, n = 33, φ = 20, e = 3, d = 7; mã hoá 4 → 31; giải 31⁷ mod 33 = 4 (VER DMS:L15)"
    fix: ["Số nhỏ chỉ để minh hoạ — RSA thật dùng khoá ≥ 2048 bit và phải có đệm (padding); RSA “sách giáo khoa” không an toàn"]
  - id: L16
    title: "Đồ thị: bậc, bổ đề bắt tay, đường đi và chu trình Euler"
    spec: lessons/dms/L16_do_thi_euler.yaml
    requires: [L09]
    see_also: ["CS112:L07"]
    objectives: ["Dùng Σ bậc = 2m", "Nhận biết khi nào có chu trình hoặc đường đi Euler"]
    example: "cầu Königsberg: bậc 3, 3, 3, 5 (tổng 14 = 2·7), 4 đỉnh bậc lẻ → không có chu trình Euler (VER DMS:L16)"
    fix: ["Chu trình Euler (đi qua mọi CẠNH) khác chu trình Hamilton (qua mọi ĐỈNH) — cái sau NP-đầy đủ (CS112 bài 26)"]
  - id: L17
    title: "Cây: tính chất tương đương và đếm cây có nhãn"
    spec: lessons/dms/L17_cay.yaml
    requires: [L16, L04]
    objectives: ["Chứng minh cây n đỉnh có n − 1 cạnh", "Phát biểu công thức Cayley"]
    example: "4 đỉnh có nhãn → 4² = 16 cây (máy vét cạn, VER DMS:L17)"
    fix: ["Liên thông với n − 1 cạnh ⇒ là cây; n − 1 cạnh mà không liên thông thì không phải"]
  - id: L18
    title: "Đồ thị phẳng, công thức Euler V − E + F = 2, tô màu"
    spec: lessons/dms/L18_do_thi_phang.yaml
    requires: [L17]
    objectives: ["Dùng E ≤ 3V − 6 để chứng minh một đồ thị không phẳng", "Tô màu tham lam và giới hạn của nó"]
    example: "K₄: 4 − 6 + 4 = 2; K₅ có 10 cạnh > 3·5 − 6 = 9 → không phẳng (VER DMS:L18)"
    fix: ["E ≤ 3V − 6 là điều kiện CẦN cho đồ thị phẳng (V ≥ 3), không phải đủ"]
  - id: L19
    title: "Xác suất rời rạc trong tin học: biến chỉ báo, nghịch lý ngày sinh, va chạm băm"
    spec: lessons/dms/L19_xac_suat_roi_rac.yaml
    requires: [L10, L06]
    requires_ext: ["CS115:L13"]
    objectives: ["Tính kỳ vọng bằng tổng biến chỉ báo", "Ước lượng xác suất va chạm của hàm băm"]
    example: "23 người: P(có hai người trùng sinh nhật) = 0,5073 (VER DMS:L19)"
    fix: ["Xác suất có va chạm trong cả nhóm lớn hơn nhiều xác suất trùng với MỘT người cho trước"]
  - id: L20
    title: "Tình huống chuyên gia theo dòng thời gian: hàm băm từ MD5 tới SHA-256"
    spec: lessons/dms/L20_hanh_trinh_ham_bam.yaml
    requires: [L19, L06]
    kind: journey
    objectives: ["Kể lại hành trình của hàm băm qua năm chặng (2004 → 2030), mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại số lần thử của tấn công ngày sinh, tỉ lệ nhanh hơn vét cạn, khoảng cách giữa cảnh báo và va chạm thật", "Chọn độ dài mã băm hợp với việc của mình (có hay không có kẻ tấn công), kèm điều kiện đổi lựa chọn"]
    example: "mã 160 bit: vét cạn ngày sinh 2⁸⁰ lần thử; va chạm năm 2017 tốn 2^63,1 (ST17) → 2^16,9 ≈ 122 294 lần ít hơn (ST17: “more than 100,000 times”); 2⁶³ = 9 223 372 036 854 775 808 (GB17); 2017 − 2006 = 11 năm (ST17: “eleven years”); 10 000 tệp vào 2³² ô (số minh hoạ): kỳ vọng ≈ 0,0116 cặp trùng (VER DMS:L20)"
    fix: ["Chỉ khẳng định điều có trong RF11, NP, S3, ST17, GB17, GIT, NI22 (audit/dms/sources_L20.md); bài báo Wang 2004–2005 không đọc được (403) — không dạy chi tiết riêng của chúng (“một giờ”, 2⁶⁹)", "Chỉ mức khái niệm phòng thủ: không trình bày cách dựng va chạm", "MD5 vẫn chấp nhận được khi chỉ chống lỗi ngẫu nhiên (RF11 §1) — không nói “mọi chỗ dùng MD5 đều nguy”"]
