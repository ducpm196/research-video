# Giáo án — GFX · Đồ hoạ máy tính (lĩnh vực GIT của CS2023)
# Mã khoá là GFX, không dùng GIT để khỏi lẫn với công cụ quản lý phiên bản Git (DVO).
# Trạng thái: active. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã GFX:Lxx (ma trận numpy, toạ độ trọng tâm, độ phân giải bộ đệm độ sâu,
#   công thức sRGB, giao tia–cầu bằng sympy, Fresnel Schlick, hành trình chiếu sáng 1975 → 2013).
# Căn cứ phạm vi (CITED): CS2023 lĩnh vực GIT (Graphics and Interactive Techniques); S. Marschner, P. Shirley, Fundamentals of Computer Graphics (bản 5, 2021);
#   T. Akenine-Möller và cộng sự, Real-Time Rendering (bản 4, 2018); J. Pineda, hàm cạnh cho raster hoá (SIGGRAPH 1988);
#   B. T. Phong (CACM 1975); J. Blinn (SIGGRAPH 1977); T. Whitted (CACM 1980); J. Kajiya (SIGGRAPH 1986);
#   C. Schlick, xấp xỉ Fresnel (1994); B. Burley (SIGGRAPH 2012); B. Karis (SIGGRAPH 2013); IEC 61966-2-1 (sRGB);
#   M. Pharr, W. Jakob, G. Humphreys, Physically Based Rendering (bản 4, 2023).
# Vì sao cần: RBM L00–L03 dạy phép quay và toạ độ thuần nhất; CS115 dạy ma trận. Chưa có khoá dạy cách một cảnh 3D thành điểm ảnh:
#   chiếu, cắt, raster hoá, độ sâu, chiếu sáng, kết cấu, màu, dò tia — nền cho trò chơi, mô phỏng, thực tế ảo và sinh dữ liệu cho thị giác (CVI).
# Thứ tự học: sau RBM L03, CS115 L02.
course: GFX
status: active
lessons:
  - id: L00
    title: "Đường ống kết xuất: từ đỉnh tới điểm ảnh, và ngân sách một khung hình"
    spec: lessons/gfx/L00_duong_ong_ket_xuat.yaml
    requires: []
    requires_ext: ["CSA:L09"]
    objectives: ["Kể các tầng: xử lý đỉnh, ghép nguyên thuỷ, raster hoá, tô mảnh, ghép ảnh", "Tính ngân sách thời gian và số điểm ảnh mỗi giây"]
    example: "1920 × 1080 ở 60 khung mỗi giây: 124 416 000 điểm ảnh mỗi giây, ngân sách ≈ 16,67 ms mỗi khung; 120 khung mỗi giây còn ≈ 8,33 ms (VER GFX:L00)"
    fix: ["Khung hình trễ một lần (17 ms → 34 ms) người xem thấy giật dù trung bình vẫn 60 — đo thời gian từng khung, không chỉ trung bình"]
  - id: L01
    title: "Biến đổi mô hình và góc nhìn bằng toạ độ thuần nhất"
    spec: lessons/gfx/L01_bien_doi.yaml
    requires: [L00]
    requires_ext: ["RBM:L03"]
    objectives: ["Ghép tịnh tiến và quay thành một ma trận 3 × 3 (2D) hoặc 4 × 4 (3D)", "Chứng minh thứ tự nhân ma trận đổi kết quả"]
    example: "điểm (1, 0): quay 90° rồi tịnh tiến (2, 0) → (2, 1); tịnh tiến rồi quay → (0, 3) (VER GFX:L01)"
    fix: ["Pháp tuyến không biến đổi bằng cùng ma trận khi có co giãn không đều — phải dùng nghịch đảo chuyển vị"]
  - id: L02
    title: "Phép chiếu phối cảnh và phép chia cho w"
    spec: lessons/gfx/L02_chieu_phoi_canh.yaml
    requires: [L01]
    objectives: ["Chiếu điểm bằng x′ = f·x/z, y′ = f·y/z", "Giải thích vì sao vật xa trông nhỏ và đường song song hội tụ"]
    example: "f = 1, điểm (2, 1, 4) → (0,5; 0,25); cùng vật ở z = 8 → (0,25; 0,125), nhỏ một nửa (VER GFX:L02)"
    fix: ["Nội suy tuyến tính trên màn hình không đúng với thuộc tính 3D — phải nội suy có hiệu chỉnh phối cảnh (chia theo 1/z)"]
  - id: L03
    title: "Cắt, toạ độ thiết bị chuẩn hoá và phép biến đổi khung nhìn"
    spec: lessons/gfx/L03_cat_khung_nhin.yaml
    requires: [L02]
    objectives: ["Đổi toạ độ chuẩn hoá [−1, 1] thành chỉ số điểm ảnh", "Giải thích vì sao phải cắt tam giác trước khi chia cho w"]
    example: "khung 1920 điểm ảnh ngang: x chuẩn hoá 0,5 → (0,5 + 1)/2 · 1920 = 1440; −1 → 0; 1 → 1920 (mép phải) (VER GFX:L03)"
    fix: ["Điểm sau camera có w âm — chia trước khi cắt làm tam giác lộn ngược qua màn hình"]
  - id: L04
    title: "Raster hoá tam giác: hàm cạnh và toạ độ trọng tâm"
    spec: lessons/gfx/L04_raster_hoa.yaml
    requires: [L03]
    objectives: ["Kiểm một điểm ảnh nằm trong tam giác bằng dấu ba hàm cạnh", "Nội suy màu và độ sâu bằng toạ độ trọng tâm"]
    example: "tam giác (0, 0), (4, 0), (0, 4), điểm (1, 1): toạ độ trọng tâm (0,5; 0,25; 0,25), tổng 1, đều dương → bên trong; điểm (3, 3) có một toạ độ âm → bên ngoài (VER GFX:L04)"
    fix: ["Điểm ảnh nằm đúng trên cạnh chung của hai tam giác phải tô đúng một lần — cần quy tắc trên–trái"]
  - id: L05
    title: "Bộ đệm độ sâu: độ chính xác không đều và hiện tượng giành điểm ảnh"
    spec: lessons/gfx/L05_bo_dem_do_sau.yaml
    requires: [L04]
    requires_ext: ["CSA:L03"]
    objectives: ["Tính khoảng độ sâu nhỏ nhất phân biệt được ở khoảng cách z", "Giải thích vì sao đẩy mặt phẳng gần ra xa hiệu quả hơn kéo mặt phẳng xa vào"]
    example: "bộ đệm 24 bit, gần 0,1, xa 1000: ở z = 100 m hai mặt cách nhau dưới ≈ 6 mm là giành điểm ảnh; đặt gần = 1 → ≈ 0,6 mm, tốt gấp 10 (VER GFX:L05)"
    fix: ["Độ chính xác tỉ lệ với z²/gần — phần lớn bit dùng cho vùng sát camera"]
  - id: L06
    title: "Chiếu sáng cục bộ: khuếch tán Lambert và phản xạ Blinn–Phong"
    spec: lessons/gfx/L06_chieu_sang.yaml
    requires: [L01]
    requires_ext: ["CS115:L01"]
    objectives: ["Tính cường độ khuếch tán max(0, n · l)", "Tính phần bóng sáng (n · h)ˢ và vai trò của số mũ s"]
    example: "n = (0, 0, 1), l = (0; 0,6; 0,8) → n · l = 0,8; n · h = 0,95 với s = 32 → 0,95³² ≈ 0,194; s = 128 → ≈ 0,0014 — điểm sáng nhỏ và sắc hơn (VER GFX:L06)"
    fix: ["Quên chuẩn hoá vector sau khi nội suy làm độ sáng đổi theo kích thước tam giác"]
  - id: L07
    title: "Kết cấu và lấy mẫu: nội suy song tuyến, mipmap, răng cưa"
    spec: lessons/gfx/L07_ket_cau.yaml
    requires: [L04]
    requires_ext: ["RBM:L14"]
    objectives: ["Nội suy song tuyến từ bốn điểm kết cấu", "Tính số mức và bộ nhớ thêm của mipmap"]
    example: "bốn điểm kết cấu 10, 20, 30, 40 tại giữa ô → 25; kết cấu 1024 × 1024 có 11 mức mipmap, tổng bộ nhớ thêm ≈ 1/3 (VER GFX:L07)"
    fix: ["Thu nhỏ kết cấu mà không lọc là lấy mẫu dưới tần số Nyquist — sọc lấp lánh khi camera chuyển động"]
  - id: L08
    title: "Màu và gamma: vì sao trung bình hai màu phải tính trong không gian tuyến tính"
    spec: lessons/gfx/L08_gamma.yaml
    requires: [L06]
    objectives: ["Đổi giá trị sRGB sang tuyến tính và ngược lại", "Tính đúng màu trung bình của đen và trắng"]
    example: "trộn đều 0 và 255: tính thẳng trên sRGB ra 128 (quá tối); đổi tuyến tính, trung bình 0,5, đổi lại → ≈ 188 (VER GFX:L08)"
    fix: ["Chiếu sáng, trộn màu, lọc kết cấu đều phải làm trên giá trị tuyến tính; chỉ mã hoá gamma ở bước ghi ra màn hình"]
  - id: L09
    title: "Dò tia: giao tia với cầu, bóng đổ và phản xạ"
    spec: lessons/gfx/L09_do_tia.yaml
    requires: [L06]
    requires_ext: ["CS115:L01"]
    objectives: ["Giải phương trình bậc hai tìm giao tia–cầu", "Bắn tia bóng đổ về nguồn sáng để biết điểm có bị che"]
    example: "tia gốc (0, 0, 0) hướng (0, 0, 1), cầu tâm (0, 0, 5) bán kính 1 → t = 4 và t = 6, lấy giao gần t = 4; tia hướng (0, 1, 0) có biệt thức âm → không giao (VER GFX:L09)"
    fix: ["Tia bóng đổ xuất phát đúng trên mặt sẽ tự giao với chính mặt đó (mụn bóng) — dời gốc một khoảng nhỏ theo pháp tuyến"]
  - id: L10
    title: "Kết xuất dựa trên vật lý: bảo toàn năng lượng và hiệu ứng Fresnel"
    spec: lessons/gfx/L10_ket_xuat_vat_ly.yaml
    requires: [L08, L09]
    objectives: ["Tính phản xạ Fresnel theo xấp xỉ Schlick", "Chia năng lượng giữa phản xạ và khuếch tán để không tạo thêm ánh sáng"]
    example: "F₀ = 0,04 (nhựa, thuỷ tinh): nhìn thẳng → 0,04; góc tới 60° (cos = 0,5) → 0,04 + 0,96 · 0,5⁵ = 0,07; nhìn sát mép (cos = 0) → 1 (VER GFX:L10)"
    fix: ["Cộng khuếch tán đầy đủ với phản xạ đầy đủ làm vật sáng hơn ánh sáng chiếu vào — khuếch tán phải nhân (1 − F)"]
  - id: L11
    title: "Hiệu năng thời gian thực: tô đè, số lệnh vẽ và mức chi tiết"
    spec: lessons/gfx/L11_hieu_nang.yaml
    requires: [L00, L05]
    requires_ext: ["PAR:L07"]
    objectives: ["Tính số mảnh phải tô khi tô đè trung bình k lần", "Chọn mức chi tiết theo diện tích vật trên màn hình"]
    example: "1080p, tô đè trung bình 3 lần → 6 220 800 mảnh mỗi khung; vẽ từ trước ra sau với kiểm độ sâu sớm đưa về gần 1 lần → 2 073 600 (VER GFX:L11)"
    fix: ["Tối ưu bộ tô mảnh cho cảnh bị chặn bởi băng thông hoặc số lệnh vẽ không đổi gì — đo bộ phận nào đang là nút cổ chai"]
  - id: L12
    title: "Tình huống chuyên gia: cảnh thế giới mở bị nhấp nháy ở xa — chẩn đoán bộ đệm độ sâu"
    spec: lessons/gfx/L12_tinh_huong_do_sau.yaml
    requires: [L05, L11]
    objectives: ["Tính lại độ phân giải độ sâu ở khoảng cách có lỗi", "So sánh các cách sửa: đẩy mặt gần, độ sâu đảo dấu phẩy động, chia cảnh"]
    example: "gần 0,01, xa 10 000, 24 bit: ở 1000 m chỉ phân biệt được hai mặt cách nhau ≈ 6 m → mái và tường nhấp nháy; đặt gần = 0,5 → ≈ 0,12 m (VER GFX:L12)"
    fix: ["Chuyên gia tính trước khi sửa: tăng xa từ 10 000 lên 100 000 gần như không đổi lỗi — chính mặt gần mới quyết định"]
  - id: L13
    title: "Hành trình: chiếu sáng từ mô hình kinh nghiệm năm 1975 tới kết xuất dựa trên vật lý thời gian thực"
    spec: lessons/gfx/L13_hanh_trinh_chieu_sang.yaml
    requires: [L06, L09, L10]
    kind: journey
    objectives: ["Kể lại bốn chặng 1975–1977 → 1980–1986 → 1994 → 2012–2013 của mô hình chiếu sáng, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại con số của từng chặng: phần bóng sáng mũ s, số tia cần tăng 100 lần để giảm nhiễu 10 lần, hệ số phản xạ thẳng góc F₀ = 0,04 với chiết suất 1,5 và xấp xỉ luỹ thừa bậc 5, phép đổi độ nhám α = r²", "Chọn mô hình chiếu sáng phù hợp với ngân sách khung hình của dự án"]
    example: "1975–1977 (Phong, Blinn): n · h = 0,95 với s = 32 cho 0,95³² ≈ 0,194; 1980–1986 (Whitted, Kajiya): sai số lấy mẫu ngẫu nhiên giảm theo 1/√N nên giảm nhiễu 10 lần cần 10² = 100 lần số tia; 1994 (Schlick): chiết suất n = 1,5 cho F₀ = ((1,5 − 1)/(1,5 + 1))² = 0,04, ở cos = 0,5 phản xạ F = 0,04 + 0,96 · 0,5⁵ = 0,07; 2012–2013 (Burley, Karis): độ nhám cảm nhận r = 0,5 đổi thành α = r² = 0,25, phi kim giữ cố định F₀ = 0,04, phần khuếch tán nhân (1 − 0,07) = 0,93 (CITED Phong 1975, Blinn 1977, Whitted 1980, Kajiya 1986, Schlick 1994, Burley 2012, Karis 2013; VER GFX:L13)"
    fix: ["Không trộn tham số kinh nghiệm cũ (màu phản xạ tuỳ ý) vào vật liệu dựa trên vật lý — làm phá vỡ bảo toàn năng lượng dưới các nguồn sáng khác nhau", "Dò tia thời gian thực không thay thế raster hoá cho mọi bước: khung hình hiện đại vẫn raster hoá hình học chính rồi dùng dò tia có chọn lọc cho bóng đổ và phản xạ"]
