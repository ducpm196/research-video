# Giáo án THỰC HÀNH — BEP · Hệ sinh thái Backend Doanh nghiệp & Phỏng vấn (WP-3B)
# Trạng thái: active. Bộ kiểm độc lập: audit/bep/verify_bep.py; mỗi bài có du_lieu.txt + >=2 ca_an/.
# Căn cứ JD: GraphQL Supergraph/Subgraph, TDD/Component test, C4/UML, Serverless/OWASP BOLA, Protobuf/Avro, Saga/DLQ, Singleflight/Audit, OpenTelemetry/Gateway, AI coding + SLA/OLA/L3, Review/RCA.
course: BEP
status: active
lab:
  lang:
  - py
  requires:
  - PYT:L04
lessons:
- id: L00
  title: GraphQL Supergraph, Subgraph và gộp truy vấn DataLoader
  spec: lessons/bep/L00_graphql_supergraph_dataloader.yaml
  requires: []
  objectives:
  - Phân tách lược đồ GraphQL thành Supergraph gồm nhiều Subgraph độc lập theo miền nghiệp vụ
  - Phát hiện bùng nổ truy vấn N cộng 1 khi phân giải quan hệ lồng nhau từng phần tử một
  - Cài cơ chế gom khoá DataLoader giảm hàng chục truy vấn xuống đúng hai lượt hợp nhất
  example: 20 đơn hàng gọi Subgraph tài khoản từng cái tốn 1 + 20 = 21 truy vấn; qua DataLoader gom khoá còn đúng 2 truy
    vấn (VER BEP:L00)
  fix:
  - Thiếu DataLoader biến một lời gọi GraphQL đẹp mắt thành bão N+1 câu SQL xuống cơ sở dữ liệu
  requires_ext:
  - BNX:L01
- id: L01
  title: TDD Red–Green–Refactor & kiểm thử thành phần hợp đồng
  spec: lessons/bep/L01_tdd_kiem_thu_thanh_phan.yaml
  requires:
  - L00
  objectives:
  - Áp dụng vòng lặp Đỏ Xanh Tái cấu trúc trong phát triển hướng kiểm thử TDD
  - Viết kiểm thử thành phần xác minh hợp đồng đầu ra và bất biến nghiệp vụ
  - Cô lập bộ phụ thuộc ngoài khi kiểm thử tích hợp dịch vụ backend
  example: Ca kiểm hợp đồng kiểm tra tổng tiền phải dương và mã trạng thái HTTP 422 khi số dư nhỏ hơn lượng rút (VER
    BEP:L01)
  fix:
  - Viết mã xong mới viết kiểm thử hay biến ca kiểm thành phép chép lại lỗi sai hiện có trong mã
  requires_ext:
  - JV2:L08
- id: L02
  title: Sơ đồ kiến trúc C4, UML tuần tự và đường găng độ trễ
  spec: lessons/bep/L02_so_do_kien_truc_c4_uml.yaml
  requires:
  - L01
  objectives:
  - Tổ chức bản vẽ hệ thống phân tầng theo mô hình C4 từ Bối cảnh tới Thành phần
  - Đọc và kiểm tra tính hợp lệ của chuỗi gọi tuần tự UML không tạo chu trình vòng
  - Tính đường găng độ trễ tổng thể qua chuỗi gọi nối tiếp và rẽ nhánh song song
  example: Chuỗi gọi đồng bộ A -> (B 40ms || C 65ms) -> D 25ms với ngưỡng 10ms tại A cho đường găng 10 + 65 + 25 = 100
    ms (VER BEP:L02)
  fix:
  - Vẽ sơ đồ C4/UML xong để trang trí trong tài liệu mà không kiểm phụ thuộc vòng hay ngân sách độ trễ
  requires_ext:
  - FND:L05
- id: L03
  title: Đám mây AWS/Azure, Serverless FaaS và bảo mật OWASP BOLA
  spec: lessons/bep/L03_cloud_serverless_owasp.yaml
  requires:
  - L02
  objectives:
  - Ước lượng chi phí khởi động nguội và thông lượng đồng thời trên Serverless FaaS AWS Lambda và Azure Functions
  - Phát hiện lỗ hổng kiểm soát truy cập cấp đối tượng BOLA theo chuẩn OWASP API Top 10
  - Cài lớp bảo vệ sở hữu chủ thể và truy vấn tham số hoá chặn chèn SQL ngay tại hàm xử lý
  example: 200 lần gọi Lambda mỗi 50ms gồm 10% khởi động nguội thêm 400ms làm p95 tăng vọt; chốt owner_id == token.sub
    chặn 100% BOLA (VER BEP:L03)
  fix:
  - Kiểm tra xong mỗi chữ ký JWT hợp lệ là cho đọc mọi order_id mà quên kiểm tra order.owner_id == user_id
  requires_ext:
  - BNX:L04
  - SPB:L08
- id: L04
  title: Lược đồ Protobuf, Avro và tiến hoá tương thích ngược
  spec: lessons/bep/L04_protobuf_avro_tuong_thich_nguoc.yaml
  requires:
  - L03
  objectives:
  - Phân biệt mã hoá nhị phân theo số thẻ trường của Protobuf và Avro so với JSON văn bản
  - Kiểm định tương thích ngược và tương thích xuôi trong Schema Registry giữa hai phiên bản
  - Phát hiện thay đổi phá vỡ như xoá trường bắt buộc hoặc đổi kiểu số thẻ dữ liệu
  example: Thêm trường currency với mặc định VND an toàn cả 2 chiều; xoá trường amount hoặc đổi số thẻ làm vỡ bộ giải
    mã cũ (VER BEP:L04)
  fix:
  - Thêm cột mới bắt buộc không có giá trị mặc định vào sự kiện Kafka/gRPC khiến toàn bộ người tiêu thụ cũ văng ngoại
    lệ
  requires_ext:
  - BNX:L02
- id: L05
  title: Điều phối quy trình Saga, bù trừ, Exponential Backoff và DLQ
  spec: lessons/bep/L05_workflow_saga_dlq_backoff.yaml
  requires:
  - L04
  objectives:
  - Cài máy điều phối quy trình Saga gọi bù trừ theo thứ tự đảo ngược khi một bước lỗi
  - Áp dụng lùi lũy thừa Exponential Backoff có trần giới hạn cho lỗi mạng tạm thời
  - Chuyển thông điệp độc hại sang kênh thư chết DLQ sau khi hết số lần thử lại tối đa
  example: Saga 3 bước (reserve -> debit -> ship) gặp lỗi tại ship sẽ bù trừ ngược compensate_debit rồi compensate_reserve;
    backoff 100, 200, 400 ms rồi vào DLQ (VER BEP:L05)
  fix:
  - Thử lại vô hạn một thông điệp hỏng định dạng làm nghẽn cứng toàn bộ phân vùng người tiêu thụ
  requires_ext:
  - SPB:L06
- id: L06
  title: Chống sập Cache Stampede bằng Singleflight và chuỗi Audit Trail
  spec: lessons/bep/L06_cache_stampede_audit_trail.yaml
  requires:
  - L05
  objectives:
  - Ngăn chặn bão truy vấn Cache Stampede khi khoá nóng hết hạn đồng loạt trên cụm máy
  - Ghi nhật ký kiểm toán Audit Trail liên kết chuỗi băm phát hiện mọi chỉnh sửa trái phép
  - Cài cơ chế hợp nhất yêu cầu Singleflight và rải ngẫu nhiên thời gian sống TTL
  example: '100 yêu cầu cùng hụt khoá hot_key: thiếu Singleflight bắn 100 SQL, có Singleflight chỉ gọi đúng 1 SQL; Audit
    nối prev_hash chặn sửa 1 dòng (VER BEP:L06)'
  fix:
  - Đặt cùng một thời điểm hết hạn chẵn giờ cho hàng nghìn khoá cache khiến mọi máy đồng loạt hết hạn cùng giây
  requires_ext:
  - BNK:L06
- id: L07
  title: Truy vết phân tán OpenTelemetry và điều phối API Gateway
  spec: lessons/bep/L07_tracing_opentelemetry_gateway.yaml
  requires:
  - L06
  objectives:
  - Dựng cây vết phân tán OpenTelemetry nối trace_id và parent_span_id qua các dịch vụ
  - Tính thời gian tự xử lý ròng và tìm nhịp nghẽn phân vị p95 trên cây truy vết
  - Cài chính sách giới hạn tốc độ và tự ngắt Circuit Breaker ngay tại API Gateway
  example: Span gốc Gateway tổng 120ms gồm Auth 25ms và Pay 80ms -> tự xử lý tại Gateway chỉ 15ms, nghẽn thật nằm ở Pay
    (VER BEP:L07)
  fix:
  - Nhìn thấy span cổng Gateway dài 120ms liền đổ lỗi cho Gateway chậm mà quên trừ thời gian các span con bên dưới
  requires_ext:
  - BNX:L30
  - SPB:L11
- id: L08
  title: Quy trình AI Coding kiểm chứng bất biến và vận hành SLA, OLA, L3
  spec: lessons/bep/L08_ai_coding_sla_ola_l3.yaml
  requires:
  - L07
  objectives:
  - Rà soát mã do công cụ AI coding Cursor và Claude Code sinh ra bằng kiểm chứng bất biến biên
  - Tính ngân sách lỗi khả dụng SLA từ phần trăm cam kết dịch vụ hàng tháng
  - Phân tầng xử lý sự cố vận hành OLA và hỗ trợ kỹ thuật mức L3
  example: SLA 99,9% trong tháng 30 ngày cho ngân sách gián đoạn 43,2 phút; bản vá AI thiếu guard mẫu số bằng 0 bị chặn
    ngay tại kiểm chứng bất biến (VER BEP:L08)
  fix:
  - Chép nguyên hàm AI sinh ra lên nhánh chính mà không chạy kiểm thử giá trị biên, số âm và chia cho 0
  requires_ext:
  - SPB:L09
- id: L09
  title: 'Tình huống chuyên gia: Code review OWASP, Agile và Postmortem RCA'
  spec: lessons/bep/L09_tinh_huong_review_postmortem.yaml
  requires:
  - L08
  objectives:
  - Thực hiện rà soát mã nguồn code review phát hiện lỗ hổng SQLi, so sánh bí mật và thiếu lũy đẳng
  - Áp dụng quy trình Agile gắn tiêu chí hoàn thành với bằng chứng kiểm thử và giám sát
  - Viết hậu kiểm sự cố Postmortem và tìm nguyên nhân gốc RCA không đổ lỗi cá nhân
  example: Rà soát 1 PR thanh toán phát hiện ghép chuỗi SQL, so sánh HMAC bằng == và thiếu khoá lũy đẳng; viết 5-Whys
    RCA tìm lỗ hổng quy trình thay vì đổ lỗi nhân sự (VER BEP:L09)
  fix:
  - Viết báo cáo sự cố quy trách nhiệm cá nhân do sơ suất thay vì hỏi tại sao hàng rào CI/test lại để lọt lỗi đó
  requires_ext:
  - SPB:L12
