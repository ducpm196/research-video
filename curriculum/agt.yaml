# Giáo án KẾ HOẠCH — AGT · AI agent: tác tử dùng mô hình ngôn ngữ
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã AGT:Lxx (nhị thức, Bayes, sắp xếp tô pô, mô phỏng chính sách quyền).
# Căn cứ phạm vi: S. Yao và cộng sự, ReAct (ICLR 2023); T. Schick và cộng sự, Toolformer (2023); AIMA bản 4 chương 2 (tác tử), 11 (lập kế hoạch);
#   OWASP Top 10 for LLM Applications (2025) — chèn lời nhắc, quyền quá rộng; M. Chen và cộng sự (2021) — pass@k;
#   S. Yao và cộng sự, τ-bench (2024) — pass^k. Tên kỹ thuật chỉ hiện trên màn hình; lời đọc mô tả bằng tiếng Việt.
# Vì sao cần: LLM dạy mô hình; AIF dạy tác tử, tìm kiếm, lập kế hoạch. Khoá này ghép hai thứ: vòng lặp tác tử, gọi công cụ, bộ nhớ, đánh giá,
#   chi phí, an toàn — và khi nào KHÔNG nên dùng tác tử.
# Thứ tự học: sau LLM (toàn khoá), AIF L00, L10; SEC L04, L06; CLD L04, L12.
course: AGT
status: planned
lessons:
  - id: L00
    title: "Từ mô hình ngôn ngữ tới tác tử: vòng lặp quan sát, suy nghĩ, hành động"
    spec: lessons/agt/L00_vong_lap_tac_tu.yaml
    requires: []
    requires_ext: ["AIF:L00", "LLM:L07"]
    objectives: ["Mô tả vòng lặp tác tử và điều kiện dừng", "Giải thích sai số tích lũy qua nhiều bước"]
    example: "mỗi bước đúng 95%, độc lập: nhiệm vụ 20 bước hoàn thành ≈ 0,95²⁰ ≈ 35,8%; mỗi bước 99% → ≈ 81,8% (VER AGT:L00)"
    fix: ["Độ tin cậy từng bước cao vẫn có thể cho độ tin cậy cả nhiệm vụ thấp — đo theo NHIỆM VỤ, không theo bước"]
  - id: L01
    title: "Gọi công cụ: lược đồ, kiểm tra tham số, lỗi và thử lại"
    spec: lessons/agt/L01_goi_cong_cu.yaml
    requires: [L00]
    requires_ext: ["SDP:L01", "SEC:L06"]
    objectives: ["Viết lược đồ tham số cho công cụ", "Kiểm tra tham số TRƯỚC khi thực thi"]
    example: "lược đồ “chuyển tiền(số tiền: số nguyên dương ≤ 10 000 000, tài khoản: 10 chữ số)”: 3 lời gọi mô hình đề xuất, 1 lời gọi có số tiền âm bị từ chối trước khi chạy (VER AGT:L01)"
    fix: ["Tham số do mô hình sinh là ĐẦU VÀO KHÔNG TIN CẬY — kiểm như kiểm dữ liệu người dùng"]
  - id: L02
    title: "Lập kế hoạch và phân rã nhiệm vụ"
    spec: lessons/agt/L02_lap_ke_hoach.yaml
    requires: [L00]
    requires_ext: ["AIF:L10", "DMS:L08"]
    objectives: ["Phân rã nhiệm vụ thành đồ thị phụ thuộc", "Chạy song song các bước độc lập"]
    example: "5 bước: tìm tài liệu (2 s), đọc A (3 s), đọc B (4 s) sau tìm; tổng hợp (2 s) sau đọc A và B; kiểm tra (1 s): tuần tự 12 s, theo đường găng 9 s (VER AGT:L02)"
    fix: ["Kế hoạch lập trước phải được xem lại sau mỗi quan sát mới — môi trường thay đổi"]
  - id: L03
    title: "Bộ nhớ: ngữ cảnh ngắn hạn, tóm tắt và truy xuất dài hạn"
    spec: lessons/agt/L03_bo_nho.yaml
    requires: [L00]
    requires_ext: ["LLM:L12", "LLM:L13"]
    objectives: ["Ước lượng ngân sách ngữ cảnh", "So sánh tóm tắt và truy xuất"]
    example: "ngữ cảnh 128 nghìn từ tố, lời nhắc hệ thống 8 nghìn, mỗi lượt thêm 2 nghìn: sau 60 lượt là đầy → phải tóm tắt hoặc chuyển ra bộ nhớ ngoài (VER AGT:L03)"
    fix: ["Tóm tắt làm mất chi tiết vĩnh viễn — lưu bản gốc ra ngoài nếu có thể cần lại"]
  - id: L04
    title: "Tác tử tìm kiếm thông tin: truy vấn lặp và trích dẫn nguồn"
    spec: lessons/agt/L04_tim_thong_tin.yaml
    requires: [L01, L03]
    requires_ext: ["LLM:L12"]
    objectives: ["Viết lại truy vấn theo kết quả trước", "Gắn mỗi khẳng định với nguồn"]
    example: "độ phủ@5 của lần truy vấn đầu 60%; mỗi lần viết lại truy vấn tìm thêm 50% phần còn thiếu, độc lập: sau 3 lần ≈ 1 − 0,4 · 0,5² = 90% (VER AGT:L04)"
    fix: ["Có nguồn trích dẫn chưa đủ — phải kiểm câu trích có thật sự nói điều được khẳng định"]
  - id: L05
    title: "Tự kiểm tra: bộ kiểm chứng, phản tư và tạo nhiều lần"
    spec: lessons/agt/L05_tu_kiem_tra.yaml
    requires: [L00]
    requires_ext: ["LLM:L11", "DSC:L11"]
    objectives: ["Tính độ tin cậy của câu trả lời qua bộ kiểm chứng", "Biết khi nào bộ kiểm chứng làm hại"]
    example: "bộ sinh đúng 60%; bộ kiểm chứng nhận đúng câu đúng 90%, nhận nhầm câu sai 20% → trong các câu được nhận, ≈ 87,1% là đúng (VER AGT:L05)"
    fix: ["Bộ kiểm chứng chung mô hình với bộ sinh thường chung điểm mù — ưu tiên kiểm chứng bằng chương trình (chạy thử, so khớp) khi có thể"]
  - id: L06
    title: "Nhiều tác tử: phân vai, điều phối và chi phí giao tiếp"
    spec: lessons/agt/L06_nhieu_tac_tu.yaml
    requires: [L02]
    requires_ext: ["DSY:L00"]
    objectives: ["So sánh điều phối tập trung và ngang hàng", "Đếm chi phí giao tiếp"]
    example: "6 tác tử: trao đổi mọi cặp 6 · 5 = 30 kênh một chiều; qua một tác tử điều phối 2 · 5 = 10 (VER AGT:L06)"
    fix: ["Thêm tác tử không miễn phí: mỗi lần chuyển giao là một lần có thể mất thông tin hoặc hiểu sai"]
  - id: L07
    title: "Đánh giá tác tử: thành công nhiệm vụ, pass@k và pass^k"
    spec: lessons/agt/L07_danh_gia_tac_tu.yaml
    requires: [L00]
    requires_ext: ["LLM:L10"]
    objectives: ["Phân biệt “ít nhất một lần thành công” và “thành công mọi lần”", "Thiết kế bộ nhiệm vụ đánh giá có trạng thái cuối kiểm được"]
    example: "mỗi lần chạy thành công 70%, độc lập: pass@3 (ít nhất 1/3) = 1 − 0,3³ ≈ 97,3%; pass^3 (cả 3) = 0,7³ ≈ 34,3% (VER AGT:L07)"
    fix: ["Sản phẩm phục vụ người dùng cần độ ỔN ĐỊNH (pass^k), không phải “thử vài lần sẽ được” (pass@k)"]
  - id: L08
    title: "Chi phí và độ trễ: ngân sách từ tố và bộ nhớ đệm lời nhắc"
    spec: lessons/agt/L08_chi_phi_do_tre.yaml
    requires: [L03]
    objectives: ["Tính tổng từ tố đầu vào của vòng lặp nhiều bước", "Giải thích lợi ích của bộ nhớ đệm tiền tố"]
    example: "10 bước, ngữ cảnh bắt đầu 2000 từ tố và tăng 500 mỗi bước, gửi lại toàn bộ mỗi lần: tổng 42 500 từ tố đầu vào — gấp ≈ 6,5 lần ngữ cảnh cuối 6 500 (VER AGT:L08)"
    fix: ["Chi phí vòng lặp tác tử tăng gần bậc hai theo số bước nếu gửi lại toàn bộ lịch sử"]
  - id: L09
    title: "An toàn cho tác tử: chèn lời nhắc gián tiếp, quyền tối thiểu, xác nhận của người dùng"
    spec: lessons/agt/L09_an_toan_tac_tu.yaml
    requires: [L01]
    requires_ext: ["SEC:L04", "SEC:L06"]
    objectives: ["Giải thích chèn lời nhắc gián tiếp qua nội dung đọc được", "Thiết kế quyền công cụ và điểm xác nhận"]
    example: "chính sách: đọc tự do; gửi thư và chuyển tiền cần người dùng xác nhận; xoá dữ liệu bị cấm — 4 hành động do một trang web “ra lệnh” thì chỉ hành động đọc chạy ngay (VER AGT:L09)"
    fix: ["Không có cách lọc lời nhắc nào chặn được mọi kiểu chèn — giới hạn QUYỀN của công cụ mới là lớp bảo vệ chính"]
  - id: L10
    title: "Quan sát và gỡ lỗi tác tử: vết truy vết, phát lại, phân loại lỗi"
    spec: lessons/agt/L10_quan_sat_go_loi.yaml
    requires: [L07]
    requires_ext: ["CLD:L11"]
    objectives: ["Ghi vết truy vết cho từng bước và lời gọi công cụ", "Phân loại lỗi để sửa đúng chỗ"]
    example: "50 lần chạy thất bại phân loại: 22 chọn sai công cụ, 15 tham số sai, 9 dừng sớm, 4 lỗi công cụ → sửa mô tả công cụ trước (44%) (VER AGT:L10)"
    fix: ["Sửa lời nhắc theo một lần chạy lỗi dễ làm hỏng các ca khác — luôn chạy lại toàn bộ bộ đánh giá"]
  - id: L11
    title: "Tổng hợp: chọn quy trình cố định hay tác tử tự chủ"
    spec: lessons/agt/L11_tong_hop.yaml
    requires: [L05, L07, L08, L09]
    objectives: ["So sánh quy trình cố định có bước gọi mô hình với tác tử tự chủ", "Thiết kế tác tử có điểm dừng, giới hạn và người giám sát"]
    example: "nhiệm vụ 4 bước biết trước: quy trình cố định mỗi bước 98% → 92,2%; tác tử tự chọn bước, mỗi bước 95% nhưng trung bình 6 bước → 73,5% (số minh hoạ, VER AGT:L11)"
    fix: ["Tác tử đáng dùng khi các bước KHÔNG biết trước; khi biết trước, quy trình cố định rẻ hơn và dễ kiểm hơn"]
  - id: L12
    title: "Tình huống chuyên gia theo dòng thời gian: tác tử dùng công cụ, 2022 tới 2025"
    spec: lessons/agt/L12_hanh_trinh_tac_tu_cong_cu.yaml
    requires: [L00, L01, L07, L08, L09]
    kind: journey
    objectives: ["Kể lại hành trình của tác tử dùng công cụ qua năm chặng (2022 → 2025), mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại tỉ lệ giải được, số bài giải được và mức chênh giữa các cách làm từ số liệu của nguồn", "Chọn cách dựng và cách đo tác tử hợp với quy mô của mình, kèm điều kiện đổi lựa chọn"]
    example: "nhà ảo 71% − 37% = 34 điểm (RE23); 400 / 1400 ≈ 0,29 (TF23); 2294 / 90 000 ≈ 2,5%, 1,96% × 2294 ≈ 45 bài (SB24); 286 / 2294 = 12,47%, ≈ 6,4 lần 45 trên cùng tập; tập nhẹ 18% − 15% của 300 = 9 bài (SA24); 65% × 500 = 325 bài (SBV) — không chia 65 cho 1,96 vì khác tập (VER AGT:L12)"
    fix: ["Chỉ khẳng định điều có trong RE23, TF23, GR23, SB24, SA24, SBV (audit/agt/sources_L12.md); chèn lời nhắc gián tiếp chỉ ở mức khái niệm phòng thủ", "Bài của OpenAI về SWE-bench Verified trả 403 (web.archive.org 429): không dạy số người chấm, tỉ lệ loại, điểm từng mô hình; bản v3 của SWE-bench ghi 1,97 cho Claude 2 ở Bảng 5, bài dùng 1,96% của tóm tắt và §5", "65% (Verified, 500 bài, 2025) và 1,96% / 12,47% (tập đầy đủ 2294 bài) không so trực tiếp; đội 40 lỗi, 160 đô la là số minh hoạ"]
