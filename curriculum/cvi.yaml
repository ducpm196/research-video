# Giáo án KẾ HOẠCH — CVI · Thị giác máy tính
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã CVI:Lxx (tích chập numpy, ngưỡng Otsu vét cạn, chiếu camera,
#   công thức RANSAC, giao trên hợp của hộp, IoU và Dice, mô phỏng học lối tắt).
# Căn cứ phạm vi (CITED): R. Szeliski, Computer Vision: Algorithms and Applications (bản 2, 2022); R. Hartley, A. Zisserman, Multiple View Geometry (2004);
#   N. Otsu (IEEE SMC 1979); D. Lowe, SIFT (IJCV 2004) — phép thử tỉ số 0,8; M. Fischler, R. Bolles, RANSAC (CACM 1981);
#   M. Everingham và cộng sự, PASCAL VOC (IJCV 2010) — IoU, độ chính xác trung bình; R. Geirhos và cộng sự, “Shortcut learning” (Nature MI 2020);
#   S. Beery và cộng sự, “Recognition in Terra Incognita” (ECCV 2018).
# Vì sao cần: CS115 L34 dạy phép tích chập và CNN; ROB L11 dạy camera lỗ kim cho robot. Chưa có khoá nào dạy thị giác như một chuyên ngành:
#   ảnh số, lọc cổ điển, hình học nhiều góc nhìn, đo phát hiện và phân đoạn, độ bền khi đổi miền dữ liệu.
# Thứ tự học: sau CS115 L02, L21, L34 và ROB L11 (hoặc RBM L03).
course: CVI
status: planned
lessons:
  - id: L00
    title: "Ảnh số: điểm ảnh, kênh màu, độ sâu bit và dung lượng"
    spec: lessons/cvi/L00_anh_so.yaml
    requires: []
    requires_ext: ["CSA:L00"]
    objectives: ["Tính dung lượng một khung và một giây video chưa nén", "Đọc ảnh như một mảng số ba chiều"]
    example: "1920 × 1080, 3 kênh, 8 bit mỗi kênh: 6 220 800 byte ≈ 5,93 MiB mỗi khung; 30 khung mỗi giây ≈ 186,6 triệu byte mỗi giây (VER CVI:L00)"
    fix: ["Giá trị điểm ảnh sRGB không tỉ lệ với độ sáng thật — tính trung bình độ sáng phải đổi sang tuyến tính trước: ((v/255 + 0,055)/1,055)^2,4, giá trị 128 chỉ ứng với 0,216 ánh sáng"]
  - id: L01
    title: "Lọc ảnh bằng tích chập: làm mờ, phát hiện cạnh Sobel"
    spec: lessons/cvi/L01_loc_anh.yaml
    requires: [L00]
    requires_ext: ["CS115:L34"]
    objectives: ["Tính một điểm ra của bộ lọc 3 × 3", "Giải thích vì sao làm mờ trước khi lấy cạnh giảm nhiễu"]
    example: "vùng 3 × 3 có cột phải 10, hai cột trái 0; bộ lọc Sobel S_x [−1 0 1; −2 0 2; −1 0 1] (đo thay đổi theo chiều ngang, tức tìm cạnh dọc) → 10 + 20 + 10 = 40; vùng phẳng → 0 (VER CVI:L01)"
    fix: ["Thư viện học sâu tính tương quan chéo (không lật bộ lọc) — với Sobel lật và không lật đổi dấu kết quả"]
  - id: L02
    title: "Biểu đồ tần suất, cân bằng và ngưỡng Otsu"
    spec: lessons/cvi/L02_nguong_otsu.yaml
    requires: [L00]
    requires_ext: ["CS115:L13"]
    objectives: ["Chọn ngưỡng làm phương sai giữa hai lớp lớn nhất", "Nhận ra khi biểu đồ không có hai đỉnh thì ngưỡng toàn cục thất bại"]
    example: "điểm ảnh 10, 10, 12, 50, 52, 55: vét mọi ngưỡng, phương sai giữa lớp lớn nhất khi tách {10, 10, 12} và {50, 52, 55} (VER CVI:L02)"
    fix: ["Ánh sáng không đều làm một ngưỡng cho cả ảnh sai — dùng ngưỡng cục bộ theo vùng"]
  - id: L03
    title: "Mô hình camera và hiệu chuẩn: ma trận nội, méo ống kính"
    spec: lessons/cvi/L03_hieu_chuan_camera.yaml
    requires: [L00]
    requires_ext: ["ROB:L11"]
    objectives: ["Chiếu một điểm 3D lên ảnh bằng tiêu cự và tâm ảnh", "Giải thích méo hướng tâm và vì sao phải hiệu chuẩn trước khi đo"]
    example: "tiêu cự 800 điểm ảnh, tâm ảnh (320, 240), điểm (0,5; 0,25; 2) m → u = 800 · 0,25 + 320 = 520, v = 800 · 0,125 + 240 = 340 (VER CVI:L03)"
    fix: ["Ống kính góc rộng méo mạnh ở rìa — đo khoảng cách ở rìa ảnh chưa hiệu chuẩn sai nhiều điểm ảnh"]
  - id: L04
    title: "Đặc trưng và khớp ảnh: điểm góc, mô tả, phép thử tỉ số"
    spec: lessons/cvi/L04_khop_dac_trung.yaml
    requires: [L01]
    objectives: ["Giữ một cặp khớp khi khoảng cách gần nhất đủ nhỏ so với gần nhì", "Giải thích vì sao vùng lặp lại (gạch lát) sinh khớp sai"]
    example: "khoảng cách mô tả gần nhất 0,3, gần nhì 0,5 → tỉ số 0,6 < 0,8: giữ; 0,45 và 0,5 → 0,9: bỏ vì mơ hồ (VER CVI:L04)"
    fix: ["Khớp đúng nhất chưa chắc là khớp đúng — luôn cần bước kiểm hình học (bài 5)"]
  - id: L05
    title: "Ước lượng bền vững với RANSAC: bao nhiêu lần thử là đủ"
    spec: lessons/cvi/L05_ransac.yaml
    requires: [L04]
    requires_ext: ["DMS:L19"]
    objectives: ["Tính số lần lặp N = ln(1 − p) / ln(1 − wˢ)", "Giải thích vì sao bình phương tối thiểu thường thất bại khi có điểm sai lớn"]
    example: "50% khớp đúng, mỗi mô hình cần 4 cặp, muốn 99% chắc gặp ít nhất một bộ toàn đúng: N = ⌈ln 0,01 / ln(1 − 0,5⁴)⌉ = 72 lần; 30% khớp đúng cần 567 lần (VER CVI:L05)"
    fix: ["Số lần thử tăng rất nhanh khi tỉ lệ đúng giảm — lọc khớp tốt trước rẻ hơn thử nhiều hơn"]
  - id: L06
    title: "Hình học hai góc nhìn: độ sâu từ chênh lệch ảnh"
    spec: lessons/cvi/L06_do_sau_hai_camera.yaml
    requires: [L03, L05]
    objectives: ["Tính độ sâu Z = fB/d", "Ước lượng sai số độ sâu khi chênh lệch sai một điểm ảnh"]
    example: "f = 700 điểm ảnh, khoảng cách hai camera B = 0,12 m, chênh lệch 42 → Z = 2 m; lệch ±1 điểm ảnh → 1,95 m hoặc 2,05 m; ở 8 m chênh lệch chỉ 10,5 → sai một điểm ảnh lệch 0,70 tới 0,84 m (VER CVI:L06)"
    fix: ["Sai số độ sâu tăng theo Z² — hai camera gần nhau không đo xa được"]
  - id: L07
    title: "Phân loại ảnh bằng mạng tích chập và học chuyển giao"
    spec: lessons/cvi/L07_hoc_chuyen_giao.yaml
    requires: [L01]
    requires_ext: ["CS115:L34", "CS115:L19"]
    objectives: ["Đếm tham số khi chỉ huấn luyện lại lớp cuối", "Chọn tăng cường dữ liệu không phá nhãn"]
    example: "đặc trưng 512 chiều, 10 lớp: lớp cuối có 512 · 10 + 10 = 5130 tham số — học được từ vài trăm ảnh; chữ số bảy đoạn: lật ngang chữ 2 thành 5, xoay 180° chữ 6 thành 9 — với chữ số chỉ dịch vài điểm ảnh, đổi độ sáng (VER CVI:L07)"
    fix: ["Tăng cường làm đổi nhãn (xoay chữ số, lật biển báo trái–phải) dạy mô hình điều sai"]
  - id: L08
    title: "Phát hiện đối tượng: giao trên hợp, loại bỏ không cực đại, độ chính xác trung bình"
    spec: lessons/cvi/L08_phat_hien_doi_tuong.yaml
    requires: [L07]
    requires_ext: ["CS115:L21"]
    objectives: ["Tính giao trên hợp của hai hộp", "Dùng loại bỏ không cực đại để giữ một hộp cho mỗi vật"]
    example: "hộp (0, 0, 10, 10) và (5, 5, 15, 15): giao 25, hợp 175 → IoU ≈ 0,143 < 0,5: hai vật khác nhau; hộp (0, 0, 10, 10) và (1, 0, 11, 10): IoU 90/110 ≈ 0,818 → bỏ hộp điểm thấp hơn (VER CVI:L08)"
    fix: ["Ngưỡng IoU khi chấm (0,5 hay 0,75) đổi hẳn con số độ chính xác — báo cáo phải ghi ngưỡng"]
  - id: L09
    title: "Phân đoạn ảnh: IoU, hệ số Dice và lớp hiếm"
    spec: lessons/cvi/L09_phan_doan.yaml
    requires: [L08]
    objectives: ["Tính IoU và Dice từ số điểm ảnh đúng, thừa, thiếu", "Giải thích vì sao độ chính xác điểm ảnh lừa khi vật nhỏ"]
    example: "đúng 40, thừa 10, thiếu 10 điểm ảnh → IoU 40/60 ≈ 0,667, Dice 80/100 = 0,8; vật chiếm 1% ảnh, đoán toàn nền → độ chính xác điểm ảnh 99% mà IoU của vật = 0 (VER CVI:L09)"
    fix: ["Dice luôn ≥ IoU với cùng kết quả (Dice = 2IoU/(1 + IoU)) — so hai bài báo phải cùng thước đo"]
  - id: L10
    title: "Dịch chuyển miền và độ bền: khi ảnh thật khác ảnh huấn luyện"
    spec: lessons/cvi/L10_dich_chuyen_mien.yaml
    requires: [L07]
    requires_ext: ["MLO:L08"]
    objectives: ["Tách độ chính xác theo điều kiện (sáng, tối, mưa) thay vì một con số chung", "Lập tập kiểm tra theo điều kiện triển khai"]
    example: "tập kiểm tra 900 ảnh ban ngày đúng 95%, 100 ảnh ban đêm đúng 50% → con số chung 90,5% che mất ban đêm; triển khai 50% ban đêm → kỳ vọng 72,5% (số minh hoạ, VER CVI:L10)"
    fix: ["Một con số trung bình trên tập kiểm tra cũ không nói gì về điều kiện mới — đo theo từng lát dữ liệu"]
  - id: L11
    title: "Tình huống chuyên gia: mô hình học lối tắt — đúng vì nền ảnh, không vì vật"
    spec: lessons/cvi/L11_tinh_huong_loi_tat.yaml
    requires: [L10, L09]
    objectives: ["Thiết kế phép thử phản chứng: giữ vật, đổi nền", "Đọc bản đồ chú ý như gợi ý, không như bằng chứng"]
    example: "95% ảnh bò trong tập huấn luyện có nền cỏ, 95% ảnh không có bò không có cỏ: luật “có cỏ thì là bò” đúng 95% trên tập cùng phân bố, nhưng bò trên bãi biển bị đoán sai 100% (VER CVI:L11)"
    fix: ["Chuyên gia luôn hỏi “mô hình có thể đúng vì lý do sai không?” và kiểm bằng dữ liệu đổi nền, đổi máy ảnh, đổi địa điểm"]
  - id: L12
    title: "Hành trình: nhận dạng ảnh trên một triệu ảnh, từ 28% lỗi năm 2010 tới 2,3% năm 2017 và sau đó"
    spec: lessons/cvi/L12_hanh_trinh_imagenet.yaml
    requires: [L07, L10, L11]
    requires_ext: ["PAR:L13"]
    objectives: ["Kể lại các chặng 2010–2017 của cuộc thi nhận dạng ảnh quy mô lớn và chặng sau đó, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại mức giảm lỗi 28,2% → 6,7% (4,2 lần) và số ảnh sai trên 100 000 ảnh thử", "Chọn cách dùng mô hình học sẵn và cách đo cho dự án ở quy mô của mình"]
    example: "lỗi năm đáp án 28,2% (2010) → 16,4% (2012) → 6,7% (2014): giảm 28,2 / 6,7 ≈ 4,2 lần; tính trên mỗi 100 000 ảnh: 28 200 → 6 700 ảnh sai (bộ thử 2010 có 150 000 ảnh → 42 300 ảnh sai; từ 2012 có 100 000 ảnh); 2015: 3,57% thấp hơn ước lượng lỗi một người chú thích đã luyện 5,1%; 2017: 2,251% (CITED Russakovsky và cộng sự IJCV 2015, He và cộng sự 2015, Hu và cộng sự 2017; VER CVI:L12)"
    fix: ["Không nói “máy giỏi hơn người”: 5,1% là lỗi của MỘT người chú thích đã luyện trên 1500 ảnh, tính theo năm đáp án; nguồn ghi người và máy sai ở những loại ảnh khác nhau", "Chặng 2012 kể theo phía dữ liệu và chống học vẹt: tăng cường cắt dời và lật ngang làm tập huấn luyện lớn lên 2048 lần (32 · 32 · 2), nhưng các mẫu phụ thuộc nhau"]
