# Giáo án Khoá MLP · Học máy Thực hành từ Dữ liệu Thật tới Triển khai trên CPU (14 bài L00–L13)
# Môi trường: labs/.venv-ml (Python 3.11.9 + scikit-learn 1.9.1 + scipy 1.17.1 + numpy 2.4.6 + torch 2.15.0+cpu).
# Mọi thí nghiệm & lab dùng random_state=42 / torch.manual_seed(42), chạy CPU thuần <= 30 giây, đầu ra tất định.
course: MLP
profile: stem
status: active
lessons:
- id: L00
  title: 'Bài 0 — Dữ liệu bảng & Pipeline chia Train/Val/Test chống rò rỉ'
  spec: lessons/mlp/L00_du_lieu_bang_chong_ro_ri.yaml
  requires: []
  requires_ext:
  - CS115:L23
  - PYT:L09
  objectives:
  - Phân tích cấu trúc dữ liệu bảng và chia tách Train/Val/Test phân tầng
  - Phát hiện sai số rò rỉ dữ liệu khi chuẩn hoá trước lúc chia tập
  - Cài Pipeline StandardScaler + LogisticRegression bảo đảm khớp chỉ trên Train
  example: Rò rỉ ranh giới trên 40 mẫu tạo chênh độ chuẩn hoá giả; Pipeline scikit-learn giữ trung bình Train 0.000 và chỉ truyền tham số sang Test
  fix:
  - Tuyệt đối không fit scaler hoặc imputer trước khi tách tập Test
- id: L01
  title: 'Bài 1 — Tiền xử lý cột số, phân loại & dữ liệu khuyết bằng ColumnTransformer'
  spec: lessons/mlp/L01_tien_xu_ly_column_transformer.yaml
  requires: [L00]
  objectives:
  - Điền giá trị khuyết bằng trung vị SimpleImputer tách biệt theo tập huấn luyện
  - Mã hoá biến phân loại rời rạc bằng OneHotEncoder bỏ qua nhãn lạ khi suy luận
  - Ghép ColumnTransformer sạch nối tiếp với bộ phân loại trong một Pipeline duy nhất
  example: Cột số thiếu NaN điền bằng trung vị Train = 20.0; nhãn chưa gặp lúc Train biến thành vector 0 nhờ handle_unknown='ignore'
  fix:
  - Luôn đặt handle_unknown='ignore' trên OneHotEncoder để không sập lúc phục vụ thực tế
- id: L02
  title: 'Bài 2 — Hồi quy tuyến tính có điều chuẩn Ridge & Lasso chống quá khớp'
  spec: lessons/mlp/L02_hoi_quy_dieu_chuan_ridge_lasso.yaml
  requires: [L01]
  objectives:
  - Phân biệt hình phạt L2 (Ridge co nhỏ trọng số) và L1 (Lasso đưa hệ số về 0)
  - Đo tác động của alpha lên sai số Train vs Test trên đặc trưng đa cộng tuyến
  - Chọn mức điều chuẩn giữ sai số kiểm thử thấp và mô hình ổn định
  example: Trên dữ liệu cộng tuyến make_regression có 20 đặc trưng (5 hữu ích), Lasso giữ đúng hệ số thưa còn Ridge thu nhỏ chuẩn L2 của w
  fix:
  - Chuẩn hoá thang đo trước khi dùng Ridge hoặc Lasso vì hình phạt phụ thuộc biên độ đặc trưng
- id: L03
  title: 'Bài 3 — Phân loại nhị phân, ngưỡng quyết định & cân bằng Precision–Recall'
  spec: lessons/mlp/L03_phan_loai_nguong_pr.yaml
  requires: [L02]
  objectives:
  - Đọc đúng ma trận nhầm lẫn TP, FP, FN, TN và công thức Precision, Recall, F1
  - Thay đổi ngưỡng phân loại p >= threshold thay vì mặc định 0.50 để đạt mục tiêu nghiệp vụ
  - So sánh F1 khi giữ ngưỡng 0.50 so với ngưỡng tối ưu chi phí bỏ sót
  example: Trên bộ 200 mẫu LogisticRegression, hạ ngưỡng từ 0.50 xuống 0.30 tăng Recall nhưng đánh đổi thêm báo động giả FP
  fix:
  - Không bao giờ mặc định ngưỡng 0.5 khi chi phí bỏ sót FN lớn hơn báo động giả FP nhiều lần
- id: L04
  title: 'Bài 4 — Kiểm chứng chéo StratifiedKFold & tìm siêu tham số GridSearchCV'
  spec: lessons/mlp/L04_kiem_chung_cheo_gridsearch.yaml
  requires: [L03]
  objectives:
  - Chia K phần phân tầng StratifiedKFold giữ nguyên tỉ lệ nhãn dương ở từng nếp
  - Chạy GridSearchCV bọc quanh Pipeline tránh rò rỉ trong từng vòng chéo
  - Đọc điểm trung bình và độ lệch chuẩn để không chọn cấu hình ăn may một lần chia
  example: StratifiedKFold(n_splits=5) với C trong [0.1, 1.0, 10.0] chọn siêu tham số tối ưu hoàn toàn trên Train rồi đánh giá độc lập trên Test
  fix:
  - Phải đặt Scaler nằm BÊN TRONG Pipeline trước khi đưa vào GridSearchCV
- id: L05
  title: 'Bài 5 — Dữ liệu lệch nhãn 2% & hiệu chuẩn xác suất Brier Score'
  spec: lessons/mlp/L05_lech_nhan_hieu_chuan_xac_suat.yaml
  requires: [L04]
  objectives:
  - Hiểu vì sao Accuracy đánh lừa trên dữ liệu lệch nhãn 98% âm – 2% dương
  - Dùng trọng số lớp class_weight='balanced' và ưu tiên PR-AUC thay cho Accuracy
  - Đo độ tin cậy xác suất thực tế bằng Brier score (càng gần 0 càng chuẩn)
  example: "Bộ make_classification weights=[0.95, 0.05] 600 mẫu: mô hình đoán toàn 0 đạt 95% Accuracy nhưng Recall = 0; balanced khôi phục phát hiện lớp hiếm"
  fix:
  - Dùng class_weight='balanced' làm thay đổi xác suất đầu ra thô nên cần kiểm định lại hiệu chuẩn trước khi đặt ngưỡng
- id: L06
  title: 'Bài 6 — Cây quyết định, Rừng ngẫu nhiên RandomForest & kiểm soát độ sâu'
  spec: lessons/mlp/L06_cay_quyet_dinh_rung_ngau_nhien.yaml
  requires: [L05]
  objectives:
  - Giải thích chia nhánh theo chỉ số bất thuần khiết Gini và giới hạn max_depth
  - So sánh phương sai của một cây đơn lẻ quá sâu với Rừng ngẫu nhiên nhiều cây
  - Rút trích feature_importances_ để kiểm tra cây có bám đặc trưng giả mạo không
  example: Cây không giới hạn đạt Train=1.000 nhưng kém ổn định; RandomForestClassifier(n_estimators=50, max_depth=5, random_state=42) giảm phương sai rõ rệt
  fix:
  - Độ quan trọng đặc trưng Gini có thể thiên vị cột nhiều giá trị rời rạc khác nhau
- id: L07
  title: 'Bài 7 — Tăng cường độ dốc HistGradientBoosting học từ phần dư'
  spec: lessons/mlp/L07_gradient_boosting_thuc_hanh.yaml
  requires: [L06]
  objectives:
  - Hiểu nguyên lý mỗi cây mới sửa sai số phần dư của tổng các cây đi trước
  - Điều chỉnh learning_rate phối hợp max_iter để hội tụ mượt không quá khớp
  - Chạy HistGradientBoostingClassifier trên dữ liệu bảng và so sánh với RandomForest
  example: HistGradientBoostingClassifier(max_iter=40, learning_rate=0.1, random_state=42) hạ sai số từng bước qua boosting trên CPU dưới 1 giây
  fix:
  - Không đặt learning_rate quá lớn kết hợp quá nhiều cây gây nhớ nhiễu nhanh chóng
- id: L08
  title: 'Bài 8 — Đặc trưng tương tác & kiểm chứng theo trục thời gian TimeSeriesSplit'
  spec: lessons/mlp/L08_dac_trung_time_series_split.yaml
  requires: [L07]
  objectives:
  - Tạo đặc trưng bậc hai PolynomialFeatures bổ sung mối quan hệ phi tuyến cho mô hình tuyến tính
  - Hiểu lỗi chí tử khi xáo trộn ngẫu nhiên chuỗi thời gian để đánh giá tương lai
  - Dùng TimeSeriesSplit bảo đảm mọi nếp kiểm tra luôn nằm sau tập huấn luyện về thời gian
  example: Dữ liệu vòng tròn phi tuyến tăng điểm phân loại nhờ PolynomialFeatures(degree=2); TimeSeriesSplit(n_splits=4) giữ train_max_idx < test_min_idx 100%
  fix:
  - Xáo trộn KFold thường trên dữ liệu giao dịch theo ngày làm lộ nhãn tương lai vào quá khứ
- id: L09
  title: 'Bài 9 — Học không giám sát thực hành: Phân cụm KMeans & giảm chiều PCA'
  spec: lessons/mlp/L09_khong_giam_sat_kmeans_pca.yaml
  requires: [L08]
  objectives:
  - Chuẩn hóa khoảng cách trước khi chạy phân cụm KMeans(n_init=10)
  - Chiếu đặc trưng qua PCA và đo tổng tỉ lệ phương sai được giữ lại
  - Phát hiện cụm bất thường dựa trên khoảng cách tới tâm cụm gần nhất
  example: "Giảm từ 8 chiều xuống 3 thành phần chính giữ > 80% phương sai trên cụm dữ liệu chuẩn hóa bằng random_state=42"
  fix:
  - Quên StandardScaler trước PCA và KMeans làm cột đơn vị lớn nuốt trọn các cột khác
- id: L10
  title: 'Bài 10 — Vòng huấn luyện PyTorch CPU: Tensor, Autograd & tối ưu SGD'
  spec: lessons/mlp/L10_pytorch_cpu_tensor_autograd.yaml
  requires: [L09]
  objectives:
  - Khởi tạo Tensor float32 có requires_grad=True và tính đạo hàm bằng loss.backward()
  - Nhớ rõ bắt buộc gọi zero_grad() trước mỗi bước cập nhật để không cộng dồn đạo hàm
  - Cài vòng huấn luyện hồi quy tuyến tính y = 3x + 2 bằng PyTorch CPU khớp tham số
  example: Sau 200 bước SGD(lr=0.1) trên CPU với torch.manual_seed(42), trọng số w hội tụ sát 3.00 và độ chệch b sát 2.00 trong < 0.5 giây
  fix:
  - Quên optimizer.zero_grad() làm đạo hàm tích lũy qua các vòng khiến trọng số nổ nhanh chóng
- id: L11
  title: 'Bài 11 — Mạng nơ-ron đa tầng MLP trên PyTorch CPU cho bài toán phi tuyến'
  spec: lessons/mlp/L11_mang_mlp_pytorch_cpu.yaml
  requires: [L10]
  objectives:
  - Ghép hai tầng Linear xen giữa hàm kích hoạt phi tuyến ReLU tạo ranh giới cong
  - Dùng CrossEntropyLoss trên đầu ra logit thô và chế độ model.eval() + torch.no_grad()
  - Phân tích lỗi đặt nhầm Softmax hai lần trước CrossEntropyLoss làm suy giảm gradient
  example: Mạng 2→16→2 với ReLU tách dữ liệu XOR/vòng tròn đạt >= 95% trên CPU với torch.manual_seed(42) trong ~1 giây
  fix:
  - CrossEntropyLoss trong PyTorch đã tự tính LogSoftmax nội bộ nên lớp cuối trả logit thô
- id: L12
  title: 'Bài 12 — Đóng gói trọng số an toàn JSON, bất biến suy luận & đo độ trễ CPU'
  spec: lessons/mlp/L12_dong_goi_suy_luan_cpu.yaml
  requires: [L11]
  objectives:
  - Giải thích rủi ro bảo mật thực thi mã lạ của tệp pickle không tin cậy khi triển khai
  - Xuất tham số scaler (mean, scale) và trọng số (coef, intercept) ra JSON thuần tất định
  - Đối chiếu đầu ra suy luận Python thuần khớp tuyệt đối với scikit-learn trong sai số 1e-9
  example: Vector dự đoán từ hàm toán học đọc tệp JSON trọng số trùng khớp với predict_proba của mô hình gốc với độ lệch tối đa < 1e-12
  fix:
  - Không bao giờ nạp tệp pickle từ nguồn bên ngoài không xác thực vào dịch vụ sản xuất
- id: L13
  title: 'Bài 13 — Tình huống chuyên gia: Hệ thống phát hiện gian lận từ đầu tới triển khai'
  spec: lessons/mlp/L13_tinh_huong_phat_hien_gian_lan.yaml
  requires: [L12]
  objectives:
  - Tổ chức đường ống đánh giá gian lận 4% bảo toàn thứ tự thời gian không rò rỉ
  - So sánh điểm PR-AUC và Brier score giữa LogisticRegression và HistGradientBoostingClassifier
  - Kiểm thử đường nền đối chứng và tính tất định trên CPU sẵn sàng triển khai
  example: Trên tập 1 000 giao dịch theo thời gian lệch 4% gian lận, HistGradientBoosting + chặn rò rỉ đạt PR-AUC cao và chạy suy luận trong vài phần nghìn giây
  fix:
  - Chia dữ liệu theo thời gian và bọc toàn bộ bước biến đổi vào Pipeline trước khi chốt bất kỳ con số báo cáo nào
