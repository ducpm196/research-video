# Giáo án KẾ HOẠCH — IRS · Truy hồi thông tin và hệ gợi ý
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã IRS:Lxx (độ đo xếp hạng tính tay, TF-IDF và cosin numpy,
#   hợp nhất thứ hạng, bước SGD của phân rã ma trận, trọng số xu hướng hiển thị, ngân sách độ trễ hai tầng).
# Căn cứ phạm vi (CITED): C. Manning, P. Raghavan, H. Schütze, Introduction to Information Retrieval (2008); K. Järvelin, J. Kekäläinen, nDCG (TOIS 2002);
#   G. Cormack và cộng sự, hợp nhất thứ hạng nghịch đảo (SIGIR 2009, k = 60); C. Burges và cộng sự, RankNet (ICML 2005);
#   Y. Koren, R. Bell, C. Volinsky, phân rã ma trận cho gợi ý (IEEE Computer 2009); T. Joachims và cộng sự, học xếp hạng không thiên lệch (WSDM 2017);
#   J. Carbonell, J. Goldstein, MMR (SIGIR 1998); P. Covington và cộng sự, gợi ý hai tầng (RecSys 2016); Y. Malkov, D. Yashunin, HNSW (2018).
# Vì sao cần: DEN L07 dạy chỉ mục ngược và BM25; LLM L03, L12 dạy vector nhúng và RAG. Chưa có khoá dạy đo chất lượng xếp hạng, truy hồi dày,
#   học xếp hạng và hệ gợi ý với thiên lệch của dữ liệu tương tác — phần lõi của tìm kiếm, thương mại điện tử, mạng xã hội.
# Thứ tự học: sau DEN L07, LLM L03, CS115 L16, L20.
course: IRS
status: planned
lessons:
  - id: L00
    title: "Đo chất lượng truy hồi: độ chuẩn xác, độ phủ và hạng nghịch đảo trung bình"
    spec: lessons/irs/L00_do_chat_luong.yaml
    requires: []
    requires_ext: ["CS115:L21"]
    # Thuật ngữ theo CS115 bài 21 (2026-11-03): precision = “độ chuẩn xác”, recall = “độ phủ”, accuracy = “tỉ lệ đúng” — bản kế hoạch cũ ghi
    #   “độ chính xác” cho precision, dễ lẫn với accuracy; đã đổi để cả hai khoá một cách gọi.
    objectives: ["Tính độ chuẩn xác và độ phủ ở k kết quả đầu", "Tính hạng nghịch đảo của kết quả đúng đầu tiên và trung bình của nó trên nhiều câu hỏi", "Chọn độ đo hợp với cách người dùng đọc kết quả (chỉ xem vài dòng đầu hay đọc hết)"]
    example: "Kho có 5 văn bản đúng; hệ A trả 10 kết quả, đúng ở vị trí 1, 3, 6: P@5 = 2/5 = 0,4, R@5 = 2/5 = 0,4, R@10 = 3/5 = 0,6, hạng nghịch đảo = 1; hệ B đúng ở 4, 5, 6 có cùng P@5 = 0,4 nhưng P@3 = 0 và hạng nghịch đảo 1/4; ba câu hỏi có hạng nghịch đảo 1, 1/3, 0 → MRR = 4/9 ≈ 0,444 (VER IRS:L00)"
    fix: ["Độ phủ cần biết mọi văn bản đúng của kho (T) — trên kho lớn (TREC-7: 50 câu hỏi × 528 000 văn bản = 26,4 triệu cặp) T chỉ ước lượng được, bằng cách gom văn bản đúng từ nhiều nguồn khác nhau, không chỉ từ hệ đang đo (lấy T từ chính hệ A cho độ phủ giả 3/3 = 1 thay vì 0,6)",
          "Không bỏ câu hỏi không có kết quả đúng khỏi trung bình: (1 + 1/3)/2 ≈ 0,667 thay vì 4/9 ≈ 0,444; chọn k theo số dòng người dùng thật nhìn thấy (trang 3 dòng: hệ B có P@3 = 0 dù P@10 = 0,3) (VER IRS:L00)"]
  - id: L01
    title: "Độ lợi tích lũy có chiết khấu và chuẩn hoá (nDCG)"
    spec: lessons/irs/L01_ndcg.yaml
    requires: [L00]
    requires_ext: ["CS115:L12"]
    objectives: ["Tính độ lợi có chiết khấu với chiết khấu 1/log₂(vị trí + 1)", "Chuẩn hoá bằng thứ tự lý tưởng lấy từ mọi văn bản đã chấm, không làm tròn giữa chừng", "Nhận ra hai báo cáo nDCG chỉ so được khi cùng công thức độ lợi và chiết khấu"]
    example: "mức liên quan theo thứ tự hiện 3, 2, 0, 1: DCG@4 ≈ 4,69254; thứ tự lý tưởng 3, 2, 1, 0: IDCG@4 ≈ 4,76186 → nDCG@4 ≈ 0,98544 ≈ 0,985 (chia hai số đã làm tròn 4,693/4,762 ra 0,986, sai chữ số cuối) (VER IRS:L01)"
    fix: ["Thứ tự lý tưởng phải lấy từ mọi văn bản đã chấm của câu hỏi, không từ danh sách của chính hệ: thêm một văn bản mức 3 mà hệ X không trả về thì IDCG@4 ≈ 6,323 và nDCG@4 của X còn 0,742 chứ không phải 0,985",
          "Chiết khấu 1/log₂(vị trí + 1) là dạng dùng về sau (Burges và cộng sự 2005 dùng log(1 + j), độ lợi 2^r − 1); bài báo Järvelin–Kekäläinen 2002 chia cho log_b(vị trí) từ vị trí b trở đi, không chiết khấu trước đó — cùng danh sách 3, 2, 0, 1 cho nDCG@4 0,985; 0,977; 0,993 tuỳ công thức, chỉ so khi cùng công thức (VER IRS:L01)"]
  - id: L02
    title: "Mô hình không gian vector: TF-IDF và độ tương tự cosin"
    spec: lessons/irs/L02_tf_idf.yaml
    requires: [L00]
    requires_ext: ["DEN:L07", "LLM:L03"]
    objectives: ["Tính trọng số tần suất nhân độ hiếm của một từ trong một văn bản", "Biểu diễn văn bản và câu hỏi thành vector rồi xếp hạng bằng cosin", "Giải thích vì sao cosin không đổi khi văn bản dài gấp đôi, và vì sao nó vẫn thua nhồi từ khoá"]
    example: "Kho 3 văn bản d1 “máy ổ máy”, d2 “máy pin”, d3 “máy pin màn”: idf(máy) = ln(3/3) = 0, idf(ổ) = ln 3 ≈ 1,099, idf(pin) = ln 1,5 ≈ 0,405 — từ có mặt ở mọi nơi không giúp phân biệt; câu hỏi “máy pin” → cosin d2 = 1, d3 ≈ 0,346, d1 = 0 (đếm thô không có độ hiếm cho d1 ≈ 0,632) (VER IRS:L02)"
    fix: ["Cosin không đổi khi văn bản được nhân bản (dài gấp đôi chính nó) — nhưng KHÔNG chống nhồi từ khoá: văn bản chỉ gồm từ khoá trùng hướng câu hỏi, cosin = 1; bão hoà tần suất tf/(tf + 1) chỉ làm lợi ích của việc lặp từ tăng chậm dần (lặp 5 lần ≈ 0,833, gấp ≈ 1,67 lần một lần, không bao giờ vượt 1), không chặn hẳn",
          "Độ hiếm ln(N/df) phụ thuộc kho: “từ có ở mọi nơi” (idf = 0) chỉ đúng với kho đó — thêm 7 văn bản không chứa “máy” thì idf(máy) = ln(10/3) ≈ 1,204; từ kho chưa gặp (df = 0) làm ln(N/0) không xác định — bỏ khỏi vector câu hỏi hoặc làm trơn ln((N + 1)/(df + 1)) (VER IRS:L02)"]
  - id: L03
    title: "Truy hồi dày và tìm láng giềng gần đúng"
    spec: lessons/irs/L03_truy_hoi_day.yaml
    requires: [L02]
    requires_ext: ["CS115:L29"]
    objectives: ["Ước lượng số phép so khi chia vector thành cụm và chỉ xét vài cụm gần nhất", "Đọc đánh đổi giữa độ phủ và số phép so (độ trễ) của tìm gần đúng", "Báo cáo tìm gần đúng kèm độ phủ so với tìm chính xác"]
    example: "1 triệu vector chia 1000 cụm, mỗi câu hỏi xét 10 cụm gần nhất: so với 1000 tâm + 10 · 1000 vector = 11 000 phép so thay vì 1 000 000 (ít hơn ≈ 91 lần), đổi lại có thể sót láng giềng nằm sát ranh giới ở cụm không được mở; đo thật trên 5000 điểm: xét 1 cụm độ phủ 0,804, xét 4 cụm đạt 1 (VER IRS:L03)"
    fix: ["Báo cáo tìm gần đúng phải kèm độ phủ so với tìm chính xác — nhanh mà sót kết quả đúng là vô ích",
          "Con số 11 000 giả sử mọi cụm đều nhau; câu hỏi thật hay rơi vào vùng đông nên cụm được mở thường to hơn trung bình (đo thật 159 thay vì 141) — đo số phép so trên câu hỏi thật"]
  - id: L04
    title: "Truy hồi lai và hợp nhất thứ hạng"
    spec: lessons/irs/L04_hop_nhat_thu_hang.yaml
    requires: [L03]
    objectives: ["Ghép danh sách từ khoá và danh sách vector bằng điểm 1 chia (k cộng hạng)", "Giải thích vì sao không cộng thẳng điểm thô của hai hệ", "Đo bản ghép bằng độ đo xếp hạng thay vì tin rằng ghép luôn tốt hơn"]
    example: "k = 60: A hạng 1 và 3 → 1/61 + 1/63 ≈ 0,03227; B hạng 2 và 1 → 1/62 + 1/61 ≈ 0,03252 → B đứng trên A (VER IRS:L04)"
    fix: ["Điểm từ khoá có bão hoà (không có trần chung) và cosin (không quá 1) khác thang đo — cộng thẳng để hệ từ khoá lấn át hệ vector",
          "Bản ghép không luôn hơn mọi hệ thành phần: trong ví dụ, hệ vector đạt nDCG@4 = 1, bản ghép 0,988 — đo trên tập câu hỏi đã chấm trước khi đổi"]
  - id: L05
    title: "Học để xếp hạng: theo điểm, theo cặp, theo danh sách"
    spec: lessons/irs/L05_hoc_xep_hang.yaml
    requires: [L01]
    requires_ext: ["CS115:L20"]
    objectives: ["Tính mất mát theo cặp ln(1 + e mũ âm của hiệu điểm) cho một cặp văn bản", "Giải thích vì sao tối ưu thứ tự khác tối ưu điểm tuyệt đối", "Tính cái giá của một cặp xếp sai ở đầu danh sách so với ở cuối bằng độ lợi tích lũy có chiết khấu"]
    example: "a liên quan hơn b, điểm 2 và 1,5 → mất mát ln(1 + e^−0,5) ≈ 0,474; đảo thành 1,5 và 2 → ≈ 0,974; đổi chỗ vị trí 1 và 2 của thứ tự 3, 2, 1, 0 mất ≈ 0,369 độ lợi có chiết khấu, vị trí 3 và 4 chỉ mất ≈ 0,069 (VER IRS:L05)"
    fix: ["Sai ở đầu danh sách đắt hơn sai ở cuối — mất mát theo cặp thuần coi mọi cặp như nhau",
          "Chọn mô hình theo sai số bình phương của điểm có thể chọn nhầm mô hình xếp sai thứ tự (M1: 0,36 nhưng xếp sai; M2: 25 nhưng xếp đúng) — đo thêm một độ đo thứ tự"]
  - id: L06
    title: "Lọc cộng tác theo láng giềng"
    spec: lessons/irs/L06_loc_cong_tac.yaml
    requires: [L02]
    objectives: ["Tính độ tương tự cosin giữa hai người dùng", "Dự đoán điểm bằng trung bình có trọng số của láng giềng", "Nhận ra khi số 0 (chưa chấm), số món chung quá ít hay thang chấm khác nhau làm sai độ tương tự"]
    example: "người dùng U = (5, 3, 0), V = (4, 0, 4) trên 3 sản phẩm: cosin = 20 / (√34 · √32) ≈ 0,606; cùng W = (1, 2, 5) (cosin ≈ 0,344), dự đoán điểm U chấm ốp lưng = (0,606 · 4 + 0,344 · 5) / 0,950 ≈ 4,36 (VER IRS:L06)"
    fix: ["Số 0 nghĩa là “chưa chấm”, không phải “ghét” — coi 0 là điểm thật làm sai trung bình (2,67 thay vì 4)",
          "Láng giềng chỉ có một món chấm chung luôn có cosin 1 trên món đó — đòi tối thiểu vài món chung trước khi tin độ giống"]
  - id: L07
    title: "Phân rã ma trận cho gợi ý"
    spec: lessons/irs/L07_phan_ra_ma_tran.yaml
    requires: [L06]
    requires_ext: ["CS115:L09", "CS115:L16"]
    objectives: ["Dự đoán điểm bằng tích vô hướng vector người dùng và sản phẩm", "Thực hiện một bước cập nhật theo một lượt chấm, có và không có chính quy hoá", "Chọn mức phạt lam-đa khi người dùng có ít lượt chấm"]
    example: "p = (1, 2), q = (0,5; 1) → dự đoán 2,5; điểm thật 3 → sai số 0,5; η = 0,1 → p mới = p + η · sai số · q = (1,025; 2,05), q mới (0,55; 1,1), đoán lại ≈ 2,819; thêm λ = 0,1 → p mới (1,015; 2,03) (VER IRS:L07)"
    fix: ["Không chính quy hoá (λ = 0) thì người mới chỉ chấm một phim bị khớp quá mức: p = (5, 5), đoán phim B 10 sao trên thang 5; λ = 0,5 kéo về 5 — chọn λ bằng sai số trên lượt chấm giữ riêng, không bằng dữ liệu đã học"]
  - id: L08
    title: "Phản hồi ngầm, lấy mẫu âm và thiên lệch phổ biến"
    spec: lessons/irs/L08_phan_hoi_ngam.yaml
    requires: [L07]
    objectives: ["Phân biệt “không bấm” với “không thích” và nêu hệ quả cho dữ liệu huấn luyện", "Lấy mẫu âm theo tần suất mũ 0,75 và tính phần của sản phẩm hiếm", "Tính hiệu chỉnh trừ lôgarit tần suất cho sản phẩm hay lọt vào lô"]
    example: "video A xuất hiện 100 lần, B 1 lần: theo tần suất B chỉ được 1/101 ≈ 0,010 số mẫu âm; theo tần suất mũ 0,75 → 100^0,75 ≈ 31,62, B được 1/(31,62 + 1) ≈ 0,031, gấp khoảng 3 lần; bù lọt lô p = 0,02 → cộng −ln 0,02 ≈ 3,912 (VER IRS:L08)"
    fix: ["Không bấm có thể vì chưa thấy — dữ liệu ngầm chỉ là nhãn dương có nhiễu, không có nhãn âm thật; lấy mẫu âm đều trên cả kho gây thiên lệch phổ biến (món phổ biến chiếm 0,901 phần dương nhưng chỉ nhận 0,333 phần âm; mũ 0,75 cho 0,827)"]
  - id: L09
    title: "Khởi động lạnh và khám phá trong gợi ý"
    spec: lessons/irs/L09_khoi_dong_lanh.yaml
    requires: [L08]
    requires_ext: ["RLN:L03"]
    objectives: ["Biểu diễn độ chắc chắn về tỉ lệ bấm bằng phân phối Beta và cập nhật nó sau mỗi lần hiển thị", "Tính xác suất lấy mẫu theo niềm tin cho sản phẩm mới một cơ hội", "Giải thích vì sao chỉ xếp theo trung bình có thể khoá chết sản phẩm mới, và chọn cách khám phá có kiểm soát"]
    example: "sản phẩm mới Beta(1, 1): trung bình 0,5, rất bất định (độ lệch chuẩn ≈ 0,289); sản phẩm cũ 50 bấm / 1000 hiển thị → Beta(51, 951): trung bình ≈ 0,0509, rất chắc (≈ 0,0069); lấy mẫu theo niềm tin cho sản phẩm mới được hiện với xác suất ≈ 0,949 (VER IRS:L09)"
    fix: ["Chỉ xếp theo trung bình thì sản phẩm mới CÓ THỂ bị khoá chết: vài lần đầu không ai bấm đã kéo trung bình xuống dưới sản phẩm cũ, từ đó nó không được hiển thị nữa để biết nó tốt (không phải lúc nào cũng vậy — mô phỏng trong bài: khoảng 1 trong 4–5 lần chạy)"]
  - id: L10
    title: "Thiên lệch vị trí: đánh giá ngoại tuyến bằng trọng số nghịch đảo xu hướng"
    spec: lessons/irs/L10_thien_lech_vi_tri.yaml
    requires: [L00, L08]
    requires_ext: ["DSC:L07"]
    objectives: ["Điều chỉnh lượt bấm theo xác suất được nhìn thấy để so mức liên quan giữa các vị trí", "Ước lượng xác suất nhìn thấy bằng hoán đổi ngẫu nhiên, và cắt trọng số khi xác suất quá nhỏ", "Giải thích vì sao thử nghiệm hai nhóm trực tuyến vẫn là thước đo cuối"]
    example: "quy ước vị trí 1 được nhìn với xác suất 1, vị trí 5 chỉ 0,2 (minh hoạ): 10 lượt bấm ở vị trí 5 tương đương 10 / 0,2 = 50 lượt bấm sau điều chỉnh; A ở vị trí 1 có tỉ lệ bấm 0,03, B ở vị trí 5 có 0,01 → mức liên quan A 0,03, B 0,01 / 0,2 = 0,05: B liên quan hơn (VER IRS:L10)"
    fix: ["Xác suất nhìn thấy rất nhỏ cho trọng số rất lớn — phải cắt trọng số, đổi lại có thiên lệch",
          "Không lấy xác suất nhìn thấy bằng tỉ lệ bấm trong nhật ký giữa hai vị trí (0,01 / 0,03 ≈ 0,333 thay vì 0,2) — hệ cũ đã đặt sản phẩm tốt lên đầu; phải đo bằng hoán đổi ngẫu nhiên"]
  - id: L11
    title: "Đa dạng, công bằng và vòng phản hồi của hệ gợi ý"
    spec: lessons/irs/L11_da_dang.yaml
    requires: [L06]
    requires_ext: ["MLO:L09"]
    objectives: ["Chọn kết quả bằng cách cân liên quan với khác biệt so với kết quả đã chọn", "Đo mức được nhìn thấy của một nhóm theo vị trí, không chỉ theo số lượng", "Nhận ra vòng phản hồi làm sản phẩm đang dẫn càng dẫn, và sửa bằng dữ liệu khám phá"]
    example: "λ = 0,7: ứng viên X liên quan 0,9, giống kết quả đã chọn 0,8 → 0,63 − 0,24 = 0,39; Y liên quan 0,7, giống 0,1 → 0,49 − 0,03 = 0,46 → chọn Y; hai sản phẩm người bán nhỏ ở vị trí 3 và 4: (0,5 + 0,431) / 2,562 ≈ 36,3% mức được nhìn thấy dù chiếm 50% số ô (VER IRS:L11)"
    fix: ["Huấn luyện lại trên lượt bấm do chính hệ tạo ra củng cố lựa chọn cũ — cần dữ liệu khám phá",
          "Đo công bằng bằng số ô thì sai — ô cuối ít người nhìn hơn; cộng chiết khấu theo vị trí"]
  - id: L12
    title: "Tình huống chuyên gia: thiết kế hệ gợi ý hai tầng trong ngân sách 100 ms"
    spec: lessons/irs/L12_tinh_huong_hai_tang.yaml
    requires: [L03, L05, L10]
    requires_ext: ["SAR:L02"]
    objectives: ["Lập ngân sách độ trễ cho sinh ứng viên, xếp hạng, xếp lại và mạng", "Chọn số ứng viên theo chi phí xếp hạng mỗi ứng viên và phần ngân sách còn lại", "Kiểm ngân sách bằng phân vị 99 của từng tầng, và nhận ra cái giá của việc chia nhiều mảnh song song", "Ra quyết định giữa mô hình nặng hơn, ít ứng viên hơn và thêm một tầng sơ bộ, kèm điều kiện đổi lựa chọn"]
    example: "sinh 1000 ứng viên 10 ms, xếp hạng 0,05 ms mỗi ứng viên = 50 ms, mạng và đọc đặc trưng 20 ms → 80 ms < 100 ms; kho 10 triệu, chấm thẳng mới 10 000 sản phẩm đã 500 ms, vỡ ngân sách; phân vị 99 cộng lại 15 + 70 + 30 = 115 ms → giảm còn 600 ứng viên: 15 + 42 + 30 = 87 ms (VER IRS:L12)"
    fix: ["Chuyên gia đo phân vị 99 của từng tầng, không chỉ trung bình — tầng chậm nhất ở phân vị cao quyết định trải nghiệm",
          "Chia nhiều mảnh song song làm đuôi chậm dày hơn: 10 mảnh, mỗi mảnh chậm 1% → 1 − 0,99^10 ≈ 9,6% yêu cầu bị chậm"]
  - id: L13
    title: "Hành trình: gợi ý video từ đồ thị cùng xem tới hệ thống hai tầng"
    spec: lessons/irs/L13_hanh_trinh_goi_y_video.yaml
    requires: [L08, L09, L10, L12]
    requires_ext: ["DSC:L08"]
    # Nguồn (đọc nguyên văn 2026-11-03, câu trích ở audit/irs/sources_L13.md): S. Baluja và cộng sự, Video Suggestion and Discovery for
    #   YouTube: Taking Random Walks Through the View Graph (WWW 2008) [BA08]; P. Covington, J. Adams, E. Sargin, Deep Neural Networks for
    #   YouTube Recommendations (RecSys 2016) [CO16]; Z. Zhao và cộng sự, Recommending What Video to Watch Next: A Multitask Ranking System
    #   (RecSys 2019) [ZH19]; M. Chen và cộng sự, Top-K Off-Policy Correction for a REINFORCE Recommender System (WSDM 2019, arXiv 1812.02353)
    #   [CH19]; X. Yi và cộng sự, Sampling-Bias-Corrected Neural Modeling for Large Corpus Item Recommendations (RecSys 2019) [YI19].
    #   J. Davidson và cộng sự, The YouTube Video Recommendation System (RecSys 2010): NOT_VERIFIED (ACM chặn, bản lưu trả 429) → không dạy.
    objectives: ["Kể lại năm chặng 2008 → 2016 → 2019 của hệ gợi ý video: đồ thị cùng xem, hai mạng sinh ứng viên và xếp hạng, khử thiên lệch vị trí, khám phá có kiểm soát, thêm nguồn đề cử cập nhật hằng ngày", "Tính lại con số then chốt của từng chặng bằng kiến thức của khoá", "Chọn kiến trúc gợi ý cho quy mô của mình, kèm điều kiện đổi lựa chọn"]
    example: "2008: ước tính hơn 45 triệu video, 7 giờ video tải lên mỗi phút = 10 080 giờ mỗi ngày; chỉ giữ người có lượt xem ở cả hai giai đoạn còn 1,1 triệu người với 12,5 triệu lượt xem ≈ 11,4 lượt mỗi người; gợi ý video phổ biến nhất đúng 8,4% (CITED BA08); 2016: hàng triệu → hàng trăm → hàng chục video, 1 triệu video × 256 số × 4 byte = 1 024 000 000 byte; bỏ trọng số thời gian xem làm mất mát tăng 4,1%, gấp khoảng 20 lần mức 0,2% khi bớt đặc trưng phụ (CITED CO16); 2019: tầng xếp hạng nhận vài trăm ứng viên, tháp nông khử thiên lệch vị trí +0,24% so với −0,07% khi chỉ thêm vị trí làm đặc trưng (CITED ZH19); khám phá trên 5% người dùng +0,07%, trọng số cắt ở 3, nới lên 5 thì −0,52% (CITED CH19); chỉ mục khoảng 10 triệu video làm lại mỗi vài giờ, mục cứ 50 bước gặp một lần → p = 0,02, điểm cộng thêm −ln 0,02 ≈ 3,912 (CITED YI19) (VER IRS:L13)"
    fix: ["Chỉ dạy điều năm nguồn ghi: không kể “hệ gợi ý tạo 70% thời gian xem” hay các con số báo chí khác (không có trong năm bài báo)", "Năm 2016 không thay hết hệ cũ: bài báo ghi tầng sinh ứng viên trộn thêm ứng viên từ nguồn khác, và năm 2019 vẫn có nhiều nguồn đề cử song song"]
