# Giáo án KẾ HOẠCH — PLC · Ngôn ngữ lập trình và trình biên dịch
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã PLC:Lxx (bộ phân tích, máy ảo ngăn xếp, trình thông dịch phạm vi chạy thật).
# Căn cứ phạm vi: CS2023 — Foundations of Programming Languages (FPL, 21 giờ CS Core; “1.3 Introduction to Knowledge Model”).
# Vì sao cần: FPL có số giờ lõi lớn thứ ba của CS2023 nhưng trước đợt này chỉ được phủ phần cú pháp (TOC L06–L08). Hiểu phạm vi, kiểu,
#   bao đóng, quản lý bộ nhớ, cách trình biên dịch dịch mã giúp đọc lỗi, chọn ngôn ngữ, và viết mã đúng ở mọi khoá khác.
# Thứ tự học: sau TOC L01–L03, L06–L08; CSA L07; CS112 L04 (ngăn xếp).
course: PLC
status: planned
lessons:
  - id: L00
    title: "Từ mã nguồn tới chạy được: các pha của trình biên dịch và trình thông dịch"
    spec: lessons/plc/L00_cac_pha_bien_dich.yaml
    requires: []
    requires_ext: ["CSA:L07"]
    objectives: ["Kể đúng thứ tự các pha: từ vựng, cú pháp, ngữ nghĩa, tối ưu, sinh mã", "Biết mỗi loại lỗi bị bắt ở pha nào", "Phân biệt biên dịch và thông dịch là cách cài đặt, không phải tính chất ngôn ngữ"]
    example: "lỗi gõ thiếu dấu ngoặc bị bắt ở pha cú pháp; dùng biến chưa khai báo bị bắt ở pha ngữ nghĩa"
    fix: ["Một ngôn ngữ không “là biên dịch” hay “là thông dịch” — đó là tính chất của cách cài đặt"]
  - id: L01
    title: "Phân tích từ vựng bằng biểu thức chính quy và ôtômat"
    spec: lessons/plc/L01_phan_tich_tu_vung.yaml
    requires: [L00]
    requires_ext: ["TOC:L03"]
    objectives: ["Mô tả từ tố bằng biểu thức chính quy", "Áp dụng luật khớp dài nhất và luật ưu tiên", "Hiểu bộ phân tích từ vựng là một ôtômat"]
    example: "“x1 = 42+y” → 5 từ tố: x1, =, 42, +, y (VER PLC:L01)"
    fix: ["Khớp dài nhất: “x1” là một tên, không phải “x” rồi số “1”"]
  - id: L02
    title: "Phân tích cú pháp đệ quy xuống và độ ưu tiên toán tử"
    spec: lessons/plc/L02_dequy_xuong.yaml
    requires: [L01]
    requires_ext: ["TOC:L07"]
    objectives: ["Viết văn phạm biểu thức có tầng ưu tiên", "Biến mỗi luật văn phạm thành một hàm đệ quy", "Tránh đệ quy trái"]
    example: "tầng nhân nằm dưới tầng cộng: 1+2*3 → cây (+ 1 (* 2 3)) = 7; (1+2)*3 = 9 (VER PLC:L02)"
    fix: ["Văn phạm đệ quy trái làm phân tích đệ quy xuống lặp vô hạn — phải viết lại thành vòng lặp"]
  - id: L03
    title: "Cây cú pháp trừu tượng, tính kết hợp và đánh giá"
    spec: lessons/plc/L03_cay_cu_phap.yaml
    requires: [L02]
    objectives: ["Phân biệt cây cú pháp đầy đủ và cây cú pháp trừu tượng", "Hiểu tính kết hợp trái, phải và cách văn phạm quyết định nó", "Đánh giá cây bằng đệ quy duyệt sau"]
    example: "kết hợp trái: 8-3-2 = (8-3)-2 = 3; kết hợp phải sẽ ra 7 (VER PLC:L03)"
    fix: ["Phép trừ và chia không kết hợp — thứ tự nhóm làm đổi kết quả"]
  - id: L04
    title: "Phạm vi và liên kết tên: tĩnh và động"
    spec: lessons/plc/L04_pham_vi.yaml
    requires: [L03]
    objectives: ["Hiểu môi trường và chuỗi tra tên", "Phân biệt phạm vi tĩnh và phạm vi động", "Biết phạm vi tĩnh chọn biến, không chụp giá trị"]
    example: "x = 1 toàn cục; g đặt x = 2 cục bộ rồi gọi f trả x: phạm vi tĩnh → 1, động → 2 (trình thông dịch tí hon, VER PLC:L04)"
    fix: ["Hầu hết ngôn ngữ hiện đại dùng phạm vi tĩnh — đọc mã là biết tên trỏ tới đâu"]
  - id: L05
    title: "Kiểu dữ liệu và kiểm tra kiểu: tĩnh, động, mạnh, yếu"
    spec: lessons/plc/L05_kieu_du_lieu.yaml
    requires: [L04]
    requires_ext: ["CSA:L03"]
    objectives: ["Phân biệt kiểm kiểu tĩnh và động", "Phân biệt kiểu mạnh và yếu", "Biết đây là hai trục khác nhau"]
    example: "cộng số nguyên với chuỗi: ngôn ngữ kiểm tĩnh báo lỗi trước khi chạy; ngôn ngữ kiểm động báo lỗi khi chạy tới dòng đó"
    fix: ["“Kiểu tĩnh” và “kiểu mạnh” là hai trục khác nhau"]
  - id: L06
    title: "Suy luận kiểu và hợp nhất"
    spec: lessons/plc/L06_suy_luan_kieu.yaml
    requires: [L05]
    objectives: ["Sinh ràng buộc kiểu từ mã", "Giải ràng buộc bằng hợp nhất", "Biết suy luận kiểu vẫn là kiểm kiểu tĩnh"]
    example: "hàm nhân đôi f(x) = x + x với phép cộng số nguyên → suy ra f nhận số nguyên, trả số nguyên"
    fix: ["Suy luận kiểu không phải kiểu động — kiểu vẫn được kiểm lúc biên dịch"]
  - id: L07
    title: "Hàm bậc cao và bao đóng"
    spec: lessons/plc/L07_bao_dong.yaml
    requires: [L04]
    objectives: ["Dùng hàm như giá trị: truyền vào, trả ra", "Hiểu bao đóng là hàm cộng môi trường", "Tránh lỗi bao đóng trong vòng lặp"]
    example: "mỗi lần gọi make_counter() tạo biến đếm riêng: c1 cho 1, 2, 3; c2 bắt đầu lại từ 1 (VER PLC:L07)"
    fix: ["Bao đóng tạo trong vòng lặp có thể cùng giữ một biến — kết quả bằng giá trị cuối cùng của vòng lặp"]
  - id: L08
    title: "Quản lý bộ nhớ: ngăn xếp, đống, đếm tham chiếu, thu gom rác"
    spec: lessons/plc/L08_bo_nho.yaml
    requires: [L07]
    requires_ext: ["CS112:L04", "CS112:L07"]
    objectives: ["Phân biệt dữ liệu trên ngăn xếp và trên đống", "Hiểu đếm tham chiếu và đánh dấu–quét", "Biết vì sao có thu gom rác vẫn rò bộ nhớ"]
    example: "đánh dấu–quét từ gốc A giữ A, B, C và thu hồi D, E; đếm tham chiếu không thu hồi được vòng D ↔ E (VER PLC:L08)"
    fix: ["Có thu gom rác vẫn rò bộ nhớ nếu còn giữ tham chiếu không dùng tới"]
  - id: L09
    title: "Truyền tham số: theo giá trị, theo tham chiếu, chia sẻ đối tượng"
    spec: lessons/plc/L09_truyen_tham_so.yaml
    requires: [L08]
    objectives: ["Phân biệt ba cách truyền tham số", "Phân biệt gán lại tham số và sửa đối tượng", "Tránh giá trị mặc định là đối tượng biến đổi được"]
    example: "tham số mặc định danh sách được tạo một lần: bad(1) rồi bad(2) cho [1, 2] (VER PLC:L09)"
    fix: ["Gán lại tham số trong hàm khác với sửa đối tượng mà tham số trỏ tới"]
  - id: L10
    title: "Sinh mã cho máy ngăn xếp"
    spec: lessons/plc/L10_sinh_ma_ngan_xep.yaml
    requires: [L03]
    requires_ext: ["CS112:L04"]
    objectives: ["Sinh mã máy ngăn xếp từ cây bằng duyệt sau", "Chạy tay máy ngăn xếp", "Giữ đúng thứ tự toán hạng cho trừ và chia"]
    example: "1+2*3 → push 1, push 2, push 3, mul, add; máy ảo chạy ra 7 (VER PLC:L10)"
    fix: ["Thứ tự toán hạng của phép trừ, phép chia trên ngăn xếp: lấy ra b trước, a sau, rồi tính a − b"]
  - id: L11
    title: "Tối ưu mã: gấp hằng số, loại mã chết, đưa ra ngoài vòng lặp"
    spec: lessons/plc/L11_toi_uu.yaml
    requires: [L10]
    objectives: ["Gấp hằng số và nhận ra giới hạn của nó", "Loại mã chết và đưa phép tính bất biến ra ngoài vòng lặp", "Biết tối ưu phải giữ nguyên hành vi quan sát được"]
    example: "2*3 + x → 6 + x lúc biên dịch; phần có biến x giữ nguyên (VER PLC:L11)"
    fix: ["Hành vi không xác định (như tràn số có dấu trong C) cho phép trình biên dịch tối ưu theo cách bất ngờ"]
  - id: L12
    title: "Lập trình hàm, bất biến và đồng thời an toàn"
    spec: lessons/plc/L12_lap_trinh_ham.yaml
    requires: [L07]
    requires_ext: ["OSY:L04"]
    objectives: ["Viết hàm thuần và dùng map, filter, reduce", "Cập nhật dữ liệu bất biến bằng cách tạo mới và dùng chung phần cũ", "Hiểu vì sao dữ liệu bất biến an toàn khi chạy đồng thời"]
    example: "hai luồng cùng đọc một danh sách bất biến không cần khoá; muốn “sửa” thì tạo danh sách mới"
    fix: ["Bất biến ở bề mặt chưa đủ nếu bên trong vẫn chứa đối tượng biến đổi được"]
  - id: L13
    title: "Tình huống chuyên gia theo dòng thời gian: chuyển sang ngôn ngữ an toàn bộ nhớ"
    spec: lessons/plc/L13_hanh_trinh_an_toan_bo_nho.yaml
    requires: [L05, L08, L11, L12]
    see_also: ["SEC:L11"]
    kind: journey
    objectives: ["Kể lại hành trình chuyển sang ngôn ngữ an toàn bộ nhớ qua năm chặng (2019 → 2025), mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại tỉ lệ, mật độ lỗ hổng và mức giảm theo tuổi mã từ số liệu đã công bố", "Chọn cách giảm lỗi bộ nhớ hợp với quy mô của mình, kèm điều kiện đổi lựa chọn"]
    example: "Android: lỗ hổng an toàn bộ nhớ 223 (2019) → 85 (2022), giảm ≈ 61,9%; 85 / 0,35 ≈ 243 ≈ 20 · 12 lỗ hổng mỗi năm; tuổi thọ trung bình 2,5 năm → mã 5 năm tuổi ít lỗi hơn e² ≈ 7,39 lần (AN24: 7,4x); 5 triệu dòng Rust, 1 lỗ hổng → 0,2 mỗi triệu dòng, so với ≈ 1000 của C/C++ → 5000 lần (VER PLC:L13)"
    fix: ["Chỉ khẳng định điều có trong MS19, MS19b, BH19, CR19, AQ19, AR21, AN22, AN24, AN25 (audit/plc/sources_L13.md); nguồn tự ghi tương quan chưa chắc là nhân quả — không nói “vì thế mà giảm”", "1,5 triệu dòng × 1 lỗ hổng mỗi nghìn dòng = 1500 chỉ là cận trên theo mật độ lịch sử (nguồn nói “hàng trăm”); số tuyệt đối năm 2025 không có trong nguồn — không dạy", "An ninh chỉ ở mức khái niệm phòng thủ: không mã khai thác, không chi tiết lỗi CrabbyAVIF ngoài “tràn bộ đệm, trang canh chặn được”"]
