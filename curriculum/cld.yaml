# Giáo án KẾ HOẠCH — CLD · Hệ thống hướng dịch vụ: microservice, container, Kubernetes
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã CLD:Lxx.
# Căn cứ (CITED, đọc 2026-10-28): tài liệu Kubernetes — Horizontal Pod Autoscaler: desiredReplicas = ⌈currentReplicas × currentMetricValue /
#   desiredMetricValue⌉, dung sai mặc định 0,1 (kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/);
#   Deployment: maxUnavailable làm tròn xuống, maxSurge làm tròn lên, mặc định 25% (…/workloads/controllers/deployment/).
#   CS2023: SF, NC, PDC, SEC. Khoá dạy NGUYÊN LÝ, không dạy cú pháp công cụ — tên trường cấu hình có thể đổi theo phiên bản.
# Vì sao cần: phần mềm hiện đại triển khai thành nhiều dịch vụ trên cụm máy; cần hiểu cô lập tiến trình (OSY), mạng (NET),
#   hệ phân tán (DSY) và lý thuyết hàng đợi để thiết kế, vận hành, ước lượng dung lượng mà không đoán mò.
# Thứ tự học: sau OSY L00–L01, L14; NET L05, L09, L12; DSY L03–L05. Song song DVO.
course: CLD
status: planned
lessons:
  - id: L00
    title: "Nguyên khối và microservice: khi nào nên tách"
    spec: lessons/cld/L00_nguyen_khoi_vi_dich_vu.yaml
    requires: []
    requires_ext: ["SWF:L00"]
    objectives: ["So sánh nguyên khối và microservice", "Liệt kê chi phí của việc tách dịch vụ"]
    example: "gọi hàm trong cùng tiến trình mất cỡ nano giây; gọi sang dịch vụ khác qua mạng mất cỡ mili giây và có thể hỏng"
    fix: ["Microservice giải bài toán tổ chức (nhóm độc lập triển khai), không tự làm hệ thống nhanh hơn"]
  - id: L01
    title: "Container: tiến trình được cô lập, không phải máy ảo"
    spec: lessons/cld/L01_container.yaml
    requires: [L00]
    requires_ext: ["OSY:L01", "OSY:L14"]
    objectives: ["Giải thích không gian tên và nhóm kiểm soát tài nguyên của nhân", "So sánh container và máy ảo"]
    example: "mọi container trên một máy dùng chung một nhân hệ điều hành; máy ảo mỗi cái có nhân riêng"
    fix: ["Container không phải ranh giới bảo mật mạnh như máy ảo — chạy với quyền root trong container vẫn nguy hiểm"]
  - id: L02
    title: "Ảnh container tái lập: lớp, bộ nhớ đệm khi dựng, ghim phiên bản"
    spec: lessons/cld/L02_anh_tai_lap.yaml
    requires: [L01]
    objectives: ["Sắp các bước dựng để tận dụng bộ nhớ đệm", "Ghim phiên bản ảnh nền và thư viện"]
    example: "chép tệp danh sách thư viện và cài thư viện trước, chép mã nguồn sau — sửa một dòng mã không phải cài lại thư viện"
    fix: ["Thẻ “latest” không phải một phiên bản — hai lần dựng có thể ra hai ảnh khác nhau"]
  - id: L03
    title: "Giao tiếp giữa dịch vụ: đồng bộ, bất đồng bộ, độ sẵn sàng của chuỗi gọi"
    spec: lessons/cld/L03_giao_tiep_san_sang.yaml
    requires: [L00]
    requires_ext: ["NET:L12"]
    objectives: ["So sánh gọi đồng bộ và gửi thông điệp", "Tính độ sẵn sàng của chuỗi phụ thuộc"]
    example: "5 dịch vụ nối tiếp, mỗi dịch vụ 99,9%: cả chuỗi khoảng 99,5%, tức khoảng 216 phút ngừng mỗi tháng (VER CLD:L03)"
    fix: ["Mỗi phụ thuộc đồng bộ nhân thêm xác suất hỏng — chuỗi càng dài càng kém sẵn sàng"]
  - id: L04
    title: "Chịu lỗi: hết giờ, thử lại có lùi, cầu dao ngắt"
    spec: lessons/cld/L04_chiu_loi.yaml
    requires: [L03]
    objectives: ["Đặt hết giờ cho mọi lời gọi", "Thiết kế thử lại có lùi lũy thừa và ngẫu nhiên hoá"]
    example: "3 tầng, mỗi tầng thử tối đa 3 lần → tầng dưới cùng nhận tới 27 yêu cầu; lùi 100, 200, 400 ms, chặn trên 2000 ms (VER CLD:L04)"
    fix: ["Thử lại thao tác không lũy đẳng (trừ tiền) có thể làm hai lần — cần khoá lũy đẳng"]
  - id: L05
    title: "Kubernetes: trạng thái mong muốn và vòng điều khiển"
    spec: lessons/cld/L05_kubernetes_vong_dieu_khien.yaml
    requires: [L02]
    objectives: ["Giải thích mô hình khai báo trạng thái mong muốn", "Mô tả Pod, Deployment, Service"]
    example: "khai báo 3 bản; một Pod chết thì bộ điều khiển thấy thực tế 2 ≠ mong muốn 3 và tạo Pod mới"
    fix: ["Pod có thể bị xoá và tạo lại bất kỳ lúc nào — không lưu dữ liệu quan trọng trong hệ tệp của Pod"]
  - id: L06
    title: "Xếp lịch Pod: yêu cầu, giới hạn tài nguyên và xếp thùng"
    spec: lessons/cld/L06_xep_lich_pod.yaml
    requires: [L05]
    requires_ext: ["CS112:L16"]
    objectives: ["Phân biệt yêu cầu và giới hạn tài nguyên", "Ước lượng số Pod vừa một nút"]
    example: "nút 4 CPU, mỗi Pod yêu cầu 1,5 CPU → xếp 2 Pod, 1 CPU còn lại không dùng được (VER CLD:L06)"
    fix: ["Vượt giới hạn bộ nhớ thì tiến trình bị giết; vượt giới hạn CPU thì bị hãm — hai hậu quả khác nhau"]
  - id: L07
    title: "Tự co giãn theo chỉ số"
    spec: lessons/cld/L07_tu_co_gian.yaml
    requires: [L06]
    objectives: ["Áp dụng công thức của bộ tự co giãn ngang", "Giải thích dung sai và dao động co giãn"]
    example: "4 bản, CPU 90% mục tiêu 60% → 6 bản; 63% lệch dưới dung sai 10% → giữ 4 (VER CLD:L07)"
    fix: ["Co giãn theo CPU vô ích khi nút thắt là cơ sở dữ liệu phía sau"]
  - id: L08
    title: "Cập nhật cuốn chiếu, xanh–lam và canary"
    spec: lessons/cld/L08_cap_nhat_cuon_chieu.yaml
    requires: [L05]
    objectives: ["Tính số Pod tối thiểu sẵn sàng khi cập nhật cuốn chiếu", "So sánh các chiến lược phát hành"]
    example: "10 bản, maxUnavailable = maxSurge = 25%: làm tròn xuống 2, lên 3 → luôn ≥ 8 bản sẵn sàng, tối đa 13 Pod (VER CLD:L08)"
    fix: ["Thay đổi lược đồ cơ sở dữ liệu không tương thích ngược làm hỏng cập nhật cuốn chiếu — bản cũ và mới chạy cùng lúc"]
  - id: L09
    title: "Khám phá dịch vụ và cân bằng tải"
    spec: lessons/cld/L09_can_bang_tai.yaml
    requires: [L05]
    requires_ext: ["NET:L05"]
    objectives: ["Giải thích Service và DNS nội bộ", "So sánh vòng tròn, ít kết nối nhất, chọn tốt hơn trong hai"]
    example: "20 000 yêu cầu vào 100 máy: chọn ngẫu nhiên 1 máy → máy tải cao nhất 243; chọn ít tải hơn trong 2 máy → 202 (mô phỏng, hạt giống 1, VER CLD:L09)"
    fix: ["Kết nối giữ lâu (HTTP/2, gRPC) làm cân bằng tải theo kết nối bị lệch — cần cân bằng theo yêu cầu"]
  - id: L10
    title: "Dung lượng và hàng đợi: định luật Little, M/M/1"
    spec: lessons/cld/L10_hang_doi.yaml
    requires: [L03]
    requires_ext: ["CS115:L14"]
    objectives: ["Dùng định luật Little", "Giải thích vì sao độ trễ bùng nổ khi tải gần công suất"]
    example: "phục vụ 100/s: tải 80/s → 50 ms, tải 95/s → 200 ms (VER CLD:L10)"
    fix: ["Chạy máy ở 95% công suất “cho tiết kiệm” làm độ trễ tăng gấp nhiều lần"]
  - id: L11
    title: "Quan sát được: nhật ký, chỉ số, vết truy vết, phân vị"
    spec: lessons/cld/L11_quan_sat_duoc.yaml
    requires: [L10]
    objectives: ["Phân biệt ba loại tín hiệu", "Giải thích vì sao đo p99 thay vì trung bình"]
    example: "một yêu cầu chạm 100 máy, mỗi máy chậm 1% lần: P(yêu cầu bị chậm) ≈ 0,634 (VER CLD:L11)"
    fix: ["Không lấy trung bình các phân vị của nhiều máy để ra phân vị chung"]
  - id: L12
    title: "Mục tiêu mức dịch vụ và ngân sách lỗi"
    spec: lessons/cld/L12_slo_ngan_sach_loi.yaml
    requires: [L11]
    objectives: ["Viết chỉ số và mục tiêu mức dịch vụ", "Tính ngân sách lỗi"]
    example: "99,9% trong 30 ngày → 43,2 phút; 99,99% → 4,32 phút (VER CLD:L12)"
    fix: ["Mục tiêu 100% là sai — không thể đạt và làm tê liệt mọi thay đổi"]
  - id: L13
    title: "Cấu hình, bí mật và an toàn chuỗi cung ứng"
    spec: lessons/cld/L13_cau_hinh_bi_mat.yaml
    requires: [L02]
    requires_ext: ["SWF:L12"]
    objectives: ["Tách cấu hình khỏi ảnh", "Quản lý bí mật và quyền tối thiểu"]
    example: "mật khẩu đã từng nằm trong một lớp của ảnh vẫn đọc được dù lớp sau xoá tệp đó"
    fix: ["Mã hoá base64 không phải mã hoá bảo mật"]
  - id: L14
    title: "Kiến trúc hướng sự kiện, saga và nhất quán cuối cùng"
    spec: lessons/cld/L14_su_kien_saga.yaml
    requires: [L04]
    requires_ext: ["DSY:L14"]
    objectives: ["Thiết kế saga với bước bù trừ", "Giải thích nhất quán cuối cùng cho người dùng"]
    example: "đặt vé: giữ ghế → trừ tiền → xuất vé; trừ tiền lỗi thì chạy bước bù “nhả ghế”"
    fix: ["Bước bù trừ không phải “quay ngược thời gian” — email đã gửi không thu hồi được"]
  - id: L15
    title: "Tình huống chuyên gia theo dòng thời gian: từ Borg tới Kubernetes"
    spec: lessons/cld/L15_hanh_trinh_borg_kubernetes.yaml
    requires: [L05, L08, L12]
    kind: journey
    objectives: ["Kể lại hành trình quản lý container ở quy mô lớn qua năm chặng, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại con số then chốt của từng chặng", "Chọn thực hành phù hợp với quy mô của mình"]
    example: "tách việc phục vụ và việc theo lô cần thêm 20–30% máy ở ô trung vị ≈ 10 000 máy → 2000–3000 máy (B15 §5.2); bộ điều khiển 99,99% → 4,32 phút/30 ngày (VER CLD:L15)"
    fix: ["Chỉ khẳng định điều có trong B15, Q16, K24 (audit/cld/sources_L15.md); năm Borg ra đời chính xác không có trong nguồn — chỉ nói “giữa thập niên 2000”", "Ví dụ 6 tác vụ, bản sao kề nhau là giả định minh hoạ"]
