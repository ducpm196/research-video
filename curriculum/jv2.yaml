lessons:
- id: L00
  title: 'Dự án nhiều tệp: gói, biên dịch ra thư mục, tệp đóng gói'
  spec: lessons/jv2/L00_du_an_nhieu_tep.yaml
  requires: []
  requires_ext:
  - JVA:L12
  objectives:
  - Mô tả vì sao tên đầy đủ của lớp gồm gói và tên lớp, và cây thư mục nguồn khớp tên gói
  - Dựng dự án ba tệp, biên dịch ra thư mục đích, chạy bằng đường dẫn tìm lớp và đóng gói thành một tệp
  - Phân biệt ba mức truy cập và nhận ra lỗi biên dịch khi vượt quyền
  - Nhận ra tên trùng và đường dẫn tìm lớp dài ra khi dự án lớn dần, và cách rút gọn
  - Viết, biên dịch và chạy dự án hai gói bằng lệnh của chính mình
  example: 'Dự án ba tệp ba gói: phí 5 000 000 là 3 000 + (5 000 000 − 2 000 000)/1 000 = 6 000 (số minh hoạ); số dư còn 4 994 000; hai lớp cùng tên ở hai gói không đụng nhau'
  fix:
  - 'Chạy sai chỗ: java phải kèm -cp và tên đầy đủ gói.lớp; mặc định chỉ trong cùng gói, mở càng ít càng tốt'
- id: L01
  title: 'Nhập dữ liệu: tham số, bàn phím, tệp văn bản'
  spec: lessons/jv2/L01_nhap_du_lieu_tep.yaml
  requires:
  - L00
  objectives:
  - Đọc tham số dòng lệnh và dữ liệu từ bàn phím, đổi chữ thành số
  - Mô tả vì sao tài nguyên phải được đóng và khối có tài nguyên đóng theo thứ tự nào
  - Tính tổng theo loại từ tệp bảng ngăn bằng dấu phẩy bằng cắt dòng và bản đồ cộng dồn
  - Nhận ra khi nào đọc cả tệp vào bộ nhớ gãy và chuyển sang đọc từng dòng
  - Viết chương trình ghi rồi đọc lại tệp bảng và in tổng theo loại
  example: 'Sáu giao dịch ba loại: rút 1 500 000, nạp 3 500 000, chuyển 1 200 000; tệp 1 triệu dòng với bộ nhớ 32 MB: đọc hết thì hết bộ nhớ, đọc từng dòng thì xong (số đo)'
  fix:
  - nextInt rồi nextLine để lại dòng rỗng; split mặc định bỏ ô rỗng cuối, dấu BOM làm tên cột dài thêm
- id: L02
  title: 'Kiểu tổng quát và sắp xếp: hộp, thứ tự tự nhiên, bộ so sánh'
  spec: lessons/jv2/L02_kieu_tong_quat_so_sanh.yaml
  requires:
  - L01
  objectives:
  - Mô tả vì sao kiểu tổng quát đưa lỗi sai kiểu từ lúc chạy về lúc biên dịch
  - Nêu cách khai báo hộp tổng quát dùng cho nhiều kiểu và hàm có ràng buộc so sánh được
  - Sắp xếp danh sách giao dịch theo hai khoá bằng bộ so sánh
  - Phân biệt thứ tự tự nhiên và bộ so sánh để chọn đúng
  - Nhận ra số lần so sánh tăng theo n nhân logarit n và bẫy phép trừ làm tràn
  - Viết bộ so sánh hai khoá cho bảy giao dịch và chạy thử
  example: Sáu giao dịch xếp theo loại rồi tiền giảm dần ra mã 4, 2, 5, 6, 1, 3; xếp 1 triệu số tốn 18 640 873 lần so sánh, xếp lại danh sách đã xếp chỉ 999 999 (số đo, Random(42))
  fix:
  - 'Bộ so sánh viết bằng phép trừ ép int bị tràn: (int)(3 000 000 000 − 1) là −1 294 967 297'
- id: L03
  title: 'Hàm là giá trị: hàm ngắn và đường ống Stream'
  spec: lessons/jv2/L03_ham_la_gia_tri_stream.yaml
  requires:
  - L02
  objectives:
  - Đọc hàm ngắn, giao diện hàm và tham chiếu hàm
  - Mô tả đường ống chạy theo từng phần tử và chỉ chạy khi có bước cuối
  - Viết đường ống lọc, biến đổi và gom nhóm, đối chiếu với vòng lặp
  - Nhận ra khi nào đường ống giữ được bộ nhớ nhỏ và khi nào không
  - Tính thống kê tám giao dịch bằng đường ống và kiểm lại bằng vòng lặp
  example: 'Tám giao dịch: tổng từ 1 triệu trở lên 4 700 000; tổng theo loại {chuyen=1550000, nap=4400000, rut=1500000}; đường ống chạy từng phần tử và chỉ khi có bước cuối'
  fix:
  - toMap ném lỗi khi khoá trùng; đường ống chỉ lười khi nguồn lười, đọc hết tệp vào danh sách rồi mới stream thì vẫn hết bộ nhớ
- id: L04
  title: 'Nhãn và phản chiếu: bộ chứa tiêm phụ thuộc cỡ nhỏ'
  spec: lessons/jv2/L04_nhan_phan_chieu_mini_di.yaml
  requires:
  - L03
  objectives:
  - Mô tả nhãn là dữ liệu gắn vào mã mà chương trình khác đọc, và vì sao phải khai thời hạn giữ
  - Đọc nhãn tự định nghĩa bằng phản chiếu và dựng bộ chứa tiêm phụ thuộc cỡ nhỏ
  - 'Nêu cách Spring tự thấy và nối các thành phần: cùng cơ chế với bộ chứa cỡ nhỏ'
  - Nhận ra vòng phụ thuộc và cái giá khi một thành phần được dùng chung cho mọi yêu cầu
  - Viết bộ chứa tiêm phụ thuộc cho ba lớp của kho hàng và chạy thử
  example: 'Bộ chứa tiêm phụ thuộc ~50 dòng: lấy ChuyenTien tạo 3 đối tượng, phí 5 000; một triệu yêu cầu dùng chung 3 đối tượng, tạo mới mỗi lần 3 000 000'
  fix:
  - Nhãn không khai Retention RUNTIME thì phản chiếu không thấy; vòng phụ thuộc qua hàm tạo; thành phần dùng chung không được giữ trạng thái riêng của yêu cầu
- id: L05
  title: 'Luồng: tranh chấp dữ liệu, khoá và nhóm luồng'
  spec: lessons/jv2/L05_luong_race_khoa_nhom_luong.yaml
  requires:
  - L04
  objectives:
  - Mô tả vì sao hai luồng cùng cộng vào một biến thì mất cập nhật
  - Đo tranh chấp dữ liệu và sửa bằng khoá hoặc phép nguyên tử
  - Dùng nhóm luồng và phiếu hẹn để chạy nhiều việc và gom kết quả
  - Nhận ra bế tắc khi khoá hai thứ và sửa bằng thứ tự khoá chung
  - Nhận ra số luồng cần tăng theo tốc độ nhân thời gian xử lý, và khi nào thêm luồng không còn giúp ích
  - Viết chương trình bốn luồng đo tranh chấp và sửa đúng
  example: 'Hai luồng đọc 100 rồi cùng ghi: 130 hoặc 150, không bao giờ 180; hai luồng cộng 2 000 000 đúng khi có khoá hoặc phép nguyên tử; chuyển A→B và B→A cùng lúc gây bế tắc, sửa bằng khoá theo mã nhỏ
    trước'
  fix:
  - Gọi run() không mở luồng; lỗi trong nhóm luồng chỉ lộ khi get(); số luồng cần = tốc độ × thời gian xử lý (định luật Little)
- id: L06
  title: 'Kiểm thử đơn vị: ca ở biên, khẳng định, JUnit 5'
  spec: lessons/jv2/L06_kiem_thu_don_vi.yaml
  requires:
  - L05
  objectives:
  - Chọn các ca kiểm ở biên và ngay sau biên từ đặc tả
  - Viết khẳng định tự viết và chạy bảy ca kiểm thật
  - Dùng JUnit 5 để chạy cùng các ca kiểm và đọc kết quả đạt hay hỏng
  - Nêu vì sao phải gây lỗi cố ý để chắc ca kiểm có thể đỏ
  - Nhận ra vì sao không kiểm hết được và số tổ hợp bùng nổ ra sao
  - Viết năm ca kiểm cho hàm phí chuyển khoản và tìm lỗi biên
  example: Bảy ca kiểm ở biên của hàm phí ba bậc đều đạt; đổi <= thành < thì đúng hai ca biên hỏng; JUnit 5 báo expected <1000> but was <5000>; kiểm hết một long cần ≈ 584 năm
  fix:
  - Ca kiểm nuốt ngoại lệ thì không bao giờ hỏng; ca kiểm dùng chung trạng thái phụ thuộc thứ tự chạy; so số thực bằng ==
- id: L07
  title: 'Gỡ lỗi: dấu vết ngăn xếp, nhật ký, chia đôi, trình gỡ lỗi'
  spec: lessons/jv2/L07_go_loi_dau_vet_nhat_ky.yaml
  requires:
  - L06
  objectives:
  - Đọc dấu vết ngăn xếp nhiều tầng, kể cả phần nguyên nhân gốc, để tìm hiện trường và thủ phạm
  - Dùng điểm dừng của jdb để dừng chương trình và kiểm giá trị biến
  - Nêu cách ghi nhật ký có mức độ và vì sao không ghi dữ liệu nhạy cảm
  - Nhận ra nhật ký phình theo tải và chia đôi chỉ cần log₂ n lần kiểm
  - Sửa chương trình lỗi biên chỉ số dựa trên dấu vết và chạy lại cho ra kết quả đúng
  example: Dấu vết bốn tầng chỉ ra chia cho 0 do danh sách rỗng; Caused by chỉ nguyên nhân gốc; chia đôi tìm lỗi trong 1 000 000 bước chỉ 20 lần kiểm; nhật ký 3 dòng × 200 byte ở 10 000 giao dịch/giây ≈
    518 GB/ngày (số minh hoạ)
  fix:
  - Nuốt lỗi bằng catch rỗng; ghi nguyên số thẻ vào nhật ký; nối chuỗi trong lời gọi log vẫn chạy khi mức tắt
- id: L08
  title: 'Thời gian và tiền: java.time, BigDecimal, làm tròn, vùng ngôn ngữ'
  spec: lessons/jv2/L08_thoi_gian_va_tien.yaml
  requires:
  - L07
  objectives:
  - Phân biệt ngày lịch, điểm thời gian và ngày giờ theo múi giờ, và nhớ rằng một ngày có thể dài 23 hay 25 giờ
  - Tính lãi theo ngày bằng số thập phân chính xác và kiểm lại bằng số nguyên
  - Nêu sai lệch cộng dồn của các kiểu làm tròn khi số giao dịch tăng một nghìn lần
  - Nhận ra bẫy cộng ngày với cộng tháng, tạo số chính xác từ số thực, và vùng ngôn ngữ
  - Viết chương trình lãi theo ngày cho khoản gửi 120 triệu và chạy thử
  example: Lãi 100 000 000 × 7,2% × 89 ngày / 365 = 1 755 616 đồng (HALF_UP, số minh hoạ); ngày chuyển giờ mùa hè dài 23 giờ; 1 triệu giao dịch nửa đồng làm tròn lên lệch 500 000
  fix:
  - new BigDecimal(0.1) lấy nguyên sai số nhị phân; cộng 30 ngày khác cộng 1 tháng; định dạng và đọc số phụ thuộc Locale
- id: L09
  title: 'Dự án tình huống: sổ cái tệp CSV tới báo cáo'
  spec: lessons/jv2/L09_du_an_so_cai.yaml
  requires:
  - L08
  objectives:
  - Dựng dự án nhiều gói gồm bản ghi, bộ đọc, báo cáo, nhật ký và kiểm thử, rồi biên dịch và chạy bằng lệnh
  - Tính số dư theo tài khoản và kiểm bất biến tổng số dư bằng tổng nạp trừ tổng rút
  - Nêu cách đối chiếu số dòng và nhật ký để không bỏ lặng lẽ dòng lỗi
  - Nhận ra bản giữ danh sách gãy ở một triệu dòng, bản đọc theo dòng sống, song song cần bộ gom an toàn
  - Viết chương trình sổ cái nhỏ bỏ qua dòng lỗi, in số dư và kiểm bất biến
  example: 'Sổ cái 8 dòng: số dư A01 6 300 000, A02 3 500 000, A03 500 000, tổng 10 300 000 = nạp 12 300 000 − rút 2 000 000; tệp 1 triệu dòng với 32 MB: giữ danh sách hết bộ nhớ, đọc theo dòng chạy xong'
  fix:
  - 'Bỏ dòng lỗi lặng lẽ vẫn thoả bất biến: phải đối chiếu số dòng; kiểm tra nghiệp vụ không có ca kiểm có thể bị xoá mà không ai biết'
