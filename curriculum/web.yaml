# Giáo án KẾ HOẠCH — WEB · Phát triển ứng dụng web và di động (fullstack)
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã WEB:Lxx (Node thật cho vòng lặp sự kiện, html.parser, sqlite3,
#   công thức độ tương phản WCAG, vector PKCE của RFC 7636).
# Căn cứ phạm vi: CS2023 — “Specialized Platform Development (SPD)”: Web, Mobile; RFC 9110 (ngữ nghĩa HTTP: phương thức an toàn, lũy đẳng),
#   RFC 9111 (bộ nhớ đệm HTTP), RFC 6749 + RFC 7636 (OAuth 2.0, PKCE), WCAG 2.2 (W3C 2023) mục 1.4.3 (độ tương phản 4,5 : 1),
#   HTML Living Standard (vòng lặp sự kiện, tác vụ vi mô), web.dev “Core Web Vitals” (LCP tốt ≤ 2,5 s) — đọc theo bản hiện hành.
# Vì sao cần: NET dạy HTTP, SEC dạy phiên và chèn mã, SDP dạy thiết kế mã, DBS dạy cơ sở dữ liệu; chưa có khoá ghép thành ỨNG DỤNG: giao diện,
#   bất đồng bộ, API, bộ nhớ đệm, hiệu năng, truy cập, di động, ngoại tuyến, phát hành. Khoá dạy NGUYÊN LÝ không phụ thuộc thư viện; tên thư viện
#   chỉ là ví dụ trên màn hình.
# Thứ tự học: sau NET L09, L12; SEC L05, L06; SDP L10; DBS L02, L09; DSY L02 (đồng hồ vector).
course: WEB
status: planned
lessons:
  - id: L00
    title: "Kiến trúc ứng dụng web: trình duyệt, máy chủ, API, cơ sở dữ liệu"
    spec: lessons/web/L00_kien_truc_web.yaml
    requires: []
    requires_ext: ["NET:L09", "NET:L12"]
    objectives: ["Lần theo một yêu cầu từ lúc bấm tới lúc hiện", "Ước lượng thời gian thiết lập kết nối", "Phân biệt việc của trình duyệt, máy chủ, cơ sở dữ liệu"]
    example: "khứ hồi 50 ms: bắt tay giao vận 1 vòng + bắt tay mã hoá 1 vòng + yêu cầu đầu 1 vòng ≈ 150 ms trước khi nhận byte đầu (VER WEB:L00)"
    fix: ["Băng thông lớn không bù được nhiều vòng khứ hồi — giảm số vòng thường hiệu quả hơn"]
  - id: L01
    title: "HTML và cây DOM: cấu trúc và ngữ nghĩa"
    spec: lessons/web/L01_html_dom.yaml
    requires: [L00]
    requires_ext: ["CS112:L05", "TOC:L06"]
    objectives: ["Đọc cây phần tử từ mã HTML", "Chọn thẻ có ngữ nghĩa thay cho thẻ chung chung", "Biết vì sao ngữ nghĩa quan trọng cho bàn phím và trình đọc màn hình"]
    example: "<ul><li>A</li><li>B<b>!</b></li></ul> → cây 4 phần tử, độ sâu 3 (html.parser, VER WEB:L01)"
    fix: ["Nút bấm làm bằng thẻ chung chung không nhận phím Tab và trình đọc màn hình không biết đó là nút"]
  - id: L02
    title: "CSS: mô hình hộp, độ ưu tiên của bộ chọn, bố cục linh hoạt"
    spec: lessons/web/L02_css_hop.yaml
    requires: [L01]
    objectives: ["Tính kích thước hộp", "So độ ưu tiên của hai bộ chọn", "Dùng bố cục linh hoạt chia chỗ trống"]
    example: "rộng 200 px, đệm 20 px, viền nét liền 5 px (border: 5px solid) theo kiểu mặc định: chiếm 200 + 2·20 + 2·5 = 250 px; bộ chọn (mã, lớp, thẻ) = (1, 1, 0) thắng (0, 2, 1) (VER WEB:L02)"
    fix: ["Độ ưu tiên so theo từng cột từ trái sang, không cộng thành một số", "Viền thiếu kiểu nét (border: 5px) có bề rộng 0 — luôn ghi kiểu nét"]
  - id: L03
    title: "JavaScript và vòng lặp sự kiện: tác vụ và tác vụ vi mô"
    spec: lessons/web/L03_vong_lap_su_kien.yaml
    requires: [L00]
    requires_ext: ["OSY:L01", "PLC:L07"]
    objectives: ["Dự đoán thứ tự chạy của mã đồng bộ, tác vụ vi mô, tác vụ hẹn giờ", "Giải thích vì sao vòng lặp dài làm đơ giao diện", "Chia việc nặng để giao diện còn phản hồi"]
    example: "in 1; hẹn giờ 0 ms in 2; lời hứa đã xong in 3; in 4 → thứ tự 1, 4, 3, 2 (chạy thật bằng Node, VER WEB:L03)"
    fix: ["Hẹn giờ 0 ms không chạy ngay — nó chờ mã đồng bộ và mọi tác vụ vi mô xong"]
  - id: L04
    title: "Lập trình bất đồng bộ: chờ tuần tự hay chạy đồng thời"
    spec: lessons/web/L04_bat_dong_bo.yaml
    requires: [L03]
    objectives: ["Viết hàm bất đồng bộ", "Chạy đồng thời các yêu cầu độc lập và xử lý lỗi từng phần", "Giới hạn số yêu cầu đồng thời"]
    example: "3 yêu cầu 100, 200, 300 ms: chờ lần lượt ≈ 600 ms; chạy đồng thời rồi chờ tất cả ≈ 300 ms (đo bằng Node, VER WEB:L04)"
    fix: ["Chạy đồng thời hàng nghìn yêu cầu có thể làm sập máy chủ đích — giới hạn số yêu cầu đồng thời"]
  - id: L05
    title: "Giao diện theo trạng thái: thành phần, dữ liệu một chiều, so khớp danh sách"
    spec: lessons/web/L05_giao_dien_trang_thai.yaml
    requires: [L01, L04]
    requires_ext: ["SDP:L10", "CS112:L20"]
    objectives: ["Mô tả giao diện là hàm của trạng thái", "Giải thích vai trò của khoá khi so khớp danh sách", "Giữ dữ liệu đi một chiều"]
    example: "danh sách có khoá [A B C D E] đổi thành [C A B D E]: dãy con tăng dài nhất giữ được 4 phần tử → tối thiểu chỉ cần di chuyển 1 phần tử (VER WEB:L05)"
    fix: ["Dùng chỉ số mảng làm khoá thì chèn đầu danh sách làm mọi dòng bị gán nhầm trạng thái"]
  - id: L06
    title: "Thiết kế API: tài nguyên, phương thức, mã trạng thái, lũy đẳng"
    spec: lessons/web/L06_thiet_ke_api.yaml
    requires: [L00]
    requires_ext: ["SDP:L14", "SAR:L09"]
    objectives: ["Chọn phương thức theo ngữ nghĩa an toàn và lũy đẳng", "Chọn mã trạng thái đúng", "Dùng khoá lũy đẳng cho thao tác tạo mới"]
    example: "theo RFC 9110: GET an toàn và lũy đẳng; PUT, DELETE lũy đẳng nhưng không an toàn; POST không lũy đẳng → gửi lại POST cần khoá lũy đẳng (VER WEB:L06)"
    fix: ["Trả 200 kèm “lỗi” trong thân làm hỏng bộ nhớ đệm, thử lại và giám sát"]
  - id: L07
    title: "Phân trang và truy vấn hiệu quả: độ lệch hay con trỏ"
    spec: lessons/web/L07_phan_trang.yaml
    requires: [L06]
    requires_ext: ["DBS:L09", "DBS:L10"]
    objectives: ["Ước lượng chi phí phân trang theo độ lệch", "Dùng con trỏ theo khoá sắp xếp", "Tránh trùng và sót khi dữ liệu thay đổi"]
    example: "trang 1000, mỗi trang 20 dòng, phân trang theo độ lệch: cơ sở dữ liệu bỏ qua 19 980 dòng trước khi trả 20; con trỏ “sau mã 19 980” dùng chỉ mục đi thẳng tới (sqlite3, VER WEB:L07)"
    fix: ["Phân trang theo độ lệch còn trả trùng hoặc sót dòng khi dữ liệu thay đổi giữa hai trang"]
  - id: L08
    title: "Bộ nhớ đệm HTTP: độ tươi, thẻ phiên bản, xác thực lại"
    spec: lessons/web/L08_bo_nho_dem_http.yaml
    requires: [L06]
    requires_ext: ["SAR:L04"]
    objectives: ["Tính bản lưu còn tươi hay đã cũ", "Dùng thẻ phiên bản để trả 304", "Chọn chính sách lưu cho từng loại tài nguyên"]
    example: "max-age 600 s, bản lưu đã 700 s → cũ, hỏi lại máy chủ kèm thẻ phiên bản; máy chủ thấy khớp → 304, không gửi lại thân (RFC 9111, VER WEB:L08)"
    fix: ["Tệp tĩnh có tên chứa mã băm nội dung thì cho lưu rất lâu; trang HTML thì không"]
  - id: L09
    title: "Xác thực cho web và di động: phiên, mã truy cập, ủy quyền có PKCE"
    spec: lessons/web/L09_xac_thuc.yaml
    requires: [L06]
    requires_ext: ["SEC:L03", "SEC:L05", "SEC:L08"]
    objectives: ["So sánh phiên cookie với mã truy cập", "Giải thích luồng mã ủy quyền và vì sao cần PKCE", "Biết ứng dụng di động không giữ được bí mật"]
    example: "PKCE: chuỗi bí mật dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk → mã thách thức SHA-256 rồi base64url = E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM (vector RFC 7636, VER WEB:L09)"
    fix: ["Ứng dụng di động không giữ được bí mật máy khách — bí mật nhúng trong ứng dụng coi như công khai"]
  - id: L10
    title: "Hiệu năng web: đường kết xuất quan trọng và kích thước tải về"
    spec: lessons/web/L10_hieu_nang_web.yaml
    requires: [L03, L08]
    requires_ext: ["NET:L02"]
    objectives: ["Ước lượng thời gian tải theo kích thước và băng thông", "Nhận ra tài nguyên chặn hiển thị", "Nêu các chỉ số trải nghiệm chính"]
    example: "2 MB mã kịch bản trên mạng 200 KB/s ≈ 10 s; nén và tách còn 500 KB ≈ 2,5 s — đúng ngưỡng “tốt” của nội dung lớn nhất hiện ra (VER WEB:L10)"
    fix: ["Đo trên máy phát triển mạnh, mạng nhanh không đại diện người dùng thật — đo cả phân vị cao trên thiết bị yếu"]
  - id: L11
    title: "Truy cập cho mọi người: độ tương phản, bàn phím, trình đọc màn hình"
    spec: lessons/web/L11_truy_cap.yaml
    requires: [L01, L02]
    objectives: ["Tính độ tương phản theo chuẩn", "Kiểm tra dùng được bằng bàn phím", "Không truyền thông tin chỉ bằng màu"]
    example: "chữ xám #777777 trên nền trắng: độ tương phản ≈ 4,48 : 1 < 4,5 → không đạt mức AA; #767676 ≈ 4,54 → đạt (VER WEB:L11)"
    fix: ["Màu không được là cách DUY NHẤT truyền thông tin — thêm chữ hoặc biểu tượng"]
  - id: L12
    title: "Ứng dụng di động: vòng đời, luồng giao diện, ngân sách khung hình"
    spec: lessons/web/L12_ung_dung_di_dong.yaml
    requires: [L03]
    requires_ext: ["OSY:L01", "ESY:L13"]
    objectives: ["Mô tả vòng đời ứng dụng khi bị đưa xuống nền", "Tính ngân sách khung hình", "Giữ công việc nặng ngoài luồng giao diện"]
    example: "màn hình 60 Hz cho mỗi khung ≈ 16,7 ms, 120 Hz ≈ 8,3 ms — mọi việc trên luồng giao diện phải xong trong ngân sách đó (VER WEB:L12)"
    fix: ["Hệ điều hành có thể dừng hẳn ứng dụng ở nền bất cứ lúc nào — lưu trạng thái trước khi bị đưa xuống nền"]
  - id: L13
    title: "Ngoại tuyến trước và đồng bộ: hàng đợi thao tác, xung đột, hợp nhất"
    spec: lessons/web/L13_ngoai_tuyen_dong_bo.yaml
    requires: [L12]
    requires_ext: ["DSY:L02", "SWF:L11"]
    objectives: ["Thiết kế hàng đợi thao tác chờ gửi", "So sánh “ghi sau thắng” với hợp nhất theo nghĩa dữ liệu", "Biết vì sao đồng hồ máy khách không đáng tin"]
    example: "hai máy ngoại tuyến cùng thêm việc vào một danh sách (máy 1 thêm “mua sữa”, máy 2 thêm “gọi mẹ”): ghi sau thắng còn 1 việc; hợp nhất bằng phép hợp hai tập giữ cả 2 (VER WEB:L13)"
    fix: ["Đồng hồ máy người dùng sai lệch — “ghi sau thắng” theo đồng hồ máy khách có thể làm mất bản mới hơn"]
  - id: L14
    title: "Phát hành và tiến hoá API: tương thích ngược, cờ tính năng, phiên bản ứng dụng cũ"
    spec: lessons/web/L14_tien_hoa_api.yaml
    requires: [L06, L13]
    requires_ext: ["DVO:L07", "SDP:L14"]
    objectives: ["Thay đổi API không làm hỏng ứng dụng cũ", "Ước lượng thời gian phải hỗ trợ phiên bản cũ", "Dùng cờ tính năng để tách triển khai khỏi phát hành"]
    example: "mỗi tuần 30% người dùng còn lại cập nhật ứng dụng: sau 4 tuần vẫn còn 0,7⁴ ≈ 24% dùng bản cũ → máy chủ phải hỗ trợ API cũ lâu hơn nhiều so với web (số minh hoạ, VER WEB:L14)"
    fix: ["Xoá trường khỏi phản hồi API là thay đổi phá vỡ — thêm trường mới thì an toàn hơn"]
  - id: L15
    title: "Tình huống chuyên gia theo dòng thời gian: HTTP từ 1.0 tới 3"
    spec: lessons/web/L15_hanh_trinh_http.yaml
    requires: [L00, L04, L10]
    requires_ext: ["NET:L11"]
    kind: journey
    objectives: ["Kể lại hành trình của HTTP qua năm chặng 1996, 1999, 2015, 2022, mỗi chặng một điểm nghẽn và một cách xử lý", "Đếm lại số vòng khứ hồi để tải một trang ở từng phiên bản, và thời gian chờ khi một gói bị mất", "Chọn phiên bản và cách tải phù hợp với trang và người dùng của chính mình, kèm điều kiện đổi lựa chọn"]
    example: "trang 1 tệp + 10 ảnh, vòng 50 ms (số minh hoạ): mỗi yêu cầu một kết nối 22 vòng = 1100 ms (RFC 1945); kết nối bền 12 vòng; gửi liền 3 vòng = 150 ms (RFC 2616); 100 tiêu đề × 500 B = 50 000 B cần 3 vòng với cửa sổ đầu 14 600 B, nén còn 2480 B → 1 vòng; mất 1 gói: 4 luồng dừng 200 ms trên TCP, 50 ms trên QUIC (RFC 9114) (VER WEB:L15)"
    fix: ["HTTP/1.1 ra đầu tiên ở RFC 2068 (1/1997); RFC 2616 (1999) là bản sửa — khoảng 1.0 → 1.1 là 8 tháng, 1.1 → 2 là 18 năm", "Chỉ khẳng định điều có trong RFC 1945, 2068, 2616, 9112, 7540, 7541, 9113, 9114, 9110 (audit/web/sources_L15.md)", "Không đếm vòng bắt tay mã hoá: các RFC đã đọc không ghi số vòng của phần mã hoá", "Không nói “trình duyệt mở 6 kết nối”: RFC 2616 ghi 2, RFC 9112 bỏ con số cố định", "Kích thước tiêu đề, thời gian xử lý, số luồng là số minh hoạ"]
