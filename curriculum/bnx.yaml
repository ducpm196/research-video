# Giáo án Khoá BNX · Backend ngân hàng mở rộng theo JD (16 bài, lập 2026-11-11, đợt LF1)
# Căn cứ phạm vi (OBSERVED 2026-11-11, audit/review/learn_full/plan_LF1.md §0): quét chữ trong 656 đặc tả bài thì 0 bài nói về JWT, OIDC, OpenAPI/Swagger,
#   gRPC, Protobuf, Elasticsearch, Couchbase, SWIFT, ví điện tử, thuế điện tử, RabbitMQ, Oracle AQ, DDD, Open Banking; T-SQL chỉ được nhắc (DBS L17); chưa có bài Git.
#   Các chủ đề này đều có trong JD (resources/job/JD.md: tin Software Engineer acbjobs.com.vn — Stored Procedure Oracle/MS SQL bắt buộc, Swagger, gRPC,
#   Couchbase, Elasticsearch, Kafka/RabbitMQ/ActiveMQ, tính năng Oracle mới; điểm cộng Git/Docker, thanh toán quốc tế, ngoại tệ, ví điện tử, thuế điện tử;
#   tin Back-end Lead: DDD, API Gateway, Open Banking, Kubernetes, CI/CD).
# Không lặp khoá khác: PKCE đã dạy ở WEB L09, BM25 ở DEN L07, tiến hoá lược đồ ở EVT L01, cập nhật cuốn chiếu ở CLD L08, thùng token ở SAR L07 — bài BNX
#   nhắc lại ngắn trong cảnh ôn nền rồi đi tiếp vào phần JD hỏi. Tiên quyết chỉ trong JVA, BNK, BNX để khoá đứng ngay sau BNK trong lộ trình (HOC_TAP chặng 3).
# Nguồn: audit/bnx/sources.md (mã [CBPR], [ND52], [TT40], [TT41], [TT64], [TT19], RFC…). Mã trên màn hình chạy thật khi máy có công cụ: git, Python, openssl,
#   Oracle Database Free 23 và SQL Server 2022 trong Docker (audit/bnx/dbrun.py). Số liệu ví dụ: VER BNX:Lxx ở audit/verify_plan_curricula.py; kiểm bài ở audit/bnx/verify_bnx.py.
# Thứ tự học: L00 công cụ; L01–L02 hợp đồng API; L03–L05 xác thực giữa người và dịch vụ; L06–L07 Oracle và SQL Server; L08–L10 kho dữ liệu và hàng đợi khác;
#   L11–L12 nghiệp vụ JD; L13 triển khai; L14 kiến trúc cho Lead; L15 tình huống chuyên gia.
course: BNX
profile: stem
status: active
lessons:
  - id: L00
    title: "Git: lưu lịch sử, tạo nhánh, gộp và giải xung đột"
    spec: lessons/bnx/L00_git_nhanh_gop_xung_dot.yaml
    requires: []
    requires_ext: ["JVA:L12"]
    objectives: ["Tạo kho, ghi một commit và đọc lịch sử", "Tạo nhánh, gộp nhánh và đọc đồ thị commit", "Đọc dấu xung đột và giải xung đột bằng tay", "Giải thích vì sao bí mật đã commit vẫn còn trong lịch sử"]
    example: "Hai nhánh cùng sửa dòng phí 5500 thành 6600 và 4400: gộp báo xung đột, tệp có ba dấu mốc <<<<<<<, =======, >>>>>>>; sửa tay rồi commit thì commit gộp có 2 cha; mã commit là 40 ký tự thập lục phân (VER BNX:L00)"
    fix: ["Git lưu ảnh chụp cây tệp có mã băm, không chỉ lưu “phần thay đổi”", "Xung đột không phải Git hỏng: hai người sửa cùng chỗ, người phải quyết", "Xoá mật khẩu ở commit sau không xoá nó khỏi lịch sử; phải đổi mật khẩu"]
  - id: L01
    title: "OpenAPI (Swagger): đặc tả API là hợp đồng, viết trước khi viết mã"
    spec: lessons/bnx/L01_openapi_hop_dong_api.yaml
    requires: [L00]
    requires_ext: ["BNK:L03"]
    objectives: ["Đọc một đặc tả OpenAPI 3: đường dẫn, phương thức, thân yêu cầu, phản hồi, lược đồ", "Kiểm một yêu cầu theo lược đồ và chỉ ra trường sai", "Phân biệt thay đổi tương thích và thay đổi phá vỡ hợp đồng", "Giải thích lợi ích của cách làm hợp đồng trước"]
    example: "Lược đồ chuyển khoản: số tài khoản 10–19 chữ số, số tiền nguyên ≥ 1; ba yêu cầu thử cho 1 hợp lệ, 1 sai số tiền 0, 1 thiếu tài khoản nhận (VER BNX:L01)"
    fix: ["Swagger là bộ công cụ, OpenAPI là chuẩn đặc tả", "Đặc tả không tự kiểm dữ liệu: phải bật kiểm lược đồ ở máy chủ", "Thêm trường bắt buộc vào yêu cầu là thay đổi phá vỡ"]
  - id: L02
    title: "gRPC và Protocol Buffers: bản tin nhị phân, số hiệu trường và hạn chót"
    spec: lessons/bnx/L02_grpc_protobuf.yaml
    requires: [L01]
    objectives: ["Mã hoá một bản tin Protocol Buffers bằng tay: khoá trường và số nguyên biến độ dài", "So kích thước với JSON", "Giải thích vì sao không được đổi số hiệu trường", "Truyền hạn chót qua chuỗi lời gọi"]
    example: "Trường số 1 mang 150 mã hoá thành 3 byte 08 96 01, JSON {\"id\":150} dài 10 byte; hạn chót 2 giây qua ba dịch vụ mỗi dịch vụ 800 ms thì dịch vụ thứ ba hết giờ (VER BNX:L02)"
    fix: ["gRPC không “luôn nhanh hơn REST”: lợi ở bản tin nhỏ, luồng, hợp đồng chặt", "Xoá trường thì giữ số hiệu bằng reserved, không dùng lại", "Không có hạn chót thì lời gọi treo kéo theo cả chuỗi"]
  - id: L03
    title: "JWT: mã truy cập tự mang thông tin, chữ ký HMAC và hạn dùng"
    spec: lessons/bnx/L03_jwt_chu_ky_han_dung.yaml
    requires: [L01]
    objectives: ["Tách và giải mã ba phần của một JWT", "Tính lại chữ ký HS256 và phát hiện phần thân bị sửa", "Kiểm hạn dùng, người phát hành và người nhận", "Nêu cách thu hồi khi mã tự mang thông tin"]
    example: "Ví dụ HS256 của RFC 7515 Phụ lục A.1 tính lại ra chữ ký dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk; sửa một ký tự phần thân thì chữ ký không khớp; exp = 1300819380 là năm 2011, đã hết hạn (VER BNX:L03)"
    fix: ["JWT được ký chứ không được mã hoá: ai cầm mã cũng đọc được phần thân", "Máy chủ cố định thuật toán, không tin trường alg của mã gửi tới", "Mã tự mang thông tin khó thu hồi: hạn ngắn và mã làm mới"]
  - id: L04
    title: "OAuth 2.0 và OpenID Connect: ai cấp mã, ai kiểm mã, phạm vi quyền"
    spec: lessons/bnx/L04_oauth2_openid_connect.yaml
    requires: [L03]
    objectives: ["Gọi tên bốn vai trong OAuth 2.0", "Chọn luồng cấp mã: mã ủy quyền có PKCE cho ứng dụng, thông tin máy khách cho dịch vụ với dịch vụ", "Kiểm phạm vi quyền và người nhận của mã truy cập", "Phân biệt mã truy cập với mã định danh của OpenID Connect"]
    example: "Mã có phạm vi accounts:read gọi API cần payments:write bị từ chối 403; mã cấp cho người nhận api-a bị api-b từ chối; mã hạn 300 giây, cho lệch đồng hồ 60 giây thì giây 359 còn nhận, từ giây 360 bị từ chối, đúng quy tắc RFC 7519 “từ đúng thời điểm hết hạn trở đi thì không nhận” (VER BNX:L04)"
    fix: ["OAuth 2.0 là ủy quyền, không phải đăng nhập; đăng nhập là OpenID Connect", "Không dùng mã định danh để gọi API", "Không đặt bí mật máy khách trong ứng dụng di động"]
  - id: L05
    title: "mTLS: hai bên cùng trình chứng chỉ khi các dịch vụ gọi nhau"
    spec: lessons/bnx/L05_mtls_chung_chi_hai_chieu.yaml
    requires: [L04]
    objectives: ["Phân biệt TLS một chiều và hai chiều", "Kiểm một chứng chỉ khách: chuỗi tin cậy, hạn dùng, tên", "Đọc lỗi bắt tay khi thiếu hoặc sai chứng chỉ", "Lên kế hoạch xoay vòng chứng chỉ trước khi hết hạn"]
    example: "Máy chủ đòi chứng chỉ khách, chạy thật bằng openssl và Python: không có chứng chỉ thì bắt tay thất bại; chứng chỉ do nơi cấp khác ký thì thất bại; chứng chỉ đúng thì thành công (VER BNX:L05)"
    fix: ["mTLS xác thực máy, không thay phân quyền theo người dùng", "Chứng chỉ hết hạn là sự cố có lịch hẹn trước: theo dõi ngày hết hạn", "Không tắt kiểm chứng chỉ để “chạy tạm”"]
  - id: L06
    title: "Thủ tục lưu trữ trên Oracle và SQL Server: tham số, giao dịch và bắt lỗi"
    spec: lessons/bnx/L06_thu_tuc_luu_tru_plsql_tsql.yaml
    requires: [L00]
    requires_ext: ["BNK:L05"]
    objectives: ["Viết thủ tục chuyển tiền có tham số vào và ra bằng PL/SQL và T-SQL", "Hoàn tác khi lỗi bằng khối bắt lỗi của mỗi hệ", "Khoá hai tài khoản theo một thứ tự cố định", "Gọi thủ tục từ Java bằng JDBC"]
    example: "Thủ tục chuyển tiền chạy thật trên Oracle Database Free 23 và SQL Server 2022: chuyển 500 000 khỏi tài khoản có 300 000 thì báo lỗi, hoàn tác, tổng tiền giữ 1 300 000; chuyển 200 000 thì thành công, tổng vẫn 1 300 000 (VER BNX:L06)"
    fix: ["Bắt lỗi rồi nuốt lỗi là che giấu tiền sai; phải hoàn tác và báo lên", "Mặc định SQL Server không hoàn tác cả giao dịch khi một câu lệnh lỗi; dùng TRY…CATCH hoặc SET XACT_ABORT ON", "Thủ tục lưu trữ không tự chống chèn mã nếu ghép chuỗi động"]
  - id: L07
    title: "Oracle cho khối lượng lớn: phân vùng, JSON, hàng đợi, bộ nhớ cột và phân mảnh"
    spec: lessons/bnx/L07_oracle_phan_vung_json_hang_doi.yaml
    requires: [L06]
    objectives: ["Phân vùng bảng giao dịch theo tháng và đọc kế hoạch cắt tỉa phân vùng", "Lưu và truy vấn dữ liệu JSON trong Oracle", "Gửi và nhận thông điệp bằng hàng đợi trong cơ sở dữ liệu", "Nêu khi nào cần bộ nhớ cột và phân mảnh"]
    example: "Bảng 12 phân vùng theo tháng; truy vấn một tháng chỉ đọc 1 phân vùng, kế hoạch thực thi ghi PARTITION RANGE SINGLE (chạy thật trên Oracle Database Free 23, VER BNX:L07)"
    fix: ["Phân vùng không làm mọi truy vấn nhanh hơn: truy vấn không lọc theo khoá phân vùng phải đọc mọi phân vùng", "Hàng đợi trong cơ sở dữ liệu chung giao dịch với dữ liệu, khác Kafka", "Phân mảnh là nhiều cơ sở dữ liệu riêng: giao dịch xuyên mảnh đắt"]
  - id: L08
    title: "Elasticsearch: chỉ mục ngược phân tán, mảnh, bản sao và độ tươi"
    spec: lessons/bnx/L08_elasticsearch_manh_ban_sao.yaml
    requires: [L01]
    objectives: ["Dựng chỉ mục ngược cho vài mô tả giao dịch", "Tính mảnh chứa một bản ghi từ khoá định tuyến", "Giải thích vì sao bản ghi vừa ghi chưa tìm thấy ngay", "Biết vì sao không dùng Elasticsearch làm nơi lưu số dư"]
    example: "Chỉ mục 3 mảnh chính, mỗi mảnh 1 bản sao: 6 mảnh; mảnh = băm(khoá) mod 3; đổi thành 4 mảnh chính thì chỉ 3/12 = 25% bản ghi giữ mảnh cũ, nên phải tạo chỉ mục mới (VER BNX:L08)"
    fix: ["Elasticsearch không thay cơ sở dữ liệu giao dịch: không có giao dịch nhiều bản ghi", "Số mảnh chính không đổi tại chỗ được", "Ghi xong chưa tìm được ngay, chờ lần làm tươi"]
  - id: L09
    title: "Couchbase: bản ghi theo khoá, vBucket và giá trị CAS chống ghi đè"
    spec: lessons/bnx/L09_couchbase_vbucket_cas.yaml
    requires: [L08]
    objectives: ["Thiết kế khoá bản ghi cho hồ sơ khách hàng", "Tính vBucket của một khoá", "Dùng giá trị CAS để chặn mất cập nhật", "Đặt hạn sống cho bản ghi phiên"]
    example: "Hai tiến trình cùng đọc bản ghi có CAS = 7; tiến trình đầu ghi được và CAS đổi; tiến trình sau ghi với CAS = 7 bị từ chối, đọc lại rồi ghi: không mất cập nhật nào (số minh hoạ, VER BNX:L09)"
    fix: ["CAS không phải khoá: không chặn ai đọc, chỉ chặn ghi đè bản cũ", "Khoá bản ghi là cách truy cập chính: thiết kế khoá trước", "Kho bản ghi theo khoá không thay sổ cái"]
  - id: L10
    title: "Kafka nâng cao và RabbitMQ: nén nhật ký theo khoá, kiểm lược đồ, định tuyến theo sàn"
    spec: lessons/bnx/L10_kafka_nang_cao_rabbitmq.yaml
    requires: [L09]
    requires_ext: ["BNK:L07"]
    objectives: ["Tính kết quả nén nhật ký theo khoá, kể cả bản ghi bia mộ", "Kiểm một thay đổi lược đồ trước khi cho người gửi dùng", "Định tuyến thông điệp qua sàn chủ đề của RabbitMQ", "Chọn Kafka hay RabbitMQ cho một luồng ngân hàng"]
    example: "8 bản ghi của 3 tài khoản sau khi nén còn 3; ghi thêm một bản ghi bia mộ cho một tài khoản thì sau khi nén còn 2; khoá định tuyến payment.vn.napas khớp mẫu payment.*.napas và payment.# nhưng không khớp payment.* (VER BNX:L10)"
    fix: ["Nén nhật ký không xoá theo thời gian mà giữ bản cuối mỗi khoá", "RabbitMQ xoá thông điệp khi đã xác nhận, Kafka giữ để đọc lại", "Kiểm lược đồ phải chạy trước khi người gửi đổi"]
  - id: L11
    title: "Thanh toán quốc tế và ngoại tệ: SWIFT, ISO 20022, tài khoản nostro và tỉ giá"
    spec: lessons/bnx/L11_thanh_toan_quoc_te_ngoai_te.yaml
    requires: [L10]
    requires_ext: ["BNK:L09"]
    objectives: ["Đọc mã BIC và kiểm số IBAN", "Ghi bút toán chuyển tiền quốc tế qua tài khoản nostro", "Tính số tiền khi đổi ngoại tệ và chịu phí theo OUR, SHA, BEN", "Nêu thay đổi từ bản tin MT sang ISO 20022"]
    example: "IBAN mẫu GB82WEST12345698765432 có số dư mod 97 bằng 1; chuyển 1 000 USD với tỉ giá bán 25 400 (số minh hoạ) trừ 25 400 000 đồng; phí SHA 15 USD ở ngân hàng trung gian thì người nhận được 985 USD (VER BNX:L11)"
    fix: ["Từ 22/11/2025 chỉ thị thanh toán giữa các định chế trên Swift dùng ISO 20022 (CBPR+)", "Không dùng số thực dấu phẩy động cho tỉ giá và tiền", "Ngân hàng trung gian có thể trừ phí: người nhận không chắc nhận đủ"]
  - id: L12
    title: "Ví điện tử và nộp thuế điện tử: tiền thật nằm ở đâu, bút toán và đối soát"
    spec: lessons/bnx/L12_vi_dien_tu_thue_dien_tu.yaml
    requires: [L11]
    requires_ext: ["BNK:L12"]
    objectives: ["Ghi bút toán nạp, rút, chuyển giữa ví và tài khoản ngân hàng", "Kiểm bất biến: tài khoản đảm bảo thanh toán không thấp hơn tổng số dư ví", "Kiểm hạn mức giao dịch ví theo tháng", "Mô tả luồng nộp thuế điện tử qua ngân hàng và đối soát theo số tham chiếu"]
    example: "Nạp 2 000 000 vào ví: tài khoản khách trừ 2 000 000, tài khoản đảm bảo thanh toán cộng 2 000 000, số dư ví cộng 2 000 000; ba ví 500 000, 1 200 000, 300 000 cần tài khoản đảm bảo ít nhất 2 000 000 (VER BNX:L12)"
    fix: ["Tiền trong ví không “nằm ở ví”: tiền thật ở tài khoản đảm bảo tại ngân hàng", "Hạn mức và quy định ví thay đổi theo văn bản; luôn dẫn văn bản hiện hành", "Theo Luật Quản lý thuế 2019 Điều 58, ngày đã nộp thuế là ngày ngân hàng trích tiền; nhưng chứng từ chưa sang Kho bạc thì NGÂN HÀNG chưa xong việc (chuyển tiền, đối soát)"]
  - id: L13
    title: "Từ commit tới máy chủ: Dockerfile, GitLab CI và triển khai lên Kubernetes"
    spec: lessons/bnx/L13_docker_gitlab_ci_kubernetes.yaml
    requires: [L00, L12]
    objectives: ["Viết Dockerfile cho dịch vụ Java theo thứ tự tận dụng bộ nhớ đệm", "Đọc tệp .gitlab-ci.yml và thứ tự các giai đoạn", "Khai báo Deployment và tính số Pod khi cập nhật cuốn chiếu", "Gắn ảnh với mã commit để truy ngược"]
    example: "Đường ống 4 giai đoạn build, test, package, deploy: test hỏng thì package và deploy không chạy; 4 bản, tối đa thiếu 1 và tối đa thừa 1 thì luôn có ít nhất 3 bản sẵn sàng và nhiều nhất 5 Pod (VER BNX:L13)"
    fix: ["Không dùng nhãn latest cho ảnh chạy thật", "Bí mật không nằm trong ảnh hay trong tệp đường ống", "Triển khai được chưa phải phát hành an toàn: cần kiểm sẵn sàng và quay lui"]
  - id: L14
    title: "DDD, cổng API và Open API ngân hàng: ranh giới, cửa vào và chia sẻ dữ liệu có đồng ý"
    spec: lessons/bnx/L14_ddd_cong_api_open_api.yaml
    requires: [L13]
    objectives: ["Chia hệ thống ngân hàng thành ngữ cảnh giới hạn", "Nhận ra một khái niệm mang nghĩa khác nhau ở hai ngữ cảnh", "Liệt kê việc cổng API làm: xác thực, giới hạn tốc độ, định tuyến, nhật ký", "Mô tả Open API ngân hàng theo Thông tư 64/2024/TT-NHNN"]
    example: "Cổng API giới hạn 5 yêu cầu/giây, sức chứa 10: 30 yêu cầu đến cùng lúc thì nhận 10, từ chối 20; rải đều trong 1 giây thì nhận 14; Thông tư 64/2024/TT-NHNN hiệu lực từ 01/3/2025 (VER BNX:L14)"
