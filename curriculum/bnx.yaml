    objectives: ["Giải thích vì sao kho sự kiện chỉ thêm và chặn sửa, xoá bằng trigger của cơ sở dữ liệu", "Dựng lại số dư bằng cách phát lại sự kiện từ đầu", "Sửa một sự kiện sai bằng sự kiện bù thay vì sửa kho", "Chỉ ra vì sao mô hình đọc có thể trả số cũ và nói khi nào chấp nhận được", "So sánh bảng số dư sửa tại chỗ với kho sự kiện về câu hỏi kiểm toán", "Đếm số sự kiện phải đọc khi kho lớn gấp 1 000 lần, có và không có bản chụp", "Viết hàm phát lại có bản chụp và sự kiện bù"]
    example: "Bốn sự kiện nạp 1000, rút 300, nạp 50, rút 120 phát lại ra số dư 1000, 700, 750, 630; sự kiện rút 500 ghi nhầm làm số dư còn 130, thêm sự kiện bù nạp 500 rồi rút 50 đúng thì còn 580 và kho có 7 sự kiện; bộ chiếu mới xử lý 2 trên 3 sự kiện thì mô hình đọc trả 700 thay vì 750; dựng số dư từ 10³ và 10⁶ sự kiện phải đọc đúng ngần ấy sự kiện, còn bản chụp mỗi 1 000 sự kiện thì chỉ đọc 500 sự kiện ở n = 2 500 và n = 2 500 500 (Python + sqlite chạy thật, VER BNX:L29)"
    fix: ["Kho sự kiện sửa được thì không còn là bằng chứng", "Mô hình đọc chạy sau kho nên có thể trả số cũ; lệnh cần số chính xác phải đọc từ kho", "Bản chụp phải gắn phiên bản quy tắc, đổi quy tắc thì dựng lại"]
  - id: L30
    title: "Chịu lỗi bằng mã: thử lại, cầu dao, vách ngăn, giới hạn tốc độ và cân bằng tải"
    spec: lessons/bnx/L30_chiu_loi_cau_dao_can_bang_tai.yaml
    requires: ["L29"]
    requires_ext: ["BNK:L01", "BNK:L07"]
    objectives: ["Tính tổng thời gian chờ của thử lại có lùi theo luỹ thừa 2 và nói khi nào thử lại có hại", "Đọc chuỗi trạng thái của cầu dao ba trạng thái theo đồng hồ giả và đếm cuộc gọi bị chặn", "So sánh cầu dao tự cài với Resilience4j thật: cùng ba trạng thái, khác cách đếm hỏng", "Giải thích vách ngăn bằng bộ đếm chỗ giới hạn số cuộc gọi đồng thời", "Tính số yêu cầu nhận và từ chối của giới hạn tốc độ kiểu xô token", "So sánh chia xoay vòng với chia cho máy ít kết nối nhất", "Viết cầu dao nhỏ với đồng hồ giả"]
    example: "Thử lại gốc 100 ms nhân đôi mỗi lần: hỏng 2 lần thì thành công ở lần 3 sau 100 + 200 = 300 ms, hỏng cả 4 lần thì chờ 100 + 200 + 400 = 700 ms; cầu dao ngưỡng 3 hỏng liên tiếp, chờ 1 000 ms: gọi mỗi 500 ms trong 9 lần thì 7 cuộc gọi thật và 2 cuộc bị chặn; xô token dung tích 5, nạp 2/giây: 12 yêu cầu cùng lúc nhận 5 từ chối 7, sau 1 giây nhận 2; 100 yêu cầu thử lại 3 lần thành 400 cuộc gọi, 10 000 yêu cầu thành 40 000, có cầu dao chỉ 12 (Java 21 chạy thật và Resilience4j 2.3.0, VER BNX:L30)"
    fix: ["Thử lại không lùi và không giới hạn làm tăng tải lên dịch vụ đang hỏng", "Chỉ thử lại lệnh đọc hoặc lệnh ghi có khoá lũy đẳng", "Mỗi dịch vụ phụ thuộc cần cầu dao và vách ngăn riêng"]
  - id: L31
    title: "Quan sát hệ thống: nhật ký có cấu trúc, ELK, Prometheus, Grafana và cảnh báo"
    spec: lessons/bnx/L31_quan_sat_nhat_ky_chi_so_canh_bao.yaml
    requires: ["L30"]
    requires_ext: ["BNK:L10"]
    objectives: ["Viết nhật ký có cấu trúc kèm mã tương quan và dựng lại đường đi của một yêu cầu qua ba dịch vụ", "So sánh số dòng phải xem khi quét hết nhật ký với khi dùng chỉ mục đảo ở 1 000 và 1 000 000 dòng", "Đọc văn bản chỉ số của Prometheus và nói vì sao nhãn quyết định số chuỗi", "Tính tỉ lệ lỗi và kiểm luật cảnh báo bằng công cụ promtool", "Tính tốc độ đốt ngân sách lỗi và số ngày cạn ngân sách", "Đếm số chuỗi và dung lượng một lần kéo số liệu khi nhãn có 1, 100 và 10 000 giá trị", "Mô tả đường đi từ ứng dụng tới bảng điều khiển và cảnh báo trong chuỗi quan sát", "Viết lại phép dựng đường đi và tính tốc độ đốt trên số liệu mới"]
    example: "Nhật ký JSON với mã tương quan: yêu cầu a1 đi cong > tt > sc > cong mất 35 ms (đồng hồ giả); chỉ mục đảo mô phỏng: 1 000 dòng xét 2 dòng, 1 000 000 dòng xét 2 000 dòng (quét hết: 1 000 và 1 000 000); văn bản chỉ số 5, 401, 40 001 chuỗi và 324, 24 287, 2 495 695 byte khi nhãn user có 0, 100, 10 000 giá trị; Prometheus 3.16.0 thật kéo được trang chỉ số (up = 1, tổng lỗi 30, tỉ lệ 30/6 000 = 0,005); tốc độ đốt 0,005 / 0,001 = 5, ngân sách 30 ngày cạn sau 6 ngày; promtool test rules SUCCESS (số minh hoạ, Python/Java/Docker chạy thật, VER BNX:L31)"
    fix: ["Nhật ký không có mã tương quan thì không ghép được các dòng của một yêu cầu qua nhiều dịch vụ", "Nhãn nhiều giá trị (mã người dùng, mã giao dịch) làm số chuỗi chỉ số nhân lên; thông tin theo người để ở nhật ký", "Cảnh báo theo số tuyệt đối ồn khi tải cao, lỡ khi tải thấp; dùng tỉ lệ hoặc tốc độ đốt ngân sách lỗi"]
  - id: L32
    title: "GitOps và bí mật: vòng đối chiếu, Argo CD, Vault và AWS tối thiểu"
    spec: lessons/bnx/L32_gitops_bi_mat_aws_toi_thieu.yaml
    requires: ["L31"]
    requires_ext: ["BNK:L13"]
    objectives: ["Dựng vòng đối chiếu giữa trạng thái mong muốn trong Git và trạng thái thật rồi đọc việc phải làm sau mỗi lần chốt", "Giải thích hai công tắc tự xoá và tự chữa của đồng bộ tự động và vì sao mặc định tắt", "Đọc lệnh và kết quả chạy kho bí mật ở chế độ phát triển: ghi hai phiên bản, đọc lại phiên bản cũ và cấp thẻ chỉ đọc có hạn", "Đọc kết quả đánh giá chính sách quyền: mặc định từ chối và từ chối rõ ràng thắng cho phép", "Đếm số lần gọi Git của vòng đối chiếu đọc từng tệp và đọc một lần ở 10 và 200 ứng dụng", "Tính cửa sổ lộ của bí mật tĩnh và của thẻ có hạn", "Mô tả vai trò của mạng ảo riêng, quản lý quyền, kho đối tượng và cơ sở dữ liệu quản lý sẵn trong một backend tối thiểu", "Viết vòng đối chiếu nhỏ có cờ tự xoá trên số liệu mới"]
    example: "Vòng đối chiếu (Python + git thật, cụm là từ điển mô phỏng): lần chốt đầu tạo 2 dịch vụ; sửa tay số bản sao 3 → 9 khi tắt tự chữa chỉ báo lệch 1, bật tự chữa thì sửa về 3; đổi ảnh v1.4 → v1.5 rồi hoàn tác về v1.4; xoá tệp trong Git khi chưa bật prune còn lệch 1, bật prune thì xoá; đọc trạng thái mong muốn từng tệp gọi git 1 + n lần (11 ở 10 ứng dụng, 201 ở 200) so với 2 lần khi đọc một lần; Vault 2.2.2 dev chạy thật: 2 phiên bản (xyz789, abc123), thẻ chỉ đọc sống 4 giây đọc được, ghi bị từ chối, sau 6 giây đọc bị từ chối; cửa sổ lộ 90 × 24 = 2 160 giờ so với 1 giờ; đánh giá quyền mô phỏng: cho phép / từ chối mặc định / Deny thắng Allow (Argo CD và AWS không chạy, số minh hoạ, VER BNX:L32)"
    fix: ["Bí mật để trong kho Git thì xoá ở lần chốt sau vẫn còn trong lịch sử; phải đổi bí mật đã lộ", "Tự xoá (prune) và tự chữa (selfHeal) mặc định tắt; bật vội thì xoá nhầm một tệp thành xoá dịch vụ thật", "Vòng đối chiếu gọi Git một lần cho mỗi tệp gãy khi số ứng dụng tăng; đọc một lần luôn 2 lần"]
  - id: L33
    title: "Hệ cũ: Servlet, JSP, Tomcat, JBoss"
    spec: lessons/bnx/L33_he_cu_servlet_jsp_tomcat.yaml
    requires: ["L32"]
    requires_ext: ["JVA:L11"]
    objectives: ["Đọc một Servlet tối thiểu và vòng đời init một lần, service nhiều lần, destroy một lần trên Tomcat nhúng", "Đọc nội dung một gói war và tệp web.xml khai báo Servlet", "Mô tả cách trang JSP được dịch thành Servlet ở yêu cầu đầu và đếm tệp sinh ra", "Xác định lỗi biên dịch của tên gói javax.servlet với Tomcat 10 và sửa sang jakarta.servlet", "Tính thông lượng và số lượt chờ của bể luồng", "Đo số cuộc xử lý đồng thời tối đa của bể 4 luồng khi có 4, 40 và 200 yêu cầu cùng lúc", "Phân biệt bộ chứa Servlet như Tomcat với máy chủ ứng dụng đầy đủ như JBoss hoặc WildFly", "Viết bộ chứa tí hon có vòng đời init, service, destroy bằng Java thuần"]
    example: "Tomcat nhúng 10.1.61 chạy thật: gói .war có 6 mục (WEB-INF/web.xml, WEB-INF/classes/Chao.class); ba yêu cầu thì init chạy 1 lần, bộ đếm 1, 2, 3 (một thể hiện), destroy 1 lần; trang JSP sinh 0 → 2 tệp (chao_jsp.java, chao_jsp.class) ở yêu cầu đầu, lớp kế thừa HttpJspBase; Servlet viết theo javax.servlet báo package javax.servlet.http does not exist, đổi sang jakarta.servlet thì biên dịch được; bể 4 luồng: 4, 40, 200 yêu cầu cùng lúc đều tối đa 4 đồng thời, thời gian ≥ 100, 1 000, 5 000 ms; thông lượng 200 / 0,5 = 400 và 8 / 0,25 = 32 yêu cầu mỗi giây (JBoss/WildFly không chạy, số minh hoạ, VER BNX:L33)"
    fix: ["Servlet viết theo javax.servlet không biên dịch với Tomcat 10 trở lên; đổi sang jakarta.servlet", "Chỉ có một thể hiện Servlet cho mọi yêu cầu: không để dữ liệu từng khách vào trường của lớp", "Việc chậm không có hạn chót chiếm dần bể luồng; số cuộc xử lý đồng thời không vượt quá số luồng"]
  - id: L34
    title: "Phê duyệt tín dụng: máy trạng thái, quyền duyệt và tra lịch sử có đồng ý"
    spec: lessons/bnx/L34_he_thong_phe_duyet_tin_dung.yaml
    requires: ["L33"]
    requires_ext: ["BNK:L04", "BNK:L10"]
    objectives: ["Chạy máy trạng thái hồ sơ vay từ khởi tạo tới giải ngân và chặn chuyển trạng thái không hợp lệ", "Xác định người có quyền duyệt theo tổng dư nợ của khách và tách người tạo khỏi người duyệt", "So sánh hồ sơ vay cá nhân với hồ sơ doanh nghiệp về bậc duyệt, nguồn trả nợ và dư nợ cần gộp", "Chạy tra cứu lịch sử tín dụng chỉ khi có đồng ý còn hạn đúng mục đích và ghi nhật ký mọi lần tra", "Kiểm nhật ký chuyển trạng thái bằng cách dựng lại trạng thái cuối và đếm cạnh sai", "Đo số dòng phải đọc khi tra lịch sử có và không có chỉ mục ở 1 000 và 1 000 000 dòng", "Viết hàm chọn người duyệt, hàm chặn chuyển trạng thái và hàm tra cứu có đồng ý trên số liệu mới"]
    example: "Khách xin 270 triệu chia thành ba hồ sơ 90: xét riêng đều tới chuyên viên (bậc ≤ 100), theo tổng 90, 180, 270 thì cần chuyên viên, trưởng phòng, trưởng phòng; cá nhân xin 80, 300, 900 cần chuyên viên, trưởng phòng, hội đồng, doanh nghiệp 3 000 cần giám đốc khối; máy trạng thái 7 lần thử: 5 hợp lệ và 2 bị chặn (nhảy cóc, quay lui), kết thúc GIAI_NGAN; 5 ca tra lịch sử: 1 cho phép (nhóm cao nhất 2), 4 từ chối (không có đồng ý, hết hạn, đã thu hồi, sai mục đích), nhật ký đủ 5 dòng; tra một khách đọc 1 000 và 1 000 000 dòng khi không có chỉ mục nhưng chỉ 5 dòng khi có (Python + sqlite chạy thật, số minh hoạ, VER BNX:L34)"
    fix: ["Quyền duyệt tính trên tổng dư nợ cũ và mới; xét từng hồ sơ riêng lẻ để khách chia nhỏ là lách được", "Luật chuyển trạng thái là một bảng kiểm được; ghi kèm điều kiện trạng thái cũ để hai người không cùng duyệt", "Tra lịch sử cần đồng ý đúng mục đích, còn hạn, chưa thu hồi; ghi nhật ký cả lần từ chối và không ghi nội dung nhạy cảm"]
  - id: L35
    title: "Vận hành: hỗ trợ mức 3, SLA/OLA, phiếu sự cố và bản thiết kế"
    spec: lessons/bnx/L35_van_hanh_sla_tai_lieu.yaml
    requires: ["L34"]
    requires_ext: ["BNK:L13", "BNK:L14"]
    objectives: ["Tính ngân sách phút ngừng của mục tiêu sẵn sàng 99%, 99,9%, 99,95% và 99,99%", "Phân biệt chỉ số, mục tiêu, thoả thuận mức dịch vụ và thoả thuận nội bộ bằng ví dụ có số", "Tính độ sẵn sàng chung của các dịch vụ nối tiếp và nói vì sao chuỗi dài làm tụt", "Xác định một tháng có vượt ngân sách hay không từ danh sách sự cố", "Phân loại sự cố theo mức và nêu việc hỗ trợ mức 3 phải làm cùng nội dung phiếu sự cố", "Viết bản thiết kế theo khung bối cảnh, quyết định, hệ quả và tự chấm bằng danh mục kiểm", "Đếm độ sẵn sàng của chuỗi 1, 100 và 10 000 dịch vụ", "Tính tay ngân sách SLA, độ sẵn sàng chuỗi và dựng khung bản thiết kế trên số liệu mới"]
    example: "Tháng 30 ngày có 43 200 phút: mục tiêu 99%, 99,9%, 99,95%, 99,99% cho phép ngừng tối đa 432, 43,2, 21,6, 4,32 phút; ba dịch vụ nối tiếp 99,95%, 99,9%, 99,9% cho 99,7502%; thoả thuận nội bộ của hai đội 99,95% và 99,95% nhân nhau 0,99900025 đủ giữ thoả thuận 99,9% với khách; ca phân loại: tra số dư chậm với 15% yêu cầu báo lúc 09:10 là P2, hạn 30 phút nên phản hồi trước 09:40; ba sự cố 12 + 30 + 5 = 47 phút vượt ngân sách 43,2 phút của 99,9% một khoảng 3,8 phút; chuỗi 1, 100, 10 000 dịch vụ 99,9% còn 99,9%, 90,4792%, 0,0045%; bản ghi quyết định mẫu đạt danh mục kiểm, bản xấu báo 5 lỗi (Python chạy thật, số minh hoạ, VER BNX:L35)"
    fix: ["99,9% vẫn cho phép hàng chục phút ngừng mỗi tháng; luôn đổi phần trăm sang phút", "Dịch vụ nối tiếp nhân độ sẵn sàng nên chuỗi dài luôn thấp hơn mắt xích yếu nhất", "Cam kết ngoài không được cao hơn tích các cam kết trong"]
  - id: L36
    title: "Phỏng vấn thiết kế hệ thống: trung tâm thanh toán, hệ thống tín dụng, đọc tiếng Anh kỹ thuật"
    spec: lessons/bnx/L36_phong_van_thiet_ke_he_thong.yaml
    requires: ["L35"]
    requires_ext: ["BNK:L03", "BNK:L08"]
    objectives: ["Tính ước lượng giao dịch mỗi giây, dung lượng và số nút ghi ở cỡ ×1, ×100 và ×10 000 bằng mã", "Thiết kế trung tâm thanh toán theo khung sáu bước và áp cùng khung cho hệ thống tín dụng", "Chạy khoá lũy đẳng và chỉ ra khác biệt khi gửi hai lần có và không có khoá", "Kiểm ước lượng bằng phân số và kiểm tổng tiền qua các lần gửi", "Đếm số lệnh lệch và giờ xử lý tay ở 1 000 và 100 000 lệnh", "Đọc 10 câu tiếng Anh kỹ thuật, áp bốn bước vào hai câu và chạy bộ lọc chữ báo mức ràng buộc trên cả 10 câu", "Chọn thành phần theo cỡ tải và nêu cái được, cái mất", "Viết chương trình ước lượng tải, chọn thành phần và khoá lũy đẳng trên số liệu mới"]
    example: "Với số minh hoạ 100 000 khách, 2 giao dịch mỗi khách mỗi ngày, hệ số đỉnh 10, 500 byte mỗi giao dịch, mỗi nút ghi chịu 2 000 giao dịch mỗi giây: cỡ ×1 là 200 000 giao dịch mỗi ngày, trung bình 2,3 mỗi giây, đỉnh 23, 0,1 GB mỗi ngày, 1 nút; cỡ ×100 là 20 triệu, 231,5, 2 315, 10 GB, 2 nút; cỡ ×10 000 là 2 tỉ, 23 148,1, 231 481, 1 000 GB, 116 nút; gửi hai lần lệnh chuyển 300 từ tài khoản A (1 000) sang B: không có khoá thì A còn 400, B 600, có khoá thì A 700, B 300, cùng khoá khác nội dung bị báo xung đột; cứ 500 lệnh hỏng 1 bước ghi có thì 1 000 lệnh lệch 2 (0,3 giờ xử lý tay) và 100 000 lệnh lệch 200 (33,3 giờ); bộ lọc chữ báo mức trên 10 câu tiếng Anh kỹ thuật thấy 1 câu cấm kèm bắt buộc, 1 bắt buộc, 2 nên, 6 mô tả (Python + sqlite chạy thật, số minh hoạ, VER BNX:L36)"
    fix: ["Ước lượng trước khi vẽ: số ở một cỡ không dùng được cho cỡ gấp trăm lần, vì số nút và cách chia dữ liệu đổi theo cỡ", "Thử lại lệnh chuyển tiền phải có khoá lũy đẳng lưu cùng giao dịch ghi sổ; cùng khoá khác nội dung thì từ chối", "Tỉ lệ lỗi không đổi nhưng số lệnh lệch tăng theo tải, nên đối soát phải tự động"]
  - id: L37
    title: "T-SQL và JDBC: XACT_ABORT, chống chèn mã, kết nối an toàn"
    spec: lessons/bnx/L37_tsql_jdbc_xact_abort_chen_ma.yaml
    requires: ["L36"]
    requires_ext: ["BNX:L06"]
    objectives: ["Viết thủ tục chuyển tiền có tham số vào và ra bằng T-SQL và chạy trên SQL Server 2022", "Nêu và đo tổng tiền khi một lỗi xảy ra giữa giao dịch với XACT_ABORT tắt và bật", "Hoàn tác khi lỗi bằng khối TRY…CATCH có ROLLBACK và THROW", "Đếm số dòng lộ ra khi ghép chuỗi và khi tham số hoá, ở bảng 2, 200 và 20 000 dòng", "Gọi thủ tục từ Java bằng CallableStatement và đọc tham số ra", "Mở kết nối an toàn: đóng bằng try-with-resources, lấy mật khẩu từ biến môi trường, tham số hoá bằng PreparedStatement", "Chọn cách chặn chèn mã theo tình huống và nêu cái được, cái mất", "Viết hàm tìm tài khoản theo tên bằng ghép chuỗi và bằng tham số, rồi so số dòng với chuỗi tấn công"]
    example: "SQL Server 2022 (RTM-CU27-GDR 16.0.4315.2) chạy thật: hai tài khoản A 300 000, B 1 000 000; thủ tục T-SQL chuyển 500 000 báo lỗi 50001, hoàn tác, tổng giữ 1 300 000; chuyển 200 000 thì OK, A 100 000, B 1 200 000, tổng 1 300 000; cùng lỗi giữa giao dịch: XACT_ABORT tắt (mặc định) cho tổng 1 800 000, bật cho 1 300 000; chuỗi X' OR '1'='1 ghép vào câu lệnh lộ 2, 200, 20 000 dòng ở bảng 2, 200, 20 000 dòng, truyền tham số lộ 0 dòng; Java 21 + ojdbc 23.26.4.0.0 gọi thủ tục Oracle qua CallableStatement: 500 000 báo mã 20001, 200 000 trả OK, PreparedStatement trả 1 dòng cho tên A và 0 dòng cho chuỗi tấn công (VER BNX:L37)"
    fix: ["Mặc định SQL Server không hoàn tác cả giao dịch khi một câu lệnh lỗi; bật SET XACT_ABORT ON và để khối CATCH hoàn tác rồi THROW lại", "Chuỗi người dùng gõ phải đi qua tham số (sp_executesql, PreparedStatement), không ghép vào câu lệnh; tên bảng, tên cột dùng danh sách cho phép", "Mật khẩu lấy từ biến môi trường, không viết trong mã; kết nối mở bằng try-with-resources để tự đóng"]
  - id: L38
    title: "Hàng đợi AQ, bộ nhớ cột và phân mảnh Oracle"
    spec: lessons/bnx/L38_oracle_hang_doi_bo_nho_cot_phan_manh.yaml
    requires: ["L37"]
    requires_ext: ["BNX:L07"]
    objectives: ["Tạo hàng đợi trong Oracle, gửi và nhận thông điệp trong giao dịch và chỉ ra thông điệp gửi rồi hoàn tác không còn trong hàng đợi", "Nêu khác biệt của hàng đợi trong cơ sở dữ liệu so với Kafka và chọn một trong hai theo nhu cầu", "Đọc thuộc tính INMEMORY của bảng và vùng nhớ cột trên Oracle, rồi nêu khi nào bộ nhớ cột đáng dùng", "Đếm số ô phải đọc khi lưu theo hàng và theo cột ở 1 000 và 100 000 dòng", "Đếm số lệnh chuyển xuyên mảnh ở 1, 3 và 30 mảnh và nêu khi nào cần phân mảnh", "Kiểm kết quả hàng đợi bằng mô hình đếm cùng chuỗi thao tác", "Viết hàng đợi có giao dịch và hàm đếm lệnh chuyển xuyên mảnh trên số liệu mới"]
    example: "Hàng đợi Oracle: gửi 101 rồi hoàn tác, gửi 102 rồi chốt thì bảng còn 1 thông điệp (2 − 1); nhận 102 (200 000) rồi chốt thì còn 0; INMEMORY_SIZE = 0 và bảng được đánh dấu ENABLED nên chưa đo được tốc độ; bảng 8 cột: 1 000 dòng đọc theo hàng 8 000 ô, theo cột 1 000 ô, 100 000 dòng đọc 800 000 ô và 100 000 ô; 60 tài khoản (3 540 cặp chuyển có thứ tự), mảnh = mã chia lấy dư: 1, 3, 30 mảnh cho 0, 2 400, 3 480 lệnh xuyên mảnh; đổi từ 3 sang 4 mảnh làm 748 trong 1 000 tài khoản đổi mảnh (Oracle Free 23 + Python chạy thật, số minh hoạ, VER BNX:L38)"
    fix: ["Hàng đợi trong cơ sở dữ liệu chung giao dịch với dữ liệu (hoàn tác thì thông điệp mất) và mặc định nhận xong là rời hàng, khác Kafka", "Đánh dấu INMEMORY chưa làm báo cáo nhanh hơn: phải có vùng nhớ cột (INMEMORY_SIZE > 0) và phải đo trên tải thật", "Phân mảnh là nhiều cơ sở dữ liệu riêng: càng nhiều mảnh càng nhiều lệnh xuyên mảnh đắt, và chia lấy dư làm thêm mảnh đổi chỗ phần lớn dữ liệu"]
