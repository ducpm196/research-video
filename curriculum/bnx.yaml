    fix: ["Trang trong AEM là dữ liệu trong kho nội dung, không phải tệp HTML trên đĩa", "Sling chọn mã dựng trang theo kiểu tài nguyên, không theo đường dẫn", "Gói ở trạng thái RESOLVED chưa chạy; phải ACTIVE mới cung cấp dịch vụ"]
  - id: L23
    title: "Từ scikit-learn tới ONNX Runtime: rừng cô lập cho phát hiện bất thường"
