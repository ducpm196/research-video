    example: "CRC16 của khoá foo chia lấy dư cho 16384 được 12182; cụm ba nút chia khe 0–5460, 5461–10922, 10923–16383 nên foo nằm ở nút thứ ba; mã giao dịch đặt hạn 60 giây: gửi lại ở giây 30 bị từ chối, ở giây 61 được nhận; mã truy cập còn 240 giây thì mục danh sách đen đặt hạn 240 giây (chạy thật Redis trong Docker, VER BNX:L19)"
