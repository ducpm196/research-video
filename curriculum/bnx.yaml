    example: "Thu nhập 20 triệu, đang trả 4 triệu mỗi tháng, khoản mới trả 5 triệu: tỉ lệ nghĩa vụ trên thu nhập = 9/20 = 45%, dưới ngưỡng minh hoạ 50% nên qua; thẻ điểm ba đặc trưng 35 + 25 + 20 = 80 điểm, ngưỡng duyệt minh hoạ 70; đổi một ký tự của hợp đồng thì mã băm SHA-256 khác và chữ ký không còn khớp (số minh hoạ, VER BNX:L21)"
