    requires: [L21]
    requires_ext: ["BNK:L02"]
    objectives: ["Đọc một cây nội dung JCR gồm nút và thuộc tính", "Lần theo cách Sling đổi một đường dẫn thành tài nguyên rồi chọn tệp dựng trang", "Đọc một đoạn HTL và nói vì sao nó tự thoát ký tự theo ngữ cảnh", "Kể vòng đời của một gói OSGi và vai trò của dịch vụ", "So sánh số nút phải đọc khi tìm theo thuộc tính có và không có chỉ mục ở 10, 1 000 và 100 000 trang", "Tìm tài nguyên và tệp dựng cho một địa chỉ trong một kho nhỏ bằng mã Python"]
