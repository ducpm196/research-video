# Giáo án Khoá BNX · Backend ngân hàng mở rộng theo JD (16 bài, lập 2026-11-11, đợt LF1)
# Căn cứ phạm vi (OBSERVED 2026-11-11, audit/review/learn_full/plan_LF1.md §0): quét chữ trong 656 đặc tả bài thì 0 bài nói về JWT, OIDC, OpenAPI/Swagger,
#   gRPC, Protobuf, Elasticsearch, Couchbase, SWIFT, ví điện tử, thuế điện tử, RabbitMQ, Oracle AQ, DDD, Open Banking; T-SQL chỉ được nhắc (DBS L17); chưa có bài Git.
#   Các chủ đề này đều có trong JD (resources/job/JD.md: tin Software Engineer acbjobs.com.vn — Stored Procedure Oracle/MS SQL bắt buộc, Swagger, gRPC,
#   Couchbase, Elasticsearch, Kafka/RabbitMQ/ActiveMQ, tính năng Oracle mới; điểm cộng Git/Docker, thanh toán quốc tế, ngoại tệ, ví điện tử, thuế điện tử;
#   tin Back-end Lead: DDD, API Gateway, Open Banking, Kubernetes, CI/CD).
# Không lặp khoá khác: PKCE đã dạy ở WEB L09, BM25 ở DEN L07, tiến hoá lược đồ ở EVT L01, cập nhật cuốn chiếu ở CLD L08, thùng token ở SAR L07 — bài BNX
#   nhắc lại ngắn trong cảnh ôn nền rồi đi tiếp vào phần JD hỏi. Tiên quyết chỉ trong JVA, BNK, BNX để khoá đứng ngay sau BNK trong lộ trình (HOC_TAP chặng 3).
# Nguồn: audit/bnx/sources.md (mã [CBPR], [ND52], [TT40], [TT41], [TT64], [TT19], RFC…). Mã trên màn hình chạy thật khi máy có công cụ: git, Python, openssl,
#   Oracle Database Free 23 và SQL Server 2022 trong Docker (audit/bnx/dbrun.py). Số liệu ví dụ: VER BNX:Lxx ở audit/verify_plan_curricula.py; kiểm bài ở audit/bnx/verify_bnx.py.
# Thứ tự học: L00 công cụ; L01–L02 hợp đồng API; L03–L05 xác thực giữa người và dịch vụ; L06–L07 Oracle và SQL Server; L08–L10 kho dữ liệu và hàng đợi khác;
#   L11–L12 nghiệp vụ JD; L13 triển khai; L14 kiến trúc cho Lead; L15 tình huống chuyên gia.
course: BNX
profile: stem
status: active
lessons:
  - id: L00
    title: "Git: lưu lịch sử, tạo nhánh, gộp và giải xung đột"
    spec: lessons/bnx/L00_git_nhanh_gop_xung_dot.yaml
    requires: []
    requires_ext: ["JVA:L12", "PYT:L07"]
    objectives: ["Tạo kho, ghi một commit và đọc lịch sử", "Tạo nhánh, gộp nhánh và đọc đồ thị commit", "Đọc dấu xung đột và giải xung đột bằng tay", "Nêu vì sao bí mật đã commit vẫn còn trong lịch sử", "Đếm số xung đột khi nhiều nhánh cùng sửa một dòng, đo thật ở 2, 10 và 50 nhánh", "Tự viết chuỗi lệnh tạo kho, hai nhánh cùng sửa một dòng, giải xung đột và đếm lịch sử"]
    example: "Hai nhánh cùng sửa dòng phí 5500 thành 6600 và 4400: gộp báo xung đột, tệp có ba dấu mốc <<<<<<<, =======, >>>>>>>; sửa tay rồi commit thì commit gộp có 2 cha; mã commit là 40 ký tự thập lục phân (VER BNX:L00)"
    fix: ["Git lưu ảnh chụp cây tệp có mã băm, không chỉ lưu “phần thay đổi”", "Xung đột không phải Git hỏng: hai người sửa cùng chỗ, người phải quyết", "Xoá mật khẩu ở commit sau không xoá nó khỏi lịch sử; phải đổi mật khẩu"]
  - id: L01
    title: "OpenAPI (Swagger): đặc tả API là hợp đồng, viết trước khi viết mã"
    spec: lessons/bnx/L01_openapi_hop_dong_api.yaml
    requires: [L00]
    requires_ext: ["BNK:L03"]
    objectives: ["Đọc một đặc tả OpenAPI 3: đường dẫn, phương thức, thân yêu cầu, phản hồi, lược đồ", "Kiểm một yêu cầu theo lược đồ và chỉ ra trường sai", "Phân biệt thay đổi tương thích và thay đổi phá vỡ hợp đồng", "Nêu lợi ích của cách làm hợp đồng trước", "Đếm số yêu cầu sai bị chặn ở cửa kiểm lược đồ khi lưu lượng tăng từ 1 000 lên 100 000 yêu cầu", "Tự viết hàm kiểm một yêu cầu theo lược đồ và chạy năm yêu cầu thử"]
    example: "Lược đồ chuyển khoản: số tài khoản 10–19 chữ số, số tiền nguyên ≥ 1; ba yêu cầu thử cho 1 hợp lệ, 1 sai số tiền 0, 1 thiếu tài khoản nhận (VER BNX:L01)"
    fix: ["Swagger là bộ công cụ, OpenAPI là chuẩn đặc tả", "Đặc tả không tự kiểm dữ liệu: phải bật kiểm lược đồ ở máy chủ", "Thêm trường bắt buộc vào yêu cầu là thay đổi phá vỡ"]
  - id: L02
    title: "gRPC và Protocol Buffers: bản tin nhị phân, số hiệu trường và hạn chót"
    spec: lessons/bnx/L02_grpc_protobuf.yaml
    requires: [L01]
    objectives: ["Mã hoá một bản tin Protocol Buffers bằng tay: khoá trường và số nguyên biến độ dài", "So kích thước với JSON", "Nêu vì sao không được đổi số hiệu trường", "Truyền hạn chót qua chuỗi lời gọi", "Đo tổng byte của bản tin nhị phân so với JSON khi số bản tin tăng từ 1 000 lên 100 000", "Tự mã hoá một bản tin ba trường bằng Python và so với kết quả mong đợi"]
    example: "Trường số 1 mang 150 mã hoá thành 3 byte 08 96 01, JSON {\"id\":150} dài 10 byte; hạn chót 2 giây qua ba dịch vụ mỗi dịch vụ 800 ms thì dịch vụ thứ ba hết giờ (VER BNX:L02)"
    fix: ["gRPC không “luôn nhanh hơn REST”: lợi ở bản tin nhỏ, luồng, hợp đồng chặt", "Xoá trường thì giữ số hiệu bằng reserved, không dùng lại", "Không có hạn chót thì lời gọi treo kéo theo cả chuỗi"]
  - id: L03
    title: "JWT: mã truy cập tự mang thông tin, chữ ký HMAC và hạn dùng"
    spec: lessons/bnx/L03_jwt_chu_ky_han_dung.yaml
    requires: [L01]
    objectives: ["Tách và giải mã ba phần của một JWT", "Tính lại chữ ký HS256 và phát hiện phần thân bị sửa", "Kiểm hạn dùng, người phát hành và người nhận", "Nêu cách thu hồi khi mã tự mang thông tin", "Đo số lần kẻ gian dùng được mã bị lộ với hạn 300 giây và 3 600 giây, và số mã mới mỗi giờ khi số người dùng tăng", "Tự viết hàm ký và hàm kiểm một JWT HS256 rồi chạy năm ca thử"]
    example: "Ví dụ HS256 của RFC 7515 Phụ lục A.1 tính lại ra chữ ký dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk; sửa một ký tự phần thân thì chữ ký không khớp; exp = 1300819380 là năm 2011, đã hết hạn (VER BNX:L03)"
    fix: ["JWT được ký chứ không được mã hoá: ai cầm mã cũng đọc được phần thân", "Máy chủ cố định thuật toán, không tin trường alg của mã gửi tới", "Mã tự mang thông tin khó thu hồi: hạn ngắn và mã làm mới"]
  - id: L04
    title: "OAuth 2.0 và OpenID Connect: ai cấp mã, ai kiểm mã, phạm vi quyền"
    spec: lessons/bnx/L04_oauth2_openid_connect.yaml
    requires: [L03]
    objectives: ["Gọi tên bốn vai trong OAuth 2.0", "Chọn luồng cấp mã: mã ủy quyền có PKCE cho ứng dụng, thông tin máy khách cho dịch vụ với dịch vụ", "Kiểm phạm vi quyền và người nhận của mã truy cập", "Phân biệt mã truy cập với mã định danh của OpenID Connect", "So số lần xin mã và số lần hỏi lại máy chủ ủy quyền ở 10, 1 000 và 100 000 máy khách", "Mô phỏng số lần xin mã trong một giờ và tìm giây cuối cùng một mã còn được nhận"]
    example: "Mã có phạm vi accounts:read gọi API cần payments:write bị từ chối 403; mã cấp cho người nhận api-a bị api-b từ chối; mã hạn 300 giây, cho lệch đồng hồ 60 giây thì giây 359 còn nhận, từ giây 360 bị từ chối, đúng quy tắc RFC 7519 “từ đúng thời điểm hết hạn trở đi thì không nhận” (VER BNX:L04)"
    fix: ["OAuth 2.0 là ủy quyền, không phải đăng nhập; đăng nhập là OpenID Connect", "Không dùng mã định danh để gọi API", "Không đặt bí mật máy khách trong ứng dụng di động"]
  - id: L05
    title: "mTLS: hai bên cùng trình chứng chỉ khi các dịch vụ gọi nhau"
    spec: lessons/bnx/L05_mtls_chung_chi_hai_chieu.yaml
    requires: [L04]
    objectives: ["Phân biệt TLS một chiều và hai chiều", "Kiểm một chứng chỉ khách: chuỗi tin cậy, hạn dùng, tên", "Đọc lỗi bắt tay khi thiếu hoặc sai chứng chỉ", "Lên kế hoạch xoay vòng chứng chỉ trước khi hết hạn", "So số lần đổi chứng chỉ mỗi năm ở 10, 1 000 và 100 000 dịch vụ với hạn 365 và 30 ngày", "Tính ngày xoay, ngày hết hạn và trạng thái của một danh sách chứng chỉ"]
    example: "Máy chủ đòi chứng chỉ khách, chạy thật bằng openssl và Python: không có chứng chỉ thì bắt tay thất bại; chứng chỉ do nơi cấp khác ký thì thất bại; chứng chỉ đúng thì thành công (VER BNX:L05)"
    fix: ["mTLS xác thực máy, không thay phân quyền theo người dùng", "Chứng chỉ hết hạn là sự cố có lịch hẹn trước: theo dõi ngày hết hạn", "Không tắt kiểm chứng chỉ để “chạy tạm”"]
  - id: L06
    title: "Thủ tục lưu trữ trên Oracle: tham số, giao dịch và bắt lỗi"
    spec: lessons/bnx/L06_thu_tuc_luu_tru_plsql_tsql.yaml
    requires: [L00]
    requires_ext: ["BNK:L05"]
    objectives: ["Viết thủ tục chuyển tiền có tham số vào và ra bằng PL/SQL", "Hoàn tác khi lỗi bằng khối bắt lỗi PL/SQL và nhận ra lỗi bị nuốt", "Khoá hai tài khoản theo một thứ tự cố định", "So số câu lệnh gửi tới cơ sở dữ liệu khi logic nằm ở ứng dụng (mô hình giản lược 5 câu mỗi lần) với khi gọi thủ tục, ở 10, 1 000 và 100 000 lần chuyển", "Viết hàm chuyển tiền có giao dịch và hoàn tác khi vi phạm ràng buộc số dư"]
    example: "Thủ tục chuyển tiền chạy thật trên Oracle Database Free 23 (banner Oracle AI Database 26ai Free 23.26.3): chuyển 500 000 khỏi tài khoản có 300 000 thì báo lỗi, hoàn tác, tổng tiền giữ 1 300 000; chuyển 200 000 thì thành công, tổng vẫn 1 300 000 (VER BNX:L06)"
    fix: ["Bắt lỗi rồi nuốt lỗi là che giấu tiền sai; phải hoàn tác và báo lên", "Lệnh chốt và hoàn tác trong thủ tục tác động lên cả giao dịch của người gọi, kể cả dòng người gọi ghi trước đó", "Hai lệnh khoá hai tài khoản ngược thứ tự thì bế tắc; luôn khoá theo mã tăng dần"]
  - id: L07
    title: "Oracle cho khối lượng lớn: phân vùng và JSON"
    spec: lessons/bnx/L07_oracle_phan_vung_json_hang_doi.yaml
    requires: [L06]
    objectives: ["Phân vùng bảng giao dịch theo tháng và đọc kế hoạch cắt tỉa phân vùng", "Lưu và truy vấn dữ liệu JSON trong Oracle", "So số dòng phải đọc khi cắt tỉa phân vùng với khi đọc cả bảng, ở 3 650, 365 000 và 36 500 000 dòng", "Lưu dữ liệu JSON có ràng buộc kiểm hợp lệ và truy vấn theo trường trong JSON (lab sqlite)"]
    example: "Bảng 12 phân vùng theo tháng; truy vấn một tháng chỉ đọc 1 phân vùng, kế hoạch thực thi ghi PARTITION RANGE SINGLE (chạy thật trên Oracle Database Free 23, VER BNX:L07)"
    fix: ["Phân vùng không làm mọi truy vấn nhanh hơn: truy vấn không lọc theo khoá phân vùng phải đọc mọi phân vùng", "Bọc cột phân vùng trong hàm (TRUNC) làm mất cắt tỉa phân vùng", "IS JSON mặc định ở chế độ lỏng; muốn đúng chuẩn dùng IS JSON (STRICT)", "Lệnh bỏ phân vùng tự chốt, không hoàn tác được"]
  - id: L08
    title: "Elasticsearch: chỉ mục ngược phân tán, mảnh, bản sao và độ tươi"
    spec: lessons/bnx/L08_elasticsearch_manh_ban_sao.yaml
    requires: [L01]
    objectives: ["Dựng chỉ mục ngược cho vài mô tả giao dịch", "Tính mảnh chứa một bản ghi từ khoá định tuyến", "Giải thích vì sao bản ghi vừa ghi chưa tìm thấy ngay", "Biết vì sao không dùng Elasticsearch làm nơi lưu số dư", "So sánh số bản ghi phải đọc và phải chép lại ở 1 200, 120 000 và 1 200 000 bản ghi"]
    example: "Chỉ mục 3 mảnh chính, mỗi mảnh 1 bản sao: 6 mảnh; mảnh = băm(khoá) mod 3; đổi thành 4 mảnh chính thì chỉ 3/12 = 25% bản ghi giữ mảnh cũ, nên phải tạo chỉ mục mới (VER BNX:L08)"
    fix: ["Elasticsearch không thay cơ sở dữ liệu giao dịch: không có giao dịch nhiều bản ghi", "Số mảnh chính không đổi tại chỗ được", "Ghi xong chưa tìm được ngay, chờ lần làm tươi"]
  - id: L09
    title: "Couchbase: bản ghi theo khoá, vBucket và giá trị CAS chống ghi đè"
    spec: lessons/bnx/L09_couchbase_vbucket_cas.yaml
    requires: [L08]
    objectives: ["Thiết kế khoá bản ghi cho hồ sơ khách hàng", "Tính vBucket của một khoá", "Dùng giá trị CAS để chặn mất cập nhật", "Đặt hạn sống cho bản ghi phiên", "So sánh tổng số lần ghi của CAS với khoá bi quan khi số tiến trình tranh chấp tăng 2, 20, 200"]
    example: "Hai tiến trình cùng đọc bản ghi có CAS = 7; tiến trình đầu ghi được và CAS đổi; tiến trình sau ghi với CAS = 7 bị từ chối, đọc lại rồi ghi: không mất cập nhật nào (số minh hoạ, VER BNX:L09)"
    fix: ["CAS không phải khoá: không chặn ai đọc, chỉ chặn ghi đè bản cũ", "Khoá bản ghi là cách truy cập chính: thiết kế khoá trước", "Kho bản ghi theo khoá không thay sổ cái"]
  - id: L10
    title: "Kafka nâng cao và RabbitMQ: nén nhật ký theo khoá, kiểm lược đồ, định tuyến theo sàn"
    spec: lessons/bnx/L10_kafka_nang_cao_rabbitmq.yaml
    requires: [L09]
    requires_ext: ["BNK:L07"]
    objectives: ["Tính kết quả nén nhật ký theo khoá, kể cả bản ghi bia mộ", "Kiểm một thay đổi lược đồ trước khi cho người gửi dùng", "Định tuyến thông điệp qua sàn chủ đề của RabbitMQ", "Nêu khi nào chọn Kafka, khi nào chọn RabbitMQ cho một luồng ngân hàng", "So sánh số bản ghi phải đọc lại khi khởi động, có và không nén nhật ký, ở 1 000, 100 000 và 1 000 000 bản ghi"]
    example: "8 bản ghi của 3 tài khoản sau khi nén còn 3; ghi thêm một bản ghi bia mộ cho một tài khoản thì sau khi nén còn 2; khoá định tuyến payment.vn.napas khớp mẫu payment.*.napas và payment.# nhưng không khớp payment.* (VER BNX:L10)"
    fix: ["Nén nhật ký không xoá theo thời gian mà giữ bản cuối mỗi khoá", "RabbitMQ xoá thông điệp khi đã xác nhận, Kafka giữ để đọc lại", "Kiểm lược đồ phải chạy trước khi người gửi đổi"]
  - id: L11
    title: "Thanh toán quốc tế và ngoại tệ: SWIFT, ISO 20022, tài khoản nostro và tỉ giá"
    spec: lessons/bnx/L11_thanh_toan_quoc_te_ngoai_te.yaml
    requires: [L10]
    requires_ext: ["BNK:L09"]
    objectives: ["Đọc mã BIC và kiểm số IBAN", "Ghi bút toán chuyển tiền quốc tế qua tài khoản nostro", "Tính số tiền khi đổi ngoại tệ và chịu phí theo OUR, SHA, BEN", "Nêu thay đổi từ bản tin MT sang ISO 20022", "So sánh phần trăm phí cố định và sai số cộng dồn của số thực ở ba cỡ giao dịch"]
    example: "IBAN mẫu GB82WEST12345698765432 có số dư mod 97 bằng 1; chuyển 1 000 USD với tỉ giá bán 25 400 (số minh hoạ) trừ 25 400 000 đồng; phí SHA 15 USD ở ngân hàng trung gian thì người nhận được 985 USD (VER BNX:L11)"
    fix: ["Từ 22/11/2025 chỉ thị thanh toán giữa các định chế trên Swift dùng ISO 20022 (CBPR+)", "Không dùng số thực dấu phẩy động cho tỉ giá và tiền", "Ngân hàng trung gian hoặc ngân hàng nhận có thể trừ phí, kể cả khi chọn OUR: người nhận không chắc nhận đủ, nên đối chiếu số báo có"]
  - id: L12
    title: "Ví điện tử và nộp thuế điện tử: tiền thật nằm ở đâu, bút toán và đối soát"
    spec: lessons/bnx/L12_vi_dien_tu_thue_dien_tu.yaml
    requires: [L11]
    requires_ext: ["BNK:L12"]
    objectives: ["Ghi bút toán nạp, rút, chuyển giữa ví và tài khoản ngân hàng", "Kiểm bất biến: tài khoản đảm bảo thanh toán không thấp hơn tổng số dư ví", "Kiểm hạn mức giao dịch ví theo tháng", "Mô tả luồng nộp thuế điện tử qua ngân hàng và đối soát theo số tham chiếu", "Đếm số phép so sánh của hai cách đối soát (quét danh sách, bảng tra) ở 100, 10 000 và 1 000 000 chứng từ", "Viết chương trình Python chạy lại nhật ký ví, kiểm bất biến và hạn mức tháng"]
    example: "Nạp 2 000 000 vào ví: tài khoản khách trừ 2 000 000, tài khoản đảm bảo thanh toán cộng 2 000 000, số dư ví cộng 2 000 000; ba ví 500 000, 1 200 000, 300 000 cần tài khoản đảm bảo ít nhất 2 000 000; đối soát 100 và 10 000 chứng từ: vòng lặp lồng 5 050 và 50 005 000 phép so sánh (đo thật), bảng tra 100 và 10 000 lần tra; ở 1 000 000 chứng từ vòng lặp lồng cần 500 000 500 000 phép (tính) (VER BNX:L12)"
    fix: ["Tiền trong ví không “nằm ở ví”: tiền thật ở tài khoản đảm bảo tại ngân hàng", "Hạn mức và quy định ví thay đổi theo văn bản; luôn dẫn văn bản hiện hành", "Theo Luật Quản lý thuế 2025 (108/2025/QH15, thay Luật 2019 từ 01/7/2026) Điều 14 khoản 5, nộp điện tử thì ngày đã nộp thuế là ngày ngân hàng trích tiền; nhưng chứng từ chưa sang Kho bạc thì NGÂN HÀNG chưa xong việc (chuyển tiền, đối soát)", "Đối soát bằng vòng lặp lồng chạy tốt trên dữ liệu thử nhưng số phép tăng theo bình phương; hàng triệu chứng từ cần bảng tra"]
  - id: L13
    title: "Từ commit tới máy chủ: Dockerfile, GitLab CI và triển khai lên Kubernetes"
    spec: lessons/bnx/L13_docker_gitlab_ci_kubernetes.yaml
    requires: [L00, L12]
    objectives: ["Đọc Dockerfile của dịch vụ Java và sắp thứ tự lệnh để tận dụng bộ nhớ đệm", "Đọc tệp .gitlab-ci.yml và thứ tự các giai đoạn", "Khai báo Deployment và tính số Pod khi cập nhật cuốn chiếu", "Nêu cách gắn thẻ ảnh bằng mã commit để truy ngược", "Tính số đợt và thời gian cập nhật cuốn chiếu khi số bản tăng từ 4 lên 40 và 400, và so thiếu 1 thừa 1 với mặc định 25%", "Viết chương trình Python tìm các lớp Dockerfile phải dựng lại và tính số đợt cập nhật cuốn chiếu"]
    example: "Đường ống 4 giai đoạn build, test, package, deploy: test hỏng thì package và deploy không chạy; 4 bản, tối đa thiếu 1 và tối đa thừa 1 thì luôn có ít nhất 3 bản sẵn sàng và nhiều nhất 5 Pod; mô phỏng số đợt thay hết: thiếu 1 thừa 1 cần 2, 20, 200 đợt ở 4, 40, 400 bản, mặc định 25% chỉ 2 đợt ở các cỡ chia hết cho 4 (cỡ chia 4 dư 3 cần 3 đợt) (VER BNX:L13)"
    fix: ["Không dùng nhãn latest cho ảnh chạy thật", "Bí mật không nằm trong ảnh hay trong tệp đường ống", "Triển khai được chưa phải phát hành an toàn: cần kiểm sẵn sàng và quay lui", "Cấu hình cập nhật tốt ở 4 bản chưa chắc còn tốt ở 400 bản: thiếu 1 thừa 1 cần 200 đợt, mặc định 25% chỉ 2 đợt nhưng tụt 25% sức chứa (còn 75%)"]
  - id: L14
    title: "DDD, cổng API và Open API ngân hàng: ranh giới, cửa vào và chia sẻ dữ liệu có đồng ý"
    spec: lessons/bnx/L14_ddd_cong_api_open_api.yaml
    requires: [L13]
    objectives: ["Nêu cách chia hệ thống ngân hàng thành ngữ cảnh giới hạn", "Nhận ra một khái niệm mang nghĩa khác nhau ở hai ngữ cảnh", "Nêu việc cổng API làm: xác thực, giới hạn tốc độ, định tuyến, nhật ký", "Nêu nội dung Open API ngân hàng theo Thông tư 64/2024/TT-NHNN: hợp đồng, sự đồng ý của khách, thời hạn tra cứu", "Tính số yêu cầu một cổng thùng token nhận và từ chối khi 30 yêu cầu đến cùng lúc và khi rải đều", "Đếm số yêu cầu qua cổng khi 1, 100 và 10 000 bên thứ ba cùng gọi và so với sức chịu của phía sau", "Viết chương trình Python mô phỏng thùng token và tính tải khi nhiều bên cùng gọi"]
    example: "Cổng API giới hạn 5 yêu cầu/giây, sức chứa 10: 30 yêu cầu đến cùng lúc thì nhận 10, từ chối 20; rải đều trong 1 giây thì nhận 14; 1, 100 và 10 000 bên thứ ba mỗi bên gửi dồn 30 yêu cầu thì qua cổng 10, 1 000 và 100 000 yêu cầu; Thông tư 64/2024/TT-NHNN hiệu lực từ 01/3/2025 (VER BNX:L14)"
    fix: ["DDD không bắt buộc microservice; ranh giới trước, cách triển khai sau", "Cổng API không thay kiểm quyền ở từng dịch vụ", "Open API chia sẻ dữ liệu khi khách đồng ý, qua hợp đồng với bên thứ ba", "Giới hạn theo từng bên không đủ khi hàng vạn bên cùng gọi: tổng tải tăng theo số bên, cần giới hạn tổng hoặc co giãn phía sau"]
  - id: L15
    title: "Tình huống chuyên gia: dựng dự án mẫu API chuyển khoản đúng như JD đòi hỏi"
    spec: lessons/bnx/L15_tinh_huong_du_an_mau.yaml
    requires: [L14]
    requires_ext: ["BNK:L14"]
    objectives: ["Lập ngân sách độ trễ cho một lệnh chuyển khoản", "Ước lượng tải trung bình và cao điểm từ số giao dịch mỗi ngày", "Nêu mỗi thành phần của dự án mẫu (Outbox, đệm Redis, xác thực, cổng, hợp đồng API) trả lời yêu cầu nào và đánh đổi của nó", "Nêu cách trình bày dự án mẫu trong buổi phỏng vấn: số đo thật kèm máy, dữ liệu và ngày đo", "Đếm số lệnh chạy cùng lúc ở Oracle khi tải tăng gấp 1, 100 và 10 000 lần và so với bể kết nối", "Viết chương trình Python ước lượng tải, ngân sách độ trễ và số kết nối cần cho một bộ số liệu mới"]
    example: "1 000 000 giao dịch mỗi ngày ≈ 11,6 giao dịch mỗi giây; cao điểm gấp 10 ≈ 116; ngân sách 300 ms trừ cổng 10, xác thực 5, dịch vụ 20, Oracle 40 còn dư 225 ms; cao điểm 116, 11 574, 1 157 407 giao dịch/giây (gấp 1, 100, 10 000 lần) thì đếm được 5, 463, 46 297 lệnh chạy chồng nhau ở Oracle, bể 50 kết nối chịu 1 250 giao dịch/giây (số minh hoạ, VER BNX:L15)"
    fix: ["Không khai số đo của dự án mẫu là số của hệ thống ngân hàng thật", "Không thêm công nghệ chỉ vì có trong JD; mỗi thành phần phải trả lời một yêu cầu", "Đo trước khi tối ưu", "Tải tăng gấp 100 lần thì số lệnh cùng lúc ở Oracle vượt bể kết nối: đếm lại khi tải đổi, đừng suy từ tải nhỏ"]
