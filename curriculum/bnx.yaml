  - id: L24
    title: "JPA/Hibernate và Spring Data: thực thể, ngữ cảnh bền vững và vấn đề N+1"
    spec: lessons/bnx/L24_jpa_hibernate_spring_data.yaml
    requires: ["L23"]
    requires_ext: ["BNK:L02", "BNK:L04"]
    objectives: ["Khai báo một thực thể và kể bốn trạng thái của đối tượng quanh ngữ cảnh bền vững", "Đếm số câu SQL của một truy vấn tải lười và nhận ra vấn đề một cộng N", "Sửa vấn đề một cộng N bằng phép nối kèm tải và so số câu SQL ở 5, 500 và 50 000 khách", "Giải thích vì sao sửa một đối tượng đang được quản lý thì tự sinh lệnh UPDATE mà không gọi hàm lưu", "Phân biệt đối tượng đang được quản lý với đối tượng đã rời ngữ cảnh khi sửa dữ liệu", "Mô tả cách khai một kho truy cập dữ liệu của Spring Data và cách truy vấn sinh ra từ tên hàm", "Đếm câu SQL của hai cách đọc dữ liệu bằng mã Python và sqlite"]
    example: "50 khách, mỗi khách kèm danh sách tài khoản: tải lười cần 1 + 50 = 51 câu SQL, nối kèm tải chỉ 1 câu; ở 5, 500 và 50 000 khách là 6, 501, 50 001 câu so với 1 câu; sửa số dư một đối tượng đang được quản lý rồi truy vấn cùng bảng sinh 1 lệnh UPDATE trước khi chốt, còn sửa đối tượng đã rời ngữ cảnh sinh 0 lệnh; ngữ cảnh giữ 500 + 500 × 2 = 1 500 đối tượng (chạy thật Hibernate 7.1.0.Final + H2, VER BNX:L24)"
    fix: ["Tải ngay không sửa vấn đề một cộng N, chỉ che nó", "Đối tượng đã rời ngữ cảnh không còn được theo dõi nên sửa nó không ghi xuống bảng", "Một phiên chạy lâu giữ mọi đối tượng đã tải trong ngữ cảnh, nên bộ nhớ phình dần nếu không xoá theo lô"]
  - id: L25
    title: "Giao dịch Spring và AOP chuyên sâu: lan truyền, hoàn tác, tự gọi và đoạn cắt"
    spec: lessons/bnx/L25_giao_dich_spring_aop.yaml
    requires: ["L24"]
    requires_ext: ["BNK:L02", "BNK:L05"]
    objectives: ["Đọc một hàm có nhãn giao dịch và nói proxy mở, chốt hoặc hoàn tác ở đâu", "So sánh REQUIRED với REQUIRES_NEW qua số dư và số dòng nhật ký sau một lỗi", "Xác định lỗi nào làm giao dịch hoàn tác và khai rollbackFor khi cần", "Chỉ ra vì sao lời gọi tự gọi bỏ qua nhãn giao dịch và đoạn cắt", "So sánh mức cô lập READ_COMMITTED với REPEATABLE_READ trên hai kết nối", "Tính số kết nối tối thiểu của bể khi dùng giao dịch riêng", "Viết bảng quyết định hoàn tác theo quy tắc mặc định của Spring"]
    example: "Số dư 1000, trừ 100 rồi ném lỗi: REQUIRED chung giao dịch với nhật ký thì số dư về 1000 và nhật ký 0 dòng; REQUIRES_NEW thì số dư về 1000 nhưng nhật ký còn 1 dòng; lỗi kiểm tra không khai rollbackFor thì số dư là 900; hàm có nhãn gọi bằng this thì không có giao dịch (false) còn gọi qua proxy thì có (true); mức READ_COMMITTED đọc lại 1000 → 1050, REPEATABLE_READ vẫn 1000; bể kết nối bằng số luồng (3 luồng, bể 3) thì cả 3 luồng hết giờ, bể 4 thì 0 (chạy thật Spring 7.0.10 + H2, VER BNX:L25)"
    fix: ["Lỗi kiểm tra không làm hoàn tác trừ khi khai rollbackFor", "Gọi hàm có nhãn bằng this trong cùng lớp bỏ qua proxy nên không có giao dịch và không có đoạn cắt", "REQUIRES_NEW cần bể kết nối lớn hơn số luồng ít nhất 1"]
  - id: L26
    title: "Maven, Gradle và Jenkins: vòng đời, xung đột phiên bản và dựng tái lập"
    spec: lessons/bnx/L26_maven_gradle_jenkins.yaml
    requires: ["L25"]
    requires_ext: ["JVA:L12", "BNK:L02"]
    objectives: ["Đọc vòng đời dựng mặc định của Maven qua các mục tiêu của phần mở rộng in ra khi chạy mvn package", "Đọc cây phụ thuộc bắc cầu của một pom.xml bằng dependency:tree và nhận ra dòng bị bỏ vì xung đột", "Xác định phiên bản được chọn theo luật gần nhất thắng của Maven", "Đọc một Jenkinsfile khai báo và nói thứ tự giai đoạn cùng nhánh post khi một giai đoạn hỏng", "Chứng minh dựng tái lập bằng cách dựng hai lần và so sha256 của jar", "Đọc số gói thư viện đo thật ở ba dự án thử và tính số máy dựng tối thiểu khi lượt dựng gấp 100 và 10 000 lần", "Viết bộ phân giải phiên bản theo luật gần nhất thắng của Maven và theo luật cao nhất của Gradle"]
    example: "Dự án khai commons-lang3 3.9 trực tiếp, còn commons-text 1.10.0 cần commons-lang3 3.12.0: Maven chọn 3.9 và báo omitted for conflict with 3.9, luật cao nhất của Gradle chọn 3.12.0; mvn package đi qua 17 pha và chạy 6 mục tiêu của phần mở rộng gắn vào 6 pha (resources, compile, testResources, testCompile, test, jar); dựng hai lần không đặt outputTimestamp thì hai jar khác nhau, đặt thì giống nhau; 1 phụ thuộc trực tiếp kéo 1, 9, 34 gói thư viện; 4, 400, 40 000 lượt dựng mỗi giờ, mỗi lượt 10 phút cần 1, 67, 6 667 máy dựng (số minh hoạ; chạy thật Maven 3.9.11, VER BNX:L26)"
    fix: ["Bản thư viện đang chạy do luật phân giải quyết định, không phải do bản ta thấy trong tệp mô tả", "Maven chọn bản gần dự án nhất còn Gradle mặc định chọn bản cao nhất", "Dựng tái lập cần ghim phiên bản và cố định mốc thời gian, không chỉ dựng hai lần"]
  - id: L27
    title: "SOAP/WSDL và SFTP: tích hợp hệ cũ và đối soát tệp lô"
    spec: lessons/bnx/L27_soap_wsdl_sftp.yaml
    requires: ["L26"]
    requires_ext: ["BNK:L03", "BNK:L11"]
    objectives: ["Đọc một phong bì XML và chỉ ra phần thân và phần lỗi", "Đọc kết quả chạy thật của một dịch vụ phong bì tối giản bằng JDK: mã trạng thái 200, 500 và 400", "So sánh kích thước đã đo của phong bì với JSON tương đương", "Đọc một tệp mô tả dịch vụ và đếm thông điệp, thao tác, ràng buộc và dịch vụ", "Kiểm toàn vẹn tệp lô bằng số dòng và mã băm ở dòng cuối", "Tính số byte và số khối phải đọc khi tệp lô lớn gấp 1 000 lần", "Chặn yêu cầu có khai báo loại văn bản bằng cấu hình bộ phân tích XML"]
    example: "Phong bì hỏi tài khoản 001 nặng 246 byte so với JSON tương đương 20 byte (gấp 12,3 lần), trả lời 211 byte so với 16 byte; máy chủ thử trả 200 với số dư 1 250 000, 500 kèm Fault cho tài khoản lạ, 400 cho yêu cầu có DOCTYPE; tệp WSDL mẫu có 2 message, 1 portType, 1 operation, 1 binding, 1 service; tệp lô 1 000 dòng đủ dòng và đúng sha256 thì OK, mất 100 dòng thì THIEU DONG, đổi một chữ số thì SAI MA BAM; 10³ dòng là 24 000 byte (1 khối 64 KiB), 10⁶ dòng là 24 000 000 byte (367 khối) (chạy thật JDK 21, VER BNX:L27; SFTP là mô phỏng)"
    fix: ["Kênh mã hoá bảo vệ đường truyền nhưng không bảo đảm tệp đủ và đúng", "Bộ phân tích XML để mặc định có thể bị cài thực thể ngoài, cần cấm khai báo loại văn bản", "Tệp ghi dở phải không thấy được: ghi tên tạm rồi đổi tên nguyên tử"]
  - id: L28
    title: "PostgreSQL, MongoDB, MySQL so với Oracle và SQL Server: mô hình, chỉ mục và khoá"
    spec: lessons/bnx/L28_co_so_du_lieu_so_sanh.yaml
    requires: ["L27"]
    requires_ext: ["BNK:L04", "BNK:L05"]
    objectives: ["Đọc kế hoạch của PostgreSQL và nhận ra quét tuần tự khác quét theo chỉ mục", "So sánh lỗi khi xin khoá dòng không chờ ở PostgreSQL, MySQL, Oracle và SQL Server", "Đọc một bản ghi JSON lồng nhau và hỏi theo trường lồng", "Giải thích vì sao cập nhật có điều kiện trên một bản ghi ngăn rút quá số dư", "Chọn loại cơ sở dữ liệu cho sổ tiền, dữ liệu lồng nhau và báo cáo theo yêu cầu", "Đếm số dòng bị loại khi không có chỉ mục ở 10³, 10⁵ và 10⁶ dòng", "Viết hàm rút tiền có điều kiện và tái hiện lỗi đọc rồi ghi"]
    example: "Tìm một giá trị duy nhất: quét tuần tự loại 999, 99 999, 999 999 dòng ở bảng 10³, 10⁵, 10⁶ dòng, còn quét theo chỉ mục loại 0 (PostgreSQL 17 chạy thật); xin khoá dòng không chờ khi dòng đang bị giữ: PostgreSQL báo could not obtain lock on row, MySQL báo ERROR 3572, Oracle báo ORA-00054, SQL Server báo Msg 1222; trong cơ sở dữ liệu lưu bản ghi JSON, cập nhật có điều kiện rút 600 từ số dư 1000 lần đầu được (còn 400) và lần hai bị từ chối, còn đọc rồi ghi không điều kiện chi 1200 mà chỉ trừ 600 (phần đọc rồi ghi là MÔ PHỎNG bằng Python, không phải tranh chấp thật; các phần khác chạy thật bằng ảnh Docker chính thức, VER BNX:L28)"
    fix: ["Hệ nào cũng có kế hoạch xem được; chỉ mục biến chi phí đọc từ tăng theo cỡ bảng thành gần như không đổi", "Mỗi hệ báo lỗi khoá bằng mã riêng nên chuyển hệ phải sửa chỗ bắt lỗi", "Đọc rồi ghi không điều kiện làm mất tiền khi hai bên cùng sửa; phải kiểm và trừ trong một bước"]
  - id: L29
    title: "CQRS và Event Sourcing cho sổ tiền: kho sự kiện, phát lại và bản chụp"
    spec: lessons/bnx/L29_cqrs_event_sourcing.yaml
