# Giáo án — LNX · Linux và Container thực chiến: tiến trình, mạng, Docker & Compose (10 bài, 2026-11-18)
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã LNX:Lxx (tính lại + chạy thật trên Git Bash & Docker Linux trong audit/lnx/verify_lnx.py).
# Căn cứ phạm vi: CS2023 — Operating Systems (OS) & Systems Fundamentals (SF); POSIX.1-2017 & Linux man-pages; Docker Engine docs (bản hiện hành).
# Vì sao cần: Khoá FND dạy dòng lệnh cơ bản trên Windows Git Bash; OSY/NET dạy lý thuyết HĐH/mạng; khoá này nối tay nghề thật về quyền rwx, tín hiệu, inode, mạng Linux và Docker/Compose.
# Thứ tự học: sau FND:L10; trước OSY/NET/DVO (Chặng 6).
course: LNX
status: active
lab: {lang: [sh], requires: [FND:L04]}
lessons:
  - id: L00
    title: "Hệ thống tệp Linux, /proc và liên kết cứng vs liên kết mềm"
    spec: lessons/lnx/L00_he_thong_tep_inode_link.yaml
    requires: []
    requires_ext: ["FND:L10"]
    objectives:
      - "Phân biệt vai trò các thư mục gốc /etc, /var, /tmp, /proc trên Linux"
      - "Phân biệt liên kết cứng (chung số inode) với liên kết mềm (lưu đường dẫn)"
      - "Giải thích vì sao xoá một tên tệp liên kết cứng không làm mất dữ liệu khi còn liên kết khác"
    example: "tệp A có liên kết đếm = 2; xoá A thì B vẫn đọc được đủ dữ liệu; với liên kết mềm thì B hỏng (mã thoát khác 0) (VER LNX:L00)"
    fix:
      - "Liên kết mềm trỏ theo đường dẫn nên hỏng khi tệp gốc đổi tên hoặc di chuyển; liên kết cứng trỏ trực tiếp tới inode"
  - id: L01
    title: "Người dùng, nhóm và phân quyền bát phân chmod 755 / 640"
    spec: lessons/lnx/L01_nguoi_dung_quyen_rwx.yaml
    requires: [L00]
    objectives:
      - "Quy đổi quyền đọc (4), ghi (2), thực thi (1) giữa ký hiệu rwx và 3 chữ số bát phân"
      - "Chọn quyền an toàn cho tệp bí mật (600/640) và tệp chạy/thư mục (755)"
      - "Nhận biết rủi ro đặt quyền 777 trên máy chủ dùng chung"
    example: "rwxr-xr-x = 755, rw-r----- = 640, rw------- = 600 (từ 4+2+1) (VER LNX:L01)"
    fix:
      - "Đặt quyền 777 không phải cách sửa lỗi quyền: mọi tài khoản trên máy đều sửa hoặc xoá được tệp đó"
  - id: L02
    title: "Tiến trình, mã thoát và tín hiệu SIGTERM vs SIGKILL"
    spec: lessons/lnx/L02_tien_trinh_tin_hieu.yaml
    requires: [L01]
    objectives:
      - "Giải thích quy ước mã thoát chuẩn 128 + số hiệu tín hiệu khi tiến trình bị ngắt"
      - "Phân biệt SIGTERM (15 — cho phép dọn dẹp, đóng kết nối) với SIGKILL (9 — nhân ép dừng ngay)"
      - "Nhận diện tiến trình thây ma (zombie) và cách tiến trình cha thu hồi trạng thái"
    example: "bị ngắt bởi SIGTERM (15) trả mã thoát 143; SIGKILL (9) trả mã 137 và không chạy hàm dọn dẹp (VER LNX:L02)"
    fix:
      - "Luôn gửi SIGTERM trước rồi chờ hạn dọn sạch; chỉ dùng SIGKILL khi tiến trình thực sự treo không phản hồi"
  - id: L03
    title: "Luồng chuẩn, đường ống và lọc nhật ký dịch vụ trên Linux"
    spec: lessons/lnx/L03_luong_nhat_ky_loc_du_lieu.yaml
    requires: [L02]
    objectives:
      - "Tách luồng chuẩn (1) và luồng lỗi (2) khi ghi log và chuyển hướng"
      - "Dùng grep/awk theo đường ống để đếm số lỗi 5xx theo phút trên tệp log lớn"
      - "Ước lượng thời gian quét 100 000 dòng log khi lọc tại chỗ so với truyền mạng"
    example: "tệp log 10 000 dòng có 120 lỗi 500 và 30 lỗi 503 → tổng lỗi 5xx = 150 dòng (1,5%) (VER LNX:L03)"
    fix:
      - "Chuyển hướng `> out.txt` chỉ bắt stdout; lỗi vẫn lọt ra màn hình nếu không thêm `2>&1`"
  - id: L04
    title: "Ổ đĩa, phần trăm dung lượng và lỗi hết inode khi đĩa vẫn còn trống"
    spec: lessons/lnx/L04_o_dia_dung_luong_inode.yaml
    requires: [L00, L03]
    objectives:
      - "Phân biệt báo cáo dung lượng khối (df -h) với số lượng inode còn lại (df -i)"
      - "Giải thích vì sao hàng triệu tệp 0 byte làm đầy bảng inode dù dung lượng chiếm gần 0%"
      - "Đếm số inode tiêu thụ cho n tệp trong một thư mục"
    example: "10 000 tệp rỗng 0 byte chiếm 0 byte dữ liệu nhưng tiêu thụ 10 001 inode (kể cả thư mục chứa) (VER LNX:L04)"
    fix:
      - "Thấy báo 'No space left on device' trong khi df -h mới 40% thì phải kiểm tra ngay df -i (cạn inode)"
  - id: L05
    title: "Mạng Linux thực chiến: cổng đang nghe, /etc/hosts, DNS và curl"
    spec: lessons/lnx/L05_mang_linux_cong_dns.yaml
    requires: [L02, L03]
    objectives:
      - "Phân biệt dịch vụ nghe trên 127.0.0.1 (chỉ nội bộ) với 0.0.0.0 (mọi giao diện mạng)"
      - "Kiểm tra giao diện mạng, mở cổng TCP nội bộ và kiểm phản hồi HTTP 200 qua dòng lệnh"
      - "Lần theo thứ tự phân giải tên miền qua /etc/hosts trước máy chủ DNS"
    example: "127.0.0.1:8080 từ bên ngoài container báo connection refused dù bên trong trả 200 OK (VER LNX:L05)"
    fix:
      - "Dịch vụ chạy trong container gắn 127.0.0.1 sẽ không nhận được lưu lượng chuyển cổng từ Docker; phải nghe trên 0.0.0.0"
  - id: L06
    title: "Khoá SSH, biến môi trường, cron và giữ bí mật khỏi nhật ký"
    spec: lessons/lnx/L06_ssh_env_cron_bi_mat.yaml
    requires: [L01, L05]
    objectives:
      - "Phân biệt vai trò khoá công khai và khoá bí mật; đặt quyền 600 cho khoá riêng"
      - "Truyền mật khẩu/token qua tệp cấu hình hạn chế quyền hoặc biến môi trường thay vì tham số dòng lệnh"
      - "Đọc biểu thức lịch cron 5 trường và đặt chuyển hướng log cho tác vụ nền"
    example: "lịch `*/5 * * * *` chạy 12 lần mỗi giờ, tức 288 lần mỗi ngày (VER LNX:L06)"
    fix:
      - "Truyền mật khẩu trực tiếp trên dòng lệnh làm lộ rõ mật khẩu qua lệnh `ps` và lịch sử dòng lệnh"
  - id: L07
    title: "Nhân Linux cô lập Container: namespaces, cgroups và tầng ảnh Docker"
    spec: lessons/lnx/L07_container_namespaces_cgroups.yaml
    requires: [L02, L04]
    objectives:
      - "Phân biệt namespaces (cô lập góc nhìn PID/mạng/tệp) với cgroups (giới hạn RAM/CPU)"
      - "Tính dung lượng đĩa tiết kiệm được khi N container dùng chung tầng ảnh gốc chỉ đọc"
      - "Nhận biết vì sao container hết RAM bị nhân ngắt ngay (OOMKill, mã thoát 137)"
    example: "ảnh gốc 120 MB + 10 container mỗi cái ghi riêng 5 MB chỉ tốn 120 + 50 = 170 MB thay vì 1 200 MB (VER LNX:L07)"
    fix:
      - "Container không phải máy ảo có nhân riêng; mọi container dùng chung một nhân Linux của máy chủ"
  - id: L08
    title: "Chạy Docker Container thực chiến: cổng, ổ gắn, mạng và nhật ký"
    spec: lessons/lnx/L08_docker_chay_thuc_chien.yaml
    requires: [L05, L07]
    objectives:
      - "Phân biệt dữ liệu tạm trong container (mất khi xoá) với ổ gắn lưu bền vững (volume)"
      - "Tạo mạng cầu nối riêng để hai container gọi nhau qua tên dịch vụ mà không lộ cổng ra ngoài"
      - "Đọc nhật ký chuẩn stdout/stderr của container qua `docker logs`"
    example: "gắn ổ bền vững giữ nguyên 100% số bản ghi khi dừng và tạo lại container (chạy thật trên Docker) (VER LNX:L08)"
    fix:
      - "Không lưu dữ liệu cơ sở dữ liệu bên trong tầng ghi tạm của container vì lệnh xoá container sẽ làm mất sạch"
  - id: L09
    title: "Tình huống chuyên gia: Dựng và gỡ lỗi cụm nhiều dịch vụ bằng Docker Compose"
    spec: lessons/lnx/L09_tinh_huong_docker_compose.yaml
    requires: [L06, L08]
    objectives:
      - "Khai báo tệp Compose gồm dịch vụ ứng dụng, bộ đệm và kiểm tra sức khoẻ healthcheck"
      - "Chẩn đoán 3 lỗi thường gặp: nghe sai địa chỉ 127.0.0.1, dùng nhầm cổng ngoài thay cổng nội bộ, kết nối khi DB chưa sẵn sàng"
      - "Ước lượng độ trễ khởi động khi cấu hình `interval` và `retries` cho healthcheck"
    example: "healthcheck kiểm mỗi 2 giây tối đa 5 lần thất bại cần tối đa 10 giây phát hiện hỏng trước khi đánh dấu unhealthy (VER LNX:L09)"
    fix:
      - "Trong mạng Docker Compose, các dịch vụ gọi nhau qua tên dịch vụ và cổng bên trong container, không phải cổng ánh xạ ra máy host"
