# Giáo án Khoá JVA · Lập trình Java từ con số 0 (13 bài, 2026-11-08)
# Căn cứ phạm vi: rà soát 2026-11-08 (interview/HANDOVER_INTERVIEW.md Mục 10) — thư viện không có khoá lập trình nhập môn; người học mất gốc
#   vào thẳng BNK L00 (bộ nhớ Java) sẽ hụt. Khoá này dạy lập trình Java từ đầu và đứng trước BNK.
# Bộ kiểm độc lập: audit/jva/verify_jva.py biên dịch và chạy THẬT (javac/java, JDK 22 trên máy) mọi chương trình trong bài, so từng dòng in ra.
# Nguồn: The Java Language Specification (Java SE 21), Javadoc Java SE 21, dev.java/learn; mục cụ thể ghi trong `source` của từng bài.
course: JVA
profile: stem
status: active
lessons:
- id: L00
  title: 'Chương trình đầu tiên: mã nguồn, biên dịch và máy ảo Java'
  spec: lessons/jva/L00_chuong_trinh_dau_tien.yaml
  requires: []
  objectives:
  - Kể đúng ba bước gõ, biên dịch, chạy và vai trò của máy ảo Java
  - Đọc được chương trình có hàm chính và lệnh in
  - Phân biệt lỗi biên dịch với lỗi khi chạy
  - Dự đoán dấu cộng là cộng số hay nối chữ
  example: 'Năm lệnh in với 2 và 3: in 5, "2 + 3", Tong: 23, Tong: 5, 5 dong — dấu + gặp chuỗi là nối chữ, từ trái sang phải (VER JVA:L00)'
  fix:
  - 'Biên dịch được chưa chắc chạy đúng: lỗi khi chạy (chia cho 0) chỉ lộ ra lúc chạy'
- id: L01
  title: Biến và kiểu dữ liệu
  spec: lessons/jva/L01_bien_va_kieu_du_lieu.yaml
  requires:
  - L00
  objectives:
  - Khai báo và gán biến, đọc đúng phép gán là tính vế phải rồi ghi đè
  - Chọn đúng kiểu trong sáu kiểu số nguyên, số nguyên dài, số thực, đúng sai, ký tự, chuỗi
  - Suy ra giới hạn của kiểu số nguyên và giải thích hiện tượng tràn số
  - Tính tổng tiền bằng kiểu số nguyên dài theo đồng, biết vì sao không dùng số thực
  example: Ba lần chi lương 900 000 000 đồng cộng bằng int ra −1 594 967 296 (tràn số, 2 700 000 000 − 2^32); cộng bằng long ra đúng 2 700 000 000 (VER JVA:L01)
  fix:
  - Không dùng double cho tiền; tổng tiền dùng long theo đơn vị đồng vì int tràn ở 2 147 483 647
- id: L02
  title: Toán tử và biểu thức
  spec: lessons/jva/L02_toan_tu_va_bieu_thuc.yaml
  requires:
  - L01
  objectives:
  - Tính đúng phép chia nguyên và chia lấy dư, kể cả với số âm
  - Ép kiểu đúng chỗ để giữ phần lẻ, và biết thứ tự tính của biểu thức
  - Dùng phép so sánh và phép logic, đặt phép kiểm trước nhờ ngắn mạch
  - Tính phí phần trăm bằng số nguyên theo thứ tự nhân trước, chia sau
  example: 7 / 2 = 3, 7 % 2 = 1, (double) 7 / 2 = 3.5, −7 / 2 = −3, −7 % 2 = −1 (chia số nguyên của Java cắt về 0) (VER JVA:L02)
  fix:
  - (double)(7 / 2) vẫn ra 3.0 vì phép chia số nguyên đã chạy trước khi ép kiểu
- id: L03
  title: 'Rẽ nhánh: nếu, nếu không, và chọn theo trường hợp'
  spec: lessons/jva/L03_re_nhanh.yaml
  requires:
  - L02
  objectives:
  - Viết chuỗi nếu, nếu không, mà, nếu không và đoán đúng nhánh nào chạy
  - Đổi câu chữ của quy định thành dấu so sánh đúng ở biên, kể cả điều kiện ghép
  - Dùng lệnh chọn theo trường hợp dạng mũi tên và toán tử ba ngôi
  - 'Kiểm thử ở biên và nhận ra ba lỗi: một dấu bằng, thiếu ngoặc nhọn, sai dấu biên'
  example: Biểu phí minh hoạ ba bậc, thử ba số tiền ở biên; so sánh > với >= đổi bậc đúng ở số tiền biên (VER JVA:L03)
  fix:
  - Ranh giới bậc phí phải ghi rõ “từ” hay “trên”; kiểm ngay tại số biên
- id: L04
  title: Vòng lặp
  spec: lessons/jva/L04_vong_lap.yaml
  requires:
  - L03
  objectives:
  - Viết vòng lặp trong khi, vòng lặp đếm, vòng lặp làm rồi mới kiểm, và chọn đúng loại
  - Đếm trước số lần chạy bằng cuối trừ đầu cộng một, tránh lỗi lệch một
  - Dùng hai mẫu cộng dồn và đếm, cùng lệnh thoát và lệnh bỏ qua
  - Tính lãi cộng dồn bằng số nguyên theo đồng và kiểm lại bằng công thức lãi kép
  example: Mười lần cộng 0,1 bằng double ra 0.9999999999999999; vòng lặp tháng viết thang < 12 chỉ chạy 11 tháng thay vì 12 (lệch một) (VER JVA:L04)
  fix:
  - Lệch một vòng là lỗi phổ biến nhất của vòng lặp; luôn thử với 0, 1 và n phần tử
- id: L05
  title: 'Mảng: nhiều giá trị cùng kiểu dưới một tên'
  spec: lessons/jva/L05_mang.yaml
  requires:
  - L04
  objectives:
  - Tạo mảng, đọc và gán phần tử theo chỉ số từ 0 tới length − 1
  - Duyệt mảng bằng vòng lặp đếm để tính tổng, tìm lớn nhất và vị trí
  - Dùng Arrays.toString, Arrays.sort, Arrays.copyOf
  - Giải thích vì sao gán một biến mảng cho biến khác không tạo bản sao
  example: 'Mảng 5 số dư: tổng, lớn nhất và vị trí; truy cập phần tử chỉ số 5 của mảng dài 5 ném ArrayIndexOutOfBoundsException (VER JVA:L05)'
  fix:
  - Gán b = a không sao chép mảng mà cho hai tên cùng trỏ một mảng
- id: L06
  title: 'Phương thức (hàm): viết một lần, gọi nhiều nơi'
  spec: lessons/jva/L06_phuong_thuc.yaml
  requires:
  - L05
  objectives:
  - Khai báo hàm tĩnh có tham số, kiểu trả về và lệnh trả về; gọi hàm, kể cả gọi lồng
  - 'Giải thích truyền theo giá trị: hàm không đổi được biến số nguyên của người gọi nhưng đổi được ô của mảng'
  - Viết hai hàm nạp chồng và biết máy chọn hàm nào
  - Nhận ra lỗi phạm vi biến, thiếu lệnh trả về, bỏ quên giá trị trả về
  example: Hàm nhận số nguyên không đổi được biến của người gọi; hàm nhận mảng đổi được phần tử của mảng gốc (VER JVA:L06)
  fix:
  - Java luôn truyền theo giá trị; với mảng và đối tượng, giá trị được truyền là tham chiếu
- id: L07
  title: 'Lớp và đối tượng: tài khoản tự giữ luật của mình'
  spec: lessons/jva/L07_lop_doi_tuong.yaml
  requires:
  - L06
  objectives:
  - Khai báo lớp có trường riêng tư, hàm tạo, các hàm của đối tượng (nạp, rút) và hàm đổi ra chuỗi
  - Tạo nhiều đối tượng độc lập bằng từ khoá tạo mới và gọi hàm trên từng đối tượng
  - Giữ bất biến số dư không âm bằng cách kiểm trong hàm nạp, hàm rút
  - Nhận ra lỗi quên this, trường static dùng chung, trường public phá bất biến
  example: Hai tài khoản độc lập; rút quá số dư bị từ chối nên số dư không bao giờ âm (VER JVA:L07)
  fix:
  - Trường để public cho phép phá bất biến; giữ private và kiểm điều kiện trong phương thức
- id: L08
  title: 'Chuỗi: cắt, so sánh và định dạng dữ liệu chữ'
  spec: lessons/jva/L08_chuoi.yaml
  requires:
  - L07
  objectives:
  - Dùng length, charAt, indexOf, substring, trim, split trên chuỗi, với chỉ số từ 0
  - Giải thích vì sao == so tham chiếu còn equals so nội dung
  - Tách dòng “số tài khoản;số tiền”, đổi phần số bằng Long.parseLong và định dạng 1,234,567
  - Tránh lỗi quên gán lại chuỗi, gọi hàm trên giá trị rỗng, nối chuỗi trong vòng lặp lớn
  example: 'Hai chuỗi giống chữ tạo riêng: so bằng == ra false, bằng equals ra true; định dạng 1234567 thành 1,234,567 (VER JVA:L08)'
  fix:
  - So nội dung chuỗi bằng equals, không bằng ==; viết hằng chuỗi đứng trước để tránh lỗi giá trị rỗng
- id: L09
  title: Danh sách và bản đồ
  spec: lessons/jva/L09_danh_sach_va_ban_do.yaml
  requires:
  - L08
  objectives:
  - Tạo danh sách, thêm, lấy theo chỉ số, duyệt và cộng tổng
  - Dùng bản đồ khoá–giá trị để tra số dư theo số tài khoản
  - Đếm tần suất bằng lấy hoặc mặc định
  - Giải thích hộp hoá và vì sao lớp bọc phải so bằng equals
  example: 'Integer so bằng ==: 127 ra true, 128 ra false (bộ nhớ đệm −128..127); đếm giao dịch theo loại bằng bản đồ (VER JVA:L09)'
  fix:
  - Số đã hộp hoá so bằng equals; không xoá phần tử trong vòng duyệt từng phần tử
- id: L10
  title: 'Ngoại lệ: ném, bắt và đọc dấu vết lỗi'
  spec: lessons/jva/L10_ngoai_le.yaml
  requires:
  - L09
  objectives:
  - Viết và đọc khối thử, bắt, cuối cùng; dự đoán thứ tự in
  - Ném ngoại lệ tự định nghĩa khi rút quá số dư
  - Phân biệt ngoại lệ có kiểm tra và không kiểm tra
  - Đọc dấu vết ngăn xếp để tìm đúng lệnh gây lỗi
  example: Rút quá số dư ném ngoại lệ tự định nghĩa; khối finally chạy cả khi có lỗi lẫn khi không; dấu vết ngăn xếp chỉ đúng dòng gây lỗi (VER JVA:L10)
  fix:
  - Khối bắt lỗi rỗng nuốt lỗi; bắt đúng loại ngoại lệ cần xử lý
- id: L11
  title: Kế thừa, giao diện, đa hình; bản ghi và kiểu liệt kê
  spec: lessons/jva/L11_giao_dien_ban_ghi_liet_ke.yaml
  requires:
  - L10
  objectives:
  - Viết giao diện và hai lớp cài nó, chạy qua một vòng lặp (đa hình)
  - Dùng kế thừa và chú thích ghi đè đúng cách
  - Khai bản ghi, so bằng nội dung
  - Khai kiểu liệt kê và chọn theo trường hợp
  example: Hai cách tính phí cài cùng một giao diện chạy qua một vòng lặp; hai bản ghi cùng giá trị thì equals ra true (VER JVA:L11)
  fix:
  - Ưu tiên giao diện hơn kế thừa sâu; đánh dấu @Override để trình biên dịch bắt sai tên
- id: L12
  title: 'Tình huống chuyên gia: sổ chuyển khoản nhỏ'
  spec: lessons/jva/L12_so_chuyen_khoan.yaml
  requires:
  - L11
  objectives:
  - Ghép lớp, bản ghi, bản đồ, danh sách và ngoại lệ thành một sổ chuyển khoản
  - Áp dụng kiểm tra trước, sửa sau và kiểm bất biến tổng tiền sau mỗi lệnh
  - Đọc dấu vết lỗi, phân biệt nơi phát hiện với nơi sai, sửa tận gốc
  - 'Nhận ra hai cách sửa sai: nuốt ngoại lệ và chỉ đối soát cuối ngày'
  example: 'Sổ chuyển khoản 3 tài khoản: tổng tiền trước bằng tổng sau; lỗi chép nhầm biến bị bắt ngay bởi phép kiểm bất biến (VER JVA:L12)'
  fix:
  - Không sửa lỗi bằng cách nuốt ngoại lệ; kiểm bất biến sau mỗi thao tác chứ không chỉ cuối ngày
