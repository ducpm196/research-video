# Giáo án KẾ HOẠCH — BCH · Blockchain và sổ cái phân tán
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã BCH:Lxx (SHA-256 thật, cây Merkle tự dựng, công thức Nakamoto, mô phỏng).
# Căn cứ phạm vi: S. Nakamoto, Bitcoin: A Peer-to-Peer Electronic Cash System (2008) — mục 11 (xác suất kẻ tấn công đuổi kịp; bảng q = 0,1 và
#   q = 0,3 được TÍNH LẠI khớp đến 7 chữ số); A. Narayanan và cộng sự, Bitcoin and Cryptocurrency Technologies (2016); R. Merkle (1987);
#   G. Wood, Ethereum Yellow Paper (phí cơ bản giao dịch 21 000 đơn vị gas); M. Castro, B. Liskov, Practical Byzantine Fault Tolerance (1999) — n ≥ 3f + 1;
#   N. Atzei và cộng sự, A survey of attacks on Ethereum smart contracts (2017). Mục tiêu PHÒNG THỦ: lỗi hợp đồng chỉ ở mức mô phỏng khái niệm.
# Vì sao cần: SEC dạy băm, chữ ký, chứng chỉ; DSY dạy đồng thuận và hỏng hóc. Blockchain ghép các phần đó cho bài toán sổ cái không có bên tin cậy
#   chung — khoá dạy cả khi nào KHÔNG nên dùng.
# Thứ tự học: sau SEC L08–L10, DSY L01, L05, DMS L15, DMS L19.
course: BCH
status: planned
lessons:
  - id: L00
    title: "Sổ cái phân tán: chi tiêu hai lần và khi nào cần blockchain"
    spec: lessons/bch/L00_so_cai_phan_tan.yaml
    requires: []
    requires_ext: ["DSY:L00", "SEC:L00"]
    objectives: ["Phát biểu bài toán chi tiêu hai lần khi không có bên tin cậy chung", "Dùng câu hỏi quyết định: có cần blockchain không"]
    example: "nếu có một bên mọi người cùng tin (ngân hàng, cơ quan đăng ký) → cơ sở dữ liệu có nhật ký và chữ ký là đủ, rẻ và nhanh hơn"
    fix: ["Blockchain không làm dữ liệu ĐÚNG — nó chỉ làm dữ liệu đã ghi khó sửa; dữ liệu sai vẫn được ghi vĩnh viễn"]
  - id: L01
    title: "Chuỗi liên kết bằng băm: sửa một khối làm hỏng mọi khối sau"
    spec: lessons/bch/L01_chuoi_bam.yaml
    requires: [L00]
    requires_ext: ["SEC:L08", "SEC:L10"]
    objectives: ["Dựng chuỗi khối mỗi khối chứa mã băm khối trước", "Kiểm tính toàn vẹn của chuỗi"]
    example: "chuỗi 4 khối SHA-256: sửa khối thứ 3 → mã băm tính lại không khớp mã đã lưu; kẻ sửa tính lại cả mã khối 3 → khối 4 (giữ mã cũ của khối 3) không khớp — muốn che phải tính lại MỌI khối sau (VER BCH:L01)"
    fix: ["Liên kết băm chỉ phát hiện sửa đổi; ngăn sửa đổi cần thêm cơ chế làm việc viết lại tốn kém hoặc cần nhiều bên đồng ý"]
  - id: L02
    title: "Cây Merkle và bằng chứng thuộc về"
    spec: lessons/bch/L02_cay_merkle.yaml
    requires: [L01]
    requires_ext: ["CS112:L05"]
    objectives: ["Dựng cây Merkle", "Kiểm một giao dịch thuộc khối bằng log₂ n mã băm"]
    example: "1024 giao dịch: bằng chứng thuộc về cần 10 mã băm = 320 byte, thay vì tải cả 1024 giao dịch (VER BCH:L02)"
    fix: ["Bằng chứng Merkle chứng minh THUỘC VỀ một gốc — người kiểm vẫn phải tin gốc đó nằm trong chuỗi đúng"]
  - id: L03
    title: "Chữ ký số, khoá và địa chỉ: ai được tiêu"
    spec: lessons/bch/L03_chu_ky_khoa.yaml
    requires: [L01]
    requires_ext: ["DMS:L15", "SEC:L09"]
    objectives: ["Giải thích giao dịch được ký bằng khoá bí mật", "Giải thích địa chỉ là băm của khoá công khai"]
    example: "khoá RSA đồ chơi (n = 3233): ký giao dịch “A trả B 5” rồi kiểm bằng khoá công khai → đúng; sửa thành “A trả B 50” → chữ ký sai (VER BCH:L03)"
    fix: ["Mất khoá bí mật là mất tài sản — không có “quên mật khẩu”"]
  - id: L04
    title: "Mô hình đồng chưa tiêu và mô hình tài khoản"
    spec: lessons/bch/L04_dong_chua_tieu.yaml
    requires: [L03]
    objectives: ["Lập giao dịch từ các đồng chưa tiêu", "So sánh với mô hình số dư tài khoản"]
    example: "ví có các đồng 5, 3, 2; trả 6 với phí 0,1: dùng 5 + 3 = 8, tạo đầu ra 6 cho người nhận và 1,9 tiền thừa về ví (VER BCH:L04)"
    fix: ["Quên tạo đầu ra tiền thừa thì phần chênh trở thành phí cho người tạo khối"]
  - id: L05
    title: "Bằng chứng công việc: độ khó và số lần thử kỳ vọng"
    spec: lessons/bch/L05_bang_chung_cong_viec.yaml
    requires: [L01]
    requires_ext: ["DMS:L19"]
    objectives: ["Liên hệ độ khó với xác suất mỗi lần thử", "Tính số lần thử kỳ vọng"]
    example: "yêu cầu 16 bit đầu bằng 0: mỗi lần thử trúng với xác suất 2⁻¹⁶, kỳ vọng 65 536 lần; chạy SHA-256 thật trên một khối mẫu trúng ở lần thứ 50 845 (VER BCH:L05)"
    fix: ["Số lần thử có phân phối hình học — một lần trúng sớm hay muộn không nói gì về độ khó"]
  - id: L06
    title: "Đồng thuận Nakamoto: chuỗi nhiều công nhất và số xác nhận"
    spec: lessons/bch/L06_dong_thuan_nakamoto.yaml
    requires: [L05]
    requires_ext: ["DSY:L05"]
    objectives: ["Giải thích chọn chuỗi có tổng công lớn nhất", "Tính xác suất kẻ tấn công đuổi kịp sau z khối"]
    example: "kẻ tấn công nắm 10% sức tính: đuổi kịp sau 6 khối xác nhận với xác suất ≈ 0,0002428; nắm 30%, sau 5 khối ≈ 0,1773523 (khớp bảng Nakamoto 2008, VER BCH:L06)"
    fix: ["Kẻ nắm hơn một nửa sức tính đuổi kịp với xác suất 1 — số xác nhận không cứu được", "Bảng Nakamoto 2008 là XẤP XỈ (số khối kẻ tấn công coi như Poisson); giá trị chính xác (Grunspan, Pérez-Marco 2018, khớp mô phỏng) cao hơn: q = 0,1 cần 6 khối cho dưới 0,1%, không phải 5; q = 0,3 cần 32, không phải 24"]
  - id: L07
    title: "Bằng chứng cổ phần và tính cuối cùng theo đa số hai phần ba"
    spec: lessons/bch/L07_bang_chung_co_phan.yaml
    requires: [L06]
    requires_ext: ["DSY:L05"]
    objectives: ["Giải thích điều kiện n ≥ 3f + 1", "So sánh tính cuối cùng xác suất và tính cuối cùng tất định"]
    example: "100 bên xác thực có cùng quyền biểu quyết: chịu được tối đa 33 bên gian lận; cần 67 phiếu để chốt khối (VER BCH:L07)"
    fix: ["Đa số hai phần ba tính theo CỔ PHẦN, không theo số người — một bên nắm nhiều cổ phần có nhiều phiếu"]
  - id: L08
    title: "Hợp đồng thông minh: máy trạng thái tất định và phí thực thi"
    spec: lessons/bch/L08_hop_dong_thong_minh.yaml
    requires: [L04]
    requires_ext: ["SWF:L08"]
    objectives: ["Mô hình hoá hợp đồng như máy trạng thái", "Tính phí theo đơn vị tính toán"]
    example: "chuyển tiền đơn giản tốn 21 000 đơn vị gas; giá 20 gwei mỗi đơn vị → phí 21 000 · 20 · 10⁻⁹ = 0,00042 ETH (VER BCH:L08)"
    fix: ["Hợp đồng đã triển khai thường không sửa được — lỗi phải phát hiện TRƯỚC khi triển khai"]
  - id: L09
    title: "Lỗi hợp đồng thông minh và cách phòng: gọi lại, tràn số, quyền"
    spec: lessons/bch/L09_loi_hop_dong.yaml
    requires: [L08]
    requires_ext: ["SWF:L09", "SEC:L04"]
    objectives: ["Giải thích lỗi gọi lại ở mức mô hình", "Áp dụng thứ tự kiểm tra → cập nhật trạng thái → gọi ra ngoài"]
    example: "mô phỏng kho 10 đơn vị, kẻ gửi 1: hợp đồng gửi tiền TRƯỚC rồi mới trừ số dư bị rút cạn 10; trừ số dư trước rồi mới gửi → chỉ rút được 1 (VER BCH:L09)"
    fix: ["Kiểm thử chức năng không bắt được lỗi gọi lại — cần nghĩ như kẻ tấn công và dùng công cụ phân tích"]
  - id: L10
    title: "Mở rộng: giới hạn thông lượng, kênh thanh toán, gộp giao dịch"
    spec: lessons/bch/L10_mo_rong.yaml
    requires: [L06]
    requires_ext: ["NET:L02"]
    objectives: ["Tính thông lượng giao dịch của chuỗi gốc", "Giải thích ý tưởng xử lý ngoài chuỗi rồi chốt trên chuỗi"]
    example: "khối 1 MB mỗi 600 s, giao dịch trung bình 250 byte: ≈ 1 000 000 / 250 / 600 ≈ 6,7 giao dịch mỗi giây (VER BCH:L10)"
    fix: ["Tăng kích thước khối làm khó cho nút nhỏ chạy theo — đánh đổi phi tập trung lấy thông lượng"]
  - id: L11
    title: "Nguồn dữ liệu ngoài, quyền riêng tư và giới hạn"
    spec: lessons/bch/L11_nguon_ngoai_rieng_tu.yaml
    requires: [L07, L09]
    requires_ext: ["DSC:L13"]
    objectives: ["Giải thích bài toán nguồn dữ liệu ngoài chuỗi", "Nêu hệ quả quyền riêng tư của sổ cái công khai"]
    example: "lấy trung vị của 7 nguồn giá độc lập: chịu được tối đa 3 nguồn sai mà trung vị vẫn nằm giữa hai giá trị đúng (VER BCH:L11)"
    fix: ["Địa chỉ không phải tên thật nhưng mọi giao dịch công khai vĩnh viễn — phân tích liên kết có thể lộ danh tính"]
  - id: L12
    title: "Tình huống chuyên gia theo dòng thời gian: nâng cấp một chuỗi khối đang chạy"
    spec: lessons/bch/L12_hanh_trinh_dong_thuan.yaml
    requires: [L02, L06, L07, L10, L11]
    kind: journey
    objectives: ["Kể lại hành trình nâng cấp chuỗi khối qua năm chặng (2008 → sau 2022), mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại dung lượng tiêu đề mỗi năm, trọng lượng khối, ngưỡng tín hiệu, số ngày chạy song song, độ dài một kỷ nguyên", "Chọn cách nâng cấp hợp với quy mô mạng của mình, kèm điều kiện đổi lựa chọn"]
    example: "tiêu đề 80 byte, 10 phút một khối → 80 · 6 · 24 · 365 = 4 204 800 byte ≈ 4,2 MB mỗi năm (N08); khối cũ 1 000 000 byte có trọng lượng 3 · 10⁶ + 10⁶ = 4 000 000 = giới hạn mới (B141); ngưỡng 1916/2016 ≈ 95,04%, khối kích hoạt 481 824 = 239 · 2016; chạy song song 1/12/2020 → 15/9/2022 = 653 ngày; kỷ nguyên 32 · 12 giây = 6,4 phút (VER BCH:L12)"
    fix: ["Chỉ khẳng định điều có trong N08, B141, B9, B91, BC16, BC17, E22, E22e, E22p (audit/bch/sources_L12.md); ngày kích hoạt theo lịch của SegWit không có trong nguồn đã đọc — chỉ nói “năm 2017, ở khối 481 824”", "Hai ước tính giảm năng lượng (~99,95% và > 99,988%) khác nguồn — nêu cả hai, không chọn một là sự thật", "Giao dịch 250 byte có 100 byte chữ ký, mạng 5 công ty 200 nút, 90 ngày song song, 100 phần cổ phần là số minh hoạ; không dạy tranh cãi cộng đồng năm 2017, giá, lợi suất đặt cọc; tính dễ sửa mã giao dịch chỉ ở mức khái niệm phòng thủ"]
