# Giáo án KẾ HOẠCH — RBM · Toán cho robot và hệ động lực
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã RBM:Lxx (85/85 PASS, 2026-10-27).
# Căn cứ phạm vi (INFERRED — CS2023 không có lĩnh vực riêng cho robot): các chủ đề nền chung của giáo trình robot nhập môn
#   (biến đổi rigid, động học, phương trình vi phân, điều khiển phản hồi, ước lượng trạng thái, lấy mẫu tín hiệu, lập kế hoạch đường đi).
#   CS115 đã có đại số tuyến tính, Jacobian, trị riêng, tối ưu, xác suất, bình phương tối thiểu — khoá này áp chúng vào chuyển động.
# Vì sao cần: CS115 không có phép quay 3D, phương trình vi phân, điều khiển, lọc Kalman, lấy mẫu — đều là nền bắt buộc cho robot.
# Thứ tự học: sau CS115 L01–L09, L13–L18; CS112 L24 trước L15.
course: RBM
status: planned
lessons:
  - id: L00
    title: "Khung toạ độ và phép quay trong mặt phẳng"
    spec: lessons/rbm/L00_phep_quay_2d.yaml
    requires: []
    requires_ext: ["CS115:L02", "CS115:L04", "CS115:L05"]
    objectives: ["Viết ma trận quay 2D và đọc được vì sao các cột của nó là ảnh của hai trục", "Kiểm RᵀR = I và det R = 1", "Phân biệt quay một điểm với đổi khung toạ độ"]
    example: "quay 90°: (1, 0) → (0, 1); RᵀR = I; det R = 1 (VER RBM:L00)"
    fix: ["Quay hệ trục khác quay điểm — một cái là nghịch đảo (chuyển vị) của cái kia"]
  - id: L01
    title: "Phép quay 3D, góc Euler và khoá gimbal"
    spec: lessons/rbm/L01_quay_3d_euler.yaml
    requires: [L00]
    objectives: ["Viết ba ma trận quay quanh trục x, y, z và ghép chúng", "Thấy thứ tự quay làm đổi kết quả", "Giải thích khoá gimbal: mất một bậc tự do khi góc giữa bằng 90°"]
    example: "Rz(90°)·Rx(90°) ≠ Rx(90°)·Rz(90°) (VER RBM:L01)"
    fix: ["Có 12 quy ước góc Euler — luôn ghi rõ thứ tự trục và quay theo trục cố định hay trục động"]
  - id: L02
    title: "Quaternion đơn vị"
    spec: lessons/rbm/L02_quaternion.yaml
    requires: [L01]
    requires_ext: ["CS115:L06"]
    objectives: ["Nhân hai quaternion theo bảng i, j, k", "Viết quaternion của phép quay góc θ quanh trục u và quay một vector bằng nó", "Biết q và −q cùng là một phép quay"]
    example: "q = (cos 45°, 0, 0, sin 45°) quay (1, 0, 0) thành (0, 1, 0) (VER RBM:L02)"
    fix: ["q và −q cùng biểu diễn một phép quay"]
  - id: L03
    title: "Toạ độ thuần nhất và biến đổi cứng"
    spec: lessons/rbm/L03_toa_do_thuan_nhat.yaml
    requires: [L01]
    objectives: ["Viết ma trận thuần nhất 3 × 3 ghép quay và tịnh tiến", "Ghép nhiều biến đổi đúng thứ tự và đổi khung qua chuỗi", "Tính nghịch đảo của một biến đổi cứng"]
    example: "quay 90° rồi tịnh tiến (2, 0): (1, 0) → (2, 1); đổi thứ tự → (0, 3) (VER RBM:L03)"
    fix: ["Nhân ma trận không giao hoán — đọc chuỗi biến đổi từ phải sang trái"]
  - id: L04
    title: "Động học thuận của tay máy hai khâu"
    spec: lessons/rbm/L04_dong_hoc_thuan.yaml
    requires: [L03]
    objectives: ["Tính vị trí khuỷu và đầu tay từ hai góc khớp", "Viết động học thuận như một chuỗi ma trận thuần nhất", "Tính khoảng cách đầu tay tới gốc, chuẩn bị cho vùng với tới"]
    example: "L₁ = L₂ = 1, θ₁ = 30°, θ₂ = 60°: đầu tay tại (0,866; 1,5) (VER RBM:L04)"
    fix: ["θ₂ là góc tương đối so với khâu 1, không phải so với trục ngang"]
  - id: L05
    title: "Động học ngược: nhiều nghiệm và vô nghiệm"
    spec: lessons/rbm/L05_dong_hoc_nguoc.yaml
    requires: [L04]
    objectives: ["Giải động học ngược tay máy hai khâu bằng định lý cos và atan2", "Tìm cả hai nghiệm và nhận ra điểm ngoài tầm với", "Biết vì sao dùng atan2 thay cho arctan(y/x)"]
    example: "đích (0,866; 1,5): hai nghiệm (30°, 60°) và (90°, −60°) — hai tư thế đối xứng qua đường nối gốc với đích (VER RBM:L05)"
    fix: ["Dùng atan2, không dùng arctan(y/x) — mất góc phần tư"]
  - id: L06
    title: "Jacobian vận tốc và điểm kỳ dị"
    spec: lessons/rbm/L06_jacobian_ky_di.yaml
    requires: [L05]
    requires_ext: ["CS115:L07"]
    objectives: ["Lập Jacobian vận tốc của tay máy hai khâu", "Tính det J = L₁L₂ sin θ₂ và nhận ra cấu hình kỳ dị", "Thấy vận tốc khớp bùng nổ khi tiến gần điểm kỳ dị"]
    example: "det J = L₁L₂ sin θ₂ → θ₂ = 0 (tay duỗi thẳng): det J = 0, kỳ dị (VER RBM:L06)"
    fix: ["Gần điểm kỳ dị, vận tốc khớp cần để đạt một vận tốc đầu tay rất lớn — không chỉ ngay tại đó"]
  - id: L07
    title: "Phương trình vi phân và phương pháp Euler"
    spec: lessons/rbm/L07_ode_euler.yaml
    requires: []
    requires_ext: ["CS115:L06", "CS115:L12"]
    objectives: ["Đọc phương trình vi phân x′ = f(x) như quy tắc “tốc độ thay đổi phụ thuộc trạng thái hiện tại”", "Giải gần đúng bằng phương pháp Euler", "Ước lượng sai số: giảm h một nửa thì sai số giảm khoảng một nửa"]
    example: "x' = −x, x(0) = 1, h = 0,1, 10 bước: 0,9¹⁰ = 0,3487 so với e⁻¹ = 0,3679 (VER RBM:L07)"
    fix: ["Euler sai số toàn cục tỉ lệ với h — giảm h một nửa thì sai số khoảng một nửa"]
  - id: L08
    title: "Runge–Kutta bậc 4 và chọn bước"
    spec: lessons/rbm/L08_runge_kutta.yaml
    requires: [L07]
    requires_ext: ["CS115:L05"]
    objectives: ["Cài đặt một bước Runge–Kutta bậc 4", "So sai số với Euler cùng bước và cùng công sức", "Biết bậc cao không cứu được bước quá lớn với hệ cứng"]
    example: "cùng bài toán, RK4 sai số < 10⁻⁶ (Euler 1,9·10⁻²) (VER RBM:L08)"
    fix: ["Bậc cao không cứu được bước quá lớn với hệ cứng"]
  - id: L09
    title: "Hệ tuyến tính, trị riêng và ổn định"
    spec: lessons/rbm/L09_he_tuyen_tinh_on_dinh.yaml
    requires: [L08, L07, L00]
    requires_ext: ["CS115:L05"]
    objectives: ["Viết hệ bậc hai thành x′ = Ax", "Xét ổn định bằng phần thực của trị riêng", "Phân biệt điều kiện ổn định của hệ liên tục và hệ rời rạc"]
    example: "A = [[0, 1], [−2, −3]]: trị riêng −1, −2 < 0 → ổn định (VER RBM:L09)"
    fix: ["Hệ liên tục ổn định (tiệm cận) khi phần thực trị riêng < 0; hệ rời rạc khi |trị riêng| < 1 — hai điều kiện khác nhau; phần thực bằng 0 chỉ là ổn định biên"]
  - id: L10
    title: "Điều khiển phản hồi và bộ điều khiển PID"
    spec: lessons/rbm/L10_dieu_khien_pid.yaml
    requires: [L09]
    requires_ext: ["CS115:L14"]
    objectives: ["Giải thích vai trò của P, I, D", "Tính sai số xác lập của điều khiển tỉ lệ: 1/(1 + K)", "Thấy hệ số P lớn có thể gây dao động và mất ổn định"]
    example: "hệ bậc nhất, hệ số vòng K = 4: sai số xác lập 1/(1 + K) = 0,2 — cần khâu tích phân để về 0 (VER RBM:L10)"
    fix: ["Tăng hệ số P giảm sai số nhưng có thể gây dao động, mất ổn định"]
  - id: L11
    title: "Rời rạc hoá và ổn định số"
    spec: lessons/rbm/L11_roi_rac_on_dinh_so.yaml
    requires: [L10, L07]
    requires_ext: ["CS115:L09"]
    objectives: ["Tìm điều kiện bước để Euler ổn định: 0 < h < 2/a", "Với hệ nhiều chiều, thấy trị riêng nhanh nhất quyết định bước", "Thấy tốc độ học của Gradient Descent (bước ngược độ dốc để tìm đáy của hàm) tuân cùng điều kiện bước"]
    example: "x_{k+1} = (1 − h·a)x_k, a = 10: h = 0,25 → |−1,5| > 1 phân kỳ; h = 0,05 → 0,5 hội tụ (VER RBM:L11)"
    fix: ["Hệ liên tục ổn định vẫn có thể cho mô phỏng phân kỳ nếu bước quá lớn"]
  - id: L12
    title: "Lọc Kalman một chiều"
    spec: lessons/rbm/L12_kalman_1d.yaml
    requires: [L11]
    requires_ext: ["CS115:L14", "CS115:L17"]
    objectives: ["Kết hợp dự đoán và phép đo theo phương sai", "Giải thích hệ số Kalman như trọng số tối ưu", "Chạy vòng dự đoán – cập nhật một chiều"]
    example: "dự đoán 0 (phương sai 1), đo 1 (phương sai 1) → ước lượng 0,5, phương sai 0,5 (VER RBM:L12)"
    fix: ["Với hệ tuyến tính, lọc Kalman là cách trộn tuyến tính tốt nhất; nhiễu còn phân phối chuẩn thì tốt nhất trong mọi cách; hệ phi tuyến cần bản mở rộng"]
  - id: L13
    title: "Lọc Kalman nhiều chiều: vị trí và vận tốc"
    spec: lessons/rbm/L13_kalman_nhieu_chieu.yaml
    requires: [L12]
    requires_ext: ["CS115:L15"]
    objectives: ["Viết mô hình vận tốc không đổi bằng ma trận F và H", "Chạy một bước dự đoán – cập nhật bằng ma trận", "Thấy hiệp phương sai làm phép đo vị trí sửa được cả vận tốc"]
    example: "trạng thái (vị trí, vận tốc), chỉ đo vị trí: hiệp phương sai lan sang vận tốc qua ma trận chuyển"
    fix: ["Ma trận hiệp phương sai phải giữ đối xứng xác định dương — sai số làm tròn có thể phá vỡ"]
  - id: L14
    title: "Lấy mẫu tín hiệu, chồng phổ và biến đổi Fourier rời rạc"
    spec: lessons/rbm/L14_lay_mau_chong_pho.yaml
    requires: [L07, L00]
    objectives: ["Phát biểu định lý lấy mẫu: tần số lấy mẫu phải lớn hơn hai lần tần số cao nhất", "Tính tần số biểu kiến khi chồng phổ", "Đọc biểu đồ |X_k| của biến đổi Fourier rời rạc"]
    example: "lấy mẫu 10 Hz tín hiệu 7 Hz → hiện thành 3 Hz; Nyquist: cần > 14 Hz (VER RBM:L14)"
    fix: ["Tần số lấy mẫu phải GẤP HƠN HAI lần tần số cao nhất của tín hiệu, không phải bằng"]
  - id: L15
    title: "Lập kế hoạch đường đi: A* trên lưới"
    spec: lessons/rbm/L15_a_sao.yaml
    requires: []
    requires_ext: ["CS112:L24"]
    objectives: ["Chạy A* với ước lượng Manhattan", "Giải thích điều kiện ước lượng không vượt quá giá thật", "Thấy A* mở ít ô hơn Dijkstra"]
    example: "lưới 3 × 4 có tường: từ (1, 0) tới (1, 3) mất 5 bước; ước lượng Manhattan 3 không vượt thật (VER RBM:L15)"
    fix: ["Ước lượng vượt quá thật thì A* có thể trả đường không ngắn nhất"]
  - id: L16
    title: "Hiệu chuẩn cảm biến bằng bình phương tối thiểu"
    spec: lessons/rbm/L16_hieu_chuan_cam_bien.yaml
    requires: []
    requires_ext: ["CS115:L18", "CS115:L44"]
    objectives: ["Khớp mô hình hiệu chuẩn tuyến tính bằng bình phương tối thiểu", "Dùng mô hình để sửa số đọc", "Báo cáo sai số kèm khoảng tin cậy, và biết vì sao không nên dùng ngoài khoảng đã đo"]
    example: "khớp đường thẳng qua (0, 1), (1, 3), (2, 5,1), (3, 6,9): y ≈ 1,98x + 1,03 (VER RBM:L16)"
    fix: ["Khớp tốt trên dữ liệu hiệu chuẩn chưa chắc tốt ngoài khoảng đã đo"]
  - id: L17
    title: "Tình huống chuyên gia theo dòng thời gian: lọc Kalman từ Apollo vào công nghiệp"
    spec: lessons/rbm/L17_hanh_trinh_kalman_apollo.yaml
    requires: [L06, L12, L13]
    see_also: ["ROB:L05", "ESY:L06"]
    kind: journey
    objectives: ["Kể lại hành trình của lọc Kalman qua bốn chặng từ 1960 tới 1985, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại hệ số Kalman sau khoảng đo không đều, sự co của P khi thiếu nhiễu quá trình, phép thử ba lần độ lệch chuẩn và tích U D U chuyển vị", "Chọn công thức và cách giữ ổn định cho bộ lọc trên robot của mình, kèm điều kiện đổi lựa chọn"]
    example: "P = 1, R = 1, Q = 0,5 mỗi giờ (số minh hoạ): đo sau 1 giờ K = 0,6, sau 4 giờ K = 0,75; Q = 0, 99 phép đo → P = 0,01, K ≈ 0,0099 (MS85: P quá nhỏ, phép đo bị bỏ qua), thêm Q = 0,1 → K dừng ở ≈ 0,27; dạng Joseph với K lệch 0,3: 0,85 thay vì 0,7; ngưỡng 3 lần độ lệch chuẩn (MS85: Agena 1961) với P + R = 4 → 6; từ 24 bit (MS85: XDS-920, 1972): 2²⁴ = 16 777 216 mức, tỉ số phương sai 10⁸ vượt, độ lệch chuẩn 10⁴ vừa; U D Uᵀ với U = [[1, 1], [0, 1]], D = I → [[2, 1], [1, 1]] (VER RBM:L17)"
    fix: ["Chỉ khẳng định điều có trong MS85 (NASA TM-86847, 1985; audit/rbm/sources_L17.md); không dạy số bit phần định trị của máy mô phỏng (OCR không đọc chắc), không dạy chi tiết máy tính trên tàu Apollo", "Không nêu tên cá nhân trong lời đọc; tên thuật toán (Potter, Householder, Carlson, Dyer–McReynolds, U-D của Bierman, Joseph) chỉ trên màn hình; dạng căn bậc hai đầu tiên là của Potter (Apollo), phương pháp năm 1968 là bản cho máy phẩy tĩnh nhỏ", "100 phép đo, Q = 0,5 mỗi giờ, h(x) = x², Q = 0,1, P = 3 / R = 1, độ lệch chuẩn 0,1 m / 1000 m, robot của câu đố là số minh hoạ; quy tắc so tỉ số phương sai với 2²⁴ là quy tắc thô (INFERRED), không phải của MS85"]
