# Giáo án KẾ HOẠCH — DSC · Khoa học dữ liệu: từ dữ liệu thô tới kết luận đáng tin
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã DSC:Lxx.
# Căn cứ phạm vi (CITED): ACM Data Science Task Force, “Computing Competencies for Undergraduate Data Science Curricula” (2021,
#   DSTF_Final_Report.pdf, sha256 eaa9929c6b74446c) — 11 lĩnh vực: AP, AI, BDS, CCF, DG, DM, DP, ML, PR, PDA, SDM. Báo cáo ghi rõ cần
#   thêm giải tích, cấu trúc rời rạc, xác suất, thống kê, đại số tuyến tính (CS115, DMS đã có).
# Vì sao cần: CS115 dạy mô hình (hồi quy, phân loại, đánh giá) và thống kê suy luận (L44), nhưng chưa dạy phần chiếm phần lớn công việc thật:
#   làm sạch, nối, xử lý thiếu, trực quan hoá đúng, thiết kế thí nghiệm, bẫy nhân quả, rò rỉ, đạo đức dữ liệu.
# Thứ tự học: sau CS115 L13, L14, L18–L21, L44 và DBS L02–L03. Khoá này không dạy lại mô hình học máy.
course: DSC
status: planned
lessons:
  - id: L00
    title: "Quy trình khoa học dữ liệu: câu hỏi, dữ liệu, phân tích, truyền đạt"
    spec: lessons/dsc/L00_quy_trinh.yaml
    requires: []
    requires_ext: ["CS115:L00"]
    objectives: ["Biết các bước của một phân tích dữ liệu", "Bắt đầu từ câu hỏi rõ ràng", "Phân biệt dữ liệu quan sát và dữ liệu thí nghiệm"]
    example: "câu hỏi “quảng cáo có làm tăng doanh số không?” cần dữ liệu thí nghiệm, không chỉ dữ liệu quan sát"
    fix: ["Dữ liệu nhiều không thay được câu hỏi rõ — phân tích không mục tiêu dễ thành tìm mẫu ngẫu nhiên"]
  - id: L01
    title: "Kiểu dữ liệu và thang đo: định danh, thứ bậc, khoảng, tỉ lệ"
    spec: lessons/dsc/L01_thang_do.yaml
    requires: [L00]
    objectives: ["Phân loại dữ liệu theo bốn thang đo", "Biết phép tính nào có nghĩa với mỗi thang", "Tránh tính trung bình trên nhãn"]
    example: "20 °C không “gấp đôi” 10 °C: theo kelvin chỉ gấp khoảng 1,035 lần (VER DSC:L01)"
    fix: ["Mã hoá loại (1 = Hà Nội, 2 = Huế) thành số rồi lấy trung bình là vô nghĩa"]
  - id: L02
    title: "Dữ liệu gọn, nối bảng và khoá trùng"
    spec: lessons/dsc/L02_du_lieu_gon_noi_bang.yaml
    requires: [L01]
    requires_ext: ["DBS:L02"]
    objectives: ["Sắp dữ liệu về dạng gọn", "Dự đoán số dòng sau khi nối", "Kiểm tính duy nhất của khoá trước khi nối"]
    example: "khoá trùng 2 lần bên trái và 3 lần bên phải → nối ra 6 dòng (VER DSC:L02)"
    fix: ["Luôn kiểm tính duy nhất của khoá ở bảng phía “một” trước khi nối — số dòng tăng âm thầm làm sai mọi tổng"]
  - id: L03
    title: "Dữ liệu thiếu: cơ chế thiếu và cách xử lý"
    spec: lessons/dsc/L03_du_lieu_thieu.yaml
    requires: [L02]
    requires_ext: ["CS115:L13"]
    objectives: ["Phân biệt ba cơ chế thiếu dữ liệu", "Biết xoá dòng và điền trung bình gây sai lệch thế nào", "Chọn cách xử lý phù hợp"]
    example: "điền trung bình vào 2 ô thiếu làm phương sai mẫu giảm từ 6,667 xuống 4,0 (VER DSC:L03)"
    fix: ["Xoá dòng thiếu chỉ chắc chắn không gây lệch khi dữ liệu thiếu hoàn toàn ngẫu nhiên"]
  - id: L04
    title: "Thống kê mô tả bền vững: trung vị, khoảng tứ phân vị, ngoại lai"
    spec: lessons/dsc/L04_thong_ke_ben_vung.yaml
    requires: [L01]
    requires_ext: ["CS115:L44"]
    objectives: ["So sánh trung bình và trung vị khi có ngoại lai", "Tính khoảng tứ phân vị và rào Tukey", "Xử lý ngoại lai đúng cách"]
    example: "{1, 2, 3, 4, 100}: trung bình 22, trung vị 3 (VER DSC:L04)"
    fix: ["Ngoại lai không phải lúc nào cũng là lỗi — có thể là điều quan trọng nhất trong dữ liệu"]
  - id: L05
    title: "Trực quan hoá trung thực"
    spec: lessons/dsc/L05_truc_quan_trung_thuc.yaml
    requires: [L04]
    objectives: ["Nhận ra trục cắt làm phóng đại khác biệt", "Biết khi nào trục phải bắt đầu từ 0", "Tránh các mẹo hình làm sai lệch"]
    example: "cột 51 và 52 vẽ với trục bắt đầu từ 50: cột sau trông cao gấp đôi, thật ra chỉ hơn khoảng 2% (VER DSC:L05)"
    fix: ["Biểu đồ cột phải bắt đầu từ 0 vì người xem so chiều dài; biểu đồ đường thì không bắt buộc"]
  - id: L06
    title: "Tương quan: cách đo và giới hạn"
    spec: lessons/dsc/L06_tuong_quan.yaml
    requires: [L04]
    requires_ext: ["CS115:L15"]
    objectives: ["Đọc đúng ý nghĩa của r", "Thấy một ngoại lai đổi được dấu của r", "Biết r = 0 không có nghĩa là không liên quan"]
    example: "r = 0,775; thêm một điểm ngoại lai (20, −10) → r = −0,933, đổi dấu (VER DSC:L06)"
    fix: ["r = 0 không có nghĩa là không liên quan — y = x² trên đoạn đối xứng có r = 0"]
  - id: L07
    title: "Biến gây nhiễu và nghịch lý Simpson"
    spec: lessons/dsc/L07_simpson.yaml
    requires: [L06]
    objectives: ["Nhận ra biến gây nhiễu", "Hiểu nghịch lý Simpson", "Biết quyết định tách hay gộp dựa vào nhân quả, không theo quy tắc máy móc"]
    example: "sỏi thận (Charig 1986): A tốt hơn trong từng nhóm (93% > 87%, 73% > 69%) nhưng gộp lại A 78% < B 83% (VER DSC:L07)"
    fix: ["Không có quy tắc chung “luôn tách nhóm” hay “luôn gộp” — phải dựa trên hiểu biết nhân quả"]
  - id: L08
    title: "Thiết kế thí nghiệm và thử nghiệm A/B"
    spec: lessons/dsc/L08_thu_nghiem_ab.yaml
    requires: [L07]
    requires_ext: ["CS115:L44"]
    objectives: ["Hiểu vì sao phải chia nhóm ngẫu nhiên", "Ước lượng cỡ mẫu cần thiết", "Tránh dừng sớm khi vừa thấy kết quả đẹp"]
    example: "phát hiện tăng từ 10% lên 11% với α = 0,05, độ mạnh 80% cần 14 751 người mỗi nhóm (VER DSC:L08)"
    fix: ["Dừng thí nghiệm ngay khi thấy p < 0,05 (nhìn trộm) làm tỉ lệ dương tính giả tăng vọt"]
  - id: L09
    title: "Kiểm định nhiều lần và câu cá dữ liệu"
    spec: lessons/dsc/L09_kiem_dinh_nhieu_lan.yaml
    requires: [L08]
    objectives: ["Tính xác suất có ít nhất một kết quả giả khi kiểm nhiều lần", "Hiệu chỉnh mức ý nghĩa", "Hiểu đúng giá trị p"]
    example: "20 kiểm định khi không có hiệu ứng nào: P(ít nhất một kết quả “có ý nghĩa”) ≈ 0,642 (VER DSC:L09)"
    fix: ["Giá trị p không phải xác suất giả thuyết đúng"]
  - id: L10
    title: "Rò rỉ dữ liệu và chia tập đúng cách"
    spec: lessons/dsc/L10_ro_ri_du_lieu.yaml
    requires: [L03]
    requires_ext: ["CS115:L19"]
    objectives: ["Nhận ra rò rỉ dữ liệu", "Học mọi phép biến đổi chỉ trên tập huấn luyện", "Chia tập theo thời gian, theo nhóm khi cần"]
    example: "chuẩn hoá bằng trung bình của cả tập (4,0) thay vì chỉ tập huấn luyện (2,0) đưa thông tin kiểm tra vào mô hình (VER DSC:L10)"
    fix: ["Mọi phép biến đổi học từ dữ liệu (chuẩn hoá, chọn đặc trưng, điền thiếu) phải học chỉ trên tập huấn luyện"]
  - id: L11
    title: "Lớp mất cân bằng, tỉ lệ nền và chọn chỉ số đánh giá"
    spec: lessons/dsc/L11_ti_le_nen.yaml
    requires: [L10]
    requires_ext: ["CS115:L21"]
    objectives: ["Tính giá trị dự đoán dương theo tỉ lệ nền", "Biết vì sao đánh giá trên tập cân bằng đánh lừa", "Chọn ngưỡng theo chi phí nhầm"]
    example: "bệnh hiếm 1%, xét nghiệm nhạy 99%, đặc hiệu 95%: P(bệnh | dương tính) ≈ 0,167 (VER DSC:L11)"
    fix: ["Độ chính xác 99% vô nghĩa khi đoán “luôn khoẻ” cũng được 99%"]
  - id: L12
    title: "Diễn giải hồi quy: hệ số, đa cộng tuyến, khoảng tin cậy"
    spec: lessons/dsc/L12_dien_giai_hoi_quy.yaml
    requires: [L07]
    requires_ext: ["CS115:L18"]
    objectives: ["Đọc đúng một hệ số hồi quy", "Nhận ra đa cộng tuyến và hậu quả của nó", "Không đọc hệ số trên dữ liệu quan sát thành nhân quả"]
    example: "hai biến tương quan 0,9: hệ số phóng đại phương sai VIF ≈ 5,26, sai số chuẩn phình khoảng 2,3 lần (VER DSC:L12)"
    fix: ["Hệ số hồi quy trên dữ liệu quan sát không tự nó chứng minh hiệu ứng nhân quả"]
  - id: L13
    title: "Quyền riêng tư, ẩn danh hoá và đạo đức dữ liệu"
    spec: lessons/dsc/L13_rieng_tu_dao_duc.yaml
    requires: [L02]
    objectives: ["Biết bỏ cột tên chưa phải ẩn danh", "Kiểm và đạt k-ẩn danh bằng khái quát hoá", "Biết giới hạn của k-ẩn danh và nguyên tắc dùng dữ liệu có trách nhiệm"]
    example: "khái quát mã bưu chính và tuổi để mỗi tổ hợp xuất hiện ít nhất 2 lần → bảng 2-ẩn danh (VER DSC:L13)"
    fix: ["Bỏ cột họ tên không phải là ẩn danh hoá — các cột còn lại có thể nối với nguồn khác"]
  - id: L14
    title: "Phân tích tái lập được và truyền đạt kết quả"
    spec: lessons/dsc/L14_tai_lap_truyen_dat.yaml
    requires: [L05, L09]
    requires_ext: ["SWF:L11"]
    objectives: ["Làm một phân tích người khác chạy lại được và ra cùng kết quả", "Báo cáo kết quả kèm độ lớn, độ không chắc chắn, cỡ mẫu", "Viết kết luận đúng phạm vi bằng chứng"]
    example: "báo cáo ghi “tăng 1,2 điểm phần trăm (10,0% → 11,2%), khoảng tin cậy 95% [0,5; 1,9], n = 15 000 mỗi nhóm” thay vì “tăng đáng kể” (VER DSC:L14)"
    fix: ["Một sổ tay chạy được trên máy mình chưa phải là tái lập được"]
  - id: L15
    title: "Tình huống chuyên gia theo dòng thời gian: cuộc thi Netflix Prize 2006–2012"
    spec: lessons/dsc/L15_hanh_trinh_netflix_prize.yaml
    requires: [L08, L09, L10, L13, L14]
    kind: journey
    objectives: ["Kể lại hành trình của cuộc thi Netflix Prize qua năm chặng từ 2006 tới 2012, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính sai số căn quân phương, phần trăm cải thiện, mức lạc quan khi ghép nhiều mô hình trên một tập công khai", "Chọn mô hình đưa vào chạy thật theo được và mất ở quy mô của chính mình, kèm điều kiện đổi lựa chọn"]
    example: "mốc giải: 0,9525 × 0,9 = 0,85725 → 0,8572 (FH12); giải năm đầu (0,9514 − 0,8712)/0,9514 ≈ 8,43% (AM12); bản thắng (0,9525 − 0,8567)/0,9525 ≈ 10,06%, hoà 0,856704 / 0,856714; lạc quan 2 × 800 / 1 408 566 ≈ 0,00114 → √(0,8558² + 0,00114) − 0,8558 ≈ 0,00067 (TJ09), gấp 67 lần khoảng cách hai đội; hai mô hình chạy thật 0,88 → bản thắng chỉ thêm (0,88 − 0,8567)/0,88 ≈ 2,6% (VER DSC:L15)"
    fix: ["Chỉ khẳng định điều có trong BL07, NS07, KO09, TJ09, FH12, AM12 (audit/dsc/sources_L15.md); blog Netflix Technology 2012 không tải được (403/429) — không dạy chi tiết chỉ có ở blog (vd “75% lượt xem”)", "Không nói “800 mô hình được triển khai” hay số mô hình chính xác của bản cuối: nguồn ghi “hàng trăm”, tập 454, bảng ước lượng tới p = 800, bậc tự do 820", "Nhận diện lại người trong dữ liệu chỉ dạy kết quả và bài học phòng thủ; cuộc thi thứ hai bị huỷ năm 2010 không đọc nguồn gốc — không dạy", "Cửa hàng 20 000 khách, sai số 0,95 / 0,90 / 0,89, 2 và 50 mô hình, tập chấm 2000 lượt, trọng số 2 và 1 là số minh hoạ"]
