# Giáo án KẾ HOẠCH — RLN · Học tăng cường
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã RLN:Lxx (giải hệ Bellman bằng sympy, lặp giá trị đến hội tụ,
#   liệt kê chính xác phương sai của ước lượng gradient, mô phỏng phần thưởng bị khai thác).
# Căn cứ phạm vi (CITED): R. Sutton, A. Barto, Reinforcement Learning: An Introduction (bản 2, 2018) — chương 2–6, 9, 13;
#   C. Watkins, P. Dayan, Q-learning (Machine Learning 1992); V. Mnih và cộng sự, DQN (Nature 2015); R. Williams, REINFORCE (1992);
#   J. Schulman và cộng sự, PPO (2017); P. Christiano và cộng sự, học từ sở thích của người (NeurIPS 2017); D. Amodei và cộng sự,
#   “Concrete Problems in AI Safety” (2016) — khai thác phần thưởng; S. Levine và cộng sự, học tăng cường ngoại tuyến (2020).
# Vì sao cần: CS115 L39 giới thiệu quá trình quyết định Markov và Q-learning trong một bài; AIF L12 dạy lặp giá trị khi biết mô hình.
#   Học tăng cường là nền của robot học (ROB), tác tử (AGT) và căn chỉnh mô hình ngôn ngữ (LLM L09) — cần một khoá đủ sâu:
#   giá trị, khám phá, xấp xỉ hàm, gradient chính sách, PPO, phần thưởng từ người, an toàn và đánh giá ngoại tuyến.
# Thứ tự học: sau CS115 L13, L22, L39 và AIF L12.
course: RLN
status: planned
lessons:
  - id: L00
    title: "Bài toán học tăng cường: trạng thái, hành động, phần thưởng và lợi nhuận chiết khấu"
    spec: lessons/rln/L00_loi_nhuan_chiet_khau.yaml
    requires: []
    requires_ext: ["CS115:L39"]
    objectives: ["Tính lợi nhuận chiết khấu G = r₁ + γr₂ + γ²r₃ + …", "Giải thích vai trò của hệ số chiết khấu γ"]
    example: "phần thưởng 1 mãi mãi, γ = 0,9 → G = 1 / (1 − 0,9) = 10; chuỗi 0, 0, 10 → G = 0,9² · 10 = 8,1 (VER RLN:L00)"
    fix: ["γ không chỉ là “mức kiên nhẫn” — với γ = 1 và chuỗi vô hạn, lợi nhuận có thể không hội tụ"]
  - id: L01
    title: "Hàm giá trị và phương trình Bellman kỳ vọng"
    spec: lessons/rln/L01_bellman.yaml
    requires: [L00]
    requires_ext: ["CS115:L03"]
    objectives: ["Viết phương trình Bellman cho một chính sách cố định", "Giải hệ tuyến tính để được giá trị chính xác"]
    example: "A → B thưởng 1, B → A thưởng 0, γ = 0,9: V(A) = 1 + 0,9V(B), V(B) = 0,9V(A) → V(A) = 1/0,19 ≈ 5,263, V(B) ≈ 4,737 (VER RLN:L01)"
    fix: ["Giá trị phụ thuộc chính sách — “giá trị của trạng thái” mà không nói chính sách nào là thiếu"]
  - id: L02
    title: "Lặp chính sách và tốc độ hội tụ của lặp giá trị"
    spec: lessons/rln/L02_lap_chinh_sach.yaml
    requires: [L01]
    requires_ext: ["AIF:L12"]
    objectives: ["Xen kẽ đánh giá và cải thiện chính sách", "Dùng tính co với hệ số γ để ước lượng số vòng lặp cần"]
    example: "sai số giảm ít nhất γ lần mỗi vòng: γ = 0,9 cần k ≥ ln(0,001)/ln(0,9) ≈ 65,6 → 66 vòng để sai số nhỏ 1000 lần; γ = 0,99 cần 688 vòng (VER RLN:L02)"
    fix: ["γ gần 1 làm lặp giá trị chậm hẳn — số vòng tăng khoảng 1/(1 − γ)"]
  - id: L03
    title: "Khám phá và khai thác: kẻ cướp nhiều tay, ε-tham lam, UCB"
    spec: lessons/rln/L03_ke_cuop_nhieu_tay.yaml
    requires: [L00]
    requires_ext: ["AIF:L07"]
    objectives: ["Tính xác suất chọn tay đang tốt nhất theo ε-tham lam", "So sánh khám phá ngẫu nhiên và khám phá theo độ bất định"]
    example: "10 tay, ε = 0,1: tay đang tốt nhất được chọn với xác suất 0,9 + 0,1/10 = 0,91; mỗi tay khác 0,01 (VER RLN:L03)"
    fix: ["ε cố định khám phá mãi cả khi đã chắc — mất mát tích luỹ tăng tuyến tính theo thời gian"]
  - id: L04
    title: "Học từ kinh nghiệm: Monte Carlo và sai phân thời gian TD(0)"
    spec: lessons/rln/L04_monte_carlo_td.yaml
    requires: [L01]
    objectives: ["Ước lượng giá trị bằng trung bình lợi nhuận quan sát", "Cập nhật TD(0) không cần chờ hết lượt chơi"]
    example: "ba lượt chơi cho lợi nhuận 4, 6, 8 → ước lượng Monte Carlo 6; TD(0) với α = 0,5: V = 6, thưởng 1, V(s′) = 10, γ = 0,9 → 6 + 0,5(1 + 9 − 6) = 8 (VER RLN:L04)"
    fix: ["TD dùng ước lượng của chính nó (tự khởi động) — nhanh hơn nhưng có thiên lệch khi ước lượng ban đầu sai"]
  - id: L05
    title: "Q-learning và SARSA: học ngoài chính sách và theo chính sách"
    spec: lessons/rln/L05_q_learning_sarsa.yaml
    requires: [L04, L03]
    objectives: ["Viết cập nhật Q-learning và SARSA cho cùng một bước", "Giải thích vì sao SARSA chọn đường an toàn hơn khi còn khám phá"]
    example: "Q(s, a) = 2, thưởng −1, γ = 1, α = 0,1: Q-learning dùng max Q(s′) = 5 → 2,2; SARSA dùng hành động thật vừa chọn Q(s′, a′) = 1 → 1,8 (VER RLN:L05)"
    fix: ["Q-learning học giá trị của chính sách tham lam, không phải của chính sách đang chạy có khám phá"]
  - id: L06
    title: "Xấp xỉ hàm và mạng Q sâu: bộ nhớ phát lại, mạng mục tiêu"
    spec: lessons/rln/L06_dqn.yaml
    requires: [L05]
    requires_ext: ["CS115:L22"]
    objectives: ["Tính mục tiêu hồi quy y = r + γ max Q_mục tiêu", "Giải thích bộ ba nguy hiểm: xấp xỉ hàm, tự khởi động, ngoài chính sách"]
    example: "r = 1, γ = 0,99, max Q_mục tiêu = 10 → y = 10,9; bộ nhớ phát lại 1 triệu bước, mỗi lô lấy ngẫu nhiên 32 → hai mẫu liền nhau trong lô hiếm khi là hai bước liền nhau (VER RLN:L06)"
    fix: ["Không có mạng mục tiêu, mục tiêu đổi theo mỗi bước cập nhật — hồi quy đuổi theo đích di động và có thể phân kỳ"]
  - id: L07
    title: "Gradient chính sách REINFORCE và đường cơ sở giảm phương sai"
    spec: lessons/rln/L07_reinforce.yaml
    requires: [L00]
    requires_ext: ["CS115:L20", "CS115:L13"]
    objectives: ["Viết ước lượng gradient G · ∇ log π", "Chứng minh trừ đường cơ sở không đổi kỳ vọng nhưng giảm phương sai"]
    example: "hai hành động xác suất 0,5, lợi nhuận 10 và 12: ước lượng gradient nhận 5 hoặc −6, phương sai 30,25; trừ đường cơ sở 11 → cả hai đều −0,5, phương sai 0, cùng kỳ vọng −0,5 (VER RLN:L07)"
    fix: ["Đường cơ sở phụ thuộc trạng thái thì được, phụ thuộc hành động thì làm lệch gradient"]
  - id: L08
    title: "Diễn viên–nhà phê bình và hàm lợi thế"
    spec: lessons/rln/L08_actor_critic.yaml
    requires: [L07, L04]
    objectives: ["Tính lợi thế A = r + γV(s′) − V(s)", "Kết hợp chính sách (diễn viên) với ước lượng giá trị (nhà phê bình)"]
    example: "r = 1, γ = 0,9, V(s′) = 5, V(s) = 4 → A = 1 + 4,5 − 4 = 1,5 > 0: hành động tốt hơn mức trung bình, tăng xác suất của nó (VER RLN:L08)"
    fix: ["Lợi thế dùng V ước lượng — nhà phê bình sai thì diễn viên học sai; theo dõi cả hai mất mát"]
  - id: L09
    title: "Tối ưu chính sách gần kề (PPO): cắt tỉ số để bước cập nhật an toàn"
    spec: lessons/rln/L09_ppo.yaml
    requires: [L08]
    objectives: ["Tính mục tiêu cắt min(ρA, clip(ρ, 1 − ε, 1 + ε)A)", "Giải thích vì sao cắt ngăn chính sách đổi quá xa sau một lô"]
    example: "ε = 0,2: tỉ số 1,5, lợi thế 2 → min(3; 2,4) = 2,4; tỉ số 0,5, lợi thế −2 → min(−1; −1,6) = −1,6 (VER RLN:L09)"
    fix: ["Cắt chỉ chặn phía có lợi — phía bất lợi vẫn bị phạt đủ, nên mục tiêu là cận dưới bi quan"]
  - id: L10
    title: "Học phần thưởng từ sở thích của người: mô hình Bradley–Terry và phạt độ lệch"
    spec: lessons/rln/L10_phan_thuong_tu_nguoi.yaml
    requires: [L09]
    requires_ext: ["LLM:L09"]
    objectives: ["Tính xác suất người chọn A hơn B từ chênh lệch điểm thưởng", "Giải thích vai trò của phạt độ lệch so với mô hình gốc"]
    example: "điểm thưởng A hơn B 1 đơn vị → P(A hơn B) = σ(1) ≈ 0,731; chênh 0 → 0,5; mất mát khi người chọn A: −ln 0,731 ≈ 0,313 (VER RLN:L10)"
    fix: ["Mô hình phần thưởng chỉ đúng gần dữ liệu đã thấy — tối ưu quá mạnh sẽ tìm ra chỗ nó sai (bài 11)"]
  - id: L11
    title: "Khai thác phần thưởng: khi tác tử làm đúng điều ta viết, không phải điều ta muốn"
    spec: lessons/rln/L11_khai_thac_phan_thuong.yaml
    requires: [L00]
    objectives: ["Phát hiện phần thưởng có thể bị khai thác bằng cách tính lợi nhuận của hành vi lạ", "Thiết kế phần thưởng theo kết quả, kèm ràng buộc và giám sát"]
    example: "đua thuyền: về đích +100 sau 100 bước; mỗi lần chạm mốc thưởng +1, mốc hiện lại mỗi 5 bước; trong 1000 bước, quay vòng ăn mốc được 200 > 100 → chính sách tối ưu là không về đích (số minh hoạ, VER RLN:L11)"
    fix: ["Phạt thêm một điều cấm chỉ chuyển chỗ khai thác — cần kiểm tra hành vi định tính, không chỉ nhìn điểm"]
  - id: L12
    title: "Tình huống chuyên gia: đánh giá chính sách mới từ nhật ký cũ — trọng số quan trọng và phương sai bùng nổ"
    spec: lessons/rln/L12_danh_gia_ngoai_tuyen.yaml
    requires: [L04, L07]
    requires_ext: ["DSC:L08"]
    objectives: ["Ước lượng giá trị chính sách mới bằng trọng số π_mới/π_cũ", "Nhận ra khi nào nhật ký không đủ để kết luận và phải thử trực tuyến có kiểm soát"]
    example: "chính sách cũ chọn hành động với xác suất 0,1, mới 0,9 → trọng số 9 mỗi bước; 10 bước mỗi bước trọng số 2 → tích 1024: vài lượt chơi quyết định cả ước lượng (VER RLN:L12)"
    fix: ["Chuyên gia nhìn số mẫu hiệu dụng (Σw)² / Σw² trước khi tin con số ước lượng — nhỏ thì phải chạy thử A/B"]
  - id: L13
    title: "Tình huống chuyên gia theo dòng thời gian: học chơi trò Atari từ 7 trò năm 2013 tới cả 57 trò năm 2020"
    spec: lessons/rln/L13_hanh_trinh_atari.yaml
    requires: [L06, L12]
    requires_ext: ["AIF:L14"]
    objectives: ["Kể lại năm chặng 2013–2020 của học tăng cường sâu trên trò Atari, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại số ngày chơi của 200 triệu khung hình, điểm chuẩn hoá theo người và chi phí số lần chạy", "Chọn quy trình đánh giá (số lần chạy, mốc báo cáo, hành động dính) cho dự án ở quy mô của mình"]
    example: "200 triệu khung hình ở 60 khung/giây ≈ 38,6 ngày chơi (CITED Machado và cộng sự 2018: “approximately 38 days”); trò Skiing: điểm tối ưu −3272, người −4336,9, ngẫu nhiên −17 098,1 → điểm chuẩn hoá tối đa ≈ 108,3% (CITED Agent57 2020; VER RLN:L13)"
    fix: ["“50 triệu khung hình” của DQN 2015 đếm bước quyết định (mỗi bước lặp 4 khung) — cùng 38 ngày với “200 triệu khung hình” của Machado 2018; so số khung giữa hai bài báo phải hỏi khung nào", "Không nói “Agent57 giỏi hơn người ở mọi trò”: nguồn ghi vượt mốc điểm chuẩn của người thử nghiệm trên cả 57 trò"]
