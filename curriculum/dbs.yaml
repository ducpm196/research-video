# Giáo án KẾ HOẠCH — DBS · Cơ sở dữ liệu
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã DBS:Lxx (SQL chạy thật trên sqlite3 trong script).
# Căn cứ phạm vi: CS2023 — Data Management (DM, 10 giờ CS Core; “1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98);
#   ACM Data Science Task Force 2021 — “Data Acquisition, Management, and Governance (DG)” (báo cáo DSTF_Final_Report.pdf, sha256 eaa9929c6b74446c).
# Vì sao cần: mọi phần mềm, khoa học dữ liệu, dữ liệu lớn và MLOps đều đứng trên mô hình quan hệ, chỉ mục, giao dịch.
#   CS112 dạy bảng băm, cây tìm kiếm; DMS dạy tập hợp, quan hệ — khoá này nối chúng thành hệ quản trị dữ liệu.
# Thứ tự học: sau DMS (L05, L07), CS112 (L05, L06, L23), CSA L10, OSY L04–L06.
course: DBS
status: planned
lessons:
  - id: L00
    title: "Mô hình quan hệ: bảng, khoá chính, khoá ngoại, ràng buộc toàn vẹn"
    spec: lessons/dbs/L00_mo_hinh_quan_he.yaml
    requires: []
    requires_ext: ["DMS:L07", "CS115:L01"]
    objectives: ["Đọc lược đồ quan hệ: bảng, cột, dòng, miền giá trị", "Giải thích khoá chính, khoá ngoại và ràng buộc toàn vẹn tham chiếu", "Biết quan hệ là tập các dòng: không thứ tự, không trùng"]
    example: "thêm sinh viên thuộc lớp 'K9' không có trong bảng Lop → hệ quản trị từ chối (VER DBS:L00)"
    fix: ["Quan hệ là TẬP các bộ — không có thứ tự dòng; muốn có thứ tự phải ORDER BY"]
  - id: L01
    title: "Đại số quan hệ: chọn, chiếu, tích, nối"
    spec: lessons/dbs/L01_dai_so_quan_he.yaml
    requires: [L00]
    requires_ext: ["DMS:L05"]
    objectives: ["Viết truy vấn bằng phép chọn, chiếu, nối", "Đếm số dòng của tích và của phép nối", "Biết nối = tích rồi chọn"]
    example: "SinhVien (4 dòng) × Lop (2 dòng) = 8 dòng; nối theo khoá ngoại còn 3 dòng vì một sinh viên có lớp NULL (VER DBS:L01)"
    fix: ["Nối không có điều kiện là tích Đề-các — nguồn của kết quả phình to bất ngờ"]
  - id: L02
    title: "SQL: SELECT, WHERE, JOIN, ORDER BY"
    spec: lessons/dbs/L02_sql_co_ban.yaml
    requires: [L01]
    objectives: ["Dịch câu hỏi sang SQL: SELECT, FROM, WHERE, ORDER BY", "Phân biệt nối trong và nối ngoài", "Hiểu SQL là ngôn ngữ khai báo"]
    example: "SELECT ten FROM SinhVien WHERE diem >= 7 → An, Chi, Dũng (VER DBS:L02)"
    fix: ["SQL là ngôn ngữ khai báo: viết CÁI cần lấy, hệ quản trị tự chọn CÁCH lấy"]
  - id: L03
    title: "Gom nhóm, hàm tổng hợp và giá trị NULL (lôgic ba trị)"
    spec: lessons/dbs/L03_gom_nhom_null.yaml
    requires: [L02]
    requires_ext: ["DMS:L00"]
    objectives: ["Dùng COUNT, SUM, AVG, MAX với GROUP BY và HAVING", "Giải thích vì sao “cột = NULL” không bao giờ đúng", "Nhận ra bẫy NULL trong NOT IN và trong điều kiện khác"]
    example: "COUNT(*) = 4 nhưng COUNT(lop) = 3; “lop = NULL” trả 0 dòng, “lop IS NULL” trả 1 dòng (VER DBS:L03)"
    fix: ["So sánh với NULL cho UNKNOWN, không cho TRUE hay FALSE — WHERE chỉ giữ dòng TRUE"]
  - id: L04
    title: "Phụ thuộc hàm, bao đóng thuộc tính và khoá"
    spec: lessons/dbs/L04_phu_thuoc_ham.yaml
    requires: [L01]
    requires_ext: ["DMS:L04"]
    objectives: ["Đọc phụ thuộc hàm X → Y từ ngữ nghĩa dữ liệu", "Tính bao đóng thuộc tính X⁺", "Tìm khoá từ tập phụ thuộc hàm"]
    example: "R(A, B, C, D), F = {A→B, B→C}: A⁺ = {A, B, C}; (AD)⁺ = R nên AD là khoá (VER DBS:L04)"
    fix: ["Phụ thuộc hàm là ràng buộc của NGỮ NGHĨA dữ liệu, không suy ra được từ vài dòng mẫu"]
  - id: L05
    title: "Chuẩn hoá: dị thường cập nhật, 3NF, BCNF và tách không mất thông tin"
    spec: lessons/dbs/L05_chuan_hoa.yaml
    requires: [L04]
    objectives: ["Nhận ra dị thường chèn, sửa, xoá", "Kiểm BCNF và tách theo phụ thuộc vi phạm", "Kiểm một phép tách có mất thông tin không"]
    example: "DK(mssv, lop, mon) với mssv → lop: tách theo mssv rồi nối lại đúng 3 dòng ban đầu; tách theo lop (không xác định gì) thì 2 dòng nối lại thành 4 dòng, trong đó 2 dòng giả (VER DBS:L05)"
    fix: ["Chuẩn hoá không phải luôn tốt hơn — hệ phân tích thường cố ý phi chuẩn hoá để đọc nhanh"]
  - id: L06
    title: "Thiết kế thực thể–liên kết và chuyển thành bảng"
    spec: lessons/dbs/L06_thiet_ke_er.yaml
    requires: [L05]
    objectives: ["Vẽ mô hình thực thể–liên kết từ mô tả nghiệp vụ", "Chuyển liên kết một–nhiều thành khoá ngoại, nhiều–nhiều thành bảng nối", "Nhận ra vi phạm 1NF khi lưu danh sách trong một ô"]
    example: "SinhVien – ĐăngKý – MônHọc: liên kết nhiều–nhiều cần bảng DangKy(mssv, ma_mon, diem) với khoá chính gồm cả hai cột mssv, ma_mon"
    fix: ["Lưu danh sách “M1,M2” trong một ô vi phạm 1NF (tìm “chứa M1” trả nhầm cả M10) và không đặt khoá ngoại được"]
  - id: L07
    title: "Lưu trữ: trang đĩa, tệp heap và chi phí quét"
    spec: lessons/dbs/L07_luu_tru_trang.yaml
    requires: [L00]
    requires_ext: ["CSA:L10", "OSY:L12"]
    objectives: ["Ước lượng số trang của một bảng", "Giải thích vì sao đơn vị chi phí là số lần đọc trang", "So sánh đọc tuần tự và đọc ngẫu nhiên"]
    example: "10⁶ dòng, 100 dòng mỗi trang → 10 000 trang; quét toàn bảng = 10 000 lần đọc (VER DBS:L07)"
    fix: ["Đọc tuần tự và đọc ngẫu nhiên khác nhau rất xa trên đĩa quay; SSD thu hẹp nhưng không xoá khoảng cách"]
  - id: L08
    title: "Chỉ mục cây B+"
    spec: lessons/dbs/L08_cay_b_cong.yaml
    requires: [L07]
    requires_ext: ["CS112:L05"]
    objectives: ["Giải thích vì sao cây B+ thấp", "Ước lượng số lần đọc trang khi tra một khoá và khi tra một khoảng", "Biết cái giá của chỉ mục khi ghi"]
    example: "bậc rẽ nhánh 100, 10⁶ khoá: chiều cao 3, tức 3 lần đọc thay vì 10 000 (VER DBS:L08)"
    fix: ["Chỉ mục tăng tốc đọc nhưng làm chậm ghi và tốn chỗ — không đánh chỉ mục mọi cột"]
  - id: L09
    title: "Chỉ mục băm và lựa chọn chỉ mục"
    spec: lessons/dbs/L09_chi_muc_bam.yaml
    requires: [L08]
    requires_ext: ["CS112:L06"]
    objectives: ["So sánh chỉ mục băm và cây B+", "Biết chỉ mục ghép (a, b) giúp truy vấn nào", "Chọn chỉ mục theo mẫu truy vấn"]
    example: "truy vấn khoảng “diem BETWEEN 7 AND 9” dùng được cây B+ nhưng không dùng được chỉ mục băm (VER DBS:L09)"
    fix: ["Chỉ mục ghép (a, b) không giúp truy vấn chỉ lọc theo b"]
  - id: L10
    title: "Thực thi và tối ưu truy vấn: các thuật toán nối"
    spec: lessons/dbs/L10_thuat_toan_noi.yaml
    requires: [L08, L02]
    requires_ext: ["CS112:L23"]
    objectives: ["Ước lượng chi phí nối lồng, nối lồng theo khối, nối băm, nối trộn", "Đọc kế hoạch thực thi của hệ quản trị", "Biết thứ tự viết bảng không quyết định thứ tự nối"]
    example: "R 1000 trang, S 500 trang: vòng lặp lồng theo trang 501 000 lần đọc, nối băm khoảng 4500 (VER DBS:L10)"
    fix: ["Thứ tự viết bảng trong câu SQL không quyết định thứ tự nối — bộ tối ưu quyết định dựa trên thống kê"]
  - id: L11
    title: "Giao dịch và tính chất ACID"
    spec: lessons/dbs/L11_giao_dich_acid.yaml
    requires: [L02]
    requires_ext: ["OSY:L04"]
    objectives: ["Giải thích từng chữ của ACID", "Thấy tính nguyên tử trên một phép chuyển tiền thất bại", "Nhận ra lỗi mất cập nhật khi hai giao dịch chen nhau"]
    example: "hai giao dịch cùng đọc số dư 100, mỗi bên cộng 10 rồi ghi → 110 thay vì 120 (VER DBS:L11)"
    fix: ["“Nhất quán” trong ACID là giữ ràng buộc của ứng dụng — khác “nhất quán” trong định lý CAP"]
  - id: L12
    title: "Lịch thực thi, tuần tự hoá xung đột và đồ thị ưu tiên"
    spec: lessons/dbs/L12_tuan_tu_hoa.yaml
    requires: [L11]
    requires_ext: ["CS112:L07"]
    objectives: ["Nhận ra hai thao tác xung đột", "Dựng đồ thị ưu tiên của một lịch", "Kết luận tuần tự hoá xung đột được hay không bằng kiểm chu trình"]
    example: "R1(A) W2(A) R2(B) W1(B): cạnh T1→T2 và T2→T1 tạo chu trình → không tuần tự hoá xung đột được (VER DBS:L12)"
    fix: ["Kết quả cuối “trông đúng” với một bộ dữ liệu không chứng minh lịch là tuần tự hoá được"]
  - id: L13
    title: "Khoá hai pha và bế tắc trong cơ sở dữ liệu"
    spec: lessons/dbs/L13_khoa_hai_pha.yaml
    requires: [L12]
    requires_ext: ["OSY:L06"]
    objectives: ["Phân biệt khoá chia sẻ và khoá độc quyền", "Giải thích vì sao khoá hai pha bảo đảm tuần tự hoá", "Phát hiện bế tắc bằng đồ thị chờ"]
    example: "T1 giữ khoá A chờ B, T2 giữ B chờ A → đồ thị chờ có chu trình, hệ quản trị huỷ một giao dịch (VER DBS:L13)"
    fix: ["Khoá hai pha không tránh được bế tắc — chỉ bảo đảm tính tuần tự hoá"]
  - id: L14
    title: "Ghi nhật ký trước và khôi phục sau sự cố"
    spec: lessons/dbs/L14_nhat_ky_khoi_phuc.yaml
    requires: [L11]
    objectives: ["Giải thích quy tắc ghi nhật ký trước", "Phân biệt làm lại và huỷ khi khôi phục", "Hiểu commit nghĩa là bản ghi nhật ký đã xuống đĩa bền"]
    example: "giao dịch đã commit nhưng trang dữ liệu chưa ghi xuống đĩa thì mất điện: khởi động lại, làm lại theo nhật ký"
    fix: ["Commit nghĩa là bản ghi nhật ký đã xuống đĩa bền — không phải trang dữ liệu đã được ghi"]
  - id: L15
    title: "Mức cô lập và các dị thường đọc"
    spec: lessons/dbs/L15_muc_co_lap.yaml
    requires: [L13]
    objectives: ["Phân biệt đọc bẩn, đọc không lặp lại, bóng ma", "Đọc bảng mức cô lập của chuẩn SQL", "Chọn mức cô lập phù hợp, và không giả định mặc định"]
    example: "READ COMMITTED: đọc cùng một dòng hai lần trong một giao dịch có thể ra hai giá trị khác nhau"
    fix: ["Mức cô lập mặc định của mỗi hệ quản trị khác nhau — phải kiểm, không giả định là SERIALIZABLE"]
  - id: L16
    title: "Ngoài mô hình quan hệ: khoá–giá trị, văn bản, cột rộng, đồ thị"
    spec: lessons/dbs/L16_ngoai_quan_he.yaml
    requires: [L15]
    objectives: ["Nêu bốn mô hình dữ liệu ngoài quan hệ và mẫu truy cập hợp với mỗi mô hình", "So sánh truy vấn bạn của bạn trên bảng và trên đồ thị", "Biết khi nào nên giữ cơ sở dữ liệu quan hệ"]
    example: "đếm bạn của bạn: cơ sở dữ liệu đồ thị duyệt cạnh trực tiếp, cơ sở dữ liệu quan hệ cần tự nối bảng hai lần"
    fix: ["“NoSQL” không có nghĩa là không có lược đồ — lược đồ chuyển vào mã ứng dụng"]
  - id: L17
    title: "Tình huống chuyên gia theo dòng thời gian: thêm cột khi bảng có hàng triệu dòng"
    spec: lessons/dbs/L17_hanh_trinh_them_cot.yaml
    requires: [L07, L11, L13, L14]
    see_also: ["DVO:L08"]
    kind: journey
    objectives: ["Kể lại hành trình đổi lược đồ ở quy mô lớn qua năm chặng từ 2009 tới 2022, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại thời gian chép bù theo lô, số lô, thời gian khi bị điều tiết và số lần thêm cột tức thì còn lại", "Chọn cách thêm cột hợp với quy mô của chính mình, kèm điều kiện đổi lựa chọn"]
    example: "bảng 5 000 000 dòng (số minh hoạ), lô 1000 dòng trong 0,5 giây (mặc định PT11) → 5000 lô, 2500 giây = 41 phút 40 giây; 10⁸ đối tượng, 1 giây mỗi cái → ≈ 3,17 năm (ST17: “over three years”); 10⁸ / 1000 lô = 100 000 lô (VER DBS:L17)"
    fix: ["Chỉ khẳng định điều có trong PT11, GH16, ST17, MY18, PG18, MY22 (audit/dbs/sources_L17.md); năm ra đời riêng của pt-online-schema-change không có trong nguồn — nói “công cụ từ 2009, bộ công cụ 2011”", "Bảng 5 triệu dòng (≈ 0,4 GB = 50 000 trang 8 KB), 28 giờ chép, 1000 tiến trình, 2 thay đổi mỗi tháng là số minh hoạ; khi chạm giới hạn 64 phiên bản dòng thì MySQL làm gì — nguồn không ghi, không dạy", "Đổi so với ROADMAP §8.1 mục 3 (Dynamo → DynamoDB): theo ví dụ của người dùng “thêm một cột khi đã có vài triệu người dùng”"]
