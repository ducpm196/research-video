# Giáo án — HCI · Tương tác người–máy
# Trạng thái: active. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã HCI:Lxx (định luật Fitts và Hick–Hyman, mô hình phím bấm KLM,
#   công thức Nielsen–Landauer, điểm SUS, hình vuông Latin, mốc thời gian của báo cáo FCC, hành trình WCAG 1.0 → 2.2).
# Căn cứ phạm vi (CITED): CS2023 lĩnh vực HCI; D. Norman, The Design of Everyday Things (bản 2013); P. Fitts (1954), I. S. MacKenzie (1992) — dạng Shannon;
#   W. Hick (1952), R. Hyman (1953); S. Card, T. Moran, A. Newell, mô hình KLM (CACM 1980, Fig. 1 tr. 399): K = 0,2 s, P = 1,1 s, H = 0,4 s, M = 1,35 s (nút chuột tính là K); B = 0,1 s theo D. Kieras (2001), tr. 2;
#   J. Nielsen, T. Landauer (INTERCHI 1993) — tỉ lệ phát hiện 31% mỗi người thử; J. Brooke, SUS (1996); G. Miller (1956), N. Cowan (2001);
#   W3C WCAG 1.0 (1999), 2.0 (2008), 2.1 (2018), 2.2 (2023) — tiêu chí 2.5.8 kích thước đích tối thiểu 24 × 24 px; FCC Public Safety and Homeland Security Bureau,
#   báo cáo cảnh báo giả Hawaii ngày 13/1/2018 (tháng 4/2018) — đọc trong phiên 2026-10-30.
# Vì sao cần: WEB L11 dạy độ tương phản và truy cập ở mức kỹ thuật web. Chưa có khoá dạy cách đo và thiết kế cho người dùng:
#   mô hình tâm trí, định luật định lượng, kiểm thử khả dụng, thí nghiệm giao diện, thiết kế chống lỗi — phần lõi của sản phẩm, công cụ vận hành, AI cho người dùng cuối.
# Thứ tự học: sau CS115 L12 (lôgarit), DSC L08 (thí nghiệm).
course: HCI
status: active
lessons:
  - id: L00
    title: "Lỗi do thiết kế, không do người dùng: hộp xác nhận giống hệt nhau"
    spec: lessons/hci/L00_loi_do_thiet_ke.yaml
    requires: []
    objectives: ["Phân biệt lỗi trượt (định làm đúng, tay làm sai) với lỗi nhầm (hiểu sai tình huống)", "Nhận ra giao diện cho cùng phản hồi cho hai hành động hậu quả khác nhau", "Tính khoảng thời gian từ lúc phát cảnh báo giả tới lúc gửi thông điệp đính chính"]
    example: "Hawaii 13/1/2018 (CITED FCC): hộp xác nhận “Are you sure that you want to send this Alert?” giống hệt cho tập trận và cảnh báo thật, không cho xem trước nội dung; cảnh báo giả gửi 8:07, đính chính qua hệ thống cảnh báo lúc 8:45 → 38 phút (VER HCI:L00)"
    fix: ["Kết luận “nhân viên bấm nhầm” là dừng quá sớm — báo cáo FCC kết luận do cả lỗi người và thiếu cơ chế an toàn"]
  - id: L01
    title: "Mô hình tâm trí, dấu hiệu gợi ý và ánh xạ tự nhiên"
    spec: lessons/hci/L01_mo_hinh_tam_tri.yaml
    requires: [L00]
    requires_ext: ["DMS:L09"]
    objectives: ["Đếm số cách hiểu của một bảng điều khiển không có ánh xạ tự nhiên", "Thiết kế bố cục điều khiển trùng bố cục vật được điều khiển", "Phân biệt mô hình tâm trí, dấu hiệu gợi ý và ánh xạ tự nhiên trên sản phẩm thật"]
    example: "bếp 4 lò xếp ô vuông, 4 núm xoay xếp hàng ngang: có 4! = 24 cách ghép núm với lò người dùng có thể đoán; xếp núm theo cùng ô vuông → chỉ 1 cách tự nhiên (VER HCI:L01)"
    fix: ["Nhãn chữ là cứu chữa sau cùng — nếu cần nhãn để hiểu cái nút làm gì thì bố cục đã chưa đủ rõ"]
  - id: L02
    title: "Định luật Fitts: thời gian trỏ tới một đích"
    spec: lessons/hci/L02_dinh_luat_fitts.yaml
    requires: [L00]
    requires_ext: ["CS115:L12"]
    objectives: ["Tính độ khó log₂(D/W + 1) và thời gian a + b · độ khó", "Giải thích vì sao mép và góc màn hình là đích lớn", "So sánh bằng số lợi ích của việc tăng bề rộng nút hoặc đặt nút gần con trỏ"]
    example: "a = 0,1 s, b = 0,15 s/bit: khoảng cách 256, rộng 16 → log₂ 17 ≈ 4,09 bit, ≈ 0,713 s; rộng 64 → log₂ 5 ≈ 2,32 bit, ≈ 0,448 s (VER HCI:L02)"
    fix: ["a, b phải đo cho từng thiết bị và người dùng — dùng hằng số của chuột cho màn hình cảm ứng là sai"]
  - id: L03
    title: "Định luật Hick–Hyman: thời gian chọn trong n lựa chọn"
    spec: lessons/hci/L03_hick_hyman.yaml
    requires: [L02]
    objectives: ["Tính thời gian chọn b · log₂(n + 1)", "So sánh thực đơn phẳng với thực đơn hai cấp", "Nhận biết khi nào thời gian chọn tăng theo lôgarit và khi nào tăng tuyến tính"]
    example: "b = 0,2 s: 15 mục phẳng → 0,2 · log₂ 16 = 0,8 s; chia hai cấp 3 rồi 5 mục → 0,4 + 0,2 · log₂ 6 ≈ 0,917 s — phẳng nhanh hơn khi người dùng biết tên mục cần tìm (VER HCI:L03)"
    fix: ["Định luật chỉ đúng khi các lựa chọn quen thuộc và xếp có trật tự; người mới phải dò từng mục, thời gian tuyến tính"]
  - id: L04
    title: "Trí nhớ làm việc, gom nhóm và tải nhận thức"
    spec: lessons/hci/L04_tai_nhan_thuc.yaml
    requires: [L00]
    objectives: ["Gom thông tin thành nhóm để giảm số đơn vị phải nhớ", "Chuyển việc ghi nhớ sang việc nhận ra trên màn hình", "Phân biệt giới hạn của trí nhớ làm việc với số mục hiển thị trên thực đơn"]
    example: "mã 6 chữ số 482913 là 6 đơn vị; tách 482 913 còn 2 nhóm; chuỗi 12 ký tự ngẫu nhiên không nhóm được vượt quá khoảng 4 nhóm mà trí nhớ làm việc giữ được (VER HCI:L04)"
    fix: ["“7 ± 2” của Miller là về khoảng nhớ chữ số trong thí nghiệm, không phải quy tắc thiết kế “thực đơn tối đa 7 mục”"]
  - id: L05
    title: "Mô hình phím bấm KLM: ước lượng thời gian thao tác trước khi làm"
    spec: lessons/hci/L05_mo_hinh_klm.yaml
    requires: [L02]
    objectives: ["Cộng thời gian các thao tác K, P, B, H, M cho một nhiệm vụ", "So sánh hai thiết kế bằng số trước khi viết mã", "Nhận biết giới hạn của mô hình: chỉ áp dụng cho người dùng thành thạo, thao tác không lỗi"]
    example: "xoá tệp bằng chuột: H + M + P + BB + M + P + BB = 0,4 + 1,35 + 1,1 + 0,2 + 1,35 + 1,1 + 0,2 = 5,7 s; bằng phím tắt khi tay đang trên bàn phím: M + K + K = 1,75 s (VER HCI:L05)"
    fix: ["KLM chỉ cho người thành thạo, không lỗi — không ước lượng được thời gian học hay thời gian sửa lỗi"]
  - id: L06
    title: "Kiểm thử khả dụng: bao nhiêu người thử là đủ"
    spec: lessons/hci/L06_kiem_thu_kha_dung.yaml
    requires: [L00]
    requires_ext: ["DMS:L19"]
    objectives: ["Tính tỉ lệ vấn đề khả dụng phát hiện được 1 − (1 − λ)ⁿ sau khi cho n người thử độc lập", "Giải thích vì sao 5 người thử phát hiện khoảng 84,4% vấn đề có λ = 0,31 nhưng 15 người chỉ tăng thêm khoảng 15,2 điểm phần trăm", "Thiết kế nhiều vòng thử nhỏ (3 vòng × 5 người sau mỗi đợt sửa) thay vì dồn 15 người vào một vòng duy nhất", "Nhận biết khi nào λ nhỏ hơn 0,31 và cần chia theo nhóm người dùng"]
    example: "mỗi người thử phát hiện 31% vấn đề: 5 người → 1 − 0,69⁵ ≈ 84,4%; 15 người → ≈ 99,6%; ba vòng 5 người sau mỗi lần sửa thường lợi hơn một vòng 15 người (VER HCI:L06)"
    fix: ["31% là trung bình của các dự án Nielsen khảo sát — sản phẩm phức tạp hoặc người dùng đa dạng có λ nhỏ hơn"]
  - id: L07
    title: "Đo cảm nhận: thang khả dụng hệ thống SUS"
    spec: lessons/hci/L07_thang_sus.yaml
    requires: [L06]
    objectives: ["Tính điểm thang khả dụng hệ thống từ 10 câu trả lời theo thang 1–5 bằng công thức (tổng câu lẻ (x − 1) + tổng câu chẵn (5 − x)) · 2,5", "Giải thích vì sao 5 câu lẻ mang nghĩa khen và 5 câu chẵn mang nghĩa chê phải đảo chiều khi quy đổi về thang 0–4", "Tránh sai lầm coi điểm 68 là 68% người dùng hài lòng"]
    example: "trả lời 4, 2, 4, 1, 5, 2, 4, 2, 4, 1: câu lẻ (x − 1) cộng 16, câu chẵn (5 − x) cộng 17 → (16 + 17) · 2,5 = 82,5 (VER HCI:L07)"
    fix: ["Điểm SUS không phải phần trăm — 68 là quanh mức trung bình của nhiều nghiên cứu, không phải “68% hài lòng”"]
  - id: L08
    title: "Thí nghiệm giao diện: trong chủ thể, giữa chủ thể và cân bằng thứ tự"
    spec: lessons/hci/L08_thi_nghiem_giao_dien.yaml
    requires: [L05, L07]
    requires_ext: ["DSC:L08"]
    objectives: ["So sánh hai thiết kế thí nghiệm giao diện: trong chủ thể (within-subject) và giữa chủ thể (between-subject)", "Nhận diện hiệu ứng thứ tự (học quen, mệt mỏi) khi một người thử nhiều giao diện liên tiếp", "Dựng hình vuông La-tinh để cân bằng thứ tự thử k giao diện mà không cần chạy đủ k! hoán vị"]
    example: "3 giao diện A, B, C cho mỗi người dùng thử cả ba: có 3! = 6 thứ tự; hình vuông Latin 3 × 3 (ABC, BCA, CAB) đặt mỗi giao diện ở mỗi vị trí đúng 1 lần (VER HCI:L08)"
    fix: ["Không cân bằng thứ tự thì giao diện thử sau luôn có lợi do người dùng đã quen nhiệm vụ"]
  - id: L09
    title: "Truy cập cho mọi người: kích thước đích, bàn phím, trình đọc màn hình"
    spec: lessons/hci/L09_truy_cap.yaml
    requires: [L02]
    requires_ext: ["WEB:L11"]
    objectives: ["Áp dụng tiêu chí kích thước vùng bấm tối thiểu (24×24 điểm ảnh theo chuẩn mức hai chữ A và 44×44 điểm ảnh theo mức ba chữ A) từ định luật thời gian trỏ", "Thiết kế luồng điều hướng chỉ dùng bàn phím với thứ tự chuyển tiêu điểm hợp lý và viền tiêu điểm rõ ràng", "Gắn nhãn ngữ nghĩa cho điều khiển và hình ảnh để trình đọc màn hình phát âm đúng chức năng và trạng thái", "Giải thích vì sao thiết kế truy cập cho người khuyết tật đồng thời giúp mọi người dùng trong điều kiện bất lợi tạm thời"]
    example: "khoảng cách 200 px, a = 0,1 s, b = 0,15 s/bit: đích 24 px → ≈ 0,583 s; đích 44 px → ≈ 0,471 s (VER HCI:L09)"
    fix: ["Truy cập không phải tính năng cho “số ít” — đích lớn, chữ rõ, dùng được bằng bàn phím có lợi cho người dùng điện thoại một tay, người lớn tuổi, người đang vội"]
  - id: L10
    title: "Thiết kế chống lỗi: ngăn, phát hiện, hoàn tác"
    spec: lessons/hci/L10_chong_loi.yaml
    requires: [L00, L04]
    objectives: ["Sắp thứ tự ưu tiên ba tầng chống lỗi: ngăn lỗi bằng ràng buộc, cho phép hoàn tác an toàn, rồi mới tới xác nhận cụ thể", "Tính xác suất lỗi lọt qua nhiều lớp phòng thủ độc lập (mô hình phô mai Thụy Sĩ) và giải thích vì sao hai lớp không độc lập thì không giảm lỗi như công thức nhân", "Phân biệt hộp thoại xác nhận chung chung (“Bạn có chắc không?”) bị bấm theo phản xạ với xác nhận gắn nội dung và xem trước kết quả"]
    example: "lỗi trượt 1/1000 thao tác; thêm người duyệt độc lập bắt được 99% → lọt 1/100 000; nếu người duyệt chỉ bấm “đồng ý” theo thói quen thì lớp đó không độc lập và gần như không bắt được gì (số minh hoạ, VER HCI:L10)"
    fix: ["Hộp “Bạn có chắc?” hiện mỗi lần làm người dùng quen bấm — xác nhận phải nêu đúng hậu quả và khác nhau cho hành động nguy hiểm"]
  - id: L11
    title: "Tình huống chuyên gia: thiết kế lại giao diện gửi cảnh báo khẩn cấp"
    spec: lessons/hci/L11_tinh_huong_canh_bao.yaml
    requires: [L10, L08]
    objectives: ["Lập dòng thời gian sự cố 38 phút từ báo cáo điều tra chính thức của cơ quan quản lý", "Chỉ ra ba lỗ hổng tương tác: danh sách thả xuống không phân cách, hộp xác nhận chung chung, và thiếu mẫu đính chính", "Thiết kế lại hệ thống với bốn lớp phòng thủ: tách môi trường, xem trước toàn văn, nguyên tắc hai người duyệt, và nút đính chính một chạm", "Đánh giá thiết kế bằng diễn tập có kịch bản gây áp lực thay vì phỏng vấn ý kiến lúc bình tĩnh"]
    example: "theo báo cáo FCC: không có quy trình và mẫu đính chính soạn sẵn nên từ 8:31 đến 8:44 phải hỏi ý cơ quan liên bang rồi tự soạn, gửi lúc 8:45 — 38 phút sau cảnh báo giả; thiết kế lại: xem trước nội dung, xác nhận khác nhau cho tập trận và thật, người thứ hai duyệt, mẫu đính chính một chạm (VER HCI:L11)"
    fix: ["Chuyên gia đo thiết kế mới bằng diễn tập có kịch bản lỗi, không chỉ hỏi ý kiến — người dùng dưới áp lực hành xử khác lúc phỏng vấn"]
  - id: L12
    title: "Hành trình: chuẩn tiếp cận web từ 14 hướng dẫn năm 1999 tới tiêu chí đo được năm 2008–2023"
    spec: lessons/hci/L12_hanh_trinh_wcag.yaml
    requires: [L02, L04, L09]
    kind: journey
    objectives: ["Kể lại bốn chặng 1999 → 2008 → 2018 → 2023 của chuẩn tiếp cận web, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại con số then chốt: 65 điểm kiểm năm 1999, tương phản 21:1 năm 2008, dòng lại 320 px năm 2018, diện tích 576 px² năm 2023", "Chọn bộ tiêu chí kiểm tự động kết hợp thử nghiệm người thật theo quy mô sản phẩm"]
    example: "1999 (WCAG 1.0): 14 hướng dẫn, 16 + 30 + 19 = 65 điểm kiểm chia 3 mức ưu tiên; 2008 (WCAG 2.0): 4 nguyên tắc, 12 hướng dẫn, 61 tiêu chí kiểm được, tỉ lệ tương phản (1 + 0,05)/(0 + 0,05) = 21:1, ngưỡng chữ thường 4,5:1; 2018 (WCAG 2.1): thêm 17 tiêu chí thành 78, khung 1280 px phóng 400% còn 1280 / 4 = 320 px không cuộn ngang, đích chạm mức AAA 44 × 44 = 1936 px²; 2023 (WCAG 2.2): bỏ tiêu chí 4.1.1 và thêm 9 tiêu chí thành 86, đích chạm mức AA 24 × 24 = 576 px² (nhỏ hơn 1936 / 576 ≈ 3,36 lần diện tích) (CITED W3C 1999, 2008, 2018, 2023; VER HCI:L12)"
    fix: ["Không đồng nhất “vượt công cụ quét tự động” với “người khuyết tật dùng được” — công cụ chỉ bắt được phần cú pháp và tương phản, phải thử bằng bàn phím và trình đọc màn hình", "Bỏ tiêu chí 4.1.1 năm 2023 không có nghĩa là viết HTML tuỳ tiện: chỉ là phần mềm trợ năng không còn tự phân tích mã HTML (nhận thông tin qua trình duyệt), còn thuộc tính vai trò và tên nút vẫn phải đúng"]
