# Giáo án KẾ HOẠCH — HCI · Tương tác người–máy
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã HCI:Lxx (định luật Fitts và Hick–Hyman, mô hình phím bấm KLM,
#   công thức Nielsen–Landauer, điểm SUS, hình vuông Latin, mốc thời gian của báo cáo FCC).
# Căn cứ phạm vi (CITED): CS2023 lĩnh vực HCI; D. Norman, The Design of Everyday Things (bản 2013); P. Fitts (1954), I. S. MacKenzie (1992) — dạng Shannon;
#   W. Hick (1952), R. Hyman (1953); S. Card, T. Moran, A. Newell, mô hình KLM (CACM 1980): K = 0,2 s, P = 1,1 s, B = 0,1 s, H = 0,4 s, M = 1,35 s;
#   J. Nielsen, T. Landauer (INTERCHI 1993) — tỉ lệ phát hiện 31% mỗi người thử; J. Brooke, SUS (1996); G. Miller (1956), N. Cowan (2001);
#   W3C WCAG 2.2 (2023) — tiêu chí 2.5.8 kích thước đích tối thiểu 24 × 24 px; FCC Public Safety and Homeland Security Bureau,
#   báo cáo cảnh báo giả Hawaii ngày 13/1/2018 (tháng 4/2018) — đọc trong phiên 2026-10-30.
# Vì sao cần: WEB L11 dạy độ tương phản và truy cập ở mức kỹ thuật web. Chưa có khoá dạy cách đo và thiết kế cho người dùng:
#   mô hình tâm trí, định luật định lượng, kiểm thử khả dụng, thí nghiệm giao diện, thiết kế chống lỗi — phần lõi của sản phẩm, công cụ vận hành, AI cho người dùng cuối.
# Thứ tự học: sau CS115 L12 (lôgarit), DSC L08 (thí nghiệm).
course: HCI
status: planned
lessons:
  - id: L00
    title: "Lỗi do thiết kế, không do người dùng: hộp xác nhận giống hệt nhau"
    spec_planned: lessons/hci/L00_loi_do_thiet_ke.yaml
    requires: []
    objectives: ["Phân biệt lỗi trượt (định làm đúng, tay làm sai) với lỗi nhầm (hiểu sai tình huống)", "Nhận ra giao diện cho cùng phản hồi cho hai hành động hậu quả khác nhau"]
    example: "Hawaii 13/1/2018 (CITED FCC): hộp xác nhận “Are you sure that you want to send this Alert?” giống hệt cho tập trận và cảnh báo thật, không cho xem trước nội dung; cảnh báo giả gửi 8:07, đính chính qua hệ thống cảnh báo lúc 8:45 → 38 phút (VER HCI:L00)"
    fix: ["Kết luận “nhân viên bấm nhầm” là dừng quá sớm — báo cáo FCC kết luận do cả lỗi người và thiếu cơ chế an toàn"]
  - id: L01
    title: "Mô hình tâm trí, dấu hiệu gợi ý và ánh xạ tự nhiên"
    spec_planned: lessons/hci/L01_mo_hinh_tam_tri.yaml
    requires: [L00]
    requires_ext: ["DMS:L09"]
    objectives: ["Đếm số cách hiểu của một bảng điều khiển không có ánh xạ tự nhiên", "Thiết kế bố cục điều khiển trùng bố cục vật được điều khiển"]
    example: "bếp 4 lò xếp ô vuông, 4 núm xoay xếp hàng ngang: có 4! = 24 cách ghép núm với lò người dùng có thể đoán; xếp núm theo cùng ô vuông → chỉ 1 cách tự nhiên (VER HCI:L01)"
    fix: ["Nhãn chữ là cứu chữa sau cùng — nếu cần nhãn để hiểu cái nút làm gì thì bố cục đã chưa đủ rõ"]
  - id: L02
    title: "Định luật Fitts: thời gian trỏ tới một đích"
    spec_planned: lessons/hci/L02_dinh_luat_fitts.yaml
    requires: [L00]
    requires_ext: ["CS115:L12"]
    objectives: ["Tính độ khó log₂(D/W + 1) và thời gian a + b · độ khó", "Giải thích vì sao mép và góc màn hình là đích lớn"]
    example: "a = 0,1 s, b = 0,15 s/bit: khoảng cách 256, rộng 16 → log₂ 17 ≈ 4,09 bit, ≈ 0,713 s; rộng 64 → log₂ 5 ≈ 2,32 bit, ≈ 0,448 s (VER HCI:L02)"
    fix: ["a, b phải đo cho từng thiết bị và người dùng — dùng hằng số của chuột cho màn hình cảm ứng là sai"]
  - id: L03
    title: "Định luật Hick–Hyman: thời gian chọn trong n lựa chọn"
    spec_planned: lessons/hci/L03_hick_hyman.yaml
    requires: [L02]
    objectives: ["Tính thời gian chọn b · log₂(n + 1)", "So sánh thực đơn phẳng với thực đơn hai cấp"]
    example: "b = 0,2 s: 15 mục phẳng → 0,2 · log₂ 16 = 0,8 s; chia hai cấp 3 rồi 5 mục → 0,4 + 0,2 · log₂ 6 ≈ 0,917 s — phẳng nhanh hơn khi người dùng biết tên mục cần tìm (VER HCI:L03)"
    fix: ["Định luật chỉ đúng khi các lựa chọn quen thuộc và xếp có trật tự; người mới phải dò từng mục, thời gian tuyến tính"]
  - id: L04
    title: "Trí nhớ làm việc, gom nhóm và tải nhận thức"
    spec_planned: lessons/hci/L04_tai_nhan_thuc.yaml
    requires: [L00]
    objectives: ["Gom thông tin thành nhóm để giảm số đơn vị phải nhớ", "Chuyển việc ghi nhớ sang việc nhận ra trên màn hình"]
    example: "mã 6 chữ số 482913 là 6 đơn vị; tách 482 913 còn 2 nhóm; chuỗi 12 ký tự ngẫu nhiên không nhóm được vượt quá khoảng 4 nhóm mà trí nhớ làm việc giữ được (VER HCI:L04)"
    fix: ["“7 ± 2” của Miller là về khoảng nhớ chữ số trong thí nghiệm, không phải quy tắc thiết kế “thực đơn tối đa 7 mục”"]
  - id: L05
    title: "Mô hình phím bấm KLM: ước lượng thời gian thao tác trước khi làm"
    spec_planned: lessons/hci/L05_mo_hinh_klm.yaml
    requires: [L02]
    objectives: ["Cộng thời gian các thao tác K, P, B, H, M cho một nhiệm vụ", "So sánh hai thiết kế bằng số trước khi viết mã"]
    example: "xoá tệp bằng chuột: H + M + P + BB + M + P + BB = 0,4 + 1,35 + 1,1 + 0,2 + 1,35 + 1,1 + 0,2 = 5,7 s; bằng phím tắt khi tay đang trên bàn phím: M + K + K = 1,75 s (VER HCI:L05)"
    fix: ["KLM chỉ cho người thành thạo, không lỗi — không ước lượng được thời gian học hay thời gian sửa lỗi"]
  - id: L06
    title: "Kiểm thử khả dụng: bao nhiêu người thử là đủ"
    spec_planned: lessons/hci/L06_kiem_thu_kha_dung.yaml
    requires: [L00]
    requires_ext: ["DMS:L19"]
    objectives: ["Tính tỉ lệ vấn đề phát hiện được 1 − (1 − λ)ⁿ", "Thiết kế vòng thử nhỏ lặp lại thay vì một lần lớn"]
    example: "mỗi người thử phát hiện 31% vấn đề: 5 người → 1 − 0,69⁵ ≈ 84,4%; 15 người → ≈ 99,6%; ba vòng 5 người sau mỗi lần sửa thường lợi hơn một vòng 15 người (VER HCI:L06)"
    fix: ["31% là trung bình của các dự án Nielsen khảo sát — sản phẩm phức tạp hoặc người dùng đa dạng có λ nhỏ hơn"]
  - id: L07
    title: "Đo cảm nhận: thang khả dụng hệ thống SUS"
    spec_planned: lessons/hci/L07_thang_sus.yaml
    requires: [L06]
    objectives: ["Tính điểm SUS từ 10 câu trả lời 1–5", "Giải thích vì sao câu chẵn đảo chiều"]
    example: "trả lời 4, 2, 4, 1, 5, 2, 4, 2, 4, 1: câu lẻ (x − 1) cộng 16, câu chẵn (5 − x) cộng 17 → (16 + 17) · 2,5 = 82,5 (VER HCI:L07)"
    fix: ["Điểm SUS không phải phần trăm — 68 là quanh mức trung bình của nhiều nghiên cứu, không phải “68% hài lòng”"]
  - id: L08
    title: "Thí nghiệm giao diện: trong chủ thể, giữa chủ thể và cân bằng thứ tự"
    spec_planned: lessons/hci/L08_thi_nghiem_giao_dien.yaml
    requires: [L05, L07]
    requires_ext: ["DSC:L08"]
    objectives: ["Chọn thiết kế trong chủ thể hay giữa chủ thể", "Cân bằng thứ tự bằng hình vuông Latin"]
    example: "3 giao diện A, B, C cho mỗi người dùng thử cả ba: có 3! = 6 thứ tự; hình vuông Latin 3 × 3 (ABC, BCA, CAB) đặt mỗi giao diện ở mỗi vị trí đúng 1 lần (VER HCI:L08)"
    fix: ["Không cân bằng thứ tự thì giao diện thử sau luôn có lợi do người dùng đã quen nhiệm vụ"]
  - id: L09
    title: "Truy cập cho mọi người: kích thước đích, bàn phím, trình đọc màn hình"
    spec_planned: lessons/hci/L09_truy_cap.yaml
    requires: [L02]
    requires_ext: ["WEB:L11"]
    objectives: ["Áp tiêu chí kích thước đích tối thiểu 24 × 24 px", "Dùng Fitts để thấy lợi ích của đích lớn cho mọi người"]
    example: "khoảng cách 200 px, a = 0,1 s, b = 0,15 s/bit: đích 24 px → ≈ 0,583 s; đích 44 px → ≈ 0,471 s (VER HCI:L09)"
    fix: ["Truy cập không phải tính năng cho “số ít” — đích lớn, chữ rõ, dùng được bằng bàn phím có lợi cho người dùng điện thoại một tay, người lớn tuổi, người đang vội"]
  - id: L10
    title: "Thiết kế chống lỗi: ngăn, phát hiện, hoàn tác"
    spec_planned: lessons/hci/L10_chong_loi.yaml
    requires: [L00, L04]
    objectives: ["Xếp các cơ chế: ràng buộc, xác nhận có nội dung, hoàn tác, hai người duyệt", "Ước lượng tỉ lệ lỗi lọt qua khi có lớp kiểm độc lập"]
    example: "lỗi trượt 1/1000 thao tác; thêm người duyệt độc lập bắt được 99% → lọt 1/100 000; nếu người duyệt chỉ bấm “đồng ý” theo thói quen thì lớp đó không độc lập và gần như không bắt được gì (số minh hoạ, VER HCI:L10)"
    fix: ["Hộp “Bạn có chắc?” hiện mỗi lần làm người dùng quen bấm — xác nhận phải nêu đúng hậu quả và khác nhau cho hành động nguy hiểm"]
  - id: L11
    title: "Tình huống chuyên gia: thiết kế lại giao diện gửi cảnh báo khẩn cấp"
    spec_planned: lessons/hci/L11_tinh_huong_canh_bao.yaml
    requires: [L10, L08]
    objectives: ["Lập dòng thời gian sự cố từ báo cáo điều tra", "Đề xuất các lớp an toàn và cách đo chúng trước khi triển khai"]
    example: "theo báo cáo FCC: không có mẫu đính chính soạn sẵn nên phải soạn từ 8:31 đến 8:44, gửi lúc 8:45 — 38 phút sau cảnh báo giả; thiết kế lại: xem trước nội dung, xác nhận khác nhau cho tập trận và thật, người thứ hai duyệt, mẫu đính chính một chạm (VER HCI:L11)"
    fix: ["Chuyên gia đo thiết kế mới bằng diễn tập có kịch bản lỗi, không chỉ hỏi ý kiến — người dùng dưới áp lực hành xử khác lúc phỏng vấn"]
