# Giáo án KẾ HOẠCH — EVT · Kiến trúc hướng sự kiện và dữ liệu luồng
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã EVT:Lxx (mô phỏng hàng đợi, gấp sự kiện, nối luồng theo cửa sổ, sqlite3).
# Căn cứ phạm vi: M. Fowler, “What do you mean by Event-Driven?” (2017) — thông báo sự kiện, chuyển trạng thái qua sự kiện, ghi nguồn sự kiện, CQRS;
#   M. Kleppmann (2017), chương 11; G. Hohpe, B. Woolf, Enterprise Integration Patterns (2003) — kênh thư chết, người tiêu thụ lũy đẳng;
#   H. Garcia-Molina, K. Salem, Sagas (SIGMOD 1987); J. Kreps, “Questioning the Lambda Architecture” (2014); T. Akidau và cộng sự, The Dataflow Model (VLDB 2015);
#   tài liệu Apache Avro / Confluent Schema Registry về tương thích lược đồ (bản hiện hành, tên sản phẩm chỉ trên màn hình).
# Vì sao cần: DSY L09, L14 dạy cửa sổ thời gian sự kiện và ngữ nghĩa giao nhận; DEN L08–L10 dạy nhật ký phân vùng, luồng có trạng thái, hộp thư đi;
#   CLD L14 giới thiệu saga và nhất quán cuối cùng. Khoá này ghép thành KIẾN TRÚC: thiết kế sự kiện, tiến hoá lược đồ, xử lý thư độc, thứ tự theo phiên bản,
#   ghi nguồn sự kiện, CQRS, saga đầy đủ, nối luồng, độ trễ tiêu thụ, tái xử lý, quan sát.
# Thứ tự học: sau DSY (toàn khoá), DEN L08–L10, CLD L03, L14.
course: EVT
status: planned
lessons:
  - id: L00
    title: "Sự kiện, lệnh và truy vấn: vì sao hướng sự kiện"
    spec: lessons/evt/L00_su_kien_va_lenh.yaml
    requires: []
    requires_ext: ["CLD:L03", "DSY:L14"]
    objectives: ["Phân biệt sự kiện (đã xảy ra) với lệnh (yêu cầu làm)", "Ước lượng số kết nối điểm–điểm so với qua kênh sự kiện"]
    example: "10 dịch vụ cần báo cho nhau: nối điểm–điểm tối đa 10 · 9 / 2 = 45 kết nối; qua một kênh sự kiện, mỗi dịch vụ một kết nối: 10 (VER EVT:L00)"
    fix: ["Sự kiện tách phụ thuộc lúc chạy, không tách phụ thuộc về nghĩa — đổi ý nghĩa một sự kiện vẫn làm vỡ mọi bên nhận"]
  - id: L01
    title: "Lược đồ sự kiện và tiến hoá lược đồ: tương thích ngược, tương thích xuôi"
    spec: lessons/evt/L01_luoc_do_su_kien.yaml
    requires: [L00]
    requires_ext: ["WEB:L14"]
    objectives: ["Phân loại thay đổi lược đồ an toàn và phá vỡ", "Chọn thứ tự triển khai người gửi và người nhận"]
    example: "thêm trường tuỳ chọn có giá trị mặc định: người nhận mới đọc được sự kiện cũ, người nhận cũ bỏ qua trường lạ → an toàn cả hai chiều; xoá trường bắt buộc → người nhận cũ hỏng (VER EVT:L01)"
    fix: ["Nhật ký sự kiện giữ lâu: người nhận mới phải đọc được cả sự kiện viết bằng lược đồ từ nhiều năm trước"]
  - id: L02
    title: "Người tiêu thụ lũy đẳng, thử lại và kênh thư chết"
    spec: lessons/evt/L02_kenh_thu_chet.yaml
    requires: [L00]
    requires_ext: ["SAR:L09", "DEN:L10"]
    objectives: ["Xử lý thông điệp độc không làm tắc cả phân vùng", "Thiết kế kênh thư chết có quy trình xử lý lại"]
    example: "phân vùng 1000 thông điệp, thông điệp thứ 10 luôn lỗi: thử lại mãi thì chỉ xử lý được 9; thử 3 lần rồi chuyển kênh thư chết thì xử lý 999, 1 nằm chờ người xem (VER EVT:L02)"
    fix: ["Kênh thư chết không ai đọc là thùng rác — phải có cảnh báo, người phụ trách và công cụ phát lại"]
  - id: L03
    title: "Thứ tự và trùng lặp: phân vùng theo khoá, phiên bản theo khoá"
    spec: lessons/evt/L03_thu_tu_va_phien_ban.yaml
    requires: [L02]
    requires_ext: ["DSY:L01", "DEN:L08"]
    objectives: ["Dùng số phiên bản để bỏ cập nhật cũ đến muộn", "Phân biệt thứ tự trong khoá với thứ tự toàn cục"]
    example: "cập nhật địa chỉ phiên bản 1, 2, 3 đến theo thứ tự 1, 3, 2: ghi đè ngây thơ để lại phiên bản 2 (sai); chỉ nhận phiên bản lớn hơn bản đang giữ → 3 (VER EVT:L03)"
    fix: ["Dấu thời gian của máy gửi không thay được số phiên bản — đồng hồ lệch nhau (DSY L01)"]
  - id: L04
    title: "Ghi nguồn sự kiện: trạng thái là kết quả gấp các sự kiện"
    spec: lessons/evt/L04_ghi_nguon_su_kien.yaml
    requires: [L03]
    objectives: ["Dựng trạng thái bằng cách gấp chuỗi sự kiện", "Dùng ảnh chụp trạng thái để giới hạn chi phí phát lại"]
    example: "tài khoản: nạp 100, rút 30, nạp 50, rút 20 → số dư 100; 1 triệu sự kiện, chụp ảnh mỗi 1000 sự kiện → phát lại tối đa 999 sự kiện thay vì 1 triệu (VER EVT:L04)"
    fix: ["Sự kiện là sự thật đã xảy ra — không sửa, không xoá; sai thì ghi sự kiện bù trừ"]
  - id: L05
    title: "Tách mô hình ghi và mô hình đọc: bộ chiếu và độ trễ chiếu"
    spec: lessons/evt/L05_tach_ghi_doc.yaml
    requires: [L04]
    requires_ext: ["DEN:L12"]
    objectives: ["Dựng mô hình đọc từ dòng sự kiện", "Xử lý độ trễ chiếu và yêu cầu đọc ngay điều vừa ghi"]
    example: "ghi 500 sự kiện mỗi giây, bộ chiếu mô hình đọc xử lý 400 mỗi giây: độ trễ chiếu tăng 100 sự kiện mỗi giây — sau 10 phút trễ 60 000 sự kiện (VER EVT:L05)"
    fix: ["Người dùng vừa lưu xong mà mở lại không thấy — cần trả kèm phiên bản đã ghi và chờ mô hình đọc theo kịp phiên bản đó"]
  - id: L06
    title: "Giao dịch dài qua nhiều dịch vụ: điều phối, biên đạo và bù trừ"
    spec: lessons/evt/L06_giao_dich_dai.yaml
    requires: [L02]
    requires_ext: ["CLD:L14", "DSY:L13"]
    objectives: ["Thiết kế bước bù trừ cho mỗi bước", "So sánh điều phối tập trung với biên đạo theo sự kiện"]
    example: "đặt hàng 3 bước: giữ hàng → trừ tiền → giao; bước giao lỗi → chạy bù trừ theo thứ tự ngược: hoàn tiền, nhả hàng (VER EVT:L06)"
    fix: ["Bù trừ không phải huỷ ngược hoàn hảo — thư xác nhận đã gửi thì chỉ gửi được thư xin lỗi"]
  - id: L07
    title: "Nối luồng: luồng với bảng và luồng với luồng theo cửa sổ"
    spec: lessons/evt/L07_noi_luong.yaml
    requires: [L03]
    requires_ext: ["DSY:L09", "DEN:L09"]
    objectives: ["Nối sự kiện với trạng thái mới nhất của bảng", "Nối hai luồng trong một cửa sổ thời gian"]
    example: "5 lượt hiển thị quảng cáo, 3 lượt bấm; nối bấm với hiển thị cùng mã trong vòng 10 phút: lượt bấm sau 12 phút bị loại → 2 cặp khớp (VER EVT:L07)"
    fix: ["Cửa sổ nối càng dài thì trạng thái phải giữ càng lớn — chọn theo hành vi thật, có giới hạn"]
  - id: L08
    title: "Áp lực ngược và độ trễ tiêu thụ"
    spec: lessons/evt/L08_ap_luc_nguoc.yaml
    requires: [L02]
    requires_ext: ["SAR:L07", "CLD:L10"]
    objectives: ["Tính tốc độ tăng độ trễ tiêu thụ", "Tính thời gian xả hết tồn đọng sau khi tăng công suất"]
    example: "đến 1200, xử lý 1000 sự kiện mỗi giây trong 1 giờ: tồn 720 000; tăng lên 1500 mỗi giây thì xả hết sau 720 000 / 300 = 2400 s = 40 phút (VER EVT:L08)"
    fix: ["Cảnh báo theo số sự kiện tồn không đủ — cảnh báo theo THỜI GIAN trễ (sự kiện cũ nhất đã chờ bao lâu)"]
  - id: L09
    title: "Tái xử lý: hai đường lô và luồng, một đường phát lại, và thời gian giữ nhật ký"
    spec: lessons/evt/L09_tai_xu_ly.yaml
    requires: [L04, L08]
    requires_ext: ["DEN:L13"]
    objectives: ["So sánh hai đường xử lý (lô + luồng) với một đường luồng phát lại", "Tính thời gian giữ nhật ký cần cho tái xử lý"]
    example: "sửa lỗi phép tính, cần tính lại 30 ngày; phát lại nhanh gấp 5 lần tốc độ đến → riêng 30 ngày cũ mất 6 ngày, nhưng dữ liệu mới vẫn đến nên đuổi kịp hiện tại mất 30 / (5 − 1) = 7,5 ngày (VER EVT:L09)"
    fix: ["Nhật ký chỉ giữ 7 ngày thì không phát lại được 30 ngày — thời gian giữ quyết định khả năng sửa sai", "Bản nháp ghi 6 ngày là thời gian xử lý riêng phần tồn; đuổi kịp hiện tại phải tính tồn / (k − 1) = 7,5 ngày (2026-10-29)"]
  - id: L10
    title: "Quan sát hệ hướng sự kiện: mã tương quan và độ trễ đầu–cuối"
    spec: lessons/evt/L10_quan_sat.yaml
    requires: [L06, L08]
    requires_ext: ["CLD:L11"]
    objectives: ["Truyền mã tương quan qua mọi sự kiện", "Tính độ trễ đầu–cuối của nhánh song song và nối tiếp"]
    example: "A 10 ms → song song B 20 ms và C 50 ms → D 30 ms (chờ cả hai): độ trễ đầu–cuối 10 + max(20, 50) + 30 = 90 ms (VER EVT:L10)"
    fix: ["Không có mã tương quan thì một yêu cầu đi qua 6 dịch vụ thành 6 dòng nhật ký không nối được với nhau"]
  - id: L11
    title: "Tình huống chuyên gia theo dòng thời gian: Kafka từ 2011 tới khi bỏ ZooKeeper"
    spec: lessons/evt/L11_hanh_trinh_nhat_ky_su_kien.yaml
    requires: [L02, L04, L09]
    requires_ext: ["DSY:L05"]
    kind: journey
    objectives: ["Kể lại hành trình của hệ nhật ký sự kiện Kafka qua năm chặng, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại con số then chốt của từng chặng", "Chọn thực hành phù hợp với quy mô của mình"]
    example: "gần 1 tỉ tin mỗi ngày (K11 §4) → khoảng 11 574 tin mỗi giây; gộp 50 tin: 400 000 so với 50 000 tin mỗi giây → gấp 8 (K11 §5); chịu F máy hỏng: chính–phụ F + 1 bản, đa số 2F + 1 (V15 §2); 800 tỉ tin mỗi ngày (LI15) → khoảng 9,26 triệu tin mỗi giây; 3 nút bộ điều khiển chịu 1 hỏng, 5 nút chịu 2 (KIP-500); 30/10/2019 → 18/3/2025 là 1966 ngày (VER EVT:L11)"
    fix: ["Chỉ khẳng định điều có trong K11, V15, LI15, KIP-500, các thông báo phát hành 2.8, 3.3, 3.5, 3.6, 3.9, 4.0 (audit/evt/sources_L11.md); năm phát hành bản 0.8.0 không có trong nguồn — chỉ nói chặng 2012–2015", "Câu “70% more space” của K11 §5 không khớp phép chia (200 + 144)/(200 + 9) ≈ 1,65 — không dạy", "Số liệu đếm kiểm 10 000 / 9 990, 1 triệu bản ghi siêu dữ liệu, quiz 1000 sự kiện/giây là số minh hoạ"]
