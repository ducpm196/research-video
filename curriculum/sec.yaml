# Giáo án KẾ HOẠCH — SEC · An toàn thông tin
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã SEC:Lxx (HMAC chạy bằng thư viện chuẩn hmac/hashlib).
# Căn cứ phạm vi: CS2023 — Security (SEC, 6 giờ CS Core; “1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98);
#   ACM DSTF 2021 — “Data Privacy, Security, Integrity, and Analysis for Security (DP)” (sha256 eaa9929c6b74446c).
#   Mô hình STRIDE (Microsoft) nêu theo tên — câu chữ chưa tra lại trong phiên (NOT_VERIFIED).
# Vì sao cần: trước đợt này, an toàn thông tin rải rác ở 7 khoá (NET L13–L14, SWF L12, CLD L13, DVO L12, ESY L14, MLO L13, SAR L11).
#   Khoá này nối chúng thành một mạch: tư duy kẻ tấn công → xác thực → phân quyền → lỗ hổng ứng dụng → mật mã dùng đúng → phát hiện, ứng phó.
#   Mục tiêu là PHÒNG THỦ: mọi ví dụ tấn công chỉ ở mức khái niệm để hiểu vì sao cần biện pháp, không hướng dẫn khai thác hệ thống thật.
# Thứ tự học: sau DMS L13–L15, NET L13–L14, SWF L12, OSY L14.
course: SEC
status: planned
lessons:
  - id: L00
    title: "Tư duy an toàn: tài sản, kẻ tấn công, mô hình hoá mối đe doạ"
    spec: lessons/sec/L00_tu_duy_an_toan.yaml
    requires: []
    requires_ext: ["SWF:L00"]
    objectives: ["Phát biểu ba mục tiêu bí mật, toàn vẹn, sẵn sàng", "Liệt kê mối đe doạ theo sáu loại cho một hệ thống nhỏ", "Hiểu an toàn là thuộc tính của cả hệ thống"]
    example: "biểu mẫu đăng nhập: giả mạo danh tính, sửa dữ liệu trên đường truyền, chối bỏ, lộ thông tin, từ chối dịch vụ, leo thang quyền"
    fix: ["An toàn là thuộc tính của cả hệ thống, không phải một tính năng thêm vào cuối"]
  - id: L01
    title: "Lưu mật khẩu: băm, muối, hàm băm chậm"
    spec: lessons/sec/L01_luu_mat_khau.yaml
    requires: [L00]
    requires_ext: ["DMS:L09"]
    objectives: ["Giải thích vì sao không lưu mật khẩu dạng rõ hay băm nhanh", "Giải thích vai trò của muối", "Tính thời gian thử hết một không gian mật khẩu"]
    example: "8 chữ thường: băm nhanh 10¹⁰ lần/s thử hết trong 20,9 s; hàm băm chậm 10⁴ lần/s mất khoảng 242 ngày (VER SEC:L01)"
    fix: ["Mã hoá mật khẩu (giải ngược được) không phải băm — người giữ khoá đọc được mọi mật khẩu"]
  - id: L02
    title: "Độ mạnh mật khẩu và entropy"
    spec: lessons/sec/L02_entropy.yaml
    requires: [L01]
    objectives: ["Tính entropy của mật khẩu sinh ngẫu nhiên", "Phân biệt entropy và độ phức tạp bề ngoài", "Chọn cách sinh mật khẩu mạnh và dễ nhớ"]
    example: "8 chữ thường ngẫu nhiên ≈ 37,6 bit; 4 từ ngẫu nhiên từ danh sách 7776 từ ≈ 51,7 bit (VER SEC:L02)"
    fix: ["Công thức entropy chỉ đúng khi mật khẩu sinh NGẪU NHIÊN — mật khẩu người tự nghĩ yếu hơn nhiều"]
  - id: L03
    title: "Xác thực nhiều yếu tố và mã một lần"
    spec: lessons/sec/L03_xac_thuc_nhieu_yeu_to.yaml
    requires: [L02]
    objectives: ["Phân biệt các loại yếu tố xác thực", "Giải thích mã một lần theo thời gian", "Biết vì sao mã một lần vẫn bị lừa và cách chống"]
    example: "mã 6 chữ số: đoán bừa 3 lần trúng với xác suất 3/10⁶ — nên phải khoá sau vài lần sai (VER SEC:L03)"
    fix: ["Mã một lần vẫn bị lừa nhập vào trang giả rồi dùng ngay trong 30 giây — khoá bảo mật gắn chữ ký với tên miền mới chống được trang giả"]
  - id: L04
    title: "Phân quyền: danh sách quyền, vai trò, quyền tối thiểu"
    spec: lessons/sec/L04_phan_quyen.yaml
    requires: [L00]
    requires_ext: ["OSY:L14"]
    objectives: ["Phân biệt xác thực và phân quyền", "So sánh danh sách quyền truy cập và phân quyền theo vai trò", "Áp dụng quyền tối thiểu và tách bạch nhiệm vụ"]
    example: "vai trò “kế toán” đọc và tạo hoá đơn; “kiểm toán” chỉ đọc; nhật ký cho thấy “lan” vừa tạo vừa duyệt HD2 → vi phạm tách bạch nhiệm vụ (VER SEC:L04)"
    fix: ["Xác thực (bạn là ai) khác phân quyền (bạn được làm gì) — đăng nhập được không có nghĩa được xem mọi dữ liệu"]
  - id: L05
    title: "Phiên đăng nhập, cookie và giả mạo yêu cầu chéo trang"
    spec: lessons/sec/L05_phien_csrf.yaml
    requires: [L03]
    requires_ext: ["NET:L12"]
    objectives: ["Giải thích cookie phiên và các cờ bảo vệ", "Giải thích giả mạo yêu cầu chéo trang và cách chặn", "Biết kiểm tra ở trình duyệt không bảo vệ máy chủ"]
    example: "trang lạ gửi biểu mẫu POST tới ngân hàng: không có SameSite thì cookie được gửi kèm; SameSite=Lax chặn cookie; mã chống giả mạo sai thì máy chủ từ chối (mô hình, VER SEC:L05)"
    fix: ["Kiểm tra đầu vào ở trình duyệt không bảo vệ máy chủ — kẻ tấn công gửi yêu cầu trực tiếp"]
  - id: L06
    title: "Lỗ hổng chèn: truy vấn, lệnh, mã kịch bản trên trang"
    spec: lessons/sec/L06_lo_hong_chen.yaml
    requires: [L05]
    requires_ext: ["SWF:L12"]
    objectives: ["Nhận ra mẫu chung của lỗ hổng chèn", "Dùng tham số hoá cho truy vấn và lệnh", "Mã hoá đầu ra theo ngữ cảnh"]
    example: "tên người dùng chứa thẻ <script> được mã hoá thành &lt;script&gt; — trình duyệt hiển thị thành chữ, không chạy (html.escape, VER SEC:L06)"
    fix: ["Lọc danh sách ký tự “nguy hiểm” luôn thiếu — tách dữ liệu khỏi mã bằng API tham số hoá"]
  - id: L07
    title: "Mã hoá đối xứng dùng đúng: chế độ và số dùng một lần"
    spec: lessons/sec/L07_ma_hoa_doi_xung.yaml
    requires: [L00]
    requires_ext: ["NET:L13"]
    objectives: ["Giải thích vì sao mã từng khối độc lập lộ cấu trúc", "Giải thích vai trò của số dùng một lần", "Chọn mã hoá có xác thực"]
    example: "chế độ ECB: hai khối bản rõ giống nhau cho hai khối bản mã giống nhau, với mọi hàm khối tất định (VER SEC:L07)"
    fix: ["Dùng lại số dùng một lần với cùng khoá có thể làm lộ bản rõ"]
  - id: L08
    title: "Toàn vẹn và xác thực thông điệp"
    spec: lessons/sec/L08_toan_ven_xac_thuc.yaml
    requires: [L07]
    objectives: ["Phân biệt mã kiểm tổng, hàm băm, mã xác thực thông điệp, chữ ký số", "Dùng mã xác thực thông điệp có khoá", "So sánh mã bằng phép so thời gian hằng"]
    example: "sửa “chuyển 100” thành “chuyển 900” làm mã HMAC đổi hẳn; không có khoá thì không tạo được mã đúng (VER SEC:L08)"
    fix: ["Mã hoá không bảo đảm toàn vẹn — bản mã có thể bị sửa mà người nhận không biết nếu không có xác thực"]
  - id: L09
    title: "Chứng chỉ, chuỗi tin cậy và TLS trong thực tế"
    spec: lessons/sec/L09_chung_chi.yaml
    requires: [L08]
    requires_ext: ["NET:L14"]
    objectives: ["Kiểm một chuỗi chứng chỉ", "Hiểu vì sao trình duyệt tin một trang lạ", "Liệt kê lỗi cấu hình hay gặp"]
    example: "chuỗi trang → trung gian → gốc kiểm được bằng khoá RSA đồ chơi; sửa tên miền sau khi ký → chữ ký sai; thiếu gốc tin cậy → từ chối (VER SEC:L09)"
    fix: ["Tắt kiểm tra chứng chỉ “cho chạy được” trong mã là mở cửa cho tấn công người đứng giữa"]
  - id: L10
    title: "Hàm băm mật mã và tấn công ngày sinh"
    spec: lessons/sec/L10_ham_bam_ngay_sinh.yaml
    requires: [L08]
    requires_ext: ["DMS:L19"]
    objectives: ["Phân biệt kháng tiền ảnh và kháng va chạm", "Ước lượng chi phí tìm va chạm", "Chọn độ dài băm đủ an toàn"]
    example: "băm 64 bit có khoảng 50% va chạm sau khoảng 5,06 tỉ giá trị (VER SEC:L10)"
    fix: ["Độ dài băm n bit chỉ cho khoảng n/2 bit an toàn trước tấn công va chạm"]
  - id: L11
    title: "An toàn bộ nhớ và các lớp bảo vệ của hệ điều hành"
    spec: lessons/sec/L11_an_toan_bo_nho.yaml
    requires: [L00]
    requires_ext: ["CSA:L01", "OSY:L09"]
    objectives: ["Giải thích tràn bộ đệm ở mức khái niệm", "Mô tả ngẫu nhiên hoá địa chỉ, vùng nhớ không thực thi, chim hoàng yến", "Hiểu vì sao ngôn ngữ an toàn bộ nhớ là giải pháp gốc"]
    example: "ngẫu nhiên hoá địa chỉ với 16 bit entropy: đoán vét trung bình 32 768 lần (VER SEC:L11)"
    fix: ["Các lớp bảo vệ làm khai thác khó hơn, không thay được việc dùng ngôn ngữ và thư viện an toàn bộ nhớ"]
  - id: L12
    title: "An toàn mạng: phân vùng, tường lửa, không tin mặc định"
    spec: lessons/sec/L12_an_toan_mang.yaml
    requires: [L04]
    requires_ext: ["NET:L05"]
    objectives: ["Thiết kế phân vùng mạng theo mức tin cậy", "Viết luật tường lửa mặc định từ chối", "Giải thích mô hình không tin mặc định"]
    example: "luật khớp đầu tiên, mặc định chặn: ứng dụng → cơ sở dữ liệu cổng 5432 cho qua; Internet → cơ sở dữ liệu bị chặn; Internet → web 443 cho qua, cổng 22 bị chặn (VER SEC:L12)"
    fix: ["Ở trong mạng nội bộ không có nghĩa là đáng tin — xác thực cả lời gọi bên trong"]
  - id: L13
    title: "Ghi nhật ký an ninh, phát hiện xâm nhập và tỉ lệ nền"
    spec: lessons/sec/L13_nhat_ky_phat_hien.yaml
    requires: [L12]
    requires_ext: ["DSC:L11"]
    objectives: ["Chọn sự kiện cần ghi và điều không được ghi", "Tính tỉ lệ cảnh báo là thật khi tấn công hiếm", "Giảm cảnh báo nhầm có hệ thống"]
    example: "bắt 99% tấn công, báo nhầm 1%, tấn công chiếm 1/10 000 sự kiện → chỉ 0,98% cảnh báo là thật (VER SEC:L13)"
    fix: ["Ghi mật khẩu hay mã phiên vào nhật ký tạo ra lỗ hổng mới"]
  - id: L14
    title: "Ứng phó sự cố, sao lưu và phục hồi"
    spec: lessons/sec/L14_ung_pho_su_co.yaml
    requires: [L13]
    requires_ext: ["DVO:L10"]
    objectives: ["Mô tả các bước ứng phó sự cố", "Thiết kế sao lưu chống mã độc tống tiền", "Biết vì sao phải thử khôi phục"]
    example: "quy tắc 3-2-1: 2 bản trên cùng đĩa tại chỗ thiếu cả 4 điều kiện; đĩa + băng + đám mây không ghi đè được thì đạt (VER SEC:L14)"
    fix: ["Bản sao lưu chưa từng thử khôi phục chưa phải là bản sao lưu"]
  - id: L15
    title: "Tình huống chuyên gia theo dòng thời gian: HTTPS trở thành mặc định"
    spec: lessons/sec/L15_hanh_trinh_https.yaml
    requires: [L09, L11, L14]
    kind: journey
    objectives: ["Kể lại hành trình đưa HTTPS thành mặc định qua bốn chặng 2014, 2015, 2019, 2025–2028, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại con số then chốt: cỡ vùng nhớ lộ ra, số ngày lỗi tồn tại, tỉ lệ thay khoá thật sự, nhịp gia hạn theo vòng đời chứng chỉ", "Chọn cách quản lý chứng chỉ phù hợp với quy mô của mình, kèm điều kiện đổi lựa chọn"]
    example: "Heartbleed: trường độ dài 2 byte → 2¹⁶ = 65 536 byte ≈ 64 KB; lỗi tồn tại 754 ngày (14/3/2012 → 7/4/2014, D14); 1000 trang còn lỗi (số minh hoạ) → 100 thay chứng chỉ → 86 thật sự đổi khoá; 538 triệu chứng chỉ / 223 triệu tên miền ≈ 2,41 (A19); chứng chỉ 45 ngày: gia hạn ở 2/3 = ngày 30, lịch cứng 60 ngày hỏng 15 ngày (L25) (VER SEC:L15)"
    fix: ["Chỉ khẳng định điều có trong O14, D14, A19, L15 (blog 2015), L25 (blog 2025) (audit/sec/sources_L15.md)", "Heartbleed chỉ ở mức khái niệm phòng thủ: điều kiện kiểm biên, vá, thay khoá — không có cách dựng yêu cầu khai thác; không nêu tên người tìm ra lỗi", "Tỉ lệ trang tải qua HTTPS lấy theo A19 (trích đo đạc của trình duyệt); không đọc báo cáo minh bạch của Google", "“Hai phần ba vòng đời” là mức Let's Encrypt chấp nhận, không phải quy định"]
