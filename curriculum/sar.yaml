# Giáo án KẾ HOẠCH — SAR · Kiến trúc hệ thống: thiết kế có lý do, ước lượng được, đánh đổi minh bạch
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã SAR:Lxx.
# Căn cứ phạm vi: CS2023 — Software Engineering (SE: thiết kế, kiến trúc), Systems Fundamentals (SF: hiệu năng, độ tin cậy),
#   Parallel and Distributed Computing (PDC). Khoá là phần TỔNG HỢP: dùng lại toàn bộ DBS, DSY, CLD, DVO, NET, OSY.
# Vì sao cần: kiến trúc không phải thuộc lòng sơ đồ mẫu mà là ra quyết định có số liệu — ước lượng tải, chọn chỗ đặt nhất quán,
#   bộ nhớ đệm, phân mảnh, dự phòng — và ghi lại lý do để người sau sửa được.
# Thứ tự học: khoá cuối của nhánh Hệ thống/Phần mềm — sau DBS, DSY, CLD, DVO.
course: SAR
status: planned
lessons:
  - id: L00
    title: "Thuộc tính chất lượng và đánh đổi"
    spec: lessons/sar/L00_thuoc_tinh_chat_luong.yaml
    requires: []
    requires_ext: ["SWF:L00"]
    objectives: ["Liệt kê thuộc tính chất lượng: hiệu năng, sẵn sàng, an toàn, dễ sửa, chi phí", "Viết kịch bản thuộc tính đo được"]
    example: "“nhanh” không kiểm được; “95% yêu cầu tìm kiếm dưới 200 ms ở 1000 yêu cầu/s” kiểm được: 1000 yêu cầu đo được có phân vị 95 là 147,7 ms → đạt, phân vị 99 là 399,4 ms (mô phỏng, VER SAR:L00)"
    fix: ["Không có kiến trúc tốt nhất — chỉ có kiến trúc hợp với các thuộc tính ưu tiên của bài toán này"]
  - id: L01
    title: "Ghi lại quyết định kiến trúc"
    spec: lessons/sar/L01_ghi_quyet_dinh.yaml
    requires: [L00]
    objectives: ["Viết bản ghi quyết định: bối cảnh, lựa chọn, hệ quả", "Phân biệt quyết định đảo ngược được và khó đảo ngược"]
    example: "“Chọn cơ sở dữ liệu quan hệ vì cần giao dịch nhiều bảng; chấp nhận khó mở rộng ghi quá một máy”"
    fix: ["Sơ đồ không có lý do đi kèm sẽ bị người sau làm sai khi thay đổi"]
  - id: L02
    title: "Ước lượng nhanh: tải, lưu trữ, băng thông"
    spec: lessons/sar/L02_uoc_luong_nhanh.yaml
    requires: [L00]
    requires_ext: ["NET:L02"]
    objectives: ["Đổi số người dùng thành yêu cầu mỗi giây", "Ước lượng dung lượng lưu trữ và băng thông"]
    example: "10 triệu người dùng/ngày × 20 yêu cầu ≈ 2315 yêu cầu/s trung bình, giờ cao điểm gấp 3 ≈ 6944 (VER SAR:L02)"
    fix: ["Thiết kế theo trung bình là sai — phải theo cao điểm và có dự phòng"]
  - id: L03
    title: "Phân lớp, mô-đun hoá và ranh giới"
    spec: lessons/sar/L03_phan_lop_ranh_gioi.yaml
    requires: [L01]
    requires_ext: ["CLD:L00"]
    objectives: ["Chia hệ thống theo trách nhiệm", "Giữ phụ thuộc một chiều giữa các lớp"]
    example: "lớp giao diện gọi lớp nghiệp vụ, lớp nghiệp vụ gọi lớp dữ liệu — không có chiều ngược lại"
    fix: ["Tách thành nhiều dịch vụ mà vẫn dùng chung một cơ sở dữ liệu là nguyên khối phân tán"]
  - id: L04
    title: "Bộ nhớ đệm: ở đâu, bao lâu, làm mất hiệu lực thế nào"
    spec: lessons/sar/L04_bo_nho_dem.yaml
    requires: [L02]
    requires_ext: ["CSA:L10"]
    objectives: ["Tính độ trễ trung bình theo tỉ lệ trúng", "Chọn chiến lược ghi và thời gian sống"]
    example: "bộ nhớ đệm 1 ms, cơ sở dữ liệu 50 ms: trúng 90% → 5,9 ms, trúng 99% → 1,49 ms (VER SAR:L04)"
    fix: ["Bộ nhớ đệm hết hạn cùng lúc làm mọi yêu cầu dồn xuống cơ sở dữ liệu một lúc"]
  - id: L05
    title: "Mở rộng dữ liệu: bản sao đọc, phân mảnh, chọn khoá phân mảnh"
    spec: lessons/sar/L05_phan_manh.yaml
    requires: [L04]
    requires_ext: ["DSY:L03", "DSY:L06"]
    objectives: ["Ước lượng số nút cần", "Chọn khoá phân mảnh tránh điểm nóng"]
    example: "5 TB dữ liệu, 500 GB mỗi nút, hệ số sao chép 3 → 30 nút (VER SAR:L05)"
    fix: ["Bản sao đọc không tăng khả năng ghi — mọi lần ghi vẫn qua bản chính"]
  - id: L06
    title: "Độ sẵn sàng: dự phòng, điểm hỏng đơn, miền lỗi"
    spec: lessons/sar/L06_do_san_sang.yaml
    requires: [L02]
    requires_ext: ["CLD:L03"]
    objectives: ["Tính sẵn sàng của mắc song song và nối tiếp", "Tìm điểm hỏng đơn"]
    example: "hai thành phần độc lập 99%: song song → 99,99%, nối tiếp → 98,01% (VER SAR:L06)"
    fix: ["Hai bản dự phòng cùng giá máy, cùng nguồn điện không độc lập — công thức nhân xác suất không áp dụng được"]
  - id: L07
    title: "Kiểm soát quá tải: giới hạn tốc độ, giảm tải, áp lực ngược"
    spec: lessons/sar/L07_kiem_soat_qua_tai.yaml
    requires: [L06]
    requires_ext: ["CLD:L10"]
    objectives: ["Cài thùng token", "Thiết kế từ chối có kiểm soát khi quá tải"]
    example: "thùng token 10/s, sức chứa 20, dồn 1000 yêu cầu/s trong 5 s → nhận 69 (VER SAR:L07)"
    fix: ["Hệ thống không biết từ chối sẽ chậm dần rồi sụp hẳn khi quá tải"]
  - id: L08
    title: "Hàng đợi và xử lý bất đồng bộ"
    spec: lessons/sar/L08_hang_doi_bat_dong_bo.yaml
    requires: [L07]
    requires_ext: ["DSY:L14"]
    objectives: ["Dùng hàng đợi tách nhịp hai dịch vụ", "Tính tồn đọng khi xử lý chậm hơn gửi"]
    example: "gửi 120/s, xử lý 100/s → tồn đọng tăng 20/s, sau 1 giờ còn 72 000 thông điệp (VER SAR:L08)"
    fix: ["Hàng đợi hấp thụ đợt tăng ngắn, không thay được năng lực xử lý khi tải cao kéo dài"]
  - id: L09
    title: "Tính đúng khi có thử lại: lũy đẳng và xử lý trùng lặp"
    spec: lessons/sar/L09_luy_dang.yaml
    requires: [L08]
    requires_ext: ["CLD:L04"]
    objectives: ["Thiết kế API lũy đẳng bằng khoá yêu cầu", "Loại thông điệp trùng"]
    example: "gửi lại yêu cầu trả tiền cùng khoá “k1” không trừ tiền hai lần → sổ cái 150 thay vì 250 (VER SAR:L09)"
    fix: ["Lũy đẳng phải ghi khoá cùng giao dịch với kết quả — ghi riêng thì vẫn có khe hở"]
  - id: L10
    title: "Nhất quán và vị trí địa lý: một vùng, nhiều vùng"
    spec: lessons/sar/L10_nhat_quan_da_vung.yaml
    requires: [L05]
    requires_ext: ["DSY:L04"]
    objectives: ["Ước lượng độ trễ của ghi đồng bộ nhiều vùng", "Chọn mức nhất quán theo từng loại dữ liệu"]
    example: "ghi đồng bộ sang vùng cách 40 ms mỗi chiều: mỗi lần ghi chờ thêm ít nhất 80 ms (VER SAR:L10)"
    fix: ["Không phải mọi dữ liệu cần nhất quán mạnh — số lượt thích trễ vài giây không sao, số dư tài khoản thì không"]
  - id: L11
    title: "Kiến trúc an toàn: phòng thủ nhiều lớp, quyền tối thiểu, mô hình hoá mối đe doạ"
    spec: lessons/sar/L11_kien_truc_an_toan.yaml
    requires: [L03]
    requires_ext: ["NET:L14", "SWF:L12"]
    objectives: ["Liệt kê tài sản, kẻ tấn công, đường tấn công", "Đặt kiểm soát ở nhiều lớp"]
    example: "dịch vụ báo cáo chỉ có quyền đọc bản sao dữ liệu — bị chiếm cũng không ghi được vào cơ sở dữ liệu chính"
    fix: ["Mạng nội bộ không phải vùng tin cậy — xác thực cả lời gọi giữa các dịch vụ"]
  - id: L12
    title: "Thiết kế tổng hợp: từ yêu cầu tới bản kiến trúc"
    spec: lessons/sar/L12_thiet_ke_tong_hop.yaml
    requires: [L09, L10, L11]
    requires_ext: ["DVO:L09"]
    objectives: ["Đi đủ các bước: yêu cầu, ước lượng, thành phần, dữ liệu, đánh đổi, rủi ro", "Trình bày bản thiết kế có số liệu và bản ghi quyết định"]
    example: "dịch vụ rút gọn đường dẫn: 100 triệu mã mới/tháng → 38,6 ghi/s, đọc cao điểm ≈ 11 574/s, 62⁷ ≈ 3,5·10¹² mã, 3 TB sau 5 năm; mã ngẫu nhiên → ≈ 5,1 triệu va chạm nếu không kiểm trùng (VER SAR:L12)"
    fix: ["Bắt đầu bằng sơ đồ hộp mà chưa có con số tải và yêu cầu là thiết kế theo cảm tính"]
  - id: L13
    title: "Tình huống chuyên gia theo dòng thời gian: Twitter, từ nguyên khối tới dịch vụ"
    spec: lessons/sar/L13_hanh_trinh_twitter.yaml
    requires: [L02, L03, L06, L07]
    see_also: ["CLD:L15"]
    kind: journey
    objectives: ["Kể lại hành trình của Twitter qua năm chặng từ 2006 tới 2014, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại con số then chốt của từng chặng: dung lượng mỗi ngày, số máy, độ trễ tuần tự và song song, hệ số cao điểm, số lỗi mỗi giây", "Chọn giữa thêm máy và tách dịch vụ ở quy mô của mình, kèm điều kiện đổi lựa chọn"]
    example: "500 triệu tweet mỗi ngày × 200 byte = 100 GB mỗi ngày (AN14); 30 000 yêu cầu/s (số minh hoạ) ở 200–300 yêu cầu mỗi máy Rails (AN14) → 100–150 máy; gọi 3 tweet tuần tự 50 ms, song song 30 ms (số minh hoạ); 143 199 / 25 088 ≈ 5,7 lần kỷ lục 2011, ≈ 24 lần tải thường 6000 (AN14); 300 000 yêu cầu/s × 0,01% = 30 lỗi mỗi giây (BD14); 100 hệ, mỗi hệ chậm 1% (số minh hoạ) → 63,4% yêu cầu gặp ít nhất một hệ chậm (VER SAR:L13)"
    fix: ["Bài blog 2013 “New Tweets per second record, and how!” KHÔNG đọc được (blog.x.com 403, Wayback 429) — dạy theo AN14, BD14, ME13 do kỹ sư Twitter viết (audit/sar/sources_L13.md); không dạy chi tiết riêng của bài blog", "Năm tắt hẳn nguyên khối, số máy, số kỹ sư không có trong nguồn — không dạy; chặng tách dịch vụ ghi “từ 2010” theo các mốc 2010 của AN14 và ME13", "Không kết luận “Ruby chậm nên viết lại bằng Java”: AN14 nêu ba nguyên nhân (mã nguyên khối mong manh, ném thêm máy, kẹt vì tối ưu) và cách sửa là tách dần + thư viện chung"]
