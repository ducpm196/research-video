# Giáo án Khoá FND · Nền thực hành: dòng lệnh, tệp, dữ liệu, HTTP, SQL, Git (11 bài, 2026-11-13)
# Căn cứ phạm vi: audit/review/sample_f/REPORT.md mục 4–5 (khoảng hở tiên quyết đo được: sau JVA L00 không bài nào bắt tự gõ và chạy; BNX L00 dùng bash/Git khi JVA bảo dùng
#   Command Prompt; BNK L01–L04 dùng máy khách–máy chủ, HTTP, SQL khi chưa bài nào dạy) và audit/review/audit_final/new_courses.md (bảng 11 bài + lab). Khoá đứng ĐẦU lộ trình (Chặng 0), trước JVA.
# Chuẩn ngoài (CITED = nguồn đã dùng khi soạn, tên đủ trong `source` từng bài): GNU Coreutils và Bash Reference Manual (lệnh, ống, mã thoát); RFC 3629 (UTF-8); RFC 8259 (JSON); RFC 4180 (CSV);
#   RFC 9110 (HTTP); curl man page; SQLite docs (SQL, NULL, giao dịch, chỉ mục); Pro Git 2nd ed. Mọi trích dẫn tính từ trí nhớ (Roediger & Karpicke 2006 ở L00; Little 1961 ở L07; MAX_PATH 260 ở L01) ghi NOT_VERIFIED trong `source`.
# Bộ kiểm độc lập: audit/fnd/verify_fnd.py chạy THẬT Git Bash (lệnh người học gõ) trong thư mục tạm; sqlite3 dòng lệnh thay bằng audit/fnd/shim trên máy kiểm chưa cài sqlite3.
# Số trong `example` là số minh hoạ chạy thật bằng verify_fnd.py; chưa gắn mã "VER FND:Lxx" vì audit/verify_plan_curricula.py chưa có dòng FND (do người điều phối thêm nếu muốn).
# Thứ tự học mới: FND → JVA → JV2 → BNK → …  (requires_ext của JVA L00 trỏ FND:L10 do người điều phối sửa; khoá này không sửa khoá khác).
course: FND
profile: stem
status: active
lessons:
- id: L00
  title: Máy tính chạy chương trình thế nào, cách học và chuẩn bị máy
  spec: lessons/fnd/L00_may_tinh_va_cach_hoc.yaml
  requires: []
  objectives:
  - Mô tả đường đi của chương trình từ ổ đĩa vào bộ nhớ tới bộ xử lý làm từng lệnh
  - Chạy tay chương trình ba lệnh và ghi bộ nhớ sau mỗi lệnh
  - Tính tổng thời gian chờ bằng số lần nhân thời gian một lần, ở ba quy mô dữ liệu
  - Kể bốn bước của vòng học và giải thích vì sao tự làm trước khi xem đáp án
  - Cài các công cụ của khoá và kiểm máy bằng tệp lệnh in dấu tích cho từng công cụ
  example: Đọc 1 000 bản ghi ở ổ cơ (10 ms mỗi lần) chờ 10 s; nhân 10 000 lần thành 100 000 s, gần 28 giờ; bộ nhớ 100 ns, ổ thể rắn 100 µs, ổ cơ 10 ms là số minh hoạ chạy bằng phép tính (số minh hoạ)
  fix:
  - Chỗ để dữ liệu quyết định tốc độ; đo thời gian phải nói rõ lần nguội hay lần nóng
- id: L01
  title: 'Cửa sổ lệnh: đang đứng ở đâu, đi đâu, nhìn gì'
  spec: lessons/fnd/L01_git_bash_duong_dan.yaml
  requires:
  - L00
  objectives:
  - Nêu ý nghĩa của dấu nhắc và ba lệnh in vị trí, liệt kê, đổi thư mục
  - Phân biệt đường dẫn tuyệt đối với tương đối và tính số lần lùi bằng hai dấu chấm
  - Đi một vòng trong cây thư mục bằng các lệnh cd và kiểm vị trí bằng pwd
  - Kiểm một đích đến bằng hai cách đi khác nhau
  - 'Chỉ ra ba lỗi hay gặp: khoảng trắng, gạch chéo ngược, chữ hoa chữ thường'
  - Đi theo cây cho trước chỉ bằng đường tương đối và in nội dung từng thư mục
  example: Từ /c/Users/ban/hoc/nen (độ sâu 5) tới anh cần lùi 5 − 3 = 2 cấp, nên ../../anh; đường dẫn 29 cấp dài 263 ký tự vượt giới hạn mặc định 260 (số minh hoạ)
  fix:
  - Đường dẫn tuyệt đối chứa tên người dùng nên hỏng khi chép sang máy khác; Windows không phân biệt hoa thường, máy chủ thì có
- id: L02
  title: 'Làm việc với tệp: tạo, ghi, chép, đổi tên, xoá'
  spec: lessons/fnd/L02_tep_va_thu_muc.yaml
  requires:
  - L01
  objectives:
  - Nêu chức năng của các lệnh tạo thư mục, tạo tệp, in chữ, in nội dung, chép, di chuyển, xoá
  - Phân biệt một dấu lớn hơn (ghi đè) với hai dấu lớn hơn (nối thêm)
  - Giải thích dấu sao và dấu hỏi do chương trình cửa sổ lệnh mở ra và xem trước chúng bằng lệnh in chữ
  - Dựng, ghi, chép, đổi tên và xoá trong một cây thư mục bằng đúng lệnh
  - Đếm số tệp bị chạm tới bằng hai cách khác nhau
  - 'Chỉ ra ba lỗi hay gặp: dấu cách thừa, ghi đè nhầm, biến rỗng trong lệnh xoá'
  - Viết tệp lệnh dựng một cây cửa hàng và in cây bằng lệnh tìm
  example: rm * .txt (thừa một dấu cách) xoá cả thư mục; mẫu *.txt khớp 3, 300, 3 000 tệp ở ba quy mô (số minh hoạ chạy thật)
  fix:
  - rm không có thùng rác; dấu sao do cửa sổ lệnh mở ra trước khi lệnh chạy, nên xem trước bằng echo
- id: L03
  title: 'Đọc và lọc văn bản: ống và chuyển hướng'
  spec: lessons/fnd/L03_doc_va_loc_van_ban.yaml
  requires:
  - L02
  objectives:
  - Dùng các lệnh xem đầu, xem cuối và đếm dòng để nhìn một tệp lớn
  - Lọc dòng bằng mẫu và cắt cột của tệp bảng
  - Nối các lệnh nhỏ bằng dấu ống và giải thích vì sao phải xếp trước khi gộp
  - Xếp theo giá trị số thay vì theo chữ
  - Đếm một con số bằng ba cách khác nhau để kiểm
  - 'Chỉ ra ba lỗi hay gặp: quên xếp trước khi gộp, dấu chấm trong mẫu, xếp số theo chữ'
  - Viết chuỗi lệnh thống kê loại giao dịch và ba khoản lớn nhất từ tệp bảng
  example: 12 giao dịch minh hoạ gồm 6 chuyển, 3 nạp, 3 rút (6 + 3 + 3 = 12); sort chữ đặt 1000000 trước 120000; tệp 120 000 dòng nặng 728 895 byte (số minh hoạ chạy thật)
  fix:
  - uniq chỉ gộp dòng liền kề nên phải sort trước; sort mặc định so theo chữ, cột số cần -n
- id: L04
  title: Chương trình, PATH, biến môi trường và mã thoát
  spec: lessons/fnd/L04_chuong_trinh_path_ma_thoat.yaml
  requires:
  - L03
  objectives:
  - Giải thích máy tìm lệnh theo thứ tự các thư mục trong PATH và khác biệt của ./ khi chạy tệp
  - Đặt biến, đọc biến và phân biệt biến thường với biến môi trường
  - Đọc mã thoát của một lệnh và nối lệnh bằng hai dấu và, hai gạch đứng
  - Chạy tệp lệnh dừng khi lỗi và so với tệp không dừng
  - Kiểm tệp nào sẽ chạy bằng lệnh hỏi đường dẫn
  - Tính xác suất có ít nhất một bước lỗi khi tệp lệnh dài ra
  - Nêu cách chọn thứ tự thư mục trong PATH và chỉ ra ba lỗi hay gặp
  - Viết tệp lệnh in phiên bản công cụ, mã thoát và gọi một lệnh đặt trong PATH
  example: Mỗi bước lỗi 0,1% (số minh hoạ) thì 10, 100, 1 000 bước có lỗi với xác suất 1,0%, 9,5%, 63,2%; mã thoát 0, 1, 2, 127
  fix:
  - Thư mục đứng trước trong PATH thắng; đặt thư mục dùng chung ở cuối; ống chỉ báo mã của lệnh cuối nếu không bật pipefail
- id: L05
  title: Trình soạn mã, UTF-8, xuống dòng và đọc thông báo lỗi
  spec: lessons/fnd/L05_soan_ma_utf8_doc_loi.yaml
  requires:
  - L04
  objectives:
  - Nêu cách UTF-8 ghi một chữ thành 1, 2 hoặc 3 byte và vì sao đọc sai bảng mã ra ký tự lạ
  - Tính số byte của một chữ theo khuôn UTF-8 và kiểm bằng lệnh in byte
  - 'Đọc một thông báo lỗi của Java, Python, bash: tệp, dòng, loại và mô tả'
  - Phân biệt chỗ máy phát hiện lỗi với chỗ gây lỗi
  - 'Kiểm một phép đoán bằng hai đường khác nhau: tính theo khuôn và đếm bằng máy'
  - Chỉ ra ba lỗi hay gặp và nêu vì sao sửa lỗi đầu tiên trước
  - Sửa ba tệp hỏng từ thông báo lỗi và chạy lại cho đúng
  example: Chữ ă có số 259, nằm trong khoảng 128–2 047 nên 2 byte c4 83; ể (7 875) 3 byte; tệp một chữ ă + xuống dòng nặng 3 byte (số minh hoạ chạy thật)
  fix:
  - Thông báo lỗi chỉ nơi máy phát hiện, không hẳn nơi gây lỗi; sửa lỗi đầu tiên rồi biên dịch lại
- id: L06
  title: 'Dữ liệu có cấu trúc: CSV, JSON và YAML'
  spec: lessons/fnd/L06_du_lieu_co_cau_truc.yaml
  requires:
  - L05
  objectives:
  - Đọc cùng một đơn hàng ở ba dạng CSV, JSON, YAML và chỉ ra hàng, cột, khoá, giá trị, mảng
  - 'Tính đường đi tới một giá trị nằm sâu: khoá, vị trí đếm từ 0, khoá'
  - 'Kiểm một giá trị bằng hai đường: đếm khoá và nạp vào bộ đọc'
  - So sánh dung lượng CSV và JSON khi số bản ghi nhân lên rồi chọn dạng
  - 'Chỉ ra ba lỗi hay gặp: JSON khắt khe, YAML đoán kiểu, cắt cột CSV khi ô có dấu phẩy'
  - Viết tay một tệp JSON hợp lệ và đọc các giá trị trong một tệp YAML
  example: Đơn 2 mặt hàng, tổng 3 × 5 000 + 2 × 12 000 = 39 000; giá mặt hàng thứ hai ở vị trí 2 − 1 = 1; JSON to gấp 2,3–2,6 lần CSV (15/39, 1 592/3 992, 178 894/418 894 byte; số minh hoạ chạy thật)
  fix:
  - Vị trí trong mảng đếm từ 0; JSON không cho nháy đơn, chú thích hay dấu phẩy thừa; cắt cột CSV bằng cut sai khi ô có dấu phẩy trong nháy kép
- id: L07
  title: 'Máy khách, máy chủ và HTTP: hỏi một máy chủ bằng curl'
  spec: lessons/fnd/L07_http_va_curl.yaml
  requires:
  - L06
  objectives:
  - Nêu các phần của một yêu cầu và một phản hồi HTTP
  - Đọc mã trạng thái 2xx, 4xx, 5xx và chọn hành động tương ứng
  - 'Chạy curl tới máy chủ cục bộ: đọc, gửi dữ liệu, in riêng mã trạng thái'
  - Kiểm một câu trả lời bằng hai cách và bằng cả mã lẫn nội dung
  - Tính số người phục vụ cần cùng lúc khi số yêu cầu nhân lên
  - 'Chỉ ra ba lỗi hay gặp: curl mã thoát 0 khi gặp 404, sai phương thức, không đặt thời gian chờ và thử lại mù'
  - Nêu vì sao thử lại hay không cho từng kết quả
  - Viết tệp lệnh hỏi máy chủ lab và in đúng bốn kết quả
  example: Xử lý 20 ms mỗi yêu cầu thì 50, 5 000, 500 000 yêu cầu mỗi giây cần 1, 100, 10 000 người phục vụ cùng lúc (số minh hoạ); GET /chuyen ra 405, POST ra 201, /loi ra 500
  fix:
  - curl mã thoát 0 dù 404 nếu không có -f; mã 200 chưa chắc việc đúng; quá hạn một yêu cầu ghi không có nghĩa chưa làm
- id: L08
  title: Bảng và SQL đầu tiên bằng sqlite
  spec: lessons/fnd/L08_bang_va_sql.yaml
  requires:
  - L07
  objectives:
  - Nêu bảng, hàng, cột, khoá chính và NULL là gì
  - Viết lệnh SELECT với WHERE, ORDER BY, GROUP BY để trả lời một câu hỏi về dữ liệu
  - Dùng UPDATE, DELETE đúng một hàng bằng WHERE và nêu hậu quả khi quên WHERE
  - Dùng giao dịch BEGIN, COMMIT, ROLLBACK để hai lệnh cùng có hiệu lực hoặc cùng không
  - Kiểm một kết quả nhóm bằng tổng toàn bảng
  - So sánh số hàng phải xem khi có và không có chỉ mục khi bảng nhân lên
  - 'Chỉ ra ba lỗi hay gặp: quên WHERE, so sánh bằng với NULL, chuyển tiền không giao dịch'
  - Viết tệp SQL tạo bảng, chèn dữ liệu và in số dư theo tài khoản
  example: Số dư 300 000 + 400 000 + 300 000 = 1 000 000 = tổng toàn bảng; chuyển 100 000 mà mới trừ một bên thì tổng còn 1 900 000, ROLLBACK trả lại 2 000 000; tìm nhị phân 7, 700, 70 000 hàng cần tối đa 3, 10, 17 bước (số minh hoạ)
  fix:
  - UPDATE, DELETE luôn kèm WHERE; so sánh NULL bằng IS NULL; hai lệnh ghi phụ thuộc nhau phải nằm trong một giao dịch
- id: L09
  title: 'Quản lý phiên bản tối thiểu: init, add, commit, log, diff, branch'
  spec: lessons/fnd/L09_git_toi_thieu.yaml
  requires:
  - L08
  objectives:
  - Nêu ba vùng và vòng sửa, add, commit
  - Chạy vòng sửa, add, commit và đọc mã git status -s ở từng bước
  - Tạo nhánh thử nghiệm, chốt trên đó, chuyển về main rồi gộp
  - Kiểm số lần chốt bằng hai cách khác nhau
  - Tính số lần thử tối đa khi tìm lần chốt gây lỗi bằng chia đôi
  - 'Chỉ ra ba lỗi hay gặp: quên add, tệp rác, bí mật đã chốt'
  - Nêu vì sao nên chốt nhỏ, mỗi lần một ý
  - Viết tệp lệnh dựng kho, chốt ba lần và in lịch sử
  example: Tìm lần chốt gây lỗi bằng chia đôi cần tối đa 3, 10, 17 lần thử cho 8, 1 000, 100 000 lần chốt (2^3, 2^10, 2^17); nhánh thử có 3 lần chốt, main 2 lần trước khi gộp (số minh hoạ)
  fix:
  - Chốt chỉ lấy vùng chờ, nên quên add là chốt trống; bí mật đã chốt vẫn đọc được trong lịch sử dù đã xoá tệp
- id: L10
  title: 'Dự án nhỏ: sổ tay giao dịch bằng bash, SQL và git'
  spec: lessons/fnd/L10_so_tay_giao_dich.yaml
  requires:
  - L09
  objectives:
  - Nối tệp lệnh, SQL và quản lý phiên bản thành một quy trình chạy lại được
  - Chạy quy trình sổ tay giao dịch và đọc ba báo cáo
  - 'Kiểm tổng bằng ba đường độc lập: SQL, awk và tính tay'
  - So sánh dung lượng và cách xử lý khi dữ liệu nhân lên 1 000 lần
  - 'Chỉ ra ba lỗi hay gặp: chốt tệp cơ sở dữ liệu, nạp cả dòng tiêu đề, tệp lệnh không chạy lại được'
  - Nêu nên chốt gì vào kho khi tệp dữ liệu rất lớn
  - 'Viết tệp lệnh tổng hợp: nạp dữ liệu, truy vấn, kiểm độc lập và chốt vào kho'
  example: 10 giao dịch tổng nạp 4 900 000 trừ chi 1 750 000 = 3 150 000 khớp awk; chạy lại không xoá thì tổng 6 300 000 (LECH); 10 000 giao dịch nặng 248 221 byte, tổng 130 000 000 (số minh hoạ chạy thật)
  fix:
  - Quy trình phải chạy lại được và kiểm bằng đường độc lập; không chốt tệp cơ sở dữ liệu hay tệp dữ liệu khổng lồ vào kho
