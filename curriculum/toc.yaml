# Giáo án KẾ HOẠCH — TOC · Lý thuyết tính toán: ôtômat, văn phạm, khả quyết
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã TOC:Lxx (85/85 PASS, 2026-10-27).
# Căn cứ phạm vi: CS2023 — Algorithmic Foundations (AL) có đơn vị mô hình tính toán và ngôn ngữ hình thức (tên rút gọn “Models”,
#   theo “1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98); Foundations of Programming Languages (FPL) cho phân tích cú pháp.
# Vì sao cần: phần mềm (biểu thức chính quy, trình biên dịch, máy trạng thái), AI (giới hạn của tính toán), CS112 bài 26 mới nói P/NP mà
#   chưa có mô hình máy Turing.
# Thứ tự học: sau DMS (L00–L05, L09); trước hoặc song song CS112 bài 26.
course: TOC
status: planned
lessons:
  - id: L00
    title: "Bảng chữ cái, chuỗi và ngôn ngữ"
    spec: lessons/toc/L00_chuoi_ngon_ngu.yaml
    requires: []
    requires_ext: ["DMS:L05", "CS115:L01"]   # chỉ số dưới (q_0) học ở CS115 L01
    objectives: ["Định nghĩa chuỗi, độ dài, ghép, ngôn ngữ", "Đếm chuỗi theo độ dài"]
    example: "chuỗi nhị phân độ dài ≤ 3 (kể cả rỗng): 1 + 2 + 4 + 8 = 15 (VER TOC:L00)"
    fix: ["Ngôn ngữ rỗng ∅ khác ngôn ngữ chỉ chứa chuỗi rỗng {ε}"]
  - id: L01
    title: "Ôtômat hữu hạn đơn định (DFA)"
    spec: lessons/toc/L01_dfa.yaml
    requires: [L00]
    objectives: ["Vẽ và chạy một DFA", "Thiết kế DFA theo số dư"]
    example: "DFA 3 trạng thái nhận số nhị phân chia hết cho 3: 110 (= 6) nhận, 111 (= 7) không; đúng cho n = 1..1999 (VER TOC:L01)"
    fix: ["DFA phải có đúng một chuyển cho mỗi ký hiệu ở mỗi trạng thái"]
  - id: L02
    title: "Ôtômat không đơn định và phép dựng tập con"
    spec: lessons/toc/L02_nfa_tap_con.yaml
    requires: [L01]
    objectives: ["Chạy NFA bằng tập trạng thái", "Đổi NFA thành DFA"]
    example: "NFA “kết thúc bằng 01” → dựng tập con được 3 trạng thái DFA tới được (VER TOC:L02)"
    fix: ["Dựng tập con có thể sinh tới 2ⁿ trạng thái — tương đương về sức mạnh, không về kích thước"]
  - id: L03
    title: "Biểu thức chính quy và định lý Kleene"
    spec: lessons/toc/L03_bieu_thuc_chinh_quy.yaml
    requires: [L02]
    objectives: ["Viết biểu thức chính quy cho một ngôn ngữ", "Biết biểu thức chính quy và DFA tương đương"]
    example: "(0|1)*01 khớp đúng các chuỗi kết thúc bằng 01 (máy kiểm mọi chuỗi độ dài ≤ 8, VER TOC:L03)"
    fix: ["Biểu thức chính quy trong nhiều thư viện (có tham chiếu ngược) mạnh hơn ngôn ngữ chính quy"]
  - id: L04
    title: "Bổ đề bơm và ngôn ngữ không chính quy"
    spec: lessons/toc/L04_bo_de_bom.yaml
    requires: [L03]
    objectives: ["Dùng bổ đề bơm để chứng minh 0ⁿ1ⁿ không chính quy"]
    example: "0ᵖ1ᵖ: phần bơm nằm trong khối 0 → bơm lên được 0^(p+k)1ᵖ không thuộc ngôn ngữ"
    fix: ["Bổ đề bơm chỉ dùng để bác bỏ; thoả bổ đề bơm không chứng minh được là chính quy"]
  - id: L05
    title: "Tối thiểu hoá DFA"
    spec: lessons/toc/L05_toi_thieu_hoa.yaml
    requires: [L02]
    objectives: ["Gộp các trạng thái tương đương", "Biết DFA tối tiểu là duy nhất (sai khác tên)"]
    example: "DFA 4 trạng thái cho “kết thúc bằng 01” có hai trạng thái tương đương → gộp còn 3"
    fix: ["Phải bỏ trạng thái không tới được trước khi gộp"]
  - id: L06
    title: "Văn phạm phi ngữ cảnh và cây suy dẫn"
    spec: lessons/toc/L06_van_pham_phi_ngu_canh.yaml
    requires: [L04]
    objectives: ["Viết văn phạm cho ngoặc cân bằng và 0ⁿ1ⁿ", "Dựng cây suy dẫn"]
    example: "chuỗi ngoặc cân bằng độ dài 6: 5 chuỗi = số Catalan C₃ (máy vét cạn, VER TOC:L06)"
    fix: ["Phi ngữ cảnh chỉ về dạng quy tắc (vế trái một biến), không phải “không có ngữ cảnh” trong nghĩa đời thường"]
  - id: L07
    title: "Văn phạm mơ hồ và phân tích cú pháp biểu thức"
    spec: lessons/toc/L07_mo_ho_phan_tich.yaml
    requires: [L06]
    objectives: ["Nhận ra văn phạm mơ hồ", "Khử mơ hồ bằng độ ưu tiên và tính kết hợp"]
    example: "1 + 2 * 3 có hai cây suy dẫn cho 7 và 9; ưu tiên phép nhân chọn 7 (VER TOC:L07)"
    fix: ["Trình biên dịch không “đoán” ý — văn phạm phải quy định rõ ưu tiên"]
  - id: L08
    title: "Ôtômat đẩy xuống"
    spec: lessons/toc/L08_otomat_day_xuong.yaml
    requires: [L06]
    objectives: ["Dùng ngăn xếp để nhận 0ⁿ1ⁿ", "Biết PDA tương đương văn phạm phi ngữ cảnh"]
    example: "đọc 0 thì đẩy, đọc 1 thì lấy ra; nhận khi ngăn xếp rỗng đúng lúc hết chuỗi"
    fix: ["PDA không đơn định mạnh hơn PDA đơn định"]
  - id: L09
    title: "Máy Turing: băng, đầu đọc và bảng chuyển"
    spec: lessons/toc/L09_may_turing.yaml
    requires: [L08]
    objectives: ["Mô tả máy Turing", "Chạy máy cộng một vào số nhị phân"]
    example: "1011 → 1100: đổi các 1 ở cuối thành 0, rồi 0 đầu tiên gặp thành 1 (VER TOC:L09)"
    fix: ["Băng vô hạn là mô hình — nói về khả năng tính được, không về bộ nhớ thật"]
  - id: L10
    title: "Luận đề Church–Turing và máy Turing vạn năng"
    spec: lessons/toc/L10_luan_de_van_nang.yaml
    requires: [L09]
    objectives: ["Phát biểu luận đề và vì sao không phải định lý", "Giải thích máy vạn năng như trình thông dịch"]
    example: "một chương trình Python mô phỏng máy Turing bất kỳ từ bảng chuyển trạng thái"
    fix: ["Luận đề Church–Turing là luận đề (không chứng minh được), không phải định lý"]
  - id: L11
    title: "Bài toán dừng không khả quyết"
    spec: lessons/toc/L11_bai_toan_dung.yaml
    requires: [L10]
    objectives: ["Trình bày chứng minh chéo hoá", "Phân biệt khả quyết và nửa khả quyết"]
    example: "giả sử có H(P, x); dựng D(P) = lặp mãi nếu H(P, P) nói dừng → D(D) mâu thuẫn"
    fix: ["Không khả quyết là không có thuật toán cho MỌI đầu vào — từng chương trình cụ thể vẫn có thể chứng minh dừng"]
  - id: L12
    title: "Quy dẫn và định lý Rice"
    spec: lessons/toc/L12_quy_dan_rice.yaml
    requires: [L11]
    objectives: ["Quy dẫn bài toán dừng về bài toán khác", "Phát biểu định lý Rice"]
    example: "“chương trình P có in ra chữ A với mọi đầu vào không?” không khả quyết theo định lý Rice"
    fix: ["Định lý Rice nói về tính chất của HÀM chương trình tính, không về cú pháp mã"]
  - id: L13
    title: "Độ phức tạp theo máy Turing: P, NP từ góc nhìn mô hình"
    spec: lessons/toc/L13_p_np_may_turing.yaml
    requires: [L09]
    requires_ext: ["CS112:L26"]
    objectives: ["Định nghĩa P, NP bằng máy Turing đơn định, không đơn định", "Nối lại với chứng chỉ ở CS112 bài 26"]
    example: "NP = có máy Turing không đơn định chạy đa thức ⇔ có chứng chỉ kiểm được trong đa thức (hai định nghĩa tương đương)"
    fix: ["“Không đơn định” không có nghĩa là ngẫu nhiên"]
  - id: L14
    title: "Tình huống chuyên gia theo dòng thời gian: biểu thức chính quy từ Thompson tới RE2"
    spec: lessons/toc/L14_hanh_trinh_bieu_thuc_chinh_quy.yaml
    requires: [L02, L03, L13]
    kind: journey
    objectives: ["Kể lại hành trình khớp biểu thức chính quy qua năm chặng (1968 → 2025), mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại số nhánh của cách quay lui, cỡ tập trạng thái của cách Thompson, và đường cong số bước trong bài hậu kiểm năm 2019", "Chọn bộ máy khớp hợp với nguồn của mẫu và của chuỗi vào, kèm điều kiện đổi lựa chọn"]
    example: "a? lặp 29 lần rồi a lặp 29 lần: 2^29 = 536 870 912 cách chọn, chỉ cách cuối khớp (CX07); 60 s so với 20 µs = gấp 3 000 000; số bước .*.*=.* trên x=x…: 23, 33, 45 → k² + 7k + 15 cho đúng 555 ở k = 20 (CF19) (VER TOC:L14)"
    fix: ["Chỉ khẳng định điều có trong TH68, CX07, CX10, CF19, R2 (audit/toc/sources_L14.md); bản ACM của bài năm 1968 bị chặn 403 — đọc bản chép oilshell.org, đối chiếu với lời dẫn của CX07, CF19", "Không nêu tên người viết quy tắc gây sự cố; bài hậu kiểm liệt kê 11 nguyên nhân góp phần — không quy về một người hay một biểu thức", "Số lần thử của bộ đếm trong bài (alg.bt_match) là đơn vị đếm riêng, không phải “số bước” của công cụ gỡ lỗi trong CF19; RE2 không nhanh hơn mọi bộ máy trong mọi trường hợp (R2)"]
