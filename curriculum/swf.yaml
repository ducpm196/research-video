# Giáo án KẾ HOẠCH — SWF · Nền tảng phần mềm đúng đắn
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã SWF:Lxx (85/85 PASS, 2026-10-27).
# Căn cứ phạm vi: CS2023 — Software Development Fundamentals (SDF, 43 giờ CS Core) và Software Engineering (SE, 6 giờ CS Core)
#   (“1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98). Khoá này chọn phần có thể giảng giải bằng lập luận và ví dụ
#   kiểm được (đặc tả, bất biến, kiểm thử, đo đạc); kỹ năng lập trình thực hành cần bài tập máy, không thay được bằng video.
# Vì sao cần: CS112 dạy thiết kế và phân tích thuật toán nhưng chưa dạy cách chứng minh và kiểm một chương trình cụ thể là đúng.
# Thứ tự học: song song CS112; L08 sau TOC:L01; L09 sau OSY:L04; L10 sau CS115:L44.
course: SWF
status: planned
lessons:
  - id: L00
    title: "Đặc tả: tiền điều kiện và hậu điều kiện"
    spec: lessons/swf/L00_dac_ta.yaml
    requires: []
    requires_ext: ["DMS:L02"]
    objectives: ["Viết tiền điều kiện và hậu điều kiện cho một hàm", "Biết ai chịu trách nhiệm khi tiền điều kiện sai", "Dùng đặc tả để quyết định một kết quả là đúng hay sai"]
    example: "tìm kiếm nhị phân: tiền điều kiện mảng đã sắp tăng; hậu điều kiện trả vị trí i với a[i] = x, hoặc −1 nếu x không có (VER SWF:L00)"
    fix: ["Hàm không kiểm tiền điều kiện vẫn đúng theo đặc tả — nhưng phải ghi rõ ai chịu trách nhiệm"]
  - id: L01
    title: "Bất biến vòng lặp và chứng minh chương trình đúng"
    spec: lessons/swf/L01_bat_bien_vong_lap.yaml
    requires: [L00]
    requires_ext: ["DMS:L04"]
    objectives: ["Phát biểu bất biến vòng lặp", "Chứng minh vòng lặp đúng bằng ba bước: khởi đầu, duy trì, kết thúc", "Chọn bất biến đủ mạnh"]
    example: "vòng cộng s: bất biến s = 0 + 1 + … + (i − 1) = i(i − 1)/2 trước mỗi vòng (máy kiểm i ≤ 199, VER SWF:L01)"
    fix: ["Bất biến phải đủ mạnh để cùng điều kiện dừng suy ra hậu điều kiện"]
  - id: L02
    title: "Hàm biến thiên và chứng minh chương trình dừng"
    spec: lessons/swf/L02_ham_bien_thien.yaml
    requires: [L01]
    objectives: ["Phát biểu hàm biến thiên", "Chứng minh vòng lặp dừng", "Nhận ra đại lượng giảm mà không chứng minh được dừng"]
    example: "Euclid: b giảm thật sự vì a mod b < b, và b ≥ 0 → dừng (VER SWF:L02)"
    fix: ["Đại lượng giảm mà không bị chặn dưới không chứng minh được dừng"]
  - id: L03
    title: "Lỗi lệch một và phân tích biên"
    spec: lessons/swf/L03_lech_mot_bien.yaml
    requires: [L01]
    requires_ext: ["CSA:L01"]
    objectives: ["Đếm đúng số phần tử của khoảng nửa mở và khoảng đóng", "Không trộn hai kiểu khoảng trong một vòng lặp", "Tính điểm giữa không tràn số"]
    example: "(lo + hi)/2 tràn số nguyên 32 bit khi lo, hi gần 2³¹; lo + (hi − lo)/2 không tràn (VER SWF:L03)"
    fix: ["Khoảng nửa mở [lo, hi) và khoảng đóng [lo, hi] cần điều kiện vòng lặp khác nhau — trộn hai kiểu sinh lỗi lệch một"]
  - id: L04
    title: "Kiểm thử: phân hoạch tương đương và giá trị biên"
    spec: lessons/swf/L04_kiem_thu_phan_hoach.yaml
    requires: [L03]
    objectives: ["Chia đầu vào thành các lớp tương đương", "Chọn ca kiểm ở biên giữa các lớp", "Hiểu giới hạn của kiểm thử"]
    example: "phân loại tam giác (a, b, c): lớp đều, cân, thường, không phải tam giác; biên a + b = c"
    fix: ["Kiểm thử chỉ ra có lỗi, không chứng minh được không có lỗi (nhận xét nổi tiếng của Dijkstra)"]
  - id: L05
    title: "Độ phủ kiểm thử: lệnh, nhánh, đường đi"
    spec: lessons/swf/L05_do_phu.yaml
    requires: [L04]
    objectives: ["Phân biệt độ phủ lệnh, nhánh, đường đi", "Tính số ca tối thiểu cho mỗi loại độ phủ", "Biết độ phủ cao không có nghĩa là đã kiểm mọi hành vi"]
    example: "3 câu if độc lập: phủ nhánh cần 2 ca, phủ đường cần 2³ = 8 ca (VER SWF:L05)"
    fix: ["Độ phủ 100% dòng lệnh không có nghĩa là đã kiểm mọi hành vi"]
  - id: L06
    title: "Kiểm thử ngẫu nhiên và kiểm thử dựa trên tính chất"
    spec: lessons/swf/L06_kiem_thu_tinh_chat.yaml
    requires: [L04]
    objectives: ["Viết tính chất thay cho từng ca kiểm", "Phân biệt tính chất mạnh và tính chất yếu", "Tìm phản ví dụ nhỏ nhất"]
    example: "tính chất sort(sort(x)) = sort(x) đúng trên mọi dãy độ dài 4, giá trị 0..2 (VER SWF:L06)"
    fix: ["Tính chất quá yếu (ví dụ chỉ kiểm độ dài) cho cảm giác an toàn giả"]
  - id: L07
    title: "Bất biến của cấu trúc dữ liệu"
    spec: lessons/swf/L07_bat_bien_cau_truc.yaml
    requires: [L01]
    requires_ext: ["CS112:L05", "CS112:L06"]
    objectives: ["Phát biểu bất biến biểu diễn của một cấu trúc dữ liệu", "Kiểm đúng bất biến cây tìm kiếm nhị phân và đống", "Biết mọi thao tác phải giữ bất biến"]
    example: "cây tìm kiếm nhị phân: duyệt giữa cho dãy tăng; đống: cha ≤ con ở mọi nút"
    fix: ["Kiểm bất biến chỉ ở nút con trực tiếp chưa đủ cho cây tìm kiếm nhị phân"]
  - id: L08
    title: "Máy trạng thái hữu hạn trong phần mềm"
    spec: lessons/swf/L08_may_trang_thai.yaml
    requires: [L00]
    requires_ext: ["TOC:L01"]
    objectives: ["Mô hình hoá hành vi bằng bảng chuyển trạng thái", "Kiểm tính chất an toàn trên bảng", "Dùng trạng thái lỗi tường minh thay cho cờ rời rạc"]
    example: "đèn giao thông 3 trạng thái và nút bấm cho người đi bộ; chuyển xanh → đỏ không qua vàng là lỗi (chu trình xanh → vàng → đỏ → xanh) (VER SWF:L08)"
    fix: ["Thiếu trạng thái lỗi rõ ràng làm chương trình rơi vào trạng thái “không tên”"]
  - id: L09
    title: "Đồng thời trong mã: tranh chấp, khoá, bế tắc"
    spec: lessons/swf/L09_dong_thoi.yaml
    requires: [L01]
    requires_ext: ["OSY:L04", "OSY:L06"]
    objectives: ["Nhận ra tranh chấp trên biến dùng chung", "Dùng khoá đúng phạm vi", "Tránh bế tắc bằng một thứ tự lấy khoá chung"]
    example: "hai luồng, mỗi luồng x += 1 hai lần (mỗi lần đọc, cộng, ghi): C(12, 6) = 924 cách xen kẽ, x cuối có thể là 2, 3, 4; khoá A rồi B ở một luồng, B rồi A ở luồng kia → bế tắc (VER SWF:L09)"
    fix: ["Thêm lệnh ngủ để “hết lỗi” chỉ che lỗi"]
  - id: L10
    title: "Đo hiệu năng thực nghiệm có thống kê"
    spec: lessons/swf/L10_do_hieu_nang.yaml
    requires: [L04]
    requires_ext: ["CS115:L44", "CS112:L27"]
    objectives: ["Biết vì sao một lần đo không đủ", "So sánh hai cách bằng hiệu ghép cặp và khoảng tin cậy", "Tránh các bẫy đo: khởi động, môi trường, chọn số liệu"]
    example: "đo hai thuật toán trên cùng 30 bộ dữ liệu, báo hiệu thời gian ghép cặp kèm khoảng 95% = trung bình hiệu ± 2,045 · sai số chuẩn (hệ số Student, 29 bậc tự do) (VER SWF:L10)"
    fix: ["Một lần đo không đủ; lần chạy đầu thường chậm vì bộ nhớ đệm, biên dịch tức thời"]
  - id: L11
    title: "Quản lý phiên bản và hợp nhất ba chiều"
    spec: lessons/swf/L11_hop_nhat_ba_chieu.yaml
    requires: [L00]
    objectives: ["Hiểu vì sao hợp nhất cần tổ tiên chung", "Áp dụng luật hợp nhất ba chiều từng dòng", "Biết hợp nhất sạch chưa chắc đúng"]
    example: "tổ tiên chung x = 1; nhánh A đổi thành 2, nhánh B giữ 1 → lấy 2; cả hai đổi khác nhau → xung đột (VER SWF:L11)"
    fix: ["Hợp nhất không xung đột không có nghĩa là đúng về ngữ nghĩa — vẫn phải chạy kiểm thử"]
  - id: L12
    title: "Bảo mật phần mềm: tràn bộ đệm và chèn mã"
    spec: lessons/swf/L12_bao_mat_phan_mem.yaml
    requires: [L03]
    requires_ext: ["CSA:L01"]
    objectives: ["Hiểu tràn bộ đệm ghi đè dữ liệu kề bên", "Hiểu chèn mã khi ghép chuỗi đầu vào vào câu lệnh", "Dùng truy vấn tham số hoá và hàm chép có kiểm độ dài"]
    example: "chuỗi nhập ' OR '1'='1 ghép thẳng vào câu truy vấn làm điều kiện luôn đúng; câu truy vấn tham số hoá coi nó là dữ liệu (VER SWF:L12)"
    fix: ["Lọc ký tự nguy hiểm bằng tay không thay được truy vấn tham số hoá"]
  - id: L13
    title: "Tình huống chuyên gia theo dòng thời gian: một kho mã chung cho hàng chục nghìn kỹ sư"
    spec: lessons/swf/L13_hanh_trinh_kho_ma_chung.yaml
    requires: [L04, L11]
    see_also: ["DVO:L01", "DVO:L02", "DVO:L03"]
    kind: journey
    objectives: ["Kể lại hành trình kho mã chung của Google qua năm chặng (2010 → 2020), mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại số thay đổi mỗi ngày, số chỗ sửa mỗi phần, số kiểm thử đỏ giả, số lần chạy khi chia đôi một lô", "Chọn cách tổ chức kho mã và nhánh hợp với quy mô của chính mình, kèm điều kiện đổi lựa chọn"]
    example: "hơn 20 thay đổi mỗi phút (ET11) → hơn 28 800 mỗi ngày; 35 000 chỗ sửa trong 3100 phần (CM13) ≈ 11,3 chỗ mỗi phần; 1,5% chập chờn của 1000 kiểm thử (FT16) = 15; 4 tỉ ca kiểm thử / 50 000 thay đổi mỗi ngày (SE20) = 80 000; lô 16 thay đổi (số minh hoạ) chia đôi 4 lần (VER SWF:L13)"
    fix: ["Chỉ khẳng định điều có trong ET11, TB11, CM13, FT16, TM17, SE20 (audit/swf/sources_L13.md); bài Potvin & Levenberg, CACM 2016 (ứng viên của ROADMAP) KHÔNG đọc được bản đầy đủ (ACM 403, web.archive.org 429) nên không dùng số của bài đó (1 tỉ tệp, 35 triệu lần gộp…)", "Đồ thị 1 thư viện + 2 dự án, 2 phút mỗi phần duyệt, lô 16 thay đổi, công ty 40 kỹ sư, 5 đội là số minh hoạ; năm chuyển hệ quản lý phiên bản, tên công cụ đầu tiên — nguồn đã đọc không ghi, không dạy", "Sách năm 2020 tự ghi: kho đơn khối không hợp với mọi nơi — điều cần giữ là một phiên bản cho mỗi phụ thuộc"]
