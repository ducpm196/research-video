# Giáo án Khoá INT · Phỏng vấn Kỹ sư Tích hợp Ngân hàng Cấp cao: Nền tảng, Hệ phân tán, T24, NAPAS, AI Multiplier & Deal 50M
course: INT
status: active
lessons:
  - id: L00
    title: "Lộ trình Năng lực Phỏng vấn Banking: Từ Con số 0 đến Deal Lương 50M Gross"
    spec: lessons/int/L00_overview_zero_to_senior.yaml
    requires: []
    objectives:
      - "Định vị lộ trình thực chiến từ con số không và mất gốc đến kỹ sư ngân hàng cấp cao"
      - "Nắm vững 5 tầng kiến trúc kỹ thuật: Java lõi, Microservices, Hệ phân tán, T24 và NAPAS"
      - "Trình bày trung thực chương trình Cử nhân AI tại UIT (dự kiến tốt nghiệp 11/2026) như một lợi thế khi đề xuất mức 50 triệu gross"
    example: "Bốn bước giải bài toán chống trừ tiền kép khi chuyển khoản (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không học vẹt từ khóa bề mặt mà phải sở hữu năng lực định lượng và giải quyết sự cố phân tán thực tế"]

  - id: L01
    title: "Nền tảng Khoa học Máy tính, Java 21 Hiện đại, JVM và Đa luồng"
    spec: lessons/int/L01_foundation_cs_java.yaml
    requires: [L00]
    objectives:
      - "Làm chủ mô hình phân cấp bộ nhớ máy tính, CPU Cache Line và bộ nhớ JVM"
      - "Hiểu sâu cơ chế Garbage Collection và các tính năng Java 21 Virtual Threads"
      - "Nắm vững độ phức tạp thuật toán và cấu trúc dữ liệu B-Tree trong cơ sở dữ liệu"
    example: "Tối ưu Xử lý 10,000 Giao dịch Đồng thời với Luồng Ảo (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không dùng kiểu số thực cho tiền tệ mà bắt buộc dùng số thập phân chính xác với quy tắc làm tròn tường minh"]

  - id: L02
    title: "Kỹ nghệ Microservices, Spring Boot, REST API và Redis"
    spec: lessons/int/L02_backend_microservices.yaml
    requires: [L00, L01]
    objectives:
      - "Làm chủ vòng đời Spring Bean, Dynamic Proxy và xử lý triệt để lỗi tự gọi hàm nội bộ"
      - "Nắm vững các mức lan truyền Transaction và quy tắc Rollback chuẩn mực ngân hàng"
      - "Thiết kế REST API chuẩn RFC 9457, cơ chế Idempotency và cấu hình Connection Pool"
    example: "Xử lý 5,000 Yêu cầu Chuyển tiền với Khóa Phân tán (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không gọi hàm nội bộ cùng class khiến mất proxy transaction mà tách service hoặc inject qua ApplicationContext"]

  - id: L03
    title: "Hệ thống Phân tán, SAGA Pattern và Tối ưu hóa Oracle 19c"
    spec: lessons/int/L03_distributed_systems_senior.yaml
    requires: [L00, L01, L02]
    objectives:
      - "Hiểu rõ hạn chế của giao thức 2PC và làm chủ mô hình SAGA Orchestration trong ngân hàng"
      - "Triển khai mẫu Transactional Outbox với CDC Debezium xử lý hiểm họa ghi kép"
      - "Tối ưu hóa bảng ghi Oracle 19c bằng Partitioning và phòng ngừa bế tắc khóa ORA-00060"
    example: "Phòng ngừa Bế tắc Khóa Oracle ORA-00060 Ngày Chi lương (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không thực hiện ghi kép vào cơ sở dữ liệu và hàng đợi mà gom vào cùng transaction ACID qua bảng outbox"]

  - id: L04
    title: "Nghiệp vụ Ngân hàng Core T24 và NAPAS 247"
    spec: lessons/int/L04_banking_domain_t24_napas.yaml
    requires: [L00, L01, L02, L03]
    objectives:
      - "Làm chủ bản tin OFS trên Temenos T24 và kết nối hàng đợi IBM MQ bất đồng bộ"
      - "Nắm vững cấu trúc bản tin ISO 8583 MTI 0200 cổng NAPAS 247 và dịch mã PIN trong HSM"
      - "Bao quát 6 trụ cột tín dụng bán lẻ Squad Lending: Thấu chi sổ tiết kiệm, lương, thẻ và cổng CIC"
    example: "Đối soát Ba bên Cuối ngày EOD bằng Thuật toán Hai con trỏ (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không gọi đồng bộ làm treo thread pool mà phân tách luồng gửi nhận bất đồng bộ qua correlation ID"]

  - id: L05
    title: "Ứng dụng AI Ngân hàng: Chương trình Cử nhân AI UIT và Lợi thế Cạnh tranh"
    spec: lessons/int/L05_uit_ai_banking_multiplier.yaml
    requires: [L00, L01, L02, L03, L04]
    objectives:
      - "Làm rõ các khối kiến thức của chương trình Cử nhân AI tại Đại học Công nghệ Thông tin UIT ĐHQG-HCM (dự kiến tốt nghiệp 11/2026)"
      - "Hiểu 3 ý tưởng thiết kế: Phát hiện gian lận độ trễ thấp, định tuyến thông minh và đối soát ngữ nghĩa"
      - "Bảo vệ bản lĩnh phỏng vấn trước câu hỏi vì sao đang làm tích hợp lại học Cử nhân AI, và vị thế Kỹ sư Cấp cao"
    example: "Phát hiện Gian lận Thẻ trong Ngân sách Độ trễ (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không phóng đại dự án AI mà nói đúng mức nguyên mẫu học thuật, dự kiến tốt nghiệp 11/2026, và chỉ ra chỗ đặt mô hình: mô hình nhẹ trên luồng đồng bộ, mô hình nặng trên luồng bất đồng bộ"]

  - id: L06
    title: "Bộ 100 Câu hỏi Phỏng vấn Thực chiến Senior Banking ACB"
    spec: lessons/int/L06_interview_qa_bank_100.yaml
    requires: [L00, L01, L02, L03, L04, L05]
    objectives:
      - "Làm chủ phản xạ 5 nhóm câu hỏi: Khoa học máy tính lõi, Microservices, Hệ phân tán, Nghiệp vụ core banking (T24) và Thiết kế hệ thống"
      - "Nắm vững phương pháp trả lời đào sâu 5 tầng kỹ thuật và giải thích sự cố sản xuất thực tế"
      - "Chứng minh phẩm chất Kỹ sư Cấp cao luôn đặt an toàn dòng tiền và tính toàn vẹn hệ thống lên hàng đầu"
    example: "Kể Câu chuyện Sự cố Sản xuất Thực tế tại OCB (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không trả lời theo kiểu lý thuyết hàn lâm mà phân tích theo góc nhìn cân bằng giữa chi phí, rủi ro và hiệu năng"]

  - id: L07
    title: "Chiến lược Đàm phán Lương 50 Triệu Gross"
    spec: lessons/int/L07_salary_negotiation_50m_gross.yaml
    requires: [L00, L01, L02, L03, L04, L05, L06]
    objectives:
      - "Làm chủ ma trận giá trị có bằng chứng khi đề xuất mức 50 triệu gross"
      - "Thuần thục kịch bản đối đáp 3 vòng: Sàng lọc nhân sự, hội đồng kỹ thuật và chốt đãi ngộ"
      - "Xử lý khéo các đòn ép giá về số năm kinh nghiệm và kiểm tra đối soát phúc lợi ngoài lương"
    example: "Bẻ gãy Ba Đòn Ép giá Kinh điển của Tuyển dụng (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không hạ thấp mức lương chỉ vì áp lực kiểm tra lý lịch mà dùng năng lực giải quyết sự cố làm điểm tựa định giá"]
