# Giáo án Khoá INT · Phỏng vấn Kỹ sư Tích hợp Ngân hàng Cấp cao: Nền tảng, Hệ phân tán, T24, NAPAS, AI Multiplier & Đàm phán Lương
course: INT
status: active
lab: {lang: [md], requires: []}
lessons:
  - id: L00
    title: "Lộ trình Năng lực Phỏng vấn Banking: Từ Con số 0 đến Kỹ sư Backend Ngân hàng Cấp cao"
    spec: lessons/int/L00_overview_zero_to_senior.yaml
    requires: []
    objectives:
      - "Nêu năm tầng năng lực từ nền tảng máy tính đến AI và thứ tự học"
      - "Phân biệt hai nhóm vai trò backend ngân hàng (microservices hiện đại và hệ cũ cùng nghiệp vụ) để chọn trọng tâm ôn và trọng tâm hồ sơ"
      - "Tính số yêu cầu đang xử lý dở theo định luật Little và phút ngừng cho phép của mục tiêu sẵn sàng ở ba mức tải"
      - "Giải bài toán chống trừ tiền kép bằng bốn bước: mã yêu cầu, khoá Redis, ràng buộc UNIQUE, hàng đợi tin nhắn"
      - "Nêu công thức gói thu nhập năm T = L × (13 + k) với số minh hoạ, và vì sao phải hỏi khung lương trước khi nêu con số"
      - "Nêu cách trả lời trung thực về chương trình Cử nhân AI đang học (dự kiến tốt nghiệp cuối năm 2026)"
      - "Trả lời một câu phỏng vấn có số: tải đang dở, ngân sách ngừng và phân nhóm một tin tuyển dụng"
    example: "Bốn bước giải bài toán chống trừ tiền kép khi chuyển khoản (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không học vẹt từ khóa bề mặt mà phải sở hữu năng lực định lượng và giải quyết sự cố phân tán thực tế"]

  - id: L01
    title: "Nền tảng Khoa học Máy tính, Java 21 Hiện đại, JVM và Đa luồng"
    spec: lessons/int/L01_foundation_cs_java.yaml
    requires: [L00]
    objectives:
      - "Nêu phân cấp bộ nhớ máy tính, khối đệm 64 byte và hiện tượng chia sẻ giả"
      - "Trình bày vùng nhớ của máy ảo Java và ba loại đợt thu gom rác"
      - "Nêu lý do tiền dùng số thập phân chính xác thay vì số thực nhị phân"
      - "Tính chiều cao cây B-Tree và số lần đọc đĩa ở ba cỡ bảng, so với quét toàn bảng"
      - "Tính bộ nhớ ngăn xếp của luồng hệ điều hành và luồng ảo, và chạy mười nghìn luồng ảo trên Java 21"
      - "Nêu vì sao nối chuỗi trong vòng lặp nên dùng StringBuilder"
      - "Nêu bẫy rò rỉ biến cục bộ luồng khi dùng bể luồng và cách tránh"
      - "Trả lời một câu phỏng vấn có số về chỉ mục B-Tree và bộ nhớ luồng"
    example: "Tối ưu Xử lý 10,000 Giao dịch Đồng thời với Luồng Ảo (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không dùng kiểu số thực cho tiền tệ mà bắt buộc dùng số thập phân chính xác với quy tắc làm tròn tường minh"]

  - id: L02
    title: "Kỹ nghệ Microservices, Spring Boot, REST API và Redis"
    spec: lessons/int/L02_backend_microservices.yaml
    requires: [L00, L01]
    objectives:
      - "Trình bày vòng đời bean và lớp vỏ ủy quyền, vì sao gọi hàm trong cùng lớp làm mất giao dịch"
      - "Nêu mức lan truyền REQUIRED và REQUIRES_NEW, và điều kiện để REQUIRES_NEW có tác dụng"
      - "Nêu quy tắc huỷ bỏ mặc định của Spring với lỗi thời gian chạy và lỗi kiểm tra"
      - "Nêu khung lỗi RFC 9457 và ý nghĩa các mã 202, 409, 422"
      - "Thiết kế đường xử lý yêu cầu trùng: khoá Redis chặn sớm, ràng buộc duy nhất ở cơ sở dữ liệu, trạng thái chờ khi lõi quá hạn"
      - "Tính thông lượng tối đa của bể kết nối ở ba mức tải bằng thời gian giữ kết nối"
      - "Nêu chỗ đặt đúng của Filter, Interceptor và Aspect cho việc đọc chứng thư mTLS"
      - "Chọn Bộ lọc Bloom trước tầng bộ nhớ đệm để chặn truy vấn tài khoản không tồn tại, và nêu giới hạn của nó"
      - "Trả lời một câu phỏng vấn có số về kích thước bể kết nối và chi phí của REQUIRES_NEW"
    example: "Xử lý 5,000 Yêu cầu Chuyển tiền với Khóa Phân tán (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không gọi hàm nội bộ trong cùng một lớp (làm mất lớp vỏ giao dịch); chuyển hàm đó sang một đối tượng khác, tức tách dịch vụ, để lời gọi đi qua lớp vỏ"]

  - id: L03
    title: "Hệ thống Phân tán, SAGA Pattern và Tối ưu hóa Oracle 19c"
    spec: lessons/int/L03_distributed_systems_senior.yaml
    requires: [L00, L01, L02]
    objectives:
      - "Nêu hạn chế của cam kết hai pha và cách mô hình SAGA điều phối bù trừ khi đối tác lỗi"
      - "Trình bày mẫu Transactional Outbox với bắt thay đổi dữ liệu và vì sao hết ghi kép"
      - "Nêu cấu hình Kafka để không mất tin: xác nhận đủ bản sao, số bản sao đồng bộ tối thiểu, phát tin lũy đẳng"
      - "Áp dụng khoá hàng có thứ tự xác định để tránh bế tắc ORA-00060"
      - "Tính số lần đổi ngữ cảnh giữa PL/SQL và SQL khi xử lý từng dòng so với xử lý theo lô"
      - "Tính thời gian một dòng nóng bị giữ khoá của cam kết hai pha so với SAGA ở ba mức chậm của đối tác"
      - "Nêu quy trình điều tra ORA-00060 qua tệp vết và cách chữa tận gốc"
      - "Nêu hai sai lầm làm Oracle quá tải giờ cao điểm: bảng không phân vùng và khoá ngoại thiếu chỉ mục"
      - "Trả lời một câu phỏng vấn có số về xử lý lô lương và thời gian giữ khoá"
    example: "Phòng ngừa Bế tắc Khóa Oracle ORA-00060 Ngày Chi lương (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không thực hiện ghi kép vào cơ sở dữ liệu và hàng đợi mà gom vào cùng transaction ACID qua bảng outbox"]

  - id: L04
    title: "Nghiệp vụ Ngân hàng Core T24 và NAPAS 247"
    spec: lessons/int/L04_banking_domain_t24_napas.yaml
    requires: [L00, L01, L02, L03]
    objectives:
      - "Nêu cách ra lệnh cho hệ lõi bằng bản tin OFS qua hàng đợi và vai trò của mã tương quan"
      - "Dựng bản đồ bit của bản tin ISO 8583 và khối PIN định dạng 0 bằng mã Python chạy thật"
      - "Nêu cách dịch khối PIN giữa các khoá bên trong HSM mà PIN không bao giờ lộ dạng rõ"
      - "Tính sau bao lâu số theo dõi STAN quay vòng và số tin đang chờ ở ba mức tải, rồi nêu vì sao khoá khử trùng không chỉ dựa vào STAN"
      - "Xác định cách xử lý mã phản hồi 68 (nghi vấn) từ NAPAS"
      - "Nêu hai sai lầm khi nối cổng chuyển mạch là cộng tiền khi chưa kiểm MAC và bỏ qua khử trùng lặp"
      - "Trả lời một câu phỏng vấn có số: bản đồ bit, khối PIN, vòng quay STAN và số tin đang chờ"
    example: "Khi tải tăng, STAN quay vòng và tin đang chờ phình ra (VER INT:L04; mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không gọi đồng bộ làm treo thread pool mà phân tách luồng gửi nhận bất đồng bộ qua correlation ID"]

  - id: L05
    title: "Ứng dụng AI Ngân hàng: Chương trình Cử nhân AI UIT và Lợi thế Cạnh tranh"
    spec: lessons/int/L05_uit_ai_banking_multiplier.yaml
    requires: [L00, L01, L02, L03, L04]
    objectives:
      - "Nêu các khối kiến thức của chương trình Cử nhân AI ở UIT và nói đúng mốc dự kiến tốt nghiệp cuối năm 2026"
      - "Trình bày kiến trúc đường dẫn kép: mô hình nhẹ ở luồng đồng bộ, mô hình nặng ở luồng bất đồng bộ"
      - "Tính vận tốc di chuyển, điểm Z, điểm UCB1 và độ tương đồng cosine bằng mã Python chạy thật"
      - "Tính số nhân xử lý cần cho mô hình nhẹ và mô hình nặng ở ba mức tải"
      - "Xác định ngưỡng điểm rủi ro của mô hình khác ngưỡng xác thực sinh trắc học theo quy định"
      - "Nêu cách trả lời trung thực khi được hỏi vì sao đang làm tích hợp lại học Cử nhân AI"
      - "Trả lời một câu phỏng vấn có số về số nhân xử lý, điểm Z, UCB1 và cosine"
    example: "Phát hiện Gian lận Thẻ trong Ngân sách Độ trễ (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không phóng đại dự án AI mà nói đúng mức nguyên mẫu học thuật, dự kiến tốt nghiệp cuối năm 2026, và chỉ ra chỗ đặt mô hình: mô hình nhẹ trên luồng đồng bộ, mô hình nặng trên luồng bất đồng bộ"]

  - id: L06
    title: "Trả lời Phỏng vấn Senior Banking ACB: Khung 5 Tầng, Năm Tình huống"
    spec: lessons/int/L06_interview_qa_bank_100.yaml
    requires: [L00, L01, L02, L03, L04, L05]
    objectives:
      - "Nêu năm nhóm câu hỏi của bộ câu hỏi luyện thêm và cách chọn trọng tâm ôn theo hai nhóm vai trò (dịch vụ nhỏ hiện đại; hệ cũ và nghiệp vụ)"
      - "Trả lời theo khung năm tầng: định nghĩa, cơ chế, tình huống biên, sự cố thực tế, số đo"
      - "Tính số yêu cầu dở cùng lúc, số máy cần và ngân sách ngừng của đề thiết kế 10 000 giao dịch mỗi giây ở ba mức tải"
      - "Kể một sự cố sản xuất theo khung bối cảnh, hành động, kết quả; nêu số đo thật hoặc nói rõ chưa đo"
      - "Xác định khi nào bắt buộc xác thực khuôn mặt theo ngưỡng một lần chuyển trên 10 triệu hoặc tổng trong ngày trên 20 triệu"
      - "Nêu kế hoạch 90 ngày đầu theo ba mốc 30 ngày"
      - "Nêu vì sao trả lời lý thuyết suông mà thiếu dẫn chứng thì bị đánh giá thấp"
      - "Trả lời một câu phỏng vấn có số: yêu cầu dở cùng lúc, số máy, ngân sách ngừng, chuỗi dịch vụ và ngưỡng sinh trắc học"
    example: "Khung kể một sự cố (ví dụ minh hoạ, không phải kinh nghiệm của bạn; mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không trả lời theo kiểu lý thuyết hàn lâm mà phân tích theo góc nhìn cân bằng giữa chi phí, rủi ro và hiệu năng"]

  - id: L07
    title: "Chiến lược Đàm phán Lương: Hỏi Khung, Tính Tổng Đãi ngộ và Đối đáp Ba Vòng"
    spec: lessons/int/L07_salary_negotiation_50m_gross.yaml
    requires: [L00, L01, L02, L03, L04, L05, L06]
    objectives:
      - "Nêu cách hỏi khung lương và cấu trúc thu nhập ở vòng nhà tuyển dụng, và vì sao không nêu con số khi chưa có nguồn"
      - "Tính tổng đãi ngộ năm bằng công thức T = L × (13 + k) + 12 × P với số minh hoạ"
      - "So sánh hai đề nghị bằng tổng đãi ngộ ở mức thưởng xấu nhất và tốt nhất"
      - "Nêu kịch bản đối đáp ba vòng: nhà tuyển dụng, hội đồng kỹ thuật, chốt đãi ngộ"
      - "Nêu lời đáp trung thực cho ba đòn ép giá thường gặp"
      - "Tính phần thu nhập mất đi theo thời gian khi chốt lương cứng thấp ở đầu, ở các mốc 1, 3 và 5 năm"
      - "Nêu quy tắc khai đúng tổng thu nhập thật ở vòng sàng lọc"
      - "Trả lời một câu phỏng vấn có số: so hai đề nghị bằng tổng đãi ngộ"
    example: "Bẻ gãy Ba Đòn Ép giá bằng lời trung thực và phép tính tổng đãi ngộ (mọi số liệu trong bài là ví dụ minh hoạ, không phải mức lương của ngân hàng nào)"
    fix: ["Không nêu con số lương khi chưa biết khung và chưa có nguồn: hỏi khung lương và cấu trúc thu nhập, rồi so đề nghị bằng công thức tổng đãi ngộ với số minh hoạ ghi rõ"]

  - id: L08
    title: "Tín dụng Bán lẻ và Đối soát Cuối ngày"
    spec: lessons/int/L08_tin_dung_ban_le_va_doi_soat_cuoi_ngay.yaml
    requires: [L04, L07]
    requires_ext: ["PYT:L00", "PYT:L01", "PYT:L02", "PYT:L03"]
    objectives:
      - "Nêu sáu mảng tín dụng bán lẻ và các khái niệm LTV, DTI, CIC, trích nợ từng phần"
      - "Tính hạn mức theo LTV, tỉ lệ DTI và số tiền thu từng phần khi số dư không đủ trả"
      - "Đọc cách đối soát hai danh sách đã sắp xếp bằng hai con trỏ, trong đó mỗi bản ghi chỉ được xem đúng một lần"
      - "Tính số phép so sánh của đối soát ba bên cuối ngày bằng vòng lặp lồng nhau và bằng sắp xếp cộng hai con trỏ ở ba cỡ dữ liệu"
      - "Nêu vì sao khoá giải ngân hết hạn trước khi hệ lõi trả lời gây giải ngân trùng, và hai lớp chặn cần có"
      - "Nêu thứ tự hai pha khi cấp thấu chi cầm cố và cách phục hồi khi pha hai lỗi"
      - "Trả lời một câu phỏng vấn có số: hạn mức theo LTV, tỉ lệ DTI, trích nợ từng phần và số phép so sánh của đối soát"
    example: "Đối soát Ba bên Cuối ngày bằng Thuật toán Hai con trỏ (VER INT:L08; mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào)"
    fix: ["Không coi trích nợ từng phần là hết nợ và không tin riêng khoá Redis để chặn giải ngân trùng: phần thiếu vẫn tính ngày quá hạn, và lớp chặn cuối là ràng buộc duy nhất ở hệ lõi"]
