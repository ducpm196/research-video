# Giáo án Khoá INT · Phỏng vấn Kỹ sư Tích hợp Ngân hàng Cấp cao: Nền tảng, Hệ phân tán, T24, NAPAS, AI Multiplier & Deal 50M
course: INT
status: active
lessons:
  - id: L00
    title: "Khung Năng lực Phỏng vấn Kỹ sư Tích hợp Ngân hàng: Từ Con số 0 đến Deal Lương 50M Gross"
    spec: lessons/int/L00_overview_zero_to_senior.yaml
    requires: []
    objectives:
      - "Định vị lộ trình thực chiến từ con số không và mất gốc đến kỹ sư ngân hàng cấp cao"
      - "Nắm vững 5 tầng kiến trúc kỹ thuật: Java lõi, Microservices, Hệ phân tán, T24 và NAPAS"
      - "Làm chủ chiến lược biến văn bằng AI trường UIT thành lợi thế cạnh tranh thương lượng lương 50 triệu gross"
    example: "xử lý 50000 giao dịch mỗi giây với thời gian phục vụ 10 mili giây; khóa phân tán Redis 60 giây"
    fix: ["Không học vẹt từ khóa bề mặt mà phải sở hữu năng lực định lượng và giải quyết sự cố phân tán thực tế"]

  - id: L01
    title: "Nền tảng Khoa học Máy tính, Java 21 Hiện đại, JVM và Đa luồng"
    spec: lessons/int/L01_foundation_cs_java.yaml
    requires: [L00]
    objectives:
      - "Làm chủ mô hình phân cấp bộ nhớ máy tính, CPU Cache Line và bộ nhớ JVM"
      - "Hiểu sâu cơ chế Garbage Collection và các tính năng Java 21 Virtual Threads"
      - "Nắm vững độ phức tạp thuật toán và cấu trúc dữ liệu B-Tree trong cơ sở dữ liệu"
    example: "truy xuất bộ nhớ đệm CPU trong 1 nano giây; khởi tạo một triệu luồng ảo tốn vài trăm byte bộ nhớ"
    fix: ["Không dùng kiểu số thực cho tiền tệ mà bắt buộc dùng số thập phân chính xác với quy tắc làm tròn tường minh"]

  - id: L02
    title: "Kỹ nghệ Microservices Doanh nghiệp, Spring Boot, REST API và Redis"
    spec: lessons/int/L02_backend_microservices.yaml
    requires: [L00, L01]
    objectives:
      - "Làm chủ vòng đời Spring Bean, Dynamic Proxy và tránh lỗi tự gọi hàm nội bộ làm @Transactional mất hiệu lực"
      - "Nắm vững các mức lan truyền Transaction và quy tắc Rollback chuẩn mực ngân hàng"
      - "Thiết kế REST API chuẩn RFC 7807, cơ chế Idempotency và cấu hình Connection Pool"
    example: "cấu hình connection pool 30 kết nối phục vụ 5000 request; khóa phân tán Redis khử trùng lặp trong 120 giây"
    fix: ["Không gọi hàm nội bộ cùng class khiến mất proxy transaction mà tách service hoặc inject qua ApplicationContext"]

  - id: L03
    title: "Hệ thống Phân tán, SAGA Pattern, Kafka EOS và Tối ưu hóa Oracle 19c"
    spec: lessons/int/L03_distributed_systems_senior.yaml
    requires: [L00, L01, L02]
    objectives:
      - "Hiểu rõ hạn chế của giao thức 2PC và làm chủ mô hình SAGA Orchestration trong ngân hàng"
      - "Triển khai mẫu Transactional Outbox với CDC Debezium tránh lỗi ghi kép (giao nhận at-least-once, consumer phải lũy đẳng)"
      - "Tối ưu hóa bảng ghi Oracle 19c bằng Partitioning và giảm bế tắc ORA-00060 bằng thứ tự khóa toàn cục"
    example: "xử lý 50000 thông điệp mỗi giây qua Kafka với Zero Message Loss; giảm thời gian khóa dòng xuống 5 mili giây"
    fix: ["Không thực hiện ghi kép vào cơ sở dữ liệu và hàng đợi mà gom vào cùng transaction ACID qua bảng outbox"]

  - id: L04
    title: "Nghiệp vụ Ngân hàng Toàn diện: Core T24, Chuyển mạch NAPAS và Squad Lending"
    spec: lessons/int/L04_banking_domain_t24_napas.yaml
    requires: [L00, L01, L02, L03]
    objectives:
      - "Làm chủ bản tin OFS XML trên Temenos T24 và kết nối hàng đợi IBM MQ bất đồng bộ"
      - "Nắm vững cấu trúc bản tin ISO 8583 MTI 0200 cổng NAPAS 247 và bảo mật giải mã PIN"
      - "Bao quát 6 trụ cột tín dụng bán lẻ Squad Lending: Thấu chi sổ tiết kiệm, lương, thẻ tín dụng, BNPL, thế chấp, trả góp"
    example: "xử lý 8000 TPS cổng NAPAS với thời gian phản hồi dưới 120 mili giây; giải ngân hạn mức thấu chi trong 3 giây"
    fix: ["Không gọi đồng bộ làm treo thread pool mà phân tách luồng gửi nhận bất đồng bộ qua correlation ID"]

  - id: L05
    title: "Lợi thế Văn bằng UIT AI: Biến Trí tuệ Nhân tạo thành Bộ nhân Năng lực Ngân hàng"
    spec: lessons/int/L05_uit_ai_banking_multiplier.yaml
    requires: [L00, L01, L02, L03, L04]
    objectives:
      - "Bảo vệ thuyết phục giá trị văn bằng Cử nhân Trí tuệ Nhân tạo UIT trước hội đồng tuyển dụng ngân hàng"
      - "Liên hệ kiến thức chương trình Cử nhân AI UIT (dự kiến tốt nghiệp 11/2026) với các bài toán backend ngân hàng, không nói quá"
      - "Triển khai 3 bài toán AI thực chiến: Phát hiện gian lận ONNX, Cân bằng tải thích ứng, Đối soát thông minh"
    example: "suy luận mô hình ONNX dưới 5 mili giây trong luồng giao dịch; tăng tỷ lệ định tuyến giao dịch thành công lên 99.2 phần trăm"
    fix: ["Không né tránh bằng AI mà tự tin biến nó thành vũ khí cạnh tranh độc bản tạo ra giá trị kinh doanh vượt trội"]

  - id: L06
    title: "Ngân hàng 100 Câu hỏi Phỏng vấn Senior Banking: Giải mã Tình huống Khó và Phản biện Sâu"
    spec: lessons/int/L06_interview_qa_bank_100.yaml
    requires: [L00, L01, L02, L03, L04, L05]
    objectives:
      - "Làm chủ phương pháp trả lời STAR và kỹ thuật phản xạ trước các câu hỏi kiến trúc hóc búa"
      - "Phân tích các tình huống sự cố giả định: Deadlock, Network Split-Brain, Data Drift"
      - "Tự tin đối thoại với Giám đốc Công nghệ và Trưởng phòng Kiến trúc Doanh nghiệp"
    example: "xử lý sự cố phân mảnh mạng liên ngân hàng với độ trễ đối soát dưới 3 phút; phục hồi dữ liệu từ bản tin CDC"
    fix: ["Không trả lời theo kiểu lý thuyết hàn lâm mà phân tích theo góc nhìn cân bằng giữa chi phí, rủi ro và hiệu năng"]

  - id: L07
    title: "Nghệ thuật Đàm phán Hợp đồng Lao động: Chinh phục Mức lương 50 Triệu Gross và Đãi ngộ Banking"
    spec: lessons/int/L07_salary_negotiation_50m_gross.yaml
    requires: [L00, L01, L02, L03, L04, L05, L06]
    objectives:
      - "Làm chủ cấu trúc thu nhập ngân hàng: Lương cơ bản, phụ cấp, thưởng kinh doanh và đãi ngộ bảo hiểm"
      - "Áp dụng kỹ thuật mỏ neo giá trị và đòn bẩy đa lời mời làm việc (BATNA)"
      - "Vượt qua thử thách kiểm tra lý lịch và xác minh thâm niên bảo hiểm xã hội qua VssID"
    example: "đạt mức lương cứng 50 triệu gross một tháng, tổng gói thu nhập năm 700 đến 850 triệu đồng (13 tháng cố định + 1–4 tháng thưởng theo tin tuyển dụng ACB)"
    fix: ["Không hạ thấp mức lương chỉ vì áp lực kiểm tra lý lịch mà dùng năng lực giải quyết sự cố làm điểm tựa định giá"]
