# Giáo án KẾ HOẠCH — DVO · DevOps: tích hợp, triển khai liên tục và vận hành
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã DVO:Lxx.
# Căn cứ phạm vi: CS2023 — Software Engineering (SE) và Software Development Fundamentals (SDF); chỉ số DORA (tần suất triển khai,
#   thời gian đưa thay đổi lên, tỉ lệ thay đổi thất bại, thời gian khôi phục) theo Forsgren, Humble, Kim, “Accelerate” (2018)
#   — CITED theo tên sách, câu chữ chưa tra lại trong phiên này (NOT_VERIFIED).
# Vì sao cần: SWF dạy viết và kiểm mã đúng; CLD dạy nơi mã chạy. DevOps nối hai phần: biến mỗi thay đổi thành bản phát hành nhỏ,
#   tự động, đo được, quay lui được.
# Thứ tự học: sau SWF L04–L06, L11; song song CLD (L02, L05, L08, L11).
course: DVO
status: planned
lessons:
  - id: L00
    title: "DevOps là gì: vòng phản hồi từ mã tới người dùng"
    spec: lessons/dvo/L00_devops_vong_phan_hoi.yaml
    requires: []
    requires_ext: ["SWF:L11"]
    objectives: ["Mô tả vòng lập kế hoạch – mã – dựng – kiểm – phát hành – vận hành – theo dõi", "Giải thích vì sao lô thay đổi nhỏ ít rủi ro hơn"]
    example: "tìm thay đổi gây lỗi bằng chia đôi: lô 3 thay đổi cần tối đa 2 lần dựng-kiểm, lô 300 thay đổi cần 9 lần — và lô lớn hỏng thường xuyên hơn (VER DVO:L00)"
    fix: ["DevOps là cách làm việc và vòng phản hồi, không phải tên một chức danh hay một công cụ"]
  - id: L01
    title: "Quy trình làm việc với nhánh và tích hợp liên tục"
    spec: lessons/dvo/L01_nhanh_tich_hop.yaml
    requires: [L00]
    objectives: ["So sánh nhánh tính năng sống lâu và hợp nhất thường xuyên", "Viết điều kiện để được hợp nhất"]
    example: "nhánh sửa 5 trong 100 tệp; 40 thay đổi khác chen vào (mỗi cái sửa 1 tệp ngẫu nhiên) → P(xung đột) ≈ 0,871; hợp nhất mỗi ngày, chỉ 3 thay đổi chen vào → ≈ 0,143 (VER DVO:L01)"
    fix: ["Có máy chạy kiểm thử tự động chưa phải là tích hợp liên tục nếu mọi người vẫn hợp nhất vài tuần một lần"]
  - id: L02
    title: "Phiên bản ngữ nghĩa và quản lý phụ thuộc"
    spec: lessons/dvo/L02_phien_ban_phu_thuoc.yaml
    requires: [L00]
    objectives: ["Đọc số phiên bản chính, phụ, vá", "Ghim phụ thuộc bằng tệp khoá"]
    example: "1.10.0 mới hơn 1.9.3 khi so từng số, nhưng so như chuỗi lại cho kết quả ngược (VER DVO:L02)"
    fix: ["Phiên bản vá vẫn có thể phá vỡ chương trình của bạn — ghim và kiểm thử khi nâng cấp"]
  - id: L03
    title: "Đường ống dựng và kiểm thử: nhanh, tin cậy, bị cô lập"
    spec: lessons/dvo/L03_duong_ong_kiem_thu.yaml
    requires: [L01]
    requires_ext: ["SWF:L04", "SWF:L06"]
    objectives: ["Sắp các tầng kiểm thử theo tốc độ", "Phát hiện và cách ly kiểm thử chập chờn"]
    example: "300 kiểm thử, mỗi cái hỏng ngẫu nhiên 0,5% lần: đường ống đỏ dù mã đúng với xác suất khoảng 0,778 (VER DVO:L03)"
    fix: ["Bấm chạy lại cho tới khi xanh che giấu lỗi thật lẫn trong kiểm thử chập chờn"]
  - id: L04
    title: "Sản phẩm dựng bất biến và tái lập được"
    spec: lessons/dvo/L04_san_pham_dung_bat_bien.yaml
    requires: [L03]
    requires_ext: ["CLD:L02"]
    objectives: ["Dựng một lần, triển khai nhiều môi trường", "Ghi mã băm của sản phẩm dựng"]
    example: "cùng một ảnh có mã băm cố định đi qua thử nghiệm và sản xuất; chỉ cấu hình thay đổi"
    fix: ["Dựng lại riêng cho môi trường sản xuất nghĩa là thứ chạy thật chưa từng được kiểm"]
  - id: L05
    title: "Hạ tầng dạng mã: khai báo và lũy đẳng"
    spec: lessons/dvo/L05_ha_tang_dang_ma.yaml
    requires: [L04]
    requires_ext: ["CLD:L05"]
    objectives: ["So sánh hạ tầng khai báo và kịch bản mệnh lệnh", "Phát hiện cấu hình bị trôi"]
    example: "khai báo “web = 5 bản” áp 2 lần vẫn 5; lệnh “thêm 2 bản” chạy 2 lần thành 7 (VER DVO:L05)"
    fix: ["Sửa tay trên máy chủ làm thực tế lệch khỏi mã — lần áp sau sẽ xoá hoặc xung đột"]
  - id: L06
    title: "Quản lý cấu hình và bí mật theo môi trường"
    spec: lessons/dvo/L06_cau_hinh_bi_mat_moi_truong.yaml
    requires: [L05]
    requires_ext: ["CLD:L13"]
    objectives: ["Tách cấu hình khỏi mã", "Xoay vòng bí mật"]
    example: "chuỗi kết nối cơ sở dữ liệu đọc từ biến môi trường hoặc kho bí mật, không ghi trong kho mã"
    fix: ["Xoá bí mật khỏi lần commit mới nhất không xoá nó khỏi lịch sử kho mã — phải đổi bí mật"]
  - id: L07
    title: "Phát hành tiệm tiến: canary, cờ tính năng, quay lui tự động"
    spec: lessons/dvo/L07_phat_hanh_tiem_tien.yaml
    requires: [L04]
    requires_ext: ["CLD:L08", "DSC:L08"]
    objectives: ["Quyết định tiếp tục hay quay lui bằng thống kê", "Tách triển khai khỏi phát hành bằng cờ tính năng"]
    example: "lỗi nền 1%, bản mới 20 lỗi / 1000 yêu cầu: nếu bản mới tốt như cũ thì xác suất này chỉ khoảng 0,0033 → quay lui (VER DVO:L07)"
    fix: ["Canary với quá ít lưu lượng không phát hiện được lỗi hiếm"]
  - id: L08
    title: "Di chuyển lược đồ cơ sở dữ liệu không ngừng dịch vụ"
    spec: lessons/dvo/L08_di_chuyen_luoc_do.yaml
    requires: [L07]
    requires_ext: ["DBS:L05"]
    objectives: ["Áp dụng mở rộng rồi thu hẹp", "Giữ tương thích ngược giữa hai phiên bản"]
    example: "đổi tên cột: thêm cột mới → ghi cả hai → chuyển đọc sang cột mới → ngừng ghi cột cũ → xoá cột cũ"
    fix: ["Đổi tên cột trong một bước làm bản cũ đang chạy song song hỏng ngay"]
  - id: L09
    title: "Đo hiệu quả giao hàng: bốn chỉ số DORA"
    spec: lessons/dvo/L09_bon_chi_so.yaml
    requires: [L07]
    objectives: ["Tính bốn chỉ số", "Tránh biến chỉ số thành mục tiêu tối ưu mù quáng"]
    example: "3 lần triển khai lỗi / 40 lần → 7,5%; khôi phục 30, 90, 45 phút → trung bình 55 phút (VER DVO:L09)"
    fix: ["Tăng số lần triển khai bằng cách chia nhỏ giả tạo không cải thiện gì"]
  - id: L10
    title: "Sự cố: phát hiện, khôi phục, rút kinh nghiệm không đổ lỗi"
    spec: lessons/dvo/L10_su_co.yaml
    requires: [L09]
    requires_ext: ["CLD:L12"]
    objectives: ["Tính độ sẵn sàng từ MTBF và MTTR", "Viết báo cáo sau sự cố"]
    example: "hỏng mỗi 720 giờ, sửa 1 giờ → 99,861%; rút thời gian sửa còn 15 phút → 99,965% (VER DVO:L10)"
    fix: ["Rút ngắn thời gian khôi phục thường rẻ và hiệu quả hơn cố làm cho không bao giờ hỏng"]
  - id: L11
    title: "Theo dõi và cảnh báo có ý nghĩa"
    spec: lessons/dvo/L11_theo_doi_canh_bao.yaml
    requires: [L10]
    requires_ext: ["CLD:L11"]
    objectives: ["Cảnh báo theo triệu chứng người dùng thấy", "Ước lượng dung lượng lưu nhật ký"]
    example: "1000 yêu cầu/s × 1 KB nhật ký = 86,4 GB mỗi ngày, giữ 30 ngày khoảng 2,6 TB (VER DVO:L11)"
    fix: ["Cảnh báo quá nhiều làm người trực bỏ qua cả cảnh báo thật"]
  - id: L12
    title: "Bảo mật trong đường ống: quét phụ thuộc, ký sản phẩm dựng, quyền tối thiểu"
    spec: lessons/dvo/L12_bao_mat_duong_ong.yaml
    requires: [L04]
    requires_ext: ["NET:L14", "SWF:L12"]
    objectives: ["Thêm bước quét lỗ hổng và kiểm chữ ký", "Giới hạn quyền của đường ống"]
    example: "đường ống chỉ có quyền đẩy ảnh vào kho ảnh; cụm máy chỉ chạy ảnh có chữ ký hợp lệ"
    fix: ["Đường ống giữ khoá quản trị toàn hệ thống là mục tiêu tấn công giá trị nhất"]
  - id: L13
    title: "Tình huống chuyên gia theo dòng thời gian: đo năng lực giao phần mềm"
    spec: lessons/dvo/L13_hanh_trinh_do_nang_luc.yaml
    requires: [L00, L09, L10]
    kind: journey
    objectives: ["Kể lại mười năm đo năng lực giao phần mềm qua năm chặng (2014 → 2024), mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại các bội số của báo cáo từ cách chuẩn hoá khoảng, và tự phát hiện chỗ con số không khớp", "Chọn cách cải thiện hợp với đội của mình, kèm điều kiện đổi lựa chọn"]
    example: "chuẩn hoá khoảng: nhóm thấp (2 + 12) / 2 = 7 lần/năm, nhóm cao 4 × 365 = 1460 → 1460 / 7 ≈ 208,6 (SD16, SD19: “200”, “208 lần”); 3,5 tháng × 43 800 phút / 60 = 2555 (SD16); 1460 / 1,5 ≈ 973 (SD21); tính lại 2017: 26 940 / 60 ≈ 449, báo cáo ghi 440 (VER DVO:L13)"
    fix: ["Chỉ khẳng định điều có trong SD14–SD23 và DH26 (audit/dvo/sources_L13.md); báo cáo là khảo sát — nói “đi cùng”, không nói thực hành gây ra kết quả", "Không dạy “2604 lần” (báo cáo 2018/2019 lấy một tháng = 5040 giờ, mâu thuẫn với 730 giờ ở trang trước) và phép tính thời gian đưa lên của 2018; số 440 của 2017 tính lại ra 449 — dạy chỗ lệch, không đoán lý do", "Đội 12 lần/năm, 3 lỗi, lô 60 thay đổi là số minh hoạ; báo cáo 2022 không tải được (404), 2024 chỉ dựa vào trang lịch sử của dora.dev"]
