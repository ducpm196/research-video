# Giáo án KẾ HOẠCH — DSY · Hệ phân tán và dữ liệu lớn
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã DSY:Lxx (băm nhất quán, bộ lọc Bloom, lấy mẫu hồ chứa mô phỏng/tính chính xác).
# Căn cứ phạm vi: CS2023 — Parallel and Distributed Computing (PDC, 9 giờ CS Core); ACM DSTF 2021 — “Big Data Systems (BDS)” (CITED).
#   Kết quả kinh điển nêu tên (CITED theo tài liệu gốc, chưa tra lại trong phiên này — NOT_VERIFIED về câu chữ): Lamport (1978) đồng hồ lôgic;
#   Gilbert & Lynch (2002) chứng minh CAP; Ongaro & Ousterhout (2014) Raft; Dean & Ghemawat (2004) MapReduce; Bloom (1970).
# Vì sao cần: dữ liệu lớn và hệ thống microservice chạy trên nhiều máy; mọi khó khăn (đồng hồ, sao chép, đồng thuận, phân mảnh)
#   bắt nguồn từ mạng không tin cậy — điều CS112, OSY chỉ xét trong một máy.
# Thứ tự học: sau OSY L04–L07, NET L01, L09, DBS L11–L14, CS112 L06.
course: DSY
status: planned
lessons:
  - id: L00
    title: "Vì sao phải phân tán, và tám giả định sai về mạng"
    spec: lessons/dsy/L00_vi_sao_phan_tan.yaml
    requires: []
    requires_ext: ["NET:L01", "CSA:L13"]
    objectives: ["Biết lý do phải dùng nhiều máy", "Biết cái giá: độ trễ, hỏng một phần, phần tuần tự", "Nhận ra tám giả định sai về mạng"]
    example: "một truy vấn trong cùng trung tâm dữ liệu mất khoảng nửa mili giây, sang châu lục khác mất hàng trăm mili giây"
    fix: ["Thêm máy không làm phần tuần tự chạy nhanh hơn (định luật Amdahl: tăng tốc = 1 / ((1 − p) + p/N); 90% song song, 10 máy chỉ nhanh khoảng 5,26 lần, vô số máy cũng không quá 10 lần)"]
  - id: L01
    title: "Mô hình hỏng hóc và đồng hồ lôgic Lamport"
    spec: lessons/dsy/L01_dong_ho_lamport.yaml
    requires: [L00]
    objectives: ["Phân biệt các mô hình hỏng hóc", "Hiểu vì sao không dùng giờ hệ thống để xếp thứ tự", "Gán nhãn thời gian Lamport"]
    example: "P1 gửi ở thời điểm 1, P2 đã có sự kiện thời điểm 1 → nhận ở max(1, 1) + 1 = 2 (VER DSY:L01)"
    fix: ["Không dùng giờ hệ thống của các máy để xếp thứ tự sự kiện — đồng hồ thật bị lệch"]
  - id: L02
    title: "Đồng hồ vector và quan hệ xảy ra trước"
    spec: lessons/dsy/L02_dong_ho_vector.yaml
    requires: [L01]
    requires_ext: ["DMS:L08"]
    objectives: ["Gán đồng hồ vector", "Quyết định hai sự kiện có liên hệ nhân quả hay đồng thời", "Dùng đồng hồ vector để phát hiện ghi xung đột"]
    example: "(2, 0, 1) và (1, 2, 0) không so được → đồng thời; (1, 0, 0) xảy ra trước (2, 0, 1) (VER DSY:L02)"
    fix: ["Nhãn Lamport nhỏ hơn KHÔNG suy ra xảy ra trước — cần đồng hồ vector để biết"]
  - id: L03
    title: "Sao chép dữ liệu và đại biểu đọc–ghi"
    spec: lessons/dsy/L03_sao_chep_dai_bieu.yaml
    requires: [L00]
    requires_ext: ["DBS:L11"]
    objectives: ["Phân biệt sao chép đồng bộ và bất đồng bộ", "Chọn R, W sao cho đọc luôn thấy bản ghi mới nhất", "Tính số nút hỏng chịu được"]
    example: "N = 3: R + W > N tương đương mọi tập đọc giao mọi tập ghi (máy kiểm mọi R, W) (VER DSY:L03)"
    fix: ["Sao chép bất đồng bộ có thể mất dữ liệu đã báo thành công khi bản chính hỏng"]
  - id: L04
    title: "Định lý CAP và đánh đổi độ trễ–nhất quán"
    spec: lessons/dsy/L04_dinh_ly_cap.yaml
    requires: [L03]
    objectives: ["Phát biểu đúng định lý CAP", "Biết lựa chọn chỉ bắt buộc khi có phân vùng", "Hiểu đánh đổi độ trễ–nhất quán lúc bình thường"]
    example: "khi mạng chia hai nửa, một nút nhận ghi phải chọn: từ chối (giữ nhất quán) hay nhận rồi lệch với nửa kia (giữ sẵn sàng)"
    fix: ["CAP không phải “chọn 2 trong 3” lúc bình thường — lựa chọn chỉ bắt buộc khi có phân vùng mạng"]
  - id: L05
    title: "Đồng thuận: đa số, bầu thủ lĩnh và nhật ký sao chép"
    spec: lessons/dsy/L05_dong_thuan.yaml
    requires: [L04]
    objectives: ["Hiểu vì sao cần đa số", "Hiểu bầu thủ lĩnh theo nhiệm kỳ", "Biết khi nào một mục nhật ký được cam kết"]
    example: "5 nút chịu được 2 nút hỏng; 4 nút chỉ chịu được 1 (VER DSY:L05)"
    fix: ["Không thuật toán tất định nào bảo đảm đồng thuận luôn kết thúc khi mạng không giới hạn thời gian và có thể có một nút hỏng (Fischer, Lynch, Paterson 1985) — hệ thật dùng khoảng chờ ngẫu nhiên: an toàn luôn giữ, tiến triển gần như luôn có"]
  - id: L06
    title: "Phân mảnh dữ liệu và băm nhất quán"
    spec: lessons/dsy/L06_bam_nhat_quan.yaml
    requires: [L00]
    requires_ext: ["CS112:L06", "DMS:L13"]
    objectives: ["Chia dữ liệu theo khoá ra nhiều máy", "Biết vì sao băm k mod N tệ khi thêm máy", "Hiểu băm nhất quán và nút ảo"]
    example: "thêm nút thứ 5: băm “k mod N” chuyển 80% khoá, băm nhất quán chỉ khoảng 21% (VER DSY:L06)"
    fix: ["Phân mảnh theo khoảng dễ sinh điểm nóng khi khoá tăng dần như thời gian"]
  - id: L07
    title: "MapReduce: map, xáo trộn, reduce"
    spec: lessons/dsy/L07_mapreduce.yaml
    requires: [L06]
    objectives: ["Viết một phép tính theo ba bước ánh xạ, xáo trộn, rút gọn", "Hiểu vì sao xáo trộn thường đắt nhất", "Dùng gộp sớm đúng chỗ"]
    example: "đếm từ trên “a b a c b a” → a 3, b 2, c 1 (VER DSY:L07)"
    fix: ["Bước xáo trộn qua mạng thường đắt nhất — giảm dữ liệu trước khi xáo trộn"]
  - id: L08
    title: "Lệch dữ liệu và tác vụ chậm"
    spec: lessons/dsy/L08_lech_du_lieu.yaml
    requires: [L07]
    objectives: ["Biết thời gian công việc do tác vụ chậm nhất quyết định", "Nhận ra khoá nóng làm lệch tải", "Xử lý bằng chia khoá nóng và tác vụ dự phòng"]
    example: "99 tác vụ 10 giây và 1 tác vụ 300 giây: công việc xong sau 300 giây dù trung bình 12,9 giây (VER DSY:L08)"
    fix: ["Thêm máy không giúp khi một khoá chiếm phần lớn dữ liệu"]
  - id: L09
    title: "Xử lý luồng: cửa sổ, thời gian sự kiện và dữ liệu đến muộn"
    spec: lessons/dsy/L09_xu_ly_luong.yaml
    requires: [L07]
    objectives: ["Gom luồng theo cửa sổ thời gian", "Phân biệt thời gian sự kiện và thời gian xử lý", "Hiểu mốc nước và đánh đổi giữa đúng và sớm"]
    example: "cửa sổ nhảy 5 giây trên sự kiện ở giây 1, 2, 3, 7, 8, 12 → 3, 2, 1 sự kiện (VER DSY:L09)"
    fix: ["Đếm theo thời gian xử lý cho kết quả khác nhau mỗi lần chạy lại khi dữ liệu đến muộn"]
  - id: L10
    title: "Cấu trúc xác suất: bộ lọc Bloom, đếm phần tử khác nhau"
    spec: lessons/dsy/L10_cau_truc_xac_suat.yaml
    requires: [L06]
    requires_ext: ["DMS:L19"]
    objectives: ["Hiểu bộ lọc Bloom: không âm tính giả, có dương tính giả", "Tính tỉ lệ dương tính giả theo số bit mỗi phần tử", "Đếm số phần tử khác nhau bằng bộ nhớ cố định"]
    example: "10 bit mỗi phần tử, 7 hàm băm: dương tính giả khoảng 0,82%, không bao giờ âm tính giả (VER DSY:L10)"
    fix: ["Bộ lọc Bloom chuẩn không xoá được phần tử"]
  - id: L11
    title: "Lấy mẫu hồ chứa trên luồng dữ liệu"
    spec: lessons/dsy/L11_lay_mau_ho_chua.yaml
    requires: [L10]
    objectives: ["Lấy mẫu đều k phần tử từ luồng chưa biết độ dài", "Chứng minh mỗi phần tử có xác suất k/n", "Nhận ra mẫu lệch"]
    example: "k = 2 trên luồng 10 phần tử: mỗi phần tử được giữ với xác suất đúng 2/10 (tính chính xác bằng phân số, VER DSY:L11)"
    fix: ["Lấy 1000 phần tử đầu không phải mẫu ngẫu nhiên — dữ liệu luồng thường có xu hướng theo thời gian"]
  - id: L12
    title: "Lưu trữ theo cột và nén"
    spec: lessons/dsy/L12_luu_tru_cot.yaml
    requires: [L07]
    requires_ext: ["DBS:L07"]
    objectives: ["Phân biệt lưu theo dòng và theo cột", "Tính lượng dữ liệu phải đọc", "Hiểu vì sao cột nén tốt, và khi nào lưu theo cột chậm"]
    example: "đọc 1 cột của bảng 8 cột chỉ quét 1/8 dữ liệu; cột VN×6, US×3, VN×1 nén thành 3 cặp (VER DSY:L12)"
    fix: ["Lưu theo cột chậm khi cần ghi hoặc đọc nguyên một dòng"]
  - id: L13
    title: "Giao dịch phân tán: cam kết hai pha"
    spec: lessons/dsy/L13_cam_ket_hai_pha.yaml
    requires: [L05]
    requires_ext: ["DBS:L14"]
    objectives: ["Thực hiện một giao dịch trên nhiều máy bằng hai pha", "Hiểu vì sao bên đã bỏ phiếu có phải chờ", "Biết cam kết hai pha bảo đảm nguyên tử, không bảo đảm sẵn sàng"]
    example: "bên tham gia đã bỏ phiếu “sẵn sàng” thì không tự huỷ được khi mất liên lạc với bên điều phối"
    fix: ["Cam kết hai pha bảo đảm nguyên tử, không bảo đảm sẵn sàng"]
  - id: L14
    title: "Hàng đợi thông điệp và ngữ nghĩa giao nhận"
    spec: lessons/dsy/L14_hang_doi_thong_diep.yaml
    requires: [L13]
    objectives: ["Phân biệt nhiều nhất một lần, ít nhất một lần", "Đạt hiệu quả đúng một lần bằng xử lý lũy đẳng", "Biết vì sao ghi nhớ mã phải cùng giao dịch với kết quả"]
    example: "người nhận ghi “đã xử lý thông điệp #42” cùng giao dịch với kết quả → gửi lặp #42 bị bỏ qua (VER DSY:L14)"
    fix: ["“Đúng một lần” giữa hai hệ thống thật chỉ đạt được bằng ít nhất một lần + xử lý lũy đẳng"]
  - id: L15
    title: "Tình huống chuyên gia theo dòng thời gian: từ Bigtable tới Spanner"
    spec: lessons/dsy/L15_hanh_trinh_bigtable_spanner.yaml
    requires: [L01, L05, L06, L13]
    kind: journey
    objectives: ["Kể lại hành trình lưu trữ dữ liệu của Google từ Bigtable tới Spanner qua năm chặng, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại con số then chốt của từng chặng: số mảnh địa chỉ được, phần khoá phải dời khi chia lại, thời gian chờ cam kết", "Chọn thực hành phù hợp với quy mô của chính mình, không chép quy mô của hệ thống khác"]
    example: "3 tầng chỉ mục, mỗi bảng chỉ mục 128 MB, mỗi dòng 1 KB → 2^17 · 2^17 = 2^34 mảnh (BT06 §5.1); đồng hồ sai lệch ε̄ = 4 ms → chờ cam kết ít nhất 2ε̄ = 8 ms (SP12 §3, §4.2.1) (VER DSY:L15)"
    fix: ["Chỉ khẳng định điều có trong BT06, SP12, SQ17 (audit/dsy/sources_L15.md); năm bắt đầu thiết kế Bigtable không có trong nguồn — chỉ nói chạy thật từ tháng 4/2005", "Ví dụ chia lại 4 → 5 mảnh theo số dư là số minh hoạ (nguồn chỉ ghi MySQL “manually sharded many ways”)", "Không nêu commit wait đo được 5 ms (thí nghiệm một bản sao) cạnh chặn dưới 2ε̄ = 8 ms — hai đại lượng khác nhau", "Tên Bigtable, TrueTime không đọc được (probe p2_hanh_trinh ≤ 3/8 và 0/8 thô) — lời đọc nói “hệ bảng lớn”, “đồng hồ trả về khoảng giờ”"]
