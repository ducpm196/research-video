# Giáo án Khoá PYT · Python từ con số 0 (14 bài L00–L13, 2026-11-13)
# Căn cứ phạm vi (CITED = nguồn đã dùng khi soạn, tên đủ trong `source` từng bài; mọi trích dẫn tính từ trí nhớ ghi NOT_VERIFIED trong `source`): tài liệu chính thức của Python 3 (Tutorial, Language
#   Reference, Library Reference: dữ liệu, kiểu, luồng điều khiển, hàm, cấu trúc dữ liệu, chuỗi và `re`, `open`, `csv`, `json`, `pathlib`, lớp và `dataclasses`, ngoại lệ, `logging`, `venv`);
#   tài liệu pip (requirements file, pip freeze); tài liệu NumPy, pandas, Matplotlib, pytest (phiên bản ghim ở labs/requirements-py.txt); IEEE 754 (số thực dấu phẩy động); RFC 3629 (UTF-8), RFC 4180 (CSV), RFC 8259 (JSON).
# Vì sao cần: mọi khoá sau (BNX, PLC, SDP, ESY, DSC, AIF, LLM, MLP…) đọc và viết mã Python mà KHÔNG giảng cú pháp; FND dạy dòng lệnh, tệp, CSV/JSON/YAML, HTTP, SQL, Git nhưng không dạy ngôn ngữ lập trình nào.
#   PYT dạy lại từ con số 0 (mỗi khái niệm lập trình được giảng tại chỗ bằng Python, KHÔNG giả định đã học JVA/JV2: khoá sau Java cũng như trước Java đều phải đọc được PYT).
# Thứ tự học: sau FND (requires_ext FND:L04, FND:L05 cho L00; FND:L06 cho L05; FND:L04 cho L08), trước mọi khoá dùng Python.
# Môi trường (hợp đồng lab, labs/ENV.md): Python tối thiểu 3.11 (kho kiểm trên 3.11.9 và 3.13.5); L00–L08 và L12 chỉ cần thư viện chuẩn (L12 cần pytest); L09–L13 cần `pip install -r labs/requirements-py.txt`
#   (numpy 2.4.6, pandas 3.1.1, matplotlib 3.11.2, pytest 9.2.0; kiểm trên labs/.venv-pyt).
# Bộ kiểm độc lập: audit/pyt/verify_pyt.py chạy THẬT mọi chương trình trên Python 3.11 và 3.13 (so từng dòng, hai hạt giống băm), cửa sổ `>>>` bằng code.InteractiveConsole, phiên Git Bash, và phép đo thời gian/bộ nhớ
#   (audit/pyt/measured.json; số thời gian là số minh hoạ trên máy kiểm). Số trong `example` là số minh hoạ chạy thật bằng verify_pyt; chưa gắn mã "VER PYT:Lxx" vì audit/verify_plan_curricula.py chưa có dòng PYT.
# Phát âm: chỉ «Python» đọc được («Phai-thơn», 7/8, đối chứng 0/8; audit/pyt/probes/p1.md); numpy, pandas, matplotlib, pytest (≤ 4/8) không đọc trong lời — chỉ hiện trên màn hình.
course: PYT
profile: stem
status: active
lessons:
- id: L00
  title: 'Chạy Python: giá trị, biến, kiểu và phép toán'
  spec: lessons/pyt/L00_chay_python_gia_tri_bien.yaml
  requires: []
  requires_ext:
  - FND:L04
  - FND:L05
  objectives:
  - 'Chạy chương trình bằng hai cách: cửa sổ gõ từng câu và tệp chạy từ cửa sổ lệnh'
  - Phân biệt bốn kiểu giá trị (số nguyên, số thực, chuỗi, đúng–sai) và hỏi kiểu bằng lệnh hỏi kiểu
  - Nêu biến là cái nhãn dán lên giá trị, đổi nhãn không kéo nhãn khác theo
  - Tính bằng bảy phép toán số học theo đúng thứ tự ưu tiên
  - Viết chương trình dùng lệnh in, lệnh nhập và chuỗi có chỗ điền
  - Giải thích vì sao 0.1 + 0.2 khác 0.3
  - Nêu vì sao tiền đồng nên lưu bằng số nguyên khi quy mô tổng tiền tăng
  - 'Chỉ ra ba lỗi hay gặp: nhập trả về chuỗi, phép chia ra số thực, cắt phần lẻ của tiền'
  - Viết chương trình tính lãi tiết kiệm từ ba biến và in có định dạng
  example: 0.1 + 0.2 ra 0.30000000000000004; 12 000 000 × 0.072 ra 863 999.9999999999 (cắt phần lẻ mất 1 đồng); lãi 6% một năm cho 3 tháng trên 2 000 000 là 30 000; 10^15 + 0,1 − 10^15 ra 0,125 (số minh
    hoạ chạy thật bằng verify_pyt)
  fix:
  - Số thực dấu phẩy động không biểu diễn chính xác 0,1; tiền đồng lưu bằng số nguyên và làm tròn một lần có quy tắc
  - Lệnh nhập luôn trả về chuỗi, phép chia một dấu luôn ra số thực
- id: L01
  title: 'Rẽ nhánh và vòng lặp: để chương trình tự chọn việc và lặp lại một việc'
  spec: lessons/pyt/L01_re_nhanh_vong_lap.yaml
  requires:
  - L00
  objectives:
  - Viết câu lệnh rẽ nhánh nhiều nhánh bằng so sánh và các từ nối and, or, not
  - Đọc một lỗi thụt lề và sửa nó
  - Viết vòng lặp đếm và vòng lặp điều kiện, dùng break và continue
  - Tính tổng và đếm bằng biến cộng dồn, chạy tay từng lượt
  - Giải thích vì sao thứ tự các nhánh quyết định kết quả
  - Nêu khi nào dùng vòng đếm, khi nào dùng vòng điều kiện
  - Nêu thời gian của vòng lặp thay đổi thế nào ở ba quy mô dữ liệu
  - 'Chỉ ra ba lỗi hay gặp: lệch một, điều kiện viết như câu văn, vòng lặp chạy mãi'
  - Viết chương trình phân loại giao dịch theo mức tiền, tính tổng và đếm
  example: tổng 450 000 + 12 000 000 + 800 000 + 30 000 000 + 2 500 000 = 45 750 000 và 1 giao dịch từ 20 triệu trở lên; gửi 10 triệu lãi 0,5% mỗi tháng gấp đôi sau 139 tháng; thời gian vòng lặp tăng theo
    số lượt (đo ở 10^3, 10^6, 10^7; số minh hoạ)
  fix:
  - Thứ tự các nhánh quyết định kết quả; vòng lặp điều kiện phải làm điều kiện tiến dần tới sai
  - 'range dừng trước số cuối: lỗi lệch một'
- id: L02
  title: 'Hàm: gói một việc, đặt tên, dùng lại'
  spec: lessons/pyt/L02_ham.yaml
  requires:
  - L01
  objectives:
  - Viết hàm có tham số, giá trị trả về và hàm gọi hàm khác
  - Dùng tham số mặc định và gọi có tên
  - 'Xác định phạm vi của biến: toàn cục đọc được trong hàm, cục bộ chỉ sống trong một lần gọi'
  - Truyền một hàm cho hàm khác và viết hàm một dòng không tên
  - Kiểm một hàm bằng tính tay và bằng cách gọi lồng nhau
  - Nêu vì sao hàm giảm số chỗ phải sửa và cái giá của một lần gọi ở ba quy mô
  - 'Chỉ ra ba lỗi hay gặp: quên trả về, gán trùng tên biến toàn cục, đổi chỗ đối số cùng kiểu'
  - Viết ba hàm phí và thuế cùng hàm nhận hàm
  - Đo thời gian chạy của một đoạn mã bằng đồng hồ time.perf_counter và so hai cách viết
  example: 'thuế 10% của 2 000 000 là 200 000, tổng 2 200 000; thuế 8% cho 2 160 000; sửa công thức ở 100 nơi: khả năng bỏ sót ≥ 1 chỗ là 86,7% nếu mỗi chỗ quên 2% (giả định minh hoạ); chi phí một lần gọi
    hàm đo ở 10^6 và 10^7 lần (số minh hoạ)'
  fix:
  - Hàm không có return trả None dù đã in kết quả ra màn hình
  - Gán vào biến trùng tên biến toàn cục trong hàm làm biến đó thành cục bộ
- id: L03
  title: 'Danh sách, từ điển, tập hợp: chọn cấu trúc cho dữ liệu'
  spec: lessons/pyt/L03_danh_sach_tu_dien_tap_hop.yaml
  requires:
  - L02
  objectives:
  - Tạo, đọc và sửa danh sách bằng chỉ số, chỉ số âm, cắt lát và thêm phần tử
  - Phân biệt danh sách, bộ, từ điển và tập hợp, và nêu khi nào dùng từng loại
  - Giải thích vì sao gán một danh sách không tạo bản sao, và tạo bản sao độc lập
  - Sắp xếp theo một khoá và viết danh sách suy ra
  - Đếm tần suất và gộp hai nguồn theo khoá bằng từ điển
  - Nêu số bước tìm kiếm của danh sách và tập hợp thay đổi thế nào ở ba quy mô
  - 'Chỉ ra ba lỗi hay gặp: gán thay cho sao chép, xoá khi đang lặp, hỏi khoá thiếu'
  - Viết chương trình đếm tần suất và gộp hai danh sách theo khoá
  example: 'đếm tần suất {''chuyen'': 3, ''nap'': 2, ''rut'': 1}; gộp hai nguồn theo mã tài khoản (300 000 + 250 000 = 550 000); tra cứu trong danh sách 10^6 phần tử chậm hơn tập hợp hàng nghìn lần ở máy
    kiểm, ngoại suy 10^8 (số minh hoạ)'
  fix:
  - Gán một danh sách cho biến khác không tạo bản sao
  - Xoá phần tử khi đang lặp qua chính danh sách làm bỏ sót phần tử
- id: L04
  title: 'Chuỗi và biểu thức chính quy: đọc dữ liệu dạng chữ'
  spec: lessons/pyt/L04_chuoi_va_bieu_thuc_chinh_quy.yaml
  requires:
  - L03
  objectives:
  - Cắt, tìm, thay, tách và ghép chuỗi bằng các lệnh trên chuỗi
  - 'Định dạng số trong chuỗi có chỗ điền: ngăn hàng nghìn, số chữ số thập phân, canh lề, phần trăm'
  - Giải thích vì sao số ký tự khác số byte trong UTF-8 và đếm cả hai
  - Viết biểu thức chính quy bằng search, findall và nhóm để bóc dữ liệu
  - Nêu thời gian của mẫu viết kém tăng thế nào theo độ dài chuỗi
  - 'Chỉ ra ba lỗi hay gặp: mẫu tham lam, đọc số kiểu Việt sai, sửa chuỗi tại chỗ'
  - Viết chương trình trích mã và số tiền từ dòng nhật ký
  example: dòng nhật ký 'GD#A0001 chuyen 500.000 VND' bóc ra mã A0001 và 500000; len('tiền') = 4 nhưng 6 byte UTF-8; mẫu (a+)+b trên chuỗi 25 ký tự mất cỡ giây, gấp đôi mỗi ký tự thêm (đo ở 17, 21, 25 ký
    tự; số minh hoạ)
  fix:
  - Dấu .* tham lam lấy nhiều nhất có thể; thêm ? để lấy ít nhất
  - 'Số kiểu Việt 1.250 máy đọc thành 1,25: bỏ dấu chấm ngăn hàng nghìn trước khi đổi kiểu'
- id: L05
  title: 'Tệp: đọc và ghi văn bản, CSV, JSON'
  spec: lessons/pyt/L05_tep_csv_json.yaml
  requires:
  - L04
  requires_ext:
  - FND:L06
  objectives:
  - Mở, đọc, ghi tệp văn bản trong khối with với bảng mã UTF-8
  - Phân biệt các chế độ mở r, w, a và nêu vì sao phải đóng tệp
  - Đọc và ghi CSV bằng DictReader và writer, nhớ mọi giá trị đọc ra là chuỗi
  - Ghi và đọc JSON, nêu cách kiểu được đổi qua lại
  - Ghép và hỏi đường dẫn bằng Path
  - Nêu bộ nhớ của đọc cả tệp và đọc từng dòng thay đổi thế nào ở ba quy mô
  - 'Chỉ ra ba lỗi hay gặp: chế độ w xoá tệp, không nói rõ bảng mã, chưa đóng tệp'
  - Viết chương trình đọc CSV giao dịch và ghi báo cáo JSON
  example: tệp 'tiền mặt' + '2.000.000 đồng' có 24 ký tự nhưng 31 byte; tổng CSV 500 000 + 2 000 000 + 300 000 = 2 800 000; đọc cả tệp 10^6 dòng tốn bộ nhớ gấp hàng nghìn lần đọc từng dòng (đo; số minh
    hoạ)
  fix:
  - Chế độ 'w' xoá tệp; muốn ghi tiếp dùng 'a'
  - Luôn ghi encoding="utf-8" khi mở tệp văn bản; ghi xong phải đóng tệp (dùng with)
- id: L06
  title: 'Lớp và đối tượng: gói dữ liệu cùng hành vi'
  spec: lessons/pyt/L06_lop_va_doi_tuong.yaml
  requires:
  - L05
  objectives:
  - Khai báo lớp có hàm tạo và phương thức, và dựng đối tượng
  - Nêu self là chính đối tượng và đối tượng gồm các thuộc tính riêng
  - Viết cách hiển thị và dùng lớp dữ liệu để máy viết giúp
  - Viết phương thức rút kiểm tra điều kiện trước khi đổi số dư
  - Nêu khi nào dùng kế thừa và khi nào dùng hợp thành
  - Giải thích khác biệt giữa so bằng và cùng một đối tượng
  - Nêu bộ nhớ của đối tượng thay đổi thế nào ở ba quy mô
  - 'Chỉ ra ba lỗi hay gặp: quên self, danh sách dùng chung ở cấp lớp, gán thay cho sao chép'
  - Viết lớp TaiKhoan có nạp, rút và kiểm số dư
  - Đo bộ nhớ của dữ liệu bằng sys.getsizeof và tracemalloc, và nêu hai cách khác nhau ở đâu
  example: TaiKhoan nạp 500 000 vào 1 000 000, rút 2 000 000 bị từ chối, rút 300 000 còn 1 200 000; tiết kiệm lãi 5 phần nghìn cho 2 000 000 là 10 000; 10^6 đối tượng lớp thường chiếm khoảng 190 MB so với 160 MB cho bộ ba giá trị, hơn khoảng 20% (đo bằng tracemalloc, ngoại
    suy 10^8; số minh hoạ)
  fix:
  - Danh sách đặt ở cấp lớp bị mọi đối tượng dùng chung; tạo trong hàm tạo
  - Mặc định == chỉ hỏi cùng một đối tượng; so nội dung cần __eq__ hoặc lớp dữ liệu
- id: L07
  title: 'Ngoại lệ và gỡ lỗi: khi chương trình hỏng'
  spec: lessons/pyt/L07_ngoai_le_va_go_loi.yaml
  requires:
  - L06
  objectives:
  - Đọc thông báo lỗi nhiều tầng từ dưới lên và chỉ ra nơi lỗi xảy ra cùng nguyên nhân gốc
  - Bắt đúng loại ngoại lệ bằng try và except, đặt loại hẹp trước loại rộng
  - Ném ngoại lệ bằng raise và viết loại ngoại lệ tự định nghĩa
  - Dùng finally cho việc phải làm trong mọi trường hợp
  - Ghi nhật ký theo mức và nêu cách dùng điểm dừng để gỡ lỗi
  - Nêu chi phí của ngoại lệ khi lỗi hiếm và khi lỗi thường xuyên
  - 'Chỉ ra ba lỗi hay gặp: bắt sai loại, bắt quá rộng rồi bỏ qua, đặt loại rộng trước loại hẹp'
  - Sửa chương trình hỏng bằng cách bắt đúng loại ngoại lệ và ném ngoại lệ của mình
  example: rút 250 000 từ 100 000 ném SoDuKhongDu 'thieu 150000'; finally in 'dong giao dich' ở cả hai lần gọi; try gần như miễn phí khi không có lỗi, đắt khi 50% dòng hỏng (đo trên 10^6 chuỗi; số minh
    hoạ)
  fix:
  - 'except Exception: pass nuốt cả lỗi gõ sai tên biến và làm kết quả sai lặng lẽ'
  - Khối except bắt rộng đặt trước khối bắt hẹp thì khối hẹp không bao giờ chạy
- id: L08
  title: Mô-đun, gói và môi trường ảo
  spec: lessons/pyt/L08_mo_dun_goi_moi_truong_ao.yaml
  requires:
  - L07
  requires_ext:
  - FND:L04
  objectives:
  - Chia chương trình thành mô-đun và gói và nạp chúng bằng import
  - Giải thích khối kiểm tên mô-đun cho tệp vừa chạy được vừa nạp được
  - Tạo, kích hoạt và kiểm môi trường ảo bằng Git Bash
  - Giải thích ghim phiên bản trong tệp requirements.txt và vai trò của pip freeze
  - Nêu thứ tự máy tìm mô-đun và vì sao tên tệp trùng tên bộ có sẵn gây lỗi
  - Nêu số thư viện phải cài khi thêm từng nhóm thư viện và thời gian nạp riêng của từng thư viện
  - 'Chỉ ra ba lỗi hay gặp: trùng tên bộ có sẵn, quên kích hoạt môi trường, không ghim phiên bản'
  - Cài thư viện từ danh sách ghim vào môi trường ảo và in phiên bản đã cài
  example: giao_dich.py chạy trực tiếp in __name__ = __main__, bị nạp in __name__ = giao_dich; tệp csv.py che bộ csv có sẵn; labs/requirements-py.txt 17 dòng ghim cho 4 thư viện chính; số thư viện phải cài khi thêm từng nhóm là 1, 4, 12, 17 và thời gian nạp riêng từng thư viện (đo; số minh hoạ)
  fix:
  - Đặt tên tệp trùng bộ công cụ có sẵn (csv.py, random.py, traceback.py) làm nạp nhầm tệp của mình
  - Quên kích hoạt môi trường ảo trước khi pip install làm cài nhầm vào Python hệ thống
- id: L09
  title: 'Thư viện mảng: tính trên cả mảng, không vòng lặp'
  spec: lessons/pyt/L09_mang_so_tinh_theo_mang.yaml
  requires:
  - L08
  objectives:
  - Tạo mảng, đọc hình dạng và kiểu, chọn phần tử bằng chỉ số và cắt
  - Tính theo từng phần tử bằng phép tính trên cả mảng
  - Tính tổng và trung bình theo trục và nêu hình dạng kết quả
  - Giải thích lan truyền và vì sao hình dạng không khớp gây lỗi
  - Chọn phần tử bằng mặt nạ đúng sai
  - Tính độ lệch chuẩn từ định nghĩa và chuẩn hoá cột
  - Nêu tốc độ và bộ nhớ của mảng so với vòng lặp ở ba quy mô
  - 'Chỉ ra ba lỗi hay gặp: hình dạng không khớp, tràn số nguyên nhỏ, nhầm cắt lát với bản sao'
  - Viết chương trình tính trung bình, độ lệch chuẩn và chuẩn hoá cột
  example: 'mảng 3×4 tiền: tổng theo trục 0 là [2200 2800 1350 2900], theo trục 1 là [2800 1650 4800], tổng chung 9250; độ lệch chuẩn của [2,4,4,4,5,5,7,9] là 2; cộng 10^6 số: mảng nhanh hơn vòng lặp hàng
    trăm lần, 10^8 số nguyên 8 byte là 800 MB (đo; số minh hoạ)'
  fix:
  - 'Hình dạng (3,4) và (3,) không lan truyền được: so kích thước từ bên phải'
  - Số nguyên 4 byte tràn không báo lỗi (2 000 000 000 + 2 000 000 000 ra số âm); cắt lát mảng là cái nhìn, không phải bản sao
- id: L10
  title: 'Thư viện bảng dữ liệu: đọc, lọc, nhóm, ghép'
  spec: lessons/pyt/L10_bang_du_lieu.yaml
  requires:
  - L09
  objectives:
  - Đọc CSV thành bảng, xem hình dạng và kiểu từng cột
  - Chọn dòng bằng mặt nạ và nối điều kiện bằng & và |
  - Nhóm theo cột rồi tính, và kiểm tổng các nhóm bằng tổng gốc
  - Xử lý giá trị thiếu và nêu vì sao cách xử lý đổi kết quả
  - Đọc cột ngày và ghép hai bảng theo cột chung
  - Nêu bộ nhớ của bảng thay đổi thế nào theo số dòng và kiểu cột
  - 'Chỉ ra ba lỗi hay gặp: and thay cho &, tổng bỏ qua ô thiếu, so giá trị thiếu bằng =='
  - Viết chương trình thống kê giao dịch theo loại và theo ngày
  example: 'bảng 7 giao dịch: nhóm theo loại chuyển 1 450 000 / nạp 3 000 000 / rút 300 000; một ô thiếu làm tổng 4 750 000 chỉ của 6 giao dịch; mean chia 6 hay 7 tuỳ cách xử lý ô thiếu; 10^6 dòng bốn cột chiếm bộ nhớ cỡ trăm MB (cỡ 140 byte mỗi dòng), kiểu category giảm cỡ 7 lần ở cả 10^4 và 10^6 dòng (hệ số gần như không đổi theo số dòng; đo; số minh hoạ)'
  fix:
  - Nối điều kiện trên bảng bằng & và |, không bằng and/or
  - 'Tổng và trung bình bỏ qua ô thiếu mà không báo; so ô thiếu bằng == luôn sai: dùng isna()'
- id: L11
  title: Vẽ biểu đồ và đọc biểu đồ cho đúng
  spec: lessons/pyt/L11_ve_bieu_do_va_doc_bieu_do.yaml
  requires:
  - L10
  objectives:
  - 'Nêu loại biểu đồ hợp với từng câu hỏi: cột, đường, phân tán, tần suất'
  - Vẽ biểu đồ ra tệp ảnh và đọc lại số liệu đã vẽ từ đối tượng biểu đồ
  - Đọc một biểu đồ theo thứ tự tiêu đề, đơn vị, trục, thang, rồi mới đến hình
  - Tính tỉ lệ nhìn thấy khi trục bị cắt và so với tỉ lệ dữ liệu
  - Giải thích vì sao gộp có thể đảo ngược kết luận và cách phát hiện
  - Nêu thời gian vẽ và kích thước tệp thay đổi thế nào ở ba quy mô, và vì sao phải gộp
  - 'Chỉ ra ba lỗi hay gặp: cắt trục ở biểu đồ cột, gộp che nhóm, nhầm thang lôgarit'
  - Vẽ và mô tả đúng một biểu đồ cột bằng số liệu vẽ
  example: 'cột 100 và 103: trục từ 0 cho tỉ lệ 1,03, trục từ 99 cho tỉ lệ nhìn thấy 4,0; kênh A hơn B ở mọi loại (90,0% / 33,3% so 88,9% / 20,0%) nhưng chung 39,0% so 82,0%; vẽ 10^6 điểm chồng thành một
    đám, tệp vector phình theo số điểm (đo; số minh hoạ)'
  fix:
  - Cột bắt đầu từ 0; cắt trục làm tỉ lệ nhìn thấy khác tỉ lệ thật
  - Gộp mọi nhóm có thể đảo ngược kết luận; thang loga đọc như thang thường là hiểu sai
- id: L12
  title: 'Kiểm thử tự động: ca kiểm, ca biên'
  spec: lessons/pyt/L12_kiem_thu_tu_dong.yaml
  requires:
  - L11
  objectives:
  - Viết ca kiểm bằng khẳng định và chạy bằng công cụ kiểm thử
  - Đọc kết quả xanh đỏ và tìm ca hỏng, giá trị thật, giá trị mong đợi
  - Tham số hoá nhiều ca trong một hàm kiểm
  - Chọn ca biên ngay trước, đúng tại và ngay sau mỗi ngưỡng
  - Tính giá trị mong đợi độc lập với mã và kiểm số ca
  - Nêu thời gian kiểm tự động và kiểm tay thay đổi thế nào khi số ca tăng
  - 'Chỉ ra ba lỗi hay gặp: so số thực bằng dấu hai bằng, ca không khẳng định, mong đợi lấy từ chính công thức của mã'
  - Viết ca kiểm bắt được lỗi lệch một
  example: 'phi_chuyen có 7 ca kiểm (2 + 5 ca biên); đổi < thành <= làm đúng 1 ca đỏ (50 000: mong 1 100, nhận 0); chạy 10^4 ca mất từ vài giây tới vài chục giây, chạy tay 30 giây mỗi ca mất cỡ 83 giờ (3,5 ngày) (đo; số minh hoạ)'
  fix:
  - 'Ca kiểm không có assert luôn xanh: cố ý làm hỏng mã để thử ca'
  - Giá trị mong đợi phải đến từ đặc tả hoặc tính tay, không từ công thức của mã
- id: L13
  title: 'Tình huống chuyên gia: phân tích tệp giao dịch từ một nghìn đến một trăm triệu dòng'
  spec: lessons/pyt/L13_tinh_huong_phan_tich_tep_lon.yaml
  requires:
  - L12
  objectives:
  - Đo thời gian và bộ nhớ của ba cách đọc tệp ở hai quy mô và ngoại suy lên quy mô lớn
  - Giải thích vì sao thiết kế phải đổi khi số dòng tăng bậc
  - Nêu cách đọc hợp lý cho từng quy mô và điều kiện áp dụng
  - Cộng dồn kết quả qua các khối và kiểm bằng tổng chung
  - Phân biệt thống kê gộp được với không gộp được theo khối
  - 'Chỉ ra ba lỗi hay gặp: quên cộng dồn, tối ưu trước khi đo, nhầm thống kê gộp được'
  - Dựng dự án nhỏ gồm mô-đun, ca kiểm và danh sách thư viện ghim, và tự chấm bằng thang điểm
  example: 'tổng theo loại của tệp 8 dòng: chuyển 1 450 000, nạp 3 400 000, rút 550 000 (5 400 000); cả tệp 10^8 dòng cần cỡ chục GB bộ nhớ, từng dòng/từng khối không đổi (đo ở 10^3 và 10^6, ngoại suy;
    số minh hoạ); thang 10 điểm cho dự án nhỏ'
  fix:
  - Đọc theo khối phải cộng dồn kết quả các khối (gán đè chỉ còn khối cuối)
  - Chỉ thống kê gộp được (tổng, đếm, nhỏ nhất, lớn nhất) mới cộng dồn theo khối; trung vị thì không
