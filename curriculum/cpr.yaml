# Giáo án — CPR · Lập trình C và bộ nhớ: con trỏ, cấp phát động, tệp và gcc (10 bài, 2026-11-18)
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã CPR:Lxx (tính lại + biên dịch/chạy thật bằng GCC 16.2.0 trong audit/cpr/verify_cpr.py).
# Căn cứ phạm vi: CS2023 — Software Development Fundamentals (SDF) & Systems Fundamentals (SF, C11 standard ISO/IEC 9899:2011 — CITED theo chuẩn ngôn ngữ);
#   Kernighan & Ritchie, "The C Programming Language" 2nd ed. (NOT_VERIFIED câu chữ bản in, chỉ dạy hành vi đã kiểm thật qua GCC 16.2.0).
# Vì sao cần: Khoá FND chỉ dạy Bash/Python/SQLite; CSA/OSY dùng đoạn mã C minh hoạ cơ chế hệ thống nhưng chưa có khoá nào dạy con trỏ, Heap, căn lề struct và vòng đời bộ nhớ C.
# Thứ tự học: sau FND:L10; trước CSA/OSY (Chặng 6).
course: CPR
status: active
lessons:
  - id: L00
    title: "Chương trình C đầu tiên, biên dịch với GCC và kích thước bộ nhớ"
    spec: lessons/cpr/L00_chuong_trinh_c_sizeof.yaml
    requires: []
    requires_ext: ["FND:L10"]
    objectives:
      - "Biên dịch và chạy chương trình C với cờ -std=c11 -Wall -Wextra -Werror"
      - "Đo kích thước byte của char, short, int, long long và con trỏ trên máy 64-bit"
      - "Tính dung lượng mảng số nguyên 64-bit ở ba quy mô 100, 10 000 và 1 000 000 phần tử"
    example: "trên hệ 64-bit: sizeof(char)=1, sizeof(int)=4, sizeof(long long)=8, sizeof(void*)=8 byte; 1 000 000 số int tốn 4 000 000 byte (chạy thật GCC 16.2.0) (VER CPR:L00)"
    fix:
      - "Không gán cứng kích thước int hay con trỏ; luôn dùng sizeof thay vì đoán bằng tay"
  - id: L01
    title: "Biến, vòng lặp và ranh giới tràn số nguyên trong C"
    spec: lessons/cpr/L01_bien_vong_lap_tran_so.yaml
    requires: [L00]
    objectives:
      - "Phân biệt tràn số không dấu (quay vòng theo mô-đun 2^n) với tràn số có dấu (hành vi không xác định)"
      - "Dùng đúng kiểu uint8_t, int32_t, int64_t khi cần miền giá trị cố định"
      - "Viết kiểm tra chặn tràn trước khi cộng hoặc nhân số nguyên có dấu"
    example: "uint8_t: 250 + 10 quay vòng thành 4 (260 mod 256); int8_t vượt 127 là hành vi không xác định (VER CPR:L01)"
    fix:
      - "Không bao giờ dựa vào tràn số nguyên có dấu trong C vì trình biên dịch được phép tối ưu giả định không tràn"
  - id: L02
    title: "Hàm, truyền tham trị và khung ngăn xếp (stack frame)"
    spec: lessons/cpr/L02_ham_ngan_xep.yaml
    requires: [L01]
    objectives:
      - "Giải thích vì sao hàm nhận bản sao giá trị nên sửa tham số không đổi biến ngoài"
      - "Cộng kích thước khung ngăn xếp qua 3 tầng gọi hàm và nhận diện nguy cơ tràn ngăn xếp"
      - "Chỉ ra vì sao không được dùng giá trị biến cục bộ sau khi hàm đã trả về"
    example: "3 khung ngăn xếp lần lượt 32 + 48 + 64 = 144 byte; cấp mảng 10 triệu int trên stack ~40 MB vượt mức mặc định gây sập (số minh hoạ) (VER CPR:L02)"
    fix:
      - "Biến cục bộ sống trên ngăn xếp chỉ tới hết hàm; dữ liệu lớn hoặc sống lâu phải cấp phát trên Heap"
  - id: L03
    title: "Mảng và chuỗi ký tự kết thúc bằng byte không"
    spec: lessons/cpr/L03_mang_chuoi_c.yaml
    requires: [L02]
    objectives:
      - "Tính đúng số byte đệm tối thiểu = độ dài chuỗi + 1 byte kết thúc '\\0'"
      - "Phân biệt sao chép có giới hạn độ dài với hàm không kiểm biên gây tràn bộ đệm"
      - "Chặn đọc quá chỉ số cuối mảng n phần tử (0..n-1)"
    example: "chuỗi 5 ký tự cần ít nhất 6 byte trong bộ đệm; 1 000 chuỗi 31 ký tự cần 32 000 byte kể cả byte kết thúc (VER CPR:L03)"
    fix:
      - "Quên chừa 1 byte cho ký tự '\\0' hoặc đọc quá chỉ số n-1 là nguồn gốc trực tiếp của lỗ hổng tràn bộ đệm"
  - id: L04
    title: "Con trỏ và địa chỉ bộ nhớ: toán tử & và *"
    spec: lessons/cpr/L04_con_tro_dia_chi.yaml
    requires: [L02]
    objectives:
      - "Phân biệt địa chỉ ô nhớ (&x), biến con trỏ (p) và giá trị tại địa chỉ (*p)"
      - "Viết hàm hoán đổi hai biến thông qua con trỏ truyền địa chỉ"
      - "Kiểm tra NULL trước khi giải tham chiếu để tránh sập chương trình"
    example: "hoán đổi a=10, b=25 qua địa chỉ: sau lời gọi a=25, b=10; truy cập qua con trỏ rỗng 0 là lỗi phân đoạn (VER CPR:L04)"
    fix:
      - "Khai báo con trỏ chưa khởi tạo mang giá trị rác; luôn gán NULL hoặc địa chỉ hợp lệ ngay lúc tạo"
  - id: L05
    title: "Con trỏ, mảng và số học bước nhảy con trỏ"
    spec: lessons/cpr/L05_so_hoc_con_tro.yaml
    requires: [L03, L04]
    objectives:
      - "Tính độ lệch byte thật khi cộng thêm k vào con trỏ kiểu T* (k × sizeof(T))"
      - "Dùng từ khoá const đúng chỗ để bảo vệ dữ liệu chỉ đọc khi truyền mảng"
      - "So sánh truy cập chỉ số a[i] và bước nhảy con trỏ *(p + i)"
    example: "với mảng int 4 byte, p + 3 dịch chuyển 12 byte; với double 8 byte, p + 3 dịch chuyển 24 byte (VER CPR:L05)"
    fix:
      - "Cộng 1 vào con trỏ không cộng 1 byte mà cộng đúng sizeof(*p) byte"
  - id: L06
    title: "Bộ nhớ Heap: malloc, calloc, realloc, free và 4 lỗi kinh điển"
    spec: lessons/cpr/L06_cap_phat_dong_heap.yaml
    requires: [L05]
    objectives:
      - "Phân biệt malloc (chưa xoá rác), calloc (gán 0) và realloc (mở rộng)"
      - "Tính dung lượng rò rỉ bộ nhớ khi quên free trong vòng lặp quy mô lớn"
      - "Tránh bốn lỗi: quên free, dùng sau free, free hai lần và không kiểm kết quả NULL"
    example: "mỗi vòng cấp 1 024 byte không giải phóng: 1 000 vòng rò 1 024 000 byte (~1 MB), 1 000 000 vòng rò ~1 GB (VER CPR:L06)"
    fix:
      - "Sau free(p), đặt ngay p = NULL để mọi giải phóng hoặc đọc nhầm về sau bị phát hiện ngay"
  - id: L07
    title: "Kiểu ghép struct, căn lề bộ nhớ và danh sách liên kết"
    spec: lessons/cpr/L07_struct_padding_linked_list.yaml
    requires: [L06]
    objectives:
      - "Tính kích thước struct có tính byte đệm (padding) theo bội số căn lề"
      - "Sắp xếp lại thứ tự trường từ lớn đến nhỏ để tiết kiệm bộ nhớ"
      - "Cài đặt thêm đầu và giải phóng toàn bộ danh sách liên kết đơn không rò rỉ"
    example: "struct (char, int, char) tốn 12 byte (6 byte đệm); đổi thành (int, char, char) chỉ còn 8 byte — tiết kiệm 33,3% ở 1 triệu phần tử (VER CPR:L07)"
    fix:
      - "sizeof(struct) có thể lớn hơn tổng sizeof từng trường vì trình biên dịch chèn byte đệm căn lề"
  - id: L08
    title: "Tệp nhị phân, phép toán bit và tách trường đóng gói"
    spec: lessons/cpr/L08_tep_nhi_phan_bit.yaml
    requires: [L07]
    objectives:
      - "Mở, ghi và đọc chính xác bản ghi cố định từ tệp nhị phân bằng fopen/fwrite/fread/fclose"
      - "Kiểm tra số phần tử thực sự đọc/ghi được thay vì giả định luôn đủ"
      - "Dùng dịch bit và mặt nạ để tách cờ và độ dài đóng gói trong 1 byte/2 byte"
    example: "ghi 3 bản ghi mỗi bản ghi 16 byte tạo tệp đúng 48 byte; đọc hết tệp trả đúng 3 bản ghi rồi báo kết thúc (VER CPR:L08)"
    fix:
      - "So sánh struct từng byte bằng memcmp có thể sai nếu còn byte đệm rác chưa khởi tạo"
  - id: L09
    title: "Tình huống chuyên gia: Xây bộ phân tích tệp nhật ký nhị phân sạch bộ nhớ"
    spec: lessons/cpr/L09_tinh_huong_phan_tich_nhat_ky.yaml
    requires: [L08]
    objectives:
      - "Thiết kế bản ghi nhị phân 16 byte không lãng phí byte đệm"
      - "Đọc luồng lớn quy mô triệu bản ghi bằng mảng động tăng gấp đôi dung lượng và free sạch"
      - "Kiểm lỗi biên tệp cụt và phát hiện tràn tổng tiền 64-bit"
    example: "bản ghi 16 byte (uint64 thời gian + uint16 loại + uint16 cờ + uint32 tiền): 100 000 bản ghi tốn đúng 1,6 MB thay vì 2,4 MB (VER CPR:L09)"
    fix:
      - "Luôn kiểm tràn nhân (n * sizeof) trước khi truyền vào malloc/realloc khi đọc kích thước từ tệp ngoài"
