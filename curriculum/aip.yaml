# Giáo án THỰC HÀNH — AIP · Kỹ thuật AI ứng dụng, Kiểm thử tự động & Quản trị AI (WP-3D)
# Trạng thái: active. Bộ kiểm độc lập: audit/aip/verify_aip.py; mỗi bài có du_lieu.txt + >=2 ca_an/.
# Căn cứ JD: Feature Store Point-in-Time, Experiment Tracking & Registry & A/B, Drift PSI & Auto-Retrain, Inference Dynamic Batching & Speech/Edge, Multi-Turn NLP & Agentic Guardrails, Test Automation API/UI & AI Governance/PII.
course: AIP
status: active
lab:
  lang:
  - py
  requires:
  - PYT:L04
lessons:
- id: L00
  title: Feature Store đồng nhất Online/Offline và ghép Point-in-Time
  spec: lessons/aip/L00_feature_store_point_in_time.yaml
  requires: []
  objectives:
  - Thiết kế Feature Store thống nhất công thức tính đặc trưng giữa huấn luyện ngoại tuyến và phục vụ trực tuyến
  - Kiểm chứng độ lệch huấn luyện phục vụ bằng so khớp véc-tơ đặc trưng hai nhánh
  - Áp dụng ghép theo thời điểm Point-in-Time để triệt tiêu rò rỉ dữ liệu từ tương lai
  example: Nhãn giao dịch lúc t=10 chỉ được ghép bản ghi Feature có ts <= 10 (lấy bản ghi ts=8 thay vì ts=12 trong tương
    lai) (VER AIP:L00)
  fix:
  - Dùng phép JOIN thông thường không ràng buộc mốc thời gian sự kiện để đặc trưng tương lai lọt vào tập huấn luyện
  requires_ext:
  - MLP:L00
  - MLO:L05
- id: L01
  title: Experiment Tracking, Model Registry và kiểm thử A/B triển khai
  spec: lessons/aip/L01_experiment_registry_ab_testing.yaml
  requires:
  - L00
  objectives:
  - Ghi nhật ký siêu tham số và chỉ số thực nghiệm vào Experiment Tracking có tính tái lập
  - Quản trị chuyển trạng thái mô hình trong Model Registry từ Staging lên Production có rà soát ngưỡng
  - Đánh giá thử nghiệm A/B bằng tỉ lệ chuyển đổi và kiểm định sai số có ý nghĩa trước khi mở rộng lưu lượng
  example: Trong 3 lượt thử nghiệm, chỉ lượt r2 đạt F1 >= 0.85 và độ trễ < 25ms mới lên Production; nhóm B thắng nhóm
    A khi vượt ngưỡng nâng và độ tin cậy (VER AIP:L01)
  fix:
  - Thấy một bản thử nghiệm điểm cao trên sổ tay liền ghi đè thẳng lên tệp trọng số đang phục vụ khách hàng thật mà không
    lưu vết phiên bản
  requires_ext:
  - MLO:L04
  - MLO:L07
- id: L02
  title: Phát hiện trôi dữ liệu PSI và tự động tái huấn luyện mô hình
  spec: lessons/aip/L02_drift_detection_retraining.yaml
  requires:
  - L01
  objectives:
  - Đo mức độ dịch chuyển phân phối đặc trưng đầu vào bằng chỉ số ổn định quần thể PSI
  - Phân loại ngưỡng cảnh báo trôi dữ liệu nhẹ và trôi dữ liệu nặng cần can thiệp
  - Kích hoạt đường ống tự động tái huấn luyện có chốt kiểm vượt đường nền hiện hữu
  example: Phân bố 4 giỏ đổi từ [0.40, 0.30, 0.20, 0.10] sang [0.15, 0.25, 0.30, 0.30] cho PSI = 0.515 > 0.20 -> kích
    hoạt retrain (VER AIP:L02)
  fix:
  - Chạy lịch tái huấn luyện mù quáng mỗi tối rồi đẩy thẳng bản mới dù tập dữ liệu mới bị nhiễu hoặc chất lượng mô hình
    tụt giảm
  requires_ext:
  - MLO:L08
  - MLO:L09
- id: L03
  title: Phục vụ suy luận Dynamic Batching, Speech AI và tối ưu Edge/IoT
  spec: lessons/aip/L03_inference_serving_edge_speech.yaml
  requires:
  - L02
  objectives:
  - Tối ưu thông lượng phục vụ suy luận AI trên backend bằng kỹ thuật gom lô động Dynamic Batching
  - Đo cân bằng giữa kích thước lô tối đa và độ trễ đuôi P99 trên hệ thống Speech ASR/TTS
  - Đánh giá lượng tử hoá mô hình giảm kích thước và độ trễ triển khai trên thiết bị Edge/IoT
  example: Gom lô động batch=8 giảm chi phí mỗi yêu cầu từ 12ms xuống 2.5ms, tăng thông lượng 4.8x; lượng tử hoá INT8
    giảm mô hình 4x cho thiết bị Edge (VER AIP:L03)
  fix:
  - Đặt cửa sổ chờ gom lô quá lớn hoặc dùng batch=1 trên máy chủ AI gây lãng phí phần cứng và vỡ trần độ trễ
  requires_ext:
  - MLO:L06
- id: L04
  title: Hội thoại nhiều lượt, nhận diện Intent/Slot và rào chắn Agentic AI
  spec: lessons/aip/L04_nlp_intent_multi_turn_agentic.yaml
  requires:
  - L03
  objectives:
  - Nhận diện ý định Intent và điền giá trị khe Slot qua bộ nhớ hội thoại nhiều lượt NLP
  - Áp dụng danh sách cho phép Tool Allowlist và kiểm lược đồ JSON Schema cho tác tử Agentic AI
  - Giới hạn số bước vòng lặp suy luận tối đa tránh tác tử lặp vô tận tốn chi phí API
  example: Lượt 1 thiếu số tiền -> giữ intent 'transfer' và chuyển slot đích sang lượt 2; từ chối tool 'drop_table' không
    nằm trong allowlist và khoá max_steps=5 (VER AIP:L04)
  fix:
  - Cho phép mô hình ngôn ngữ gọi trực tiếp tên công cụ tự do do văn bản người dùng gợi ý mà không kiểm allowlist và
    giới hạn vòng lặp
  requires_ext:
  - AGT:L09
- id: L05
  title: Tự động hoá kiểm thử API/UI và quản trị AI Governance / PII
  spec: lessons/aip/L05_test_automation_ai_governance.yaml
  requires:
  - L04
  objectives:
  - Thiết kế bộ kiểm thử tự động kiểm hợp đồng API JSON và trình chọn giao diện UI theo mô hình Pytest/Playwright
  - Kiểm định AI Governance đo tỉ lệ công bằng nhóm và kiểm soát tuân thủ phát hành sản phẩm
  - Ẩn danh thông tin định danh cá nhân PII như email và số điện thoại trước lúc ghi log hoặc huấn luyện
  example: Thử nghiệm API kiểm mã 200, trường data và độ trễ <= 150ms; bộ lọc PII xoá sạch chuỗi email/SĐT; tỉ lệ duyệt
    nhóm bảo vệ 0.48 / 0.60 = 0.80 đạt chuẩn công bằng 4/5 (VER AIP:L05)
  fix:
  - Ghi nguyên chuỗi căn cước, email khách hàng vào nhật ký kiểm thử và đẩy mô hình có tỉ lệ công bằng nhóm yếu dưới
    ngưỡng 0,80
  requires_ext:
  - SEC:L06
