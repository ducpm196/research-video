# Giáo án KẾ HOẠCH — ESY · Hệ thống nhúng và thời gian thực
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã ESY:Lxx (phân tích thời gian đáp ứng chạy bằng vòng lặp điểm bất động).
# Căn cứ phạm vi: CS2023 — Specialized Platform Development (SPD, 4 giờ CS Core) và Systems Fundamentals (SF); nội dung thời gian thực
#   theo kết quả kinh điển Liu & Layland (1973) cận lập lịch đơn điệu theo tần số (CITED theo tài liệu gốc, câu chữ chưa tra lại — NOT_VERIFIED).
# Vì sao cần: robot (khoá RBM), thiết bị IoT, xe tự hành đều chạy trên vi điều khiển với bộ nhớ, năng lượng, thời hạn rất chặt;
#   CSA dạy biểu diễn bit và vào/ra, OSY dạy lập lịch thông thường — khoá này thêm ràng buộc thời hạn cứng và phần cứng ngoại vi.
# Thứ tự học: sau CSA L00–L03, L15; OSY L02, L03, L05; RBM L14 (lấy mẫu).
course: ESY
status: planned
lessons:
  - id: L00
    title: "Hệ nhúng: vi điều khiển, ràng buộc tài nguyên và thời hạn"
    spec: lessons/esy/L00_he_nhung.yaml
    requires: []
    requires_ext: ["CSA:L15", "CS115:L00"]
    objectives: ["Phân biệt vi điều khiển và máy tính đa dụng", "Phân biệt thời gian thực cứng và mềm", "Hiểu thời gian thực là đúng hạn có bảo đảm, không phải chạy nhanh"]
    example: "túi khí phải bung trong vài chục mili giây — trễ hạn là hỏng, dù kết quả tính đúng"
    fix: ["Thời gian thực nghĩa là đúng hạn có bảo đảm, không phải “chạy nhanh”"]
  - id: L01
    title: "Thanh ghi ngoại vi và thao tác bit trên chân vào/ra"
    spec: lessons/esy/L01_thanh_ghi_bit.yaml
    requires: [L00]
    requires_ext: ["CSA:L02"]
    objectives: ["Hiểu thanh ghi ngoại vi: mỗi bit điều khiển một chân", "Bật, tắt, đảo, đọc một bit mà không đụng bit khác", "Tránh lỗi ghi đè cả thanh ghi"]
    example: "reg |= 1 << 5 bật bit 5; reg &= ~(1 << 5) tắt; reg ^= 1 << 3 đảo bit 3 (VER ESY:L01)"
    fix: ["Ghi thẳng giá trị vào thanh ghi xoá luôn các bit khác đang được dùng"]
  - id: L02
    title: "Ngắt, vòng thăm dò và chống dội phím"
    spec: lessons/esy/L02_ngat_chong_doi.yaml
    requires: [L01]
    objectives: ["So sánh ngắt và vòng thăm dò", "Viết hàm xử lý ngắt ngắn, dùng biến dùng chung an toàn", "Chống dội phím bằng lấy mẫu"]
    example: "phím dội trong 5 ms, lấy mẫu mỗi 1 ms: chỉ chấp nhận sau 5 mẫu liên tiếp giống nhau (VER ESY:L02)"
    fix: ["Hàm xử lý ngắt phải ngắn; biến dùng chung với ngắt phải khai báo volatile và bảo vệ khi đọc nhiều byte"]
  - id: L03
    title: "Bộ định thời và điều chế độ rộng xung"
    spec: lessons/esy/L03_dinh_thoi_pwm.yaml
    requires: [L01]
    objectives: ["Tính tần số bộ định thời từ xung nhịp, hệ số chia và TOP", "Tính độ rộng xung PWM", "Dùng PWM điều khiển độ sáng, tốc độ động cơ"]
    example: "xung nhịp 16 MHz, chia trước 64, TOP = 249 → 1000 Hz; so sánh ở 63 → độ rộng xung khoảng 25% (VER ESY:L03)"
    fix: ["Lệch một ở TOP: chu kỳ là TOP + 1 nhịp, không phải TOP"]
  - id: L04
    title: "Chuyển đổi tương tự–số: độ phân giải và lượng tử hoá"
    spec: lessons/esy/L04_adc.yaml
    requires: [L00]
    requires_ext: ["CSA:L01"]
    objectives: ["Đổi mã ADC ra điện áp và ngược lại", "Tính bước lượng tử và tỉ số tín hiệu trên nhiễu lượng tử lý tưởng", "Biết thêm bit không thêm độ chính xác khi nhiễu tương tự lớn"]
    example: "ADC 10 bit, 3,3 V: mỗi mức khoảng 3,22 mV; đọc 512 → 1,65 V; SNR lý tưởng khoảng 61,96 dB (VER ESY:L04)"
    fix: ["Thêm bit không thêm độ chính xác nếu nhiễu tương tự lớn hơn một mức lượng tử"]
  - id: L05
    title: "Lấy mẫu và lọc số đơn giản trên vi điều khiển"
    spec: lessons/esy/L05_loc_so.yaml
    requires: [L04]
    requires_ext: ["RBM:L14"]
    objectives: ["Chọn tần số lấy mẫu và đặt lọc tương tự trước ADC", "Cài lọc trung bình trượt và lọc thông thấp bậc nhất", "Hiểu đánh đổi giữa giảm nhiễu và độ trễ"]
    example: "lọc y ← y + 0,2(x − y), đầu vào nhảy từ 0 lên 1: sau 10 mẫu y = 1 − 0,8¹⁰ ≈ 0,8926 (VER ESY:L05)"
    fix: ["Lọc số không sửa được chồng phổ đã xảy ra lúc lấy mẫu — cần lọc tương tự trước ADC"]
  - id: L06
    title: "Số dấu phẩy tĩnh, tràn và bão hoà"
    spec: lessons/esy/L06_dau_phay_tinh.yaml
    requires: [L04]
    requires_ext: ["CSA:L04"]
    objectives: ["Biểu diễn số lẻ ở định dạng Q8.8", "Nhân hai số dấu phẩy tĩnh đúng cách", "Phân biệt tràn quay vòng và bão hoà"]
    example: "Q8.8: 1,5 → 384; nhân 1,5 với 2,25 rồi dịch phải 8 → 864 = 3,375 (VER ESY:L06)"
    fix: ["Tràn số nguyên quay vòng làm tín hiệu nhảy từ cực đại sang cực tiểu — điều khiển động cơ phải bão hoà"]
  - id: L07
    title: "Giao tiếp nối tiếp không đồng bộ (UART)"
    spec: lessons/esy/L07_uart.yaml
    requires: [L03]
    objectives: ["Đọc một khung UART 8N1", "Tính thời gian truyền và tốc độ byte", "Kiểm sai lệch tốc độ do xung nhịp"]
    example: "8N1: mỗi byte 10 bit → 115 200 baud = 11 520 byte/giây (VER ESY:L07)"
    fix: ["Baud là số ký hiệu mỗi giây, không phải số byte mỗi giây"]
  - id: L08
    title: "Bus I²C và SPI"
    spec: lessons/esy/L08_i2c_spi.yaml
    requires: [L07]
    objectives: ["So sánh I²C và SPI: số dây, tốc độ, cách chọn thiết bị", "Ghép byte địa chỉ I²C", "Chọn điện trở kéo lên cho I²C"]
    example: "I²C dùng 2 dây chung và địa chỉ thiết bị; SPI dùng một dây chọn chip riêng cho mỗi thiết bị; kéo lên 400 kHz, 200 pF: 967–1770 Ω (VER ESY:L08)"
    fix: ["I²C cần điện trở kéo lên — thiếu thì bus không hoạt động ổn định"]
  - id: L09
    title: "Lập lịch đơn điệu theo tần số và phân tích thời gian đáp ứng"
    spec: lessons/esy/L09_lap_lich_rm.yaml
    requires: [L00]
    requires_ext: ["OSY:L03"]
    objectives: ["Tính độ sử dụng bộ xử lý và so với cận Liu–Layland", "Tính thời gian đáp ứng xấu nhất bằng phép lặp", "Biết cận chỉ là điều kiện đủ"]
    example: "tác vụ (1, 4), (2, 6), (3, 12): U ≈ 0,833 vượt cận 0,7798 nên cận không kết luận; thời gian đáp ứng 1, 3, 10 đều ≤ chu kỳ → lập lịch được; (2, 4), (3, 6) với U = 1 thì trượt hạn (VER ESY:L09)"
    fix: ["Vượt cận Liu–Layland chưa chắc trễ hạn — cận chỉ là điều kiện đủ, phải phân tích thời gian đáp ứng"]
  - id: L10
    title: "Lập lịch theo hạn sớm nhất và đảo ngược ưu tiên"
    spec: lessons/esy/L10_edf_dao_uu_tien.yaml
    requires: [L09]
    requires_ext: ["OSY:L05"]
    objectives: ["Lập lịch theo hạn sớm nhất và điều kiện U ≤ 1", "Biết hành vi khi quá tải", "Nhận ra đảo ngược ưu tiên và cách kế thừa ưu tiên sửa nó"]
    example: "(2, 4), (3, 6): U = 1, ưu tiên cố định trễ hạn ở 6, hạn sớm nhất kịp cả hai; tác vụ ưu tiên thấp giữ khoá, tác vụ trung bình chiếm bộ xử lý, tác vụ ưu tiên cao chờ lâu (đáp ứng 7 đơn vị) — kế thừa ưu tiên nâng tác vụ thấp lên tạm thời, đáp ứng còn 3 (VER ESY:L10)"
    fix: ["Lập lịch theo hạn sớm nhất tối ưu khi không quá tải, nhưng khi quá tải có thể trễ dây chuyền nhiều tác vụ"]
  - id: L11
    title: "Hệ điều hành thời gian thực: tác vụ, hàng đợi, đồng bộ"
    spec: lessons/esy/L11_rtos.yaml
    requires: [L10]
    objectives: ["Chia chương trình thành các tác vụ có ưu tiên", "Truyền dữ liệu từ ngắt sang tác vụ bằng hàng đợi", "Biết hàm nào được gọi trong ngắt"]
    example: "ngắt nhận UART chỉ đẩy byte vào hàng đợi; tác vụ giải mã chạy ở mức ưu tiên thường"
    fix: ["Gọi hàm chờ (có thể ngủ) trong hàm xử lý ngắt làm treo hệ thống"]
  - id: L12
    title: "Độ tin cậy: bộ giám sát, tràn ngăn xếp, cấp phát động"
    spec: lessons/esy/L12_do_tin_cay.yaml
    requires: [L11]
    objectives: ["Dùng bộ giám sát đúng cách", "Ước lượng và đo ngăn xếp", "Hiểu vì sao tránh cấp phát động khi chạy"]
    example: "bộ giám sát 100 ms: vòng chính phải “cho ăn” trước hạn, nếu treo thì chip tự khởi động lại (VER ESY:L12)"
    fix: ["Cho bộ giám sát ăn trong ngắt định thời che mất lỗi treo của vòng chính"]
  - id: L13
    title: "Năng lượng: chế độ ngủ và tuổi thọ pin"
    spec: lessons/esy/L13_nang_luong.yaml
    requires: [L03]
    objectives: ["Tính dòng trung bình theo chu kỳ thức–ngủ", "Ước lượng tuổi thọ pin", "Biết phần nào đang quyết định tuổi thọ"]
    example: "thức 1% thời gian ở 10 mA, ngủ 10 µA: trung bình khoảng 0,1099 mA, pin 1000 mAh khoảng 379 ngày (VER ESY:L13)"
    fix: ["Dòng ngủ nhỏ vẫn quyết định tuổi thọ khi thiết bị ngủ gần như mọi lúc"]
  - id: L14
    title: "Cập nhật phần sụn an toàn và khởi động tin cậy"
    spec: lessons/esy/L14_cap_nhat_an_toan.yaml
    requires: [L12]
    requires_ext: ["NET:L14"]
    objectives: ["Phân biệt mã kiểm tổng và chữ ký số", "Giải thích khởi động tin cậy", "Thiết kế cập nhật hai phân vùng có quay lui"]
    example: "phần sụn mới ghi vào phân vùng B; chỉ chuyển sang B khi kiểm chữ ký và tự kiểm khởi động đạt, không thì về A"
    fix: ["Mã kiểm tổng chống lỗi truyền, không chống kẻ tấn công — cần chữ ký số"]
  - id: L15
    title: "Tình huống chuyên gia theo dòng thời gian: phần mềm trên robot thăm dò sao Hoả"
    spec: lessons/esy/L15_hanh_trinh_sao_hoa.yaml
    requires: [L10, L12, L14]
    see_also: ["CAS:L04", "OSY:L05"]
    kind: journey
    objectives: ["Kể lại hành trình phần mềm bay trên robot thăm dò sao Hoả qua năm chặng từ 1997 tới nay, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại hạn chót của chu kỳ 8 Hz khi đảo ngược ưu tiên, số lần cấp thêm bộ nhớ trước khi cạn, nhịp đặt lại trễ và tuổi thọ vượt thiết kế", "Chọn giữa khởi động lại định kỳ, giới hạn vùng nhớ cố định và giám sát ngưỡng cho thiết bị của mình, kèm điều kiện đổi lựa chọn"]
    example: "Pathfinder 1997 (GR97): chu kỳ 8 Hz = 0,125 s; mốc minh hoạ 40 + 60 + 2 + 15 = 117 ms > 110 → đặt lại, kế thừa ưu tiên → 57 ms; Spirit 2004 (RN05): vùng nhớ nới từng 256 KB từ khoảng 4096 KB → 16 lần là cạn; mẫu đặt lại 15–15–60 phút, sol ≈ 1480 phút → ≈ 49,3 lần mỗi sol (cận trên); ngưỡng 800 KB còn 3 lần nới; Opportunity (JPL 2014): 25/1/2004 → 29/8/2014 ≈ 10,6 năm ≈ 42 lần thiết kế 3 tháng (VER ESY:L15)"
    fix: ["Chỉ khẳng định điều có trong GR97, MJ97, RN05, JPL14a/b, JPL15, FP (audit/esy/sources_L15.md); GR97 đọc bản chép tại cs.unc.edu vì trang Microsoft 403/404, web.archive.org 429; trang tin JPL curl 403 — đọc bằng WebFetch", "Chi tiết chỉ có ở bản kể lại MJ97 (vá bằng trình thông dịch C, ba khoá, công cụ gỡ lỗi để lại “tình cờ”) bị GR97 sửa — không dạy như sự thật", "Không kể lại chi tiết điều tra Pathfinder từng ngày, chỉ rút thực hành theo quy mô nhiệm vụ", "Một sol (ngày mặt trời sao Hoả) dài 24 giờ 39 phút 35 giây ≈ 1480 phút; 24 giờ 37 phút là ngày sao, không phải sol", "Mốc 40/110/15/2 ms, tải 30/60 ms, 3000/2000/1000 tệp, 300 sản phẩm mỗi ngày, trạm đo 600 KB là số minh hoạ; ≈ 49 lần đặt lại mỗi sol là cận trên tính trên mẫu, không phải số đo"]
