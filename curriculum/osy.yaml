# Giáo án KẾ HOẠCH — OSY · Hệ điều hành
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã OSY:Lxx (85/85 PASS, 2026-10-27).
# Căn cứ phạm vi: CS2023 — Operating Systems (OS, 8 giờ CS Core, 13 KA Core) và một phần Parallel and Distributed Computing (PDC)
#   (“1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98).
# Vì sao cần: robot (điều phối nhiều tác vụ thời gian thực), AI (tiến trình huấn luyện, bộ nhớ GPU/CPU), phần mềm (đồng thời, bế tắc).
# Thứ tự học: sau CSA (L08, L14); dùng hàng đợi, đống của CS112 (L04, L06).
course: OSY
status: planned
lessons:
  - id: L00
    title: "Vai trò của hệ điều hành: chế độ nhân, lời gọi hệ thống"
    spec: lessons/osy/L00_vai_tro_he_dieu_hanh.yaml
    requires: []
    requires_ext: ["CSA:L15"]
    objectives: ["Phân biệt chế độ nhân và chế độ người dùng", "Giải thích lời gọi hệ thống khác lời gọi hàm thường thế nào", "Ước lượng chi phí chuyển ngữ cảnh"]
    example: "1000 lần chuyển ngữ cảnh/giây × 5 µs = 0,5% CPU (VER OSY:L00)"
    fix: ["Lời gọi hệ thống không phải lời gọi hàm thường — có chuyển chế độ và kiểm quyền"]
  - id: L01
    title: "Tiến trình và luồng: trạng thái, fork, chuyển ngữ cảnh"
    spec: lessons/osy/L01_tien_trinh_luong.yaml
    requires: [L00]
    objectives: ["Phân biệt chương trình, tiến trình, luồng", "Vẽ sơ đồ trạng thái tiến trình", "Đếm số tiến trình sau các lời gọi fork"]
    example: "fork() 3 lần trong vòng lặp → 2³ = 8 tiến trình kể cả gốc (VER OSY:L01)"
    fix: ["Luồng dùng chung bộ nhớ của tiến trình; tiến trình con có không gian địa chỉ riêng"]
  - id: L02
    title: "Lập lịch CPU: FCFS và SJF"
    spec: lessons/osy/L02_lap_lich_fcfs_sjf.yaml
    requires: [L01]
    requires_ext: ["CS112:L04"]
    objectives: ["Vẽ biểu đồ thời gian của một lịch chạy", "Tính thời gian chờ trung bình", "Giải thích vì sao việc ngắn nhất trước cho chờ trung bình nhỏ nhất"]
    example: "tiến trình 24, 3, 3: FCFS chờ trung bình 17, SJF chờ trung bình 3 (VER OSY:L02)"
    fix: ["SJF tối ưu thời gian chờ trung bình nhưng cần biết trước độ dài — thực tế phải ước lượng"]
  - id: L03
    title: "Lập lịch Round Robin, độ ưu tiên và nạn đói"
    spec: lessons/osy/L03_round_robin_uu_tien.yaml
    requires: [L02]
    requires_ext: ["CS112:L06"]
    objectives: ["Mô phỏng xoay vòng với lượng tử cho trước", "Phân biệt thời gian chờ và thời gian phản hồi", "Giải thích nạn đói và kỹ thuật lão hoá"]
    example: "Round Robin q = 4 với 24, 3, 3: chờ 6, 4, 7, trung bình 17/3 ≈ 5,67 (VER OSY:L03)"
    fix: ["Lượng tử quá nhỏ → chi phí chuyển ngữ cảnh chiếm ưu thế; quá lớn → thành FCFS"]
  - id: L04
    title: "Tranh chấp và vùng găng"
    spec: lessons/osy/L04_tranh_chap_vung_gang.yaml
    requires: [L01]
    objectives: ["Chỉ ra điều kiện tranh chấp trong x++", "Phát biểu ba yêu cầu của lời giải vùng găng", "Giải thích vì sao chạy thử nhiều lần không chứng minh được đúng"]
    example: "hai luồng, mỗi luồng x++ hai lần (đọc–cộng–ghi): x cuối có thể là 2, 3 hoặc 4 (máy duyệt mọi cách xen kẽ, VER OSY:L04)"
    fix: ["Chạy thử 1000 lần ra đúng không chứng minh không có tranh chấp"]
  - id: L05
    title: "Khoá, semaphore và bài toán sản xuất–tiêu thụ"
    spec: lessons/osy/L05_khoa_semaphore.yaml
    requires: [L04]
    objectives: ["Dùng khoá bảo vệ vùng găng", "Giải bài sản xuất–tiêu thụ với hai semaphore đếm và một khoá", "Nhận ra bế tắc do sai thứ tự chờ"]
    example: "bộ đệm 5 ô: semaphore trống = 5, đầy = 0; mỗi lần sản xuất trống − 1, đầy + 1 (VER OSY:L05)"
    fix: ["wait(trống) phải đứng trên lấy(khoá); đảo lại (lấy khoá rồi mới chờ ô trống) gây bế tắc khi bộ đệm đầy"]
  - id: L06
    title: "Bế tắc: bốn điều kiện Coffman và đồ thị cấp phát"
    spec: lessons/osy/L06_be_tac_coffman.yaml
    requires: [L05]
    objectives: ["Kiểm bốn điều kiện cần của bế tắc", "Đọc đồ thị cấp phát tài nguyên", "Phá một điều kiện để phòng bế tắc (thứ tự khoá)"]
    example: "5 triết gia, mỗi người cầm đũa trái trước → có thể bế tắc; đánh số đũa và luôn cầm đũa số nhỏ trước → hết chu trình chờ (VER OSY:L06)"
    fix: ["Có chu trình trong đồ thị cấp phát chỉ chắc bế tắc khi mỗi tài nguyên có một thể hiện"]
  - id: L07
    title: "Tránh bế tắc: thuật toán nhà băng"
    spec: lessons/osy/L07_thuat_toan_nha_bang.yaml
    requires: [L06]
    objectives: ["Tính ma trận cần thêm", "Tìm một thứ tự an toàn", "Quyết định cấp hay hoãn một yêu cầu"]
    example: "5 tiến trình, tài nguyên (10, 5, 7), còn rảnh (3, 3, 2): an toàn, một thứ tự P1, P3, P0, P2, P4 (VER OSY:L07)"
    fix: ["Trạng thái không an toàn chưa chắc bế tắc — chỉ là không bảo đảm tránh được"]
  - id: L08
    title: "Cấp phát bộ nhớ liên tục và phân mảnh"
    spec: lessons/osy/L08_cap_phat_phan_manh.yaml
    requires: [L00]
    objectives: ["Mô phỏng vừa đầu tiên, vừa nhất", "Phân biệt phân mảnh trong và ngoài", "Giải thích vì sao không chiến lược nào luôn tốt nhất"]
    example: "lỗ 100, 500, 200, 300, 600; yêu cầu 212, 417, 112, 426: vừa đầu tiên không đặt được 426, vừa nhất đặt được cả 4 (VER OSY:L08)"
    fix: ["Không chiến lược nào luôn tốt nhất — tuỳ chuỗi yêu cầu"]
  - id: L09
    title: "Phân trang và dịch địa chỉ"
    spec: lessons/osy/L09_phan_trang.yaml
    requires: [L08]
    requires_ext: ["CSA:L14"]
    objectives: ["Tách địa chỉ thành số trang và độ dời", "Tra bảng trang để được địa chỉ vật lý", "Tính kích thước bảng trang một tầng và hai tầng", "Tính thời gian truy cập hiệu dụng khi có bộ đệm dịch địa chỉ"]
    example: "trang 4 KiB: địa chỉ 0x3A7F → trang 3, độ dời 0xA7F (VER OSY:L09)"
    fix: ["Phân trang hết phân mảnh ngoài nhưng còn phân mảnh trong ở trang cuối"]
  - id: L10
    title: "Thay trang FIFO, LRU, OPT và nghịch lý Belady"
    spec: lessons/osy/L10_thay_trang.yaml
    requires: [L09]
    objectives: ["Đếm lỗi trang với mỗi thuật toán", "Giải thích nghịch lý Belady", "Giải thích vì sao lâu nhất chưa dùng xấp xỉ tối ưu"]
    example: "chuỗi 1,2,3,4,1,2,5,1,2,3,4,5: FIFO 3 khung 9 lỗi, 4 khung 10 lỗi; LRU 3 khung 10; OPT 3 khung 7 (VER OSY:L10)"
    fix: ["Thêm khung không chắc giảm lỗi với FIFO; LRU và OPT thì không bị nghịch lý này"]
  - id: L11
    title: "Tập làm việc và hiện tượng trì trệ (thrashing)"
    spec: lessons/osy/L11_tap_lam_viec_tri_tre.yaml
    requires: [L10]
    objectives: ["Ước lượng tập làm việc với một cửa sổ", "Tính thời gian truy cập hiệu dụng khi có lỗi trang", "Nhận ra trì trệ khi tổng tập làm việc vượt bộ nhớ"]
    example: "4 tiến trình, mỗi tiến trình cần 300 trang, bộ nhớ 1000 khung → 1200 > 1000: trì trệ; tạm dừng một tiến trình → 900 < 1000 (VER OSY:L11)"
    fix: ["Tăng số tiến trình khi CPU nhàn rỗi vì trì trệ làm tình hình tệ hơn"]
  - id: L12
    title: "Hệ thống tệp: inode, khối, chỉ mục nhiều tầng"
    spec: lessons/osy/L12_he_thong_tep_inode.yaml
    requires: [L09]
    objectives: ["Mô tả cấu trúc nút chỉ mục của tệp", "Tính kích thước tệp tối đa", "Đếm số lần đọc đĩa để truy cập một khối"]
    example: "12 khối trực tiếp + gián tiếp 1, 2, 3 tầng, khối 4 KiB, con trỏ 4 B: tối đa ≈ 4,004 TiB (VER OSY:L12)"
    fix: ["Xoá tệp thường chỉ xoá liên kết — dữ liệu còn trên đĩa đến khi bị ghi đè"]
  - id: L13
    title: "Lập lịch đĩa và đặc điểm SSD"
    spec: lessons/osy/L13_lap_lich_dia.yaml
    requires: [L12]
    objectives: ["Mô phỏng theo thứ tự đến, gần nhất trước, thang máy", "Tính tổng quãng đường đầu đọc", "Giải thích vì sao ổ thể rắn ít cần lập lịch theo vị trí"]
    example: "đầu đọc 53, hàng đợi 98, 183, 37, 122, 14, 124, 65, 67: FCFS 640 trụ, SSTF 236 trụ (VER OSY:L13)"
    fix: ["SSTF giảm quãng đường nhưng có thể làm yêu cầu ở xa đói"]
  - id: L14
    title: "Bảo vệ và phân quyền trong hệ điều hành"
    spec: lessons/osy/L14_bao_ve_phan_quyen.yaml
    requires: [L12]
    objectives: ["Đọc bit quyền rwx và đổi sang số bát phân", "Giải thích quyền x trên thư mục", "Phân biệt danh sách quyền truy cập và khả năng"]
    example: "rwxr-x--- = 750 (bát phân) (VER OSY:L14)"
    fix: ["Quyền thực thi trên thư mục nghĩa là được đi vào, không phải được chạy"]
  - id: L15
    title: "Tình huống chuyên gia theo dòng thời gian: bộ lập lịch của Linux từ 2002 tới 2024"
    spec: lessons/osy/L15_hanh_trinh_bo_lap_lich_linux.yaml
    requires: [L00, L02, L03, L05]
    kind: journey
    objectives: ["Kể lại hành trình bộ lập lịch CPU của Linux qua năm chặng từ 2002 tới 2024, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại số lần xem mỗi giây, phần CPU theo tác vụ và theo nhóm, và thứ tự chạy theo hạn chót ảo", "Chọn cách chia CPU hợp với quy mô của chính mình, kèm điều kiện đổi lựa chọn"]
    example: "1000 tiến trình sẵn sàng (số minh hoạ), 1000 lần chọn mỗi giây → 1 000 000 lần xem mỗi giây với vòng lặp duyệt hết; lập lịch theo nhóm: 1 tác vụ và 2 tác vụ → 50%, 25%, 25% (KN24); trọng số 2048/1024 → 2/3 và 1/3 (CFS); lát 3 ms và 9 ms trong 36 ms → mỗi bên 18 ms, A chạy trước (VER OSY:L15)"
    fix: ["Chỉ khẳng định điều có trong O102, KN23, CFS, KN24, LWN23, KN66, EEV, KN612, SCX (audit/osy/sources_L15.md); ngày hoà bộ lập lịch O(1) vào nhân chính thức không có trong nguồn — chỉ nói “năm 2002, nhánh 2.5”", "Bảng trọng số theo mức nice, độ cao cây đỏ đen, số đo hiệu năng EEVDF so với CFS, ai dùng lớp lập lịch mở rộng ở quy mô nào — nguồn không ghi, không dạy", "1000 tiến trình, 8 CPU với 1 tiến trình còn lượng tử, lát 3 và 9 ms, 100 tác vụ / 10 thử nghiệm là số minh hoạ", "Tài liệu nhân ghi “6.6 (as a new option in 2024)” mơ hồ — dạy theo Kernel Newbies: 6.6 (29/10/2023) thay CFS, 6.12 (17/11/2024) hoàn tất"]
