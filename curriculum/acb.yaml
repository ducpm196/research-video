# Giáo án ACB · Phỏng vấn Kỹ sư Tích hợp ACB: Tech & Nghiệp vụ Bank
course: ACB
status: active
lessons:
  - id: L00
    title: "Cẩm nang Phỏng vấn Tích hợp Ngân hàng: Từ Mất gốc đến Senior"
    spec: lessons/acb/L00_phong_van_tich_hop_acb.yaml
    requires: []
    objectives:
      - "Nắm vững kiến trúc Core Banking Temenos T24 và Cổng NAPAS 247"
      - "Làm chủ tính nhất quán phân tán SAGA và chống trừ tiền kép"
      - "Tự tin đàm phán mức lương 50 triệu gross tại ACB"
    example: "xử lý 10000 giao dịch mỗi giây với độ trễ dưới 100 mili giây; khử trùng lặp qua Redis trong 60 giây"
    fix: ["Tích hợp ngân hàng không chỉ là gọi API REST thông thường mà đòi hỏi kiểm soát tuyệt đối tính toàn vẹn dữ liệu, chống thất thoát tài chính và xử lý lỗi mạng phân tán"]

  - id: L01
    title: "Tích hợp Core Banking Temenos T24: Bản tin OFS XML và IBM MQ"
    spec: lessons/acb/L01_tich_hop_core_t24_ibm_mq.yaml
    requires: [L00]
    objectives:
      - "Làm chủ cấu trúc bản tin OFS XML và cơ chế giao tiếp qua IBM MQ"
      - "Thiết kế mô hình Request-Reply bất đồng bộ với JMS Correlation ID"
      - "Tối ưu hóa Connection Pool và xử lý biệt lập mã lỗi Timeout T24"
    example: "truy vấn 5000 lệnh mỗi giây qua IBM MQ với thời gian phản hồi dưới 35 mili giây; sinh CorrelId ngẫu nhiên"
    fix: ["Không gọi đồng bộ làm treo thread worker mà phân tách luồng gửi nhận bất đồng bộ qua hai hàng đợi độc lập"]

  - id: L02
    title: "Chuyển mạch Thanh toán Liên ngân hàng NAPAS 247: ISO 8583 và Socket TCP"
    spec: lessons/acb/L02_chuyen_mach_napas_iso8583.yaml
    requires: [L00]
    objectives:
      - "Hiểu sâu cấu trúc bản tin ISO 8583 MTI 0200 và 0210 qua TCP Socket nhị phân"
      - "Bảo mật giải mã PIN Block qua phần cứng HSM và mã hóa MAC bit 128"
      - "Triển khai khử trùng lặp phân tán và quy trình đối soát 3 bên cuối ngày"
    example: "xử lý 8000 TPS cổng NAPAS với độ trễ trung bình 120 mili giây; khóa Redis 60 giây theo STAN và RRN"
    fix: ["Không tin tưởng mạng viễn thông tuyệt đối mà phải luôn kiểm tra khóa độc quyền Redis trước khi hạch toán"]

  - id: L03
    title: "Kiến trúc Streaming với ksqlDB và Kafka: Omnichannel Notification Hub"
    spec: lessons/acb/L03_streaming_ksqldb_notification_hub.yaml
    requires: [L00, L01]
    objectives:
      - "Xây dựng luồng xử lý biến động số dư thời gian thực qua Kafka CDC và ksqlDB"
      - "Thực hiện Stream-Table Join phân luồng thông báo OTT Push, SMS Brandname và Email"
      - "Thiết kế hàng đợi ưu tiên Priority Queue và cơ chế Dead Letter Queue chống thất lạc"
    example: "xử lý 50000 tin nhắn mỗi phút với độ trễ chuyển phát dưới 500 mili giây; tiết kiệm 70 phần trăm chi phí SMS"
    fix: ["Không gọi trực tiếp sang cổng nhà mạng mà dùng hàng đợi đệm kết hợp Circuit Breaker tự động failover"]

  - id: L04
    title: "Sàn Chuyển nhượng Hợp đồng Tiền gửi: Khóa Lạc quan và Máy Trạng thái T24"
    spec: lessons/acb/L04_san_chuyen_nhuong_hop_dong_tien_gui.yaml
    requires: [L00, L01]
    objectives:
      - "Hiểu rõ nghiệp vụ chuyển nhượng sổ tiết kiệm thứ cấp và nguy cơ xung đột đồng thời"
      - "Thiết kế cơ chế Khóa Lạc quan với trường thời điểm truy cập trên PostgreSQL"
      - "Tích hợp bản tin T24 OFS đổi chủ sở hữu và xử lý ma trận mã lỗi treo lệnh"
    example: "cập nhật trạng thái bằng dấu thời gian last_access; phát hiện xung đột khi số dòng tác động bằng 0"
    fix: ["Không dùng khóa cưỡng bức làm nghẽn bảng dữ liệu mà kiểm tra phiên bản dữ liệu tại thời điểm ghi"]

  - id: L05
    title: "Cổng Chi lương theo lô Doanh nghiệp và Sao kê Divide-and-Conquer"
    spec: lessons/acb/L05_cong_chi_luong_va_sao_ke_divide_conquer.yaml
    requires: [L00, L01, L03]
    objectives:
      - "Thiết kế Cổng Chi lương Doanh nghiệp theo lô với mẫu Transactional Outbox"
      - "Giảm Deadlock ORA-00060 trong Oracle PL/SQL bằng khóa từng tài khoản theo thứ tự tăng dần và Bulk Collect có LIMIT"
      - "Xử lý hàng triệu dòng sao kê tài khoản bằng Kafka Streams Divide-and-Conquer"
    example: "chi lương 10000 nhân viên trong 1 lô; phân nhỏ truy vấn sao kê 30 ngày thành 4 phân đoạn song song"
    fix: ["Không duyệt vòng lặp đơn lẻ gây nghẽn mạng mà gom nhóm dữ liệu và khóa hàng theo thứ tự xác định"]

  - id: L06
    title: "Xác thực Sinh trắc học Quyết định 2345 và Bảo mật Ngân hàng Mở"
    spec: lessons/acb/L06_sinh_trac_hoc_qd2345_va_bao_mat_ngan_hang.yaml
    requires: [L00, L01, L02]
    objectives:
      - "Nắm vững quy định 2345 của Ngân hàng Nhà nước về xác thực khuôn mặt sinh trắc học"
      - "Tích hợp SDK chống giả mạo Liveness Detection và Cổng định danh dân cư VNeID"
      - "Thiết lập bước kiểm tra sinh trắc học làm điều kiện tiên quyết trong luồng SAGA"
    example: "kiểm tra khuôn mặt cho giao dịch trên 10 triệu đồng; hoàn tất xác thực trong 450 mili giây"
    fix: ["Không gọi sinh trắc học sau khi đã trừ tiền mà kiểm tra thành công trước khi phát lệnh hạch toán"]

  - id: L07
    title: "Thu hộ qua Tài khoản Định danh và Đối soát 3 Bên"
    spec: lessons/acb/L07_tai_khoan_dinh_danh_va_doi_soat_ba_ben.yaml
    requires: [L00, L01, L02]
    objectives:
      - "Nắm vững kiến trúc Thu hộ qua Tài khoản Định danh Virtual Account và phân giải tiền tố"
      - "Thiết kế cơ chế Webhook Idempotency ký số HMAC-SHA256 gạch nợ tức thời cho ERP doanh nghiệp"
      - "Làm chủ giải thuật Đối soát 3 bên EOD Two-Pointer Merge khớp hàng triệu giao dịch trong vài phút"
    example: "thu hộ 50000 hóa đơn mỗi ngày qua đầu số 8888; đối soát 3 triệu bản ghi trong 180 giây"
    fix: ["Không đối soát bằng vòng lặp quét bảng lồng nhau gây nghẽn RAM mà sắp xếp trước rồi duyệt con trỏ tịnh tiến"]

  - id: L08
    title: "Tín dụng Squad Lending: Thấu chi Sổ tiết kiệm, Lương và Cổng CIC"
    spec: lessons/acb/L08_squad_lending_tich_hop_cic_giai_ngan.yaml
    requires: [L00, L01, L02]
    objectives:
      - "Làm chủ nghiệp vụ Thấu chi Cầm cố Sổ tiết kiệm LTV 90 phần trăm và Thấu chi Lương tín chấp trên Core T24"
      - "Thiết kế luồng phê duyệt tự động LOS, ký số Cloud CA và tra cứu Cổng CIC B2B qua mTLS"
      - "Triển khai cơ chế Giải ngân Idempotent qua NAPAS và trích nợ từng phần Partial Debit từ tài khoản CASA"
    example: "cầm cố sổ tiết kiệm 100 triệu thấu chi 85 triệu; tính lãi spread 2 phẩy 5 phần trăm; giải ngân NAPAS trong 180 mili giây"
    fix: ["Không cho rút sổ tiết kiệm khi đang có dư nợ thấu chi mà phải khóa phong tỏa số dư trên Core T24 trước"]


