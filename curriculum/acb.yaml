# Giáo án ACB · Phỏng vấn Kỹ sư Tích hợp ACB: Tech & Nghiệp vụ Bank
course: ACB
status: active
lessons:
  - id: L00
    title: "Cẩm nang Phỏng vấn Tích hợp Ngân hàng: Từ Mất gốc đến Senior"
    spec: lessons/acb/L00_phong_van_tich_hop_acb.yaml
    requires: []
    requires_ext: ["PYT:L00", "PYT:L01"]
    objectives:
      - "Mô tả sơ đồ bốn tầng tích hợp từ ứng dụng tới Core Banking Temenos T24 qua NAPAS 247 và IBM MQ (kiến trúc tham chiếu rút từ kinh nghiệm làm ở OCB, không khẳng định là thiết kế của ACB)"
      - "Tính lưu lượng mỗi phút và mỗi giờ, độ trễ toàn trình và thời gian sống khoá khử trùng lặp bằng số"
      - "Chọn cách xử lý khi đối tác hết giờ: chuyển nghi vấn, tra soát rồi mới bồi hoàn SAGA, không hoàn tiền vội"
      - "Nhận ra ba sai lầm kỹ thuật hay bị hỏi: gọi hàm nội bộ trong Spring, khoá không theo thứ tự, thiếu chỉ mục khoá ngoại"
      - "Phân biệt hai nhóm vai trò trong tin tuyển dụng backend ngân hàng và cách nhấn mạnh hồ sơ cho từng nhóm"
      - "Trình bày đề xuất mức lương dựa trên dữ kiện đã kiểm, tách khỏi ước tính thị trường chưa kiểm chứng"
      - "So sánh cùng một hệ thống ở ×1, ×100 và ×10 000: số giao dịch, số việc chạy cùng lúc, số khoá, rồi chọn kiến trúc"
      - "Tính lại bằng mã Python mô phỏng với số mới: tải, độ trễ toàn trình, thời gian sống khoá và số dư sau bồi hoàn"
    example: "Tính toán lưu lượng giao dịch và kiểm soát rủi ro (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào); mã Python mô phỏng, lab và quy mô ×1, ×100, ×10 000 do audit/acb/verify_acb.py chạy lại"
    fix: ["Tích hợp ngân hàng không chỉ là gọi API REST thông thường mà đòi hỏi kiểm soát tuyệt đối tính toàn vẹn dữ liệu, chống thất thoát tài chính và xử lý lỗi mạng phân tán"]

  - id: L01
    title: "Tích hợp Core Banking Temenos T24: Bản tin OFS và IBM MQ"
    spec: lessons/acb/L01_tich_hop_core_t24_ibm_mq.yaml
    requires: [L00]
    requires_ext: ["PYT:L00", "PYT:L01", "PYT:L02", "PYT:L03"]
    objectives:
      - "Đọc và ráp một bản tin OFS từ các phần: ứng dụng, tuỳ chọn, người dùng, mã giao dịch và cặp tên=giá trị"
      - "Mô tả mô hình Request-Reply bất đồng bộ với mã tương quan (JMSCorrelationID) trên hai hàng đợi riêng"
      - "Tính số bản tin đang chờ theo định luật Little và số kết nối cần mở ở hai mô hình gửi nhận"
      - "Chọn cách xử lý khi T24 hết giờ: chuyển nghi vấn, tra cứu theo mã tham chiếu, không gửi lại ngay"
      - "Nhận ra ba sai lầm khi nối IBM MQ với T24: chờ đồng bộ, thiếu hạn sống của bản tin, bản tin độc"
      - "Chạy mô phỏng ghép trả lời với yêu cầu theo mã tương quan khi trả lời đến sai thứ tự"
      - "So sánh ×1, ×100 và ×10 000: số bản tin đang chờ, số kết nối, và hàng đợi ứ lại theo thời gian"
      - "Viết mã Python ráp bản tin OFS, ghép trả lời theo mã và tính định luật Little với số mới"
    example: "Tính toán kích thước hàng đợi và thời gian quay vòng lệnh (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào); mã Python mô phỏng, lab và quy mô ×1, ×100, ×10 000 do audit/acb/verify_acb.py chạy lại"
    fix: ["Không gọi đồng bộ làm treo thread worker mà phân tách luồng gửi nhận bất đồng bộ qua hai hàng đợi độc lập"]

  - id: L02
    title: "Chuyển mạch Thanh toán Liên ngân hàng NAPAS 247: ISO 8583 và Socket TCP"
    spec: lessons/acb/L02_chuyen_mach_napas_iso8583.yaml
    requires: [L00]
    requires_ext: ["PYT:L00", "PYT:L01", "PYT:L02", "PYT:L03"]
    objectives:
      - "Đọc và ráp bản đồ bit của bản tin ISO 8583 để biết bản tin có những trường nào và khi nào cần bản đồ bit thứ hai"
      - "Mô tả các trường chính của bản tin MTI 0200 và 0210: mã xử lý, số tiền, STAN, RRN, khối PIN và mã xác thực MAC"
      - "Nêu vì sao mã PIN chỉ được dịch bên trong HSM và vì sao phải kiểm MAC trước khi xử lý bản tin"
      - "Tính số giao dịch đang chờ, thời gian sống của khoá khử trùng lặp và công suất dự phòng giờ cao điểm"
      - "Chạy mô phỏng khoá khử trùng lặp có thời gian sống: bản tin trùng bị chặn, bản tin trùng sau khi hết hạn lọt qua"
      - "Chọn cách xử lý khi mất kết nối quá hạn chờ: chuyển nghi vấn, tra soát, đối soát cuối ngày, không hoàn tiền ngay"
      - "Nhận ra ba sai lầm: ghi PIN vào nhật ký, bỏ kiểm MAC, thiếu đối soát cuối ngày"
      - "So sánh ×1, ×100 và ×10 000: số giao dịch đang chờ, số khoá cùng tồn tại và chỗ nghẽn cứng ở phần cứng"
      - "Viết mã Python ráp và giải mã bản đồ bit, dựng khoá khử trùng lặp có hạn với số mới"
    example: "Tính toán khả năng tải và thời gian sống khoá khử trùng lặp (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào); mã Python mô phỏng, lab và quy mô ×1, ×100, ×10 000 do audit/acb/verify_acb.py chạy lại"
    fix: ["Không tin tưởng mạng viễn thông tuyệt đối mà phải kiểm tra khoá khử trùng lặp Redis trước khi giữ tiền; hết giờ thì chuyển nghi vấn và tra soát, không hoàn tiền ngay"]

  - id: L03
    title: "Kiến trúc Streaming với ksqlDB và Kafka: Omnichannel Notification Hub"
    spec: lessons/acb/L03_streaming_ksqldb_notification_hub.yaml
    requires: [L00, L01]
    requires_ext: ["PYT:L00", "PYT:L01", "PYT:L02", "PYT:L03", "PYT:L08"]
    objectives:
      - "Mô tả đường đi của một biến động số dư: bắt thay đổi từ sổ cái, đẩy vào Kafka, nối luồng với bảng hồ sơ, rồi chọn kênh gửi"
      - "Đọc câu ksqlDB nối luồng với bảng (nối trái, CASE, EMIT CHANGES) và chạy mô phỏng cùng lôgic chọn kênh bằng Python"
      - "Tính lưu lượng mỗi giây, số tin đi kênh có cước và phần tiết kiệm khi định tuyến thông minh"
      - "Chạy mô phỏng hàng đợi ưu tiên: mã OTP luôn ra trước tin quảng cáo"
      - "Chọn cách xử lý khi nhà mạng lỗi: cầu dao chuyển nhà mạng dự phòng, hàng đợi ưu tiên cho OTP"
      - "Nhận ra ba sai lầm: gộp OTP với quảng cáo, thiếu hàng đợi tin lỗi, không giới hạn tốc độ bằng xô thẻ"
      - "So sánh ×1, ×100 và ×10 000: tin mỗi giây, số tiến trình song song và số khoá chống trùng trong 24 giờ"
      - "Viết mã Python chọn kênh, xếp hàng ưu tiên và giới hạn tốc độ bằng xô thẻ với số mới"
    example: "Tính toán tối ưu hóa chi phí và hiệu năng chuyển phát (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào); mã Python mô phỏng, lab và quy mô ×1, ×100, ×10 000 do audit/acb/verify_acb.py chạy lại"
    fix: ["Không gọi trực tiếp sang cổng nhà mạng mà dùng hàng đợi đệm kết hợp Circuit Breaker tự động failover"]

  - id: L04
    title: "Sàn Chuyển nhượng Hợp đồng Tiền gửi: Khoá Lạc quan và Máy Trạng thái T24"
    spec: lessons/acb/L04_san_chuyen_nhuong_hop_dong_tien_gui.yaml
    requires: [L00, L01]
    requires_ext: ["PYT:L00", "PYT:L01", "PYT:L02", "PYT:L03", "PYT:L08", "FND:L08"]
    objectives:
      - "Mô tả nghiệp vụ chuyển nhượng hợp đồng tiền gửi và vì sao hai người mua cùng lúc gây xung đột"
      - "Thiết kế câu cập nhật có điều kiện (khoá lạc quan) và đọc số dòng tác động để biết ai thắng"
      - "Chạy mô phỏng hai người mua cùng lúc bằng sqlite: người thắng nhận một dòng, người thua nhận không dòng và mã 409"
      - "Mô tả máy trạng thái của lệnh chuyển nhượng và hai bản tin OFS kiểm tra rồi đổi chủ sở hữu"
      - "Chọn cách xử lý khi T24 hết giờ: chuyển sang HOLD, tra sổ cái, không hoàn tiền ngay"
      - "Nhận ra ba sai lầm: giữ khoá bi quan lúc chờ người dùng, bỏ qua số dòng tác động, huỷ lệnh khi hết giờ"
      - "So sánh khoá bi quan với khoá lạc quan khi số người mua cùng lúc là ×1, ×100 và ×10 000"
      - "Viết mã Python và sqlite làm cập nhật có điều kiện theo số phiên bản và máy trạng thái với số mới"
    example: "Quy trình xử lý xung đột đồng thời và chuyển đổi trạng thái (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào); mã Python mô phỏng, lab và quy mô ×1, ×100, ×10 000 do audit/acb/verify_acb.py chạy lại"
    fix: ["Không dùng khoá cưỡng bức làm nghẽn bảng dữ liệu mà kiểm tra phiên bản dữ liệu tại thời điểm ghi"]

  - id: L05
    title: "Cổng Chi lương theo lô Doanh nghiệp và Sao kê Divide-and-Conquer"
    spec: lessons/acb/L05_cong_chi_luong_va_sao_ke_divide_conquer.yaml
    requires: [L00, L01, L03]
    requires_ext: ["PYT:L00", "PYT:L01", "PYT:L02", "PYT:L03"]
    objectives:
      - "Mô tả mẫu Transactional Outbox: ghi nghiệp vụ và sự kiện trong một giao dịch rồi bắt thay đổi đẩy sang Kafka"
      - "Chạy mô phỏng bảng khoá để thấy hai tiến trình xin khoá ngược thứ tự chờ nhau thành vòng, còn xin theo thứ tự tăng dần thì không"
      - "Đọc thủ tục khoá hàng có thứ tự trong PL/SQL và nêu vì sao Oracle báo ORA-00060"
      - "Tính tiết kiệm của gom nhóm: số lần chuyển ngữ cảnh khi cập nhật từng dòng và khi dùng FORALL"
      - "Chia khoảng sao kê thành đoạn, tính tổng phát sinh từng đoạn rồi ghép số dư đầu đoạn"
      - "Chọn cách khởi động lại lô khi mất điện giữa chừng: chỉ làm lệnh chưa hoàn tất, tra soát lệnh dở"
      - "Nhận ra ba sai lầm: gọi mạng tuần tự từng người, khoá không thứ tự, quét cạn bảng chính để lập sao kê"
      - "So sánh ×1, ×100 và ×10 000: số lệnh, thời gian tuần tự và theo khối, chỗ nghẽn khi mọi lệnh trừ cùng một tài khoản"
      - "Viết mã Python sắp thứ tự khoá, kiểm vòng chờ và ghép số dư đầu đoạn với số mới"
    example: "Minh họa cơ chế ngăn Deadlock và Kỹ thuật Divide-and-Conquer (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào); mã Python mô phỏng, lab và quy mô ×1, ×100, ×10 000 do audit/acb/verify_acb.py chạy lại"
    fix: ["Không duyệt vòng lặp đơn lẻ gây nghẽn mạng mà gom nhóm dữ liệu và khoá hàng theo thứ tự xác định"]

  - id: L06
    title: "Xác thực Sinh trắc học (ngưỡng 10 và 20 triệu chưa đọc nguyên văn) và Bảo mật Giao dịch Trực tuyến"
    spec: lessons/acb/L06_sinh_trac_hoc_qd2345_va_bao_mat_ngan_hang.yaml
    requires: [L00, L01, L02, L03]
    requires_ext: ["PYT:L00", "PYT:L01", "PYT:L02", "PYT:L03", "PYT:L08"]
    objectives:
      - "Nêu quy tắc ngưỡng sinh trắc học: trên 10 triệu một lần hoặc tổng ngày vượt 20 triệu, như báo chí nêu, có nơi gắn Thông tư 50/2024 (đã được sửa đổi bởi Thông tư 77/2025), có nơi gắn Quyết định 2345; chưa đọc nguyên văn, không nêu số điều"
      - "Áp quy tắc ngưỡng vào chuỗi giao dịch trong ngày bằng mã Python mô phỏng và chỉ ra giao dịch nào phải quét mặt"
      - "Mô tả vé xác thực sinh trắc học: các trường, chữ ký, hạn 3 phút và chỉ dùng một lần"
      - "Chạy mô phỏng kiểm vé: chữ ký đúng, tiền bị sửa, vé hết hạn, vé dùng lại"
      - "Chọn thứ tự đúng trong luồng SAGA: kiểm sinh trắc học trước, trừ tiền sau, từ chối lệnh gọi thẳng khi thiếu vé"
      - "Nhận ra ba sai lầm: quét mặt sau khi trừ tiền, dùng lại vé, thiếu thử lại có giới hạn và đường dự phòng"
      - "So sánh ×1, ×100 và ×10 000: số lượt quét mặt mỗi giây, số vé còn hạn cùng lúc và số vé đã dùng cần nhớ"
      - "Viết mã Python kiểm ngưỡng có cộng dồn trong ngày và kiểm vé với số mới"
    example: "Quy trình xác thực giao dịch năm mươi triệu đồng thực tế (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào); mã Python mô phỏng, lab và quy mô ×1, ×100, ×10 000 do audit/acb/verify_acb.py chạy lại"
    fix: ["Không gọi sinh trắc học sau khi đã trừ tiền mà kiểm tra thành công trước khi phát lệnh hạch toán"]

  - id: L07
    title: "Thu hộ qua Tài khoản Định danh và Đối soát 3 Bên"
    spec: lessons/acb/L07_tai_khoan_dinh_danh_va_doi_soat_ba_ben.yaml
    requires: [L00, L01, L02, L04]
    requires_ext: ["PYT:L00", "PYT:L01", "PYT:L02", "PYT:L03", "PYT:L08"]
    objectives:
      - "Phân biệt tài khoản ảo tĩnh và động, và tách số tài khoản ảo thành tiền tố đối tác và mã đơn"
      - "Mô tả bốn bước từ nhận tiền, ghi có, gửi webhook đến đối soát cuối ngày"
      - "Tính mã HMAC-SHA256 cho gói webhook và kiểm lại phía nhận: nội dung bị sửa thì mã lệch"
      - "Chạy mô phỏng nhận webhook gửi lại: lần hai cùng mã sự kiện không gạch nợ thêm"
      - "Chạy đối soát hai danh sách đã sắp xếp bằng hai con trỏ và đọc cách phân loại mã lệch khi mở rộng ra ba nguồn"
      - "Chọn cách xử lý khi webhook lỗi: thử lại lùi dần, mã sự kiện, hàng đợi thư lỗi"
      - "Nhận ra ba sai lầm: tra tài khoản ảo bằng hàm cắt chuỗi, webhook không có mã xác thực, đối soát bằng vòng lặp lồng nhau"
      - "So sánh vòng lặp lồng nhau với sắp xếp rồi trộn ở ×1, ×100 và ×10 000 bản ghi"
      - "Viết mã Python kiểm HMAC, nhận webhook theo mã sự kiện và đối soát ba nguồn với số mới"
    example: "Bốn bước từ Nhận tiền, Ghi Có đến Đối soát Two-Pointer (mọi số liệu hiệu năng trong bài là ví dụ minh hoạ, không phải số đo của ngân hàng nào); mã Python mô phỏng, lab và quy mô ×1, ×100, ×10 000 do audit/acb/verify_acb.py chạy lại"
    fix: ["Không đối soát bằng vòng lặp quét bảng lồng nhau gây nghẽn RAM mà sắp xếp trước rồi duyệt con trỏ tịnh tiến"]

  - id: L08
    title: "Tín dụng bán lẻ: Thấu chi Sổ tiết kiệm và Cổng CIC"
    spec: lessons/acb/L08_squad_lending_tich_hop_cic_giai_ngan.yaml
    requires: [L00, L01, L02]
    requires_ext: ["PYT:L00", "PYT:L01", "PYT:L02", "PYT:L03", "PYT:L07", "PYT:L08", "FND:L08"]
    objectives:
      - "Tính hạn mức thấu chi theo tỉ lệ cấp vốn (LTV) và tiền lãi theo số ngày thực tế"
      - "Mô tả quy trình phong tỏa hai pha: khoá sổ trước, cấp hạn mức sau, nhả khoá nếu bước hai hỏng"
      - "Chạy mô phỏng quy trình hai pha và giải ngân hai lần cùng khoá lũy đẳng với ràng buộc duy nhất"
      - "Mô tả luồng LOS, ký số Cloud CA và tra cứu Cổng CIC qua mTLS"
