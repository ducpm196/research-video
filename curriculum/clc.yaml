# Giáo án KẾ HOẠCH — CLC · Điện toán đám mây
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã CLC:Lxx (ipaddress của Python, đánh giá chính sách tự cài, phép tính chi phí).
# Căn cứ phạm vi: NIST SP 800-145, The NIST Definition of Cloud Computing (2011) — năm đặc tính, ba mô hình dịch vụ; CS2023 SF, NC, SEC;
#   tài liệu AWS (5 địa chỉ dự trữ mỗi mạng con; “designed for 99.999999999% durability” của lưu trữ đối tượng; logic đánh giá chính sách:
#   từ chối tường minh thắng) và AWS Well-Architected Framework (6 trụ cột) — đọc theo bản hiện hành, tên nhà cung cấp chỉ trên màn hình;
#   mọi đơn giá trong ví dụ là SỐ MINH HOẠ (giá thật thay đổi theo vùng và thời điểm).
# Vì sao cần: CLD dạy container, Kubernetes, microservice; DVO dạy hạ tầng dạng mã; SAR dạy kiến trúc. Còn thiếu nền ĐÁM MÂY: mô hình dịch vụ,
#   trách nhiệm chia sẻ, vùng, mạng ảo, định danh và quyền, các loại lưu trữ, hàm theo sự kiện, chi phí, khôi phục thảm hoạ, di chuyển.
# Thứ tự học: sau NET L05–L06, SEC L04, L07, L14, CLD L01–L08, DVO L05.
course: CLC
status: planned
lessons:
  - id: L00
    title: "Đám mây là gì: năm đặc tính, mô hình dịch vụ, trách nhiệm chia sẻ"
    spec: lessons/clc/L00_dam_may_la_gi.yaml
    requires: []
    requires_ext: ["OSY:L00", "CLD:L01"]
    objectives: ["Nêu năm đặc tính của điện toán đám mây", "Phân biệt hạ tầng, nền tảng, phần mềm như dịch vụ và hàm theo sự kiện", "Xác định phần trách nhiệm của khách hàng"]
    example: "máy ảo: khách vá hệ điều hành; cơ sở dữ liệu được quản lý: nhà cung cấp vá, khách vẫn lo quyền truy cập và dữ liệu — cấu hình sai quyền luôn là trách nhiệm của khách"
    fix: ["Đưa lên đám mây không chuyển hết trách nhiệm an toàn cho nhà cung cấp"]
  - id: L01
    title: "Vùng, vùng sẵn sàng và thiết kế chịu lỗi"
    spec: lessons/clc/L01_vung_san_sang.yaml
    requires: [L00]
    requires_ext: ["SAR:L06"]
    objectives: ["Giải thích miền lỗi: vùng và vùng sẵn sàng", "Tính độ sẵn sàng khi dự phòng qua nhiều vùng sẵn sàng", "Nhận ra phụ thuộc chung làm dự phòng vô hiệu"]
    example: "mỗi vùng sẵn sàng 99,5%, hỏng độc lập: chạy song song ở 2 vùng → 1 − 0,005² = 99,9975% (VER CLC:L01)"
    fix: ["Hỏng không độc lập khi phụ thuộc chung (cùng cấu hình sai, cùng dịch vụ điều khiển của vùng) — dự phòng không cứu được lỗi chung"]
  - id: L02
    title: "Mạng ảo: dải địa chỉ, mạng con, bảng định tuyến, cổng ra Internet"
    spec: lessons/clc/L02_mang_ao.yaml
    requires: [L00]
    requires_ext: ["NET:L05", "NET:L06"]
    objectives: ["Chia dải địa chỉ thành mạng con", "Phân biệt mạng con công khai và riêng", "Lập kế hoạch dải để không trùng"]
    example: "10.0.0.0/16 chia thành mạng con /24: 256 mạng con, mỗi mạng 256 địa chỉ, nhà cung cấp giữ 5 → 251 địa chỉ dùng được (ipaddress, VER CLC:L02)"
    fix: ["Chọn dải địa chỉ trùng với văn phòng hay mạng khác thì sau này không nối được — lập kế hoạch dải trước"]
  - id: L03
    title: "Định danh và quyền truy cập: chính sách, vai trò, từ chối tường minh"
    spec: lessons/clc/L03_dinh_danh_quyen.yaml
    requires: [L00]
    requires_ext: ["SEC:L04", "OSY:L14"]
    objectives: ["Đánh giá một yêu cầu theo tập chính sách", "Áp dụng đặc quyền tối thiểu", "Dùng vai trò tạm thời thay cho khoá dài hạn"]
    example: "chính sách 1 cho phép mọi thao tác trên kho “bao-cao”, chính sách 2 từ chối xoá: yêu cầu đọc → cho; xoá → từ chối (từ chối tường minh thắng); ghi kho khác → từ chối (mặc định) (VER CLC:L03)"
    fix: ["Khoá truy cập dài hạn nằm trong mã nguồn là kiểu rò rỉ rất hay gặp — dùng vai trò và thông tin xác thực tạm thời"]
  - id: L04
    title: "Lưu trữ: đối tượng, khối, tệp và độ bền"
    spec: lessons/clc/L04_luu_tru.yaml
    requires: [L00]
    requires_ext: ["OSY:L12", "SEC:L14"]
    objectives: ["Chọn loại lưu trữ theo mẫu truy cập", "Hiểu đúng con số độ bền", "Biết độ bền không thay được sao lưu"]
    example: "độ bền thiết kế 99,999999999% mỗi năm cho 10 triệu đối tượng → kỳ vọng mất 10⁷ · 10⁻¹¹ = 10⁻⁴ đối tượng mỗi năm (một đối tượng mỗi 10 000 năm) (VER CLC:L04)"
    fix: ["Độ bền không chống được XOÁ NHẦM hay mã độc — vẫn cần phiên bản hoá và sao lưu tách quyền"]
  - id: L05
    title: "Máy ảo, co giãn và cách trả tiền: theo giờ, đặt trước, giá rẻ có thể bị thu hồi"
    spec: lessons/clc/L05_may_ao_chi_phi.yaml
    requires: [L00]
    requires_ext: ["CLD:L07", "CLD:L08"]
    objectives: ["Tính điểm hoà vốn giữa trả theo giờ và đặt trước", "Biết loại tải nào chạy được trên máy có thể bị thu hồi", "Dùng co giãn theo tải"]
    example: "theo giờ 0,10 đô la mỗi giờ, đặt trước 1 năm 500 đô la (số minh hoạ): hoà vốn ở 5000 giờ ≈ 57% thời gian trong năm — tải chạy ít hơn thì trả theo giờ rẻ hơn; co giãn 6 máy trong 10 giờ cao điểm, 2 máy trong 14 giờ còn lại: 88 thay vì 144 giờ máy mỗi ngày (≈ 38,9% ít hơn) (VER CLC:L05)"
    fix: ["Đặt trước cho tải không ổn định là trả tiền cho máy ngồi không"]
  - id: L06
    title: "Hàm theo sự kiện: khởi động lạnh, giới hạn và mô hình chi phí"
    spec: lessons/clc/L06_ham_theo_su_kien.yaml
    requires: [L05]
    requires_ext: ["CLD:L10"]
    objectives: ["Tính chi phí theo số lần gọi và GB-giây", "Giải thích khởi động lạnh và cách giảm", "Biết khi nào máy chạy liên tục rẻ hơn"]
    example: "1 triệu lần gọi, mỗi lần 200 ms với 0,5 GB bộ nhớ: 10⁶ · 0,2 · 0,5 = 100 000 GB-giây (VER CLC:L06)"
    fix: ["Hàm theo sự kiện rẻ khi tải thưa; tải đều và cao thì máy chạy liên tục thường rẻ hơn"]
  - id: L07
    title: "Cơ sở dữ liệu được quản lý: bản sao, khôi phục theo thời điểm, RPO và RTO"
    spec: lessons/clc/L07_csdl_duoc_quan_ly.yaml
    requires: [L04]
    requires_ext: ["DBS:L14", "DSY:L03"]
    objectives: ["Định nghĩa điểm khôi phục mục tiêu và thời gian khôi phục mục tiêu", "Chọn cấu hình sao lưu theo mục tiêu", "Phân biệt bản sao với bản sao lưu"]
    example: "chụp nhanh mỗi ngày + đẩy nhật ký mỗi 5 phút → mất tối đa 5 phút dữ liệu; chỉ chụp nhanh mỗi ngày → mất tới 24 giờ (VER CLC:L07)"
    fix: ["Bản sao đọc không phải bản sao lưu — lệnh xoá nhầm được sao chép sang ngay lập tức"]
  - id: L08
    title: "Chi phí đám mây: dữ liệu ra ngoài, gắn nhãn, chi phí trên một đơn vị"
    spec: lessons/clc/L08_chi_phi.yaml
    requires: [L05, L06]
    requires_ext: ["SAR:L02"]
    objectives: ["Ước lượng chi phí truyền dữ liệu ra ngoài", "Gắn nhãn để biết ai tiêu tiền", "Theo dõi chi phí trên một người dùng hay một giao dịch"]
    example: "50 TB (1 TB = 1024 GB như nhiều bảng giá) ra Internet mỗi tháng, 0,09 đô la mỗi GB (số minh hoạ): 50 · 1024 · 0,09 ≈ 4608 đô la — thường bị quên khi so với tiền máy (VER CLC:L08)"
    fix: ["Không gắn nhãn tài nguyên thì không biết ai tiêu tiền — gắn nhãn từ ngày đầu"]
  - id: L09
    title: "Bảo vệ dữ liệu trên đám mây: mã hoá khi lưu, quản lý khoá, mã hoá phong bì"
    spec: lessons/clc/L09_ma_hoa_phong_bi.yaml
    requires: [L03, L04]
    requires_ext: ["SEC:L07"]
    objectives: ["Giải thích mã hoá phong bì", "Giải thích vì sao xoay khoá chính không cần mã hoá lại dữ liệu", "Biết giới hạn của mã hoá khi lưu"]
    example: "1 TB dữ liệu chia 10 000 khoá dữ liệu 32 byte: xoay khoá chính rồi bỏ khoá cũ chỉ mã hoá lại 10 000 · 32 = 320 000 byte khoá, không chạm 1 TB dữ liệu; xoay tự động ở một nhà cung cấp lớn còn giữ khoá cũ nên không làm lại phong bì nào (VER CLC:L09)"
    fix: ["Mã hoá khi lưu không bảo vệ khi ai đó có quyền ĐỌC qua dịch vụ — quyền truy cập vẫn là lớp chính"]
  - id: L10
    title: "Khôi phục thảm hoạ nhiều vùng: sao lưu–khôi phục, chờ sẵn, chủ động–chủ động"
    spec: lessons/clc/L10_khoi_phuc_tham_hoa.yaml
    requires: [L01, L07]
    requires_ext: ["SAR:L10"]
    objectives: ["So bốn chiến lược theo thời gian khôi phục và chi phí", "Tính dung lượng thường trực của chủ động–chủ động", "Diễn tập chuyển vùng"]
    example: "chạy chủ động–chủ động ở 2 vùng, mỗi vùng phải gánh được 100% tải khi vùng kia hỏng → dung lượng thường trực gấp đôi (VER CLC:L10)"
    fix: ["Kế hoạch chuyển vùng chưa diễn tập là kế hoạch chưa có"]
  - id: L11
    title: "Tổng hợp: đưa một ứng dụng lên đám mây theo các trụ cột kiến trúc tốt"
    spec: lessons/clc/L11_tong_hop_di_chuyen.yaml
    requires: [L08, L09, L10]
    requires_ext: ["SAR:L12", "DVO:L05"]
    objectives: ["Chọn chiến lược di chuyển cho từng thành phần", "Rà thiết kế theo sáu trụ cột", "Thấy vì sao chuyển nguyên trạng thường đắt"]
    example: "ứng dụng 3 thành phần: cơ sở dữ liệu chuyển sang dịch vụ được quản lý, máy chủ ứng dụng chuyển nguyên sang máy ảo trước, tác vụ xử lý ảnh viết lại thành hàm theo sự kiện; tầng ứng dụng 438 đô la/tháng giảm còn 216,4 (−50,6%, số minh hoạ) (VER CLC:L11)"
    fix: ["Chuyển nguyên trạng lên đám mây thường ĐẮT hơn tại chỗ — lợi ích đến khi dùng co giãn và dịch vụ được quản lý"]
  - id: L12
    title: "Tình huống chuyên gia theo dòng thời gian: kho lưu trữ đối tượng từ 2006 tới 2022"
    spec: lessons/clc/L12_hanh_trinh_luu_tru_doi_tuong.yaml
    requires: [L01, L04, L07, L10]
    see_also: ["CAS:L06", "DSY:L04"]
    kind: journey
    objectives: ["Kể lại hành trình của kho lưu trữ đối tượng qua năm chặng từ 2006 tới 2022, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại thời gian ngừng của sự cố 2017, ngân sách ngừng của độ sẵn sàng 99,99% và hệ số tăng trưởng số đối tượng", "Chọn cách bảo vệ một kịch bản vận hành và chỗ đặt trang trạng thái hợp với quy mô của mình, kèm điều kiện đổi lựa chọn"]
    example: "sự cố 28/2/2017: 9:37 → 13:54 = 257 phút = 4 giờ 17 phút (S17); ngân sách ngừng 99,99% mỗi năm = 525 600 · 0,0001 = 52,56 phút → 257 phút ≈ 4,9 năm ngân sách; 800 triệu (ngay sau 2006) → 200 nghìn tỉ đối tượng (2022) = ×250 000 (PI22) (VER CLC:L12)"
    fix: ["Chỉ khẳng định điều có trong PR06, B13, S17, W20, B20, B21, PI22 (audit/clc/sources_L12.md); độ dài cửa sổ nhất quán cuối cùng trước 2020 không có trong nguồn — 1% đọc thấy bản cũ là số minh hoạ", "Số máy bị gỡ, mức tối thiểu, số ô năm 2017 không có trong nguồn — 100 máy, tối thiểu 80, 10 ô là số minh hoạ; không nêu tên người vận hành", "Năm bắt đầu chia ô không có trong nguồn (chỉ “As S3 has scaled”) — không gán năm"]
