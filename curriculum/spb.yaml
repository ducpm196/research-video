# Giáo án Khoá SPB · Spring Boot thực chiến với PostgreSQL, Redis và Kafka (13 bài, 2026-11-24)
# Căn cứ phạm vi (plan_AF5_20261123T0110Z.md §5.4, §6 WP-3A, §10 JD):
#   BNK/BNX dạy khái niệm bằng mô phỏng; SPB xây một dịch vụ chuyển khoản Spring Boot 4.1.3 + Java 21 chạy thật lớn dần qua 13 mốc (L00 → L12).
#   Phiên bản công cụ & digest Docker ghim ở labs/SPB/VERSIONS.md (quy tắc D-11 / BN-14).
#   Mọi số liệu ví dụ và kiểm thử chạy thật qua ./mvnw -B verify và ghi vào audit/spb/verify_spb.py.
course: SPB
profile: stem
status: active
lab:
  lang:
  - java
  requires:
  - JVA:L12
  - BNX:L13
lessons:
- id: L00
  title: Cài đặt và chạy thử Spring Boot 4.1 với JDK 21, Maven Wrapper và Docker
  spec: lessons/spb/L00_cai_dat_chay_thu_spring_boot_4.yaml
  requires: []
  requires_ext:
  - BNK:L02
  - BNX:L26
  - BNX:L13
  objectives:
  - Kiểm tra môi trường thật gồm JDK 21, Maven Wrapper và Docker Desktop với kết quả đối chiếu
  - Dựng dự án Spring Boot 4.1.3 nền tảng, đọc cấu trúc gói và nhật ký khởi động
  - Phân biệt các thay đổi chính từ Spring Boot 2 sang 3 và 4 qua mô-đun hoá starter
  - Đo thời gian dựng lần đầu so với lần chạy đệm khi số tệp nguồn tăng ở 1, 50 và 500 lớp
  example: Maven Wrapper 3.10.1 + JDK 21.0.13 + Spring Boot 4.1.3 biên dịch và chạy 1 ca kiểm thử thành công; Boot 4 đổi starter
    web thành spring-boot-starter-webmvc (VER SPB:L00)
  fix:
  - Dùng lại tên starter cũ spring-boot-starter-web hay RestTemplate của Boot 2/3 trong dự án Boot 4 mà không kiểm cây phụ
    thuộc
- id: L01
  title: Tầng Web với DTO bất biến, kiểm dữ liệu vào và Problem Details
  spec: lessons/spb/L01_rest_controller_dto_validation_problem_details.yaml
  requires:
  - L00
  requires_ext:
  - BNK:L03
  objectives:
  - Thiết kế bộ điều khiển REST với record DTO bất biến và kiểm ràng buộc bằng Bean Validation
  - Trả lỗi chuẩn RFC 9457 Problem Details với mã trạng thái HTTP và trường chi tiết nhất quán
  - So sánh kích thước tải và số lần phân tích khi dữ liệu lỗi bị chặn sớm ở tầng vào ở 100, 10 000 và 1 000 000 yêu cầu
  example: POST /api/v1/transfers với số tiền 0 hoặc âm trả về 400 application/problem+json; yêu cầu hợp lệ trả 201 với mã
    giao dịch (VER SPB:L01)
  fix:
  - Dùng thực thể cơ sở dữ liệu trực tiếp làm DTO đầu vào hoặc tự chế JSON lỗi không theo RFC 9457
- id: L02
  title: Tầng dịch vụ, tiêm phụ thuộc và giao dịch lan truyền hoàn tác
  spec: lessons/spb/L02_tang_dich_vu_di_transactional.yaml
  requires:
  - L01
  requires_ext:
  - BNX:L25
  objectives:
  - Cấu trúc tầng dịch vụ tiêm phụ thuộc qua hàm dựng bất biến thay vì tiêm thẳng lên trường
  - Chọn mức lan truyền REQUIRED và REQUIRES_NEW cùng thuộc tính rollbackFor cho ngoại lệ kiểm tra
  - Đo số kết nối bể giữ đồng thời khi giao dịch lồng nhau ở 5, 50 và 500 luồng
  example: Chuyển tiền lỗi giữa chừng hoàn tác giao dịch chính nhưng nhật ký tra soát dùng REQUIRES_NEW vẫn lưu được 1 bản
    ghi (VER SPB:L02)
  fix:
  - Để lời gọi nội bộ bỏ qua proxy giao dịch hoặc quên rollbackFor khiến lỗi nghiệp vụ không hoàn tác
- id: L03
  title: Spring Data JPA, PostgreSQL trên Docker, Flyway và sửa lỗi 1+N
  spec: lessons/spb/L03_spring_data_jpa_postgresql_flyway_n_cong_1.yaml
  requires:
  - L02
  requires_ext:
  - BNX:L24
  - BNX:L28
  objectives:
  - Viết tệp di trú lược đồ Flyway V1 chạy trên PostgreSQL 17 thật kèm chỉ mục khoá chính và khoá ngoại
  - Đo số câu SQL phát sinh của vấn đề 1+N khi đọc danh sách tài khoản và sửa bằng EntityGraph/JOIN FETCH
  - Tính tổng lượt khứ hồi mạng giữa ứng dụng và PostgreSQL ở 10, 1 000 và 100 000 tài khoản
  example: '20 tài khoản kèm nhật ký: tải lười phát sinh 21 câu SQL, dùng JOIN FETCH rút gọn còn đúng 1 câu trên PostgreSQL
    17 (VER SPB:L03)'
  fix:
  - Tắt sinh DDL tự động của Hibernate mà quên quản lý phiên bản lược đồ bằng Flyway hoặc dùng EAGER che giấu N+1
- id: L04
  title: Sổ cái bút toán kép, khoá bi quan, khoá lạc quan và Idempotency-Key
  spec: lessons/spb/L04_but_toan_kep_khoa_bi_quan_luy_dang.yaml
  requires:
  - L03
  requires_ext:
  - BNK:L09
  - BNK:L05
  objectives:
  - Cài đặt giao dịch bút toán kép hai dòng nợ có có tổng đại số bằng không trong một lần chốt
  - Chọn khoá bi quan PESSIMISTIC_WRITE theo thứ tự mã tăng dần so với khoá lạc quan dùng cột Version
  - Chặn trừ tiền hai lần bằng bảng Idempotency-Key có ràng buộc UNIQUE trên PostgreSQL
  - Đo số giao dịch thất bại do xung đột khoá lạc quan khi tỉ lệ tranh chấp tăng 2, 20 và 200 luồng
  example: 'Gửi lặp 2 lần cùng Idempotency-Key cho chuyển 300 000: số dư trừ đúng 1 lần, phản hồi trả lại cùng mã chuẩn và
    tổng mọi dòng bút toán = 0 (VER SPB:L04)'
  fix:
  - Khoá tài khoản ngược thứ tự gây bế tắc hoặc kiểm khoá lũy đẳng chỉ ở bộ nhớ RAM mà không lưu ràng buộc UNIQUE
- id: L05
  title: Redis thực chiến với cache-aside, TTL, vô hiệu đệm và chống dồn tải
  spec: lessons/spb/L05_redis_cache_aside_ttl_vo_hieu_don_tai.yaml
  requires:
  - L04
  requires_ext:
  - BNK:L06
  - BNX:L19
  objectives:
  - Cài đặt mẫu đọc cache-aside kèm hạn sống TTL ngẫu nhiên nhẹ và xoá khoá đệm khi cập nhật số dư
  - Chống dồn tải khi khoá nóng hết hạn bằng khoá phân tán SET NX EX hoặc đồng bộ tại chỗ
  - Đo số truy vấn lọt xuống cơ sở dữ liệu khi bộ đệm sập ở 100, 10 000 và 100 000 yêu cầu đồng thời
  example: Đọc lần 1 trúng DB rồi ghi Redis với TTL 30 giây, đọc lần 2 trúng đệm; cập nhật số dư xoá sạch khoá cũ tránh trả
    số sai (VER SPB:L05)
  fix:
  - Cập nhật cơ sở dữ liệu nhưng quên vô hiệu hoá khoá Redis hoặc đặt TTL đồng loạt gây bão hết hạn
- id: L06
  title: Kafka Outbox, thử lại không chặn, hàng thư chết và so sánh JMS
  spec: lessons/spb/L06_kafka_outbox_thu_lai_dlt_jms.yaml
  requires:
  - L05
  requires_ext:
  - BNK:L07
  - BNK:L08
  - BNX:L10
  objectives:
  - Lưu đơn chuyển khoản cùng bản ghi Outbox trong một giao dịch cơ sở dữ liệu trước khi phát lên Kafka
  - Cấu hình thử lại không chặn với lùi hàm mũ và chuyển bản tin hỏng sang chủ đề DLT bằng RetryableTopic
  - Phân biệt cơ chế giữ nhật ký đọc lại của Kafka với mô hình xoá sau xác nhận của RabbitMQ và ActiveMQ JMS
  - Đo độ trễ hàng đợi khi tỉ lệ lỗi độc tố tăng từ 0,1% lên 10% ở 1 000, 100 000 và 1 000 000 thông điệp
  example: Gửi sự kiện hợp lệ tới chủ đề transfer.events nhận thành công; thông điệp lỗi 3 lần tự chuyển sang transfer.events-dlt
    (VER SPB:L06)
  fix:
  - Gửi trực tiếp lên Kafka bên trong hàm đang giữ giao dịch DB khiến mất hoặc thừa sự kiện khi giao dịch hoàn tác
- id: L07
  title: OpenAPI sinh tự động, thiết kế tài nguyên và phiên bản hoá
  spec: lessons/spb/L07_openapi_springdoc_api_tai_nguyen_phien_ban.yaml
  requires:
  - L06
  requires_ext:
  - BNX:L01
  objectives:
  - Tích hợp springdoc-openapi sinh đặc tả chuẩn OpenAPI 3 và chú thích mã phản hồi cho mọi đầu cuối
  - Áp dụng thiết kế API hướng tài nguyên danh từ, phân trang con trỏ và chiến lược phiên bản URI v1/v2 giữ tương thích ngược
  - Kiểm tính tương thích ngược giữa hai phiên bản lược đồ khi mở rộng ở 1, 10 và 100 đối tác tích hợp
  example: GET /v3/api-docs trả về đặc tả JSON chứa đầy đủ đường dẫn /api/v1/transfers, mã 201 và 400 ProblemDetail (VER SPB:L07)
  fix:
  - Đổi tên hay thêm trường bắt buộc trực tiếp trên hợp đồng v1 đang chạy sản xuất thay vì nâng cấp tương thích ngược
- id: L08
  title: Spring Security JWT phi trạng thái, RBAC và chống OWASP
  spec: lessons/spb/L08_spring_security_jwt_phan_quyen_owasp.yaml
  requires:
  - L07
  requires_ext:
  - BNX:L03
  - BNX:L04
  - BNX:L17
  objectives:
  - Cấu hình bộ lọc bảo mật phi trạng thái xác thực chữ ký HMAC cho mã truy cập và phân quyền theo vai trò
  - Phòng chống năm lỗ hổng OWASP phổ biến trên backend Java gồm truy cập chéo đối tượng BOLA và lộ dữ liệu lỗi
  - Đo tỉ lệ từ chối hợp lệ ở cửa bảo mật khi lưu lượng tấn công dò quyền tăng 10, 1 000 và 100 000 yêu cầu
  example: Không có thẻ trả 401; vai trò VIEWER gọi lệnh chuyển khoản trả 403; vai trò TELLER được phép trả 201 (VER SPB:L08)
  fix:
  - Quên bật chặn BOLA kiểm tra chủ sở hữu tài khoản ở tầng dịch vụ hoặc trả chi tiết stack trace về máy khách
- id: L09
  title: Kiểm thử đơn vị với JUnit 5, Mockito và lát cắt Web
  spec: lessons/spb/L09_kiem_thu_don_vi_mockito_mockmvc.yaml
  requires:
  - L08
  requires_ext:
  - BNX:L18
  objectives:
  - Cô lập kiểm thử nghiệp vụ chuyển khoản bằng Mockito xác minh thứ tự gọi và kịch bản thiếu số dư
  - Kiểm thử hợp đồng HTTP, kiểm dữ liệu vào và mã phản hồi JSON trên MockMvc không cần khởi động toàn cụm
  - Tính thời gian phản hồi bộ kiểm thử tháp kiểm thử ở 10, 200 và 2 000 ca đơn vị so với tích hợp nặng
  example: Bộ kiểm 6 ca JUnit 5 + MockMvc xác minh chuyển đúng, hoàn tác khi lỗi và chặn quyền dưới 3 giây (VER SPB:L09)
  fix:
  - Dùng giả lập chằng chịt đến mức bài kiểm vẫn xanh dù câu truy vấn SQL hoặc cấu hình bảo mật thực tế đã gãy
- id: L10
  title: Kiểm thử tích hợp toàn luồng với PostgreSQL, Redis và Kafka
  spec: lessons/spb/L10_kiem_thu_tich_hop_testcontainers.yaml
  requires:
  - L09
  requires_ext: []
  objectives:
  - Cấu hình Testcontainers với ServiceConnection ghim digest PostgreSQL, Redis và Kafka thật
  - Viết ca kiểm xuyên suốt từ API HTTP tới bảng bút toán PostgreSQL, xoá đệm Redis và bản tin Kafka
  - Đo chi phí thời gian khởi tạo container dùng chung giữa 1, 10 và 50 lớp kiểm thử tích hợp
  example: Một lệnh chuyển khoản tạo giao dịch thật trên PostgreSQL 17, làm sạch đệm Redis 8 và ghi nhận sự kiện trên Kafka
    3.9 (VER SPB:L10)
  fix:
  - Dùng cơ sở dữ liệu bộ nhớ H2 thay cho PostgreSQL thật ở bước kiểm thử cuối khiến bỏ sót lỗi cú pháp khoá hàng thật
- id: L11
  title: Quan sát hệ thống với nhật ký JSON, MDC, OpenTelemetry và Prometheus
  spec: lessons/spb/L11_quan_sat_json_log_otel_actuator_prometheus.yaml
  requires:
  - L10
  requires_ext:
  - BNX:L31
  objectives:
  - Bổ sung bộ lọc gắn mã tương quan MDC vào nhật ký cấu trúc JSON xuyên qua đầu cuối HTTP
  - Bật Spring Boot Actuator và chỉ số Prometheus đếm tỉ lệ chuyển khoản thành công và bị từ chối
  - Tính số chuỗi thời gian sinh ra khi gắn nhãn đúng quy tắc ở 1, 1 000 và 100 000 giao dịch
  example: Đầu cuối /actuator/prometheus xuất chỉ số chuyển khoản theo trạng thái; tiêu đề X-Correlation-Id xuất hiện nguyên
    vẹn trong phản hồi và nhật ký (VER SPB:L11)
  fix:
  - Gắn mã tài khoản hoặc mã giao dịch làm nhãn chỉ số Prometheus làm nổ số chuỗi thời gian
- id: L12
  title: Đóng gói Docker nhiều tầng, JVM trong container và đường ống CI
  spec: lessons/spb/L12_tinh_huong_dockerfile_jvm_ci_mvnw.yaml
  requires:
  - L11
  requires_ext:
  - BNX:L26
  objectives:
  - Thiết kế Dockerfile nhiều tầng tách bước dựng Maven Wrapper khỏi ảnh chạy JRE tối giản
  - Cấu hình bộ nhớ JVM thích ứng giới hạn RAM container và chạy thử đường ống CI bằng ./mvnw -B verify
  - Đánh đổi kích thước ảnh, thời gian khởi động ấm và chi phí bảo mật qua 3 cấu hình triển khai
  example: Ảnh nhiều tầng giảm kích thước từ ~850 MB xuống ~260 MB; MaxRAMPercentage=75 giữ vùng heap an toàn trong container
    512 MiB; ./mvnw -B verify chạy sạch (VER SPB:L12)
  fix:
  - Đóng gói trọn bộ mã nguồn và JDK phát triển vào ảnh chạy sản xuất hoặc đặt heap vượt giới hạn bộ nhớ container gây OOMKilled
