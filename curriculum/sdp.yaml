# Giáo án KẾ HOẠCH — SDP · Kỹ thuật lập trình và mẫu thiết kế
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã SDP:Lxx (2026-10-28).
# Căn cứ phạm vi: CS2023 — Software Development Fundamentals (SDF), Software Engineering (SE: thiết kế, tái cấu trúc),
#   Foundations of Programming Languages (FPL: hướng đối tượng, hàm) (“1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98).
# Nguồn chuyên môn (CITED theo tên tác phẩm, năm): E. Gamma, R. Helm, R. Johnson, J. Vlissides, “Design Patterns” (1994);
#   B. Liskov, J. Wing, “A behavioral notion of subtyping” (1994); R. C. Martin, “Design Principles and Design Patterns” (2000) và
#   “OO Design Quality Metrics” (1994, độ bất ổn I = Ce / (Ca + Ce)); M. Fowler, “Refactoring” (1999; bản 2, 2018);
#   T. McCabe, “A Complexity Measure” (1976); Semantic Versioning 2.0.0 (semver.org).
# Vì sao cần (rà soát 2026-10-28, OBSERVED): chưa giáo án nào dạy hướng đối tượng, nguyên lý SOLID, mẫu thiết kế, tái cấu trúc,
#   xử lý lỗi, thiết kế API — phần nối giữa “viết chương trình đúng” (SWF) và “thiết kế hệ thống” (SAR).
# Nguyên tắc giảng: mỗi nguyên lý / mẫu đi kèm MỘT vấn đề cụ thể nó giải, một ví dụ chạy được có số kiểm bằng máy, và chỗ KHÔNG
#   nên dùng (lạm dụng mẫu là lỗi thường gặp). Mã minh hoạ bằng Python, ý tưởng không phụ thuộc ngôn ngữ.
# Thứ tự học: sau SWF (L00, L06, L08) và PLC (L07, L12); trước SAR.
course: SDP
status: planned
lessons:
  - id: L00
    title: "Hàm nhỏ, tên rõ, độ phức tạp vòng McCabe"
    spec: lessons/sdp/L00_ham_nho_mccabe.yaml
    requires: []
    requires_ext: ["CS112:L00", "SWF:L05"]
    objectives: ["Đặt tên nói đúng ý định", "Tính độ phức tạp vòng và biết nó báo gì về số ca kiểm"]
    example: "hàm có if, for, if … and …: 4 điểm rẽ → độ phức tạp vòng M = 5 (máy đếm trên cây cú pháp, VER SDP:L00)"
    fix: ["M là số đường độc lập — cận dưới số ca kiểm phủ nhánh cơ sở, không phải thước đo “mã đẹp”"]
  - id: L01
    title: "Xử lý lỗi: mã lỗi, ngoại lệ, thất bại sớm"
    spec: lessons/sdp/L01_xu_ly_loi.yaml
    requires: [L00]
    requires_ext: ["SWF:L00"]
    objectives: ["Phân biệt lỗi của người gọi và lỗi môi trường", "Chọn giữa giá trị trả về và ngoại lệ"]
    example: "đọc số từ “12a”: hàm dừng ở kí tự lạ trả 12 (âm thầm sai), int(“12a”) báo ValueError — thất bại sớm (VER SDP:L01)"
    fix: ["Nuốt ngoại lệ (except: pass) biến lỗi rõ thành dữ liệu sai lặng lẽ"]
  - id: L02
    title: "Đóng gói và bất biến lớp"
    spec: lessons/sdp/L02_dong_goi.yaml
    requires: [L01]
    requires_ext: ["SWF:L07"]
    objectives: ["Viết lớp giữ bất biến", "Giải thích vì sao trường công khai phá đóng gói"]
    example: "tài khoản số dư ≥ 0: rút 150 từ 100 phải báo lỗi; nếu ai cũng gán được số dư trực tiếp thì −50 lọt vào (VER SDP:L02)"
    fix: ["Getter/setter cho mọi trường không phải đóng gói — đóng gói là bảo vệ bất biến"]
  - id: L03
    title: "Kế thừa, đa hình và giao diện"
    spec: lessons/sdp/L03_da_hinh.yaml
    requires: [L02]
    objectives: ["Gọi phương thức theo kiểu động", "Viết mã theo giao diện thay vì lớp cụ thể"]
    example: "chữ nhật 3 × 4, tròn bán kính 1, tam giác đáy 6 cao 2: một vòng gọi area() cho tổng 18 + π ≈ 21,14 (VER SDP:L03)"
    fix: ["Kiểm kiểu bằng chuỗi if isinstance … là dấu hiệu thiếu đa hình"]
  - id: L04
    title: "Hợp thành thay vì kế thừa"
    spec: lessons/sdp/L04_hop_thanh.yaml
    requires: [L03]
    objectives: ["Nhận ra bùng nổ lớp con", "Thay kế thừa bằng hợp thành"]
    example: "3 loại cà phê × mọi tổ hợp 4 loại thêm: kế thừa cần 3 · 2⁴ = 48 lớp; hợp thành cần 3 + 4 = 7 lớp (VER SDP:L04)"
    fix: ["Kế thừa vẫn đúng chỗ khi quan hệ thật sự là “là một” và tuân Liskov"]
  - id: L05
    title: "SOLID 1: trách nhiệm đơn và đóng–mở"
    spec: lessons/sdp/L05_trach_nhiem_don_dong_mo.yaml
    requires: [L04]
    objectives: ["Tách lớp theo lý do thay đổi", "Mở rộng hành vi mà không sửa mã cũ"]
    example: "hoá đơn 200 000: thuế 10% là một quy tắc, thêm quy tắc giảm 5% bằng lớp mới, không sửa hàm cũ → 209 000 (VER SDP:L05)"
    fix: ["“Một trách nhiệm” = một lý do thay đổi, không phải “một hàm”"]
  - id: L06
    title: "SOLID 2: nguyên lý thay thế Liskov"
    spec: lessons/sdp/L06_thay_the_liskov.yaml
    requires: [L05]
    objectives: ["Phát biểu Liskov bằng hợp đồng", "Nhận ra vi phạm qua kiểm thử của lớp cha"]
    example: "đặt rộng 5 rồi cao 4: chữ nhật cho diện tích 20, hình vuông (lớp con) cho 16 — phá hậu điều kiện của lớp cha (VER SDP:L06)"
    fix: ["“Hình vuông là hình chữ nhật” đúng trong toán nhưng sai khi đối tượng thay đổi được"]
  - id: L07
    title: "SOLID 3: tách giao diện và đảo phụ thuộc"
    spec: lessons/sdp/L07_dao_phu_thuoc.yaml
    requires: [L06]
    objectives: ["Tiêm phụ thuộc qua tham số", "Kiểm thử bằng đối tượng giả"]
    example: "lời chào phụ thuộc đồng hồ: tiêm đồng hồ giả ngày 1/1 → luôn ra “Chúc mừng năm mới”, kiểm thử chạy được mọi ngày (VER SDP:L07)"
    fix: ["Khung tiêm phụ thuộc không bắt buộc — truyền tham số đã là đảo phụ thuộc"]
  - id: L08
    title: "Mẫu khởi tạo: Factory, Builder, Singleton"
    spec: lessons/sdp/L08_mau_khoi_tao.yaml
    requires: [L07]
    objectives: ["Dùng Factory để ẩn lớp cụ thể", "Giải thích vì sao Singleton làm kiểm thử phụ thuộc thứ tự"]
    example: "bộ đếm Singleton: kiểm thử A mong 1 sau khi tăng — chạy A trước B thì đúng, B trước A thì sai (VER SDP:L08)"
    fix: ["Singleton là biến toàn cục đội lốt mẫu — chỉ dùng khi tài nguyên thật sự là duy nhất"]
  - id: L09
    title: "Mẫu cấu trúc: Adapter, Decorator, Composite"
    spec: lessons/sdp/L09_mau_cau_truc.yaml
    requires: [L04]
    objectives: ["Bọc giao diện cũ bằng Adapter", "Xếp chồng hành vi bằng Decorator", "Xử lý cây bằng Composite"]
    example: "cà phê 30 + sữa 5 + đường 2 = 37 (Decorator); thư mục 120 + 30 + (50 + 20) = 220 (Composite); 98,6 °F → 37,0 °C (Adapter) (VER SDP:L09)"
    fix: ["Decorator lồng quá sâu làm khó gỡ lỗi — thứ tự bọc có thể đổi kết quả"]
  - id: L10
    title: "Mẫu hành vi: Strategy, Observer, Command"
    spec: lessons/sdp/L10_mau_hanh_vi.yaml
    requires: [L09]
    objectives: ["Thay thuật toán lúc chạy bằng Strategy", "Đếm số lần thông báo của Observer", "Hoàn tác bằng Command"]
    example: "Observer: 3 người nghe × 4 sự kiện = 12 lần gọi; Command trên 10: +5, ×2, −3 → 27; hoàn tác hai lần → 30 rồi 15 (VER SDP:L10)"
    fix: ["Observer quên huỷ đăng ký gây rò bộ nhớ và gọi tới đối tượng đã chết"]
  - id: L11
    title: "Mẫu trạng thái, duyệt và khuôn thuật toán (State, Iterator, Template Method)"
    spec: lessons/sdp/L11_trang_thai_duyet_khuon.yaml
    requires: [L10]
    requires_ext: ["SWF:L08"]
    objectives: ["Thay chuỗi if trạng thái bằng lớp trạng thái", "Duyệt tập hợp không lộ cấu trúc trong"]
    example: "đơn hàng mới → đã trả → đã giao: trong 9 cặp trạng thái chỉ 2 chuyển tiến hợp lệ; huỷ sau khi đã giao bị từ chối (VER SDP:L11)"
    fix: ["Sửa tập hợp trong lúc đang duyệt làm Iterator hỏng"]
  - id: L12
    title: "Kỹ thuật hàm: hàm thuần, bất biến, ghi nhớ"
    spec: lessons/sdp/L12_ky_thuat_ham.yaml
    requires: [L00]
    requires_ext: ["PLC:L07", "PLC:L12"]
    objectives: ["Viết hàm thuần dễ kiểm", "Dùng ghi nhớ khi hàm thuần bị gọi lại"]
    example: "fib(30) đệ quy ngây thơ: 2 692 537 lần gọi; có ghi nhớ: 59 lần gọi, chỉ 31 lần thật sự tính (máy đếm, VER SDP:L12)"
    fix: ["Ghi nhớ hàm không thuần (đọc giờ, đọc tệp) trả kết quả cũ sai"]
  - id: L13
    title: "Mùi mã và tái cấu trúc an toàn"
    spec: lessons/sdp/L13_mui_ma_tai_cau_truc.yaml
    requires: [L05, L12]
    requires_ext: ["SWF:L06"]
    objectives: ["Nhận ra mùi mã thường gặp", "Tái cấu trúc từng bước nhỏ, giữ hành vi"]
    example: "tách hàm tính thuế và phí giao: bản cũ và bản mới cho cùng kết quả trên 10 000 đầu vào ngẫu nhiên (VER SDP:L13)"
    fix: ["Tái cấu trúc không có kiểm thử là viết lại — không còn bằng chứng giữ hành vi"]
  - id: L14
    title: "Thiết kế API và phiên bản ngữ nghĩa"
    spec: lessons/sdp/L14_api_phien_ban.yaml
    requires: [L07]
    requires_ext: ["SWF:L11"]
    objectives: ["Giữ tương thích ngược", "Chọn tăng MAJOR, MINOR hay PATCH"]
    example: "1.4.2: sửa lỗi → 1.4.3; thêm tham số tuỳ chọn → 1.5.0; bỏ một trường → 2.0.0 (VER SDP:L14)"
    fix: ["Đổi hành vi mà giữ chữ ký hàm vẫn là thay đổi phá vỡ"]
  - id: L15
    title: "Đo chất lượng thiết kế: liên kết, gắn kết, độ bất ổn"
    spec: lessons/sdp/L15_do_chat_luong_thiet_ke.yaml
    requires: [L13]
    objectives: ["Tính độ bất ổn I = Ce / (Ca + Ce)", "Áp nguyên lý phụ thuộc ổn định"]
    example: "mô-đun có 3 mô-đun phụ thuộc vào nó (Ca = 3), nó phụ thuộc 1 mô-đun (Ce = 1): I = 1 / 4 = 0,25 — khá ổn định (VER SDP:L15)"
    fix: ["Độ đo là tín hiệu để xem xét, không phải mục tiêu để tối ưu"]
  - id: L16
    title: "Tổng hợp: thiết kế lại giỏ hàng"
    spec: lessons/sdp/L16_tong_hop_gio_hang.yaml
    requires: [L10, L11, L13, L15]
    objectives: ["Chọn mẫu theo vấn đề, không theo danh sách", "Giữ hành vi bằng kiểm thử khi thiết kế lại"]
    example: "giỏ 150 000 + 200 000 + 100 000 = 450 000; chiến lược “giảm 10% khi trên 300 000” → 405 000; Observer cập nhật tồn kho (VER SDP:L16)"
    fix: ["Thêm mẫu khi chưa có vấn đề nó giải là phức tạp hoá vô ích"]
  - id: L17
    title: "Tình huống chuyên gia theo dòng thời gian: Shopify, từ nguyên khối tới nguyên khối mô-đun hoá"
    spec: lessons/sdp/L17_hanh_trinh_nguyen_khoi_mo_dun.yaml
    requires: [L07, L10, L13, L15]
    kind: journey
    objectives: ["Kể lại hành trình của nguyên khối Shopify qua bốn chặng (2006 → 2024), mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại số phụ thuộc có thể có, công dán nhãn 6000 lớp, cận dưới số mũi tên của đồ thị dày, số lần kiểm mỗi ngày và độ bất ổn để chọn chiều phụ thuộc", "Chọn giữa nguyên khối mô-đun hoá và tách dịch vụ ở quy mô của mình, kèm điều kiện đổi lựa chọn"]
    example: "10 miền không ranh giới (số minh hoạ) → 10 × 9 = 90 chiều gọi có thể; 6000 lớp (DM19), 1 phút mỗi lớp (số minh hoạ) → 100 giờ; 37 thành phần (UD20), mỗi cái dựa vào hơn nửa 36 cái kia → ít nhất 19, tổng ít nhất 703 mũi tên trên tối đa 1332; ngày 8 giờ: lần quét hơn 1 giờ → nhiều nhất 8 lần, 5 phút (số minh hoạ) → 96 lần; 9/2020 → 1/2024 = 40 tháng; cửa hàng Ca = 7, Ce = 0 → I = 0, thông báo Ca = 0, Ce = 2 → I = 1 (VER SDP:L17)"
    fix: ["Chỉ khẳng định điều có trong DM19, UD20, PW20, PR24 (audit/sdp/sources_L17.md); số thành phần năm 2017 không có trong nguồn (PR24 chỉ ghi “a couple dozen”) — chỉ dùng 37 của năm 2020", "Thời gian dán nhãn, thời gian quét “a few minutes”, 10 miền, nhóm 6 người là số minh hoạ; năm phát hành Packwerk 3.0 không có trong nguồn — không dạy", "Không nói Shopify “bỏ” nguyên khối hay chuyển sang vi dịch vụ: nguồn ghi chỉ tách dịch vụ có lý do (hiển thị cửa hàng chỉ đọc, kho thẻ tín dụng)"]
