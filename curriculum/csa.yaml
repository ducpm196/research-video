# Giáo án KẾ HOẠCH — CSA · Hệ thống máy tính: biểu diễn dữ liệu và kiến trúc
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã CSA:Lxx (85/85 PASS, 2026-10-27).
# Căn cứ phạm vi: CS2023 — Systems Fundamentals (SF, 18 giờ CS Core) và Architecture and Organization (AR, 9 giờ CS Core)
#   (bảng giờ lõi trong “1.3 Introduction to Knowledge Model”, sha256 c51b590a2a6e6d98, đọc 2026-10-27).
# Vì sao cần: AI (số thực dấu phẩy động, tràn số khi huấn luyện), robot (vi điều khiển, số nguyên có dấu), phần mềm (lỗi tràn, bộ nhớ đệm
#   quyết định tốc độ). CS112/CS115 không có bài nào về biểu diễn số trong máy hay phần cứng.
# Thứ tự học: sau DMS:L00–L01 (lôgic); trước OSY.
course: CSA
status: planned
lessons:
  - id: L00
    title: "Bit, byte, hệ nhị phân và thập lục phân"
    spec: lessons/csa/L00_bit_byte_co_so.yaml
    requires: []
    requires_ext: ["DMS:L00"]
    objectives: ["Đổi qua lại giữa thập phân, nhị phân, thập lục phân", "Biết một byte là 8 bit và n bit biểu diễn được 2 mũ n giá trị", "Phân biệt kB và KiB"]
    example: "0x2F = 47 = 0b101111 (VER CSA:L00)"
    fix: ["KB, KiB: 1 KiB = 1024 B còn 1 kB = 1000 B — ghi rõ khi tính dung lượng"]
  - id: L01
    title: "Số nguyên không dấu, bù 2 và tràn số"
    spec: lessons/csa/L01_bu_2_tran_so.yaml
    requires: [L00]
    objectives: ["Viết số âm bằng bù 2", "Đọc cùng một dãy bit theo kiểu không dấu và có dấu", "Nhận ra tràn số có dấu và không dấu"]
    example: "−5 trên 8 bit = 11111011; 127 + 1 tràn thành −128 (VER CSA:L01)"
    fix: ["Tràn số nguyên có dấu trong C là hành vi không xác định — không được giả định “quay vòng”"]
  - id: L02
    title: "Phép toán bit và phép dịch"
    spec: lessons/csa/L02_phep_toan_bit.yaml
    requires: [L01]
    objectives: ["Dùng và, hoặc, hoặc loại trừ, đảo bit, dịch trái, dịch phải", "Dùng mặt nạ để lấy, bật, tắt một nhóm bit", "Viết mẹo kiểm lũy thừa của 2"]
    example: "12 & 11 = 8 (xoá bit 1 thấp nhất); x là lũy thừa của 2 ⇔ x & (x − 1) = 0; 13 << 3 = 104 (VER CSA:L02)"
    fix: ["Dịch phải số âm: số học (giữ dấu) khác lôgic (điền 0)"]
  - id: L03
    title: "Số thực dấu phẩy động IEEE 754"
    spec: lessons/csa/L03_so_thuc_ieee754.yaml
    requires: [L01]
    objectives: ["Đọc ba trường dấu, mũ, phần định trị của một số float32", "Giải thích vì sao 0,1 không biểu diễn chính xác", "So sánh hai số thực đúng cách"]
    example: "0.1 + 0.2 = 0.30000000000000004 ≠ 0.3; float32 của 1,0 là 0x3F800000 (VER CSA:L03)"
    fix: ["Không so sánh số thực bằng ==; so |a − b| với một ngưỡng tương đối"]
  - id: L04
    title: "Sai số làm tròn, epsilon máy và triệt tiêu"
    spec: lessons/csa/L04_sai_so_lam_tron.yaml
    requires: [L03]
    requires_ext: ["CS115:L12"]
    objectives: ["Giải thích epsilon máy và sai số tương đối của một phép tính", "Nhận ra phép cộng số thực không kết hợp", "Nhận ra và tránh triệt tiêu khi trừ hai số gần nhau"]
    example: "ε (double) = 2⁻⁵² ≈ 2,22·10⁻¹⁶; (10¹⁶ + 1) − 10¹⁶ = 0 (VER CSA:L04)"
    fix: ["Phép cộng số thực không kết hợp: (a + b) + c có thể khác a + (b + c)"]
  - id: L05
    title: "Mạch lôgic và đại số Boole"
    spec: lessons/csa/L05_mach_logic.yaml
    requires: [L00]
    requires_ext: ["DMS:L01"]
    objectives: ["Từ bảng chân trị dựng mạch bằng các cổng", "Dựng bộ cộng bán phần và toàn phần", "Giải thích vì sao một loại cổng NAND dựng được mọi mạch"]
    example: "bộ cộng bán phần: tổng = a XOR b, nhớ = a AND b (VER CSA:L05)"
    fix: ["XOR khác OR ở dòng (1, 1)"]
  - id: L06
    title: "Bộ cộng nhiều bit và ALU"
    spec: lessons/csa/L06_bo_cong_alu.yaml
    requires: [L05, L01]
    objectives: ["Nối các bộ cộng toàn phần thành bộ cộng nhiều bit", "Thực hiện phép trừ bằng chính bộ cộng", "Phát hiện tràn có dấu và không dấu bằng phần cứng"]
    example: "0111 + 0101 = 1100: không dấu là 12, có dấu (4 bit) là −4 → tràn có dấu (VER CSA:L06)"
    fix: ["Cùng một dãy bit, ý nghĩa do CÁCH ĐỌC (có dấu hay không), không do phần cứng cộng"]
  - id: L07
    title: "Tập lệnh và hợp ngữ: thanh ghi, nạp, lưu, nhảy"
    spec: lessons/csa/L07_tap_lenh_hop_ngu.yaml
    requires: [L06]
    objectives: ["Đọc một đoạn hợp ngữ có vòng lặp", "Phân biệt thanh ghi và bộ nhớ, lệnh nạp và lưu", "Đếm số lệnh thực thi của một vòng lặp"]
    example: "vòng lặp tính 1 + 2 + … + 10 = 55: 3 lệnh khởi tạo + 10 vòng × 3 lệnh (cộng, tăng, so sánh-và-nhảy) = 33 lệnh (máy ảo tools/checklib.run_asm, VER CSA:L07)"
    fix: ["Một dòng mã nguồn có thể thành nhiều lệnh máy — “số bước” khi phân tích thuật toán là mô hình, không phải số lệnh thật"]
  - id: L08
    title: "Hiệu năng CPU: số lệnh, CPI, tần số"
    spec: lessons/csa/L08_hieu_nang_cpu.yaml
    requires: [L07]
    objectives: ["Dùng công thức thời gian = số lệnh × CPI / tần số", "Tính CPI trung bình từ tỉ lệ các loại lệnh", "So sánh hai thiết kế không bị đánh lừa bởi tần số"]
    example: "10⁹ lệnh, CPI 1,5, 2 GHz → 0,75 s (VER CSA:L08)"
    fix: ["Tần số cao hơn không chắc nhanh hơn nếu CPI tăng"]
  - id: L09
    title: "Đường ống lệnh và các loại xung đột"
    spec: lessons/csa/L09_duong_ong_lenh.yaml
    requires: [L08]
    objectives: ["Tính số chu kỳ của đường ống k tầng", "Nhận biết xung đột dữ liệu, điều khiển, cấu trúc", "Giải thích chuyển tiếp dữ liệu và đoán nhánh"]
    example: "5 tầng, 100 lệnh: 104 chu kỳ thay vì 500 → nhanh 4,81 lần (VER CSA:L09)"
    fix: ["Đường ống không làm MỘT lệnh nhanh hơn — nó tăng số lệnh hoàn thành mỗi chu kỳ"]
  - id: L10
    title: "Phân cấp bộ nhớ và tính cục bộ"
    spec: lessons/csa/L10_phan_cap_bo_nho.yaml
    requires: [L08]
    objectives: ["Mô tả các tầng bộ nhớ và độ trễ cỡ độ lớn", "Tính thời gian truy cập trung bình", "Giải thích cục bộ thời gian và không gian, viết mã tận dụng chúng"]
    example: "AMAT = 1 + 0,05·100 = 6 chu kỳ (VER CSA:L10)"
    fix: ["Duyệt ma trận theo cột trong ngôn ngữ lưu theo hàng làm hỏng cục bộ không gian"]
  - id: L11
    title: "Bộ nhớ đệm ánh xạ trực tiếp: thẻ, chỉ số, độ dời"
    spec: lessons/csa/L11_cache_anh_xa_truc_tiep.yaml
    requires: [L10, L02]
    objectives: ["Tính số dòng của bộ nhớ đệm", "Tách địa chỉ thành thẻ, chỉ số, độ dời", "Mô phỏng trúng và trượt, nhận ra trượt do xung đột"]
    example: "cache 32 KiB, dòng 64 B: 512 dòng; địa chỉ 32 bit = 17 bit thẻ + 9 bit chỉ số + 6 bit độ dời (VER CSA:L11)"
    fix: ["Số dòng = dung lượng / kích thước dòng, không phải dung lượng / 1 byte"]
  - id: L12
    title: "Bộ nhớ đệm kết hợp theo tập và chính sách thay thế LRU"
    spec: lessons/csa/L12_cache_ket_hop_tap.yaml
    requires: [L11]
    objectives: ["Mô phỏng bộ nhớ đệm k đường với thay thế LRU", "So sánh ánh xạ trực tiếp, kết hợp theo tập, kết hợp hoàn toàn", "Phân loại trượt bắt buộc, trượt do dung lượng, trượt do xung đột"]
    example: "dãy khối 0, 4, 0, 4, 8, 0, 4: ánh xạ trực tiếp 4 dòng → 0 lần trúng; 2 tập × 2 đường, LRU → 2 lần trúng (VER CSA:L12)"
    fix: ["Tăng số đường giảm trượt xung đột, nhưng không giảm trượt bắt buộc (lần truy cập đầu)"]
  - id: L13
    title: "Định luật Amdahl và giới hạn của song song"
    spec: lessons/csa/L13_dinh_luat_amdahl.yaml
    requires: [L08]
    objectives: ["Phát biểu và dùng định luật Amdahl", "Tính tăng tốc tối đa khi số lõi tiến tới vô cùng", "Giải thích vì sao phần tuần tự quyết định giới hạn"]
    example: "90% song song được, 8 lõi → 4,71 lần; vô số lõi → tối đa 10 lần (VER CSA:L13)"
    fix: ["Gấp đôi số lõi không gấp đôi tốc độ — phần tuần tự và chi phí đồng bộ"]
  - id: L14
    title: "Bộ nhớ ảo: trang, bảng trang, TLB"
    spec: lessons/csa/L14_bo_nho_ao.yaml
    requires: [L10, L02]
    objectives: ["Giải thích vì sao cần bộ nhớ ảo", "Dịch địa chỉ ảo sang địa chỉ vật lý bằng bảng trang", "Tính thời gian truy cập hiệu dụng có bộ đệm dịch địa chỉ"]
    example: "địa chỉ ảo 32 bit, trang 4 KiB: 2²⁰ mục; TLB trúng 98% (1 ns), bộ nhớ 100 ns: EAT = 103 ns (VER CSA:L14)"
    fix: ["TLB trượt cần thêm một lần đọc bảng trang — EAT không chỉ là 1 + 100"]
  - id: L15
    title: "Vào/ra: thăm dò, ngắt và DMA"
    spec: lessons/csa/L15_vao_ra.yaml
    requires: [L08]
    objectives: ["So sánh thăm dò, ngắt, truy cập bộ nhớ trực tiếp", "Tính phần thời gian CPU dành cho vào/ra", "Chọn cách vào/ra theo tốc độ thiết bị"]
    example: "1000 ngắt/giây × 2 µs = 0,2% thời gian CPU (VER CSA:L15)"
    fix: ["Ngắt không “miễn phí”: tốc độ ngắt rất cao làm CPU chỉ lo xử lý ngắt"]
  - id: L16
    title: "Tình huống chuyên gia theo dòng thời gian: hết bữa trưa miễn phí, đa nhân và Spectre"
    spec: lessons/csa/L16_hanh_trinh_bua_trua_mien_phi.yaml
    requires: [L08, L09, L10, L13]
    see_also: ["SEC:L00", "OSY:L14"]
    kind: journey
    objectives: ["Kể lại hành trình tăng tốc bộ xử lý qua năm chặng từ 2001 tới 2019 và sau đó, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại thời gian chạy theo xung nhịp, tăng tốc đa nhân theo Amdahl và chi phí trung bình khi đoán nhánh", "Chọn giữa mua nhịp cao hơn, viết lại song song và mức giảm thiểu Spectre hợp với máy của mình, kèm điều kiện đổi lựa chọn"]
    example: "10⁹ lệnh, CPI 1,5: 2 GHz (HS05: 8/2001) → 0,75 s, 3,73 GHz (HS05: đầu 2005) → 0,40 s thay vì 0,15 s ở 10 GHz theo xu hướng; 90% song song, 2 lõi → 1,82 lần (HS05: 2 × 3 GHz < 6 GHz); chờ bộ nhớ 200 chu kỳ (số minh hoạ), đoán đúng 95% → trung bình 10 chu kỳ; 188 lệnh < 192 vi lệnh của bộ đệm sắp xếp lại (KO19) (VER CSA:L16)"
    fix: ["Chỉ khẳng định điều có trong HS05, KO19, LK (audit/csa/sources_L16.md); KO19 đọc bản tác giả tại spectreattack.com (trang IEEE không đọc toàn văn)", "Spectre chỉ ở mức khái niệm phòng thủ: không mã khai thác, không cách luyện sai bộ đoán, không tốc độ rò rỉ", "200 chu kỳ, 4 vi lệnh mỗi chu kỳ, đoán đúng 95%, chương trình 60 giây, 80%/20% song song, 10% chi phí giảm thiểu là số minh hoạ; công thức công suất theo tần số không có trong nguồn đã đọc — không dạy"]
