# Giáo án KẾ HOẠCH — PAR · Tính toán song song và GPU
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã PAR:Lxx (liệt kê mọi thứ tự xen kẽ, phân lịch tham lam, mô phỏng warp,
#   đếm lượt đọc bộ nhớ của phép nhân ma trận chia khối, đếm byte của all-reduce vòng).
# Căn cứ phạm vi (CITED): CS2023 lĩnh vực PDC (Parallel and Distributed Computing) — lõi: phân rã, tranh chấp, định luật Amdahl, mô hình công việc–độ dài;
#   G. Amdahl (AFIPS 1967); J. Gustafson, “Reevaluating Amdahl’s Law” (CACM 1988); R. Brent (JACM 1974) — cận lịch tham lam;
#   S. Williams, A. Waterman, D. Patterson, “Roofline” (CACM 2009); NVIDIA CUDA C++ Programming Guide (warp 32 luồng — bản hiện hành, tên sản phẩm chỉ trên màn hình);
#   P. Patarasuk, X. Yuan, “Bandwidth optimal all-reduce algorithms” (JPDC 2009); A. Sergeev, M. Del Balso, Horovod (2018) — all-reduce vòng cho học sâu.
# Vì sao cần: CSA L13 dạy Amdahl ở mức một công thức; OSY L04–L06 dạy tranh chấp, khoá; DSY dạy hệ phân tán. Chưa có khoá nào dạy tư duy hiệu năng
#   song song trên một máy (bộ nhớ đệm, SIMD, GPU, roofline) và truyền thông tập thể — nền bắt buộc của huấn luyện mô hình lớn (CS115 L22, LLM L05).
# Thứ tự học: sau CSA (L10–L13), OSY (L04–L05), CS115 L02 (nhân ma trận).
course: PAR
status: planned
lessons:
  - id: L00
    title: "Vì sao song song: định luật Amdahl và phần tuần tự"
    spec: lessons/par/L00_amdahl.yaml
    requires: []
    requires_ext: ["CSA:L13"]
    objectives: ["Tính tốc độ tăng tối đa khi biết phần chạy song song được", "Nhận ra phần tuần tự là giới hạn cứng, thêm lõi không vượt qua được"]
    example: "chương trình 90% song song được: 16 lõi → 1 / (0,1 + 0,9/16) = 6,4 lần; vô số lõi → tối đa 10 lần (VER PAR:L00)"
    fix: ["Amdahl giả định cỡ bài toán cố định; khi bài toán lớn lên theo số lõi thì xem định luật Gustafson (bài 1)"]
  - id: L01
    title: "Mở rộng theo cỡ bài toán: định luật Gustafson và hiệu suất mở rộng"
    spec: lessons/par/L01_gustafson.yaml
    requires: [L00]
    objectives: ["Phân biệt mở rộng mạnh (bài toán cố định) và mở rộng yếu (bài toán lớn theo lõi)", "Tính hiệu suất mở rộng = tốc độ tăng / số lõi"]
    example: "phần tuần tự đo TRÊN MÁY 16 lõi là 10%, phần song song lớn gấp 16: tốc độ tăng theo cỡ 0,1 + 0,9 · 16 = 14,5 lần (hiệu suất 90,6%), so với 6,4 lần (40%) khi giữ nguyên cỡ và 10% đo trên một lõi; đổi sang cách đo của Amdahl, bài toán đã phóng to chỉ có 0,1/14,5 ≈ 0,69% tuần tự trên một lõi và Amdahl cũng cho đúng 14,5 (VER PAR:L01)"
    fix: ["Hai định luật không mâu thuẫn — chúng trả lời hai câu hỏi khác nhau; báo cáo tốc độ tăng phải nói rõ loại mở rộng", "Hai con số 10% KHÔNG cùng nghĩa: Gustafson (CACM 1988) đo s' trên máy song song, Amdahl đo trên một lõi; đặt 14,5 cạnh 6,4 mà không nói điều này là so hai bài toán khác nhau (bản giáo án cũ viết chung “phần tuần tự 10%”)"]
  - id: L02
    title: "Mô hình công việc–độ dài đường găng và cận lịch tham lam"
    spec: lessons/par/L02_cong_viec_do_dai.yaml
    requires: [L00]
    requires_ext: ["CS112:L12"]
    objectives: ["Tính công việc T₁ và độ dài đường găng T∞ của một thuật toán song song", "Dùng cận lịch tham lam T_n ≤ T₁/n + T∞ để dự đoán thời gian trên n lõi (n = số lõi như cả khoá; p dành cho phần song song được của Amdahl)"]
    example: "cộng 1024 số theo cây: công việc 1023 phép cộng, đường găng 10 tầng; 32 lõi: cận của Brent T∞ + (T₁ − T∞)/n = 10 + 1013/32 ≈ 41,66 bước, dạng gọn 1023/32 + 10 ≈ 41,97, lịch tham lam làm thật chỉ cần 36 bước, cận dưới ≈ 31,97; song song tối đa T₁/T∞ ≈ 102 (VER PAR:L02)"
    fix: ["Cộng tuần tự từng số có đường găng 1023 — cùng công việc nhưng không song song được; phải đổi thuật toán, không chỉ thêm lõi", "Lemma 2 của Brent (JACM 1974) ghi t + (q − t)/p, không phải T₁/p + T∞ — dạng gọn lớn hơn một chút, chỉ gọi là “dạng hay gặp” (audit/par/sources_L02.md)", "Cận chỉ đúng trong mô hình bỏ qua đọc dữ liệu và giao tiếp (Brent 1974 ghi rõ); số đo thật thường chậm hơn"]
  - id: L03
    title: "Tranh chấp dữ liệu, phép toán nguyên tử và phép rút gọn"
    spec: lessons/par/L03_tranh_chap_rut_gon.yaml
    requires: [L02]
    requires_ext: ["OSY:L04", "CSA:L04"]
    objectives: ["Liệt kê kết quả có thể của biến đếm dùng chung không khoá", "Giải thích vì sao rút gọn song song số dấu phẩy động cho kết quả khác thứ tự tuần tự"]
    example: "2 luồng, mỗi luồng tăng biến đếm 2 lần bằng đọc–cộng–ghi: mọi thứ tự xen kẽ cho kết quả 2, 3 hoặc 4 (đúng là 4); (0,1 + 0,2) + 0,3 = 0,6000000000000001 nhưng 0,1 + (0,2 + 0,3) = 0,6 (VER PAR:L03)"
    fix: ["Kết quả khác theo số luồng không phải lỗi phần cứng — phép cộng dấu phẩy động không kết hợp; muốn tái lập phải cố định thứ tự rút gọn"]
  - id: L04
    title: "Phân rã và cân bằng tải: chia tĩnh, chia động, việc dài trước"
    spec: lessons/par/L04_can_bang_tai.yaml
    requires: [L02]
    objectives: ["So sánh chia tĩnh theo khối với phân việc động", "Dùng quy tắc việc dài làm trước để giảm thời gian hoàn thành"]
    example: "8 việc dài 8, 7, 6, 5, 4, 3, 2, 1 trên 2 lõi: chia nửa đầu–nửa sau → 26 và 10, xong sau 26; việc dài trước vào lõi rảnh → 18 và 18, xong sau 18 (VER PAR:L04)"
    fix: ["Chia đều SỐ việc không phải chia đều THỜI GIAN — lõi chậm nhất quyết định thời gian hoàn thành"]
  - id: L05
    title: "Bộ nhớ đệm khi song song: tính cục bộ và chia sẻ giả"
    spec: lessons/par/L05_chia_se_gia.yaml
    requires: [L03]
    requires_ext: ["CSA:L10", "CSA:L11"]
    objectives: ["Giải thích chia sẻ giả khi các luồng ghi các biến khác nhau trong cùng một dòng bộ nhớ đệm", "Bố trí dữ liệu để mỗi luồng ghi dòng riêng"]
    example: "dòng bộ nhớ đệm 64 byte chứa 8 biến đếm 8 byte: 8 luồng mỗi luồng một biến liền nhau → cả 8 tranh một dòng; đệm mỗi biến ra 64 byte → mỗi luồng một dòng, tốn 8 lần bộ nhớ (512 so với 64 byte) (VER PAR:L05)"
    fix: ["Chia sẻ giả không làm sai kết quả, chỉ làm chậm — nên không kiểm thử nào bắt được, phải đo"]
  - id: L06
    title: "Vector hoá: một lệnh, nhiều dữ liệu"
    spec: lessons/par/L06_vector_hoa.yaml
    requires: [L05]
    requires_ext: ["CSA:L07"]
    objectives: ["Tính số phần tử mỗi lệnh vector và số lệnh cho một vòng lặp", "Nhận ra điều kiện để vector hoá: không phụ thuộc giữa các lượt lặp"]
    example: "thanh ghi 256 bit chứa 256/32 = 8 số 32 bit; vòng lặp 1003 phần tử: 125 lệnh vector + 3 lượt vô hướng; a[i] = a[i − 1] + b[i] phụ thuộc lượt trước → không vector hoá trực tiếp (VER PAR:L06)"
    fix: ["Vector hoá tăng tốc tối đa bằng độ rộng vector chỉ khi dữ liệu đã nằm trong bộ nhớ đệm — thường bị băng thông bộ nhớ chặn trước (bài 7)"]
  - id: L07
    title: "Mô hình roofline: bị chặn bởi tính toán hay bởi băng thông"
    spec: lessons/par/L07_roofline.yaml
    requires: [L06]
    objectives: ["Tính cường độ số học = phép tính / byte đọc ghi", "Đọc hiệu năng đạt được = min(đỉnh tính toán, băng thông × cường độ)"]
    example: "đỉnh 10 nghìn tỉ phép/giây, băng thông 1 nghìn tỉ byte/giây → điểm gãy 10 phép/byte; cộng hai vector số 32 bit: 1 phép / 12 byte → tối đa ≈ 83,3 tỉ phép/giây (0,83% đỉnh); nhân ma trận 4096 × 4096 lý tưởng: 2n³ / (12n²) ≈ 682,7 phép/byte → bị chặn bởi tính toán (VER PAR:L07)"
    fix: ["Tối ưu tính toán cho một nhân bị chặn bởi băng thông không làm nhanh hơn — phải giảm byte (gộp phép, chia khối)"]
  - id: L08
    title: "GPU: luồng, khối, nhóm 32 luồng chạy chung lệnh, phân kỳ nhánh và truy cập gộp"
    spec: lessons/par/L08_gpu.yaml
    requires: [L07]
    objectives: ["Tính hiệu suất khi một nhóm 32 luồng rẽ hai nhánh", "Phân biệt truy cập bộ nhớ liền nhau (gộp) và truy cập theo bước nhảy"]
    example: "nhóm 32 luồng, nửa đi nhánh A, nửa đi nhánh B → chạy hai lượt, hiệu suất 50%; 32 luồng đọc 32 số 4 byte liền nhau = 128 byte = 4 giao dịch 32 byte (hiệu suất đọc 100%); đọc cách nhau 32 phần tử → 32 giao dịch (12,5%); lệch 4 byte → 5 giao dịch (VER PAR:L08)"
    fix: ["“Hàng nghìn lõi” của GPU không phải hàng nghìn CPU độc lập — các luồng trong nhóm chạy cùng một lệnh", "Bản giáo án cũ ghi “128 byte liền nhau = một giao dịch” theo mô hình đoạn 128 byte của thế hệ cũ; CUDA C++ Best Practices Guide hiện hành tính bằng giao dịch 32 byte: liền nhau là 4 giao dịch, lệch đầu đoạn là 5 (audit/par/sources_L08.md)"]
  - id: L09
    title: "Nhân ma trận chia khối: dùng lại dữ liệu trong bộ nhớ nhanh"
    spec: lessons/par/L09_chia_khoi.yaml
    requires: [L07, L08]
    requires_ext: ["CS115:L02"]
    objectives: ["Đếm số lần đọc bộ nhớ chậm của nhân ma trận ngây thơ và chia khối", "Chọn cỡ khối theo dung lượng bộ nhớ nhanh"]
    example: "n = 1024: ngây thơ đọc 2n³ ≈ 2,15 tỉ phần tử; khối 32 × 32 giảm 32 lần còn 67 108 864; ba khối 32 × 32 số 4 byte cần 12 288 byte bộ nhớ nhanh (VER PAR:L09)"
    fix: ["Khối càng lớn càng ít đọc, nhưng phải vừa bộ nhớ nhanh — vượt dung lượng thì lợi ích mất"]
  - id: L10
    title: "Truyền thông tập thể: all-reduce vòng và máy chủ tham số"
    spec: lessons/par/L10_all_reduce.yaml
    requires: [L02]
    requires_ext: ["DSY:L00", "NET:L02"]
    objectives: ["Tính lượng dữ liệu mỗi máy gửi trong all-reduce vòng", "So sánh với máy chủ tham số tập trung"]
    example: "8 máy, mỗi máy 1 GB gradient: all-reduce vòng mỗi máy gửi 2(n − 1)/n · D = 1,75 GB (n = số máy, D = dung lượng), tiến tới 2D chứ không tăng theo số máy; máy chủ tham số nhận 8 GB qua một đường (VER PAR:L10)"
    fix: ["Vòng tối ưu băng thông nhưng có 2(p − 1) bước nối tiếp — với gói nhỏ, độ trễ mỗi bước chiếm ưu thế (bài toán cây khác vòng)"]
  - id: L11
    title: "Huấn luyện phân tán: song song dữ liệu, chồng tính toán với truyền thông"
    spec: lessons/par/L11_huan_luyen_phan_tan.yaml
    requires: [L10, L01]
    requires_ext: ["CS115:L09"]
    objectives: ["Tính hiệu suất mở rộng khi truyền thông không chồng với tính toán", "Giải thích vì sao lô toàn cục lớn cần chỉnh tốc độ học"]
    example: "mỗi bước tính 100 ms, trao đổi gradient 30 ms nối tiếp → hiệu suất 100/130 ≈ 76,9%; chồng được 20 ms trong lúc tính → 100/110 ≈ 90,9% (VER PAR:L11)"
    fix: ["8 GPU với lô mỗi GPU cố định là lô toàn cục gấp 8 — kết quả hội tụ có thể đổi; không chỉ là chạy nhanh hơn"]
  - id: L12
    title: "Tình huống chuyên gia: 8 GPU mà chỉ nhanh gấp 3 — tìm phần tuần tự"
    spec: lessons/par/L12_tinh_huong_8_gpu.yaml
    requires: [L00, L07, L11]
    objectives: ["Lập ngân sách thời gian một bước huấn luyện từ số đo", "Áp định luật Amdahl để biết sửa phần nào trước"]
    example: "đo một GPU: nạp dữ liệu tuần tự chiếm 25% thời gian bước; 8 GPU → tối đa 1 / (0,25 + 0,75/8) ≈ 2,91 lần (đúng con số 3 lần quan sát); nạp song song đưa phần tuần tự về 2% → 1 / (0,02 + 0,98/8) ≈ 7,02 lần (VER PAR:L12)"
    fix: ["Chuyên gia đo trước khi mua thêm phần cứng: thêm GPU khi phần tuần tự là 25% chỉ đưa 8 GPU lên 16 GPU được ≈ 3,37 lần"]
  - id: L13
    title: "Hành trình: bộ xử lý đồ hoạ từ vẽ hình tới huấn luyện trên hàng trăm thẻ"
    spec: lessons/par/L13_hanh_trinh_gpu.yaml
    requires: [L08, L10, L11, L12]
    requires_ext: ["CSA:L16"]
    # Nguồn (đọc nguyên văn 2026-11-02, câu trích ở audit/par/sources_L13.md): J. Owens và cộng sự, A Survey of General-Purpose
    #   Computation on Graphics Hardware (Eurographics 2005, bản trên research.nvidia.com) [OW05]; J. Nickolls, I. Buck, M. Garland,
    #   K. Skadron, Scalable Parallel Programming with CUDA (ACM Queue 6(2), 2008; queue.acm.org trả 403, đọc bản chép của khoá học
    #   tại grothoff.org) [NI08]; A. Krizhevsky, I. Sutskever, G. Hinton, ImageNet Classification with Deep Convolutional Neural Networks
    #   (NIPS 2012, papers.nips.cc) [KR12]; P. Goyal và cộng sự, Accurate, Large Minibatch SGD: Training ImageNet in 1 Hour
    #   (arXiv 1706.02677, 2017) [GO17]; A. Sergeev, M. Del Balso, Horovod: fast and easy distributed deep learning in TensorFlow
    #   (arXiv 1802.05799, 2018) [HO18].
    objectives: ["Kể lại năm chặng từ 2005 tới 2018: mượn ống vẽ hình, mô hình lập trình riêng, hai thẻ cho một mạng nơ-ron, 256 thẻ trong một giờ, thư viện mở dùng chung", "Tính lại con số của từng chặng bằng kiến thức của khoá (tỉ lệ đỉnh tính, nhóm 32 luồng, bộ nhớ trọng số, hiệu suất mở rộng, lưu lượng vòng)", "Chọn số thẻ và cách gộp gradient cho quy mô của mình, kèm điều kiện đổi lựa chọn"]
    example: "2005: 63 so với 14,8 tỉ phép mỗi giây ≈ 4,26 lần (CITED OW05); 2007: 24 nhóm × 32 luồng = 768 luồng mỗi cụm, 14 cụm × 8 lõi = 112 lõi, thẻ lớn nhất 12 288 luồng = 16 cụm (CITED NI08); 2012: 60 triệu tham số, mạng chia đôi trên hai thẻ 3 GB, 90 lượt × 1,2 triệu ảnh trong 5–6 ngày ≈ 208–250 ảnh mỗi giây (CITED KR12); 2017: 29 giờ trên 8 thẻ × 8/256 = 0,906 giờ lý tưởng, chia hiệu suất 90% ≈ 1,007 giờ ≈ 1 giờ; tốc độ học 0,1 × 8192/256 = 3,2, mỗi thẻ vẫn 8192/256 = 32 ảnh (CITED GO17); 2018: 128 thẻ mất nửa tài nguyên (50%) so với 88% → nhanh gấp 1,76 ≈ “khoảng hai lần”; mỗi máy gửi 2 · 127/128 ≈ 1,98 lần dung lượng gradient (CITED HO18) (VER PAR:L13)"
    fix: ["Chỉ dạy điều năm nguồn ghi: không kể “GPU nhanh gấp 100 lần” chung chung (NI08 chỉ ghi “100 lần hoặc hơn” cho một số ứng dụng đã tối ưu); không nói AlexNet là mạng đầu tiên chạy trên GPU (KR12 không ghi vậy)", "Hiệu suất 90% của GO17 là khi đi từ 8 lên 256 thẻ, không phải từ 1 thẻ"]
