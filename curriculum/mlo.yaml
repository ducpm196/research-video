    spec: lessons/mlo/L12_the_mo_hinh_cong_bang.yaml
    requires: [L07]
    requires_ext: ["DSC:L13"]
    objectives: ["Viết thẻ mô hình", "Đo chỉ số theo từng nhóm người dùng", "Biết bỏ cột nhạy cảm không làm mô hình công bằng"]
    example: "900 mẫu đa số đúng 846 (94%), 100 mẫu thiểu số đúng 75 (75%): độ chính xác chung 92,1% che mất nhóm 75% (VER MLO:L12)"
    fix: ["Bỏ cột giới tính không làm mô hình công bằng — các cột khác có thể thay thế nó"]
  - id: L13
    title: "Bảo mật hệ học máy: đầu độc dữ liệu, rò rỉ dữ liệu huấn luyện, đầu vào đối kháng"
    spec: lessons/mlo/L13_bao_mat_he_ml.yaml
    requires: [L12]
    requires_ext: ["SWF:L12"]
    objectives: ["Liệt kê bề mặt tấn công của hệ học máy", "Hiểu đầu độc dữ liệu cài cửa sau", "Áp dụng kiểm soát nguồn dữ liệu, giới hạn truy vấn, kiểm mã băm và chữ ký"]
    example: "chèn 20 mẫu có dấu hiệu, nhãn sai, vào 400 mẫu sạch: độ chính xác trên dữ liệu sạch vẫn 99%, nhưng 75% mẫu gắn dấu hiệu bị đổi nhãn (mô phỏng, VER MLO:L13)"
    fix: ["Mô hình không phải hộp kín an toàn — truy vấn lặp có thể làm lộ thông tin về dữ liệu huấn luyện"]
  - id: L14
    title: "Tình huống chuyên gia theo dòng thời gian: từ nợ kỹ thuật tới nền tảng học máy"
    spec: lessons/mlo/L14_hanh_trinh_no_ky_thuat.yaml
    requires: [L02, L05, L06, L07]
    kind: journey
    objectives: ["Kể lại hành trình đưa học máy vào sản phẩm ở Google qua bốn chặng từ 2007 tới 2020, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại tỉ lệ mã học máy so với mã keo, mức giảm độ trễ khi tách luồng nạp mô hình và số cấu hình triển khai khi thêm phụ thuộc", "Chọn mức đầu tư hạ tầng hợp với quy mô đội của chính mình, kèm điều kiện đổi lựa chọn"]
    example: "465 triệu USD trong 45 phút ≈ 10,3 triệu mỗi phút (SC15); hệ 100 000 dòng (số minh hoạ): 5% = 5000 dòng mã học máy, 95 000 dòng mã keo (SC15); phân vị 99,9 khi nạp mô hình 500–1500 ms → 75–150 ms, giảm 6,7–10 lần (TX17); 3 · 3 · 2 = 18 cấu hình triển khai (TH20) (VER MLO:L14)"
    fix: ["Chỉ khẳng định điều có trong SC15, TX17, TH20 (audit/mlo/sources_L14.md); SC15 viết Knight Capital mất tiền “apparently” vì nhánh mã thử nghiệm cũ — giữ chữ “có vẻ”, không dạy chi tiết sự cố ngoài câu đó", "“2%” của TX17 là mức tăng lượt cài ứng dụng sau khi bỏ lệch huấn luyện–phục vụ; 1 000 000 lượt cài, hệ 100 000 dòng, các mức lợi ích của từng giai đoạn, đội 3 người là số minh hoạ", "Hình các khối quanh “mã học máy” của SC15 là ảnh, nhãn các khối không đọc được → không chép nhãn; bài vẽ thanh tỉ lệ 5/95 tính lại"]
