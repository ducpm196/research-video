    spec: lessons/mlo/L10_hieu_chuan.yaml
    requires: [L08]
    requires_ext: ["CS115:L20", "CS115:L21"]
    objectives: ["Hiểu hiệu chuẩn là gì", "Tính điểm Brier", "Biết độ chính xác không đo hiệu chuẩn"]
    example: "dự đoán (0,9; 0,8; 0,3; 0,6) với nhãn (1, 1, 0, 0): điểm Brier = 0,125 (VER MLO:L10)"
    fix: ["Mô hình phân loại đúng nhiều vẫn có thể báo xác suất sai lệch — độ chính xác không đo hiệu chuẩn"]
  - id: L11
    title: "Tối ưu mô hình để triển khai: lượng tử hoá, chưng cất"
    spec: lessons/mlo/L11_luong_tu_hoa.yaml
    requires: [L06]
    requires_ext: ["CSA:L03"]
    objectives: ["Tính bộ nhớ theo kiểu số", "Ước lượng sai số lượng tử hoá", "Biết vì sao phải đánh giá lại sau khi tối ưu"]
    example: "int8 đối xứng trên [−2, 2]: 1,3 → 83 → 1,3071; 7 tỉ tham số: 28 GB ở float32, 7 GB ở int8 (VER MLO:L11)"
    fix: ["Lượng tử hoá phải đánh giá lại trên dữ liệu thật — sai số nhỏ từng số có thể cộng dồn qua nhiều lớp"]
  - id: L12
