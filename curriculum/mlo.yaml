# Giáo án KẾ HOẠCH — MLO · MLOps: đưa mô hình học máy vào vận hành
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã MLO:Lxx.
# Căn cứ phạm vi: ACM DSTF 2021 — Machine Learning (ML), Software Development and Maintenance (SDM), Professionalism (PR) (CITED, sha256 eaa9929c6b74446c).
#   Tài liệu nêu tên (CITED theo tên, câu chữ chưa tra lại — NOT_VERIFIED): Sculley et al. (2015) “Hidden Technical Debt in Machine
#   Learning Systems”; Mitchell et al. (2019) “Model Cards for Model Reporting”. Ngưỡng PSI (0,1 và 0,25, Siddiqi 2006) là quy ước kinh nghiệm, không phải định lý.
# Vì sao cần: CS115 dạy huấn luyện và đánh giá mô hình; DSC dạy bẫy dữ liệu; DVO/CLD dạy phát hành phần mềm. Mô hình ML có thêm
#   phụ thuộc vào DỮ LIỆU thay đổi theo thời gian — phải phiên bản hoá, giám sát trôi, huấn luyện lại, phát hành an toàn.
# Thứ tự học: sau CS115 L19, L21; DSC L08, L10, L11; DVO L03–L07; CLD L05, L11.
course: MLO
status: planned
lessons:
  - id: L00
    title: "Vòng đời mô hình trong sản xuất và nợ kỹ thuật của hệ học máy"
    spec: lessons/mlo/L00_vong_doi_mo_hinh.yaml
    requires: []
    requires_ext: ["DVO:L00", "CS115:L19"]
    objectives: ["Mô tả vòng dữ liệu – huấn luyện – đánh giá – triển khai – giám sát", "Nhận ra phần mã mô hình chỉ là phần nhỏ của hệ thống", "Hiểu vì sao mô hình tốt lúc huấn luyện có thể kém dần khi chạy thật"]
    example: "mô hình phân loại thư rác: thu dữ liệu, gán nhãn, đặc trưng, huấn luyện, phục vụ, giám sát, gán nhãn lại"
    fix: ["Điểm cao trên tập kiểm tra lúc huấn luyện không bảo đảm chạy tốt khi dữ liệu thật thay đổi"]
  - id: L01
    title: "Tái lập: hạt giống, mã, dữ liệu, môi trường"
    spec: lessons/mlo/L01_tai_lap.yaml
    requires: [L00]
    requires_ext: ["DSC:L14"]
    objectives: ["Liệt kê mọi thứ cần ghi lại để tái lập một lần huấn luyện", "Dùng hạt giống ngẫu nhiên đúng cách", "Giải thích vì sao tính song song có thể cho kết quả không tất định"]
    example: "cùng hạt giống 42 → cùng cách chia tập huấn luyện/kiểm tra; đổi hạt giống → chia khác (VER MLO:L01)"
    fix: ["Ghi lại hạt giống chưa đủ nếu phiên bản thư viện hay dữ liệu đã đổi"]
  - id: L02
    title: "Phiên bản hoá dữ liệu và dòng dõi"
    spec: lessons/mlo/L02_phien_ban_du_lieu.yaml
    requires: [L01]
    requires_ext: ["DBS:L00"]
    objectives: ["Nhận diện phiên bản dữ liệu bằng mã băm nội dung", "Truy ngược mô hình về dữ liệu và mã đã dùng", "Phân biệt tên tệp với phiên bản"]
    example: "đổi đúng một nhãn trong tệp → mã băm nội dung đổi hoàn toàn (VER MLO:L02)"
    fix: ["Đặt tên tệp “data_final_v2_moi.csv” không phải là phiên bản hoá"]
  - id: L03
    title: "Kiểm thử cho hệ học máy: dữ liệu, mô hình, hành vi"
    spec: lessons/mlo/L03_kiem_thu_he_ml.yaml
    requires: [L02]
    requires_ext: ["DVO:L03"]
    objectives: ["Viết kiểm thử lược đồ và phân bố dữ liệu", "Viết kiểm thử hành vi bất biến của mô hình", "Kiểm theo từng nhóm, không chỉ điểm tổng"]
    example: "kiểm thử bất biến: thay tên An, Hùng, Lan trong cùng một câu khen — mô hình lỗi đổi nhãn khi gặp “Hùng”, mô hình đúng không đổi (VER MLO:L03)"
    fix: ["Kiểm thử chỉ so điểm tổng có thể bỏ sót mô hình hỏng trên một nhóm nhỏ"]
  - id: L04
    title: "Theo dõi thí nghiệm và chọn mô hình không quá khớp tập kiểm định"
    spec: lessons/mlo/L04_theo_doi_thi_nghiem.yaml
    requires: [L01]
    requires_ext: ["DSC:L09"]
    objectives: ["Ghi lại mọi lần chạy và siêu tham số", "Giải thích quá khớp tập kiểm định khi chọn nhiều lần", "Giữ một tập kiểm tra chỉ dùng một lần"]
    example: "200 “mô hình” đoán bừa, chọn cái tốt nhất trên cùng tập kiểm định 100 mẫu → điểm 0,61 dù mọi mô hình chỉ đúng 50% (VER MLO:L04)"
    fix: ["Thử nhiều cấu hình rồi báo điểm tốt nhất trên tập kiểm định là đánh giá lạc quan giả"]
  - id: L05
    title: "Kho đặc trưng và lệch huấn luyện–phục vụ"
    spec: lessons/mlo/L05_lech_huan_luyen_phuc_vu.yaml
    requires: [L02]
    requires_ext: ["DSC:L10"]
    objectives: ["Dùng chung một mã tính đặc trưng cho huấn luyện và phục vụ", "Phát hiện lệch huấn luyện–phục vụ", "Tránh dùng thông tin tương lai khi tính đặc trưng"]
    example: "huấn luyện chuẩn hoá bằng trung bình 50, phục vụ dùng 60 → cùng giá trị 70 thành 2,0 và 1,0 (VER MLO:L05)"
    fix: ["Viết lại mã đặc trưng bằng ngôn ngữ khác cho phần phục vụ là một nguồn lệch hay gặp"]
  - id: L06
    title: "Phục vụ mô hình: theo lô, trực tuyến, độ trễ và thông lượng"
    spec: lessons/mlo/L06_phuc_vu_mo_hinh.yaml
    requires: [L05]
    requires_ext: ["CLD:L10"]
    objectives: ["Chọn dự đoán theo lô hay trực tuyến", "Đánh đổi gộp lô với độ trễ", "Đặt giới hạn thời gian chờ khi gộp lô"]
    example: "100 yêu cầu/s, gộp lô 32: yêu cầu đầu chờ thêm 310 ms; thông lượng 1600/s so với 200/s khi chạy từng cái (lô 20 ms, đơn 5 ms) (VER MLO:L06)"
    fix: ["Đo độ trễ trung bình che mất p99 — người dùng cảm nhận đuôi chậm"]
  - id: L07
    title: "Phát hành mô hình an toàn: chạy bóng, canary, thử nghiệm A/B"
    spec: lessons/mlo/L07_phat_hanh_mo_hinh.yaml
    requires: [L06]
    requires_ext: ["DVO:L07", "DSC:L08"]
    objectives: ["Chạy mô hình mới song song không ảnh hưởng người dùng", "Đo hiệu quả kinh doanh bằng thử nghiệm hai nhóm", "Biết điểm ngoại tuyến tốt hơn chưa chắc tốt hơn khi chạy thật"]
    example: "mô hình mới chạy bóng một tuần: ghi dự đoán nhưng vẫn trả kết quả của mô hình cũ, rồi so"
    fix: ["Điểm ngoại tuyến tốt hơn chưa chắc làm chỉ số kinh doanh tốt hơn"]
  - id: L08
    title: "Giám sát trôi dữ liệu"
    spec: lessons/mlo/L08_giam_sat_troi.yaml
    requires: [L06]
    requires_ext: ["CS115:L44"]
    objectives: ["Tính chỉ số ổn định quần thể", "Chọn đặc trưng và ngưỡng cần theo dõi", "Biết trôi đầu vào chưa chắc làm mô hình kém đi"]
    example: "phân bố huấn luyện 25% mỗi khoảng, hiện tại 10/20/30/40%: PSI ≈ 0,228 (VER MLO:L08)"
    fix: ["Phân bố đầu vào trôi chưa chắc làm mô hình kém đi — cần theo dõi cả chất lượng khi có nhãn"]
  - id: L09
    title: "Trôi khái niệm, vòng phản hồi và huấn luyện lại"
    spec: lessons/mlo/L09_troi_khai_niem.yaml
    requires: [L08]
    objectives: ["Phân biệt trôi dữ liệu và trôi khái niệm", "Nhận ra vòng phản hồi do chính mô hình gây ra", "Huấn luyện lại có kiểm tra trước khi thay"]
    example: "5 món ngang nhau, mỗi vòng chỉ hiện 2 món nhiều lượt nhất: sau 10 vòng 2 món đó chiếm 88% lượt, 3 món còn lại đứng yên (VER MLO:L09)"
    fix: ["Huấn luyện lại theo lịch cố định không thay được việc kiểm tra mô hình mới trước khi thay"]
