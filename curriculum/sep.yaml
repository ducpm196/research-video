# Giáo án KẾ HOẠCH — SEP · Xã hội, đạo đức và nghề nghiệp trong tin học
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã SEP:Lxx (xác suất định danh lại, các độ đo công bằng trên bảng nhầm lẫn,
#   bảng tương thích giấy phép, kỳ vọng rủi ro, năng lượng huấn luyện, ước lượng ba điểm).
# Căn cứ phạm vi (CITED): CS2023 lĩnh vực SEP (Society, Ethics, and the Profession); ACM Code of Ethics and Professional Conduct (2018) —
#   tên từng nguyên tắc phải đối chiếu nguyên văn trước khi dựng video (trang acm.org chặn tải trong phiên 2026-10-30, NOT_VERIFIED;
#   2026-11-02: đã đọc nguyên văn bản PDF chính thức trên acm.org — CITED, câu trích ở audit/sep/sources_L00.md);
#   Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15 (thông qua 26/6/2025, hiệu lực 1/1/2026) và Nghị định 356/2025/NĐ-CP — CITED qua cổng thông tin
#   Hà Tĩnh và thư viện pháp luật, đọc 2026-10-30; L. Sweeney, “Simple Demographics Often Identify People Uniquely” (2000);
#   A. Chouldechova (Big Data 2017), J. Kleinberg, S. Mullainathan, M. Raghavan (ITCS 2017) — không thể thoả đồng thời mọi tiêu chí công bằng;
#   giấy phép MIT, Apache 2.0, GPL 3.0 (văn bản giấy phép gốc); Google Project Zero, chính sách công bố 90 ngày; npm, “kik, left-pad, and npm” (3/2016) — đọc trong phiên.
# Vì sao cần: DSC L13 có quyền riêng tư và ẩn danh hoá; MLO L12 có thẻ mô hình và công bằng; SEC dạy an toàn. Chưa có khoá dạy trách nhiệm nghề nghiệp
#   như một năng lực: pháp lý dữ liệu, công bằng có định lượng, giấy phép, rủi ro, môi trường, công bố lỗ hổng, cam kết và ước lượng.
# Thứ tự học: sau DSC L13, CS115 L21; nên học trước khi làm sản phẩm thật.
course: SEP
status: planned
lessons:
  - id: L00
    title: "Trách nhiệm nghề nghiệp: ai chịu hậu quả của phần mềm"
    spec: lessons/sep/L00_trach_nhiem_nghe_nghiep.yaml
    requires: []
    objectives: ["Liệt kê các bên chịu ảnh hưởng của một quyết định kỹ thuật, kể cả người không dùng sản phẩm", "Tính số người bị ảnh hưởng n × p và xác suất thử n người mà không thấy lỗi nào (1 − p) mũ n", "Đọc một bộ quy tắc đạo đức nghề nghiệp như công cụ ra quyết định, không như thuật toán", "Quyết định cách phát hành dần để lỗi hiếm lộ ra khi còn ít người bị ảnh hưởng"]
    example: "một thay đổi thuật toán xếp hạng ảnh hưởng 1 triệu người dùng, 1% bị xếp sai → 10 000 người; cùng tỉ lệ lỗi trên 100 người thử, trung bình chỉ 1 người gặp lỗi và 0,99^100 ≈ 0,366 — khoảng 37% khả năng không ai gặp (VER SEP:L00)"
    fix: ["“Tôi chỉ làm theo yêu cầu” không bỏ được trách nhiệm — người hiểu rõ rủi ro kỹ thuật nhất có nghĩa vụ nói ra"]
  - id: L01
    title: "Dữ liệu cá nhân: tối thiểu hoá, mục đích, và vì sao ẩn danh khó"
    spec: lessons/sep/L01_du_lieu_ca_nhan.yaml
    requires: [L00]
    requires_ext: ["DSC:L13", "DMS:L19"]
    objectives: ["Đếm số tổ hợp của các thuộc tính giữ lại và ước lượng khả năng một người là duy nhất bằng (1 − 1/c) mũ (N − 1)", "Giải thích vì sao xoá tên chưa phải là khử nhận dạng, và mã hoá vẫn là dữ liệu cá nhân", "Áp nguyên tắc chỉ thu và chỉ chia sẻ dữ liệu cần cho mục đích đã nói, kèm thời hạn lưu", "Quyết định giữ thuộc tính nào khi chia sẻ một bộ dữ liệu cho đối tác"]
    example: "ngày sinh (365 · 80 năm) × giới tính = 58 400 tổ hợp, một khu vực 10 000 người: xác suất một người không trùng tổ hợp với ai ≈ (1 − 1/58 400)^9999 ≈ 0,843 — xoá tên vẫn nhận ra được phần lớn (VER SEP:L01)"
    fix: ["Luật Bảo vệ dữ liệu cá nhân 2025 có hiệu lực từ 1/1/2026 — điều khoản cụ thể (mức phạt, chuyển dữ liệu ra nước ngoài) phải đọc từ toàn văn, không từ bài tóm tắt"]
  - id: L02
    title: "Công bằng có định lượng: các tiêu chí và vì sao không thể đạt tất cả"
    spec: lessons/sep/L02_cong_bang.yaml
    requires: [L00]
    requires_ext: ["CS115:L21"]
    objectives: ["Tính tỉ lệ được chọn, tỉ lệ dương thật, tỉ lệ dương giả và giá trị dự đoán dương cho từng nhóm từ bảng nhầm lẫn", "Suy ra liên hệ giữa tỉ lệ dương giả, tỉ lệ nền và giá trị dự đoán dương, rồi kiểm bằng số", "Giải thích vì sao khi tỉ lệ nền khác nhau, không thể làm mọi tiêu chí bằng nhau cùng lúc", "Chọn tiêu chí ưu tiên theo hậu quả của từng loại sai trong một bối cảnh cụ thể"]
    example: "nhóm A tỉ lệ nền 50%, nhóm B 20%, bộ phân loại có cùng tỉ lệ dương thật 0,8 và dương giả 0,1 cho cả hai nhóm: giá trị dự đoán dương A ≈ 0,889, B ≈ 0,667; tỉ lệ được chọn A 45%, B 24% (VER SEP:L02)"
    fix: ["Bỏ thuộc tính nhạy cảm khỏi đầu vào không làm mô hình công bằng — các biến khác (khu vực, trường học) mang thông tin thay thế"]
  - id: L03
    title: "Giải thích được và trách nhiệm giải trình: lý do phản chứng"
    spec: lessons/sep/L03_giai_thich_duoc.yaml
    requires: [L02]
    requires_ext: ["CS115:L18"]
    objectives: ["Tính khoảng thiếu tới ngưỡng và thay đổi nhỏ nhất của từng thuộc tính làm đổi quyết định của một mô hình điểm tuyến tính", "Viết một lý do phản chứng chỉ dùng thuộc tính người được giải thích thay đổi được", "Nhận ra khi giải thích bằng mô hình xấp xỉ sai ở đúng trường hợp cần giải thích", "Ghi lại một quyết định đủ để kiểm tra và tái hiện về sau"]
    example: "điểm = 0,5 · thu nhập (triệu) + 2 · năm làm việc, ngưỡng 20: người có thu nhập 20, 3 năm → 16, bị từ chối; cần thêm 8 triệu thu nhập hoặc 2 năm làm việc để đạt 20 (VER SEP:L03)"
    fix: ["Giải thích một mô hình phức tạp bằng mô hình đơn giản xấp xỉ có thể sai ở đúng trường hợp cần giải thích"]
  - id: L04
    title: "Giấy phép phần mềm và mã nguồn mở"
    spec: lessons/sep/L04_giay_phep.yaml
    requires: [L00]
    see_also: ["DVO:L02"]      # liên quan, không bắt buộc học trước
    objectives: ["Phân biệt nghĩa vụ của giấy phép dễ dãi (giữ thông báo) và giấy phép buộc mở mã (cả tác phẩm theo cùng giấy phép khi phân phối)", "Kiểm một danh sách phụ thuộc, kể cả phụ thuộc gián tiếp, có phân phối được trong sản phẩm đóng không", "Giải thích vì sao mã không ghi giấy phép không phải là “miễn phí dùng”", "Quyết định thay, giữ hay mở mã khi gặp một thư viện buộc mở mã"]
    example: "sản phẩm đóng cài trên máy khách (có phân phối bản sao), phụ thuộc gồm 2 thư viện MIT, 1 Apache 2.0, 1 GPL-3.0: ba thư viện đầu được dùng — MIT giữ thông báo bản quyền và giấy phép, Apache 2.0 kèm thêm bản giấy phép, nội dung tệp NOTICE nếu có, đánh dấu tệp đã sửa; thư viện GPL-3.0 nếu kết hợp với mã của ta thành một chương trình rồi phân phối thì cả khối phải theo GPL-3.0, kèm mã nguồn → thay thư viện, mở mã, hoặc không phân phối kiểu đó; kiểm cả 4 + 4 × 3 = 16 gói gián tiếp (số minh hoạ) (VER SEP:L04)"
    fix: ["Mã trên mạng không ghi giấy phép không phải là “miễn phí dùng” — mặc định là giữ mọi quyền"]
  - id: L05
    title: "Rủi ro và an toàn: khả năng nhân hậu quả, và khi nào phải dừng"
    spec: lessons/sep/L05_rui_ro.yaml
    requires: [L00]
    objectives: ["Tính kỳ vọng thiệt hại p × D và xếp hạng các rủi ro theo nó, không theo xác suất", "Tính khả năng có ít nhất một sự cố khi cùng một rủi ro lặp trên nhiều máy hoặc nhiều năm", "Giải thích vì sao hậu quả không đảo ngược được cần ngưỡng riêng, không chỉ kỳ vọng", "Quyết định khi nào dừng phát hành, dựa trên con số và nguyên tắc nghề nghiệp"]
    example: "lỗi A xác suất 0,001 mỗi năm, thiệt hại 1 triệu → kỳ vọng 1000; lỗi B xác suất 0,1, thiệt hại 1000 → kỳ vọng 100: A ưu tiên hơn dù hiếm gấp 100 lần (VER SEP:L05)"
    # Sửa 2026-11-02: fix cũ viện dẫn hai sự cố có thật như “sự kiện không thể xảy ra” — chưa có nguồn đọc nguyên văn, đã bỏ (xem audit/sep/sources_L05.md).
    fix: ["Xác suất nhỏ nhân với nhiều lần chạy không còn nhỏ: 0,001 mỗi năm trên 1000 hệ thống → khả năng có ít nhất một sự cố trong năm 1 − 0,999^1000 ≈ 0,632 (VER SEP:L05)"]
  - id: L06
    title: "Tác động môi trường của tính toán: năng lượng và phát thải"
    spec: lessons/sep/L06_moi_truong.yaml
    requires: [L00]
    see_also: ["PAR:L11"]      # liên quan, không bắt buộc học trước
    objectives: ["Ước lượng điện năng một lần huấn luyện từ số thiết bị, công suất, thời gian và hệ số điện năng của trung tâm dữ liệu", "Đổi điện năng thành khí thải bằng hệ số phát thải của lưới điện, và giải thích vì sao mỗi nơi khác nhau", "So sánh chi phí huấn luyện với chi phí phục vụ cả vòng đời, rồi chọn chỗ nên tối ưu"]
    example: "8 GPU × 0,4 kW × 720 giờ × PUE 1,2 = 2764,8 kWh; với hệ số 0,5 kg CO₂ mỗi kWh (số minh hoạ — mỗi lưới điện khác nhau) ≈ 1382 kg (VER SEP:L06)"
    fix: ["Phục vụ một mô hình hàng tỉ lượt có thể tốn nhiều điện hơn huấn luyện — đo cả hai"]
  - id: L07
    title: "Công bố lỗ hổng có phối hợp"
    spec: lessons/sep/L07_cong_bo_lo_hong.yaml
    requires: [L00]
    see_also: ["SEC:L14"]      # liên quan, không bắt buộc học trước
    objectives: ["Mô tả quy trình báo riêng cho bên sửa, chờ bản vá, rồi mới công bố chi tiết", "Tính hạn vá và ngày công bố theo chính sách 90+30 bằng lịch thật, kể cả năm nhuận và trường hợp lỗi đang bị khai thác", "Cân giữa việc người dùng cần biết để tự bảo vệ và việc kẻ xấu chưa biết chi tiết, rồi quyết định nên làm gì khi tự tìm thấy lỗ hổng"]
    example: "chính sách 90+30 (CITED trang chính sách công bố của Project Zero, đọc 2026-11-02): báo ngày 1/1/2025 → hạn vá ngày 90 = 1/4/2025; vá ở ngày 47 (17/2) → công bố chi tiết ở ngày 77 = 19/3; không vá kịp → công bố ở ngày 90; Heartbleed (CVE-2014-0160): bản sửa OpenSSL 1.0.1g phát hành ngày 7/4/2014 (CITED heartbleed.com) (VER SEP:L07)"
    fix: ["Công bố chi tiết khai thác trước khi có bản vá đặt người dùng vào nguy hiểm; giữ kín mãi thì bên sửa không có động lực", "Bản giáo án cũ ghi “hạn công bố 1/4” — theo chính sách hiện hành 90+30 thì ngày 90 là hạn VÁ; nếu đã vá, chi tiết công bố 30 ngày sau bản vá (sửa 2026-11-02)"]
  - id: L08
    title: "Ra quyết định khi các bên xung đột lợi ích"
    spec: lessons/sep/L08_xung_dot_loi_ich.yaml
    requires: [L02, L05]
    objectives: ["Lập bảng bên liên quan × ảnh hưởng × khả năng lên tiếng, kể cả bên không có mặt trong cuộc họp", "Áp luật ba bước: loại phương án gây hại cho một bên trước, so tổng điểm sau, hoà thì ưu tiên bên yếu thế", "Giải thích vì sao tối đa tổng điểm có thể che một tác hại nặng"]
    example: "3 phương án × 4 bên (công ty, khách, nhà hàng, tài xế), chấm −2 đến 2 (số minh hoạ): X = [2, 2, 2, −2] tổng cao nhất 4 nhưng gây hại −2 cho tài xế — bên vắng mặt; Y = [1, 1, 1, 0] và Z = [0, 1, 1, 1] cùng tổng 3, không bên nào dưới 0 → chọn theo ràng buộc “không gây hại nặng” trước, tổng điểm sau; hoà thì ưu tiên bên yếu thế (ACM 1.1) → Z (VER SEP:L08)"
    # Sửa 2026-11-02: bản cũ ghi X = [2, 2, 3, −2] tổng 5 — điểm 3 nằm ngoài thang −2…2; với một bên −2 thì tổng lớn nhất chỉ là 4.
    fix: ["Bên ít tiếng nói nhất (người không dùng sản phẩm nhưng bị ảnh hưởng) thường bị bỏ khỏi bảng — phải chủ động thêm vào"]
  - id: L09
    title: "Ước lượng, cam kết và nói “chưa được”"
    spec: lessons/sep/L09_uoc_luong_cam_ket.yaml
    requires: [L00]
    requires_ext: ["DMS:L19"]
    objectives: ["Tính ước lượng ba điểm (O + 4M + B)/6 và độ lệch (B − O)/6 cho một việc và cho nhiều việc", "Cam kết theo khoảng có lý do, không theo một con số khả dĩ", "Nói “chưa được” bằng số liệu: nêu ước lượng, rủi ro lớn nhất, và phương án đổi phạm vi"]
    example: "lạc quan 2 ngày, khả dĩ 4, bi quan 12 → (2 + 16 + 12)/6 = 5 ngày, độ lệch (12 − 2)/6 ≈ 1,67; hứa “4 ngày” là hứa theo kịch bản khả dĩ, dễ trễ (VER SEP:L09)"
    fix: ["Ước lượng không phải đàm phán — rút ngắn ước lượng để làm vui lòng người nghe là chuyển rủi ro sang sau"]
  - id: L10
    title: "Tình huống chuyên gia: một gói nhỏ bị gỡ và trách nhiệm mỗi bên"
    spec: lessons/sep/L10_tinh_huong_left_pad.yaml
    requires: [L04, L08]
    see_also: ["DVO:L12"]      # liên quan, không bắt buộc học trước
    objectives: ["Dựng dòng thời gian của sự cố từ dữ kiện đã ghi, tách khỏi suy đoán", "Lập chuỗi phụ thuộc bắc cầu dẫn tới sự cố và đếm số gói gián tiếp", "Đề xuất trách nhiệm của từng bên: tác giả gói, kho gói, người dùng gói", "Quyết định cách gỡ một gói của mình và cách giữ bản dựng của đội không phụ thuộc may rủi"]
    example: "tháng 3/2016 (CITED npm blog): tác giả gỡ gói kik và 272 gói khác (273 gói), trong đó có left-pad; từ ngay sau 14:30 giờ Thái Bình Dương ngày 22/3 xuất hiện hàng trăm lỗi mỗi phút khi các dự án phụ thuộc gián tiếp không tải được; bản 1.0.0 đăng lại không khớp chuỗi yêu cầu đúng 0.0.3; xong lúc 16:55 (14:30 → 16:55 = 145 phút ≈ 2,4 giờ, nguồn ghi 2,5 giờ); mỗi gói dùng 3 gói, sâu 3 tầng → 3 + 9 + 27 = 39 gói gián tiếp (số minh hoạ) (VER SEP:L10)"
    fix: ["“11 dòng” là chi tiết hay được nhắc nhưng không có trong bài của npm — chỉ dạy điều nguồn gốc ghi; bài học là phụ thuộc bắc cầu và khoá phiên bản, không phải “đừng dùng gói nhỏ”"]
  - id: L11
    title: "Tình huống theo dòng thời gian: bảo vệ dữ liệu cá nhân 2000–2026"
    spec: lessons/sep/L11_hanh_trinh_du_lieu_ca_nhan.yaml
    requires: [L01, L05, L10]
    kind: journey
    objectives: ["Kể lại hành trình bảo vệ dữ liệu cá nhân qua năm chặng 2000, 2018, 2023, 2025, 2026–2031, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại con số then chốt: số tổ hợp thuộc tính, tỉ lệ người duy nhất, hạn báo vi phạm, mức phạt tối đa theo doanh thu, ngưỡng quy mô", "Tra một văn bản luật đúng cách: số hiệu, ngày ban hành, ngày hiệu lực, văn bản bị thay thế", "Chọn việc cần làm cho một sản phẩm ở quy mô của mình, kèm điều kiện đổi lựa chọn"]
