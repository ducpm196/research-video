# Giáo án KẾ HOẠCH — LLM · Mô hình ngôn ngữ lớn
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã LLM:Lxx (đếm bigram bằng Fraction, BPE chạy thật, softmax, nhị thức).
# Căn cứ phạm vi: CS2023 AI — “Machine Learning”, “Natural Language Processing” (sha256 c51b590a2a6e6d98); D. Jurafsky, J. H. Martin,
#   Speech and Language Processing (bản 3, nháp 2024) chương 3 (n-gram, độ hỗn loạn), 2 (BPE), 6 (vector nhúng), 10 (mô hình ngôn ngữ lớn);
#   R. Sennrich và cộng sự (2016) — BPE (ví dụ low/lower/newest/widest chạy lại bằng máy); J. Kaplan và cộng sự (2020) — C ≈ 6ND;
#   J. Hoffmann và cộng sự (2022) — ≈ 20 từ tố mỗi tham số; E. Hu và cộng sự (2021) — LoRA; R. Bradley, M. Terry (1952); P. Lewis và cộng sự (2020) — RAG.
# Vì sao cần: CS115 L41 dạy attention và Transformer như một kiến trúc; chưa có khoá nào dạy MÔ HÌNH NGÔN NGỮ: xác suất chuỗi, từ tố, huấn luyện,
#   sinh văn bản, tinh chỉnh, căn chỉnh, đánh giá, ảo giác, truy xuất — nền bắt buộc cho AI agent (AGT).
# Thứ tự học: sau CS115 L13, L20, L22, L41; DSC L09 (kiểm định nhiều lần); MLO L10, L11.
course: LLM
status: planned
lessons:
  - id: L00
    title: "Mô hình ngôn ngữ: xác suất của một chuỗi và quy tắc chuỗi"
    spec: lessons/llm/L00_mo_hinh_ngon_ngu.yaml
    requires: []
    requires_ext: ["CS115:L13"]
    objectives: ["Viết xác suất chuỗi bằng quy tắc chuỗi", "Giải thích dự đoán từ tố kế tiếp"]
    example: "kho 3 câu “tôi thích mèo / tôi thích chó / bạn thích mèo”, mô hình bigram: P(<s> tôi thích mèo </s>) = 2/3 · 1 · 2/3 · 1 = 4/9 (VER LLM:L00)"
    fix: ["Mô hình ngôn ngữ cho xác suất của CHUỖI, không phải xác suất câu đó “đúng sự thật”"]
  - id: L01
    title: "Mô hình n-gram, làm trơn và độ hỗn loạn"
    spec: lessons/llm/L01_ngram_do_hon_loan.yaml
    requires: [L00]
    objectives: ["Tính độ hỗn loạn trên tập kiểm tra", "Giải thích vì sao cần làm trơn"]
    example: "câu trên có xác suất 4/9 qua 4 bước dự đoán → độ hỗn loạn (4/9)^(−1/4) ≈ 1,225; câu “chó thích mèo” chứa cặp chưa gặp (<s>, chó) nên xác suất 0; làm trơn cộng 1 (6 từ có thể đứng sau) cho 1/504 (VER LLM:L01)"
    fix: ["Chỉ so độ hỗn loạn giữa các mô hình dùng CÙNG bộ từ tố và cùng tập kiểm tra"]
  - id: L02
    title: "Tách từ tố: mã hoá cặp byte (BPE)"
    spec: lessons/llm/L02_tach_tu_to.yaml
    requires: [L00]
    objectives: ["Chạy vài bước gộp của BPE", "Giải thích vì sao số từ tố của cùng một văn bản khác nhau giữa các ngôn ngữ"]
    example: "kho “low ×5, lower ×2, newest ×6, widest ×3”: bốn lần gộp đầu là e+s (9), es+t (9), est+</w> (9), l+o (7) (VER LLM:L02)"
    fix: ["Giá và giới hạn ngữ cảnh tính theo TỪ TỐ, không theo từ — tiếng Việt có dấu thường tốn nhiều từ tố hơn tiếng Anh cùng nội dung"]
  - id: L03
    title: "Vector nhúng và độ tương tự cosin"
    spec: lessons/llm/L03_vector_nhung.yaml
    requires: [L00]
    requires_ext: ["CS115:L01"]
    objectives: ["Tính độ tương tự cosin", "Giải thích giả thuyết phân bố: từ cùng ngữ cảnh thì nghĩa gần"]
    example: "cos((1, 2, 0), (2, 3, 1)) ≈ 0,956; cos((1, 2, 0), (−2, 1, 0)) = 0 (vuông góc) (VER LLM:L03)"
    fix: ["Độ tương tự cao giữa hai vector nhúng không có nghĩa là đồng nghĩa — từ trái nghĩa thường xuất hiện cùng ngữ cảnh"]
  - id: L04
    title: "Transformer giải mã: mặt nạ nhân quả và vị trí"
    spec: lessons/llm/L04_giai_ma_nhan_qua.yaml
    requires: [L03]
    requires_ext: ["CS115:L41"]
    objectives: ["Giải thích mặt nạ nhân quả", "Giải thích vì sao cần thông tin vị trí"]
    example: "chuỗi 4 từ tố, mặt nạ nhân quả: mỗi vị trí chỉ nhìn chính nó và các vị trí trước → 4 · 5 / 2 = 10 cặp được phép trong 16 (VER LLM:L04)"
    fix: ["Không có thông tin vị trí, attention không phân biệt được “chó cắn người” với “người cắn chó”"]
  - id: L05
    title: "Chi phí tính toán: tham số, phép tính và bộ nhớ đệm khoá–giá trị"
    spec: lessons/llm/L05_chi_phi_tinh_toan.yaml
    requires: [L04]
    requires_ext: ["MLO:L11"]
    objectives: ["Ước lượng bộ nhớ đệm khoá–giá trị khi sinh", "Giải thích vì sao sinh văn bản bị giới hạn bởi băng thông bộ nhớ"]
    example: "32 tầng, chiều 4096, ngữ cảnh 4096 từ tố, 2 byte mỗi số: bộ nhớ đệm khoá–giá trị = 2 · 32 · 4096 · 4096 · 2 byte = 2 GiB cho MỘT chuỗi (VER LLM:L05)"
    fix: ["Bộ nhớ đệm khoá–giá trị tăng tuyến tính theo độ dài ngữ cảnh và theo số chuỗi phục vụ cùng lúc"]
  - id: L06
    title: "Huấn luyện trước: mất mát entropy chéo và quy luật mở rộng"
    spec: lessons/llm/L06_huan_luyen_truoc.yaml
    requires: [L01, L05]
    requires_ext: ["CS115:L20"]
    objectives: ["Liên hệ mất mát entropy chéo với độ hỗn loạn", "Ước lượng ngân sách tính toán bằng C ≈ 6ND"]
    example: "mất mát 2,0 (cơ số e) ↔ độ hỗn loạn e² ≈ 7,39; mô hình 7 tỉ tham số theo tỉ lệ ≈ 20 từ tố mỗi tham số cần ≈ 140 tỉ từ tố, C ≈ 6 · 7·10⁹ · 1,4·10¹¹ ≈ 5,9·10²¹ phép tính (VER LLM:L06)"
    fix: ["Tỉ lệ 20 từ tố mỗi tham số là điểm tối ưu tính toán theo một nghiên cứu (2022), không phải luật — nhiều mô hình hiện nay huấn luyện lâu hơn để suy luận rẻ hơn"]
  - id: L07
    title: "Sinh văn bản: tham lam, nhiệt độ, top-k, top-p"
    spec: lessons/llm/L07_sinh_van_ban.yaml
    requires: [L04]
    requires_ext: ["CS115:L20"]
    objectives: ["Tính phân phối sau khi chia nhiệt độ", "So sánh top-k và top-p"]
    example: "điểm (2, 1, 0): nhiệt độ 1 → (0,665; 0,245; 0,090); nhiệt độ 0,5 → (0,867; 0,117; 0,016); top-p 0,9 ở nhiệt độ 1 giữ hai từ tố đầu (0,910) (VER LLM:L07)"
    fix: ["Nhiệt độ 0 (tham lam) vẫn có thể cho kết quả khác nhau giữa các lần chạy do tính toán song song trên dấu phẩy động"]
  - id: L08
    title: "Tinh chỉnh: toàn bộ tham số và hạng thấp (LoRA)"
    spec: lessons/llm/L08_tinh_chinh.yaml
    requires: [L06]
    objectives: ["Đếm tham số huấn luyện của LoRA", "Biết khi nào tinh chỉnh, khi nào chỉ cần viết lời nhắc hay truy xuất"]
    example: "ma trận 4096 × 4096 (16 777 216 tham số), LoRA hạng 8: 2 · 4096 · 8 = 65 536 tham số, ≈ 0,39% (VER LLM:L08)"
    fix: ["Tinh chỉnh dạy HÀNH VI và định dạng; muốn mô hình biết dữ kiện mới, cập nhật thường xuyên thì truy xuất thường hợp hơn"]
  - id: L09
    title: "Học theo chỉ dẫn và căn chỉnh theo đánh giá của con người"
    spec: lessons/llm/L09_can_chinh.yaml
    requires: [L08]
    objectives: ["Giải thích mô hình phần thưởng từ so sánh cặp", "Nêu giới hạn: khai thác lỗ hổng phần thưởng"]
    example: "mô hình Bradley–Terry: phần thưởng 1,0 và 0,0 → xác suất người chấm chọn câu thứ nhất σ(1) ≈ 0,731 (VER LLM:L09)"
    fix: ["Tối ưu quá mạnh theo mô hình phần thưởng làm mô hình học “điều được chấm cao”, không phải “điều đúng”"]
  - id: L10
    title: "Đánh giá mô hình ngôn ngữ: bộ kiểm tra, nhiễm dữ liệu, khoảng tin cậy"
    spec: lessons/llm/L10_danh_gia.yaml
    requires: [L07]
    requires_ext: ["DSC:L09", "CS115:L44"]
    objectives: ["Tính khoảng tin cậy của độ chính xác", "Nhận ra nhiễm dữ liệu kiểm tra"]
    example: "500 câu hỏi, đúng 82%: khoảng tin cậy 95% ≈ ±1,96·√(0,82·0,18/500) ≈ ±3,4 điểm phần trăm → hơn kém 2 điểm chưa chắc là khác biệt thật (VER LLM:L10)"
    fix: ["Bộ kiểm tra công khai có thể đã lọt vào dữ liệu huấn luyện — điểm cao không chứng minh năng lực tổng quát"]
  - id: L11
    title: "Ảo giác, hiệu chuẩn và tự nhất quán"
    spec: lessons/llm/L11_ao_giac_hieu_chuan.yaml
    requires: [L10]
    requires_ext: ["MLO:L10"]
    objectives: ["Giải thích vì sao mô hình sinh câu trôi chảy nhưng sai", "Tính lợi ích của biểu quyết đa số và điều kiện của nó"]
    example: "mỗi lần sinh đúng với xác suất 0,6, ĐỘC LẬP: biểu quyết đa số 5 lần đúng với xác suất ≈ 0,683 (VER LLM:L11)"
    fix: ["Các lần sinh từ cùng một mô hình thường sai GIỐNG nhau — không độc lập, nên biểu quyết cải thiện ít hơn công thức"]
  - id: L12
    title: "Sinh có truy xuất (RAG): chỉ mục, tìm kiếm, ghép ngữ cảnh"
    spec: lessons/llm/L12_sinh_co_truy_xuat.yaml
    requires: [L03, L11]
    requires_ext: ["DBS:L09"]
    objectives: ["Mô tả đường ống chia đoạn, nhúng, tìm k đoạn gần nhất, ghép lời nhắc", "Đo độ phủ@k của bước truy xuất"]
    example: "câu hỏi gần đoạn A (cos 0,956) hơn đoạn B (cos 0): truy xuất top-1 lấy A; độ phủ@k = số câu hỏi có đoạn đúng trong k đoạn đầu / tổng số câu (VER LLM:L12)"
    fix: ["Truy xuất sai thì mô hình trả lời sai một cách tự tin — đánh giá RIÊNG bước truy xuất trước khi đánh giá câu trả lời"]
  - id: L13
    title: "Ngữ cảnh dài và suy luận hiệu quả"
    spec: lessons/llm/L13_ngu_canh_dai.yaml
    requires: [L05, L12]
    objectives: ["Giải thích chi phí bậc hai của attention", "Nêu các cách giảm chi phí: lượng tử hoá, gộp lô, giải mã suy đoán"]
    example: "tăng ngữ cảnh từ 4 nghìn lên 32 nghìn từ tố: phép tính attention tăng (32/4)² = 64 lần, bộ nhớ đệm khoá–giá trị tăng 8 lần (VER LLM:L13)"
    fix: ["Ngữ cảnh dài không có nghĩa là mô hình dùng tốt mọi phần — thông tin ở giữa ngữ cảnh dài thường bị bỏ sót"]
  - id: L14
    title: "Tình huống chuyên gia theo dòng thời gian: từ kiến trúc chú ý tới huấn luyện tối ưu tính toán"
    spec: lessons/llm/L14_hanh_trinh_mo_rong.yaml
    requires: [L04, L05, L06, L10]
    requires_ext: ["CS115:L41"]
    kind: journey
    objectives: ["Kể lại hành trình mở rộng mô hình ngôn ngữ qua năm chặng (2017 → 2022), mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại số phép tính huấn luyện bằng C ≈ 6ND, số giờ huấn luyện từ số bước, tỉ lệ từ tố trên tham số", "Chia một ngân sách tính toán cho kích thước mô hình và dữ liệu ở quy mô của mình, kèm điều kiện đổi lựa chọn"]
    example: "GPT-3: 6 · 174,6·10⁹ · 3·10¹¹ ≈ 3,14·10²³ phép tính ≈ 3640 PF-ngày (B20 bảng D.1); Chinchilla 70·10⁹ tham số, 1,4·10¹² từ tố → 20 từ tố mỗi tham số, 6ND ≈ 5,9·10²³ ≈ ngân sách Gopher 5,76·10²³; Transformer lớn 300 000 bước × 1 s ≈ 3,47 ngày (VER LLM:L14)"
    fix: ["Chỉ khẳng định điều có trong V17, K20, B20, H22 (audit/llm/sources_L14.md); “20 từ tố mỗi tham số” là tỉ lệ đọc ra từ bảng 3 của H22, nguồn không viết thành câu", "Không dùng điểm EN-FR của V17 (bản v7 ghi 41.8 và 41.0 ở hai chỗ); không dạy số thẻ, số ngày, chi phí bằng tiền của GPT-3 (nguồn không ghi)", "Ngân sách 4,8·10²⁰ phép tính, 1 tỉ từ tố phục vụ mỗi ngày trong quiz là số minh hoạ; nhiều lượt trên cùng dữ liệu nằm ngoài vùng H22 đã kiểm"]
