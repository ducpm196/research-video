#   — audit/cs112/AUDIT_CS112.md + audit/cs112/verify_cs112.py (32 PASS · 15 FIX · 0 FAIL, 2026-10-27).
# `orig` = số hiệu trong bản thảo. Đổi thứ tự so với bản thảo (AUDIT §3.1): bản thảo dùng O(1), O(log n), O(V + E) ở các bài cấu trúc
