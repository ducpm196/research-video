# Giáo án KẾ HOẠCH — DAN · Phân tích dữ liệu: chỉ số, SQL phân tích, nhóm người dùng, phễu, chuỗi thời gian
# Trạng thái: planned. Ví dụ đã kiểm: audit/verify_plan_curricula.py, mã DAN:Lxx (sqlite3 3.49 thật cho hàm cửa sổ, phép tính tay, thống kê bền vững).
# Căn cứ phạm vi: ACM DSTF 2021 — “Data Acquisition, Management, and Governance”, “Data Analysis and Presentation”; CS2023 DM (SQL phân tích);
#   R. Hyndman, G. Athanasopoulos, Forecasting: Principles and Practice (bản 3, 2021) — trung bình trượt, dự báo ngây thơ theo mùa, MAE/MAPE;
#   E. B. Wilson (1927) — khoảng tin cậy cho tỉ lệ; P. Rousseeuw, C. Croux (1993) — MAD; tài liệu SQLite “Window Functions” (bản hiện hành).
# Vì sao cần: DSC dạy thống kê và suy luận (ngoại lai, tương quan, A/B, rò rỉ); DBS dạy SQL và chuẩn hoá. Còn thiếu tầng PHÂN TÍCH THỰC HÀNH hằng ngày:
#   định nghĩa chỉ số, gộp nhóm đúng, nối không nhân dòng, hàm cửa sổ, nhóm người dùng theo kỳ, phễu, chuỗi thời gian, dự báo cơ sở, phân khúc,
#   cảnh báo chỉ số, tỉ lệ trên mẫu nhỏ, bảng điều khiển. Không lặp DSC: bài nào cần nền thống kê thì dẫn DSC.
# Thứ tự học: sau DBS L02–L03, DSC L00–L08; trước MLO.
course: DAN
status: planned
lessons:
  - id: L00
    title: "Câu hỏi phân tích và định nghĩa chỉ số"
    spec: lessons/dan/L00_dinh_nghia_chi_so.yaml
    requires: []
    requires_ext: ["DSC:L00", "DBS:L02"]
    objectives: ["Viết định nghĩa chỉ số đủ chặt để hai người tính ra cùng số", "Phân biệt chỉ số mục tiêu và chỉ số bảo vệ", "Bắt đầu phân tích từ câu hỏi quyết định"]
    example: "“người dùng hoạt động hôm nay” = có đăng nhập, hay = có ít nhất một thao tác: cùng nhật ký 6 người cho 6 và 4 — định nghĩa phải ghi rõ sự kiện, khoảng thời gian, múi giờ (VER DAN:L00)"
    fix: ["Một chỉ số không có định nghĩa viết ra thì mỗi nhóm tính một kiểu — các báo cáo “vênh” nhau mà không ai sai"]
  - id: L01
    title: "Gộp nhóm và bẫy trung bình của trung bình"
    spec: lessons/dan/L01_trung_binh_cua_trung_binh.yaml
    requires: [L00]
    requires_ext: ["DBS:L03"]
    objectives: ["Tính trung bình có trọng số đúng", "Nhận ra khi trung bình các nhóm không phải trung bình chung", "Giữ tử số và mẫu số khi gộp tiếp"]
    example: "cửa hàng A 100 đơn trung bình 50, cửa hàng B 10 đơn trung bình 200: trung bình hai trung bình = 125, giá trị đơn trung bình thật = (100·50 + 10·200) / 110 ≈ 63,64 (VER DAN:L01)"
    fix: ["Gộp tiếp từ bảng đã gộp chỉ đúng với tổng và đếm; trung bình, trung vị, tỉ lệ phải tính lại từ tử số và mẫu số"]
  - id: L02
    title: "Nối bảng làm nhân dòng: đếm trùng khi tính tổng"
    spec: lessons/dan/L02_noi_nhan_dong.yaml
    requires: [L01]
    requires_ext: ["DBS:L02"]
    objectives: ["Nhận ra quan hệ một–nhiều trước khi cộng", "Gộp trước rồi mới nối", "Kiểm số dòng sau mỗi phép nối"]
    example: "2 đơn tổng 100 và 50, đơn 1 có 3 dòng hàng: nối đơn với dòng hàng rồi cộng tổng đơn ra 350 thay vì 150 (sqlite3, VER DAN:L02)"
    fix: ["Kiểm số dòng trước và sau mỗi phép nối — số dòng tăng là dấu hiệu nhân dòng"]
  - id: L03
    title: "Hàm cửa sổ: tổng lũy kế, so với kỳ trước, xếp hạng"
    spec: lessons/dan/L03_ham_cua_so.yaml
    requires: [L01]
    requires_ext: ["DBS:L03"]
    objectives: ["Viết tổng lũy kế và chênh lệch so với kỳ trước", "Phân biệt hàm cửa sổ với gom nhóm", "Chọn cách xếp hạng khi có giá trị bằng nhau"]
    example: "doanh thu 4 ngày 10, 30, 20, 40: tổng lũy kế 10, 40, 60, 100; chênh so với hôm trước —, 20, −10, 20; xếp hạng 4, 2, 3, 1 (sqlite3 3.49, VER DAN:L03)"
    fix: ["Thiếu ORDER BY trong cửa sổ thì LAG lấy “hôm trước” theo thứ tự máy tình cờ đọc, không được bảo đảm, còn SUM(tien) OVER () cho tổng cả bảng trên mọi dòng — không còn là lũy kế", "Khung mặc định khi có ORDER BY là RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW: các dòng trùng ngày cùng nhận một lũy kế — muốn đi từng dòng thì dùng ROWS kèm thứ tự phụ"]
  - id: L04
    title: "Phân tích nhóm người dùng theo kỳ: giữ chân người dùng"
    spec: lessons/dan/L04_nhom_nguoi_dung.yaml
    requires: [L03]
    objectives: ["Dựng bảng giữ chân theo nhóm tháng đăng ký", "Đọc bảng theo hàng, cột, đường chéo", "Không để tăng trưởng che lấp giữ chân kém"]
    example: "nhóm tháng 1 có 100 người: tháng sau còn 30, tháng thứ ba còn 18 → giữ chân 30%, 18%; nhóm tháng 2 có 120 người, tháng sau còn 45 → 37,5% — giữ chân cải thiện; hai nhóm khác cỡ nên so bằng tỉ lệ, mẫu số luôn là cỡ nhóm ban đầu (VER DAN:L04)"
    fix: ["Gộp mọi người dùng vào một con số giữ chân trộn lẫn nhóm cũ và mới — tăng trưởng nhanh che lấp giữ chân kém"]
  - id: L05
    title: "Phễu chuyển đổi: từng bước và toàn phễu"
    spec: lessons/dan/L05_pheu_chuyen_doi.yaml
    requires: [L03]
    objectives: ["Tính tỉ lệ chuyển từng bước và toàn phễu", "Bắt thứ tự thời gian của các bước", "Ước lượng tác động khi cải thiện một bước"]
    example: "10 000 xem → 4000 thêm giỏ → 1200 thanh toán → 300 hoàn tất: từng bước 40%, 30%, 25%; toàn phễu 3% (VER DAN:L05)"
    fix: ["Đếm người có bước 3 mà không kiểm đã có bước 2 TRƯỚC đó thì phễu không còn là phễu"]
  - id: L06
    title: "Chuỗi thời gian: xu hướng, mùa vụ, trung bình trượt"
    spec: lessons/dan/L06_chuoi_thoi_gian.yaml
    requires: [L03]
    requires_ext: ["DSC:L04"]
    objectives: ["Tách xu hướng khỏi mùa vụ theo tuần", "Chọn cửa sổ trung bình trượt bằng chu kỳ mùa vụ", "So cùng kỳ thay cho so liền kề"]
    example: "doanh thu tăng 2 mỗi ngày, cuối tuần cộng 30: trung bình trượt 7 ngày khử hẳn mùa vụ, các giá trị liên tiếp chỉ còn tăng đều 2 (VER DAN:L06)"
    fix: ["So hôm nay với hôm qua khi có mùa vụ tuần là so thứ Bảy với thứ Sáu — so cùng thứ tuần trước"]
  - id: L07
    title: "Dự báo đường cơ sở và đo sai số dự báo"
    spec: lessons/dan/L07_du_bao_co_so.yaml
    requires: [L06]
    objectives: ["Dựng dự báo ngây thơ và ngây thơ theo mùa", "Chọn thước đo sai số phù hợp", "Đánh giá mô hình trên dữ liệu chưa thấy"]
    example: "thực tế 0, 10, 12, 8, dự báo 2, 9, 12, 10: sai số tuyệt đối trung bình 1,25; sai số phần trăm không xác định vì có giá trị 0 (VER DAN:L07)"
    fix: ["Mô hình phức tạp phải thắng dự báo ngây thơ theo mùa trên dữ liệu kiểm tra mới đáng dùng"]
  - id: L08
    title: "Phân khúc khách hàng và phân bố lệch"
    spec: lessons/dan/L08_phan_khuc.yaml
    requires: [L01]
    objectives: ["Tính tỉ trọng doanh thu của nhóm khách hàng đầu", "Mô tả phân bố lệch bằng trung vị và tỉ trọng", "Nhận biết ba chiều phân khúc: gần đây, tần suất, giá trị"]
    example: "10 khách doanh thu 500, 200, 100, 60, 40, 30, 30, 20, 10, 10: 20% khách đầu chiếm 700 / 1000 = 70% doanh thu (VER DAN:L08)"
    fix: ["Trung bình trên phân bố lệch mạnh không mô tả “khách điển hình” — báo cả trung vị và tỉ trọng nhóm đầu"]
  - id: L09
    title: "Phát hiện bất thường trong chỉ số"
    spec: lessons/dan/L09_bat_thuong.yaml
    requires: [L06]
    requires_ext: ["DSC:L04"]
    objectives: ["Dùng trung vị và độ lệch tuyệt đối trung vị thay cho trung bình và độ lệch chuẩn", "So với cùng kỳ để tránh báo động vì mùa vụ", "Đặt ngưỡng cảnh báo có lý do"]
    example: "8 ngày 100, 102, 98, 101, 99, 103, 100, 500: điểm z của 500 chỉ 2,65 (bị chính nó kéo lệch chuẩn); điểm bền vững theo trung vị 100,5 và MAD 1,5 ≈ 179,6 (VER DAN:L09)"
    fix: ["Ngoại lai làm phình độ lệch chuẩn nên tự che chính nó — ngưỡng z = 3 bỏ sót"]
  - id: L10
    title: "Tỉ lệ trên mẫu nhỏ: khoảng tin cậy và xếp hạng"
    spec: lessons/dan/L10_ti_le_mau_nho.yaml
    requires: [L05]
    requires_ext: ["DSC:L08"]
    objectives: ["Tính khoảng tin cậy cho một tỉ lệ", "Xếp hạng theo cận dưới thay vì tỉ lệ thô", "Biết vì sao công thức xấp xỉ chuẩn hỏng ở mẫu nhỏ"]
    example: "sản phẩm A 2/2 lượt mua (100%), B 150/1000 (15%): khoảng Wilson 95% của A là [0,342; 1], của B là [0,129; 0,173] — A chưa chắc tốt hơn (VER DAN:L10)"
    fix: ["Xếp hạng theo tỉ lệ thô đưa các mục ít dữ liệu lên đầu và xuống cuối một cách ngẫu nhiên"]
  - id: L11
    title: "Bảng điều khiển chỉ số và cảnh báo đáng tin"
    spec: lessons/dan/L11_bang_dieu_khien.yaml
    requires: [L00, L09]
    requires_ext: ["DSC:L05", "DSC:L14"]
    objectives: ["Dựng cây chỉ số từ chỉ số mục tiêu xuống chỉ số thành phần", "Vẽ biểu đồ không phóng đại", "Thiết kế cảnh báo ít báo động giả"]
    example: "trục tung bắt đầu từ 95 thay vì 0: cột 105 trông cao gấp (105 − 95)/(100 − 95) = 2 lần cột 100, trong khi chỉ hơn 5% (VER DAN:L11)"
    fix: ["Cảnh báo kêu mỗi ngày sẽ bị tắt — mỗi cảnh báo phải có người nhận, ngưỡng có lý do và việc cần làm"]
  - id: L12
    title: "Tình huống chuyên gia theo dòng thời gian: thử nghiệm có đối chứng ở quy mô lớn"
    spec: lessons/dan/L12_hanh_trinh_thu_nghiem_ab.yaml
    requires: [L10, L11]
    requires_ext: ["DSC:L08", "DSC:L09"]
    kind: journey
    objectives: ["Kể lại hành trình thử nghiệm có đối chứng trực tuyến qua năm chặng từ 2007 tới 2019, mỗi chặng một điểm nghẽn và một cách xử lý", "Tính lại cỡ mẫu, thời gian chạy khi chia lệch, xác suất báo nhầm khi thử nhiều phiên bản và phép kiểm tỉ lệ chia nhóm", "Chọn cách chạy thử nghiệm hợp với lượng người dùng của chính mình, kèm điều kiện đổi lựa chọn"]
    example: "cỡ mẫu (4 · 2 · 30 / 0,1875)² = 1 638 400 (KO07: “over 1.6 million”), tỉ lệ mua 486 400 → 20% còn 30 400 (KO07); chia 99/1 chạy lâu 1/(4 · 0,01 · 0,99) ≈ 25 lần (KO07); 1 − 0,975⁵ ≈ 11,9% (KO13: “12%”), 1 − 0,975³⁰ ≈ 53,2%; 5¹⁵ = 30 517 578 125 ≈ 30 tỉ phiên bản (KO13); lỗi thiếu một ô 499/999: 1 triệu người lệch 1,0 sai số chuẩn, 10 triệu người 3,17 (số minh hoạ, VER DAN:L12)"
    fix: ["Chỉ khẳng định điều có trong KO07, KO09, KO12, KO13, DE13, GU19, FA19 (audit/dan/sources_L12.md); ngưỡng giá trị p để báo lệch tỉ lệ chia nhóm không có trong FA19 — bài chỉ dùng 1,96 và nói rõ là phép tính của bài", "1000 người · 2 phiên · 3 truy vấn, 10 chỉ số mỗi cặp, tương quan 0,7, 1 triệu / 10 triệu người, cửa hàng 20 000 người mỗi tuần là số minh hoạ; bài O’Brien–Fleming 1979 không đọc — chỉ dạy hai ngưỡng KO13 ghi", "Lời đọc không nói “A/B”, “OEC”, “HiPPO”, “SRM”: dùng tên tiếng Việt mô tả"]
