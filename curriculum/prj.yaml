course: PRJ
status: active
lab: {lang: [py], requires: [PYT:L04]}
lessons:
- id: L00
  title: Dự án Chặng 1 — Sổ giao dịch dòng lệnh đa công cụ
  spec: lessons/prj/L00_du_an_chang_1_cli_giao_dich.yaml
  requires: []
  requires_ext:
  - FND:L10
  - JV2:L09
  - PYT:L13
  objectives:
  - Chuẩn hoá tệp giao dịch CSV đầu vào, tách dòng hợp lệ và đếm chính xác dòng lỗi định dạng
  - Tính tổng nạp, tổng rút, số dư ròng từng tài khoản bằng cả quy trình Python và đối chiếu SQLite
  - Chấm tự động qua `bash labs/cham.sh PRJ L00 ...` đạt đủ ca công khai và ca ẩn
  example: '4 dòng hợp lệ (+1000, -300, +500, -200) và 1 dòng lỗi: số dư ròng = 1 000, tỷ lệ hợp lệ = 80,0% (VER PRJ:L00)'
  fix:
  - Không nuốt dòng lỗi im lặng; luôn tách riêng vào báo cáo đếm lỗi để tránh sai tổng sổ
- id: L01
  title: Dự án Chặng 2 — Lõi chuyển khoản bút toán kép và khoá bất biến
  spec: lessons/prj/L01_du_an_chang_2_but_toan_kep.yaml
  requires:
  - L00
  requires_ext:
  - BNK:L14
  objectives:
  - Thiết kế bảng bút toán kép bảo toàn bất biến tổng nợ bằng tổng có trong mọi giao dịch
  - Chống bế tắc bằng quy tắc khoá hai tài khoản theo thứ tự mã tăng dần
  - Kiểm chứng bằng kịch bản SQL/Python với cả giao dịch thành công và giao dịch từ chối thiếu số dư
  example: '3 giao dịch (chuyển 300 thành công, chuyển 900 bị từ chối, chuyển 150 kèm phí 5 thành công): tổng đại số mọi bút
    toán = 0 (VER PRJ:L01)'
  fix:
  - Cập nhật số dư trực tiếp không ghi bảng bút toán kép làm mất dấu vết kiểm toán khi đối soát
- id: L02
  title: Dự án Chặng 3 — Cổng tích hợp bảo mật, lũy đẳng và truy vấn lớn
  spec: lessons/prj/L02_du_an_chang_3_cong_tich_hop.yaml
  requires:
  - L01
  requires_ext:
  - BNX:L38
  - SPB:L12
  objectives:
  - Kiểm tra cấu trúc thẻ truy cập JWT (hạn dùng, chữ ký HMAC) trước khi nhận yêu cầu
  - Cài đặt bảng khử trùng theo Idempotency-Key bảo đảm gửi lại 10 lần chỉ trừ tiền 1 lần
  - Đo chi phí phân trang theo con trỏ (keyset) so với OFFSET ở mốc 100 000 dòng
  example: '5 yêu cầu gồm 2 khoá trùng: chỉ thực hiện 3 giao dịch thật với tổng tiền 1 200 (chứ không phải 2 000) (VER PRJ:L02)'
  fix:
  - Khử trùng chỉ trong RAM mất sạch khi máy khởi động lại; bản chạy thật phải lưu bảng khoá có chỉ mục duy nhất
- id: L03
  title: Tình huống Chặng 4 — Đối soát ba bên và bảo vệ thiết kế phỏng vấn
  spec: lessons/prj/L03_du_an_chang_4_doi_soat_phong_van.yaml
  requires:
  - L02
  requires_ext:
  - INT:L08
  - ACB:L08
  objectives:
  - Thực hiện đối soát ba bên giữa sổ Ngân hàng, mạng Na-pát và Đối tác theo mã tham chiếu
  - Phân loại chính xác giao dịch khớp cả ba, lệch trạng thái và thiếu một chiều
  - Trình bày ngắn gọn đánh đổi O(n log n) và bảng phương án khi phỏng vấn
  example: '5 giao dịch (3 khớp cả ba, 1 thiếu ở đối tác, 1 thừa ở Na-pát): 3 khớp (60,0%) và 2 ca cần tra soát (VER PRJ:L03)'
  fix:
  - Không sửa số liệu sổ chính ngay khi lệch đối soát; ghi bản ghi chênh lệch chờ xác nhận quy trình hoàn/bù
- id: L04
  title: Dự án Chặng 5 — Bộ giải Đồ thị luồng tiền và Tối ưu hồi quy
  spec: lessons/prj/L04_du_an_chang_5_toan_thuat_toan.yaml
  requires:
  - L03
  requires_ext:
  - DMS:L20
  - CS112:L29
  - CS115:L44
  objectives:
  - Tìm tuyến chuyển tiền phí thấp nhất trên đồ thị có trọng số không âm bằng thuật toán Dijkstra
  - Ước lượng đường xu hướng tuyến tính bằng công thức đóng và kiểm sai số bình phương trung bình
  - Đối chiếu phức tạp O((V+E) log V) so với quét toàn bộ đường đi ở quy mô lớn
  example: 'đồ thị 4 ngân hàng trung gian: đường đi A→D trực tiếp tốn 15, đường qua A→B→C→D chỉ tốn 2 + 3 + 4 = 9 (VER PRJ:L04)'
  fix:
  - Dijkstra sai nếu có cạnh phí âm (chiết khấu âm); khi đó phải kiểm tra điều kiện trọng số không âm trước khi chạy
- id: L05
  title: Dự án Chặng 6 — Giải mã khung nhị phân & lập lịch đa nhân
  spec: lessons/prj/L05_du_an_chang_6_bo_giai_khung_lap_lich.yaml
  requires:
  - L04
  objectives:
  - Giải mã cấu trúc khung gói nhị phân gồm header 4 byte và tải bằng Python struct
  - Cài bộ lập lịch Round Robin với lượng tử q = 4 cho danh sách tác vụ khung
  - Đánh giá tải tính toán và chiến lược phân luồng khi lưu lượng tăng từ 1 000 lên 1 000 000 khung/s
  example: Dự án chốt L05 kiểm thử tự động 100 điểm qua labs/cham.sh
  fix:
  - Tách mã nghiệm thu dự án rõ ràng từng bước và bảo toàn bất biến
- id: L06
  title: Dự án Chặng 7 — Nhật ký HMAC có chỉ mục SQLite & bảo vệ tốc độ
  spec: lessons/prj/L06_du_an_chang_7_nhat_ky_hmac_sqlite.yaml
  requires:
  - L05
  objectives:
  - Lưu nhật ký vào cơ sở dữ liệu SQLite có chỉ mục B-Tree và dùng truy vấn tham số hoá
  - Ký và kiểm chứng toàn vẹn từng bản ghi nhật ký bằng HMAC-SHA256
  - Đánh giá chi phí quét có chỉ mục khi bảng nhật ký mở rộng tới hàng triệu dòng
  example: Dự án chốt L06 kiểm thử tự động 100 điểm qua labs/cham.sh
  fix:
  - Tách mã nghiệm thu dự án rõ ràng từng bước và bảo toàn bất biến
- id: L07
  title: Dự án Chặng 8 — Đường ống Outbox, Băm nhất quán & Circuit Breaker
  spec: lessons/prj/L07_du_an_chang_8_duong_ong_outbox_cb.yaml
  requires:
  - L06
  objectives:
  - Ghi đơn hàng và hàng đợi Outbox trong cùng giao dịch SQLite bảo đảm không mất sự kiện
  - Ánh xạ khoá đơn hàng tới các phân vùng nút bằng thuật toán băm nhất quán SHA-256
  - Cài máy trạng thái Circuit Breaker tự ngắt sang OPEN sau 3 lỗi liên tiếp
  example: Dự án chốt L07 kiểm thử tự động 100 điểm qua labs/cham.sh
  fix:
