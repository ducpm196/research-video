scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một lần huấn luyện, không có lần thứ hai"
    checks:
      - "round(6 * 174.6e9 * 3e11 / 1e23, 2) == 3.14"
      - "280 / 70 == 4"
    steps:
      - show: |
          <p>Năm 2020, mô hình GPT-3 (<b>175 tỉ</b> tham số) tốn khoảng 3,14 · 10²³ phép tính để huấn luyện. Nhóm tác giả ghi: một lỗi trong bước lọc làm sót một phần câu kiểm tra trong dữ liệu, và vì chi phí, <b>không thể huấn luyện lại</b>.</p>
          <p>Năm 2022, với cùng ngân sách của một mô hình <b>280 tỉ</b> tham số, một mô hình chỉ <b>70 tỉ</b> tham số nhưng đọc nhiều dữ liệu hơn lại thắng trên hầu hết các bài kiểm tra.</p>
          <div class="box key">Hôm nay: năm chặng từ 2017 tới 2022 — chia ngân sách tính toán thế nào, khi chỉ được chạy một lần?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, năm 2020, mô hình GPT-3 với 175 tỉ tham số tốn khoảng 3 phẩy 14 nhân 10 mũ 23 phép tính để huấn luyện. Nhóm tác giả ghi rằng một lỗi trong bước lọc làm sót một phần câu kiểm tra trong dữ liệu, và vì chi phí, họ không thể huấn luyện lại. Năm 2022, với cùng ngân sách của một mô hình 280 tỉ tham số, một mô hình chỉ 70 tỉ tham số nhưng đọc nhiều dữ liệu hơn lại thắng trên hầu hết bài kiểm tra. Hôm nay ta đi qua năm chặng từ 2017 tới 2022, để biết chia ngân sách tính toán thế nào khi chỉ được chạy một lần."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "1 + 2 + 3 + 4 == 10"
      - "12 * 2 * 2 ** 2 == 96"
      - "6 * 7e9 * 1.4e11 == 5.88e21 and 20 * 7e9 == 1.4e11"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 4</td><td><b>chú ý nhân quả</b>: vị trí thứ i chỉ nhìn các vị trí không lớn hơn i; mọi vị trí tính cùng một lượt</td><td>chuỗi 4 từ tố: 1 + 2 + 3 + 4 = 10 ô được phép</td></tr>
          <tr><td>bài 5</td><td><b>số tham số</b> ≈ 12 · L · d², với L tầng, chiều d</td><td>L = 2, d = 2: 12 · 2 · 4 = 96</td></tr>
          <tr><td>bài 6</td><td><b>số phép tính huấn luyện</b> C ≈ 6 · N · D; tối ưu khi D ≈ 20 · N</td><td>N = 7 tỉ → D = 140 tỉ, C ≈ 5,88 · 10²¹</td></tr>
          <tr><td>bài 10</td><td><b>nhiễm dữ liệu</b>: câu kiểm tra đã nằm trong dữ liệu huấn luyện → điểm cao vì nhớ</td><td>điểm đo được cao hơn năng lực thật</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 4, với chú ý nhân quả, vị trí thứ i chỉ nhìn các vị trí không lớn hơn i, và mọi vị trí được tính cùng một lượt. Chuỗi 4 từ tố có 1 cộng 2 cộng 3 cộng 4, bằng 10 ô được phép. Ở bài 5, số tham số xấp xỉ 12 nhân L nhân d bình phương, nên L bằng 2, d bằng 2 cho 96. Ở bài 6, số phép tính huấn luyện xấp xỉ 6 nhân N nhân D, và tối ưu khi D xấp xỉ 20 nhân N. Mô hình 7 tỉ tham số cần 140 tỉ từ tố, khoảng 5 phẩy 88 nhân 10 mũ 21 phép tính. Ở bài 10, nhiễm dữ liệu là khi câu kiểm tra đã nằm trong dữ liệu huấn luyện, nên điểm cao vì nhớ."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    checks:
      - "10**15 * 86400 == 8.64e19"
      - "round(4 * 0.8, 2) == 3.2 and round(4 * 0.8 * 0.8, 2) == 2.56"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>ngân sách tính toán</b></td><td>tổng số phép tính được phép dùng cho một lần huấn luyện, biết trước từ số thẻ và số ngày thuê</td></tr>
          <tr><td><b>quy luật mở rộng</b></td><td>mất mát giảm đều theo <b>hàm lũy thừa</b> khi tăng tham số, dữ liệu, phép tính: mỗi lần nhân N lên 10, mất mát nhân với cùng một hệ số nhỏ hơn 1 (số minh hoạ: hệ số 0,8 cho 4 → 3,2 → 2,56)</td></tr>
          <tr><td><b>ngoại suy</b></td><td>đo trên mô hình nhỏ, kéo dài đường xu hướng để đoán mô hình lớn</td></tr>
          <tr><td><b>tối ưu tính toán</b></td><td>với một ngân sách cố định, cách chia N và D cho mất mát nhỏ nhất</td></tr>
          <tr><td><b>PF-ngày</b></td><td>10¹⁵ phép tính mỗi giây chạy suốt một ngày: 10¹⁵ · 86&nbsp;400 = 8,64 · 10¹⁹ phép tính</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Ngân sách tính toán là tổng số phép tính được phép dùng cho một lần huấn luyện, biết trước từ số thẻ và số ngày thuê. Quy luật mở rộng là mất mát giảm đều theo hàm lũy thừa khi tăng tham số, dữ liệu, phép tính. Nghĩa là mỗi lần nhân số tham số lên 10, mất mát nhân với cùng một hệ số nhỏ hơn 1. Ví dụ minh hoạ, hệ số 0 phẩy 8 cho mất mát 4, rồi 3 phẩy 2, rồi 2 phẩy 56. Ngoại suy là đo trên mô hình nhỏ, rồi kéo dài đường xu hướng để đoán mô hình lớn. Tối ưu tính toán là cách chia N và D cho mất mát nhỏ nhất với một ngân sách cố định. Đơn vị ghi tắt trên màn hình là một triệu tỉ phép tính mỗi giây, chạy suốt một ngày, tức 8 phẩy 64 nhân 10 mũ 19 phép tính."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2017</text><text x="160" y="200">bỏ tính tuần tự</text><text x="160" y="232">8 thẻ, 3,5 ngày</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">1/2020</text><text x="500" y="200">quy luật mở rộng</text><text x="500" y="232">đo nhỏ, đoán lớn</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">5/2020</text><text x="850" y="200">175 tỉ tham số</text><text x="850" y="232">300 tỉ từ tố</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">3/2022</text><text x="1200" y="200">70 tỉ tham số</text><text x="1200" y="232">1,4 nghìn tỉ từ tố</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2022</text><text x="1540" y="200">dữ liệu là nút thắt</text><text x="1540" y="232">suy luận rẻ hơn</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô rất lớn → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2017, một kiến trúc chỉ dùng chú ý bỏ được việc tính tuần tự, huấn luyện trên 8 thẻ trong 3 ngày rưỡi. Đầu năm 2020, quy luật mở rộng cho phép đo trên mô hình nhỏ để đoán mô hình lớn, rồi giữa năm có mô hình 175 tỉ tham số đọc 300 tỉ từ tố. Năm 2022, mô hình 70 tỉ tham số đọc 1 phẩy 4 nghìn tỉ từ tố, và dữ liệu trở thành nút thắt mới."

  # ───────────────────────── 5. CƠ CHẾ CHUNG ─────────────────────────
  - id: budget
    kind: concept
    title: "Cơ chế chung: một ngân sách, hai cái núm"
    checks:
      - "6 * 2e9 * 40e9 == 4.8e20 and 6 * 8e9 * 10e9 == 4.8e20"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330">
          <defs><marker id="ah14" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="40" y="110" width="330" height="100" rx="10" fill="#fff7ed" stroke="#eb6834" stroke-width="3"/><text x="205" y="152">ngân sách C cố định</text><text x="205" y="186">thẻ, ngày, tốc độ</text>
          <rect x="620" y="30" width="330" height="100" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/><text x="785" y="72">N: số tham số</text><text x="785" y="106">mô hình to hơn</text>
          <rect x="620" y="200" width="330" height="100" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="785" y="242">D: số từ tố</text><text x="785" y="276">đọc nhiều hơn</text>
          <rect x="1150" y="110" width="310" height="100" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1305" y="152">mất mát sau</text><text x="1305" y="186">huấn luyện</text>
          </g>
          <line x1="370" y1="140" x2="615" y2="85" stroke="#1f2937" stroke-width="3" marker-end="url(#ah14)"/>
          <line x1="370" y1="180" x2="615" y2="245" stroke="#1f2937" stroke-width="3" marker-end="url(#ah14)"/>
          <line x1="950" y1="85" x2="1145" y2="140" stroke="#2a78d6" stroke-width="3" marker-end="url(#ah14)"/>
          <line x1="950" y1="245" x2="1145" y2="180" stroke="#059669" stroke-width="3" marker-end="url(#ah14)"/>
          <text x="492" y="320" font-size="22" fill="#eb6834" text-anchor="middle">C ≈ 6 · N · D: tăng N thì phải giảm D</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là cơ chế chung của cả hành trình. Ngân sách C cố định, vì số thẻ, số ngày và tốc độ đã biết trước. Ngân sách ấy chia cho hai cái núm, số tham số N làm mô hình to hơn, và số từ tố D làm mô hình đọc nhiều hơn. Vì C xấp xỉ 6 nhân N nhân D, tăng N thì phải giảm D, và câu hỏi của mọi chặng là chia thế nào cho mất mát nhỏ nhất."
      - show: |
          <table class="t"><tr><th>cùng ngân sách 4,8 · 10²⁰ (số minh hoạ)</th><th>N</th><th>D</th><th>6 · N · D</th></tr>
          <tr><td>cách A</td><td>2 tỉ</td><td>40 tỉ</td><td>6 · 2 · 40 · 10¹⁸ = 4,8 · 10²⁰</td></tr>
          <tr><td>cách B</td><td>8 tỉ</td><td>10 tỉ</td><td>6 · 8 · 10 · 10¹⁸ = 4,8 · 10²⁰</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Làm thử với ngân sách 4 phẩy 8 nhân 10 mũ 20 phép tính, một số minh hoạ. Cách A dùng 2 tỉ tham số và 40 tỉ từ tố, 6 nhân 2 nhân 40 nhân 10 mũ 18, đúng bằng ngân sách. Cách B dùng 8 tỉ tham số và chỉ 10 tỉ từ tố, cũng đúng bằng ngân sách, nên hai cách tốn như nhau mà cho mô hình khác hẳn nhau."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2017 — khai sinh: bỏ tính tuần tự"
    stage: {year: "2017", scale: "4,5 triệu cặp câu, từ vựng khoảng 37 000 từ tố; 65 triệu và 213 triệu tham số; một máy 8 thẻ P100", source: "[V17]", practice: "chọn kiến trúc tính song song được trong một ví dụ; đo chi phí huấn luyện bằng thời gian × số thẻ × tốc độ thẻ và báo cùng chất lượng"}
    checks:
      - "round(100000 * 0.4 / 3600, 1) == 11.1 and round(300000 * 1.0 / 86400, 2) == 3.47"
      - "round(12 * 3600 * 8 * 9.5e12 / 1e18, 1) == 3.3 and round(3.5 * 86400 * 8 * 9.5e12 / 1e19, 1) == 2.3"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> mạng hồi quy tính trạng thái ở vị trí t từ trạng thái ở vị trí t trừ 1, nên phải đi <b>tuần tự</b>; câu càng dài càng không tận dụng được tính song song.</p>
          <p><b>Cách xử lý</b> (Vaswani và cộng sự, Google, 2017): kiến trúc <b>Transformer</b> chỉ dùng chú ý. Một tầng chú ý nối mọi vị trí bằng <b>một số bước tuần tự cố định</b>, còn mạng hồi quy cần số bước bằng độ dài câu n.</p>
          <p><b>Quy mô:</b> 4,5 triệu cặp câu Anh–Đức; mô hình cơ sở 65 triệu tham số, mô hình lớn 213 triệu; một máy 8 thẻ P100.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng một, mạng hồi quy tính trạng thái ở vị trí t từ trạng thái ở vị trí t trừ 1, nên phải đi tuần tự. Câu càng dài thì càng không tận dụng được tính song song. Năm 2017, một nhóm nghiên cứu của Google đưa ra kiến trúc chỉ dùng chú ý. Một tầng chú ý nối mọi vị trí bằng một số bước tuần tự cố định, còn mạng hồi quy cần số bước bằng độ dài câu. Họ huấn luyện trên 4 phẩy 5 triệu cặp câu Anh Đức, với mô hình 65 triệu và 213 triệu tham số, trên một máy 8 thẻ."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. mô hình cơ sở: 100&nbsp;000 bước, 0,4 giây mỗi bước</td><td>100&nbsp;000 nhân 0,4 = 40&nbsp;000 giây</td><td>≈ $\hlb{11{,}1}$ giờ (nguồn ghi “12 giờ”)</td></tr>
          <tr><td>Bước 2. mô hình lớn: 300&nbsp;000 bước, 1,0 giây mỗi bước</td><td>300&nbsp;000 giây chia 86&nbsp;400</td><td>≈ $\hlb{3{,}47}$ ngày (nguồn ghi “3,5 ngày”)</td></tr>
          <tr><td>Bước 3. số phép tính = thời gian · 8 thẻ · 9,5 · 10¹² phép mỗi giây</td><td>3,5 · 86&nbsp;400 · 8 · 9,5 · 10¹²</td><td>≈ $\hlg{2{,}3}$ · 10¹⁹, khớp bảng 2</td></tr></table>
          <p class="note">Thực hành: chọn kiến trúc tính song song được trong một ví dụ, và báo chi phí huấn luyện cùng với chất lượng. Điều kiện: câu không quá dài, vì phần chú ý tốn theo bình phương độ dài.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Làm thử với số liệu của chính nhóm này. Bước một, mô hình cơ sở chạy 100 nghìn bước, mỗi bước 0 phẩy 4 giây, được 40 nghìn giây, khoảng 11 phẩy 1 giờ, khớp con số 12 giờ họ ghi. Bước hai, mô hình lớn chạy 300 nghìn bước, mỗi bước 1 giây, chia 86 nghìn 400 được khoảng 3 phẩy 47 ngày. Bước ba, nhân thời gian với 8 thẻ và 9 phẩy 5 nhân 10 mũ 12 phép mỗi giây, được khoảng 2 phẩy 3 nhân 10 mũ 19, khớp bảng chi phí. Thực hành rút ra là chọn kiến trúc tính song song được, và luôn báo chi phí cùng chất lượng. Điều kiện là câu không quá dài, vì phần chú ý tốn theo bình phương độ dài."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, đầu năm 2020 — tăng trưởng: đo nhỏ để đoán lớn"
    stage: {year: "2020", scale: "xu hướng mất mát theo hàm lũy thừa trải hơn bảy bậc độ lớn; ngân sách gấp 10 thì mô hình gấp 5, dữ liệu gấp 2", source: "[K20]", practice: "huấn luyện nhiều mô hình nhỏ, khớp đường lũy thừa, ngoại suy trước khi chi ngân sách lớn; tăng N và D cùng nhau"}
    checks:
      - "round(8 ** 0.74, 2) == 4.66 and 5 * 2 == 10"
      - "6 * 2 == 12 and 2 + 4 == 6"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> mô hình càng lớn thì mỗi lần thử càng đắt. Không thể thử mọi kích thước ở quy mô lớn để xem cái nào tốt nhất.</p>
          <p><b>Cách xử lý</b> (Kaplan và cộng sự, OpenAI, 1/2020): huấn luyện rất nhiều mô hình nhỏ. Mất mát giảm theo <b>hàm lũy thừa</b> của N, D và C, với xu hướng trải <b>hơn bảy bậc độ lớn</b>. Từ phần đầu của đường học, có thể đoán gần đúng mất mát nếu huấn luyện lâu hơn nhiều.</p>
          <table class="t"><tr><th>quy tắc nhóm này rút ra</th><th>điều kiện</th></tr>
          <tr><td>tăng N và D <b>cùng nhau</b>; giữ một thứ cố định thì lợi giảm dần</td><td>khi không bị cái còn lại giới hạn</td></tr>
          <tr><td>mô hình gấp 8 thì dữ liệu chỉ cần gấp khoảng 5</td><td>theo tỉ lệ N mũ 0,74 trên D</td></tr></table>
        focus: [1, 2, 2, "3.2", "3.3"]
        say: "Ở chặng hai, mô hình càng lớn thì mỗi lần thử càng đắt, nên không thể thử mọi kích thước ở quy mô lớn. Đầu năm 2020, một nhóm nghiên cứu huấn luyện rất nhiều mô hình nhỏ, và thấy mất mát giảm theo hàm lũy thừa của N, D và C, với xu hướng trải hơn bảy bậc độ lớn. Từ phần đầu của đường học, họ đoán được gần đúng mất mát nếu huấn luyện lâu hơn. Quy tắc đầu tiên là tăng N và D cùng nhau, vì giữ một thứ cố định thì lợi giảm dần. Quy tắc thứ hai là mô hình gấp 8 thì dữ liệu chỉ cần gấp khoảng 5."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. mô hình gấp 8, theo tỉ lệ N mũ 0,74</td><td>8 mũ 0,74</td><td>≈ $\hlb{4{,}66}$, “khoảng 5”</td></tr>
          <tr><td>Bước 2. ngân sách gấp 10, theo hình 14 của nhóm này</td><td>mô hình gấp 5, dữ liệu gấp 2</td><td>5 · 2 = $\hlg{10}$ ✓</td></tr>
          <tr><td>Bước 3. vì sao 6 trong C ≈ 6ND</td><td>đi tới (tính dự đoán) 2N mỗi từ tố, lan truyền ngược (tính độ dốc để sửa mọi tham số) gấp đôi: 2 + 4</td><td>= 6 phép mỗi tham số mỗi từ tố</td></tr></table>
          <p class="note">Thực hành: đo trên mô hình nhỏ, khớp đường, ngoại suy, rồi mới chi ngân sách lớn. Điều kiện: đường lũy thừa còn đúng ở vùng ngoại suy — chặng 4 sẽ cho thấy cách chia của chặng này nghiêng quá về N.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.4", 2, 2]
        say: "Làm thử từng bước. Bước một, mô hình gấp 8 theo tỉ lệ N mũ 0 phẩy 74 thì 8 mũ 0 phẩy 74 xấp xỉ 4 phẩy 66, đúng là khoảng 5. Bước hai, theo hình 14 của nhóm này, ngân sách gấp 10 thì mô hình gấp 5 và dữ liệu gấp 2, và 5 nhân 2 đúng bằng 10. Bước ba, số 6 trong công thức đến từ chiều đi tới, tức tính dự đoán, tốn 2 N mỗi từ tố. Lan truyền ngược, tức tính độ dốc để sửa mọi tham số, tốn gấp đôi, nên 2 cộng 4 bằng 6. Thực hành rút ra là đo nhỏ, khớp đường, ngoại suy, rồi mới chi ngân sách lớn. Điều kiện là đường lũy thừa còn đúng ở vùng ngoại suy, và chặng 4 sẽ cho thấy cách chia này nghiêng quá về N."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, giữa năm 2020 — quy mô rất lớn: 175 tỉ tham số"
    stage: {year: "2020", scale: "175 tỉ tham số, 300 tỉ từ tố, 3,14·10²³ phép tính ≈ 3640 PF-ngày; Common Crawl 45 TB nén → 570 GB sau lọc", source: "[B20]", practice: "ước lượng ngân sách bằng 6ND trước khi chạy; lọc, khử trùng lặp, trộn nguồn chất lượng cao; khử nhiễm dữ liệu kiểm tra TRƯỚC khi huấn luyện vì không chạy lại được"}
    checks:
      - "round(12 * 96 * 12288 ** 2 / 1e9) == 174"
      - "round(6 * 174.6e9 * 3e11 / 1e23, 2) == 3.14 and round(6 * 174.6e9 * 3e11 / 8.64e19) == 3637"
      - "round(570 / 45000 * 100, 1) == 1.3 and round(300 / 175, 1) == 1.7"
    steps:
      - show: |
          <p><b>Quy mô</b> (Brown và cộng sự, OpenAI, 5/2020): GPT-3 có <b>175 tỉ</b> tham số, gấp 10 mọi mô hình không thưa trước đó (mô hình không thưa: mọi tham số đều được dùng cho mỗi từ tố); 96 tầng, chiều 12&nbsp;288; mọi kích thước đều huấn luyện <b>300 tỉ từ tố</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. số tham số theo bài 5</td><td>12 · 96 · 12&nbsp;288²</td><td>≈ $\hlb{174}$ tỉ (bảng D.1 ghi 174&nbsp;600 triệu)</td></tr>
          <tr><td>Bước 2. số phép tính 6 · N · D</td><td>6 · 174,6 · 10⁹ · 3 · 10¹¹</td><td>≈ $\hl{3{,}14}$ · 10²³</td></tr>
          <tr><td>Bước 3. đổi sang PF-ngày</td><td>3,14 · 10²³ chia 8,64 · 10¹⁹</td><td>≈ $\hlg{3637}$, bảng ghi 3640</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng ba, giữa năm 2020, mô hình GPT-3 có 175 tỉ tham số, gấp 10 mọi mô hình không thưa trước đó, tức mô hình dùng mọi tham số cho mỗi từ tố. Nó có 96 tầng và chiều 12 nghìn 288. Mọi kích thước trong họ mô hình này đều đọc 300 tỉ từ tố. Bước một, theo công thức của bài 5, 12 nhân 96 nhân 12 nghìn 288 bình phương được khoảng 174 tỉ, khớp bảng của nhóm tác giả. Bước hai, 6 nhân N nhân D cho khoảng 3 phẩy 14 nhân 10 mũ 23 phép tính. Bước ba, chia cho 8 phẩy 64 nhân 10 mũ 19 được khoảng 3637 đơn vị ngày như vậy, khớp con số 3640 họ ghi."
      - clear: true
        show: |
          <p><b>Điểm nghẽn mới: dữ liệu.</b> Dữ liệu thu từ mạng có chất lượng thấp hơn. Nhóm này làm ba việc: lọc theo độ giống các bộ văn bản tốt, khử trùng lặp gần đúng ở mức từng văn bản, và trộn thêm các nguồn chất lượng cao.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 4. phần giữ lại sau lọc</td><td>570 GB chia 45&nbsp;000 GB</td><td>≈ $\hl{1{,}3}$%</td></tr>
          <tr><td>Bước 5. từ tố mỗi tham số</td><td>300 tỉ chia 175 tỉ</td><td>≈ $\hlb{1{,}7}$</td></tr></table>
          <p class="note">Bài học họ tự ghi: một lỗi trong bước lọc làm sót một phần câu kiểm tra, và vì chi phí, không thể huấn luyện lại — họ phải đo mức nhiễm sau đó. Thực hành: khử nhiễm <b>trước</b> khi chạy, vì lần chạy lớn chỉ có một.</p>
        focus: [1, 1, "2.2", "2.3", 3, 3]
        say: "Điểm nghẽn mới của chặng này là dữ liệu, vì dữ liệu thu từ mạng có chất lượng thấp hơn. Nhóm này lọc theo độ giống các bộ văn bản tốt, khử trùng lặp gần đúng ở mức từng văn bản, và trộn thêm các nguồn chất lượng cao. Bước bốn, 570 GB giữ lại chia cho 45 nghìn GB ban đầu, chỉ còn khoảng 1 phẩy 3 phần trăm. Bước năm, 300 tỉ từ tố chia 175 tỉ tham số, chỉ khoảng 1 phẩy 7 từ tố mỗi tham số. Chính nhóm này ghi rằng một lỗi lọc làm sót câu kiểm tra, và vì chi phí, họ không huấn luyện lại được. Thực hành rút ra là khử nhiễm trước khi chạy, vì lần chạy lớn chỉ có một."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2022 — ổn định: chia lại ngân sách"
    stage: {year: "2022", scale: "hơn 400 mô hình từ 70 triệu tới hơn 16 tỉ tham số, 5 tới 500 tỉ từ tố; mô hình 70 tỉ tham số, 1,4 nghìn tỉ từ tố, cùng ngân sách mô hình 280 tỉ", source: "[H22]", practice: "mô hình gấp đôi thì dữ liệu gấp đôi; kiểm dự đoán bằng một lần chạy thật cùng ngân sách; tỉ lệ khoảng 20 từ tố mỗi tham số"}
    checks:
      - "round(6 * 70e9 * 1.4e12 / 1e23, 2) == 5.88 and round(5.88 / 5.76 - 1, 2) == 0.02"
      - "1.4e12 / 70e9 == 20 and 280 / 70 == 4 and round(1.4e12 / 3e11, 1) == 4.7"
      - "round(20.2e9 / 1e9, 1) == 20.2 and round(3.7e12 / 175e9, 1) == 21.1 and 12 < 3.7e12 / 3e11 < 13"
      - "round(67.5 - 60.0, 1) == 7.5"
    steps:
