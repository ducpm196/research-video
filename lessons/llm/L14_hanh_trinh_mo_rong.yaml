      - "40e9 / 10e9 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống: ngân sách 4,8 · 10²⁰ phép tính (số minh hoạ); cách A: 2 tỉ tham số, 40 tỉ từ tố; cách B: 8 tỉ tham số, 10 tỉ từ tố</th></tr>
