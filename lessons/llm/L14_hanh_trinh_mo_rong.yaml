          <tr><td>Bước 4. điểm kiểm tra kiến thức nhiều môn</td><td>67,5% trừ 60,0%</td><td>+7,5 điểm, “hơn 7%”</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Làm thử từng bước. Bước một, 6 nhân 70 tỉ nhân 1 phẩy 4 nghìn tỉ được khoảng 5 phẩy 88 nhân 10 mũ 23. Con số này chỉ lệch 2 phần trăm so với ngân sách trong bảng của họ. Bước hai, 280 chia 70 là nhỏ hơn 4 lần. Bước ba, 1 phẩy 4 nghìn tỉ chia 70 tỉ là 20 từ tố mỗi tham số, trong khi mô hình ở chặng ba chỉ có 1 phẩy 7. Bước bốn, trên bài kiểm tra kiến thức nhiều môn, 67 phẩy 5 trừ 60 là hơn 7 điểm."
      - show: |
          <table class="t"><tr><th>bảng 3 của nhóm này: N</th><th>số từ tố tối ưu</th><th>chia cho N</th></tr>
          <tr><td>1 tỉ</td><td>20,2 tỉ</td><td>20,2</td></tr>
          <tr><td>175 tỉ</td><td>3,7 nghìn tỉ</td><td>≈ 21,1</td></tr></table>
          <p class="note">Tỉ lệ “khoảng 20 từ tố mỗi tham số” là con số ta đọc ra từ bảng này. Thực hành: kiểm dự đoán bằng một lần chạy thật cùng ngân sách. Điều kiện: dữ liệu đọc chưa tới một lượt, và đường lũy thừa còn đúng.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Bảng ước lượng của nhóm này cho thấy tỉ lệ ấy ở nhiều kích thước. Mô hình 1 tỉ tham số cần 20 phẩy 2 tỉ từ tố, tức 20 phẩy 2 lần. Mô hình 175 tỉ tham số cần 3 phẩy 7 nghìn tỉ từ tố, khoảng 21 lần, gấp hơn 12 lần số đã dùng ở chặng ba. Tỉ lệ khoảng 20 là con số ta đọc ra từ bảng, thực hành rút ra là kiểm dự đoán bằng một lần chạy thật. Điều kiện là dữ liệu đọc chưa tới một lượt, và đường lũy thừa còn đúng."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2022 — tiếp tục phát triển: dữ liệu là nút thắt mới"
    stage: {year: "2022", scale: "mô hình 1 nghìn tỉ tham số cần 21,2 nghìn tỉ từ tố; chỉ có hai lần chạy lớn để so; mọi lần chạy đọc chưa tới một lượt dữ liệu", source: "[H22] [K20]", practice: "mô hình nhỏ hơn thì suy luận rẻ hơn; thu thập dữ liệu lớn có chất lượng, kiểm trùng giữa dữ liệu huấn luyện và kiểm tra; ghi rõ giới hạn của dự đoán"}
    checks:
      - "2 * 280e9 / (2 * 70e9) == 4"
      - "round(21.2e12 / 3e11) == 71"
    steps:
      - show: |
          <p><b>Suy luận rẻ hơn:</b> nhóm năm 2022 ghi mô hình nhỏ hơn làm chi phí suy luận giảm đáng kể, chạy được trên phần cứng nhỏ hơn; chi phí năng lượng huấn luyện được <b>chia đều qua việc dùng</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. đi tới ≈ 2N phép mỗi từ tố (bài 5)</td><td>2 · 280 tỉ chia 2 · 70 tỉ</td><td>rẻ hơn $\hlg{4}$ lần mỗi từ tố sinh ra</td></tr>
          <tr><td>Bước 2. mô hình 1 nghìn tỉ tham số theo bảng 3</td><td>21,2 nghìn tỉ chia 300 tỉ</td><td>≈ $\hl{71}$ lần số từ tố của chặng 3</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Ở chặng năm, nhóm năm 2022 ghi rằng mô hình nhỏ hơn làm chi phí suy luận giảm đáng kể, và chạy được trên phần cứng nhỏ hơn. Chi phí năng lượng huấn luyện được chia đều qua việc dùng mô hình. Bước một, theo bài 5, chiều đi tới tốn khoảng 2 N phép mỗi từ tố, nên 2 nhân 280 tỉ chia 2 nhân 70 tỉ là rẻ hơn 4 lần. Bước hai, mô hình 1 nghìn tỉ tham số cần 21 phẩy 2 nghìn tỉ từ tố, khoảng 71 lần số từ tố của chặng ba."
      - clear: true
        show: |
          <table class="t"><tr><th>nút thắt mới nhóm này tự ghi</th><th>thực hành rút ra</th></tr>
          <tr><td>dữ liệu cần lớn hơn rất nhiều; chỉ có lợi khi dữ liệu <b>chất lượng cao</b></td><td>thu thập có trách nhiệm, chú trọng chất lượng</td></tr>
          <tr><td>dữ liệu càng lớn càng dễ trùng với câu kiểm tra</td><td>kiểm trùng cả ở mất mát lẫn ở bài kiểm tra</td></tr>
          <tr><td>chỉ có <b>hai</b> lần chạy lớn để so; mọi lần chạy đọc chưa tới một lượt dữ liệu</td><td>ghi rõ giới hạn; ngoài vùng đó là ngoại suy</td></tr></table>
          <p class="note">Ổn định không có nghĩa là hết việc: cách chia ngân sách đã có quy tắc, nhưng nút thắt chuyển sang dữ liệu, và mỗi quy tắc vẫn có điều kiện riêng.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Chính nhóm này ghi ba nút thắt mới. Dữ liệu cần lớn hơn rất nhiều, và chỉ có lợi khi chất lượng cao, nên phải thu thập có trách nhiệm. Dữ liệu càng lớn càng dễ trùng với câu kiểm tra, nên phải kiểm trùng cả ở mất mát lẫn ở bài kiểm tra. Họ chỉ có hai lần chạy lớn để so, và mọi lần chạy đọc chưa tới một lượt dữ liệu, nên ngoài vùng đó là ngoại suy. Cách chia ngân sách đã có quy tắc, nhưng nút thắt chuyển sang dữ liệu."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "round(300000 / 3600, 1) == 83.3 and round(3.5 * 24, 1) == 84.0"
      - "round(3637 * 8.64e19 / 1e23, 2) == 3.14"
      - "20 * 70e9 == 1.4e12"
      - "4 * 70 == 280"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>3,47 ngày</td><td>đổi sang giờ: 300&nbsp;000 giây chia 3600 ≈ 83,3 giờ; 3,5 ngày nhân 24 = 84 giờ ✓</td></tr>
          <tr><td>3637 PF-ngày</td><td>nhân ngược: 3637 nhân 8,64 · 10¹⁹ ≈ 3,14 · 10²³ ✓</td></tr>
          <tr><td>20 từ tố mỗi tham số</td><td>nhân ngược: 20 nhân 70 tỉ = 1,4 nghìn tỉ ✓</td></tr>
          <tr><td>nhỏ hơn 4 lần</td><td>nhân ngược: 4 nhân 70 tỉ = 280 tỉ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Đổi sang giờ, 300 nghìn giây chia 3600 được khoảng 83 phẩy 3 giờ, gần 84 giờ của 3 ngày rưỡi. Nhân ngược, 3637 nhân 8 phẩy 64 nhân 10 mũ 19 được khoảng 3 phẩy 14 nhân 10 mũ 23. Nhân ngược tiếp, 20 nhân 70 tỉ đúng bằng 1 phẩy 4 nghìn tỉ từ tố. Cuối cùng, 4 nhân 70 tỉ đúng bằng 280 tỉ tham số."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Cứ tăng tham số là tốt hơn”</td><td>năm 2022, cùng ngân sách, mô hình 70 tỉ thắng mô hình 280 tỉ vì đọc nhiều dữ liệu hơn</td><td>chia ngân sách cho cả N lẫn D</td></tr>
          <tr><td><b class="red">2.</b> “Lỗi lọc dữ liệu là do ai đó cẩu thả, lần sau cẩn thận hơn”</td><td>lời khuyên cẩn thận không bắt được lỗi; lần chạy lớn không làm lại được</td><td>có bước đo mức nhiễm tự động trước khi chạy, thử trên mô hình nhỏ</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ cứ tăng tham số là tốt hơn. Năm 2022, với cùng ngân sách, mô hình 70 tỉ tham số thắng mô hình 280 tỉ vì đọc nhiều dữ liệu hơn, nên hãy chia ngân sách cho cả N lẫn D. Bài học sai thứ hai là cho rằng lỗi lọc dữ liệu là do ai đó cẩu thả, lần sau cẩn thận hơn. Lời khuyên cẩn thận không bắt được lỗi, nên hãy có bước đo mức nhiễm tự động trước khi chạy, và thử trên mô hình nhỏ."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “20 từ tố mỗi tham số là luật”</td><td>đó là điểm tối ưu cho chi phí <b>huấn luyện</b>, khi đọc chưa tới một lượt dữ liệu; nhóm năm 2022 còn ghi có thể vẫn ước lượng N lớn quá</td><td>tính cả chi phí suy luận và lượng dữ liệu tốt mình có</td></tr>
          <tr><td><b class="red">4.</b> “Tôi cũng cần mô hình 175 tỉ tham số”</td><td>quy mô do ngân sách quyết định; chép quy mô người khổng lồ là chép cả ngân sách của họ</td><td>tính C ≈ 6ND với số thẻ, số ngày của mình</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba là coi 20 từ tố mỗi tham số là luật. Đó là điểm tối ưu cho chi phí huấn luyện, khi đọc chưa tới một lượt dữ liệu, và nhóm năm 2022 còn ghi có thể họ vẫn ước lượng N lớn quá. Hãy tính cả chi phí suy luận và lượng dữ liệu tốt mình có. Bài học sai thứ tư là nghĩ mình cũng cần mô hình 175 tỉ tham số. Quy mô do ngân sách quyết định, nên hãy tính 6 N D với số thẻ, số ngày của chính mình."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
