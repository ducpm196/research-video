# Quy ước: N = số tham số, D = số từ tố huấn luyện, C ≈ 6·N·D phép tính (bài 6); đi tới ≈ 2N phép tính mỗi từ tố (bài 5, [K20] bảng 1).
#   “PF-ngày” = 10¹⁵ phép tính mỗi giây chạy suốt một ngày = 8,64·10¹⁹ phép tính ([B20] phụ lục D).
#   Mọi sự kiện và con số có nguồn ghi trong audit/llm/sources_L14.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”:
#   ngân sách 4,8·10²⁰ phép tính, 1 tỉ từ tố phục vụ mỗi ngày, 10 tỉ từ tố dữ liệu tốt trong quiz là SỐ MINH HOẠ.
#   “≈ 20 từ tố mỗi tham số” là tỉ lệ ĐỌC RA từ bảng 3 của [H22], nguồn không viết thành câu.
#   Tên Transformer, Gopher chỉ trên màn hình (probe p2 dưới ngưỡng); GPT-3, Chinchilla đọc theo lexicon_vi.LLM.yaml (probe p2 8/8); lời đọc khác dùng tên mô tả:
#   “kiến trúc chỉ dùng chú ý”, “mô hình 175 tỉ tham số năm 2020”, “mô hình 280 tỉ tham số”, “mô hình 70 tỉ tham số năm 2022”.
objectives:
