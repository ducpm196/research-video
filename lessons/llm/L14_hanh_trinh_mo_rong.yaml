          <tr><td>cách B</td><td>10 chia 8 = 1,25</td><td>cần ít dữ liệu</td><td>huấn luyện thiếu, như các mô hình 300 tỉ từ tố trước 2022</td></tr></table>
        focus: ["1.2", "1.3", "1.3"]
