          <p><b>Cách xử lý:</b> huấn luyện hơn <b>400 mô hình</b>, từ 70 triệu tới hơn 16 tỉ tham số, trên 5 tới 500 tỉ từ tố. Kết luận: N và D tăng <b>bằng nhau</b> — mô hình gấp đôi thì từ tố cũng gấp đôi.</p>
          <p><b>Kiểm bằng một lần chạy thật:</b> cùng ngân sách của Gopher (280 tỉ tham số, 300 tỉ từ tố), họ huấn luyện Chinchilla <b>70 tỉ</b> tham số trên <b>1,4 nghìn tỉ</b> từ tố.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng bốn, sau chặng ba, nhiều mô hình lớn đều đọc khoảng 300 tỉ từ tố và chỉ tăng N. Năm 2022, một nhóm nghiên cứu khác cho rằng các mô hình này bị huấn luyện thiếu. Họ huấn luyện hơn 400 mô hình, từ 70 triệu tới hơn 16 tỉ tham số, trên 5 tới 500 tỉ từ tố. Kết luận là N và D tăng bằng nhau, mô hình gấp đôi thì số từ tố cũng gấp đôi. Họ kiểm bằng một lần chạy thật, với cùng ngân sách của mô hình 280 tỉ tham số, họ huấn luyện mô hình Chinchilla 70 tỉ tham số trên 1 phẩy 4 nghìn tỉ từ tố."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. ngân sách của mô hình 70 tỉ</td><td>6 · 70 · 10⁹ · 1,4 · 10¹²</td><td>≈ $\hlb{5{,}88}$ · 10²³, lệch 2% so với 5,76 · 10²³ của bảng 3</td></tr>
          <tr><td>Bước 2. nhỏ hơn bao nhiêu lần</td><td>280 chia 70</td><td>$\hl{4}$ lần</td></tr>
