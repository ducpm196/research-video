  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">chỉ dùng chú ý: tính song song</span><span class="a">→</span>
          <span class="n">quy luật mở rộng: đo nhỏ, đoán lớn</span><span class="a">→</span>
          <span class="n">175 tỉ tham số: dữ liệu và nhiễm</span><span class="a">→</span>
          <span class="n">N và D tăng bằng nhau</span><span class="a">→</span>
          <span class="n">dữ liệu tốt là nút thắt</span></div>
        say: "Tổng kết lại hành trình. Kiến trúc chỉ dùng chú ý cho tính song song trong một ví dụ. Quy luật mở rộng cho đo nhỏ để đoán lớn. Mô hình 175 tỉ tham số làm lộ ra bài toán dữ liệu và nhiễm dữ liệu. Năm 2022, mô hình Chinchilla cho thấy N và D nên tăng bằng nhau, và dữ liệu tốt trở thành nút thắt mới."
      - show: |
          <div class="box key"><b>Tư duy:</b> lần chạy lớn chỉ có một, nên mọi quyết định phải được <b>tính trước, thử nhỏ và kiểm bằng đường khác</b>. Trước khi chọn kích thước, hãy viết ra C, N, D của chính mình.</div>
        say: "Điều cần mang theo, lần chạy lớn chỉ có một, nên mọi quyết định phải được tính trước, thử nhỏ, và kiểm bằng đường khác. Trước khi chọn kích thước mô hình, hãy viết ra C, N và D của chính mình."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá <b>Mô hình ngôn ngữ lớn</b>. Từ xác suất chuỗi, từ tố và chú ý nhân quả, qua chi phí, huấn luyện, tinh chỉnh, đánh giá và truy xuất, bạn đã đi tới cách các nhóm nghiên cứu chia ngân sách khi mô hình tới hàng trăm tỉ tham số.</p>
        say: "Đây là bài cuối của khoá mô hình ngôn ngữ lớn. Bạn đã đi từ xác suất chuỗi, từ tố và chú ý nhân quả, qua chi phí, huấn luyện, tinh chỉnh, đánh giá và truy xuất. Cuối cùng là cách chia ngân sách khi mô hình tới hàng trăm tỉ tham số. Cảm ơn bạn đã theo học."
