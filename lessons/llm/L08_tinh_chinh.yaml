scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Dạy mô hình viết theo mẫu công ty mà không có 100 GB bộ nhớ"
    checks:
      - "round(12 * 32 * 4096 ** 2 * 16 / 1e9) == 103"
    steps:
      - show: |
          <p>Công ty muốn mô hình 6,4 tỉ tham số trả lời theo giọng văn và định dạng riêng. Cập nhật mọi tham số bằng thuật toán Adam cần khoảng 16 byte mỗi tham số — <b>≈ 103 GB</b> chỉ cho trọng số và trạng thái. Có cách nào chỉ học một phần rất nhỏ?</p>
          <div class="box key">Hôm nay: <b>tinh chỉnh</b> — toàn bộ tham số, hay chỉ thêm một phần <b>hạng thấp</b> nhỏ hơn hàng trăm lần.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, công ty muốn mô hình 6 phẩy 4 tỉ tham số trả lời theo giọng văn và định dạng riêng. Cập nhật mọi tham số bằng thuật toán tối ưu thích nghi cần khoảng 16 byte mỗi tham số, tức khoảng 103 GB chỉ cho trọng số và trạng thái. Có cách nào chỉ học một phần rất nhỏ? Hôm nay ta học tinh chỉnh, cập nhật toàn bộ tham số, hay chỉ thêm một phần hạng thấp nhỏ hơn hàng trăm lần."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: cỡ của tích hai ma trận, và ma trận hạng 1"
    checks:
      - "[[a * b for b in (1, 2)] for a in (1, 2)] == [[1, 2], [2, 4]] and 1 * 4 - 2 * 2 == 0"
    steps:
      - show: |
          <p><b>Cỡ của tích</b> (khoá toán): ma trận $a$ hàng $b$ cột nhân ma trận $b$ hàng $c$ cột cho ma trận $a$ hàng $c$ cột. Ví dụ cột 2 × 1 nhân hàng 1 × 2 cho ma trận 2 × 2.</p>
          $$\begin{pmatrix} 1 \\ 2 \end{pmatrix} \begin{pmatrix} 1 & 2 \end{pmatrix} = \begin{pmatrix} 1 & 2 \\ 2 & 4 \end{pmatrix}$$
        focus: [1, 2]
        say: "Ở khoá toán, ta đã học cỡ của tích hai ma trận, ma trận a hàng b cột nhân ma trận b hàng c cột cho ma trận a hàng c cột. Ví dụ một cột hai số 1, 2 nhân một hàng hai số 1, 2 cho ma trận 2 nhân 2 với các số 1, 2, 2, 4."
      - show: |
          <p>Hàng thứ hai (2, 4) đúng bằng 2 lần hàng thứ nhất (1, 2): ma trận chỉ có <b>một hướng</b> thật sự — gọi là <b>hạng 1</b>. Tích của một cột với một hàng luôn có hạng 1.</p>
        say: "Hàng thứ hai, 2 và 4, đúng bằng 2 lần hàng thứ nhất, 1 và 2, nên ma trận chỉ có một hướng thật sự, gọi là hạng 1. Tích của một cột với một hàng luôn có hạng 1, và đó là ý tưởng của bài hôm nay."

  - id: sym
    kind: symbol
    title: "Giải mã: tinh chỉnh hạng thấp"
    steps:
      - show: |
          <p><b>Tinh chỉnh toàn bộ</b>: tiếp tục huấn luyện mọi tham số trên dữ liệu mới.</p>
          <p><b>Tinh chỉnh hạng thấp</b>: giữ nguyên $W$ ($d \times d$), học thêm hai ma trận nhỏ $B$ ($d \times r$) và $A$ ($r \times d$) với $r$ nhỏ (ví dụ 8):</p>
          <p>$W' = W + B \cdot A$. Tích $B \cdot A$ có hạng tối đa $r$ — thay đổi bị giới hạn trong $r$ “hướng”. $B$ khởi tạo bằng 0 nên lúc đầu mô hình y như cũ.</p>
          <p>Số tham số học: $r \cdot (d + d)$ thay vì $d \cdot d$.</p>
        introduces: [prime]
        focus: [1, 2, 3, 3, 4]
        say: "Tinh chỉnh toàn bộ là tiếp tục huấn luyện mọi tham số trên dữ liệu mới. Tinh chỉnh hạng thấp giữ nguyên ma trận W cỡ d nhân d, và học thêm hai ma trận nhỏ B cỡ d nhân r, A cỡ r nhân d, với r nhỏ, ví dụ 8. Ma trận mới bằng W cộng B nhân A, và tích B nhân A có hạng tối đa r, tức thay đổi bị giới hạn trong r hướng. B khởi tạo bằng 0, nên lúc đầu mô hình y như cũ. Số tham số phải học là r nhân d cộng d, thay vì d nhân d."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một ma trận lớn cộng tích của hai ma trận mỏng"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330">
          <rect x="60" y="30" width="270" height="270" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/>
          <rect x="470" y="30" width="270" height="270" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/>
          <rect x="860" y="30" width="36" height="270" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/>
          <rect x="960" y="30" width="270" height="36" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/>
          <g font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">
          <text x="195" y="175">W mới</text><text x="400" y="175">=</text><text x="605" y="175">W (giữ nguyên)</text><text x="800" y="175">+</text>
          <text x="878" y="175">B</text><text x="928" y="110" font-size="22">nhân</text><text x="1095" y="58">A</text></g>
          <g font-size="23" fill="#1f2937"><text x="1250" y="130">B: d hàng, r cột</text><text x="1250" y="170">A: r hàng, d cột</text><text x="1250" y="210">r nhỏ (ví dụ 8)</text>
          <text x="960" y="150">chỉ học phần cam</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình so kích thước các ma trận. Ma trận gốc W là hình vuông lớn, giữ nguyên, không học. Ta chỉ học hai dải mỏng màu cam, B có d hàng nhưng chỉ r cột, A có r hàng và d cột, với r nhỏ như 8, và tích của chúng có cùng cỡ với W."

  - id: example
    kind: example
    title: "Đếm tham số: 0,39% một ma trận, 0,13% cả mô hình"
    checks:
      - "alg.lora_params(4096, 4096, 8) == 65536 and 4096 ** 2 == 16777216 and round(65536 / 16777216 * 100, 2) == 0.39"
      - "32 * 4 * alg.lora_params(4096, 4096, 8) == 8388608 and round(8388608 / (12 * 32 * 4096 ** 2) * 100, 2) == 0.13"
    steps:
      - show: |
          <p><b>Bước 1 — một ma trận</b> 4096 hàng, 4096 cột, tinh chỉnh toàn bộ: $4096 \cdot 4096 = 16\,777\,216$ số.</p>
        say: "Bước một, với một ma trận 4096 hàng và 4096 cột, tinh chỉnh toàn bộ phải học 4096 nhân 4096, bằng 16 triệu 777 nghìn 216 số."
      - show: |
          <p><b>Bước 2 — hạng thấp</b> $r = 8$: $B$ có $4096 \cdot 8 = 32\,768$ số, $A$ có $8 \cdot 4096 = 32\,768$ số, cộng $= \hl{65\,536}$ — chỉ $\approx 0{,}39\%$.</p>
        say: "Bước hai, hạng thấp với r bằng 8, ma trận B có 4096 nhân 8 bằng 32 nghìn 768 số, ma trận A cũng vậy. Cộng lại là 65 nghìn 536 số, chỉ khoảng 0 phẩy 39 phần trăm."
      - clear: true
        show: |
          <table class="t"><tr><th>phạm vi</th><th>toàn bộ</th><th>hạng thấp $r = 8$</th><th>tỉ lệ</th></tr>
          <tr><td>4 ma trận chú ý mỗi tầng, 32 tầng = 128 ma trận</td><td>≈ 6,44 tỉ (cả phần thân, bài 5)</td><td>$128 \cdot 65\,536 = 8\,388\,608$</td><td>≈ $\hl{0{,}13\%}$</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước ba, áp dụng cho 4 ma trận chú ý ở mỗi tầng, 32 tầng, tức 128 ma trận. Hạng thấp học 128 nhân 65 nghìn 536, khoảng 8 triệu 400 nghìn số, chỉ khoảng 0 phẩy 13 phần trăm của 6 phẩy 44 tỉ tham số phần thân ở bài 5."
      - show: |
          <p><b>Bước 4 — lưu:</b> 8 388 608 số, mỗi số 2 byte, ≈ 16,8 triệu byte (≈ 16,8 MB) thay vì cả mô hình ≈ 12,9 GB; nhiều “bản tinh chỉnh” dùng chung một mô hình gốc.</p>
        say: "Bước bốn, lưu kết quả tinh chỉnh chỉ cần khoảng 16 triệu 800 nghìn byte, thay vì gần 13 GB cho cả mô hình, nên nhiều bản tinh chỉnh dùng chung được một mô hình gốc."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "alg.lora_params(4096, 4096, 8) == 2 * 4096 * 8 and round(2 * 8 / 4096 * 100, 2) == 0.39"
      - "8388608 * 2 == 16777216"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>0,39%</td><td>$\frac{r \cdot 2d}{d \cdot d} = \frac{2r}{d} = \frac{16}{4096}$</td><td>0,39% ✓</td></tr>
          <tr><td>16,8 triệu byte</td><td>8 388 608 nhân 2 = 16 777 216 — đúng bằng số phần tử của MỘT ma trận đầy đủ</td><td>✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Vì d ở tử và mẫu triệt tiêu, tỉ lệ r nhân 2 d chia d nhân d rút gọn thành 2 r chia d, tức 16 chia 4096, đúng 0 phẩy 39 phần trăm. Và 8 triệu 388 nghìn 608 nhân 2 byte bằng 16 triệu 777 nghìn 216, đúng bằng số phần tử của một ma trận đầy đủ, một cách nhớ thú vị."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tinh chỉnh để “nạp kiến thức mới” <b class="red">(dễ ảo giác)</b>
          <br><span class="note">Tinh chỉnh giỏi dạy <b>hành vi</b>: giọng văn, định dạng, cách từ chối. Dữ kiện hay thay đổi (giá, chính sách) nên đưa vào qua truy xuất lúc trả lời, có trích nguồn.</span></div>
        say: "Lỗi thứ nhất, tinh chỉnh để nạp kiến thức mới, nên dễ ảo giác. Tinh chỉnh giỏi dạy hành vi như giọng văn, định dạng, hay cách từ chối. Dữ kiện hay thay đổi như giá hay chính sách nên đưa vào qua truy xuất lúc trả lời, có trích nguồn."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tinh chỉnh trên ít dữ liệu quá lâu <b class="red">(quên năng lực cũ)</b>
          <br><span class="note">Mô hình học thuộc vài trăm ví dụ và làm kém đi ở việc khác. Giữ tập kiểm tra cho cả năng lực chung, dừng sớm khi điểm chung tụt.</span></div>
        say: "Lỗi thứ hai, tinh chỉnh trên ít dữ liệu quá lâu, nên mô hình quên năng lực cũ. Mô hình học thuộc vài trăm ví dụ và làm kém đi ở việc khác. Hãy giữ tập kiểm tra cho cả năng lực chung, và dừng sớm khi điểm chung tụt."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tinh chỉnh trước khi thử lời nhắc <b class="red">(tốn công)</b>
          <br><span class="note">Thứ tự hợp lý: viết lời nhắc rõ có ví dụ → thêm truy xuất nếu thiếu dữ kiện → tinh chỉnh khi vẫn sai về hành vi và đã có bộ đánh giá để đo cải thiện.</span></div>
        say: "Lỗi thứ ba, tinh chỉnh trước khi thử lời nhắc, nên tốn công. Thứ tự hợp lý là viết lời nhắc rõ ràng có ví dụ, rồi thêm truy xuất nếu thiếu dữ kiện. Chỉ tinh chỉnh khi vẫn sai về hành vi, và khi đã có bộ đánh giá để đo cải thiện."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.lora_params(5120, 5120, 16) == 163840 and round(163840 / 5120 ** 2 * 100, 3) == 0.625"
    steps:
