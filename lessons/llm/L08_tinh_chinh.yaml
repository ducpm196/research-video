  - show: <table class='t'><tr><th>Gợi ý triển khai LLM:L08</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (tham số ma trận gốc)</b></td><td>Bình phương kích thước chiều vuông của lớp tuyến tính</td></tr><tr><td><b>Bước 2 (hai
      ma trận A và B)</b></td><td>Nhân đôi tích kích thước chiều và hạng r rất nhỏ của LoRA</td></tr><tr><td><b>Bước 3 (phần
      trăm tham số LoRA)</b></td><td>Chia số tham số LoRA cho toàn bộ ma trận rồi đổi phần trăm</td></tr></table>
    say: Gợi ý cài đặt bài số 8 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 1 dòng khớp định dạng.
    clear: true
    focus:
