  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/LLM/L08
  steps:
  - show: <table class='t'><tr><th>Thực hành LLM:L08</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Biết
