    say: Mời bạn tự thực hành bài số 8 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Tính chính xác tổng phần tử tham số đầy đủ, phần tử cặp
      nhánh hạng thấp và tỉ lệ phần trăm nén cho mô hình cho trước. Xác minh hai số nguyên và tỉ lệ phần trăm đúng chuẩn hai
      chữ số.
    clear: true
