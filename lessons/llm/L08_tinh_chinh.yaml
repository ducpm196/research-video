source: "curriculum/llm.yaml L08; audit/llm/verify_llm.py L08; E. Hu và cộng sự, LoRA: Low-Rank Adaptation of Large Language Models, ICLR (2022); S. Rajbhandari và cộng sự, ZeRO (2020) — 16 byte mỗi tham số khi huấn luyện với Adam độ chính xác hỗn hợp; CS115 bài 2 (nhân ma trận), bài 16 (hạng thấp, SVD)"
assumes: [arith, cdot, sub, approx]
# Quy ước: ma trận W cỡ d × d; LoRA thêm B (d × r) và A (r × d), W' = W + B·A, B khởi tạo bằng 0 nên lúc đầu W' = W (alg.lora_params = r·(d_in + d_out)).
#   16 byte mỗi tham số cho tinh chỉnh toàn bộ với Adam: trọng số 2 + đạo hàm 2 + bản sao 4 byte + hai trạng thái Adam 8 byte (ZeRO 2020).
#   Tham số phần thân như bài 5 (≈ 6,44 tỉ). LoRA chỉ trên màn hình; lời đọc “tinh chỉnh hạng thấp”.
objectives:
  - "So sánh tinh chỉnh toàn bộ với tinh chỉnh hạng thấp"
  - "Đếm tham số và ước lượng bộ nhớ"
  - "Biết khi nào nên tinh chỉnh, khi nào chỉ cần lời nhắc hay truy xuất"
