scenes:
- id: hook
  kind: hook
  title: Dạy mô hình viết theo mẫu công ty mà không có 100 GB bộ nhớ
  checks:
  - round(12 * 32 * 4096 ** 2 * 16 / 1e9) == 103 and 2 + 2 + 4 + 4 + 4 == 16
  steps:
  - show: '<p>Công ty muốn mô hình 6,4 tỉ tham số trả lời theo giọng văn và định dạng riêng. Cập nhật mọi tham số bằng thuật
      toán Adam cần khoảng 16 byte mỗi tham số — <b>≈ 103 GB</b> chỉ cho trọng số và trạng thái. Có cách nào chỉ học một phần
      rất nhỏ?</p>

      <p class="note">16 byte (Rajbhandari và cộng sự, 2020): trọng số 2 + độ dốc 2 (độ dốc: nhích tham số một chút thì mất
      mát đổi bao nhiêu) + bản sao chính xác 4 + hai số Adam nhớ cho mỗi tham số 8 (trung bình độ dốc và trung bình bình phương
      độ dốc, Kingma và Ba, 2015).</p>

      <div class="box key">Hôm nay: <b>tinh chỉnh</b> — toàn bộ tham số, hay chỉ thêm một phần <b>hạng thấp</b> nhỏ hơn hàng
      trăm lần.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 1
    - 3
    - 3
    say: Chào bạn, công ty muốn mô hình 6 phẩy 4 tỉ tham số trả lời theo giọng văn và định dạng riêng. Cập nhật mọi tham số
      bằng thuật toán tối ưu thích nghi cần khoảng 16 byte mỗi tham số, tức khoảng 103 GB chỉ cho trọng số và trạng thái.
      Mười sáu byte gồm 2 byte trọng số, 2 byte độ dốc, tức mức mất mát đổi khi nhích tham số một chút, và 4 byte bản sao
      chính xác. Còn 8 byte là hai số mà thuật toán nhớ cho mỗi tham số, trung bình độ dốc và trung bình bình phương độ dốc.
      Có cách nào chỉ học một phần rất nhỏ? Hôm nay ta học tinh chỉnh, cập nhật toàn bộ tham số, hay chỉ thêm một phần hạng
      thấp nhỏ hơn hàng trăm lần. Cập nhật nguyên bộ hàng tỉ tham số đòi hỏi bộ nhớ khổng lồ cho trạng thái tối ưu trong khi
      phần lớn cấu trúc ngôn ngữ nền tảng cần được giữ nguyên.
- id: prereq
  kind: prereq
  title: 'Ôn lại: cỡ của tích hai ma trận, và ma trận hạng 1'
  checks:
  - '[[a * b for b in (1, 2)] for a in (1, 2)] == [[1, 2], [2, 4]] and 1 * 4 - 2 * 2 == 0'
  - '[1 * 5 + 2 * 6, 3 * 5 + 4 * 6] == [17, 39]'
  - '(lambda M: M[1] == [2 * x for x in M[0]])([[a * b for b in (1, 2)] for a in (1, 2)])'
  steps:
  - show: '<p><b>Ma trận</b> là một bảng số có $a$ hàng, $b$ cột. <b>Nhân hai ma trận</b>: ô ở hàng $i$, cột $j$ của kết quả
      = tích vô hướng của hàng $i$ bên trái với cột $j$ bên phải (nhân từng cặp rồi cộng). Vì vậy số cột bên trái phải bằng
      số hàng bên phải: ma trận $a$ hàng $b$ cột nhân ma trận $b$ hàng $c$ cột cho ma trận $a$ hàng $c$ cột.</p>

      $$\begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix} \begin{pmatrix} 5 \\ 6 \end{pmatrix} = \begin{pmatrix} 1 \cdot 5 + 2
      \cdot 6 \\ 3 \cdot 5 + 4 \cdot 6 \end{pmatrix} = \begin{pmatrix} 17 \\ 39 \end{pmatrix}$$

      <p>Một cột (2 hàng, 1 cột) nhân một hàng (1 hàng, 2 cột) cho ma trận 2 hàng 2 cột: $\begin{pmatrix} 1 \\ 2 \end{pmatrix}
      \begin{pmatrix} 1 & 2 \end{pmatrix} = \begin{pmatrix} 1 & 2 \\ 2 & 4 \end{pmatrix}$.</p>

      '
    introduces:
    - cdot
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Trước hết, ta cần hiểu ma trận và phép nhân ma trận. Ma trận là một bảng số có a hàng và b cột. Khi nhân hai ma trận,
      ô ở hàng i, cột j của kết quả bằng tích vô hướng của hàng i bên trái với cột j bên phải, tức nhân từng cặp rồi cộng.
      Vì vậy số cột bên trái phải bằng số hàng bên phải. Ví dụ bảng 1, 2, 3, 4 nhân cột 5, 6. Ô trên là 1 nhân 5 cộng 2 nhân
      6 bằng 17, ô dưới là 3 nhân 5 cộng 4 nhân 6 bằng 39. Một cột hai số 1, 2 nhân một hàng hai số 1, 2 cho ma trận 2 nhân
      2 với các số 1, 2, 2, 4. Đọc thành thạo kích thước ma trận qua hàng và cột là bước bắt buộc để tính số lượng phần tử
      bộ nhớ trước lúc chạy thử.
  - clear: true
    show: '<p>Hàng thứ hai (2, 4) đúng bằng 2 lần hàng thứ nhất (1, 2): ma trận chỉ có <b>một hướng</b> thật sự. <b>Hạng</b>
      của ma trận là số hướng thật sự như vậy (số hàng không viết được từ các hàng khác) — ở đây hạng 1.</p>

      <p>Vì sao tích $B \cdot A$, với $B$ có $r$ cột, có hạng tối đa $r$: mỗi hàng của $B \cdot A$ là một tổ hợp (nhân rồi
      cộng) của đúng $r$ hàng của $A$, nên không thể có quá $r$ hướng. Cột nhân hàng là trường hợp $r = 1$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Hàng thứ hai, 2 và 4, đúng bằng 2 lần hàng thứ nhất, 1 và 2, nên ma trận chỉ có một hướng thật sự. Hạng của ma trận
      là số hướng thật sự như vậy, tức số hàng không viết được từ các hàng khác, và ở đây hạng bằng 1. Nếu ma trận B có r
      cột, mỗi hàng của tích B nhân A là một tổ hợp của đúng r hàng của A. Vì vậy tích không thể có quá r hướng, và tích của
      một cột với một hàng là trường hợp r bằng 1, ý tưởng của bài hôm nay. Khái niệm hạng thấp cho thấy sự thay đổi hành
      vi nhiệm vụ thường chỉ dịch chuyển trong một không gian con rất ít chiều.
- id: sym
  kind: symbol
  title: 'Giải mã: tinh chỉnh hạng thấp'
  steps:
  - show: '<p><b>Tinh chỉnh toàn bộ</b>: tiếp tục huấn luyện mọi tham số trên dữ liệu mới.</p>

      <p><b>Tinh chỉnh hạng thấp (<b>LoRA</b>)</b>: giữ nguyên $W$ ($d \times d$), học thêm hai ma trận nhỏ $B$ ($d \times
      r$) và $A$ ($r \times d$) với $r$ nhỏ (ví dụ 8):</p>

      <p>$W'' = W + B \cdot A$. Tích $B \cdot A$ có hạng tối đa $r$ — thay đổi bị giới hạn trong $r$ “hướng”. $B$ khởi tạo
      bằng 0 nên lúc đầu mô hình y như cũ.</p>

      <p>Số tham số học: $r \cdot (d + d)$ thay vì $d \cdot d$.</p>

      '
    introduces:
    - prime
    focus:
    - 1
    - 2
    - 3
    - 3
    - 4
    - 4
    say: Tinh chỉnh toàn bộ là tiếp tục huấn luyện mọi tham số trên dữ liệu mới. Tinh chỉnh hạng thấp giữ nguyên ma trận W
      cỡ d nhân d, và học thêm hai ma trận nhỏ B cỡ d nhân r, A cỡ r nhân d, với r nhỏ, ví dụ 8. Ma trận mới bằng W cộng B
      nhân A, và tích B nhân A có hạng tối đa r, tức thay đổi bị giới hạn trong r hướng. B khởi tạo bằng 0, nên lúc đầu mô
      hình y như cũ. Số tham số phải học là r nhân 2 d, thay vì d nhân d. Khoá cứng trọng số gốc và ghép nhánh rẽ cặp ma trận
      kẹp B nhân A thu gọn hàng trăm lần chi phí lưu trữ từng bản tinh chỉnh.
- id: intuition
  kind: intuition
  title: Một ma trận lớn cộng tích của hai ma trận mỏng
  steps:
  - show: '<div><svg width="1500" height="330" viewBox="0 0 1500 330">

      <rect x="60" y="30" width="270" height="270" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/>

      <rect x="470" y="30" width="270" height="270" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/>

      <rect x="860" y="30" width="36" height="270" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/>

      <rect x="960" y="30" width="270" height="36" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/>

      <g font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">

      <text x="195" y="175">W mới</text><text x="400" y="175">=</text><text x="605" y="175">W (giữ nguyên)</text><text x="800"
      y="175">+</text>

      <text x="878" y="175">B</text><text x="928" y="110" font-size="22">nhân</text><text x="1095" y="58">A</text></g>

      <g font-size="23" fill="#1f2937"><text x="1250" y="130">B: d hàng, r cột</text><text x="1250" y="170">A: r hàng, d cột</text><text
      x="1250" y="210">r nhỏ (ví dụ 8)</text>

      <text x="960" y="150">chỉ học phần cam</text></g>

      </svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình so kích thước các ma trận. Ma trận gốc W là hình vuông lớn, giữ nguyên, không học. Ta chỉ học hai dải mỏng màu
      cam, B có d hàng nhưng chỉ r cột, A có r hàng và d cột, với r nhỏ như 8, và tích của chúng có cùng cỡ với W. Hai dải
      hẹp B và A đóng vai trò thấu kính hiệu chỉnh nhẹ phủ lên ma trận gốc đồ sộ nằm im.
- id: example
  kind: example
  title: 'Đếm tham số: 0,39% một ma trận, 0,13% cả mô hình'
  checks:
  - alg.lora_params(4096, 4096, 8) == 65536 and 4096 ** 2 == 16777216 and round(65536 / 16777216 * 100, 2) == 0.39
  - 32 * 4 * alg.lora_params(4096, 4096, 8) == 8388608 and round(8388608 / (12 * 32 * 4096 ** 2) * 100, 2) == 0.13
  steps:
  - show: '<p><b>Bước 1 — một ma trận</b> 4096 hàng, 4096 cột, tinh chỉnh toàn bộ: $4096 \cdot 4096 = 16\,777\,216$ số.</p>

      '
    say: Bước một, với một ma trận 4096 hàng và 4096 cột, tinh chỉnh toàn bộ phải học 4096 nhân 4096, bằng 16 triệu 777 nghìn
      216 số. Mười sáu triệu phần tử chỉ cho đúng một ma trận vuông giải thích vì sao tinh chỉnh toàn bộ nhanh chóng tràn
      bộ nhớ thẻ.
  - show: '<p><b>Bước 2 — hạng thấp</b> $r = 8$: $B$ có $4096 \cdot 8 = 32\,768$ số, $A$ có $8 \cdot 4096 = 32\,768$ số, cộng
      $= \hl{65\,536}$ — chỉ $\approx 0{,}39\%$.</p>

      '
    say: Bước hai, hạng thấp với r bằng 8, ma trận B có 4096 nhân 8 bằng 32 nghìn 768 số, ma trận A cũng vậy. Cộng lại là
      65 nghìn 536 số, chỉ khoảng 0 phẩy 39 phần trăm. Chưa tới nửa phần trăm lượng tham số cần cập nhật vẫn đủ dẫn hướng
      hành vi đầu ra bám sát phong cách mong muốn.
  - clear: true
    show: '<table class="t"><tr><th>phạm vi</th><th>toàn bộ</th><th>hạng thấp $r = 8$</th><th>tỉ lệ</th></tr>

      <tr><td>4 ma trận chú ý mỗi tầng, 32 tầng = 128 ma trận</td><td>≈ 6,44 tỉ (cả phần thân, bài 5)</td><td>$128 \cdot 65\,536
      = 8\,388\,608$</td><td>≈ $\hl{0{,}13\%}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    say: Bước ba, áp dụng cho 4 ma trận chú ý ở mỗi tầng, 32 tầng, tức 128 ma trận. Hạng thấp học 128 nhân 65 nghìn 536, khoảng
      8 triệu 400 nghìn số, chỉ khoảng 0 phẩy 13 phần trăm của 6 phẩy 44 tỉ tham số phần thân ở bài 5. Tích lũy xuyên ba mươi
      hai tầng biến toàn bộ bản vá tinh chỉnh từ mười ba ghi-ga-bai xuống chưa đầy hai mươi mê-ga-bai.
  - show: '<p><b>Bước 4 — lưu:</b> 8 388 608 số, mỗi số 2 byte, ≈ 16,8 triệu byte (≈ 16,8 MB) thay vì cả mô hình ≈ 12,9 GB;
      nhiều “bản tinh chỉnh” dùng chung một mô hình gốc.</p>

      '
    say: Bước bốn, lưu kết quả tinh chỉnh chỉ cần khoảng 16 triệu 800 nghìn byte, thay vì gần 13 GB cho cả mô hình, nên nhiều
      bản tinh chỉnh dùng chung được một mô hình gốc. Một máy chủ duy nhất có thể phục vụ đồng thời hàng trăm bản thích nghi
      khác nhau nhờ dùng chung trọn khối mô hình nền tĩnh.
  - clear: true
    show: '<p><b>Minh hoạ Python so sánh tham số toàn bộ và LoRA hạng thấp</b></p><div class="code"><div>d, r = 4096, 8</div><div>full
      = d * d; lora = 2 * d * r</div><div>print(f"full={full} lora={lora} ratio={lora/full*100:.2f}%")</div><div style="color:#059669">#
      Kết quả: full=16777216 lora=65536 ratio=0.39%</div></div>'
    focus:
    - 1
    - 2
    say: Đoạn mã tính trực tiếp số phần tử ma trận vuông 4096 so với cặp ma trận hạng tám. Tỉ lệ tham số cần học giảm mạnh
      xuống chưa đầy không phẩy bốn phần trăm.
- id: check
  kind: check
  title: Tự kiểm bằng đường khác
  checks:
  - alg.lora_params(4096, 4096, 8) == 2 * 4096 * 8 and round(2 * 8 / 4096 * 100, 2) == 0.39
  - 8388608 * 2 == 16777216
  steps:
  - show: '<table class="t"><tr><th>con số</th><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>0,39%</td><td>$\frac{r \cdot 2d}{d \cdot d} = \frac{2r}{d} = \frac{16}{4096}$</td><td>0,39% ✓</td></tr>

      <tr><td>16,8 triệu byte</td><td>8 388 608 nhân 2 = 16 777 216 — đúng bằng số phần tử của MỘT ma trận đầy đủ</td><td>✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác. Vì d ở tử và mẫu triệt tiêu, tỉ lệ r nhân 2 d chia d nhân d rút gọn thành 2 r chia d, tức 16
      chia 4096, đúng 0 phẩy 39 phần trăm. Và 8 triệu 388 nghìn 608 nhân 2 byte bằng 16 triệu 777 nghìn 216, đúng bằng số
      phần tử của một ma trận đầy đủ, một cách nhớ thú vị. Công thức rút gọn hai r chia d giúp đánh giá tức thì hệ số nén
      tham số cho bất kỳ hạng thấp r nào bạn dự kiến chọn.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Tinh chỉnh để “nạp kiến thức mới” <b class="red">(dễ ảo giác)</b>

      <br><span class="note"><b>Ảo giác</b>: mô hình nói trôi chảy, tự tin một điều sai. Tinh chỉnh giỏi dạy <b>hành vi</b>:
      giọng văn, định dạng, cách từ chối. Dữ kiện hay thay đổi (giá, chính sách) nên đưa vào qua <b>truy xuất</b> lúc trả
      lời — tìm đoạn văn bản liên quan trong kho của mình rồi dán vào văn bản đưa cho mô hình — có trích nguồn (Gekhman và
      cộng sự, 2024: tinh chỉnh trên dữ kiện mới làm mô hình dễ ảo giác hơn).</span></div>

      '
    say: Lỗi thứ nhất, tinh chỉnh để nạp kiến thức mới, nên dễ ảo giác, tức mô hình nói trôi chảy và tự tin một điều sai.
      Tinh chỉnh giỏi dạy hành vi như giọng văn, định dạng, hay cách từ chối. Dữ kiện hay thay đổi như giá hay chính sách
      nên đưa vào qua truy xuất lúc trả lời, có trích nguồn.
  - show: ''
    say: Truy xuất là tìm đoạn văn bản liên quan trong kho của mình, rồi dán vào văn bản đưa cho mô hình. Một nghiên cứu năm
      2024 đã thấy tinh chỉnh trên dữ kiện mới làm mô hình dễ ảo giác hơn. Muốn đưa văn bản kiến thức hoàn toàn mới vào câu
      trả lời hãy ưu tiên truy xuất ngữ cảnh thay vì ép mô hình học thuộc qua tinh chỉnh.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Tinh chỉnh trên ít dữ liệu quá lâu <b class="red">(quên năng lực cũ)</b>

      <br><span class="note">Mô hình học thuộc vài trăm ví dụ và làm kém đi ở việc khác. Giữ tập kiểm tra cho cả năng lực
      chung, dừng sớm khi điểm chung tụt.</span></div>

      '
    say: Lỗi thứ hai, tinh chỉnh trên ít dữ liệu quá lâu, nên mô hình quên năng lực cũ. Mô hình học thuộc vài trăm ví dụ và
      làm kém đi ở việc khác. Hãy giữ tập kiểm tra cho cả năng lực chung, và dừng sớm khi điểm chung tụt. Huấn luyện lặp quá
      lâu trên tập mẫu hẹp làm mô hình mất đi khả năng suy luận đa dạng từng học được từ hàng nghìn tỉ chữ trước đó.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Tinh chỉnh trước khi thử lời nhắc <b class="red">(tốn công)</b>

      <br><span class="note"><b>Lời nhắc</b> là văn bản ta đưa vào mô hình (câu hỏi, hướng dẫn, ví dụ mẫu). Thứ tự hợp lý:
      viết lời nhắc rõ có ví dụ → thêm truy xuất nếu thiếu dữ kiện → tinh chỉnh khi vẫn sai về hành vi và đã có bộ đánh giá
      để đo cải thiện.</span></div>

      '
    say: Lỗi thứ ba, tinh chỉnh trước khi thử lời nhắc, nên tốn công. Lời nhắc là văn bản ta đưa vào mô hình, gồm câu hỏi,
      hướng dẫn và ví dụ mẫu. Thứ tự hợp lý là viết lời nhắc rõ ràng có ví dụ, rồi thêm truy xuất nếu thiếu dữ kiện. Chỉ tinh
      chỉnh khi vẫn sai về hành vi, và khi đã có bộ đánh giá để đo cải thiện. Khai thác tốt hướng dẫn ngữ cảnh và vài ví dụ
      minh hoạ trong lời nhắc thường giải quyết tám mươi phần trăm bài toán không cần chạm vào trọng số.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.lora_params(5120, 5120, 16) == 163840 and round(163840 / 5120 ** 2 * 100, 3) == 0.625
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Ma trận 5120 hàng, 5120 cột, hạng $r = 16$: phải học bao nhiêu tham số? Chiếm bao nhiêu phần trăm
      ma trận?</td></tr>

      <tr><td>2</td><td>Vì sao khởi tạo $B = 0$ (không phải ngẫu nhiên)?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, với ma trận 5120 nhân 5120 và hạng 16, phải học bao nhiêu tham số? Chúng chiếm
      bao nhiêu phần trăm ma trận? Câu hai, vì sao khởi tạo B bằng 0 chứ không phải ngẫu nhiên? Dừng video và làm ra giấy.
      Áp dụng cả công thức nhân kích thước ma trận lẫn lý do khởi tạo bằng không cho ma trận B.
    pause: 15
  - show: '<p>① $16 \cdot (5120 + 5120) = \hl{163\,840}$ tham số; ma trận đầy đủ $5120 \cdot 5120 = 26\,214\,400$ → $\frac{2
      \cdot 16}{5120} = 0{,}625\%$.</p>

      '
    say: Đáp án câu một, 16 nhân 5120 cộng 5120, bằng 163 nghìn 840 tham số. Ma trận đầy đủ có 26 triệu 214 nghìn 400 số,
      nên tỉ lệ bằng 2 nhân 16 chia 5120, tức 0 phẩy 625 phần trăm. Hạng mười sáu trên chiều năm nghìn một trăm hai mươi chỉ
      dùng đúng không phẩy sáu hai lăm phần trăm tham số.
  - show: '<p>② $B = 0$ → $B \cdot A = 0$ → $W'' = W$ lúc đầu: mô hình bắt đầu <b>đúng như mô hình gốc</b>, học chỉ đi từ
      chỗ đã tốt. Nếu cả hai ma trận đều ngẫu nhiên, ngay bước đầu mô hình đã bị lệch khỏi trọng số ban đầu trước khi học
      được gì.</p>

      '
    say: Câu hai, B bằng 0 thì tích B nhân A bằng 0, nên lúc đầu ma trận mới bằng đúng W, và mô hình bắt đầu đúng như mô hình
      gốc. Nếu cả hai ma trận đều ngẫu nhiên, ngay bước đầu mô hình đã bị lệch khỏi trọng số ban đầu trước khi học được gì.
      Khởi tạo B bằng không còn A bằng nhiễu ngẫu nhiên nhỏ tạo bước xuất phát mượt không phá nát biểu diễn cũ ngay vòng đầu.
