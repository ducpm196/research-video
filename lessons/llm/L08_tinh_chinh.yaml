- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">toàn bộ: ≈ 16 byte mỗi tham số</span><span class="a">→</span>

      <span class="n">hạng thấp: W cộng tích BA, học r(d + d) số</span><span class="a">→</span>

      <span class="n">dạy hành vi, không nạp dữ kiện</span><span class="a">→</span>

      <span class="n">lời nhắc → truy xuất → tinh chỉnh</span></div>

      '
    say: Tổng kết lại, tinh chỉnh toàn bộ tốn khoảng 16 byte mỗi tham số, còn hạng thấp chỉ học r nhân 2 d số. Tinh chỉnh
      dạy hành vi chứ không nạp dữ kiện, và thứ tự nên là lời nhắc, truy xuất, rồi mới tinh chỉnh. Trong tinh chỉnh toàn bộ
      trọng số, ngoài lưu tham số mô hình còn phải giữ trạng thái bộ tối ưu và độ dốc làm bộ nhớ tăng vọt tới khoảng mười
      sáu byte mỗi số.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
  - show: '<div class="chain"><span class="n">toàn bộ: ≈ 16 byte mỗi tham số</span><span class="a">→</span>

      <span class="n">hạng thấp: W cộng tích BA, học r(d + d) số</span><span class="a">→</span>

      <span class="n">dạy hành vi, không nạp dữ kiện</span><span class="a">→</span>

      <span class="n">lời nhắc → truy xuất → tinh chỉnh</span></div>

      '
    say: Phân tích hạng thấp đóng băng ma trận trọng số gốc và chỉ huấn luyện cặp ma trận kẹp có hạng r nhỏ giúp giảm hàng
      trăm lần lượng tham số cập nhật. Đừng quên vai trò thực sự của tinh chỉnh là dạy mô hình định dạng đầu ra, giọng điệu
      hay kỹ năng chuyên biệt chứ không phải nạp kiến thức sự kiện mới. Để bổ sung dữ kiện biến động nhanh như văn bản nội
      bộ doanh nghiệp, đường ống truy xuất dữ liệu luôn tiết kiệm và cập nhật linh hoạt hơn nhiều. Thứ tự tối ưu chi phí cho
      dự án thực tế luôn bắt đầu từ thử lời nhắc tốt, ghép thêm truy xuất ngữ cảnh rồi mới cân nhắc tinh chỉnh trọng số. Tách
      bạch khâu cập nhật tri thức bằng kho truy xuất ngoài với khâu tinh chỉnh phong cách bằng ma trận hạng thấp giúp tiết
      kiệm phần lớn ngân sách vận hành. Hãy luôn giữ nguyên một bộ đánh giá hồi quy cố định để chắc chắn tinh chỉnh mới không
      làm hỏng khả năng tổng quát. Thay vì cập nhật toàn bộ hàng tỉ trọng số, phương pháp hạng thấp giữ nguyên ma trận sẵn
      có và chỉ học thêm hai ma trận rất hẹp.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
  - show: '<div class="box key"><b>Tư duy:</b> muốn đổi mô hình, hãy hỏi trước: cần đổi <b>cách nó làm</b> hay đổi <b>điều
      nó biết</b>?</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ tinh chỉnh toàn bộ 128 ma trận trên mô hình 32 tầng (~12,9 GB trọng số,
      103 GB bộ tối ưu Adam) tới LoRA hạng 8 (16,8 MB): LoRA hạng 8 chỉ lưu ~0,13–0,39% tham số mới, giữ chi phí triển khai
      nhiều tác vụ rất thấp.</p>

      '
    say: Điều cần mang theo, muốn đổi mô hình, hãy hỏi trước cần đổi cách nó làm, hay đổi điều nó biết. Xác định rõ mục tiêu
      sửa phong cách hay cấp dữ liệu mới định hướng đúng công cụ ngay từ đầu dự án.
    focus:
    - 1
    - 1
  - clear: true
    show: '<p class="note">Bài sau (bài 9): <b>học theo chỉ dẫn</b> và căn chỉnh theo đánh giá của con người.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 9, ta học cách dạy mô hình làm theo chỉ dẫn, và căn chỉnh theo đánh giá của con người. Hẹn gặp bạn
      ở bài tiếp theo.
