          <tr><td>1</td><td>Ma trận 5120 hàng, 5120 cột, hạng $r = 16$: phải học bao nhiêu tham số? Chiếm bao nhiêu phần trăm ma trận?</td></tr>
          <tr><td>2</td><td>Vì sao khởi tạo $B = 0$ (không phải ngẫu nhiên)?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với ma trận 5120 nhân 5120 và hạng 16, phải học bao nhiêu tham số? Chúng chiếm bao nhiêu phần trăm ma trận? Câu hai, vì sao khởi tạo B bằng 0 chứ không phải ngẫu nhiên? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $16 \cdot (5120 + 5120) = \hl{163\,840}$ tham số; ma trận đầy đủ $5120 \cdot 5120 = 26\,214\,400$ → $\frac{2 \cdot 16}{5120} = 0{,}625\%$.</p>
        say: "Đáp án câu một, 16 nhân 5120 cộng 5120, bằng 163 nghìn 840 tham số. Ma trận đầy đủ có 26 triệu 214 nghìn 400 số, nên tỉ lệ bằng 2 nhân 16 chia 5120, tức 0 phẩy 625 phần trăm."
      - show: |
          <p>② $B = 0$ → $B \cdot A = 0$ → $W' = W$ lúc đầu: mô hình bắt đầu <b>đúng như mô hình gốc</b>, học chỉ đi từ chỗ đã tốt. Khởi tạo ngẫu nhiên thì ngay bước đầu đã làm hỏng mô hình.</p>
        say: "Câu hai, B bằng 0 thì tích B nhân A bằng 0, nên lúc đầu ma trận mới bằng đúng W, và mô hình bắt đầu đúng như mô hình gốc. Khởi tạo ngẫu nhiên thì ngay bước đầu đã làm hỏng mô hình."

