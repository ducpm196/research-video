# Quy ước: mất mát = trung bình −ln(xác suất của từ tố đúng) (đơn vị nat, lôgarit tự nhiên); độ hỗn loạn = e^mất mát (khớp bài 1 vì cùng cơ số).
#   C ≈ 6·N·D phép tính dấu phẩy động (N tham số, D từ tố huấn luyện). 10¹⁴ phép tính hiệu dụng mỗi giây cho một thẻ là SỐ MINH HOẠ.
#   Tên Chinchilla chỉ trên màn hình; lời đọc “một nghiên cứu năm 2022”.
