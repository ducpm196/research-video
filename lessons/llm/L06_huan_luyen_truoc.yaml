scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một con số quyết định ngân sách huấn luyện"
    checks:
      - "6 * 7e9 * 1.4e11 == 5.88e21 and round(5.88e21 / (1e14 * 86400)) == 681"
    steps:
      - show: |
          <p>Trước khi huấn luyện một mô hình 7 tỉ tham số, đội kỹ sư phải trả lời: cần bao nhiêu dữ liệu, bao nhiêu phép tính? Ước lượng nhanh cho ≈ $5{,}9 \cdot 10^{21}$ phép tính — khoảng <b>681 ngày-thẻ</b> nếu mỗi thẻ làm $10^{14}$ phép tính mỗi giây (số minh hoạ).</p>
          <p class="note"><b>Tham số</b>: một con số mô hình tự chỉnh trong lúc học. <b>Từ tố</b>: một mẩu chữ (một từ hoặc một phần của từ) mà mô hình đọc và đoán lần lượt. <b>Thẻ</b>: thẻ tăng tốc tính toán (bộ xử lý đồ hoạ) cắm vào máy; 1 ngày-thẻ = một thẻ chạy suốt một ngày.</p>
          <div class="box key">Hôm nay: <b>mất mát entropy chéo</b> mà mô hình tối ưu khi huấn luyện trước, và <b>quy luật mở rộng</b> để lập ngân sách.</div>
        focus: [1, 1, 2, 2, 2, 3]
        say: "Chào bạn, trước khi huấn luyện một mô hình 7 tỉ tham số, đội kỹ sư phải trả lời cần bao nhiêu dữ liệu và bao nhiêu phép tính. Ước lượng nhanh cho khoảng 5 phẩy 9 nhân 10 mũ 21 phép tính, tức khoảng 681 ngày thẻ tính toán nếu mỗi thẻ làm 10 mũ 14 phép tính mỗi giây, một con số minh hoạ. Tham số là một con số mà mô hình tự chỉnh trong lúc học. Từ tố là một mẩu chữ, có thể là một từ hay một phần của từ, mà mô hình đọc và đoán lần lượt. Thẻ ở đây là thẻ tăng tốc tính toán cắm vào máy, và một ngày thẻ là một thẻ chạy suốt một ngày. Hôm nay ta học mất mát entropy chéo mà mô hình tối ưu khi huấn luyện trước, và quy luật mở rộng để lập ngân sách."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Trước hết: lôgarit tự nhiên, độ dốc, và độ hỗn loạn của bài 1"
    checks:
      - "math.log(1) == 0 and round(math.log(0.5), 3) == -0.693 and round(math.exp(math.log(7)), 9) == 7"
      - "round(math.exp(2), 3) == 7.389 and round(math.log(7.389), 3) == 2.0"
      - "(lambda f: f(5) == 4 and round(f(5.01), 4) == 4.0401 and round((f(5.01) - f(5)) / 0.01, 2) == 4.01 and f(4.9) < f(5) and round(f(4.9), 2) == 3.61)(lambda w: (w - 3) ** 2)"
    steps:
      - show: |
          <p><b>Lôgarit tự nhiên</b> $\ln x$ là số mũ phải nâng $e \approx 2{,}718$ lên để được $x$. Ví dụ $e^2 \approx 7{,}389$, nên $\ln 7{,}389 \approx 2$.</p>
          <table class="t"><tr><th>phép</th><th>ví dụ</th><th>nghĩa</th></tr>
          <tr><td>$\ln 1$</td><td>0</td><td>vì $e^0 = 1$: chắc chắn thì không “ngạc nhiên”</td></tr>
          <tr><td>$\ln 0{,}5$</td><td>≈ −0,693</td><td>số nhỏ hơn 1 có lôgarit âm</td></tr>
          <tr><td>$e^{\ln 7}$</td><td>7</td><td>e mũ và lôgarit triệt tiêu nhau</td></tr></table>
        introduces: [log, exp]
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Trước hết, ta cần lôgarit tự nhiên. Lôgarit tự nhiên của x là số mũ phải nâng e, khoảng 2 phẩy 718, lên để được x, ví dụ e bình phương khoảng 7 phẩy 389, nên lôgarit của 7 phẩy 389 khoảng bằng 2. Lôgarit của 1 bằng 0, vì e mũ 0 bằng 1. Lôgarit của 0 phẩy 5 xấp xỉ trừ 0 phẩy 693, vì số nhỏ hơn 1 có lôgarit âm. Và e mũ lôgarit của 7 lại bằng 7, vì hai phép này triệt tiêu nhau."
      - clear: true
        show: |
          <p><b>Huấn luyện</b> là sửa dần các tham số cho mất mát nhỏ đi. <b>Độ dốc</b> (đạo hàm) của mất mát theo một tham số cho biết: nhích tham số lên một chút thì mất mát đổi bao nhiêu.</p>
          <p>Làm thử mất mát $f(w) = (w - 3)^2$ ở $w = 5$: $f = 4$; nhích lên $w = 5{,}01$ thì $f = 4{,}0401$, tăng 0,0401 cho mỗi 0,01 → độ dốc ≈ 4 (dương). Vậy phải <b>giảm</b> $w$, đi ngược độ dốc: $f(4{,}9) = 3{,}61 \lt 4$ ✓.</p>
          <p><b>Chiều đi tới</b>: từ đầu vào tính ra dự đoán và mất mát. <b>Lan truyền ngược</b>: đi từ tầng cuối về tầng đầu để tính độ dốc của mất mát theo <b>mọi</b> tham số.</p>
        introduces: [ltgt]
        focus: [1, 1, 2, 2, 2, 3, 3]
        say: "Tiếp theo là độ dốc. Huấn luyện là sửa dần các tham số cho mất mát nhỏ đi, và độ dốc của mất mát theo một tham số cho biết nhích tham số lên một chút thì mất mát đổi bao nhiêu. Làm thử với mất mát bằng w trừ 3, tất cả bình phương, ở w bằng 5 thì mất mát bằng 4. Nhích w lên 5 phẩy 01 thì mất mát thành 4 phẩy 0401, tăng 0 phẩy 0401 cho mỗi 0 phẩy 01, nên độ dốc khoảng bằng 4. Độ dốc dương nên phải giảm w, và quả thật ở 4 phẩy 9 mất mát chỉ còn 3 phẩy 61. Chiều đi tới là tính từ đầu vào ra dự đoán và mất mát. Lan truyền ngược là đi từ tầng cuối về tầng đầu, để tính độ dốc của mất mát theo mọi tham số."
      - show: |
          <p><b>Ở bài 1</b>, độ hỗn loạn của một chuỗi $T$ từ tố có xác suất $P$ là $PP = P^{-1/T}$: mô hình bối rối như chọn đều trong $PP$ khả năng mỗi bước; mô hình đoán đều 6 từ có độ hỗn loạn đúng bằng 6.</p>
          <p class="note">Bài này gọi độ dài chuỗi là $T$, vì chữ $N$ sẽ dành cho <b>số tham số</b>.</p>
        focus: [1, 1, 1, 2]
        say: "Ở bài 1, độ hỗn loạn của một chuỗi gồm T từ tố bằng xác suất của chuỗi mũ âm 1 chia T. Nghĩa là mô hình bối rối như chọn đều trong chừng ấy khả năng mỗi bước. Mô hình đoán đều 6 từ có độ hỗn loạn đúng bằng 6. Bài này gọi độ dài chuỗi là T, vì chữ N sẽ dành cho số tham số."

  - id: sym
    kind: symbol
    title: "Giải mã: mất mát, độ hỗn loạn, N, D, C"
    checks:
      - "(lambda q, p: abs(-sum(a * math.log(b) for a, b in zip(q, p) if a) - (-math.log(0.5))) < 1e-12)((0, 1, 0), (0.3, 0.5, 0.2))"
    steps:
      - show: |
          <p><b>Vì sao gọi là entropy chéo:</b> nó đo độ lệch giữa phân phối đáp án thật $q$ và phân phối của mô hình $p$, bằng $-\sum_i q_i \ln p_i$. Đáp án thật đặt xác suất 1 cho từ tố đúng, 0 cho mọi từ khác, nên tổng chỉ còn một số hạng: $-\ln p_{\text{đúng}}$. Ví dụ mô hình cho (0,3; 0,5; 0,2), từ đúng là từ thứ hai: mất mát $= -\ln 0{,}5 \approx 0{,}693$.</p>
        introduces: [sum, sub]
        focus: [1, 1, 1, 1]
        say: "Trước khi vào công thức, ta xem vì sao gọi là entropy chéo. Đại lượng này đo độ lệch giữa phân phối đáp án thật và phân phối của mô hình, bằng âm tổng của xác suất thật nhân lôgarit xác suất mô hình. Đáp án thật đặt xác suất 1 cho từ tố đúng và 0 cho mọi từ khác, nên tổng chỉ còn một số hạng, âm lôgarit xác suất của từ tố đúng. Ví dụ mô hình cho ba từ 0 phẩy 3, 0 phẩy 5 và 0 phẩy 2, từ đúng là từ thứ hai, thì mất mát bằng âm lôgarit của 0 phẩy 5, khoảng 0 phẩy 693."
      - clear: true
        show: |
          <p><b>Mất mát entropy chéo</b> ở mỗi vị trí: $-\ln p$, với $p$ là xác suất mô hình gán cho từ tố ĐÚNG tiếp theo. Mất mát của cả tập = trung bình theo mọi vị trí.</p>
          <p>Liên hệ với bài 1: độ hỗn loạn $= e^{\text{mất mát}}$ (cùng dùng lôgarit tự nhiên).</p>
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$N$</td><td>số tham số</td></tr>
          <tr><td>$D$</td><td>số từ tố dữ liệu huấn luyện</td></tr>
          <tr><td>$C \approx 6 \cdot N \cdot D$</td><td>số phép tính huấn luyện (2ND đi tới, 4ND lan truyền ngược)</td></tr></table>
          <p>Nghiên cứu năm 2022 (Hoffmann và cộng sự, mô hình Chinchilla): với ngân sách $C$ cố định, mất mát nhỏ nhất khi $D \approx 20 \cdot N$ (tỉ lệ đọc ra từ bảng ước lượng của họ).</p>
        focus: [1, 1, 2, 3, "3.2", "3.3", "3.4", 4]
        say: "Mất mát entropy chéo ở mỗi vị trí bằng âm lôgarit tự nhiên của p, với p là xác suất mô hình gán cho từ tố đúng tiếp theo. Mất mát của cả tập là trung bình theo mọi vị trí. Liên hệ với bài 1, độ hỗn loạn bằng e mũ mất mát, vì cùng dùng lôgarit tự nhiên. Bảng giới thiệu ba ký hiệu. N là số tham số. D là số từ tố dữ liệu huấn luyện. C xấp xỉ 6 nhân N nhân D là số phép tính huấn luyện, gồm 2 N D cho chiều đi tới và 4 N D cho lan truyền ngược. Một nghiên cứu năm 2022 cho thấy với ngân sách cố định, mất mát nhỏ nhất khi D xấp xỉ 20 nhân N."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mất mát phạt nặng khi mô hình gán xác suất nhỏ cho đáp án đúng"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><line x1="200" y1="300" x2="1330" y2="300" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="300" x2="200" y2="40" stroke="#6b7280" stroke-width="2"/><polyline points="255,60 288,98 332,130 398,163 475,189 585,216 750,245 915,266 1080,282 1190,292 1300,300" fill="none" stroke="#2a78d6" stroke-width="4"/><circle cx="475" cy="189" r="9" fill="#eb6834"/><circle cx="750" cy="245" r="9" fill="#eb6834"/><circle cx="1080" cy="282" r="9" fill="#eb6834"/><g font-size="23" fill="#1f2937"><text x="493" y="177">p = 0,25: 1,386</text><text x="768" y="231">p = 0,5: 0,693</text><text x="1070" y="260">p = 0,8: 0,223</text><text x="1340" y="306">p</text><text x="215" y="36">mất mát −ln p</text><text x="200" y="330" text-anchor="middle">0</text><text x="1300" y="330" text-anchor="middle">1</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ mất mát âm lôgarit p theo xác suất p mà mô hình gán cho từ tố đúng. Khi p tiến về 1, mất mát về 0, nghĩa là đoán đúng và tự tin thì không bị phạt. Khi p nhỏ dần, mất mát tăng vọt, nên mô hình bị phạt rất nặng khi tự tin vào câu trả lời sai."

  - id: example
    kind: example
    title: "Tính mất mát và lập ngân sách"
    checks:
      - "[round(-math.log(p), 4) for p in (0.25, 0.5, 0.8)] == [1.3863, 0.6931, 0.2231] and round((-math.log(0.25) - math.log(0.5) - math.log(0.8)) / 3, 4) == 0.7675 and round(math.exp(0.7675), 3) == 2.154"
      - "round((1.3863 + 0.6931 + 0.2231) / 3, 4) == 0.7675"
      - "round(math.exp(2.0), 2) == 7.39 and 20 * 7e9 == 1.4e11 and round(6 * 7e9 * 1.4e11 / 1e21, 2) == 5.88"
    steps:
      - show: |
          <table class="t"><tr><th>vị trí</th><th>xác suất từ tố đúng</th><th>$-\ln p$</th></tr>
          <tr><td>1</td><td>0,25</td><td>1,3863</td></tr>
          <tr><td>2</td><td>0,50</td><td>0,6931</td></tr>
          <tr><td>3</td><td>0,80</td><td>0,2231</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước một, tính mất mát ở ba vị trí, giữ bốn chữ số sau dấu phẩy để khỏi lệch khi làm tròn. Vị trí 1, mô hình gán xác suất 0 phẩy 25 cho từ tố đúng, mất mát 1 phẩy 3863. Vị trí 2, xác suất 0 phẩy 5, mất mát 0 phẩy 6931. Vị trí 3, xác suất 0 phẩy 8, mất mát 0 phẩy 2231."
      - show: |
          $$\text{mất mát} = \frac{1{,}3863 + 0{,}6931 + 0{,}2231}{3} \approx 0{,}7675 \;\Rightarrow\; PP = e^{0{,}7675} \approx 2{,}154$$
          <p>Một mô hình lớn có mất mát 2,0 thì độ hỗn loạn $e^{2} \approx \hl{7{,}39}$.</p>
        introduces: [implies]
        focus: [1, 1, 2]
        say: "Bước hai, lấy trung bình ba mất mát được xấp xỉ 0 phẩy 7675. Vì độ hỗn loạn bằng e mũ mất mát, nên nó xấp xỉ 2 phẩy 154. Một mô hình lớn có mất mát 2 thì độ hỗn loạn xấp xỉ 7 phẩy 39."
      - clear: true
        show: |
          <p><b>Bước 3 — ngân sách</b> cho $N = 7 \cdot 10^9$ tham số theo tỉ lệ 20 từ tố mỗi tham số:</p>
          <table class="t"><tr><th>đại lượng</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>dữ liệu $D$</td><td>$20 \cdot 7 \cdot 10^9$</td><td>$1{,}4 \cdot 10^{11}$ từ tố</td></tr>
          <tr><td>phép tính $C$</td><td>$6 \cdot 7 \cdot 10^9 \cdot 1{,}4 \cdot 10^{11}$</td><td>$\approx \hl{5{,}88 \cdot 10^{21}}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, lập ngân sách cho mô hình 7 tỉ tham số theo tỉ lệ 20 từ tố mỗi tham số. Dữ liệu cần 20 nhân 7 tỉ, tức 140 tỉ từ tố. Số phép tính xấp xỉ 6 nhân 7 tỉ nhân 140 tỉ, khoảng 5 phẩy 88 nhân 10 mũ 21."

  - id: check
    kind: check
    title: "Tự kiểm: độ hỗn loạn tính theo định nghĩa của bài 1"
    checks:
      - "round((0.25 * 0.5 * 0.8) ** (-1 / 3), 3) == round(math.exp((-math.log(0.25) - math.log(0.5) - math.log(0.8)) / 3), 3) == 2.154"
    steps:
      - show: |
          $$PP = (0{,}25 \cdot 0{,}5 \cdot 0{,}8)^{-1/3} = 0{,}1^{-1/3} \approx 2{,}154$$
          <p>Khớp $e^{0{,}7675} \approx 2{,}154$ ✓ — vì $e^{\text{trung bình của } -\ln p}$ chính là $P^{-1/T}$ (ở đây $T = 3$).</p>
        focus: [1, 2]
        say: "Kiểm bằng định nghĩa của bài 1, lấy tích của cả ba xác suất được 0 phẩy 1, rồi nâng lên lũy thừa âm 1 chia 3, được xấp xỉ 2 phẩy 154. Kết quả khớp với e mũ 0 phẩy 7675, vì e mũ trung bình của âm lôgarit p chính là xác suất cả chuỗi mũ âm 1 chia T, với T bằng 3."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "round(2.0 / math.log(2), 3) == 2.885 and round(2 ** (2.0 / math.log(2)), 2) == 7.39"
      - "round(1e12 / 7e9) == 143"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> So mất mát tính bằng hai cơ số khác nhau <b class="red">(lệch 1,44 lần)</b>
          <br><span class="note">Tính bằng $\ln$ thì đơn vị gọi là nat; tính bằng lôgarit cơ số 2 thì gọi là bit. Mất mát 2,0 nat = $2{,}0 / \ln 2 \approx 2{,}885$ bit. Cùng một mô hình, cùng độ hỗn loạn 7,39 — chỉ khác đơn vị. Ghi rõ cơ số.</span></div>
        say: "Lỗi thứ nhất, so mất mát tính bằng hai cơ số khác nhau, lệch nhau 1 phẩy 44 lần. Mất mát 2 tính bằng lôgarit tự nhiên bằng 2 chia lôgarit tự nhiên của 2, khoảng 2 phẩy 885 nếu tính bằng lôgarit cơ số 2. Cùng một mô hình, cùng độ hỗn loạn 7 phẩy 39, chỉ khác đơn vị, nên hãy ghi rõ cơ số."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Coi “20 từ tố mỗi tham số” là luật <b class="red">(chỉ là điểm tối ưu huấn luyện)</b>
          <br><span class="note">Tỉ lệ này tối ưu chi phí HUẤN LUYỆN. Mô hình được dùng nhiều thường huấn luyện lâu hơn nhiều với mô hình nhỏ hơn, vì tổng chi phí phục vụ trong suốt thời gian dùng có thể vượt chi phí huấn luyện một lần. Ví dụ (Touvron và cộng sự, 2023, mô hình LLaMA): bản 7 tỉ tham số học 1 nghìn tỉ từ tố, khoảng 143 từ tố mỗi tham số.</span></div>
        say: "Lỗi thứ hai, coi 20 từ tố mỗi tham số là luật, trong khi nó chỉ là điểm tối ưu cho huấn luyện. Tỉ lệ này tối ưu chi phí huấn luyện. Mô hình được dùng nhiều thường huấn luyện lâu hơn nhiều với kích thước nhỏ hơn, vì tổng chi phí phục vụ trong suốt thời gian dùng có thể vượt chi phí huấn luyện một lần. Ví dụ, một mô hình 7 tỉ tham số công bố năm 2023 đã học 1 nghìn tỉ từ tố, khoảng 143 từ tố mỗi tham số."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ mất mát thấp hơn là “thông minh hơn” <b class="red">(không trực tiếp)</b>
          <br><span class="note">Mất mát đo khả năng đoán từ tố trên dữ liệu kiểm tra. Năng lực làm việc cụ thể phải đo riêng bằng bộ câu hỏi có đáp án. Dữ liệu kiểm tra lọt vào dữ liệu huấn luyện còn làm mất mát thấp giả.</span></div>
        say: "Lỗi thứ ba, nghĩ mất mát thấp hơn là thông minh hơn, điều này không trực tiếp. Mất mát đo khả năng đoán từ tố trên dữ liệu kiểm tra, còn năng lực làm từng việc cụ thể phải đo riêng bằng bộ câu hỏi có đáp án. Dữ liệu kiểm tra lọt vào dữ liệu huấn luyện còn làm mất mát thấp giả."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(math.exp(1.5), 2) == 4.48 and 20 * 7e10 == 1.4e12 and 6 * 7e10 * 1.4e12 == 5.88e23"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Mất mát giảm từ 2,0 xuống 1,5. Độ hỗn loạn mới là bao nhiêu?</td></tr>
          <tr><td>2</td><td>Mô hình 70 tỉ tham số theo tỉ lệ 20 từ tố mỗi tham số: cần bao nhiêu từ tố và bao nhiêu phép tính?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, mất mát giảm từ 2 xuống 1 phẩy 5, độ hỗn loạn mới là bao nhiêu? Câu hai, mô hình 70 tỉ tham số theo tỉ lệ 20 từ tố mỗi tham số thì cần bao nhiêu từ tố và bao nhiêu phép tính? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $e^{1{,}5} \approx \hl{4{,}48}$ — từ “bối rối như chọn trong 7,4 khả năng” xuống còn 4,5.</p>
        say: "Đáp án câu một, e mũ 1 phẩy 5 xấp xỉ 4 phẩy 48, tức từ bối rối như chọn trong 7 phẩy 4 khả năng xuống còn 4 phẩy 5."
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>$D$</td><td>$20 \cdot 7 \cdot 10^{10}$</td><td>$1{,}4 \cdot 10^{12}$ từ tố</td></tr>
          <tr><td>$C$</td><td>$6 \cdot 7 \cdot 10^{10} \cdot 1{,}4 \cdot 10^{12}$</td><td>$\approx \hl{5{,}88 \cdot 10^{23}}$ — gấp 100 lần mô hình 7 tỉ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Câu hai, tính hai đại lượng. Dữ liệu cần 20 nhân 70 tỉ, tức 1 phẩy 4 nhân 10 mũ 12 từ tố. Số phép tính khoảng 5 phẩy 88 nhân 10 mũ 23. Con số này gấp 100 lần mô hình 7 tỉ, vì tham số gấp 10 và dữ liệu cũng gấp 10."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mất mát = trung bình −ln p</span><span class="a">→</span>
          <span class="n">độ hỗn loạn = e mũ mất mát</span><span class="a">→</span>
          <span class="n">C ≈ 6ND</span><span class="a">→</span>
          <span class="n">tỉ lệ dữ liệu / tham số theo mục tiêu chi phí</span></div>
        say: "Tổng kết lại, mất mát là trung bình âm lôgarit xác suất của từ tố đúng, độ hỗn loạn bằng e mũ mất mát. Số phép tính xấp xỉ 6 N D, và tỉ lệ dữ liệu trên tham số chọn theo mục tiêu chi phí."
      - show: |
          <div class="box key"><b>Tư duy:</b> quy luật mở rộng cho phép <b>dự đoán</b> chi phí trước khi chi tiền — nhưng chỉ dự đoán được mất mát, không dự đoán được mọi năng lực.</div>
        say: "Điều cần mang theo, quy luật mở rộng cho phép dự đoán chi phí trước khi chi tiền, nhưng chỉ dự đoán được mất mát, không dự đoán được mọi năng lực."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>sinh văn bản</b> — tham lam, nhiệt độ, giữ k từ tố đầu, lấy mẫu hạt nhân.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học cách sinh văn bản, với cách tham lam, nhiệt độ, giữ k từ tố đầu, và lấy mẫu hạt nhân. Hẹn gặp bạn ở bài tiếp theo."
