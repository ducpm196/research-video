- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - round(alg.paired_sign_p(70, 30), 4) == 0.0001 and (70 - 30) / 2000 == 0.02
  - round(alg.acc_ci95(0.82, 2000) * 100, 1) == 1.7 and round(alg.acc_ci95(0.80, 2000) * 100, 1) == 1.8 and 0.82 - alg.acc_ci95(0.82,
    2000) < 0.80 + alg.acc_ci95(0.80, 2000)
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Đọc bảng xếp hạng không có sai số <b class="red">(chênh lệch ảo)</b>

      <br><span class="note">Luôn kèm khoảng tin cậy. So hai mô hình thì dùng so theo cặp: cùng chênh 2 điểm nhưng trên bộ
      2000 câu, bất đồng 70 / 30 câu (số minh hoạ), thì khả năng ngẫu nhiên chỉ ≈ 0,0001 — gần như chắc là khác biệt thật,
      dù khoảng riêng của hai mô hình (±1,7 và ±1,8 điểm) vẫn chồng nhau.</span></div>

      '
    say: Lỗi thứ nhất, đọc bảng xếp hạng không có sai số, nên thấy chênh lệch ảo. Hãy luôn kèm khoảng tin cậy, và so hai mô
      hình thì dùng so theo cặp. Cũng chênh 2 điểm, nhưng trên một bộ 2000 câu với 70 và 30 câu bất đồng, một số minh hoạ,
      thì khả năng ngẫu nhiên chỉ khoảng 0 phẩy 0001, gần như chắc là khác biệt thật.
  - show: ''
    say: Điều này đúng dù khoảng tin cậy riêng của hai mô hình, cộng trừ 1 phẩy 7 và cộng trừ 1 phẩy 8 điểm, vẫn chồng nhau.
      Bảng xếp hạng uy tín luôn đi kèm khoảng sai số đo được nhằm dập tắt việc phóng đại những cải tiến ảo nhỏ hơn sai số
      ngẫu nhiên.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng bộ kiểm tra công khai lâu năm <b class="red">(có thể đã nhiễm)</b>

      <br><span class="note">Bộ câu hỏi đăng trên mạng có thể đã lọt vào dữ liệu huấn luyện. Dấu hiệu: điểm trên câu cũ cao
      hơn hẳn câu mới cùng độ khó. Giữ một bộ câu riêng, chưa từng công bố.</span></div>

      '
    say: Lỗi thứ hai, dùng bộ kiểm tra công khai lâu năm, có thể đã bị nhiễm. Bộ câu hỏi đăng trên mạng có thể đã lọt vào
      dữ liệu huấn luyện. Dấu hiệu là điểm trên câu cũ cao hơn hẳn câu mới cùng độ khó, nên hãy giữ một bộ câu riêng, chưa
      từng công bố. Khi bộ đề chuẩn xuất hiện tràn lan trên mạng, chỉ số điểm cao chót vót có nguy cơ phản ánh trí nhớ học
      vẹt thay vì suy luận.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Thử nhiều lời nhắc rồi báo kết quả tốt nhất <b class="red">(câu cá số liệu)</b>

      <br><span class="note">Thử 20 biến thể rồi chọn cái điểm cao nhất trên chính bộ kiểm tra là quá khớp bộ kiểm tra. Chọn
      trên bộ kiểm định riêng, báo trên bộ kiểm tra một lần.</span></div>

      '
    say: Lỗi thứ ba, thử nhiều lời nhắc rồi báo kết quả tốt nhất, một kiểu câu cá số liệu. Thử 20 biến thể rồi chọn cái điểm
      cao nhất trên chính bộ kiểm tra là quá khớp bộ kiểm tra. Hãy chọn trên bộ kiểm định riêng, rồi báo kết quả trên bộ kiểm
      tra đúng một lần. Thử nghiệm quá nhiều phiên bản lời nhắc trực tiếp trên tập kiểm thử biến tập kiểm thử thành tập huấn
      luyện trá hình.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.n_for_margin(0.8, 0.01) == 6147 and alg.n_for_margin(0.8, 0.02) == 1537
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Muốn khoảng tin cậy chỉ ±1 điểm khi độ chính xác khoảng 80%, cần bao nhiêu câu?</td></tr>

      <tr><td>2</td><td>Nếu chấp nhận ±2 điểm thì cần bao nhiêu câu? Vì sao không phải một nửa?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, muốn khoảng tin cậy chỉ cộng trừ 1 điểm khi độ chính xác khoảng 80 phần trăm,
      cần bao nhiêu câu? Câu hai, nếu chấp nhận cộng trừ 2 điểm thì cần bao nhiêu câu? Vì sao không phải một nửa? Dừng video
      và làm ra giấy. Chuyển vế công thức khoảng tin cậy để xác định quy mô tập câu hỏi tối thiểu đáp ứng ngân sách độ chính
      xác dự án.
    pause: 15
  - show: '<p>① Chuyển vế công thức khoảng: $n \geq \frac{1{,}96^2 \cdot 0{,}8 \cdot 0{,}2}{0{,}01^2} = \frac{0{,}6147}{0{,}0001}
      \approx \hl{6147}$ câu.</p>

      '
    introduces:
    - geq
    say: Đáp án câu một, chuyển vế công thức khoảng, n phải ít nhất bằng 1 phẩy 96 bình phương nhân 0 phẩy 8 nhân 0 phẩy 2,
      chia 0 phẩy 01 bình phương, khoảng 6147 câu. Cần ít nhất sáu nghìn một trăm bốn mươi bảy câu hỏi riêng biệt mới siết
      được khoảng tin cậy về đúng cộng trừ một phần trăm.
  - show: '<p>② ≈ <b>1537</b> câu — chỉ còn <b>một phần tư</b>, vì sai số tỉ lệ với $\frac{1}{\sqrt{n}}$: gấp đôi độ chính
      xác cần gấp bốn số câu.</p>

      '
    say: Câu hai, khoảng 1537 câu, chỉ còn một phần tư, vì sai số tỉ lệ với 1 chia căn n, nên muốn chính xác gấp đôi thì cần
      gấp bốn số câu. Nới lỏng ngưỡng sai số gấp đôi lên cộng trừ hai phần trăm tiết kiệm ngay ba phần tư chi phí gắn nhãn
      câu kiểm thử.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/LLM/L10
  steps:
  - show: <table class='t'><tr><th>Thực hành LLM:L10</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Nhận
      ra nhiễm dữ liệu kiểm tra</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>p=0.78 n=800</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh LLM L10 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 10 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Tính chính xác tỉ lệ phần trăm đúng và nửa biên rộng khoảng
      tin cậy chín mươi lăm phần trăm theo số câu đánh giá đầu vào. Kiểm định xuất đủ ký hiệu phần trăm kèm hai chữ số thập
      phân.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai LLM:L10</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (đổi tỉ lệ phần trăm)</b></td><td>Nhân tỉ lệ đúng p cho một trăm để hiển thị một chữ số</td></tr><tr><td><b>Bước 2 (sai
      số chuẩn nhị phân)</b></td><td>Lấy căn p nhân một trừ p chia cỡ đề kiểm n</td></tr><tr><td><b>Bước 3 (nhân z = 1.96)</b></td><td>Nhân
      một phẩy chín sáu và một trăm để ra điểm phần trăm</td></tr></table>
    say: Gợi ý cài đặt bài số 10 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 1 dòng khớp định dạng.
    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (1 dòng)</b></p><div class="code"><div>acc=78.0% margin_pp=2.87</div></div>
    say: Màn hình hiện 1 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">điểm đánh giá có sai số</span><span class="a">→</span>

      <span class="n">kèm khoảng tin cậy</span><span class="a">→</span>

      <span class="n">so theo cặp trên câu bất đồng</span><span class="a">→</span>

      <span class="n">bộ kiểm tra riêng, chưa công bố</span></div>

      '
    say: Tổng kết lại, điểm đánh giá có sai số, nên phải kèm khoảng tin cậy. So hai mô hình theo cặp trên các câu bất đồng,
      và dùng bộ kiểm tra riêng chưa công bố. Bất kỳ tỉ lệ phần trăm chính xác nào đo được trên tập kiểm tra hữu hạn đều là
      một biến ngẫu nhiên có sai số lấy mẫu đi kèm. Luôn báo cáo kèm biên độ khoảng tin cậy thay vì chỉ ghi điểm đơn lẻ giúp
      bạn tránh vội kết luận hệ mới thắng khi hai khoảng tin cậy còn chồng lấn lớn.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
  - show: '<div class="chain"><span class="n">điểm đánh giá có sai số</span><span class="a">→</span>

      <span class="n">kèm khoảng tin cậy</span><span class="a">→</span>

      <span class="n">so theo cặp trên câu bất đồng</span><span class="a">→</span>

      <span class="n">bộ kiểm tra riêng, chưa công bố</span></div>

      '
    say: Khi muốn so trực diện hai mô hình làm trên cùng một bộ câu hỏi, kiểm định theo cặp tập trung vào đúng tập câu hai
      bên cho kết quả bất đồng sẽ nhạy hơn nhiều. Rủi ro nghiêm trọng nhất ở các bảng xếp hạng công khai là nhiễm dữ liệu
      kiểm tra lọt vào tập huấn luyện trước làm điểm tăng ảo hoàn toàn. Thực hành tính biên độ khoảng tin cậy chín mươi lăm
      phần trăm trên tám trăm câu hỏi ngay sau đây giúp bạn thấy rõ tác động của cỡ mẫu. Một báo cáo đánh giá có trách nhiệm
      luôn nêu rõ kích thước tập thử, khoảng tin cậy và quy trình loại trừ nhiễm dữ liệu kiểm tra. Chú ý dùng kiểm định theo
      cặp trên chính các câu bất đồng giúp bạn phát hiện khác biệt thật sự với ít mẫu hơn. Một tỉ lệ đúng đơn lẻ trên tập
      thử nhỏ dễ gây ngộ nhận nếu thiếu biên độ sai số thống kê đi kèm. Tính thêm khoảng tin cậy 95 phần trăm cho biết độ
      chênh lệch có lớn hơn dao động ngẫu nhiên hay không.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
  - show: '<div class="box key"><b>Tư duy:</b> một con số không có sai số đi kèm là một <b>tin đồn</b>, chưa phải một phép
      đo.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ bộ thử 100 câu (sai số chuẩn rộng) tới 2 000 câu hỏi giữ sạch: rút biên
      sai số xuống 4,5× nhưng vẫn phải kiểm tra nhiễm dữ liệu huấn luyện trước khi tin điểm chuẩn.</p>

      '
    say: Điều cần mang theo, một con số không có sai số đi kèm chỉ là một tin đồn, chưa phải một phép đo. Mỗi điểm phần trăm
      chênh lệch chỉ mang ý nghĩa khi đặt cạnh khoảng tin cậy và phép thử trên bộ câu hỏi giữ sạch hoàn toàn. Thử nghiệm kiểm
      định theo cặp ngay trên các câu bất đồng giúp nhận diện tiến bộ thật nhanh gọn với ít chi phí hơn.
    focus:
    - 1
    - 1
    - 1
  - clear: true
    show: '<p class="note">Bài sau (bài 11): <b>ảo giác</b>, hiệu chuẩn và tự nhất quán.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 11, ta học ảo giác, hiệu chuẩn, và tự nhất quán. Hẹn gặp bạn ở bài tiếp theo.
