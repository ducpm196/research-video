scenes:
- id: hook
  kind: hook
  title: Bàn phím điện thoại đoán chữ tiếp theo
  checks:
  - alg.bigram_prob('<s> tôi thích mèo </s>') == __import__('fractions').Fraction(4, 9)
  steps:
  - show: '<p>Gõ “tôi thích”, bàn phím gợi ý “mèo”. Mô hình ngôn ngữ lớn trả lời cả đoạn văn cũng làm đúng một việc như vậy,
      lặp lại: <b>đoán từ tố tiếp theo</b> từ những gì đã có. Gốc của việc đoán là một con số — <b>xác suất của một chuỗi</b>.</p>

      <div class="box key">Hôm nay: mô hình ngôn ngữ gán xác suất cho chuỗi bằng <b>quy tắc chuỗi</b>, và cách ước lượng xác
      suất đó bằng <b>đếm</b>.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, khi bạn gõ hai chữ tôi thích, bàn phím điện thoại gợi ý ngay chữ mèo. Mô hình ngôn ngữ lớn trả lời cả đoạn
      văn cũng làm đúng một việc như vậy, lặp lại nhiều lần, đoán từ tố tiếp theo từ những gì đã có. Gốc của việc đoán là
      một con số, xác suất của một chuỗi. Hôm nay ta học cách mô hình ngôn ngữ gán xác suất cho chuỗi bằng quy tắc chuỗi,
      và cách ước lượng xác suất đó bằng đếm. Bản chất toàn bộ quá trình sinh văn bản dài chính là vòng lặp dự đoán từng mảnh
      tiếp theo có xác suất cao nhất dựa trên phần đã viết trước đó.
- id: prereq
  kind: prereq
  title: 'Trước hết: xác suất có điều kiện bằng đếm, và nhân phân số'
  checks:
  - __import__('fractions').Fraction(6, 10) == __import__('fractions').Fraction(3, 5) and __import__('fractions').Fraction(2,
    3) * __import__('fractions').Fraction(2, 3) == __import__('fractions').Fraction(4, 9)
  - __import__('fractions').Fraction(10, 30) == __import__('fractions').Fraction(1, 3) and __import__('fractions').Fraction(6,
    30) != __import__('fractions').Fraction(6, 10)
  steps:
  - show: '<p><b>Xác suất</b> là một số từ 0 tới 1 cho biết một việc dễ xảy ra tới đâu; khi đếm được, nó bằng số trường hợp
      có việc đó chia tổng số trường hợp. Lớp 30 bạn, 10 bạn nuôi thú: P(nuôi thú) $= \frac{10}{30} = \frac{1}{3}$.</p>

      <p><b>Xác suất có điều kiện</b> $P(A \mid B)$, đọc “xác suất A khi đã biết B”: <b>chỉ nhìn các trường hợp có B</b>,
      rồi đếm trong đó bao nhiêu có A. Trong 10 bạn nuôi thú có 6 bạn nuôi mèo → P(nuôi mèo | nuôi thú) $= \frac{6}{10} =
      \frac{3}{5}$ — khác $\frac{6}{30}$ vì mẫu số chỉ còn 10 bạn nuôi thú.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    - 2
    say: Trước hết, ta cần hiểu xác suất là gì. Xác suất là một số từ 0 tới 1 cho biết một việc dễ xảy ra tới đâu, và khi
      đếm được, nó bằng số trường hợp có việc đó chia cho tổng số trường hợp. Ví dụ lớp có 30 bạn, 10 bạn nuôi thú, thì xác
      suất một bạn nuôi thú là 10 phần 30, tức 1 phần 3. Xác suất có điều kiện, xác suất A khi đã biết B, chỉ nhìn các trường
      hợp có B rồi đếm trong đó bao nhiêu có A. Trong 10 bạn nuôi thú có 6 bạn nuôi mèo, nên xác suất nuôi mèo khi biết có
      nuôi thú là 6 phần 10, tức 3 phần 5. Con số này khác 6 phần 30, vì mẫu số chỉ còn 10 bạn nuôi thú. Ước lượng xác suất
      thực nghiệm quy bài toán ngôn ngữ phức tạp về phép đếm tần suất xuất hiện lặp lại trên hàng tỉ câu mẫu.
  - show: '<p><b>Nhân phân số:</b> tử nhân tử, mẫu nhân mẫu.</p>

      $$\frac{2}{3} \cdot \frac{2}{3} = \frac{2 \cdot 2}{3 \cdot 3} = \frac{4}{9}$$

      '
    introduces:
    - cdot
    focus:
    - 2
    - 2
    say: Ta cũng cần nhân phân số, tử nhân tử, mẫu nhân mẫu, nên 2 phần 3 nhân 2 phần 3 bằng 4 phần 9. Phép nhân các xác suất
      thành phần dưới một giải thích vì sao chuỗi văn bản càng dài thì xác suất đồng thời cả câu càng giảm nhanh.
- id: sym
  kind: symbol
  title: 'Giải mã: từ tố, quy tắc chuỗi, giả định bigram'
  steps:
  - show: '<p><b>Từ tố</b>: đơn vị văn bản mô hình xử lý (một từ, một phần từ, hay một dấu). Chuỗi viết $w_1, w_2, \dots,
      w_n$.</p>

      <p><b>Quy tắc chuỗi</b> (đúng với mọi phân phối): $P(w_1, \dots, w_n) = P(w_1) \cdot P(w_2 \mid w_1) \cdot P(w_3 \mid
      w_1, w_2) \cdots P(w_n \mid w_1, \dots, w_{n-1})$.</p>

      <p><b>Giả định bigram</b> (cặp 2 từ tố kế tiếp, gần đúng): từ tố tiếp theo chỉ phụ thuộc từ tố ngay trước: $P(w_t \mid
      w_1, \dots, w_{t-1}) \approx P(w_t \mid w_{t-1})$. Ước lượng bằng đếm: $P(b \mid a) = \frac{\text{số lần } a\, b}{\text{số
      lần } a}$ (có thể biểu diễn chính xác bằng phân số <code>Fraction(tử, mẫu)</code> thay cho số thực làm tròn).</p>

      '
    introduces:
    - dots
    - approx
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    - 3
    say: Từ tố là đơn vị văn bản mà mô hình xử lý, có thể là một từ, một phần của từ, hay một dấu. Một chuỗi viết w 1, w 2,
      cho tới w n. Quy tắc chuỗi đúng với mọi phân phối, xác suất cả chuỗi bằng xác suất từ đầu, nhân xác suất từ thứ hai
      khi biết từ đầu, và cứ thế, mỗi từ khi biết mọi từ trước nó. Giả định cặp từ là một xấp xỉ, từ tố tiếp theo chỉ phụ
      thuộc từ tố ngay trước. Khi đó ước lượng bằng đếm, xác suất b sau a bằng số lần a b đi liền nhau chia số lần a xuất
      hiện làm ngữ cảnh. Việc gán ranh giới bắt đầu và kết thúc biến dấu chấm hết câu thành một sự kiện có xác suất học được
      y hệt các từ bình thường.
