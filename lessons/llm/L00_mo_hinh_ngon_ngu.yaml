      <tr><td><b>cộng</b></td><td><b>9/9 = 1</b> ✓</td></tr></table>

      <p class="note"><b>So sánh hai quy mô:</b> Kho 3 câu đồ chơi đếm bảng bigram xong ngay; ở kho hàng trăm tỉ từ với từ
      vựng 50 000+ mục, bảng xác suất chuỗi dài bùng nổ tổ hợp nên phải dùng mạng nơ-ron ước lượng trực tiếp phân phối từ
      kế tiếp.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.5'
    - '1.6'
    - 2
    - 2
    - 2
    - 2
    say: Kiểm bằng đường khác, vì một mô hình xác suất đúng nghĩa thì mọi câu nó sinh được phải có xác suất cộng lại bằng
      1. Theo cây ở trên, câu tôi thích mèo được 4 phần 9. Hai câu tôi thích chó và bạn thích mèo mỗi câu 2 phần 9. Câu bạn
      thích chó, dù chưa có trong kho, được 1 phần 9. Cộng lại được 9 phần 9, đúng bằng 1. Ở hai mức quy mô, kho 3 câu đồ
      chơi đếm xác suất xong ngay trong nháy mắt. Trên kho hàng trăm tỉ từ thật, bảng tổ hợp quá khổng lồ nên bắt buộc dùng
      mạng nơ ron ước lượng phân phối từ kế tiếp. Cộng trọn bộ bốn nhánh cây ra đúng một chứng tỏ mô hình không hề làm rò
      rỉ khối lượng xác suất đi đâu cả. Đặc biệt mô hình có thể tự ghép ra tổ hợp mới chưa từng xuất hiện nguyên câu trong
      kho dữ liệu ban đầu.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp, có lỗi cả người đã đi làm
  checks:
  - alg.bigram_prob('<s> chó thích mèo </s>') == 0
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Coi xác suất cao là “đúng sự thật” <b class="red">(lẫn hai khái niệm)</b>

      <br><span class="note">Mô hình đo chuỗi có <b>giống</b> dữ liệu đã thấy không. Câu sai sự thật nhưng hay gặp vẫn được
      xác suất cao.</span></div>

      '
    say: Lỗi thứ nhất, coi xác suất cao là đúng sự thật, tức lẫn hai khái niệm. Mô hình đo chuỗi có giống dữ liệu đã thấy
      không. Câu sai sự thật nhưng hay gặp vẫn được xác suất cao. Thống kê đồng xuất hiện chỉ phản ánh tần suất gặp trên văn
      bản thu thập chứ không kiểm chứng tính đúng sai ngoài thực tế khách quan. Mô hình ngôn ngữ dự đoán xác suất xuất hiện
      tiếp theo của từ ngữ chứ không tự động kiểm tra chân lý khách quan.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Tin đếm thô cho cặp chưa gặp <b class="red">(xác suất 0)</b>

      <br><span class="note">“chó thích mèo” hoàn toàn hợp lý, nhưng kho chưa có cặp (&lt;s&gt;, chó) → xác suất cả câu bằng
      <b>0</b>. Cách sửa: <b>làm trơn</b> — chia bớt xác suất cho các cặp chưa gặp.</span></div>

      '
    say: Lỗi thứ hai, tin đếm thô cho cặp chưa gặp, nên ra xác suất 0. Câu chó thích mèo hoàn toàn hợp lý, nhưng kho chưa
      có câu nào bắt đầu bằng chó, nên xác suất cả câu bằng 0. Cách sửa là làm trơn, tức chia bớt xác suất cho những cặp chưa
      gặp. Gán xác suất bằng không cho cặp từ chưa từng thấy sẽ đánh sập cả một câu hoàn toàn đúng ngữ pháp chỉ vì một liên
      kết thiếu. Làm trơn xác suất tránh biến toàn bộ tích xác suất của câu dài thành số không chỉ vì một cụm ít gặp.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> So xác suất của câu dài với câu ngắn <b class="red">(không công bằng)</b>

      <br><span class="note">Mỗi bước nhân thêm một số ≤ 1, nên câu dài thường có xác suất nhỏ hơn. Muốn so mô hình, chuẩn
      hoá theo số bước dự đoán.</span></div>

      <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Đo mô hình trên chính kho đã dùng để đếm <b class="red">(điểm
      đẹp giả)</b>

      <br><span class="note">Câu trong kho thường được xác suất cao hơn thực tế vì chính nó tạo ra con số đếm. Phải giữ riêng
      một phần văn bản chưa đếm để đo.</span></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Lỗi thứ ba, so xác suất của câu dài với câu ngắn, như vậy không công bằng. Mỗi bước nhân thêm một số không quá 1,
      nên câu dài thường có xác suất nhỏ hơn. Muốn so mô hình thì phải chuẩn hoá theo số bước dự đoán. Lỗi thứ tư, người đã
      đi làm cũng hay mắc, là đo mô hình trên chính kho đã dùng để đếm, nên điểm đẹp giả. Câu trong kho thường được xác suất
      cao hơn thực tế, vì chính nó tạo ra con số đếm. Phải giữ riêng một phần văn bản chưa đếm để đo. So sánh trực tiếp xác
      suất thô thiên vị câu ngắn rõ rệt, ép người đánh giá phải chia chuẩn hoá theo chiều dài chuỗi từ tố.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '[alg.bigram_prob(s) for s in (''<s> bạn thích mèo </s>'', ''<s> tôi thích chó </s>'')] == [__import__(''fractions'').Fraction(2,
    9)] * 2'
  steps:
  - show: '<p>Cùng kho ba câu.</p>

      <table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Tính $P(\text{bạn thích mèo})$.</td></tr>

      <tr><td>2</td><td>Tính $P(\text{tôi thích chó})$. Hai câu này có xác suất bằng nhau không?</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm, vẫn với kho ba câu. Câu một, tính xác suất của câu bạn thích mèo. Câu hai, tính xác
      suất của câu tôi thích chó. Hai câu này có xác suất bằng nhau không? Dừng video và làm ra giấy. Tính tay bốn bước nhân
      theo bảng thống kê trước khi đối chiếu kết quả cuối của cả hai câu mẫu.
    pause: 15
  - show: '<table class="t"><tr><th>câu</th><th>bốn bước</th><th>xác suất</th></tr>

      <tr><td>① bạn thích mèo</td><td>$\frac{1}{3} \cdot 1 \cdot \frac{2}{3} \cdot 1$</td><td>$\hl{\frac{2}{9}}$</td></tr>

      <tr><td>② tôi thích chó</td><td>$\frac{2}{3} \cdot 1 \cdot \frac{1}{3} \cdot 1$</td><td>$\hl{\frac{2}{9}}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Đáp án, nhân bốn bước của mỗi câu. Câu một, bạn chỉ đứng đầu 1 trong 3 câu, nên 1 phần 3 nhân 1 nhân 2 phần 3 nhân
      1, bằng 2 phần 9. Câu hai, chó chỉ đứng sau thích 1 trong 3 lần, nên 2 phần 3 nhân 1 nhân 1 phần 3 nhân 1, cũng bằng
      2 phần 9. Sự giống nhau về tích cuối hai phần chín chứng tỏ nhiều cấu trúc nhánh xác suất khác nhau có thể dẫn về cùng
      xác suất câu.
  - show: '<p>Bằng nhau, nhưng vì <b>hai lý do khác nhau</b>: câu ① hiếm ở đầu câu, câu ② hiếm ở cuối câu.</p>

      '
    say: Hai câu có xác suất bằng nhau, nhưng vì hai lý do khác nhau, câu một hiếm ở đầu câu, còn câu hai hiếm ở cuối câu.
      Hiểu điểm khác biệt vị trí thắt cổ chai ở đầu hay cuối câu giúp giải thích vì sao mô hình lưỡng lự ngay chữ đầu tiên.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/LLM/L00
  steps:
  - show: <table class='t'><tr><th>Thực hành LLM:L00</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Ước
      lượng xác suất bigram bằng đếm và tính xác suất chuỗi qua quy tắc chuỗi</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>s1=&lt;s&gt; em hoc toan &lt;/s&gt;;
      s2=&lt;s&gt; em hoc ly &lt;/s&gt;; s3=&lt;s&gt; anh hoc toan &lt;/s&gt;; target=&lt;s&gt; em hoc toan &lt;/s&gt;</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh LLM L00 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 0 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Thực hành xây dựng bảng đếm từ và cặp từ từ câu mẫu để
      tính xác suất chuỗi qua phân số chuẩn xác.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
  - show: <table class='t'><tr><th>Gợi ý triển khai LLM:L00</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (đếm tần suất ngữ cảnh)</b></td><td>Đếm unigram các từ đứng trước và bigram từng cặp từ kề nhau</td></tr><tr><td><b>Bước
      2 (nhân xác suất Fraction)</b></td><td>Khởi tạo phân số đơn vị rồi nhân dần tần suất cặp chia ngữ cảnh</td></tr><tr><td><b>Bước
      3 (định dạng phân số và thực)</b></td><td>Xuất dạng rút gọn tối giản kèm giá trị số thực bốn chữ số</td></tr></table>
    say: Gợi ý cài đặt bài số 0 chia thành ba bước rõ ràng. Đầu tiên đọc từng câu từ luồng chuẩn, sau đó đếm tần suất đơn
      và cặp kề nhau để nhân bằng phân số, cuối cùng in đủ 1 dòng khớp định dạng.
    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (1 dòng)</b></p><div class="code"><div>prob=4/9 float=0.4444</div></div>
    say: Màn hình hiện 1 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">chuỗi từ tố</span><span class="a">→</span>

      <span class="n">quy tắc chuỗi: tích các xác suất có điều kiện</span><span class="a">→</span>

      <span class="n">bigram: chỉ nhìn từ ngay trước</span><span class="a">→</span>

      <span class="n">ước lượng bằng đếm</span></div>

      '
    say: Tổng kết lại, một chuỗi từ tố có xác suất bằng tích các xác suất có điều kiện theo quy tắc chuỗi. Giả định cặp từ
      chỉ nhìn từ ngay trước, và ta ước lượng xác suất bằng đếm. Quy tắc chuỗi phân rã xác suất của cả một câu dài thành tích
      từng xác suất có điều kiện nối tiếp nhau qua mọi vị trí. Với đoạn dài hàng trăm từ, phép nhân các số nhỏ hơn một cần
      chuyển sang tổng lôgarit để tránh tràn số dưới mức.
  - show: ''
    say: Góc nhìn xác suất đó giúp ta không nhầm lẫn giữa câu văn trôi chảy với sự kiện đúng ngoài đời. Quy tắc chuỗi cùng
      giả định cặp từ đặt viên gạch nền tảng toán học cho toàn bộ thế hệ mô hình ngôn ngữ xác suất. Hiểu nền xác suất điều
      kiện giải thích cách máy chọn từ nối tiếp mạch lạc dọc theo toàn bộ ngữ cảnh.
  - show: '<div class="box key"><b>Tư duy:</b> mô hình ngôn ngữ không “biết” câu đúng hay sai — nó biết câu đó <b>giống</b>
      dữ liệu đến mức nào.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ kho 3 câu đồ chơi đếm bigram bằng tay (~1 ms) tới kho ngữ liệu hàng trăm
      tỉ từ: phải nén bảng xác suất bằng mạng nơ-ron dày đặc để không tràn bộ nhớ theo tổ hợp chuỗi từ.</p>

      '
    say: Điều cần mang theo, mô hình ngôn ngữ không biết câu đúng hay sai, nó biết câu đó giống dữ liệu đến mức nào. Từ kho
      3 câu đồ chơi đếm tay tới kho hàng trăm tỉ từ. Không thể lưu hết bảng xác suất mà phải nén bằng mạng nơ ron dày đặc.
      Bước nhảy từ ba câu minh hoạ lên hàng trăm tỉ từ tố huấn luyện chỉ khác ở kích thước cửa sổ ngữ cảnh và hàm ước lượng.
    focus:
    - 1
    - 2
    - 2
    - 2
  - clear: true
    show: '<p class="note">Bài sau (bài 1): <b>mô hình n-gram</b>, làm trơn và độ hỗn loạn.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 1, ta học mô hình n-gram, cách làm trơn, và độ hỗn loạn. Hẹn gặp bạn ở bài tiếp theo.
