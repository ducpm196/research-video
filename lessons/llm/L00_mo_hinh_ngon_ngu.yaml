    say: Hình là cây các khả năng khi mô hình đoán từng bước. Từ đầu câu, đi tới tôi với xác suất 2 phần 3, tới bạn với xác
      suất 1 phần 3, rồi sau tôi luôn là thích. Sau thích là mèo với 2 phần 3, chó với 1 phần 3, và xác suất cả câu là tích
      các số trên con đường đã đi. Cấu trúc cây xác suất trình bày trọn vẹn mọi ngã rẽ có thể sinh ra cùng trọng số nhánh
      gắn trên từng cạnh chuyển bước.
- id: example
  kind: example
  title: Ba câu, một xác suất
  checks:
  - '(lambda u, b: (u[''<s>''], b[(''<s>'', ''tôi'')], u[''thích''], b[(''thích'', ''mèo'')]))(*alg.bigram_counts()) == (3,
    2, 3, 2)'
  - alg.bigram_prob('<s> tôi thích mèo </s>') == __import__('fractions').Fraction(4, 9)
  steps:
  - show: '<p>Kho: “&lt;s&gt; tôi thích mèo &lt;/s&gt;”, “&lt;s&gt; tôi thích chó &lt;/s&gt;”, “&lt;s&gt; bạn thích mèo &lt;/s&gt;”
      (dấu bắt đầu câu cho từ đầu một từ đứng trước; dấu kết thúc câu).</p>

      <table class="t"><tr><th>bước dự đoán</th><th>đếm</th><th>xác suất</th></tr>

      <tr><td>tôi sau &lt;s&gt;</td><td>2 trong 3 câu</td><td>$\frac{2}{3}$</td></tr>

      <tr><td>thích sau tôi</td><td>2 trong 2</td><td>1</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    say: Kho gồm ba câu, mỗi câu có thêm dấu bắt đầu, để từ đầu câu cũng có từ đứng trước, và dấu kết thúc. Từ tôi đứng sau
      dấu bắt đầu ở 2 trong 3 câu, nên xác suất 2 phần 3. Từ thích đứng sau tôi ở cả 2 lần, xác suất 1. Đặt thẻ mở đầu vào
      đầu mỗi câu giúp đại từ đứng đầu cũng trở thành một kết quả dự đoán có điều kiện tường minh rõ ràng.
  - show: '<table class="t"><tr><th>bước dự đoán</th><th>đếm</th><th>xác suất</th></tr>

      <tr><td>mèo sau thích</td><td>2 trong 3</td><td>$\frac{2}{3}$</td></tr>

      <tr><td>&lt;/s&gt; sau mèo</td><td>2 trong 2</td><td>1</td></tr></table>

      '
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    say: Từ mèo đứng sau thích ở 2 trong 3 lần, xác suất 2 phần 3. Dấu kết thúc đứng sau mèo ở cả 2 lần, xác suất 1. Thống
      kê tỉ lệ hai trên ba xác nhận dữ kiện từ thích thường kéo theo danh từ mèo nhiều gấp đôi danh từ chó trong kho ba câu.
  - show: '<p>Theo quy tắc chuỗi, nhân bốn bước:</p>

      $$P(\text{tôi thích mèo}) = \frac{2}{3} \cdot 1 \cdot \frac{2}{3} \cdot 1 = \hl{\frac{4}{9}}$$

      '
    focus:
    - 1
    - 2
    - 2
    say: 'Theo quy tắc chuỗi, ta nhân bốn bước lại. Xác suất của câu tôi thích mèo bằng 2 phần 3 nhân 1 nhân 2 phần 3 nhân
      1, bằng 4 phần 9. Tích bốn nhân tố nối tiếp nhau thể hiện nguyên tắc chuỗi nhân xác suất: sai sót hay sự kiện hiếm ở
      một mắt xích kéo tụt toàn câu.'
  - clear: true
    show: '<p><b>Minh hoạ Python đếm bigram tính xác suất chuỗi chính xác bằng Fraction</b></p><div class="code"><div>from
      fractions import Fraction</div><div>sents = ["&lt;s&gt; toi di hoc &lt;/s&gt;", "&lt;s&gt; toi di choi &lt;/s&gt;", "&lt;s&gt; ban di hoc &lt;/s&gt;"]</div><div>bg = {}; ug = {}</div><div>for s in sents:</div><div>&nbsp;&nbsp;&nbsp;&nbsp;w = s.split()</div><div>&nbsp;&nbsp;&nbsp;&nbsp;for i in range(len(w) - 1):</div><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ug[w[i]] = ug.get(w[i], 0) + 1; bg[(w[i], w[i+1])] = bg.get((w[i], w[i+1]), 0) + 1</div><div>p = Fraction(1)</div><div>t = "&lt;s&gt; toi di hoc &lt;/s&gt;".split()</div><div>for i in range(len(t) - 1): p *= Fraction(bg[(t[i], t[i+1])], ug[t[i]])</div><div style="color:#059669"># Kết quả: prob=4/9 float=0.4444</div></div>'
    focus:
    - 1
    - 2
    say: Đoạn mã minh hoạ duyệt từng cặp từ kề nhau để đếm rồi nhân các phân số xác suất có điều kiện chính xác. Kết quả nhân bốn bước liên tiếp trả về đúng bốn phần chín không sai số làm tròn.
- id: check
  kind: check
