scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Dán cả cuốn sách vào lời nhắc"
    checks:
      - "(32 / 4) ** 2 == 64 and 32 / 4 == 8"
    steps:
      - show: |
          <p>Mô hình nhận được 32 nghìn từ tố, vậy cứ dán cả cuốn sổ tay vào là xong? Tăng ngữ cảnh từ 4 nghìn lên 32 nghìn làm phép tính phần chú ý tăng <b>64 lần</b>, bộ nhớ đệm tăng 8 lần — và mô hình vẫn có thể bỏ sót đúng đoạn nằm ở giữa.</p>
          <div class="box key">Hôm nay: <b>chi phí của ngữ cảnh dài</b>, và ba cách làm suy luận rẻ hơn: <b>lượng tử hoá</b>, <b>gộp lô</b>, <b>giải mã suy đoán</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, mô hình nhận được 32 nghìn từ tố, vậy cứ dán cả cuốn sổ tay vào là xong? Tăng ngữ cảnh từ 4 nghìn lên 32 nghìn làm phép tính phần chú ý tăng 64 lần, bộ nhớ đệm tăng 8 lần, và mô hình vẫn có thể bỏ sót đúng đoạn nằm ở giữa. Hôm nay ta học chi phí của ngữ cảnh dài, và ba cách làm suy luận rẻ hơn, lượng tử hoá, gộp lô, và giải mã suy đoán."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: bình phương khi gấp đôi, và tổng dạng 1 + α + α²"
    checks:
      - "(2 * 3) ** 2 == 4 * 3 ** 2 and 1 + 0.5 + 0.25 == (1 - 0.5 ** 3) / (1 - 0.5) == 1.75"
    steps:
      - show: |
          <p><b>Bình phương</b>: gấp đôi $n$ thì $n^2$ gấp bốn — $6^2 = 36 = 4 \cdot 3^2$.</p>
        say: "Từ khoá toán, ta nhớ, gấp đôi n thì n bình phương gấp bốn, ví dụ 6 bình phương bằng 36, đúng bằng 4 lần 3 bình phương."
      - show: |
          <p><b>Tổng cấp số nhân</b> (khoá toán): $1 + \alpha + \alpha^2 + \dots + \alpha^k = \frac{1 - \alpha^{k+1}}{1 - \alpha}$.</p>
          <p>Làm thử $\alpha = 0{,}5$, $k = 2$: $1 + 0{,}5 + 0{,}25 = 1{,}75$ và $\frac{1 - 0{,}125}{0{,}5} = 1{,}75$ ✓</p>
        introduces: [alpha, dots]
        focus: [1, 2]
        say: "Ở khoá toán, ta đã học tổng 1 cộng alpha cộng alpha bình phương, tới alpha mũ k, bằng 1 trừ alpha mũ k cộng 1, chia 1 trừ alpha. Làm thử với alpha bằng 0 phẩy 5 và k bằng 2, cộng thẳng được 1 phẩy 75, công thức cũng ra 1 phẩy 75."

  - id: sym
    kind: symbol
    title: "Giải mã: bậc hai, lượng tử hoá, gộp lô, giải mã suy đoán"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>chi phí bậc hai</b></td><td>mỗi vị trí chú ý tới mọi vị trí trước: cỡ $n^2$ cặp; gấp đôi ngữ cảnh → gấp bốn phép tính chú ý</td></tr>
          <tr><td><b>lượng tử hoá</b></td><td>lưu trọng số ít bit hơn (1 byte, nửa byte thay vì 2 byte) → ít bộ nhớ, ít băng thông</td></tr>
          <tr><td><b>gộp lô</b></td><td>phục vụ nhiều chuỗi cùng một lần đọc trọng số (bài 5)</td></tr>
          <tr><td><b>giải mã suy đoán</b></td><td>mô hình nhỏ đề xuất $k$ từ tố, mô hình lớn kiểm cả $k$ trong một lần; giữ phần đầu được chấp nhận</td></tr></table>
          <p>Giải mã suy đoán: nếu mỗi từ được chấp nhận với xác suất $\alpha$, số từ tố kỳ vọng mỗi lần kiểm $= \frac{1 - \alpha^{k+1}}{1 - \alpha}$.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng giới thiệu bốn khái niệm. Chi phí bậc hai, vì mỗi vị trí chú ý tới mọi vị trí trước, nên có cỡ n bình phương cặp, gấp đôi ngữ cảnh thì gấp bốn phép tính chú ý. Lượng tử hoá lưu trọng số bằng ít bit hơn, 1 byte hay nửa byte thay vì 2 byte, nên tốn ít bộ nhớ và băng thông. Gộp lô phục vụ nhiều chuỗi trong cùng một lần đọc trọng số. Giải mã suy đoán cho một mô hình nhỏ đề xuất k từ tố, mô hình lớn kiểm cả k từ trong một lần, và giữ phần đầu được chấp nhận. Nếu mỗi từ được chấp nhận với xác suất alpha, số từ tố kỳ vọng mỗi lần kiểm bằng 1 trừ alpha mũ k cộng 1, chia 1 trừ alpha."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Giải mã suy đoán: người phụ viết nháp, chuyên gia duyệt một lượt"
    steps:
      - show: |
          <div><svg width="1500" height="320" viewBox="0 0 1500 320"><g font-size="25" text-anchor="middle" fill="#1f2937"><text x="140" y="95" font-size="23">mô hình nhỏ</text><text x="140" y="125" font-size="20">đề xuất 4 từ</text><text x="140" y="245" font-size="23">mô hình lớn</text><text x="140" y="275" font-size="20">kiểm 1 lần</text><rect x="300" y="50" width="140" height="70" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="370" y="95">từ 1</text><rect x="300" y="200" width="140" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="370" y="245" fill="#059669">✓</text><rect x="470" y="50" width="140" height="70" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="540" y="95">từ 2</text><rect x="470" y="200" width="140" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="540" y="245" fill="#059669">✓</text><rect x="640" y="50" width="140" height="70" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="710" y="95">từ 3</text><rect x="640" y="200" width="140" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="710" y="245" fill="#059669">✓</text><rect x="810" y="50" width="140" height="70" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="880" y="95">từ 4</text><rect x="810" y="200" width="140" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="880" y="245" fill="#b91c1c">sai</text><rect x="980" y="200" width="140" height="70" rx="8" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="1050" y="245">từ thay</text><text x="1300" y="225" font-size="22">giữ 3 từ đúng</text><text x="1300" y="258" font-size="22">+ 1 từ của mô hình lớn</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ một lượt giải mã suy đoán. Mô hình nhỏ viết nháp 4 từ, mô hình lớn duyệt cả 4 trong một lần chạy. Ba từ đầu được chấp nhận, từ thứ tư bị bỏ và mô hình lớn tự viết từ thay, nên một lần chạy được 4 từ thay vì 1."

  - id: example
    kind: example
    title: "Ba con số tiết kiệm"
    checks:
      - "[round(12 * 32 * 4096 ** 2 * b / 1e9, 1) for b in (2, 1, 0.5)] == [12.9, 6.4, 3.2]"
      - "round(alg.spec_decode_tokens(0.8, 4), 2) == 3.36 and (32 / 4) ** 2 == 64"
    steps:
      - show: |
          <table class="t"><tr><th>lượng tử hoá 6,44 tỉ tham số</th><th>phép tính</th><th>bộ nhớ</th></tr>
          <tr><td>2 byte</td><td>$6{,}44 \cdot 10^9 \cdot 2$</td><td>12,9 GB</td></tr>
          <tr><td>1 byte</td><td>$6{,}44 \cdot 10^9 \cdot 1$</td><td>6,4 GB</td></tr>
          <tr><td>nửa byte</td><td>$6{,}44 \cdot 10^9 \cdot 0{,}5$</td><td>3,2 GB</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước một, lượng tử hoá trọng số của mô hình 6 phẩy 44 tỉ tham số. Với 2 byte mỗi số, bộ nhớ là 12 phẩy 9 GB. Với 1 byte còn 6 phẩy 4 GB. Với nửa byte chỉ còn 3 phẩy 2 GB."
      - show: |
          <p><b>Bước 2 — giải mã suy đoán</b>, $k = 4$, $\alpha = 0{,}8$:</p>
          $$\frac{1 - 0{,}8^5}{1 - 0{,}8} = \frac{1 - 0{,}328}{0{,}2} \approx \hl{3{,}36}$$
          <p>từ tố mỗi lần mô hình lớn chạy, thay vì 1.</p>
        focus: [1, 2, 3]
        say: "Bước hai, giải mã suy đoán với k bằng 4 và alpha bằng 0 phẩy 8. Theo công thức, 1 trừ 0 phẩy 8 mũ 5, chia 0 phẩy 2, xấp xỉ 3 phẩy 36. Đó là số từ tố mỗi lần mô hình lớn chạy, thay vì 1."
      - clear: true
        show: |
          <p><b>Bước 3 — ngữ cảnh</b> 4 nghìn → 32 nghìn từ tố: gấp $\frac{32}{4} = 8$ lần độ dài; chú ý cỡ $n^2$ nên tăng $8^2 = \hl{64}$ lần.</p>
        say: "Bước ba, tăng ngữ cảnh từ 4 nghìn lên 32 nghìn từ tố là gấp 8 lần độ dài. Vì chú ý có cỡ n bình phương, phần chú ý tăng 8 bình phương, bằng 64 lần."
      - show: |
          <p><b>Bước 4</b> — giải mã suy đoán <b>không đổi kết quả</b> về phân phối: mô hình lớn vẫn quyết định; chỉ bớt số lần đọc trọng số của nó.</p>
        say: "Bước bốn, giải mã suy đoán không đổi kết quả về phân phối, vì mô hình lớn vẫn quyết định từng từ, nó chỉ bớt số lần đọc trọng số."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(1 + 0.8 + 0.8 ** 2 + 0.8 ** 3 + 0.8 ** 4, 4) == 3.3616 and round(alg.spec_decode_tokens(0.8, 4), 2) == 3.36"
      - "32000 ** 2 // 4000 ** 2 == 64"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>3,36</td><td>cộng thẳng $1 + 0{,}8 + 0{,}64 + 0{,}512 + 0{,}4096$</td><td>3,3616 ✓</td></tr>
          <tr><td>64 lần</td><td>đếm cặp: $32\,000^2 : 4000^2$</td><td>64 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, vì công thức chỉ là cách viết gọn của một tổng. Cộng thẳng 1, 0 phẩy 8, 0 phẩy 64, 0 phẩy 512 và 0 phẩy 4096 được 3 phẩy 3616, khớp công thức. Đếm thẳng số cặp, 32 nghìn bình phương chia 4 nghìn bình phương cũng bằng 64."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ ngữ cảnh dài là dùng tốt mọi phần <b class="red">(lạc ở giữa)</b>
          <br><span class="note">Nghiên cứu năm 2023: thông tin ở đầu và cuối ngữ cảnh được dùng tốt hơn ở giữa. Truy xuất đúng vài đoạn thường tốt hơn dán cả trăm trang.</span></div>
        say: "Lỗi thứ nhất, nghĩ ngữ cảnh dài là dùng tốt mọi phần, trong khi mô hình hay lạc ở giữa. Một nghiên cứu năm 2023 cho thấy thông tin ở đầu và cuối ngữ cảnh được dùng tốt hơn ở giữa. Truy xuất đúng vài đoạn thường tốt hơn dán cả trăm trang."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lượng tử hoá mà không đo lại <b class="red">(giảm chất lượng âm thầm)</b>
          <br><span class="note">Nửa byte mỗi tham số thường làm mô hình kém đi ở một số việc (toán, mã). Chạy lại bộ đánh giá (bài 10) trước khi đưa bản lượng tử hoá vào dùng.</span></div>
        say: "Lỗi thứ hai, lượng tử hoá mà không đo lại, nên chất lượng giảm âm thầm. Nửa byte mỗi tham số thường làm mô hình kém đi ở một số việc như toán hay viết mã. Hãy chạy lại bộ đánh giá trước khi đưa bản lượng tử hoá vào dùng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn mô hình nhỏ đề xuất quá khác mô hình lớn <b class="red">(chấp nhận thấp)</b>
          <br><span class="note">Khi $\alpha$ thấp, phần lớn đề xuất bị bỏ: $\alpha = 0{,}6$, $k = 4$ chỉ được ≈ 2,3 từ tố mỗi lần kiểm, mà vẫn tốn công chạy mô hình nhỏ. Đo $\alpha$ trên đúng loại văn bản của ứng dụng.</span></div>
        say: "Lỗi thứ ba, chọn mô hình nhỏ đề xuất quá khác mô hình lớn, nên tỉ lệ chấp nhận thấp. Khi alpha thấp, phần lớn đề xuất bị bỏ, với alpha bằng 0 phẩy 6 và k bằng 4 chỉ được khoảng 2 phẩy 3 từ tố mỗi lần kiểm, mà vẫn tốn công chạy mô hình nhỏ. Hãy đo alpha trên đúng loại văn bản của ứng dụng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(128 / 8) ** 2 == 256 and 128 / 8 == 16 and round(alg.spec_decode_tokens(0.6, 4), 1) == 2.3"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tăng ngữ cảnh từ 8 nghìn lên 128 nghìn từ tố: phần chú ý tăng bao nhiêu lần? Bộ nhớ đệm khoá–giá trị tăng bao nhiêu lần?</td></tr>
          <tr><td>2</td><td>Giải mã suy đoán với $\alpha = 0{,}6$, $k = 4$: mỗi lần kiểm được khoảng bao nhiêu từ tố?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tăng ngữ cảnh từ 8 nghìn lên 128 nghìn từ tố, phần chú ý tăng bao nhiêu lần? Bộ nhớ đệm khoá giá trị tăng bao nhiêu lần? Câu hai, giải mã suy đoán với alpha bằng 0 phẩy 6 và k bằng 4, mỗi lần kiểm được khoảng bao nhiêu từ tố? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Độ dài gấp $\frac{128}{8} = 16$ lần → phần chú ý $16^2 = \hl{256}$ lần; bộ nhớ đệm chỉ lưu một khoá, một giá trị mỗi vị trí nên tăng $16$ lần.</p>
        say: "Đáp án câu một, độ dài gấp 128 chia 8, bằng 16 lần, nên phần chú ý tăng 16 bình phương, bằng 256 lần. Bộ nhớ đệm chỉ lưu một khoá và một giá trị mỗi vị trí, nên chỉ tăng 16 lần."
      - show: |
          $$\frac{1 - 0{,}6^5}{1 - 0{,}6} = \frac{1 - 0{,}078}{0{,}4} \approx \hl{2{,}3}$$
          <p>② ≈ 2,3 từ tố mỗi lần kiểm — đề xuất kém hơn thì lợi ít hơn.</p>
        focus: [1, 2]
        say: "Câu hai, theo công thức, 1 trừ 0 phẩy 6 mũ 5, chia 0 phẩy 4, xấp xỉ 2 phẩy 3 từ tố mỗi lần kiểm. Mô hình nhỏ đề xuất kém hơn thì lợi ít hơn."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chú ý: cỡ n bình phương</span><span class="a">→</span>
          <span class="n">ngữ cảnh dài vẫn lạc ở giữa</span><span class="a">→</span>
          <span class="n">lượng tử hoá, gộp lô, giải mã suy đoán</span><span class="a">→</span>
          <span class="n">đo lại chất lượng sau mỗi tối ưu</span></div>
        say: "Tổng kết lại, phần chú ý có chi phí cỡ n bình phương, và ngữ cảnh dài vẫn lạc ở giữa. Lượng tử hoá, gộp lô và giải mã suy đoán làm suy luận rẻ hơn, nhưng phải đo lại chất lượng sau mỗi tối ưu."
      - show: |
          <div class="box key"><b>Tư duy:</b> đưa <b>đúng</b> thông tin vào ngữ cảnh rẻ hơn và tốt hơn đưa <b>nhiều</b> thông tin.</div>
        say: "Điều cần mang theo, đưa đúng thông tin vào ngữ cảnh vừa rẻ hơn, vừa tốt hơn đưa nhiều thông tin."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 14): <b>tình huống chuyên gia theo dòng thời gian</b> — từ kiến trúc chú ý năm 2017 tới huấn luyện tối ưu tính toán năm 2022: chia một ngân sách tính toán cho kích thước mô hình và lượng dữ liệu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 14, ta đi lại hành trình từ kiến trúc chú ý năm 2017 tới huấn luyện tối ưu tính toán năm 2022. Ta sẽ thấy các nhóm nghiên cứu chia một ngân sách tính toán cho kích thước mô hình và lượng dữ liệu ra sao. Hẹn gặp bạn ở bài tiếp theo."
