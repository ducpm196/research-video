  title: 'Giải mã suy đoán: người phụ viết nháp, chuyên gia duyệt một lượt'
  steps:
  - show: '<div><svg width="1500" height="320" viewBox="0 0 1500 320"><g font-size="25" text-anchor="middle" fill="#1f2937"><text
      x="140" y="95" font-size="23">mô hình nhỏ</text><text x="140" y="125" font-size="20">đề xuất 4 từ</text><text x="140"
