      (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 13 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Thực hành tính hệ số nhân bộ nhớ đệm tuyến tính và hệ
      số tăng bậc hai của phép tính chú ý khi mở rộng độ dài ngữ cảnh.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai LLM:L13</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (tỉ lệ độ dài ngữ cảnh)</b></td><td>Chia độ dài mới cho độ dài cũ ra bội số tăng tuyến tính</td></tr><tr><td><b>Bước
      2 (tăng bậc hai chú ý)</b></td><td>Bình phương bội số tăng vì mỗi token phải đối chiếu mọi token khác</td></tr><tr><td><b>Bước
      3 (gắn chữ x hậu tố)</b></td><td>In bội số KV và bội số chú ý trên cùng một dòng</td></tr></table>
    say: Gợi ý cài đặt bài số 13 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 1 dòng khớp định dạng.
    clear: true
