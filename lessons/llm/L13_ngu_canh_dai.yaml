- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">chú ý: cỡ n bình phương</span><span class="a">→</span>

      <span class="n">ngữ cảnh dài vẫn lạc ở giữa</span><span class="a">→</span>

      <span class="n">lượng tử hoá, gộp lô, giải mã suy đoán</span><span class="a">→</span>

      <span class="n">đo lại chất lượng sau mỗi tối ưu</span></div>

      '
    say: Tổng kết lại, phần chú ý có chi phí cỡ n bình phương, và ngữ cảnh dài vẫn lạc ở giữa. Lượng tử hoá, gộp lô và giải
      mã suy đoán làm suy luận rẻ hơn, nhưng phải đo lại chất lượng sau mỗi tối ưu. Khi kéo dài ngữ cảnh từ vài nghìn lên
      hàng chục nghìn từ tố, bộ nhớ đệm tăng tuyến tính nhưng khối lượng phép tính tự chú ý tăng vọt theo bình phương độ dài.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
  - show: '<div class="chain"><span class="n">chú ý: cỡ n bình phương</span><span class="a">→</span>

      <span class="n">ngữ cảnh dài vẫn lạc ở giữa</span><span class="a">→</span>

      <span class="n">lượng tử hoá, gộp lô, giải mã suy đoán</span><span class="a">→</span>

      <span class="n">đo lại chất lượng sau mỗi tối ưu</span></div>

      '
    say: Ngay cả khi phần cứng chứa vừa ngữ cảnh dài, hiện tượng hụt thông tin ở giữa chuỗi vẫn dễ xảy ra khiến mô hình hay
      bỏ sót chi tiết chôn giữa văn bản dài. Các kỹ thuật tăng tốc như lượng tử hoá trọng số xuống bốn hoặc tám bit, gom lô
      liên tục và giải mã suy đoán giúp cắt mạnh chi phí phục vụ mỗi yêu cầu. Luôn nhớ kiểm thử lại chất lượng đầu ra và tốc
      độ thực tế sau từng thay đổi nén hay tối ưu phần cứng. Cân đối độ dài ngữ cảnh cần thiết với các kỹ thuật nén trọng
      số và gom lô thông minh quyết định chi phí triển khai quy mô lớn. Đừng quên đặt sẵn các bài kiểm tra tìm chi tiết nằm
      giữa chuỗi dài mỗi khi áp dụng tối ưu tốc độ mới. Từ mô hình đếm cặp hai từ đơn giản tới trợ lý xử lý ngữ cảnh dài,
      mỗi bước tiến đều đòi hỏi bài toán cân bằng mới. Bạn phải cân đối đồng thời cả chất lượng trả lời, độ trễ phản hồi và
      ngân sách phần cứng thực tế.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
  - show: '<div class="box key"><b>Tư duy:</b> đưa <b>đúng</b> thông tin vào ngữ cảnh rẻ hơn và tốt hơn đưa <b>nhiều</b> thông
      tin.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ 4 000 từ tố tới 32 000 hay 128 000 từ tố (chi phí chú ý nhảy vọt 64× đến
      1024×): dùng giải mã suy đoán và lượng tử hoá hạ băng thông bộ nhớ nhưng thông tin giữa văn bản dài vẫn dễ bị sót.</p>

      '
    say: Điều cần mang theo, đưa đúng thông tin vào ngữ cảnh vừa rẻ hơn, vừa tốt hơn đưa nhiều thông tin. Kết nối bức tranh
      đầy đủ từ biểu diễn phân bố, cơ chế chú ý đến kỹ thuật lượng tử và suy đoán ghép nối toàn bộ kiến trúc hiện đại.
    focus:
    - 1
    - 1
  - clear: true
    show: '<p class="note">Bài sau (bài 14): <b>tình huống chuyên gia theo dòng thời gian</b> — từ kiến trúc chú ý năm 2017
      tới huấn luyện tối ưu tính toán năm 2022: chia một ngân sách tính toán cho kích thước mô hình và lượng dữ liệu.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 14, ta đi lại hành trình từ kiến trúc chú ý năm 2017 tới huấn luyện tối ưu tính toán năm 2022.
