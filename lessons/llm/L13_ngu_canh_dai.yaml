scenes:
- id: hook
  kind: hook
  title: Dán cả cuốn sách vào lời nhắc
  checks:
  - (32 / 4) ** 2 == 64 and 32 / 4 == 8
  steps:
  - show: '<p>Mô hình nhận được 32 nghìn từ tố, vậy cứ dán cả cuốn sổ tay vào là xong? Tăng ngữ cảnh từ 4 nghìn lên 32 nghìn
      làm phép tính phần chú ý tăng <b>64 lần</b>, bộ nhớ đệm tăng 8 lần — và mô hình vẫn có thể bỏ sót đúng đoạn nằm ở giữa.</p>

      <div class="box key">Hôm nay: <b>chi phí của ngữ cảnh dài</b>, và ba cách làm suy luận rẻ hơn: <b>lượng tử hoá</b>,
      <b>gộp lô</b>, <b>giải mã suy đoán</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, mô hình nhận được 32 nghìn từ tố, vậy cứ dán cả cuốn sổ tay vào là xong? Tăng ngữ cảnh từ 4 nghìn lên 32
      nghìn làm phép tính phần chú ý tăng 64 lần, bộ nhớ đệm tăng 8 lần, và mô hình vẫn có thể bỏ sót đúng đoạn nằm ở giữa.
      Hôm nay ta học chi phí của ngữ cảnh dài, và ba cách làm suy luận rẻ hơn, lượng tử hoá, gộp lô, và giải mã suy đoán.
      Mở rộng cửa sổ ngữ cảnh chạm hàng trăm nghìn từ tố đối diện ngay bức tường bình phương chi phí tính toán lẫn hiện tượng
      mất tập trung ở đoạn giữa.
- id: prereq
  kind: prereq
  title: 'Trước hết: bình phương khi gấp đôi, và tổng dạng 1 + α + α²'
  checks:
  - (2 * 3) ** 2 == 4 * 3 ** 2 and 1 + 0.5 + 0.25 == (1 - 0.5 ** 3) / (1 - 0.5) == 1.75
  - (2 * 3) * (2 * 3) == (2 * 2) * (3 * 3) == 36
  - '(lambda a, k: abs(sum(a ** i for i in range(k + 1)) - a * sum(a ** i for i in range(k + 1)) - (1 - a ** (k + 1))) < 1e-12)(0.5,
    2)'
  steps:
  - show: '<p><b>Bình phương</b>: gấp đôi $n$ thì $n^2$ gấp bốn, vì $(2n) \cdot (2n) = (2 \cdot 2) \cdot (n \cdot n)$ — ví
      dụ $6^2 = 36 = 4 \cdot 3^2$.</p>

      '
    say: Trước hết, ta cần hai điều về số. Điều thứ nhất, gấp đôi n thì n bình phương gấp bốn, vì 2 n nhân 2 n bằng 2 nhân
      2, nhân n nhân n. Ví dụ 6 bình phương bằng 36, đúng bằng 4 lần 3 bình phương. Quy luật tăng bình phương giải thích vì
      sao nhân đôi độ dài văn bản đầu vào lại nhân bốn chi phí tính ma trận chú ý.
  - show: '<p><b>Tổng cấp số nhân</b>: gọi $S = 1 + \alpha + \alpha^2 + \dots + \alpha^k$. Nhân cả hai vế với $\alpha$: $\alpha
      S = \alpha + \alpha^2 + \dots + \alpha^{k+1}$. Trừ hai dòng, mọi số hạng giữa triệt tiêu: $S - \alpha S = 1 - \alpha^{k+1}$,
      nên $S = \frac{1 - \alpha^{k+1}}{1 - \alpha}$.</p>

      <p>Làm thử $\alpha = 0{,}5$, $k = 2$: $1 + 0{,}5 + 0{,}25 = 1{,}75$ và $\frac{1 - 0{,}125}{0{,}5} = 1{,}75$ ✓</p>

      '
    introduces:
    - alpha
    - dots
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Điều thứ hai là tổng cấp số nhân, gọi S là tổng 1 cộng alpha cộng alpha bình phương, tới alpha mũ k. Nhân cả hai
      vế với alpha, ta được alpha cộng alpha bình phương, tới alpha mũ k cộng 1. Trừ hai dòng thì mọi số hạng ở giữa triệt
      tiêu, còn S trừ alpha S bằng 1 trừ alpha mũ k cộng 1, nên S bằng 1 trừ alpha mũ k cộng 1, chia 1 trừ alpha. Làm thử
      với alpha bằng 0 phẩy 5 và k bằng 2, cộng thẳng được 1 phẩy 75, công thức cũng ra 1 phẩy 75. Công thức cấp số nhân ước
      lượng chính xác số từ tố hợp lệ trung bình được chấp nhận trong một lượt kiểm chứng suy đoán.
- id: sym
  kind: symbol
  title: 'Giải mã: bậc hai, lượng tử hoá, gộp lô, giải mã suy đoán'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>chi phí bậc hai</b></td><td>mỗi vị trí chú ý (<i>attention</i>) tới mọi vị trí trước: cỡ $n^2$ cặp; gấp đôi
      ngữ cảnh → gấp bốn phép tính chú ý</td></tr>

      <tr><td><b>lượng tử hoá</b></td><td>lưu trọng số ít bit hơn (bit là một chữ số 0 hoặc 1; 1 byte = 8 bit): 1 byte, nửa
      byte thay vì 2 byte → ít bộ nhớ, ít băng thông</td></tr>

      <tr><td><b>gộp lô</b></td><td>phục vụ nhiều chuỗi cùng một lần đọc trọng số (bài 5)</td></tr>

      <tr><td><b>giải mã suy đoán</b></td><td>mô hình nhỏ đề xuất $k$ từ tố, mô hình lớn kiểm cả $k$ trong một lần; giữ phần
      đầu được chấp nhận</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bảng giới thiệu bốn khái niệm. Chi phí bậc hai, vì mỗi vị trí chú ý tới mọi vị trí trước, nên có cỡ n bình phương
      cặp, gấp đôi ngữ cảnh thì gấp bốn phép tính chú ý. Lượng tử hoá lưu trọng số bằng ít bit hơn, 1 byte hay nửa byte thay
      vì 2 byte, nên tốn ít bộ nhớ và băng thông. Gộp lô phục vụ nhiều chuỗi trong cùng một lần đọc trọng số. Giải mã suy
      đoán cho một mô hình nhỏ đề xuất k từ tố, mô hình lớn kiểm cả k từ trong một lần, và giữ phần đầu được chấp nhận. Chi
      phí bậc hai ở khâu chú ý đối lập hoàn toàn với tốc độ suy luận tuyến tính khi nạp mô hình có nén trọng số lượng tử hoá.
  - clear: true
    show: '<p>Giải mã suy đoán: nếu mỗi từ được chấp nhận với xác suất $\alpha$, độc lập (giả định của Leviathan và cộng sự,
      2023), số từ tố kỳ vọng mỗi lần kiểm $= \frac{1 - \alpha^{k+1}}{1 - \alpha}$.</p>

      <p class="note">Vì sao: “kỳ vọng” là trung bình qua rất nhiều lần chạy. Mỗi lần luôn được ít nhất 1 từ (từ của mô hình
      lớn); được thêm từ nháp 1 nếu nó được nhận (xác suất $\alpha$), thêm từ nháp 2 nếu cả từ 1 và 2 được nhận ($\alpha^2$),
      …, tới $\alpha^k$. Cộng lại: $1 + \alpha + \dots + \alpha^k$, chính là tổng cấp số nhân ở trên.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Nếu mỗi từ được chấp nhận với xác suất alpha, số từ tố kỳ vọng mỗi lần kiểm bằng 1 trừ alpha mũ k cộng 1, chia 1
      trừ alpha. Kỳ vọng là trung bình qua rất nhiều lần chạy, và mỗi lần luôn được ít nhất 1 từ của mô hình lớn. Ta được
      thêm từ nháp thứ nhất nếu nó được nhận, với xác suất alpha, và thêm từ nháp thứ hai nếu cả hai từ đầu được nhận, với
      xác suất alpha bình phương. Cứ thế tới alpha mũ k, và cộng lại chính là tổng cấp số nhân ở trên. Giải mã suy đoán tận
      dụng khối tính dư thừa của thẻ đồ hoạ để duyệt song song nhiều từ tố nháp trong cùng một lượt đọc trọng số.
