  - {sentence: "Hãy đo alpha trên đúng loại văn bản của ứng dụng.", reason: "ASR chép “Hãy đo an pha trên đúng loại văn bản của ứng dụng.” (0.87): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khi alpha thấp, phần lớn đề xuất bị bỏ, với alpha bằng 0 phẩy 6 và k bằng 4 chỉ được khoảng 2 phẩy 3 từ tố mỗi lần kiểm, mà vẫn tốn công chạy mô hình nhỏ.", reason: "ASR chép “Khi an pha thấp, phần lớn đề xuất bị bỏ, với an pha bằng 0,6 và ca bằng 4 chỉ được khoảng 2,3 từ tố mỗi lần kiểm mà vẫn tốn công chạy mua hình nhỏ.” (0.897): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”); lệch âm/thanh thuần Việt: mô/mua — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nửa byte mỗi tham số thường làm mô hình kém đi ở một số việc như toán hay viết mã.", reason: "ASR chép “Nửa bay mỗi tham số thường là mô hình kém đi ở một số việc như toán hay viết mã.” (0.9): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: làm/là — NOT_VERIFIED bằng tai người"}
