  - {sentence: "Bước hai, giải mã suy đoán với k bằng 4 và alpha bằng 0 phẩy 8.", reason: "ASR chép “Bước 2, giải mã suy đoán với ca bằng 4 và an pha bằng 0,8.” (0.909): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Làm thử với alpha bằng 0 phẩy 5 và k bằng 2, cộng thẳng được 1 phẩy 75, công thức cũng ra 1 phẩy 75.", reason: "ASR chép “Làm thử với an pha bằng 0,5 và ca bằng 2, cộng thẳng được 1,75, công thức cũng ra 1,75.” (0.949): alpha đọc thô (probe AIF p1: 7/8, bản chép “an pha / ANFA / α”) — NOT_VERIFIED bằng tai người"}
