# Quy ước: phép tính phần chú ý tăng theo bình phương độ dài ngữ cảnh n (n² cặp vị trí); bộ nhớ đệm khoá–giá trị tăng theo n (bài 5).
#   Bộ nhớ trọng số = 6,44 tỉ tham số × số byte mỗi tham số (2 / 1 / 0,5 byte). Giải mã suy đoán: mô hình nhỏ đề xuất k từ tố, mỗi từ được mô hình
#   lớn chấp nhận với xác suất alpha ĐỘC LẬP (giả định của bài báo 2023); số từ tố kỳ vọng mỗi lần kiểm = (1 − alpha^(k+1)) / (1 − alpha).
objectives:
  - "Giải thích chi phí bậc hai của chú ý"
  - "Ước lượng lợi ích của lượng tử hoá và giải mã suy đoán"
  - "Biết vì sao ngữ cảnh dài không có nghĩa là dùng tốt mọi phần"
