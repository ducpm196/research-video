      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ một lượt giải mã suy đoán. Mô hình nhỏ viết nháp 4 từ, mô hình lớn duyệt cả 4 trong một lần chạy. Ba từ đầu
      được chấp nhận, từ thứ tư bị bỏ và mô hình lớn tự viết từ thay, nên một lần chạy được 4 từ thay vì 1. Mô hình nhỏ tốc
      độ cao nháp sẵn chuỗi gợi ý để mô hình lớn xác thực hoặc sửa đúng điểm sai đầu tiên mà không đổi phân phối cuối.
- id: example
  kind: example
  title: Ba con số tiết kiệm
  checks:
  - '[round(12 * 32 * 4096 ** 2 * b / 1e9, 1) for b in (2, 1, 0.5)] == [12.9, 6.4, 3.2]'
  - round(alg.spec_decode_tokens(0.8, 4), 2) == 3.36 and (32 / 4) ** 2 == 64
  steps:
  - show: '<table class="t"><tr><th>lượng tử hoá 6,44 tỉ tham số</th><th>phép tính</th><th>bộ nhớ</th></tr>

      <tr><td>2 byte</td><td>$6{,}44 \cdot 10^9 \cdot 2$</td><td>12,9 GB</td></tr>

      <tr><td>1 byte</td><td>$6{,}44 \cdot 10^9 \cdot 1$</td><td>6,4 GB</td></tr>

      <tr><td>nửa byte</td><td>$6{,}44 \cdot 10^9 \cdot 0{,}5$</td><td>3,2 GB</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Bước một, lượng tử hoá trọng số của mô hình 6 phẩy 44 tỉ tham số. Với 2 byte mỗi số, bộ nhớ là 12 phẩy 9 GB. Với
      1 byte còn 6 phẩy 4 GB. Với nửa byte chỉ còn 3 phẩy 2 GB. Nén về bốn bít mỗi trọng số cắt dung lượng mô hình sáu phẩy
      bốn bốn tỉ từ mười ba ghi-ga-bai xuống hơn ba ghi-ga-bai vừa một thẻ cá nhân.
  - show: '<p><b>Bước 2 — giải mã suy đoán</b>, $k = 4$, $\alpha = 0{,}8$:</p>

      $$\frac{1 - 0{,}8^5}{1 - 0{,}8} = \frac{1 - 0{,}328}{0{,}2} \approx \hl{3{,}36}$$

      <p>từ tố mỗi lần mô hình lớn chạy, thay vì 1.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Bước hai, giải mã suy đoán với k bằng 4 và alpha bằng 0 phẩy 8. Theo công thức, 1 trừ 0 phẩy 8 mũ 5, chia 0 phẩy
      2, xấp xỉ 3 phẩy 36. Đó là số từ tố mỗi lần mô hình lớn chạy, thay vì 1. Chấp nhận tám mươi phần trăm tạo trung bình
      hơn ba phẩy ba từ tố mới mỗi lần đọc mô hình lớn, nhân gấp ba tốc độ phản hồi.
  - clear: true
    show: '<p><b>Bước 3 — ngữ cảnh</b> 4 nghìn → 32 nghìn từ tố: gấp $\frac{32}{4} = 8$ lần độ dài; chú ý cỡ $n^2$ nên tăng
      $8^2 = \hl{64}$ lần.</p>

      '
    say: Bước ba, tăng ngữ cảnh từ 4 nghìn lên 32 nghìn từ tố là gấp 8 lần độ dài. Vì chú ý có cỡ n bình phương, phần chú
      ý tăng 8 bình phương, bằng 64 lần. Tăng tám lần ngữ cảnh làm chi phí chú ý phình sáu mươi bốn lần, thúc đẩy kỹ sư kết
      hợp truy xuất gọn thay vì nhồi cả kho sách.
  - show: '<p><b>Bước 4</b> — giải mã suy đoán <b>không đổi kết quả</b> về phân phối: mô hình lớn vẫn quyết định; chỉ bớt
      số lần đọc trọng số của nó.</p>

      '
    say: Bước bốn, giải mã suy đoán không đổi kết quả về phân phối, vì mô hình lớn vẫn quyết định từng từ, nó chỉ bớt số lần
      đọc trọng số. Kỹ thuật giải mã suy đoán tăng tốc sinh văn bản hàng loạt mà vẫn bảo toàn nguyên vẹn phân phối xác suất
      đầu ra. Tính chính xác toán học của kiểm chứng song song bảo đảm câu trả lời thu được hoàn toàn đồng nhất phân phối
      với sinh tuần tự chuẩn.
    focus:
    - '1.1'
    - '1.2'
    - '1.2'
  - clear: true
    show: '<p><b>Minh hoạ Python tính kỳ vọng số từ tố của giải mã suy đoán</b></p><div class="code"><div>a, k = 0.8, 4</div><div>toks
      = (1 - a**(k+1)) / (1 - a)</div><div>print(f"expected_tokens={toks:.2f}")</div><div style="color:#059669"># Kết quả:
      expected_tokens=3.36</div></div>'
    focus:
    - 1
    - 2
    say: Đoạn mã áp dụng công thức chuỗi hình học tính kỳ vọng số từ sinh được mỗi lượt kiểm. Kết quả xác nhận tốc độ trung
      bình đạt ba phẩy ba sáu từ tố một lượt thay vì một.
- id: check
  kind: check
  title: Tự kiểm bằng đường khác
  checks:
  - round(1 + 0.8 + 0.8 ** 2 + 0.8 ** 3 + 0.8 ** 4, 4) == 3.3616 and round(alg.spec_decode_tokens(0.8, 4), 2) == 3.36
  - 32000 ** 2 // 4000 ** 2 == 64
  steps:
  - show: '<table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>3,36</td><td>cộng thẳng $1 + 0{,}8 + 0{,}64 + 0{,}512 + 0{,}4096$</td><td>3,3616 ✓</td></tr>

      <tr><td>64 lần</td><td>đếm cặp: $32\,000^2 : 4000^2$</td><td>64 ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác, vì công thức chỉ là cách viết gọn của một tổng. Cộng thẳng 1, 0 phẩy 8, 0 phẩy 64, 0 phẩy 512
      và 0 phẩy 4096 được 3 phẩy 3616, khớp công thức. Đếm thẳng số cặp, 32 nghìn bình phương chia 4 nghìn bình phương cũng
      bằng 64. Cộng tay năm số hạng dãy xác suất chấp nhận khớp đúng công thức tổng cấp số nhân khẳng định kỳ vọng ba phẩy
      ba sáu từ tố.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ ngữ cảnh dài là dùng tốt mọi phần <b class="red">(lạc ở giữa)</b>

      <br><span class="note">Liu và cộng sự (2023), trên các mô hình họ thử năm đó: thông tin ở đầu và cuối ngữ cảnh được
      dùng tốt hơn ở giữa; mô hình mới hơn có thể khá hơn, nên hãy tự đo. Truy xuất đúng vài đoạn thường tốt hơn dán cả trăm
      trang.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ ngữ cảnh dài là dùng tốt mọi phần, trong khi mô hình hay lạc ở giữa. Một nghiên cứu năm 2023 cho
      thấy, với các mô hình được thử năm đó, thông tin ở đầu và cuối ngữ cảnh được dùng tốt hơn ở giữa. Mô hình mới hơn có
      thể khá hơn, nên hãy tự đo trên dữ liệu của mình. Truy xuất đúng vài đoạn thường tốt hơn dán cả trăm trang. Đặt thông
      tin then chốt ở phần giữa của một ngữ cảnh khổng lồ thường bị mô hình bỏ sót hơn hẳn vị trí đầu hoặc cuối văn bản.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Lượng tử hoá mà không đo lại <b class="red">(giảm chất lượng âm thầm)</b>

      <br><span class="note">Nửa byte mỗi tham số có thể làm mô hình kém đi ở một số việc (toán, mã); mức giảm tuỳ mô hình
      và cách lượng tử hoá. Chạy lại bộ đánh giá (bài 10) trước khi đưa bản lượng tử hoá vào dùng.</span></div>

      '
    say: Lỗi thứ hai, lượng tử hoá mà không đo lại, nên chất lượng giảm âm thầm. Nửa byte mỗi tham số có thể làm mô hình kém
      đi ở một số việc như toán hay viết mã, và mức giảm tuỳ mô hình và cách lượng tử hoá. Hãy chạy lại bộ đánh giá trước
      khi đưa bản lượng tử hoá vào dùng. Luôn chạy lại bộ kiểm thử đánh giá logic và toán sau khi lượng tử hoá trọng số để
      phát hiện sụt giảm độ chính xác ẩn.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Chọn mô hình nhỏ đề xuất quá khác mô hình lớn <b class="red">(chấp nhận thấp)</b>

      <br><span class="note">Khi $\alpha$ thấp, phần lớn đề xuất bị bỏ: $\alpha = 0{,}6$, $k = 4$ chỉ được ≈ 2,3 từ tố mỗi
      lần kiểm, mà vẫn tốn công chạy mô hình nhỏ. Đo $\alpha$ trên đúng loại văn bản của ứng dụng.</span></div>

      '
    say: Lỗi thứ ba, chọn mô hình nhỏ đề xuất quá khác mô hình lớn, nên tỉ lệ chấp nhận thấp. Khi alpha thấp, phần lớn đề
      xuất bị bỏ, với alpha bằng 0 phẩy 6 và k bằng 4 chỉ được khoảng 2 phẩy 3 từ tố mỗi lần kiểm, mà vẫn tốn công chạy mô
      hình nhỏ. Hãy đo alpha trên đúng loại văn bản của ứng dụng. Chọn mô hình nháp lệch xa thói quen mô hình chính đẩy tỉ
      lệ từ chối lên cao, khiến tốc độ sinh chậm hơn bình thường.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - (128 / 8) ** 2 == 256 and 128 / 8 == 16 and round(alg.spec_decode_tokens(0.6, 4), 1) == 2.3
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Tăng ngữ cảnh từ 8 nghìn lên 128 nghìn từ tố: phần chú ý tăng bao nhiêu lần? Bộ nhớ đệm khoá–giá trị
      tăng bao nhiêu lần?</td></tr>

      <tr><td>2</td><td>Giải mã suy đoán với $\alpha = 0{,}6$, $k = 4$: mỗi lần kiểm được khoảng bao nhiêu từ tố?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, tăng ngữ cảnh từ 8 nghìn lên 128 nghìn từ tố, phần chú ý tăng bao nhiêu lần?
      Bộ nhớ đệm khoá giá trị tăng bao nhiêu lần? Câu hai, giải mã suy đoán với alpha bằng 0 phẩy 6 và k bằng 4, mỗi lần kiểm
      được khoảng bao nhiêu từ tố? Dừng video và làm ra giấy. Phân tách rạch ròi bậc tăng hàm mũ bậc hai của phép chú ý với
      mức tăng tuyến tính thuần túy của bộ nhớ đệm khoá giá trị.
    pause: 15
  - show: '<p>① Độ dài gấp $\frac{128}{8} = 16$ lần → phần chú ý $16^2 = \hl{256}$ lần; bộ nhớ đệm chỉ lưu một khoá, một giá
      trị mỗi vị trí nên tăng $16$ lần.</p>

      '
    say: Đáp án câu một, độ dài gấp 128 chia 8, bằng 16 lần, nên phần chú ý tăng 16 bình phương, bằng 256 lần. Bộ nhớ đệm
      chỉ lưu một khoá và một giá trị mỗi vị trí, nên chỉ tăng 16 lần. Nhảy gấp mười sáu lần độ dài kéo chú ý vọt hai trăm
      năm mươi sáu lần trong khi bộ đệm chỉ tăng mười sáu lần.
  - show: '$$\frac{1 - 0{,}6^5}{1 - 0{,}6} = \frac{1 - 0{,}078}{0{,}4} \approx \hl{2{,}3}$$

      <p>② ≈ 2,3 từ tố mỗi lần kiểm — đề xuất kém hơn thì lợi ít hơn.</p>

      '
    focus:
    - 1
    - 2
    say: Câu hai, theo công thức, 1 trừ 0 phẩy 6 mũ 5, chia 0 phẩy 4, xấp xỉ 2 phẩy 3 từ tố mỗi lần kiểm. Mô hình nhỏ đề xuất
      kém hơn thì lợi ít hơn.
