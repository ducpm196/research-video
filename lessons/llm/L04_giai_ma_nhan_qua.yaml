scenes:
- id: hook
  kind: hook
  title: Học đoán chữ tiếp theo mà được nhìn trước đáp án
  checks:
  - '[round(x, 3) for x in alg.softmax_t([2, 1, 0, 5])][3] == 0.93'
  steps:
  - show: '<p>Huấn luyện mô hình đoán từ tố thứ 4 khi đã biết 3 từ tố đầu. Nếu cơ chế chú ý được nhìn <b>cả</b> câu, nó chỉ
      cần chép từ tố thứ 4 — ở ví dụ số của bài, dồn tới 93% trọng số vào chính đáp án. Mất mát giảm rất nhanh, nhưng khi
      sinh văn bản thật thì chẳng có gì để chép.</p>

      <div class="box key">Hôm nay: mô hình <b>chỉ giải mã</b> dùng <b>mặt nạ nhân quả</b> để không nhìn trước tương lai,
      và <b>thông tin vị trí</b> để biết thứ tự.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, ta huấn luyện mô hình đoán từ tố thứ tư khi đã biết 3 từ tố đầu. Nếu cơ chế chú ý được nhìn cả câu, nó
      chỉ cần chép từ tố thứ tư, và ở ví dụ số của bài, nó dồn tới 93 phần trăm trọng số vào chính đáp án. Mất mát giảm rất
      nhanh, nhưng khi sinh văn bản thật thì chẳng có gì để chép. Hôm nay ta học mô hình chỉ giải mã, dùng mặt nạ nhân quả
      để không nhìn trước tương lai, và thông tin vị trí để biết thứ tự. Giữ kỷ luật chỉ nhìn quá khứ khi huấn luyện chính
      là hàng rào bảo đảm mô hình thật sự học đoán chữ chứ không quay cóp câu trả lời phía trước.
- id: prereq
  kind: prereq
  title: 'Trước hết: hàm chuẩn hoá mũ và cơ chế chú ý'
  checks:
  - '[round(x, 3) for x in alg.softmax_t([1, 0])] == [0.731, 0.269] and alg.softmax_t([0, 0]) == [0.5, 0.5]'
  - round(math.e, 3) == 2.718 and round(math.e + 1, 3) == 3.718 and round(math.e / (math.e + 1), 3) == 0.731
  - '(lambda w: round(w[0] * 10 + w[1] * 0, 2))(alg.softmax_t([1 * 1 + 0 * 0, 1 * 0 + 0 * 1])) == 7.31'
  steps:
  - show: '<p><b>Hàm chuẩn hoá mũ</b> biến các điểm số thành <b>trọng số</b> dương có tổng bằng 1: lấy $e$ mũ từng điểm (với
      $e \approx 2{,}718$; $e$ mũ một số luôn dương, điểm lớn hơn cho kết quả lớn hơn nhiều), rồi chia cho tổng: $\text{trọng
      số}_i = \frac{e^{z_i}}{\sum_j e^{z_j}}$.</p>

      <p>Làm thử điểm (1, 0): $e^1 \approx 2{,}718$, $e^0 = 1$, tổng $3{,}718$ → $\frac{2{,}718}{3{,}718} \approx 0{,}731$
      và $\frac{1}{3{,}718} \approx 0{,}269$. Điểm bằng nhau (0, 0) thì chia đôi: (0,5; 0,5).</p>

      '
    introduces:
    - exp
    - sum
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Trước hết, ta cần hàm chuẩn hoá mũ, hàm biến các điểm số thành trọng số dương có tổng bằng 1. Cách làm là lấy e mũ
      từng điểm, với e khoảng 2 phẩy 718, rồi chia cho tổng. E mũ một số luôn dương, và điểm lớn hơn cho kết quả lớn hơn nhiều.
      Làm thử với hai điểm 1 và 0, e mũ 1 khoảng 2 phẩy 718, e mũ 0 bằng 1, tổng là 3 phẩy 718, nên hai trọng số là 0 phẩy
      731 và 0 phẩy 269. Hai điểm bằng nhau 0 và 0 thì trọng số chia đôi. Hàm mũ làm nổi bật nhanh các điểm khớp cao trong
      khi vẫn giữ xác suất dương nhỏ cho mọi vị trí hợp lệ còn lại.
  - clear: true
    show: '<p><b>Cơ chế chú ý</b>: mỗi từ tố tạo ba vector — <b>truy vấn</b> (điều nó đang tìm), <b>khoá</b> (nhãn để từ tố
      khác so khớp, giống nhãn trên ngăn tủ), <b>giá trị</b> (nội dung nó đóng góp). Điểm = tích vô hướng của truy vấn với
      từng khoá (nhân từng cặp thành phần rồi cộng); trọng số = chuẩn hoá mũ của các điểm; đầu ra = trộn các giá trị theo
      trọng số.</p>

      <table class="t"><tr><th>làm thử (số minh hoạ)</th><th>khoá</th><th>giá trị</th><th>điểm với truy vấn (1, 0)</th><th>trọng
      số</th></tr>

      <tr><td>từ tố 1</td><td>(1, 0)</td><td>10</td><td>$1 \cdot 1 + 0 \cdot 0 = 1$</td><td>0,731</td></tr>

      <tr><td>từ tố 2</td><td>(0, 1)</td><td>0</td><td>$1 \cdot 0 + 0 \cdot 1 = 0$</td><td>0,269</td></tr></table>

      <p>Đầu ra $= 0{,}731 \cdot 10 + 0{,}269 \cdot 0 \approx 7{,}31$ — nghiêng về từ tố có khoá khớp truy vấn.</p>

      '
    introduces:
    - cdot
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Cơ chế chú ý cho mỗi từ tố tạo ba vector. Truy vấn là điều nó đang tìm, khoá là nhãn để từ tố khác so khớp, giống
      nhãn trên ngăn tủ, còn giá trị là nội dung nó đóng góp. Điểm là tích vô hướng của truy vấn với từng khoá, tức nhân từng
      cặp thành phần rồi cộng. Trọng số là hàm chuẩn hoá mũ của các điểm, và đầu ra là trộn các giá trị theo trọng số. Làm
      thử với số minh hoạ, truy vấn 1, 0 gặp khoá 1, 0 của từ tố thứ nhất được điểm 1, gặp khoá 0, 1 của từ tố thứ hai được
      điểm 0. Hai điểm này cho trọng số 0 phẩy 731 và 0 phẩy 269. Đầu ra bằng 0 phẩy 731 nhân 10 cộng 0 phẩy 269 nhân 0, khoảng
      7 phẩy 31, nghiêng về từ tố có khoá khớp truy vấn. Cơ chế truy vấn khoá giá trị cho phép mỗi vị trí chủ động tìm kiếm
      thông tin liên quan ở bất kỳ khoảng cách nào phía bên trái.
- id: sym
  kind: symbol
  title: 'Giải mã: chỉ giải mã, mặt nạ nhân quả, vị trí'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>Transformer</b></td><td>kiến trúc chồng nhiều tầng chú ý (Vaswani và cộng sự, 2017), dựng cho dịch máy: phần
      mã hoá đọc câu nguồn, phần giải mã sinh câu đích</td></tr>

      <tr><td><b>mô hình chỉ giải mã</b></td><td>chỉ giữ phần giải mã: chồng nhiều tầng chú ý; ở mỗi vị trí, dự đoán từ tố
      KẾ TIẾP; sinh văn bản bằng cách lặp: đoán, thêm vào cuối, đoán tiếp</td></tr>

      <tr><td><b>mặt nạ nhân quả (bảng <i>tam giác dưới</i>)</b></td><td>vị trí $i$ chỉ được chú ý tới vị trí $j \leq i$;
      điểm chú ý của vị trí sau bị đặt âm vô cùng trước hàm chuẩn hoá mũ → trọng số 0</td></tr>

      <tr><td><b>thông tin vị trí</b></td><td>cộng (hoặc xoay) vào mỗi vector nhúng một tín hiệu theo vị trí, vì bản thân
      phép chú ý không biết thứ tự</td></tr></table>

      '
    introduces:
    - geq
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bảng giới thiệu bốn khái niệm. Kiến trúc chú ý nhiều tầng công bố năm 2017 được dựng cho dịch máy, với phần mã hoá
      đọc câu nguồn và phần giải mã sinh câu đích. Mô hình chỉ giải mã chỉ giữ phần giải mã, chồng nhiều tầng chú ý, và ở
      mỗi vị trí dự đoán từ tố kế tiếp. Nó sinh văn bản bằng cách lặp lại, đoán, thêm vào cuối, rồi đoán tiếp. Mặt nạ nhân
      quả cho vị trí i chỉ được chú ý tới các vị trí j không lớn hơn i. Điểm chú ý của vị trí sau bị đặt âm vô cùng trước
      hàm chuẩn hoá mũ, nên trọng số bằng 0. Thông tin vị trí là một tín hiệu theo vị trí được cộng hoặc xoay vào mỗi vector
      nhúng, vì bản thân phép chú ý không biết thứ tự. Từ kiến trúc song phần ban đầu cho dịch thuật, nhánh giải mã giữ lại
      đúng cấu trúc chú ý có mặt nạ làm khung xương cho mọi mô hình sinh lớn.
