    say: Hình vẽ lúc mô hình học trên câu hôm nay trời đẹp. Từ tố thứ ba, trời, được chú ý tới chính nó và hai từ trước, các
      mũi tên xanh. Mũi tên đỏ đứt nét tới từ đẹp bị che, vì đẹp chính là đáp án mà vị trí này phải đoán. Phân tách màu xanh
      hợp lệ và màu đỏ bị che vẽ rành mạch ranh giới nhân quả tại mọi thời điểm sinh từng từ tố.
- id: example
  kind: example
  title: Mặt nạ 4 × 4 và một hàng chú ý
  checks:
  - alg.causal_mask(4) == [[1, 0, 0, 0], [1, 1, 0, 0], [1, 1, 1, 0], [1, 1, 1, 1]] and sum(map(sum, alg.causal_mask(4))) ==
    10 == 4 * 5 // 2
  - '[round(x, 3) for x in alg.softmax_t([2, 1, 0])] == [0.665, 0.245, 0.09] and [round(x, 3) for x in alg.softmax_t([2, 1,
    0, 5])] == [0.046, 0.017, 0.006, 0.93]'
  steps:
  - show: '<table class="t"><tr><th>vị trí \ được nhìn</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>

      <tr><td>1</td><td>✓</td><td>—</td><td>—</td><td>—</td></tr>

      <tr><td>2</td><td>✓</td><td>✓</td><td>—</td><td>—</td></tr>

      <tr><td>3</td><td>✓</td><td>✓</td><td>✓</td><td>—</td></tr>

      <tr><td>4</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bước một, dựng mặt nạ cho chuỗi 4 từ tố. Vị trí 1 chỉ nhìn chính nó. Vị trí 2 nhìn vị trí 1 và 2. Vị trí 3 nhìn ba
      vị trí đầu. Vị trí 4 nhìn cả bốn. Ma trận tam giác dưới giữ chặt thông tin ở bên trái đường chéo chính, cô lập hoàn
      toàn hiện tại khỏi mọi rò rỉ tương lai.
  - show: '<p><b>Bước 2 — đếm ô được phép:</b> $1 + 2 + 3 + 4 = \frac{4 \cdot 5}{2} = \hl{10}$ trong 16 ô.</p>

      '
    introduces:
    - cdot
    say: Bước hai, đếm ô được phép, 1 cộng 2 cộng 3 cộng 4, bằng 4 nhân 5 chia 2, bằng 10 trong 16 ô. Ma trận che tam giác
      dưới ép mỗi vị trí chỉ được đọc ngữ cảnh quá khứ mà không bao giờ nhìn trộm từ tương lai.
    focus:
    - '1.1'
    - '1.2'
  - clear: true
    show: '<p><b>Bước 3 — hàng của vị trí 3</b>, điểm chú ý (2, 1, 0, 5), <b>có</b> mặt nạ: ô thứ 4 bị đặt âm vô cùng, chỉ
      chuẩn hoá 3 ô đầu.</p>

      <table class="t"><tr><th></th><th>ô 1</th><th>ô 2</th><th>ô 3</th><th>ô 4</th></tr>

      <tr><td>$e^{z}$</td><td>7,389</td><td>2,718</td><td>1</td><td>0 (bị che)</td></tr>

      <tr><td>chia tổng 11,107</td><td>0,665</td><td>0,245</td><td>0,090</td><td>0</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    say: Bước ba, xét hàng của vị trí 3 với điểm chú ý 2, 1, 0 và 5, khi có mặt nạ thì ô thứ tư bị đặt âm vô cùng. Lấy e mũ
      từng điểm được 7 phẩy 389, 2 phẩy 718 và 1, còn ô bị che cho 0. Chia cho tổng 11 phẩy 107, được 0 phẩy 665, 0 phẩy 245
      và 0 phẩy 09. Đẩy các ô cấm về âm vô cùng triệt tiêu hàm mũ về đúng bằng không trước khi chia chuẩn hoá trọng số.
  - show: '<p><b>Bước 4 — không có mặt nạ:</b> thêm $e^5 \approx 148{,}41$, tổng ≈ 159,52 → (0,046; 0,017; 0,006; <span class="red">0,930</span>)
      — vị trí 3 nhìn trộm đáp án ở vị trí 4.</p>

      '
    say: Bước bốn, nếu không có mặt nạ, ô thứ tư góp thêm e mũ 5, khoảng 148 phẩy 41, tổng thành khoảng 159 phẩy 52. Khi đó
      ô thứ tư chiếm 0 phẩy 93, tức vị trí 3 nhìn trộm đáp án ở vị trí 4. Nếu thiếu mặt nạ, một điểm số cao bất kỳ bên phải
      lập tức hút chín mươi ba phần trăm sự chú ý, phá hỏng việc học ngữ cảnh trái.
  - clear: true
    show: '<p><b>Minh hoạ Python đếm số ô hợp lệ dưới mặt nạ nhân quả n nhân n</b></p><div class="code"><div>n = 4</div><div>allowed
      = n * (n + 1) // 2</div><div>print(f"{allowed}/{n*n}")</div><div style="color:#059669"># Kết quả: 10/16</div></div>'
    focus:
    - 1
    - 2
    say: Công thức tam giác dưới đếm nhanh số cặp hợp lệ trong ma trận chú ý bốn nhân bốn. Kết quả in ra 10 cặp hợp lệ trên
      tổng 16 ô chú ý.
- id: check
  kind: check
  title: 'Tự kiểm: trọng số cộng bằng 1, ô được phép đếm thẳng'
  checks:
  - abs(sum(alg.softmax_t([2, 1, 0])) - 1) < 1e-12 and round(0.665 + 0.245 + 0.090, 3) == 1.0
  - sum(1 for i in range(4) for j in range(4) if j <= i) == 10
  steps:
  - show: '<table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>trọng số hàng 3</td><td>cộng lại: 0,665 + 0,245 + 0,090</td><td>1,000 ✓</td></tr>

      <tr><td>10 ô được phép</td><td>đếm từng cặp (i, j) có j ≤ i: 1, 2, 3, 4 ô mỗi hàng</td><td>10 ✓</td></tr></table>

      <p class="note"><b>So sánh hai quy mô:</b> Chuỗi 4 từ tố có bảng 4 × 4 (16 ô, 10 cặp hợp lệ); sang ngữ cảnh 32 768 từ
      tố, bảng chú ý bùng lên hơn 1 tỉ ô O(n²) tốn nhiều GB bộ nhớ và làm chậm suy luận theo bình phương độ dài.</p>

      '
    introduces:
    - geq
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    - 2
    say: Kiểm bằng đường khác. Vì hàm chuẩn hoá mũ cho tổng bằng 1, ba trọng số 0 phẩy 665, 0 phẩy 245 và 0 phẩy 09 phải cộng
      lại bằng 1, và đúng như vậy. Đếm thẳng từng cặp có cột không vượt hàng, mỗi hàng có 1, 2, 3, 4 ô, tổng 10, khớp công
      thức. Ở hai mức quy mô, chuỗi 4 từ tố chỉ có 16 ô chú ý với 10 cặp hợp lệ. Sang ngữ cảnh 32 nghìn từ tố, bảng phình
      lên hơn 1 tỉ ô làm tốn bộ nhớ và chậm dần theo bình phương độ dài. Cộng dòng trọng số về một kết hợp kiểm tra hình học
      tam giác dưới xác nhận trọn vẹn cả hai tính chất toán học và nhân quả.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Quên mặt nạ khi huấn luyện <b class="red">(học chép đáp án)</b>

      <br><span class="note">Mất mát lúc huấn luyện thấp bất thường, nhưng sinh văn bản thì vô nghĩa. Dấu hiệu: mất mát huấn
      luyện tốt hơn hẳn mất mát khi sinh từng từ.</span></div>

      '
    say: Lỗi thứ nhất, quên mặt nạ khi huấn luyện, nên mô hình học chép đáp án. Mất mát lúc huấn luyện thấp bất thường, nhưng
      sinh văn bản thì vô nghĩa. Dấu hiệu là mất mát huấn luyện tốt hơn hẳn mất mát khi sinh từng từ. Lỗi rò rỉ mặt nạ tạo
      đường cong mất mát đẹp giả tạo lúc huấn luyện nhưng sinh chuỗi vô nghĩa ngoài đời thật.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Bỏ thông tin vị trí <b class="red">(mất thứ tự)</b>

      <br><span class="note">Không có vị trí và không có mặt nạ, “chó cắn người” và “người cắn chó” là cùng một tập từ tố
      — phép chú ý cho cùng kết quả ở mỗi từ. Mặt nạ nhân quả chỉ lộ thứ tự gián tiếp, nên thứ tự vẫn được đưa vào bằng tín
      hiệu vị trí.</span></div>

      '
    say: Lỗi thứ hai, bỏ thông tin vị trí, nên mất thứ tự. Không có vị trí và không có mặt nạ, chó cắn người và người cắn
      chó là cùng một tập từ tố, và phép chú ý cho cùng kết quả ở mỗi từ. Mặt nạ nhân quả chỉ lộ thứ tự gián tiếp, nên thứ
      tự vẫn được đưa vào bằng tín hiệu vị trí. Vì mạng tự chú ý nhìn đồng thời mọi cột, thông tin vị trí phải được cộng hoặc
      mã hoá xoay trực tiếp vào biểu diễn đầu vào.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nghĩ mô hình “đọc” cả câu rồi mới trả lời <b class="red">(sinh từng từ)</b>

      <br><span class="note">Mỗi từ tố đầu ra chỉ dựa vào phần đã có bên trái. Với bài nhiều bước, để mô hình viết các bước
      trung gian ra thành từ tố trước câu trả lời thường giúp nó làm đúng hơn.</span></div>

      '
    say: Lỗi thứ ba, nghĩ mô hình đọc cả câu rồi mới trả lời, trong khi nó sinh từng từ. Mỗi từ tố đầu ra chỉ dựa vào phần
      đã có bên trái. Với bài nhiều bước, để mô hình viết các bước trung gian ra thành từ tố trước câu trả lời thường giúp
      nó làm đúng hơn. Mỗi từ mới sinh ra lại được nối thêm vào cuối ngữ cảnh để làm đầu vào cho lượt tính kế tiếp từng bước
      một.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - sum(map(sum, alg.causal_mask(6))) == 21 and alg.softmax_t([7.0]) == [1.0]
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Chuỗi 6 từ tố: mặt nạ nhân quả có bao nhiêu ô được phép trong 36?</td></tr>

      <tr><td>2</td><td>Vị trí 1 có điểm chú ý 7 với chính nó. Sau hàm chuẩn hoá mũ, trọng số của nó là bao nhiêu? Vì sao
      không phụ thuộc giá trị 7?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, chuỗi 6 từ tố thì mặt nạ nhân quả có bao nhiêu ô được phép trong 36? Câu hai,
      vị trí 1 có điểm chú ý 7 với chính nó. Sau hàm chuẩn hoá mũ, trọng số của nó là bao nhiêu, và vì sao không phụ thuộc
      giá trị 7? Dừng video và làm ra giấy. Tính tổng số ô tam giác dưới và thử chuẩn hoá một hàng đơn lẻ ở vị trí mở đầu
      câu.
    pause: 15
  - show: '<p>① $1 + 2 + 3 + 4 + 5 + 6 = \frac{6 \cdot 7}{2} = \hl{21}$ ô.</p>

      '
    say: Đáp án câu một, cộng 1 tới 6, bằng 6 nhân 7 chia 2, bằng 21 ô. Công thức cấp số cộng xác nhận tổng hai mươi mốt ô
      hợp lệ trong ma trận sáu nhân sáu đối xứng tam giác.
  - show: '$$\frac{e^{7}}{e^{7}} = \hl{1}$$

      <p>② Chỉ một ô được phép, chuẩn hoá một số luôn ra 1, dù điểm là 7 hay bao nhiêu — vị trí đầu chỉ chép chính nó.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Câu hai, chỉ có một ô được phép, nên trọng số bằng e mũ 7 chia e mũ 7, bằng 1. Chuẩn hoá một số luôn ra 1, dù điểm
      là 7 hay bao nhiêu, nên vị trí đầu chỉ chép chính nó. Với đúng một ô mở, từ tố đầu câu luôn dồn trăm phần trăm chú ý
      vào chính nó bất kể điểm thô lớn nhỏ ra sao.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/LLM/L04
  steps:
  - show: <table class='t'><tr><th>Thực hành LLM:L04</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Giải
      thích vì sao cần thông tin vị trí</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n1=6 n2=12</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh LLM L04 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 4 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Thực hành đếm số ô mở hợp lệ trên ma trận tam giác dưới
      cho hai kích thước chuỗi từ tố kiểm định chuẩn. Xác minh kết quả xuất chuẩn dạng phân số rút gọn hoặc giữ nguyên mẫu.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai LLM:L04</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (cặp tam giác dưới)</b></td><td>Tính n nhân n cộng một chia đôi cho số vị trí không nhìn tương lai</td></tr><tr><td><b>Bước
      2 (tổng ma trận chú ý)</b></td><td>Tính bình phương n cho tổng số ô mặt nạ</td></tr><tr><td><b>Bước 3 (xuất tỉ số từng
      chuỗi)</b></td><td>In đúng hai dòng theo mẫu hợp lệ trên tổng</td></tr><tr><td><b>Nhãn dòng kết quả</b></td><td>Giữ
      nhãn khoá cố định <code>n=6</code> cho <code>n1</code> và <code>n=12</code> cho <code>n2</code></td></tr></table>
    say: Gợi ý cài đặt bài số 4 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 2 dòng khớp định dạng.
    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (2 dòng)</b></p><div class="code"><div>n=6 allowed=21/36</div><div>n=12 allowed=78/144</div></div>
    say: Màn hình hiện 2 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">mỗi vị trí đoán từ tố kế tiếp</span><span class="a">→</span>

      <span class="n">mặt nạ: chỉ nhìn bên trái</span><span class="a">→</span>

      <span class="n">vị trí: đưa thứ tự vào</span><span class="a">→</span>

      <span class="n">sinh văn bản: lặp đoán – thêm – đoán</span></div>

      '
    say: Tổng kết lại, mỗi vị trí đoán từ tố kế tiếp, mặt nạ chỉ cho nhìn bên trái, tín hiệu vị trí đưa thứ tự vào, và sinh
      văn bản là lặp lại đoán, thêm, rồi đoán tiếp. Kiến trúc giải mã tự hồi quy sinh từng từ tố từ trái sang phải nhờ mặt
      nạ nhân quả chặn đứng mọi đường nhìn trộm về các vị trí tương lai. Trong bảng ma trận vuông kích thước n nhân n, chỉ
      nửa tam giác dưới tính cả đường chéo chính gồm n nhân n cộng một chia hai ô là được phép truy cập.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
  - show: '<div class="chain"><span class="n">mỗi vị trí đoán từ tố kế tiếp</span><span class="a">→</span>

      <span class="n">mặt nạ: chỉ nhìn bên trái</span><span class="a">→</span>

      <span class="n">vị trí: đưa thứ tự vào</span><span class="a">→</span>

      <span class="n">sinh văn bản: lặp đoán – thêm – đoán</span></div>

      '
    say: Bởi bản chất phép chú ý xử lý các cột song song không phân biệt thứ tự tự nhiên, việc cộng thêm mã hoá vị trí vào
      đầu vào là yêu cầu bắt buộc. Nếu thiếu thông tin vị trí, mô hình sẽ nhìn thấy hai câu đảo vị trí từ như hoàn toàn giống
      nhau và đánh mất cấu trúc ngữ pháp của câu. Khi chuyển từ huấn luyện song song cả chuỗi sang sinh chữ thật từng bước
      một, mỗi bước dự đoán mới được nối vào đuôi chuỗi để tiếp tục làm đầu vào kế tiếp. Hiểu trọn vẹn cấu trúc tam giác dưới
      và cơ chế vị trí này đặt nền tảng vững chắc cho bài tính bộ nhớ đệm khoá giá trị tiếp theo. Cấu trúc mặt nạ tam giác
      dưới cùng bộ đệm mã hoá giúp mỗi lớp tự chú ý xử lý gọn cả ngữ cảnh mà vẫn tôn trọng thứ tự nhân quả chặt chẽ. Hiểu
      rõ bước chuyển từ huấn luyện song song sang sinh tuần tự sẽ giúp bạn tính chính xác chi phí từng lượt sinh chữ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
  - show: '<div class="box key"><b>Tư duy:</b> lúc huấn luyện phải giữ đúng <b>điều kiện</b> lúc dùng — mô hình không được
      biết điều nó sẽ không biết khi chạy thật.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ chuỗi 4 từ tố (16 ô ma trận tự chú ý) tới ngữ cảnh 32 768 từ tố (> 1 tỉ
      ô O(n²)): mặt nạ tam giác dưới giữ tính nhân quả nhưng làm chi phí bùng nổ theo bình phương độ dài.</p>

      '
    say: Điều cần mang theo, lúc huấn luyện phải giữ đúng điều kiện lúc dùng, mô hình không được biết điều mà nó sẽ không
      biết khi chạy thật.
    focus:
    - 1
  - clear: true
    show: '<p class="note">Bài sau (bài 5): <b>chi phí tính toán</b> — tham số, phép tính và bộ nhớ đệm khoá–giá trị.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 5, ta học chi phí tính toán, gồm số tham số, số phép tính, và bộ nhớ đệm khoá giá trị. Hẹn gặp bạn
      ở bài tiếp theo.
