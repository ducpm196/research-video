      scaling check: sum of softmax = 1.0</div><div>import math</div><div>exps = [math.exp(x) for x in (2, 1, 0)]</div><div>print([round(e/sum(exps),
      3) for e in exps])</div><div style="color:#059669"># Kết quả: [0.665, 0.245, 0.09]</div></div>'
    focus:
    - 1
    - 2
    say: Đoạn mã lấy hàm mũ từng điểm chú ý rồi chia tổng để biến điểm thô thành phân phối trọng số. Ba trọng số đầu ra cộng
      lại bằng đúng một làm bảng chú ý tập trung vào từ liên quan nhất.
- id: check
  kind: check
  title: 'Tự kiểm: mỗi hàng cộng bằng 1, và chia nhiệt độ là đổi điểm'
  checks:
  - all(abs(sum(alg.softmax_t([2, 1, 0], t_)) - 1) < 1e-12 for t_ in (0.5, 1, 2))
  - '[round(x, 3) for x in alg.softmax_t([4, 2, 0])] == [round(x, 3) for x in alg.softmax_t([2, 1, 0], 0.5)] == [0.867, 0.117,
    0.016]'
  steps:
  - show: '<table class="t"><tr><th>kiểm</th><th>cách</th><th>kết quả</th></tr>

      <tr><td>hàng $T = 0{,}5$</td><td>0,867 + 0,117 + 0,016</td><td>1,000 ✓</td></tr>

      <tr><td>$T = 0{,}5$ với điểm (2, 1, 0)</td><td>tính thẳng điểm (4, 2, 0) ở $T = 1$</td><td>cùng (0,867; 0,117; 0,016)
      ✓</td></tr></table>

      <p class="note"><b>So sánh hai quy mô:</b> Ví dụ 3 từ tố (2, 1, 0) tính Softmax + lọc top-p tức thì; với bảng từ vựng
      V = 100 000 từ tố ở mô hình thật, mỗi bước phải tính mũ và sắp xếp 100 000 điểm, đánh đổi thêm độ đa dạng câu lấy nguy
      cơ lạc đề nếu T/p quá cao.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    - 2
    say: Kiểm bằng đường khác. Mỗi hàng của bảng nhiệt độ phải cộng bằng 1, và hàng nhiệt độ 0 phẩy 5 cộng đúng bằng 1. Vì
      chia cho 0 phẩy 5 chính là nhân đôi điểm, tính thẳng điểm 4, 2, 0 ở nhiệt độ 1 cũng ra đúng ba số đó. Ở hai mức quy
      mô, ví dụ 3 từ tố lọc hạt nhân tức thì. Với từ vựng thật 100 nghìn mục, mỗi bước phải tính chuẩn hoá mũ toàn bộ bảng
      điểm và chấp nhận rủi ro sai nghĩa nếu tăng ngưỡng lọc quá rộng. Mỗi hàng tổng bằng đúng một xác nhận thao tác điều
      chỉnh nhiệt độ không hề làm hỏng tính hợp lệ phân phối xác suất.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - '[round(x, 3) for x in alg.softmax_t([5, 1, 0])] == [0.976, 0.018, 0.007] and alg.top_p_keep(alg.softmax_t([5, 1, 0]),
    0.9) == [0]'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Dùng tham lam cho văn bản dài <b class="red">(lặp vòng)</b>

      <br><span class="note">Luôn chọn từ tố xác suất cao nhất dễ rơi vào vòng lặp câu chữ. Tham lam hợp với câu trả lời ngắn
      có một đáp án đúng; văn bản dài cần rút ngẫu nhiên có kiểm soát.</span></div>

      '
    say: Lỗi thứ nhất, dùng tham lam cho văn bản dài, nên dễ lặp vòng. Luôn chọn từ tố xác suất cao nhất dễ rơi vào vòng lặp
      câu chữ. Tham lam hợp với câu trả lời ngắn có một đáp án đúng, còn văn bản dài cần rút ngẫu nhiên có kiểm soát. Lựa
      chọn tham lam xuất sắc trong bài toán trích xuất dữ liệu cấu trúc ngắn nhưng dễ sa lầy lặp cụm chữ ở văn bản dài. Tham
      số chọn tham lam cứng nhắc dễ đẩy mô hình lặp lại một cụm từ đơn điệu trong đoạn văn dài.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Đặt k cố định cho mọi bước <b class="red">(quá rộng hoặc quá hẹp)</b>

      <br><span class="note">Khi mô hình rất chắc chắn, điểm (5, 1, 0) cho A = 0,976: giữ 2 từ tố vẫn để lọt B dù gần như
      sai. Lấy mẫu hạt nhân 0,9 chỉ giữ A — số từ tố được giữ tự co giãn theo độ chắc chắn.</span></div>

      '
    say: Lỗi thứ hai, đặt k cố định cho mọi bước, nên khi thì quá rộng, khi thì quá hẹp. Khi mô hình rất chắc chắn, với điểm
      5, 1 và 0, A chiếm 0 phẩy 976, và giữ 2 từ tố vẫn để lọt B dù gần như sai. Lấy mẫu hạt nhân ngưỡng 0 phẩy 9 chỉ giữ
      A, vì số từ tố được giữ tự co giãn theo độ chắc chắn.
  - show: ''
    say: Ngưỡng số lượng k cố định ép cắt bớt các lựa chọn hay khi văn cảnh mở rộng hoặc giữ rác lúc câu hoàn toàn chắc chắn.
      Giới hạn tập hạt nhân giúp cắt bỏ đuôi xác suất nhiễu mà vẫn giữ được độ phong phú tự nhiên của ngôn từ.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Tin nhiệt độ 0 là hoàn toàn lặp lại được <b class="red">(chưa chắc)</b>

      <br><span class="note">Về lý thuyết nhiệt độ 0 là tham lam. Thực tế, tính song song trên số dấu phẩy động có thể đổi
      thứ tự cộng, làm hai từ tố gần bằng điểm đổi chỗ — kết quả thỉnh thoảng vẫn khác giữa các lần chạy.</span></div>

      '
    say: Lỗi thứ ba, tin nhiệt độ 0 là hoàn toàn lặp lại được, điều này chưa chắc. Về lý thuyết nhiệt độ 0 là tham lam. Thực
      tế, tính song song trên số dấu phẩy động có thể đổi thứ tự cộng, làm hai từ tố gần bằng điểm đổi chỗ, nên kết quả thỉnh
      thoảng vẫn khác giữa các lần chạy. Sai số dấu phẩy động khi cộng tích ma trận song song trên phần cứng vẫn tạo ra biến
      thiên nhỏ ngay cả ở nhiệt độ bằng không.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(sum(alg.softmax_t([2, 1, 0], 0.5)[:2]), 3) == 0.984 and round(sum(alg.softmax_t([2, 1, 0], 2)[:2]), 3) == 0.814
  - '[round(x, 4) for x in alg.softmax_t([2, 1, 0], 2)[:2]] == [0.5065, 0.3072] and round(0.5065 + 0.3072, 3) == 0.814'
  - alg.top_p_keep(alg.softmax_t([2, 1, 0], 0.5), 0.9) == [0, 1] and alg.top_p_keep(alg.softmax_t([2, 1, 0], 0.5), 0.85) ==
    [0] and alg.top_p_keep(alg.softmax_t([2, 1, 0], 2), 0.9) == [0, 1, 2]
  steps:
  - show: '<p>Điểm (2, 1, 0).</p>

      <table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Ở $T = 0{,}5$, lấy mẫu hạt nhân $p = 0{,}9$ giữ những từ tố nào? Với $p = 0{,}85$ thì sao?</td></tr>

      <tr><td>2</td><td>Ở $T = 2$, $p = 0{,}9$ giữ mấy từ tố?</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.2'
    - '2.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm, vẫn với điểm 2, 1 và 0. Câu một, ở nhiệt độ 0 phẩy 5, lấy mẫu hạt nhân ngưỡng 0 phẩy
      9 giữ những từ tố nào? Với ngưỡng 0 phẩy 85 thì sao? Câu hai, ở nhiệt độ 2, ngưỡng 0 phẩy 9 giữ mấy từ tố? Dừng video
      và làm ra giấy. Áp dụng cộng dồn từ lớn xuống bé tại hai mức nhiệt độ giúp kiểm định cách tập ứng viên co giãn theo
      ngữ cảnh.
    pause: 15
  - show: '<table class="t"><tr><th>$T = 0{,}5$</th><th>cộng dồn</th><th>$p = 0{,}9$</th><th>$p = 0{,}85$</th></tr>

      <tr><td>A</td><td>0,867</td><td>chưa đủ</td><td>đủ → chỉ giữ <b>A</b></td></tr>

      <tr><td>A + B</td><td>0,984</td><td>đủ → giữ <b>A, B</b></td><td>—</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Đáp án câu một, cộng dồn ở nhiệt độ 0 phẩy 5. Chỉ A là 0 phẩy 867, chưa đủ ngưỡng 0 phẩy 9 nhưng đã đủ ngưỡng 0 phẩy
      85, nên với ngưỡng 0 phẩy 85 chỉ giữ A. Thêm B được 0 phẩy 984, nên với ngưỡng 0 phẩy 9 giữ A và B. Chỉ năm phần trăm
      chênh lệch ngưỡng cắt đủ loại hẳn phương án thứ hai khỏi tập rút mẫu ở phân phối dốc nhọn.
  - show: '<p>② Ở $T = 2$: A + B $= 0{,}5065 + 0{,}3072 \approx 0{,}814 \lt 0{,}9$ (cộng số chưa làm tròn) → phải giữ cả <b>3</b>.
      Nhiệt độ cao và ngưỡng cao cùng làm văn bản đa dạng hơn.</p>

      '
    introduces:
    - ltgt
    say: Câu hai, ở nhiệt độ 2, A cộng B chỉ được 0 phẩy 814, chưa tới 0 phẩy 9, nên phải giữ cả 3 từ tố. Nhiệt độ cao và
      ngưỡng cao cùng làm văn bản đa dạng hơn. Khi tăng nhiệt độ lên hai, tổng hai phương án dẫn đầu hụt ngưỡng chín mươi
      phần trăm buộc bộ giải mã giữ trọn cả ba lựa chọn.
