scenes:
- id: hook
  kind: hook
  title: Cùng câu hỏi, hai câu trả lời khác nhau
  steps:
  - show: '<p>Hỏi mô hình cùng một câu hai lần, nhận hai câu trả lời khác nhau. Mô hình không “đổi ý” — nó trả về một <b>phân
      phối xác suất</b> trên từ tố kế tiếp, và cách ta <b>chọn</b> từ phân phối đó quyết định văn bản: lặp đi lặp lại, sáng
      tạo, hay lan man.</p>

      <div class="box key">Hôm nay: bốn cách chọn từ tố — <b>tham lam</b>, <b>nhiệt độ</b>, <b>giữ k từ tố đầu</b>, <b>lấy
      mẫu hạt nhân</b>.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, hỏi mô hình cùng một câu hai lần, ta nhận hai câu trả lời khác nhau. Mô hình không đổi ý, nó trả về một
      phân phối xác suất trên từ tố kế tiếp. Cách ta chọn từ phân phối đó quyết định văn bản lặp đi lặp lại, sáng tạo, hay
      lan man. Hôm nay ta học bốn cách chọn từ tố, tham lam, nhiệt độ, giữ k từ tố đầu, và lấy mẫu hạt nhân. Cách lấy mẫu
      từ phân phối xác suất giải thích vì sao cùng một lời nhắc có thể sinh ra câu trả lời chặt chẽ hay bay bổng khác nhau.
      Điều chỉnh chiến lược lấy mẫu từ chọn chặt tới chọn đa dạng biến đổi hoàn toàn sắc thái câu trả lời.
- id: prereq
  kind: prereq
  title: 'Ôn lại: điểm thành xác suất, và chuẩn hoá lại'
  checks:
  - '[round(x, 3) for x in alg.softmax_t([2, 1, 0])] == [0.665, 0.245, 0.09] and round(0.665 / (0.665 + 0.245), 3) == 0.731'
  - '[round(math.exp(z), 3) for z in (2, 1, 0)] == [7.389, 2.718, 1.0] and round(math.exp(2) + math.exp(1) + 1, 3) == 11.107'
  steps:
  - show: '<p>Ở mỗi bước, mô hình cho mỗi từ tố ứng viên một <b>điểm</b> số (điểm cao = hợp hơn). <b>Nhắc lại từ bài 4</b>:
      hàm chuẩn hoá mũ biến điểm thành xác suất — lấy $e$ mũ từng điểm ($e \approx 2{,}718$) rồi chia cho tổng.</p>

      <table class="t"><tr><th>điểm</th><th>2</th><th>1</th><th>0</th><th>tổng</th></tr>

      <tr><td>$e$ mũ điểm</td><td>7,389</td><td>2,718</td><td>1</td><td>11,107</td></tr>

      <tr><td>chia tổng</td><td>0,665</td><td>0,245</td><td>0,090</td><td>1</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    say: Ở mỗi bước, mô hình cho mỗi từ tố ứng viên một điểm số, điểm cao cho thấy từ tố rất khớp ngữ cảnh. Nhắc lại từ bài
      4, hàm chuẩn hoá mũ biến điểm thành xác suất, lấy e mũ từng điểm, với e khoảng 2 phẩy 718, rồi chia cho tổng. Với ba
      điểm 2, 1 và 0, e mũ điểm là 7 phẩy 389, 2 phẩy 718 và 1, tổng 11 phẩy 107. Chia cho tổng được ba xác suất 0 phẩy 665,
      0 phẩy 245 và 0 phẩy 09. Điểm thô xuất ra ở tầng cuối cùng phản ánh độ ưu ái tương đối trước khi được hàm chuẩn hoá
      mũ chuyển về tổng xác suất một.
  - show: '<p><b>Chuẩn hoá lại</b> sau khi bỏ bớt: chia mỗi số còn giữ cho <b>tổng các số còn giữ</b>.</p>

      $$\frac{0{,}665}{0{,}665 + 0{,}245} = \frac{0{,}665}{0{,}910} \approx 0{,}731$$

      '
    focus:
    - 1
    - 2
    - 2
    say: Nếu bỏ bớt một từ tố, ta chuẩn hoá lại, chia mỗi số còn giữ cho tổng các số còn giữ. Ví dụ giữ hai số đầu, 0 phẩy
      665 chia 0 phẩy 91 xấp xỉ 0 phẩy 731. Sau khi gạt bỏ phần đuôi hiếm gặp, chia lại cho tổng phần giữ giúp phân phối rút
      gọn vẫn cộng chuẩn xác về đơn vị một.
- id: sym
  kind: symbol
  title: 'Giải mã: bốn cách chọn'
  steps:
  - show: '<table class="t"><tr><th>cách</th><th>làm gì</th></tr>

      <tr><td><b>tham lam</b></td><td>luôn chọn từ tố (<i>token</i>) xác suất cao nhất</td></tr>

      <tr><td><b>nhiệt độ</b> $T$</td><td>chia điểm thô (<i>logits</i>) cho $T$ trước hàm chuẩn hoá mũ (<i>Softmax</i>): $p_i
      = \frac{e^{z_i / T}}{\sum_j e^{z_j / T}}$; $T \lt 1$ nhọn hơn, $T \gt 1$ phẳng hơn</td></tr>

      <tr><td><b>giữ k từ tố đầu</b> (top-k)</td><td>chỉ giữ $k$ từ tố xác suất cao nhất, chuẩn hoá lại rồi rút ngẫu nhiên</td></tr>

      <tr><td><b>lấy mẫu hạt nhân</b> (top-p)</td><td>giữ ít từ tố nhất có tổng xác suất ≥ $p$, chuẩn hoá lại rồi rút</td></tr></table>

      '
    introduces:
    - ltgt
    - sum
    - exp
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bảng giới thiệu bốn cách chọn. Tham lam luôn chọn từ tố có xác suất cao nhất. Nhiệt độ T chia điểm cho T trước hàm
      chuẩn hoá mũ, T nhỏ hơn 1 làm phân phối nhọn hơn, T lớn hơn 1 làm phẳng hơn. Giữ k từ tố đầu chỉ giữ k từ tố có xác
      suất cao nhất, chuẩn hoá lại rồi rút ngẫu nhiên. Lấy mẫu hạt nhân giữ ít từ tố nhất có tổng xác suất từ p trở lên, chuẩn
      hoá lại rồi rút. Nhiệt độ định hình độ dốc phân phối còn ngưỡng lấy mẫu hạt nhân linh hoạt co dãn số ứng viên giữ lại
      tuỳ độ tự tin từng bước.
