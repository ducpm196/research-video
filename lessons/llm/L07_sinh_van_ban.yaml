    [0.506, 0.307, 0.186]]'
  - '(lambda p: [round(x / (p[0] + p[1]), 3) for x in p[:2]])(alg.softmax_t([2, 1, 0])) == [0.731, 0.269] and alg.top_p_keep(alg.softmax_t([2,
    1, 0]), 0.9) == [0, 1]'
  steps:
  - show: '<table class="t"><tr><th>nhiệt độ</th><th>điểm chia T</th><th>A</th><th>B</th><th>C</th></tr>

      <tr><td>$T = 0{,}5$</td><td>(4, 2, 0)</td><td>0,867</td><td>0,117</td><td>0,016</td></tr>

      <tr><td>$T = 1$</td><td>(2, 1, 0)</td><td>0,665</td><td>0,245</td><td>0,090</td></tr>

      <tr><td>$T = 2$</td><td>(1; 0,5; 0)</td><td>0,506</td><td>0,307</td><td>0,186</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Bước một, chia điểm cho nhiệt độ rồi chuẩn hoá. Nhiệt độ 0 phẩy 5 nhân đôi điểm thành 4, 2, 0, và A chiếm 0 phẩy
      867. Nhiệt độ 1 giữ nguyên điểm, A được 0 phẩy 665. Ở nhiệt độ 2, mọi điểm bị chia đôi, nên phân phối phẳng hơn, và
      A chỉ còn 0 phẩy 506. Giảm nhiệt độ về một nửa tương đương nhân đôi mọi chênh lệch điểm thô khiến ứng viên đầu bảng
      bỏ xa phần còn lại.
  - clear: true
    show: '<p>Ở $T = 1$ — <b>bước 2, tham lam</b>: luôn chọn A (0,665 lớn nhất), mọi lần sinh ra cùng một câu.</p>

      <p><b>Bước 3, giữ 2 từ tố đầu</b>: A, B; chuẩn hoá lại → A = 0,731, B = 0,269; rút ngẫu nhiên theo hai số này.</p>

      <p class="note"><b>Chọn cách sinh theo mục đích:</b> cần đáp án chính xác chọn nhiệt độ thấp hay tham lam; cần viết
      đa dạng sáng tạo chọn lấy mẫu hạt nhân.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Bước hai, ở nhiệt độ 1, cách tham lam luôn chọn A vì 0 phẩy 665 lớn nhất, nên mọi lần sinh ra cùng một câu. Bước
      ba, giữ 2 từ tố đầu là A và B, chuẩn hoá lại thành 0 phẩy 731 và 0 phẩy 269, rồi rút ngẫu nhiên theo hai số này. Khi
      chọn cách sinh theo mục đích, hãy dùng nhiệt độ thấp cho câu trả lời chuẩn xác và lấy mẫu hạt nhân khi cần văn phong
      đa dạng. Tham lam luôn lặp cùng câu cố định còn giữ hai từ đầu đôi khi vẫn giữ nhầm lựa chọn yếu khi phân phối rất nhọn.
  - show: '<table class="t"><tr><th>lấy mẫu hạt nhân, $p = 0{,}9$</th><th>tổng cộng dồn</th><th>đủ 0,9?</th></tr>

      <tr><td>A</td><td>0,665</td><td>chưa</td></tr>

      <tr><td>A + B</td><td>$\hl{0{,}910}$</td><td>đủ → giữ A, B, bỏ C</td></tr></table>

      '
    introduces:
    - geq
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Bước bốn, lấy mẫu hạt nhân với ngưỡng 0 phẩy 9, xếp từ tố theo xác suất giảm dần rồi cộng dồn. Chỉ A thì 0 phẩy 665,
      chưa đủ. Thêm B được 0 phẩy 91, đủ, nên giữ A và B và bỏ C. Cộng dồn tới ngưỡng không phẩy chín tự động dừng ngay ở
      hai phương án đầu mà không ép giữ thêm từ tố nhiễu thứ ba.
  - clear: true
