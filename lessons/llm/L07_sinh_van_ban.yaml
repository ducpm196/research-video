- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">mô hình cho phân phối</span><span class="a">→</span>

      <span class="n">nhiệt độ: nhọn hay phẳng</span><span class="a">→</span>

      <span class="n">cắt đuôi: k cố định hoặc tổng ≥ p</span><span class="a">→</span>

      <span class="n">tham lam cho đáp án ngắn, rút mẫu cho văn bản dài</span></div>

      '
    say: Tổng kết lại, mô hình cho một phân phối. Nhiệt độ làm phân phối nhọn hay phẳng, rồi ta cắt đuôi bằng k cố định hoặc
      bằng tổng xác suất. Tham lam hợp cho đáp án ngắn, còn rút mẫu hợp cho văn bản dài. Trước một phân phối xác suất đầu
      ra tại mỗi bước, chiến lược chọn từ quyết định trực tiếp tính ổn định hay độ sáng tạo của văn bản sinh ra. Phối hợp
      nhiệt độ thấp cùng ngưỡng hạt nhân chọn lọc giữ văn bản tự nhiên mà vẫn không đánh mất tính mạch lạc trọng tâm.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
  - show: '<div class="chain"><span class="n">mô hình cho phân phối</span><span class="a">→</span>

      <span class="n">nhiệt độ: nhọn hay phẳng</span><span class="a">→</span>

      <span class="n">cắt đuôi: k cố định hoặc tổng ≥ p</span><span class="a">→</span>

      <span class="n">tham lam cho đáp án ngắn, rút mẫu cho văn bản dài</span></div>

      '
    say: Chia điểm thô cho nhiệt độ nhỏ hơn một làm phân phối dốc nhọn tập trung hẳn vào phương án đầu bảng, trong khi nhiệt
      độ lớn hơn một trải phẳng cơ hội cho nhánh hiếm. Cắt đuôi theo ngưỡng k cố định đơn giản nhưng dễ quá hẹp khi phân phối
      phẳng hoặc thừa quá nhiều lựa chọn vô nghĩa khi phân phối vốn đã dốc. Ngược lại lọc hạt nhân dựa trên tổng xác suất
      tích lũy tự động thu hẹp danh sách lúc mô hình tự tin và mở rộng lúc mô hình còn phân vân. Khi làm bài toán trích xuất
      ngắn hay viết mã đòi hỏi tính xác định cao, giảm nhiệt độ gần không hoặc chọn tham lam thường cho kết quả sạch nhất.
      Khi viết sáng tạo hay hội thoại dài, kết hợp nhiệt độ vừa phải với lọc tổng xác suất tránh được vòng lặp câu chữ nhàm
      chán. Lưu ý quy ước lọc tổng xác suất dừng ngay khi chạm hoặc vượt ngưỡng đã chọn trên danh sách đã sắp xếp giảm dần.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
  - show: '<div class="box key"><b>Tư duy:</b> “mô hình nói gì” là kết quả của <b>mô hình</b> cộng với <b>cách chọn</b> —
      đổi cách chọn là đổi hành vi, không cần huấn luyện lại.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ 3 từ tố minh hoạ tới từ vựng 100 000 mục phải chuẩn hoá Softmax và sắp
      xếp top-p mỗi bước sinh: tăng nhiệt độ hay nới p mở rộng sáng tạo nhưng làm tăng rủi ro sinh từ sai.</p>

      '
    say: Điều cần mang theo, điều mô hình nói ra là kết quả của mô hình cộng với cách chọn, và đổi cách chọn là đổi hành vi
      mà không cần huấn luyện lại. Điều chỉnh thông số lấy mẫu là công cụ nhanh không tốn chi phí huấn luyện để tối ưu hành
      vi mô hình cho từng tác vụ cụ thể.
    focus:
    - 1
    - 1
  - clear: true
    show: '<p class="note">Bài sau (bài 8): <b>tinh chỉnh</b> — toàn bộ tham số và hạng thấp.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 8, ta học tinh chỉnh, cập nhật toàn bộ tham số hay chỉ một phần hạng thấp. Hẹn gặp bạn ở bài tiếp
      theo.
