      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Thực hành cài đặt hàm chia nhiệt độ chuẩn hoá mũ rồi tính
      phân phối xác suất ứng viên và tổng ngưỡng tích lũy đầu tiên. Kiểm đủ cả hai chuỗi xác suất ba phần tử lẫn tổng ngưỡng
