id: L07
course: LLM
series: "LLM · Mô hình ngôn ngữ lớn"
title: "Bài 7 — Sinh văn bản: tham lam, nhiệt độ, top-k, top-p"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/llm.yaml L07; audit/llm/verify_llm.py L07; A. Holtzman và cộng sự, The Curious Case of Neural Text Degeneration, ICLR (2020) — lấy mẫu hạt nhân (top-p); A. Fan, M. Lewis, Y. Dauphin, Hierarchical Neural Story Generation (2018) — top-k; CS115 bài 20 (hàm chuẩn hoá mũ)"
assumes: [arith, frac, exp, sub, approx]
# Quy ước: điểm (logit) của 3 từ tố ứng viên A, B, C là (2, 1, 0). alg.softmax_t(z, T) = hàm chuẩn hoá mũ của z/T; alg.top_p_keep(p, ngưỡng)
#   giữ ít từ tố nhất (xếp xác suất giảm dần) có tổng ≥ ngưỡng. Tên top-k, top-p chỉ trên màn hình; lời đọc “giữ k từ tố đầu”, “lấy mẫu hạt nhân”.
objectives:
  - "Tính phân phối sau khi chia nhiệt độ"
  - "Áp dụng giữ k từ tố đầu và lấy mẫu hạt nhân"
  - "Chọn cách sinh theo mục đích"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng câu hỏi, hai câu trả lời khác nhau"
    steps:
      - show: |
          <p>Hỏi mô hình cùng một câu hai lần, nhận hai câu trả lời khác nhau. Mô hình không “đổi ý” — nó trả về một <b>phân phối xác suất</b> trên từ tố kế tiếp, và cách ta <b>chọn</b> từ phân phối đó quyết định văn bản: lặp đi lặp lại, sáng tạo, hay lan man.</p>
          <div class="box key">Hôm nay: bốn cách chọn từ tố — <b>tham lam</b>, <b>nhiệt độ</b>, <b>giữ k từ tố đầu</b>, <b>lấy mẫu hạt nhân</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, hỏi mô hình cùng một câu hai lần, ta nhận hai câu trả lời khác nhau. Mô hình không đổi ý, nó trả về một phân phối xác suất trên từ tố kế tiếp. Cách ta chọn từ phân phối đó quyết định văn bản lặp đi lặp lại, sáng tạo, hay lan man. Hôm nay ta học bốn cách chọn từ tố, tham lam, nhiệt độ, giữ k từ tố đầu, và lấy mẫu hạt nhân."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: điểm thành xác suất, và chuẩn hoá lại"
    checks:
      - "[round(x, 3) for x in alg.softmax_t([2, 1, 0])] == [0.665, 0.245, 0.09] and round(0.665 / (0.665 + 0.245), 3) == 0.731"
    steps:
      - show: |
          <p><b>Ở bài 4</b>, hàm chuẩn hoá mũ biến điểm (2, 1, 0) thành xác suất (0,665; 0,245; 0,090) — lấy $e$ mũ từng điểm rồi chia tổng.</p>
        say: "Ở bài 4, hàm chuẩn hoá mũ biến ba điểm 2, 1 và 0 thành ba xác suất 0 phẩy 665, 0 phẩy 245 và 0 phẩy 09. Cách làm là lấy e mũ từng điểm rồi chia cho tổng."
      - show: |
          <p><b>Chuẩn hoá lại</b> sau khi bỏ bớt: chia mỗi số còn giữ cho <b>tổng các số còn giữ</b>.</p>
          $$\frac{0{,}665}{0{,}665 + 0{,}245} = \frac{0{,}665}{0{,}910} \approx 0{,}731$$
        focus: [1, 2]
        say: "Nếu bỏ bớt một từ tố, ta chuẩn hoá lại, chia mỗi số còn giữ cho tổng các số còn giữ. Ví dụ giữ hai số đầu, 0 phẩy 665 chia 0 phẩy 91 xấp xỉ 0 phẩy 731."

  - id: sym
    kind: symbol
    title: "Giải mã: bốn cách chọn"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>làm gì</th></tr>
          <tr><td><b>tham lam</b></td><td>luôn chọn từ tố xác suất cao nhất</td></tr>
          <tr><td><b>nhiệt độ</b> $T$</td><td>chia điểm cho $T$ trước hàm chuẩn hoá mũ: $p_i = \frac{e^{z_i / T}}{\sum_j e^{z_j / T}}$; $T \lt 1$ nhọn hơn, $T \gt 1$ phẳng hơn</td></tr>
          <tr><td><b>giữ k từ tố đầu</b> (top-k)</td><td>chỉ giữ $k$ từ tố xác suất cao nhất, chuẩn hoá lại rồi rút ngẫu nhiên</td></tr>
          <tr><td><b>lấy mẫu hạt nhân</b> (top-p)</td><td>giữ ít từ tố nhất có tổng xác suất ≥ $p$, chuẩn hoá lại rồi rút</td></tr></table>
        introduces: [ltgt, sum, exp]
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu bốn cách chọn. Tham lam luôn chọn từ tố có xác suất cao nhất. Nhiệt độ T chia điểm cho T trước hàm chuẩn hoá mũ, T nhỏ hơn 1 làm phân phối nhọn hơn, T lớn hơn 1 làm phẳng hơn. Giữ k từ tố đầu chỉ giữ k từ tố có xác suất cao nhất, chuẩn hoá lại rồi rút ngẫu nhiên. Lấy mẫu hạt nhân giữ ít từ tố nhất có tổng xác suất từ p trở lên, chuẩn hoá lại rồi rút."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Nhiệt độ: nhọn hay phẳng"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><g font-size="24" fill="#1f2937"><line x1="100" y1="270" x2="450" y2="270" stroke="#6b7280" stroke-width="2"/><rect x="120" y="79" width="80" height="191" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="160" y="298" text-anchor="middle">A</text><text x="160" y="71" text-anchor="middle" font-size="20">0,867</text><rect x="225" y="244" width="80" height="26" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="265" y="298" text-anchor="middle">B</text><text x="265" y="236" text-anchor="middle" font-size="20">0,117</text><rect x="330" y="266" width="80" height="4" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="370" y="298" text-anchor="middle">C</text><text x="370" y="258" text-anchor="middle" font-size="20">0,016</text><text x="270" y="330" text-anchor="middle" font-weight="bold">T = 0,5</text><line x1="570" y1="270" x2="920" y2="270" stroke="#6b7280" stroke-width="2"/><rect x="590" y="124" width="80" height="146" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="630" y="298" text-anchor="middle">A</text><text x="630" y="116" text-anchor="middle" font-size="20">0,665</text><rect x="695" y="216" width="80" height="54" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="735" y="298" text-anchor="middle">B</text><text x="735" y="208" text-anchor="middle" font-size="20">0,245</text><rect x="800" y="250" width="80" height="20" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="840" y="298" text-anchor="middle">C</text><text x="840" y="242" text-anchor="middle" font-size="20">0,09</text><text x="740" y="330" text-anchor="middle" font-weight="bold">T = 1</text><line x1="1040" y1="270" x2="1390" y2="270" stroke="#6b7280" stroke-width="2"/><rect x="1060" y="159" width="80" height="111" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="1100" y="298" text-anchor="middle">A</text><text x="1100" y="151" text-anchor="middle" font-size="20">0,506</text><rect x="1165" y="202" width="80" height="68" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="1205" y="298" text-anchor="middle">B</text><text x="1205" y="194" text-anchor="middle" font-size="20">0,307</text><rect x="1270" y="229" width="80" height="41" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="1310" y="298" text-anchor="middle">C</text><text x="1310" y="221" text-anchor="middle" font-size="20">0,186</text><text x="1210" y="330" text-anchor="middle" font-weight="bold">T = 2</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ phân phối của ba từ tố A, B, C ở ba nhiệt độ. Ở nhiệt độ 0 phẩy 5, cột A rất cao, gần như chắc chắn chọn A. Ở nhiệt độ 2, ba cột gần bằng nhau hơn, nên văn bản đa dạng hơn nhưng dễ chọn từ kém hơn."

  - id: example
    kind: example
    title: "Điểm (2, 1, 0) qua bốn cách"
    checks:
      - "[[round(x, 3) for x in alg.softmax_t([2, 1, 0], t)] for t in (1, 0.5, 2)] == [[0.665, 0.245, 0.09], [0.867, 0.117, 0.016], [0.506, 0.307, 0.186]]"
      - "(lambda p: [round(x / (p[0] + p[1]), 3) for x in p[:2]])(alg.softmax_t([2, 1, 0])) == [0.731, 0.269] and alg.top_p_keep(alg.softmax_t([2, 1, 0]), 0.9) == [0, 1]"
    steps:
      - show: |
          <table class="t"><tr><th>nhiệt độ</th><th>điểm chia T</th><th>A</th><th>B</th><th>C</th></tr>
          <tr><td>$T = 0{,}5$</td><td>(4, 2, 0)</td><td>0,867</td><td>0,117</td><td>0,016</td></tr>
          <tr><td>$T = 1$</td><td>(2, 1, 0)</td><td>0,665</td><td>0,245</td><td>0,090</td></tr>
          <tr><td>$T = 2$</td><td>(1; 0,5; 0)</td><td>0,506</td><td>0,307</td><td>0,186</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước một, chia điểm cho nhiệt độ rồi chuẩn hoá. Nhiệt độ 0 phẩy 5 nhân đôi điểm thành 4, 2, 0, và A chiếm 0 phẩy 867. Nhiệt độ 1 giữ nguyên điểm, A được 0 phẩy 665. Ở nhiệt độ 2, mọi điểm bị chia đôi, nên phân phối phẳng hơn, và A chỉ còn 0 phẩy 506."
      - clear: true
        show: |
          <p>Ở $T = 1$ — <b>bước 2, tham lam</b>: luôn chọn A (0,665 lớn nhất), mọi lần sinh ra cùng một câu.</p>
          <p><b>Bước 3, giữ 2 từ tố đầu</b>: A, B; chuẩn hoá lại → A = 0,731, B = 0,269; rút ngẫu nhiên theo hai số này.</p>
        focus: [1, 2]
        say: "Bước hai, ở nhiệt độ 1, cách tham lam luôn chọn A vì 0 phẩy 665 lớn nhất, nên mọi lần sinh ra cùng một câu. Bước ba, giữ 2 từ tố đầu là A và B, chuẩn hoá lại thành 0 phẩy 731 và 0 phẩy 269, rồi rút ngẫu nhiên theo hai số này."
      - show: |
          <table class="t"><tr><th>lấy mẫu hạt nhân, $p = 0{,}9$</th><th>tổng cộng dồn</th><th>đủ 0,9?</th></tr>
          <tr><td>A</td><td>0,665</td><td>chưa</td></tr>
          <tr><td>A + B</td><td>$\hl{0{,}910}$</td><td>đủ → giữ A, B, bỏ C</td></tr></table>
        introduces: [geq]
        focus: [1, "1.2", "1.3"]
        say: "Bước bốn, lấy mẫu hạt nhân với ngưỡng 0 phẩy 9, xếp từ tố theo xác suất giảm dần rồi cộng dồn. Chỉ A thì 0 phẩy 665, chưa đủ. Thêm B được 0 phẩy 91, đủ, nên giữ A và B và bỏ C."

  - id: check
    kind: check
    title: "Tự kiểm: mỗi hàng cộng bằng 1, và chia nhiệt độ là đổi điểm"
    checks:
      - "all(abs(sum(alg.softmax_t([2, 1, 0], t_)) - 1) < 1e-12 for t_ in (0.5, 1, 2))"
      - "[round(x, 3) for x in alg.softmax_t([4, 2, 0])] == [round(x, 3) for x in alg.softmax_t([2, 1, 0], 0.5)] == [0.867, 0.117, 0.016]"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách</th><th>kết quả</th></tr>
          <tr><td>hàng $T = 0{,}5$</td><td>0,867 + 0,117 + 0,016</td><td>1,000 ✓</td></tr>
          <tr><td>$T = 0{,}5$ với điểm (2, 1, 0)</td><td>tính thẳng điểm (4, 2, 0) ở $T = 1$</td><td>cùng (0,867; 0,117; 0,016) ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Mỗi hàng của bảng nhiệt độ phải cộng bằng 1, và hàng nhiệt độ 0 phẩy 5 cộng đúng bằng 1. Vì chia cho 0 phẩy 5 chính là nhân đôi điểm, tính thẳng điểm 4, 2, 0 ở nhiệt độ 1 cũng ra đúng ba số đó."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "[round(x, 3) for x in alg.softmax_t([5, 1, 0])] == [0.976, 0.018, 0.007] and alg.top_p_keep(alg.softmax_t([5, 1, 0]), 0.9) == [0]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng tham lam cho văn bản dài <b class="red">(lặp vòng)</b>
          <br><span class="note">Luôn chọn từ tố xác suất cao nhất dễ rơi vào vòng lặp câu chữ. Tham lam hợp với câu trả lời ngắn có một đáp án đúng; văn bản dài cần rút ngẫu nhiên có kiểm soát.</span></div>
        say: "Lỗi thứ nhất, dùng tham lam cho văn bản dài, nên dễ lặp vòng. Luôn chọn từ tố xác suất cao nhất dễ rơi vào vòng lặp câu chữ. Tham lam hợp với câu trả lời ngắn có một đáp án đúng, còn văn bản dài cần rút ngẫu nhiên có kiểm soát."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đặt k cố định cho mọi bước <b class="red">(quá rộng hoặc quá hẹp)</b>
          <br><span class="note">Khi mô hình rất chắc chắn, điểm (5, 1, 0) cho A = 0,976: giữ 2 từ tố vẫn để lọt B dù gần như sai. Lấy mẫu hạt nhân 0,9 chỉ giữ A — số từ tố được giữ tự co giãn theo độ chắc chắn.</span></div>
        say: "Lỗi thứ hai, đặt k cố định cho mọi bước, nên khi thì quá rộng, khi thì quá hẹp. Khi mô hình rất chắc chắn, với điểm 5, 1 và 0, A chiếm 0 phẩy 976, và giữ 2 từ tố vẫn để lọt B dù gần như sai. Lấy mẫu hạt nhân ngưỡng 0 phẩy 9 chỉ giữ A, vì số từ tố được giữ tự co giãn theo độ chắc chắn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tin nhiệt độ 0 là hoàn toàn lặp lại được <b class="red">(chưa chắc)</b>
          <br><span class="note">Về lý thuyết nhiệt độ 0 là tham lam. Thực tế, tính song song trên số dấu phẩy động có thể đổi thứ tự cộng, làm hai từ tố gần bằng điểm đổi chỗ — kết quả thỉnh thoảng vẫn khác giữa các lần chạy.</span></div>
        say: "Lỗi thứ ba, tin nhiệt độ 0 là hoàn toàn lặp lại được, điều này chưa chắc. Về lý thuyết nhiệt độ 0 là tham lam. Thực tế, tính song song trên số dấu phẩy động có thể đổi thứ tự cộng, làm hai từ tố gần bằng điểm đổi chỗ, nên kết quả thỉnh thoảng vẫn khác giữa các lần chạy."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(sum(alg.softmax_t([2, 1, 0], 0.5)[:2]), 3) == 0.984 and round(sum(alg.softmax_t([2, 1, 0], 2)[:2]), 3) == 0.814"
      - "alg.top_p_keep(alg.softmax_t([2, 1, 0], 0.5), 0.9) == [0, 1] and alg.top_p_keep(alg.softmax_t([2, 1, 0], 0.5), 0.85) == [0] and alg.top_p_keep(alg.softmax_t([2, 1, 0], 2), 0.9) == [0, 1, 2]"
    steps:
      - show: |
          <p>Điểm (2, 1, 0).</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ở $T = 0{,}5$, lấy mẫu hạt nhân $p = 0{,}9$ giữ những từ tố nào? Với $p = 0{,}85$ thì sao?</td></tr>
          <tr><td>2</td><td>Ở $T = 2$, $p = 0{,}9$ giữ mấy từ tố?</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, vẫn với điểm 2, 1 và 0. Câu một, ở nhiệt độ 0 phẩy 5, lấy mẫu hạt nhân ngưỡng 0 phẩy 9 giữ những từ tố nào? Với ngưỡng 0 phẩy 85 thì sao? Câu hai, ở nhiệt độ 2, ngưỡng 0 phẩy 9 giữ mấy từ tố? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>$T = 0{,}5$</th><th>cộng dồn</th><th>$p = 0{,}9$</th><th>$p = 0{,}85$</th></tr>
          <tr><td>A</td><td>0,867</td><td>chưa đủ</td><td>đủ → chỉ giữ <b>A</b></td></tr>
          <tr><td>A + B</td><td>0,984</td><td>đủ → giữ <b>A, B</b></td><td>—</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, cộng dồn ở nhiệt độ 0 phẩy 5. Chỉ A là 0 phẩy 867, chưa đủ ngưỡng 0 phẩy 9 nhưng đã đủ ngưỡng 0 phẩy 85, nên với ngưỡng 0 phẩy 85 chỉ giữ A. Thêm B được 0 phẩy 984, nên với ngưỡng 0 phẩy 9 giữ A và B."
      - show: |
          <p>② Ở $T = 2$: A + B $= 0{,}506 + 0{,}307 = 0{,}814 \lt 0{,}9$ → phải giữ cả <b>3</b>. Nhiệt độ cao và ngưỡng cao cùng làm văn bản đa dạng hơn.</p>
        introduces: [ltgt]
        say: "Câu hai, ở nhiệt độ 2, A cộng B chỉ được 0 phẩy 814, chưa tới 0 phẩy 9, nên phải giữ cả 3 từ tố. Nhiệt độ cao và ngưỡng cao cùng làm văn bản đa dạng hơn."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mô hình cho phân phối</span><span class="a">→</span>
          <span class="n">nhiệt độ: nhọn hay phẳng</span><span class="a">→</span>
          <span class="n">cắt đuôi: k cố định hoặc tổng ≥ p</span><span class="a">→</span>
          <span class="n">tham lam cho đáp án ngắn, rút mẫu cho văn bản dài</span></div>
        say: "Tổng kết lại, mô hình cho một phân phối. Nhiệt độ làm phân phối nhọn hay phẳng, rồi ta cắt đuôi bằng k cố định hoặc bằng tổng xác suất. Tham lam hợp cho đáp án ngắn, còn rút mẫu hợp cho văn bản dài."
      - show: |
          <div class="box key"><b>Tư duy:</b> “mô hình nói gì” là kết quả của <b>mô hình</b> cộng với <b>cách chọn</b> — đổi cách chọn là đổi hành vi, không cần huấn luyện lại.</div>
        say: "Điều cần mang theo, điều mô hình nói ra là kết quả của mô hình cộng với cách chọn, và đổi cách chọn là đổi hành vi mà không cần huấn luyện lại."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): <b>tinh chỉnh</b> — toàn bộ tham số và hạng thấp.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta học tinh chỉnh, cập nhật toàn bộ tham số hay chỉ một phần hạng thấp. Hẹn gặp bạn ở bài tiếp theo."
