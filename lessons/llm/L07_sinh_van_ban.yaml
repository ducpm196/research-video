      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ phân phối của ba từ tố A, B, C ở ba nhiệt độ. Ở nhiệt độ 0 phẩy 5, cột A rất cao, gần như chắc chắn chọn
      A. Ở nhiệt độ 2, ba cột gần bằng nhau hơn, nên văn bản đa dạng hơn nhưng dễ chọn từ kém hơn. Quan sát ba cột xác suất
      biến hình theo nhiệt độ làm sáng tỏ cách nhiệt độ cao nhường cơ hội cho các từ tố lạ xuất hiện.
- id: example
  kind: example
  title: Điểm (2, 1, 0) qua bốn cách
  checks:
