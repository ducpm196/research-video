id: L05
course: LLM
series: "LLM · Mô hình ngôn ngữ lớn"
title: "Bài 5 — Chi phí tính toán: tham số, phép tính và bộ nhớ đệm khoá–giá trị"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/llm.yaml L05; audit/llm/verify_llm.py L05; J. Kaplan và cộng sự, Scaling Laws for Neural Language Models (2020) — số tham số ≈ 12·L·d² cho phần thân, ≈ 2 phép tính mỗi tham số mỗi từ tố khi suy luận; R. Pope và cộng sự, Efficiently Scaling Transformer Inference (2022) — bộ nhớ đệm khoá–giá trị, giới hạn băng thông; J. Ainslie và cộng sự, GQA (2023); MLO bài 11 (lượng tử hoá); CS115 bài 41 (truy vấn, khoá, giá trị)"
assumes: [arith, cdot, power, approx, frac]
# Quy ước: L tầng, chiều d, ngữ cảnh n từ tố, 2 byte mỗi số (fp16). Bộ nhớ đệm khoá–giá trị = 2 · L · d · n · 2 byte cho MỖI chuỗi
#   (alg.kv_cache_bytes), giả định mọi đầu chú ý đều có khoá, giá trị riêng; kiểu chia sẻ khoá giữa nhiều đầu (GQA) làm nhỏ hơn.
#   Tham số phần thân ≈ 12 · L · d² (bỏ qua bảng nhúng, độ lệch, chuẩn hoá). Suy luận ≈ 2 phép tính mỗi tham số mỗi từ tố (nhân + cộng).
#   Băng thông 1 TB/s và 300 nghìn tỉ phép tính/s là SỐ MINH HOẠ (bậc độ lớn của một thẻ tính toán hiện nay), ghi rõ trên màn hình.
#   GB = 10⁹ byte, GiB = 2³⁰ byte; lời đọc nói “đơn vị nhị phân” cho GiB (lexicon LLM chưa dò GiB). ms = mili giây.
# Độ sâu (pedagogy.md luật 22, viết lại 2026-10-31 từ bản 6 phân cảnh 4,4 phút): ôn nền → hình cơ chế → suy công thức từng bước →
#   ví dụ từng phép tính → tự kiểm độc lập → lỗi (có lỗi chuyên gia: gộp lô không chia sẻ bộ nhớ đệm) → quiz quyết định → chuỗi logic.
objectives:
  - "Suy ra số tham số 12 · L · d² từ cấu trúc một tầng"
  - "Tính bộ nhớ đệm khoá–giá trị cho một chuỗi và cho nhiều chuỗi"
  - "Giải thích bằng số vì sao sinh từng từ bị giới hạn bởi băng thông bộ nhớ, không phải phép tính"
  - "Quyết định một thẻ tính toán phục vụ được bao nhiêu chuỗi cùng lúc"
