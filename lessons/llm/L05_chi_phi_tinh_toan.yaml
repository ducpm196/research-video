  # ───────────────────────── 5. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra hai công thức từ cấu trúc một tầng"
    checks:
      - "4 * 4096 ** 2 + 2 * (4096 * 4 * 4096) == 12 * 4096 ** 2"
      - "4 * 2 ** 2 + 2 * (2 * 4 * 2) == 48 == 12 * 2 ** 2"
      - "2 * 4096 * 32 == 262144 and 262144 * 2 == 524288 == 2 ** 19"
    steps:
      - show: |
          <p><b>Bước 1 — phần chú ý.</b> Mỗi tầng có 4 ma trận $d \times d$: tạo truy vấn, tạo khoá, tạo giá trị, và trộn đầu ra. Vì mỗi ma trận có $d^2$ số:</p>
          $$4 \cdot d^2$$
        focus: [1, 1, 2]
        say: "Bước một là phần chú ý. Mỗi tầng có 4 ma trận cỡ d nhân d, dùng để tạo truy vấn, tạo khoá, tạo giá trị, và trộn đầu ra. Vì mỗi ma trận có d bình phương số, phần chú ý có 4 d bình phương tham số."
      - show: |
          <p><b>Bước 2 — khối truyền thẳng.</b> Hai ma trận: phóng $d \to 4d$ rồi thu $4d \to d$. Mỗi ma trận có $d \cdot 4d = 4d^2$ số, nên hai ma trận:</p>
          $$2 \cdot 4d^2 = 8 \cdot d^2$$
        focus: [1, 2]
        say: "Bước hai là khối truyền thẳng, gồm hai ma trận, một cái phóng từ d lên 4d, một cái thu từ 4d về d. Mỗi ma trận có d nhân 4d, tức 4 d bình phương số, nên hai ma trận có 8 d bình phương."
      - clear: true
        show: |
          <p><b>Bước 3 — cộng rồi nhân số tầng.</b> Một tầng: $4d^2 + 8d^2 = 12 \cdot d^2$. Theo $L$ tầng giống nhau:</p>
          $$\text{tham số} \approx \hlg{12 \cdot L \cdot d^2}$$
          <p class="note">Làm thử với $d = 2$: $4 \cdot 4 + 2 \cdot 16 = 48 = 12 \cdot 4$ ✓. Dấu xấp xỉ vì bỏ qua bảng nhúng và vài vector nhỏ.</p>
        focus: [1, 2, 3, 3]
        say: "Bước ba, cộng hai phần được 12 d bình phương cho một tầng, rồi nhân với L tầng giống nhau. Vậy số tham số xấp xỉ 12 nhân L nhân d bình phương. Làm thử với d bằng 2, phần chú ý có 16 số, khối truyền thẳng có 32 số, tổng 48, đúng bằng 12 nhân 4. Dấu xấp xỉ là vì ta bỏ qua bảng nhúng và vài vector nhỏ."
      - clear: true
        show: |
          <p><b>Bước 4 — bộ nhớ đệm.</b> Mỗi từ tố cũ, ở mỗi tầng, để lại 1 khoá + 1 giá trị, mỗi cái $d$ số. Nhân lần lượt theo tầng, theo số từ tố, theo byte mỗi số:</p>
          $$\text{bộ nhớ đệm} = \hlb{2} \cdot L \cdot d \cdot n \cdot 2 \text{ byte cho mỗi chuỗi}$$
          <p class="note">Số 2 đầu: khoá và giá trị. Số 2 cuối: 2 byte mỗi số. Làm thử, một từ tố của mô hình ví dụ: $2 \cdot 32 \cdot 4096 \cdot 2 = 524\,288$ byte.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Bước bốn là bộ nhớ đệm. Mỗi từ tố cũ, ở mỗi tầng, để lại một khoá và một giá trị, mỗi cái có d số. Nhân lần lượt theo số tầng, số từ tố, và số byte mỗi số, ta được 2 nhân L nhân d nhân n nhân 2 byte cho mỗi chuỗi. Số 2 đầu là khoá và giá trị, số 2 cuối là 2 byte mỗi số. Làm thử với một từ tố của mô hình ví dụ, 2 nhân 32 nhân 4096 nhân 2 bằng 524 nghìn 288 byte."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Mô hình 32 tầng, chiều 4096, từng phép tính"
    checks:
      - "12 * 32 * 4096 ** 2 == 6442450944"
      - "12 * 32 * 4096 ** 2 * 2 == 12884901888 == 12 * 2 ** 30"
      - "alg.kv_cache_bytes(32, 4096, 4096) == 524288 * 4096 == 2147483648 == 2 * 2 ** 30"
      - "alg.kv_cache_bytes(32, 4096, 4096, batch=16) == 34359738368 > 12884901888"
    steps:
      - show: |
          <p>① Tham số: $12 \cdot 32 \cdot 4096^2 = 6\,442\,450\,944 \approx \hlb{6{,}44}$ tỉ.</p>
        say: "Phép tính thứ nhất, số tham số bằng 12 nhân 32 nhân 4096 bình phương, bằng 6 tỉ 442 triệu 450 nghìn 944, khoảng 6 phẩy 44 tỉ."
      - show: |
          <p>① Tham số: $12 \cdot 32 \cdot 4096^2 \approx 6{,}44$ tỉ.</p>
          <p>② Trọng số, 2 byte mỗi số: $6{,}44 \text{ tỉ} \cdot 2 \approx \hlb{12{,}9}$ GB.</p>
        focus: [2, 2]
        say: "Phép tính thứ hai, mỗi tham số chiếm 2 byte, nên trọng số chiếm khoảng 12 phẩy 9 GB. Con số này đúng bằng 12 đơn vị nhị phân."
      - show: |
          <p>① Tham số $\approx 6{,}44$ tỉ. ② Trọng số $\approx 12{,}9$ GB.</p>
          <p>③ Bộ nhớ đệm, một chuỗi 4096 từ tố: $524\,288 \cdot 4096 = 2\,147\,483\,648$ byte $\approx \hlo{2{,}15}$ GB.</p>
        focus: [2, 2]
        say: "Phép tính thứ ba, một từ tố cần 524 nghìn 288 byte, nên một chuỗi 4096 từ tố cần 2 tỉ 147 triệu byte, khoảng 2 phẩy 15 GB. Đây đúng bằng 2 đơn vị nhị phân."
      - show: |
          <table class="t"><tr><th>phần</th><th>dung lượng</th></tr>
          <tr><td>trọng số (dùng chung)</td><td>12,9 GB</td></tr>
          <tr><td>bộ nhớ đệm, 1 chuỗi</td><td>2,15 GB</td></tr>
          <tr><td>bộ nhớ đệm, 16 chuỗi</td><td>$16 \cdot 2{,}15 \approx \hl{34{,}4}$ GB</td></tr></table>
          <p class="note">Với 16 người dùng ngữ cảnh đầy, bộ nhớ đệm lớn khoảng 2,7 lần trọng số.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Phép tính thứ tư, đặt cạnh nhau. Trọng số 12 phẩy 9 GB được mọi người dùng chung. Một chuỗi cần thêm 2 phẩy 15 GB bộ nhớ đệm. Mười sáu chuỗi cần khoảng 34 phẩy 4 GB, vì mỗi người có ngữ cảnh riêng. Vậy với 16 người dùng ngữ cảnh đầy, bộ nhớ đệm lớn khoảng hai phẩy bảy lần trọng số."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: tính theo đường khác, và hỏi phép tính hay băng thông"
    checks:
      - "2 * 32 * 4096 * 4096 * 2 == alg.kv_cache_bytes(32, 4096, 4096)"
      - "round(12884901888 / 1e12 * 1e3, 1) == 12.9 and round(2 * 6442450944 / 300e12 * 1e3, 3) == 0.043"
      - "round((12884901888 / 1e12) / (2 * 6442450944 / 300e12)) == 300"
    steps:
      - show: |
          <p><b>Đường khác:</b> vì công thức chỉ là một tích, nhân thẳng $2 \cdot 32 \cdot 4096 \cdot 4096 \cdot 2 = 2\,147\,483\,648$ byte — khớp kết quả ③ ✓.</p>
        say: "Kiểm tra thứ nhất, vì công thức chỉ là một tích nên ta nhân thẳng, 2 nhân 32 nhân 4096 nhân 4096 nhân 2, cũng được 2 tỉ 147 triệu byte, khớp kết quả phép tính thứ ba."
      - show: |
          <table class="t"><tr><th>mỗi từ tố mới</th><th>khối lượng</th><th>tốc độ (minh hoạ)</th><th>thời gian</th></tr>
          <tr><td>đọc trọng số</td><td>12,9 GB</td><td>1 TB/s</td><td>$\hl{12{,}9}$ ms</td></tr>
          <tr><td>tính: 2 phép mỗi tham số</td><td>12,9 tỉ phép</td><td>300 nghìn tỉ phép/s</td><td>$0{,}043$ ms</td></tr></table>
          <p class="note">Đọc chậm hơn tính khoảng <b>300 lần</b> → sinh từng từ bị giới hạn bởi <b>băng thông</b>.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Kiểm tra thứ hai trả lời câu hỏi chậm vì đâu. Mỗi tham số cần một phép nhân và một phép cộng, nên một từ tố mới cần khoảng 12 phẩy 9 tỉ phép tính. Đọc 12 phẩy 9 GB trọng số mất 12 phẩy 9 mi li giây, còn tính chỉ mất 0 phẩy 043 mi li giây. Việc đọc chậm hơn khoảng 300 lần, nên giới hạn là băng thông."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "round(1e12 / 12884901888) == 78 and (2 * 6442450944 / 300e12) / (12884901888 / 1e12) < 0.01"
      - "round(1e12 / (12884901888 + 16 * 2147483648) * 16) == 339 and 16 * 78 == 1248"
      - "alg.kv_cache_bytes(32, 4096, 32768) == 8 * alg.kv_cache_bytes(32, 4096, 4096) and alg.kv_cache_bytes(32, 1024, 4096) * 4 == alg.kv_cache_bytes(32, 4096, 4096)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Mua thẻ nhiều phép tính hơn để sinh nhanh hơn <b class="red">(thật ra thiếu băng thông)</b>
          <br><span class="note">Một chuỗi: tối đa $\frac{10^{12}}{12{,}9 \cdot 10^9} \approx 78$ từ tố/giây, dù khối tính rảnh hơn 99% thời gian.</span></div>
        say: "Lỗi thứ nhất, mua thẻ có nhiều phép tính hơn để sinh nhanh hơn, trong khi thật ra thiếu băng thông. Với một chuỗi, mỗi giây đọc được trọng số khoảng 78 lần, nên tối đa khoảng 78 từ tố mỗi giây, dù khối tính rảnh gần hết."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ gộp 16 chuỗi thì nhanh gấp 16 <b class="red">(bộ nhớ đệm không dùng chung)</b>
          <br><span class="note">Mỗi bước đọc trọng số MỘT lần cho cả lô, nhưng đọc bộ nhớ đệm của TỪNG chuỗi.</span></div>
          <table class="t"><tr><th>mỗi bước, ngữ cảnh đầy</th><th>phải đọc</th><th>từ tố/giây cả lô</th></tr>
          <tr><td>tưởng tượng: 16 lần một chuỗi</td><td>12,9 GB</td><td>16 nhân 78 = 1248</td></tr>
          <tr><td>thật: trọng số + 16 bộ nhớ đệm</td><td>12,88 + 34,36 ≈ 47,2 GB</td><td>khoảng 21 bước/giây nhân 16 ≈ <b>339</b></td></tr></table>
        focus: [1, 1, "2.3", 0]
        say: "Lỗi thứ hai, nghĩ gộp 16 chuỗi thì nhanh gấp 16. Mỗi bước chỉ đọc trọng số một lần cho cả lô, nhưng phải đọc bộ nhớ đệm của từng chuỗi. Khi mọi chuỗi dùng hết 4096 từ tố, mỗi bước đọc khoảng 47 GB, được khoảng 339 từ tố mỗi giây cho cả lô, không phải 1248. Gộp lô vẫn có lợi, nhưng ít hơn người ta tưởng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên bộ nhớ đệm tăng theo ngữ cảnh <b class="red">(tràn bộ nhớ)</b>
          <br><span class="note">Ngữ cảnh 32 768 từ tố: bộ nhớ đệm gấp 8, khoảng 17,2 GB mỗi chuỗi. Phép chú ý thường chia thành nhiều <b>đầu chú ý</b> chạy song song, mỗi đầu một bộ truy vấn, khoá, giá trị nhỏ; cho nhiều đầu dùng chung khoá và giá trị (chỉ giữ 1/4 số bộ) thì bộ nhớ đệm còn 1/4 (Ainslie và cộng sự, 2023).</span></div>
        say: "Lỗi thứ ba, quên rằng bộ nhớ đệm tăng theo ngữ cảnh. Ngữ cảnh 32 nghìn 768 từ tố làm bộ nhớ đệm gấp 8, khoảng 17 phẩy 2 GB mỗi chuỗi. Phép chú ý thường được chia thành nhiều đầu chú ý chạy song song, mỗi đầu có một bộ truy vấn, khoá và giá trị nhỏ. Nếu cho nhiều đầu dùng chung khoá và giá trị, chỉ giữ một phần tư số bộ, thì bộ nhớ đệm còn một phần tư."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Lẫn GB và GiB <b class="red">(lệch 7%)</b>
          <br><span class="note">2 GiB ≈ 2,15 GB. Thẻ ghi “80 GB” hay “80 GiB” khác nhau gần 6 GB — ghi rõ đơn vị trước khi kết luận “vừa”.</span></div>
        say: "Lỗi thứ tư, lẫn đơn vị thập phân với đơn vị nhị phân, lệch nhau khoảng 7 phần trăm. Hai đơn vị nhị phân là khoảng 2 phẩy 15 GB. Ở mức 80, hai cách ghi khác nhau gần 6 GB, nên hãy ghi rõ đơn vị trước khi kết luận là vừa."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: một thẻ 80 GB phục vụ được mấy chuỗi?"
    checks:
      - "12 * 40 * 5120 ** 2 == 12582912000 and round(12 * 40 * 5120 ** 2 * 2 / 1e9, 1) == 25.2"
      - "alg.kv_cache_bytes(40, 5120, 8192) == 6710886400 and round(alg.kv_cache_bytes(40, 5120, 8192) / 1e9, 2) == 6.71"
      - "int((80e9 - 12 * 40 * 5120 ** 2 * 2) // alg.kv_cache_bytes(40, 5120, 8192)) == 8"
      - "12 * 40 * 5120 ** 2 * 2 + 8 * 6710886400 <= 80e9 < 12 * 40 * 5120 ** 2 * 2 + 9 * 6710886400"
    steps:
      - show: |
          <p>Mô hình 40 tầng, chiều 5120, ngữ cảnh 8192 từ tố, 2 byte mỗi số; thẻ có 80 GB.</p>
          <ol><li>Số tham số và dung lượng trọng số?</li>
          <li>Bộ nhớ đệm cho một chuỗi?</li>
          <li>Thẻ phục vụ tối đa bao nhiêu chuỗi ngữ cảnh đầy cùng lúc?</li></ol>
        focus: [0, 1, "2.1", "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn. Mô hình có 40 tầng, chiều 5120, ngữ cảnh 8192 từ tố, 2 byte mỗi số, và thẻ có 80 GB. Câu một, số tham số và dung lượng trọng số là bao nhiêu? Câu hai, bộ nhớ đệm cho một chuỗi là bao nhiêu? Câu ba, thẻ phục vụ tối đa bao nhiêu chuỗi ngữ cảnh đầy cùng lúc? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p class="note">40 tầng, chiều 5120, ngữ cảnh 8192, 2 byte mỗi số, thẻ 80 GB.</p>
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>① tham số</td><td>$12 \cdot 40 \cdot 5120^2$</td><td>≈ 12,6 tỉ</td></tr>
          <tr><td>① trọng số</td><td>12,6 tỉ nhân 2 byte</td><td>$\approx \hlb{25{,}2}$ GB</td></tr>
          <tr><td>② bộ nhớ đệm</td><td>$2 \cdot 40 \cdot 5120 \cdot 8192 \cdot 2$</td><td>$\approx \hlo{6{,}71}$ GB</td></tr></table>
        focus: ["2.3", "2.4"]
        say: "Đáp án câu một, 12 nhân 40 nhân 5120 bình phương, khoảng 12 phẩy 6 tỉ tham số, nhân 2 byte được khoảng 25 phẩy 2 GB. Câu hai, 2 nhân 40 nhân 5120 nhân 8192 nhân 2 bằng 6 tỉ 710 triệu 886 nghìn 400 byte, khoảng 6 phẩy 71 GB."
      - clear: true
        show: |
          <p>③ Chỗ còn lại: $80 - 25{,}2 = 54{,}8$ GB. Chia cho 6,71 GB mỗi chuỗi được 8,17 → tối đa <b>$\hlg{8}$ chuỗi</b>.</p>
          <table class="t"><tr><th>thử lại</th><th>tổng bộ nhớ</th><th>80 GB</th></tr>
          <tr><td>8 chuỗi</td><td>$25{,}2 + 8 \cdot 6{,}71 \approx 78{,}9$</td><td>vừa</td></tr>
          <tr><td>9 chuỗi</td><td>$25{,}2 + 9 \cdot 6{,}71 \approx 85{,}6$</td><td class="red">không vừa</td></tr></table>
          <p class="note">Muốn nhiều hơn: ngữ cảnh ngắn hơn, chia sẻ khoá, hoặc lượng tử hoá. Thực tế nhỏ hơn 8, vì còn phải chừa bộ nhớ tạm cho phép tính.</p>
        focus: [1, 2, 3]
        say: "Câu ba, chỗ còn lại là 80 trừ 25 phẩy 2, bằng 54 phẩy 8 GB, chia cho 6 phẩy 71 được 8 phẩy 17, nên tối đa 8 chuỗi. Thử lại, 8 chuỗi dùng khoảng 78 phẩy 9 GB, vừa, còn 9 chuỗi cần khoảng 85 phẩy 6 GB, không vừa. Muốn phục vụ nhiều hơn, hãy rút ngắn ngữ cảnh, chia sẻ khoá, hoặc lượng tử hoá, còn con số thật nhỏ hơn 8 vì phải chừa bộ nhớ tạm cho phép tính."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">một tầng: 4 d² + 8 d²</span><span class="a">→</span>
          <span class="n">tham số ≈ 12 L d²</span><span class="a">→</span>
          <span class="n">bộ nhớ đệm = 2 L d n số, 2 byte mỗi số, mỗi chuỗi</span><span class="a">→</span>
          <span class="n">mỗi bước đọc hết trọng số + bộ nhớ đệm</span><span class="a">→</span>
          <span class="n">băng thông quyết định tốc độ</span></div>
        say: "Tổng kết lại, một tầng có 4 d bình phương tham số chú ý và 8 d bình phương tham số truyền thẳng, nên tổng xấp xỉ 12 L d bình phương. Bộ nhớ đệm bằng 2 L d n nhân 2 byte cho mỗi chuỗi. Mỗi bước sinh đọc hết trọng số và bộ nhớ đệm, nên băng thông quyết định tốc độ."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi chọn mô hình hay mua phần cứng, tính <b>bộ nhớ</b> và <b>số byte phải đọc mỗi bước</b> cho đúng số người dùng và độ dài ngữ cảnh thật.</div>
        say: "Điều cần mang theo, trước khi chọn mô hình hay mua phần cứng, hãy tính bộ nhớ và số byte phải đọc mỗi bước cho đúng số người dùng và độ dài ngữ cảnh thật."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>huấn luyện trước</b> — mất mát entropy chéo và quy luật mở rộng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học huấn luyện trước, với mất mát entropy chéo và quy luật mở rộng. Hẹn gặp bạn ở bài tiếp theo."
