scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mô hình vừa bộ nhớ, nhưng 16 người dùng thì không"
    checks:
      - "alg.kv_cache_bytes(32, 4096, 4096, batch=16) == 32 * 2 ** 30"
      - "round(12 * 32 * 4096 ** 2 / 1e9, 1) == 6.4 and round(12 * 32 * 4096 ** 2 * 2 / 1e9) == 13 and round(32 * 2 ** 30 / 1e9) == 34"
    steps:
      - show: |
          <p>Một mô hình khoảng 6,4 tỉ tham số chiếm gần 13 GB ở dạng 2 byte mỗi số — vừa một thẻ tính toán. Nhưng phục vụ 16 người dùng cùng lúc, mỗi người ngữ cảnh 4096 từ tố, lại cần thêm khoảng <b>34 GB</b> chỉ để nhớ khoá và giá trị của các từ tố đã đọc.</p>
          <div class="box key">Hôm nay ta trả lời ba câu hỏi: con số 6,4 tỉ từ đâu ra? 34 GB kia là gì? Và vì sao mô hình sinh chữ chậm dù thẻ tính rất nhanh?</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một mô hình khoảng 6 phẩy 4 tỉ tham số chiếm gần 13 GB ở dạng 2 byte mỗi số, vừa một thẻ tính toán. Nhưng phục vụ 16 người dùng cùng lúc, mỗi người ngữ cảnh 4096 từ tố, lại cần thêm khoảng 34 tỉ byte chỉ để nhớ khoá và giá trị của các từ tố đã đọc. Hôm nay ta trả lời ba câu hỏi, con số 6 phẩy 4 tỉ từ đâu ra, 34 tỉ byte kia là gì, và vì sao mô hình sinh chữ chậm dù thẻ tính rất nhanh."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "3 * 4 == 12 and 2 * 3 * 4 == 24"
      - "2 * 6 == 12 and 10 ** 9 == 1000000000 and 2 ** 30 == 1073741824"
    steps:
      - show: |
          <p><b>① Ma trận $a$ hàng $b$ cột có $a \cdot b$ số.</b> Ma trận 3 × 4 có $3 \cdot 4 = 12$ số. Mỗi số là một <b>tham số</b> mô hình học được.</p>
        say: "Điều thứ nhất, một ma trận a hàng b cột có a nhân b số. Ví dụ ma trận 3 hàng 4 cột có 12 số, và mỗi số là một tham số mà mô hình học được."
      - show: |
          <p><b>② Chú ý:</b> mỗi từ tố có ba vector — <b>truy vấn</b> (điều nó đang tìm), <b>khoá</b> (điều nó có), <b>giá trị</b> (điều nó đóng góp). Từ tố mới so truy vấn của nó với khoá của mọi từ tố trước, rồi trộn các giá trị.</p>
          <p><b>Sinh từng từ</b> (bài 4): đoán một từ tố, thêm vào cuối, rồi đoán tiếp; mặt nạ nhân quả cho mỗi vị trí chỉ nhìn các vị trí trước nó.</p>
        focus: [1, 1, 2, 2]
        say: "Điều thứ hai, trong phép chú ý, mỗi từ tố có ba vector, truy vấn là điều nó đang tìm, khoá là điều nó có, và giá trị là điều nó đóng góp. Từ tố mới so truy vấn của nó với khoá của mọi từ tố trước, rồi trộn các giá trị. Ở bài 4, ta đã thấy mô hình sinh từng từ, đoán một từ tố, thêm vào cuối, rồi đoán tiếp. Mặt nạ nhân quả cho mỗi vị trí chỉ nhìn các vị trí trước nó."
      - clear: true
        show: |
          <p><b>③ Đơn vị bộ nhớ.</b> <b>Byte</b> là ô nhớ nhỏ nhất, chứa một số từ 0 tới 255. Một số ở dạng nửa độ chính xác chiếm <b>2 byte</b>: 6 số chiếm $2 \cdot 6 = 12$ byte.</p>
          <table class="t"><tr><th>đơn vị</th><th>bằng</th></tr>
          <tr><td>1 GB</td><td>$10^9$ = 1 000 000 000 byte</td></tr>
          <tr><td>1 GiB (đơn vị nhị phân)</td><td>$2^{30}$ = 1 073 741 824 byte</td></tr>
          <tr><td>1 TB/s (tốc độ đọc)</td><td>$10^{12}$ byte mỗi giây</td></tr>
          <tr><td>1 ms (mili giây)</td><td>một phần nghìn giây</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Điều thứ ba là đơn vị bộ nhớ. Byte là ô nhớ nhỏ nhất, chứa một số từ 0 tới 255. Một số ở dạng nửa độ chính xác chiếm 2 byte, nên 6 số chiếm 12 byte. Một GB là 10 mũ 9 byte. Còn một đơn vị nhị phân là 2 mũ 30 byte, lớn hơn khoảng 7 phần trăm. Tốc độ đọc ghi trên màn hình là số byte đọc được mỗi giây, ở đây là 10 mũ 12 byte mỗi giây. Một mi li giây là một phần nghìn giây."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: L, d, n"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>mô hình ví dụ</th></tr>
          <tr><td>$L$</td><td>số tầng chồng lên nhau</td><td>32</td></tr>
          <tr><td>$d$</td><td>chiều của vector ở mỗi vị trí</td><td>4096</td></tr>
          <tr><td>$n$</td><td>độ dài ngữ cảnh, tính bằng từ tố</td><td>4096</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", 1]
        say: "Bài dùng ba chữ cái. L là số tầng chồng lên nhau, mô hình ví dụ có 32 tầng. d là chiều của vector ở mỗi vị trí, ở đây là 4096. n là độ dài ngữ cảnh tính bằng từ tố, ở đây cũng là 4096. Giữ ba con số này, ta sẽ dùng lại suốt bài."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
