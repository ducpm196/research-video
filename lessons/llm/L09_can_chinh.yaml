    - '1.2'
    - '1.3'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp (1 dòng)</b></p><div class="code"><div>bt_prob=0.818 bt_loss=0.201</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>math (exp, log)</code></td><td>Nạp hàm toán học chuẩn (lượng giác, hàm ngược góc, đổi radian ra độ, lôgarit, lũy thừa)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{:.3f}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo để bạn tự đối chiếu cách viết.
    clear: true
  - show: <p><b>Lời giải tham khảo LLM:L09 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>import math</div><div>p = 1.0 / (1.0 + math.exp(-1.5))</div><div>loss = -math.log(p)</div><div>print(f"bt_prob={p:.3f} bt_loss={loss:.3f}")</div></div>
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">huấn luyện trước: đoán chữ</span><span class="a">→</span>
      <span class="n">học theo chỉ dẫn: ví dụ mẫu</span><span class="a">→</span>
      <span class="n">căn chỉnh: so sánh cặp, điểm phần thưởng</span><span class="a">→</span>
      <span class="n">phạt khi đi xa, đo độ đúng riêng</span></div>
    say: Tổng kết lại, huấn luyện trước dạy đoán chữ, học theo chỉ dẫn dùng ví dụ mẫu, và căn chỉnh dùng so sánh cặp với điểm phần thưởng. Cần phạt khi đi quá xa mô hình ban đầu, và đo độ đúng riêng. Một mô hình ngôn ngữ đi qua ba nấc từ học đoán tiếp trên kho văn bản khổng lồ tới học theo chỉ dẫn mẫu. Nấc cuối là căn chỉnh phản hồi theo lựa chọn con người. Tại bước học mô hình phần thưởng theo cặp so sánh, xác suất câu thắng được đẩy lên bằng hàm xích-ma trên hiệu điểm thưởng giữa hai đáp án. Tuy nhiên nếu chỉ tối đa hoá thô điểm phần thưởng mà thả phanh trọng số, mô hình chính sách sẽ học cách khai thác kẽ hở bằng câu chữ dài dòng sáo rỗng. Thêm thành phần phạt độ lệch giữ mô hình mới không trôi quá xa bản trước đó giúp bảo toàn năng lực ngôn ngữ tự nhiên đã học. Chú ý luôn kiểm định chất lượng thực tế độc lập bằng bộ đánh giá riêng thay vì tin tuyệt đối vào chính mô hình chấm phần thưởng. Sự kết hợp giữa học theo cặp chỉ dẫn rõ ràng và ràng buộc độ lệch tránh trôi xa mô hình khởi điểm tạo nên trục xương sống của quá trình căn chỉnh hiện đại. Luôn đối chiếu điểm phần thưởng với kiểm tra định tính trên người dùng thật để chặn sớm hiện tượng chạy theo chỉ số. Học có giám sát theo chỉ dẫn giúp mô hình quen cấu trúc hỏi đáp chuẩn xác hơn. Tuy nhiên, nó vẫn khó phân biệt hai câu trả lời cùng trôi chảy nhưng khác mức hữu ích và an toàn. Dữ liệu so sánh theo cặp cho phép chuyển đánh giá con người thành độ lệch xác suất rõ ràng. Mô hình chấm điểm học từ cặp thắng thua này để ước lượng mức độ vừa ý người dùng. Khi tối ưu theo bộ chấm đó, ràng buộc phạt độ lệch giữ câu trả lời không đi quá xa mô hình ban đầu. Nhờ vậy hệ thống tránh sa vào lối viết sáo rỗng hay kéo dài câu để câu điểm giả. Đánh giá độc lập với người dùng thật hoặc bộ đề riêng luôn là bước chốt chặn bắt buộc trước khi phát hành.
  - show: |
      <div class="box key"><b>Tư duy:</b> khi một thước đo trở thành mục tiêu tối ưu, nó thôi là thước đo tốt — hãy luôn có một phép đo <b>độc lập</b>.</div>
      <p class="note"><b>Hai mức quy mô:</b> Từ 1 cặp phản hồi Bradley–Terry tính tay tới tập căn chỉnh hàng trăm nghìn cặp sở thích: RLHF/DPO làm mô hình theo đúng ý người nhưng tối ưu quá tay dễ kích hoạt lỗi thổi phồng điểm thưởng.</p>
    say: Điều cần mang theo, khi một thước đo trở thành mục tiêu tối ưu, nó thôi là thước đo tốt, nên hãy luôn có một phép đo độc lập. Từ 1 cặp phản hồi tính tay tới hàng trăm nghìn cặp sở thích. Căn chỉnh quá mạnh theo điểm chấm dễ làm mô hình sinh câu lạ đánh lừa bộ chấm.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: |
      <p class="note">Bài sau (bài 10): <b>đánh giá mô hình ngôn ngữ</b> — bộ kiểm tra, nhiễm dữ liệu, khoảng tin cậy.</p>
    forward_ref: true
    say: Ở bài sau, bài 10, ta học đánh giá mô hình ngôn ngữ, với bộ kiểm tra, nhiễm dữ liệu, và khoảng tin cậy. Hẹn gặp bạn ở bài tiếp theo.
