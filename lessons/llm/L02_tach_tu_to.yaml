scenes:
- id: hook
  kind: hook
  title: 'Từ chưa từng gặp: “lowest”'
  checks:
  - 'alg.bpe_encode(''lowest'', [p for p, _ in alg.bpe_merges({''l o w </w>'': 5, ''l o w e r </w>'': 2, ''n e w e s t </w>'':
    6, ''w i d e s t </w>'': 3}, 5)[0]]) == [''low'', ''est</w>'']'
  steps:
  - show: '<p>Kho học có “low”, “lower”, “newest”, “widest” — nhưng không có “lowest”. Nếu mỗi <b>từ</b> là một từ tố, mô
      hình bó tay trước từ mới. Nếu mỗi <b>chữ cái</b> là một từ tố, chuỗi quá dài. Cách ở giữa: ghép chữ cái thành <b>mảnh
      hay gặp</b>, và “lowest” thành “low” + “est”.</p>

      <div class="box key">Hôm nay: <b>mã hoá cặp byte</b> — học các mảnh từ từ dữ liệu, cách mà nhiều mô hình ngôn ngữ lớn
      dùng để tách văn bản.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, kho học có bốn từ tiếng Anh như trên màn hình, nhưng không có từ thứ năm. Nếu mỗi từ là một từ tố, mô hình
      bó tay trước từ mới. Nếu mỗi chữ cái là một từ tố, chuỗi quá dài. Cách ở giữa là ghép chữ cái thành những mảnh hay gặp,
      và từ mới được tách thành hai mảnh đã biết. Hôm nay ta học mã hoá cặp byte, cách học các mảnh từ từ dữ liệu mà nhiều
      mô hình ngôn ngữ lớn dùng để tách văn bản. Cắt từ thành các mảnh ghép dưới mức từ cho phép mô hình đọc trôi chảy những
      từ mới toanh dựa trên phần gốc và đuôi quen thuộc. Tách từ vừa vặn ở tầng tiểu đơn vị giải quyết trọn vẹn từ mới lạ
      mà vẫn giữ kích thước từ vựng gọn gàng.
- id: prereq
  kind: prereq
  title: 'Ôn lại: đếm có trọng số, và byte của chữ có dấu'
  checks:
  - 5 + 2 == 7 and [len(c.encode()) for c in ('a', 'ô', 'è')] == [1, 2, 2]
  steps:
  - show: '<p><b>Đếm có trọng số:</b> từ “low” xuất hiện 5 lần, “lower” 2 lần; cặp chữ “l o” nằm trong cả hai → gặp $5 + 2
      = 7$ lần.</p>

      <p><b>Byte</b> là ô nhớ nhỏ nhất máy dùng để lưu chữ, mỗi ô chứa một số từ 0 tới 255. Chuẩn <b>UTF-8</b> quy định mỗi
      chữ được lưu bằng mấy byte: chữ tiếng Anh 1 byte, chữ có dấu nhiều hơn.</p>

      <table class="t"><tr><th>chữ</th><th>a</th><th>ô</th><th>è</th></tr><tr><td>số byte khi lưu theo chuẩn UTF-8</td><td>1</td><td>2</td><td>2</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - '3.2'
    - '3.2'
    say: Bài này cần hai điều. Thứ nhất, đếm có trọng số, từ thứ nhất xuất hiện 5 lần, từ thứ hai 2 lần, và cặp chữ l o nằm
      trong cả hai, nên gặp 5 cộng 2 bằng 7 lần. Thứ hai, máy lưu chữ thành byte, mỗi byte là một ô nhớ nhỏ chứa một số từ
      0 tới 255. Chuẩn lưu chữ phổ biến nhất quy định mỗi chữ cần mấy byte. Chữ a không dấu cần 1 byte, còn chữ ô hay chữ
      e huyền cần 2 byte. Nhân tần số từ cho mỗi cặp chữ liên kề rút gọn hàng triệu câu trùng lặp xuống một bảng từ vựng nén
      duy nhất trước lúc chạy gộp.
- id: sym
  kind: symbol
  title: 'Giải mã: thuật toán học luật gộp'
  steps:
  - show: '<ol><li>Tách mỗi từ trong kho thành chữ cái, thêm dấu cuối từ &lt;/w&gt;.</li>

      <li>Đếm mọi <b>cặp kề nhau</b>, nhân với tần số của từ chứa cặp đó.</li>

      <li>Gộp cặp nhiều nhất thành một ký hiệu mới, ghi lại <b>luật gộp</b>.</li>

      <li>Lặp lại bước 2–3 cho tới đủ số luật (số luật quyết định kích thước bộ từ tố).</li></ol>

      <p><b>Tách từ mới</b>: bắt đầu từ chữ cái hoặc từng byte chuẩn mã hoá ký tự <i>UTF-8</i>, áp dụng các luật gộp của <b>mã
      hoá cặp byte (BPE)</b> <b>theo đúng thứ tự đã học</b>.</p>

      '
    focus:
    - 1
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    say: 'Thuật toán có bốn bước. Bước một, tách mỗi từ trong kho thành chữ cái, thêm dấu cuối từ. Bước hai, đếm mọi cặp kề
      nhau, nhân với tần số của từ chứa cặp đó. Bước ba, gộp cặp nhiều nhất thành một ký hiệu mới, và ghi lại luật gộp. Bước
      bốn, lặp lại bước hai và ba cho tới đủ số luật, vì số luật quyết định kích thước bộ từ tố. Để tách một từ mới, bắt đầu
      từ chữ cái, rồi áp dụng các luật gộp theo đúng thứ tự đã học. Danh sách thứ tự các luật gộp là linh hồn của bộ tách:
      chỉ một thay đổi thứ tự cũng làm đổi toàn bộ chuỗi mã số sinh ra.'
