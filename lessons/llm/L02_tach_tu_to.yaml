      lỗi kỳ lạ (đếm chữ cái sai, đánh vần sai) bắt nguồn từ đây.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ 4 từ mẫu chạy 4 bước gộp BPE trong < 1 ms tới bảng từ tố 50 000–100 000
      mục đa ngôn ngữ: giữ bộ mã hoá gọn giúp đọc được mọi từ lạ nhưng khiến tiếng có dấu tốn nhiều từ tố hơn.</p>

      '
    say: Điều cần mang theo, mô hình không đọc chữ như ta, nó đọc các mảnh mà bộ tách đã chọn. Đưa văn bản về chuỗi số nguyên
      từ tố là trạm khởi đầu trước khi ánh xạ mỗi mã số thành tọa độ trong không gian nhiều chiều.
