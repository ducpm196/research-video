  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">bắt đầu từ chữ cái / byte</span><span class="a">→</span>

      <span class="n">gộp cặp hay gặp nhất, lặp lại</span><span class="a">→</span>

      <span class="n">tách từ mới theo đúng thứ tự luật</span><span class="a">→</span>

      <span class="n">chi phí tính theo từ tố, khác nhau giữa ngôn ngữ</span></div>

      '
    say: Tổng kết lại, bắt đầu từ chữ cái hay byte, gộp cặp hay gặp nhất và lặp lại. Tách từ mới theo đúng thứ tự luật, và
      nhớ rằng chi phí tính theo từ tố, khác nhau giữa các ngôn ngữ. Thuật toán mã hoá cặp byte bắt đầu từ danh sách ký tự
      hay từng byte nhỏ rồi liên tiếp gộp cặp liền nhau hay gặp nhất thành ký hiệu mới. Khi từ điển hợp nhất đủ nhỏ gọn, các
      từ thông dụng thành một mảnh duy nhất trong khi từ hiếm hoặc từ mới vẫn được tách mượt thành phần gốc quen thuộc. Hiểu
      từ mã hoá cặp byte giúp lập trình viên dự đoán chính xác lượng từ tố tiêu hao lẫn lý do mô hình gặp khó với từng ký
      tự lẻ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - clear: true
    show: '<p class="note"><b>Thứ tự luật &amp; chi phí đa ngôn ngữ:</b> Áp dụng luật gộp đúng thứ tự đã học; tiếng Việt có dấu thường tốn gấp 2–3 lần số từ tố so với tiếng Anh.</p>

      '
    say: Điểm bắt buộc không được quên là khi tách một từ mới lúc chạy thật, ta phải áp dụng các luật gộp đúng theo thứ tự
      ưu tiên đã học lúc huấn luyện. Nếu đảo ngược thứ tự hai bước gộp, cùng một từ đầu vào có thể bị chia ra thành chuỗi
      mảnh hoàn toàn khác biệt. Trong tình huống hai cặp bất kỳ hòa nhau về tổng tần suất trong một bước, ta chọn cặp xuất
      hiện trước theo quy ước nhất quán. Trên thực tế triển khai mô hình đa ngôn ngữ, bộ từ tố học nhiều trên tiếng Anh thường
      khiến tiếng Việt tốn gấp hai tới ba lần số từ tố cho cùng một ý. Hệ quả trực tiếp là chi phí gọi hàm tính toán lẫn độ
      trễ trả lời của câu tiếng Việt đều tăng theo số mảnh bị cắt vụn.
    focus:
    - 1
