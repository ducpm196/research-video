      <rect x="340" y="230" width="70" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="375"
      y="264">e</text>

      <rect x="420" y="230" width="70" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="455"
      y="264">w</text>

      <rect x="500" y="230" width="340" height="50" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="670"
      y="264">est&lt;/w&gt;</text>

      <text x="1150" y="164" font-weight="normal" font-size="24">7 ký hiệu → 5 → 4</text></g>

      </svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình cho thấy một từ trong kho thay đổi qua các luật gộp. Lúc đầu nó là 7 ký hiệu, chữ cái cộng dấu cuối từ. Sau
      luật một và hai, ba chữ e, s, t thành một mảnh, rồi sau luật ba mảnh đó dính luôn dấu cuối từ, nên chỉ còn 4 ký hiệu.
      Chiều dài biểu diễn co dần từ bảy ký hiệu rời rạc xuống còn bốn cụm nghĩa cho thấy khả năng nén ngữ nghĩa của mã hoá
      cặp byte. Thuật toán ghép cặp phổ biến tự động học cấu trúc gốc và hậu tố chỉ dựa trên tần suất lặp thực tế.
- id: example
  kind: example
  title: Năm luật gộp đầu tiên
  checks:
  - 'alg.bpe_merges({''l o w </w>'': 5, ''l o w e r </w>'': 2, ''n e w e s t </w>'': 6, ''w i d e s t </w>'': 3}, 5)[0] ==
    [((''e'', ''s''), 9), ((''es'', ''t''), 9), ((''est'', ''</w>''), 9), ((''l'', ''o''), 7), ((''lo'', ''w''), 7)]'
  - 6 + 3 == 9 and 5 + 2 == 7
  steps:
  - show: '<p>Kho: low ×5, lower ×2, newest ×6, widest ×3. <b>Bước 1 — đếm mọi cặp kề nhau</b> (có trọng số):</p>

      <table class="t"><tr><th>cặp</th><th>e s</th><th>s t</th><th>t &lt;/w&gt;</th><th>w e</th><th>l o</th><th>o w</th></tr>

      <tr><td>số lần</td><td>9</td><td>9</td><td>9</td><td>8</td><td>7</td><td>7</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.2'
    - '2.2'
    say: Kho gồm bốn từ với tần số 5, 2, 6 và 3. Bước một, đếm mọi cặp chữ đứng cạnh nhau, rồi nhân số cặp trong mỗi từ với
      số lần từ đó xuất hiện. Cặp e s gặp 9 lần, cặp s t và t với dấu cuối từ cũng 9 lần, w e 8 lần, còn l o và o w 7 lần.
      Nhờ trọng số tần suất, các tổ hợp phổ biến nhất trong kho văn bản nhanh chóng vượt lên dẫn đầu danh sách gộp sớm.
  - clear: true
    show: '<table class="t"><tr><th>lần</th><th>cặp được gộp</th><th>số lần</th><th>vì sao</th></tr>

      <tr><td>1</td><td>e + s → es</td><td>9</td><td>newest (6) + widest (3); hòa thì lấy cặp gặp trước</td></tr>

      <tr><td>2</td><td>es + t → est</td><td>9</td><td>cùng hai từ đó</td></tr>

      <tr><td>3</td><td>est + &lt;/w&gt; → est&lt;/w&gt;</td><td>9</td><td>đuôi “est” cuối từ</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Bước hai, gộp cặp nhiều nhất và đếm lại sau mỗi lần gộp. Lần một gộp e và s, 9 lần, vì 6 lần trong từ thứ ba cộng
      3 lần trong từ thứ tư, và hòa thì lấy cặp gặp trước. Lần hai, ghép mảnh vừa tạo với chữ t đứng sau nó, cặp này cũng
      xuất hiện 9 lần. Lần ba gộp đuôi e s t với dấu cuối từ, 9 lần. Quy ước ưu tiên cặp gặp trước khi hoà số lần bảo đảm
      kết quả huấn luyện bộ tách từ tố luôn lặp lại hoàn toàn nhất quán.
  - show: '<table class="t"><tr><th>lần</th><th>cặp được gộp</th><th>số lần</th><th>vì sao</th></tr>

      <tr><td>4</td><td>l + o → lo</td><td>7</td><td>low (5) + lower (2)</td></tr>

      <tr><td>5</td><td>lo + w → low</td><td>7</td><td>cùng hai từ đó</td></tr></table>

      '
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    say: Lần bốn gộp l và o, 7 lần, vì 5 lần trong từ đầu cộng 2 lần trong từ thứ hai. Lần năm gộp mảnh l o với w, cũng 7
      lần. Cập nhật bộ đếm ngay lập tức sau mỗi bước gộp ngăn việc đếm trùng các cặp lân cận bị phá vỡ bởi nhóm vừa gộp.
  - clear: true
    show: '<p><b>Bước 3 — tách từ mới</b> “lowest”: l o w e s t &lt;/w&gt; → áp dụng 5 luật theo thứ tự → <b class="red">low
      + est&lt;/w&gt;</b> — <b>2</b> từ tố thay vì 7 ký hiệu.</p>

      '
    say: Bước ba, tách từ mới chưa gặp. Bắt đầu từ 7 ký hiệu, áp dụng năm luật theo đúng thứ tự, chỉ còn 2 từ tố, mảnh l o
      w và mảnh e s t có dấu cuối từ. Phân tách thành hai mảnh quen thuộc cho thấy sức mạnh khái quát sang từ biến thể mới
      hoàn toàn vắng bóng lúc huấn luyện.
  - clear: true
    show: '<p><b>Minh hoạ Python đếm ký tự so với byte UTF-8</b></p><div class="code"><div>for s in ("Tôi thích mèo", "I like
      cats"):</div><div>    print(len(s), len(s.encode("utf-8")))</div><div style="color:#059669"># Kết quả: 13 16 / 11 11</div></div>'
    focus:
    - 1
    - 2
    say: Đoạn mã Python đo trực tiếp số ký tự và số byte mã hoá của câu tiếng Việt so với tiếng Anh. Câu tiếng Việt dài 13
      ký tự nhưng tốn tới 16 byte trong khi tiếng Anh khớp từng byte.
- id: check
  kind: check
  title: 'Tự kiểm: đếm lại bằng tay'
  checks:
  - 'sum(f for w, f in {''l o w </w>'': 5, ''l o w e r </w>'': 2, ''n e w e s t </w>'': 6, ''w i d e s t </w>'': 3}.items()
    if ''e s'' in w) == 9'
  - 'alg.bpe_encode(''lowest'', [p for p, _ in alg.bpe_merges({''l o w </w>'': 5, ''l o w e r </w>'': 2, ''n e w e s t </w>'':
    6, ''w i d e s t </w>'': 3}, 5)[0]]) == [''low'', ''est</w>''] and len(''l o w e s t </w>''.split()) == 7'
  steps:
  - show: '<table class="t"><tr><th>con số</th><th>đếm lại</th><th>kết quả</th></tr>

      <tr><td>cặp e s: 9</td><td>chỉ newest (6) và widest (3) có “e s”</td><td>6 + 3 = 9 ✓</td></tr>

      <tr><td>“lowest”: 2 từ tố</td><td>7 ký hiệu; “low” dùng luật 4, 5; “est&lt;/w&gt;” dùng luật 1, 2, 3</td><td>2 ✓</td></tr></table>

      <p class="note"><b>So sánh hai quy mô:</b> Trên 4 từ ví dụ chỉ 4 bước gộp; ở bảng mã hoá BPE thật 50 000–100 000 mục
      cho ngữ liệu tỉ từ, mỗi ngôn ngữ tốn mật độ từ tố khác nhau (tiếng có dấu cắt mảnh hơn), đổi lại xử lý trơn tru mọi
      từ chưa từng thấy.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    - 2
    say: Kiểm bằng đường khác, đếm lại bằng tay. Chỉ hai từ có cặp e s, với tần số 6 và 3, nên đúng 9 lần. Từ mới có 7 ký
      hiệu, mảnh l o w dùng luật bốn và năm, mảnh đuôi dùng luật một, hai, ba, nên còn đúng 2 từ tố. Ở hai mức quy mô, 4 từ
      mẫu chỉ cần 4 bước gộp cặp đơn giản. Ở bảng tách từ 100 nghìn mục trên ngữ liệu tỉ từ, tiếng có dấu bị cắt vụn hơn nhưng
      bù lại xử lý được mọi từ mới lạ. Kiểm ngược dấu kết thúc từ ngăn mô hình gộp nhầm phần đuôi của một từ với ký tự mở
      đầu của từ kế tiếp đứng sau.
- id: pitfalls
  kind: pitfall
  checks:
  - '[len(s.encode()) for s in (''Tôi thích mèo'', ''I like cats'')] == [16, 11] and [len(s) for s in (''Tôi thích mèo'',
    ''I like cats'')] == [13, 11]'
  - 'alg.bpe_encode(''newer'', [p for p, _ in alg.bpe_merges({''l o w </w>'': 5, ''l o w e r </w>'': 2, ''n e w e s t </w>'':
    6, ''w i d e s t </w>'': 3}, 5)[0]]) == [''n'', ''e'', ''w'', ''e'', ''r'', ''</w>'']'
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Đồng nhất từ tố với từ <b class="red">(ước lượng sai chi phí)</b>

      <br><span class="note">Giá tiền, giới hạn ngữ cảnh, tốc độ đều tính theo <b>từ tố</b>. Từ hiếm bị tách thành nhiều mảnh:
      “newer” với 5 luật trên vẫn là 6 ký hiệu.</span></div>

      '
    say: Lỗi thứ nhất, đồng nhất từ tố với từ, nên ước lượng sai chi phí. Giá tiền, giới hạn ngữ cảnh và tốc độ đều tính theo
      từ tố. Từ hiếm bị tách thành nhiều mảnh, ví dụ một từ mới với năm luật trên vẫn là 6 ký hiệu. Ngôn ngữ có nhiều ký tự
      ghép hoặc dấu phụ bị tách vụn thành nhiều mảnh nhỏ hơn tiếng Anh cùng nghĩa, làm tăng chi phí gọi giao diện. Bộ từ điển
      yếu với tiếng có dấu cắt vụn một âm tiết làm tăng vọt chi phí xử lý chuỗi đầu vào.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Quên rằng chữ có dấu tốn nhiều byte hơn <b class="red">(tiếng Việt đắt hơn)</b>

      <br><span class="note">Bộ tách theo byte bắt đầu từ byte UTF-8: “Tôi thích mèo” có 13 ký tự nhưng <b>16 byte</b>; “I
      like cats” 11 ký tự, 11 byte. Bộ tách học chủ yếu từ tiếng Anh thường cắt tiếng Việt thành nhiều từ tố hơn cho cùng
      nội dung.</span></div>

      '
    say: Lỗi thứ hai, quên rằng chữ có dấu tốn nhiều byte hơn, nên tiếng Việt đắt hơn. Bộ tách theo byte bắt đầu từ byte của
      văn bản, câu tôi thích mèo có 13 ký tự nhưng 16 byte, còn câu tiếng Anh cùng nghĩa có 11 ký tự và 11 byte.
  - show: ''
    say: Bộ tách học chủ yếu từ tiếng Anh thường cắt tiếng Việt thành nhiều từ tố hơn cho cùng nội dung. Hiểu rõ chuẩn mã
      hoá tám bít giải thích vì sao một chữ có dấu tiếng Việt dài tốn từ 2 đến 3 byte thay vì 1 byte như chữ La-tinh không
      dấu. Đếm rõ số byte mỗi ký tự giúp giải thích chênh lệch tốc độ giữa văn bản La-tinh đơn giản và tiếng Việt.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Dùng bộ tách khác với bộ tách lúc huấn luyện <b class="red">(mô hình đọc sai)</b>

      <br><span class="note">Mỗi mô hình gắn với đúng một bộ luật gộp và bảng mã từ tố. Đổi bộ tách thì cùng một văn bản thành
      dãy số khác — mô hình nhận vào thứ nó chưa từng học.</span></div>

      '
    say: Lỗi thứ ba, dùng bộ tách khác với bộ tách lúc huấn luyện, nên mô hình đọc sai. Mỗi mô hình gắn với đúng một bộ luật
      gộp và bảng mã từ tố. Đổi bộ tách thì cùng một văn bản thành dãy số khác, và mô hình nhận vào thứ nó chưa từng học.
      Đóng gói chặt bộ luật gộp kèm tập trọng số mô hình giúp tránh thảm hoạ lệch bảng mã làm mô hình sinh chuỗi vô nghĩa.
      Mỗi tập trọng số buộc phải chạy kèm đúng bộ tách từ sinh ra nó để tránh mã hoá sai lệch hoàn toàn ngữ nghĩa.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 'alg.bpe_merges({''l o w </w>'': 5, ''l o w e r </w>'': 2, ''n e w e s t </w>'': 6, ''w i d e s t </w>'': 3}, 6)[0][5]
    == ((''n'', ''e''), 6)'
  - '(lambda c: sorted(k for k, v in c.items() if v == 6))(__import__(''collections'').Counter(x for w, f in {''low </w>'':
    5, ''low e r </w>'': 2, ''n e w est</w>'': 6, ''w i d est</w>'': 3}.items() for x in zip(w.split(), w.split()[1:]) for
    _ in range(f))) == [(''e'', ''w''), (''n'', ''e''), (''w'', ''est</w>'')]'
  - 'alg.bpe_encode(''low'', [p for p, _ in alg.bpe_merges({''l o w </w>'': 5, ''l o w e r </w>'': 2, ''n e w e s t </w>'':
    6, ''w i d e s t </w>'': 3}, 5)[0]]) == [''low'', ''</w>'']'
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Sau 5 luật trên, kho thành: low &lt;/w&gt; ×5, low e r &lt;/w&gt; ×2, n e w est&lt;/w&gt; ×6, w i
      d est&lt;/w&gt; ×3. Luật gộp thứ 6 là gì?</td></tr>

      <tr><td>2</td><td>Từ “low” được tách thành mấy từ tố?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, sau năm luật trên, kho trở thành như trên màn hình. Luật gộp thứ sáu là gì?
      Câu hai, từ đầu tiên của kho được tách thành mấy từ tố? Dừng video và làm ra giấy. Xếp hạng tất cả cặp liền kề còn lại
      từ năm luật đầu rồi đối chiếu luật ưu tiên phá hoà từ trái sang phải.
    pause: 15
  - show: '<table class="t"><tr><th>cặp</th><th>n e</th><th>e w</th><th>w est&lt;/w&gt;</th></tr>

      <tr><td>số lần (chỉ trong newest ×6)</td><td>6</td><td>6</td><td>6</td></tr></table>

      <p>① Ba cặp hòa ở 6 lần → lấy cặp gặp trước: luật 6 là <b>n + e → ne</b>.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Đáp án câu một, có ba cặp cùng xuất hiện nhiều nhất, 6 lần, đều trong từ thứ ba. Hòa thì lấy cặp gặp trước, nên luật
      sáu gộp n và e. Ba cặp đồng hạng sáu cùng thuộc nhóm từ có tần suất cao nhất khẳng định tầm quan trọng của quy ước phá
      hoà tất định.
  - show: '<p>② “low”: l o w &lt;/w&gt; → luật 4, 5 cho <b>low + &lt;/w&gt;</b> = <b>2</b> từ tố (không luật nào gộp “low”
      với dấu cuối từ).</p>

      '
    say: Câu hai, từ đầu tiên đi qua luật bốn và năm thành mảnh l o w, và không có luật nào gộp mảnh này với dấu cuối từ,
      nên được 2 từ tố. Nhận biết ranh giới dấu kết thúc từ giúp xác định đúng lúc cụm chữ ngừng gộp tiếp khi duyệt luật trên
      từ thử nghiệm.
