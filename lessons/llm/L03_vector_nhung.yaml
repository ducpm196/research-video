      <path d="M700,214 A160,160 0 0,1 715,226" fill="none" stroke="#eb6834" stroke-width="3"/>

      <g font-size="26" font-weight="bold" fill="#1f2937"><text x="910" y="72">mèo</text><text x="975" y="118">chó</text><text
      x="1035" y="285">ô tô</text></g>

      <g font-size="23" fill="#1f2937"><text x="1100" y="160">góc nhỏ → cosin gần 1</text><text x="1100" y="250">góc lớn →
      cosin nhỏ</text></g>

      </svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ ba vector nhúng trong hai chiều cho dễ nhìn. Vector của mèo và chó chỉ gần cùng một hướng, góc giữa chúng
      nhỏ, nên cô-sin gần 1. Vector của ô tô chỉ sang hướng khác hẳn, góc lớn, nên cô-sin nhỏ, dù ba vector có thể dài ngắn
      khác nhau. Mặt phẳng hai chiều trực quan hoá hoàn hảo cách hai từ họ mèo chó khép góc hẹp ngược hẳn với phương tiện
      giao thông. Độ tương tự cô-sin đo góc hợp bởi hai vector giúp tập trung vào hướng ngữ nghĩa thay vì độ dài đếm chữ.
- id: example
  kind: example
  title: Tính cosin và một phép tương tự
  checks:
  - round(alg.cosine([1, 2, 0], [2, 3, 1]), 3) == 0.956 and alg.cosine([1, 2, 0], [-2, 1, 0]) == 0 and 1 * 2 + 2 * 3 + 0 *
    1 == 8
  - tuple(x - y + z for x, y, z in zip((1, 1, 0), (0, 1, 0), (0, 0, 1))) == (1, 0, 1) and round(alg.cosine((1, 0, 1), (0,
    0, 1)), 3) == 0.707
  steps:
  - show: '<p>Hai vector $u = (1, 2, 0)$, $v = (2, 3, 1)$. <b>Bước 1 — tử số:</b> $u \cdot v = 1 \cdot 2 + 2 \cdot 3 + 0 \cdot
      1 = 8$.</p>

      '
    say: Xét hai vector u bằng 1, 2, 0 và v bằng 2, 3, 1. Bước một, tử số là tích vô hướng, 1 nhân 2 cộng 2 nhân 3 cộng 0
      nhân 1, bằng 8. Tích vô hướng cộng các cặp tích tọa độ thành một số vô hướng phản ánh đồng thời độ lớn và mức trùng
      chiều hai vector.
  - show: '<p><b>Bước 2 — mẫu số:</b> $\lVert u \rVert = \sqrt{1 + 4 + 0} = \sqrt{5}$, $\lVert v \rVert = \sqrt{4 + 9 + 1}
      = \sqrt{14}$, tích $= \sqrt{70}$.</p>

      '
    say: Bước hai, tính mẫu số là tích hai độ dài. Độ dài của u là căn 5, của v là căn 14, nên tích bằng căn 70.
    focus:
    - '1.1'
    - '1.2'
  - show: '$$\cos(u, v) = \frac{8}{\sqrt{70}} \approx \frac{8}{8{,}367} \approx \hl{0{,}956}$$

      <p>Gần 1 → gần cùng hướng. Còn $\cos((1, 2, 0), (-2, 1, 0)) = \frac{-2 + 2 + 0}{\dots} = 0$ — vuông góc (còn gọi <i>trực
      giao</i>), không liên quan.</p>

      '
    introduces:
    - dots
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Bước ba, chia tử cho mẫu, 8 chia căn 70 xấp xỉ 0 phẩy 956, gần 1, nên gần cùng hướng. Ngược lại, vector 1, 2, 0 và
      vector trừ 2, 1, 0 có tích vô hướng bằng 0. Vì vậy hai vector này vuông góc với nhau, tức là không liên quan gì về nghĩa.
      Giá trị không cho thấy hai vector trực giao tương ứng với các trường nghĩa hoàn toàn tách biệt không chia sẻ ngữ cảnh.
  - clear: true
    show: '<table class="t"><tr><th>vector đồ chơi (hoàng gia, nam, nữ)</th><th>giá trị</th></tr>

      <tr><td>vua − đàn ông + phụ nữ</td><td>(1, 1, 0) − (0, 1, 0) + (0, 0, 1) = (1, 0, 1)</td></tr>

      <tr><td>gần nhất theo cosin</td><td>nữ hoàng (1, 0, 1): cos = <b>1</b>; phụ nữ: 0,707</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Bước bốn là một phép tương tự với vector đồ chơi ba chiều, hoàng gia, nam và nữ. Vua trừ đàn ông cộng phụ nữ ra vector
      1, 0, 1. Từ gần nhất theo cô-sin là nữ hoàng, với cô-sin bằng 1, tiếp theo là phụ nữ với 0 phẩy 707. Phép cộng trừ mũi
      tên nắm bắt chính xác cả quan hệ loại suy giới tính lẫn ngôi thứ hoàng gia chỉ bằng đại số tuyến tính.
  - clear: true
    show: '<p><b>Minh hoạ Python tính độ tương tự cosin giữa hai vector nhúng</b></p><div class="code"><div>import math</div><div>u,
      v = (1, 2, 0), (2, 3, 1)</div><div>cos = sum(a*b for a, b in zip(u, v)) / (math.hypot(*u) * math.hypot(*v))</div><div>print(round(cos,
      3))</div><div style="color:#059669"># Kết quả: 0.956</div></div>'
    focus:
    - 1
    - 2
    say: Đoạn mã dùng tích vô hướng chia tích hai độ dài bằng hàm chuẩn thư viện toán học. Hai vector gần hướng cho kết quả
      không phẩy chín năm sáu sát mốc một.
- id: check
  kind: check
  title: 'Tự kiểm: cosin không đổi khi kéo dài vector'
  checks:
  - round(alg.cosine([2, 4, 0], [2, 3, 1]), 3) == round(alg.cosine([1, 2, 0], [2, 3, 1]), 3) == 0.956 and round(alg.cosine([1,
    2, 0], [2, 4, 0]), 9) == 1
  steps:
  - show: '<table class="t"><tr><th>kiểm</th><th>vì sao</th><th>kết quả</th></tr>

      <tr><td>$\cos((2, 4, 0), (2, 3, 1))$</td><td>gấp đôi $u$: tử gấp đôi, mẫu gấp đôi</td><td>vẫn 0,956 ✓</td></tr>

      <tr><td>$\cos((1, 2, 0), (2, 4, 0))$</td><td>cùng hướng, khác độ dài</td><td>đúng 1 ✓</td></tr></table>

      <p class="note"><b>So sánh hai quy mô:</b> Vector 3 chiều tính cosin bằng tay ngay; trên vector nhúng 1 536–12 288 chiều
      của mô hình lớn, năng lực biểu diễn ngữ nghĩa tăng mạnh nhưng chi phí tìm kiếm mỗi câu tăng hàng nghìn lần, cần chuẩn
      hoá trước độ dài.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    - 2
    say: Kiểm bằng đường khác, kéo dài vector rồi tính lại. Gấp đôi u thì tử số gấp đôi và mẫu số cũng gấp đôi, nên cô-sin
      vẫn là 0 phẩy 956. Vector 1, 2, 0 và 2, 4, 0 cùng hướng chỉ khác độ dài, nên cô-sin đúng bằng 1. Ở hai mức quy mô, vector
      3 chiều tính nhẩm ngay độ tương tự. Khi lên tới 12 nghìn 288 chiều, khả năng biểu đạt nghĩa sâu hơn nhiều nhưng mỗi
      truy vấn tốn gấp nghìn lần bộ nhớ và phép nhân. Tính bất biến theo hệ số tỉ lệ của cô-sin bảo đảm từ xuất hiện nhiều
      hay ít lần trong kho dữ liệu vẫn giữ nguyên hướng ngữ nghĩa.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp, có lỗi cả người đã đi làm
  checks:
  - round(alg.cosine([3, 2, 4, 0], [3, 2, 3, 0]), 2) == 0.99 and round(alg.cosine([3, 2, 4, 0], [0, 1, 1, 4]), 3) == 0.263
  - sum(x * y for x, y in zip([10, 20, 0], [2, 3, 1])) == 80 and round(alg.cosine([10, 20, 0], [2, 3, 1]), 3) == 0.956
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Coi “gần nhau” là “đồng nghĩa” <b class="red">(trái nghĩa cũng gần)</b>

      <br><span class="note">Đếm ngữ cảnh (trời, nước, rất, món): “nóng” (3, 2, 4, 0), “lạnh” (3, 2, 3, 0), “ngon” (0, 1,
      1, 4). cos(nóng, lạnh) ≈ <b>0,99</b>, cos(nóng, ngon) ≈ 0,263 — trái nghĩa nhưng cùng ngữ cảnh nên rất gần.</span></div>

      '
    say: Lỗi thứ nhất, coi gần nhau là đồng nghĩa, trong khi từ trái nghĩa cũng gần. Đếm số lần xuất hiện cùng bốn từ ngữ
      cảnh, nóng và lạnh có vector đếm gần giống nhau, còn ngon thì khác. Cô-sin giữa nóng và lạnh xấp xỉ 0 phẩy 99, giữa
      nóng và ngon chỉ 0 phẩy 263, trái nghĩa nhưng cùng ngữ cảnh nên rất gần. Hai tính từ trái nghĩa như nóng và lạnh chia
      sẻ gần hết các danh từ đi kèm nên luôn nằm cạnh nhau trong không gian nhúng. Các từ trái nghĩa xuất hiện trong ngữ cảnh
      tương tự đôi khi nằm cạnh nhau trong không gian biểu diễn thống kê.
  - show: '<div class="box warn"><b>Lỗi 2.</b> So bằng tích vô hướng thô <b class="red">(lẫn với độ dài)</b>

      <br><span class="note">Nhân vector đầu lên 10 lần: tích vô hướng tăng từ 8 lên 80, nhưng cosin vẫn 0,956. Vector của
      từ hay gặp thường dài hơn — dùng cosin (hoặc chuẩn hoá độ dài trước).</span></div>

      '
    say: Lỗi thứ hai, so bằng tích vô hướng thô, nên lẫn với độ dài. Nhân vector đầu lên 10 lần thì tích vô hướng tăng từ
      8 lên 80, nhưng cô-sin vẫn 0 phẩy 956. Vector của từ hay gặp thường dài hơn, nên hãy dùng cô-sin, hoặc chuẩn hoá độ
      dài trước. Chia cho tích hai độ dài chuẩn hoá triệt tiêu sự thiên lệch do độ dài vector thay đổi qua quá trình huấn
      luyện. Độ dài thô của vector có thể sai lệch lớn theo tần suất xuất hiện nên chuẩn hoá đơn vị là bước thiết yếu.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> So vector của hai mô hình khác nhau <b class="red">(vô nghĩa)</b>

      <br><span class="note">Mỗi mô hình học một hệ toạ độ riêng; chiều thứ 5 ở mô hình này không có nghĩa gì với mô hình
      kia. Chỉ so vector sinh từ cùng một mô hình.</span></div>

      <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Dùng một ngưỡng cosin cố định cho mọi mô hình <b class="red">(lọc
      sai)</b>

      <br><span class="note">Có mô hình cho hầu hết các cặp cosin trên 0,7, có mô hình cho dưới 0,3 (số minh hoạ). Ngưỡng
      “giống nhau” phải chỉnh trên vài trăm cặp đã gắn nhãn của chính bài toán.</span></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Lỗi thứ ba, so vector của hai mô hình khác nhau, điều này vô nghĩa. Mỗi mô hình học một hệ toạ độ riêng, chiều thứ
      năm ở mô hình này không có nghĩa gì với mô hình kia. Chỉ so vector sinh từ cùng một mô hình. Lỗi thứ tư, người đã đi
      làm cũng hay mắc, là dùng một ngưỡng cô-sin cố định cho mọi mô hình. Có mô hình cho hầu hết các cặp cô-sin trên 0 phẩy
      7, có mô hình cho dưới 0 phẩy 3, đây là số minh hoạ. Ngưỡng giống nhau phải được chỉnh trên vài trăm cặp đã gắn nhãn
      của chính bài toán. Không gian nhúng chỉ có giá trị so sánh nội bộ bên trong đúng phiên bản mô hình đã sinh ra nó, cấm
      đem ghép chéo hai hệ.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(alg.cosine([1, 0], [1, 1]), 3) == 0.707 and alg.cosine([1, 1], [-1, -1]) == -1
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Tính $\cos((1, 0), (1, 1))$.</td></tr>

      <tr><td>2</td><td>Hai vector $(1, 1)$ và $(-1, -1)$ có cosin bằng bao nhiêu? Điều đó nói gì về hướng?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, tính cô-sin của hai vector 1, 0 và 1, 1. Câu hai, hai vector 1, 1 và trừ 1,
      trừ 1 có cô-sin bằng bao nhiêu? Điều đó nói gì về hướng? Dừng video và làm ra giấy. Thực hành tính tay tử tích vô hướng
      lẫn mẫu độ dài để đối chiếu góc vuông và góc đối ngược.
    pause: 15
  - show: '<p>① Tử: $1 \cdot 1 + 0 \cdot 1 = 1$. Mẫu: $1 \cdot \sqrt{2}$. $\cos = \frac{1}{\sqrt{2}} \approx \hl{0{,}707}$
      — lệch nhau 45 độ.</p>

      '
    say: Đáp án câu một, tử số bằng 1 nhân 1 cộng 0 nhân 1, bằng 1, mẫu số bằng 1 nhân căn 2, nên cô-sin xấp xỉ 0 phẩy 707,
      tức hai vector lệch nhau 45 độ. Cô-sin không phẩy bảy không bảy khớp đúng góc bốn mươi lăm độ giữa trục ngang và đường
      chéo góc phần tư thứ nhất.
  - show: '<p>② Tử: $1 \cdot (-1) + 1 \cdot (-1) = -2$. Mẫu: $\sqrt{2} \cdot \sqrt{2} = 2$. $\cos = \hl{-1}$ — ngược hướng
      hoàn toàn.</p>

      '
    say: Câu hai, tử số bằng trừ 1 cộng trừ 1, bằng trừ 2, mẫu số bằng căn 2 nhân căn 2, bằng 2, nên cô-sin bằng trừ 1, tức
      ngược hướng hoàn toàn. Cô-sin âm một khẳng định hai mũi tên quay lưng một trăm tám mươi độ ngược chiều tuyệt đối trong
      không gian ngữ nghĩa.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/LLM/L03
  steps:
  - show: <table class='t'><tr><th>Thực hành LLM:L03</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Biết
      giới hạn của độ tương tự giữa vector nhúng</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>u=2,1,0 v=3,2,1 w=-1,2,0</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh LLM L03 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 3 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Cài đặt hàm tính tích vô hướng, chuẩn độ dài vector và
      xuất chính xác độ tương tự cô-sin cho hai cặp vector thử nghiệm. Kiểm định chính xác ba chữ số thập phân đối với cặp
      cùng chiều và một chữ số đối với cặp trực giao.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai LLM:L03</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (hàm tích vô hướng)</b></td><td>Nhân từng cặp tọa độ tương ứng rồi cộng lại làm tử số</td></tr><tr><td><b>Bước 2 (chia
      tích độ dài)</b></td><td>Chia tử số cho tích chuẩn Euclid hai vector bằng math.hypot</td></tr><tr><td><b>Bước 3 (tính
      hai cặp)</b></td><td>Xuất cặp đồng hướng ba chữ số và cặp kiểm trực giao</td></tr></table>
    say: Gợi ý cài đặt bài số 3 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 1 dòng khớp định dạng.
    clear: true
    focus:
    - '1.2'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (1 dòng)</b></p><div class="code"><div>cos_sim=0.956 cos_orth=0.0</div></div>
    say: Màn hình hiện 1 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">cùng ngữ cảnh → gần nghĩa</span><span class="a">→</span>

      <span class="n">từ tố thành vector số thực</span><span class="a">→</span>

      <span class="n">cosin đo hướng, bỏ qua độ dài</span><span class="a">→</span>

      <span class="n">gần ≠ đồng nghĩa</span></div>

      '
    say: Tổng kết lại, từ cùng ngữ cảnh thì gần nghĩa, nên ta biến từ tố thành vector số thực. Cô-sin đo hướng và bỏ qua độ
      dài, và nhớ rằng gần nhau chưa chắc là đồng nghĩa. Ý tưởng cốt lõi của vector nhúng là đưa mọi từ tố rời rạc vào một
      không gian số liên tục sao cho các từ xuất hiện cùng ngữ cảnh đứng gần nhau. Khi đo mức độ tương đồng bằng cô-sin giữa
      hai vector, ta chỉ xét góc hướng giữa chúng mà bỏ qua hoàn toàn chênh lệch độ dài véc-tơ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
  - show: '<div class="chain"><span class="n">cùng ngữ cảnh → gần nghĩa</span><span class="a">→</span>

      <span class="n">từ tố thành vector số thực</span><span class="a">→</span>

      <span class="n">cosin đo hướng, bỏ qua độ dài</span><span class="a">→</span>

      <span class="n">gần ≠ đồng nghĩa</span></div>

      '
    say: Hai vector cùng hướng cho cô-sin bằng một, còn hai vector vuông góc trực giao cho cô-sin đúng bằng không dù thành
      phần chứa các con số lớn. Tuy nhiên cần luôn tỉnh táo rằng hai từ trái nghĩa như nóng và lạnh hay tốt và xấu vẫn thường
      có cô-sin rất cao vì hay xuất hiện trong cùng mẫu câu. Do đó độ tương tự vector nhúng phản ánh mức độ liên quan về ngữ
      cảnh phân bố chứ chưa phải chứng minh cho quan hệ đồng nghĩa hay suy luận logic. Ở quy mô mô hình ngôn ngữ lớn với vài
      nghìn chiều nhúng, chuẩn hoá độ dài từng vector trước khi nhân ma trận giúp hệ tìm kiếm chạy cực nhanh. Khám phá ngay
      góc vuông và tích vô hướng qua bài tập tính cô-sin đơn giản trên ba chiều ngay sau đây.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
  - show: '<div class="box key"><b>Tư duy:</b> vector nhúng ghi lại <b>cách từ được dùng</b>, không ghi lại định nghĩa của
      từ.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Từ 3 chiều minh hoạ tính cosin ngay tới không gian nhúng 12 288 chiều: biểu
      diễn giàu nghĩa hơn gấp bội nhưng mỗi truy vấn tốn bộ nhớ và hàng nghìn phép nhân hơn — cần chuẩn hoá độ dài.</p>

      '
    say: Điều cần mang theo, vector nhúng ghi lại cách từ được dùng, không ghi lại định nghĩa của từ. Từ không gian 3 chiều
      tới vector 12 nghìn 288 chiều. Từ những điểm tĩnh đại diện cho từng từ đơn lẻ, bước tiếp theo đặt từng từ vào dòng chảy
      ngữ cảnh qua cơ chế chú ý nhân quả.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: '<p class="note">Bài sau (bài 4): mô hình giải mã dùng <b>cơ chế chú ý</b> — mặt nạ nhân quả và thông tin vị trí.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 4, ta học mô hình giải mã dùng cơ chế chú ý, với mặt nạ nhân quả và thông tin vị trí. Hẹn gặp bạn
      ở bài tiếp theo.
