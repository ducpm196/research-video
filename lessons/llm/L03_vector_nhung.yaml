scenes:
- id: hook
  kind: hook
  title: Máy biết “mèo” gần “chó” hơn “ô tô”?
  steps:
  - show: '<p>Với máy, “mèo” chỉ là một mã số. Nếu mỗi từ là một vector toàn số 0 với một số 1, mọi cặp từ đều “xa” như nhau
      — mèo cách chó bằng mèo cách ô tô. Nhưng ta muốn mô hình hiểu rằng câu nói về mèo cũng thường đúng với chó.</p>

      <div class="box key">Hôm nay: <b>vector nhúng</b> — biểu diễn từ tố bằng vector số thực để từ gần nghĩa nằm gần nhau,
      đo bằng <b>độ tương tự cosin</b>.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, với máy, mèo chỉ là một mã số. Nếu mỗi từ là một vector toàn số 0 với một số 1, mọi cặp từ đều xa như nhau,
      mèo cách chó bằng mèo cách ô tô. Nhưng ta muốn mô hình hiểu rằng câu nói về mèo cũng thường đúng với chó. Hôm nay ta
      học vector nhúng, biểu diễn từ tố bằng vector số thực để từ gần nghĩa nằm gần nhau, và đo bằng độ tương tự cô-sin. Biểu
      diễn ngôn ngữ trong không gian vector liên tục giải phóng mô hình khỏi bẫy đồng nhất rời rạc của mã định danh một nóng.
      Không gian vector liên tục đưa những khái niệm gần nghĩa đứng sát bên nhau thay vì tách rời thành các mã số vô hồn.
- id: prereq
  kind: prereq
  title: 'Trước hết: vector, tích vô hướng, độ dài và cô-sin của góc'
  checks:
  - 1 * 3 + 2 * 4 == 11 and math.sqrt(3 ** 2 + 4 ** 2) == 5
  - '[round(math.cos(math.radians(a)), 3) for a in (0, 45, 90, 180)] == [1.0, 0.707, 0.0, -1.0]'
  - '(lambda u, v: abs((u[0] * v[0] + u[1] * v[1]) - math.hypot(*u) * math.hypot(*v) * math.cos(math.radians(45))) < 1e-12)((1,
    0), (1, 1)) and 1 * 0 + 0 * 1 == 0'
  steps:
  - show: '<p><b>Vector</b> là một danh sách số, ví dụ $(3, 4)$; trong hai chiều, hình dung nó là mũi tên từ gốc toạ độ tới
      điểm có hoành độ 3, tung độ 4.</p>

      <table class="t"><tr><th>phép</th><th>cách tính</th><th>ví dụ</th></tr>

      <tr><td>tích vô hướng</td><td>nhân từng cặp thành phần rồi cộng</td><td>$(1, 2) \cdot (3, 4) = 1 \cdot 3 + 2 \cdot 4
      = 11$</td></tr>

      <tr><td>độ dài</td><td>căn của tổng bình phương (định lý Py-ta-go)</td><td>$\lVert (3, 4) \rVert = \sqrt{9 + 16} = 5$</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    say: Trước hết, ta cần hiểu vector là gì. Vector là một danh sách số, ví dụ 3, 4, và trong hai chiều ta hình dung nó là
      mũi tên từ gốc toạ độ tới điểm có hoành độ 3, tung độ 4. Tích vô hướng của hai vector nhân từng cặp thành phần rồi cộng,
      ví dụ 1 nhân 3 cộng 2 nhân 4 bằng 11. Độ dài là căn của tổng bình phương, theo định lý Py-ta-go, nên vector 3, 4 có
      độ dài căn của 9 cộng 16, bằng 5. Tính chất độ dài và hướng của mũi tên giúp biến sự tương đồng ngữ nghĩa thành khái
      niệm góc hình học đo được bằng số thực.
  - show: '<p><b>Cô-sin của góc</b> giữa hai mũi tên đo mức <b>cùng hướng</b>:</p>

      <table class="t"><tr><th>góc</th><th>0°</th><th>45°</th><th>90°</th><th>180°</th></tr>

      <tr><td>cô-sin</td><td>1</td><td>≈ 0,707</td><td>0</td><td>−1</td></tr></table>

      <p>Hình học cho một đẳng thức: $u \cdot v = \lVert u \rVert \cdot \lVert v \rVert \cdot \cos(\text{góc})$. Vì vậy hai
      vector <b>vuông góc</b> (90°) thì tích vô hướng bằng 0, ví dụ $(1, 0) \cdot (0, 1) = 0$.</p>

      '
    introduces:
    - cos
    focus:
    - 1
    - '2.2'
    - '2.2'
    - 3
    - 3
    - 3
    say: Cô-sin của góc giữa hai mũi tên đo mức cùng hướng của chúng. Góc 0 độ cho cô-sin bằng 1, góc 45 độ cho khoảng 0 phẩy
      707. Góc vuông 90 độ cho 0, còn góc 180 độ, tức ngược hướng, cho trừ 1. Hình học cho một đẳng thức, tích vô hướng bằng
      tích hai độ dài nhân cô-sin của góc giữa chúng. Vì vậy hai vector vuông góc thì tích vô hướng bằng 0, ví dụ 1, 0 và
      0, 1. Nắm chuẩn dải giá trị cô-sin từ âm một tới dương một làm nền để đọc hiểu điểm tương đồng ở mọi hệ tìm kiếm vector.
- id: sym
  kind: symbol
  title: 'Giải mã: giả thuyết phân bố, vector nhúng, cosin'
  steps:
  - show: '<p><b>Giả thuyết phân bố</b>: từ xuất hiện trong <b>ngữ cảnh giống nhau</b> thì có nghĩa gần nhau (“mèo kêu, mèo
      ăn cá” và “chó kêu, chó ăn xương”).</p>

      <p><b>Vector nhúng</b>: mỗi từ tố ứng với một vector số thực (từ hàng trăm tới hơn mười nghìn chiều; ví dụ mô hình 175
      tỉ tham số năm 2020 dùng 12&nbsp;288 chiều — Brown và cộng sự), mô hình học sao cho từ cùng ngữ cảnh có vector gần nhau.</p>

      <p><b>Độ tương tự cosin</b>: $\cos(u, v) = \frac{u \cdot v}{\lVert u \rVert \, \lVert v \rVert}$ — chính là cô-sin của
      góc giữa hai vector, rút ra từ đẳng thức ở trên; chỉ phụ thuộc <b>hướng</b>: 1 là cùng hướng, 0 là vuông góc, −1 là
      ngược hướng.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    - 3
    say: Giả thuyết phân bố nói rằng từ xuất hiện trong ngữ cảnh giống nhau thì có nghĩa gần nhau, như mèo kêu, mèo ăn cá,
      và chó kêu, chó ăn xương. Vector nhúng cho mỗi từ tố một vector số thực, từ hàng trăm tới hơn mười nghìn chiều, ví dụ
      mô hình 175 tỉ tham số năm 2020 dùng 12 nghìn 288 chiều. Mô hình học sao cho từ cùng ngữ cảnh có vector gần nhau. Độ
      tương tự cô-sin bằng tích vô hướng của u và v, chia tích độ dài của chúng, tức chính cô-sin của góc giữa hai vector.
      Nó chỉ phụ thuộc hướng, 1 là cùng hướng, 0 là vuông góc, và trừ 1 là ngược hướng. Giả thuyết phân bố biến thống kê đồng
      xuất hiện lân cận thành tọa độ thực nơi các khái niệm cùng họ tự động co cụm gần nhau.
- id: intuition
  kind: intuition
  title: Gần nghĩa là gần hướng
  steps:
  - show: '<div><svg width="1500" height="340" viewBox="0 0 1500 340"><defs><marker id="arL3" viewBox="0 0 10 10" refX="9"
      refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z"
      fill="#2a78d6"/></marker>

