id: L03
course: LLM
series: "LLM · Mô hình ngôn ngữ lớn"
title: "Bài 3 — Vector nhúng và độ tương tự cosin"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/llm.yaml L03; audit/llm/verify_llm.py L03; Z. Harris, Distributional Structure (1954) — giả thuyết phân bố; T. Mikolov và cộng sự, Efficient Estimation of Word Representations in Vector Space (2013); Jurafsky–Martin bản 3, chương 6; CS115 bài 1 (tích vô hướng, độ dài)"
assumes: [arith, sqrt, frac, norm, cdot, approx]
# Quy ước: cos(u, v) = (u · v) / (‖u‖ · ‖v‖) như CS115 bài 1 (alg.cosine). Các vector ở bài là vector ĐỒ CHƠI ít chiều để thấy ý tưởng;
#   vector nhúng thật có hàng trăm tới hàng nghìn chiều và do mô hình học ra. Vector đếm đồng xuất hiện ở lỗi 1 là số minh hoạ dựng tay.
objectives:
  - "Giải thích giả thuyết phân bố"
  - "Tính độ tương tự cosin"
  - "Biết giới hạn của độ tương tự giữa vector nhúng"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Máy biết “mèo” gần “chó” hơn “ô tô”?"
    steps:
      - show: |
          <p>Với máy, “mèo” chỉ là một mã số. Nếu mỗi từ là một vector toàn số 0 với một số 1, mọi cặp từ đều “xa” như nhau — mèo cách chó bằng mèo cách ô tô. Nhưng ta muốn mô hình hiểu rằng câu nói về mèo cũng thường đúng với chó.</p>
          <div class="box key">Hôm nay: <b>vector nhúng</b> — biểu diễn từ tố bằng vector số thực để từ gần nghĩa nằm gần nhau, đo bằng <b>độ tương tự cosin</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, với máy, mèo chỉ là một mã số. Nếu mỗi từ là một vector toàn số 0 với một số 1, mọi cặp từ đều xa như nhau, mèo cách chó bằng mèo cách ô tô. Nhưng ta muốn mô hình hiểu rằng câu nói về mèo cũng thường đúng với chó. Hôm nay ta học vector nhúng, biểu diễn từ tố bằng vector số thực để từ gần nghĩa nằm gần nhau, và đo bằng độ tương tự cô-sin."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tích vô hướng và độ dài vector"
    checks:
      - "1 * 3 + 2 * 4 == 11 and math.sqrt(3 ** 2 + 4 ** 2) == 5"
    steps:
      - show: |
          <table class="t"><tr><th>phép</th><th>cách tính</th><th>ví dụ</th></tr>
          <tr><td>tích vô hướng</td><td>nhân từng cặp thành phần rồi cộng</td><td>$(1, 2) \cdot (3, 4) = 1 \cdot 3 + 2 \cdot 4 = 11$</td></tr>
          <tr><td>độ dài</td><td>căn của tổng bình phương</td><td>$\lVert (3, 4) \rVert = \sqrt{9 + 16} = 5$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Ở khoá toán, ta đã học hai phép tính trên vector. Tích vô hướng nhân từng cặp thành phần rồi cộng, ví dụ 1 nhân 3 cộng 2 nhân 4 bằng 11. Độ dài là căn của tổng bình phương, vector 3, 4 có độ dài căn của 9 cộng 16, bằng 5."

  - id: sym
    kind: symbol
    title: "Giải mã: giả thuyết phân bố, vector nhúng, cosin"
    steps:
      - show: |
          <p><b>Giả thuyết phân bố</b>: từ xuất hiện trong <b>ngữ cảnh giống nhau</b> thì có nghĩa gần nhau (“mèo kêu, mèo ăn cá” và “chó kêu, chó ăn xương”).</p>
          <p><b>Vector nhúng</b>: mỗi từ tố ứng với một vector số thực (hàng trăm tới hàng nghìn chiều), mô hình học sao cho từ cùng ngữ cảnh có vector gần nhau.</p>
          <p><b>Độ tương tự cosin</b>: $\cos(u, v) = \frac{u \cdot v}{\lVert u \rVert \, \lVert v \rVert}$ — chỉ phụ thuộc <b>hướng</b>: 1 là cùng hướng, 0 là vuông góc, −1 là ngược hướng.</p>
        introduces: [cos]
        focus: [1, 2, 3, 3]
        say: "Giả thuyết phân bố nói rằng từ xuất hiện trong ngữ cảnh giống nhau thì có nghĩa gần nhau, như mèo kêu, mèo ăn cá, và chó kêu, chó ăn xương. Vector nhúng cho mỗi từ tố một vector số thực, hàng trăm tới hàng nghìn chiều, và mô hình học sao cho từ cùng ngữ cảnh có vector gần nhau. Độ tương tự cô-sin bằng tích vô hướng của u và v, chia tích độ dài của chúng. Nó chỉ phụ thuộc hướng, 1 là cùng hướng, 0 là vuông góc, và trừ 1 là ngược hướng."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Gần nghĩa là gần hướng"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><defs><marker id="arL3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
          <marker id="arL3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
          <line x1="560" y1="300" x2="1060" y2="300" stroke="#6b7280" stroke-width="2"/><line x1="560" y1="300" x2="560" y2="30" stroke="#6b7280" stroke-width="2"/>
          <line x1="560" y1="300" x2="900" y2="80" stroke="#2a78d6" stroke-width="4" marker-end="url(#arL3)"/>
          <line x1="560" y1="300" x2="960" y2="120" stroke="#2a78d6" stroke-width="4" marker-end="url(#arL3)"/>
          <line x1="560" y1="300" x2="1020" y2="280" stroke="#9ca3af" stroke-width="4" marker-end="url(#arL3b)"/>
          <path d="M700,214 A160,160 0 0,1 715,226" fill="none" stroke="#eb6834" stroke-width="3"/>
          <g font-size="26" font-weight="bold" fill="#1f2937"><text x="910" y="72">mèo</text><text x="975" y="118">chó</text><text x="1035" y="285">ô tô</text></g>
          <g font-size="23" fill="#1f2937"><text x="1100" y="160">góc nhỏ → cosin gần 1</text><text x="1100" y="250">góc lớn → cosin nhỏ</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ ba vector nhúng trong hai chiều cho dễ nhìn. Vector của mèo và chó chỉ gần cùng một hướng, góc giữa chúng nhỏ, nên cô-sin gần 1. Vector của ô tô chỉ sang hướng khác hẳn, góc lớn, nên cô-sin nhỏ, dù ba vector có thể dài ngắn khác nhau."

  - id: example
    kind: example
    title: "Tính cosin và một phép tương tự"
    checks:
      - "round(alg.cosine([1, 2, 0], [2, 3, 1]), 3) == 0.956 and alg.cosine([1, 2, 0], [-2, 1, 0]) == 0 and 1 * 2 + 2 * 3 + 0 * 1 == 8"
      - "tuple(x - y + z for x, y, z in zip((1, 1, 0), (0, 1, 0), (0, 0, 1))) == (1, 0, 1) and round(alg.cosine((1, 0, 1), (0, 0, 1)), 3) == 0.707"
    steps:
      - show: |
          <p>Hai vector $u = (1, 2, 0)$, $v = (2, 3, 1)$. <b>Bước 1 — tử số:</b> $u \cdot v = 1 \cdot 2 + 2 \cdot 3 + 0 \cdot 1 = 8$.</p>
        say: "Xét hai vector u bằng 1, 2, 0 và v bằng 2, 3, 1. Bước một, tử số là tích vô hướng, 1 nhân 2 cộng 2 nhân 3 cộng 0 nhân 1, bằng 8."
      - show: |
          <p><b>Bước 2 — mẫu số:</b> $\lVert u \rVert = \sqrt{1 + 4 + 0} = \sqrt{5}$, $\lVert v \rVert = \sqrt{4 + 9 + 1} = \sqrt{14}$, tích $= \sqrt{70}$.</p>
        say: "Bước hai, mẫu số là tích hai độ dài, độ dài của u là căn 5, của v là căn 14, nên tích bằng căn 70."
      - show: |
          $$\cos(u, v) = \frac{8}{\sqrt{70}} \approx \frac{8}{8{,}367} \approx \hl{0{,}956}$$
          <p>Gần 1 → gần cùng hướng. Còn $\cos((1, 2, 0), (-2, 1, 0)) = \frac{-2 + 2 + 0}{\dots} = 0$ — vuông góc, không liên quan.</p>
        introduces: [dots]
        focus: [1, 2, 2]
        say: "Bước ba, chia tử cho mẫu, 8 chia căn 70 xấp xỉ 0 phẩy 956, gần 1, nên gần cùng hướng. Ngược lại, vector 1, 2, 0 và vector trừ 2, 1, 0 có tích vô hướng bằng 0. Vì vậy hai vector này vuông góc với nhau, tức là không liên quan gì về nghĩa."
      - clear: true
        show: |
          <table class="t"><tr><th>vector đồ chơi (hoàng gia, nam, nữ)</th><th>giá trị</th></tr>
          <tr><td>vua − đàn ông + phụ nữ</td><td>(1, 1, 0) − (0, 1, 0) + (0, 0, 1) = (1, 0, 1)</td></tr>
          <tr><td>gần nhất theo cosin</td><td>nữ hoàng (1, 0, 1): cos = <b>1</b>; phụ nữ: 0,707</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước bốn là một phép tương tự với vector đồ chơi ba chiều, hoàng gia, nam và nữ. Vua trừ đàn ông cộng phụ nữ ra vector 1, 0, 1. Từ gần nhất theo cô-sin là nữ hoàng, với cô-sin bằng 1, tiếp theo là phụ nữ với 0 phẩy 707."

  - id: check
    kind: check
    title: "Tự kiểm: cosin không đổi khi kéo dài vector"
    checks:
      - "round(alg.cosine([2, 4, 0], [2, 3, 1]), 3) == round(alg.cosine([1, 2, 0], [2, 3, 1]), 3) == 0.956 and round(alg.cosine([1, 2, 0], [2, 4, 0]), 9) == 1"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>vì sao</th><th>kết quả</th></tr>
          <tr><td>$\cos((2, 4, 0), (2, 3, 1))$</td><td>gấp đôi $u$: tử gấp đôi, mẫu gấp đôi</td><td>vẫn 0,956 ✓</td></tr>
          <tr><td>$\cos((1, 2, 0), (2, 4, 0))$</td><td>cùng hướng, khác độ dài</td><td>đúng 1 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, kéo dài vector rồi tính lại. Gấp đôi u thì tử số gấp đôi và mẫu số cũng gấp đôi, nên cô-sin vẫn là 0 phẩy 956. Vector 1, 2, 0 và 2, 4, 0 cùng hướng chỉ khác độ dài, nên cô-sin đúng bằng 1."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "round(alg.cosine([3, 2, 4, 0], [3, 2, 3, 0]), 2) == 0.99 and round(alg.cosine([3, 2, 4, 0], [0, 1, 1, 4]), 3) == 0.263"
      - "sum(x * y for x, y in zip([10, 20, 0], [2, 3, 1])) == 80 and round(alg.cosine([10, 20, 0], [2, 3, 1]), 3) == 0.956"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi “gần nhau” là “đồng nghĩa” <b class="red">(trái nghĩa cũng gần)</b>
          <br><span class="note">Đếm ngữ cảnh (trời, nước, rất, món): “nóng” (3, 2, 4, 0), “lạnh” (3, 2, 3, 0), “ngon” (0, 1, 1, 4). cos(nóng, lạnh) ≈ <b>0,99</b>, cos(nóng, ngon) ≈ 0,263 — trái nghĩa nhưng cùng ngữ cảnh nên rất gần.</span></div>
        say: "Lỗi thứ nhất, coi gần nhau là đồng nghĩa, trong khi từ trái nghĩa cũng gần. Đếm số lần xuất hiện cùng bốn từ ngữ cảnh, nóng và lạnh có vector đếm gần giống nhau, còn ngon thì khác. Cô-sin giữa nóng và lạnh xấp xỉ 0 phẩy 99, giữa nóng và ngon chỉ 0 phẩy 263, trái nghĩa nhưng cùng ngữ cảnh nên rất gần."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> So bằng tích vô hướng thô <b class="red">(lẫn với độ dài)</b>
          <br><span class="note">Nhân vector đầu lên 10 lần: tích vô hướng tăng từ 8 lên 80, nhưng cosin vẫn 0,956. Vector của từ hay gặp thường dài hơn — dùng cosin (hoặc chuẩn hoá độ dài trước).</span></div>
        say: "Lỗi thứ hai, so bằng tích vô hướng thô, nên lẫn với độ dài. Nhân vector đầu lên 10 lần thì tích vô hướng tăng từ 8 lên 80, nhưng cô-sin vẫn 0 phẩy 956. Vector của từ hay gặp thường dài hơn, nên hãy dùng cô-sin, hoặc chuẩn hoá độ dài trước."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> So vector của hai mô hình khác nhau <b class="red">(vô nghĩa)</b>
          <br><span class="note">Mỗi mô hình học một hệ toạ độ riêng; chiều thứ 5 ở mô hình này không có nghĩa gì với mô hình kia. Chỉ so vector sinh từ cùng một mô hình.</span></div>
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Dùng một ngưỡng cosin cố định cho mọi mô hình <b class="red">(lọc sai)</b>
          <br><span class="note">Có mô hình cho hầu hết các cặp cosin trên 0,7, có mô hình cho dưới 0,3 (số minh hoạ). Ngưỡng “giống nhau” phải chỉnh trên vài trăm cặp đã gắn nhãn của chính bài toán.</span></div>
        focus: [1, 1, 1, 2, 2, 2]
        say: "Lỗi thứ ba, so vector của hai mô hình khác nhau, điều này vô nghĩa. Mỗi mô hình học một hệ toạ độ riêng, chiều thứ năm ở mô hình này không có nghĩa gì với mô hình kia. Chỉ so vector sinh từ cùng một mô hình. Lỗi thứ tư, người đã đi làm cũng hay mắc, là dùng một ngưỡng cô-sin cố định cho mọi mô hình. Có mô hình cho hầu hết các cặp cô-sin trên 0 phẩy 7, có mô hình cho dưới 0 phẩy 3, đây là số minh hoạ. Ngưỡng giống nhau phải được chỉnh trên vài trăm cặp đã gắn nhãn của chính bài toán."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.cosine([1, 0], [1, 1]), 3) == 0.707 and alg.cosine([1, 1], [-1, -1]) == -1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính $\cos((1, 0), (1, 1))$.</td></tr>
          <tr><td>2</td><td>Hai vector $(1, 1)$ và $(-1, -1)$ có cosin bằng bao nhiêu? Điều đó nói gì về hướng?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tính cô-sin của hai vector 1, 0 và 1, 1. Câu hai, hai vector 1, 1 và trừ 1, trừ 1 có cô-sin bằng bao nhiêu? Điều đó nói gì về hướng? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Tử: $1 \cdot 1 + 0 \cdot 1 = 1$. Mẫu: $1 \cdot \sqrt{2}$. $\cos = \frac{1}{\sqrt{2}} \approx \hl{0{,}707}$ — lệch nhau 45 độ.</p>
        say: "Đáp án câu một, tử số bằng 1 nhân 1 cộng 0 nhân 1, bằng 1, mẫu số bằng 1 nhân căn 2, nên cô-sin xấp xỉ 0 phẩy 707, tức hai vector lệch nhau 45 độ."
      - show: |
          <p>② Tử: $1 \cdot (-1) + 1 \cdot (-1) = -2$. Mẫu: $\sqrt{2} \cdot \sqrt{2} = 2$. $\cos = \hl{-1}$ — ngược hướng hoàn toàn.</p>
        say: "Câu hai, tử số bằng trừ 1 cộng trừ 1, bằng trừ 2, mẫu số bằng căn 2 nhân căn 2, bằng 2, nên cô-sin bằng trừ 1, tức ngược hướng hoàn toàn."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cùng ngữ cảnh → gần nghĩa</span><span class="a">→</span>
          <span class="n">từ tố thành vector số thực</span><span class="a">→</span>
          <span class="n">cosin đo hướng, bỏ qua độ dài</span><span class="a">→</span>
          <span class="n">gần ≠ đồng nghĩa</span></div>
        say: "Tổng kết lại, từ cùng ngữ cảnh thì gần nghĩa, nên ta biến từ tố thành vector số thực. Cô-sin đo hướng và bỏ qua độ dài, và nhớ rằng gần nhau chưa chắc là đồng nghĩa."
      - show: |
          <div class="box key"><b>Tư duy:</b> vector nhúng ghi lại <b>cách từ được dùng</b>, không ghi lại định nghĩa của từ.</div>
        say: "Điều cần mang theo, vector nhúng ghi lại cách từ được dùng, không ghi lại định nghĩa của từ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): mô hình giải mã dùng <b>cơ chế chú ý</b> — mặt nạ nhân quả và thông tin vị trí.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học mô hình giải mã dùng cơ chế chú ý, với mặt nạ nhân quả và thông tin vị trí. Hẹn gặp bạn ở bài tiếp theo."
