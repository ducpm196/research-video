rate: "-5%"
depth: full
source: "curriculum/rln.yaml L08; audit/rln/verify_rln.py L08; audit/rln/sources_L08.md; R. S. Sutton, A. G. Barto, Reinforcement Learning: An Introduction, bản 2 (2018), mục 13.5 (diễn viên–nhà phê bình một bước, công thức 13.12–13.14), PDF chính thức incompleteideas.net/book/RLbook2020.pdf; RLN bài 1 (giá trị Q và V), bài 4 (sai số đen-ta), bài 7 (đường cơ sở)"
assumes: [arith, power, approx, frac, cdot, sub, disc, dots, policy, lr, assign, prime, tderr, param, nabla, log, sigm, expect, prob, given]
# Quy ước: diễn viên = chính sách π(a | s; θ) (hai hành động, π(a₁) = σ(θ) như bài 7); nhà phê bình = bảng ước lượng V(s);
#   lợi thế A(s, a) = Q(s, a) − V(s); ước lượng một bước của nó là đen-ta = r + γ·V(s') − V(s). Hai tốc độ học viết α_θ (diễn viên) và
#   α_V (nhà phê bình). Mọi số (r = 1, γ = 0,9, V = 4 và 5, α = 0,1) là SỐ MINH HOẠ của giáo án; σ(0,075) ≈ 0,519 tính bằng checks.
objectives:
  - "Tính lợi thế ước lượng A = r + γ·V(s') − V(s) và đọc dấu của nó"
  - "Chạy một bước cập nhật cho cả diễn viên và nhà phê bình"
  - "Chỉ ra bằng số rằng nhà phê bình sai thì diễn viên học sai, kể cả sai lệch đều mọi trạng thái"
asr_reviewed:
