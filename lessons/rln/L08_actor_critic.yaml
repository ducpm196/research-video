  - {sentence: "Theta mới là 0 cộng 0 phẩy 1 nhân 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 025.", reason: "ASR chép “TETA mới là không cộng không phải 1 nhân, không phải 5 nhân, không phải 5, bằng không phải 0.25.” (0.756): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; theta đọc “tê-ta” theo lexicon RLN (probe p1: 7/8), ASR viết “teta” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bây giờ đến lượt bạn, với gam-ma 0 phẩy 9, an-pha theta 0 phẩy 1, an-pha V 0 phẩy 2, theta bằng 0, và tác tử chọn hành động một.", reason: "ASR chép “Bây giờ đến lượt bạn, với gamma 0.9, an pha teta 0.1, an pha v0.2, teta bàn không và tác tử chọn hành động 1.” (0.806): gam-ma (γ) ASR viết “gamma”; “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; theta đọc “tê-ta” theo lexicon RLN (probe p1: 7/8), ASR viết “teta”; lệch âm/thanh thuần Việt: bằng/bàn — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nếu đi chắc chắn tới s phẩy thì Q bằng r cộng gam-ma nhân V của s phẩy, ví dụ 5 phẩy 5.", reason: "ASR chép “Nếu đi chắc chắn tới f' thì quy bằng r cộng gamma nhân v của f', ví dụ 5,5.” (0.851): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; gam-ma (γ) ASR viết “gamma” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước hai, giống bài 4, ta thay G bằng đích một bước, r cộng gam-ma nhân V của s phẩy, nên không phải chờ hết lượt.", reason: "ASR chép “Bước 2, giống bài 4, ta thay dê bằng đích 1 bước r cộng gamma nhân v của f' nền không phải chờ hết lượt.” (0.868): gam-ma (γ) ASR viết “gamma”; chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: nên/nền — NOT_VERIFIED bằng tai người"}
