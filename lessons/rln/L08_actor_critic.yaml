          <text x="200" y="318" font-size="21" fill="#eb6834" text-anchor="middle">sửa theta theo đen-ta</text>
          <text x="900" y="348" font-size="21" fill="#eb6834" text-anchor="middle">sửa V(s) theo đen-ta</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy hai bộ phận. Diễn viên là chính sách, chọn hành động a, và môi trường trả về phần thưởng cùng trạng thái mới. Nhà phê bình giữ bảng giá trị V, dùng nó để tính đen-ta, tức thưởng ngay cộng gam-ma nhân giá trị trạng thái mới, trừ giá trị trạng thái cũ. Cùng một con số đen-ta đi hai đường, nó sửa chính sách của diễn viên, và sửa bảng giá trị của chính nhà phê bình."
        introduces: [cdot]

  # ───────────────────────── 5. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Từ đường cơ sở của bài 7 tới lợi thế một bước"
    checks:
      - "round(1 + 0.9 * 5 - 4, 10) == 1.5"
      - "round(0.5 * (1 + 0.9 * 5) + 0.5 * (1 + 0.9 * 3) - 4, 10) == 0.6"
    steps:
      - show: |
          <p><b>Bước 1.</b> Theo bài 7, đường cơ sở nên gần lợi nhuận trung bình của trạng thái; lựa chọn tự nhiên là giá trị của trạng thái, $b = V(s)$:</p>
          $$\theta \leftarrow \theta + \alpha_\theta \cdot \big(G - V(s)\big) \cdot \nabla \ln \pi(a \mid s)$$
        focus: [1, 2]
        say: "Bước một, theo bài 7, đường cơ sở nên gần lợi nhuận trung bình của trạng thái, nên lựa chọn tự nhiên là b bằng V của s. Cập nhật là theta cộng an-pha theta nhân G trừ V của s, nhân gradient lôgarit pi."
      - show: |
          <p><b>Bước 2.</b> Như bài 4, thay $G$ bằng đích một bước $r + \gamma \cdot V(s')$, nên không phải chờ hết lượt:</p>
          $$G - V(s) \quad \text{thành} \quad r + \gamma \cdot V(s') - V(s) = \hlo{\delta}$$
          <p class="note">Làm thử: $r = 1$, $\gamma = 0{,}9$, $V(s') = 5$, $V(s) = 4$: $\delta = 1 + 4{,}5 - 4 = 1{,}5$.</p>
        introduces: [assign]
        focus: [1, 2, 3]
        say: "Bước hai, giống bài 4, ta thay G bằng đích một bước, r cộng gam-ma nhân V của s phẩy, nên không phải chờ hết lượt. Phần G trừ V của s trở thành đen-ta. Làm thử với r bằng 1, gam-ma 0 phẩy 9, V của s phẩy bằng 5, V của s bằng 4, ta được đen-ta bằng 1 cộng 4 phẩy 5 trừ 4, bằng 1 phẩy 5."
      - clear: true
        show: |
          <p><b>Bước 3 — vì sao đen-ta ước lượng lợi thế.</b> Khi nhà phê bình đoán đúng giá trị, lấy kỳ vọng theo trạng thái sau: $\mathbb{E}[r + \gamma \cdot V(s')] = Q(s, a)$ theo bài 1, nên</p>
          $$\mathbb{E}[\delta \mid s, a] = Q(s, a) - V(s) = A(s, a)$$
          <p class="note">Làm thử khi $s'$ ngẫu nhiên: nửa số lần tới ô giá trị 5, nửa tới ô giá trị 3. Hai mẫu đen-ta là 1,5 và −0,3; trung bình 0,6 = $\big(1 + 0{,}9 \cdot 4\big) - 4$ ✓.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Bước ba giải thích vì sao đen-ta ước lượng lợi thế. Khi nhà phê bình đoán đúng giá trị, lấy kỳ vọng theo trạng thái sau, thưởng ngay cộng gam-ma nhân V của s phẩy có kỳ vọng đúng bằng Q của s và a theo bài 1. Vì vậy kỳ vọng của đen-ta bằng Q trừ V, tức lợi thế. Làm thử khi trạng thái sau ngẫu nhiên, nửa số lần tới ô giá trị 5, nửa tới ô giá trị 3. Hai mẫu đen-ta là 1 phẩy 5 và âm 0 phẩy 3, trung bình 0 phẩy 6, đúng bằng Q là 4 phẩy 6 trừ V là 4."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Một bước của cả hai bộ phận"
    checks:
      - "round(1 + 0.9 * 5 - 4, 10) == 1.5"
      - "round(0 + 0.1 * 1.5 * 0.5, 10) == 0.075 and round(1 / (1 + math.exp(-0.075)), 3) == 0.519"
      - "round(4 + 0.1 * 1.5, 10) == 4.15"
      - "round(1 + 0.9 * 5 - 4.15, 10) == 1.35"
    steps:
      - show: |
          <p>Hai hành động, $\theta = 0$ (mỗi bên 0,5); tác tử chọn hành động 1, nhận $r = 1$, sang $s'$. Nhà phê bình đang có $V(s) = 4$, $V(s') = 5$; $\gamma = 0{,}9$; $\alpha_\theta = \alpha_V = 0{,}1$.</p>
          <p><b>Bước 1 — nhà phê bình chấm.</b> $\delta = 1 + 0{,}9 \cdot 5 - 4 = \hlb{1{,}5}$: dương, hành động tốt hơn mức thường.</p>
        focus: [1, 1, 1, 2]
        say: "Xét hai hành động, theta bằng 0 nên mỗi bên 0 phẩy 5. Tác tử chọn hành động một, nhận r bằng 1, sang trạng thái mới. Nhà phê bình đang có V của s bằng 4 và V của s phẩy bằng 5, gam-ma 0 phẩy 9, hai tốc độ học đều 0 phẩy 1. Bước một, nhà phê bình chấm đen-ta bằng 1 cộng 0 phẩy 9 nhân 5 trừ 4, bằng 1 phẩy 5, dương nên hành động tốt hơn mức thường."
      - show: |
          <p><b>Bước 2 — diễn viên sửa.</b> $\nabla \ln \pi(a_1) = 0{,}5$ ở $\theta = 0$ (bài 7):</p>
          $$\theta \leftarrow 0 + 0{,}1 \cdot 1{,}5 \cdot 0{,}5 = \hlg{0{,}075}, \qquad \pi(a_1) = \sigma(0{,}075) \approx 0{,}519$$
        focus: [1, 2]
        say: "Bước hai, diễn viên sửa, vì gradient lôgarit pi của hành động một ở theta bằng 0 là 0 phẩy 5, như bài 7. Theta mới bằng 0 cộng 0 phẩy 1 nhân 1 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 075, nên xác suất hành động một tăng từ 0 phẩy 5 lên khoảng 0 phẩy 519."
      - show: |
          <p><b>Bước 3 — nhà phê bình tự sửa.</b> Như bài 4: $V(s) \leftarrow 4 + 0{,}1 \cdot 1{,}5 = \hlg{4{,}15}$.</p>
        focus: [1]
        say: "Bước ba, nhà phê bình tự sửa giống bài 4, V của s thay bằng 4 cộng 0 phẩy 1 nhân 1 phẩy 5, bằng 4 phẩy 15."
      - clear: true
        show: |
          <table class="t"><tr><th>sau bước này</th><th>trước</th><th>sau</th></tr>
          <tr><td>xác suất hành động 1</td><td>0,5</td><td>≈ 0,519</td></tr>
          <tr><td>$V(s)$</td><td>4</td><td>4,15</td></tr>
          <tr><td>đen-ta nếu gặp lại đúng bước này</td><td>1,5</td><td>$1 + 4{,}5 - 4{,}15 = 1{,}35$</td></tr></table>
          <p class="note">Nhà phê bình nâng mức “trung bình”, nên lần sau cùng hành động đó được chấm ít hơn: tín hiệu tự co lại khi đã học xong.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước bốn, đặt kết quả cạnh nhau. Xác suất hành động một tăng từ 0 phẩy 5 lên khoảng 0 phẩy 519. Giá trị V của s tăng từ 4 lên 4 phẩy 15. Nếu gặp lại đúng bước này, đen-ta chỉ còn 1 phẩy 35. Vì nhà phê bình nâng mức trung bình, lần sau cùng hành động đó được chấm ít hơn, nên tín hiệu tự co lại khi đã học xong."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: tính lợi thế thẳng từ Q và V, và cộng nhiều mẫu"
    checks:
      - "round((1 + 0.9 * 5) - 4, 10) == 1.5"
      - "(lambda r: abs(sum(1 + 0.9 * (5 if r.random() < 0.5 else 3) - 4 for _ in range(20000)) / 20000 - 0.6) < 0.02)(__import__('random').Random(8))"
    steps:
      - show: |
          <p><b>Đường khác 1 — từ định nghĩa:</b> đi chắc chắn tới $s'$ nên $Q(s, a_1) = 1 + 0{,}9 \cdot 5 = 5{,}5$; lợi thế $= 5{,}5 - 4 = 1{,}5$ — đúng bằng đen-ta ✓.</p>
        say: "Kiểm tra thứ nhất dùng định nghĩa, vì đi chắc chắn tới s phẩy nên Q bằng 1 cộng 0 phẩy 9 nhân 5, bằng 5 phẩy 5. Lợi thế bằng 5 phẩy 5 trừ 4, bằng 1 phẩy 5, đúng bằng đen-ta."
      - show: |
          <p><b>Đường khác 2 — cộng nhiều mẫu:</b> trạng thái sau ngẫu nhiên (giá trị 5 hoặc 3, mỗi bên một nửa). Máy lấy 20&nbsp;000 mẫu đen-ta:</p>
          <table class="t"><tr><th>cách</th><th>lợi thế</th></tr>
          <tr><td>định nghĩa: $Q - V = 4{,}6 - 4$</td><td>0,6</td></tr>
          <tr><td>trung bình 20&nbsp;000 mẫu đen-ta</td><td>gần 0,6 (lệch dưới 0,02)</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Kiểm tra thứ hai là cộng nhiều mẫu, khi trạng thái sau ngẫu nhiên có giá trị 5 hoặc 3, mỗi bên một nửa, nên máy lấy 20 nghìn mẫu đen-ta. Theo định nghĩa, lợi thế bằng 4 phẩy 6 trừ 4, bằng 0 phẩy 6. Trung bình 20 nghìn mẫu cũng gần 0 phẩy 6, lệch dưới 0 phẩy 02."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "round(1 + 0.9 * 2 - 4, 10) == -1.2 < 0 < 1.5"
      - "round(1 + 0.9 * 4 - 4, 10) == 0.6 and round(1 + 0.9 * 14 - 14, 10) == -0.4"
      - "round(1 + 0.9 * 0 - 4, 10) == -3"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin điểm chấm khi nhà phê bình còn đoán sai <b class="red">(diễn viên học ngược)</b>
          <br><span class="note">Giá trị thật của $s'$ là 5 nhưng nhà phê bình đoán 2: $\delta = 1 + 1{,}8 - 4 = -1{,}2$ — hạ xác suất một hành động tốt. Phép thử: so $V$ với lợi nhuận thật của vài lượt đầy đủ.</span></div>
        say: "Lỗi thứ nhất, tin điểm chấm khi nhà phê bình còn đoán sai, nên diễn viên học ngược. Giá trị thật của trạng thái sau là 5 nhưng nhà phê bình đoán 2, đen-ta thành âm 1 phẩy 2, hạ xác suất một hành động tốt. Phép thử là so V với lợi nhuận thật của vài lượt đầy đủ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên trạng thái kết thúc có giá trị 0 <b class="red">(chấm sai bước cuối)</b>
          <br><span class="note">Bước cuối với $r = 1$, $V(s) = 4$: đúng là $\delta = 1 + 0 - 4 = -3$; cộng nhầm giá trị đoán của ô kết thúc thì sai. Phép thử: bước cuối thì đen-ta chỉ là $r - V(s)$.</span></div>
        say: "Lỗi thứ hai, quên rằng trạng thái kết thúc có giá trị 0, nên chấm sai bước cuối. Với r bằng 1 và V của s bằng 4, đúng là đen-ta bằng 1 cộng 0 trừ 4, bằng âm 3. Phép thử là ở bước cuối, đen-ta chỉ là r trừ V của s."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Hiểu đen-ta bằng 0 là “hành động dở” <b class="red">(chỉ là đúng như dự đoán)</b>
          <br><span class="note">Đen-ta đo chênh so với mức đã dự đoán. Bằng 0 nghĩa là không có gì mới để học, xác suất giữ nguyên. Phép thử: đọc dấu, không đọc độ lớn của phần thưởng.</span></div>
        say: "Lỗi thứ ba, hiểu đen-ta bằng 0 là hành động dở, trong khi nó chỉ có nghĩa là đúng như dự đoán. Đen-ta đo chênh lệch so với mức đã dự đoán, bằng 0 nghĩa là không có gì mới để học, và xác suất giữ nguyên. Phép thử là đọc dấu của đen-ta, không đọc độ lớn của phần thưởng."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Chỉ theo dõi điểm của diễn viên, không theo dõi sai số của nhà phê bình <b class="red">(lệch đều cũng đổi dấu)</b></div>
          <table class="t"><tr><th>$r = 1$, $\gamma = 0{,}9$, ô sau giá trị thật trung bình 4, ô hiện tại 4</th><th>đen-ta trung bình</th></tr>
          <tr><td>nhà phê bình đúng</td><td>0,6</td></tr>
          <tr><td>nhà phê bình đoán cao hơn 10 ở <b>mọi</b> ô: $1 + 0{,}9 \cdot 14 - 14$</td><td>$\hl{-0{,}4}$</td></tr></table>
          <p class="note">Lệch đều $c$ làm đen-ta lệch $-(1 - \gamma) \cdot c = -1$. Theo dõi cả hai mất mát: sai số của nhà phê bình và điểm của diễn viên.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, chỉ theo dõi điểm của diễn viên mà không theo dõi sai số của nhà phê bình. Khi nhà phê bình đúng, đen-ta trung bình là 0 phẩy 6. Khi nhà phê bình đoán cao hơn 10 ở mọi ô, đen-ta trung bình thành âm 0 phẩy 4, đổi dấu. Vì một độ lệch đều c làm đen-ta lệch âm 1 trừ gam-ma nhân c, tức âm 1, nên hãy theo dõi cả hai mất mát."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: hai bước, và chọn cách học cho lượt rất dài"
    checks:
      - "round(2 + 0.9 * 5 - 6, 10) == 0.5 and round(6 + 0.2 * 0.5, 10) == 6.1 and round(0.1 * 0.5 * 0.5, 10) == 0.025"
      - "round(2 + 0 - 6, 10) == -4"
    steps:
      - show: |
          <p>$\gamma = 0{,}9$, $\alpha_\theta = 0{,}1$, $\alpha_V = 0{,}2$, $\theta = 0$, tác tử chọn hành động 1.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$r = 2$, $V(s) = 6$, $V(s') = 5$. Tính đen-ta, $V(s)$ mới và $\theta$ mới.</td></tr>
          <tr><td>2</td><td>Cũng như vậy nhưng $s'$ là trạng thái kết thúc. Đen-ta bằng bao nhiêu, xác suất hành động 1 tăng hay giảm?</td></tr>
          <tr><td>3</td><td>Mỗi lượt dài 10&nbsp;000 bước. Chọn cách của bài 7 hay diễn viên–nhà phê bình?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với gam-ma 0 phẩy 9, an-pha theta 0 phẩy 1, an-pha V 0 phẩy 2, theta bằng 0, và tác tử chọn hành động một. Câu một, r bằng 2, V của s bằng 6, V của s phẩy bằng 5, hãy tính đen-ta, V của s mới và theta mới. Câu hai, cũng như vậy nhưng s phẩy là trạng thái kết thúc, đen-ta bằng bao nhiêu? Xác suất hành động một tăng hay giảm? Câu ba, mỗi lượt dài 10 nghìn bước, chọn cách của bài 7 hay diễn viên và nhà phê bình? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1 — đen-ta</td><td>$2 + 0{,}9 \cdot 5 - 6$</td><td>0,5</td></tr>
          <tr><td>1 — $V(s)$</td><td>$6 + 0{,}2 \cdot 0{,}5$</td><td>$\hlg{6{,}1}$</td></tr>
          <tr><td>1 — $\theta$</td><td>$0 + 0{,}1 \cdot 0{,}5 \cdot 0{,}5$</td><td>$\hlg{0{,}025}$</td></tr>
          <tr><td>2 — đen-ta</td><td>$2 + 0 - 6$</td><td>$\hl{-4}$: giảm xác suất</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án theo từng dòng. Câu một, đen-ta bằng 2 cộng 4 phẩy 5 trừ 6, bằng 0 phẩy 5. V của s mới là 6 cộng 0 phẩy 2 nhân 0 phẩy 5, bằng 6 phẩy 1. Theta mới là 0 cộng 0 phẩy 1 nhân 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 025. Câu hai, trạng thái kết thúc có giá trị 0, nên đen-ta bằng 2 trừ 6, bằng âm 4, và xác suất hành động một giảm."
      - show: |
          <p><b>Câu 3.</b> Diễn viên–nhà phê bình: học sau từng bước, tín hiệu ít nhiễu hơn lợi nhuận của cả 10&nbsp;000 bước.</p>
          <p class="note">Đánh đổi: thêm thiên lệch theo nhà phê bình. Đổi sang cách của bài 7 khi lượt ngắn và nhà phê bình chưa đáng tin; luôn theo dõi sai số của nhà phê bình.</p>
        focus: [1, 2, 2]
        say: "Câu ba, chọn diễn viên và nhà phê bình, vì nó học sau từng bước, và tín hiệu ít nhiễu hơn lợi nhuận của cả 10 nghìn bước. Cái giá là thêm thiên lệch theo nhà phê bình. Hãy đổi sang cách của bài 7 khi lượt ngắn và nhà phê bình chưa đáng tin, và luôn theo dõi sai số của nhà phê bình."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bài 7: (G − V(s)) nhân gradient của ln π</span><span class="a">→</span>
          <span class="n">thay G bằng r + γ nhân V(s phẩy): đen-ta</span><span class="a">→</span>
          <span class="n">kỳ vọng của đen-ta = lợi thế Q − V</span><span class="a">→</span>
          <span class="n">diễn viên và nhà phê bình cùng sửa theo đen-ta</span></div>
        say: "Tổng kết lại, ta lấy cập nhật của bài 7 với đường cơ sở là V của s, rồi thay G bằng đích một bước, được đen-ta. Kỳ vọng của đen-ta đúng bằng lợi thế Q trừ V, nên diễn viên và nhà phê bình cùng sửa theo một con số."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi một mô hình chấm điểm cho mô hình khác học, lỗi của người chấm thành lỗi của người học — <b>đo cả người chấm</b>.</div>
        say: "Điều cần mang theo, khi một mô hình chấm điểm cho mô hình khác học, lỗi của người chấm thành lỗi của người học, nên hãy đo cả người chấm."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>tối ưu chính sách gần kề</b> — cắt tỉ số giữa chính sách mới và cũ để mỗi bước cập nhật không đi quá xa.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học tối ưu chính sách gần kề, cắt tỉ số giữa chính sách mới và chính sách cũ để mỗi bước cập nhật không đi quá xa. Hẹn gặp bạn ở bài tiếp theo."
