          <rect x="390" y="230" width="230" height="90" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="2.5"/><text x="505" y="267" fill="#1f2937" font-weight="bold">đen-ta</text><text x="505" y="300" fill="#1f2937">r + γ V(s') − V(s)</text>
          </g>
          <line x1="275" y1="100" x2="383" y2="100" stroke="#1f2937" stroke-width="2.5" marker-end="url(#rl8a)"/>
