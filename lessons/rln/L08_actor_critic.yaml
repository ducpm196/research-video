scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Không chờ hết lượt mà vẫn biết hành động vừa rồi tốt hay dở"
    checks:
      - "round(1 + 0.9 * 5 - 4, 10) == 1.5 and round(1 + 0.9 * 2 - 4, 10) == -1.2"
    steps:
      - show: |
          <p>Ở bài 7, tác tử phải chơi <b>hết lượt</b> mới có lợi nhuận $G$ để sửa xác suất. Một lượt dài 10&nbsp;000 bước thì 10&nbsp;000 bước mới học một lần, và tín hiệu rất nhiễu.</p>
          <p>Hôm nay, ngay sau một bước, một “nhà phê bình” chấm hành động vừa làm: <b>+1,5</b>, tức tốt hơn mức thường. Nhưng nếu nhà phê bình đoán sai một con số, điểm chấm đổi thành <b>−1,2</b> — và “diễn viên” học ngược.</p>
          <div class="box key">Hôm nay: hai bộ phận học cùng lúc — diễn viên chọn hành động, nhà phê bình chấm “tốt hơn trung bình bao nhiêu”. Chấm thế nào, và khi nào chấm sai?</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, ở bài 7 tác tử phải chơi hết lượt mới có lợi nhuận G để sửa xác suất. Một lượt dài 10 nghìn bước thì 10 nghìn bước mới học một lần, và tín hiệu lại rất nhiễu. Hôm nay, ngay sau một bước, một nhà phê bình chấm hành động vừa làm là cộng 1 phẩy 5, tức tốt hơn mức thường. Nhưng nếu nhà phê bình đoán sai một con số, điểm chấm đổi thành âm 1 phẩy 2, và diễn viên học ngược. Hôm nay ta xem hai bộ phận học cùng lúc, chấm thế nào, và khi nào chấm sai."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ bài 1, bài 4 và bài 7"
    checks:
      - "round(1 + 0.9 * 5, 10) == 5.5"
      - "round(6 + 0.5 * (1 + 0.9 * 10 - 6), 10) == 8"
      - "alg.rln_pg2(10, 12, b1=11, b2=11)[1] == [-0.5, -0.5]"
      - "round((math.log(1 / (1 + math.exp(-0.001))) - math.log(1 / (1 + math.exp(0.001)))) / 0.002, 6) == 0.5 == 1 - 1 / (1 + math.exp(0))"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 1</td><td>$V(s)$: giá trị của trạng thái; $Q(s, a)$: giá trị khi ở $s$ chọn $a$. Đi chắc chắn tới $s'$ thì $Q(s, a) = r + \gamma \cdot V(s')$</td><td>$r = 1$, $V(s') = 5$, $\gamma = 0{,}9$: $Q = 5{,}5$</td></tr>
          <tr><td>bài 4</td><td>sửa từng bước: $V(s) \leftarrow V(s) + \alpha \cdot \delta$, $\;\delta = r + \gamma \cdot V(s') - V(s)$</td><td>6 → 8 với đen-ta bằng 4, an-pha 0,5</td></tr>
          <tr><td>bài 7</td><td>sửa chính sách theo $(G - b) \cdot \nabla \ln \pi$, với $\nabla \ln \pi$ là đạo hàm theo $\theta$ của ln xác suất (hai hành động, $\pi(a_1) = \sigma(\theta)$: nó bằng $1 - \sigma(\theta)$); đường cơ sở $b$ chỉ phụ thuộc trạng thái thì không lệch</td><td>$\theta = 0$: $\nabla \ln \pi(a_1) = 0{,}5$; $b = 11$: hai mẫu đều −0,5</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Bảng nhắc lại ba điều. Ở bài 1, V của s là giá trị của trạng thái, Q của s và a là giá trị khi ở s chọn a. Nếu đi chắc chắn tới s phẩy thì Q bằng r cộng gam-ma nhân V của s phẩy, ví dụ 5 phẩy 5. Ở bài 4, ta sửa từng bước bằng an-pha nhân đen-ta, như giá trị 6 lên 8. Ở bài 7, ta sửa chính sách theo G trừ đường cơ sở, nhân gradient lôgarit pi, và đường cơ sở chỉ phụ thuộc trạng thái thì không làm lệch. Gradient lôgarit pi là đạo hàm theo theta của lôgarit xác suất, với hai hành động thì của hành động một bằng 1 trừ hàm chữ S của theta, tức 0 phẩy 5 khi theta bằng 0."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: lợi thế A, hai tốc độ học"
    checks:
      - "round(5.5 - 4, 10) == 1.5"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc</th><th>nghĩa</th></tr>
          <tr><td>$A(s, a) = Q(s, a) - V(s)$</td><td>lợi thế của a ở s</td><td>hành động $a$ tốt hơn mức trung bình của trạng thái bao nhiêu; ví dụ $5{,}5 - 4 = 1{,}5$</td></tr>
          <tr><td>$\alpha_\theta$</td><td>an-pha theta</td><td>tốc độ học của <b>diễn viên</b> (sửa tham số theta của chính sách)</td></tr>
          <tr><td>$\alpha_V$</td><td>an-pha V</td><td>tốc độ học của <b>nhà phê bình</b> (sửa bảng giá trị $V$)</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Bài dùng ba ký hiệu. A của s và a bằng Q trừ V, gọi là lợi thế, cho biết hành động a tốt hơn mức trung bình của trạng thái bao nhiêu. Ví dụ 5 phẩy 5 trừ 4 bằng 1 phẩy 5. An-pha theta, chữ theta nhỏ viết dưới chân, là tốc độ học của diễn viên, phần sửa tham số của chính sách. An-pha V là tốc độ học của nhà phê bình, phần sửa bảng giá trị."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai bộ phận, một tín hiệu chung"
    steps:
      - show: |
          <div><svg width="1000" height="360" viewBox="0 0 1000 360"><defs><marker id="rl8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="rl8o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
          <g font-size="23" text-anchor="middle">
          <rect x="40" y="50" width="230" height="100" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="155" y="92" fill="#1f2937" font-weight="bold">diễn viên</text><text x="155" y="126" fill="#1f2937">chính sách pi, theta</text>
          <rect x="390" y="50" width="230" height="100" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="505" y="92" fill="#1f2937" font-weight="bold">môi trường</text><text x="505" y="126" fill="#1f2937">trả r và s'</text>
