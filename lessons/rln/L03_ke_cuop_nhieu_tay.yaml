id: L03
course: RLN
series: "RLN · Học tăng cường"
title: "Bài 3 — Khám phá và khai thác: kẻ cướp nhiều tay, ε-tham lam, UCB"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rln.yaml L03; audit/rln/verify_rln.py L03; audit/rln/sources_L03.md; R. S. Sutton, A. G. Barto, Reinforcement Learning: An Introduction, bản 2 (2018), mục 2.1 (bài toán kẻ cướp k tay), 2.2 (ε-tham lam), 2.4 (trung bình cộng dồn, công thức 2.3), 2.5 (bài toán thay đổi theo thời gian, bước cố định), 2.7 (UCB, công thức 2.10); AIF bài 7 (UCB1 với hằng số căn 2, đã học)"
assumes: [arith, power, approx, frac, geq, cdot, sub, dots, sqrt, log, ltgt, max_fn, assign]
# Quy ước (Sutton & Barto chương 2): k tay (lựa chọn); Q(a) = ước lượng giá trị của tay a (trung bình phần thưởng đã thấy); N(a) = số lần
#   đã chọn a; t = số lượt đã chơi; epsilon = xác suất khám phá; c = hệ số khám phá của UCB. Hoà thì lấy tay đứng trước (alg.rln_eps_greedy).
#   UCB(a) = Q(a) + c·√(ln t / N(a)) (alg.rln_ucb); N(a) = 0 thì tay đó được chọn trước (sách: “considered to be a maximizing action”).
#   Tên UCB chỉ trên màn hình; lời đọc nói “cận trên tin cậy”. Quảng cáo, tiêu đề, phần thưởng là SỐ MINH HOẠ.
objectives:
  - "Tính xác suất chọn từng tay theo ε-tham lam: (1 − ε) + ε / k cho tay đang tốt nhất, ε / k cho mỗi tay khác"
  - "Cập nhật trung bình cộng dồn Q ← Q + (r − Q) / n và biết khi nào nên dùng bước cố định"
  - "Tính điểm UCB và giải thích vì sao tay ít được thử được cộng thêm nhiều"
  - "So sánh mất mát của khám phá cố định với khám phá theo độ bất định"
