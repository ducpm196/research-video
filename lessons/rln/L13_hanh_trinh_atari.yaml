title: "Bài 13 — Tình huống chuyên gia theo dòng thời gian: học chơi trò Atari từ 7 trò năm 2013 tới cả 57 trò năm 2020"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
case: journey
source: "curriculum/rln.yaml L13; audit/rln/sources_L13.md (câu trích nguyên văn, đọc 2026-11-02 từ PDF); audit/rln/verify_rln.py L13; V. Mnih và cộng sự, Playing Atari with Deep Reinforcement Learning, arXiv:1312.5602 (2013) [D13]; V. Mnih và cộng sự, Human-level control through deep reinforcement learning, Nature 518 (2015), bản PDF của DeepMind [D15]; M. Hessel và cộng sự, Rainbow: Combining Improvements in Deep Reinforcement Learning, arXiv:1710.02298 (2017) [R17]; M. C. Machado và cộng sự, Revisiting the Arcade Learning Environment: Evaluation Protocols and Open Problems for General Agents, arXiv:1709.06009 (12/2017), JAIR 61 (2018) [M18]; A. P. Badia và cộng sự, Agent57: Outperforming the Atari Human Benchmark, arXiv:2003.13350 (2020) [A20]; RLN bài 0 (đường chân trời 1 / (1 − γ)), bài 3 (epsilon tham lam), bài 6 (mạng Q sâu, bộ nhớ phát lại, mạng đích), bài 12 (đánh giá, số lần chạy); AIF bài 14 (hành trình máy chơi cờ — khác: trò chơi bàn cờ, tìm kiếm cây)"
assumes: [arith, approx, frac, cdot, power, disc, eps, geq]
# Quy ước: “khung hình” = một hình của trò chơi, 60 khung mỗi giây [D15]; “bước quyết định” = tác tử chọn hành động một lần rồi lặp lại
#   nó trong k = 4 khung [D13] [D15]; “điểm chuẩn hoá theo người” = 100 · (điểm tác tử − điểm ngẫu nhiên) / (điểm người − điểm ngẫu nhiên)
#   [D15]; “hành động dính” = mỗi khung, với xác suất 0,25, máy chạy lại hành động trước thay vì hành động mới [M18].
#   Mọi sự kiện và con số có nguồn ghi trong audit/rln/sources_L13.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”.
#   [D15] ghi 50 triệu khung ≈ 38 ngày, [M18] ghi 200 triệu khung ≈ 38 ngày: bài TÍNH lại (60 khung/giây, 4 khung mỗi bước) và chỉ ra
#   hai bài đếm “khung” khác nhau — chính [M18] khuyên “tính cả khung bị bỏ qua”. Không dạy giá trị C của mạng đích (chỉ có trong bảng ảnh,
#   không trích được — NOT_VERIFIED). Lời đọc không nói tên hệ thống, trò chơi, nhóm (probe chưa đạt): nói “nhóm nghiên cứu”, “trò trượt tuyết”.
#   Không trùng AIF bài 14: ở đây là trò điện tử, học không tìm kiếm cây, và trọng tâm là cách ĐO cho đúng.
objectives:
  - "Kể lại năm chặng 2013–2020 của học tăng cường sâu trên trò chơi điện tử, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại số ngày chơi của 50 triệu và 200 triệu khung, tỉ lệ 29 trên 49 trò, mức khám phá theo lịch giảm dần và điểm chuẩn hoá tối đa của trò trượt tuyết"
  - "Chọn quy trình đánh giá (số lần chạy, mốc báo cáo, hành động dính) cho dự án ở quy mô một bộ xử lý đồ hoạ trong một tuần"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "50 triệu khung và 200 triệu khung — cùng 38 ngày"
    checks:
      - "round(50e6 * 4 / 60 / 86400, 1) == round(200e6 / 60 / 86400, 1) == 38.6"
    steps:
      - show: |
          <p>Bài báo năm 2015: tác tử học <b>50 triệu khung hình</b>, “khoảng 38 ngày chơi”. Bài báo năm 2018: “thường huấn luyện <b>200 triệu khung hình</b>”, “tương đương khoảng 38 ngày”. Gấp 4 lần số khung mà cùng số ngày?</p>
          <p>Năm 2013, một mạng nơ-ron học từ điểm ảnh chơi <b>7</b> trò. Năm 2020, một tác tử vượt mốc điểm của người thử nghiệm ở <b>cả 57</b> trò.</p>
          <div class="box key">Hôm nay: năm chặng từ 2013 tới 2020 — mỗi chặng vướng ở đâu, xử lý ra sao, và vì sao càng về sau, vấn đề lớn nhất lại là <b>đo cho đúng</b>.</div>
        focus: [1, 1, 1, 2, 2, 3]
        say: "Chào bạn, một bài báo năm 2015 ghi rằng tác tử học 50 triệu khung hình, khoảng 38 ngày chơi. Một bài báo năm 2018 ghi rằng người ta thường huấn luyện 200 triệu khung hình, tương đương khoảng 38 ngày. Gấp 4 lần số khung mà cùng số ngày, vậy ai đếm sai? Năm 2013, một mạng nơ-ron học thẳng từ điểm ảnh chơi được 7 trò. Năm 2020, một tác tử vượt mốc điểm của người thử nghiệm ở cả 57 trò. Hôm nay ta đi qua năm chặng đó, xem mỗi chặng vướng ở đâu, xử lý ra sao, và vì sao càng về sau, vấn đề lớn nhất lại là đo cho đúng."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "round(1 + 0.99 * 10, 10) == 10.9"
      - "round(1 / (1 - 0.99)) == 100"
      - "round(0.9 + 0.1 / 10, 10) == 0.91"
      - "alg.rln_ess([1] * 5) == 5"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 0</td><td><b>đường chân trời</b>: hệ số chiết khấu $\gamma$ cho tác tử nhìn xa khoảng $\dfrac{1}{1 - \gamma}$ bước</td><td>$\gamma = 0{,}99$: khoảng 100 bước</td></tr>
          <tr><td>bài 3</td><td><b>epsilon tham lam</b>: với xác suất $\varepsilon$ chọn ngẫu nhiên để khám phá</td><td>10 tay, $\varepsilon = 0{,}1$: tay tốt nhất được chọn 0,91</td></tr>
          <tr><td>bài 6</td><td><b>mạng Q sâu</b>: mục tiêu $r + \gamma \cdot \max Q_{\text{đích}}$; bộ nhớ phát lại; mạng đích giữ cố định một thời gian</td><td>$1 + 0{,}99 \cdot 10 = 10{,}9$</td></tr>
          <tr><td>bài 12</td><td><b>đánh giá</b>: một con số chỉ đáng tin khi biết nó dựa trên bao nhiêu mẫu</td><td>5 lần chạy ngang nhau: 5 mẫu hiệu dụng</td></tr></table>
        introduces: [max_fn, sub]
        focus: [0, "1.2", "1.3", "1.4", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều. Ở bài 0, hệ số chiết khấu cho tác tử nhìn xa khoảng 1 chia cho 1 trừ gam-ma bước, gam-ma bằng 0 phẩy 99 là khoảng 100 bước. Ở bài 3, tham lam xen khám phá thì thỉnh thoảng chọn ngẫu nhiên, với 10 tay và xác suất khám phá 0 phẩy 1 thì tay tốt nhất được chọn với 0 phẩy 91. Ở bài 6, mạng Q sâu học theo mục tiêu r cộng gam-ma nhân giá trị lớn nhất của mạng đích, ví dụ 10 phẩy 9. Nó dùng bộ nhớ phát lại và giữ mạng đích cố định một thời gian. Ở bài 12, một con số chỉ đáng tin khi biết nó dựa trên bao nhiêu mẫu."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    checks:
      - "round(100 * (60 - 10) / (110 - 10)) == 50"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>khung hình</b></td><td>một hình của trò chơi; máy chạy 60 khung mỗi giây</td></tr>
          <tr><td><b>bước quyết định</b></td><td>tác tử chọn một hành động rồi lặp lại nó trong 4 khung</td></tr>
          <tr><td><b>điểm chuẩn hoá theo người</b></td><td>$100 \cdot \dfrac{\text{điểm tác tử} - \text{điểm ngẫu nhiên}}{\text{điểm người} - \text{điểm ngẫu nhiên}}$; 0% = chơi ngẫu nhiên, 100% = người thử nghiệm</td></tr>
          <tr><td><b>hành động dính</b></td><td>mỗi khung, với xác suất 0,25, máy chạy lại hành động trước thay vì hành động mới</td></tr></table>
          <p class="note">Làm thử (số minh hoạ): tác tử 60 điểm, ngẫu nhiên 10, người 110 → $100 \cdot \frac{50}{100} = 50\%$.</p>
        focus: [0, "1.2", "1.3", "1.4", "1.4", "1.5", 2]
        say: "Bài dùng bốn thuật ngữ. Khung hình là một hình của trò chơi, và máy chạy 60 khung mỗi giây. Bước quyết định là lúc tác tử chọn một hành động, rồi hành động đó được lặp lại trong 4 khung. Điểm chuẩn hoá theo người bằng 100 nhân điểm tác tử trừ điểm ngẫu nhiên, chia cho điểm người trừ điểm ngẫu nhiên. Vậy 0 phần trăm là chơi ngẫu nhiên, còn 100 phần trăm là người thử nghiệm. Hành động dính nghĩa là mỗi khung, với xác suất 0 phẩy 25, máy chạy lại hành động trước thay vì hành động mới. Làm thử với số minh hoạ, tác tử 60 điểm, ngẫu nhiên 10, người 110 thì điểm chuẩn hoá là 50 phần trăm."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2013</text><text x="160" y="200">7 trò, một mạng</text><text x="160" y="232">bộ nhớ phát lại</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2015</text><text x="500" y="200">49 trò, mạng đích</text><text x="500" y="232">29 trò hơn 75%</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2017</text><text x="850" y="200">gộp 6 cải tiến, 57 trò</text><text x="850" y="232">ít dữ liệu hơn nhiều</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2017 → 2018</text><text x="1200" y="200">chuẩn đo chung</text><text x="1200" y="232">hành động dính</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2020</text><text x="1540" y="200">cả 57 trò</text><text x="1540" y="232">vượt mốc người</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô lớn → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2013, một mạng nơ-ron chơi 7 trò nhờ bộ nhớ phát lại. Năm 2015, cùng một mạng chơi 49 trò, thêm mạng đích, và đạt hơn 75 phần trăm điểm người ở 29 trò. Năm 2017, một tác tử gộp 6 cải tiến, chơi 57 trò với ít dữ liệu hơn nhiều, rồi từ 2017 tới 2018 cộng đồng thống nhất một chuẩn đo chung có hành động dính. Năm 2020, một tác tử vượt mốc điểm người ở cả 57 trò."

  # ───────────────────────── 5. CƠ CHẾ CHUNG ─────────────────────────
  - id: frames
    kind: concept
    title: "Một giây chơi: 60 khung, 15 bước quyết định"
    checks:
      - "60 // 4 == 15 and round(1 - 0.25, 2) == 0.75 and 0.25 ** 4 == 0.00390625"
    steps:
      - show: |
          <div><svg width="1600" height="300" viewBox="0 0 1600 300">
          <g stroke="#1f2937" stroke-width="2">
          <rect x="60" y="60" width="60" height="70" fill="#dbeafe"/><rect x="125" y="60" width="60" height="70" fill="#dbeafe"/><rect x="190" y="60" width="60" height="70" fill="#dbeafe"/><rect x="255" y="60" width="60" height="70" fill="#dbeafe"/>
          <rect x="340" y="60" width="60" height="70" fill="#d1fae5"/><rect x="405" y="60" width="60" height="70" fill="#d1fae5"/><rect x="470" y="60" width="60" height="70" fill="#d1fae5"/><rect x="535" y="60" width="60" height="70" fill="#d1fae5"/>
          <rect x="620" y="60" width="60" height="70" fill="#ffedd5"/><rect x="685" y="60" width="60" height="70" fill="#d1fae5"/><rect x="750" y="60" width="60" height="70" fill="#d1fae5"/><rect x="815" y="60" width="60" height="70" fill="#d1fae5"/>
          </g>
          <g font-size="22" text-anchor="middle" fill="#1f2937">
          <text x="187" y="170">bước 1: “sang trái”</text><text x="187" y="200">lặp 4 khung</text>
          <text x="467" y="170">bước 2: “bắn”</text><text x="467" y="200">lặp 4 khung</text>
          <text x="747" y="170">bước 3: “bắn” → khung đầu</text><text x="747" y="200" fill="#eb6834">vẫn chạy hành động cũ (dính)</text>
          <text x="1230" y="85">60 khung mỗi giây</text><text x="1230" y="120">chia 4 = 15 bước quyết định</text>
          <text x="1230" y="185">hành động mới chạy ngay ở khung đầu</text><text x="1230" y="220">với xác suất 0,75</text>
          </g>
          <text x="800" y="280" font-size="22" fill="#6b7280" text-anchor="middle">“số khung” có thể đếm khung của máy, hoặc đếm bước quyết định — chênh nhau 4 lần</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là một đoạn ngắn của một giây chơi. Tác tử chọn sang trái rồi lặp lại trong 4 khung, chọn bắn rồi lặp lại trong 4 khung, nên 60 khung mỗi giây là 15 bước quyết định. Với hành động dính, ở khung đầu của bước 3, máy vẫn chạy hành động cũ, và hành động mới chạy ngay với xác suất 0 phẩy 75. Điều cần chú ý nhất là số khung có thể đếm khung của máy hoặc đếm bước quyết định, hai cách chênh nhau 4 lần."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2013 — khai sinh: một mạng, bảy trò, học từ điểm ảnh"
    stage: {year: "2013", scale: "7 trò; 10 triệu khung huấn luyện; bộ nhớ phát lại 1 triệu khung gần nhất; lô 32; epsilon giảm tuyến tính từ 1 xuống 0,1 trong 1 triệu khung đầu; hơn mọi cách cũ ở 6 trò, hơn chuyên gia người ở 3 trò", source: "[D13]", practice: "phá tương quan giữa các mẫu liền nhau bằng bộ nhớ phát lại; giữ nguyên kiến trúc và tham số cho mọi trò; khám phá nhiều lúc đầu rồi giảm dần"}
    checks:
      - "round(1 - 0.9 * 250_000 / 1_000_000, 3) == 0.775 and round(1 - 0.9 * 500_000 / 1_000_000, 2) == 0.55"
      - "round(1 - 0.9 * min(1, 2_000_000 / 1_000_000), 2) == 0.1 and (10_000_000 - 1_000_000) / 10_000_000 == 0.9"
      - "round(10_000_000 / 1_000_000) == 10"
    steps:
      - show: |
          <p><b>Khai sinh:</b> một mạng nơ-ron tích chập nhận <b>điểm ảnh thô</b>, xuất giá trị của từng hành động, học bằng cách học Q. Cùng một kiến trúc, cùng tham số cho <b>7 trò</b>: hơn mọi cách cũ ở 6 trò, hơn một chuyên gia người ở 3 trò.</p>
          <p><b>Điểm nghẽn:</b> mẫu liền nhau tương quan mạnh; và tham số hiện tại quyết định dữ liệu tiếp theo — “dễ sinh vòng phản hồi không mong muốn”.</p>
          <p><b>Cách xử lý:</b> <b>bộ nhớ phát lại</b> 1 triệu khung gần nhất, mỗi lần học lấy ngẫu nhiên lô 32 mẫu.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng một, năm 2013, một mạng nơ-ron tích chập nhận điểm ảnh thô và xuất giá trị của từng hành động, học bằng cách học Q như ở bài 5. Cùng một kiến trúc và cùng tham số cho 7 trò, nó hơn mọi cách cũ ở 6 trò và hơn một chuyên gia người ở 3 trò. Điểm nghẽn là các mẫu liền nhau tương quan mạnh. Thêm nữa, tham số hiện tại quyết định dữ liệu tiếp theo, và nhóm tác giả viết rằng điều đó dễ sinh vòng phản hồi không mong muốn. Cách xử lý là bộ nhớ phát lại giữ 1 triệu khung gần nhất, mỗi lần học lấy ngẫu nhiên một lô 32 mẫu."
      - clear: true
        show: |
          <p>Khám phá theo lịch: epsilon giảm đều từ 1 xuống 0,1 trong 1 triệu khung đầu, rồi giữ 0,1.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. sau 250 nghìn khung</td><td>$1 - 0{,}9 \cdot \dfrac{250\,000}{1\,000\,000}$</td><td>$\varepsilon = \hlb{0{,}775}$</td></tr>
          <tr><td>Bước 2. sau 500 nghìn khung</td><td>$1 - 0{,}9 \cdot 0{,}5$</td><td>$\varepsilon = 0{,}55$</td></tr>
          <tr><td>Bước 3. phần huấn luyện có epsilon cố định 0,1</td><td>$\dfrac{10 \text{ triệu} - 1 \text{ triệu}}{10 \text{ triệu}}$</td><td>$\hlg{90}$%</td></tr></table>
          <p class="note">Thực hành: khám phá nhiều khi chưa biết gì, giảm dần khi đã học — rồi vẫn giữ một ít. Điều kiện: lịch giảm phải dài hơn thời gian để thấy phần thưởng đầu tiên.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Khám phá theo lịch nghĩa là xác suất khám phá giảm đều từ 1 xuống 0 phẩy 1 trong 1 triệu khung đầu, rồi giữ ở 0 phẩy 1. Bước một, sau 250 nghìn khung, xác suất khám phá bằng 1 trừ 0 phẩy 9 nhân một phần tư, bằng 0 phẩy 775. Bước hai, sau 500 nghìn khung, xác suất khám phá bằng 0 phẩy 55. Bước ba, trong 10 triệu khung huấn luyện, 9 triệu khung cuối có xác suất khám phá cố định, tức 90 phần trăm. Thực hành rút ra là khám phá nhiều khi chưa biết gì, giảm dần khi đã học, và vẫn giữ một ít, với điều kiện lịch giảm dài hơn thời gian để thấy phần thưởng đầu tiên."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2015 — tăng trưởng: 49 trò, mạng đích, 38 ngày chơi"
    stage: {year: "2015", scale: "49 trò cùng một kiến trúc, cùng tham số; hơn cách tốt nhất trước đó ở 43 trò; hơn 75% điểm người ở 29 trò; 50 triệu khung ≈ 38 ngày chơi; bộ nhớ phát lại 1 triệu khung; mỗi bước quyết định lặp 4 khung; máy chạy 60 khung mỗi giây", source: "[D15]", practice: "thêm mạng đích chỉ cập nhật sau mỗi C bước để mục tiêu không chạy theo chính nó; chuẩn hoá điểm theo người và theo chơi ngẫu nhiên để so được giữa các trò; báo cả độ lệch qua 30 lượt đánh giá"}
    checks:
      - "round(29 / 49 * 100, 1) == 59.2 and 29 > 49 / 2"
      - "round(50e6 / 60 / 86400, 1) == 9.6 and round(50e6 * 4 / 60 / 86400, 1) == 38.6"
      - "43 < 49"
    steps:
      - show: |
          <p><b>Tăng trưởng:</b> cùng một mạng, cùng tham số, giờ cho <b>49 trò</b>. Hơn cách tốt nhất trước đó ở 43 trò; đạt hơn 75% điểm của một người thử nghiệm chuyên nghiệp ở <b>29 trò</b>.</p>
          <p><b>Điểm nghẽn:</b> học tăng cường với mạng nơ-ron “được biết là không ổn định, thậm chí phân kỳ”. <b>Cách xử lý:</b> thêm <b>mạng đích</b>, chỉ chép từ mạng chính sau mỗi C bước và giữ cố định ở giữa — như bài 6.</p>
        focus: [1, 1, 2, 2]
        say: "Ở chặng hai, năm 2015, cùng một mạng và cùng tham số được dùng cho 49 trò. Nó hơn cách tốt nhất trước đó ở 43 trò, và đạt hơn 75 phần trăm điểm của một người thử nghiệm chuyên nghiệp ở 29 trò. Điểm nghẽn là học tăng cường với mạng nơ-ron được biết là không ổn định, thậm chí phân kỳ. Cách xử lý là thêm mạng đích, chỉ chép từ mạng chính sau mỗi một số bước cố định và giữ nguyên ở giữa, như ta đã học ở bài 6."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. “hơn một nửa” số trò</td><td>$\dfrac{29}{49}$</td><td>≈ $\hlb{59{,}2}$%</td></tr>
          <tr><td>Bước 2. coi 50 triệu là khung của máy</td><td>$\dfrac{50 \text{ triệu}}{60 \cdot 86\,400}$</td><td>≈ 9,6 ngày — không khớp “38 ngày”</td></tr>
          <tr><td>Bước 3. coi 50 triệu là bước quyết định, mỗi bước 4 khung</td><td>$\dfrac{50 \text{ triệu} \cdot 4}{60 \cdot 86\,400}$</td><td>≈ $\hlg{38{,}6}$ ngày ✓</td></tr></table>
          <p class="note">Thực hành: chuẩn hoá điểm giữa chơi ngẫu nhiên và người để so được 49 trò khác nhau. Điều kiện: điểm người phải đo cùng điều kiện với máy (cùng bộ giả lập, tắt âm thanh).</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Làm thử với các con số của năm 2015. Bước một, 29 chia 49 là khoảng 59 phẩy 2 phần trăm, đúng là hơn một nửa số trò. Bước hai, nếu coi 50 triệu là khung của máy, chia cho 60 khung mỗi giây và 86 nghìn 400 giây mỗi ngày, ta được khoảng 9 phẩy 6 ngày, không khớp 38 ngày. Bước ba, coi 50 triệu là bước quyết định, mỗi bước 4 khung, ta được khoảng 38 phẩy 6 ngày, khớp. Thực hành rút ra là chuẩn hoá điểm giữa chơi ngẫu nhiên và người để so được các trò khác nhau, với điều kiện điểm người đo cùng điều kiện với máy."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2017 — quy mô lớn: gộp sáu cải tiến, đo trên 57 trò"
    stage: {year: "2017", scale: "57 trò; gộp 6 cải tiến của mạng Q sâu; khớp kết quả cuối của bản 2015 sau 7 triệu khung (dưới 10 giờ); vượt mọi phương pháp so sánh trong 44 triệu khung; một lần chạy 200 triệu khung ≈ 10 ngày trên một bộ xử lý đồ hoạ; trung vị 223% (bắt đầu bằng vài bước không làm gì) và 153% (bắt đầu từ thế của người); bỏ từng phần để đo", source: "[R17]", practice: "gộp các cải tiến độc lập rồi bỏ từng phần một để biết phần nào quan trọng; báo trung vị trên mọi trò; đánh giá bằng hai chế độ bắt đầu để thấy tác tử có học thuộc lối đi của chính nó không"}
    checks:
      - "round(200 / 7, 1) == 28.6 and 223 - 153 == 70"
      - "round(200e6 / 10 / 86400) == 231 and 200e6 / 10 == 20e6"
      - "53 < 57 and 7 < 44 < 200"
    steps:
      - show: |
          <p><b>Quy mô lớn:</b> sau 2015 có nhiều cải tiến riêng lẻ — chống đánh giá quá cao, phát lại có ưu tiên, học nhiều bước… Năm 2017, nhóm nghiên cứu <b>gộp cả 6</b> vào một tác tử và đo trên <b>57 trò</b>.</p>
          <p>Kết quả: khớp kết quả cuối của bản 2015 chỉ sau <b>7 triệu khung</b> (dưới 10 giờ); một lần chạy đủ 200 triệu khung mất khoảng 10 ngày trên một bộ xử lý đồ hoạ.</p>
          <p><b>Bỏ từng phần một:</b> phát lại có ưu tiên và học nhiều bước là hai phần quan trọng nhất; bản đầy đủ hơn cả hai bản thiếu ở 53 trên 57 trò.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng ba, sau năm 2015 có nhiều cải tiến riêng lẻ, như chống đánh giá quá cao, phát lại có ưu tiên, và học nhiều bước. Năm 2017, nhóm nghiên cứu gộp cả 6 cải tiến vào một tác tử và đo trên 57 trò. Tác tử khớp kết quả cuối của bản năm 2015 chỉ sau 7 triệu khung, dưới 10 giờ. Một lần chạy đủ 200 triệu khung mất khoảng 10 ngày trên một bộ xử lý đồ hoạ. Khi bỏ từng phần một, phát lại có ưu tiên và học nhiều bước là hai phần quan trọng nhất, và bản đầy đủ hơn cả hai bản thiếu ở 53 trên 57 trò."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. ít dữ liệu hơn bao nhiêu lần để đạt mức cũ</td><td>$\dfrac{200 \text{ triệu}}{7 \text{ triệu}}$</td><td>≈ $\hlb{28{,}6}$ lần</td></tr>
          <tr><td>Bước 2. tốc độ thu dữ liệu</td><td>200 triệu khung chia 10 ngày</td><td>20 triệu khung mỗi ngày ≈ 231 khung mỗi giây</td></tr>
          <tr><td>Bước 3. cùng tác tử, hai cách bắt đầu ván</td><td>223% so với 153%</td><td>chênh $\hl{70}$ điểm phần trăm</td></tr></table>
          <p class="note">Thực hành: báo kết quả ở hai chế độ bắt đầu. Bắt đầu từ thế của người khó hơn vì tác tử không được đi lại đúng lối nó đã quen — chênh lệch cho biết nó học thuộc tới đâu.</p>
        focus: [0, "1.2", "1.3", "1.4", "1.4", 2]
        say: "Làm thử với các con số năm 2017. Bước một, 200 triệu chia 7 triệu, tác tử cần ít dữ liệu hơn khoảng 28 phẩy 6 lần để đạt mức cũ. Bước hai, 200 triệu khung trong 10 ngày là 20 triệu khung mỗi ngày, khoảng 231 khung mỗi giây. Bước ba, cùng một tác tử đạt trung vị 223 phần trăm khi ván bắt đầu bằng vài bước không làm gì. Khi bắt đầu từ thế của người, nó chỉ đạt 153 phần trăm, chênh 70 điểm phần trăm. Vì vậy hãy báo cả hai chế độ, vì chênh lệch cho biết tác tử học thuộc lối đi của chính nó tới đâu."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, 2017 tới 2018 — ổn định: một chuẩn đo chung"
    stage: {year: "2017 → 2018", scale: "60 trò; phương pháp vét cạn lợi dụng tính tất định từng hơn phương pháp học tốt nhất ở 45 trên 55 trò; phiên bản mới của bộ trò chơi có hành động dính 0,25; báo điểm ở 10, 50, 100, 200 triệu khung, trung bình 100 lượt cuối, 5 lần chạy; 200 triệu khung ≈ 38 ngày", source: "[M18]", practice: "thêm ngẫu nhiên vào môi trường để phân biệt học thật với học thuộc chuỗi nút bấm; chỉ kết thúc lượt khi hết trò; báo nhiều mốc trên đường cong học; nhiều lần chạy; tính cả khung bị bỏ qua khi đếm dữ liệu; phát hành phiên bản mới của bộ trò chơi"}
    checks:
      - "round(200e6 / 60 / 86400, 1) == 38.6"
      - "1 - 0.25 == 0.75 and 0.25 ** 4 == 0.00390625 and round(0.25 ** 4 * 100, 2) == 0.39"
      - "round(45 / 55 * 100) == 82 and 5 * 4 == 20"
    steps:
      - show: |
          <p><b>Ổn định:</b> tới năm 2017, mỗi nhóm đo một kiểu, khó so. Một nhóm khác, có cả người tạo ra bộ trò chơi, viết lại cách đo và phát hành <b>phiên bản mới</b> của bộ trò chơi.</p>
          <p><b>Điểm nghẽn:</b> các trò gần như tất định. Một phương pháp <b>vét cạn</b>, chỉ học thuộc chuỗi nút bấm, từng hơn phương pháp học tốt nhất ở <b>45 trên 55</b> trò. <b>Cách xử lý:</b> <b>hành động dính</b> 0,25 — phương pháp vét cạn sụp, các tác tử học thật gần như không bị ảnh hưởng.</p>
          <p><b>Chuẩn báo cáo:</b> điểm ở 10, 50, 100 và 200 triệu khung; trung bình 100 lượt cuối; 5 lần chạy; chỉ kết thúc khi hết trò; tính cả khung bị bỏ qua.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng bốn, tới năm 2017, mỗi nhóm đo một kiểu nên rất khó so. Một nhóm khác, có cả người tạo ra bộ trò chơi, viết lại cách đo và phát hành một phiên bản mới của bộ trò chơi. Điểm nghẽn là các trò gần như tất định, nên một phương pháp vét cạn chỉ học thuộc chuỗi nút bấm từng hơn phương pháp học tốt nhất ở 45 trên 55 trò. Cách xử lý là hành động dính với xác suất 0 phẩy 25, khi đó phương pháp vét cạn sụp, còn các tác tử học thật gần như không bị ảnh hưởng. Chuẩn báo cáo mới yêu cầu điểm ở 10, 50, 100 và 200 triệu khung, trung bình 100 lượt cuối, 5 lần chạy, và tính cả khung bị bỏ qua."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. 200 triệu khung của máy</td><td>$\dfrac{200 \text{ triệu}}{60 \cdot 86\,400}$</td><td>≈ $\hlb{38{,}6}$ ngày — cùng 38 ngày với 50 triệu bước năm 2015</td></tr>
          <tr><td>Bước 2. hành động mới chạy ngay ở khung đầu</td><td>$1 - 0{,}25$</td><td>0,75</td></tr>
          <tr><td>Bước 3. hành động cũ dính suốt cả 4 khung của một bước</td><td>$0{,}25^4$</td><td>≈ $\hlg{0{,}39}$%</td></tr></table>
          <p class="note">Thực hành của giai đoạn rất nhiều người dùng: một phiên bản chuẩn, một quy trình báo cáo chung, dữ liệu đường cong học công khai. Điều kiện: chuẩn phải được chính bộ công cụ chung thực thi, không chỉ ghi trong bài báo.</p>
        focus: [0, "1.2", "1.2", "1.3", "1.4", 2, 2]
        say: "Làm thử với các con số của chặng bốn. Bước một, 200 triệu khung của máy chia cho 60 khung mỗi giây và 86 nghìn 400 giây mỗi ngày là khoảng 38 phẩy 6 ngày. Đó đúng bằng 50 triệu bước quyết định năm 2015, nên câu đố ở phần mở đầu đã có lời giải. Bước hai, hành động mới chạy ngay ở khung đầu với xác suất 1 trừ 0 phẩy 25, bằng 0 phẩy 75. Bước ba, hành động cũ dính suốt cả 4 khung chỉ xảy ra với xác suất 0 phẩy 25 mũ 4, khoảng 0 phẩy 39 phần trăm. Thực hành của giai đoạn rất nhiều người dùng là một phiên bản chuẩn, một quy trình báo cáo chung, và dữ liệu công khai. Điều kiện là chuẩn phải được chính bộ công cụ chung thực thi."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2020 — tiếp tục phát triển: cả 57 trò, và đuôi dài"
    stage: {year: "2020", scale: "57 trò, vượt mốc điểm người ở tất cả; trước đó hai tác tử mạnh nhất vượt ở 51 và 52 trò; 51 trò vượt trong 5 tỉ khung đầu; trò trượt tuyết sau 78 tỉ khung, nhờ cho phép hệ số chiết khấu rất cao (bài báo ghi 0,9999 là mức đủ để vượt mốc người ở trò này); trò trượt tuyết: người −4336,9, ngẫu nhiên −17 098,1, tối ưu −3272", source: "[A20]", practice: "nhìn vào đuôi của phân phối (các trò còn thua) thay vì trung bình; một họ chính sách từ rất khám phá tới hoàn toàn khai thác, chọn dần bằng bộ điều khiển; báo điểm có chặn trần 100% để một trò rất cao không che trò thất bại"}
    checks:
      - "round(78e9 / 200e6) == 390 and round(5e9 / 200e6) == 25"
      - "round(1 / (1 - 0.9999)) == 10000"
      - "round(100 * (-3272 + 17098.1) / (-4336.9 + 17098.1), 1) == 108.3 and round(100 * (-3272 + 17098.1) / (-4336.9 + 17098.1) - 100) == 8"
    steps:
      - show: |
          <p><b>Tiếp tục phát triển:</b> trung vị đã rất cao, nhưng hai tác tử mạnh nhất trước đó (2018, 2019) chỉ vượt mốc người ở <b>51</b> và <b>52</b> trên 57 trò; ở các trò còn lại chúng “thường không học được gì”. Khó nhất là các trò <b>khám phá khó</b> (hàng trăm hành động trước phần thưởng đầu tiên) và trò <b>trượt tuyết</b>, chỉ cho điểm ở cuối lượt.</p>
          <p>Năm 2020, một tác tử vượt mốc người ở <b>cả 57 trò</b>: 51 trò trong 5 tỉ khung đầu, trò trượt tuyết sau <b>78 tỉ khung</b>, nhờ cho phép hệ số chiết khấu rất cao — bài báo ghi 0,9999 là mức đủ để vượt mốc người ở trò này.</p>
        focus: [1, 1, 1, 1, 2, 2]
        say: "Ở chặng năm, trung vị đã rất cao, nhưng hai tác tử mạnh nhất trước đó chỉ vượt mốc người ở 51 và 52 trên 57 trò. Ở các trò còn lại, chúng thường không học được gì. Khó nhất là các trò khám phá khó, cần hàng trăm hành động trước phần thưởng đầu tiên. Khó không kém là trò trượt tuyết, chỉ cho điểm ở cuối lượt. Năm 2020, một tác tử vượt mốc người ở cả 57 trò, 51 trò trong 5 tỉ khung đầu. Trò trượt tuyết cần tới 78 tỉ khung, nhờ cho phép hệ số chiết khấu rất cao, tới mức 0 phẩy 9999."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. so với chuẩn 200 triệu khung</td><td>$\dfrac{78 \text{ tỉ}}{200 \text{ triệu}}$; $\;\dfrac{5 \text{ tỉ}}{200 \text{ triệu}}$</td><td>$\hl{390}$ lần; 25 lần</td></tr>
          <tr><td>Bước 2. đường chân trời của $\gamma = 0{,}9999$ (bài 0)</td><td>$\dfrac{1}{1 - 0{,}9999}$</td><td>khoảng 10&nbsp;000 bước</td></tr>
          <tr><td>Bước 3. trượt tuyết: điểm tối đa có thể</td><td>$100 \cdot \dfrac{-3272 + 17\,098{,}1}{-4336{,}9 + 17\,098{,}1}$</td><td>≈ $\hlg{108{,}3}$%</td></tr></table>
          <p class="note">Ở trò này, người thử nghiệm đã gần mức tối ưu: chơi hoàn hảo cũng chỉ hơn người 8 điểm phần trăm. Thực hành: báo điểm có chặn trần 100% và nhìn vào đuôi — các trò còn thua — thay vì trung bình.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Làm thử với các con số năm 2020. Bước một, 78 tỉ khung gấp 390 lần chuẩn 200 triệu khung, còn 5 tỉ khung gấp 25 lần. Bước hai, theo bài 0, gam-ma bằng 0 phẩy 9999 cho đường chân trời khoảng 10 nghìn bước, đủ dài để nối một lỗi đầu lượt với điểm ở cuối lượt. Bước ba, ở trò trượt tuyết, điểm tối ưu âm 3272, người âm 4336 phẩy 9, ngẫu nhiên âm 17 nghìn 98 phẩy 1, nên chơi hoàn hảo cũng chỉ được khoảng 108 phẩy 3 phần trăm. Người thử nghiệm đã gần mức tối ưu, nên thực hành là báo điểm có chặn trần 100 phần trăm và nhìn vào các trò còn thua thay vì trung bình."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "50e6 * 4 == 200e6"
      - "abs(0.592 * 49 - 29) < 0.01"
      - "abs(-17098.1 + 1.083448 * (-4336.9 + 17098.1) - (-3272)) < 0.01"
      - "abs(sum(0.9999 ** k for k in range(200000)) - 10000) < 1e-3"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>38 ngày ở cả hai bài</td><td>đổi đơn vị trước: 50 triệu bước nhân 4 khung = 200 triệu khung — đúng con số của năm 2018 ✓</td></tr>
          <tr><td>59,2%</td><td>nhân ngược: 0,592 nhân 49 ≈ 29 trò ✓</td></tr>
          <tr><td>108,3%</td><td>đi ngược: ngẫu nhiên + 1,0834 nhân (người − ngẫu nhiên) ≈ −3272, đúng điểm tối ưu ✓</td></tr>
          <tr><td>chân trời 10&nbsp;000 bước</td><td>cộng thẳng 200&nbsp;000 số hạng $0{,}9999^k$: ≈ 10&nbsp;000 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Đổi đơn vị trước, 50 triệu bước nhân 4 khung là đúng 200 triệu khung của năm 2018, nên hai bài báo nói cùng một lượng dữ liệu. Nhân ngược, 0 phẩy 592 nhân 49 xấp xỉ 29 trò. Đi ngược công thức, điểm ngẫu nhiên cộng 1 phẩy 0834 nhân khoảng cách giữa người và ngẫu nhiên cho đúng âm 3272, điểm tối ưu. Cuối cùng, cộng thẳng 200 nghìn số hạng 0 phẩy 9999 mũ k được xấp xỉ 10 nghìn, khớp đường chân trời."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
      - "223 > 153 and 45 > 55 / 2"
      - "round(78e9 / (200e6 / 10)) == 3900"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Vượt mốc người ở cả 57 trò, vậy máy chơi giỏi hơn người”</td><td>nhóm năm 2020 tự ghi rằng mốc điểm người “có thể đánh giá thấp” khả năng của người; ở trò trượt tuyết, người đã sát mức tối ưu</td><td>nói đúng điều đã đo: vượt một mốc chuẩn cụ thể, trong điều kiện cụ thể</td></tr>
          <tr><td><b class="red">2.</b> “Bài kia học 200 triệu khung, bài này 50 triệu, vậy bài này tiết kiệm gấp 4”</td><td>hai bài đếm khung khác nhau; cùng 38 ngày chơi</td><td>quy về cùng một đơn vị — khung của máy — trước khi so</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ vượt mốc người ở cả 57 trò thì máy chơi giỏi hơn người. Chính nhóm năm 2020 ghi rằng mốc điểm người có thể đánh giá thấp khả năng thật của người, và ở trò trượt tuyết người đã sát mức tối ưu. Bài học sai thứ hai là nghĩ bài này học 50 triệu khung nên tiết kiệm gấp 4 bài kia học 200 triệu. Hai bài đếm khung khác nhau và cùng là 38 ngày chơi, nên phải quy về cùng một đơn vị trước khi so."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Điểm cao trên môi trường tất định là học được”</td><td>phương pháp vét cạn học thuộc nút bấm từng thắng 45 trên 55 trò, rồi sụp khi có hành động dính</td><td>thêm ngẫu nhiên vào môi trường khi đánh giá; thử hai chế độ bắt đầu</td></tr>
          <tr><td><b class="red">4.</b> “Chép quy mô của nhóm lớn: chạy tới khi được”</td><td>78 tỉ khung, với tốc độ 20 triệu khung mỗi ngày của năm 2017, là khoảng 3900 ngày trên một bộ xử lý đồ hoạ</td><td>chọn bài toán và mốc báo cáo vừa ngân sách; so ở cùng số khung</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba là nghĩ điểm cao trên môi trường tất định nghĩa là đã học được. Phương pháp vét cạn học thuộc chuỗi nút bấm từng thắng 45 trên 55 trò, rồi sụp khi có hành động dính. Hãy thêm ngẫu nhiên vào môi trường khi đánh giá và thử hai chế độ bắt đầu. Bài học sai thứ tư là chép quy mô của nhóm lớn, cứ chạy tới khi được. Với tốc độ 20 triệu khung mỗi ngày của năm 2017, 78 tỉ khung là khoảng 3900 ngày trên một bộ xử lý đồ hoạ, nên hãy chọn bài toán và mốc báo cáo vừa ngân sách."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "20e6 * 7 == 140e6 and 140e6 / 5 == 28e6 and 140e6 / 3 > 46e6"
      - "28e6 > 10e6 and 28e6 < 50e6 and 28e6 > 7e6"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ): một trò điện tử mới, <b>một</b> bộ xử lý đồ hoạ, <b>một tuần</b>, tốc độ thu 20 triệu khung mỗi ngày như năm 2017</th></tr>
          <tr><td>1</td><td>Một tuần thu được bao nhiêu khung? Chia cho 5 lần chạy thì mỗi lần được bao nhiêu?</td></tr>
          <tr><td>2</td><td>Bạn chọn: một lần chạy dài, ba lần chạy, hay năm lần chạy ngắn? Báo ở những mốc nào? Có bật hành động dính không?</td></tr></table>
        focus: [1, 1, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với một số minh hoạ. Bạn có một trò điện tử mới, một bộ xử lý đồ hoạ, một tuần, và tốc độ thu 20 triệu khung mỗi ngày như năm 2017. Câu một, một tuần thu được bao nhiêu khung, và chia cho 5 lần chạy thì mỗi lần được bao nhiêu? Câu hai, bạn chọn một lần chạy dài, ba lần chạy, hay năm lần chạy ngắn, báo ở những mốc nào, và có bật hành động dính không? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>một tuần</td><td>20 triệu khung nhân 7 ngày</td><td>$\hlb{140}$ triệu khung</td></tr>
          <tr><td>5 lần chạy</td><td>140 triệu chia 5</td><td>$\hlg{28}$ triệu khung mỗi lần</td></tr>
          <tr><td>so với các mốc</td><td>28 triệu: qua mốc 10 triệu, chưa tới mốc 50 triệu</td><td>báo ở 10 triệu và 28 triệu</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, làm từng bước. Một tuần là 20 triệu khung nhân 7 ngày, bằng 140 triệu khung. Chia cho 5 lần chạy, mỗi lần được 28 triệu khung. Con số này qua mốc 10 triệu nhưng chưa tới mốc 50 triệu, nên báo điểm ở 10 triệu và 28 triệu khung."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>1 lần chạy, 140 triệu khung</td><td>đi xa nhất trên đường cong học</td><td>không tách được may rủi với hiệu quả thật</td></tr>
          <tr><td>3 lần chạy, khoảng 46,7 triệu khung</td><td>vừa xa vừa có độ lệch giữa các lần</td><td>3 mẫu vẫn ít; chưa tới mốc 50 triệu</td></tr>
          <tr><td>5 lần chạy, 28 triệu khung, có hành động dính</td><td>so được với chuẩn chung ở mốc 10 triệu; thấy độ dao động</td><td>chưa biết kết quả về lâu dài</td></tr></table>
          <p class="note">Chọn 5 lần chạy, có hành động dính, báo ở 10 và 28 triệu khung, ghi rõ khung của máy. Điều kiện đổi: nếu mục tiêu là kết quả cuối cùng và đã biết phương pháp ổn định qua các lần chạy, chuyển sang ít lần chạy hơn mà dài hơn.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Đáp án câu hai là một đánh đổi. Một lần chạy dài 140 triệu khung đi xa nhất trên đường cong học, nhưng không tách được may rủi với hiệu quả thật. Ba lần chạy, mỗi lần khoảng 46 phẩy 7 triệu khung, vừa xa vừa thấy độ lệch, nhưng 3 mẫu vẫn ít và chưa tới mốc 50 triệu. Năm lần chạy 28 triệu khung có hành động dính so được với chuẩn chung ở mốc 10 triệu và thấy độ dao động, đổi lại chưa biết kết quả về lâu dài. Nên chọn năm lần chạy và ghi rõ khung của máy, chỉ chuyển sang ít lần chạy dài hơn khi phương pháp đã được biết là ổn định."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">2013: bộ nhớ phát lại, 7 trò</span><span class="a">→</span>
          <span class="n">2015: mạng đích, 49 trò, chuẩn hoá theo người</span><span class="a">→</span>
          <span class="n">2017: gộp 6 cải tiến, bỏ từng phần để đo</span><span class="a">→</span>
          <span class="n">2018: hành động dính, chuẩn báo cáo chung</span><span class="a">→</span>
          <span class="n">2020: cả 57 trò, nhìn vào đuôi</span></div>
        say: "Tổng kết lại hành trình. Năm 2013, bộ nhớ phát lại cho một mạng chơi được 7 trò. Năm 2015, mạng đích và cách chuẩn hoá theo người đưa lên 49 trò. Năm 2017, gộp 6 cải tiến rồi bỏ từng phần để đo phần nào quan trọng. Năm 2018, hành động dính và một chuẩn báo cáo chung giúp cả cộng đồng so được với nhau. Năm 2020, một tác tử vượt mốc người ở cả 57 trò nhờ nhìn vào các trò còn thua."
      - show: |
          <div class="box key"><b>Tư duy:</b> càng lớn, cái khó càng chuyển từ “làm cho nó học được” sang “đo cho đúng”. Trước khi tin một con số: hỏi đơn vị đếm là gì, bao nhiêu lần chạy, môi trường có ngẫu nhiên không, và trò nào còn thua.</div>
        say: "Điều cần mang theo, càng lớn thì cái khó càng chuyển từ làm cho nó học được sang đo cho đúng. Trước khi tin một con số, hãy hỏi đơn vị đếm là gì, bao nhiêu lần chạy, môi trường có ngẫu nhiên không, và những trò nào còn thua."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá <b>Học tăng cường</b>. Từ lợi nhuận chiết khấu, phương trình tự nhất quán, khám phá, học từ lượt chơi, mạng Q sâu, gradient chính sách, cắt tỉ số, phần thưởng từ người, khai thác phần thưởng và đánh giá ngoại tuyến, bạn đã đi tới cách cả một cộng đồng học cách đo cho đúng.</p>
        say: "Đây là bài cuối của khoá học tăng cường. Bạn đã đi từ lợi nhuận chiết khấu, phương trình tự nhất quán và khám phá, tới học từ lượt chơi và mạng Q sâu. Rồi tới gradient chính sách, cắt tỉ số, phần thưởng từ người, khai thác phần thưởng và đánh giá ngoại tuyến. Cuối cùng là cách cả một cộng đồng học cách đo cho đúng, cảm ơn bạn đã theo học."
