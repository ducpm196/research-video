# Quy ước: điểm thưởng r_A, r_B của hai câu trả lời; hiệu d = r_A − r_B (KHÔNG dùng Δ — sổ chung là định thức); xác suất người chọn A là
#   σ(d) = 1 / (1 + e mũ âm d) (alg.rln_sigmoid); mất mát khi người chọn A là −ln σ(d). Ví dụ học thẳng hai điểm như hai tham số
#   (alg.rln_pref_steps) — mô hình thật là mạng nơ-ron cho điểm, đạo hàm theo điểm giống hệt. Phạt độ lệch: r − β·ln(π / π_gốc)
#   (alg.rln_kl_reward); π_gốc = mô hình trước khi học tăng cường, đóng băng. Tên “Bradley–Terry”, tên mô hình, tên tác giả chỉ trên màn
#   hình; lời đọc nói “mô hình so sánh cặp”, “hàm xích-ma” (như LLM bài 9). Số câu trả lời 2 điểm / 1,5 điểm, β 0,1 / 1 là SỐ MINH HOẠ.
objectives:
  - "Tính xác suất người chọn A hơn B và mất mát −ln σ(r_A − r_B) từ hai điểm thưởng"
  - "Tính đạo hàm 1 − σ(d) và chạy từng bước học điểm thưởng bằng tay"
  - "Tính phần thưởng có phạt độ lệch r − β·ln(π / π_gốc) và thấy β đổi lựa chọn"
  - "Nhận ra lỗi trộn các cặp so sánh của cùng một câu hỏi và lỗi bỏ phạt độ lệch"
