scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Không viết được phần thưởng cho một cú lộn ngược"
    checks:
      - "900 < 1000 and 13 < 33 > 31"
    steps:
      - show: |
          <p>Hãy viết công thức phần thưởng cho “một robot mô phỏng lộn ngược đẹp rồi đáp đứng”. Rất khó. Năm 2017, một nhóm tác giả thay công thức bằng câu hỏi cho người: <b>đoạn nào giống lộn ngược hơn?</b> Với <b>900 lần hỏi</b>, trong chưa tới một giờ, robot học được động tác.</p>
          <p>Năm 2022, cùng ý tưởng được dùng để chỉnh mô hình ngôn ngữ: người chấm xếp hạng câu trả lời, máy học một <b>mô hình phần thưởng</b> từ các lựa chọn đó.</p>
          <div class="box key">Hôm nay: từ “A hơn B” làm sao ra con số phần thưởng? Học con số đó từng bước ra sao? Và vì sao phải phạt khi mô hình đi xa mô hình ban đầu?</div>
        focus: [1, 1, 1, 2, 3]
        say: "Chào bạn, hãy thử viết công thức phần thưởng cho một robot mô phỏng lộn ngược đẹp rồi đáp đứng, rất khó. Năm 2017, một nhóm tác giả thay công thức bằng câu hỏi cho người, đoạn nào giống lộn ngược hơn. Với 900 lần hỏi, trong chưa tới một giờ, robot học được động tác. Năm 2022, cùng ý tưởng được dùng để chỉnh mô hình ngôn ngữ, người chấm xếp hạng câu trả lời và máy học một mô hình phần thưởng từ các lựa chọn đó. Hôm nay ta hỏi, từ A hơn B làm sao ra con số phần thưởng, học nó từng bước ra sao, và vì sao phải phạt khi mô hình đi xa bản ban đầu."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "[round(alg.rln_sigmoid(x), 3) for x in (-1, 0, 1)] == [0.269, 0.5, 0.731] and abs(alg.rln_sigmoid(-1) + alg.rln_sigmoid(1) - 1) < 1e-12"
      - "round(-math.log(0.731), 3) == 0.313 and math.log(1) == 0 and round(math.log(10), 3) == 2.303"
      - "round(4 - 0.5 * (2 * 4 - 6), 10) == 3"
      - "(lambda f: f(4) == -8 and f(3) == -9 and round((f(4.001) - f(3.999)) / 0.002, 6) == 2)(lambda w: w * w - 6 * w)"
      - "round(math.exp(-1), 3) == 0.368 and round(1 / 1.368, 3) == 0.731 == round(alg.rln_sigmoid(1), 3)"
    steps:
      - show: |
          <p><b>① Hàm xích-ma</b> $\sigma(x) = \frac{1}{1 + e^{-x}}$, với $e \approx 2{,}718$, biến một số bất kỳ thành một số giữa 0 và 1, nên dùng làm xác suất được. Làm thử $x = 1$: $e^{-x} = \frac{1}{e} \approx 0{,}368$, nên $\sigma(1) = \frac{1}{1{,}368} \approx 0{,}731$.</p>
          <table class="t"><tr><th>$x$</th><th>−1</th><th>0</th><th>1</th></tr><tr><td>$\sigma(x)$</td><td>0,269</td><td>0,5</td><td>0,731</td></tr></table>
          <p class="note">$\sigma(-x) = 1 - \sigma(x)$: 0,269 + 0,731 = 1.</p>
        introduces: [sigm, exp]
        focus: [1, 1, 1, "2.2", 3]
        say: "Điều thứ nhất là hàm xích-ma, bằng 1 chia cho 1 cộng e mũ âm x, với e khoảng 2 phẩy 718. Hàm này biến một số bất kỳ thành một số giữa 0 và 1, nên dùng làm xác suất được. Làm thử với x bằng 1, e mũ âm 1, tức 1 chia e, khoảng 0 phẩy 368, nên xích-ma của 1 bằng 1 chia 1 phẩy 368, khoảng 0 phẩy 731. Tại 0 hàm bằng 0 phẩy 5, còn tại âm 1 là 0 phẩy 269. Hai số đó cộng lại bằng 1, vì xích-ma của âm x bằng 1 trừ xích-ma của x."
      - show: |
          <p><b>② Lôgarit tự nhiên</b> $\ln x$ là số mũ phải nâng $e$ lên để được $x$: $\ln 1 = 0$; $\;\ln 10 \approx 2{,}303$; $\;-\ln 0{,}731 \approx 0{,}313$. Xác suất càng gần 1 thì $-\ln$ càng gần 0.</p>
          <p><b>③ Một bước giảm dốc.</b> Muốn làm một hàm nhỏ đi, nhích biến <b>ngược chiều đạo hàm</b> (đạo hàm là độ dốc: hàm đổi bao nhiêu khi biến nhích lên một chút): $w \leftarrow w - \eta \cdot \text{đạo hàm}$, với $\eta$ là tốc độ học. Ví dụ $f(w) = w^2 - 6w$ có đạo hàm $2w - 6$. Ở $w = 4$: $f = -8$, đạo hàm bằng 2 (dốc lên, nên lùi); $\eta = 0{,}5$: $w$ mới $= 4 - 0{,}5 \cdot 2 = 3$, và $f(3) = -9$ nhỏ hơn ✓.</p>
        introduces: [log, assign, eta]
        focus: [1, 1, 1, 2, 2, 2, 2, 2]
        say: "Điều thứ hai là lôgarit tự nhiên, lôgarit của x là số mũ phải nâng e lên để được x. Lôgarit của 1 bằng 0, lôgarit của 10 xấp xỉ 2 phẩy 303, và âm lôgarit của 0 phẩy 731 xấp xỉ 0 phẩy 313. Xác suất càng gần 1 thì âm lôgarit càng gần 0. Điều thứ ba là một bước giảm dốc, muốn làm một hàm nhỏ đi thì nhích biến ngược chiều đạo hàm, tức ngược chiều độ dốc. Công thức là w thay bằng w trừ ê-ta nhân đạo hàm, với ê-ta là tốc độ học. Ví dụ hàm w bình phương trừ 6w có đạo hàm 2w trừ 6. Ở w bằng 4, hàm bằng âm 8 và đạo hàm bằng 2, tức dốc lên, nên phải lùi. Với ê-ta bằng 0 phẩy 5, w mới bằng 4 trừ 0 phẩy 5 nhân 2, bằng 3, và hàm giảm xuống âm 9."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: điểm của A và B, hiệu d, mất mát"
    checks:
      - "round(alg.rln_sigmoid(2 - 1), 3) == 0.731 and round(-math.log(alg.rln_sigmoid(1)), 3) == 0.313"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc</th><th>nghĩa</th></tr>
          <tr><td>$r_A, r_B$</td><td>r A, r B</td><td>điểm thưởng mô hình cho câu trả lời A, B</td></tr>
          <tr><td>$d = r_A - r_B$</td><td>d</td><td>hiệu hai điểm</td></tr>
          <tr><td>$P(\text{A hơn B}) = \sigma(d)$</td><td>xác suất A hơn B</td><td>khả năng người chọn A, theo mô hình so sánh cặp (mô hình Bradley–Terry, 1952)</td></tr>
          <tr><td>$-\ln \sigma(d)$</td><td>âm ln xích-ma của d</td><td>mất mát khi người đã chọn A</td></tr></table>
        introduces: [prob]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu các ký hiệu của bài. R A và r B là điểm thưởng mô hình cho câu trả lời A và B. D là hiệu hai điểm, r A trừ r B. Xác suất người chọn A bằng xích-ma của d, đó là mô hình so sánh cặp. Mất mát khi người đã chọn A là âm lôgarit của xích-ma của d."
      - show: |
          <p>Làm thử: $r_A = 2$, $r_B = 1$ nên $d = 1$; $\;P(\text{A hơn B}) = \sigma(1) \approx 0{,}731$; mất mát $-\ln 0{,}731 \approx 0{,}313$.</p>
          <p class="note">Chỉ <b>hiệu</b> hai điểm có nghĩa: $r_A = 12$, $r_B = 11$ cho đúng cùng xác suất.</p>
        focus: [1, 1, 2]
        say: "Làm thử với r A bằng 2 và r B bằng 1, hiệu d bằng 1, nên xác suất A hơn B là xích-ma của 1, xấp xỉ 0 phẩy 731. Mất mát là âm lôgarit của 0 phẩy 731, xấp xỉ 0 phẩy 313. Chỉ hiệu hai điểm có nghĩa, nên 12 và 11 cho đúng cùng xác suất."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai vòng: học phần thưởng từ người, rồi học chính sách từ phần thưởng"
    steps:
      - show: |
          <div><svg width="1000" height="360" viewBox="0 0 1000 360"><defs><marker id="rl10a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
          <g font-size="22" text-anchor="middle" fill="#1f2937">
          <rect x="20" y="30" width="230" height="110" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="2.5"/><text x="135" y="75" font-weight="bold">người chấm</text><text x="135" y="110">chọn: A hơn B</text>
          <rect x="370" y="30" width="260" height="110" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2.5"/><text x="500" y="75" font-weight="bold">mô hình phần thưởng</text><text x="500" y="110">cho điểm r</text>
          <rect x="370" y="220" width="260" height="110" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/><text x="500" y="265" font-weight="bold">chính sách</text><text x="500" y="300">viết câu trả lời</text>
          <rect x="750" y="220" width="230" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5"/><text x="865" y="265" font-weight="bold">mô hình gốc</text><text x="865" y="300">đóng băng</text>
          </g>
          <line x1="255" y1="85" x2="362" y2="85" stroke="#1f2937" stroke-width="3" marker-end="url(#rl10a)"/>
          <line x1="500" y1="145" x2="500" y2="212" stroke="#1f2937" stroke-width="3" marker-end="url(#rl10a)"/>
          <line x1="745" y1="275" x2="638" y2="275" stroke="#1f2937" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#rl10a)"/>
          <g font-size="20" fill="#1f2937"><text x="310" y="70" text-anchor="middle">học điểm</text>
