assumes: [arith, power, approx, frac, cdot, sub, disc, dots, policy, prob, given, lr, assign, prime, tderr]
# Quy ước: Q(s, a) là ước lượng giá trị khi ở s chọn a rồi chơi tiếp; a' là hành động ở s'. Lưới vách đá theo Ví dụ 6.6 của Sutton & Barto:
#   4 hàng × 12 cột, xuất phát góc trái dưới, đích góc phải dưới, 10 ô vách giữa; −1 mỗi bước, rơi vách −100 và về xuất phát; γ = 1;
#   epsilon = 0,1. Tốc độ học α = 0,1 là số bài chọn cho mô phỏng (alg.rln_cliff; 20 lần chạy × 500 lượt, hạt giống 0..19) —
#   sách không ghi α trong phần đã trích. Tên “Q-learning”, “SARSA” chỉ trên màn hình (chưa đạt probe); lời đọc nói “học Q lấy số lớn
#   nhất” (ngoài chính sách) và “học Q theo hành động thật” (theo chính sách).
objectives:
  - "Viết cập nhật học Q lấy số lớn nhất và học Q theo hành động thật cho cùng một bước"
  - "Tính xác suất rơi vách mỗi bước khi còn khám phá, và giải thích vì sao cách theo hành động thật chọn đường an toàn"
  - "Phân biệt giá trị học được với điểm số khi chạy thật còn khám phá"
