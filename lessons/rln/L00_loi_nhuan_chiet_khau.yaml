title: "Bài 0 — Bài toán học tăng cường: trạng thái, hành động, phần thưởng và lợi nhuận chiết khấu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rln.yaml L00; audit/rln/verify_rln.py L00; audit/rln/sources_L00.md; R. S. Sutton, A. G. Barto, Reinforcement Learning: An Introduction, bản 2 (2018), mục 3.1 (tác tử và môi trường), 3.3 (lợi nhuận chiết khấu, công thức 3.8 và 3.9), bản PDF chính thức incompleteideas.net/book/RLbook2020.pdf; CS115 bài 39 (tổng phần thưởng chiết khấu, đã học)"
assumes: [arith, power, approx, frac, geq]
# Quy ước ký hiệu (cả khoá, tools/registry/symbols.RLN.yaml): bước thời gian t = 0, 1, 2, …; trạng thái s, hành động a, phần thưởng r;
#   phần thưởng nhận SAU hành động ở bước t viết r_{t+1} (như Sutton & Barto), nên lợi nhuận từ đầu là G_0 = r_1 + γ·r_2 + γ²·r_3 + …;
#   gam-ma = hệ số chiết khấu, 0 ≤ γ ≤ 1; phép nhân viết \cdot. Nhắc CS115 bằng “khoá Toán cho khoa học máy tính” (không ghi số bài khoá khác).
# Số trong bài là SỐ MINH HOẠ (lượt chơi dựng tay), mọi phép tính có checks; công thức 3.8, 3.9 của Sutton & Barto ghi ở sources_L00.md.
objectives:
  - "Mô tả vòng lặp tác tử – môi trường bằng trạng thái, hành động, phần thưởng"
  - "Tính lợi nhuận chiết khấu G theo hai đường: cộng xuôi và đệ quy ngược G_t = r_{t+1} + γ·G_{t+1}"
  - "Suy ra 1 / (1 − γ) cho phần thưởng 1 mãi mãi và giải thích khi nào tổng không hội tụ"
  - "Chọn γ để tác tử chịu chờ phần thưởng lớn hơn, và nhận ra ở nhiệm vụ có lượt chơi kết thúc, cộng hằng số vào mọi phần thưởng có thể làm đổi quyết định"
