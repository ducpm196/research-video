scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng một trò chơi, hai tác tử chọn khác nhau"
    checks:
      - "alg.rln_return([0, 0, 10], 0.9) > 6 > alg.rln_return([0, 0, 10], 0.7)"
    steps:
      - show: |
          <p>Hai chương trình học cùng một trò chơi. Ở ô xuất phát có hai lựa chọn: lấy <b>6 điểm ngay</b> rồi hết lượt, hoặc đi thêm hai bước không điểm để lấy <b>10 điểm</b>.</p>
          <p>Chương trình thứ nhất luôn chờ để lấy 10. Chương trình thứ hai luôn lấy 6 ngay. Cả hai đều “đúng” — chúng chỉ khác nhau <b>một con số</b>.</p>
          <div class="box key">Hôm nay: phần thưởng về sau đáng giá bao nhiêu? Con số đó quyết định hành vi ra sao? Và khi nào tổng phần thưởng trở thành vô hạn?</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, hai chương trình học cùng một trò chơi, ở ô xuất phát có thể lấy 6 điểm ngay, hoặc đi thêm hai bước để lấy 10 điểm. Chương trình thứ nhất luôn chờ lấy 10, chương trình thứ hai luôn lấy 6 ngay. Cả hai đều đúng theo cách của nó, vì chúng chỉ khác nhau một con số. Hôm nay ta trả lời ba câu hỏi, phần thưởng về sau đáng giá bao nhiêu, con số đó quyết định hành vi ra sao, và khi nào tổng phần thưởng trở thành vô hạn."
      - clear: true
        show: |
          <table class="t"><tr><th>chặng của khoá</th><th>các bài</th><th>trả lời câu hỏi</th></tr>
          <tr><td>giá trị khi biết luật chơi</td><td>bài 1–2</td><td>mỗi trạng thái đáng giá bao nhiêu; cải thiện cách chơi tới tối ưu</td></tr>
          <tr><td>học từ thử nghiệm</td><td>bài 3–6</td><td>thử cái mới hay dùng cái đã biết; học từ lượt chơi thật; dùng mạng nơ-ron</td></tr>
          <tr><td>học thẳng cách chơi</td><td>bài 7–9</td><td>chỉnh xác suất của hành động; cập nhật mà không đi quá xa</td></tr>
          <tr><td>phần thưởng và an toàn</td><td>bài 10–11</td><td>học phần thưởng từ người; khi tác tử “lách luật”</td></tr>
          <tr><td>người làm nghề</td><td>bài 12–13</td><td>đánh giá cách chơi mới từ nhật ký cũ; hành trình 2013–2020 trên trò điện tử</td></tr></table>
        forward_ref: true
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng là bản đồ của khoá học. Bài 1 và bài 2 tính giá trị của mỗi trạng thái khi đã biết luật chơi. Bài 3 tới bài 6 học từ thử nghiệm thật, cho tới dùng mạng nơ-ron. Bài 7 tới bài 9 học thẳng xác suất chọn từng hành động. Bài 10 và bài 11 nói về phần thưởng học từ người, và khi tác tử lách luật. Bài 12 và bài 13 là tình huống của người làm nghề, từ nhật ký cũ tới hành trình 2013 tới 2020 trên trò điện tử."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba phép tính sẽ dùng"
    checks:
      - "round(0.9 ** 2, 10) == 0.81 and round(0.9 ** 3, 10) == 0.729"
      - "1 + 0.5 + 0.25 + 0.125 == 1.875 and 1 / (1 - 0.5) == 2"
      - "(lambda S: abs(S - 0.5 * S - 1) < 1e-12 and abs(S - 2) < 1e-12)(sum(0.5 ** k for k in range(200)))"
      - "round(0.9 * 2 + 0.9 ** 2 * 3, 10) == round(0.9 * (2 + 0.9 * 3), 10) == 4.23"
    steps:
      - show: |
          <p><b>① Lũy thừa của số nhỏ hơn 1 thì nhỏ dần.</b> $0{,}9^2 = 0{,}9 \cdot 0{,}9 = 0{,}81$; $\;0{,}9^3 = 0{,}729$. Dấu chấm giữa $\cdot$ là phép nhân.</p>
        introduces: [cdot]
        say: "Điều thứ nhất, lũy thừa của một số nhỏ hơn 1 thì nhỏ dần. 0 phẩy 9 bình phương là 0 phẩy 9 nhân 0 phẩy 9, bằng 0 phẩy 81, còn 0 phẩy 9 mũ 3 bằng 0 phẩy 729. Dấu chấm ở giữa hai số là phép nhân."
      - show: |
          <p><b>② Cộng mãi các số nhỏ dần có thể ra số hữu hạn.</b> $1 + 0{,}5 + 0{,}25 + 0{,}125 = 1{,}875$; cứ cộng tiếp thì tổng tiến sát <b>2</b>, không vượt qua.</p>
          <p class="note">Quy tắc chung: gọi $S = 1 + q + q^2 + \dots$ với $q$ nhỏ hơn 1 (ba chấm nghĩa là cứ thế tiếp tục). Nhân cả tổng với $q$ được $q + q^2 + \dots$, chính là $S$ bỏ đi số 1 đầu tiên, nên $S - q \cdot S = 1$, tức $S = \frac{1}{1 - q}$. Thay $q = 0{,}5$: $\frac{1}{1 - 0{,}5} = 2$ ✓.</p>
        introduces: [dots]
        focus: [1, 1, 2, 2, 2, 2]
        say: "Điều thứ hai, cộng mãi các số nhỏ dần có thể ra số hữu hạn. Ví dụ 1 cộng 0 phẩy 5 cộng 0 phẩy 25 cộng 0 phẩy 125 bằng 1 phẩy 875, cứ cộng tiếp thì tiến sát 2. Quy tắc chung là gọi S bằng tổng 1 cộng q cộng q bình phương, và cứ thế tiếp tục, với q nhỏ hơn 1. Nhân cả tổng với q, ta được q cộng q bình phương và cứ thế, chính là S bỏ đi số 1 đầu tiên. Vì vậy S trừ q nhân S bằng 1, tức S bằng 1 chia cho 1 trừ q. Thay q bằng 0 phẩy 5 thì được 2, khớp phép cộng vừa rồi."
      - show: |
          <p><b>③ Đặt thừa số chung.</b> $0{,}9 \cdot 2 + 0{,}9^2 \cdot 3 = 0{,}9 \cdot (2 + 0{,}9 \cdot 3)$, vì mọi số hạng đều có ít nhất một thừa số 0,9.</p>
          <p class="note">Làm thử: vế trái $1{,}8 + 2{,}43 = 4{,}23$; vế phải $0{,}9 \cdot 4{,}7 = 4{,}23$ ✓.</p>
        focus: [1, 1, 1, 2]
        say: "Điều thứ ba là đặt thừa số chung. 0 phẩy 9 nhân 2, cộng 0 phẩy 9 bình phương nhân 3, bằng 0 phẩy 9 nhân ngoặc 2 cộng 0 phẩy 9 nhân 3. Ta làm được vậy vì mọi số hạng đều có ít nhất một thừa số 0 phẩy 9. Làm thử, vế trái là 1 phẩy 8 cộng 2 phẩy 43, bằng 4 phẩy 23, vế phải là 0 phẩy 9 nhân 4 phẩy 7, cũng bằng 4 phẩy 23."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: s, a, r, γ và G"
    checks:
      - "round(alg.rln_return([0, 0, 10], 0.9), 10) == round(0.81 * 10, 10) == 8.1"
      - "alg.rln_returns_backward([0, 0, 10], 0.9)[1:] == [9.0, 10.0]"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc</th><th>nghĩa</th><th>ví dụ trong trò chơi</th></tr>
          <tr><td>$s$</td><td>trạng thái</td><td>tình thế tác tử đang ở</td><td>ô xuất phát</td></tr>
          <tr><td>$a$</td><td>hành động</td><td>điều tác tử chọn làm</td><td>“lấy ngay” hoặc “đi tiếp”</td></tr>
          <tr><td>$r_1, r_2, r_3$</td><td>r một, r hai, r ba</td><td>phần thưởng nhận sau bước 1, 2, 3; chỉ số dưới là số thứ tự bước</td><td>0, 0, 10</td></tr></table>
        introduces: [sub]
        focus: [1, "1.2", "1.3", "1.4", "1.4"]
        say: "Bài dùng ba ký hiệu đầu tiên. s là trạng thái, tức tình thế tác tử đang ở, như ô xuất phát. a là hành động, điều tác tử chọn làm, như lấy ngay hoặc đi tiếp. r một, r hai, r ba là phần thưởng nhận sau bước 1, bước 2, bước 3, trong ví dụ là 0, 0 và 10. Con số nhỏ viết dưới chân chữ r là số thứ tự của bước."
      - clear: true
        show: |
          <p>Chữ Hy Lạp $\gamma$, đọc là <b>gam-ma</b>: <b>hệ số chiết khấu</b>, một số từ 0 tới 1. Phần thưởng đến chậm $k$ bước được nhân $\gamma^k$.</p>
          $$G = r_1 + \gamma \cdot r_2 + \gamma^2 \cdot r_3 + \dots$$
          <p class="note">$G$ là <b>lợi nhuận chiết khấu</b>. Làm thử với 0, 0, 10 và $\gamma = 0{,}9$: $G = 0 + 0 + 0{,}81 \cdot 10 = 8{,}1$.</p>
        introduces: [disc]
        focus: [1, 1, 2, 3]
        say: "Chữ Hy Lạp này đọc là gam-ma, là hệ số chiết khấu, một số từ 0 tới 1. Phần thưởng đến chậm k bước thì được nhân với gam-ma mũ k. Lợi nhuận chiết khấu G bằng r một, cộng gam-ma nhân r hai, cộng gam-ma bình phương nhân r ba, và cứ thế tiếp tục. Làm thử với chuỗi 0, 0, 10 và gam-ma bằng 0 phẩy 9, ta được 0 phẩy 81 nhân 10, bằng 8 phẩy 1."
      - show: |
          <p>Khi cần nói lợi nhuận <b>tính từ bước $t$</b>, ta viết $G_t$, đọc là G t. Vậy $G_0$ là lợi nhuận từ đầu, $G_1$ là lợi nhuận tính từ sau bước đầu tiên.</p>
          <p class="note">Ví dụ 0, 0, 10: $G_1 = 0 + 0{,}9 \cdot 10 = 9$; $\;G_2 = 10$.</p>
        focus: [1, 1, 2]
        say: "Khi cần nói lợi nhuận tính từ bước t, ta viết G với chỉ số dưới t, đọc là G t. Vậy G không là lợi nhuận từ đầu, còn G một là lợi nhuận tính từ sau bước đầu tiên. Trong ví dụ 0, 0, 10, G một bằng 0 cộng 0 phẩy 9 nhân 10, tức là 9, và G hai bằng 10."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Vòng lặp tác tử – môi trường, và phần thưởng co lại theo thời gian"
    checks:
      - "[round(0.9 ** k, 3) for k in range(4)] == [1.0, 0.9, 0.81, 0.729]"
    steps:
      - show: |
          <div><svg width="1000" height="350" viewBox="0 0 1000 350"><defs><marker id="rl0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
          <g font-size="26" text-anchor="middle">
          <rect x="60" y="110" width="260" height="110" rx="12" fill="#ffedd5" stroke="#eb6834" stroke-width="2.5"/><text x="190" y="160" fill="#1f2937" font-weight="bold">tác tử</text><text x="190" y="195" font-size="21" fill="#1f2937">chọn hành động</text>
          <rect x="680" y="110" width="260" height="110" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="2.5"/><text x="810" y="160" fill="#1f2937" font-weight="bold">môi trường</text><text x="810" y="195" font-size="21" fill="#1f2937">luật của trò chơi</text>
          </g>
          <path d="M190,105 C190,30 810,30 810,105" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#rl0a)"/>
          <path d="M810,225 C810,285 190,285 190,225" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#rl0a)"/>
          <text x="500" y="38" font-size="24" fill="#eb6834" text-anchor="middle" font-weight="bold">hành động a ở bước t</text>
          <text x="500" y="335" font-size="24" fill="#2a78d6" text-anchor="middle" font-weight="bold">trạng thái mới + phần thưởng r</text>
          <text x="500" y="172" font-size="22" fill="#6b7280" text-anchor="middle">lặp lại tới khi hết lượt chơi</text>
          </svg></div>
        say: "Hình là vòng lặp của mọi bài toán học tăng cường. Ở mỗi bước, tác tử nhìn trạng thái rồi chọn một hành động. Môi trường, tức luật của trò chơi, đáp lại bằng một trạng thái mới và một phần thưởng. Không ai nói cho tác tử biết hành động nào là đúng, nó phải tự thử."
      - clear: true
        show: |
          <div><svg width="1000" height="300" viewBox="0 0 1000 300"><g font-size="22" text-anchor="middle">
          <line x1="80" y1="240" x2="960" y2="240" stroke="#1f2937" stroke-width="2"/>
          <rect x="130" y="40" width="110" height="200" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="185" y="30" fill="#1f2937">1</text><text x="185" y="270" fill="#1f2937">bước 1</text>
          <rect x="330" y="60" width="110" height="180" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="385" y="50" fill="#1f2937">0,9</text><text x="385" y="270" fill="#1f2937">bước 2</text>
          <rect x="530" y="78" width="110" height="162" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="585" y="68" fill="#1f2937">0,81</text><text x="585" y="270" fill="#1f2937">bước 3</text>
          <rect x="730" y="94" width="110" height="146" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="785" y="84" fill="#1f2937">0,729</text><text x="785" y="270" fill="#1f2937">bước 4</text>
          </g><text x="990" y="150" font-size="22" fill="#6b7280" text-anchor="end">mỗi bước</text><text x="990" y="180" font-size="22" fill="#6b7280" text-anchor="end">nhân 0,9</text></svg></div>
          <p class="note">Một điểm thưởng ở bước 1, 2, 3, 4 được tính là 1; 0,9; 0,81; 0,729 khi $\gamma = 0{,}9$.</p>
        focus: [1, 1, 2]
        say: "Hình thứ hai cho thấy chiết khấu làm gì. Với gam-ma bằng 0 phẩy 9, một điểm thưởng ở bước 1 được tính là 1, ở bước 2 là 0 phẩy 9, ở bước 3 là 0 phẩy 81, và ở bước 4 là 0 phẩy 729. Mỗi bước chậm hơn, cột ngắn đi một phần mười."

  # ───────────────────────── 5. KHÁI NIỆM ─────────────────────────
  - id: concept
    kind: concept
    title: "Lượt chơi có kết thúc và nhiệm vụ không bao giờ dừng"
    checks:
      - "1 / (1 - 0.9) > 9.99 and round(1 / (1 - 0.99)) == 100"
    steps:
      - show: |
          <table class="t"><tr><th>loại nhiệm vụ</th><th>ví dụ</th><th>tổng phần thưởng</th></tr>
          <tr><td>có <b>lượt chơi</b> kết thúc</td><td>một ván cờ, một lần ra mê cung</td><td>tổng hữu hạn số hạng — luôn có nghĩa, kể cả $\gamma = 1$</td></tr>
          <tr><td><b>liên tục</b>, không dừng</td><td>điều khiển nhiệt độ một toà nhà</td><td>vô hạn số hạng — cần $\gamma$ nhỏ hơn 1 để tổng hữu hạn</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Có hai loại nhiệm vụ. Loại có lượt chơi kết thúc, như một ván cờ, có hữu hạn số hạng nên tổng luôn có nghĩa, kể cả khi gam-ma bằng 1. Loại liên tục không bao giờ dừng, như điều khiển nhiệt độ toà nhà, cần gam-ma nhỏ hơn 1 để tổng còn hữu hạn."
      - show: |
          <p><b>Đường chân trời:</b> với $\gamma$ nhỏ hơn 1, phần thưởng 1 mỗi bước mãi mãi có tổng $\frac{1}{1 - \gamma}$. Con số này cho biết tác tử “nhìn xa” khoảng bao nhiêu bước.</p>
          <p class="note">$\gamma = 0{,}9$: khoảng 10 bước. $\;\gamma = 0{,}99$: khoảng 100 bước.</p>
        focus: [1, 1, 2]
        say: "Một cách hiểu gam-ma là đường chân trời. Với gam-ma nhỏ hơn 1, phần thưởng 1 mỗi bước mãi mãi có tổng là 1 chia cho 1 trừ gam-ma, và con số này cho biết tác tử nhìn xa khoảng bao nhiêu bước. Gam-ma bằng 0 phẩy 9 thì nhìn xa khoảng 10 bước, còn 0 phẩy 99 thì khoảng 100 bước."

  # ───────────────────────── 6. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra công thức đệ quy và tổng 1 / (1 − γ)"
    checks:
      - "alg.rln_return([2, 3], 0.9) == 2 + 0.9 * alg.rln_return([3], 0.9)"
      - "abs(alg.rln_return([1] * 3000, 0.9) - 10) < 1e-9 and abs(1 + 0.9 * 10 - 10) < 1e-12"
    steps:
      - show: |
          <p><b>Bước 1.</b> Viết lợi nhuận từ đầu, rồi <b>đặt thừa số chung</b> $\gamma$ cho mọi số hạng từ $r_2$ trở đi (như phép ③ ở phần ôn):</p>
          $$G_0 = r_1 + \gamma \cdot (r_2 + \gamma \cdot r_3 + \dots)$$
        focus: [1, 2]
        say: "Bước một, viết lợi nhuận từ đầu, rồi đặt thừa số chung gam-ma cho mọi số hạng từ r hai trở đi, vì số hạng nào từ đó trở đi cũng có ít nhất một thừa số gam-ma. Ta được G không bằng r một, cộng gam-ma nhân ngoặc r hai cộng gam-ma nhân r ba, và cứ thế tiếp tục."
      - show: |
          <p><b>Bước 2.</b> Trong ngoặc chính là lợi nhuận tính từ bước 1, tức $G_1$. Thay vào:</p>
          $$G_t = r_{t+1} + \gamma \cdot G_{t+1}$$
          <p class="note">Làm thử với chuỗi 2, 3 và $\gamma = 0{,}9$: $G_1 = 3$, nên $G_0 = 2 + 0{,}9 \cdot 3 = 4{,}7$ — bằng cộng thẳng $2 + 0{,}9 \cdot 3$ ✓.</p>
        focus: [1, 2, 3]
        say: "Bước hai, phần trong ngoặc chính là lợi nhuận tính từ bước 1, tức G một. Thay vào, ta được công thức đệ quy, G t bằng r t cộng 1, cộng gam-ma nhân G t cộng 1. Làm thử với chuỗi 2, 3 và gam-ma bằng 0 phẩy 9, G một bằng 3, nên G không bằng 2 cộng 0 phẩy 9 nhân 3, bằng 4 phẩy 7, khớp với cộng thẳng."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Phần thưởng 1 mỗi bước mãi mãi: tương lai nhìn từ bước sau <b>giống hệt</b> tương lai nhìn từ bây giờ, nên $G_1 = G_0 = G$. Thay vào công thức đệ quy:</p>
          $$G = 1 + \gamma \cdot G$$
        focus: [1, 1, 2]
        say: "Bước ba, xét phần thưởng 1 mỗi bước mãi mãi. Tương lai nhìn từ bước sau giống hệt tương lai nhìn từ bây giờ, nên G một bằng G không, gọi chung là G. Thay vào công thức đệ quy, ta được G bằng 1 cộng gam-ma nhân G."
      - show: |
          <p><b>Bước 4.</b> Chuyển $\gamma \cdot G$ sang trái rồi chia cho $1 - \gamma$ (được chia vì $\gamma$ nhỏ hơn 1):</p>
          $$G \cdot (1 - \gamma) = 1, \quad \text{nên} \quad \hlg{G = \frac{1}{1 - \gamma}}$$
          <p class="note">Làm thử $\gamma = 0{,}9$: $G = \frac{1}{0{,}1} = 10$, và đúng là $1 + 0{,}9 \cdot 10 = 10$ ✓.</p>
        focus: [1, 2, 3]
        say: "Bước bốn, chuyển gam-ma nhân G sang vế trái, được G nhân 1 trừ gam-ma bằng 1, rồi chia cho 1 trừ gam-ma, được chia vì gam-ma nhỏ hơn 1. Vậy G bằng 1 chia cho 1 trừ gam-ma. Làm thử với gam-ma bằng 0 phẩy 9, G bằng 1 chia 0 phẩy 1, bằng 10, và đúng là 1 cộng 0 phẩy 9 nhân 10 cũng bằng 10."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Một lượt chơi có phạt mỗi bước: −1, −1, 10"
    checks:
      - "alg.rln_returns_backward([-1, -1, 10], 0.9)[2] == 10"
      - "round(alg.rln_returns_backward([-1, -1, 10], 0.9)[1], 10) == 8"
      - "round(alg.rln_returns_backward([-1, -1, 10], 0.9)[0], 10) == 6.2"
      - "round(alg.rln_return([-1, -1, 10], 0.9), 10) == 6.2 and round(-1 - 0.9 + 8.1, 10) == 6.2"
    steps:
      - show: |
          <p>Lượt chơi: mỗi bước đi bị phạt −1, tới đích được 10. Phần thưởng: $r_1 = -1$, $r_2 = -1$, $r_3 = 10$; $\gamma = 0{,}9$. Tính <b>ngược từ cuối</b>.</p>
          <p><b>Bước 1.</b> Sau bước cuối không còn gì: $G_2 = r_3 = \hlb{10}$.</p>
        focus: [1, 2]
        say: "Xét một lượt chơi, mỗi bước đi bị phạt âm 1, tới đích được 10, nên phần thưởng lần lượt là âm 1, âm 1 và 10, với gam-ma bằng 0 phẩy 9. Ta tính ngược từ cuối, và bước một là sau bước cuối không còn gì, nên G hai bằng r ba, bằng 10."
      - show: |
          <p><b>Bước 1.</b> $G_2 = 10$.</p>
          <p><b>Bước 2.</b> Theo công thức đệ quy: $G_1 = r_2 + \gamma \cdot G_2 = -1 + 0{,}9 \cdot 10 = \hlb{8}$.</p>
        focus: [2, 2]
        say: "Bước hai, theo công thức đệ quy, G một bằng r hai cộng gam-ma nhân G hai. Thay số, âm 1 cộng 0 phẩy 9 nhân 10, bằng 8."
      - show: |
          <p><b>Bước 1.</b> $G_2 = 10$. <b>Bước 2.</b> $G_1 = 8$.</p>
          <p><b>Bước 3.</b> $G_0 = r_1 + \gamma \cdot G_1 = -1 + 0{,}9 \cdot 8 = \hlg{6{,}2}$.</p>
        focus: [2, 2]
        say: "Bước ba, G không bằng r một cộng gam-ma nhân G một. Thay số, âm 1 cộng 0 phẩy 9 nhân 8, bằng 6 phẩy 2."
      - clear: true
        show: |
          <table class="t"><tr><th>tính từ bước</th><th>phần thưởng còn lại</th><th>lợi nhuận</th></tr>
          <tr><td>$G_2$</td><td>10</td><td>10</td></tr>
          <tr><td>$G_1$</td><td>−1, 10</td><td>8</td></tr>
          <tr><td>$G_0$</td><td>−1, −1, 10</td><td>$\hlg{6{,}2}$</td></tr></table>
          <p class="note">Mỗi hàng chỉ cần hàng ngay dưới nó: tính ngược thì mỗi bước một phép nhân, một phép cộng.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước bốn, đặt ba kết quả cạnh nhau. Từ bước cuối, lợi nhuận là 10. Từ bước giữa, còn âm 1 và 10, lợi nhuận là 8. Từ đầu, còn cả ba phần thưởng, lợi nhuận là 6 phẩy 2. Mỗi hàng chỉ cần hàng ngay dưới nó, nên tính ngược thì mỗi bước chỉ có một phép nhân và một phép cộng."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: cộng xuôi, và cộng thật nhiều số hạng"
    checks:
      - "round(-1 + 0.9 * -1 + 0.81 * 10, 10) == 6.2"
      - "[round(10 * (1 - 0.9 ** n), 3) for n in (10, 50, 100)] == [6.513, 9.948, 10.0] and round(alg.rln_return([1] * 10, 0.9), 3) == 6.513"
    steps:
      - show: |
          <p><b>Đường khác 1 — cộng xuôi</b>, không dùng đệ quy:</p>
          $$G_0 = -1 + 0{,}9 \cdot (-1) + 0{,}81 \cdot 10 = -1 - 0{,}9 + 8{,}1 = 6{,}2 \checkmark$$
        focus: [1, 2]
        say: "Kiểm tra thứ nhất, ta cộng xuôi theo đúng định nghĩa, nghĩa là không dùng đệ quy. Âm 1, cộng 0 phẩy 9 nhân âm 1, cộng 0 phẩy 81 nhân 10, tức âm 1 trừ 0 phẩy 9 cộng 8 phẩy 1, bằng 6 phẩy 2, khớp với cách tính ngược."
      - show: |
          <p><b>Đường khác 2 — cộng thật nhiều số hạng</b> của phần thưởng 1 mãi mãi, $\gamma = 0{,}9$:</p>
          <table class="t"><tr><th>số hạng đã cộng</th><th>10</th><th>50</th><th>100</th></tr>
          <tr><td>tổng</td><td>6,513</td><td>9,948</td><td>10,000</td></tr></table>
          <p class="note">Tổng tiến sát $\frac{1}{1 - 0{,}9} = 10$ — đúng công thức vừa suy ra.</p>
        focus: [1, 2, 3]
        say: "Kiểm tra thứ hai, ta cộng thật nhiều số hạng của phần thưởng 1 mãi mãi với gam-ma bằng 0 phẩy 9. Mười số hạng cho 6 phẩy 513, năm mươi số hạng cho 9 phẩy 948, một trăm số hạng cho gần đúng 10. Tổng tiến sát 10, nên khớp công thức 1 chia cho 1 trừ 0 phẩy 9."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "round(0.9 * 0 + 0.81 * 0 + 0.729 * 10, 10) == 7.29 != alg.rln_return([0, 0, 10], 0.9)"
      - "alg.rln_return([0, 10], 0.9) > alg.rln_return([0, 0, 0, 10], 0.9) and round(alg.rln_return([0, 0, 0, 10], 0.9), 2) == 7.29"
      - "round(alg.rln_return([2, 12], 0.9), 3) == 12.8 and round(alg.rln_return([2, 2, 2, 12], 0.9), 3) == 14.168"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đặt $\gamma = 1$ cho nhiệm vụ không bao giờ dừng <b class="red">(tổng vô hạn)</b>
          <br><span class="note">Được 1 mỗi bước hay 2 mỗi bước đều cho tổng vô hạn — không so được cách chơi nào tốt hơn. Phép thử: cộng 100, 1000 số hạng, tổng không dừng lại.</span></div>
        say: "Lỗi thứ nhất, đặt gam-ma bằng 1 cho nhiệm vụ không bao giờ dừng. Khi đó được 1 hay 2 mỗi bước đều cho tổng vô hạn, nên không so được cách chơi nào tốt hơn. Phép thử là cộng 100 rồi 1000 số hạng, và thấy tổng không dừng lại."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhân $\gamma$ ngay cho phần thưởng đầu tiên <b class="red">(lệch một bước)</b>
          <br><span class="note">Chuỗi 0, 0, 10: tính sai $0{,}729 \cdot 10 = 7{,}29$ thay vì $0{,}81 \cdot 10 = 8{,}1$. Phép thử: với chuỗi một phần tử 10, lợi nhuận phải đúng bằng 10.</span></div>
        say: "Lỗi thứ hai, nhân gam-ma ngay cho phần thưởng đầu tiên, tức lệch một bước. Với chuỗi 0, 0, 10, ta tính sai ra 7 phẩy 29 thay vì 8 phẩy 1. Phép thử là với chuỗi chỉ có một phần thưởng 10, lợi nhuận phải đúng bằng 10."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Coi $\gamma$ chỉ là “mức kiên nhẫn” chọn tuỳ thích <b class="red">(đổi cả hành vi)</b>
          <br><span class="note">Đổi $\gamma$ là đổi bài toán: tác tử ở phần mở đầu chờ lấy 10 khi $\gamma = 0{,}9$ nhưng lấy 6 ngay khi $\gamma = 0{,}7$. Phép thử: chạy lại với hai giá trị $\gamma$ và so hành vi, không chỉ so điểm.</span></div>
        say: "Lỗi thứ ba, coi gam-ma chỉ là mức kiên nhẫn chọn tuỳ thích. Đổi gam-ma là đổi bài toán, như tác tử ở phần mở đầu chờ lấy 10 khi gam-ma bằng 0 phẩy 9, nhưng lấy 6 ngay khi gam-ma bằng 0 phẩy 7. Phép thử là chạy lại với hai giá trị gam-ma và so hành vi, không chỉ so điểm."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Cộng thêm “thưởng sống sót” +2 vào mọi bước cho tác tử học nhanh <b class="red">(đổi quyết định)</b></div>
          <table class="t"><tr><th>$\gamma = 0{,}9$</th><th>đường ngắn: 0, 10</th><th>đường dài: 0, 0, 0, 10</th><th>chọn</th></tr>
          <tr><td>phần thưởng gốc</td><td>9</td><td>7,29</td><td>đường ngắn</td></tr>
          <tr><td>mỗi bước cộng 2</td><td>12,8</td><td>14,168</td><td class="red">đường dài</td></tr></table>
          <p class="note">Ở nhiệm vụ có lượt chơi kết thúc, đường dài nhận thêm nhiều lần cộng 2 hơn nên được lợi.</p>
        focus: [1, "2.2", "2.3", 3, 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, cộng thêm thưởng sống sót cộng 2 vào mọi bước để tác tử học nhanh hơn. Với phần thưởng gốc, đường ngắn được 9, đường dài được 7 phẩy 29, nên tác tử chọn đường ngắn. Khi mỗi bước cộng 2, đường ngắn được 12 phẩy 8, đường dài được 14 phẩy 168, và tác tử chuyển sang đi đường dài. Ở nhiệm vụ có lượt chơi kết thúc, đường càng dài càng nhận thêm nhiều lần cộng 2. Phép thử là tính lại lợi nhuận của vài cách chơi tiêu biểu mỗi khi sửa phần thưởng."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chọn γ để tác tử chịu chờ"
    checks:
      - "round(alg.rln_return([0, 0, 10], 0.9), 10) == 8.1 > 6 and round(alg.rln_return([0, 0, 10], 0.7), 10) == 4.9 < 6"
      - "round(math.sqrt(0.6), 3) == 0.775 and abs(alg.rln_return([0, 0, 10], math.sqrt(0.6)) - 6) < 1e-9"
    steps:
      - show: |
          <p>Trò chơi ở phần mở đầu: “lấy ngay” cho 6 điểm rồi hết lượt; “đi tiếp” cho phần thưởng 0, 0, 10.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính lợi nhuận của “đi tiếp” với $\gamma = 0{,}9$ và $\gamma = 0{,}7$. Mỗi trường hợp chọn gì?</td></tr>
          <tr><td>2</td><td>Bạn muốn tác tử chịu chờ để lấy 10. Phải chọn $\gamma$ lớn hơn bao nhiêu?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn, với trò chơi ở phần mở đầu, lấy ngay được 6 điểm, đi tiếp được 0, 0 rồi 10. Câu một, tính lợi nhuận của đi tiếp với gam-ma bằng 0 phẩy 9 và 0 phẩy 7, và mỗi trường hợp tác tử chọn gì? Câu hai, bạn muốn tác tử chịu chờ để lấy 10, vậy phải chọn gam-ma lớn hơn bao nhiêu? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>$\gamma$</th><th>“đi tiếp”</th><th>so với 6</th><th>chọn</th></tr>
          <tr><td>0,9</td><td>$0{,}81 \cdot 10 = 8{,}1$</td><td>lớn hơn</td><td>đi tiếp</td></tr>
          <tr><td>0,7</td><td>$0{,}49 \cdot 10 = 4{,}9$</td><td>nhỏ hơn</td><td>lấy ngay</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, phần thưởng 10 đến ở bước thứ ba nên được nhân gam-ma bình phương. Với gam-ma bằng 0 phẩy 9, ta được 0 phẩy 81 nhân 10, bằng 8 phẩy 1, lớn hơn 6, nên tác tử đi tiếp. Với gam-ma bằng 0 phẩy 7, ta được 0 phẩy 49 nhân 10, bằng 4 phẩy 9, nhỏ hơn 6, nên tác tử lấy ngay."
      - show: |
          <p><b>Câu 2.</b> Chờ có lợi khi $10 \cdot \gamma^2$ lớn hơn 6, tức $\gamma^2$ lớn hơn 0,6:</p>
          $$\gamma \gt \sqrt{0{,}6} \approx \hlg{0{,}775}$$
          <p class="note">Thử lại: $\gamma = 0{,}775$ cho khoảng 6,0 — đúng điểm hoà. Đánh đổi: $\gamma$ càng gần 1 thì tác tử nhìn càng xa, nhưng phải tính nhiều vòng hơn mới ra giá trị đúng.</p>
        focus: [1, 2, 3, 3]
        say: "Câu hai, chờ có lợi khi 10 nhân gam-ma bình phương lớn hơn 6, tức gam-ma bình phương lớn hơn 0 phẩy 6. Lấy căn hai vế, gam-ma phải lớn hơn căn của 0 phẩy 6, xấp xỉ 0 phẩy 775. Thử lại, gam-ma bằng 0 phẩy 775 cho khoảng 6, đúng điểm hoà. Gam-ma càng gần 1 thì nhìn càng xa, nhưng phải tính nhiều vòng hơn."

