  # ───────────────────────── 5. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra hai cách cập nhật từ trung bình cộng dồn"
    checks:
      - "[round(x, 10) for x in alg.rln_incr_means([4, 6, 8])] == [4, 5, 6] and round(5 + (8 - 5) / 3, 10) == 6"
      - "round(4 + 0.5 * (6 - 4), 10) == 5 and round(5 + 0.5 * (8 - 5), 10) == 6.5"
      - "round(6 + 0.5 * (1 + 0.9 * 10 - 6), 10) == 8"
    steps:
      - show: |
          <p><b>Bước 1.</b> Giá trị là <b>kỳ vọng</b> của lợi nhuận, nên ước lượng nó bằng trung bình các lợi nhuận $G$ quan sát được. Viết dạng cộng dồn như bài 3, lần thứ $n$:</p>
          $$V(s) \leftarrow V(s) + \frac{1}{n} \cdot \big(G - V(s)\big)$$
          <p class="note">Làm thử với 4, 6, 8: lần 3 có $5 + \frac{1}{3} \cdot (8 - 5) = 6$ = trung bình ✓.</p>
        focus: [1, 2, 3]
        say: "Bước một, giá trị là kỳ vọng của lợi nhuận, nên ta ước lượng nó bằng trung bình các lợi nhuận G quan sát được. Viết dạng cộng dồn như bài 3, ở lần thứ n, V của s thay bằng V của s cộng 1 phần n nhân hiệu G trừ V của s. Làm thử với 4, 6, 8, ở lần thứ ba ta có 5 cộng một phần ba nhân 3, bằng 6, đúng bằng trung bình."
      - show: |
          <p><b>Bước 2.</b> Thay $\frac{1}{n}$ bằng một số cố định $\alpha$, để lần gần đây được tính nặng hơn:</p>
          $$V(s) \leftarrow V(s) + \alpha \cdot \big(\hlb{G} - V(s)\big)$$
          <p class="note">Đây là cách <b>chờ hết lượt</b> (Monte Carlo). Làm thử $\alpha = 0{,}5$ với 4, 6, 8: 4 → 5 → 6,5.</p>
        focus: [1, 2, 3, 3]
        say: "Bước hai, ta thay 1 phần n bằng một số cố định an-pha, để những lần gần đây được tính nặng hơn. Khi đó V của s thay bằng V của s cộng an-pha nhân hiệu G trừ V của s. Đây là cách chờ hết lượt, vì phải hết lượt mới có G. Làm thử với an-pha bằng 0 phẩy 5 và dãy 4, 6, 8, giá trị đi từ 4 lên 5 rồi lên 6 phẩy 5."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Theo bài 0, $G_t = r_{t+1} + \gamma \cdot G_{t+1}$. Phần $G_{t+1}$ chưa biết, nhưng ta đã có ước lượng của nó là $V(s')$. Thay vào chỗ $G$:</p>
          $$V(s) \leftarrow V(s) + \alpha \cdot \big(\hlo{r + \gamma \cdot V(s')} - V(s)\big) = V(s) + \alpha \cdot \delta$$
        focus: [1, 1, 2]
        say: "Bước ba, theo công thức của bài 0, G t bằng r t cộng 1, cộng gam-ma nhân G t cộng 1. Phần G t cộng 1 chưa biết, nhưng ta đã có ước lượng của nó là V của s phẩy, nên thay vào chỗ G. Vậy V của s thay bằng V của s cộng an-pha nhân đen-ta, với đích mới là r cộng gam-ma nhân V của s phẩy."
      - show: |
          <p class="note">Đây là cách <b>sửa từng bước</b> (TD(0)): chỉ cần chờ <b>một</b> bước. Dùng ước lượng của chính mình làm đích gọi là <b>tự khởi động</b>.</p>
          <p class="note">Làm thử: $V(s) = 6$, $r = 1$, $V(s') = 10$, $\gamma = 0{,}9$, $\alpha = 0{,}5$: $6 + 0{,}5 \cdot (1 + 9 - 6) = 6 + 2 = \hlg{8}$.</p>
        focus: [1, 1, 2]
        say: "Đây là cách sửa từng bước, vì chỉ cần chờ một bước là có đích. Dùng ước lượng của chính mình làm đích như vậy gọi là tự khởi động. Làm thử với V của s bằng 6, r bằng 1, V của s phẩy bằng 10, gam-ma 0 phẩy 9 và an-pha 0 phẩy 5, ta được 6 cộng 0 phẩy 5 nhân 4, bằng 8."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tám lượt chơi của Sutton và Barto, từng phép tính"
    checks:
      - "sum([1] * 6 + [0, 0]) == 6 and round(6 / 8, 10) == 0.75 == alg.rln_batch_mc([[('A', 0), ('B', 0)]] + [[('B', 1)]] * 6 + [[('B', 0)]])['B']"
      - "alg.rln_batch_mc([[('A', 0), ('B', 0)]] + [[('B', 1)]] * 6 + [[('B', 0)]])['A'] == 0.0"
      - "round(0 + 1 * 0.75, 10) == 0.75 and abs(alg.rln_batch_td([[('A', 0), ('B', 0)]] + [[('B', 1)]] * 6 + [[('B', 0)]], alpha=0.05, sweeps=3000)['A'] - 0.75) < 1e-6"
    steps:
      - show: |
          <table class="t"><tr><th>lượt</th><th>đi qua và phần thưởng</th></tr>
          <tr><td>1</td><td>A, thưởng 0, sang B, thưởng 0, hết</td></tr>
          <tr><td>2 tới 7</td><td>B, thưởng 1, hết (6 lượt)</td></tr>
          <tr><td>8</td><td>B, thưởng 0, hết</td></tr></table>
          <p class="note">Không chiết khấu: $\gamma = 1$, vì mọi lượt đều kết thúc.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Đây là tám lượt chơi lấy từ sách giáo khoa chuẩn của ngành, bản 2 năm 2018. Lượt một đi từ A, thưởng 0, sang B, thưởng 0, rồi hết. Sáu lượt tiếp theo bắt đầu ở B, thưởng 1, rồi hết. Lượt cuối bắt đầu ở B, thưởng 0, rồi hết. Ta không chiết khấu, tức gam-ma bằng 1, vì mọi lượt đều kết thúc."
      - clear: true
        show: |
          <p><b>Bước 1 — giá trị của B.</b> B xuất hiện 8 lần, lợi nhuận sau B là 1 ở sáu lần, 0 ở hai lần:</p>
          $$V(B) = \frac{6 \cdot 1 + 2 \cdot 0}{8} = \hlb{0{,}75}$$
          <p class="note">Cả hai cách đều cho 0,75.</p>
        focus: [1, 2, 3]
        say: "Bước một là giá trị của B. B xuất hiện 8 lần, lợi nhuận sau B là 1 ở sáu lần và 0 ở hai lần, nên trung bình là 6 chia 8, bằng 0 phẩy 75. Cả hai cách đều cho con số này."
      - show: |
          <p><b>Bước 2 — chờ hết lượt.</b> A chỉ xuất hiện một lần, và lợi nhuận sau A lần đó là $0 + 0 = 0$:</p>
          $$V(A) = \hl{0}$$
        focus: [1, 2]
        say: "Bước hai, theo cách chờ hết lượt. A chỉ xuất hiện một lần, và lợi nhuận sau A lần đó là 0 cộng 0, nên giá trị của A bằng 0."
      - show: |
          <p><b>Bước 3 — sửa từng bước.</b> Đích của A là thưởng ngay cộng ước lượng của B, vì lần nào ở A cũng sang B:</p>
          $$V(A) = 0 + 1 \cdot V(B) = \hlg{0{,}75}$$
          <p class="note">Hai đáp số khác nhau từ <b>cùng một</b> dữ liệu.</p>
        focus: [1, 1, 2, 3]
        say: "Bước ba, theo cách sửa từng bước. Đích của A là thưởng ngay cộng ước lượng của B, vì lần nào ở A cũng sang B. Vậy giá trị của A bằng 0 cộng 1 nhân 0 phẩy 75, bằng 0 phẩy 75. Hai đáp số khác nhau đến từ cùng một dữ liệu."
      - clear: true
        show: |
          <table class="t"><tr><th>cách</th><th>V(A)</th><th>đúng theo nghĩa nào</th></tr>
          <tr><td>chờ hết lượt</td><td>0</td><td>sai số nhỏ nhất trên <b>chính 8 lượt</b> đã thấy (bằng 0)</td></tr>
          <tr><td>sửa từng bước</td><td>0,75</td><td>đúng hẳn với mô hình suy từ dữ liệu: A luôn sang B, B cho 1 với xác suất 0,75</td></tr></table>
          <p class="note">Nếu trò chơi đúng là chỉ phụ thuộc trạng thái hiện tại, cách thứ hai dự đoán <b>lượt chơi mới</b> tốt hơn.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước bốn, đặt hai đáp số cạnh nhau. Cách chờ hết lượt cho 0, có sai số nhỏ nhất trên chính 8 lượt đã thấy. Cách sửa từng bước cho 0 phẩy 75, đúng hẳn với mô hình suy từ dữ liệu, A luôn sang B, và B cho 1 với xác suất 0 phẩy 75. Nếu trò chơi đúng là chỉ phụ thuộc trạng thái hiện tại, cách thứ hai dự đoán lượt chơi mới tốt hơn."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: giải thẳng bước ngẫu nhiên năm ô"
    checks:
      - "(lambda V: [round(V[k], 4) for k in 'ABCDE'])(alg.rln_eval({'A': {'x': [(0.5, 0, None), (0.5, 0, 'B')]}, 'B': {'x': [(0.5, 0, 'A'), (0.5, 0, 'C')]}, 'C': {'x': [(0.5, 0, 'B'), (0.5, 0, 'D')]}, 'D': {'x': [(0.5, 0, 'C'), (0.5, 0, 'E')]}, 'E': {'x': [(0.5, 0, 'D'), (0.5, 1, None)]}}, {s: 'x' for s in 'ABCDE'}, 1.0, tol=1e-15)) == [round(k / 6, 4) for k in range(1, 6)]"
      - "[round(x, 3) for x in (sum(alg.rln_td_walk(0.1, n, seed=k) for k in range(100)) / 100 for n in (0, 10, 100))] == [0.236, 0.128, 0.055]"
    steps:
      - show: |
          <p>Ví dụ 6.2 của sách: năm ô A, B, C, D, E; bắt đầu ở C, mỗi bước sang trái hoặc phải với xác suất 0,5. Ra mép phải được 1, mép trái được 0.</p>
          <p><b>Đường khác:</b> không học, giải thẳng. Giá trị một ô = nửa ô trái + nửa ô phải, nên các giá trị cách đều nhau từ 0 tới 1:</p>
          $$V(A), \dots, V(E) = \frac{1}{6}, \frac{2}{6}, \frac{3}{6}, \frac{4}{6}, \frac{5}{6}$$
        introduces: [dots]
        focus: [1, 1, 2, 3]
        say: "Ta kiểm bằng ví dụ 6.2 của sách, gồm năm ô A, B, C, D, E, bắt đầu ở C, mỗi bước sang trái hoặc phải với xác suất 0 phẩy 5. Ra mép phải được 1, ra mép trái được 0. Đường khác là không học mà giải thẳng, vì giá trị một ô bằng nửa ô trái cộng nửa ô phải, nên các giá trị cách đều nhau từ 0 tới 1. Vậy năm ô có giá trị một phần sáu, hai phần sáu, và cứ thế tới năm phần sáu."
      - clear: true
        show: |
          <p>Chạy cách sửa từng bước với $\alpha = 0{,}1$, bắt đầu mọi ô bằng 0,5, đo độ lệch so với đáp số giải thẳng (trung bình 100 lần chạy):</p>
          <table class="t"><tr><th>số lượt đã chơi</th><th>0</th><th>10</th><th>100</th></tr>
          <tr><td>độ lệch trung bình</td><td>0,236</td><td>0,128</td><td>0,055</td></tr></table>
          <p class="note">Độ lệch giảm dần: học từ kinh nghiệm tiến về đúng đáp số mà phương trình cho.</p>
        focus: [1, 2, 3]
        say: "Bây giờ chạy cách sửa từng bước với an-pha bằng 0 phẩy 1, bắt đầu mọi ô bằng 0 phẩy 5, rồi đo độ lệch so với đáp số giải thẳng, lấy trung bình 100 lần chạy. Độ lệch là 0 phẩy 236 lúc đầu, 0 phẩy 128 sau 10 lượt, và 0 phẩy 055 sau 100 lượt. Độ lệch giảm dần, nên học từ kinh nghiệm tiến về đúng đáp số mà phương trình cho."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "round(1 + 0.9 * 0, 10) == 1 and round(1 + 0.9 * 10, 10) == 10"
      - "round(6 + 1 * (8 - 6), 10) == 8"
      - "[round(x, 3) for x in (sum(alg.rln_td_walk(a, 1000, seed=k) for k in range(100)) / 100 for a in (0.1, 0.02))] == [0.055, 0.024]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin cách sửa từng bước ngay từ đầu <b class="red">(thiên lệch)</b>
          <br><span class="note">Đích dùng ước lượng của chính mình. Nếu $V(s')$ ban đầu là 0 trong khi giá trị thật là 10, đích là $1 + 0{,}9 \cdot 0 = 1$ thay vì 10. Phép thử: đổi giá trị ban đầu, xem kết quả sau ít lượt có đổi theo không.</span></div>
        say: "Lỗi thứ nhất, tin cách sửa từng bước ngay từ đầu, trong khi nó có thiên lệch. Đích dùng ước lượng của chính mình, nên nếu V của s phẩy ban đầu là 0 trong khi giá trị thật là 10, đích chỉ là 1 thay vì 10. Phép thử là đổi giá trị ban đầu, rồi xem kết quả sau ít lượt có đổi theo không."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn $\alpha = 1$ cho “học nhanh” <b class="red">(chỉ nhớ lần cuối)</b>
          <br><span class="note">Với 4, 6, 8 và $\alpha = 1$: giá trị là 8, quên hẳn 4 và 6. Phép thử: so với trung bình 6 của cả ba lần.</span></div>
        say: "Lỗi thứ hai, chọn an-pha bằng 1 cho học nhanh, kết quả là chỉ nhớ lần cuối. Với 4, 6, 8 và an-pha bằng 1, giá trị là 8, quên hẳn 4 và 6. Phép thử là so với trung bình 6 của cả ba lần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng cách chờ hết lượt cho nhiệm vụ không bao giờ dừng <b class="red">(không bao giờ cập nhật)</b>
          <br><span class="note">Không có cuối lượt thì không có $G$. Phép thử: hỏi “lần cập nhật đầu tiên xảy ra lúc nào?”.</span></div>
        say: "Lỗi thứ ba, dùng cách chờ hết lượt cho nhiệm vụ không bao giờ dừng, nên không bao giờ cập nhật. Không có cuối lượt thì không có lợi nhuận G. Phép thử là hỏi lần cập nhật đầu tiên xảy ra lúc nào."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Giữ $\alpha$ cố định rồi chờ sai số tự về 0 <b class="red">(dao động mãi)</b></div>
          <table class="t"><tr><th>độ lệch, trung bình 100 lần chạy</th><th>sau 100 lượt</th><th>sau 1000 lượt</th></tr>
          <tr><td>$\alpha = 0{,}1$</td><td>0,055</td><td>0,055</td></tr>
          <tr><td>$\alpha = 0{,}02$</td><td>chậm hơn</td><td>$\hlg{0{,}024}$</td></tr></table>
          <p class="note">Sách ghi: với $\alpha$ cố định, giá trị “dao động mãi” theo các lượt gần nhất. Giảm dần $\alpha$, hoặc chấp nhận một mức nhiễu đã đo.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, giữ an-pha cố định rồi chờ sai số tự về 0. Với an-pha bằng 0 phẩy 1, độ lệch dừng ở 0 phẩy 055, từ lượt 100 tới lượt 1000 không giảm nữa. Với an-pha bằng 0 phẩy 02, lúc đầu học chậm hơn, nhưng sau 1000 lượt độ lệch chỉ còn 0 phẩy 024. Sách ghi rõ, với an-pha cố định, giá trị dao động mãi theo các lượt gần nhất, nên hãy giảm dần an-pha, hoặc chấp nhận một mức nhiễu đã đo."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: một bước của mỗi cách, và một quyết định"
    checks:
      - "round(2 + 0.9 * 4 - 5, 10) == 0.6 and round(5 + 0.1 * 0.6, 10) == 5.06"
      - "round(5 + 0.1 * (7 - 5), 10) == 5.2"
    steps:
      - show: |
          <p>$V(s) = 5$, $\alpha = 0{,}1$, $\gamma = 0{,}9$. Tác tử nhận $r = 2$ rồi sang $s'$ có $V(s') = 4$; cuối lượt, lợi nhuận thật từ $s$ là $G = 7$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính đen-ta và giá trị mới theo cách sửa từng bước.</td></tr>
          <tr><td>2</td><td>Tính giá trị mới theo cách chờ hết lượt.</td></tr>
          <tr><td>3</td><td>Bạn dự đoán khách hàng có quay lại không; kết quả chỉ biết sau 30 ngày. Chọn cách nào?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với V của s bằng 5, an-pha bằng 0 phẩy 1, gam-ma bằng 0 phẩy 9. Tác tử nhận r bằng 2 rồi sang s phẩy có giá trị 4, và cuối lượt lợi nhuận thật từ s là 7. Câu một, tính đen-ta và giá trị mới theo cách sửa từng bước. Câu hai, tính giá trị mới theo cách chờ hết lượt. Câu ba, bạn dự đoán khách hàng có quay lại không, mà kết quả chỉ biết sau 30 ngày, vậy chọn cách nào? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1</td><td>$\delta = 2 + 0{,}9 \cdot 4 - 5 = 0{,}6$; $\;5 + 0{,}1 \cdot 0{,}6$</td><td>$\hlg{5{,}06}$</td></tr>
          <tr><td>2</td><td>$5 + 0{,}1 \cdot (7 - 5)$</td><td>$\hlg{5{,}2}$</td></tr></table>
        focus: ["1.2", "1.2", "1.3"]
        say: "Đáp án câu một, đen-ta bằng 2 cộng 0 phẩy 9 nhân 4 trừ 5, bằng 0 phẩy 6. Vì vậy giá trị mới là 5 cộng 0 phẩy 1 nhân 0 phẩy 6, bằng 5 phẩy 06. Câu hai, giá trị mới là 5 cộng 0 phẩy 1 nhân hiệu 7 trừ 5, bằng 5 phẩy 2."
      - show: |
          <p><b>Câu 3.</b> Sửa từng bước: mỗi ngày đã có tín hiệu (mở ứng dụng, thêm vào giỏ) để cập nhật, không chờ 30 ngày.</p>
          <p class="note">Đánh đổi: học sớm nhưng thiên lệch theo ước lượng hiện tại. Đổi sang chờ hết lượt khi lượt ngắn, hoặc khi ước lượng trung gian chưa đáng tin.</p>
        focus: [1, 2, 2]
        say: "Câu ba, nên sửa từng bước, vì mỗi ngày đã có tín hiệu như mở ứng dụng hay thêm vào giỏ để cập nhật, không cần chờ 30 ngày. Cái giá là học sớm nhưng thiên lệch theo ước lượng hiện tại. Hãy đổi sang chờ hết lượt khi lượt ngắn, hoặc khi các ước lượng trung gian chưa đáng tin."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">giá trị = lợi nhuận kỳ vọng</span><span class="a">→</span>
          <span class="n">không biết luật: lấy trung bình lợi nhuận thật (chờ hết lượt)</span><span class="a">→</span>
          <span class="n">thay lợi nhuận bằng r + γ nhân V(s phẩy): sửa từng bước</span><span class="a">→</span>
          <span class="n">nhanh hơn, nhưng thiên lệch theo ước lượng của chính mình</span></div>
        say: "Tổng kết lại, giá trị là lợi nhuận kỳ vọng. Khi không biết luật chơi, ta lấy trung bình các lợi nhuận thật, tức cách chờ hết lượt. Thay lợi nhuận bằng thưởng ngay cộng gam-ma nhân ước lượng của trạng thái sau, ta được cách sửa từng bước, nhanh hơn nhưng thiên lệch theo ước lượng của chính mình."
