id: L04
course: RLN
series: "RLN · Học tăng cường"
title: "Bài 4 — Học từ kinh nghiệm: Monte Carlo và sai phân thời gian TD(0)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rln.yaml L04; audit/rln/verify_rln.py L04; audit/rln/sources_L04.md; R. S. Sutton, A. G. Barto, Reinforcement Learning: An Introduction, bản 2 (2018), mục 6.1 (công thức 6.1 và 6.2, sai số TD 6.5), 6.2 (Ví dụ 6.2 bước ngẫu nhiên), 6.3 (Ví dụ 6.4 người dự đoán), PDF chính thức incompleteideas.net/book/RLbook2020.pdf; RLN bài 0 (G_t = r_{t+1} + γ·G_{t+1}), bài 1 (giá trị theo chính sách), bài 3 (trung bình cộng dồn)"
assumes: [arith, power, approx, frac, cdot, sub, disc, dots, policy, prob, given, sum]
# Quy ước: V(s) là ƯỚC LƯỢNG giá trị của s theo chính sách đang chạy; s' (đọc “s phẩy”) là trạng thái kế tiếp; an-pha = tốc độ học;
#   đen-ta = sai số TD = r + γ·V(s') − V(s); mũi tên ← nghĩa là “thay bằng”. Tên “Monte Carlo” và “TD(0)” chỉ trên màn hình (lexicon RLN:
#   chưa đạt probe); lời đọc nói “ước lượng bằng trung bình lượt chơi” và “sai phân thời gian”.
# Ví dụ 6.4 và 6.2 lấy nguyên số của Sutton & Barto (sources_L04.md); 4, 6, 8 và V = 6, V(s') = 10 là SỐ MINH HOẠ của giáo án.
#   Mô phỏng bước ngẫu nhiên: alg.rln_td_walk (hạt giống 0..99, trung bình 100 lần chạy, V ban đầu 0,5 như sách).
objectives:
  - "Ước lượng giá trị bằng trung bình lợi nhuận quan sát được (Monte Carlo)"
  - "Viết và chạy một bước cập nhật TD(0) mà không chờ hết lượt chơi"
  - "Giải thích vì sao hai cách cho hai đáp số khác nhau trên cùng dữ liệu (Ví dụ 6.4)"
  - "Chọn tốc độ học và phương pháp cho một nhiệm vụ mà kết quả đến muộn"
asr_reviewed:
  - {sentence: "Đen-ta bằng r cộng gam-ma nhân V của s phẩy, trừ V của s.", reason: "ASR chép “Đen ta bằng add cộng gamma nhân v của x phải trừ v của x.” (0.774): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; gam-ma (γ) ASR viết “gamma”; “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ta kiểm bằng ví dụ 6.2 của sách, gồm năm ô A, B, C, D, E, bắt đầu ở C, mỗi bước sang trái hoặc phải với xác suất 0 phẩy 5.", reason: "ASR chép “Ta kiểm bằng ví dụ 6.2 của sách gồm 5 OA, B, C, G, E bắt đầu ở C mỗi bước sang trái hoặc phải với xác suốt 0,5.” (0.892): “ô” (ô lưới) ASR viết chữ “O”; chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: suất/suốt — NOT_VERIFIED bằng tai người"}
  - {sentence: "Phần G t cộng 1 chưa biết, nhưng ta đã có ước lượng của nó là V của s phẩy, nên thay vào chỗ G.", reason: "ASR chép “Phần GT Cộng 1 chưa biết, nhưng ta đã có ước lượng của nó là V của F phải nên thay vào chỗ G.” (0.92): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đích dùng ước lượng của chính mình, nên nếu V của s phẩy ban đầu là 0 trong khi giá trị thật là 10, đích chỉ là 1 thay vì 10.", reason: "ASR chép “Đích dùng ước lượng của chính mình nên nếu V của F phải ban đầu là không trong khi giá trị thật là 10, đích chỉ là 1 thay vì 10.” (0.935): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải” — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tám lượt chơi, hai đáp số"
    checks:
      - "alg.rln_batch_mc([[('A', 0), ('B', 0)]] + [[('B', 1)]] * 6 + [[('B', 0)]]) == {'B': 0.75, 'A': 0.0}"
      - "abs(alg.rln_batch_td([[('A', 0), ('B', 0)]] + [[('B', 1)]] * 6 + [[('B', 0)]], alpha=0.05, sweeps=3000)['A'] - 0.75) < 1e-6"
    steps:
      - show: |
          <p>Bạn chỉ có nhật ký <b>8 lượt chơi</b>, không biết luật. Một lượt đi từ A sang B; bảy lượt khác bắt đầu ở B rồi kết thúc ngay.</p>
          <p>Hai phương pháp học từ cùng 8 lượt đó cho hai câu trả lời: giá trị của A là <b>0</b>, hoặc là <b>0,75</b>.</p>
          <div class="box key">Hôm nay: học giá trị chỉ từ kinh nghiệm, không cần luật chơi — cách chờ hết lượt và cách cập nhật từng bước. Mỗi cách đúng theo nghĩa nào, và khi nào nên chọn cách nào?</div>
        focus: [1, 1, 2, 3, 3]
        say: "Chào bạn, giả sử bạn chỉ có nhật ký 8 lượt chơi và không biết luật. Một lượt đi từ A sang B, bảy lượt khác bắt đầu ở B rồi kết thúc ngay. Hai phương pháp học từ cùng 8 lượt đó lại cho hai câu trả lời, giá trị của A là 0, hoặc là 0 phẩy 75. Hôm nay ta học giá trị chỉ từ kinh nghiệm, bằng cách chờ hết lượt và bằng cách cập nhật từng bước. Mỗi cách đúng theo nghĩa nào, và khi nào nên chọn cách nào?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ các bài trước"
    checks:
      - "[round(x, 10) for x in alg.rln_incr_means([4, 6, 8])] == [4, 5, 6]"
      - "round(alg.rln_returns_backward([-1, -1, 10], 0.9)[0], 10) == round(-1 + 0.9 * 8, 10) == 6.2"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 0</td><td>lợi nhuận tính ngược: $G_t = r_{t+1} + \gamma \cdot G_{t+1}$</td><td>chuỗi −1, −1, 10: $G_1 = 8$, $G_0 = -1 + 0{,}9 \cdot 8 = 6{,}2$</td></tr>
          <tr><td>bài 1</td><td>giá trị $V(s)$: lợi nhuận <b>kỳ vọng</b> nếu từ $s$ cứ chơi theo chính sách $\pi$</td><td>A sang B thưởng 1, B về A thưởng 0: giá trị của A ≈ 5,263</td></tr>
          <tr><td>bài 3</td><td>trung bình cộng dồn: mới = cũ + (số mới − cũ) / $n$</td><td>4, 6, 8 → 4; 5; 6</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng nhắc lại ba điều từ các bài trước. Ở bài 0, lợi nhuận tính ngược theo công thức G t bằng r t cộng 1, cộng gam-ma nhân G t cộng 1, như chuỗi âm 1, âm 1, 10 cho 6 phẩy 2. Ở bài 1, giá trị V của s là lợi nhuận kỳ vọng nếu từ s cứ chơi theo chính sách pi, như giá trị của A khoảng 5 phẩy 263. Ở bài 3, trung bình cộng dồn lấy giá trị cũ cộng phần chênh chia n, nên dãy 4, 6, 8 cho 4, rồi 5, rồi 6."
      - show: |
          <p>Điều mới hôm nay: <b>không biết</b> xác suất chuyển trạng thái và phần thưởng của trò chơi. Chỉ có các lượt chơi đã ghi lại — nên phải <b>ước lượng</b> kỳ vọng bằng trung bình của những gì quan sát được.</p>
          <p class="note">Ở khoá Toán cho khoa học máy tính: trung bình của nhiều lần thử tiến về kỳ vọng khi số lần thử tăng.</p>
        focus: [1, 1, 2]
        say: "Điều mới hôm nay là ta không biết xác suất chuyển trạng thái và phần thưởng của trò chơi. Ta chỉ có các lượt chơi đã ghi lại, nên phải ước lượng kỳ vọng bằng trung bình của những gì quan sát được. Ở khoá Toán cho khoa học máy tính, ta đã biết trung bình của nhiều lần thử tiến về kỳ vọng khi số lần thử tăng."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: an-pha, mũi tên gán, s phẩy và đen-ta"
    checks:
      - "round(6 + 0.5 * (10 - 6), 10) == 8 and round(1 + 0.9 * 10 - 6, 10) == 4"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc</th><th>nghĩa</th></tr>
          <tr><td>$\alpha$</td><td>an-pha</td><td>tốc độ học, từ 0 tới 1: dịch giá trị cũ một phần $\alpha$ về phía đích</td></tr>
          <tr><td>$V(s) \leftarrow 6 + 0{,}5 \cdot (10 - 6)$</td><td>V của s thay bằng …</td><td>mũi tên: bỏ giá trị cũ, ghi giá trị mới = 8</td></tr>
          <tr><td>$s'$</td><td>s phẩy</td><td>trạng thái ngay sau $s$</td></tr></table>
        introduces: [lr, assign, prime]
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Bài dùng thêm ba ký hiệu. Chữ Hy Lạp an-pha là tốc độ học, một số từ 0 tới 1, cho biết dịch giá trị cũ bao nhiêu phần về phía đích. Mũi tên quay trái đọc là thay bằng, nghĩa là bỏ giá trị cũ và ghi giá trị mới. Ví dụ 6 cộng 0 phẩy 5 nhân 10 trừ 6 cho giá trị mới là 8. Còn s phẩy là trạng thái ngay sau s."
      - show: |
          <p>Chữ Hy Lạp $\delta$, đọc <b>đen-ta</b>: <b>sai số sai phân thời gian</b> — đích một bước trừ giá trị cũ.</p>
          $$\delta = r + \gamma \cdot V(s') - V(s)$$
          <p class="note">Làm thử: $r = 1$, $V(s') = 10$, $\gamma = 0{,}9$, $V(s) = 6$: $\delta = 1 + 9 - 6 = 4$. Dương nghĩa là “tốt hơn mình tưởng”.</p>
        introduces: [tderr]
        focus: [1, 2, 3, 3]
        say: "Chữ Hy Lạp nhỏ này đọc là đen-ta, là sai số sai phân thời gian, bằng đích một bước trừ giá trị cũ. Đen-ta bằng r cộng gam-ma nhân V của s phẩy, trừ V của s. Làm thử với r bằng 1, V của s phẩy bằng 10, gam-ma bằng 0 phẩy 9 và V của s bằng 6, ta được 1 cộng 9 trừ 6, bằng 4. Đen-ta dương nghĩa là tình hình tốt hơn mình tưởng."

