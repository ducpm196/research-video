# Quy ước: chính sách hai hành động π(a₁) = σ(θ), π(a₂) = 1 − σ(θ) với σ(x) = 1 / (1 + e mũ âm x) (sigm của sổ RLN; lời đọc nói “hàm
#   chữ S biến số thành xác suất”, không đọc “sigmoid”); θ là MỘT số nên gradient ∇ ở đây chính là đạo hàm theo θ (nói rõ trên màn hình).
#   ln = lôgarit tự nhiên; b = đường cơ sở. Lợi nhuận 10 và 12, đường cơ sở 11, α = 0,1, lợi nhuận cộng 100 là SỐ MINH HOẠ (giáo án).
#   Tên “REINFORCE” chỉ trên màn hình; lời đọc nói “gradient chính sách cơ bản”.
objectives:
  - "Viết ước lượng gradient G · ∇ ln π và tính nó cho từng hành động"
  - "Chứng minh trừ đường cơ sở không đổi kỳ vọng, và tính phương sai trước và sau khi trừ"
  - "Nhận ra đường cơ sở phụ thuộc hành động làm lệch gradient"
