      - "alg.rln_pg2(4, 8)[3] == 9.0 and alg.rln_pg2(4, 8, b1=6, b2=6)[1] == [-1.0, -1.0] and alg.rln_pg2(4, 8, b1=6, b2=6)[3] == 0"
    steps:
      - show: |
          <p>Vẫn hai hành động, $\theta = 0$ (mỗi bên 0,5). Bây giờ hành động 1 cho lợi nhuận 4, hành động 2 cho 8.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tính hai mẫu $G \cdot \nabla \ln \pi$, kỳ vọng và phương sai. Kỳ vọng có bằng đạo hàm thẳng không?</td></tr>
          <tr><td>2</td><td>Bạn được chọn một đường cơ sở. Chọn số nào để phương sai bằng 0, và vì sao nó không làm lệch?</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn, vẫn hai hành động, theta bằng 0 nên mỗi bên 0 phẩy 5, nhưng hành động một cho lợi nhuận 4, hành động hai cho 8. Câu một, tính hai mẫu, kỳ vọng và phương sai. Kỳ vọng có bằng đạo hàm thẳng không? Câu hai, bạn được chọn một đường cơ sở, chọn số nào để phương sai bằng 0, và vì sao nó không làm lệch? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>đại lượng</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>hai mẫu</td><td>$4 \cdot 0{,}5$ và $8 \cdot (-0{,}5)$</td><td>2 và −4</td></tr>
          <tr><td>kỳ vọng</td><td>$0{,}5 \cdot 2 + 0{,}5 \cdot (-4)$</td><td>$\hlg{-1}$</td></tr>
          <tr><td>đạo hàm thẳng</td><td>$0{,}25 \cdot (4 - 8)$</td><td>−1 ✓</td></tr>
          <tr><td>phương sai</td><td>$\frac{4 + 16}{2} - 1$</td><td>9</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, cộng từng dòng. Hai mẫu là 4 nhân 0 phẩy 5 bằng 2, và 8 nhân âm 0 phẩy 5 bằng âm 4. Kỳ vọng là 0 phẩy 5 nhân 2 cộng 0 phẩy 5 nhân âm 4, bằng âm 1. Đạo hàm thẳng là 0 phẩy 25 nhân 4 trừ 8, cũng bằng âm 1. Phương sai là 4 cộng 16 chia 2, trừ 1, bằng 9."
      - show: |
