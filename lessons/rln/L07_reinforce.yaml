          <p class="note">Ngoài đời không biết đúng số 6, nên ta <b>học</b> nó: một bộ ước lượng giá trị của trạng thái làm đường cơ sở. Cái giá: bộ ước lượng đoán sai thì đường cơ sở kém đi.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Câu hai, chọn b bằng 6, lợi nhuận trung bình của trạng thái. Hai mẫu là 4 trừ 6 nhân 0 phẩy 5 bằng âm 1, và 8 trừ 6 nhân âm 0 phẩy 5 cũng bằng âm 1, nên phương sai bằng 0. Nó không lệch vì b không phụ thuộc hành động. Ngoài đời ta không biết đúng số 6, nên phải học nó bằng một bộ ước lượng giá trị của trạng thái. Cái giá là phải học thêm một bộ ước lượng, và nó đoán sai thì đường cơ sở kém đi."

