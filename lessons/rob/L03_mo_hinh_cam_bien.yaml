        say: "Hình vẽ hai mô hình trên cả dải đo từ 0 tới 10 mét, với trục đứng phóng to tới 0 phẩy 05 để thấy phần đáy. Quanh 2 mét, cả hai vọt lên vượt khỏi hình, đỉnh của mô hình chuẩn cao khoảng 3 phẩy 99, còn đỉnh của hỗn hợp chỉ khoảng 3 phẩy 60 vì phần chuẩn bị nhân 0 phẩy 9. Xa khỏi 2 mét, đường xanh đứt nét của mô hình chỉ chuẩn rơi sát về 0, còn đường cam của hỗn hợp luôn giữ ít nhất 0 phẩy 01. Ở phép đo 9 phẩy 5 mét, chấm xanh nằm ở 0, chấm cam nằm ở 0 phẩy 01, đó là chỗ chừa cho phép đo hỏng."

  - id: example
    kind: example
    title: "Ba phép đo, hai mô hình"
    checks:
      - "[round(alg.gauss_pdf(z, 2, 0.1), 4) for z in (2.1, 2.3)] == [2.4197, 0.0443] and round(alg.gauss_pdf(2.1, 2, 0.1) / alg.gauss_pdf(2.3, 2, 0.1), 1) == 54.6"
      - "[round(alg.beam_likelihood(z, 2, 0.1), 3) for z in (2.1, 9.5)] == [2.188, 0.01] and round(alg.beam_likelihood(2.3, 2, 0.1), 2) == 0.05"
      - "round(3.989 * 0.607, 2) == 2.42 and round(3.989 * 0.0111, 4) == 0.0443 and round(0.9 * 2.42 + 0.01, 3) == 2.188 and round(0.9 * 0.0443 + 0.01, 2) == 0.05 and round((9.5 - 2) / 0.1) == 75"
    steps:
      - show: |
          <p><b>Bước 1 — phép đo 2,1 m</b> (thật 2 m, σ = 0,1 m): lệch 0,1 m = 1σ.</p>
          $$3{,}989 \cdot e^{-1/2} \approx 3{,}989 \cdot 0{,}607 \approx \hl{2{,}42}$$
        focus: [1, 2]
        say: "Bước một, chấm phép đo 2 phẩy 1 mét khi khoảng cách thật là 2 mét, lệch 0 phẩy 1 mét, đúng 1 xích-ma. Lấy đỉnh 3 phẩy 989 nhân 0 phẩy 607, được mật độ khoảng 2 phẩy 42 theo mô hình chuẩn."
      - show: |
          <p><b>Bước 2 — phép đo 2,3 m</b>: lệch 0,3 m = 3σ.</p>
          $$3{,}989 \cdot e^{-9/2} \approx \hl{0{,}0443}, \qquad \frac{2{,}42}{0{,}0443} \approx 54{,}6 \text{ lần}$$
        focus: [1, 2, 2]
        say: "Bước hai, phép đo 2 phẩy 3 mét lệch 0 phẩy 3 mét, tức 3 xích-ma. Mật độ chỉ còn khoảng 0 phẩy 0443. Phép đo này kém phép đo 2 phẩy 1 mét tới 54 phẩy 6 lần."
      - show: |
          <p><b>Bước 3 — thêm phần đo hỏng</b>: hỗn hợp $= 0{,}9 \cdot$ chuẩn $+ \; 0{,}1 \cdot \frac{1}{10}$</p>
          $$0{,}9 \cdot 2{,}42 + 0{,}01 \approx \hl{2{,}188}, \qquad 0{,}9 \cdot 0{,}0443 + 0{,}01 \approx 0{,}05$$
        focus: [1, 2, 2]
        say: "Bước ba, thêm phần đo hỏng, hỗn hợp bằng 0 phẩy 9 nhân phần chuẩn cộng 0 phẩy 1 nhân 1 phần 10, tức cộng thêm 0 phẩy 01. Phép đo 2 phẩy 1 mét được 0 phẩy 9 nhân 2 phẩy 42 cộng 0 phẩy 01, khoảng 2 phẩy 188. Phép đo 2 phẩy 3 mét được khoảng 0 phẩy 05."
      - clear: true
        show: |
          <p><b>Bước 4 — phép đo 9,5 m</b> (phản xạ sai): lệch 7,5 m = 75σ.</p>
          $$\text{chuẩn: } 3{,}989 \cdot e^{-75^2/2} \approx 0, \qquad \text{hỗn hợp: } 0{,}9 \cdot 0 + 0{,}01 = \hl{0{,}01}$$
        focus: [1, 2, 2]
        say: "Bước bốn, phép đo 9 phẩy 5 mét do phản xạ sai lệch tới 7 phẩy 5 mét, tức 75 xích-ma. Theo mô hình chuẩn, mật độ nhỏ đến mức coi như bằng 0. Theo hỗn hợp, phần chuẩn bằng 0 nhưng phần đo hỏng vẫn góp 0 phẩy 01."
      - show: |
          <table class="t"><tr><th>Bước 5 — phép đo $z$ (thật $d = 2$ m, $\sigma = 0{,}1$ m)</th><th>chỉ chuẩn</th><th>hỗn hợp 0,9 / 0,1</th></tr>
          <tr><td>2,1 m</td><td>2,42</td><td>2,188</td></tr>
          <tr><td>2,3 m</td><td>0,0443 — kém 54,6 lần</td><td>≈ 0,05</td></tr>
          <tr><td>9,5 m (phản xạ sai)</td><td class="red">≈ 0 (nhỏ hơn $10^{-300}$)</td><td class="green">$\hl{0{,}01}$</td></tr></table>
          <p>Với mô hình chỉ chuẩn, một phép đo hỏng xoá mọi giả thuyết đúng. Mô hình hỗn hợp nói: “phép đo này lạ, nhưng không phải bằng chứng tuyệt đối”.</p>
        focus: [1, 1, "1.2", "1.3", "1.4", 2, 2]
        say: "Bước năm, gom cả ba phép đo vào một bảng để so hai mô hình. Bảng chấm ba phép đo khi khoảng cách thật là 2 mét và xích-ma bằng 0 phẩy 1 mét. Phép đo 2 phẩy 1 mét có mật độ 2 phẩy 42 theo mô hình chuẩn, 2 phẩy 188 theo hỗn hợp. Phép đo 2 phẩy 3 mét chỉ có 0 phẩy 0443, kém 54 phẩy 6 lần. Phép đo 9 phẩy 5 mét do phản xạ sai có mật độ gần như bằng 0 theo mô hình chuẩn, nhưng 0 phẩy 01 theo hỗn hợp. Với mô hình chỉ có phần chuẩn, một phép đo hỏng xoá mọi giả thuyết đúng. Mô hình hỗn hợp nói phép đo này lạ, nhưng không phải bằng chứng tuyệt đối."

  - id: check
    kind: check
    title: "Tự kiểm: cộng diện tích từng dải hẹp"
    checks:
      - "round(sum(alg.gauss_pdf(1.9 + (i + 0.5) * 1e-4, 2, 0.1) * 1e-4 for i in range(2000)), 3) == 0.683"
      - "round(sum(alg.beam_likelihood((i + 0.5) * 1e-3, 2, 0.1) * 1e-3 for i in range(10000)), 3) == 1.0"
      - "round(0.9 * 1 + 0.1 * 1, 6) == 1.0"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác: cộng diện tích các dải rộng 1 mm</th><th>kết quả</th><th>ý nghĩa</th></tr>
          <tr><td>phần chuẩn, trên khoảng [1,9; 2,1 m]</td><td>≈ 0,683</td><td>mật độ 2,42 &gt; 1 vẫn cho xác suất &lt; 1 ✓</td></tr>
          <tr><td>hỗn hợp, trên cả [0, 10 m]</td><td>≈ 1,000</td><td>$0{,}9 \cdot 1 + 0{,}1 \cdot 1 = 1$ ✓</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, ta không đọc công thức mà để máy cộng diện tích của các dải hẹp rộng 1 mi li mét. Trên khoảng từ 1 phẩy 9 tới 2 phẩy 1 mét, phần chuẩn có diện tích khoảng 0 phẩy 683. Vậy mật độ lên tới 2 phẩy 42 mà xác suất vẫn nhỏ hơn 1, đúng như mật độ khác xác suất. Cộng trên cả dải 0 tới 10 mét, hỗn hợp có diện tích khoảng 1. Điều đó khớp với 0 phẩy 9 nhân 1 cộng 0 phẩy 1 nhân 1, nên trộn hai phần vẫn ra một mật độ hợp lệ."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "2 ** 10 == 1024 and math.prod([2] * 10) == 1024"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đặt $\sigma$ quá nhỏ để “chính xác hơn” <b class="red">(quá tự tin)</b>
          <br><span class="note">$\sigma$ nhỏ hơn nhiễu thật làm mỗi lệch nhỏ thành bằng chứng mạnh; <b>bộ lọc</b> (chương trình gộp các phép đo để ước lượng vị trí robot) nhảy lung tung. Ước lượng $\sigma$ từ dữ liệu đo trên mốc đã biết khoảng cách.</span></div>
        say: "Lỗi thứ nhất, đặt xích-ma quá nhỏ để trông chính xác hơn, nên mô hình quá tự tin. Xích-ma nhỏ hơn nhiễu thật làm mỗi lệch nhỏ thành bằng chứng mạnh. Khi đó bộ lọc, tức chương trình gộp các phép đo để ước lượng vị trí robot, sẽ nhảy lung tung. Hãy ước lượng xích-ma từ dữ liệu đo trên mốc đã biết khoảng cách."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Coi các tia đo độc lập hoàn toàn <b class="red">(nhân bằng chứng quá đà)</b>
          <br><span class="note">Coi các tia độc lập nghĩa là khả năng của cả lần quét bằng <b>tích</b> khả năng của từng tia. Hàng trăm tia cạnh nhau cùng trúng một vật không có trong bản đồ (người đi qua) sai <b>cùng lúc</b>: nếu mỗi tia nghiêng về giả thuyết sai gấp 2 lần, chỉ 10 tia nhân lại đã thành 1024 lần. Thường chỉ dùng một phần các tia, hoặc làm mềm mô hình (giảm sức nặng của mỗi tia).</span></div>
        say: "Lỗi thứ hai, coi các tia đo độc lập hoàn toàn, nên nhân bằng chứng quá đà. Coi độc lập nghĩa là khả năng của cả lần quét bằng tích khả năng của từng tia. Hàng trăm tia cạnh nhau cùng trúng một vật không có trong bản đồ, như một người đi qua, sẽ sai cùng lúc. Nếu mỗi tia nghiêng về giả thuyết sai gấp 2 lần, chỉ 10 tia nhân lại đã thành 1024 lần, làm kết luận quá chắc chắn. Vì vậy thường chỉ dùng một phần các tia, hoặc làm mềm mô hình bằng cách giảm sức nặng của mỗi tia."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đọc mật độ như xác suất <b class="red">(“2,42 &gt; 1?”)</b>
          <br><span class="note">Mật độ có thể lớn hơn 1. Xác suất là <b>diện tích</b> dưới mật độ trên một khoảng; để so hai giả thuyết thì chỉ cần so mật độ với nhau.</span></div>
        say: "Lỗi thứ ba, đọc mật độ như xác suất, rồi thắc mắc vì sao 2 phẩy 42 lại lớn hơn 1. Mật độ có thể lớn hơn 1. Xác suất là diện tích dưới mật độ trên một khoảng, còn để so hai giả thuyết thì chỉ cần so mật độ với nhau."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[round(alg.gauss_pdf(z, 2, 0.05), 3) for z in (2.0, 2.1)] == [7.979, 1.08] and round(math.exp(4), 1) == 54.6"
      - "-1 / 2 - (-9 / 2) == 4"
      - "round(alg.beam_likelihood(2.1, 2.0, 0.1), 3) == 2.188 and round(alg.beam_likelihood(2.1, 2.4, 0.1), 4) == 0.0499 and round(alg.beam_likelihood(2.1, 2.0, 0.1) / alg.beam_likelihood(2.1, 2.4, 0.1), 1) == 43.9"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cảm biến tốt hơn, $\sigma = 0{,}05$ m. Tính mật độ của phép đo 2,0 m và 2,1 m khi thật là 2 m.</td></tr>
          <tr><td>2</td><td>Tỉ số mật độ giữa lệch 0,1 m và lệch 0,3 m ở ví dụ ($\sigma = 0{,}1$) là $e^{4}$. Vì sao?</td></tr>
          <tr><td>3</td><td>Quyết định: đo được $z = 2{,}1$ m ($\sigma = 0{,}1$, hỗn hợp). Giả thuyết A: tường cách 2,0 m; B: cách 2,4 m. Tin giả thuyết nào, gấp mấy lần?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cảm biến tốt hơn với xích-ma bằng 0 phẩy 05 mét. Tính mật độ của phép đo 2 mét và 2 phẩy 1 mét khi khoảng cách thật là 2 mét. Câu hai, tỉ số mật độ giữa lệch 0 phẩy 1 mét và lệch 0 phẩy 3 mét ở ví dụ, với xích-ma 0 phẩy 1, bằng e mũ 4, vì sao lại như vậy? Câu ba là một quyết định, đo được 2 phẩy 1 mét, giả thuyết A nói tường cách 2 mét, giả thuyết B nói cách 2 phẩy 4 mét, tin bên nào và gấp mấy lần? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $z = 2{,}0$ (đỉnh): $\frac{1}{0{,}05\sqrt{2\pi}} \approx \hl{7{,}979}$</p>
          <p>$z = 2{,}1$: lệch 0,1 m = 2σ (vì σ = 0,05) → $7{,}979 \cdot e^{-2} \approx \hl{1{,}080}$</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, với z bằng 2, mật độ bằng 1 chia 0 phẩy 05 nhân căn 2 pi, khoảng 7 phẩy 979. Chú ý lệch 0 phẩy 1 mét bây giờ là 2 xích-ma, vì xích-ma chỉ còn 0 phẩy 05. Với z bằng 2 phẩy 1, tức lệch 2 xích-ma, mật độ bằng 7 phẩy 979 nhân e mũ âm 2, khoảng 1 phẩy 08."
      - show: |
          <table class="t"><tr><th>② lệch</th><th>số mũ $-\frac{k^2}{2}$</th></tr>
          <tr><td>0,1 m = 1σ</td><td>$-\frac{1}{2}$</td></tr>
          <tr><td>0,3 m = 3σ</td><td>$-\frac{9}{2}$</td></tr>
          <tr><td>hiệu</td><td>$-\frac{1}{2} - (-\frac{9}{2}) = 4$ → tỉ số $e^4 \approx 54{,}6$</td></tr></table>
        focus: [1, "1.2", "1.4"]
        say: "Câu hai, phần đỉnh giống nhau nên khi chia sẽ triệt tiêu, chỉ còn so số mũ. Câu hai, lệch 0 phẩy 1 mét là 1 xích-ma cho số mũ âm 1 phần 2, lệch 0 phẩy 3 mét là 3 xích-ma cho số mũ âm 9 phần 2. Hiệu bằng 4, nên tỉ số là e mũ 4, khoảng 54 phẩy 6."
      - clear: true
        show: |
          <table class="t"><tr><th>③ giả thuyết</th><th>lệch so với $z = 2{,}1$</th><th>mật độ hỗn hợp</th></tr>
          <tr><td>A: 2,0 m</td><td>0,1 m = 1σ</td><td>$0{,}9 \cdot 2{,}42 + 0{,}01 \approx 2{,}188$</td></tr>
          <tr><td>B: 2,4 m</td><td>0,3 m = 3σ</td><td>$0{,}9 \cdot 0{,}0443 + 0{,}01 \approx 0{,}0499$</td></tr>
          <tr><td>tỉ số</td><td colspan="2">$\frac{2{,}188}{0{,}0499} \approx \hl{43{,}9}$ → tin <b>A</b> hơn khoảng 44 lần</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu ba, chấm mỗi giả thuyết bằng mật độ hỗn hợp của phép đo 2 phẩy 1 mét. Giả thuyết A lệch 1 xích-ma, mật độ khoảng 2 phẩy 188. Giả thuyết B lệch 3 xích-ma, mật độ khoảng 0 phẩy 0499. Tỉ số khoảng 43 phẩy 9, nên tin A hơn khoảng 44 lần, ít hơn 54 phẩy 6 lần vì phần đo hỏng nâng đáy của B lên."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mô hình đo p(z | d)</span><span class="a">→</span>
          <span class="n">phần trúng: chuẩn quanh d</span><span class="a">→</span>
          <span class="n">phần đo hỏng: chừa xác suất cho điều lạ</span><span class="a">→</span>
          <span class="n">σ ước lượng từ dữ liệu, tia không độc lập hoàn toàn</span></div>
        say: "Tổng kết lại, mô hình đo cho mật độ của phép đo khi biết khoảng cách thật. Phần trúng là phân phối chuẩn quanh d, phần đo hỏng chừa xác suất cho điều lạ. Xích-ma phải ước lượng từ dữ liệu, và các tia không độc lập hoàn toàn."
      - show: |
          <div class="box key"><b>Tư duy:</b> một mô hình tốt không chỉ mô tả cảm biến khi nó <b>đúng</b>, mà cả khi nó <b>sai</b>.</div>
        say: "Điều cần mang theo, một mô hình tốt không chỉ mô tả cảm biến khi nó đúng, mà cả khi nó sai."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>định vị</b> bằng bộ lọc Bayes rời rạc và bộ lọc hạt.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học định vị bằng bộ lọc Bayes rời rạc và bộ lọc hạt. Hẹn gặp bạn ở bài tiếp theo."
