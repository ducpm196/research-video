    kind: intuition
    title: "Phóng to phần đáy: chỗ hai mô hình khác nhau"
    checks:
      - "alg.gauss_pdf(9.5, 2, 0.1) < 1e-300 and round(alg.beam_likelihood(9.5, 2, 0.1), 3) == 0.01 and round(alg.gauss_pdf(2, 2, 0.1), 2) == 3.99"
      - "min(alg.beam_likelihood(z / 100, 2, 0.1) for z in range(0, 1001)) >= 0.01"
      - "round(alg.beam_likelihood(2, 2, 0.1), 2) == 3.6 and round(0.9 * alg.gauss_pdf(2, 2, 0.1) + 0.01, 2) == 3.6"
