id: L03
course: ROB
series: "ROB · Robot tự hành"
title: "Bài 3 — Mô hình cảm biến: đo khoảng cách có nhiễu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rob.yaml L03; audit/rob/verify_rob.py L03; S. Thrun, W. Burgard, D. Fox, Probabilistic Robotics (2005), mục 6.3 (mô hình chùm tia: phần trúng, phần ngẫu nhiên, phần cực đại, phần ngắn); CS115 bài 14 (phân phối chuẩn)"
assumes: [arith, frac, sqrt, pi, exp, cdot, approx]
# Quy ước: khoảng cách thật d, phép đo z, nhiễu chuẩn độ lệch σ (alg.gauss_pdf). Mô hình hỗn hợp rút gọn hai phần: 0,9 · chuẩn(d, σ) + 0,1 · đều(0, 10 m)
#   (alg.beam_likelihood) — bản đầy đủ của sách có bốn phần; tỉ lệ 0,9 / 0,1 là SỐ MINH HOẠ. Kết quả là MẬT ĐỘ (đơn vị 1/m), không phải xác suất.
objectives:
  - "Viết khả năng của một phép đo theo khoảng cách thật"
  - "Hiểu vì sao cần thành phần đo hỏng"
  - "Phân biệt mật độ và xác suất"
