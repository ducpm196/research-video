scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một tia phản xạ sai làm robot “mất trí”"
    checks:
      - "alg.gauss_pdf(9.5, 2, 0.1) < 1e-300 and round(alg.beam_likelihood(9.5, 2, 0.1), 2) == 0.01"
    steps:
      - show: |
          <p>Robot ở cách tường 2 m. Một tia đo khoảng cách chiếu vào gương, phản xạ đi xa, báo <b>9,5 m</b>. Nếu mô hình nói “nhiễu chỉ là phân phối chuẩn quanh 2 m”, phép đo này có khả năng gần như bằng 0 — và mọi giả thuyết “robot ở đây” bị loại sạch.</p>
          <div class="box key">Hôm nay: <b>mô hình cảm biến</b> — mô tả xác suất của phép đo theo khoảng cách thật, và vì sao phải chừa chỗ cho phép đo hỏng.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, robot ở cách tường 2 mét. Một tia đo khoảng cách chiếu vào gương, phản xạ đi xa, và báo 9 phẩy 5 mét. Nếu mô hình nói nhiễu chỉ là phân phối chuẩn quanh 2 mét, phép đo này có khả năng gần như bằng 0, và mọi giả thuyết rằng robot ở đây bị loại sạch. Hôm nay ta học mô hình cảm biến, mô tả xác suất của phép đo theo khoảng cách thật, và vì sao phải chừa chỗ cho phép đo hỏng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hình chuông của phân phối chuẩn, mật độ và diện tích"
    checks:
      - "round(math.erf(1 / math.sqrt(2)) * 100) == 68 and round(math.erf(2 / math.sqrt(2)) * 100) == 95 and round(math.e, 3) == 2.718"
      - "round(1 / (0.1 * math.sqrt(2 * math.pi)), 3) == 3.989 and [round(math.exp(-k * k / 2), 3) for k in (1, 2, 3)] == [0.607, 0.135, 0.011]"
      - "round(1 / 10, 2) == 0.1 and round((2.5 - 2) * 0.1, 3) == 0.05"
      - "[round(alg.gauss_pdf(2 + d, 2, 0.1), 4) for d in (0.1, 0.2, 0.3)] == [2.4197, 0.5399, 0.0443]"
    steps:
      - show: |
          <p>Trước hết, ta cần hiểu <b>phân phối chuẩn</b>. Đo một bức tường cách 2 m nhiều lần, số đo không giống hệt nhau mà tụ quanh 2 m: gần 2 m thì hay gặp, càng xa càng hiếm. Vẽ tần suất ra được một hình <b>chuông</b>: đỉnh tại <b>trung bình</b>, độ rộng đo bằng <b>độ lệch chuẩn</b> $\sigma$.</p>
          <table class="t"><tr><th>$\sigma = 0{,}1$ m, khoảng</th><th>tỉ lệ số đo rơi vào</th></tr>
          <tr><td>trong 1σ: [1,9; 2,1] m</td><td>≈ 68%</td></tr>
          <tr><td>trong 2σ: [1,8; 2,2] m</td><td>≈ 95%</td></tr></table>
        introduces: [sigma]
        focus: [1, 1, 1, "2.2", "2.3"]
        say: "Trước hết, ta cần hiểu phân phối chuẩn, cách mô tả nhiễu hay gặp nhất. Đo một bức tường cách 2 mét nhiều lần, số đo không giống hệt nhau mà tụ quanh 2 mét, gần 2 mét thì hay gặp, càng xa càng hiếm. Vẽ tần suất ra thì được một hình chuông, đỉnh tại trung bình, độ rộng đo bằng độ lệch chuẩn xích-ma. Với xích-ma bằng 0 phẩy 1 mét, khoảng 68 phần trăm số đo nằm trong 1 xích-ma, tức từ 1 phẩy 9 tới 2 phẩy 1 mét. Khoảng 95 phần trăm nằm trong 2 xích-ma, tức từ 1 phẩy 8 tới 2 phẩy 2 mét."
      - clear: true
        show: |
          <p>Chiều cao của chuông tại mỗi điểm gọi là <b>mật độ</b>. Đỉnh cao $\frac{1}{\sigma\sqrt{2\pi}}$; lệch $k$ lần $\sigma$ thì nhân thêm $e^{-k^2/2}$, với $e \approx 2{,}718$.</p>
          <table class="t"><tr><th>$\sigma = 0{,}1$ m, lệch</th><th>nhân với</th><th>mật độ</th></tr>
          <tr><td>0 (đỉnh)</td><td>1</td><td>$\frac{1}{0{,}1\sqrt{2\pi}} \approx 3{,}989$</td></tr>
          <tr><td>1σ = 0,1 m</td><td>$e^{-1/2} \approx 0{,}607$</td><td>≈ 2,42</td></tr>
          <tr><td>2σ = 0,2 m</td><td>$e^{-2} \approx 0{,}135$</td><td>≈ 0,54</td></tr>
          <tr><td>3σ = 0,3 m</td><td>$e^{-9/2} \approx 0{,}011$</td><td>≈ 0,0443</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Chiều cao của hình chuông tại mỗi điểm gọi là mật độ, và ngay sau đây ta sẽ thấy nó khác xác suất thế nào. Đỉnh cao 1 chia xích-ma nhân căn 2 pi, còn lệch k lần xích-ma thì nhân thêm e mũ âm k bình phương chia 2, với e là hằng số khoảng 2 phẩy 718. Với xích-ma bằng 0 phẩy 1 mét, đỉnh cao khoảng 3 phẩy 989. Lệch 1 xích-ma thì nhân 0 phẩy 607, còn khoảng 2 phẩy 42. Lệch 2 xích-ma thì nhân 0 phẩy 135, còn khoảng 0 phẩy 54. Lệch 3 xích-ma chỉ còn nhân 0 phẩy 011, khoảng 0 phẩy 0443."
      - clear: true
        show: |
          <p><b>Mật độ</b> không phải xác suất. Xác suất = <b>diện tích</b> dưới đường mật độ trên một khoảng.</p>
          <table class="t"><tr><th>phân phối đều trên [0, 10 m]</th><th>tính</th></tr>
          <tr><td>mật độ (chiều cao)</td><td>$\frac{1}{10} = 0{,}1$ mỗi mét</td></tr>
          <tr><td>xác suất rơi vào [2; 2,5 m]</td><td>rộng 0,5 nhân cao 0,1 = 0,05</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Điều thứ hai, mật độ không phải là xác suất, xác suất là diện tích dưới đường mật độ trên một khoảng. Lấy phân phối đều trên đoạn 0 tới 10 mét làm ví dụ. Chiều cao của nó là 1 phần 10, tức 0 phẩy 1 mỗi mét, để cả hình chữ nhật có diện tích bằng 1. Xác suất rơi vào khoảng từ 2 tới 2 phẩy 5 mét là rộng 0 phẩy 5 nhân cao 0 phẩy 1, bằng 0 phẩy 05."

  - id: sym
    kind: symbol
    title: "Giải mã: khả năng của phép đo"
    steps:
      - show: |
          <p><b>Mô hình đo</b> $p(z \mid d)$: mật độ của phép đo $z$ khi khoảng cách thật là $d$. Dùng để chấm điểm giả thuyết: giả thuyết nào làm phép đo “dễ xảy ra” hơn thì đáng tin hơn.</p>
          <table class="t"><tr><th>thành phần</th><th>mô tả</th></tr>
          <tr><td>trúng</td><td>chuẩn quanh $d$: $\frac{1}{\sigma \sqrt{2\pi}} e^{-(z - d)^2 / (2\sigma^2)}$</td></tr>
          <tr><td>ngẫu nhiên (đo hỏng)</td><td>đều trên cả dải đo, ví dụ $\frac{1}{10}$ trên [0, 10 m]</td></tr></table>
          <p>Mô hình hỗn hợp: $0{,}9 \cdot$ trúng $+ \; 0{,}1 \cdot$ ngẫu nhiên. Đây là <b>mật độ</b> (đơn vị 1/m), có thể lớn hơn 1.</p>
          <p class="note">Sách chuẩn (Thrun, Burgard, Fox 2005, mục 6.3) dùng bốn phần: thêm “vật lạ chắn ngang ở gần” và “không nhận được tia về, máy báo tầm tối đa”. Bài này giữ hai phần để thấy rõ ý chính.</p>
        introduces: [prob, given]
        focus: [1, 1, 2, "2.2", "2.3", 3, 3, 4, 4]
        say: "Mô hình đo p của z khi biết d là mật độ của phép đo z khi khoảng cách thật là d. Ta dùng nó để chấm điểm giả thuyết, giả thuyết nào làm phép đo dễ xảy ra hơn thì đáng tin hơn. Bảng mô tả hai thành phần. Thành phần trúng là phân phối chuẩn quanh d với độ lệch xích-ma. Thành phần ngẫu nhiên, tức đo hỏng, là phân phối đều trên cả dải đo, ví dụ 1 phần 10 trên khoảng 0 tới 10 mét. Mô hình hỗn hợp lấy 0 phẩy 9 phần trúng cộng 0 phẩy 1 phần ngẫu nhiên. Đây là mật độ, đơn vị một trên mét, nên có thể lớn hơn 1. Sách chuẩn về robot xác suất dùng bốn phần, thêm phần vật lạ chắn ngang ở gần, và phần máy báo tầm tối đa khi không nhận được tia về. Bài này giữ hai phần để thấy rõ ý chính."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
