id: L12
course: ROB
series: "ROB · Robot tự hành"
title: "Bài 12 — An toàn và kiểm thử robot: quãng dừng, mô phỏng và thực tế"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rob.yaml L12; audit/rob/verify_rob.py L12; ISO 3691-4:2020 (xe công nghiệp không người lái — yêu cầu an toàn, nêu theo tên); J. Tobin và cộng sự, Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World (2017); ESY bài 12 (bộ giám sát); bài 0–11"
assumes: [arith, frac, power, sqrt, cdot, approx]
# Quy ước: quãng dừng = v·t + v²/(2a) với t thời gian phản ứng (phát hiện + quyết định + truyền lệnh), a gia tốc phanh (alg.stop_distance).
#   Tốc độ lớn nhất còn dừng kịp trong tầm phát hiện R: v = −a·t + √(a²t² + 2aR) (alg.max_safe_speed). Số đo là SỐ MINH HOẠ; tiêu chuẩn chỉ nêu tên.
objectives:
  - "Tính quãng dừng an toàn"
  - "Tính tốc độ tối đa theo tầm phát hiện"
  - "Giải thích khoảng cách giữa mô phỏng và thực tế"
asr_reviewed:
  - {sentence: "Bước năm, thử trường hợp xấu, cùng tốc độ nhưng sàn ướt.", reason: "ASR chép “Bước năm, thử trường hợp xấu cùng tốc độ nhân sản ước.” (0.75): lệch âm/thanh thuần Việt: nhưng sàn ướt/nhân sản ước — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, cộng hai phần lại thành quãng dừng.", reason: "ASR chép “Bước 3, cộng 2 phần lại thành quảng dưng.” (0.778): lệch âm/thanh thuần Việt: quãng dừng/quảng dưng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Quãng phanh với gia tốc a bằng v bình phương chia 2 a.", reason: "ASR chép “Quảng Phanh với gia tốc A bằng với Bình Phương chia 2A.” (0.846): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: quãng/quảng — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nhanh gấp đôi, dừng xa gấp 3,6 lần"
    checks:
      - "round(alg.stop_distance(1.5, 1, 0.2), 3) == 1.425 and round(alg.stop_distance(3, 1, 0.2), 1) == 5.1 and round(alg.stop_distance(3, 1, 0.2) / alg.stop_distance(1.5, 1, 0.2), 2) == 3.58"
    steps:
      - show: |
          <p>Robot kho hàng chạy 1,5 m/s cần 1,425 m để dừng. Tăng lên 3 m/s cho kịp đơn hàng: quãng dừng thành <b>5,1 m</b> — gấp 3,58 lần, không phải gấp đôi. Cảm biến chỉ thấy vật cản trong 3 m thì robot sẽ đâm.</p>
          <div class="box key">Hôm nay: <b>an toàn của robot</b> — tính quãng dừng, chọn tốc độ theo tầm nhìn, và vì sao chạy tốt trong mô phỏng chưa đủ.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, robot kho hàng chạy 1 phẩy 5 mét mỗi giây cần 1 phẩy 425 mét để dừng. Tăng lên 3 mét mỗi giây cho kịp đơn hàng thì quãng dừng thành 5 phẩy 1 mét, gấp 3 phẩy 58 lần chứ không phải gấp đôi. Nếu cảm biến chỉ thấy vật cản trong 3 mét thì robot sẽ đâm. Hôm nay ta học an toàn của robot, tính quãng dừng, chọn tốc độ theo tầm nhìn, và vì sao chạy tốt trong mô phỏng là chưa đủ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: quãng đường khi tốc độ đều và khi phanh đều"
    checks:
      - "round(1.5 * 0.2, 2) == 0.3 and 1.5 / 1 == 1.5 and round((1.5 + 0) / 2, 2) == 0.75 and round(0.75 * 1.5, 3) == 1.125 == 1.5 ** 2 / 2"
      - "1.5 ** 2 == 2.25 and 3 ** 2 == 9 and 9 / 2.25 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần nhớ</th><th>ví dụ số</th></tr>
          <tr><td>tốc độ đều: quãng = tốc độ nhân thời gian</td><td>1,5 m/s trong 0,2 s: $1{,}5 \cdot 0{,}2 = 0{,}3$ m</td></tr>
          <tr><td>phanh đều, gia tốc $a$: tốc độ giảm $a$ mỗi giây, nên dừng sau $\frac{v}{a}$ giây</td><td>1,5 m/s, $a = 1$ m/s²: dừng sau 1,5 s</td></tr>
          <tr><td>quãng phanh = tốc độ trung bình nhân thời gian</td><td>$\frac{1{,}5 + 0}{2} \cdot 1{,}5 = 0{,}75 \cdot 1{,}5 = 1{,}125$ m</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4"]
        say: "Trước hết, ta ôn cách tính quãng đường, vì quãng dừng gồm hai phần như vậy. Khi tốc độ đều, quãng bằng tốc độ nhân thời gian, 1 phẩy 5 mét mỗi giây trong 0 phẩy 2 giây đi được 0 phẩy 3 mét. Khi phanh đều với gia tốc a, tốc độ giảm a mỗi giây, nên xe dừng sau v chia a giây. Với 1 phẩy 5 mét mỗi giây và a bằng 1, xe dừng sau 1 phẩy 5 giây. Quãng phanh bằng tốc độ trung bình 0 phẩy 75 nhân 1 phẩy 5 giây, được 1 phẩy 125 mét."
      - show: |
          <p>Gộp lại: tốc độ trung bình $\frac{v}{2}$ nhân thời gian $\frac{v}{a}$ cho quãng phanh</p>
          $$\frac{v}{2} \cdot \frac{v}{a} = \frac{v^2}{2a}, \qquad \text{làm thử: } \frac{1{,}5^2}{2} = \frac{2{,}25}{2} = 1{,}125 \text{ m}$$
          <p>Có $v^2$ nên tốc độ gấp đôi thì quãng phanh gấp bốn: $3^2 = 9 = 4 \cdot 2{,}25$.</p>
        focus: [1, 2, 3]
        say: "Gộp hai điều đó lại, tốc độ trung bình v chia 2 nhân thời gian v chia a cho quãng phanh bằng v bình phương chia 2 a. Làm thử, 1 phẩy 5 bình phương là 2 phẩy 25, chia 2 được 1 phẩy 125 mét, khớp với cách tính trên. Vì có v bình phương nên tốc độ gấp đôi thì quãng phanh gấp bốn, 3 bình phương bằng 9, gấp 4 lần 2 phẩy 25."

  - id: sym
    kind: symbol
    title: "Giải mã: quãng dừng và tốc độ an toàn"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>công thức</th></tr>
          <tr><td>quãng đi trong thời gian phản ứng $t$</td><td>$v \cdot t$</td></tr>
          <tr><td>quãng phanh với gia tốc $a$</td><td>$\frac{v^2}{2a}$</td></tr>
          <tr><td><b>quãng dừng</b></td><td>$v \cdot t + \frac{v^2}{2a}$ — có số hạng $v^2$</td></tr>
          <tr><td><b>tốc độ an toàn</b> với tầm phát hiện $R$</td><td>$v = -a t + \sqrt{a^2 t^2 + 2 a R}$ (nghiệm dương của quãng dừng $= R$)</td></tr></table>
          <p>Thời gian phản ứng gồm: phát hiện (một chu kỳ cảm biến), quyết định, truyền lệnh, động cơ bắt đầu phanh.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng cho các công thức. Quãng đi trong thời gian phản ứng t bằng v nhân t. Quãng phanh với gia tốc a bằng v bình phương chia 2 a. Quãng dừng là tổng hai phần, v nhân t cộng v bình phương chia 2 a, có số hạng v bình phương. Tốc độ an toàn với tầm phát hiện R bằng âm a t cộng căn của a bình phương t bình phương cộng 2 a R, là nghiệm dương của phương trình quãng dừng bằng R. Thời gian phản ứng gồm phát hiện trong một chu kỳ cảm biến, quyết định, truyền lệnh, và động cơ bắt đầu phanh."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Quãng dừng cong lên theo tốc độ"
    checks:
      - "round(alg.stop_distance(1.5, 1, 0.2), 3) == 1.425 and round(alg.stop_distance(3, 1, 0.2), 1) == 5.1 and round(alg.max_safe_speed(3, 1, 0.2), 2) == 2.26 and round(3 * 0.2, 1) == 0.6"
      - "(lambda v: abs(v * v + 0.4 * v - 4) < 1e-9 and round(v, 2) == 1.81)(-0.2 + math.sqrt(0.04 + 4)) and round(0.4 / 2, 1) == 0.2 and round(0.16 / 4, 2) == 0.04 and abs(1.81 ** 2 + 0.4 * 1.81 - 4) < 0.01 and round(0.4 ** 2 / 4 - (-4), 2) == 4.04"
    steps:
      - show: |
          <div><svg width="1500" height="470" viewBox="0 0 1500 470"><line x1="200" y1="400" x2="1300" y2="400" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="400" x2="200" y2="40" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="209" x2="1300" y2="209" stroke="#b91c1c" stroke-width="3" stroke-dasharray="12 8"/><line x1="200" y1="400" x2="1250" y2="362" stroke="#2a78d6" stroke-width="4"/><polyline points="200,400 218,399 235,398 252,397 270,396 288,395 305,393 322,392 340,390 358,388 375,386 392,383 410,381 428,378 445,376 462,373 480,369 498,366 515,363 532,359 550,355 568,352 585,348 602,343 620,339 638,334 655,330 672,325 690,320 708,315 725,309 742,304 760,298 777,292 795,286 812,280 830,274 848,268 865,261 882,254 900,247 917,240 935,233 952,226 970,218 988,210 1005,202 1022,194 1040,186 1058,178 1075,169 1092,161 1110,152 1128,143 1145,134 1162,124 1180,115 1198,105 1215,96 1232,86 1250,75" fill="none" stroke="#eb6834" stroke-width="5"/><line x1="990" y1="209" x2="990" y2="400" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 6"/><circle cx="725" cy="309" r="10" fill="#059669"/><circle cx="1250" cy="75" r="10" fill="#b91c1c"/><circle cx="990" cy="209" r="9" fill="#b91c1c"/><g font-size="22" fill="#1f2937"><text x="190" y="32">quãng dừng (m)</text><text x="1310" y="406">tốc độ (m/s)</text><text x="743" y="339" fill="#059669">1,5 m/s: 1,425 m</text><text x="1232" y="81" text-anchor="end" fill="#b91c1c">3 m/s: 5,1 m</text><text x="230" y="197" fill="#b91c1c">cảm biến chỉ thấy 3 m</text><text x="980" y="432" text-anchor="middle" fill="#b91c1c">2,26 m/s</text><text x="1050" y="432" fill="#2a78d6">đường xanh: phần phản ứng, 0,2 nhân v</text><text x="305" y="133" fill="#eb6834">tổng: cong lên vì có v bình phương</text><text x="200" y="460" font-size="20" fill="#6b7280">phản ứng 0,2 s, phanh 1 m/s² (số minh hoạ)</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ quãng dừng theo tốc độ, tính bằng chính công thức của bài với thời gian phản ứng 0 phẩy 2 giây và gia tốc phanh 1. Đường xanh là phần đi trong lúc phản ứng, thẳng vì chỉ là 0 phẩy 2 nhân v. Đường cam là tổng quãng dừng, cong vút lên vì có v bình phương, nên 1 phẩy 5 mét mỗi giây cần 1 phẩy 425 mét mà 3 mét mỗi giây cần 5 phẩy 1 mét. Vạch đỏ là tầm cảm biến 3 mét, đường cam cắt nó ở khoảng 2 phẩy 26 mét mỗi giây, nhanh hơn thế là không dừng kịp."
      - clear: true
        show: |
          <p>Tốc độ an toàn với tầm $R = 2$ m: đặt quãng dừng bằng $R$ rồi giải ($t = 0{,}2$, $a = 1$).</p>
          $$0{,}2 v + \frac{v^2}{2} = 2 \;\Rightarrow\; v^2 + 0{,}4 v - 4 = 0 \;\Rightarrow\; v = -0{,}2 + \sqrt{0{,}04 + 4} \approx 1{,}81$$
          <p>Bước giữa: nhân hai vế với 2. Phương trình bậc hai $v^2 + pv + q = 0$ có nghiệm $v = -\frac{p}{2} \pm \sqrt{\frac{p^2}{4} - q}$; tốc độ phải dương nên lấy dấu +. Với $p = 0{,}4$, $q = -4$: $-\frac{0{,}4}{2} + \sqrt{\frac{0{,}16}{4} + 4}$ — đúng dạng $-at + \sqrt{a^2 t^2 + 2aR}$. Thử lại: $1{,}81^2 + 0{,}4 \cdot 1{,}81 \approx 4$.</p>
        introduces: [implies]
        focus: [1, 2, 3, 3, 3, 3]
        say: "Công thức tốc độ an toàn không cần học thuộc, ta đặt quãng dừng bằng tầm phát hiện, ví dụ 2 mét, rồi giải. Mũi tên kép đọc là suy ra, nhân hai vế với 2 được v bình phương cộng 0 phẩy 4 v trừ 4 bằng 0. Phương trình v bình phương cộng p v cộng q bằng 0 có nghiệm âm p chia 2, cộng hoặc trừ căn của p bình phương chia 4 trừ q. Tốc độ phải dương nên ta lấy dấu cộng. Ở đây p bằng 0 phẩy 4 và q bằng âm 4, nên nghiệm dương bằng âm 0 phẩy 2 cộng căn của 0 phẩy 04 cộng 4, khoảng 1 phẩy 81 mét mỗi giây. Đó đúng là dạng âm a t cộng căn của a bình phương t bình phương cộng 2 a R ở bảng ký hiệu."

  - id: example
    kind: example
    title: "Tính quãng dừng và tốc độ tối đa"
    checks:
      - "round(1.5 * 0.2, 2) == 0.3 and round(1.5 ** 2 / 2, 3) == 1.125 and round(alg.stop_distance(1.5, 1, 0.2), 3) == 1.425"
      - "round(alg.max_safe_speed(2, 1, 0.2), 2) == 1.81 and round(alg.stop_distance(alg.max_safe_speed(2, 1, 0.2), 1, 0.2), 6) == 2.0 and round(alg.stop_distance(1.5, 0.5, 0.2), 2) == 2.55"
    steps:
      - show: |
          <p><b>Bước 1 — quãng phản ứng</b>, $v = 1{,}5$ m/s, $t = 0{,}2$ s:</p>
          $$v \cdot t = 1{,}5 \cdot 0{,}2 = 0{,}3 \text{ m}$$
        focus: [1, 2]
        say: "Bước một, với số minh hoạ, robot chạy 1 phẩy 5 mét mỗi giây và cần 0 phẩy 2 giây để phản ứng. Trong lúc đó nó vẫn chạy nguyên tốc độ, đi thêm 1 phẩy 5 nhân 0 phẩy 2, bằng 0 phẩy 3 mét."
      - show: |
          <p><b>Bước 2 — quãng phanh</b>, $a = 1$ m/s²:</p>
          $$\frac{v^2}{2a} = \frac{1{,}5^2}{2 \cdot 1} = \frac{2{,}25}{2} = 1{,}125 \text{ m}$$
        focus: [1, 2]
        say: "Bước hai, tính quãng phanh với gia tốc phanh 1 mét trên giây bình phương. Quãng phanh bằng 1 phẩy 5 bình phương chia 2, tức 2 phẩy 25 chia 2, bằng 1 phẩy 125 mét."
      - clear: true
        show: |
          <p><b>Bước 3 — quãng dừng</b> = hai phần cộng lại:</p>
          $$0{,}3 + 1{,}125 = \hl{1{,}425} \text{ m}$$
        focus: [1, 2]
        say: "Bước ba, cộng hai phần lại thành quãng dừng. Với v bằng 1 phẩy 5 mét mỗi giây, t bằng 0 phẩy 2 giây, a bằng 1, quãng dừng bằng 0 phẩy 3 cộng 1 phẩy 125, tức 1 phẩy 425 mét."
      - show: |
          <p><b>Bước 4 — tốc độ tối đa</b> khi tầm phát hiện chỉ 2 m, cùng $t$, $a$:</p>
          $$v = -0{,}2 + \sqrt{0{,}04 + 4} \approx \hl{1{,}81} \text{ m/s}$$
        focus: [1, 2]
        say: "Bước bốn, đi ngược lại, từ tầm phát hiện ra tốc độ cho phép. Với tầm phát hiện 2 mét, tốc độ tối đa bằng âm 0 phẩy 2 cộng căn của 0 phẩy 04 cộng 4, khoảng 1 phẩy 81 mét mỗi giây."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 5 — trường hợp xấu</th><th>phép tính</th><th>quãng dừng</th></tr>
          <tr><td>sàn khô, $a = 1$ m/s²</td><td>$0{,}3 + \frac{2{,}25}{2}$</td><td>1,425 m</td></tr>
          <tr><td>sàn ướt, $a$ chỉ còn 0,5 m/s²</td><td>$0{,}3 + \frac{2{,}25}{1}$</td><td>2,55 m</td></tr></table>
          <p>Tốc độ cho phép phải tính theo <b>trường hợp xấu</b>: sàn trơn, tải nặng, cảm biến bị che một phần.</p>
        focus: [1, "1.3", 2]
        say: "Bước năm, thử trường hợp xấu, cùng tốc độ nhưng sàn ướt. Trên sàn ướt, gia tốc phanh chỉ còn 0 phẩy 5, thì ở 1 phẩy 5 mét mỗi giây quãng dừng thành 2 phẩy 55 mét. Tốc độ cho phép phải tính theo trường hợp xấu, như sàn trơn, tải nặng, hay cảm biến bị che một phần."

  - id: check
    kind: check
    title: "Tự kiểm: cộng quãng đường từng nửa giây"
    checks:
      - "[round(x, 3) for x in ((1.5 + 1.0) / 2 * 0.5, (1.0 + 0.5) / 2 * 0.5, (0.5 + 0) / 2 * 0.5)] == [0.625, 0.375, 0.125] and round(0.3 + 0.625 + 0.375 + 0.125, 3) == 1.425"
    steps:
      - show: |
          <table class="t"><tr><th>khoảng thời gian</th><th>tốc độ đầu → cuối</th><th>quãng = trung bình nhân 0,5 s</th></tr>
          <tr><td>phản ứng 0,2 s</td><td>1,5 → 1,5</td><td>0,3 m</td></tr>
          <tr><td>phanh 0 → 0,5 s</td><td>1,5 → 1,0</td><td>0,625 m</td></tr>
          <tr><td>phanh 0,5 → 1 s</td><td>1,0 → 0,5</td><td>0,375 m</td></tr>
          <tr><td>phanh 1 → 1,5 s</td><td>0,5 → 0</td><td>0,125 m</td></tr>
          <tr><td>cộng</td><td></td><td>1,425 m ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Kiểm bằng đường khác, không dùng công thức bình phương mà cộng quãng đường từng đoạn, vì phanh đều nên mỗi đoạn có quãng bằng tốc độ trung bình nhân thời gian. Trong 0 phẩy 2 giây phản ứng, robot đi 0 phẩy 3 mét. Nửa giây phanh đầu, tốc độ từ 1 phẩy 5 xuống 1, trung bình 1 phẩy 25, đi 0 phẩy 625 mét. Nửa giây tiếp, từ 1 xuống 0 phẩy 5, đi 0 phẩy 375 mét. Nửa giây cuối, từ 0 phẩy 5 về 0, đi 0 phẩy 125 mét. Cộng lại được 1 phẩy 425 mét, khớp với công thức."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, từ người mới tới người đã đi làm"
    checks:
      - "round(alg.stop_distance(1.5, 1, 0.5), 3) == 1.875 and round(1.5 * 0.5, 2) == 0.75 and round(1.875 - 1.425, 2) == 0.45"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin kết quả mô phỏng <b class="red">(khoảng cách mô phỏng – thực tế)</b>
          <br><span class="note">Mô phỏng thường giả định ma sát đều, cảm biến ít nhiễu, trễ bằng 0. Thử với tham số mô phỏng ngẫu nhiên hoá (ma sát, trễ, nhiễu), rồi thử thật ở tốc độ thấp trước.</span></div>
        say: "Lỗi thứ nhất, tin kết quả mô phỏng, bỏ qua khoảng cách giữa mô phỏng và thực tế. Mô phỏng thường giả định ma sát đều, cảm biến ít nhiễu, và trễ bằng 0. Hãy thử với tham số mô phỏng được ngẫu nhiên hoá như ma sát, trễ và nhiễu, rồi thử thật ở tốc độ thấp trước."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Để chức năng an toàn phụ thuộc phần mềm phức tạp <b class="red">(một lỗi là mất phanh)</b>
          <br><span class="note">Đường dừng khẩn cấp phải độc lập: nút dừng cứng, bộ giám sát, vùng bảo vệ đơn giản của cảm biến an toàn — không đi qua bộ lập kế hoạch.</span></div>
        say: "Lỗi thứ hai, để chức năng an toàn phụ thuộc phần mềm phức tạp, nên một lỗi là mất phanh. Đường dừng khẩn cấp phải độc lập, gồm nút dừng cứng, bộ giám sát, và vùng bảo vệ đơn giản của cảm biến an toàn, không đi qua bộ lập kế hoạch."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ thử ca bình thường <b class="red">(ca hiếm gây tai nạn)</b>
          <br><span class="note">Người chạy ra đột ngột, vật trong suốt, gương, đèn chói, mất định vị. Lập danh sách ca nguy hiểm, thử từng ca, và ghi lại mỗi lần dừng khẩn cấp để học.</span></div>
        say: "Lỗi thứ ba, chỉ thử ca bình thường, trong khi ca hiếm mới gây tai nạn. Đó là người chạy ra đột ngột, vật trong suốt, gương, đèn chói, hay mất định vị. Hãy lập danh sách ca nguy hiểm, thử từng ca, và ghi lại mỗi lần dừng khẩn cấp để học."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Lấy thời gian phản ứng <b>trung bình</b> để tính quãng dừng <b class="red">(thiếu khi hệ chậm nhất)</b>
          <br><span class="note">Đo trên máy thật thấy trung bình 0,2 s, nhưng có lúc tới 0,5 s (số minh hoạ: cảm biến lỡ một chu kỳ, máy tính đang bận). Người làm nghề đo phân bố trễ và tính theo trễ <b>tệ nhất</b>.</span></div>
          <table class="t"><tr><th>1,5 m/s, $a = 1$ m/s²</th><th>quãng phản ứng</th><th>quãng dừng</th></tr>
          <tr><td>trễ trung bình 0,2 s</td><td>0,3 m</td><td>1,425 m</td></tr>
          <tr><td>trễ tệ nhất 0,5 s</td><td>0,75 m</td><td>1,875 m — thêm 0,45 m</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, lấy thời gian phản ứng trung bình để tính quãng dừng. Đo trên máy thật thấy trung bình 0 phẩy 2 giây, nhưng có lúc tới 0 phẩy 5 giây, khi cảm biến lỡ một chu kỳ hay máy tính đang bận. Người làm nghề đo cả phân bố trễ, và tính quãng dừng theo trễ tệ nhất chứ không theo trung bình. Với trễ trung bình, quãng dừng ở 1 phẩy 5 mét mỗi giây là 1 phẩy 425 mét. Với trễ tệ nhất 0 phẩy 5 giây, quãng dừng thành 1 phẩy 875 mét, dài thêm 0 phẩy 45 mét."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.max_safe_speed(3, 0.8, 0.25), 3) == 2.0 and round(alg.stop_distance(2, 0.8, 0.25), 3) == 3.0"
      - "round(0.8 * 0.25, 2) == 0.2 and round(0.2 ** 2, 2) == 0.04 and round(2 * 0.8 * 3, 1) == 4.8 and round(math.sqrt(4.84), 6) == 2.2 and round(2 * 0.25, 1) == 0.5 and round(4 / 1.6, 1) == 2.5"
      - "round(2 * 0.8 * 2.5, 6) == 4 and round(alg.max_safe_speed(2.5, 0.8, 0.25), 2) == 1.81 and round(1.81 * 0.25, 2) == 0.45 and round(1.81 ** 2 / 1.6, 2) == 2.05 and round(alg.stop_distance(alg.max_safe_speed(2.5, 0.8, 0.25), 0.8, 0.25), 6) == 2.5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề (gia tốc phanh 0,8 m/s², phản ứng 0,25 s)</th></tr>
          <tr><td>1</td><td>Tầm phát hiện 3 m. Tốc độ tối đa còn dừng kịp?</td></tr>
          <tr><td>2</td><td>Kiểm lại: ở tốc độ đó, quãng dừng đúng bằng bao nhiêu?</td></tr>
          <tr><td>3</td><td>Quyết định: giữ biên an toàn 0,5 m, tức chỉ dùng 2,5 m của tầm phát hiện. Đặt giới hạn tốc độ bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tầm phát hiện 3 mét, gia tốc phanh 0 phẩy 8, thời gian phản ứng 0 phẩy 25 giây, tốc độ tối đa còn dừng kịp là bao nhiêu? Câu hai, kiểm lại, ở tốc độ đó quãng dừng đúng bằng bao nhiêu? Câu ba là một quyết định, giữ biên an toàn 0 phẩy 5 mét, tức chỉ dùng 2 phẩy 5 mét tầm phát hiện, thì đặt giới hạn tốc độ bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1, từng phần</th><th>giá trị</th></tr>
          <tr><td>$a \cdot t = 0{,}8 \cdot 0{,}25$</td><td>0,2, nên $a^2 t^2 = 0{,}04$</td></tr>
          <tr><td>$2 a R = 2 \cdot 0{,}8 \cdot 3$</td><td>4,8</td></tr>
          <tr><td>$-0{,}2 + \sqrt{0{,}04 + 4{,}8} = -0{,}2 + \sqrt{4{,}84}$</td><td>$-0{,}2 + 2{,}2 = \hl{2{,}0}$ m/s</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu một làm từng phần cho khỏi nhầm. Tích a nhân t bằng 0 phẩy 8 nhân 0 phẩy 25, bằng 0 phẩy 2, bình phương lên được 0 phẩy 04. Hai a R bằng 2 nhân 0 phẩy 8 nhân 3, bằng 4 phẩy 8. Đáp án câu một, v bằng âm 0 phẩy 2 cộng căn của 4 phẩy 84, tức âm 0 phẩy 2 cộng 2 phẩy 2, bằng 2 mét mỗi giây."
      - show: |
          $$2 \cdot 0{,}25 + \frac{2^2}{2 \cdot 0{,}8} = 0{,}5 + \frac{4}{1{,}6} = 0{,}5 + 2{,}5 = \hl{3} \text{ m}$$
          <p>② Đúng bằng tầm phát hiện, không còn dư. Thực tế chọn thấp hơn để có biên an toàn.</p>
        focus: [1, 2]
        say: "Câu hai, quãng dừng bằng 2 nhân 0 phẩy 25 cộng 4 chia 1 phẩy 6, tức 0 phẩy 5 cộng 2 phẩy 5, bằng 3 mét. Nó đúng bằng tầm phát hiện, không còn dư, nên thực tế phải chọn thấp hơn để có biên an toàn."
      - clear: true
        show: |
          <p>③ Thay $R = 2{,}5$: $2aR = 2 \cdot 0{,}8 \cdot 2{,}5 = 4$, nên</p>
          $$v = -0{,}2 + \sqrt{0{,}04 + 4} \approx \hl{1{,}81} \text{ m/s}$$
          <p>Thử lại: $1{,}81 \cdot 0{,}25 + \frac{1{,}81^2}{1{,}6} \approx 0{,}45 + 2{,}05 = 2{,}5$ m, còn dư 0,5 m so với 3 m.</p>
        focus: [1, 2, 3]
        say: "Câu ba, thay tầm dùng được là 2 phẩy 5 mét, thì 2 a R bằng 2 nhân 0 phẩy 8 nhân 2 phẩy 5, bằng 4. Tốc độ giới hạn bằng âm 0 phẩy 2 cộng căn của 4 phẩy 04, khoảng 1 phẩy 81 mét mỗi giây. Thử lại, quãng dừng khoảng 0 phẩy 45 cộng 2 phẩy 05, bằng 2 phẩy 5 mét, còn dư 0 phẩy 5 mét so với tầm 3 mét."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">quãng dừng $= v \cdot t + \frac{v^2}{2a}$</span><span class="a">→</span>
          <span class="n">tốc độ theo tầm phát hiện, có biên</span><span class="a">→</span>
          <span class="n">tính theo trường hợp xấu</span><span class="a">→</span>
          <span class="n">dừng khẩn độc lập, thử ca hiếm, mô phỏng có nhiễu</span></div>
        say: "Tổng kết lại, quãng dừng bằng v t cộng v bình phương chia 2 a, và tốc độ phải chọn theo tầm phát hiện với biên an toàn, tính theo trường hợp xấu. Đường dừng khẩn phải độc lập, thử cả ca hiếm, và mô phỏng phải có nhiễu."
      - show: |
          <div class="box key"><b>Tư duy:</b> một robot an toàn là robot được thiết kế cho lúc <b>mọi thứ khác đều hỏng</b>.</div>
        say: "Điều cần mang theo, một robot an toàn là robot được thiết kế cho lúc mọi thứ khác đều hỏng."
      - clear: true
        show: |
          <p class="note">Bạn đã có kiến trúc, chuyển động, đo quãng đường, cảm biến, định vị, lọc Kalman mở rộng, bản đồ, đồ thị tư thế, lập kế hoạch, tránh vật cản, bám quỹ đạo, thị giác và an toàn. Bài sau, bài cuối của khoá: hành trình có thật của xe tự lái, từ cuộc đua sa mạc năm 2004 tới đội xe chở khách không người lái.</p>
        forward_ref: true
        say: "Tới đây bạn đã có kiến trúc, chuyển động, đo quãng đường, cảm biến, định vị, lọc Kalman mở rộng và bản đồ. Thêm đồ thị tư thế, lập kế hoạch, tránh vật cản, bám quỹ đạo, thị giác và an toàn. Bài sau là bài cuối của khoá, kể lại hành trình có thật của xe tự lái, từ cuộc đua sa mạc năm 2004 tới đội xe chở khách không người lái. Ở mỗi chặng, ta xem quy mô lớn dần làm lộ ra điểm nghẽn nào, và các đội làm xe đã xử lý ra sao."
