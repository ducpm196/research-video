id: L02
course: ROB
series: "ROB · Robot tự hành"
title: "Bài 2 — Đo quãng đường bằng bánh xe và sai số tích lũy"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rob.yaml L02; audit/rob/verify_rob.py L02; J. Borenstein, L. Feng, Measurement and Correction of Systematic Odometry Errors in Mobile Robots, IEEE Trans. Robotics and Automation 12(6) (1996); Siegwart–Nourbakhsh–Scaramuzza (2011), mục 5.2.4; bài 1"
assumes: [arith, frac, pi, sin, cdot, approx, omega_sym, theta, sub]
# Quy ước: bánh đường kính D, bộ mã hoá vòng quay N xung mỗi vòng: mỗi xung πD/N (alg.encoder_mm_per_tick). Quãng mỗi bánh d_L, d_R;
#   quãng tâm xe (d_L + d_R)/2; góc quay (d_R − d_L)/L. Lệch ngang sau quãng thẳng s khi hướng lệch e độ: s·sin e (alg.heading_drift).
#   Tên odometry, encoder chỉ trên màn hình; lời đọc “đo quãng đường bằng bánh xe”, “bộ mã hoá vòng quay”.
objectives:
  - "Đổi xung mã hoá thành quãng đường và góc quay"
  - "Giải thích vì sao sai số hướng làm sai số vị trí lớn nhanh"
  - "Biết vì sao cần cảm biến bên ngoài"
asr_reviewed:
  - {sentence: "Một cộng 1 phẩy 05 chia 2, được 1 phẩy 025 mét.", reason: "ASR chép “Một cổng 1,05 chi 2 được 1,02 5m.” (0.741): đơn vị mét, ASR viết ký hiệu “m”; lệch âm/thanh thuần Việt: cộng/cổng, chia/chi, mươi/∅ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước hai, nhân số xung với quãng mỗi xung.", reason: "ASR chép “Bước 2, nhận số sung với quảng mỗi sung.” (0.778): lệch âm/thanh thuần Việt: nhân/nhận, quãng/quảng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Quãng mỗi xung bằng pi nhân D chia N, tức chu vi bánh chia số xung mỗi vòng.", reason: "ASR chép “Quảng mổi sung bằng pi nhân dê chia n, tức chú vì bánh chia số sung mổi vòng.” (0.722): lệch âm/thanh thuần Việt: quãng mỗi/quảng mổi, chu vi/chú vì, mỗi/mổi — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bánh đường kính 0 phẩy 1 mét, 1000 xung mỗi vòng, nên mỗi xung khoảng 0 phẩy 314 mi li mét.", reason: "ASR chép “Bánh đường kính 0,1m, 1000 xuống mỗi vòng, nền mỗi xuống khoảng 0,314mm.” (0.75): đơn vị mét, ASR viết ký hiệu “m”; đơn vị mi-li-mét, ASR viết ký hiệu “mm”; lệch âm/thanh thuần Việt: xung/xuống, nên/nền, xung/xuống — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng đổi số xung đếm được ra quãng.", reason: "ASR chép “Bản đổi số xung đếm được ra quản.” (0.75): lệch âm/thanh thuần Việt: bảng/bản, quãng/quản — NOT_VERIFIED bằng tai người"}
  - {sentence: "Góc quay bằng hiệu quãng bánh phải trừ bánh trái, chia L, tính bằng ra-đi-an, giống ô-mê-ga ở bài 1 nhân thời gian.", reason: "ASR chép “Góc quay bằng hiệu quản bánh phải trừ bánh trái, chia L, tính bằng radiant, giống omega ở bài một nhân thời gian.” (0.8): ra-đi-an: probe RBM p1 8/8, ASR viết “radian/radiant”; ô-mê-ga (ω) đọc tách âm tiết, ASR viết “omega/ω”; lệch âm/thanh thuần Việt: quãng/quản — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lệch 1 độ, sau 10 mét lệch 17,5 cm"
    checks:
      - "round(alg.heading_drift(10, 1), 3) == 0.175"
    steps:
      - show: |
          <p>Robot đếm vòng quay bánh xe để biết mình đã đi bao xa, và tưởng đang đi thẳng. Nhưng hướng của nó lệch chỉ <b>1 độ</b> — sau 10 m, nó đã lệch ngang <b>17,5 cm</b>, đủ để đâm vào khung cửa. Không gì trong bánh xe báo cho nó biết.</p>
          <div class="box key">Hôm nay: <b>đo quãng đường bằng bánh xe</b> — từ số xung ra quãng đường và góc quay, và vì sao sai số <b>tích lũy</b> theo thời gian.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, robot đếm vòng quay bánh xe để biết mình đã đi bao xa, và tưởng đang đi thẳng. Nhưng hướng của nó lệch chỉ 1 độ, và sau 10 mét nó đã lệch ngang 17 phẩy 5 xen-ti-mét, đủ để đâm vào khung cửa. Không gì trong bánh xe báo cho nó biết điều đó. Hôm nay ta học đo quãng đường bằng bánh xe, từ số xung ra quãng đường và góc quay, và vì sao sai số tích lũy theo thời gian."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chu vi bánh, góc quay của bài 1, sin của góc nhỏ"
    checks:
      - "round(math.pi * 0.1, 3) == 0.314 and round(3 * math.pi * 0.1, 3) == 0.942"
      - "round((0.6 - 0.4) / 0.5, 3) == 0.4 and round((0.6 * 1 - 0.4 * 1) / 0.5, 3) == 0.4"
      - "round(math.sin(math.radians(1)), 4) == 0.0175 and round(math.radians(1), 4) == 0.0175 and round(10 * math.sin(math.radians(1)), 3) == 0.175"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần nhớ</th><th>ví dụ số</th></tr>
          <tr><td>bánh lăn một vòng thì đi đúng một <b>chu vi</b> $\pi D$</td><td>$D = 0{,}1$ m: $\pi \cdot 0{,}1 \approx 0{,}314$ m; 3 vòng $\approx 0{,}942$ m</td></tr>
          <tr><td>bài 1: vận tốc góc = hiệu tốc độ hai bánh chia $L$</td><td>bánh 0,4 và 0,6 m/s, $L = 0{,}5$: $\frac{0{,}6 - 0{,}4}{0{,}5} = 0{,}4$ rad/s</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước hết, ta ôn ba điều sẽ dùng ngay. Bánh lăn một vòng thì đi đúng một chu vi, bằng pi nhân đường kính, bánh 0 phẩy 1 mét đi khoảng 0 phẩy 314 mét mỗi vòng, 3 vòng là khoảng 0 phẩy 942 mét. Ở bài 1, vận tốc góc bằng hiệu tốc độ hai bánh chia L, bánh 0 phẩy 4 và 0 phẩy 6 mét mỗi giây với L bằng 0 phẩy 5 cho 0 phẩy 4 ra-đi-an mỗi giây."
      - show: |
          <p>Nhân cả hai bánh với cùng thời gian 1 giây: quãng bánh trái 0,4 m, bánh phải 0,6 m, góc quay $\frac{0{,}6 - 0{,}4}{0{,}5} = 0{,}4$ rad — vẫn là “hiệu chia $L$”, chỉ thay tốc độ bằng quãng.</p>
          <table class="t"><tr><th>góc nhỏ</th><th>sin</th><th>đổi ra ra-đi-an</th></tr>
          <tr><td>$1^\circ$</td><td>$\sin 1^\circ \approx 0{,}0175$</td><td>$1^\circ \approx 0{,}0175$ rad</td></tr></table>
        introduces: [deg]
        focus: [1, 1, "2.2", "2.2"]
        say: "Nhân tốc độ của cả hai bánh với cùng thời gian 1 giây, ta được quãng bánh trái 0 phẩy 4 mét, bánh phải 0 phẩy 6 mét. Góc quay vẫn là hiệu chia L, bằng 0 phẩy 4 ra-đi-an, chỉ thay tốc độ bằng quãng. Điều thứ ba, với góc nhỏ thì sin của góc gần bằng chính góc đó tính bằng ra-đi-an, sin 1 độ khoảng 0 phẩy 0175. Vì vậy đi 10 mét với hướng lệch 1 độ thì lệch ngang 10 nhân 0 phẩy 0175, khoảng 0 phẩy 175 mét."

  - id: sym
    kind: symbol
    title: "Giải mã: xung, quãng mỗi bánh, góc quay"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>công thức</th></tr>
          <tr><td>quãng mỗi xung</td><td>$\frac{\pi D}{N}$ — chu vi bánh chia số xung mỗi vòng</td></tr>
          <tr><td>quãng mỗi bánh $d_L$, $d_R$</td><td>số xung × quãng mỗi xung</td></tr>
          <tr><td>quãng của tâm xe</td><td>$\frac{d_L + d_R}{2}$</td></tr>
          <tr><td>góc quay</td><td>$\frac{d_R - d_L}{L}$ (ra-đi-an) — như $\omega$ ở bài 1, nhân thời gian</td></tr></table>
          <p>Cộng dồn các bước nhỏ này cho ước lượng tư thế. Mỗi bước có sai số nhỏ, và sai số <b>không bao giờ được sửa</b> — chỉ cộng thêm.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Bảng cho bốn công thức. Quãng mỗi xung bằng pi nhân D chia N, tức chu vi bánh chia số xung mỗi vòng. Quãng mỗi bánh bằng số xung nhân quãng mỗi xung. Quãng của tâm xe là trung bình quãng hai bánh. Góc quay bằng hiệu quãng bánh phải trừ bánh trái, chia L, tính bằng ra-đi-an, giống ô-mê-ga ở bài 1 nhân thời gian. Cộng dồn các bước nhỏ này cho ta ước lượng tư thế. Mỗi bước có sai số nhỏ, và sai số không bao giờ được sửa, chỉ cộng thêm."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Sai số hướng bị kéo dài theo quãng đường"
    checks:
      - "[round(s * math.sin(math.radians(1)), 3) for s in (2, 10)] == [0.035, 0.175] and round(10 * math.sin(math.radians(2)), 3) == 0.349"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><line x1="130" y1="380" x2="1120" y2="380" stroke="#6b7280" stroke-width="2"/><line x1="130" y1="380" x2="130" y2="100" stroke="#6b7280" stroke-width="2"/><polyline points="130,380 225,366 320,352 415,338 510,324 605,310 700,296 795,282 890,268 985,254 1080,240" fill="none" stroke="#2a78d6" stroke-width="4"/><circle cx="320" cy="352" r="6" fill="#2a78d6"/><circle cx="510" cy="324" r="6" fill="#2a78d6"/><circle cx="700" cy="296" r="6" fill="#2a78d6"/><circle cx="890" cy="268" r="6" fill="#2a78d6"/><circle cx="1080" cy="240" r="6" fill="#2a78d6"/><polyline points="130,380 225,352 320,324 415,296 510,268 605,240 700,212 795,185 890,157 985,129 1080,101" fill="none" stroke="#eb6834" stroke-width="4"/><circle cx="320" cy="324" r="6" fill="#eb6834"/><circle cx="510" cy="268" r="6" fill="#eb6834"/><circle cx="700" cy="212" r="6" fill="#eb6834"/><circle cx="890" cy="157" r="6" fill="#eb6834"/><circle cx="1080" cy="101" r="6" fill="#eb6834"/><g font-size="22" fill="#1f2937"><text x="1100" y="248" fill="#2a78d6">lệch 1 độ: 0,175 m sau 10 m</text><text x="1100" y="109" fill="#eb6834">lệch 2 độ: 0,349 m sau 10 m</text><text x="605" y="420" text-anchor="middle">quãng đã đi (m): 0, 2, 4, 6, 8, 10</text><text x="140" y="90">lệch ngang (m)</text><text x="605" y="148" text-anchor="middle" font-size="24">không có điểm nào để lệch tự giảm: chỉ tăng</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ độ lệch ngang theo quãng đã đi, khi robot tưởng mình đi thẳng nhưng hướng lệch một góc cố định. Đường xanh là lệch 1 độ, sau 2 mét mới lệch 3 phẩy 5 xen-ti-mét, sau 10 mét đã lệch 0 phẩy 175 mét. Đường cam là lệch 2 độ, dốc gấp đôi, tới 0 phẩy 349 mét. Bánh xe không đo được hướng thật, nên không có điểm nào để độ lệch tự giảm, nó chỉ tăng theo quãng."

  - id: example
    kind: example
    title: "Từ xung ra quãng và góc"
    checks:
      - "round(alg.encoder_mm_per_tick(0.1, 1000), 4) == 0.3142 and round(3183 * alg.encoder_mm_per_tick(0.1, 1000) / 1000, 3) == 1.0 and round(3342 * alg.encoder_mm_per_tick(0.1, 1000) / 1000, 3) == 1.05"
      - "round((1.05 - 1.0) / 0.5, 3) == 0.1 and round(math.degrees(0.1), 2) == 5.73 and round(alg.heading_drift(10, 2), 3) == 0.349"
      - "round((1.0 + 1.05) / 2, 3) == 1.025 and round(math.pi * 0.1 * 1000, 1) == 314.2"
    steps:
      - show: |
          <p><b>Bước 1 — quãng mỗi xung</b> (bánh 0,1 m, 1000 xung mỗi vòng):</p>
          $$\frac{\pi \cdot 0{,}1}{1000} \text{ m} = \frac{314{,}2}{1000} \text{ mm} \approx \hl{0{,}314} \text{ mm}$$
        focus: [1, 2]
        say: "Bước một, tính quãng ứng với một xung, tức chu vi bánh chia số xung mỗi vòng. Bánh đường kính 0 phẩy 1 mét, 1000 xung mỗi vòng, nên mỗi xung khoảng 0 phẩy 314 mi li mét."
      - show: |
          <table class="t"><tr><th>Bước 2 — đếm được</th><th>quãng</th></tr>
          <tr><td>bánh trái 3183 xung</td><td>≈ 1,000 m</td></tr>
          <tr><td>bánh phải 3342 xung</td><td>≈ 1,050 m</td></tr></table>
        focus: [1, 1, "1.2", "1.3"]
        say: "Bước hai, nhân số xung với quãng mỗi xung. Bảng đổi số xung đếm được ra quãng. Bánh trái đếm 3183 xung, khoảng 1 mét. Bánh phải đếm 3342 xung, khoảng 1 phẩy 05 mét."
      - show: |
          <p><b>Bước 3 — quãng của tâm xe</b> là trung bình hai bánh:</p>
          $$\frac{1{,}000 + 1{,}050}{2} = \hl{1{,}025} \text{ m}$$
        focus: [1, 2]
        say: "Bước ba, tâm xe nằm giữa hai bánh nên đi quãng bằng trung bình hai bánh. Một cộng 1 phẩy 05 chia 2, được 1 phẩy 025 mét."
      - clear: true
        show: |
          <p><b>Bước 4 — góc quay</b>, $L = 0{,}5$ m:</p>
          $$\frac{1{,}050 - 1{,}000}{0{,}5} = 0{,}1 \text{ rad} \approx \hl{5{,}73}^\circ$$
        focus: [1, 2]
        say: "Bước bốn, góc quay bằng hiệu quãng hai bánh chia khoảng cách hai bánh. Với L bằng 0 phẩy 5 mét, góc quay bằng 0 phẩy 05 chia 0 phẩy 5, bằng 0 phẩy 1 ra-đi-an, khoảng 5 phẩy 73 độ."
      - show: |
          <table class="t"><tr><th>Bước 5 — hướng lệch</th><th>sau 10 m lệch ngang</th></tr>
          <tr><td>$1^\circ$</td><td>$10 \cdot \sin 1^\circ \approx 0{,}175$ m</td></tr>
          <tr><td>$2^\circ$</td><td>$10 \cdot \sin 2^\circ \approx 0{,}349$ m</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước năm, xem góc sai một chút thì hậu quả lớn thế nào. Lệch hướng 1 độ thì sau 10 mét lệch ngang 0 phẩy 175 mét, lệch 2 độ thì 0 phẩy 349 mét. Sai số hướng bị nhân với quãng đường."

  - id: check
    kind: check
    title: "Tự kiểm: đếm vòng bánh, rồi dựng lại cung tròn"
    checks:
      - "round(3183 / 1000, 3) == 3.183 and round(3.183 * math.pi * 0.1, 3) == 1.0 and round(3342 / 1000, 3) == 3.342 and round(3.342 * math.pi * 0.1, 3) == 1.05"
      - "round(1.025 / 0.1, 2) == 10.25 and round((10.25 - 0.25) * 0.1, 3) == 1.0 and round((10.25 + 0.25) * 0.1, 3) == 1.05"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>tính</th><th>khớp</th></tr>
          <tr><td>số vòng bánh trái</td><td>$\frac{3183}{1000} = 3{,}183$ vòng, nhân chu vi 0,314 → 1,000 m</td><td>✓</td></tr>
          <tr><td>số vòng bánh phải</td><td>$\frac{3342}{1000} = 3{,}342$ vòng → 1,050 m</td><td>✓</td></tr>
          <tr><td>cung của tâm xe: bán kính $\frac{1{,}025}{0{,}1} = 10{,}25$ m</td><td>bánh trái $10{,}0 \cdot 0{,}1 = 1{,}000$; bánh phải $10{,}5 \cdot 0{,}1 = 1{,}050$</td><td>✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.4"]
        say: "Kiểm bằng đường khác, trước hết đếm số vòng bánh thay vì dùng quãng mỗi xung. Bánh trái quay 3183 chia 1000, bằng 3 phẩy 183 vòng, nhân chu vi 0 phẩy 314 mét được 1 mét. Bánh phải quay 3 phẩy 342 vòng, được 1 phẩy 05 mét. Rồi dựng lại cung tròn như ở bài 1, tâm xe đi 1 phẩy 025 mét với góc 0 phẩy 1, nên bán kính quay là 10 phẩy 25 mét. Bánh trái ở bán kính 10 mét đi 1 mét, bánh phải ở bán kính 10 phẩy 5 mét đi 1 phẩy 05 mét, khớp với số xung."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "round(100 * 0.01, 2) == 1.0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng đường kính danh nghĩa <b class="red">(sai có hệ thống)</b>
          <br><span class="note">Lốp mòn, chở nặng làm đường kính thật nhỏ đi 1% → mỗi 100 m sai 1 m, luôn cùng một chiều. Hiệu chuẩn bằng cách chạy quãng đã biết (đường vuông khép kín, bài báo 1996).</span></div>
        say: "Lỗi thứ nhất, dùng đường kính danh nghĩa, nên sai có hệ thống. Lốp mòn hay chở nặng làm đường kính thật nhỏ đi 1 phần trăm, nên mỗi 100 mét sai 1 mét, luôn cùng một chiều. Hãy hiệu chuẩn bằng cách chạy một quãng đã biết, như một đường vuông khép kín."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tin ước lượng sau quãng đường dài <b class="red">(trôi không giới hạn)</b>
          <br><span class="note">Sai số đo quãng đường bằng bánh xe chỉ tăng. Cần cảm biến nhìn ra ngoài — tia sáng đo khoảng cách, camera, mốc định vị — để kéo ước lượng về đúng.</span></div>
        say: "Lỗi thứ hai, tin ước lượng sau một quãng đường dài, trong khi sai số trôi không giới hạn. Sai số của cách đo bằng bánh xe chỉ tăng. Cần cảm biến nhìn ra ngoài, như cảm biến đo khoảng cách bằng tia sáng, camera, hay mốc định vị, để kéo ước lượng về đúng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Bỏ qua trượt bánh <b class="red">(xung đếm đủ nhưng xe không đi)</b>
          <br><span class="note">Bánh quay tại chỗ trên sàn trơn vẫn đếm xung. So xung hai bánh với cảm biến quay (con quay hồi chuyển): lệch nhiều thì đánh dấu dữ liệu không tin cậy.</span></div>
        say: "Lỗi thứ ba, bỏ qua trượt bánh, khi xung đếm đủ mà xe không đi. Bánh quay tại chỗ trên sàn trơn vẫn đếm xung. Hãy so xung hai bánh với cảm biến đo góc quay, lệch nhiều thì đánh dấu dữ liệu không tin cậy."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.encoder_mm_per_tick(0.15, 2048), 3) == 0.23 and round(alg.heading_drift(20, 0.5), 3) == 0.175"
      - "round(math.pi * 0.15, 4) == 0.4712 and round(471.2 / 2048, 3) == 0.23 and round(math.sin(math.radians(0.5)), 5) == 0.00873 and round(20 * 0.00873, 3) == 0.175"
      - "round(50 * 0.01, 3) == 0.5 and 0.5 > 0.2 and round(0.2 / 0.01) == 20"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bánh đường kính 0,15 m, 2048 xung mỗi vòng: mỗi xung bao nhiêu mm?</td></tr>
          <tr><td>2</td><td>Hướng lệch 0,5°, đi thẳng 20 m: lệch ngang bao nhiêu? So với lệch 1° sau 10 m?</td></tr>
          <tr><td>3</td><td>Quyết định: lốp mòn làm đường kính thật nhỏ hơn 1%. Robot chạy 50 m, yêu cầu sai quãng không quá 0,2 m. Có cần hiệu chuẩn không?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bánh đường kính 0 phẩy 15 mét, 2048 xung mỗi vòng, mỗi xung bao nhiêu mi li mét? Câu hai, hướng lệch 0 phẩy 5 độ, đi thẳng 20 mét thì lệch ngang bao nhiêu? So với lệch 1 độ sau 10 mét thì sao? Câu ba là một quyết định, lốp mòn làm đường kính thật nhỏ hơn 1 phần trăm, robot chạy 50 mét và yêu cầu sai quãng không quá 0 phẩy 2 mét, có cần hiệu chuẩn không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Chu vi trước, rồi chia cho số xung:</p>
          $$\pi \cdot 0{,}15 \approx 0{,}4712 \text{ m} = 471{,}2 \text{ mm}, \qquad \frac{471{,}2}{2048} \approx \hl{0{,}230} \text{ mm}$$
        focus: [1, 2]
        say: "Câu một, trước hết tính chu vi bánh, pi nhân 0 phẩy 15 khoảng 0 phẩy 4712 mét, tức 471 phẩy 2 mi li mét. Đáp án câu một, pi nhân 0 phẩy 15 chia 2048, khoảng 0 phẩy 23 mi li mét."
      - show: |
          <p>② $\sin 0{,}5^\circ \approx 0{,}00873$, nên</p>
          $$20 \cdot 0{,}00873 \approx \hl{0{,}175} \text{ m}$$
          <p>Bằng đúng trường hợp $1^\circ$ sau 10 m: góc nhỏ thì lệch ≈ quãng nhân góc, nửa góc mà gấp đôi quãng thì như nhau.</p>
        focus: [1, 2, 3]
        say: "Câu hai, sin của 0 phẩy 5 độ khoảng 0 phẩy 00873, bằng một nửa sin 1 độ. Câu hai, 20 nhân sin của 0 phẩy 5 độ, khoảng 0 phẩy 175 mét, bằng đúng trường hợp 1 độ sau 10 mét, vì góc nhỏ thì độ lệch xấp xỉ quãng nhân góc. Nửa góc mà gấp đôi quãng thì độ lệch như nhau."
      - clear: true
        show: |
          <table class="t"><tr><th>③</th><th>tính</th></tr>
          <tr><td>sai quãng sau 50 m</td><td>$50 \cdot 1\% = 0{,}5$ m</td></tr>
          <tr><td>so với yêu cầu</td><td>$0{,}5 \gt 0{,}2$ → <b>cần hiệu chuẩn</b></td></tr>
          <tr><td>chạy được bao xa trước khi vượt 0,2 m</td><td>$\frac{0{,}2}{0{,}01} = 20$ m</td></tr></table>
        introduces: [ltgt]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu ba, đường kính nhỏ hơn 1 phần trăm thì mỗi quãng đếm được đều dài hơn thật 1 phần trăm. Sau 50 mét, sai quãng là 50 nhân 1 phần trăm, bằng 0 phẩy 5 mét. Con số này lớn hơn yêu cầu 0 phẩy 2 mét, nên cần hiệu chuẩn. Không hiệu chuẩn thì robot chỉ chạy được 0 phẩy 2 chia 0 phẩy 01, bằng 20 mét, trước khi vượt mức sai cho phép."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">xung → quãng mỗi bánh</span><span class="a">→</span>
          <span class="n">trung bình → quãng, hiệu chia L → góc</span><span class="a">→</span>
          <span class="n">cộng dồn: sai số chỉ tăng</span><span class="a">→</span>
          <span class="n">hiệu chuẩn, cảm biến bên ngoài</span></div>
        say: "Tổng kết lại, xung cho quãng mỗi bánh, trung bình cho quãng của xe, hiệu chia L cho góc quay. Cộng dồn thì sai số chỉ tăng, nên phải hiệu chuẩn và dùng cảm biến bên ngoài."
      - show: |
          <div class="box key"><b>Tư duy:</b> một ước lượng chỉ dựa vào “mình đã làm gì” sẽ trôi; cần một phép đo về “thế giới đang thế nào” để neo lại.</div>
        say: "Điều cần mang theo, một ước lượng chỉ dựa vào việc mình đã làm gì sẽ trôi, và cần một phép đo về thế giới đang thế nào để neo lại."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>mô hình cảm biến</b> — đo khoảng cách có nhiễu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học mô hình cảm biến, cách mô tả phép đo khoảng cách có nhiễu. Hẹn gặp bạn ở bài tiếp theo."
