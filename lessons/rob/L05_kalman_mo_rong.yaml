assumes: [arith, cos, sin, theta, sub, transpose, cdot, approx, prime, deg, mat]
# Quy ước: tư thế (x, y, θ); bước chuyển động với quãng s = v·h: x' = x + s·cos θ, y' = y + s·sin θ, θ' = θ (bỏ phần quay để thấy rõ ý chính).
#   Jacobian F theo (x, y, θ) là alg.motion_jacobian(θ, s). Hiệp phương sai dự đoán: F P Fᵀ (bỏ nhiễu chuyển động Q để thấy phần lan truyền).
#   Ma trận chữ hoa in đậm như RBM; P ban đầu = diag(0,01; 0,01; 0,01) là SỐ MINH HOẠ.
objectives:
  - "Tuyến tính hoá mô hình chuyển động bằng Jacobian"
  - "Thấy sai số hướng lan sang sai số vị trí"
  - "Biết khi nào tuyến tính hoá thất bại"
