scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lọc Kalman cần đường thẳng, robot lại đi theo cos và sin"
    steps:
      - show: |
          <p><b>Lọc Kalman</b> gộp dự đoán từ mô hình chuyển động với phép đo, mỗi thứ kèm một độ bất định (phần chuẩn bị giảng lại từ đầu). Dạng cơ bản của nó cần hệ <b>tuyến tính</b>: trạng thái mới là ma trận nhân trạng thái cũ. Nhưng xe robot đi theo $x' = x + s \cos\theta$ — có cos, có sin, không tuyến tính. Dùng lọc Kalman thế nào khi mô hình cong?</p>
          <div class="box key">Hôm nay: <b>lọc Kalman mở rộng</b> — xấp xỉ mô hình cong bằng đường thẳng tiếp tuyến (Jacobian) quanh ước lượng hiện tại.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, lọc Kalman là cách gộp dự đoán từ mô hình chuyển động với phép đo, mỗi thứ kèm một độ bất định, và phần chuẩn bị sẽ giảng lại nó từ đầu. Dạng cơ bản của nó cần hệ tuyến tính, khi trạng thái mới là một ma trận nhân trạng thái cũ. Nhưng xe robot đi theo x phẩy bằng x cộng s cos tê-ta, có cos, có sin, nên không tuyến tính. Dùng lọc Kalman thế nào khi mô hình cong? Hôm nay ta học lọc Kalman mở rộng, xấp xỉ mô hình cong bằng đường thẳng tiếp tuyến, tức Jacobian, quanh ước lượng hiện tại."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phương sai, ma trận, đạo hàm và lọc Kalman một chiều"
    checks:
      - "round(((-0.1) ** 2 + 0.1 ** 2) / 2, 4) == 0.01 and round(math.sqrt(0.01), 2) == 0.1"
      - "2 ** 2 * 0.01 == 0.04 and 0.01 + 0.01 == 0.02 and round(math.sqrt(0.01), 2) == 0.1"
      - "round((0.1 * 0.1 + (-0.1) * (-0.1)) / 2, 4) == 0.01 and round((0.1 * (-0.1) + (-0.1) * 0.1) / 2, 4) == -0.01"
      - "(lambda np: np.array([[1, 1], [0, 1]]).T.tolist() == [[1, 0], [1, 1]] and (np.array([[1, 1], [0, 1]]) @ np.array([[1, 1], [0, 1]]).T).tolist() == [[2, 1], [1, 1]])(__import__('numpy'))"
      - "round(math.sin(0.1), 4) == 0.0998 and math.cos(0) == 1 and round((math.sin(0.001) - math.sin(0)) / 0.001, 4) == 1.0 and round((math.cos(0.001) - math.cos(0)) / 0.001, 4) == -0.0005"
      - "round(0.03 + 0.01, 2) == 0.04 and (lambda r: [round(v, 4) for v in r] == [0.8, 0.08, 0.008])(alg.kalman1d_update(0, 0.04, 0.1, 0.01))"
    steps:
      - show: |
          <p><b>Phương sai</b> đo độ bất định: trung bình của bình phương độ lệch khỏi giá trị đúng; căn bậc hai của nó là <b>lệch chuẩn</b>. Hai lần đo sai −0,1 và +0,1 m: phương sai $\frac{0{,}01 + 0{,}01}{2} = 0{,}01$, lệch chuẩn $\sqrt{0{,}01} = 0{,}1$.</p>
          <table class="t"><tr><th>quy tắc phương sai</th><th>ví dụ số (phương sai 0,01, tức lệch chuẩn 0,1)</th></tr>
          <tr><td>nhân với số $a$: phương sai nhân $a^2$</td><td>$a = 2$: $2^2 \cdot 0{,}01 = 0{,}04$</td></tr>
          <tr><td>cộng hai đại lượng độc lập: phương sai cộng lại</td><td>$0{,}01 + 0{,}01 = \hl{0{,}02}$</td></tr></table>
        introduces: [power]
        focus: [1, 1, 1, "2.2", "2.3"]
        say: "Trước hết, ta cần hiểu phương sai, con số đo độ bất định mà lọc Kalman dùng liên tục. Phương sai là trung bình của bình phương độ lệch khỏi giá trị đúng, còn căn bậc hai của nó gọi là lệch chuẩn. Ví dụ hai lần đo sai âm 0 phẩy 1 và 0 phẩy 1 mét, bình phương đều là 0 phẩy 01, nên phương sai bằng 0 phẩy 01 và lệch chuẩn bằng 0 phẩy 1. Nhân một đại lượng với số a thì phương sai nhân a bình phương, a bằng 2 thì phương sai thành 4 nhân 0 phẩy 01, bằng 0 phẩy 04. Cộng hai đại lượng độc lập thì phương sai cộng lại, 0 phẩy 01 cộng 0 phẩy 01 bằng 0 phẩy 02."
      - clear: true
        show: |
          <p><b>Hiệp phương sai</b> của hai sai số = trung bình của <b>tích</b> hai độ lệch. Dương: hai sai số hay lệch <b>cùng chiều</b>; âm: ngược chiều; bằng 0: không liên quan.</p>
          <table class="t"><tr><th>lần đo</th><th>lệch $y$</th><th>lệch $\theta$</th><th>tích</th></tr>
          <tr><td>1</td><td>0,1</td><td>0,1</td><td>0,01</td></tr>
          <tr><td>2</td><td>−0,1</td><td>−0,1</td><td>0,01</td></tr></table>
          <p>Trung bình tích $= 0{,}01$, dương: cùng chiều. <b>Ma trận hiệp phương sai</b> $\mathbf{P}$ xếp phương sai từng biến trên <b>đường chéo</b>, hiệp phương sai từng cặp ở các ô ngoài đường chéo.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Điều thứ hai là hiệp phương sai của hai sai số, bằng trung bình của tích hai độ lệch. Nó dương khi hai sai số hay lệch cùng chiều, âm khi ngược chiều, và bằng 0 khi không liên quan đến nhau. Trong bảng, hai lần đo có lệch y và lệch tê-ta cùng dấu, nên tích đều là 0 phẩy 01. Trung bình tích là 0 phẩy 01, một số dương, nên hai sai số đi cùng chiều. Ma trận hiệp phương sai P xếp phương sai của từng biến trên đường chéo, và hiệp phương sai của từng cặp ở các ô ngoài đường chéo."
      - clear: true
        show: |
          <p><b>Ma trận</b> là một bảng số. <b>Nhân hai ma trận</b>: ô hàng $i$ cột $j$ = hàng $i$ của ma trận trái nhân lần lượt với cột $j$ của ma trận phải, rồi cộng. <b>Chuyển vị</b> $\mathbf{A}^T$: đổi hàng thành cột. <b>Ma trận chéo</b> chỉ có số trên đường chéo.</p>
          $$\mathbf{A} = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}, \quad \mathbf{A}^T = \begin{pmatrix} 1 & 0 \\ 1 & 1 \end{pmatrix}, \quad \mathbf{A}\mathbf{A}^T = \begin{pmatrix} 1 \cdot 1 + 1 \cdot 1 & 1 \cdot 0 + 1 \cdot 1 \\ 0 \cdot 1 + 1 \cdot 1 & 0 \cdot 0 + 1 \cdot 1 \end{pmatrix} = \begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix}$$
        focus: [1, 1, 1, 2, 2]
        say: "Điều thứ ba là ma trận, tức một bảng số, và ba phép làm với nó. Nhân hai ma trận thì ô hàng i cột j bằng hàng i của ma trận trái nhân lần lượt với cột j của ma trận phải, rồi cộng lại. Chuyển vị là đổi hàng thành cột, còn ma trận chéo chỉ có số trên đường chéo. Làm thử với A có hàng một là 1, 1 và hàng hai là 0, 1, thì A chuyển vị có hàng một là 1, 0 và hàng hai là 1, 1. Ô hàng một cột một của A nhân A chuyển vị bằng 1 nhân 1 cộng 1 nhân 1, bằng 2, làm tương tự ba ô còn lại được 1, 1 và 1."
      - clear: true
        show: |
          <p><b>Đạo hàm</b> = độ dốc: nhích đầu vào một chút $h$, xem đầu ra đổi bao nhiêu, rồi chia cho $h$. Gần một điểm, đường cong gần như thẳng theo <b>tiếp tuyến</b> có độ dốc đó.</p>
          <table class="t"><tr><th>hàm</th><th>đạo hàm</th><th>thử số tại 0, $h = 0{,}001$</th></tr>
          <tr><td>$\sin\theta$</td><td>$\cos\theta$</td><td>$\frac{\sin 0{,}001 - \sin 0}{0{,}001} \approx 1 = \cos 0$</td></tr>
          <tr><td>$\cos\theta$</td><td>$-\sin\theta$</td><td>$\frac{\cos 0{,}001 - \cos 0}{0{,}001} \approx -0{,}0005 \approx 0 = -\sin 0$</td></tr></table>
          $$\sin\theta \approx \theta \text{ gần } 0: \quad \sin 0{,}1 \approx 0{,}0998 \approx 0{,}1$$
        focus: [1, 1, "2.2", "2.2", "2.3", 3]
        say: "Điều thứ tư là đạo hàm, tức độ dốc, nhích đầu vào một chút h rồi xem đầu ra đổi bao nhiêu, chia cho h. Gần một điểm, đường cong gần như thẳng theo tiếp tuyến có đúng độ dốc đó. Đạo hàm của sin là cos, tại 0 thì bằng 1, nên gần 0 ta có sin tê-ta xấp xỉ tê-ta. Thử số với h bằng 0 phẩy 001, sin của 0 phẩy 001 chia cho 0 phẩy 001 ra gần đúng 1. Đạo hàm của cos là âm sin, thử số cho khoảng âm 0 phẩy 0005, gần bằng 0, đúng là âm sin 0. Làm thử, sin của 0 phẩy 1 ra-đi-an là khoảng 0 phẩy 0998, rất gần 0 phẩy 1."
      - clear: true
        show: |
          <p><b>Lọc Kalman một chiều</b> giữ ước lượng $x$ kèm phương sai $P$, lặp hai bước:</p>
          <table class="t"><tr><th>bước</th><th>làm gì</th><th>ví dụ số</th></tr>
          <tr><td><b>dự đoán</b></td><td>đi theo mô hình; phương sai <b>cộng</b> nhiễu chuyển động</td><td>$x = 0$; $P = 0{,}03 + 0{,}01 = 0{,}04$</td></tr>
          <tr><td><b>cập nhật</b></td><td>hệ số tin $K = \frac{P}{P + R}$ ($R$: phương sai phép đo); $x \leftarrow x + K(z - x)$; $P \leftarrow (1 - K)P$</td><td>đo $z = 0{,}1$, $R = 0{,}01$: $K = \frac{0{,}04}{0{,}05} = 0{,}8$; $x = 0{,}08$; $P = 0{,}2 \cdot 0{,}04 = \hl{0{,}008}$</td></tr></table>
          <p>Ước lượng nghiêng về nguồn chắc hơn (phương sai nhỏ hơn), và phương sai sau nhỏ hơn cả hai nguồn.</p>
        introduces: [assign]
        focus: [1, "2.2", "2.3", "2.3", "2.3", 3]
        say: "Bây giờ là lọc Kalman một chiều, nó giữ một ước lượng x kèm phương sai P, và lặp hai bước. Bước dự đoán đi theo mô hình chuyển động, và phương sai cộng thêm nhiễu chuyển động, ví dụ phương sai 0 phẩy 03 cộng 0 phẩy 01 thành 0 phẩy 04. Bước cập nhật tính hệ số tin K bằng P chia P cộng R, với R là phương sai của phép đo. Đo được 0 phẩy 1 mét với R bằng 0 phẩy 01, nên K bằng 0 phẩy 04 chia 0 phẩy 05, tức 0 phẩy 8. Ước lượng mới bằng 0 cộng 0 phẩy 8 nhân 0 phẩy 1, bằng 0 phẩy 08, còn phương sai mới bằng 0 phẩy 2 nhân 0 phẩy 04, bằng 0 phẩy 008. Ước lượng nghiêng về nguồn chắc hơn, và phương sai sau nhỏ hơn cả hai nguồn."

  - id: sym
    kind: symbol
    title: "Giải mã: Jacobian của chuyển động và lan truyền hiệp phương sai"
    steps:
      - show: |
          <p>Mô hình: $x' = x + s \cos\theta$, $y' = y + s \sin\theta$, $\theta' = \theta$, với $s$ là quãng đi trong một bước ($x'$ ở bài này là giá trị <b>mới</b> sau một bước, khác bài 1 nơi $x'$ là tốc độ thay đổi).</p>
          <p><b>Jacobian</b> $\mathbf{F}$: đạo hàm riêng của $(x', y', \theta')$ theo $(x, y, \theta)$, tính tại ước lượng hiện tại:</p>
          <p>$\mathbf{F} = \begin{pmatrix} 1 & 0 & -s \sin\theta \\ 0 & 1 & s \cos\theta \\ 0 & 0 & 1 \end{pmatrix}$</p>
          <p class="note"><b>Đạo hàm riêng</b>: nhích một biến, giữ nguyên các biến khác. Hàng một cột một: $x$ tăng bao nhiêu thì $x'$ tăng bấy nhiêu, nên bằng 1. Hàng một cột ba: đạo hàm của $s\cos\theta$ theo $\theta$ là $-s\sin\theta$.</p>
          <p>Dự đoán hiệp phương sai: $\mathbf{P}' = \mathbf{F} \mathbf{P} \mathbf{F}^T$ (+ nhiễu chuyển động). Cột thứ ba của $\mathbf{F}$ là chỗ <b>sai số hướng</b> đổ sang <b>sai số vị trí</b>.</p>
        focus: [1, 1, 2, 3, 4, 4, 5, 5]
        say: "Mô hình có ba phương trình, x phẩy bằng x cộng s cos tê-ta, y phẩy bằng y cộng s sin tê-ta, tê-ta phẩy bằng tê-ta, với s là quãng đi trong một bước. Ở bài này x phẩy là giá trị mới sau một bước, khác với bài 1 nơi x phẩy là tốc độ thay đổi. Jacobian F là ma trận đạo hàm riêng của trạng thái mới theo trạng thái cũ, tính tại ước lượng hiện tại. Ma trận có đường chéo bằng 1, cột thứ ba có âm s sin tê-ta và s cos tê-ta. Đạo hàm riêng là nhích một biến và giữ nguyên các biến khác, nên x tăng bao nhiêu thì x phẩy tăng bấy nhiêu, ô hàng một cột một bằng 1. Còn đạo hàm của s cô-sin tê-ta theo tê-ta là âm s sin tê-ta, đúng như ô hàng một cột ba. Hiệp phương sai dự đoán bằng F nhân P nhân F chuyển vị, cộng nhiễu chuyển động. Cột thứ ba của F là chỗ sai số hướng đổ sang sai số vị trí."

