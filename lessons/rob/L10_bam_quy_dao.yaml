assumes: [arith, frac, power, omega_sym, cdot, theta, cos, sin, sub]
# Quy ước: trong hệ toạ độ của xe (trục x hướng đầu xe), điểm nhìn trước trên đường cách xe L (khoảng nhìn trước), lệch ngang y.
#   Cung tròn đi qua xe và điểm đó có độ cong κ = 2y / L², bán kính R = 1/κ (alg.pure_pursuit). Vận tốc góc lệnh ω = v·κ.
#   Tên pure pursuit chỉ trên màn hình; lời đọc “điểm nhìn trước”.
objectives:
  - "Tính độ cong lệnh từ điểm nhìn trước"
  - "Đổi độ cong thành vận tốc góc"
  - "Chọn khoảng nhìn trước theo tốc độ"
