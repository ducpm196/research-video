  - {sentence: "Điều thứ hai, ở bài 1 ta đã thấy xe vi sai đi trên vòng bán kính R bằng v chia ô-mê-ga, tức vận tốc góc bằng v chia R.", reason: "ASR chép “Điều thứ 2, ở bài 1 ta đã thấy xe V-Side đi trên vòng bán kính R bằng V-Omega, tức vận tốc góc bằng V-R.” (0.833): ô-mê-ga (ω) đọc tách âm tiết, ASR viết “omega/ω”; lệch âm/thanh thuần Việt: vi sai/v side, chia (trong “chia ô mê ga” → “omega”), chia/∅ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mô phỏng bằng bước Euler 0 phẩy 001 giây với v bằng 0 phẩy 5 và ô-mê-ga bằng 0 phẩy 125, chạy trong khoảng 4 phẩy 04 giây.", reason: "ASR chép “Mô phỏng bằng bước Euler 0.001 dây với V bằng 0.5 và Omega bằng 0.125, chạy trong khoảng 4.04 dây.” (0.833): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; ô-mê-ga (ω) đọc tách âm tiết, ASR viết “omega/ω”; lệch âm/thanh thuần Việt: không (trong “không phẩy” → “”), không (trong “không phẩy” → “”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ô-mê-ga bằng v nhân ka-pa là vận tốc góc cần ra lệnh khi đi với tốc độ v.", reason: "ASR chép “Omega bằng v nhân kappa là vận tốc góc cần ra lệnh khi đi với tốc độ v.” (0.821): ô-mê-ga (ω) đọc tách âm tiết, ASR viết “omega/ω”; ka-pa (κ) đọc tách âm tiết, ASR viết “kappa” — NOT_VERIFIED bằng tai người"}
