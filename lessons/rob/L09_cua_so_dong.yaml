source: "curriculum/rob.yaml L09; audit/rob/verify_rob.py L09; D. Fox, W. Burgard, S. Thrun, The Dynamic Window Approach to Collision Avoidance, IEEE Robotics & Automation Magazine 4(1) (1997); bài 1 (xe vi sai), bài 8 (lập kế hoạch toàn cục)"
assumes: [arith, sqrt, cdot, approx, omega_sym, sub]
# Quy ước: chu kỳ 0,2 s, tốc độ hiện tại 0,4 m/s, gia tốc tối đa 0,5 m/s²: cửa sổ tốc độ [0,4 − 0,5·0,2; 0,4 + 0,5·0,2] = [0,3; 0,5].
#   Tốc độ an toàn khi còn khoảng trống d: v ≤ √(2·a·d). Điểm = 0,4·hướng + 0,4·khoảng trống + 0,2·tốc độ, mỗi phần đã chuẩn hoá về [0, 1]
#   (alg.dwa_score); ba ứng viên và trọng số là SỐ MINH HOẠ.
objectives:
  - "Sinh các cặp vận tốc khả thi trong một chu kỳ"
  - "Loại vận tốc không dừng kịp"
  - "Chấm điểm và thấy ảnh hưởng của trọng số"
