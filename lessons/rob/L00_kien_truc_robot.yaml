- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">cảm nhận → định vị → lập kế hoạch → điều khiển</span><span class="a">→</span>

      <span class="n">mỗi khối một tần số, nối bằng kênh tin</span><span class="a">→</span>

      <span class="n">ngân sách theo trễ tệ nhất</span><span class="a">→</span>

      <span class="n">dấu thời gian, bộ giám sát tự dừng</span></div>

      <p class="note"><b>So sánh hai quy mô:</b> Robot 0,5 m/s trễ 100 ms lệch 5 cm; xe 15 m/s trễ 100 ms đi mù 1,5 m — tính theo trễ tệ nhất.</p>

      '
    say: Tổng kết lại, robot tự hành đi theo vòng cảm nhận, định vị, lập kế hoạch rồi điều khiển. Mỗi khối chạy ở tần số phù hợp và nối với nhau bằng kênh tin. Ta phải lập ngân sách độ trễ theo trường hợp tệ nhất, gắn dấu thời gian và đặt bộ giám sát tự dừng. Hai mức quy mô cho thấy rõ rủi ro. Robot chậm nửa mét mỗi giây trễ 100 mi li giây chỉ sai 5 xen-ti-mét. Xe đường phố 15 mét mỗi giây cũng trễ mức ấy sẽ lao mù đi nguyên 1 mét rưỡi. Quản lý nghiêm ngặt ngân sách thời gian ở từng khâu bảo đảm toàn bộ chuỗi cảm nhận đến điều khiển luôn đáp ứng đúng hạn.
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
  - show: '<div class="box key"><b>Tư duy:</b> ở robot, câu trả lời <b>đúng nhưng muộn</b> là câu trả lời sai.</div>

      '
    say: Điều cốt lõi cần mang theo là ở robot thời gian thực, một câu trả lời đúng nhưng đưa ra muộn thực chất là câu trả lời sai. Thiếu ngân sách trễ tệ nhất hay thiếu dấu thời gian đều dễ dẫn tới va chạm ngoài hiện trường. Một hệ thống robot tin cậy luôn đặt bảo vệ thời gian thực và phanh an toàn độc lập lên trên việc cố tối ưu đường đi.
  - clear: true
    show: '<p class="note">Bài sau (bài 1): <b>mô hình chuyển động</b> của xe hai bánh vi sai.</p>

      '
