      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>giữ 2 m/s</td><td>quãng dừng 0,5 + 2,5 = 3 m &lt; 4 m ✓</td><td>mỗi chuyến 1500 chia 2 = 750 giây</td></tr>
          <tr><td>tăng ngay 3 m/s</td><td>500 giây</td><td>quãng dừng 0,75 + 5,625 = $\hl{6{,}375}$ m &gt; 4 m <b class="red">(sai)</b> — đâm trước khi kịp dừng</td></tr>
          <tr><td>thêm camera 8 m, như xe thắng năm 2005</td><td>6,375 &lt; 8 ✓; nếu 40% quãng phải chậm về 2 m/s: 300 + 300 = $\hlg{600}$ giây</td><td>tiền camera; camera kém khi tối, bụi, ngược sáng</td></tr></table>
          <p class="note">Điều kiện đổi: nếu camera hay báo nhầm và robot phải chậm lại gần hết quãng, lợi tiến về 0 — khi đó giữ 2 m/s rẻ hơn. Cảm biến gần vẫn là lớp dừng cuối cùng.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Câu một có ba lựa chọn. Giữ 2 mét mỗi giây thì quãng dừng 3 mét, nằm trong 4 mét, mỗi chuyến mất 750 giây. Tăng ngay lên 3 mét mỗi giây thì quãng dừng 6 phẩy 375 mét, dài hơn tầm thấy, robot có thể đâm trước khi kịp dừng. Thêm camera thấy 8 mét như xe thắng năm 2005 thì đủ, và nếu 40 phần trăm quãng phải chậm về 2 mét mỗi giây, chuyến chỉ mất 600 giây. Nếu camera hay báo nhầm và robot chậm lại gần hết quãng, lợi tiến về 0, khi đó giữ 2 mét mỗi giây rẻ hơn. Cảm biến gần vẫn là lớp dừng cuối cùng."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>bỏ người kèm ngay</td><td>đỡ công người</td><td>“0 va chạm” chưa nói gì: 4 lần can thiệp có thể chính là 4 va chạm đã được ngăn</td></tr>
          <tr><td>giữ người kèm, đo tiếp</td><td>quãng trung bình giữa hai lần can thiệp: 2000 chia 4 = $\hlb{500}$ km; mô phỏng lại từng lần trên dữ liệu đã ghi</td><td>thêm vài tuần thử</td></tr></table>
          <p class="note">Với mốc 1 sự cố mỗi 1000 km (số minh hoạ), 2000 km chỉ “dự kiến” 2 sự cố — quá ít để kết luận. Điều kiện đổi: bỏ người kèm trước ở vùng nhỏ, tốc độ thấp, khi mô phỏng cả 4 lần đều không va chạm và quãng giữa hai lần can thiệp đã tăng tới mức đội đặt ra từ trước.</p>
        focus: [1, "1.2", "1.3", 2, 2, 2]
        say: "Câu hai cũng là một đánh đổi. Bỏ người kèm ngay thì đỡ công, nhưng không va chạm nào chưa nói gì, vì 4 lần can thiệp có thể chính là 4 va chạm đã được ngăn. Giữ người kèm và đo tiếp, quãng giữa hai lần can thiệp là 2000 chia 4 bằng 500 ki-lô-mét, và mô phỏng lại từng lần. Với mốc một sự cố mỗi 1000 ki-lô-mét, 2000 ki-lô-mét chỉ dự kiến 2 sự cố, quá ít để kết luận. Điều kiện đổi là bỏ người kèm trước ở vùng nhỏ, tốc độ thấp, khi mô phỏng cả 4 lần đều không va chạm. Quãng giữa hai lần can thiệp cũng phải đạt mức đội đặt ra từ trước."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
