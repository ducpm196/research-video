          <tr><td>1</td><td>robot đang chạy 2 m/s. Khách muốn 3 m/s cho nhanh. Tăng tốc ngay, giữ nguyên, hay thêm camera thấy 8 m?</td></tr>
          <tr><td>2</td><td>đã thử 2000 km có người đi kèm, <b>0 va chạm</b>, người kèm can thiệp 4 lần. Bỏ người kèm được chưa?</td></tr></table>
        focus: [1, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn, với 10 robot giao hàng trong khuôn viên trường, tuyến dài 1 phẩy 5 ki-lô-mét, đều là số minh hoạ. Câu một, robot đang chạy 2 mét mỗi giây, khách muốn 3 mét mỗi giây, bạn tăng tốc ngay, giữ nguyên, hay thêm camera thấy 8 mét? Câu hai, đã thử 2000 ki-lô-mét có người đi kèm, không va chạm nào, người kèm can thiệp 4 lần, vậy bỏ người kèm được chưa? Dừng video và viết ra giấy."
