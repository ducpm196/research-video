          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>33,7 m ở 35 dặm/giờ</td><td>giải ngược: tốc độ lớn nhất dừng kịp trong 33,7 m là ≈ 35 dặm/giờ ✓</td></tr>
          <tr><td>62%</td><td>nhân ngược: 0,62 nhân 47 ≈ 29 sự kiện chỉ có trong mô phỏng ✓</td></tr>
          <tr><td>0,85 trên một triệu dặm</td><td>nhân ngược: 0,85 nhân 56,7 ≈ 48 vụ ✓</td></tr>
