      - "4 < 6.375 < 8 and round(alg.max_safe_speed(8, 0.8, 0.25), 2) == 3.38"
      - "1500 / 2 == 750 and 1500 / 3 == 500 and 0.6 * 1500 / 3 + 0.4 * 1500 / 2 == 600"
      - "2000 / 4 == 500 and 2000 / 1000 == 2"
    steps:
      - show: |
