#059669"/><rect x="1342" y="486.7" width="78" height="1.3" fill="#059669"/><text x="319" y="522" font-size="20" text-anchor="middle" fill="#1f2937">ô 0</text><text x="437" y="522" font-size="20" text-anchor="middle" fill="#b45309">ô 1 cửa</text><text x="555" y="522" font-size="20" text-anchor="middle" fill="#1f2937">ô 2</text><text x="673" y="522" font-size="20" text-anchor="middle" fill="#1f2937">ô 3</text><text x="791" y="522" font-size="20" text-anchor="middle" fill="#b45309">ô 4 cửa</text><text x="909" y="522" font-size="20" text-anchor="middle" fill="#1f2937">ô 5</text><text x="1027" y="522" font-size="20" text-anchor="middle" fill="#1f2937">ô 6</text><text x="1145" y="522" font-size="20" text-anchor="middle" fill="#b45309">ô 7 cửa</text><text x="1263" y="522" font-size="20" text-anchor="middle" fill="#1f2937">ô 8</text><text x="1381" y="522" font-size="20" text-anchor="middle" fill="#1f2937">ô 9</text></svg></div>
