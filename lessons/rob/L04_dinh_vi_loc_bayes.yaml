  - id: example
    kind: example
    title: "Thấy cửa, đi 3 ô, thấy cửa"
    checks:
      - "[round(x, 3) for x in alg.hist_filter([0.1] * 10, [0.8 if i in (1, 4, 7) else 0.1 for i in range(10)])] == [0.032, 0.258, 0.032, 0.032, 0.258, 0.032, 0.032, 0.258, 0.032, 0.032]"
      - "(lambda D: [round(x, 3) for x in alg.hist_filter(alg.hist_filter([0.1] * 10, D), D, move=3)])([0.8 if i in (1, 4, 7) else 0.1 for i in range(10)]) == [0.053, 0.053, 0.007, 0.007, 0.427, 0.007, 0.007, 0.427, 0.007, 0.007]"
      - "abs(0.1 * 0.8 - 0.08) < 1e-9 and abs(0.1 * 0.1 - 0.01) < 1e-9 and abs(3 * 0.08 + 7 * 0.01 - 0.31) < 1e-9 and round(0.08 / 0.31, 3) == 0.258 and round(0.01 / 0.31, 3) == 0.032"
      - "(lambda a, w: round(a * 0.8, 3) == 0.206 and round(a * 0.1, 3) == 0.026 and round(w * 0.8, 3) == 0.026 and round(w * 0.1, 3) == 0.003 and round(2 * a * 0.8 + a * 0.1 + w * 0.8 + 6 * w * 0.1, 3) == 0.484)(0.08 / 0.31, 0.01 / 0.31)"
    steps:
      - show: |
          <p><b>Bước 1 — thấy cửa, nhân khả năng</b> (cửa ở ô 1, 4, 7; mọi ô bắt đầu 0,1):</p>
          $$\text{ô cửa: } 0{,}1 \cdot 0{,}8 = 0{,}08 \qquad \text{ô tường: } 0{,}1 \cdot 0{,}1 = 0{,}01$$
        focus: [1, 2]
        say: "Bước một, robot thấy cửa, ta nhân niềm tin của từng ô với khả năng của phép đo đó. Ô cửa được 0 phẩy 1 nhân 0 phẩy 8, bằng 0 phẩy 08, còn ô tường được 0 phẩy 1 nhân 0 phẩy 1, bằng 0 phẩy 01."
      - show: |
          <p><b>Bước 2 — chuẩn hoá:</b> tổng $= 3 \cdot 0{,}08 + 7 \cdot 0{,}01 = 0{,}31$.</p>
          $$\text{ô cửa: } \frac{0{,}08}{0{,}31} \approx \hl{0{,}258} \qquad \text{ô tường: } \frac{0{,}01}{0{,}31} \approx 0{,}032$$
        focus: [1, 2]
        say: "Bước hai, chuẩn hoá cho tổng bằng 1, ba ô cửa và bảy ô tường cộng lại được 0 phẩy 31. Chia cho 0 phẩy 31, mỗi ô cửa được khoảng 0 phẩy 258, mỗi ô tường khoảng 0 phẩy 032, tức có ba đỉnh."
      - show: |
          <table class="t"><tr><th>Bước 3 — đi đúng 3 ô</th><th>ô 1 → ô 4</th><th>ô 4 → ô 7</th><th>ô 7 → ô 0 (hành lang vòng)</th></tr>
          <tr><td>niềm tin mang theo</td><td>0,258</td><td>0,258</td><td>0,258</td></tr></table>
        focus: [0, 1, 1]
        say: "Bước ba, robot đi đúng 3 ô nên cả dãy niềm tin dời sang 3 ô, không cần chuẩn hoá lại. Đỉnh ở ô 1 dời tới ô 4, đỉnh ở ô 4 dời tới ô 7. Hành lang là một vòng 10 ô, nên đỉnh ở ô 7 đi tiếp 3 ô thì vòng về ô 0."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 4 — thấy cửa lần 2</th><th>tin trước</th><th>nhân khả năng</th></tr>
          <tr><td>ô 4, ô 7 (đỉnh, là cửa)</td><td>0,258</td><td>$0{,}258 \cdot 0{,}8 \approx 0{,}206$</td></tr>
          <tr><td>ô 0 (đỉnh, là tường)</td><td>0,258</td><td>$0{,}258 \cdot 0{,}1 \approx 0{,}026$</td></tr>
          <tr><td>ô 1 (cửa, tin thấp)</td><td>0,032</td><td>$0{,}032 \cdot 0{,}8 \approx 0{,}026$</td></tr>
          <tr><td>6 ô còn lại (tường)</td><td>0,032</td><td>$0{,}032 \cdot 0{,}1 \approx 0{,}003$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bước bốn, robot thấy cửa lần nữa, ta lại nhân với khả năng đo của từng ô. Ô 4 và ô 7 vừa là đỉnh vừa là cửa, nên được khoảng 0 phẩy 206. Ô 0 là đỉnh nhưng là tường, chỉ còn khoảng 0 phẩy 026. Ô 1 là cửa nhưng tin thấp, cũng chỉ khoảng 0 phẩy 026. Sáu ô còn lại là tường, mỗi ô chỉ khoảng 0 phẩy 003."
      - show: |
          <p><b>Bước 5 — chuẩn hoá</b>: tổng các tích $\approx 0{,}484$.</p>
          $$\text{ô 4, ô 7: } \frac{0{,}206}{0{,}484} \approx \hl{0{,}427} \qquad \text{ô 0, ô 1: } \approx 0{,}053$$
        focus: [1, 2]
        say: "Bước năm, chuẩn hoá lại, tổng tất cả các tích khoảng 0 phẩy 484. Thấy cửa lần nữa, ô 4 và ô 7 mỗi ô 0 phẩy 427, còn ô 0 và ô 1 chỉ 0 phẩy 053."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 6 — tóm tắt</th><th>niềm tin (ô 0 … 9; cửa ở 1, 4, 7)</th></tr>
          <tr><td>ban đầu</td><td>0,1 ở mọi ô</td></tr>
          <tr><td>thấy cửa</td><td>mỗi ô cửa 0,258; mỗi ô tường 0,032 — <b>ba đỉnh</b></td></tr>
          <tr><td>đi đúng 3 ô</td><td>ba đỉnh dời tới ô 4, 7, 0</td></tr>
          <tr><td>thấy cửa lần nữa</td><td>ô 4: $\hl{0{,}427}$; ô 7: $\hl{0{,}427}$; ô 0, 1: 0,053</td></tr></table>
          <p>Đỉnh ở ô 0 bị hạ vì ô 0 là tường. Robot giờ biết mình ở cửa thứ hai hoặc thứ ba; thêm một bước đi nữa sẽ phân định.</p>
        focus: [1, 2, 2]
        say: "Bước sáu, nhìn lại cả chặng trong một bảng. Đỉnh ở ô 0 bị hạ vì ô 0 là tường. Robot giờ biết mình ở cửa thứ hai hoặc thứ ba, và thêm một bước đi nữa sẽ phân định."

  - id: check
    kind: check
    title: "Tự kiểm: đếm thẳng theo từng đường đi"
    checks:
      - "abs(0.8 * 0.8 - 0.64) < 1e-9 and abs(0.8 * 0.1 - 0.08) < 1e-9 and abs(0.1 * 0.8 - 0.08) < 1e-9 and abs(0.1 * 0.1 - 0.01) < 1e-9 and abs(2 * 0.64 + 2 * 0.08 + 6 * 0.01 - 1.5) < 1e-9"
      - "round(0.64 / 1.5, 3) == 0.427 and round(0.08 / 1.5, 3) == 0.053 and round(0.01 / 1.5, 3) == 0.007"
    steps:
      - show: |
          <table class="t"><tr><th>đang ở (xuất phát từ)</th><th>lần đo 1 × lần đo 2</th><th>chia tổng 1,5</th></tr>
          <tr><td>ô 4 (từ ô 1), ô 7 (từ ô 4): cửa rồi cửa</td><td>$0{,}8 \cdot 0{,}8 = 0{,}64$</td><td>$\approx 0{,}427$ ✓</td></tr>
          <tr><td>ô 0 (từ ô 7): cửa rồi tường</td><td>$0{,}8 \cdot 0{,}1 = 0{,}08$</td><td>$\approx 0{,}053$ ✓</td></tr>
          <tr><td>ô 1 (từ ô 8): tường rồi cửa</td><td>$0{,}1 \cdot 0{,}8 = 0{,}08$</td><td>$\approx 0{,}053$ ✓</td></tr>
          <tr><td>6 ô khác: tường rồi tường</td><td>$0{,}1 \cdot 0{,}1 = 0{,}01$</td><td>$\approx 0{,}007$ ✓</td></tr></table>
        focus: [1, 1, "1.2", "1.3", "1.5"]
        say: "Kiểm bằng đường khác, không chuẩn hoá từng lần mà đếm thẳng theo từng đường đi, vì mọi ô bắt đầu bằng nhau. Mỗi ô hiện tại ứng với một ô xuất phát cách nó 3 ô, ta nhân khả năng của hai lần đo dọc đường đó. Ô 4 và ô 7 đi từ cửa tới cửa, được 0 phẩy 8 nhân 0 phẩy 8 bằng 0 phẩy 64, chia tổng 1 phẩy 5 ra 0 phẩy 427. Ô 0 đi từ cửa tới tường, ô 1 đi từ tường tới cửa, cùng được 0 phẩy 08, chia ra 0 phẩy 053. Sáu ô khác được 0 phẩy 01, chia ra 0 phẩy 007, khớp hết với kết quả chuẩn hoá từng bước."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, từ người mới tới người đã đi làm"
    checks:
      - "round(alg.ess([0.2] * 5), 2) == 5.0 and round(alg.ess([0.96, 0.01, 0.01, 0.01, 0.01]), 3) == 1.085"
      - "(lambda b: [round(x, 3) for x in b][:3] == [0.0, 0.333, 0.0] and alg.hist_filter(b, [0.1 if i in (1, 4, 7) else 0.9 for i in range(10)])[0] == 0)(alg.hist_filter([0.1] * 10, [0.8 if i in (1, 4, 7) else 0.0 for i in range(10)]))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tóm niềm tin nhiều đỉnh bằng trung bình <b class="red">(ra chỗ không có cửa)</b>
          <br><span class="note">Trung bình của hai đỉnh ở ô 4 và ô 7 là ô 5,5 — chỗ robot gần như chắc chắn <b>không</b> ở. Báo các đỉnh, hoặc chờ niềm tin hội tụ.</span></div>
        say: "Lỗi thứ nhất, tóm niềm tin nhiều đỉnh bằng trung bình, nên ra một chỗ không có cửa. Trung bình của hai đỉnh ở ô 4 và ô 7 là ô 5 phẩy 5, chỗ mà robot gần như chắc chắn không ở. Hãy báo các đỉnh, hoặc chờ niềm tin hội tụ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Không lấy mẫu lại <b class="red">(một hạt gánh hết)</b>
          <br><span class="note">Sau vài lần đo, trọng số dồn vào một hạt: 5 hạt với trọng số (0,96; 0,01; …) có kích thước mẫu hiệu dụng $\frac{1}{\sum w^2} \approx 1{,}085$ — gần như chỉ còn 1 hạt. Lấy mẫu lại khi giá trị này dưới một nửa số hạt.</span></div>
        say: "Lỗi thứ hai, không lấy mẫu lại, nên một hạt gánh hết. Sau vài lần đo, trọng số dồn vào một hạt. Với 5 hạt có trọng số 0 phẩy 96 và bốn lần 0 phẩy 01, kích thước mẫu hiệu dụng bằng 1 chia tổng bình phương trọng số, khoảng 1 phẩy 085, gần như chỉ còn 1 hạt. Hãy lấy mẫu lại khi giá trị này xuống dưới một nửa số hạt."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lấy mẫu lại quá thường xuyên <b class="red">(mất đa dạng)</b>
          <br><span class="note">Lấy mẫu lại sau mỗi phép đo làm các hạt sao chép nhau, giả thuyết đúng có thể biến mất. Lấy mẫu lại chỉ khi cần, và thêm một ít hạt ngẫu nhiên để phục hồi khi robot bị “bắt cóc” (bị nhấc đi chỗ khác).</span></div>
        say: "Lỗi thứ ba, lấy mẫu lại quá thường xuyên, nên mất đa dạng. Lấy mẫu lại sau mỗi phép đo làm các hạt sao chép nhau, và giả thuyết đúng có thể biến mất. Hãy chỉ lấy mẫu lại khi cần, và thêm một ít hạt ngẫu nhiên để phục hồi khi robot bị nhấc đi chỗ khác."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin cảm biến tuyệt đối: đặt khả năng nhầm bằng 0 <b class="red">(không bao giờ hồi phục)</b>
          <br><span class="note">Người làm nghề luôn để một mức nhầm nhỏ: phép nhân với 0 không đảo ngược được, một lần báo nhầm là xoá vĩnh viễn ô đúng.</span></div>
          <table class="t"><tr><th>khả năng “thấy cửa” trước tường</th><th>sau 1 lần thấy cửa: ô tường</th><th>nếu robot thật ở tường</th></tr>
          <tr><td>0,1 (bài này)</td><td>0,032</td><td>còn hồi phục được</td></tr>
          <tr><td>0 (“cảm biến hoàn hảo”)</td><td>0 — ô cửa mỗi ô 0,333</td><td>mất hẳn, mọi phép nhân sau vẫn ra 0</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tin cảm biến tuyệt đối nên đặt khả năng báo nhầm bằng 0. Người làm nghề luôn để một mức nhầm nhỏ, vì phép nhân với 0 không đảo ngược được. Với mức nhầm 0 phẩy 1 như bài này, sau một lần thấy cửa ô tường vẫn còn 0 phẩy 032, nên nếu robot thật ở tường thì vẫn hồi phục được. Với mức nhầm bằng 0, mọi ô tường về đúng 0, mỗi ô cửa 0 phẩy 333, và một lần báo nhầm là xoá vĩnh viễn ô đúng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
