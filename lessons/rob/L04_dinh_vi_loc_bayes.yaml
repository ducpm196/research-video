scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ba cánh cửa giống hệt nhau"
    checks:
      - "[round(x, 3) for x in alg.hist_filter([0.1] * 10, [0.8 if i in (1, 4, 7) else 0.1 for i in range(10)])][1] == 0.258"
    steps:
      - show: |
          <p>Robot được bật lên ở một chỗ bất kỳ trong hành lang có 3 cánh cửa giống hệt nhau. Nó nhìn thấy một cánh cửa. Nó đang ở cửa nào? Một phép đo chưa đủ — nhưng đi thêm một đoạn rồi nhìn lại, câu trả lời <b>hiện ra</b>.</p>
          <div class="box key">Hôm nay: <b>định vị</b> bằng cách giữ một <b>phân phối niềm tin</b> trên mọi vị trí, cập nhật bằng phép đo và chuyển động.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, robot được bật lên ở một chỗ bất kỳ trong hành lang có 3 cánh cửa giống hệt nhau. Nó nhìn thấy một cánh cửa. Nó đang ở cửa nào? Một phép đo chưa đủ, nhưng đi thêm một đoạn rồi nhìn lại, câu trả lời hiện ra. Hôm nay ta học định vị, bằng cách giữ một phân phối niềm tin trên mọi vị trí, và cập nhật nó bằng phép đo và chuyển động."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chuẩn hoá và công thức Bayes"
    checks:
      - "2 + 1 + 1 == 4 and 2 / 4 == 0.5 and 1 / 4 == 0.25"
      - "abs(0.3 * 0.8 - 0.24) < 1e-9 and abs(0.7 * 0.1 - 0.07) < 1e-9 and round(0.24 / (0.24 + 0.07), 3) == 0.774 and abs(0.24 + 0.07 - 0.31) < 1e-9"
      - "round(30 * 0.8) == 24 and round(70 * 0.1) == 7 and 24 + 7 == 31 and round(24 / 31, 3) == 0.774"
    steps:
      - show: |
          <table class="t"><tr><th>điểm thô</th><th>2</th><th>1</th><th>1</th><th>tổng</th></tr>
          <tr><td>chia cho tổng 4</td><td>0,5</td><td>0,25</td><td>0,25</td><td>1</td></tr></table>
        focus: [0, "1.1", "1.2"]
        say: "Trước hết, ta ôn phép chuẩn hoá, biến các điểm thô thành xác suất có tổng bằng 1. Ba khả năng có điểm thô 2, 1 và 1, tổng là 4. Chia mỗi điểm cho tổng 4 thì được 0 phẩy 5, 0 phẩy 25 và 0 phẩy 25, cộng lại đúng bằng 1."
      - clear: true
        show: |
          <p><b>Công thức Bayes</b>: tin sau = tin trước nhân <b>khả năng</b>, rồi chuẩn hoá. Khả năng = xác suất nhận được đúng phép đo đó nếu robot đang ở chỗ đó.</p>
          <table class="t"><tr><th>vị trí</th><th>tin trước</th><th>khả năng “thấy cửa”</th><th>tích</th></tr>
          <tr><td>trước cửa</td><td>0,3</td><td>0,8</td><td>$0{,}3 \cdot 0{,}8 = 0{,}24$</td></tr>
          <tr><td>trước tường</td><td>0,7</td><td>0,1</td><td>$0{,}7 \cdot 0{,}1 = 0{,}07$</td></tr></table>
          <p>Tin sau “đang trước cửa” $= \frac{0{,}24}{0{,}24 + 0{,}07} = \frac{0{,}24}{0{,}31} \approx \hl{0{,}774}$.</p>
          <p class="note">Vì sao: tưởng tượng 100 robot, 30 trước cửa, 70 trước tường. Thấy cửa: $30 \cdot 0{,}8 = 24$ robot trước cửa báo đúng, $70 \cdot 0{,}1 = 7$ robot trước tường báo nhầm. Trong 31 robot báo “thấy cửa”, 24 thật sự trước cửa: $\frac{24}{31} \approx 0{,}774$.</p>
        introduces: [cdot]
        focus: [1, 1, "2.2", "2.3", 3, 4, 4, 4, 4]
        say: "Điều thứ hai, ta cần hiểu công thức Bayes, tin sau bằng tin trước nhân khả năng, rồi chuẩn hoá. Khả năng ở đây là xác suất nhận được đúng phép đo đó nếu robot đang ở chỗ đó. Trước cửa có tin trước 0 phẩy 3, khả năng thấy cửa 0 phẩy 8, tích là 0 phẩy 24. Trước tường có tin trước 0 phẩy 7, khả năng thấy cửa nhầm là 0 phẩy 1, tích là 0 phẩy 07. Chuẩn hoá, tin rằng đang trước cửa bằng 0 phẩy 24 chia 0 phẩy 31, khoảng 0 phẩy 774. Vì sao lại nhân rồi chia như vậy? Tưởng tượng có 100 robot, 30 con đứng trước cửa và 70 con đứng trước tường. Khi thấy cửa, 30 nhân 0 phẩy 8 bằng 24 con trước cửa báo đúng, còn 70 nhân 0 phẩy 1 bằng 7 con trước tường báo nhầm. Trong 31 con cùng báo thấy cửa, có 24 con thật sự đứng trước cửa, nên tỉ lệ là 24 chia 31, đúng bằng 0 phẩy 774."

  - id: sym
    kind: symbol
    title: "Giải mã: hai bước của bộ lọc Bayes"
    checks:
      - "abs(0.25 * 0.8 - 0.2) < 1e-12 and abs(0.25 * 0.1 - 0.025) < 1e-12 and abs(2 * 0.2 + 2 * 0.025 - 0.45) < 1e-12 and round(0.2 / 0.45, 3) == 0.444 and round(0.025 / 0.45, 3) == 0.056"
      - "round(alg.ess([0.2, 0.025, 0.2, 0.025]), 2) == 2.49 and round(alg.ess([0.25] * 4), 6) == 4 and round(alg.ess([1, 0, 0, 0]), 6) == 1"
    steps:
      - show: |
          <p><b>Niềm tin</b> $b(i)$: xác suất robot đang ở ô $i$; tổng mọi ô bằng 1.</p>
          <table class="t"><tr><th>bước</th><th>công thức</th><th>tác dụng</th></tr>
          <tr><td><b>đo</b></td><td>$b(i) \leftarrow \frac{p(z \mid i) \, b(i)}{\sum_j p(z \mid j) \, b(j)}$</td><td>ô khớp phép đo được tăng — làm <b>nhọn</b></td></tr>
          <tr><td><b>chuyển động</b></td><td>dời niềm tin theo lệnh đi (có nhiễu thì trải ra ô bên cạnh)</td><td>làm <b>phẳng</b>, vì chuyển động không chắc chắn</td></tr></table>
          <p><b>Bộ lọc hạt</b>: thay vì lưu mọi ô, giữ $N$ “hạt” (giả thuyết vị trí) có trọng số; đi thì dời mỗi hạt theo lệnh, cộng một chút nhiễu ngẫu nhiên; đo thì nhân trọng số với $p(z \mid \text{hạt})$; định kỳ <b>lấy mẫu lại</b> theo trọng số.</p>
        introduces: [assign]
        focus: [1, 2, "2.2", "2.3", 3, 3, 3]
        say: "Niềm tin b của i là xác suất robot đang ở ô i, và tổng mọi ô bằng 1. Bảng cho hai bước. Bước đo nhân niềm tin với khả năng của phép đo ở từng ô rồi chuẩn hoá, nên ô khớp phép đo được tăng và niềm tin trở nên nhọn. Bước chuyển động dời niềm tin theo lệnh đi, có nhiễu thì trải ra ô bên cạnh, nên niềm tin phẳng hơn vì chuyển động không chắc chắn. Bộ lọc hạt thay vì lưu mọi ô thì giữ N hạt, mỗi hạt là một giả thuyết vị trí có trọng số. Khi đi thì dời mỗi hạt theo lệnh, cộng thêm một chút nhiễu ngẫu nhiên. Khi đo thì nhân trọng số với khả năng phép đo, và định kỳ lấy mẫu lại theo trọng số."
      - clear: true
        show: |
          <p><b>Bộ lọc hạt</b>, ví dụ: 4 hạt ở ô 1, 2, 4, 5, mỗi hạt trọng số 0,25; robot thấy cửa.</p>
          <table class="t"><tr><th>hạt ở</th><th>nhân khả năng</th><th>chuẩn hoá (chia tổng 0,45)</th></tr>
          <tr><td>ô 1, ô 4 (cửa)</td><td>$0{,}25 \cdot 0{,}8 = 0{,}2$</td><td>$\approx 0{,}444$</td></tr>
          <tr><td>ô 2, ô 5 (tường)</td><td>$0{,}25 \cdot 0{,}1 = 0{,}025$</td><td>$\approx 0{,}056$</td></tr></table>
          <p><b>Kích thước mẫu hiệu dụng</b> $\frac{1}{\sum w^2}$: trọng số đều thì bằng số hạt, dồn hết vào một hạt thì bằng 1. Ở đây $\frac{1}{2 \cdot 0{,}444^2 + 2 \cdot 0{,}056^2} \approx 2{,}49$.</p>
          <p><b>Lấy mẫu lại</b>: rút 4 hạt mới, mỗi lần chọn một hạt cũ với xác suất bằng trọng số của nó — hạt trước cửa được chép nhiều lần, hạt trước tường dễ biến mất — rồi đặt mọi trọng số về $\frac{1}{4}$.</p>
        focus: [1, "2.2", "2.3", 3, 3, 4, 4]
        say: "Xem bộ lọc hạt làm việc với 4 hạt ở ô 1, 2, 4 và 5, mỗi hạt trọng số 0 phẩy 25, khi robot thấy cửa. Hạt ở ô 1 và ô 4 đứng trước cửa, nhân 0 phẩy 8 được 0 phẩy 2, chuẩn hoá còn khoảng 0 phẩy 444. Hạt ở ô 2 và ô 5 đứng trước tường, nhân 0 phẩy 1 được 0 phẩy 025, chuẩn hoá còn khoảng 0 phẩy 056. Kích thước mẫu hiệu dụng bằng 1 chia tổng bình phương các trọng số, trọng số đều thì bằng số hạt, dồn hết vào một hạt thì bằng 1. Ở đây nó khoảng 2 phẩy 49, tức 4 hạt mà chỉ hiệu quả như gần 2 phẩy 5 hạt. Lấy mẫu lại là rút 4 hạt mới, mỗi lần chọn một hạt cũ với xác suất bằng trọng số của nó. Hạt trước cửa được chép nhiều lần, hạt trước tường dễ biến mất, rồi mọi trọng số đặt lại bằng 1 phần 4."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
