# Quy ước: hành lang vòng 10 ô, cửa ở ô 1, 4, 7 (đếm từ 0). Cảm biến “thấy cửa”: đúng 0,8 khi trước cửa, nhầm 0,1 khi trước tường; “không thấy cửa”:
#   0,2 trước cửa, 0,9 trước tường. Chuyển động “đi 3 ô”: đúng 3 ô (p_exact = 1) ở ví dụ chính. alg.hist_filter(niềm tin, khả năng đo, move, p_exact).
#   Kích thước mẫu hiệu dụng của bộ lọc hạt: 1 / Σ w² (alg.ess). Tên Monte Carlo chỉ trên màn hình (probe AIF p1).
objectives:
  - "Cập nhật niềm tin theo phép đo và chuyển động"
  - "Thấy niềm tin nhiều đỉnh và cách nó hội tụ"
  - "Giải thích lấy mẫu lại và kích thước mẫu hiệu dụng"
