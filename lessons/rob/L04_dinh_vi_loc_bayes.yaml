      - "[round(x, 3) for x in alg.hist_filter([0.1] * 10, [0.8 if i in (1, 4, 7) else 0.1 for i in range(10)])][1] == 0.258"
      - "(lambda D: [round(x, 3) for x in alg.hist_filter(alg.hist_filter([0.1] * 10, D), D, move=3)][4])([0.8 if i in (1, 4, 7) else 0.1 for i in range(10)]) == 0.427"
    steps:
