source: "curriculum/rob.yaml L06; audit/rob/verify_rob.py L06; H. Moravec, A. Elfes, High Resolution Maps from Wide Angle Sonar (1985); S. Thrun, W. Burgard, D. Fox, Probabilistic Robotics (2005), chương 9; bài 4 (bộ lọc Bayes)"
assumes: [arith, frac, log, exp, approx, cdot, prob]
# Quy ước: log-odds l = ln(p / (1 − p)) (alg.logodds). Mỗi ô độc lập; mỗi lần đo “bị chiếm” cộng ln(0,7/0,3), “trống” cộng ln(0,4/0,6), từ ô ban đầu
#   p = 0,5 (l = 0) — mô hình 0,7 / 0,4 là SỐ MINH HOẠ. alg.occ_update, alg.occ_sequence (có chặn |l| ≤ 3,5 tuỳ chọn). Tên log-odds chỉ trên màn hình;
#   lời đọc “lôgarit tỉ số khả năng”.
objectives:
  - "Cập nhật xác suất ô bị chiếm bằng log-odds"
  - "Giải thích vì sao cộng thay cho nhân"
  - "Biết vì sao phải chặn giá trị"
