scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ba lần thấy vật cản — chắc chắn bao nhiêu?"
    checks:
      - "round(alg.occ_update(0.5, 0.7, 3), 3) == 0.927"
    steps:
      - show: |
          <p>Robot quét một ô trên sàn ba lần, cả ba lần cảm biến báo “có vật cản” — mỗi lần chỉ đúng 70%. Sau ba lần, robot nên tin ô đó bị chiếm bao nhiêu? Và nếu sau đó có người dời vật đi, bản đồ có tự sửa không?</p>
          <div class="box key">Hôm nay: <b>bản đồ lưới chiếm chỗ</b> — mỗi ô một xác suất, cập nhật bằng phép <b>cộng</b> trên thang log-odds.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, robot quét một ô trên sàn ba lần, cả ba lần cảm biến báo có vật cản, và mỗi lần chỉ đúng 70 phần trăm. Sau ba lần, robot nên tin ô đó bị chiếm bao nhiêu? Và nếu sau đó có người dời vật đi, bản đồ có tự sửa không? Hôm nay ta học bản đồ lưới chiếm chỗ, mỗi ô một xác suất, cập nhật bằng phép cộng trên thang lôgarit tỉ số khả năng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: tỉ số khả năng và lôgarit biến nhân thành cộng"
    checks:
      - "round(0.7 / 0.3, 3) == 2.333 and 0.5 / 0.5 == 1 and round(12.7 / 13.7, 3) == 0.927"
      - "round(math.e, 3) == 2.718 and round(math.exp(0.847), 3) == 2.333 and abs(math.log(2.333 * 2.333) - 2 * math.log(2.333)) < 1e-12"
      - "round(math.log(7 / 3), 3) == 0.847 and round(3 * math.log(7 / 3), 3) == 2.542 and abs(math.log((7 / 3) ** 3) - 3 * math.log(7 / 3)) < 1e-12 and round((7 / 3) ** 3, 1) == 12.7 and math.log(1) == 0"
    steps:
      - show: |
          <table class="t"><tr><th>xác suất $p$</th><th>tỉ số $\frac{p}{1 - p}$</th><th>đọc là</th></tr>
          <tr><td>0,5</td><td>$\frac{0{,}5}{0{,}5} = 1$</td><td>ngang nhau</td></tr>
          <tr><td>0,7</td><td>$\frac{0{,}7}{0{,}3} \approx 2{,}333$</td><td>7 phần có, 3 phần không</td></tr>
          <tr><td>ngược lại: tỉ số 12,7</td><td>$p = \frac{12{,}7}{1 + 12{,}7} \approx 0{,}927$</td><td></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước hết, ta ôn tỉ số khả năng, tức xác suất có chia cho xác suất không. Xác suất 0 phẩy 5 cho tỉ số 0 phẩy 5 chia 0 phẩy 5, bằng 1, nghĩa là ngang nhau. Xác suất 0 phẩy 7 cho tỉ số 0 phẩy 7 chia 0 phẩy 3, khoảng 2 phẩy 333, tức 7 phần có và 3 phần không. Đổi ngược, tỉ số 12 phẩy 7 ứng với xác suất 12 phẩy 7 chia 13 phẩy 7, khoảng 0 phẩy 927."
      - show: |
          <p><b>Lôgarit tự nhiên</b> $\ln a$ là số mũ $x$ sao cho $e^x = a$, với $e \approx 2{,}718$; ví dụ $e^{0{,}847} \approx 2{,}333$ nên $\ln 2{,}333 \approx 0{,}847$. Vì nhân hai lũy thừa của $e$ là cộng số mũ, lôgarit biến phép nhân thành phép cộng: $\ln(a \cdot b) = \ln a + \ln b$, và $\ln 1 = 0$.</p>
          $$\ln 2{,}333 \approx 0{,}847 \qquad \ln(2{,}333^3) = 3 \cdot 0{,}847 \approx 2{,}542 \qquad 2{,}333^3 \approx 12{,}7$$
        introduces: [power]
        focus: [1, 1, 1, 2, 2]
        say: "Điều thứ hai, lôgarit tự nhiên của a là số mũ x sao cho e mũ x bằng a, với e là hằng số khoảng 2 phẩy 718. Ví dụ e mũ 0 phẩy 847 khoảng 2 phẩy 333, nên lôgarit của 2 phẩy 333 khoảng 0 phẩy 847. Vì nhân hai lũy thừa của e là cộng số mũ, lôgarit biến phép nhân thành phép cộng, lôgarit của a nhân b bằng lôgarit a cộng lôgarit b, và lôgarit của 1 bằng 0. Làm thử, lôgarit của 2 phẩy 333 khoảng 0 phẩy 847. Nhân 2 phẩy 333 với chính nó ba lần được khoảng 12 phẩy 7, còn trên thang lôgarit chỉ cần cộng ba lần 0 phẩy 847, được 2 phẩy 542."

  - id: sym
    kind: symbol
    title: "Giải mã: lưới, log-odds, cập nhật bằng cộng"
    steps:
      - show: |
          <p><b>Bản đồ lưới chiếm chỗ</b>: chia sàn thành ô vuông (ví dụ 5 cm); mỗi ô giữ $p$ = xác suất bị chiếm. Không biết gì: $p = 0{,}5$.</p>
          <p><b>Log-odds</b>: $l = \ln \frac{p}{1 - p}$; đổi ngược $p = \frac{1}{1 + e^{-l}}$. $p = 0{,}5$ ứng với $l = 0$; $p$ càng gần 1 thì $l$ càng lớn không giới hạn.</p>
          <p><b>Cập nhật</b> (Bayes cho từng ô, đo độc lập; Thrun, Burgard, Fox 2005, chương 9): $l \leftarrow l + \ln\frac{q}{1 - q}$, với $q$ = xác suất ô bị chiếm mà <b>riêng</b> phép đo này cho biết khi trước đó chưa biết gì: tia dừng ở ô → $q = 0{,}7$; tia đi qua ô → $q = 0{,}4$. Nhân xác suất thành <b>cộng</b> số, nhanh và không tràn số.</p>
        introduces: [assign]
        focus: [1, 1, 2, 2, 3, 3, 3, 3]
        say: "Bản đồ lưới chiếm chỗ chia sàn thành các ô vuông, ví dụ 5 xen-ti-mét, và mỗi ô giữ p là xác suất bị chiếm. Khi chưa biết gì thì p bằng 0 phẩy 5. Lôgarit tỉ số khả năng l bằng lôgarit tự nhiên của p chia 1 trừ p, và đổi ngược thì p bằng 1 chia 1 cộng e mũ âm l. p bằng 0 phẩy 5 ứng với l bằng 0, còn p càng gần 1 thì l càng lớn không giới hạn. Định lý Bayes, như ở bài 4, nói tin sau tỉ lệ với tin trước nhân khả năng của phép đo, và trên thang lôgarit phép nhân đó thành phép cộng. Mỗi lần đo, ta cộng vào l lôgarit tỉ số khả năng của q, với q là xác suất ô bị chiếm mà riêng phép đo này cho biết khi trước đó chưa biết gì. Tia dừng ở ô cho q bằng 0 phẩy 7, còn tia đi qua ô cho q bằng 0 phẩy 4. Như vậy phép nhân xác suất thành phép cộng số, nhanh và không tràn số."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một tia quét sửa cả dãy ô; chặn giá trị để bản đồ còn quên"
    checks:
      - "round(alg.logodds(0.4), 3) == -0.405 and round(alg.logodds(0.7), 3) == 0.847"
      - "round(20 * alg.logodds(0.7), 1) == 16.9 and round(20 * alg.logodds(0.7) + 6 * alg.logodds(0.4), 1) == 14.5 and round(3.5 + 6 * alg.logodds(0.4), 2) == 1.07 and round(alg.occ_sequence(0.5, 0.7, 0.4, 'h' * 20 + 'm' * 6, 3.5), 3) == 0.744"
