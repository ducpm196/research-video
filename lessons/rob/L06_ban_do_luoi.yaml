        focus: [1, 1, 1]
        say: "Hình vẽ một tia đo khoảng cách bắn từ robot qua một dãy ô và dừng ở vật cản. Mỗi ô tia đi qua được cộng âm 0 phẩy 405 vì tia nói ô đó trống, ô tia dừng được cộng 0 phẩy 847 vì ô đó bị chiếm. Các ô sau vật cản giữ nguyên, vì tia không tới được nên không biết gì về chúng."
