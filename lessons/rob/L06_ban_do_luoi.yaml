        focus: [1, 1, 1, 1]
        say: "Hình này theo dõi l của một ô có chiếc ghế đứng yên qua 20 lần quét, rồi ghế bị dời đi và có 6 lần quét trống. Đường đỏ không chặn leo lên khoảng 16 phẩy 9, sáu lần trống chỉ kéo xuống khoảng 14 phẩy 5, xác suất vẫn gần bằng 1. Đường xanh bị chặn ở 3 phẩy 5 nên chỉ cần sáu lần trống là xuống khoảng 1 phẩy 07, tức xác suất 0 phẩy 744. Bản đồ có chặn biết quên, còn bản đồ không chặn thì gần như đóng băng."

  - id: example
    kind: example
    title: "Ba lần “chiếm”, rồi hai lần “trống”"
    checks:
      - "round(alg.logodds(0.7), 3) == 0.847 and round(3 * alg.logodds(0.7), 3) == 2.542 and round(alg.occ_update(0.5, 0.7, 3), 3) == 0.927"
      - "round(alg.logodds(0.4), 3) == -0.405 and round(alg.occ_update(0.5, 0.7, 3, 2), 3) == 0.85 and round(0.7 ** 3 / (0.7 ** 3 + 0.3 ** 3), 3) == 0.927"
      - "round(math.exp(-2.542), 4) == 0.0787 and round(1 / (1 + math.exp(-3 * alg.logodds(0.7))), 3) == 0.927 and round(2 * alg.logodds(0.4), 3) == -0.811 and round(3 * alg.logodds(0.7) + 2 * alg.logodds(0.4), 3) == 1.731"
    steps:
      - show: |
          <p><b>Bước 1 — một lần “chiếm”</b>: ô bắt đầu $p = 0{,}5$, tức $l = 0$; cộng $\ln\frac{0{,}7}{0{,}3}$.</p>
          $$l = 0 + 0{,}847 = 0{,}847 \quad\text{ứng với}\quad p = 0{,}7$$
        focus: [1, 2]
        say: "Bước một, ô bắt đầu với xác suất 0 phẩy 5, tức l bằng 0, rồi nhận một lần đo chiếm. Sau 1 lần đo chiếm, l cộng 0 phẩy 847, p bằng 0 phẩy 7."
      - show: |
          <p><b>Bước 2 — ba lần “chiếm”</b>: cộng ba lần cùng một số.</p>
          $$l = 3 \cdot 0{,}847 = 2{,}542$$
        focus: [1, 2]
        say: "Bước hai, ba lần đo chiếm là cộng ba lần cùng một số. Sau 3 lần, l bằng 3 nhân 0 phẩy 847, bằng 2 phẩy 542, và p khoảng 0 phẩy 927."
      - show: |
          <p><b>Bước 3 — đổi ngược về xác suất</b>: $e^{-2{,}542} \approx 0{,}0787$.</p>
          $$p = \frac{1}{1 + e^{-2{,}542}} = \frac{1}{1{,}0787} \approx \hl{0{,}927}$$
        focus: [1, 2]
        say: "Bước ba, đổi ngược về xác suất, e mũ âm 2 phẩy 542 khoảng 0 phẩy 0787. Vậy p bằng 1 chia 1 phẩy 0787, khoảng 0 phẩy 927."
      - clear: true
        show: |
          <p><b>Bước 4 — thêm hai lần “trống”</b>: mỗi lần cộng $\ln\frac{0{,}4}{0{,}6} \approx -0{,}405$.</p>
          $$l = 2{,}542 - 0{,}811 = 1{,}731 \quad\Rightarrow\quad p = \frac{1}{1 + e^{-1{,}731}} \approx 0{,}850$$
        introduces: [implies]
        focus: [1, 2]
        say: "Bước bốn, thêm hai lần đo trống, mỗi lần cộng lôgarit của 0 phẩy 4 chia 0 phẩy 6, tức trừ khoảng 0 phẩy 405. Thêm 2 lần đo trống, mỗi lần trừ 0 phẩy 405, thì l còn 1 phẩy 731 và p khoảng 0 phẩy 85."
      - show: |
          <table class="t"><tr><th>Bước 5 — tóm tắt</th><th>$l$</th><th>$p$</th></tr>
          <tr><td>ban đầu</td><td>0</td><td>0,5</td></tr>
          <tr><td>1 lần “chiếm” (+0,847)</td><td>0,847</td><td>0,7</td></tr>
          <tr><td>3 lần “chiếm”</td><td>$3 \cdot 0{,}847 = 2{,}542$</td><td>$\hl{0{,}927}$</td></tr>
          <tr><td>thêm 2 lần “trống” (mỗi lần −0,405)</td><td>1,731</td><td>0,850</td></tr></table>
          <p>Kiểm bằng Bayes trực tiếp: $\frac{0{,}7^3}{0{,}7^3 + 0{,}3^3} \approx 0{,}927$ — đúng như cộng log-odds.</p>
        focus: [1, 2]
        say: "Bước năm, gom cả bốn bước vào một bảng để nhìn lại. Kiểm bằng định lý Bayes trực tiếp, 0 phẩy 7 mũ 3 chia cho 0 phẩy 7 mũ 3 cộng 0 phẩy 3 mũ 3, cũng xấp xỉ 0 phẩy 927, đúng như cộng."

  - id: check
    kind: check
    title: "Tự kiểm: nhân thẳng tỉ số khả năng, không dùng lôgarit"
    checks:
      - "round((7 / 3) ** 3, 2) == 12.7 and round((7 / 3) ** 3 / (1 + (7 / 3) ** 3), 3) == 0.927 and round((4 / 6) ** 2, 3) == 0.444"
      - "round((7 / 3) ** 3 * (4 / 6) ** 2, 2) == 5.65 and round((7 / 3) ** 3 * (4 / 6) ** 2 / (1 + (7 / 3) ** 3 * (4 / 6) ** 2), 3) == 0.85"
    steps:
      - show: |
          <table class="t"><tr><th>nhân thẳng tỉ số</th><th>tỉ số</th><th>$p = \frac{\text{tỉ số}}{1 + \text{tỉ số}}$</th></tr>
          <tr><td>ban đầu</td><td>1</td><td>0,5</td></tr>
          <tr><td>3 lần “chiếm”: nhân $\left(\frac{7}{3}\right)^3$</td><td>$\approx 12{,}70$</td><td>$\approx 0{,}927$ ✓</td></tr>
          <tr><td>2 lần “trống”: nhân $\left(\frac{4}{6}\right)^2 \approx 0{,}444$</td><td>$\approx 5{,}65$</td><td>$\approx 0{,}850$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, bỏ lôgarit đi và nhân thẳng tỉ số khả năng, vì cộng lôgarit chính là nhân các tỉ số. Ban đầu tỉ số bằng 1, tức xác suất 0 phẩy 5. Ba lần chiếm nhân 7 phần 3 ba lần, được khoảng 12 phẩy 70, đổi ra xác suất khoảng 0 phẩy 927. Hai lần trống nhân thêm 4 phần 6 bình phương, khoảng 0 phẩy 444, được tỉ số 5 phẩy 65 và xác suất 0 phẩy 850, khớp cả hai."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, từ người mới tới người đã đi làm"
    checks:
      - "round(alg.occ_sequence(0.5, 0.7, 0.4, 'h' * 20 + 'm' * 6), 6) == 1.0 and round(alg.occ_sequence(0.5, 0.7, 0.4, 'h' * 20 + 'm' * 6, 3.5), 3) == 0.744"
      - "alg.occ_sequence(0.5, 0.7, 0.4, 'h' * 20 + 'm' * 41) > 0.5 > alg.occ_sequence(0.5, 0.7, 0.4, 'h' * 20 + 'm' * 42)"
      - "round(100 / 0.05) == 2000 and 2000 * 2000 == 4_000_000 and round(100 / 0.02) == 5000 and 5000 * 5000 == 25_000_000 and round(10 / 0.05) == 200 and round(10 / 0.02) == 500 and 500 / 200 == 2.5 and (5 / 2.5) ** 2 == 4"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Không chặn log-odds <b class="red">(bản đồ sửa rất chậm)</b>
          <br><span class="note">Một chiếc ghế đứng yên 20 lần quét: $l \approx 16{,}9$. Người dời ghế đi, 6 lần quét “trống” chỉ trừ 2,4 — xác suất vẫn ≈ 1; phải 42 lần “trống” mới về dưới 0,5. Chặn $|l| \leq 3{,}5$ ($p \leq 0{,}971$): sau 6 lần “trống” đã còn 0,744.</span></div>
        say: "Lỗi thứ nhất, không chặn giá trị, nên bản đồ sửa rất chậm. Một chiếc ghế đứng yên qua 20 lần quét làm l lên khoảng 16 phẩy 9. Người dời ghế đi, 6 lần quét trống chỉ trừ 2 phẩy 4, nên xác suất vẫn gần bằng 1, và phải 42 lần quét trống mới về dưới 0 phẩy 5. Nếu chặn trị tuyệt đối của l không quá 3 phẩy 5, tức p không quá 0 phẩy 971, thì sau 6 lần quét trống xác suất đã còn 0 phẩy 744."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đo lặp khi robot đứng yên <b class="red">(tự tin quá mức)</b>
          <br><span class="note">Cập nhật giả định các lần đo độc lập. Robot đứng yên quét 100 lần cùng một điểm, sai thì sai cả 100 — chỉ cập nhật khi robot đã di chuyển đủ xa.</span></div>
        say: "Lỗi thứ hai, đo lặp khi robot đứng yên, nên tự tin quá mức. Cách cập nhật giả định các lần đo độc lập. Robot đứng yên quét 100 lần cùng một điểm thì sai là sai cả 100 lần, nên chỉ cập nhật khi robot đã di chuyển đủ xa."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên cập nhật các ô tia đi <b class="red">qua</b> <b class="red">(chỉ biết chỗ chiếm)</b>
          <br><span class="note">Tia đo khoảng cách 3 m không chỉ nói “ô ở 3 m bị chiếm” mà còn nói “mọi ô trước đó trống”. Bỏ phần này thì vật đã đi khỏi không bao giờ được xoá.</span></div>
        say: "Lỗi thứ ba, quên cập nhật các ô mà tia đi qua, nên chỉ biết chỗ bị chiếm. Một tia đo khoảng cách 3 mét không chỉ nói ô ở 3 mét bị chiếm, mà còn nói mọi ô trước đó trống. Bỏ phần này thì vật đã đi khỏi không bao giờ được xoá."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Chọn ô thật nhỏ “cho chính xác” mà không tính chi phí <b class="red">(bộ nhớ, thời gian)</b>
          <br><span class="note">Người làm nghề chọn cỡ ô theo kích thước robot và sai số cảm biến, rồi mới tính bộ nhớ: ô nhỏ đi một nửa thì số ô gấp 4, mỗi tia đi qua gấp đôi số ô.</span></div>
          <table class="t"><tr><th>kho 100 m × 100 m</th><th>số ô</th><th>bộ nhớ (1 byte mỗi ô)</th><th>ô trên một tia 10 m</th></tr>
          <tr><td>ô 5 cm</td><td>$2000 \cdot 2000 = 4$ triệu</td><td>4 MB</td><td>200</td></tr>
          <tr><td>ô 2 cm</td><td>$5000 \cdot 5000 = 25$ triệu</td><td>25 MB</td><td>500</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, chọn ô thật nhỏ cho chính xác mà không tính chi phí bộ nhớ và thời gian. Người làm nghề chọn cỡ ô theo kích thước robot và sai số cảm biến, rồi mới tính bộ nhớ, vì ô nhỏ đi một nửa thì số ô gấp 4. Bảng lấy một kho 100 mét nhân 100 mét, mỗi ô giữ 1 byte. Ô 5 xen-ti-mét cho 4 triệu ô, tức 4 triệu byte, và một tia 10 mét đi qua 200 ô. Ô 2 xen-ti-mét cho 25 triệu ô, tức 25 triệu byte, và mỗi tia đi qua 500 ô, tức mỗi lần quét chậm hơn 2 phẩy 5 lần."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.occ_update(0.5, 0.7, 5), 3) == 0.986 and round(alg.occ_update(0.5, 0.7, 1, 1), 3) == 0.609"
      - "round(5 * alg.logodds(0.7), 3) == 4.236 and round(math.exp(-4.236), 4) == 0.0145 and round(1 / 1.0145, 3) == 0.986 and round(math.exp(-0.442), 3) == 0.643 and round(1 / 1.643, 3) == 0.609"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ô ban đầu 0,5; năm lần đo “chiếm” (mô hình 0,7). Xác suất cuối?</td></tr>
          <tr><td>2</td><td>Một lần “chiếm” rồi một lần “trống” (mô hình 0,4): xác suất cuối? Vì sao không quay về 0,5?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ô ban đầu 0 phẩy 5, có năm lần đo chiếm với mô hình 0 phẩy 7, xác suất cuối là bao nhiêu? Câu hai, một lần đo chiếm rồi một lần đo trống với mô hình 0 phẩy 4, xác suất cuối là bao nhiêu? Vì sao không quay về 0 phẩy 5? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Cộng năm lần, rồi đổi ngược: $e^{-4{,}236} \approx 0{,}0145$.</p>
          $$l = 5 \cdot 0{,}847 \approx 4{,}236 \quad\Rightarrow\quad p = \frac{1}{1 + 0{,}0145} \approx \hl{0{,}986}$$
        focus: [1, 2]
        say: "Đáp án câu một, cộng năm lần cùng một số rồi đổi ngược, e mũ âm 4 phẩy 236 khoảng 0 phẩy 0145. Đáp án câu một, l bằng 5 nhân 0 phẩy 847, khoảng 4 phẩy 236, nên p khoảng 0 phẩy 986."
      - show: |
          <p>② Một số dương, một số âm: $e^{-0{,}442} \approx 0{,}643$.</p>
          $$l = 0{,}847 - 0{,}405 = 0{,}442 \quad\Rightarrow\quad p = \frac{1}{1{,}643} \approx \hl{0{,}609}$$
          <p>Không về 0,5 vì “chiếm” với độ tin 0,7 (cộng 0,847) là bằng chứng <b>mạnh hơn</b> “trống” với 0,4 (trừ 0,405).</p>
        focus: [1, 2, 3]
        say: "Câu hai, một lần cộng số dương và một lần cộng số âm, e mũ âm 0 phẩy 442 khoảng 0 phẩy 643. Câu hai, l bằng 0 phẩy 847 trừ 0 phẩy 405, bằng 0 phẩy 442, nên p khoảng 0 phẩy 609. Nó không về 0 phẩy 5 vì phép đo chiếm với độ tin 0 phẩy 7 là bằng chứng mạnh hơn phép đo trống với 0 phẩy 4."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mỗi ô một xác suất</span><span class="a">→</span>
          <span class="n">log-odds: nhân thành cộng</span><span class="a">→</span>
          <span class="n">cập nhật cả ô chiếm lẫn ô tia đi qua</span><span class="a">→</span>
          <span class="n">chặn giá trị để bản đồ còn sửa được</span></div>
        say: "Tổng kết lại, mỗi ô giữ một xác suất, và thang lôgarit tỉ số khả năng biến phép nhân thành phép cộng. Cập nhật cả ô bị chiếm lẫn các ô tia đi qua, và chặn giá trị để bản đồ còn sửa được."
      - show: |
          <div class="box key"><b>Tư duy:</b> một bản đồ tốt phải có khả năng <b>quên</b> — thế giới thay đổi, niềm tin không được đóng băng.</div>
        say: "Điều cần mang theo, một bản đồ tốt phải có khả năng quên, vì thế giới thay đổi và niềm tin không được đóng băng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>định vị và lập bản đồ đồng thời</b> — đồ thị tư thế và đóng vòng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học định vị và lập bản đồ đồng thời, với đồ thị tư thế và đóng vòng. Hẹn gặp bạn ở bài tiếp theo."
