scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai bánh, hai tốc độ, một đường tròn"
    checks:
      - "(lambda p: abs(p[0]) < 0.01 and abs(p[1]) < 0.01)(alg.diff_drive_path(0.5, 0.4, 0.01, round(2 * math.pi / 0.4 / 0.01)))"
    steps:
      - show: |
          <p>Robot hút bụi chỉ có hai bánh, mỗi bánh một động cơ. Không có vô lăng. Muốn rẽ, nó cho hai bánh quay <b>khác tốc độ</b>. Cho bánh trái 0,4 m/s, bánh phải 0,6 m/s và giữ nguyên: robot đi đúng một <b>đường tròn</b> rồi quay về chỗ cũ.</p>
          <div class="box key">Hôm nay: <b>mô hình chuyển động</b> của xe hai bánh vi sai — từ tốc độ hai bánh ra vận tốc, vận tốc góc, bán kính quay.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, robot hút bụi chỉ có hai bánh, mỗi bánh một động cơ, và không có vô lăng. Muốn rẽ, nó cho hai bánh quay khác tốc độ. Cho bánh trái 0 phẩy 4 mét mỗi giây, bánh phải 0 phẩy 6 mét mỗi giây và giữ nguyên, robot đi đúng một đường tròn rồi quay về chỗ cũ. Hôm nay ta học mô hình chuyển động của xe hai bánh vi sai, từ tốc độ hai bánh ra vận tốc, vận tốc góc và bán kính quay."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ra-đi-an, cung tròn, bước Euler và hướng đi"
    checks:
      - "round(2 * math.pi, 2) == 6.28 and round(math.degrees(1), 1) == 57.3 and 2 * 0.5 == 1.0"
      - "(lambda q: [round(c, 6) for c in q] == [0.005, 0.0, 0.0])(alg.diff_drive_step((0.0, 0.0, 0.0), 0.5, 0.0, 0.01)) and math.cos(0) == 1 and math.sin(0) == 0"
      - "0.5 * math.cos(0) == 0.5 and 0.5 * math.sin(0) == 0 and abs(0.5 * math.cos(math.pi / 2)) < 1e-12 and 0.5 * math.sin(math.pi / 2) == 0.5 and round(math.pi / 2, 3) == 1.571"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần nhớ</th><th>ví dụ số</th></tr>
          <tr><td>một vòng tròn = $360^\circ$ = $2\pi$ ra-đi-an</td><td>$2\pi \approx 6{,}28$; 1 ra-đi-an $\approx 57{,}3^\circ$</td></tr>
          <tr><td>quãng cung = bán kính nhân góc (ra-đi-an)</td><td>bán kính 2 m, góc 0,5 ra-đi-an → cung $2 \cdot 0{,}5 = 1$ m</td></tr></table>
        introduces: [pi, deg]
        focus: [0, "1.2", "1.3"]
        say: "Trước hết, ta ôn hai điều về góc mà cả bài sẽ dùng tới. Một vòng tròn là 360 độ, cũng là 2 pi ra-đi-an, khoảng 6 phẩy 28, nên 1 ra-đi-an xấp xỉ 57 phẩy 3 độ. Đi trên đường tròn thì quãng cung bằng bán kính nhân góc tính bằng ra-đi-an, bán kính 2 mét quay 0 phẩy 5 ra-đi-an thì đi được 1 mét."
      - clear: true
        show: |
          <p><b>Bước Euler</b>: biết tốc độ thay đổi của một đại lượng, trong một khoảng rất ngắn $h$ ta coi tốc độ đó gần như không đổi, nên giá trị mới = giá trị cũ + $h$ nhân tốc độ thay đổi. Lặp nhiều bước nhỏ thì đi được cả quãng dài.</p>
          <p>Làm thử: $x = 0$, xe hướng $\theta = 0$ ($\cos 0 = 1$, $\sin 0 = 0$), đi 0,5 m/s, $h = 0{,}01$ s → $x = 0 + 0{,}01 \cdot 0{,}5 \cdot 1 = \hl{0{,}005}$ m, $y$ vẫn bằng 0.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Điều thứ hai là bước Euler, cách tính dần một đại lượng khi biết tốc độ thay đổi của nó. Trong một khoảng rất ngắn h, ta coi tốc độ đó gần như không đổi, nên giá trị mới bằng giá trị cũ cộng h nhân tốc độ thay đổi. Lặp lại nhiều bước nhỏ như vậy thì đi được cả quãng dài. Làm thử với xe đang ở x bằng 0, hướng tê-ta bằng 0, nên cô-sin bằng 1 và sin bằng 0, đi 0 phẩy 5 mét mỗi giây. Với h bằng 0 phẩy 01 giây, x mới bằng 0 phẩy 005 mét, còn y vẫn bằng 0 vì xe chưa quay."
      - show: |
          <p>Xe hướng góc $\theta$, đi tốc độ $v$: mỗi giây tiến theo trục $x$ một đoạn $v \cos\theta$, theo trục $y$ một đoạn $v \sin\theta$ — vì mũi tên dài 1 chỉ theo hướng $\theta$ có bóng trên trục $x$ dài $\cos\theta$, trên trục $y$ dài $\sin\theta$.</p>
          <table class="t"><tr><th>hướng, $v = 0{,}5$ m/s</th><th>theo $x$</th><th>theo $y$</th></tr>
          <tr><td>$\theta = 0$ (dọc trục $x$)</td><td>$0{,}5 \cdot 1 = 0{,}5$</td><td>$0{,}5 \cdot 0 = 0$</td></tr>
          <tr><td>$\theta = 90^\circ = \frac{\pi}{2}$ rad (dọc trục $y$)</td><td>$0{,}5 \cdot 0 = 0$</td><td>$0{,}5 \cdot 1 = 0{,}5$</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Điều thứ ba, xe hướng góc tê-ta và đi tốc độ v thì mỗi giây tiến theo trục x một đoạn v cô-sin tê-ta, theo trục y một đoạn v sin tê-ta. Lý do là mũi tên dài 1 chỉ theo hướng tê-ta có bóng trên trục x dài cô-sin tê-ta, và bóng trên trục y dài sin tê-ta. Với tê-ta bằng 0, xe đi 0 phẩy 5 mét mỗi giây theo trục x và không đi theo trục y. Với tê-ta bằng 90 độ, tức pi phần 2 ra-đi-an, cô-sin bằng 0 và sin bằng 1, nên xe chỉ đi theo trục y."

  - id: sym
    kind: symbol
    title: "Giải mã: v, ω và tư thế (x, y, θ)"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$v_L$, $v_R$</td><td>tốc độ bánh trái, bánh phải (m/s)</td></tr>
          <tr><td>$L$</td><td>khoảng cách giữa hai bánh</td></tr>
          <tr><td>$v = \frac{v_L + v_R}{2}$</td><td>vận tốc tiến của tâm xe — trung bình hai bánh</td></tr>
          <tr><td>$\omega = \frac{v_R - v_L}{L}$</td><td>vận tốc góc (rad/s): bánh phải nhanh hơn thì quay trái</td></tr>
          <tr><td>$R = \frac{v}{\omega}$</td><td>bán kính quay; $\omega = 0$ thì đi thẳng</td></tr></table>
          <p>Tư thế $(x, y, \theta)$ thay đổi theo: $x' = v \cos\theta$, $y' = v \sin\theta$, $\theta' = \omega$ — xe chỉ đi theo hướng đầu xe.</p>
          <p class="note">Tư thế = vị trí $(x, y)$ cộng hướng đầu xe $\theta$; $x'$ đọc “x phẩy”, là tốc độ thay đổi của $x$ mỗi giây.</p>
        introduces: [omega_sym, prime]
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", 2, 3]
        say: "Bảng giới thiệu các ký hiệu. v L và v R là tốc độ bánh trái và bánh phải, tính bằng mét mỗi giây. L là khoảng cách giữa hai bánh. Vận tốc tiến v của tâm xe là trung bình của hai bánh. Vận tốc góc ô-mê-ga bằng hiệu tốc độ bánh phải trừ bánh trái, chia L, bánh phải nhanh hơn thì xe quay trái. Bán kính quay R bằng v chia ô-mê-ga, và khi ô-mê-ga bằng 0 thì xe đi thẳng. Tư thế x, y, tê-ta thay đổi theo ba phương trình, x phẩy bằng v cos tê-ta, y phẩy bằng v sin tê-ta, tê-ta phẩy bằng ô-mê-ga, tức xe chỉ đi theo hướng đầu xe. Ở đây tư thế gồm vị trí x, y cùng hướng đầu xe tê-ta, còn x phẩy là tốc độ thay đổi của x mỗi giây."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Vì sao bánh ngoài phải quay nhanh hơn"
    checks:
      - "abs(0.4 * 1.0 - 0.4) < 1e-9 and abs(0.4 * 1.25 - 0.5) < 1e-9 and abs(0.4 * 1.5 - 0.6) < 1e-9 and abs(0.4 * 0.5 - 0.2) < 1e-9 and abs(1.5 - 1.0 - 0.5) < 1e-9"
      - "abs((0.6 - 0.4) / 0.5 - 0.4) < 1e-9 and abs((0.4 + 0.6) / 2 - 0.4 * 1.25) < 1e-9"
    steps:
      - show: |
          <div><svg width="1500" height="470" viewBox="0 0 1500 470"><path d="M550,430 A400,400 0 0 0 407,124" fill="none" stroke="#2a78d6" stroke-width="4"/><path d="M650,430 A500,500 0 0 0 510,83" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="10 8"/><path d="M750,430 A600,600 0 0 0 623,61" fill="none" stroke="#eb6834" stroke-width="4"/><line x1="150" y1="430" x2="750" y2="430" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 6"/><circle cx="150" cy="430" r="9" fill="#b91c1c"/><rect x="538" y="400" width="24" height="60" fill="#2a78d6"/><rect x="738" y="400" width="24" height="60" fill="#eb6834"/><line x1="550" y1="430" x2="750" y2="430" stroke="#1f2937" stroke-width="5"/><circle cx="650" cy="430" r="8" fill="#059669"/><g font-size="22" fill="#1f2937"><text x="140" y="412" fill="#b91c1c">tâm quay</text><text x="350" y="460" text-anchor="middle">1,0 m</text></g><g font-size="25" fill="#1f2937"><text x="860" y="70" font-weight="bold">Hai bánh: CÙNG một tâm, cùng ω = 0,4 rad/s</text><text x="860" y="140" fill="#2a78d6">bánh trái, vòng trong 1,0 m: 0,4 nhân 1,0 = 0,4 m/s</text><text x="860" y="200" fill="#059669">tâm xe, vòng giữa 1,25 m: 0,4 nhân 1,25 = 0,5 m/s</text><text x="860" y="260" fill="#eb6834">bánh phải, vòng ngoài 1,5 m: 0,4 nhân 1,5 = 0,6 m/s</text><text x="860" y="330">hai vòng cách nhau L = 0,5 m</text><text x="860" y="380">nên chênh tốc độ = ω nhân L = 0,2 m/s</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ xe nhìn từ trên xuống, chấm đỏ bên trái là tâm quay, hai thanh màu là hai bánh. Khi xe rẽ trái, cả hai bánh cùng quay quanh một tâm với cùng vận tốc góc 0 phẩy 4 ra-đi-an mỗi giây. Nhưng bánh trái đi vòng trong bán kính 1 mét, còn bánh phải đi vòng ngoài bán kính 1 phẩy 5 mét. Theo quãng cung bằng bán kính nhân góc, mỗi giây bánh trái đi 0 phẩy 4 mét, tâm xe đi 0 phẩy 5 mét, bánh phải đi 0 phẩy 6 mét. Hai vòng cách nhau đúng bằng L, 0 phẩy 5 mét, nên hai bánh chênh nhau ô-mê-ga nhân L, bằng 0 phẩy 2 mét mỗi giây."
      - clear: true
        show: |
          <p>Gọi $R$ là bán kính quay của tâm xe. Mỗi bánh cách tâm xe $\frac{L}{2}$:</p>
          $$v_L = \omega \cdot (R - \frac{L}{2}), \qquad v_R = \omega \cdot (R + \frac{L}{2})$$
          <p>Trừ hai vế: $v_R - v_L = \omega \cdot L$, nên $\omega = \frac{v_R - v_L}{L}$. Cộng rồi chia 2: $\frac{v_L + v_R}{2} = \omega \cdot R = v$.</p>
          <p>Làm thử: $\frac{0{,}6 - 0{,}4}{0{,}5} = 0{,}4$ ✓ và $\frac{0{,}4 + 0{,}6}{2} = 0{,}4 \cdot 1{,}25 = 0{,}5$ ✓</p>
        focus: [1, 2, 3, 3, 4, 4]
        say: "Bây giờ ta suy ra công thức thay vì học thuộc, gọi R là bán kính quay của tâm xe, mỗi bánh cách tâm xe một nửa L. Tốc độ bánh trái bằng ô-mê-ga nhân R trừ nửa L, tốc độ bánh phải bằng ô-mê-ga nhân R cộng nửa L. Lấy hai vế trừ nhau thì phần R triệt tiêu, hiệu hai bánh bằng ô-mê-ga nhân L, chia cho L là ra công thức vận tốc góc. Còn cộng hai vế rồi chia 2 thì trung bình hai bánh bằng ô-mê-ga nhân R, chính là vận tốc tiến v. Làm thử với số của hình, 0 phẩy 6 trừ 0 phẩy 4 chia 0 phẩy 5 bằng 0 phẩy 4, đúng vận tốc góc. Trung bình hai bánh 0 phẩy 5 cũng bằng 0 phẩy 4 nhân 1 phẩy 25, cả hai đều khớp."

  - id: example
    kind: example
    title: "0,4 và 0,6 m/s, hai bánh cách 0,5 m"
    checks:
      - "[round(x, 3) for x in alg.diff_drive(0.4, 0.6, 0.5)] == [0.5, 0.4, 1.25]"
      - "round(2 * math.pi / 0.4, 2) == 15.71 and round(2 * math.pi * 1.25, 2) == 7.85 and round(2 * math.pi / 0.4 / 0.01) == 1571"
      - "(lambda q: [round(c, 6) for c in q] == [0.005, 0.0, 0.004])(alg.diff_drive_step((0.0, 0.0, 0.0), 0.5, 0.4, 0.01))"
    steps:
      - show: |
          <p><b>Bước 1 — vận tốc tiến:</b></p>
          $$v = \frac{0{,}4 + 0{,}6}{2} = \hl{0{,}5} \text{ m/s}$$
        focus: [1, 2]
        say: "Bước một, tính vận tốc tiến của tâm xe. Vận tốc tiến bằng 0 phẩy 4 cộng 0 phẩy 6 chia 2, bằng 0 phẩy 5 mét mỗi giây."
      - show: |
          <p><b>Bước 2 — vận tốc góc</b> (dương nên xe quay trái):</p>
          $$\omega = \frac{0{,}6 - 0{,}4}{0{,}5} = \hl{0{,}4} \text{ rad/s}$$
        focus: [1, 2]
        say: "Bước hai, tính vận tốc góc từ hiệu hai bánh. Vận tốc góc bằng 0 phẩy 6 trừ 0 phẩy 4 chia 0 phẩy 5, bằng 0 phẩy 4 ra-đi-an mỗi giây, số dương nên xe quay sang trái."
      - show: |
          <p><b>Bước 3 — bán kính quay:</b></p>
          $$R = \frac{v}{\omega} = \frac{0{,}5}{0{,}4} = \hl{1{,}25} \text{ m}$$
        focus: [1, 2]
        say: "Bước ba, lấy hai kết quả trên chia cho nhau. Bán kính quay bằng 0 phẩy 5 chia 0 phẩy 4, bằng 1 phẩy 25 mét."
      - clear: true
        show: |
          <p><b>Bước 4 — một vòng</b> (thời gian, rồi quãng đường):</p>
          $$\frac{2\pi}{\omega} = \frac{6{,}28}{0{,}4} \approx \hl{15{,}71} \text{ s}, \qquad 2\pi R \approx \hl{7{,}85} \text{ m}$$
        focus: [1, 2]
        say: "Bước bốn, một vòng tròn là 2 pi ra-đi-an, mà mỗi giây xe quay được ô-mê-ga ra-đi-an. Một vòng mất 2 pi chia ô-mê-ga, khoảng 15 phẩy 71 giây, đi quãng 2 pi R, khoảng 7 phẩy 85 mét."
      - show: |
          <table class="t"><tr><th>Bước 5 — Euler, $h = 0{,}01$ s</th><th>$x$</th><th>$y$</th><th>$\theta$ (rad)</th></tr>
          <tr><td>đầu</td><td>0</td><td>0</td><td>0</td></tr><tr><td>sau bước đầu</td><td>0,005</td><td>0</td><td>$0{,}4 \cdot 0{,}01 = 0{,}004$</td></tr></table>
          <p>Sau 1571 bước, robot quay về cách gốc dưới 1 cm.</p>
        focus: [1, 1, 2]
        say: "Bước năm, mô phỏng bằng bước Euler 0 phẩy 01 giây, xuất phát từ gốc với hướng bằng 0. Bước đầu cho x bằng 0 phẩy 005, y vẫn bằng 0, còn tê-ta tăng 0 phẩy 4 nhân 0 phẩy 01, bằng 0 phẩy 004 ra-đi-an. Lặp lại như vậy, sau 1571 bước robot quay về cách gốc dưới 1 xen-ti-mét, khớp với một vòng 15 phẩy 71 giây."

  - id: check
    kind: check
    title: "Tự kiểm: cộng quãng đường của từng bánh"
    checks:
      - "(lambda T: round(0.5 * T, 2) == 7.85 and round(0.4 * T, 2) == 6.28 and round(0.6 * T, 2) == 9.42 and round(2 * math.pi * 1.0, 2) == 6.28 and round(2 * math.pi * 1.5, 2) == 9.42 and round((0.4 * T + 0.6 * T) / 2, 2) == 7.85)(2 * math.pi / 0.4)"
      - "round(9.42 - 6.28, 2) == 3.14 and round(math.pi, 2) == 3.14"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>trong 15,71 s</th><th>so với</th></tr>
          <tr><td>tâm xe: tốc độ nhân thời gian</td><td>$0{,}5 \cdot 15{,}71 \approx 7{,}85$ m</td><td>$2\pi R \approx 7{,}85$ ✓</td></tr>
          <tr><td>bánh trái</td><td>$0{,}4 \cdot 15{,}71 \approx 6{,}28$ m</td><td>vòng bán kính 1,0: $2\pi \approx 6{,}28$ ✓</td></tr>
          <tr><td>bánh phải</td><td>$0{,}6 \cdot 15{,}71 \approx 9{,}42$ m</td><td>vòng bán kính 1,5: $3\pi \approx 9{,}42$ ✓</td></tr>
          <tr><td>chênh hai bánh</td><td>$9{,}42 - 6{,}28 = 3{,}14$ m</td><td>$2\pi \cdot L = 2\pi \cdot 0{,}5 = \pi$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Kiểm bằng đường khác, không dùng công thức bán kính mà lấy tốc độ nhân thời gian. Tâm xe đi 0 phẩy 5 mét mỗi giây trong 15 phẩy 71 giây, được khoảng 7 phẩy 85 mét, khớp với 2 pi R. Bánh trái đi khoảng 6 phẩy 28 mét, đúng một vòng bán kính 1 mét. Bánh phải đi khoảng 9 phẩy 42 mét, đúng một vòng bán kính 1 phẩy 5 mét. Hai bánh chênh nhau 3 phẩy 14 mét, đúng bằng pi, vì mỗi vòng hai bánh lệch nhau 2 pi nhân L, mà L bằng 0 phẩy 5."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, từ người mới tới người đã đi làm"
    checks:
      - "round(0.2 / 0.52, 3) == 0.385 and round(math.degrees(2 * math.pi - 0.2 / 0.52 * 2 * math.pi / 0.4), 1) == 13.8"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lẫn độ với ra-đi-an <b class="red">(quay sai 57 lần)</b>
          <br><span class="note">$\omega$ tính ra rad/s. Đưa vào hàm cos, sin ở dạng độ, hay ra lệnh động cơ theo độ/giây mà không đổi, xe quay sai hẳn. 1 rad ≈ 57,3°.</span></div>
        say: "Lỗi thứ nhất, lẫn độ với ra-đi-an, nên xe quay sai tới 57 lần. Công thức cho ô-mê-ga theo đơn vị ra-đi-an mỗi giây. Đưa vào hàm cos hay sin ở dạng độ, hay ra lệnh động cơ theo độ mỗi giây mà không đổi đơn vị, thì xe quay sai hẳn, vì 1 ra-đi-an xấp xỉ 57 phẩy 3 độ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lập kế hoạch đường đi ngang <b class="red">(xe không đi được)</b>
          <br><span class="note">Bánh không trượt ngang: xe chỉ đi theo hướng đầu xe. Muốn sang trái 1 m phải quay rồi tiến — đường đi phải tôn trọng ràng buộc này.</span></div>
        say: "Lỗi thứ hai, lập kế hoạch một đường đi ngang mà xe không đi được. Bánh không trượt ngang, nên xe chỉ đi theo hướng đầu xe. Muốn sang trái 1 mét phải quay rồi tiến, và đường đi phải tôn trọng ràng buộc này."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tin mô hình khi bánh trượt <b class="red">(sàn ướt, thảm)</b>
          <br><span class="note">Mô hình giả định bánh lăn không trượt. Trên sàn ướt hay khi tăng tốc gấp, tốc độ thật khác lệnh — cần cảm biến khác để kiểm.</span></div>
        say: "Lỗi thứ ba, tin mô hình khi bánh trượt, như trên sàn ướt hay trên thảm. Mô hình giả định bánh lăn không trượt. Trên sàn ướt hay khi tăng tốc gấp, tốc độ thật khác lệnh, nên cần thêm cảm biến khác để kiểm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Lấy $L$ bằng thước đo trên bản vẽ, không hiệu chuẩn <b class="red">(lệch hướng)</b>
          <br><span class="note">Bánh cao su tiếp đất cả một mảng, nên khoảng cách hai bánh “hiệu dụng” có thể khác số đo. Người làm nghề cho xe quay tại chỗ nhiều vòng, đo góc thật, rồi tính lại $L$.</span></div>
          <table class="t"><tr><th>đại lượng</th><th>trong mã</th><th>thật</th></tr>
          <tr><td>$L$</td><td>0,50 m</td><td>0,52 m</td></tr>
          <tr><td>$\omega$ khi hai bánh chênh 0,2 m/s</td><td>0,4 rad/s</td><td>$\frac{0{,}2}{0{,}52} \approx 0{,}385$ rad/s</td></tr>
          <tr><td>sau 15,71 s tưởng đủ một vòng</td><td>$360^\circ$</td><td>thiếu $\approx 13{,}8^\circ$</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, lấy khoảng cách hai bánh L bằng thước đo trên bản vẽ mà không hiệu chuẩn. Bánh cao su tiếp đất cả một mảng chứ không phải một điểm, nên khoảng cách hiệu dụng có thể khác số đo. Người làm nghề cho xe quay tại chỗ nhiều vòng, đo góc thật, rồi tính lại L. Bảng cho thấy hậu quả, trong mã ghi 0 phẩy 50 mét nhưng thật ra là 0 phẩy 52 mét. Khi hai bánh chênh 0 phẩy 2 mét mỗi giây, xe thật chỉ quay khoảng 0 phẩy 385 ra-đi-an mỗi giây chứ không phải 0 phẩy 4. Sau 15 phẩy 71 giây tưởng đã đủ một vòng, xe còn thiếu khoảng 13 phẩy 8 độ, và sai lệch này cộng dồn mãi theo từng vòng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.diff_drive(0.5, 0.5, 0.5)[:2] == (0.5, 0.0) and [round(x, 3) for x in alg.diff_drive(-0.3, 0.3, 0.5)[:2]] == [0.0, 1.2]"
      - "(lambda r: [round(c, 6) for c in r] == [0.5, 0.5, 1.0])(alg.diff_drive(0.375, 0.625, 0.5)) and 0.5 * (1 - 0.25) == 0.375 and 0.5 * (1 + 0.25) == 0.625"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề (cùng $L = 0{,}5$ m)</th></tr>
          <tr><td>1</td><td>Hai bánh cùng 0,5 m/s: $v$, $\omega$ bằng bao nhiêu? Xe đi thế nào?</td></tr>
          <tr><td>2</td><td>Bánh trái −0,3 m/s, bánh phải 0,3 m/s: $v$, $\omega$? Xe đi thế nào?</td></tr>
          <tr><td>3</td><td>Quyết định: muốn tâm xe đi 0,5 m/s trên vòng bán kính 1 m, quay trái, đặt mỗi bánh bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hai bánh cùng 0 phẩy 5 mét mỗi giây, L bằng 0 phẩy 5 mét, v và ô-mê-ga bằng bao nhiêu? Xe đi thế nào? Câu hai, bánh trái âm 0 phẩy 3, bánh phải 0 phẩy 3 mét mỗi giây, v và ô-mê-ga bằng bao nhiêu? Xe đi thế nào? Câu ba là một quyết định, muốn tâm xe đi 0 phẩy 5 mét mỗi giây trên vòng bán kính 1 mét, quay trái, thì đặt mỗi bánh bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $v = \frac{0{,}5 + 0{,}5}{2} = 0{,}5$; $\omega = \frac{0{,}5 - 0{,}5}{0{,}5} = 0$ → đi <b>thẳng</b>.</p>
        say: "Đáp án câu một, trước hết trung bình hai bánh là 0 phẩy 5, còn hiệu hai bánh bằng 0 nên chia cho L vẫn bằng 0. Đáp án câu một, v bằng 0 phẩy 5 và ô-mê-ga bằng 0, nên xe đi thẳng."
      - show: |
          <p>② $v = \frac{-0{,}3 + 0{,}3}{2} = 0$; hiệu $0{,}3 - (-0{,}3) = 0{,}6$, nên $\omega = \frac{0{,}6}{0{,}5} = \hl{1{,}2}$ rad/s → <b>quay tại chỗ</b> sang trái.</p>
        say: "Câu hai, trung bình của âm 0 phẩy 3 và 0 phẩy 3 bằng 0, còn hiệu là 0 phẩy 3 trừ âm 0 phẩy 3, bằng 0 phẩy 6, cẩn thận dấu trừ của số âm. Câu hai, v bằng 0 và ô-mê-ga bằng 0 phẩy 6 chia 0 phẩy 5, bằng 1 phẩy 2 ra-đi-an mỗi giây, nên xe quay tại chỗ sang trái."
      - clear: true
        show: |
          <p>③ $\omega = \frac{v}{R} = \frac{0{,}5}{1} = 0{,}5$ rad/s.</p>
          <p>Bánh trái $= 0{,}5 \cdot (1 - 0{,}25) = \hl{0{,}375}$ m/s; bánh phải $= 0{,}5 \cdot (1 + 0{,}25) = \hl{0{,}625}$ m/s.</p>
          <p>Thử lại: trung bình $= 0{,}5$ ✓, hiệu chia $L$ $= \frac{0{,}25}{0{,}5} = 0{,}5$ ✓</p>
        focus: [1, 1, 2, 3]
        say: "Câu ba đi ngược lại, từ yêu cầu ra lệnh cho bánh. Vận tốc góc cần có bằng v chia R, tức 0 phẩy 5 chia 1, bằng 0 phẩy 5 ra-đi-an mỗi giây. Bánh trái ở vòng trong cách tâm 1 trừ 0 phẩy 25 mét nên đặt 0 phẩy 375 mét mỗi giây, bánh phải ở vòng ngoài nên đặt 0 phẩy 625 mét mỗi giây. Thử lại bằng công thức thuận, trung bình hai bánh là 0 phẩy 5 và hiệu chia L cũng là 0 phẩy 5, đúng như yêu cầu."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">v = trung bình hai bánh</span><span class="a">→</span>
          <span class="n">ω = hiệu hai bánh chia L</span><span class="a">→</span>
          <span class="n">R = v / ω</span><span class="a">→</span>
          <span class="n">chỉ đi theo hướng đầu xe, đơn vị ra-đi-an</span></div>
        say: "Tổng kết lại, vận tốc tiến là trung bình hai bánh, vận tốc góc là hiệu hai bánh chia L, bán kính quay bằng v chia ô-mê-ga. Xe chỉ đi theo hướng đầu xe, và nhớ đơn vị ra-đi-an."
      - show: |
          <div class="box key"><b>Tư duy:</b> mọi thuật toán phía trên — định vị, lập kế hoạch, điều khiển — đều dựa trên mô hình chuyển động này; mô hình sai thì mọi thứ phía trên sai theo.</div>
        say: "Điều cần mang theo, mọi thuật toán phía trên như định vị, lập kế hoạch và điều khiển đều dựa trên mô hình chuyển động này, mô hình sai thì mọi thứ phía trên sai theo."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>đo quãng đường bằng bánh xe</b> và sai số tích lũy.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học đo quãng đường bằng bánh xe, và sai số tích lũy. Hẹn gặp bạn ở bài tiếp theo."
