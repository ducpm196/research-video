id: L01
course: ROB
series: "ROB · Robot tự hành"
title: "Bài 1 — Mô hình chuyển động của xe hai bánh vi sai"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/rob.yaml L01; audit/rob/verify_rob.py L01; Siegwart–Nourbakhsh–Scaramuzza (2011), mục 3.2 (động học xe vi sai); S. Thrun, W. Burgard, D. Fox, Probabilistic Robotics (2005), mục 5.3; RBM bài 0 (khung toạ độ, phép quay), bài 7 (phương pháp Euler)"
assumes: [arith, frac, cos, sin, sub, cdot, theta]
# Quy ước: bánh trái v_L, bánh phải v_R (m/s), khoảng cách hai bánh L (m). v = (v_L + v_R)/2, ω = (v_R − v_L)/L (rad/s, dương là quay trái),
#   bán kính quay R = v/ω (alg.diff_drive). Tư thế (x, y, θ); bước thời gian h như RBM (không viết Δt); bước Euler: alg.diff_drive_step.
objectives:
  - "Tính vận tốc thẳng và vận tốc góc từ hai bánh"
  - "Tính bán kính quay"
  - "Hiểu ràng buộc không trượt ngang"
