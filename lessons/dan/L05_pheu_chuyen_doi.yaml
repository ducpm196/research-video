  - show: '<table class=''t''><tr><th>Gợi ý triển khai DAN:L05</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (tỉ lệ từng chặng)</b></td><td>Chia số người bước sau cho bước liền trước làm tròn một chữ số phần trăm</td></tr><tr><td><b>Bước 2 (chuyển đổi toàn phễu)</b></td><td>Chia lượng người hoàn thành bước cuối cho tổng đầu vào phễu</td></tr><tr><td><b>Bước 3 (kịch bản giả định bước 2)</b></td><td>Nhân chặng một, tỉ lệ mới của bước hai và chặng ba ra toàn phễu mới</td></tr><tr><td><b>Đọc stdin (Python)</b></td><td>Gợi ý đọc `stdin`: `kv = dict(t.split("=") for t in sys.stdin.read().split())`, tách `steps` qua `[int(x) for x in kv["steps"].split(",")]`.</td></tr></table>'
    say: Gợi ý cài đặt bài số năm gồm phép chia từng chặng và phép nhân chuỗi chuyển đổi. Đầu tiên đọc mảng bốn bước cùng tỉ lệ giả định bước hai từ luồng chuẩn rồi tách danh sách số nguyên. Sau đó chia số người mỗi chặng cho bước liền trước để lấy ba tỉ lệ làm tròn một chữ số phần trăm. Tiếp theo chia người hoàn thành bước cuối cho tổng đầu vào ban đầu để tính tỉ lệ toàn phễu hiện tại. Cuối cùng thay bước hai bằng ngưỡng giả định, nhân ba chặng thành tỉ lệ phễu mới rồi in đủ một dòng khớp mẫu.
