id: L05
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 5 — Phễu chuyển đổi: từng bước và toàn phễu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dan.yaml L05; audit/dan/verify_dan.py L05; A. Croll, B. Yoskovitz, Lean Analytics (2013); bài 0 (định nghĩa chỉ số), bài 3 (hàm cửa sổ)"
assumes: [arith, frac, cdot]
# Quy ước: tỉ lệ từng bước = số người tới bước i + 1 / số người tới bước i; toàn phễu = bước cuối / bước đầu (alg.funnel); một người chỉ được tính ở bước i + 1
#   khi đã có bước i TRƯỚC đó theo thời gian, trong cùng một khoảng thời gian định nghĩa. Số liệu là SỐ MINH HOẠ.
objectives:
  - "Tính tỉ lệ chuyển từng bước và toàn phễu"
  - "Bắt thứ tự thời gian của các bước"
  - "Ước lượng tác động khi cải thiện một bước"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "3% mua hàng — bước nào làm rơi khách?"
    checks:
      - "alg.funnel([10000, 4000, 1200, 300]) == ([40.0, 30.0, 25.0], 3.0)"
    steps:
      - show: |
          <p>Trang bán hàng có 10 000 lượt xem sản phẩm mỗi ngày nhưng chỉ 300 đơn hoàn tất: 3%. Câu “làm sao tăng 3%” quá to để trả lời. Câu hữu ích hơn: khách <b>rơi ở bước nào</b>, và sửa bước đó thì được thêm bao nhiêu đơn?</p>
          <div class="box key">Hôm nay: <b>phễu chuyển đổi</b> — tỉ lệ từng bước, toàn phễu, và bẫy thứ tự thời gian.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, trang bán hàng có 10 nghìn lượt xem sản phẩm mỗi ngày nhưng chỉ có 300 đơn hoàn tất, tức 3 phần trăm. Câu hỏi làm sao tăng 3 phần trăm quá to để trả lời. Câu hữu ích hơn là khách rơi ở bước nào, và sửa bước đó thì được thêm bao nhiêu đơn? Hôm nay ta học phễu chuyển đổi, với tỉ lệ từng bước, toàn phễu, và cái bẫy thứ tự thời gian."

  - id: prereq
    kind: prereq
    title: "Ôn lại: phần trăm của một số, và phần trăm của phần trăm"
    checks:
      - "round(10000 * 0.4) == 4000 and 0.5 * 0.5 == 0.25"
      - "round(60 - 50) == 10 and round((60 - 50) / 50 * 100) == 20"
    steps:
      - show: |
          <table class="t"><tr><th>phép tính</th><th>ví dụ</th></tr>
          <tr><td>phần trăm của một số</td><td>40% của 10 000 $= 10\,000 \cdot 0{,}4 = 4000$</td></tr>
          <tr><td>phần trăm của phần trăm</td><td>50% của 50% $= 0{,}5 \cdot 0{,}5 = 0{,}25 = 25\%$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước hết, ôn lại hai phép tính với phần trăm. Lấy 40 phần trăm của 10 nghìn là nhân 10 nghìn với 0 phẩy 4, được 4000. Lấy 50 phần trăm của 50 phần trăm là nhân 0 phẩy 5 với 0 phẩy 5, được 0 phẩy 25, tức 25 phần trăm, nên đi qua hai cửa liên tiếp thì nhân hai tỉ lệ."
      - show: |
          <p>Từ 50% lên 60%: tăng $60 - 50 = 10$ <b>điểm phần trăm</b>, nhưng tăng <b>tương đối</b> $\frac{10}{50} = 20\%$.</p>
        say: "Thứ hai, tăng từ 50 phần trăm lên 60 phần trăm là tăng 10 điểm phần trăm. Nhưng so với mức cũ thì đó là tăng tương đối 10 chia 50, bằng 20 phần trăm. Hai cách nói này khác nhau, và bài hôm nay dùng cả hai."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: từng bước và toàn phễu"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>bước</b></td><td>một sự kiện đã định nghĩa: xem sản phẩm, thêm giỏ, thanh toán, hoàn tất</td></tr>
          <tr><td><b>tỉ lệ từng bước</b></td><td>$\frac{\text{tới bước } i + 1}{\text{tới bước } i}$ — trong số người tới bước trước, bao nhiêu đi tiếp</td></tr>
          <tr><td><b>toàn phễu</b></td><td>$\frac{\text{bước cuối}}{\text{bước đầu}}$ = tích các tỉ lệ từng bước</td></tr>
          <tr><td><b>điều kiện thứ tự</b></td><td>chỉ tính ở bước sau nếu đã có bước trước, <b>sớm hơn</b> về thời gian</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng có bốn khái niệm. Mỗi bước là một sự kiện đã định nghĩa, như xem sản phẩm, thêm giỏ, thanh toán, và hoàn tất. Tỉ lệ từng bước bằng số người tới bước sau chia số người tới bước trước, tức trong số người tới bước trước có bao nhiêu đi tiếp. Tỉ lệ toàn phễu bằng bước cuối chia bước đầu, cũng bằng tích các tỉ lệ từng bước. Điều kiện thứ tự là chỉ tính một người ở bước sau nếu người đó đã có bước trước, sớm hơn về thời gian."

  - id: intuition
    kind: intuition
    title: "Mỗi bước là một cái lọc"
    checks:
      - "alg.funnel([10000, 4000, 1200, 300]) == ([40.0, 30.0, 25.0], 3.0)"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><g fill="#1f2937" font-size="22"><rect x="360" y="30" width="800" height="50" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="60" y="63">xem sản phẩm</text><text x="1300" y="63" text-anchor="end" font-weight="bold">10 000</text><rect x="600" y="110" width="320" height="50" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="60" y="143">thêm giỏ</text><text x="1300" y="143" text-anchor="end" font-weight="bold">4 000</text><text x="1330" y="104" fill="#059669">giữ 40%</text><rect x="712" y="190" width="96" height="50" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="60" y="223">thanh toán</text><text x="1300" y="223" text-anchor="end" font-weight="bold">1 200</text><text x="1330" y="184" fill="#059669">giữ 30%</text><rect x="748" y="270" width="24" height="50" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="60" y="303">hoàn tất</text><text x="1300" y="303" text-anchor="end" font-weight="bold">300</text><text x="1330" y="264" fill="#059669">giữ 25%</text><text x="60" y="345" fill="#eb6834" font-weight="bold">toàn phễu: 300 trên 10 000 = 0,4 nhân 0,3 nhân 0,25 = 3%</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ mỗi bước thành một thanh, bề rộng tỉ lệ với số người còn lại, nên càng xuống thanh càng hẹp như cái phễu. Giữa hai thanh là tỉ lệ người đi tiếp, 40, 30, rồi 25 phần trăm. Vì mỗi bước lọc trên phần đã lọt qua bước trước, tỉ lệ toàn phễu là tích các tỉ lệ, ở đây bằng 3 phần trăm."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Bốn bước, ba tỉ lệ"
    checks:
      - "alg.funnel([10000, 4000, 1200, 300]) == ([40.0, 30.0, 25.0], 3.0) and round(0.4 * 0.3 * 0.25, 4) == 0.03"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>số người</th><th>tỉ lệ từ bước trước</th></tr>
          <tr><td>xem sản phẩm</td><td>10 000</td><td>—</td></tr>
          <tr><td>thêm giỏ</td><td>4 000</td><td>$\frac{4000}{10\,000} = 40\%$</td></tr></table>
          <p><b>Bước 1</b> — tỉ lệ xem → thêm giỏ.</p>
        focus: [1, "1.2", "1.3"]
        say: "Bước một, bảng này gồm bốn bước làm lần lượt, ta tính từng tỉ lệ một. Xem sản phẩm có 10 nghìn người. Thêm giỏ có 4 nghìn, chia 10 nghìn được 40 phần trăm."
      - show: |
          <table class="t"><tr><th>bước</th><th>số người</th><th>tỉ lệ từ bước trước</th></tr>
          <tr><td>thanh toán</td><td>1 200</td><td>$\frac{1200}{4000} = 30\%$</td></tr>
          <tr><td>hoàn tất</td><td>300</td><td>$\frac{300}{1200} = 25\%$</td></tr></table>
          <p><b>Bước 2</b> — hai tỉ lệ còn lại, mẫu số luôn là <b>bước ngay trước</b>.</p>
        focus: [2, "1.2", "1.3"]
        say: "Bước hai, hai tỉ lệ còn lại, mẫu số luôn là bước ngay trước. Thanh toán có 1200 trên 4 nghìn, tức 30 phần trăm. Hoàn tất có 300 trên 1200, tức 25 phần trăm."
      - clear: true
        show: |
          <p><b>Bước 3</b> — toàn phễu bằng tích: $0{,}4 \cdot 0{,}3 \cdot 0{,}25 = \hl{3\%}$.</p>
        say: "Bước ba, vì mỗi bước lọc trên phần đã qua bước trước, toàn phễu bằng 0 phẩy 4 nhân 0 phẩy 3 nhân 0 phẩy 25, bằng 3 phần trăm."
      - show: |
          <table class="t"><tr><th>chuyển bước</th><th>mất (người)</th><th>tỉ lệ đi tiếp</th></tr>
          <tr><td>xem → thêm giỏ</td><td>$10\,000 - 4000 = 6000$</td><td>40%</td></tr>
          <tr><td>thêm giỏ → thanh toán</td><td>$4000 - 1200 = 2800$</td><td>30%</td></tr>
          <tr><td>thanh toán → hoàn tất</td><td>$1200 - 300 = 900$</td><td>25% — thấp nhất</td></tr></table>
          <p><b>Bước 4</b> — chọn chỗ sửa: cả hai bước đều đáng xem.</p>
        focus: [0, "1.2", "1.4", 2]
        say: "Bước bốn, chọn chỗ để sửa. Bước mất nhiều người nhất về số tuyệt đối là từ xem sang thêm giỏ, 6 nghìn người. Nhưng bước từ thanh toán sang hoàn tất có tỉ lệ thấp nhất. Vì vậy cả hai đều đáng xem xét."

  - id: check
    kind: check
    title: "Tự kiểm: chia thẳng, và đếm cho đủ người"
    checks:
      - "300 / 10000 == 0.03 and 6000 + 2800 + 900 + 300 == 10000"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>chia thẳng, không nhân tỉ lệ</td><td>$\frac{300}{10\,000}$</td><td>3% ✓ khớp tích</td></tr>
          <tr><td>mọi người phải ở đúng một chỗ</td><td>$6000 + 2800 + 900 + 300$</td><td>10 000 ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3"]
        say: "Kiểm bằng hai đường khác. Chia thẳng bước cuối cho bước đầu, 300 chia 10 nghìn, cũng ra 3 phần trăm, khớp với tích các tỉ lệ. Mỗi người trong 10 nghìn người ban đầu phải dừng ở đúng một chỗ, hoặc rơi ở một bước, hoặc hoàn tất. Cộng 6000, 2800, 900 và 300 được đúng 10 nghìn, nên không ai bị đếm sót hay đếm hai lần."


  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, cả người mới lẫn người đã đi làm"
    checks:
      - "(lambda ev: (sum(1 for u in ev if 'gio' in ev[u] and 'mua' in ev[u]), sum(1 for u in ev if 'gio' in ev[u] and 'mua' in ev[u] and ev[u]['gio'] < ev[u]['mua'])))({'u1': {'gio': 1, 'mua': 2}, 'u2': {'gio': 5, 'mua': 3}, 'u3': {'gio': 2}}) == (2, 1)"
      - "round(10000 * 0.5 * 0.3 * 0.25) == 375 and round(10000 * 0.5 * 0.24 * 0.25) == 300 and alg.funnel([10000, 5000, 1200, 300]) == ([50.0, 24.0, 25.0], 3.0)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Không kiểm thứ tự thời gian <b class="red">(phễu không còn là phễu)</b>
          <br><span class="note">u1 thêm giỏ rồi mua; u2 mua bằng nút “mua ngay” rồi mới thêm giỏ món khác. Đếm “có cả hai sự kiện”: 2 người; đếm đúng thứ tự: 1 người.</span></div>
        say: "Lỗi thứ nhất, không kiểm thứ tự thời gian, nên phễu không còn là phễu. u 1 thêm giỏ rồi mua, còn u 2 mua bằng nút mua ngay rồi mới thêm giỏ một món khác. Đếm người có cả hai sự kiện thì được 2, còn đếm đúng thứ tự thì chỉ có 1 người."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Trộn người và lượt <b class="red">(tỉ lệ trên 100%)</b>
          <br><span class="note">Bước trước đếm người, bước sau đếm lượt: một người thêm giỏ 3 lần làm tỉ lệ vượt 100%. Mỗi bước đếm cùng một đơn vị.</span></div>
        say: "Lỗi thứ hai, trộn người và lượt, nên tỉ lệ vượt 100 phần trăm. Bước trước đếm người, bước sau đếm lượt, thì một người thêm giỏ 3 lần làm tỉ lệ vượt 100 phần trăm. Mỗi bước phải đếm cùng một đơn vị."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Không giới hạn thời gian của phễu <b class="red">(so hai tuần khác nhau)</b>
          <br><span class="note">Người xem hôm nay có thể mua tuần sau. Định nghĩa “hoàn tất trong 7 ngày kể từ lần xem”, và chỉ tính những người đã có đủ 7 ngày.</span></div>
        say: "Lỗi thứ ba, không giới hạn thời gian của phễu, nên so hai tuần khác nhau. Người xem hôm nay có thể mua vào tuần sau. Hãy định nghĩa hoàn tất trong 7 ngày kể từ lần xem, và chỉ tính những người đã có đủ 7 ngày."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Ăn mừng một bước tăng mà không nhìn <b>toàn phễu</b> <b class="red">(lỗi của người đã đi làm)</b>
          <br><span class="note">Giả sử một ô bật lên mời thêm giỏ đẩy bước đầu từ 40% lên 50%, nhưng người được “đẩy” ít ý định mua, nên bước thanh toán tụt từ 30% xuống 24%.</span></div>
          <table class="t"><tr><th>cách tính</th><th>phép nhân</th><th>đơn hoàn tất</th></tr>
          <tr><td>ước lượng, giữ các bước sau</td><td>$10\,000 \cdot 0{,}5 \cdot 0{,}3 \cdot 0{,}25$</td><td>375</td></tr>
          <tr><td>đo thật sau thay đổi</td><td>$10\,000 \cdot 0{,}5 \cdot 0{,}24 \cdot 0{,}25$</td><td class="red">300 — không đổi</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3", 0]
        say: "Lỗi thứ tư là lỗi của người đã đi làm, ăn mừng một bước tăng mà không nhìn toàn phễu. Giả sử một ô bật lên mời thêm giỏ đẩy bước đầu từ 40 lên 50 phần trăm. Nhưng những người được đẩy thêm ít ý định mua, nên bước thanh toán tụt từ 30 xuống 24 phần trăm. Bảng so ước lượng với kết quả đo. Nếu giữ nguyên các bước sau, ta ước lượng 375 đơn. Đo thật thì 10 nghìn nhân 0 phẩy 5 nhân 0 phẩy 24 nhân 0 phẩy 25 chỉ ra 300 đơn, không hơn lúc trước. Vì vậy phép nhân ước lượng chỉ là giả thuyết, và người làm nghề luôn theo dõi toàn phễu như một chỉ số bảo vệ khi sửa một bước."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.funnel([5000, 2000, 1000, 600]) == ([40.0, 50.0, 60.0], 12.0) and round(5000 * 0.4 * 0.6 * 0.6) == 720"
      - "round(5000 * 0.4) == 2000 and round(2000 * 0.6) == 1200 and round(1200 * 0.6) == 720 and round((720 - 600) / 600 * 100) == 20 and round(0.4 * 0.5 * 0.6, 9) == 0.12"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Phễu 5000 → 2000 → 1000 → 600. Tỉ lệ từng bước và toàn phễu?</td></tr>
          <tr><td>2</td><td>Nếu cải thiện bước thứ hai từ 50% lên 60%, các bước khác giữ nguyên, có bao nhiêu đơn hoàn tất?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, phễu 5000, 2000, 1000, 600. Tỉ lệ từng bước và toàn phễu là bao nhiêu? Câu hai, nếu cải thiện bước thứ hai từ 50 lên 60 phần trăm, các bước khác giữ nguyên, thì có bao nhiêu đơn hoàn tất? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>chuyển bước</th><th>tỉ lệ</th></tr>
          <tr><td>5000 → 2000</td><td>$\frac{2000}{5000} = 40\%$</td></tr>
          <tr><td>2000 → 1000</td><td>$\frac{1000}{2000} = 50\%$</td></tr>
          <tr><td>1000 → 600</td><td>$\frac{600}{1000} = 60\%$</td></tr></table>
          <p>① Toàn phễu: $\frac{600}{5000} = \hl{12\%}$; kiểm: $0{,}4 \cdot 0{,}5 \cdot 0{,}6 = 0{,}12$ ✓.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Đáp án câu một, tính từng tỉ lệ với mẫu số là bước ngay trước. 2000 trên 5000 là 40 phần trăm. 1000 trên 2000 là 50 phần trăm. 600 trên 1000 là 60 phần trăm. Toàn phễu bằng 600 chia 5000, bằng 12 phần trăm, và tích 0 phẩy 4 nhân 0 phẩy 5 nhân 0 phẩy 6 cũng bằng 0 phẩy 12."
      - show: |
          <p>② $5000 \cdot 0{,}4 = 2000$; $2000 \cdot 0{,}6 = 1200$; $1200 \cdot 0{,}6 = \hl{720}$ đơn.</p>
          <p>Tăng $\frac{720 - 600}{600} = 20\%$, đúng bằng mức cải thiện tương đối $\frac{60}{50}$ của bước đó — nếu các bước sau thật sự giữ nguyên.</p>
        focus: [1, 1, 2]
        say: "Câu hai, đi từng bước. 5000 nhân 0 phẩy 4 được 2000, nhân 0 phẩy 6 được 1200, nhân tiếp 0 phẩy 6 được 720 đơn. So với 600 thì tăng 20 phần trăm, đúng bằng mức cải thiện tương đối của bước đó, với điều kiện các bước sau thật sự giữ nguyên."

