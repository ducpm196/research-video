    say: Mời bạn tự thực hành bài số năm phân tích phễu chuyển đổi nhiều bước từ dữ liệu đọc động. Nhiệm vụ đầu tiên là tính phần trăm chuyển đổi giữa từng cặp bước liền kề trong danh sách bốn bước. Nhiệm vụ tiếp theo là tính tỉ lệ hoàn thành trọn phễu từ đầu vào đến bước cuối cùng. Đồng thời bạn ước lượng lại tỉ lệ toàn phễu khi nâng riêng bước thứ hai lên mức giả định. Đọc kỹ cấu trúc tệp mẫu, giữ nguyên tên ba khoá đầu ra rồi chạy kiểm thử cùng hai ca kiểm ẩn.
