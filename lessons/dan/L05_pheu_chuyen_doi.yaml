  steps:
  - show: <table class='t'><tr><th>Thực hành DAN:L05</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/DAN/L05/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Phễu chuyển đổi từng bước, toàn phễu và ước lượng cải thiện bước 2</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>step_pct=... overall=...% overall_step2_38=...%</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh DAN L05 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
    say: Bây giờ đến phần bạn tự thực hành và chấm thật trên máy. Hãy mở tệp đề bài, đọc kỹ dữ liệu vào cùng khuôn đầu ra cần in, tự viết chương trình rồi gõ lệnh dòng lệnh để tự chấm trước khi xem kết quả.
    focus:
    - '1.2'
    - '1.3'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp (1 dòng)</b></p><div class="code"><div>step_pct=[45.0, 30.0, 25.0] overall=3.4% overall_step2_38=4.3%</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>[bt for x in ds]</code></td><td>Duyệt qua từng phần tử <code>x</code> trong <code>ds</code> để tạo danh sách mới</td></tr><tr><td><code>[a, b, ...]</code></td><td>Danh sách nhiều phần tử theo thứ tự (lấy phần tử thứ <code>i</code> bằng <code>ds[i]</code>, đếm từ <code>0</code>)</td></tr><tr><td><code>ds[-1]</code></td><td>Truy cập ô hàng <code>i</code> cột <code>j</code>, phần tử cuối <code>[-1]</code>, hoặc cắt lát danh sách/chuỗi</td></tr><tr><td><code>range(...), round(x, n)</code></td><td>Hàm/phương thức dựng sẵn thường dùng (sắp xếp, cực trị, ghép đôi, đánh chỉ số, làm tròn, lấy/thêm phần tử)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 1) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>f&quot;...{:.1f}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 2) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <p><b>Lời giải tham khảo DAN:L05 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>s = [8000, 3600, 1080, 270]</div><div>rates = [round(s[i+1]/s[i]*100, 1) for i in range(3)]</div><div>overall = s[-1] / s[0] * 100</div><div>proj = (rates[0] / 100) * 0.38 * (rates[2] / 100) * 100</div><div>print(f"step_pct={rates} overall={overall:.1f}% overall_step2_38={proj:.1f}%")</div></div>
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">định nghĩa từng bước và đơn vị đếm</span><span class="a">→</span>
      <span class="n">tỉ lệ từng bước, toàn phễu là tích</span><span class="a">→</span>
      <span class="n">kiểm thứ tự thời gian, giới hạn thời gian</span><span class="a">→</span>
      <span class="n">ước lượng tác động khi sửa một bước</span></div>
    say: Tổng kết lại, hãy định nghĩa từng bước và đơn vị đếm, tính tỉ lệ từng bước, và toàn phễu là tích của chúng. Kiểm thứ tự thời gian, giới hạn thời gian, rồi ước lượng tác động khi sửa một bước. Phễu chuyển đổi biến một con số kết quả cuối cùng thành chuỗi từng bước đo lường cụ thể từ lúc nhìn thấy sản phẩm tới khi hoàn tất thanh toán. Để con số tỉ lệ từng chặng có ý nghĩa cải tiến sản phẩm, cùng một đơn vị đếm phải được giữ cố định từ đầu tới cuối, thường là mã người dùng hoặc mã phiên duy nhất. Bước kế sau bắt buộc xảy ra sau bước trước theo dấu thời gian và nằm trong cửa sổ thời gian hợp lý nhằm tránh ghép nhầm hành động cũ sang lượt mua mới. Nhìn vào đúng nút thắt có tỉ lệ rơi cao nhất kết hợp ước lượng biên độ cải thiện giúp đội sản phẩm ưu tiên đúng tính năng tạo doanh thu thực tế. Mỗi khi số lượng ở một bước tăng bất thường vượt bước trước, hãy kiểm tra ngay bộ lọc thứ tự sự kiện và trùng lặp bản ghi. Mỗi bước chuyển tiếp trong phễu cần ghi rõ định nghĩa kỹ thuật và tên sự kiện tương ứng trên ứng dụng và trang chủ. Khi tỉ lệ rớt ở bước thanh toán tăng đột biến trong một ngày, hãy tách riêng theo hệ điều hành và phiên bản ứng dụng trước tiên. Cách khoanh vùng có trật tự này thường tìm ra đúng nút thắt chỉ sau vài phút kiểm tra. Một phễu chuyển đổi rõ ràng luôn trả lời hai câu hỏi là khách hàng rời đi ở bước nào nhiều nhất và chi phí sửa bước đó là bao nhiêu. Nếu tỉ lệ chuyển đổi chung giảm nhưng bước cuối cùng vẫn giữ nguyên, nguyên nhân thường nằm ở tệp người truy cập đầu vào bị loãng chất lượng. Kết hợp phân tách theo nguồn chiến dịch giúp đội sản phẩm không sửa nhầm màn hình thanh toán khi lỗi thuộc về quảng cáo. Ngoài ra cần kiểm tra đều dấu thời gian trên thiết bị ngoại tuyến để tránh bỏ sót giao dịch trễ. Nhờ ghi rõ đơn vị đếm đồng nhất ở mỗi bước, báo cáo phễu luôn minh bạch trước mọi buổi rà soát kỹ thuật. Chỉ cần lệch một bước đếm, hiệu quả toàn chiến dịch dễ bị hiểu nhầm hoàn toàn. So sánh phễu theo từng phân khúc thiết bị và nguồn truy cập luôn cho kết quả sắc nét và hữu ích hơn.
  - show: |
      <div class="box key"><b>Tư duy:</b> chia một con số to thành <b>chuỗi các tỉ lệ nhỏ</b> — mỗi tỉ lệ là một chỗ có thể sửa.</div>
      <p class="note"><b>Hai mức quy mô:</b> Phễu mẫu 10 000 người → 300 đơn hàng tính nhanh trong vài mi-li-giây; ở phễu thật 50 triệu lượt xem (vài triệu người dùng) mỗi ngày, lọc sai thứ tự thời gian hay đếm theo lượt thay vì người tạo độ chênh hàng trăm nghìn giao dịch.</p>
    say: Điều cần mang theo, hãy chia một con số to thành chuỗi các tỉ lệ nhỏ, vì mỗi tỉ lệ là một chỗ có thể sửa. Phễu mẫu 10 nghìn người ra 300 đơn chạy trong vài mi li giây. Trên 50 triệu lượt xem mỗi ngày, lọc sai thứ tự thời gian gây lệch hàng trăm nghìn đơn.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: |
      <p class="note">Bài sau (bài 6): <b>chuỗi thời gian</b> — xu hướng, mùa vụ, trung bình trượt.</p>
    forward_ref: true
    say: Ở bài sau, bài 6, ta học chuỗi thời gian, với xu hướng, mùa vụ, và trung bình trượt. Hẹn gặp bạn ở bài tiếp theo.
