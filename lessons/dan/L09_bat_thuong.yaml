id: L09
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 9 — Phát hiện bất thường trong chỉ số"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dan.yaml L09; audit/dan/verify_dan.py L09; P. Rousseeuw, C. Croux, Alternatives to the Median Absolute Deviation (JASA 1993); B. Iglewicz, D. Hoaglin, How to Detect and Handle Outliers (1993) — điểm z bền vững; DSC bài 4; bài 6"
assumes: [arith, frac, cdot, approx]
# Quy ước: điểm z = (x − trung bình) / độ lệch chuẩn (alg.z_score); điểm bền vững = (x − trung vị) / (1,4826 · MAD), MAD = trung vị của |x − trung vị|
#   (alg.robust_z). Ngưỡng 3 là quy ước kinh nghiệm, không phải định lý. Tên MAD chỉ trên màn hình; lời đọc “độ lệch tuyệt đối trung vị”.
objectives:
  - "Dùng trung vị và độ lệch tuyệt đối trung vị thay cho trung bình và độ lệch chuẩn"
  - "So với cùng kỳ để tránh báo động vì mùa vụ"
  - "Đặt ngưỡng cảnh báo có lý do"
asr_reviewed:
  - {sentence: "Bước hai, điểm z.", reason: "ASR chép “Bước 2. Điểm Jack” (0.75): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đáp án câu một, ta so trị tuyệt đối của điểm z với ngưỡng, trị tuyệt đối của âm 2 phẩy 44 là 2 phẩy 44, nhỏ hơn 3.", reason: "ASR chép “Đáp án câu 1, ta so trị tuyệt đối của điểm dép với ngưỡng, trị tuyệt đối của âm 2,44 là 2,44, nhỏ hơn 3.” (0.97): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hệ số 1 phẩy 4826 làm điểm bền vững xấp xỉ điểm z khi dữ liệu có phân phối chuẩn và không có ngoại lai.", reason: "ASR chép “Hệ số 1,4826 làm điểm bền vững sắp xỉ điểm dép khi dữ liệu có phân phối chuẩn và không có ngoại lai.” (0.935): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: xấp/sắp — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đơn tăng gấp 5 mà hệ thống không báo"
    checks:
      - "round(alg.z_score([100, 102, 98, 101, 99, 103, 100, 500], 500), 2) == 2.65"
    steps:
      - show: |
          <p>Bảy ngày đơn hàng quanh 100, ngày thứ tám vọt lên 500 — một máy quét tự động đặt đơn giả. Hệ thống cảnh báo “báo khi điểm z vượt 3” <b>im lặng</b>: điểm z của 500 chỉ 2,65. Chính con số bất thường đã kéo độ lệch chuẩn lên và che mình đi.</p>
          <div class="box key">Hôm nay: <b>phát hiện bất thường</b> bằng thước đo bền vững, và so với cùng kỳ.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, bảy ngày đơn hàng quanh 100, ngày thứ tám vọt lên 500, vì một máy quét tự động đặt đơn giả. Hệ thống cảnh báo khi điểm z vượt 3 lại im lặng, vì điểm z của 500 chỉ 2 phẩy 65. Chính con số bất thường đã kéo độ lệch chuẩn lên và che mình đi. Hôm nay ta học phát hiện bất thường bằng thước đo bền vững, và so với cùng kỳ."

  - id: prereq
    kind: prereq
    title: "Ôn lại: độ lệch chuẩn, và trung vị của độ lệch"
    checks:
      - "__import__('statistics').pstdev([98, 98, 102, 102]) == 2.0 and (104 - 100) / 2 == 2"
      - "__import__('statistics').median([1, 2, 3, 4, 100]) == 3 and __import__('statistics').median([abs(x - 3) for x in [1, 2, 3, 4, 100]]) == 1"
    steps:
      - show: |
          <table class="t"><tr><th>dữ liệu 98, 98, 102, 102</th><th>tính</th></tr>
          <tr><td>trung bình</td><td>100</td></tr>
          <tr><td>độ lệch so với trung bình</td><td>$-2, -2, +2, +2$; bình phương đều bằng 4</td></tr>
          <tr><td>độ lệch chuẩn</td><td>$\sqrt{\frac{4 + 4 + 4 + 4}{4}} = 2$</td></tr>
          <tr><td>điểm z của 104</td><td>$\frac{104 - 100}{2} = 2$: cách trung bình 2 lần độ lệch chuẩn</td></tr></table>
        introduces: [sqrt]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Trước hết, ôn lại độ lệch chuẩn ở khoá Khoa học dữ liệu, với bốn số 98, 98, 102, 102. Trung bình là 100. Mỗi số lệch khỏi trung bình 2, bình phương đều bằng 4. Lấy trung bình của các bình phương được 4, rồi căn bậc hai, nên độ lệch chuẩn là 2. Điểm z của 104 bằng 104 trừ 100 chia 2, bằng 2, tức cách trung bình 2 lần độ lệch chuẩn."
      - show: |
          <table class="t"><tr><th>dữ liệu 1, 2, 3, 4, 100</th><th>tính</th></tr>
          <tr><td>trung vị</td><td>3</td></tr>
          <tr><td>$\lvert x - 3 \rvert$</td><td>2, 1, 0, 1, 97 → sắp: 0, 1, <b>1</b>, 2, 97</td></tr>
          <tr><td>trung vị của các độ lệch</td><td>1 — số 100 gần như không làm nó đổi</td></tr></table>
        introduces: [absval]
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Thứ hai, trung vị của độ lệch, với năm số 1, 2, 3, 4 và 100. Trung vị là 3. Trị tuyệt đối của từng số trừ 3 là 2, 1, 0, 1 và 97, sắp lại thì số giữa là 1. Vậy trung vị của các độ lệch bằng 1, và số 100 rất lớn gần như không làm nó thay đổi."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: điểm z và điểm bền vững"
    steps:
      - show: |
          <table class="t"><tr><th>thước đo</th><th>công thức</th><th>bị ngoại lai ảnh hưởng?</th></tr>
          <tr><td><b>điểm z</b></td><td>$\frac{x - \text{trung bình}}{\text{độ lệch chuẩn}}$</td><td><b>có</b> — cả tử và mẫu</td></tr>
          <tr><td><b>độ lệch tuyệt đối trung vị</b> (MAD)</td><td>trung vị của $\lvert x - \text{trung vị} \rvert$</td><td>gần như không</td></tr>
          <tr><td><b>điểm bền vững</b></td><td>$\frac{x - \text{trung vị}}{1{,}4826 \cdot \text{MAD}}$</td><td>gần như không</td></tr></table>
          <p>Hệ số 1,4826 làm điểm bền vững xấp xỉ điểm z khi dữ liệu có phân phối chuẩn và không có ngoại lai.</p>
        introduces: [absval]
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng so ba thước đo. Điểm z bằng x trừ trung bình, chia độ lệch chuẩn, và bị ngoại lai ảnh hưởng ở cả tử lẫn mẫu. Độ lệch tuyệt đối trung vị là trung vị của trị tuyệt đối x trừ trung vị, gần như không bị ngoại lai ảnh hưởng. Điểm bền vững bằng x trừ trung vị, chia 1 phẩy 4826 nhân độ lệch tuyệt đối trung vị, cũng gần như không bị ảnh hưởng. Hệ số 1 phẩy 4826 làm điểm bền vững xấp xỉ điểm z khi dữ liệu có phân phối chuẩn và không có ngoại lai."

  - id: intuition
    kind: intuition
    title: "Vùng “bình thường” bị chính ngoại lai thổi phồng"
    checks:
      - "(lambda v: round(sum(v) / 8 + 3 * __import__('statistics').pstdev(v)) == 547 and round(100.5 - 3 * 1.4826 * 1.5, 1) == 93.8 and round(100.5 + 3 * 1.4826 * 1.5, 1) == 107.2)([100, 102, 98, 101, 99, 103, 100, 500])"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><g fill="#1f2937" font-size="22"><rect x="110" y="88" width="957" height="44" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><line x1="110" y1="110" x2="1090" y2="110" stroke="#6b7280" stroke-width="2"/><circle cx="285" cy="110" r="8" fill="#2a78d6"/><circle cx="288" cy="110" r="8" fill="#2a78d6"/><circle cx="282" cy="110" r="8" fill="#2a78d6"/><circle cx="287" cy="110" r="8" fill="#2a78d6"/><circle cx="283" cy="110" r="8" fill="#2a78d6"/><circle cx="290" cy="110" r="8" fill="#2a78d6"/><circle cx="285" cy="110" r="8" fill="#2a78d6"/><circle cx="985" cy="110" r="8" fill="#eb6834"/><text x="110" y="70" fill="#b91c1c" font-weight="bold">trung bình ± 3 lần độ lệch chuẩn</text><text x="1115" y="118" fill="#b91c1c">500 nằm trong: không báo</text><rect x="274" y="228" width="23" height="44" fill="#a7f3d0" stroke="#059669" stroke-width="2"/><line x1="110" y1="250" x2="1090" y2="250" stroke="#6b7280" stroke-width="2"/><circle cx="285" cy="250" r="8" fill="#2a78d6"/><circle cx="288" cy="250" r="8" fill="#2a78d6"/><circle cx="282" cy="250" r="8" fill="#2a78d6"/><circle cx="287" cy="250" r="8" fill="#2a78d6"/><circle cx="283" cy="250" r="8" fill="#2a78d6"/><circle cx="290" cy="250" r="8" fill="#2a78d6"/><circle cx="285" cy="250" r="8" fill="#2a78d6"/><circle cx="985" cy="250" r="8" fill="#eb6834"/><text x="110" y="210" fill="#059669" font-weight="bold">trung vị ± 3 lần độ lệch bền vững</text><text x="1115" y="258" fill="#059669">500 nằm rất xa: báo</text><text x="110" y="335" text-anchor="middle" font-size="20">0</text><text x="285" y="335" text-anchor="middle" font-size="20">100</text><text x="985" y="335" text-anchor="middle" font-size="20">500</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình đặt tám ngày lên một trục số, bảy chấm xanh dồn quanh 100 và chấm cam ở 500. Hàng trên, vùng bình thường là trung bình cộng trừ 3 lần độ lệch chuẩn. Nhưng 500 đã kéo cả trung bình lẫn độ lệch chuẩn lên, nên vùng đỏ phình ra tới khoảng 547 và nuốt luôn chấm cam. Hàng dưới dùng trung vị và độ lệch bền vững, vùng lục chỉ từ khoảng 93 phẩy 8 tới 107 phẩy 2. Chấm cam nằm rất xa vùng đó, nên bị bắt ngay."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tám ngày, một ngày 500"
    checks:
      - "(lambda v: (round(sum(v) / 8, 1), round(__import__('statistics').pstdev(v), 1), round(alg.z_score(v, 500), 2), __import__('statistics').median(v), round(alg.robust_z(v, 500), 1)))([100, 102, 98, 101, 99, 103, 100, 500]) == (150.4, 132.2, 2.65, 100.5, 179.6)"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>giá trị</th></tr>
          <tr><td>dữ liệu</td><td>100, 102, 98, 101, 99, 103, 100, 500</td></tr>
          <tr><td>trung bình</td><td>$\frac{1203}{8} \approx 150{,}4$ — bị 500 kéo lên</td></tr></table>
          <p><b>Bước 1</b> — trung bình.</p>
        focus: ["1.2", "1.3"]
        say: "Bước một, dữ liệu là tám ngày, bảy ngày quanh 100 và một ngày 500. Cộng lại được 1203, chia 8, trung bình khoảng 150 phẩy 4, cao hơn mọi ngày bình thường vì bị 500 kéo lên."
      - show: |
          <table class="t"><tr><th>bước</th><th>giá trị</th></tr>
          <tr><td>độ lệch chuẩn</td><td>≈ 132,2 — cũng bị 500 kéo lên</td></tr>
          <tr><td>điểm z của 500</td><td>$\frac{500 - 150{,}4}{132{,}2} \approx 2{,}65$ → dưới ngưỡng 3, <b>bỏ sót</b></td></tr></table>
          <p><b>Bước 2</b> — điểm z.</p>
        focus: [1, "1.2", "1.3"]
        say: "Bước hai, điểm z. Độ lệch chuẩn khoảng 132 phẩy 2, cũng bị 500 kéo lên. Điểm z của 500 bằng 500 trừ 150 phẩy 4, chia 132 phẩy 2, chỉ khoảng 2 phẩy 65, dưới ngưỡng 3, nên bị bỏ sót."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>giá trị</th></tr>
          <tr><td>trung vị (sắp xếp, hai số giữa 100 và 101)</td><td>100,5</td></tr>
          <tr><td>$\lvert x - 100{,}5 \rvert$ đã sắp</td><td>0,5; 0,5; 0,5; <b>1,5; 1,5</b>; 2,5; 2,5; 399,5</td></tr>
          <tr><td>độ lệch tuyệt đối trung vị</td><td>1,5</td></tr></table>
          <p><b>Bước 3</b> — trung vị và độ lệch tuyệt đối trung vị.</p>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước ba, tính trung vị và độ lệch tuyệt đối trung vị. Sắp tám số lại, hai số giữa là 100 và 101, nên trung vị là 100 phẩy 5. Trị tuyệt đối các độ lệch so với 100 phẩy 5, sắp lại, có hai số giữa đều là 1 phẩy 5. Vậy độ lệch tuyệt đối trung vị là 1 phẩy 5, và con số 399 phẩy 5 của ngày bất thường không kéo được nó."
      - show: |
          <p><b>Bước 4</b> — điểm bền vững của 500: $\frac{500 - 100{,}5}{1{,}4826 \cdot 1{,}5} \approx \hl{179{,}6}$ → rõ ràng bất thường.</p>
        say: "Bước bốn, điểm bền vững của 500 bằng 500 trừ 100 phẩy 5, chia 1 phẩy 4826 nhân 1 phẩy 5, khoảng 179 phẩy 6, rõ ràng là bất thường."

  - id: check
    kind: check
    title: "Tự kiểm: chỉ dùng các ngày trước, chưa có 500"
    checks:
      - "(lambda h: (sum(h), round(sum(h) / 7, 2), round(__import__('statistics').pstdev(h), 2), round((500 - sum(h) / 7) / __import__('statistics').pstdev(h))))([100, 102, 98, 101, 99, 103, 100]) == (703, 100.43, 1.59, 251)"
      - "round(sum([100, 102, 98, 101, 99, 103, 100, 500]) / 8, 1) == 150.4 and sum([100, 102, 98, 101, 99, 103, 100, 500]) == 1203"
    steps:
      - show: |
          <table class="t"><tr><th>tính trên 7 ngày trước</th><th>giá trị</th></tr>
          <tr><td>trung bình</td><td>$\frac{703}{7} \approx 100{,}43$</td></tr>
          <tr><td>độ lệch chuẩn</td><td>≈ 1,59</td></tr>
          <tr><td>điểm z của 500 so với lịch sử</td><td>$\frac{500 - 100{,}43}{1{,}59} \approx 251$ → báo ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Kiểm bằng đường khác, ta tính điểm z với cửa sổ chỉ gồm 7 ngày trước, chưa có ngày 500. Trung bình của 7 ngày là 703 chia 7, khoảng 100 phẩy 43. Độ lệch chuẩn chỉ khoảng 1 phẩy 59. Lúc này điểm z của 500 khoảng 251, cũng báo ngay như điểm bền vững. Vậy kết luận khớp, và lỗi ở bước hai đúng là do ngày bất thường tự kéo thước đo của chính nó."


  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, cả người mới lẫn người đã đi làm"
    checks:
      - "round(alg.z_score([100, 102, 98, 101, 99, 103, 100, 500], 500), 2) == 2.65 and round(alg.robust_z([100, 102, 98, 101, 99, 103, 100, 500], 500), 1) == 179.6 and 100 * 0.01 == 1"
      - "__import__('statistics').median([0, 0, 0, 0, 0, 1, 0]) == 0 and __import__('statistics').median([abs(x) for x in [0, 0, 0, 0, 0, 1, 0]]) == 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đo bất thường bằng trung bình và độ lệch chuẩn <b class="red">(ngoại lai tự che mình)</b>
          <br><span class="note">Như ví dụ: điểm z 2,65 so với điểm bền vững 179,6. Dùng trung vị và độ lệch tuyệt đối trung vị, tính trên một cửa sổ <b>trước</b> ngày đang xét.</span></div>
        say: "Lỗi thứ nhất, đo bất thường bằng trung bình và độ lệch chuẩn, nên ngoại lai tự che mình, như ví dụ có điểm z 2 phẩy 65 so với điểm bền vững 179 phẩy 6. Hãy dùng trung vị và độ lệch tuyệt đối trung vị, tính trên một cửa sổ trước ngày đang xét."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> So với trung bình tuần khi có mùa vụ <b class="red">(báo động mỗi cuối tuần)</b>
          <br><span class="note">Cuối tuần luôn cao hơn (bài 6). So với <b>cùng thứ</b> các tuần trước, hoặc so phần dư sau khi bỏ mùa vụ.</span></div>
        say: "Lỗi thứ hai, so với trung bình tuần khi có mùa vụ, nên báo động mỗi cuối tuần. Cuối tuần luôn cao hơn các ngày khác. Hãy so với cùng thứ các tuần trước, hoặc so phần dư sau khi bỏ mùa vụ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Ngưỡng quá thấp trên quá nhiều chỉ số <b class="red">(báo động giả liên tục)</b>
          <br><span class="note">100 chỉ số, mỗi chỉ số báo giả 1% mỗi ngày: trung bình 1 báo động giả mỗi ngày. Ít chỉ số quan trọng, ngưỡng có lý do, kiểm lại trước khi gọi người dậy.</span></div>
        say: "Lỗi thứ ba, đặt ngưỡng quá thấp trên quá nhiều chỉ số, nên báo động giả liên tục. Với 100 chỉ số, mỗi chỉ số báo giả 1 phần trăm mỗi ngày, thì trung bình có 1 báo động giả mỗi ngày. Hãy theo dõi ít chỉ số quan trọng, đặt ngưỡng có lý do, và kiểm lại trước khi gọi người dậy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng điểm bền vững cho chỉ số <b>phần lớn bằng 0</b> <b class="red">(lỗi của người đã đi làm)</b>
          <br><span class="note">Số đơn lỗi mỗi ngày: 0, 0, 0, 0, 0, 1, 0.</span></div>
          <table class="t"><tr><th>bước</th><th>giá trị</th></tr>
          <tr><td>trung vị</td><td>0</td></tr>
          <tr><td>độ lệch tuyệt đối trung vị</td><td>trung vị của 0, 0, 0, 0, 0, 1, 0 $= 0$</td></tr>
          <tr><td>điểm bền vững của ngày có 1 lỗi</td><td class="red">$\frac{1 - 0}{1{,}4826 \cdot 0}$: chia cho 0</td></tr></table>
          <p class="note">Mọi ngày khác 0 đều thành “vô cùng bất thường”. Người làm nghề đặt một mức sàn cho mẫu số, hoặc dùng ngưỡng theo số đếm (ví dụ “từ 5 lỗi một ngày”).</p>
        focus: [1, 1, "2.2", "2.3", "2.4", 3]
        say: "Lỗi thứ tư là lỗi của người đã đi làm, dùng điểm bền vững cho một chỉ số phần lớn bằng 0. Ví dụ số đơn lỗi mỗi ngày là 0, 0, 0, 0, 0, 1, 0. Trung vị là 0. Độ lệch tuyệt đối trung vị cũng là 0, vì phần lớn độ lệch bằng 0. Điểm bền vững của ngày có 1 lỗi phải chia cho 0, nên không xác định. Mọi ngày khác 0 đều thành vô cùng bất thường, nên người làm nghề đặt một mức sàn cho mẫu số, hoặc dùng ngưỡng theo số đếm, ví dụ từ 5 lỗi một ngày."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda q: (round(alg.z_score(q, 10), 2), __import__('statistics').median(q), round(alg.robust_z(q, 10), 1)))([50, 52, 49, 51, 48, 50, 10]) == (-2.44, 50, -27.0) and 100 * 0.01 == 1"
      - "10 - 50 == -40 and round(-40 / 1.4826) == -27 and abs(-2.44) < 3"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>7 ngày: 50, 52, 49, 51, 48, 50, 10 (ngày cuối hệ thống thanh toán lỗi). Điểm z của 10 là −2,44. Với ngưỡng 3, có báo không?</td></tr>
          <tr><td>2</td><td>Trung vị 50, độ lệch tuyệt đối trung vị 1. Tính điểm bền vững của 10.</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, có 7 ngày là 50, 52, 49, 51, 48, 50, và 10 vào ngày cuối khi hệ thống thanh toán lỗi. Điểm z của 10 là âm 2 phẩy 44. Với ngưỡng 3, có báo không? Câu hai, trung vị là 50 và độ lệch tuyệt đối trung vị là 1. Hãy tính điểm bền vững của 10. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① So trị tuyệt đối với ngưỡng: $\lvert -2{,}44 \rvert = 2{,}44 \lt 3$.</p>
          <p><b>Không báo</b> — sự cố thanh toán bị bỏ sót.</p>
        focus: [1, 2]
        say: "Đáp án câu một, ta so trị tuyệt đối của điểm z với ngưỡng, trị tuyệt đối của âm 2 phẩy 44 là 2 phẩy 44, nhỏ hơn 3. Vì vậy hệ thống không báo, và sự cố thanh toán bị bỏ sót."
      - show: |
          <p>② Tử số: $10 - 50 = -40$. Mẫu số: $1{,}4826 \cdot 1 = 1{,}4826$.</p>
          <p>$\frac{-40}{1{,}4826} \approx \hl{-27}$; trị tuyệt đối 27 vượt xa 3 → báo ngay.</p>
        focus: [1, 2]
        say: "Câu hai, tử số là 10 trừ 50 bằng âm 40, mẫu số là 1 phẩy 4826 nhân 1. Chia ra khoảng âm 27, trị tuyệt đối 27 vượt xa 3, nên báo ngay."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ngoại lai làm phình độ lệch chuẩn</span><span class="a">→</span>
          <span class="n">dùng trung vị và độ lệch tuyệt đối trung vị</span><span class="a">→</span>
          <span class="n">so cùng kỳ khi có mùa vụ</span><span class="a">→</span>
          <span class="n">ít chỉ số, ngưỡng có lý do</span></div>
        say: "Tổng kết lại, ngoại lai làm phình độ lệch chuẩn, nên hãy dùng trung vị và độ lệch tuyệt đối trung vị. So cùng kỳ khi có mùa vụ, theo dõi ít chỉ số, và đặt ngưỡng có lý do."
      - show: |
          <div class="box key"><b>Tư duy:</b> thước đo dùng để <b>tìm</b> điều bất thường không được để chính điều bất thường <b>làm hỏng</b>.</div>
        say: "Điều cần mang theo, thước đo dùng để tìm điều bất thường không được để chính điều bất thường làm hỏng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>tỉ lệ trên mẫu nhỏ</b> — khoảng tin cậy và xếp hạng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học tỉ lệ trên mẫu nhỏ, với khoảng tin cậy và cách xếp hạng. Hẹn gặp bạn ở bài tiếp theo."
