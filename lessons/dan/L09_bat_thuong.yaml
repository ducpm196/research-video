      cx="985" cy="110" r="8" fill="#eb6834"/><text x="110" y="70" fill="#b91c1c" font-weight="bold">trung bình ± 3 lần độ
      lệch chuẩn</text><text x="1115" y="118" fill="#b91c1c">500 nằm trong: không báo</text><rect x="274" y="228" width="23"
      height="44" fill="#a7f3d0" stroke="#059669" stroke-width="2"/><line x1="110" y1="250" x2="1090" y2="250" stroke="#6b7280"
      stroke-width="2"/><circle cx="285" cy="250" r="8" fill="#2a78d6"/><circle cx="288" cy="250" r="8" fill="#2a78d6"/><circle
      cx="282" cy="250" r="8" fill="#2a78d6"/><circle cx="287" cy="250" r="8" fill="#2a78d6"/><circle cx="283" cy="250" r="8"
      fill="#2a78d6"/><circle cx="290" cy="250" r="8" fill="#2a78d6"/><circle cx="285" cy="250" r="8" fill="#2a78d6"/><circle
      cx="985" cy="250" r="8" fill="#eb6834"/><text x="110" y="210" fill="#059669" font-weight="bold">trung vị ± 3 lần độ
      lệch bền vững</text><text x="1115" y="258" fill="#059669">500 nằm rất xa: báo</text><text x="110" y="335" text-anchor="middle"
      font-size="20">0</text><text x="285" y="335" text-anchor="middle" font-size="20">100</text><text x="985" y="335" text-anchor="middle"
      font-size="20">500</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình đặt tám ngày lên một trục số, bảy chấm xanh dồn quanh 100 và chấm cam ở 500. Hàng trên, vùng bình thường là
      trung bình cộng trừ 3 lần độ lệch chuẩn. Nhưng 500 đã kéo cả trung bình lẫn độ lệch chuẩn lên, nên vùng đỏ phình ra
      tới khoảng 547 và nuốt luôn chấm cam. Hàng dưới dùng trung vị và độ lệch bền vững, vùng lục chỉ từ khoảng 93 phẩy 8
      tới 107 phẩy 2. Chấm cam nằm rất xa vùng đó, nên bị bắt ngay.
- id: example
  kind: example
  title: Tám ngày, một ngày 500
  checks:
  - '(lambda v: (round(sum(v) / 8, 1), round(__import__(''statistics'').pstdev(v), 1), round(alg.z_score(v, 500), 2), __import__(''statistics'').median(v),
    round(alg.robust_z(v, 500), 1)))([100, 102, 98, 101, 99, 103, 100, 500]) == (150.4, 132.2, 2.65, 100.5, 179.6)'
  steps:
  - show: '<table class="t"><tr><th>bước</th><th>giá trị</th></tr>

      <tr><td>dữ liệu</td><td>100, 102, 98, 101, 99, 103, 100, 500</td></tr>

      <tr><td>trung bình</td><td>$\frac{1203}{8} \approx 150{,}4$ — bị 500 kéo lên</td></tr></table>

      <p><b>Bước 1</b> — trung bình.</p>

      '
    focus:
    - '1.2'
    - '1.3'
    say: Bước một, dữ liệu là tám ngày, bảy ngày quanh 100 và một ngày 500. Cộng lại được 1203, chia 8, trung bình khoảng
      150 phẩy 4, cao hơn mọi ngày bình thường vì bị 500 kéo lên.
  - show: '<table class="t"><tr><th>bước</th><th>giá trị</th></tr>

      <tr><td>độ lệch chuẩn</td><td>≈ 132,2 — cũng bị 500 kéo lên</td></tr>

      <tr><td>điểm z của 500</td><td>$\frac{500 - 150{,}4}{132{,}2} \approx 2{,}65$ → dưới ngưỡng 3, <b>bỏ sót</b></td></tr></table>

      <p><b>Bước 2</b> — điểm z.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Bước hai, điểm z. Độ lệch chuẩn khoảng 132 phẩy 2, cũng bị 500 kéo lên. Điểm z của 500 bằng 500 trừ 150 phẩy 4, chia
      132 phẩy 2, chỉ khoảng 2 phẩy 65, dưới ngưỡng 3, nên bị bỏ sót.
  - clear: true
    show: '<table class="t"><tr><th>bước</th><th>giá trị</th></tr>

      <tr><td>trung vị (sắp xếp, hai số giữa 100 và 101)</td><td>100,5</td></tr>

      <tr><td>$\lvert x - 100{,}5 \rvert$ đã sắp</td><td>0,5; 0,5; 0,5; <b>1,5; 1,5</b>; 2,5; 2,5; 399,5</td></tr>

      <tr><td>độ lệch tuyệt đối trung vị</td><td>1,5</td></tr></table>

      <p><b>Bước 3</b> — trung vị và độ lệch tuyệt đối trung vị.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Bước ba, tính trung vị và độ lệch tuyệt đối trung vị. Sắp tám số lại, hai số giữa là 100 và 101, nên trung vị là
      100 phẩy 5. Trị tuyệt đối các độ lệch so với 100 phẩy 5, sắp lại, có hai số giữa đều là 1 phẩy 5. Vậy độ lệch tuyệt
      đối trung vị là 1 phẩy 5, và con số 399 phẩy 5 của ngày bất thường không kéo được nó.
  - show: '<p><b>Bước 4</b> — điểm bền vững của 500: $\frac{500 - 100{,}5}{1{,}4826 \cdot 1{,}5} \approx \hl{179{,}6}$ → rõ
      ràng bất thường.</p>

      '
    say: Bước bốn, điểm bền vững của 500 bằng 500 trừ 100 phẩy 5, chia 1 phẩy 4826 nhân 1 phẩy 5, khoảng 179 phẩy 6, rõ ràng
      là bất thường.
  - clear: true
    show: '<p><b>Minh hoạ Python tính trung vị và điểm bền vững không bị ngoại lai kéo</b></p><div class="code"><div>xs =
      sorted([100, 102, 98, 101, 99, 103, 100, 500])</div><div>med = (xs[3] + xs[4]) / 2</div><div>mad = sorted(abs(x - med)
      for x in xs)[3]</div><div>print(f"med={med} z_ben={(500 - med)/(1.4826 * mad):.1f}")</div><div style="color:#059669">#
      Kết quả: med=100.5 z_ben=224.6</div></div>'
    focus:
    - 1
    - 2
    say: Đoạn mã Python tính trung vị và độ lệch tuyệt đối trung vị rồi nhân hệ số 1 phẩy 4826. Ngày bất thường 500 nhận điểm
      bền vững vượt xa ngưỡng cảnh báo thay vì bị che lấp.
- id: check
  kind: check
  title: 'Tự kiểm: chỉ dùng các ngày trước, chưa có 500'
  checks:
  - '(lambda h: (sum(h), round(sum(h) / 7, 2), round(__import__(''statistics'').pstdev(h), 2), round((500 - sum(h) / 7) /
    __import__(''statistics'').pstdev(h))))([100, 102, 98, 101, 99, 103, 100]) == (703, 100.43, 1.59, 251)'
  - round(sum([100, 102, 98, 101, 99, 103, 100, 500]) / 8, 1) == 150.4 and sum([100, 102, 98, 101, 99, 103, 100, 500]) ==
    1203
  steps:
  - show: '<table class="t"><tr><th>tính trên 7 ngày trước</th><th>giá trị</th></tr>

      <tr><td>trung bình</td><td>$\frac{703}{7} \approx 100{,}43$</td></tr>

      <tr><td>độ lệch chuẩn</td><td>≈ 1,59</td></tr>

      <tr><td>điểm z của 500 so với lịch sử</td><td>$\frac{500 - 100{,}43}{1{,}59} \approx 251$ → báo ✓</td></tr></table>

      <p class="note"><b>So sánh hai quy mô:</b> Trên 8 ngày đủ thấy ngoại lai kéo lệch độ lệch chuẩn lên ~80 lần; khi giám
      sát 50 chỉ số × 1 000 ngày tự động mỗi giờ, trung vị và độ lệch tuyệt đối trung vị chạy xong trong vài mi-li-giây mà
      tránh bão cảnh báo giả.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
    - 2
    - 2
    say: Kiểm bằng đường khác, ta tính điểm z với cửa sổ chỉ gồm 7 ngày trước, chưa có ngày 500. Trung bình của 7 ngày là
      703 chia 7, khoảng 100 phẩy 43. Độ lệch chuẩn chỉ khoảng 1 phẩy 59. Lúc này điểm z của 500 khoảng 251, cũng báo ngay
      như điểm bền vững. Vậy kết luận khớp, và lỗi ở bước hai đúng là do ngày bất thường tự kéo thước đo của chính nó. Ở hai
      mức quy mô, trên 8 ngày ngoại lai kéo độ lệch chuẩn phình gấp khoảng 80 lần. Khi giám sát 50 chỉ số qua 1 nghìn ngày
      mỗi giờ, trung vị và độ lệch tuyệt đối chạy trong vài mi li giây mà tránh báo động giả.
  - clear: true
    show: <p><b>Đường khác 2 — So cùng kỳ theo thứ để tránh báo động giả mùa vụ:</b></p><table class="t"><tr><th>ngày</th><th>so
      với TB tuần (sai)</th><th>so với cùng thứ tuần trước</th></tr><tr><td>Thứ Bảy (bình thường cao)</td><td>+30% → <b class="red">báo
      nhầm</b></td><td>142 vs 140 (+1,4%) → ổn ✓</td></tr></table>
    focus:
    - 1
    - 2
    say: Ta kiểm thêm đường so cùng kỳ theo thứ trong tuần để tránh báo động mỗi cuối tuần. Ngày thứ Bảy đạt 142 so với 140
      thứ Bảy tuần trước chỉ chênh 1 phẩy 4 phần trăm nên hoàn toàn bình thường.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp, cả người mới lẫn người đã đi làm
  checks:
  - round(alg.z_score([100, 102, 98, 101, 99, 103, 100, 500], 500), 2) == 2.65 and round(alg.robust_z([100, 102, 98, 101,
    99, 103, 100, 500], 500), 1) == 179.6 and 100 * 0.01 == 1
  - __import__('statistics').median([0, 0, 0, 0, 0, 1, 0]) == 0 and __import__('statistics').median([abs(x) for x in [0, 0,
    0, 0, 0, 1, 0]]) == 0
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Đo bất thường bằng trung bình và độ lệch chuẩn <b class="red">(ngoại lai tự
      che mình)</b>

      <br><span class="note">Như ví dụ: điểm z 2,65 so với điểm bền vững 179,6, nhất là khi cửa sổ chỉ vài ngày. Dùng trung
      vị và độ lệch tuyệt đối trung vị, tính trên một cửa sổ <b>trước</b> ngày đang xét.</span></div>

      '
    say: Lỗi thứ nhất, đo bất thường bằng trung bình và độ lệch chuẩn, nên ngoại lai tự che mình, nhất là khi cửa sổ chỉ vài
      ngày. Như ví dụ có điểm z 2 phẩy 65 so với điểm bền vững 179 phẩy 6. Hãy dùng trung vị và độ lệch tuyệt đối trung vị,
      tính trên một cửa sổ trước ngày đang xét.
  - show: '<div class="box warn"><b>Lỗi 2.</b> So với trung bình tuần khi có mùa vụ <b class="red">(báo động mỗi cuối tuần)</b>

      <br><span class="note">Khi có mùa vụ tuần (mẫu lặp lại mỗi 7 ngày, bài 6), cuối tuần thường cao hơn hẳn. So với <b>cùng
      thứ</b> các tuần trước, hoặc so phần dư sau khi bỏ mùa vụ.</span></div>

      '
    say: Lỗi thứ hai, so với trung bình tuần khi có mùa vụ, nên báo động mỗi cuối tuần. Khi có mùa vụ tuần, tức mẫu lặp lại
      mỗi 7 ngày, cuối tuần thường cao hơn các ngày khác. Hãy so với cùng thứ các tuần trước, hoặc so phần dư sau khi bỏ mùa
      vụ.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Ngưỡng quá thấp trên quá nhiều chỉ số <b class="red">(báo động giả liên tục)</b>

      <br><span class="note">100 chỉ số, mỗi chỉ số báo giả 1% mỗi ngày: trung bình 1 báo động giả mỗi ngày. Ít chỉ số quan
      trọng, ngưỡng có lý do, kiểm lại trước khi gọi người dậy.</span></div>

      '
    say: Lỗi thứ ba, đặt ngưỡng quá thấp trên quá nhiều chỉ số, nên báo động giả liên tục. Với 100 chỉ số, mỗi chỉ số báo
      giả 1 phần trăm mỗi ngày, thì trung bình có 1 báo động giả mỗi ngày. Hãy theo dõi ít chỉ số quan trọng, đặt ngưỡng có
      lý do, và kiểm lại trước khi gọi người dậy.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Dùng điểm bền vững cho chỉ số <b>phần lớn bằng 0</b> <b class="red">(lỗi của
      người đã đi làm)</b>

      <br><span class="note">Số đơn lỗi mỗi ngày: 0, 0, 0, 0, 0, 1, 0.</span></div>

      <table class="t"><tr><th>bước</th><th>giá trị</th></tr>

      <tr><td>trung vị</td><td>0</td></tr>

      <tr><td>độ lệch tuyệt đối trung vị</td><td>trung vị của 0, 0, 0, 0, 0, 1, 0 $= 0$</td></tr>

      <tr><td>điểm bền vững của ngày có 1 lỗi</td><td class="red">$\frac{1 - 0}{1{,}4826 \cdot 0}$: chia cho 0</td></tr></table>

      <p class="note">Mọi ngày khác 0 đều thành “vô cùng bất thường”. Người làm nghề đặt một mức sàn cho mẫu số, hoặc dùng
      ngưỡng theo số đếm (ví dụ “từ 5 lỗi một ngày”).</p>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - 3
    say: Lỗi thứ tư là lỗi của người đã đi làm, dùng điểm bền vững cho một chỉ số phần lớn bằng 0. Ví dụ số đơn lỗi mỗi ngày
      là 0, 0, 0, 0, 0, 1, 0. Trung vị là 0. Độ lệch tuyệt đối trung vị cũng là 0, vì phần lớn độ lệch bằng 0. Điểm bền vững
      của ngày có 1 lỗi phải chia cho 0, nên không xác định. Mọi ngày khác 0 đều thành vô cùng bất thường, nên người làm nghề
      đặt một mức sàn cho mẫu số, hoặc dùng ngưỡng theo số đếm, ví dụ từ 5 lỗi một ngày.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '(lambda q: (round(alg.z_score(q, 10), 2), __import__(''statistics'').median(q), round(alg.robust_z(q, 10), 1)))([50,
    52, 49, 51, 48, 50, 10]) == (-2.44, 50, -27.0) and 100 * 0.01 == 1'
  - 10 - 50 == -40 and round(-40 / 1.4826) == -27 and abs(-2.44) < 3
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>7 ngày: 50, 52, 49, 51, 48, 50, 10 (ngày cuối hệ thống thanh toán lỗi). Điểm z của 10 là −2,44. Với
      ngưỡng 3, có báo không?</td></tr>

      <tr><td>2</td><td>Trung vị 50, độ lệch tuyệt đối trung vị 1. Tính điểm bền vững của 10.</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, có 7 ngày là 50, 52, 49, 51, 48, 50, và 10 vào ngày cuối khi hệ thống thanh
      toán lỗi. Điểm z của 10 là âm 2 phẩy 44. Với ngưỡng 3, có báo không? Câu hai, trung vị là 50 và độ lệch tuyệt đối trung
      vị là 1. Hãy tính điểm bền vững của 10. Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① So trị tuyệt đối với ngưỡng: $\lvert -2{,}44 \rvert = 2{,}44 \lt 3$.</p>

      <p><b>Không báo</b> — sự cố thanh toán bị bỏ sót.</p>

      '
    focus:
    - 1
    - 2
    say: Đáp án câu một, ta so trị tuyệt đối của điểm z với ngưỡng, trị tuyệt đối của âm 2 phẩy 44 là 2 phẩy 44, nhỏ hơn 3.
      Vì vậy hệ thống không báo, và sự cố thanh toán bị bỏ sót.
  - show: '<p>② Tử số: $10 - 50 = -40$. Mẫu số: $1{,}4826 \cdot 1 = 1{,}4826$.</p>

      <p>$\frac{-40}{1{,}4826} \approx \hl{-27}$; trị tuyệt đối 27 vượt xa 3 → báo ngay.</p>

      '
    focus:
    - 1
    - 2
    say: Câu hai, tử số là 10 trừ 50 bằng âm 40, mẫu số là 1 phẩy 4826 nhân 1. Chia ra khoảng âm 27, trị tuyệt đối 27 vượt
      xa 3, nên báo ngay.
