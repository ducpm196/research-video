- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">ngoại lai làm phình độ lệch chuẩn</span><span class="a">→</span>

      <span class="n">dùng trung vị và độ lệch tuyệt đối trung vị</span><span class="a">→</span>

      <span class="n">so cùng kỳ khi có mùa vụ</span><span class="a">→</span>

      <span class="n">ít chỉ số, ngưỡng có lý do</span></div>

      '
    say: Tổng kết lại, ngoại lai làm phình độ lệch chuẩn, nên hãy dùng trung vị và độ lệch tuyệt đối trung vị. So cùng kỳ
      khi có mùa vụ, theo dõi ít chỉ số, và đặt ngưỡng có lý do. Đường cảnh báo truyền thống dựa vào trung bình và độ lệch
      chuẩn rất dễ bị vô hiệu hoá chính bởi điểm bất thường cực lớn nằm trong cửa sổ tham chiếu. Thay bằng trung vị làm tâm
      và độ lệch tuyệt đối trung vị làm thước đo độ phân tán giữ ngưỡng cảnh báo ổn định trước nhiễu biên trong suốt quá trình
      theo dõi.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
  - show: '<div class="chain"><span class="n">ngoại lai làm phình độ lệch chuẩn</span><span class="a">→</span>

      <span class="n">dùng trung vị và độ lệch tuyệt đối trung vị</span><span class="a">→</span>

      <span class="n">so cùng kỳ khi có mùa vụ</span><span class="a">→</span>

      <span class="n">ít chỉ số, ngưỡng có lý do</span></div>

      '
    say: Khi chuỗi chỉ số có tính mùa vụ theo giờ hay theo ngày trong tuần, luôn trừ đi mức nền cùng khung giờ của tuần trước
      trước khi đo phần dư bất thường. Giữ gọn số lượng chỉ số theo dõi ở mức tối thiểu có gắn rõ người phụ trách sẽ tránh
      hiện tượng chai lỳ cảnh báo khi vận hành hàng trăm dịch vụ. Mọi bộ phát hiện bất thường đều cân bằng giữa hai rủi ro
      là bỏ sót sự cố thật và báo động giả quá nhiều gây chai lì cảm giác người trực. Luôn đo số lượng cảnh báo phát sinh
      mỗi tuần và gắn kèm giải thích đơn giản vì sao điểm này bị gắn cờ. Bộ cảnh báo bền vững là bộ giúp người trực xử lý
      đúng việc trong vài phút thay vì tắt thông báo hàng loạt.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
  - show: '<div class="box key"><b>Tư duy:</b> thước đo dùng để <b>tìm</b> điều bất thường không được để chính điều bất thường
      <b>làm hỏng</b>.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Dãy 8 ngày cho thấy 1 ngày 500 làm độ lệch chuẩn phình gấp ~80× (từ 1,59
      lên ~132); khi theo dõi 50 chỉ số × 1 000 ngày tự động mỗi giờ, dùng trung vị và MAD mất thêm vài mi-li-giây nhưng chặn
      báo động giả hàng loạt.</p>

      '
    say: Điều cần mang theo, thước đo dùng để tìm điều bất thường không được để chính điều bất thường làm hỏng. Dãy 8 ngày
      cho thấy 1 ngày 500 làm độ lệch chuẩn phình 80 lần. Khi theo dõi nghìn ngày mỗi giờ, dùng trung vị và độ lệch tuyệt
      đối chặn báo động giả.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: '<p class="note">Bài sau (bài 10): <b>tỉ lệ trên mẫu nhỏ</b> — khoảng tin cậy và xếp hạng.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 10, ta học tỉ lệ trên mẫu nhỏ, với khoảng tin cậy và cách xếp hạng. Hẹn gặp bạn ở bài tiếp theo.
