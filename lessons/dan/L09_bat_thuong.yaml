scenes:
- id: hook
  kind: hook
  title: Đơn tăng gấp 5 mà hệ thống không báo
  checks:
  - round(alg.z_score([100, 102, 98, 101, 99, 103, 100, 500], 500), 2) == 2.65
  steps:
  - show: '<p>Bảy ngày đơn hàng quanh 100, ngày thứ tám vọt lên 500 — một máy quét tự động đặt đơn giả. Hệ thống cảnh báo
      “báo khi điểm z vượt 3” <b>im lặng</b>: điểm z của 500 chỉ 2,65. Chính con số bất thường đã kéo độ lệch chuẩn lên và
      che mình đi.</p>

      <div class="box key">Hôm nay: <b>phát hiện bất thường</b> bằng thước đo bền vững, và so với cùng kỳ.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    say: Chào bạn, bảy ngày đơn hàng quanh 100, ngày thứ tám vọt lên 500, vì một máy quét tự động đặt đơn giả. Hệ thống cảnh
      báo khi điểm z vượt 3 lại im lặng, vì điểm z của 500 chỉ 2 phẩy 65. Chính con số bất thường đã kéo độ lệch chuẩn lên
      và che mình đi. Hôm nay ta học phát hiện bất thường bằng thước đo bền vững, và so với cùng kỳ.
- id: prereq
  kind: prereq
  title: 'Ôn lại: độ lệch chuẩn, và trung vị của độ lệch'
  checks:
  - __import__('statistics').pstdev([98, 98, 102, 102]) == 2.0 and (104 - 100) / 2 == 2
  - __import__('statistics').median([1, 2, 3, 4, 100]) == 3 and __import__('statistics').median([abs(x - 3) for x in [1, 2,
    3, 4, 100]]) == 1
  steps:
  - show: '<table class="t"><tr><th>dữ liệu 98, 98, 102, 102</th><th>tính</th></tr>

      <tr><td>trung bình</td><td>100</td></tr>

      <tr><td>độ lệch so với trung bình</td><td>$-2, -2, +2, +2$; bình phương đều bằng 4</td></tr>

      <tr><td>độ lệch chuẩn</td><td>$\sqrt{\frac{4 + 4 + 4 + 4}{4}} = 2$</td></tr>

      <tr><td>điểm z của 104</td><td>$\frac{104 - 100}{2} = 2$: cách trung bình 2 lần độ lệch chuẩn</td></tr></table>

      '
    introduces:
    - sqrt
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Trước hết, ta cần hiểu độ lệch chuẩn từ đầu, tức khoảng cách điển hình từ các số tới trung bình, qua bốn số 98, 98,
      102, 102. Trung bình là 100. Mỗi số lệch khỏi trung bình 2, bình phương đều bằng 4. Lấy trung bình của các bình phương
      được 4, rồi căn bậc hai, nên độ lệch chuẩn là 2. Điểm z của 104 bằng 104 trừ 100 chia 2, bằng 2, tức cách trung bình
      2 lần độ lệch chuẩn.
  - show: '<table class="t"><tr><th>dữ liệu 1, 2, 3, 4, 100</th><th>tính</th></tr>

      <tr><td>trung vị</td><td>3</td></tr>

      <tr><td>$\lvert x - 3 \rvert$</td><td>2, 1, 0, 1, 97 → sắp: 0, 1, <b>1</b>, 2, 97</td></tr>

      <tr><td>trung vị của các độ lệch</td><td>1 — số 100 gần như không làm nó đổi</td></tr></table>

      '
    introduces:
    - absval
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Thứ hai, trung vị của độ lệch, với năm số 1, 2, 3, 4 và 100. Trung vị là 3. Trị tuyệt đối của từng số trừ 3 là 2,
      1, 0, 1 và 97, sắp lại thì số giữa là 1. Vậy trung vị của các độ lệch bằng 1, và số 100 rất lớn gần như không làm nó
      thay đổi.
- id: sym
  kind: symbol
  title: 'Giải mã: điểm z và điểm bền vững'
  steps:
  - show: '<table class="t"><tr><th>thước đo</th><th>công thức</th><th>bị ngoại lai (giá trị tách hẳn phần còn lại) ảnh hưởng?</th></tr>

      <tr><td><b>điểm z</b></td><td>$\frac{x - \text{trung bình}}{\text{độ lệch chuẩn}}$</td><td><b>có</b> — cả tử và mẫu</td></tr>

      <tr><td><b>độ lệch tuyệt đối trung vị</b> (MAD)</td><td>trung vị của $\lvert x - \text{trung vị} \rvert$</td><td>gần
      như không</td></tr>

      <tr><td><b>điểm bền vững</b></td><td>$\frac{x - \text{trung vị}}{1{,}4826 \cdot \text{MAD}}$</td><td>gần như không</td></tr></table>

      <p>Hệ số 1,4826 làm điểm bền vững xấp xỉ điểm z khi dữ liệu có phân phối chuẩn (dạng hình chuông: phần lớn giá trị dồn
      quanh giữa, thưa dần hai bên) và không có ngoại lai.</p>

      <p class="note"><b>Vì sao có hằng số 1,4826?</b> Trong phân phối chuẩn, nửa khoảng giữa chứa 50% dữ liệu ứng với ±0,6745
      độ lệch chuẩn; lấy $1 / 0{,}6745 \approx 1{,}4826$ để đưa MAD về cùng thang đo với độ lệch chuẩn.</p>'
    introduces:
    - absval
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    - '1.4'
    - '1.4'
    say: Bảng so ba thước đo, và ngoại lai nghĩa là giá trị nằm tách hẳn khỏi phần còn lại, như ngày 500 sắp gặp. Điểm z bằng
      x trừ trung bình, chia độ lệch chuẩn, và bị ngoại lai ảnh hưởng ở cả tử lẫn mẫu. Độ lệch tuyệt đối trung vị là trung
      vị của trị tuyệt đối x trừ trung vị, gần như không bị ngoại lai ảnh hưởng. Điểm bền vững bằng x trừ trung vị, chia 1
      phẩy 4826 nhân độ lệch tuyệt đối trung vị, cũng gần như không bị ảnh hưởng. Hệ số 1 phẩy 4826 làm điểm bền vững xấp
      xỉ điểm z khi dữ liệu có phân phối chuẩn và không có ngoại lai. Phân phối chuẩn có dạng hình chuông, phần lớn giá trị
      dồn quanh giữa và thưa dần về hai bên. Điểm chuẩn hoá bền vững dựa trên trung vị giữ nguyên độ nhạy phát hiện bất thường
      ngay cả khi dữ liệu nhiễu nặng. Hằng số 1 phẩy 4826 bằng 1 chia 0 phẩy 6745 nhằm quy đổi độ lệch tuyệt đối trung vị
      về đúng thang đo chuẩn khi dữ liệu hình chuông.
