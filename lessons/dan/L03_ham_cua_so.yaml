id: L03
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 3 — Hàm cửa sổ: tổng lũy kế, so với kỳ trước, xếp hạng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dan.yaml L03; audit/dan/verify_dan.py L03; tài liệu SQLite “Window Functions” (bản hiện hành); ISO/IEC 9075:2003 (SQL:2003, hàm cửa sổ); DBS bài 3 (gom nhóm); chạy thật trên sqlite3 3.49"
assumes: [arith]
# Quy ước: bảng dt(ngay, tien) = (1, 10), (2, 30), (3, 20), (4, 40) (alg.dan_db). Hàm cửa sổ tính trên một “khung” các dòng quanh dòng hiện tại mà KHÔNG gộp dòng lại
#   (khác GROUP BY). Câu truy vấn trong <div class="code">; lời đọc mô tả bằng tiếng Việt, không đọc từ khoá.
objectives:
  - "Viết tổng lũy kế và chênh lệch so với kỳ trước"
  - "Phân biệt hàm cửa sổ với gom nhóm"
  - "Chọn cách xếp hạng khi có giá trị bằng nhau"
asr_reviewed:
  - {sentence: "Bước ba, cột hạng theo tiền giảm dần.", reason: "ASR chép “Bước 3. Cột hàng theo tiền giảm dân.” (0.75): lệch âm/thanh thuần Việt: hạng/hàng, dần/dân — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cộng các chênh lệch, 20 trừ 10 cộng 20 được 30.", reason: "ASR chép “Cộng các chính lịch 20 trường 10 cộng 20 được 30.” (0.786): lệch âm/thanh thuần Việt: chênh lệch/chính lịch, trừ/trường — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Doanh thu lũy kế mà không mất từng ngày"
    checks:
      - "[r[1] for r in alg.dan_sql('SELECT ngay, SUM(tien) OVER (ORDER BY ngay) FROM dt ORDER BY ngay')] == [10, 40, 60, 100]"
    steps:
      - show: |
          <p>Sếp muốn một bảng: mỗi ngày một dòng, có doanh thu ngày, doanh thu <b>lũy kế từ đầu tháng</b>, và chênh lệch so với hôm trước. Gom nhóm thì gộp mất từng ngày; tự nối bảng với chính nó thì rối và chậm. Có một công cụ làm đúng việc này: <b>hàm cửa sổ</b>.</p>
          <div class="box key">Hôm nay: <b>hàm cửa sổ</b> — tính trên các dòng lân cận mà vẫn giữ nguyên từng dòng.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, sếp muốn một bảng, mỗi ngày một dòng, có doanh thu ngày, doanh thu lũy kế từ đầu tháng, và chênh lệch so với hôm trước. Gom nhóm thì gộp mất từng ngày, còn tự nối bảng với chính nó thì rối và chậm. Có một công cụ làm đúng việc này, là hàm cửa sổ. Hôm nay ta học hàm cửa sổ, tính trên các dòng lân cận mà vẫn giữ nguyên từng dòng."

  - id: prereq
    kind: prereq
    title: "Ôn lại: cộng dồn, gom nhóm, và hạng"
    checks:
      - "list(__import__('itertools').accumulate([2, 4, 6])) == [2, 6, 12]"
      - "alg.dan_sql('SELECT COUNT(*), SUM(tien) FROM dt') == [(4, 100)] and 1 + sum(1 for v in [10, 30, 20, 40] if v > 30) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>số</th><th>2</th><th>4</th><th>6</th></tr>
          <tr><td>cộng dồn</td><td>2</td><td>$2 + 4 = 6$</td><td>$6 + 6 = 12$</td></tr></table>
          <p><b>Cộng dồn</b>: mỗi ô bằng ô trước cộng số mới.</p>
        focus: [1, "1.2", 2]
        say: "Trước hết, ôn lại phép cộng dồn. Với ba số 2, 4, 6, ô đầu là 2, ô thứ hai là 2 cộng 4 bằng 6, ô thứ ba là 6 cộng 6 bằng 12. Nói gọn, mỗi ô bằng ô trước cộng thêm số mới."
      - show: |
          <table class="t"><tr><th>phép</th><th>với tiền 4 ngày: 10, 30, 20, 40</th><th>số dòng ra</th></tr>
          <tr><td>gom nhóm (khoá Cơ sở dữ liệu)</td><td>tổng $= 100$</td><td>1</td></tr>
          <tr><td>hạng $= 1 +$ số giá trị lớn hơn</td><td>30 chỉ thua 40 $\to$ hạng $1 + 1 = 2$</td><td>giữ 4</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Thứ hai, so sánh hai việc quen thuộc trên tiền của 4 ngày là 10, 30, 20, 40. Phép gom nhóm ở khoá Cơ sở dữ liệu cộng cả 4 ngày thành tổng 100, nhưng chỉ còn 1 dòng. Còn hạng của một giá trị bằng 1 cộng số giá trị lớn hơn nó, ví dụ 30 chỉ thua 40, nên hạng là 1 cộng 1 bằng 2, và mỗi ngày vẫn giữ dòng của mình."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: cửa sổ = thứ tự + khung"
    steps:
      - show: |
          <table class="t"><tr><th>viết</th><th>nghĩa</th></tr>
          <tr><td><code>SUM(tien) OVER (ORDER BY ngay)</code></td><td>tổng từ dòng đầu tới dòng hiện tại theo thứ tự ngày: <b>lũy kế</b></td></tr>
          <tr><td><code>LAG(tien) OVER (ORDER BY ngay)</code></td><td>giá trị của dòng <b>trước</b> theo thứ tự đó</td></tr>
          <tr><td><code>RANK() OVER (ORDER BY tien DESC)</code></td><td>hạng theo tiền giảm dần</td></tr>
          <tr><td><code>PARTITION BY cua_hang</code></td><td>tính riêng cho từng cửa hàng, như gom nhóm nhưng <b>không</b> gộp dòng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng có bốn cách viết. Hàm tổng trên cửa sổ sắp theo ngày cho tổng từ dòng đầu tới dòng hiện tại, tức tổng lũy kế. Hàm lấy dòng trước cho giá trị của dòng đứng trước theo thứ tự đó. Hàm xếp hạng theo tiền giảm dần cho hạng của từng dòng. Thêm phần chia theo cửa hàng thì mỗi cửa hàng được tính riêng, giống gom nhóm nhưng không gộp dòng."

  - id: intuition
    kind: intuition
    title: "Cửa sổ trượt theo từng dòng"
    checks:
      - "[r[0] for r in alg.dan_sql('SELECT SUM(tien) OVER (ORDER BY ngay) FROM dt ORDER BY ngay')] == [10, 40, 60, 100] and 10 + 30 + 20 == 60"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><g fill="#1f2937" font-size="22"><line x1="260" y1="290" x2="1060" y2="290" stroke="#6b7280" stroke-width="2"/><rect x="300" y="268" width="100" height="22" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="350" y="318" text-anchor="middle">ngày 1: 10</text><rect x="500" y="224" width="100" height="66" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="550" y="318" text-anchor="middle">ngày 2: 30</text><rect x="700" y="246" width="100" height="44" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="750" y="318" text-anchor="middle">ngày 3: 20</text><rect x="900" y="202" width="100" height="88" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="950" y="318" text-anchor="middle">ngày 4: 40</text><polyline points="350,268 550,202 750,158 950,70" fill="none" stroke="#eb6834" stroke-width="3"/><circle cx="350" cy="268" r="8" fill="#eb6834"/><text x="332" y="264" text-anchor="end" fill="#eb6834" font-weight="bold">10</text><circle cx="550" cy="202" r="8" fill="#eb6834"/><text x="532" y="198" text-anchor="end" fill="#eb6834" font-weight="bold">40</text><circle cx="750" cy="158" r="8" fill="#eb6834"/><text x="732" y="154" text-anchor="end" fill="#eb6834" font-weight="bold">60</text><circle cx="950" cy="70" r="8" fill="#eb6834"/><text x="932" y="66" text-anchor="end" fill="#eb6834" font-weight="bold">100</text><line x1="300" y1="340" x2="800" y2="340" stroke="#059669" stroke-width="3"/><line x1="300" y1="332" x2="300" y2="348" stroke="#059669" stroke-width="3"/><line x1="800" y1="332" x2="800" y2="348" stroke="#059669" stroke-width="3"/><text x="550" y="378" text-anchor="middle" fill="#059669">khung của ngày 3: 10 + 30 + 20 = 60</text><rect x="1130" y="90" width="26" height="26" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="1170" y="111">tiền mỗi ngày</text><circle cx="1143" cy="153" r="8" fill="#eb6834"/><text x="1170" y="161">lũy kế</text><text x="1130" y="215" font-size="20">vẫn đủ 4 dòng</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ tiền của bốn ngày bằng cột xanh, và đường cam là tổng lũy kế. Với mỗi dòng, hàm cửa sổ mở một khung gồm các dòng liên quan rồi tính trên khung đó, ví dụ khung của ngày 3 là ngày 1, 2 và 3, cộng lại được 60. Sang ngày 4, khung trượt rộng thêm một ngày và lũy kế lên 100. Khác với gom nhóm, không dòng nào bị gộp mất, mỗi ngày vẫn là một dòng."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Bốn ngày doanh thu"
    checks:
      - "alg.dan_sql('SELECT ngay, tien, SUM(tien) OVER (ORDER BY ngay), tien - LAG(tien) OVER (ORDER BY ngay), RANK() OVER (ORDER BY tien DESC) FROM dt ORDER BY ngay') == [(1, 10, 10, None, 4), (2, 30, 40, 20, 2), (3, 20, 60, -10, 3), (4, 40, 100, 20, 1)]"
    steps:
      - show: |
          <table class="t"><tr><th>ngày</th><th>tiền</th><th>lũy kế</th></tr>
          <tr><td>1</td><td>10</td><td>10</td></tr>
          <tr><td>2</td><td>30</td><td>$10 + 30 = 40$</td></tr>
          <tr><td>3</td><td>20</td><td>$40 + 20 = 60$</td></tr>
          <tr><td>4</td><td>40</td><td>$60 + 40 = \hl{100}$</td></tr></table>
          <p><b>Bước 1</b> — tổng trên cửa sổ sắp theo ngày: cộng dồn.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bước một, cột lũy kế, tức hàm tổng trên cửa sổ sắp theo ngày. Ngày 1 lũy kế là 10. Ngày 2 là 10 cộng 30 bằng 40. Ngày 3 là 40 cộng 20 bằng 60. Ngày 4 là 60 cộng 40 bằng 100. Đây chính là phép cộng dồn, làm cho từng dòng."
      - show: |
          <table class="t"><tr><th>ngày</th><th>tiền</th><th>dòng trước</th><th>so với hôm trước</th></tr>
          <tr><td>1</td><td>10</td><td>—</td><td>—</td></tr>
          <tr><td>2</td><td>30</td><td>10</td><td>$30 - 10 = +20$</td></tr>
          <tr><td>3</td><td>20</td><td>30</td><td>$20 - 30 = -10$</td></tr>
          <tr><td>4</td><td>40</td><td>20</td><td>$40 - 20 = +20$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bước hai, cột so với hôm trước, lấy tiền trừ giá trị của dòng trước. Ngày đầu không có hôm trước nên chênh lệch để rỗng. Ngày 2 hơn hôm trước 20. Ngày 3 kém hôm trước 10. Ngày 4 hơn hôm trước 20."
      - clear: true
        show: |
          <table class="t"><tr><th>ngày</th><th>tiền</th><th>số ngày tiền lớn hơn</th><th>hạng</th></tr>
          <tr><td>4</td><td>40</td><td>0</td><td>1</td></tr>
          <tr><td>2</td><td>30</td><td>1</td><td>2</td></tr>
          <tr><td>3</td><td>20</td><td>2</td><td>3</td></tr>
          <tr><td>1</td><td>10</td><td>3</td><td>4</td></tr></table>
          <p><b>Bước 3</b> — hạng theo tiền giảm dần.</p>
        focus: [2, "1.2", "1.3", "1.4", "1.5"]
        say: "Bước ba, cột hạng theo tiền giảm dần. Ngày 4 có 40, cao nhất, hạng 1. Ngày 2 có 30, hạng 2. Ngày 3 có 20, hạng 3. Ngày 1 có 10, hạng 4."
      - clear: true
        show: |
          <table class="t"><tr><th>ngày</th><th>tiền</th><th>lũy kế</th><th>so với hôm trước</th><th>hạng</th></tr>
          <tr><td>1</td><td>10</td><td>10</td><td>—</td><td>4</td></tr>
          <tr><td>2</td><td>30</td><td>40</td><td>+20</td><td>2</td></tr>
          <tr><td>3</td><td>20</td><td>60</td><td>−10</td><td>3</td></tr>
          <tr><td>4</td><td>40</td><td>$\hl{100}$</td><td>+20</td><td>1</td></tr></table>
          <p><b>Bước 4</b> — chạy thật trên sqlite3: vẫn 4 dòng, mỗi dòng có thêm ba cột tính từ các dòng khác. Ngày đầu không có hôm trước nên chênh lệch rỗng.</p>
        focus: [1, 2, 2]
        say: "Bước bốn, ghép ba cột lại. Chạy thật trên cơ sở dữ liệu, kết quả vẫn có 4 dòng, mỗi dòng thêm ba cột tính từ các dòng khác. Ngày đầu không có hôm trước nên chênh lệch để rỗng."

  - id: check
    kind: check
    title: "Tự kiểm: ba phép thử không cần hàm cửa sổ"
    checks:
      - "alg.dan_sql('SELECT SUM(tien) FROM dt') == [(100,)] and 20 - 10 + 20 == 40 - 10 == 30"
      - "[1 + sum(1 for w in [10, 30, 20, 40] if w > v) for v in [10, 30, 20, 40]] == [4, 2, 3, 1]"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác</th><th>kết quả</th></tr>
          <tr><td>lũy kế ngày cuối</td><td>gom nhóm cả bảng: tổng $= 100$</td><td>100 ✓</td></tr>
          <tr><td>các chênh lệch</td><td>$20 - 10 + 20 = 30$ phải bằng ngày cuối trừ ngày đầu $40 - 10$</td><td>30 ✓</td></tr>
          <tr><td>hạng</td><td>$1 +$ số giá trị lớn hơn: 4, 2, 3, 1</td><td>khớp ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4"]
        say: "Kiểm bằng ba đường khác, không dùng hàm cửa sổ. Lũy kế ngày cuối phải bằng tổng của cả bảng tính bằng gom nhóm, và cả hai đều là 100. Cộng các chênh lệch, 20 trừ 10 cộng 20 được 30. Vì các bước lên xuống nối đuôi nhau, tổng đó phải bằng ngày cuối trừ ngày đầu, 40 trừ 10 cũng bằng 30. Cuối cùng, tính hạng bằng định nghĩa 1 cộng số giá trị lớn hơn cũng ra 4, 2, 3, 1."


  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, cả người mới lẫn người đã đi làm"
    checks:
      - "alg.dan_sql('WITH t(ngay, tien) AS (VALUES (1,10),(2,30),(4,40)) SELECT ngay, tien - LAG(tien) OVER (ORDER BY ngay) FROM t ORDER BY ngay') == [(1, None), (2, 20), (4, 10)]"
      - "alg.dan_sql('WITH t(ngay, tien) AS (VALUES (1,30),(2,20),(3,30)) SELECT ngay, RANK() OVER (ORDER BY tien DESC), ROW_NUMBER() OVER (ORDER BY tien DESC, ngay) FROM t ORDER BY ngay') == [(1, 1, 1), (2, 3, 3), (3, 1, 2)]"
      - "alg.dan_sql(\"WITH t(ngay, ch, tien) AS (VALUES (1,'A',10),(2,'A',30),(2,'B',5),(3,'A',20)) SELECT SUM(tien) OVER (ORDER BY ngay), SUM(tien) OVER (ORDER BY ngay, ch ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t ORDER BY ngay, ch\") == [(10, 10), (45, 40), (45, 45), (65, 65)]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên thứ tự trong cửa sổ <b class="red">(“hôm trước” là dòng bất kỳ)</b>
          <br><span class="note">Không có <code>ORDER BY</code> trong <code>OVER</code> thì dòng trước, lũy kế phụ thuộc cách máy đọc — có thể đổi giữa hai lần chạy.</span></div>
        say: "Lỗi thứ nhất, quên thứ tự trong cửa sổ, nên hôm trước là một dòng bất kỳ. Không có phần sắp xếp trong cửa sổ thì dòng trước và lũy kế phụ thuộc cách máy đọc, và có thể đổi giữa hai lần chạy."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ngày bị thiếu <b class="red">(so với “dòng trước”, không phải “hôm qua”)</b>
          <br><span class="note">Có ngày 1, 2, 4 (ngày 3 không bán gì): dòng trước của ngày 4 là ngày 2, nên chênh lệch +10 là so với <b>hai</b> ngày trước. Tạo đủ lịch ngày rồi nối vào trước khi dùng hàm dòng trước.</span></div>
        say: "Lỗi thứ hai, có ngày bị thiếu, nên ta so với dòng trước chứ không phải hôm qua. Có ngày 1, 2 và 4, ngày 3 không bán gì, thì dòng trước của ngày 4 là ngày 2, và chênh lệch cộng 10 là so với hai ngày trước. Hãy tạo đủ lịch ngày rồi nối vào trước khi dùng hàm lấy dòng trước."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn sai kiểu xếp hạng khi bằng nhau <b class="red">(lấy “top 1” ra hai dòng)</b>
          <br><span class="note">Tiền 30, 20, 30: xếp hạng có đồng hạng cho 1, 3, 1; đánh số dòng cho 1, 3, 2. Muốn đúng một dòng mỗi nhóm thì đánh số dòng với thứ tự phụ rõ ràng.</span></div>
        say: "Lỗi thứ ba, chọn sai kiểu xếp hạng khi có giá trị bằng nhau, nên lấy hạng nhất lại ra hai dòng. Với tiền 30, 20, 30, kiểu xếp hạng có đồng hạng cho 1, 3, 1, còn kiểu đánh số dòng cho 1, 3, 2. Muốn đúng một dòng mỗi nhóm thì hãy đánh số dòng với một thứ tự phụ rõ ràng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin rằng khung mặc định đi <b>từng dòng</b> khi thứ tự có giá trị trùng <b class="red">(lỗi của người đã đi làm)</b>
          <br><span class="note">Bảng theo ngày và cửa hàng: ngày 2 có hai dòng (A 30, B 5). Khung mặc định gom mọi dòng <b>cùng ngày</b> vào một lúc.</span></div>
          <table class="t"><tr><th>ngày, cửa hàng</th><th>tiền</th><th>lũy kế, khung mặc định</th><th>lũy kế, khung theo từng dòng</th></tr>
          <tr><td>1, A</td><td>10</td><td>10</td><td>10</td></tr>
          <tr><td>2, A</td><td>30</td><td class="red">45</td><td>40</td></tr>
          <tr><td>2, B</td><td>5</td><td>45</td><td>45</td></tr>
          <tr><td>3, A</td><td>20</td><td>65</td><td>65</td></tr></table>
        focus: [1, 1, 1, "2.3", "2.3", 0]
        say: "Lỗi thứ tư là lỗi của người đã đi làm, tin rằng khung mặc định luôn đi từng dòng, trong khi thứ tự sắp có giá trị trùng. Ở đây bảng theo ngày và cửa hàng, ngày 2 có hai dòng, A bán 30 và B bán 5. Khung mặc định gom mọi dòng cùng ngày vào một lúc. Vì vậy dòng ngày 2 của A đã nhận lũy kế 45, tức đã cộng cả tiền của B. Khung theo từng dòng, kèm thứ tự phụ theo cửa hàng, mới cho 40 rồi 45. Hai cách chỉ khác nhau ở những dòng trùng ngày, nên người làm nghề luôn ghi rõ khung và thêm thứ tự phụ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.dan_sql('WITH t(ngay, tien) AS (VALUES (1,5),(2,15),(3,10)) SELECT SUM(tien) OVER (ORDER BY ngay), tien - LAG(tien) OVER (ORDER BY ngay) FROM t ORDER BY ngay') == [(5, None), (20, 10), (30, -5)]"
      - "10 - 5 == 5 == 10 - 5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tiền 3 ngày: 5, 15, 10. Tính cột lũy kế và cột so với hôm trước.</td></tr>
          <tr><td>2</td><td>Bảng có nhiều cửa hàng. Muốn lũy kế <b>riêng</b> cho từng cửa hàng, thêm gì vào cửa sổ?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tiền 3 ngày là 5, 15 và 10. Hãy tính cột lũy kế và cột so với hôm trước. Câu hai, bảng có nhiều cửa hàng. Muốn lũy kế riêng cho từng cửa hàng, ta thêm gì vào cửa sổ? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>ngày</th><th>tiền</th><th>lũy kế</th><th>so với hôm trước</th></tr>
          <tr><td>1</td><td>5</td><td>5</td><td>—</td></tr>
          <tr><td>2</td><td>15</td><td>$5 + 15 = 20$</td><td>$15 - 5 = +10$</td></tr>
          <tr><td>3</td><td>10</td><td>$20 + 10 = \hl{30}$</td><td>$10 - 15 = -5$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, làm từng dòng. Ngày 1 có lũy kế 5, và vì chưa có hôm trước nên ô chênh lệch để trống. Ngày 2, lũy kế 5 cộng 15 bằng 20, chênh lệch 15 trừ 5 bằng cộng 10. Ngày 3, lũy kế 20 cộng 10 bằng 30, chênh lệch 10 trừ 15 bằng trừ 5."
      - show: |
          <p>Kiểm nhanh: $+10 - 5 = 5 = 10 - 5$ (ngày cuối trừ ngày đầu) ✓.</p>
          <p>② Thêm <code>PARTITION BY cua_hang</code>: lũy kế bắt đầu lại từ 0 ở mỗi cửa hàng, vẫn sắp theo ngày.</p>
        focus: [1, 2]
        say: "Kiểm nhanh, cộng 10 trừ 5 bằng 5, đúng bằng ngày cuối trừ ngày đầu, 10 trừ 5. Câu hai, thêm phần chia theo cửa hàng, để lũy kế bắt đầu lại từ 0 ở mỗi cửa hàng, vẫn sắp theo ngày."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cửa sổ: giữ từng dòng, nhìn sang dòng khác</span><span class="a">→</span>
          <span class="n">luôn có thứ tự rõ ràng</span><span class="a">→</span>
          <span class="n">đủ lịch ngày trước khi so kỳ trước</span><span class="a">→</span>
          <span class="n">chọn kiểu xếp hạng theo cách xử lý bằng nhau</span></div>
        say: "Tổng kết lại, hàm cửa sổ giữ từng dòng mà vẫn nhìn sang dòng khác, và luôn cần một thứ tự rõ ràng. Hãy tạo đủ lịch ngày trước khi so với kỳ trước, và chọn kiểu xếp hạng theo cách xử lý giá trị bằng nhau."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi phép so sánh “trước – sau” đều ngầm giả định một <b>thứ tự</b> và một <b>lịch</b> — hãy làm cả hai thành tường minh.</div>
        say: "Điều cần mang theo, mỗi phép so sánh trước và sau đều ngầm giả định một thứ tự và một lịch, nên hãy làm cả hai thành tường minh."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>phân tích nhóm người dùng theo kỳ</b> — giữ chân người dùng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học phân tích nhóm người dùng theo kỳ, để đo khả năng giữ chân người dùng. Hẹn gặp bạn ở bài tiếp theo."
