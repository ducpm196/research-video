- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">biết độ mịn của từng bảng</span><span class="a">→</span>

      <span class="n">nối: kết quả mịn như bảng mịn hơn</span><span class="a">→</span>

      <span class="n">gộp bảng “nhiều” trước rồi mới nối</span><span class="a">→</span>

      <span class="n">đếm dòng trước và sau mỗi phép nối</span></div>

      '
    say: 'Tổng kết lại, hãy biết độ mịn của từng bảng, vì kết quả nối mịn như bảng mịn hơn. Gộp bảng phía nhiều trước rồi
      mới nối, và đếm dòng trước và sau mỗi phép nối. Nhớ công thức kiểm nhanh: kết quả sau nối chỉ an toàn khi số dòng không
      tự ý tăng vượt bảng chính.'
  - show: '<div class="box key"><b>Tư duy:</b> một câu truy vấn chạy không báo lỗi <b>chưa phải</b> câu truy vấn đúng — hãy
      kiểm bằng một con số đã biết.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Bảng nhỏ 2 đơn nối 4 dòng hàng làm tổng phình từ 150 lên 350; trên bảng 10
      triệu đơn, nối nhầm quan hệ một–nhiều trước khi gộp không chỉ sai tổng tiền mà còn làm câu truy vấn ngôn ngữ SQL (ngôn
      ngữ truy vấn có cấu trúc) chậm gấp hàng chục lần và tràn RAM.</p>

      '
    say: Điều cần mang theo, một câu truy vấn chạy không báo lỗi chưa phải là câu truy vấn đúng, hãy kiểm bằng một con số
      đã biết. Bảng 2 đơn nối 4 dòng hàng làm tổng phình từ 150 lên 350. Trên bảng 10 triệu đơn, câu truy vấn ngôn ngữ SQL
      nối nhầm làm truy vấn chậm hàng chục lần và tràn bộ nhớ trong. Khi thấy doanh thu nhảy vọt bất ngờ trong một bản cập
      nhật truy vấn, nghi phạm đầu tiên luôn là một phép nối một nhiều mới thêm.
