- id: example
  kind: example
  title: Sai và đúng trên sqlite3
  checks:
  - alg.dan_sql('SELECT SUM(d.tong), SUM(x.sl), COUNT(*) FROM don d JOIN dong x ON x.don = d.id') == [(350, 7, 4)]
  - alg.dan_sql('SELECT SUM(d.tong), SUM(g.sl) FROM don d JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don) g ON g.don
    = d.id') == [(150, 7)]
  steps:
  - show: '<div class="code"><div>SELECT COUNT(*) FROM don;    -- 2</div><div>SELECT COUNT(*) FROM dong;   -- 4</div></div>

      <p><b>Bước 1</b> — đếm dòng trước khi nối: bảng đơn 2 dòng, bảng dòng hàng 4 dòng. Bảng dòng hàng là phía “nhiều”.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước một, đếm dòng trước khi nối. Bảng đơn có 2 dòng, bảng dòng hàng có 4 dòng, nên bảng dòng hàng là phía nhiều.
      Số dòng đếm trước khi nối đóng vai trò mốc chuẩn giúp bạn phát hiện mọi sự phình to bất thường ngay ở bước sau.
  - show: '<div class="code"><div>-- sai: nối rồi cộng</div><div>SELECT SUM(d.tong), SUM(x.sl), COUNT(*) FROM don d JOIN dong
      x ON x.don = d.id;   -- 350, 7, 4</div></div>

      <p><b>Bước 2</b> — kết quả có 4 dòng, tức mịn như bảng dòng hàng: tổng tiền <b class="red">350</b>, số món 7.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước hai, câu thứ nhất nối hai bảng rồi cộng, ra tổng tiền 350 và số món 7. Kết quả có 4 dòng, tức mịn như bảng dòng
      hàng, nên tổng tiền của đơn 1 bị cộng ba lần. Hệ quản trị cơ sở dữ liệu chỉ thực hiện đúng cú pháp nối chứ không hề
      cảnh báo bạn đang cộng lặp tổng tiền đơn hàng.
  - show: '<div class="code"><div>SELECT don, SUM(sl) AS sl FROM dong GROUP BY don;   -- (1, 4), (2, 3)</div></div>

      <p><b>Bước 3</b> — gộp bảng dòng hàng về <b>một dòng mỗi đơn</b> trước: đơn 1 có 4 món, đơn 2 có 3 món, còn 2 dòng.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước ba, gộp bảng dòng hàng theo đơn trước. Đơn 1 có 4 món, đơn 2 có 3 món, và bảng gộp chỉ còn 2 dòng, đúng bằng
      số đơn. Thao tác gom trước đưa hai bảng về cùng độ mịn một dòng mỗi đơn hàng, triệt tiêu hoàn toàn nguy cơ lặp số liệu.
  - clear: true
    show: '<div class="code"><div>-- đúng: gộp dòng hàng theo đơn trước, rồi nối</div><div>SELECT SUM(d.tong), SUM(g.sl) FROM
      don d</div><div>  JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don) g ON g.don = d.id;   -- 150, 7</div></div>

      <p><b>Bước 4</b> — số món (7) đúng ở cả hai vì nó thuộc bảng mịn. Tổng tiền chỉ đúng ($\hl{150}$) khi bảng dòng hàng
      đã được gộp về <b>một dòng mỗi đơn</b> trước khi nối.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Bước bốn, câu thứ hai gộp bảng dòng hàng theo đơn trước, rồi mới nối, ra tổng tiền 150 và số món 7. Số món đúng ở
      cả hai vì nó thuộc bảng mịn. Tổng tiền chỉ đúng, bằng 150, khi bảng dòng hàng đã được gộp về một dòng mỗi đơn trước
      khi nối. Truy vấn bảng tạm hoặc biểu thức bảng chung giúp tách gọn bước gom nhóm trước khi thực hiện phép nối cuối cùng.
