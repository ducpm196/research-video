56" width="160" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="660" y="288" text-anchor="middle">đơn 2, món a</text><line x1="740" y1="280" x2="1010" y2="280" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 4"/><text x="1110" y="288" text-anchor="middle" fill="#1f2937">50</text><line x1="1040" y1="330" x2="1180" y2="330" stroke="#1f2937" stroke-width="2"/><text x="1110" y="320" text-anchor="middle" fill="#b91c1c" font-weight="bold">cộng = 350</text><text x="1200" y="200" fill="#059669">đúng: 100 + 50 = 150</text></g></svg></div>
