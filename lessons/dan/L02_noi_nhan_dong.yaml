    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, sau phép nối đơn với dòng hàng có bao nhiêu dòng? Hãy giải thích vì sao tổng
      tiền ra 350 bằng phép tính tay. Câu hai, cả hai đơn đều thuộc cửa hàng A, muốn báo tổng tiền theo cửa hàng và số món
      theo cửa hàng trong một bảng, hãy viết các bước đúng. Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Đơn 1 có 3 dòng hàng, đơn 2 có 1 → $3 + 1 =$ <b>4</b> dòng.</p>

      <p>Mỗi dòng mang tổng tiền của đơn mình: $100 \cdot 3 + 50 \cdot 1 = \hl{350}$.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Đáp án câu một, đơn 1 có 3 dòng hàng, đơn 2 có 1, nên sau phép nối có 3 cộng 1 bằng 4 dòng. Mỗi dòng mang tổng tiền
      của đơn mình, đơn 1 lặp 3 lần và đơn 2 một lần, nên 100 nhân 3 cộng 50 nhân 1, bằng 350. Đơn hàng số một lặp lại ba
      lần khiến tổng tiền 100 bị đếm thành 300 cộng thêm 50 thành 350 sai lệch hoàn toàn.
  - show: '<table class="t"><tr><th>bước</th><th>việc làm</th><th>kết quả</th></tr>

      <tr><td>1</td><td>gộp dòng hàng theo đơn</td><td>số món mỗi đơn: (1, 4), (2, 3)</td></tr>

      <tr><td>2</td><td>nối với bảng đơn</td><td>một dòng mỗi đơn</td></tr>

      <tr><td>3</td><td>gộp theo cửa hàng</td><td>cửa hàng A: tổng tiền 150, số món 7</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Câu hai làm ba bước. Thứ nhất, gộp dòng hàng theo đơn để có số món mỗi đơn, đơn 1 có 4 món và đơn 2 có 3 món. Thứ
      hai, nối với bảng đơn để được một dòng mỗi đơn. Thứ ba, gộp theo cửa hàng, cộng tổng tiền và cộng số món, nên cửa hàng
      A có tổng tiền 150 và 7 món. Quy trình hai bước gom con rồi nối trái bảo toàn chính xác cả tổng tiền đơn lẫn tổng số
      lượng sản phẩm bán ra.
