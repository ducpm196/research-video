id: L02
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 2 — Nối bảng làm nhân dòng: đếm trùng khi tính tổng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dan.yaml L02; audit/dan/verify_dan.py L02; DBS bài 2 (phép nối), bài 3 (gom nhóm); chạy thật trên sqlite3 (alg.dan_db)"
assumes: [arith, cdot]
# Quy ước: bảng don(id, cua_hang, tong) — 2 đơn tổng 100 và 50; bảng dong(don, sp, sl) — đơn 1 có 3 dòng hàng, đơn 2 có 1 (alg.dan_db, alg.sql).
#   Câu truy vấn trong <div class="code">, mỗi dòng một <div>; lời đọc mô tả bằng tiếng Việt, không đọc từ khoá.
objectives:
  - "Nhận ra quan hệ một–nhiều trước khi cộng"
  - "Gộp trước rồi mới nối"
  - "Kiểm số dòng sau mỗi phép nối"
asr_reviewed:
  - {sentence: "Bảng này so sánh độ mịn của ba bảng dữ liệu.", reason: "ASR chép “Bản này so sánh độ miền của ba bản giữ liệu.” (0.727): lệch âm/thanh thuần Việt: bảng/bản, mịn/miền, bảng/bản — NOT_VERIFIED bằng tai người"}
  - {sentence: "Quy tắc là sau phép nối, độ mịn của kết quả là độ mịn của bảng mịn hơn.", reason: "ASR chép “Quy tắc là sau phép nối, độ mình của kết quả là độ mình của bản mình hơn.” (0.778): lệch âm/thanh thuần Việt: mịn/mình, mịn/mình, bảng mịn/bản mình — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Doanh thu tăng gấp đôi chỉ sau một phép nối"
    checks:
      - "alg.dan_sql('SELECT SUM(tong) FROM don') == [(150,)] and alg.dan_sql('SELECT SUM(d.tong) FROM don d JOIN dong x ON x.don = d.id') == [(350,)]"
    steps:
      - show: |
          <p>Báo cáo doanh thu cũ ghi 150. Ai đó thêm cột “số món đã bán” bằng cách nối bảng đơn với bảng dòng hàng — và doanh thu nhảy lên <b>350</b>. Không có đơn mới nào. Tiền của mỗi đơn đã bị cộng <b>một lần cho mỗi dòng hàng</b> của nó.</p>
          <div class="box key">Hôm nay: <b>nối làm nhân dòng</b> — nhận ra quan hệ một–nhiều, và gộp trước rồi mới nối.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, báo cáo doanh thu cũ ghi 150. Ai đó thêm cột số món đã bán bằng cách nối bảng đơn với bảng dòng hàng, và doanh thu nhảy lên 350. Không có đơn mới nào cả. Tiền của mỗi đơn đã bị cộng một lần cho mỗi dòng hàng của nó. Hôm nay ta học vì sao nối làm nhân dòng, cách nhận ra quan hệ một nhiều, và gộp trước rồi mới nối."

  - id: prereq
    kind: prereq
    title: "Ôn lại: phép nối và phép gom nhóm"
    checks:
      - "len([(l, h) for l in ['L1'] for h, lh in [('An', 'L1'), ('Bình', 'L1')] if lh == l]) == 2"
      - "alg.dan_sql('SELECT don, SUM(sl) FROM dong GROUP BY don ORDER BY don') == [(1, 4), (2, 3)]"
    steps:
      - show: |
          <table class="t"><tr><th>lớp</th><th>học sinh (cột lớp)</th><th>kết quả nối theo lớp</th></tr>
          <tr><td>L1, sĩ số 40</td><td>An (L1), Bình (L1)</td><td>(L1, 40, An), (L1, 40, Bình)</td></tr></table>
          <p><b>Phép nối</b> ghép mỗi dòng bên trái với <b>mọi</b> dòng bên phải có cùng giá trị ở cột chung (ở đây là cột lớp): 1 lớp $\times$ 2 học sinh $\to$ 2 dòng, sĩ số 40 bị chép 2 lần.</p>
        focus: [1, "1.2", 2, 2]
        say: "Trước hết, ta cần hiểu phép nối từ đầu, tức cách ghép hai bảng dữ liệu theo một cột chung. Bảng lớp có một dòng là lớp L 1 sĩ số 40, bảng học sinh có An và Bình cùng thuộc L 1. Phép nối ghép mỗi dòng bên trái với mọi dòng bên phải có cùng giá trị ở cột chung, ở đây là cột lớp. Vì vậy kết quả có 2 dòng, và con số sĩ số 40 bị chép lại 2 lần."
      - show: |
          <table class="t"><tr><th>đơn</th><th>các dòng hàng (số lượng)</th><th>gom theo đơn: cộng số lượng</th></tr>
          <tr><td>1</td><td>1, 2, 1</td><td>$1 + 2 + 1 = 4$</td></tr>
          <tr><td>2</td><td>3</td><td>3</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Thứ hai, phép gom nhóm gộp các dòng có cùng giá trị ở một cột thành một dòng, rồi cộng hay đếm trong từng nhóm. Đơn 1 có ba dòng hàng với số lượng 1, 2, 1, gom lại được 4. Đơn 2 chỉ có một dòng số lượng 3, gom lại vẫn là 3."
      - clear: true
        show: |
          <table class="t"><tr><th>viết trong câu truy vấn</th><th>nghĩa</th></tr>
          <tr><td><code>SELECT … FROM don</code></td><td>lấy các cột, hay phép tính, từ bảng đơn</td></tr>
          <tr><td><code>COUNT(*)</code>, <code>SUM(sl)</code></td><td>đếm số dòng; cộng cột số lượng</td></tr>
          <tr><td><code>don d JOIN dong x ON x.don = d.id</code></td><td>nối: ghép mỗi đơn (tên ngắn <code>d</code>) với các dòng hàng (tên ngắn <code>x</code>) khi mã đơn khớp</td></tr>
          <tr><td><code>GROUP BY don</code></td><td>gom các dòng cùng mã đơn thành một dòng</td></tr></table>
          <p class="note"><b>Câu truy vấn</b> là câu lệnh hỏi cơ sở dữ liệu; phần sau <code>--</code> là ghi chú, ở đây ghi sẵn kết quả. Mọi câu trong bài chạy thật trên sqlite3, một hệ quản trị cơ sở dữ liệu nhỏ, miễn phí.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Thứ ba, bảng giải nghĩa các chữ sẽ gặp trong câu truy vấn của bài. Dòng đầu là lấy các cột, hay một phép tính, từ một bảng. Dòng hai là đếm số dòng, và cộng một cột. Dòng ba là phép nối, ghép mỗi đơn, đặt tên ngắn là d, với các dòng hàng, đặt tên ngắn là x, khi mã đơn khớp nhau. Dòng bốn là gom các dòng cùng mã đơn thành một dòng. Câu truy vấn là câu lệnh hỏi cơ sở dữ liệu, còn phần sau hai gạch ngang là ghi chú. Mọi câu trong bài đều chạy thật trên một hệ quản trị cơ sở dữ liệu nhỏ, miễn phí."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: độ mịn của bảng và quan hệ một–nhiều"
    steps:
      - show: |
          <table class="t"><tr><th>bảng</th><th>mỗi dòng là</th><th>số dòng</th></tr>
          <tr><td>đơn</td><td>một đơn hàng (cột tổng tiền)</td><td>2</td></tr>
          <tr><td>dòng hàng</td><td>một sản phẩm trong một đơn (cột số lượng)</td><td>4</td></tr>
          <tr><td>đơn nối dòng hàng</td><td>một <b>dòng hàng</b> — tổng tiền của đơn bị lặp lại trên từng dòng</td><td>4</td></tr></table>
          <p><b>Quy tắc</b>: sau phép nối, độ mịn của kết quả là độ mịn của bảng <b>mịn hơn</b>. Cột thuộc bảng thô hơn (tổng tiền) không còn cộng thẳng được.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Bảng này so sánh độ mịn của ba bảng dữ liệu. Bảng đơn có mỗi dòng là một đơn hàng, có cột tổng tiền, gồm 2 dòng. Bảng dòng hàng có mỗi dòng là một sản phẩm trong một đơn, có cột số lượng, gồm 4 dòng. Khi nối hai bảng, mỗi dòng của kết quả là một dòng hàng, và tổng tiền của đơn bị lặp lại trên từng dòng, gồm 4 dòng. Quy tắc là sau phép nối, độ mịn của kết quả là độ mịn của bảng mịn hơn. Cột thuộc bảng thô hơn, như tổng tiền, không còn cộng thẳng được nữa."

  - id: intuition
    kind: intuition
    title: "Một đơn, ba sợi dây, ba lần tiền"
    checks:
      - "[r[1] for r in alg.dan_sql('SELECT d.id, d.tong FROM don d JOIN dong x ON x.don = d.id ORDER BY d.id')] == [100, 100, 100, 50] and 100 * 3 + 50 == 350"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><g fill="#1f2937" font-size="22"><text x="210" y="40" text-anchor="middle" font-weight="bold">bảng đơn</text><text x="660" y="40" text-anchor="middle" font-weight="bold">bảng dòng hàng</text><text x="1110" y="40" text-anchor="middle" font-weight="bold">sau khi nối: cột tổng tiền</text><rect x="110" y="92" width="200" height="56" rx="8" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="210" y="128" text-anchor="middle">đơn 1: 100</text><rect x="110" y="242" width="200" height="56" rx="8" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="210" y="278" text-anchor="middle">đơn 2: 50</text><line x1="310" y1="120" x2="580" y2="85" stroke="#6b7280" stroke-width="2"/><rect x="580" y="61" width="160" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="660" y="93" text-anchor="middle">đơn 1, món a</text><line x1="740" y1="85" x2="1010" y2="85" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 4"/><text x="1110" y="93" text-anchor="middle" fill="#1f2937">100</text><line x1="310" y1="120" x2="580" y2="150" stroke="#6b7280" stroke-width="2"/><rect x="580" y="126" width="160" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="660" y="158" text-anchor="middle">đơn 1, món b</text><line x1="740" y1="150" x2="1010" y2="150" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 4"/><text x="1110" y="158" text-anchor="middle" fill="#b91c1c">100</text><line x1="310" y1="120" x2="580" y2="215" stroke="#6b7280" stroke-width="2"/><rect x="580" y="191" width="160" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="660" y="223" text-anchor="middle">đơn 1, món c</text><line x1="740" y1="215" x2="1010" y2="215" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 4"/><text x="1110" y="223" text-anchor="middle" fill="#b91c1c">100</text><line x1="310" y1="270" x2="580" y2="280" stroke="#6b7280" stroke-width="2"/><rect x="580" y="256" width="160" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="660" y="288" text-anchor="middle">đơn 2, món a</text><line x1="740" y1="280" x2="1010" y2="280" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 4"/><text x="1110" y="288" text-anchor="middle" fill="#1f2937">50</text><line x1="1040" y1="330" x2="1180" y2="330" stroke="#1f2937" stroke-width="2"/><text x="1110" y="320" text-anchor="middle" fill="#b91c1c" font-weight="bold">cộng = 350</text><text x="1200" y="200" fill="#059669">đúng: 100 + 50 = 150</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình nối mỗi đơn với các dòng hàng của nó bằng những sợi dây. Đơn 1 có ba sợi dây, nên sau khi nối, con số 100 xuất hiện ba lần, hai lần thừa được tô đỏ. Đơn 2 chỉ có một sợi dây, nên 50 xuất hiện một lần. Cộng cột tổng tiền sau khi nối ra 350, trong khi số tiền thật vẫn chỉ là 100 cộng 50, bằng 150."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Sai và đúng trên sqlite3"
    checks:
      - "alg.dan_sql('SELECT SUM(d.tong), SUM(x.sl), COUNT(*) FROM don d JOIN dong x ON x.don = d.id') == [(350, 7, 4)]"
      - "alg.dan_sql('SELECT SUM(d.tong), SUM(g.sl) FROM don d JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don) g ON g.don = d.id') == [(150, 7)]"
    steps:
      - show: |
          <div class="code"><div>SELECT COUNT(*) FROM don;    -- 2</div><div>SELECT COUNT(*) FROM dong;   -- 4</div></div>
          <p><b>Bước 1</b> — đếm dòng trước khi nối: bảng đơn 2 dòng, bảng dòng hàng 4 dòng. Bảng dòng hàng là phía “nhiều”.</p>
        focus: [1, 2]
        say: "Bước một, đếm dòng trước khi nối. Bảng đơn có 2 dòng, bảng dòng hàng có 4 dòng, nên bảng dòng hàng là phía nhiều."
      - show: |
          <div class="code"><div>-- sai: nối rồi cộng</div><div>SELECT SUM(d.tong), SUM(x.sl), COUNT(*) FROM don d JOIN dong x ON x.don = d.id;   -- 350, 7, 4</div></div>
          <p><b>Bước 2</b> — kết quả có 4 dòng, tức mịn như bảng dòng hàng: tổng tiền <b class="red">350</b>, số món 7.</p>
        focus: [1, 2]
        say: "Bước hai, câu thứ nhất nối hai bảng rồi cộng, ra tổng tiền 350 và số món 7. Kết quả có 4 dòng, tức mịn như bảng dòng hàng, nên tổng tiền của đơn 1 bị cộng ba lần."
      - show: |
          <div class="code"><div>SELECT don, SUM(sl) AS sl FROM dong GROUP BY don;   -- (1, 4), (2, 3)</div></div>
          <p><b>Bước 3</b> — gộp bảng dòng hàng về <b>một dòng mỗi đơn</b> trước: đơn 1 có 4 món, đơn 2 có 3 món, còn 2 dòng.</p>
        focus: [1, 2]
        say: "Bước ba, gộp bảng dòng hàng theo đơn trước. Đơn 1 có 4 món, đơn 2 có 3 món, và bảng gộp chỉ còn 2 dòng, đúng bằng số đơn."
      - clear: true
        show: |
          <div class="code"><div>-- đúng: gộp dòng hàng theo đơn trước, rồi nối</div><div>SELECT SUM(d.tong), SUM(g.sl) FROM don d</div><div>  JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don) g ON g.don = d.id;   -- 150, 7</div></div>
          <p><b>Bước 4</b> — số món (7) đúng ở cả hai vì nó thuộc bảng mịn. Tổng tiền chỉ đúng ($\hl{150}$) khi bảng dòng hàng đã được gộp về <b>một dòng mỗi đơn</b> trước khi nối.</p>
        focus: [1, 2, 2]
        say: "Bước bốn, câu thứ hai gộp bảng dòng hàng theo đơn trước, rồi mới nối, ra tổng tiền 150 và số món 7. Số món đúng ở cả hai vì nó thuộc bảng mịn. Tổng tiền chỉ đúng, bằng 150, khi bảng dòng hàng đã được gộp về một dòng mỗi đơn trước khi nối."

  - id: check
    kind: check
    title: "Tự kiểm: tính thẳng từ bảng gốc, không nối"
    checks:
      - "alg.dan_sql('SELECT SUM(tong) FROM don') == [(150,)] and alg.dan_sql('SELECT SUM(sl) FROM dong') == [(7,)] and 3 + 1 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>tính thẳng từ bảng của nó</th><th>so với câu đúng</th></tr>
          <tr><td>tổng tiền</td><td>cộng cột tổng ở bảng đơn: $100 + 50 = 150$</td><td>150 ✓</td></tr>
          <tr><td>số món</td><td>cộng cột số lượng ở bảng dòng hàng: $1 + 2 + 1 + 3 = 7$</td><td>7 ✓</td></tr>
          <tr><td>số dòng sau nối</td><td>số dòng hàng của mỗi đơn: $3 + 1 = 4$</td><td>4 ✓ khớp câu sai</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, mỗi con số được tính thẳng từ bảng chứa nó, không qua phép nối nào. Tổng tiền lấy ở bảng đơn, 100 cộng 50 bằng 150, khớp câu đúng. Số món lấy ở bảng dòng hàng, 1 cộng 2 cộng 1 cộng 3 bằng 7. Còn số dòng sau khi nối bằng số dòng hàng của mỗi đơn cộng lại, 3 cộng 1 bằng 4, khớp đúng với câu sai, nên ta biết chắc chỗ thừa đến từ đâu."


  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, cả người mới lẫn người đã đi làm"
    checks:
      - "3 * 2 == 6"
      - "(lambda cn: (cn.execute(\"INSERT INTO don VALUES (3, 'A', 80)\"), alg.dan_sql('SELECT SUM(d.tong), COUNT(*) FROM don d JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don) g ON g.don = d.id', cn), alg.dan_sql('SELECT SUM(d.tong), COUNT(*) FROM don d LEFT JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don) g ON g.don = d.id', cn))[1:])(alg.dan_db()) == ([(150, 2)], [(230, 3)])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Không đếm dòng sau khi nối <b class="red">(nhân dòng lặng lẽ)</b>
          <br><span class="note">Đếm số dòng trước và sau mỗi phép nối. Số dòng tăng mà bạn không chờ đợi là dấu hiệu nối vào phía “nhiều”.</span></div>
        say: "Lỗi thứ nhất, không đếm dòng sau khi nối, nên nhân dòng xảy ra lặng lẽ. Hãy đếm số dòng trước và sau mỗi phép nối. Số dòng tăng mà bạn không chờ đợi là dấu hiệu đã nối vào phía nhiều."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> “Chữa” bằng đếm khác nhau <b class="red">(chỉ đúng với đếm, không đúng với tổng)</b>
          <br><span class="note">Đếm số đơn khác nhau sau khi nối vẫn ra 2, nhưng cộng tổng tiền khác nhau thì sai khi hai đơn có cùng số tiền. Gộp trước mới là cách chữa đúng.</span></div>
        say: "Lỗi thứ hai, chữa bằng đếm giá trị khác nhau, cách này chỉ đúng với đếm chứ không đúng với tổng. Đếm số đơn khác nhau sau khi nối vẫn ra 2, nhưng cộng các tổng tiền khác nhau thì sai khi hai đơn có cùng số tiền. Gộp trước mới là cách chữa đúng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nối hai bảng “nhiều” cùng lúc <b class="red">(nhân chéo)</b>
          <br><span class="note">Nối đơn với dòng hàng (3 dòng) và với lần thanh toán (2 lần) của cùng đơn: ra 3 nhân 2, bằng 6 dòng cho một đơn. Gộp từng bảng về mức đơn riêng, rồi mới nối.</span></div>
        say: "Lỗi thứ ba, nối hai bảng nhiều cùng lúc, nên bị nhân chéo. Nối đơn với 3 dòng hàng và với 2 lần thanh toán của cùng đơn thì ra 3 nhân 2, bằng 6 dòng cho một đơn. Hãy gộp từng bảng về mức đơn riêng, rồi mới nối."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Sửa nhân dòng xong lại làm <b>mất dòng</b> <b class="red">(lỗi của người đã đi làm)</b>
          <br><span class="note">Thêm đơn 3 tổng 80 nhưng chưa có dòng hàng nào (ví dụ đơn vừa tạo). Phép nối thường chỉ giữ dòng khớp ở cả hai bên.</span></div>
          <table class="t"><tr><th>cách nối sau khi gộp</th><th>số dòng</th><th>tổng tiền</th></tr>
          <tr><td>nối thường (JOIN)</td><td>2</td><td class="red">150 — mất đơn 3</td></tr>
          <tr><td>nối giữ mọi đơn (LEFT JOIN)</td><td>3 = số đơn ✓</td><td>$150 + 80 = 230$ ✓</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", 0]
        say: "Lỗi thứ tư là lỗi của người đã đi làm, sửa xong nhân dòng thì lại làm mất dòng. Giả sử thêm đơn 3 tổng 80 nhưng chưa có dòng hàng nào, ví dụ đơn vừa tạo. Bảng so hai cách nối sau khi đã gộp. Phép nối thường chỉ giữ dòng khớp ở cả hai bên, nên còn 2 dòng, tổng tiền 150, đơn 3 biến mất. Phép nối giữ mọi dòng của bảng đơn thì có 3 dòng, đúng bằng số đơn, và tổng tiền 230. Vì vậy phép thử số dòng phải đi cả hai chiều, không được nhiều hơn mà cũng không được ít hơn số đơn."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.dan_sql('SELECT COUNT(*) FROM don d JOIN dong x ON x.don = d.id') == [(4,)] and 100 * 3 + 50 * 1 == 350"
      - "alg.dan_sql('SELECT d.cua_hang, SUM(d.tong), SUM(g.sl) FROM don d JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don) g ON g.don = d.id GROUP BY d.cua_hang') == [('A', 150, 7)]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Sau phép nối đơn với dòng hàng có bao nhiêu dòng? Giải thích vì sao tổng tiền ra 350 bằng phép tính tay.</td></tr>
          <tr><td>2</td><td>Cả hai đơn đều thuộc cửa hàng A. Muốn báo “tổng tiền theo cửa hàng” và “số món theo cửa hàng” trong một bảng, viết các bước đúng.</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, sau phép nối đơn với dòng hàng có bao nhiêu dòng? Hãy giải thích vì sao tổng tiền ra 350 bằng phép tính tay. Câu hai, cả hai đơn đều thuộc cửa hàng A, muốn báo tổng tiền theo cửa hàng và số món theo cửa hàng trong một bảng, hãy viết các bước đúng. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Đơn 1 có 3 dòng hàng, đơn 2 có 1 → $3 + 1 =$ <b>4</b> dòng.</p>
          <p>Mỗi dòng mang tổng tiền của đơn mình: $100 \cdot 3 + 50 \cdot 1 = \hl{350}$.</p>
        focus: [1, 2]
        say: "Đáp án câu một, đơn 1 có 3 dòng hàng, đơn 2 có 1, nên sau phép nối có 3 cộng 1 bằng 4 dòng. Mỗi dòng mang tổng tiền của đơn mình, đơn 1 lặp 3 lần và đơn 2 một lần, nên 100 nhân 3 cộng 50 nhân 1, bằng 350."
      - show: |
          <table class="t"><tr><th>bước</th><th>việc làm</th><th>kết quả</th></tr>
          <tr><td>1</td><td>gộp dòng hàng theo đơn</td><td>số món mỗi đơn: (1, 4), (2, 3)</td></tr>
          <tr><td>2</td><td>nối với bảng đơn</td><td>một dòng mỗi đơn</td></tr>
          <tr><td>3</td><td>gộp theo cửa hàng</td><td>cửa hàng A: tổng tiền 150, số món 7</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Câu hai làm ba bước. Thứ nhất, gộp dòng hàng theo đơn để có số món mỗi đơn, đơn 1 có 4 món và đơn 2 có 3 món. Thứ hai, nối với bảng đơn để được một dòng mỗi đơn. Thứ ba, gộp theo cửa hàng, cộng tổng tiền và cộng số món, nên cửa hàng A có tổng tiền 150 và 7 món."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">biết độ mịn của từng bảng</span><span class="a">→</span>
          <span class="n">nối: kết quả mịn như bảng mịn hơn</span><span class="a">→</span>
          <span class="n">gộp bảng “nhiều” trước rồi mới nối</span><span class="a">→</span>
          <span class="n">đếm dòng trước và sau mỗi phép nối</span></div>
        say: "Tổng kết lại, hãy biết độ mịn của từng bảng, vì kết quả nối mịn như bảng mịn hơn. Gộp bảng phía nhiều trước rồi mới nối, và đếm dòng trước và sau mỗi phép nối."
      - show: |
          <div class="box key"><b>Tư duy:</b> một câu truy vấn chạy không báo lỗi <b>chưa phải</b> câu truy vấn đúng — hãy kiểm bằng một con số đã biết.</div>
        say: "Điều cần mang theo, một câu truy vấn chạy không báo lỗi chưa phải là câu truy vấn đúng, hãy kiểm bằng một con số đã biết."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>hàm cửa sổ</b> — tổng lũy kế, so với kỳ trước, xếp hạng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học hàm cửa sổ, với tổng lũy kế, so với kỳ trước, và xếp hạng. Hẹn gặp bạn ở bài tiếp theo."
