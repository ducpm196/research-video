    - '1.3'
    - '1.4'
    - '1.4'
    say: Kiểm bằng đường khác, mỗi con số được tính thẳng từ bảng chứa nó, không qua phép nối nào. Tổng tiền lấy ở bảng đơn,
      100 cộng 50 bằng 150, khớp câu đúng. Số món lấy ở bảng dòng hàng, 1 cộng 2 cộng 1 cộng 3 bằng 7. Còn số dòng sau khi
      nối bằng số dòng hàng của mỗi đơn cộng lại, 3 cộng 1 bằng 4, khớp đúng với câu sai, nên ta biết chắc chỗ thừa đến từ
      đâu. Đối chiếu tổng độc lập từ bảng gốc là bài kiểm tự động rẻ tiền nhưng bắt được hầu hết lỗi nhân dòng âm thầm.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp, cả người mới lẫn người đã đi làm
  checks:
  - 3 * 2 == 6
  - '(lambda cn: (cn.execute("INSERT INTO don VALUES (3, ''A'', 80)"), alg.dan_sql(''SELECT SUM(d.tong), COUNT(*) FROM don
    d JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don) g ON g.don = d.id'', cn), alg.dan_sql(''SELECT SUM(d.tong),
    COUNT(*) FROM don d LEFT JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don) g ON g.don = d.id'', cn))[1:])(alg.dan_db())
    == ([(150, 2)], [(230, 3)])'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Không đếm dòng sau khi nối <b class="red">(nhân dòng lặng lẽ)</b>

      <br><span class="note">Đếm số dòng trước và sau mỗi phép nối. Số dòng tăng mà bạn không chờ đợi là dấu hiệu nối vào
      phía “nhiều”.</span></div>

      '
    say: Lỗi thứ nhất, không đếm dòng sau khi nối, nên nhân dòng xảy ra lặng lẽ. Hãy đếm số dòng trước và sau mỗi phép nối.
      Số dòng tăng mà bạn không chờ đợi là dấu hiệu đã nối vào phía nhiều. Hãy tạo thói quen so sánh kết quả đếm dòng trước
      và sau mỗi phép nối ngay khi còn đang thử nghiệm truy vấn.
  - show: '<div class="box warn"><b>Lỗi 2.</b> “Chữa” bằng đếm khác nhau <b class="red">(chỉ đúng với đếm, không đúng với
      tổng)</b>

      <br><span class="note">Đếm số đơn khác nhau sau khi nối vẫn ra 2, nhưng cộng tổng tiền khác nhau thì sai khi hai đơn
      có cùng số tiền. Gộp trước mới là cách chữa đúng.</span></div>

      '
    say: Lỗi thứ hai, chữa bằng đếm giá trị khác nhau, cách này chỉ đúng với đếm chứ không đúng với tổng. Đếm số đơn khác
      nhau sau khi nối vẫn ra 2, nhưng cộng các tổng tiền khác nhau thì sai khi hai đơn có cùng số tiền. Gộp trước mới là
      cách chữa đúng. Đếm giá trị phân biệt chỉ che giấu tạm thời lỗi nhân dòng đối với phép đếm, còn phép cộng trung bình
      vẫn hỏng nặng.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nối hai bảng “nhiều” cùng lúc <b class="red">(nhân chéo)</b>

      <br><span class="note">Nối đơn với dòng hàng (3 dòng) và với lần thanh toán (2 lần) của cùng đơn: ra 3 nhân 2, bằng
      6 dòng cho một đơn. Gộp từng bảng về mức đơn riêng, rồi mới nối.</span></div>

      '
    say: Lỗi thứ ba, nối hai bảng nhiều cùng lúc, nên bị nhân chéo. Nối đơn với 3 dòng hàng và với 2 lần thanh toán của cùng
      đơn thì ra 3 nhân 2, bằng 6 dòng cho một đơn. Hãy gộp từng bảng về mức đơn riêng, rồi mới nối. Cách chữa chuẩn khi nối
      cha với hai bảng con là gom riêng từng bảng con theo mã cha rồi mới nối lại.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Sửa nhân dòng xong lại làm <b>mất dòng</b> <b class="red">(lỗi của người đã
      đi làm)</b>

      <br><span class="note">Thêm đơn 3 tổng 80 nhưng chưa có dòng hàng nào (ví dụ đơn vừa tạo). Phép nối thường chỉ giữ dòng
      khớp ở cả hai bên.</span></div>

      <table class="t"><tr><th>cách nối sau khi gộp</th><th>số dòng</th><th>tổng tiền</th></tr>

      <tr><td>nối thường (JOIN)</td><td>2</td><td class="red">150 — mất đơn 3</td></tr>

      <tr><td>nối giữ mọi đơn (LEFT JOIN)</td><td>3 = số đơn ✓</td><td>$150 + 80 = 230$ ✓</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - 0
    - '2.3'
    say: Lỗi thứ tư là lỗi của người đã đi làm, sửa xong nhân dòng thì lại làm mất dòng. Giả sử thêm đơn 3 tổng 80 nhưng chưa
      có dòng hàng nào, ví dụ đơn vừa tạo. Bảng so hai cách nối sau khi đã gộp. Phép nối thường chỉ giữ dòng khớp ở cả hai
      bên, nên còn 2 dòng, tổng tiền 150, đơn 3 biến mất. Phép nối giữ mọi dòng của bảng đơn thì có 3 dòng, đúng bằng số đơn,
      và tổng tiền 230. Vì vậy phép thử số dòng phải đi cả hai chiều, không được nhiều hơn mà cũng không được ít hơn số đơn.
      Với bảng cha chưa có dòng con, nối trái kết hợp hàm đổi giá trị trống về không giữ lại trọn vẹn doanh thu đơn mới.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.dan_sql('SELECT COUNT(*) FROM don d JOIN dong x ON x.don = d.id') == [(4,)] and 100 * 3 + 50 * 1 == 350
  - alg.dan_sql('SELECT d.cua_hang, SUM(d.tong), SUM(g.sl) FROM don d JOIN (SELECT don, SUM(sl) AS sl FROM dong GROUP BY don)
    g ON g.don = d.id GROUP BY d.cua_hang') == [('A', 150, 7)]
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Sau phép nối đơn với dòng hàng có bao nhiêu dòng? Giải thích vì sao tổng tiền ra 350 bằng phép tính
      tay.</td></tr>

      <tr><td>2</td><td>Cả hai đơn đều thuộc cửa hàng A. Muốn báo “tổng tiền theo cửa hàng” và “số món theo cửa hàng” trong
      một bảng, viết các bước đúng.</td></tr></table>

      '
    focus:
