id: L08
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 8 — Phân khúc khách hàng và phân bố lệch"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dan.yaml L08; audit/dan/verify_dan.py L08; A. Hughes, Strategic Database Marketing (bản 4, 2012) — phân khúc theo gần đây, tần suất, giá trị; DSC bài 4 (thống kê mô tả bền vững); bài 1"
assumes: [arith, frac]
# Quy ước: 10 khách hàng doanh thu 500, 200, 100, 60, 40, 30, 30, 20, 10, 10 (SỐ MINH HOẠ, nghìn). Tỉ trọng nhóm đầu = doanh thu của k% khách lớn nhất / tổng
#   (alg.top_share). Phân khúc RFM = gần đây (số ngày từ lần mua cuối), tần suất (số lần mua), giá trị (tổng tiền); tên RFM chỉ trên màn hình.
objectives:
  - "Tính tỉ trọng doanh thu của nhóm khách hàng đầu"
  - "Mô tả phân bố lệch bằng trung vị và tỉ trọng"
  - "Nhận biết ba chiều phân khúc: gần đây, tần suất, giá trị"
asr_reviewed:
  - {sentence: "Hãy báo kèm trung vị, và tỉ trọng nhóm đầu, tức k phần trăm khách lớn nhất chiếm bao nhiêu phần trăm doanh thu.", reason: "ASR chép “Hãy báo kèm trung vị và tỷ trọng nhóm đầu tất cả phần trăm khách lớn nhất chiếm bao nhiêu phần trăm doanh thu.” (0.875): “tỉ” ASR viết chính tả “tỷ” (cùng âm); chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: tức (trong “tức k” → “tất cả”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“Khách trung bình chi 100 nghìn” — nhưng không ai chi 100"
    checks:
      - "sum([500, 200, 100, 60, 40, 30, 30, 20, 10, 10]) / 10 == 100 and __import__('statistics').median([500, 200, 100, 60, 40, 30, 30, 20, 10, 10]) == 35"
    steps:
      - show: |
          <p>Báo cáo ghi “mỗi khách chi trung bình 100 nghìn”, và nhóm tiếp thị thiết kế ưu đãi cho người chi 100 nghìn. Nhưng nhìn kỹ: một khách chi 500, còn một nửa số khách chi <b>không quá 35</b>. “Khách trung bình” không giống ai cả.</p>
          <div class="box key">Hôm nay: <b>phân bố lệch</b> và <b>phân khúc</b> — mô tả đúng nhóm khách, và chia họ theo hành vi.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, báo cáo ghi mỗi khách chi trung bình 100 nghìn, và nhóm tiếp thị thiết kế ưu đãi cho người chi 100 nghìn. Nhưng nhìn kỹ thì một khách chi 500, còn một nửa số khách chi không quá 35. Khách trung bình không giống ai cả. Hôm nay ta học phân bố lệch và phân khúc, để mô tả đúng nhóm khách, và chia họ theo hành vi."

  - id: prereq
    kind: prereq
    title: "Ôn lại: trung vị, và tỉ trọng"
    checks:
      - "__import__('statistics').median([10, 20, 30, 40]) == 25 and __import__('statistics').median([10, 20, 30]) == 20"
      - "200 / 1000 == 0.2"
    steps:
      - show: |
          <table class="t"><tr><th>dãy đã sắp xếp</th><th>số ở giữa</th><th>trung vị</th></tr>
          <tr><td>10, 20, 30 (lẻ)</td><td>20</td><td>20</td></tr>
          <tr><td>10, 20, 30, 40 (chẵn)</td><td>20 và 30</td><td>$\frac{20 + 30}{2} = 25$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước hết, ta cần hiểu trung vị từ đầu, đó là số đứng giữa khi đã sắp xếp dãy số từ nhỏ tới lớn. Dãy 10, 20, 30 có số phần tử lẻ, số giữa là 20, nên trung vị là 20. Dãy 10, 20, 30, 40 có số phần tử chẵn, nên lấy trung bình hai số giữa 20 và 30, được 25."
      - show: |
          <p><b>Tỉ trọng</b> $= \frac{\text{phần}}{\text{tổng}}$: một khách chi 200 trong tổng doanh thu 1000 chiếm $\frac{200}{1000} = 20\%$. Tỉ trọng của mọi phần cộng lại luôn bằng 100%.</p>
        say: "Thứ hai, tỉ trọng bằng phần chia tổng. Một khách chi 200 trong tổng doanh thu 1000 chiếm 200 chia 1000, bằng 20 phần trăm. Tỉ trọng của mọi phần cộng lại luôn bằng 100 phần trăm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: tỉ trọng nhóm đầu và ba chiều phân khúc"
    steps:
      - show: |
          <p><b>Phân bố lệch</b>: vài giá trị rất lớn kéo trung bình lên xa trung vị. Báo kèm <b>trung vị</b> và <b>tỉ trọng nhóm đầu</b>: k% khách lớn nhất chiếm bao nhiêu phần trăm doanh thu.</p>
          <table class="t"><tr><th>chiều (RFM = Recency, Frequency, Monetary)</th><th>đo</th><th>ý nghĩa</th></tr>
          <tr><td><b>gần đây</b></td><td>số ngày từ lần mua cuối</td><td>càng ít càng còn “sống”</td></tr>
          <tr><td><b>tần suất</b></td><td>số lần mua trong kỳ</td><td>mức gắn bó</td></tr>
          <tr><td><b>giá trị</b></td><td>tổng tiền trong kỳ</td><td>đóng góp doanh thu</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Phân bố lệch là khi vài giá trị rất lớn kéo trung bình lên xa trung vị. Hãy báo kèm trung vị, và tỉ trọng nhóm đầu, tức k phần trăm khách lớn nhất chiếm bao nhiêu phần trăm doanh thu. Bảng có ba chiều phân khúc. Gần đây đo số ngày từ lần mua cuối, càng ít thì khách càng còn sống. Tần suất đo số lần mua trong kỳ, cho biết mức gắn bó. Giá trị đo tổng tiền trong kỳ, cho biết đóng góp doanh thu."

  - id: intuition
    kind: intuition
    title: "Cái đuôi dài: vài cột cao, nhiều cột thấp"
    checks:
      - "alg.top_share([500, 200, 100, 60, 40, 30, 30, 20, 10, 10], 0.2) == 0.7 and sum([500, 200, 100, 60, 40, 30, 30, 20, 10, 10]) / 10 == 100 and __import__('statistics').median([500, 200, 100, 60, 40, 30, 30, 20, 10, 10]) == 35 and sum(1 for x in [500, 200, 100, 60, 40, 30, 30, 20, 10, 10] if x < 100) == 7"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><g fill="#1f2937" font-size="22"><rect x="160" y="70" width="80" height="250" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><text x="200" y="60" text-anchor="middle">500</text><rect x="260" y="220" width="80" height="100" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><text x="300" y="210" text-anchor="middle">200</text><rect x="360" y="270" width="80" height="50" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="400" y="260" text-anchor="middle">100</text><rect x="460" y="290" width="80" height="30" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="560" y="300" width="80" height="20" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="660" y="305" width="80" height="15" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="760" y="305" width="80" height="15" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="860" y="310" width="80" height="10" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="960" y="315" width="80" height="5" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="1060" y="315" width="80" height="5" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><line x1="140" y1="270" x2="1180" y2="270" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 6"/><text x="1200" y="278" fill="#b91c1c">trung bình 100</text><line x1="140" y1="302" x2="1180" y2="302" stroke="#059669" stroke-width="3"/><text x="1200" y="310" fill="#059669">trung vị 35</text><text x="560" y="90" fill="#eb6834" font-weight="bold">2 khách đầu: 500 + 200 = 700, tức 70% doanh thu</text><text x="560" y="130">8 khách còn lại: 300, tức 30%</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình xếp 10 khách từ chi nhiều tới chi ít, mỗi cột là doanh thu của một khách. Hai cột cam đầu tiên cao vượt hẳn, cộng lại 700, tức 70 phần trăm doanh thu, còn 8 cột xanh thấp hơn hẳn chỉ góp 30 phần trăm. Đường đỏ là trung bình 100, bị hai cột cao kéo lên, nên nằm cao hơn mức chi của 7 trong 10 khách. Đường lục là trung vị 35, chia đôi số khách, nên mô tả khách điển hình sát hơn nhiều."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "10 khách, 20% đầu chiếm 70%"
    checks:
      - "alg.top_share([500, 200, 100, 60, 40, 30, 30, 20, 10, 10], 0.2) == 0.7 and sum([500, 200, 100, 60, 40, 30, 30, 20, 10, 10]) == 1000 and 700 / 300 > 2"
    steps:
      - show: |
          <p><b>Bước 1</b> — tổng $500 + 200 + 100 + 60 + 40 + 30 + 30 + 20 + 10 + 10 = 1000$; trung bình mỗi khách $\frac{1000}{10} = 100$.</p>
        say: "Bước một, cộng doanh thu của 10 khách được tổng 1000. Chia cho 10 khách, trung bình mỗi khách là 100."
      - show: |
          <p><b>Bước 2</b> — sắp tăng dần: 10, 10, 20, 30, <b>30, 40</b>, 60, 100, 200, 500. Hai số giữa là 30 và 40, trung vị $\frac{30 + 40}{2} = 35$.</p>
        say: "Bước hai, sắp doanh thu tăng dần. Có 10 số, một số chẵn, nên hai số giữa là số thứ năm và thứ sáu, 30 và 40. Trung vị bằng 30 cộng 40 chia 2, bằng 35."
      - clear: true
        show: |
          <table class="t"><tr><th>chỉ số</th><th>giá trị</th></tr>
          <tr><td>tổng doanh thu</td><td>1000</td></tr>
          <tr><td>trung bình mỗi khách</td><td>100</td></tr>
          <tr><td>trung vị</td><td>35</td></tr>
          <tr><td>20% khách đầu (2 người: 500, 200)</td><td>$\frac{700}{1000} = \hl{70\%}$ doanh thu</td></tr></table>
          <p><b>Bước 3</b> — 20% của 10 khách là 2 khách.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bước ba, bảng mô tả 10 khách hàng. Tổng doanh thu là 1000. Trung bình mỗi khách là 100. Trung vị là 35. Hai khách đầu, 500 và 200, tức 20 phần trăm số khách, chiếm 700 chia 1000, bằng 70 phần trăm doanh thu. Vì 20 phần trăm của 10 khách chính là 2 khách."
      - show: |
          <p><b>Bước 4</b> — 2 khách đầu mang lại 700, gấp hơn hai lần 300 của cả 8 người còn lại cộng lại. Báo cáo nên ghi: trung vị 35, 20% khách đầu chiếm 70%.</p>
        say: "Bước bốn, như vậy 2 khách đầu mang lại 700, gấp hơn hai lần 300 của cả 8 người còn lại cộng lại. Báo cáo nên ghi trung vị 35, và 20 phần trăm khách đầu chiếm 70 phần trăm doanh thu."

  - id: check
    kind: check
    title: "Tự kiểm: phần bù, và đếm hai nửa"
    checks:
      - "sum(sorted([500, 200, 100, 60, 40, 30, 30, 20, 10, 10])[:8]) == 300 and 0.7 + 0.3 == 1.0"
      - "sum(1 for x in [500, 200, 100, 60, 40, 30, 30, 20, 10, 10] if x < 35) == 5 and sum(1 for x in [500, 200, 100, 60, 40, 30, 30, 20, 10, 10] if x > 35) == 5"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác</th><th>kết quả</th></tr>
          <tr><td>70%</td><td>8 khách còn lại: $100 + 60 + 40 + 30 + 30 + 20 + 10 + 10 = 300$, tức 30%; $70\% + 30\%$</td><td>100% ✓</td></tr>
          <tr><td>trung vị 35</td><td>đếm: dưới 35 có 5 khách, trên 35 có 5 khách</td><td>chia đôi ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Thay vì cộng nhóm đầu, ta cộng 8 khách còn lại được 300, tức 30 phần trăm. Vì tỉ trọng các phần cộng lại phải bằng 100 phần trăm, 70 cộng 30 bằng 100 là khớp. Với trung vị, ta đếm thẳng, có 5 khách chi dưới 35 và 5 khách chi trên 35, nên 35 đúng là điểm chia đôi số khách."


  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, cả người mới lẫn người đã đi làm"
    checks:
      - "sum([500, 200, 100, 60, 40, 30, 30, 20, 10, 10]) / 10 == 100 and __import__('statistics').median([500, 200, 100, 60, 40, 30, 30, 20, 10, 10]) == 35"
      - "round(500 / 9, 2) == 55.56 and __import__('statistics').median([200, 100, 60, 40, 30, 30, 20, 10, 10]) == 30 and round((500 / 9 - 100) / 100 * 100) == -44 and round((30 - 35) / 35 * 100) == -14"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Báo trung bình trên phân bố lệch <b class="red">(“khách điển hình” không tồn tại)</b>
          <br><span class="note">Trung bình 100, trung vị 35. Báo cả hai, cùng tỉ trọng nhóm đầu, hoặc vẽ phân bố theo thang lôgarit (mỗi nấc trên trục gấp 10 lần nấc trước: 10, 100, 1000).</span></div>
        say: "Lỗi thứ nhất, báo trung bình trên phân bố lệch, nên khách điển hình không tồn tại. Trung bình là 100 mà trung vị là 35. Hãy báo cả hai, cùng tỉ trọng nhóm đầu, hoặc vẽ phân bố theo thang lôgarit, tức trục mà mỗi nấc gấp 10 lần nấc trước, như 10, 100, 1000."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Phân khúc theo một kỳ rồi dùng mãi <b class="red">(khách đổi nhóm)</b>
          <br><span class="note">Khách giá trị cao năm ngoái có thể đã ngừng mua. Tính lại phân khúc định kỳ, và theo dõi dòng chảy giữa các nhóm.</span></div>
        say: "Lỗi thứ hai, phân khúc theo một kỳ rồi dùng mãi, trong khi khách đổi nhóm. Khách giá trị cao năm ngoái có thể đã ngừng mua. Hãy tính lại phân khúc định kỳ, và theo dõi dòng chảy giữa các nhóm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhìn mỗi giá trị, bỏ gần đây <b class="red">(chăm sóc khách đã đi)</b>
          <br><span class="note">Khách chi nhiều nhưng 300 ngày chưa quay lại cần chiến dịch “mời quay lại”, khác hẳn khách chi nhiều tuần trước. Xét cả ba chiều.</span></div>
        say: "Lỗi thứ ba, chỉ nhìn giá trị mà bỏ chiều gần đây, nên chăm sóc nhầm khách đã đi. Khách chi nhiều nhưng 300 ngày chưa quay lại cần chiến dịch mời quay lại, khác hẳn khách chi nhiều tuần trước. Hãy xét cả ba chiều."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Theo dõi “chi tiêu trung bình mỗi khách” trên phân bố lệch <b class="red">(lỗi của người đã đi làm)</b>
          <br><span class="note">Giả sử khách chi 500 ngừng mua, 9 khách còn lại giữ nguyên.</span></div>
          <table class="t"><tr><th>chỉ số</th><th>trước</th><th>sau</th><th>thay đổi</th></tr>
          <tr><td>trung bình mỗi khách</td><td>100</td><td>$\frac{500}{9} \approx 55{,}56$</td><td class="red">≈ −44%</td></tr>
          <tr><td>trung vị</td><td>35</td><td>30</td><td>≈ −14%</td></tr></table>
          <p class="note">Một người rời đi làm biểu đồ trung bình sụp gần một nửa, trong khi 9 khách kia không đổi gì. Người làm nghề theo dõi riêng nhóm khách lớn, và dùng trung vị cho “khách điển hình”.</p>
        focus: [1, 1, 2, "2.2", "2.3", 3]
        say: "Lỗi thứ tư là lỗi của người đã đi làm, theo dõi chi tiêu trung bình mỗi khách trên một phân bố lệch. Giả sử khách chi 500 ngừng mua, còn 9 khách kia giữ nguyên. Bảng so chỉ số trước và sau. Trung bình mỗi khách từ 100 rơi xuống 500 chia 9, khoảng 55 phẩy 56, giảm khoảng 44 phần trăm. Trung vị chỉ từ 35 xuống 30, giảm khoảng 14 phần trăm. Một người rời đi làm biểu đồ trung bình sụp gần một nửa, nên người làm nghề theo dõi riêng nhóm khách lớn, và dùng trung vị để mô tả khách điển hình."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.top_share([500, 200, 100, 60, 40, 30, 30, 20, 10, 10], 0.1) == 0.5 and round(1 - alg.top_share([500, 200, 100, 60, 40, 30, 30, 20, 10, 10], 0.5), 2) == 0.1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cùng 10 khách: 10% khách đầu chiếm bao nhiêu doanh thu?</td></tr>
          <tr><td>2</td><td>Một nửa số khách chi ít nhất chiếm bao nhiêu phần trăm doanh thu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cùng 10 khách, 10 phần trăm khách đầu chiếm bao nhiêu doanh thu? Câu hai, một nửa số khách chi ít nhất chiếm bao nhiêu phần trăm doanh thu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① 10% của 10 khách là 1 khách. Khách lớn nhất chi 500.</p>
          <p>Tỉ trọng: $\frac{500}{1000} = \hl{50\%}$.</p>
        focus: [1, 2]
        say: "Đáp án câu một, 10 phần trăm của 10 khách là 1 khách, chính là khách lớn nhất chi 500. Tỉ trọng là 500 chia 1000, bằng 50 phần trăm."
      - show: |
