      - "5 * 0.025 == 0.125 and 1 - 0.975 ** 5 < 0.125 and round(600 / 52, 1) == 11.5 and 600 / 52 > 7"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>1 638 400 người</td><td>tách bình phương: $4^2 \cdot 2^2 \cdot 30^2 = 57\,600$; chia $0{,}1875^2$ ra đúng 1 638 400 ✓</td></tr>
          <tr><td>30 400 người</td><td>tính thẳng với chênh lệch 0,01: $64 \cdot 0{,}0475 / 0{,}0001 = 30\,400$ ✓</td></tr>
          <tr><td>67% ngày đầu</td><td>máy thử 20&nbsp;000 ngày đầu không có hiệu ứng: khoảng 66,9% rơi ra ngoài 0,43 độ lệch ✓</td></tr>
          <tr><td>12% và 1,64 ca mỗi ngày</td><td>chặn trên: 5 lần 2,5% = 12,5% ≥ 11,9% ✓; theo tuần: 600 / 52 ≈ 11,5 ca, hơn 7 ca mỗi tuần ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Tách bình phương, 4 bình phương nhân 2 bình phương nhân 30 bình phương bằng 57 nghìn 600, chia 0 phẩy 1875 bình phương ra đúng 1 triệu 638 nghìn 400. Tính thẳng với chênh lệch 0 phẩy 01 cũng ra 30 nghìn 400. Cho máy thử 20 nghìn ngày đầu không có hiệu ứng, khoảng 66 phẩy 9 phần trăm rơi ra ngoài ngưỡng. Chặn trên 5 lần 2 phẩy 5 là 12 phẩy 5 phần trăm, và 600 ca chia 52 tuần là khoảng 11 phẩy 5 ca mỗi tuần."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
