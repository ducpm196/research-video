id: L12
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 12 — Tình huống chuyên gia theo dòng thời gian: thử nghiệm có đối chứng ở quy mô lớn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
case: journey
source: "curriculum/dan.yaml L12; audit/dan/sources_L12.md (câu trích nguyên văn, đọc 2026-11-02); audit/dan/verify_dan.py L12; R. Kohavi, R. M. Henne, D. Sommerfield, Practical Guide to Controlled Experiments on the Web: Listen to Your Customers not to the HiPPO, KDD 2007 [KO07]; R. Kohavi, T. Crook, R. Longbotham, Online Experimentation at Microsoft, 2009 [KO09]; R. Kohavi, A. Deng, B. Frasca, R. Longbotham, T. Walker, Y. Xu, Trustworthy Online Controlled Experiments: Five Puzzling Outcomes Explained, KDD 2012 [KO12]; R. Kohavi, A. Deng, B. Frasca, T. Walker, Y. Xu, N. Pohlmann, Online Controlled Experiments at Large Scale, KDD 2013 [KO13]; A. Deng, Y. Xu, R. Kohavi, T. Walker, Improving the Sensitivity of Online Controlled Experiments by Utilizing Pre-Experiment Data, WSDM 2013 [DE13]; S. Gupta, R. Kohavi, D. Tang, Y. Xu và cộng sự, Top Challenges from the first Practical Online Controlled Experiments Summit, SIGKDD Explorations 21(1), 2019 [GU19]; A. Fabijan và cộng sự, Diagnosing Sample Ratio Mismatch in Online Controlled Experiments, KDD 2019 [FA19]; DAN bài 10 (sai số chuẩn của tỉ lệ), bài 11 (báo động giả); khoá DSC bài 8 (cỡ mẫu), bài 9 (kiểm định nhiều lần)"
assumes: [arith, frac, cdot, power, sqrt, approx]
# Quy ước: “nhóm đối chứng” = control, “nhóm thử” = treatment; “tiêu chí tổng thể” = OEC (Overall Evaluation Criterion);
#   “thử nghiệm hai nhóm giống hệt” = A/A test; “nhóm giữ lại” = holdout; “lệch tỉ lệ chia nhóm” = SRM (Sample Ratio Mismatch);
#   “đường chia” = number line (Bing), tầng phân nhóm trực giao. Lời đọc không nói “A/B”, “A/A”, “OEC”, “HiPPO”, “SRM”, “Bing”, “MSN”,
#   “mili giây”, “p-value”: nói “thử nghiệm có đối chứng”, “thử nghiệm hai nhóm giống hệt”, “tiêu chí tổng thể”, “ý kiến của người lương
#   cao nhất”, “lệch tỉ lệ chia nhóm”, “công cụ tìm kiếm của hãng”, “trang tin”, “phần nghìn giây”, “giá trị p”.
#   Chữ t trong 1/(4t(1 − t)) là phần lưu lượng dành cho nhóm thử (không dùng p, trùng ký hiệu xác suất).
#   Mọi sự kiện và con số có nguồn ghi trong audit/dan/sources_L12.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”:
#   1000 người · 2 phiên · 3 truy vấn, 10 chỉ số khi dò tương tác, tương quan 0,7, 1 triệu và 10 triệu người, cửa hàng 20 000 người mỗi
#   tuần, 5 màu nút đều là SỐ MINH HOẠ. Tên: lexicon_vi.DAN.yaml (probe p2).
objectives:
  - "Kể lại hành trình thử nghiệm có đối chứng trực tuyến qua năm chặng từ 2007 tới 2019, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại cỡ mẫu, thời gian chạy khi chia lệch, xác suất báo nhầm khi thử nhiều phiên bản và phép kiểm tỉ lệ chia nhóm"
  - "Chọn cách chạy thử nghiệm hợp với lượng người dùng của chính mình, kèm điều kiện đổi lựa chọn"
asr_reviewed:
  - {sentence: "Lệch tỉ lệ chia nhóm là khi số người thật trong mỗi nhóm khác hẳn tỉ lệ đã đặt.", reason: "ASR chép “Lạc tỷ lệ chi nhóm là khi số người thật trong mỗi nhóm khác hẳn tỷ lệ đã đặt.” (0.789): “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: lệch (trong “lệch tỉ” → “lạc tỷ”), chia/chi — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cách xử lý là hạ ngưỡng giá trị p, và chạy lại một lần cuối với độ mạnh cao hơn.", reason: "ASR chép “Cách xử lý là hạ ngưỡng giá trị T và chạy lại một lần cuối với độ mạnh cao hơn.” (0.95): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai phần ba ý tưởng không làm chỉ số tốt lên"
    checks:
      - "3 - 1 == 2 and round(1 / 3, 2) == 0.33"
    steps:
      - show: |
          <p>Năm 2009, nhóm thử nghiệm của Microsoft viết: trong các thử nghiệm được thiết kế để cải thiện một chỉ số chính, chỉ khoảng <b>một phần ba</b> thành công.</p>
          <p>Năm 2013, công cụ tìm kiếm Bing chạy <b>hơn 200 thử nghiệm cùng lúc</b>; 90% người dùng đủ điều kiện nằm trong <b>hơn 15 thử nghiệm</b> một lúc.</p>
          <div class="box key">Hôm nay: năm chặng từ 2007 tới 2019 — từ một nhóm 7 người tới hàng trăm thử nghiệm cùng lúc, mà kết quả vẫn đáng tin.</div>
        focus: [1, 2, 3]
        say: "Chào bạn, năm 2009, nhóm thử nghiệm của Microsoft viết rằng chỉ khoảng một phần ba thử nghiệm nhằm cải thiện một chỉ số chính là thành công. Năm 2013, công cụ tìm kiếm của hãng chạy hơn 200 thử nghiệm cùng lúc, và đa số người dùng nằm trong hơn 15 thử nghiệm một lúc. Hôm nay ta đi qua năm chặng từ 2007 tới 2019, để biết làm sao chạy nhiều thử nghiệm như vậy mà kết quả vẫn đáng tin."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ các bài trước"
    checks:
      - "abs((0.1 * 0.9 / 900) ** 0.5 - 0.01) < 1e-12"
      - "(1 / 2) ** 2 == 0.25 and 4 * 4 == 16"
      - "round(1 - 0.95 ** 20, 3) == 0.642"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 10</td><td>tỉ lệ đo trên một số người dao động quanh giá trị thật; <b>sai số chuẩn</b> = căn của (tỉ lệ nhân (1 trừ tỉ lệ), chia số người)</td><td>tỉ lệ 0,1, 900 người: $\sqrt{0{,}1 \cdot 0{,}9 / 900} = 0{,}01$</td></tr>
          <tr><td>khoá Khoa học dữ liệu, bài 8</td><td>cỡ mẫu tỉ lệ với <b>nghịch đảo bình phương</b> của chênh lệch muốn thấy; vượt 1,96 lần sai số chuẩn là có ý nghĩa ở mức 95%</td><td>chênh lệch nhỏ đi 2 lần → cần $2^2 = 4$ lần số người; nhỏ đi 4 lần → 16 lần</td></tr>
          <tr><td>bài 11</td><td>xác suất có <b>ít nhất một</b> báo nhầm trong nhiều phép kiểm độc lập $= 1 -$ (xác suất không báo nhầm)$^{\text{số phép kiểm}}$</td><td>20 phép kiểm, mỗi phép 5%: $1 - 0{,}95^{20} \approx 0{,}642$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Bảng nhắc lại ba điều đã học. Ở bài 10, sai số chuẩn của một tỉ lệ bằng căn của tỉ lệ nhân 1 trừ tỉ lệ, chia số người, ví dụ tỉ lệ 0 phẩy 1 trên 900 người cho 0 phẩy 01. Ở bài 8 của khoá Khoa học dữ liệu, cỡ mẫu tỉ lệ với nghịch đảo bình phương của chênh lệch muốn thấy. Nên chênh lệch nhỏ đi 2 lần thì cần 4 lần số người, nhỏ đi 4 lần thì cần 16 lần. Ở bài 11, xác suất có ít nhất một báo nhầm là 1 trừ xác suất không báo nhầm, mũ số phép kiểm, như 20 phép kiểm 5 phần trăm cho khoảng 0 phẩy 642."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>nhóm đối chứng</b>, <b>nhóm thử</b></td><td>chia ngẫu nhiên và cố định: một nhóm thấy bản cũ, một nhóm thấy bản mới</td></tr>
          <tr><td><b>tiêu chí tổng thể</b> (OEC)</td><td>một chỉ số đo được trong vài tuần, dùng để quyết định phát hành</td></tr>
          <tr><td><b>thử nghiệm hai nhóm giống hệt</b> (A/A)</td><td>hai nhóm thấy cùng một bản; để kiểm chính hệ thống thử nghiệm</td></tr>
          <tr><td><b>nhóm giữ lại</b></td><td>người dùng không vào thử nghiệm nào, để đo chi phí của hệ thử nghiệm</td></tr>
          <tr><td><b>lệch tỉ lệ chia nhóm</b> (SRM)</td><td>số người thật trong mỗi nhóm khác hẳn tỉ lệ đã đặt</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Nhóm đối chứng thấy bản cũ, nhóm thử thấy bản mới, chia ngẫu nhiên và cố định. Tiêu chí tổng thể là một chỉ số đo được trong vài tuần, dùng để quyết định phát hành. Thử nghiệm hai nhóm giống hệt cho hai nhóm thấy cùng một bản, để kiểm chính hệ thống. Nhóm giữ lại không vào thử nghiệm nào, để đo chi phí của hệ thử nghiệm. Lệch tỉ lệ chia nhóm là khi số người thật trong mỗi nhóm khác hẳn tỉ lệ đã đặt."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2007</text><text x="160" y="200">tính cỡ mẫu trước</text><text x="160" y="232">tăng dần tỉ lệ</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2012</text><text x="500" y="200">kết quả lạ là lỗi</text><text x="500" y="232">thử hai nhóm giống hệt</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2013</text><text x="850" y="200">hơn 200 cùng lúc</text><text x="850" y="232">nhóm giữ lại 10%</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2013</text><text x="1200" y="200">báo nhầm, tương tác</text><text x="1200" y="232">chạy lại để xác nhận</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2019</text><text x="1540" y="200">13 tổ chức</text><text x="1540" y="232">kiểm tỉ lệ chia nhóm</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô rất lớn → giữ độ tin cậy → ổn định, tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2007 là tính cỡ mẫu trước và tăng dần tỉ lệ, rồi năm 2012 là bài học kết quả lạ thường là lỗi. Năm 2013 có hơn 200 thử nghiệm cùng lúc, kèm cách chống báo nhầm, và năm 2019, 13 tổ chức cùng kiểm tỉ lệ chia nhóm như một phép thử chuẩn."

  # ───────────────────────── 5. CƠ CHẾ CHUNG ─────────────────────────
  - id: mech
    kind: concept
    title: "Cơ chế chung: băm mã người dùng, mỗi đường chia một nhóm"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="30" y="130" width="230" height="80" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/><text x="145" y="165">mã ẩn danh</text><text x="145" y="195">của người dùng</text>
          <rect x="370" y="130" width="200" height="80" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="470" y="165">hàm băm</text><text x="470" y="195">giả ngẫu nhiên</text>
          <rect x="720" y="30" width="740" height="70" rx="10" fill="#fef3c7" stroke="#eb6834" stroke-width="3"/><text x="1090" y="73">đường chia 1 (quảng cáo): đối chứng | thử X | thử Y</text>
          <rect x="720" y="135" width="740" height="70" rx="10" fill="#fef3c7" stroke="#eb6834" stroke-width="3"/><text x="1090" y="178">đường chia 2 (xếp hạng): đối chứng | thử Z</text>
          <rect x="720" y="240" width="740" height="70" rx="10" fill="#fef3c7" stroke="#eb6834" stroke-width="3"/><text x="1090" y="283">đường chia 3 (giao diện): đối chứng | thử W</text>
          </g>
          <line x1="260" y1="170" x2="365" y2="170" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="570" y1="160" x2="715" y2="70" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="570" y1="170" x2="715" y2="170" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="570" y1="180" x2="715" y2="275" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <text x="470" y="290" font-size="22" fill="#059669" text-anchor="middle">cùng mã → cùng nhóm mỗi lần ghé</text>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình này là cơ chế chung của mọi chặng. Mã ẩn danh của người dùng đi qua một hàm băm giả ngẫu nhiên, nên cùng một người luôn rơi vào cùng một nhóm mỗi lần ghé. Trên một đường chia, mỗi người chỉ ở đúng một nhóm, nhưng có nhiều đường chia, nên một người có thể cùng lúc ở nhóm thử X về quảng cáo và nhóm thử Z về xếp hạng."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2007 — khai sinh: tính cỡ mẫu trước, tăng dần tỉ lệ"
    stage: {year: "2007", scale: "nhóm thử nghiệm của Microsoft lập 3/2006 như một dự án ươm mầm, cuối hè có 7 người; bài hướng dẫn KDD 2007", source: "[KO07] [KO09]", practice: "nghe khách hàng thay vì ý kiến người lương cao nhất; tính cỡ mẫu trước; chọn chỉ số ít dao động; tăng dần tỉ lệ rồi chạy 50/50; tự dừng khi bản mới kém rõ"}
    checks:
      - "(4 * 2 * 30 / (3.75 * 0.05)) == 1280 and 1280 ** 2 == 1638400"
      - "round((4 * 2 * (0.05 * 0.95) ** 0.5 / (0.05 * 0.05)) ** 2) == 486400 and round(486400 / 16) == 30400"
      - "round(1 / (4 * 0.01 * 0.99), 2) == 25.25 and round(1 / (4 * 0.05 * 0.95), 2) == 5.26 and 5 * 5 == 25 and 5 * 25 == 125"
    steps:
      - show: |
          <p><b>Quy mô:</b> tháng 3/2006, nhóm thử nghiệm của Microsoft ra đời như một dự án ươm mầm; cuối hè có <b>7 người</b>. Năm 2007, nhóm viết bài hướng dẫn: <b>nghe khách hàng</b>, đừng nghe “ý kiến của người lương cao nhất” (HiPPO).</p>
          <p><b>Điểm nghẽn:</b> cần bao nhiêu người dùng thì mới thấy được một thay đổi nhỏ? Công thức gần đúng của bài năm 2007, mức tin cậy 95%, độ mạnh 90%:</p>
          <p>$$n = \left(\frac{4 \cdot \text{số nhóm} \cdot \text{độ lệch chuẩn}}{\text{chênh lệch muốn thấy}}\right)^2$$</p>
        focus: [1, 1, 2, 3]
        say: "Ở chặng một, tháng 3 năm 2006, nhóm thử nghiệm của Microsoft ra đời như một dự án ươm mầm, cuối hè có 7 người. Năm 2007, nhóm viết bài hướng dẫn, khuyên nghe khách hàng thay vì ý kiến của người lương cao nhất. Điểm nghẽn là không biết cần bao nhiêu người dùng thì mới thấy một thay đổi nhỏ. Công thức gần đúng của bài là bình phương của 4 nhân số nhóm nhân độ lệch chuẩn, chia chênh lệch muốn thấy."
      - clear: true
        show: |
          <p>Ví dụ của bài năm 2007: 5% người ghé có mua, mỗi người mua chi 75 đô la → trung bình 3,75 đô la; độ lệch chuẩn 30 đô la. Hai nhóm.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. đo doanh thu, muốn thấy 5%</td><td>chênh lệch $3{,}75 \cdot 0{,}05 = 0{,}1875$; $4 \cdot 2 \cdot 30 / 0{,}1875 = 1280$</td><td>$1280^2 = \hl{1\,638\,400}$ người</td></tr>
          <tr><td>Bước 2. đo tỉ lệ mua, muốn thấy 5%</td><td>độ lệch chuẩn $\sqrt{0{,}05 \cdot 0{,}95}$; chênh lệch $0{,}05 \cdot 0{,}05 = 0{,}0025$</td><td>$\hlb{486\,400}$ người</td></tr>
          <tr><td>Bước 3. tỉ lệ mua, muốn thấy 20%</td><td>chênh lệch lớn gấp 4 → chia $4^2 = 16$</td><td>$486\,400 / 16 = \hlg{30\,400}$ người</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.4"]
        say: "Ví dụ của bài là 5 phần trăm người ghé có mua, mỗi người mua chi 75 đô la, trung bình 3 phẩy 75 đô la, độ lệch chuẩn 30 đô la. Bước một, muốn thấy doanh thu đổi 5 phần trăm, chênh lệch là 0 phẩy 1875, và 4 nhân 2 nhân 30 chia cho nó được 1280. Bình phương lên là 1 triệu 638 nghìn 400 người. Bước hai, đo tỉ lệ mua, một chỉ số ít dao động hơn, thì chỉ cần 486 nghìn 400 người. Bước ba, muốn thấy thay đổi 20 phần trăm, lớn gấp 4, thì chia 16, còn 30 nghìn 400 người."
      - clear: true
        show: |
          <p><b>Cách xử lý thứ hai — tăng dần tỉ lệ:</b> mở bản mới cho 0,1% → 0,5% → 2,5% → 10% → 50%, mỗi nấc vài giờ; bản mới kém rõ thì <b>tự dừng</b>, đưa tỉ lệ về 0.</p>
          <table class="t"><tr><th>bước: nhóm thử nhận phần $t$, thời gian gấp $1/(4t(1-t))$ lần so với 50/50</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 4. chia 99/1, $t = 0{,}01$</td><td>$1/(4 \cdot 0{,}01 \cdot 0{,}99)$</td><td>≈ $\hl{25}$ lần</td></tr>
          <tr><td>Bước 5. chia 95/5, cần 5 ngày nếu 50/50</td><td>$1/(4 \cdot 0{,}05 \cdot 0{,}95) \approx 5$; $5 \cdot 5$</td><td>$\hlb{25}$ ngày; 99/1 thì hơn $\hlg{125}$ ngày</td></tr></table>
          <p class="note">Thực hành: tăng dần để bắt lỗi trên ít người, nhưng <b>đo thật bằng 50/50</b>. Điều kiện: có ít nhất vài nghìn người dùng, và chỉ số chọn trước.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Cách xử lý thứ hai là tăng dần tỉ lệ, từ 0 phẩy 1 phần trăm người dùng lên 50 phần trăm, và hệ tự dừng nếu bản mới kém rõ. Bước bốn, nếu cứ để chia 99 và 1, thời gian chạy gấp khoảng 25 lần so với chia đôi. Bước năm, cần 5 ngày nếu chia đôi thì chia 95 và 5 mất 25 ngày, còn 99 và 1 mất hơn 125 ngày. Vậy hãy tăng dần để bắt lỗi trên ít người, nhưng đo thật bằng chia đôi, khi có ít nhất vài nghìn người dùng và chỉ số chọn trước."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2012 — tăng trưởng: kết quả lạ thường là lỗi"
    stage: {year: "2012", scale: "hàng nghìn thử nghiệm; mỗi kết quả khó hiểu mất nhiều tuần tới nhiều tháng để phân tích", source: "[KO12]", practice: "chọn tiêu chí tổng thể theo giá trị lâu dài (phiên mỗi người); chạy liên tục thử nghiệm hai nhóm giống hệt; không ngoại suy xu hướng mấy ngày đầu; chạy ít nhất một tuần"}
    checks:
      - "1000 * 2 * 3 == 6000 and round(1000 * 2 * 3.3) == 6600 and round(6600 / 6000 - 1, 2) == 0.10"
      - "round(21 ** 0.5, 2) == 4.58 and round(1.96 / 21 ** 0.5, 2) == 0.43 and round(1.96 * (2 / 21) ** 0.5, 2) == 0.60"
      - "(Phi := lambda z: 0.5 * (1 + math.erf(z / math.sqrt(2)))) and round(2 * (1 - Phi(1.96 / 21 ** 0.5)), 2) == 0.67 and round(2 * (1 - Phi(1.96 * (2 / 21) ** 0.5)), 2) == 0.55"
    steps:
      - show: |
          <p><b>Quy mô:</b> hàng nghìn thử nghiệm; năm kết quả khó hiểu, mỗi cái mất <b>nhiều tuần tới nhiều tháng</b> mới tìm ra nguyên nhân.</p>
          <p><b>Điểm nghẽn 1 — chọn sai chỉ số:</b> một thử nghiệm có lỗi cho kết quả tìm kiếm rất tệ, vậy mà số truy vấn mỗi người <b>tăng hơn 10%</b>, doanh thu mỗi người <b>tăng hơn 30%</b>: người dùng phải tìm lại, bấm quảng cáo nhiều hơn.</p>
          <table class="t"><tr><th>số truy vấn = người dùng nhân phiên mỗi người nhân truy vấn mỗi phiên (số minh hoạ)</th><th>kết quả</th></tr>
          <tr><td>bình thường: $1000 \cdot 2 \cdot 3$</td><td>6000</td></tr>
          <tr><td>kết quả tệ, mỗi phiên tìm lại nhiều hơn: $1000 \cdot 2 \cdot 3{,}3$</td><td>6600, tăng $\hl{10\%}$ mà số phiên vẫn 2</td></tr></table>
          <p class="note">Cách xử lý: lấy <b>số phiên mỗi người</b> làm phần chính của tiêu chí tổng thể — người hài lòng thì quay lại.</p>
        focus: [1, 2, 2, "3.2", "3.3", 4]
        say: "Ở chặng hai, năm 2012, nhóm đã chạy hàng nghìn thử nghiệm, và có năm kết quả khó hiểu, mỗi cái mất nhiều tuần tới nhiều tháng để tìm nguyên nhân. Điểm nghẽn thứ nhất là chọn sai chỉ số, khi một lỗi cho kết quả rất tệ mà số truy vấn mỗi người lại tăng hơn 10 phần trăm. Doanh thu còn tăng hơn 30 phần trăm, vì người dùng phải tìm lại và bấm quảng cáo nhiều hơn. Với số minh hoạ 1000 người, 2 phiên, 3 truy vấn mỗi phiên, ta có 6000 truy vấn. Tìm lại thành 3 phẩy 3 mỗi phiên thì lên 6600, tăng 10 phần trăm, mà số phiên vẫn là 2. Vì thế nhóm lấy số phiên mỗi người làm phần chính của tiêu chí tổng thể."
      - clear: true
        show: |
          <p><b>Điểm nghẽn 2 — xu hướng giả mấy ngày đầu:</b> hiệu ứng cộng dồn đi lên mỗi ngày, chủ tính năng tưởng người dùng “đang quen dần”. Hình đó thật ra là của một <b>thử nghiệm hai nhóm giống hệt</b>.</p>
          <table class="t"><tr><th>bước (giả sử số người tỉ lệ với số ngày, thử 21 ngày)</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. khoảng 95% ngày 21 hẹp hơn ngày 1</td><td>$\sqrt{21}$</td><td>≈ 4,58 lần</td></tr>
          <tr><td>Bước 2. ngưỡng cuối, tính theo độ lệch của ngày 1</td><td>$1{,}96 / 4{,}58$</td><td>≈ 0,43 lần độ lệch</td></tr>
          <tr><td>Bước 3. ngày 1 rơi ra ngoài ngưỡng cuối dù hiệu ứng bằng 0</td><td>xác suất vượt 0,43 độ lệch chuẩn, hai phía</td><td>≈ $\hl{67\%}$; ngày 2: ≈ $\hlb{55\%}$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Điểm nghẽn thứ hai là xu hướng giả, khi hiệu ứng cộng dồn đi lên mấy ngày đầu và chủ tính năng tưởng người dùng đang quen dần. Hình đó thật ra lấy từ một thử nghiệm hai nhóm giống hệt. Bước một, nếu số người tỉ lệ với số ngày, khoảng 95 phần trăm của ngày 21 hẹp hơn ngày đầu căn 21, khoảng 4 phẩy 58 lần. Bước hai, ngưỡng cuối chỉ bằng 0 phẩy 43 lần độ lệch của ngày đầu. Bước ba, nên dù hiệu ứng bằng 0, ngày đầu có khoảng 67 phần trăm khả năng rơi ra ngoài ngưỡng cuối, ngày hai khoảng 55 phần trăm."
      - clear: true
        show: |
          <p><b>Điểm nghẽn 3 — đo sai:</b> có trình duyệt huỷ yêu cầu ghi nhận cú bấm khi người dùng rời trang, mất có lúc <b>hơn 50%</b>; thêm chút độ trễ thì thử nghiệm <b>trông tốt hơn một cách giả tạo</b>.</p>
          <div class="box key">Thực hành: chạy <b>liên tục</b> thử nghiệm hai nhóm giống hệt — nó phải báo “có khác biệt” khoảng 5% số lần; không ngoại suy mấy ngày đầu; chạy ít nhất <b>một tuần</b>. Điều kiện: kiểm cả cách đo, không chỉ cách phân tích.</div>
        focus: [1, 1, 2, 2]
        say: "Điểm nghẽn thứ ba là đo sai, khi có trình duyệt huỷ việc ghi nhận cú bấm lúc người dùng rời trang, mất có lúc hơn 50 phần trăm. Thêm chút độ trễ là nhiều cú bấm được ghi hơn, nên thử nghiệm trông tốt lên một cách giả tạo. Thực hành rút ra là chạy liên tục thử nghiệm hai nhóm giống hệt, và nó phải báo có khác biệt khoảng 5 phần trăm số lần. Đừng ngoại suy mấy ngày đầu, chạy ít nhất một tuần, và kiểm cả cách đo."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2013 — quy mô rất lớn: hơn 200 thử nghiệm cùng lúc"
    stage: {year: "2013", scale: "khoảng 100 triệu người dùng mỗi tháng ở Mỹ, hơn 3,2 tỉ truy vấn mỗi tháng; hơn 200 thử nghiệm cùng lúc; 90% người dùng ở hơn 15 thử nghiệm, 10% nhóm giữ lại", source: "[KO13]", practice: "nhiều đường chia trực giao; cảnh báo tự động thay cho kiểm thử trước hết mọi tổ hợp; nhóm giữ lại 10% để đo chi phí của chính hệ thử nghiệm"}
    checks:
      - "5 ** 15 == 30517578125 and 4 ** 4 == 256"
      - "(5 / 0.5) ** 2 == 100"
    steps:
      - show: |
          <p><b>Quy mô:</b> riêng ở Mỹ, khoảng <b>100 triệu</b> người dùng mỗi tháng, hơn <b>3,2 tỉ</b> truy vấn mỗi tháng, chia cho <b>hơn 200</b> thử nghiệm cùng lúc. 90% người dùng đủ điều kiện ở hơn 15 thử nghiệm; <b>10%</b> là nhóm giữ lại.</p>
          <p><b>Điểm nghẽn:</b> trang có vô số phiên bản, không thể kiểm thử trước từng tổ hợp.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. 15 vùng, mỗi vùng khoảng 5 thử nghiệm</td><td>$5^{15}$</td><td>$\hl{30\,517\,578\,125}$ ≈ 30 tỉ phiên bản</td></tr>
          <tr><td>Bước 2. bộ xếp hạng 4 tầng, mỗi tầng 3 nhóm thử + 1 đối chứng</td><td>$4^4$</td><td>bộ nhớ đệm bị chia $\hlb{256}$ phần</td></tr></table>
        focus: [1, 1, 2, "3.2", "3.3"]
        say: "Ở chặng ba, năm 2013, riêng ở Mỹ công cụ tìm kiếm ấy có khoảng 100 triệu người dùng mỗi tháng, hơn 3 phẩy 2 tỉ truy vấn, chia cho hơn 200 thử nghiệm cùng lúc. Mười phần trăm người dùng là nhóm giữ lại. Điểm nghẽn là trang có vô số phiên bản, không ai kiểm thử trước được từng tổ hợp. Bước một, 15 vùng, mỗi vùng khoảng 5 thử nghiệm, cho 5 mũ 15, khoảng 30 tỉ phiên bản. Bước hai, bộ xếp hạng 4 tầng, mỗi tầng 4 nhóm, chia bộ nhớ đệm thành 4 mũ 4, bằng 256 phần."
      - clear: true
        show: |
          <table class="t"><tr><th>cách xử lý (2013)</th><th>vì sao</th></tr>
          <tr><td><b>đường chia trực giao</b>: trên một đường, mỗi người chỉ ở một nhóm; nhiều đường chạy song song</td><td>một người vào được nhiều thử nghiệm mà vẫn chia ngẫu nhiên</td></tr>
          <tr><td><b>cảnh báo tự động</b> thay cho kiểm thử trước mọi tổ hợp</td><td>30 tỉ phiên bản không kiểm hết được</td></tr>
          <tr><td><b>nhóm giữ lại 10%</b>: đo chính hệ thử nghiệm như một thử nghiệm</td><td>nhóm thử nghiệm chậm hơn đều đặn 25 tới 30 mili giây, riêng bộ nhớ đệm bị chia khoảng 20</td></tr></table>
          <p class="note">Bước 3. muốn thấy chênh lệch 0,5% thay vì 5%, nhỏ đi 10 lần: cần $10^2 = \hlg{100}$ lần số người. Điều kiện: đội nhỏ, vài nghìn người dùng, thì tìm hiệu ứng lớn — vẫn thử nghiệm được.</p>
        focus: ["1.2", "1.3", "1.4", 2, 2]
        say: "Cách xử lý thứ nhất là các đường chia trực giao chạy song song. Thứ hai, thay vì kiểm thử trước mọi tổ hợp, hệ dùng cảnh báo tự động. Thứ ba, nhóm giữ lại đo chính hệ thử nghiệm, và cho thấy nhóm thử nghiệm chậm hơn đều đặn 25 tới 30 phần nghìn giây. Bước ba, muốn thấy chênh lệch 0 phẩy 5 thay vì 5 phần trăm thì cần 10 bình phương, bằng 100 lần số người. Vậy quy mô lớn để thấy hiệu ứng nhỏ, còn đội nhỏ thì tìm hiệu ứng lớn, vẫn thử nghiệm được."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2013 — giữ độ tin cậy: báo nhầm, tương tác, độ nhạy"
    stage: {year: "2013", scale: "hơn 200 thử nghiệm cùng lúc; dò tương tác từng cặp đôi khi cần hàng trăm nghìn phép kiểm; 1% doanh thu là hơn 10 triệu đô la mỗi năm ở Mỹ", source: "[KO13] [DE13]", practice: "hạ ngưỡng khi thử nhiều phiên bản hay nhiều vòng; chạy lại để xác nhận; một bảng kết quả cuối sau một số tròn tuần; ngăn trước và dò sau tương tác; giảm phương sai bằng dữ liệu trước thử nghiệm"}
    checks:
      - "round(1 - 0.975 ** 5, 3) == 0.119 and round(1 - 0.975 ** 30, 3) == 0.532"
      - "200 * 199 // 2 == 19900 and 19900 * 10 == 199000"
      - "0.6 * 10 == 6.0 and round(1 - 0.7 ** 2, 2) == 0.51"
    steps:
      - show: |
          <p><b>Điểm nghẽn 1 — báo nhầm:</b> một tính năng không có tác dụng vẫn có <b>2,5%</b> khả năng trông tốt lên, kiểm hai phía.</p>
          <table class="t"><tr><th>bước</th><th>phép tính (theo bài 11)</th><th>kết quả</th></tr>
          <tr><td>Bước 1. thử 5 phiên bản</td><td>$1 - 0{,}975^{5}$</td><td>≈ $\hl{0{,}119}$, khoảng 12%</td></tr>
          <tr><td>Bước 2. 6 vòng, mỗi vòng 5 phiên bản</td><td>$1 - 0{,}975^{30}$</td><td>≈ $\hlb{0{,}532}$, hơn 50%</td></tr></table>
          <p class="note">Cách xử lý: hạ ngưỡng giá trị p khi có nhiều phiên bản, nhiều vòng; <b>chạy lại một lần cuối</b> với độ mạnh cao hơn; bảng kết quả cuối sau một số tròn tuần, thường 2 tuần.</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Ở chặng bốn, cũng năm 2013, điểm nghẽn là báo nhầm, vì tính năng không có tác dụng vẫn có 2 phẩy 5 phần trăm khả năng trông tốt lên. Bước một, theo cách tính của bài 11, thử 5 phiên bản thì khả năng ấy là 1 trừ 0 phẩy 975 mũ 5, khoảng 12 phần trăm. Bước hai, 6 vòng, mỗi vòng 5 phiên bản, ra 1 trừ 0 phẩy 975 mũ 30, hơn 50 phần trăm. Cách xử lý là hạ ngưỡng giá trị p, và chạy lại một lần cuối với độ mạnh cao hơn. Bảng kết quả cuối lấy sau một số tròn tuần, thường là 2 tuần."
      - clear: true
        show: |
          <p><b>Điểm nghẽn 2 — tương tác:</b> hai thử nghiệm gộp lại cho hiệu ứng khác tổng hai hiệu ứng riêng. Tương tác hiếm, và thường là <b>lỗi</b> hơn là thật.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 3. số cặp thử nghiệm khi có 200</td><td>$200 \cdot 199 / 2$</td><td>$\hl{19\,900}$ cặp</td></tr>
          <tr><td>Bước 4. mỗi cặp kiểm 10 chỉ số (số minh hoạ)</td><td>$19\,900 \cdot 10$</td><td>$\hlb{199\,000}$ phép kiểm: “hàng trăm nghìn”</td></tr></table>
          <p class="note">Cách xử lý: <b>ngăn trước</b> bằng ràng buộc (hai thử nghiệm giao diện quảng cáo không bao giờ cùng một người), rồi <b>dò sau</b> mọi cặp, có lọc báo nhầm.</p>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Điểm nghẽn tiếp theo là tương tác, khi hai thử nghiệm gộp lại cho hiệu ứng khác tổng hai hiệu ứng riêng. Theo nhóm này, tương tác hiếm, và thường là lỗi hơn là thật. Bước ba, 200 thử nghiệm cho 200 nhân 199 chia 2, bằng 19 nghìn 900 cặp. Bước bốn, mỗi cặp kiểm 10 chỉ số, một số minh hoạ, là 199 nghìn phép kiểm, đúng cỡ hàng trăm nghìn. Vì thế nhóm ngăn trước bằng ràng buộc, rồi dò sau mọi cặp."
      - clear: true
        show: |
          <table class="t"><tr><th>cảnh báo và độ nhạy (2013)</th><th>con số</th></tr>
          <tr><td>chỉ cảnh báo khi thay đổi <b>đủ lớn</b>: chậm 2 mili giây thì không, dù chắc chắn là thật</td><td>thử 7 ngày: ngưỡng ngày đầu $5 \cdot 10^{-8}$, ngày cuối 0,040</td></tr>
          <tr><td>thử làm chậm trong 2 tuần: mỗi 100 mili giây nhanh hơn tăng <b>0,6%</b> doanh thu</td><td>1% là hơn 10 triệu đô la mỗi năm → 0,6% là hơn $\hl{6}$ triệu đô la</td></tr>
          <tr><td>giảm phương sai bằng dữ liệu <b>trước thử nghiệm</b> (WSDM 2013): khoảng 50%, tức một nửa số người</td><td>phần còn lại $1 - \rho^2$; tương quan 0,7 (số minh hoạ): $\hlg{0{,}51}$</td></tr></table>
        introduces: [rho]
        focus: ["1.2", "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Hệ chỉ cảnh báo khi thay đổi đủ lớn, chậm 2 phần nghìn giây thì không báo, dù chắc chắn là thật. Với thử nghiệm 7 ngày, ngưỡng giá trị p ngày đầu là 5 nhân 10 mũ âm 8, ngày cuối là 0 phẩy 040. Nhóm cố ý làm chậm trang, và thấy mỗi 100 phần nghìn giây nhanh hơn tăng 0 phẩy 6 phần trăm doanh thu. Vì 1 phần trăm là hơn 10 triệu đô la mỗi năm, con số đó là hơn 6 triệu đô la. Dùng dữ liệu trước thử nghiệm giảm được khoảng 50 phần trăm phương sai, tức một nửa số người. Phần còn lại là 1 trừ bình phương tương quan rô, nên tương quan 0 phẩy 7 còn 0 phẩy 51."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2019 — ổn định và tiếp tục phát triển: kiểm tỉ lệ chia nhóm"
    stage: {year: "2019", scale: "hội nghị 12/2018: 13 tổ chức, 34 chuyên gia, hơn 100 000 nhóm thử trong một năm; khoảng 6% thử nghiệm ở Microsoft bị lệch tỉ lệ chia nhóm", source: "[GU19] [FA19]", practice: "kiểm chất lượng dữ liệu trước (tỉ lệ chia nhóm), rồi mới đọc tiêu chí tổng thể và chỉ số bảo vệ; tìm nguyên nhân gốc trước khi tin kết quả; đồng nghiệp xem lại thử nghiệm của nhau"}
    checks:
      - "round(10000 * 0.06) == 600 and round(600 / 365, 2) == 1.64"
      - "round(499 / 999, 4) == 0.4995 and (0.25 / 10 ** 6) ** 0.5 == 0.0005"
      - "round((0.5 - 499 / 999) / (0.25 / 10 ** 6) ** 0.5, 1) == 1.0 and round((0.5 - 499 / 999) / (0.25 / 10 ** 7) ** 0.5, 2) == 3.17"
    steps:
      - show: |
          <p><b>Quy mô:</b> ngày 13–14/12/2018, <b>13 tổ chức</b> (Airbnb, Amazon, Booking.com, Facebook, Google, LinkedIn, Microsoft, Netflix…) gửi <b>34 chuyên gia</b> tới hội nghị đầu tiên về thử nghiệm trực tuyến; năm trước đó họ thử <b>hơn 100&nbsp;000</b> nhóm thử. Bài tổng kết in tháng 6/2019.</p>
          <p><b>Điểm nghẽn:</b> nhóm nền tảng không thể tự xem từng thử nghiệm. Lệch tỉ lệ chia nhóm là phép thử chuẩn của cả ngành — như cơn sốt, nó là triệu chứng của nhiều bệnh dữ liệu.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. khoảng 6% thử nghiệm ở Microsoft bị lệch; 10&nbsp;000 thử nghiệm mỗi năm</td><td>$10\,000 \cdot 0{,}06 = 600$; $600 / 365$</td><td>≈ $\hl{1{,}64}$ ca mỗi ngày</td></tr></table>
        focus: [1, 1, 2, "3.2"]
        say: "Ở chặng năm, tháng 12 năm 2018, 13 tổ chức gửi 34 chuyên gia tới hội nghị đầu tiên về thử nghiệm trực tuyến. Năm trước đó họ đã thử hơn 100 nghìn nhóm thử, và bài tổng kết in tháng 6 năm 2019. Lệch tỉ lệ chia nhóm thành phép thử chuẩn, giống cơn sốt, là triệu chứng của nhiều bệnh dữ liệu khác nhau. Bước một, khoảng 6 phần trăm thử nghiệm ở Microsoft bị lệch, nên 10 nghìn thử nghiệm mỗi năm cho 600 ca, khoảng 1 phẩy 64 ca mỗi ngày."
      - clear: true
        show: |
          <p>Ca thật: dịch vụ chia nhóm băm người dùng vào <b>1000 ô</b>, mỗi ô 0,1%. Một lỗi cấp cho nhóm đối chứng <b>thiếu một ô</b>, nên chia đôi thành 49,9 và 50 — khó thấy bằng mắt.</p>
          <table class="t"><tr><th>bước (số người là số minh hoạ)</th><th>phép tính theo bài 10</th><th>kết quả</th></tr>
          <tr><td>Bước 2. tỉ lệ thật của nhóm đối chứng</td><td>$499/999$</td><td>≈ 0,4995 thay vì 0,5</td></tr>
          <tr><td>Bước 3. 1 triệu người: sai số chuẩn</td><td>$\sqrt{0{,}25/1\,000\,000} = 0{,}0005$; $0{,}0005 / 0{,}0005$</td><td>$\hlb{1{,}0}$ lần — dưới 1,96, không thấy</td></tr>
          <tr><td>Bước 4. 10 triệu người</td><td>sai số chuẩn nhỏ đi $\sqrt{10} \approx 3{,}16$ lần</td><td>≈ $\hl{3{,}17}$ lần — vượt 1,96, thấy được</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Một ca thật, dịch vụ chia nhóm băm người dùng vào 1000 ô, và một lỗi cấp cho nhóm đối chứng thiếu một ô. Chia đôi thành 49 phẩy 9 và 50, rất khó thấy bằng mắt. Bước hai, tỉ lệ thật của nhóm đối chứng là 499 chia 999, khoảng 0 phẩy 4995. Bước ba, với 1 triệu người, một số minh hoạ, sai số chuẩn theo bài 10 là 0 phẩy 0005, nên độ lệch chỉ bằng 1 lần sai số chuẩn. Bước bốn, với 10 triệu người, độ lệch thành khoảng 3 phẩy 17 lần, vượt 1 phẩy 96, nên phép kiểm bắt được."
      - clear: true
        show: |
          <p>Một ca khác: trang tin của Microsoft tăng số thẻ xoay từ 12 lên 16; kết quả đầu là người dùng bấm <b>ít hơn</b>. Nhưng nhóm thử thiếu người: người bấm nhiều nhất bị bộ lọc coi là <b>máy tự động</b> và loại ra. Sửa xong, thay đổi hoá ra <b>tốt</b>.</p>
          <table class="t"><tr><th>thứ tự đọc kết quả (2019)</th><th>câu hỏi</th></tr>
          <tr><td>1. chỉ số chất lượng dữ liệu, như tỉ lệ chia nhóm</td><td>kết quả có đáng tin không?</td></tr>
          <tr><td>2. tiêu chí tổng thể</td><td>thay đổi có thành công không?</td></tr>
          <tr><td>3. chỉ số bảo vệ</td><td>có làm hỏng thứ không được phép hỏng không?</td></tr></table>
          <p class="note">Ổn định không có nghĩa là hết việc: hội nghị còn ghi các bài toán mở như đo hiệu ứng lâu dài; ở một công ty, khoảng 80 người tự nguyện xem lại thử nghiệm của nhau mỗi tuần.</p>
        focus: [1, 1, "2.2", "2.3", "2.4", 3]
        say: "Một ca khác, trang tin của Microsoft tăng số thẻ xoay từ 12 lên 16, và kết quả đầu là người dùng bấm ít hơn. Nhưng người bấm nhiều nhất bị bộ lọc coi là máy tự động và loại ra, nên sửa xong thì thay đổi hoá ra tốt. Từ đó, trước hết hãy xem chất lượng dữ liệu, như tỉ lệ chia nhóm. Sau đó mới xem tiêu chí tổng thể để biết thay đổi có thành công không. Cuối cùng là chỉ số bảo vệ, những thứ không được phép hỏng. Ổn định không có nghĩa là hết việc, vì hội nghị còn ghi nhiều bài toán mở."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "16 * 4 * 900 == 57600 and round(57600 / 0.1875 ** 2) == 1638400"
      - "round(64 * 0.0475 / 0.01 ** 2) == 30400"
