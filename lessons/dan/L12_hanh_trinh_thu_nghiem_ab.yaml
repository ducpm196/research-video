        say: "Đáp án câu hai là một đánh đổi. Thử 5 màu rồi phát hành màu thắng thì học nhanh, nhưng một màu không có tác dụng vẫn có khoảng 11 phẩy 9 phần trăm khả năng thắng. Thử 5 màu rồi chạy lại màu thắng với nhóm lớn thì loại được phần lớn kết quả may mắn, nhưng mất thêm vài tuần. Nên chọn cách thứ hai, trừ khi thay đổi gần như không tốn gì, dễ gỡ, và lượng người rất lớn."

