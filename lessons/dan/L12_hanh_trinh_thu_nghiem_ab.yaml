        focus: ["1.2", "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ nhất là nghĩ người có kinh nghiệm đoán được ý nào tốt, nên chỉ cần thử ý lớn. Thực tế chỉ khoảng một phần ba ý làm được điều nó nhắm tới, kể cả ở chính nhóm làm thử nghiệm. Hãy thử cả ý mình tin chắc, và tin số đo hơn chức vụ. Bài học sai thứ hai là nghĩ mấy ngày đầu đã thấy xu hướng, chạy thêm là thành tốt. Hình xu hướng ấy lấy từ thử nghiệm hai nhóm giống hệt, và nhóm không thấy ca nào kết quả có ý nghĩa lại đổi chiều. Hãy định trước số tuần, và chỉ đọc bảng kết quả cuối."
