  kind: intuition
  title: 'Bảng tam giác: hàng, cột và đường chéo'
  checks:
  - 'alg.cohort_retention({''T1'': [100, 30, 18], ''T2'': [120, 45]}) == {''T1'': [30.0, 18.0], ''T2'': [37.5]} and 18 + 45 + 150 == 213'
  steps:
  - show: |
      <div><svg width="1500" height="370" viewBox="0 0 1500 370"><g fill="#1f2937" font-size="22"><text x="445" y="75" text-anchor="middle" font-weight="bold">tuổi 0</text><text x="675" y="75" text-anchor="middle" font-weight="bold">tuổi 1</text><text x="905" y="75" text-anchor="middle" font-weight="bold">tuổi 2</text><text x="310" y="139" text-anchor="end">nhóm tháng 1</text><rect x="330" y="95" width="230" height="70" fill="#2a78d6" fill-opacity="1.00" stroke="#ffffff" stroke-width="3"/><text x="445" y="139" text-anchor="middle" fill="#ffffff">100 (100%)</text><rect x="560" y="95" width="230" height="70" fill="#2a78d6" fill-opacity="0.41" stroke="#ffffff" stroke-width="3"/><text x="675" y="139" text-anchor="middle" fill="#1f2937">30 (30%)</text><rect x="790" y="95" width="230" height="70" fill="#2a78d6" fill-opacity="0.30" stroke="#ffffff" stroke-width="3"/><text x="905" y="139" text-anchor="middle" fill="#1f2937">18 (18%)</text><text x="310" y="209" text-anchor="end">nhóm tháng 2</text><rect x="330" y="165" width="230" height="70" fill="#2a78d6" fill-opacity="1.00" stroke="#ffffff" stroke-width="3"/><text x="445" y="209" text-anchor="middle" fill="#ffffff">120 (100%)</text><rect x="560" y="165" width="230" height="70" fill="#2a78d6" fill-opacity="0.47" stroke="#ffffff" stroke-width="3"/><text x="675" y="209" text-anchor="middle" fill="#1f2937">45 (37,5%)</text><text x="310" y="279" text-anchor="end">nhóm tháng 3</text><rect x="330" y="235" width="230" height="70" fill="#2a78d6" fill-opacity="1.00" stroke="#ffffff" stroke-width="3"/><text x="445" y="279" text-anchor="middle" fill="#ffffff">150 (100%)</text><rect x="793" y="98" width="224" height="64" fill="none" stroke="#eb6834" stroke-width="5"/><rect x="563" y="168" width="224" height="64" fill="none" stroke="#eb6834" stroke-width="5"/><rect x="333" y="238" width="224" height="64" fill="none" stroke="#eb6834" stroke-width="5"/><text x="1050" y="135" fill="#eb6834" font-weight="bold">đường chéo = tháng lịch 3</text><text x="1050" y="175" fill="#eb6834">18 + 45 + 150 = 213</text><text x="1050" y="215" fill="#059669">hàng = một nhóm theo thời gian</text><text x="1050" y="255" fill="#2a78d6">cột = các nhóm cùng tuổi</text><text x="330" y="335" font-size="20">ô trống: nhóm chưa đủ tuổi; màu đậm hơn biểu thị tỉ lệ còn lại cao hơn</text></g></svg></div>
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình là bảng nhóm theo kỳ vẽ thành ô màu, ô màu đậm hơn biểu thị tỉ lệ còn lại cao hơn. Mỗi hàng là một nhóm đăng ký, đi sang phải là nhóm đó già thêm một tháng, nên bảng có dạng tam giác, vì nhóm mới chưa đủ tuổi. Các ô viền cam nằm trên một đường chéo, đều thuộc tháng lịch 3, cộng lại 18, 45 và 150 được 213, đúng con số người dùng hoạt động của tháng 3. Vậy con số tổng chỉ là một đường chéo, trong đó 150 là người vừa đăng ký.
- id: example
  kind: example
  title: Ba nhóm tháng đăng ký
  checks:
  - 'alg.cohort_retention({''T1'': [100, 30, 18], ''T2'': [120, 45]}) == {''T1'': [30.0, 18.0], ''T2'': [37.5]}'
  steps:
  - show: |
      <table class="t"><tr><th>nhóm</th><th>cỡ nhóm</th><th>sau 1 tháng</th><th>sau 2 tháng</th></tr>
      <tr><td>tháng 1</td><td>100</td><td>$\frac{30}{100} = 30\%$</td><td>$\frac{18}{100} = 18\%$</td></tr></table>
      <p><b>Bước 1</b> — nhóm tháng 1: mẫu số luôn là cỡ nhóm 100.</p>
    focus:
    - 1
    - '1.2'
    - 2
    say: Bước một, nhóm tháng 1 có 100 người. Sau 1 tháng còn 30, tức 30 phần trăm, sau 2 tháng còn 18, tức 18 phần trăm. Mẫu số luôn là cỡ nhóm ban đầu 100, không phải số người còn lại tháng trước.
  - show: |
      <table class="t"><tr><th>nhóm</th><th>cỡ nhóm</th><th>sau 1 tháng</th><th>sau 2 tháng</th></tr>
      <tr><td>tháng 2</td><td>120</td><td>$\frac{45}{120} = \hl{37{,}5\%}$</td><td>chưa đủ thời gian</td></tr>
      <tr><td>tháng 3</td><td>150</td><td>chưa đủ thời gian</td><td>—</td></tr></table>
      <p><b>Bước 2</b> — nhóm tháng 2 và tháng 3: chỉ điền ô đã đủ tuổi.</p>
    focus:
    - '1.2'
    - '1.3'
    - 2
    say: Bước hai, nhóm tháng 2 có 120 người, sau 1 tháng còn 45, tức 37 phẩy 5 phần trăm. Nhóm tháng 3 có 150 người và chưa đủ thời gian để đo. Ta chỉ điền ô đã đủ tuổi, các ô còn lại để trống.
  - clear: true
    show: |
      <table class="t"><tr><th>nhóm</th><th>cỡ nhóm</th><th>sau 1 tháng</th><th>sau 2 tháng</th></tr>
      <tr><td>tháng 1</td><td>100</td><td>30 (30%)</td><td>18 (18%)</td></tr>
      <tr><td>tháng 2</td><td>120</td><td>45 ($\hl{37{,}5\%}$)</td><td>chưa đủ thời gian</td></tr>
      <tr><td>tháng 3</td><td>150</td><td>chưa đủ thời gian</td><td>—</td></tr></table>
      <p><b>Bước 3</b> — đọc cột “sau 1 tháng”: 30% → 37,5% — giữ chân <b>cải thiện</b>.</p>
    focus:
    - 1
    - 2
    say: Bước ba, ghép ba nhóm thành một bảng rồi đọc theo cột. Cột sau 1 tháng đi từ 30 lên 37 phẩy 5 phần trăm, nên giữ chân đã cải thiện.
  - show: |
      <p><b>Bước 4</b> — đọc đường chéo tháng lịch 3: $18 + 45 + 150 = 213$ người hoạt động, nhưng 150 trong số đó là người mới.</p>
    say: Bước bốn, đọc đường chéo của tháng lịch 3. Tháng 3 có 18 cộng 45 cộng 150, bằng 213 người hoạt động, nhưng 150 trong số đó là người mới.
- id: check
  kind: check
  title: 'Tự kiểm: dựng lại các con số của biểu đồ tổng'
  checks:
  - 'alg.cohort_retention({''T1'': [100]}) == {''T1'': []} and 30 + 120 == 150 and 18 + 45 + 150 == 213'
  - 0.375 * 120 == 45 and round(0.3 * 100) == 30 and round(0.18 * 100) == 18
  steps:
  - show: |
      <table class="t"><tr><th>tháng lịch</th><th>cộng một đường chéo</th><th>so với biểu đồ tổng</th></tr>
      <tr><td>1</td><td>100 (nhóm tháng 1, tuổi 0)</td><td>100 ✓</td></tr>
      <tr><td>2</td><td>$30 + 120 = 150$</td><td>150 ✓</td></tr>
      <tr><td>3</td><td>$18 + 45 + 150 = 213$</td><td>213 ✓</td></tr></table>
      <p>Ngược lại: $37{,}5\% \cdot 120 = 45$ người — tỉ lệ nhân cỡ nhóm trả lại đúng số người ✓.</p>
      <p class="note"><b>Hai mức quy mô:</b> Với 3 nhóm nhỏ (9 ô) kiểm tra khớp đường chéo ngay bằng tay; với 36 tháng và 10 triệu người dùng, dựng bảng nhóm trên kho dữ liệu cột chỉ mất khoảng 1 giây nhưng ngăn tăng trưởng người mới che lấp giữ chân suy giảm.</p>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 3
    - 3
    say: Kiểm bằng đường khác, ta cộng từng đường chéo của bảng và so với biểu đồ tổng ở đầu bài. Tháng lịch 1 chỉ có nhóm tháng 1 ở tuổi 0, là 100 người. Tháng lịch 2 có 30 cộng 120 bằng 150. Tháng lịch 3 có 18 cộng 45 cộng 150 bằng 213, khớp cả ba. Đi ngược lại, 37 phẩy 5 phần trăm nhân cỡ nhóm 120 trả lại đúng 45 người, nên tỉ lệ đã dùng đúng mẫu số. Ở hai mức quy mô, bảng 3 nhóm nhỏ kiểm tra khớp ngay bằng tay. Ở quy mô 36 tháng với 10 triệu người dùng, dựng bảng nhóm mất khoảng 1 giây nhưng ngăn người mới che lấp giữ chân đang giảm.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp, cả người mới lẫn người đã đi làm
  checks:
  - 1 - 30 / 100 > 0.6 and 1 - 45 / 120 > 0.6
  - 18 / 30 == 0.6 and 18 / 100 == 0.18 and round(30 / 100 * (18 / 30), 9) == 0.18
  steps:
  - show: |
      <div class="box warn"><b>Lỗi 1.</b> Gộp mọi người dùng vào một con số <b class="red">(tăng trưởng che lấp rò rỉ)</b>
      <br><span class="note">Tổng hoạt động tăng 100 → 213 trong khi mỗi nhóm mất hơn 60% sau một tháng. Luôn xem theo nhóm.</span></div>
    say: Lỗi thứ nhất, gộp mọi người dùng vào một con số, nên tăng trưởng che lấp rò rỉ. Tổng hoạt động tăng từ 100 lên 213, trong khi mỗi nhóm mất hơn 60 phần trăm sau một tháng. Hãy luôn xem theo nhóm.
  - show: |
      <div class="box warn"><b>Lỗi 2.</b> Tính tỉ lệ cho nhóm chưa đủ thời gian <b class="red">(nhóm mới trông tệ)</b>
      <br><span class="note">Nhóm đăng ký giữa tháng 3, đo “sau 1 tháng” vào cuối tháng 3: mới được nửa tháng. Chỉ điền ô khi nhóm đã đủ tuổi.</span></div>
    say: Lỗi thứ hai, tính tỉ lệ cho nhóm chưa đủ thời gian, nên nhóm mới trông tệ. Nhóm đăng ký giữa tháng 3 mà đo sau 1 tháng vào cuối tháng 3 thì mới được nửa tháng. Chỉ điền ô khi nhóm đã đủ tuổi.
  - clear: true
    show: |
      <div class="box warn"><b>Lỗi 3.</b> Lẫn “còn hoạt động trong tháng k” với “từng quay lại” <b class="red">(hai đường cong khác hẳn)</b>
      <br><span class="note">“Từng quay lại ít nhất một lần tới tháng k” chỉ tăng; “hoạt động đúng trong tháng k” có thể giảm. Ghi rõ định nghĩa (bài 0).</span></div>
    say: Lỗi thứ ba, lẫn còn hoạt động trong tháng k với từng quay lại, nên ra hai đường cong khác hẳn. Từng quay lại ít nhất một lần tới tháng k thì chỉ tăng, còn hoạt động đúng trong tháng k thì có thể giảm. Hãy ghi rõ định nghĩa, gồm sự kiện nào được tính và trong khoảng thời gian nào, như cách viết định nghĩa chỉ số ở bài 0.
  - clear: true
    show: |
      <div class="box warn"><b>Lỗi 4.</b> Lặng lẽ đổi mẫu số sang “số người còn lại tháng trước” <b class="red">(lỗi của người đã đi làm)</b></div>
      <table class="t"><tr><th>nhóm tháng 1, sau 2 tháng</th><th>mẫu số</th><th>tỉ lệ</th></tr>
      <tr><td>giữ chân theo cỡ nhóm</td><td>100 người ban đầu</td><td>$\frac{18}{100} = 18\%$</td></tr>
      <tr><td>giữ chân so với tháng trước</td><td>30 người còn ở tháng thứ nhất</td><td class="red">$\frac{18}{30} = 60\%$</td></tr></table>
      <p class="note">Cả hai đều có ích, nhưng là <b>hai chỉ số khác nhau</b>: $30\% \cdot 60\% = 18\%$. Báo “giữ chân 60%” mà không ghi mẫu số thì người nghe hiểu nhầm là 60 trên 100 người.</p>
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - 3
    - 3
    say: Lỗi thứ tư là lỗi của người đã đi làm, lặng lẽ đổi mẫu số sang số người còn lại tháng trước. Bảng lấy nhóm tháng 1 sau 2 tháng. Theo cỡ nhóm, 18 chia 100 bằng 18 phần trăm. So với tháng trước, 18 chia 30 người còn ở tháng thứ nhất bằng 60 phần trăm, nghe đẹp hơn hẳn. Cả hai đều có ích nhưng là hai chỉ số khác nhau, vì 30 phần trăm nhân 60 phần trăm mới bằng 18 phần trăm. Báo giữ chân 60 phần trăm mà không ghi mẫu số thì người nghe sẽ hiểu nhầm là 60 trên 100 người.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 'alg.cohort_retention({''T4'': [200, 60, 30]}) == {''T4'': [30.0, 15.0]}'
  steps:
  - show: |
      <table class="t"><tr><th>câu</th><th>đề</th></tr>
      <tr><td>1</td><td>Nhóm tháng 4 có 200 người, sau 1 tháng còn 60, sau 2 tháng còn 30. Tỉ lệ giữ chân hai tháng?</td></tr>
      <tr><td>2</td><td>So với nhóm tháng 1 (30%, 18%): nhóm tháng 4 tốt hơn hay kém hơn ở tháng thứ hai?</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, nhóm tháng 4 có 200 người, sau 1 tháng còn 60, sau 2 tháng còn 30. Tỉ lệ giữ chân hai tháng là bao nhiêu? Câu hai, so với nhóm tháng 1 có 30 và 18 phần trăm, nhóm tháng 4 tốt hơn hay kém hơn ở tháng thứ hai? Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: |
      <p>① Mẫu số luôn là cỡ nhóm 200. Sau 1 tháng: $\frac{60}{200} = 30\%$.</p>
      <p>Sau 2 tháng: $\frac{30}{200} = \hl{15\%}$.</p>
    focus:
    - 1
    - 2
    say: Đáp án câu một, mẫu số luôn là cỡ nhóm 200, nên sau 1 tháng là 60 chia 200, bằng 30 phần trăm. Sau 2 tháng là 30 chia 200, bằng 15 phần trăm.
  - show: |
      <table class="t"><tr><th>sau 2 tháng</th><th>nhóm tháng 1</th><th>nhóm tháng 4</th></tr>
      <tr><td>số người còn lại</td><td>18</td><td>30</td></tr>
      <tr><td>tỉ lệ giữ chân</td><td>18%</td><td>15% — <b>kém hơn</b></td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    say: Câu hai, so cùng tuổi 2 tháng. Số người còn lại tuyệt đối của nhóm tháng 4 nhiều hơn, 30 so với 18. Nhưng tỉ lệ thì kém hơn, 15 so với 18 phần trăm, nên nhóm tháng 4 giữ chân kém hơn.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/DAN/L04
  steps:
  - show: <table class='t'><tr><th>Thực hành DAN:L04</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/DAN/L04/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Phân tích giữ chân theo nhóm tháng đăng ký (cohort retention)</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>c1_m1=...% c1_m2=...%<br/>c2_m1=...% improved=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh DAN L04 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
    say: Bây giờ đến phần bạn tự thực hành và chấm thật trên máy. Hãy mở tệp đề bài, đọc kỹ dữ liệu vào cùng khuôn đầu ra cần in, tự viết chương trình rồi gõ lệnh dòng lệnh để tự chấm trước khi xem kết quả.
    focus:
    - '1.2'
    - '1.3'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp (2 dòng)</b></p><div class="code"><div>c1_m1=25.0% c1_m2=12.0%</div><div>c2_m1=35.0% improved=1</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>a, b = ...</code></td><td>Giải nén nhiều giá trị cùng lúc vào các tên biến tương ứng theo thứ tự</td></tr><tr><td><code>&lt; / &lt;= / &gt; / &gt;=</code></td><td>So sánh hai vế, kiểm tra rỗng bằng <code>is None</code> hoặc kẹp khoảng trả về Đúng/Sai</td></tr><tr><td><code>int(x)</code></td><td>Hàm/phương thức dựng sẵn thường dùng (sắp xếp, cực trị, ghép đôi, đánh chỉ số, làm tròn, lấy/thêm phần tử)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{:.1f}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 1) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 2) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <p><b>Lời giải tham khảo DAN:L04 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>r1_m1, r1_m2 = 50 / 200 * 100, 24 / 200 * 100</div><div>r2_m1 = 56 / 160 * 100</div><div>print(f"c1_m1={r1_m1:.1f}% c1_m2={r1_m2:.1f}%")</div><div>print(f"c2_m1={r2_m1:.1f}% improved={int(r2_m1 &gt; r1_m1)}")</div></div>
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">tách theo tháng đăng ký</span><span class="a">→</span>
      <span class="n">mẫu số: cỡ nhóm ban đầu</span><span class="a">→</span>
      <span class="n">hàng, cột, đường chéo: ba câu hỏi</span><span class="a">→</span>
      <span class="n">chỉ điền ô đã đủ tuổi; định nghĩa rõ “còn lại”</span></div>
    say: Tổng kết lại, hãy tách người dùng theo tháng đăng ký, dùng mẫu số là cỡ nhóm ban đầu, và đọc theo hàng, cột, đường chéo cho ba câu hỏi khác nhau. Chỉ điền ô đã đủ tuổi, và định nghĩa rõ thế nào là còn lại. Phân tích nhóm theo kỳ tách rõ khách mới đăng ký từng tháng khỏi tập khách cũ lâu năm để phơi bày xu hướng giữ chân thật sự qua từng chu kỳ tuổi. Đọc ngang theo hàng cho thấy tốc độ rơi rụng của một thế hệ khách hàng qua từng tháng, đọc dọc theo cột so sánh chất lượng giữa các tháng tuyển mới. Còn đường chéo chính là tổng người dùng hoạt động trong từng tháng lịch cụ thể, nơi làn sóng người mới có thể che giấu sự sụt giảm ở nhóm cũ. Hãy nhớ chỉ điền vào những ô nhóm đã đủ tuổi trải qua mốc thời gian tương ứng và dùng chung mẫu số cỡ nhóm ban đầu để mọi tỉ lệ luôn cộng dồn có nghĩa. Theo dõi tỉ lệ giữ chân theo nhóm đăng ký giúp phân biệt tăng trưởng thực chất với tăng trưởng chỉ nhờ đốt tiền mua lượt cài mới. Nếu lớp khách cũ rời bỏ nhanh nhưng công ty vẫn chạy quảng cáo mạnh, số tổng vẫn tăng cho tới ngày ngân sách cạn kiệt. Đặt hai đồ thị theo dõi cạnh nhau buộc mọi quyết định mở rộng thị trường phải dựa trên giá trị giữ chân thật. Khi đối chiếu các nhóm khách hàng qua nhiều tháng, đường cong giữ chân bình ổn dần cho thấy sản phẩm đã tìm được giá trị cốt lõi cho người dùng ở lại. Ngược lại nếu đường cong tiếp tục trượt dốc về không, tập trung chạy ưu đãi thu hút khách mới chỉ làm lỗ nặng hơn theo thời gian. Theo dõi từng thế hệ khách hàng biến một biểu đồ tĩnh thành công cụ dự báo dòng tiền thực thụ. Ngoài ra, tách riêng nhóm dùng thử miễn phí khỏi nhóm trả phí ngay từ đầu giúp đánh giá đúng sức khoẻ kinh doanh. Giữ nhịp đo hàng tuần giúp cả đội phát hiện biến động sớm ngay từ thế hệ người dùng đầu tiên.
  - show: |
      <div class="box key"><b>Tư duy:</b> một tổng đang tăng có thể giấu một <b>tỉ lệ</b> đang giảm — hãy hỏi tổng đó được <b>làm từ</b> những ai.</div>
      <p class="note"><b>Hai mức quy mô:</b> Bảng nhỏ 3 nhóm × 3 tháng chỉ có 9 ô kiểm tay được; trên hệ 36 tháng × 10 triệu người dùng, dựng bảng nhóm mất ~1 giây trên kho cột nhưng tách riêng từng nhóm giúp phát hiện ngay tụt giữ chân ẩn dưới tổng tăng trưởng.</p>
    say: Điều cần mang theo, một tổng đang tăng có thể giấu một tỉ lệ đang giảm, nên hãy hỏi tổng đó được làm từ những ai. Bảng nhỏ 3 nhóm nhân 3 tháng có 9 ô kiểm tay được. Trên hệ 36 tháng với 10 triệu người, tách theo nhóm mất 1 giây nhưng phát hiện ngay tụt giữ chân.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: |
      <p class="note">Bài sau (bài 5): <b>phễu chuyển đổi</b> — từng bước và toàn phễu.</p>
    forward_ref: true
    say: Ở bài sau, bài 5, ta học phễu chuyển đổi, theo từng bước và toàn phễu. Hẹn gặp bạn ở bài tiếp theo.
