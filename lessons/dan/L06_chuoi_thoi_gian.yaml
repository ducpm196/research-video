- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/DAN/L06
  steps:
  - show: <table class='t'><tr><th>Thực hành DAN:L06</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/DAN/L06/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Trung bình trượt 7 ngày khử mùa vụ cuối tuần (+35)</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>ma7_diffs=... constant_slope=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh DAN L06 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
    say: Bây giờ đến phần bạn tự thực hành và chấm thật trên máy. Hãy mở tệp đề bài, đọc kỹ dữ liệu vào cùng khuôn đầu ra cần in, tự viết chương trình rồi gõ lệnh dòng lệnh để tự chấm trước khi xem kết quả.
    focus:
    - '1.2'
    - '1.3'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp (1 dòng)</b></p><div class="code"><div>ma7_diffs=[3.0, 3.0, 3.0] constant_slope=1</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>[bt for x in ds]</code></td><td>Duyệt qua từng phần tử <code>x</code> trong <code>ds</code> để tạo danh sách mới</td></tr><tr><td><code>(a, b) / tuple(...)</code></td><td>Bộ giá trị cố định đóng gói theo thứ tự (không thay đổi sau khi tạo)</td></tr><tr><td><code>ds[a:b]</code></td><td>Truy cập ô hàng <code>i</code> cột <code>j</code>, phần tử cuối <code>[-1]</code>, hoặc cắt lát danh sách/chuỗi</td></tr><tr><td><code>in ; A if đk else B</code></td><td>Giá trị logic (<code>True/False/None</code>), phép logic (<code>and/or/not</code>), kiểm tra thuộc tập/rỗng hoặc rẽ nhánh gọn</td></tr><tr><td><code>== / !=</code></td><td>So sánh hai vế, kiểm tra rỗng bằng <code>is None</code> hoặc kẹp khoảng trả về Đúng/Sai</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 1) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>%</code></td><td><code>**</code> là lũy thừa; <code>//</code> là chia lấy nguyên; <code>%</code> là chia lấy phần dư</td></tr><tr><td><code>range(...), all(...), round(x, n), int(x), len(ds), sum(...)</code></td><td>Hàm/phương thức dựng sẵn thường dùng (sắp xếp, cực trị, ghép đôi, đánh chỉ số, làm tròn, lấy/thêm phần tử)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{ten_bien}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 2) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <p><b>Lời giải tham khảo DAN:L06 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>y = [20 + 3*d + (35 if d % 7 in (5, 6) else 0) for d in range(14)]</div><div>ma7 = [sum(y[i-6:i+1]) / 7.0 for i in range(6, 14)]</div><div>diffs = [round(ma7[i+1] - ma7[i], 2) for i in range(len(ma7)-1)]</div><div>ok = int(all(x == 3.0 for x in diffs))</div><div>print(f"ma7_diffs={diffs[:3]} constant_slope={ok}")</div></div>
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">chuỗi = xu hướng + mùa vụ + phần dư</span><span class="a">→</span>
      <span class="n">trung bình trượt dài đúng một chu kỳ</span><span class="a">→</span>
      <span class="n">so cùng kỳ, không so liền kề</span><span class="a">→</span>
      <span class="n">nhớ độ trễ và lịch đặc biệt</span></div>
    say: Tổng kết lại, một chuỗi gồm xu hướng, mùa vụ và phần dư. Dùng trung bình trượt dài đúng một chu kỳ, so cùng kỳ thay vì so liền kề, và nhớ độ trễ cùng các ngày đặc biệt. Chuỗi dữ liệu theo thời gian luôn hoà trộn ba thành phần chính gồm xu hướng dài hạn, tính mùa vụ lặp lại theo chu kỳ tuần hay năm, và nhiễu ngẫu nhiên từng ngày. Khi dùng trung bình trượt để làm mượt dao động ngắn hạn, chiều dài cửa sổ phải bằng đúng một bội số chu kỳ đầy đủ chẳng hạn bảy ngày cho dữ liệu bán lẻ. Do tính toán nhìn lùi về quá khứ, đường trung bình trượt luôn phản ứng trễ vài ngày trước bước ngoặt đột ngột và không tự dùng để suy ra nguyên nhân tức thời. Thay vào đó, đối chiếu cùng kỳ tuần trước hoặc năm trước sau khi trừ các ngày lễ đặc biệt giúp tách biệt rạch ròi tăng trưởng thật khỏi biến động theo lịch. Chuỗi thời gian kinh doanh thường trộn lẫn xu hướng dài hạn, nhịp mùa vụ tuần và nhiễu ngẫu nhiên từng ngày. Đem hai ngày bất kỳ ra so sánh mà bỏ qua tính mùa vụ dễ khiến đội ngũ phản ứng thái quá trước biến động bình thường. Hãy luôn dùng chuỗi so sánh cùng kỳ và đường trung bình trượt để làm lộ bức tranh nền vững chắc. Khi phân tích dữ liệu theo thời gian, tách phần xu hướng dài hạn khỏi biến động cuối tuần hay dịp lễ giúp đánh giá công bằng mọi cải tiến sản phẩm. Nếu một chiến dịch ra mắt trùng đúng tuần cao điểm mua sắm, so sánh thô với tuần trước đó sẽ thổi phồng hiệu quả thật lên nhiều lần. Ghép đường trung bình trượt bảy ngày cùng mức cùng kỳ năm ngoái giữ bức tranh luôn khách quan và đáng tin.
  - show: |
      <div class="box key"><b>Tư duy:</b> trước khi giải thích một thay đổi, hỏi “bình thường thì <b>vào lúc này</b> con số sẽ là bao nhiêu?”.</div>
      <p class="note"><b>Hai mức quy mô:</b> Chuỗi 14 ngày chỉ cần 8 điểm trung bình trượt 7 ngày; trên 3 năm dữ liệu (1 095 ngày × 1 000 cửa hàng), cửa sổ trượt 7 ngày triệt tiêu răng cưa cuối tuần đồng loạt trong ~50 ms nhưng chấp nhận độ trễ phát hiện thay đổi 3–6 ngày.</p>
    say: Điều cần mang theo, trước khi giải thích một thay đổi, hãy hỏi bình thường thì vào lúc này con số sẽ là bao nhiêu. Chuỗi 14 ngày chỉ cần 8 điểm trung bình trượt 7 ngày. Trên 3 năm dữ liệu nghìn cửa hàng, cửa sổ trượt triệt răng cưa nhưng trễ phát hiện vài ngày.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: |
      <p class="note">Bài sau (bài 7): <b>dự báo đường cơ sở</b> và đo sai số dự báo.</p>
    forward_ref: true
    say: Ở bài sau, bài 7, ta học dự báo đường cơ sở và cách đo sai số dự báo. Hẹn gặp bạn ở bài tiếp theo.
