id: L00
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 0 — Câu hỏi phân tích và định nghĩa chỉ số"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dan.yaml L00; audit/dan/verify_dan.py L00; ACM Data Science Task Force (2021), mục Data Analysis and Presentation; DSC bài 0 (quy trình khoa học dữ liệu)"
assumes: [arith]
# Quy ước: nhật ký 10 dòng (người dùng, sự kiện) của một ngày (alg.DAN_LOG); “hoạt động” theo hai định nghĩa (alg.dan_active). Dữ liệu là SỐ MINH HOẠ.
objectives:
  - "Viết định nghĩa chỉ số đủ chặt để hai người tính ra cùng số"
  - "Phân biệt chỉ số mục tiêu và chỉ số bảo vệ"
  - "Bắt đầu phân tích từ câu hỏi quyết định"
asr_reviewed:
  - {sentence: "Thứ hai, múi giờ.", reason: "ASR chép “Thứ 2. Mũi giờ” (0.75): lệch âm/thanh thuần Việt: múi/mũi — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai báo cáo, hai con số, cùng một ngày"
    checks:
      - "alg.dan_active(alg.DAN_LOG, 'login') == 6 and alg.dan_active(alg.DAN_LOG, 'action') == 4"
    steps:
      - show: |
          <p>Nhóm sản phẩm báo “hôm qua có 6 người dùng hoạt động”. Nhóm tăng trưởng báo “4 người”. Cả hai cùng đọc một nhật ký, cùng viết đúng câu truy vấn (câu lệnh lấy số liệu từ cơ sở dữ liệu) — và cãi nhau cả buổi họp. Thật ra không ai tính sai: họ <b>định nghĩa khác nhau</b>.</p>
          <div class="box key">Hôm nay: bắt đầu phân tích từ <b>câu hỏi</b>, và viết <b>định nghĩa chỉ số</b> chặt tới mức không còn chỗ hiểu hai cách.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, nhóm sản phẩm báo hôm qua có 6 người dùng hoạt động, còn nhóm tăng trưởng báo 4 người. Cả hai cùng đọc một nhật ký, cùng viết đúng câu truy vấn, tức câu lệnh lấy số liệu từ cơ sở dữ liệu, và cãi nhau cả buổi họp. Thật ra không ai tính sai, họ định nghĩa khác nhau. Hôm nay ta học cách bắt đầu phân tích từ câu hỏi, và viết định nghĩa chỉ số chặt tới mức không còn chỗ hiểu hai cách."

  - id: prereq
    kind: prereq
    title: "Ôn lại: đếm dòng khác đếm người, và đổi múi giờ"
    checks:
      - "len([('u1', 'dang_nhap'), ('u1', 'xem'), ('u2', 'dang_nhap')]) == 3 and len({u for u, e in [('u1', 'dang_nhap'), ('u1', 'xem'), ('u2', 'dang_nhap')]}) == 2"
      - "(20 + 7) % 24 == 3 and (20 + 7) // 24 == 1"
    steps:
      - show: |
          <table class="t"><tr><th>dòng</th><th>người dùng</th><th>sự kiện</th></tr>
          <tr><td>1</td><td>u1</td><td>đăng nhập</td></tr>
          <tr><td>2</td><td>u1</td><td>xem</td></tr>
          <tr><td>3</td><td>u2</td><td>đăng nhập</td></tr></table>
          <p>Đếm <b>dòng</b>: 3. Đếm <b>người khác nhau</b>: 2 (u1 chỉ tính một lần).</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Trước hết, ta cần hiểu hai cách đếm khác nhau trên một nhật ký, tức bảng ghi mỗi việc người dùng làm thành một dòng. Nhật ký nhỏ này có 3 dòng, dòng đầu là u 1 đăng nhập. Dòng thứ hai là u 1 xem. Dòng thứ ba là u 2 đăng nhập. Đếm dòng thì được 3, còn đếm người khác nhau thì chỉ được 2, vì u 1 xuất hiện hai lần nhưng chỉ tính một lần."
      - show: |
          <p><b>Múi giờ:</b> giờ Việt Nam $=$ giờ quốc tế $+ 7$. Ví dụ 20 giờ ngày 1 theo giờ quốc tế $\to 20 + 7 = 27$ giờ, tức <b>3 giờ sáng ngày 2</b> theo giờ Việt Nam.</p>
        say: "Thứ hai, múi giờ. Giờ Việt Nam bằng giờ quốc tế cộng 7. Ví dụ 20 giờ ngày 1 theo giờ quốc tế, cộng 7 được 27 giờ, tức là 3 giờ sáng ngày 2 theo giờ Việt Nam. Cùng một sự kiện, nhưng thuộc về hai ngày khác nhau tuỳ múi giờ ta chọn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: một định nghĩa chỉ số đầy đủ"
    steps:
      - show: |
          <table class="t"><tr><th>thành phần</th><th>ví dụ cho “người dùng hoạt động trong ngày”</th></tr>
          <tr><td><b>đơn vị đếm</b></td><td>tài khoản (không phải thiết bị, không phải phiên — một lần mở ứng dụng)</td></tr>
          <tr><td><b>sự kiện đủ điều kiện</b></td><td>có ít nhất một thao tác ngoài đăng nhập</td></tr>
          <tr><td><b>khoảng thời gian, múi giờ</b></td><td>00:00 – 24:00 giờ Việt Nam</td></tr>
          <tr><td><b>loại trừ</b></td><td>tài khoản thử nghiệm, máy quét tự động</td></tr></table>
          <p><b>Chỉ số mục tiêu</b>: thứ ta muốn tăng. <b>Chỉ số bảo vệ</b>: thứ không được tệ đi khi tăng mục tiêu (ví dụ tỉ lệ khiếu nại).</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Bảng liệt kê bốn thành phần của một định nghĩa đầy đủ. Đơn vị đếm là tài khoản, không phải thiết bị hay phiên, tức một lần mở ứng dụng. Sự kiện đủ điều kiện là có ít nhất một thao tác ngoài đăng nhập. Khoảng thời gian và múi giờ là từ 0 giờ tới 24 giờ theo giờ Việt Nam. Loại trừ tài khoản thử nghiệm và máy quét tự động. Chỉ số mục tiêu là thứ ta muốn tăng. Chỉ số bảo vệ là thứ không được tệ đi khi tăng mục tiêu, ví dụ tỉ lệ khiếu nại."

  - id: intuition
    kind: intuition
    title: "Định nghĩa là cái sàng: sàng khác, lọt qua khác"
    checks:
      - "alg.dan_active(alg.DAN_LOG, 'login') == 6 and alg.dan_active(alg.DAN_LOG, 'action') == 4"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><g fill="#1f2937" font-size="22"><text x="750" y="36" text-anchor="middle" font-weight="bold">cùng 6 người dùng, hai định nghĩa “hoạt động”</text><text x="30" y="118">A: có đăng nhập</text><circle cx="430" cy="110" r="26" fill="#93c5fd" stroke="#2a78d6" stroke-width="3"/><text x="430" y="166" text-anchor="middle" font-size="20">u1</text><circle cx="570" cy="110" r="26" fill="#93c5fd" stroke="#2a78d6" stroke-width="3"/><text x="570" y="166" text-anchor="middle" font-size="20">u2</text><circle cx="710" cy="110" r="26" fill="#93c5fd" stroke="#2a78d6" stroke-width="3"/><text x="710" y="166" text-anchor="middle" font-size="20">u3</text><circle cx="850" cy="110" r="26" fill="#93c5fd" stroke="#2a78d6" stroke-width="3"/><text x="850" y="166" text-anchor="middle" font-size="20">u4</text><circle cx="990" cy="110" r="26" fill="#93c5fd" stroke="#2a78d6" stroke-width="3"/><text x="990" y="166" text-anchor="middle" font-size="20">u5</text><circle cx="1130" cy="110" r="26" fill="#93c5fd" stroke="#2a78d6" stroke-width="3"/><text x="1130" y="166" text-anchor="middle" font-size="20">u6</text><text x="1300" y="120" font-size="30" font-weight="bold" fill="#2a78d6">= 6</text><text x="30" y="243">B: có thao tác khác</text><circle cx="430" cy="235" r="26" fill="#a7f3d0" stroke="#059669" stroke-width="3"/><text x="430" y="291" text-anchor="middle" font-size="20">u1</text><circle cx="570" cy="235" r="26" fill="#a7f3d0" stroke="#059669" stroke-width="3"/><text x="570" y="291" text-anchor="middle" font-size="20">u2</text><circle cx="710" cy="235" r="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/><text x="710" y="291" text-anchor="middle" font-size="20">u3</text><circle cx="850" cy="235" r="26" fill="#a7f3d0" stroke="#059669" stroke-width="3"/><text x="850" y="291" text-anchor="middle" font-size="20">u4</text><circle cx="990" cy="235" r="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/><text x="990" y="291" text-anchor="middle" font-size="20">u5</text><circle cx="1130" cy="235" r="26" fill="#a7f3d0" stroke="#059669" stroke-width="3"/><text x="1130" y="291" text-anchor="middle" font-size="20">u6</text><text x="1300" y="245" font-size="30" font-weight="bold" fill="#059669">= 4</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hãy hình dung định nghĩa chỉ số như một cái sàng đặt lên cùng một nhóm 6 người dùng. Sàng A giữ lại ai có đăng nhập, nên cả 6 vòng tròn đều được tô xanh. Sàng B chỉ giữ ai có thao tác khác đăng nhập, nên u 3 và u 5 rơi ra ngoài, còn lại 4."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Một nhật ký, hai định nghĩa"
    checks:
      - "alg.dan_active(alg.DAN_LOG, 'login') == 6 and alg.dan_active(alg.DAN_LOG, 'action') == 4 and len(alg.DAN_LOG) == 10"
    steps:
      - show: |
          <table class="t"><tr><th>người dùng</th><th>sự kiện trong ngày</th></tr>
          <tr><td>u1</td><td>đăng nhập, xem</td></tr>
          <tr><td>u2</td><td>đăng nhập, mua</td></tr>
          <tr><td>u3, u5</td><td>chỉ đăng nhập</td></tr>
          <tr><td>u4</td><td>đăng nhập, xem</td></tr>
          <tr><td>u6</td><td>đăng nhập, bình luận</td></tr></table>
          <p><b>Bước 1</b> — nhật ký 10 dòng của 6 người dùng, gom theo người.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", 2]
        say: "Bước một, bảng là nhật ký 10 dòng của 6 người dùng. u 1 đăng nhập rồi xem. u 2 đăng nhập rồi mua. u 3 và u 5 chỉ đăng nhập. u 4 đăng nhập rồi xem. u 6 đăng nhập rồi bình luận. Ta gom các dòng theo từng người để dễ đếm."
      - show: |
          <p><b>Bước 2</b> — định nghĩa A, “có đăng nhập”: giữ 6 dòng đăng nhập, đếm người khác nhau: u1, u2, u3, u4, u5, u6 $\to$ <b>6</b>.</p>
        say: "Bước hai, theo định nghĩa có đăng nhập, ta giữ lại 6 dòng đăng nhập rồi đếm người khác nhau. Từ u 1 tới u 6 đều có mặt, nên có 6 người hoạt động."
      - show: |
          <p><b>Bước 3</b> — định nghĩa B, “có thao tác ngoài đăng nhập”: bỏ 6 dòng đăng nhập, còn $10 - 6 = 4$ dòng: u1 xem, u2 mua, u4 xem, u6 bình luận $\to$ $\hl{4}$ người.</p>
        say: "Bước ba, theo định nghĩa có thao tác ngoài đăng nhập, ta bỏ 6 dòng đăng nhập, còn 10 trừ 6 bằng 4 dòng. Đó là u 1 xem, u 2 mua, u 4 xem và u 6 bình luận, nên có 4 người."
      - clear: true
        show: |
          <p><b>Bước 4</b> — đọc kết quả: hai con số chênh $6 - 4 = 2$ người (u3, u5 chỉ đăng nhập). Cả hai đúng — với định nghĩa của mình. Việc của người phân tích là <b>chọn và ghi ra</b> một định nghĩa.</p>
        say: "Bước bốn, đọc kết quả. Hai con số chênh nhau 6 trừ 4 bằng 2 người, chính là u 3 và u 5, hai người chỉ đăng nhập. Cả hai đều đúng với định nghĩa của mình. Việc của người phân tích là chọn một định nghĩa và ghi nó ra."

  - id: check
    kind: check
    title: "Tự kiểm: đếm phần bù"
    checks:
      - "sum(1 for u, e in alg.DAN_LOG if e == 'dang_nhap') == 6 and len({u for u, e in alg.DAN_LOG} - {u for u, e in alg.DAN_LOG if e != 'dang_nhap'}) == 2 and 6 - 2 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác</th><th>phép đếm</th><th>kết quả</th></tr>
          <tr><td>ai <b>chỉ</b> đăng nhập?</td><td>u3, u5</td><td>2 người</td></tr>
          <tr><td>lấy tất cả trừ phần bù</td><td>$6 - 2$</td><td>4 ✓ khớp định nghĩa B</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3"]
        say: "Kiểm bằng đường khác, ta không lọc lại các dòng thao tác mà đếm phần bù. Những ai chỉ đăng nhập mà không làm gì thêm? Đó là u 3 và u 5, tức 2 người. Vì mỗi người hoặc chỉ đăng nhập, hoặc có thao tác khác, nên lấy tất cả 6 người trừ đi 2 được 4, khớp với định nghĩa B."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, cả người mới lẫn người đã đi làm"
    checks:
      - "round((4 - 6) / 6 * 100) == -33 and (4 - 4) / 4 == 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ số không có định nghĩa viết ra <b class="red">(mỗi nhóm một con số)</b>
          <br><span class="note">Viết định nghĩa vào một chỗ chung, kèm câu truy vấn chuẩn; mọi bảng điều khiển (trang gom các biểu đồ chỉ số) dùng lại đúng câu đó.</span></div>
        say: "Lỗi thứ nhất, chỉ số không có định nghĩa viết ra, nên mỗi nhóm một con số. Hãy viết định nghĩa vào một chỗ chung, kèm câu truy vấn chuẩn, và mọi bảng điều khiển, tức trang gom các biểu đồ chỉ số, dùng lại đúng câu đó."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên múi giờ <b class="red">(ngày bị cắt sai)</b>
          <br><span class="note">Nhật ký ghi giờ quốc tế, báo cáo đọc theo giờ Việt Nam: “hôm qua” lệch 7 giờ. Ghi rõ múi giờ trong định nghĩa và đổi một lần ở một chỗ.</span></div>
        say: "Lỗi thứ hai, quên múi giờ, nên ngày bị cắt sai. Nhật ký ghi giờ quốc tế, báo cáo lại đọc theo giờ Việt Nam, nên hôm qua bị lệch 7 giờ. Hãy ghi rõ múi giờ trong định nghĩa, và đổi một lần ở một chỗ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Phân tích không có câu hỏi quyết định <b class="red">(đẹp mà vô dụng)</b>
          <br><span class="note">Trước khi viết truy vấn, viết câu: “nếu kết quả là X thì ta sẽ làm Y”. Không đổi được quyết định nào thì chưa cần phân tích.</span></div>
        say: "Lỗi thứ ba, phân tích không có câu hỏi quyết định, nên kết quả đẹp mà vô dụng. Trước khi viết truy vấn, hãy viết một câu, nếu kết quả là X thì ta sẽ làm Y. Không đổi được quyết định nào thì chưa cần phân tích."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Đổi định nghĩa giữa chừng mà không tính lại quá khứ <b class="red">(biểu đồ tụt giả)</b>
          <br><span class="note">Lỗi của người đã đi làm: hôm qua dùng định nghĩa A, hôm nay chuyển sang B. Giả sử hai ngày có nhật ký y hệt nhau:</span></div>
          <table class="t"><tr><th>cách vẽ</th><th>hôm qua</th><th>hôm nay</th><th>thay đổi</th></tr>
          <tr><td>trộn hai định nghĩa</td><td>6 (A)</td><td>4 (B)</td><td class="red">$\frac{4 - 6}{6} \approx -33\%$</td></tr>
          <tr><td>tính lại cả hai ngày bằng B</td><td>4</td><td>4</td><td>0% ✓</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư là lỗi của người đã đi làm, đổi định nghĩa giữa chừng mà không tính lại quá khứ. Giả sử hôm qua dùng định nghĩa A, hôm nay chuyển sang B, và hai ngày có nhật ký y hệt nhau. Bảng so hai cách vẽ biểu đồ. Trộn hai định nghĩa thì từ 6 xuống 4, trông như tụt khoảng 33 phần trăm, dù hành vi người dùng không đổi chút nào. Tính lại cả hai ngày bằng định nghĩa B thì 4 và 4, thay đổi 0 phần trăm, nên khi đổi định nghĩa hãy tính lại toàn bộ lịch sử và ghi ngày đổi lên biểu đồ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "len({u for u, e in alg.DAN_LOG if e == 'mua'}) == 1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cùng nhật ký: theo định nghĩa “có mua hàng”, có bao nhiêu người hoạt động?</td></tr>
          <tr><td>2</td><td>Nhóm muốn tăng số người mua. Đề xuất một chỉ số bảo vệ.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cùng nhật ký, theo định nghĩa có mua hàng thì có bao nhiêu người hoạt động? Câu hai, nhóm muốn tăng số người mua, hãy đề xuất một chỉ số bảo vệ. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Lọc các dòng có sự kiện “mua”: chỉ 1 dòng, (u2, mua). Đếm người khác nhau: $\hl{1}$ người (u2) — cùng dữ liệu, định nghĩa thứ ba, con số thứ ba.</p>
        say: "Đáp án câu một. Trước hết lọc các dòng có sự kiện mua, chỉ còn đúng 1 dòng là u 2 mua. Đếm người khác nhau thì chỉ có 1 người là u 2, cùng dữ liệu, định nghĩa thứ ba, ra con số thứ ba."
      - show: |
          <p>② Hỏi: tăng người mua bằng cách nào có thể gây hại? Ví dụ giảm giá sâu. Chỉ số bảo vệ: tỉ lệ trả hàng, hoặc tỉ lệ khách huỷ đăng ký nhận tin — tăng người mua bằng giảm giá sâu có thể làm chúng tệ đi.</p>
        say: "Câu hai, hãy tự hỏi tăng người mua bằng cách nào có thể gây hại, ví dụ giảm giá sâu. Chỉ số bảo vệ có thể là tỉ lệ trả hàng, hoặc tỉ lệ khách huỷ đăng ký nhận tin, vì tăng người mua bằng giảm giá sâu có thể làm chúng tệ đi."

