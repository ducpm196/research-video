      <span class="n">định nghĩa: đơn vị, sự kiện, thời gian, loại trừ</span><span class="a">→</span>

      <span class="n">chỉ số mục tiêu kèm chỉ số bảo vệ</span><span class="a">→</span>

      <span class="n">một câu truy vấn chuẩn dùng chung</span></div>

      '
    say: Khi định nghĩa sự kiện hoạt động, luôn chốt rõ múi giờ chuẩn, khoảng thời gian tính, và danh sách tài khoản kiểm
      thử nội bộ cần loại bỏ trước khi tổng hợp. Mỗi khi báo cáo doanh thu hay lượt dùng tăng đột biến bất thường, việc đầu
      tiên là kiểm tra lại câu lệnh lọc nguồn trước khi kết luận thay đổi hành vi khách hàng. Ghi chú rõ từng quy tắc ngay
      bên cạnh tên cột giúp mọi thành viên trong đội đọc ra cùng một con số duy nhất khi họp đánh giá định kỳ. Sau cùng, thói
      quen rà soát lại định nghĩa trước mỗi lần tính giúp tiết kiệm hàng giờ tranh cãi số liệu về sau. Một bảng chỉ số tốt
      bắt đầu từ câu hỏi quyết định rõ ràng và các cột đầu vào có ngữ nghĩa nhất quán qua nhiều phiên bản dữ liệu. Hãy thực
      hành tách biệt rõ sự kiện mở màn hình với thao tác hoàn tất giao dịch ở bài tập ngay sau đây. Định nghĩa sai một cột
      điều kiện lọc sẽ làm lệch toàn bộ chuỗi báo cáo nhiều tháng liền. Bất cứ khi nào nhìn thấy hai báo cáo lệch số, bước
      đầu tiên không phải nghi ngờ cơ sở dữ liệu mà là so bốn thành phần định nghĩa.
