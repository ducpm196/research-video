    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, cùng nhật ký, theo định nghĩa có mua hàng thì có bao nhiêu người hoạt động?
      Câu hai, nhóm muốn tăng số người mua, hãy đề xuất một chỉ số bảo vệ. Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Lọc các dòng có sự kiện “mua”: chỉ 1 dòng, (u2, mua). Đếm người khác nhau: $\hl{1}$ người (u2) — cùng dữ liệu,
      định nghĩa thứ ba, con số thứ ba.</p>

      '
    say: Đáp án câu một. Trước hết lọc các dòng có sự kiện mua, chỉ còn đúng 1 dòng là u 2 mua. Đếm người khác nhau thì chỉ
      có 1 người là u 2, cùng dữ liệu, định nghĩa thứ ba, ra con số thứ ba. Từ một nhật ký mười dòng ta thu được ba con số
      6, 4 và 1 hoàn toàn hợp lệ theo từng câu hỏi khác nhau.
  - show: '<p>② Hỏi: tăng người mua bằng cách nào có thể gây hại? Ví dụ giảm giá sâu. Chỉ số bảo vệ: tỉ lệ trả hàng, hoặc
      tỉ lệ khách huỷ đăng ký nhận tin — tăng người mua bằng giảm giá sâu có thể làm chúng tệ đi.</p>

      '
    say: Câu hai, hãy tự hỏi tăng người mua bằng cách nào có thể gây hại, ví dụ giảm giá sâu. Chỉ số bảo vệ có thể là tỉ lệ
      trả hàng, hoặc tỉ lệ khách huỷ đăng ký nhận tin, vì tăng người mua bằng giảm giá sâu có thể làm chúng tệ đi. Chỉ số
      bảo vệ giúp phát hiện sớm các chiến dịch mua tăng trưởng ngắn hạn nhưng phá hỏng trải nghiệm khách lâu dài.
