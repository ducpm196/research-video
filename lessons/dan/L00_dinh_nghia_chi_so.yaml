scenes:
- id: hook
  kind: hook
  title: Hai báo cáo, hai con số, cùng một ngày
  checks:
  - alg.dan_active(alg.DAN_LOG, 'login') == 6 and alg.dan_active(alg.DAN_LOG, 'action') == 4
  steps:
  - show: '<p>Nhóm sản phẩm báo “hôm qua có 6 người dùng hoạt động”. Nhóm tăng trưởng báo “4 người”. Cả hai cùng đọc một nhật
      ký, cùng viết đúng câu truy vấn (câu lệnh lấy số liệu từ cơ sở dữ liệu) — và cãi nhau cả buổi họp. Thật ra không ai
      tính sai: họ <b>định nghĩa khác nhau</b>.</p>

      <div class="box key">Hôm nay: bắt đầu phân tích từ <b>câu hỏi</b>, và viết <b>định nghĩa chỉ số</b> chặt tới mức không
      còn chỗ hiểu hai cách.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    say: Chào bạn, nhóm sản phẩm báo hôm qua có 6 người dùng hoạt động, còn nhóm tăng trưởng báo 4 người. Cả hai cùng đọc
      một nhật ký, cùng viết đúng câu truy vấn, tức câu lệnh lấy số liệu từ cơ sở dữ liệu, và cãi nhau cả buổi họp. Thật ra
      không ai tính sai, họ định nghĩa khác nhau. Hôm nay ta học cách bắt đầu phân tích từ câu hỏi, và viết định nghĩa chỉ
      số chặt tới mức không còn chỗ hiểu hai cách.
- id: prereq
  kind: prereq
  title: 'Ôn lại: đếm dòng khác đếm người, và đổi múi giờ'
  checks:
  - len([('u1', 'dang_nhap'), ('u1', 'xem'), ('u2', 'dang_nhap')]) == 3 and len({u for u, e in [('u1', 'dang_nhap'), ('u1',
    'xem'), ('u2', 'dang_nhap')]}) == 2
  - (20 + 7) % 24 == 3 and (20 + 7) // 24 == 1
  steps:
  - show: '<table class="t"><tr><th>dòng</th><th>người dùng</th><th>sự kiện</th></tr>

      <tr><td>1</td><td>u1</td><td>đăng nhập</td></tr>

      <tr><td>2</td><td>u1</td><td>xem</td></tr>

      <tr><td>3</td><td>u2</td><td>đăng nhập</td></tr></table>

      <p>Đếm <b>dòng</b>: 3. Đếm <b>người khác nhau</b>: 2 (u1 chỉ tính một lần).</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    say: Trước hết, ta cần hiểu hai cách đếm khác nhau trên một nhật ký, tức bảng ghi mỗi việc người dùng làm thành một dòng.
      Nhật ký nhỏ này có 3 dòng, dòng đầu là u 1 đăng nhập. Dòng thứ hai là u 1 xem. Dòng thứ ba là u 2 đăng nhập. Đếm dòng
      thì được 3, còn đếm người khác nhau thì chỉ được 2, vì u 1 xuất hiện hai lần nhưng chỉ tính một lần. Nếu không tách
      rõ người dùng phân biệt, một người bấm tải lại trang mười lần sẽ bị đếm thành mười người hoạt động.
  - show: '<p><b>Múi giờ:</b> giờ Việt Nam $=$ giờ quốc tế $+ 7$. Ví dụ 20 giờ ngày 1 theo giờ quốc tế $\to 20 + 7 = 27$ giờ,
      tức <b>3 giờ sáng ngày 2</b> theo giờ Việt Nam.</p>

      '
    say: Thứ hai, múi giờ. Giờ Việt Nam bằng giờ quốc tế cộng 7. Ví dụ 20 giờ ngày 1 theo giờ quốc tế, cộng 7 được 27 giờ,
      tức là 3 giờ sáng ngày 2 theo giờ Việt Nam. Cùng một sự kiện, nhưng thuộc về hai ngày khác nhau tuỳ múi giờ ta chọn.
      Giờ máy chủ ghi theo chuẩn quốc tế luôn tăng đều, tránh hoàn toàn rắc rối chuyển giờ mùa hè hay lệch vùng địa lý.
- id: sym
  kind: symbol
  title: 'Giải mã: một định nghĩa chỉ số đầy đủ'
  steps:
  - show: '<table class="t"><tr><th>thành phần</th><th>ví dụ cho “người dùng hoạt động trong ngày”</th></tr>

      <tr><td><b>đơn vị đếm</b></td><td>tài khoản (không phải thiết bị, không phải phiên — một lần mở ứng dụng)</td></tr>

      <tr><td><b>sự kiện đủ điều kiện</b></td><td>có ít nhất một thao tác ngoài đăng nhập</td></tr>

      <tr><td><b>khoảng thời gian, múi giờ</b></td><td>00:00 – 24:00 giờ Việt Nam</td></tr>

      <tr><td><b>loại trừ</b></td><td>tài khoản thử nghiệm, máy quét tự động</td></tr></table>

      <p><b>Chỉ số mục tiêu</b>: thứ ta muốn tăng. <b>Chỉ số bảo vệ</b>: thứ không được tệ đi khi tăng mục tiêu (ví dụ tỉ
      lệ khiếu nại).</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    - 2
    - 2
    say: Bảng liệt kê bốn thành phần của một định nghĩa đầy đủ. Đơn vị đếm là tài khoản, không phải thiết bị hay phiên, tức
      một lần mở ứng dụng. Sự kiện đủ điều kiện là có ít nhất một thao tác ngoài đăng nhập. Khoảng thời gian và múi giờ là
      từ 0 giờ tới 24 giờ theo giờ Việt Nam. Loại trừ tài khoản thử nghiệm và máy quét tự động. Chỉ số mục tiêu là thứ ta
      muốn tăng. Chỉ số bảo vệ là thứ không được tệ đi khi tăng mục tiêu, ví dụ tỉ lệ khiếu nại. Phần thời gian còn phải nói
      rõ cửa sổ tính là theo ngày lịch cố định hay theo cửa sổ trượt hai mươi bốn giờ. Mục loại trừ giúp báo cáo sản phẩm
      không bị phình ảo mỗi khi hệ thống chạy kịch bản kiểm thử tự động ban đêm.
