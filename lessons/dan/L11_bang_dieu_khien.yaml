id: L11
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 11 — Bảng điều khiển chỉ số và cảnh báo đáng tin"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dan.yaml L11; audit/dan/verify_dan.py L11; E. Tufte, The Visual Display of Quantitative Information (bản 2, 2001) — tỉ số nói dối; S. Few, Information Dashboard Design (bản 2, 2013); DSC bài 5 (trực quan hoá trung thực), bài 14; bài 0, 9"
assumes: [arith, frac, cdot, power]
# Quy ước: cây chỉ số doanh thu = lượt truy cập · tỉ lệ chuyển đổi · giá trị đơn trung bình (nghìn) — SỐ MINH HOẠ. Báo động giả: mỗi chỉ số độc lập có xác suất p
#   báo nhầm mỗi ngày; xác suất có ít nhất một báo nhầm trong n chỉ số = 1 − (1 − p)^n.
objectives:
  - "Dựng cây chỉ số từ chỉ số mục tiêu xuống chỉ số thành phần"
  - "Vẽ biểu đồ không phóng đại"
  - "Thiết kế cảnh báo ít báo động giả"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bốn mươi biểu đồ và không ai biết hôm nay ổn không"
    checks:
      - "round(1 - 0.95 ** 20, 3) == 0.642"
    steps:
      - show: |
          <p>Bảng điều khiển có 40 biểu đồ, 20 cảnh báo tự động. Sáng nào cũng có vài cảnh báo đỏ, nên nhóm đã quen bỏ qua. Hôm thanh toán hỏng thật, cảnh báo đúng chìm giữa các cảnh báo vô nghĩa. Một bảng điều khiển tốt phải trả lời <b>một câu</b>: hôm nay có ổn không, và nếu không thì vì đâu.</p>
          <div class="box key">Hôm nay: <b>cây chỉ số</b>, biểu đồ <b>không phóng đại</b>, và <b>cảnh báo</b> đáng tin.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, một bảng điều khiển có 40 biểu đồ và 20 cảnh báo tự động. Sáng nào cũng có vài cảnh báo đỏ, nên nhóm đã quen bỏ qua. Hôm thanh toán hỏng thật, cảnh báo đúng chìm giữa các cảnh báo vô nghĩa. Một bảng điều khiển tốt phải trả lời một câu, hôm nay có ổn không, và nếu không thì vì đâu. Hôm nay ta học cây chỉ số, biểu đồ không phóng đại, và cảnh báo đáng tin."

  - id: prereq
    kind: prereq
    title: "Ôn lại: nhân xác suất, phần bù, và nhân hệ số thay đổi"
    checks:
      - "round(0.95 * 0.95, 4) == 0.9025 and round(1 - 0.95 * 0.95, 4) == 0.0975"
      - "round(1.1 * 0.9, 2) == 0.99 and round(1.1 * 0.9 - 1, 2) == -0.01"
    steps:
      - show: |
          <table class="t"><tr><th>hai cảnh báo độc lập, mỗi cái đúng 95% số ngày</th><th>tính</th></tr>
          <tr><td>cả hai cùng không báo nhầm</td><td>$0{,}95 \cdot 0{,}95 = 0{,}95^2 = 0{,}9025$</td></tr>
          <tr><td>có ít nhất một báo nhầm (phần bù)</td><td>$1 - 0{,}9025 = 0{,}0975$</td></tr></table>
        focus: [0, 0, "1.2", "1.3"]
        say: "Trước hết, ôn lại phép nhân xác suất. Có hai cảnh báo độc lập, mỗi cái không báo nhầm 95 phần trăm số ngày. Cả hai cùng không báo nhầm với xác suất 0 phẩy 95 nhân 0 phẩy 95, tức 0 phẩy 95 mũ 2, bằng 0 phẩy 9025. Xác suất có ít nhất một báo nhầm là phần bù, 1 trừ 0 phẩy 9025, bằng 0 phẩy 0975."
      - show: |
          <p><b>Nhân hệ số thay đổi</b>: tăng 10% là nhân 1,1; giảm 10% là nhân 0,9. Một tích có hai thừa số đổi như vậy: $1{,}1 \cdot 0{,}9 = 0{,}99$, tức giảm 1%.</p>
        say: "Thứ hai, tăng 10 phần trăm nghĩa là nhân với 1 phẩy 1, còn giảm 10 phần trăm nghĩa là nhân với 0 phẩy 9. Một tích có một thừa số tăng 10 phần trăm và một thừa số giảm 10 phần trăm. Khi đó tích nhân với 1 phẩy 1 nhân 0 phẩy 9, bằng 0 phẩy 99, tức giảm 1 phần trăm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: cây chỉ số"
    steps:
      - show: |
          <p><b>Cây chỉ số</b>: chỉ số mục tiêu ở gốc, tách thành tích các thành phần có người chịu trách nhiệm.</p>
          <p>$\text{doanh thu} = \text{lượt truy cập} \cdot \text{tỉ lệ chuyển đổi} \cdot \text{giá trị đơn trung bình}$</p>
          <table class="t"><tr><th>tầng</th><th>ai theo dõi</th></tr>
          <tr><td>doanh thu (mục tiêu)</td><td>ban điều hành</td></tr>
          <tr><td>lượt truy cập</td><td>tiếp thị</td></tr>
          <tr><td>tỉ lệ chuyển đổi (phễu, bài 5)</td><td>sản phẩm</td></tr>
          <tr><td>giá trị đơn trung bình</td><td>bán hàng, định giá</td></tr></table>
        focus: [1, 2, 3, "3.2", "3.3", "3.4", "3.5"]
        say: "Cây chỉ số đặt chỉ số mục tiêu ở gốc, rồi tách thành tích các thành phần có người chịu trách nhiệm. Doanh thu bằng lượt truy cập nhân tỉ lệ chuyển đổi nhân giá trị đơn trung bình. Bảng cho biết ai theo dõi tầng nào. Doanh thu là mục tiêu, do ban điều hành theo dõi. Lượt truy cập do tiếp thị. Tỉ lệ chuyển đổi, tức phễu ở bài 5, do nhóm sản phẩm. Giá trị đơn trung bình do bán hàng và định giá."

  - id: intuition
    kind: intuition
    title: "Gốc gần như đứng yên, hai nhánh chạy ngược chiều"
    checks:
      - "round(11000 * 0.027 * 200) == 59400 and round(1.1 * 0.9 * 1, 2) == 0.99"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g fill="#1f2937" font-size="22"><line x1="750" y1="125" x2="270" y2="205" stroke="#6b7280" stroke-width="2"/><line x1="750" y1="125" x2="750" y2="205" stroke="#6b7280" stroke-width="2"/><line x1="750" y1="125" x2="1230" y2="205" stroke="#6b7280" stroke-width="2"/><rect x="580" y="25" width="340" height="100" rx="12" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="750" y="64" text-anchor="middle" font-weight="bold">doanh thu: 59 400</text><text x="750" y="100" text-anchor="middle" fill="#1f2937">−1% (mục tiêu)</text><rect x="100" y="205" width="340" height="100" rx="12" fill="#a7f3d0" stroke="#059669" stroke-width="3"/><text x="270" y="244" text-anchor="middle" font-weight="bold">truy cập: 11 000</text><text x="270" y="280" text-anchor="middle" fill="#059669">+10%, tiếp thị</text><rect x="580" y="205" width="340" height="100" rx="12" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><text x="750" y="244" text-anchor="middle" font-weight="bold">chuyển đổi: 2,7%</text><text x="750" y="280" text-anchor="middle" fill="#b91c1c">−10%, sản phẩm</text><rect x="1060" y="205" width="340" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="1230" y="244" text-anchor="middle" font-weight="bold">giá trị đơn: 200</text><text x="1230" y="280" text-anchor="middle" fill="#6b7280">0%, bán hàng</text><text x="750" y="335" text-anchor="middle" font-size="20">doanh thu = truy cập nhân chuyển đổi nhân giá trị đơn: 1,1 nhân 0,9 nhân 1 = 0,99</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cây chỉ số của tuần này. Gốc là doanh thu, chỉ giảm 1 phần trăm, nhìn qua tưởng không có gì. Nhưng ba nhánh bên dưới kể chuyện khác, truy cập tăng 10 phần trăm, chuyển đổi giảm 10 phần trăm, còn giá trị đơn đứng yên. Vì doanh thu là tích của ba nhánh, một nhánh tăng và một nhánh giảm có thể gần như triệt tiêu nhau ở gốc, nên phải nhìn xuống cây mới thấy."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Doanh thu gần như đứng yên — nhưng bên dưới hai thứ đổi ngược chiều"
    checks:
      - "10000 * 0.03 * 200 == 60000 and round(11000 * 0.027 * 200) == 59400 and round(59400 / 60000 - 1, 3) == -0.01"
    steps:
      - show: |
          <p><b>Bước 1</b> — tuần trước: $10\,000 \cdot 0{,}03 \cdot 200 = 300 \cdot 200 = 60\,000$ nghìn, tức 60 triệu.</p>
        say: "Bước một, tuần trước có 10 nghìn lượt truy cập, chuyển đổi 3 phần trăm, nên có 300 đơn. Nhân giá trị đơn 200 nghìn, doanh thu là 60 nghìn nghìn, tức 60 triệu."
      - show: |
          <p><b>Bước 2</b> — tuần này: $11\,000 \cdot 0{,}027 \cdot 200 = 297 \cdot 200 = 59\,400$ nghìn; so với tuần trước $\frac{59\,400}{60\,000} - 1 = \hl{-1\%}$.</p>
        say: "Bước hai, tuần này có 11 nghìn lượt, chuyển đổi 2 phẩy 7 phần trăm, nên có 297 đơn. Nhân 200 nghìn được 59 triệu 400 nghìn, giảm 1 phần trăm so với tuần trước."
      - clear: true
        show: |
          <table class="t"><tr><th></th><th>truy cập</th><th>chuyển đổi</th><th>giá trị đơn (nghìn)</th><th>doanh thu (nghìn)</th></tr>
          <tr><td>tuần trước</td><td>10 000</td><td>3%</td><td>200</td><td>60 000</td></tr>
          <tr><td>tuần này</td><td>11 000 (+10%)</td><td>2,7% (−10%)</td><td>200</td><td>59 400 ($\hl{-1\%}$)</td></tr></table>
          <p><b>Bước 3</b> — tách theo nhánh của cây.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước ba, đặt hai tuần cạnh nhau theo từng nhánh của cây. Tuần trước có 10 nghìn lượt truy cập, chuyển đổi 3 phần trăm, giá trị đơn 200 nghìn, doanh thu 60 triệu. Tuần này có 11 nghìn lượt, tăng 10 phần trăm, chuyển đổi 2 phẩy 7 phần trăm, giảm 10 phần trăm, doanh thu 59 triệu 400 nghìn, giảm 1 phần trăm. Giá trị đơn không đổi."
      - show: |
          <p><b>Bước 4</b> — chỉ nhìn doanh thu: “gần như không đổi”. Nhìn cây: tiếp thị kéo thêm 10% lượt, nhưng chuyển đổi tụt 10% — có thể trang thanh toán đang lỗi. Hai vấn đề khác nhau, hai nhóm khác nhau phải xử lý.</p>
        say: "Bước bốn, chỉ nhìn doanh thu thì thấy gần như không đổi. Nhìn cây thì tiếp thị kéo thêm 10 phần trăm lượt truy cập, nhưng chuyển đổi tụt 10 phần trăm, có thể trang thanh toán đang lỗi. Đó là hai vấn đề khác nhau, và hai nhóm khác nhau phải xử lý."

  - id: check
    kind: check
    title: "Tự kiểm: nhân hệ số, không tính lại doanh thu"
    checks:
      - "round(11000 / 10000, 2) == 1.1 and round(0.027 / 0.03, 2) == 0.9 and round(1.1 * 0.9 * 1 * 60000) == 59400"
      - "10000 * 0.03 == 300 and round(11000 * 0.027) == 297 and round((297 - 300) / 300 * 100) == -1"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>nhân hệ số từng nhánh</td><td>$\frac{11\,000}{10\,000} \cdot \frac{2{,}7}{3} \cdot \frac{200}{200} = 1{,}1 \cdot 0{,}9 \cdot 1$</td><td>0,99 → −1% ✓</td></tr>
          <tr><td>đếm số đơn</td><td>300 đơn → 297 đơn: $\frac{297 - 300}{300}$</td><td>−1% ✓ (giá trị đơn không đổi)</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3"]
        say: "Kiểm bằng hai đường khác, không nhân lại ba con số lớn. Mỗi nhánh có một hệ số thay đổi, truy cập nhân 1 phẩy 1, chuyển đổi nhân 0 phẩy 9, giá trị đơn nhân 1. Nhân các hệ số được 0 phẩy 99, tức doanh thu giảm 1 phần trăm, khớp. Đếm số đơn, từ 300 xuống 297 cũng là giảm 1 phần trăm, và vì giá trị đơn không đổi nên doanh thu giảm đúng chừng ấy."


  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, cả người mới lẫn người đã đi làm"
    checks:
      - "(105 - 95) / (100 - 95) == 2 and round(105 / 100 - 1, 2) == 0.05 and round(1 - 0.99 ** 100, 3) == 0.634"
      - "round(1.1 * 0.9 - 1, 2) == -0.01 and round(1.5 * 0.5 - 1, 2) == -0.25 and 10 - 10 == 0 and 50 - 50 == 0"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Cắt trục tung của biểu đồ cột <b class="red">(phóng đại khác biệt)</b>
          <br><span class="note">Trục bắt đầu từ 95: cột 105 trông cao gấp $\frac{105 - 95}{100 - 95} = 2$ lần cột 100, trong khi chỉ hơn 5%. Biểu đồ cột luôn bắt đầu từ 0; muốn soi chênh lệch nhỏ thì vẽ đường hoặc vẽ phần chênh.</span></div>
        say: "Lỗi thứ nhất, cắt trục tung của biểu đồ cột, nên phóng đại khác biệt. Trục bắt đầu từ 95 thì cột 105 trông cao gấp 2 lần cột 100, trong khi chỉ hơn 5 phần trăm. Biểu đồ cột luôn bắt đầu từ 0, còn muốn soi chênh lệch nhỏ thì vẽ đường, hoặc vẽ riêng phần chênh."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quá nhiều cảnh báo <b class="red">(người nhận học cách bỏ qua)</b>
          <br><span class="note">100 chỉ số, mỗi chỉ số báo nhầm 1% mỗi ngày: $1 - 0{,}99^{100} \approx 63\%$ số ngày có ít nhất một báo nhầm. Chỉ cảnh báo trên chỉ số gần gốc cây; chỉ số con để tra cứu khi điều tra.</span></div>
        say: "Lỗi thứ hai, có quá nhiều cảnh báo, nên người nhận học cách bỏ qua. Với 100 chỉ số, mỗi chỉ số báo nhầm 1 phần trăm mỗi ngày, thì khoảng 63 phần trăm số ngày có ít nhất một báo nhầm. Chỉ cảnh báo trên các chỉ số gần gốc cây, còn chỉ số con để tra cứu khi điều tra."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Cảnh báo không có người nhận và việc cần làm <b class="red">(báo cho không ai)</b>
          <br><span class="note">Mỗi cảnh báo ghi: ngưỡng và lý do chọn ngưỡng, người trực, việc đầu tiên phải làm, đường dẫn tới bảng điều tra. Không trả lời được thì xoá cảnh báo đó.</span></div>
        say: "Lỗi thứ ba, cảnh báo không có người nhận và việc cần làm, tức là báo cho không ai. Mỗi cảnh báo phải ghi ngưỡng và lý do chọn ngưỡng, người trực, việc đầu tiên phải làm, và đường dẫn tới bảng điều tra. Không trả lời được những điều đó thì xoá cảnh báo."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Đọc cây bằng cách <b>cộng</b> phần trăm của các nhánh <b class="red">(lỗi của người đã đi làm)</b></div>
          <table class="t"><tr><th>truy cập</th><th>chuyển đổi</th><th>cộng phần trăm (sai)</th><th>nhân hệ số (đúng)</th></tr>
          <tr><td>+10%</td><td>−10%</td><td>0%</td><td>$1{,}1 \cdot 0{,}9 = 0{,}99$: −1%</td></tr>
          <tr><td>+50%</td><td>−50%</td><td>0%</td><td class="red">$1{,}5 \cdot 0{,}5 = 0{,}75$: −25%</td></tr></table>
          <p class="note">Doanh thu là <b>tích</b>, nên thay đổi phải nhân. Cộng chỉ gần đúng khi các thay đổi đều nhỏ.</p>
        focus: [1, 0, "2.2", "2.3", 3]
        say: "Lỗi thứ tư là lỗi của người đã đi làm, đọc cây bằng cách cộng phần trăm thay đổi của các nhánh. Bảng so cách cộng với cách nhân. Truy cập tăng 10 và chuyển đổi giảm 10 phần trăm, cộng ra 0, còn nhân ra 0 phẩy 99, tức giảm 1 phần trăm, sai lệch còn nhỏ. Truy cập tăng 50 và chuyển đổi giảm 50 phần trăm, cộng vẫn ra 0, nhưng nhân ra 0 phẩy 75, tức doanh thu giảm 25 phần trăm. Vì doanh thu là tích, thay đổi phải nhân, và phép cộng chỉ gần đúng khi các thay đổi đều nhỏ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(1 - 0.95 ** 20, 3) == 0.642 and 20 * 0.05 == 1 and round(8000 * 0.035 * 250) == 70000"
      - "round(0.95 ** 20, 3) == 0.358 and round(8000 * 0.035) == 280 and 280 * 250 == 70000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>20 cảnh báo, mỗi cái báo nhầm 5% số ngày, độc lập. Trung bình bao nhiêu báo nhầm mỗi ngày? Xác suất một ngày có ít nhất một báo nhầm?</td></tr>
          <tr><td>2</td><td>8000 lượt truy cập, chuyển đổi 3,5%, giá trị đơn 250 nghìn. Doanh thu là bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, có 20 cảnh báo, mỗi cái báo nhầm 5 phần trăm số ngày, độc lập nhau. Trung bình có bao nhiêu báo nhầm mỗi ngày? Xác suất một ngày có ít nhất một báo nhầm là bao nhiêu? Câu hai, có 8000 lượt truy cập, chuyển đổi 3 phẩy 5 phần trăm, giá trị đơn 250 nghìn. Doanh thu là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Trung bình $20 \cdot 0{,}05 = 1$ báo nhầm mỗi ngày.</p>
          <p>Cả 20 cùng không báo nhầm: $0{,}95^{20} \approx 0{,}358$; phần bù $1 - 0{,}358 \approx \hl{64{,}2\%}$ số ngày có ít nhất một.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, trung bình 20 nhân 0 phẩy 05, bằng 1 báo nhầm mỗi ngày. Xác suất cả 20 cùng không báo nhầm là 0 phẩy 95 mũ 20, khoảng 0 phẩy 358. Lấy phần bù, 1 trừ 0 phẩy 358, khoảng 64 phẩy 2 phần trăm số ngày có ít nhất một báo nhầm."
      - show: |
          <p>② Số đơn: $8000 \cdot 0{,}035 = 280$. Doanh thu: $280 \cdot 250 = \hl{70\,000}$ nghìn, tức 70 triệu.</p>
        say: "Câu hai, đi theo cây. Số đơn là 8000 nhân 0 phẩy 035, bằng 280 đơn. Nhân giá trị đơn 250 nghìn, bằng 70 nghìn nghìn, tức 70 triệu."

