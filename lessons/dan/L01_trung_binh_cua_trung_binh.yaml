          <p>Trung bình khối: $\frac{240 + 40}{30 + 10} = \frac{280}{40} = \hl{7}$.</p>
        focus: [1, 2]
        say: "Đáp án câu một, trước hết lấy lại tổng điểm, lớp 1 là 30 nhân 8 bằng 240, lớp 2 là 10 nhân 4 bằng 40. Gộp tử số và mẫu số, 280 chia 40, bằng 7."
      - show: |
          <p>② $\frac{8 + 4}{2} = 6$ — thấp hơn 7, tức lệch về phía lớp nhỏ, vì lớp 10 học sinh được tính nặng ngang lớp 30 học sinh.</p>
        say: "Câu hai, 8 cộng 4 chia 2, bằng 6, thấp hơn 7, tức lệch về phía lớp nhỏ, vì lớp 10 học sinh được tính nặng ngang lớp 30 học sinh."

