id: L01
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 1 — Gộp nhóm và bẫy trung bình của trung bình"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dan.yaml L01; audit/dan/verify_dan.py L01; DBS bài 3 (gom nhóm, hàm tổng hợp); DSC bài 7 (nghịch lý Simpson)"
assumes: [arith, frac, cdot, approx]
# Quy ước: trung bình chung = tổng giá trị / tổng số phần tử = Σ nᵢ·mᵢ / Σ nᵢ (alg.weighted_mean). Hai cửa hàng là SỐ MINH HOẠ.
objectives:
  - "Tính trung bình có trọng số đúng"
  - "Nhận ra khi trung bình các nhóm không phải trung bình chung"
  - "Giữ tử số và mẫu số khi gộp tiếp"
asr_reviewed:
  - {sentence: "Bảng cho biết chỉ số nào gộp tiếp được từ bảng đã gộp.", reason: "ASR chép “Bản cho biết chỉ số nào gột tiếp được từ bản đã gột.” (0.692): lệch âm/thanh thuần Việt: bảng/bản, gộp/gột, bảng/bản, gộp/gột — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ ba, gộp làm đảo chiều kết luận, gọi là nghịch lý Simpson.", reason: "ASR chép “Lỗi thứ ba, gột làm đảo chiều kết luận, gọi là nghịch lý sim sân.” (0.867): Simpson đọc “Xim-xơn” theo lexicon DAN, ASR viết “sim sân”; lệch âm/thanh thuần Việt: gộp/gột — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Giá trị đơn trung bình 125 nghìn — hay 64 nghìn?"
    checks:
      - "(50 + 200) / 2 == 125 and round(alg.weighted_mean([(100, 50), (10, 200)]), 2) == 63.64"
    steps:
      - show: |
          <p>Bảng tổng hợp theo cửa hàng ghi giá trị đơn trung bình của từng nơi. Một bạn lấy trung bình cột đó để báo “giá trị đơn trung bình toàn công ty: 125 nghìn”. Con số thật chỉ khoảng <b>64 nghìn</b>. Phép cộng không sai — sai ở chỗ <b>gộp tiếp từ số đã gộp</b>.</p>
          <div class="box key">Hôm nay: <b>gộp nhóm</b> đúng — vì sao trung bình của các trung bình không phải trung bình chung, và cái gì gộp tiếp được.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, bảng tổng hợp theo cửa hàng ghi giá trị đơn trung bình của từng nơi. Một bạn lấy trung bình của cột đó để báo giá trị đơn trung bình toàn công ty là 125 nghìn. Con số thật chỉ khoảng 64 nghìn. Phép cộng không sai, mà sai ở chỗ gộp tiếp từ số đã gộp. Hôm nay ta học gộp nhóm cho đúng, vì sao trung bình của các trung bình không phải trung bình chung, và cái gì gộp tiếp được."

  - id: prereq
    kind: prereq
    title: "Ôn lại: trung bình cộng, và lấy lại tổng từ trung bình"
    checks:
      - "(2 + 4 + 6) / 3 == 4 and 3 * 4 == 12 and 20 / 1000 == 0.02"
    steps:
      - show: |
          <p><b>Trung bình cộng</b> $= \frac{\text{tổng}}{\text{số phần tử}}$: với 2, 4, 6 được $\frac{2 + 4 + 6}{3} = \frac{12}{3} = 4$.</p>
          <p>Đảo lại: <b>tổng $=$ số phần tử $\cdot$ trung bình</b> $= 3 \cdot 4 = 12$.</p>
        focus: [1, 1, 2]
        say: "Trước hết, ta cần hiểu trung bình cộng từ đầu, vì mọi phép gộp nhóm trong bài đều dựa vào nó. Trung bình bằng tổng chia số phần tử, với 2, 4, 6 thì tổng là 12, chia 3 được 4. Điều quan trọng cho bài này là đảo lại, tổng bằng số phần tử nhân trung bình, 3 nhân 4 bằng 12, nên biết số phần tử và trung bình thì luôn lấy lại được tổng."
      - show: |
          <p><b>Tỉ lệ</b> cũng là một phép chia: $\frac{\text{số chuyển đổi}}{\text{số lượt}}$, ví dụ $\frac{20}{1000} = 0{,}02 = 2\%$. Tử số là 20, mẫu số là 1000. (<b>Chuyển đổi</b>: khách làm điều ta mong, ví dụ mua hàng.)</p>
        say: "Tỉ lệ cũng là một phép chia, số lượt chuyển đổi, tức số lần khách làm điều ta mong như mua hàng, chia số lượt xem. Ví dụ 20 chia 1000 bằng 0 phẩy 02, tức 2 phần trăm, với tử số là 20 và mẫu số là 1000."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: cái gì cộng dồn được"
    steps:
      - show: |
          <table class="t"><tr><th>chỉ số</th><th>gộp tiếp từ bảng đã gộp?</th></tr>
          <tr><td>tổng, số lượng</td><td><b>được</b>: tổng của các tổng là tổng chung</td></tr>
          <tr><td>trung bình, tỉ lệ</td><td><b>không</b> — phải giữ tử số và mẫu số, gộp chúng rồi mới chia</td></tr>
          <tr><td>trung vị, số khác nhau</td><td><b>không</b> — phải tính lại từ dữ liệu gốc</td></tr></table>
          <p>Trung bình chung $= \frac{n_1 m_1 + n_2 m_2}{n_1 + n_2}$: mỗi nhóm có <b>trọng số</b> bằng số phần tử của nó.</p>
        introduces: [sub]
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng cho biết chỉ số nào gộp tiếp được từ bảng đã gộp. Tổng và số lượng thì được, tổng của các tổng là tổng chung. Trung bình và tỉ lệ thì không, phải giữ tử số và mẫu số, gộp chúng lại rồi mới chia. Trung vị và số giá trị khác nhau cũng không, phải tính lại từ dữ liệu gốc. Trung bình chung bằng n 1 nhân m 1 cộng n 2 nhân m 2, chia cho n 1 cộng n 2, mỗi nhóm có trọng số bằng số phần tử của nó."

  - id: intuition
    kind: intuition
    title: "San phẳng diện tích: nhóm rộng kéo trung bình về phía mình"
    checks:
      - "100 * 50 == 5000 and 10 * 200 == 2000 and round(7000 / 110, 2) == 63.64 and (50 + 200) / 2 == 125"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><g fill="#1f2937" font-size="22"><rect x="150" y="250" width="900" height="50" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><rect x="1090" y="100" width="90" height="200" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><line x1="130" y1="300" x2="1200" y2="300" stroke="#6b7280" stroke-width="2"/><text x="600" y="332" text-anchor="middle">A: 100 đơn, mỗi đơn 50, tổng 5000</text><text x="1135" y="332" text-anchor="middle">B: 10 đơn</text><text x="1135" y="88" text-anchor="middle">200</text><line x1="150" y1="175" x2="1180" y2="175" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 6"/><text x="1210" y="183" fill="#b91c1c">125: trung bình hai trung bình</text><line x1="150" y1="236" x2="1180" y2="236" stroke="#059669" stroke-width="3"/><text x="1210" y="244" fill="#059669">≈ 63,64: trung bình thật</text><text x="150" y="40" font-weight="bold">bề rộng = số đơn, chiều cao = trung bình, diện tích = tổng tiền</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mỗi cửa hàng thành một khối, bề rộng là số đơn, chiều cao là trung bình mỗi đơn, nên diện tích chính là tổng tiền. Khối A rộng mà thấp, khối B hẹp mà cao. Trung bình thật là chiều cao khi ta san phẳng toàn bộ diện tích lên 110 đơn, nên nó nằm sát khối A ở khoảng 63 phẩy 64. Đường đỏ 125 coi hai khối rộng như nhau, nên bị khối hẹp B kéo lên quá cao."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Hai cửa hàng"
    checks:
      - "(50 + 200) / 2 == 125 and 100 * 50 + 10 * 200 == 7000 and round(alg.weighted_mean([(100, 50), (10, 200)]), 2) == 63.64"
    steps:
      - show: |
          <table class="t"><tr><th>cửa hàng</th><th>số đơn</th><th>trung bình mỗi đơn (nghìn)</th><th>tổng tiền</th></tr>
          <tr><td>A</td><td>100</td><td>50</td><td>$100 \cdot 50 = 5000$</td></tr></table>
          <p><b>Bước 1</b> — lấy lại tổng tiền của A từ số đơn và trung bình.</p>
        focus: [1, "1.2", 2]
        say: "Bước một, cửa hàng A có 100 đơn, trung bình 50 nghìn mỗi đơn. Vì tổng bằng số phần tử nhân trung bình, tổng tiền của A là 100 nhân 50, bằng 5000 nghìn. Ta luôn lấy lại tổng trước khi gộp."
      - show: |
          <table class="t"><tr><th>cửa hàng</th><th>số đơn</th><th>trung bình mỗi đơn (nghìn)</th><th>tổng tiền</th></tr>
          <tr><td>A</td><td>100</td><td>50</td><td>5000</td></tr>
          <tr><td>B</td><td>10</td><td>200</td><td>$10 \cdot 200 = 2000$</td></tr></table>
          <p><b>Bước 2</b> — tương tự cho B.</p>
        focus: [1, "1.3", 2]
        say: "Bước hai, cửa hàng B có 10 đơn, trung bình 200 nghìn. Tổng tiền của B là 10 nhân 200, bằng 2000 nghìn. Làm tương tự như với A."
      - show: |
          <p><b>Bước 3</b> — gộp tử số và mẫu số rồi mới chia: $\frac{5000 + 2000}{100 + 10} = \frac{7000}{110} \approx \hl{63{,}64}$ nghìn.</p>
        say: "Bước ba, gộp tử số và mẫu số rồi mới chia. Tử số là 5000 cộng 2000 bằng 7000, mẫu số là 100 cộng 10 bằng 110, nên trung bình thật là 7000 chia 110, khoảng 63 phẩy 64 nghìn."
      - clear: true
        show: |
          <p><b>Bước 4</b> — so với cách sai: $\frac{50 + 200}{2} = 125$, gần gấp đôi con số thật.</p>
          <p>Cửa hàng B chỉ có 10 đơn nhưng được “một phiếu” ngang A với 100 đơn.</p>
        focus: [1, 2]
        say: "Bước bốn, so với cách sai, trung bình hai trung bình là 50 cộng 200 chia 2, bằng 125, gần gấp đôi con số thật. Cửa hàng B chỉ có 10 đơn nhưng được một phiếu ngang với A có 100 đơn."

  - id: check
    kind: check
    title: "Tự kiểm: cộng theo tỉ trọng"
    checks:
      - "round(100 / 110 * 50, 2) == 45.45 and round(10 / 110 * 200, 2) == 18.18 and round(100 / 110 * 50 + 10 / 110 * 200, 2) == 63.64"
      - "round(100 * (50 - 7000 / 110) + 10 * (200 - 7000 / 110), 9) == 0 and round(100 * (50 - 7000 / 110)) == -1364"
    steps:
      - show: |
          <table class="t"><tr><th>cửa hàng</th><th>tỉ trọng số đơn</th><th>tỉ trọng nhân trung bình</th></tr>
          <tr><td>A</td><td>$\frac{100}{110}$</td><td>$\frac{100}{110} \cdot 50 \approx 45{,}45$</td></tr>
          <tr><td>B</td><td>$\frac{10}{110}$</td><td>$\frac{10}{110} \cdot 200 \approx 18{,}18$</td></tr></table>
          <p>Cộng: $45{,}45 + 18{,}18 = 63{,}64$ ✓</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Kiểm bằng đường khác, ta không cộng tổng tiền mà nhân mỗi trung bình với tỉ trọng số đơn của nhóm đó. A chiếm 100 phần 110 số đơn, nhân 50 được khoảng 45 phẩy 45. B chiếm 10 phần 110, nhân 200 được khoảng 18 phẩy 18. Cộng lại được 63 phẩy 64, khớp với kết quả trên, nên trọng số đúng là số phần tử."
      - show: |
          <table class="t"><tr><th>phép thử cân bằng</th><th>số đơn nhân độ lệch</th></tr>
          <tr><td>A</td><td>$100 \cdot (50 - 63{,}64) \approx -1364$</td></tr>
          <tr><td>B</td><td>$10 \cdot (200 - 63{,}64) \approx +1364$</td></tr>
          <tr><td>tổng</td><td>0 ✓ (thử với 125 thì không cân)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Phép thử thứ hai là cân bằng, vì trung bình đúng phải làm tổng các độ lệch bằng 0. Phía A, 100 nhân âm 13 phẩy 64 được khoảng âm 1364. Phía B, 10 nhân 136 phẩy 36 được khoảng cộng 1364, nên hai phía triệt tiêu nhau. Thử với 125 thì phía A lệch quá nhiều, nên không cân."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, cả người mới lẫn người đã đi làm"
    checks:
      - "round(alg.weighted_mean([(1000, 0.02), (10, 0.5)]), 4) == 0.0248 and (0.02 + 0.5) / 2 == 0.26"
      - "round(alg.weighted_mean([(100, 50), (40, 200)]), 2) == 92.86 and 100 * 50 + 40 * 200 == 13000 and round((13000 / 140) / (7000 / 110) * 100 - 100) == 46"
      - "9 / 10 > 80 / 100 and 30 / 90 > 2 / 10 and round(30 / 90 * 100, 1) == 33.3 and 9 + 30 == 39 and 80 + 2 == 82 and (9 + 30) / (10 + 90) == 0.39 and round(82 / 110 * 100, 1) == 74.5 and 0.39 < 82 / 110"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Trung bình các tỉ lệ <b class="red">(nhóm nhỏ thổi phồng)</b>
          <br><span class="note">Trang 1: 1000 lượt xem, chuyển đổi 2%. Trang 2: 10 lượt, 50%. Trung bình hai tỉ lệ 26%; tỉ lệ thật $\frac{20 + 5}{1010} \approx 2{,}48\%$.</span></div>
        say: "Lỗi thứ nhất, lấy trung bình các tỉ lệ, nên nhóm nhỏ thổi phồng kết quả. Trang 1 có 1000 lượt xem, chuyển đổi 2 phần trăm. Trang 2 có 10 lượt, chuyển đổi 50 phần trăm. Trung bình hai tỉ lệ là 26 phần trăm, trong khi tỉ lệ thật là 25 chia 1010, khoảng 2 phẩy 48 phần trăm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lưu bảng tổng hợp chỉ có trung bình <b class="red">(mất khả năng gộp tiếp)</b>
          <br><span class="note">Bảng theo ngày chỉ ghi “trung bình mỗi đơn” thì không tính lại được trung bình tháng. Luôn lưu kèm tổng và số lượng.</span></div>
        say: "Lỗi thứ hai, lưu bảng tổng hợp chỉ có trung bình, nên mất khả năng gộp tiếp. Bảng theo ngày chỉ ghi trung bình mỗi đơn thì không tính lại được trung bình tháng. Hãy luôn lưu kèm tổng và số lượng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Gộp làm đảo chiều kết luận <b class="red">(nghịch lý Simpson)</b>
          <br><span class="note">Trong từng nhóm A tốt hơn B, nhưng gộp lại B tốt hơn — khi cơ cấu nhóm khác nhau. Luôn xem cả số theo nhóm, không chỉ con số gộp.</span></div>
          <table class="t"><tr><th>tỉ lệ mua (số minh hoạ)</th><th>trang A</th><th>trang B</th></tr>
          <tr><td>khách quen</td><td>$\frac{9}{10} = 90\%$</td><td>$\frac{80}{100} = 80\%$</td></tr>
          <tr><td>khách mới</td><td>$\frac{30}{90} \approx 33{,}3\%$</td><td>$\frac{2}{10} = 20\%$</td></tr>
          <tr><td>gộp lại</td><td>$\frac{39}{100} = 39\%$</td><td class="red">$\frac{82}{110} \approx 74{,}5\%$</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4", "2.4", 1]
        say: "Lỗi thứ ba, gộp làm đảo chiều kết luận, gọi là nghịch lý Simpson. Bảng so tỉ lệ mua của hai trang, chia theo khách quen và khách mới, với số minh hoạ. Với khách quen, A được 90 phần trăm, hơn B được 80 phần trăm. Với khách mới, A được khoảng 33 phẩy 3 phần trăm, cũng hơn B được 20 phần trăm. Vậy mà gộp lại, A chỉ có 39 trên 100, tức 39 phần trăm, còn B có 82 trên 110, khoảng 74 phẩy 5 phần trăm. Lý do là A nhận phần lớn khách mới, nhóm khó mua, còn B nhận phần lớn khách quen, nên cơ cấu khác nhau làm con số gộp đảo chiều. Hãy luôn xem cả số theo từng nhóm, không chỉ con số gộp."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Báo “giá trị đơn tăng” khi chỉ có <b>cơ cấu</b> thay đổi <b class="red">(lỗi của người đã đi làm)</b></div>
          <table class="t"><tr><th>tháng</th><th>A: số đơn, trung bình</th><th>B: số đơn, trung bình</th><th>trung bình chung</th></tr>
          <tr><td>1</td><td>100 đơn, 50</td><td>10 đơn, 200</td><td>$\frac{7000}{110} \approx 63{,}64$</td></tr>
          <tr><td>2</td><td>100 đơn, 50</td><td>40 đơn, 200</td><td>$\frac{5000 + 8000}{140} \approx 92{,}86$</td></tr></table>
          <p class="note">Con số chung tăng khoảng 46% mà <b>không cửa hàng nào</b> bán đơn đắt hơn — chỉ là B có nhiều đơn hơn. Người làm nghề tách hai phần: trung bình từng nhóm, và cơ cấu nhóm.</p>
        focus: [1, 2, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư là lỗi của người đã đi làm, báo giá trị đơn tăng khi chỉ có cơ cấu thay đổi. Bảng so hai tháng của cùng hai cửa hàng. Tháng 1 vẫn là 100 đơn của A và 10 đơn của B, trung bình chung khoảng 63 phẩy 64. Tháng 2, A giữ nguyên, B lên 40 đơn, tổng tiền là 5000 cộng 8000 bằng 13 nghìn, chia 140 được khoảng 92 phẩy 86. Con số chung tăng khoảng 46 phần trăm, mà không cửa hàng nào bán đơn đắt hơn, chỉ là B có nhiều đơn hơn. Vì vậy người làm nghề luôn tách hai phần, trung bình của từng nhóm, và cơ cấu các nhóm."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.weighted_mean([(30, 8), (10, 4)]), 2) == 7.0 and (8 + 4) / 2 == 6"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Lớp 1 có 30 học sinh điểm trung bình 8, lớp 2 có 10 học sinh điểm trung bình 4. Điểm trung bình cả khối?</td></tr>
          <tr><td>2</td><td>Nếu chỉ lấy trung bình hai điểm lớp thì ra bao nhiêu, lệch về phía nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, lớp 1 có 30 học sinh điểm trung bình 8, lớp 2 có 10 học sinh điểm trung bình 4. Điểm trung bình cả khối là bao nhiêu? Câu hai, nếu chỉ lấy trung bình hai điểm lớp thì ra bao nhiêu, và lệch về phía nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
