id: L10
course: DAN
series: "DAN · Phân tích dữ liệu"
title: "Bài 10 — Tỉ lệ trên mẫu nhỏ: khoảng tin cậy và xếp hạng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dan.yaml L10; audit/dan/verify_dan.py L10; E. B. Wilson, Probable Inference, the Law of Succession, and Statistical Inference (JASA 1927); L. Brown, T. Cai, A. DasGupta, Interval Estimation for a Binomial Proportion (Statistical Science 2001); DSC bài 8; bài 5"
assumes: [arith, frac, sqrt, cdot, approx]
# Quy ước: khoảng Wilson 95% (z = 1,96) cho tỉ lệ k/n (alg.wilson): tâm (p + z²/2n)/(1 + z²/n), nửa độ rộng z·√(p(1−p)/n + z²/4n²)/(1 + z²/n).
#   Tên Wilson chỉ trên màn hình; lời đọc “khoảng tin cậy cho tỉ lệ”. Số liệu là SỐ MINH HOẠ.
objectives:
  - "Tính khoảng tin cậy cho một tỉ lệ"
  - "Xếp hạng theo cận dưới thay vì tỉ lệ thô"
  - "Biết vì sao công thức xấp xỉ chuẩn hỏng ở mẫu nhỏ"
asr_reviewed:
  - {sentence: "A có 2 mua trên 2 xem, tỉ lệ thô 100 phần trăm, khoảng tin cậy từ 0 phẩy 342 tới 1.", reason: "ASR chép “À, có 2 mua trên 2 xem tỷ lệ thô 100%, khoảng tiên cậy từ 0,342 tới 1.” (0.846): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; “tỉ” ASR viết chính tả “tỷ” (cùng âm); “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; lệch âm/thanh thuần Việt: tin/tiên, không (trong “không phẩy” → “”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sản phẩm 100% chuyển đổi đứng đầu bảng"
    checks:
      - "[round(x, 3) for x in alg.wilson(2, 2)] == [0.342, 1.0]"
    steps:
      - show: |
          <p>Bảng “sản phẩm chuyển đổi tốt nhất tuần” xếp hạng nhất một món có <b>2 lượt xem, 2 lượt mua</b> — 100%. Hạng mười là món 150 mua trên 1000 xem — 15%. Ai đặt cược vào món thứ nhất? Với 2 lượt, tỉ lệ thật có thể chỉ khoảng 34%.</p>
          <div class="box key">Hôm nay: <b>tỉ lệ trên mẫu nhỏ</b> — khoảng tin cậy cho tỉ lệ, và xếp hạng cho công bằng.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, bảng sản phẩm chuyển đổi tốt nhất tuần xếp hạng nhất một món có 2 lượt xem và 2 lượt mua, tức 100 phần trăm. Hạng mười là món có 150 lượt mua trên 1000 lượt xem, tức 15 phần trăm. Ai sẽ đặt cược vào món thứ nhất? Với 2 lượt, tỉ lệ thật có thể chỉ khoảng 34 phần trăm. Hôm nay ta học tỉ lệ trên mẫu nhỏ, khoảng tin cậy cho tỉ lệ, và cách xếp hạng cho công bằng."

  - id: prereq
    kind: prereq
    title: "Ôn lại: sai số chuẩn của một tỉ lệ, và khoảng 95%"
    checks:
      - "round(1.96 * math.sqrt(0.5 * 0.5 / 400), 3) == 0.049 and round(math.sqrt(0.0025), 9) == 0.05"
      - "round(math.sqrt(0.5 * 0.5 / 100), 9) == 0.05 and round(1.96 * 0.05, 3) == 0.098 and round(0.5 - 0.098, 3) == 0.402 and round(0.5 + 0.098, 3) == 0.598"
    steps:
      - show: |
          <table class="t"><tr><th>tỉ lệ 50 trên 100</th><th>tính</th></tr>
          <tr><td>tỉ lệ quan sát</td><td>$p = \frac{50}{100} = 0{,}5$</td></tr>
          <tr><td>sai số chuẩn</td><td>$\sqrt{\frac{0{,}5 \cdot 0{,}5}{100}} = \sqrt{0{,}0025} = 0{,}05$</td></tr>
          <tr><td>khoảng 95%</td><td>$0{,}5 \pm 1{,}96 \cdot 0{,}05 = 0{,}5 \pm 0{,}098$, tức [0,402; 0,598]</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước hết, ôn lại khoảng tin cậy ở khoá Khoa học dữ liệu, với 50 lượt mua trên 100 lượt xem. Tỉ lệ quan sát p là 50 chia 100, bằng 0 phẩy 5. Sai số chuẩn của tỉ lệ là căn của p nhân 1 trừ p, chia n, ở đây bằng căn của 0 phẩy 0025, tức 0 phẩy 05. Khoảng 95 phần trăm là p cộng trừ 1 phẩy 96 lần sai số chuẩn, tức 0 phẩy 5 cộng trừ 0 phẩy 098, từ 0 phẩy 402 tới 0 phẩy 598."
      - show: |
          <p>Sai số chuẩn có $n$ ở mẫu số: $n$ càng lớn, khoảng càng hẹp. Với 100 lượt, nửa độ rộng là 0,098; với 4 lần số lượt, nửa độ rộng chỉ còn một nửa, vì $\sqrt{4} = 2$.</p>
        say: "Điểm cần nhớ, sai số chuẩn có n ở mẫu số trong dấu căn, nên n càng lớn thì khoảng càng hẹp. Với 100 lượt, nửa độ rộng là 0 phẩy 098, còn nếu có gấp 4 lần số lượt, nửa độ rộng chỉ còn một nửa, vì căn của 4 bằng 2."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: khoảng tin cậy cho tỉ lệ"
    steps:
      - show: |
          <p>Tỉ lệ quan sát $p = \frac{k}{n}$. <b>Khoảng tin cậy 95%</b>: khoảng các tỉ lệ thật phù hợp với dữ liệu ($z = 1{,}96$).</p>
          <table class="t"><tr><th>công thức</th><th>vấn đề</th></tr>
          <tr><td>xấp xỉ chuẩn: $p \pm z \sqrt{\frac{p \cdot (1 - p)}{n}}$</td><td>với $p = 1$ (2/2) ra độ rộng <b>0</b> — “chắc chắn 100%” từ 2 lượt</td></tr>
          <tr><td><b>khoảng Wilson</b> (1927)</td><td>dịch tâm về 0,5 và mở rộng khi n nhỏ — luôn nằm trong [0; 1]</td></tr></table>
          <p><b>Xếp hạng theo cận dưới</b>: mục nào mà ngay cả trong trường hợp xấu vẫn cao thì đứng trên.</p>
        focus: [1, 1, 2, "2.2", "2.2", "2.3", 3]
        say: "Tỉ lệ quan sát p bằng k chia n. Khoảng tin cậy 95 phần trăm là khoảng các tỉ lệ thật phù hợp với dữ liệu, với z bằng 1 phẩy 96. Bảng so hai công thức. Công thức xấp xỉ chuẩn lấy p cộng trừ z nhân căn của p nhân 1 trừ p chia n. Với p bằng 1 như 2 trên 2, nó ra độ rộng 0, tức chắc chắn 100 phần trăm chỉ từ 2 lượt. Khoảng tin cậy đề xuất năm 1927 dịch tâm về phía 0 phẩy 5 và mở rộng khi n nhỏ, nên luôn nằm trong đoạn từ 0 tới 1. Xếp hạng theo cận dưới nghĩa là mục nào ngay cả trong trường hợp xấu vẫn cao thì đứng trên."

  - id: intuition
    kind: intuition
    title: "Ít dữ liệu, khoảng dài; nhiều dữ liệu, khoảng ngắn"
    checks:
      - "[[round(x, 3) for x in alg.wilson(k, n)] for k, n in ((2, 2), (1, 1), (150, 1000))] == [[0.342, 1.0], [0.207, 1.0], [0.129, 0.173]]"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g fill="#1f2937" font-size="22"><line x1="330" y1="290" x2="1280" y2="290" stroke="#6b7280" stroke-width="2"/><line x1="330" y1="284" x2="330" y2="296" stroke="#6b7280" stroke-width="2"/><text x="330" y="325" text-anchor="middle" font-size="20">0</text><line x1="568" y1="284" x2="568" y2="296" stroke="#6b7280" stroke-width="2"/><text x="568" y="325" text-anchor="middle" font-size="20">0,25</text><line x1="805" y1="284" x2="805" y2="296" stroke="#6b7280" stroke-width="2"/><text x="805" y="325" text-anchor="middle" font-size="20">0,5</text><line x1="1042" y1="284" x2="1042" y2="296" stroke="#6b7280" stroke-width="2"/><text x="1042" y="325" text-anchor="middle" font-size="20">0,75</text><line x1="1280" y1="284" x2="1280" y2="296" stroke="#6b7280" stroke-width="2"/><text x="1280" y="325" text-anchor="middle" font-size="20">1</text><text x="40" y="78">A: 2 trên 2</text><line x1="655" y1="70" x2="1280" y2="70" stroke="#eb6834" stroke-width="10" stroke-linecap="round"/><circle cx="1280" cy="70" r="9" fill="#1f2937"/><text x="655" y="54" text-anchor="middle" fill="#059669" font-size="20">0,342</text><text x="40" y="153">C: 1 trên 1</text><line x1="526" y1="145" x2="1280" y2="145" stroke="#eb6834" stroke-width="10" stroke-linecap="round"/><circle cx="1280" cy="145" r="9" fill="#1f2937"/><text x="526" y="129" text-anchor="middle" fill="#059669" font-size="20">0,207</text><text x="40" y="228">B: 150 trên 1000</text><line x1="453" y1="220" x2="495" y2="220" stroke="#2a78d6" stroke-width="10" stroke-linecap="round"/><circle cx="472" cy="220" r="9" fill="#1f2937"/><text x="453" y="204" text-anchor="middle" fill="#059669" font-size="20">0,129</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ khoảng tin cậy của ba sản phẩm trên đoạn từ 0 tới 1, chấm đen là tỉ lệ thô. A và C chỉ có 2 lượt và 1 lượt, nên thanh cam rất dài, kéo từ khoảng một phần ba hay một phần năm tới tận 1. B có 1000 lượt, nên thanh xanh ngắn, nằm gọn quanh 15 phần trăm. Con số lục ở đầu trái mỗi thanh là cận dưới, tức mức mà ngay cả trong trường hợp xấu tỉ lệ thật vẫn khó thấp hơn."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ba sản phẩm, ba khoảng"
    checks:
      - "[[round(x, 3) for x in alg.wilson(k, n)] for k, n in ((2, 2), (1, 1), (150, 1000))] == [[0.342, 1.0], [0.207, 1.0], [0.129, 0.173]]"
      - "(lambda p, n: p - 1.96 * math.sqrt(p * (1 - p) / n))(1.0, 2) == 1.0"
      - "round(1.96 ** 2, 4) == 3.8416 and round(1 + 1.96 ** 2 / 2, 4) == 2.9208 and round((1 + 1.96 ** 2 / 4) / 2.9208, 3) == 0.671 and round(1.96 * math.sqrt(1.96 ** 2 / 16) / 2.9208, 3) == 0.329"
    steps:
      - show: |
          <table class="t"><tr><th>A: 2 mua / 2 xem, $p = 1$, $n = 2$</th><th>tính</th></tr>
          <tr><td>mẫu chung $1 + \frac{z^2}{n}$</td><td>$1 + \frac{3{,}8416}{2} = 2{,}9208$</td></tr>
          <tr><td>tâm, dịch về phía 0,5</td><td>$\frac{1 + 3{,}8416 / 4}{2{,}9208} \approx 0{,}671$</td></tr>
          <tr><td>nửa độ rộng</td><td>$\frac{1{,}96 \cdot \sqrt{3{,}8416 / 16}}{2{,}9208} \approx 0{,}329$</td></tr></table>
          <p><b>Bước 1</b> — khoảng của A: $0{,}671 \pm 0{,}329 = [0{,}342;\ 1]$.</p>
        introduces: [power]
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Bước một, tính khoảng cho A, có 2 mua trên 2 xem, nên p bằng 1 và n bằng 2. Mẫu chung là 1 cộng z bình phương chia n, với z bình phương bằng 3 phẩy 8416, được 2 phẩy 9208. Tâm của khoảng không nằm ở 1 mà dịch về phía 0 phẩy 5, còn khoảng 0 phẩy 671. Nửa độ rộng khoảng 0 phẩy 329, vì vẫn còn rất nhiều điều chưa biết với chỉ 2 lượt. Vậy khoảng của A là 0 phẩy 671 cộng trừ 0 phẩy 329, từ 0 phẩy 342 tới 1."
      - show: |
          <table class="t"><tr><th>sản phẩm</th><th>mua / xem</th><th>tỉ lệ thô</th><th>khoảng 95%</th></tr>
          <tr><td>A</td><td>2 / 2</td><td>100%</td><td>[0,342; 1]</td></tr>
          <tr><td>C</td><td>1 / 1</td><td>100%</td><td>[0,207; 1]</td></tr>
          <tr><td>B</td><td>150 / 1000</td><td>15%</td><td>$\hl{[0{,}129; 0{,}173]}$</td></tr></table>
          <p><b>Bước 2</b> — làm tương tự cho C và B.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Bước hai, làm tương tự cho cả ba sản phẩm. A có 2 mua trên 2 xem, tỉ lệ thô 100 phần trăm, khoảng tin cậy từ 0 phẩy 342 tới 1. C có 1 trên 1, cũng 100 phần trăm, khoảng từ 0 phẩy 207 tới 1. B có 150 trên 1000, 15 phần trăm, khoảng từ 0 phẩy 129 tới 0 phẩy 173. Hai khoảng đầu rất dài, còn khoảng của B rất ngắn."
      - clear: true
        show: |
          <p><b>Bước 3</b> — xếp theo cận dưới: A (0,342) &gt; C (0,207) &gt; B (0,129).</p>
        say: "Bước ba, xếp theo cận dưới, A có 0 phẩy 342 đứng trên C có 0 phẩy 207, C đứng trên B có 0 phẩy 129."
      - show: |
          <p><b>Bước 4</b> — nhưng khoảng của A và C rất rộng: “tốt hơn B” chưa chắc. Cần thêm dữ liệu cho A, C trước khi kết luận.</p>
        say: "Bước bốn, khoảng của A và C rất rộng, nên tốt hơn B là chưa chắc. Cần thêm dữ liệu cho A và C trước khi kết luận."

  - id: check
    kind: check
    title: "Tự kiểm: thay ngược, và so với công thức quen thuộc khi n lớn"
    checks:
      - "round((1 - 0.342) ** 2, 3) == 0.433 and round(1.96 ** 2 * 0.342 * 0.658 / 2, 3) == 0.432"
      - "round(math.sqrt(0.15 * 0.85 / 1000), 4) == 0.0113 and round(0.15 - 1.96 * math.sqrt(0.15 * 0.85 / 1000), 3) == 0.128 and round(0.15 + 1.96 * math.sqrt(0.15 * 0.85 / 1000), 3) == 0.172"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>cận dưới của A là tỉ lệ $P$ làm $(p - P)^2 = \frac{z^2 P (1 - P)}{n}$</td><td>$(1 - 0{,}342)^2 \approx 0{,}433$; $\frac{3{,}8416 \cdot 0{,}342 \cdot 0{,}658}{2} \approx 0{,}432$</td><td>gần bằng nhau ✓</td></tr>
          <tr><td>B có $n = 1000$ lớn: công thức xấp xỉ chuẩn</td><td>$0{,}15 \pm 1{,}96 \cdot 0{,}0113$</td><td>[0,128; 0,172] ≈ [0,129; 0,173] ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng hai đường khác. Khoảng này được định nghĩa là các tỉ lệ thật P sao cho bình phương của p trừ P bằng z bình phương nhân P nhân 1 trừ P, chia n. Thay ngược P bằng 0 phẩy 342 cho A, vế trái khoảng 0 phẩy 433, vế phải khoảng 0 phẩy 432, gần bằng nhau, nên cận dưới đúng. Với B có 1000 lượt, công thức xấp xỉ chuẩn quen thuộc cho 0 phẩy 15 cộng trừ 1 phẩy 96 nhân 0 phẩy 0113. Kết quả từ 0 phẩy 128 tới 0 phẩy 172, gần như trùng khoảng ở trên, vì khi n lớn hai cách cho cùng một đáp số."


  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, cả người mới lẫn người đã đi làm"
    checks:
      - "round(0.05 - 1.96 * math.sqrt(0.05 * 0.95 / 20), 3) == -0.046 and [round(x, 3) for x in alg.wilson(0, 5)] == [0.0, 0.434]"
      - "[[round(x, 3) for x in alg.wilson(k, n)] for k, n in ((150, 1000), (160, 1000))] == [[0.129, 0.173], [0.139, 0.184]]"
      - "[round(alg.wilson(k, n)[0], 3) for k, n in ((3, 3), (600, 1000), (30, 40))] == [0.438, 0.569, 0.598]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Xếp hạng theo tỉ lệ thô <b class="red">(mẫu nhỏ chiếm đầu và cuối bảng)</b>
          <br><span class="note">Món 1/1 đứng đầu, món 0/1 đứng cuối — chỉ do may rủi. Xếp theo cận dưới, hoặc chỉ xếp các mục có đủ số lượt tối thiểu.</span></div>
        say: "Lỗi thứ nhất, xếp hạng theo tỉ lệ thô, nên các mẫu nhỏ chiếm đầu và cuối bảng. Món 1 trên 1 đứng đầu, món 0 trên 1 đứng cuối, chỉ do may rủi. Hãy xếp theo cận dưới, hoặc chỉ xếp các mục có đủ số lượt tối thiểu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng công thức xấp xỉ chuẩn cho mẫu nhỏ <b class="red">(khoảng rộng 0 hay âm)</b>
          <br><span class="note">2/2 và 0/5 cho khoảng rộng 0 ([1; 1] và [0; 0]); 1/20 cho cận dưới −0,046 — một tỉ lệ âm. Khoảng Wilson: 0/5 cho [0; 0,434].</span></div>
        say: "Lỗi thứ hai, dùng công thức xấp xỉ chuẩn cho mẫu nhỏ, nên khoảng có độ rộng 0 hay cận âm. Với 2 trên 2 hay 0 trên 5, khoảng có độ rộng 0, còn 1 trên 20 cho cận dưới âm 0 phẩy 046, một tỉ lệ âm. Hãy dùng khoảng tin cậy năm 1927 ở trên, với 0 trên 5 cho khoảng từ 0 tới 0 phẩy 434."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> So hai tỉ lệ bằng mắt <b class="red">(khác biệt chỉ là nhiễu)</b>
          <br><span class="note">Tuần này 16%, tuần trước 15% trên 1000 lượt: khoảng chồng lên nhau gần hết. Kiểm định hai tỉ lệ (ở khoá Khoa học dữ liệu) trước khi gọi đó là “tăng”.</span></div>
        say: "Lỗi thứ ba, so hai tỉ lệ bằng mắt, trong khi khác biệt chỉ là nhiễu. Tuần này 16 phần trăm, tuần trước 15 phần trăm, trên 1000 lượt mỗi tuần, thì hai khoảng chồng lên nhau gần hết. Hãy kiểm định hai tỉ lệ trước khi gọi đó là tăng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Để thứ hạng quyết định luôn ai được hiển thị <b class="red">(mục mới không bao giờ có dữ liệu)</b>
          <br><span class="note">Lỗi của người đã đi làm: nếu chỉ mục đứng đầu theo cận dưới được hiển thị, mục mới ít lượt sẽ mãi đứng dưới.</span></div>
          <table class="t"><tr><th>mục</th><th>mua / xem</th><th>cận dưới</th></tr>
          <tr><td>N (cũ)</td><td>600 / 1000</td><td>0,569</td></tr>
          <tr><td>M (mới), hôm nay</td><td>3 / 3</td><td class="red">0,438 → đứng dưới, không được hiển thị</td></tr>
          <tr><td>M sau khi được cho thêm lượt</td><td>30 / 40</td><td>0,598 → vượt N ✓</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Lỗi thứ tư là lỗi của người đã đi làm, để thứ hạng quyết định luôn ai được hiển thị. Nếu chỉ mục đứng đầu theo cận dưới được hiển thị, mục mới ít lượt sẽ mãi đứng dưới. Bảng theo dõi hai mục. Mục cũ N có 600 trên 1000, cận dưới 0 phẩy 569. Mục mới M hôm nay có 3 trên 3, cận dưới chỉ 0 phẩy 438, nên không được hiển thị, và không bao giờ có thêm dữ liệu. Nếu dành riêng một phần nhỏ lượt hiển thị để thử mục mới, M lên 30 trên 40, cận dưới 0 phẩy 598, vượt qua N."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[[round(x, 3) for x in alg.wilson(k, n)] for k, n in ((8, 10), (70, 100))] == [[0.49, 0.943], [0.604, 0.781]]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Quảng cáo X: 8 bấm / 10 hiển thị; quảng cáo Y: 70 / 100. Khoảng Wilson của X là [0,49; 0,943], của Y là [0,604; 0,781]. Tỉ lệ thô và cận dưới của mỗi cái?</td></tr>
          <tr><td>2</td><td>Xếp theo cận dưới, cái nào đứng trên?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, quảng cáo X có 8 lượt bấm trên 10 lượt hiển thị, quảng cáo Y có 70 trên 100. Khoảng của X là từ 0 phẩy 49 tới 0 phẩy 943, của Y là từ 0 phẩy 604 tới 0 phẩy 781. Tỉ lệ thô và cận dưới của mỗi cái là bao nhiêu? Câu hai, xếp theo cận dưới thì cái nào đứng trên? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>quảng cáo</th><th>tỉ lệ thô</th><th>cận dưới (số đầu của khoảng)</th></tr>
          <tr><td>X</td><td>$\frac{8}{10} = 80\%$</td><td>0,49</td></tr>
          <tr><td>Y</td><td>$\frac{70}{100} = 70\%$</td><td>$\hl{0{,}604}$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Đáp án câu một, tỉ lệ thô là số bấm chia số hiển thị, còn cận dưới là số đầu của khoảng. X có tỉ lệ thô 8 chia 10, bằng 80 phần trăm, và cận dưới 0 phẩy 49. Y có tỉ lệ thô 70 chia 100, bằng 70 phần trăm, và cận dưới 0 phẩy 604."
      - show: |
          <p>② So cận dưới: $0{,}604 \gt 0{,}49$ → <b>Y đứng trên</b> dù tỉ lệ thô thấp hơn — Y có nhiều bằng chứng hơn (100 lượt so với 10).</p>
        say: "Câu hai, so cận dưới, 0 phẩy 604 lớn hơn 0 phẩy 49, nên Y đứng trên dù tỉ lệ thô thấp hơn, vì Y có nhiều bằng chứng hơn, 100 lượt so với 10."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tỉ lệ thô từ ít dữ liệu: rất nhiễu</span><span class="a">→</span>
          <span class="n">khoảng Wilson, không dùng xấp xỉ chuẩn khi n nhỏ</span><span class="a">→</span>
          <span class="n">xếp theo cận dưới, hoặc đặt số lượt tối thiểu</span><span class="a">→</span>
          <span class="n">so hai tỉ lệ bằng kiểm định</span></div>
        say: "Tổng kết lại, tỉ lệ thô từ ít dữ liệu rất nhiễu, nên hãy dùng khoảng tin cậy năm 1927 thay cho xấp xỉ chuẩn khi n nhỏ. Xếp theo cận dưới, hoặc đặt số lượt tối thiểu, và so hai tỉ lệ bằng kiểm định."
      - show: |
          <div class="box key"><b>Tư duy:</b> một tỉ lệ luôn đi kèm câu hỏi “<b>trên bao nhiêu</b>?” — mẫu số quyết định ta tin con số đó tới đâu.</div>
        say: "Điều cần mang theo, một tỉ lệ luôn đi kèm câu hỏi trên bao nhiêu, vì mẫu số quyết định ta tin con số đó tới đâu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>bảng điều khiển chỉ số</b> và cảnh báo đáng tin.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta học bảng điều khiển chỉ số và cảnh báo đáng tin. Hẹn gặp bạn ở bài tiếp theo."
