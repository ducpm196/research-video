      (i % soBan == 0) roi++;</code></td><td><code>%</code>: phần dư; dư 0 thì <code>roi++</code>
      tăng đếm thêm 1: cứ soBan yêu cầu có một yêu cầu về bản số 0</td><td>soBan =
      3: i = 0, 3, 6…</td></tr><tr><td><code>for (long r : new long[] {100, 10_000,
