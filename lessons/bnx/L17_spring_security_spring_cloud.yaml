      font-size="24" text-anchor="start" fill="#16a34a">mã tốt, đủ quyền: qua cả 14
      trạm, tới dịch vụ, 200</text><text x="750" y="475" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">Xác thực (trạm 8) đứng trước phân quyền (trạm
      14): phải biết ai gọi rồi mới xét cho hay không</text></svg></div>'
    clear: true
    say: Hình này là mười bốn trạm của chuỗi bộ lọc, đứng trước dịch vụ. Yêu cầu đi
      từ trạm một sang phải, qua hết mới tới dịch vụ. Yêu cầu không mang mã vẫn qua
      được trạm đọc mã số tám, nhưng trạm kiểm quyền số mười bốn ném lỗi, và trạm
      dịch lỗi số mười ba trả bốn trăm lẻ một. Mã hỏng, tức sai chữ ký hoặc hết hạn,
      thì chính trạm tám trả bốn trăm lẻ một ngay, không đi tiếp. Mã tốt nhưng thiếu
      quyền thì trạm mười bốn ném lỗi, và lần này trạm mười ba trả bốn trăm lẻ ba,
      vì đã biết người gọi là ai. Trạm xác thực đứng trước trạm phân quyền, vì phải
      biết ai gọi rồi mới xét cho hay không.
  - show: '<div><svg width="1500" height="520" viewBox="0 0 1500 520" font-family="sans-serif"><defs><marker
