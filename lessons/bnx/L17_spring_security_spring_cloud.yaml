id: L17
course: BNX
series: BNX · Backend ngân hàng mở rộng theo JD
title: 'Bài 17 — Spring Security và Spring Cloud: chuỗi bộ lọc, cổng và khám phá dịch
  vụ'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: 'curriculum/bnx.yaml L17; audit/bnx/verify_bnx.py L17; audit/bnx/sources_l17.md:
  hướng dẫn Spring Security 7.1.2 (Architecture, OAuth2 Resource Server, CSRF), Spring
  Cloud Gateway 5.0.4, Spring Cloud Commons 5.0.4 (LoadBalancer), Spring Cloud Consul
  5.0.4, Spring Cloud Config 5.0.6 (đọc 2026-11-11); Spring Security 7.1.2 chạy thật
  trên Temurin JDK 21.0.13; phần chia tải là mô phỏng'
assumes: []
objectives:
- Lần theo một yêu cầu qua chuỗi bộ lọc bảo mật và nói bộ lọc nào trả 401, bộ lọc
  nào trả 403
- Cấu hình một dịch vụ kiểm mã truy cập như máy chủ tài nguyên
- Giải thích vai trò của cổng, cấu hình tập trung và sổ đăng ký dịch vụ trong Spring
  Cloud
- Tính cách cổng chia tải khi một bản dịch vụ trượt kiểm sức khoẻ
