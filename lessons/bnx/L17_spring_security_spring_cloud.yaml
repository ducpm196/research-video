scenes:
- id: hook
  kind: hook
  title: 'Ba yêu cầu tới cùng một địa chỉ: 401, 403 và 200'
  checks:
  - alg.bnx_l17_status('GET', None, 'han_muc') == 401
  - 'alg.bnx_l17_status(''GET'', {''sig'': True, ''expired'': False, ''scopes'': [''so_du'']},
    ''han_muc'') == 403'
  - 'alg.bnx_l17_status(''GET'', {''sig'': True, ''expired'': False, ''scopes'': [''so_du'',
    ''han_muc'']}, ''han_muc'') == 200'
  - alg.bnx_l17_round_robin([True, False, True], 100) == [50, 0, 50]
  - sum([True, False, True]) == 3 - 1 == 2
  steps:
  - show: '<p>Dịch vụ hạn mức của một ngân hàng nhận <b>ba yêu cầu</b> tới cùng một
      địa chỉ <code>/han-muc</code>:</p>

      <div class="box key">Yêu cầu không mang mã truy cập: bị chặn, nhận <b>401</b>.
      Yêu cầu có mã hợp lệ nhưng thiếu quyền: nhận <b>403</b>.

      Yêu cầu đủ quyền: nhận <b>200</b>.<br>Ai chặn, chặn ở đâu, và vì sao hai lần
      từ chối lại mang hai con số khác nhau?</div>

      '
    focus:
    - 1
    - 2
    - 2
    say: Chào bạn, dịch vụ hạn mức của một ngân hàng nhận ba yêu cầu tới cùng một
      địa chỉ. Yêu cầu không mang mã truy cập bị chặn và nhận mã bốn trăm lẻ một,
      còn yêu cầu có mã hợp lệ nhưng thiếu quyền thì nhận bốn trăm lẻ ba. Chỉ yêu
      cầu đủ quyền mới nhận mã hai trăm, vậy ai chặn, chặn ở đâu, và vì sao hai lần
      từ chối mang hai con số khác nhau?
  - show: '<p>Dịch vụ ấy chạy <b>ba bản</b> giống nhau. Một bản <b>trượt kiểm sức
      khoẻ</b>.</p>

      $$100 \text{ yêu cầu chia xoay vòng cho } 3 - 1 = 2 \text{ bản còn lại}: \quad
      100 : 2 = \hl{50} \text{ yêu cầu mỗi bản}$$

      <span class=''note''>Điều kiện: sổ chỉ trả các bản khoẻ, hoặc bộ chia tải tự
      lọc. Mặc định không đủ; bước 7 ở phần suy ra nói rõ cách bật.</span>

      '
    focus:
    - 1
    - 2
    - 3
    say: Dịch vụ ấy chạy ba bản giống nhau, và một bản vừa trượt kiểm sức khoẻ. Một
      trăm yêu cầu khi đó được chia xoay vòng cho hai bản còn lại, nên mỗi bản nhận
      năm mươi yêu cầu, vì bản hỏng không được giao việc. Điều này chỉ đúng khi sổ
      chỉ trả các bản khoẻ hoặc bộ chia tải tự lọc, mà mặc định chưa đủ, bước bảy
      sẽ nói rõ cách bật.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>ai
      chặn yêu cầu</td><td><b>chuỗi bộ lọc</b> của Spring Security: nhiều trạm nối
      tiếp đứng trước dịch vụ</td></tr><tr><td>dịch vụ kiểm mã truy cập thế nào</td><td>cấu
      hình nó thành <b>máy chủ tài nguyên</b>: kiểm chữ ký, hạn, rồi quyền</td></tr><tr><td>ai
      biết bản nào còn sống</td><td><b>Spring Cloud</b>: cổng, sổ đăng ký dịch vụ
      có kiểm sức khoẻ, cấu hình tập trung</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Hôm nay ta trả lời ba câu, ai chặn yêu cầu, đó là chuỗi bộ lọc bảo mật của
      Spring, gồm nhiều trạm nối tiếp đứng trước dịch vụ. Dịch vụ kiểm mã truy cập
      thế nào, đó là khi ta cấu hình nó thành một máy chủ tài nguyên. Và ai biết bản
      nào còn sống để chia việc, đó là cổng và sổ đăng ký dịch vụ của Spring Cloud.
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l17_authorities('so_du han_muc') == ['SCOPE_so_du', 'SCOPE_han_muc']
  - alg.bnx_l17_round_robin([True, False, True], 100) == [50, 0, 50]
  - alg.bnx_l17_round_robin([True, True, True], 100) == [34, 33, 33]
  - sum(alg.bnx_l17_round_robin([True] * 3, 100)) == 100
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      mã truy cập</td><td>chuỗi có <b>chữ ký</b> do máy chủ cấp mã phát; mang hạn
      dùng và <b>phạm vi quyền</b> (scope)</td><td>scope <code>so_du han_muc</code>:
      2 quyền, cách nhau một dấu cách</td></tr><tr><td>② mã trạng thái</td><td>con
      số máy chủ trả về cho mỗi yêu cầu</td><td>200: xong; 401: chưa xác thực; 403:
      bị cấm</td></tr><tr><td>③ bean</td><td>đối tượng do Spring tạo và giữ; ta khai
      bằng nhãn <code>@Bean</code></td><td>một bean giữ luật bảo mật, một bean kiểm
      chữ ký</td></tr><tr><td>④ bản dịch vụ</td><td>một tiến trình đang chạy của cùng
      một dịch vụ; nhiều bản để chịu tải và chịu lỗi</td><td>3 bản, 1 bản hỏng: còn
      3 − 1 = 2 bản phục vụ</td></tr><tr><td>⑤ xác thực và phân quyền</td><td>xác
      thực: biết người gọi là ai; phân quyền: xét người đó có được làm việc này không</td><td>mã
      hỏng là lỗi xác thực; mã tốt mà thiếu quyền là lỗi phân quyền</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: 'Trước hết ta cần hiểu năm điều, thứ nhất, mã truy cập là một chuỗi có chữ
      ký do máy chủ cấp mã phát ra, mang hạn dùng và phạm vi quyền. Thứ hai, mã trạng
      thái là con số máy chủ trả về cho mỗi yêu cầu: hai trăm là xong, bốn trăm lẻ
      một là chưa xác thực, bốn trăm lẻ ba là bị cấm. Thứ ba, Spring tự tạo và giữ
      các đối tượng cho ta, và ta khai chúng bằng một nhãn đặt trên hàm. Thứ tư, bản
      dịch vụ là một tiến trình đang chạy của cùng một dịch vụ, người ta chạy nhiều
      bản để chịu tải và chịu lỗi. Thứ năm, xác thực là biết người gọi là ai, còn
      phân quyền là xét người đó có được làm việc này hay không.'
  - show: '<p>Làm thử: 3 bản đăng ký, 1 bản hỏng, 100 yêu cầu chia đều.</p>

      $$3 - 1 = 2 \text{ bản}; \qquad 100 : 2 = \hl{50} \text{ yêu cầu mỗi bản}; \qquad
      \text{còn đủ 3 bản thì } 100 = 34 + 33 + 33$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Làm thử ngay với ba bản đăng ký, một bản hỏng. Còn hai bản, nên một trăm
      yêu cầu chia đều thì mỗi bản nhận năm mươi. Nếu còn đủ ba bản thì một trăm không
      chia hết cho ba, nên bản đầu nhận ba mươi tư, hai bản sau nhận ba mươi ba.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l17_authorities('han_muc') == ['SCOPE_han_muc']
  steps:
  - show: '<table class=''t''><tr><th>tên trong Spring Security</th><th>nghĩa</th></tr><tr><td>Filter</td><td><b>bộ
      lọc</b>, một trạm: nhận yêu cầu, làm một việc, rồi chuyển tiếp hoặc trả lời
      luôn</td></tr><tr><td>SecurityFilterChain</td><td><b>chuỗi bộ lọc bảo mật</b>:
      danh sách trạm có thứ tự mà yêu cầu phải đi qua</td></tr><tr><td>BearerTokenAuthenticationFilter</td><td><b>trạm
      đọc mã</b>: lấy mã truy cập trong yêu cầu và kiểm nó</td></tr><tr><td>AuthorizationFilter</td><td><b>trạm
      kiểm quyền</b>: so quyền của người gọi với luật của đường dẫn</td></tr><tr><td>ExceptionTranslationFilter</td><td><b>trạm
      dịch lỗi</b>: đổi lỗi của trạm kiểm quyền thành 401 hoặc 403</td></tr><tr><td>SCOPE_han_muc</td><td>quyền
      sinh từ phạm vi <code>han_muc</code> trong mã; tiền tố <code>SCOPE_</code> do
      Spring thêm</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: 'Bảng này giải mã các tên của phần bảo mật. Bộ lọc là một trạm: nó nhận yêu
      cầu, làm một việc, rồi chuyển tiếp hoặc trả lời luôn. Chuỗi bộ lọc bảo mật là
      danh sách trạm có thứ tự mà mọi yêu cầu phải đi qua. Trạm đọc mã có nhiệm vụ
      lấy mã truy cập trong yêu cầu và kiểm nó. Trạm kiểm quyền thì so quyền của người
      gọi với luật của đường dẫn. Trạm dịch lỗi đổi lỗi của trạm kiểm quyền thành
      mã bốn trăm lẻ một hoặc bốn trăm lẻ ba. Dòng cuối là tên một quyền, do Spring
      ghép một tiền tố cố định với phạm vi quyền ghi trong mã.'
  - show: '<table class=''t''><tr><th>tên trong Spring Cloud</th><th>nghĩa</th></tr><tr><td>Spring
      Cloud Gateway</td><td><b>cổng</b>: cửa vào chung, nhận yêu cầu rồi chuyển tới
      đúng dịch vụ</td></tr><tr><td>Consul</td><td><b>sổ đăng ký dịch vụ</b>: mỗi
      bản tự ghi tên, địa chỉ; sổ kiểm sức khoẻ từng bản</td></tr><tr><td><code>lb://ten-dich-vu</code></td><td>địa
      chỉ theo <b>tên</b>: cổng tra sổ lấy các bản rồi chia tải (load balance)</td></tr><tr><td>Spring
      Cloud Config</td><td><b>cấu hình tập trung</b>: một máy chủ giữ cấu hình cho
      mọi dịch vụ</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ hai là các tên của Spring Cloud. Cổng là cửa vào chung, nhận yêu
      cầu rồi chuyển tới đúng dịch vụ. Sổ đăng ký dịch vụ là nơi mỗi bản tự ghi tên
      và địa chỉ của mình, và sổ kiểm sức khoẻ từng bản. Địa chỉ ở hàng thứ ba không
      ghi máy nào cả mà ghi tên dịch vụ, nên cổng phải tra sổ lấy các bản rồi chia
      tải. Cuối cùng, cấu hình tập trung là một máy chủ giữ cấu hình cho mọi dịch
      vụ.
