    ''han_muc'']}, ''han_muc'') == (200, None, True, True)'
  - alg.bnx_l17_pos('CsrfFilter') == 5 < alg.bnx_l17_pos('BearerTokenAuthenticationFilter')
    == 8
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Coi 401 và 403 là một,
      hoặc trả <b class="red">403 cho mọi lần từ chối</b>.

      401 là <b>chưa biết bạn là ai</b>: bên gọi nên lấy mã mới rồi thử lại. 403 là
      <b>biết rồi nhưng không cho</b>: thử lại với đúng mã ấy vẫn 403.</div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới, là coi bốn trăm lẻ một và bốn trăm lẻ ba là
      một. Một là chưa biết bạn là ai nên lấy mã mới, ba là biết rồi nhưng không cho.
  - show: '<p><b>ChayThu.java (hết): hai ca gửi lệnh ghi POST</b></p><div class="code"><div>    thu("F.
      lệnh POST, không mang mã", "POST", null);</div><div>    thu("G. lệnh POST, đủ
      quyền", "POST", binh);</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>F.
      lệnh POST, không mang mã</div><div>  mã trạng thái 403</div><div>G. lệnh POST,
      đủ quyền</div><div>  qua trạm quan sát</div><div>  tới dịch vụ</div><div>  mã
      trạng thái 200</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Lỗi thứ hai lộ ra lúc mới dựng: hai ca cuối gửi lệnh ghi. Kết quả chạy thật:
      lệnh ghi không mang mã nhận bốn trăm lẻ ba chứ không phải bốn trăm lẻ một.'
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Thấy
      lệnh POST không mang mã nhận <b class="red">403</b> rồi đi tìm lỗi phân quyền.

      Thủ phạm là trạm <b>chống giả mạo yêu cầu</b> (CsrfFilter; CSRF là kiểu tấn
      công nhờ phiên đăng nhập có sẵn của khách để gửi lệnh ghi từ trang lạ) ở vị
      trí 5, đứng <b>trước</b> trạm đọc mã ở vị trí 8, và mặc định bật cho các lệnh
      ghi.

      <br><span class="note">Hướng dẫn của Spring Security: dịch vụ nền không phục
      vụ trình duyệt có thể tắt lớp này, và nên cân nhắc trước khi tắt. Bài học chung:
      cùng một con số 403, phải hỏi <b>trạm nào</b> trả.</span>

      <br><span class="note">Quan sát chạy thật ở bộ kiểm, với cấu hình này: lệnh
      POST mang mã ký sai nhận 401 chứ không phải 403, nên yêu cầu có đầu mục mã không
      bị trạm chống giả mạo chặn. Hướng dẫn chính thức đã đọc không giải thích cơ
      chế, nên bài không khẳng định lý do.</span></div>

      '
    introduces:
    - bnx_csrf
    clear: true
    say: Thủ phạm là trạm chống giả mạo yêu cầu ở vị trí năm, đứng trước trạm đọc
      mã và mặc định bật cho lệnh ghi. Cùng một con số bốn trăm lẻ ba, phải hỏi trạm
      nào trả.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc hệ thống lớn dần).</b>
      <b class="red">Chỉ kiểm quyền ở cổng</b>, các dịch vụ phía sau tin mọi yêu cầu
      tới mình.

      Hệ thống lớn dần, dịch vụ gọi thẳng nhau trong mạng nội bộ, không qua cổng:
      trên đường ấy không còn lần kiểm quyền nào.

      <br><span class="note">Cách chữa: cổng kiểm thô (có mã, mã còn hạn), còn <b>mỗi
      dịch vụ là một máy chủ tài nguyên</b>, tự kiểm chữ ký và quyền như ví dụ vừa
      chạy.</span></div>

      '
    clear: true
    say: 'Lỗi thứ ba lộ ra khi hệ thống lớn dần: chỉ kiểm quyền ở cổng, trong khi
      các dịch vụ gọi thẳng nhau không qua cổng. Cách chữa: mỗi dịch vụ tự kiểm chữ
      ký và quyền.'
  - show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm, lúc vận hành lâu dài).</b>
      Để <b class="red">mật khẩu dạng chữ thường</b> trong kho cấu hình tập trung.

      Kho ấy thường là một kho mã nguồn: ai đọc được lịch sử kho là đọc được mật khẩu,
      kể cả mật khẩu đã đổi từ năm trước.</div><p><b>Tệp cấu hình trong kho (chép
      từ hướng dẫn của Spring Cloud Config, không chạy trên máy này)</b></p><div class="code"><div>spring:</div><div>  datasource:</div><div>    username:
      dbuser</div><div>    password: ''{cipher}FKSAJDFGYOS8F7GLHAKERGFHLSAJ''</div></div><p
      style=''margin-top:18px''><span class=''note''>Giá trị bắt đầu bằng <code>{cipher}</code>
      là bản đã mã hoá; máy chủ cấu hình giải mã rồi mới gửi cho dịch vụ qua HTTP.
      Việc còn lại: đổi mật khẩu đã lộ trong lịch sử kho; giữ kín khoá giải mã; bảo
      vệ đường truyền, vì giá trị đã giải mã đi qua mạng.</span></p>

      '
    focus:
    - 1
    - 3
    clear: true
    say: 'Lỗi thứ tư: mật khẩu chữ thường trong kho cấu hình, nên ai đọc được lịch
      sử kho là đọc được mật khẩu. Giá trị bắt đầu bằng nhãn mã hoá thì máy chủ giải
