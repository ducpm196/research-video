scenes:
- id: hook
  kind: hook
  title: 'Ba yêu cầu tới cùng một địa chỉ: 401, 403 và 200'
  checks:
  - alg.bnx_l17_status('GET', None, 'han_muc') == 401
  - 'alg.bnx_l17_status(''GET'', {''sig'': True, ''expired'': False, ''scopes'': [''so_du'']},
    ''han_muc'') == 403'
  - 'alg.bnx_l17_status(''GET'', {''sig'': True, ''expired'': False, ''scopes'': [''so_du'',
    ''han_muc'']}, ''han_muc'') == 200'
  - alg.bnx_l17_round_robin([True, False, True], 100) == [50, 0, 50]
  - sum([True, False, True]) == 3 - 1 == 2
  steps:
  - show: '<p>Dịch vụ hạn mức của một ngân hàng nhận <b>ba yêu cầu</b> tới cùng một
      địa chỉ <code>/han-muc</code>:</p>

      <div class="box key">Không mang mã truy cập: bị chặn, nhận <b>401</b>. Có mã
      hợp lệ nhưng thiếu quyền: nhận <b>403</b>. Đủ quyền: nhận <b>200</b>.<br>Ai
      chặn, chặn ở đâu, và vì sao hai lần từ chối mang hai con số khác nhau?</div>

      <p>Dịch vụ chạy <b>ba bản</b> giống nhau; một bản trượt kiểm sức khoẻ thì 100
      yêu cầu chia cho 2 bản còn lại, mỗi bản <b>50</b>.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    say: Chào bạn, dịch vụ hạn mức nhận ba yêu cầu tới cùng một địa chỉ. Không mang
      mã thì nhận bốn trăm lẻ một, mã hợp lệ nhưng thiếu quyền thì bốn trăm lẻ ba,
      đủ quyền thì hai trăm. Vì sao hai lần từ chối mang hai con số khác nhau? Dịch
      vụ chạy ba bản, một bản trượt thì một trăm yêu cầu chia hai bản còn lại, mỗi
      bản năm mươi.
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l17_authorities('so_du han_muc') == ['SCOPE_so_du', 'SCOPE_han_muc']
  - alg.bnx_l17_round_robin([True, False, True], 100) == [50, 0, 50]
  - alg.bnx_l17_round_robin([True, True, True], 100) == [34, 33, 33]
  - sum(alg.bnx_l17_round_robin([True] * 3, 100)) == 100
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      mã truy cập</td><td>chuỗi có <b>chữ ký</b> (dãy ký tự tính từ nội dung và khoá
      bí mật; sửa nội dung thì lệch) do máy chủ cấp mã; mang hạn dùng, <b>phạm vi
      quyền</b> (scope)</td><td>scope <code>so_du han_muc</code>: 2 quyền</td></tr><tr><td>②
      mã trạng thái</td><td>con số máy chủ trả về cho mỗi yêu cầu</td><td>200: xong;
      401: chưa xác thực; 403: bị cấm</td></tr><tr><td>③ bean</td><td>đối tượng do
      Spring tạo và giữ; khai bằng nhãn <code>@Bean</code></td><td>một bean giữ luật
      bảo mật, một bean kiểm chữ ký</td></tr><tr><td>④ bản dịch vụ</td><td>một tiến
      trình đang chạy của cùng một dịch vụ; nhiều bản để chịu tải và chịu lỗi</td><td>3
      bản, 1 bản hỏng: còn 3 − 1 = 2 bản phục vụ</td></tr><tr><td>⑤ xác thực và phân
      quyền</td><td>xác thực: biết người gọi là ai; phân quyền: xét người đó có được
      làm việc này không</td><td>mã hỏng là lỗi xác thực; mã tốt mà thiếu quyền là
      lỗi phân quyền</td></tr></table>'
    say: 'Trước hết ta cần hiểu năm điều. Mã truy cập là chuỗi có chữ ký, tức dãy
      ký tự tính từ nội dung và khoá bí mật, nên sửa nội dung là chữ ký lệch; mã còn
      mang hạn dùng và phạm vi quyền. Mã trạng thái: hai trăm là xong, bốn trăm lẻ
      một là chưa xác thực, bốn trăm lẻ ba là bị cấm. Bản dịch vụ là một tiến trình
      đang chạy. Xác thực là biết ai gọi, phân quyền là xét có được làm không.'
  - show: '<p>Làm thử: 3 bản đăng ký, 1 bản hỏng, 100 yêu cầu chia đều.</p>

      $$3 - 1 = 2 \text{ bản}; \qquad 100 : 2 = \hl{50} \text{ yêu cầu mỗi bản}; \qquad
      \text{còn đủ 3 bản thì } 100 = 34 + 33 + 33$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Làm thử với ba bản đăng ký, một bản hỏng: còn hai bản nên một trăm yêu cầu
      chia mỗi bản năm mươi. Đủ ba bản thì chia ra ba mươi tư, ba mươi ba, ba mươi
      ba.'
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l17_authorities('han_muc') == ['SCOPE_han_muc']
  steps:
  - show: '<table class=''t''><tr><th>tên trong Spring Security</th><th>nghĩa</th></tr><tr><td>Filter,
      SecurityFilterChain</td><td><b>bộ lọc</b> là một trạm: nhận yêu cầu, làm một
      việc, rồi chuyển tiếp hoặc trả lời luôn; <b>chuỗi bộ lọc</b> là danh sách trạm
      có thứ tự</td></tr><tr><td>BearerTokenAuthenticationFilter</td><td><b>trạm đọc
      mã</b>: lấy mã truy cập trong yêu cầu và kiểm nó</td></tr><tr><td>AuthorizationFilter,
      ExceptionTranslationFilter</td><td><b>trạm kiểm quyền</b> so quyền với luật
      của đường dẫn; <b>trạm dịch lỗi</b> đổi lỗi của nó thành 401 hoặc 403</td></tr><tr><td>SCOPE_han_muc</td><td>quyền
      sinh từ phạm vi <code>han_muc</code> trong mã; tiền tố <code>SCOPE_</code> do
      Spring thêm</td></tr></table>'
    clear: true
    say: Bảng này giải mã tên của phần bảo mật. Bộ lọc là một trạm, chuỗi bộ lọc là
      danh sách trạm có thứ tự. Trạm đọc mã kiểm mã, trạm kiểm quyền so quyền với
      luật, trạm dịch lỗi đổi lỗi thành mã trạng thái.
  - show: '<table class=''t''><tr><th>tên trong Spring Cloud</th><th>nghĩa</th></tr><tr><td>Spring
      Cloud Gateway</td><td><b>cổng</b>: cửa vào chung, nhận yêu cầu rồi chuyển tới
      đúng dịch vụ</td></tr><tr><td>Consul</td><td><b>sổ đăng ký dịch vụ</b>: mỗi
      bản tự ghi tên, địa chỉ; sổ kiểm sức khoẻ từng bản</td></tr><tr><td><code>lb://ten-dich-vu</code></td><td>địa
      chỉ theo <b>tên</b>: cổng tra sổ lấy các bản rồi chia tải (load balance)</td></tr><tr><td>Spring
      Cloud Config</td><td><b>cấu hình tập trung</b>: một máy chủ giữ cấu hình cho
      mọi dịch vụ</td></tr></table>'
    introduces:
    - bnx_consul
    clear: true
    say: Cổng là cửa vào chung, sổ đăng ký là nơi mỗi bản tự ghi tên và được kiểm
      sức khoẻ. Địa chỉ theo tên khiến cổng tra sổ rồi chia tải, còn cấu hình tập
      trung giữ cấu hình chung.
