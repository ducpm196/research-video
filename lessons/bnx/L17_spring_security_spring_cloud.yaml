      đọc</td><td></td></tr></table>'
    clear: true
    say: Vòng lặp đếm gồm biến đếm, điều kiện còn lặp, bước sau mỗi vòng. Phần dư
      bằng không thì tăng đếm một, nên cứ ba yêu cầu có một lỗi. Vòng này duyệt ba
      tốc độ, gạch dưới chỉ để dễ đọc.
  - show: '<p><b>CuaSoLoi.java — MÔ PHỎNG: yêu cầu rơi vào bản đã chết nhưng chưa
      bị loại</b></p><div class="code"><div>public class CuaSoLoi {  // MÔ PHỎNG,
      không phải Spring Cloud</div><div>  static long loi(long tocDo, int giay, int
      soBan) {</div><div>    long roi = 0;</div><div>    for (long i = 0; i &lt; tocDo
      * giay; i++)</div><div>      if (i % soBan == 0) roi++;     // bản số 0 đã chết,
      vẫn trong danh sách</div><div>    return roi;</div><div>  }</div><div>  public
      static void main(String[] a) {</div><div>    for (long r : new long[] {100,
      10_000, 1_000_000})</div><div>      System.out.println(r + " yeu cau/giay, 45
      giay: "</div><div>          + loi(r, 45, 3) + " loi");</div><div>  }</div><div>}</div></div><p
      class="note">35 giây (thời gian sống của bộ đệm) và 10 giây (chu kỳ kiểm sức
