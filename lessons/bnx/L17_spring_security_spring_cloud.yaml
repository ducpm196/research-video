  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>giữ
      danh sách cũ, chờ sổ cập nhật</td><td>đơn giản, ít tải phụ</td><td>lỗi tỉ lệ
      với tốc độ × 45 giây</td><td>lưu lượng thấp, chịu được vài lỗi</td></tr><tr><td>rút
      ngắn chu kỳ kiểm</td><td>phát hiện sớm hơn</td><td>bộ đệm 35 giây vẫn là phần
      lớn cửa sổ; số lần kiểm tăng</td><td>bộ đệm đã ngắn</td></tr><tr><td>thử lại
