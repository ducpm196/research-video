      cầu mỗi giây</th><th>yêu cầu lỗi, tối đa trong 45 giây (mô phỏng)</th><th>giữ
      nguyên danh sách cũ</th><th>thử lại sang bản khác (lệnh đọc)</th></tr><tr><td><span
      style=''white-space:nowrap''>100 (×1)</span></td><td>1 500</td><td>gãy nhẹ</td><td>ước
      lượng: gần 0 lỗi thấy ngoài (không mô phỏng việc thử lại)</td></tr><tr><td><span
      style=''white-space:nowrap''>10 000 (×100)</span></td><td>150 000</td><td>gãy
