- id: quymo
  kind: example
  title: 'Khi lưu lượng lớn dần: bản chết còn trong danh sách'
  checks:
  - '[alg.bnx_l17_lost(r, 3, 45) for r in (100, 10000, 1000000)] == [1500, 150000,
