- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ một trạm tới cả hệ thống'
  checks:
  - alg.bnx_l17_pos('BearerTokenAuthenticationFilter') == 8 < alg.bnx_l17_pos('AuthorizationFilter')
    == 14
  - alg.bnx_l17_pos('ExceptionTranslationFilter') == 13
  - 'alg.bnx_l17_trace(''GET'', None, ''han_muc'')[2] is True and alg.bnx_l17_trace(''GET'',
    {''sig'': False, ''expired'': False, ''scopes'': [''han_muc'']}, ''han_muc'')[2]
    is False'
  - 'alg.bnx_l17_status(''GET'', {''sig'': False, ''expired'': False, ''scopes'':
    [''han_muc'']}, ''han_muc'') == 401 and alg.bnx_l17_status(''GET'', {''sig'':
    True, ''expired'': True, ''scopes'': [''han_muc'']}, ''han_muc'') == 401'
  - 'alg.bnx_l17_status(''GET'', None, ''han_muc'') == 401 and alg.bnx_l17_status(''GET'',
    {''sig'': True, ''expired'': False, ''scopes'': [''so_du'']}, ''han_muc'') ==
    403'
  - len(alg.bnx_l17_authorities('so_du han_muc')) == 2
  - alg.bnx_l17_round_robin([True, True], 6) == [3, 3]
  - '[i % 2 for i in range(6)] == [0, 1, 0, 1, 0, 1]'
  steps:
  - show: '<p><b>Bước 1.</b> Bảo mật có nhiều việc khác nhau, gộp vào một chỗ thì
      khó thay từng phần, nên Spring Security chia thành <b>chuỗi trạm có thứ tự</b>.
      Thứ tự là luật: trạm xác thực phải đứng <b>trước</b> trạm phân quyền.</p>

      <p>Làm thử: trạm đọc mã ở vị trí 8, trạm kiểm quyền ở vị trí 14.</p>

      $$8 < 14 \;\Rightarrow\; \text{khi tới trạm kiểm quyền, đã biết người gọi là
      ai (hoặc biết là vô danh)}$$

      '
    clear: true
    say: Bước một, bảo mật chia thành chuỗi trạm có thứ tự để thay được từng phần,
      và trạm đọc mã ở vị trí tám phải đứng trước trạm kiểm quyền ở vị trí mười bốn.
    introduces:
    - implies
  - show: '<p><b>Bước 2.</b> Trạm đọc mã chỉ lo <b>xác thực</b>: mã hỏng thì trả <b>401</b>
      ngay; không có mã thì cho đi tiếp như <b>khách vô danh</b>. Trạm kiểm quyền
      (14) chỉ biết ném lỗi từ chối; trạm dịch lỗi (13) bọc ngoài, hỏi người gọi đã
      xác thực chưa.</p><table class=''t''><tr><th>người gọi</th><th>ai trả lời</th><th>mã</th></tr><tr><td>không
      mang mã (vô danh)</td><td>trạm dịch lỗi (13)</td><td><b>401</b>: chưa biết bạn
      là ai</td></tr><tr><td>mã sai chữ ký hoặc hết hạn</td><td>trạm đọc mã (8)</td><td><b>401</b>:
      mã không tin được</td></tr><tr><td>mã tốt, thiếu quyền</td><td>trạm dịch lỗi
      (13)</td><td><b>403</b>: biết rồi nhưng không cho</td></tr></table>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước hai, trạm đọc mã chỉ lo xác thực: mã hỏng thì trả bốn trăm lẻ một vì
      không tin được, không có mã thì cho đi tiếp như khách vô danh. Trạm dịch lỗi
      hỏi người gọi đã xác thực chưa: vô danh thì bốn trăm lẻ một, đã xác thực mà
      thiếu quyền thì bốn trăm lẻ ba.'
  - show: '<p><b>Bước 3.</b> Dịch vụ tự kiểm mã, không hỏi lại máy chủ cấp mã mỗi
      lần, nên cần <b>khoá để kiểm chữ ký</b>. Khai địa chỉ máy chủ cấp mã, dịch vụ
      tự lấy <b>khoá công khai</b> ở đó (khoá chỉ để kiểm chữ ký, ai cũng biết được;
      chỉ <b>khoá riêng</b> của máy chủ cấp mã mới ký được): dịch vụ như thế gọi là
      <b>máy chủ tài nguyên</b>.</p><p><b>application.yml (chép từ hướng dẫn của Spring
      Security, không chạy trên máy này)</b></p><div class="code"><div>spring:</div><div>  security:</div><div>    oauth2:</div><div>      resourceserver:</div><div>        jwt:</div><div>          issuer-uri:
      https://idp.example.com/issuer</div></div><p>Làm thử: scope <code>so_du han_muc</code>
      cho 2 quyền <code>SCOPE_so_du</code>, <code>SCOPE_han_muc</code>. Mặc định chỉ
      kiểm nơi cấp và hạn.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, dịch vụ tự kiểm mã nên cần khoá kiểm chữ ký. Dòng cuối khai địa
      chỉ máy chủ cấp mã để dịch vụ tự lấy khoá công khai, vì chỉ khoá riêng mới ký
      được. Dịch vụ như thế gọi là máy chủ tài nguyên.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>{app:
      x}</code>, <code>[a, b]</code>, <code>- name: n</code></td><td>YAML: <code>{k:
      v}</code> là một nhóm cặp khoá và giá trị viết trên một dòng; <code>[a, b]</code>
      là danh sách; dòng bắt đầu bằng <code>-</code> là một phần tử của danh sách</td><td><code>routes:</code>
      rồi <code>- id: myRoute</code>: một tuyến trong danh sách</td></tr><tr><td><code>uri:
      lb://service</code>, <code>- Path=/service/**</code></td><td><code>lb://service</code>:
      địa chỉ theo tên dịch vụ, cổng tra sổ rồi chia tải; <code>Path=/service/**</code>:
      khớp mọi đường dẫn bắt đầu bằng <code>/service/</code></td><td></td></tr></table>'
    clear: true
    say: Trong YAML, dòng bắt đầu bằng gạch ngang là một phần tử của danh sách. Địa
      chỉ theo tên để cổng tra sổ rồi chia tải, điều kiện khớp mọi đường dẫn cùng
      đầu.
  - show: '<p><b>Bước 4.</b> Địa chỉ các bản thay đổi liên tục, nên cổng ghi <b>tên
      dịch vụ</b> rồi tra sổ lấy các bản khoẻ; yêu cầu thứ $i$ giao cho bản thứ $i$
      chia lấy dư cho số bản khoẻ.</p><p><b>application.yml của cổng (theo hướng dẫn
      của Spring Cloud Gateway, không chạy ở đây)</b></p><div class="code"><div>spring:</div><div>  cloud:</div><div>    gateway:</div><div>      server:</div><div>        webflux:</div><div>          routes:</div><div>          -
      id: myRoute</div><div>            uri: lb://service</div><div>            predicates:</div><div>            -
      Path=/service/**</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước bốn, địa chỉ các bản thay đổi liên tục, nên cổng ghi tên dịch vụ rồi
      tra sổ lấy các bản khoẻ. Yêu cầu thứ i giao cho bản thứ i chia lấy dư cho số
      bản khoẻ.
  - show: '<p>Làm thử: yêu cầu số chẵn về bản đầu, yêu cầu số lẻ về bản sau.</p>

      $$6 \text{ yêu cầu}, 2 \text{ bản khoẻ}: \quad 6 : 2 = \hl{3} \text{ yêu cầu
      mỗi bản}$$

      '
    clear: true
    say: Làm thử với hai bản khoẻ, sáu yêu cầu thì các yêu cầu số chẵn về bản đầu,
      số lẻ về bản sau, nên mỗi bản nhận ba yêu cầu.
  - show: '<table class=''t''><tr><th>mảnh của Spring Cloud</th><th>giữ gì</th><th>vì
      sao cần</th></tr><tr><td>cổng</td><td>luật định tuyến: đường dẫn nào về dịch
      vụ nào</td><td>khách chỉ cần biết một địa chỉ</td></tr><tr><td>sổ đăng ký dịch
      vụ</td><td>tên, địa chỉ và sức khoẻ của từng bản</td><td>bản thêm vào hay chết
      đi, không ai phải sửa cấu hình</td></tr><tr><td>cấu hình tập trung</td><td>cấu
      hình của mọi dịch vụ ở một nơi</td><td>đổi một chỗ, không sửa từng bản</td></tr></table>'
    clear: true
    say: Bước năm, cổng giữ luật định tuyến, sổ đăng ký giữ sức khoẻ từng bản nên
      thêm hay mất bản không ai sửa cấu hình, và cấu hình tập trung cho đổi một chỗ.
- id: example
  kind: example
  title: Ví dụ chạy thật Spring Security, từng phép tính
  checks:
  - alg.bnx_l17_chain_len() == 14 and alg.bnx_l17_pos('CsrfFilter') == 5
  - alg.bnx_l17_pos('BearerTokenAuthenticationFilter') == 8 and alg.bnx_l17_pos('TramQuanSat')
    == 9
  - alg.bnx_l17_pos('ExceptionTranslationFilter') == 13 and alg.bnx_l17_pos('AuthorizationFilter')
    == 14
  - alg.bnx_l17_trace('GET', None, 'han_muc') == (401, 'ExceptionTranslationFilter',
    True, False)
  - 'alg.bnx_l17_trace(''GET'', {''sig'': False, ''expired'': False, ''scopes'': [''han_muc'']},
    ''han_muc'') == (401, ''BearerTokenAuthenticationFilter'', False, False)'
  - 'alg.bnx_l17_trace(''GET'', {''sig'': True, ''expired'': True, ''scopes'': [''han_muc'']},
    ''han_muc'') == (401, ''BearerTokenAuthenticationFilter'', False, False)'
  - 'alg.bnx_l17_trace(''GET'', {''sig'': True, ''expired'': False, ''scopes'': [''so_du'']},
    ''han_muc'') == (403, ''ExceptionTranslationFilter'', True, False)'
  - 'alg.bnx_l17_trace(''GET'', {''sig'': True, ''expired'': False, ''scopes'': [''so_du'',
    ''han_muc'']}, ''han_muc'') == (200, None, True, True)'
  - alg.bnx_l17_round_robin([True, True, True], 100) == [34, 33, 33]
  - alg.bnx_l17_round_robin([True, False, True], 100) == [50, 0, 50]
  steps:
  - show: '<p><b>CauHinh.java (1/4): các lệnh nhập thư viện, gõ đủ từng dòng</b></p><div
      class="code"><div>import static java.nio.charset.StandardCharsets.UTF_8;</div><div>import
      jakarta.servlet.*;</div><div>import java.io.IOException;</div><div>import javax.crypto.spec.SecretKeySpec;</div><div>import
      org.springframework.context.annotation.*;</div><div>import org.springframework.security.config.Customizer;</div><div>import
      org.springframework.security.config.annotation.web.builders.*;</div><div>import
      org.springframework.security.config.annotation.web.configuration.*;</div><div>import
      org.springframework.security.oauth2.jwt.*;</div><div>import org.springframework.security.oauth2.server.resource.web.authentication.*;</div><div>import
      org.springframework.security.web.SecurityFilterChain;</div></div><p class="note"><code>@Configuration</code>
      đánh dấu lớp khai báo bean; <code>@EnableWebSecurity</code> bật bảo mật web;
      <code>q -&gt; …</code> là một hàm nhỏ không tên.</p>'
    clear: true
    say: Tệp cấu hình mở đầu bằng các lệnh nhập thư viện, gõ lại đúng từng dòng.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>public
      class Ten { … }</code></td><td>khai một <b>lớp</b>: khối chứa các hàm và dữ
      liệu của chương trình; <code>public</code>: nơi khác dùng được; phần thân nằm
      giữa cặp ngoặc nhọn</td><td><code>public class CauHinh { … }</code></td></tr><tr><td><code>SecurityFilterChain
      chuoi(HttpSecurity http) throws Exception</code></td><td>hàm tên <code>chuoi</code>:
      nhận <code>http</code>, trả về chuỗi bộ lọc; <code>throws Exception</code>:
      có thể ném lỗi</td><td>kiểu trả về đứng trước tên hàm</td></tr></table>'
    clear: true
    say: Lớp là khối chứa hàm và dữ liệu giữa cặp ngoặc nhọn. Hàm nhận cấu hình bảo
      mật, trả về chuỗi bộ lọc, có thể ném lỗi.
  - show: '<p><b>CauHinh.java (2/4): luật bảo mật của dịch vụ hạn mức</b></p><div
      class="code"><div>@Configuration</div><div>@EnableWebSecurity</div><div>public
      class CauHinh {</div><div>  static final String KHOA = "khoa-hoc-tap-chi-dai-32-byte-001";</div><div>  @Bean</div><div>  SecurityFilterChain
      chuoi(HttpSecurity http) throws Exception {</div><div>    http.authorizeHttpRequests(q
      -&gt; q</div><div>        .requestMatchers("/han-muc").hasAuthority("SCOPE_han_muc")</div><div>        .anyRequest().authenticated());</div><div>    http.oauth2ResourceServer(m
      -&gt; m.jwt(Customizer.withDefaults()));</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Ta chạy thật bộ khung bảo mật của Spring bản bảy chấm một. Hàm có nhãn khai
      chuỗi bộ lọc: đường dẫn hạn mức đòi quyền hạn mức, đường khác chỉ cần đã xác
      thực.'
  - show: '<p><b>CauHinh.java (3/4): trạm quan sát và bộ kiểm chữ ký</b></p><div class="code"><div>    http.addFilterAfter(new
      TramQuanSat(),</div><div>        BearerTokenAuthenticationFilter.class);</div><div>    return
      http.build();</div><div>  }</div><div>  @Bean</div><div>  JwtDecoder giaiMa()
      {                // kiểm chữ ký bằng khoá chung</div><div>    var khoa = new
      SecretKeySpec(KHOA.getBytes(UTF_8), "HmacSHA256");</div><div>    return NimbusJwtDecoder.withSecretKey(khoa).build();</div><div>  }</div></div><p
      class="note">Bài thử dùng <b>khoá chung</b> của hai bên cho gọn; cấu hình thật
      ở bước ba (<code>issuer-uri</code>) lấy <b>khoá công khai</b> nên không phải
      giữ bí mật khoá kiểm.</p>'
    focus:
    - 1
    - 2
    introduces:
    - bnx_ma_bam
    clear: true
    say: Ta chèn một trạm quan sát ngay sau trạm đọc mã, và khai bộ kiểm chữ ký bằng
      khoá chung. Chữ ký tính bằng mã băm có khoá, mà mã băm là dãy ký tự ngắn sinh
      từ dữ liệu.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>class
      A implements Filter</code></td><td>lớp A cam kết có đủ các hàm mà <b>giao diện</b>
      <code>Filter</code> (bản liệt kê tên hàm phải có) yêu cầu</td><td><code>static
      class TramQuanSat implements Filter</code></td></tr><tr><td><code>public void
      doFilter(ServletRequest q, ServletResponse d, FilterChain c) throws IOException,
      ServletException</code></td><td>hàm của trạm: nhận yêu cầu <code>q</code>, trả
      lời <code>d</code> và phần chuỗi còn lại <code>c</code>; <code>throws</code>
      liệt kê hai loại lỗi có thể ném; <code>c.doFilter(q, d)</code> chuyển yêu cầu
      sang trạm sau</td><td>trạm in một câu rồi gọi <code>c.doFilter</code></td></tr></table>'
    clear: true
    say: Lớp cam kết có đủ các hàm mà giao diện liệt kê. Hàm của trạm nhận yêu cầu,
      rồi lệnh chuyển tiếp đẩy yêu cầu sang trạm sau.
  - show: '<p><b>CauHinh.java (4/4): trạm quan sát chỉ in một câu rồi chuyển tiếp</b></p><div
      class="code"><div>  static class TramQuanSat implements Filter {   // trạm quan
      sát</div><div>    public void doFilter(ServletRequest q, ServletResponse d,</div><div>        FilterChain
      c) throws IOException, ServletException {</div><div>      System.out.println("  qua
      trạm quan sát");</div><div>      c.doFilter(q, d);</div><div>    }</div><div>  }</div><div>}</div></div>'
    clear: true
    say: Trạm quan sát chỉ in một câu rồi chuyển tiếp, nên yêu cầu nào không in câu
      này đã bị chặn từ trạm đọc mã trở về trước.
  - show: '<p><b>ChayThu.java (1/6): nhập thư viện, mở lớp, khai biến giữ chuỗi bộ
      lọc</b></p><div class="code"><div>import static java.nio.charset.StandardCharsets.UTF_8;</div><div>import
      jakarta.servlet.Filter;</div><div>import java.util.Base64;</div><div>import
      javax.crypto.Mac;</div><div>import javax.crypto.spec.SecretKeySpec;</div><div>import
      org.springframework.mock.web.*;</div><div>import org.springframework.security.web.FilterChainProxy;</div><div>import
      org.springframework.web.context.support.*;</div><div>public class ChayThu {</div><div>  static
      Filter chuoi;</div></div><p class="note"><code>Base64</code> (base64url): viết
      byte thành ký tự chữ và số an toàn trong đường dẫn.</p>'
    introduces:
    - bnx_base64url
    clear: true
    say: Tệp chạy thử nhập thư viện, mở lớp và khai biến giữ chuỗi bộ lọc dùng chung.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>static
      String ky(String than, String khoa) throws Exception</code></td><td>hàm tên
      <code>ky</code>: trả về một chuỗi chữ, nhận hai chuỗi là phần thân và khoá</td><td><code>ky(…)</code>
      cho ra mã truy cập</td></tr><tr><td><code>var b = Base64.getUrlEncoder().withoutPadding();</code></td><td><code>var</code>:
      để máy tự suy ra kiểu của biến từ vế phải</td><td><code>b</code> là bộ đổi byte
      sang chữ</td></tr><tr><td><code>"{\"alg\":\"HS256\"}"</code></td><td>trong chuỗi
      Java, dấu gạch ngược đặt trước dấu nháy kép để nháy đó là chữ thường, không
      kết thúc chuỗi</td><td><code>{"alg":"HS256"}</code>: chuỗi thật</td></tr></table>'
    clear: true
    say: Hàm ký trả về chuỗi chữ, nhận phần thân và khoá. Biến không ghi kiểu thì
      máy suy ra kiểu từ vế phải. Gạch ngược trước dấu nháy kép làm nháy đó thành
      chữ thường trong chuỗi.
  - show: '<p><b>ChayThu.java (2/6): hàm ký mã truy cập bằng khoá chung</b></p><div
      class="code"><div>  static String ky(String than, String khoa) throws Exception
      {</div><div>    var b = Base64.getUrlEncoder().withoutPadding();</div><div>    String
      p = b.encodeToString("{\"alg\":\"HS256\"}".getBytes(UTF_8))</div><div>        +
      "." + b.encodeToString(than.getBytes(UTF_8));</div><div>    Mac m = Mac.getInstance("HmacSHA256");</div><div>    m.init(new
      SecretKeySpec(khoa.getBytes(UTF_8), "HmacSHA256"));</div><div>    return p +
      "." + b.encodeToString(m.doFinal(p.getBytes(UTF_8)));</div><div>  }</div></div><p
      class="note"><code>Base64</code> (base64url): viết byte thành ký tự chữ và số
      an toàn trong đường dẫn; <code>Mac</code> tính chữ ký băm có khoá.</p>'
    clear: true
    say: 'Hàm ký dựng mã truy cập từ ba phần: phần đầu ghi thuật toán, phần thân ghi
      hạn dùng và quyền, rồi chữ ký.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>"GET"</code>,
      <code>"POST"</code></td><td>phương thức của yêu cầu mạng: GET là lệnh đọc dữ
      liệu, POST là lệnh ghi (tạo hoặc đổi dữ liệu)</td></tr><tr><td><code>Authorization:
      Bearer …</code></td><td>tiêu đề (dòng thông tin kèm yêu cầu) mang mã truy cập;
      Bearer nghĩa là ai cầm mã này thì được nhận quyền ghi trong mã</td></tr><tr><td><code>WWW-Authenticate</code></td><td>tiêu
      đề trong trả lời từ chối: máy chủ nói muốn xác thực kiểu nào và vì sao mã bị
      loại</td></tr></table>'
    clear: true
    say: Trước khi đọc hàm gửi yêu cầu, ta cần ba từ. Lệnh đọc và lệnh ghi là hai
      phương thức của yêu cầu mạng, tiêu đề cầm mã mang mã truy cập, và tiêu đề trả
      lời báo kiểu xác thực máy chủ muốn.
  - show: '<p><b>ChayThu.java (3/6): gửi một yêu cầu qua chuỗi và in kết quả</b></p><div
      class="code"><div>  static void thu(String ten, String pt, String ma) throws
      Exception {</div><div>    System.out.println(ten);</div><div>    var q = new
      MockHttpServletRequest(pt, "/han-muc");</div><div>    if (ma != null) q.addHeader("Authorization",
      "Bearer " + ma);</div><div>    var d = new MockHttpServletResponse();</div><div>    chuoi.doFilter(q,
      d,</div><div>        (x, y) -&gt; System.out.println("  tới dịch vụ"));</div><div>    System.out.println("  mã
      trạng thái " + d.getStatus());</div><div>    String h = d.getHeader("WWW-Authenticate");</div><div>    if
      (h != null) System.out.println("  " + h);</div><div>  }</div></div>'
    clear: true
    say: Hàm chạy thử tạo yêu cầu giả, đẩy qua chuỗi bộ lọc không cần máy chủ thật,
      rồi in mã trạng thái.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>var
      ctx = new AnnotationConfigWebApplicationContext();</code></td><td>tạo mới một
      đối tượng Spring giữ mọi bean; <code>var</code>: máy tự suy ra kiểu của biến</td><td></td></tr><tr><td><code>for
      (long x : ca) { … }</code></td><td>duyệt từng phần tử: mỗi vòng <code>x</code>
      nhận một phần tử của <code>ca</code>, theo thứ tự</td><td><code>for (Filter
