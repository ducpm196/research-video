  - show: <p><b>ChiaTai.java (1/2) — MÔ PHỎNG bằng Java thuần, không phải Spring Cloud</b></p><div
      class="code"><div>import java.util.*;</div><div>public class ChiaTai {   //
      MÔ PHỎNG, không phải Spring Cloud</div><div>  record Ban(String ten, boolean
      khoe) { }</div><div>  static Map&lt;String, Integer&gt; chia(List&lt;Ban&gt;
      so, int n) {</div><div>    List&lt;Ban&gt; song = so.stream().filter(Ban::khoe).toList();</div><div>    Map&lt;String,
