      x="575" y="365" font-size="20" text-anchor="start" fill="#1f2937">cấu hình</text><text
      x="900" y="500" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">Nếu
      sổ chỉ trả bản khoẻ: bản 2 trượt bị loại, 100 : 2 = 50 mỗi bản</text></svg></div>'
    clear: true
    say: Hình thứ hai là phần Spring Cloud, ứng dụng khách chỉ biết một địa chỉ, là
      cổng. Cổng không nhớ sẵn địa chỉ các bản, mà tra sổ đăng ký dịch vụ, nơi mỗi
      bản đã tự ghi tên lúc khởi động. Sổ định kỳ kiểm sức khoẻ từng bản. Khi sổ được
      dặn chỉ trả các bản khoẻ, hoặc bộ chia tải tự lọc, bản hai trượt thì bị loại
      khỏi danh sách. Vì chỉ còn hai bản khoẻ, một trăm yêu cầu được chia xoay vòng,
      mỗi bản năm mươi. Ở phía dưới, máy chủ cấu hình giữ cấu hình chung, và mỗi dịch
      vụ hỏi nó lúc khởi động.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ một trạm tới cả hệ thống'
  checks:
  - alg.bnx_l17_pos('BearerTokenAuthenticationFilter') == 8 < alg.bnx_l17_pos('AuthorizationFilter')
    == 14
  - alg.bnx_l17_pos('ExceptionTranslationFilter') == 13
  - 'alg.bnx_l17_trace(''GET'', None, ''han_muc'')[2] is True and alg.bnx_l17_trace(''GET'',
    {''sig'': False, ''expired'': False, ''scopes'': [''han_muc'']}, ''han_muc'')[2]
    is False'
  - 'alg.bnx_l17_status(''GET'', {''sig'': False, ''expired'': False, ''scopes'':
    [''han_muc'']}, ''han_muc'') == 401 and alg.bnx_l17_status(''GET'', {''sig'':
    True, ''expired'': True, ''scopes'': [''han_muc'']}, ''han_muc'') == 401'
  - 'alg.bnx_l17_status(''GET'', None, ''han_muc'') == 401 and alg.bnx_l17_status(''GET'',
    {''sig'': True, ''expired'': False, ''scopes'': [''so_du'']}, ''han_muc'') ==
    403'
  - len(alg.bnx_l17_authorities('so_du han_muc')) == 2
  - alg.bnx_l17_round_robin([True, True], 6) == [3, 3]
  - '[i % 2 for i in range(6)] == [0, 1, 0, 1, 0, 1]'
  steps:
  - show: '<p><b>Bước 1.</b> Bảo mật có nhiều việc khác nhau: đọc mã, kiểm quyền,
      đổi lỗi thành câu trả lời. Gộp vào một chỗ thì khó thay từng phần,

      nên Spring Security chia thành <b>chuỗi trạm có thứ tự</b>. Thứ tự là luật:
      trạm xác thực phải đứng <b>trước</b> trạm phân quyền.</p>

      <p>Làm thử: trạm đọc mã ở vị trí 8, trạm kiểm quyền ở vị trí 14.</p>

      $$8 < 14 \;\Rightarrow\; \text{khi tới trạm kiểm quyền, đã biết người gọi là
      ai (hoặc biết là vô danh)}$$

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, bảo mật có nhiều việc khác nhau, nên Spring chia chúng thành một
      chuỗi trạm có thứ tự, để thay được từng phần. Thứ tự là luật, vì trạm xác thực
      phải đứng trước trạm phân quyền. Làm thử, trạm đọc mã ở vị trí tám, trạm kiểm
      quyền ở vị trí mười bốn, nên khi tới trạm kiểm quyền thì đã biết người gọi là
      ai.
    introduces:
    - implies
  - show: '<p><b>Bước 2.</b> Trạm đọc mã chỉ lo <b>xác thực</b>. Có mã thì kiểm chữ
      ký và hạn dùng; hỏng thì trả <b>401</b> ngay, vì không thể tin một chữ nào trong
      mã.

      Không có mã thì trạm cho đi tiếp như một <b>khách vô danh</b>, vì có thể đường
      dẫn ấy không đòi gì.</p><table class=''t''><tr><th>yêu cầu</th><th>trạm đọc
      mã (số 8)</th><th>đi tiếp?</th></tr><tr><td>không mang mã</td><td>không có gì
      để kiểm</td><td>có, với tư cách vô danh</td></tr><tr><td>mã sai chữ ký hoặc
      hết hạn</td><td>trả <b>401</b></td><td>không</td></tr><tr><td>mã tốt</td><td>ghi
      nhận người gọi và các quyền</td><td>có</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước hai, trạm đọc mã chỉ lo xác thực. Có mã thì nó kiểm chữ ký và hạn dùng,
      hỏng thì trả bốn trăm lẻ một ngay, vì không thể tin một chữ nào trong mã. Không
      có mã thì trạm cho đi tiếp như một khách vô danh, vì có thể đường dẫn ấy không
      đòi gì. Bảng làm thử ba trường hợp: không mang mã thì đi tiếp, mã hỏng thì dừng
      ở đây, mã tốt thì đi tiếp cùng các quyền của nó.'
  - show: '<p><b>Bước 3.</b> Trạm kiểm quyền (số 14) chỉ biết <b>ném lỗi từ chối</b>.
      Trạm dịch lỗi (số 13) bọc ngoài nó, bắt lỗi ấy và hỏi một câu: người gọi đã
      được xác thực chưa?</p><table class=''t''><tr><th>người gọi</th><th>trạm dịch
      lỗi trả</th><th>nghĩa</th></tr><tr><td>vô danh (chưa xác thực)</td><td><b>401</b></td><td>chưa
      biết bạn là ai: hãy mang mã tới</td></tr><tr><td>đã xác thực, thiếu quyền</td><td><b>403</b></td><td>biết
      rồi nhưng không cho: mang lại mã ấy cũng vô ích</td></tr></table>'
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    clear: true
    say: Bước ba, trạm kiểm quyền chỉ biết ném lỗi từ chối. Trạm dịch lỗi bọc ngoài
      nó, bắt lỗi ấy, rồi hỏi người gọi đã được xác thực chưa. Nếu là khách vô danh
      thì trả bốn trăm lẻ một, nghĩa là chưa biết bạn là ai, hãy mang mã tới. Nếu
      đã xác thực mà thiếu quyền thì trả bốn trăm lẻ ba, nghĩa là biết rồi nhưng không
      cho, nên gửi lại đúng mã ấy cũng vô ích.
  - show: '<p><b>Bước 4.</b> Dịch vụ tự kiểm mã, không hỏi lại máy chủ cấp mã mỗi
      lần, nên nó cần <b>khoá để kiểm chữ ký</b>. Khai địa chỉ máy chủ cấp mã,

      dịch vụ sẽ tự lấy khoá công khai ở đó. Dịch vụ như thế gọi là <b>máy chủ tài
      nguyên</b>.</p><p><b>application.yml (chép từ hướng dẫn của Spring Security,
      không chạy trên máy này)</b></p><div class="code"><div>spring:</div><div>  security:</div><div>    oauth2:</div><div>      resourceserver:</div><div>        jwt:</div><div>          issuer-uri:
      https://idp.example.com/issuer</div></div><p>Làm thử: mã ghi scope <code>so_du
      han_muc</code> thì người gọi có 2 quyền: <code>SCOPE_so_du</code> và <code>SCOPE_han_muc</code>.</p><p
      style=''margin-top:18px''><span class=''note''>Mặc định dịch vụ kiểm nơi cấp
      (iss) và hạn (exp, nbf); đối tượng nhận (aud) phải khai thêm. Theo hướng dẫn
      chính thức, việc tìm khoá chỉ làm ở yêu cầu đầu tiên có mã, nên khởi động không
      bị buộc vào máy chủ cấp mã.</span></p>

      '
    focus:
    - 1
    - '3.6'
    - 1
    - 4
    - 5
    clear: true
    say: Bước bốn, dịch vụ tự kiểm mã chứ không hỏi lại máy chủ cấp mã mỗi lần, nên
      nó cần khoá để kiểm chữ ký. Trong tệp cấu hình này, dòng cuối khai địa chỉ máy
      chủ cấp mã, và dịch vụ sẽ tự lấy khoá công khai ở đó. Một dịch vụ tự kiểm mã
      như thế được gọi là máy chủ tài nguyên. Làm thử, mã ghi hai phạm vi quyền thì
      người gọi có hai quyền, mỗi quyền là tiền tố cố định ghép với một phạm vi. Mặc
      định dịch vụ chỉ kiểm nơi cấp và hạn dùng của mã, còn đối tượng nhận mã phải
      khai thêm, và việc tìm khoá chỉ làm ở yêu cầu đầu tiên có mã.
  - show: '<p><b>Bước 5.</b> Địa chỉ các bản thay đổi liên tục (thêm bản, bản chết),
      nên không ghi cứng vào cổng. Cổng ghi <b>tên dịch vụ</b>, rồi tra sổ đăng ký
      lấy các bản đang khoẻ.</p><p><b>application.yml của cổng (chép từ hướng dẫn
      của Spring Cloud Gateway, không chạy trên máy này)</b></p><div class="code"><div>spring:</div><div>  cloud:</div><div>    gateway:</div><div>      server:</div><div>        webflux:</div><div>          routes:</div><div>          -
      id: myRoute</div><div>            uri: lb://service</div><div>            predicates:</div><div>            -
      Path=/service/**</div></div>'
    focus:
    - 1
    - 1
    - - '3.8'
      - '3.10'
    clear: true
    say: Bước năm, địa chỉ các bản thay đổi liên tục, nên ta không ghi cứng vào cổng.
      Cổng ghi tên dịch vụ, rồi tra sổ đăng ký lấy các bản đang khoẻ. Trong cấu hình
      của cổng, dòng địa chỉ bắt đầu bằng hai chữ cái viết tắt của chia tải, theo
      sau là tên dịch vụ, còn dòng cuối là mẫu đường dẫn.
  - show: '<p><b>Chia xoay vòng:</b> yêu cầu thứ $i$ giao cho bản thứ $i$ chia lấy
      dư cho số bản khoẻ. Làm thử với 2 bản khoẻ: yêu cầu 0, 2, 4 về bản đầu, yêu
      cầu 1, 3, 5 về bản sau.</p>

      $$6 \text{ yêu cầu}, 2 \text{ bản khoẻ}: \quad 6 : 2 = \hl{3} \text{ yêu cầu
      mỗi bản}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Chia xoay vòng nghĩa là yêu cầu thứ i giao cho bản thứ i chia lấy dư cho
      số bản khoẻ. Làm thử với hai bản khoẻ, các yêu cầu số chẵn về bản đầu, các yêu
      cầu số lẻ về bản sau, nên sáu yêu cầu chia ra mỗi bản ba.
  - show: '<table class=''t''><tr><th>mảnh của Spring Cloud</th><th>giữ gì</th><th>vì
      sao cần</th></tr><tr><td>cổng</td><td>luật định tuyến: đường dẫn nào về dịch
      vụ nào</td><td>khách chỉ cần biết một địa chỉ</td></tr><tr><td>sổ đăng ký dịch
      vụ</td><td>tên, địa chỉ và sức khoẻ của từng bản</td><td>bản thêm vào hay chết
      đi, không ai phải sửa cấu hình</td></tr><tr><td>cấu hình tập trung</td><td>cấu
      hình của mọi dịch vụ ở một nơi</td><td>đổi một chỗ, không sửa từng bản</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Bước sáu, ghép ba mảnh của Spring Cloud. Cổng giữ luật định tuyến, vì khách
      chỉ cần biết một địa chỉ. Sổ đăng ký giữ tên, địa chỉ và sức khoẻ của từng bản,
      vì thế bản thêm vào hay chết đi thì không ai phải sửa cấu hình. Cấu hình tập
      trung giữ cấu hình của mọi dịch vụ ở một nơi, để đổi một chỗ thay vì sửa từng
      bản.
