- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: Resilience4j thật'
  checks:
  - alg.bnx_l30_breaker([0, 100, 200, 300, 400, 500], 10**9)[:2] == (3, 3)
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>import
      io.github.resilience4j.circuitbreaker.*;</code>, <code>import java.time.Duration;</code></td><td><code>import</code>:
      nạp lớp của thư viện để dùng tên ngắn; dấu <code>*</code> là nạp mọi lớp trong
      gói; <code>Duration</code>: độ dài thời gian</td></tr><tr><td><code>var cfg
      = CircuitBreakerConfig.custom() … .build();</code></td><td><code>var</code>:
      máy tự suy kiểu; mỗi dòng bắt đầu bằng dấu chấm đặt một thông số; <code>.build()</code>
      tạo cấu hình</td></tr><tr><td><code>CircuitBreaker.of("dich-vu", cfg)</code>,
      <code>Duration.ofMillis(1000)</code>, <code>… main(String[] a) throws Exception</code></td><td>tạo
      cầu dao tên <code>dich-vu</code> theo cấu hình; 1000 mili giây; hàm chính, <code>throws
      Exception</code> báo có thể ném lỗi mà không cần bắt</td></tr></table>'
    clear: true
    say: Câu nạp thư viện; dấu sao nạp mọi lớp trong gói. Một từ khoá để máy tự suy
      kiểu; mỗi dòng dấu chấm đặt một thông số; dòng cuối tạo cấu hình. Tạo cầu dao
      theo cấu hình; hàm chính khai có thể ném lỗi.
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>.slidingWindowType(COUNT_BASED)</code></td><td>cửa
      sổ trượt đếm theo số cuộc, chỉ nhìn các cuộc gần nhất</td></tr><tr><td><code>.minimumNumberOfCalls(4)</code></td><td>chưa
      đủ 4 cuộc thì chưa tính tỉ lệ hỏng, nên chưa mở sớm</td></tr><tr><td><code>.failureRateThreshold(50)</code></td><td>hỏng
      từ 50% số cuộc trong cửa sổ thì mở</td></tr></table>
    clear: true
    say: Cửa sổ trượt chỉ nhìn các cuộc gần nhất. Chưa đủ bốn cuộc nên chưa tính tỉ
      lệ hỏng, chưa mở sớm. Hỏng từ một nửa số cuộc trong cửa sổ thì mở.
  - show: '<p><b>R4j.java (trích): cầu dao của thư viện Resilience4j 2.3.0, cửa sổ
      4 cuộc, ngưỡng 50%, chờ 1 giây, nửa mở thử đúng 1 cuộc</b></p><div class="code"><div>import
      io.github.resilience4j.circuitbreaker.*;</div><div>import java.time.Duration;</div><div>public
      class R4j {</div><div>  public static void main(String[] a) throws Exception
      {</div><div>    var cfg = CircuitBreakerConfig.custom()</div><div>        .slidingWindowType(CircuitBreakerConfig.SlidingWindowType.COUNT_BASED)</div><div>        .slidingWindowSize(4).minimumNumberOfCalls(4)</div><div>        .failureRateThreshold(50)</div><div>        .waitDurationInOpenState(Duration.ofMillis(1000))</div><div>        .permittedNumberOfCallsInHalfOpenState(1).build();</div></div>'
    clear: true
    say: Ta kiểm bằng đường khác hẳn là thư viện chịu lỗi của Java, đặt theo cửa sổ
      bốn cuộc, ngưỡng năm mươi phần trăm, chờ một giây.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>cb.getEventPublisher().onStateTransition(e
      -&gt; …)</code></td><td>đăng ký một hàm ngắn <code>e -&gt; …</code> để thư viện
      gọi mỗi khi cầu dao đổi trạng thái; <code>e</code> là sự kiện</td></tr><tr><td><code>for
      (int i = 1; i &lt;= 6; i++)</code>, <code>tuChoi++;</code></td><td>vòng lặp
      đếm 6 lần; <code>tuChoi++</code> tăng biến đếm thêm 1</td></tr><tr><td><code>cb.executeRunnable(()
      -&gt; { throw new IllegalStateException("hong"); });</code></td><td>chạy đoạn
      việc qua cầu dao; <code>() -&gt;</code> hàm ngắn không tham số; <code>throw
      new …</code> ném lỗi, nên cuộc này luôn hỏng</td></tr><tr><td><code>catch (CallNotPermittedException
      e) { tuChoi++; } catch (IllegalStateException e) { }</code></td><td>bắt lỗi
      theo loại: loại do cầu dao chặn thì đếm; lỗi cố ý thì bỏ qua (ngoặc nhọn rỗng)</td></tr></table>'
    clear: true
    say: 'Đăng ký hàm ngắn để thư viện gọi khi đổi trạng thái. Vòng lặp sáu lần; hai
      dấu cộng tăng biến đếm. Chạy đoạn việc luôn ném lỗi qua cầu dao. Bắt lỗi theo
      loại: chặn thì đếm, lỗi cố ý bỏ qua.'
  - show: '<p><b>R4j.java (tiếp): gọi 6 cuộc hỏng liên tiếp, đếm cuộc bị chặn</b></p><div
      class="code"><div>    CircuitBreaker cb = CircuitBreaker.of("dich-vu", cfg);</div><div>    cb.getEventPublisher().onStateTransition(e
      -&gt;</div><div>        System.out.println("chuyen: " + e.getStateTransition()));</div><div>    int
      tuChoi = 0;</div><div>    for (int i = 1; i &lt;= 6; i++) {</div><div>      try
      {</div><div>        cb.executeRunnable(() -&gt; { throw new IllegalStateException("hong");
      });</div><div>      } catch (CallNotPermittedException e) {</div><div>        tuChoi++;</div><div>      }
      catch (IllegalStateException e) { }</div><div>    }</div><div>    System.out.println("sau
      6 cuoc hong: trang thai " + cb.getState() + ", bi chan " + tuChoi);</div></div>'
    clear: true
    say: Mã gọi sáu cuộc hỏng liên tiếp nên cầu dao mở và chặn các cuộc cuối, rồi
      đếm cuộc bị chặn.
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>Thread.sleep(1100);</code></td><td>ngủ
      1100 mili giây, lâu hơn thời gian chờ 1000, nên cầu dao sang nửa mở</td></tr><tr><td><code>cb.executeRunnable(()
      -&gt; { });</code>, <code>cb.getState()</code></td><td>đoạn việc rỗng không
      ném lỗi, tức một cuộc tốt; <code>getState()</code> cho trạng thái hiện tại</td></tr></table>
    clear: true
    say: Ngủ một nghìn một trăm mili giây nên cầu dao nửa mở. Đoạn rỗng không ném
      lỗi là cuộc tốt; lệnh lấy trạng thái cho biết trạng thái hiện tại.
  - show: '<p><b>R4j.java (hết): ngủ 1 100 ms, lâu hơn thời gian chờ, rồi gọi một
      cuộc tốt</b></p><div class="code"><div>    Thread.sleep(1100);</div><div>    cb.executeRunnable(()
      -&gt; { });</div><div>    System.out.println("sau khi cho 1,1 giay va 1 cuoc
      tot: " + cb.getState());</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>chuyen:
      State transition from CLOSED to OPEN</div><div>sau 6 cuoc hong: trang thai OPEN,
      bi chan 2</div><div>chuyen: State transition from OPEN to HALF_OPEN</div><div>chuyen:
      State transition from HALF_OPEN to CLOSED</div><div>sau khi cho 1,1 giay va
      1 cuoc tot: CLOSED</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Rồi mã ngủ lâu hơn thời gian chờ nên nửa mở, và gọi một cuộc tốt. Thư viện
      đi đúng ba trạng thái ta cài, chỉ ở kịch bản này.
  - show: '<table class=''t''><tr><th>ca</th><th>cầu dao tự cài</th><th>thư viện thật</th></tr><tr><td>hỏng
      liên tiếp → mở</td><td>mở sau 3 cuộc hỏng</td><td>mở sau 4 cuộc hỏng (cửa sổ
      4, ngưỡng 50%)</td></tr><tr><td>cuộc gọi khi mở</td><td>chặn</td><td>bị chặn
      (CallNotPermittedException): 2 cuộc</td></tr><tr><td>nửa mở thử mấy cuộc</td><td>đúng
      1 cuộc</td><td>phải đặt <code>permittedNumberOfCallsInHalfOpenState(1)</code>;
      mặc định cho thử nhiều cuộc hơn, nên sau 1 cuộc tốt vẫn nửa mở</td></tr><tr><td>sau
      thời gian chờ</td><td>nửa mở, thử một cuộc</td><td>mở (OPEN) → nửa mở (HALF_OPEN)
      → đóng (CLOSED)</td></tr></table>'
    clear: true
    say: 'Khác nhau là cách đếm: bản tự cài mở sau ba cuộc hỏng, thư viện dùng cửa
      sổ bốn cuộc nên mở sau bốn. Nửa mở phải đặt thử một cuộc, ba trạng thái giống
      nhau ở cấu hình này, chưa chứng minh với mọi cấu hình.'
- id: quymo
  kind: example
  title: 'Khi tải lớn dần: bao nhiêu cuộc gọi tới dịch vụ đang hỏng?'
  checks:
  - alg.bnx_l30_breaker([i * 10000 // 100 for i in range(100)], 10**9)[0] == 12
  - alg.bnx_l30_breaker([i * 10000 // 10000 for i in range(10000)], 10**9)[0] == 12
