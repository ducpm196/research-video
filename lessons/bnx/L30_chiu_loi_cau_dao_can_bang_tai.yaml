- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l30_retry(6, 6, 50)[2] == 1550 and alg.bnx_l30_vach_qua(50, 2) == 25 and
    round(100 * (1 - alg.bnx_l30_vach_qua(50, 2) / 500)) == 95 and alg.bnx_l30_luong_cho(500,
    3.5) == 1750
  - alg.bnx_l30_retry(5, 5, 50)[2] == 50 + 100 + 200 + 400 == 750
  - alg.bnx_l30_bucket(4, 1, [(0, 9), (2000, 9)]) == [4, 2]
  - 500 * 10 == 5000
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Gọi
      tối đa 5 lần (lần đầu + 4 thử lại), gốc 50 ms, nhân đôi mỗi lần. Hỏng cả 5 lần:
      tổng chờ bao nhiêu (có chờ sau lần cuối không)? Nếu đề nói &laquo;thử lại 5
      lần&raquo; thì sao?</td></tr><tr><td>2</td><td>Xô token dung tích 4, nạp 1 token
      mỗi giây. 9 yêu cầu cùng lúc ở ms = 0, rồi 9 yêu cầu cùng lúc ở ms = 2 000.
      Mỗi đợt nhận mấy?</td></tr><tr><td>3</td><td>Quyết định (số minh hoạ): dịch
      vụ chấm điểm hay chậm 3–4 giây, mỗi giây 500 yêu cầu qua nó. Chọn: tăng hạn
      chót lên 10 giây, thử lại 3 lần, hay cầu dao + vách ngăn 50 chỗ + hạn chót 2
      giây? Vì sao?</td></tr></table>'
    pause: 30
    say: Đến lượt bạn, ba câu làm ra giấy. Câu một tính tổng chờ của thử lại có lùi
      khi hỏng cả năm lần, và khi đề nói thử lại năm lần. Câu hai tính mỗi đợt xô
      token nhận mấy yêu cầu. Câu ba chọn giữa tăng hạn chót, thử lại, hay cầu dao
      cùng vách ngăn. Hãy dừng lại làm rồi xem đáp án.
  - show: '<p>Câu 1: chờ sau mỗi lần hỏng, trừ lần cuối: 5 lần gọi chờ 4 lần: 50,
      100, 200, 400. &laquo;Thử lại 5 lần&raquo; là 6 lần gọi, chờ thêm 800: tổng
      1550 ms.</p>

      $$50 + 100 + 200 + 400 = \hlg{750} \text{ ms}; \quad \text{không chờ sau lần
      thứ 5}$$

      '
    focus:
    - 1
    - 2
    say: 'Đáp án câu một: ta chờ sau mỗi lần hỏng trừ lần cuối, nên năm lần gọi có
      bốn lần chờ: năm mươi, một trăm, hai trăm, bốn trăm, tổng bảy trăm năm mươi.
      Thử lại năm lần là sáu lần gọi, tổng một nghìn năm trăm năm mươi.'
    clear: true
  - show: '<p>Câu 2: mỗi đợt 9 yêu cầu; xô đầy 4 token; nạp 1 token mỗi giây nên đến
      2 000 ms thêm 2 token (tối đa 4).</p>

      $$\text{đợt 1: xô đầy 4 token} \Rightarrow \hlg{4}; \quad \text{sau } 2\,000
      \text{ ms: } 0 + 2 = 2 \Rightarrow \text{đợt 2: } \hlg{2}$$

      '
    focus:
    - - 1
    - 2
    - 2
    say: Đáp án câu hai, mỗi đợt có chín yêu cầu. Đợt một xô đầy bốn token nên nhận
      bốn. Nạp một token mỗi giây, sau hai giây xô có hai token, nên đợt hai nhận
      hai.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>tăng
      hạn chót lên 10 giây</td><td>ít lỗi hết giờ</td><td>500 yêu cầu/giây × 10 giây
      = 5 000 luồng chờ, nếu cuộc gọi treo tới hết hạn chót (chỉ chậm 3,5 giây thì
      ≈ 1 750): cạn luồng</td></tr><tr><td>thử lại 3 lần</td><td>che lỗi tạm thời</td><td>dịch
      vụ vốn chậm thì tải gấp 4; nghẽn thêm</td></tr><tr><td>cầu dao + vách ngăn 50
      chỗ + hạn chót 2 giây</td><td>tối đa 50 cuộc đồng thời; chậm thì bị từ chối
      sớm; hệ còn chạy</td><td>50 chỗ, mỗi cuộc giữ tối đa 2 giây nên chỉ ≤ 25 yêu
      cầu/giây qua được: ≈ 95% (475/500) bị từ chối; cuộc 3–4 giây vẫn quá hạn</td></tr></table>'
    say: 'Đáp án câu ba: hạn chót mười giây khiến năm trăm yêu cầu mỗi giây thành
      năm nghìn luồng chờ, nên cạn luồng. Thử lại ba lần thì tải gấp bốn. Cách thứ
      ba hợp lý nhất, nhưng khoảng chín mươi lăm phần trăm yêu cầu bị từ chối sớm.'
    clear: true
