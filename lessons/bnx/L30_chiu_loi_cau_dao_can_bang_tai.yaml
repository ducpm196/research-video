  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      (int n : new int[] {100, 10000}) { … }</code></td><td>duyệt từng phần tử của
      mảng vừa tạo bằng <code>new int[] {…}</code>: mỗi vòng <code>n</code> nhận 100,
      rồi 10000</td><td></td></tr><tr><td><code>CauDao c = new CauDao();</code></td><td>tạo
      một cầu dao mới từ lớp <code>CauDao</code> ở bước bốn: đóng, chưa hỏng cuộc
      nào</td><td></td></tr><tr><td><code>long ms = i * 10000L / n;</code>, <code>if
      (!c.choPhep(ms)) continue;</code></td><td><code>i * 10000L / n</code>: rải n
      yêu cầu đều trong 10000 ms; <code>!</code> đảo đúng thành sai; <code>continue</code>
      bỏ phần còn lại của vòng, sang vòng sau</td><td>n = 100: yêu cầu i đến lúc i
      × 100 ms</td></tr><tr><td><code>c.ghi(false, ms); that++;</code>, <code>4 *
      n</code></td><td>ghi một cuộc hỏng; <code>that++</code> đếm cuộc gọi thật; <code>4
      * n</code>: thử lại 3 lần là 4 cuộc mỗi yêu cầu</td><td></td></tr></table>'
    clear: true
    say: Vòng lặp duyệt từng phần tử, mỗi vòng một cỡ. Tạo cầu dao mới, rải đều n
      yêu cầu trong mười nghìn mili giây; chấm than đảo đúng sai; lệnh tiếp tục sang
      vòng sau. Ghi cuộc hỏng, đếm cuộc gọi thật; bốn nhân n là số cuộc khi không
      có cầu dao.
  - show: '<p><b>QuyMo.java (phần 1): n yêu cầu rải đều trong 10 giây sự cố, dịch
      vụ hỏng suốt</b></p><div class="code"><div>public class QuyMo {</div><div>  public
      static void main(String[] a) {</div><div>    for (int n : new int[] {100, 10000})
      {</div><div>      CauDao c = new CauDao();</div><div>      int that = 0;</div><div>      for
      (int i = 0; i &lt; n; i++) {</div><div>        long ms = i * 10000L / n;          //
      n yêu cầu rải đều trong 10 giây sự cố</div><div>        if (!c.choPhep(ms))
      continue;</div><div>        c.ghi(false, ms);</div><div>        that++;</div></div>'
    clear: true
    say: 'Mỗi yêu cầu tới dịch vụ đang hỏng: cầu dao chặn thì bỏ qua, cho qua thì
      ghi cuộc hỏng và đếm.'
  - show: '<p><b>QuyMo.java (phần 2): in số cuộc gọi không cầu dao (4n) và có cầu
      dao</b></p><div class="code"><div>      }</div><div>      System.out.println(n
      + " yeu cau, 10 giay su co: thu lai 3 lan khong cau dao "</div><div>          +
      4 * n + " cuoc goi, co cau dao " + that);</div><div>    }</div><div>  }</div><div>}</div></div><p><b>Tính
      tay trước khi chạy</b> (n = 100: yêu cầu i đến lúc i × 100 ms): ba cuộc hỏng
      đầu ở 0, 100, 200 ms mở cầu dao lúc 200 ms. Chờ 1 000 ms rồi cứ mỗi 1 000 ms
      thử một cuộc, và cuộc nào cũng hỏng: thử ở 1 200, 2 200, …, 9 200 ms, tức <b>9</b>
      cuộc (cuộc kế ở 10 200 ms ngoài 10 giây).</p>

      $$3 + 9 = \hl{12}\text{ cuộc gọi thật; } n = 10\,000 \text{ cũng vậy (mở lúc
      2 ms, thử ở 1 002, …, 9 002 ms)}$$

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Tính tay trước khi chạy: ba cuộc hỏng đầu mở cầu dao ngay. Rồi mỗi một nghìn
      mili giây cầu dao cho thử một cuộc, cuộc nào cũng hỏng, nên mười giây có chín
      cuộc thử. Ba cộng chín bằng mười hai cuộc gọi thật, với cả hai cỡ.'
  - show: '<p><b>Chạy thật: n yêu cầu rải đều trong 10 giây sự cố</b></p><div class="code"><div>100
      yeu cau, 10 giay su co: thu lai 3 lan khong cau dao 400 cuoc goi, co cau dao
      12</div><div>10000 yeu cau, 10 giay su co: thu lai 3 lan khong cau dao 40000
      cuoc goi, co cau dao 12</div></div>$$100 \to 10\,000 \;(\times 100): \; 400
      \to 40\,000 \text{ cuộc gọi; có cầu dao: } 12 \to \hlg{12}$$'
