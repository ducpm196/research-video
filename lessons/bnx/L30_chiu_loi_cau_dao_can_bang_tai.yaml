      y="110" width="420" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text
      x="270.0" y="158" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">dịch
      vụ A: 2 chỗ</text><rect x="60" y="230" width="420" height="80" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="3"/><text x="270.0" y="278" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">dịch vụ B: 2 chỗ</text><rect x="600" y="110"
      width="380" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text
      x="790.0" y="143" font-size="22" text-anchor="middle" fill="#1f2937">A chậm:
      giữ 2 chỗ</text><text x="790.0" y="173" font-size="22" text-anchor="middle"
      fill="#1f2937">cuộc thứ 3 bị từ chối ngay</text><rect x="600" y="230" width="380"
      height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text
      x="790.0" y="263" font-size="22" text-anchor="middle" fill="#1f2937">B vẫn còn
      đủ 2 chỗ</text><text x="790.0" y="293" font-size="22" text-anchor="middle" fill="#1f2937">không
      bị A kéo theo</text><rect x="1080" y="110" width="380" height="200" rx="10"
      fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1270.0" y="188" font-size="22"
      text-anchor="middle" fill="#1f2937">không vách ngăn:</text><text x="1270.0"
      y="218" font-size="22" text-anchor="middle" fill="#1f2937">A chậm chiếm hết
      luồng chung</text><text x="1270.0" y="248" font-size="22" text-anchor="middle"
      fill="#1f2937">B cũng đứng chờ</text><text x="750" y="380" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">Đánh đổi: từ chối sớm một số yêu cầu để cả
      hệ thống còn chạy</text></svg></div>'
    clear: true
    say: 'Hình thứ hai là vách ngăn: mỗi dịch vụ có hai chỗ riêng. A chậm giữ cả hai
      chỗ thì cuộc thứ ba tới A bị từ chối ngay, còn B vẫn đủ chỗ.'
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ hết giờ tới cầu dao'
  checks:
  - alg.bnx_l30_retry(2, 4, 100)[2] == 100 + 200 and alg.bnx_l30_retry(5, 4, 100)[2]
    == 100 + 200 + 400
  - alg.bnx_l30_retry_load(100, 3) == 400
  - alg.bnx_l30_bucket(5, 2, [(0, 12), (1000, 12)]) == [5, 2]
  steps:
  - show: '<p><b>Bước 1. Hết giờ.</b> Cuộc gọi không có hạn chót sẽ giữ luồng vô thời
      hạn khi dịch vụ kia treo. Nên mọi cuộc gọi ra ngoài phải có hạn chót, ngắn hơn
      hạn chót của chính yêu cầu đang xử lý.</p>

      $$\text{hạn chót cuộc gọi trong} < \text{hạn chót yêu cầu ngoài}$$

      '
    clear: true
    say: 'Bước một, hết giờ: cuộc gọi không hạn chót giữ luồng mãi khi dịch vụ kia
      treo, nên hạn chót cuộc gọi ngoài phải ngắn hơn hạn chót yêu cầu đang xử lý.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>static
      String chay(int hong, int toiDa, int goc) { … return "…"; }</code></td><td>khai
      hàm: <b>kiểu trả về</b> <code>String</code> (chuỗi chữ), tên <code>chay</code>,
      ba tham số số nguyên, mỗi tham số là kiểu rồi tên; <code>return</code> trả giá
      trị về chỗ gọi</td><td><code>chay(2, 4, 100)</code></td></tr><tr><td><code>for
      (int lan = 1; lan &lt;= toiDa; lan++) { … }</code></td><td>vòng lặp đếm: khai
      biến đếm; điều kiện còn lặp; bước sau mỗi vòng (<code>lan++</code> tăng 1)</td><td><code>lan</code>
      chạy 1, 2, 3, 4</td></tr><tr><td><code>int cho = 0;</code>, <code>cho += …</code>,
      <code>if (lan &gt; hong) return …;</code></td><td>khai biến số nguyên; <code>+=</code>
      cộng thêm vào biến; <code>if (đk) lệnh;</code> làm lệnh nếu điều kiện đúng</td><td>hỏng
      2 lần: lần 3 có <code>3 &gt; 2</code> nên thành công</td></tr><tr><td><code>"thanh
      cong o lan " + lan + ", cho tong " + cho + " ms"</code></td><td>dấu <code>+</code>
      giữa chuỗi và số nối chúng thành một chuỗi</td><td>ra <code>thanh cong o lan
      3, cho tong 300 ms</code></td></tr></table>'
    clear: true
    say: Khai hàm có kiểu trả về, tên và tham số; lệnh trả về đưa giá trị ra chỗ gọi.
      Vòng lặp đếm có biến đếm, điều kiện còn lặp, và bước tăng theo từng vòng. Dấu
      cộng bằng cộng thêm vào biến, và lệnh nếu làm câu sau khi điều kiện đúng. Dấu
      cộng giữa chuỗi và số nối thành một chuỗi.
  - show: '<p><b>Bước 2. Thử lại có lùi.</b> Thử lại ngay thì dồn thêm tải đúng lúc
      dịch vụ yếu. Nên chờ lâu dần: gốc 100 ms, nhân đôi mỗi lần.</p><p><b>ThuLai.java
      (đủ hàm chay)</b></p><div class="code"><div>  static String chay(int hong, int
      toiDa, int goc) {</div><div>    int cho = 0;</div><div>    for (int lan = 1;
      lan &lt;= toiDa; lan++) {</div><div>      if (lan &gt; hong)</div><div>        return
      "thanh cong o lan " + lan + ", cho tong " + cho + " ms";</div><div>      if
      (lan == toiDa)</div><div>        return "that bai sau " + toiDa + " lan, cho
      tong " + cho + " ms";</div><div>      cho += goc &lt;&lt; (lan - 1);          //
      100, 200, 400, ...</div><div>    }</div><div>    return "";</div><div>  }</div></div>'
    clear: true
    say: 'Bước hai, thử lại có lùi: thử lại ngay thì dồn tải đúng lúc dịch vụ yếu,
      nên ta chờ lâu dần, gốc một trăm mili giây, nhân đôi mỗi lần.'
  - show: $$100 + 200 =\hl{300}\text{ ms (hỏng 2 lần, thành công ở lần 3)}; \qquad
      100 + 200 + 400 = \hl{700}\text{ ms (4 lần đều hỏng)}$$
    clear: true
    say: Hỏng hai lần rồi thành công ở lần ba thì chờ một trăm cộng hai trăm, bằng
      ba trăm. Bốn lần đều hỏng thì chờ ba lần nên tổng bảy trăm.
  - show: '<p><b>Bước 3. Thử lại khuếch đại tải.</b> Nếu dịch vụ hỏng hẳn, mỗi yêu
      cầu thành 1 + r cuộc gọi (r là số lần thử lại): tải lên dịch vụ đang chết tăng
      đúng lúc nó cần nghỉ.</p>$$100 \times (1 + 3) = \hl{400}; \qquad 10\,000 \times
      (1 + 3) = \hl{40\,000} \text{ cuộc gọi}$$'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước ba, thử lại khuếch đại tải: dịch vụ hỏng hẳn thì mỗi yêu cầu thành
      một cộng r cuộc gọi, r là số lần thử lại. Nên tải lên dịch vụ đang chết tăng
      đúng lúc nó cần nghỉ: một trăm yêu cầu thành bốn trăm cuộc, mười nghìn thành
      bốn mươi nghìn.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>enum
      T { DONG, MO, NUA_MO }</code>, <code>T t = T.DONG;</code>, <code>t == T.MO</code></td><td><code>enum</code>:
      kiểu chỉ có đúng các giá trị liệt kê; <code>T t = T.DONG</code> khai biến <code>t</code>
      đang ở DONG; <code>==</code> hỏi hai giá trị có bằng nhau</td></tr><tr><td><code>boolean
      choPhep(long ms)</code>, <code>void ghi(boolean tot, long ms)</code></td><td><code>boolean</code>:
      đúng hoặc sai; <code>void</code>: không trả gì; <code>long</code>: số nguyên
      lớn; <code>return false;</code> trả sai</td></tr><tr><td><code>static final
      int NGUONG = 3;</code>, <code>int hong = 0;</code></td><td><code>final</code>:
      gán một lần rồi không đổi; <code>static</code>: một bản chung cho cả lớp; <code>hong</code>:
      trường, nhớ giá trị giữa các lần gọi hàm</td></tr><tr><td><code>if (…) { … }
      else if (tot) { … } else if (++hong &gt;= NGUONG) { … }</code></td><td>chuỗi
      điều kiện: nhánh nào đúng trước thì làm, bỏ các nhánh sau; <code>++hong</code>
      tăng <code>hong</code> 1 rồi lấy giá trị mới; <code>&gt;=</code>: lớn hơn hoặc
      bằng</td></tr></table>'
    clear: true
    say: Kiểu liệt kê chỉ có các giá trị nêu ra, và hai dấu bằng hỏi hai giá trị có
      bằng nhau. Hàm trả đúng sai, hoặc rỗng là không trả gì. Hằng gán một lần nên
      không đổi; trường nhớ giá trị giữa các lần gọi. Làm nhánh đúng đầu tiên; hai
      dấu cộng đặt trước tăng biến rồi lấy giá trị mới.
  - show: '<p><b>Bước 4. Cầu dao.</b> Để dịch vụ hỏng được nghỉ, ta đếm hỏng liên
      tiếp. Đủ ngưỡng thì <b>mở</b>: chặn ngay. Sau thời gian chờ thì <b>nửa mở</b>:
      thử một cuộc. Cầu dao nhớ trạng thái, nên không cần thử lại mù quáng.</p><p><b>CauDao.java
      (trích): cho phép hay chặn</b></p><div class="code"><div>  boolean choPhep(long
      ms) {</div><div>    if (t == T.MO) {</div><div>      if (ms - moLuc &lt; CHO)
      return false;</div><div>      t = T.NUA_MO;                      // hết thời
      gian chờ: cho thử một cuộc</div><div>    }</div><div>    return true;</div><div>  }</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước bốn là cầu dao: dịch vụ hỏng cần nghỉ nên ta đếm số lần hỏng liên tiếp,
      đủ ngưỡng thì mở và chặn ngay. Hàm này nhìn thời điểm hiện tại: chưa đủ thời
      gian chờ thì chặn, đủ rồi thì nửa mở và cho thử một cuộc.'
  - show: '<p><b>CauDao.java (trích): ghi nhận kết quả mỗi cuộc gọi</b></p><div class="code"><div>  void
      ghi(boolean tot, long ms) {</div><div>    if (t == T.NUA_MO) {</div><div>      if
      (tot) { t = T.DONG; hong = 0; } else { t = T.MO; moLuc = ms; }</div><div>    }
      else if (tot) {</div><div>      hong = 0;</div><div>    } else if (++hong &gt;=
      NGUONG) {</div><div>      t = T.MO;</div><div>      moLuc = ms;</div><div>    }</div><div>  }</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Hàm ghi nhận kết quả rồi chuyển trạng thái theo kết quả đó. Đang nửa mở thì
      cuộc tốt đóng lại, cuộc hỏng mở lại. Ở trạng thái khác, cuộc tốt xoá bộ đếm
      hỏng, cuộc hỏng tăng bộ đếm, đủ ngưỡng ba thì mở.
  - show: '<p><b>Bước 5. Vách ngăn và giới hạn tốc độ.</b> Vách ngăn: mỗi dịch vụ
      phụ thuộc có số chỗ riêng (bộ đếm chỗ). Giới hạn tốc độ ở <b>cổng API</b> (cửa
      chung mọi yêu cầu từ ngoài đi qua trước khi vào các dịch vụ): <b>xô token</b>,
      dung tích 5, nạp 2 token mỗi giây. Một <b>đợt dồn</b> (burst) 12 yêu cầu cùng
      lúc thì nhận 5, từ chối 7.</p>$$0 + 1 \times 2 = 2 \text{ token sau 1 giây (tối
      đa 5)} \Rightarrow \text{nhận } \hlg{2}$$'
    focus:
    - 1
    - 2
    - 2
    introduces:
    - bnx_burst
    - implies
    clear: true
    say: 'Bước năm: vách ngăn cho mỗi dịch vụ số chỗ riêng nên dịch vụ chậm không
      chiếm hết luồng. Giới hạn tốc độ đặt ở cổng API, cửa chung của yêu cầu từ ngoài,
      dùng xô token dung tích năm, nạp hai token mỗi giây. Đợt dồn mười hai yêu cầu
      nhận năm, từ chối bảy.'
  - show: '<p><b>Bước 6. Cân bằng tải</b> là chia yêu cầu đến cho nhiều máy cùng làm
      một việc. <b>Xoay vòng</b>: lần lượt từng máy, không biết máy nào đang bận.
      <b>Ít kết nối nhất</b>: gửi cho máy đang xử lý ít việc nhất, tốt khi thời gian
      mỗi việc chênh nhiều.</p>'
    clear: true
    say: Bước sáu là cân bằng tải, chia yêu cầu cho nhiều máy cùng làm một việc. Xoay
      vòng gửi lần lượt từng máy, không biết máy nào bận. Cách ít kết nối nhất gửi
      cho máy ít việc nhất.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>int[]
      dur = {100, 10, …};</code>, <code>dur[i]</code></td><td>mảng số nguyên: <code>{…}</code>
      liệt kê các ô; <code>dur[i]</code> là ô thứ i, ô đầu là <code>dur[0]</code></td><td>việc
      đầu nặng 100 ms</td></tr><tr><td><code>long[][] ketThuc = new long[2][8];</code></td><td>mảng
      hai chiều, 2 hàng 8 cột: <code>ketThuc[s][k]</code> là giờ kết thúc của cuộc
      thứ k ở máy s; ô mới bằng 0</td><td></td></tr><tr><td><code>long ms = i * 10L;</code></td><td><code>10L</code>:
      số nguyên lớn; yêu cầu thứ i đến lúc i × 10 mili giây</td><td>yêu cầu 3 đến
      lúc 30 ms</td></tr></table>'
    clear: true
    say: 'Mảng là dãy ô, và chỉ số chọn ô, nghĩa là ô đầu có chỉ số không. Mảng hai
      chiều như bảng: hàng là máy, cột là cuộc. Chữ L sau số là số nguyên lớn.'
  - show: '<p><b>CanBang.java hàm chay (phần 1): 8 yêu cầu, việc đầu nặng 100 ms,
      việc sau 10 ms</b></p><div class="code"><div>  static int[] chay(boolean it)
      {</div><div>    int[] dur = {100, 10, 10, 10, 10, 10, 10, 10};   // mili giây
      mỗi yêu cầu</div><div>    int[] max = {0, 0};</div><div>    long[][] ketThuc
      = new long[2][8];</div><div>    int[] soCuoc = {0, 0};</div><div>    for (int
      i = 0; i &lt; dur.length; i++) {</div><div>      long ms = i * 10L;                 //
      yêu cầu i đến lúc i × 10 ms</div><div>      int[] dang = new int[2];</div></div>'
    clear: true
    say: Mô phỏng có tám yêu cầu cách nhau mười mili giây, nên việc đầu nặng một trăm
      chồng lên các việc sau mười.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      (int s…) for (int k…) if (ketThuc[s][k] &gt; ms) dang[s]++;</code></td><td>hai
      vòng lồng nhau: đếm các cuộc của máy s chưa kết thúc lúc ms, tức cuộc đang chạy</td><td></td></tr><tr><td><code>int
      s = it ? (dang[1] &lt; dang[0] ? 1 : 0) : i % 2;</code></td><td><code>đk ? a
      : b</code> cho a nếu đúng, ngược lại b; ít kết nối nhất: máy 1 nếu <code>dang[1]
      &lt; dang[0]</code>, không thì máy 0; xoay vòng: <code>i % 2</code> (phần dư)</td><td>i
      = 3 xoay vòng: 3 % 2 = 1</td></tr><tr><td><code>ketThuc[s][soCuoc[s]++] = ms
      + dur[i];</code></td><td>ghi giờ kết thúc vào ô kế tiếp của máy s; <code>soCuoc[s]++</code>
      dùng giá trị rồi tăng 1</td><td></td></tr><tr><td><code>max[s] = Math.max(max[s],
      dang[s]);</code></td><td>giữ số lớn hơn trong hai số: <code>max[s]</code> là
      số cuộc đồng thời lớn nhất đã gặp ở máy s</td><td></td></tr></table>'
    clear: true
    say: Hai vòng lồng nhau đếm cuộc còn chạy của mỗi máy. Phép chọn ba ngôi cho giá
      trị đầu nếu đúng, ngược lại giá trị sau, theo điều kiện đứng trước dấu hỏi.
      Ghi giờ kết thúc vào ô kế tiếp; hai dấu cộng đặt sau tăng sau khi dùng. Hàm
      lấy số lớn giữ mức đồng thời cao nhất.
  - show: '<p><b>CanBang.java hàm chay (phần 2): chọn máy, ghi giờ kết thúc, giữ số
      đồng thời lớn nhất</b></p><div class="code"><div>      for (int s = 0; s &lt;
      2; s++)</div><div>        for (int k = 0; k &lt; soCuoc[s]; k++) if (ketThuc[s][k]
      &gt; ms) dang[s]++;</div><div>      int s = it ? (dang[1] &lt; dang[0] ? 1 :
      0) : i % 2;</div><div>      ketThuc[s][soCuoc[s]++] = ms + dur[i];</div><div>      dang[s]++;</div><div>      max[s]
      = Math.max(max[s], dang[s]);</div><div>    }</div><div>    return max;</div><div>  }</div></div>'
    clear: true
    say: Mỗi yêu cầu đếm cuộc đang chạy ở từng máy, chọn máy theo cách chia, ghi giờ
      kết thúc, rồi giữ số đồng thời lớn nhất.
- id: example
  kind: example
  title: Ví dụ chạy thật, từng phép tính
  checks:
  - alg.bnx_l30_retry(2, 4, 100) == ('ok', 3, 300)
  - alg.bnx_l30_breaker([i * 500 for i in range(9)], 2500)[:2] == (7, 2)
  - alg.bnx_l30_bucket(5, 2, [(0, 12), (1000, 12)]) == [5, 2]
  steps:
  - show: '<p><b>Chạy thật: biên dịch rồi chạy từng chương trình (JDK 21 thuần)</b></p><div
      class="code"><div>javac -encoding UTF-8 ThuLai.java CauDao.java VachNgan.java
      GioiHan.java CanBang.java QuyMo.java</div><div>for c in ThuLai CauDao VachNgan
      GioiHan CanBang QuyMo; do</div><div>  java -Dstdout.encoding=UTF-8 <span>&#36;</span>c</div><div>done</div></div><div
