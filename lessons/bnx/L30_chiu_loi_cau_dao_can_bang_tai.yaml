scenes:
- id: hook
  kind: hook
  title: 'Dịch vụ phụ thuộc chết: bốn trăm cuộc gọi hay mười hai?'
  checks:
  - alg.bnx_l30_retry_load(100, 3) == 400 and alg.bnx_l30_retry_load(10000, 3) ==
    40000
  - alg.bnx_l30_breaker([i * 100 for i in range(100)], 10**9)[0] == 12
  steps:
  - show: '<p>Dịch vụ tra cứu hạn mức của ngân hàng gọi một dịch vụ chấm điểm. Dịch
      vụ chấm điểm gặp sự cố 10 giây. Mỗi yêu cầu của khách <b>thử lại 3 lần</b> khi
      lỗi.</p>

      <div class="box key">100 yêu cầu thành <b>400</b> cuộc gọi tới dịch vụ đang
      hỏng; 10 000 yêu cầu thành <b>40 000</b>. Có <b>cầu dao</b>: cả hai trường hợp
      chỉ còn <b>12</b> cuộc gọi thật.

      Vì sao thử lại lại làm sự cố nặng thêm, và cầu dao khác gì?</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Chào bạn, dịch vụ tra cứu hạn mức gọi dịch vụ chấm điểm đang gặp sự cố mười
      giây. Mỗi yêu cầu thử lại ba lần khi lỗi. Một trăm yêu cầu thành bốn trăm cuộc
      gọi tới dịch vụ đang hỏng, mười nghìn thành bốn mươi nghìn. Có cầu dao thì cả
      hai chỉ còn mười hai cuộc gọi thật. Vì sao thử lại làm sự cố nặng thêm, và cầu
      dao khác gì?
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l30_retry(2, 4, 100) == ('ok', 3, 300)
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      hết giờ (timeout)</td><td>chờ tối đa một khoảng thời gian rồi bỏ cuộc gọi</td><td>gọi
      dịch vụ chấm điểm tối đa 2 giây</td></tr><tr><td>② thử lại</td><td>gọi lại khi
      lỗi; lỗi tạm thời thì lần sau có thể thành công. <b>r lần thử lại = 1 + r lần
      gọi</b> (lần đầu không tính)</td><td>tối đa 4 lần gọi = lần đầu + 3 thử lại</td></tr><tr><td>③
      lỗi tạm thời và lỗi lâu</td><td>tạm thời: mạng chập chờn; lâu: dịch vụ chết
      cả phút</td><td>thử lại hợp với loại đầu, có hại với loại sau</td></tr><tr><td>④
      đồng thời và luồng</td><td>đồng thời: nhiều cuộc gọi chạy cùng lúc. <b>Luồng</b>
      (thread): một dây việc chạy riêng; mỗi cuộc gọi đang chờ giữ một luồng</td><td>500
      cuộc chờ cùng lúc = 500 luồng bị giữ</td></tr><tr><td>⑤ đồng hồ giả</td><td>thay
      giờ thật bằng số mili giây ta truyền vào, để chạy lại ra đúng kết quả cũ</td><td>t
      = 500 ms, 1 000 ms…</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: 'Trước hết ta cần hiểu năm điều, hết giờ là chờ tối đa một khoảng rồi bỏ
      cuộc gọi. Thử lại là gọi lại khi lỗi: r lần thử lại là một cộng r lần gọi. Lỗi
      tạm thời khác lỗi lâu, và thử lại có hại với loại sau. Đồng thời là nhiều cuộc
      chạy cùng lúc, mỗi cuộc giữ một luồng. Đồng hồ giả thay giờ thật bằng số mili
      giây truyền vào.'
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l30_retry(5, 4, 100) == ('that bai', 4, 700)
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>DONG</code>,
      <code>MO</code>, <code>NUA_MO</code></td><td>ba trạng thái cầu dao: đóng (cho
      gọi), mở (chặn), nửa mở (thử một cuộc)</td></tr><tr><td><code>goc &lt;&lt; (lan
      - 1)</code></td><td>dịch sang trái các chữ số 0 và 1 (bit) của số trong máy:
      mỗi vị trí dịch là nhân đôi. Lần 1 dịch 0 vị trí → 100; lần 2 dịch 1 → 200;
      lần 3 dịch 2 → 400</td></tr><tr><td><code>Semaphore</code></td><td>bộ đếm chỗ:
      có bao nhiêu chỗ thì bấy nhiêu cuộc gọi cùng lúc, hết chỗ thì từ chối</td></tr><tr><td>xô
      token</td><td>xô chứa token, nạp đều mỗi giây; mỗi yêu cầu lấy một token, hết
      token thì từ chối</td></tr><tr><td>ít kết nối nhất</td><td>gửi việc mới cho
      máy đang xử lý ít việc nhất</td></tr><tr><td><code>CallNotPermittedException</code></td><td>ngoại
      lệ (thông báo lỗi chương trình ném ra) của thư viện chịu lỗi khi cầu dao đang
      mở và chặn cuộc gọi</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: 'Ba trạng thái cầu dao: đóng cho gọi, mở thì chặn, nửa mở thử một cuộc. Phép
      dịch sang trái nhân đôi mỗi vị trí: một trăm, hai trăm, bốn trăm. Bộ đếm chỗ
      hết chỗ thì từ chối. Xô token nạp đều, mỗi yêu cầu lấy một token. Ít kết nối
      nhất gửi việc cho máy ít việc nhất. Ngoại lệ chặn là lỗi báo khi cầu dao mở.'
