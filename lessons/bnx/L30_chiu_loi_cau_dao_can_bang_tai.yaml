objectives:
- Tính tổng thời gian chờ của thử lại có lùi theo luỹ thừa 2 và nói khi nào thử lại
  có hại
- Đọc chuỗi trạng thái của cầu dao ba trạng thái theo đồng hồ giả và đếm cuộc gọi
  bị chặn
- 'So sánh cầu dao tự cài với Resilience4j thật: cùng ba trạng thái, khác cách đếm
  hỏng'
- Giải thích vách ngăn bằng bộ đếm chỗ giới hạn số cuộc gọi đồng thời
- Tính số yêu cầu nhận và từ chối của giới hạn tốc độ kiểu xô token
- So sánh chia xoay vòng với chia cho máy ít kết nối nhất
- Viết cầu dao nhỏ với đồng hồ giả
