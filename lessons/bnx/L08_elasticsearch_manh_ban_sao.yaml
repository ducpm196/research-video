- id: formula
  kind: formula
  title: 'Suy ra từng bước: bản ghi nằm ở đâu, và vì sao chưa thấy ngay'
  checks:
  - alg.bnx_shard(17, 3) == 2
  - alg.bnx_total_shards(3, 1) == 6
  - alg.bnx_shard(17, 4) == 1
  - alg.bnx_keep_cycle(3, 4)[:2] == (3, 12)
  - alg.bnx_refresh_sim([(0, 'd1')], [0.0, 1.0]) == [0, 1]
  steps:
  - show: '<p><b>Bước 1.</b> Mọi máy phải tự tính ra mảnh của một bản ghi mà không
      tra bảng lớn, nên dùng một công thức cố định:</p>

      $$\text{mảnh} = \text{băm}(\text{khoá định tuyến}) \text{ mod } \text{số mảnh
      chính}$$

      <span class=''note''>Làm thử: băm = 17, có 3 mảnh chính → 17 mod 3 = 2. Bài
      dùng băm minh hoạ; hàm băm thật của Elasticsearch là murmur3, không phải hàm
      này. Công thức này cho chỉ mục tạo từ bản 9.4; chỉ mục cũ hơn thêm một bước
      chia, nhưng vẫn phụ thuộc số mảnh chính.</span>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    say: Bước một, vì mọi máy phải tự tính ra mảnh mà không tra bảng lớn, nên ta dùng
      công thức cố định. Mảnh bằng giá trị băm của khoá định tuyến, chia lấy dư cho
      số mảnh chính. Ba chữ m o d là viết tắt của phép lấy số dư. Làm thử, băm ra
      mười bảy, có ba mảnh chính, thì mười bảy chia ba dư hai.
  - show: '<p><b>Bước 2.</b> Mỗi mảnh chính có thêm một số bản sao, nên</p>

      $$\text{tổng số mảnh} = \text{số mảnh chính} \cdot (1 + \text{số bản sao})$$

      <p class=''note''>Làm thử: $3 \cdot (1 + 1) = 6$.</p>

      '
    focus:
    - 2
    - 2
    - 3
    say: Bước hai, vì mỗi mảnh chính còn có thêm các bản sao của nó, nên tổng số mảnh
      bằng số mảnh chính nhân với một cộng số bản sao. Dấu chấm ở giữa là phép nhân.
      Làm thử, ba nhân với một cộng một, bằng sáu.
  - show: '<p><b>Bước 3.</b> Công thức chia cho số mảnh chính, nên đổi số này thì
      số dư đổi theo:</p>

      $$17 \text{ mod } 4 = 1 \neq 2$$

      <span class=''note''>Bản ghi đang nằm ở mảnh 2, nhưng lấy, sửa, xoá theo mã
      thì máy tới thẳng mảnh 1, nên không thấy. Vì vậy số mảnh chính chỉ đặt được
      lúc tạo chỉ mục.</span>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    clear: true
    say: Bước ba, vì công thức chia cho số mảnh chính, nên đổi số này thì số dư cũng
      đổi. Mười bảy chia bốn dư một, khác hai. Bản ghi đang ở mảnh hai, nhưng khi
      lấy theo mã, máy tới thẳng mảnh một, nên không thấy. Vì vậy số mảnh chính chỉ
      đặt được lúc tạo chỉ mục.
  - show: '<p><b>Bước 4. Đếm bao nhiêu giá trị băm giữ nguyên mảnh</b></p><div class="code"><div>def
      shard(h, n_primary):</div><div>    return h % n_primary      # mảnh = băm mod
      số mảnh chính</div><div>print("h = 17:", shard(17, 3), "-&gt;", shard(17, 4))</div><div>same
      = [h for h in range(12) if shard(h, 3) == shard(h, 4)]</div><div>print("giữ
      mảnh:", same, len(same), "/ 12")</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>h = 17: 2 -&gt; 1</div><div>giữ mảnh: [0, 1, 2] 3 / 12</div></div><p
      class="note"><code>def shard(h, n): return h % n</code>: định nghĩa hàm nhận
      <code>h</code>, <code>n</code>; <code>return</code> trả kết quả ra. <code>h
      % n</code>: số dư khi chia <code>h</code> cho <code>n</code>. <code>[h for h
      in range(12) if …]</code>: cách viết gọn, giữ những <code>h</code> từ 0 tới
      11 thoả điều kiện.</p>'
    focus:
    - 1
    - 1
    - '2.4'
    - '4.2'
    clear: true
    say: Bước bốn, hàm nhận giá trị băm và số mảnh rồi trả số dư. Số dư khi chia ba
      và khi chia bốn lặp lại sau mỗi mười hai giá trị, vì mười hai là số nhỏ nhất
      chia hết cho cả ba và bốn. Nên chỉ cần đếm mười hai giá trị. Chạy thật, chỉ
      có không, một và hai là giữ nguyên mảnh, tức ba trên mười hai.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>buffer,
      searchable = [], []</code></td><td>gán hai danh sách rỗng một lúc: vùng đệm
      và phần đã mở cho việc tìm</td></tr><tr><td><code>append(x)</code>, <code>extend(l)</code>,
      <code>clear()</code></td><td>thêm <code>x</code> vào cuối danh sách; thêm cả
      danh sách <code>l</code>; làm rỗng</td></tr><tr><td><code>word in d.split()</code></td><td><code>d.split()</code>
      là danh sách từ của <code>d</code>; đúng khi <code>d</code> có đúng từ <code>word</code></td></tr></table>'
    clear: true
    say: Mô phỏng sắp tới có vài cách viết mới, nên ta giải nghĩa trước. Hai danh
