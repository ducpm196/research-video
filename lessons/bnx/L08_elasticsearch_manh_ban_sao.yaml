- id: formula
  kind: formula
  title: 'Suy ra từng bước: bản ghi nằm ở đâu, và vì sao chưa thấy ngay'
  checks:
  - alg.bnx_shard(17, 3) == 2
  - alg.bnx_total_shards(3, 1) == 6
  - alg.bnx_shard(17, 4) == 1
  - alg.bnx_keep_cycle(3, 4)[:2] == (3, 12)
  - alg.bnx_refresh_sim([(0, 'd1')], [0.0, 1.0]) == [0, 1]
  steps:
  - show: '<p><b>Bước 1.</b> Mọi máy phải tự tính ra mảnh của một bản ghi mà không
      tra bảng lớn, nên dùng một công thức cố định:</p>

      $$\text{mảnh} = \text{băm}(\text{khoá định tuyến}) \text{ mod } \text{số mảnh
      chính}$$

      <span class=''note''>Làm thử: băm = 17, có 3 mảnh chính → 17 mod 3 = 2. Bài
      dùng băm minh hoạ; hàm băm thật của Elasticsearch khác. Công thức này cho chỉ
      mục tạo từ bản 9.4; chỉ mục cũ hơn thêm một bước chia, nhưng vẫn phụ thuộc số
      mảnh chính.</span>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Bước một, vì mọi máy phải tự tính ra mảnh của một bản ghi mà không phải tra
      một bảng lớn, nên ta dùng công thức cố định. Mảnh bằng giá trị băm của khoá
      định tuyến, chia lấy dư cho số mảnh chính. Ba chữ m o d trên màn hình là viết
      tắt của phép lấy số dư. Làm thử, băm ra mười bảy, có ba mảnh chính, thì mười
      bảy chia ba dư hai. Bài này dùng một hàm băm minh hoạ, còn hàm băm thật của
      hệ thống thì khác, và công thức này áp dụng cho chỉ mục tạo từ bản chín phẩy
      bốn.
  - show: '<p><b>Bước 2.</b> Mỗi mảnh chính có thêm một số bản sao, nên</p>

      $$\text{tổng số mảnh} = \text{số mảnh chính} \cdot (1 + \text{số bản sao})$$

      <p class=''note''>Làm thử: $3 \cdot (1 + 1) = 6$.</p>

      '
    focus:
    - 2
    - 2
    - 3
    say: Bước hai, vì mỗi mảnh chính còn có thêm các bản sao của nó, nên tổng số mảnh
      bằng số mảnh chính nhân với một cộng số bản sao. Dấu chấm ở giữa là phép nhân.
      Làm thử, ba nhân với một cộng một, bằng sáu.
  - show: '<p><b>Bước 3.</b> Công thức chia cho số mảnh chính, nên đổi số này thì
      số dư đổi theo:</p>

      $$17 \text{ mod } 4 = 1 \neq 2$$

      <span class=''note''>Bản ghi đang nằm ở mảnh 2, nhưng lấy, sửa, xoá theo mã
      thì máy tới thẳng mảnh 1, nên không thấy. Vì vậy số mảnh chính chỉ đặt được
      lúc tạo chỉ mục.</span>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    clear: true
    say: Bước ba, vì công thức chia cho số mảnh chính, nên đổi số này thì số dư cũng
      đổi. Mười bảy chia bốn dư một, khác hai. Bản ghi đang nằm ở mảnh hai, nhưng
      khi lấy theo mã, máy tới thẳng mảnh một, nên không thấy. Vì vậy số mảnh chính
      chỉ đặt được lúc tạo chỉ mục.
  - show: '<p><b>Bước 4. Đếm bao nhiêu giá trị băm giữ nguyên mảnh</b></p><div class="code"><div>def
      shard(h, n_primary):</div><div>    return h % n_primary      # mảnh = băm mod
      số mảnh chính</div><div>print("h = 17:", shard(17, 3), "-&gt;", shard(17, 4))</div><div>same
      = [h for h in range(12) if shard(h, 3) == shard(h, 4)]</div><div>print("giữ
      mảnh:", same, len(same), "/ 12")</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>h = 17: 2 -&gt; 1</div><div>giữ mảnh: [0, 1, 2] 3 / 12</div></div>'
    focus:
    - 1
    - '2.4'
    - '4.2'
    clear: true
    say: Bước bốn, số dư khi chia ba và khi chia bốn lặp lại sau mỗi mười hai giá
      trị, vì mười hai là bội chung nhỏ nhất của ba và bốn. Nên chỉ cần đếm mười hai
      giá trị băm. Chạy thật, chỉ có không, một và hai là giữ nguyên mảnh, tức ba
      trên mười hai.
  - show: '<p><b>Bước 5. Mô phỏng làm tươi</b></p><div class="code"><div>buffer, searchable
      = [], []</div><div>def write(doc):</div><div>    buffer.append(doc)</div><div>def
      refresh():                # mặc định mỗi 1 giây</div><div>    searchable.extend(buffer)</div><div>    buffer.clear()</div><div>def
      search(word):</div><div>    return [d for d in searchable if word in d.split()]</div><div>write("chuyển
      tiền napas")</div><div>print("ngay sau khi ghi:", search("napas"))</div><div>refresh()</div><div>print("sau
      lần làm tươi:", search("napas"))</div></div>'
    focus:
    - '2.3'
    - '2.4'
    - '2.9'
    clear: true
    say: Bước năm, vì bản ghi mới chỉ vào vùng đệm, còn lượt tìm chỉ đọc phần đã mở,
      nên phải có bước làm tươi chuyển vùng đệm sang phần tìm được. Hàm làm tươi chuyển
      hết vùng đệm sang phần tìm được rồi xoá vùng đệm. Ta ghi một bản ghi, tìm ngay,
      làm tươi, rồi tìm lại.
  - show: '<p><b>Bước 5. Kết quả chạy thật</b></p><div class="code"><div>ngay sau
      khi ghi: []</div><div>sau lần làm tươi: [''chuyển tiền napas'']</div></div>'
    focus:
    - '2.1'
    - '2.2'
    clear: true
    say: Chạy thật, ngay sau khi ghi thì kết quả rỗng, vì bản ghi còn nằm trong vùng
      đệm. Sau một lần làm tươi thì tìm thấy bản ghi chuyển tiền NAPAS.
- id: example
  kind: example
  title: Ví dụ chỉ mục giao dịch, từng phép tính
  checks:
  - alg.bnx_total_shards(3, 1) == 6
  - alg.bnx_shard(17, 3) == 2
  - alg.bnx_shard(17, 4) == 1
  - alg.bnx_keep_cycle(3, 4) == (3, 12, __import__('fractions').Fraction(1, 4))
  - (1 - alg.bnx_keep_cycle(3, 4)[2]) * 1200000 == 900000
  steps:
  - show: '<p>Chỉ mục giao dịch có 3 mảnh chính, mỗi mảnh 1 bản sao; chứa $1\,200\,000$
      bản ghi (số minh hoạ).</p>

      $$① \; 3 \cdot (1 + 1) = \hl{6}\ \text{mảnh}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta làm một ví dụ. Chỉ mục giao dịch có ba mảnh chính, mỗi mảnh một bản sao,
      và chứa một triệu hai trăm nghìn bản ghi, đây là số minh hoạ. Phép tính thứ
      nhất, tổng số mảnh bằng ba nhân với một cộng một, tức sáu mảnh.
  - show: '<p>Bản ghi tx1001 có băm minh hoạ 17.</p>

      $$② \; 17 \text{ mod } 3 = \hlg{2}\ \text{(mảnh chính P2)}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ hai, bản ghi mã một nghìn không trăm linh một có giá trị băm
      minh hoạ mười bảy. Mười bảy chia ba dư hai, nên nó nằm ở mảnh chính số hai.
  - show: '<p>Nếu đổi thành 4 mảnh chính:</p>

      $$③ \; 17 \text{ mod } 4 = \hl{1} \neq 2$$

      '
    focus:
    - 2
    - 2
    say: Phép tính thứ ba, nếu đổi thành bốn mảnh chính, thì mười bảy chia bốn dư
      một, khác với hai ở phép thứ hai. Vậy máy sẽ tìm nhầm mảnh.
  - show: '<p>Trên một vòng 12 giá trị băm, giá trị giữ mảnh là 0, 1, 2:</p>

      $$④ \; \frac{3}{12} = \hlg{25\%}\ \text{giữ mảnh cũ}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, trên một vòng mười hai giá trị băm, chỉ ba giá trị giữ
      mảnh cũ. Ba trên mười hai bằng hai mươi lăm phần trăm.
  - show: '<p>Dùng lại $25\%$ ở phép ④ và $1\,200\,000$ bản ghi.</p>

      $$⑤ \; (100\% - 25\%) \cdot 1\,200\,000 = \hl{900\,000}\ \text{bản ghi phải
      chuyển mảnh}$$

      <div class="box key">Không sửa tại chỗ được: phải <b>tạo chỉ mục mới</b> 4 mảnh
      chính rồi <b>chép lại</b> (reindex).</div>

      '
    focus:
    - 1
    - 2
    - 3
    say: Phép tính thứ năm, dùng lại hai mươi lăm phần trăm của phép thứ tư. Còn bảy
      mươi lăm phần trăm phải chuyển, nhân một triệu hai trăm nghìn, là chín trăm
      nghìn bản ghi. Vì gần như mọi bản ghi phải dời chỗ, hệ thống không đổi tại chỗ,
      mà phải tạo chỉ mục mới có bốn mảnh chính rồi chép lại toàn bộ.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: băm thật trên 1 200 mã'
  checks:
  - alg.bnx_crc_keep(1200, 3, 4) == 315
  - round(alg.bnx_crc_keep(1200, 3, 4) / 1200, 3) == 0.263
  - alg.bnx_split_ok(3, 2)
  - 1 - alg.bnx_keep_cycle(3, 4)[2] == __import__('fractions').Fraction(3, 4)
  steps:
  - show: '<p><b>Đường khác: băm CRC32 cho 1 200 mã giao dịch</b></p><div class="code"><div>import
      zlib</div><div>def shard(doc_id, n):         # băm minh hoạ: CRC32</div><div>    return
      zlib.crc32(doc_id.encode()) % n</div><div>ids = [f"tx{i}" for i in range(1,
      1201)]</div><div>stay = sum(shard(d, 3) == shard(d, 4) for d in ids)</div><div>print(stay,
      "/", len(ids), "=", round(stay / len(ids), 3))</div><div>split = all(shard(d,
      6) % 3 == shard(d, 3) for d in ids)</div><div>print("tách 3 -&gt; 6, mảnh mới
      nằm trong mảnh cũ:", split)</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>315
      / 1200 = 0.263</div><div>tách 3 -&gt; 6, mảnh mới nằm trong mảnh cũ: True</div></div>'
    focus:
    - 2
    - 2
    - '4.1'
    - '4.2'
    - '4.2'
    say: Kiểm bằng đường khác. Thay vì đếm trên vòng mười hai giá trị, ta băm thật
      một nghìn hai trăm mã giao dịch bằng hàm băm có sẵn trong Python, rồi so mảnh
      khi chia ba và chia bốn. Kết quả là ba trăm mười lăm trên một nghìn hai trăm,
      khoảng hai mươi sáu phần trăm, rất gần hai mươi lăm phần trăm. Dòng cuối kiểm
      một điều khác. Khi tách ba mảnh thành sáu, mọi bản ghi ở mảnh mới vẫn nằm trong
      đúng mảnh cũ của nó.
  - show: '<table class=''t''><tr><th>số mảnh chính mới</th><th>cách làm</th><th>vì
      sao</th></tr><tr><td>6 (bội của 3)</td><td>tách mảnh (split) sang chỉ mục mới:
      mỗi mảnh cũ tách đôi; chỉ mục cũ phải tạm chỉ đọc</td><td>h mod 6 rồi mod 3
      = h mod 3: bản ghi không rời mảnh cha</td></tr><tr><td>4 (không phải bội của
      3)</td><td>tạo chỉ mục mới, chép lại (reindex)</td><td>75% bản ghi đổi mảnh</td></tr></table>'
    focus:
    - '1.2'
    - '1.2'
    - '1.3'
    clear: true
    say: Bảng này rút ra quy tắc. Nếu số mảnh mới là bội của số cũ, như ba lên sáu,
      thì tách được sang một chỉ mục mới, vì mỗi mảnh cũ chỉ chia đôi, và chỉ mục
      cũ phải tạm chỉ đọc. Nếu không phải bội, như ba lên bốn, thì bảy mươi lăm phần
      trăm bản ghi đổi mảnh, nên phải tạo chỉ mục mới rồi chép lại.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Ghi xong tìm ngay, không
      thấy, tưởng ghi hỏng nên <b class="red">ghi lại lần nữa</b> → lịch sử có hai
      dòng trùng.

      <br><span class="note">Cách chữa: chờ lần làm tươi; cần thấy ngay thì cho lệnh
      ghi chờ lần làm tươi kế tiếp (<code>refresh=wait_for</code>). Nếu không tự đặt
      <code>refresh_interval</code>, mảnh nào 30 giây không có lượt tìm thì tạm ngừng
      làm tươi nền; lượt tìm kế tiếp tự làm tươi mảnh đó trước khi tìm.</span></div>

      '
    say: Lỗi thứ nhất, của người mới. Ghi xong tìm ngay mà không thấy, tưởng ghi hỏng
      nên ghi lại lần nữa, thế là lịch sử có hai dòng trùng. Cách chữa là chờ lần
      làm tươi. Nếu thật sự cần thấy ngay, cho lệnh ghi chờ tới lần làm tươi kế tiếp
      rồi mới trả lời. Thêm một chi tiết, nếu không tự đặt chu kỳ làm tươi, mảnh nào
      ba mươi giây không có lượt tìm sẽ tạm ngừng làm tươi nền. Lượt tìm kế tiếp tự
      làm tươi mảnh đó trước khi tìm.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Gọi lệnh làm tươi
      sau <b class="red">mỗi</b> lần ghi “cho chắc”. Làm tươi tốn tài nguyên; khuyến
      nghị của hãng là để làm tươi định kỳ chạy, hoặc dùng <code>wait_for</code>.

      <br><span class="note">Cùng nhóm lỗi: tạo chỉ mục 1 mảnh chính (mặc định) rồi
      khi dữ liệu lớn muốn đổi sang 4 tại chỗ — không được, phải tạo chỉ mục mới.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm. Gọi lệnh làm tươi sau mỗi lần ghi cho chắc.
      Làm tươi tốn tài nguyên, nên khuyến nghị của hãng là để làm tươi định kỳ tự
      chạy, hoặc cho lệnh ghi chờ. Cùng nhóm lỗi là tạo chỉ mục với một mảnh chính
      mặc định, rồi khi dữ liệu lớn muốn đổi sang bốn tại chỗ. Việc đó không làm được,
      phải tạo chỉ mục mới.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Giữ <b class="red">số
      dư</b> trong Elasticsearch. Chuyển tiền cần trừ A và cộng B cùng thành công;
      ở đây mỗi thao tác trong một lô có kết quả riêng, nên có thể trừ A xong mà cộng
      B hỏng.

      <br><span class="note">Cách chữa: sổ chính ở cơ sở dữ liệu giao dịch (Oracle);
      Elasticsearch chỉ là bản chép để tìm, cập nhật qua Kafka.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, là giữ số dư trong máy tìm kiếm. Chuyển
      tiền cần trừ A và cộng B cùng thành công hoặc cùng huỷ. Ở đây, mỗi thao tác
      trong một lô có kết quả riêng, nên có thể trừ A xong mà cộng B lại hỏng. Cách
      chữa là giữ sổ chính ở cơ sở dữ liệu giao dịch như Oracle. Máy tìm kiếm chỉ
      là bản chép để tìm, được cập nhật qua Kafka.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_total_shards(5, 2) == 15
  - alg.bnx_shard(23, 5) == 3 and alg.bnx_shard(23, 6) == 5
  - alg.bnx_keep_cycle(5, 6) == (5, 30, __import__('fractions').Fraction(1, 6))
  - round(100 * alg.bnx_keep_cycle(5, 6)[2]) == 17
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Chỉ
      mục 5 mảnh chính, mỗi mảnh 2 bản sao. Tổng cộng bao nhiêu mảnh?</td></tr><tr><td>2</td><td>Băm
      minh hoạ = 23. Có 5 mảnh chính thì vào mảnh nào? Đổi thành 6 thì sao?</td></tr><tr><td>3</td><td>Quyết
      định: trang “lịch sử giao dịch” có ô tìm theo mô tả và dòng số dư. Lấy mỗi thứ
      từ đâu?</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.4'
    - 0
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, chỉ mục năm mảnh chính, mỗi mảnh
      hai bản sao, tổng cộng bao nhiêu mảnh? Câu hai, giá trị băm minh hoạ là hai
      mươi ba. Có năm mảnh chính thì vào mảnh nào, và đổi thành sáu thì sao? Câu ba,
      trang lịch sử giao dịch có ô tìm theo mô tả và một dòng số dư. Bạn lấy mỗi thứ
      từ đâu? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: mỗi mảnh chính kèm 2 bản sao.</p>

      $$5 \cdot (1 + 2) = \hlg{15}$$

      '
    focus:
    - 0
    - 2
    say: Đáp án câu một. Mỗi mảnh chính kèm hai bản sao, nên tổng là năm nhân với
      một cộng hai, bằng mười lăm mảnh.
    clear: true
  - show: '<p>Câu 2:</p>

      $$23 \text{ mod } 5 = \hlg{3}, \qquad 23 \text{ mod } 6 = \hl{5}$$

      <p>Mảnh đổi từ 3 sang 5. Trên vòng 30 giá trị chỉ 0…4 giữ mảnh, vì cùng số dư
      r thì h − r chia hết cho cả 5 và 6, tức cho 30, nên h = r &lt; 5: $\frac{5}{30}$,
      khoảng 17%. Phải tạo chỉ mục mới.</p>

      '
    focus:
    - 2
    - 2
    - 3
    - 3
    say: Đáp án câu hai. Hai mươi ba chia năm dư ba, còn chia sáu dư năm, nên bản
      ghi đổi từ mảnh ba sang mảnh năm. Trên vòng ba mươi giá trị, chỉ năm giá trị
      từ không tới bốn giữ mảnh, vì cùng số dư thì hiệu chia hết cho cả năm và sáu,
      tức cho ba mươi. Tỉ lệ khoảng mười bảy phần trăm, nên phải tạo chỉ mục mới.
  - show: '<table class=''t''><tr><th>lấy từ</th><th>được</th><th>mất</th></tr><tr><td>số
      dư: cơ sở dữ liệu giao dịch (Oracle)</td><td>đúng ngay sau khi chốt, có giao
      dịch nhiều dòng</td><td>tìm theo chữ trong mô tả chậm và kém linh hoạt</td></tr><tr><td>ô
      tìm mô tả: Elasticsearch</td><td>tìm theo từ nhanh, xếp theo điểm liên quan</td><td>trễ
      ít nhất một lần làm tươi cộng thời gian đường ống Kafka; phải ghi rõ “đang cập
      nhật”</td></tr></table>'
    focus:
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    say: Đáp án câu ba. Số dư lấy từ cơ sở dữ liệu giao dịch, vì nó đúng ngay sau
      khi chốt và có giao dịch nhiều dòng, đổi lại tìm theo chữ trong mô tả thì chậm.
      Ô tìm mô tả lấy từ máy tìm kiếm, nhanh và xếp được theo điểm liên quan. Cái
      giá là trễ ít nhất một lần làm tươi, cộng thời gian đi qua Kafka, nên giao diện
      nên báo đang cập nhật.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>mô tả giao dịch</span><span class=''a''>→</span><span
      class=''n''>chỉ mục ngược: từ → bản ghi</span><span class=''a''>→</span><span
      class=''n''>băm mod số mảnh chính</span><span class=''a''>→</span><span class=''n''>3
      chính + 3 bản sao = 6</span><span class=''a''>→</span><span class=''n''>làm
      tươi 1 giây → tìm thấy</span></div>'
    say: Tổng kết chuỗi logic. Mô tả giao dịch được tách từ và ghi vào chỉ mục ngược.
      Mỗi bản ghi về một mảnh chính bằng băm rồi chia dư. Ba mảnh chính và ba bản
      sao thành sáu mảnh trên nhiều máy. Sau lần làm tươi, thường là một giây, bản
      ghi mới tìm thấy được.
  - show: <div class='box key'><b>Tư duy:</b> máy tìm kiếm là <b>bản chép để tìm</b>,
      không phải sổ. Số mảnh chính là quyết định lúc tạo chỉ mục; độ trễ làm tươi
      là điều phải nói trước với người dùng.</div>
    say: Điều cần mang theo. Máy tìm kiếm là bản chép để tìm, không phải sổ cái. Số
      mảnh chính là quyết định lúc tạo chỉ mục, còn độ trễ làm tươi phải nói trước
      với người dùng.
  - show: '<p>Bài sau: một kho lấy dữ liệu theo khoá, nơi mỗi lần ghi phải mang theo
      dấu phiên bản đã đọc, để không ghi đè cập nhật của người khác.</p>'
    forward_ref: true
    say: Ở bài sau, ta học một kho lấy dữ liệu theo khoá, nơi mỗi lần ghi phải mang
      theo dấu phiên bản vừa đọc, để không ghi đè cập nhật của người khác.
