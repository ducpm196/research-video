scenes:
- id: hook
  kind: hook
  title: Vì sao vừa chuyển tiền xong mà tìm trong lịch sử chưa thấy?
  steps:
  - show: '<p>9 giờ đúng, khách chuyển $500\,000$ đồng qua NAPAS (hệ thống chuyển
      tiền giữa các ngân hàng ở Việt Nam). Giao dịch được ghi ngay vào cụm tìm kiếm
      Elasticsearch (phần mềm máy tìm kiếm chạy trên nhiều máy).</p>

      <p>Chưa tới một giây sau, khách mở <b>lịch sử giao dịch</b>, gõ “napas”: <b
      class="red">có thể chưa thấy</b>.</p>

      <div class="box key">Nhiều nhất một giây sau gõ lại thì thấy (độ trễ từ 0 đến
      1 giây, tuỳ lần làm tươi tới lúc nào). Tiền không mất: bản ghi chỉ <b>chưa tìm
      được</b>, vì chưa tới <b>lần làm tươi</b> (lần máy mở phần vừa ghi cho việc
      tìm).</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    introduces:
    - bnx_lam_tuoi
    say: Chào bạn, chín giờ đúng, khách chuyển năm trăm nghìn đồng qua NAPAS, tức
      hệ thống chuyển tiền giữa các ngân hàng trong nước. Giao dịch được ghi ngay
      vào cụm máy tìm kiếm. Chưa tới một giây sau, khách mở lịch sử giao dịch và tìm
      chữ NAPAS, và có thể chưa thấy gì. Một giây sau tìm lại thì thấy, độ trễ từ
      không đến một giây. Tiền không mất, bản ghi chỉ chưa tìm được, vì chưa tới lần
      làm tươi, tức lần máy mở phần vừa ghi cho việc tìm.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>tìm
      “chuyển tiền napas” trong hàng triệu mô tả thế nào cho nhanh</td><td><b>chỉ
      mục ngược</b>: từ → danh sách bản ghi chứa từ đó</td></tr><tr><td>bản ghi nằm
      ở mảnh nào, vì sao không đổi được số mảnh</td><td>băm rồi chia dư cho số <b>mảnh
      chính</b> (số phần chia của chỉ mục)</td></tr><tr><td>vì sao ghi xong chưa tìm
      thấy ngay</td><td>làm tươi định kỳ, mặc định 1 giây</td></tr><tr><td>có giữ
      số dư ở đây được không</td><td>không: không có giao dịch nhiều bản ghi</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    introduces:
    - bnx_chi_muc_nguoc
    - bnx_manh_chinh
    clear: true
    say: Tìm cụm từ trong hàng triệu mô tả cho nhanh thì dùng chỉ mục ngược, tức bảng
      ghi từ nào nằm ở bản ghi nào. Bản ghi nằm ở mảnh nào thì tính bằng băm rồi chia
      dư cho số mảnh chính. Ghi xong chưa thấy ngay là do làm tươi định kỳ, mặc định
      mỗi giây. Giữ số dư ở đây thì không được, vì không có giao dịch gồm nhiều bản
      ghi.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 17 == 5 * 3 + 2 and alg.bnx_shard(17, 3) == 2
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Mục lục cuối sách</td><td>mỗi từ khoá trỏ tới các trang có từ đó, nên không
      phải lật từng trang</td><td>“lãi suất” → trang 12, 40</td></tr><tr><td>② Băm
      rồi chia dư</td><td>hàm băm biến khoá thành một số, cùng khoá luôn ra cùng số;
      lấy số dư khi chia để chọn ngăn</td><td>17 chia 3 dư 2 → ngăn 2</td></tr><tr><td>③
      Giao dịch cơ sở dữ liệu</td><td>nhiều thay đổi cùng thành công hoặc cùng huỷ</td><td>trừ
      A 500 000 và cộng B 500 000 cùng chốt</td></tr><tr><td>④ Điểm liên quan</td><td>xếp
      kết quả: bản ghi chứa từ hiếm, chứa từ nhiều lần thì đứng trên</td><td>bài này
      chỉ nhắc, không đi sâu</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.5'
    introduces:
    - bnx_giao_dich_csdl
    say: Trước hết ta cần hiểu bốn điều. Mục lục cuối sách cho mỗi từ khoá trỏ tới
      các trang có từ đó, nên ta không phải lật từng trang. Băm rồi chia dư là cách
      chọn ngăn cho một khoá. Hàm băm biến khoá thành một số, cùng khoá luôn ra cùng
      số, rồi lấy số dư để chọn ngăn. Giao dịch cơ sở dữ liệu là nhiều thay đổi cùng
      thành công hoặc cùng huỷ. Điểm liên quan dùng để xếp kết quả, bản ghi chứa từ
      hiếm hoặc nhiều lần thì đứng trên.
  - show: $$17 = 5 \cdot 3 + 2$$
    say: Một ví dụ số cho phép chia dư. Mười bảy bằng năm nhân ba cộng hai, nên mười
      bảy chia ba dư hai, và khoá đó vào ngăn số hai.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>document
      (bản ghi)</td><td>một bản ghi dạng JSON (các cặp <code>tên: giá trị</code> trong
      ngoặc nhọn), ví dụ <code>{"_id": "tx1001", "mo_ta": "chuyển tiền napas"}</code></td></tr><tr><td>index
      (chỉ mục)</td><td>tập bản ghi cùng loại, giống một bảng</td></tr><tr><td>inverted
      index (chỉ mục ngược)</td><td>từ → danh sách bản ghi chứa từ đó</td></tr><tr><td>primary
      shard (mảnh chính)</td><td>một phần của chỉ mục; mỗi bản ghi thuộc đúng một
      mảnh chính</td></tr><tr><td>replica (bản sao)</td><td>bản chép của mảnh chính:
      phục vụ đọc, thay khi hỏng; khác máy với mảnh chính</td></tr><tr><td><code>_routing</code>
      (khoá định tuyến)</td><td>giá trị đem băm để chọn mảnh; mặc định là <code>_id</code></td></tr><tr><td>refresh
      (làm tươi)</td><td>mở phần vừa ghi cho việc tìm; mặc định mỗi 1 giây</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    say: Bảng này giải mã bảy từ. Bản ghi là một chuỗi chữ dạng JSON, ghi các cặp
      tên trường và giá trị trong ngoặc nhọn. Chỉ mục là tập các bản ghi cùng loại,
      giống một bảng. Chỉ mục ngược đi từ từ sang danh sách bản ghi chứa từ đó. Mảnh
      chính là một phần của chỉ mục, mỗi bản ghi thuộc đúng một mảnh chính. Bản sao
      là bản chép của mảnh chính, phục vụ đọc và thay khi hỏng, nên không đặt cùng
      máy với mảnh chính của nó. Khoá định tuyến là giá trị đem băm để chọn mảnh.
      Làm tươi là mở phần vừa ghi cho việc tìm, mặc định mỗi giây.
- id: intuition
