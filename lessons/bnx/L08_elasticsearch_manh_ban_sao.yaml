scenes:
- id: hook
  kind: hook
  title: Vì sao vừa chuyển tiền xong mà tìm trong lịch sử chưa thấy?
  steps:
  - show: '<p>9 giờ đúng, khách chuyển $500\,000$ đồng qua NAPAS. Giao dịch được ghi
      ngay vào cụm tìm kiếm Elasticsearch.</p>

      <p>Nửa giây sau, khách mở <b>lịch sử giao dịch</b>, gõ “napas”: <b class="red">không
      thấy</b>.</p>

      <div class="box key">Một giây sau gõ lại thì thấy. Tiền không mất: bản ghi chỉ
      <b>chưa tìm được</b>, vì chưa tới lần làm tươi.</div>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Chào bạn, chín giờ đúng, khách chuyển năm trăm nghìn đồng qua NAPAS, và giao
      dịch được ghi ngay vào cụm máy tìm kiếm. Nửa giây sau, khách mở lịch sử giao
      dịch và tìm chữ NAPAS, nhưng không thấy gì. Một giây sau tìm lại thì thấy. Tiền
      không mất, bản ghi chỉ chưa tìm được, vì chưa tới lần làm tươi.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>tìm
      “chuyển tiền napas” trong hàng triệu mô tả thế nào cho nhanh</td><td>chỉ mục
      ngược: từ → danh sách bản ghi</td></tr><tr><td>bản ghi nằm ở mảnh nào, vì sao
      không đổi được số mảnh</td><td>băm rồi chia dư cho số mảnh chính</td></tr><tr><td>vì
      sao ghi xong chưa tìm thấy ngay</td><td>làm tươi định kỳ, mặc định 1 giây</td></tr><tr><td>có
      giữ số dư ở đây được không</td><td>không: không có giao dịch nhiều bản ghi</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Hôm nay ta trả lời bốn câu hỏi. Thứ nhất, tìm một cụm từ trong hàng triệu
      mô tả giao dịch thế nào cho nhanh, câu trả lời là chỉ mục ngược. Thứ hai, bản
      ghi nằm ở mảnh nào, và vì sao không đổi được số mảnh, câu trả lời là băm rồi
      chia dư. Thứ ba, vì sao ghi xong chưa thấy ngay, đó là do làm tươi định kỳ,
      mặc định mỗi giây một lần. Thứ tư, có giữ số dư ở đây được không, câu trả lời
      là không, vì máy tìm kiếm không có giao dịch gồm nhiều bản ghi.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 17 == 5 * 3 + 2 and alg.bnx_shard(17, 3) == 2
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Mục lục cuối sách</td><td>mỗi từ khoá trỏ tới các trang có từ đó, nên không
      phải lật từng trang</td><td>“lãi suất” → trang 12, 40</td></tr><tr><td>② Băm
      rồi chia dư</td><td>hàm băm biến khoá thành một số, cùng khoá luôn ra cùng số;
      lấy số dư khi chia để chọn ngăn</td><td>17 chia 3 dư 2 → ngăn 2</td></tr><tr><td>③
      Giao dịch cơ sở dữ liệu</td><td>nhiều thay đổi cùng thành công hoặc cùng huỷ</td><td>trừ
      A 500 000 và cộng B 500 000 cùng chốt</td></tr><tr><td>④ Điểm liên quan</td><td>xếp
      kết quả: bản ghi chứa từ hiếm, chứa từ nhiều lần thì đứng trên</td><td>bài này
      chỉ nhắc, không đi sâu</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều. Mục lục cuối sách cho mỗi từ khoá trỏ tới
      các trang có từ đó, nên ta không phải lật từng trang. Băm rồi chia dư là cách
      chọn ngăn cho một khoá. Hàm băm biến khoá thành một số, cùng khoá luôn ra cùng
      số, rồi lấy số dư để chọn ngăn. Giao dịch cơ sở dữ liệu là nhiều thay đổi cùng
      thành công hoặc cùng huỷ, ví dụ trừ tài khoản A và cộng tài khoản B cùng được
      chốt. Còn điểm liên quan dùng để xếp kết quả, bản ghi chứa từ hiếm hoặc chứa
      nhiều lần thì đứng trên. Phần chấm điểm này bài hôm nay chỉ nhắc qua.
  - show: $$17 = 5 \cdot 3 + 2$$
    say: Một ví dụ số cho phép chia dư. Mười bảy bằng năm nhân ba cộng hai, nên mười
      bảy chia ba dư hai, và khoá đó vào ngăn số hai.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>document
      (bản ghi)</td><td>một bản ghi JSON, ví dụ <code>{"_id": "tx1001", "mo_ta": "chuyển
      tiền napas"}</code></td></tr><tr><td>index (chỉ mục)</td><td>tập bản ghi cùng
      loại, giống một bảng</td></tr><tr><td>inverted index (chỉ mục ngược)</td><td>từ
      → danh sách bản ghi chứa từ đó</td></tr><tr><td>primary shard (mảnh chính)</td><td>một
      phần của chỉ mục; mỗi bản ghi thuộc đúng một mảnh chính</td></tr><tr><td>replica
      (bản sao)</td><td>bản chép của mảnh chính: phục vụ đọc, thay mảnh chính khi
      hỏng; không đặt cùng máy với mảnh chính</td></tr><tr><td><code>_routing</code>
      (khoá định tuyến)</td><td>giá trị đem băm để chọn mảnh; mặc định là <code>_id</code></td></tr><tr><td>refresh
      (làm tươi)</td><td>mở phần vừa ghi cho việc tìm; mặc định mỗi 1 giây</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    say: Bảng này giải mã bảy từ. Bản ghi là một gói dữ liệu JSON có các trường, ví
      dụ mã giao dịch và mô tả. Chỉ mục là tập bản ghi cùng loại, giống một bảng.
      Chỉ mục ngược đi từ từ sang danh sách bản ghi chứa từ đó. Mảnh chính là một
      phần của chỉ mục, và mỗi bản ghi thuộc đúng một mảnh chính. Bản sao là bản chép
      của mảnh chính, phục vụ đọc và thay mảnh chính khi hỏng, nên không đặt cùng
      máy với mảnh chính của nó. Khoá định tuyến là giá trị đem băm để chọn mảnh,
      mặc định chính là mã bản ghi. Làm tươi là mở phần vừa ghi cho việc tìm, mặc
      định mỗi giây.
