    ''d3'']'
  - 'alg.bnx_search_and({''d1'': ''chuyển tiền napas'', ''d2'': ''nạp tiền ví'', ''d3'':
    ''chuyển tiền quốc tế'', ''d4'': ''rút tiền atm''}, ''chuyển'', ''napas'') ==
    [''d1'']'
  - alg.bnx_shard(17, 3) == 2
  - alg.bnx_total_shards(3, 1) == 6
  - alg.bnx_refresh_sim([(0, 'd1')], [0.5, 1.2]) == [0, 1]
