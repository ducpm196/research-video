  - 'alg.bnx_l32_reconcile({''a'': 2, ''b'': 1}, {''a'': 5, ''c'': 1}, False)[0] ==
    [''sua a'', ''tao b'']'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>cum["thanh-toan"]["ban"]
      = 9</code></td><td>giả lập người sửa tay: lấy từ điển của <code>thanh-toan</code>
      trong cụm, đặt khoá <code>ban</code> bằng 9</td></tr><tr><td><code>buoc(4, "bat
