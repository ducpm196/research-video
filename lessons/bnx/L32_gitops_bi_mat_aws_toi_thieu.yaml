    say: Số thứ hai là cửa sổ lộ, số minh hoạ. Mật khẩu tĩnh đổi mỗi chín mươi ngày
      có cửa sổ hai nghìn một trăm sáu mươi giờ, và mười nghìn dịch vụ là mười nghìn
      mật khẩu phải đổi tay. Bí mật động có hạn một giờ thì tự hết hạn.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>chọn khi</th></tr><tr><td>đồng
      bộ thủ công, bí mật trong cấu hình</td><td>đơn giản, dễ hiểu</td><td>dễ lệch,
      mật khẩu sống lâu, khó kiểm toán</td><td>một vài dịch vụ, thử nghiệm</td></tr><tr><td>đồng
      bộ tự động, tắt tự xoá và tự chữa</td><td>mọi thay đổi qua Git; xoá nhầm không
      mất ngay</td><td>sửa tay vẫn lệch, phải tự xử lý</td><td>môi trường thật, mới
      áp dụng</td></tr><tr><td>bật cả tự xoá và tự chữa, thẻ có hạn</td><td>cụm luôn
      khớp Git; lộ chỉ trong một lúc</td><td>chữa cháy phải qua Git; xoá nhầm tệp
      là mất dịch vụ</td><td>đã quen quy trình, có kiểm duyệt thay đổi</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Bảng này là các lựa chọn của người làm nghề. Đồng bộ thủ công đơn giản nhưng
      dễ lệch. Đồng bộ tự động với hai công tắc tắt đưa mọi thay đổi qua kho mã, đổi
      lại sửa tay vẫn lệch. Bật cả hai thì cụm luôn khớp, đổi lại chữa cháy phải qua
      kho mã.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_l32_git_calls(200)[0] == 201 and 10000 + 1 == 10001
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> <b class="red">Để mật khẩu
      trong kho Git</b> rồi xoá ở lần chốt sau. Lịch sử vẫn giữ nó: ai có bản sao
      kho đều đọc được. Bí mật phải ra khỏi Git, và bí mật đã lộ phải <b>đổi</b>,
      không chỉ xoá.</div>

      $$\text{xoá tệp} \ne \text{xoá lịch sử}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Lỗi thứ nhất là để mật khẩu trong kho mã rồi xoá ở lần chốt sau. Lịch sử
      vẫn giữ nó, nên bí mật đã lộ phải đổi chứ không chỉ xoá.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Bật
      <code>prune</code> ngay từ đầu. Một lần xoá nhầm tệp trong Git thành xoá dịch
      vụ thật (đã thấy ở bước 7–8). Bật sau khi quen quy trình, và bắt buộc có người
      duyệt thay đổi.</div>

      $$\text{xoá tệp trong Git} + prune \Rightarrow \text{xoá dịch vụ thật}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ hai, lộ ra lúc mới dựng: bật tự xoá ngay từ đầu, nên một lần xoá
      nhầm tệp thành xoá dịch vụ thật. Hãy bật sau khi quen quy trình, và bắt buộc
      có người duyệt.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc tải tăng).</b> Vòng
      đối chiếu <b class="red">gọi Git một lần cho mỗi tệp</b>: 10 ứng dụng 11 lần,
      200 ứng dụng 201 lần, 10 000 ứng dụng 10 001 lần mỗi vòng. Đọc một lần (<code>cat-file
      --batch</code>: nhận cả danh sách tên rồi trả nội dung tất cả) luôn 2 lần.</div>

      $$1 + n \;\text{so với}\; 2$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ ba, lộ ra khi tải tăng: vòng đối chiếu gọi Git một lần cho mỗi tệp,
      nên mười nghìn ứng dụng mất mười nghìn lẻ một lần. Đọc cả danh sách tên một
      lần luôn chỉ hai lần.'
  - show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm, lúc vận hành lâu dài).</b>
      Bật <code>selfHeal</code> rồi <b class="red">chữa cháy bằng sửa tay</b> giữa
      sự cố: vài phút sau vòng đối chiếu ghi đè lại. Khi bật tự chữa, chữa cháy cũng
      phải qua Git (hoặc tạm tắt công tắc có ghi lại). Và thẻ, khoá không bao giờ
      hết hạn thì không có gì tự thu hồi.</div>

      <table class=''t''><tr><th>việc</th><th>cách làm đúng</th></tr><tr><td>chữa
      cháy khi tự chữa đang bật</td><td>chốt vào Git hoặc tạm tắt có ghi chép</td></tr></table>

      '
    focus:
    - - 1
      - 2
    clear: true
    say: 'Lỗi thứ tư, lộ ra khi vận hành lâu dài: bật tự chữa rồi chữa cháy bằng sửa
      tay, vài phút sau vòng đối chiếu ghi đè lại, chữa cháy cũng phải qua kho mã.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l32_hours(30) == 720 and alg.bnx_l32_ratio(720, 0.25) == 2880
  - alg.bnx_l32_decide([('Allow', 's3:Get*', 'kho/*'), ('Deny', 's3:*', 'kho/mat/*')],
    's3:GetObject', 'kho/mat/y') == 'tu choi (Deny ro rang)'
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Mật
      khẩu đổi mỗi 30 ngày, so với thẻ sống 15 phút. Cửa sổ lộ tối đa mỗi cách là
      bao nhiêu giờ, và gấp nhau mấy lần?</td></tr><tr><td>2</td><td>Chính sách: Allow
      <code>s3:Get*</code> trên <code>kho/*</code>; Deny <code>s3:*</code> trên <code>kho/mat/*</code>.
      Kết quả của (a) GetObject kho/x, (b) PutObject kho/x, (c) GetObject kho/mat/y?</td></tr><tr><td>3</td><td>Quyết
      định (số minh hoạ): môi trường thật, 40 dịch vụ, đội 6 người. Bật ngay <code>prune</code>
      và <code>selfHeal</code>, hay bật tự chữa trước, tự xoá sau? Vì sao?</td></tr></table>'
    pause: 30
    say: 'Bây giờ tới phần bạn tự làm bài. Câu một: mật khẩu đổi mỗi ba mươi ngày
      so với thẻ sống mười lăm phút, cửa sổ lộ mỗi cách bao nhiêu giờ, gấp mấy lần?
      Câu hai: ba phép thử trên chính sách cho phép đọc thư mục kho và từ chối mọi
      việc trong kho mật. Câu ba: bốn mươi dịch vụ, đội sáu người, bật ngay cả hai
      công tắc hay tự chữa trước? Hãy dừng lại làm ra giấy.'
  - show: '<p>Câu 1: 30 ngày = 720 giờ; 15 phút = 0,25 giờ.</p>

      $$30 \times 24 = \hlg{720} \text{ giờ}; \quad 15 : 60 = \hlg{0{,}25} \text{
      giờ}; \quad 720 : 0{,}25 = \hl{2\,880} \text{ lần}$$

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu một, ba mươi ngày là bảy trăm hai mươi giờ, mười lăm phút là không
      phẩy hai mươi lăm giờ, nên mật khẩu gấp hai nghìn tám trăm tám mươi lần.
    clear: true
  - show: '<p>Câu 2: (a) có Allow khớp, không Deny: <b>cho phép</b>. (b) không Allow
      nào khớp <code>s3:Put</code>: <b>từ chối mặc định</b>. (c) Allow khớp nhưng
      Deny cũng khớp: <b>Deny thắng</b>.</p>'
    say: Đáp án câu hai, đọc kho x được phép vì khớp quy tắc cho phép. Ghi kho x bị
      từ chối mặc định vì không khớp quy tắc nào. Đọc kho mật y khớp cả hai, và từ
      chối thắng.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>bật
      cả hai ngay</td><td>cụm luôn khớp Git</td><td>xoá nhầm một tệp là mất dịch vụ;
      đội mới quen, chưa có thói quen duyệt</td></tr><tr><td>tự chữa trước, tự xoá
      sau</td><td>sửa tay bị chặn; xoá nhầm chưa gây mất dịch vụ</td><td>thứ thừa
      tích tụ, phải dọn tay một thời gian</td></tr></table>
    say: Đáp án câu ba, bật cả hai ngay làm cụm luôn khớp, nhưng xoá nhầm một tệp
      là mất dịch vụ thật khi đội còn mới. Bật tự chữa trước chặn được sửa tay mà
      chưa mất dịch vụ, hợp lý là cách thứ hai.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: vòng đối chiếu nhỏ với cờ tự xoá'
  steps:
  - show: '<p><b>Đề</b>: mong muốn <code>{"a": 2, "b": 1}</code>, thật <code>{"a":
      5, "c": 1}</code>. Viết <code>lech()</code> và <code>dong_bo(prune)</code>;
      gọi <code>dong_bo(False)</code> rồi <code>dong_bo(True)</code> và in từng lần
      việc đã làm cùng danh sách còn lệch.</p>

      <p>Định dạng đầu ra chính xác nằm trong <code>de.md</code>; số liệu <b>khác</b>
      ví dụ trong bài.</p>

      '
    focus:
    - - 1
    - - 2
    pause: 180
    say: Bây giờ tới phần bạn tự làm, trạng thái mong muốn có a bằng hai và b bằng
      một, trạng thái thật có a bằng năm và c bằng một. Viết hàm tìm chỗ lệch và hàm
      đồng bộ có cờ tự xoá, hãy dừng video và tự viết.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>lech: a, b, c</div><div>dong
      bo (khong prune): sua a, tao b | lech: c</div><div>dong bo (prune): xoa c |
      lech: -</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh
      BNX L32 mau.py</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> lệch = tên có ở mong muốn mà khác
      thật, cộng tên chỉ có ở thật. Sửa nếu đã có trong thật, tạo nếu chưa; xoá chỉ
      khi cờ bật.

      Lời giải đầy đủ ở <code>labs/BNX/L32/loi_giai.py</code> — chỉ mở sau khi bạn
      đã thử.</div>

      '
    say: Nếu kẹt, chỗ lệch gồm tên khác nhau giữa hai bên, cộng tên chỉ có ở thật.
      Sửa nếu đã có, tạo nếu chưa, và chỉ xoá khi cờ bật. Lời giải đầy đủ nằm trong
      thư mục thực hành.
    clear: true
  lab: labs/BNX/L32
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  checks:
  - alg.bnx_l32_hours(90) == 2160
  steps:
  - show: '<div class=''chain''><span class=''n''>mong muốn nằm trong Git</span><span
      class=''a''>→</span><span class=''n''>vòng đối chiếu kéo cụm về khớp</span><span
      class=''a''>→</span><span class=''n''>tự xoá, tự chữa: bật có chủ ý</span><span
      class=''a''>→</span><span class=''n''>bí mật ngoài Git, thẻ có hạn</span><span
      class=''a''>→</span><span class=''n''>quyền tối thiểu, mặc định từ chối</span></div>'
    say: Trạng thái mong muốn nằm trong kho mã, vòng đối chiếu kéo cụm về khớp, tự
      xoá và tự chữa chỉ bật có chủ ý. Bí mật nằm ngoài kho mã, quyền thì tối thiểu.
  - show: '<div class=''box key''><b>Tư duy:</b> một nguồn sự thật (Git) cho điều
      ta <b>muốn</b>, một nơi riêng (kho bí mật) cho điều ta <b>phải giấu</b>, và
      quyền chỉ mở khi có lý do. Mọi tự động hoá đều có công tắc an toàn; hãy biết
      công tắc nào đang bật.

      Argo CD, Vault, AWS chỉ là công cụ: vòng đối chiếu, thẻ có hạn và mặc định từ
      chối mới là thứ mang theo.</div>

      '
    say: Một nguồn sự thật cho điều ta muốn, một nơi riêng cho điều phải giấu, và
      quyền chỉ mở khi có lý do. Mọi tự động hoá đều có công tắc an toàn, hãy biết
      công tắc nào đang bật.
  - show: '<table class=''t''><tr><th>Nếu bị hỏi về dòng này trên CV</th><th>ý trả
      lời</th></tr><tr><td>GitOps, Argo CD: bạn hiểu thế nào?</td><td>trạng thái mong
      muốn nằm trong Git; vòng đối chiếu sửa lệch; <code>prune</code>, <code>selfHeal</code>
      mặc định tắt vì xoá nhầm tệp thành xoá dịch vụ (bài mô phỏng, không chạy Argo
      CD)</td></tr><tr><td>Quản lý bí mật bằng Vault?</td><td>bí mật không để trong
      Git; phiên bản, chính sách mặc định từ chối, thẻ có hạn (đo: thẻ 4 giây hết
      hạn thì đọc bị từ chối); cửa sổ lộ của thẻ và bí mật động ≤ thời gian sống,
      còn mật khẩu tĩnh phải đổi tay</td></tr><tr><td>AWS tối thiểu cho backend?</td><td>VPC
      (mạng con công khai và riêng), IAM (vai trò, mặc định từ chối, Deny thắng Allow),
      S3, RDS đặt ở mạng riêng; bài chỉ giảng khái niệm</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - - '1.3'
      - '1.4'
    clear: true
    say: 'Nếu người phỏng vấn hỏi về dòng này, có ba câu hay gặp. Kho mã: trạng thái
