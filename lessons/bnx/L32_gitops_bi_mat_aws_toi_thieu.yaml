source: 'curriculum/bnx.yaml L32; audit/bnx/verify_bnx.py L32; audit/bnx/sources_l32.md:
  hướng dẫn Argo CD (How it works, Automated Sync Policy, Application specification),
  Vault (Dev Server, Policies, Tokens, KV v2, Database secrets engine), AWS (IAM policy
  evaluation logic, IAM, VPC, S3, RDS), đọc 2026-11-14; Vault 2.2.2 chạy thật bằng
