- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ Git tới bí mật'
  checks:
  - alg.bnx_l32_hours(90) == 2160
  - alg.bnx_l32_decide([('Allow', 's3:Get*', 'b/*'), ('Deny', 's3:*', 'b/r/*')], 's3:GetObject',
    'b/r/x') == 'tu choi (Deny ro rang)'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th><th>ví dụ nhỏ</th></tr><tr><td><code>git("ls-tree",
      "--name-only", "HEAD")</code></td><td>chạy lệnh git thật qua hàm <code>git</code>
      của bài: liệt kê tên các tệp ở lần chốt mới nhất</td><td><code>so-cai.json</code>,
      <code>thanh-toan.json</code></td></tr><tr><td><code>git("show", "HEAD:" + t)</code></td><td>in
      nội dung tệp <code>t</code> ở lần chốt mới nhất</td><td><code>{"anh": "v1.4",
      "ban": 3}</code></td></tr><tr><td><code>json.loads(…)</code></td><td>đổi chuỗi
      chữ viết theo JSON thành từ điển Python để dùng tiếp</td><td><code>''{&quot;ban&quot;:
      3}''</code> thành <code>{''ban'': 3}</code></td></tr><tr><td><code>{t[:-5]:
      … for t in tep}</code></td><td>dựng từ điển bằng vòng lặp; <code>t[:-5]</code>
      bỏ 5 ký tự cuối (<code>.json</code>) để còn tên dịch vụ</td><td><code>thanh-toan.json</code>
      thành <code>thanh-toan</code></td></tr></table>'
    clear: true
    say: Trước hết ta xem bốn cách viết, lệnh liệt kê cho tên các tệp ở lần chốt mới
      nhất, rồi lệnh in cho nội dung từng tệp. Hàm đổi chữ biến chuỗi JSON thành từ
      điển. Tên tệp bỏ năm ký tự cuối nên còn tên dịch vụ.
  - show: '<p><b>Bước 1. Trạng thái mong muốn nằm trong Git.</b> Mỗi dịch vụ là một
      tệp JSON; trạng thái mong muốn là nội dung các tệp ở lần chốt mới nhất (<code>HEAD</code>).
      Nên mọi thay đổi có người chốt, có lịch sử và hoàn tác được.</p><p><b>DoiChieu.py
      (trích): đọc trạng thái mong muốn từ HEAD</b></p><div class="code"><div>def
      mong_muon():                      # trang thai MONG MUON: doc tu HEAD</div><div>    tep
      = git("ls-tree", "--name-only", "HEAD").split()</div><div>    return {t[:-5]:
      json.loads(git("show", "HEAD:" + t)) for t in tep}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước một là trạng thái mong muốn nằm trong kho mã. Mỗi dịch vụ là một tệp
      JSON, nên mọi thay đổi có người chốt, có lịch sử, và hoàn tác được.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>global
      cuoi</code></td><td>cho phép hàm gán lại biến <code>cuoi</code> nằm ngoài hàm;
      thiếu dòng này, Python tạo biến mới chỉ trong hàm</td></tr><tr><td><code>moi,
      cuoi = rev != cuoi, rev</code></td><td>gán hai biến cùng lúc: <code>moi</code>
      đúng nếu mã chốt đã đổi; rồi nhớ mã chốt hiện tại vào <code>cuoi</code></td></tr></table>'
    clear: true
    say: Dòng toàn cục cho phép hàm gán lại biến nằm ngoài hàm, nên mã chốt đã gặp
      được nhớ lại. Phép gán đồng thời cho biết lần chốt này có mới không.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      ten, ch in mm.items():</code></td><td>duyệt từng cặp của từ điển <code>mm</code>:
      <code>ten</code> là tên dịch vụ, <code>ch</code> là nội dung mong muốn của nó</td><td>tên
      <code>so-cai</code> đi với <code>{&quot;ban&quot;: 2}</code></td></tr><tr><td><code>cum.get(ten)
      != ch and (moi or tu_chua or ten not in cum)</code></td><td><code>cum.get(ten)</code>:
      nội dung thật của <code>ten</code>, chưa có thì ra <code>None</code>; làm khi
      thật khác mong muốn <b>và</b> một trong ba điều đúng: lần chốt mới, bật tự chữa,
      tên chưa có trong cụm</td><td>sửa tay <code>ban</code> 9 khi tắt tự chữa: không
      việc</td></tr><tr><td><code>("sua " if ten in cum else "tao ") + ten</code></td><td>biểu
      thức điều kiện: chữ <code>sua </code> nếu <code>ten</code> đã có trong cụm,
      ngược lại <code>tao </code>; <code>+ ten</code> nối tên vào sau</td><td>ra <code>tao
      so-cai</code> hoặc <code>sua so-cai</code></td></tr><tr><td><code>viec.append(…)</code>,
      <code>dict(ch)</code></td><td><code>append</code>: thêm vào cuối danh sách <code>viec</code>;
      <code>dict(ch)</code>: chép một bản riêng của từ điển <code>ch</code></td><td></td></tr></table>'
    clear: true
    say: Hàm đồng bộ có bốn chỗ mới, nên ta giải trước. Vòng lặp duyệt từng cặp tên
      và nội dung. Sửa khi thật khác mong muốn, và có lần chốt mới, hoặc bật tự chữa,
      hoặc tên chưa có. Chọn chữ sửa nếu tên đã có, ngược lại chữ tạo. Thêm vào cuối
      danh sách, và chép bản riêng.
  - show: '<p><b>Bước 2. Vòng đối chiếu.</b> Với mỗi dịch vụ: thật khác mong muốn
      thì <b>sửa</b> hoặc <b>tạo</b> cho khớp. Chỉ làm khi có commit mới, hoặc khi
      bật <code>tu_chua</code>.</p><p><b>DoiChieu.py (trích): tạo và sửa cho khớp</b></p><div
      class="code"><div>def dong_bo(tu_chua=False, prune=False):</div><div>    global
      cuoi</div><div>    mm, viec = mong_muon(), []</div><div>    rev = git("rev-parse",
      "HEAD").strip()</div><div>    moi, cuoi = rev != cuoi, rev</div><div>    for
      ten, ch in mm.items():</div><div>        if cum.get(ten) != ch and (moi or tu_chua
      or ten not in cum):</div><div>            viec.append(("sua " if ten in cum
      else "tao ") + ten)</div><div>            cum[ten] = dict(ch)</div></div>'
    focus:
    - - 1
      - 2
    clear: true
    say: Bước hai là vòng đối chiếu, dịch vụ nào thật khác mong muốn thì sửa hoặc
      tạo, nhưng chỉ khi có lần chốt mới hoặc bật tự chữa, nên sửa tay không bị ghi
      đè lặng lẽ.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      ten in sorted(set(cum) - set(mm)):</code></td><td><code>set(…)</code>: tập tên
      không trùng lặp; phép trừ giữ tên có trong cụm mà không có trong mong muốn;
      <code>sorted</code> xếp theo chữ cái; rồi duyệt từng tên thừa</td><td><code>{a,
      c}</code> trừ <code>{a, b}</code> còn <code>{c}</code></td></tr><tr><td><code>if
      prune:</code>, <code>del cum[ten]</code></td><td><code>if prune:</code>: chỉ
      chạy các dòng thụt vào khi <code>prune</code> đúng; <code>del cum[ten]</code>:
      xoá mục <code>ten</code> khỏi từ điển</td><td></td></tr></table>'
    clear: true
    say: Bước tiếp có phép trừ tập hợp, phép trừ giữ tên chỉ có trong cụm, xếp theo
      chữ cái. Khối chỉ chạy khi cờ đúng, và lệnh xoá bỏ mục khỏi từ điển.
  - show: '<p><b>Bước 3. Xoá thừa.</b>Thứ có trong cụm mà đã biến khỏi Git chỉ bị
      xoá khi bật <code>prune</code>, vì xoá nhầm là mất dịch vụ thật.</p><p><b>DoiChieu.py
      (trích): xoá thừa chỉ khi bật prune</b></p><div class="code"><div>    for ten
      in sorted(set(cum) - set(mm)):</div><div>        if prune:</div><div>            viec.append("xoa
      " + ten)</div><div>            del cum[ten]</div><div>    return viec</div></div>'
    focus:
    - - 1
      - 2
    clear: true
    say: Bước ba là xoá thừa, thứ có trong cụm mà đã biến khỏi kho mã chỉ bị xoá khi
      bật cờ tự xoá, vì xoá nhầm là mất dịch vụ thật.
  - show: '<table class=''t''><tr><th>viết trong khai báo</th><th>nghĩa</th></tr><tr><td><code>apiVersion:
      argoproj.io/v1alpha1</code>, <code>kind: Application</code>, <code>metadata:
      {name: …}</code>, <code>spec:</code>, <code>project: default</code></td><td>tệp
      YAML: <code>apiVersion</code> là loại và bản của đối tượng; <code>kind</code>:
      một ứng dụng cần giữ đồng bộ với Git; <code>metadata</code>: tên (ngoặc nhọn
      gom cặp khoá và giá trị trên một dòng); <code>spec</code>: phần khai chi tiết,
      thụt vào; <code>project: default</code>: nhóm quản lý mặc định của Argo CD</td></tr><tr><td><code>source:
      repoURL, targetRevision, path</code></td><td>nguồn: địa chỉ kho Git, lần chốt
      cần theo (<code>HEAD</code> là mới nhất), thư mục chứa tệp khai báo</td></tr><tr><td><code>destination:
      server, namespace</code></td><td>đích: cụm nào và ngăn riêng nào trong cụm</td></tr><tr><td><code>syncPolicy.automated:
      {prune, selfHeal}</code></td><td>đồng bộ tự động, kèm hai công tắc tự xoá và
      tự chữa</td></tr></table>'
    clear: true
    say: Ta đọc khai báo của công cụ đồng bộ. Phần mở đầu là loại đối tượng, tên và
      nhóm mặc định, còn phần khai chi tiết thụt vào. Nên nguồn là kho mã và lần chốt,
      đích là cụm cùng ngăn riêng, và có hai công tắc.
  - show: '<p><b>Bước 3 (tiếp): Application của Argo CD, bật cả hai công tắc ở dòng
      cuối (mặc định đều tắt; không chạy: cần Kubernetes)</b></p><div class="code"><div>apiVersion:
      argoproj.io/v1alpha1</div><div>kind: Application</div><div>metadata: {name:
      thanh-toan, namespace: argocd}</div><div>spec:</div><div>  project: default</div><div>  source:</div><div>    repoURL:
      https://git.example/bnx.git</div><div>    targetRevision: HEAD</div><div>    path:
      manifests</div><div>  destination: {server: "https://kubernetes.default.svc",
      namespace: bnx}</div><div>  syncPolicy:</div><div>    automated: {prune: true,
      selfHeal: true}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Theo hướng dẫn chính thức, mặc định công cụ không xoá và không chữa sửa tay,
      nhưng ở dòng cuối ta bật cả hai công tắc. Tệp này không chạy trên máy vì cần
      cụm thật.
  - show: '<table class=''t''><tr><th>viết trong lệnh</th><th>nghĩa</th></tr><tr><td><code>export
      VAULT_ADDR=… VAULT_TOKEN=root</code></td><td>đặt biến môi trường cho các lệnh
      sau: địa chỉ máy chủ và thẻ đăng nhập; <code>root</code> là thẻ gốc của chế
      độ thử, không dùng thật</td></tr><tr><td><code>vault server -dev -dev-root-token-id=root
      … &amp;</code></td><td>chạy máy chủ ở chế độ thử (dữ liệu trong bộ nhớ, tự mở
      khoá); dấu <code>&amp;</code> cho chạy nền để lệnh sau chạy tiếp</td></tr><tr><td><code>for
      i in &#36;(seq 1 30); do … sleep 1; done</code></td><td>lặp tối đa 30 lần, nghỉ
      1 giây, cho tới khi máy chủ báo sẵn sàng</td></tr><tr><td><code>… &gt;/dev/null</code>,
      <code>echo "ban 1: &#36;(vault kv get …)"</code></td><td><code>&gt;/dev/null</code>
      vứt chữ lệnh in ra; <code>&#36;(…)</code> chạy lệnh trong ngoặc rồi dán kết
      quả vào chuỗi</td></tr></table>'
    clear: true
    say: Hai biến môi trường là địa chỉ máy chủ và thẻ gốc của chế độ thử. Lệnh máy
      chủ kết thúc bằng dấu và nên chạy nền, rồi vòng lặp chờ tối đa ba mươi giây.
      Dấu lớn hơn vứt chữ đi, còn dấu đô la ngoặc dán kết quả lệnh vào chuỗi.
  - show: '<p><b>Bước 4. Bí mật không nằm trong Git.</b> Kho bí mật giữ bí mật có
      <b>phiên bản</b>: mỗi lần <code>kv put</code> ghi thêm một bản; <code>-version=1</code>
      đọc lại bản đầu.</p><p><b>Chạy thật: ghi hai phiên bản rồi đọc (Vault 2.2.2,
      chế độ phát triển)</b></p><div class="code"><div>export VAULT_ADDR=http://127.0.0.1:8200
      VAULT_TOKEN=root</div><div>vault server -dev -dev-root-token-id=root &gt;/dev/null
      2&gt;&amp;1 &amp;</div><div>for i in <span>&#36;</span>(seq 1 30); do vault
      status &gt;/dev/null 2&gt;&amp;1 &amp;&amp; break; sleep 1; done</div><div>vault
      kv put -mount=secret thanh-toan db_pass=abc123 &gt;/dev/null</div><div>vault
      kv put -mount=secret thanh-toan db_pass=xyz789 &gt;/dev/null</div><div>echo
      "ban moi nhat: <span>&#36;</span>(vault kv get -mount=secret -field=db_pass
      thanh-toan)"</div><div>echo "ban 1: <span>&#36;</span>(vault kv get -mount=secret
      -version=1 -field=db_pass thanh-toan)"</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn là bí mật không nằm trong kho mã. Ta ghi mật khẩu hai lần vào cùng
      một mục nên có hai phiên bản. Lệnh đọc lấy bản mới nhất, còn cờ phiên bản một
      lấy lại bản đầu.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>vault
      policy write chi-doc - &gt;/dev/null &lt;&lt;''P'' … P</code></td><td>ghi chính
      sách tên <code>chi-doc</code>; dấu <code>-</code> nghĩa là đọc nội dung từ đầu
      vào chuẩn; <code>&lt;&lt;''P''</code> mở <b>khối chữ dòng-trong-lệnh</b>: mọi
      dòng tới dòng chỉ có chữ <code>P</code> được đưa vào lệnh nguyên văn</td></tr><tr><td><code>T=&#36;(vault
      token create -policy=chi-doc -ttl=4s -field=token)</code></td><td>tạo thẻ gắn
      chính sách <code>chi-doc</code>, sống 4 giây; <code>-field=token</code> chỉ
      in đúng chữ thẻ; <code>T=&#36;(…)</code> cất chữ đó vào biến <code>T</code></td></tr><tr><td><code>VAULT_TOKEN=&#36;T
      vault kv get …</code>, <code>doc() { … }</code></td><td>đặt <code>VAULT_TOKEN</code>
      chỉ cho riêng lệnh này, nên lệnh dùng thẻ <code>&#36;T</code> thay thẻ gốc;
      <code>doc() { … }</code> đặt tên cho một nhóm lệnh để gọi lại</td></tr><tr><td><code>2&gt;&amp;1
      | grep -o ''permission denied'' | head -1</code></td><td><code>2&gt;&amp;1</code>
      gộp chữ báo lỗi vào dòng chữ thường; <code>grep -o</code> chỉ in đúng đoạn khớp;
      <code>head -1</code> giữ dòng đầu</td></tr></table>'
    clear: true
    say: Đoạn lệnh sau có bốn cách viết mới. Dấu gạch nối đọc nội dung từ đầu vào,
      và hai dấu nhỏ hơn mở khối chữ nhiều dòng. Tạo thẻ sống bốn giây, chỉ in chữ
      thẻ, cất vào biến. Biến đặt trước lệnh chỉ có tác dụng với lệnh đó, nên thẻ
      riêng thay thẻ gốc, và hàm đặt tên cho nhóm lệnh. Gộp chữ báo lỗi vào đầu ra,
      chỉ giữ đoạn khớp.
  - show: '<p>Chính sách <b>mặc định từ chối</b>; thẻ <b>có hạn</b>: hết hạn là vô
      dụng, nên lộ cũng chỉ trong một lúc. Kho phiên bản 2 chèn <code>data</code>
      vào đường dẫn: bí mật <code>thanh-toan</code> của kho <code>secret</code> thành
      <code>secret/data/thanh-toan</code> trong chính sách.</p><p><b>Chạy thật: chính
      sách chỉ đọc và thẻ sống 4 giây (Vault 2.2.2, chế độ phát triển)</b></p><div
      class="code"><div>vault policy write chi-doc - &gt;/dev/null &lt;&lt;''P''</div><div>path
      "secret/data/thanh-toan" { capabilities = ["read"] }</div><div>P</div><div>T=<span>&#36;</span>(vault
      token create -policy=chi-doc -ttl=4s -field=token)</div><div>doc() {</div><div>  VAULT_TOKEN=<span>&#36;</span>T
      vault kv get -mount=secret -field=db_pass \</div><div>    thanh-toan 2&gt;&amp;1</div><div>}</div></div>'
    focus:
    - 1
    - - 2
      - 3
    clear: true
    say: Chính sách mặc định từ chối, và ta chỉ mở quyền đọc cho đúng một đường dẫn.
      Kho phiên bản hai chèn thêm một đoạn vào giữa đường dẫn, nên chính sách phải
      ghi đoạn ấy, thẻ chỉ sống bốn giây.
  - show: '<p>Hàm <code>ghi</code> thử ghi bằng chính thẻ chỉ đọc; <code>sleep 6</code>
      nghỉ 6 giây, quá hạn 4 giây của thẻ, rồi đọc lại.</p><p><b>Chạy thật: thử ghi
      bằng thẻ chỉ đọc, nghỉ 6 giây rồi đọc lại (kết quả ở phần ví dụ)</b></p><div
      class="code"><div>ghi() {</div><div>  VAULT_TOKEN=<span>&#36;</span>T vault
      kv put -mount=secret thanh-toan \</div><div>    db_pass=x 2&gt;&amp;1 | grep
      -o ''permission denied'' | head -1</div><div>}</div><div>echo "the doc luc 0
      giay: <span>&#36;</span>(doc | head -1)"</div><div>echo "the ghi luc 0 giay:
      <span>&#36;</span>(ghi)"</div><div>sleep 6</div><div>echo "the doc sau 6 giay:
      <span>&#36;</span>(doc | grep -o ''permission denied'' | head -1)"</div></div>'
    focus:
    - 1
    - - 2
      - 3
    clear: true
    say: Hàm ghi thử ghi bằng chính thẻ chỉ đọc. Lệnh nghỉ sáu giây nên vượt hạn bốn
      giây của thẻ, rồi đọc lại, kết quả ở phần ví dụ.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>{"hieu_luc":
      "Allow", "viec": "s3:Get*", …}</code>, <code>c["viec"]</code></td><td>danh sách
      các từ điển, mỗi từ điển là một quy tắc; <code>c["viec"]</code> lấy giá trị
      của khoá <code>viec</code> trong quy tắc <code>c</code></td><td></td></tr><tr><td><code>fnmatch.fnmatch(viec,
      c["viec"])</code></td><td><code>import fnmatch</code> nạp thư viện so khớp;
      hàm cho đúng khi chữ <code>viec</code> khớp mẫu có dấu <code>*</code></td><td><code>s3:GetObject</code>
      khớp <code>s3:Get*</code></td></tr></table>'
    clear: true
    say: Quy tắc quyền có hai cách viết mới. Mỗi quy tắc là một từ điển trong danh
      sách. Hàm cho đúng khi chữ khớp mẫu có dấu sao.
  - show: '<p><b>Bước 5. Quyền trên đám mây.</b> Mỗi quy tắc gồm hiệu lực (<code>Allow</code>/<code>Deny</code>),
      việc và tài nguyên. Dấu <code>*</code> khớp mọi ký tự: <code>s3:Get*</code>
      là mọi việc có tên bắt đầu bằng <code>Get</code> (<code>GetObject</code>…),
      <b>không</b> gồm <code>s3:ListBucket</code> (liệt kê tên tệp, cần quy tắc riêng);
      <code>bao-cao/*</code> là mọi tệp trong thư mục.</p><p><b>ChinhSach.py (trích):
      bảng CHINH_SACH, hai quy tắc</b></p><div class="code"><div>CHINH_SACH = [</div><div>    {"hieu_luc":
      "Allow", "viec": "s3:Get*", "tai_nguyen": "bao-cao/*"},</div><div>    {"hieu_luc":
      "Deny", "viec": "s3:*", "tai_nguyen": "bao-cao/rieng/*"},</div><div>]</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước năm là quyền trên đám mây: mỗi quy tắc có hiệu lực, việc và tài nguyên,
      dấu sao khớp mọi ký tự còn lại. Nên quy tắc đầu cho phép các việc bắt đầu bằng
      chữ lấy, còn quy tắc hai từ chối mọi việc trong thư mục riêng.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>def
      quyet_dinh(viec, tai_nguyen):</code></td><td>khai hàm có hai tham số; <code>return
      "…"</code> trả chữ kết quả về chỗ gọi</td></tr><tr><td><code>[c["hieu_luc"]
      for c in CHINH_SACH if … and …]</code></td><td>danh sách sinh sẵn: lấy hiệu
      lực của mỗi quy tắc <code>c</code> mà <b>cả hai</b> điều kiện nối bằng <code>and</code>
      đều đúng</td></tr><tr><td><code>"Deny" in khop</code></td><td><code>in</code>:
      đúng khi chữ <code>Deny</code> có trong danh sách <code>khop</code></td></tr></table>'
    clear: true
    say: Hàm quyết định có ba cách viết mới. Hàm có hai tham số, lệnh trả về đưa kết
      quả về chỗ gọi. Danh sách sinh sẵn lấy hiệu lực của quy tắc thoả cả hai điều
      kiện. Phép thuộc đúng khi chữ có trong danh sách.
  - show: '<p>Hướng dẫn của AWS: mọi yêu cầu bị từ chối ngầm; chỉ <code>Allow</code>
      mới mở; <b>Deny rõ ràng thắng Allow</b>. Bài mô phỏng đúng quy tắc ấy.</p><p><b>ChinhSach.py
      (trích): mô phỏng, không phải AWS thật</b></p><div class="code"><div>def quyet_dinh(viec,
      tai_nguyen):</div><div>    khop = [c["hieu_luc"] for c in CHINH_SACH</div><div>            if
      fnmatch.fnmatch(viec, c["viec"])</div><div>            and fnmatch.fnmatch(tai_nguyen,
      c["tai_nguyen"])]</div><div>    if "Deny" in khop:</div><div>        return
      "tu choi (Deny ro rang)"</div><div>    if "Allow" in khop:</div><div>        return
      "cho phep"</div><div>    return "tu choi (mac dinh)"</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Theo hướng dẫn chính thức, mọi yêu cầu bị từ chối ngầm, chỉ quy tắc cho phép
      mới mở được, và từ chối rõ ràng thắng cho phép. Đoạn mã mô phỏng đúng quy tắc
      ấy, không phải dịch vụ thật.
  - show: '<p><b>Bước 6. Cửa sổ lộ.</b> Bí mật tĩnh lộ thì kẻ xấu dùng tới khi ai
      đó đổi nó. Thẻ truy cập, hay bí mật động do kho tự tạo, có hạn nên dùng tối
      đa đến hết hạn. <b>Lưu ý:</b> mật khẩu tĩnh nằm trong kho bí mật vẫn sống sau
      khi thẻ hết hạn; chỉ bí mật động mới tự hết.</p>$$\text{cửa sổ lộ} \le \text{thời
      gian sống}: \quad 90 \times 24 = \hl{2\,160} \text{ giờ} \;\text{so với}\; \hlg{1}
      \text{ giờ}$$'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước sáu là cửa sổ lộ: bí mật tĩnh dùng được tới khi có người đổi, còn thẻ
      hay bí mật động tối đa đến hết hạn. Nên cửa sổ là chín mươi nhân hai mươi bốn,
      tức hai nghìn một trăm sáu mươi giờ, so với một giờ.'
- id: example
  kind: example
  title: Ví dụ chạy thật, từng phép tính
  checks:
  - alg.bnx_l32_decide([('Allow', 's3:Get*', 'a/*')], 's3:PutObject', 'a/x') == 'tu
