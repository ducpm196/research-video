assumes: []
objectives:
- Dựng vòng đối chiếu giữa trạng thái mong muốn trong Git và trạng thái thật rồi đọc
  việc phải làm sau mỗi lần chốt
- Giải thích hai công tắc tự xoá và tự chữa của đồng bộ tự động và vì sao mặc định
  tắt
- 'Đọc lệnh và kết quả chạy kho bí mật ở chế độ phát triển: ghi hai phiên bản, đọc
  lại phiên bản cũ và cấp thẻ chỉ đọc có hạn'
- 'Đọc kết quả đánh giá chính sách quyền: mặc định từ chối và từ chối rõ ràng thắng
  cho phép'
- Đếm số lần gọi Git của vòng đối chiếu đọc từng tệp và đọc một lần ở 10 và 200 ứng
  dụng
- Tính cửa sổ lộ của bí mật tĩnh và của thẻ có hạn
- Mô tả vai trò của mạng ảo riêng, quản lý quyền, kho đối tượng và cơ sở dữ liệu quản
  lý sẵn trong một backend tối thiểu
- Viết vòng đối chiếu nhỏ có cờ tự xoá trên số liệu mới
