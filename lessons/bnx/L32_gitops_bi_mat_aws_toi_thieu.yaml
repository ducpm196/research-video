    clear: true
    say: Kịch bản có ba dòng mới, dòng này giả lập sửa tay số bản sao lên chín. Đối
      số có tên đặt riêng một tham số, bỏ ra thì lấy mặc định. Lệnh hoàn tác chốt
      thêm một lần đảo ngược lần chốt mới nhất.
  - show: '<p><b>Chạy thật: DoiChieu.py (Python + git thật; cụm là từ điển)</b></p><div
      class="code"><div>git("init", "-q")</div><div>ghi("thanh-toan", {"anh": "v1.4",
      "ban": 3}, "them thanh-toan")</div><div>ghi("so-cai", {"anh": "v2.0", "ban":
      2}, "them so-cai")</div><div>buoc(1, "commit 1-2")</div><div>buoc(2, "khong
      doi gi")</div><div>cum["thanh-toan"]["ban"] = 9</div><div>buoc(3, "sua tay ban
      3 -&gt; 9")</div><div>buoc(4, "bat tu chua", tu_chua=True)</div><div>ghi("thanh-toan",
      {"anh": "v1.5", "ban": 3}, "thanh-toan v1.5")</div><div>buoc(5, "commit anh
      v1.5")</div><div>git("revert", "--no-edit", "HEAD")</div><div>buoc(6, "git revert")</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta chạy thật bằng Python và kho mã thật. Hai lần chốt đầu thêm hai dịch vụ,
      rồi ta gọi vòng đồng bộ sau mỗi sự kiện, còn cụm chỉ là một từ điển.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1. commit 1-2: tao
      so-cai, tao thanh-toan | lech 0</div><div>2. khong doi gi: khong viec | lech
      0</div><div>3. sua tay ban 3 -&gt; 9: khong viec | lech 1</div></div>$$① \;
      \text{2 dịch vụ mới} \Rightarrow \text{tạo 2}; \; \text{giống nhau} \Rightarrow
      0; \quad ② \; \text{sửa tay, tắt tự chữa} \Rightarrow \text{lệch } 1$$'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép tính thứ nhất, hai dịch vụ mới nên tạo hai, rồi cụm giống Git nên không
      có việc. Phép tính thứ hai, ai đó sửa tay số bản sao từ ba lên chín. Vì tự chữa
      tắt, vòng đồng bộ chỉ báo lệch một.
    introduces:
    - implies
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>4. bat tu chua: sua
      thanh-toan | lech 0</div><div>5. commit anh v1.5: sua thanh-toan | lech 0</div><div>6.
      git revert: sua thanh-toan | lech 0</div></div>$$③ \; \text{tự chữa: } ban:
      9 \to 3; \quad v1.4 \to v1.5; \quad \text{revert: } v1.5 \to v1.4$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, bật tự chữa thì vòng sau sửa số bản sao từ chín về ba.
      Lần chốt đổi ảnh sang bản một chấm năm được sửa theo, và hoàn tác đưa ảnh về
      bản một chấm bốn.
  - show: '<p>Lệnh <code>git rm</code> gỡ tệp khỏi thư mục và khỏi lần chốt sau; <code>-q</code>
      cho ít chữ. Rồi ta chốt.</p><p><b>Chạy thật: DoiChieu.py (tiếp): xoá tệp trong
      Git, rồi bật prune</b></p><div class="code"><div>git("rm", "-q", "so-cai.json")</div><div>git("commit",
      "-q", "-m", "go so-cai")</div><div>buoc(7, "xoa so-cai.json trong Git")</div><div>buoc(8,
      "bat prune", prune=True)</div></div>'
    clear: true
    say: Lệnh xoá gỡ tệp sổ cái khỏi thư mục và khỏi lần chốt sau, rồi ta chốt.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>7. xoa so-cai.json
      trong Git: khong viec | lech 1</div><div>8. bat prune: xoa so-cai | lech 0</div></div>$$\text{xoá
      tệp trong Git, tắt prune} \Rightarrow \text{dịch vụ vẫn chạy (lệch 1); bật prune}
      \Rightarrow \text{xoá}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Xoá tệp sổ cái khỏi kho mã mà chưa bật tự xoá thì dịch vụ vẫn chạy, chỉ báo
      lệch một. Bật tự xoá thì vòng sau mới xoá dịch vụ, nên công tắc mặc định tắt.
  - show: '<p><b>Chạy thật: Vault 2.2.2 ở chế độ phát triển (ảnh Docker chính thức)</b></p><div
      class="code"><div>ban moi nhat: xyz789</div><div>ban 1: abc123</div><div>the
      doc luc 0 giay: xyz789</div><div>the ghi luc 0 giay: permission denied</div><div>the
      doc sau 6 giay: permission denied</div></div>$$④ \; \text{2 phiên bản}; \quad
      \text{thẻ chỉ đọc: đọc được, ghi bị từ chối, sau } 6 > 4 \text{ giây: bị từ
      chối}$$'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép tính thứ tư là kho bí mật thật. Hai lần ghi thành hai phiên bản, đọc
      được cả hai. Thẻ chỉ đọc ghi bị từ chối, và sau sáu giây, quá hạn bốn giây,
      đọc cũng bị từ chối.
  - show: '<p><b>Chạy thật: bộ mô phỏng đánh giá quyền (không phải AWS)</b></p><div
      class="code"><div>s3:GetObject bao-cao/2026/a.csv -&gt; cho phep</div><div>s3:PutObject
      bao-cao/2026/a.csv -&gt; tu choi (mac dinh)</div><div>s3:GetObject bao-cao/rieng/b.csv
      -&gt; tu choi (Deny ro rang)</div></div>$$⑤ \; \text{có Allow} \Rightarrow \text{cho
      phép}; \quad \text{không Allow} \Rightarrow \text{từ chối mặc định}; \quad \text{Deny}
      > \text{Allow}$$'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép tính thứ năm là đánh giá quyền. Đọc tệp báo cáo khớp quy tắc cho phép
      nên được phép. Ghi vào đó không khớp quy tắc nào nên bị từ chối mặc định. Đọc
      thư mục riêng khớp cả hai, và từ chối thắng.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: lịch sử của chính Git'
  checks:
  - 'alg.bnx_l32_reconcile({''a'': 2}, {''a'': 2, ''c'': 1}, True)[0] == [''xoa c'']'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>git("log",
      "--reverse", "--name-status", "--format=%s")</code></td><td>in lịch sử: <code>--reverse</code>
      lần chốt cũ trước, mới sau; <code>--name-status</code> kèm chữ cái (<code>A</code>
      thêm, <code>M</code> sửa, <code>D</code> xoá) và tên tệp; <code>--format=%s</code>
      chỉ in dòng thông điệp</td></tr><tr><td><code>.split("\n")</code>, <code>if
      dong:</code>, <code>dong.replace("\t", " ")</code></td><td>cắt chuỗi thành các
      dòng; bỏ dòng rỗng; đổi ký tự tab (<code>\t</code>) thành dấu cách</td></tr></table>'
    clear: true
    say: Vòng in lịch sử có hai chỗ mới, nên ta giải trước. Lệnh xem lịch sử in lần
      chốt cũ trước, kèm chữ cái thêm, sửa hay xoá và tên tệp. Cắt chuỗi thành các
      dòng, bỏ dòng rỗng, và đổi ký tự nhảy cột thành dấu cách.
  - show: '<p><b>DoiChieu.py (ba dòng cuối): in lịch sử do chính Git ghi</b></p><div
      class="code"><div>for dong in git("log", "--reverse", "--name-status", "--format=%s").split("\n"):</div><div>    if
      dong:</div><div>        print(dong.replace("\t", " "))</div></div>'
    clear: true
    say: Đây là ba dòng cuối của chương trình, in lịch sử do chính Git ghi.
  - show: '<p><b>Chạy thật: đầu ra</b></p><div class="code"><div>them thanh-toan</div><div>A
      thanh-toan.json</div><div>them so-cai</div><div>A so-cai.json</div><div>thanh-toan
      v1.5</div><div>M thanh-toan.json</div><div>Revert "thanh-toan v1.5"</div><div>M
      thanh-toan.json</div><div>go so-cai</div><div>D so-cai.json</div></div>'
    clear: true
    say: 'Ta kiểm bằng đường khác: lịch sử do chính Git ghi, không qua mã của ta,
      ghi tệp nào được thêm, sửa hay xoá.'
  - show: <table class='t'><tr><th>lần chốt</th><th>Git ghi</th><th>vòng đồng bộ làm</th></tr><tr><td>v1.5</td><td>M
      thanh-toan.json (sửa)</td><td>sua thanh-toan</td></tr><tr><td>revert</td><td>M
      thanh-toan.json</td><td>sua thanh-toan (về v1.4)</td></tr><tr><td>go so-cai</td><td>D
      so-cai.json (xoá)</td><td>xoa so-cai, chỉ khi bật prune</td></tr></table>
    clear: true
    say: Lần chốt sửa ảnh ghi chữ M và vòng đồng bộ sửa. Lần hoàn tác cũng ghi chữ
      M nên sửa về bản cũ, còn lần xoá tệp ghi chữ D nên chỉ xoá khi bật tự xoá.
- id: quymo
  kind: example
  title: 'Khi hệ thống lớn dần: số lần gọi Git và cửa sổ lộ'
  checks:
  - alg.bnx_l32_git_calls(10) == (11, 2) and alg.bnx_l32_git_calls(200) == (201, 2)
  - alg.bnx_l32_hours(90) == 2160 and 10000 + 1 == 10001
  steps:
  - show: '<p><b>Chạy thật: đọc trạng thái mong muốn của n ứng dụng</b></p><div class="code"><div>10
      ung dung: tung tep 11 lan goi git, mot lan 2 | giong nhau: True</div><div>200
      ung dung: tung tep 201 lan goi git, mot lan 2 | giong nhau: True</div></div>$$10
      \to 200 \;(\times 20): \; 11 \to 201 \text{ lần gọi (từng tệp)}; \; 2 \to \hlg{2}
      \text{ lần (đọc một lần)}$$'
    focus:
    - 1
    - 2
    clear: true
    say: 'Số đo thật khi số ứng dụng tăng hai mươi lần: đọc từng tệp gọi Git một cộng
      n lần, từ mười một lên hai trăm linh một, còn đọc một lần luôn hai lần. Với
      mười nghìn ứng dụng, mỗi lần ba mươi mili giây, số minh hoạ, một vòng mất năm
      phút, dài hơn chu kỳ ba phút.'
  - show: '<table class=''t''><tr><th>cách giữ bí mật</th><th>cửa sổ lộ tối đa</th><th>với
      1, 100, 10 000 dịch vụ</th></tr><tr><td>mật khẩu tĩnh, đổi mỗi 90 ngày (số minh
      hoạ)</td><td>90 × 24 = 2 160 giờ</td><td>đổi tay 1, 100, 10 000 mật khẩu mỗi
      kỳ</td></tr><tr><td>bí mật động có hạn 1 giờ (kho bí mật tự cấp)</td><td>1 giờ</td><td>tự
