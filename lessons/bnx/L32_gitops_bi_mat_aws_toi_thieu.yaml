scenes:
- id: hook
  kind: hook
  title: 'Git ghi 3 bản sao, cụm đang chạy 9: ai đúng?'
  checks:
  - alg.bnx_l32_hours(90) == 2160
  steps:
  - show: '<p>Git ghi dịch vụ thanh toán chạy <b>3 bản sao</b>, nhưng cụm đang chạy
      <b>9</b> vì ai đó sửa tay lúc 2 giờ sáng. Mật khẩu tĩnh của cơ sở dữ liệu để
      trong kho mã sống <b>90 ngày = 2 160 giờ</b>; bí mật động do kho bí mật cấp
      (tự hết hạn) chỉ sống <b>1 giờ</b> (số minh hoạ).</p>

      <div class="box key">Ai đúng: Git hay cụm? Và nếu mật khẩu lộ, kẻ xấu dùng được
      trong bao lâu?</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, kho mã ghi dịch vụ thanh toán chạy ba bản sao, nhưng cụm đang chạy
      chín vì ai đó sửa tay lúc hai giờ sáng. Mật khẩu tĩnh sống chín mươi ngày, tức
      hai nghìn một trăm sáu mươi giờ, còn bí mật động chỉ sống một giờ. Ai đúng,
      và mật khẩu lộ thì dùng được bao lâu?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>ai
      giữ cho cụm khớp với điều đã khai</td><td><b>GitOps</b>: trạng thái mong muốn
      nằm trong Git; công cụ (Argo CD) chạy <b>vòng đối chiếu</b></td></tr><tr><td>tự
      xoá và tự chữa có nguy hiểm không</td><td>hai công tắc <code>prune</code>, <code>selfHeal</code>:
      <b>mặc định tắt</b></td></tr><tr><td>bí mật để đâu</td><td>không để trong Git:
      kho bí mật (Vault) cấp <b>thẻ có hạn</b>, quyền tối thiểu</td></tr><tr><td>hạ
      tầng đám mây tối thiểu</td><td>mạng ảo (VPC), quyền (IAM), kho đối tượng (S3),
      cơ sở dữ liệu quản lý sẵn (RDS)</td></tr></table>'
    clear: true
    say: 'Hôm nay ta trả lời bốn câu: ai giữ cụm khớp với kho mã, hai công tắc tự
      xoá và tự chữa, bí mật để đâu, và hạ tầng đám mây tối thiểu.'
- id: prereq
  kind: prereq
  title: 'Trước hết: sáu điều cần hiểu'
  checks:
  - alg.bnx_l32_hours(1) == 24
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      mong muốn và thật</td><td><b>mong muốn</b>: điều ta khai; <b>thật</b>: điều
      đang chạy; hai thứ có thể lệch nhau</td><td>khai 3 bản sao, đang chạy 9</td></tr><tr><td>②
      Git</td><td>kho ghi từng lần <b>chốt</b> thay đổi; hoàn tác = thêm một lần chốt
      đảo ngược</td><td><code>git revert</code></td></tr><tr><td>③ cụm (cluster)</td><td>nhóm
      máy chạy ứng dụng đóng gói sẵn; ta chỉ khai &laquo;muốn 3 bản sao&raquo;</td><td>Kubernetes</td></tr><tr><td>④
      vòng đối chiếu</td><td>lặp đi lặp lại: so sánh, rồi sửa cho khớp</td><td>mỗi
      3 phút</td></tr><tr><td>⑤ bí mật</td><td>mật khẩu, khoá, mã truy cập: lộ là
      mất quyền</td><td>mật khẩu cơ sở dữ liệu</td></tr><tr><td>⑥ quyền tối thiểu</td><td>chỉ
      cấp đúng điều cần, mặc định là không được</td><td>chỉ đọc một đường dẫn</td></tr></table>'
    say: Trước hết ta cần hiểu sáu điều, trạng thái mong muốn và trạng thái thật có
      thể lệch nhau. Kho mã ghi từng lần chốt, còn cụm chạy ứng dụng. Vòng đối chiếu
      so sánh rồi sửa, bí mật lộ là mất quyền, nên quyền tối thiểu là chỉ cấp đúng
      điều cần.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l32_decide([('Allow', 's3:Get*', 'a/*')], 's3:GetObject', 'a/x') == 'cho
    phep'
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>anh</code>,
      <code>ban</code></td><td>trong tệp JSON của bài: phiên bản ảnh và số bản sao
      của một dịch vụ</td></tr><tr><td><code>prune</code>, <code>selfHeal</code></td><td>tự
      xoá thứ không còn trong Git; tự sửa thứ bị sửa tay trong cụm</td></tr><tr><td><code>kv
      put -mount=secret</code></td><td>ghi một bí mật vào kho bí mật; mỗi lần ghi
      là một phiên bản</td></tr><tr><td><code>-ttl=4s</code></td><td>thời gian sống
      của thẻ: hết 4 giây thì thẻ vô dụng</td></tr><tr><td><code>capabilities = [&quot;read&quot;]</code></td><td>chính
      sách chỉ cho phép đọc</td></tr><tr><td><code>Allow</code>, <code>Deny</code></td><td>cho
      phép, từ chối; từ chối rõ ràng thắng cho phép</td></tr></table>'
    say: 'Bảng này giải mã các tên của bài: ảnh và bản sao, hai công tắc, thẻ sống
      bốn giây, và từ chối rõ ràng thắng cho phép.'
