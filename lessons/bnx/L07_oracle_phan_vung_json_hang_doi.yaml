    clear: true
    say: Hình dung bảng phân vùng như một tủ mười hai ngăn, mỗi ngăn là một tháng.
      Truy vấn tháng ba chỉ cần mở ngăn thứ ba, có ba trăm mười dòng. Vì máy biết
      ngăn nào chứa ngày nào, nó bỏ qua mười một ngăn kia, việc này gọi là cắt tỉa
      phân vùng. Còn truy vấn không lọc theo ngày, nếu không có chỉ mục riêng, thì
      máy phải mở cả mười hai ngăn.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: phân vùng và JSON'
  checks:
  - alg.bnx_l07_position('2025-03-15') == 3
  - alg.bnx_l07_partitions(alg.bnx_l07_load(3650)) == 1 + 11
  - alg.bnx_l07_prune('2025-03-01', '2025-04-01') == (3, 3)
  - 'alg.bnx_l07_json_ids({1: ''{"kenh":"app","so_tien":500000}'', 2: ''{"kenh":"atm","so_tien":2000000}'',
    3: ''{"kenh":"app"''}, ''so_tien'', 1000000) == ([1, 2], [2])'
  steps:
  - show: '<p><b>Bước 1. Chọn khoá phân vùng là ngày</b>, vì sao kê, đối soát, xoá
      dữ liệu hết hạn đều theo khoảng ngày.</p><div class="code"><div>DROP TABLE IF
      EXISTS bnx_l07_gd;</div><div>CREATE TABLE bnx_l07_gd (</div><div>  id      NUMBER,</div><div>  ngay    DATE,</div><div>  so_tien
      NUMBER)</div><div>PARTITION BY RANGE (ngay)</div><div>INTERVAL (NUMTOYMINTERVAL(1,
      ''MONTH''))</div><div>(PARTITION p_2025_01 VALUES LESS THAN (DATE ''2025-02-01''));</div></div><p
      class=''note''>Làm thử: ngày 15/3/2025 ≥ 1/2/2025 nên không vào phân vùng đầu;
      nó vào phân vùng tháng 3, vị trí 3. <code>DROP TABLE IF EXISTS</code> xoá bảng
      cũ nếu có.</p>'
    focus:
    - - 1
    - 2
    - 2
    - 3
    say: Bước một, chọn khoá phân vùng, hai dòng đầu xoá bảng cũ nếu có rồi tạo bảng
      mới có ba cột. Vì sao kê, đối soát và xoá dữ liệu hết hạn đều làm theo khoảng
      ngày, nên ta chia theo cột ngày, mỗi phân vùng một tháng. Ta chỉ khai phân vùng
      đầu, còn các tháng sau để Oracle tự tạo. Làm thử, ngày mười lăm tháng ba rơi
      vào phân vùng thứ ba.
  - show: "<p><b>Bước 2. Nạp một năm dữ liệu.</b> Mẹo sinh nhiều dòng: <code>dual</code>\
      \ là bảng một dòng có sẵn; <code>CONNECT BY ROWNUM &lt;= 3</code> nhân nó lên\
      \ 3 dòng, <code>ROWNUM</code> là số thứ tự dòng.</p><div class=\"code\"><div>SELECT\
      \ ROWNUM FROM dual CONNECT BY ROWNUM &lt;= 3;</div></div><p><b>Kết quả chạy\
      \ thật</b></p><div class=\"code\"><div>    ROWNUM</div><div>----------</div><div>\t\
      \ 1</div><div>\t 2</div><div>\t 3</div></div>"
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, nạp dữ liệu, và trước hết một mẹo sinh nhiều dòng. Bảng một dòng
      có sẵn của Oracle, mệnh đề lặp theo số thứ tự dòng nhỏ hơn hoặc bằng ba, nhân
      dòng ấy lên ba dòng. Số thứ tự dòng đếm từ một, nên ta được một, hai, ba.
  - show: '<p>Nạp 3 650 dòng bằng cùng mẹo: Oracle tự tạo 11 phân vùng cho tháng 2
      tới tháng 12.</p><div class="code"><div>INSERT INTO bnx_l07_gd</div><div>SELECT
      ROWNUM, DATE ''2025-01-01'' + TRUNC((ROWNUM - 1) / 10),</div><div>       (MOD(ROWNUM,
      100) + 1) * 100000</div><div>FROM dual CONNECT BY ROWNUM &lt;= 3650;</div><div>COMMIT;</div><div>SELECT
      COUNT(*) AS so_dong FROM bnx_l07_gd;</div><div>SELECT COUNT(*) AS so_phan_vung
      FROM user_tab_partitions</div><div> WHERE table_name = ''BNX_L07_GD'';</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Giờ nạp ba nghìn sáu trăm năm mươi dòng, mỗi ngày mười dòng. Số thứ tự trừ
      một rồi chia mười, bỏ phần lẻ, làm cho mười dòng liền nhau có cùng một ngày,
      còn phần dư làm số tiền thay đổi theo dòng. Lệnh chốt, rồi hai câu đếm số dòng
      và số phân vùng. Vì dữ liệu vượt mốc của phân vùng đầu, Oracle tự tạo thêm phân
      vùng.
  - show: "<p><b>Kết quả chạy thật</b></p><div class=\"code\"><div>   SO_DONG</div><div>----------</div><div>\
      \      3650</div><div>SO_PHAN_VUNG</div><div>------------</div><div>\t  12</div></div><p\
      \ class='note'>Làm thử: 1 phân vùng khai sẵn + 11 phân vùng tự tạo = 12.</p>"
    focus:
    - 1
    - 2
    clear: true
    say: Làm thử, vì năm có mười hai tháng, một phân vùng khai sẵn cộng mười một tự
      tạo là mười hai. Đầu ra thật in ba nghìn sáu trăm năm mươi dòng và mười hai
      phân vùng.
  - show: '<p><b>Bước 3. Hỏi máy định đọc mấy phân vùng</b>, không cần chạy thật câu
      lệnh.</p><div class="code"><div>EXPLAIN PLAN FOR</div><div>SELECT COUNT(*) FROM
      bnx_l07_gd</div><div> WHERE ngay &gt;= DATE ''2025-03-01'' AND ngay &lt; DATE
      ''2025-04-01'';</div><div>SELECT * FROM TABLE(</div><div>  DBMS_XPLAN.DISPLAY(NULL,
      NULL, ''BASIC +PARTITION''));</div></div><p class=''note''>Làm thử: điều kiện
      từ 1/3 tới trước 1/4 nằm gọn trong phân vùng 3, nên chờ Pstart = Pstop = 3.
      Ngày truyền qua <b>biến gắn</b> (giữ chỗ dạng <code>:ngay</code>, giá trị đưa
      vào lúc chạy): Pstart, Pstop ghi KEY (chọn lúc chạy).</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, muốn biết máy định đọc mấy phân vùng mà không phải chạy câu lệnh,
      ta dùng lệnh xem kế hoạch rồi in ra. Điều kiện viết thẳng trên cột ngày, từ
      mùng một tháng ba tới trước mùng một tháng tư. Làm thử, khoảng này nằm gọn trong
      phân vùng thứ ba, nên ta chờ phân vùng đầu và cuối đều là ba. Nếu ngày truyền
      qua biến gắn, tức chỗ giữ dạng hai chấm kèm tên cho giá trị đưa vào lúc chạy,
      kế hoạch ghi chữ khoá, vì phân vùng chọn lúc chạy.
  - show: '<p><b>Bước 4. Phần thay đổi theo kênh lưu dạng JSON</b>, có ràng buộc <code>IS
      JSON</code> chặn chuỗi hỏng. <code>PRIMARY KEY</code>: khoá chính, mã không
      được trùng.</p><div class="code"><div>DROP TABLE IF EXISTS bnx_l07_js;</div><div>CREATE
      TABLE bnx_l07_js (</div><div>  id       NUMBER PRIMARY KEY,</div><div>  chi_tiet
      VARCHAR2(400)</div><div>           CONSTRAINT bnx_l07_isj CHECK (chi_tiet IS
      JSON));</div><div>INSERT INTO bnx_l07_js VALUES (1, ''{"kenh":"app","so_tien":500000}'');</div><div>INSERT
      INTO bnx_l07_js VALUES (2, ''{"kenh":"atm","so_tien":2000000}'');</div><div>COMMIT;</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, mỗi kênh có thông tin riêng, máy rút tiền có mã máy, ứng dụng có
      mã thiết bị. Vì không muốn thêm cột mỗi khi có kênh mới, ta lưu phần đó ở dạng
      JSON, trong cột chữ dài tối đa bốn trăm ký tự. Ràng buộc kiểm tra chỉ nhận chuỗi
      có dạng JSON, nên chuỗi hỏng không lọt vào bảng. Khoá chính nghĩa là mã không
      được trùng.
  - show: "<p><b>Bước 5. Thử chèn chuỗi hỏng, rồi lọc theo một trường bên trong.</b></p><div\
      \ class=\"code\"><div>INSERT INTO bnx_l07_js VALUES (3, '{\"kenh\":\"app\"');</div><div>SELECT\
      \ id,</div><div>       JSON_VALUE(chi_tiet, '<span>&#36;</span>.kenh' RETURNING\
      \ VARCHAR2(10)) AS kenh</div><div>FROM bnx_l07_js</div><div>WHERE JSON_VALUE(chi_tiet,\
      \ '<span>&#36;</span>.so_tien' RETURNING NUMBER) &gt; 1000000;</div></div><p><b>Kết\
      \ quả chạy thật</b></p><div class=\"code\"><div>ORA-02290: check constraint\
      \ (BNX.BNX_L07_ISJ) violated</div><div>\tID KENH</div><div>---------- ----------</div><div>\t\
      \ 2 atm</div></div>"
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước năm, chèn một chuỗi thiếu dấu đóng ngoặc, ràng buộc từ chối ngay. Rồi
      lọc các dòng có số tiền bên trong lớn hơn một triệu, và lấy ra trường kênh.
      Làm thử, năm trăm nghìn không lớn hơn một triệu, hai triệu thì lớn hơn, nên
      chỉ còn dòng hai, kênh máy rút tiền, khớp đầu ra thật.
- id: example
  kind: example
  title: 'Ví dụ chạy thật: cắt tỉa phân vùng, từng phép tính'
  checks:
  - len(alg.bnx_l07_load(3650)) == 365 * 10
  - alg.bnx_l07_partitions(alg.bnx_l07_load(3650)) == 12
  - alg.bnx_l07_count(alg.bnx_l07_load(3650), '2025-03-01', '2025-04-01') == 310
  - alg.bnx_l07_prune('2025-03-01', '2025-04-01') == (3, 3)
  - round(100 * alg.bnx_l07_count(alg.bnx_l07_load(3650), '2025-03-01', '2025-04-01')
    / len(alg.bnx_l07_load(3650)), 1) == 8.5
  - round(len(alg.bnx_l07_load(3650)) / alg.bnx_l07_count(alg.bnx_l07_load(3650),
    '2025-03-01', '2025-04-01'), 1) == 11.8
  - alg.bnx_l07_max_partitions() == 1048575
  steps:
  - show: '$$① \; 365 \cdot 10 = \hl{3\,650}\ \text{dòng}$$

      $$② \; 1 + 11 = \hl{12}\ \text{phân vùng}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ nhất, ba trăm sáu mươi lăm ngày nhân mười, bằng ba nghìn sáu
      trăm năm mươi dòng, khớp số dòng thật ở bước hai. Phép tính thứ hai, một phân
      vùng khai sẵn cộng mười một phân vùng tự tạo, bằng mười hai.
  - show: "$$③ \\; 31 \\cdot 10 = \\hl{310}\\ \\text{dòng của tháng 3, nằm trong phân\
      \ vùng 3}$$<p><b>Kết quả chạy thật</b></p><div class=\"code\"><div>--------------------------------------------------------------</div><div>|\
      \ Id  | Operation\t\t| Name\t     | Pstart| Pstop |</div><div>--------------------------------------------------------------</div><div>|\
      \   0 | SELECT STATEMENT\t|\t     |\t     |\t     |</div><div>|   1 |  SORT\
      \ AGGREGATE \t|\t     |\t     |\t     |</div><div>|   2 |   PARTITION RANGE\
      \ SINGLE|\t     |\t   3 |\t   3 |</div><div>|   3 |    TABLE ACCESS FULL\t|\
      \ BNX_L07_GD |\t   3 |\t   3 |</div><div>--------------------------------------------------------------</div></div>"
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, tháng ba có ba mươi mốt ngày nhân mười, bằng ba trăm mười
      dòng, tất cả nằm trong phân vùng thứ ba. Kế hoạch thật ghi đọc đơn một phân
      vùng, phân vùng đầu và cuối đều là ba, đúng như ta chờ.
  - show: $$④ \; \frac{310}{3\,650} \approx \hlg{8{,}5\%}\ \text{số dòng phải đọc}$$
    say: Phép tính thứ tư dùng lại hai số trên. Ba trăm mười chia ba nghìn sáu trăm
      năm mươi, xấp xỉ tám phẩy năm phần trăm. Nhờ cắt tỉa, máy chỉ đọc chừng ấy số
      dòng.
  - show: "<p>Truy vấn không lọc theo ngày (tìm giao dịch trên 5 000 000):</p><div\
      \ class=\"code\"><div>EXPLAIN PLAN FOR</div><div>SELECT COUNT(*) FROM bnx_l07_gd\
      \ WHERE so_tien &gt; 5000000;</div><div>SELECT * FROM TABLE(</div><div>  DBMS_XPLAN.DISPLAY(NULL,\
      \ NULL, 'BASIC +PARTITION'));</div></div><p><b>Kết quả chạy thật</b></p><div\
      \ class=\"code\"><div>-----------------------------------------------------------</div><div>|\
      \ Id  | Operation\t     | Name\t  | Pstart| Pstop |</div><div>-----------------------------------------------------------</div><div>|\
      \   0 | SELECT STATEMENT     |\t\t  |\t  |\t  |</div><div>|   1 |  SORT AGGREGATE\
      \      |\t\t  |\t  |\t  |</div><div>|   2 |   PARTITION RANGE ALL|\t\t  |\t\
      1 |1048575|</div><div>|   3 |    TABLE ACCESS FULL | BNX_L07_GD |\t1 |1048575|</div><div>-----------------------------------------------------------</div></div>"
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Giờ thử một truy vấn không lọc theo ngày, tìm giao dịch trên năm triệu. Kế
      hoạch thật ghi đọc tất cả, từ phân vùng một. Cột cuối là một triệu không trăm
      bốn mươi tám nghìn năm trăm bảy mươi lăm, đúng bằng số phân vùng tối đa một
      bảng được có.
  - show: '$$⑤ \; \frac{3\,650}{310} \approx \hl{11{,}8}\ \text{lần nhiều dòng hơn}$$

      <p class=''note''>$1\,048\,575 = 1024 \cdot 1024 - 1$: giới hạn số phân vùng
      của một bảng Oracle.</p>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ năm, không lọc theo ngày thì phải đọc cả ba nghìn sáu trăm
      năm mươi dòng. Chia cho ba trăm mười, ta được xấp xỉ mười một phẩy tám lần nhiều
      dòng hơn.
