    say: Tổng kết chuỗi logic. Truy vấn ngân hàng thường lọc theo ngày, nên ta phân
      vùng theo tháng, và đọc kế hoạch để chắc máy chỉ mở một phân vùng. Thông báo
      cho hệ khác có thể đi qua hàng đợi chung giao dịch với dữ liệu. Bộ nhớ cột và
      phân mảnh chỉ dùng khi đã đo thấy cần.
  - show: <div class='box key'><b>Tư duy:</b> đừng đoán máy đọc gì, hãy hỏi kế hoạch
