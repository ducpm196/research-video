  steps:
  - show: "<div class=\"box warn\"><b>Lỗi 1 (người đã đi làm): bọc cột phân vùng trong\
      \ hàm.</b> Cùng ý “tháng 3”, viết bằng <code>TRUNC</code>:</div><div class=\"\
      code\"><div>EXPLAIN PLAN FOR</div><div>SELECT COUNT(*) FROM bnx_l07_gd</div><div>\
      \ WHERE TRUNC(ngay, 'MM') = DATE '2025-03-01';</div><div>SELECT * FROM TABLE(</div><div>\
      \  DBMS_XPLAN.DISPLAY(NULL, NULL, 'BASIC +PARTITION'));</div></div><p><b>Kết\
      \ quả chạy thật</b></p><div class=\"code\"><div>…</div><div>|   2 |   PARTITION\
      \ RANGE ALL|\t\t  |\t1 |1048575|</div><div>|   3 |    TABLE ACCESS FULL | BNX_L07_GD\
      \ |\t1 |1048575|</div></div>"
    focus:
    - 1
    - 2
    - 3
    - 4
    say: Lỗi thứ nhất, của người đã đi làm, là bọc cột phân vùng trong một hàm. Câu
      này cũng hỏi tháng ba, nhưng cắt ngày về đầu tháng rồi mới so. Kế hoạch thật
      ghi đọc tất cả phân vùng, vì máy không cắt tỉa được khi cột bị biến đổi. Cách
      chữa là viết điều kiện khoảng trên cột gốc.
  - show: <table class='t'><tr><th>cách viết trong SQL</th><th>nghĩa</th></tr><tr><td><code>CASE
      WHEN điều kiện THEN a ELSE b END</code></td><td>nếu điều kiện đúng thì cho <code>a</code>,
      không thì cho <code>b</code></td></tr><tr><td><code>'{kenh:''app''}'</code></td><td>trong
      chuỗi, hai dấu nháy đơn liền nhau <code>''</code> là một dấu nháy đơn; chuỗi
      này là <code>{kenh:'app'}</code></td></tr></table>
    clear: true
    say: Câu sắp tới có hai cách viết mới, nên ta giải nghĩa trước. Cách viết chọn
      một trong hai giá trị tuỳ điều kiện. Hai dấu nháy đơn liền nhau trong một chuỗi
      là một dấu nháy đơn.
  - show: "<div class=\"box warn\"><b>Lỗi 2: tưởng <code>IS JSON</code> là JSON chuẩn.</b>\
      \ Chuỗi <code>{kenh:'app'}</code> (tên trường không nháy kép, nháy đơn quanh\
      \ giá trị):</div><div class=\"code\"><div>SELECT CASE WHEN '{kenh:''app''}'\
      \ IS JSON</div><div>            THEN 'nhan' ELSE 'tu choi' END AS lax,</div><div>\
      \       CASE WHEN '{kenh:''app''}' IS JSON (STRICT)</div><div>            THEN\
      \ 'nhan' ELSE 'tu choi' END AS strict</div><div>FROM dual;</div></div><p><b>Kết\
      \ quả chạy thật</b></p><div class=\"code\"><div>LAX\tSTRICT</div><div>-------\
      \ -------</div><div>nhan\ttu choi</div></div>"
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai là tưởng ràng buộc JSON luôn đúng chuẩn. Chuỗi này có tên trường
      không nháy kép và nháy đơn quanh giá trị, không phải JSON chuẩn. Chế độ lỏng
      mặc định vẫn nhận nó, còn chế độ chặt từ chối, nên cần chế độ chặt.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm): bỏ nhầm phân vùng.</b>
      Bỏ phân vùng tháng 1, rồi thử hoàn tác:</div><div class="code"><div>ALTER TABLE
      bnx_l07_gd DROP PARTITION FOR (DATE ''2025-01-15'');</div><div>ROLLBACK;</div><div>SELECT
      COUNT(*) AS so_dong FROM bnx_l07_gd;</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>   SO_DONG</div><div>----------</div><div>      3340</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là bỏ nhầm phân vùng. Lệnh bỏ phân vùng
      tự chốt ngay, nên lệnh hoàn tác sau đó không cứu được gì. Bảng còn ba nghìn
      ba trăm bốn mươi dòng, tức mất đúng ba trăm mười dòng của tháng một. Vì thế
      phải kiểm kỹ ngày trước khi bỏ.
