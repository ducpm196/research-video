      hệ riêng bên ngoài</text><rect x="940" y="110" width="490" height="90" rx="10"
      fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1185.0" y="148" font-size="22"
      text-anchor="middle" fill="#1f2937">ghi cơ sở dữ liệu và gửi Kafka</text><text
      x="1185.0" y="178" font-size="22" text-anchor="middle" fill="#1f2937">là hai
      việc riêng</text><rect x="940" y="260" width="490" height="80" rx="10" fill="#e5e7eb"
      stroke="#6b7280" stroke-width="3"/><text x="1185.0" y="308" font-size="22" text-anchor="middle"
      fill="#1f2937">cần thêm cách giữ nhất quán</text><line x1="1185" y1="205" x2="1185"
      y2="255" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><text x="1185"
