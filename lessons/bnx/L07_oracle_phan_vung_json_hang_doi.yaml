      này một nghìn dòng mỗi ngày, gấp một trăm lần ví dụ, tức ba trăm sáu mươi lăm
      nghìn dòng cả năm. Hai câu cuối đếm cả bảng và riêng phân vùng tháng ba.
  - show: <p><b>Kết quả chạy thật trên Oracle</b></p><div class="code"><div>    CA_NAM</div><div>----------</div><div>    365000</div><div>   THANG_3</div><div>----------</div><div>     31000</div></div><table
      class='t'><tr><th>số dòng cả năm</th><th>máy đọc nếu cắt tỉa (một tháng)</th><th>máy
      đọc nếu không cắt tỉa</th><th>tỉ lệ (nếu phân bố đều)</th></tr><tr><td>3 650
      (ví dụ)</td><td>310</td><td>3 650</td><td>31 / 365</td></tr><tr><td>365 000
      (gấp 100, đo)</td><td>31 000</td><td>365 000</td><td>31 / 365</td></tr><tr><td>36
