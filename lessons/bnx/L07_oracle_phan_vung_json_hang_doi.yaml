  - '[p * 365 for p in (10, 1000, 100000)] == [3650, 365000, 36500000]'
  steps:
  - show: '<p><b>Nạp lại bảng gấp 100 lần: 1 000 dòng mỗi ngày, rồi đếm cả bảng và
      riêng phân vùng tháng 3</b></p><div class="code"><div>DROP TABLE IF EXISTS bnx_l07_lon;</div><div>CREATE
      TABLE bnx_l07_lon (id NUMBER, ngay DATE, so_tien NUMBER)</div><div>PARTITION
      BY RANGE (ngay) INTERVAL (NUMTOYMINTERVAL(1, ''MONTH''))</div><div>(PARTITION
      p0 VALUES LESS THAN (DATE ''2025-02-01''));</div><div>INSERT INTO bnx_l07_lon</div><div>SELECT
      ROWNUM, DATE ''2025-01-01'' + TRUNC((ROWNUM - 1) / 1000), 100000</div><div>FROM
      dual CONNECT BY ROWNUM &lt;= 365000;</div><div>COMMIT;</div><div>SELECT COUNT(*)
      AS ca_nam FROM bnx_l07_lon;</div><div>SELECT COUNT(*) AS thang_3 FROM bnx_l07_lon</div><div>
