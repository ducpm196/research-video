    pause: 25
    say: Đến lượt bạn, ba câu trên màn hình. Câu ba chọn cột JSON hay thêm cột, hãy
      dừng video và làm ra giấy.
  - show: '<p>Câu 1: khoảng chạm tháng 3, 4, 5 → phân vùng 3 tới 5 (kế hoạch thật:
      <code>PARTITION RANGE ITERATOR</code> = đọc lần lượt một dãy phân vùng liền
      nhau, Pstart 3, Pstop 5).</p>

      $$17 + 30 + 14 = 61\ \text{ngày}, \qquad 61 \cdot 10 = \hl{610}\ \text{dòng}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu một, khoảng này chạm tháng ba, tháng tư và tháng năm, nên máy
      đọc dãy phân vùng liền nhau, từ ba tới năm. Mười bảy ngày cuối tháng ba, cộng
      ba mươi ngày tháng tư, cộng mười bốn ngày đầu tháng năm, là sáu mươi mốt ngày,
      nhân mười được sáu trăm mười dòng.
    clear: true
  - show: '<p>Câu 2: cả khoảng nằm trong tháng 2, phân vùng 2: <code>PARTITION RANGE
      SINGLE</code>, Pstart = Pstop = 2.</p>

      $$10 \cdot 10 = \hl{100}\ \text{dòng}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu hai, cả khoảng nằm trong tháng hai, nên kế hoạch ghi đọc đơn một
      phân vùng, hai cột cuối đều là hai. Mười ngày nhân mười dòng là một trăm.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>cột
      JSON</td><td>kênh mới không phải đổi bảng; <code>IS JSON</code> chặn chuỗi hỏng</td><td>kiểm
      kiểu từng trường yếu hơn; lọc theo trường nếu chưa có chỉ mục riêng thì phải
      đọc từng dòng</td></tr><tr><td>một cột cho mỗi thông tin</td><td>kiểu và ràng
      buộc từng cột, chỉ mục thường</td><td>kênh mới là phải đổi bảng; nhiều cột trống</td></tr></table>
    say: Đáp án câu ba, tuỳ nhu cầu. Cột JSON thêm kênh mới không phải đổi bảng, đổi
      lại kiểm kiểu từng trường yếu hơn, và lọc theo trường chưa có chỉ mục riêng
      thì phải đọc từng dòng. Một cột cho mỗi thông tin thì kiểu chặt, nhưng thêm
      kênh mới là phải đổi bảng. Thông tin ổn định, hay lọc thì nên là cột.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: JSON có ràng buộc (sqlite) và Oracle Free tự dựng'
  steps:
  - show: '<p><b>Đề</b>: sqlite có bảng <code>gd (id, chi_tiet)</code> với <code>CHECK
      (json_valid(chi_tiet))</code>. Viết <code>mau.py</code>:</p>

      <ol><li>chèn năm dòng cho sẵn; dòng nào JSON hỏng thì in <code>dong N: tu choi
      (JSON hong)</code></li><li>in tổng <code>tien</code> kênh <code>atm</code>,
      số giao dịch kênh <code>app</code>, số giao dịch máy <code>A7</code> (lấy trường
      bằng <code>json_extract</code> hoặc cách viết ngắn <code>-&gt;&gt;</code>, như
      <code>chi_tiet -&gt;&gt; ''&#36;.tien''</code>)</li></ol>

      <p class="note">Oracle không có trong bộ chấm: sqlite đại diện, <code>CHECK
      (json_valid)</code> ứng với <code>IS JSON</code>. Năm dòng dữ liệu nằm trong
      <code>de.md</code>.</p>

      '
    focus:
    - 1
    - 1
    - - 2
      - 3
    pause: 120
    say: Bây giờ tới phần bạn tự làm, trên cơ sở dữ liệu nhỏ có sẵn trong Python vì
      bộ chấm không có Oracle. Chèn năm dòng cho sẵn, in dòng bị từ chối, rồi tính
      tổng và đếm giao dịch. Mũi tên kép là cách viết ngắn của hàm lấy trường, hãy
      dừng video và tự viết.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>dong 3: tu choi (JSON
      hong)</div><div>tong tien kenh atm: 800000</div><div>so giao dich kenh app:
      2</div><div>may A7: 2 giao dich</div></div><p class="note">Chấm bằng Git Bash:
      <code>bash labs/cham.sh BNX L07 mau.py</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> bắt <code>sqlite3.IntegrityError</code>
      quanh mỗi lệnh chèn. Lấy trường bằng <code>json_extract(chi_tiet, ''&#36;.tien'')</code>,
      lọc kênh bằng <code>json_extract(chi_tiet, ''&#36;.kenh'') = ''atm''</code>.

      Lời giải ở <code>labs/BNX/L07/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, bắt lỗi ràng buộc quanh mỗi lệnh chèn, rồi lấy trường trong JSON
      bằng hàm trích theo đường dẫn và lọc theo kênh. Lời giải nằm trong thư mục thực
      hành, chỉ mở sau khi đã tự thử.
    clear: true
  - show: <table class='t'><tr><th>lệnh</th><th>nghĩa</th></tr><tr><td><code>docker
      run -d --name ora-thu -p 1521:1521 -e … gvenzl/oracle-free:23-slim</code></td><td>chạy
      một “thùng” phần mềm ở nền (<code>-d</code>), đặt tên <code>ora-thu</code>,
      mở cổng 1521 ra máy (<code>-p</code>), đặt biến cấu hình như mật khẩu (<code>-e</code>);
      dòng cuối là tên ảnh phần mềm</td></tr><tr><td><code>docker logs -f ora-thu</code></td><td>xem
      nhật ký của thùng; đợi dòng <code>DATABASE IS READY TO USE!</code> rồi mới vào</td></tr><tr><td><code>docker
      exec -it ora-thu sqlplus bnx/bnx_pass@//localhost/FREEPDB1</code></td><td>chạy
      <code>sqlplus</code>, dòng lệnh SQL của Oracle, bên trong thùng, với tài khoản
      <code>bnx</code></td></tr></table>
    clear: true
    say: Muốn làm trên Oracle thật, bạn dựng bản miễn phí bằng Docker, công cụ chạy
      phần mềm trong một thùng đóng gói sẵn. Lệnh đầu chạy thùng ở nền và mở cổng,
      lệnh thứ hai xem nhật ký để đợi sẵn sàng, và lệnh cuối mở dòng lệnh SQL trong
      thùng.
  - show: '<p><b>Làm thêm trên Oracle thật</b> (không chấm tự động): dựng Oracle Free
      23 bằng Docker rồi vào dòng lệnh <code>sqlplus</code>.</p><div class="code"><div>docker
      run -d --name ora-thu -p 1521:1521 \</div><div>  -e ORACLE_PASSWORD=Mat_Khau_Thu
      \</div><div>  -e APP_USER=bnx -e APP_USER_PASSWORD=bnx_pass \</div><div>  gvenzl/oracle-free:23-slim</div><div>docker
      logs -f ora-thu</div><div>docker exec -it ora-thu sqlplus bnx/bnx_pass@//localhost/FREEPDB1</div></div><p
      class="note">Dán lại khối tạo bảng và nạp ở bước 1–2, chạy kế hoạch ở bước 3:
      phải thấy <code>PARTITION RANGE SINGLE</code>, Pstart = Pstop = 3.</p>'
    clear: true
    say: 'Sau khi vào được, dán lại khối tạo bảng và nạp, rồi chạy kế hoạch tháng
      ba: máy phải chỉ đọc đơn phân vùng ba.'
