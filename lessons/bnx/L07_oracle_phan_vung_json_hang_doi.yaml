      x="30" y="20" width="820" height="430" rx="12" fill="#dcfce7" stroke="#16a34a"
      stroke-width="3"/><text x="440.0" y="56" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">Hàng đợi trong cơ sở dữ liệu: một giao dịch</text><rect
      x="70" y="110" width="360" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="250.0" y="148" font-size="22" text-anchor="middle"
      fill="#1f2937">ghi giao dịch</text><text x="250.0" y="178" font-size="22" text-anchor="middle"
