      text-anchor="middle" fill="#1f2937">T12</text></svg></div>'
    clear: true
    say: Hình dung bảng phân vùng như một tủ mười hai ngăn, mỗi ngăn là một tháng.
      Truy vấn tháng ba chỉ cần mở ngăn thứ ba, có ba trăm mười dòng. Vì máy biết
      ngăn nào chứa ngày nào, nó bỏ qua mười một ngăn kia, việc này gọi là cắt tỉa
      phân vùng. Còn truy vấn không lọc theo ngày thì không biết ngăn nào chứa kết
      quả. Nếu không có chỉ mục riêng trên cột lọc, máy phải mở cả mười hai ngăn,
      ba nghìn sáu trăm năm mươi dòng.
  - show: '<div><svg width="1500" height="470" viewBox="0 0 1500 470" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
