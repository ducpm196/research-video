      \ quả chạy thật</b></p><div class=\"code\"><div>…</div><div>|   2 |   PARTITION\
      \ RANGE ALL|\t\t  |\t1 |1048575|</div><div>|   3 |    TABLE ACCESS FULL | BNX_L07_GD\
      \ |\t1 |1048575|</div></div>"
    focus:
    - 1
    - 2
    - 3
    - 4
    say: Lỗi thứ nhất, của người đã đi làm, là bọc cột phân vùng trong một hàm. Câu
      này cũng hỏi tháng ba, nhưng cắt ngày về đầu tháng rồi mới so. Kế hoạch thật
      ghi đọc tất cả phân vùng, vì máy không cắt tỉa được khi cột bị biến đổi. Cách
      chữa là viết điều kiện khoảng trên cột gốc, như ở bước ba.
  - show: '<table class=''t''><tr><th></th><th>hàng đợi trong Oracle</th><th>Kafka</th></tr><tr><td>chung
      giao dịch với dữ liệu</td><td>có: hoàn tác thì thông điệp cũng mất (bước 7)</td><td>không:
      hệ riêng</td></tr><tr><td>sau khi nhận và chốt</td><td>mặc định (thời gian lưu
      giữ 0): thông điệp rời hàng đợi, đếm lại được 0 (bước 8)</td><td>vẫn lưu; người
      đọc tự giữ vị trí, đọc lại được</td></tr><tr><td>tải đặt lên đâu</td><td>chính
      cơ sở dữ liệu giao dịch</td><td>cụm máy riêng</td></tr></table>'
    clear: true
    say: Lỗi thứ hai là coi hàng đợi trong cơ sở dữ liệu giống hệt Kafka. Nó chung
      giao dịch với dữ liệu, hoàn tác thì thông điệp cũng mất, điều Kafka không làm
      được. Nhưng ở cấu hình mặc định, thời gian lưu giữ bằng không, thông điệp đã
      nhận và chốt thì rời hàng đợi, không đọc lại như Kafka. Và mọi tải gửi nhận
      đặt lên chính cơ sở dữ liệu giao dịch.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm): coi phân mảnh như một
      cơ sở dữ liệu lớn.</b> Mỗi mảnh là một cơ sở dữ liệu riêng.</div><table class=''t''><tr><th>lệnh</th><th>mảnh
      (mã mod 3, minh hoạ)</th><th>hệ quả</th></tr><tr><td>chuyển từ tài khoản 4 sang
      7</td><td>1 và 1</td><td>một mảnh: giao dịch trong một cơ sở dữ liệu</td></tr><tr><td>chuyển
      từ tài khoản 4 sang 5</td><td>1 và 2</td><td>xuyên mảnh: hai cơ sở dữ liệu phải
      cùng chốt, đắt hơn</td></tr><tr><td>tổng tiền mọi tài khoản</td><td>không có
      khoá</td><td>bộ điều phối hỏi mọi mảnh, chậm hơn đi thẳng theo khoá</td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là coi phân mảnh như một cơ sở dữ liệu lớn.
      Chuyển từ tài khoản bốn sang bảy, cả hai đều ở mảnh một, nên là giao dịch trong
      một cơ sở dữ liệu. Chuyển từ bốn sang năm thì xuyên hai mảnh, hai cơ sở dữ liệu
      phải cùng chốt, đắt hơn nhiều. Còn câu hỏi không có khoá phân mảnh, như tổng
      tiền mọi tài khoản, phải qua bộ điều phối hỏi mọi mảnh, chậm hơn đi thẳng theo
      khoá.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l07_prune('2025-03-15', '2025-05-15') == (3, 5)
  - alg.bnx_l07_days('2025-03-15', '2025-05-15') == 17 + 30 + 14 == 61
  - alg.bnx_l07_count(alg.bnx_l07_load(3650), '2025-03-15', '2025-05-15') == 610
  - (alg.bnx_l07_shard(7, 3), alg.bnx_l07_shard(10, 3), alg.bnx_l07_shard(8, 3)) ==
    (1, 1, 2)
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Cùng
      bảng của bài. Truy vấn <code>ngay &gt;= DATE ''2025-03-15'' AND ngay &lt; DATE
      ''2025-05-15''</code>: đọc những phân vùng nào, đếm được bao nhiêu dòng?</td></tr><tr><td>2</td><td>Ba
      mảnh, mảnh = mã tài khoản chia lấy dư cho 3 (minh hoạ). Lệnh chuyển 7 → 10 và
      7 → 8: lệnh nào xuyên mảnh?</td></tr><tr><td>3</td><td>Quyết định: gửi thông
      báo “đã chuyển tiền” bằng hàng đợi trong Oracle hay bằng Kafka?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, cùng bảng của bài, truy vấn từ
      ngày mười lăm tháng ba tới trước ngày mười lăm tháng năm. Máy đọc những phân
      vùng nào, và đếm được bao nhiêu dòng? Câu hai, ba mảnh, mảnh bằng mã tài khoản
      chia lấy dư cho ba. Lệnh chuyển từ bảy sang mười và từ bảy sang tám, lệnh nào
      xuyên mảnh? Câu ba là một quyết định. Gửi thông báo đã chuyển tiền bằng hàng
      đợi trong Oracle hay bằng Kafka? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: khoảng chạm tháng 3, 4, 5 → phân vùng 3 tới 5 (kế hoạch thật:
      <code>PARTITION RANGE ITERATOR</code> = đọc lần lượt một dãy phân vùng liền
      nhau, Pstart 3, Pstop 5).</p>

      $$17 + 30 + 14 = 61\ \text{ngày}, \qquad 61 \cdot 10 = \hl{610}\ \text{dòng}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một. Khoảng này chạm tháng ba, tháng tư và tháng năm, nên máy
      đọc lần lượt một dãy phân vùng liền nhau, từ phân vùng ba tới phân vùng năm,
      kế hoạch thật ghi đúng như vậy. Số ngày là mười bảy ngày cuối tháng ba, cộng
      ba mươi ngày tháng tư, cộng mười bốn ngày đầu tháng năm, bằng sáu mươi mốt.
      Nhân mười được sáu trăm mười dòng.
    clear: true
  - show: '<p>Câu 2: 7 mod 3 = 1, 10 mod 3 = 1, 8 mod 3 = 2.</p>

      <div class=''box key''>7 → 10 cùng mảnh 1; <b>7 → 8 xuyên mảnh</b> (mảnh 1 và
      mảnh 2).</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu hai. Bảy chia ba dư một, mười chia ba dư một, tám chia ba dư hai.
      Vậy chuyển từ bảy sang mười nằm gọn trong mảnh một, còn chuyển từ bảy sang tám
      là xuyên mảnh.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hàng
      đợi trong Oracle</td><td>cùng giao dịch với lệnh chuyển: không gửi nhầm cho
      lệnh đã huỷ, không cần thêm cơ chế</td><td>tải đặt lên cơ sở dữ liệu giao dịch;
      mặc định nhận xong là mất (muốn giữ phải đặt thời gian lưu giữ)</td></tr><tr><td>Kafka</td><td>lưu
      lâu, nhiều dịch vụ cùng đọc, đọc lại được, chịu tải lớn</td><td>ghi và gửi là
      hai việc riêng: cần mẫu hộp thư đi hoặc cách tương tự để không lệch</td></tr></table>'
    say: Đáp án câu ba, tuỳ nhu cầu. Hàng đợi trong Oracle đi cùng giao dịch của lệnh
      chuyển, nên không gửi nhầm thông báo cho lệnh đã huỷ, và không cần thêm cơ chế
      nào. Đổi lại, tải đặt lên chính cơ sở dữ liệu giao dịch, và ở cấu hình mặc định
      thì thông điệp nhận xong là mất. Kafka lưu lâu, nhiều dịch vụ cùng đọc và đọc
      lại được. Nhưng ghi và gửi là hai việc riêng, nên cần mẫu hộp thư đi, tức ghi
      sự kiện vào một bảng cùng giao dịch rồi gửi sau, hoặc cách tương tự, để hai
      bên không lệch.
    clear: true
