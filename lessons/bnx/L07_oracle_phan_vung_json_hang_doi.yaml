      thiện.</div>
    say: Điều cần mang theo. Đừng đoán máy sẽ đọc gì, hãy hỏi kế hoạch thực thi. Một
      tính năng mới chỉ đáng dùng khi bạn chỉ ra được con số mà nó cải thiện.
  - show: '<p class="note">Bài sau: tìm kiếm toàn văn phân tán, chia dữ liệu thành
      nhiều mảnh có bản sao, và vì sao dữ liệu vừa ghi chưa tìm thấy ngay.</p>'
    forward_ref: true
    say: Ở bài sau, ta gặp lại ý chia dữ liệu thành nhiều mảnh, lần này trong một
      hệ tìm kiếm toàn văn, có bản sao, và xem vì sao dữ liệu vừa ghi chưa tìm thấy
      ngay.
