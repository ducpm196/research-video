- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>lọc theo ngày</span><span class=''a''>→</span><span
      class=''n''>phân vùng theo tháng</span><span class=''a''>→</span><span class=''n''>kế
      hoạch ghi một phân vùng</span><span class=''a''>→</span><span class=''n''>phần
      riêng từng kênh: JSON có ràng buộc</span></div>'
    say: Tổng kết chuỗi logic, truy vấn ngân hàng thường lọc theo ngày, nên ta phân
      vùng theo tháng, và đọc kế hoạch để chắc máy chỉ mở một phân vùng. Phần riêng
      của từng kênh lưu dạng JSON, có ràng buộc để chặn chuỗi hỏng.
  - show: <div class='box key'><b>Tư duy:</b> đừng đoán máy đọc gì, hãy hỏi kế hoạch
      thực thi. Một tính năng mới chỉ đáng dùng khi bạn chỉ ra được con số nó cải
      thiện.</div>
    say: Điều cần mang theo, đừng đoán máy đọc gì, hãy hỏi kế hoạch thực thi. Tính
      năng mới chỉ đáng dùng khi bạn chỉ ra được con số nó cải thiện.
  - show: '<p class="note">Bài sau: tìm kiếm toàn văn phân tán, chia dữ liệu thành
      nhiều mảnh có bản sao, và vì sao dữ liệu vừa ghi chưa tìm thấy ngay.</p>'
    forward_ref: true
    say: Ở bài sau, ta gặp lại ý chia dữ liệu thành nhiều mảnh, lần này trong một
      hệ tìm kiếm toàn văn, có bản sao.
