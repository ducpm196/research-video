scenes:
- id: hook
  kind: hook
  title: Sao kê một tháng mà phải đọc cả năm giao dịch
  checks:
  - alg.bnx_l07_partitions(alg.bnx_l07_load(3650)) == 12
  steps:
  - show: '<p>Bảng giao dịch thẻ của một ngân hàng thêm hàng trăm triệu dòng mỗi năm
      (số minh hoạ). Khách xin sao kê <b>tháng 3</b>.</p>

      <div class="box warn">Nếu bảng là một khối liền, máy có thể phải quét cả <b>12
      tháng</b> để lấy ra 1 tháng. Xoá dữ liệu cũ hết hạn lưu cũng phải xoá từng dòng.</div>

      '
    focus:
    - 1
    - - 1
      - 2
    - 2
    say: Chào bạn, bảng giao dịch thẻ của một ngân hàng có thể thêm hàng trăm triệu
      dòng mỗi năm, đây là số minh hoạ. Một khách xin sao kê tháng ba, nếu bảng là
      một khối liền, máy có thể phải quét cả mười hai tháng chỉ để lấy ra một tháng.
      Xoá dữ liệu cũ hết hạn lưu cũng phải xoá từng dòng.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>chỉ
      đọc đúng tháng cần</td><td>phân vùng bảng theo tháng, đọc kế hoạch thực thi</td></tr><tr><td>dữ
      liệu mỗi kênh một kiểu</td><td>lưu và truy vấn JSON ngay trong Oracle</td></tr><tr><td>chạy
      thử ở đâu</td><td>Oracle Free 23 trong Docker: bạn tự dựng được</td></tr></table><p
      class="note"><b>JSON</b>: chuỗi chữ ghi các cặp <code>tên trường: giá trị</code>
      trong ngoặc nhọn, như <code>{"kenh":"app","tien":200000}</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Hôm nay ta trả lời ba câu hỏi. Chỉ đọc đúng tháng cần bằng cách phân vùng
      bảng theo tháng. Lưu dữ liệu mỗi kênh một kiểu dạng JSON, tức chuỗi chữ ghi
      các cặp tên trường và giá trị trong ngoặc nhọn, ngay trong Oracle. Và mọi ví
      dụ chạy thật trên Oracle bản miễn phí số hai mươi ba, loại bạn tự dựng được
      bằng Docker.
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l07_days('2025-01-01', '2026-01-01') * 10 == len(alg.bnx_l07_load(3650))
  - alg.bnx_l07_count(alg.bnx_l07_load(3650), '2025-03-01', '2025-04-01') == alg.bnx_l07_month_days(2025,
    3) * 10 == 310
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Quét toàn bảng và chỉ mục</td><td>không có đường tắt thì đọc từng dòng; chỉ
      mục cây B là cấu trúc phụ giữ giá trị đã xếp thứ tự thành cây nhiều tầng, như
      mục lục sách, nên đi thẳng tới dòng cần</td><td>tìm một mã giao dịch: chỉ mục;
      đếm cả tháng: thường phải quét</td></tr><tr><td>② Kế hoạch thực thi</td><td>bản
      kế hoạch máy chọn để chạy câu lệnh: đọc bảng nào, theo cách nào</td><td>đọc
      toàn bảng giao dịch</td></tr><tr><td>③ Kiểu dữ liệu và mốc ngày</td><td><code>NUMBER</code>
      là số, <code>DATE</code> là ngày; <code>DATE ''2025-02-01''</code> viết một
      ngày cụ thể</td><td>mốc 1/2/2025</td></tr><tr><td>④ Chốt (<code>COMMIT</code>)</td><td>lệnh
      làm mọi thay đổi trước đó thành chính thức</td><td>nạp dữ liệu xong thì chốt</td></tr><tr><td>⑤
      Từ điển dữ liệu</td><td>các bảng hệ thống do Oracle tự giữ, liệt kê bảng và
      phân vùng của bạn</td><td><code>user_tab_partitions</code></td></tr></table>'
    say: Trước hết ta cần hiểu năm điều, khi không có đường tắt, máy đọc từng dòng,
      gọi là quét toàn bảng. Chỉ mục cây B xếp sẵn giá trị thành cây nhiều tầng, như
      mục lục sách, nên đi thẳng tới dòng cần. Kế hoạch thực thi là bản kế hoạch máy
      chọn để chạy một câu lệnh. Chữ ngày kèm một chuỗi viết một ngày cụ thể, như
      mùng một tháng hai năm hai nghìn không trăm hai mươi lăm. Lệnh chốt làm mọi
      thay đổi thành chính thức. Từ điển dữ liệu là các bảng hệ thống của Oracle,
      liệt kê bảng và phân vùng của bạn.
  - show: '<p>Dữ liệu mẫu của bài: năm 2025, mỗi ngày 10 giao dịch.</p>

      $$365 \cdot 10 = \hl{3\,650}\ \text{dòng}, \qquad 31 \cdot 10 = \hl{310}\ \text{dòng
      của tháng 3}$$

      '
    focus:
    - 1
    - 1
    - - 2
    clear: true
    say: Một ví dụ số làm dữ liệu mẫu cho cả bài. Năm hai nghìn không trăm hai mươi
      lăm có ba trăm sáu mươi lăm ngày, mỗi ngày mười giao dịch, nên có ba nghìn sáu
      trăm năm mươi dòng. Dấu chấm ở giữa là phép nhân, tháng ba có ba mươi mốt ngày,
      nên có ba trăm mười dòng.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã từ khoá
  checks:
  - alg.bnx_l07_prune('2025-03-01', '2025-04-01') == (3, 3)
  steps:
  - show: '<table class=''t''><tr><th>trên màn hình</th><th>nghĩa</th></tr><tr><td><code>PARTITION
      BY RANGE (ngay)</code></td><td>chia bảng thành phân vùng theo khoảng giá trị
      của cột ngày (khoá phân vùng)</td></tr><tr><td><code>INTERVAL (NUMTOYMINTERVAL(1,
      ''MONTH''))</code></td><td>mỗi phân vùng dài 1 tháng (hàm đổi số 1 thành khoảng
      1 tháng); dữ liệu vượt mốc thì Oracle tự tạo phân vùng mới</td></tr><tr><td><code>(PARTITION
      p_2025_01 VALUES LESS THAN (DATE ''2025-02-01''))</code></td><td>khai phân vùng
      đầu tên <code>p_2025_01</code>: chứa các dòng có ngày nhỏ hơn 1/2/2025</td></tr><tr><td><code>DATE
      ''2025-01-01'' + TRUNC((ROWNUM - 1) / 10)</code></td><td>cộng số ngày vào một
      ngày; <code>TRUNC</code> bỏ phần lẻ, <code>MOD(a, b)</code> lấy phần dư; ví
      dụ <code>TRUNC(25 / 10)</code> = 2, <code>MOD(25, 10)</code> = 5</td></tr></table>'
    introduces:
    - bnx_khoa_phan_vung
    say: Bảng đầu giải mã lệnh tạo bảng, dòng đầu chia bảng theo khoảng giá trị của
      cột ngày, gọi là khoá phân vùng. Dòng hai nói mỗi phân vùng dài một tháng, vượt
      mốc thì Oracle tự tạo phân vùng mới. Dòng ba khai phân vùng đầu, chứa các dòng
      có ngày nhỏ hơn mùng một tháng hai. Dòng cuối cộng số ngày vào một ngày, một
      hàm bỏ phần lẻ, một hàm lấy phần dư.
  - show: '<table class=''t''><tr><th>trên màn hình</th><th>nghĩa</th></tr><tr><td><code>EXPLAIN
      PLAN FOR</code> …</td><td>ghi kế hoạch thực thi của câu lệnh sau nó, mà không
      chạy câu lệnh</td></tr><tr><td><code>SELECT * FROM TABLE(DBMS_XPLAN.DISPLAY(NULL,
      NULL, ''BASIC +PARTITION''))</code></td><td>in kế hoạch vừa ghi: <code>TABLE(…)</code>
      biến kết quả của hàm thành bảng để <code>SELECT *</code> đọc ra; <code>NULL,
      NULL</code> bỏ trống hai tham số, chuỗi cuối chọn cột hiện</td></tr><tr><td><code>PARTITION
      RANGE SINGLE</code> / <code>ALL</code>; <code>Pstart</code>, <code>Pstop</code></td><td>chỉ
      đọc một phân vùng / đọc mọi phân vùng; phân vùng đầu và cuối sẽ đọc (đánh số
      từ 1)</td></tr><tr><td><code>TABLE ACCESS FULL</code>, <code>SORT AGGREGATE</code></td><td>đọc
      hết phần được chọn; gom kết quả thành một số của <code>COUNT</code></td></tr></table>'
    introduces:
    - bnx_explain
    clear: true
    say: Bảng thứ hai giải mã phần xem kế hoạch. Lệnh xem kế hoạch ghi cách máy sẽ
      chạy mà không chạy nó, rồi hàm in kế hoạch đọc ra bằng câu chọn. Trong kế hoạch,
      chữ đơn là đọc một phân vùng, chữ tất cả là đọc mọi phân vùng, hai cột cuối
      là phân vùng đầu và cuối. Hai dòng cuối là đọc hết phần được chọn, và gom kết
      quả đếm.
  - show: '<table class=''t''><tr><th>trên màn hình</th><th>nghĩa</th></tr><tr><td><code>CHECK
      (chi_tiet IS JSON)</code></td><td>chỉ nhận chuỗi có dạng JSON; mặc định chế
      độ lỏng (nhận cả tên trường không có nháy kép); muốn đúng chuẩn chặt: <code>IS
      JSON (STRICT)</code></td></tr><tr><td><code>JSON_VALUE(chi_tiet, ''&#36;.kenh'')</code></td><td>lấy
      một giá trị đơn trong JSON; <code>&#36;</code> là gốc, <code>.kenh</code> là
      trường kenh</td></tr><tr><td><code>RETURNING NUMBER</code></td><td>ép giá trị
      lấy ra thành kiểu số, để so sánh lớn hơn được</td></tr></table>'
    clear: true
    say: Bảng ba giải mã phần JSON, ràng buộc kiểm tra chỉ nhận chuỗi có dạng JSON,
      và mặc định ở chế độ lỏng. Muốn đúng chuẩn chặt thì thêm chữ chặt trong ngoặc.
      Hàm lấy giá trị lấy ra một giá trị đơn, trong đường dẫn thì ký hiệu đô la là
      gốc, chấm kênh là trường kênh. Mệnh đề trả về kiểu số ép giá trị thành số để
      so lớn hơn.
  - show: '<table class=''t''><tr><th>câu SQL</th><th>nghĩa</th></tr><tr><td><code>SELECT
      COUNT(*) FROM bảng WHERE điều kiện</code></td><td><code>SELECT</code> chọn,
      <code>FROM</code> chỉ bảng, <code>WHERE</code> lọc dòng; <code>COUNT(*)</code>
      đếm số dòng thoả điều kiện; <code>AND</code> nối hai điều kiện</td></tr><tr><td><code>INSERT
      INTO bảng SELECT …</code></td><td>chèn vào bảng các dòng do câu <code>SELECT</code>
      sinh ra</td></tr><tr><td><code>ALTER TABLE bảng DROP PARTITION FOR (ngày)</code></td><td>sửa
      bảng: bỏ nguyên phân vùng chứa ngày đó, cả dữ liệu trong nó</td></tr></table>'
    clear: true
    say: Trước các câu SQL của bài, ta nhắc lại cách đọc. Câu chọn lấy dữ liệu từ
      một bảng, chỉ những dòng thoả điều kiện, và hàm đếm cho số dòng. Câu chèn có
      thể lấy dòng từ một câu chọn. Câu sửa bảng bỏ phân vùng thì bỏ cả dữ liệu trong
      nó.
- id: intuition
  kind: intuition
  title: 'Hình dung: đọc một ngăn thay vì cả tủ'
  checks:
  - alg.bnx_l07_count(alg.bnx_l07_load(3650), '2025-03-01', '2025-04-01') == 310
  - alg.bnx_l07_partitions(alg.bnx_l07_load(3650)) == 12
  steps:
  - show: '<div><svg width="1500" height="470" viewBox="0 0 1500 470" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
