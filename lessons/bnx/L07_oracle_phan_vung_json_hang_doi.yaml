  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>lọc theo ngày</span><span class='a'>→</span><span
      class='n'>phân vùng theo tháng</span><span class='a'>→</span><span class='n'>kế
      hoạch ghi một phân vùng</span><span class='a'>→</span><span class='n'>hàng đợi
