      trên ba trăm sáu mươi lăm ở mọi quy mô. Dữ liệu thật lệch theo mùa thì tỉ lệ
      khác. Ở ba mươi sáu triệu rưỡi dòng, theo cùng tỉ lệ, là ba triệu một trăm nghìn
      dòng thay vì cả bảng.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>phân
      vùng theo tháng</td><td>đọc một tháng thay vì cả bảng; xoá dữ liệu cũ bằng cách
      bỏ nguyên phân vùng</td><td>truy vấn không lọc theo cột phân vùng vẫn đọc mọi
      phân vùng; thêm việc quản lý phân vùng</td><td>bảng lớn, truy vấn thường lọc
      theo ngày</td></tr><tr><td>không phân vùng, chỉ thêm chỉ mục</td><td>đơn giản,
      ít việc quản lý</td><td>chỉ mục phình theo bảng; xoá dữ liệu cũ là xoá từng
      dòng</td><td>bảng vừa</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    say: Bảng này cho thấy người làm nghề phải chọn gì. Phân vùng giúp đọc một tháng
      thay vì cả bảng, và xoá dữ liệu cũ bằng cách bỏ nguyên phân vùng. Đổi lại, truy
      vấn không lọc theo cột phân vùng vẫn đọc mọi phân vùng. Với bảng vừa, chỉ mục
      thường đã đủ.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
