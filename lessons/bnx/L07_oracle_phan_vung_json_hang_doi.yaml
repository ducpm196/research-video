- id: example
  kind: example
  title: 'Ví dụ chạy thật: cắt tỉa phân vùng, từng phép tính'
  checks:
  - len(alg.bnx_l07_load(3650)) == 365 * 10
  - alg.bnx_l07_partitions(alg.bnx_l07_load(3650)) == 12
  - alg.bnx_l07_count(alg.bnx_l07_load(3650), '2025-03-01', '2025-04-01') == 310
  - alg.bnx_l07_prune('2025-03-01', '2025-04-01') == (3, 3)
  - round(100 * alg.bnx_l07_count(alg.bnx_l07_load(3650), '2025-03-01', '2025-04-01')
    / len(alg.bnx_l07_load(3650)), 1) == 8.5
  - round(len(alg.bnx_l07_load(3650)) / alg.bnx_l07_count(alg.bnx_l07_load(3650),
    '2025-03-01', '2025-04-01'), 1) == 11.8
  - alg.bnx_l07_max_partitions() == 1048575
  steps:
  - show: '$$① \; 365 \cdot 10 = \hl{3\,650}\ \text{dòng}$$

      $$② \; 1 + 11 = \hl{12}\ \text{phân vùng}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta tính và so với máy. Phép tính thứ nhất, ba trăm sáu mươi lăm ngày nhân
      mười, bằng ba nghìn sáu trăm năm mươi dòng, khớp số dòng thật ở bước hai. Phép
      tính thứ hai, một phân vùng khai sẵn cộng mười một phân vùng tự tạo, bằng mười
      hai.
  - show: "$$③ \\; 31 \\cdot 10 = \\hl{310}\\ \\text{dòng của tháng 3, nằm trong phân\
      \ vùng 3}$$<p><b>Kết quả chạy thật</b></p><div class=\"code\"><div>--------------------------------------------------------------</div><div>|\
      \ Id  | Operation\t\t| Name\t     | Pstart| Pstop |</div><div>--------------------------------------------------------------</div><div>|\
      \   0 | SELECT STATEMENT\t|\t     |\t     |\t     |</div><div>|   1 |  SORT\
      \ AGGREGATE \t|\t     |\t     |\t     |</div><div>|   2 |   PARTITION RANGE\
      \ SINGLE|\t     |\t   3 |\t   3 |</div><div>|   3 |    TABLE ACCESS FULL\t|\
      \ BNX_L07_GD |\t   3 |\t   3 |</div><div>--------------------------------------------------------------</div></div>"
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, tháng ba có ba mươi mốt ngày nhân mười, bằng ba trăm mười
      dòng, tất cả nằm trong phân vùng thứ ba. Kế hoạch thật ghi đọc đơn một phân
      vùng, phân vùng đầu và cuối đều là ba, đúng như ta chờ.
  - show: $$④ \; \frac{310}{3\,650} \approx \hlg{8{,}5\%}\ \text{số dòng phải đọc}$$
    say: Phép tính thứ tư dùng lại hai số trên. Ba trăm mười chia ba nghìn sáu trăm
      năm mươi, xấp xỉ tám phẩy năm phần trăm. Nhờ cắt tỉa, máy chỉ đọc chừng ấy số
      dòng.
  - show: "<p>Truy vấn không lọc theo ngày (tìm giao dịch trên 5 000 000):</p><div\
      \ class=\"code\"><div>EXPLAIN PLAN FOR</div><div>SELECT COUNT(*) FROM bnx_l07_gd\
      \ WHERE so_tien &gt; 5000000;</div><div>SELECT * FROM TABLE(</div><div>  DBMS_XPLAN.DISPLAY(NULL,\
      \ NULL, 'BASIC +PARTITION'));</div></div><p><b>Kết quả chạy thật</b></p><div\
      \ class=\"code\"><div>-----------------------------------------------------------</div><div>|\
      \ Id  | Operation\t     | Name\t  | Pstart| Pstop |</div><div>-----------------------------------------------------------</div><div>|\
      \   0 | SELECT STATEMENT     |\t\t  |\t  |\t  |</div><div>|   1 |  SORT AGGREGATE\
      \      |\t\t  |\t  |\t  |</div><div>|   2 |   PARTITION RANGE ALL|\t\t  |\t\
      1 |1048575|</div><div>|   3 |    TABLE ACCESS FULL | BNX_L07_GD |\t1 |1048575|</div><div>-----------------------------------------------------------</div></div>"
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Giờ thử một truy vấn không lọc theo ngày, tìm giao dịch trên năm triệu. Kế
      hoạch thật ghi đọc tất cả, từ phân vùng một. Cột cuối là một triệu không trăm
      bốn mươi tám nghìn năm trăm bảy mươi lăm, đúng bằng số phân vùng tối đa một
      bảng được có. Vì bảng tự thêm phân vùng theo tháng, máy chưa biết trước sẽ có
      bao nhiêu tháng.
  - show: '$$⑤ \; \frac{3\,650}{310} \approx \hl{11{,}8}\ \text{lần nhiều dòng hơn}$$

      <p class=''note''>$1\,048\,575 = 1024 \cdot 1024 - 1$: giới hạn số phân vùng
      của một bảng Oracle.</p>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ năm, không lọc theo ngày thì phải đọc cả ba nghìn sáu trăm
      năm mươi dòng. Chia cho ba trăm mười, ta được xấp xỉ mười một phẩy tám lần nhiều
      dòng hơn. Con số lớn ở cột cuối bằng một nghìn không trăm hai mươi bốn nhân
      một nghìn không trăm hai mươi bốn, trừ một.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm thẳng trong phân vùng'
  checks:
  - alg.bnx_l07_count(alg.bnx_l07_load(3650), '2025-03-01', '2025-04-01') == alg.bnx_l07_month_days(2025,
    3) * 10
  steps:
  - show: '<p>Đường khác: đếm theo điều kiện ngày, rồi đếm thẳng trong phân vùng chứa
      ngày 15/3 (không có điều kiện nào).</p><div class="code"><div>SELECT COUNT(*)
      AS loc_ngay FROM bnx_l07_gd</div><div> WHERE ngay &gt;= DATE ''2025-03-01''
      AND ngay &lt; DATE ''2025-04-01'';</div><div>SELECT COUNT(*) AS trong_pv FROM
      bnx_l07_gd</div><div> PARTITION FOR (DATE ''2025-03-15'');</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>  LOC_NGAY</div><div>----------</div><div>       310</div><div>  TRONG_PV</div><div>----------</div><div>       310</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    say: Kiểm bằng đường khác. Câu đầu đếm theo điều kiện ngày như trước. Câu sau
      không có điều kiện nào, chỉ đếm thẳng mọi dòng trong phân vùng chứa ngày mười
      lăm tháng ba. Cả hai đều ra ba trăm mười, khớp với phép tính thứ ba. Vậy phân
      vùng thứ ba chứa đúng và đủ tháng ba, nên đọc riêng nó là đủ.
  - show: <table class='t'><tr><th>điều bài nói</th><th>kiểm thế nào</th></tr><tr><td>phân
      vùng, kế hoạch, JSON, hàng đợi</td><td>chạy thật trên Oracle bản miễn phí trong
      bài, đầu ra dán nguyên</td></tr><tr><td>bộ nhớ cột</td><td>chỉ thấy vùng nhớ
      cột = 0 và thuộc tính đã bật; <b>chưa đo</b> tốc độ</td></tr><tr><td>phân mảnh</td><td>chỉ
      ở mức khái niệm, theo hướng dẫn của Oracle; cần nhiều cơ sở dữ liệu, bài <b>không
      chạy</b></td></tr></table>
    clear: true
    say: Bảng này nói rõ điều gì đã kiểm. Phân vùng, kế hoạch thực thi, dữ liệu dạng
      JSON và hàng đợi đều chạy thật trên Oracle bản miễn phí, đầu ra dán nguyên.
      Bộ nhớ cột thì ta chỉ thấy vùng nhớ bằng không và thuộc tính đã bật, chưa đo
      tốc độ. Phân mảnh cần nhiều cơ sở dữ liệu, nên bài chỉ dạy ở mức khái niệm.
