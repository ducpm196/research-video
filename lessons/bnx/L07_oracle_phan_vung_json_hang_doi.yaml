scenes:
- id: hook
  kind: hook
  title: Sao kê một tháng mà phải đọc cả năm giao dịch
  checks:
  - alg.bnx_l07_partitions(alg.bnx_l07_load(3650)) == 12
  steps:
  - show: '<p>Bảng giao dịch thẻ của một ngân hàng thêm hàng trăm triệu dòng mỗi năm
      (số minh hoạ). Khách xin sao kê <b>tháng 3</b>.</p>

      <div class="box warn">Nếu bảng là một khối liền, máy có thể phải quét cả <b>12
      tháng</b> để lấy ra 1 tháng. Xoá dữ liệu cũ hết hạn lưu cũng phải xoá từng dòng.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, bảng giao dịch thẻ của một ngân hàng có thể thêm hàng trăm triệu
      dòng mỗi năm, đây là số minh hoạ. Một khách xin sao kê tháng ba. Nếu bảng là
      một khối liền, máy có thể phải quét cả mười hai tháng chỉ để lấy ra một tháng.
      Xoá dữ liệu cũ hết hạn lưu cũng phải xoá từng dòng.
  - show: <table class='t'><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>chỉ
      đọc đúng tháng cần</td><td>phân vùng bảng theo tháng, đọc kế hoạch thực thi</td></tr><tr><td>dữ
      liệu mỗi kênh một kiểu</td><td>lưu và truy vấn JSON ngay trong Oracle</td></tr><tr><td>báo
      cho hệ khác sau khi ghi</td><td>hàng đợi trong cơ sở dữ liệu, chung giao dịch
      với dữ liệu</td></tr><tr><td>khi nào cần hơn nữa</td><td>bộ nhớ cột cho báo
      cáo, phân mảnh khi một máy không đủ</td></tr></table>
    say: Hôm nay ta trả lời bốn câu hỏi. Làm sao chỉ đọc đúng tháng cần, bằng cách
      phân vùng bảng theo tháng và đọc kế hoạch thực thi. Dữ liệu mỗi kênh một kiểu
      thì lưu ra sao, bằng dữ liệu dạng JSON ngay trong Oracle. Báo cho hệ khác sau
      khi ghi thế nào, bằng hàng đợi nằm trong cơ sở dữ liệu. Và khi nào cần bộ nhớ
      cột hay phân mảnh.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_l07_days('2025-01-01', '2026-01-01') * 10 == len(alg.bnx_l07_load(3650))
  - alg.bnx_l07_count(alg.bnx_l07_load(3650), '2025-03-01', '2025-04-01') == alg.bnx_l07_month_days(2025,
    3) * 10 == 310
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Quét toàn bảng và chỉ mục</td><td>không có đường tắt thì đọc từng dòng; chỉ
      mục cây B đi thẳng tới dòng cần</td><td>tìm một mã giao dịch: chỉ mục; đếm cả
      tháng: thường phải quét</td></tr><tr><td>② Kế hoạch thực thi</td><td>bản kế
      hoạch máy chọn để chạy câu lệnh: đọc bảng nào, theo cách nào</td><td>đọc toàn
      bảng giao dịch</td></tr><tr><td>③ Giao dịch</td><td>chốt thì mọi thay đổi cùng
      ở lại, hoàn tác thì cùng mất</td><td>thủ tục chuyển tiền ở bài 6</td></tr><tr><td>④
      Kafka</td><td>nơi lưu thông điệp theo chủ đề; người đọc tự giữ vị trí đọc, có
      thể đọc lại; “phân vùng” của Kafka là phần của chủ đề, khác phân vùng bảng</td><td>dịch
      vụ thông báo đọc chủ đề giao dịch</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Khi không có đường tắt, máy đọc từng dòng,
      gọi là quét toàn bảng. Chỉ mục cây B thì đi thẳng tới dòng cần mà không phải
      đọc hết các dòng. Kế hoạch thực thi là bản kế hoạch máy chọn để chạy một câu
      lệnh, đọc bảng nào và đọc theo cách nào. Giao dịch thì chốt là mọi thay đổi
      cùng ở lại, hoàn tác là cùng mất, đúng như thủ tục chuyển tiền ở bài sáu. Còn
      Kafka lưu thông điệp theo chủ đề, người đọc tự giữ vị trí đọc nên có thể đọc
      lại. Kafka cũng gọi các phần của chủ đề là phân vùng, nhưng đó khác với phân
      vùng bảng trong bài này.
  - show: '<p>Dữ liệu mẫu của bài: năm 2025, mỗi ngày 10 giao dịch.</p>

      $$365 \cdot 10 = \hl{3\,650}\ \text{dòng}, \qquad 31 \cdot 10 = \hl{310}\ \text{dòng
      của tháng 3}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Một ví dụ số làm dữ liệu mẫu cho cả bài. Năm hai nghìn không trăm hai mươi
      lăm có ba trăm sáu mươi lăm ngày, mỗi ngày mười giao dịch, nên có ba nghìn sáu
      trăm năm mươi dòng. Dấu chấm ở giữa là phép nhân. Tháng ba có ba mươi mốt ngày,
      nên có ba trăm mười dòng.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã từ khoá
  checks:
  - alg.bnx_l07_prune('2025-03-01', '2025-04-01') == (3, 3)
  steps:
  - show: <table class='t'><tr><th>trên màn hình</th><th>nghĩa</th></tr><tr><td><code>PARTITION
      BY RANGE (ngay)</code></td><td>chia bảng thành phân vùng theo khoảng giá trị
      của cột ngày (khoá phân vùng)</td></tr><tr><td><code>INTERVAL (NUMTOYMINTERVAL(1,
      'MONTH'))</code></td><td>mỗi phân vùng dài 1 tháng; có dữ liệu vượt mốc thì
      Oracle tự tạo phân vùng mới</td></tr><tr><td><code>EXPLAIN PLAN FOR</code> …
      <code>DBMS_XPLAN.DISPLAY</code></td><td>ghi kế hoạch thực thi mà không chạy
      câu lệnh, rồi in ra</td></tr><tr><td><code>PARTITION RANGE SINGLE</code> / <code>ALL</code></td><td>chỉ
      đọc một phân vùng / đọc mọi phân vùng</td></tr><tr><td><code>Pstart</code>,
      <code>Pstop</code></td><td>phân vùng đầu và cuối sẽ đọc (đánh số từ 1)</td></tr></table>
    say: Bảng này giải mã từ khoá về phân vùng. Dòng đầu chia bảng thành các phân
      vùng theo khoảng giá trị của cột ngày, cột đó gọi là khoá phân vùng. Dòng thứ
      hai nói mỗi phân vùng dài một tháng, có dữ liệu vượt mốc cuối thì Oracle tự
      tạo phân vùng mới. Lệnh xem kế hoạch ghi lại cách máy sẽ chạy câu lệnh mà không
      chạy nó, rồi một hàm in kế hoạch ra. Trong kế hoạch, chữ đơn nghĩa là chỉ đọc
      một phân vùng, chữ tất cả nghĩa là đọc mọi phân vùng. Hai cột cuối cho biết
      phân vùng đầu và cuối sẽ đọc.
  - show: '<table class=''t''><tr><th>trên màn hình</th><th>nghĩa</th></tr><tr><td><code>CHECK
      (chi_tiet IS JSON)</code></td><td>chỉ nhận chuỗi có dạng JSON; mặc định chế
      độ lỏng (nhận cả tên trường không có nháy kép); muốn đúng chuẩn chặt: <code>IS
      JSON (STRICT)</code></td></tr><tr><td><code>JSON_VALUE(chi_tiet, ''&#36;.kenh'')</code></td><td>lấy
      một giá trị đơn trong JSON; <code>&#36;</code> là gốc, <code>.kenh</code> là
      trường kenh</td></tr><tr><td><code>DBMS_AQ.ENQUEUE</code> / <code>DEQUEUE</code></td><td>gói
      DBMS_AQ (nhóm thủ tục có sẵn, gọi bằng tên gói chấm tên thủ tục): gửi vào /
      nhận ra khỏi hàng đợi</td></tr><tr><td><code>INMEMORY</code></td><td>đánh dấu
      bảng được nạp thêm một bản dạng cột vào bộ nhớ</td></tr></table>'
    clear: true
    say: Bảng thứ hai giải mã các từ khoá còn lại. Ràng buộc kiểm tra chỉ nhận chuỗi
      có dạng JSON, và mặc định ở chế độ lỏng. Muốn đúng chuẩn chặt thì thêm chữ chặt
      trong ngoặc, như trên màn hình. Hàm lấy giá trị lấy ra một giá trị đơn, trong
      đường dẫn thì ký hiệu đô la là gốc, chấm kênh là trường kênh. Gói là một nhóm
      thủ tục có sẵn, gọi bằng tên gói, dấu chấm, rồi tên thủ tục. Hai thủ tục của
      gói hàng đợi dùng để gửi thông điệp vào và nhận thông điệp ra. Từ khoá cuối
      đánh dấu bảng được nạp thêm một bản dạng cột vào bộ nhớ.
