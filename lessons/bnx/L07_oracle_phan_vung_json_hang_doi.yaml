    clear: true
    say: Hình thứ hai so hai cách báo cho hệ khác. Với hàng đợi trong cơ sở dữ liệu,
      ghi giao dịch và gửi thông điệp nằm trong cùng một giao dịch. Ở chế độ mặc định,
      chốt thì cả hai ở lại, hoàn tác thì cả hai mất, nên không có thông điệp cho
      một giao dịch đã bị huỷ. Với Kafka, ghi cơ sở dữ liệu và gửi thông điệp là hai
      việc riêng, nên cần thêm một cách giữ nhất quán. Bù lại, Kafka lưu lâu và cho
      đọc lại.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: phân vùng, JSON, hàng đợi, bộ nhớ cột, phân mảnh'
  checks:
  - alg.bnx_l07_position('2025-03-15') == 3
  - alg.bnx_l07_partitions(alg.bnx_l07_load(3650)) == 1 + 11
  - alg.bnx_l07_prune('2025-03-01', '2025-04-01') == (3, 3)
  - 'alg.bnx_l07_json_ids({1: ''{"kenh":"app","so_tien":500000}'', 2: ''{"kenh":"atm","so_tien":2000000}'',
    3: ''{"kenh":"app"''}, ''so_tien'', 1000000) == ([1, 2], [2])'
  - alg.bnx_l07_queue([('enq', 101), ('rollback',), ('enq', 102), ('commit',)])[1]
    == 1
  - alg.bnx_l07_queue([('enq', 101), ('rollback',), ('enq', 102), ('commit',), ('deq',),
    ('commit',)]) == ([102], 0)
  - alg.bnx_l07_shard(7, 3) == 1
  steps:
  - show: '<p><b>Bước 1. Chọn khoá phân vùng là ngày</b>, vì sao kê, đối soát, xoá
      dữ liệu hết hạn đều theo khoảng ngày.</p><div class="code"><div>DROP TABLE IF
      EXISTS bnx_l07_gd;</div><div>CREATE TABLE bnx_l07_gd (</div><div>  id      NUMBER,</div><div>  ngay    DATE,</div><div>  so_tien
      NUMBER)</div><div>PARTITION BY RANGE (ngay)</div><div>INTERVAL (NUMTOYMINTERVAL(1,
      ''MONTH''))</div><div>(PARTITION p_2025_01 VALUES LESS THAN (DATE ''2025-02-01''));</div></div><p
      class=''note''>Làm thử: ngày 15/3/2025 ≥ 1/2/2025 nên không vào phân vùng đầu;
      nó vào phân vùng tháng 3, vị trí 3. Xoá cả tháng: <code>ALTER TABLE … DROP PARTITION
      FOR (…)</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Bước một, chọn khoá phân vùng. Vì sao kê, đối soát và xoá dữ liệu hết hạn
      đều làm theo khoảng ngày, nên ta chia theo cột ngày, mỗi phân vùng một tháng.
      Ta chỉ khai phân vùng đầu, chứa các ngày trước mùng một tháng hai, còn các tháng
      sau để Oracle tự tạo. Hết hạn lưu thì bỏ cả phân vùng của tháng đó bằng một
      lệnh, thay vì xoá từng dòng. Làm thử, ngày mười lăm tháng ba không nhỏ hơn mùng
      một tháng hai, nên nó rơi vào phân vùng tháng ba, ở vị trí thứ ba.
  - show: '<p><b>Bước 2. Nạp một năm dữ liệu</b>: Oracle tự tạo 11 phân vùng cho tháng
      2 tới tháng 12.</p><div class="code"><div>INSERT INTO bnx_l07_gd</div><div>SELECT
      ROWNUM, DATE ''2025-01-01'' + TRUNC((ROWNUM - 1) / 10),</div><div>       (MOD(ROWNUM,
      100) + 1) * 100000</div><div>FROM dual CONNECT BY ROWNUM &lt;= 3650;</div><div>COMMIT;</div><div>SELECT
      COUNT(*) AS so_dong FROM bnx_l07_gd;</div><div>SELECT COUNT(*) AS so_phan_vung
      FROM user_tab_partitions</div><div> WHERE table_name = ''BNX_L07_GD'';</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước hai, nạp ba nghìn sáu trăm năm mươi dòng, mỗi ngày mười dòng, số tiền
      thay đổi theo từng dòng. Vì dữ liệu vượt mốc của phân vùng đầu, Oracle tự tạo
      thêm phân vùng. Câu chọn dữ liệu sinh ra ba nghìn sáu trăm năm mươi dòng đánh
      số từ một. Vì số thứ tự trừ một rồi chia mười, bỏ phần lẻ, nên cứ mười dòng
      liền nhau có cùng một ngày. Hai câu cuối đếm số dòng và số phân vùng.
  - show: "<p><b>Kết quả chạy thật</b></p><div class=\"code\"><div>   SO_DONG</div><div>----------</div><div>\
      \      3650</div><div>SO_PHAN_VUNG</div><div>------------</div><div>\t  12</div></div><p\
      \ class='note'>Làm thử: 1 phân vùng khai sẵn + 11 phân vùng tự tạo = 12.</p>"
    focus:
    - 1
    - 2
    clear: true
    say: Làm thử, vì năm có mười hai tháng, một phân vùng khai sẵn cộng mười một phân
      vùng tự tạo là mười hai. Đầu ra thật in ba nghìn sáu trăm năm mươi dòng và mười
      hai phân vùng, khớp với phép tính.
  - show: '<p><b>Bước 3. Hỏi máy định đọc mấy phân vùng</b>, không cần chạy thật câu
      lệnh.</p><div class="code"><div>EXPLAIN PLAN FOR</div><div>SELECT COUNT(*) FROM
      bnx_l07_gd</div><div> WHERE ngay &gt;= DATE ''2025-03-01'' AND ngay &lt; DATE
      ''2025-04-01'';</div><div>SELECT * FROM TABLE(</div><div>  DBMS_XPLAN.DISPLAY(NULL,
      NULL, ''BASIC +PARTITION''));</div></div><p class=''note''>Làm thử: điều kiện
      từ 1/3 tới trước 1/4 nằm gọn trong phân vùng 3, nên chờ Pstart = Pstop = 3.
      Ngày truyền qua biến gắn: Pstart, Pstop ghi KEY (chọn lúc chạy).</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, muốn biết máy định đọc mấy phân vùng mà không phải chạy câu lệnh,
      ta dùng lệnh xem kế hoạch rồi in kế hoạch ra. Điều kiện viết thẳng trên cột
      ngày, từ mùng một tháng ba tới trước mùng một tháng tư. Làm thử, khoảng này
      nằm gọn trong phân vùng thứ ba, nên ta chờ phân vùng đầu và cuối đều là ba.
      Nếu ngày được truyền qua biến gắn, tức chỗ giữ chỗ có giá trị truyền riêng,
      thì kế hoạch không ghi số phân vùng, vì phân vùng chỉ được chọn lúc chạy.
  - show: <p><b>Bước 4. Phần thay đổi theo kênh lưu dạng JSON</b>, có ràng buộc <code>IS
      JSON</code> chặn chuỗi hỏng.</p><div class="code"><div>DROP TABLE IF EXISTS
      bnx_l07_js;</div><div>CREATE TABLE bnx_l07_js (</div><div>  id       NUMBER
      PRIMARY KEY,</div><div>  chi_tiet VARCHAR2(400)</div><div>           CONSTRAINT
      bnx_l07_isj CHECK (chi_tiet IS JSON));</div><div>INSERT INTO bnx_l07_js VALUES
      (1, '{"kenh":"app","so_tien":500000}');</div><div>INSERT INTO bnx_l07_js VALUES
      (2, '{"kenh":"atm","so_tien":2000000}');</div><div>COMMIT;</div></div>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, mỗi kênh có thông tin riêng, máy rút tiền có mã máy, ứng dụng có
      mã thiết bị. Vì không muốn thêm cột mỗi khi có kênh mới, ta lưu phần đó ở dạng
      JSON. Ràng buộc kiểm tra chỉ nhận chuỗi có dạng JSON, mặc định ở chế độ lỏng,
      nên chuỗi hỏng không lọt vào bảng. Từ bản hai mươi mốt, Oracle khuyên dùng kiểu
      cột JSON riêng; cột chữ kèm ràng buộc thì chạy được cả trên bản cũ. Hai dòng
      mẫu là năm trăm nghìn qua ứng dụng và hai triệu qua máy rút tiền.
  - show: "<p><b>Bước 5. Thử chèn chuỗi hỏng, rồi lọc theo một trường bên trong.</b></p><div\
      \ class=\"code\"><div>INSERT INTO bnx_l07_js VALUES (3, '{\"kenh\":\"app\"');</div><div>SELECT\
      \ id,</div><div>       JSON_VALUE(chi_tiet, '<span>&#36;</span>.kenh' RETURNING\
      \ VARCHAR2(10)) AS kenh</div><div>FROM bnx_l07_js</div><div>WHERE JSON_VALUE(chi_tiet,\
      \ '<span>&#36;</span>.so_tien' RETURNING NUMBER) &gt; 1000000;</div></div><p><b>Kết\
      \ quả chạy thật</b></p><div class=\"code\"><div>ORA-02290: check constraint\
      \ (BNX.BNX_L07_ISJ) violated</div><div>\tID KENH</div><div>---------- ----------</div><div>\t\
      \ 2 atm</div></div>"
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước năm, chèn một chuỗi thiếu dấu đóng ngoặc, ràng buộc từ chối ngay. Rồi
      ta lọc các dòng có số tiền bên trong lớn hơn một triệu, và lấy ra trường kênh.
      Làm thử, năm trăm nghìn không lớn hơn một triệu, hai triệu thì lớn hơn, nên
      chỉ còn dòng hai, kênh máy rút tiền, khớp đầu ra thật.
  - show: '<p><b>Bước 6. Tạo hàng đợi trong cơ sở dữ liệu</b>: kiểu thông điệp, bảng
      hàng đợi, hàng đợi, rồi bật nó.</p><div class="code"><div>CREATE TYPE bnx_l07_msg
      AS OBJECT (ma_gd NUMBER, so_tien NUMBER);</div><div>/</div><div>BEGIN</div><div>  DBMS_AQADM.CREATE_QUEUE_TABLE(''bnx_l07_qt'',
      ''bnx_l07_msg'');</div><div>  DBMS_AQADM.CREATE_QUEUE(''bnx_l07_q'', ''bnx_l07_qt'');</div><div>  DBMS_AQADM.START_QUEUE(''bnx_l07_q'');</div><div>END;</div><div>/</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước sáu, tạo hàng đợi ngay trong cơ sở dữ liệu. Vì hàng đợi phải biết mỗi
      thông điệp chứa gì, nên trước hết khai kiểu thông điệp gồm mã giao dịch và số
      tiền. Rồi tạo bảng hàng đợi để chứa thông điệp, tạo hàng đợi trên bảng đó, và
      bật hàng đợi để gửi nhận được. Đây là hàng đợi kiểu cổ điển. Với thông điệp
      cần lưu bền ở tải lớn, bản hai mươi ba của Oracle khuyên dùng hàng đợi sự kiện
      giao dịch.
  - show: '<p><b>Bước 7. Gửi trong giao dịch</b>: gửi 101 rồi hoàn tác, gửi 102 rồi
      chốt.</p><div class="code"><div>DECLARE</div><div>  eo  DBMS_AQ.ENQUEUE_OPTIONS_T;</div><div>  mp  DBMS_AQ.MESSAGE_PROPERTIES_T;</div><div>  id  RAW(16);</div><div>BEGIN</div><div>  DBMS_AQ.ENQUEUE(''bnx_l07_q'',
      eo, mp, bnx_l07_msg(101, 500000), id);</div><div>  ROLLBACK;</div><div>  DBMS_AQ.ENQUEUE(''bnx_l07_q'',
      eo, mp, bnx_l07_msg(102, 200000), id);</div><div>  COMMIT;</div><div>END;</div><div>/</div><div>SELECT
      COUNT(*) AS so_thong_diep FROM bnx_l07_qt;</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bảy, gửi thông điệp một trăm linh một rồi hoàn tác, sau đó gửi một trăm
      linh hai rồi chốt. Vì việc gửi mặc định là một phần của giao dịch đang chạy,
      nên hoàn tác thì thông điệp đầu biến mất. Năm đối số của lệnh gửi là tên hàng
      đợi, tuỳ chọn gửi, thuộc tính thông điệp, nội dung, và biến nhận lại mã thông
      điệp. Câu cuối đếm số thông điệp trong bảng hàng đợi.
  - show: "<p><b>Kết quả chạy thật</b></p><div class=\"code\"><div>SO_THONG_DIEP</div><div>-------------</div><div>\t\
      \    1</div></div><p class='note'>Làm thử: 2 lần gửi − 1 lần bị hoàn tác = 1\
      \ thông điệp.</p>"
    clear: true
    say: Làm thử, vì lần gửi đầu đã bị hoàn tác, hai lần gửi trừ một còn một thông
      điệp, khớp với đầu ra thật.
  - show: '<p><b>Bước 8. Nhận rồi chốt.</b></p><div class="code"><div>DECLARE</div><div>  dq  DBMS_AQ.DEQUEUE_OPTIONS_T;</div><div>  mp  DBMS_AQ.MESSAGE_PROPERTIES_T;</div><div>  m   bnx_l07_msg;</div><div>  id  RAW(16);</div><div>BEGIN</div><div>  dq.wait
      := DBMS_AQ.NO_WAIT;</div><div>  DBMS_AQ.DEQUEUE(''bnx_l07_q'', dq, mp, m, id);</div><div>  DBMS_OUTPUT.PUT_LINE(''nhan:
      '' || m.ma_gd || '' '' || m.so_tien);</div><div>  COMMIT;</div><div>END;</div><div>/</div></div>'
    focus:
    - 1
    - 2
    clear: true
