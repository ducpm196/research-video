- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(alg.bnx_l23_score(alg.bnx_l23_c(256) / 2, 256), 4) == -0.7071
  - round(alg.bnx_l23_decision(-0.7071, -0.7353), 4) == 0.0282 and alg.bnx_l23_label(-0.7071,
    -0.7353) == 1
  - alg.bnx_l23_expected_flags(1010, 0.02) == 21 and int(0.02 * (1010 - 1)) + 1 ==
    21 and 21 - 10 == 11
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề (dùng c(256) = 10,2448 và offset_
      = −0,7353 của bài)</th></tr><tr><td>1</td><td>Một điểm có độ sâu trung bình
      bằng một nửa c(256). Điểm bất thường (dấu âm kiểu thư viện) là bao nhiêu? Điểm
      quyết định là bao nhiêu, nhãn là gì?</td></tr><tr><td>2</td><td>Đặt tỉ lệ nhiễm
      2% cho 1010 điểm. Theo quy tắc đếm ở phần phân vị, bao nhiêu điểm bị gắn -1?
      Nếu thật sự lạ chỉ có 10, bao nhiêu điểm thường bị gắn oan?</td></tr><tr><td>3</td><td>Quyết
      định: giao dịch bị gắn -1. Chặn tự động hay chuyển người xét? Cho biết được
      và mất.</td></tr></table>'
    pause: 25
    say: 'Bây giờ tới phần bạn tự làm bài. Câu một, một điểm có độ sâu trung bình
      bằng một nửa mức tham chiếu c của hai trăm năm mươi sáu. Điểm bất thường là
      bao nhiêu, điểm quyết định là bao nhiêu, nhãn là gì? Câu hai, đặt tỉ lệ nhiễm
      hai phần trăm cho một nghìn không trăm mười điểm. Theo quy tắc đếm ở phần phân
      vị, bao nhiêu điểm bị gắn âm một, và nếu thật sự lạ chỉ có mười thì bao nhiêu
      điểm thường bị gắn oan? Câu ba, giao dịch bị gắn âm một: chặn tự động hay chuyển
      người xét? Hãy nêu cái được và cái mất. Hãy dừng video và làm ra giấy.'
  - show: $$2^{-1/2} \approx 0{,}7071 \;\Rightarrow\; \text{điểm} = -0{,}7071;\quad
      -0{,}7071 + 0{,}7353 = \hl{+0{,}0282} \geq 0 \;\Rightarrow\; \text{nhãn } \hlg{1}$$
    say: Đáp án câu một. Độ sâu bằng một nửa mức tham chiếu thì số mũ là âm một phần
      hai. Hai mũ âm một phần hai xấp xỉ không phẩy bảy không bảy một, nên điểm là
      âm không phẩy bảy không bảy một. Điểm quyết định bằng âm không phẩy bảy không
      bảy một cộng không phẩy bảy ba năm ba, bằng dương không phẩy không hai tám hai.
      Không âm nên nhãn là một, vừa đủ nằm trong vùng thường.
    clear: true
  - show: $$0{,}02 \cdot (1010 - 1) = 20{,}18 \;\Rightarrow\; 20 + 1 = \hl{21} \text{
      điểm bị gắn};\quad 21 - 10 = \hlg{11} \text{ điểm thường bị gắn oan}$$
    say: Đáp án câu hai. Ngưỡng là phân vị hai phần trăm, vị trí hai mươi phẩy mười
      tám trong dãy đã sắp, phần nguyên là hai mươi, cộng một nên có hai mươi mốt
      điểm nằm dưới ngưỡng. Kết quả chạy thật cũng cho hai mươi mốt. Nếu thật sự lạ
      chỉ có mười thì mười một điểm thường bị gắn oan.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>chuyển
      người xét</td><td>giao dịch hợp lệ lớn, như lương 50 triệu, không bị chặn oan;
      kẻ gian vẫn bị giữ lại để xem</td><td>chậm hơn, tốn công; tỉ lệ nhiễm cao thì
      hộp thư ngập</td></tr><tr><td>giữ lại và yêu cầu xác thực thêm</td><td>đỡ chặn
      oan, người xét chỉ nhận ca còn nghi</td><td>thêm một bước cho khách; cần có
      kênh xác thực</td></tr><tr><td>chặn tự động mọi nhãn -1</td><td>nhanh, không
      tốn người</td><td>chặn oan khách thật; không sửa được sai sót của giả định tỉ
      lệ nhiễm</td></tr></table>
    say: Đáp án câu ba. Nhãn âm một chỉ nói giao dịch lạ, không nói gian lận, nên
      chuyển người xét. Chuyển người xét thì không chặn oan giao dịch hợp lệ lớn như
      lương năm mươi triệu, mà vẫn giữ lại giao dịch đáng ngờ để xem. Đổi lại chậm
      hơn, tốn công, và nếu tỉ lệ nhiễm đặt cao thì hộp thư ngập. Còn có mức giữa
      là giữ lại và yêu cầu xác thực thêm, đỡ chặn oan mà người xét chỉ nhận ca còn
      nghi, đổi lại khách phải qua thêm một bước. Chặn tự động thì nhanh, nhưng chặn
      oan khách thật, và không có ai sửa sai cho giả định về tỉ lệ nhiễm.
    clear: true
