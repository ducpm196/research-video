      lạ bị gắn -1: 10 trên 10</div><div>tổng số gắn -1: 11 trên 1010</div><div>điểm
      thường bị gắn -1: 1</div><div>offset_ = -0.7353</div></div>'
    clear: true
    say: 'Kết quả chạy thật: cả mười điểm lạ nhận nhãn âm một, nhưng tổng là mười
      một nhãn, nghĩa là một giao dịch thường bị gắn oan.'
  - show: '<p><b>Bước 5.</b> Vì sao ra đúng ngưỡng ấy. Tỉ lệ nhiễm 1% nghĩa là: lấy
      điểm của chính dữ liệu huấn luyện, đặt ngưỡng ở phân vị 1% thấp nhất. Điểm nào
      thấp hơn ngưỡng nhận nhãn -1:</p>

      $$\text{quyết định} = \text{điểm} - \text{offset\_}, \qquad \text{quyết định}
      < 0 \;\Rightarrow\; \text{nhãn} = \hl{-1}$$

      <span class=''note''>Theo quy tắc đếm (đúng khi các điểm khác nhau): 0,01 ×
      1009 = 10,09, làm tròn lên là 11 điểm nằm dưới ngưỡng, dù thật sự lạ chỉ có
