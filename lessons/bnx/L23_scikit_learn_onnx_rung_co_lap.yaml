      = mm.predict(X)</div><div>    print(hat, (p[1000:] == -1).sum(), (p == -1).sum())</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>0 10 11</div><div>1 10 11</div><div>2
      10 11</div><div>3 10 11</div><div>4 10 11</div></div>'
    focus:
    - '2.5'
    - '4.1'
    clear: true
    say: 'Kiểm hai, đổi hạt giống năm lần từ không tới bốn: lần nào cũng bắt đủ mười
      điểm lạ và gắn tổng cộng mười một điểm. Dữ liệu tách xa nên kết quả không phụ
      thuộc hạt giống.'
- id: quymo
  kind: example
  title: 'Khi giao dịch tăng ×10 và ×100: mô hình và người xét thay đổi ra sao'
  checks:
  - alg.bnx_l23_expected_flags(1010, 0.01) == 11 and alg.bnx_l23_expected_flags(10100,
    0.01) == 101
  - abs(1005 - alg.bnx_l23_expected_flags(101000, 0.01)) <= 5
  - '[alg.bnx_l23_reviewers(f, 40) for f in (11, 101, 1005)] == [1, 3, 26]'
  - 10100 // 1010 == 10 and 101000 // 1010 == 100
  steps:
  - show: '<p><b>QuyMo.py (trích): dữ liệu ở ba cỡ, vẫn 1% là điểm lạ</b></p><div
      class="code"><div>import numpy as np</div><div>from sklearn.ensemble import
      IsolationForest</div><div>for n_la in (10, 100, 1000):</div><div>    rng = np.random.default_rng(42)</div><div>    thuong
      = rng.normal(500, 50, n_la * 100)</div><div>    la = rng.normal(50_000, 2_000,
      n_la)</div><div>    X = np.concatenate([thuong, la]).reshape(-1, 1)</div></div>'
    clear: true
    say: Ta đo khi giao dịch tăng dần, ở ba cỡ là một nghìn không trăm mười, mười
      nghìn một trăm và một trăm lẻ một nghìn, vẫn một phần trăm là lạ.
  - show: '<p><b>QuyMo.py (tiếp): huấn luyện lại, đếm nhãn âm một và số nút của rừng</b></p><div
      class="code"><div>    mm = IsolationForest(n_estimators=100, contamination=0.01,</div><div>                         random_state=42).fit(X)</div><div>    p
      = mm.predict(X)</div><div>    nut = sum(t.tree_.node_count for t in mm.estimators_)</div><div>    print(len(X),
      "diem:", (p == -1).sum(), "bi gan -1,",</div><div>          (p[len(thuong):]
      == -1).sum(), "la that,", nut, "nut cua rung")</div></div><p><b>Kết quả chạy
      thật</b></p><div class="code"><div>1010 diem: 11 bi gan -1, 10 la that, 11384
      nut cua rung</div><div>10100 diem: 101 bi gan -1, 100 la that, 11802 nut cua
      rung</div><div>101000 diem: 1005 bi gan -1, 1000 la that, 11436 nut cua rung</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Mỗi lần ta huấn luyện lại rừng, đếm số nhãn âm một, số điểm lạ thật bị bắt
      và tổng số nút. Kết quả chạy thật: nhãn âm một tăng theo cỡ dữ liệu, còn số
      nút giữ quanh mười một nghìn bốn trăm.'
  - show: '<table class=''t''><tr><th>số giao dịch N</th><th>gắn nhãn −1</th><th>điểm
      lạ thật bị bắt</th><th>tổng số nút của rừng</th><th>người xét cần mỗi ngày (40
