- id: pitfalls
  kind: pitfall
  title: Điều mô hình KHÔNG làm được, và lỗi theo từng giai đoạn
  checks:
  - alg.bnx_l23_expected_flags(1010, 0.001) == 2 and alg.bnx_l23_expected_flags(1010,
    0.01) == 11 and alg.bnx_l23_expected_flags(1010, 0.05) == 51
  - alg.bnx_l23_expected_flags(1010, 0.05) - 10 == 41
  - alg.bnx_l23_expected_flags(1010, 0.05) == int(0.05 * (1010 - 1)) + 1 and 10 -
    2 == 8
  - 977 + 23 == 1000
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Tin rằng nhãn -1 là “gian
      lận”, và tỉ lệ nhiễm là điều mô hình tự tìm ra. Đổi tỉ lệ nhiễm, số điểm bị
      gắn đổi theo, còn lạ thật vẫn là 10: đặt thấp thì bỏ sót, đặt cao thì gắn oan.</div><div
      class="code"><div>for ti_le in (0.001, 0.01, 0.05, "auto"):</div><div>    m
      = IsolationForest(n_estimators=100, contamination=ti_le,</div><div>                        random_state=42).fit(X)</div><div>    p
      = m.predict(X)</div><div>    print(ti_le, "gắn -1:", (p == -1).sum(),</div><div>          "|
      lạ thật:", (p[1000:] == -1).sum())</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>0.001 gắn -1: 2 | lạ thật: 2</div><div>0.01 gắn -1: 11 | lạ
      thật: 10</div><div>0.05 gắn -1: 51 | lạ thật: 10</div><div>auto gắn -1: 137
      | lạ thật: 10</div></div>'
    focus:
    - 1
    - '2.1'
    - '4.1'
    - '4.2'
    - '4.3'
    - '4.4'
    - 4
    say: 'Lỗi thứ nhất, của người mới, là tin rằng nhãn âm một nghĩa là gian lận,
      và tỉ lệ nhiễm là điều mô hình tự tìm ra. Ta thử ba tỉ lệ nhiễm, và thêm giá
      trị mặc định là tự động. Kết quả chạy thật: với không phẩy không không một,
      rừng chỉ gắn hai điểm, tức bỏ sót tám điểm lạ. Với một phần trăm gắn mười một
      điểm. Với năm phần trăm gắn năm mươi mốt điểm, trong đó vẫn chỉ mười điểm lạ
      thật. Nếu không đặt gì, ngưỡng cố định ở âm không phẩy năm và rừng gắn một trăm
      ba mươi bảy điểm. Vậy số điểm bị gắn do ta đặt, không do dữ liệu tự nói: đặt
      thấp thì bỏ sót, đặt cao thì gắn oan.'
  - show: '<p><b>Hai điểm mô hình trả lời sai điều ta cần</b></p><div class="code"><div>gian_lan_nho
      = [[520]]     # kẻ gian chuyển số tiền như người thường</div><div>luong_lon
      = [[50_000]]     # công ty trả lương hợp lệ, số tiền lớn</div><div>print(mo_hinh.predict(gian_lan_nho),
      mo_hinh.predict(luong_lon))</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>[1]
      [-1]</div></div><div class=''box key''>Số tiền 520 nghìn trông như người thường
      nên nhãn 1: <b>kẻ gian tiêu nhỏ không bị thấy</b>. Số tiền 50 triệu lạ nên nhãn
      -1 (vì rừng đã thấy nhóm này hiếm): <b>lương hợp lệ vẫn bị gắn</b>. Lạ không
      đồng nghĩa gian lận: cần người xét lại.</div>'
    focus:
    - 1
    - '2.1'
    - '4.1'
    - 5
    clear: true
    say: 'Ta thử thêm hai điểm. Một kẻ gian chuyển số tiền năm trăm hai mươi nghìn,
      trông như người thường, nên nhãn là một: mô hình không thấy kẻ gian tiêu nhỏ.
      Một công ty trả lương hợp lệ năm mươi triệu, nên nhãn là âm một, dù không có
      gì sai, vì rừng đã thấy nhóm năm mươi triệu là hiếm. Lạ không đồng nghĩa với
      gian lận, nên mọi nhãn âm một cần người xét lại.'
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Xuất
      ONNX mà không khai phiên bản miền <code>ai.onnx.ml</code>, hoặc xuất xong chỉ
      thử vài điểm mẫu rồi cho chạy. Thư viện xuất của máy này dừng ngay với một lỗi:</div><div
      class="code"><div>onx = to_onnx(mo_hinh, x32[:1])</div></div><p><b>Thông báo
      lỗi thật (dòng cuối của vết lỗi, lược bớt)</b></p><div class="code"><div>RuntimeError:
      The model is using version 4 of domain ''ai.onnx.ml''…</div></div><p class="small">Cách
      chữa: khai target_opset như bước 6 (ở đây ai.onnx.ml bản 3), ghi lại bản của
      ba thư viện lúc xuất (học máy, bộ chuyển, ONNX Runtime), rồi so nhãn VÀ điểm
      trên TOÀN BỘ dữ liệu, nhất là các điểm sát ngưỡng, không chỉ vài mẫu.</p>'
    focus:
    - 1
    - '2.1'
    - '4.1'
    - 5
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, gặp lúc mới dựng. Xuất ONNX mà không khai
      phiên bản của miền học máy, hoặc xuất xong chỉ thử vài điểm mẫu rồi cho chạy.
      Trên máy này, thư viện xuất dừng ngay với một lỗi, nói mô hình dùng bản bốn
      của miền học máy trong ONNX, mà thư viện chưa hỗ trợ. Cách chữa là khai phiên
      bản đích như bước sáu, ghi lại bản của ba thư viện lúc xuất, rồi so cả nhãn
      lẫn điểm trên toàn bộ dữ liệu, nhất là các điểm sát ngưỡng.
  - show: '<p><b>Lỗi 3 (vận hành lâu dài): tháng sau mức chi tiêu thường đổi</b></p><div
      class="code"><div>rng3 = np.random.default_rng(99)</div><div>thang_sau = rng3.normal(1500,
      150, 1000).reshape(-1, 1)</div><div>p = mo_hinh.predict(thang_sau)</div><div>print("thường
      mà bị gắn -1:", (p == -1).sum(), "trên 1000")</div></div><p><b>Kết quả chạy
      thật</b></p><div class="code"><div>thường mà bị gắn -1: 977 trên 1000</div></div><p
      class="small">Vì sao: mức 1500 nghìn nằm trong khoảng trống giữa hai nhóm cũ,
      nên bị cô lập rất nhanh.</p>

      <p class="small">Cách chữa: theo dõi tỉ lệ nhãn -1 và phân bố điểm mỗi ngày,
      so với lúc huấn luyện (tỉ lệ 1% chỉ đáng so khi dữ liệu giống lúc huấn luyện,
      vì 1% vốn là giả định); huấn luyện lại theo lịch.</p>

      '
    focus:
    - 1
    - '2.2'
    - '4.1'
    - 5
    - 6
    - 6
    clear: true
    say: 'Lỗi thứ ba lộ ra khi vận hành lâu dài, là trôi dữ liệu. Một tháng sau, mức
      chi tiêu thường tăng lên quanh một triệu rưỡi, nhưng mô hình vẫn là bản huấn
      luyện cũ. Kết quả chạy thật: chín trăm bảy mươi bảy trên một nghìn giao dịch
      thường bị gắn âm một, nên hộp thư người xét ngập. Mức một triệu rưỡi nằm trong
      khoảng trống giữa hai nhóm cũ, nên bị cô lập rất nhanh. Cách chữa là theo dõi
      tỉ lệ nhãn âm một và phân bố điểm mỗi ngày, so với lúc huấn luyện, và huấn luyện
      lại theo lịch. Tỉ lệ một phần trăm chỉ đáng so khi dữ liệu giống lúc huấn luyện,
      vì một phần trăm vốn là giả định.'
  - show: '<div class="box warn"><b>Lỗi 4 (lúc tải tăng).</b> Nạp lại tệp ONNX cho
      từng yêu cầu, hoặc tin vì “chạy ngon trên máy cá nhân”: số đo trên máy cá nhân
      chưa nói gì về <b>độ trễ</b> khi vận hành thật.</div>

      <p class="small">Cách đo: nạp tệp một lần lúc khởi động; bỏ vài lần chạy đầu;
      rồi đo nhiều lần với dữ liệu và số luồng như vận hành; báo phân vị 50, 95, 99
      chứ không chỉ trung bình. Số đo chỉ đúng cho máy đã đo.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: 'Lỗi thứ tư gặp lúc tải tăng: nạp lại tệp cho từng yêu cầu, hoặc tin vì chạy
      ngon trên máy cá nhân. Tạo phiên chạy thường tốn kém, nên cần nạp tệp một lần
      lúc khởi động. Số đo trên máy cá nhân chưa nói gì về độ trễ khi vận hành thật,
