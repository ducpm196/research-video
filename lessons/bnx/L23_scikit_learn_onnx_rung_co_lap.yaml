- id: example
  kind: example
  title: Ví dụ rừng cô lập trên 1010 giao dịch, từng phép tính
  checks:
  - round(2 * (__import__('math').log(255) + 0.57722) - 2 * 255 / 256, 4) == 10.2448
  - round(alg.bnx_l23_depth_from_score(-0.8448, 256), 2) == 2.49
  - round(alg.bnx_l23_depth_from_score(-0.4475, 256), 2) == 11.88 and round(11.88
    / 2.49, 1) == 4.8
  - round(alg.bnx_l23_decision(-0.8448, -0.7353), 4) == -0.1095 and round(alg.bnx_l23_decision(-0.4475,
    -0.7353), 4) == 0.2878
  - alg.bnx_l23_expected_flags(1010, 0.01) == 10 + 1
  steps:
  - show: '<p>1000 giao dịch thường quanh 500 nghìn đồng, 10 giao dịch lạ 50 triệu
      đồng; rừng 100 cây, tỉ lệ nhiễm 1%; mỗi cây huấn luyện trên tối đa 256 điểm.
      <span class=''note''>(số minh hoạ: dữ liệu sinh ngẫu nhiên, hạt giống cố định,
      không phải của tổ chức nào)</span></p>

      $$① \; c(256) = 2\,(\ln 255 + 0{,}57722) - \frac{2 \cdot 255}{256} = 12{,}2370
      - 1{,}9922 = \hl{10{,}2448}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ta làm trọn một ví dụ. Một nghìn giao dịch thường quanh năm trăm nghìn đồng,
      mười giao dịch lạ năm mươi triệu đồng, rừng một trăm cây, tỉ lệ nhiễm một phần
      trăm. Mỗi cây huấn luyện trên tối đa hai trăm năm mươi sáu điểm. Phép tính thứ
      nhất, mức tham chiếu c của hai trăm năm mươi sáu bằng mười hai phẩy hai ba bảy
      không trừ một phẩy chín chín hai hai, bằng mười phẩy hai bốn bốn tám.
  - show: '<p>Dùng lại c(256) = 10,2448 ở phép ①. Nhóm lạ có điểm trung bình −0,8448.</p>

      $$② \; \text{độ sâu} = -c \cdot \log_2(0{,}8448) = 10{,}2448 \cdot 0{,}2433
      = \hl{2{,}49} \text{ lần cắt}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    introduces:
    - sub
    say: Phép tính thứ hai dùng lại mười phẩy hai bốn bốn tám. Nhóm lạ có điểm trung
      bình âm không phẩy tám bốn bốn tám. Độ sâu quy đổi bằng âm c nhân lốc hai của
      không phẩy tám bốn bốn tám. Đó là mười phẩy hai bốn bốn tám nhân không phẩy
      hai bốn ba ba, khoảng hai phẩy bốn chín lần cắt.
  - show: '<p>Nhóm thường có điểm trung bình −0,4475.</p>

      $$③ \; \text{độ sâu} = -10{,}2448 \cdot \log_2(0{,}4475) = 10{,}2448 \cdot 1{,}1600
      = \hl{11{,}88} \text{ lần cắt}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ ba, cho nhóm thường có điểm trung bình âm không phẩy bốn bốn
      bảy năm. Cũng dùng mười phẩy hai bốn bốn tám, độ sâu bằng mười phẩy hai bốn
      bốn tám nhân một phẩy một sáu không không, khoảng mười một phẩy tám tám lần
      cắt. Điểm thường cần nhiều lần cắt hơn điểm lạ khoảng bốn phẩy tám lần.
  - show: '<p>Ngưỡng của rừng: offset_ = −0,7353 (phân vị 1%). Dùng điểm ở ② và ③.</p>

      $$④ \; \text{lạ: } -0{,}8448 + 0{,}7353 = \hl{-0{,}1095} < 0 \Rightarrow -1;\quad
      \text{thường: } -0{,}4475 + 0{,}7353 = \hlg{+0{,}2878} \Rightarrow 1$$

      <span class=''note''>Toàn tập: 11 điểm dưới ngưỡng = 10 điểm lạ + 1 điểm thường
      bị gắn oan.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Phép tính thứ tư, đặt ngưỡng. Ngưỡng của rừng là âm không phẩy bảy ba năm
      ba, ở phân vị một phần trăm. Với điểm ở phép hai và phép ba, nhóm lạ có điểm
      quyết định âm không phẩy một không chín năm, nhỏ hơn không nên nhãn âm một.
      Nhóm thường có điểm quyết định dương không phẩy hai tám bảy tám nên nhãn một.
      Trên toàn tập có mười một điểm dưới ngưỡng, gồm mười điểm lạ và một điểm thường
      bị gắn oan.
  - show: '<p>Xuất ONNX, chạy trên cả 1010 điểm.</p>

      $$⑤ \; \text{cùng nhãn với mô hình Python: } \hlg{1010 / 1010}; \quad \text{sai
      khác điểm lớn nhất} = \hl{1{,}8 \cdot 10^{-7}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: 'Phép tính thứ năm, xuất mô hình sang ONNX và chạy trên cả một nghìn không
      trăm mười điểm. Kết quả chạy thật: một nghìn không trăm mười trên một nghìn
      không trăm mười nhãn giống mô hình trong Python. Điểm quyết định sai khác nhau
      nhiều nhất chỉ cỡ một phẩy tám nhân mười mũ âm bảy.'
