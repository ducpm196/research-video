      cùng thứ tự: điểm lạ nông hơn. Số tuyệt đối khác vì thư viện chỉ dùng mẫu con
      hai trăm năm mươi sáu điểm, dừng ở độ sâu tám, rồi cộng mức tham chiếu của số
      điểm còn lại ở lá. Về ngưỡng, phần nguyên của mười phẩy không chín là mười,
      cộng một thành mười một điểm dưới ngưỡng, khớp với mười một nhãn âm một. Về
