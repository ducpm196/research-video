      máy (mã không hiện ở đây; bộ kiểm ghi ở audit/bnx/ver/l23.py)</td><td>chạy được:
      tệp chứa cây và ngưỡng</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.5'
    clear: true
    say: 'Bảng này kiểm thêm bằng bốn đường. Về độ sâu, tay cắt cho năm lần so với
