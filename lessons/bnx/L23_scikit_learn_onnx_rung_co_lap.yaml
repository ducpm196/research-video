scenes:
- id: hook
  kind: hook
  title: 'Sáng thứ hai: 1010 giao dịch, chưa ai gán nhãn, máy chỉ ra giao dịch lạ
    thế nào?'
  checks:
  - 1000 + 10 == 1010
  - alg.bnx_l23_expected_flags(1010, 0.01) == 11
  steps:
  - show: '<p>Mỗi sáng, bộ phận rủi ro nhận <b>1010</b> giao dịch chuyển tiền của
      hôm qua: <b>1000</b> giao dịch quanh <b>500 nghìn</b> đồng và <b>10</b> giao
      dịch ở mức <b>50 triệu</b> đồng.</p>

      <div class="box key">Không giao dịch nào có nhãn “gian lận” hay “bình thường”.
      Làm sao để máy <b>chỉ ra giao dịch lạ</b> cho người xét mà không cần ai gán
      nhãn trước? Và khi số giao dịch tăng gấp trăm lần, người xét có theo kịp không?</div>

      <p><span class=''note''>(số minh hoạ: dữ liệu sinh ngẫu nhiên; hạt giống là
      số khởi đầu của bộ sinh số ngẫu nhiên, đặt cố định thì chạy lại ra y hệt, không
      phải dữ liệu của tổ chức nào)</span></p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Chào bạn, mỗi sáng bộ phận rủi ro nhận một nghìn không trăm mười giao dịch
      chuyển tiền của hôm qua. Một nghìn giao dịch quanh năm trăm nghìn, mười giao
      dịch ở mức năm mươi triệu. Không giao dịch nào có nhãn, vậy làm sao để máy chỉ
      ra giao dịch lạ mà không cần ai gán nhãn trước? Và khi số giao dịch tăng gấp
      trăm lần thì người xét có theo kịp không? Mọi số liệu trong bài là số minh hoạ.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_l23_expected_flags(1010, 0.01) == 11 and int(0.01 * (1010 - 1)) + 1 ==
    11 and round(0.01 * 1009, 2) == 10.09
  - '[x for x in (1, 2, 3, 10) if x <= 5] == [1, 2, 3] and [x for x in (1, 2, 3, 10)
    if x > 5] == [10]'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Trung bình và độ lệch chuẩn</td><td>trung bình là mức ở giữa; độ lệch chuẩn
      cho biết các giá trị tản ra quanh nó bao xa; dữ liệu bài rải hình chuông (phân
      phối chuẩn)</td><td>quanh 500 nghìn, độ lệch chuẩn 50 nghìn: hầu hết nằm trong
      khoảng 400 tới 600</td></tr><tr><td>② Cắt đôi một dãy số</td><td>chọn một điểm
      cắt rồi chia dãy thành nửa nhỏ hơn và nửa lớn hơn</td><td>cắt dãy 1, 2, 3, 10
      tại 5: nửa trái 1, 2, 3; nửa phải 10</td></tr><tr><td>③ Phân vị</td><td>mức
      mà một tỉ lệ cho trước của các giá trị nằm dưới nó; số giá trị dưới ngưỡng ở
      phân vị p: p × (n−1) làm tròn lên (khi p × (n−1) đã là số nguyên thì giữ nguyên),
      nếu mọi điểm khác nhau; điểm trùng nhau thì số thật có thể thấp hơn</td><td>1%
      của 1010 giá trị: 0,01 × 1009 = 10,09, làm tròn lên: 11 giá trị dưới ngưỡng;
      1% của 101 giá trị: 0,01 × 100 = 1 đúng: 1 giá trị</td></tr><tr><td>④ Mô hình
      và nhãn</td><td>mô hình: bản ghi cách tính điểm, học từ dữ liệu; nhãn của mô
      hình: 1 (thường) hoặc âm 1 (lạ)</td><td>mô hình không nói “gian lận”, chỉ nói
      “lạ”</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    introduces:
    - bnx_do_lech_chuan
    - bnx_phan_phoi_chuan
    say: Trước hết ta cần hiểu bốn điều, trung bình là mức ở giữa, độ lệch chuẩn cho
      biết giá trị tản ra quanh nó bao xa, và dữ liệu rải hình chuông là phân phối
      chuẩn. Cắt đôi một dãy số là chọn một điểm cắt rồi chia thành nửa nhỏ và nửa
      lớn. Phân vị là mức mà một tỉ lệ các giá trị nằm dưới nó, và số điểm dưới ngưỡng
      là p nhân n trừ một, làm tròn lên. Mô hình là bản ghi cách tính điểm học từ
      dữ liệu, nhãn của nó là một cho điểm thường hoặc âm một cho điểm lạ.
- id: sym
  kind: symbol
  title: Giải mã từ ngữ và ký hiệu
  checks:
  - alg.bnx_l23_score(0, 256) == -1.0
  - alg.bnx_l23_score(alg.bnx_l23_c(256), 256) == -0.5
  steps:
  - show: <table class='t'><tr><th>từ (tên trên màn hình)</th><th>nghĩa</th></tr><tr><td>Isolation
      Forest, rừng cô lập</td><td>rừng gồm nhiều cây cắt ngẫu nhiên; điểm càng nhanh
      bị cô lập càng lạ</td></tr><tr><td>n_estimators</td><td>số cây trong rừng</td></tr><tr><td>contamination,
      tỉ lệ nhiễm</td><td>tỉ lệ điểm lạ mà ta ĐẶT GIẢ ĐỊNH cho dữ liệu huấn luyện;
      dùng để chọn ngưỡng; số thực phải thuộc (0; 0,5]; mặc định là 'auto'</td></tr><tr><td>fit,
      predict</td><td>huấn luyện trên dữ liệu; gắn nhãn 1 hoặc -1 cho từng điểm</td></tr><tr><td>score_samples,
      offset_, decision_function</td><td>điểm bất thường (càng âm càng lạ); ngưỡng;
      điểm trừ ngưỡng, âm thì nhãn -1</td></tr><tr><td>ONNX, ONNX Runtime</td><td>định
      dạng tệp mô hình; thư viện đọc tệp ấy và chạy mô hình</td></tr></table>
    focus:
    - - '1.2'
      - '1.3'
    - '1.4'
    - - '1.5'
      - '1.6'
    - '1.7'
    introduces:
    - bnx_ti_le_nhiem
    - bnx_onnx
    say: Bảng này giải mã các từ của bài. Rừng cô lập là rừng nhiều cây cắt ngẫu nhiên,
      điểm càng nhanh bị cô lập càng lạ. Tỉ lệ nhiễm là tỉ lệ điểm lạ ta đặt giả định
      để chọn ngưỡng. ONNX là định dạng tệp mô hình, còn ONNX Runtime là thư viện
      chạy tệp ấy.
  - show: '<table class=''t''><tr><th>ký hiệu</th><th>nghĩa</th></tr><tr><td>h(x)</td><td>số
      lần cắt cần để cô lập điểm x trong một cây (độ sâu)</td></tr><tr><td>E[h(x)]</td><td>độ
      sâu trung bình của x trên cả rừng</td></tr><tr><td>c(n)</td><td>độ sâu trung
      bình để cô lập một điểm trong cây n điểm; dùng để chuẩn hoá</td></tr><tr><td>s(x,
      n)</td><td>điểm bất thường 2 mũ của (−E[h(x)] / c(n)); s = 0,5 khi độ sâu bằng
      c(n); s lớn hơn 0,5 nghĩa là độ sâu nhỏ hơn c(n), càng gần 1 càng lạ</td></tr></table><p
      class=''small''>Thư viện học máy trả về điểm mang dấu âm, tức là âm s: càng
      âm càng lạ. Điểm thường trong bài này có s = 0,4475.</p>'
    focus:
    - - 1
    - 2
    clear: true
    say: Bốn ký hiệu của công thức, h của x là số lần cắt để cô lập điểm x, gọi là
      độ sâu, và E của h là độ sâu trung bình trên cả rừng. C của n là mức chuẩn hoá,
      còn s là điểm bất thường, bằng không phẩy năm khi độ sâu đúng bằng c và càng
      gần một thì càng lạ.
  - show: '<table class=''t''><tr><th>chữ trong mã Python</th><th>nghĩa</th></tr><tr><td><code>np.random.default_rng(42)</code>,
      <code>.normal(tâm, lệch, n)</code></td><td>bộ sinh số ngẫu nhiên cố định theo
      hạt giống 42 / sinh n số hình chuông quanh tâm</td></tr><tr><td><code>np.concatenate</code>,
      <code>.reshape(-1, 1)</code>, <code>.ravel()</code></td><td>nối hai mảng / xếp
      thành một cột / trải lại thành một hàng</td></tr><tr><td><code>float32</code>,
      <code>tree_.node_count</code></td><td>số thực 32 bit (làm tròn thô hơn) / số
      nút của một cây</td></tr><tr><td><code>target_opset</code>, <code>InferenceSession</code>,
      <code>math.log2</code></td><td>phiên bản bộ phép toán của ONNX / phiên chạy
      một mô hình ONNX / lôgarit cơ số 2: 2 mũ mấy ra số đó</td></tr></table>'
    introduces:
    - bnx_numpy_rng
    clear: true
    say: 'Bảng cuối giải mã vài chữ trong mã Python sẽ gặp: bộ sinh số, cách xếp mảng,
      số thực ba mươi hai bit và lôgarit cơ số hai.'
