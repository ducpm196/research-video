  steps:
  - show: '<p><b>Bước 1. Sinh dữ liệu với hạt giống cố định</b></p><div class="code"><div>import
      numpy as np</div><div>rng = np.random.default_rng(42)</div><div>thuong = rng.normal(500,
      50, 1000)      # nghìn đồng</div><div>la = rng.normal(50_000, 2_000, 10)      #
      50 triệu đồng</div><div>X = np.concatenate([thuong, la]).reshape(-1, 1)</div><div>print(X.shape)</div><div>print(round(thuong.mean()),
      round(la.mean()))</div><div>print(round(thuong.min()), round(thuong.max()))</div><div>print(round(la.min()),
      round(la.max()))</div></div>'
    focus:
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.6'
    say: Bước một, ta sinh dữ liệu bằng thư viện số học, và cố định hạt giống nên
      chạy lại luôn ra y nguyên. Một nghìn giao dịch thường quanh năm trăm nghìn,
      độ lệch chuẩn cỡ năm mươi. Mười giao dịch lạ quanh năm mươi nghìn nghìn đồng,
      tức năm mươi triệu, độ lệch chuẩn cỡ hai nghìn. Bốn dòng in ở cuối cho biết
      hình dạng, trung bình, nhỏ nhất và lớn nhất của từng nhóm.
  - show: <div class="code"><div>print(X.shape)</div><div>print(round(thuong.mean()),
      round(la.mean()))</div><div>print(round(thuong.min()), round(thuong.max()))</div><div>print(round(la.min()),
      round(la.max()))</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>(1010,
      1)</div><div>499 50241</div><div>318 659</div><div>48541 51512</div></div>
    focus:
    - '3.1'
    - '3.3'
    - '3.4'
    - 3
    clear: true
    say: 'Kết quả chạy thật: một nghìn không trăm mười dòng, một cột. Giao dịch thường
      nằm từ khoảng ba trăm mười tám tới sáu trăm năm mươi chín. Giao dịch lạ nằm
      từ khoảng bốn mươi tám nghìn tới năm mươi mốt nghìn. Hai nhóm tách xa nhau,
      nên ta kỳ vọng điểm lạ dễ bị cô lập.'
  - show: '<p><b>Bước 2. Tự cắt: đếm số lần cắt để cô lập một điểm</b></p><div class="code"><div>def
      so_lan_cat(x, d, rng):</div><div>    n = 0</div><div>    while len(d) &gt; 1:</div><div>        c
      = rng.uniform(d.min(), d.max())</div><div>        d = d[d &lt;= c] if x &lt;=
      c else d[d &gt; c]</div><div>        n += 1</div><div>    return n</div></div><p
      class=''small''>Hàm này chỉ để minh hoạ: nếu dãy có các giá trị trùng nhau thì
      vòng lặp không bao giờ dừng, còn thư viện có độ sâu tối đa.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước hai, ta tự viết phép cắt ngẫu nhiên. Hàm nhận một điểm cần cô lập và
      dãy các điểm còn lại. Mỗi vòng, nó chọn một điểm cắt ngẫu nhiên giữa giá trị
      nhỏ nhất và lớn nhất, rồi giữ lại nửa chứa điểm đang xét. Vì mỗi lần cắt loại
      đi một nửa không chứa điểm, nên đếm số vòng cho tới khi chỉ còn một điểm chính
      là độ sâu của điểm đó. Hàm này chỉ để minh hoạ, vì nếu dãy có các giá trị trùng
      nhau thì vòng lặp không bao giờ dừng, còn thư viện có độ sâu tối đa.
  - show: <div class="code"><div>d = X.ravel()</div><div>rng2 = np.random.default_rng(7)</div><div>for
      i in (0, 1000):</div><div>    cat = [so_lan_cat(d[i], d, rng2) for _ in range(200)]</div><div>    print(round(d[i]),
      sum(cat) / len(cat))</div></div><p><b>Làm thử — kết quả chạy thật</b></p><div
      class="code"><div>515 15.775</div><div>49881 5.075</div></div>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: 'Làm thử, ta cô lập hai điểm, mỗi điểm hai trăm lần, vì một lần chạy ngẫu
      nhiên chưa đủ tin. Điểm thứ nhất là một giao dịch thường, khoảng năm trăm mười
      lăm nghìn. Điểm thứ hai là một giao dịch lạ, khoảng bốn mươi chín nghìn tám
      trăm tám mươi mốt. Kết quả chạy thật: điểm thường cần trung bình mười lăm phẩy
      tám lần cắt, điểm lạ chỉ năm phẩy không bảy lần.'
  - show: '<p><b>Bước 3.</b> Độ sâu trung bình c(n) và điểm bất thường. Vì cây có
      thể sâu hay nông tuỳ số điểm, ta chia độ sâu cho một mức tham chiếu để điểm
      không phụ thuộc cỡ mẫu:</p>

      $$c(n) = 2\,(\ln(n-1) + \gamma) - \frac{2\,(n-1)}{n}, \qquad s(x,n) = 2^{-E[h(x)]\,/\,c(n)}$$

      <span class=''note''>γ ≈ 0,5772 là hằng số Euler–Mascheroni. Mỗi cây của thư
      viện huấn luyện trên tối đa 256 điểm, nên mức tham chiếu là c(256).</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    introduces:
    - gamma
    - log
    clear: true
    say: Bước ba là độ sâu trung bình và điểm bất thường. Vì cây có thể sâu hay nông
      tuỳ số điểm, ta chia độ sâu cho một mức tham chiếu, để điểm không phụ thuộc
      cỡ mẫu. Mức tham chiếu c của n bằng hai lần tổng của lốc tự nhiên n trừ một
      và một hằng số cỡ không phẩy năm bảy bảy, trừ đi hai nhân n trừ một chia n.
      Điểm s bằng hai mũ âm độ sâu trung bình chia c. Mỗi cây của thư viện huấn luyện
      trên tối đa hai trăm năm mươi sáu điểm, nên mức tham chiếu là c của hai trăm
      năm mươi sáu.
