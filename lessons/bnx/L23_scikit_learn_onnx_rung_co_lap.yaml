  steps:
  - show: '<p><b>Bước 1. Sinh dữ liệu với hạt giống cố định</b></p><div class="code"><div>import
      numpy as np</div><div>rng = np.random.default_rng(42)</div><div>thuong = rng.normal(500,
      50, 1000)      # nghìn đồng</div><div>la = rng.normal(50_000, 2_000, 10)      #
      50 triệu đồng</div><div>X = np.concatenate([thuong, la]).reshape(-1, 1)</div><div>print(X.shape)</div><div>print(round(thuong.mean()),
      round(la.mean()))</div><div>print(round(thuong.min()), round(thuong.max()))</div><div>print(round(la.min()),
      round(la.max()))</div></div>'
    focus:
    - '2.2'
    - '2.3'
    say: Bước một, ta sinh dữ liệu bằng thư viện số học, hạt giống cố định nên chạy
      lại luôn ra y nguyên. Một nghìn giao dịch thường quanh năm trăm nghìn, mười
      giao dịch lạ quanh năm mươi triệu.
  - show: <div class="code"><div>print(X.shape)</div><div>print(round(thuong.mean()),
      round(la.mean()))</div><div>print(round(thuong.min()), round(thuong.max()))</div><div>print(round(la.min()),
      round(la.max()))</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>(1010,
      1)</div><div>499 50241</div><div>318 659</div><div>48541 51512</div></div>
    focus:
    - '3.1'
    - '3.3'
    clear: true
    say: 'Kết quả chạy thật: một nghìn không trăm mười dòng. Giao dịch thường từ ba
      trăm tới sáu trăm năm mươi, giao dịch lạ từ bốn mươi tám nghìn tới năm mươi
      mốt nghìn, nên hai nhóm tách xa.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>d[d
      &lt;= c]</code></td><td>lọc bằng điều kiện: giữ các phần tử của <code>d</code>
      nhỏ hơn hoặc bằng <code>c</code></td></tr><tr><td><code>A if đk else B</code></td><td>chọn
      <code>A</code> nếu <code>đk</code> đúng, ngược lại chọn <code>B</code>: ở đây
      chọn nửa nào của <code>d</code> để giữ</td></tr><tr><td><code>rng.uniform(d.min(),
      d.max())</code>, <code>while len(d) &gt; 1</code></td><td>số ngẫu nhiên đều
      giữa nhỏ nhất và lớn nhất của <code>d</code> / lặp tới khi <code>d</code> chỉ
      còn một phần tử</td></tr></table>'
    clear: true
    say: Hàm cắt dùng vài chỗ mới nên ta giải trước. Điều kiện trong ngoặc vuông giữ
      các phần tử thoả nó, và dòng chọn nửa cần giữ.
  - show: '<p><b>Bước 2. Tự cắt: đếm số lần cắt để cô lập một điểm</b></p><div class="code"><div>def
      so_lan_cat(x, d, rng):</div><div>    n = 0</div><div>    while len(d) &gt; 1:</div><div>        c
      = rng.uniform(d.min(), d.max())</div><div>        d = d[d &lt;= c] if x &lt;=
      c else d[d &gt; c]</div><div>        n += 1</div><div>    return n</div></div><p
      class=''small''>Hàm này chỉ để minh hoạ: nếu dãy có các giá trị trùng nhau thì
      vòng lặp không bao giờ dừng, còn thư viện có độ sâu tối đa.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước hai, ta tự viết phép cắt ngẫu nhiên: mỗi vòng chọn một điểm cắt giữa
      giá trị nhỏ nhất và lớn nhất rồi giữ nửa chứa điểm đang xét. Nên số vòng cho
      tới khi còn một điểm là độ sâu.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      x in (1, 2, 3):</code></td><td>vòng lặp: mỗi vòng <code>x</code> nhận một giá
      trị trong dãy, theo thứ tự; các dòng thụt vào là thân vòng</td><td><code>for
      i in (0, 1000):</code> chạy hai lần, i bằng 0 rồi 1000: điểm đầu là giao dịch
      thường, điểm thứ 1000 là giao dịch lạ</td></tr><tr><td><code>[so_lan_cat(d[i],
      d, rng2) for _ in range(200)]</code></td><td>danh sách sinh sẵn chạy 200 lần:
      <code>range(200)</code> là các số 0 tới 199; <code>_</code> là tên bỏ đi vì
      ta không dùng số vòng; gom 200 kết quả vào <code>cat</code></td><td></td></tr></table>'
    clear: true
    say: Vòng lặp Python cho biến nhận lần lượt từng giá trị trong dãy, và các dòng
      thụt vào là thân vòng. Danh sách sinh sẵn lặp hai trăm lần, gạch dưới là tên
      bỏ đi vì ta không dùng số vòng, và gom hai trăm kết quả vào một danh sách.
  - show: <div class="code"><div>d = X.ravel()</div><div>rng2 = np.random.default_rng(7)</div><div>for
      i in (0, 1000):</div><div>    cat = [so_lan_cat(d[i], d, rng2) for _ in range(200)]</div><div>    print(round(d[i]),
      sum(cat) / len(cat))</div></div><p><b>Làm thử — kết quả chạy thật</b></p><div
      class="code"><div>515 15.775</div><div>49881 5.075</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Làm thử, ta cô lập hai điểm, mỗi điểm hai trăm lần vì một lần chưa đủ tin.
      Điểm thường cần trung bình mười lăm phẩy tám lần cắt, điểm lạ chỉ năm phẩy không
      bảy lần.
  - show: '<p><b>Bước 3.</b> Độ sâu trung bình c(n) và điểm bất thường. Vì cây có
      thể sâu hay nông tuỳ số điểm, ta chia độ sâu cho một mức tham chiếu để điểm
      không phụ thuộc cỡ mẫu:</p>

      $$c(n) = 2\,(\ln(n-1) + \gamma) - \frac{2\,(n-1)}{n}, \qquad s(x,n) = 2^{-E[h(x)]\,/\,c(n)}$$

      <span class=''note''>ln là lôgarit tự nhiên (Python: <code>math.log</code>,
      ví dụ ln(e) = 1); γ ≈ 0,5772 là hằng số Euler–Mascheroni. c(n) là độ sâu trung
      bình của một cây cô lập n điểm, thư viện dùng đúng công thức này. Mỗi cây học
      tối đa 256 điểm, nên mức tham chiếu là c(256).</span>

      '
    focus:
    - 1
    - 2
    introduces:
    - gamma
    - log
    clear: true
    say: Bước ba là mức tham chiếu c của n, độ sâu trung bình của một cây n điểm,
      dùng lôgarit tự nhiên, và điểm bất thường s. Vì cây sâu nông tuỳ số điểm, nên
      ta chia độ sâu cho c để điểm không phụ thuộc cỡ mẫu, và mỗi cây học tối đa hai
      trăm năm mươi sáu điểm.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def
      ten(a, b):</code> … <code>return x</code></td><td>khai một hàm: <code>def</code>,
      tên, tham số trong ngoặc tròn, dấu hai chấm; các dòng thụt vào là thân hàm;
      <code>return</code> trả giá trị về chỗ gọi</td><td><code>def c(n):</code> nhận
      n, trả độ sâu tham chiếu; <code>def diem(h, n):</code> nhận độ sâu h và n, trả
      điểm</td></tr><tr><td><code>-2 ** (-h / c(n))</code></td><td><code>**</code>
      là lũy thừa: <code>2 ** x</code> là 2 mũ x; dấu trừ đứng đầu được tính sau cùng,
      nên kết quả là âm của 2 mũ x</td><td><code>-2 ** 3</code> ra <code>-8</code></td></tr></table>'
    clear: true
    say: Khai hàm Python gồm chữ khai hàm, tên, tham số và dấu hai chấm; các dòng
      thụt vào là thân hàm, và lệnh trả về đưa giá trị về chỗ gọi. Hai dấu sao là
      lũy thừa, và dấu trừ đứng đầu được tính sau cùng nên kết quả là số âm.
  - show: '<p><b>Bước 3 (tiếp). Viết lại bằng Python</b></p><div class="code"><div>import
      math</div><div>def c(n):    # độ sâu trung bình để cô lập một điểm trong n điểm</div><div>    return
      2 * (math.log(n - 1) + np.euler_gamma) - 2 * (n - 1) / n</div><div>def diem(h,
      n):     # h: độ sâu trung bình; dấu âm như scikit-learn</div><div>    return
      -2 ** (-h / c(n))</div><div>print(round(c(256), 4))</div><div>print(round(diem(c(256),
      256), 4))</div><div>print(round(diem(c(256) / 2, 256), 4))</div><div>print(round(diem(1,
      256), 4))</div></div>'
    clear: true
    say: Ta viết hai công thức thành hai hàm Python, vì như vậy thử được bằng số,
      rồi hàm điểm đặt dấu âm như thư viện học máy.
  - show: <div class="code"><div>print(round(c(256), 4))</div><div>print(round(diem(c(256),
      256), 4))</div><div>print(round(diem(c(256) / 2, 256), 4))</div><div>print(round(diem(1,
      256), 4))</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>10.2448</div><div>-0.5</div><div>-0.7071</div><div>-0.9346</div></div>
    clear: true
    say: 'Kết quả chạy thật: c của hai trăm năm mươi sáu bằng mười phẩy hai bốn bốn
      tám, nên độ sâu càng nhỏ thì điểm càng gần âm một.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>a[1000:]</code>,
      <code>a[:1000]</code></td><td>cắt lát: từ phần tử thứ 1000 trở đi (máy đếm từ
      0) / 1000 phần tử đầu</td></tr><tr><td><code>(nhan == -1).sum()</code></td><td>so
      từng phần tử với −1 ra dãy đúng hoặc sai; <code>sum</code> đếm số chỗ đúng</td></tr></table>'
    clear: true
    say: Mã huấn luyện in số điểm gắn nhãn, nên ta giải trước hai ký hiệu. Dấu hai
      chấm trong ngoặc vuông cắt phần cuối hoặc phần đầu dãy, nên tách được hai nhóm.
      So với âm một rồi cộng lại là đếm số điểm gắn âm một.
  - show: '<p><b>Bước 4. Huấn luyện rừng cô lập: 100 cây, tỉ lệ nhiễm 1%</b></p><div
      class="code"><div>from sklearn.ensemble import IsolationForest</div><div>mo_hinh
      = IsolationForest(n_estimators=100, contamination=0.01,</div><div>                          random_state=42)</div><div>mo_hinh.fit(X)</div><div>nhan
      = mo_hinh.predict(X)</div><div>print("điểm lạ bị gắn -1:", (nhan[1000:] == -1).sum(),
      "trên 10")</div><div>print("tổng số gắn -1:", (nhan == -1).sum(), "trên", len(X))</div><div>print("điểm
      thường bị gắn -1:", (nhan[:1000] == -1).sum())</div><div>print("offset_ =",
      round(mo_hinh.offset_, 4))</div></div><p class=''small''>Cài: <code>pip install
      scikit-learn==1.9.1 skl2onnx==1.20.0 onnxruntime==1.31.1</code> (bài chạy Python
      3.13, numpy 2.5.4; <code>gói==số</code> là cài đúng phiên bản đó). Số nút và
      lỗi ONNX ở bước sau phụ thuộc phiên bản. <code>random_state</code>: hạt giống
      của rừng, đặt cố định để chạy lại ra y hệt.</p>'
    focus:
    - '2.2'
    - '2.5'
    clear: true
    say: Bước bốn, ta huấn luyện rừng cô lập bằng thư viện học máy, với một trăm cây
      và tỉ lệ nhiễm một phần trăm. Rồi ta dự đoán nhãn cho chính dữ liệu huấn luyện,
      vì muốn biết máy gắn nhãn thế nào.
  - show: '<div class="code"><div>print("điểm lạ bị gắn -1:", (nhan[1000:] == -1).sum(),
      "trên 10")</div><div>print("tổng số gắn -1:", (nhan == -1).sum(), "trên", len(X))</div><div>print("điểm
