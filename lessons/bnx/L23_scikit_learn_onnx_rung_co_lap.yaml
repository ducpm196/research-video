id: L23
course: BNX
series: BNX · Backend ngân hàng mở rộng theo JD
title: 'Bài 23 — Từ scikit-learn tới ONNX Runtime: rừng cô lập cho phát hiện bất thường'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/bnx.yaml L23; audit/bnx/verify_bnx.py L23; audit/bnx/sources_l23.md
  [SKIF] scikit-learn 1.9.1 IsolationForest (tài liệu và mã nguồn, đọc 2026-11-12),
  [SKOD] hướng dẫn phát hiện ngoại lai scikit-learn, [ORTP] ONNX Runtime Python, [S2O]
  sklearn-onnx 1.20.0, [SKPERS] lưu và nạp mô hình scikit-learn, [ORTJ] ONNX Runtime
  với Java, [ORTAPI] ONNX Runtime Python (khai nhà cung cấp thực thi); chạy thật bằng
  scikit-learn 1.9.1, skl2onnx 1.20.0, onnxruntime 1.31.1, numpy 2.5.4 (audit/bnx/deps/l23/README.md);
  dữ liệu sinh với hạt giống cố định; mọi số liệu là số minh hoạ
assumes: []
objectives:
- Giải thích vì sao điểm lạ bị cô lập sau ít lần cắt hơn điểm thường
- Huấn luyện một rừng cô lập bằng scikit-learn và đọc nhãn 1, âm 1
- Xuất mô hình sang ONNX và chạy bằng ONNX Runtime, so kết quả với mô hình scikit-learn
- Nêu giới hạn của nguyên mẫu học thuật so với hệ thống vận hành thật
