      Theo quy tắc đếm, mười phẩy không chín làm tròn lên thành mười một điểm dưới
      ngưỡng dù lạ thật chỉ có mười, vì ngưỡng do ta đặt.
    introduces:
    - implies
  - show: '<p><b>Bước 5 (tiếp). Điểm trung bình của hai nhóm, quy ra độ sâu</b></p><div
      class="code"><div>diem_so = mo_hinh.score_samples(X)</div><div>for ten, s in
      (("thường", diem_so[:1000].mean()),</div><div>               ("lạ", diem_so[1000:].mean())):</div><div>    h
      = -c(mo_hinh.max_samples_) * math.log2(-s)</div><div>    print(ten, round(s,
      4), "độ sâu quy đổi", round(h, 2))</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>thường -0.4475 độ sâu quy đổi 11.88</div><div>lạ -0.8448 độ
