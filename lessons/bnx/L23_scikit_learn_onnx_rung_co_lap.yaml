      lạ chỉ hai phẩy bốn chín. Số này khác mười lăm phẩy tám ở hình trước vì hai
      thước đo khác nhau.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>open("rung.onnx",
      "wb").write(…)</code></td><td>ghi chuỗi byte vào tệp (<code>wb</code>: ghi nhị
      phân)</td></tr><tr><td><code>phien.get_inputs()[0].name</code></td><td>tên ô
      nhập đầu tiên của mô hình</td></tr><tr><td><code>nhan_onnx, diem_onnx = phien.run(None,
      {ten: x32})</code></td><td>chạy mô hình (<code>None</code>: lấy mọi đầu ra),
      đưa dữ liệu vào ô nhập tên <code>ten</code>; gán hai kết quả cho hai biến</td></tr></table>'
    clear: true
    say: Phần ONNX có ba chỗ mới nên ta giải trước. Lệnh ghi byte ra tệp, lệnh lấy
      tên ô nhập, và lệnh chạy trả hai kết quả.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>from
      m import x as y</code></td><td>lấy tên x từ thư viện m về dùng, và gọi nó là
      y trong mã này</td><td><code>from skl2onnx import to_onnx</code>, <code>import
      onnxruntime as rt</code>: lấy thư viện về, gọi <code>onnxruntime</code> là <code>rt</code></td></tr><tr><td><code>f"n
      = {x}"</code></td><td>chuỗi f: phần trong ngoặc nhọn được thay bằng giá trị
      của biểu thức; <code>{x:.1e}</code> in dạng khoa học một chữ số thập phân</td><td><code>f"sai
      khác điểm lớn nhất: {lech:.1e}"</code>: <code>.1e</code> in dạng khoa học, ví
      dụ <code>1.8e-07</code> là 1,8 nhân mười mũ âm bảy</td></tr><tr><td><code>abs(a
      - b).max()</code></td><td>hiệu từng cặp, lấy giá trị tuyệt đối rồi chọn số lớn
      nhất</td><td></td></tr></table>'
    clear: true
    say: Câu nhập lấy một tên từ thư viện về dùng, và chữ gọi là đổi tên ngắn gọn
      hơn. Chuỗi bắt đầu bằng chữ f thay phần trong ngoặc nhọn bằng giá trị của biểu
      thức đó. Hiệu từng cặp, lấy giá trị tuyệt đối, rồi chọn số lớn nhất, tức sai
      khác nhiều nhất.
  - show: '<p><b>Bước 6. Xuất sang ONNX, chạy bằng ONNX Runtime, so với mô hình trong
      Python</b></p><div class="code"><div>from skl2onnx import to_onnx</div><div>import
      onnxruntime as rt</div><div>x32 = X.astype(np.float32)</div><div>onx = to_onnx(mo_hinh,
      x32[:1],</div><div>              target_opset={"": 17, "ai.onnx.ml": 3})</div><div>open("rung.onnx",
      "wb").write(onx.SerializeToString())</div><div>phien = rt.InferenceSession("rung.onnx")</div><div>ten
      = phien.get_inputs()[0].name</div><div>nhan_onnx, diem_onnx = phien.run(None,
      {ten: x32})</div><div>print("cùng nhãn:", (nhan_onnx.ravel() == nhan).sum(),
      "trên", len(X))</div><div>lech = abs(diem_onnx.ravel() - mo_hinh.decision_function(X)).max()</div><div>print(f"sai
      khác điểm lớn nhất: {lech:.1e}")</div></div><p class=''small''>Đầu ra thứ hai
      của tệp ONNX là điểm quyết định (điểm trừ ngưỡng), nên ta so nó với decision_function.
      target_opset: phiên bản bộ phép toán (opset) của từng miền.</p>'
    focus:
    - '2.4'
    - '2.3'
    clear: true
    say: Bước sáu, ta xuất mô hình sang ONNX, ghi ra một tệp rồi nạp vào ONNX Runtime.
      Ta khai phiên bản bộ phép toán, vì bộ chuyển và thư viện chạy phải hiểu cùng
      một bản.
  - show: '<div class="code"><div>print("cùng nhãn:", (nhan_onnx.ravel() == nhan).sum(),
      "trên", len(X))</div><div>lech = abs(diem_onnx.ravel() - mo_hinh.decision_function(X)).max()</div><div>print(f"sai
      khác điểm lớn nhất: {lech:.1e}")</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>cùng nhãn: 1010 trên 1010</div><div>sai khác điểm lớn nhất:
      1.8e-07</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Kết quả chạy thật: một nghìn không trăm mười nhãn đều giống mô hình trong
      Python, điểm quyết định sai khác nhiều nhất cỡ mười mũ âm bảy. Số thực ba mươi
      hai bit làm tròn thô hơn, nên điểm sát ngưỡng vẫn có thể bị lật nhãn.'
- id: example
  kind: example
  title: Ví dụ rừng cô lập trên 1010 giao dịch, từng phép tính
  checks:
  - round(2 * (__import__('math').log(255) + 0.57722) - 2 * 255 / 256, 4) == 10.2448
  - round(alg.bnx_l23_depth_from_score(-0.8448, 256), 2) == 2.49
  - round(alg.bnx_l23_depth_from_score(-0.4475, 256), 2) == 11.88 and round(11.88
    / 2.49, 1) == 4.8
  - round(alg.bnx_l23_decision(-0.8448, -0.7353), 4) == -0.1095 and round(alg.bnx_l23_decision(-0.4475,
    -0.7353), 4) == 0.2878
  - alg.bnx_l23_expected_flags(1010, 0.01) == 10 + 1
  steps:
  - show: '<p>1000 giao dịch thường quanh 500 nghìn đồng, 10 giao dịch lạ 50 triệu
      đồng; rừng 100 cây, tỉ lệ nhiễm 1%; mỗi cây huấn luyện trên tối đa 256 điểm.
      <span class=''note''>(số minh hoạ: dữ liệu sinh ngẫu nhiên; hạt giống là số
      khởi đầu của bộ sinh số ngẫu nhiên, đặt cố định thì chạy lại ra y hệt, không
      phải dữ liệu của tổ chức nào)</span></p>

      $$① \; c(256) = 2\,(\ln 255 + 0{,}57722) - \frac{2 \cdot 255}{256} = 12{,}2370
      - 1{,}9922 = \hl{10{,}2448}$$

      '
    focus:
    - 1
    - 2
    say: Ta làm trọn một ví dụ, rừng một trăm cây. Phép tính thứ nhất, c của hai trăm
      năm mươi sáu bằng mười hai phẩy hai ba bảy không trừ một phẩy chín chín hai
      hai, bằng mười phẩy hai bốn bốn tám.
    introduces:
    - cdot
  - show: '<p>Dùng lại c(256) = 10,2448 ở phép ①. Nhóm lạ có điểm trung bình −0,8448.</p>

      $$② \; \text{độ sâu} = -c \cdot \log_2(0{,}8448) = 10{,}2448 \cdot 0{,}2433
      = \hl{2{,}49} \text{ lần cắt}$$

      '
    introduces:
    - sub
    say: Phép tính thứ hai, nhóm lạ có điểm trung bình âm không phẩy tám bốn bốn tám,
      nên độ sâu quy đổi khoảng hai phẩy bốn chín lần cắt.
  - show: '<p>Nhóm thường có điểm trung bình −0,4475.</p>

      $$③ \; \text{độ sâu} = -10{,}2448 \cdot \log_2(0{,}4475) = 10{,}2448 \cdot 1{,}1600
      = \hl{11{,}88} \text{ lần cắt}$$

      '
    say: Phép tính thứ ba, nhóm thường có độ sâu khoảng mười một phẩy tám tám, nhiều
      hơn điểm lạ khoảng bốn phẩy tám lần.
  - show: '<p>Ngưỡng của rừng: offset_ = −0,7353 (phân vị 1%). Dùng điểm ở ② và ③.</p>

      $$④ \; \text{lạ: } -0{,}8448 + 0{,}7353 = \hl{-0{,}1095} < 0 \Rightarrow -1;\quad
      \text{thường: } -0{,}4475 + 0{,}7353 = \hlg{+0{,}2878} \Rightarrow 1$$

      <span class=''note''>Toàn tập: 11 điểm dưới ngưỡng = 10 điểm lạ + 1 điểm thường
      bị gắn oan.</span>

      '
    clear: true
    say: Phép tính thứ tư, với ngưỡng âm không phẩy bảy ba năm ba, nhóm lạ có điểm
      quyết định âm nên nhãn âm một, còn nhóm thường dương nên nhãn một.
  - show: '<p>Xuất ONNX, chạy trên cả 1010 điểm.</p>

      $$⑤ \; \text{cùng nhãn với mô hình Python: } \hlg{1010 / 1010}; \quad \text{sai
      khác điểm lớn nhất} = \hl{1{,}8 \cdot 10^{-7}}$$

      '
    say: Phép tính thứ năm, xuất ONNX rồi chạy trên cả một nghìn không trăm mười điểm
      cho một nghìn không trăm mười nhãn giống mô hình trong Python.
