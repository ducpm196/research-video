  - {sentence: "Hỏi gọi từ Java được không, thì trả lời ONNX Runtime có thư viện cho Java, nhưng bài này chưa chạy thử mã Java.", reason: "ASR chép “Hỏi gọi từ Java được không thì trả lời ONNX-Tai có thư viện cho Java, nhưng bài này chưa chạy thử mã Java.” (0.958): “runtime” đọc theo luật lexicon (lexicon_vi.BNX.yaml: “răn-tai”), ASR viết “tai” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Phiên bản bộ phép toán của ONNX gọi là bản phép toán, mỗi miền có bản riêng, và bộ chuyển với thư viện chạy phải hiểu cùng một bản.", reason: "ASR chép “Phiên bản bộ phép toán của NNX gọi là bản phép toán, mỗi miền có bản riêng và bộ chuyển với thư viện chạy phải hiểu cùng một bản.” (0.984): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
- id: hook
  kind: hook
  title: 'Sáng thứ hai: 1010 giao dịch, chưa ai gán nhãn, máy chỉ ra giao dịch lạ
    thế nào?'
  checks:
  - 1000 + 10 == 1010
  - alg.bnx_l23_expected_flags(1010, 0.01) == 11
  steps:
  - show: '<p>Mỗi sáng, bộ phận rủi ro nhận <b>1010</b> giao dịch chuyển tiền của
      hôm qua: <b>1000</b> giao dịch quanh <b>500 nghìn</b> đồng và <b>10</b> giao
      dịch ở mức <b>50 triệu</b> đồng.</p>

      <div class="box key">Không giao dịch nào có nhãn “gian lận” hay “bình thường”.
      Làm sao để máy <b>chỉ ra giao dịch lạ</b> cho người xét, mà không cần ai gán
      nhãn trước? Và mô hình huấn luyện bằng Python chạy ra sao khi đem đi vận hành?</div>

      <span class=''note''>(số minh hoạ: dữ liệu sinh ngẫu nhiên, hạt giống cố định,
      không phải của tổ chức nào)</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    - 3
    say: Chào bạn, mỗi sáng bộ phận rủi ro nhận một nghìn không trăm mười giao dịch
      chuyển tiền của hôm qua. Một nghìn giao dịch quanh năm trăm nghìn đồng, và mười
      giao dịch ở mức năm mươi triệu đồng. Không giao dịch nào có nhãn gian lận hay
      bình thường. Làm sao để máy chỉ ra giao dịch lạ cho người xét, mà không cần
      ai gán nhãn trước? Và mô hình huấn luyện bằng Python chạy ra sao khi đem đi
      vận hành? Mọi số liệu trong bài là số minh hoạ, dữ liệu sinh ngẫu nhiên với
      hạt giống cố định.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>phần trả lời trong bài</th></tr><tr><td>vì
      sao điểm lạ nổi lên mà không cần nhãn</td><td>cắt ngẫu nhiên: điểm lạ bị cô
      lập sau ít lần cắt</td></tr><tr><td>huấn luyện và đọc kết quả thế nào</td><td>rừng
      cô lập trong thư viện học máy: nhãn 1 và âm 1</td></tr><tr><td>đem sang môi
      trường vận hành ra sao</td><td>xuất tệp ONNX, chạy bằng ONNX Runtime, so với
      mô hình trong Python</td></tr><tr><td>mô hình KHÔNG làm được gì</td><td>không
      biết gian lận; tỉ lệ nhiễm là giả định; chưa đo độ trễ; dữ liệu mẫu chỉ có một
      cột</td></tr></table>'
    clear: true
    say: Bài này trả lời bốn câu hỏi. Vì sao điểm lạ nổi lên mà không cần nhãn. Huấn
      luyện và đọc kết quả thế nào. Đem sang môi trường vận hành ra sao. Và điều quan
      trọng nhất, mô hình không làm được gì.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_l23_expected_flags(1010, 0.01) == 11 and int(0.01 * (1010 - 1)) + 1 ==
    11 and round(0.01 * 1009, 2) == 10.09
  - '[x for x in (1, 2, 3, 10) if x <= 5] == [1, 2, 3] and [x for x in (1, 2, 3, 10)
    if x > 5] == [10]'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Trung bình và độ lệch chuẩn</td><td>trung bình là mức ở giữa; độ lệch chuẩn
      cho biết các giá trị tản ra quanh nó bao xa; dữ liệu bài rải hình chuông (phân
      phối chuẩn)</td><td>quanh 500 nghìn, độ lệch chuẩn 50 nghìn: hầu hết nằm trong
      khoảng 400 tới 600</td></tr><tr><td>② Cắt đôi một dãy số</td><td>chọn một điểm
      cắt rồi chia dãy thành nửa nhỏ hơn và nửa lớn hơn</td><td>cắt dãy 1, 2, 3, 10
      tại 5: nửa trái 1, 2, 3; nửa phải 10</td></tr><tr><td>③ Phân vị</td><td>mức
      mà một tỉ lệ cho trước của các giá trị nằm dưới nó; số giá trị dưới ngưỡng:
      phần nguyên của p × (n−1), cộng một</td><td>1% của 1010 giá trị: 11 giá trị
      dưới ngưỡng (tính ở bước sau)</td></tr><tr><td>④ Mô hình và nhãn</td><td>mô
      hình: bản ghi cách tính điểm, học từ dữ liệu; nhãn thật: đáp án do người gán
      (ta không có); nhãn của mô hình: 1 (thường) hoặc âm 1 (lạ)</td><td>mô hình không
      nói “gian lận”, chỉ nói “lạ”</td></tr></table>'
    say: 'Trước hết ta cần hiểu bốn điều. Trung bình là mức ở giữa, còn độ lệch chuẩn
      cho biết các giá trị tản ra quanh nó bao xa. Dữ liệu của bài rải theo hình chuông
      quanh trung bình, gọi là phân phối chuẩn. Cắt đôi một dãy số là chọn một điểm
      cắt rồi chia dãy thành nửa nhỏ hơn và nửa lớn hơn. Phân vị là mức mà một tỉ
      lệ cho trước của các giá trị nằm dưới nó. Quy tắc đếm của bài: với n giá trị
      và tỉ lệ p, số giá trị dưới ngưỡng là phần nguyên của p nhân n trừ một, rồi
      cộng một. Mô hình là bản ghi cách tính điểm, học từ dữ liệu bằng bước huấn luyện.
      Nhãn thật là đáp án do người gán, ta không có. Nhãn của mô hình là kết quả máy
      trả ra, một cho điểm thường, hoặc âm một cho điểm lạ. Mô hình không nói gian
      lận, chỉ nói lạ.'
  - show: '$$p \cdot (n-1) = 0{,}01 \cdot (1010 - 1) = 10{,}09 \text{ nên phần nguyên
      là } 10, \text{ cộng một } = \hl{11}$$

      <span class=''note''>Điều kiện của quy tắc: p × (n−1) không tròn và các giá
      trị không trùng nhau. Làm thử: dãy 1, 2, 3, 10 cắt tại 5 thì 10 đứng một mình
      ở nửa phải sau đúng một lần cắt; còn 1, 2, 3 cần thêm cắt nữa mới tách rời nhau.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Một ví dụ số cho phân vị. Với một phần trăm của một nghìn không trăm mười
      giá trị, ta nhân không phẩy không một với một nghìn không trăm lẻ chín, được
      mười phẩy không chín. Phần nguyên là mười, cộng một thì có mười một giá trị
      dưới ngưỡng, và ta sẽ gặp lại quy tắc này khi đặt ngưỡng. Làm thử với dãy một,
      hai, ba, mười. Cắt tại năm thì số mười đứng một mình sau đúng một lần cắt, còn
      một, hai, ba cần thêm lần cắt nữa mới tách rời nhau.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã từ ngữ và ký hiệu
  checks:
  - alg.bnx_l23_score(0, 256) == -1.0
  - alg.bnx_l23_score(alg.bnx_l23_c(256), 256) == -0.5
  steps:
  - show: <table class='t'><tr><th>từ (tên trên màn hình)</th><th>nghĩa</th></tr><tr><td>Isolation
      Forest, rừng cô lập</td><td>rừng gồm nhiều cây cắt ngẫu nhiên; điểm càng nhanh
      bị cô lập càng lạ</td></tr><tr><td>n_estimators</td><td>số cây trong rừng</td></tr><tr><td>contamination,
      tỉ lệ nhiễm</td><td>tỉ lệ điểm lạ mà ta ĐẶT GIẢ ĐỊNH cho dữ liệu huấn luyện;
      dùng để chọn ngưỡng; số thực phải thuộc (0; 0,5]; mặc định là 'auto'</td></tr><tr><td>fit,
      predict</td><td>huấn luyện trên dữ liệu; gắn nhãn 1 hoặc -1 cho từng điểm</td></tr><tr><td>score_samples,
      offset_, decision_function</td><td>điểm bất thường (càng âm càng lạ); ngưỡng;
      điểm trừ ngưỡng, âm thì nhãn -1</td></tr><tr><td>ONNX, ONNX Runtime</td><td>định
      dạng tệp mô hình; thư viện đọc tệp ấy và chạy mô hình</td></tr></table>
    say: Bảng này giải mã các từ của bài. Rừng cô lập là rừng gồm nhiều cây cắt ngẫu
      nhiên, điểm càng nhanh bị cô lập càng lạ. Số cây là số cây trong rừng. Tỉ lệ
      nhiễm là tỉ lệ điểm lạ mà ta đặt giả định cho dữ liệu huấn luyện, dùng để chọn
      ngưỡng. Số thực phải thuộc khoảng từ không tới không phẩy năm, và nếu không
      đặt thì giá trị mặc định là tự động. Hàm huấn luyện học từ dữ liệu, hàm dự đoán
      gắn nhãn một hoặc âm một. Hàm tính điểm cho điểm bất thường, càng âm càng lạ.
      Điểm trừ ngưỡng là điểm quyết định, âm thì nhãn âm một. Cuối cùng, ONNX là định
      dạng tệp mô hình, còn ONNX Runtime là thư viện đọc tệp ấy và chạy mô hình.
  - show: '<table class=''t''><tr><th>từ (tên trên màn hình)</th><th>nghĩa</th></tr><tr><td>opset,
      miền (domain)</td><td>opset là số phiên bản của bộ phép toán ONNX; mỗi miền
      có phiên bản riêng, miền ai.onnx.ml chứa phép toán cây của học máy; bộ chuyển
      và thư viện chạy phải hiểu cùng phiên bản</td></tr><tr><td>InferenceSession,
      run</td><td>phiên chạy: nạp tệp một lần, rồi gọi run nhiều lần trên dữ liệu
      số thực 32 bit</td></tr></table>'
    clear: true
    say: Hai từ nữa dùng khi xuất và chạy ONNX. Phiên bản bộ phép toán của ONNX gọi
      là bản phép toán, mỗi miền có bản riêng, và bộ chuyển với thư viện chạy phải
      hiểu cùng một bản. Phiên chạy nạp tệp một lần rồi gọi chạy nhiều lần trên dữ
      liệu số thực ba mươi hai bit.
  - show: '<table class=''t''><tr><th>ký hiệu</th><th>nghĩa</th></tr><tr><td>h(x)</td><td>số
