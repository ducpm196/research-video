- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_l20_atoi('12a') == (0, True)
  - alg.bnx_l20_leak(1000, True) == 1 and alg.bnx_l20_leak(1000, False) == 1001
  - alg.bnx_l20_leak(1000, False) == 1 + 1000
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới, lúc mới dựng).</b> Bỏ qua lỗi
      bằng dấu gạch dưới: <code>so, _ := strconv.Atoi(...)</code>.

      Chuỗi không phải số thì <b class="red">so = 0</b> và chương trình chạy tiếp
      với dữ liệu sai, không ai báo.

      <br><span class="note">Cách chữa: nhận lỗi vào một biến, kiểm lỗi khác rỗng
      rồi xử lý hoặc trả lên trên.</span></div>

      '
    clear: true
