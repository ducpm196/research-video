    - 1
    - 1
    - - 2
      - 3
    pause: 120
    say: Bây giờ tới phần bạn tự làm, cần cài Go. Hãy viết chương trình chạy năm luồng
      nhẹ, mỗi luồng cộng một trăm vào bộ đếm có khoá, rồi in bộ đếm. Sau đó dùng
      kênh đệm hai, thử gửi ba giá trị không chờ, nhận một rồi gửi lại, hãy dừng video
      và tự viết.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>bo dem: 500</div><div>gui
      1 xong, dang chua 1</div><div>gui 2 xong, dang chua 2</div><div>gui 3 phai cho
      ben nhan</div><div>nhan 1</div><div>gui 3 xong, dang chua 2</div></div><p class="note">Chấm
      bằng Git Bash: <code>bash labs/cham.sh BNX L20 mau.sh</code> — in <b>ĐÚNG</b>
