  - show: '<p><b>main.go: đếm bằng bộ đếm nguyên tử và bằng kênh</b></p><div class="code"><div>func
      main() {</div><div>  var nhom sync.WaitGroup</div><div>  var a atomic.Int64</div><div>  ch
      := make(chan int, 1000)</div><div>  for i := 0; i &lt; 1000; i++ {</div><div>    nhom.Add(1)</div><div>    go
      func() {</div><div>      defer nhom.Done()</div><div>      a.Add(1)</div><div>      ch
