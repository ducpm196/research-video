scenes:
- id: hook
  kind: hook
  title: 'Một nghìn yêu cầu cùng cộng một bộ đếm: ra 1000 hay ít hơn?'
  checks:
  - alg.bnx_l20_locked(1000) == 1000
  - alg.bnx_l20_range(1000) == (1, 1000)
  steps:
  - show: '<p>Dịch vụ ngân hàng đếm số yêu cầu đã xử lý. <b>Một nghìn</b> yêu cầu
      tới cùng lúc, mỗi yêu cầu cộng 1 vào <b>một bộ đếm chung</b> (số minh hoạ).</p>

      <div class="box key">Kỳ vọng: $1000 \cdot 1 = 1000$. Bỏ khoá, chạy thật thì
      bộ đếm <b>có lần thấp hơn 1000</b>, mỗi lần chạy một khác, và không lần nào
      chắc chắn đúng.

      Vì sao, chữa thế nào, và khi số việc chạy cùng lúc tăng gấp trăm lần thì bộ
      nhớ ra sao?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, hãy tưởng tượng dịch vụ của ngân hàng đếm số yêu cầu đã xử lý.
      Một nghìn yêu cầu tới cùng lúc, mỗi yêu cầu cộng một vào một bộ đếm chung, với
      số minh hoạ. Ta kỳ vọng đúng một nghìn, nhưng bỏ khoá thì có lần thấp hơn. Vì
      sao, và chữa thế nào?
    introduces:
    - cdot
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_l20_interleave(['A', 'B', 'A', 'B']) == 1
  - alg.bnx_l20_interleave(['A', 'A', 'B', 'B']) == 2
  - alg.bnx_l20_lost(['A', 'B', 'A', 'B']) == 1
  - alg.bnx_l20_rut(500, 200) == (300, None)
  - alg.bnx_l20_route('GET', '/suc-khoe')[0] == 200
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      biến dùng chung</td><td>một ô nhớ mà nhiều việc cùng đọc và ghi được</td><td>bộ
      đếm = 0; hai việc cùng cộng 1</td></tr><tr><td>② đọc rồi ghi</td><td>câu lệnh
      tăng một gồm <b>hai bước</b>: đọc giá trị, rồi ghi giá trị cộng 1</td><td>A
      đọc 0, B đọc 0, A ghi 1, B ghi 1 → bộ đếm <b>1</b> thay vì 2; A làm trọn rồi
      mới tới B thì ra 2</td></tr><tr><td>③ hàm trả nhiều giá trị</td><td>một hàm
      trả cả kết quả lẫn lỗi; lỗi rỗng (nil) nghĩa là không có lỗi</td><td>rút 200
      từ số dư 500 trả (300, không lỗi)</td></tr><tr><td>④ yêu cầu và trả lời HTTP</td><td>yêu
      cầu có phương thức và đường dẫn; trả lời có mã trạng thái và thân</td><td>GET
      /suc-khoe trả mã 200</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều, biến dùng chung là một ô nhớ mà nhiều việc
      cùng đọc và ghi được. Lệnh tăng một gồm hai bước, đọc rồi ghi, nên nếu A và
      B cùng đọc không rồi cùng ghi một, bộ đếm chỉ là một thay vì hai. Hàm có thể
      trả về cả kết quả lẫn lỗi, và yêu cầu HTTP có phương thức và đường dẫn.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l20_wg(1000, 1000) == 0
  - alg.bnx_l20_accept(3, 4) == (3, 4)
  steps:
  - show: '<table class=''t''><tr><th>tên trong Go</th><th>nghĩa</th></tr><tr><td>go
      f()</td><td>chạy hàm f ở một <b>luồng nhẹ</b> (goroutine) riêng; chương trình
      không chờ nó</td></tr><tr><td>sync.WaitGroup</td><td><b>nhóm chờ</b>: <code>Add</code>
      cộng số việc, <code>Done</code> trừ một, <code>Wait</code> chờ tới khi về 0</td></tr><tr><td>sync.Mutex</td><td><b>khoá</b>:
      giữa <code>Lock</code> và <code>Unlock</code> một lúc chỉ một luồng nhẹ được
      vào</td></tr><tr><td>chan int, ch &lt;- v, &lt;-ch</td><td><b>kênh</b> truyền
      số nguyên: <code>make(chan int, 3)</code> có đệm 3, <code>make(chan int)</code>
      không đệm; gửi v vào kênh; nhận một giá trị</td></tr><tr><td>select … default</td><td>thử
      gửi hay nhận <b>mà không bị treo</b>: không làm được ngay thì chạy nhánh <code>default</code></td></tr><tr><td>error,
      nil</td><td>lỗi là một <b>giá trị</b> được trả về; <code>nil</code> nghĩa là
      không có lỗi</td></tr><tr><td>go run -race</td><td>chạy kèm <b>trình phát hiện
      tranh chấp dữ liệu</b></td></tr><tr><td>net/http, Fiber</td><td>gói chuẩn dựng
      dịch vụ HTTP; Fiber là bộ khung web thêm cách viết tuyến</td></tr></table>'
    introduces:
    - bnx_goroutine
    - bnx_waitgroup
    - bnx_mutex
    - bnx_fiber
    - bnx_tranh_chap
    say: Bảng này giải mã các tên trên màn hình. Lệnh đầu chạy một hàm ở luồng nhẹ
      riêng, và nhóm chờ chờ tới khi số việc về không. Khoá cho một lúc chỉ một luồng
      nhẹ vào. Kênh truyền giá trị, con số trong ngoặc là sức chứa của đệm, và thử
      gửi không treo dùng nhánh mặc định. Lỗi là một giá trị được trả về.
  - show: '<table class=''t''><tr><th>cú pháp Go</th><th>nghĩa</th></tr><tr><td><code>x
      := 5</code></td><td>khai báo biến mới <code>x</code> và gán 5 (kiểu tự suy ra)</td></tr><tr><td><code>defer
      nhom.Done()</code></td><td>hoãn lệnh này tới lúc hàm kết thúc, dù kết thúc bình
      thường hay không</td></tr><tr><td><code>func() { … }()</code>, <code>for _,
      v := range ds</code></td><td>hàm không tên gọi ngay tại chỗ / lặp qua từng phần
      tử (hoặc nhận lần lượt từ kênh tới khi kênh đóng), <code>_</code> là chỗ bỏ
      qua giá trị không cần</td></tr><tr><td><code>type TaiKhoan struct {…}</code>,
      <code>&amp;x</code></td><td>cấu trúc: gom nhiều trường thành một kiểu / địa
      chỉ của biến <code>x</code></td></tr><tr><td><code>go run main.go</code>, <code>2&gt;&amp;1
      | grep … | uniq</code></td><td>biên dịch và chạy một tệp Go (cần cài Go) / nối
      đầu ra qua ống: lọc dòng có chữ cần tìm, bỏ dòng lặp liền nhau</td></tr></table>'
    introduces:
    - bnx_go_defer
    clear: true
    say: Dấu hai chấm bằng khai báo biến mới, và lệnh hoãn chạy lúc hàm kết thúc.
      Hàm không tên gọi tại chỗ, còn vòng lặp đi qua từng phần tử hoặc nhận từ kênh
      tới khi kênh đóng. Cấu trúc gom trường, rồi tới lệnh chạy chương trình Go.
  - show: <table class='t'><tr><th>cú pháp Go</th><th>nghĩa</th></tr><tr><td><code>package
      main</code>, <code>import (…)</code></td><td>chương trình chạy được của Go mở
      đầu bằng <code>package main</code>; <code>import</code> nạp các gói dùng tới,
      như <code>fmt</code> để in</td></tr><tr><td><code>fmt.Println(a, b)</code></td><td>in
      các giá trị a, b ra màn hình, cách nhau một dấu cách</td></tr><tr><td><code>if
      err != nil { … }</code></td><td>nếu lỗi khác rỗng thì làm khối bên trong; <code>!=</code>
      nghĩa là khác</td></tr><tr><td><code>[]int{200, 400}</code>, <code>len(ch)</code></td><td>danh
      sách số nguyên gồm 200 và 400 / số giá trị đang nằm trong kênh <code>ch</code></td></tr><tr><td><code>continue</code>,
      <code>uint64(n)</code></td><td>bỏ phần còn lại của vòng này, sang vòng sau /
      đổi n sang số nguyên không âm 64 bit</td></tr><tr><td><code>chan struct{}</code></td><td>kênh
      chỉ để báo hiệu, không mang dữ liệu</td></tr></table>
    clear: true
    say: Còn một bảng cú pháp Go nền, chương trình mở đầu bằng khai báo gói và nạp
      các gói cần dùng. Dấu khác so sánh lỗi với rỗng, ngoặc vuông kèm kiểu là một
      danh sách, và lệnh bỏ qua sang vòng sau dùng khi gặp lỗi.
