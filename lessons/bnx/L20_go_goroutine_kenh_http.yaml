  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>r
      *http.Request</code>, <code>c *fiber.Ctx</code></td><td>dấu <code>*</code> trước
      kiểu là <b>con trỏ</b>: địa chỉ của một giá trị kiểu đó, nên hàm dùng chính
      giá trị gốc thay vì chép</td></tr><tr><td><code>w.Header().Set("Content-Type",
      "application/json")</code></td><td>đặt <b>tiêu đề</b> (dòng thông tin kèm trả
      lời): <code>Content-Type</code> báo thân trả lời là JSON</td></tr><tr><td><code>fmt.Fprint(w,
      `{"trang_thai":"ok"}`)</code></td><td>ghi chuỗi vào <code>w</code>, nơi ghi
      trả lời; dấu nháy ngược bao một chuỗi giữ nguyên mọi ký tự, kể cả dấu nháy kép</td></tr></table>'
    clear: true
    say: Trước khi đọc dịch vụ, ta cần ba chỗ. Dấu sao trước kiểu là con trỏ, tức
      địa chỉ của giá trị gốc. Tiêu đề kiểu nội dung báo thân trả lời là JSON, và
      dấu nháy ngược bao một chuỗi giữ nguyên mọi ký tự.
  - show: '<p><b>main.go (trích): hàm xử lý, đăng ký tuyến, mở cổng</b></p><div class="code"><div>package
      main</div><div>import ("fmt"; "io"; "net"; "net/http"; "strings")</div><div>func
      sucKhoe(w http.ResponseWriter, r *http.Request) {</div><div>  w.Header().Set("Content-Type",
      "application/json")</div><div>  fmt.Fprint(w, `{"trang_thai":"ok"}`)</div><div>}</div><div>func
      main() {</div><div>  mux := http.NewServeMux()</div><div>  mux.HandleFunc("GET
      /suc-khoe", sucKhoe)</div><div>  ln, _ := net.Listen("tcp", "127.0.0.1:0")</div><div>  go
      http.Serve(ln, mux)</div><div>  goc := "http://" + ln.Addr().String()</div></div><p
      class=''note''><code>127.0.0.1</code>: địa chỉ của chính máy này; cổng là số
      hiệu một cửa mạng, cổng 0 nhờ máy chọn cửa trống; <code>tcp</code> là kiểu nối
      bên dưới HTTP.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư là dịch vụ HTTP nhỏ. Hàm xử lý ghi JSON, tuyến chỉ đăng
      ký cho phương thức đọc, và ta mở một cổng trên chính máy mình rồi chạy máy chủ
      ở luồng nhẹ riêng.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>strings.Cut(yc,
      " ")</code></td><td>cắt chuỗi <code>yc</code> ở dấu cách đầu tiên: phần đứng
      trước và phần đứng sau</td></tr><tr><td><code>http.DefaultClient.Do(req)</code></td><td>gửi
      yêu cầu <code>req</code> và nhận trả lời <code>tl</code></td></tr><tr><td><code>io.ReadAll(tl.Body)</code>,
      <code>tl.Body.Close()</code></td><td>đọc hết thân trả lời / đóng thân lại khi
      xong</td></tr></table>'
    clear: true
    say: Vòng lặp gọi dùng ba hàm mới, hàm cắt tách phương thức khỏi đường dẫn, hàm
      gửi trả lời về, và hàm đọc lấy hết thân trả lời rồi đóng lại.
  - show: '<p><b>main.go (hết): gọi ba yêu cầu; cùng với dòng mở cổng ở trên, ba chỗ
      lược kiểm lỗi cho vừa khung</b></p><div class="code"><div>  for _, yc := range
      []string{"GET /suc-khoe", "POST /suc-khoe", "GET /khong-co"} {</div><div>    pt,
      duong, _ := strings.Cut(yc, " ")</div><div>    req, _ := http.NewRequest(pt,
      goc+duong, nil)</div><div>    tl, err := http.DefaultClient.Do(req)</div><div>    if
      err != nil {</div><div>      fmt.Println("loi goi:", err)</div><div>      return</div><div>    }</div><div>    than,
      _ := io.ReadAll(tl.Body); tl.Body.Close()</div><div>    fmt.Println(yc, tl.StatusCode,
      strings.TrimSpace(string(than)))</div><div>  }</div><div>}</div></div>'
    clear: true
    say: Ta gọi ba yêu cầu bằng một vòng lặp, và lược kiểm lỗi ở ba chỗ để chương
      trình vừa khung hình.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>GET /suc-khoe 200
      {"trang_thai":"ok"}</div><div>POST /suc-khoe 405 Method Not Allowed</div><div>GET
      /khong-co 404 404 page not found</div></div>
    clear: true
    say: Đúng tuyến cho hai trăm cùng JSON, sai phương thức cho bốn trăm linh năm,
      đường dẫn lạ cho bốn trăm linh bốn.
  - show: '<p><b>main.go của Fiber v2.52.16 (trích): hai tuyến</b></p><div class="code"><div>package
      main</div><div>import ("fmt"; "io"; "net"; "net/http"; "github.com/gofiber/fiber/v2")</div><div>func
      main() {</div><div>  app := fiber.New(fiber.Config{DisableStartupMessage: true})</div><div>  app.Get("/suc-khoe",
      func(c *fiber.Ctx) error {</div><div>    return c.JSON(fiber.Map{"trang_thai":
      "ok"})</div><div>  })</div><div>  app.Get("/tai-khoan/:so", func(c *fiber.Ctx)
      error {</div><div>    return c.JSON(fiber.Map{"so": c.Params("so")})</div><div>  })</div><div>  ln,
      _ := net.Listen("tcp", "127.0.0.1:0")</div><div>  go app.Listener(ln)</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ năm là cùng việc ấy bằng bộ khung web. Mỗi tuyến chỉ là một
      lời gọi, và tuyến thứ hai đọc tham số ngay trong đường dẫn.
  - show: '<p><b>main.go (hết): gọi hai đường dẫn</b></p><div class="code"><div>  goc
      := "http://" + ln.Addr().String()</div><div>  for _, duong := range []string{"/suc-khoe",
      "/tai-khoan/001"} {</div><div>    tl, err := http.Get(goc + duong)</div><div>    if
      err != nil {</div><div>      fmt.Println("loi goi:", err)</div><div>      return</div><div>    }</div><div>    than,
      _ := io.ReadAll(tl.Body); tl.Body.Close()</div><div>    fmt.Println(duong, tl.StatusCode,
      string(than))</div><div>  }</div><div>  app.Shutdown()</div><div>}</div></div>'
    clear: true
    say: Ta gọi hai đường dẫn bằng một vòng lặp rồi tắt máy chủ.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>/suc-khoe 200 {"trang_thai":"ok"}</div><div>/tai-khoan/001
      200 {"so":"001"}</div></div>
    clear: true
    say: Cả hai trả hai trăm, và tuyến thứ hai trả đúng tham số không không một đọc
      từ đường dẫn.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: nguyên tử và kênh, không dùng khoá'
  checks:
  - alg.bnx_l20_locked(1000) == 1000 and alg.bnx_l20_locked(1000, 1) == 1000 * 1
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>close(ch)</code></td><td>đóng
      kênh: báo sẽ không gửi thêm giá trị nào</td><td>đóng sau khi mọi luồng đã gửi
      xong</td></tr><tr><td><code>for v := range ch { tong += v }</code></td><td>nhận
      lần lượt từng giá trị trong kênh tới khi kênh đã đóng và cạn; <code>tong +=
      v</code> cộng v vào tong</td><td>kênh có 1000 số 1 thì tong = 1000</td></tr></table>'
    clear: true
    say: Mã kiểm dùng hai chỗ mới nên ta giải trước. Đóng kênh báo rằng sẽ không gửi
      thêm giá trị nào nữa. Vòng lặp trên kênh nhận từng giá trị tới khi kênh đã đóng
      và cạn, rồi cộng vào tổng.
  - show: '<p><b>main.go: đếm bằng bộ đếm nguyên tử và bằng kênh</b></p><div class="code"><div>package
      main</div><div>import ("fmt"; "sync"; "sync/atomic")</div><div>func main() {</div><div>  var
      nhom sync.WaitGroup</div><div>  var a atomic.Int64</div><div>  ch := make(chan
      int, 1000)</div><div>  for i := 0; i &lt; 1000; i++ {</div><div>    nhom.Add(1)</div><div>    go
      func() {</div><div>      defer nhom.Done()</div></div>'
    focus:
    - 1
    - 1
    - 2
    introduces:
    - bnx_nguyen_tu
    clear: true
    say: Kiểm bằng đường khác, không dùng khoá. Một nghìn luồng nhẹ vừa cộng vào bộ
      đếm nguyên tử, loại bộ đếm mà phần cứng cộng trọn một lần hoặc không cộng gì,
      vừa gửi một vào kênh có đệm. Hai đường độc lập nên so được với nhau.
  - show: '<p><b>main.go (hết): cộng các số trong kênh bằng một luồng</b></p><div
      class="code"><div>      a.Add(1)</div><div>      ch &lt;- 1</div><div>    }()</div><div>  }</div><div>  nhom.Wait()</div><div>  close(ch)</div><div>  tong
      := 0</div><div>  for v := range ch { tong += v }</div><div>  fmt.Println("atomic:",
      a.Load(), "- qua kenh:", tong)</div><div>}</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>atomic: 1000 - qua kenh: 1000</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Rồi một luồng cộng các số trong kênh. Kết quả chạy thật: cả hai đường đều
      ra một nghìn, nên khớp với bộ đếm có khoá.'
- id: quymo
  kind: example
  title: 'Khi số việc chạy cùng lúc tăng ×10 và ×100: luồng nhẹ rẻ nhưng không miễn
    phí'
  checks:
  - '[alg.bnx_l20_trieu(n, k) for n, k in ((1000, 8), (10000, 7), (100000, 7))] ==
    [8, 70, 700]'
  - alg.bnx_l20_trieu(100000, 7) // alg.bnx_l20_trieu(10000, 7) == 10 and alg.bnx_l20_trieu(10000,
    7) // alg.bnx_l20_trieu(1000, 7) == 10
  - 100_000 // 1_000 == 100 and 10_000 // 1_000 == 10
  steps:
  - show: '<p><b>main.go (trích): cho n luồng nhẹ cùng chờ trên một kênh</b></p><div
      class="code"><div>package main</div><div>import ("fmt"; "runtime"; "sync")</div><div>func
      chay(n int) {</div><div>  var truoc, sau runtime.MemStats</div><div>  runtime.ReadMemStats(&amp;truoc)</div><div>  cho
      := make(chan struct{})</div><div>  var xong sync.WaitGroup</div><div>  for i
      := 0; i &lt; n; i++ {</div><div>    xong.Add(1)</div><div>    go func() { defer
      xong.Done(); &lt;-cho }()</div><div>  }</div></div><p class=''note''><b>ngăn
      xếp</b>: vùng nhớ riêng của mỗi luồng, giữ biến cục bộ và dấu vết các hàm đang
      gọi; <code>StackInuse</code> là số byte ngăn xếp đang dùng.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta đo bộ nhớ khi số việc cùng chờ tăng dần, cụ thể là ngăn xếp, vùng nhớ
      riêng của mỗi luồng. Hàm cho n luồng nhẹ cùng chờ trên một kênh, nên cả n luồng
      đều sống.
  - show: '<p><b>main.go (hết): đo ngăn xếp mỗi luồng ở 1 000, 10 000 và 100 000</b></p><div
      class="code"><div>  runtime.ReadMemStats(&amp;sau)</div><div>  kb := (sau.StackInuse
      - truoc.StackInuse) / uint64(n) / 1000</div><div>  song := runtime.NumGoroutine()
      - 1</div><div>  fmt.Println(n, "luong:", song, "con song, moi luong giu", kb,
      "nghin byte")</div><div>  close(cho)</div><div>  xong.Wait()</div><div>}</div><div>func
      main() {</div><div>  for _, n := range []int{1000, 10000, 100000} {</div><div>    chay(n)</div><div>  }</div><div>}</div></div>'
    clear: true
    say: Ta in hiệu của vùng ngăn xếp trước và sau, chia cho số luồng, ở ba cỡ là
      một nghìn, mười nghìn và một trăm nghìn.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1000 luong: 1000
      con song, moi luong giu 8 nghin byte</div><div>10000 luong: 10000 con song,
      moi luong giu 7 nghin byte</div><div>100000 luong: 100000 con song, moi luong
      giu 7 nghin byte</div></div>'
    clear: true
    say: 'Kết quả chạy thật: mỗi luồng giữ tám nghìn byte ở cỡ một nghìn, rồi bảy
      nghìn byte ở hai cỡ lớn hơn.'
  - show: <table class='t'><tr><th>số luồng nhẹ cùng chờ</th><th>còn sống</th><th>mỗi
      luồng giữ (nghìn byte, đo)</th><th>tổng ngăn xếp ≈ (triệu byte, tính n × số
      đo)</th></tr><tr><td><span style='white-space:nowrap'>1 000 (×1)</span></td><td>1
      000</td><td>8</td><td>8</td></tr><tr><td><span style='white-space:nowrap'>10
      000 (×10)</span></td><td>10 000</td><td>7</td><td>70</td></tr><tr><td><span
      style='white-space:nowrap'>100 000 (×100)</span></td><td>100 000</td><td>7</td><td>700</td></tr></table><p
      class='note'>Số đo trên máy này (Go 1.25.5, Windows), làm tròn xuống nghìn byte;
      đổi theo phiên bản Go và hệ điều hành. Chỉ tính ngăn xếp, chưa tính dữ liệu
      của từng việc.</p>
    focus:
    - 1
    - 2
    clear: true
    say: Bảng cho thấy luồng nhẹ rẻ nhưng không miễn phí. Mỗi luồng giữ khoảng bảy
      tới tám nghìn byte ngăn xếp, nên bộ nhớ tăng thẳng theo số luồng, và một trăm
      nghìn việc cùng chờ tốn cỡ bảy trăm triệu byte.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th></tr><tr><td>mỗi
      yêu cầu một luồng nhẹ mới, không giới hạn</td><td>đơn giản, không yêu cầu nào
      bị từ chối ngay</td><td>bộ nhớ tăng thẳng theo số yêu cầu đang chờ, không có
      trần</td></tr><tr><td>nhóm luồng nhẹ cố định đọc việc từ kênh có đệm</td><td>bộ
      nhớ có trần; việc dư xếp hàng</td><td>việc ở cuối chờ lâu; đệm đầy thì bên gửi
      bị chặn</td></tr><tr><td>kênh đệm đầy thì từ chối</td><td>bên gọi biết ngay
      để thử lại; bộ nhớ có trần</td><td>một phần yêu cầu bị từ chối</td></tr></table>
    clear: true
    say: Người làm nghề phải chọn khi số việc tăng. Mỗi yêu cầu một luồng nhẹ thì
      đơn giản nhưng bộ nhớ không có trần. Nhóm luồng cố định có trần bộ nhớ nhưng
      việc ở cuối phải chờ, và đệm đầy thì từ chối ngay, đổi lại một phần yêu cầu
      bị từ chối.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_l20_atoi('12a') == (0, True)
  - alg.bnx_l20_leak(1000, True) == 1 and alg.bnx_l20_leak(1000, False) == 1001
  - alg.bnx_l20_leak(1000, False) == 1 + 1000
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Cho rằng biến đếm dùng
      chung thì cứ cộng là đúng, vì một lần chạy ra 1000; hoặc cho rằng kênh thay
      được khoá trong mọi trường hợp.

      <br><span class="note">Đúng: không khoá thì kết quả đổi theo mỗi lần chạy; một
      lần ra đúng chưa chứng minh gì. Kênh để truyền giá trị; trạng thái dùng chung
      vẫn cần khoá hoặc bộ đếm nguyên tử.</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là cho rằng biến đếm dùng chung cứ cộng là đúng
      vì một lần chạy ra một nghìn. Không khoá thì kết quả đổi theo mỗi lần chạy,
      còn kênh để truyền giá trị chứ không thay được khoá.
  - show: '<p><b>Lỗi 2 (người đã đi làm, lúc mới dựng): đổi chuỗi 12a thành số, hai
      cách</b></p><div class="code"><div>package main</div><div>import ("fmt"; "strconv")</div><div>func
      main() {</div><div>  so, _ := strconv.Atoi("12a")</div><div>  fmt.Println("bo
      qua loi, so doc duoc:", so)</div><div>  so, err := strconv.Atoi("12a")</div><div>  fmt.Println("kiem
      loi:", so, err)</div><div>}</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>bo
      qua loi, so doc duoc: 0</div><div>kiem loi: 0 strconv.Atoi: parsing "12a": invalid
      syntax</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là bỏ qua giá trị lỗi bằng dấu gạch dưới.
      Số đọc được là không mà không ai biết, còn kiểm lỗi thì thấy ngay chuỗi không
      phải số.
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>time.Sleep(200
      * time.Millisecond)</code></td><td>tạm dừng chương trình 200 mili giây để các
      luồng nhẹ kịp chạy</td><td>chờ 0,2 giây rồi mới đếm</td></tr><tr><td><code>runtime.NumGoroutine()</code></td><td>số
      luồng nhẹ đang sống, kể cả luồng chạy hàm chính</td><td>1 nghĩa là chỉ còn hàm
      chính</td></tr></table>
    clear: true
    say: Lệnh ngủ tạm dừng chương trình hai trăm mili giây để các luồng nhẹ kịp chạy.
      Hàm này cho biết số luồng nhẹ đang sống, kể cả luồng của hàm chính.
  - show: '<p><b>main.go (trích): một nghìn yêu cầu, bên nhận đã bỏ đi</b></p><div
      class="code"><div>package main</div><div>import ("fmt"; "runtime"; "time")</div><div>func
      thu(dem int) int {</div><div>  for i := 0; i &lt; 1000; i++ {</div><div>    kq
      := make(chan int, dem)</div><div>    go func() { kq &lt;- i }() // ben nhan
      da bo di, khong ai nhan</div><div>  }</div><div>  time.Sleep(200 * time.Millisecond)</div><div>  return
      runtime.NumGoroutine()</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ ba lộ ra khi tải tăng: bên nhận bỏ đi vì hết hạn chờ. Chương trình
      mô phỏng một nghìn yêu cầu, mỗi yêu cầu một luồng nhẹ gửi vào kênh mà không
      ai nhận.'
  - show: '<p><b>main.go (hết): thử kênh đệm 1, rồi kênh không đệm</b></p><div class="code"><div>func
      main() {</div><div>  fmt.Println("kenh dem 1, con song:", thu(1))</div><div>  fmt.Println("kenh
      khong dem, con song:", thu(0))</div><div>}</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>kenh dem 1, con song: 1</div><div>kenh khong dem, con song:
      1001</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Kênh đệm một thì mọi luồng gửi xong, còn một luồng là hàm chính. Kênh không
      đệm thì một nghìn luồng nhẹ kẹt mãi, nên còn một nghìn không trăm linh một luồng,
      và cách chữa là cho bên gửi luôn có đường thoát.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l20_accept(5, 8) == (5, 6)
  - alg.bnx_l20_range(3) == (1, 3)
  - alg.bnx_l20_interleave(['A', 'A', 'B', 'B', 'C', 'C']) == 3
  - alg.bnx_l20_thru(2, 50) == 40
  - (50 - alg.bnx_l20_thru(2, 50)) * 60 == 600
  - alg.bnx_l20_wait(20, alg.bnx_l20_thru(2, 50)) == 0.5
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Kênh
      có đệm 5, gửi liền 8 giá trị, chưa ai nhận. Mấy giá trị vào được, và giá trị
      thứ mấy phải chờ?</td></tr><tr><td>2</td><td>3 luồng nhẹ, mỗi luồng cộng 1 vào
      bộ đếm 0, không khoá (đọc rồi ghi). Bộ đếm cuối nhỏ nhất và lớn nhất là bao
      nhiêu? Một lần chạy ra đúng 3 có chứng minh không có tranh chấp không?</td></tr><tr><td>3</td><td>Quyết
      định (số minh hoạ): 2 luồng nhẹ làm việc, mỗi việc 50 ms, tới 50 việc/giây.
      Chọn: mỗi yêu cầu một luồng nhẹ mới không giới hạn, kênh đệm 20 và bên gửi chờ
      khi đầy, hay kênh đệm 20 và đầy thì từ chối?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, kênh có đệm năm, gửi liền tám giá
      trị mà chưa ai nhận, thì mấy giá trị vào được? Câu hai, ba luồng nhẹ cùng cộng
      một vào bộ đếm không, không khoá, thì kết quả nhỏ nhất và lớn nhất là bao nhiêu?
      Câu ba, chọn cách xử lý nào khi tới năm mươi việc mỗi giây? Hãy dừng video.
  - show: '<p>Câu 1: đệm 5 nhận 5 giá trị, giá trị kế tiếp phải chờ.</p>

      $$5 \text{ giá trị vào được}; \qquad 5 + 1 = \hlg{6} \text{: bên gửi bị chặn
      ở giá trị thứ 6}$$

      '
    say: 'Đáp án câu một: đệm năm nhận được năm giá trị, và bên gửi bị chặn ngay ở
      giá trị thứ sáu.'
    clear: true
  - show: '<p>Câu 2: xen kẽ xấu nhất làm mất 2 lần cộng.</p>

      $$\text{nhỏ nhất } \hlg{1}, \quad \text{lớn nhất } \hlg{3}; \qquad \text{ra
      đúng } 3 \text{ chỉ là một cách xen kẽ trong số nhiều cách}$$

      '
    focus:
    - 1
    - 2
    say: 'Đáp án câu hai: ba luồng cùng đọc không rồi ghi một thì nhỏ nhất là một,
      lớn nhất là ba. Một lần ra đúng ba không chứng minh gì, vì đó chỉ là một cách
      xen kẽ.'
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>mỗi
      yêu cầu một luồng nhẹ mới, không giới hạn</td><td>không yêu cầu nào bị từ chối
      ngay</td><td>làm được $2 \cdot 1000 : 50 = 40$ việc/giây, tới 50: dư 10 việc/giây,
      sau 60 giây có 600 việc dở, mỗi việc giữ một luồng nhẹ</td></tr><tr><td>kênh
      đệm 20, bên gửi chờ khi đầy</td><td>việc được nhận chờ nhiều nhất $20 : 40 =
      0{,}5$ giây; số việc dở có trần</td><td>bên gửi bị chặn, độ trễ lan ngược ra
      các yêu cầu tới</td></tr><tr><td>kênh đệm 20, đầy thì từ chối</td><td>bên gọi
      biết ngay để thử lại sau; bộ nhớ có trần</td><td>khoảng 10 việc/giây bị từ chối</td></tr></table>'
    say: 'Đáp án câu ba: hai luồng làm bốn mươi việc mỗi giây mà tới năm mươi, nên
      mỗi giây dư mười việc, và sau một phút có sáu trăm việc dở. Kênh đệm hai mươi
      cho việc chờ tối đa nửa giây, nhưng độ trễ lan ngược, nên khách không chờ lâu
      được thì từ chối sớm.'
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: bộ đếm có khoá và kênh có đệm 2'
  steps:
  - show: '<p><b>Đề</b> (cần cài Go: tải ở <code>go.dev/dl</code>, kiểm bằng <code>go
      version</code>; viết trong <code>mau.sh</code>: <code>cat &gt; main.go &lt;&lt;''GO''</code>
      ghi mọi dòng tới chữ <code>GO</code> kế tiếp vào tệp <code>main.go</code>, rồi
      <code>go run main.go</code> chạy nó):</p>

      <ol><li><b>5 luồng nhẹ</b> mỗi luồng cộng <b>100</b> vào bộ đếm trong <code>sync.Mutex</code>,
      chờ bằng <code>WaitGroup</code>; in <code>bo dem: …</code></li><li>kênh đệm
      <b>2</b>: với v = 1, 2, 3 thử gửi không chờ bằng <code>select … default</code>,
      in <code>gui v xong, dang chua …</code> hoặc <code>gui v phai cho ben nhan</code>;
      nhận một giá trị, rồi thử gửi lại 3</li></ol>

      <p class="note">Khuôn tệp và chữ in nằm ở <code>de.md</code>; số liệu khác ví
      dụ trong bài.</p>

      '
