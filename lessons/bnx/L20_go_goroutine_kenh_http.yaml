- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ luồng nhẹ tới dịch vụ HTTP'
  checks:
  - alg.bnx_l20_wg(3, 2) == 1 and alg.bnx_l20_wg(1000, 1000) == 0
  - alg.bnx_l20_range(3) == (1, 3)
  - alg.bnx_l20_locked(1000) == 1000
  - alg.bnx_l20_race_exit() == 66
  - alg.bnx_l20_accept(2, 3) == (2, 3)
  - alg.bnx_l20_rut(500, 200) == (300, None) and alg.bnx_l20_rut(300, 400)[0] == 300
  - alg.bnx_l20_route('POST', '/suc-khoe')[0] == 405 and alg.bnx_l20_route('GET',
    '/khong-co')[0] == 404
  steps:
  - show: '<p><b>Bước 1.</b> Lệnh <code>go f()</code> chạy <code>f</code> ở luồng
      nhẹ riêng rồi trở về ngay, nên hàm chính có thể kết thúc <b>trước</b> các việc.

      Vì vậy ta dùng nhóm chờ: <code>Add(1)</code> trước mỗi việc, <code>Done()</code>
      khi việc xong, <code>Wait()</code> chờ tới khi số việc về 0.</p>

      <p>Làm thử: 3 lần Add, 2 lần Done.</p>

      $$3 - 2 = \hl{1} \neq 0 \;\Rightarrow\; \text{Wait vẫn chờ}; \qquad 1000 - 1000
      = 0 \;\Rightarrow\; \text{Wait trở về}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, lệnh chạy ở luồng nhẹ trở về ngay nên hàm chính có thể kết thúc
      trước các việc, nên ta dùng nhóm chờ. Cộng một trước mỗi việc, trừ một khi xong,
      và lệnh chờ chỉ trở về khi số việc về không.
    introduces:
    - implies
  - show: '<p><b>Bước 2.</b> Hai luồng nhẹ cùng ghi một biến mà không phối hợp là
      <b>tranh chấp dữ liệu</b>.

      Vì tăng một gồm đọc rồi ghi, nên một lần cộng có thể bị ghi đè, và bộ đếm cuối
      nằm giữa 1 và số luồng.</p>

      <p>Làm thử: 3 luồng cùng cộng 1 vào 0, không khoá.</p>

      $$\text{nhỏ nhất } \hl{1}, \quad \text{lớn nhất } 3; \qquad \text{chỉ khi xen
      kẽ vừa vặn mới ra } 3$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước hai, hai luồng cùng ghi một biến mà không phối hợp gọi là tranh chấp
      dữ liệu. Vì tăng một gồm đọc rồi ghi nên một lần cộng có thể bị ghi đè, và với
      ba luồng, bộ đếm cuối nằm giữa một và ba.
  - show: '<p><b>Bước 3.</b> Khoá biến đọc-rồi-ghi thành một khối: giữa <code>Lock</code>
      và <code>Unlock</code> một lúc chỉ một luồng nhẹ, nên không lần cộng nào bị
      mất.</p>

      <p>Làm thử: 1000 luồng nhẹ, mỗi luồng cộng 1 trong khoá.</p>

      $$1000 \cdot 1 = \hlg{1000} \quad \text{(mọi lần chạy)}$$

      <span class=''note''>Đổi lại, các luồng xếp hàng qua khoá, nên đoạn nằm trong
      khoá càng ngắn càng tốt.</span>

      '
    focus:
    - 1
    - 3
    clear: true
    say: Bước ba, khoá làm đọc rồi ghi thành một khối, vì giữa lệnh khoá và lệnh mở
      một lúc chỉ một luồng được vào. Nên một nghìn luồng cộng một ra đúng một nghìn
      ở mọi lần chạy, và đoạn nằm trong khoá càng ngắn càng tốt.
  - show: '<p><b>Bước 4.</b> Trình phát hiện tranh chấp: chạy <code>go run -race</code>.
      Nó báo khi hai luồng nhẹ truy cập cùng một biến, ít nhất một lần là ghi, mà
      không phối hợp.

      Nó chỉ thấy tranh chấp trên đường mã <b>đã chạy</b>, và làm chương trình chậm
      hơn.</p>

      <div class="box key">Khi thấy tranh chấp, nó in cảnh báo rồi thoát với mã <b>66</b>
      (mặc định). Một lần in đúng kết quả chưa chứng minh là không có tranh chấp.</div>

      <span class=''note''>Trên máy chạy bài này (Windows), cờ <code>-race</code>
      cần bật cgo (cho Go gọi mã C) và có trình biên dịch C tên gcc; máy khác có thể
      khác.</span>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước bốn, trình phát hiện tranh chấp bắt lỗi ấy. Nó chỉ thấy trên đường mã
      đã chạy nên một lần in đúng chưa chứng minh gì, và khi thấy nó thoát với mã
      sáu mươi sáu.
  - show: '<p><b>Bước 5.</b> Kênh truyền giá trị giữa các luồng nhẹ. <b>Không đệm</b>:
      bên gửi chờ tới khi có bên nhận. <b>Có đệm n</b>: gửi xong ngay nếu đệm chưa
      đầy, đầy thì chờ.</p>

      <p>Làm thử: đệm 2, gửi liền 3 giá trị, chưa ai nhận.</p>

      $$2 \text{ giá trị vào đệm}; \qquad 2 + 1 = \hl{3} \text{: giá trị thứ 3 phải
      chờ}$$

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước năm, kênh truyền giá trị giữa các luồng. Kênh không đệm thì bên gửi
      chờ tới khi có bên nhận, còn kênh đệm n thì gửi xong ngay nếu chưa đầy. Với
      đệm hai và ba giá trị gửi liền, hai giá trị vào đệm nên giá trị thứ ba phải
      chờ.
  - show: '<p><b>Bước 6.</b> Cách báo lỗi thông thường: hàm trả <b>thêm một giá trị
      lỗi</b>, bên gọi phải tự kiểm. Lỗi rỗng là thành công. Bỏ qua lỗi thì chương
      trình chạy tiếp với giá trị không.</p>

      <p>Làm thử: tài khoản 500, rút 200 rồi rút 400.</p>

      $$500 - 200 = 300; \qquad 400 > 300 \;\Rightarrow\; \text{lỗi, số dư vẫn } \hl{300}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước sáu, hàm trả thêm một giá trị lỗi và bên gọi phải tự kiểm, vì bỏ qua
      lỗi thì chương trình chạy tiếp với giá trị không. Rút hai trăm từ năm trăm còn
      ba trăm, và rút bốn trăm thì có lỗi, nên số dư vẫn là ba trăm.
  - show: <p><b>Bước 7.</b> Dịch vụ HTTP nhỏ đăng ký tuyến <code>GET /suc-khoe</code>
      với một hàm xử lý. Gói chuẩn tự trả 405 khi sai phương thức và 404 khi không
      có đường dẫn. Mẫu tuyến có phương thức như <code>GET /suc-khoe</code> cần Go
      từ phiên bản 1.22.</p><table class='t'><tr><th>yêu cầu</th><th>mã</th><th>thân</th></tr><tr><td>GET
      /suc-khoe</td><td>200</td><td><code>{"trang_thai":"ok"}</code></td></tr><tr><td>POST
      /suc-khoe</td><td>405</td><td>Method Not Allowed</td></tr><tr><td>GET /khong-co</td><td>404</td><td>404
      page not found</td></tr></table>
    focus:
    - 1
    - - '2.2'
      - '2.3'
    clear: true
    say: Bước bảy, dịch vụ HTTP nhỏ đăng ký tuyến đọc đường dẫn kiểm sức khoẻ. Đúng
      tuyến thì trả mã hai trăm, sai phương thức thì gói chuẩn tự trả bốn trăm linh
      năm vì tuyến chỉ cho phương thức đọc, còn không có đường dẫn thì trả bốn trăm
      linh bốn.
  - show: '<table class=''t''><tr><th>việc</th><th>gói chuẩn net/http</th><th>bộ khung
      Fiber</th></tr><tr><td>đăng ký tuyến</td><td><code>mux.HandleFunc("GET /suc-khoe",
      f)</code></td><td><code>app.Get("/suc-khoe", f)</code></td></tr><tr><td>tham
      số trong đường dẫn</td><td>(bài không so sánh)</td><td><code>/tai-khoan/:so</code>,
      đọc bằng <code>c.Params("so")</code></td></tr><tr><td>trả JSON</td><td>tự đặt
      tiêu đề và ghi thân (chương trình trên)</td><td><code>c.JSON(fiber.Map{…})</code></td></tr><tr><td>nền
      bên dưới</td><td>thư viện chuẩn</td><td>dựng trên <b>fasthttp</b> (nhà phát
      triển Fiber nêu)</td></tr></table><div class="box warn">Bài dùng Fiber <b>v2.52.16</b>;
      nhà phát triển ghi ở bản v2: không còn được bảo trì tích cực. Để chạy thử: <code>go
      mod init vidu</code> (tạo mô-đun mới tên vidu), rồi <code>go get github.com/gofiber/fiber/v2@v2.52.16</code>
      (tải thư viện đúng phiên bản).</div>'
    clear: true
    say: Bước tám, bộ khung web thêm tham số ngay trong đường dẫn và lệnh trả JSON
      gọn, vì với gói chuẩn ta phải tự đặt tiêu đề và ghi thân.
- id: example
  kind: example
  title: Ví dụ chạy thật bằng Go, từng phép tính
  checks:
  - alg.bnx_l20_rut(500, 200) == (300, None) and alg.bnx_l20_rut(300, 400)[0] == 300
  - alg.bnx_l20_locked(1000) == 1000 and alg.bnx_l20_wg(1000, 1000) == 0
  - alg.bnx_l20_race_exit() == 66
  - alg.bnx_l20_accept(3, 4) == (3, 4)
  - alg.bnx_l20_route('GET', '/suc-khoe')[0] == 200 and alg.bnx_l20_route('POST',
    '/suc-khoe')[0] == 405 and alg.bnx_l20_route('GET', '/khong-co')[0] == 404
  - alg.bnx_l20_fiber_route('/suc-khoe')[0] == 200 and alg.bnx_l20_fiber_route('/tai-khoan/001')[0]
    == 200
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>func
      rut(tk TaiKhoan, tien int) (TaiKhoan, error) {</code></td><td>khai hàm: <code>func</code>,
      tên, tham số (tên rồi tới kiểu), rồi trong ngoặc tròn là các kiểu hàm trả về;
      ở đây trả <b>hai</b> giá trị</td><td>rút <code>tien</code> từ <code>tk</code>;
      trả (tài khoản mới, lỗi)</td></tr><tr><td><code>tk := TaiKhoan{So: "001", SoDu:
      500}</code></td><td>tạo một giá trị kiểu <code>TaiKhoan</code>, ghi từng trường
      theo dạng tên: giá trị; dấu chấm chọn trường, <code>tk.SoDu</code> là 500</td><td><code>tk.So</code>
      là <code>"001"</code></td></tr><tr><td><code>tk.SoDu -= tien</code>, <code>dem++</code></td><td><code>-=</code>:
      trừ một giá trị khỏi biến; <code>dem++</code>: tăng <code>dem</code> thêm 1</td><td>500
      - 200 còn 300</td></tr></table>'
    clear: true
    say: Khai hàm Go gồm tên, tham số viết tên rồi kiểu, và các kiểu trả về trong
      ngoặc tròn, ở đây là hai giá trị. Tạo giá trị cấu trúc bằng cách ghi từng trường
      theo dạng tên và giá trị, rồi dấu chấm chọn một trường. Dấu trừ bằng trừ một
      giá trị khỏi biến, còn hai dấu cộng tăng biến thêm một.
  - show: '<p><b>main.go (trích): cấu trúc tài khoản và hàm trả lỗi</b></p><div class="code"><div>package
      main</div><div>import ("errors"; "fmt")</div><div>type TaiKhoan struct{ So string;
      SoDu int }</div><div>func rut(tk TaiKhoan, tien int) (TaiKhoan, error) {</div><div>  if
      tien &gt; tk.SoDu {</div><div>    return tk, errors.New("khong du so du")</div><div>  }</div><div>  tk.SoDu
      -= tien</div><div>  return tk, nil</div><div>}</div></div>'
    clear: true
    say: Phép tính thứ nhất là chương trình có cấu trúc tài khoản và hàm rút, hàm
      này trả thêm một giá trị lỗi khi không đủ tiền.
  - show: '<p><b>main.go (tiếp): rút 200 rồi rút 400</b></p><div class="code"><div>func
      main() {</div><div>  tk := TaiKhoan{So: "001", SoDu: 500}</div><div>  for _,
      tien := range []int{200, 400} {</div><div>    moi, err := rut(tk, tien)</div><div>    if
      err != nil {</div><div>      fmt.Println("rut", tien, "loi:", err, "- so du
      van", tk.SoDu)</div><div>      continue</div><div>    }</div><div>    tk = moi</div><div>    fmt.Println("rut",
      tien, "xong, con", tk.SoDu)</div><div>  }</div><div>}</div></div>'
    clear: true
    say: Vòng lặp rút hai trăm rồi bốn trăm, và mỗi lần bên gọi kiểm giá trị lỗi trước
      khi nhận số dư mới.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>rut 200 xong, con
      300</div><div>rut 400 loi: khong du so du - so du van 300</div></div>'
    clear: true
    say: Lần đầu còn ba trăm, lần hai báo lỗi và số dư vẫn ba trăm, vì bên gọi đã
      kiểm lỗi.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      i := 0; i &lt; 1000; i++ {</code></td><td>vòng đếm, không có ngoặc tròn: khai
      <code>i := 0</code>; còn lặp khi <code>i &lt; 1000</code>; sau mỗi vòng <code>i++</code></td><td>chạy
      1000 vòng, i từ 0 tới 999</td></tr></table>'
    clear: true
    say: 'Vòng đếm của Go có ba phần cách nhau bằng chấm phẩy: khai biến đếm, điều
      kiện còn lặp, và bước sau mỗi vòng.'
  - show: '<p><b>main.go (trích): một nghìn luồng nhẹ cùng cộng, có khoá</b></p><div
      class="code"><div>package main</div><div>import ("fmt"; "sync")</div><div>func
      main() {</div><div>  var nhom sync.WaitGroup</div><div>  var khoa sync.Mutex</div><div>  dem
      := 0</div><div>  for i := 0; i &lt; 1000; i++ {</div><div>    nhom.Add(1)</div><div>    go
      func() {</div></div>'
    clear: true
    say: Phép tính thứ hai là một nghìn luồng nhẹ cùng cộng một vào bộ đếm, mỗi lần
      cộng nằm trong khoá, và nhóm chờ đếm số việc.
  - show: '<p><b>main.go (hết): chờ cả nhóm rồi in</b></p><div class="code"><div>      defer
      nhom.Done()</div><div>      khoa.Lock()</div><div>      dem++</div><div>      khoa.Unlock()</div><div>    }()</div><div>  }</div><div>  nhom.Wait()</div><div>  fmt.Println("bo
      dem:", dem)</div><div>}</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>bo
      dem: 1000</div></div>'
    clear: true
    say: Chờ cả nhóm xong rồi in, kết quả chạy thật là đúng một nghìn.
  - show: '<p><b>Bỏ khoá: không còn dòng var khoa sync.Mutex, trong luồng nhẹ chỉ
      còn dem++</b></p><div class="code"><div>func main() {</div><div>  var nhom sync.WaitGroup</div><div>  dem
      := 0</div><div>  for i := 0; i &lt; 1000; i++ {</div><div>    nhom.Add(1)</div><div>    go
      func() {</div><div>      defer nhom.Done()</div><div>      dem++</div><div>    }()</div><div>  }</div><div>  nhom.Wait()</div><div>  fmt.Println("bo
      dem:", dem)</div></div><p class=''note''>Chỉ bỏ <code>Lock</code>/<code>Unlock</code>
      mà giữ dòng khai báo thì Go báo <code>declared and not used: khoa</code> và
      không chạy.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bỏ khoá thì xoá cả dòng khai báo khoá, kẻo Go báo biến khai mà không dùng.
      Khi đó trong luồng nhẹ chỉ còn lệnh tăng một.
  - show: '<p><b>Chạy kèm trình phát hiện, lọc lấy hai dòng cần xem</b></p><div class="code"><div>go
      run -race main.go 2&gt;&amp;1 | grep -E "DATA RACE|exit status" | uniq</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>WARNING: DATA RACE</div><div>exit
      status 66</div></div>'
    clear: true
    say: Chạy kèm trình phát hiện, nó báo có tranh chấp dữ liệu rồi thoát với mã sáu
      mươi sáu.
  - show: '<p><b>main.go (trích): thử gửi vào kênh, không chịu treo</b></p><div class="code"><div>package
      main</div><div>import "fmt"</div><div>func thuGui(ch chan int, v int) {</div><div>  select
