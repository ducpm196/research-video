- id: recap
  kind: recap
  title: Chuỗi logic, góc phỏng vấn & tư duy cần mang theo
  checks:
  - alg.bnx_l20_locked(1000) == 1000
  - alg.bnx_l20_leak(1000, False) == 1001
  steps:
  - show: '<div class=''chain''><span class=''n''>go f(): luồng nhẹ + WaitGroup</span><span
      class=''a''>→</span><span class=''n''>ghi chung không khoá → tranh chấp</span><span
      class=''a''>→</span><span class=''n''>Mutex / atomic / kênh</span><span class=''a''>→</span><span
      class=''n''>go run -race: chỉ thấy đường đã chạy</span><span class=''a''>→</span><span
      class=''n''>lỗi là giá trị phải kiểm</span><span class=''a''>→</span><span class=''n''>luồng
      nhẹ rẻ, không miễn phí</span></div>'
    say: 'Tổng kết: ghi chung không khoá gây tranh chấp, và khoá hay bộ đếm nguyên
      tử hay kênh chữa được. Trình phát hiện chỉ thấy đường đã chạy, lỗi là giá trị
      phải kiểm, và luồng nhẹ rẻ nhưng không miễn phí.'
  - show: '<table class=''t''><tr><th>Nếu bị hỏi về dòng này trên CV</th><th>ý trả
      lời một dòng</th></tr><tr><td>Goroutine khác luồng hệ điều hành thế nào?</td><td>nhẹ
      hơn luồng do hệ điều hành lập lịch, vì bộ chạy của Go lập lịch và bắt đầu bằng
      ngăn xếp nhỏ; vẫn tốn bộ nhớ và vẫn rò rỉ được (rò rỉ: việc kẹt mãi, không ai
      dọn)</td></tr><tr><td>Khi nào dùng Mutex, khi nào dùng channel?</td><td>channel
      để truyền giá trị giữa các luồng nhẹ; trạng thái dùng chung cần khoá hoặc bộ
      đếm nguyên tử; kiểm bằng -race</td></tr><tr><td>Fiber thêm gì so với net/http?</td><td>tuyến
      có tham số, trả JSON gọn; dựng trên fasthttp; ghi ở bản v2: không còn bảo trì
      tích cực</td></tr></table><span class=''note''>Trả lời bằng cơ chế; không nêu
      số liệu của tổ chức thật, không nói đã làm ở quy mô nào.</span>'
    focus:
    - - 1
    clear: true
    say: 'Người phỏng vấn hay hỏi ba câu: luồng nhẹ khác luồng hệ điều hành thế nào,
      khi nào dùng khoá và khi nào dùng kênh, và bộ khung web thêm gì, hãy trả lời
      bằng cơ chế.'
  - show: '<div class=''box key''><b>Tư duy:</b> với mỗi đoạn mã đồng thời, hỏi ba
      điều: biến nào được <b>nhiều việc cùng ghi</b>, việc nào <b>có đường thoát</b>
      khi bên kia bỏ đi, và khi số việc tăng gấp trăm lần thì <b>bộ nhớ và hàng đợi</b>
      ra sao.</div>

      <p class=''small''>Bài sau: một hệ cho vay số, từ trạng thái hồ sơ, chấm điểm,
      ký số tới chống gian lận.</p>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    forward_ref: true
    say: 'Điều cần mang theo: với mỗi đoạn mã đồng thời, hỏi biến nào được nhiều việc
      cùng ghi, và việc nào có đường thoát khi bên kia bỏ đi. Rồi hỏi bộ nhớ ra sao
      khi việc tăng gấp trăm lần. Bài sau là một hệ cho vay số.'
