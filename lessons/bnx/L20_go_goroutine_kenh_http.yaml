scenes:
- id: hook
  kind: hook
  title: 'Một nghìn yêu cầu cùng cộng một bộ đếm: ra 1000 hay ít hơn?'
  checks:
  - alg.bnx_l20_locked(1000) == 1000
  - alg.bnx_l20_range(1000) == (1, 1000)
  steps:
  - show: '<p>Dịch vụ ngân hàng đếm số yêu cầu đã xử lý. <b>Một nghìn</b> yêu cầu
      tới cùng lúc, mỗi yêu cầu cộng 1 vào <b>một bộ đếm chung</b> (số minh hoạ).</p>

      <div class="box key">Kỳ vọng: $1000 \cdot 1 = 1000$. Bỏ khoá, chạy thật thì
      bộ đếm <b>thường thấp hơn 1000</b> và mỗi lần chạy một khác.

      Vì sao, và chữa thế nào?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, hãy tưởng tượng dịch vụ của ngân hàng đếm số yêu cầu đã xử lý.
      Một nghìn yêu cầu tới cùng lúc, mỗi yêu cầu cộng một vào một bộ đếm chung, với
      số minh hoạ. Ta kỳ vọng bộ đếm ra đúng một nghìn. Nhưng nếu bỏ khoá, chạy thật
      thì kết quả thường thấp hơn, và mỗi lần chạy một khác. Vậy vì sao, và chữa thế
      nào?
    introduces:
    - cdot
  - show: '<p>Ngôn ngữ trên màn hình: <b>Go (Golang)</b>, kèm bộ khung web <b>Fiber
      (Go)</b> (hai dòng trên CV).</p><table class=''t''><tr><th>câu hỏi</th><th>bài
      này trả lời</th></tr><tr><td>chạy nhiều việc cùng lúc rồi chờ xong hết</td><td><b>luồng
      nhẹ</b> (goroutine) và <b>nhóm chờ</b> (WaitGroup)</td></tr><tr><td>hai việc
      cùng ghi một biến thì sao</td><td><b>tranh chấp dữ liệu</b>; khoá (Mutex); trình
      phát hiện tranh chấp (<code>-race</code>)</td></tr><tr><td>truyền dữ liệu giữa
      các việc</td><td><b>kênh</b> (channel) không đệm và có đệm</td></tr><tr><td>dựng
      dịch vụ HTTP</td><td>gói chuẩn <code>net/http</code>, rồi bộ khung <b>Fiber</b>
      thêm gì</td></tr></table>'
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    say: Ngôn ngữ ta dùng hôm nay là ngôn ngữ thứ hai trên hồ sơ, tên hiện trên màn
      hình, cùng một bộ khung web. Câu một, làm sao chạy nhiều việc cùng lúc rồi chờ
      xong hết, bằng luồng nhẹ và nhóm chờ. Câu hai, hai việc cùng ghi một biến thì
      sao, và khoá cùng trình phát hiện tranh chấp giúp thế nào. Câu ba, truyền dữ
      liệu giữa các việc bằng kênh có đệm và không đệm. Câu bốn, dựng dịch vụ HTTP
      bằng gói chuẩn, rồi xem bộ khung web thêm được gì.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_l20_interleave(['A', 'B', 'A', 'B']) == 1
  - alg.bnx_l20_interleave(['A', 'A', 'B', 'B']) == 2
  - alg.bnx_l20_lost(['A', 'B', 'A', 'B']) == 1
  - alg.bnx_l20_rut(500, 200) == (300, None)
  - alg.bnx_l20_route('GET', '/suc-khoe')[0] == 200
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      biến dùng chung</td><td>một ô nhớ mà nhiều việc cùng đọc và ghi được</td><td>bộ
      đếm = 0; hai việc cùng cộng 1</td></tr><tr><td>② đọc rồi ghi</td><td>câu lệnh
      tăng một gồm <b>hai bước</b>: đọc giá trị, rồi ghi giá trị cộng 1</td><td>đọc
      0, rồi ghi 1</td></tr><tr><td>③ hàm trả nhiều giá trị</td><td>một hàm trả cả
      kết quả lẫn lỗi; lỗi rỗng (nil) nghĩa là không có lỗi</td><td>rút 200 từ số
      dư 500 trả (300, không lỗi)</td></tr><tr><td>④ yêu cầu và trả lời HTTP</td><td>yêu
      cầu có phương thức và đường dẫn; trả lời có mã trạng thái và thân</td><td>GET
      /suc-khoe trả mã 200</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều, thứ nhất, biến dùng chung là một ô nhớ mà
      nhiều việc cùng đọc và ghi được. Thứ hai, câu lệnh tăng một thật ra gồm hai
      bước, đọc giá trị rồi ghi giá trị cộng một. Thứ ba, một hàm có thể trả về cả
      kết quả lẫn lỗi, và lỗi rỗng nghĩa là không có lỗi. Thứ tư, yêu cầu HTTP có
      phương thức và đường dẫn, còn trả lời có mã trạng thái và thân.
  - show: '<p>Làm thử: hai việc A và B cùng cộng 1 vào bộ đếm đang là 0, xen kẽ từng
      bước.</p>

      $$A \text{ đọc } 0, \; B \text{ đọc } 0, \; A \text{ ghi } 1, \; B \text{ ghi
      } 1 \;\Rightarrow\; \hl{1} \text{ thay vì } 2$$

      <span class=''note''>Nếu A làm trọn rồi mới tới B: đọc 0, ghi 1, đọc 1, ghi
      2, ra 2.</span>

      '
    focus:
    - - 1
    - 2
    - 3
    say: Làm thử ngay, hai việc A và B cùng cộng một vào bộ đếm đang là không, và
      chúng xen kẽ từng bước. A đọc không, B cũng đọc không, rồi A ghi một, B ghi
      một, nên bộ đếm chỉ là một thay vì hai. Còn nếu A làm trọn rồi mới tới B thì
      ra hai, vì B đọc được số một.
    introduces:
    - implies
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l20_wg(1000, 1000) == 0
  - alg.bnx_l20_accept(3, 4) == (3, 4)
  steps:
  - show: '<table class=''t''><tr><th>tên trong Go</th><th>nghĩa</th></tr><tr><td>go
      f()</td><td>chạy hàm f ở một <b>luồng nhẹ</b> (goroutine) riêng; chương trình
      không chờ nó</td></tr><tr><td>sync.WaitGroup</td><td><b>nhóm chờ</b>: <code>Add</code>
      cộng số việc, <code>Done</code> trừ một, <code>Wait</code> chờ tới khi về 0</td></tr><tr><td>sync.Mutex</td><td><b>khoá</b>:
      giữa <code>Lock</code> và <code>Unlock</code> một lúc chỉ một luồng nhẹ được
      vào</td></tr><tr><td>chan int</td><td><b>kênh</b> truyền số nguyên; <code>make(chan
      int, 3)</code> có đệm 3, <code>make(chan int)</code> không đệm</td></tr><tr><td>ch
      &lt;- v  và  &lt;-ch</td><td>gửi v vào kênh; nhận một giá trị từ kênh</td></tr><tr><td>error,
      nil</td><td>lỗi là một <b>giá trị</b> được trả về; <code>nil</code> nghĩa là
      không có lỗi</td></tr><tr><td>go run -race</td><td>chạy kèm <b>trình phát hiện
      tranh chấp dữ liệu</b></td></tr><tr><td>net/http, Fiber</td><td>gói chuẩn dựng
      dịch vụ HTTP; bộ khung web thêm cách viết tuyến</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    - '1.9'
    say: 'Bảng này giải mã các tên trên màn hình. Lệnh đầu chạy một hàm ở luồng nhẹ
      riêng, và chương trình chính không chờ nó. Nhóm chờ có ba lệnh: cộng số việc,
      trừ một khi việc xong, và chờ tới khi số việc về không. Khoá cho phép một lúc
      chỉ một luồng nhẹ nằm giữa lệnh khoá và lệnh mở. Kênh truyền một loại giá trị,
      con số trong ngoặc là sức chứa của đệm, còn không có số thì là không đệm. Hai
      mũi tên là gửi vào kênh và nhận từ kênh. Lỗi là một giá trị được trả về, và
      giá trị rỗng nghĩa là không có lỗi. Cờ phát hiện tranh chấp chạy kèm một trình
      bắt hai luồng cùng truy cập một biến mà không phối hợp. Cuối cùng, gói chuẩn
      dựng dịch vụ HTTP, còn bộ khung web thêm cách viết tuyến gọn hơn.'
