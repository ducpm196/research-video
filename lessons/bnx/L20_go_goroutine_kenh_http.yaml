id: L20
course: BNX
series: BNX · Backend ngân hàng mở rộng theo JD
title: 'Bài 20 — Go cho backend: goroutine, kênh, tranh chấp dữ liệu và một dịch vụ
  HTTP nhỏ'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: 'curriculum/bnx.yaml L20; audit/bnx/verify_bnx.py L20; audit/bnx/sources_l20.md:
  tài liệu chính thức của Go (đặc tả ngôn ngữ, gói sync, bài về trình phát hiện tranh
  chấp, Effective Go, Go FAQ, blog về map và về bộ định tuyến Go 1.22) và tài liệu
  Fiber (đọc 2026-11-12); mã chạy thật go1.25.5 windows/amd64, Fiber v2.52.16'
assumes: []
objectives:
- Đọc và chạy một chương trình Go có hàm, cấu trúc và xử lý lỗi bằng giá trị trả về
- Chạy nhiều goroutine và gom kết quả bằng nhóm chờ
- Truyền dữ liệu qua kênh có đệm và không đệm, nói lúc nào bên gửi bị chặn
- Viết một dịch vụ HTTP nhỏ và nói bộ khung Fiber thêm gì lên trên
