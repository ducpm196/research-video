- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ luồng nhẹ tới dịch vụ HTTP'
  checks:
  - alg.bnx_l20_wg(3, 2) == 1 and alg.bnx_l20_wg(1000, 1000) == 0
  - alg.bnx_l20_range(3) == (1, 3)
  - alg.bnx_l20_locked(1000) == 1000
  - alg.bnx_l20_race_exit() == 66
  - alg.bnx_l20_accept(2, 3) == (2, 3)
  - alg.bnx_l20_rut(500, 200) == (300, None)
  - alg.bnx_l20_rut(300, 400) == (300, 'không đủ số dư')
  - alg.bnx_l20_route('GET', '/suc-khoe')[0] == 200 and alg.bnx_l20_route('POST',
    '/suc-khoe')[0] == 405 and alg.bnx_l20_route('GET', '/khong-co')[0] == 404
  - alg.bnx_l20_fiber_route('/suc-khoe')[0] == 200
  steps:
  - show: '<p><b>Bước 1.</b> Lệnh <code>go f()</code> chạy <code>f</code> ở luồng
      nhẹ riêng rồi trở về ngay, nên hàm chính có thể kết thúc <b>trước</b> các việc.

      Vì vậy ta dùng nhóm chờ: <code>Add(1)</code> trước mỗi việc, <code>Done()</code>
      khi việc xong, <code>Wait()</code> chờ tới khi số việc về 0.</p>

      <p>Làm thử: 3 lần Add, 2 lần Done.</p>

      $$3 - 2 = \hl{1} \neq 0 \;\Rightarrow\; \text{Wait vẫn chờ}; \qquad 1000 - 1000
      = 0 \;\Rightarrow\; \text{Wait trở về}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: 'Bước một, lệnh chạy ở luồng nhẹ trở về ngay, nên hàm chính có thể kết thúc
      trước các việc. Vì vậy ta dùng nhóm chờ: cộng một trước mỗi việc, trừ một khi
      việc xong, rồi chờ tới khi số việc về không. Làm thử, ba lần cộng và hai lần
      trừ còn dư một, nên lệnh chờ vẫn chờ. Một nghìn lần cộng và một nghìn lần trừ
      thì về không, lệnh chờ mới trở về.'
  - show: '<p><b>Bước 2.</b> Hai luồng nhẹ cùng ghi một biến mà không phối hợp là
      <b>tranh chấp dữ liệu</b>.

      Vì tăng một gồm đọc rồi ghi, nên một lần cộng có thể bị ghi đè, và bộ đếm cuối
      nằm giữa 1 và số luồng.</p>

      <p>Làm thử: 3 luồng cùng cộng 1 vào 0, không khoá.</p>

      $$\text{nhỏ nhất } \hl{1}, \quad \text{lớn nhất } 3; \qquad \text{chỉ khi xen
      kẽ vừa vặn mới ra } 3$$

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, hai luồng nhẹ cùng ghi một biến mà không phối hợp gọi là tranh
      chấp dữ liệu. Vì tăng một gồm đọc rồi ghi, nên một lần cộng có thể bị ghi đè,
      và bộ đếm cuối nằm giữa một và số luồng. Làm thử với ba luồng cùng cộng một
      vào không, kết quả nhỏ nhất là một, lớn nhất là ba.
  - show: '<p><b>Bước 3.</b> Khoá biến đọc-rồi-ghi thành một khối: giữa <code>Lock</code>
      và <code>Unlock</code> một lúc chỉ một luồng nhẹ, nên không lần cộng nào bị
      mất.</p>

      <p>Làm thử: 1000 luồng nhẹ, mỗi luồng cộng 1 trong khoá.</p>

      $$1000 \cdot 1 = \hlg{1000} \quad \text{(mọi lần chạy)}$$

      <span class=''note''>Đổi lại, các luồng xếp hàng qua khoá, nên đoạn nằm trong
      khoá càng ngắn càng tốt.</span>

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, khoá làm cho đọc rồi ghi thành một khối, vì giữa lệnh khoá và lệnh
      mở một lúc chỉ một luồng nhẹ được vào, nên không lần cộng nào bị mất. Làm thử
      với một nghìn luồng, mỗi luồng cộng một trong khoá, thì ra đúng một nghìn ở
      mọi lần chạy. Đổi lại, các luồng xếp hàng qua khoá, nên đoạn nằm trong khoá
      càng ngắn càng tốt.
  - show: '<p><b>Bước 4.</b> Trình phát hiện tranh chấp: chạy <code>go run -race</code>.
      Nó báo khi hai luồng nhẹ truy cập cùng một biến, ít nhất một lần là ghi, mà
      không phối hợp.

      Nó chỉ thấy tranh chấp trên đường mã <b>đã chạy</b>, và làm chương trình chậm
      hơn.</p>

      <div class="box key">Khi thấy tranh chấp, nó in cảnh báo rồi thoát với mã <b>66</b>
      (mặc định). Một lần in đúng kết quả chưa chứng minh là không có tranh chấp.</div>

      <span class=''note''>Trên máy chạy bài này (Windows), cờ <code>-race</code>
      cần bật cgo và có trình biên dịch C (gcc); máy khác có thể khác.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước bốn, trình phát hiện tranh chấp bật bằng cờ phát hiện khi chạy chương
      trình. Nó báo khi hai luồng nhẹ truy cập cùng một biến, ít nhất một lần là ghi,
      mà không phối hợp. Nó chỉ thấy tranh chấp trên đường mã đã chạy, và làm chương
      trình chậm hơn. Khi thấy, nó in cảnh báo rồi thoát với mã sáu mươi sáu. Một
      lần in đúng kết quả chưa chứng minh là không có tranh chấp, nên hãy chạy kiểm
      thử kèm cờ này. Trên máy chạy bài này, cờ ấy cần bật cầu nối với mã C và có
      trình biên dịch C, còn máy khác có thể khác.
  - show: '<p><b>Bước 5.</b> Kênh truyền giá trị giữa các luồng nhẹ. <b>Không đệm</b>:
      bên gửi chờ tới khi có bên nhận. <b>Có đệm n</b>: gửi xong ngay nếu đệm chưa
      đầy, đầy thì chờ.</p>

      <p>Làm thử: đệm 2, gửi liền 3 giá trị, chưa ai nhận.</p>

      $$2 \text{ giá trị vào đệm}; \qquad 2 + 1 = \hl{3} \text{: giá trị thứ 3 phải
      chờ}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: 'Bước năm, kênh truyền giá trị giữa các luồng nhẹ. Kênh không đệm thì bên
      gửi chờ tới khi có bên nhận. Kênh có đệm thì gửi xong ngay nếu đệm chưa đầy,
      còn đầy thì phải chờ. Làm thử với đệm hai, gửi liền ba giá trị mà chưa ai nhận:
      hai giá trị vào đệm, nên giá trị thứ ba phải chờ.'
  - show: '<p><b>Bước 6.</b> Cách báo lỗi thông thường: hàm trả <b>thêm một giá trị
      lỗi</b>, bên gọi phải tự kiểm. Lỗi rỗng là thành công. Bỏ qua lỗi thì chương
      trình chạy tiếp với giá trị không.</p>

      <p>Làm thử: tài khoản 500, rút 200 rồi rút 400.</p>

      $$500 - 200 = 300; \qquad 400 > 300 \;\Rightarrow\; \text{lỗi, số dư vẫn } \hl{300}$$

      '
    focus:
    - 1
    - - 1
      - 2
    - 2
    - 3
    clear: true
    say: Bước sáu, cách báo lỗi thông thường của ngôn ngữ này là hàm trả thêm một
      giá trị lỗi, và bên gọi phải tự kiểm. Lỗi rỗng nghĩa là thành công, bỏ qua lỗi
      thì chương trình chạy tiếp với giá trị không. Làm thử, tài khoản năm trăm, rút
      hai trăm còn ba trăm. Rút bốn trăm thì bốn trăm lớn hơn ba trăm, nên có lỗi
      và số dư vẫn là ba trăm.
  - show: <p><b>Bước 7.</b> Dịch vụ HTTP nhỏ đăng ký tuyến <code>GET /suc-khoe</code>
      với một hàm xử lý. Gói chuẩn tự trả 405 khi sai phương thức và 404 khi không
      có đường dẫn. Mẫu tuyến có phương thức như <code>GET /suc-khoe</code> cần Go
      từ phiên bản 1.22.</p><table class='t'><tr><th>yêu cầu</th><th>mã</th><th>thân</th></tr><tr><td>GET
      /suc-khoe</td><td>200</td><td><code>{"trang_thai":"ok"}</code></td></tr><tr><td>POST
      /suc-khoe</td><td>405</td><td>Method Not Allowed</td></tr><tr><td>GET /khong-co</td><td>404</td><td>404
      page not found</td></tr></table>
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    clear: true
    say: Bước bảy, dịch vụ HTTP nhỏ đăng ký một tuyến, đọc đường dẫn kiểm sức khoẻ,
      với một hàm xử lý. Đúng tuyến thì hàm xử lý trả mã hai trăm và thân JSON. Cùng
      đường dẫn nhưng sai phương thức thì gói chuẩn tự trả bốn trăm linh năm, vì tuyến
      chỉ đăng ký cho phương thức đọc. Đường dẫn không đăng ký thì nhận bốn trăm linh
      bốn, vì không tuyến nào khớp, và mẫu tuyến có phương thức cần Go từ phiên bản
      một phẩy hai mươi hai.
  - show: '<table class=''t''><tr><th>việc</th><th>gói chuẩn net/http</th><th>bộ khung
      Fiber</th></tr><tr><td>đăng ký tuyến</td><td><code>mux.HandleFunc("GET /suc-khoe",
      f)</code></td><td><code>app.Get("/suc-khoe", f)</code></td></tr><tr><td>tham
      số trong đường dẫn</td><td>(bài không so sánh)</td><td><code>/tai-khoan/:so</code>,
      đọc bằng <code>c.Params("so")</code></td></tr><tr><td>trả JSON</td><td>tự đặt
      tiêu đề và ghi thân (chương trình trên)</td><td><code>c.JSON(fiber.Map{…})</code></td></tr><tr><td>nền
      bên dưới</td><td>thư viện chuẩn</td><td>dựng trên <b>fasthttp</b> (nhà phát
      triển Fiber nêu)</td></tr></table><div class="box warn">Bài dùng Fiber <b>v2.52.16</b>;
      nhà phát triển ghi ở bản v2: không còn được bảo trì tích cực. Để chạy thử: <code>go
      mod init vidu</code>, rồi <code>go get github.com/gofiber/fiber/v2@v2.52.16</code>.</div>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    clear: true
    say: Bước tám, bộ khung web thêm gì lên trên gói chuẩn? Đăng ký tuyến thì cả hai
      đều gọn. Bộ khung cho viết tham số ngay trong đường dẫn và đọc bằng một lệnh.
      Nó cũng có lệnh trả JSON gọn, trong khi với gói chuẩn ta tự đặt tiêu đề và ghi
      thân. Bên dưới, nó dựng trên một thư viện HTTP khác, theo lời nhà phát triển
      của nó. Lưu ý, bản dùng trong bài là bản hai, mà nhà phát triển ghi ở bản hai
      là không còn được bảo trì tích cực, nên dự án mới cần cân nhắc phiên bản. Để
      chạy thử, cần khởi tạo một mô-đun rồi tải thư viện đúng bản đó bằng lệnh của
      Go.
- id: example
  kind: example
  title: Ví dụ chạy thật bằng Go, từng phép tính
  checks:
  - alg.bnx_l20_rut(500, 200) == (300, None) and alg.bnx_l20_rut(300, 400)[0] == 300
  - alg.bnx_l20_locked(1000) == 1000 and alg.bnx_l20_wg(1000, 1000) == 0
  - alg.bnx_l20_lost(['A', 'B', 'A', 'B']) == 1 and alg.bnx_l20_race_exit() == 66
  - alg.bnx_l20_chan(3, [('g', 1), ('g', 2), ('g', 3), ('g', 4), ('n',), ('g', 4)])
    == [('xong', 1), ('xong', 2), ('xong', 3), ('chờ',), ('nhận', 1), ('xong', 3)]
  - alg.bnx_l20_chan(0, [('g', 1)]) == [('chờ',)]
  - alg.bnx_l20_accept(3, 4) == (3, 4)
  - alg.bnx_l20_route('GET', '/suc-khoe') == (200, '{"trang_thai":"ok"}')
  - alg.bnx_l20_route('POST', '/suc-khoe')[0] == 405 and alg.bnx_l20_route('GET',
    '/khong-co')[0] == 404
  - alg.bnx_l20_fiber_route('/tai-khoan/001') == (200, '{"so":"001"}')
  steps:
  - show: '<p><b>main.go (trích): cấu trúc tài khoản và hàm trả lỗi</b></p><div class="code"><div>type
      TaiKhoan struct {</div><div>  So   string</div><div>  SoDu int</div><div>}</div><div>
      </div><div>func rut(tk TaiKhoan, tien int) (TaiKhoan, error) {</div><div>  if
      tien &gt; tk.SoDu {</div><div>    return tk, errors.New("không đủ số dư")</div><div>  }</div><div>  tk.SoDu
      -= tien</div><div>  return tk, nil</div><div>}</div></div>'
    focus:
    - 0
    - - '2.1'
      - '2.2'
      - '2.3'
    - '2.6'
    - - '2.7'
      - '2.8'
    - - '2.10'
      - '2.11'
    clear: true
    say: 'Ta chạy thật bằng ngôn ngữ thứ hai trên hồ sơ. Chương trình đầu có một cấu
      trúc tài khoản gồm số tài khoản và số dư. Hàm rút nhận tài khoản và số tiền,
      rồi trả về hai giá trị: tài khoản mới và một lỗi. Nếu số tiền lớn hơn số dư,
      nó trả tài khoản cũ cùng một lỗi. Nếu đủ, nó trừ tiền và trả lỗi rỗng.'
  - show: '<p><b>main.go (tiếp): rút 200 rồi rút 400</b></p><div class="code"><div>func
      main() {</div><div>  tk := TaiKhoan{So: "001", SoDu: 500}</div><div>  for _,
      tien := range []int{200, 400} {</div><div>    moi, err := rut(tk, tien)</div><div>    if
      err != nil {</div><div>      fmt.Println("rút", tien, "lỗi:", err, "- số dư
      vẫn", tk.SoDu)</div><div>      continue</div><div>    }</div><div>    tk = moi</div><div>    fmt.Println("rút",
      tien, "xong, còn", tk.SoDu)</div><div>  }</div><div>}</div></div>'
    focus:
    - - '2.2'
      - '2.3'
    - '2.4'
    - - '2.5'
