    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - 2
    clear: true
    say: Bảng này là năm ngữ cảnh hay gặp. Ngữ cảnh văn bản là mặc định cho nội dung
