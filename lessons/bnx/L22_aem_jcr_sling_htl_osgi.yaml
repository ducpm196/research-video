      đè bằng tuỳ chọn context, ví dụ <code><span>&#36;</span>{properties.jcr:title
      @ context='text'}</code>.</span>
    focus:
    - - 1
    - 2
    introduces:
    - bnx_xss
    clear: true
    say: Có năm ngữ cảnh hay gặp, văn bản và thuộc tính mã hoá mọi ký tự đặc biệt,
      còn địa chỉ thì được kiểm. Lọc thẻ giữ thẻ lành, và ngữ cảnh cuối tắt hẳn bảo
      vệ nên chỉ dùng khi hiểu rõ rủi ro.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>package
      com.vidu.site;</code>, <code>public class TrangModel { … }</code></td><td><code>package</code>:
      lớp nằm ở thư mục com/vidu/site; <code>class</code>: khai một lớp, phần thân
      giữa cặp ngoặc nhọn; <code>public</code>: nơi khác dùng được</td><td></td></tr><tr><td><code>import
      org.apache.sling…*;</code></td><td>lấy lớp của thư viện về dùng; dấu <code>*</code>
      lấy mọi lớp của gói đó</td><td><code>import java.util.*;</code></td></tr><tr><td><code>@Model(…)</code>,
      <code>@ValueMapValue(…)</code></td><td>chú thích bắt đầu bằng <code>@</code>:
      dán nhãn cho lớp hay trường ngay sau nó để thư viện đọc; tự nó không chạy gì</td><td></td></tr><tr><td><code>private
      String tieuDe;</code>, <code>public String getTieuDe() { return tieuDe; }</code></td><td>trường
      chuỗi <code>tieuDe</code> chỉ mã trong lớp này dùng được; hàm công khai <code>getTieuDe()</code>
      trả giá trị trường ra ngoài</td><td></td></tr></table>'
    clear: true
    say: Trước khi đọc mã Java, ta cần bốn ký hiệu, vì mã dùng chúng. Câu gói ghi
      thư mục chứa lớp, và khai lớp mở một khối có phần thân giữa cặp ngoặc nhọn.
      Câu nhập lấy lớp của thư viện về dùng, và dấu sao lấy mọi lớp của gói. Chú thích
      bắt đầu bằng dấu a còng, dán nhãn cho lớp hay trường ngay sau nó để thư viện
      đọc, và tự nó không chạy gì. Trường riêng tư chỉ mã trong lớp dùng được, còn
      hàm công khai trả giá trị trường ra ngoài.
  - show: '<p><b>Bước 5. Lớp mô hình Sling Model (biên dịch được; chưa chạy trong
      máy chủ)</b></p><div class="code"><div>package com.vidu.site;</div><div>import
      org.apache.sling.api.resource.Resource;</div><div>import org.apache.sling.models.annotations.Model;</div><div>import
      org.apache.sling.models.annotations.injectorspecific.*;</div><div>@Model(adaptables=Resource.class)</div><div>public
      class TrangModel {</div><div>    @ValueMapValue(name = "jcr:title")</div><div>    private
      String tieuDe;</div><div>    public String getTieuDe() { return tieuDe; }</div><div>}</div></div><p
      class=''note''><code>@Model(adaptables=Resource.class)</code>: nhãn (annotation)
      báo lớp này tạo được từ một tài nguyên; <code>@ValueMapValue(name = "jcr:title")</code>:
      nhãn báo gán thuộc tính <code>jcr:title</code> vào biến ngay dưới. Quy ước:
      khuôn mẫu viết <code>&#36;{trang.tieuDe}</code> thì máy gọi hàm <code>getTieuDe()</code>
      của lớp (chữ <code>get</code> cộng tên thuộc tính viết hoa chữ đầu).</p>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước năm là phần Java: lớp mô hình đọc thuộc tính tiêu đề. Khuôn mẫu viết
      tên thuộc tính, còn máy gọi hàm lấy giá trị cùng tên của lớp, nên logic nằm
      ở Java còn khuôn mẫu chỉ lo hiển thị.'
  - show: '<p><b>Tệp khai báo của gói chứa lớp đó (MANIFEST.MF)</b></p><div class="code"><div>Bundle-ManifestVersion:
      2</div><div>Bundle-SymbolicName: com.vidu.site.core</div><div>Bundle-Version:
      1.0.0</div><div>Import-Package: org.apache.sling.api.resource,</div><div> org.apache.sling.models.annotations,</div><div>
      org.apache.sling.models.annotations.injectorspecific</div><div>Sling-Model-Packages:
      com.vidu.site</div></div>'
    focus:
    - 1
    - '2.7'
    clear: true
    say: Lớp này nằm trong một gói, nên tệp khai báo của gói ghi tên, phiên bản và
      các gói Java nó cần nhập. Trong khai báo này, thiếu dòng cuối thì lớp mô hình
      không được đăng ký.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>class
      Goi:</code>, <code>def __init__(self, …)</code></td><td>khai một lớp, khuôn
      tạo đối tượng; <code>__init__</code> chạy lúc tạo, <code>self</code> là chính
      đối tượng đó</td><td></td></tr><tr><td><code>self.ten, self.can, self.cap =
      ten, can, cap</code></td><td>gán ba giá trị vào ba trường của đối tượng một
      lúc, theo thứ tự</td><td></td></tr><tr><td><code>self.vet += ["A", "B"]</code></td><td><code>+=</code>
      với danh sách: nối các phần tử vào cuối danh sách <code>self.vet</code></td><td><code>x
      = [1]; x += [2, 3]</code> thì x là <code>[1, 2, 3]</code></td></tr><tr><td><code>raise
      RuntimeError(…)</code>, <code>try: … except RuntimeError as loi:</code></td><td><code>raise</code>:
      ném lỗi, việc đang làm dừng; <code>try</code>/<code>except</code>: thử chạy,
      gặp lỗi loại đó thì chạy khối <code>except</code>, lỗi gán vào tên <code>loi</code></td><td></td></tr></table>'
    clear: true
    say: Lớp là khuôn tạo đối tượng, hàm tạo chạy lúc tạo, và tên chính nó chỉ đối
      tượng đang tạo. Một lệnh gán ba giá trị vào ba trường của đối tượng theo thứ
      tự. Dấu cộng bằng với danh sách nối thêm các phần tử vào cuối danh sách. Lệnh
      ném lỗi dừng việc đang làm, còn khối thử và khối bắt lỗi chạy phần xử lý khi
      gặp lỗi loại đã nêu.
  - show: <p><b>Bước 6. Vòng đời của gói và sổ dịch vụ (mô phỏng, không phải máy chủ
      AEM)</b></p><div class="code"><div>DICH_VU = {}</div><div>class Goi:</div><div>    def
      __init__(self, ten, can, cap):</div><div>        self.ten, self.can, self.cap
      = ten, can, cap</div><div>        self.vet = ["INSTALLED"]</div><div>    def
      start(self, co_san):</div><div>        thieu = [p for p in self.can if p not
      in co_san]</div><div>        if thieu:</div><div>            raise RuntimeError(f"không
      phân giải được, thiếu {thieu}")</div><div>        self.vet += ["RESOLVED", "STARTING",
      "ACTIVE"]</div><div>        DICH_VU[self.cap] = self.ten</div></div>
    focus:
    - 1
    - '2.5'
    clear: true
    say: Bước sáu, ta mô phỏng vòng đời của gói. Vì thiếu gói cần thì gói đứng ở trạng
      thái đã cài, còn đủ thì đi tới đang chạy và chỉ lúc đó mới ghi dịch vụ vào sổ.
  - show: '<div class="code"><div>g = Goi("site.core", ["org.apache.sling.api"], "TieuDe")</div><div>g.start({"org.apache.sling.api"})</div><div>print("
      &gt; ".join(g.vet), "|", DICH_VU)</div><div>g.vet += ["STOPPING", "RESOLVED"]</div><div>DICH_VU.pop(g.cap)</div><div>print(g.vet[-2:],
      "|", DICH_VU)</div><div>h = Goi("site.loi", ["com.vidu.thieu"], "X")</div><div>try:</div><div>    h.start({"org.apache.sling.api"})</div><div>except
      RuntimeError as loi:</div><div>    print(h.vet, loi)</div></div><p><b>Làm thử
      — kết quả chạy thật của mô phỏng</b></p><div class="code"><div>INSTALLED &gt;
      RESOLVED &gt; STARTING &gt; ACTIVE | {''TieuDe'': ''site.core''}</div><div>[''STOPPING'',
      ''RESOLVED''] | {}</div><div>[''INSTALLED''] không phân giải được, thiếu [''com.vidu.thieu'']</div></div>'
    focus:
    - '3.1'
    - '3.3'
    clear: true
    say: Làm thử, gói thứ nhất đang chạy và có một dịch vụ, khi dừng thì dịch vụ bị
      gỡ nên sổ trống. Gói thứ hai thiếu một gói cần nên chỉ ở trạng thái đã cài.
