  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề (dùng kho mẫu và ba tệp dựng
      của bài)</th></tr><tr><td>1</td><td>Yêu cầu /content/site/vi/vay.in.a4.html:
      đường dẫn tài nguyên, selector, phần mở rộng là gì? Tệp dựng nào được chọn?</td></tr><tr><td>2</td><td>Gói
      A cần nhập gói p.q, nhưng không gói nào đang cài cung cấp p.q. Gọi start thì
      A ở trạng thái nào, có dịch vụ không? Gói B đang ACTIVE bị stop thì về trạng
      thái nào?</td></tr><tr><td>3</td><td>Quyết định: biên tập viên muốn chữ <b>in
      đậm</b> trong tiêu đề, nên nhập cả thẻ. Chọn <code>context=''html''</code> hay
      <code>context=''unsafe''</code> cho biểu thức in tiêu đề?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, với yêu cầu đang hiện, đường dẫn
      tài nguyên, bộ chọn và tệp dựng là gì? Câu hai, gói A cần nhập một gói Java
      mà không gói nào cung cấp, gọi khởi động thì A ở trạng thái nào? Câu ba, muốn
      chữ in đậm thì chọn ngữ cảnh nào? Hãy dừng video và làm ra giấy.
  - show: '<div class="box"><b>Câu 1.</b> Cắt ở dấu chấm đầu tiên thì <code>/content/site/vi/vay</code>
      là nút có thật → đường dẫn tài nguyên. Phần còn lại <code>in.a4.html</code>:
      selector <b>in, a4</b>; phần mở rộng <b>html</b>.

      <br>Kiểu của nút vay: site/components/page. Tên ứng viên: in/a4.html (không
      có) → <b>in.html</b> (có ở /apps) → chọn <code>/apps/site/components/page/in.html</code>.</div>

      '
    say: 'Đáp án câu một: nút trang vay là đường dẫn tài nguyên, và hai bộ chọn là
      in và a bốn. Tên khớp bộ chọn đầu có ở thư mục của dự án, nên tệp được chọn
      là tệp in của dự án.'
    clear: true
  - show: '<div class="box"><b>Câu 2.</b> Thiếu p.q → không phân giải được → start
      báo lỗi, gói A đứng ở <b>INSTALLED</b>, <b>0</b> dịch vụ.

      <br>Gói B: ACTIVE → STOPPING → <b>RESOLVED</b>; dịch vụ của B bị gỡ khỏi sổ.</div>

      '
    say: 'Đáp án câu hai: thiếu gói cần nhập thì không phân giải được, nên gói A đứng
      ở đã cài và không có dịch vụ. Gói B đi từ đang chạy qua đang dừng về đã phân
      giải, và dịch vụ của nó bị gỡ khỏi sổ.'
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>context=''html''</td><td>thẻ
      in đậm vẫn hiện; thẻ nguy hiểm bị lọc bỏ</td><td>một số thẻ biên tập viên muốn
      có thể bị lọc; phải thử trước</td></tr><tr><td>context=''unsafe''</td><td>nhập
      gì hiện nấy, không phải thử</td><td>tắt hẳn bảo vệ: một đoạn mã lạ trong tiêu
      đề sẽ chạy trên máy khách</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
