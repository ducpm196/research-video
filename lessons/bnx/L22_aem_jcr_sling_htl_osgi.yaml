- id: quymo
  kind: example
  title: 'Khi kho lớn dần: tìm theo thuộc tính có và không có chỉ mục'
  checks:
  - alg.bnx_l22_scale(10) == (14, 1, 1) and alg.bnx_l22_scale(1000) == (1004, 10,
    10) and alg.bnx_l22_scale(100000) == (100004, 1000, 1000)
  - alg.bnx_l22_depth('/content/site/vi/home') == 4
  - 1000 // 10 == 100000 // 1000 == 100 and 100000 // 10 == 10000
  steps:
  - show: '<p><b>QuyMo.py (trích): dựng kho n trang, cứ 100 trang có 1 trang kiểu
      page (mô phỏng, không phải máy chủ AEM)</b></p><div class="code"><div>PAGE =
      "site/components/page"</div><div>def lap_kho(n):</div><div>    vi = {}</div><div>    for
      i in range(n):</div><div>        loai = PAGE if i % 100 == 0 else "site/components/tin"</div><div>        vi[f"t{i}"]
      = {"sling:resourceType": loai}</div><div>    return {"content": {"site": {"vi":
      vi}}}</div></div>'
    focus:
    - - 1
      - 2
    clear: true
    say: Ta đo khi kho lớn dần, hàm dựng kho có n trang, cứ một trăm trang thì có
      một trang mang kiểu trang, còn lại là kiểu tin, và đây là mô phỏng.
  - show: '<p><b>QuyMo.py (tiếp): duyệt qua mọi nút để tìm theo thuộc tính</b></p><div
      class="code"><div>def duyet(nut):</div><div>    thay, khop = 1, 0</div><div>    for
      k, v in nut.items():</div><div>        if isinstance(v, dict):</div><div>            t,
      c = duyet(v)</div><div>            thay, khop = thay + t, khop + c</div><div>        elif
      k == "sling:resourceType" and v == PAGE:</div><div>            khop += 1</div><div>    return
      thay, khop</div></div>'
    clear: true
    say: Hàm duyệt đếm mọi nút nó đi qua và mọi nút khớp kiểu trang, vì không có chỉ
      mục thì kho chỉ còn cách xem từng nút.
  - show: '<p><b>QuyMo.py (hết): so duyệt với chỉ mục, ở 10, 1 000 và 100 000 trang</b></p><div
      class="code"><div>for n in (10, 1_000, 100_000):</div><div>    kho = lap_kho(n)</div><div>    chi_muc
      = {}</div><div>    for ten, nut in kho["content"]["site"]["vi"].items():</div><div>        chi_muc.setdefault(nut["sling:resourceType"],
      []).append(ten)</div><div>    thay, khop = duyet(kho)</div><div>    print(n,
      "trang: duyet", thay, "nut, khop", khop, "| chi muc doc", len(chi_muc[PAGE]),
      "nut")</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>10 trang:
      duyet 14 nut, khop 1 | chi muc doc 1 nut</div><div>1000 trang: duyet 1004 nut,
      khop 10 | chi muc doc 10 nut</div><div>100000 trang: duyet 100004 nut, khop
      1000 | chi muc doc 1000 nut</div></div>'
    focus:
    - 1
    - '2.2'
    clear: true
    say: 'Chỉ mục ở đây là một từ điển ghi sẵn kiểu nào có những trang nào. Kết quả
      chạy thật: duyệt đi qua mười bốn, một nghìn không trăm bốn, rồi một trăm nghìn
      không trăm bốn nút, còn chỉ mục chỉ đọc đúng số nút khớp.'
  - show: <table class='t'><tr><th>số trang N</th><th>nút phải duyệt (không chỉ mục)</th><th>nút
      khớp</th><th>nút đọc qua chỉ mục</th><th>bước tra đường dẫn một trang (mô phỏng)</th></tr><tr><td><span
      style='white-space:nowrap'>10 (×1)</span></td><td>14</td><td>1</td><td>1</td><td>4</td></tr><tr><td><span
      style='white-space:nowrap'>1 000 (×100)</span></td><td>1 004</td><td>10</td><td>10</td><td>4</td></tr><tr><td><span
      style='white-space:nowrap'>100 000 (×10 000)</span></td><td>100 004</td><td>1
      000</td><td>1 000</td><td>4</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
    say: Bảng cho thấy hai cách tăng khác nhau. Trong mô phỏng, tra một đường dẫn
      luôn bốn bước, còn kho thật phụ thuộc số con của mỗi nút. Truy vấn không chỉ
      mục đọc số nút tăng thẳng theo kho, còn chỉ mục thì đọc đúng số nút khớp.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>duyệt
      toàn kho</td><td>không cần chuẩn bị, luôn đúng</td><td>số nút đọc tăng thẳng
      theo kho</td><td>kho nhỏ, truy vấn hiếm</td></tr><tr><td>tạo chỉ mục cho thuộc
      tính</td><td>chỉ đọc đúng số nút khớp</td><td>mỗi lần ghi phải cập nhật chỉ
      mục, tốn thêm chỗ chứa; phải khai trước đúng thuộc tính</td><td>thuộc tính được
      truy vấn thường xuyên</td></tr><tr><td>thu hẹp phạm vi, chỉ tìm dưới một nhánh</td><td>duyệt
      ít nút hơn</td><td>không thấy nút nằm ngoài nhánh</td><td>biết trước nội dung
      nằm ở nhánh nào</td></tr></table>
    clear: true
    say: Ta phải chọn và chấp nhận đánh đổi. Duyệt toàn kho không cần chuẩn bị nhưng
      chậm theo kho. Chỉ mục đổi chi phí đọc lấy chi phí ghi và chỗ chứa, còn thu
      hẹp phạm vi thì bỏ sót nút ngoài nhánh.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - len({alg.bnx_l22_resolve(u)[0] for u in ('/content/site/vi/home.html', '/content/site/vi/vay.html')})
    == 2 and len({alg.bnx_l22_resolve(u)[2] for u in ('/content/site/vi/home.html',
    '/content/site/vi/vay.html')}) == 1
  - alg.bnx_l22_bundle_trace(['p.q'], set())[-1] == 'INSTALLED' and not alg.bnx_l22_serves('INSTALLED')
  - not alg.bnx_l22_serves('RESOLVED') and alg.bnx_l22_serves('ACTIVE')
  - alg.bnx_l22_script('site/components/page', [], 'html').startswith('/apps/')
  - alg.bnx_l22_scan_cost('site/components/page') == (5, 2) and 5 + 1 == 6
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ mỗi trang là một tệp
      HTML trên đĩa, và Sling chọn mã dựng theo <b>đường dẫn</b>.

      <br><span class="note">Đúng: trang là dữ liệu trong kho nội dung (nút và thuộc
      tính). Đường dẫn chỉ để tìm tài nguyên; mã dựng được chọn theo <b>sling:resourceType</b>.
      Vì vậy 2 trang khác đường dẫn dùng chung 1 tệp page.html.</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là nghĩ mỗi trang là một tệp trên đĩa và mã
      dựng chọn theo đường dẫn. Thật ra trang là dữ liệu trong kho, và mã dựng chọn
      theo kiểu tài nguyên.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Cài
      gói xong, thấy không báo lỗi là yên tâm. Thật ra gói đang ở <b>INSTALLED</b>
      vì một gói trong Import-Package (dòng khai các gói Java mà gói này cần nhập
      từ gói khác) không có: việc phân giải thất bại, lệnh start ném BundleException
      (lỗi OSGi báo gói không chạy được), <b>không dịch vụ nào</b> được đăng ký.

      <br><span class="note">Cách chữa: sau mỗi lần triển khai, đọc trạng thái từng
      gói. INSTALLED: tìm gói phụ thuộc còn thiếu. RESOLVED: gói đủ điều kiện nhưng
      chưa chạy. Chỉ <b>ACTIVE</b> mới cung cấp dịch vụ, nhưng ACTIVE chưa đủ: thành
      phần khai báo kiểu DS (Declarative Services: Java khai báo bằng chú thích, OSGi
      tự nối các dịch vụ lại) còn thiếu tham chiếu thì chưa đăng ký dịch vụ (OSGi
      Compendium §112.3); xem cả mục thành phần trong bảng điều khiển.</span></div>

      '
    introduces:
    - bnx_ds
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là cài gói xong thấy không báo lỗi thì
      yên tâm, trong khi gói kẹt ở đã cài vì thiếu một gói cần nhập. Cách chữa là
      sau mỗi lần triển khai đọc trạng thái từng gói, vì chỉ đang chạy mới có dịch
      vụ.
  - show: '<p><b>Cùng giai đoạn.</b> Sửa thẳng tệp dựng trong <code>/libs</code>:
      chỗ sửa có thể mất khi nâng cấp hay vá nóng.</p><table class=''t''><tr><th>nhánh</th><th>thuộc
      về</th><th>khi nâng cấp sản phẩm</th></tr><tr><td><code>/libs</code></td><td>sản
      phẩm</td><td>bị thay, chỗ sửa mất</td></tr><tr><td><code>/apps</code></td><td>dự
      án của bạn</td><td>giữ nguyên, được tìm trước</td></tr></table>'
    focus:
    - 1
    - 2
    clear: true
    say: Còn một lỗi cùng giai đoạn là sửa thẳng thư mục của sản phẩm. Nhánh này đổi
      mỗi khi nâng cấp nên chỗ sửa có thể mất, vì vậy hãy dựng lại ở thư mục của dự
      án, nơi được tìm trước.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc kho lớn dần).</b>
      Viết truy vấn tìm mọi nút theo một thuộc tính mà không có chỉ mục cho nó. Theo
      hướng dẫn của Apache Jackrabbit Oak (bộ máy kho nội dung của AEM), không có
      chỉ mục thì kho bị <b>duyệt qua</b>, và nhật ký ghi cảnh báo dạng “Traversed
      10000 nodes with filter …”.

      <br><span class="note">Kho mẫu của bài: tìm nút có kiểu site/components/page
      phải đọc cả <b>6</b> nút (5 nút dưới gốc và nút gốc, như hàm <code>duyet</code>
      ở phần đo) để ra <b>2</b> nút khớp; phần đo ở trên cho thấy 100 004 nút ở 100
      000 trang. Cách chữa: tạo chỉ mục cho thuộc tính được truy vấn, và theo dõi
      cảnh báo đó trong nhật ký.</span></div>

      '
    clear: true
    say: 'Lỗi thứ ba lộ ra khi kho lớn dần: truy vấn theo một thuộc tính không có
      chỉ mục thì kho bị duyệt qua từng nút. Cách chữa là tạo chỉ mục cho thuộc tính
      được truy vấn.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l22_split('/content/site/vi/vay.in.a4.html') == ('/content/site/vi/vay',
    ['in', 'a4'], 'html', None, True)
  - alg.bnx_l22_resolve('/content/site/vi/vay.in.a4.html') == ('/content/site/vi/vay',
    'site/components/page', '/apps/site/components/page/in.html')
  - alg.bnx_l22_bundle_trace(['p.q'], {'x.y'}) == ['INSTALLED'] and not alg.bnx_l22_serves(alg.bnx_l22_bundle_trace(['p.q'],
    {'x.y'})[-1])
  - '[alg.bnx_l22_bundle_step(''ACTIVE'', ''stop''), alg.bnx_l22_bundle_step(''STOPPING'',
