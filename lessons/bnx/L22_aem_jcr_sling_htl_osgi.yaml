      data-sly-list="<span>&#36;</span>{properties.mucCon}"&gt;</div><div>    &lt;li&gt;<span>&#36;</span>{item}&lt;/li&gt;</div><div>  &lt;/ul&gt;</div><div>&lt;/div&gt;</div></div><table
