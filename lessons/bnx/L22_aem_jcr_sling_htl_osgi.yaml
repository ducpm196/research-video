    say: Bây giờ tới phần bạn tự làm bài. Câu một, với yêu cầu đang hiện, đường dẫn
      tài nguyên, bộ chọn và phần mở rộng là gì, và tệp dựng nào được chọn? Câu hai,
      gói A cần nhập một gói Java mà không gói nào đang cài cung cấp. Gọi lệnh khởi
      động thì gói A ở trạng thái nào, có dịch vụ không? Còn gói B đang chạy mà bị
      dừng thì về trạng thái nào? Câu ba, biên tập viên muốn chữ in đậm trong tiêu
      đề nên nhập cả thẻ. Nên chọn ngữ cảnh lọc thẻ nguy hiểm, hay ngữ cảnh tắt hẳn
      bảo vệ? Hãy dừng video và làm ra giấy.
  - show: '<div class="box"><b>Câu 1.</b> Cắt ở dấu chấm đầu tiên thì <code>/content/site/vi/vay</code>
      là nút có thật → đường dẫn tài nguyên. Phần còn lại <code>in.a4.html</code>:
      selector <b>in, a4</b>; phần mở rộng <b>html</b>.

      <br>Kiểu của nút vay: site/components/page. Tên ứng viên: in/a4.html (không
      có) → <b>in.html</b> (có ở /apps) → chọn <code>/apps/site/components/page/in.html</code>.</div>

      '
    say: Đáp án câu một. Cắt ở dấu chấm đầu tiên thì phần đầu là nút trang vay có
      thật, nên đó là đường dẫn tài nguyên. Phần còn lại cho hai bộ chọn và phần mở
      rộng trang. Nút trang vay có cùng kiểu tài nguyên với trang chủ. Tên ứng viên
      khớp cả hai bộ chọn thì không có, nên tới tên khớp bộ chọn đầu, và tệp đó có
      ở thư mục của dự án.
    clear: true
  - show: '<div class="box"><b>Câu 2.</b> Thiếu p.q → không phân giải được → start
      báo lỗi, gói A đứng ở <b>INSTALLED</b>, <b>0</b> dịch vụ.

      <br>Gói B: ACTIVE → STOPPING → <b>RESOLVED</b>; dịch vụ của B bị gỡ khỏi sổ.</div>

      '
    say: Đáp án câu hai. Thiếu gói cần nhập thì không phân giải được, nên lệnh khởi
      động báo lỗi, gói A đứng ở trạng thái đã cài và không có dịch vụ nào. Gói B
      đi từ đang chạy, qua đang dừng, về đã phân giải, và dịch vụ của nó bị gỡ khỏi
      sổ.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>context=''html''</td><td>thẻ
      in đậm vẫn hiện; thẻ nguy hiểm bị lọc bỏ</td><td>một số thẻ biên tập viên muốn
      có thể bị lọc; phải thử trước</td></tr><tr><td>context=''unsafe''</td><td>nhập
      gì hiện nấy, không phải thử</td><td>tắt hẳn bảo vệ: một đoạn mã lạ trong tiêu
      đề sẽ chạy trên máy khách</td></tr></table>'
    say: Đáp án câu ba. Ngữ cảnh lọc thẻ vẫn cho thẻ in đậm hiện ra, mà thẻ nguy hiểm
      bị lọc bỏ. Đổi lại, một số thẻ biên tập viên muốn có thể bị lọc, nên phải thử
      trước. Ngữ cảnh tắt bảo vệ thì nhập gì hiện nấy, nhưng một đoạn mã lạ trong
