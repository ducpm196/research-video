  - show: '<table class=''t''><tr><th>Nếu bị hỏi về dòng này trên CV</th><th>ý trả
      lời một dòng</th></tr><tr><td>Một yêu cầu tới trang AEM được xử lý thế nào?</td><td>Sling
      tách đường dẫn, tìm tài nguyên trong JCR, đọc sling:resourceType (AEM: nút cq:Page,
      thuộc tính ở nút con jcr:content), chọn tệp dựng HTL (tìm /apps trước /libs)</td></tr><tr><td>Sling
      Model và HTL chia việc ra sao?</td><td>Sling Model là lớp Java gắn @Model(adaptables=Resource.class),
      nạp thuộc tính của tài nguyên; HTL gọi nó bằng data-sly-use và chỉ lo hiển thị,
      tự thoát theo ngữ cảnh</td></tr><tr><td>Gói OSGi triển khai xong mà không chạy,
