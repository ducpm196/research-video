id: L22
course: BNX
series: BNX · Backend ngân hàng mở rộng theo JD
title: 'Bài 22 — Adobe Experience Manager: JCR, Sling phân giải đường dẫn, thành phần
  HTL và gói OSGi'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: 'curriculum/bnx.yaml L22; audit/bnx/verify_bnx.py L22; audit/bnx/sources_l22.md
  (đọc 2026-11-12): Apache Sling “URL decomposition”, “Servlets and Scripts”, “Scripting”,
  “Sling Models”; “Resources”; đặc tả HTL (github.com/adobe/htl-spec); OSGi Core Release
  8 chương Life Cycle, Module, Service; JCR 2.0 (JSR 283) chương 3 Repository Model;
  Apache Jackrabbit Oak “Query Engine”; Adobe AEM 6.5 “Overlays”. Máy không có máy
  chủ AEM: cơ chế dạy bằng mô phỏng Python theo tài liệu; mã HTL, Java, MANIFEST chỉ
  đọc đối chiếu'
assumes: []
objectives:
- Đọc một cây nội dung JCR gồm nút và thuộc tính
- Lần theo cách Sling đổi một đường dẫn thành tài nguyên rồi chọn tệp dựng trang
- Đọc một đoạn HTL và nói vì sao nó tự thoát ký tự theo ngữ cảnh
- Kể vòng đời của một gói OSGi và vai trò của dịch vụ
