      sách, với tên mặc định cho mỗi phần tử.
  - show: '<p><b>Bước 4 (tiếp). Tự thoát ký tự ở ngữ cảnh text (mô phỏng, không phải
      máy chủ AEM)</b></p><div class="code"><div>import re</div><div>MA = {"&amp;":
      "&amp;amp;", "&lt;": "&amp;lt;", "&gt;": "&amp;gt;", ''"'': "&amp;quot;"}</div><div>def
      thoat(s):</div><div>    return "".join(MA.get(c, c) for c in s)</div><div>def
      dung(mau, thuoc_tinh):</div><div>    return re.sub(r"\<span>&#36;</span>\{properties\.([\w:]+)\}",</div><div>                  lambda
