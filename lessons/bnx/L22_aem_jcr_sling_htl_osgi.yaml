- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - len({alg.bnx_l22_resolve(u)[0] for u in ('/content/site/vi/home.html', '/content/site/vi/vay.html')})
    == 2 and len({alg.bnx_l22_resolve(u)[2] for u in ('/content/site/vi/home.html',
    '/content/site/vi/vay.html')}) == 1
  - alg.bnx_l22_bundle_trace(['p.q'], set())[-1] == 'INSTALLED' and not alg.bnx_l22_serves('INSTALLED')
  - not alg.bnx_l22_serves('RESOLVED') and alg.bnx_l22_serves('ACTIVE')
  - alg.bnx_l22_script('site/components/page', [], 'html').startswith('/apps/')
  - alg.bnx_l22_scan_cost('site/components/page') == (5, 2)
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ mỗi trang là một tệp
      HTML trên đĩa, và Sling chọn mã dựng theo <b>đường dẫn</b>.

      <br><span class="note">Đúng: trang là dữ liệu trong kho nội dung (nút và thuộc
      tính). Đường dẫn chỉ để tìm tài nguyên; mã dựng được chọn theo <b>sling:resourceType</b>.
      Vì vậy 2 trang khác đường dẫn dùng chung 1 tệp page.html.</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là nghĩ mỗi trang là một tệp trên đĩa, và mã
      dựng được chọn theo đường dẫn. Thật ra trang là dữ liệu trong kho nội dung.
      Đường dẫn chỉ để tìm tài nguyên, còn mã dựng được chọn theo kiểu tài nguyên,
      nên hai trang khác đường dẫn dùng chung một tệp dựng.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Cài
      gói xong, thấy không báo lỗi là yên tâm. Thật ra gói đang ở <b>INSTALLED</b>
      vì một gói trong Import-Package không có: việc phân giải thất bại, lệnh start
      ném BundleException, <b>không dịch vụ nào</b> được đăng ký.

      <br><span class="note">Cách chữa: sau mỗi lần triển khai, đọc trạng thái từng
      gói. INSTALLED: tìm gói phụ thuộc còn thiếu. RESOLVED: gói đủ điều kiện nhưng
      chưa chạy. Chỉ <b>ACTIVE</b> mới cung cấp dịch vụ, nhưng ACTIVE chưa đủ: thành
      phần khai báo kiểu DS còn thiếu tham chiếu thì chưa đăng ký dịch vụ (OSGi Compendium
      §112.3); xem cả mục thành phần trong bảng điều khiển.</span></div>

      <div class="box warn"><b>Cùng giai đoạn.</b> Sửa thẳng tệp dựng trong <code>/libs</code>.
      Nhánh này thay đổi mỗi khi nâng cấp, vá nóng hoặc cài gói tính năng, nên chỗ
      sửa có thể mất. Đúng: dựng lại cấu trúc tương ứng dưới <code>/apps</code>, vì
      <code>/apps</code> được tìm trước.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, hay gặp lúc mới dựng hệ thống. Cài gói
      xong, thấy không báo lỗi là yên tâm. Thật ra gói đang kẹt ở trạng thái đã cài,
      vì một gói nó cần nhập không có, nên việc phân giải thất bại và không dịch vụ
      nào được đăng ký. Cách chữa là sau mỗi lần triển khai, đọc trạng thái từng gói.
      Đã cài thì tìm gói phụ thuộc còn thiếu, đã phân giải thì gói chưa chạy, chỉ
      đang chạy mới có dịch vụ, mà vẫn chưa đủ nếu thành phần còn thiếu tham chiếu.
      Cũng ở giai đoạn này, có người sửa thẳng tệp dựng trong thư mục của sản phẩm.
      Nhánh đó thay đổi mỗi khi nâng cấp hay vá nóng, nên chỗ sửa có thể mất. Cách
      đúng là dựng lại cấu trúc tương ứng ở thư mục của dự án, vì nơi đó được tìm
      trước.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc tải tăng và kho lớn
      dần).</b> Viết truy vấn tìm mọi nút theo một thuộc tính mà không có chỉ mục
      cho nó. Theo hướng dẫn của Apache Jackrabbit Oak, không có chỉ mục thì kho bị
      <b>duyệt qua</b>, và nhật ký ghi cảnh báo dạng “Traversed 10000 nodes with filter
      …”.

      <br><span class="note">Kho mẫu của bài: tìm nút có kiểu site/components/page
      phải đọc cả <b>5</b> nút để ra <b>2</b> nút khớp. Kho thật có hàng triệu nút
      thì số nút phải đọc tăng theo. Cách chữa: tạo chỉ mục cho thuộc tính được truy
      vấn, và theo dõi cảnh báo đó trong nhật ký.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, lộ ra khi tải tăng và kho lớn dần.
      Đó là viết truy vấn tìm nút theo một thuộc tính mà không có chỉ mục cho nó.
      Theo hướng dẫn của nhóm làm ra kho nội dung, không có chỉ mục thì kho bị duyệt
      qua từng nút, và nhật ký ghi cảnh báo đã duyệt mười nghìn nút. Trong kho mẫu
      của bài, tìm nút theo kiểu tài nguyên phải đọc cả năm nút để ra hai nút khớp,
      và kho thật càng lớn thì số nút phải đọc càng tăng. Cách chữa là tạo chỉ mục
      cho thuộc tính được truy vấn, và theo dõi cảnh báo đó trong nhật ký.
