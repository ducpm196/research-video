      quả chạy thật</b></p><div class="code"><div>&lt;h1&gt;Xin chào &amp;lt;script&amp;gt;alert(1)&amp;lt;/script&amp;gt;&lt;/h1&gt;</div><div>&lt;h1&gt;Vay
      tiêu dùng&lt;/h1&gt;</div></div>'
    focus:
