    clear: true
    say: Bước bốn, đây là tệp dựng viết bằng ngôn ngữ khuôn mẫu, ta chỉ đọc đối chiếu
      vì máy này không chạy được nó. Biểu thức giữa thẻ tự thoát ký tự theo ngữ cảnh
      văn bản, còn trong địa chỉ thì được kiểm.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>MA.get(c,
      c)</code></td><td>lấy giá trị đổi của <code>c</code> trong bảng <code>MA</code>;
      không có thì giữ nguyên <code>c</code> (đối số thứ hai là giá trị mặc định)</td></tr><tr><td><code>"".join(…
      for c in s)</code></td><td>ghép các ký tự đã đổi lại thành một chuỗi</td></tr><tr><td><code>r"\&#36;\{properties\.([\w:]+)\}"</code></td><td>mẫu
      tìm đúng chữ <code>&#36;{properties.TÊN}</code>: các ký tự có dấu gạch chéo
      ngược đứng trước là ký tự thật, <code>([\w:]+)</code> bắt phần TÊN gồm chữ,
      số, gạch dưới hoặc hai chấm</td></tr><tr><td><code>m.group(1)</code></td><td>phần
      nằm trong cặp ngoặc tròn thứ nhất của mẫu, tức TÊN</td></tr></table>'
    clear: true
    say: Mã tự thoát có bốn chỗ cần biết. Hàm lấy hai đối số nên giữ nguyên ký tự
      nếu bảng không có. Mẫu tìm đúng cụm có dấu đô la, và phần trong ngoặc tròn là
      tên thuộc tính, lấy ra bằng số một.
  - show: '<p><b>Bước 4 (tiếp). Tự thoát ký tự ở ngữ cảnh text (mô phỏng, không phải
      máy chủ AEM)</b></p><div class="code"><div>import re</div><div>MA = {"&amp;":
      "&amp;amp;", "&lt;": "&amp;lt;", "&gt;": "&amp;gt;", ''"'': "&amp;quot;"}</div><div>def
      thoat(s):</div><div>    return "".join(MA.get(c, c) for c in s)</div><div>def
      dung(mau, thuoc_tinh):</div><div>    return re.sub(r"\<span>&#36;</span>\{properties\.([\w:]+)\}",</div><div>                  lambda
      m: thoat(thuoc_tinh[m.group(1)]), mau)</div><div>mau = "&lt;h1&gt;<span>&#36;</span>{properties.jcr:title}&lt;/h1&gt;"</div><div>print(dung(mau,
      nut("/content/site/vi/home")))</div><div>print(dung(mau, nut("/content/site/vi/vay")))</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>&lt;h1&gt;Xin chào &amp;lt;script&amp;gt;alert(1)&amp;lt;/script&amp;gt;&lt;/h1&gt;</div><div>&lt;h1&gt;Vay
      tiêu dùng&lt;/h1&gt;</div></div>'
