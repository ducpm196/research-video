      tắt hẳn việc thoát ký tự và bảo vệ, nên chỉ dùng khi hiểu rõ rủi ro. Người viết
      có thể ghi đè ngữ cảnh bằng một tuỳ chọn trong biểu thức.
  - show: <p><b>Bước 5. Lớp mô hình Sling Model (biên dịch được; chưa chạy trong máy
      chủ)</b></p><div class="code"><div>package com.vidu.site;</div><div>import org.apache.sling.api.resource.Resource;</div><div>import
      org.apache.sling.models.annotations.Model;</div><div>import org.apache.sling.models.annotations.injectorspecific.*;</div><div>@Model(adaptables=Resource.class)</div><div>public
      class TrangModel {</div><div>    @ValueMapValue(name = "jcr:title")</div><div>    private
      String tieuDe;</div><div>    public String getTieuDe() { return tieuDe; }</div><div>}</div></div>
    focus:
    - 1
    - 2
    - 2
    clear: true
    say: Bước năm là phần Java. Lớp mô hình mang chú thích cho biết nó tạo từ một
      tài nguyên, và trường tiêu đề đọc thuộc tính tiêu đề, tên ghi ngay trong chú
      thích, khớp với nút mẫu. Vì vậy logic nằm ở Java, còn khuôn mẫu chỉ lo hiển
      thị.
  - show: '<p><b>Tệp khai báo của gói chứa lớp đó (MANIFEST.MF)</b></p><div class="code"><div>Bundle-ManifestVersion:
      2</div><div>Bundle-SymbolicName: com.vidu.site.core</div><div>Bundle-Version:
      1.0.0</div><div>Import-Package: org.apache.sling.api.resource,</div><div> org.apache.sling.models.annotations,</div><div>
      org.apache.sling.models.annotations.injectorspecific</div><div>Sling-Model-Packages:
      com.vidu.site</div></div>'
    focus:
    - 2
    - '2.7'
    clear: true
    say: Lớp này nằm trong một gói, và tệp khai báo của gói ghi tên gói, phiên bản,
      và các gói Java nó cần nhập từ gói khác. Dòng cuối liệt kê gói Java chứa các
      lớp mô hình, vì thiếu dòng đó thì lớp mô hình không được đăng ký.
  - show: <p><b>Bước 6. Vòng đời của gói và sổ dịch vụ (mô phỏng, không phải máy chủ
      AEM)</b></p><div class="code"><div>DICH_VU = {}</div><div>class Goi:</div><div>    def
      __init__(self, ten, can, cap):</div><div>        self.ten, self.can, self.cap
      = ten, can, cap</div><div>        self.vet = ["INSTALLED"]</div><div>    def
      start(self, co_san):</div><div>        thieu = [p for p in self.can if p not
      in co_san]</div><div>        if thieu:</div><div>            raise RuntimeError(f"không
      phân giải được, thiếu {thieu}")</div><div>        self.vet += ["RESOLVED", "STARTING",
      "ACTIVE"]</div><div>        DICH_VU[self.cap] = self.ten</div></div>
    focus:
    - 1
    - '2.5'
    - '2.9'
    - '2.10'
    clear: true
    say: Bước sáu, ta mô phỏng vòng đời của gói. Mỗi gói nhớ tên, các gói nó cần,
      dịch vụ nó cấp, và vết các trạng thái đã qua, bắt đầu từ đã cài. Khi khởi động,
      nếu thiếu gói cần thì việc phân giải thất bại và hàm báo lỗi, nên gói đứng nguyên
      ở trạng thái đã cài. Nếu đủ, gói đi qua đã phân giải, đang khởi động, rồi đang
      chạy, và chỉ lúc đó mới ghi dịch vụ của mình vào sổ.
  - show: '<div class="code"><div>g = Goi("site.core", ["org.apache.sling.api"], "TieuDe")</div><div>g.start({"org.apache.sling.api"})</div><div>print("
      &gt; ".join(g.vet), "|", DICH_VU)</div><div>g.vet += ["STOPPING", "RESOLVED"]</div><div>DICH_VU.pop(g.cap)</div><div>print(g.vet[-2:],
      "|", DICH_VU)</div><div>h = Goi("site.loi", ["com.vidu.thieu"], "X")</div><div>try:</div><div>    h.start({"org.apache.sling.api"})</div><div>except
      RuntimeError as loi:</div><div>    print(h.vet, loi)</div></div><p><b>Làm thử
      — kết quả chạy thật của mô phỏng</b></p><div class="code"><div>INSTALLED &gt;
      RESOLVED &gt; STARTING &gt; ACTIVE | {''TieuDe'': ''site.core''}</div><div>[''STOPPING'',
      ''RESOLVED''] | {}</div><div>[''INSTALLED''] không phân giải được, thiếu [''com.vidu.thieu'']</div></div>'
    focus:
    - '3.1'
    - '3.2'
    - '3.3'
    clear: true
    say: Làm thử, gói thứ nhất có đủ gói cần, nên vết của nó đi từ đã cài, qua đã
      phân giải và đang khởi động, tới đang chạy, và sổ có một dịch vụ. Khi dừng,
      ta ghi thêm trạng thái đang dừng rồi đã phân giải, và gỡ dịch vụ khỏi sổ, nên
      sổ trống, vì dịch vụ của gói dừng bị gỡ. Gói thứ hai thiếu một gói cần, nên
      vết của nó chỉ có trạng thái đã cài, kèm thông báo thiếu gói nào.
