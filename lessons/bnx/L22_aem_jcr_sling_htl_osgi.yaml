- id: formula
  kind: formula
  title: 'Suy ra từng bước: kho, đường dẫn, tệp dựng, khuôn mẫu, gói'
  checks:
  - sorted(k for k, v in alg.bnx_l22_repo().items() if k.startswith('/content/site/vi/'))
    == ['/content/site/vi/home', '/content/site/vi/vay']
  - sorted(alg.bnx_l22_props('/content/site/vi/home')) == ['jcr:primaryType', 'jcr:title',
    'sling:resourceType'] and alg.bnx_l22_props('/content/site/vi/home.html') is None
  - alg.bnx_l22_split('/content/site/vi/home.html') == ('/content/site/vi/home', [],
    'html', None, True)
  - alg.bnx_l22_split('/content/site/vi/home.in.a4.html') == ('/content/site/vi/home',
    ['in', 'a4'], 'html', None, True)
  - alg.bnx_l22_split('/content/site/vi/home.html/phu/luc') == ('/content/site/vi/home',
    [], 'html', '/phu/luc', True)
  - alg.bnx_l22_split('/content/site/vi/khong_co.html') == ('/content/site/vi/khong_co',
    [], 'html', None, False)
  - alg.bnx_l22_script('site/components/page', [], 'html') == '/apps/site/components/page/page.html'
  - alg.bnx_l22_resolve('/content/site/vi/vay.html') == ('/content/site/vi/vay', 'site/components/page',
    '/apps/site/components/page/page.html')
  - alg.bnx_l22_resolve('/content/site/vi/home.in.a4.html')[2] == '/apps/site/components/page/in.html'
  - alg.bnx_l22_escape('Xin chào <script>alert(1)</script>') == 'Xin chào &lt;script&gt;alert(1)&lt;/script&gt;'
  - alg.bnx_l22_escape('Vay tiêu dùng') == 'Vay tiêu dùng' and alg.bnx_l22_escape('&lt;')
    == '&amp;lt;'
  - alg.bnx_l22_bundle_trace(['org.apache.sling.api'], {'org.apache.sling.api'}) ==
    ['INSTALLED', 'RESOLVED', 'STARTING', 'ACTIVE']
  - alg.bnx_l22_bundle_trace(['com.vidu.thieu'], {'org.apache.sling.api'}) == ['INSTALLED']
  - alg.bnx_l22_bundle_step(alg.bnx_l22_bundle_step('ACTIVE', 'stop'), 'stopped')
    == 'RESOLVED'
  steps:
  - show: '<p><b>Bước 1. Kho nội dung là một cây (mô phỏng, không phải máy chủ AEM)</b></p><div
      class="code"><div>KHO = {"content": {"site": {"vi": {</div><div>    "home":
      {"jcr:primaryType": "nt:unstructured",</div><div>             "sling:resourceType":
      "site/components/page",</div><div>             "jcr:title": "Xin chào &lt;script&gt;alert(1)&lt;/script&gt;"},</div><div>    "vay":
      {"jcr:primaryType": "nt:unstructured",</div><div>            "sling:resourceType":
      "site/components/page",</div><div>            "jcr:title": "Vay tiêu dùng"}}}}}</div><div>def
      nut(duong_dan):</div><div>    n = KHO</div><div>    for ten in duong_dan.strip("/").split("/"):</div><div>        n
      = n.get(ten) if isinstance(n, dict) else None</div><div>    return n if isinstance(n,
      dict) else None</div></div>'
    focus:
    - 1
    - '2.2'
    - '2.8'
    say: Bước một, ta mô phỏng kho nội dung bằng một từ điển Python lồng nhau, vì
      kho thật cũng là một cây. Giá trị nào là từ điển thì là nút con, giá trị nào
      là chuỗi thì là thuộc tính. Hàm tìm nút đi từ gốc xuống theo từng tên trong
      đường dẫn, và trả về rỗng nếu không có nút như vậy.
  - show: '<div class="code"><div>vi = nut("/content/site/vi")</div><div>print("nút
      con:", [k for k in vi if type(vi[k]) is dict])</div><div>print("thuộc tính:",
      sorted(nut("/content/site/vi/home")))</div><div>print(nut("/content/site/vi/home.html"))</div></div><p><b>Làm
      thử — kết quả chạy thật của mô phỏng</b></p><div class="code"><div>nút con:
      [''home'', ''vay'']</div><div>thuộc tính: [''jcr:primaryType'', ''jcr:title'',
      ''sling:resourceType'']</div><div>None</div></div>'
    focus:
    - '3.1'
    - '3.2'
    - '3.3'
    - '3.3'
    clear: true
    say: 'Làm thử, nút cấp ba có hai nút con là hai trang. Nút trang chủ có ba thuộc
      tính: kiểu nút chính, tiêu đề và kiểu tài nguyên. Còn đường dẫn có cả phần mở
      rộng thì không phải nút nào trong kho, nên hàm trả về rỗng. Vì vậy phải tách
      đường dẫn trước khi tìm.'
  - show: <p><b>Bước 2. Tách đường dẫn theo cách của Sling (mô phỏng, không phải máy
      chủ AEM)</b></p><div class="code"><div>def tach(url):</div><div>    cat = [i
      for i, c in enumerate(url) if c == "."] + [len(url)]</div><div>    co = [i for
      i in cat if nut(url[:i]) is not None]</div><div>    i = max(co) if co else cat[0]</div><div>    giua,
      gach, hau_to = url[i + 1:].partition("/")</div><div>    phan = giua.split(".")
      if giua else [None]</div><div>    return url[:i], phan[:-1], phan[-1], (gach
      + hau_to) or None</div></div>
    focus:
    - 1
    - 1
    - '2.3'
    - '2.6'
    - '2.7'
    clear: true
    say: 'Bước hai là tách đường dẫn. Vì tên nút có thể chứa dấu chấm, nên nhìn chuỗi
      thôi thì không biết đường dẫn tài nguyên kết thúc ở đâu. Do đó hàm thử cắt tại
      từng dấu chấm và tại cuối chuỗi, rồi giữ điểm cắt xa nhất mà phần đầu là một
      nút có thật. Phần còn lại, tính tới dấu gạch chéo kế tiếp, được chia theo dấu
      chấm: khúc cuối là phần mở rộng, các khúc trước là bộ chọn. Phần từ dấu gạch
      chéo đó trở đi là hậu tố.'
  - show: <div class="code"><div>for url in ["/content/site/vi/home.html",</div><div>            "/content/site/vi/home.in.a4.html",</div><div>            "/content/site/vi/home.html/phu/luc",</div><div>            "/content/site/vi/khong_co.html"]:</div><div>    print(tach(url))</div></div><p><b>Làm
      thử — kết quả chạy thật của mô phỏng</b></p><div class="code"><div>('/content/site/vi/home',
      [], 'html', None)</div><div>('/content/site/vi/home', ['in', 'a4'], 'html',
      None)</div><div>('/content/site/vi/home', [], 'html', '/phu/luc')</div><div>('/content/site/vi/khong_co',
      [], 'html', None)</div></div>
    focus:
    - '1.1'
    - '3.1'
    - '3.2'
    - '3.3'
    - '3.4'
    clear: true
    say: Làm thử với bốn đường dẫn. Đường dẫn thứ nhất cho đường dẫn tài nguyên là
      nút trang chủ, không có bộ chọn, và phần mở rộng trang. Đường dẫn thứ hai có
      thêm hai bộ chọn. Đường dẫn thứ ba có hậu tố nằm sau phần mở rộng. Đường dẫn
      thứ tư trỏ tới nút không có, nên hàm cắt ở dấu chấm đầu tiên, và bảng của đặc
      tả ghi trường hợp này là không có tài nguyên.
  - show: <p><b>Bước 3. Chọn tệp dựng theo kiểu tài nguyên (mô phỏng, không phải máy
      chủ AEM)</b></p><div class="code"><div>MA_DUNG = ["/apps/site/components/page/page.html",</div><div>           "/apps/site/components/page/in.html",</div><div>           "/libs/site/components/page/page.html"]</div><div>def
      chon_tep(kieu, chon, mo_rong):</div><div>    duoi = ("" if mo_rong == "html"
      else "." + mo_rong) + ".html"</div><div>    ten = ["/".join(chon[:k]) for k
      in range(len(chon), 0, -1)]</div><div>    ten.append(kieu.split("/")[-1])</div><div>    for
      t in ten:</div><div>        for goc in ("/apps/", "/libs/"):</div><div>            tep
      = goc + kieu + "/" + t + duoi</div><div>            if tep in MA_DUNG:</div><div>                return
      tep</div></div>
    focus:
    - 1
    - '2.1'
    - '2.6'
    - '2.5'
    - '2.9'
    clear: true
    say: Bước ba là chọn tệp dựng. Danh sách đầu là ba tệp dựng đang có, hai tệp của
      dự án và một tệp của sản phẩm. Tên tệp ứng viên lấy từ bộ chọn trước, rồi tới
      khúc cuối của kiểu tài nguyên, vì tệp khớp nhiều bộ chọn hơn thì được ưu tiên.
      Phần mở rộng trang được lược khỏi tên tệp, còn phần mở rộng khác thì phải ghi
      vào tên. Với mỗi tên, hàm tìm ở thư mục của dự án trước, rồi mới tới thư mục
      của sản phẩm.
  - show: '<div class="code"><div>for url in ["/content/site/vi/home.html", "/content/site/vi/vay.html",</div><div>            "/content/site/vi/home.in.a4.html"]:</div><div>    duong,
      chon, mo_rong, hau_to = tach(url)</div><div>    kieu = nut(duong)["sling:resourceType"]</div><div>    print(url.split("/")[-1],
