    clear: true
    say: Bước bốn, đây là một tệp dựng viết bằng ngôn ngữ khuôn mẫu. Ta chỉ đọc và
      đối chiếu với đặc tả, vì máy này không chạy được nó, và hai thuộc tính liên
      kết với danh sách là giả định, nút mẫu không có. Thuộc tính đầu tiên khởi tạo
      phần logic viết bằng Java, và đặt cho nó một tên để khuôn mẫu dùng. Biểu thức
      nằm giữa thẻ thì tự được thoát ký tự theo ngữ cảnh văn bản. Biểu thức nằm trong
      địa chỉ liên kết thì được kiểm theo ngữ cảnh địa chỉ, và địa chỉ không hợp lệ
