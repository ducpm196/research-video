  - show: '<p><b>Bước 4. Tệp dựng HTL (đối chiếu đặc tả, không chạy; lienKet và mucCon
      là thuộc tính giả định)</b></p><div class="code"><div>&lt;div data-sly-use.trang="com.vidu.site.TrangModel"&gt;</div><div>  &lt;h1&gt;<span>&#36;</span>{trang.tieuDe}&lt;/h1&gt;</div><div>  &lt;a
