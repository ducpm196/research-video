scenes:
- id: hook
  kind: hook
  title: '9 giờ sáng, biên tập viên sửa tiêu đề trang vay: không ai triển khai lại
    mã'
  checks:
  - alg.bnx_l22_resolve('/content/site/vi/home.html')[2] == alg.bnx_l22_resolve('/content/site/vi/vay.html')[2]
    == '/apps/site/components/page/page.html'
  - len({alg.bnx_l22_resolve(u)[2] for u in ('/content/site/vi/home.html', '/content/site/vi/vay.html')})
    == 1
  - alg.bnx_l22_props('/content/site/vi/home')['jcr:title'] == 'Xin chào <script>alert(1)</script>'
  steps:
  - show: '<p>Trang web giới thiệu sản phẩm của một ngân hàng chạy trên <b>Adobe Experience
      Manager (AEM)</b>. 9 giờ sáng, biên tập viên sửa tiêu đề trang chủ. Trang đổi
      ngay trên máy soạn (author), dù <b>không ai triển khai lại mã</b> và trên đĩa
      có <b>0</b> tệp HTML của trang đó; khách chỉ thấy sau khi nội dung được đăng
      (publish) sang máy đăng.</p>

      <div class="box key">Lỡ tay, người đó gõ vào tiêu đề chuỗi <code>Xin chào &lt;script&gt;alert(1)&lt;/script&gt;</code>.
      Trình duyệt của khách có chạy đoạn mã lạ đó không? Và <b>2</b> trang khác nhau
      làm sao dùng chung <b>1</b> tệp dựng?</div>

      <span class=''note''>(mô phỏng theo đặc tả công khai, không phải máy chủ AEM)</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Chào bạn, trang web giới thiệu sản phẩm của một ngân hàng chạy trên một hệ
      quản trị nội dung, tên của nó đang hiện trên màn hình. Chín giờ sáng, biên tập
      viên sửa tiêu đề trang chủ, và trang đổi ngay trên máy soạn, dù không ai triển
      khai lại mã và trên đĩa không có tệp nào của trang đó. Lỡ tay, người đó gõ vào
      tiêu đề một đoạn mã lạ, vậy trình duyệt của khách có chạy đoạn mã đó không?
      Và hai trang khác nhau làm sao dùng chung một tệp dựng? Máy ta không có máy
      chủ thật nên bài là mô phỏng theo đặc tả công khai, và khách chỉ thấy trang
      sau khi nội dung được đăng sang máy đăng.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>phần trả lời trong bài</th></tr><tr><td>trang
      nằm ở đâu nếu không phải tệp trên đĩa</td><td>kho nội dung JCR: cây gồm nút
      và thuộc tính</td></tr><tr><td>từ đường dẫn tới mã dựng trang bằng cách nào</td><td>Sling:
      tách đường dẫn, tìm tài nguyên, đọc kiểu tài nguyên, chọn tệp dựng</td></tr><tr><td>vì
      sao đoạn mã lạ trong tiêu đề không chạy</td><td>HTL tự thoát ký tự theo ngữ
      cảnh</td></tr><tr><td>mã Java của dự án được nạp và chạy thế nào</td><td>gói
      OSGi có vòng đời; chỉ gói đang chạy mới cung cấp dịch vụ</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bài này trả lời bốn câu hỏi. Trang nằm ở đâu nếu không phải tệp trên đĩa.
      Từ đường dẫn tới mã dựng trang bằng cách nào. Vì sao đoạn mã lạ trong tiêu đề
      không chạy. Và mã Java của dự án được nạp và chạy thế nào.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_l22_depth('/content/site/vi/home') == 4
  - alg.bnx_l22_escape('<b>') == '&lt;b&gt;' and alg.bnx_l22_escaped_count('<b>')
    == 2
  - len(alg.bnx_l22_escape('<b>')) == 3 + 2 * 3 == 9
  - alg.bnx_l22_bundle_step('INSTALLED', 'start') is None
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Cây</td><td>mỗi nút có một nút cha và có thể có nhiều nút con; đi từ gốc xuống
      theo tên</td><td>thư mục trên máy: ổ đĩa → thư mục → thư mục con</td></tr><tr><td>②
      Đường dẫn và phần mở rộng</td><td>dãy tên nối bằng dấu gạch chéo; phần sau dấu
      chấm cuối cho biết dạng muốn nhận</td><td>/content/site/vi/home.html: 4 cấp,
      phần mở rộng html</td></tr><tr><td>③ Ký tự đặc biệt của HTML</td><td>dấu &lt;
      mở một thẻ; muốn hiện nó như chữ thường phải viết thành &amp;lt;</td><td>&lt;b&gt;
      là thẻ in đậm; &amp;lt;b&amp;gt; hiện ra đúng ba ký tự &lt;b&gt;</td></tr><tr><td>④
      Máy trạng thái</td><td>một vật chỉ ở một trạng thái tại một lúc, và chỉ đi theo
      các bước cho phép</td><td>đèn giao thông: xanh → vàng → đỏ</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều. Cây là cấu trúc mà mỗi nút có một nút cha
      và có thể có nhiều nút con, giống thư mục trên máy. Đường dẫn là dãy tên nối
      bằng dấu gạch chéo, còn phần sau dấu chấm cuối là phần mở rộng, cho biết dạng
      muốn nhận. Trong trang web, dấu nhỏ hơn mở một thẻ, nên muốn hiện nó như chữ
      thường thì phải viết thành một mã bốn ký tự. Máy trạng thái là một vật chỉ ở
      một trạng thái tại một lúc, và chỉ đi theo các bước cho phép, giống đèn giao
      thông.
  - show: '<div class="box"><b>Ví dụ số.</b> Đường dẫn <code>/content/site/vi/home</code>
      có <b>4</b> cấp: content → site → vi → home.

      <br>Chuỗi <code>&lt;b&gt;</code> có <b>2</b> ký tự đặc biệt; sau khi thoát thành
      <code>&amp;lt;b&amp;gt;</code>, dài <b>3 + 2 × 3 = 9</b> ký tự.</div>

      '
    say: Một ví dụ số. Đường dẫn đang hiện có bốn cấp, đi từ nút gốc qua ba nút trung
      gian tới nút cuối. Chuỗi thẻ in đậm dài ba ký tự, trong đó có hai ký tự đặc
      biệt. Vì mỗi ký tự đặc biệt dài thêm ba ký tự khi thoát, nên chuỗi sau khi thoát
      dài chín ký tự.
- id: sym
  kind: symbol
  title: Giải mã từ ngữ và sáu trạng thái của gói
  checks:
  - alg.bnx_l22_props('/content/site/vi/home')['jcr:primaryType'] == 'nt:unstructured'
  - alg.bnx_l22_split('/content/site/vi/home.in.a4.html')[1:3] == (['in', 'a4'], 'html')
  - len({s for s in ('INSTALLED', 'RESOLVED', 'STARTING', 'ACTIVE', 'STOPPING', 'UNINSTALLED')
    if alg.bnx_l22_bundle_step(s, 'x') is None}) == 6
  - all(alg.bnx_l22_bundle_step('UNINSTALLED', e) is None for e in ('resolve', 'start',
    'started', 'stop', 'stopped', 'uninstall'))
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>AEM (Adobe
      Experience Manager)</td><td>hệ quản trị nội dung trang web; bài này chỉ dạy
      bốn nền móng bên dưới nó</td></tr><tr><td>JCR (Java Content Repository)</td><td>kho
      nội dung dạng cây. Mỗi mục là <b>nút</b> hoặc <b>thuộc tính</b>; nội dung thật
      nằm trong giá trị của thuộc tính</td></tr><tr><td>jcr:primaryType</td><td>thuộc
      tính bắt buộc, giữ tên kiểu nút chính; <code>nt:unstructured</code> cho phép
      nút con và thuộc tính tên bất kỳ</td></tr><tr><td>Sling, tài nguyên (resource)</td><td>tầng
      nhận yêu cầu web: đổi đường dẫn thành một tài nguyên trong kho</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã các từ của bài. Tên đầu tiên là hệ quản trị nội dung trang
      web, và bài chỉ dạy bốn nền móng bên dưới nó. Nền móng thứ nhất là kho nội dung
      dạng cây, mỗi mục là nút hoặc thuộc tính, và nội dung thật nằm trong giá trị
      của thuộc tính. Mỗi nút có một thuộc tính bắt buộc giữ tên kiểu nút chính, và
      kiểu đang hiện cho phép nút con và thuộc tính tên bất kỳ. Nền móng thứ hai là
      tầng nhận yêu cầu web, nó đổi đường dẫn thành một tài nguyên trong kho.
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>sling:resourceType</td><td>thuộc
      tính ghi <b>kiểu tài nguyên</b>; Sling dùng nó để tìm tệp dựng (script). AEM
      thật: nút trang là <code>cq:Page</code>, thuộc tính này nằm ở nút con <code>jcr:content</code>;
      bài gộp hai nút cho gọn</td></tr><tr><td>selector, extension</td><td>các khúc
      giữa tên tài nguyên và phần mở rộng (home<b>.in.a4</b>.html); phần mở rộng là
      khúc cuối</td></tr><tr><td>HTL (HTML Template Language)</td><td>ngôn ngữ khuôn
      mẫu: biểu thức <code><span>&#36;</span>{…}</code> và các thuộc tính <code>data-sly-*</code></td></tr><tr><td>OSGi,
      bundle, service</td><td>khung mô-đun của Java: mã đóng thành <b>gói</b> (bundle)
      có vòng đời; gói đăng ký <b>dịch vụ</b> cho gói khác dùng</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng tiếp theo cho bốn từ còn lại. Thuộc tính kiểu tài nguyên là thứ tầng
      này dùng để tìm tệp dựng, và ở hệ thật nó nằm ở nút con của nút trang, còn bài
      gộp hai nút cho gọn. Bộ chọn là các khúc nằm giữa tên tài nguyên và phần mở
      rộng, còn phần mở rộng là khúc cuối. Nền móng thứ ba là ngôn ngữ khuôn mẫu,
      gồm biểu thức trong ngoặc nhọn và các thuộc tính đặc biệt của thẻ. Nền móng
      thứ tư là khung mô-đun của Java, nơi mã đóng thành gói có vòng đời, và gói đăng
      ký dịch vụ cho gói khác dùng.
  - show: <table class='t'><tr><th>trạng thái của gói (bundle)</th><th>nghĩa theo
      đặc tả OSGi Core 8</th></tr><tr><td>INSTALLED</td><td>gói đã được cài thành
      công</td></tr><tr><td>RESOLVED</td><td>mọi lớp Java gói cần đều có; gói sẵn
      sàng được khởi động, hoặc vừa dừng</td></tr><tr><td>STARTING</td><td>gói đang
      được khởi động</td></tr><tr><td>ACTIVE</td><td>gói đã kích hoạt xong và đang
      chạy</td></tr><tr><td>STOPPING</td><td>gói đang được dừng</td></tr><tr><td>UNINSTALLED</td><td>gói
      đã bị gỡ; không chuyển sang trạng thái nào khác được nữa</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    clear: true
    say: Một gói có sáu trạng thái. Trạng thái thứ nhất là đã cài thành công. Trạng
      thái thứ hai là đã phân giải, nghĩa là mọi lớp Java gói cần đều có, nên gói
      sẵn sàng được khởi động, hoặc vừa dừng. Trạng thái thứ ba là đang khởi động.
      Trạng thái thứ tư là đang chạy, tức gói đã kích hoạt xong. Trạng thái thứ năm
      là đang dừng. Trạng thái thứ sáu là đã gỡ, và từ đó gói không chuyển sang trạng
      thái nào khác được nữa.
