      dịch tối đa trong một tháng</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    introduces:
    - bnx_so_tham_chieu
    say: Bảng này giải mã bốn từ còn lại. Tài khoản liên kết là tài khoản hoặc thẻ
      ghi nợ của chính khách, dùng để nạp và rút. Mã định danh khoản phải nộp gắn
      với một khoản thuế, lấy từ cổng thuế, tức trang điện tử của cơ quan thuế. Số
      tham chiếu là số ngân hàng tạo cho chứng từ nộp ngân sách. Hạn mức tháng là
      tổng giá trị giao dịch tối đa trong một tháng.
  - show: '<table class=''t''><tr><th>văn bản</th><th>điều bài dùng</th><th>tình trạng</th></tr><tr><td>Nghị
      định 52/2024/NĐ-CP</td><td>nghị định nền về thanh toán không dùng tiền mặt (15/5/2024);
      bài không dẫn điều cụ thể nào của nó</td><td><span class=''note''>cần kiểm lại
      văn bản hiện hành</span></td></tr><tr><td>Thông tư 40/2024/TT-NHNN (bản hợp
      nhất 76/VBHN-NHNN; VBHN = văn bản hợp nhất: một bản ghép văn bản ban đầu với
      các lần sửa)</td><td>Điều 27 khoản 1: tổng số dư các tài khoản đảm bảo không
      thấp hơn tổng số dư các ví <b>tại cùng một thời điểm</b>; hạn mức: tổng giao
      dịch qua các ví cá nhân của một khách tại một tổ chức tối đa 100 triệu đồng/tháng
      (tính chuyển tiền và thanh toán; không tính rút về tài khoản liên kết của chính
      mình)</td><td><span class=''note''>kiểm lại trước khi áp dụng</span></td></tr><tr><td>Thông
      tư 41/2025/TT-NHNN</td><td>thêm một hạn mức riêng, không quá 300 triệu đồng/tháng,
      cho <b>một số</b> khoản thanh toán thiết yếu (dịch vụ công, điện, nước, học
      phí, viện phí…)</td><td>hiệu lực 05/11/2025</td></tr></table>'
    clear: true
    say: Ba văn bản đầu nói về ví, nghị định năm mươi hai là nghị định nền về thanh
      toán không dùng tiền mặt, bài không dẫn điều nào của nó và cần kiểm lại văn
      bản hiện hành. Thông tư bốn mươi là văn bản hợp nhất, tức bản ghép văn bản ban
      đầu với các lần sửa, và đòi tài khoản đảm bảo không thấp hơn tổng ví. Nó cũng
      đặt mức một trăm triệu đồng một tháng cho ví cá nhân của một khách. Thông tư
      bốn mươi mốt cho thêm hạn mức riêng tới ba trăm triệu cho một số khoản thiết
      yếu.
  - show: '<table class=''t''><tr><th>văn bản</th><th>điều bài dùng</th><th>tình trạng</th></tr><tr><td>Thông
      tư 19/2021/TT-BTC</td><td>nộp thuế điện tử: mã định danh khoản phải nộp; ngân
      hàng tạo số tham chiếu và chuyển cùng số tiền sang ngân hàng nơi Kho bạc mở
      tài khoản</td><td><span class=''note''>đã sửa đổi, cần kiểm lại</span></td></tr><tr><td>Luật
      Quản lý thuế 108/2025/QH15, Điều 14 khoản 5</td><td>nộp điện tử: ngày nộp thuế
      là ngày ngân hàng trích tiền từ tài khoản người nộp</td><td><span class=''note''>thay
      luật cũ từ 01/7/2026; nguồn tổng hợp, cần kiểm lại</span></td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
    say: Hai văn bản còn lại nói về nộp thuế. Thông tư mười chín quy định nộp thuế
      điện tử và đã được sửa, nên cần kiểm lại. Luật Quản lý thuế mới thay luật cũ
      từ tháng bảy năm hai nghìn không trăm hai mươi sáu, và ngày nộp thuế điện tử
      là ngày ngân hàng trích tiền.
