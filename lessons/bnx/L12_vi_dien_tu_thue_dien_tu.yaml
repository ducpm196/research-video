    2000000)])[0] == 2500000'
  - 'alg.bnx_wallet_run(500000, {''A'': 0, ''B'': 0, ''C'': 500000}, [(''nap'', ''A'',
    2000000), (''chuyen'', ''A'', ''B'', 800000)])[1] == {''A'': 1200000, ''B'': 800000,
    ''C'': 500000}'
  - '(lambda r: r[1][''B''] == 300000 and r[0] == 2000000)(alg.bnx_wallet_run(500000,
    {''A'': 0, ''B'': 0, ''C'': 500000}, [(''nap'', ''A'', 2000000), (''chuyen'',
    ''A'', ''B'', 800000), (''rut'', ''B'', 500000)]))'
  - alg.bnx_invariant(2000000, [500000, 1200000, 300000]) == (True, 2000000, 0)
  steps:
  - show: '<p>Đầu ngày: tài khoản khách A <b>5 000 000</b>; ví A 0, ví B 0, ví C <b>500
      000</b>; tài khoản đảm bảo <b>500 000</b>. <span class=''note''>(số minh hoạ)</span></p>

      $$① \; \text{nạp: }5\,000\,000 - 2\,000\,000 = \hl{3\,000\,000};\quad 500\,000
      + 2\,000\,000 = \hl{2\,500\,000}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Đầu ngày tài khoản khách A có năm triệu, ví C và tài khoản đảm bảo mỗi bên
      năm trăm nghìn. A nạp hai triệu: tài khoản của A còn ba triệu, tài khoản đảm
      bảo thành hai triệu năm trăm nghìn.'
  - show: '<p>Dùng lại ví A = 2 000 000 ở phép ①.</p>

      $$② \; \text{A chuyển B: } 2\,000\,000 - 800\,000 = \hl{1\,200\,000};\quad \text{ví
      B} = 800\,000$$

      '
    clear: true
    say: 'A chuyển cho B tám trăm nghìn: ví A còn một triệu hai trăm nghìn, ví B có
      tám trăm nghìn, tài khoản đảm bảo không đổi.'
  - show: '$$③ \; \text{B rút: } 800\,000 - 500\,000 = \hl{300\,000};\quad 2\,500\,000
      - 500\,000 = \hl{2\,000\,000}$$'
    clear: true
    say: 'B rút năm trăm nghìn: ví B còn ba trăm nghìn, tài khoản đảm bảo còn hai
      triệu.'
  - show: $$④ \; \text{tổng ví} = 500\,000 + 1\,200\,000 + 300\,000 = \hl{2\,000\,000}$$
    clear: true
    say: Tổng ba ví là năm trăm nghìn cộng một triệu hai trăm nghìn cộng ba trăm nghìn,
      bằng hai triệu.
  - show: $$⑤ \; 2\,000\,000 \geq 2\,000\,000 \;\Rightarrow\; \hlg{\text{đạt, phần
      dư } 0}$$
    clear: true
    say: Hai triệu lớn hơn hoặc bằng hai triệu nên bất biến đạt, phần dư bằng không.
    introduces:
    - implies
