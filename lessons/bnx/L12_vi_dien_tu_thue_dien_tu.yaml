    - '1.2'
    - 0
    clear: true
    say: Bước ba, ví B rút năm trăm nghìn về tài khoản liên kết. Ở sổ ngân hàng, ghi
      Nợ tài khoản đảm bảo năm trăm nghìn và ghi Có tài khoản khách B năm trăm nghìn,
