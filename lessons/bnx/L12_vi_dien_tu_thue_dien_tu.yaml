scenes:
- id: hook
  kind: hook
  title: 'Ví hiện 2 000 000 đồng: tiền đó nằm ở đâu?'
  checks:
  - 'alg.bnx_wallet_run(0, {''A'': 0}, [(''nap'', ''A'', 2000000)])[1][''A''] == 2000000'
  - 'alg.bnx_wallet_run(0, {''A'': 0}, [(''nap'', ''A'', 2000000)])[0] == 2000000'
  steps:
  - show: '<p>Bạn nạp <b>2 000 000 đồng</b> từ tài khoản ngân hàng vào ví điện tử.
      Ứng dụng ví hiện số dư 2 000 000.</p>

      <div class="box key">Nếu máy chủ của tổ chức ví hỏng cả ngày, 2 000 000 đó <b>nằm
      ở đâu</b>? Và khi nộp thuế qua ngân hàng, ngày nào được tính là <b>đã nộp</b>,
      và ngân hàng còn phải làm gì sau khi trích tiền?</div>

      <span class=''note''>(mọi số tiền trong bài là số minh hoạ)</span>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    say: Chào bạn, giả sử bạn nạp hai triệu đồng từ tài khoản ngân hàng vào ví điện
      tử, và ứng dụng ví hiện số dư hai triệu. Nếu máy chủ của tổ chức ví hỏng cả
      ngày, thì hai triệu đó nằm ở đâu? Và khi nộp thuế qua ngân hàng, ngày nào được
      tính là đã nộp, và ngân hàng còn phải làm gì sau khi trích tiền? Mọi số tiền
      trong bài là số minh hoạ.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>phần trả lời trong bài</th></tr><tr><td>tiền
      thật nằm ở đâu</td><td>tài khoản đảm bảo thanh toán của tổ chức ví, mở tại ngân
      hàng</td></tr><tr><td>nạp, rút, chuyển ghi sổ thế nào</td><td>bút toán ở sổ
      ngân hàng và sổ ví</td></tr><tr><td>cuối ngày kiểm gì</td><td>tài khoản đảm
      bảo không thấp hơn tổng số dư ví</td></tr><tr><td>một tháng được dùng bao nhiêu</td><td>cộng
      dồn, từ chối giao dịch làm vượt hạn mức</td></tr><tr><td>nộp thuế: ngày nào
      là đã nộp, ngân hàng xong việc khi nào</td><td>ngày ngân hàng trích tiền, ghi
      trên chứng từ; ngân hàng xong khi chứng từ đã sang phía Kho bạc và đối soát
      khớp số tham chiếu</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: Bài này trả lời năm câu hỏi. Tiền thật nằm ở tài khoản nào. Nạp, rút và chuyển
      tiền được ghi vào những cuốn sổ nào. Cuối ngày phải kiểm điều gì. Một tháng
      được dùng ví bao nhiêu. Và khi nộp thuế qua ngân hàng, ngày nào là ngày đã nộp,
      còn ngân hàng xong việc khi nào.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 'alg.bnx_tax_recon({''R1'': 1, ''R2'': 1, ''R3'': 1}, {''R1'': 1, ''R3'': 1})[''chua_sang'']
    == [''R2'']'
  - alg.bnx_monthly_limit([30, 45, 20], 10**9)[-1][2] == 95
  - 5000000 - 2000000 == 3000000
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Nợ và Có</td><td>mỗi giao dịch: tổng Nợ bằng tổng Có; tài khoản tiền gửi: ghi
      Nợ là giảm, ghi Có là tăng</td><td>Nợ khách 2 000 000, Có tài khoản khác 2 000
      000</td></tr><tr><td>② Hai cuốn sổ</td><td>ngân hàng ghi số dư tài khoản; tổ
      chức ví ghi sổ ví: mỗi khách có bao nhiêu trong ví</td><td>tài khoản 3 000 000;
      ví 2 000 000</td></tr><tr><td>③ Đối soát</td><td>so hai danh sách theo một khoá
      chung, tìm dòng có bên này mà bên kia không có</td><td>{R1, R2, R3} so với {R1,
      R3}: lệch R2</td></tr><tr><td>④ Cộng dồn</td><td>giữ một tổng chạy, cộng thêm
      từng giao dịch</td><td>30 + 45 + 20 = 95 (triệu)</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều. Ở bài trước, mỗi giao dịch ghi Nợ và Có với
      tổng bằng nhau, và với tài khoản tiền gửi thì ghi Nợ là giảm, ghi Có là tăng.
      Hôm nay có hai cuốn sổ. Ngân hàng ghi số dư tài khoản, còn tổ chức ví ghi sổ
      ví, tức mỗi khách có bao nhiêu trong ví. Đối soát là so hai danh sách theo một
      khoá chung để tìm dòng bên này có mà bên kia không có. Cộng dồn là giữ một tổng
      chạy và cộng thêm từng giao dịch.
  - show: $$30 + 45 + 20 = 95 \text{ triệu đồng}$$
    say: Một ví dụ số cho cộng dồn. Ba mươi triệu cộng bốn mươi lăm triệu cộng hai
      mươi triệu, bằng chín mươi lăm triệu đồng. Ta sẽ dùng lại con số này khi kiểm
      hạn mức.
- id: sym
  kind: symbol
  title: Giải mã từ ngữ và văn bản pháp lý
  checks:
  - '[x[1] for x in alg.bnx_monthly_limit([100_000_000, 1], 100_000_000)] == [True,
    False]'
  - '[x[1] for x in alg.bnx_monthly_limit([100_000_000, 1], 300_000_000)] == [True,
    True]'
  - 300_000_000 // 100_000_000 == 3
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>tổ chức ví</td><td>tổ
      chức cung ứng dịch vụ ví điện tử: giữ sổ ví; tiền của các ví nằm ở tài khoản
      đảm bảo</td></tr><tr><td>tài khoản đảm bảo thanh toán</td><td>tài khoản của
      tổ chức ví mở tại ngân hàng: nơi tiền thật của mọi ví nằm</td></tr><tr><td>tài
      khoản liên kết</td><td>tài khoản thanh toán hoặc thẻ ghi nợ <b>của chính khách</b>,
      dùng để nạp và rút</td></tr><tr><td>hạn mức tháng</td><td>tổng giá trị giao
      dịch tối đa trong một tháng</td></tr><tr><td>mã định danh khoản phải nộp (ID)</td><td>mã
      gắn với một khoản thuế phải nộp, lấy từ cổng thuế</td></tr><tr><td>số tham chiếu</td><td>số
      do ngân hàng tạo cho chứng từ nộp ngân sách, đi kèm số tiền sang phía Kho bạc</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Bảng này giải mã sáu từ. Tổ chức ví là tổ chức cung ứng dịch vụ ví điện tử,
      giữ sổ ví, còn tiền của các ví nằm ở tài khoản đảm bảo. Tài khoản đảm bảo thanh
      toán là tài khoản của tổ chức ví mở tại ngân hàng, nơi tiền thật của mọi ví
      nằm. Tài khoản liên kết là tài khoản thanh toán hoặc thẻ ghi nợ của chính khách,
      dùng để nạp và rút. Hạn mức tháng là tổng giá trị giao dịch tối đa trong một
      tháng. Mã định danh khoản phải nộp gắn với một khoản thuế, lấy từ cổng thuế.
      Số tham chiếu do ngân hàng tạo cho chứng từ nộp ngân sách, đi kèm số tiền sang
      phía Kho bạc.
  - show: '<table class=''t''><tr><th>văn bản</th><th>điều bài dùng</th></tr><tr><td>Nghị
      định 52/2024/NĐ-CP (hiệu lực 01/7/2024)</td><td>tổng số dư tài khoản đảm bảo
      thanh toán <b>không thấp hơn</b> tổng số dư các ví đã phát hành; chỉ cho dùng
      ví có liên kết tài khoản thanh toán hoặc thẻ ghi nợ của chính khách</td></tr><tr><td>Thông
      tư 40/2024/TT-NHNN</td><td>tổng giao dịch qua các ví cá nhân của một khách tại
      một tổ chức tối đa 100 triệu đồng/tháng <span class=''note''>(văn bản hiện hành,
      kiểm lại trước khi áp dụng)</span> <span class=''note''>(tính chuyển tiền và
      thanh toán; không tính rút về tài khoản liên kết của chính mình)</span></td></tr><tr><td>Thông
      tư 41/2025/TT-NHNN (hiệu lực 05/11/2025)</td><td>cho phép <b>thêm</b> một hạn
      mức riêng, không quá 300 triệu đồng/tháng, cho <b>một số</b> khoản thanh toán
      thiết yếu (dịch vụ công, điện, nước, học phí, viện phí…)</td></tr><tr><td>Thông
      tư 19/2021/TT-BTC</td><td>nộp thuế điện tử: mã định danh khoản phải nộp; ngân
      hàng tạo số tham chiếu, chuyển cùng số tiền sang ngân hàng nơi Kho bạc mở tài
      khoản</td></tr><tr><td>Luật Quản lý thuế 38/2019/QH14, Điều 58</td><td>nộp không
      bằng tiền mặt: ngày đã nộp thuế là ngày ngân hàng trích tiền từ tài khoản người
      nộp và được ghi nhận trên chứng từ nộp tiền thuế</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.6'
    clear: true
    say: Năm văn bản này là căn cứ của bài. Nghị định năm mươi hai năm hai nghìn không
      trăm hai mươi tư nói tổng số dư tài khoản đảm bảo không thấp hơn tổng số dư
      các ví. Nghị định này cũng chỉ cho dùng ví có liên kết tài khoản của chính khách.
      Theo Thông tư bốn mươi năm hai nghìn không trăm hai mươi tư, tổng giao dịch
      qua các ví cá nhân của một khách tại một tổ chức tối đa một trăm triệu đồng
      một tháng. Hạn mức này tính chuyển tiền và thanh toán, không tính tiền rút về
      tài khoản liên kết của chính mình. Thông tư bốn mươi mốt năm hai nghìn không
      trăm hai mươi lăm cho phép thêm một hạn mức riêng, không quá ba trăm triệu,
      cho một số khoản thanh toán thiết yếu. Thông tư mười chín năm hai nghìn không
      trăm hai mươi mốt quy định cách nộp thuế điện tử, có mã định danh khoản phải
      nộp và số tham chiếu. Luật Quản lý thuế năm hai nghìn không trăm mười chín,
      Điều năm mươi tám, quy định ngày đã nộp thuế khi nộp không bằng tiền mặt. Đó
      là ngày ngân hàng trích tiền từ tài khoản người nộp và được ghi trên chứng từ
      nộp tiền thuế.
