  - show: '<p><b>Bước 4.</b> Nạp và rút đổi tài khoản đảm bảo và tổng ví <b>cùng một
      lượng</b>; chuyển ví → ví không đổi cả hai. Vì vậy hiệu giữ nguyên qua mọi giao
      dịch đúng:</p>

      $$\text{đảm bảo} - \text{tổng ví} \geq 0$$

      <span class=''note''>Làm thử: đầu ngày 500 000 − 500 000 = 0; sau ba bước 2
      000 000 − 2 000 000 = 0. Hiệu đổi mà không có giao dịch giải thích được là có
      lỗi.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    clear: true
    say: Bước bốn là bất biến. Nạp và rút làm tài khoản đảm bảo và tổng ví thay đổi
      cùng một lượng, còn chuyển ví sang ví không đổi cả hai. Vì vậy hiệu giữa tài
      khoản đảm bảo và tổng ví giữ nguyên qua mọi giao dịch đúng, và phải lớn hơn
      hoặc bằng không. Làm thử, đầu ngày năm trăm nghìn trừ năm trăm nghìn bằng không,
      sau ba bước hai triệu trừ hai triệu vẫn bằng không. Nếu hiệu đổi mà không có
      giao dịch nào giải thích được, là có lỗi.
  - show: '<div class="code"><div>HAN_MUC = 100_000_000   # theo Thông tư 40/2024;
      kiểm lại văn bản</div><div>giao_dich = [30_000_000, 45_000_000, 20_000_000,
      10_000_000]</div><div>da_dung = 0</div><div>for so_tien in giao_dich:</div><div>    if
      da_dung + so_tien &gt; HAN_MUC:</div><div>        print("từ chối", so_tien,
      "đã dùng", da_dung)</div><div>    else:</div><div>        da_dung += so_tien</div><div>        print("chấp
      nhận", so_tien, "đã dùng", da_dung)</div></div><p><b>Bước 5 — kết quả chạy thật:
      cộng dồn, từ chối giao dịch làm vượt</b></p><div class="code"><div>chấp nhận
      30000000 đã dùng 30000000</div><div>chấp nhận 45000000 đã dùng 75000000</div><div>chấp
      nhận 20000000 đã dùng 95000000</div><div>từ chối 10000000 đã dùng 95000000</div></div>'
    focus:
    - 2
    - '1.5'
    - '3.3'
    - '3.4'
    clear: true
    say: Bước năm là hạn mức tháng. Chương trình Python giữ tổng đã dùng trong tháng,
      và trước mỗi giao dịch kiểm xem cộng thêm có vượt một trăm triệu không. Ba giao
      dịch đầu được chấp nhận, tổng chạy lên chín mươi lăm triệu, đúng con số cộng
      dồn lúc nãy. Giao dịch thứ tư chỉ mười triệu nhưng bị từ chối, vì chín mươi
      lăm cộng mười là một trăm lẻ năm triệu, vượt hạn mức.
  - show: '<p><b>Bước 6. Nộp thuế: đối soát theo số tham chiếu (R1, R2, R3 là nhãn
      minh hoạ)</b></p><div class="code"><div>ngan_hang = {"R1": 1_500_000, "R2":
      2_000_000, "R3": 800_000}</div><div>kho_bac = {"R1": 1_500_000, "R3": 800_000}</div><div>for
      so_tc, tien in ngan_hang.items():</div><div>    if so_tc not in kho_bac:</div><div>        print(so_tc,
      "chưa sang Kho bạc: phải tra soát")</div><div>    elif kho_bac[so_tc] != tien:</div><div>        print(so_tc,
      "lệch số tiền")</div><div>    else:</div><div>        print(so_tc, "khớp")</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>R1 khớp</div><div>R2 chưa sang Kho
      bạc: phải tra soát</div><div>R3 khớp</div></div>'
    focus:
    - 1
    - - '2.1'
      - '2.2'
    - - '2.1'
      - '2.2'
    - '4.2'
    - 0
    clear: true
    say: Bước sáu là đối soát nộp thuế. Hai danh sách được so theo số tham chiếu,
      ở đây ghi tạm là R một, R hai, R ba, không phải cấu trúc số thật. Ngân hàng
      đã trích tiền cả ba chứng từ, nhưng phía Kho bạc mới có R một và R ba. Vì vậy
      máy báo R hai chưa sang phía Kho bạc, nên ngân hàng chưa xong việc và phải tra
      soát, dù ngày đã nộp của người nộp vẫn là ngày trích tiền. Thực tế còn phải
      so cả chiều ngược lại.
- id: example
  kind: example
  title: Ví dụ một ngày của ba ví, từng phép tính
  checks:
  - 'alg.bnx_wallet_run(500000, {''A'': 0, ''B'': 0, ''C'': 500000}, [(''nap'', ''A'',
    2000000)], {''A'': 5000000})[2][''A''] == 3000000'
  - 'alg.bnx_wallet_run(500000, {''A'': 0, ''B'': 0, ''C'': 500000}, [(''nap'', ''A'',
    2000000)])[0] == 2500000'
  - 'alg.bnx_wallet_run(500000, {''A'': 0, ''B'': 0, ''C'': 500000}, [(''nap'', ''A'',
    2000000), (''chuyen'', ''A'', ''B'', 800000)])[1] == {''A'': 1200000, ''B'': 800000,
    ''C'': 500000}'
  - '(lambda r: r[1][''B''] == 300000 and r[0] == 2000000)(alg.bnx_wallet_run(500000,
    {''A'': 0, ''B'': 0, ''C'': 500000}, [(''nap'', ''A'', 2000000), (''chuyen'',
    ''A'', ''B'', 800000), (''rut'', ''B'', 500000)]))'
  - alg.bnx_invariant(2000000, [500000, 1200000, 300000]) == (True, 2000000, 0)
  steps:
  - show: '<p>Đầu ngày: tài khoản khách A <b>5 000 000</b>; ví A 0, ví B 0, ví C <b>500
      000</b>; tài khoản đảm bảo <b>500 000</b>. <span class=''note''>(mọi số tiền
      trong bài là số minh hoạ)</span></p>

      $$① \; \text{nạp: } 5\,000\,000 - 2\,000\,000 = \hl{3\,000\,000};\quad 500\,000
      + 2\,000\,000 = \hl{2\,500\,000}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Ta theo dõi một ngày. Đầu ngày, tài khoản khách A có năm triệu, ví A và ví
      B bằng không, ví C năm trăm nghìn, tài khoản đảm bảo năm trăm nghìn. Phép tính
      thứ nhất, A nạp hai triệu. Tài khoản của A còn năm triệu trừ hai triệu, bằng
      ba triệu. Tài khoản đảm bảo thành năm trăm nghìn cộng hai triệu, bằng hai triệu
      năm trăm nghìn, và ví A bằng hai triệu.
  - show: '<p>Dùng lại ví A = 2 000 000 ở phép ①.</p>

      $$② \; \text{A chuyển B: } 2\,000\,000 - 800\,000 = \hl{1\,200\,000};\quad \text{ví
      B} = 800\,000$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ hai, dùng lại ví A hai triệu. A chuyển cho B tám trăm nghìn,
      ví A còn một triệu hai trăm nghìn, ví B có tám trăm nghìn. Tài khoản đảm bảo
      vẫn hai triệu năm trăm nghìn.
  - show: '$$③ \; \text{B rút: } 800\,000 - 500\,000 = \hl{300\,000};\quad 2\,500\,000
      - 500\,000 = \hl{2\,000\,000}$$'
    say: Phép tính thứ ba, B rút năm trăm nghìn. Ví B còn tám trăm nghìn trừ năm trăm
      nghìn, bằng ba trăm nghìn. Tài khoản đảm bảo còn hai triệu năm trăm nghìn trừ
      năm trăm nghìn, bằng hai triệu.
  - show: $$④ \; \text{tổng ví} = 500\,000 + 1\,200\,000 + 300\,000 = \hl{2\,000\,000}$$
    say: Phép tính thứ tư, cộng ba ví C, A và B, năm trăm nghìn cộng một triệu hai
      trăm nghìn cộng ba trăm nghìn, bằng hai triệu.
  - show: $$⑤ \; 2\,000\,000 \geq 2\,000\,000 \;\Rightarrow\; \hlg{\text{đạt, phần
      dư } 0}$$
    say: Phép tính thứ năm, tài khoản đảm bảo hai triệu lớn hơn hoặc bằng tổng ví
      hai triệu, suy ra bất biến đạt, phần dư bằng không. Ba ví này cần tài khoản
      đảm bảo ít nhất hai triệu.
    introduces:
    - implies
