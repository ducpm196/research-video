- id: quymo
  kind: example
  title: 'Khi số chứng từ lớn dần: đối soát chậm tới đâu'
  checks:
  - '[alg.bnx_l12_scan_cmp(n) for n in (100, 10_000, 1_000_000)] == [5050, 50_005_000,
    500_000_500_000]'
  - '[alg.bnx_l12_lookup_cmp(n) for n in (100, 10_000, 1_000_000)] == [100, 10_000,
    1_000_000]'
  - '[alg.bnx_l12_time_s(alg.bnx_l12_scan_cmp(n), 50) for n in (100, 10_000)] == [0.0002525,
    2.50025]'
  - round(alg.bnx_l12_time_s(alg.bnx_l12_scan_cmp(1_000_000), 50)) == 25000 and 6.9
    < alg.bnx_l12_time_s(alg.bnx_l12_scan_cmp(1_000_000), 50) / 3600 < 7
  - '[alg.bnx_l12_time_s(alg.bnx_l12_lookup_cmp(n), 50) for n in (100, 10_000, 1_000_000)]
    == [0.000005, 0.0005, 0.05]'
  - 9900 < alg.bnx_l12_scan_cmp(10_000) / alg.bnx_l12_scan_cmp(100) < 9910
  - 10_000 // 100 == 100 and 1_000_000 // 100 == 10_000
  steps:
  - show: '<p><b>Cách 1: với mỗi chứng từ ngân hàng, quét danh sách của Kho bạc tới
      khi gặp</b></p><div class="code"><div>def quet_danh_sach(n):</div><div>    kho_bac
      = list(range(n))</div><div>    dem = 0</div><div>    for so_nh in range(n):</div><div>        for
      so_kb in kho_bac:</div><div>            dem += 1</div><div>            if so_kb
      == so_nh:</div><div>                break</div><div>    return dem</div></div><p
      class="note"><code>def</code> định nghĩa hàm; <code>return</code> trả kết quả;
      <code>range(n)</code> là dãy 0 tới n−1; <code>break</code> thoát vòng lặp; <b>vòng
      lặp lồng</b> là vòng này nằm trong vòng kia; <code>set</code> (bước sau) là
      tập hợp tra nhanh.</p>'
    focus:
    - 2
    - - '2.5'
      - '2.6'
    - - '2.3'
      - '2.4'
      - '2.5'
    clear: true
    say: Đối soát chạy hằng ngày, nên ta xem nó đổi thế nào khi số chứng từ n lớn
      dần. Cách một dùng vòng lặp lồng, tức vòng trong quét danh sách của Kho bạc
      từ đầu tới khi gặp, còn biến đếm ghi số phép so sánh. Chứng từ thứ i phải quét
      i phần tử mới gặp, nên n chứng từ tốn một cộng hai cộng dần tới n phép, tức
      n nhân n cộng một rồi chia hai.
  - show: '<p><b>Cách 2: đưa danh sách Kho bạc vào bảng tra (tập hợp), mỗi chứng từ
      chỉ tra một lần</b></p><div class="code"><div>def tra_bang(n):</div><div>    kho_bac
      = set(range(n))</div><div>    dem = 0</div><div>    for so_nh in range(n):</div><div>        dem
      += 1</div><div>        if so_nh not in kho_bac:</div><div>            print("thieu",
      so_nh)</div><div>    return dem</div></div>'
    focus:
    - - '2.2'
    - - '2.4'
      - '2.5'
      - '2.6'
    clear: true
    say: Cách hai đưa danh sách của Kho bạc vào một bảng tra, hỏi có hay không gần
      như tức thì. Mỗi chứng từ chỉ tra một lần, và biến đếm ghi số lần tra.
  - show: '<p><b>Chạy ở 100, 10 000 và 1 000 000 chứng từ</b></p><div class="code"><div>for
      n in (100, 10_000):</div><div>    ds, bt = quet_danh_sach(n), tra_bang(n)</div><div>    print("n
      =", n, "danh sach", ds, "bang tra", bt)</div><div>n = 1_000_000</div><div>tinh
      = n * (n + 1) // 2</div><div>print("n =", n, "danh sach (tinh)", tinh, "bang
      tra", tra_bang(n))</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>n
      = 100 danh sach 5050 bang tra 100</div><div>n = 10000 danh sach 50005000 bang
      tra 10000</div><div>n = 1000000 danh sach (tinh) 500000500000 bang tra 1000000</div></div><p
      class="note">Ở 1 000 000, cách 1 chỉ <b>tính</b> bằng công thức n(n+1)/2: chứng
      từ thứ i phải quét i phần tử mới gặp, nên tổng là 1 + 2 + … + n; chạy thật sẽ
      rất lâu.</p>'
    focus:
    - 2
    - - '4.1'
      - '4.2'
      - '4.3'
      - '5'
    - - '4.1'
      - '4.2'
      - '4.3'
    clear: true
    say: Ta chạy ở một trăm, mười nghìn và một triệu chứng từ. Cách một đo thật ở
      hai cỡ đầu, còn mức một triệu chỉ tính bằng công thức, vì chạy thật sẽ rất lâu.
      Cách hai đo thật ở cả ba cỡ.
  - show: '<table class=''t''><tr><th>số chứng từ n</th><th>cách 1: số phép so sánh</th><th>chờ
      nếu 50 ns mỗi phép (số minh hoạ)</th><th>cách 2: số lần tra</th><th>chờ nếu
      50 ns mỗi lần (số minh hoạ)</th></tr><tr><td>100 (×1)</td><td>5 050 (đo)</td><td>0,25
      ms (phần nghìn giây)</td><td>100 (đo)</td><td>5 µs (phần triệu giây)</td></tr><tr><td>10
      000 (×100)</td><td>50 005 000 (đo)</td><td>2,5 giây</td><td>10 000 (đo)</td><td>0,5
      ms</td></tr><tr><td>1 000 000 (×10 000)</td><td>500 000 500 000 (tính)</td><td>25
      000 giây, gần 7 giờ</td><td>1 000 000 (đo)</td><td>0,05 giây</td></tr></table>'
    focus:
    - - '1.2'
      - '1.3'
    - '1.4'
    clear: true
    say: Dữ liệu tăng một trăm lần thì cách một tăng gần mười nghìn lần, từ hơn năm
      nghìn lên hơn năm mươi triệu phép. Với số minh hoạ năm mươi nano giây mỗi phép,
      tức năm mươi phần tỉ giây, một triệu chứng từ tốn gần bảy giờ ở cách một, còn
      cách hai chỉ chừng năm mươi mili giây.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>quét
      danh sách (vòng lặp lồng)</td><td>đơn giản, không tốn thêm bộ nhớ</td><td>số
      phép tăng theo n nhân n (bình phương của n)</td><td>vài chục chứng từ</td></tr><tr><td>bảng
      tra</td><td>số lần tra tăng đúng theo n</td><td>tốn bộ nhớ cho cả bảng (ở đây
      một triệu mục)</td><td>từ hàng nghìn tới vài triệu chứng từ vừa bộ nhớ</td></tr><tr><td>để
      cơ sở dữ liệu ghép hai bảng theo một cột chung (phép nối bảng), hoặc sắp xếp
      hai tệp rồi đọc song song</td><td>không phải nạp hết vào bộ nhớ</td><td>phải
      dựng chỉ mục (mục lục để tra nhanh) hoặc thêm bước sắp xếp; bài này không chạy
      thử</td><td>dữ liệu quá lớn, không vừa bộ nhớ</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Quét danh sách đơn giản và không tốn bộ nhớ nhưng chỉ hợp vài chục chứng
      từ. Bảng tra đổi bộ nhớ lấy tốc độ, hợp tới vài triệu chứng từ. Dữ liệu lớn
      hơn nữa thì để cơ sở dữ liệu ghép hai bảng theo cột chung, hoặc sắp xếp hai
      tệp rồi đọc song song, hướng này ta chưa chạy thử.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_invariant(2000000, [2000000 + 1000000]) == (False, 3000000, -1000000)
  - '[x[1] for x in alg.bnx_monthly_limit([95_000_000, 10_000_000], 100_000_000)]
    == [True, False]'
  - '[x[1] for x in alg.bnx_monthly_limit([95_000_000, 10_000_000], 300_000_000)]
    == [True, True]'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ tiền “nằm trong ví”
      hay trong máy chủ của ứng dụng. Tiền thật nằm ở <b>tài khoản đảm bảo thanh toán
      tại ngân hàng</b>; sổ ví chỉ ghi tổ chức ví đang nợ mỗi khách bao nhiêu.

      <br><span class="note">Phép thử: hỏi “số này khớp với số dư tài khoản nào ở
      ngân hàng?”</span></div>

      '
    say: Lỗi của người mới là nghĩ tiền nằm trong ví hay trong máy chủ ứng dụng. Tiền
      thật nằm ở tài khoản đảm bảo tại ngân hàng, nên hãy hỏi số này khớp với số dư
      tài khoản nào.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Ghi tăng sổ ví <b>trước</b>
      khi ngân hàng xác nhận đã trích nợ. Lệnh nạp 1 000 000 hết giờ chờ, ngân hàng
      thật ra chưa trích, nhưng ví đã cộng:</div>

      $$2\,000\,000 + 1\,000\,000 = 3\,000\,000 \;>\; 2\,000\,000 \;\Rightarrow\;
      \text{thiếu } 1\,000\,000$$

      <span class="note">Phép thử: đối soát cuối ngày bắt được. Cách chữa: chỉ cộng
      ví khi có xác nhận; hỏi lại trạng thái lệnh hết giờ chờ.</span>

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi của người đã đi làm là ghi tăng sổ ví trước khi ngân hàng xác nhận trích
      nợ. Lệnh nạp một triệu hết giờ chờ mà ví đã cộng thì tổng ví thành ba triệu,
      lớn hơn tài khoản đảm bảo hai triệu, thiếu một triệu. Cách chữa là chỉ cộng
      ví khi có xác nhận, và hỏi lại trạng thái lệnh hết giờ.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Viết cứng <code>100_000_000</code>
      trong mã. Khi Thông tư 41/2025 cho thêm hạn mức riêng tới 300 triệu cho <b>một
      số</b> khoản thanh toán thiết yếu, hệ thống từ chối sai, hoặc sửa vội thành
      300 triệu cho mọi loại.

      <br><span class="note">Cách chữa: hạn mức là cấu hình gắn văn bản, ngày hiệu
      lực và loại giao dịch (kiểm lại văn bản hiện hành).</span></div>

      '
    clear: true
    say: Lỗi thứ ba là viết cứng một trăm triệu trong mã. Khi Thông tư bốn mươi mốt
      cho thêm hạn mức ba trăm triệu cho một số khoản thiết yếu, hệ thống từ chối
      sai hoặc bị sửa vội cho mọi loại. Hãy để hạn mức thành cấu hình gắn với văn
      bản, ngày hiệu lực và loại giao dịch.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_invariant(1900000, [700000, 900000, 400000]) == (False, 2000000, -100000)
  - alg.bnx_monthly_limit([92_000_000, 10_000_000], 100_000_000)[1] == (10_000_000,
    False, 92_000_000)
  - 100_000_000 - alg.bnx_monthly_limit([92_000_000], 100_000_000)[0][2] == 8_000_000
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Ba
      ví 700 000, 900 000, 400 000; tài khoản đảm bảo 1 900 000. Bất biến có đạt không,
      lệch bao nhiêu?</td></tr><tr><td>2</td><td>Hạn mức 100 000 000/tháng, đã dùng
      92 000 000. Giao dịch 10 000 000 có được không? Còn dùng tối đa bao nhiêu?</td></tr><tr><td>3</td><td>Quyết
      định: đối soát cuối ngày thấy chứng từ R2 đã trích tiền nhưng phía Kho bạc chưa
      có. Ngân hàng chuyển lại R2 ngay, hay tra soát với phía Kho bạc trước rồi mới
      xử lý?</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
    pause: 25
    say: 'Đến lượt bạn, ta có ba câu, câu một: ba ví có bảy trăm nghìn, chín trăm
      nghìn và bốn trăm nghìn, tài khoản đảm bảo một triệu chín trăm nghìn, bất biến
      có đạt không? Câu hai: hạn mức một trăm triệu, đã dùng chín mươi hai triệu,
      giao dịch mười triệu có được không? Câu ba: chứng từ R hai đã trích tiền nhưng
      Kho bạc chưa có, nên chuyển lại ngay hay tra soát trước? Hãy dừng video và làm
      ra giấy.'
  - show: $$700\,000 + 900\,000 + 400\,000 = 2\,000\,000 \;>\; 1\,900\,000 \;\Rightarrow\;
      \hl{\text{không đạt, thiếu } 100\,000}$$
