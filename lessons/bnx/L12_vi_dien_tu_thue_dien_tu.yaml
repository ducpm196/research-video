scenes:
- id: hook
  kind: hook
  title: 'Ví hiện 2 000 000 đồng: tiền đó nằm ở đâu?'
  checks:
  - 'alg.bnx_wallet_run(0, {''A'': 0}, [(''nap'', ''A'', 2000000)])[1][''A''] == 2000000'
  - 'alg.bnx_wallet_run(0, {''A'': 0}, [(''nap'', ''A'', 2000000)])[0] == 2000000'
  steps:
  - show: '<p>Bạn nạp <b>2 000 000 đồng</b> từ tài khoản ngân hàng vào ví điện tử,
      tức ứng dụng giữ tiền để thanh toán. Ứng dụng hiện số dư 2 000 000.</p>

      <div class="box key">Nếu máy chủ của công ty vận hành ví hỏng cả ngày, 2 000
      000 đó <b>nằm ở đâu</b>? Khi nộp thuế qua ngân hàng, ngày nào là <b>đã nộp</b>,
      và nếu mỗi ngày có cả triệu khoản nộp thì so khớp chúng chậm tới mức nào?</div>

      <span class=''note''>(mọi số tiền trong bài là số minh hoạ)</span>

      '
    focus:
    - 1
    - 2
    - 2
    say: Chào bạn, giả sử bạn nạp hai triệu đồng từ ngân hàng vào ví điện tử, tức
      ứng dụng giữ tiền để thanh toán, và ví hiện số dư hai triệu. Nếu máy chủ của
      công ty vận hành ví hỏng cả ngày, thì hai triệu đó nằm ở đâu? Khi nộp thuế qua
      ngân hàng, ngày nào là ngày đã nộp, và có cả triệu khoản nộp thì so khớp chậm
      tới mức nào?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>phần trả lời trong bài</th></tr><tr><td>tiền
      thật nằm ở đâu</td><td>tài khoản riêng của công ty vận hành ví (<b>tổ chức ví</b>),
      mở tại ngân hàng: <b>tài khoản đảm bảo thanh toán</b></td></tr><tr><td>nạp,
      rút, chuyển ghi sổ thế nào</td><td>mỗi việc là một <b>bút toán</b>: một dòng
      ghi sổ, trừ ở tài khoản này, cộng ở tài khoản kia</td></tr><tr><td>luật đòi
      gì ở tài khoản đảm bảo</td><td>mọi lúc không thấp hơn tổng số dư các ví; cuối
      ngày đối soát để kiểm</td></tr><tr><td>một tháng được dùng bao nhiêu</td><td>cộng
      dồn, từ chối giao dịch làm vượt <b>hạn mức</b> (mức tối đa)</td></tr><tr><td>nộp
      thuế: ngày nào là đã nộp, ngân hàng xong việc khi nào</td><td>ngày ngân hàng
      trích tiền; ngân hàng xong khi <b>chứng từ</b> (bản ghi điện tử của khoản nộp)
      sang <b>Kho bạc</b> (cơ quan nhà nước giữ ngân sách) và hai bên khớp</td></tr><tr><td>cả
      triệu chứng từ: so khớp nhanh hay chậm</td><td>đếm số phép so sánh ở 100, 10
      000 và 1 000 000 chứng từ</td></tr></table>'
    introduces:
    - bnx_tk_dam_bao
    - bnx_chung_tu
    - bnx_kho_bac
    clear: true
    say: Bài này trả lời sáu câu hỏi, tiền thật nằm ở tài khoản đảm bảo thanh toán,
      tài khoản riêng của tổ chức ví mở tại ngân hàng. Nạp, rút và chuyển đều là bút
      toán, tức một dòng ghi sổ, và mọi lúc tài khoản đảm bảo không được thấp hơn
      tổng số dư các ví. Mỗi tháng ví cộng dồn và từ chối giao dịch vượt hạn mức.
      Ngân hàng chỉ xong việc nộp thuế khi chứng từ sang Kho bạc, nơi giữ ngân sách
      nhà nước, và hai bên khớp. Cuối cùng ta đếm việc so khớp ở nhiều cỡ.
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - 'alg.bnx_tax_recon({''R1'': 1, ''R2'': 1, ''R3'': 1}, {''R1'': 1, ''R3'': 1})[''chua_sang'']
    == [''R2'']'
  - alg.bnx_monthly_limit([30, 45, 20], 10**9)[-1][2] == 95
  - 5000000 - 2000000 == 3000000
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Nợ và Có</td><td>mỗi bút toán ghi Nợ một tài khoản và ghi Có một tài khoản,
      cùng số tiền; với tài khoản tiền gửi: ghi Nợ là giảm, ghi Có là tăng</td><td>Nợ
      khách 2 000 000, Có tài khoản khác 2 000 000</td></tr><tr><td>② Hai cuốn sổ</td><td>ngân
      hàng ghi số dư tài khoản; tổ chức ví ghi sổ ví: mỗi khách có bao nhiêu trong
      ví</td><td>tài khoản 3 000 000; ví 2 000 000</td></tr><tr><td>③ Đối soát</td><td>so
      hai danh sách theo một khoá chung, tìm dòng có bên này mà bên kia không có</td><td>{R1,
      R2, R3} so với {R1, R3}: lệch R2</td></tr><tr><td>④ Cộng dồn</td><td>giữ một
      tổng chạy, cộng thêm từng giao dịch</td><td>30 + 45 + 20 = 95 (triệu)</td></tr><tr><td>⑤
      Đọc mã Python</td><td><code>for x in ds:</code> lặp qua từng phần tử; <code>+=</code>
      cộng dồn; <code>{khoá: giá trị}</code> là bảng tra theo khoá</td><td><code>da_dung
      += 30</code> cộng thêm 30 vào tổng</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: 'Trước hết ta cần hiểu năm điều, một, bút toán ghi Nợ một tài khoản và ghi
      Có một tài khoản cùng số tiền, và với tài khoản tiền gửi thì Nợ là giảm, Có
      là tăng. Hai, có hai cuốn sổ: ngân hàng ghi số dư tài khoản, còn tổ chức ví
      ghi sổ ví. Ba, đối soát là so hai danh sách theo một khoá chung để tìm dòng
      chỉ có ở một bên. Bốn, cộng dồn là giữ một tổng chạy rồi cộng thêm từng giao
      dịch. Năm, mã Python dùng vòng lặp qua từng phần tử, dấu cộng bằng để cộng dồn,
      và bảng tra theo khoá.'
  - show: $$30 + 45 + 20 = 95 \text{ triệu đồng}$$
    say: 'Một ví dụ số cho cộng dồn: ba mươi triệu cộng bốn mươi lăm triệu cộng hai
      mươi triệu bằng chín mươi lăm triệu đồng, con số ta dùng lại khi kiểm hạn mức.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th><th>ví dụ nhỏ</th></tr><tr><td><code>for
      ma, tien in bang.items():</code></td><td>lặp qua từng cặp (khoá, giá trị) của
      bảng tra</td><td>với <code>{"R1": 5}</code> thì ma là R1, tien là 5</td></tr><tr><td><code>x
      not in bang</code></td><td>x không có trong bảng</td><td><code>"R2" not in {"R1":
      5}</code> là đúng</td></tr><tr><td><code>g[0]</code>, <code>g[1]</code></td><td>phần
      tử thứ nhất, thứ hai của bộ g; máy đếm từ 0</td><td>g = ("nap", "A", 5) thì
      g[0] là "nap"</td></tr><tr><td><code>bao_dam, vi = 500_000, {…}</code></td><td>dấu
      phẩy ở hai vế: gán cùng lúc nhiều biến, giá trị thứ nhất cho biến thứ nhất,
      và tiếp theo</td><td><code>a, b = 1, 2</code> thì a là 1, b là 2</td></tr></table>'
    clear: true
    say: Mã Python còn vài ký hiệu nữa, lệnh lấy từng cặp của bảng tra cho ta khoá
      và giá trị. Cụm không có trong hỏi khoá có vắng không. Còn số không trong ngoặc
      vuông chỉ phần tử đầu của bộ, vì máy đếm từ không. Dấu phẩy ở hai vế gán cùng
      lúc nhiều biến.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th><th>ví dụ nhỏ</th></tr><tr><td><code>if
      a: … elif b: … else: …</code></td><td>thử điều kiện a trước; a sai mới thử b;
      cả hai sai thì chạy nhánh <code>else</code></td><td>x = 5: <code>if x &gt; 9</code>
      sai, <code>elif x &gt; 3</code> đúng, chạy nhánh elif</td></tr><tr><td><code>1
      if đk else -1</code></td><td>lấy 1 nếu điều kiện đúng, ngược lại lấy −1</td><td><code>1
      if 3 &gt; 2 else -1</code> là 1</td></tr><tr><td><code>sum(ds)</code>; <code>a
      // b</code></td><td>cộng mọi số trong ds; chia a cho b lấy phần nguyên</td><td><code>sum([2,
      3])</code> là 5; <code>7 // 2</code> là 3</td></tr><tr><td><code>1_000_000</code>;
      <code>list(range(3))</code></td><td>gạch dưới chỉ để dễ đọc, bằng một triệu;
      danh sách các số từ 0 tới 2</td><td><code>[0, 1, 2]</code></td></tr></table>'
    clear: true
    say: Cụm nếu, nếu khác, còn lại chạy nhánh đầu tiên có điều kiện đúng. Cụm một
      nếu điều kiện thì một, nếu không thì âm một, chọn giá trị theo điều kiện. Hàm
      cộng mọi số, còn hai gạch chéo chia lấy phần nguyên, nên bảy chia hai ra ba.
      Dấu gạch dưới trong số chỉ để dễ đọc, và dãy ba số từ không tới hai là một danh
      sách.
