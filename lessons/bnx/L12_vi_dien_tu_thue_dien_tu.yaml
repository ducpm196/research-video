- id: formula
  kind: formula
  title: 'Suy ra từng bước: nạp, chuyển, rút, bất biến, hạn mức, thuế'
  checks:
  - 'alg.bnx_wallet_run(500000, {''A'': 0, ''B'': 0, ''C'': 500000}, [(''nap'', ''A'',
    2000000)])[3] == [(''tiền gửi khách A'', ''đảm bảo thanh toán'', 2000000)]'
  - '(lambda r: r[0] == 2500000 and sum(r[1].values()) == 2500000)(alg.bnx_wallet_run(500000,
    {''A'': 0, ''B'': 0, ''C'': 500000}, [(''nap'', ''A'', 2000000), (''chuyen'',
    ''A'', ''B'', 800000)]))'
  - 'alg.bnx_wallet_run(500000, {''A'': 0, ''B'': 0, ''C'': 500000}, [(''nap'', ''A'',
    2000000), (''chuyen'', ''A'', ''B'', 800000)])[3] == [(''tiền gửi khách A'', ''đảm
    bảo thanh toán'', 2000000)]'
  - 'alg.bnx_wallet_run(2500000, {''A'': 1200000, ''B'': 800000, ''C'': 500000}, [(''rut'',
    ''B'', 500000)])[3] == [(''đảm bảo thanh toán'', ''tiền gửi khách B'', 500000)]'
  - 800000 >= 500000
  - 'alg.bnx_invariant(500000, {''C'': 500000})[2] == 0 and alg.bnx_invariant(2000000,
    [500000, 1200000, 300000])[2] == 0'
  - alg.bnx_monthly_limit([30_000_000, 45_000_000, 20_000_000, 10_000_000], 100_000_000)
    == [(30000000, True, 30000000), (45000000, True, 75000000), (20000000, True, 95000000),
    (10000000, False, 95000000)]
  - 95_000_000 + 10_000_000 > 100_000_000
  - 'alg.bnx_tax_recon({''R1'': 1500000, ''R2'': 2000000, ''R3'': 800000}, {''R1'':
    1500000, ''R3'': 800000}) == {''khop'': [''R1'', ''R3''], ''chua_sang'': [''R2''],
    ''lech_tien'': [], ''thua'': []}'
  steps:
  - show: '<table class=''t''><tr><th>Bước 1: nạp 2 000 000</th><th>sổ ngân hàng</th><th>sổ
      ví</th></tr><tr><td>ghi</td><td>Nợ tài khoản khách A 2 000 000; Có tài khoản
      đảm bảo 2 000 000</td><td>ví A tăng 2 000 000</td></tr><tr><td>vì sao</td><td>tiền
      thật rời tài khoản của khách sang tài khoản đảm bảo</td><td>tổ chức ví nợ khách
      thêm 2 000 000</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    say: Bước một là nạp hai triệu, sổ ngân hàng ghi Nợ tài khoản khách A và ghi Có
      tài khoản đảm bảo, vì tiền thật chuyển sang đó. Sổ ví cộng hai triệu cho ví
      A, vì tổ chức ví nợ khách thêm hai triệu.
  - show: '<table class=''t''><tr><th>Bước 2: ví A chuyển ví B 800 000</th><th>sổ
      ngân hàng</th><th>sổ ví</th></tr><tr><td>ghi</td><td>không có bút toán</td><td>ví
      A giảm 800 000; ví B tăng 800 000</td></tr><tr><td>vì sao</td><td>hai ví cùng
      một tổ chức: tiền thật vẫn nằm yên ở tài khoản đảm bảo</td><td>tổng ví không
      đổi</td></tr></table>'
    focus:
    - 0
    - - '1.2'
      - '1.3'
    clear: true
    say: Bước hai, ví A chuyển cho ví B tám trăm nghìn. Sổ ngân hàng không có bút
      toán vì tiền thật vẫn ở tài khoản đảm bảo, còn sổ ví ghi A giảm, B tăng nên
      tổng ví không đổi.
  - show: '<table class=''t''><tr><th>Bước 3: ví B rút 500 000</th><th>sổ ngân hàng</th><th>sổ
      ví</th></tr><tr><td>điều kiện</td><td>—</td><td>số dư ví B (800 000) ≥ 500 000;
      nếu thiếu thì từ chối</td></tr><tr><td>ghi</td><td>Nợ tài khoản đảm bảo 500
      000; Có tài khoản khách B 500 000</td><td>ví B giảm 500 000</td></tr><tr><td>vì
      sao</td><td>tiền thật ra khỏi tài khoản đảm bảo, về tài khoản liên kết của B</td><td>tổ
      chức ví bớt nợ B 500 000</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    say: Bước ba, ví B rút năm trăm nghìn, và chỉ được rút khi số dư ví đủ, thiếu
      thì từ chối. Sổ ngân hàng ghi Nợ tài khoản đảm bảo và ghi Có tài khoản khách
      B, vì tiền thật ra khỏi đó. Sổ ví giảm ví B năm trăm nghìn.
  - show: '<p><b>Bước 4.</b> Nạp và rút đổi tài khoản đảm bảo và tổng ví <b>cùng một
      lượng</b>; chuyển ví → ví không đổi cả hai. Vì vậy hiệu giữ nguyên qua mọi giao
      dịch đúng, gọi là <b>bất biến</b> (điều luôn đúng suốt quá trình):</p>

      $$\text{đảm bảo} - \text{tổng ví} \geq 0$$

      <span class=''note''>Làm thử: đầu ngày 500 000 − 500 000 = 0; sau ba bước 2
      000 000 − 2 000 000 = 0. Hiệu đổi mà không có giao dịch giải thích được là có
      lỗi.</span>

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Bước bốn là bất biến, tức điều luôn đúng suốt quá trình. Nạp và rút đổi
      tài khoản đảm bảo và tổng ví cùng một lượng, chuyển ví sang ví không đổi cả
      hai, nên hiệu của chúng giữ nguyên và phải lớn hơn hoặc bằng không. Làm thử:
      đầu ngày năm trăm nghìn trừ năm trăm nghìn bằng không, sau ba bước hai triệu
      trừ hai triệu vẫn bằng không.'
  - show: '<div class="code"><div>HAN_MUC = 100_000_000   # theo Thông tư 40/2024;
      kiểm lại văn bản</div><div>giao_dich = [30_000_000, 45_000_000, 20_000_000,
      10_000_000]</div><div>da_dung = 0</div><div>for so_tien in giao_dich:</div><div>    if
      da_dung + so_tien &gt; HAN_MUC:</div><div>        print("tu choi", so_tien,
      "da dung", da_dung)</div><div>    else:</div><div>        da_dung += so_tien</div><div>        print("chap
      nhan", so_tien, "da dung", da_dung)</div></div><p><b>Bước 5 — kết quả chạy thật:
      từ chối giao dịch làm vượt hạn mức</b></p><div class="code"><div>chap nhan 30000000
      da dung 30000000</div><div>chap nhan 45000000 da dung 75000000</div><div>chap
      nhan 20000000 da dung 95000000</div><div>tu choi 10000000 da dung 95000000</div></div>'
    focus:
    - - 1
      - '1.5'
    - - '3.1'
      - '3.2'
      - '3.3'
      - '3.4'
    clear: true
    say: Bước năm là hạn mức tháng, chương trình giữ tổng đã dùng và trước mỗi giao
      dịch kiểm xem cộng thêm có vượt một trăm triệu không. Ba giao dịch đầu được
      nhận, tổng lên chín mươi lăm triệu, còn giao dịch mười triệu thứ tư bị từ chối
      vì chín mươi lăm cộng mười là một trăm lẻ năm triệu.
  - show: '<div class="code"><div>ngan_hang = {"R1": 1_500_000, "R2": 2_000_000, "R3":
      800_000}</div><div>kho_bac = {"R1": 1_500_000, "R3": 800_000}</div><div>for
      so_tc, tien in ngan_hang.items():</div><div>    if so_tc not in kho_bac:</div><div>        print(so_tc,
      "chua sang Kho bac: phai tra soat")</div><div>    elif kho_bac[so_tc] != tien:</div><div>        print(so_tc,
      "lech so tien")</div><div>    else:</div><div>        print(so_tc, "khop")</div></div><p><b>Bước
      6 — kết quả chạy thật (R1, R2, R3 là nhãn minh hoạ)</b></p><div class="code"><div>R1
      khop</div><div>R2 chua sang Kho bac: phai tra soat</div><div>R3 khop</div></div>'
    focus:
    - - '1.1'
      - '1.2'
    - - '3.2'
      - '1.4'
    clear: true
    say: Bước sáu là đối soát nộp thuế theo số tham chiếu, ở đây ghi tạm R một, R
      hai, R ba. Ngân hàng đã trích tiền cả ba chứng từ, nhưng Kho bạc mới có R một
      và R ba, nên máy báo R hai chưa sang và ngân hàng phải tra soát.
