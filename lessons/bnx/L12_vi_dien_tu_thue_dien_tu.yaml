      -= g[3]</div><div>        vi[g[2]] += g[3]</div><div>    else:</div><div>        dau
      = 1 if g[0] == "nap" else -1</div><div>        vi[g[1]] += dau * g[2]</div><div>        bao_dam
      += dau * g[2]</div><div>print(vi, "tổng ví", sum(vi.values()), "đảm bảo", bao_dam)</div></div><p><b>Kết
      quả chạy thật: chạy lại nhật ký, không đọc số dư đã lưu</b></p><div class="code"><div>{''A'':
      1200000, ''B'': 300000, ''C'': 500000} tổng ví 2000000 đảm bảo 2000000</div></div>'
    focus:
    - 2
    - '1.1'
    - - '1.5'
      - '1.9'
    - 3
    say: Kiểm bằng đường khác. Thay vì tin các số dư đã tính tay, ta cho Python chạy
      lại cả nhật ký từ số đầu ngày. Mỗi dòng nhật ký là một bộ, phần tử số không
      là loại giao dịch; chuyển ví sang ví chỉ đổi hai ví, còn nạp và rút đổi cả ví
      lẫn tài khoản đảm bảo. Máy in ví A một triệu hai trăm nghìn, ví B ba trăm nghìn,
      ví C năm trăm nghìn, tổng hai triệu, tài khoản đảm bảo hai triệu, khớp với tính
      tay.
  - show: '<table class=''t''><tr><th>cách tính</th><th>tài khoản đảm bảo</th><th>tổng
      ví</th></tr><tr><td>tính tay ở phép ③ và ④</td><td>2 000 000</td><td>2 000 000</td></tr><tr><td>chạy
      lại nhật ký</td><td>500 000 + 2 000 000 − 500 000 = 2 000 000</td><td>2 000
      000</td></tr><tr><td>sổ ngân hàng: Có trừ Nợ của tài khoản đảm bảo</td><td>2
      000 000 − 500 000 = 1 500 000 trong ngày, cộng 500 000 đầu ngày</td><td>—</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    clear: true
    say: Bảng này đặt ba cách tính cạnh nhau. Tính tay cho tài khoản đảm bảo hai triệu
      và tổng ví hai triệu. Chạy lại nhật ký cũng ra năm trăm nghìn cộng hai triệu
      trừ năm trăm nghìn, bằng hai triệu. Cách thứ ba đọc sổ ngân hàng. Trong ngày
      tài khoản đảm bảo có hai triệu bên Có và năm trăm nghìn bên Nợ, nên tăng một
      triệu năm trăm nghìn. Cộng năm trăm nghìn đầu ngày là hai triệu.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_invariant(2000000, [2000000 + 1000000]) == (False, 3000000, -1000000)
  - '[x[1] for x in alg.bnx_monthly_limit([95_000_000, 10_000_000], 100_000_000)]
    == [True, False]'
  - '[x[1] for x in alg.bnx_monthly_limit([95_000_000, 10_000_000], 300_000_000)]
    == [True, True]'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Nghĩ tiền “nằm trong ví”
      hay trong máy chủ của ứng dụng. Tiền thật nằm ở <b>tài khoản đảm bảo thanh toán
      tại ngân hàng</b>; sổ ví chỉ ghi tổ chức ví đang nợ mỗi khách bao nhiêu.

      <br><span class="note">Phép thử: hỏi “số này khớp với số dư tài khoản nào ở
      ngân hàng?”</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là nghĩ tiền nằm trong ví hay trong máy chủ
      của ứng dụng. Tiền thật nằm ở tài khoản đảm bảo thanh toán tại ngân hàng. Sổ
      ví chỉ ghi tổ chức ví đang nợ mỗi khách bao nhiêu. Phép thử là hỏi số này khớp
      với số dư tài khoản nào ở ngân hàng.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Ghi tăng sổ ví <b>trước</b>
      khi ngân hàng xác nhận đã trích nợ. Lệnh nạp 1 000 000 hết giờ chờ, ngân hàng
      thật ra chưa trích, nhưng ví đã cộng:</div>

      $$2\,000\,000 + 1\,000\,000 = 3\,000\,000 \;>\; 2\,000\,000 \;\Rightarrow\;
      \text{thiếu } 1\,000\,000$$

      <span class="note">Phép thử: đối soát cuối ngày bắt được. Cách chữa: chỉ cộng
      ví khi có xác nhận; hỏi lại trạng thái lệnh hết giờ chờ.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là ghi tăng sổ ví trước khi ngân hàng xác
      nhận đã trích nợ. Ví dụ lệnh nạp một triệu bị hết giờ chờ, ngân hàng thật ra
      chưa trích, nhưng ví đã cộng. Tổng ví thành hai triệu cộng một triệu, bằng ba
      triệu, lớn hơn tài khoản đảm bảo hai triệu, nên thiếu một triệu. Đối soát cuối
      ngày bắt được lỗi này. Cách chữa là chỉ cộng ví khi có xác nhận, và hỏi lại
      trạng thái của lệnh bị hết giờ chờ.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Viết cứng <code>100_000_000</code>
      trong mã. Khi Thông tư 41/2025 cho thêm hạn mức riêng tới 300 triệu cho <b>một
      số</b> khoản thanh toán thiết yếu, hệ thống từ chối sai, hoặc sửa vội thành
      300 triệu cho mọi loại.

      <br><span class="note">Cách chữa: hạn mức là cấu hình gắn văn bản, ngày hiệu
      lực và loại giao dịch <span class=''note''>(văn bản hiện hành, kiểm lại trước
      khi áp dụng)</span>.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, là viết cứng một trăm triệu trong mã.
      Thông tư bốn mươi mốt năm hai nghìn không trăm hai mươi lăm cho thêm hạn mức
      riêng tới ba trăm triệu cho một số khoản thanh toán thiết yếu. Khi đó hệ thống
      từ chối sai, hoặc bị sửa vội thành ba trăm triệu cho mọi loại. Cách chữa là
      để hạn mức thành cấu hình gắn với văn bản, ngày hiệu lực và loại giao dịch,
      và luôn kiểm lại văn bản hiện hành.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_invariant(1900000, [700000, 900000, 400000]) == (False, 2000000, -100000)
  - alg.bnx_monthly_limit([92_000_000, 10_000_000], 100_000_000)[1] == (10_000_000,
    False, 92_000_000)
  - 100_000_000 - alg.bnx_monthly_limit([92_000_000], 100_000_000)[0][2] == 8_000_000
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Ba
      ví 700 000, 900 000, 400 000; tài khoản đảm bảo 1 900 000. Bất biến có đạt không,
      lệch bao nhiêu?</td></tr><tr><td>2</td><td>Hạn mức 100 000 000/tháng, đã dùng
      92 000 000. Giao dịch 10 000 000 có được không? Còn dùng tối đa bao nhiêu?</td></tr><tr><td>3</td><td>Quyết
      định: đối soát cuối ngày thấy chứng từ R2 đã trích tiền nhưng phía Kho bạc chưa
      có. Ngân hàng chuyển lại R2 ngay, hay tra soát với phía Kho bạc trước rồi mới
      xử lý?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, ba ví có bảy trăm nghìn, chín trăm
      nghìn và bốn trăm nghìn, tài khoản đảm bảo một triệu chín trăm nghìn. Bất biến
      có đạt không, lệch bao nhiêu? Câu hai, hạn mức một trăm triệu một tháng, đã
      dùng chín mươi hai triệu. Giao dịch mười triệu có được không, và còn dùng tối
      đa bao nhiêu? Câu ba, đối soát cuối ngày thấy chứng từ R hai đã trích tiền nhưng
      phía Kho bạc chưa có. Ngân hàng nên chuyển lại ngay, hay tra soát với phía Kho
      bạc trước rồi mới xử lý? Hãy dừng video và làm ra giấy.
  - show: $$700\,000 + 900\,000 + 400\,000 = 2\,000\,000 \;>\; 1\,900\,000 \;\Rightarrow\;
      \hl{\text{không đạt, thiếu } 100\,000}$$
    say: Đáp án câu một. Tổng ví bằng bảy trăm nghìn cộng chín trăm nghìn cộng bốn
      trăm nghìn, bằng hai triệu. Vì hai triệu lớn hơn một triệu chín trăm nghìn,
      nên bất biến không đạt, thiếu một trăm nghìn, phải điều tra ngay.
    clear: true
  - show: $$92 + 10 = 102 > 100 \;\Rightarrow\; \text{từ chối};\quad 100 - 92 = \hlg{8}
      \text{ triệu còn dùng được}$$
    say: Đáp án câu hai. Chín mươi hai cộng mười bằng một trăm lẻ hai triệu, lớn hơn
      một trăm triệu, nên từ chối. Tháng này khách còn dùng được tối đa một trăm trừ
      chín mươi hai, bằng tám triệu.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>tra
      soát với phía Kho bạc trước, rồi chuyển lại hoặc xử lý</td><td>không chuyển
      trùng nếu bên kia thật ra đã nhận mà chỉ báo trễ</td><td>chậm hơn; trong lúc
      chờ, tiền chưa vào ngân sách, phải theo dõi tới khi khớp</td></tr><tr><td>chuyển
      lại R2 ngay</td><td>nhanh</td><td>nếu lần đầu thật ra đã tới, tiền bị chuyển
      hai lần, phải đối soát lại và hoàn trả</td></tr></table>
    say: Đáp án câu ba. Chứng từ chưa sang thì tiền chưa vào ngân sách, và ngân hàng
      phải tra soát, xử lý cho xong. Tra soát trước thì không chuyển trùng nếu bên
      kia thật ra đã nhận mà chỉ báo trễ. Đổi lại chậm hơn, và phải theo dõi tới khi
      đối soát khớp. Chuyển lại ngay thì nhanh, nhưng nếu lần đầu thật ra đã tới,
      tiền bị chuyển hai lần và phải hoàn trả. Vì vậy nên tra soát trước.
    clear: true
