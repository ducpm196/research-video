source: 'curriculum/bnx.yaml L38; audit/bnx/verify_bnx.py L38; audit/bnx/sources_l38.md:
  Oracle Database 23 (docs.oracle.com, đọc 2026-11-14): PL/SQL Packages DBMS_AQADM/DBMS_AQ
  và AQ types (visibility ON_COMMIT), In-Memory Guide (INMEMORY_SIZE), Globally Distributed
  Database Guide; Oracle AI Database 26ai Free 23.26.3 chạy thật trong Docker (hàng
  đợi); mã Python 3 + sqlite3 chạy thật; mọi số của mô hình ô và mảnh là số minh hoạ'
assumes:
- bnx_ban_sao_doc
objectives:
- Tạo hàng đợi trong Oracle, gửi và nhận thông điệp trong giao dịch và chỉ ra thông
  điệp gửi rồi hoàn tác không còn trong hàng đợi
- Nêu khác biệt của hàng đợi trong cơ sở dữ liệu so với Kafka và chọn một trong hai
  theo nhu cầu
- Đọc thuộc tính INMEMORY của bảng và vùng nhớ cột trên Oracle, rồi nêu khi nào bộ
  nhớ cột đáng dùng
- Đếm số ô phải đọc khi lưu theo hàng và theo cột ở 1 000 và 100 000 dòng
- Đếm số lệnh chuyển xuyên mảnh ở 1, 3 và 30 mảnh và nêu khi nào cần phân mảnh
- Kiểm kết quả hàng đợi bằng mô hình đếm cùng chuỗi thao tác
- Viết hàng đợi có giao dịch và hàm đếm lệnh chuyển xuyên mảnh trên số liệu mới
