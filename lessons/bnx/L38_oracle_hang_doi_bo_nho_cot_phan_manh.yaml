      t[0] == "nhan" and hang:</code>, <code>hang.pop(0)</code>, <code>return nhan,
      len(hang)</code></td><td><code>and</code>: cả hai vế đúng, <code>hang</code>
      rỗng thì tính là sai; <code>pop(0)</code> lấy và bỏ phần tử đầu; trả hai giá
