      101 rồi hoàn tác, gửi 102 rồi chốt</td><td>1 thông điệp</td><td>còn 1</td></tr><tr><td>nhận
      một lần</td><td>nhận 102, còn 0</td><td>nhận 102, còn 0</td></tr></table>'
    focus:
    - - 1
      - 3
    - 5
    clear: true
    say: 'Hai ca thử giống hệt hai việc đã chạy trên Oracle: ca đầu còn một thông
