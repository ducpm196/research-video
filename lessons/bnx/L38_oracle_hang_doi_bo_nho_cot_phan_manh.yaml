scenes:
- id: hook
  kind: hook
  title: Thông báo đã đi mà giao dịch bị hoàn tác
  checks:
  - 1000 * 1 // 100 == 10
  steps:
  - show: '<p>Một lệnh chuyển tiền ghi sổ xong thì phải <b>báo cho hệ thống khác</b>
      (thông báo cho khách, đối soát).</p>

      <div class="box warn">Giao dịch bị <b>hoàn tác</b> mà thông báo đã đi: khách
      thấy “đã chuyển 500 000” nhưng tiền vẫn nguyên. Số minh hoạ: mỗi ngày 1 000
      lệnh, 1% bị hoàn tác = <b class="red">10 thông báo ma</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: 'Chào bạn, một lệnh chuyển tiền ghi sổ xong thì phải báo cho hệ thống khác.
      Nếu giao dịch bị hoàn tác mà thông báo đã đi, khách thấy đã chuyển năm trăm
      nghìn dù tiền vẫn nguyên. Số minh hoạ: mỗi ngày một nghìn lệnh, một phần trăm
      bị hoàn tác, tức mười thông báo ma.'
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>gửi
      thông báo cùng giao dịch với việc ghi sổ</td><td>hàng đợi ngay trong Oracle,
      chạy thật</td></tr><tr><td>báo cáo cộng một cột trên hàng triệu dòng</td><td>đọc
      theo cột: đếm số ô phải đọc</td></tr><tr><td>một máy không đủ sức</td><td>chia
      dữ liệu ra nhiều máy: đếm lệnh phải qua nhiều máy</td></tr></table>'
    clear: true
    say: Bài này trả lời ba câu, gửi thông báo cùng giao dịch với việc ghi sổ thì
      dùng hàng đợi trong Oracle. Báo cáo cộng một cột thì đọc theo cột và đếm số
      ô, còn một máy không đủ sức thì chia dữ liệu ra nhiều máy và đếm lệnh phải qua
      nhiều máy.
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - 2 - 1 == 1
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Hàng đợi, thông điệp</td><td>danh sách xếp hàng: người gửi thêm vào cuối, người
      nhận lấy ở đầu; mỗi thông điệp là một gói dữ liệu</td><td>gói (mã giao dịch
      102, số tiền 200 000)</td></tr><tr><td>② Giao dịch</td><td>chốt thì mọi thay
      đổi ở lại, hoàn tác thì mất hết</td><td>gửi rồi hoàn tác = chưa từng gửi</td></tr><tr><td>③
      Kafka</td><td>nơi lưu thông điệp theo chủ đề; người đọc tự giữ vị trí đọc nên
      đọc lại được</td><td>dịch vụ thông báo đọc chủ đề giao dịch</td></tr><tr><td>④
      Lưu theo hàng, theo cột</td><td>theo hàng: các ô của một dòng nằm liền nhau;
      theo cột: các ô của một cột nằm liền nhau</td><td>cộng cột số tiền</td></tr><tr><td>⑤
      Phân mảnh</td><td>chia dữ liệu ra nhiều cơ sở dữ liệu độc lập, mỗi cái là một
      mảnh, theo khoá như mã tài khoản</td><td>tài khoản 4 vào mảnh 1</td></tr></table>'
    introduces:
    - bnx_phan_manh
    say: Trước hết ta cần hiểu năm điều, hàng đợi là danh sách xếp hàng, người gửi
      thêm vào cuối, người nhận lấy ở đầu. Giao dịch thì chốt là mọi thay đổi ở lại,
      hoàn tác là mất hết. Kafka lưu thông điệp theo chủ đề, người đọc tự giữ vị trí
      nên đọc lại được. Lưu theo hàng hay theo cột là các ô của một dòng hay một cột
      nằm liền nhau, và phân mảnh là chia dữ liệu ra nhiều cơ sở dữ liệu độc lập.
  - show: '<p>Ví dụ số xuyên suốt: gửi hai thông điệp, một cái bị hoàn tác, thì trong
      hàng đợi còn:</p>

      $$2 - 1 = \hl{1}\ \text{thông điệp}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Một ví dụ số xuyên suốt cả bài. Gửi hai thông điệp, một cái bị hoàn tác,
      thì trong hàng đợi chỉ còn hai trừ một, bằng một thông điệp.
- id: sym
  kind: symbol
  title: Giải mã từ khoá
  checks:
  - alg.bnx_l38_shard(7, 3) == 1
  steps:
  - show: '<table class=''t''><tr><th>trên màn hình</th><th>nghĩa</th></tr><tr><td><code>AQ</code>,
      <code>DBMS_AQADM</code>, <code>DBMS_AQ</code></td><td>AQ (Advanced Queuing,
      hàng đợi nâng cao) là tính năng hàng đợi có sẵn của Oracle; tên bắt đầu <code>DBMS_</code>
      là gói thủ tục có sẵn: <code>…ADM</code> để quản trị hàng đợi, không có <code>ADM</code>
      để gửi và nhận</td></tr><tr><td><code>DECLARE … BEGIN … END; /</code></td><td>khối
      lệnh PL/SQL (ngôn ngữ lập trình riêng của Oracle, chạy trong cơ sở dữ liệu):
      khai biến sau DECLARE, phần chạy giữa BEGIN và END; dấu gạch chéo báo công cụ
      chạy khối</td></tr><tr><td><code>DBMS_OUTPUT.PUT_LINE(''…'')</code></td><td>in
      một dòng chữ ra màn hình dòng lệnh</td></tr></table>'
    introduces:
    - bnx_dbms_aq
    - bnx_plsql
    - bnx_dbms_output
    say: Bảng này giải mã phần hàng đợi của Oracle. Dòng đầu, chữ viết tắt là hàng
      đợi nâng cao, tính năng hàng đợi có sẵn của Oracle, còn hai tên sau là gói thủ
      tục có sẵn, một gói quản trị và một gói gửi nhận. Khối lệnh là mã viết bằng
      ngôn ngữ riêng của Oracle, có phần khai biến, phần chạy giữa hai chữ mở và đóng,
      và dấu gạch chéo báo chạy khối.
  - show: '<table class=''t''><tr><th>trên màn hình</th><th>nghĩa</th></tr><tr><td><code>CREATE
      TYPE … AS OBJECT (ma_gd NUMBER, …)</code></td><td>tạo kiểu mới gộp vài trường
      thành một gói; mỗi thông điệp là một gói như vậy</td></tr><tr><td><code>RAW(16)</code></td><td>dãy
      16 byte thô; Oracle dùng làm mã của thông điệp</td></tr><tr><td><code>DBMS_AQADM.CREATE_QUEUE_TABLE
      / CREATE_QUEUE / START_QUEUE</code></td><td>gói quản trị hàng đợi: tạo bảng
      chứa, tạo hàng đợi, bật hàng đợi</td></tr><tr><td><code>DBMS_AQ.ENQUEUE</code>
      / <code>DEQUEUE</code></td><td>gửi thông điệp vào / nhận ra khỏi hàng đợi; <code>NO_WAIT</code>:
      hàng trống thì báo ngay, không chờ</td></tr></table>'
    clear: true
    say: Kiểu mới gộp vài trường thành một gói thông điệp. Dãy mười sáu byte thô là
      mã thông điệp. Gói quản trị tạo bảng chứa, tạo hàng đợi và bật nó. Hai thủ tục
      còn lại gửi vào và nhận ra.
  - show: '<table class=''t''><tr><th>trên màn hình</th><th>nghĩa</th></tr><tr><td><code>ALTER
      TABLE … INMEMORY</code></td><td>đánh dấu bảng được nạp thêm một bản dạng cột
      vào bộ nhớ, để đọc báo cáo</td></tr><tr><td><code>INMEMORY_SIZE</code>, <code>v&#36;parameter</code></td><td>tham
      số: dung lượng vùng nhớ cột (0 là chưa có vùng); <code>v&#36;parameter</code>
      là bảng ảo liệt kê tham số đang chạy</td></tr><tr><td><code>user_tables.inmemory</code></td><td>cột
      báo bảng đã được đánh dấu chưa</td></tr><tr><td><code>mã % 3</code></td><td>mảnh
      = mã tài khoản chia lấy dư cho 3; quy tắc minh hoạ của bài</td></tr></table>'
    introduces:
    - bnx_inmemory
    - bnx_bo_nho_cot
    clear: true
    say: Bảng thứ hai giải mã bộ nhớ cột và phân mảnh. Lệnh đánh dấu bảng được nạp
      thêm một bản dạng cột vào bộ nhớ, để đọc báo cáo, và tham số dung lượng bằng
      không nghĩa là chưa có vùng nhớ cột nào. Bảng ảo liệt kê các tham số đang chạy,
      một cột báo bảng đã được đánh dấu chưa, và mảnh bằng mã chia lấy dư cho ba là
      quy tắc minh hoạ.
