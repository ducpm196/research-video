  - alg.bnx_l38_cross(12, 4) == (132, 108) and 4 * 3 * 2 == 24
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Bảng
      8 cột, 50 000 dòng, cộng một cột. Đọc theo hàng và theo cột, mỗi cách phải đọc
      bao nhiêu ô? Báo cáo hay tra một dòng hợp bộ nhớ cột hơn?</td></tr><tr><td>2</td><td>Gửi
      301 rồi chốt, gửi 302 rồi hoàn tác, rồi nhận một thông điệp. Nhận được gì, còn
      mấy thông điệp?</td></tr><tr><td>3</td><td>12 tài khoản mã 0 tới 11, 4 mảnh,
      mảnh = mã mod 4. Bao nhiêu cặp chuyển có thứ tự cùng mảnh, bao nhiêu xuyên mảnh?
      Có nên phân mảnh ngay khi một máy dùng 30% sức?</td></tr><tr><td>4</td><td>Quyết
      định: báo “đã chuyển tiền” bằng hàng đợi trong Oracle hay bằng Kafka?</td></tr></table>'
    pause: 40
    say: 'Bây giờ tới phần bạn tự làm bài. Câu một: bảng tám cột, năm mươi nghìn dòng,
      cộng một cột; mỗi cách đọc bao nhiêu ô, báo cáo hay tra một dòng hợp bộ nhớ
      cột hơn? Câu hai: gửi ba trăm linh một chốt, ba trăm linh hai hoàn tác, rồi
      nhận một thông điệp; nhận gì, còn mấy? Câu ba: mười hai tài khoản, bốn mảnh,
      bao nhiêu cặp xuyên mảnh, có nên phân mảnh khi một máy dùng ba mươi phần trăm
      sức? Câu bốn: hàng đợi trong Oracle hay Kafka, hãy dừng video và làm ra giấy.'
  - show: '<p>Câu 1: theo hàng đọc cả dòng, theo cột chỉ một cột.</p>

      $$8 \cdot 50\,000 = \hlg{400\,000}\ \text{ô}; \qquad 1 \cdot 50\,000 = \hlg{50\,000}\
      \text{ô}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu một, theo hàng đọc tám nhân năm mươi nghìn, bốn trăm nghìn ô,
      theo cột chỉ năm mươi nghìn ô. Báo cáo cộng cả cột hợp bộ nhớ cột, còn tra một
      dòng thì lưu theo hàng là đủ.
    clear: true
  - show: '<p>Câu 2: 301 đã chốt ở lại, 302 bị hoàn tác nên mất; nhận lấy cái đầu
      hàng.</p>

      <div class=''box key''>nhận <b>301</b>, còn <b>0</b> thông điệp</div>

      '
    focus:
    - - 1
    - 2
    clear: true
    say: Đáp án câu hai, ba trăm linh một đã chốt nên ở lại, ba trăm linh hai bị hoàn
      tác nên mất. Nhận lấy thông điệp đầu hàng là ba trăm linh một, và hàng đợi còn
      không.
  - show: '<p>Câu 3: mỗi mảnh 3 tài khoản.</p>

      $$12 \cdot 11 = 132;\quad 4 \cdot (3 \cdot 2) = \hl{24}\ \text{cùng mảnh};\quad
      132 - 24 = \hl{108}\ \text{xuyên mảnh}$$

      '
    focus:
    - - 1
    - 2
    - 2
    clear: true
    say: Đáp án câu ba, mười hai nhân mười một là một trăm ba mươi hai cặp có thứ
      tự. Mỗi mảnh có ba tài khoản, nên cùng mảnh là bốn nhân sáu, hai mươi bốn cặp,
      còn một trăm lẻ tám cặp xuyên mảnh. Một máy mới dùng ba mươi phần trăm sức thì
      chưa nên phân mảnh.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hàng
      đợi trong Oracle</td><td>cùng giao dịch với lệnh chuyển: không gửi nhầm cho
      lệnh đã huỷ</td><td>tải đặt lên cơ sở dữ liệu giao dịch; mặc định nhận xong
      là mất</td></tr><tr><td>Kafka</td><td>lưu lâu, nhiều dịch vụ cùng đọc, đọc lại
      được, chịu tải lớn</td><td>ghi và gửi là hai việc riêng: cần mẫu hộp thư đi
      hoặc cách tương tự để không lệch</td></tr></table>'
    clear: true
    say: Đáp án câu bốn, tuỳ nhu cầu, hàng đợi trong Oracle đi cùng giao dịch của
      lệnh chuyển nên không gửi nhầm, đổi lại tải đặt lên cơ sở dữ liệu giao dịch.
      Kafka lưu lâu và nhiều dịch vụ cùng đọc, nhưng ghi và gửi là hai việc riêng,
      nên cần mẫu hộp thư đi.
- id: practice
  kind: practice
  title: 'Tự làm: hàng đợi có giao dịch và lệnh xuyên mảnh'
  steps:
  - show: '<p><b>Đề</b>: sqlite có bảng <code>hang_doi (id, ma_gd, so_tien)</code>.
      Viết <code>mau.py</code>:</p>

      <ol><li><code>gui(ma, tien, chot)</code>: chèn một dòng trong giao dịch; <code>chot</code>
      sai thì hoàn tác</li><li><code>nhan()</code>: lấy dòng <code>id</code> nhỏ nhất,
      xoá, chốt</li><li>gửi 201 (chốt), 202 (hoàn tác), 203, 204 (chốt), nhận hai
      lần, đếm; rồi đếm lệnh xuyên mảnh với mảnh = mã mod 4</li></ol>

      <p class="note">Oracle không có trong bộ chấm: sqlite đại diện. Số liệu và khuôn
      năm dòng in ra nằm trong <code>de.md</code>.</p>

      '
    focus:
    - 1
    - - 2
      - 3
    pause: 120
    say: Bây giờ tới phần bạn tự làm, trên cơ sở dữ liệu nhỏ có sẵn trong Python vì
      bộ chấm không có Oracle. Viết hàm gửi trong giao dịch, hoàn tác thì thông điệp
      mất, và hàm nhận lấy thông điệp vào trước, rồi đếm lệnh xuyên mảnh với quy tắc
      mới, hãy dừng video và tự viết.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>sau gui: 3 thong diep</div><div>nhan:
      201 750000</div><div>nhan: 203 120000</div><div>con lai: 1</div><div>xuyen manh:
      3/5</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh BNX
      L38 mau.py</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> mở giao dịch bằng <code>db.execute("BEGIN")</code>
      (kết nối <code>isolation_level=None</code>), rồi <code>COMMIT</code> hoặc <code>ROLLBACK</code>.
      Nhận: <code>SELECT … ORDER BY id LIMIT 1</code> rồi <code>DELETE</code>. Xuyên
      mảnh: <code>a % 4 != b % 4</code>.

      Lời giải ở <code>labs/BNX/L38/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, mở giao dịch bằng lệnh bắt đầu rồi chốt hoặc hoàn tác. Nhận bằng
      cách chọn dòng có mã nhỏ nhất rồi xoá nó. Xuyên mảnh là hai mã có phần dư khác
      nhau. Lời giải nằm trong thư mục thực hành, chỉ mở sau khi đã tự thử.
    clear: true
  lab: labs/BNX/L38
