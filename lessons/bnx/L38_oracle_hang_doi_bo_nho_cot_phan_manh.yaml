- id: quymo
  kind: example
  title: 'Khi số mảnh tăng: lệnh chuyển xuyên mảnh'
  checks:
  - alg.bnx_l38_cross(60, 1) == (3540, 0)
  - alg.bnx_l38_cross(60, 3) == (3540, 2400)
  - alg.bnx_l38_cross(60, 30) == (3540, 3480)
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>[(a,
      b) for a in range(tk) for b in range(tk) if a != b]</code></td><td>hai vòng
      lồng: mọi cặp (a, b) với mã từ 0 tới tk − 1, bỏ cặp a bằng b</td><td><code>tk
      = 3</code>: 6 cặp</td></tr><tr><td><code>sum(1 for a, b in cap if a % manh !=
      b % manh)</code></td><td>đếm các cặp mà phần dư của a và của b khi chia cho
      <code>manh</code> khác nhau; <code>%</code> là phần dư</td><td><code>7 % 3</code>
      ra 1</td></tr><tr><td><code>{100 * x / n:.1f}</code></td><td>phần trăm x trên
      n, giữ một chữ số sau dấu chấm thập phân</td><td><code>3480 / 3540</code> ra
      <code>98.3</code></td></tr><tr><td><code>n, x = xuyen(60, manh)</code></td><td>hàm
      trả hai giá trị, gán vào n và x một lúc</td><td></td></tr></table>'
    clear: true
    say: Hàm liệt kê mọi cặp tài khoản khác nhau, đếm cặp có phần dư khác nhau, và
      in tỉ lệ phần trăm một chữ số thập phân.
  - show: '<p class="note">Giả định (số minh hoạ): 60 tài khoản, mọi cặp chuyển có
      thứ tự (60 × 59 = 3 540 cặp), mảnh = mã chia lấy dư cho số mảnh.</p><p><b>XuyenManh.py</b></p><div
      class="code"><div>def xuyen(tk, manh):</div><div>    cap = [(a, b) for a in
      range(tk) for b in range(tk) if a != b]</div><div>    x = sum(1 for a, b in
      cap if a % manh != b % manh)</div><div>    return len(cap), x</div><div> </div><div>for
      manh in (1, 3, 30):</div><div>    n, x = xuyen(60, manh)</div><div>    print(f"{manh}
      manh: {x}/{n} lenh xuyen manh, {100 * x / n:.1f}%")</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Giả định, số minh hoạ: sáu mươi tài khoản, mọi cặp chuyển có thứ tự, tức
      ba nghìn năm trăm bốn mươi cặp, mảnh bằng mã chia lấy dư cho số mảnh. Ta đếm
      các cặp rơi vào hai mảnh khác nhau, ở một, ba và ba mươi mảnh.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1 manh: 0/3540 lenh
      xuyen manh, 0.0%</div><div>3 manh: 2400/3540 lenh xuyen manh, 67.8%</div><div>30
      manh: 3480/3540 lenh xuyen manh, 98.3%</div></div>$$1 \to 3 \to 30 \text{ mảnh:
      } \hl{0} \to \hl{2\,400} \to \hl{3\,480} \text{ lệnh xuyên mảnh}$$'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Một mảnh thì không lệnh nào xuyên mảnh. Ba mảnh thì hai nghìn bốn trăm lệnh
      xuyên mảnh, hơn sáu mươi bảy phần trăm. Ba mươi mảnh thì gần chín mươi tám phần
      trăm. Vậy càng thêm mảnh, gần như mọi lệnh chuyển đều phải đi qua nhiều cơ sở
      dữ liệu.
  - show: '<table class=''t''><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào
      chọn</th></tr><tr><td>một cơ sở dữ liệu, thêm chỉ mục và bản sao đọc</td><td>mọi
      lệnh chuyển là giao dịch của một máy</td><td>một máy là giới hạn: nó hỏng thì
      ngừng</td><td>chưa đo thấy một máy hết sức</td></tr><tr><td>phân mảnh theo khoá</td><td>tải
      ghi chia ra nhiều máy</td><td>lệnh xuyên mảnh phải nhiều cơ sở dữ liệu cùng
      chốt: đắt, khó</td><td>một máy đã hết sức dù đã thêm chỉ mục và bản sao</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    say: Bảng này cho thấy người làm nghề phải chọn gì. Một cơ sở dữ liệu thì mọi
      lệnh chuyển là giao dịch của một máy, đổi lại một máy là giới hạn. Phân mảnh
      chia tải ghi ra nhiều máy, đổi lại lệnh xuyên mảnh đắt và khó. Vì thế chỉ phân
