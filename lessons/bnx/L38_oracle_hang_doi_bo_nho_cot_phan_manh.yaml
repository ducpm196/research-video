  - show: '<p><b>MoHinh.py: hàng đợi có giao dịch viết lại bằng một danh sách</b></p><div
      class="code"><div>def chay(thao_tac):</div><div>    hang, cho, nhan = [], [],
      []</div><div>    for t in thao_tac:</div><div>        if t[0] == "gui":</div><div>            cho.append(t[1])</div><div>        elif
      t[0] == "huy":</div><div>            cho = []</div><div>        elif t[0] ==
      "chot":</div><div>            hang, cho = hang + cho, []</div><div>        elif
