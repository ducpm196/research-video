- id: formula
  kind: formula
  title: 'Suy ra từng bước: hàng đợi, bộ nhớ cột và phân mảnh'
  checks:
  - alg.bnx_l38_queue([('enq', 101), ('rollback',), ('enq', 102), ('commit',)])[1]
    == 1
  - alg.bnx_l38_queue([('enq', 101), ('rollback',), ('enq', 102), ('commit',), ('deq',),
    ('commit',)]) == ([102], 0)
  - alg.bnx_l38_shard(4, 3) == alg.bnx_l38_shard(7, 3) == 1 and alg.bnx_l38_shard(5,
    3) == 2
  steps:
  - show: '<p><b>Bước 1. Tạo hàng đợi</b>: kiểu thông điệp, bảng hàng đợi, hàng đợi,
      rồi bật nó.</p><div class="code"><div>CREATE TYPE bnx_l38_msg AS OBJECT (ma_gd
      NUMBER, so_tien NUMBER);</div><div>/</div><div>BEGIN</div><div>  DBMS_AQADM.CREATE_QUEUE_TABLE(''bnx_l38_qt'',
      ''bnx_l38_msg'');</div><div>  DBMS_AQADM.CREATE_QUEUE(''bnx_l38_q'', ''bnx_l38_qt'');</div><div>  DBMS_AQADM.START_QUEUE(''bnx_l38_q'');</div><div>END;</div><div>/</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, tạo hàng đợi ngay trong cơ sở dữ liệu. Hàng đợi phải biết mỗi thông
      điệp chứa gì, nên trước hết khai kiểu thông điệp gồm mã giao dịch và số tiền.
      Rồi tạo bảng hàng đợi, tạo hàng đợi trên bảng đó, và bật hàng đợi.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>eo  DBMS_AQ.ENQUEUE_OPTIONS_T;</code>,
      <code>id  RAW(16);</code></td><td>khai biến trong PL/SQL: tên rồi kiểu; kiểu
      là loại có sẵn của gói; <code>RAW(16)</code> là dãy 16 byte thô</td><td><code>eo</code>
      là biến tuỳ chọn gửi</td></tr><tr><td><code>bnx_l38_msg(101, 500000)</code></td><td>tạo
      một thông điệp kiểu <code>bnx_l38_msg</code>, giá trị các trường theo thứ tự:
      mã 101, số tiền 500000</td><td>mã giao dịch 101, số tiền 500000</td></tr><tr><td><code>DBMS_AQ.ENQUEUE(''bnx_l38_q'',
      eo, mp, msg, id)</code></td><td>gửi: năm đối số là tên hàng đợi, tuỳ chọn, thuộc
      tính, nội dung, biến nhận mã thông điệp</td><td></td></tr><tr><td><code>ROLLBACK;</code>,
      <code>COMMIT;</code></td><td>hoàn tác giao dịch đang mở (mọi thay đổi mất);
      chốt (mọi thay đổi ở lại)</td><td></td></tr></table>'
    clear: true
    say: 'Đọc trước bốn chỗ: khai biến là tên rồi kiểu, tạo thông điệp bằng các giá
      trị theo thứ tự trường, lệnh gửi năm đối số, và hoàn tác hay chốt.'
  - show: '<p><b>Bước 2. Gửi trong giao dịch</b>: gửi 101 rồi hoàn tác, gửi 102 rồi
      chốt.</p><div class="code"><div>DECLARE</div><div>  eo  DBMS_AQ.ENQUEUE_OPTIONS_T;</div><div>  mp  DBMS_AQ.MESSAGE_PROPERTIES_T;</div><div>  id  RAW(16);</div><div>BEGIN</div><div>  DBMS_AQ.ENQUEUE(''bnx_l38_q'',
      eo, mp, bnx_l38_msg(101, 500000), id);</div><div>  ROLLBACK;</div><div>  DBMS_AQ.ENQUEUE(''bnx_l38_q'',
      eo, mp, bnx_l38_msg(102, 200000), id);</div><div>  COMMIT;</div><div>END;</div><div>/</div><div>SELECT
      COUNT(*) AS so_thong_diep FROM bnx_l38_qt;</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước hai, gửi thông điệp một trăm linh một rồi hoàn tác, sau đó gửi một trăm
      linh hai rồi chốt. Vì việc gửi mặc định là một phần của giao dịch đang chạy,
      nên hoàn tác thì thông điệp đầu biến mất. Câu cuối đếm thông điệp trong bảng
      hàng đợi.
  - show: "<p><b>Kết quả chạy thật</b></p><div class=\"code\"><div>SO_THONG_DIEP</div><div>-------------</div><div>\t\
      \    1</div></div><p class='note'>Làm thử: 2 lần gửi − 1 lần bị hoàn tác = 1\
      \ thông điệp.</p>"
    clear: true
    say: Làm thử, vì lần gửi đầu đã bị hoàn tác, hai lần gửi trừ một còn một thông
      điệp, khớp với đầu ra thật.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>dq.wait
      := DBMS_AQ.NO_WAIT;</code></td><td><code>:=</code> gán giá trị; <code>dq.wait</code>
      là trường <code>wait</code> của <code>dq</code>; <code>NO_WAIT</code>: hàng
      trống thì báo ngay, không chờ</td><td><code>x := 5</code> đặt x bằng 5</td></tr><tr><td><code>''nhan:
      '' || m.ma_gd || '' '' || m.so_tien</code></td><td><code>||</code> nối chuỗi
      và số thành một dòng; <code>m.ma_gd</code> đọc trường mã giao dịch của thông
      điệp <code>m</code></td><td><code>''a'' || 1</code> ra <code>a1</code></td></tr></table>'
    clear: true
    say: Dấu hai chấm bằng gán giá trị, dấu chấm đọc một trường, và hai gạch đứng
      nối chuỗi vì ta cần in số cạnh chữ.
  - show: '<p><b>Bước 3. Nhận rồi chốt</b>, ở chế độ không chờ; rồi đếm lại.</p><div
      class="code"><div>DECLARE</div><div>  dq  DBMS_AQ.DEQUEUE_OPTIONS_T;</div><div>  mp  DBMS_AQ.MESSAGE_PROPERTIES_T;</div><div>  m   bnx_l38_msg;</div><div>  id  RAW(16);</div><div>BEGIN</div><div>  dq.wait
      := DBMS_AQ.NO_WAIT;</div><div>  DBMS_AQ.DEQUEUE(''bnx_l38_q'', dq, mp, m, id);</div><div>  DBMS_OUTPUT.PUT_LINE(''nhan:
      '' || m.ma_gd || '' '' || m.so_tien);</div><div>  COMMIT;</div><div>END;</div><div>/</div><div>SELECT
      COUNT(*) AS so_thong_diep FROM bnx_l38_qt;</div></div>'
    focus:
    - 1
    - - 1
      - 2
    clear: true
    say: Bước ba, nhận một thông điệp, in ra rồi chốt. Vì không muốn treo khi hàng
      đợi trống, ta đặt chế độ không chờ, câu cuối đếm lại bảng hàng đợi.
  - show: "<p><b>Kết quả chạy thật</b></p><div class=\"code\"><div>nhan: 102 200000</div><div>SO_THONG_DIEP</div><div>-------------</div><div>\t\
      \    0</div></div><p class='note'>Làm thử: 1 thông điệp − 1 đã nhận = 0: nhận\
      \ và chốt xong, thông điệp rời hàng đợi.</p>"
    focus:
    - 1
    - 2
    clear: true
    say: Máy nhận đúng thông điệp một trăm linh hai, hai trăm nghìn. Vì việc nhận
      cũng nằm trong giao dịch, nên chỉ sau khi chốt thông điệp mới rời hàng đợi,
      và đếm lại thì còn không.
  - show: '<p><b>Bước 4. Bộ nhớ cột</b>: báo cáo cộng một cột trên hàng triệu dòng
      thì đọc theo cột thường ít việc hơn. Kiểm trên máy của bài:</p><div class="code"><div>DROP
      TABLE IF EXISTS bnx_l38_gd;</div><div>CREATE TABLE bnx_l38_gd (id NUMBER, so_tien
      NUMBER);</div><div>ALTER TABLE bnx_l38_gd INMEMORY;</div><div>SELECT value AS
      inmemory_size FROM v<span>&#36;</span>parameter</div><div> WHERE name = ''inmemory_size'';</div><div>SELECT
      inmemory FROM user_tables</div><div> WHERE table_name = ''BNX_L38_GD'';</div></div>'
    focus:
    - - 1
    - 2
    clear: true
    say: Bước bốn là bộ nhớ cột, báo cáo thường cộng một cột trên hàng triệu dòng,
      nên đọc dữ liệu xếp theo cột thường ít việc hơn. Ta tạo một bảng nhỏ, đánh dấu
      nó, rồi hỏi dung lượng vùng nhớ cột và hỏi bảng đã được đánh dấu chưa.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>INMEMORY_SIZE</div><div>--------------------…</div><div>0</div><div>INMEMORY</div><div>--------</div><div>ENABLED</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Trên máy của bài, dung lượng vùng nhớ cột đang là không. Ta vẫn đánh dấu
      bảng được, nhưng vì vùng nhớ bằng không nên chưa có gì được nạp, và bài không
      đo được tốc độ.
  - show: '<p><b>Bước 5. Phân mảnh</b>, khi một cơ sở dữ liệu không đủ sức: bộ định
      tuyến đưa yêu cầu tới mảnh theo khoá (hình bên trên).</p><table class=''t''><tr><th>lệnh</th><th>mảnh
      (mã mod 3, minh hoạ)</th><th>hệ quả</th></tr><tr><td>chuyển từ tài khoản 4 sang
      7</td><td>1 và 1</td><td>một mảnh: giao dịch trong một cơ sở dữ liệu</td></tr><tr><td>chuyển
      từ tài khoản 4 sang 5</td><td>1 và 2</td><td>xuyên mảnh: hai cơ sở dữ liệu phải
      cùng chốt, đắt hơn</td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước năm là phân mảnh, khi một cơ sở dữ liệu không đủ sức. Chuyển từ tài
      khoản bốn sang bảy, cả hai ở mảnh một, nên là giao dịch trong một cơ sở dữ liệu.
      Chuyển từ bốn sang năm thì xuyên hai mảnh, hai cơ sở dữ liệu phải cùng chốt,
      đắt hơn nhiều.
- id: example
  kind: example
  title: Ví dụ chạy thật, từng phép tính
  checks:
  - alg.bnx_l38_cells(1000, 8, 'hang') == 8000 and alg.bnx_l38_cells(1000, 8, 'cot')
    == 1000
  - alg.bnx_l38_cells(1000, 8, 'hang') // alg.bnx_l38_cells(1000, 8, 'cot') == 8
  - alg.bnx_l38_cells(100000, 8, 'hang') == 800000 and alg.bnx_l38_cells(100000, 8,
    'cot') == 100000
  steps:
  - show: '$$① \; 2 - 1 = \hl{1}\ \text{thông điệp sau khi gửi (đã đo trên Oracle)}$$

      $$② \; 1 - 1 = \hl{0}\ \text{thông điệp sau khi nhận và chốt}$$

      '
    focus:
    - - 1
    - 2
