- id: formula
  kind: formula
  title: 'Suy ra từng bước: khi nào gộp tự xong, khi nào xung đột'
  checks:
  - 4400 - 5500 == -1100 and 6600 - 5500 == 1100
  - alg.bnx_merge3('5500', '5500', '6600') == ('ok', '6600') and alg.bnx_merge3('5500',
    '4400', '5500') == ('ok', '4400')
  - alg.bnx_merge3('5500', '6600', '6600') == ('ok', '6600') and alg.bnx_merge3('5500',
    '4400', '6600')[0] == 'conflict'
  steps:
  - show: '<p><b>Bước 1.</b> Git tìm <b>commit chung gần nhất</b> của hai nhánh, vì
      chỉ so với điểm xuất phát chung mới biết <i>ai đã đổi gì</i>.</p>

      <span class=''note''>Làm thử: <code>main</code> = gốc → 4400; <code>tang</code>
      = gốc → 6600; chung = gốc <code>18bdd9f</code> (5500).</span>

      '
    focus:
    - 1
    - 2
    say: Bước một, trình quản lý phiên bản tìm lần chốt chung gần nhất của hai nhánh,
      vì chỉ khi so với điểm xuất phát chung mới biết ai đã đổi gì. Làm thử, cả hai
      nhánh đều đi ra từ lần chốt gốc, nên điểm chung là phí năm nghìn năm trăm.
  - show: '<p><b>Bước 2.</b> So <b>từng bên với gốc</b>, không so hai bên với nhau.</p>

      $$\text{main: } 4\,400 - 5\,500 = \hl{-1\,100} \qquad \text{tang: } 6\,600 -
      5\,500 = \hl{1\,100}$$

      <span class=''note''>Phép trừ chỉ để ta dễ thấy. Máy không tính số: nó so <b>chữ</b>
      từng dòng, dòng <code>phi=4400</code> khác dòng <code>phi=5500</code> là đủ.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Bước hai, trình quản lý phiên bản so từng bên với gốc chứ không so hai bên
      với nhau, vì cần biết mỗi bên đã đổi gì so với lúc tách ra. Nhánh chính lấy
      bốn nghìn bốn trăm trừ năm nghìn năm trăm, được âm một nghìn một trăm. Nhánh
      tang lấy sáu nghìn sáu trăm trừ năm nghìn năm trăm, được một nghìn một trăm.
      Như vậy cả hai bên đều đổi cùng một dòng. Phép trừ chỉ để ta dễ thấy, vì máy
      không tính số mà so chữ từng dòng, thấy dòng khác gốc là đủ.
  - show: '<table class=''t''><tr><th>gốc</th><th>main</th><th>tang</th><th>kết quả
      gộp</th></tr><tr><td>5500</td><td>5500</td><td>6600</td><td>6600 — chỉ tang
      đổi, lấy tang</td></tr><tr><td>5500</td><td>4400</td><td>5500</td><td>4400 —
      chỉ main đổi, lấy main</td></tr><tr><td>5500</td><td>6600</td><td>6600</td><td>6600
      — hai bên đổi giống nhau</td></tr><tr><td>5500</td><td>4400</td><td>6600</td><td><b
      class=''red''>xung đột</b> — hai bên đổi khác nhau: người quyết</td></tr></table>'
    say: Bước ba là luật gộp ba chiều mà máy áp dụng. Nếu chỉ nhánh tang đổi, trình
      quản lý phiên bản lấy bản của tang. Nếu chỉ nhánh chính đổi, trình quản lý phiên
      bản lấy bản của nhánh chính. Nếu hai bên đổi giống nhau, trình quản lý phiên
      bản lấy luôn bản đó. Còn khi hai bên đổi cùng một dòng thành hai giá trị khác
      nhau, máy không có cơ sở chọn, nên dừng lại để người quyết.
- id: example
  kind: example
  title: Ví dụ chạy thật, từng phép tính
  checks:
  - alg.bnx_is_hex40(alg.bnx_git_demo()['root']) and alg.bnx_hex_bits(40) == 160
  - len(alg.bnx_markers(alg.bnx_conflict_file('phi=4400', 'phi=6600'))) == 3 and alg.bnx_merge3('5500',
    '4400', '6600')[0] == 'conflict'
  - 6600 - 4400 == 2200
  - alg.bnx_git_demo()['merge'] != alg.bnx_git_demo()['tang'] and len([alg.bnx_git_demo()['giam'],
    alg.bnx_git_demo()['tang']]) == 2
  - '(lambda r: alg.bnx_reachable({r[''merge'']: [r[''giam''], r[''tang'']], r[''giam'']:
    [r[''root'']], r[''tang'']: [r[''root'']]}, r[''merge'']))(alg.bnx_git_demo())
    == 3 + 1'
  steps:
  - show: <div class="code"><div>export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1</div><div>export
      GIT_AUTHOR_NAME=An GIT_AUTHOR_EMAIL=an@vd.vn</div><div>export GIT_COMMITTER_NAME=An
      GIT_COMMITTER_EMAIL=an@vd.vn</div><div>export GIT_AUTHOR_DATE=2026-01-05T09:00:00+07:00</div><div>export
      GIT_COMMITTER_DATE=2026-01-05T09:00:00+07:00</div><div>cd `mktemp -d`</div><div>git
      init -q -b main</div><div>echo "phi=5500" &gt; phi.txt</div><div>git add phi.txt</div><div>git
      commit -q -m "Phí chuyển khoản 5500"</div><div>git log --format="%H %s"</div></div>
    say: Giờ ta chạy thật từng lệnh trên máy. Năm dòng đầu cố định tên người viết
      và giờ chốt, để ai chạy lại cũng ra đúng các mã băm như trên màn hình. Sau đó
      ta tạo kho trong một thư mục tạm, ghi dòng phí năm nghìn năm trăm, dùng lệnh
      thêm đưa tệp vào vùng chờ, rồi chốt và in lịch sử.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>18bdd9f83171c5e0cd7c8f61b3976e87f436643d
      Phí chuyển khoản 5500</div></div>$$① \; 40 \text{ ký tự} \cdot 4 \text{ bit}
      = \hl{160} \text{ bit}$$
    focus:
    - 1
    - 2
    say: Máy in ra mã của lần chốt gốc, đếm được bốn mươi ký tự. Phép tính thứ nhất,
      bốn mươi ký tự nhân bốn bít bằng một trăm sáu mươi bít.
  - show: <div class="code"><div>git switch -q -c tang</div><div>echo "phi=6600" &gt;
      phi.txt</div><div>git commit -q -am "Tăng phí lên 6600"</div><div>git switch
      -q main</div><div>echo "phi=4400" &gt; phi.txt</div><div>git commit -q -am "Giảm
      phí còn 4400"</div><div>git merge tang</div><div>cat phi.txt</div></div>
    clear: true
    say: Tiếp theo ta tạo nhánh tang, sửa phí thành sáu nghìn sáu trăm rồi chốt. Quay
      về nhánh chính, sửa phí thành bốn nghìn bốn trăm rồi chốt. Cuối cùng gộp nhánh
      tang vào và in tệp phí. Tuỳ chọn a của lệnh chốt tự đưa mọi tệp đã theo dõi
      vào vùng chờ, nên ở đây khỏi gõ lệnh thêm.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>Auto-merging phi.txt</div><div>CONFLICT
      (content): Merge conflict in phi.txt</div><div>Automatic merge failed; fix conflicts
      and then commit the result.</div><div>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</div><div>phi=4400</div><div>=======</div><div>phi=6600</div><div>&gt;&gt;&gt;&gt;&gt;&gt;&gt;
      tang</div></div><p>② 3 dấu mốc chia tệp thành <b>2</b> phiên bản: <code>main</code>
      4400, <code>tang</code> 6600.</p>'
    focus:
    - 2
    - 3
    clear: true
    say: Trình quản lý phiên bản báo xung đột ở tệp phí và dừng lại, đúng như luật
      gộp ba chiều. Phép tính thứ hai, ba dấu mốc chia tệp thành hai phiên bản, bốn
      nghìn bốn trăm của nhánh chính ở trên và sáu nghìn sáu trăm của nhánh tang ở
      dưới.
  - show: '<div class="code"><div>echo "phi=6600" &gt; phi.txt</div><div>git add phi.txt</div><div>git
      commit -q -m "Gộp nhánh tang: chốt 6600"</div><div>git cat-file -p HEAD</div><div>git
      log --graph --oneline</div><div>git rev-parse HEAD:phi.txt</div></div><p>③ Người
      quyết giữ 6600 <span class=''note''>(số minh hoạ)</span>: so với <code>main</code>
      tăng $6\,600 - 4\,400 = \hl{2\,200}$.</p>'
    focus:
    - 0
    - 2
    - 1
    - 2
    clear: true
    say: Xung đột không phải trình quản lý phiên bản hỏng, mà là hai người sửa cùng
      chỗ và người phải quyết. Giả sử người phụ trách sản phẩm chọn sáu nghìn sáu
      trăm. Ta ghi lại dòng phí không còn dấu mốc, rồi chốt. Phép tính thứ ba, so
      với nhánh chính phí tăng sáu nghìn sáu trăm trừ bốn nghìn bốn trăm, bằng hai
      nghìn hai trăm.
  - show: '<p><b>Kết quả chạy thật: nội dung commit gộp</b></p><div class="code"><div>tree
      4ed712d4f4f629cec4feef460dab40a18aa4d67c</div><div>parent a8af580122c034d23f48f1a2b5352f76e21f1606</div><div>parent
      577eea45be69df57323a445daa576fabd322f6d0</div><div>author An &lt;an@vd.vn&gt;
      1767578400 +0700</div><div>committer An &lt;an@vd.vn&gt; 1767578400 +0700</div><div>
      </div><div>Gộp nhánh tang: chốt 6600</div></div><p>④ Có <b>2</b> dòng <code>parent</code>
      → commit gộp có <b>2 cha</b>.</p>'
    focus:
    - 2
    - 3
    clear: true
    say: Lệnh xem nội dung in ra lần chốt gộp, đúng như hình ảnh chụp lúc nãy. Phép
      tính thứ tư, có hai dòng cha, một là lần chốt bốn nghìn bốn trăm của nhánh chính,
      một là lần chốt sáu nghìn sáu trăm của nhánh tang.
  - show: '<p><b>Kết quả chạy thật: đồ thị commit</b></p><div class="code"><div>*   0eac7e6
      Gộp nhánh tang: chốt 6600</div><div>|\</div><div>| * 577eea4 Tăng phí lên 6600</div><div>*
      | a8af580 Giảm phí còn 4400</div><div>|/</div><div>* 18bdd9f Phí chuyển khoản
      5500</div><div>a9b66cbffa3ddbb8bd633e5dc03afc3fb5575166</div></div>$$⑤ \; 3
      + 1 = \hlg{4} \text{ commit}$$'
    focus:
    - 2
    - 2
    - 3
    clear: true
    say: Đồ thị vẽ bằng ký tự cho thấy hai nhánh tách ra từ gốc rồi nhập lại. Dòng
      cuối là mã nội dung của tệp phí. Phép tính thứ năm, ba lần chốt trước khi gộp
      cộng một lần chốt gộp, bằng bốn lần chốt.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tự tính mã băm'
  checks:
  - alg.bnx_git_blob('phi=6600\n') == alg.bnx_git_demo()['blob6600'] and len('phi=6600\n')
    == 9
  - alg.bnx_git_demo()['root'].startswith('18bdd9f') and alg.bnx_git_demo()['merge'].startswith('0eac7e6')
  - 'alg.bnx_git_commit(alg.bnx_git_demo()[''tree6600''], [alg.bnx_git_demo()[''giam''],
    alg.bnx_git_demo()[''tang'']], ''Gộp nhánh tang: chốt 6600'') == alg.bnx_git_demo()[''merge'']'
  steps:
  - show: <div class="code"><div>import hashlib</div><div>noi_dung = "phi=6600\n".encode()</div><div>dau
      = f"blob {len(noi_dung)}\0".encode()</div><div>print(len(noi_dung))</div><div>print(hashlib.sha1(dau
      + noi_dung).hexdigest())</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>9</div><div>a9b66cbffa3ddbb8bd633e5dc03afc3fb5575166</div></div>
    focus:
    - 0
    - 1
    - 1
    - 3
    - 1
    - 3
    - 0
    say: Bây giờ ta kiểm lại bằng một đường khác. Python là một ngôn ngữ lập trình
      ngắn gọn, ở đây chỉ dùng thư viện băm có sẵn của nó. Ta không dùng trình quản
      lý phiên bản mà tự tính mã băm bằng Python, theo đúng cách trình quản lý phiên
      bản làm. Nội dung tệp là tám ký tự của dòng phí cộng một ký tự xuống dòng mà
      lệnh ghi tệp tự thêm, nên dài chín ký tự. Trình quản lý phiên bản ghép chữ chỉ
      loại nội dung, độ dài chín, một ký tự rỗng, rồi tới nội dung, sau đó băm cả
      chuỗi. Kết quả trùng từng ký tự với mã nội dung mà trình quản lý phiên bản vừa
      in ra ở dòng cuối của ví dụ. Vì hai cách tính độc lập cho cùng một mã, ta biết
      trình quản lý phiên bản thật sự đặt tên nội dung theo chính nội dung.
  - show: <table class='t'><tr><th>đối tượng</th><th>git in ra</th><th>Python thuần
      tự tính</th></tr><tr><td>nội dung phi=6600</td><td>a9b66cb…</td><td>a9b66cb…</td></tr><tr><td>commit
      gốc</td><td>18bdd9f…</td><td>18bdd9f…</td></tr><tr><td>commit gộp (2 cha)</td><td>0eac7e6…</td><td>0eac7e6…</td></tr></table>
    clear: true
    say: Bộ kiểm của bài còn đi xa hơn một bước. Nó dựng lại cả cây và các lần chốt
      bằng Python thuần, với cùng tên người viết, giờ và lời nhắn. Mã của lần chốt
      gốc và lần chốt gộp đều khớp, nên mã chốt chỉ phụ thuộc nội dung, cha, người
      viết, giờ và lời nhắn.
