      -m "Thêm cấu hình kết nối"</div><div>git rm -q .env</div><div>git commit -q
      -m "Xoá mật khẩu"</div><div>git ls-files</div><div>git log --format="%h %s"</div><div>git
      show 57d5547:.env</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Lỗi thứ hai, của người đã đi làm. Lỡ chốt tệp chứa mật khẩu cơ sở dữ liệu,
      rồi xoá tệp đó ở lần chốt sau và yên tâm là đã hết. Ta làm thử trên một nhánh
      mới tách ra từ lần chốt gốc, để lịch sử ngắn và dễ đọc.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>phi.txt</div><div>96f907b
      Xoá mật khẩu</div><div>57d5547 Thêm cấu hình kết nối</div><div>18bdd9f Phí chuyển
      khoản 5500</div><div>DB_PASS=MatKhau123</div></div><div class="box key">Tệp
      đã biến khỏi cây hiện tại, nhưng commit cũ <code>57d5547</code> vẫn trả lại
      mật khẩu. <b>Cách chữa: đổi mật khẩu ngay</b>, rồi mới tính chuyện dọn lịch
      sử.</div>'
    focus:
    - 2
    - 2
    - 3
    clear: true
    say: Danh sách tệp hiện tại chỉ còn tệp phí, nhưng lịch sử vẫn còn lần chốt cũ.
      Lệnh xem tệp ở lần chốt cũ trả lại nguyên mật khẩu, nên ai có bản sao kho, tức
      đã chép cả lịch sử về máy, đều đọc được. Cách chữa là đổi mật khẩu ngay, vì
      xoá ở lần chốt sau không xoá được nó khỏi lịch sử.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> <code>git push --force</code>
      lên nhánh chung: máy chủ bị ghi đè bằng lịch sử trên máy mình, commit đồng nghiệp
      vừa đẩy lên <b class="red">mất khỏi nhánh</b>.

      <br><span class="note">Cách chữa: khoá nhánh <code>main</code> trên máy chủ
      không cho ép đẩy. <code>git push --force-with-lease</code> từ chối khi máy chủ
      có commit mình chưa thấy, nhưng nếu máy mình vừa lấy về (kể cả công cụ lấy ngầm)
      thì nó coi là đã thấy và vẫn ghi đè.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, là ép đẩy lên nhánh chung. Máy chủ
      bị ghi đè bằng lịch sử trên máy mình, nên lần chốt đồng nghiệp vừa đẩy lên biến
      khỏi nhánh. Cách chữa chắc chắn là khoá nhánh chính trên máy chủ không cho ép
      đẩy. Ép đẩy kèm điều kiện sẽ từ chối khi máy chủ có thứ mình chưa thấy, nhưng
      nếu máy mình vừa lấy về thì nó vẫn cho ghi đè.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_merge3('5500', '7700', '5500') == ('ok', '7700')
  - 4 + 2 + 1 == 7
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Gốc
      <code>phi=5500</code>. Nhánh A sửa thành 7700, nhánh B không chạm tệp phí. Gộp
      B vào A có xung đột không? Tệp còn giá trị nào?</td></tr><tr><td>2</td><td>Lịch
      sử đang có 4 commit như ví dụ. Bạn gộp vào một nhánh có 2 commit riêng. Sau
      khi gộp có bao nhiêu commit? Commit mới có mấy cha?</td></tr><tr><td>3</td><td>Quyết
      định: mật khẩu đã lên máy chủ chung được 10 phút. Đổi mật khẩu ngay, hay viết
      lại lịch sử để xoá rồi ép đẩy?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, gốc là năm nghìn năm trăm, nhánh
      A sửa thành bảy nghìn bảy trăm, nhánh B không chạm tệp phí. Gộp có xung đột
      không, và tệp còn giá trị nào? Câu hai, lịch sử đang có bốn lần chốt như ví
      dụ, bạn gộp vào một nhánh có hai lần chốt riêng. Sau gộp có bao nhiêu lần chốt,
      và lần chốt mới có mấy cha? Câu ba là một quyết định có đánh đổi. Mật khẩu đã
      lên máy chủ chung được mười phút. Đổi mật khẩu ngay, hay viết lại lịch sử để
      xoá rồi ép đẩy? Hãy dừng video lại và làm ra giấy trước.
  - show: '<p>Câu 1: chỉ nhánh A đổi so với gốc.</p>

      $$\text{gốc } 5\,500,\ \text{A } 7\,700,\ \text{B } 5\,500 \;\Rightarrow\; \hlg{7\,700},\
      \text{không xung đột}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bây giờ ta xem đáp án câu một. So từng bên với gốc, chỉ nhánh A đổi, còn
      nhánh B giữ nguyên năm nghìn năm trăm. Theo luật gộp ba chiều, trình quản lý
      phiên bản lấy bên đã đổi, nên tệp còn bảy nghìn bảy trăm và không có xung đột.
    clear: true
    introduces:
    - implies
  - show: '<p>Câu 2: dùng lại 4 commit của ví dụ.</p>

      $$4 + 2 + 1 = \hlg{7} \text{ commit}, \qquad \text{commit gộp có } \hl{2} \text{
      cha}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Tiếp theo là đáp án của câu hai. Dùng lại bốn lần chốt của ví dụ, cộng hai
      lần chốt của nhánh kia, cộng một lần chốt gộp, bằng bảy. Lần chốt gộp có hai
      cha, một ở mỗi nhánh.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>đổi
      mật khẩu ngay (bắt buộc)</td><td>mật khẩu cũ vô dụng, kể cả trên mọi bản sao
      đã tải về</td><td>phải cập nhật cấu hình mọi nơi dùng mật khẩu đó</td></tr><tr><td>viết
      lại lịch sử rồi ép đẩy (làm thêm)</td><td>kho sạch cho người tải sau</td><td>mọi
      người phải lấy lại kho; bản sao cũ vẫn còn mật khẩu; ép đẩy nhánh chung</td></tr></table>
    say: Cuối cùng là đáp án của câu ba. Đổi mật khẩu ngay là bắt buộc, vì trong mười
      phút đó bản sao kho có thể đã nằm trên máy khác, đổi rồi thì mật khẩu cũ vô
      dụng. Viết lại lịch sử chỉ là việc làm thêm. Nó cho kho sạch với người tải sau,
      nhưng mọi người phải lấy lại kho, còn bản sao cũ vẫn giữ mật khẩu.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>commit = ảnh chụp có mã băm</span><span
      class=''a''>→</span><span class=''n''>nhánh = nhãn trỏ commit</span><span class=''a''>→</span><span
      class=''n''>gộp ba chiều so với gốc</span><span class=''a''>→</span><span class=''n''>cùng
      dòng khác nhau: người quyết</span><span class=''a''>→</span><span class=''n''>lịch
      sử không quên</span></div>'
    say: Bây giờ ta tổng kết lại chuỗi logic. Mỗi lần chốt là một ảnh chụp có mã băm,
      còn nhánh chỉ là nhãn trỏ vào lần chốt. Khi gộp, máy so từng bên với gốc. Hai
      bên đổi cùng dòng khác nhau thì người quyết. Và lịch sử không quên thứ gì đã
      chốt.
  - show: <div class='box key'><b>Tư duy:</b> mã commit là <b>tên duy nhất của một
      trạng thái mã nguồn</b>. Cái gì đã commit thì coi như đã công bố cho mọi người
      có bản sao kho.</div>
    say: Và đây là điều cần mang theo sau bài. Mã chốt là tên duy nhất của một trạng
      thái mã nguồn, và cái gì đã chốt thì coi như đã công bố cho mọi người có bản
      sao kho.
  - show: '<p class=''note''>Bài 13: mã commit được gắn lên ảnh chạy trên máy chủ,
      để từ một lỗi lúc vận hành truy ngược đúng dòng mã.</p>'
    forward_ref: true
    say: Ở bài mười ba, mã chốt này được gắn lên bản đóng gói chạy trên máy chủ, để
      khi có lỗi lúc vận hành ta truy ngược được đúng dòng mã.
