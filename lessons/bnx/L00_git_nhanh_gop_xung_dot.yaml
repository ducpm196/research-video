      HEAD</code> trong tệp cấu hình rồi commit.

      <br><span class="note">Phép thử: sau <code>git add</code>, chạy <code>git diff
      --cached --check</code>; nó báo “leftover conflict marker” trước khi commit.</span></div>

      '
