    clear: true
    say: Hai gạch đứng nghĩa là phần trong ngoặc nhọn chỉ chạy khi lệnh trước thất
      bại, như gộp bị xung đột, rồi lệnh huỷ gộp trả tệp về như cũ. Hai cặp ngoặc
      tròn tính số nguyên, đường dẫn rỗng là nơi vứt đầu ra.
  - show: '<p><b>Đo thật: N nhánh cùng sửa dòng phí, gộp lần lượt vào main</b></p><div
      class="code"><div>N=10</div><div>cd `mktemp -d` &amp;&amp; git init -q -b main</div><div>echo
      "phi=5500" &gt; phi.txt &amp;&amp; git add phi.txt &amp;&amp; git commit -q
      -m goc</div><div>for i in `seq 1 <span>&#36;</span>N`; do</div><div>  git switch
      -q -c n<span>&#36;</span>i main</div><div>  echo "phi=<span>&#36;</span>i" &gt;
      phi.txt &amp;&amp; git commit -q -am "n<span>&#36;</span>i"</div><div>done</div><div>git
      switch -q main; xd=0</div><div>for i in `seq 1 <span>&#36;</span>N`; do</div><div>  git
      merge -q n<span>&#36;</span>i &gt;/dev/null || { xd=<span>&#36;</span>((xd+1));
