      '
    say: Nếu kẹt, nhớ rằng xung đột nghĩa là tệp đang chứa dấu mốc, nên ghi đè nó
      bằng dòng lãi suất tám, đưa vào vùng chờ rồi chốt. Lời giải nằm trong thư mục
      thực hành, chỉ mở sau khi đã tự thử.
