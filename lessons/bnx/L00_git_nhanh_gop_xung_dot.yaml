  - show: <table class='t'><tr><th>cách viết</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td><code>lệnh_a
      || { lệnh_b; lệnh_c; }</code></td><td>phần trong ngoặc nhọn gom nhiều lệnh,
      chỉ chạy khi <code>lệnh_a</code> thất bại</td><td>gộp xung đột thì thất bại</td></tr><tr><td><code>git
      merge --abort</code></td><td>huỷ lần gộp đang dở, trả tệp về như trước khi gộp</td><td>để
      gộp nhánh kế tiếp</td></tr><tr><td><code>xd=&#36;((xd+1))</code></td><td>tính
