scenes:
- id: hook
  kind: hook
  title: 'Hai người cùng sửa một dòng phí: ai thắng?'
  steps:
  - show: '<p>Tệp cấu hình ghi phí chuyển khoản <code>phi=5500</code> đồng <span class=''note''>(số
      minh hoạ)</span>.</p>

      <div class="box key">Cùng một sáng: <b>An</b> sửa thành <b>6 600</b>, <b>Bình</b>
      sửa thành <b>4 400</b>. Cùng tệp, cùng dòng.</div>

      <div class="box warn">Gửi tệp cho nhau rồi chép đè: một thay đổi <b class="red">biến
      mất</b> mà không ai hay.</div>

      '
    focus:
    - 1
    - 2
    - 3
    say: Chào bạn, tệp cấu hình ghi phí chuyển khoản là năm nghìn năm trăm đồng, số
      minh hoạ. Một buổi sáng, An sửa thành sáu nghìn sáu trăm, còn Bình sửa thành
      bốn nghìn bốn trăm, cùng một dòng. Nếu hai người chép đè tệp cho nhau, một thay
      đổi sẽ biến mất mà không ai hay.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>Git
      ghi lịch sử thế nào?</td><td>mỗi commit là một ảnh chụp cả cây tệp, có mã riêng
      dài 40 ký tự</td></tr><tr><td>hai nhánh sửa cùng dòng thì sao?</td><td>Git dừng
      lại, đánh ba dấu mốc, người quyết rồi commit gộp có 2 cha</td></tr><tr><td>cả
      nhóm cùng sửa một dòng thì sao?</td><td>đo thật: càng nhiều nhánh, càng nhiều
      xung đột phải giải</td></tr><tr><td>lỡ commit mật khẩu rồi xoá thì hết chưa?</td><td>chưa:
      lịch sử vẫn giữ, phải đổi mật khẩu</td></tr></table>'
    say: Hôm nay ta trả lời bốn câu hỏi. Trình quản lý phiên bản ghi lịch sử thế nào,
      hai nhánh cùng sửa một dòng thì sao, cả nhóm cùng sửa thì bao nhiêu xung đột,
      và chốt mật khẩu rồi xoá đã an toàn chưa?
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - int('ff', 16) == 15 * 16 + 15 == 255
  - alg.bnx_hex_bits(40) == 160
  - alg.bnx_hex_bits(1) == 4 and 2 ** 4 == 16
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Dòng lệnh</td><td>gõ lệnh và đối số, máy in kết quả; <code>&gt;</code> ghi kết
      quả vào tệp</td><td><code>echo "phi=5500" &gt; phi.txt</code> ghi một dòng vào
      tệp</td></tr><tr><td>② Thập lục phân</td><td>hệ đếm 16 chữ số: 0–9 rồi a–f;
      a = 10, f = 15; mỗi ký tự mang 4 bit vì 4 bit có 16 giá trị</td><td>$\text{ff}
      = 15 \cdot 16 + 15 = 255$</td></tr><tr><td>③ Hàm băm, mã băm</td><td>biến nội
      dung bất kỳ thành một chuỗi độ dài cố định, gọi là <b>mã băm</b>; đổi một ký
      tự thì kết quả khác hẳn</td><td>Git dùng thuật toán băm tên SHA-1: 160 bit,
      viết thành 40 ký tự thập lục phân</td></tr><tr><td>④ Kho chung</td><td>một kho
      trên <b>máy chủ</b> (máy luôn bật, nhiều người cùng nối vào) cho cả nhóm; <b>bản
      sao kho</b> (clone): chép cả lịch sử về máy; <b>đẩy</b> (push): gửi lên; <b>lấy
      về</b> (fetch): tải xuống</td><td>An đẩy, Bình lấy về</td></tr></table>'
    introduces:
    - bnx_thap_luc_phan
    - bnx_ma_bam
    - cdot
    say: 'Trước hết ta cần hiểu bốn điều, dòng lệnh là nơi gõ lệnh cho máy chạy và
      in kết quả, dấu lớn hơn ghi kết quả vào tệp. Thập lục phân là hệ đếm mười sáu
      chữ số, từ không đến chín rồi a đến f, với f là mười lăm. Hàm băm biến nội dung
      bất kỳ thành chuỗi dài cố định gọi là mã băm, đổi một ký tự thì khác hẳn. Trình
      quản lý phiên bản dùng thuật toán ra mã một trăm sáu mươi bít. Kho chung nằm
      trên máy chủ luôn bật: bản sao kho chép lịch sử về máy, đẩy là gửi lên, lấy
      về là tải xuống.'
  - show: '$$\text{ff} = 15 \cdot 16 + 15 = \hl{255}$$

      $$40 \text{ ký tự} \cdot 4 \text{ bit} = \hlg{160} \text{ bit}$$

      '
    focus:
    - - 1
    - 2
    clear: true
    say: Làm thử hai phép tính, hai chữ f cạnh nhau bằng mười lăm nhân mười sáu cộng
      mười lăm, tức hai trăm năm mươi lăm. Mỗi ký tự mang bốn bít, nên bốn mươi ký
      tự mang một trăm sáu mươi bít, đúng độ dài mã băm này.
- id: sym
  kind: symbol
  title: Giải mã các từ của Git
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>Git</td><td>trình
      quản lý phiên bản: chương trình ghi lại mọi lần sửa tệp của dự án</td></tr><tr><td>kho
      (repository)</td><td>thư mục có thư mục con <code>.git</code> giữ toàn bộ lịch
      sử</td></tr><tr><td>vùng chờ (<code>git add</code>)</td><td>nơi đặt các tệp
      sẽ vào lần lưu tới; <code>git add</code> đưa tệp vào đó</td></tr><tr><td>commit
      (lời giảng gọi là “lần chốt”)</td><td>một ảnh chụp cả cây tệp trong vùng chờ,
      kèm người viết, giờ, lời nhắn và mã của commit cha</td></tr><tr><td>mã commit</td><td>40
      ký tự thập lục phân, là mã băm của chính commit đó; vài ký tự đầu (thường 7)
      là mã ngắn</td></tr></table>'
    introduces:
    - bnx_vung_cho
    say: Từ đầu bảng là tên một chương trình, gọi là trình quản lý phiên bản, vì nó
      ghi lại mọi lần sửa tệp. Kho là thư mục giữ toàn bộ lịch sử. Vùng chờ là nơi
      đặt các tệp sẽ vào lần chốt tới. Từ thứ tư, ta đọc là lần chốt, là ảnh chụp
      cả cây tệp, kèm người viết, giờ, lời nhắn và mã của lần chốt cha. Mã chốt dài
      bốn mươi ký tự thập lục phân, là mã băm của chính nó.
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>nhánh (branch)</td><td>một
      nhãn trỏ vào commit mới nhất của một hướng làm việc; <code>main</code> là nhánh
      chính</td></tr><tr><td><code>HEAD</code></td><td>con trỏ “đang đứng ở đâu”:
      trỏ vào nhánh đang đứng, tức commit mới nhất của nhánh đó</td></tr><tr><td>gộp
      (merge)</td><td>ghép một nhánh vào nhánh đang đứng, tạo commit gộp có 2 cha</td></tr></table>'
    clear: true
    say: Ba từ về nhánh, nhánh chỉ là một cái nhãn trỏ vào lần chốt mới nhất của một
      hướng làm việc, và nhánh chính tên là main. Chữ in hoa là con trỏ cho biết ta
      đang đứng ở đâu, còn gộp là ghép một nhánh vào nhánh đang đứng, tạo một lần
      chốt gộp có hai cha.
  - show: '<table class=''t''><tr><th>dấu mốc</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;
      HEAD</code></td><td>bảy dấu nhỏ hơn</td><td>mở phần của nhánh đang đứng (ở đây:
      <code>main</code>)</td></tr><tr><td><code>=======</code></td><td>bảy dấu bằng</td><td>ranh
      giới giữa hai phần</td></tr><tr><td><code>&gt;&gt;&gt;&gt;&gt;&gt;&gt; tang</code></td><td>bảy
      dấu lớn hơn</td><td>đóng phần của nhánh được gộp vào (nhánh <code>tang</code>)</td></tr></table>'
    clear: true
    say: Khi gộp không tự xong, máy chèn ba dấu mốc vào tệp. Bảy dấu nhỏ hơn mở phần
      của nhánh đang đứng, bảy dấu bằng là ranh giới giữa hai phần, và bảy dấu lớn
      hơn đóng phần của nhánh được gộp vào, ở đây là nhánh tang.
  - show: '<table class=''t''><tr><th>lệnh</th><th>nghĩa</th></tr><tr><td><code>export
      TEN=giatri</code></td><td>đặt một biến môi trường: chương trình chạy sau đó
      đọc được; <code>GIT_AUTHOR_NAME=An</code> đặt tên người viết là An; <code>GIT_CONFIG_GLOBAL=/dev/null</code>
      bỏ cấu hình riêng của máy để ai chạy cũng ra cùng mã</td></tr><tr><td><code>cd
      `mktemp -d`</code></td><td><code>mktemp -d</code> tạo một thư mục tạm trống
      và in đường dẫn; dấu huyền chạy lệnh bên trong rồi thay bằng kết quả, nên <code>cd</code>
      đi vào đúng thư mục đó</td></tr><tr><td><code>git init -q -b main</code></td><td>tạo
      kho trống trong thư mục hiện tại; <code>-q</code> là chạy im lặng, <code>-b
      main</code> đặt tên nhánh đầu là <code>main</code></td></tr><tr><td><code>git
      switch -c tang</code></td><td>tạo nhánh <code>tang</code> rồi đứng sang đó;
      <code>git switch main</code> chỉ đứng sang nhánh có sẵn</td></tr><tr><td><code>git
      commit -am "lời nhắn"</code></td><td>đưa mọi tệp đã theo dõi vào vùng chờ rồi
      chốt luôn</td></tr></table>'
    clear: true
    say: Năm lệnh đầu của ví dụ, lệnh đặt biến cho chương trình chạy sau đọc được,
      như tên người viết, và biến cấu hình riêng đặt rỗng để ai chạy cũng ra cùng
      mã. Lệnh tạo thư mục tạm in đường dẫn, dấu huyền thay lệnh bên trong bằng kết
      quả của nó, nên lệnh chuyển thư mục đi vào đúng chỗ đó. Lệnh tạo kho có tuỳ
      chọn im lặng và tên nhánh đầu. Lệnh chuyển nhánh có tuỳ chọn tạo nhánh mới,
      còn lệnh chốt có tuỳ chọn chốt luôn mọi tệp đã theo dõi.
  - show: '<table class=''t''><tr><th>lệnh</th><th>nghĩa</th></tr><tr><td><code>cat
      phi.txt</code></td><td>in nội dung tệp <code>phi.txt</code> ra màn hình</td></tr><tr><td><code>git
      log --format="%H %s"</code></td><td>in lịch sử, mỗi commit một dòng theo mẫu:
      <code>%H</code> là mã băm đầy đủ 40 ký tự, <code>%s</code> là tiêu đề (lời nhắn)</td></tr><tr><td><code>git
      cat-file -p HEAD</code></td><td>in nội dung của một đối tượng Git, ở đây là
      commit mới nhất</td></tr><tr><td><code>git rev-parse HEAD:phi.txt</code></td><td>in
      mã nội dung của tệp <code>phi.txt</code> trong commit mới nhất</td></tr><tr><td><code>git
      log --graph --oneline</code></td><td>in lịch sử, mỗi commit một dòng, kèm đồ
      thị nhánh</td></tr></table>'
    clear: true
    say: Còn năm lệnh để xem lại, lệnh đầu in nội dung một tệp. Lệnh thứ hai in lịch
      sử theo mẫu, mã băm đầy đủ rồi tiêu đề. Lệnh thứ ba in lần chốt mới nhất, lệnh
      thứ tư in mã nội dung của một tệp, lệnh thứ năm in lịch sử kèm đồ thị nhánh.
