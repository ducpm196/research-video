    say: Bây giờ ta đo khi nhóm lớn dần. Biến N là số người, mỗi người một nhánh cùng
      sửa dòng phí. Rồi ta gộp lần lượt từng nhánh vào nhánh chính, lần gộp nào thất
      bại là một xung đột, ta huỷ gộp và đếm.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>10 nhanh cung sua
      mot dong: 9 xung dot</div></div><table class=''t''><tr><th>số nhánh N</th><th>xung
      đột phải giải</th><th>nếu mỗi người sửa tệp riêng</th><th>mỗi lần 3 phút (số
      minh hoạ)</th></tr><tr><td>2</td><td>1</td><td>0</td><td>3 phút</td></tr><tr><td>10
      (gấp 5 lần cỡ 2)</td><td>9</td><td>0</td><td>27 phút</td></tr><tr><td>50 (gấp
      25 lần cỡ 2)</td><td>49</td><td>0</td><td>147 phút, gần 2,5 giờ</td></tr></table>$$\text{xung
      đột} = N - 1 \qquad (N = 2, 10, 50 \Rightarrow 1,\; 9,\; \hl{49})$$'
    focus:
    - 0
    - 1
    - 2
    - 2
    clear: true
    say: Máy báo mười nhánh thì chín xung đột, còn hai và năm mươi nhánh cho một và
      bốn mươi chín. Vì nhánh đầu gộp được, còn mỗi nhánh sau đụng vào dòng đã đổi,
      nên xung đột bằng N trừ một. Với ba phút mỗi lần, số minh hoạ, năm mươi người
      tốn gần hai giờ rưỡi. Mỗi người một tệp riêng thì cả ba cỡ đều không xung đột.
    introduces:
    - implies
  - show: '<table class=''t''><tr><th>cách làm</th><th>đo được</th><th>được</th><th>mất</th></tr><tr><td>mỗi
      người một nhánh sống lâu, gộp một lần cuối kỳ</td><td>N − 1 xung đột dồn một
      ngày, mỗi cái đã cũ và khó nhớ lý do</td><td>không ai phải theo ai</td><td>ngày
      gộp là ngày rủi ro</td></tr><tr><td>nhánh ngắn, gộp vào main hằng ngày</td><td>mỗi
      lần chỉ vài dòng lệch, người sửa còn nhớ</td><td>xung đột nhỏ và sớm</td><td>phải
      kỷ luật lấy về trước khi gộp</td></tr><tr><td>tách tệp: mỗi người một tệp hoặc
      mô-đun</td><td>đo cùng chương trình khi mỗi người sửa tệp riêng: 0 xung đột</td><td>gần
      như hết xung đột</td><td>chỉ tách được khi công việc tách được</td></tr></table>'
    clear: true
    say: Người làm nghề chọn giữa ba cách, nhánh sống lâu dồn xung đột vào ngày gộp,
      nhánh ngắn gộp hằng ngày chia nhỏ chúng, tách tệp thì không xung đột nếu công
      việc tách được.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_git_demo()['secret_add'].startswith('57d5547') and alg.bnx_git_demo()['secret_rm'].startswith('96f907b')
  - len(alg.bnx_markers(alg.bnx_conflict_file('phi=4400', 'phi=6600'))) == 3
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Thấy xung đột tưởng Git
      hỏng, xoá kho tải lại; hoặc sửa vội mà <b class="red">để sót</b> dòng <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;
      HEAD</code> trong tệp cấu hình rồi commit.

      <br><span class="note">Phép thử: sau <code>git add</code>, chạy <code>git diff
      --cached --check</code>. <code>git diff --cached</code> so vùng chờ với lần
      chốt gần nhất; <code>--check</code> không in khác biệt mà chỉ tìm lỗi, như dấu
      mốc còn sót, và báo “leftover conflict marker”.</span></div>

      '
    say: Lỗi thứ nhất của người mới là thấy xung đột lại tưởng công cụ hỏng, rồi xoá
      kho tải lại, hoặc sửa vội mà để sót dấu mốc trong tệp. Phép thử là lệnh so vùng
      chờ với lần chốt gần nhất, có tuỳ chọn kiểm lỗi để chỉ báo còn sót dấu mốc.
  - show: <div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Commit tệp <code>.env</code>
      chứa mật khẩu, rồi xoá ở commit sau. <code>.env</code> là tệp cấu hình ẩn (tên
      bắt đầu bằng dấu chấm), nơi hay để mật khẩu.</div><table class='t'><tr><th>lệnh</th><th>nghĩa</th></tr><tr><td><code>git
      switch -c thu 18bdd9f</code></td><td>tạo nhánh <code>thu</code> xuất phát từ
      commit có mã <code>18bdd9f</code>, thay vì từ chỗ đang đứng</td></tr><tr><td><code>git
      rm .env</code></td><td>xoá tệp khỏi cây; <code>git ls-files</code> liệt kê các
      tệp đang được theo dõi</td></tr><tr><td><code>git log --format="%h %s"</code></td><td>như
      lệnh log ban nãy, nhưng <code>%h</code> là mã ngắn 7 ký tự, <code>%s</code>
      là lời nhắn</td></tr><tr><td><code>git show 57d5547:.env</code></td><td>in tệp
      <code>.env</code> đúng như ở commit có mã <code>57d5547</code></td></tr></table>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Lỗi thứ hai, của người đã đi làm. Lỡ chốt tệp cấu hình ẩn chứa mật khẩu,
      rồi xoá nó ở lần chốt sau và yên tâm là đã hết. Lệnh đầu tạo nhánh mới từ một
      lần chốt cũ, lệnh xoá tệp, lệnh xem lịch sử với mã ngắn bảy ký tự, và lệnh in
      tệp đúng như ở một lần chốt cũ.
  - show: <div class="code"><div>git switch -q -c thu 18bdd9f</div><div>echo "DB_PASS=MatKhau123"
      &gt; .env</div><div>git add .env</div><div>git commit -q -m "Thêm cấu hình kết
      nối"</div><div>git rm -q .env</div><div>git commit -q -m "Xoá mật khẩu"</div><div>git
      ls-files</div><div>git log --format="%h %s"</div><div>git show 57d5547:.env</div></div>
    clear: true
    say: 'Ta chạy cả chuỗi: chốt tệp mật khẩu, xoá tệp rồi chốt lần nữa, rồi xem ba
      kết quả cuối.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>phi.txt</div><div>96f907b
      Xoá mật khẩu</div><div>57d5547 Thêm cấu hình kết nối</div><div>18bdd9f Phí chuyển
      khoản 5500</div><div>DB_PASS=MatKhau123</div></div><div class="box key">Tệp
      đã biến khỏi cây hiện tại, nhưng commit cũ <code>57d5547</code> vẫn trả lại
      mật khẩu. <b>Cách chữa: đổi mật khẩu ngay</b>, rồi mới tính chuyện dọn lịch
      sử.</div>'
    focus:
    - 2
    - 3
    clear: true
    say: Danh sách tệp hiện tại chỉ còn tệp phí, nhưng lệnh xem tệp ở lần chốt cũ
      vẫn trả lại nguyên mật khẩu. Nên cách chữa là đổi mật khẩu ngay, vì xoá ở lần
      chốt sau không xoá được nó khỏi lịch sử.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> <code>git push --force</code>
      (đẩy và ép ghi đè) lên nhánh chung: máy chủ bị ghi đè bằng lịch sử trên máy
      mình, commit đồng nghiệp vừa đẩy lên <b class="red">mất khỏi nhánh</b>.

      <br><span class="note">Cách chữa: khoá nhánh <code>main</code> trên máy chủ
      không cho ép đẩy. <code>git push --force-with-lease</code> từ chối khi máy chủ
      có commit mình chưa thấy, nhưng nếu máy mình vừa lấy về (kể cả công cụ lấy ngầm)
      thì nó coi là đã thấy và vẫn ghi đè.</span></div>

      '
    clear: true
    say: 'Lỗi thứ ba là ép đẩy lên nhánh chung: máy chủ bị ghi đè, nên lần chốt đồng
      nghiệp vừa đẩy biến khỏi nhánh. Cách chữa chắc chắn là khoá nhánh chính không
      cho ép đẩy, vì ép đẩy kèm điều kiện vẫn ghi đè.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_merge3('5500', '7700', '5500') == ('ok', '7700')
  - 4 + 2 + 1 == 7
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Gốc
      <code>phi=5500</code>. Nhánh A sửa thành 7700, nhánh B không chạm tệp phí. Gộp
      B vào A có xung đột không? Tệp còn giá trị nào?</td></tr><tr><td>2</td><td>Lịch
      sử đang có 4 commit như ví dụ. Nhánh X rẽ ra từ commit gốc và có 2 commit riêng
      chưa nằm trong 4 commit đó; <code>main</code> cũng đã có commit mà X chưa có.
      Bạn gộp X vào <code>main</code> (không xung đột). Sau khi gộp có bao nhiêu commit?
      Commit mới có mấy cha?</td></tr><tr><td>3</td><td>Quyết định: mật khẩu đã lên
      máy chủ chung được 10 phút. Đổi mật khẩu ngay, hay viết lại lịch sử để xoá rồi
      ép đẩy?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài, ba câu trên màn hình. Câu hai gộp nhánh
      X có hai lần chốt riêng, trong khi nhánh chính cũng đã có lần chốt mà X chưa
      có, hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: chỉ nhánh A đổi so với gốc.</p>

      $$\text{gốc } 5\,500,\ \text{A } 7\,700,\ \text{B } 5\,500 \;\Rightarrow\; \hlg{7\,700},\
      \text{không xung đột}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu một, so từng bên với gốc, chỉ nhánh A đổi, nên trình quản lý phiên
      bản lấy bên đã đổi theo luật gộp ba chiều. Tệp còn bảy nghìn bảy trăm và không
      có xung đột.
    clear: true
  - show: '<p>Câu 2: dùng lại 4 commit của ví dụ.</p>

      $$4 + 2 + 1 = \hlg{7} \text{ commit}, \qquad \text{commit gộp có } \hl{2} \text{
      cha}$$

      <span class=''note''>Cả hai bên đều có commit riêng nên phải tạo commit gộp.
      Nếu <code>main</code> không có commit mới, Git chỉ tua nhanh: 4 + 2 = 6 commit,
      không có commit gộp.</span>

      '
    focus:
    - - 1
      - 2
    - 3
    say: Đáp án câu hai, bốn lần chốt của ví dụ, cộng hai lần chốt riêng của nhánh
      kia, cộng một lần chốt gộp, bằng bảy lần chốt, và lần chốt gộp có hai cha. Nếu
      nhánh chính không có gì mới thì chỉ tua nhanh, ra sáu lần chốt, không có lần
      chốt gộp.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>đổi
      mật khẩu ngay (bắt buộc)</td><td>mật khẩu cũ vô dụng, kể cả trên mọi bản sao
      đã tải về</td><td>phải cập nhật cấu hình mọi nơi dùng mật khẩu đó</td></tr><tr><td>viết
      lại lịch sử rồi ép đẩy (làm thêm)</td><td>kho sạch cho người tải sau</td><td>mọi
      người phải lấy lại kho; bản sao cũ vẫn còn mật khẩu; ép đẩy nhánh chung</td></tr></table>
    say: Đáp án câu ba, đổi mật khẩu ngay là bắt buộc, vì trong mười phút đó bản sao
      kho có thể đã nằm trên máy khác. Viết lại lịch sử chỉ làm thêm, bản sao cũ vẫn
      giữ mật khẩu.
    clear: true
