scenes:
- id: hook
  kind: hook
  title: 'Hai người cùng sửa một dòng phí: ai thắng?'
  steps:
  - show: '<p>Tệp cấu hình ghi phí chuyển khoản <code>phi=5500</code> đồng <span class=''note''>(số
      minh hoạ)</span>.</p>

      <div class="box key">Cùng một sáng: <b>An</b> sửa thành <b>6 600</b>, <b>Bình</b>
      sửa thành <b>4 400</b>. Cùng tệp, cùng dòng.</div>

      <div class="box warn">Gửi tệp cho nhau rồi chép đè: một thay đổi <b class="red">biến
      mất</b> mà không ai hay.</div>

      '
    focus:
    - 1
    - 2
    - 3
    say: Chào bạn, tệp cấu hình của dịch vụ chuyển khoản ghi phí là năm nghìn năm
      trăm đồng, đây là số minh hoạ. Cùng một buổi sáng, An sửa thành sáu nghìn sáu
      trăm, còn Bình sửa thành bốn nghìn bốn trăm, cùng một dòng. Nếu hai người gửi
      tệp cho nhau rồi chép đè, một thay đổi sẽ biến mất mà không ai hay.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>Git
      ghi lịch sử thế nào?</td><td>mỗi commit là một ảnh chụp cả cây tệp, có mã băm
      40 ký tự</td></tr><tr><td>hai nhánh sửa cùng dòng thì sao?</td><td>Git dừng
      lại, đánh ba dấu mốc, người quyết rồi commit gộp có 2 cha</td></tr><tr><td>lỡ
      commit mật khẩu rồi xoá thì hết chưa?</td><td>chưa: lịch sử vẫn giữ, phải đổi
      mật khẩu</td></tr></table>'
    say: Hôm nay ta trả lời ba câu hỏi. Trình quản lý phiên bản ghi lịch sử thế nào,
      hai nhánh cùng sửa một dòng thì chuyện gì xảy ra, và lỡ chốt mật khẩu rồi xoá
      đi thì đã an toàn chưa. Tin tuyển dụng ngân hàng ghi trình quản lý phiên bản
      là điểm cộng, nhưng đi làm thì ngày nào cũng dùng.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - int('ff', 16) == 15 * 16 + 15 == 255
  - alg.bnx_hex_bits(40) == 160
  - alg.bnx_hex_bits(1) == 4 and 2 ** 4 == 16
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Dòng lệnh</td><td>gõ lệnh và đối số, máy in kết quả; <code>&gt;</code> ghi kết
      quả vào tệp</td><td><code>echo "phi=5500" &gt; phi.txt</code> ghi một dòng vào
      tệp</td></tr><tr><td>② Thập lục phân</td><td>hệ đếm 16 chữ số: 0–9 rồi a–f;
      a = 10, f = 15; mỗi ký tự mang 4 bit vì 4 bit có 16 giá trị</td><td>$\text{ff}
      = 15 \cdot 16 + 15 = 255$</td></tr><tr><td>③ Hàm băm</td><td>biến nội dung bất
      kỳ thành một chuỗi độ dài cố định; đổi một ký tự thì kết quả khác hẳn</td><td>Git
      dùng SHA-1: 160 bit, viết thành 40 ký tự thập lục phân</td></tr><tr><td>④ Kho
      chung</td><td>một kho trên máy chủ cho cả nhóm; <b>bản sao kho</b> (clone):
      chép cả lịch sử về máy; <b>đẩy</b> (push): gửi lên; <b>lấy về</b> (fetch): tải
      xuống</td><td>An đẩy, Bình lấy về</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều sẽ dùng trong bài. Dòng lệnh là nơi gõ tên
      lệnh cùng đối số, máy chạy rồi in kết quả, còn dấu lớn hơn nghĩa là ghi kết
      quả vào tệp. Thập lục phân là hệ đếm có mười sáu chữ số, từ không đến chín rồi
      từ a đến f, trong đó a là mười và f là mười lăm. Hàm băm biến nội dung bất kỳ
      thành một chuỗi độ dài cố định, và chỉ đổi một ký tự thì kết quả khác hẳn. Cuối
      cùng, cả nhóm dùng chung một kho đặt trên máy chủ. Bản sao kho là chép cả lịch
      sử về máy mình. Đẩy là gửi phần mới của mình lên máy chủ, còn lấy về là tải
      phần mới của người khác xuống máy mình.
    introduces:
    - cdot
  - show: '$$\text{ff} = 15 \cdot 16 + 15 = \hl{255}$$

      $$40 \text{ ký tự} \cdot 4 \text{ bit} = \hlg{160} \text{ bit}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bây giờ ta làm thử hai phép tính nhỏ. Hai chữ f đứng cạnh nhau bằng mười
      lăm nhân mười sáu cộng mười lăm, tức hai trăm năm mươi lăm. Mỗi ký tự thập lục
      phân mang bốn bít, nên bốn mươi ký tự mang một trăm sáu mươi bít, đúng độ dài
      mã băm của trình quản lý phiên bản.
- id: sym
  kind: symbol
  title: Giải mã các từ của Git
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>Git</td><td>trình
      quản lý phiên bản: chương trình ghi lại mọi lần sửa tệp của dự án</td></tr><tr><td>kho
      (repository)</td><td>thư mục có thư mục con <code>.git</code> giữ toàn bộ lịch
      sử</td></tr><tr><td>vùng chờ (<code>git add</code>)</td><td>nơi đặt các tệp
      sẽ vào lần lưu tới; <code>git add</code> đưa tệp vào đó</td></tr><tr><td>commit
      (lời giảng gọi là “lần chốt”)</td><td>một ảnh chụp cả cây tệp trong vùng chờ,
      kèm người viết, giờ, lời nhắn và mã của commit cha</td></tr><tr><td>mã commit</td><td>40
      ký tự thập lục phân, là mã băm của chính commit đó; vài ký tự đầu (thường 7,
      có công cụ dùng 8) là mã ngắn</td></tr></table>'
    say: Bảng này giải mã năm từ đầu tiên của bài. Hàng đầu là tên của trình quản
      lý phiên bản ta dùng, một chương trình ghi lại mọi lần sửa tệp của dự án. Kho
      là thư mục có một thư mục con ẩn giữ toàn bộ lịch sử. Vùng chờ là nơi đặt các
      tệp sẽ vào lần lưu tới, và lệnh thêm đưa tệp vào đó. Từ tiếng Anh ở hàng thứ
      tư, trong lời giảng gọi là lần chốt, là một ảnh chụp cả cây tệp trong vùng chờ,
      kèm người viết, giờ, lời nhắn và mã của lần chốt cha. Mã chốt dài bốn mươi ký
      tự thập lục phân, là mã băm của chính lần chốt đó. Vài ký tự đầu, thường là
      bảy, có công cụ dùng tám, gọi là mã ngắn.
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>nhánh (branch)</td><td>một
      nhãn trỏ vào commit mới nhất của một hướng làm việc; <code>main</code> là nhánh
      chính</td></tr><tr><td><code>HEAD</code></td><td>con trỏ “đang đứng ở đâu”:
      trỏ vào nhánh đang đứng, tức commit mới nhất của nhánh đó</td></tr><tr><td>gộp
      (merge)</td><td>ghép một nhánh vào nhánh đang đứng, tạo commit gộp có 2 cha</td></tr></table>'
    clear: true
    say: Bảng thứ hai giải mã thêm ba từ về nhánh. Nhánh chỉ là một cái nhãn trỏ vào
      lần chốt mới nhất của một hướng làm việc, và nhánh chính tên là main. Chữ in
      hoa ở hàng giữa là con trỏ cho biết ta đang đứng ở đâu, nó trỏ vào nhánh đang
      đứng, tức lần chốt mới nhất của nhánh đó. Gộp là ghép một nhánh vào nhánh đang
      đứng, tạo ra một lần chốt gộp có hai cha.
  - show: '<table class=''t''><tr><th>dấu mốc</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;
      HEAD</code></td><td>bảy dấu nhỏ hơn</td><td>mở phần của nhánh đang đứng (ở đây:
      <code>main</code>)</td></tr><tr><td><code>=======</code></td><td>bảy dấu bằng</td><td>ranh
      giới giữa hai phần</td></tr><tr><td><code>&gt;&gt;&gt;&gt;&gt;&gt;&gt; tang</code></td><td>bảy
      dấu lớn hơn</td><td>đóng phần của nhánh được gộp vào (nhánh <code>tang</code>)</td></tr></table>'
    clear: true
    say: Khi gộp không tự xong, trình quản lý phiên bản chèn ba dấu mốc vào tệp. Bảy
      dấu nhỏ hơn mở phần của nhánh đang đứng, ở đây là nhánh chính. Bảy dấu bằng
      là ranh giới giữa hai phần. Bảy dấu lớn hơn đóng phần của nhánh được gộp vào,
      ở đây là nhánh tang.
