  - show: '<p><b>Bước 5. Phiếu sự cố.</b> Phiếu tốt cho người nhận <b>mọi thứ để bắt
      đầu</b>: mức, ảnh hưởng, chứng cứ (mã tương quan, chỉ số), cách tái hiện, hành
