- id: practice
  kind: practice
  title: 'Tự làm: ngân sách SLA và khung bản thiết kế'
  steps:
  - show: '<p><b>Đề</b> (giấy bút, số minh hoạ): tháng <b>31 ngày</b>, SLA <b>99,8%</b>,
