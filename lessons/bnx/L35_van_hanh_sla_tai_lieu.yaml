  - show: '<p><b>Bước 7. Kịch bản kiểm thử, môi trường kiểm thử, nhà cung cấp.</b>
      Trước khi đưa bản sửa lên môi trường thật: có <b>kịch bản kiểm thử</b> (bước,
      dữ liệu, kết quả mong đợi), chạy ở <b>môi trường kiểm thử</b> giống môi trường
      thật ở điều quan trọng (phiên bản, cấu hình), và với <b>nhà cung cấp</b> thì
      có <b>thoả thuận nội bộ hoặc hợp đồng</b> với hạn phản hồi, và ca kiểm riêng
      cho phần phụ thuộc họ.</p><table class=''t''><tr><th>việc</th><th>đầu ra cần
      có</th><th>dấu hiệu làm thiếu</th></tr><tr><td>kịch bản kiểm thử</td><td>bước,
