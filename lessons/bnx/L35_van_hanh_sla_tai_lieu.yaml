      dich vu noi tiep (99.95, 99.9, 99.9): {ba * 100:.4f}%")</div><div>print(f"ngan
      sach neu cam ket chung: {THANG * (1 - ba):.2f} phut/thang")</div></div>$$0{,}9995
      \times 0{,}999 \times 0{,}999 = \hl{0{,}997502}$$'
    focus:
    - 1
    - 3
    clear: true
    say: Bước ba là nối tiếp thì nhân, vì mỗi dịch vụ trên đường đi đều phải sống.
      Ba dịch vụ chín mươi chín phẩy chín lăm, chín mươi chín phẩy chín và chín mươi
      chín phẩy chín cho chín mươi chín phẩy bảy năm không hai phần trăm, thấp hơn
      cả ba.
  - show: <p><b>Bước 4. Sự cố, mức độ và hỗ trợ mức 3.</b> Mỗi sự cố có mức (ví dụ
