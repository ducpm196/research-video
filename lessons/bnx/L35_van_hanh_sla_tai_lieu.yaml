- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ cam kết tới việc phải làm'
  checks:
  - alg.bnx_l35_budget('99.9', 30) == 43.2
  - alg.bnx_l35_chain(['0.9995', '0.999', '0.999']) == 0.997502
  - alg.bnx_l35_chain(['0.9995', '0.9995'], 8) == 0.99900025 and 0.99900025 >= 0.999
  - 9 * 60 + 10 + 30 == 9 * 60 + 40
  steps:
  - show: '<p><b>Bước 1. Bốn chữ cái.</b> Muốn nói về &laquo;dịch vụ tốt&raquo; mà
      không cãi nhau, ta tách bốn việc (ví dụ cho dịch vụ chuyển tiền, số minh hoạ):</p><table
      class=''t''><tr><th>việc</th><th>chữ</th><th>ví dụ</th></tr><tr><td>đo</td><td>SLI</td><td>tỉ
      lệ yêu cầu chuyển tiền thành công</td></tr><tr><td>đặt</td><td>SLO</td><td>tỉ
      lệ ấy ≥ 99,9% mỗi tháng</td></tr><tr><td>cam kết với khách, có hệ quả</td><td>SLA</td><td>99,9%;
      trượt thì hoàn phí</td></tr><tr><td>cam kết nội bộ giữa các đội</td><td>OLA</td><td>hạ
      tầng 99,95% và cơ sở dữ liệu 99,95%: 0,9995 × 0,9995 = 0,99900025 ≥ 0,999</td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước một là bốn chữ cái, vì muốn nói về dịch vụ tốt mà không cãi nhau ta
      tách bốn việc. Đo là chỉ số, đặt là mục tiêu, cam kết với khách có hệ quả khi
      trượt, như hoàn phí. Cam kết nội bộ là các đội hứa với nhau: hạ tầng và cơ sở
      dữ liệu mỗi đội chín mươi chín phẩy chín lăm, nhân nhau vẫn đủ giữ lời hứa với
      khách.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>from
      decimal import Decimal as D</code>, <code>D("0.9995") * D("0.999")</code></td><td>nạp
      kiểu số thập phân, gọi tắt <code>D</code>: giữ đúng từng chữ số, không sai số
      làm tròn; <code>*</code> nhân hai số <code>D</code></td><td><code>D("0.5") *
      D("0.5")</code> ra <code>0.25</code></td></tr><tr><td><code>for muc in ("99",
      "99.9"):</code></td><td>mỗi vòng <code>muc</code> nhận một giá trị trong dãy;
      các dòng thụt vào là thân vòng</td><td></td></tr><tr><td><code>{ns.normalize():f}</code>,
      <code>{x:.4f}</code></td><td>trong chuỗi f (phần trong ngoặc nhọn thay bằng
      giá trị): <code>normalize()</code> bỏ chữ số 0 thừa cuối, có thể ra <code>4.32E+2</code>;
      <code>:f</code> ép in dạng thường <code>432</code>; <code>:.4f</code>: đúng
      4 chữ số sau dấu chấm thập phân, chữ số cuối làm tròn</td><td><code>3.8</code>
      với <code>:.4f</code> in <code>3.8000</code></td></tr><tr><td><code>print(f"…")</code>,
      <code>#</code></td><td>in một dòng ra màn hình; từ <code>#</code> tới hết dòng
      là ghi chú, máy bỏ qua</td><td></td></tr></table>'
    clear: true
    say: Mã tính ngân sách có bốn ký hiệu nên ta đọc trước. Kiểu số thập phân, gọi
      tắt bằng chữ D, giữ đúng từng chữ số. Vòng lặp cho biến nhận lần lượt từng giá
      trị trong dãy. Trong chuỗi f, đuôi f in dạng thường, đuôi chấm bốn f giữ bốn
      chữ số sau dấu thập phân. Lệnh in đưa một dòng ra màn hình, còn dấu thăng mở
      đầu ghi chú.
  - show: '<p><b>Bước 2. Ngân sách ngừng.</b> Số phút ngừng tối đa = số phút trong
      tháng × (100 − tỉ lệ) : 100.</p><p><b>NganSach.py</b></p><div class="code"><div>from
      decimal import Decimal as D</div><div> </div><div>THANG = 30 * 24 * 60                      #
      43 200 phút trong tháng 30 ngày</div><div>for muc in ("99", "99.9", "99.95",
      "99.99"):</div><div>    ns = THANG * (100 - D(muc)) / 100</div><div>    print(f"{muc}%
      mot thang 30 ngay: toi da {ns.normalize():f} phut ngung")</div></div>$$43\,200
      \times (100 - 99{,}9) : 100 = \hl{43{,}2} \text{ phút}$$'
