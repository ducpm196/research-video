- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tính bằng phân số và bằng cách trừ dần'
  checks:
  - Fraction(216, 5) == Fraction('43.2')
  - 30 * 24 * 60 == 43200
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>from
      fractions import Fraction as F</code>, <code>F(999, 1000)</code></td><td>nạp
      kiểu phân số, gọi tắt <code>F</code>: đúng 999 phần 1000, không làm tròn</td><td><code>F(1,
      2) + F(1, 3)</code> ra <code>5/6</code></td></tr><tr><td><code>F(999, 1000)
      ** 2</code></td><td><code>**</code>: lũy thừa, <code>x ** 2</code> là x nhân
      x</td><td><code>F(1, 2) ** 2</code> ra <code>1/4</code></td></tr><tr><td><code>{float(…):.6f}</code></td><td><code>float</code>
      đổi phân số thành số thập phân thường; <code>:.6f</code>: 6 chữ số sau dấu chấm</td><td><code>float(F(1,
      4))</code> ra <code>0.25</code></td></tr><tr><td><code>sum(1 for _ in range(thang))</code></td><td>mỗi
      số của <code>range(thang)</code> được cộng 1, nên tổng là số lần lặp; <code>_</code>:
      tên biến bỏ đi</td><td><code>sum(1 for _ in range(5))</code> ra 5</td></tr></table>'
    clear: true
    say: Kiểu phân số giữ đúng tử số và mẫu số, không làm tròn. Hai dấu sao là lũy
      thừa, bình phương là nhân với chính nó. Hàm đổi sang số thập phân thường, đuôi
      chấm sáu f giữ sáu chữ số. Mỗi số trong dãy được cộng một, nên tổng là số lần
      lặp.
  - show: <p><b>Kiểm bằng phân số, không dùng số thập phân của chương trình trước</b></p><div
      class="code"><div>from fractions import Fraction as F</div><div> </div><div>thang
      = 30 * 24 * 60</div><div>print(thang * (1 - F(999, 1000)))</div><div>print(f"{float(1
      - F(9995, 10000) * F(999, 1000) ** 2):.6f}")</div><div>print(sum(1 for _ in
      range(thang)))</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: 'Ta kiểm bằng đường khác hẳn: dùng phân số thay cho số thập phân, nên không
      có sai số làm tròn. Dòng đầu tính ngân sách, dòng hai tính tỉ lệ ngừng của chuỗi
      ba dịch vụ, dòng ba đếm từng phút trong tháng.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>216/5</div><div>0.002498</div><div>43200</div></div><table
      class=''t''><tr><th>cách</th><th>ngân sách 99,9%</th><th>chuỗi ba dịch vụ: tỉ
      lệ ngừng</th></tr><tr><td>số thập phân (Decimal)</td><td>43,2 phút</td><td>1
      − 0,997502 = 0,002498</td></tr><tr><td>phân số (Fraction)</td><td>216/5 = 43,2
      phút</td><td>0,002498</td></tr></table>'
    focus:
    - 1
    - 2
    clear: true
    say: Hai trăm mười sáu phần năm bằng bốn mươi ba phẩy hai phút, khớp số thập phân;
      tỉ lệ ngừng của chuỗi là không phẩy không không hai bốn chín tám, cũng khớp.
      Đếm từng phút ra bốn mươi ba nghìn hai trăm, nên hai đường độc lập cho cùng
      kết quả.
- id: quymo
  kind: example
  title: 'Khi hệ thống lớn dần: chuỗi dài làm độ sẵn sàng tụt'
