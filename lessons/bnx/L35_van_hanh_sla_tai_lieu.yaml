    - 3
    clear: true
    say: 'Số đo thật: một dịch vụ ngừng tối đa bốn mươi ba phẩy hai phút một tháng.
      Một trăm dịch vụ nối tiếp chỉ còn chín mươi phẩy bốn bảy chín hai phần trăm,
      tức ngừng hơn bốn nghìn phút. Mười nghìn dịch vụ thì tiến về không.'
  - show: '<table class=''t''><tr><th>cách</th><th>được</th><th>mất</th><th>chọn khi</th></tr><tr><td>thêm
      chữ số 9 cho từng dịch vụ</td><td>chuỗi bớt tụt</td><td>chi phí thường tăng
      thêm với mỗi chữ số 9 (mức tăng tuỳ hệ thống)</td><td>dịch vụ lõi mọi chuỗi
      cùng đi qua</td></tr><tr><td>rút ngắn chuỗi: gọi song song, bỏ mắt xích không
