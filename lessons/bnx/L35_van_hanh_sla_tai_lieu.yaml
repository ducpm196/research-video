  - show: '<p><b>QuyMoChuoi.py</b></p><div class="code"><div>from decimal import Decimal
      as D, getcontext</div><div> </div><div>getcontext().prec = 50</div><div>THANG
      = 30 * 24 * 60</div><div>for n in (1, 100, 10000):</div><div>    a = D("0.999")
      ** n</div><div>    print(f"{n} dich vu 99.9% noi tiep: {a * 100:.4f}% ; "</div><div>          f"ngung
      toi da {THANG * (1 - a):.1f} phut/thang")</div></div>'
    clear: true
    say: Ta chạy ba cỡ hệ thống, mọi dịch vụ nối tiếp đều chín mươi chín phẩy chín
