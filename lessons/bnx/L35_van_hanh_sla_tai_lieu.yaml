  - alg.bnx_l35_over(47, 43.2) == 3.8
  - alg.bnx_l35_chain(['0.9995', '0.999', '0.999']) == 0.997502
  steps:
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>99% mot thang 30
      ngay: toi da 432 phut ngung</div><div>99.9% mot thang 30 ngay: toi da 43.2 phut
      ngung</div><div>99.95% mot thang 30 ngay: toi da 21.6 phut ngung</div><div>99.99%
      mot thang 30 ngay: toi da 4.32 phut ngung</div></div>$$① \; 99\% \to 432; \;\;
      99{,}9\% \to 43{,}2; \;\; 99{,}95\% \to 21{,}6; \;\; 99{,}99\% \to \hlg{4{,}32}
      \text{ phút}$$'
    clear: true
    say: 'Phép tính thứ nhất là ngân sách ngừng của bốn mức, đã chạy thật: bốn trăm
      ba mươi hai, bốn mươi ba phẩy hai, hai mươi mốt phẩy sáu và bốn phẩy ba hai
      phút một tháng.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>3 dich vu noi tiep
      (99.95, 99.9, 99.9): 99.7502%</div><div>ngan sach neu cam ket chung: 107.91
      phut/thang</div></div>$$② \; 0{,}9995 \times 0{,}999 \times 0{,}999 = \hl{0{,}997502};
      \quad \text{ngân sách chung } 107{,}91 \text{ phút}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ hai là ba dịch vụ nối tiếp, độ sẵn sàng chung chín mươi chín
      phẩy bảy năm không hai phần trăm. Cam kết chung thì ngân sách ngừng là một trăm
      linh bảy phẩy chín mốt phút.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>su_co
      = [(12, "P2"), …]</code>, <code>sum(p for p, _ in su_co)</code></td><td>danh
      sách các cặp (số phút, mức); <code>for p, _ in su_co</code>: <code>p</code>
      là phần đầu của mỗi cặp, <code>_</code> bỏ phần sau; <code>sum</code> cộng hết</td><td><code>sum(p
      for p, _ in [(2, "a"), (3, "b")])</code> ra 5</td></tr><tr><td><code>" + ".join(str(p)
      for p, _ in su_co)</code></td><td><code>str(p)</code> đổi số thành chữ; <code>"
      + ".join(…)</code> nối các chữ, giữa hai chữ chèn dấu cộng</td><td>ra <code>12
      + 30 + 5</code></td></tr><tr><td><code>"vuot…" if tong &gt; ngan_sach else "con…"</code></td><td>biểu
      thức điều kiện: giá trị là chữ đầu nếu <code>tong</code> lớn hơn <code>ngan_sach</code>,
      ngược lại là chữ sau</td><td>47 lớn hơn 43,2 nên ra <code>vuot…</code></td></tr><tr><td><code>abs(tong
      - ngan_sach)</code></td><td>giá trị tuyệt đối: bỏ dấu âm nếu có</td><td><code>abs(-3.8)</code>
      ra <code>3.8</code></td></tr></table>'
    clear: true
    say: Mỗi cặp có số phút và mức, vòng lặp lấy số phút, gạch dưới bỏ mức, hàm tổng
      cộng hết. Hàm nối ghép các chữ, giữa hai chữ chèn dấu cộng. Biểu thức điều kiện
      cho chữ đầu nếu điều kiện đúng, ngược lại chữ sau. Giá trị tuyệt đối bỏ dấu
      âm nếu có.
  - show: '<p><b>SuCoThang.py: cộng sự cố, so với ngân sách</b></p><div class="code"><div>from
      decimal import Decimal as D</div><div> </div><div>THANG = 30 * 24 * 60</div><div>ngan_sach
      = THANG * D("0.1") / 100         # SLA 99,9% → 43,2 phút</div><div>su_co = [(12,
      "P2"), (30, "P1"), (5, "P3")]</div><div>tong = sum(p for p, _ in su_co)</div><div>cac
      = " + ".join(str(p) for p, _ in su_co)</div><div>print(f"su co: {cac} = {tong}
      phut; ngan sach {ngan_sach} phut")</div><div>print(f"san sang thuc te: {100
      - D(tong) / THANG * 100:.4f}%")</div><div>kq = "vuot ngan sach" if tong &gt;
      ngan_sach else "con trong ngan sach"</div><div>print(kq, f"{abs(tong - ngan_sach)}
      phut")</div></div>'
    clear: true
    say: 'Phép tính thứ ba là so sự cố với ngân sách: lấy ngân sách chín mươi chín
      phẩy chín, cộng các sự cố trong tháng, rồi so hai số.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>su co: 12 + 30 +
      5 = 47 phut; ngan sach 43.2 phut</div><div>san sang thuc te: 99.8912%</div><div>vuot
      ngan sach 3.8 phut</div></div>$$③ \; 12 + 30 + 5 = 47 > 43{,}2 \Rightarrow \hl{\text{vượt
      } 3{,}8 \text{ phút}}; \quad 100 - 47 : 432 = 99{,}8912\%$$<div class="box key"><b>Giả
      định:</b> hợp đồng tính cả ba sự cố vào phút ngừng. Nếu sự cố P3 (5 phút) không
      tính: 12 + 30 = 42 &lt; 43,2, chưa vượt.</div>'
    focus:
    - 1
    - 3
    clear: true
    say: Ba sự cố cộng bốn mươi bảy phút, vượt ngân sách ba phẩy tám phút; độ sẵn
      sàng thực tế chín mươi chín phẩy tám chín một hai phần trăm. Đó là khi hợp đồng
      tính cả ba sự cố; bỏ sự cố nhẹ năm phút thì chỉ bốn mươi hai phút, chưa vượt.
    introduces:
    - implies
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def
      kiem(vb): … return loi</code></td><td>khai hàm <code>kiem</code> nhận văn bản
