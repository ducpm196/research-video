      class='t'><tr><th>mức (ví dụ)</th><th>ý nghĩa</th><th>hạn phản hồi (số minh
      hoạ)</th></tr><tr><td>P1</td><td>ngừng hoàn toàn dịch vụ chính</td><td>15 phút</td></tr><tr><td>P2</td><td>chậm
      hoặc lỗi một phần dịch vụ chính</td><td>30 phút</td></tr><tr><td>P3</td><td>một
      chức năng phụ lỗi, có cách tạm</td><td>4 giờ</td></tr><tr><td>P4</td><td>câu
      hỏi, cải tiến</td><td>2 ngày làm việc</td></tr></table><p><b>Ca 1:</b> tra số
      dư chậm với 15% yêu cầu, báo lúc 09:10 → P2, phản hồi trước 09:10 + 30 phút
      = 09:40. <b>Ca 2:</b> xuất sao kê PDF lỗi, khách vẫn xem trên ứng dụng → P3,
      hạn 4 giờ.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn là sự cố và hỗ trợ mức ba. Mỗi sự cố có một mức do tổ chức tự đặt
      kèm hạn phản hồi, bảng này là số minh hoạ. Tra số dư chậm với mười lăm phần
      trăm yêu cầu là mức hai, báo lúc chín giờ mười thì phản hồi trước chín giờ bốn
