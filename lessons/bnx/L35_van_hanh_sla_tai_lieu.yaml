  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1 dich vu 99.9% noi
      tiep: 99.9000% ; ngung toi da 43.2 phut/thang</div><div>100 dich vu 99.9% noi
      tiep: 90.4792% ; ngung toi da 4113.0 phut/thang</div><div>10000 dich vu 99.9%
      noi tiep: 0.0045% ; ngung toi da 43198.0 phut/thang</div></div>$$1 \to 100 \to
      10\,000 \text{ dịch vụ } 99{,}9\%: \; 99{,}9\% \to \hl{90{,}4792\%} \to \hl{0{,}0045\%}$$'
