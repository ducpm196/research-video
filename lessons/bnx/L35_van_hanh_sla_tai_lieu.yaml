      mà không ghi gì</td></tr><tr><td>môi trường kiểm thử</td><td>cùng phiên bản
      và cấu hình với môi trường thật ở phần liên quan</td><td>bản sửa chạy ở kiểm
      thử, hỏng ở môi trường thật</td></tr><tr><td>nhà cung cấp</td><td>hạn phản hồi,
      người liên hệ, ca kiểm cho phần phụ thuộc</td><td>đối tác ngừng mà không ai
      biết gọi ai</td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước bảy là kịch bản kiểm thử, môi trường kiểm thử và nhà cung cấp. Kịch
      bản ghi bước, dữ liệu và kết quả mong đợi, nên ai chạy cũng ra cùng kết luận.
      Môi trường kiểm thử giống môi trường thật ở phiên bản và cấu hình, còn nhà cung
      cấp cần thoả thuận có hạn phản hồi.
- id: example
  kind: example
  title: Ví dụ chạy thật, từng phép tính
  checks:
  - alg.bnx_l35_budget('99.95', 30) == 21.6 and alg.bnx_l35_budget('99.99', 30) ==
