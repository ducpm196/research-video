      chín phẩy chín phần trăm, bốn mươi ba nghìn hai trăm nhân không phẩy một phần
      trăm là bốn mươi ba phẩy hai phút.
  - show: '<p><b>Bước 3. Nối tiếp thì nhân.</b> Yêu cầu đi qua nhiều dịch vụ, mỗi
