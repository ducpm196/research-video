scenes:
- id: hook
  kind: hook
  title: 99,9% nghe thì cao, nhưng một tháng chỉ cho phép 43 phút ngừng
  checks:
  - alg.bnx_l35_budget('99.9', 30) == 43.2
  - 12 + 30 + 5 == 47 and alg.bnx_l35_over(47, alg.bnx_l35_budget('99.9', 30)) ==
    3.8
  - alg.bnx_l35_chain(['0.999', '0.9995', '0.999']) == 0.997502
  steps:
  - show: '<p>Hợp đồng ghi dịch vụ sẵn sàng <b>99,9%</b>. Trong tháng có ba sự cố:
      <b>12, 30 và 5 phút</b>.</p>

      <div class="box key">Một tháng 30 ngày có 43 200 phút; 99,9% nghĩa là ngừng
      tối đa <b>43,2 phút</b>. Ba sự cố cộng lại <b>47 phút</b>: <b>vượt 3,8 phút</b>
      (giả sử hợp đồng tính cả ba sự cố vào phút ngừng).

      Và nếu dịch vụ này nối tiếp với hai dịch vụ khác, 99,95% và 99,9%, độ sẵn sàng
      chung còn bao nhiêu?</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, hợp đồng ghi chín mươi chín phẩy chín phần trăm sẵn sàng, mà tháng
      có ba sự cố, mười hai, ba mươi và năm phút. Tháng ba mươi ngày có bốn mươi ba
      nghìn hai trăm phút, nên mức này cho ngừng tối đa bốn mươi ba phẩy hai phút,
      còn ba sự cố cộng bốn mươi bảy phút, vượt ba phẩy tám. Nối tiếp với hai dịch
      vụ khác thì độ sẵn sàng chung còn bao nhiêu?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>SLA,
      SLO, SLI, OLA khác nhau thế nào</td><td><b>chỉ số</b> (SLI) đo; <b>mục tiêu</b>
      (SLO) đặt; <b>thoả thuận</b> (SLA) có hệ quả khi trượt; <b>thoả thuận nội bộ</b>
      (OLA) giữa các đội</td></tr><tr><td>99,9% là bao nhiêu phút</td><td><b>ngân
      sách ngừng</b> = số phút trong tháng × (100 − tỉ lệ) : 100</td></tr><tr><td>hỗ
      trợ mức 3 và phiếu sự cố</td><td>ai nhận khi mức 1–2 không giải quyết được;
      phiếu phải đủ chứng cứ để khỏi hỏi lại</td></tr><tr><td>bản thiết kế cần gì</td><td><b>bối
      cảnh – quyết định – hệ quả</b>, chấm bằng danh mục kiểm</td></tr></table>'
    focus:
    - 0
    clear: true
    say: 'Hôm nay ta trả lời bốn câu: các chữ viết tắt khác nhau thế nào, chín mươi
      chín phẩy chín phần trăm là bao nhiêu phút, phiếu sự cố cần gì, và bản thiết
      kế cần gì.'
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l35_budget('99', 30) == 432
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      độ sẵn sàng</td><td>phần trăm thời gian dịch vụ hoạt động được</td><td>99,9%
      một tháng</td></tr><tr><td>② sự cố</td><td>lúc dịch vụ không đạt yêu cầu; có
      mức độ nặng nhẹ</td><td>ứng dụng tra số dư không trả lời</td></tr><tr><td>③
      hỗ trợ theo mức</td><td>mức 1 nhận tin; mức 2 xử lý theo kịch bản; <b>mức 3</b>
      là kỹ sư sửa mã, cấu hình</td><td>mức 3 mới đọc được nhật ký sâu</td></tr><tr><td>④
      môi trường thật và môi trường kiểm thử</td><td>môi trường thật có khách thật;
      môi trường kiểm thử để thử trước, không có khách</td><td>thử bản sửa ở kiểm
      thử rồi mới lên thật</td></tr><tr><td>⑤ nhà cung cấp</td><td>bên ngoài cung
      cấp một phần dịch vụ; bên mình phụ thuộc vào họ</td><td>cổng thanh toán của
      đối tác</td></tr></table>
    say: Trước hết ta cần hiểu năm điều, độ sẵn sàng là phần trăm thời gian dịch vụ
      hoạt động được, sự cố là lúc dịch vụ không đạt yêu cầu. Hỗ trợ mức một nhận
      tin, mức hai xử lý theo kịch bản, mức ba là kỹ sư sửa mã. Môi trường kiểm thử
      để thử trước khi lên môi trường thật. Nhà cung cấp là bên ngoài mà mình phụ
      thuộc.
- id: sym
  kind: symbol
  title: Giải mã các chữ viết tắt trên màn hình
  checks:
  - alg.bnx_l35_budget('99.95', 30) == 21.6
  steps:
  - show: '<table class=''t''><tr><th>chữ</th><th>nghĩa</th></tr><tr><td>SLI</td><td>chỉ
      số mức dịch vụ: con số <b>đo</b> được, như tỉ lệ yêu cầu thành công</td></tr><tr><td>SLO</td><td>mục
      tiêu mức dịch vụ: giá trị <b>đặt</b> cho chỉ số, như ≥ 99,9%</td></tr><tr><td>SLA</td><td>thoả
      thuận mức dịch vụ: hợp đồng <b>có hệ quả</b> khi không đạt mục tiêu</td></tr><tr><td>OLA</td><td>thoả
      thuận mức vận hành: thoả thuận <b>giữa các đội trong nội bộ</b> để đạt SLA</td></tr><tr><td>P1…P4</td><td>mức
      độ sự cố do tổ chức quy định; P1 nặng nhất</td></tr><tr><td>ADR</td><td>bản
      ghi quyết định thiết kế: một trang gồm bối cảnh, quyết định, hệ quả</td></tr><tr><td>API,
      cổng API</td><td>API: cách một chương trình nhờ chương trình khác làm việc,
      bằng yêu cầu và trả lời. <b>Cổng API</b>: cửa chung mà mọi yêu cầu từ ngoài
      đi qua trước khi vào các dịch vụ</td></tr><tr><td>mã tương quan</td><td>chuỗi
      ký tự gắn vào một yêu cầu và có mặt ở mọi dòng nhật ký của yêu cầu đó, để tìm
      lại hành trình của nó; ví dụ <code>7f3a</code></td></tr><tr><td>đối soát</td><td>so
      hai sổ ghi cùng một việc để tìm dòng lệch; ví dụ sổ ngân hàng so với sổ đối
      tác thanh toán</td></tr></table>'
    say: 'Bảng này giải mã các chữ viết tắt: chỉ số là con số đo được, mục tiêu là
      giá trị đặt cho nó. Thoả thuận với khách có hệ quả khi không đạt, thoả thuận
      nội bộ là giữa các đội. Cổng API là cửa chung mọi yêu cầu đi qua, mã tương quan
      giúp tìm lại hành trình của một yêu cầu, và đối soát là so hai sổ để tìm dòng
      lệch.'
