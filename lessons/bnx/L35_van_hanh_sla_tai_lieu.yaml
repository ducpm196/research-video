      cổng chỉ gửi được số tin có hạn mỗi giây.
  - show: '<p><b>Bước 6. Bản thiết kế một trang.</b> Mỗi quyết định kiến trúc có một
      bản ghi ngắn: <b>Bối cảnh</b> (sự thật, lực kéo, trung lập), <b>Quyết định</b>
      (câu đầy đủ &laquo;Chúng tôi sẽ…&raquo;), <b>Hệ quả</b> (cả tích cực lẫn tiêu
      cực), kèm trạng thái. Theo bài viết gốc về mẫu này: hệ quả liệt kê &laquo;not
      just the positive ones&raquo;.</p><p><b>KiemTaiLieu.py (trích): một bản ghi
      quyết định mẫu</b></p><div class="code"><div>TOT = """# ADR 7: Dung hang doi
      cho thong bao sao ke</div><div>Trang thai: Da duyet</div><div>## Boi canh</div><div>Sao
