      = 50</code>, <code>D("0.999") ** n</code></td><td>đặt số chữ số tối đa của phép
      tính <code>D</code> là 50 (mặc định 28); <code>** n</code>: nhân 0,999 với chính
      nó <code>n</code> lần</td><td><code>n = 3</code>: <code>0.999 * 0.999 * 0.999</code></td></tr></table>'
    clear: true
    say: Dòng đầu đặt số chữ số tối đa của phép tính là năm mươi, và lũy thừa là nhân
