  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>TOT
      = """# ADR 7: …"""</code></td><td>chuỗi nhiều dòng giữa ba dấu nháy kép; <code>#</code>
      đầu dòng trong chuỗi là tiêu đề, không phải ghi chú; ADR 7: bản ghi quyết định
      số 7</td></tr><tr><td><code>SMS</code></td><td>tin nhắn văn bản tới điện thoại;
