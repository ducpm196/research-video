objectives:
- Tính ngân sách phút ngừng của mục tiêu sẵn sàng 99%, 99,9%, 99,95% và 99,99%
- Phân biệt chỉ số, mục tiêu, thoả thuận mức dịch vụ và thoả thuận nội bộ bằng ví
  dụ có số
- Tính độ sẵn sàng chung của các dịch vụ nối tiếp và nói vì sao chuỗi dài làm tụt
- Xác định một tháng có vượt ngân sách hay không từ danh sách sự cố
- Phân loại sự cố theo mức và nêu việc hỗ trợ mức 3 phải làm cùng nội dung phiếu sự
  cố
- Viết bản thiết kế theo khung bối cảnh, quyết định, hệ quả và tự chấm bằng danh mục
  kiểm
- Đếm độ sẵn sàng của chuỗi 1, 100 và 10 000 dịch vụ
- Tính tay ngân sách SLA, độ sẵn sàng chuỗi và dựng khung bản thiết kế trên số liệu
  mới
