    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước sáu là bản thiết kế một trang, vì người đến sau cần hiểu lý do. Bối
      cảnh nêu sự thật, quyết định là câu bắt đầu bằng chúng tôi sẽ, hệ quả liệt kê
      cả tích cực lẫn tiêu cực. Hàng đợi là nơi xếp tin chờ gửi dần theo tốc độ cổng
