- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ một lớp Java tới một gói triển khai'
  checks:
  - alg.bnx_l33_throughput(200, 0.5) == 400
  - alg.bnx_l33_waves(200, 4) == 50
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>int
      soYeuCau = 0;</code></td><td><b>trường</b>: biến khai trong lớp, ngoài mọi hàm;
      mọi lần gọi hàm của thể hiện đó dùng chung một bản</td></tr><tr><td><code>@Override
      protected void doGet(HttpServletRequest q, HttpServletResponse r)</code></td><td><code>@Override</code>:
      hàm này thay hàm cùng tên của lớp cha; <code>protected</code>: lớp con và cùng
      gói gọi được; <code>q</code> là yêu cầu đến, <code>r</code> là phản hồi sẽ trả</td></tr><tr><td><code>…
      throws IOException {</code></td><td>lời báo: hàm có thể ném lỗi loại đó; ai
      gọi phải bắt lỗi hoặc khai báo tiếp</td></tr><tr><td><code>r.setContentType("text/plain");</code>,
      <code>r.getWriter().print(…)</code></td><td>dòng đầu báo kiểu nội dung trả về
      là chữ thuần; <code>getWriter()</code> lấy đầu ghi vào phản hồi, <code>print</code>
      ghi một chuỗi</td></tr></table>'
    clear: true
    say: Chương trình phục vụ này có bốn chỗ cần đọc. Trường là biến khai trong lớp,
      mọi lần gọi hàm dùng chung một bản. Chú thích báo hàm thay hàm của lớp cha;
      tham số là yêu cầu và phản hồi. Lời báo hàm có thể ném lỗi, và ai gọi phải bắt
      lỗi. Báo kiểu nội dung là chữ thuần, rồi ghi một chuỗi vào phản hồi.
  - show: '<p><b>Bước 1. Servlet là một lớp Java.</b> Kế thừa <code>HttpServlet</code>
      và viết <code>doGet</code> cho yêu cầu GET. Nên đọc dự án cũ là đọc các lớp
      như thế này.</p><p><b>Chao.java: Servlet tối thiểu (jakarta.servlet)</b></p><div
      class="code"><div>public class Chao extends HttpServlet {</div><div>  int soYeuCau
      = 0;</div><div>  @Override public void init() {</div><div>    System.out.println("init:
      tao 1 lan");</div><div>  }</div><div>  @Override protected void doGet(HttpServletRequest
      q, HttpServletResponse r)</div><div>      throws IOException {</div><div>    soYeuCau++;</div><div>    r.setContentType("text/plain");</div><div>    r.getWriter().print("yeu
      cau so " + soYeuCau);</div><div>  }</div></div>'
    clear: true
    say: Bước một là chương trình phục vụ web chỉ là một lớp Java kế thừa lớp cha
      có sẵn, nên đọc dự án cũ là đọc các lớp như thế này.
  - show: '<p><b>Bước 2. Vòng đời do bộ chứa điều khiển.</b> Hướng dẫn của Tomcat/Jakarta:
      bộ chứa gọi <code>init</code> <b>đúng một lần</b> sau khi tạo thể hiện; mỗi
      yêu cầu vào <code>service</code>; <code>destroy</code> khi gỡ khỏi dịch vụ.
      Nên <b>một thể hiện</b> phục vụ mọi yêu cầu.</p>$$3 \text{ yêu cầu} \Rightarrow
      init \times 1, \; service \times 3, \; destroy \times 1$$'
    focus:
    - - 1
    - 2
    clear: true
    say: Bước hai là vòng đời, theo hướng dẫn chính thức, bộ chứa gọi khởi tạo đúng
      một lần, mỗi yêu cầu vào hàm phục vụ, và thu hồi khi gỡ chương trình. Vì vậy
      ba yêu cầu thì khởi tạo một lần, phục vụ ba lần, thu hồi một lần.
    introduces:
    - implies
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>cat
      &gt; war/WEB-INF/web.xml &lt;&lt;''EOF'' … EOF</code></td><td><code>cat &gt;
      tệp</code> ghi vào tệp; <code>&lt;&lt;''EOF''</code> mở khối chữ nhiều dòng:
      mọi dòng tới dòng chỉ có chữ <code>EOF</code> được ghi nguyên văn</td></tr><tr><td><code>&lt;servlet&gt;</code>,
      <code>&lt;servlet-name&gt;</code>, <code>&lt;servlet-class&gt;</code></td><td>khai
      một Servlet: tên tự đặt, và tên lớp Java thật của nó</td></tr><tr><td><code>&lt;servlet-mapping&gt;</code>,
      <code>&lt;url-pattern&gt;</code></td><td>nối tên với đường dẫn: yêu cầu tới
      <code>/chao</code> thì giao cho Servlet tên <code>chao</code>; thẻ ngoài cùng
      <code>&lt;web-app&gt;</code> bọc tất cả</td></tr></table>'
    clear: true
    say: Tệp khai báo viết bằng thẻ, ghi bằng khối chữ nhiều dòng. Lệnh ghi nhiều
      dòng vào tệp, nguyên văn tới dòng kết khối. Thẻ khai một chương trình phục vụ
      có tên tự đặt và tên lớp thật. Thẻ nối tên với đường dẫn, nên yêu cầu tới đường
      dẫn đó được giao đúng chỗ.
  - show: <p><b>Bước 3. Khai báo và đóng gói.</b> <code>web.xml</code> nói Servlet
      nào ứng với đường dẫn nào; thư mục <code>WEB-INF</code> chứa khai báo và lớp;
      cả thư mục nén thành <code>.war</code>.</p><p><b>web.xml trong WEB-INF</b></p><div
      class="code"><div>cat &gt; war/WEB-INF/web.xml &lt;&lt;'EOF'</div><div>&lt;web-app
      xmlns="https://jakarta.ee/xml/ns/jakartaee" version="6.0"&gt;</div><div>  &lt;servlet&gt;</div><div>    &lt;servlet-name&gt;chao&lt;/servlet-name&gt;</div><div>    &lt;servlet-class&gt;Chao&lt;/servlet-class&gt;</div><div>  &lt;/servlet&gt;</div><div>  &lt;servlet-mapping&gt;</div><div>    &lt;servlet-name&gt;chao&lt;/servlet-name&gt;</div><div>    &lt;url-pattern&gt;/chao&lt;/url-pattern&gt;</div><div>  &lt;/servlet-mapping&gt;</div><div>&lt;/web-app&gt;</div><div>EOF</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Bước ba là khai báo và đóng gói. Tệp khai báo nói chương trình nào ứng với
      đường dẫn nào, và cả thư mục nén lại thành một gói, nên ứng dụng chỉ là một
      tệp để chép lên máy chủ.
  - show: '<table class=''t''><tr><th>viết trong trang</th><th>nghĩa</th><th>ví dụ
      nhỏ</th></tr><tr><td><code>&lt;%@ page contentType="text/plain" %&gt;</code></td><td>chỉ
      thị đầu trang: trả về văn bản thuần, không phải trang HTML</td><td>trình duyệt
      hiện chữ nguyên văn</td></tr><tr><td><code>request.getParameter("ten")</code></td><td>lấy
      giá trị của tham số <code>ten</code> trong địa chỉ sau dấu <code>?</code></td><td><code>chao.jsp?ten=An</code>
      cho <code>An</code></td></tr><tr><td><code>&lt;%= 2 + 3 %&gt;</code></td><td>tính
      biểu thức rồi chèn kết quả vào trang</td><td>chèn <code>5</code></td></tr><tr><td><code>cat
      &gt; site/chao.jsp &lt;&lt;''EOF'' … EOF</code></td><td>như với <code>web.xml</code>:
      ghi mọi dòng tới dòng <code>EOF</code> vào tệp <code>chao.jsp</code></td><td>tệp
      có 2 dòng</td></tr></table>'
    clear: true
    say: Dòng chỉ thị đầu trang cho trả về văn bản thuần. Hàm lấy tham số đọc giá
      trị sau dấu hỏi trong địa chỉ, nên dấu biểu thức mới chèn được tên vào trang.
      Khối chữ nhiều dòng ghi trang vào tệp.
  - show: <p><b>Bước 4. Trang động.</b> Trang JSP là chữ cố định trộn với <code>&lt;%=
      … %&gt;</code>. Ở yêu cầu đầu, Tomcat <b>dịch</b> nó thành lớp Java, biên dịch
      rồi chạy như Servlet; các yêu cầu sau dùng lại lớp đã biên dịch (mặc định; trang
      bị sửa thì dịch lại).</p><p><b>site/chao.jsp</b></p><div class="code"><div>cat
      &gt; site/chao.jsp &lt;&lt;'EOF'</div><div>&lt;%@ page contentType="text/plain"
      %&gt;</div><div>Xin chao &lt;%= request.getParameter("ten") %&gt;, 2 + 3 = &lt;%=
      2 + 3 %&gt;</div><div>EOF</div></div>
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Bước bốn là trang động, trang chỉ là chữ cố định trộn với biểu thức. Ở yêu
      cầu đầu, Tomcat dịch trang thành lớp Java rồi biên dịch, nên các yêu cầu sau
      dùng lại lớp đã biên dịch.
  - show: '<p><b>Bước 5. Bể luồng quyết định sức chứa.</b> Tomcat cho mỗi yêu cầu
      một luồng của bể; hướng dẫn của Tomcat: <code>maxThreads</code> mặc định <b>200</b>.
      Mỗi yêu cầu mất <i>t</i> giây thì bể <i>L</i> luồng xử lý tối đa <i>L / t</i>
      yêu cầu mỗi giây.</p>$$\frac{200}{0{,}5 \text{ giây}} = \hl{400} \text{ yêu
      cầu mỗi giây}$$'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước năm là bể luồng quyết định sức chứa. Tomcat cho mỗi yêu cầu một luồng
      của bể, và theo hướng dẫn chính thức mặc định là hai trăm luồng. Mỗi yêu cầu
      mất nửa giây thì hai trăm luồng xử lý tối đa bốn trăm yêu cầu mỗi giây.
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>sed
      -i 's/javax\.servlet/jakarta.servlet/' Cu.java</code></td><td>thay chữ <code>javax.servlet</code>
      bằng <code>jakarta.servlet</code> ngay trong tệp; dòng <code>import</code> thành
      <code>import jakarta.servlet.http.HttpServlet;</code></td></tr><tr><td><code>javac
      -cp "lib/*" Cu.java 2&gt;&amp;1 | head -1</code></td><td>biên dịch với mọi jar
      trong <code>lib</code>; <code>2&gt;&amp;1</code> gộp chữ lỗi vào đầu ra; <code>head
      -1</code> chỉ giữ dòng đầu</td></tr></table>
    clear: true
    say: Hai lệnh sửa và biên dịch cần đọc trước. Lệnh thay chữ sửa ngay trong tệp,
      biên dịch với mọi thư viện, gộp chữ lỗi vào đầu ra và giữ dòng đầu.
  - show: '<p><b>Bước 6. Hai tên gói thư viện.</b> Tomcat 9 dùng <code>javax.servlet</code>;
      từ Tomcat 10 là <code>jakarta.servlet</code>. Hướng dẫn nâng cấp của Tomcat:
      phải <b>biên dịch lại</b> ứng dụng với API mới. Nên dự án cũ thường kẹt ở tên
      gói cũ.</p><p><b>Cu.java: Servlet theo tên gói cũ, biên dịch lỗi, sửa tên gói
      rồi biên dịch lại</b></p><div class="code"><div>cat &gt; Cu.java &lt;&lt;''EOF''</div><div>import
      javax.servlet.http.HttpServlet;</div><div>public class Cu extends HttpServlet
      { }</div><div>EOF</div><div>javac -cp "lib/*" Cu.java 2&gt;&amp;1 | head -1</div><div>sed
      -i ''s/javax\.servlet/jakarta.servlet/'' Cu.java</div><div>javac -cp "lib/*"
      -d out Cu.java &amp;&amp; echo "bien dich duoc"</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước sáu là hai tên gói thư viện. Tomcat chín dùng tên cũ, từ bản mười là
      tên mới, nên phải biên dịch lại ứng dụng. Biên dịch đầu báo lỗi, đổi tên gói
      thì được.
- id: example
  kind: example
  title: Ví dụ chạy thật, từng phép tính
  checks:
  - alg.bnx_l33_throughput(200, 0.5) == 400
  - alg.bnx_l33_waves(200, 4) == 50
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>public
      static void main(String[] a) throws Exception</code></td><td>hàm máy chạy đầu
      tiên; <code>String[] a</code>: mảng các chuỗi gõ kèm lúc chạy (<code>a[0]</code>
      là chuỗi đầu); <code>throws Exception</code>: hàm có thể ném lỗi mà không bắt</td></tr><tr><td><code>Path
      goc = Files.createTempDirectory("tc");</code></td><td>tạo một thư mục tạm mới
      tên bắt đầu bằng <code>tc</code>, trả về đường dẫn của nó; Tomcat dùng làm chỗ
      làm việc</td></tr><tr><td><code>Path.of(a[0]).toAbsolutePath().toString()</code></td><td><code>a[0]</code>:
      đối số đầu gõ kèm lúc chạy; đổi thành đường dẫn tuyệt đối (đầy đủ từ gốc ổ đĩa)
      rồi thành chuỗi</td></tr><tr><td><code>a[1].isEmpty() ? "" : "/" + a[1]</code></td><td><code>điều_kiện
      ? x : y</code>: bằng <code>x</code> nếu đúng, bằng <code>y</code> nếu sai; ở
      đây đối số thứ hai rỗng thì địa chỉ gốc, không thì thêm <code>/</code> trước
      tên</td></tr></table>'
    clear: true
    say: Chương trình khởi động có bốn chỗ cần đọc. Hàm chính chạy đầu tiên, nhận
      mảng chuỗi gõ kèm. Tạo một thư mục tạm mới để Tomcat làm việc. Đối số đầu đổi
      thành đường dẫn tuyệt đối rồi thành chuỗi. Dấu hỏi chấm chọn giá trị đầu nếu
      đúng, ngược lại giá trị sau.
  - show: <table class='t'><tr><th>viết trong mã</th><th>nghĩa</th></tr><tr><td><code>Tomcat
      t = new Tomcat();</code></td><td>tạo một máy chủ Tomcat ngay trong chương trình
      Java (đó là Tomcat nhúng)</td></tr><tr><td><code>t.setPort(0);</code></td><td>cổng
      0 nghĩa là để hệ điều hành tự chọn một cổng đang trống</td></tr><tr><td><code>t.addWebapp("/app",
      thư_mục)</code></td><td>nạp ứng dụng ở thư mục (hoặc gói <code>.war</code>)
      vào địa chỉ bắt đầu bằng <code>/app</code></td></tr><tr><td><code>t.start();</code>
      rồi <code>getLocalPort()</code></td><td>bật máy chủ, rồi hỏi cổng thật nó đang
      nghe</td></tr></table>
    clear: true
    say: Tạo Tomcat nhúng là tạo một máy chủ ngay trong chương trình Java. Cổng không
      để hệ điều hành tự chọn cổng trống. Rồi ta nạp ứng dụng, bật máy chủ và hỏi
      cổng thật.
  - show: '<p><code>May.java</code> khởi động Tomcat nhúng trên cổng ngẫu nhiên và
      nạp ứng dụng (thư mục hoặc gói <code>.war</code>). Phần <code>import</code>
      và các hàm phụ <code>lay</code>, <code>dem</code>, <code>chep</code> nằm ở nguồn
      bài.</p><p><b>May.java (1/2): khởi động Tomcat nhúng rồi nạp ứng dụng</b></p><div
      class="code"><div>  public static void main(String[] a) throws Exception {</div><div>    Path
      goc = Files.createTempDirectory("tc");</div><div>    Tomcat t = new Tomcat();</div><div>    t.setBaseDir(goc.toString());</div><div>    t.setPort(0);</div><div>    t.getConnector();</div><div>    String
      ngu = a[1].isEmpty() ? "" : "/" + a[1];</div><div>    t.addWebapp(ngu, Path.of(a[0]).toAbsolutePath().toString());</div><div>    t.start();</div><div>    int
      cong = t.getConnector().getLocalPort();</div></div>'
    clear: true
    say: 'Ta chạy thật bằng JDK hai mươi mốt và Tomcat nhúng: khởi động trên cổng
      ngẫu nhiên, nạp ứng dụng, rồi lấy số cổng.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>for
      (int i = 2; i &lt; a.length; i++)</code></td><td>vòng đếm bắt đầu từ <code>i
      = 2</code> vì hai đối số đầu đã dùng; <code>a.length</code>: số chuỗi gõ kèm;
      mỗi vòng gọi địa chỉ <code>a[i]</code></td></tr></table>'
    clear: true
    say: Vòng gọi địa chỉ có một chỗ mới. Vòng đếm bắt đầu từ hai vì hai đối số đầu
      đã dùng.
  - show: '<p><b>May.java (2/2): gửi yêu cầu, đếm tệp Jasper sinh ra, rồi tắt</b></p><div
      class="code"><div>    long truoc = dem(goc.resolve("work"));</div><div>    for
      (int i = 2; i &lt; a.length; i++)</div><div>      System.out.println(a[i] +
      " -&gt; " + lay(cong, a[i]));</div><div>    long sau = dem(goc.resolve("work"));</div><div>    if
      (sau &gt; 0) {</div><div>      System.out.println("tep Jasper sinh ra: truoc
      " + truoc + ", sau " + sau);</div><div>      chep(goc.resolve("work"), Path.of("jsp-work"));</div><div>    }</div><div>    t.stop();</div><div>    t.destroy();</div></div>'
    clear: true
    say: Sau đó nó gửi từng yêu cầu và in kết quả, đếm tệp mà bộ biên dịch trang sinh
      ra, rồi tắt Tomcat.
  - show: '<table class=''t''><tr><th>viết trong lệnh</th><th>nghĩa</th></tr><tr><td><code>javac
      -cp "lib/*" -d war/WEB-INF/classes Chao.java</code></td><td>biên dịch <code>Chao.java</code>
      với mọi jar trong <code>lib</code>; <code>-d</code>: đặt tệp lớp đã biên dịch
      vào thư mục sau nó</td></tr><tr><td><code>jar --create --file app.war -C war
      .</code>, <code>jar tf app.war | sort</code></td><td>nén thư mục <code>war</code>
      thành <code>app.war</code> (<code>-C war .</code>: vào thư mục <code>war</code>
      rồi lấy mọi thứ); <code>tf</code> liệt kê tên tệp trong gói; <code>sort</code>
      xếp theo chữ cái</td></tr><tr><td><code>java -cp "lib/*" May app.war app app/chao
      … 2&gt;/dev/null</code></td><td>chạy lớp <code>May</code>; đối số theo thứ tự:
      gói, tên ứng dụng <code>app</code>, rồi từng địa chỉ cần gọi; <code>2&gt;/dev/null</code>
      vứt chữ báo lỗi và nhật ký</td></tr></table>'
    clear: true
    say: Ba lệnh mới cần đọc, lệnh biên dịch đặt lớp vào thư mục khai báo. Lệnh nén
      tạo và liệt kê gói, lệnh chạy nhận gói, tên ứng dụng, rồi các địa chỉ cần gọi,
      và vứt chữ nhật ký.
  - show: '<p><b>Chạy thật: biên dịch, nén .war, nạp vào Tomcat nhúng (JDK 21, Tomcat
      10.1.61)</b></p><div class="code"><div>javac -cp "lib/*" -d war/WEB-INF/classes
      Chao.java</div><div>jar --create --file app.war -C war .</div><div>jar tf app.war
      | sort</div><div>java -cp "lib/*" May app.war app app/chao app/chao app/chao
      2&gt;/dev/null</div></div>'
    clear: true
    say: Ta biên dịch chương trình phục vụ vào thư mục khai báo, nén thành gói, liệt
      kê nội dung gói, rồi cho Tomcat nạp gói và gửi ba yêu cầu.
  - show: '<p><b>Kết quả chạy thật: nội dung gói app.war</b></p><div class="code"><div>META-INF/</div><div>META-INF/MANIFEST.MF</div><div>WEB-INF/</div><div>WEB-INF/classes/</div><div>WEB-INF/classes/Chao.class</div><div>WEB-INF/web.xml</div></div>$$①
      \; \text{.war là zip: } \text{WEB-INF/web.xml} + \text{WEB-INF/classes/Chao.class}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất là nội dung gói. Đúng là tệp nén, trong đó có tệp khai
      báo và lớp đã biên dịch của chương trình.
  - show: '<p><b>Kết quả chạy thật: ba yêu cầu, một thể hiện</b></p><div class="code"><div>init:
      tao 1 lan</div><div>app/chao -&gt; yeu cau so 1</div><div>app/chao -&gt; yeu
      cau so 2</div><div>app/chao -&gt; yeu cau so 3</div><div>destroy: thu hoi 1
      lan</div></div>$$② \; init \times 1, \; \text{bộ đếm } 1, 2, 3, \; destroy \times
      1$$'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Phép tính thứ hai là vòng đời, khởi tạo chỉ chạy một lần, và bộ đếm trong
      trường tăng một, hai, ba, nghĩa là cả ba yêu cầu dùng chung một thể hiện. Thu
      hồi chạy một lần khi tắt.
  - show: '<p><b>Kết quả chạy thật: một trang JSP, hai yêu cầu</b></p><div class="code"><div>chao.jsp?ten=An
      -&gt; Xin chao An, 2 + 3 = 5</div><div>chao.jsp?ten=Binh -&gt; Xin chao Binh,
      2 + 3 = 5</div><div>tep Jasper sinh ra: truoc 0, sau 2</div><div>chao_jsp.class</div><div>chao_jsp.java</div></div>$$③
      \; 0 \to 2 \text{ tệp ở yêu cầu đầu; yêu cầu thứ hai không thêm tệp}$$'
    focus:
    - - 1
      - 2
    clear: true
    say: Phép tính thứ ba là trang động, trước yêu cầu đầu chưa có tệp nào, sau hai
      yêu cầu có hai tệp, mã Java và lớp đã biên dịch, nên yêu cầu thứ hai không biên
      dịch lại.
  - show: '<p><b>Trích mã Java do Tomcat sinh ra từ trang (lọc dòng out.write, out.print)</b></p><div
      class="code"><div>122:      out.write("Xin chao ");</div><div>123:      out.print(
      request.getParameter("ten") );</div><div>124:      out.write(", 2 + 3 = ");</div><div>125:      out.print(
      2 + 3 );</div></div>$$④ \; \text{chữ cố định} \to out.write; \quad \text{biểu
      thức} \to out.print$$'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép tính thứ tư là mã sinh ra. Chữ cố định của trang thành lệnh ghi chữ,
      và mỗi biểu thức thành một lệnh in kết quả. Trang động chỉ là một chương trình
      Java được viết hộ.
  - show: '<p><b>Kết quả chạy thật: tên gói cũ và sau khi đổi</b></p><div class="code"><div>Cu.java:1:
      error: package javax.servlet.http does not exist</div><div>bien dich duoc</div></div>$$⑤
      \; javax.servlet \to jakarta.servlet \Rightarrow \text{biên dịch được với Tomcat
      10.1}$$'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Phép tính thứ năm là tên gói, với Tomcat mười, chương trình viết theo tên
      gói cũ không biên dịch được vì gói không tồn tại. Đổi sang tên gói mới thì biên
      dịch được.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đọc mã đã biên dịch'
  checks:
  - alg.bnx_l33_waves(4, 4) == 1
  steps:
  - show: '<p><b>Chạy thật: công cụ javap đọc lớp đã biên dịch (không đọc mã nguồn
      sinh ra)</b></p><div class="code"><div>public final class org.apache.jsp.chao_jsp
      extends HttpJspBase</div></div><table class=''t''><tr><th>con số</th><th>đường
      thứ nhất</th><th>đường khác</th></tr><tr><td>trang JSP là một Servlet</td><td>mã
      Java sinh ra: chao_jsp extends HttpJspBase</td><td>javap đọc lớp đã biên dịch:
      cùng lớp cha</td></tr><tr><td>init chỉ chạy một lần</td><td>đầu ra thật: 1 dòng
      init, 3 yêu cầu</td><td>hướng dẫn chính thức: gọi init đúng một lần</td></tr></table>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Ta kiểm bằng đường khác. Công cụ đọc lớp đã biên dịch cho thấy lớp sinh ra
      từ trang kế thừa lớp cha của bộ biên dịch trang, nên trang động thật sự là một
      chương trình phục vụ. Hướng dẫn chính thức cũng nói khởi tạo chạy đúng một lần.
- id: quymo
  kind: example
  title: 'Khi tải tăng: bể 4 luồng và 4, 40, 200 yêu cầu'
  checks:
  - alg.bnx_l33_waves(4, 4) == 1 and alg.bnx_l33_waves(40, 4) == 10 and alg.bnx_l33_waves(200,
    4) == 50
  - alg.bnx_l33_waves(4, 4) * 100 == 100 and alg.bnx_l33_waves(40, 4) * 100 == 1000
    and alg.bnx_l33_waves(200, 4) * 100 == 5000
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>static
      AtomicInteger dang = new AtomicInteger(), toiDa = new AtomicInteger();</code></td><td>hai
      biến số nguyên mà nhiều luồng cùng cập nhật không bị lẫn; <code>static</code>:
      một bản chung của lớp; khai hai biến một dòng, cách nhau dấu phẩy</td><td><code>dang</code>:
      số cuộc đang chạy; <code>toiDa</code>: mức cao nhất đã thấy</td></tr><tr><td><code>((AbstractProtocol&lt;?&gt;)
      t.getConnector().getProtocolHandler()).setMaxThreads(4)</code></td><td>lấy bộ
      xử lý giao thức của Tomcat; <code>(AbstractProtocol&lt;?&gt;)</code> là <b>ép
      kiểu</b> sang kiểu có hàm <code>setMaxThreads</code>; hàm đặt bể còn 4 luồng</td><td></td></tr></table>'
    introduces:
    - bnx_atomic_coll
    clear: true
    say: Phần đầu chương trình đo tải có hai chỗ mới. Hai biến số nguyên mà nhiều
      luồng cùng cập nhật không bị lẫn. Ép sang kiểu có hàm đặt cỡ bể, rồi đặt bốn
      luồng.
  - show: '<p><code>Tai.java</code>: Tomcat nhúng có bể chỉ <b>4</b> luồng (<code>setMaxThreads(4)</code>)
      và một Servlet chậm cố ý (ngủ 100 ms). Phần <code>import</code> nằm ở nguồn
      bài.</p><p><b>Tai.java (1/4): hai bộ đếm và bể 4 luồng</b></p><div class="code"><div>public
      class Tai {</div><div>  static AtomicInteger dang = new AtomicInteger(), toiDa
      = new AtomicInteger();</div><div> </div><div>  public static void main(String[]
      a) throws Exception {</div><div>    Path goc = Files.createTempDirectory("tc");</div><div>    Tomcat
      t = new Tomcat();</div><div>    t.setBaseDir(goc.toString());</div><div>    t.setPort(0);</div><div>    ((AbstractProtocol&lt;?&gt;)
      t.getConnector().getProtocolHandler()).setMaxThreads(4);</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta đo thật bằng một Tomcat nhúng mà bể chỉ có bốn luồng. Chương trình có
      hai bộ đếm, số cuộc đang chạy và mức cao nhất.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>new
      HttpServlet() { … }</code></td><td><b>lớp ẩn danh</b>: viết luôn thân một lớp
      con của <code>HttpServlet</code> ngay tại chỗ tạo đối tượng, khỏi đặt tên</td></tr><tr><td><code>toiDa.accumulateAndGet(dang.incrementAndGet(),
      Math::max)</code></td><td><code>dang.incrementAndGet()</code>: tăng <code>dang</code>
      thêm 1 và trả giá trị mới; <code>accumulateAndGet(x, Math::max)</code>: đặt
      <code>toiDa</code> bằng số lớn hơn giữa nó và <code>x</code></td></tr><tr><td><code>try
      { Thread.sleep(100); } catch (InterruptedException e) { }</code></td><td>ngủ
      100 mili giây để giả việc chậm; <code>catch</code> bắt lỗi bị đánh thức giữa
      chừng và bỏ qua vì khối trống</td></tr><tr><td><code>Tomcat.addServlet(ctx,
      "cham", …)</code>, <code>ctx.addServletMappingDecoded("/cham", "cham")</code></td><td>đăng
      ký Servlet với tên <code>cham</code> vào ngữ cảnh <code>ctx</code>, rồi nối
      đường dẫn <code>/cham</code> với tên đó</td></tr></table>'
    clear: true
    say: Phần phục vụ chậm có bốn chỗ cần đọc. Lớp ẩn danh viết luôn thân lớp con
      ngay tại chỗ tạo. Tăng số cuộc đang chạy, rồi cập nhật mức cao nhất. Ngủ một
      trăm mili giây để giả việc chậm; khối bắt lỗi trống bỏ qua lỗi. Đăng ký theo
      tên rồi nối đường dẫn.
  - show: '<p><b>Tai.java (2/4): Servlet chậm 100 ms, đếm số cuộc chạy đồng thời</b></p><div
      class="code"><div>    Context ctx = t.addContext("", goc.toString());</div><div>    Tomcat.addServlet(ctx,
      "cham", new HttpServlet() {</div><div>      @Override protected void doGet(HttpServletRequest
      q, HttpServletResponse r)</div><div>          throws IOException {</div><div>        toiDa.accumulateAndGet(dang.incrementAndGet(),
      Math::max);</div><div>        try { Thread.sleep(100); } catch (InterruptedException
      e) { }</div><div>        dang.decrementAndGet();</div><div>        r.getWriter().print("ok");</div><div>      }</div><div>    });</div><div>    ctx.addServletMappingDecoded("/cham",
      "cham");</div></div>'
    clear: true
    say: Chương trình phục vụ chậm cố ý ngủ một trăm mili giây, và ghi lại số cuộc
      chạy đồng thời cùng mức cao nhất.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>for
      (int n : new int[] {4, 40, 200}) { … }</code></td><td>duyệt từng cỡ tải trong
      mảng vừa tạo: <code>n</code> lần lượt là 4, 40, 200</td></tr><tr><td><code>List&lt;CompletableFuture&lt;?&gt;&gt;
      ds = new ArrayList&lt;&gt;();</code></td><td>danh sách các <b>hẹn kết quả</b>
      (việc đang chạy nền, kết quả có sau); <code>&lt;?&gt;</code>: kiểu kết quả nào
      cũng được</td></tr><tr><td><code>c.sendAsync(…)</code>, <code>for (var d : ds)
      d.join();</code></td><td><code>sendAsync</code>: gửi yêu cầu mà không chờ, trả
      hẹn kết quả; <code>join()</code>: chờ hẹn đó xong; <code>var</code>: để máy
      tự suy kiểu của <code>d</code></td></tr><tr><td><code>long bd = System.nanoTime();</code></td><td>mốc
      giờ của đồng hồ máy theo nano giây, để trừ ra thời gian đã trôi</td></tr></table>'
    clear: true
    say: Phần gửi yêu cầu có bốn chỗ mới. Duyệt từng cỡ tải trong mảng vừa tạo. Danh
      sách các hẹn kết quả, gửi không chờ trả về một hẹn, rồi chờ từng hẹn xong. Mốc
      giờ của đồng hồ máy để tính thời gian đã trôi.
  - show: '<p><b>Tai.java (3/4): khởi động Tomcat, gửi n yêu cầu cùng lúc, chờ xong</b></p><div
      class="code"><div>    t.start();</div><div>    URI u = URI.create("http://localhost:"
      + t.getConnector().getLocalPort() + "/cham");</div><div>    HttpClient c = HttpClient.newHttpClient();</div><div>    for
      (int n : new int[] {4, 40, 200}) {</div><div>      toiDa.set(0);</div><div>      long
      bd = System.nanoTime();</div><div>      List&lt;CompletableFuture&lt;?&gt;&gt;
      ds = new ArrayList&lt;&gt;();</div><div>      for (int i = 0; i &lt; n; i++)</div><div>        ds.add(c.sendAsync(HttpRequest.newBuilder(u).build(),</div><div>                           HttpResponse.BodyHandlers.ofString()));</div><div>      for
      (var d : ds) d.join();</div></div>'
    clear: true
    say: Rồi ta khởi động Tomcat, và với mỗi cỡ tải n thì gửi n yêu cầu cùng lúc mà
      không chờ nhau, rồi chờ mọi hẹn xong.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>long
      ms = (System.nanoTime() - bd) / 1_000_000, can = (n + 3) / 4 * 100L;</code></td><td>khai
      hai biến <code>long</code> một dòng; <code>1_000_000</code>: gạch dưới chỉ để
      dễ đọc số; <code>(n + 3) / 4</code>: chia 4 <b>làm tròn lên</b> (số lượt); <code>100L</code>:
      số 100 kiểu <code>long</code></td><td>ví dụ <code>n = 40</code>: tổng <code>43</code>
      chia 4 bỏ phần lẻ ra <code>10</code> lượt, <code>10 × 100 = 1000</code> ms</td></tr></table>'
    clear: true
    say: Dòng so sánh có một biểu thức cần đọc. Chia bốn làm tròn lên cho số lượt,
      nhân một trăm mili giây.
  - show: '<p><b>Tai.java (4/4): so với mức tối thiểu rồi tắt</b></p><div class="code"><div>      long
      ms = (System.nanoTime() - bd) / 1_000_000, can = (n + 3) / 4 * 100L;</div><div>      System.out.println(n
      + " yeu cau, 4 luong: dong thoi toi da " + toiDa</div><div>          + ", thoi
      gian &gt;= " + can + " ms: " + (ms &gt;= can));</div><div>    }</div><div>    t.stop();</div><div>    t.destroy();</div><div>  }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Cuối cùng ta so thời gian thật với mức tối thiểu. Màn hình chỉ in đúng hay
      sai, vì số mili giây thật đổi theo từng máy.
  - show: '<p><b>Chạy thật: Servlet chậm 100 ms, bể 4 luồng</b></p><div class="code"><div>4
      yeu cau, 4 luong: dong thoi toi da 4, thoi gian &gt;= 100 ms: true</div><div>40
      yeu cau, 4 luong: dong thoi toi da 4, thoi gian &gt;= 1000 ms: true</div><div>200
      yeu cau, 4 luong: dong thoi toi da 4, thoi gian &gt;= 5000 ms: true</div></div>$$4
      \to 40 \to 200 \;(\times 50): \; \text{đồng thời tối đa } 4; \quad \text{thời
      gian} \ge \frac{n}{4} \times 100 \text{ ms (làm tròn lên)}$$'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là số đo thật khi tải tăng năm mươi lần. Bể bốn luồng thì dù bốn, bốn
      mươi hay hai trăm yêu cầu đến cùng lúc, số cuộc chạy đồng thời vẫn tối đa bốn.
      Vì vậy hai trăm chia bốn lượt, mỗi lượt một trăm mili giây, là ít nhất năm nghìn.
  - show: '<table class=''t''><tr><th>cách</th><th>được</th><th>mất</th><th>chọn khi</th></tr><tr><td>giữ
      bể mặc định (200), xử lý nhanh</td><td>đơn giản; đủ cho phần lớn dịch vụ nhẹ</td><td>một
      việc chậm (gọi dịch vụ ngoài không hết giờ) chiếm dần cả 200 luồng</td><td>việc
      ngắn, có hạn chót cho mọi cuộc gọi ngoài</td></tr><tr><td>tăng bể (ví dụ 1 000)</td><td>chịu
      được nhiều yêu cầu chậm hơn</td><td>mỗi luồng tốn bộ nhớ; chuyển ngữ cảnh nhiều;
      dồn tải sang cơ sở dữ liệu</td><td>đã đo: luồng rảnh nhưng yêu cầu vẫn chờ</td></tr><tr><td>thu
      nhỏ việc chậm (hết giờ, bất đồng bộ)</td><td>bể không cạn</td><td>phải sửa mã,
      kiểm thử lại</td><td>dịch vụ lõi, tải tăng đều</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Bảng này là các lựa chọn của người làm nghề. Giữ bể mặc định thì đơn giản,
      nhưng một việc chậm sẽ chiếm dần cả hai trăm luồng. Tăng bể chịu được nhiều
      việc chậm hơn, đổi lại tốn bộ nhớ. Thu nhỏ việc chậm thì bể không cạn, đổi lại
      phải sửa mã.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_l33_waves(200, 4) * 100 == 5000
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Chép mẫu cũ trên mạng viết
      theo <code>javax.servlet</code> vào Tomcat 10 trở lên: <b class="red">package
      javax.servlet.http does not exist</b> (đã đo). Xem Tomcat bản nào và dùng đúng
      tên gói.</div>

      $$\text{Tomcat } 9 \to javax; \quad \text{Tomcat } 10{+} \to jakarta$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Lỗi thứ nhất là chép mẫu cũ viết theo tên gói cũ vào Tomcat mười trở lên,
      và bị báo gói không tồn tại như đã đo. Hãy xem Tomcat bản nào và dùng đúng tên
      gói.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Lưu
      <b class="red">dữ liệu của từng khách vào trường của Servlet</b>. Chỉ có <b>một</b>
      thể hiện cho mọi yêu cầu (đã đo: bộ đếm 1, 2, 3): khách này thấy dữ liệu khách
      kia, và nhiều luồng ghi đồng thời gây lỗi khó tìm. Dữ liệu từng khách để trong
      biến cục bộ hoặc <b>phiên</b> (bộ nhớ riêng của từng khách trên máy chủ, nhận
      ra qua một mã gửi kèm mỗi yêu cầu).</div>

      $$\text{1 thể hiện} \times n \text{ khách} \Rightarrow \text{trường là dữ liệu
      chung}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ hai, lộ ra lúc mới dựng: lưu dữ liệu từng khách vào trường của chương
      trình phục vụ. Chỉ có một thể hiện cho mọi yêu cầu, nên khách này thấy dữ liệu
      khách kia. Hãy để dữ liệu từng khách trong biến cục bộ hoặc phiên.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc tải tăng).</b> Việc
      chậm không có hạn chót chiếm dần bể luồng. Đo thật: bể 4 luồng, 200 yêu cầu
      cùng lúc: tối đa 4 chạy, tổng thời gian ≥ 5 000 ms. Bể mặc định 200 cũng cạn
      y vậy, chỉ muộn hơn.</div>

      $$\frac{200}{4} \times 100 = \hl{5\,000} \text{ ms}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ ba, lộ ra khi tải tăng: việc chậm không có hạn chót chiếm dần bể
      luồng. Đo thật, bể bốn luồng với hai trăm yêu cầu chỉ chạy bốn cái, tổng thời
      gian ít nhất năm nghìn mili giây.'
  - show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm, lúc vận hành lâu dài).</b>
      <b class="red">Không ai dám nâng cấp máy chủ</b> vì đổi javax → jakarta phải
      biên dịch lại mọi thứ; càng để lâu càng khó nâng cấp, nên hãy kiểm trang phiên
      bản được hỗ trợ của Tomcat xem bản mình dùng còn được vá lỗi không. Hướng dẫn
      của Tomcat có công cụ chuyển đổi ứng dụng khi triển khai; cần kế hoạch, kiểm
      thử, và đo trước-sau.</div>

      <table class=''t''><tr><th>trì hoãn mãi</th><th>chuyển có kế hoạch</th></tr><tr><td>nợ
      nâng cấp tích tụ</td><td>công cụ chuyển đổi hoặc sửa import + kiểm thử</td></tr></table>

      '
    focus:
    - - 1
      - 2
    clear: true
    say: 'Lỗi thứ tư, lộ ra khi vận hành lâu dài: không ai dám nâng cấp máy chủ vì
      đổi tên gói phải biên dịch lại, nên nợ nâng cấp tích tụ, hãy có kế hoạch và
      kiểm thử.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l33_throughput(8, 0.25) == 32 and alg.bnx_l33_waves(40, 8) * 0.25 == 1.25
  - 120 * 1 == 120
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Bể
      8 luồng, mỗi yêu cầu mất 0,25 giây. Thông lượng tối đa mỗi giây là bao nhiêu?
      40 yêu cầu đến cùng lúc thì xử lý xong sau ít nhất bao lâu?</td></tr><tr><td>2</td><td>Một
      ứng dụng có 120 trang JSP, mỗi trang được gọi lần đầu lúc nào? Có bao nhiêu
      lần dịch và biên dịch ở lần chạy đầu của cả hệ thống nếu mỗi trang được gọi
      một lần?</td></tr><tr><td>3</td><td>Quyết định (số minh hoạ): ứng dụng cũ dùng
      Tomcat 9 (<code>javax</code>), còn 30 Servlet, đội 3 người. Nâng lên Tomcat
      10 bằng sửa import, hay dùng công cụ chuyển đổi khi triển khai, hay viết lại
      bằng Spring Boot? Vì sao?</td></tr></table>'
    pause: 30
    say: 'Bây giờ tới phần bạn tự làm bài. Câu một: bể tám luồng, mỗi yêu cầu mất
      một phần tư giây, thông lượng tối đa mỗi giây là bao nhiêu, và bốn mươi yêu
      cầu cùng lúc xong sau ít nhất bao lâu? Câu hai: một trăm hai mươi trang động,
      mỗi trang gọi một lần, có bao nhiêu lần dịch ở lần chạy đầu? Câu ba: Tomcat
      chín, ba mươi chương trình phục vụ, đội ba người, nên sửa tên gói, dùng công
      cụ chuyển đổi, hay viết lại bằng Spring, bộ khung dựng dịch vụ mới? Hãy dừng
      lại làm ra giấy.'
  - show: '<p>Câu 1: thông lượng = 8 : 0,25; số lượt = 40 : 8.</p>

      $$\frac{8}{0{,}25} = \hlg{32} \text{ yêu cầu/giây}; \quad \frac{40}{8} \times
      0{,}25 = 5 \times 0{,}25 = \hl{1{,}25} \text{ giây}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu một, tám luồng chia một phần tư giây là ba mươi hai yêu cầu mỗi
      giây. Bốn mươi yêu cầu chia tám luồng là năm lượt, mỗi lượt một phần tư giây,
      nên ít nhất một phẩy hai mươi lăm giây.
    clear: true
  - show: '<p>Câu 2: theo mặc định mỗi trang dịch và biên dịch <b>một lần</b>, ở yêu
      cầu đầu của <b>chính trang đó</b> (trang bị sửa thì dịch lại; biên dịch trước
      khi triển khai thì 0 lần lúc chạy).</p>

      $$120 \text{ trang} \Rightarrow \hlg{120} \text{ lần dịch và biên dịch}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu hai, theo mặc định, mỗi trang dịch một lần ở yêu cầu đầu của chính
      nó, nên một trăm hai mươi trang là một trăm hai mươi lần. Trang bị sửa thì dịch
      lại, trang biên dịch trước thì không.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>sửa
      import (30 Servlet)</td><td>mã sạch, nhanh nếu ít dùng thư viện cũ</td><td>mọi
      thư viện kèm theo cũng phải có bản jakarta; phải kiểm thử toàn bộ</td></tr><tr><td>công
      cụ chuyển đổi khi triển khai</td><td>ít sửa mã, thử nhanh</td><td>thêm một bước
      triển khai; vẫn nợ kỹ thuật</td></tr><tr><td>viết lại bằng Spring Boot</td><td>bỏ
      nợ cũ</td><td>tốn nhiều tháng; đội 3 người; rủi ro hành vi khác</td></tr></table>
    say: Đáp án câu ba, sửa tên gói cho mã sạch, nhưng mọi thư viện kèm theo cũng
      phải đổi và phải kiểm thử toàn bộ. Công cụ chuyển đổi ít sửa mã, đổi lại vẫn
      nợ kỹ thuật. Viết lại tốn nhiều tháng, hợp lý là dùng công cụ chuyển đổi trước,
      rồi sửa dần.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: bộ chứa tí hon với vòng đời Servlet'
  steps:
  - show: '<p><b>Đề</b>: viết bộ chứa tí hon <code>MauBoChua</code> (Java thuần):
      tạo thể hiện ở yêu cầu đầu của mỗi đường dẫn, gọi <code>init</code> đúng một
      lần, <code>service</code> mỗi yêu cầu, <code>destroy</code> một lần khi dừng.</p>

      <p>Ba kiểu cho sẵn và định dạng đầu ra chính xác nằm trong <code>de.md</code>;
      số liệu <b>khác</b> ví dụ trong bài.</p>

      '
    focus:
    - - 1
    - - 2
    pause: 240
    say: Bây giờ tới phần bạn tự làm, viết một bộ chứa tí hon bằng Java thuần. Ở yêu
      cầu đầu của mỗi đường dẫn thì tạo và khởi tạo một lần, mỗi yêu cầu gọi hàm phục
      vụ, khi dừng thì thu hồi, hãy dừng video và tự viết.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>init ChaoVi</div><div>/vi?ten=Lan
      -&gt; Xin chao Lan (so 1)</div><div>/vi?ten=Minh -&gt; Xin chao Minh (so 2)</div><div>init
      ChaoAnh</div><div>/en?ten=Ann -&gt; Hello Ann (so 1)</div><div>/vi?ten=Hoa -&gt;
      Xin chao Hoa (so 3)</div><div>destroy ChaoVi</div><div>destroy ChaoAnh</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh BNX L33 MauBoChua.java</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> dùng hai bảng <code>LinkedHashMap</code>
      (giữ thứ tự thêm vào): <code>khaiBao</code> (cách tạo) và <code>dangChay</code>
      (thể hiện đã tạo). <code>dangChay.get(duong) == null</code> nghĩa là lần đầu:
      tạo, <code>init()</code>, cất vào bảng.

      Lời giải đầy đủ ở <code>labs/BNX/L33/loi_giai.java</code> — chỉ mở sau khi bạn
      đã thử.</div>

      '
    say: Nếu kẹt, dùng hai bảng giữ thứ tự thêm vào, một cho cách tạo và một cho thể
      hiện đã tạo. Chưa có thể hiện nghĩa là lần đầu, thì tạo, khởi tạo, rồi cất vào
      bảng.
    clear: true
  lab: labs/BNX/L33
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  checks:
  - alg.bnx_l33_waves(200, 4) == 50
  steps:
  - show: '<div class=''chain''><span class=''n''>Servlet = lớp Java, bộ chứa gọi</span><span
      class=''a''>→</span><span class=''n''>vòng đời: init 1, service n, destroy 1</span><span
      class=''a''>→</span><span class=''n''>JSP = Servlet được viết hộ</span><span
      class=''a''>→</span><span class=''n''>bể luồng = sức chứa</span><span class=''a''>→</span><span
      class=''n''>javax → jakarta: biên dịch lại</span></div>'
    say: Chương trình web là một lớp Java do bộ chứa gọi, với khởi tạo một lần, phục
      vụ nhiều lần, thu hồi một lần, bể luồng quyết định sức chứa.
  - show: '<div class=''box key''><b>Tư duy:</b> dự án cũ không bí ẩn: mọi thứ là
      lớp Java, tệp khai báo và một gói zip. Đọc theo thứ tự <b>khai báo → lớp → vòng
      đời → bể luồng</b>; thấy gì lạ thì <b>đo</b> (đếm khởi tạo, đếm luồng) thay
      vì đoán.

      Và Tomcat, JBoss chỉ là tên bộ chứa: vòng đời và bể luồng mới là thứ mang theo.</div>

      '
