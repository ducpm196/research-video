- {sentence: "Chào bạn, ngân hàng còn nhiều ứng dụng web viết bằng chương trình phục vụ trên máy chủ web và trang động, chạy trên Tomcat.", reason: "ASR chép “Chào bạn, ngân hàng còn nhiều ứng dụng web viết bằng chương trình phục vụ trên máy chủ web và trang động, chạy trên tôm cắt.” (0.941): “tomcat” đọc theo luật lexicon (lexicon_vi.BNX.yaml: “Tom-cát”), ASR viết “tôm cắt” — NOT_VERIFIED bằng tai người"}
- {sentence: "Máy chủ ứng dụng đầy đủ có thêm thành phần doanh nghiệp, tức các lớp Java do máy chủ quản lý sẵn, bài này chỉ chạy thật Tomcat.", reason: "ASR chép “Máy chủ ứng dụng đầy đủ có thêm thành phần doanh nghiệp, tức các lớp Java do máy chủ quản lý sẵn, bài này chỉ chạy thật tông cát.” (0.947): “tomcat” đọc theo luật lexicon (lexicon_vi.BNX.yaml: “Tom-cát”), ASR viết “tông cát” — NOT_VERIFIED bằng tai người"}
- {sentence: "Rồi ta khởi động Tomcat, và với mỗi cỡ tải n thì gửi n yêu cầu cùng lúc mà không chờ nhau, rồi chờ mọi hẹn xong.", reason: "ASR chép “Rồi ta khởi động TomCat và với mỗi cỡ tải n thì gửi n yêu cầu cùng lúc mà không chờ nhau, rồi chờ mọi hẹn xong.” (1.0): từ rủi ro tom cả hai mô hình viết khác (cách viết, không phải âm) — NOT_VERIFIED bằng tai người"}
