- {sentence: "Ta chạy thật bằng JDK hai mươi mốt và Tomcat nhúng: khởi động trên cổng ngẫu nhiên, nạp ứng dụng, rồi lấy số cổng.", reason: "ASR chép “Ta chạy thật bằng dì GK21 và tông cát nhúng, khởi động trên cổng ngẫu nhiên, nạp ứng dụng, rồi lấy số cổng.” (0.88): “jdk” đọc theo luật lexicon (lexicon_vi.BNX.yaml: “J D K”), ASR viết “dì gk”; “tomcat” đọc theo luật lexicon (lexicon_vi.BNX.yaml: “Tom-cát”), ASR viết “tông cát” — NOT_VERIFIED bằng tai người"}
- {sentence: "Câu ba: Tomcat chín, ba mươi chương trình phục vụ, đội ba người, nên sửa tên gói, dùng công cụ chuyển đổi, hay viết lại bằng Spring, bộ khung dựng dịch vụ mới?", reason: "ASR chép “Câu 3, Tòm cá chính, 30 chương trình phục vụ, đổi ba người, nên sửa tên gói, dùng công cụ chuyển đổi, hay viết lại bằng spring, bộ khung dựng dịch vụ mới.” (0.896): “tomcat” đọc theo luật lexicon (lexicon_vi.BNX.yaml: “Tom-cát”), ASR viết “tòm cá chính”; lệch âm/thanh thuần Việt: đội/đổi — NOT_VERIFIED bằng tai người"}
