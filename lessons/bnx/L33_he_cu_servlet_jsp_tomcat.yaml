scenes:
- id: hook
  kind: hook
  title: 'Dự án cũ vẫn đang chạy: đọc và sửa nó thế nào?'
  checks:
  - alg.bnx_l33_waves(200, 4) == 50
  steps:
  - show: '<p>Ngân hàng còn nhiều ứng dụng web viết bằng <b>Servlet</b> (chương trình
      phục vụ trên máy chủ web) và <b>JSP</b> (trang động), đóng gói <code>.war</code>,
      chạy trên <b>Tomcat</b> hoặc <b>JBoss</b>.</p>

      <div class="box key">Đo thật: 3 yêu cầu chỉ khởi tạo chương trình <b>1 lần</b>;
      một trang JSP được <b>dịch thành chương trình Java</b> ở yêu cầu đầu (0 → 2
      tệp); bể 4 luồng, 200 yêu cầu cùng lúc: tối đa <b>4</b> chạy đồng thời. Làm
      sao đọc và sửa được loại dự án này?</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: 'Chào bạn, ngân hàng còn nhiều ứng dụng web viết bằng chương trình phục vụ
      trên máy chủ web và trang động, chạy trên Tomcat. Đo thật: ba yêu cầu chỉ khởi
      tạo một lần, một trang động được dịch thành mã Java, và bể bốn luồng chỉ chạy
      tối đa bốn cái cùng lúc. Làm sao đọc và sửa loại dự án này?'
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>chương
      trình web chạy thế nào</td><td><b>vòng đời</b>: <code>init</code> một lần, <code>service</code>
      nhiều lần, <code>destroy</code> một lần</td></tr><tr><td>trang động .jsp là
      gì</td><td><b>dịch thành Servlet</b> ở yêu cầu đầu rồi biên dịch</td></tr><tr><td>Tomcat
      và JBoss/WildFly khác gì</td><td><b>bộ chứa Servlet</b> với <b>máy chủ ứng dụng
      đầy đủ</b></td></tr><tr><td>đọc và bảo trì dự án cũ</td><td><code>web.xml</code>,
      gói <code>.war</code>, <code>javax</code> → <code>jakarta</code>, bể luồng</td></tr></table>'
    clear: true
    say: 'Hôm nay ta trả lời bốn câu: chương trình web chạy thế nào, trang động là
      gì, bộ chứa nhẹ khác máy chủ đầy đủ ở đâu, và cách đọc dự án cũ.'
- id: prereq
  kind: prereq
  title: 'Trước hết: sáu điều cần hiểu'
  checks:
  - alg.bnx_l33_waves(8, 4) == 2
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      yêu cầu và phản hồi HTTP</td><td>trình duyệt gửi một yêu cầu, máy chủ trả một
      phản hồi</td><td><code>GET /chao</code></td></tr><tr><td>② máy chủ web</td><td>chương
      trình lắng nghe cổng mạng, gọi mã của ta khi có yêu cầu; <b>Tomcat nhúng</b>
      là Tomcat dùng như thư viện, do chính chương trình Java của ta khởi động</td><td>Tomcat</td></tr><tr><td>③
      luồng</td><td>một dây việc chạy song song; nhiều yêu cầu cùng lúc cần nhiều
      luồng</td><td>4 luồng = tối đa 4 việc cùng lúc</td></tr><tr><td>④ lớp và giao
      diện</td><td>lớp con thừa hưởng việc của lớp cha; giao diện là hợp đồng các
      hàm phải có</td><td><code>extends HttpServlet</code></td></tr><tr><td>⑤ tệp
      nén zip</td><td>một tệp chứa nhiều tệp; <code>.war</code> thực chất là zip</td><td><code>jar
      tf app.war</code></td></tr><tr><td>⑥ biên dịch</td><td>đổi mã nguồn Java thành
      lớp chạy được</td><td><code>javac</code></td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    - - '1.4'
      - '1.5'
    - '1.6'
    say: Trước hết ta cần hiểu sáu điều, trình duyệt gửi yêu cầu thì máy chủ trả phản
      hồi. Máy chủ web gọi mã của ta khi có yêu cầu, còn bản nhúng do chính chương
      trình Java khởi động. Luồng là dây việc chạy song song, lớp con thừa hưởng việc
      của lớp cha. Gói triển khai là tệp nén, và biên dịch là đổi mã nguồn thành lớp
      chạy được.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l33_waves(4, 4) == 1
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>Servlet</code>,
      <code>HttpServlet</code></td><td>chương trình Java nhận yêu cầu HTTP và trả
      phản hồi; chạy trong bộ chứa</td></tr><tr><td><code>init</code>, <code>doGet</code>,
      <code>destroy</code></td><td>hàm khởi động (một lần), hàm xử lý yêu cầu GET,
      hàm thu hồi (một lần)</td></tr><tr><td><code>web.xml</code></td><td>tệp khai
      báo: Servlet nào, ứng với đường dẫn nào</td></tr><tr><td><code>&lt;%= … %&gt;</code></td><td>trong
      trang JSP: tính biểu thức rồi chèn kết quả vào trang</td></tr><tr><td><code>.war</code>,
      <code>WEB-INF</code></td><td>gói triển khai (zip); thư mục WEB-INF là phần không
      trả cho trình duyệt</td></tr><tr><td><code>javax.servlet</code> / <code>jakarta.servlet</code></td><td>tên
      gói thư viện Servlet: cũ / mới (Tomcat 10 trở lên dùng jakarta)</td></tr></table>'
    say: Bảng này giải mã các tên của bài. Đó là chương trình phục vụ web với ba hàm
      khởi động, xử lý yêu cầu và thu hồi, tệp khai báo, và dấu biểu thức trong trang
      động. Gói triển khai là tệp nén, và Tomcat bản mười trở lên dùng kiểu tên gói
      thư viện mới.
