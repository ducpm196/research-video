source: 'curriculum/bnx.yaml L33; audit/bnx/verify_bnx.py L33; audit/bnx/sources_l33.md:
  trang chủ và hướng dẫn Tomcat 10.1 (Jasper, cấu hình bộ kết nối, nâng cấp 9 → 10),
  Servlet API của Tomcat, WildFly (về WildFly), đọc 2026-11-14; Tomcat nhúng 10.1.61
  chạy thật trên Temurin JDK 21.0.13 (jar ở audit/bnx/deps/l33); JBoss/WildFly không
  chạy'
assumes:
- bnx_sed_i
objectives:
- Đọc một Servlet tối thiểu và vòng đời init một lần, service nhiều lần, destroy một
  lần trên Tomcat nhúng
- Đọc nội dung một gói war và tệp web.xml khai báo Servlet
- Mô tả cách trang JSP được dịch thành Servlet ở yêu cầu đầu và đếm tệp sinh ra
- Xác định lỗi biên dịch của tên gói javax.servlet với Tomcat 10 và sửa sang jakarta.servlet
- Tính thông lượng và số lượt chờ của bể luồng
- Đo số cuộc xử lý đồng thời tối đa của bể 4 luồng khi có 4, 40 và 200 yêu cầu cùng
  lúc
- Phân biệt bộ chứa Servlet như Tomcat với máy chủ ứng dụng đầy đủ như JBoss hoặc
  WildFly
- Viết bộ chứa tí hon có vòng đời init, service, destroy bằng Java thuần
