      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><text
      x="750" y="40" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">Bộ
      chứa tạo Servlet MỘT lần, phục vụ nhiều yêu cầu bằng các luồng của bể, thu hồi
      MỘT lần</text><rect x="40" y="130" width="260" height="100" rx="10" fill="#dbeafe"
