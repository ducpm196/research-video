scenes:
- id: hook
  kind: hook
  title: 'Chuyển tiền lỗi giữa chừng: số dư về 1000, nhật ký còn hay mất?'
  checks:
  - alg.bnx_l25_balance(1000, 100, True) == 1000
  - alg.bnx_l25_balance(1000, 100, False) == 900
  - alg.bnx_l25_log_rows('REQUIRED') == 0 and alg.bnx_l25_log_rows('REQUIRES_NEW')
    == 1
  steps:
  - show: '<p>Dịch vụ chuyển tiền trừ 100 ở tài khoản rồi ghi một dòng nhật ký, sau
      đó gặp lỗi và ném ngoại lệ (báo lỗi). Chạy thật hai cách ghi nhật ký (số dư
      ban đầu 1000):</p>

      <div class="box key">Cách 1, nhật ký ghi <b>cùng giao dịch</b>: số dư 1000,
      nhật ký <b>0</b> dòng. Cách 2, nhật ký ghi <b>giao dịch riêng</b>: số dư 1000,
      nhật ký <b>1</b> dòng.

      Và một lỗi <b>kiểm tra</b> thì số dư lại thành <b>900</b>. Vì sao ba kết quả
      khác nhau?</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: 'Chào bạn, dịch vụ chuyển tiền trừ một trăm ở tài khoản rồi ghi một dòng
      nhật ký, sau đó gặp lỗi và ném ngoại lệ, tức là báo lỗi. Số dư ban đầu là một
      nghìn: ghi nhật ký cùng giao dịch thì số dư về một nghìn và nhật ký trống. Ghi
      trong giao dịch riêng thì số dư vẫn về một nghìn nhưng nhật ký còn một dòng,
      và với một loại lỗi khác, số dư lại thành chín trăm. Vì sao ba ca cho ba kết
      quả khác nhau?'
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l25_rolls_back('IllegalStateException', ()) is True and alg.bnx_l25_rolls_back('IOException',
    ()) is False
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      giao dịch</td><td>nhóm thao tác ghi: <b>chốt</b> thì cùng có hiệu lực, <b>hoàn
      tác</b> thì không cái nào; tính cùng thành hoặc cùng bỏ ấy gọi là <b>nguyên
      tử</b></td><td>trừ tiền và ghi nhật ký cùng thành hoặc cùng bỏ</td></tr><tr><td>②
      kết nối, bể và luồng</td><td><b>kết nối</b>: đường nối tới cơ sở dữ liệu, một
      giao dịch gắn với một kết nối; <b>bể kết nối</b>: nhóm kết nối dùng chung; <b>luồng</b>
      (thread): một dây việc chạy song song, như một nhân viên làm riêng</td><td>bể
      3 kết nối, 3 luồng cùng xin kết nối</td></tr><tr><td>③ ngoại lệ</td><td>lỗi
      ném từ hàm; <b>kiểm tra</b>: phải khai hoặc bắt; <b>không kiểm tra</b>: lớp
      con của <code>RuntimeException</code></td><td><code>IOException</code> là kiểm
      tra; <code>IllegalStateException</code> không</td></tr><tr><td>④ proxy</td><td>đối
      tượng đứng trước đối tượng thật, nhận lời gọi, làm việc thêm rồi chuyển tiếp</td><td>như
      lễ tân: ghi sổ rồi mới cho gặp</td></tr><tr><td>⑤ nhãn (annotation)</td><td>dấu
      <code>@…</code> đặt trên lớp hoặc hàm để dặn thư viện</td><td><code>@Transactional</code>:
      hàm này chạy trong giao dịch</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - - '1.5'
      - '1.6'
    introduces:
    - bnx_nguyen_tu
    say: Trước hết ta cần hiểu năm điều, giao dịch là nhóm thao tác ghi, chốt thì
      cùng có hiệu lực, hoàn tác thì không cái nào, tính ấy gọi là nguyên tử. Một
      giao dịch gắn với một kết nối, các kết nối nằm trong bể dùng chung, và luồng
      là một dây việc chạy song song. Ngoại lệ kiểm tra buộc phải khai hoặc bắt, ngoại
      lệ không kiểm tra thì không. Proxy là đối tượng đứng trước đối tượng thật, nhận
      lời gọi, làm thêm việc rồi chuyển tiếp.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l25_rolls_back('IOException', ('Exception',)) is True
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>@Transactional</code></td><td>dặn
      proxy: mở giao dịch trước hàm, <b>chốt</b> khi xong, <b>hoàn tác</b> khi gặp
      lỗi theo luật</td></tr><tr><td><code>REQUIRED</code></td><td><b>dùng chung</b>:
      có giao dịch rồi thì tham gia, chưa có thì mở mới (mặc định)</td></tr><tr><td><code>REQUIRES_NEW</code></td><td><b>luôn
      mở giao dịch riêng</b> trên kết nối khác; chốt hay hoàn tác độc lập</td></tr><tr><td><code>rollbackFor</code></td><td>khai
      thêm kiểu lỗi làm hoàn tác, ví dụ <code>Exception.class</code> gồm cả lỗi kiểm
      tra</td></tr><tr><td>mức cô lập (isolation)</td><td>mức một giao dịch được thấy
      thay đổi của giao dịch khác đang chạy</td></tr><tr><td><code>@Aspect</code>,
      <code>@Around</code></td><td><b>đoạn cắt</b>: mã chen quanh lời gọi hàm; <code>@Around</code>
      bọc cả trước và sau</td></tr></table>'
    say: Nhãn giao dịch dặn proxy mở giao dịch trước hàm, chốt khi hàm xong, và hoàn
      tác khi gặp lỗi theo luật. Kiểu dùng chung là có giao dịch thì tham gia, chưa
      có thì mở mới, còn kiểu riêng luôn mở giao dịch mới trên kết nối khác. Thuộc
      tính khai thêm kiểu lỗi làm hoàn tác. Mức cô lập quyết định giao dịch thấy thay
      đổi nào của giao dịch khác.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ nhỏ</th></tr><tr><td><code>j.update(TRU)</code></td><td><code>j</code>
      là <code>JdbcTemplate</code>, công cụ của Spring gửi câu SQL; <code>update</code>
      gửi câu ghi; <code>TRU</code> là chuỗi câu SQL trừ 100</td><td><code>j.update("insert
      … values (?)", m)</code>: dấu <code>?</code> giữ chỗ cho giá trị <code>m</code></td></tr><tr><td><code>@Configuration</code>,
      <code>@Bean</code></td><td>lớp khai cách dựng đối tượng; <code>@Bean</code>
      đánh dấu hàm tạo ra một đối tượng để Spring giữ và đưa cho nơi cần</td><td><code>@Bean
      DataSource ds()</code> tạo nguồn kết nối</td></tr><tr><td><code>@Around("execution(*
      ChuyenTien.rieng(..))")</code></td><td>chuỗi trong ngoặc chọn hàm bị bọc: hàm
      <code>rieng</code> của <code>ChuyenTien</code>; <code>*</code> là mọi kiểu trả
      về, <code>(..)</code> là mọi đối số</td><td>đổi <code>rieng</code> thành <code>*</code>
      thì bọc mọi hàm</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Mã Spring sắp tới có vài chỗ cần đọc trước. Đối tượng gửi câu SQL có hàm
      cập nhật, và dấu hỏi trong câu giữ chỗ cho giá trị. Nhãn cấu hình khai cách
      dựng đối tượng, nhãn tạo đối tượng đánh dấu hàm cho Spring giữ. Chuỗi trong
      nhãn bọc chọn hàm bị bọc.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ nhỏ</th></tr><tr><td><code>()
      -&gt; ct.chuyenLoi(false)</code>, <code>s -&gt; { … }</code>, <code>ct::chuyenKiem</code></td><td>hàm
      nhỏ không tên: trái mũi tên là đối số, phải là việc làm; <code>::</code> là
      cách viết gọn cho lời gọi hàm</td><td><code>ngoai.executeWithoutResult(s -&gt;
      { … })</code> chạy khối trong một giao dịch</td></tr><tr><td><code>a.setAutoCommit(false)</code>,
      <code>a.setTransactionIsolation(muc)</code></td><td>kết nối <code>a</code> thôi
      tự chốt từng câu (khi nào chốt do mã quyết định); rồi đặt mức cô lập</td><td><code>a.commit()</code>
      chốt cả nhóm</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    clear: true
    say: Mũi tên là hàm nhỏ không tên, trái là đối số, phải là việc làm. Hai dòng
      cuối tắt tự chốt từng câu và đặt mức cô lập.
