      fill="#dc2626" font-weight="bold">tự gọi this.rieng(): từ đối tượng thật gọi
      thẳng đối tượng thật, KHÔNG qua proxy</text></svg></div>'
    clear: true
    say: 'Hình này cho thấy proxy: bên gọi gặp proxy trước đối tượng thật, và proxy
      mở giao dịch, gọi hàm thật, rồi chốt hoặc hoàn tác. Kiểu dùng chung thì hàm
      trong và hàm ngoài chung kết nối, nên lỗi ở ngoài làm cả hai hoàn tác. Kiểu
      riêng thì hàm trong chốt ngay trên kết nối khác. Còn khi đối tượng tự gọi hàm
      của chính nó, lời gọi không qua proxy.'
