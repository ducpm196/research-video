  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>try
      (Connection a = …; Connection b = …) { … }</code></td><td><code>try</code> có
      ngoặc tròn: mở hai kết nối rồi tự đóng khi khối kết thúc, kể cả khi có lỗi</td></tr><tr><td><code>long
      l1 = so(a);</code></td><td>gọi hàm <code>so</code> với kết nối <code>a</code>,
      lưu số dư (số nguyên lớn) vào <code>l1</code></td></tr><tr><td><code>return
      l1 + " -&gt; " + l2;</code></td><td>dấu <code>+</code> nối số với chuỗi thành
      một chuỗi, ví dụ <code>1000 -&gt; 1050</code></td></tr></table>'
    clear: true
    say: Trước khi đọc mã, ta đọc ba dòng của nó, vì chúng dùng cú pháp Java chưa
      gặp. Khối thử có ngoặc tròn mở hai kết nối và tự đóng chúng khi khối kết thúc,
      kể cả khi có lỗi. Gọi hàm đọc số dư với kết nối a và lưu kết quả vào một biến
      số nguyên lớn. Dấu cộng giữa số và chuỗi nối chúng thành một chuỗi, như một
      nghìn mũi tên một nghìn không trăm năm mươi.
  - show: '<p><b>DemCoLap.java (trích; mã đủ ở thư mục kèm của lab): hai kết nối JDBC
      (bộ lời gọi chuẩn của Java tới cơ sở dữ liệu), không dùng Spring</b></p><div
      class="code"><div>  static String thu(int muc) throws Exception {</div><div>    try
      (Connection a = DriverManager.getConnection(U, "sa", "");</div><div>         Connection
      b = DriverManager.getConnection(U, "sa", "")) {</div><div>      b.createStatement().execute("update
      tk set so_du = 1000");</div><div>      a.setAutoCommit(false);</div><div>      a.setTransactionIsolation(muc);</div><div>      long
      l1 = so(a);</div><div>      b.createStatement().execute("update tk set so_du
      = so_du + 50");</div><div>      long l2 = so(a);</div><div>      a.commit();</div><div>      return
      l1 + " -&gt; " + l2;</div><div>    }</div><div>  }</div></div>'
    focus:
    - 1
    - 2
    introduces:
    - bnx_jdbc
    clear: true
    say: 'Ta kiểm mức cô lập bằng đường khác, vì muốn chắc kết quả không phụ thuộc
      Spring: chỉ dùng bộ lời gọi chuẩn của Java tới cơ sở dữ liệu. Kết nối A đặt
      mức cô lập và đọc số dư, kết nối B cộng thêm năm mươi và chốt, rồi A đọc lại.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>READ_COMMITTED: 1000
      -&gt; 1050</div><div>REPEATABLE_READ: 1000 -&gt; 1000</div><div>SERIALIZABLE:
      1000 -&gt; 1000</div></div><table class=''t''><tr><th>mức (kết quả đo trên H2)</th><th>lần
      đọc thứ hai của A</th><th>vì sao</th></tr><tr><td>READ_COMMITTED</td><td>1050</td><td>chỉ
      cần dữ liệu đã chốt: thấy thay đổi của B</td></tr><tr><td>REPEATABLE_READ</td><td>1000</td><td>đọc
      lặp lại cho cùng kết quả trong giao dịch</td></tr><tr><td>SERIALIZABLE</td><td>1000</td><td>cô
      lập chặt nhất</td></tr></table>'
    focus:
    - 0
    - 2
    - 2
    clear: true
    say: Kết quả thật, ở mức chỉ cần dữ liệu đã chốt, lần đọc thứ hai thấy một nghìn
      không trăm năm mươi, vì thay đổi của B đã chốt. Ở hai mức chặt hơn, lần đọc
      thứ hai vẫn là một nghìn. Đây là số đo trên H2, hệ khác có thể cho kết quả khác.
- id: quymo
  kind: example
  title: 'Khi tải lớn dần: bể kết nối cần bao nhiêu?'
  checks:
  - '[alg.bnx_l25_pool_min(n) for n in (3, 6, 300, 30000)] == [4, 7, 301, 30001]'
  - alg.bnx_l25_pool_min(3 * 100) == 301 and 30000 // 3 == 10000
  steps:
  - show: '<table class=''t''><tr><th>số luồng đồng thời</th><th>bể cần tối thiểu
      nếu có giao dịch riêng (luồng + 1)</th><th>bể bằng số luồng thì</th><th>nguồn
      số</th></tr><tr><td><span style=''white-space:nowrap''>3 (×1)</span></td><td>4</td><td>3
      luồng hết giờ (đo thật)</td><td>chạy thật DemBe</td></tr><tr><td>6</td><td>7</td><td>6
      luồng hết giờ (đo thật)</td><td>chạy thật DemBe</td></tr><tr><td><span style=''white-space:nowrap''>300
      (×100)</span></td><td>301</td><td>300 luồng chờ nhau tới hết giờ, nếu cả 300
      cùng giữ giao dịch ngoài lúc đó (suy từ quy tắc)</td><td>công thức của hướng
      dẫn</td></tr><tr><td><span style=''white-space:nowrap''>30 000 (×10 000)</span></td><td>30
      001</td><td>bể không thể lớn như thế: cơ sở dữ liệu giới hạn kết nối</td><td>suy
      ra: phải bỏ giao dịch riêng hoặc hạ số luồng</td></tr></table>'
    say: Ba luồng cần bể bốn kết nối, hai dòng đầu đã đo thật. Ba trăm luồng, gấp
      một trăm lần, cần ba trăm lẻ một kết nối, nếu bể chỉ bằng số luồng thì chờ nhau
      tới hết giờ. Ba mươi nghìn luồng cần ba mươi nghìn lẻ một kết nối, cơ sở dữ
      liệu thường không cho nhiều thế, nên cách làm cũ gãy.
  - show: '<table class=''t''><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào
      chọn</th></tr><tr><td>giao dịch riêng cho nhật ký</td><td>nhật ký sống sót khi
      nghiệp vụ hỏng</td><td>mỗi luồng cần 1 kết nối thêm; nhật ký và nghiệp vụ không
      còn nguyên tử</td><td>nhật ký kiểm toán phải còn dù lỗi, và bể được tính đủ</td></tr><tr><td>dùng
      chung giao dịch</td><td>một kết nối, nhất quán cả hai</td><td>nghiệp vụ hỏng
      thì nhật ký mất</td><td>dữ liệu phải cùng thành hoặc cùng bỏ</td></tr><tr><td>ghi
      nhật ký ra ngoài giao dịch (<b>hàng đợi</b>: nơi thông điệp xếp hàng chờ chương
      trình khác xử lý; hoặc tệp)</td><td>không giữ thêm kết nối</td><td>thêm một
      thành phần phải vận hành</td><td>tải rất lớn, nhật ký ghi dồn</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Người làm nghề phải chọn, giao dịch riêng giúp nhật ký sống sót khi nghiệp
      vụ hỏng, đổi lại mỗi luồng cần thêm một kết nối. Dùng chung thì một kết nối
      và nhất quán, nhưng nghiệp vụ hỏng thì nhật ký mất. Khi tải rất lớn, người ta
      ghi nhật ký ra ngoài giao dịch, qua hàng đợi hoặc tệp, đổi lại thêm một thành
      phần.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - not alg.bnx_l25_rolls_back('Exception', ()) and alg.bnx_l25_balance(1000, 100,
    False) == 900
  - alg.bnx_l25_timeouts(3, 3) == 3
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Ném <b class="red">lỗi
      kiểm tra</b> từ hàm có <code>@Transactional</code> và tin rằng giao dịch sẽ
      hoàn tác. Chạy thật ca 3: số dư vẫn <b>900</b>.

      Quy tắc mặc định của Spring: chỉ lỗi không kiểm tra và <code>Error</code> làm
      hoàn tác. Muốn khác thì khai <code>rollbackFor</code>.</div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới, là ném lỗi kiểm tra từ hàm có nhãn giao dịch
      và tin rằng giao dịch sẽ hoàn tác. Chạy thật ở ca ba, số dư vẫn là chín trăm,
      vì mặc định chỉ lỗi không kiểm tra làm hoàn tác.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Đặt
      <code>@Transactional</code> lên hàm rồi <b class="red">gọi nó bằng <code>this.</code></b>
      từ hàm khác cùng lớp: chạy thật, giao dịch <b>false</b>.

      Chương trình vẫn "chạy được" cho tới khi gặp ca hoàn tác. Cách chữa: tách sang
      một đối tượng khác, hoặc để lời gọi đi qua proxy. Cùng lỗi áp cho đoạn cắt:
      bị bỏ qua.</div><div class="code"><div>  @Transactional(propagation = Propagation.REQUIRES_NEW)</div><div>  public
      boolean rieng() {</div><div>    return TransactionSynchronizationManager</div><div>        .isActualTransactionActive();</div><div>  }</div><div>  public
      boolean goiNoiBo() { return this.rieng(); }</div></div>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ hai: đặt nhãn giao dịch lên một hàm rồi gọi nó bằng từ khoá chỉ
      chính nó từ hàm khác cùng lớp. Hàm kia không có giao dịch, nên chương trình
      chạy êm cho tới ca cần hoàn tác. Cách chữa là tách hàm sang đối tượng khác.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc tải tăng).</b> Dùng
      <code>REQUIRES_NEW</code> khắp nơi cho tiện. Đo thật: khi mọi luồng cùng giữ
      giao dịch ngoài, bể bằng số luồng thì <b class="red">mọi luồng hết giờ</b> chờ
      nhau; cần bể ≥ luồng + 1.

      Mỗi lần tách là thêm một kết nối bị giữ, nên khi tải tăng, bể kết nối cạn trước
      cả cơ sở dữ liệu.</div>

      '
    clear: true
    say: 'Lỗi thứ ba, khi tải tăng: dùng giao dịch riêng khắp nơi cho tiện. Đo thật:
      bể bằng số luồng thì tất cả hết giờ, vì mỗi lần tách là giữ thêm một kết nối.'
  - show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm, lúc vận hành lâu dài).</b>
      Hàm <b>ngoài</b> <b class="red">bắt lỗi</b> do hàm <b>trong</b> ném ra (<code>catch</code>
      rỗng) rồi vẫn chạy tiếp và chốt. Hàm trong đã đánh dấu giao dịch chung là &laquo;chỉ
      được hoàn tác&raquo;,

      nên lúc chốt bên gọi nhận <code>UnexpectedRollbackException</code> (theo hướng
      dẫn của Spring). Nhật ký ghi "đã chuyển" mà tiền không đi: lỗi chỉ lộ sau nhiều
      tháng, khi đối soát lệch.

      <br><span class="note">Nếu chính hàm trong tự nuốt lỗi thì proxy không thấy
      lỗi nào, giao dịch cứ chốt: lỗi khác, hậu quả cũng tệ.</span></div>

      '
    clear: true
    say: 'Lỗi thứ tư, khi vận hành lâu: hàm ngoài bắt lỗi do hàm trong ném ra rồi
      vẫn chạy tiếp và chốt. Hàm trong đã đánh dấu giao dịch chung là chỉ được hoàn
      tác, nên lúc chốt bên gọi nhận một ngoại lệ bất ngờ, và nhật ký ghi đã chuyển
      mà tiền không đi.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - not alg.bnx_l25_rolls_back('IOException', ())
  - alg.bnx_l25_pool_min(40) == 41 and alg.bnx_l25_timeouts(40, 40) == 40
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Hàm
      <code>A</code> (<code>@Transactional</code>) gọi hàm <code>B</code> của <b>đối
      tượng khác</b> (<code>REQUIRED</code>) rồi A ném <code>IOException</code> (lỗi
