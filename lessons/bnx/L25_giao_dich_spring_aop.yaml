- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ nhãn tới hành vi của giao dịch'
  checks:
  - alg.bnx_l25_rolls_back('IllegalStateException', ()) and not alg.bnx_l25_rolls_back('Exception',
    ())
  - alg.bnx_l25_rolls_back('Exception', ('Exception',))
  - alg.bnx_l25_isolation_reread('READ_COMMITTED', 1000, 50) == 1050 and alg.bnx_l25_isolation_reread('REPEATABLE_READ',
    1000, 50) == 1000
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>static
      final String TRU = "update …";</code></td><td><code>final</code>: gán một lần
      rồi không đổi; <code>static</code>: một bản chung cho cả lớp; <code>TRU</code>
      là chuỗi câu SQL trừ tiền</td></tr><tr><td><code>public void chuyenLoi(boolean
      rieng)</code></td><td>hàm không trả gì (<code>void</code>), nhận một tham số
      kiểu đúng hoặc sai tên <code>rieng</code></td></tr><tr><td><code>if (rieng)
      nk.ghiRieng(…); else nk.ghi(…);</code></td><td>nếu <code>rieng</code> đúng thì
      làm câu sau <code>if</code>, ngược lại làm câu sau <code>else</code></td></tr><tr><td><code>throw
      new IllegalStateException("…");</code></td><td>tạo một đối tượng lỗi rồi ném
      đi; hàm dừng ngay, lỗi bay ra cho nơi gọi</td></tr></table>'
    clear: true
    say: Chữ cuối cùng nghĩa là gán một lần rồi không đổi, còn chữ tĩnh nghĩa là một
      bản chung cho cả lớp. Hàm này không trả gì và nhận một tham số kiểu đúng hoặc
      sai. Nếu biến đúng thì làm câu đứng ngay sau, ngược lại làm câu sau từ khoá
      còn lại. Câu này tạo một đối tượng lỗi rồi ném đi, hàm dừng ngay và lỗi bay
      ra cho nơi gọi.
  - show: '<p><b>Bước 1.</b> Muốn mỗi hàm của dịch vụ tự mở và chốt giao dịch mà không
      viết lệnh mở/chốt ở từng hàm, Spring bọc đối tượng bằng một <b>proxy</b>. Nhãn
      <code>@Transactional</code> chỉ là lời dặn cho proxy.</p><p><b>ChuyenTien.java
      (trích; mã đủ ở thư mục kèm của lab): hàm trừ tiền, ghi nhật ký, rồi lỗi</b></p><div
      class="code"><div>  @Transactional</div><div>  public void chuyenLoi(boolean
      rieng) {</div><div>    j.update(TRU);</div><div>    if (rieng) nk.ghiRieng("thu
      chuyen"); else nk.ghi("thu chuyen");</div><div>    throw new IllegalStateException("het
      han muc");</div><div>  }</div></div><p>Làm thử: kết quả chạy thật cho thấy <code>ct</code>
      là proxy (<code>AopUtils.isAopProxy</code> trả <b>true</b>).</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, vì muốn mỗi hàm tự mở và chốt giao dịch mà không viết lệnh ở từng
      hàm, Spring bọc đối tượng bằng một proxy. Nhãn giao dịch chỉ là lời dặn cho
      proxy, và chạy thật cho thấy đối tượng lấy từ Spring đúng là proxy.
  - show: '<p><b>Bước 2. Lan truyền.</b> Hàm <code>ghi</code> của nhật ký cũng có
      <code>@Transactional</code>. Khi nó được gọi từ trong <code>chuyenLoi</code>
      (đã có giao dịch), kiểu mặc định <code>REQUIRED</code> cho nó <b>tham gia</b>
      giao dịch ngoài, nên hai việc cùng chung số phận.

      Nếu muốn nhật ký sống sót dù chuyển tiền hỏng, dùng <code>REQUIRES_NEW</code>:
      giao dịch riêng, kết nối khác, chốt ngay.</p><p><b>NhatKy.java: hai cách ghi
      nhật ký</b></p><div class="code"><div>  @Transactional</div><div>  public void
      ghi(String m) {</div><div>    j.update("insert into nhat_ky values (?)", m);</div><div>  }</div><div>  @Transactional(propagation
      = Propagation.REQUIRES_NEW)</div><div>  public void ghiRieng(String m) {</div><div>    j.update("insert
      into nhat_ky values (?)", m);</div><div>  }</div></div>

      '
    focus:
    - 1
    - 3
    clear: true
    say: 'Bước hai là lan truyền: hàm ghi nhật ký có nhãn giao dịch, và khi được gọi
      từ hàm chuyển tiền, kiểu mặc định cho nó tham gia giao dịch sẵn có, nên hai
      việc chung số phận. Muốn nhật ký sống sót, ta dùng giao dịch riêng.'
  - show: <p><b>Bước 3. Hoàn tác.</b> Proxy bắt ngoại lệ bay ra từ hàm và quyết định.
      Mặc định hoàn tác khi là <b>lỗi không kiểm tra</b> (lớp con <code>RuntimeException</code>)
      hoặc <code>Error</code>; lỗi <b>kiểm tra</b> thì vẫn <b>chốt</b>, trừ khi khai
      <code>rollbackFor</code>.</p><table class='t'><tr><th>lỗi ném ra</th><th>khai
      gì thêm</th><th>kết quả</th></tr><tr><td>IllegalStateException (không kiểm tra)</td><td>không</td><td><b>hoàn
      tác</b></td></tr><tr><td>Exception (kiểm tra)</td><td>không</td><td><b>chốt</b>,
      số dư vẫn bị trừ</td></tr><tr><td>Exception (kiểm tra)</td><td><code>rollbackFor
      = Exception.class</code></td><td><b>hoàn tác</b></td></tr></table>
    focus:
    - '2.2'
    - '2.3'
    - '2.4'
    clear: true
    say: 'Bước ba là hoàn tác: proxy bắt ngoại lệ bay ra từ hàm, mặc định hoàn tác
      với lỗi không kiểm tra hoặc lỗi hệ thống nặng. Lỗi kiểm tra thì vẫn chốt, nên
      số dư vẫn bị trừ. Chỉ khi ta khai thêm kiểu lỗi đó thì nó mới hoàn tác.'
  - show: '<p><b>Bước 4. Tự gọi.</b> Proxy chỉ chặn được lời gọi đi <b>qua nó</b>.
      Khi hàm <code>goiNoiBo</code> gọi <code>this.rieng()</code>, lời gọi đi thẳng
      từ đối tượng thật tới đối tượng thật, nên proxy không có cơ hội mở giao dịch:
      nhãn trên <code>rieng()</code> bị bỏ qua.</p><p><b>ChuyenTien.java (trích; mã
      đủ ở thư mục kèm của lab): hàm có nhãn và hàm tự gọi nó</b></p><div class="code"><div>  @Transactional(propagation
      = Propagation.REQUIRES_NEW)</div><div>  public boolean rieng() {</div><div>    return
      TransactionSynchronizationManager</div><div>        .isActualTransactionActive();</div><div>  }</div><div>  public
      boolean goiNoiBo() { return this.rieng(); }</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước bốn là tự gọi: proxy chỉ chặn được những lời gọi đi qua nó. Khi hàm
      tự gọi hàm khác của chính đối tượng, lời gọi đi thẳng từ đối tượng thật tới
      đối tượng thật, nên proxy không mở giao dịch và nhãn trên hàm kia bị bỏ qua.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>public
      Object doThoiGian(ProceedingJoinPoint p) throws Throwable</code></td><td>hàm
      trả về <code>Object</code> (kiểu chung nhất), nhận <code>p</code> là lời gọi
      đang bị bọc; <code>throws Throwable</code>: có thể ném mọi loại lỗi</td></tr><tr><td><code>long
      t = System.nanoTime();</code></td><td>khai biến số nguyên lớn <code>t</code>,
      lưu giờ hiện tại tính bằng phần tỉ giây</td></tr><tr><td><code>try { return
      p.proceed(); } finally { dem++; … }</code></td><td>chạy hàm thật rồi trả kết
      quả; khối <code>finally</code> luôn chạy sau cùng dù có lỗi hay không; <code>dem++</code>:
      tăng đếm thêm 1; <code>x &amp;= c</code>: giữ đúng chỉ khi cả hai vế đúng</td></tr></table>'
    clear: true
    say: Trước khi đọc đoạn cắt, ta đọc ba dòng của nó, vì chúng dùng cú pháp Java
      chưa gặp. Hàm trả về kiểu chung nhất, nhận lời gọi đang bị bọc, và lời báo ném
      lỗi cho phép ném mọi loại lỗi. Khai một biến số nguyên lớn để lưu giờ hiện tại
      tính bằng phần tỉ giây. Khối thử chạy hàm thật, còn khối cuối cùng luôn chạy
      sau cùng dù có lỗi hay không, ở đó biến đếm tăng thêm một.
  - show: '<p><b>Bước 5. Đoạn cắt.</b> Cùng cơ chế proxy: Spring AOP chen đoạn cắt
      quanh lời gọi. <code>@Around</code> nhận quyền điều khiển, gọi <code>proceed()</code>
      để chạy hàm thật, và làm việc trước và sau.</p><p><b>DoGio.java: đoạn cắt đo
      thời gian quanh hàm rieng()</b></p><div class="code"><div>  @Around("execution(*
      ChuyenTien.rieng(..))")</div><div>  public Object doThoiGian(ProceedingJoinPoint
      p)</div><div>      throws Throwable {</div><div>    long t = System.nanoTime();</div><div>    try
      {</div><div>      return p.proceed();</div><div>    } finally {</div><div>      dem++;</div><div>      khongAm
      &amp;= System.nanoTime() - t &gt;= 0;</div><div>    }</div><div>  }</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước năm là đoạn cắt, dùng cùng cơ chế proxy nên kiểu bọc quanh nhận quyền
      điều khiển, gọi hàm tiến hành để chạy hàm thật, và làm việc trước lẫn sau. Ở
      đây nó đếm số lần gọi.
  - show: '<p><b>Bước 6. Mức cô lập.</b> Hai giao dịch chạy cùng lúc: A đọc số dư,
      B sửa và chốt, A đọc lại. Mức <b>READ_COMMITTED</b>: A thấy giá trị mới (đọc
      lại ra khác). Mức <b>REPEATABLE_READ</b>: trên <b>H2</b>, A vẫn thấy giá trị
      cũ. Mức cô lập là tính năng của <b>cơ sở dữ liệu</b>, nên mỗi hệ có thể một
      khác (bài chỉ chạy thật trên H2). Spring chỉ đặt mức lên kết nối.</p>$$1000
      \to 1000 + 50 = 1050 \text{ (đọc lại thấy B)} \qquad 1000 \to 1000 \text{ (không
      thấy B)}$$'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước sáu là mức cô lập: giao dịch A đọc số dư, giao dịch B sửa và chốt,
      rồi A đọc lại. Ở mức đọc dữ liệu đã chốt, A thấy giá trị mới vì mỗi lần đọc
      chỉ cần dữ liệu đã chốt. Ở mức đọc lặp lại được, trên H2, A vẫn thấy giá trị
      cũ, còn các hệ khác có thể cư xử khác.'
- id: example
  kind: example
  title: Ví dụ chạy thật Spring, từng phép tính
  checks:
  - alg.bnx_l25_balance(1000, 100, True) == 1000 and alg.bnx_l25_balance(1000, 100,
    False) == 900
  - alg.bnx_l25_log_rows('REQUIRED') == 0 and alg.bnx_l25_log_rows('REQUIRES_NEW')
    == 1
  - alg.bnx_l25_timeouts(6, 6) == 6 and alg.bnx_l25_timeouts(6, 7) == 0
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>new
      DriverManagerDataSource("jdbc:h2:mem:l25;…", "sa", "")</code></td><td><code>new</code>:
      tạo đối tượng nguồn kết nối; ba đối số: địa chỉ (<code>h2:mem:l25</code> là
      H2 trong bộ nhớ, tên l25), tên đăng nhập <code>sa</code>, mật khẩu rỗng</td></tr></table>'
    clear: true
    say: 'Chữ tạo mới tạo đối tượng nguồn kết nối với ba đối số: địa chỉ cơ sở dữ
      liệu trong bộ nhớ, tên đăng nhập và mật khẩu rỗng.'
  - show: '<p><b>Cfg.java (trích; mã đủ ở thư mục kèm của lab): bật giao dịch và đoạn
      cắt, khai nguồn dữ liệu</b></p><div class="code"><div>@Configuration</div><div>@EnableTransactionManagement</div><div>@EnableAspectJAutoProxy</div><div>public
      class Cfg {</div><div>  @Bean DataSource ds() {</div><div>    return new DriverManagerDataSource(</div><div>        "jdbc:h2:mem:l25;DB_CLOSE_DELAY=-1",
      "sa", "");</div><div>  }</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta chạy thật Spring bản bảy chấm không chấm mười với H2, cơ sở dữ liệu nhỏ
      trong bộ nhớ. Hai nhãn đầu bật proxy cho giao dịch và đoạn cắt, các hàm sau
      khai nguồn dữ liệu. Đây là đoạn trích, mã đủ của mọi tệp nằm trong thư mục thực
      hành.
  - show: '<p><b>DemTx.java (trích; mã đủ ở thư mục kèm của lab): bốn ca, mỗi ca đặt
      lại số dư 1000</b></p><div class="code"><div>    var ct = c.getBean(ChuyenTien.class);</div><div>    System.out.println("ct
      la proxy: " + AopUtils.isAopProxy(ct));</div><div>    mo("1 REQUIRED, loi chay",
      () -&gt; ct.chuyenLoi(false));</div><div>    mo("2 REQUIRES_NEW, loi chay",
      () -&gt; ct.chuyenLoi(true));</div><div>    mo("3 loi kiem tra, mac dinh", ct::chuyenKiem);</div><div>    mo("4
      loi kiem tra, rollbackFor", ct::chuyenKiemHoanTac);</div></div>'
    clear: true
    say: 'Phép tính một tới bốn là bốn ca: mỗi ca đặt lại số dư về một nghìn, xoá
      nhật ký, gọi một hàm, rồi đọc số dư và đếm dòng nhật ký.'
  - show: '<p><b>ChuyenTien.java (trích; mã đủ ở thư mục kèm của lab): hai hàm cho
      ca 3 và ca 4, chỉ khác phần khai rollbackFor</b></p><div class="code"><div>  @Transactional</div><div>  public
      void chuyenKiem() throws Exception {</div><div>    j.update(TRU);</div><div>    throw
      new Exception("loi kiem tra");</div><div>  }</div><div>  @Transactional(rollbackFor
