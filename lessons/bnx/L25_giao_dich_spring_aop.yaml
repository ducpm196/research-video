- id: practice
  kind: practice
  title: 'Tự làm: bảng quyết định hoàn tác'
  steps:
  - show: '<p><b>Đề (MÔ PHỎNG, không chạy Spring)</b>: viết <code>mau.py</code> có
      hàm <code>hoan_tac(loi, rollback_for)</code> theo quy tắc mặc định của Spring,
      rồi in 5 dòng cho 5 ca:</p>

      <ol><li><code>IllegalArgumentException</code>, không khai</li><li><code>IOException</code>,
      không khai</li><li><code>IOException</code>, khai <code>Exception</code></li><li><code>Error</code>,
      không khai</li><li>không có lỗi</li></ol>

      <p class="note">Mỗi dòng dạng <code>&lt;lỗi&gt; + &lt;khai&gt;: hoan tac</code>
      hoặc <code>chot</code>. Kiểu kiểm tra: IOException, SQLException, Exception.
      Chi tiết trong <code>de.md</code>.</p>

      '
    focus:
    - 1
    - 2
    - 3
    pause: 120
    say: 'Bây giờ tới phần bạn tự làm, một mô phỏng không chạy Spring: viết một hàm
      Python quyết định giao dịch hoàn tác hay chốt theo quy tắc mặc định của Spring.
      Chạy hàm cho năm ca có trong đề. Hãy dừng video và tự viết, đừng chép lại ví
      dụ.'
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>IllegalArgumentException
      + khong khai: hoan tac</div><div>IOException + khong khai: chot</div><div>IOException
      + Exception: hoan tac</div><div>Error + khong khai: hoan tac</div><div>khong
      loi + khong khai: chot</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh BNX L25 mau.py</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> kiểm theo thứ tự: không lỗi → chốt;
      <code>Error</code> → hoàn tác; lỗi không kiểm tra → hoàn tác; lỗi kiểm tra →
      hoàn tác chỉ khi nó (hoặc <code>Exception</code>) nằm trong danh sách khai.

      Lời giải đầy đủ ở <code>labs/BNX/L25/loi_giai.py</code> — chỉ mở sau khi bạn
      đã thử.</div>

      '
    say: 'Nếu kẹt, kiểm theo thứ tự: không lỗi thì chốt, lỗi hệ thống nặng hoặc không
      kiểm tra thì hoàn tác. Còn lỗi kiểm tra thì chỉ hoàn tác khi nó, hoặc kiểu cha,
      nằm trong danh sách khai. Lời giải chỉ mở sau khi đã tự thử.'
