- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: hệ thu thập chạy thật'
  checks:
  - alg.bnx_l31_ratio(30, 6000) == 0.005
  - alg.bnx_l31_burn(0.005, 0.999) == 5
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>global:
      {scrape_interval: 1s}</code>, <code>scrape_configs:</code></td><td>chu kỳ kéo
      chung 1 giây; danh sách các việc kéo</td></tr><tr><td><code>job_name: bnx</code>,
      <code>fallback_scrape_protocol: PrometheusText0.0.4</code></td><td>tên việc
      kéo; giao thức dự phòng khi trang không báo kiểu: văn bản của Prometheus bản
      0.0.4</td></tr><tr><td><code>static_configs: [{targets: [''localhost:9100'']}]</code></td><td>danh
      sách đích cố định (<code>targets</code>): máy này, cổng 9100</td></tr></table>'
    clear: true
    say: Chu kỳ kéo chung một giây, rồi danh sách việc kéo. Tên việc kéo, và giao
      thức dự phòng khi trang không báo kiểu. Danh sách đích cố định nên kéo từ máy
      này, cổng chín nghìn một trăm.
  - show: '<p><b>Chạy thật: cấu hình để Prometheus kéo trang chỉ số mỗi 1 giây (prom.yml)</b></p><div
      class="code"><div>cat &gt; prom.yml &lt;&lt;''EOF''</div><div>global: {scrape_interval:
      1s}</div><div>scrape_configs:</div><div>- job_name: bnx</div><div>  fallback_scrape_protocol:
      PrometheusText0.0.4</div><div>  static_configs: [{targets: [''localhost:9100'']}]</div><div>EOF</div></div>'
    clear: true
    say: 'Ta kiểm bằng đường khác hẳn: chạy hệ thu thập chỉ số thật, cho nó kéo mỗi
      giây trang văn bản do chương trình Java in ra.'
  - show: '<table class=''t''><tr><th>viết trong lệnh</th><th>nghĩa</th></tr><tr><td><code>wget
      -qO- --post-data "query=&#36;1" URL</code></td><td>gửi truy vấn tới địa chỉ
      URL rồi in trả lời ra màn hình (<code>-q</code>: không in tiến trình; <code>-O-</code>:
      in ra thay vì lưu tệp); <code>&#36;1</code> là đối số đầu của hàm</td></tr><tr><td><code>|
      sed ''s/.*"value":\[[0-9.]*,"\([^"]*\)"\].*/\1/''</code></td><td><code>s/mẫu/thay/</code>
      thay phần khớp mẫu; <code>.*</code> khớp mọi ký tự; <code>\( … \)</code> bắt
      phần giá trị; <code>\1</code> in phần bắt được, nên <code>…"value":[1731,"30"]…</code>
      thành <code>30</code></td></tr><tr><td><code>for i in &#36;(seq 1 60); do …
      sleep 1; done</code></td><td>lặp tối đa 60 lần, nghỉ 1 giây mỗi lần, cho tới
      khi <code>up</code> bằng 1</td></tr><tr><td><code>[ "&#36;(q up)" = 1 ] &amp;&amp;
      break</code></td><td>nếu <code>q up</code> trả đúng 1 thì thoát vòng lặp ngay</td></tr></table>'
    clear: true
    say: Ta đọc cách viết hàm hỏi, lệnh tải gửi truy vấn rồi in trả lời, nên lệnh
      cắt chuỗi chỉ cần giữ giá trị. Vòng lặp thử mỗi giây tối đa sáu mươi lần cho
      tới khi chỉ số up bằng một.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>L=''sum(http_requests_total{code="500"})''</code>,
      <code>&#36;(q "&#36;L")</code></td><td>biến <code>L</code> giữ một truy vấn;
      <code>&#36;(q "&#36;L")</code> chạy hàm <code>q</code> với truy vấn đó rồi lấy
      đầu ra</td></tr><tr><td><code>"&#36;L/sum(http_requests_total)"</code></td><td>ghép
      truy vấn: tổng lỗi chia tổng yêu cầu là tỉ lệ lỗi</td></tr></table>'
    clear: true
    say: Biến giữ truy vấn, hàm q chạy nó và lấy đầu ra. Tổng lỗi chia tổng yêu cầu
      nên là tỉ lệ lỗi.
  - show: <p><b>Hỏi hệ thu thập qua giao diện HTTP của nó (trích in.sh)</b></p><div
      class="code"><div>q() {</div><div>  wget -qO- --post-data "query=<span>&#36;</span>1"
      \</div><div>    http://localhost:9090/api/v1/query 2&gt;/dev/null |</div><div>  sed
      's/.*"value":\[[0-9.]*,"\([^"]*\)"\].*/\1/'</div><div>}</div><div>for i in <span>&#36;</span>(seq
      1 60); do [ "<span>&#36;</span>(q up)" = 1 ] &amp;&amp; break; sleep 1; done</div><div>echo
      "up = <span>&#36;</span>(q up)"</div><div>L='sum(http_requests_total{code="500"})'</div><div>echo
      "loi 500 = <span>&#36;</span>(q "<span>&#36;</span>L")"</div><div>echo "ty le
      loi = <span>&#36;</span>(q "<span>&#36;</span>L/sum(http_requests_total)")"</div></div>
    clear: true
    say: 'Rồi ta hỏi nó ba điều qua giao diện HTTP, vì hàm q trả về giá trị: có kéo
      được không, tổng lỗi năm trăm, và tỉ lệ lỗi.'
  - show: '<p><b>Kết quả chạy thật: Prometheus 3.16.0 kéo trang chỉ số của XuatChiSo.java</b></p><div
      class="code"><div>up = 1</div><div>loi 500 = 30</div><div>ty le loi = 0.005</div></div><table
      class=''t''><tr><th>con số</th><th>đường thứ nhất</th><th>đường khác</th></tr><tr><td>tỉ
      lệ lỗi</td><td>Prometheus thật: 0.005</td><td>Python: 30 / 6000 = 0.005</td></tr><tr><td>tốc
      độ đốt</td><td>ca kiểm của promtool: 5</td><td>tính tay: 0,005 / 0,001 = 5</td></tr></table>'
    clear: true
    say: 'Kết quả: up bằng một là kéo thành công, tổng lỗi năm trăm là ba mươi, tỉ
      lệ lỗi là năm phần nghìn, nên khớp với cách tính bằng Python.'
- id: quymo
  kind: example
  title: 'Khi hệ thống lớn dần: số dòng phải xem và số chuỗi chỉ số'
  checks:
  - alg.bnx_l31_index(1000)[:2] == (1, 2) and alg.bnx_l31_index(1000000)[:2] == (1000,
    2000)
  - alg.bnx_l31_exposition(0) == (5, 324) and alg.bnx_l31_exposition(100) == (401,
    24287) and alg.bnx_l31_exposition(10000) == (40001, 2495695)
  steps:
  - show: '<p><b>Chạy thật (Python): quét hết hay dùng chỉ mục</b></p><div class="code"><div>1000
      dong: khop 1 | quet 1000 dong | chi muc xet 2 dong</div><div>1000000 dong: khop
      1000 | quet 1000000 dong | chi muc xet 2000 dong</div></div>$$10^3 \to 10^6
      \;(\times 1000): \; \text{quét } 10^3 \to 10^6 \text{ dòng}; \; \text{chỉ mục
      } 2 \to 2\,000 \text{ dòng}$$'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Đây là số đo thật khi nhật ký lớn lên một nghìn lần. Quét hết thì phải đọc
      một nghìn rồi một triệu dòng. Chỉ mục chỉ xem các dòng có chữ lỗi, từ hai lên
      hai nghìn, tăng theo số kết quả. Đây là mô phỏng chỉ mục đảo, không phải bộ
      ba công cụ thật.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>for
      n in 0 100 10000; do … done</code>, <code>java XuatChiSo.java &#36;n &gt; m&#36;n</code></td><td>lặp:
      <code>n</code> lần lượt là 0, 100, 10000; chạy chương trình với tham số <code>n</code>,
      ghi đầu ra vào tệp <code>m0</code>, <code>m100</code>, <code>m10000</code></td></tr><tr><td><code>&#36;(grep
      -vc ''^#'' m&#36;n)</code>, <code>&#36;(wc -c &lt; m&#36;n)</code></td><td><code>grep
      -vc ''^#''</code> đếm dòng KHÔNG bắt đầu bằng <code>#</code>, mỗi dòng là một
      chuỗi; <code>wc -c</code> đếm byte của tệp; <code>&#36;(…)</code> lấy kết quả
      đưa vào câu in</td></tr></table>'
    clear: true
    say: Lặp ba cỡ, mỗi lần ghi đầu ra vào một tệp riêng. Đếm dòng không phải chú
      thích, đếm byte, rồi đưa vào câu in.
  - show: '<p><b>Lệnh đo (bash): chạy chương trình Java ba lần, đếm dòng và byte</b></p><div
      class="code"><div>for n in 0 100 10000; do</div><div>  java XuatChiSo.java <span>&#36;</span>n
      &gt; m<span>&#36;</span>n</div><div>  echo "<span>&#36;</span>n gia tri nhan
      user: <span>&#36;</span>(grep -vc ''^#'' m<span>&#36;</span>n) chuoi, <span>&#36;</span>(wc
      -c &lt; m<span>&#36;</span>n) byte"</div><div>done</div></div><p><b>Chạy thật
      (JDK 21): một lần kéo số liệu khi thêm nhãn user</b></p><div class="code"><div>0
      gia tri nhan user: 5 chuoi, 324 byte</div><div>100 gia tri nhan user: 401 chuoi,
      24287 byte</div><div>10000 gia tri nhan user: 40001 chuoi, 2495695 byte</div></div>$$5
      \to 401 \to 40\,001 \text{ chuỗi}; \quad 324 \to 24\,287 \to 2\,495\,695 \text{
      byte mỗi lần kéo}$$'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Số đo thứ hai là số chuỗi chỉ số, mỗi dòng không phải chú thích là một chuỗi,
      cùng số byte của cả trang. Với một trăm giá trị nhãn người dùng, năm chuỗi thành
      bốn trăm linh một và gần hai mươi tư nghìn byte mỗi lần kéo. Với mười nghìn
      giá trị là bốn mươi nghìn chuỗi và gần hai phẩy năm megabyte.
  - show: '<table class=''t''><tr><th>cách</th><th>được</th><th>mất</th><th>chọn khi</th></tr><tr><td>ghi
      mọi chi tiết vào nhật ký, chỉ mục hết</td><td>tìm được mọi thứ, kể cả điều chưa
      nghĩ tới</td><td>dung lượng và chi phí lập chỉ mục tăng theo số dòng</td><td>mới
      dựng; lưu ngắn ngày</td></tr><tr><td>chỉ số ít nhãn + nhật ký lỗi + mã tương
      quan</td><td>rẻ; cảnh báo nhanh; truy vết khi cần</td><td>không trả lời được
      câu hỏi chưa đo</td><td>hệ thống đã chạy thật, tải lớn</td></tr><tr><td>nhãn
      theo mã người dùng</td><td>xem từng người</td><td>số chuỗi nhân lên theo số
      người: nguy cơ quá tải</td><td>gần như không bao giờ: chuyển sang nhật ký</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Bảng này là các lựa chọn, ghi mọi chi tiết thì tìm được mọi thứ, đổi lại
      chi phí tăng theo số dòng. Chỉ số ít nhãn kèm nhật ký lỗi thì rẻ và báo nhanh,
      nhưng không trả lời câu hỏi chưa đo. Nhãn theo mã người dùng nhân số chuỗi lên,
      nên thông tin theo người để ở nhật ký.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_l31_exposition(100)[0] == 401 and alg.bnx_l31_exposition(10000)[0] ==
    40001
  - round(51 / 5000, 2) == 0.01
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Ghi nhật ký <b class="red">văn
      bản tự do</b> và <b class="red">không có mã tương quan</b>. Hai yêu cầu xen
      kẽ mà không có <code>cid</code> thì không ghép được. Mọi dòng phải có mã, và
      nên có cấu trúc cố định.</div>

      $$6 \text{ dòng của } 2 \text{ yêu cầu, không } cid \Rightarrow \text{không
      biết dòng nào của ai}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Lỗi thứ nhất là ghi nhật ký văn bản tự do và không có mã tương quan. Hai
      yêu cầu xen kẽ thì không có mã nào để ghép các dòng lại.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Đặt
      nhãn <b class="red">user_id</b> hoặc mã giao dịch vào chỉ số. Nhãn chỉ để nhóm
      có ít giá trị, biết trước.</div>

      $$4 \times 100 + 1 = \hl{401}; \qquad 4 \times 10\,000 + 1 = \hl{40\,001} \text{
      chuỗi}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ hai: đặt mã người dùng hay mã giao dịch làm nhãn. Đo thật, một trăm
      giá trị thành bốn trăm linh một chuỗi, mười nghìn giá trị thành hơn bốn mươi
      nghìn.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc tải tăng).</b> Cảnh
      báo theo <b class="red">số tuyệt đối</b> (&gt; 50 lỗi mỗi phút). Đêm khuya 10
      lỗi mỗi phút có thể là toàn bộ yêu cầu mà không báo; giờ cao điểm 51 lỗi trong
      5 000 yêu cầu chỉ là 1% mà reo suốt. Dùng <b>tỉ lệ</b> hoặc tốc độ đốt.</div>

      $$\frac{51}{5\,000} = \hl{1\%}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ ba: cảnh báo theo số tuyệt đối. Đêm khuya, mười lỗi mỗi phút có
      thể là toàn bộ yêu cầu mà không ai được báo; giờ cao điểm, năm mươi mốt lỗi
      trong năm nghìn yêu cầu là một phần trăm. Hãy dùng tỉ lệ hoặc tốc độ đốt.'
  - show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm, lúc vận hành lâu dài).</b>
      <b class="red">Ghi dữ liệu nhạy cảm vào nhật ký</b> (số thẻ, mật khẩu, mã truy
      cập), và để cảnh báo <b class="red">không có việc để làm</b>. Nhật ký sống lâu
      và nhiều người đọc; mỗi cảnh báo phải kèm hướng xử lý.</div>

      <table class=''t''><tr><th>cảnh báo tốt</th><th>cảnh báo kém</th></tr><tr><td>tốc
      độ đốt &gt; 2 liên tục 2 phút; kèm cách xử lý</td><td>&ldquo;CPU cao&rdquo;
      không nói làm gì</td></tr></table>

      '
    clear: true
    say: 'Lỗi thứ tư: ghi số thẻ hay mật khẩu vào nhật ký sống lâu, và để cảnh báo
      không kèm việc phải làm.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l31_budget_min(0.995) == 216 and alg.bnx_l31_burn(0.02, 0.995) == 4 and
    alg.bnx_l31_days(4) == 7.5
  - 4 * 3 * 500 == 6000
  - 4 * 3 * 500000 == 6000000
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Mục
      tiêu 99,5% trong 30 ngày (43 200 phút). Ngân sách lỗi là bao nhiêu phút? Tỉ
      lệ lỗi hiện tại 2%: tốc độ đốt bao nhiêu, ngân sách cạn sau mấy ngày?</td></tr><tr><td>2</td><td>Chỉ
      số có nhãn route (4 giá trị), code (3 giá trị), và một nhãn thêm có 500 giá
      trị. Có bao nhiêu chuỗi?</td></tr><tr><td>3</td><td>Quyết định (số minh hoạ):
      đội muốn xem từng khách bị lỗi. Chọn: nhãn <code>user_id</code> trên chỉ số
      (500 000 khách), hay nhật ký có <code>cid</code> + <code>user_id</code>? Vì
      sao?</td></tr></table>'
    pause: 30
    say: Đến lượt bạn, ba câu làm ra giấy. Câu một tính ngân sách lỗi theo phút của
      mục tiêu chín mươi chín phẩy năm phần trăm, rồi tốc độ đốt và số ngày cạn khi
      lỗi hai phần trăm. Câu hai đếm số chuỗi của ba nhãn. Câu ba chọn giữa nhãn mã
      khách trên chỉ số và nhật ký có mã khách. Hãy dừng lại làm rồi xem đáp án.
  - show: '<p>Câu 1: ngân sách = 43 200 × 0,5% = 216 phút. Tốc độ đốt = 2% : 0,5%
      = 4; ngân sách 30 ngày cạn sau 30 : 4 = 7,5 ngày.</p>

      $$43\,200 \times 0{,}005 = \hlg{216}; \quad \frac{0{,}02}{0{,}005} = \hl{4};
      \quad \frac{30}{4} = \hlg{7{,}5} \text{ ngày}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu một, ngân sách là bốn mươi ba nghìn hai trăm nhân năm phần nghìn,
      bằng hai trăm mười sáu phút. Tốc độ đốt là hai phần trăm chia năm phần nghìn,
      bằng bốn, nên ngân sách cạn sau ba mươi chia bốn, tức bảy ngày rưỡi.
    clear: true
  - show: '<p>Câu 2: số chuỗi = tích số giá trị các nhãn.</p>

      $$4 \times 3 \times 500 = \hlg{6\,000} \text{ chuỗi}$$

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu hai, số chuỗi là tích số giá trị của các nhãn, bốn nhân ba nhân
      năm trăm bằng sáu nghìn chuỗi.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>nhãn
      <code>user_id</code> trên chỉ số</td><td>xem từng khách bằng biểu đồ</td><td>4
      × 3 × 500 000 = 6 000 000 chuỗi: Prometheus quá tải</td></tr><tr><td>nhật ký
      có <code>cid</code> + <code>user_id</code></td><td>tìm một khách qua chỉ mục,
      rẻ khi cần; dựng đường đi</td><td>mỗi truy vấn phải gõ; không có biểu đồ tổng
      quan sẵn</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    say: Đáp án câu ba, nhãn mã khách nhân số chuỗi lên sáu triệu, và hệ thu thập
      quá tải. Nhật ký có mã khách cho tìm một khách rẻ hơn, đổi lại không có biểu
      đồ tổng quan sẵn.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: dựng đường đi từ nhật ký và tính tốc độ đốt'
  steps:
