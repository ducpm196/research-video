      chạy truy vấn trên chuỗi ấy, vượt ngưỡng đủ lâu thì báo người trực. Hệ thu thập
      chạy thật từ một ảnh Docker.'
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ dòng nhật ký tới cảnh báo'
  checks:
  - alg.bnx_l31_path(alg.bnx_l31_demo(), 'a1') == (['cong:nhan', 'tt:tru-tien', 'sc:loi',
    'cong:tra'], 35)
  - alg.bnx_l31_ratio(30, 980 + 20 + 4990 + 10) == 0.005
  - alg.bnx_l31_burn(0.005, 0.999) == 5 and alg.bnx_l31_days(5) == 6
  steps:
  - show: '<p><b>Bước 1. Nhật ký có cấu trúc.</b> Dòng văn bản tự do <code>ERROR so-cai
      het gio giao dich a1</code> muốn lọc phải đoán bằng <b>biểu thức chính quy</b>,
      tức một mẫu chữ như &laquo;chữ ERROR rồi tên dịch vụ&raquo;. Mỗi dòng là một
      <b>đối tượng JSON</b>, tức các cặp <code>"tên":giá trị</code> trong ngoặc nhọn,
      thì máy lọc theo trường, không đoán.</p>

      <div class="box key"><code>{"t":1028,"dv":"sc","cid":"a1","ev":"loi","ma":"HET_GIO"}</code></div>

      '
    focus:
    - 1
    - 1
    - 2
    introduces:
    - bnx_bieu_thuc_chinh_quy
    clear: true
    say: Bước một là nhật ký có cấu trúc. Dòng văn bản tự do muốn lọc phải đoán bằng
      biểu thức chính quy, tức một mẫu chữ. Đối tượng JSON là các cặp tên và giá trị
      trong ngoặc nhọn, nên máy lọc thẳng theo trường.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th><th>ví dụ nhỏ</th></tr><tr><td><code>def
      ghi(dv, cid, ev, **them):</code></td><td><code>**them</code> gom mọi đối số
      có tên còn lại vào một từ điển tên <code>them</code></td><td><code>ghi("tt",
      "a1", "tru-tien", tien=500)</code> cho <code>them = {"tien": 500}</code></td></tr><tr><td><code>{"t":
      …, "ev": ev, **them}</code></td><td>dấu <code>**</code> trong ngoặc nhọn trải
      từ điển <code>them</code> thành từng cặp tên và giá trị</td><td><code>{"ev":
      "tru-tien", "tien": 500}</code></td></tr><tr><td><code>gio = iter(range(1000,
      2000, 7))</code>, <code>next(gio)</code></td><td><code>range(1000, 2000, 7)</code>:
      dãy 1000, 1007, 1014, … (bước 7); <code>iter</code> cho lấy từng giá trị; <code>next(gio)</code>
      lấy giá trị kế tiếp</td><td>1000, rồi 1007, rồi 1014</td></tr><tr><td><code>nhat_ky
      = []</code>, <code>nhat_ky.append({…})</code></td><td>danh sách rỗng; <code>append</code>
      thêm một phần tử vào cuối</td><td>sau 6 lệnh ghi có 6 phần tử</td></tr></table>'
    clear: true
    say: Trước khi đọc hàm ghi, nên ta xem cách viết. Hai dấu sao gom các đối số có
      tên còn lại vào một từ điển, và trong ngoặc nhọn thì trải nó ra. Giờ giả đếm
      từ một nghìn, bước bảy, mỗi lần lấy giá trị kế tiếp.
  - show: '<p><b>Bước 2. Mã tương quan.</b> Cổng đặt <code>cid</code> cho mỗi yêu
      cầu; mọi dịch vụ chép nó vào <b>mọi</b> dòng. Lọc theo <code>cid</code> là gom
      lại đường đi.</p><p><b>NhatKy.py (trích): mọi dòng mang cid</b></p><div class="code"><div>def
      ghi(dv, cid, ev, **them):</div><div>    nhat_ky.append({"t": next(gio), "dv":
      dv, "cid": cid, "ev": ev, **them})</div><div>ghi("cong", "a1", "nhan", duong="/chuyen")</div><div>ghi("cong",
      "b2", "nhan", duong="/so-du")</div><div>ghi("tt", "a1", "tru-tien", tien=500)</div></div>$$\text{lọc
      } cid = a1 \Rightarrow \text{cong} \to \text{tt} \to \text{sc} \to \text{cong}$$'
    focus:
    - - 1
      - 3
    clear: true
    say: Bước hai là mã tương quan, cổng đặt một mã cho mỗi yêu cầu, và mọi dịch vụ
      chép mã ấy vào mọi dòng, nên lọc theo mã là gom lại đúng đường đi.
    introduces:
    - implies
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>[(DV[i
      % 5], "ERROR" if i % 1000 in (7, 8) else "INFO") for i in range(n)]</code></td><td>danh
      sách sinh sẵn: với <code>i</code> từ 0 tới n−1 tạo một cặp (dịch vụ, mức); <code>i
      % 5</code> là phần dư; mức là ERROR khi <code>i % 1000</code> là 7 hoặc 8, không
      thì INFO</td></tr><tr><td><code>for i, (dv, muc) in enumerate(dong):</code></td><td>duyệt
      kèm số thứ tự <code>i</code> và tách cặp thành <code>dv</code>, <code>muc</code></td></tr><tr><td><code>chi_muc.setdefault(muc,
      []).append(i)</code></td><td>từ điển: khoá <code>muc</code> chưa có thì đặt
      danh sách rỗng; rồi thêm <code>i</code> vào danh sách của khoá</td></tr><tr><td><code>set(chi_muc["sc"])</code>,
      <code>[i for i in a if i in b]</code></td><td><code>set</code>: tập hợp, tra
      có hay không rất nhanh; câu sau giữ các <code>i</code> của <code>a</code> cũng
      nằm trong <code>b</code></td></tr></table>'
    clear: true
    say: Bốn chỗ này nên đọc trước, tạo cặp dịch vụ và mức cho mỗi dòng; mức lỗi khi
      chỉ số dư bảy hoặc tám. Duyệt kèm số thứ tự, tách cặp thành hai biến. Khoá chưa
      có thì đặt danh sách rỗng, rồi thêm số dòng. Tập hợp tra nhanh, và lọc các số
      dòng nằm ở cả hai nơi.
  - show: '<p><b>Bước 3. Chỉ mục đảo.</b> Thay vì đọc từng dòng, ta lập sẵn bảng <b>từ
      → danh sách số dòng</b>. Tìm ERROR là tra một mục của bảng, không quét cả nhật
      ký.</p><p><b>ChiMuc.py (phần 1): dựng chỉ mục rồi tra ERROR</b></p><div class="code"><div>DV
      = ["cong", "tt", "sc", "kh", "tb"]</div><div>for n in (1000, 1000000):</div><div>    dong
      = [(DV[i % 5], "ERROR" if i % 1000 in (7, 8) else "INFO")</div><div>            for
      i in range(n)]</div><div>    chi_muc = {}</div><div>    for i, (dv, muc) in
      enumerate(dong):</div><div>        chi_muc.setdefault(muc, []).append(i)</div><div>        chi_muc.setdefault(dv,
      []).append(i)</div><div>    a, b = chi_muc["ERROR"], set(chi_muc["sc"])</div><div>    khop
      = [i for i in a if i in b]</div></div>'
    focus:
    - - 1
      - 2
    clear: true
    say: Bước ba là chỉ mục đảo, thay vì đọc từng dòng, ta lập sẵn bảng từ trỏ tới
      danh sách số dòng chứa từ ấy, nên tìm chữ lỗi chỉ là tra một mục.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>int
      nguoi = Integer.parseInt(a[0]);</code></td><td><code>a[0]</code> là chuỗi gõ
      kèm đầu tiên; <code>parseInt</code> đổi chuỗi thành số nguyên</td></tr><tr><td><code>String[]
      duong = {…};</code>, <code>int[][] so = {{980, 20}, {4990, 10}};</code></td><td>mảng
      chuỗi; mảng hai chiều: <code>so[d][c]</code> là hàng d, cột c</td></tr><tr><td><code>StringBuilder
      s = new StringBuilder();</code>, <code>s.append("…\n");</code></td><td>bộ dựng
      chuỗi: <code>append</code> nối thêm vào cuối; <code>\n</code> là xuống dòng</td></tr></table>'
    clear: true
    say: Ba chỗ này nên đọc trước, đổi chuỗi gõ kèm đầu tiên thành số nguyên. Mảng
      chuỗi, và mảng hai chiều chọn ô bằng hai chỉ số. Bộ dựng chuỗi nối thêm vào
      cuối; gạch ngược rồi chữ n là xuống dòng.
  - show: '<p><b>Bước 4. Chỉ số = tên + nhãn + giá trị.</b> Ứng dụng phơi ra một trang
      văn bản; ở đây một chương trình Java nhỏ in trang ấy (tham số: số giá trị của
      nhãn <code>user</code>).</p><p><b>XuatChiSo.java (1/2): chuẩn bị số liệu và
      dòng chú thích</b></p><div class="code"><div>public class XuatChiSo {</div><div>  public
      static void main(String[] a) {</div><div>    int nguoi = Integer.parseInt(a[0]);       //
      0 = khong gan nhan user</div><div>    String[] duong = {"/chuyen", "/so-du"};</div><div>    String[]
      ma = {"200", "500"};</div><div>    int[][] so = {{980, 20}, {4990, 10}};</div><div>    StringBuilder
      s = new StringBuilder();</div><div>    s.append("# HELP http_requests_total
      So yeu cau da nhan.\n");</div><div>    s.append("# TYPE http_requests_total
      counter\n");</div><div>    for (int d = 0; d &lt; 2; d++)</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước bốn là chỉ số gồm tên, nhãn và giá trị. Ứng dụng phơi ra một trang văn
      bản, nên chương trình Java nhỏ này in trang ấy; số đầu vào là số giá trị của
      nhãn người dùng.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>for
      (int d = 0; d &lt; 2; d++) for (int c = 0; c &lt; 2; c++) { … }</code></td><td>hai
      vòng đếm lồng nhau: mỗi tổ hợp (d, c) là một lần chạy thân</td></tr><tr><td><code>"route=\""
      + duong[d] + "\",code=\"" + ma[c] + "\""</code></td><td><code>\"</code> trong
      chuỗi là một dấu nháy kép thật; <code>+</code> nối các phần thành <code>route="/chuyen",code="200"</code></td></tr><tr><td><code>if
      (nguoi == 0) … else for (int u = 1; u &lt;= nguoi; u++)</code></td><td><code>==</code>
      so sánh bằng; <code>nguoi</code> bằng 0 thì in một dòng, không thì lặp <code>u</code>
      từ 1 tới <code>nguoi</code>, mỗi lần một dòng nhãn user</td></tr></table>'
    clear: true
    say: Hai vòng đếm lồng nhau, nên mỗi tổ hợp là một lần chạy. Gạch ngược trước
      nháy đặt nháy thật vào chuỗi; dấu cộng nối các phần. Hai dấu bằng so sánh; không
      người dùng thì một dòng, có thì lặp từng người.
  - show: '<p><b>Bước 4 (tiếp).</b> Mỗi tổ hợp nhãn là một <b>chuỗi</b> riêng, in
      thành một dòng.</p><p><b>XuatChiSo.java (2/2): mỗi tổ hợp nhãn một dòng</b></p><div
      class="code"><div>      for (int c = 0; c &lt; 2; c++) {</div><div>        String
      nhan = "route=\"" + duong[d] + "\",code=\"" + ma[c] + "\"";</div><div>        if
      (nguoi == 0)</div><div>          s.append("http_requests_total{" + nhan + "}
      " + so[d][c] + "\n");</div><div>        else</div><div>          for (int u
      = 1; u &lt;= nguoi; u++)</div><div>            s.append("http_requests_total{"
      + nhan + ",user=\"u" + u + "\"} 1\n");</div><div>      }</div><div>    s.append("#
      TYPE dang_xu_ly gauge\ndang_xu_ly 3\n");</div><div>    System.out.print(s);</div><div>  }</div><div>}</div></div>'
    clear: true
    say: Hai đường dẫn nhân hai mã trả lời cho bốn tổ hợp nhãn, nên có bốn dòng.
  - show: <p><b>Bước 4 (kết quả).</b> Bộ đếm chỉ tăng; số đang xử lý lên xuống.</p><p><b>Văn
      bản chỉ số thật do XuatChiSo.java in ra (2 route × 2 mã = 4 chuỗi + 1 chuỗi
      đo mức)</b></p><div class="code"><div># HELP http_requests_total So yeu cau
      da nhan.</div><div># TYPE http_requests_total counter</div><div>http_requests_total{route="/chuyen",code="200"}
      980</div><div>http_requests_total{route="/chuyen",code="500"} 20</div><div>http_requests_total{route="/so-du",code="200"}
      4990</div><div>http_requests_total{route="/so-du",code="500"} 10</div><div>#
      TYPE dang_xu_ly gauge</div><div>dang_xu_ly 3</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Mỗi tổ hợp nhãn là một chuỗi riêng, nên có bốn chuỗi, cộng một chuỗi đo mức.
      Bộ đếm chỉ tăng, còn số đang xử lý lên xuống nên gọi là đồng hồ đo.
  - show: <p><b>Bước 5. Truy vấn.</b> Tỉ lệ lỗi = tổng yêu cầu mã 5xx chia tổng yêu
      cầu; vì bộ đếm chỉ tăng nên dùng <b>tốc độ</b> (<code>rate</code>) để nói về
      hiện tại.</p>$$\frac{30}{980 + 20 + 4990 + 10} = \frac{30}{6000} = \hl{0{,}005}$$
    focus:
    - - 1
    - 2
    clear: true
    say: Bước năm là truy vấn, tỉ lệ lỗi là tổng yêu cầu mã năm trăm chia tổng yêu
      cầu, tức năm phần nghìn. Vì bộ đếm chỉ tăng, nói về hiện tại thì dùng tốc độ
      trên một cửa sổ.
  - show: <p><b>Bước 6. Ngân sách lỗi.</b> Mục tiêu 99,9% nghĩa là cho phép lỗi <b>0,1%</b>.
      <b>Tốc độ đốt</b> = tỉ lệ lỗi hiện tại chia ngân sách; bằng 1 là đốt vừa hết
      ngân sách cuối kỳ.</p>$$\text{tốc độ đốt} = \frac{0{,}005}{1 - 0{,}999} = \hl{5};
      \qquad \frac{30 \text{ ngày}}{5} = \hlg{6} \text{ ngày}$$
    focus:
    - - 1
    - 2
    clear: true
    say: Bước sáu là ngân sách lỗi, mục tiêu chín mươi chín phẩy chín phần trăm nghĩa
      là cho phép lỗi một phần nghìn. Tốc độ đốt là tỉ lệ lỗi chia ngân sách đó, ở
      đây là năm nên ngân sách ba mươi ngày cạn sau sáu ngày.
- id: example
  kind: example
  title: Ví dụ chạy thật, từng phép tính
  checks:
  - alg.bnx_l31_path(alg.bnx_l31_demo(), 'a1')[1] == 1035 - 1000
  - alg.bnx_l31_burn(5 / (995 + 5), 0.999) == 5
  - alg.bnx_l31_days(alg.bnx_l31_burn(0.005, 0.999)) == 6
  steps:
  - show: '<p><b>Chạy thật: NhatKy.py (Python, đồng hồ giả)</b></p><div class="code"><div>import
      json</div><div>gio = iter(range(1000, 2000, 7))              # dong ho gia,
      mili giay</div><div>nhat_ky = []</div><div>def ghi(dv, cid, ev, **them):</div><div>    nhat_ky.append({"t":
      next(gio), "dv": dv, "cid": cid, "ev": ev, **them})</div><div>ghi("cong", "a1",
      "nhan", duong="/chuyen")</div><div>ghi("cong", "b2", "nhan", duong="/so-du")</div><div>ghi("tt",
      "a1", "tru-tien", tien=500)</div><div>ghi("tt", "b2", "doc-so-du")</div><div>ghi("sc",
      "a1", "loi", ma="HET_GIO")</div><div>ghi("cong", "a1", "tra", http=504)</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta chạy thật bằng Python với đồng hồ giả, nên chạy lại ra đúng kết quả cũ.
      Sáu lệnh ghi cho hai yêu cầu xen kẽ qua ba dịch vụ.
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>import
      json</code>, <code>json.dumps(d, separators=(",", ":"))</code></td><td>nạp thư
      viện JSON; <code>dumps</code> đổi từ điển <code>d</code> thành một dòng chuỗi
      JSON; <code>separators</code> bỏ dấu cách thừa</td></tr><tr><td><code>for d
      in nhat_ky:</code></td><td>mỗi vòng <code>d</code> là một sự kiện của danh sách,
      theo thứ tự</td></tr></table>
    clear: true
    say: Đổi từ điển thành một dòng chuỗi JSON gọn, mỗi vòng, biến nhận một sự kiện.
  - show: '<p><b>NhatKy.py (tiếp): in từng dòng JSON</b></p><div class="code"><div>for
      d in nhat_ky:</div><div>    print(json.dumps(d, separators=(",", ":")))</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>{"t":1000,"dv":"cong","cid":"a1","ev":"nhan","duong":"/chuyen"}</div><div>{"t":1007,"dv":"cong","cid":"b2","ev":"nhan","duong":"/so-du"}</div><div>{"t":1014,"dv":"tt","cid":"a1","ev":"tru-tien","tien":500}</div><div>{"t":1021,"dv":"tt","cid":"b2","ev":"doc-so-du"}</div><div>{"t":1028,"dv":"sc","cid":"a1","ev":"loi","ma":"HET_GIO"}</div><div>{"t":1035,"dv":"cong","cid":"a1","ev":"tra","http":504}</div></div>$$①
      \; \text{6 dòng, mỗi dòng một đối tượng JSON; hai yêu cầu xen kẽ}$$'
    clear: true
    say: 'Phép tính thứ nhất: sáu lệnh ghi cho sáu dòng JSON, và hai yêu cầu xen kẽ
      nên đọc từ trên xuống không thấy câu chuyện nào.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>a1
      = [d for d in nhat_ky if d["cid"] == "a1"]</code></td><td>danh sách sinh sẵn
      có điều kiện: giữ sự kiện <code>d</code> có <code>cid</code> bằng <code>"a1"</code></td></tr><tr><td><code>"
      &gt; ".join(d["dv"] + ":" + d["ev"] for d in a1)</code></td><td>nối các chuỗi
      <code>dv:ev</code> của từng sự kiện, đặt <code> &gt; </code> ở giữa</td></tr><tr><td><code>a1[-1]["t"]
      - a1[0]["t"]</code></td><td><code>[-1]</code> là phần tử cuối, <code>[0]</code>
      là phần tử đầu: giờ cuối trừ giờ đầu</td></tr></table>'
    clear: true
    say: Giữ các sự kiện có mã tương quan bằng a một. Nối chuỗi từng dòng, đặt mũi
      tên ở giữa. Phần tử cuối trừ phần tử đầu ra thời gian mất.
