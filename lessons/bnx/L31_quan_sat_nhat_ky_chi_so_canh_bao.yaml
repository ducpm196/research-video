scenes:
- id: hook
  kind: hook
  title: 'Hai giờ sáng: tìm một yêu cầu trong một triệu dòng nhật ký'
  checks:
  - alg.bnx_l31_index(1000000)[:2] == (1000, 2000)
  steps:
  - show: '<p>Khách báo chuyển tiền bị treo lúc 2 giờ sáng. Yêu cầu đi qua <b>ba lớp</b>
      (cổng, thanh toán, sổ cái); nhật ký dài <b>1 000 000</b> dòng mỗi ngày (số minh
      hoạ).</p>

      <div class="box key">Tìm bằng cách <b>đọc hết</b>: xem <b>1 000 000</b> dòng.
      Tìm bằng <b>chỉ mục</b>: chỉ xem <b>2 000</b> dòng có chữ ERROR. Và một <b>mã
      tương quan</b> nối ba lớp thành một đường đi.

      Làm sao có được điều đó, và làm sao biết sự cố trước khi khách gọi?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, khách báo chuyển tiền bị treo lúc hai giờ sáng. Nhật ký dài một
      triệu dòng mỗi ngày. Đọc hết thì xem một triệu dòng, dùng chỉ mục thì chỉ xem
      hai nghìn dòng có chữ lỗi. Làm sao có được điều đó, và biết sự cố trước khi
      khách gọi?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>nhật
      ký thế nào thì tìm được</td><td><b>có cấu trúc</b> (mỗi dòng gồm các cặp tên
      và giá trị) và có <b>mã tương quan</b> (<code>cid</code>)</td></tr><tr><td>tìm
      trong hàng triệu dòng</td><td><b>chỉ mục đảo</b>: ý tưởng của bộ ba ELK (Elasticsearch,
      Logstash, Kibana)</td></tr><tr><td>biết sức khoẻ hệ thống</td><td><b>chỉ số</b>
      có <b>nhãn</b> (Prometheus), vẽ bằng Grafana</td></tr><tr><td>biết trước khi
      khách gọi</td><td><b>cảnh báo</b> theo ngưỡng và theo <b>ngân sách lỗi</b></td></tr></table>'
    clear: true
    say: Hôm nay ta trả lời bốn câu, nhật ký có cấu trúc và mã tương quan, chỉ mục
      đảo để tìm nhanh. Chỉ số có nhãn cho biết sức khoẻ, cảnh báo cho biết trước
      khi khách gọi.
- id: prereq
  kind: prereq
  title: 'Trước hết: sáu điều cần hiểu'
  checks:
  - round(995 / 60, 1) == 16.6
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      nhật ký (log)</td><td>văn bản ghi lại điều đã xảy ra, mỗi sự việc một dòng</td><td><code>cong
      nhan /chuyen</code></td></tr><tr><td>② một yêu cầu qua nhiều dịch vụ</td><td>mỗi
      dịch vụ ghi nhật ký riêng, trên máy riêng</td><td>cổng → thanh toán → sổ cái</td></tr><tr><td>③
      chỉ số (metric)</td><td>con số đo theo thời gian: đếm, đo mức</td><td>số yêu
      cầu lỗi: 30</td></tr><tr><td>④ nhãn (label)</td><td>cặp tên=giá trị gắn vào
      chỉ số để chia nhóm</td><td><code>code=&quot;500&quot;</code></td></tr><tr><td>⑤
      bộ đếm chỉ tăng</td><td>số chỉ tăng; <b>tốc độ</b> = phần tăng chia thời gian</td><td>+995
      mỗi phút ≈ 16,6/giây</td></tr><tr><td>⑥ ngưỡng</td><td>mức mà vượt qua thì người
      trực được báo</td><td>tỉ lệ lỗi &gt; 5%</td></tr></table>'
    say: Trước hết ta cần hiểu sáu điều, nhật ký ghi điều đã xảy ra, mỗi sự việc một
      dòng. Một yêu cầu đi qua nhiều dịch vụ, mỗi dịch vụ ghi nhật ký riêng. Chỉ số
      là con số đo theo thời gian. Nhãn là cặp tên và giá trị gắn vào chỉ số. Bộ đếm
      chỉ tăng, và tốc độ là phần tăng chia cho thời gian. Ngưỡng là mức vượt qua
      thì người trực được báo.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l31_ratio(30, 6000) == 0.005
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>cid</code></td><td>mã
      tương quan: cùng một giá trị trên mọi dòng nhật ký của một yêu cầu</td></tr><tr><td>ELK</td><td>Elasticsearch
      (lưu, lập chỉ mục) + Logstash (thu thập) + Kibana (xem); Elastic Stack còn có
      Beats</td></tr><tr><td><code>http_requests_total{code=&quot;500&quot;}</code></td><td>tên
      chỉ số, rồi nhãn trong ngoặc nhọn: các yêu cầu mã 500</td></tr><tr><td><code>rate(x[5m])</code></td><td>tốc
      độ tăng mỗi giây của <code>x</code> trên cửa sổ 5 phút; viết bằng <b>PromQL</b>,
      ngôn ngữ truy vấn của Prometheus</td></tr><tr><td><code>sum(…)</code></td><td>cộng
      các chuỗi lại thành một số</td></tr><tr><td><code>for: 2m</code></td><td>điều
      kiện phải đúng liên tục 2 phút thì cảnh báo mới bắn</td></tr></table>'
    say: Mã tương quan là cùng một giá trị trên mọi dòng của một yêu cầu. Bộ ba nhật
      ký gồm nơi lưu và lập chỉ mục, công cụ thu thập và giao diện xem. Tên chỉ số
      theo sau là các nhãn. Hàm tốc độ cho số tăng mỗi giây trên cửa sổ năm phút.
      Hàm tổng cộng các chuỗi lại, và điều kiện đúng liên tục hai phút thì cảnh báo
      mới bắn.
