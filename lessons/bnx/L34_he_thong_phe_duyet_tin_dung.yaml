      Khách đang nợ 350, xin thêm 200. Ai duyệt? Nếu chỉ xét 200 thì ai, và sai ở
      đâu?</td></tr><tr><td>2</td><td>Đồng ý của khách hết hạn ngày 2026-03-31, chưa
      thu hồi, đúng mục đích. Tra cứu ngày 2026-03-31 và ngày 2026-04-01: kết quả
      mỗi ngày? Điều kiện so sánh là <code>het_han >= ngay</code>.</td></tr><tr><td>3</td><td>Bảng
      lịch sử 2 triệu dòng, mỗi lần duyệt tra theo khách. Chọn: thêm chỉ mục theo
      mã khách, hay sao chép sang <b>kho đọc</b> (bản sao chỉ để đọc, đặt ở máy khác),
      hay lưu kết quả tra trong bộ đệm một ngày? Vì sao?</td></tr></table>'
    introduces:
