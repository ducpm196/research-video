- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: dựng lại trạng thái từ nhật ký'
  checks:
  - alg.bnx_l34_hop_le('DA_DUYET', 'GIAI_NGAN')
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th><th>ví dụ nhỏ</th></tr><tr><td><code>sum(1
      for x in log if …)</code></td><td>đếm các phần tử thoả điều kiện: mỗi phần tử
      đúng cộng 1</td><td><code>sum(1 for x in [3, 8, 9] if x &gt; 5)</code> cho <code>2</code></td></tr><tr><td><code>log[1:]</code></td><td>danh
      sách bỏ phần tử đầu</td><td><code>[1, 2, 3][1:]</code> là <code>[2, 3]</code></td></tr><tr><td><code>zip(log,
      log[1:])</code></td><td>ghép mỗi dòng với dòng kế tiếp</td><td><code>zip([1,
      2, 3], [2, 3])</code> cho <code>(1, 2)</code>, <code>(2, 3)</code></td></tr><tr><td><code>DUOC.get(tu,
      set())</code></td><td>tra từ điển; không có khoá thì trả tập rỗng</td><td><code>{''a'':
      1}.get(''b'', 0)</code> cho <code>0</code></td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.4'
    - '1.5'
    clear: true
    say: Hàm kiểm dùng vài cách viết mới mà ta cần đọc trước. Hàm tổng cộng một cho
      mỗi phần tử đúng điều kiện, tức là phép đếm. Hàm ghép đôi đưa mỗi dòng nhật
      ký đi cùng dòng kế tiếp. Hàm tra từ điển có giá trị mặc định khi thiếu khoá.
  - show: '<p><b>KiemNhatKy.py: kiểm bằng từ điển, không dùng bảng</b></p><div class="code"><div>def
      canh_sai(log):</div><div>    return sum(1 for tu, den in log if den not in DUOC.get(tu,
      set()))</div><div> </div><div> </div><div>def cho_dut(log):</div><div>    return
      sum(1 for a, b in zip(log, log[1:]) if a[1] != b[0])</div><div> </div><div>
      </div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Ta kiểm bằng đường khác: dựng lại từ chính nhật ký năm dòng, không hỏi cơ
      sở dữ liệu. Hàm thứ nhất đếm cạnh sai theo từ điển luật. Hàm thứ hai đếm chỗ
      đứt, tức dòng sau không bắt đầu từ nơi dòng trước kết thúc.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>canh sai trong nhat
      ky: 0</div><div>cho dut: 0 ; trang thai dung lai: GIAI_NGAN</div><div>xoa dong
      3: 1 cho dut</div></div><table class=''t''><tr><th>cách</th><th>kết luận</th></tr><tr><td>bảng
      luật trong cơ sở dữ liệu</td><td>5 chuyển hợp lệ, 2 bị chặn</td></tr><tr><td>từ
      điển luật + dựng lại từ nhật ký</td><td>0 cạnh sai, 0 chỗ đứt, kết thúc GIAI_NGAN</td></tr><tr><td>xoá
      thử một dòng</td><td>1 chỗ đứt: nhật ký bị sửa là lộ</td></tr></table>'
    focus:
    - '3.3'
    - '3.4'
    clear: true
    say: 'Kết quả khớp: không cạnh sai, không chỗ đứt, dựng lại ra giải ngân. Xoá
      thử dòng thứ ba thì có một chỗ đứt, nên ai sửa nhật ký là bị lộ.'
- id: quymo
  kind: example
  title: 'Khi lịch sử lớn dần: số dòng phải đọc mỗi lần tra'
  checks:
  - alg.bnx_l34_doc(1000, False) == 1000 and alg.bnx_l34_doc(1000000, False) == 1000000
  - alg.bnx_l34_doc(1000, True) == 5 == alg.bnx_l34_doc(1000000, True)
  - 1000 * 10 ** 6 == 10 ** 9
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th><th>ví dụ nhỏ</th></tr><tr><td><code>global
      dem</code></td><td>cho hàm sửa biến <code>dem</code> nằm ngoài hàm, thay vì
      tạo biến mới</td><td>mỗi lần gọi <code>tick()</code>, <code>dem</code> tăng
      1</td></tr><tr><td><code>create_function("tick", 0, tick)</code></td><td>đăng
      ký hàm Python để câu SQL gọi được <code>tick()</code></td><td>mỗi dòng SQL đọc
      là một lần gọi</td></tr><tr><td><code>i // 5</code>, <code>i % 5</code></td><td>chia
      lấy phần nguyên, chia lấy phần dư</td><td><code>7 // 5</code> là 1, <code>7
      % 5</code> là 2</td></tr><tr><td><code>(… for i in range(n))</code></td><td>sinh
      lần lượt n bộ giá trị, i chạy từ 0</td><td><code>i // 5</code> là mã khách:
      mỗi khách đúng 5 dòng</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Bài đo này dùng vài cách viết mới. Từ khoá khai báo biến ngoài cho phép hàm
      sửa biến nằm ngoài hàm. Ta đăng ký hàm Python để câu SQL gọi, mỗi dòng đọc là
      một lần gọi. Chia lấy phần nguyên và phần dư cho ra mã khách và tháng, nên mỗi
      khách có đúng năm dòng.
  - show: '<p>Đo bằng hàm <code>tick()</code>: cơ sở dữ liệu gọi nó mỗi lần đọc một
      dòng của bảng <code>ls</code>.</p><p><b>QuyMoTraCuu.py (1/2): hàm đếm dòng đọc
      và câu hỏi</b></p><div class="code"><div>import sqlite3</div><div>dem = 0</div><div>def
      tick():</div><div>    global dem</div><div>    dem += 1</div><div>    return
      1</div><div>SQL = "SELECT COUNT(*) FROM ls WHERE tick() AND khach = 7"</div><div>for
      n in (1000, 1000000):</div><div>    db = sqlite3.connect(":memory:")</div><div>    db.create_function("tick",
      0, tick)</div></div>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là số đo thật, hàm đếm được gắn vào câu SQL, nên cơ sở dữ liệu gọi nó
      mỗi lần đọc một dòng. Câu hỏi là đếm các dòng của khách bảy.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>CREATE
      TABLE ls (khach INT, thang INT, nhom INT)</code></td><td>tạo bảng <code>ls</code>
      với ba cột, mỗi cột có kiểu số nguyên</td></tr><tr><td><code>CREATE INDEX ix
      ON ls (khach)</code></td><td>tạo <b>chỉ mục</b> tên <code>ix</code> trên cột
      <code>khach</code>: bảng phụ để tìm dòng theo khách mà không đọc cả bảng</td></tr><tr><td><code>EXPLAIN
      QUERY PLAN … .fetchone()[3]</code></td><td>hỏi kế hoạch thực hiện câu SQL thay
      vì chạy nó; <code>[3]</code> lấy cột thứ tư của dòng kế hoạch, là câu mô tả</td></tr><tr><td><code>kh.split()[0]</code></td><td>cắt
      chuỗi <code>kh</code> ở khoảng trắng; <code>[0]</code> lấy từ đầu: <code>SCAN</code>
      (quét cả bảng) hoặc <code>SEARCH</code> (tìm qua chỉ mục)</td></tr></table>'
    clear: true
    say: 'Mã đo có bốn chỗ mới, tạo bảng với ba cột số nguyên. Tạo chỉ mục trên cột
      khách để tìm dòng nhanh. Hỏi kế hoạch thực hiện, và chỉ số ba lấy câu mô tả.
      Cắt chuỗi ở khoảng trắng, lấy từ đầu: quét hoặc tìm.'
  - show: '<p>Mỗi khách có 5 dòng. Chạy hai lần: chưa có, rồi có <b>chỉ mục</b> theo
      cột <code>khach</code>; <code>EXPLAIN QUERY PLAN</code> hỏi kế hoạch của cơ
      sở dữ liệu.</p><p><b>QuyMoTraCuu.py (2/2): bảng 1 000 và 1 000 000 dòng; thêm
      chỉ mục</b></p><div class="code"><div>    db.execute("CREATE TABLE ls (khach
      INT, thang INT, nhom INT)")</div><div>    db.executemany("INSERT INTO ls VALUES
      (?, ?, ?)",</div><div>                   ((i // 5, i % 5, i % 3) for i in range(n)))</div><div>    kq
      = []</div><div>    for co_chi_muc in (False, True):</div><div>        if co_chi_muc:</div><div>            db.execute("CREATE
      INDEX ix ON ls (khach)")</div><div>        kh = db.execute("EXPLAIN QUERY PLAN
      " + SQL).fetchone()[3]</div><div>        dem = 0</div><div>        db.execute(SQL).fetchone()</div><div>        kq.append(f"{kh.split()[0]}
      doc {dem}")</div><div>    print(f"{n} dong: khong chi muc {kq[0]}; co chi muc
      {kq[1]}")</div></div>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: 'Mỗi khách có năm dòng, ta chạy câu hỏi hai lần: chưa có chỉ mục, rồi có
      chỉ mục theo cột khách. Kế hoạch của cơ sở dữ liệu cho biết nó quét cả bảng
      hay tìm qua chỉ mục.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1000 dong: khong
      chi muc SCAN doc 1000; co chi muc SEARCH doc 5</div><div>1000000 dong: khong
      chi muc SCAN doc 1000000; co chi muc SEARCH doc 5</div></div>$$10^3 \to 10^6
      \text{ dòng: không chỉ mục } \hl{1\,000} \to \hl{1\,000\,000}; \; \text{có chỉ
      mục } \hl{5} \to \hl{5}$$'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bảng một nghìn dòng: không chỉ mục đọc cả một nghìn, có chỉ mục đọc năm
      dòng. Bảng một triệu dòng, gấp một nghìn lần: không chỉ mục đọc cả một triệu,
      có chỉ mục vẫn năm dòng.'
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>không
      chỉ mục</td><td>đơn giản, ghi nhanh</td><td>1 000 hồ sơ mỗi ngày × 10⁶ dòng
      = 10⁹ dòng đọc mỗi ngày</td></tr><tr><td>chỉ mục theo mã khách</td><td>mỗi lần
      tra đọc 5 dòng, gần như không đổi theo cỡ bảng</td><td>tốn chỗ và làm ghi chậm
      hơn một chút</td></tr><tr><td>lưu kết quả tra trong <b>bộ đệm</b> (nơi giữ sẵn
      kết quả đã tra)</td><td>nhanh hơn nữa</td><td>khách thu hồi đồng ý mà bộ đệm
      vẫn trả: <b>vi phạm đồng ý</b></td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Bảng này là lựa chọn của người làm nghề. Không chỉ mục thì một nghìn hồ sơ
      mỗi ngày đọc một tỉ dòng. Chỉ mục giữ năm dòng mỗi lần, đổi lại tốn chỗ. Bộ
      đệm giữ sẵn kết quả đã tra, nhưng khách thu hồi đồng ý mà bộ đệm vẫn trả thì
      vi phạm đồng ý.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_l34_nguoi_duyet('CN', 90, 90)[1] == 'truong phong'
  - alg.bnx_l34_doc(1000000, False) == 10 ** 6
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Xét quyền <b class="red">từng
      hồ sơ riêng lẻ</b>: ba hồ sơ 90 triệu đều lọt qua chuyên viên. Phải tính trên
      <b>tổng dư nợ</b>: hồ sơ thứ hai đã cần trưởng phòng.</div>'
    clear: true
    say: Lỗi thứ nhất, của người mới, là xét quyền từng hồ sơ riêng lẻ, nên ba hồ
      sơ chín mươi triệu đều lọt qua chuyên viên, phải tính trên tổng dư nợ.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Hai
      người cùng thấy <code>CHO_DUYET</code> rồi cùng ghi <b class="red">không điều
      kiện</b>: cả hai &laquo;thành công&raquo;, nhật ký ghi hai lần duyệt. Ghi kèm
      điều kiện trạng thái cũ: chỉ một người thành công (bài <b>mô phỏng</b> bằng
      hai lần ghi nối tiếp). <code>sql += …</code> nối thêm vế điều kiện vào cuối
      câu SQL.</div><p><b>HaiNguoiCungDuyet.py (trích): thêm điều kiện nối vào câu
      SQL</b></p><div class="code"><div>        sql = "UPDATE ho_so SET tt = ''DA_DUYET''
      WHERE id = 1"</div><div>        if co_dieu_kien:</div><div>            sql +=
      " AND tt = ''CHO_DUYET''"</div><div>        ok = db.execute(sql).rowcount</div><div>        kq.append(ai
      + (" thanh cong" if ok else " bi tu choi"))</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ hai, của người đã đi làm, lộ ra lúc mới dựng: hai người cùng thấy
      hồ sơ chờ duyệt rồi cùng ghi không điều kiện, nên cả hai thành công. Bản có
      điều kiện nối thêm vế đòi trạng thái cũ vẫn là chờ duyệt, và số dòng bị đổi
      cho biết ai thắng.'
  - show: '<p><b>Kết quả chạy thật — MÔ PHỎNG: hai lần ghi nối tiếp trên một kết nối,
      không phải hai người thật</b></p><div class="code"><div>khong dieu kien: an
      thanh cong, binh thanh cong</div><div>co dieu kien: an thanh cong, binh bi tu
      choi</div></div><p><code>rowcount</code> là số dòng câu lệnh vừa đổi: 1 là thành
      công, 0 là điều kiện không còn đúng nên người đến sau bị từ chối.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Đây là mô phỏng hai lần ghi nối tiếp. Bản không điều kiện cho cả hai thành
      công, còn bản có điều kiện chỉ người đầu thành công, vì lúc người sau ghi, trạng
      thái đã đổi.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc tải tăng).</b> Tra
      lịch sử theo khách mà <b class="red">không có chỉ mục</b>: nhỏ thì chạy tốt,
      rồi 10⁶ dòng và 1 000 hồ sơ mỗi ngày thành 10⁹ dòng đọc. Chạy thật: không chỉ
      mục đọc 1 000 000 dòng, có chỉ mục đọc 5.</div>'
    clear: true
    say: 'Lỗi thứ ba, lộ ra khi tải tăng: tra lịch sử theo khách mà không có chỉ mục.
