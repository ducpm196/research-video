scenes:
- id: hook
  kind: hook
  title: 'Hồ sơ 270 triệu chia thành ba hồ sơ 90 triệu: ai được duyệt?'
  checks:
  - alg.bnx_l34_nguoi_duyet('CN', 0, 90) == (90, 'chuyen vien')
  - alg.bnx_l34_nguoi_duyet('CN', 180, 90) == (270, 'truong phong')
  steps:
  - show: '<p>Một khách xin vay <b>270 triệu đồng</b> (số minh hoạ). Quy tắc minh
      hoạ: không quá 100 triệu thì <b>chuyên viên</b> duyệt được; trên 100 đến 500
      triệu cần <b>trưởng phòng</b>.

      Khách chia thành <b>ba hồ sơ 90 triệu</b>: xét riêng, cả ba lọt qua chuyên viên.</p>

      <div class="box key">Hệ thống phải chặn việc này thế nào? Khi nào được tra lịch
      sử tín dụng của khách? Và với <b>một triệu dòng</b> lịch sử, mỗi lần tra đọc
      bao nhiêu dòng?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, một khách xin vay hai trăm bảy mươi triệu đồng, số minh hoạ. Chuyên
      viên duyệt khoản không quá một trăm triệu, trên đó cần trưởng phòng. Khách chia
      thành ba hồ sơ chín mươi triệu nên cả ba lọt qua chuyên viên. Hệ thống chặn
      việc này thế nào, và với một triệu dòng lịch sử thì mỗi lần tra đọc bao nhiêu
      dòng?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>hồ
      sơ đi qua những bước nào</td><td>một <b>máy trạng thái</b>: bảng liệt kê các
      bước chuyển được phép; bước lạ bị chặn</td></tr><tr><td>ai có quyền duyệt</td><td>theo
      <b>tổng dư nợ</b> của khách (cũ + mới), và người duyệt khác người tạo</td></tr><tr><td>tra
      lịch sử tín dụng cần gì</td><td><b>đồng ý</b> của khách: đúng mục đích, còn
      hạn, chưa thu hồi; mọi lần tra có nhật ký</td></tr><tr><td>lịch sử lớn dần thì
      sao</td><td><b>chỉ mục</b> giữ số dòng đọc không đổi khi bảng lớn gấp nghìn
      lần</td></tr></table>'
    clear: true
    say: 'Bài này trả lời bốn câu: hồ sơ đi qua các bước nào, ai có quyền duyệt, tra
      lịch sử cần gì, và chỉ mục giúp gì khi lịch sử lớn dần.'
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - 180 + 90 == 270
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      hồ sơ vay</td><td>bộ thông tin một khách xin vay; đi qua nhiều bước, mỗi bước
      có người hoặc hệ thống phụ trách</td><td>khởi tạo → thẩm định → chấm điểm →
      duyệt → giải ngân</td></tr><tr><td>② trạng thái</td><td>nhãn cho biết hồ sơ
      đang ở bước nào; <b>chuyển trạng thái</b> là đổi nhãn</td><td><code>THAM_DINH</code>
      đổi thành <code>CHAM_DIEM</code></td></tr><tr><td>③ dư nợ</td><td>số tiền khách
      còn nợ; hạn mức duyệt tính trên dư nợ cộng khoản mới</td><td>đang nợ 180, xin
      thêm 90 → 270</td></tr><tr><td>④ lịch sử tín dụng</td><td>bản ghi vay và trả
      của khách; tóm thành <b>nhóm nợ</b> (bài dùng thang 1–5, số lớn là xấu hơn:
      số minh hoạ)</td><td>nhóm cao nhất trong 12 tháng</td></tr><tr><td>⑤ chỉ mục</td><td>bảng
      phụ giúp tìm dòng theo một cột mà không đọc cả bảng</td><td>tìm theo mã khách</td></tr></table>'
    say: Trước hết ta cần hiểu năm điều, hồ sơ vay đi qua nhiều bước, và trạng thái
      là nhãn cho biết hồ sơ ở bước nào. Hạn mức duyệt tính trên dư nợ cộng khoản
      mới. Lịch sử tín dụng tóm thành nhóm nợ, số lớn là xấu hơn. Chỉ mục là bảng
      phụ giúp tìm dòng mà không đọc cả bảng.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l34_hop_le('THAM_DINH', 'CHAM_DIEM')
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>cho_phep</code></td><td>bảng
      các cặp (từ, đến) được phép chuyển: <b>luật</b> của máy trạng thái</td></tr><tr><td><code>ho_so</code></td><td>mỗi
      dòng một hồ sơ: <code>id</code>, <code>loai</code> (<code>CN</code> cá nhân
      hay <code>DN</code> doanh nghiệp), <code>tt</code> (trạng thái hiện tại)</td></tr><tr><td><code>lich_su</code></td><td>nhật
      ký chuyển trạng thái: hồ sơ nào, từ đâu, đến đâu, ai làm</td></tr><tr><td><code>ls</code></td><td>lịch
      sử vay của khách: <code>khach</code>, <code>thang</code>, <code>nhom</code>
      (nhóm nợ)</td></tr><tr><td><code>dong_y</code></td><td>đồng ý của khách: <code>muc_dich</code>
      (để làm gì), <code>het_han</code> (ngày hết), <code>thu_hoi</code> (1 là đã
      rút lại)</td></tr><tr><td><code>nhat_ky</code></td><td>ghi mọi lần tra lịch
      sử: ai, khách nào, mục đích, ngày, kết quả</td></tr><tr><td><code>SCAN</code>,
      <code>SEARCH</code></td><td>kế hoạch của cơ sở dữ liệu: quét cả bảng, hay tìm
      một phần của bảng qua chỉ mục</td></tr></table>'
    say: Bảng này giải mã các tên trên màn hình. Bảng cho phép chứa luật của máy trạng
      thái, bảng hồ sơ có loại cá nhân hoặc doanh nghiệp và trạng thái hiện tại, bảng
      lịch sử ghi từng lần chuyển. Bảng đồng ý ghi mục đích, ngày hết hạn và cờ thu
      hồi. Hai chữ quét và tìm là kế hoạch của cơ sở dữ liệu.
