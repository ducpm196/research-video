source: 'curriculum/bnx.yaml L34; audit/bnx/verify_bnx.py L34; audit/bnx/sources_l34.md:
  SQLite (EXPLAIN QUERY PLAN, Query Planning), NIST CSRC Glossary (Separation of Duty)
  (đọc 2026-11-14); mã Python 3 + sqlite3 chạy thật; mọi bậc duyệt, nhóm nợ, số tiền
  là số minh hoạ; bài không dạy chấm điểm của ngân hàng nào và không trích điều khoản
  pháp luật'
assumes:
- bnx_explain
objectives:
- Chạy máy trạng thái hồ sơ vay từ khởi tạo tới giải ngân và chặn chuyển trạng thái
  không hợp lệ
- Xác định người có quyền duyệt theo tổng dư nợ của khách và tách người tạo khỏi người
  duyệt
- So sánh hồ sơ vay cá nhân với hồ sơ doanh nghiệp về bậc duyệt, nguồn trả nợ và dư
  nợ cần gộp
- Chạy tra cứu lịch sử tín dụng chỉ khi có đồng ý còn hạn đúng mục đích và ghi nhật
  ký mọi lần tra
- Kiểm nhật ký chuyển trạng thái bằng cách dựng lại trạng thái cuối và đếm cạnh sai
- Đo số dòng phải đọc khi tra lịch sử có và không có chỉ mục ở 1 000 và 1 000 000
  dòng
- Viết hàm chọn người duyệt, hàm chặn chuyển trạng thái và hàm tra cứu có đồng ý trên
  số liệu mới
