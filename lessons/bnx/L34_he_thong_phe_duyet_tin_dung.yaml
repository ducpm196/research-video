- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ hồ sơ tới quyền duyệt và đồng ý'
  checks:
  - alg.bnx_l34_nguoi_duyet('CN', 180, 90) == (270, 'truong phong')
  - alg.bnx_l34_duoc_duyet('an', 'chi', 'truong phong', 'truong phong') and not alg.bnx_l34_duoc_duyet('an',
    'an', 'truong phong', 'truong phong')
  steps:
  - show: '<p><b>Cách đọc mã Python của bài này</b> (mỗi dòng: viết gì, nghĩa gì,
      ví dụ nhỏ):</p><table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th><th>ví
      dụ nhỏ</th></tr><tr><td><code>?</code> trong câu SQL</td><td>chỗ giữ chỗ: giá
      trị truyền riêng ở tham số sau, đúng thứ tự</td><td><code>WHERE id = ?</code>
      với <code>(1,)</code> thành <code>WHERE id = 1</code></td></tr><tr><td><code>(hs,)</code></td><td>bộ
      giá trị; một phần tử thì phải có dấu phẩy</td><td><code>(7,)</code> là bộ một
      số</td></tr><tr><td><code>.fetchone()[0]</code></td><td>lấy dòng kết quả đầu
      (một bộ), rồi <code>[0]</code> lấy giá trị đầu của bộ; không có dòng thì <code>None</code></td><td>dòng
      <code>(5,)</code> cho <code>5</code></td></tr><tr><td><code>executemany</code></td><td>chạy
      một câu SQL cho từng bộ trong danh sách</td><td>7 bộ thì thêm 7 dòng</td></tr><tr><td><code>f"{tu}
      -&gt; {den}"</code></td><td>chuỗi f: chỗ trong ngoặc nhọn được thay bằng giá
      trị biến</td><td><code>tu</code> là <code>A</code> thì ra <code>A -&gt; B</code></td></tr></table>'
    focus:
    - 0
    - '2.2'
    - '2.4'
    - '2.6'
    clear: true
    say: Trước khi đọc mã, ta cần vài mẫu cú pháp. Dấu hỏi trong câu SQL là chỗ giữ
      chỗ, giá trị truyền riêng ở sau, và bộ một phần tử phải có dấu phẩy. Lấy một
      dòng trả về một bộ, nên thêm chỉ số không để lấy giá trị đầu. Chuỗi f thay chỗ
      trong ngoặc nhọn bằng giá trị biến.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>INSERT
      INTO ho_so VALUES (1, ''CN'', ''KHOI_TAO'')</code></td><td>thêm một dòng vào
      bảng <code>ho_so</code>; các giá trị theo đúng thứ tự cột</td></tr><tr><td><code>SELECT
      tt FROM ho_so WHERE id = ?</code></td><td>lấy cột <code>tt</code> từ bảng <code>ho_so</code>,
      chỉ ở các dòng thoả điều kiện sau <code>WHERE</code></td></tr><tr><td><code>UPDATE
      ho_so SET tt = ? WHERE id = ?</code></td><td>đổi giá trị cột <code>tt</code>
      ở các dòng thoả điều kiện sau <code>WHERE</code></td></tr><tr><td><code>SELECT
      COUNT(*) FROM lich_su</code>, <code>MAX(nhom)</code></td><td><code>COUNT(*)</code>:
      đếm số dòng; <code>MAX(cột)</code>: giá trị lớn nhất của cột</td></tr></table>'
    clear: true
    say: Mã dùng bốn kiểu câu SQL, nên ta đọc trước. Thêm một dòng vào bảng, giá trị
      theo thứ tự cột. Lấy một cột, chỉ ở các dòng thoả điều kiện. Đổi giá trị một
      cột ở các dòng thoả điều kiện. Hàm đếm cho số dòng, hàm lớn nhất cho giá trị
      lớn nhất.
  - show: '<p><b>Bước 1. Luật là một bảng, không nằm rải rác trong mã.</b> Ta liệt
      kê mọi cặp (từ, đến) được phép vào bảng <code>cho_phep</code>. Cặp nào không
      có thì bị chặn.</p><p><b>MayTrangThai.py (trích): bảy cạnh được phép</b></p><div
      class="code"><div>CANH = [("KHOI_TAO", "THAM_DINH"), ("THAM_DINH", "CHAM_DIEM"),</div><div>        ("THAM_DINH",
      "TU_CHOI"), ("CHAM_DIEM", "CHO_DUYET"),</div><div>        ("CHO_DUYET", "DA_DUYET"),
      ("CHO_DUYET", "TU_CHOI"),</div><div>        ("DA_DUYET", "GIAI_NGAN")]</div><div>db.executemany("INSERT
      INTO cho_phep VALUES (?, ?)", CANH)</div><div>db.execute("INSERT INTO ho_so
      VALUES (1, ''CN'', ''KHOI_TAO'')")</div><div> </div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước một: luật là một bảng, không rải rác trong mã, nên thêm một bước chỉ
      là thêm một dòng, và cặp không có trong bảng thì bị chặn. Bài không dạy cách
      chấm điểm của ngân hàng nào, nên chấm điểm chỉ là một nhãn.'
  - show: '<p><b>Bước 2. Đọc nhãn, kiểm luật, rồi mới đổi và ghi nhật ký.</b> <b>SQL</b>
      là ngôn ngữ hỏi và ghi bảng: <code>SELECT tt FROM ho_so WHERE id = 1</code>
      lấy cột <code>tt</code> của hồ sơ 1.</p><p><b>MayTrangThai.py (trích): hàm chuyển</b></p><div
      class="code"><div>def chuyen(hs, den, nguoi):</div><div>    sql = "SELECT tt
      FROM ho_so WHERE id = ?"</div><div>    tu = db.execute(sql, (hs,)).fetchone()[0]</div><div>    sql
      = "SELECT 1 FROM cho_phep WHERE tu = ? AND den = ?"</div><div>    if not db.execute(sql,
      (tu, den)).fetchone():</div><div>        print(f"{tu} -&gt; {den}: tu choi")</div><div>        return</div><div>    db.execute("UPDATE
      ho_so SET tt = ? WHERE id = ?", (den, hs))</div><div>    db.execute("INSERT
      INTO lich_su VALUES (?, ?, ?, ?)",</div><div>               (hs, tu, den, nguoi))</div><div>    print(f"{tu}
      -&gt; {den}: {nguoi} ghi nhan")</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Bước hai: hàm đọc nhãn hiện tại, kiểm luật, rồi mới đổi nhãn và ghi nhật
      ký. Các câu lệnh trong hàm viết bằng SQL, ngôn ngữ để hỏi và ghi bảng, ví dụ
      câu lấy cột trạng thái của hồ sơ số một. Cặp không có luật thì in từ chối và
      dừng, nên nhật ký chỉ chứa bước hợp lệ.'
  - show: '<p><b>Bước 3a. Bậc duyệt là dữ liệu.</b> <code>CN</code> là cá nhân, <code>DN</code>
      là doanh nghiệp. Mỗi cặp là <code>(trần, vai trò)</code>: tổng không vượt trần
      thì cần vai trò đó; <code>None</code> là không giới hạn. <code>HANG</code> cho
      mỗi vai trò một số để so cao thấp.</p><p><b>PhanQuyen.py (trích): bậc và hạng</b></p><div
      class="code"><div>BAC = {"CN": [(100, "chuyen vien"), (500, "truong phong"),</div><div>              (None,
      "hoi dong")],</div><div>       "DN": [(2000, "truong phong"), (10000, "giam
      doc khoi"),</div><div>              (None, "hoi dong")]}</div><div>HANG = {"chuyen
      vien": 1, "truong phong": 2,</div><div>        "giam doc khoi": 3, "hoi dong":
      4}</div><div> </div><div> </div></div>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Bậc duyệt là dữ liệu, có hai nhóm, cá nhân và doanh nghiệp, mỗi cặp gồm trần
      và vai trò cần, còn không có trần nghĩa là không giới hạn. Bảng hạng cho mỗi
      vai trò một số để so cao thấp.
  - show: <p><b>Bước 3. Quyền duyệt theo bậc, tính trên TỔNG.</b> Hạn mức duyệt =
      dư nợ hiện có + khoản mới, không phải riêng khoản mới. Vòng <code>for</code>
      đi từ bậc thấp lên; gặp bậc đầu tiên mà tổng không vượt trần thì trả vai trò
      của bậc đó.</p><p><b>PhanQuyen.py (trích)</b></p><div class="code"><div>def
      can_ai(loai, du_no, moi):</div><div>    tong = du_no + moi</div><div>    for
      tran, vai in BAC[loai]:</div><div>        if tran is None or tong &lt;= tran:</div><div>            return
      tong, vai</div><div> </div></div>$$\text{tổng} = 180 + 90 = \hl{270} \Rightarrow
      \text{trưởng phòng}$$
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: 'Bước ba: quyền duyệt theo bậc, tính trên tổng. Hạn mức là dư nợ hiện có
      cộng khoản mới, vì chỉ nhìn khoản mới thì khách chia nhỏ hồ sơ là lách được.
      Vòng lặp đi từ bậc thấp lên, gặp bậc đủ trần thì dừng. Nợ một trăm tám mươi
      triệu, xin thêm chín mươi, tổng hai trăm bảy mươi, rơi vào bậc trưởng phòng.'
    introduces:
    - implies
  - show: '<p><b>Bước 4. Hồ sơ doanh nghiệp khác cá nhân</b> (mô hình minh hoạ của
      bài):</p><table class=''t''><tr><th>điểm</th><th>cá nhân</th><th>doanh nghiệp</th></tr><tr><td>bậc
      1 (số minh hoạ)</td><td>≤ 100 triệu: chuyên viên</td><td>≤ 2 000 triệu: trưởng
      phòng</td></tr><tr><td>bậc 2</td><td>≤ 500 triệu: trưởng phòng</td><td>≤ 10
      000 triệu: giám đốc khối (người phụ trách một khối kinh doanh)</td></tr><tr><td>bậc
      3</td><td>trên 500: hội đồng (nhiều người cùng quyết)</td><td>trên 10 000: hội
      đồng</td></tr><tr><td>nguồn trả nợ cần thẩm định</td><td>thu nhập, nghĩa vụ
      trả nợ hiện có</td><td>dòng tiền, báo cáo tài chính, tài sản bảo đảm (tài sản
      bên vay dùng để bảo đảm khoản vay)</td></tr><tr><td>dư nợ cần gộp</td><td>của
      một khách</td><td>của cả <b>nhóm bên liên quan</b> (các công ty có quan hệ sở
      hữu hoặc điều hành với nhau)</td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    - 2
    introduces:
    - bnx_nhom_ben_lien_quan
    clear: true
    say: 'Bước bốn: hồ sơ doanh nghiệp khác cá nhân, theo mô hình minh hoạ. Bậc duyệt
      cao hơn vì số tiền lớn hơn, bậc hai do giám đốc khối, người phụ trách một khối
      kinh doanh, và trên đó là hội đồng. Cá nhân nhìn thu nhập, doanh nghiệp nhìn
      dòng tiền, báo cáo tài chính và tài sản bảo đảm, tức tài sản dùng để bảo đảm
      khoản vay. Dư nợ gộp cả nhóm bên liên quan, tức các công ty có quan hệ sở hữu
      hoặc điều hành với nhau.'
  - show: <p><b>Bước 5. Tách người tạo khỏi người duyệt.</b> Theo bảng thuật ngữ của
      <b>NIST</b> (viện tiêu chuẩn và công nghệ của Mỹ), tách nhiệm vụ là nguyên tắc
      &laquo;no user should be given enough privileges to misuse the system on their
      own&raquo;.</p><p><b>PhanQuyen.py (trích)</b></p><div class="code"><div>def
      duoc_duyet(tao, duyet, vai_duyet, can):</div><div>    if tao == duyet:</div><div>        return
      "tu choi (tu duyet)"</div><div>    if HANG[vai_duyet] &lt; HANG[can]:</div><div>        return
      "tu choi (thieu quyen)"</div><div>    return "dong y"</div></div>
    focus:
    - 1
    - 1
    - - 2
      - 3
    clear: true
    say: 'Bước năm: tách người tạo khỏi người duyệt. Theo bảng thuật ngữ của một viện
      tiêu chuẩn của Mỹ, không ai được cấp đủ quyền để tự lạm dụng hệ thống. Hàm kiểm
      hai điều: người duyệt khác người tạo, và hạng vai trò đủ cao, thiếu một thì
      từ chối.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>SELECT
      1 FROM dong_y WHERE khach = ? AND muc_dich = ? AND het_han &gt;= ? AND thu_hoi
      = 0</code></td><td><code>AND</code> nối các điều kiện: dòng phải thoả cả bốn;
      <code>SELECT 1</code> chỉ cần biết có dòng nào hay không</td></tr><tr><td><code>kq
      = "cho phep" if ok else "tu choi"</code></td><td>biểu thức điều kiện: <code>kq</code>
      là <code>cho phep</code> nếu <code>ok</code> có dòng, ngược lại <code>tu choi</code></td></tr></table>'
    clear: true
    say: Hàm tra cứu có hai chỗ mới, chữ nối đòi dòng thoả cả bốn điều kiện. Chọn
      kết quả theo có dòng khớp hay không.
  - show: '<p><b>Bước 6. Tra lịch sử: kiểm đồng ý, ghi nhật ký cả khi từ chối.</b></p><div
      class="code"><div>def tra_cuu(nguoi, khach, muc_dich, ngay):</div><div>    sql
      = ("SELECT 1 FROM dong_y WHERE khach = ? AND muc_dich = ? "</div><div>           "AND
      het_han &gt;= ? AND thu_hoi = 0")</div><div>    ok = db.execute(sql, (khach,
      muc_dich, ngay)).fetchone()</div><div>    kq = "cho phep" if ok else "tu choi"</div><div>    db.execute("INSERT
      INTO nhat_ky VALUES (?, ?, ?, ?, ?)",</div><div>               (nguoi, khach,
      muc_dich, ngay, kq))</div><div>    if not ok:</div><div>        return kq, None</div><div>    sql
      = "SELECT MAX(nhom) FROM ls WHERE khach = ?"</div><div>    return kq, db.execute(sql,
      (khach,)).fetchone()[0]</div><div> </div></div>'
    focus:
    - - 1
    - 2
    clear: true
    say: 'Bước sáu: tra lịch sử, bốn điều kiện đồng ý nằm trong một câu truy vấn,
      và dù đủ hay thiếu đều ghi nhật ký, vì lần bị từ chối cũng là bằng chứng. Khi
      đủ, hàm chỉ trả nhóm cao nhất.'
  - show: <div class="box key"><b>Lưu ý pháp lý.</b> Luật về dữ liệu cá nhân và về
      tín dụng có yêu cầu riêng. Bài không trích điều khoản; bạn đọc văn bản hiện
      hành trước khi áp dụng.</div>
    clear: true
    say: 'Lưu ý cuối: luật về dữ liệu cá nhân và về tín dụng có yêu cầu riêng. Bài
      không trích điều khoản, nên bạn đọc văn bản hiện hành trước khi áp dụng.'
- id: example
