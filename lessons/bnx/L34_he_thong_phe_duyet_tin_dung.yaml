      ý hết hạn ngày ba mươi mốt tháng ba, tra cứu ngày đó và ngày mồng một tháng
      tư cho kết quả gì? Câu ba: bảng lịch sử hai triệu dòng, chọn chỉ mục, kho đọc
      hay bộ đệm, và vì sao? Hãy dừng lại làm ra giấy.'
  - show: '<p>Câu 1: tổng = dư nợ + khoản mới.</p>

      $$350 + 200 = \hlg{550} > 500 \Rightarrow \text{hội đồng}; \quad \text{chỉ xét
      } 200 \to \text{trưởng phòng: } \hlg{\text{sai bậc}}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu một, tổng là ba trăm năm mươi cộng hai trăm, bằng năm trăm năm
      mươi, lớn hơn năm trăm, nên cần hội đồng. Nếu chỉ xét hai trăm thì ra trưởng
      phòng, sai bậc vì bỏ qua dư nợ cũ.
    clear: true
  - show: '<p>Câu 2: so sánh chuỗi ngày theo thứ tự chữ cái; &laquo;lớn hơn hoặc bằng&raquo;
      nên ngày hết hạn vẫn còn hiệu lực.</p>

      $$\text{03-31}: 2026\text{-}03\text{-}31 \ge 2026\text{-}03\text{-}31 \Rightarrow
      \hlg{\text{cho phép}}; \quad \text{04-01}: 2026\text{-}03\text{-}31 < 2026\text{-}04\text{-}01
      \Rightarrow \hlg{\text{từ chối}}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu hai, ngày ba mươi mốt tháng ba bằng ngày hết hạn, điều kiện lớn
      hơn hoặc bằng đúng, nên cho phép. Ngày mồng một tháng tư lớn hơn ngày hết hạn
      nên từ chối.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>chỉ
      mục theo mã khách</td><td>mỗi lần đọc vài dòng; luôn đúng dữ liệu hiện tại và
      đồng ý hiện tại</td><td>tốn chỗ, ghi chậm hơn một chút</td></tr><tr><td>sao
      chép sang kho đọc</td><td>tách tải đọc khỏi bảng chính</td><td>nhân đôi dữ liệu
      nhạy cảm; bản sao chậm nên có thể trả dữ liệu khi đồng ý đã thu hồi</td></tr><tr><td>bộ
      đệm một ngày</td><td>nhanh nhất</td><td>khách thu hồi giữa ngày mà vẫn trả dữ
      liệu: vi phạm đồng ý</td></tr></table>'
    say: Đáp án câu ba, chỉ mục cho mỗi lần đọc vài dòng và luôn đúng đồng ý hiện
      tại, đổi lại tốn chỗ. Kho đọc nhân đôi dữ liệu nhạy cảm, và bản sao chậm có
      thể trả dữ liệu khi đồng ý đã thu hồi. Bộ đệm nhanh nhất nhưng thu hồi giữa
      ngày mà vẫn trả là vi phạm, hợp lý là chọn chỉ mục.
    clear: true
