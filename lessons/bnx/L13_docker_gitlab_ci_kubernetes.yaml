      2 300 500</div><div>400 0 40 10 400 440</div></div>'
    clear: true
    say: Ta chạy ở bốn, bốn mươi và bốn trăm bản, với thiếu một thừa một, với mặc
      định hai mươi lăm phần trăm, và với không thiếu, thừa bốn mươi.
  - show: '<table class=''t''><tr><th>số bản D</th><th>thiếu 1, thừa 1: số đợt</th><th>chờ
      nếu 30 giây mỗi đợt (số minh hoạ)</th><th>mặc định 25%: số đợt</th><th>chờ</th></tr><tr><td><span
      style=''white-space:nowrap''>4 (×1)</span></td><td>2</td><td>1 phút</td><td>2</td><td>1
      phút</td></tr><tr><td><span style=''white-space:nowrap''>40 (×10)</span></td><td>20</td><td>10
      phút</td><td>2</td><td>1 phút</td></tr><tr><td><span style=''white-space:nowrap''>400
      (×100)</span></td><td>200</td><td>100 phút, đúng 1 giờ 40</td><td>2</td><td>1
      phút</td></tr></table><p class=''note''>Cỡ lẻ như D = 3 hoặc 7 (chia 4 dư 3)
      cần 3 đợt: làm tròn khiến mỗi đợt thay chưa tới một nửa.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Với thiếu một thừa một, số đợt tăng thẳng theo số bản, nên bốn trăm bản mất
      hai trăm đợt, tức một giờ bốn mươi phút nếu mỗi đợt ba mươi giây. Còn mặc định
      hai mươi lăm phần trăm chỉ hai đợt ở ba cỡ này, vì mỗi đợt thay một nửa số bản.
  - show: '<table class=''t''><tr><th>cấu hình ở 400 bản</th><th>số đợt</th><th>sẵn
      sàng tối thiểu</th><th>Pod tối đa</th><th>được</th><th>mất</th></tr><tr><td>thiếu
      1, thừa 1</td><td>200</td><td>399</td><td>401</td><td>gần đủ sức chứa; chỉ cần
      chỗ cho 1 Pod thêm</td><td>chậm: 100 phút</td></tr><tr><td>mặc định 25%</td><td>2</td><td>300</td><td>500</td><td>nhanh:
      1 phút</td><td>tụt 25% (còn 75% sức chứa); cần chỗ cho 100 Pod thêm</td></tr><tr><td>thiếu
