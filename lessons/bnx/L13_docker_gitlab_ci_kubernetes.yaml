- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: liệt kê mọi trạng thái'
  checks:
  - alg.bnx_rolling_bounds(4, '25%', '25%') == (3, 5) == alg.bnx_rolling_bounds(4,
    1, 1)
  - alg.bnx_k8s_abs('25%', 4, False) == 1 == alg.bnx_k8s_abs('25%', 4, True)
  - alg.bnx_rolling_summary(4, 1, 1)[1:] == (3, 5)
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th><th>ví dụ nhỏ</th></tr><tr><td><code>c,
      r, k = s = todo.pop()</code></td><td>lấy một trạng thái ra; <code>s</code> là
      tên cả bộ, đồng thời tách ba số vào <code>c</code>, <code>r</code>, <code>k</code></td><td><code>a,
      b = x = (1, 2)</code> thì x là (1, 2), a là 1, b là 2</td></tr><tr><td><code>if
      k:</code>, <code>if c and …</code></td><td>số khác 0 tính là đúng, số 0 tính
      là sai</td><td><code>if 3:</code> chạy, <code>if 0:</code> không chạy</td></tr><tr><td><code>(0,
      D, 0) in seen</code></td><td>đúng khi bộ ba đó có trong tập <code>seen</code></td><td><code>(1,
      2) in {(1, 2)}</code> là đúng</td></tr><tr><td><code>max(c + r + k for … in
      seen)</code>, <code>print(a, b)</code></td><td>lấy số lớn nhất trong các giá
      trị tính từ mọi phần tử (<code>min</code>: nhỏ nhất); <code>print</code> in
      các giá trị cách nhau dấu cách</td><td><code>max(x * 2 for x in (1, 5))</code>
      ra 10</td></tr></table>'
    say: Trước khi đọc mã, ta cần bốn ký hiệu. Dòng lấy trạng thái ra vừa đặt một
      tên cho cả bộ, vừa tách ba số vào ba biến. Vì máy coi số khác không là đúng
      nên điều kiện có thể chỉ là một số. Phép thuộc hỏi một bộ có trong tập không,
      còn hàm lớn nhất lấy số lớn nhất trong các giá trị tính từ mọi phần tử.
  - show: '<div class="code"><div>D, MU, MS = 4, 1, 1</div><div>seen, todo = set(),
      [(D, 0, 0)]  # (cũ, mới sẵn sàng, mới khởi động)</div><div>while todo:</div><div>    c,
      r, k = s = todo.pop()</div><div>    if s in seen: continue</div><div>    seen.add(s)</div><div>    if
      c + r + k &lt; D + MS and r + k &lt; D: todo.append((c, r, k + 1))</div><div>    if
      c and c - 1 + r &gt;= D - MU: todo.append((c - 1, r, k))</div><div>    if k:
      todo.append((c, r + 1, k - 1))</div><div>print(len(seen), min(c + r for c, r,
      k in seen),</div><div>      max(c + r + k for c, r, k in seen), (0, D, 0) in
      seen)</div></div><p class=''note''><code>(c, r, k)</code> là bộ ba số; <code>set</code>
      là tập hợp không trùng phần tử; <code>while todo:</code> lặp tới khi hết việc
      chờ; <code>todo.pop()</code> lấy phần tử cuối; <code>continue</code> bỏ qua
      trạng thái đã xét; <code>.append</code>, <code>.add</code> thêm vào danh sách,
      tập hợp; <code>min(… for …)</code> lấy số nhỏ nhất trong các giá trị tính từ
      mọi phần tử.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Ta kiểm bằng đường khác vì số tính tay có thể sai: mô hình Python, không
      phải cụm thật, liệt kê mọi trạng thái được phép. Mỗi trạng thái là bộ ba số
      gồm bản cũ, bản mới sẵn sàng và bản mới đang khởi động, và vòng lặp thử thêm
      bản mới, xoá bản cũ, hoặc cho bản mới sẵn sàng.'
  - show: <p><b>Kết quả của mô hình Python (không phải cụm Kubernetes thật)</b></p><div
      class="code"><div>24 3 5 True</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Kết quả có hai mươi bốn trạng thái, vì thế đã duyệt hết mọi cách đi. Sẵn
      sàng thấp nhất là ba, nhiều nhất năm bản chạy, và trạng thái thay xong hết tới
      được.
  - show: '<table class=''t''><tr><th>cách đổi ra số</th><th>maxUnavailable</th><th>maxSurge</th><th>sẵn
      sàng tối thiểu</th><th>Pod tối đa</th></tr><tr><td>số tuyệt đối 1</td><td>1</td><td>1</td><td>3</td><td>5</td></tr><tr><td>mặc
      định 25% của 4 = 1</td><td>làm tròn xuống: 1</td><td>làm tròn lên: 1</td><td>3</td><td>5</td></tr></table>'
    clear: true
    say: 'Đường kiểm thứ hai dùng mặc định hai mươi lăm phần trăm: một phần tư của
      bốn là một, làm tròn xuống hay lên đều ra một. Vì vậy cấu hình mặc định cũng
      cho ba bản sẵn sàng tối thiểu và năm bản tối đa.'
- id: quymo
  kind: example
  title: 'Khi số bản lớn dần: cập nhật mất bao lâu (mô phỏng)'
  checks:
  - '[alg.bnx_rolling_summary(D, 1, 1) for D in (4, 40, 400)] == [(2, 3, 5), (20,
    39, 41), (200, 399, 401)]'
  - '[alg.bnx_rolling_summary(D, ''25%'', ''25%'') for D in (4, 40, 400)] == [(2,
    3, 5), (2, 30, 50), (2, 300, 500)]'
  - alg.bnx_rolling_summary(400, 0, 40) == (10, 400, 440)
  - '[alg.bnx_l13_phut(alg.bnx_l13_dot(D, 1, 1), 30) for D in (4, 40, 400)] == [1.0,
    10.0, 100.0]'
  - alg.bnx_l13_phut(2, 30) == 1.0 and alg.bnx_l13_phut(10, 30) == 5.0
  - 100 // 10 == 40 // 4 == 10 and 400 // 4 == 100 and 300 / 400 == 0.75
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def
      ten(a, b):</code> … <code>return x</code></td><td>khai một hàm: <code>def</code>,
      tên, tham số trong ngoặc tròn, dấu hai chấm; các dòng thụt vào là thân hàm;
      <code>return</code> trả giá trị về chỗ gọi</td><td><code>def so_dot(D, mu, ms):</code>:
      hàm nhận số bản D, số được thiếu mu, số được thừa ms; trả về số đợt</td></tr><tr><td><code>while
      đk:</code>, <code>j += 1</code></td><td>lặp lại thân vòng chừng nào điều kiện
      còn đúng; <code>j += 1</code>: cộng 1 vào j</td><td><code>while san &lt; D:</code>:
      lặp khi số bản đã thay san còn nhỏ hơn D</td></tr><tr><td><code>san += min(mu
      + ms, D - san)</code></td><td><code>min(a, b)</code>: lấy số nhỏ hơn trong hai
      số; <code>+=</code>: cộng vào san</td><td>mỗi đợt thay tối đa mu cộng ms bản,
      và không quá số còn lại</td></tr><tr><td><code>for x in (1, 2, 3):</code></td><td>vòng
      lặp: mỗi vòng <code>x</code> nhận một giá trị trong dãy, theo thứ tự; các dòng
      thụt vào là thân vòng</td><td><code>for D in (4, 40, 400):</code> chạy ba lần
      với D bằng 4, rồi 40, rồi 400; <code>print(…)</code> in các giá trị cách nhau
      dấu cách</td></tr></table>'
    clear: true
    say: Khai hàm Python gồm chữ khai hàm, tên, tham số và dấu hai chấm; các dòng
      thụt vào là thân hàm, và lệnh trả về đưa giá trị về chỗ gọi. Ví dụ, hàm so đợt
      nhận ba số và trả về số đợt. Vòng lặp có điều kiện lặp lại thân vòng chừng nào
      điều kiện còn đúng, và dấu cộng bằng cộng một giá trị vào biến. Hàm lấy số nhỏ
      hơn chọn số bản thay trong đợt này, rồi cộng vào số đã thay. Vòng lặp Python
      cho biến nhận lần lượt từng giá trị trong dãy, và các dòng thụt vào là thân
      vòng.
  - show: '<p><b>Mô phỏng (không phải cụm thật): mỗi đợt thay tối đa thiếu + thừa
      bản</b></p><div class="code"><div>def so_dot(D, mu, ms):</div><div>    san,
      dot = 0, 0</div><div>    while san &lt; D:</div><div>        san += min(mu +
      ms, D - san)</div><div>        dot += 1</div><div>    return dot</div><div>
      </div><div>def hang(D, mu, ms):</div><div>    print(D, mu, ms, so_dot(D, mu,
      ms), D - mu, D + ms)</div></div>'
    clear: true
    say: Ta xem việc cập nhật đổi thế nào khi số bản lớn dần, bằng mô phỏng chạy thật
      nhưng không phải cụm thật.
  - show: '<div class="code"><div>for D in (4, 40, 400):</div><div>    hang(D, 1,
      1)</div><div>for D in (4, 40, 400):</div><div>    hang(D, D // 4, -(-D // 4))</div><div>hang(400,
      0, 40)</div></div><p class=''note''><code>D // 4</code> chia lấy phần nguyên,
      tức làm tròn xuống; <code>-(-D // 4)</code> làm tròn lên: với D = 10 ra −(−3)
      = 3.</p><p><b>Kết quả: D, thiếu, thừa, số đợt, sẵn sàng tối thiểu, Pod tối đa</b></p><div
