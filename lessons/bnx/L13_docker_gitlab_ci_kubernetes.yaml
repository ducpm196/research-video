      phút</td><td>cần chỗ cho 40 Pod thêm</td></tr></table>'
    clear: true
    say: Đây là đánh đổi người làm nghề phải chọn. Mặc định hai mươi lăm phần trăm
      nhanh nhưng sức chứa tụt còn bảy mươi lăm phần trăm, còn không cho thiếu mà
