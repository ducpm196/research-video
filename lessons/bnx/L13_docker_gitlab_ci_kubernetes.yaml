- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ Dockerfile tới số Pod'
  checks:
  - 'alg.bnx_build_seconds(alg.bnx_df_good, {''src/Main.java''}, {''RUN dependency:go-offline'':
    90, ''RUN package'': 30}) == 30'
  - 'alg.bnx_build_seconds(alg.bnx_df_bad, {''src/Main.java''}, {''RUN package (tải
    + dịch)'': 90 + 30}) == 120'
  - alg.bnx_rolling_bounds(4, 1, 1) == (3, 5)
  - alg.bnx_short_sha(alg.bnx_git_demo()['merge']) == '0eac7e6a'
  steps:
  - show: <div class="code"><div>FROM maven:3.9.9-eclipse-temurin-21 AS build</div><div>WORKDIR
      /src</div><div>COPY pom.xml .</div><div>RUN mvn -q dependency:go-offline</div><div>COPY
      src ./src</div><div>RUN mvn -q package -DskipTests</div><div>FROM eclipse-temurin:21.0.5_11-jre</div><div>WORKDIR
      /app</div><div>COPY --from=build /src/target/chuyen-tien.jar app.jar</div><div>USER
      10001</div><div>EXPOSE 8080</div><div>ENTRYPOINT ["java", "-jar", "app.jar"]</div></div>
    say: Bước một là tệp dựng ảnh. Giai đoạn dựng tải phụ thuộc trước rồi mới chép
      mã nguồn, vì tệp phụ thuộc ít đổi còn mã đổi hằng ngày, nên lớp tải phụ thuộc
      được giữ trong bộ nhớ đệm.
  - show: '<p><b>Làm thử</b> (số minh hoạ: tải phụ thuộc 90 giây, biên dịch và đóng
      gói 30 giây). Sửa một tệp trong <code>src</code>:</p>

      $$\text{đúng thứ tự: } \hlg{30} \text{ giây} \qquad \text{sai thứ tự: } 90 +
      30 = \hl{120} \text{ giây}$$

      <p class=''note''>30 giây chỉ đúng khi đệm của lần trước còn được giữ. Máy chạy
      đường ống dùng một lần thì đệm trống: phải chủ động giữ đệm mới được lợi.</p><p
      class=''note''>Thẻ ảnh nền có thể bị nhà phát hành trỏ sang ảnh khác. Muốn bất
      biến thì ghim thêm chữ ký nội dung của ảnh (digest): một chuỗi băm, tức dãy
      ký tự ngắn cố định tính từ nội dung ảnh, nội dung đổi thì dãy đổi.</p>

      '
    focus:
    - 1
    - 2
    - - 3
      - 4
    clear: true
    say: 'Làm thử với số minh hoạ: tải phụ thuộc chín mươi giây, biên dịch và đóng
      gói ba mươi giây. Sửa một tệp mã thì đúng thứ tự chạy lại ba mươi giây, sai
      thứ tự mất một trăm hai mươi giây. Con số ba mươi chỉ đúng vì đệm của lần trước
      còn được giữ.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>{app:
      x}</code>, <code>[a, b]</code>, <code>- name: n</code></td><td>YAML: <code>{k:
      v}</code> là một nhóm cặp khoá và giá trị viết trên một dòng; <code>[a, b]</code>
      là danh sách; dòng bắt đầu bằng <code>-</code> là một phần tử của danh sách</td><td><code>stages:
      [build, test, package, deploy]</code>: danh sách bốn giai đoạn; <code>- docker
      push …</code> trong <code>script</code>: một lệnh trong danh sách lệnh của job</td></tr><tr><td><code>IMG:
      <span>&#36;</span>CI_REGISTRY_IMAGE:…</code></td><td>khai biến tên <code>IMG</code>;
      <code><span>&#36;</span>TÊN</code> được thay bằng giá trị của biến TÊN khi chạy</td><td><code><span>&#36;</span>CI_COMMIT_SHORT_SHA</code>
      thành <code>0eac7e6a</code></td></tr></table>'
    clear: true
    say: Trong tệp YAML, ngoặc nhọn gom các cặp khoá và giá trị trên một dòng, ngoặc
      vuông là danh sách, và dòng bắt đầu bằng gạch ngang là một phần tử của danh
      sách. Khai một biến tên ảnh, và dấu đô la đứng trước tên biến được thay bằng
      giá trị của biến đó khi chạy.
  - show: '<div class="code"><div>stages: [build, test, package, deploy]</div><div>variables:</div><div>  IMG:
      <span>&#36;</span>CI_REGISTRY_IMAGE:<span>&#36;</span>CI_COMMIT_SHORT_SHA</div><div>build:</div><div>  stage:
      build</div><div>  script: mvn -q compile</div><div>test:</div><div>  stage:
      test</div><div>  script: mvn -q test</div></div><p class=''note''>Rút gọn: mỗi
      job còn cần khai <code>image:</code> có công cụ của nó (ở đây là Maven).</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước hai là tệp mô tả đường ống. Dòng đầu khai báo bốn giai đoạn theo thứ
      tự chạy, và biến tên ảnh ghép địa chỉ kho ảnh với tám ký tự đầu của mã chốt.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>echo
      "<span>&#36;</span>CI_REGISTRY_PASSWORD" | docker login … --password-stdin</code></td><td><code>echo</code>
      in chữ ra; dấu <code>|</code> đưa chữ đó làm đầu vào lệnh sau; <code>docker
      login</code> đăng nhập kho ảnh, <code>-u</code> là tên tài khoản, <code>--password-stdin</code>
      đọc mật khẩu từ đầu vào thay vì gõ trong lệnh</td><td>mật khẩu chỉ đi qua đường
      ống, không hiện trong lệnh</td></tr><tr><td><code>docker build -t TÊN .</code></td><td>dựng
      ảnh từ thư mục hiện tại (dấu chấm) và đặt thẻ TÊN; <code>docker push TÊN</code>:
      đẩy ảnh lên kho</td><td><code>docker build -t <span>&#36;</span>IMG .</code></td></tr><tr><td><code>kubectl
      set image deployment/chuyen-tien app=<span>&#36;</span>IMG</code></td><td>bảo
      Kubernetes đổi ảnh của bản chạy tên <code>app</code> trong đối tượng triển khai;
      <code>rollout status</code>: chờ tới khi thay xong</td><td><code>kubectl set
      image deployment/chuyen-tien app=<span>&#36;</span>IMG</code></td></tr></table>'
    clear: true
    say: Lệnh in chữ ra, dấu gạch đứng đưa chữ đó vào lệnh đăng nhập kho ảnh, và tuỳ
      chọn đọc mật khẩu từ đầu vào giúp mật khẩu không gõ trong lệnh. Lệnh dựng ảnh
      lấy thư mục hiện tại, tức dấu chấm, và đặt thẻ cho ảnh, rồi lệnh đẩy gửi ảnh
      lên kho. Lệnh này bảo Kubernetes đổi ảnh của một bản chạy trong đối tượng triển
      khai, và lệnh trạng thái chờ tới khi thay xong.
  - show: '<div class="code"><div>package:</div><div>  stage: package</div><div>  script:</div><div>    -
      echo "<span>&#36;</span>CI_REGISTRY_PASSWORD" |</div><div>      docker login
      <span>&#36;</span>CI_REGISTRY -u <span>&#36;</span>CI_REGISTRY_USER --password-stdin</div><div>    -
      docker build -t <span>&#36;</span>IMG .</div><div>    - docker push <span>&#36;</span>IMG</div></div><p
      class=''note''>Rút gọn: job này còn cần dịch vụ Docker chạy kèm trong máy chạy
      đường ống.</p>'
    clear: true
    say: Việc đóng gói đăng nhập kho ảnh bằng tài khoản đường ống cấp sẵn, vì kho
      chỉ nhận ảnh từ người có quyền, rồi dựng ảnh, đặt thẻ là mã chốt ngắn và đẩy
      lên kho.
  - show: '<div class="code"><div>deploy:</div><div>  stage: deploy</div><div>  script:</div><div>    -
      kubectl set image deployment/chuyen-tien app=<span>&#36;</span>IMG</div><div>    -
      kubectl rollout status deployment/chuyen-tien</div></div><p class=''note''>Rút
      gọn: job này còn cần ảnh có <code>kubectl</code> và quyền vào cụm.</p>'
    clear: true
    say: Việc triển khai đổi ảnh rồi chờ cập nhật xong, và chỉ bắt đầu khi mọi việc
      giai đoạn trước thành công, nên kiểm thử hỏng thì không có ảnh nào được đẩy
      lên.
  - show: '<table class=''t''><tr><th>khoá trong YAML</th><th>nghĩa</th></tr><tr><td><code>apiVersion</code>,
      <code>kind</code>, <code>metadata</code>, <code>name</code></td><td>phiên bản
      khai báo, loại đối tượng (ở đây là Deployment), rồi tên của nó</td></tr><tr><td><code>spec</code>,
      <code>template</code></td><td><code>spec</code>: điều ta muốn (mấy bản, cập
      nhật thế nào); <code>template</code>: mẫu để tạo từng Pod</td></tr><tr><td><code>containerPort:
      8080</code></td><td>cổng: số cửa mạng mà dịch vụ lắng nghe; 8080 là số quen
      dùng cho dịch vụ web</td></tr><tr><td><code>matchLabels: {app: chuyen-tien}</code>,
      <code>ports: [{containerPort: 8080}]</code>, <code>- name: app</code></td><td>YAML:
      <code>{k: v}</code> là cặp khoá và giá trị viết trên một dòng; <code>[…]</code>
      là danh sách; dòng bắt đầu bằng <code>-</code> là một phần tử của danh sách,
      ở đây là container tên <code>app</code></td></tr></table>'
    clear: true
    say: Trước khi đọc tệp khai báo, ta cần biết vài khoá, vì tệp gồm các cặp khoá
      và giá trị. Các khoá đầu cho biết loại đối tượng và tên, khoá đặc tả ghi điều
      ta muốn, còn khoá mẫu tả từng bản chạy. Ngoặc nhọn gom một cặp khoá và giá trị
      trên một dòng, ngoặc vuông là danh sách, và dòng bắt đầu bằng gạch ngang là
      một phần tử của danh sách. Cổng là số cửa mạng mà dịch vụ lắng nghe.
  - show: '<div class="code"><div>apiVersion: apps/v1</div><div>kind: Deployment</div><div>metadata:</div><div>  name:
      chuyen-tien</div><div>spec:</div><div>  replicas: 4</div><div>  strategy:</div><div>    type:
      RollingUpdate</div><div>    rollingUpdate:</div><div>      maxUnavailable: 1</div><div>      maxSurge:
      1</div></div>'
    clear: true
    say: 'Bước ba là tệp khai báo đối tượng triển khai, vì cụm chạy theo khai báo:
      bốn bản, cập nhật cuốn chiếu, được thiếu tối đa một bản và được thừa tối đa
      một bản.'
  - show: '<div class="code"><div>  selector:</div><div>    matchLabels: {app: chuyen-tien}</div><div>  template:</div><div>    metadata:</div><div>      labels:
      {app: chuyen-tien}</div><div>    spec:</div><div>      containers:</div><div>        -
      name: app</div><div>          image: registry.vd.vn/bnx/chuyen-tien:0eac7e6a</div><div>          ports:
      [{containerPort: 8080}]</div><div>          readinessProbe:</div><div>            httpGet:
      {path: /ready, port: 8080}</div></div>'
    clear: true
    say: Bộ chọn tìm các bản mang nhãn tên dịch vụ, và phần mẫu gắn đúng nhãn đó lên
      mỗi bản mới nên hai bên khớp nhau. Phép kiểm sẵn sàng gọi đường dẫn kiểm ở cổng
      tám nghìn không trăm tám mươi.
  - show: '$$\text{sẵn sàng} \geq 4 - 1 = \hlg{3} \qquad \text{số Pod} \leq 4 + 1
      = \hl{5}$$

      <span class=''note''>Làm thử: thiếu tối đa 1 nên luôn còn ít nhất 3 bản phục
      vụ; thừa tối đa 1 nên cụm phải có chỗ cho bản thứ 5.</span>

      '
    focus:
    - 1
    - 1
    - 2
    introduces:
    - geq
    clear: true
    say: Từ hai tham số suy ra hai giới hạn. Được thiếu tối đa một nên số bản sẵn
      sàng luôn ít nhất bốn trừ một bằng ba. Được thừa tối đa một nên số bản chạy
      nhiều nhất bốn cộng một bằng năm, và cụm phải có chỗ cho bản thứ năm.
- id: example
  kind: example
  title: Ví dụ cập nhật 4 bản, từng phép tính
  checks:
  - alg.bnx_rolling_bounds(4, 1, 1) == (4 - 1, 4 + 1)
  - alg.bnx_rolling_waves(4, 1, 1)[1][:4] == [(4, 0, 0), (4, 0, 1), (3, 0, 1), (3,
    0, 2)]
  - alg.bnx_rolling_waves(4, 1, 1)[0] == [(1, 3, 2, 0, 5, 3), (2, 1, 2, 2, 5, 3)]
    and alg.bnx_rolling_waves(4, 1, 1)[1][-1] == (0, 4, 0)
  - alg.bnx_rolling_summary(4, 1, 1) == (2, 3, 5)
  - 3 * 250 == 750 and 750 >= 600
  steps:
