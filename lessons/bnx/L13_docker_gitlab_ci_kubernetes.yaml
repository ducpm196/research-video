- id: example
  kind: example
  title: Ví dụ cập nhật 4 bản, từng phép tính
  checks:
  - alg.bnx_rolling_bounds(4, 1, 1) == (4 - 1, 4 + 1)
  - alg.bnx_rolling_waves(4, 1, 1)[1][:4] == [(4, 0, 0), (4, 0, 1), (3, 0, 1), (3,
    0, 2)]
  - alg.bnx_rolling_waves(4, 1, 1)[0] == [(1, 3, 2, 0, 5, 3), (2, 1, 2, 2, 5, 3)]
    and alg.bnx_rolling_waves(4, 1, 1)[1][-1] == (0, 4, 0)
  - alg.bnx_rolling_summary(4, 1, 1) == (2, 3, 5)
  - 3 * 250 == 750 and 750 >= 600
  steps:
  - show: '<p>Đối tượng triển khai: <code>replicas: 4</code>, <code>maxUnavailable:
      1</code>, <code>maxSurge: 1</code>; ảnh đổi sang thẻ mới.</p>

      $$① \; 4 - 1 = \hlg{3} \text{ bản sẵn sàng tối thiểu}$$

      '
    focus:
    - 1
    - 2
    say: Ta mô phỏng từng bước khi đổi bốn bản sang ảnh mới. Phép tính thứ nhất, số
      bản sẵn sàng tối thiểu là bốn trừ một, bằng ba.
  - show: $$② \; 4 + 1 = \hl{5} \text{ Pod tối đa cùng lúc}$$
    say: Phép tính thứ hai, số bản chạy tối đa cùng lúc là bốn cộng một, bằng năm.
  - show: '<p>③ Đợt 1, theo quy tắc của bộ điều khiển: tạo 1 Pod mới (tổng 4 + 1 =
      5) → xoá 1 Pod cũ (còn 4 − 1 = 3 sẵn sàng, đúng mức tối thiểu) → tạo thêm 1
      Pod mới (tổng lại 3 + 2 = 5).</p>

      <span class=''note''>2 Pod mới khởi động cùng lúc, chưa qua phép kiểm sẵn sàng
      nên chưa được tính; bộ điều khiển chờ chúng.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Phép tính thứ ba là đợt đầu, theo đúng quy tắc của bộ điều khiển. Nó tạo
      một bản mới cho tổng lên năm, rồi xoá một bản cũ vì còn ba bản sẵn sàng, đúng
      mức tối thiểu. Tổng tụt về bốn nên nó tạo thêm một bản mới nữa, tổng lại là
      năm. Hai bản mới khởi động cùng lúc, chưa được tính là sẵn sàng, nên bộ điều
      khiển chờ.
  - show: '<table class=''t''><tr><th>đợt chờ</th><th>cũ</th><th>mới đang khởi động</th><th>mới
      sẵn sàng</th><th>Pod</th><th>sẵn sàng</th></tr><tr><td>1</td><td>3</td><td>2</td><td>0</td><td>5</td><td>3</td></tr><tr><td>2</td><td>1</td><td>2</td><td>2</td><td>5</td><td>3</td></tr><tr><td>xong</td><td>0</td><td>0</td><td>4</td><td>4</td><td>4</td></tr></table>$$④
      \; \text{2 đợt; mọi lúc: sẵn sàng} \geq \hlg{3},\ \text{Pod} \leq \hl{5}$$'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, lặp lại cho đến hết. Khi hai bản mới sẵn sàng, bộ điều
      khiển xoá hai bản cũ và tạo hai bản mới cuối cùng, rồi chờ đợt thứ hai. Vậy
      bốn bản được thay trong hai đợt chờ, giả định các bản khởi động lâu như nhau,
      và lúc nào cũng có ít nhất ba bản sẵn sàng, nhiều nhất năm bản chạy.
  - show: '<p>Mỗi Pod chịu 250 giao dịch/giây, tải lúc cập nhật 600 giao dịch/giây
      <span class=''note''>(số minh hoạ)</span>. Dùng lại 3 ở ①:</p>

      $$⑤ \; 3 \cdot 250 = \hlg{750} \geq 600 \;\Rightarrow\; \text{đủ sức chứa suốt
      lúc cập nhật}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ năm nối với sức chứa. Giả sử mỗi bản chịu hai trăm năm mươi
      giao dịch mỗi giây và tải lúc đó là sáu trăm, đều là số minh hoạ. Dùng lại ba
      bản ở phép tính thứ nhất, ba nhân hai trăm năm mươi bằng bảy trăm năm mươi,
      lớn hơn sáu trăm, nên suốt lúc cập nhật vẫn đủ sức chứa.
    introduces:
    - cdot
    - implies
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: liệt kê mọi trạng thái'
  checks:
  - alg.bnx_rolling_bounds(4, '25%', '25%') == (3, 5) == alg.bnx_rolling_bounds(4,
    1, 1)
  - alg.bnx_k8s_abs('25%', 4, False) == 1 == alg.bnx_k8s_abs('25%', 4, True)
  - alg.bnx_rolling_summary(4, 1, 1)[1:] == (3, 5)
  steps:
  - show: '<div class="code"><div>D, MU, MS = 4, 1, 1</div><div>seen, todo = set(),
      [(D, 0, 0)]  # (cũ, mới sẵn sàng, mới khởi động)</div><div>while todo:</div><div>    c,
      r, k = s = todo.pop()</div><div>    if s in seen: continue</div><div>    seen.add(s)</div><div>    if
      c + r + k &lt; D + MS and r + k &lt; D: todo.append((c, r, k + 1))</div><div>    if
      c and c - 1 + r &gt;= D - MU: todo.append((c - 1, r, k))</div><div>    if k:
      todo.append((c, r + 1, k - 1))</div><div>print(len(seen), min(c + r for c, r,
      k in seen),</div><div>      max(c + r + k for c, r, k in seen), (0, D, 0) in
      seen)</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>24 3
      5 True</div></div>'
    focus:
    - 0
    - 1
    - 1
    - 3
    say: Bây giờ ta kiểm lại bằng một đường khác. Ta liệt kê mọi trạng thái được phép
      đi qua, theo mọi thứ tự tạo, xoá và khởi động xong. Mỗi trạng thái ghi ba số,
      bản cũ, bản mới sẵn sàng, bản mới đang khởi động. Kết quả có hai mươi bốn trạng
      thái, sẵn sàng thấp nhất là ba, nhiều nhất năm bản chạy, và trạng thái thay
      xong hết là tới được.
  - show: '<table class=''t''><tr><th>cách đổi ra số</th><th>maxUnavailable</th><th>maxSurge</th><th>sẵn
      sàng tối thiểu</th><th>Pod tối đa</th></tr><tr><td>số tuyệt đối 1</td><td>1</td><td>1</td><td>3</td><td>5</td></tr><tr><td>mặc
      định 25% của 4 = 1</td><td>làm tròn xuống: 1</td><td>làm tròn lên: 1</td><td>3</td><td>5</td></tr></table>'
    clear: true
    say: Đường kiểm thứ hai dùng giá trị mặc định là hai mươi lăm phần trăm. Hai mươi
      lăm phần trăm của bốn là một, làm tròn xuống hay lên đều được một. Vì vậy cấu
      hình mặc định cũng cho ba bản sẵn sàng tối thiểu và năm bản tối đa, khớp với
      cách tính bằng số tuyệt đối.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_rolling_bounds(4, 1, 1)[0] == 3
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Dùng thẻ <code>latest</code>:
      hai lần kéo có thể ra hai ảnh khác nhau, không biết máy chủ đang chạy bản nào,
      quay lui về “latest” vô nghĩa.</div><div class="code"><div>FROM eclipse-temurin:latest</div><div>ENV
      DB_PASSWORD=MatKhau123</div><div>COPY . /app</div><div>ENTRYPOINT ["java", "-jar",
      "/app/app.jar"]</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Lỗi thứ nhất, của người mới, là dùng nhãn mới nhất cho ảnh chạy thật. Hai
      lần kéo có thể ra hai ảnh khác nhau, nên không biết máy chủ đang chạy bản nào.
      Quay lui về nhãn đó cũng vô nghĩa. Hãy ghim phiên bản ảnh nền và gắn thẻ ảnh
      bằng mã chốt.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Mật khẩu trong <code>ENV</code>
      của Dockerfile hay trong tệp đường ống: ai kéo ảnh, ai đọc kho mã đều thấy.
      <span class="note">Kiểm tệp vừa xem: chỉ <code>ENV</code> bị báo, còn <code>FROM
      eclipse-temurin:latest</code> không bị báo. Secret của Kubernetes mặc định lưu
      <b>không mã hoá</b>: nhớ bật mã hoá khi lưu.</span></div><p><b>Kết quả chạy
      thật: docker build --check</b></p><div class="code"><div>Check complete, 1 warning
      has been found!</div><div>WARNING: SecretsUsedInArgOrEnv - https://docs.docker.com/go/…</div><div>Do
      not use ARG or ENV instructions for sensitive data …</div><div>   2 | &gt;&gt;&gt;
      ENV DB_PASSWORD=MatKhau123</div></div>'
    focus:
    - 1
    - 1
    - 3
    - 0
    - 1
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là ghi mật khẩu vào tệp dựng ảnh hay tệp
      đường ống. Ai kéo ảnh về, hay ai đọc lịch sử kho mã, đều thấy. Công cụ kiểm
      của Docker bắt được mật khẩu, nhưng không hề cảnh báo nhãn mới nhất ở dòng đầu
      của tệp. Bí mật phải đưa vào lúc chạy, bằng biến được che của đường ống hoặc
      kho bí mật của Kubernetes. Kho bí mật đó mặc định lưu không mã hoá, nên người
      vận hành cụm phải bật mã hoá khi lưu.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Triển khai xong chưa
      phải phát hành an toàn. Không có <code>readinessProbe</code> thì Pod nhận yêu
      cầu khi Java chưa khởi động xong; không chuẩn bị quay lui thì lỗi kéo dài.

      <br><span class="note">Cách chữa: khai báo phép kiểm sẵn sàng; quay lui bằng
      <code>kubectl rollout undo deployment/chuyen-tien</code> về bản trước.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, là coi triển khai xong là phát hành
      an toàn. Không có phép kiểm sẵn sàng thì bản chạy nhận yêu cầu khi Java chưa
      khởi động xong. Cách chữa là khai báo phép kiểm sẵn sàng, và chuẩn bị sẵn lệnh
      quay lui đối tượng triển khai về bản trước.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_rolling_bounds(6, 2, 1) == (4, 7)
  - 'alg.bnx_pipeline([''build'', ''test'', ''package'', ''deploy''], {''build'':
    ''build'', ''test'': ''test'', ''package'': ''package'', ''deploy'': ''deploy''},
    {''package''})[''deploy''] == ''skipped'''
  - 3 * 250 == 750 < 900 and 4 * 250 == 1000 >= 900
  - alg.bnx_rolling_summary(4, 0, 1) == (4, 4, 5) and alg.bnx_rolling_summary(4, 1,
    1)[0] == 2
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Deployment
      6 bản, <code>maxUnavailable: 2</code>, <code>maxSurge: 1</code>. Sẵn sàng tối
      thiểu bao nhiêu? Tối đa bao nhiêu Pod?</td></tr><tr><td>2</td><td>Đường ống:
      build và test thành công, package hỏng. Job deploy có chạy không? Máy chủ chạy
      ảnh thẻ nào?</td></tr><tr><td>3</td><td>Quyết định: 4 bản, mỗi Pod chịu 250
      giao dịch/giây, tải 900 (số minh hoạ). Chọn (maxUnavailable 1, maxSurge 1) hay
      (0, 1)?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, sáu bản, được thiếu tối đa hai,
      được thừa tối đa một, thì sẵn sàng tối thiểu và số bản chạy tối đa là bao nhiêu?
      Câu hai, đóng gói hỏng thì việc triển khai có chạy không, và máy chủ chạy ảnh
      thẻ nào? Câu ba là một quyết định có đánh đổi về sức chứa lúc cập nhật, số liệu
      trên màn hình đều là số minh hoạ. Hãy dừng video lại và làm ra giấy trước.
  - show: '<p>Câu 1:</p>

      $$6 - 2 = \hlg{4} \text{ sẵn sàng tối thiểu} \qquad 6 + 1 = \hl{7} \text{ Pod
      tối đa}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bây giờ ta xem đáp án câu một. Được thiếu tối đa hai nên sẵn sàng tối thiểu
      là sáu trừ hai bằng bốn. Được thừa tối đa một nên tối đa là sáu cộng một bằng
      bảy bản chạy.
    clear: true
  - show: '<p>Câu 2: package hỏng → giai đoạn deploy <b>không chạy</b>; không có ảnh
      mới được đẩy, máy chủ vẫn chạy <code>:0eac7e6a</code>.</p>'
    say: Tiếp theo là đáp án của câu hai. Đóng gói hỏng nên giai đoạn triển khai không
      chạy, vì giai đoạn sau chỉ chạy khi giai đoạn trước thành công. Không có ảnh
      mới nào được đẩy lên, nên máy chủ vẫn chạy ảnh thẻ cũ không e a c bảy e sáu
      a.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>sức chứa lúc cập nhật</th><th>được</th><th>mất</th></tr><tr><td>(1,
      1)</td><td>$3 \cdot 250 = 750$, thiếu so với 900</td><td>nhanh: 2 đợt chờ; chỉ
      cần chỗ cho 1 Pod thêm</td><td><b class=''red''>quá tải</b> suốt lúc cập nhật</td></tr><tr><td>(0,
      1)</td><td>$4 \cdot 250 = 1000$, đủ cho 900</td><td>luôn đủ 4 bản phục vụ</td><td>cần
      chỗ cho Pod thứ 5; chậm hơn: 4 đợt chờ thay vì 2</td></tr></table>'
    say: Cuối cùng là đáp án của câu ba. Được thiếu một thì lúc cập nhật chỉ còn ba
      nhân hai trăm năm mươi bằng bảy trăm năm mươi, nhỏ hơn chín trăm, nên quá tải.
      Không được thiếu thì luôn còn bốn nhân hai trăm năm mươi bằng một nghìn, đủ
      chịu tải. Đổi lại cụm phải có chỗ cho bản thứ năm, và mỗi đợt chỉ thay một bản,
      nên cần bốn đợt chờ thay vì hai. Vậy giờ cao điểm nên chọn không được thiếu,
      hoặc dời việc cập nhật sang giờ thấp điểm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>commit</span><span class=''a''>→</span><span
      class=''n''>đường ống 4 giai đoạn: hỏng thì dừng</span><span class=''a''>→</span><span
      class=''n''>ảnh gắn mã commit</span><span class=''a''>→</span><span class=''n''>cuốn
      chiếu: ≥ 3 sẵn sàng, ≤ 5 Pod</span><span class=''a''>→</span><span class=''n''>kiểm
      sẵn sàng + quay lui</span></div>'
    say: Bây giờ ta tổng kết lại chuỗi logic. Mỗi lần chốt đi qua đường ống bốn giai
      đoạn, hỏng ở đâu thì dừng ở đó. Ảnh tạo ra được gắn thẻ là mã chốt. Kubernetes
      thay bản theo kiểu cuốn chiếu, luôn ít nhất ba bản sẵn sàng và nhiều nhất năm
      bản chạy. Cuối cùng là kiểm sẵn sàng và đường quay lui.
  - show: <div class='box key'><b>Tư duy:</b> mỗi thứ chạy trên máy chủ phải trả lời
      được “từ commit nào?”. Bí mật không nằm trong ảnh, trong tệp đường ống hay trong
      lịch sử Git.</div>
    say: Và đây là điều cần mang theo sau bài. Mọi thứ chạy trên máy chủ phải trả
      lời được câu hỏi từ lần chốt nào, và bí mật không bao giờ nằm trong ảnh, trong
      tệp đường ống hay trong lịch sử kho mã.
  - show: '<p class=''note''>Bài 14: chia hệ thống ngân hàng thành những vùng có ranh
      giới rõ, và đặt một cổng vào chung trước các dịch vụ.</p>'
    forward_ref: true
    say: Ở bài mười bốn, ta học cách chia hệ thống ngân hàng thành những vùng có ranh
      giới rõ, và đặt một cổng vào chung đứng trước các dịch vụ.
