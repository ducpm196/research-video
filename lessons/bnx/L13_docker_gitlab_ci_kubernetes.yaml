objectives:
- Đọc Dockerfile của dịch vụ Java và sắp thứ tự lệnh để tận dụng bộ nhớ đệm
- Đọc tệp .gitlab-ci.yml và thứ tự các giai đoạn
- Khai báo Deployment và tính số Pod khi cập nhật cuốn chiếu
- Nêu cách gắn thẻ ảnh bằng mã commit để truy ngược
- Tính số đợt và thời gian cập nhật cuốn chiếu khi số bản tăng từ 4 lên 40 và 400,
  và so thiếu 1 thừa 1 với mặc định 25%
- Viết chương trình Python tìm các lớp Dockerfile phải dựng lại và tính số đợt cập
  nhật cuốn chiếu
