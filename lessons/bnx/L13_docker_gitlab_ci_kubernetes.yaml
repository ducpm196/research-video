scenes:
- id: hook
  kind: hook
  title: Bản mới lên lúc 17 giờ, khách báo lỗi lúc 17 giờ 10
  steps:
  - show: '<p>Chiều thứ Sáu, bản mới của dịch vụ chuyển tiền chạy trên <b>4</b> bản
      trong cụm Kubernetes (hệ thống chạy dịch vụ trên nhiều máy). Mười phút sau,
      tổng đài báo khách chuyển tiền lỗi <span class=''note''>(tình huống minh hoạ)</span>.</p>

      <div class="box warn">Đang chạy bản nào? Bản đó làm từ dòng mã nào, đã qua kiểm
      thử chưa? Quay về bản cũ có làm khách gián đoạn không?</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, chiều thứ Sáu bản mới của dịch vụ chuyển tiền vừa chạy trên bốn
      bản trong cụm Kubernetes, tức hệ thống chạy dịch vụ trên nhiều máy, đây là tình
      huống minh hoạ. Mười phút sau tổng đài báo khách chuyển tiền bị lỗi. Câu hỏi
      đầu tiên là máy chủ chạy bản nào, từ dòng mã nào, đã qua kiểm thử chưa.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>đóng
      gói dịch vụ Java thế nào?</td><td>tệp dựng ảnh: phụ thuộc trước, mã sau; ghim
      (cố định) ảnh nền</td></tr><tr><td>ai chặn bản lỗi trước khi lên máy chủ?</td><td>đường
      ống 4 giai đoạn: test hỏng thì package và deploy không chạy</td></tr><tr><td>thay
      bản mà khách không gián đoạn?</td><td>thay dần: ≥ 3 sẵn sàng, ≤ 5 chạy; quay
      về bản cũ cũng thay dần</td></tr><tr><td>truy ngược từ máy chủ về mã?</td><td>thẻ
      ảnh = 8 ký tự đầu của mã commit</td></tr><tr><td>400 bản thì thay hết mất bao
      lâu?</td><td>đếm số đợt thay ở 4, 40 và 400 bản (mô phỏng)</td></tr></table>'
    say: Bài này đi hết con đường từ một lần chốt mã tới máy chủ. Tệp công thức dựng
      ảnh đóng gói dịch vụ Java, và đường ống bốn giai đoạn chặn bản lỗi. Thay dần
      giúp khách không thấy gián đoạn, còn thẻ ảnh mang mã chốt để truy ngược về mã.
- id: prereq
  kind: prereq
  title: 'Trước hết: sáu điều cần hiểu'
  checks:
  - 4 - 1 == 3 and Fraction(3, 4) == Fraction(75, 100)
  - alg.bnx_rolling_bounds(4, 1, 1)[0] == 3
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      container</td><td>tiến trình chạy cô lập: có <b>hệ tệp</b> (cây thư mục và tệp
      nó nhìn thấy), mạng, giới hạn bộ nhớ riêng; mọi container trên một máy dùng
      chung <b>nhân</b> (lõi của hệ điều hành, điều khiển phần cứng)</td><td>dịch
      vụ chuyển tiền</td></tr><tr><td>② ảnh (image)</td><td>gói chỉ đọc gồm hệ tệp
      và lệnh khởi động; chạy ảnh thì được container</td><td><code>chuyen-tien:0eac7e6a</code></td></tr><tr><td>③
      tệp jar</td><td>Java gói mã đã biên dịch thành một tệp, chạy bằng <code>java
      -jar</code></td><td><code>app.jar</code></td></tr><tr><td>④ cụm, Kubernetes</td><td>cụm:
      nhiều máy chủ gom lại; Kubernetes: phần mềm đặt container lên các máy trong
      cụm và giữ đủ số bản</td><td>cụm 3 máy, 4 bản</td></tr><tr><td>⑤ cập nhật cuốn
      chiếu</td><td>thay dần bản cũ bằng bản mới, luôn còn bản phục vụ khách</td><td>4
      bản, thay dần</td></tr><tr><td>⑥ mã chốt, Dockerfile, YAML</td><td>mã chốt (commit):
      mã nhận dạng một lần lưu mã vào kho Git; Dockerfile: tệp công thức dựng ảnh;
      YAML: định dạng cấu hình viết bằng dòng thụt lề</td><td><code>0eac7e6a…</code></td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    introduces:
    - bnx_cuon_chieu
    - bnx_dockerfile
    say: Trước hết ta cần hiểu sáu điều, một, tiến trình cô lập có cây thư mục, mạng
      và bộ nhớ riêng, nhưng dùng chung nhân, tức lõi của hệ điều hành. Hai, ảnh là
      gói chỉ đọc để chạy ra tiến trình đó. Ba, tệp đóng gói là mã Java đã biên dịch.
      Bốn, cụm là nhiều máy gom lại, còn Kubernetes đặt tiến trình lên máy trong cụm.
      Năm, cập nhật cuốn chiếu thay dần bản cũ nên luôn còn bản phục vụ. Sáu, mã chốt
      nhận dạng một lần lưu mã vào kho Git.
  - show: $$4 - 1 = \hl{3} \text{ bản phục vụ khi đang thay 1 bản}, \qquad \frac{3}{4}
      = 75\%$$
    introduces:
    - frac
    clear: true
    say: 'Ví dụ số nhỏ: có bốn bản, thay một bản thì còn ba bản phục vụ, tức ba phần
      tư, bằng bảy mươi lăm phần trăm sức chứa.'
- id: sym
  kind: symbol
  title: Giải mã các từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>phụ
      thuộc</td><td>thư viện người khác viết mà dự án dùng, ví dụ Spring</td></tr><tr><td>Maven,
      lệnh <code>mvn</code></td><td>công cụ dựng của Java: tải phụ thuộc, biên dịch,
      chạy kiểm thử, đóng gói thành jar; <code>-q</code>: in ít chữ; <code>dependency:go-offline</code>:
      tải trước mọi phụ thuộc</td></tr><tr><td><code>pom.xml</code></td><td>tệp khai
      báo dự án và danh sách phụ thuộc cho Maven</td></tr><tr><td><code>-DskipTests</code></td><td>bỏ
      chạy kiểm thử lúc đóng gói, vì đường ống đã có giai đoạn kiểm thử riêng</td></tr></table>'
    say: Bảng đầu giải mã các từ của Java. Phụ thuộc là thư viện người khác viết mà
      dự án dùng, và công cụ dựng tải chúng về trước rồi biên dịch, kiểm thử, đóng
      gói. Tuỳ chọn cuối bỏ kiểm thử lúc đóng gói, vì đường ống đã có giai đoạn riêng.
  - show: <table class='t'><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td><code>FROM
      ảnh AS build</code></td><td>chọn ảnh nền; <code>AS build</code> đặt tên giai
      đoạn dựng</td></tr><tr><td><code>COPY</code> / <code>RUN</code></td><td>chép
      tệp vào ảnh / chạy một lệnh lúc dựng; mỗi lệnh tạo một <b>lớp</b></td></tr><tr><td><code>COPY
      --from=build</code></td><td>chỉ lấy tệp jar từ giai đoạn dựng; ảnh chạy không
      chứa mã nguồn và công cụ dựng</td></tr><tr><td><code>WORKDIR</code> / <code>EXPOSE</code>
      / <code>ENV</code></td><td>thư mục làm việc cho các lệnh sau / ghi chú cổng
      dịch vụ lắng nghe / đặt biến môi trường, một cặp tên=giá trị</td></tr><tr><td><code>USER</code>
      / <code>ENTRYPOINT</code></td><td>chạy bằng người dùng không phải quản trị /
      lệnh khởi động khi container chạy</td></tr><tr><td>thẻ ảnh <code>tên:thẻ</code></td><td>tên
      phiên bản của ảnh; <code>…-jre</code> là Java chỉ có phần chạy chương trình,
      không có công cụ biên dịch; <code>latest</code> chỉ là một thẻ bình thường,
      không tự là “bản mới nhất”</td></tr></table>
    introduces:
    - bnx_workdir_expose
    clear: true
    say: Bảng thứ hai giải mã tệp dựng ảnh. Lệnh đầu chọn ảnh nền, mỗi lệnh chép hay
      chạy tạo một lớp, và lệnh chép từ giai đoạn dựng chỉ lấy tệp đóng gói nên ảnh
      gọn. Thẻ ảnh là tên phiên bản, còn nhãn mới nhất chỉ là một thẻ thường.
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>đường ống
      (GitLab CI)</td><td>mỗi lần đẩy commit lên kho GitLab, máy chạy đường ống đọc
      tệp <code>.gitlab-ci.yml</code> và tự chạy các việc trong đó</td></tr><tr><td>stage
      / job</td><td>giai đoạn / việc; job cùng giai đoạn chạy song song</td></tr><tr><td>kho
      ảnh (registry)</td><td>nơi lưu ảnh; <code>docker push</code> đẩy ảnh lên, máy
      trong cụm kéo ảnh về để chạy</td></tr><tr><td><code>CI_COMMIT_SHORT_SHA</code></td><td>biến
      có sẵn: 8 ký tự đầu của mã commit đang dựng</td></tr><tr><td><code>CI_REGISTRY_USER</code>,
      <code>CI_REGISTRY_PASSWORD</code></td><td>tài khoản đường ống cấp sẵn để đẩy
      ảnh lên kho ảnh của dự án; mật khẩu chỉ dùng được khi job đang chạy</td></tr></table>'
    introduces:
    - bnx_kho_anh
    clear: true
    say: Bảng thứ ba giải mã đường ống. Mỗi lần đẩy một lần chốt lên kho mã, máy tự
      chạy các việc theo giai đoạn, rồi đẩy ảnh lên kho ảnh với thẻ là tám ký tự đầu
      của mã chốt.
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>Pod</td><td>bản
      chạy nhỏ nhất Kubernetes quản lý, ở đây gồm một container</td></tr><tr><td>Deployment,
      <code>replicas</code></td><td>đối tượng khai báo “muốn có 4 bản của ảnh này”</td></tr><tr><td>nhãn,
      bộ chọn</td><td>nhãn là cặp tên = giá trị gắn lên Pod (<code>app: chuyen-tien</code>);
      bộ chọn tìm mọi Pod có nhãn đó</td></tr><tr><td>bộ điều khiển</td><td>chương
      trình trong Kubernetes liên tục so số bản muốn với số bản thật rồi tạo, xoá
      Pod cho khớp</td></tr><tr><td><code>maxUnavailable</code> / <code>maxSurge</code></td><td>lúc
      cập nhật: được thiếu tối đa / được thừa tối đa bao nhiêu bản so với <code>replicas</code></td></tr><tr><td><code>readinessProbe</code>,
      <code>kubectl</code></td><td>phép kiểm sẵn sàng: chỉ nhận yêu cầu khi trả lời
      được đường dẫn kiểm / lệnh gửi yêu cầu tới Kubernetes</td></tr></table>'
    introduces:
    - bnx_pod
    clear: true
    say: Bảng cuối giải mã Kubernetes, đối tượng triển khai khai báo muốn có bốn bản,
      nhãn gắn lên bản chạy và bộ chọn tìm mọi bản mang nhãn đó. Bộ điều khiển so
      số bản muốn với số bản thật rồi tạo hay xoá cho khớp.
