      quay lui về “latest” vô nghĩa.</div><div class="code"><div>FROM eclipse-temurin:latest</div><div>ENV
      DB_PASSWORD=MatKhau123</div><div>COPY . /app</div><div>ENTRYPOINT ["java", "-jar",
      "/app/app.jar"]</div></div>'
    focus:
    - 1
    - 2
    say: Lỗi của người mới là dùng nhãn mới nhất cho ảnh chạy thật. Hai lần kéo có
      thể ra hai ảnh khác nhau, nên hãy ghim phiên bản ảnh nền và gắn thẻ ảnh bằng
      mã chốt.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Mật khẩu trong <code>ENV</code>
      của Dockerfile hay trong tệp đường ống: ai kéo ảnh, ai đọc kho mã đều thấy.
      <span class="note">Kiểm tệp vừa xem: chỉ <code>ENV</code> bị báo, còn <code>FROM
      eclipse-temurin:latest</code> không bị báo. Secret của Kubernetes (đối tượng
      lưu mật khẩu, khoá cho Pod dùng) mặc định lưu <b>không mã hoá</b>: nhớ bật mã
      hoá khi lưu.</span></div><p><b>Kết quả chạy thật (Docker 28): docker build --check,
      lệnh chỉ kiểm tệp dựng ảnh, không dựng</b></p><div class="code"><div>Check complete,
      1 warning has been found!</div><div>WARNING: SecretsUsedInArgOrEnv - https://docs.docker.com/go/…</div><div>Do
      not use ARG or ENV instructions for sensitive data …</div><div>   2 | &gt;&gt;&gt;
      ENV DB_PASSWORD=MatKhau123</div></div>'
    focus:
    - 1
    - 2
    introduces:
    - bnx_secret_k8s
    clear: true
    say: Lỗi của người đã đi làm là ghi mật khẩu vào tệp dựng ảnh hay tệp đường ống,
      vì ai kéo ảnh hay đọc kho mã đều thấy. Bí mật phải đưa vào lúc chạy, và kho
      bí mật của Kubernetes mặc định không mã hoá nên phải bật.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Triển khai xong chưa
      phải phát hành an toàn. Không có <code>readinessProbe</code> thì Pod nhận yêu
      cầu khi Java chưa khởi động xong; không chuẩn bị quay lui thì lỗi kéo dài.

      <br><span class="note">Cách chữa: khai báo phép kiểm sẵn sàng; quay lui bằng
      <code>kubectl rollout undo deployment/chuyen-tien</code> về bản trước.</span></div>

      '
    clear: true
    say: Lỗi thứ ba là coi triển khai xong là phát hành an toàn. Không có phép kiểm
      sẵn sàng thì bản chạy nhận yêu cầu khi Java chưa khởi động xong. Nên hãy khai
      báo phép kiểm và chuẩn bị lệnh quay lui, cũng là một lần cập nhật cuốn chiếu.
