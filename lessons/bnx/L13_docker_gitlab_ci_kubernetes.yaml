id: L13
course: BNX
series: BNX · Backend ngân hàng mở rộng theo JD
title: 'Bài 13 — Từ commit tới máy chủ: Dockerfile, GitLab CI và triển khai lên Kubernetes'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/bnx.yaml L13; audit/bnx/verify_bnx.py L13; docs.gitlab.com CI/CD
  YAML syntax reference (stages), Predefined CI/CD variables, Build and push container
  images (đọc 2026-11-11); kubernetes.io Deployments, Secrets (đọc 2026-11-11); mã
  nguồn Kubernetes pkg/controller/deployment/rolling.go, util/deployment_util.go (đọc
  2026-11-11); docs.docker.com Build cache, Building best practices (đọc 2026-11-11);
  docker build --check, Docker 28 (OBSERVED 2026-11-11)
assumes: []
objectives:
- Viết Dockerfile cho dịch vụ Java theo thứ tự tận dụng bộ nhớ đệm
- Đọc tệp .gitlab-ci.yml và thứ tự các giai đoạn
- Khai báo Deployment và tính số Pod khi cập nhật cuốn chiếu
- Gắn ảnh với mã commit để truy ngược
asr_reviewed:
  - {sentence: "Phép tính thứ năm nối với sức chứa.", reason: "ASR chép “Phép tính thử nằm nổi với sức chứa.” (0.625): lệch âm/thanh thuần Việt: thứ năm nối/thử nằm nổi — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng thứ hai giải mã tệp dựng ảnh.", reason: "ASR chép “Bản thứ hai giải mã tệp dừng ảnh” (0.75): lệch âm/thanh thuần Việt: bảng/bản, dựng/dừng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bây giờ tới phần bạn tự làm bài.", reason: "ASR chép “Bây giờ tới phần bạn tự lam bay.” (0.75): lệch âm/thanh thuần Việt: làm bài/lam bay — NOT_VERIFIED bằng tai người"}
scenes:
- id: hook
  kind: hook
  title: Bản mới lên lúc 17 giờ, khách báo lỗi lúc 17 giờ 10
  steps:
  - show: '<p>Chiều thứ Sáu, bản mới của dịch vụ chuyển tiền chạy trên <b>4</b> bản
      trong cụm Kubernetes. Mười phút sau, tổng đài báo khách chuyển tiền lỗi <span
      class=''note''>(tình huống minh hoạ)</span>.</p>

      <div class="box warn">Đang chạy bản nào? Bản đó làm từ dòng mã nào, đã qua kiểm
      thử chưa? Quay về bản cũ có làm khách gián đoạn không?</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, chiều thứ Sáu, bản mới của dịch vụ chuyển tiền vừa chạy trên bốn
      bản trong cụm Kubernetes, đây là tình huống minh hoạ. Mười phút sau, tổng đài
      báo khách chuyển tiền bị lỗi. Câu đầu tiên ai cũng hỏi là máy chủ đang chạy
      bản nào, làm từ dòng mã nào, đã qua kiểm thử chưa.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>đóng
      gói dịch vụ Java thế nào cho nhanh và chắc?</td><td>Dockerfile: tệp phụ thuộc
      trước, mã sau; ghim phiên bản ảnh nền</td></tr><tr><td>ai chặn bản lỗi trước
      khi lên máy chủ?</td><td>đường ống 4 giai đoạn: test hỏng thì package và deploy
      không chạy</td></tr><tr><td>thay bản mà khách không thấy gián đoạn?</td><td>cập
      nhật cuốn chiếu: 4 bản, luôn ≥ 3 sẵn sàng, ≤ 5 Pod</td></tr><tr><td>truy ngược
      từ máy chủ về mã?</td><td>thẻ ảnh = 8 ký tự đầu của mã commit</td></tr></table>'
    say: Bài này đi hết con đường từ một lần chốt mã tới máy chủ. Tệp dựng ảnh đóng
      gói dịch vụ Java. Đường ống bốn giai đoạn chặn bản lỗi trước khi lên máy chủ.
      Cập nhật cuốn chiếu thay bản mà khách không thấy gián đoạn. Và thẻ ảnh mang
      mã chốt, để truy ngược từ máy chủ về đúng dòng mã.
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - 4 - 1 == 3 and Fraction(3, 4) == Fraction(75, 100)
  - alg.bnx_rolling_bounds(4, 1, 1)[0] == 3
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      container</td><td>tiến trình chạy cô lập: hệ tệp, mạng, giới hạn bộ nhớ riêng,
      dùng chung nhân hệ điều hành</td><td>dịch vụ chuyển tiền</td></tr><tr><td>②
      ảnh (image)</td><td>gói chỉ đọc gồm hệ tệp và lệnh khởi động; chạy ảnh thì được
      container</td><td><code>chuyen-tien:0eac7e6a</code></td></tr><tr><td>③ tệp jar</td><td>Java
      gói mã đã biên dịch thành một tệp, chạy bằng <code>java -jar</code></td><td><code>app.jar</code></td></tr><tr><td>④
      cụm, Kubernetes</td><td>cụm: nhiều máy chủ gom lại chạy chung; Kubernetes: phần
      mềm đặt container lên các máy trong cụm và tự giữ đủ số bản</td><td>cụm 3 máy,
      4 bản</td></tr><tr><td>⑤ cập nhật cuốn chiếu</td><td>thay dần bản cũ bằng bản
      mới, luôn còn bản phục vụ khách</td><td>4 bản, thay dần</td></tr></table>'
    say: Trước hết ta cần hiểu năm điều sẽ dùng trong bài. Một tiến trình cô lập có
      hệ tệp, mạng và bộ nhớ riêng, nhưng dùng chung nhân hệ điều hành của máy. Ảnh
      là gói chỉ đọc gồm hệ tệp và lệnh khởi động, chạy ảnh thì được một tiến trình
      như vậy. Java gói mã đã biên dịch thành một tệp đóng gói duy nhất. Cụm là nhiều
      máy chủ gom lại, còn Kubernetes đặt các tiến trình lên máy trong cụm và tự giữ
      đủ số bản. Cập nhật cuốn chiếu thay dần bản cũ bằng bản mới, nên lúc nào cũng
      còn bản phục vụ khách.
  - show: $$4 - 1 = \hl{3} \text{ bản phục vụ khi đang thay 1 bản}, \qquad \frac{3}{4}
      = 75\%$$
    introduces:
    - frac
    clear: true
    say: Ta xem ngay một ví dụ số nhỏ. Có bốn bản, đang thay một bản thì còn bốn trừ
      một bằng ba bản phục vụ, tức ba phần tư, bằng bảy mươi lăm phần trăm sức chứa.
- id: sym
  kind: symbol
  title: Giải mã các từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>phụ
      thuộc</td><td>thư viện người khác viết mà dự án dùng, ví dụ Spring</td></tr><tr><td>Maven,
      lệnh <code>mvn</code></td><td>công cụ dựng của Java: tải phụ thuộc, biên dịch,
      chạy kiểm thử, đóng gói thành jar</td></tr><tr><td><code>pom.xml</code></td><td>tệp
      khai báo dự án và danh sách phụ thuộc cho Maven</td></tr><tr><td><code>-DskipTests</code></td><td>bỏ
      chạy kiểm thử lúc đóng gói, vì đường ống đã có giai đoạn kiểm thử riêng</td></tr></table>'
    say: Bảng đầu giải mã bốn từ của Java. Phụ thuộc là thư viện người khác viết mà
      dự án dùng, ví dụ Spring. Công cụ dựng của Java tải phụ thuộc, biên dịch, kiểm
      thử và đóng gói, theo tệp khai báo dự án. Tuỳ chọn cuối bỏ kiểm thử lúc đóng
      gói, vì đường ống đã có giai đoạn kiểm thử riêng.
  - show: <table class='t'><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td><code>FROM
      ảnh AS build</code></td><td>chọn ảnh nền; <code>AS build</code> đặt tên giai
      đoạn dựng</td></tr><tr><td><code>COPY</code> / <code>RUN</code></td><td>chép
      tệp vào ảnh / chạy một lệnh lúc dựng; mỗi lệnh tạo một <b>lớp</b></td></tr><tr><td><code>COPY
      --from=build</code></td><td>chỉ lấy tệp jar từ giai đoạn dựng; ảnh chạy không
      chứa mã nguồn và công cụ dựng</td></tr><tr><td><code>USER</code> / <code>ENTRYPOINT</code></td><td>chạy
      bằng người dùng không phải quản trị / lệnh khởi động khi container chạy</td></tr><tr><td>thẻ
      ảnh <code>tên:thẻ</code></td><td>tên phiên bản của ảnh; <code>latest</code>
      chỉ là một thẻ bình thường, không tự là “bản mới nhất”</td></tr></table>
    clear: true
    say: Bảng thứ hai giải mã tệp dựng ảnh. Lệnh đầu chọn ảnh nền và đặt tên cho giai
      đoạn dựng. Lệnh chép tệp và lệnh chạy, mỗi lệnh tạo ra một lớp trong ảnh. Lệnh
      chép từ giai đoạn dựng chỉ lấy tệp đóng gói, nên ảnh chạy gọn và sạch. Thẻ ảnh
      là tên phiên bản, còn nhãn mới nhất chỉ là một thẻ bình thường, không tự nghĩa
      là bản mới nhất.
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>đường ống
      (GitLab CI)</td><td>mỗi lần đẩy commit lên kho GitLab, máy chạy đường ống đọc
      tệp <code>.gitlab-ci.yml</code> và tự chạy các việc trong đó</td></tr><tr><td>stage
      / job</td><td>giai đoạn / việc; job cùng giai đoạn chạy song song</td></tr><tr><td>kho
      ảnh (registry)</td><td>nơi lưu ảnh; <code>docker push</code> đẩy ảnh lên, máy
      trong cụm kéo ảnh về để chạy</td></tr><tr><td><code>CI_COMMIT_SHORT_SHA</code></td><td>biến
      có sẵn: 8 ký tự đầu của mã commit đang dựng</td></tr><tr><td><code>CI_REGISTRY_USER</code>,
      <code>CI_REGISTRY_PASSWORD</code></td><td>tài khoản đường ống cấp sẵn để đẩy
      ảnh lên kho ảnh của dự án; mật khẩu chỉ dùng được khi job đang chạy</td></tr></table>'
    clear: true
    say: Bảng thứ ba giải mã đường ống. Mỗi lần ta đẩy một lần chốt lên kho mã, máy
      chạy đường ống đọc tệp đường ống và tự chạy các việc trong đó. Các việc chia
      theo giai đoạn, việc cùng giai đoạn chạy song song. Đường ống đẩy ảnh lên kho
      ảnh, còn máy trong cụm kéo ảnh về để chạy. Biến mã chốt ngắn là tám ký tự đầu
      của mã chốt, còn hai biến cuối là tài khoản đường ống cấp sẵn để đẩy ảnh.
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>Pod</td><td>bản
      chạy nhỏ nhất Kubernetes quản lý, ở đây gồm một container</td></tr><tr><td>Deployment,
      <code>replicas</code></td><td>đối tượng khai báo “muốn có 4 bản của ảnh này”</td></tr><tr><td>nhãn,
      bộ chọn</td><td>nhãn là cặp tên = giá trị gắn lên Pod (<code>app: chuyen-tien</code>);
      bộ chọn tìm mọi Pod có nhãn đó</td></tr><tr><td>bộ điều khiển</td><td>chương
      trình trong Kubernetes liên tục so số bản muốn với số bản thật rồi tạo, xoá
      Pod cho khớp</td></tr><tr><td><code>maxUnavailable</code> / <code>maxSurge</code></td><td>lúc
      cập nhật: được thiếu tối đa / được thừa tối đa bao nhiêu bản so với <code>replicas</code></td></tr><tr><td><code>readinessProbe</code>,
      <code>kubectl</code></td><td>phép kiểm sẵn sàng: chỉ nhận yêu cầu khi trả lời
      được đường dẫn kiểm / lệnh gửi yêu cầu tới Kubernetes</td></tr></table>'
    clear: true
    say: Bảng cuối giải mã Kubernetes. Bản chạy là đơn vị nhỏ nhất, còn đối tượng
      triển khai khai báo muốn có bốn bản của một ảnh. Nhãn gắn lên bản chạy, bộ chọn
      tìm mọi bản chạy mang nhãn đó. Bộ điều khiển liên tục so số bản muốn với số
      bản thật, rồi tạo hay xoá cho khớp. Hai tham số cập nhật là số được thiếu và
      số được thừa. Hàng cuối là phép kiểm sẵn sàng và lệnh điều khiển cụm.
