    clear: true
    say: Hình thứ ba là luồng của API mở theo Thông tư sáu mươi tư, ban hành ngày
      ba mươi mốt tháng mười hai năm hai nghìn không trăm hai mươi tư. Bước một, khách
      hàng là chủ dữ liệu, đồng ý một cách rõ ràng, tự nguyện. Bước hai, bên thứ ba
      đã ký hợp đồng với ngân hàng mới được gọi API mở. Ngân hàng chỉ trả dữ liệu
