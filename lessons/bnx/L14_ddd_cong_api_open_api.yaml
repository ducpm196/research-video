- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Tưởng DDD <b class="red">bắt
      buộc</b> tách thành nhiều microservice (dịch vụ nhỏ chạy riêng, gọi nhau qua
      mạng). DDD vẽ ranh giới trước; ranh giới đó có thể là <b>mô-đun</b> (khối mã
      có ranh giới rõ) <b>trong một ứng dụng</b>, cách triển khai tính sau.</div>
    say: Lỗi của người mới là tưởng thiết kế hướng miền bắt buộc tách thành nhiều
      dịch vụ nhỏ chạy riêng. Thiết kế hướng miền vẽ ranh giới trước, ranh giới đó
      có thể chỉ là các mô-đun, tức khối mã tách bạch, trong một ứng dụng.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Cổng đã kiểm mã nên
      dịch vụ <b class="red">bỏ kiểm quyền</b>. Nếu cổng không được cấu hình kiểm
      phạm vi, mã <code>accounts:read</code> hợp lệ vẫn qua cổng; khi đó nếu dịch
      vụ Thanh toán không tự kiểm phạm vi <code>payments:write</code>, lệnh chuyển
      tiền sẽ chạy.

      <br><span class="note">Phép thử bắt lỗi: gọi thẳng dịch vụ bằng mã sai phạm
      vi, phải nhận 403.</span></div>

      '
    clear: true
    say: Lỗi của người đã đi làm là nghĩ cổng đã kiểm mã nên dịch vụ bỏ kiểm quyền.
      Nếu cổng không kiểm phạm vi, mã chỉ có quyền đọc vẫn qua cổng, và dịch vụ Thanh
      toán không tự kiểm thì lệnh chuyển tiền sẽ chạy.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Bên thứ ba đã có
      thông tin kết nối là <b class="red">trả mọi dữ liệu</b>. Theo Thông tư 64, cần
      hợp đồng với bên thứ ba <b>và</b> sự đồng ý của khách, chỉ trả đúng phạm vi
      đã đồng ý; khách rút lại thì dừng.

      <br><span class="note">Phép thử bắt lỗi: khách rút lại sự đồng ý, lần gọi kế
      tiếp phải bị từ chối.</span></div>

      '
    clear: true
    say: Lỗi thứ ba cũng của người đã đi làm là thấy bên thứ ba có thông tin kết nối
      thì trả mọi dữ liệu. Theo Thông tư sáu mươi tư cần hợp đồng và sự đồng ý của
      khách, chỉ trả đúng phạm vi, và khách rút lại thì phải dừng.
