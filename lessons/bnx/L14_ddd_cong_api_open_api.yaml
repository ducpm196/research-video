    say: 'Đáp án câu hai: mỗi lần nhận thùng mất nửa thẻ. Trước yêu cầu thứ năm còn
      ba trừ bốn nhân một nửa bằng một thẻ nên nhận, yêu cầu thứ sáu chỉ có nửa thẻ
      nên từ chối. Vậy nhận năm, khớp với cận trên năm phẩy năm.'
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th><th>đổi
      khi</th></tr><tr><td>một ứng dụng, hai mô-đun</td><td>chuyển tiền và ghi sổ
      trong một giao dịch, một lần chốt; triển khai một lần</td><td>phải giữ kỷ luật:
      mô-đun này không đọc bảng của mô-đun kia</td><td>hai phần cần nhịp phát hành
      hoặc mức tải khác hẳn nhau (đo được)</td></tr><tr><td>hai dịch vụ riêng</td><td>triển
      khai, co giãn độc lập</td><td>giao dịch vượt hai dịch vụ phải dùng SAGA (chuỗi
      bước, mỗi bước có bước huỷ bù lại nếu bước sau hỏng) và Outbox (ghi tin cần
      gửi ngay trong giao dịch rồi mới gửi đi, nên không mất tin); thêm lời gọi mạng,
      thêm chỗ hỏng</td><td>đội nhỏ, chưa đo thấy nghẽn: chưa cần</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.2'
    introduces:
    - bnx_saga_outbox
    clear: true
    say: 'Đáp án câu ba là một đánh đổi: hai mô-đun giữ chuyển tiền và ghi sổ trong
      một giao dịch, đổi lại phải giữ kỷ luật. Hai dịch vụ riêng triển khai độc lập,
      nhưng giao dịch vượt cả hai cần chuỗi bước bù trừ. Với đội năm người chưa đo
      thấy nghẽn, hai mô-đun là đủ.'
- id: practice
  kind: practice
  title: 'Tự làm: thùng token và nhiều bên cùng gọi'
  steps:
  - show: '<p><b>Đề</b>: cổng cho mỗi bên <code>rate = 4</code>, <code>cap = 6</code>.
      Viết <code>mau.py</code> với hàm <code>nhan(rate, cap, times)</code> dùng <code>Fraction</code>,
      rồi in:</p>

      <ol><li>20 yêu cầu <b>cùng lúc</b>: nhận / từ chối</li><li>20 yêu cầu <b>rải
      đều</b> cách nhau 1/10 giây: nhận, và cận trên <code>cap + rate × T</code></li>

      <li><b>50 bên</b> giống nhau, mỗi bên gửi dồn <b>20 yêu cầu</b> cùng lúc: tổng
      nhận / từ chối</li><li>hậu phương (các dịch vụ phía sau cổng) chịu 120 yêu cầu/giây:
      <b>bao nhiêu giây</b> để xử lý hết số đã qua cổng</li></ol>

      <p class="note">Số liệu khác ví dụ trong bài; đầu ra viết không dấu.</p>

      '
    focus:
    - 1
    - 2
    - 3
    pause: 120
    say: 'Bây giờ tới phần bạn tự làm: cổng cho mỗi bên bốn thẻ mỗi giây, sức chứa
      sáu. Viết hàm tính số yêu cầu nhận được cho hai mươi yêu cầu cùng lúc và rải
      đều, kèm cận trên. Rồi cho năm mươi bên gửi dồn, tính phía sau cổng chịu một
      trăm hai mươi yêu cầu mỗi giây cần bao nhiêu giây.'
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>dong 20 yeu cau: nhan
      6 tu choi 14</div><div>rai deu: nhan 13 can tren 13</div><div>50 ben dong: 300
      qua cong, 700 tu choi</div><div>hang cho 2.5 giay neu hau phuong chiu 120 yeu
      cau/giay</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh
      BNX L14 mau.py</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> dùng lại ý của hàm trong bài: thùng
      đầy lúc đầu, mỗi lần cộng <code>(t − last) × rate</code> nhưng không quá <code>cap</code>,
      còn ít nhất 1 thẻ thì nhận. Cận trên là <code>int(cap + rate × T)</code>. Tải
      của 50 bên là 50 lần số của một bên.

      Lời giải ở <code>labs/BNX/L14/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: 'Nếu kẹt, hãy dùng lại ý của hàm trong bài: thùng đầy lúc đầu, mỗi lần cộng
      thẻ theo thời gian trôi nhưng không quá sức chứa. Lời giải chỉ mở sau khi đã
      tự thử.'
  lab: labs/BNX/L14
  checks:
  - alg.bnx_l14_bucket(4, 6, [0] * 20) == 6 and 20 - alg.bnx_l14_bucket(4, 6, [0]
    * 20) == 14
  - alg.bnx_l14_bucket(4, 6, alg.bnx_l14_spread(20, 2)) == 13 == alg.bnx_l14_bound(4,
    6, Fraction(19, 10))
  - 50 * alg.bnx_l14_bucket(4, 6, [0] * 20) == 300 and 50 * 20 - 300 == 700
  - alg.bnx_l14_drain_s(300, 120) == 2.5
- id: recap
