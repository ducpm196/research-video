scenes:
- id: hook
  kind: hook
  title: 'Cửa vào của ngân hàng: 30 yêu cầu cùng một lúc'
  checks:
  - alg.bnx_l14_bucket(5, 10, [0] * 30) == 10
  - 30 - alg.bnx_l14_bucket(5, 10, [0] * 30) == 20
  - alg.bnx_l14_bucket(5, 10, alg.bnx_l14_spread(30)) == 14
  steps:
  - show: '<p>Từ $01/3/2025$, ngân hàng bắt đầu mở API (cửa để chương trình khác gọi
      vào) cho <b>bên thứ ba</b> (tổ chức khác ngoài ngân hàng và khách) theo Thông
      tư 64/2024/TT-NHNN, với lộ trình chuyển tiếp. Một ứng dụng bên thứ ba gửi $30$
      yêu cầu <b>cùng một lúc</b>.</p>

      <div class="box key">Cổng API cho mỗi bên $5$ yêu cầu/giây, sức chứa $10$ <i>(số
      minh hoạ)</i>: nhận $10$, từ chối $20$. Nếu $30$ yêu cầu <b>rải đều trong 1
      giây</b> thì nhận $14$.</div>

      '
    focus:
    - 1
    - 2
    - 2
    say: Chào bạn, từ một tháng ba năm hai nghìn không trăm hai mươi lăm, ngân hàng
      mở API, cửa cho chương trình khác, cho bên thứ ba theo Thông tư sáu mươi tư.
      Một ứng dụng bên thứ ba gửi ba mươi yêu cầu cùng lúc, mà cổng cho mỗi bên năm
      yêu cầu mỗi giây với sức chứa mười, là số minh hoạ. Cổng nhận mười và từ chối
      hai mươi, còn rải đều trong một giây thì nhận mười bốn.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>chia
      hệ thống ngân hàng ở đâu</td><td><b>ngữ cảnh giới hạn</b>: mỗi nghĩa của một
      chữ có chỗ riêng</td></tr><tr><td>ai đứng ở cửa vào</td><td>cổng API: kiểm ai
      gọi, giới hạn tốc độ, chuyển đúng dịch vụ, nhật ký</td></tr><tr><td>bên thứ
      ba được lấy dữ liệu gì</td><td>Open API theo Thông tư 64: hợp đồng và sự đồng
      ý của khách</td></tr><tr><td>cả vạn bên cùng gọi thì phía sau cổng chịu thế
      nào</td><td>đếm yêu cầu qua cổng ở 1, 100 và 10 000 bên</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    introduces:
    - bnx_ngu_canh_gioi_han
    clear: true
    say: Hôm nay ta trả lời bốn câu, chia hệ thống ở đâu thì dùng ngữ cảnh giới hạn,
      mỗi nghĩa của một chữ có chỗ riêng. Ai đứng ở cửa vào thì là cổng API, kiểm
      người gọi và chuyển đúng dịch vụ. Bên thứ ba được lấy dữ liệu gì thì theo Thông
      tư sáu mươi tư. Cả vạn bên cùng gọi thì hậu phương chịu ra sao, ta sẽ đếm.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_l14_bucket(5, 10, [0] * 11) == 10
  - 5 * Fraction(1, 30) == Fraction(5, 30) == Fraction(1, 6)
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      dịch vụ và REST API</td><td>mỗi dịch vụ là một chương trình riêng, mở chức năng
      qua <b>REST API</b>: mỗi chức năng là một đường dẫn <b>HTTP</b> (cách chương
      trình hỏi và đáp qua mạng) kèm một động từ (GET: lấy dữ liệu; POST: gửi dữ liệu
      để tạo hoặc làm một việc)</td><td><code>POST /transfers</code>: gửi yêu cầu
      tạo một lệnh chuyển ở dịch vụ Thanh toán</td></tr><tr><td>② mã truy cập và phạm
      vi quyền</td><td>mã ghi người gọi được làm gì; sai phạm vi thì bị từ chối</td><td>mã
      <code>accounts:read</code> gọi API cần <code>payments:write</code> → 403</td></tr><tr><td>③
      mã trạng thái 429</td><td>“quá nhiều yêu cầu”: người gọi phải chậm lại rồi thử
      sau</td><td>yêu cầu thứ 11 gửi cùng lúc → 429</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Một, mỗi dịch vụ là một chương trình riêng,
      mở chức năng qua các đường dẫn HTTP, tức cách chương trình hỏi và đáp qua mạng,
      mỗi đường dẫn đi với một động từ. Động từ gửi nghĩa là gửi dữ liệu để tạo một
      việc. Hai, mã truy cập ghi rõ người gọi được làm gì, nên mã chỉ có quyền đọc
      mà gọi API ghi thanh toán thì bị từ chối với mã bốn trăm linh ba. Ba, mã trạng
      thái bốn trăm hai mươi chín nghĩa là quá nhiều yêu cầu, người gọi phải chậm
      lại.
  - show: '<p>④ Phân số giữ đúng thời gian: $\frac{1}{30}$ giây không viết gọn được
      thành số thập phân hữu hạn; trong Python, <code>Fraction(1, 30)</code> giữ đúng
      phân số.</p>

      $$5 \cdot \frac{1}{30} = \frac{5}{30} = \frac{1}{6}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bốn, ta giữ thời gian bằng phân số, vì một phần ba mươi giây không viết gọn
      được thành số thập phân hữu hạn. Năm nhân một phần ba mươi bằng năm phần ba
      mươi, rút gọn còn một phần sáu.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã các từ của bài
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>ngữ cảnh giới
      hạn <i>(bounded context)</i></td><td>vùng mà mỗi từ có đúng một nghĩa; DDD (thiết
      kế hướng miền) chia mô hình lớn thành nhiều vùng như vậy (Evans, <i>Domain-Driven
      Design</i>, 2003)</td></tr><tr><td>ngôn ngữ chung <i>(ubiquitous language)</i></td><td>người
      nghiệp vụ và lập trình viên dùng cùng một bộ từ, và chính các từ đó có trong
      mã</td></tr><tr><td>cụm đối tượng <i>(aggregate)</i>, gốc <i>(root)</i></td><td>nhóm
      đối tượng (đối tượng: một thứ trong mã gồm dữ liệu và việc nó làm được, như
      Tài khoản có số dư và việc ghi nợ) được coi là một khối; bên ngoài chỉ chạm
      vào gốc; một <b>giao dịch</b> (nhiều thao tác cùng thành hoặc cùng huỷ) không
      vượt ranh giới cụm</td></tr><tr><td>bất biến</td><td>điều luôn đúng sau mọi
      thao tác, ví dụ số dư không âm</td></tr></table>'
    introduces:
    - bnx_ngon_ngu_chung
    say: Bảng này giải mã bốn từ của thiết kế hướng miền. Ngữ cảnh giới hạn là vùng
      mà mỗi từ có đúng một nghĩa, và ngôn ngữ chung là bộ từ cả nghiệp vụ lẫn lập
      trình viên cùng dùng. Cụm đối tượng là nhóm các thứ trong mã coi như một khối,
      bên ngoài chỉ chạm vào gốc, còn bất biến là điều luôn đúng sau mọi thao tác.
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>cổng API <i>(API
      gateway)</i></td><td>cửa vào duy nhất cho mọi người gọi từ bên ngoài, đứng trước
      các dịch vụ; <b>xác thực</b> là kiểm người gọi là ai, <b>định tuyến</b> là chuyển
      yêu cầu tới đúng dịch vụ theo đường dẫn</td></tr><tr><td>thùng token <i>(token
      bucket)</i></td><td>thùng chứa tối đa $b$ thẻ, mỗi giây thêm $r$ thẻ; mỗi yêu
      cầu lấy 1 thẻ, hết thẻ thì từ chối</td></tr><tr><td>mã tương quan <i>(correlation
      ID)</i></td><td>một mã gắn vào yêu cầu ở cổng và chuyển qua mọi dịch vụ, để
      lần theo một yêu cầu trong nhật ký</td></tr><tr><td>Open API, bên thứ ba</td><td>API
      ngân hàng cung cấp cho tổ chức khác có hợp đồng với ngân hàng</td></tr></table>
    introduces:
    - bnx_thung_token
    clear: true
    say: Bảng thứ hai là từ của cửa vào. Cổng API kiểm người gọi là ai rồi chuyển
      yêu cầu tới đúng dịch vụ. Thùng chứa tối đa b thẻ, mỗi giây thêm r thẻ, mỗi
      yêu cầu lấy một thẻ và hết thẻ thì bị từ chối. Mã tương quan giúp lần theo một
      yêu cầu trong nhật ký.
