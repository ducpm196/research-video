objectives:
- Nêu cách chia hệ thống ngân hàng thành ngữ cảnh giới hạn
- Nhận ra một khái niệm mang nghĩa khác nhau ở hai ngữ cảnh
- 'Nêu việc cổng API làm: xác thực, giới hạn tốc độ, định tuyến, nhật ký'
- 'Nêu nội dung Open API ngân hàng theo Thông tư 64/2024/TT-NHNN: hợp đồng, sự đồng
  ý của khách, thời hạn tra cứu'
- Tính số yêu cầu một cổng thùng token nhận và từ chối khi 30 yêu cầu đến cùng lúc
  và khi rải đều
- Đếm số yêu cầu qua cổng khi 1, 100 và 10 000 bên thứ ba cùng gọi và so với sức chịu
  của phía sau
- Viết chương trình Python mô phỏng thùng token và tính tải khi nhiều bên cùng gọi
