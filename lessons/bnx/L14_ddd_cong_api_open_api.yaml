      ý không quá 180 ngày</td></tr><tr><td>nguồn</td><td>Tạp chí Ngân hàng 24/02/2025;
      trang NHNN 14/11/2025 (trích Thông tư 64/2024/TT-NHNN)</td></tr></table>
    clear: true
    say: Bảng này ghi những điều thông tư nói, theo bài của Tạp chí Ngân hàng và trang
      tin của Ngân hàng Nhà nước. API mở là tập hợp các API ngân hàng cung cấp cho
      bên thứ ba trực tiếp kết nối và xử lý dữ liệu. Điều tám buộc ngân hàng ký hợp
      đồng với bên thứ ba, trong đó bên thứ ba cam kết dùng dữ liệu đúng phạm vi và
      mục đích. Điều mười một cho khách tra cứu và rút lại sự đồng ý, và thời hạn
      được truy vấn thông tin sau khi khách đồng ý không quá một trăm tám mươi ngày.
      Hai bài báo đó dẫn lại văn bản, nên khi làm việc thật bạn hãy đọc nguyên văn
      thông tư.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: ranh giới, bất biến, rồi thùng token'
  checks:
  - 80 + 30 == 110 > 100
  - alg.bnx_l14_debit(300000, 500000) == (300000, False)
  - alg.bnx_l14_debit(300000, 200000) == (100000, True)
  - 5 * Fraction(1, 30) == Fraction(1, 6)
  - alg.bnx_l14_bucket_trace(5, 10, alg.bnx_l14_spread(30))[1][1] == 9 + Fraction(1,
    6) == Fraction(55, 6)
  steps:
  - show: '<p><b>Bước 1.</b> Vì “hạn mức” ở Thanh toán và ở Tín dụng theo hai luật
      khác nhau, nên mỗi nghĩa nằm trong ngữ cảnh của nó, không dùng chung một cột.</p>

      <span class=''note''>Làm thử (số minh hoạ, đơn vị triệu đồng): hôm nay đã chuyển
      80, chuyển thêm 30; hạn mức vay 50 không liên quan.</span>

      $$80 + 30 = 110 > 100 \;\to\; \text{Thanh toán từ chối}$$

      '
    focus:
    - 1
    - 2
    - 3
    say: Bước một, vì chữ hạn mức ở Thanh toán và ở Tín dụng theo hai luật khác nhau,
      nên mỗi nghĩa nằm trong ngữ cảnh của nó, không dùng chung một cột. Làm thử với
      số minh hoạ, hôm nay khách đã chuyển tám mươi triệu, muốn chuyển thêm ba mươi
      triệu. Tám mươi cộng ba mươi là một trăm mười, vượt một trăm, nên Thanh toán
      từ chối, còn hạn mức vay năm mươi triệu không liên quan.
  - show: '<p><b>Bước 2.</b> Mọi thay đổi số dư đi qua <b>gốc</b> aggregate Tài khoản,
      nên bất biến “số dư không âm” chỉ phải kiểm ở <b>một</b> chỗ.</p>

      <span class=''note''>Làm thử: số dư $300\,000$, ghi nợ $500\,000$ → từ chối,
      giữ $300\,000$; ghi nợ $200\,000$ → $300\,000 - 200\,000 = 100\,000$.</span>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước hai, mọi thay đổi số dư đi qua gốc của cụm Tài khoản, nên bất biến số
      dư không âm chỉ phải kiểm ở một chỗ. Làm thử, số dư ba trăm nghìn, ghi nợ năm
      trăm nghìn thì bị từ chối và số dư giữ ba trăm nghìn. Ghi nợ hai trăm nghìn
      thì được, còn một trăm nghìn.
  - show: '<p><b>Bước 3.</b> Ở cổng, mỗi yêu cầu cần $1$ thẻ. Thùng thêm $r = 5$ thẻ
      mỗi giây và chứa tối đa $b = 10$: sức chứa cho dồn ngắn, tốc độ giữ trung bình.</p>

      <span class=''note''>Làm thử: sau $\frac{1}{30}$ giây thùng thêm $5 \cdot \frac{1}{30}
      = \frac{1}{6}$ thẻ.</span>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước ba, ở cổng mỗi yêu cầu cần một thẻ. Thùng thêm r bằng năm thẻ mỗi giây
      và chứa tối đa b bằng mười, vì sức chứa cho phép dồn ngắn hạn, còn tốc độ giữ
      mức trung bình. Làm thử, sau một phần ba mươi giây thùng thêm năm nhân một phần
      ba mươi, tức một phần sáu thẻ.
  - show: '<p><b>Bước 4.</b> Trước mỗi yêu cầu: số thẻ $=$ thẻ còn $+ \, r \cdot$
      thời gian đã trôi, nhưng không quá $b$. Có ít nhất $1$ thẻ thì nhận và trừ $1$.</p>

      <span class=''note''>Làm thử: còn $9$ thẻ, sau $\frac{1}{30}$ giây: $9 + \frac{1}{6}
      = \frac{55}{6}$, vẫn dưới $10$ nên giữ nguyên.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước bốn, trước mỗi yêu cầu, số thẻ bằng thẻ còn lại cộng r nhân thời gian
      đã trôi, nhưng không quá b, vì thùng đầy thì thẻ thêm bị tràn ra ngoài. Có ít
      nhất một thẻ thì nhận yêu cầu và trừ một thẻ. Làm thử, còn chín thẻ, sau một
      phần ba mươi giây được chín cộng một phần sáu, là năm mươi lăm phần sáu, vẫn
      dưới mười nên giữ nguyên.
- id: example
  kind: example
  title: 'Ví dụ: 30 yêu cầu qua cổng, từng phép tính'
  checks:
  - alg.bnx_l14_bucket(5, 10, [0] * 30) == 10
  - 30 - alg.bnx_l14_bucket(5, 10, [0] * 30) == 20
  - 1 - Fraction(1, 6) == Fraction(5, 6)
  - alg.bnx_l14_bucket_trace(5, 10, alg.bnx_l14_spread(30))[10][1] == 10 - 10 * Fraction(5,
    6) == Fraction(5, 3)
  - alg.bnx_l14_accepted_idx(5, 10, alg.bnx_l14_spread(30))[:11] == list(range(11))
  - alg.bnx_l14_accepted_idx(5, 10, alg.bnx_l14_spread(30))[11:] == [12, 18, 24]
  - alg.bnx_l14_bucket_trace(5, 10, alg.bnx_l14_spread(30))[10][1] - 1 == Fraction(2,
    3)
  - Fraction(2, 3) + 2 * Fraction(1, 6) == 1 == 6 * Fraction(1, 6) == 6 * Fraction(1,
    30) * 5
  - Fraction(6, 30) == Fraction(1, 5)
  - alg.bnx_l14_bucket_trace(5, 10, alg.bnx_l14_spread(30))[11][1] == Fraction(5,
    6) < 1
  - alg.bnx_l14_bucket(5, 10, alg.bnx_l14_spread(30)) == 11 + 3 == 14
  - 30 - alg.bnx_l14_bucket(5, 10, alg.bnx_l14_spread(30)) == 16
  steps:
  - show: '<p>Cổng $r = 5$ thẻ/giây, $b = 10$. Thùng bắt đầu <b>đầy</b> $10$ thẻ.
      Trường hợp A: $30$ yêu cầu đến <b>cùng lúc</b>, thời gian trôi bằng $0$ nên
      không thêm thẻ.</p>

      $$① \; \text{nhận} = \hl{10}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    say: Ta tính từng bước. Cổng có r bằng năm thẻ mỗi giây và b bằng mười, và thùng
      bắt đầu đầy mười thẻ. Trường hợp thứ nhất, ba mươi yêu cầu đến cùng lúc, thời
      gian trôi bằng không nên không thêm thẻ nào. Phép tính thứ nhất, mười thẻ đầu
      tiên cho mười yêu cầu, nên nhận mười.
  - show: $$② \; 30 - 10 = \hl{20}\ \text{bị từ chối (429)}$$
    say: Phép tính thứ hai, dùng lại số mười ở trên. Ba mươi trừ mười bằng hai mươi
      yêu cầu bị từ chối với mã bốn trăm hai mươi chín.
  - show: '<p>Trường hợp B: $30$ yêu cầu <b>rải đều</b> trong $1$ giây, ở thời điểm
      $0, \frac{1}{30}, \frac{2}{30}, \dots, \frac{29}{30}$.</p>

      $$③ \; 1 - \frac{1}{6} = \hl{\frac{5}{6}}\ \text{thẻ mất đi sau mỗi yêu cầu
      được nhận}$$

      '
    focus:
    - 1
    - 1
    - 2
    introduces:
    - dots
    say: Trường hợp thứ hai, ba mươi yêu cầu rải đều trong một giây, ở thời điểm không,
      một phần ba mươi, hai phần ba mươi, và cứ thế tới hai mươi chín phần ba mươi
      giây. Dấu ba chấm nghĩa là cứ thế tiếp tục. Phép tính thứ ba, mỗi yêu cầu lấy
      một thẻ mà giữa hai yêu cầu chỉ thêm một phần sáu thẻ, nên mỗi lần nhận, thùng
      mất đi năm phần sáu thẻ.
  - show: '<p>Dùng lại $\frac{5}{6}$: trước yêu cầu thứ $11$ (thời điểm $\frac{10}{30}$)
      đã nhận $10$ yêu cầu.</p>

      $$④ \; 10 - 10 \cdot \frac{5}{6} = \hl{\frac{5}{3}} \geq 1 \ \text{nên nhận
      đủ } 11 \text{ yêu cầu đầu}$$

      '
    focus:
    - 1
    - 1
    - 2
    introduces:
    - geq
    clear: true
    say: Phép tính thứ tư dùng lại năm phần sáu. Trước yêu cầu thứ mười một, ở thời
      điểm mười phần ba mươi giây, cổng đã nhận mười yêu cầu. Số thẻ còn mười trừ
      mười nhân năm phần sáu, bằng năm phần ba, vẫn lớn hơn hoặc bằng một, nên mười
      một yêu cầu đầu đều được nhận.
  - show: '<p>Sau yêu cầu thứ 11, thùng còn 2/3 thẻ. Mỗi khoảng thêm 1/6 thẻ, nên
      thêm 2 khoảng là đủ 1 thẻ: nhận ở 12/30 giây.</p>

      <p>Sau đó thùng về 0, cứ 6 khoảng (1/5 giây) mới đủ 1 thẻ: nhận ở 18/30 và 24/30
      giây.</p>

      $$⑤ \; 11 + 3 = \hlg{14}\ \text{nhận}, \quad 30 - 14 = 16\ \text{từ chối}$$

      '
    focus:
    - 3
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép tính thứ năm. Sau yêu cầu thứ mười một, thùng còn hai phần ba thẻ. Mỗi
      khoảng thêm một phần sáu thẻ, nên chỉ cần thêm hai khoảng là đủ một thẻ, và
      cổng nhận yêu cầu ở mười hai phần ba mươi giây. Sau đó thùng về không, nên cứ
      sáu khoảng, tức một phần năm giây, mới đủ một thẻ, và cổng nhận ở mười tám và
      hai mươi tư phần ba mươi giây. Tổng là mười một cộng ba bằng mười bốn được nhận,
      còn mười sáu bị từ chối.
  - show: '<p><b>Mô phỏng cổng bằng Python, dùng phân số</b></p><div class="code"><div>from
      fractions import Fraction as F</div><div>def cong(rate, cap, times):          #
      cổng: tốc độ, sức chứa</div><div>    tok, last, ok = F(cap), F(0), 0  # thùng
      đầy lúc đầu</div><div>    for t in times:</div><div>        tok = min(F(cap),
      tok + (t - last) * rate)</div><div>        last = t</div><div>        if tok
      &gt;= 1:                 # còn ít nhất 1 thẻ</div><div>            tok, ok =
      tok - 1, ok + 1</div><div>    return ok</div><div>print(cong(5, 10, [F(0)] *
      30))                    # cùng lúc</div><div>print(cong(5, 10, [F(i, 30) for
      i in range(30)]))  # rải đều</div></div>'
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    - 2
    clear: true
    say: Giờ ta cho máy tính lại bằng Python. Câu lệnh đầu nạp kiểu phân số, để một
      phần ba mươi giây được giữ đúng, không lệch như số thực. Hàm cong, tức là cổng,
      nhận tốc độ, sức chứa và danh sách thời điểm, rồi bắt đầu với thùng đầy. Với
      mỗi thời điểm, thùng được cộng tốc độ nhân thời gian đã trôi, nhưng không quá
      sức chứa. Còn ít nhất một thẻ thì trừ một thẻ và đếm thêm một yêu cầu được nhận.
      Hai câu lệnh cuối chạy hai trường hợp, cùng lúc và rải đều.
  - show: '<p>Bằng tay: cùng lúc nhận $10$ (phép ①), rải đều nhận $14$ (phép ⑤).</p><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>10</div><div>14</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Bằng tay, ta đã tính cùng lúc nhận mười ở phép tính thứ nhất, và rải đều
      nhận mười bốn ở phép tính thứ năm. Kết quả chạy thật in ra mười rồi mười bốn,
      khớp cả hai.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: cận trên của cổng'
  checks:
  - alg.bnx_l14_bound(5, 10, 0) == alg.bnx_l14_bucket(5, 10, [0] * 30) == 10
  - 10 + 5 * Fraction(29, 30) == Fraction(89, 6)
  - round(float(Fraction(89, 6)), 1) == 14.8
  - alg.bnx_l14_bound(5, 10, Fraction(29, 30)) == alg.bnx_l14_bucket(5, 10, alg.bnx_l14_spread(30))
    == 14
  - len(alg.bnx_l14_accepted_idx(5, 10, alg.bnx_l14_spread(30))) == 11 + 3
  - alg.bnx_l14_days('31/12/2024', '01/03/2025') == 1 + 31 + 28 == 60
  steps:
  - show: '<p>Đường khác: trong khoảng thời gian $T$, cổng phát ra nhiều nhất $b +
      r \cdot T$ thẻ, nên số yêu cầu nhận được không vượt quá số đó.</p>

      $$\text{A: } 10 + 5 \cdot 0 = \hl{10} \qquad \text{B: } 10 + 5 \cdot \frac{29}{30}
      = \frac{89}{6} \approx 14{,}8 \;\to\; \text{nhiều nhất } \hlg{14}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Kiểm bằng đường khác, không cần mô phỏng. Trong khoảng thời gian T, cổng
      phát ra nhiều nhất b cộng r nhân T thẻ, nên số yêu cầu được nhận không vượt
      quá số đó. Trường hợp cùng lúc, T bằng không, cận trên là mười, đúng bằng kết
      quả mô phỏng. Trường hợp rải đều, T là hai mươi chín phần ba mươi giây, cận
      trên là tám mươi chín phần sáu, xấp xỉ mười bốn phẩy tám. Không nhận được nửa
      yêu cầu, nên nhiều nhất mười bốn, cũng khớp.
  - show: '<table class=''t''><tr><th>kiểm</th><th>cách tính khác</th><th>kết quả</th></tr><tr><td>số
      yêu cầu nhận ở B</td><td>đếm thời điểm: 0 tới 10/30 là 11, thêm 12/30, 18/30,
      24/30</td><td>11 + 3 = 14</td></tr><tr><td>ngày ban hành tới ngày hiệu lực</td><td>1
      ngày cuối tháng 12, 31 ngày tháng 1, 28 ngày tháng 2</td><td>1 + 31 + 28 = 60
      ngày</td></tr></table>'
    clear: true
    say: Bảng này kiểm thêm hai điều bằng cách đếm, vì đếm thẳng là một đường độc
      lập với công thức. Đếm thời điểm được nhận, từ không tới mười phần ba mươi là
      mười một, thêm ba thời điểm sau, tổng mười bốn. Từ ngày ban hành tới ngày hiệu
      lực của thông tư, ta đếm một ngày cuối tháng mười hai, ba mươi mốt ngày tháng
      một và hai mươi tám ngày tháng hai, tổng sáu mươi ngày.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> Tưởng DDD <b class="red">bắt
      buộc</b> tách thành nhiều microservice. DDD vẽ ranh giới trước; ranh giới đó
      có thể là <b>mô-đun trong một ứng dụng</b>, cách triển khai tính sau.</div>
    say: Lỗi thứ nhất, của người mới, là tưởng thiết kế hướng miền bắt buộc tách thành
      nhiều Microservice. Thiết kế hướng miền vẽ ranh giới trước. Ranh giới đó có
      thể chỉ là các mô-đun trong một ứng dụng, còn cách triển khai thì tính sau,
      khi đã có lý do.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Cổng đã kiểm mã nên
      dịch vụ <b class="red">bỏ kiểm quyền</b>. Nếu cổng không được cấu hình kiểm
      phạm vi, mã <code>accounts:read</code> hợp lệ vẫn qua cổng; khi đó nếu dịch
      vụ Thanh toán không tự kiểm phạm vi <code>payments:write</code>, lệnh chuyển
      tiền sẽ chạy.

      <br><span class="note">Phép thử bắt lỗi: gọi thẳng dịch vụ bằng mã sai phạm
      vi, phải nhận 403.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là nghĩ cổng đã kiểm mã nên dịch vụ bỏ
      kiểm quyền. Nếu cổng không được cấu hình kiểm phạm vi, mã chỉ có quyền đọc tài
      khoản vẫn hợp lệ nên vẫn qua cổng. Nếu dịch vụ Thanh toán không tự kiểm phạm
      vi ghi thanh toán, lệnh chuyển tiền sẽ chạy. Phép thử bắt lỗi là gọi thẳng dịch
      vụ bằng mã sai phạm vi, và phải nhận mã bốn trăm linh ba.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Bên thứ ba đã có
      thông tin kết nối là <b class="red">trả mọi dữ liệu</b>. Theo Thông tư 64, cần
      hợp đồng với bên thứ ba <b>và</b> sự đồng ý của khách, chỉ trả đúng phạm vi
      đã đồng ý; khách rút lại thì dừng.

      <br><span class="note">Phép thử bắt lỗi: khách rút lại sự đồng ý, lần gọi kế
      tiếp phải bị từ chối.</span></div>

      '
    say: Lỗi thứ ba, cũng của người đã đi làm, là thấy bên thứ ba có thông tin kết
      nối thì trả mọi dữ liệu. Theo Thông tư sáu mươi tư, cần hợp đồng với bên thứ
      ba và sự đồng ý của khách. Ngân hàng chỉ trả đúng phạm vi khách đã đồng ý, và
      khách rút lại thì phải dừng. Phép thử bắt lỗi là cho khách rút lại sự đồng ý,
      rồi lần gọi kế tiếp phải bị từ chối.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l14_bucket(5, 10, [0] * 40) == 10
  - 40 - alg.bnx_l14_bucket(5, 10, [0] * 40) == 30
  - 2 * Fraction(1, 4) == Fraction(1, 2) == 1 - Fraction(1, 2)
  - alg.bnx_l14_bucket_trace(2, 3, alg.bnx_l14_spread(6, Fraction(3, 2)))[4][1] ==
    3 - 4 * Fraction(1, 2) == 1
  - alg.bnx_l14_bucket_trace(2, 3, alg.bnx_l14_spread(6, Fraction(3, 2)))[5][1] ==
    Fraction(1, 2)
  - alg.bnx_l14_bucket(2, 3, alg.bnx_l14_spread(6, Fraction(3, 2))) == 5 == alg.bnx_l14_bound(2,
    3, Fraction(5, 4))
  - 3 + 2 * Fraction(5, 4) == Fraction(11, 2)
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Cổng
      5 thẻ/giây, sức chứa 10. 40 yêu cầu đến cùng lúc: nhận bao nhiêu, từ chối bao
      nhiêu?</td></tr><tr><td>2</td><td>Cổng 2 thẻ/giây, sức chứa 3. 6 yêu cầu cách
      nhau 1/4 giây (0, 1/4, …, 5/4): nhận bao nhiêu?</td></tr><tr><td>3</td><td>Quyết
      định: đội 5 người, một cơ sở dữ liệu Oracle. Tách Tài khoản và Thanh toán thành
      hai dịch vụ ngay, hay một ứng dụng có hai mô-đun ranh giới rõ?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, cổng năm thẻ mỗi giây, sức chứa
      mười, bốn mươi yêu cầu đến cùng lúc, nhận bao nhiêu và từ chối bao nhiêu? Câu
      hai, cổng hai thẻ mỗi giây, sức chứa ba, sáu yêu cầu cách nhau một phần tư giây,
      nhận bao nhiêu? Câu ba là một quyết định. Đội năm người dùng một cơ sở dữ liệu
      Oracle, nên tách Tài khoản và Thanh toán thành hai dịch vụ ngay, hay giữ một
      ứng dụng có hai mô-đun ranh giới rõ? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: cùng lúc nên không thêm thẻ, chỉ có $10$ thẻ ban đầu.</p>

      $$\text{nhận } \hl{10}, \quad 40 - 10 = \hl{30}\ \text{từ chối}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một. Các yêu cầu đến cùng lúc nên không thêm thẻ, chỉ có mười
      thẻ ban đầu. Vậy nhận mười, và bốn mươi trừ mười bằng ba mươi yêu cầu bị từ
      chối.
    clear: true
  - show: '<p>Câu 2: mỗi khoảng thêm $2 \cdot \frac{1}{4} = \frac{1}{2}$ thẻ, mỗi
      lần nhận mất $1 - \frac{1}{2} = \frac{1}{2}$. Trước yêu cầu thứ $5$: $3 - 4
      \cdot \frac{1}{2} = 1$ nên nhận; yêu cầu thứ $6$ chỉ có $\frac{1}{2}$ thẻ.</p>

      $$\text{nhận } \hlg{5}, \quad \text{cận trên } 3 + 2 \cdot \frac{5}{4} = 5{,}5$$

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu hai. Mỗi khoảng một phần tư giây thêm hai nhân một phần tư, bằng
      nửa thẻ, nên mỗi lần nhận thùng mất nửa thẻ. Trước yêu cầu thứ năm còn ba trừ
      bốn nhân một nửa, bằng một thẻ, nên vẫn nhận. Yêu cầu thứ sáu chỉ có nửa thẻ
      nên bị từ chối. Vậy nhận năm. Kiểm bằng cận trên, ba cộng hai nhân năm phần
      tư bằng năm phẩy năm, nên nhiều nhất là năm, khớp.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th><th>đổi
      khi</th></tr><tr><td>một ứng dụng, hai mô-đun</td><td>chuyển tiền và ghi sổ
      trong một giao dịch, một lần chốt; triển khai một lần</td><td>phải giữ kỷ luật:
      mô-đun này không đọc bảng của mô-đun kia</td><td>hai phần cần nhịp phát hành
      hoặc mức tải khác hẳn nhau (đo được)</td></tr><tr><td>hai dịch vụ riêng</td><td>triển
      khai, co giãn độc lập</td><td>giao dịch vượt hai dịch vụ phải dùng SAGA, Outbox;
      thêm lời gọi mạng, thêm chỗ hỏng</td><td>đội nhỏ, chưa đo thấy nghẽn: chưa cần</td></tr></table>'
    say: Đáp án câu ba là một đánh đổi. Một ứng dụng hai mô-đun thì chuyển tiền và
      ghi sổ nằm trong một giao dịch, một lần chốt, triển khai một lần. Đổi lại phải
      giữ kỷ luật, mô-đun này không đọc bảng của mô-đun kia. Hai dịch vụ riêng thì
      triển khai và co giãn độc lập, nhưng giao dịch vượt hai dịch vụ phải dùng SAGA
      hay Outbox, thêm lời gọi mạng và thêm chỗ hỏng. Với đội năm người chưa đo thấy
      nghẽn, hai mô-đun là đủ. Nên đổi sang hai dịch vụ khi đo được hai phần cần nhịp
      phát hành hoặc mức tải khác hẳn nhau.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>một chữ, nhiều nghĩa</span><span
      class=''a''>→</span><span class=''n''>ngữ cảnh giới hạn</span><span class=''a''>→</span><span
      class=''n''>gốc aggregate giữ bất biến</span><span class=''a''>→</span><span
      class=''n''>cổng: xác thực, giới hạn, định tuyến, nhật ký</span><span class=''a''>→</span><span
      class=''n''>dịch vụ vẫn kiểm quyền</span><span class=''a''>→</span><span class=''n''>Open
      API: hợp đồng + đồng ý</span></div>'
    say: Tổng kết chuỗi logic. Một chữ có nhiều nghĩa, nên ta chia thành ngữ cảnh
      giới hạn, và trong mỗi ngữ cảnh, gốc của cụm thực thể giữ bất biến. Ở cửa vào,
      cổng xác thực, giới hạn tốc độ, định tuyến và ghi nhật ký, nhưng dịch vụ vẫn
      tự kiểm quyền. Với bên thứ ba, API mở cần hợp đồng và sự đồng ý của khách.
  - show: <div class='box key'><b>Tư duy:</b> vẽ ranh giới theo <b>nghĩa của từ</b>
      trước khi chọn công nghệ; mỗi lớp bảo vệ (cổng, dịch vụ, cơ sở dữ liệu) tự kiểm
      phần của nó, không lớp nào tin lớp trước đã kiểm hộ.</div>
    say: Điều cần mang theo. Hãy vẽ ranh giới theo nghĩa của từ trước khi chọn công
      nghệ. Mỗi lớp bảo vệ, gồm cổng, dịch vụ và cơ sở dữ liệu, tự kiểm phần của nó,
      không lớp nào tin lớp trước đã kiểm hộ.
  - show: '<p class=''note''>Bài sau (bài tổng hợp): ghép mọi mảnh đã học thành một
      dự án mẫu API chuyển khoản đúng như tin tuyển dụng đòi hỏi.</p>'
    forward_ref: true
    say: Ở bài sau, bài tổng hợp, ta ghép mọi mảnh đã học thành một dự án mẫu API
      chuyển khoản. Bài đó có ước lượng tải và ngân sách thời gian cho từng phần,
      đúng như tin tuyển dụng đòi hỏi.
