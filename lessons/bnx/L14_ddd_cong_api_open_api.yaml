      lục một của thông tư, và thông tư có hiệu lực từ ngày một tháng ba năm hai nghìn
      không trăm hai mươi lăm.
  - show: <table class='t'><tr><th>điều thông tư ghi</th><th>nội dung</th></tr><tr><td>Open
