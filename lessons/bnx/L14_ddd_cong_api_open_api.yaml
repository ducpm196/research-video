scenes:
- id: hook
  kind: hook
  title: 'Cửa vào của ngân hàng: 30 yêu cầu cùng một lúc'
  checks:
  - alg.bnx_l14_bucket(5, 10, [0] * 30) == 10
  - 30 - alg.bnx_l14_bucket(5, 10, [0] * 30) == 20
  - alg.bnx_l14_bucket(5, 10, alg.bnx_l14_spread(30)) == 14
  steps:
  - show: '<p>Từ $01/3/2025$, ngân hàng mở API cho <b>bên thứ ba</b> theo Thông tư
      64/2024/TT-NHNN. Một ứng dụng bên thứ ba gửi $30$ yêu cầu <b>cùng một lúc</b>.</p>

      <div class="box key">Cổng API cho mỗi bên $5$ yêu cầu/giây, sức chứa $10$ <i>(số
      minh hoạ)</i>: nhận $10$, từ chối $20$. Nếu $30$ yêu cầu <b>rải đều trong 1
      giây</b> thì nhận $14$.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Chào bạn, từ ngày một tháng ba năm hai nghìn không trăm hai mươi lăm, ngân
      hàng mở API cho bên thứ ba theo Thông tư sáu mươi tư của Ngân hàng Nhà nước.
      Một ứng dụng bên thứ ba gửi ba mươi yêu cầu cùng một lúc. Giả sử cổng API cho
      mỗi bên năm yêu cầu mỗi giây, sức chứa mười, là số minh hoạ. Khi đó cổng nhận
      mười và từ chối hai mươi. Nếu ba mươi yêu cầu đó rải đều trong một giây thì
      cổng nhận mười bốn. Cuối bài, bạn sẽ tự tính ra hai con số này.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>chia
      hệ thống ngân hàng ở đâu</td><td>ngữ cảnh giới hạn: mỗi nghĩa của một chữ có
      chỗ riêng</td></tr><tr><td>ai đứng ở cửa vào</td><td>cổng API: xác thực, giới
      hạn tốc độ, định tuyến, nhật ký</td></tr><tr><td>bên thứ ba được lấy dữ liệu
      gì</td><td>Open API theo Thông tư 64: hợp đồng và sự đồng ý của khách</td></tr></table>'
    say: Hôm nay ta trả lời ba câu. Hệ thống ngân hàng nên chia ở đâu, thì dùng ngữ
      cảnh giới hạn, mỗi nghĩa của một chữ có chỗ riêng. Ai đứng ở cửa vào, thì là
      cổng API, lo xác thực, giới hạn tốc độ, định tuyến và nhật ký. Bên thứ ba được
      lấy dữ liệu gì, thì theo Thông tư sáu mươi tư, cần hợp đồng với ngân hàng và
      sự đồng ý của khách.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_l14_bucket(5, 10, [0] * 11) == 10
  - 5 * Fraction(1, 30) == Fraction(5, 30) == Fraction(1, 6)
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      dịch vụ và REST API</td><td>mỗi dịch vụ là một chương trình riêng, mở chức năng
      qua đường dẫn HTTP</td><td><code>POST /transfers</code> ở dịch vụ Thanh toán</td></tr><tr><td>②
      mã truy cập và phạm vi quyền</td><td>mã ghi người gọi được làm gì; sai phạm
      vi thì bị từ chối</td><td>mã <code>accounts:read</code> gọi API cần <code>payments:write</code>
      → 403</td></tr><tr><td>③ mã trạng thái 429</td><td>“quá nhiều yêu cầu”: người
      gọi phải chậm lại rồi thử sau</td><td>yêu cầu thứ 11 gửi cùng lúc → 429</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Thứ nhất, mỗi dịch vụ là một chương trình
      riêng, mở chức năng của nó qua các đường dẫn HTTP, ví dụ đường dẫn chuyển tiền
      ở dịch vụ Thanh toán. Thứ hai, ở bài 4 ta đã thấy mã truy cập ghi rõ người gọi
      được làm gì. Mã chỉ có quyền đọc tài khoản mà gọi API ghi thanh toán thì bị
      từ chối với mã bốn trăm linh ba. Thứ ba, mã trạng thái bốn trăm hai mươi chín
      nghĩa là quá nhiều yêu cầu, người gọi phải chậm lại rồi thử sau.
  - show: '<p>④ Phân số giữ đúng thời gian: $\frac{1}{30}$ giây không viết gọn được
      thành số thập phân hữu hạn.</p>

      $$5 \cdot \frac{1}{30} = \frac{5}{30} = \frac{1}{6}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Thứ tư là phân số. Một phần ba mươi giây không viết gọn được thành số thập
      phân hữu hạn, nên ta giữ dạng phân số để không lệch. Ví dụ, năm nhân một phần
      ba mươi bằng năm phần ba mươi, rút gọn còn một phần sáu.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã các từ của bài
  steps:
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>ngữ cảnh giới
      hạn <i>(bounded context)</i></td><td>vùng mà mỗi từ có đúng một nghĩa; DDD chia
      mô hình lớn thành nhiều vùng như vậy (Evans, <i>Domain-Driven Design</i>, 2003)</td></tr><tr><td>ngôn
      ngữ chung <i>(ubiquitous language)</i></td><td>người nghiệp vụ và lập trình
      viên dùng cùng một bộ từ, và chính các từ đó có trong mã</td></tr><tr><td>aggregate,
      gốc <i>(root)</i></td><td>cụm đối tượng được coi là một khối; bên ngoài chỉ
      chạm vào gốc; một giao dịch không vượt ranh giới cụm</td></tr><tr><td>bất biến</td><td>điều
      luôn đúng sau mọi thao tác, ví dụ số dư không âm</td></tr></table>
    say: Bảng này giải mã bốn từ của thiết kế hướng miền, theo cuốn sách năm hai nghìn
      không trăm linh ba cùng tên. Ngữ cảnh giới hạn là vùng mà mỗi từ có đúng một
      nghĩa, và mô hình lớn được chia thành nhiều vùng như vậy. Ngôn ngữ chung là
      người nghiệp vụ và lập trình viên dùng cùng một bộ từ, và chính các từ đó có
      trong mã. Cụm thực thể là nhóm đối tượng coi như một khối, bên ngoài chỉ chạm
      vào gốc, và một giao dịch không vượt ranh giới cụm. Bất biến là điều luôn đúng
      sau mọi thao tác, ví dụ số dư không âm.
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>cổng API <i>(API
      gateway)</i></td><td>cửa vào duy nhất cho mọi người gọi từ bên ngoài, đứng trước
      các dịch vụ</td></tr><tr><td>thùng token <i>(token bucket)</i></td><td>thùng
      chứa tối đa $b$ thẻ, mỗi giây thêm $r$ thẻ; mỗi yêu cầu lấy 1 thẻ, hết thẻ thì
      từ chối</td></tr><tr><td>mã tương quan <i>(correlation ID)</i></td><td>một mã
      gắn vào yêu cầu ở cổng và chuyển qua mọi dịch vụ, để lần theo một yêu cầu trong
      nhật ký</td></tr><tr><td>Open API, bên thứ ba</td><td>API ngân hàng cung cấp
      cho tổ chức khác có hợp đồng với ngân hàng</td></tr></table>
    clear: true
    say: Bảng thứ hai là từ của cửa vào. Cổng API là cửa vào duy nhất cho mọi người
      gọi từ bên ngoài, đứng trước các dịch vụ. Thùng Token chứa tối đa b thẻ và mỗi
      giây thêm r thẻ, mỗi yêu cầu lấy một thẻ, hết thẻ thì bị từ chối. Mã tương quan
      được gắn vào yêu cầu ở cổng rồi chuyển qua mọi dịch vụ, để lần theo đúng một
      yêu cầu trong nhật ký. Còn API mở là các API ngân hàng cung cấp cho bên thứ
      ba, tức tổ chức khác có hợp đồng với ngân hàng.
