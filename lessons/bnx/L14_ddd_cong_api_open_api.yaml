- id: formula
  kind: formula
  title: 'Suy ra từng bước: ranh giới, bất biến, rồi thùng token'
  checks:
  - 80 + 30 == 110 > 100
  - alg.bnx_l14_debit(300000, 500000) == (300000, False)
  - alg.bnx_l14_debit(300000, 200000) == (100000, True)
  - 5 * Fraction(1, 30) == Fraction(1, 6)
  - alg.bnx_l14_bucket_trace(5, 10, alg.bnx_l14_spread(30))[1][1] == 9 + Fraction(1,
    6) == Fraction(55, 6)
  steps:
  - show: '<p><b>Bước 1.</b> Vì “hạn mức” ở Thanh toán và ở Tín dụng theo hai luật
      khác nhau, nên mỗi nghĩa nằm trong ngữ cảnh của nó, không dùng chung một cột.</p>

      <span class=''note''>Làm thử (số minh hoạ, đơn vị triệu đồng): hôm nay đã chuyển
      80, chuyển thêm 30; hạn mức vay 50 không liên quan.</span>

      $$80 + 30 = 110 > 100 \;\to\; \text{Thanh toán từ chối}$$

      '
    focus:
    - 1
    - - 2
      - 3
    say: 'Bước một, vì chữ hạn mức ở Thanh toán và Tín dụng theo hai luật khác nhau,
      nên mỗi nghĩa nằm trong ngữ cảnh của nó. Làm thử: đã chuyển tám mươi triệu,
      chuyển thêm ba mươi triệu thì một trăm mười vượt một trăm nên Thanh toán từ
      chối, còn hạn mức vay không liên quan.'
  - show: '<p><b>Bước 2.</b> Mọi thay đổi số dư đi qua <b>gốc</b> cụm đối tượng Tài
      khoản, nên bất biến “số dư không âm” chỉ phải kiểm ở <b>một</b> chỗ.</p>

      <span class=''note''>Làm thử: số dư $300\,000$, ghi nợ $500\,000$ → từ chối,
      giữ $300\,000$; ghi nợ $200\,000$ → $300\,000 - 200\,000 = 100\,000$.</span>

      '
    focus:
    - 1
    - 2
    - 2
    clear: true
    say: 'Bước hai, mọi thay đổi số dư đi qua gốc của cụm Tài khoản, nên bất biến
      số dư không âm chỉ phải kiểm ở một chỗ. Làm thử: số dư ba trăm nghìn, ghi nợ
      năm trăm nghìn thì bị từ chối và giữ ba trăm nghìn. Ghi nợ hai trăm nghìn thì
      được, còn một trăm nghìn.'
  - show: '<p><b>Bước 3.</b> Ở cổng, mỗi yêu cầu cần $1$ thẻ. Thùng thêm $r = 5$ thẻ
      mỗi giây và chứa tối đa $b = 10$: sức chứa cho dồn ngắn, tốc độ giữ trung bình.</p>

      <span class=''note''>Làm thử: sau $\frac{1}{30}$ giây thùng thêm $5 \cdot \frac{1}{30}
      = \frac{1}{6}$ thẻ.</span>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước ba, mỗi yêu cầu ở cổng cần một thẻ. Thùng thêm năm thẻ mỗi giây và
      chứa tối đa mười, vì sức chứa cho phép dồn ngắn hạn còn tốc độ giữ mức trung
      bình. Làm thử: sau một phần ba mươi giây thùng thêm một phần sáu thẻ.'
  - show: '<p><b>Bước 4.</b> Trước mỗi yêu cầu: số thẻ $=$ thẻ còn $+ \, r \cdot$
      thời gian đã trôi, nhưng không quá $b$. Có ít nhất $1$ thẻ thì nhận và trừ $1$.</p>

      <span class=''note''>Làm thử: còn $9$ thẻ, sau $\frac{1}{30}$ giây: $9 + \frac{1}{6}
      = \frac{55}{6}$, vẫn dưới $10$ nên giữ nguyên.</span>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước bốn, trước mỗi yêu cầu số thẻ bằng thẻ còn cộng tốc độ nhân thời gian
      trôi, nhưng không quá sức chứa vì thùng đầy thì thẻ bị tràn. Có ít nhất một
      thẻ thì nhận và trừ một thẻ. Làm thử: còn chín thẻ, sau một phần ba mươi giây
      được năm mươi lăm phần sáu, vẫn dưới mười nên giữ nguyên.'
- id: example
  kind: example
  title: 'Ví dụ: 30 yêu cầu qua cổng, từng phép tính'
  checks:
  - alg.bnx_l14_bucket(5, 10, [0] * 30) == 10
  - 30 - alg.bnx_l14_bucket(5, 10, [0] * 30) == 20
  - 1 - Fraction(1, 6) == Fraction(5, 6)
  - alg.bnx_l14_bucket_trace(5, 10, alg.bnx_l14_spread(30))[10][1] == 10 - 10 * Fraction(5,
    6) == Fraction(5, 3)
  - alg.bnx_l14_accepted_idx(5, 10, alg.bnx_l14_spread(30))[:11] == list(range(11))
  - alg.bnx_l14_accepted_idx(5, 10, alg.bnx_l14_spread(30))[11:] == [12, 18, 24]
  - alg.bnx_l14_bucket_trace(5, 10, alg.bnx_l14_spread(30))[10][1] - 1 == Fraction(2,
    3)
  - Fraction(2, 3) + 2 * Fraction(1, 6) == 1 == 6 * Fraction(1, 6) == 6 * Fraction(1,
    30) * 5
  - Fraction(6, 30) == Fraction(1, 5)
  - alg.bnx_l14_bucket_trace(5, 10, alg.bnx_l14_spread(30))[11][1] == Fraction(5,
    6) < 1
  - alg.bnx_l14_bucket(5, 10, alg.bnx_l14_spread(30)) == 11 + 3 == 14
  - 30 - alg.bnx_l14_bucket(5, 10, alg.bnx_l14_spread(30)) == 16
  steps:
  - show: '<p>Cổng $r = 5$ thẻ/giây, $b = 10$. Thùng bắt đầu <b>đầy</b> $10$ thẻ.
      Trường hợp A: $30$ yêu cầu đến <b>cùng lúc</b>, thời gian trôi bằng $0$ nên
      không thêm thẻ.</p>

      $$① \; \text{nhận} = \hl{10}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Cổng có năm thẻ mỗi giây và sức chứa mười, thùng bắt đầu đầy. Ba mươi yêu
      cầu đến cùng lúc nên không thêm thẻ nào, mười thẻ đầu cho mười yêu cầu, vậy
      nhận mười.
  - show: $$② \; 30 - 10 = \hl{20}\ \text{bị từ chối (429)}$$
    clear: true
    say: 'Phép tính thứ hai, dùng lại số mười: ba mươi trừ mười bằng hai mươi yêu
      cầu bị từ chối với mã bốn trăm hai mươi chín.'
  - show: '<p>Trường hợp B: $30$ yêu cầu <b>rải đều</b> trong $1$ giây, ở thời điểm
      $0, \frac{1}{30}, \frac{2}{30}, \dots, \frac{29}{30}$.</p>

      $$③ \; 1 - \frac{1}{6} = \hl{\frac{5}{6}}\ \text{thẻ mất đi sau mỗi yêu cầu
      được nhận}$$

      '
    focus:
    - 1
    - 2
    introduces:
    - dots
    clear: true
    say: 'Trường hợp rải đều: ba mươi yêu cầu ở các thời điểm không, một phần ba mươi,
      cứ thế tới hai mươi chín phần ba mươi giây. Giữa hai yêu cầu chỉ thêm một phần
      sáu thẻ, nên mỗi lần nhận thùng mất năm phần sáu thẻ.'
  - show: '<p>Dùng lại $\frac{5}{6}$: trước yêu cầu thứ $11$ (thời điểm $\frac{10}{30}$)
      đã nhận $10$ yêu cầu.</p>

      $$④ \; 10 - 10 \cdot \frac{5}{6} = \hl{\frac{5}{3}} \geq 1 \ \text{nên nhận
      đủ } 11 \text{ yêu cầu đầu}$$

      '
    introduces:
    - geq
    clear: true
    say: 'Dùng lại năm phần sáu: trước yêu cầu thứ mười một, thùng còn mười trừ mười
      nhân năm phần sáu, bằng năm phần ba, lớn hơn hoặc bằng một, nên nhận.'
  - show: '<p>Sau yêu cầu thứ 11, thùng còn 2/3 thẻ. Mỗi khoảng thêm 1/6 thẻ, nên
      thêm 2 khoảng là đủ 1 thẻ: nhận ở 12/30 giây.</p>

      <p>Sau đó thùng về 0, cứ 6 khoảng (1/5 giây) mới đủ 1 thẻ: nhận ở 18/30 và 24/30
      giây.</p>

      $$⑤ \; 11 + 3 = \hlg{14}\ \text{nhận}, \quad 30 - 14 = 16\ \text{từ chối}$$

      '
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: 'Sau yêu cầu thứ mười một, thùng còn hai phần ba thẻ, thêm hai khoảng là
      đủ một thẻ nên nhận ở mười hai phần ba mươi giây. Sau đó thùng về không, cứ
      sáu khoảng mới đủ một thẻ, nên nhận thêm ở mười tám và hai mươi tư phần ba mươi:
      mười bốn nhận, mười sáu từ chối.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>from
      m import x as y</code></td><td>lấy tên x từ thư viện m về dùng, và gọi nó là
      y trong mã này</td><td><code>from fractions import Fraction as F</code>: lấy
      loại phân số về dùng với tên ngắn <code>F</code>; <code>F(1, 30)</code> là phân
      số 1/30, giữ đúng không làm tròn</td></tr><tr><td><code>def ten(a, b):</code>
      … <code>return x</code></td><td>khai một hàm: <code>def</code>, tên, tham số
      trong ngoặc tròn, dấu hai chấm; các dòng thụt vào là thân hàm; <code>return</code>
      trả giá trị về chỗ gọi</td><td><code>def cong(rate, cap, times):</code> … <code>return
      ok</code>: hàm tên cong nhận ba tham số, rồi trả kết quả ok về</td></tr><tr><td><code>for
      x in (1, 2, 3):</code></td><td>vòng lặp: mỗi vòng <code>x</code> nhận một giá
      trị trong dãy, theo thứ tự; các dòng thụt vào là thân vòng</td><td><code>for
      t in times:</code>: lần lượt qua từng thời điểm t của danh sách times</td></tr></table>'
    clear: true
    say: Câu nhập lấy một tên từ thư viện về dùng, và chữ gọi là đổi tên ngắn gọn
      hơn. Khai hàm Python gồm chữ khai hàm, tên, tham số và dấu hai chấm; các dòng
      thụt vào là thân hàm, và lệnh trả về đưa giá trị về chỗ gọi. Vòng lặp Python
      cho biến nhận lần lượt từng giá trị trong dãy, và các dòng thụt vào là thân
      vòng.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>[F(0)]
      * 30</code>, <code>[F(i, 30) for i in range(30)]</code></td><td>danh sách 30
      phần tử đều là 0; danh sách dựng bằng vòng lặp: với i từ 0 tới 29, lấy <code>F(i,
      30)</code></td><td>30 yêu cầu cùng lúc; 30 yêu cầu rải đều</td></tr><tr><td><code>min(a,
      b)</code>; <code>a, b = x, y</code>; <code>if tok &gt;= 1:</code></td><td>số
      nhỏ hơn; gán hai biến cùng lúc; làm tiếp khi còn ít nhất 1 thẻ</td><td><code>min(F(cap),
      tok + …)</code>: không vượt sức chứa</td></tr><tr><td><code>print(a, b)</code>,
      <code>#</code></td><td>in các giá trị ra màn hình, cách nhau một dấu cách; từ
      <code>#</code> tới hết dòng là ghi chú, máy bỏ qua</td><td><code>print(cong(5,
      10, […]))</code>: in số yêu cầu nhận; <code># cùng lúc</code>: ghi chú cho người
      đọc</td></tr></table>'
    clear: true
    say: Nhân danh sách với một số lặp phần tử chừng ấy lần, và danh sách dựng bằng
      vòng lặp lấy một giá trị cho mỗi i từ không tới hai mươi chín. Hàm nhỏ hơn chọn
      số bé hơn, câu gán hai biến cùng lúc gán theo thứ tự, và điều kiện hỏi còn ít
      nhất một thẻ không. Lệnh in đưa các giá trị ra màn hình cách nhau một dấu cách,
      còn dấu thăng mở đầu một ghi chú mà máy bỏ qua.
  - show: '<p><b>Mô phỏng cổng bằng Python, dùng phân số</b></p><div class="code"><div>from
      fractions import Fraction as F</div><div>def cong(rate, cap, times):          #
      cổng: tốc độ, sức chứa</div><div>    tok, last, ok = F(cap), F(0), 0  # thùng
      đầy lúc đầu</div><div>    for t in times:</div><div>        tok = min(F(cap),
      tok + (t - last) * rate)</div><div>        last = t</div><div>        if tok
      &gt;= 1:                 # còn ít nhất 1 thẻ</div><div>            tok, ok =
      tok - 1, ok + 1</div><div>    return ok</div><div>print(cong(5, 10, [F(0)] *
      30))                    # cùng lúc</div><div>print(cong(5, 10, [F(i, 30) for
      i in range(30)]))  # rải đều</div></div>'
    focus:
    - - '2.1'
      - '2.3'
      - '2.5'
      - '2.7'
      - '2.8'
    clear: true
    say: Giờ ta cho Python tính lại, hàm cổng bắt đầu với thùng đầy, mỗi lần cộng
      thẻ theo thời gian trôi nhưng không quá sức chứa, và còn ít nhất một thẻ thì
      nhận một yêu cầu.
  - show: '<p>Bằng tay: cùng lúc nhận $10$ (phép ①), rải đều nhận $14$ (phép ⑤).</p><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>10</div><div>14</div></div>'
    clear: true
    say: Bằng tay ta tính cùng lúc nhận mười và rải đều nhận mười bốn, và kết quả
      chạy thật in ra mười rồi mười bốn, khớp cả hai.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: cận trên của cổng'
  checks:
  - alg.bnx_l14_bound(5, 10, 0) == alg.bnx_l14_bucket(5, 10, [0] * 30) == 10
  - 10 + 5 * Fraction(29, 30) == Fraction(89, 6)
  - round(float(Fraction(89, 6)), 1) == 14.8
  - alg.bnx_l14_bound(5, 10, Fraction(29, 30)) == alg.bnx_l14_bucket(5, 10, alg.bnx_l14_spread(30))
    == 14
  - len(alg.bnx_l14_accepted_idx(5, 10, alg.bnx_l14_spread(30))) == 11 + 3
  - alg.bnx_l14_days('31/12/2024', '01/03/2025') == 1 + 31 + 28 == 60
  steps:
  - show: '<p>Đường khác: trong khoảng thời gian $T$, cổng phát ra nhiều nhất $b +
      r \cdot T$ thẻ, nên số yêu cầu nhận được không vượt quá số đó.</p>

      $$\text{A: } 10 + 5 \cdot 0 = \hl{10} \qquad \text{B: } 10 + 5 \cdot \frac{29}{30}
      = \frac{89}{6} \approx 14{,}8 \;\to\; \text{nhiều nhất } \hlg{14}$$

      '
    focus:
    - 1
    - 2
    - 2
    say: 'Kiểm bằng đường khác: trong thời gian T cổng phát ra nhiều nhất sức chứa
      cộng tốc độ nhân T thẻ, nên số yêu cầu nhận không vượt quá số đó. Cùng lúc thì
      T bằng không, cận trên là mười. Rải đều thì T là hai mươi chín phần ba mươi
      giây, cận trên xấp xỉ mười bốn phẩy tám, nên nhiều nhất mười bốn, khớp cả hai.'
  - show: '<table class=''t''><tr><th>kiểm</th><th>cách tính khác</th><th>kết quả</th></tr><tr><td>số
      yêu cầu nhận ở B</td><td>đếm thời điểm: 0 tới 10/30 là 11, thêm 12/30, 18/30,
      24/30</td><td>11 + 3 = 14</td></tr><tr><td>ngày ban hành tới ngày hiệu lực</td><td>1
      ngày cuối tháng 12, 31 ngày tháng 1, 28 ngày tháng 2</td><td>1 + 31 + 28 = 60
      ngày</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    clear: true
    say: Bảng này kiểm thêm bằng cách đếm, ở trường hợp rải đều, từ không tới mười
      phần ba mươi là mười một lần nhận, thêm ba lần sau, tổng mười bốn, nên khớp.
      Từ ngày ban hành tới ngày hiệu lực là một cộng ba mươi mốt cộng hai mươi tám,
      tổng sáu mươi ngày.
