      class="code"><div>from fractions import Fraction as F</div><div>def nhan(rate,
      cap, times):</div><div>    tok, last, ok = F(cap), F(0), 0</div><div>    for
      t in times:</div><div>        tok = min(F(cap), tok + (t - last) * rate)</div><div>        last
