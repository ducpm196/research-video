  - 10_190_000 * 100 == 1_019_000_000 and 50 * 20_000_000 == 1_000_000_000
  - alg.bnx_sha256_hex('Hop dong  vay') != alg.bnx_sha256_hex('Hop dong vay')
  - 'alg.bnx_device_fp({''he'': ''Android 14'', ''man'': ''1080x2400'', ''mui'': ''UTC+7''})
    == alg.bnx_device_fp(dict({''he'': ''Android 14'', ''man'': ''1080x2400'', ''mui'':
    ''UTC+7''}))'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Coi ngưỡng 50% và 70 điểm
      là hằng số của nghề, và nghĩ chữ ký gắn với <b>tên tệp</b>.

      <br><span class="note">Đúng: ngưỡng là chính sách của từng tổ chức, đặt thành
      cấu hình. Chữ ký gắn với nội dung đã băm: đổi tên tệp không sao, đổi một ký
      tự nội dung là lộ.</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là coi ngưỡng năm mươi phần trăm và bảy mươi
      điểm là hằng số, và nghĩ chữ ký gắn với tên tệp. Thật ra ngưỡng là chính sách
      nên đặt thành cấu hình, còn chữ ký gắn với nội dung đã băm.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Tính
      tỉ lệ bằng phép chia lấy phần nguyên rồi mới so ngưỡng. Thu nhập 20 000 000,
      đang trả 4 000 000, khoản mới 6 190 000:</div>

      $$\frac{10\,190\,000}{20\,000\,000} = 50{,}95\% \;\text{bị cắt còn}\; 50\% \;\Rightarrow\;
      \text{qua sai}$$

      <span class="note">Cách chữa: so bằng nhân chéo trên số nguyên, 1 019 000 000
      lớn hơn 1 000 000 000 nên vượt; viết ca kiểm (phép thử viết sẵn) ngay tại biên,
      tức đúng giá trị ngưỡng, nơi dễ sai nhất.</span>

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là chia lấy phần nguyên rồi mới so ngưỡng.
      Tỉ lệ thật là năm mươi phẩy chín mươi lăm nhưng bị cắt còn năm mươi, nên qua
      sai. Cách chữa là nhân chéo trên số nguyên và kiểm ngay tại biên.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc vận hành lâu dài).</b>
      Kho hồ sơ chỉ lưu dữ liệu hợp đồng, khi cần thì <b>sinh lại tệp</b> từ mẫu.
      Một năm sau mẫu đổi một dấu cách: tệp sinh lại có mã băm khác, chữ ký cũ không
      còn kiểm được.

      <br><span class="note">Cách chữa: lưu đúng tệp đã ký, chữ ký và mã băm; việc
      đồng bộ sang kho chỉ xong khi băm lại tệp trong kho ra đúng mã đã ký.</span></div>

      '
    clear: true
    say: 'Lỗi thứ ba lộ ra khi vận hành lâu: kho chỉ lưu dữ liệu rồi sinh lại tệp
      từ mẫu. Mẫu đổi một dấu cách thì tệp mới có mã băm khác, nên chữ ký cũ không
      kiểm được, hãy lưu đúng tệp đã ký.'
