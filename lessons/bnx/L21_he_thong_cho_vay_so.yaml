      Le Loi,DIA.CHI:1:2=Quan 1")</div></div><table class=''t''><tr><th>phần</th><th>nghĩa</th></tr><tr><td>DIEN.THOAI:1:1
      và DIEN.THOAI:2:1</td><td>trường điện thoại có hai giá trị: giá trị thứ 1 và
