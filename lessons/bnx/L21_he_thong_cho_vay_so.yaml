  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>int(hashlib.sha256(f"hs{i}".encode()).hexdigest(),
      16)</code></td><td>băm chuỗi <code>hs0</code>, <code>hs1</code>… ra mã thập
      lục phân; <code>int(…, 16)</code> đổi mã đó thành một số nguyên lớn <code>h</code></td><td>mỗi
      hồ sơ có một số h cố định</td></tr><tr><td><code>HE[h % 4]</code>, <code>MAN[h
      // 4 % 6]</code></td><td><code>h % 4</code>: phần dư khi chia h cho 4, tức số
      0 tới 3, chọn một phần tử của danh sách <code>HE</code>; <code>h // 4 % 6</code>:
      chia lấy phần nguyên cho 4 rồi lấy phần dư khi chia cho 6</td><td>4 hệ điều
      hành × 6 màn hình = 24 kiểu máy</td></tr></table>'
    clear: true
    say: Băm chuỗi mã hồ sơ, rồi đổi mã thập lục phân thành một số nguyên lớn. Phần
      dư chọn một phần tử của danh sách, còn chia lấy phần nguyên rồi lấy dư chọn
      kiểu màn hình.
  - show: '<p><b>QuyMo.py (trích): quần thể minh hoạ, mỗi hồ sơ một giấy tờ, chỉ 24
      kiểu máy</b></p><div class="code"><div>import hashlib</div><div>def dau_van_tay(may):</div><div>    chuoi
      = "|".join(may[k] for k in sorted(may))</div><div>    return hashlib.sha256(chuoi.encode()).hexdigest()[:12]</div><div>HE
      = ["Android 13", "Android 14", "iOS 17", "iOS 18"]</div><div>MAN = ["720x1600",
      "1080x2400", "1170x2532", "1290x2796", "1440x3200", "1080x1920"]</div><div>def
      ho_so(i):</div><div>    h = int(hashlib.sha256(f"hs{i}".encode()).hexdigest(),
      16)</div><div>    return {"he": HE[h % 4], "man": MAN[h // 4 % 6], "mui": "UTC+7"}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta thử luật gắn cờ khi hồ sơ tăng. Quần thể minh hoạ có mỗi hồ sơ một giấy
      tờ khác nhau, nhưng chỉ hai mươi bốn kiểu máy. Luật cũ gắn cờ khi một mã có
      từ ba giấy tờ trở lên.
  - show: '<p><b>QuyMo.py (tiếp): đếm, rồi đo ở 5, 500 và 50 000 hồ sơ</b></p><div
      class="code"><div>for n in (5, 500, 50_000):</div><div>    dem = {}</div><div>    for
      i in range(n):</div><div>        dem.setdefault(dau_van_tay(ho_so(i)), set()).add(f"CCCD
      {i}")</div><div>    co = sum(len(v) for v in dem.values() if len(v) &gt;= 3)</div><div>    print(n,
      "ho so,", len(dem), "ma khac nhau,", co, "ho so bi gan co")</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>5 ho so, 5 ma khac nhau, 0 ho so
      bi gan co</div><div>500 ho so, 24 ma khac nhau, 500 ho so bi gan co</div><div>50000
      ho so, 24 ma khac nhau, 50000 ho so bi gan co</div></div>'
    clear: true
    say: 'Kết quả chạy thật: năm hồ sơ không ai bị gắn cờ, còn năm trăm và năm mươi
      nghìn hồ sơ thì tất cả bị gắn cờ, vì chỉ còn hai mươi bốn mã.'
  - show: <table class='t'><tr><th>số hồ sơ N</th><th>mã khác nhau</th><th>bị gắn
      cờ</th><th>người xét cần mỗi ngày (40 hồ sơ mỗi người, số minh hoạ)</th></tr><tr><td><span
      style='white-space:nowrap'>5 (×1)</span></td><td>5</td><td>0</td><td>0</td></tr><tr><td><span
      style='white-space:nowrap'>500 (×100)</span></td><td>24</td><td>500</td><td>13</td></tr><tr><td><span
      style='white-space:nowrap'>50 000 (×10 000)</span></td><td>24</td><td>50 000</td><td>1
      250</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
    say: Luật chỉ có nghĩa khi quần thể nhỏ. Ở năm trăm hồ sơ tất cả bị gắn cờ, cần
      mười ba người xét mỗi ngày nếu mỗi người xét bốn mươi hồ sơ. Ở năm mươi nghìn
      hồ sơ cần một nghìn hai trăm năm mươi người.
  - show: '<table class=''t''><tr><th>cách chữa</th><th>được</th><th>mất</th></tr><tr><td>nâng
      ngưỡng theo quy mô</td><td>ít cờ oan</td><td>kẻ gian có chỗ lách; phải chỉnh
      lại mỗi khi quy mô đổi</td></tr><tr><td>thêm thuộc tính vào dấu vân tay</td><td>nhiều
      mã hơn, ít trùng</td><td>mã giòn hơn: khách đổi hệ điều hành thì mã đổi</td></tr><tr><td>đếm
      trong một cửa sổ thời gian ngắn</td><td>bắt cụm nộp dồn dập</td><td>bỏ sót kẻ
      nộp rải rác nhiều ngày</td></tr><tr><td>coi dấu vân tay là một điểm rủi ro,
      không chặn</td><td>người xét chỉ nhận ca nhiều tín hiệu</td><td>phải có thêm
      tín hiệu khác để chấm</td></tr></table>'
    clear: true
    say: Người làm nghề phải chọn và chấp nhận đánh đổi. Nâng ngưỡng thì ít cờ oan
      nhưng kẻ gian có chỗ lách, thêm thuộc tính thì mã ít trùng nhưng giòn hơn. An
      toàn nhất là coi dấu vân tay chỉ là một điểm rủi ro.
