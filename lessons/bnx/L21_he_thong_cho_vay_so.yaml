scenes:
- id: hook
  kind: hook
  title: '21 giờ, một hồ sơ vay nộp qua ứng dụng: máy quyết định thế nào?'
  checks:
  - alg.bnx_dti(20_000_000, 4_000_000, 5_000_000) == 45
  - alg.bnx_loan_path_ok(['NOP', 'CHAM_DIEM', 'THAM_DINH', 'DUYET', 'DA_KY', 'GIAI_NGAN'])
    == (True, -1)
  steps:
  - show: '<p>21 giờ, một khách nộp hồ sơ vay trên ứng dụng. Thu nhập <b>20 triệu</b>
      đồng mỗi tháng, đang trả nợ cũ <b>4 triệu</b> mỗi tháng, khoản vay mới sẽ phải
      trả <b>5 triệu</b> mỗi tháng.</p>

      <div class="box key">Không có nhân viên nào thức. Máy dựa vào đâu để <b>duyệt
      hay từ chối</b>? Khách <b>ký hợp đồng</b> thế nào khi không có giấy? Làm sao
      biết hồ sơ không phải của kẻ gian, và khi hồ sơ tăng lên hàng chục nghìn, luật
      chặn gian lận nào gãy trước?</div>

      <span class=''note''>(mọi ngưỡng, trọng số và số tiền trong bài là số minh hoạ,
      không phải chính sách của tổ chức nào)</span>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    say: Chào bạn, hai mươi mốt giờ, một khách nộp hồ sơ vay trên ứng dụng, thu nhập
      hai mươi triệu mỗi tháng, đang trả nợ bốn triệu, khoản mới năm triệu. Không
      có nhân viên nào thức, vậy máy dựa vào đâu để duyệt hay từ chối, và khách ký
      hợp đồng thế nào khi không có giấy? Khi số hồ sơ tăng lên hàng chục nghìn thì
      luật chặn gian lận nào gãy trước? Mọi số tiền trong bài là số minh hoạ.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_dti(20, 4, 5) == 45 and 9 * 100 == 45 * 20
  - len(alg.bnx_sha256_hex('a')) == 64 and len(alg.bnx_sha256_hex('a' * 1000)) ==
    64
  - alg.bnx_loan_path_ok(['NOP', 'GIAI_NGAN']) == (False, 0)
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Phần trăm</td><td>tỉ số nhân với 100</td><td>9 trên 20 là 45%; (4 + 5) / 20
      = 0,45</td></tr><tr><td>② Máy trạng thái</td><td>một vật chỉ ở một trạng thái
      tại một lúc, và chỉ được đi theo các bước cho phép</td><td>đèn giao thông: xanh
      → vàng → đỏ, không có xanh → đỏ</td></tr><tr><td>③ Hàm băm</td><td>biến một
      chuỗi dài bất kỳ thành một mã độ dài cố định, gọi là <b>mã băm</b>; đổi một
      ký tự thì mã đổi gần như toàn bộ</td><td>SHA-256, một hàm băm chuẩn, luôn cho
      64 ký tự thập lục phân (chữ số và a–f)</td></tr><tr><td>④ Cặp khoá</td><td>khoá
      riêng giữ kín để ký; khoá công khai phát cho mọi người để kiểm</td><td>ký bằng
      khoá riêng, ai có khoá công khai cũng kiểm được</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    introduces:
    - bnx_ma_bam
    - bnx_thap_luc_phan
    say: Trước hết ta cần hiểu bốn điều, phần trăm là tỉ số nhân với một trăm, ví
      dụ chín trên hai mươi là bốn mươi lăm phần trăm. Máy trạng thái chỉ ở một trạng
      thái tại một lúc và chỉ đi theo các bước cho phép, giống đèn giao thông. Hàm
      băm biến chuỗi dài bất kỳ thành một mã độ dài cố định gọi là mã băm, và đổi
      một ký tự thì mã đổi gần như toàn bộ. Cặp khoá gồm khoá riêng để ký và khoá
      công khai để kiểm.
- id: sym
  kind: symbol
  title: Giải mã từ ngữ và nhóm nợ
  checks:
  - '[alg.bnx_debt_group(n) for n in (0, 9, 10, 90, 91, 180, 181, 360, 361)] == [1,
    1, 2, 2, 3, 3, 4, 4, 5]'
  - alg.bnx_debt_group(9) == 1 and alg.bnx_debt_group(10) == 2 and alg.bnx_debt_group(91)
    == 3
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>LOS (Loan
      Origination System)</td><td>hệ khởi tạo khoản vay: nhận hồ sơ, chấm điểm, thẩm
      định, duyệt, ký, tới lúc giải ngân (chuyển tiền vay cho khách)</td></tr><tr><td>LMS
      (Loan Management System)</td><td>hệ quản lý khoản vay: sau giải ngân, giữ lịch
      trả nợ, thu nợ, theo dõi quá hạn, tất toán (trả hết nợ, đóng khoản vay)</td></tr><tr><td>DTI
      (debt-to-income)</td><td>tỉ lệ nghĩa vụ trả nợ hằng tháng trên thu nhập hằng
      tháng</td></tr><tr><td>thẻ điểm (scorecard)</td><td>bảng đổi từng đặc trưng
      của khách thành điểm rồi cộng lại</td></tr><tr><td>thẩm định (underwriting)</td><td>áp
      các luật theo thứ tự để ra: duyệt, từ chối, hoặc chuyển người xét</td></tr><tr><td>ký
      số từ xa, ECM</td><td>khoá riêng nằm ở nơi cấp chứng thư số (CA); chứng thư
      số là giấy điện tử xác nhận khoá công khai này của ai, do nơi cấp ký; ECM là
      kho lưu hồ sơ và văn bản</td></tr><tr><td>2FA, OTP, dấu vân tay thiết bị</td><td>xác
      thực hai yếu tố; OTP là mã dùng một lần gửi tới điện thoại; dấu vân tay thiết
      bị là mã rút ra từ thuộc tính của máy</td></tr></table>'
    introduces:
    - bnx_los
    - bnx_lms
    - bnx_dti
    - bnx_the_diem
    - bnx_otp
    - bnx_ecm
    say: Bảng này giải mã các từ của bài. LOS là hệ khởi tạo khoản vay, còn LMS là
      hệ quản lý khoản vay sau giải ngân. DTI là tỉ lệ nghĩa vụ trả nợ trên thu nhập,
      thẻ điểm là bảng đổi đặc trưng thành điểm. Ký số từ xa để khoá riêng ở nơi cấp
      chứng thư, OTP là mã dùng một lần, và dấu vân tay thiết bị là mã rút ra từ thuộc
      tính của máy.
  - show: '<p><b>Bảng nhóm nợ viết thành hàm: dò từng mốc trần</b></p><div class="code"><div>def
      nhom_no(ngay):      # Thông tư 31/2024/TT-NHNN, Điều 10</div><div>    for nhom,
      tran in ((1, 9), (2, 90), (3, 180), (4, 360)):</div><div>        if ngay &lt;=
      tran:</div><div>            return nhom</div><div>    return 5</div><div>print([nhom_no(n)
      for n in (0, 9, 10, 90, 91, 180, 181, 360, 361)])</div></div><p><b>Kết quả chạy
      thật</b></p><div class="code"><div>[1, 1, 2, 2, 3, 3, 4, 4, 5]</div></div><p
      class=''small''>Thông tư 31/2024/TT-NHNN, Điều 10, phần tính theo số ngày quá
      hạn; thông tư này đã được Thông tư 37/2025/TT-NHNN sửa đổi một số điều (chưa
      đối chiếu bản hợp nhất); văn bản còn các điều kiện khác, đọc nguyên văn trước
      khi áp dụng.</p>'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Lịch sử trả nợ tóm thành nhóm nợ theo Thông tư ba mươi mốt năm hai nghìn
      không trăm hai mươi tư, Điều mười, phần số ngày quá hạn. Chạy thật cho thấy
      ngày chín còn nhóm một, ngày mười sang nhóm hai, ngày chín mươi mốt sang nhóm
      ba. Thông tư này đã được thông tư năm hai nghìn không trăm hai mươi lăm sửa
      một số điều, nên phải đọc bản mới.
