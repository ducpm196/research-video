  - alg.bnx_ofs_fields('UNG.DUNG.MAU,/I/PROCESS,NGUOI.DUNG/******/CN001,HS001,DIEN.THOAI:1:1=0901000111,DIEN.THOAI:2:1=0902000222,DIA.CHI:1:1=12
    Le Loi,DIA.CHI:1:2=Quan 1')['DIA.CHI'][(1, 2)] == 'Quan 1'
  steps:
  - show: '<p><b>Bước 1. Máy trạng thái của hồ sơ: bảng các bước được phép</b></p><div
      class="code"><div>BUOC = {"NOP": ["CHAM_DIEM"], "CHAM_DIEM": ["THAM_DINH", "TU_CHOI"],</div><div>        "THAM_DINH":
      ["DUYET", "TU_CHOI", "XET_TAY"],</div><div>        "XET_TAY": ["DUYET", "TU_CHOI"],
      "DUYET": ["DA_KY"],</div><div>        "DA_KY": ["GIAI_NGAN"], "GIAI_NGAN": [],
      "TU_CHOI": []}</div><div>def chuyen(tu, den):</div><div>    if den not in BUOC[tu]:</div><div>        raise
      ValueError(f"không được đi {tu} -&gt; {den}")</div><div>    return den</div></div>'
    focus:
    - 1
    - '2.1'
    - '2.6'
    say: Bước một, ta viết máy trạng thái của hồ sơ bằng Python. Bảng này ghi từ mỗi
      trạng thái được đi tới những trạng thái nào. Hàm chuyển kiểm bước đi có nằm
      trong bảng không, vì nếu không kiểm thì một lỗi lập trình có thể giải ngân hồ
      sơ chưa ký.
  - show: '<div class="code"><div>tt = "NOP"</div><div>for den in ["CHAM_DIEM", "THAM_DINH",
      "DUYET", "DA_KY", "GIAI_NGAN"]:</div><div>    tt = chuyen(tt, den)</div><div>print("hồ
      sơ tới", tt)</div><div>try:</div><div>    chuyen("DUYET", "GIAI_NGAN")</div><div>except
      ValueError as loi:</div><div>    print("chặn:", loi)</div></div><p><b>Làm thử
      — kết quả chạy thật</b></p><div class="code"><div>hồ sơ tới GIAI_NGAN</div><div>chặn:
      không được đi DUYET -&gt; GIAI_NGAN</div></div>'
    focus:
    - '1.1'
    - '1.5'
    - '3.2'
    clear: true
    say: Làm thử, ta cho hồ sơ đi đúng năm bước, và máy in hồ sơ tới trạng thái giải
      ngân. Rồi ta thử nhảy từ duyệt thẳng sang giải ngân. Máy chặn lại, vì bước đó
      không có trong bảng.
  - show: '<p><b>Bước 2.</b> Tỉ lệ nghĩa vụ trả nợ trên thu nhập (DTI). Vì khoản vay
      mới làm tăng số tiền phải trả mỗi tháng, ta cộng nó vào nợ đang trả rồi mới
      chia:</p>

      $$\text{DTI} = \frac{\text{đang trả} + \text{khoản mới}}{\text{thu nhập}} \cdot
      100\%$$

      <span class=''note''>Làm thử: (4 + 5) / 20 = 45%. Ngưỡng minh hoạ 50%: 45% không
      vượt nên qua. Ngưỡng là chính sách của từng tổ chức, không phải hằng số.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    clear: true
    say: Bước hai là tỉ lệ nghĩa vụ trả nợ trên thu nhập. Vì khoản vay mới làm tăng
      số tiền phải trả mỗi tháng, nên ta cộng nó vào nợ đang trả rồi mới chia cho
      thu nhập. Công thức là nợ đang trả cộng khoản mới, chia thu nhập, nhân một trăm
      phần trăm. Làm thử, bốn cộng năm là chín, chín chia hai mươi là bốn mươi lăm
      phần trăm, không vượt ngưỡng minh hoạ năm mươi phần trăm nên qua. Ngưỡng này
      là chính sách của từng tổ chức, không phải hằng số.
    introduces:
    - cdot
  - show: '<table class=''t''><tr><th>Bước 3: thẻ điểm (trọng số minh hoạ)</th><th>điều
      kiện</th><th>điểm</th></tr><tr><td>thu nhập</td><td>từ 15 triệu trở lên / thấp
      hơn</td><td>35 / 20</td></tr><tr><td>lịch sử trả nợ</td><td>nhóm 1 / nhóm khác</td><td>25
      / 0</td></tr><tr><td>thời gian làm việc</td><td>từ 24 tháng / ngắn hơn</td><td>20
      / 10</td></tr><tr><td>tổng của khách trong ví dụ</td><td>20 triệu, nhóm 1, 36
      tháng</td><td>35 + 25 + 20 = 80</td></tr></table><span class=''note''>Ngưỡng
      duyệt minh hoạ: 70 điểm. 80 không thấp hơn 70 nên qua.</span>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    clear: true
    say: Bước ba là thẻ điểm, với trọng số minh hoạ. Thu nhập từ mười lăm triệu trở
      lên được ba mươi lăm điểm, thấp hơn được hai mươi. Lịch sử trả nợ ở nhóm một
      được hai mươi lăm điểm, nhóm khác không điểm. Làm việc từ hai mươi bốn tháng
      được hai mươi điểm, ngắn hơn được mười. Khách trong ví dụ có ba mươi lăm cộng
      hai mươi lăm cộng hai mươi, bằng tám mươi điểm. Vì tám mươi không thấp hơn ngưỡng
      duyệt minh hoạ bảy mươi, nên qua.
  - show: '<p><b>Bước 4. Bộ máy quyết định: luật loại trước, rồi tỉ lệ, rồi điểm</b></p><div
      class="code"><div>NGUONG_DTI, NGUONG_DIEM = 50, 70     # số minh hoạ</div><div>def
      tham_dinh(thu_nhap, dang_tra, khoan_moi, nhom, thang):</div><div>    no = dang_tra
      + khoan_moi</div><div>    diem = ((35 if thu_nhap &gt;= 15_000_000 else 20)</div><div>            +
      (25 if nhom == 1 else 0) + (20 if thang &gt;= 24 else 10))</div><div>    if
      nhom &gt;= 2:</div><div>        kq = "XET_TAY"</div><div>    elif no * 100 &gt;
      NGUONG_DTI * thu_nhap or diem &lt; NGUONG_DIEM:</div><div>        kq = "TU_CHOI"</div><div>    else:</div><div>        kq
      = "DUYET"</div><div>    return no * 100 / thu_nhap, diem, kq</div></div>'
    focus:
    - 1
    - 1
    - '2.6'
    - '2.8'
    - '2.8'
    clear: true
    say: Bước bốn ghép lại thành bộ máy quyết định. Thứ tự luật quan trọng, vì luật
      loại phải chạy trước mọi phép tính điểm. Ở đây, nhóm nợ từ hai trở lên thì chuyển
      cho người xét. Tiếp theo, tỉ lệ vượt ngưỡng hoặc điểm dưới ngưỡng thì từ chối,
      còn lại là duyệt. Phép so tỉ lệ dùng nhân chéo thay cho chia rồi làm tròn, vì
      làm tròn có thể cho qua một hồ sơ vừa vượt ngưỡng.
  - show: '<p><b>Bước 5. Băm hợp đồng, rồi đổi đúng một ký tự (5 thành 6)</b></p><div
      class="code"><div>import hashlib</div><div>hd = "Hop dong vay 50000000 dong,
      ky han 12 thang\n"</div><div>sua = hd.replace("50000000", "60000000")</div><div>a
      = hashlib.sha256(hd.encode()).hexdigest()</div><div>b = hashlib.sha256(sua.encode()).hexdigest()</div><div>print(a[:16],
