scenes:
- id: hook
  kind: hook
  title: '21 giờ, một hồ sơ vay nộp qua ứng dụng: máy quyết định thế nào?'
  checks:
  - alg.bnx_dti(20_000_000, 4_000_000, 5_000_000) == 45
  - alg.bnx_loan_path_ok(['NOP', 'CHAM_DIEM', 'THAM_DINH', 'DUYET', 'DA_KY', 'GIAI_NGAN'])
    == (True, -1)
  steps:
  - show: '<p>21 giờ, một khách nộp hồ sơ vay trên ứng dụng. Thu nhập <b>20 triệu</b>
      đồng mỗi tháng, đang trả nợ cũ <b>4 triệu</b> mỗi tháng, khoản vay mới sẽ phải
      trả <b>5 triệu</b> mỗi tháng.</p>

      <div class="box key">Không có nhân viên nào thức. Hệ thống dựa vào đâu để <b>duyệt
      hay từ chối</b>, khách <b>ký hợp đồng</b> thế nào khi không có giấy, và làm
      sao biết hồ sơ này không phải của kẻ gian?</div>

      <span class=''note''>(mọi ngưỡng, trọng số và số tiền trong bài là số minh hoạ,
      không phải chính sách của tổ chức nào)</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Chào bạn, hai mươi mốt giờ, một khách nộp hồ sơ vay trên ứng dụng. Thu nhập
      hai mươi triệu đồng mỗi tháng, đang trả nợ cũ bốn triệu, khoản vay mới sẽ phải
      trả năm triệu mỗi tháng. Lúc đó không có nhân viên nào thức, vậy hệ thống dựa
      vào đâu để duyệt hay từ chối? Khách ký hợp đồng thế nào khi không có giấy, và
      làm sao biết hồ sơ không phải của kẻ gian? Mọi ngưỡng, trọng số và số tiền trong
      bài là số minh hoạ, không phải chính sách của tổ chức nào.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>phần trả lời trong bài</th></tr><tr><td>hồ
      sơ đi qua những trạng thái nào</td><td>máy trạng thái: nộp, chấm điểm, thẩm
      định, duyệt, ký, giải ngân</td></tr><tr><td>duyệt dựa vào đâu</td><td>tỉ lệ
      nghĩa vụ trả nợ trên thu nhập và thẻ điểm</td></tr><tr><td>ký không giấy thế
      nào</td><td>băm hợp đồng rồi ký lên mã băm; lưu tệp đã ký vào kho hồ sơ</td></tr><tr><td>chặn
      kẻ gian bằng gì</td><td>xác thực hai yếu tố và dấu vân tay thiết bị</td></tr><tr><td>gửi
      dữ liệu sang lõi ngân hàng ra sao</td><td>bản tin có trường đa trị</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: Bài này trả lời năm câu hỏi. Hồ sơ đi qua những trạng thái nào. Hệ thống
      duyệt dựa vào đâu. Ký không giấy thế nào. Chặn kẻ gian bằng gì. Và dữ liệu được
      gửi sang lõi ngân hàng ra sao.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_dti(20, 4, 5) == 45 and 9 * 100 == 45 * 20
  - len(alg.bnx_sha256_hex('a')) == 64 and len(alg.bnx_sha256_hex('a' * 1000)) ==
    64
  - alg.bnx_loan_path_ok(['NOP', 'GIAI_NGAN']) == (False, 0)
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Phần trăm</td><td>tỉ số nhân với 100</td><td>9 trên 20 là 45%</td></tr><tr><td>②
      Máy trạng thái</td><td>một vật chỉ ở một trạng thái tại một lúc, và chỉ được
      đi theo các bước cho phép</td><td>đèn giao thông: xanh → vàng → đỏ, không có
      xanh → đỏ</td></tr><tr><td>③ Hàm băm</td><td>biến một chuỗi dài bất kỳ thành
      một mã có độ dài cố định; đổi một ký tự thì mã đổi gần như toàn bộ</td><td>SHA-256
      luôn cho 64 ký tự thập lục phân</td></tr><tr><td>④ Cặp khoá</td><td>khoá riêng
      giữ kín để ký; khoá công khai phát cho mọi người để kiểm</td><td>ký bằng khoá
      riêng, ai có khoá công khai cũng kiểm được</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều. Phần trăm là tỉ số nhân với một trăm, ví
      dụ chín trên hai mươi là bốn mươi lăm phần trăm. Máy trạng thái là một vật chỉ
      ở một trạng thái tại một lúc, và chỉ được đi theo các bước cho phép, giống đèn
      giao thông. Hàm băm biến một chuỗi dài bất kỳ thành một mã có độ dài cố định,
      và đổi một ký tự thì mã đổi gần như toàn bộ. Cặp khoá gồm khoá riêng giữ kín
      để ký, và khoá công khai phát cho mọi người để kiểm.
  - show: $$\frac{9}{20} = 0{,}45 = 45\%$$
    say: Một ví dụ số cho phần trăm. Chín chia hai mươi bằng không phẩy bốn mươi lăm,
      tức là bốn mươi lăm phần trăm. Ta sẽ gặp lại đúng con số này khi thẩm định hồ
      sơ.
- id: sym
  kind: symbol
  title: Giải mã từ ngữ và nhóm nợ
  checks:
  - '[alg.bnx_debt_group(n) for n in (0, 9, 10, 90, 91, 180, 181, 360, 361)] == [1,
    1, 2, 2, 3, 3, 4, 4, 5]'
  - alg.bnx_debt_group(9) == 1 and alg.bnx_debt_group(10) == 2 and alg.bnx_debt_group(91)
    == 3
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>LOS (Loan
      Origination System)</td><td>hệ khởi tạo khoản vay: nhận hồ sơ, chấm điểm, thẩm
      định, duyệt, ký, tới lúc giải ngân</td></tr><tr><td>LMS (Loan Management System)</td><td>hệ
      quản lý khoản vay: sau giải ngân, giữ lịch trả nợ, thu nợ, theo dõi quá hạn,
      tất toán</td></tr><tr><td>DTI (debt-to-income)</td><td>tỉ lệ nghĩa vụ trả nợ
      hằng tháng trên thu nhập hằng tháng</td></tr><tr><td>thẻ điểm (scorecard)</td><td>bảng
      đổi từng đặc trưng của khách thành điểm rồi cộng lại</td></tr><tr><td>thẩm định
      (underwriting), bộ máy quyết định</td><td>áp các luật theo thứ tự để ra: duyệt,
      từ chối, hoặc chuyển người xét</td></tr><tr><td>Cloud CA, ECM</td><td>ký số
      từ xa: khoá riêng nằm ở nơi cấp chứng thư (CA); chứng thư số gắn khoá công khai
      với một chủ thể và do CA ký (RFC 5280); ECM là kho lưu hồ sơ và văn bản</td></tr><tr><td>2FA,
      device fingerprint</td><td>xác thực hai yếu tố; dấu vân tay thiết bị: mã rút
      ra từ các thuộc tính của máy</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    say: Bảng này giải mã các từ của bài. LOS là hệ khởi tạo khoản vay, lo từ lúc
      nhận hồ sơ tới lúc giải ngân. LMS là hệ quản lý khoản vay, lo phần sau giải
      ngân như lịch trả nợ, thu nợ và theo dõi quá hạn. DTI là tỉ lệ nghĩa vụ trả
      nợ hằng tháng trên thu nhập hằng tháng. Thẻ điểm là bảng đổi từng đặc trưng
      của khách thành điểm rồi cộng lại. Thẩm định là áp các luật theo thứ tự để ra
      quyết định duyệt, từ chối, hoặc chuyển cho người xét. Ký số từ xa nghĩa là khoá
      riêng nằm ở nơi cấp chứng thư, chứng thư gắn khoá công khai với một người, còn
      ECM là kho lưu hồ sơ và văn bản. Cuối cùng là xác thực hai yếu tố, và dấu vân
      tay thiết bị, tức một mã rút ra từ các thuộc tính của máy.
  - show: <table class='t'><tr><th>nhóm nợ</th><th>số ngày quá hạn</th></tr><tr><td>nhóm
      1</td><td>dưới 10 ngày (kể cả đang trong hạn)</td></tr><tr><td>nhóm 2</td><td>từ
      10 đến 90 ngày</td></tr><tr><td>nhóm 3</td><td>từ 91 đến 180 ngày</td></tr><tr><td>nhóm
      4</td><td>từ 181 đến 360 ngày</td></tr><tr><td>nhóm 5</td><td>trên 360 ngày</td></tr></table><p
      class='small'>Thông tư 31/2024/TT-NHNN, Điều 10, phần tính theo số ngày quá
      hạn; văn bản còn các điều kiện khác, đọc nguyên văn thông tư trước khi áp dụng.</p>
    focus:
    - 1
    - '1.2'
    - '1.4'
    - 2
    clear: true
    say: Lịch sử trả nợ của khách được tóm thành nhóm nợ. Theo Thông tư ba mươi mốt
      năm hai nghìn không trăm hai mươi tư, nhóm một là quá hạn dưới mười ngày, nhóm
      hai từ mười đến chín mươi ngày. Nhóm ba từ chín mươi mốt đến một trăm tám mươi
      ngày, nhóm bốn từ một trăm tám mươi mốt đến ba trăm sáu mươi ngày, nhóm năm
      trên ba trăm sáu mươi ngày. Đây là phần tính theo số ngày quá hạn, văn bản còn
      các điều kiện khác nên phải đọc nguyên văn thông tư trước khi áp dụng.
  - show: '<p><b>Bảng nhóm nợ viết thành hàm: dò từng mốc trần</b></p><div class="code"><div>def
      nhom_no(ngay):      # Thông tư 31/2024/TT-NHNN, Điều 10</div><div>    for nhom,
      tran in ((1, 9), (2, 90), (3, 180), (4, 360)):</div><div>        if ngay &lt;=
      tran:</div><div>            return nhom</div><div>    return 5</div><div>print([nhom_no(n)
      for n in (0, 9, 10, 90, 91, 180, 181, 360, 361)])</div></div><p><b>Kết quả chạy
      thật</b></p><div class="code"><div>[1, 1, 2, 2, 3, 3, 4, 4, 5]</div></div>'
    focus:
    - '2.2'
    - '4.1'
    clear: true
    say: Ta viết bảng nhóm nợ thành một hàm Python, dò lần lượt từng mốc trần là chín,
      chín mươi, một trăm tám mươi và ba trăm sáu mươi ngày. Kết quả chạy thật cho
      thấy ngày thứ chín còn ở nhóm một, ngày thứ mười sang nhóm hai, ngày chín mươi
      mốt sang nhóm ba.
