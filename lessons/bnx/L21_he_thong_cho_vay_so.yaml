  - alg.bnx_ofs_fields('UNG.DUNG.MAU,/I/PROCESS,NGUOI.DUNG/******/CN001,HS001,DIEN.THOAI:1:1=0901000111,DIEN.THOAI:2:1=0902000222,DIA.CHI:1:1=12
    Le Loi,DIA.CHI:1:2=Quan 1')['DIA.CHI'][(1, 2)] == 'Quan 1'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã Python</th><th>nghĩa</th></tr><tr><td><code>{"A":
      ["B"]}</code>, <code>BUOC[tu]</code></td><td>bảng tra: khoá A ứng với danh sách
      <code>["B"]</code>; <code>BUOC[tu]</code> lấy danh sách của <code>tu</code></td></tr><tr><td><code>if
      den not in …: raise ValueError(…)</code></td><td>nếu <code>den</code> không
      có trong danh sách thì báo lỗi, dừng hàm</td></tr><tr><td><code>try: … except
      ValueError as loi:</code></td><td>thử chạy khối trên; nếu có lỗi loại đó thì
      chạy khối dưới, lỗi nằm trong <code>loi</code></td></tr><tr><td><code>f"… {tu}
      …"</code></td><td>chuỗi có chỗ điền giá trị của biến đặt trong ngoặc nhọn</td></tr><tr><td><code>d.setdefault(k,
      set()).add(x)</code></td><td>lấy mục k của bảng (chưa có thì tạo tập rỗng) rồi
      thêm x</td></tr><tr><td><code>zip(a, b)</code>, <code>sum(x != y for x, y in
      zip(a, b))</code></td><td>ghép từng cặp phần tử của hai chuỗi; mỗi cặp khác
      nhau tính 1, <code>sum</code> cộng lại: đếm số vị trí khác nhau</td></tr></table>'
    clear: true
    say: Trước khi đọc mã, ta nhắc vài cú pháp Python vì mã dùng chúng liên tục. Bảng
      tra ghi mỗi trạng thái đi được tới đâu, và lệnh báo lỗi dừng hàm khi bước đi
      không có trong bảng, khối thử bắt lỗi đó.
  - show: '<p><b>Bước 1. Máy trạng thái của hồ sơ: bảng các bước được phép</b></p><div
      class="code"><div>BUOC = {"NOP": ["CHAM_DIEM"], "CHAM_DIEM": ["THAM_DINH", "TU_CHOI"],</div><div>        "THAM_DINH":
      ["DUYET", "TU_CHOI", "XET_TAY"],</div><div>        "XET_TAY": ["DUYET", "TU_CHOI"],
      "DUYET": ["DA_KY"],</div><div>        "DA_KY": ["GIAI_NGAN"], "GIAI_NGAN": [],
      "TU_CHOI": []}</div><div>def chuyen(tu, den):</div><div>    if den not in BUOC[tu]:</div><div>        raise
      ValueError(f"không được đi {tu} -&gt; {den}")</div><div>    return den</div></div>'
    focus:
    - 1
    - '2.1'
    clear: true
    say: 'Bước một, ta viết máy trạng thái bằng Python: một bảng ghi từ mỗi trạng
      thái được đi tới đâu. Hàm chuyển kiểm bước đi có trong bảng không, vì nếu không
      kiểm thì một lỗi có thể giải ngân hồ sơ chưa ký.'
  - show: '<div class="code"><div>tt = "NOP"</div><div>for den in ["CHAM_DIEM", "THAM_DINH",
      "DUYET", "DA_KY", "GIAI_NGAN"]:</div><div>    tt = chuyen(tt, den)</div><div>print("hồ
      sơ tới", tt)</div><div>try:</div><div>    chuyen("DUYET", "GIAI_NGAN")</div><div>except
      ValueError as loi:</div><div>    print("chặn:", loi)</div></div><p><b>Làm thử
      — kết quả chạy thật</b></p><div class="code"><div>hồ sơ tới GIAI_NGAN</div><div>chặn:
      không được đi DUYET -&gt; GIAI_NGAN</div></div>'
    focus:
    - '1.1'
    - '3.2'
    clear: true
    say: 'Làm thử: cho hồ sơ đi đúng năm bước thì máy in hồ sơ tới giải ngân. Nhảy
      từ duyệt thẳng sang giải ngân thì máy chặn, vì bước đó không có trong bảng.'
  - show: '<p><b>Bước 2.</b> Tỉ lệ nghĩa vụ trả nợ trên thu nhập (DTI). Khoản vay
      mới làm tăng số tiền phải trả mỗi tháng, nên ta cộng nó vào nợ đang trả rồi
      mới chia:</p>

      $$\text{DTI} = \frac{\text{đang trả} + \text{khoản mới}}{\text{thu nhập}} \cdot
      100\%$$

      <span class=''note''>Làm thử: (4 + 5) / 20 = 45%. Ngưỡng minh hoạ 50%: 45% không
      vượt nên qua. Ngưỡng là chính sách của từng tổ chức, không phải hằng số.</span>

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai là tỉ lệ nghĩa vụ trên thu nhập. Khoản mới làm tăng số tiền phải
      trả mỗi tháng, nên ta cộng nó vào nợ đang trả rồi chia cho thu nhập. Chín chia
      hai mươi là bốn mươi lăm phần trăm, không vượt ngưỡng nên qua.
    introduces:
    - cdot
  - show: '<table class=''t''><tr><th>Bước 3: thẻ điểm (trọng số minh hoạ)</th><th>điều
      kiện</th><th>điểm</th></tr><tr><td>thu nhập</td><td>từ 15 triệu trở lên / thấp
      hơn</td><td>35 / 20</td></tr><tr><td>lịch sử trả nợ</td><td>nhóm 1 / nhóm khác</td><td>25
      / 0</td></tr><tr><td>thời gian làm việc</td><td>từ 24 tháng / ngắn hơn</td><td>20
      / 10</td></tr><tr><td>tổng của khách trong ví dụ</td><td>20 triệu, nhóm 1, 36
      tháng</td><td>35 + 25 + 20 = 80</td></tr></table><span class=''note''>Ngưỡng
      duyệt minh hoạ: 70 điểm. 80 không thấp hơn 70 nên qua.</span>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước ba là thẻ điểm với trọng số minh hoạ. Khách trong ví dụ có ba mươi lăm
      cộng hai mươi lăm cộng hai mươi, bằng tám mươi điểm, không thấp hơn ngưỡng bảy
      mươi nên qua.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>(35
      if thu_nhap &gt;= 15_000_000 else 20)</code></td><td>biểu thức điều kiện: giá
      trị là 35 nếu thu nhập từ 15 triệu trở lên, ngược lại là 20; <code>15_000_000</code>:
      dấu gạch dưới chỉ để dễ đọc số</td><td>thu nhập 20 triệu ra 35</td></tr><tr><td><code>return
      no * 100 / thu_nhap, diem, kq</code></td><td>trả về ba giá trị một lúc; nơi
      gọi nhận cả bộ ba</td><td><code>(45.0, 80, ''DUYET'')</code></td></tr></table>'
    clear: true
    say: Mã quyết định dùng hai chỗ mới nên ta giải trước. Biểu thức điều kiện cho
      giá trị đầu nếu điều kiện đúng, ngược lại cho giá trị sau; dấu gạch dưới trong
      số chỉ để dễ đọc. Một hàm có thể trả về ba giá trị một lúc, và nơi gọi nhận
      cả bộ ba.
  - show: '<p><b>Bước 4. Bộ máy quyết định: luật loại trước, rồi tỉ lệ, rồi điểm</b></p><div
      class="code"><div>NGUONG_DTI, NGUONG_DIEM = 50, 70     # số minh hoạ</div><div>def
      tham_dinh(thu_nhap, dang_tra, khoan_moi, nhom, thang):</div><div>    no = dang_tra
      + khoan_moi</div><div>    diem = ((35 if thu_nhap &gt;= 15_000_000 else 20)</div><div>            +
      (25 if nhom == 1 else 0) + (20 if thang &gt;= 24 else 10))</div><div>    if
      nhom &gt;= 2:</div><div>        kq = "XET_TAY"</div><div>    elif no * 100 &gt;
      NGUONG_DTI * thu_nhap or diem &lt; NGUONG_DIEM:</div><div>        kq = "TU_CHOI"</div><div>    else:</div><div>        kq
      = "DUYET"</div><div>    return no * 100 / thu_nhap, diem, kq</div></div>'
    focus:
    - 1
    - '2.6'
    - '2.8'
    clear: true
    say: Bước bốn ghép thành bộ máy quyết định, và thứ tự luật quan trọng. Nhóm nợ
      từ hai trở lên thì chuyển người xét, rồi tỉ lệ vượt hoặc điểm thấp thì từ chối,
      còn lại là duyệt. Phép so dùng nhân chéo vì làm tròn có thể cho qua hồ sơ vừa
      vượt ngưỡng.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>hashlib.sha256(hd.encode()).hexdigest()</code></td><td><code>import
      hashlib</code> nạp thư viện băm; <code>encode()</code> đổi chuỗi chữ thành dãy
      byte; <code>sha256</code> băm nó; <code>hexdigest()</code> viết mã băm bằng
      chữ số thập lục phân</td><td>ra chuỗi 64 ký tự</td></tr><tr><td><code>a[:16]</code>,
      <code>len(a)</code></td><td>cắt lát: <code>a[:16]</code> là 16 ký tự đầu của
      a; <code>len(a)</code>: số ký tự</td><td><code>662097aa0554ed46</code></td></tr><tr><td><code>hd.replace("50000000",
      "60000000")</code></td><td>bản sao của chuỗi với mọi chỗ <code>50000000</code>
      đổi thành <code>60000000</code></td><td>đổi một ký tự 5 thành 6</td></tr></table>'
    clear: true
    say: Bước năm dùng ba cú pháp mới nên ta giải trước. Đổi chuỗi thành dãy byte,
      băm rồi viết mã băm bằng chữ số thập lục phân. Cắt lát lấy mười sáu ký tự đầu,
      còn hàm độ dài đếm số ký tự. Hàm thay chữ tạo bản sao của chuỗi với chữ cũ đổi
      thành chữ mới.
  - show: '<p><b>Bước 5. Băm hợp đồng, rồi đổi đúng một ký tự (5 thành 6)</b></p><div
      class="code"><div>import hashlib</div><div>hd = "Hop dong vay 50000000 dong,
      ky han 12 thang\n"</div><div>sua = hd.replace("50000000", "60000000")</div><div>a
      = hashlib.sha256(hd.encode()).hexdigest()</div><div>b = hashlib.sha256(sua.encode()).hexdigest()</div><div>print(a[:16],
      "dài", len(a))</div><div>print(b[:16], "dài", len(b))</div><div>print("số vị
      trí khác nhau:", sum(x != y for x, y in zip(a, b)))</div></div><p><b>Kết quả
