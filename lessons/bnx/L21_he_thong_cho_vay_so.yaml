- id: example
  kind: example
  title: Ví dụ một hồ sơ, từng phép tính
  checks:
  - 4 + 5 == 9 and alg.bnx_dti(20, 4, 5) == 45
  - alg.bnx_dti_pass(20_000_000, 4_000_000, 5_000_000, 50) is True
  - alg.bnx_scorecard(20_000_000, 1, 36)[3] == 80 and 80 >= 70
  - alg.bnx_underwrite(20_000_000, 4_000_000, 5_000_000, 1, 36) == 'DUYET'
  - alg.bnx_max_new_payment(20_000_000, 4_000_000, 50) == 6_000_000
  - alg.bnx_sha256_hex('Hop dong vay 50000000 dong, ky han 12 thang\n').startswith('662097aa')
    and alg.bnx_sha256_hex('Hop dong vay 50000000 dong, ky han 12 thang\n'.replace('5',
    '6', 1)).startswith('93938eab')
  steps:
  - show: '<p>Thu nhập <b>20 triệu</b>, đang trả <b>4 triệu</b> mỗi tháng, khoản mới
      trả <b>5 triệu</b> mỗi tháng; nhóm nợ 1; làm việc 36 tháng. <span class=''note''>(mọi
      ngưỡng, trọng số và số tiền trong bài là số minh hoạ, không phải chính sách
      của tổ chức nào)</span></p>

      $$① \; \text{nghĩa vụ mỗi tháng} = 4 + 5 = \hl{9} \text{ triệu}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta làm trọn một hồ sơ. Thu nhập hai mươi triệu, đang trả bốn triệu mỗi tháng,
      khoản mới trả năm triệu mỗi tháng, nhóm nợ một, làm việc ba mươi sáu tháng.
      Phép tính thứ nhất, nghĩa vụ trả nợ mỗi tháng bằng bốn cộng năm, bằng chín triệu.
  - show: '<p>Dùng lại 9 triệu ở phép ①.</p>

      $$② \; \text{DTI} = \frac{9}{20} = \hl{45\%} \leq 50\% \;\Rightarrow\; \text{qua}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ hai dùng lại chín triệu. Tỉ lệ nghĩa vụ trên thu nhập bằng
      chín chia hai mươi, bằng bốn mươi lăm phần trăm. Vì bốn mươi lăm không vượt
      ngưỡng minh hoạ năm mươi phần trăm, nên qua.
    introduces:
    - implies
  - show: $$③ \; \text{điểm} = 35 + 25 + 20 = \hl{80} \geq 70 \;\Rightarrow\; \text{qua}$$
    say: Phép tính thứ ba là thẻ điểm. Ba mươi lăm cộng hai mươi lăm cộng hai mươi,
      bằng tám mươi điểm. Vì tám mươi không thấp hơn ngưỡng duyệt minh hoạ bảy mươi,
      nên qua.
  - show: '<p>Nhóm nợ 1, phép ② qua, phép ③ qua.</p>

      $$④ \; \text{quyết định} = \hlg{\text{DUYET}};\quad \text{khoản trả mới tối
      đa} = 50\% \cdot 20 - 4 = \hl{6} \text{ triệu}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Phép tính thứ tư ghép ba kết quả. Nhóm nợ một nên không bị luật loại, tỉ
      lệ qua, điểm qua, vậy quyết định là duyệt. Ta cũng biết khách còn chỗ tới đâu.
      Năm mươi phần trăm của hai mươi triệu là mười triệu, trừ bốn triệu đang trả,
      còn tối đa sáu triệu cho khoản mới.
  - show: '<p>Hồ sơ đã duyệt thì sang bước ký: băm hợp đồng mẫu ghi 50 000 000 đồng.</p>

      $$⑤ \; \text{mã băm ban đầu: } \texttt{662097aa…};\quad \text{đổi 5 thành 6:
      } \texttt{93938eab…} \;\Rightarrow\; \hl{\text{chữ ký không còn khớp}}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ năm, hồ sơ đã duyệt thì sang bước ký. Mã băm của hợp đồng gốc
      và của bản bị đổi một ký tự khác hẳn nhau, như hai dãy đang hiện. Chữ ký đã
      tạo trên mã băm gốc, nên với bản bị sửa thì chữ ký không còn khớp.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: để máy quyết định, rồi thử hai hồ sơ lân cận'
  checks:
  - 9 * 100 <= 50 * 20 and alg.bnx_dti_pass(20, 4, 5, 50)
  - alg.bnx_underwrite(20_000_000, 4_000_000, 7_000_000, 1, 36) == 'TU_CHOI' and alg.bnx_dti(20,
    4, 7) == 55
  - alg.bnx_underwrite(20_000_000, 4_000_000, 5_000_000, 2, 36) == 'XET_TAY' and alg.bnx_scorecard(20_000_000,
    2, 36)[3] == 55
  - alg.bnx_max_new_payment(20_000_000, 4_000_000, 50) - 5_000_000 == 1_000_000
  - max(alg.bnx_scorecard(i, g, m)[3] for i in (10_000_000, 20_000_000) for g in (1,
    2) for m in (12, 36)) == 80
  steps:
  - show: <p><b>Gọi bộ máy quyết định ở bước 4 với ba hồ sơ</b></p><div class="code"><div>print(tham_dinh(20_000_000,
      4_000_000, 5_000_000, 1, 36))</div><div>print(tham_dinh(20_000_000, 4_000_000,
      7_000_000, 1, 36))</div><div>print(tham_dinh(20_000_000, 4_000_000, 5_000_000,
      2, 36))</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>(45.0,
      80, 'DUYET')</div><div>(55.0, 80, 'TU_CHOI')</div><div>(45.0, 55, 'XET_TAY')</div></div>
    focus:
    - 1
    - 1
    - '4.1'
    - '4.2'
    - '4.3'
    say: Kiểm bằng đường khác. Thay vì tin phép tính tay, ta gọi bộ máy quyết định
      ở bước bốn với ba hồ sơ. Hồ sơ thứ nhất là ví dụ vừa làm, máy in bốn mươi lăm
      phần trăm, tám mươi điểm, duyệt, khớp với tính tay. Hồ sơ thứ hai có khoản mới
      bảy triệu, tỉ lệ lên năm mươi lăm phần trăm nên bị từ chối. Hồ sơ thứ ba ở nhóm
      nợ hai nên chuyển cho người xét, dù tỉ lệ vẫn là bốn mươi lăm phần trăm.
  - show: '<table class=''t''><tr><th>cách kiểm</th><th>phép tính</th><th>kết luận</th></tr><tr><td>nhân
      chéo, không chia</td><td>9 × 100 = 900 không lớn hơn 50 × 20 = 1000</td><td>tỉ
      lệ qua</td></tr><tr><td>tính ngược từ khoản tối đa</td><td>6 − 5 = 1 triệu còn
      dư</td><td>khoản mới 5 triệu nằm trong giới hạn</td></tr><tr><td>điểm bị mất
      so với tối đa</td><td>80 − 80 = 0</td><td>khách đạt mức cao nhất của cả ba đặc
      trưng</td></tr><tr><td>bản sao hợp đồng mang tên khác</td><td>kiểm chữ ký: hợp
      lệ</td><td>chữ ký theo nội dung, không theo tên tệp</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng này kiểm thêm bằng bốn đường. Nhân chéo thì chín nhân một trăm là chín
      trăm, không lớn hơn năm mươi nhân hai mươi là một nghìn, nên tỉ lệ qua. Tính
      ngược thì khoản tối đa sáu triệu trừ khoản mới năm triệu còn dư một triệu. Về
      điểm, tám mươi là mức cao nhất của thẻ, khách không mất điểm nào. Còn bản sao
      hợp đồng mang tên khác vẫn kiểm chữ ký hợp lệ, vì chữ ký theo nội dung chứ không
      theo tên tệp.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - float(alg.bnx_dti(20_000_000, 4_000_000, 6_190_000)) == 50.95
  - (4_000_000 + 6_190_000) * 100 // 20_000_000 == 50 and not alg.bnx_dti_pass(20_000_000,
    4_000_000, 6_190_000, 50)
  - 10_190_000 * 100 == 1_019_000_000 and 50 * 20_000_000 == 1_000_000_000
  - alg.bnx_sha256_hex('Hop dong  vay') != alg.bnx_sha256_hex('Hop dong vay')
  - 'alg.bnx_device_fp({''he'': ''Android 14'', ''man'': ''1080x2400'', ''mui'': ''UTC+7''})
    == alg.bnx_device_fp(dict({''he'': ''Android 14'', ''man'': ''1080x2400'', ''mui'':
    ''UTC+7''}))'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Coi ngưỡng 50% và 70 điểm
      là hằng số của nghề, và nghĩ chữ ký gắn với <b>tên tệp</b>.

      <br><span class="note">Đúng: ngưỡng là chính sách của từng tổ chức, đặt thành
      cấu hình. Chữ ký gắn với nội dung đã băm: đổi tên tệp không sao, đổi một ký
      tự nội dung là lộ.</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là coi ngưỡng năm mươi phần trăm và bảy mươi
      điểm là hằng số của nghề, và nghĩ chữ ký gắn với tên tệp. Thật ra ngưỡng là
      chính sách của từng tổ chức, nên đặt thành cấu hình. Còn chữ ký gắn với nội
      dung đã băm, đổi tên tệp không sao, đổi một ký tự nội dung là lộ.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Tính
