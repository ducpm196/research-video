- id: formula
  kind: formula
  title: 'Suy ra từng bước: trạng thái, thẩm định, ký, chống gian lận, gửi lõi'
  checks:
  - alg.bnx_loan_path_ok(['NOP', 'CHAM_DIEM', 'THAM_DINH', 'DUYET', 'DA_KY', 'GIAI_NGAN'])
    == (True, -1)
  - alg.bnx_loan_path_ok(['DUYET', 'GIAI_NGAN']) == (False, 0)
  - alg.bnx_dti(20_000_000, 4_000_000, 5_000_000) == 45 and alg.bnx_dti_pass(20_000_000,
    4_000_000, 5_000_000, 50)
  - alg.bnx_scorecard(20_000_000, 1, 36) == (35, 25, 20, 80)
  - alg.bnx_scorecard(10_000_000, 2, 12) == (20, 0, 10, 30)
  - alg.bnx_underwrite(20_000_000, 4_000_000, 5_000_000, 1, 36) == 'DUYET'
  - alg.bnx_sha256_hex('Hop dong vay 50000000 dong, ky han 12 thang\n')[:16] == '662097aa0554ed46'
  - alg.bnx_sha256_hex('Hop dong vay 50000000 dong, ky han 12 thang\n'.replace('50000000',
