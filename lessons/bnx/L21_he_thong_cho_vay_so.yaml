    say: Tổng kết chuỗi logic. Hồ sơ vay là một máy trạng thái không có đường tắt.
      Thẩm định chạy luật loại trước, rồi tỉ lệ nghĩa vụ trên thu nhập, rồi thẻ điểm.
      Chữ ký số nằm trên mã băm của nội dung, nên kho hồ sơ phải lưu đúng tệp đã ký.
      Chống gian lận dùng xác thực hai yếu tố cùng tín hiệu từ thiết bị. Còn dữ liệu
      gửi sang lõi đi trong các trường đa trị có vị trí.
  - show: '<table class=''t''><tr><th>Nếu bị hỏi về dòng này trên CV</th><th>ý trả
      lời một dòng</th></tr><tr><td>LOS khác LMS ở đâu?</td><td>LOS lo hồ sơ từ lúc
      nộp tới giải ngân; LMS lo khoản vay sau giải ngân: lịch trả, thu nợ, quá hạn,
      tất toán</td></tr><tr><td>Bộ máy quyết định thẩm định chạy theo thứ tự nào?</td><td>luật
      loại trước (ví dụ nhóm nợ), rồi tỉ lệ nghĩa vụ trên thu nhập, rồi thẻ điểm;
      ngưỡng là cấu hình theo chính sách</td></tr><tr><td>Ký số không giấy rồi đồng
      bộ kho hồ sơ: lưu gì, kiểm gì?</td><td>lưu đúng tệp đã ký, chữ ký, mã băm; băm
      lại tệp trong kho phải ra đúng mã đã ký</td></tr></table><span class=''note''>Trả
      lời bằng cơ chế; không nêu ngưỡng hay số liệu của tổ chức thật.</span>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    clear: true
    say: Đây là ba câu người phỏng vấn hay hỏi về các dòng này trên hồ sơ xin việc.
      Hỏi hai hệ khác nhau ở đâu, thì trả lời LOS lo từ lúc nộp tới giải ngân, LMS
