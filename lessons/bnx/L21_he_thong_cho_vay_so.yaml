id: L21
course: BNX
series: BNX · Backend ngân hàng mở rộng theo JD
title: 'Bài 21 — Hệ thống cho vay số: khởi tạo, chấm điểm, thẩm định, ký số và chống
  gian lận'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: 'curriculum/bnx.yaml L21; audit/bnx/verify_bnx.py L21; audit/bnx/sources_l21.md
  [TT31] Thông tư 31/2024/TT-NHNN Điều 10 (nhóm nợ theo số ngày quá hạn; Công báo
  số 825+826 ngày 21-7-2024, người điều phối đối chiếu 2026-11-11); ký số: chỉ dạy
  cơ chế “chữ ký trên mã băm của nội dung” (chạy thật bằng openssl 3.5.5, hashlib),
  không trích điều khoản Luật Giao dịch điện tử 2023; định dạng trường TRƯỜNG:MV:SV=GIÁ
  TRỊ theo bài ACB L01 trong kho, bản tin là mẫu minh hoạ; mọi ngưỡng, trọng số, số
  tiền là số minh hoạ'
assumes: []
objectives:
- Mô tả các trạng thái của một hồ sơ vay từ lúc nộp tới lúc giải ngân và phân biệt
  hệ khởi tạo với hệ quản lý khoản vay
- Tính tỉ lệ nghĩa vụ trả nợ trên thu nhập và áp một thẻ điểm đơn giản
- Giải thích ký số một hợp đồng bằng mã băm và vì sao sửa một ký tự là lộ
- 'Nêu hai lớp chống gian lận hồ sơ: xác thực hai yếu tố và dấu vân tay thiết bị'
- Đọc một trường đa trị trong bản tin gửi lõi ngân hàng
