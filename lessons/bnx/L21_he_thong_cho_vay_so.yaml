    14'', ''man'': ''1080x2400'', ''mui'': ''UTC+7''}), (''HS3'', ''CCCD 003'', {''he'':
    ''Android 14'', ''man'': ''1080x2400'', ''mui'': ''UTC+7''}), (''HS4'', ''CCCD
