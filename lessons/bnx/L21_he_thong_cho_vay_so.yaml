- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_dti(30, 6, 10) * 3 == 160 and not alg.bnx_dti_pass(30, 6, 10, 50)
  - round(float(alg.bnx_dti(30, 6, 10)), 1) == 53.3
  - alg.bnx_max_new_payment(30_000_000, 6_000_000, 50) == 9_000_000
  - alg.bnx_debt_group(95) == 3
  - alg.bnx_scorecard(12_000_000, 1, 12) == (20, 25, 10, 55) and alg.bnx_underwrite(12_000_000,
    0, 1_000_000, 1, 12) == 'TU_CHOI'
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề (dùng ngưỡng và thẻ điểm minh
      hoạ của bài)</th></tr><tr><td>1</td><td>Thu nhập 30 triệu, đang trả 6 triệu,
      khoản mới trả 10 triệu mỗi tháng. Tỉ lệ là bao nhiêu, có qua ngưỡng 50% không?
      Khoản trả mới tối đa là bao nhiêu?</td></tr><tr><td>2</td><td>Khách quá hạn
      95 ngày thuộc nhóm nợ mấy? Một khách khác thu nhập 12 triệu, nhóm 1, làm việc
      12 tháng được bao nhiêu điểm, có đạt 70 không?</td></tr><tr><td>3</td><td>Quyết
      định: trong một ngày, ba hồ sơ với ba căn cước khác nhau cùng một dấu vân tay
      thiết bị. Từ chối tự động cả ba, hay chuyển người xét kèm xác thực thêm?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, thu nhập ba mươi triệu, đang trả
      sáu triệu, khoản mới trả mười triệu mỗi tháng. Tỉ lệ là bao nhiêu, có qua ngưỡng
      năm mươi phần trăm không, và khoản trả mới tối đa là bao nhiêu? Câu hai, khách
      quá hạn chín mươi lăm ngày thuộc nhóm nợ mấy? Một khách khác thu nhập mười hai
      triệu, nhóm một, làm việc mười hai tháng được bao nhiêu điểm, có đạt bảy mươi
      không? Câu ba, trong một ngày có ba hồ sơ với ba căn cước khác nhau cùng một
      dấu vân tay thiết bị. Nên từ chối tự động cả ba, hay chuyển người xét kèm xác
      thực thêm? Hãy dừng video và làm ra giấy.
  - show: $$\frac{6 + 10}{30} = \frac{16}{30} \approx 53{,}3\% > 50\% \;\Rightarrow\;
      \hl{\text{không qua}};\quad 50\% \cdot 30 - 6 = \hlg{9} \text{ triệu}$$
    say: Đáp án câu một. Sáu cộng mười là mười sáu, mười sáu chia ba mươi xấp xỉ năm
      mươi ba phẩy ba phần trăm, lớn hơn năm mươi phần trăm nên không qua. Khoản trả
      mới tối đa là năm mươi phần trăm của ba mươi triệu, tức mười lăm triệu, trừ
      sáu triệu đang trả, còn chín triệu.
    clear: true
  - show: $$91 \leq 95 \leq 180 \;\Rightarrow\; \hl{\text{nhóm 3}};\quad 20 + 25 +
      10 = \hl{55} < 70 \;\Rightarrow\; \text{không đạt}$$
    say: Đáp án câu hai. Chín mươi lăm ngày nằm trong khoảng từ chín mươi mốt đến
      một trăm tám mươi, nên là nhóm ba. Khách thứ hai được hai mươi cộng hai mươi
      lăm cộng mười, bằng năm mươi lăm điểm, thấp hơn bảy mươi nên không đạt.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>chuyển
      người xét, kèm xác thực thêm</td><td>không từ chối oan gia đình hay cửa hàng
      dùng chung một máy; vẫn chặn được kẻ gian vì thiếu yếu tố thứ hai</td><td>chậm
      hơn, tốn công người xét</td></tr><tr><td>từ chối tự động cả ba</td><td>nhanh,
      không tốn người</td><td>từ chối oan khách thật; kẻ gian chỉ cần đổi máy là qua</td></tr></table>
    say: Đáp án câu ba. Dấu vân tay thiết bị là tín hiệu rủi ro, không phải danh tính,
      nên không đủ để kết luận. Chuyển người xét kèm xác thực thêm thì không từ chối
      oan một gia đình hay cửa hàng dùng chung máy, mà vẫn chặn được kẻ gian. Đổi
      lại chậm hơn và tốn công người xét. Từ chối tự động thì nhanh, nhưng từ chối
      oan khách thật, còn kẻ gian chỉ cần đổi máy. Vì vậy nên chuyển người xét.
    clear: true
