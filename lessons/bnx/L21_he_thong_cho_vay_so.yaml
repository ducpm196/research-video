  - show: '<div class="code"><div>ofs = ("UNG.DUNG.MAU,/I/PROCESS,NGUOI.DUNG/******/CN001,HS001,"</div><div>       "DIEN.THOAI:1:1=0901000111,DIEN.THOAI:2:1=0902000222,"</div><div>       "DIA.CHI:1:1=12
