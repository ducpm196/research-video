scenes:
- id: hook
  kind: hook
  title: Vì sao khởi động lại mà phải đọc hàng triệu bản ghi chỉ để biết vài số dư?
  checks:
  - len(alg.bnx_l10_log()) == 8 and len({k for k, _ in alg.bnx_l10_log()}) == 3
  steps:
  - show: '<p>Dịch vụ tra số dư nhanh khởi động lại, phải đọc lại chủ đề Kafka <code>balances</code>
      từ đầu để biết số dư mới nhất.</p>

      <p>Trong ví dụ: <b>8</b> bản ghi cho <b>3</b> tài khoản. Ngoài đời là hàng triệu
      bản ghi, mà chỉ cần <b>bản cuối</b> của mỗi tài khoản.</p>

      <div class="box key">Cùng lúc: bên nhận lên lược đồ mới có thêm một trường bắt
      buộc, đọc lại thông điệp cũ thiếu trường đó thì vỡ; và thông báo NAPAS phải
      tới đúng hàng đợi.</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Chào bạn, dịch vụ tra số dư nhanh vừa khởi động lại, và phải đọc lại chủ
      đề số dư trong Kafka từ đầu để biết số dư mới nhất. Trong ví dụ có tám bản ghi
      cho ba tài khoản. Ngoài đời là hàng triệu bản ghi, trong khi chỉ cần bản cuối
      của mỗi tài khoản. Cùng lúc đó, bên nhận lên lược đồ mới có thêm một trường
      bắt buộc, đọc lại thông điệp cũ thiếu trường đó thì vỡ. Còn thông báo NAPAS
      phải tới đúng hàng đợi.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>giữ
      nhật ký gọn mà không mất số dư mới nhất</td><td>nén nhật ký theo khoá; bia mộ
      để xoá khoá</td></tr><tr><td>đổi lược đồ thông điệp mà không làm vỡ bên nhận</td><td>kho
      lược đồ kiểm tương thích ngược trước khi cho dùng</td></tr><tr><td>một thông
      điệp tới đúng các hàng đợi cần nó</td><td>sàn chủ đề của RabbitMQ, mẫu * và
      #</td></tr><tr><td>luồng nào dùng Kafka, luồng nào dùng RabbitMQ</td><td>giữ
      để đọc lại hay xoá khi đã xác nhận</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Hôm nay ta trả lời bốn câu hỏi. Thứ nhất, giữ nhật ký gọn mà không mất số
      dư mới nhất, câu trả lời là nén nhật ký theo khoá. Thứ hai, đổi lược đồ thông
      điệp mà không làm vỡ bên nhận, câu trả lời là kho lược đồ kiểm tương thích trước
      khi cho dùng. Thứ ba, đưa một thông điệp tới đúng các hàng đợi cần nó, câu trả
      lời là sàn chủ đề với hai ký hiệu sao và thăng. Thứ tư, khi nào chọn Kafka,
      khi nào chọn hàng đợi có sàn, tuỳ ta cần giữ thông điệp để đọc lại hay xoá khi
      đã xác nhận.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - '[i for i, (k, _) in enumerate(alg.bnx_l10_log()) if k == ''A''] == [0, 2, 5]'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Nhật ký chỉ thêm và offset</td><td>Kafka ghi nối vào cuối, mỗi bản ghi có số
      thứ tự (offset) không đổi</td><td>offset 0, 1, …, 7</td></tr><tr><td>② Khoá
      thông điệp</td><td>nhãn đi kèm, ví dụ số tài khoản; cùng khoá vào cùng phân
      vùng nên giữ thứ tự</td><td>khoá A, B, C</td></tr><tr><td>③ Tương thích ngược
      / xuôi</td><td>ngược: bên đọc dùng lược đồ mới đọc được dữ liệu cũ; xuôi: bên
      đọc cũ đọc được dữ liệu mới</td><td>thêm trường có mặc định</td></tr><tr><td>④
      Hàng đợi và xác nhận</td><td>bên nhận lấy thông điệp, xử lý xong thì báo đã
      xong (ack)</td><td>xác nhận rồi mới lấy tiếp</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều. Kafka là nhật ký chỉ thêm, ghi nối vào cuối,
      và mỗi bản ghi có một số thứ tự không bao giờ đổi. Khoá thông điệp là nhãn đi
      kèm, ví dụ số tài khoản. Cùng khoá thì vào cùng phân vùng, nên thứ tự theo khoá
      được giữ trong từng phân vùng. Tương thích ngược nghĩa là bên đọc dùng lược
      đồ mới vẫn đọc được dữ liệu cũ. Tương thích xuôi là bên đọc cũ đọc được dữ liệu
      mới. Phần này chỉ nhắc lại. Hàng đợi là nơi bên nhận lấy thông điệp ra, xử lý
      xong thì báo đã xong, gọi là xác nhận.
