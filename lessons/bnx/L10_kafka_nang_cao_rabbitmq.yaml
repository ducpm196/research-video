- id: formula
  kind: formula
  title: 'Suy ra từng bước: nén, bia mộ, kiểm lược đồ, định tuyến'
  checks:
  - len(alg.bnx_compact(alg.bnx_l10_log())) == len({k for k, _ in alg.bnx_l10_log()})
    == 3
  - len(alg.bnx_compact((alg.bnx_l10_log() + [('C', None)]))) == 2
  - alg.bnx_ms_to_hours(86400000) == 86400000 / 3600000 == 24
  - 'alg.bnx_backward_ok({''account'': False, ''amount'': False, ''channel'': True},
    {''account'': False, ''amount'': False}) == (True, [])'
  - 'alg.bnx_backward_ok({''account'': False, ''amount'': False, ''fee'': False},
    {''account'': False, ''amount'': False}) == (False, [''fee''])'
  - '[alg.bnx_topic_match(p, ''payment.vn.napas'') for p in (''payment.*.napas'',
    ''payment.#'', ''payment.*'')] == [True, True, False]'
  steps:
  - show: '<p><b>Bước 1.</b> Bên đọc chủ đề số dư chỉ cần <b>trạng thái cuối</b> của
      mỗi khoá, nên nén nhật ký giữ bản cuối mỗi khoá và giữ nguyên offset:</p>

      $$\text{số bản ghi sau nén} = \text{số khoá khác nhau}$$

      <span class=''note''>Làm thử: 8 bản ghi, khoá A, B, C, đều đã nằm trong đoạn
      đã đóng và bộ dọn đã chạy → còn 3.</span>

      '
    focus:
    - 1
    - 2
    - 3
    say: Bước một, vì bên đọc chủ đề số dư chỉ cần trạng thái cuối của mỗi khoá, nên
      nén nhật ký giữ bản cuối mỗi khoá và giữ nguyên vị trí. Suy ra số bản ghi sau
      nén bằng số khoá khác nhau. Làm thử, tám bản ghi của ba khoá, khi bộ dọn đã
      chạy, thì còn ba.
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>for
      off, (key, val) in enumerate(log):</code></td><td>duyệt kèm số thứ tự <code>off</code>;
      mỗi phần tử là cặp (khoá, giá trị), tách luôn thành hai biến</td></tr><tr><td><code>last[key]
      = (off, val)</code></td><td>từ điển <code>last</code> ghi cặp sau cùng của mỗi
      khoá; bản sau đè bản trước</td></tr><tr><td><code>sorted((…) for … if v is not
      None)</code></td><td>viết gọn: xếp các bộ ba, bỏ bộ có giá trị <code>None</code>
      (rỗng)</td></tr><tr><td><code>log.append(("C", None))</code></td><td>thêm một
      phần tử vào cuối danh sách</td></tr></table>'
    clear: true
    say: Mã Python sắp tới có vài cách viết mới, nên ta giải nghĩa trước. Vòng lặp
      duyệt kèm số thứ tự, từ điển ghi đè bản trước bằng bản sau, và giá trị rỗng
      bị bỏ.
  - show: '<p><b>Bước 2. Mô hình nén nhật ký bằng Python (trạng thái sau thời gian
      giữ bia mộ)</b></p><div class="code"><div>log = [("A", 100), ("B", 200), ("A",
      150), ("C", 50),</div><div>       ("B", 180), ("A", 120), ("C", 75), ("B", 260)]</div><div>def
      compact(log):</div><div>    last = {}</div><div>    for off, (key, val) in enumerate(log):</div><div>        last[key]
      = (off, val)        # bản sau đè bản trước</div><div>    return sorted((off,
      k, v) for k, (off, v) in last.items()</div><div>                  if v is not
      None)   # bia mộ: khoá biến mất</div><div>print(len(log), "-&gt;", compact(log))</div><div>log.append(("C",
      None))               # bia mộ cho C</div><div>print(len(log), "-&gt;", compact(log))</div></div>'
    focus:
    - '2.3'
    - '2.6'
    - '2.8'
    - '2.10'
    clear: true
    say: Bước hai, ta viết lại phép nén bằng Python. Đi qua nhật ký từ đầu, bản sau
      của một khoá đè lên bản trước, nên mỗi khoá chỉ còn bản mới nhất. Giá trị rỗng
      là bia mộ, mô hình này bỏ hẳn khoá đó, như lúc hết thời gian giữ bia mộ. Rồi
      thêm bia mộ cho C.
