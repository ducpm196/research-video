scenes:
- id: hook
  kind: hook
  title: Vì sao khởi động lại mà phải đọc hàng triệu bản ghi chỉ để biết vài số dư?
  checks:
  - len(alg.bnx_l10_log()) == 8 and len({k for k, _ in alg.bnx_l10_log()}) == 3
  steps:
  - show: '<p>Dịch vụ tra số dư nhanh khởi động lại, phải đọc lại chủ đề Kafka <code>balances</code>
      (<b>chủ đề</b>: một nhật ký có tên, nơi các bản ghi cùng loại được ghi nối vào)
      từ đầu để biết số dư mới nhất.</p>

      <p>Trong ví dụ: <b>8</b> bản ghi cho <b>3</b> tài khoản. Ngoài đời là hàng triệu
      bản ghi, mà chỉ cần <b>bản cuối</b> của mỗi tài khoản.</p>

      <div class="box key">Cùng lúc: bên nhận lên <b>lược đồ</b> mới (bản mô tả thông
      điệp có những trường nào, kiểu gì) có thêm một trường bắt buộc, đọc lại thông
      điệp cũ thiếu trường đó thì vỡ; và thông báo NAPAS (hệ thống chuyển mạch thanh
      toán liên ngân hàng) phải tới đúng hàng đợi.</div>

      '
    focus:
    - 1
    - 2
    - 3
    say: Chào bạn, dịch vụ tra số dư nhanh vừa khởi động lại, và phải đọc lại chủ
      đề số dư trong Kafka từ đầu. Ví dụ có tám bản ghi cho ba tài khoản, ngoài đời
      là hàng triệu, mà chỉ cần bản cuối của mỗi tài khoản. Cùng lúc đó, bên nhận
      lên lược đồ mới có thêm một trường bắt buộc, nên đọc lại thông điệp cũ thì vỡ.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>giữ
      nhật ký gọn mà không mất số dư mới nhất</td><td>nén nhật ký theo khoá; <b>bia
      mộ</b> (bản ghi rỗng đánh dấu khoá đã xoá) để xoá khoá</td></tr><tr><td>đổi
      lược đồ thông điệp mà không làm vỡ bên nhận</td><td>kho lược đồ kiểm tương thích
      ngược trước khi cho dùng</td></tr><tr><td>một thông điệp tới đúng các hàng đợi
      cần nó</td><td><b>sàn chủ đề</b> của RabbitMQ (nơi nhận thông điệp rồi chia
      cho các hàng đợi theo mẫu), mẫu * và #</td></tr><tr><td>luồng nào dùng Kafka,
      luồng nào dùng RabbitMQ</td><td>giữ để đọc lại hay xoá khi đã xác nhận</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    introduces:
    - bnx_bia_mo
    - bnx_san_chu_de
    clear: true
    say: Giữ nhật ký gọn thì nén theo khoá. Đổi lược đồ mà không làm vỡ bên nhận thì
      kiểm tương thích trước. Đưa thông điệp tới đúng hàng đợi thì dùng sàn chủ đề.
      Chọn Kafka hay hàng đợi có sàn thì tuỳ có cần đọc lại không.
