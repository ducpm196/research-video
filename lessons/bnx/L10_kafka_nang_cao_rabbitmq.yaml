    say: Trước hết ta cần hiểu bốn điều. Kafka là nhật ký chỉ thêm, ghi nối vào cuối,
      mỗi bản ghi có một số thứ tự không đổi. Khoá thông điệp là nhãn đi kèm, ví dụ
      số tài khoản. Khi số phân vùng không đổi, cùng khoá luôn vào cùng một phân vùng,
      tức một phần song song của chủ đề. Tương thích ngược là bên đọc dùng lược đồ
      mới vẫn đọc được dữ liệu cũ, xuôi là bên đọc cũ đọc được dữ liệu mới. Hàng đợi
      là nơi bên nhận lấy thông điệp, xử lý xong thì báo xác nhận.
