- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  checks:
  - alg.bnx_ms_to_hours(86400000) == 24
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>log
      compaction (nén nhật ký)</td><td>giữ ít nhất bản cuối của mỗi khoá; bật bằng
      <code>cleanup.policy=compact</code></td></tr><tr><td>tombstone (bia mộ)</td><td>bản
      ghi có khoá và giá trị rỗng (null): lệnh xoá khoá đó</td></tr><tr><td><code>delete.retention.ms</code></td><td>thời
      gian giữ bia mộ trước khi dọn; mặc định 86 400 000 ms = 1 ngày</td></tr><tr><td>Schema
      Registry (kho lược đồ)</td><td>nơi lưu các phiên bản lược đồ, kiểm tương thích
      trước khi nhận phiên bản mới; mức mặc định BACKWARD</td></tr><tr><td>exchange
      (sàn) loại topic</td><td>nhận thông điệp kèm khoá định tuyến, chép tới mọi hàng
      đợi có mẫu khớp</td></tr><tr><td>routing key (khoá định tuyến)</td><td>các từ
      nối bằng dấu chấm, tối đa 255 byte: <code>payment.vn.napas</code></td></tr><tr><td><code>*</code>
      và <code>#</code></td><td><code>*</code> thay đúng một từ; <code>#</code> thay
      không hoặc nhiều từ</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    say: Bảng này giải mã bảy từ. Nén nhật ký là giữ ít nhất bản cuối của mỗi khoá,
      bật bằng chính sách dọn kiểu nén. Bia mộ là bản ghi có khoá nhưng giá trị rỗng,
      nghĩa là lệnh xoá khoá đó. Thời gian giữ bia mộ mặc định là tám mươi sáu triệu
      bốn trăm nghìn mili giây, tức một ngày. Kho lược đồ lưu các phiên bản lược đồ,
      và kiểm tương thích trước khi nhận phiên bản mới. Mức mặc định là tương thích
      ngược. Sàn loại chủ đề nhận thông điệp kèm khoá định tuyến, rồi chép tới mọi
      hàng đợi có mẫu khớp. Khoá định tuyến là các từ nối bằng dấu chấm, dài tối đa
      hai trăm năm mươi lăm byte. Dấu sao thay đúng một từ, còn dấu thăng thay không
      hoặc nhiều từ.
