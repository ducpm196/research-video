  - show: '<p><b>Đường khác 1: đi ngược từ cuối nhật ký</b></p><div class="code"><div>def
      compact_back(log):</div><div>    seen, kept = set(), []</div><div>    for off
      in range(len(log) - 1, -1, -1):   # đi ngược từ cuối</div><div>        key,
      val = log[off]</div><div>        if key not in seen:</div><div>            seen.add(key)</div><div>            if
      val is not None:</div><div>                kept.append((off, key, val))</div><div>    return
      sorted(kept)</div><div>log = [("A", 100), ("B", 200), ("A", 150), ("C", 50),</div><div>       ("B",
      180), ("A", 120), ("C", 75), ("B", 260)]</div><div>print(len(compact_back(log)),
      len(compact_back(log + [("C", None)])))</div></div>'
    focus:
    - '2.3'
    - '2.12'
    clear: true
    say: Vì bản sau đè bản trước, ta đi ngược từ cuối nhật ký, gặp khoá lần đầu thì
      giữ, gặp lại thì bỏ. Dòng cuối in số bản ghi còn lại, trước và sau khi thêm
