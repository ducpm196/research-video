- id: formula
  kind: formula
  title: 'Suy ra từng bước: nén, bia mộ, kiểm lược đồ, định tuyến'
  checks:
  - len(alg.bnx_compact(alg.bnx_l10_log())) == len({k for k, _ in alg.bnx_l10_log()})
    == 3
  - len(alg.bnx_compact((alg.bnx_l10_log() + [('C', None)]))) == 2
  - alg.bnx_ms_to_hours(86400000) == 86400000 / 3600000 == 24
  - 'alg.bnx_backward_ok({''account'': False, ''amount'': False, ''channel'': True},
    {''account'': False, ''amount'': False}) == (True, [])'
  - 'alg.bnx_backward_ok({''account'': False, ''amount'': False, ''fee'': False},
    {''account'': False, ''amount'': False}) == (False, [''fee''])'
  - '[alg.bnx_topic_match(p, ''payment.vn.napas'') for p in (''payment.*.napas'',
    ''payment.#'', ''payment.*'')] == [True, True, False]'
  steps:
  - show: '<p><b>Bước 1.</b> Bên đọc chủ đề số dư chỉ cần <b>trạng thái cuối</b> của
      mỗi khoá, nên nén nhật ký giữ bản cuối mỗi khoá và giữ nguyên offset:</p>

      $$\text{số bản ghi sau nén} = \text{số khoá khác nhau}$$

      <span class=''note''>Làm thử: 8 bản ghi, khoá A, B, C, đều đã nằm trong đoạn
      đã đóng và bộ dọn đã chạy → còn 3.</span>

      '
    focus:
    - 1
    - 2
    - 3
    say: Bước một, vì bên đọc chủ đề số dư chỉ cần trạng thái cuối của mỗi khoá, nên
      nén nhật ký giữ bản cuối mỗi khoá và giữ nguyên vị trí. Suy ra số bản ghi sau
      nén bằng số khoá khác nhau. Làm thử, tám bản ghi của ba khoá A, B, C, khi cả
      tám đã nằm trong đoạn đã đóng và bộ dọn đã chạy, thì còn ba.
  - show: '<p><b>Bước 2. Nén nhật ký bằng Python</b></p><div class="code"><div>log
      = [("A", 100), ("B", 200), ("A", 150), ("C", 50),</div><div>       ("B", 180),
      ("A", 120), ("C", 75), ("B", 260)]</div><div>def compact(log):</div><div>    last
      = {}</div><div>    for off, (key, val) in enumerate(log):</div><div>        last[key]
      = (off, val)        # bản sau đè bản trước</div><div>    return sorted((off,
      k, v) for k, (off, v) in last.items()</div><div>                  if v is not
      None)   # bia mộ: khoá biến mất</div><div>print(len(log), "-&gt;", compact(log))</div><div>log.append(("C",
      None))               # bia mộ cho C</div><div>print(len(log), "-&gt;", compact(log))</div></div>'
    focus:
    - '2.3'
    - '2.6'
    - '2.8'
    - '2.10'
    clear: true
    say: Bước hai, ta viết lại phép nén bằng Python. Đi qua nhật ký từ đầu, bản sau
      của một khoá đè lên bản trước, nên cuối cùng mỗi khoá chỉ còn bản mới nhất.
      Bản ghi có giá trị rỗng là bia mộ, nên khoá đó bị bỏ hẳn. Dòng gần cuối thêm
      một bia mộ cho tài khoản C rồi nén lại.
  - show: <p><b>Bước 2. Kết quả chạy thật</b></p><div class="code"><div>8 -&gt; [(5,
      'A', 120), (6, 'C', 75), (7, 'B', 260)]</div><div>9 -&gt; [(5, 'A', 120), (7,
      'B', 260)]</div></div>
    focus:
    - '2.1'
    - '2.2'
    clear: true
    say: Chạy thật, tám bản ghi còn ba, là A ở vị trí năm, C ở vị trí sáu, B ở vị
      trí bảy. Thêm bia mộ thì chín bản ghi còn hai, vì khoá C biến mất.
  - show: '<p><b>Bước 3.</b> Bia mộ không biến mất ngay: nó được giữ thêm <code>delete.retention.ms</code>
      (mặc định 1 ngày), vì bên đọc đang chậm phải kịp thấy lệnh xoá.</p>

      $$86\,400\,000 \text{ ms} = \frac{86\,400\,000}{3\,600\,000} \text{ giờ} = 24
      \text{ giờ}$$

      <span class=''note''>Và đoạn nhật ký đang ghi không bao giờ được nén; nén chạy
      nền theo từng đoạn, nên lúc nào xong không đoán trước.</span>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    clear: true
    say: Bước ba, bia mộ không biến mất ngay, mà được giữ thêm một thời gian, vì bên
      đọc đang chậm phải kịp thấy lệnh xoá. Mặc định là tám mươi sáu triệu bốn trăm
      nghìn mili giây, chia ba triệu sáu trăm nghìn mili giây mỗi giờ, được hai mươi
      bốn giờ. Ngoài ra, đoạn nhật ký đang ghi không bao giờ được nén. Nén chạy nền
      theo từng đoạn, nên không đoán trước lúc nào xong.
  - show: '<p><b>Bước 4.</b> Mức BACKWARD: bên đọc dùng lược đồ <b>mới</b> phải đọc
      được dữ liệu ghi bằng lược đồ <b>cũ</b>, nên trường mới phải có giá trị mặc
      định. Lược đồ Avro (định dạng ghi thông điệp theo lược đồ viết bằng JSON), phiên
      bản 2:</p><div class="code"><div>{"type": "record", "name": "Transfer", "fields":
      [</div><div>  {"name": "account", "type": "string"},</div><div>  {"name": "amount",
      "type": "long"},</div><div>  {"name": "channel", "type": "string", "default":
      "APP"}</div><div>]}</div></div>'
    focus:
    - 1
