      mặc định</div><div>def backward_ok(new, old):</div><div>    # bên đọc dùng lược
      đồ mới có đọc được dữ liệu cũ không?</div><div>    bad = [f for f, has_default
      in new.items()</div><div>           if f not in old and not has_default]</div><div>    return
      len(bad) == 0, bad</div><div>print("v2:", backward_ok(v2, v1))</div><div>print("v3:",
