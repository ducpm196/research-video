- id: quymo
  kind: example
  title: 'Khi nhật ký lớn dần: khởi động lại phải đọc bao nhiêu bản ghi'
  checks:
  - '[alg.bnx_l10_compacted(n, 100) for n in (1000, 100000, 1000000)] == [100, 100,
    100]'
  - '[alg.bnx_l10_read_ms(n, 0.001) for n in (1000, 100000, 1000000)] == [1.0, 100.0,
    1000.0]'
  - 100000 // 1000 == 100 and 1000000 // 1000 == 1000
  - alg.bnx_l10_read_ms(100, 0.001) == 0.1
  steps:
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>f"TK{i
      % 100}"</code></td><td>chuỗi có <code>f</code> đứng đầu: <code>{…}</code> được
      thay bằng giá trị; <code>i % 100</code> là số dư khi chia <code>i</code> cho
      100, nên chỉ có 100 tên TK0 … TK99</td></tr><tr><td><code>[(…) for i in range(n)]</code></td><td>viết
      gọn: tạo danh sách <code>n</code> cặp, <code>i</code> chạy từ 0 tới n − 1</td></tr></table>'
    clear: true
    say: Khối đo dùng thêm hai cách viết, nên ta giải nghĩa trước. Chuỗi có chữ f
      đứng đầu thay phần trong ngoặc nhọn bằng giá trị, và phép lấy dư làm tên tài
      khoản quay vòng trong một trăm tên.
  - show: '<p><b>Mô phỏng cùng quy tắc nén (không phải Kafka thật): gõ nối tiếp sau
      hàm compact của bước 2</b></p><div class="code"><div>for n in (1000, 100000,
      1000000):</div><div>    log = [(f"TK{i % 100}", i) for i in range(n)]</div><div>    con
      = compact(log)</div><div>    print(n, "ban ghi, 100 tai khoan: doc lai", n,</div><div>          "|
      sau nen", len(con))</div></div>'
    focus:
    - 2
    - '2.3'
    clear: true
    say: Ta đo bằng chính hàm nén của bước hai, nên đây là mô phỏng chứ không phải
      Kafka thật, ở ba cỡ nhật ký. Mỗi cỡ có một trăm tài khoản, ta nén rồi đếm bản
      ghi còn lại.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1000 ban ghi, 100
      tai khoan: doc lai 1000 | sau nen 100</div><div>100000 ban ghi, 100 tai khoan:
      doc lai 100000 | sau nen 100</div><div>1000000 ban ghi, 100 tai khoan: doc lai
      1000000 | sau nen 100</div></div><p class="note">Không nén: khởi động lại phải
      đọc mọi bản ghi. Có nén: chỉ còn bản cuối của mỗi tài khoản. Con số 100 là cận
      dưới của mô phỏng nén hoàn toàn: Kafka thật nén theo ngưỡng (<code>min.cleanable.dirty.ratio</code>)
      và đoạn đang ghi chưa nén, nên số còn lại thật có thể lớn hơn.</p>'
    focus:
    - '2.1'
    - '2.2'
    - '2.3'
    - 3
    clear: true
    say: Nhật ký một nghìn bản ghi còn một trăm sau nén. Một trăm nghìn bản ghi, gấp
      một trăm lần, cũng chỉ còn một trăm. Một triệu bản ghi vẫn còn đúng một trăm,
      vì chỉ có một trăm tài khoản. Một trăm là cận dưới, vì Kafka thật nén theo ngưỡng
      và đoạn đang ghi chưa nén.
  - show: '<table class=''t''><tr><th>số bản ghi trong nhật ký</th><th>không nén:
      số bản ghi phải đọc lại</th><th>có nén (100 tài khoản, cận dưới)</th><th>đọc
      lại mất nếu 1 micro giây mỗi bản ghi (số minh hoạ)</th></tr><tr><td>1 000</td><td>1
      000</td><td>100</td><td>1 ms so với 0,1 ms</td></tr><tr><td>100 000 (gấp 100
      lần)</td><td>100 000</td><td>100</td><td>100 ms so với 0,1 ms</td></tr><tr><td>1
      000 000 (gấp 1 000 lần)</td><td>1 000 000</td><td>100</td><td>1 giây so với
      0,1 ms</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    clear: true
    say: Không nén thì thời gian khởi động tăng thẳng theo độ dài nhật ký, từ một
      mili giây lên một giây, với số minh hoạ một phần triệu giây mỗi bản ghi. Có
      nén thì khối lượng đọc chỉ phụ thuộc số tài khoản, nên gần như không đổi.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>không
      nén, giữ theo thời hạn</td><td>đủ lịch sử trong thời hạn; đọc lại sự kiện cũ
      được</td><td>khởi động lại phải đọc cả nhật ký; dung lượng tăng theo thời gian</td><td>luồng
      cần lịch sử, như đối soát cuối ngày</td></tr><tr><td>nén theo khoá</td><td>chỉ
      cần bản cuối mỗi khoá; khởi động nhanh, dung lượng theo số khoá</td><td>mất
      các bản cũ của khoá; nén chạy nền nên không đoán được lúc nào xong; đoạn đang
      ghi chưa nén</td><td>chủ đề trạng thái như số dư, hồ sơ</td></tr><tr><td>nén
      và dựng bộ nhớ đệm ở bên đọc</td><td>bên đọc dựng lại trạng thái nhanh rồi phục
      vụ tra cứu</td><td>bên đọc phải xử lý bia mộ và các bản trùng</td><td>dịch vụ
      tra số dư cần khởi động lại nhanh</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    clear: true
    say: Không nén thì giữ đủ lịch sử, đổi lại khởi động lại phải đọc cả nhật ký.
      Nén theo khoá thì khởi động nhanh, đổi lại mất các bản cũ.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_ms_to_hours(604800000) == 7 * 24
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Tưởng nén nhật ký là <b
      class="red">xoá theo thời gian</b>. Sai: nén giữ bản cuối của mỗi khoá dù cũ
      bao lâu; xoá theo thời gian là chính sách <code>delete</code> (mặc định, <code>retention.ms</code>
      = 7 ngày).

      <br><span class="note">Kèm theo: đọc ngay sau khi ghi vẫn thấy đủ bản cũ, vì
      đoạn đang ghi chưa nén; đừng viết bên đọc giả định mỗi khoá chỉ có một bản.</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là tưởng nén nhật ký là xoá theo thời gian.
      Sai, nén giữ bản cuối của mỗi khoá dù cũ bao lâu.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Coi RabbitMQ như
      Kafka: định “đọc lại hôm qua” từ hàng đợi. Hàng đợi thường (không phải loại
      stream) xoá thông điệp <b class="red">khi đã xác nhận</b>; Kafka giữ theo thời
      hạn hoặc theo khoá, đọc lại được bằng offset.

      <br><span class="note">Ngược lại, dùng Kafka cho việc cần định tuyến linh hoạt
      theo mẫu là tự viết lại thứ sàn đã có.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là coi hàng đợi có sàn như Kafka, định
      đọc lại thông điệp hôm qua. Hàng đợi thường xoá thông điệp khi đã xác nhận,
      còn Kafka giữ lại.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Đổi lược đồ <b class="red">trước</b>,
      kiểm sau: bên nhận lên lược đồ có trường <code>fee</code> không mặc định, đọc
      lại bản ghi cũ (ví dụ chủ đề nén đọc từ đầu) thiếu <code>fee</code> → vỡ lúc
      nửa đêm.

      <br><span class="note">Cách chữa: đưa phép kiểm tương thích vào quy trình dựng,
      chạy trước khi phát hành; với BACKWARD, trường mới phải có mặc định, nâng cấp
      bên đọc trước rồi mới cho bên gửi ghi dữ liệu mới.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là đổi lược đồ trước rồi mới kiểm. Bên nhận
      lên lược đồ có trường phí không mặc định thì đọc bản ghi cũ bị vỡ lúc nửa đêm.
      Cách chữa là đưa phép kiểm tương thích vào quy trình dựng, và nâng cấp bên đọc
      trước rồi mới cho bên gửi ghi dữ liệu mới.
