      nên giữ thứ tự</td><td>khoá A, B, C</td></tr><tr><td>③ Tương thích ngược / xuôi</td><td>ngược:
      bên đọc dùng lược đồ mới đọc được dữ liệu cũ; xuôi: bên đọc cũ đọc được dữ liệu
      mới</td><td>thêm trường có mặc định</td></tr><tr><td>④ Hàng đợi và xác nhận</td><td>bên
      nhận lấy thông điệp, xử lý xong thì báo đã xong (ack)</td><td>xác nhận rồi mới
