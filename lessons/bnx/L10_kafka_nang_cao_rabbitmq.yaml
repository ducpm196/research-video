    clear: true
    say: Đây là hàm đồ chơi. Xoá trường thì ở mức ngược không bị chặn vì bên đọc mới
      bỏ qua trường thừa, còn ở mức xuôi chỉ bị chặn nếu trường bị xoá không có giá
