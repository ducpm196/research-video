      bao lâu; xoá theo thời gian là chính sách <code>delete</code> (mặc định, <code>retention.ms</code>
      = 7 ngày).

      <br><span class="note">Kèm theo: đọc ngay sau khi ghi vẫn thấy đủ bản cũ, vì
      đoạn đang ghi chưa nén; đừng viết bên đọc giả định mỗi khoá chỉ có một bản.</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là tưởng nén nhật ký là xoá theo thời gian.
      Sai, nén giữ bản cuối của mỗi khoá dù cũ bao lâu. Xoá theo thời gian là chính
      sách xoá mặc định, giữ bảy ngày. Kèm theo đó, đọc ngay sau khi ghi vẫn thấy
      đủ các bản cũ, vì đoạn đang ghi chưa nén. Đừng viết bên đọc giả định mỗi khoá
      chỉ có một bản.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Coi RabbitMQ như
      Kafka: định “đọc lại hôm qua” từ hàng đợi. Hàng đợi thường (không phải loại
      stream) xoá thông điệp <b class="red">khi đã xác nhận</b>; Kafka giữ theo thời
      hạn hoặc theo khoá, đọc lại được bằng offset.

      <br><span class="note">Ngược lại, dùng Kafka cho việc cần định tuyến linh hoạt
      theo mẫu là tự viết lại thứ sàn đã có.</span></div>

      '
    clear: true
