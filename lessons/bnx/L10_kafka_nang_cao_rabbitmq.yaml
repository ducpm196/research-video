  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>range(len(log)
      - 1, -1, -1)</code></td><td>dãy số đi ngược: bắt đầu ở vị trí cuối <code>len(log)
      - 1</code>, dừng trước <code>-1</code>, mỗi lần giảm 1</td></tr><tr><td><code>seen
      = set()</code>, <code>seen.add(key)</code>, <code>key not in seen</code></td><td><code>seen</code>
      là tập các khoá đã gặp; thêm khoá vào tập; kiểm khoá chưa gặp</td></tr></table>'
    clear: true
    say: Hàm đi ngược dùng thêm hai cách viết, nên ta giải nghĩa trước. Dãy số đi
