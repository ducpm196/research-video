  - show: <table class='t'><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>pattern.split(&quot;.&quot;)</code></td><td>cắt
      chuỗi ở mỗi dấu chấm thành danh sách các từ</td></tr><tr><td><code>def m(i,
      j):</code> … <code>m(i + 1, j + 1)</code></td><td>hàm nằm trong hàm, và tự gọi
      lại chính nó với vị trí kế tiếp (đệ quy)</td></tr><tr><td><code>any(m(i + 1,
      t) for t in range(j, len(k) + 1))</code></td><td>thử từng <code>t</code>; đúng
      nếu có ít nhất một <code>t</code> cho kết quả đúng</td></tr><tr><td><code>p[i]
      in (&quot;*&quot;, k[j])</code></td><td>từ mẫu là <code>*</code> hoặc đúng bằng
      từ của khoá</td></tr></table>
    clear: true
    say: Hàm khớp mẫu cắt chuỗi ở dấu chấm, có một hàm con tự gọi lại chính nó, nên
      ta giải nghĩa trước.
  - show: '<p><b>Bước 5. Sàn chủ đề: khớp mẫu * và #</b></p><div class="code"><div>def
      match(pattern, key):</div><div>    p, k = pattern.split("."), key.split(".")</div><div>    def
      m(i, j):</div><div>        if i == len(p):</div><div>            return j ==
      len(k)</div><div>        if p[i] == "#":                       # không hoặc
      nhiều từ</div><div>            return any(m(i + 1, t) for t in range(j, len(k)
      + 1))</div><div>        ok = j &lt; len(k) and p[i] in ("*", k[j])   # * đúng
      một từ</div><div>        return ok and m(i + 1, j + 1)</div><div>    return
      m(0, 0)</div><div>for pat in ["payment.*.napas", "payment.#", "payment.*"]:</div><div>    print(pat,
      match(pat, "payment.vn.napas"))</div></div>'
    focus:
    - '2.6'
    - '2.7'
    - '2.8'
    - '2.12'
    clear: true
    say: Bước năm, vì sàn phải biết hàng đợi nào cần thông điệp, nên nó so khoá định
      tuyến với từng mẫu, từng từ một. Gặp dấu thăng thì thử cho nó nuốt không, một,
      hay nhiều từ. Gặp dấu sao thì thay đúng một từ. Dòng cuối thử ba mẫu.
  - show: <p><b>Bước 5. Kết quả chạy thật</b></p><div class="code"><div>payment.*.napas
      True</div><div>payment.# True</div><div>payment.* False</div></div>
    focus:
    - '2.1'
    - '2.2'
    - '2.3'
    clear: true
    say: Chạy thật, mẫu có dấu sao ở giữa khớp. Mẫu có dấu thăng cũng khớp. Còn mẫu
      chỉ có hai từ thì không khớp, vì khoá có ba từ.
