- id: pitfalls
  kind: pitfall
  title: 'Lỗi hay gặp theo thời gian: lúc mới dựng, lúc tải tăng, lúc vận hành lâu'
  checks:
  - alg.bnx_l19_lock_story(300, 320, owner_check=False) == (2, 1)
  - alg.bnx_l19_lock_story(300, 320) == (2, 0)
  - alg.bnx_l19_overrun(300, 320) == 20
  - alg.bnx_l19_slot('loan:disb:{A1001}') == 1830 and alg.bnx_l19_slot('loan:disb:A1001')
    == 5075
  - alg.bnx_l19_hashed_part('loan:disb:{A1001}') == 'A1001'
  - alg.bnx_l19_processed([0, 90], 60) == 2
  - alg.bnx_l19_processed([0, 90], 120) == 1
  - alg.bnx_l19_set_nx_ex([0, 30], 60)[1] is None and alg.bnx_l19_set_nx_ex([0, 30],
    120)[1] is None
  - not alg.bnx_l19_same_slot('acc:1', 'acc:2')
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (lúc mới dựng).</b> Nhả khoá bằng <code>DEL</code>
      thẳng, hoặc đặt giá trị khoá là số <code>1</code> cho mọi máy.

      Máy A quá hạn, máy B đã lấy khoá, rồi A chạy tới dòng nhả và <b class="red">xoá
      mất khoá của B</b>.

      <br><span class="note">Cách chữa: giá trị là mã chủ khoá ngẫu nhiên; nhả bằng
      lệnh “chỉ xoá nếu giá trị còn là của tôi” (<code>DELEX … IFEQ</code>; bản Redis
      cũ hơn 8.4 dùng một đoạn kịch bản nhỏ so rồi xoá).</span></div>

      '
    clear: true
    say: Lỗi thứ nhất gặp ngay lúc mới dựng, là nhả khoá bằng lệnh xoá thẳng, hoặc
      đặt giá trị khoá giống nhau cho mọi máy. Khi đó máy A quá hạn, máy B đã lấy
      khoá, rồi A chạy tới dòng nhả và xoá mất khoá của B. Cách chữa là dùng mã chủ
      khoá ngẫu nhiên, và nhả bằng lệnh chỉ xoá khi giá trị còn là của mình.
  - show: '<div class="box warn"><b>Lỗi 2 (lúc tải tăng, chuyển từ một nút sang cụm).</b>
      Mã đang chạy tốt trên một nút bỗng báo

      <code class="red">CROSSSLOT</code>, vì lệnh nhiều khoá chỉ chạy trong cụm khi
      các khoá <b>cùng một khe băm</b>.

      Chữa vội bằng cách gắn <b>cùng một thẻ băm cho mọi khoá</b> thì mọi khoá dồn
      về một nút, cụm mất tác dụng.

      <br><span class="note">Cách chữa: thẻ băm theo từng đối tượng, ví dụ theo mã
      hồ sơ. Chú ý: viết nguyên <code>loan:disb:{A1001}</code> thì Redis chỉ băm chữ
      <code>A1001</code> (khe 1830, khác khe 5075 của <code>loan:disb:A1001</code>).</span></div>

      '
    clear: true
    say: Lỗi thứ hai xuất hiện lúc tải tăng, khi chuyển từ một nút sang cụm. Mã đang
      chạy tốt bỗng báo lỗi các khoá không cùng khe, vì lệnh nhiều khoá chỉ chạy trong
      cụm khi các khoá cùng một khe băm. Nếu chữa vội bằng cách gắn cùng một thẻ băm
      cho mọi khoá, thì mọi khoá dồn về một nút, và cụm mất tác dụng. Cách chữa là
      đặt thẻ băm theo từng đối tượng, ví dụ theo mã hồ sơ. Cũng cần nhớ rằng cặp
      ngoặc nhọn viết trong tên khoá sẽ được hiểu là thẻ băm, nên khe của khoá đổi
      theo.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc vận hành lâu dài).</b>
      Tin rằng khoá Redis có hạn là <b>loại trừ tuyệt đối</b>.

      Khoá hạn 300 giây, tiến trình A bị dừng tới giây 320 (thu gom rác, máy ảo bị
      treo, gọi lõi ngân hàng chậm): quá hạn 320 − 300 = <b class="red">20 giây</b>,

      B đã lấy khoá, và <b>cả hai cùng giải ngân</b>.

      <br><span class="note">Cách chữa: khoá chỉ để giảm tranh chấp; lớp chặn cuối
      nằm ở cơ sở dữ liệu (ràng buộc duy nhất theo mã hồ sơ, hoặc đổi trạng thái có
      điều kiện).</span></div>

      '
    clear: true
    say: 'Lỗi thứ ba là của người đã đi làm, lộ ra khi vận hành lâu dài: tin rằng
      khoá Redis có hạn là loại trừ tuyệt đối. Khoá có hạn ba trăm giây, nhưng tiến
      trình A bị dừng tới giây ba trăm hai mươi, do thu gom rác, máy ảo bị treo, hay
      lõi ngân hàng trả lời chậm. Vì đã quá hạn hai mươi giây, máy B lấy được khoá,
      và cả hai cùng giải ngân. Cách chữa là coi khoá chỉ để giảm tranh chấp, còn
      lớp chặn cuối nằm ở cơ sở dữ liệu, bằng ràng buộc duy nhất theo mã hồ sơ.'
  - show: '<p><b>Lỗi 3 (phần tiếp, lúc vận hành lâu dài).</b> Hai nguy cơ nữa của
      khoá Redis có hạn:</p><table class=''t''><tr><th>nguy cơ</th><th>điều xảy ra</th><th>cách
      chữa</th></tr><tr><td>nút chính hỏng</td><td>mỗi nút chính thường có <b>nút
      bản sao</b>, chép dữ liệu theo kiểu không chờ bản sao xác nhận; nút chính hỏng
      trước khi bản sao nhận khoá, bản sao lên thay: B lấy được khoá khi A vẫn tin
      mình giữ</td><td>khoá chỉ để giảm tranh chấp; lớp chặn cuối ở cơ sở dữ liệu</td></tr><tr><td>bộ
      nhớ đầy</td><td>đã đặt giới hạn bộ nhớ thì chính sách đẩy khoá có thể xoá khoá
      giữ quyền và mục danh sách đen còn hạn; nhóm chỉ đẩy khoá có hạn (volatile)
      vẫn đẩy được vì khoá của bài đều có hạn; chính sách không đẩy thì lệnh ghi mới
      báo lỗi</td><td>chừa chỗ, theo dõi số khoá bị đẩy; quyết định trước khi Redis
      lỗi hay đầy thì từ chối hay cho qua</td></tr><tr><td>khoá chưa đủ an toàn</td><td>bài
      hướng dẫn khoá phân tán của nhóm làm Redis nêu <b>mã hàng rào</b> (fencing token)
      tăng dần, kiểm ở nơi ghi</td><td>bài chọn ràng buộc duy nhất ở cơ sở dữ liệu
      làm lớp cuối</td></tr></table>'
    focus:
    - 1
    - '2.2'
    - '2.2'
    - '2.3'
    - '2.3'
    - '2.3'
    - '2.3'
    - '2.4'
    clear: true
    say: 'Lỗi thứ ba còn hai nguy cơ nữa. Thứ nhất là nút chính hỏng: mỗi nút chính
      thường có nút bản sao, chép dữ liệu theo kiểu không chờ bản sao xác nhận. Nếu
      nút chính hỏng trước khi bản sao nhận khoá, rồi bản sao lên thay, thì máy B
      lấy được khoá trong lúc máy A vẫn tin mình giữ. Thứ hai là bộ nhớ đầy: khi đã
      đặt giới hạn, chính sách đẩy khoá có thể xoá cả khoá giữ quyền lẫn mục danh
      sách đen còn hạn. Nhóm chính sách chỉ đẩy khoá có hạn cũng không cứu được, vì
      khoá của bài đều có hạn. Chính sách không đẩy khoá thì lệnh ghi mới báo lỗi.
      Cách chữa là chừa chỗ, theo dõi số khoá bị đẩy, và quyết định trước khi Redis
      lỗi hay đầy thì từ chối hay cho qua. Bài hướng dẫn khoá phân tán của nhóm làm
      Redis còn nêu mã hàng rào tăng dần, kiểm ở nơi ghi, còn bài chọn ràng buộc ở
      cơ sở dữ liệu.'
  - show: '<p><b>Lỗi 4 (người đã đi làm, lúc đối tác đổi cách thử lại).</b> Hạn khử
      trùng ngắn hơn thời gian thử lại của bên gửi <i>(số minh hoạ)</i>.</p><table
      class=''t''><tr><th>bên gửi thử lại ở giây</th><th>hạn khử trùng 60 giây</th><th>hạn
