scenes:
- id: hook
  kind: hook
  title: 'Bấm “Giải ngân” hai lần: tiền có ra hai lần không?'
  checks:
  - alg.bnx_l19_slot('foo') == 12182
  - alg.bnx_l19_set_nx_ex([0, 30], 300) == ['OK', None]
  - alg.bnx_l19_set_nx_ex([0, 30], 60)[1] is None
  steps:
  - show: '<p>Hồ sơ vay <b>A1001</b>, khoản vay 50 triệu đồng <i>(số minh hoạ)</i>.
      Mạng chậm, khách bấm nút “Giải ngân” <b>hai lần</b>,

      và hai máy chủ ứng dụng cùng nhận yêu cầu.</p>

      <div class="box key">Trên CV có bốn dòng về Redis: <b>Redis Cluster</b> lo mở
      rộng bộ nhớ và tải; ba dòng còn lại chặn trùng hoặc thu hồi: khoá <code>SET
      … NX EX 300</code>,

      khử trùng theo mã giao dịch <b>hạn 60 giây</b>, và <b>danh sách đen</b> mã truy
      cập. Mỗi dòng làm việc gì, và hở ở đâu?</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: 'Chào bạn, hồ sơ vay A một không không một có khoản vay năm mươi triệu đồng,
      số minh hoạ. Mạng chậm nên khách bấm giải ngân hai lần, và hai máy chủ cùng
      nhận yêu cầu. Hồ sơ xin việc có bốn dòng về Redis: cụm nhiều nút lo mở rộng,
      còn khoá có hạn lo chặn trùng hoặc thu hồi.'
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l19_crc16('foo') == 44950
  - 44950 == 2 * 16384 + 12182
  - alg.bnx_l19_crc16('foo') % 16384 == 12182
  - 2 * 16384 == 32768 and alg.bnx_l19_crc16('foo') - 32768 == 12182
  - alg.bnx_l19_crc16(bytes([255]) * 4) <= 65535
  - alg.bnx_l19_set_nx_ex([0, 59, 60], 60) == ['OK', None, 'OK']
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Redis</td><td>kho “khoá → giá trị” chạy trong bộ nhớ; mỗi lệnh chạy trọn vẹn,
      không lệnh nào chen vào giữa</td><td><code>SET foo bar</code> rồi <code>GET
      foo</code> trả <code>bar</code></td></tr><tr><td>② hạn sống</td><td>mỗi mục
      có thể kèm số giây; hết số giây đó Redis tự xoá mục</td><td>đặt hạn 60: tới
      giây 60 mục biến mất</td></tr><tr><td>③ chia lấy dư (mod)</td><td>phần còn lại
      sau khi chia hết số lần nguyên</td><td>$44950 = 2 \cdot 16384 + 12182$, nên
      44950 mod 16384 = 12182</td></tr><tr><td>④ băm kiểm lỗi CRC16</td><td>hàm đổi
      một chuỗi byte (byte: khúc dữ liệu gồm 8 bit; bit là chữ số 0 hoặc 1) thành
      một số 16 bit, từ 0 tới 65535; cùng chuỗi luôn ra cùng số</td><td>CRC16 của
      <code>foo</code> = 44950</td></tr><tr><td>⑤ mã truy cập và mã giao dịch</td><td>mã
      truy cập ghi sẵn hạn dùng <code>exp</code> và số riêng <code>jti</code>; mã
      giao dịch là số riêng của một yêu cầu chuyển tiền</td><td><code>jti-7f3a</code>;
      <code>TX1001</code></td></tr></table>'
    say: Trước hết ta cần hiểu năm điều, Redis là kho khoá và giá trị trong bộ nhớ,
      mỗi lệnh chạy trọn vẹn. Mỗi mục có thể kèm hạn sống, hết hạn thì Redis tự xoá.
      Chia lấy dư là phần còn lại sau khi chia hết. Phép băm kiểm lỗi mười sáu bit
      đổi chuỗi byte, mỗi byte là tám chữ số nhị phân, thành một số mười sáu bit.
      Mã truy cập ghi sẵn hạn dùng, còn mã giao dịch là số riêng của một yêu cầu.
    introduces:
    - cdot
  - show: '<p>Làm thử phép chia lấy dư:</p>

      $$2 \cdot 16384 = 32768, \qquad 44950 - 32768 = \hl{12182}$$

      '
    clear: true
    say: 'Làm thử phép chia lấy dư: bốn mươi tư nghìn chín trăm năm mươi trừ hai lần
      mười sáu nghìn ba trăm tám mươi tư còn mười hai nghìn một trăm tám mươi hai.'
- id: sym
  kind: symbol
  title: Giải mã các từ trên màn hình
  checks:
  - alg.bnx_l19_slot('foo') == 12182 and alg.bnx_l19_node(12182) == 3
  - alg.bnx_l19_hashed_part('{abc}:1') == 'abc'
  - alg.bnx_l19_ranges()[-1][1] == 16383 and alg.bnx_l19_ranges()[0][0] == 0
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>Redis
      Cluster, hash slot</td><td>cụm nhiều nút Redis; không gian khoá chia thành <b>16384
      khe băm</b>, đánh số 0 tới 16383</td></tr><tr><td><code>CLUSTER KEYSLOT k</code></td><td>hỏi
      Redis: khoá <code>k</code> thuộc khe số mấy</td></tr><tr><td><code>MOVED 12182
      127.0.0.1:7002</code></td><td>lỗi chuyển hướng: “khe 12182 do nút ở cổng 7002
      giữ, hãy gửi lại sang đó”</td></tr><tr><td>hash tag <code>{…}</code></td><td>thẻ
      băm: khoá có <code>{abc}</code> thì chỉ phần <code>abc</code> được đem băm;
      ngoặc rỗng <code>{}</code> thì băm cả khoá</td></tr></table>'
    introduces:
    - bnx_khe_bam
    - bnx_the_bam
    clear: true
    say: Bảng này giải mã các từ trên màn hình. Cụm Redis chia khoá thành mười sáu
      nghìn ba trăm tám mươi tư khe băm. Lỗi chuyển hướng là câu trả lời của nút không
      giữ khe, kèm địa chỉ nút giữ. Thẻ băm là phần trong ngoặc nhọn, chỉ phần đó
      được băm.
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td><code>SET
      k v NX EX 300</code></td><td><b>NX</b>: chỉ đặt khi khoá chưa có; <b>EX 300</b>:
      hạn sống 300 giây; đặt được trả <code>OK</code>, không đặt được trả <code>(nil)</code></td></tr><tr><td><code>TTL
      k</code></td><td>số giây còn lại của khoá; −2 nếu khoá không tồn tại, −1 nếu
      khoá không có hạn</td></tr><tr><td><code>DELEX k IFEQ v</code></td><td>xoá khoá
      <b>chỉ khi</b> giá trị đang lưu đúng bằng <code>v</code> (có từ Redis 8.4)</td></tr></table>'
    clear: true
    say: 'Lệnh đặt có hai tuỳ chọn: chỉ đặt khi khoá chưa có, và kèm hạn sống, đặt
      được thì trả chữ ô kê, không thì trả rỗng. Lệnh kế cho biết số giây còn lại,
      lệnh cuối chỉ xoá khi giá trị đúng bằng giá trị ta đưa vào.'
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>nút
      chính, nút bản sao</td><td>nút chính nhận lệnh ghi; nút bản sao chép lại dữ
      liệu của nút chính để thay thế khi nút chính hỏng; việc chép có độ trễ</td></tr><tr><td>ràng
      buộc duy nhất</td><td>luật của cơ sở dữ liệu: hai bản ghi cùng mã thì bản ghi
      thứ hai bị từ chối</td></tr><tr><td>thu gom rác</td><td>lúc máy ảo Java dọn
      bộ nhớ và tạm dừng cả chương trình trong chốc lát</td></tr><tr><td><code>docker
      run</code>, <code>docker exec</code>, <code>&lt;&lt;''EOF''</code>, <code>r()
      { … }</code>, <code>0x31c3</code></td><td>chạy một chương trình đóng gói sẵn
      / chạy lệnh bên trong nó / đưa nhiều dòng lệnh vào một lệnh / đặt tên ngắn <code>r</code>
      cho một lệnh dài / số viết hệ 16 (16 chữ số: 0–9, a–f)</td></tr></table>'
    introduces:
    - bnx_thu_gom_rac
    clear: true
    say: Nút chính nhận lệnh ghi, nút bản sao chép lại. Ràng buộc duy nhất từ chối
      bản ghi trùng mã. Thu gom rác là lúc máy ảo dọn bộ nhớ.
  - show: <table class='t'><tr><th>từ</th><th>nghĩa</th></tr><tr><td>máy khách</td><td>chương
      trình gửi lệnh tới Redis, ở đây là ứng dụng của ngân hàng</td></tr><tr><td>tiến
      trình</td><td>một chương trình đang chạy trên máy; mỗi nút Redis là một tiến
      trình</td></tr><tr><td>lõi ngân hàng</td><td>hệ thống sổ cái chính của ngân
      hàng, nơi tiền thật được ghi</td></tr></table>
    clear: true
    say: 'Ba từ nữa: máy khách gửi lệnh tới Redis, tiến trình là chương trình đang
      chạy, lõi ngân hàng là sổ cái chính ghi tiền thật.'
