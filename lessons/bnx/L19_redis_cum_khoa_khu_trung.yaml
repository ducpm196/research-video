scenes:
- id: hook
  kind: hook
  title: 'Bấm “Giải ngân” hai lần: tiền có ra hai lần không?'
  checks:
  - alg.bnx_l19_slot('foo') == 12182
  - alg.bnx_l19_set_nx_ex([0, 30], 300) == ['OK', None]
  - alg.bnx_l19_set_nx_ex([0, 30], 60)[1] is None
  steps:
  - show: '<p>Hồ sơ vay <b>A1001</b>, khoản vay 50 triệu đồng <i>(số minh hoạ)</i>.
      Mạng chậm, khách bấm nút “Giải ngân” <b>hai lần</b>,

      và hai máy chủ ứng dụng cùng nhận yêu cầu.</p>

      <div class="box key">Trên CV có bốn dòng về Redis để chặn chuyện này: <b>Redis
      Cluster</b>, khoá <code>SET … NX EX 300</code>,

      khử trùng theo mã giao dịch <b>hạn 60 giây</b>, và <b>danh sách đen</b> mã truy
      cập. Mỗi dòng làm việc gì, và hở ở đâu?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: 'Chào bạn, hồ sơ vay A một không không một có khoản vay năm mươi triệu đồng,
      đây là số minh hoạ. Mạng chậm nên khách bấm nút giải ngân hai lần, và hai máy
      chủ ứng dụng cùng nhận yêu cầu. Có bốn kỹ thuật dùng Redis để chặn chuyện này:
      cụm nhiều nút, khoá có hạn, khử trùng theo mã giao dịch, và danh sách đen mã
      truy cập. Bài này trả lời từng kỹ thuật làm việc gì, và còn hở ở đâu.'
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>một
      khoá nằm ở nút nào của cụm</td><td>khe băm = CRC16(khoá) mod 16384; mỗi nút
      giữ một dải khe</td></tr><tr><td>vì sao khoá cần hạn và cần mã chủ khoá</td><td>hạn
      để máy chết thì khoá tự nhả; mã chủ khoá để không nhả nhầm khoá của máy khác</td></tr><tr><td>gửi
      lại và thu hồi thì chặn bằng gì</td><td>một mục có hạn sống: mã giao dịch hạn
      60 giây; mã truy cập bị thu hồi hạn bằng thời gian còn lại</td></tr></table>'
    clear: true
    say: Hôm nay ta trả lời ba câu, một khoá nằm ở nút nào của cụm, tính bằng khe
      băm. Vì sao khoá giữ quyền phải có hạn và phải có mã chủ khoá. Và yêu cầu gửi
      lại hay mã truy cập bị thu hồi thì chặn bằng gì, câu trả lời là một mục có hạn
      sống.
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l19_crc16('foo') == 44950
  - 44950 == 2 * 16384 + 12182
  - alg.bnx_l19_crc16('foo') % 16384 == 12182
  - 2 * 16384 == 32768 and alg.bnx_l19_crc16('foo') - 32768 == 12182
  - alg.bnx_l19_crc16(bytes([255]) * 4) <= 65535
