    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước năm, cùng một lệnh mà đổi tên khoá là ra hai cách dùng nữa, vì cả hai
      đều là nhớ một điều trong một khoảng thời gian. Với khử trùng, khoá là mã giao
      dịch, hạn sáu mươi giây, đặt được thì xử lý, còn nhận trả lời rỗng thì đó là
      yêu cầu gửi lại. Với danh sách đen, khoá là số riêng của mã truy cập bị thu
      hồi, và hạn bằng thời gian còn lại của mã, vì sau đó mã tự hết hạn. Làm thử
      bằng số minh hoạ, mã có hạn dùng ba trăm giây, bị thu hồi ở giây sáu mươi, nên
      mục danh sách đen đặt hạn hai trăm bốn mươi giây.
