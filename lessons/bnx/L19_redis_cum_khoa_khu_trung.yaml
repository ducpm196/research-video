- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ một nút tới cụm, từ một lệnh tới ba cách dùng'
  checks:
  - alg.bnx_l19_crc16('foo') == 44950 and alg.bnx_l19_slot('foo') == 12182
  - 16384 == 3 * 5461 + 1 and alg.bnx_l19_ranges() == [(0, 5460), (5461, 10922), (10923,
    16383)]
  - alg.bnx_l19_node(12182) == 3 and 12182 >= 10923
  - alg.bnx_l19_slot('acc:1') == 16276 and alg.bnx_l19_slot('acc:2') == 4087
  - alg.bnx_l19_slot('{acc}:1') == alg.bnx_l19_slot('{acc}:2') == 12007 and alg.bnx_l19_same_slot('{acc}:1',
    '{acc}:2')
  - alg.bnx_l19_set_nx_ex([0, 100], 300) == ['OK', None]
  - alg.bnx_l19_set_nx_ex([0, 30], 60) == ['OK', None]
  - alg.bnx_l19_bl_ttl(300, 60) == 240
  steps:
  - show: '<p><b>Bước 1.</b> Một nút không đủ bộ nhớ thì thêm nút. Mọi máy khách phải
      <b>tính giống nhau</b> khoá nào ở đâu, nên dùng một công thức cố định:</p>

      $$\text{khe} = \text{CRC16}(\text{khoá}) \text{ mod } 16384$$

      <span class=''note''>Làm thử: CRC16(foo) = 44950; 44950 mod 16384 = 12182.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, khi một nút không đủ bộ nhớ thì ta thêm nút. Vì mọi máy khách phải
      tính giống nhau khoá nào nằm ở đâu, nên cụm dùng một công thức cố định. Khe
      bằng kết quả băm kiểm lỗi của khoá, chia lấy dư cho mười sáu nghìn ba trăm tám
      mươi tư. Làm thử với khoá mẫu, ta được khe mười hai nghìn một trăm tám mươi
      hai.
  - show: '<p><b>Bước 2.</b> Nút giữ <b>dải khe</b>, không giữ từng khoá, vì thêm
      bớt nút chỉ cần chuyển khe. Ba nút: $16384 = 3 \cdot 5461 + 1$, công cụ tạo
      cụm chia

      <b>0–5460</b>, <b>5461–10922</b>, <b>10923–16383</b> (nút giữa nhận khe dư).</p>

      <span class=''note''>Làm thử: 12182 ≥ 10923 nên khoá foo ở nút thứ ba; hỏi nhầm
      nút thì nhận lỗi <code>MOVED</code>.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, mỗi nút giữ một dải khe chứ không giữ từng khoá, vì khi thêm bớt
      nút ta chỉ cần chuyển khe. Mười sáu nghìn ba trăm tám mươi tư chia ba được năm
      nghìn bốn trăm sáu mươi mốt, dư một, nên ba dải gần bằng nhau, nút giữa nhận
      khe dư. Làm thử, khe của khoá mẫu lớn hơn mười nghìn chín trăm hai mươi ba nên
      nằm ở nút thứ ba, hỏi nhầm nút thì nhận lỗi chuyển hướng.
  - show: '<p><b>Bước 3.</b> Một lệnh đụng <b>nhiều khoá</b> chỉ chạy khi các khoá
      <b>cùng một khe</b>, vì mỗi nút chỉ thấy dữ liệu của mình.

      Muốn ép cùng khe thì dùng thẻ băm: chỉ phần trong <code>{…}</code> được băm
      (ngoặc rỗng thì băm cả khoá).</p>

      <span class=''note''>Làm thử: <code>acc:1</code> ở khe 16276, <code>acc:2</code>
      ở khe 4087: khác khe. <code>{acc}:1</code> và <code>{acc}:2</code> cùng băm
      chữ <code>acc</code>: cùng khe 12007.</span>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước ba, một lệnh đụng nhiều khoá chỉ chạy được khi các khoá cùng một khe,
      vì mỗi nút chỉ thấy dữ liệu của riêng nó. Muốn ép cùng khe thì dùng thẻ băm,
      khi đó chỉ phần trong ngoặc nhọn được đem băm, còn ngoặc rỗng thì băm cả khoá.
      Làm thử, hai khoá tài khoản một và hai rơi vào hai khe khác nhau, còn khi bọc
      chung một thẻ băm thì cả hai cùng về khe mười hai nghìn không trăm linh bảy.
  - show: '<p><b>Bước 4.</b> Khoá giữ quyền: <code>SET loan:disb:A1001 may-a NX EX
      300</code>.</p>

      <ul><li><b>NX</b> gộp “kiểm rồi đặt” thành một lệnh, vì tách hai lệnh thì hai
      máy cùng thấy “chưa có”.</li>

      <li><b>EX 300</b> vì máy giữ khoá có thể chết: sau 300 giây khoá tự nhả.</li>

      <li>Giá trị <code>may-a</code> là <b>mã chủ khoá</b>: khi nhả, chỉ xoá nếu giá
      trị còn là của mình.</li></ul>

      <span class=''note''>Làm thử: máy B gửi cùng lệnh trong 300 giây đó thì nhận
      <code>(nil)</code>.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Bước bốn là khoá giữ quyền, dùng lệnh đặt chỉ khi chưa có, kèm hạn ba trăm
      giây. Tuỳ chọn thứ nhất gộp việc kiểm rồi đặt thành một lệnh, vì nếu tách làm
      hai thì hai máy cùng thấy chưa có và cùng đặt. Tuỳ chọn thứ hai cần có vì máy
      giữ khoá có thể chết, khi đó sau ba trăm giây khoá tự nhả. Giá trị của khoá
      là mã chủ khoá, vì khi nhả ta chỉ được xoá nếu khoá vẫn còn là của mình. Làm
      thử, máy B gửi cùng lệnh trong ba trăm giây đó thì nhận câu trả lời rỗng.
  - show: '<p><b>Bước 5.</b> Cùng một lệnh, đổi tên khoá là ra hai cách dùng nữa,
      vì cả hai đều là “nhớ một điều trong một khoảng thời gian”.</p>

      <ul><li><b>Khử trùng</b>: khoá = mã giao dịch, hạn 60 giây. Đặt được thì xử
      lý; nhận <code>(nil)</code> thì đó là yêu cầu gửi lại.</li>

      <li><b>Danh sách đen</b>: khoá = số riêng <code>jti</code> của mã truy cập bị
      thu hồi; hạn = thời gian còn lại của mã, vì sau đó mã tự hết hạn.</li></ul>

      $$\text{hạn mục danh sách đen} = \text{exp} - \text{bây giờ} = 300 - 60 = \hl{240}\
      \text{giây (số minh hoạ)}$$

