- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ một nút tới cụm, từ một lệnh tới ba cách dùng'
  checks:
  - alg.bnx_l19_crc16('foo') == 44950 and alg.bnx_l19_slot('foo') == 12182
  - 16384 == 3 * 5461 + 1 and alg.bnx_l19_ranges() == [(0, 5460), (5461, 10922), (10923,
    16383)]
  - alg.bnx_l19_node(12182) == 3 and 12182 >= 10923
  - alg.bnx_l19_slot('acc:1') == 16276 and alg.bnx_l19_slot('acc:2') == 4087
  - alg.bnx_l19_slot('{acc}:1') == alg.bnx_l19_slot('{acc}:2') == 12007 and alg.bnx_l19_same_slot('{acc}:1',
    '{acc}:2')
  - alg.bnx_l19_set_nx_ex([0, 100], 300) == ['OK', None]
  - alg.bnx_l19_set_nx_ex([0, 30], 60) == ['OK', None]
  - alg.bnx_l19_bl_ttl(300, 60) == 240
  steps:
  - show: '<p><b>Bước 1.</b> Một nút không đủ bộ nhớ thì thêm nút. Mọi máy khách phải
      <b>tính giống nhau</b> khoá nào ở đâu, nên dùng một công thức cố định:</p>

      $$\text{khe} = \text{CRC16}(\text{khoá}) \text{ mod } 16384$$

      <span class=''note''>Làm thử: CRC16(foo) = 44950; 44950 mod 16384 = 12182.</span>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, một nút không đủ bộ nhớ thì thêm nút. Mọi máy khách phải tính giống
      nhau khoá nào ở đâu, nên khe là kết quả băm chia lấy dư cho mười sáu nghìn ba
      trăm tám mươi tư.
  - show: '<p><b>Bước 2.</b> Nút giữ <b>dải khe</b>, không giữ từng khoá, vì thêm
      bớt nút chỉ cần chuyển khe. Ba nút: $16384 = 3 \cdot 5461 + 1$, công cụ tạo
      cụm chia

      <b>0–5460</b>, <b>5461–10922</b>, <b>10923–16383</b> (nút giữa nhận khe dư).</p>

      <span class=''note''>Làm thử: 12182 ≥ 10923 nên khoá foo ở nút thứ ba; hỏi nhầm
      nút thì nhận lỗi <code>MOVED</code>.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, mỗi nút giữ một dải khe chứ không giữ từng khoá, vì thêm bớt nút
      chỉ cần chuyển khe. Khoá mẫu ở nút thứ ba, hỏi nhầm nút thì nhận lỗi chuyển
      hướng.
  - show: '<p><b>Bước 3.</b> Một lệnh đụng <b>nhiều khoá</b> chỉ chạy khi các khoá
      <b>cùng một khe</b>, vì mỗi nút chỉ thấy dữ liệu của mình.

      Muốn ép cùng khe thì dùng thẻ băm: chỉ phần trong <code>{…}</code> được băm
      (ngoặc rỗng thì băm cả khoá).</p>

      <span class=''note''>Làm thử: <code>acc:1</code> ở khe 16276, <code>acc:2</code>
      ở khe 4087: khác khe. <code>{acc}:1</code> và <code>{acc}:2</code> cùng băm
      chữ <code>acc</code>: cùng khe 12007.</span>

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước ba, lệnh đụng nhiều khoá chỉ chạy khi các khoá cùng một khe, vì mỗi
      nút chỉ thấy dữ liệu của mình. Thẻ băm ép chúng cùng khe: hai khoá tài khoản
      khác khe, còn chung thẻ băm thì cùng khe.'
  - show: '<p><b>Bước 4.</b> Khoá giữ quyền: <code>SET loan:disb:A1001 may-a NX EX
      300</code>.</p>

      <ul><li><b>NX</b> gộp “kiểm rồi đặt” thành một lệnh, vì tách hai lệnh thì hai
      máy cùng thấy “chưa có”.</li>

      <li><b>EX 300</b> vì máy giữ khoá có thể chết: sau 300 giây khoá tự nhả.</li>

      <li>Giá trị <code>may-a</code> là <b>mã chủ khoá</b>: khi nhả, chỉ xoá nếu giá
      trị còn là của mình.</li></ul>

      <span class=''note''>Làm thử: máy B gửi cùng lệnh trong 300 giây đó thì nhận
      <code>(nil)</code>.</span>

      '
    focus:
    - 1
    - 2
    - 3
    say: 'Bước bốn là khoá giữ quyền: lệnh đặt chỉ khi chưa có, kèm hạn ba trăm giây.
      Gộp kiểm rồi đặt thành một lệnh vì tách hai thì hai máy cùng thấy chưa có. Hạn
      cần vì máy giữ khoá có thể chết.'
  - show: '<p><b>Bước 5.</b> Cùng một lệnh, đổi tên khoá là ra hai cách dùng nữa,
      vì cả hai đều là “nhớ một điều trong một khoảng thời gian”.</p>

      <ul><li><b>Khử trùng</b>: khoá = mã giao dịch, hạn 60 giây. Đặt được thì xử
      lý; nhận <code>(nil)</code> thì đó là yêu cầu gửi lại.</li>

      <li><b>Danh sách đen</b>: khoá = số riêng <code>jti</code> của mã truy cập bị
      thu hồi; hạn = thời gian còn lại của mã, vì sau đó mã tự hết hạn.</li></ul>

      $$\text{hạn mục danh sách đen} = \text{exp} - \text{bây giờ} = 300 - 60 = \hl{240}\
      \text{giây (số minh hoạ)}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước năm, cùng một lệnh đổi tên khoá là ra hai cách dùng nữa. Khử trùng trả
      lời rỗng nghĩa là yêu cầu gửi lại, còn danh sách đen có hạn bằng thời gian còn
      lại của mã, tức hai trăm bốn mươi giây.
- id: example
  kind: example
  title: Ví dụ chạy thật trên Redis 8.10.3, từng phép tính
  checks:
  - alg.bnx_l19_crc16('123456789') == 0x31C3
  - alg.bnx_l19_crc16('foo') == 44950 and 44950 - 2 * 16384 == 12182
  - alg.bnx_l19_ranges() == [(0, 5460), (5461, 10922), (10923, 16383)] and alg.bnx_l19_node(12182)
    == 3
  - '[b - a + 1 for a, b in alg.bnx_l19_ranges()] == [5461, 5462, 5461]'
  - alg.bnx_l19_set_nx_ex([0, 0], 300) == ['OK', None]
  - alg.bnx_l19_lock_story(300, 120) == (1, 1) and 300 - 120 == 180
  - alg.bnx_l19_slot('dedup:TX1001') == 9306 and alg.bnx_l19_node(9306) == 2
  - alg.bnx_l19_slot('bl:jti-0000') == 1074 and alg.bnx_l19_node(1074) == 1
  - alg.bnx_l19_set_nx_ex([0, 30, 61, 62], 60) == ['OK', None, 'OK', None]
  - alg.bnx_l19_bl_ttl(300, 60) == 240
  steps:
  - show: <table class='t'><tr><th>ký hiệu trong hàm</th><th>nghĩa</th><th>ví dụ nhỏ</th></tr><tr><td><code>c
      ^= x &lt;&lt; 8</code></td><td><code>x &lt;&lt; 8</code> dịch x sang trái 8
      bit, tức nhân 256; <code>^</code> cộng từng bit không nhớ (giống nhau cho 0,
      khác nhau cho 1); <code>^=</code> gán kết quả vào c</td><td><code>0b1010 ^ 0b0110
      = 0b1100</code>; <code>3 &lt;&lt; 1 = 6</code></td></tr><tr><td><code>c &amp;
      0x8000</code></td><td>chỉ giữ bit mà hai bên cùng là 1; <code>0x8000</code>
      chỉ có bit cao nhất của số 16 bit, nên kết quả khác 0 là bit cao nhất của c
      đang là 1</td><td><code>0b1100 &amp; 0b1000 = 0b1000</code></td></tr><tr><td><code>(c
      &lt;&lt; 1) ^ 0x1021</code></td><td>dịch trái 1 bit rồi cộng bit với <code>0x1021</code>,
      hằng của biến thể CRC16 XMODEM (số viết hệ 16); không thì chỉ dịch</td><td>lặp
      8 lần cho mỗi byte</td></tr><tr><td><code>c &amp;= 0xFFFF</code></td><td>giữ
      lại đúng 16 bit thấp, bỏ bit tràn</td><td><code>0x1FFFF &amp; 0xFFFF = 0xFFFF</code></td></tr></table>
    clear: true
    say: 'Hàm băm dùng vài ký hiệu về bit. Dấu mũ cộng từng bit không nhớ: giống nhau
      cho không, khác nhau cho một. Dấu dịch trái nhân đôi, còn dấu và chỉ giữ bit
      mà cả hai cùng bằng một.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def
      crc16(b):</code> … <code>return c</code></td><td>khai hàm nhận chuỗi byte b;
      dòng thụt vào là thân hàm; <code>return c</code> trả số c về chỗ gọi</td><td><code>crc16(b"foo")</code>
      ra 44950</td></tr><tr><td><code>for x in b:</code>, <code>for _ in range(8):</code></td><td>vòng
      lặp: mỗi vòng x là một byte của b, lần lượt; <code>range(8)</code> cho đúng
      tám lượt, <code>_</code> là tên bỏ đi vì không dùng</td><td>mỗi byte được trộn
      tám lần</td></tr><tr><td><code>A if đk else B</code></td><td>nếu điều kiện đúng
      thì giá trị là A, ngược lại là B; ở đây A là <code>(c &lt;&lt; 1) ^ 0x1021</code>,
      B là <code>c &lt;&lt; 1</code>, điều kiện là bit cao của c bằng 1</td><td><code>5
      if 1 &gt; 0 else 9</code> ra 5</td></tr></table>'
    clear: true
    say: Khai hàm nhận chuỗi byte, dòng thụt vào là thân hàm, lệnh trả về đưa kết
      quả ra. Vòng ngoài duyệt từng byte, vòng trong lặp đúng tám lượt. Biểu thức
      điều kiện cho giá trị đầu nếu điều kiện đúng, ngược lại cho giá trị sau.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>b"foo"</code>,
      <code>hex(n)</code></td><td>chữ <code>b</code> trước dấu nháy: chuỗi <b>byte</b>,
      không phải chuỗi chữ; <code>hex(n)</code>: viết số n ở hệ 16</td><td><code>hex(255)</code>
      ra <code>0xff</code></td></tr><tr><td><code>print(a, b)</code></td><td>in các
      giá trị ra màn hình, cách nhau một dấu cách</td><td><code>print(1, 2)</code>
      in <code>1 2</code></td></tr><tr><td><code>[(a, a + n - 1) for a, n in ((0,
      5461), …)]</code></td><td>danh sách sinh sẵn: lặp từng cặp (a, n), tính cặp
      (a, a + n − 1), gom hết vào một danh sách; ở đây đổi (điểm đầu, số khe) thành
      (điểm đầu, điểm cuối)</td><td><code>(5461, 5462)</code> thành <code>(5461, 10922)</code></td></tr></table>'
    introduces:
    - bnx_thap_luc_phan
    clear: true
    say: Chữ b trước dấu nháy tạo chuỗi byte, còn hàm thập lục phân viết số ở hệ mười
      sáu. Lệnh in đưa các giá trị ra màn hình, cách nhau một dấu cách. Danh sách
      sinh sẵn lặp từng cặp, tính cặp mới rồi gom vào một danh sách.
  - show: '<p><b>Tự tính khe băm bằng Python (không cần Redis)</b></p><div class="code"><div>def
      crc16(b):                 # CRC16 XMODEM, đa thức 0x1021</div><div>    c = 0</div><div>    for
      x in b:</div><div>        c ^= x &lt;&lt; 8</div><div>        for _ in range(8):</div><div>            c
      = (c &lt;&lt; 1) ^ 0x1021 if c &amp; 0x8000 else c &lt;&lt; 1</div><div>            c
      &amp;= 0xFFFF</div><div>    return c</div><div>c = crc16(b"foo")</div><div>print(hex(crc16(b"123456789")),
      c, c % 16384)</div><div>print([(a, a + n - 1) for a, n in</div><div>       ((0,
      5461), (5461, 5462), (10923, 5461))])</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Trước hết ta tự tính khe băm bằng Python, chưa cần Redis. Hàm là phép băm
      kiểm lỗi đi qua từng byte của khoá. Các dòng sau in kết quả băm, số dư và ba
      dải khe.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>0x31c3 44950 12182</div><div>[(0,
      5460), (5461, 10922), (10923, 16383)]</div></div>

      $$① \; 44950 \text{ mod } 16384 = 44950 - 2 \cdot 16384 = \hl{12182}$$

      $$② \; 10923 \le 12182 \Rightarrow \hlg{\text{nút thứ ba}}$$

      '
    focus:
    - 1
    - 3
    clear: true
    say: 'Kết quả chạy thật: chuỗi thử chuẩn ra ba một C ba, đúng đặc tả. Phép tính
      thứ nhất ra mười hai nghìn một trăm tám mươi hai.'
    introduces:
    - implies
  - show: '<table class=''t''><tr><th>viết trong lệnh</th><th>nghĩa</th></tr><tr><td><code>for
      p in 7001 7002; do … done</code></td><td>lặp lại lệnh bên trong cho từng giá
      trị p: 7001 rồi 7002</td></tr><tr><td><code>until … ; do sleep 1; done</code></td><td>chờ
      1 giây rồi thử lại, cho tới khi lệnh điều kiện thành công</td></tr><tr><td><code>grep
      -q state:ok</code></td><td>tìm chữ <code>state:ok</code> trong đầu vào, không
      in gì, chỉ báo thấy hay không</td></tr><tr><td><code>&gt; /dev/null 2&gt;&amp;1</code></td><td>bỏ
      hết chữ in ra, cả thông báo lỗi, vào nơi bỏ đi của máy</td></tr></table>'
    clear: true
    say: 'Các lệnh dựng cụm dùng vài cú pháp của vỏ lệnh: vòng lặp cho từng cổng,
      vòng chờ thử lại mỗi giây, và dấu chuyển hướng ném chữ in ra vào nơi bỏ đi.'
  - show: '<table class=''t''><tr><th>viết trong lệnh</th><th>nghĩa</th></tr><tr><td><code>docker
      run -d --name … redis:8.10.3 redis-server --port 7000 --cluster-enabled yes</code></td><td>chạy
      một hộp chứa: <code>-d</code> chạy nền, <code>--name</code> đặt tên, rồi tên
      ảnh; phần sau là lệnh chạy trong hộp: máy chủ Redis ở cổng 7000, bật chế độ
      cụm</td></tr><tr><td><code>--cluster-config-file n7001.conf --daemonize yes</code></td><td>mỗi
      nút ghi trạng thái cụm vào một tệp riêng; <code>--daemonize yes</code> chạy
      nền</td></tr><tr><td><code>redis-cli --cluster create … --cluster-yes | grep
      -E "Slots|covered"</code></td><td>tạo cụm từ ba nút và chia khe; <code>--cluster-yes</code>
      trả lời đồng ý mọi câu hỏi; <code>grep -E</code> chỉ giữ dòng có một trong hai
      chữ</td></tr></table>'
    clear: true
    say: 'Lệnh dựng cụm có nhiều cờ: chạy hộp có tên ở chế độ nền và bật chế độ cụm,
      mỗi nút thêm có tệp trạng thái riêng, còn lệnh tạo cụm chia khe.'
  - show: <table class='t'><tr><th>viết trong lệnh</th><th>nghĩa</th></tr><tr><td><code>D="docker
      exec -i …"</code>, rồi <code><span>&#36;</span>D …</code></td><td>đặt cả một
      lệnh vào biến <code>D</code>; <code><span>&#36;</span>D</code> chạy lệnh theo
      sau bên trong hộp</td></tr><tr><td><code>r() { <span>&#36;</span>D redis-cli
      --no-raw -p 7000 "<span>&#36;</span>@"; }</code></td><td>hàm <code>r</code>
      gửi lệnh tới nút 7000; <code>"<span>&#36;</span>@"</code> chuyển mọi tham số
      của <code>r</code> cho <code>redis-cli</code>; <code>--no-raw</code> in kiểu
      có nhãn <code>(integer)</code>, <code>(nil)</code></td></tr></table>
    clear: true
    say: Dòng đầu đặt cả lệnh vào một biến để dùng lại, và hàm ngắn chuyển mọi tham
      số cho công cụ.
  - show: '<p><b>Dựng cụm ba nút thật (thu nhỏ: ba tiến trình Redis trong một container
      Docker)</b></p><div class="code"><div>docker rm -f bnx-l19-redis &gt; /dev/null
      2&gt;&amp;1</div><div>docker run -d --name bnx-l19-redis redis:8.10.3 \</div><div>  redis-server
      --port 7000 --cluster-enabled yes &gt; /dev/null</div><div>D="docker exec -i
      bnx-l19-redis"</div><div>for p in 7001 7002; do <span>&#36;</span>D redis-server
      --port <span>&#36;</span>p \</div><div>  --cluster-enabled yes --cluster-config-file
      n<span>&#36;</span>p.conf \</div><div>  --daemonize yes &gt; /dev/null; done</div><div><span>&#36;</span>D
      redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 \</div><div>  127.0.0.1:7002
      --cluster-yes | grep -E "Slots|covered"</div><div>r() { <span>&#36;</span>D
      redis-cli --no-raw -p 7000 "<span>&#36;</span>@"; }</div><div>until r CLUSTER
      INFO | grep -q state:ok; do sleep 1; done</div></div><p class=''note''>Số phiên
      bản Redis 8.10.3 là ảnh dùng lúc ghi hình; chưa đối chiếu độc lập với trang
      phát hành (NOT_VERIFIED). <code>DELEX … IFEQ</code> có từ Redis 8.4 (cũng NOT_VERIFIED
      độc lập).</p>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bây giờ ta dựng một cụm thật bằng Docker, bản thu nhỏ: ba tiến trình Redis
      chạy chung một hộp chứa, còn cụm thật đặt mỗi nút trên một máy riêng. Lệnh cuối
      chia khe cho ba nút.'
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>Master[0] -&gt; Slots
      0 - 5460</div><div>Master[1] -&gt; Slots 5461 - 10922</div><div>Master[2] -&gt;
      Slots 10923 - 16383</div><div>[OK] All 16384 slots covered.</div></div>
    clear: true
    say: 'Kết quả chạy thật: ba nút nhận đúng ba dải khe ta vừa tính, và dòng cuối
      xác nhận mọi khe đã có chủ.'
  - show: '<p><b>Hỏi Redis thật: khoá foo ở khe nào, nút nào</b></p><div class="code"><div>r
      CLUSTER KEYSLOT foo</div><div>r SET foo bar</div><div>r -c SET foo bar</div><div>r
      -c GET foo</div></div>'
    focus:
    - - 1
      - 2
    clear: true
    say: Ta hỏi Redis thật bốn lệnh, lệnh một hỏi khe của khoá mẫu, lệnh hai đặt giá
      trị gửi tới nút không giữ khe này, hai lệnh sau thêm chế độ cụm để tự theo lời
      chuyển hướng.
  - show: <p><b>Kết quả chạy thật (đã lược các dòng “-> Redirected …” mà redis-cli
      -c in thêm)</b></p><div class="code"><div>(integer) 12182</div><div>(error)
      MOVED 12182 127.0.0.1:7002</div><div>OK</div><div>"bar"</div></div>
    focus:
    - - 1
    - 2
    clear: true
    say: Kết quả chạy thật, Redis trả đúng khe mười hai nghìn một trăm tám mươi hai.
      Nút thứ nhất từ chối và chỉ sang cổng bảy nghìn không trăm linh hai, tức nút
      thứ ba, còn chế độ cụm thì tự gửi lại sang đó.
  - show: '<p><b>Khoá giải ngân hồ sơ A1001: hai máy tranh nhau</b></p><div class="code"><div>r
      -c &lt;&lt;''EOF''</div><div>SET loan:disb:A1001 may-a NX EX 300</div><div>SET
      loan:disb:A1001 may-b NX EX 300</div><div>TTL loan:disb:A1001</div><div>DELEX
      loan:disb:A1001 IFEQ may-b</div><div>DELEX loan:disb:A1001 IFEQ may-a</div><div>SET
      loan:disb:A1001 may-b NX EX 300</div><div>EOF</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Tiếp theo là khoá giải ngân của hồ sơ A một không không một. Máy A đặt khoá
      kèm mã chủ khoá, máy B gửi cùng lệnh, rồi xem hạn. Sau đó B nhả bằng mã của
      B, A nhả bằng mã của A, rồi B xin lại.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>OK</div><div>(nil)</div><div>(integer)
      300</div><div>(integer) 0</div><div>(integer) 1</div><div>OK</div></div>

      $$③ \; 300 - 120 = \hlg{180}\ \text{giây dư nếu A xong ở giây 120 và nhả ngay
      (số minh hoạ)}$$

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Kết quả chạy thật: máy A đặt được, máy B nhận trả lời rỗng, hạn còn ba trăm
      giây. B sai mã nên không xoá được, A xoá được, rồi B lấy được. Phép tính thứ
      ba: nhả sớm ở giây một trăm hai mươi thì khỏi giữ thêm một trăm tám mươi giây.'
  - show: <p><b>Khử trùng mã giao dịch TX1001 và danh sách đen mã truy cập</b></p><div
      class="code"><div>r -c &lt;&lt;'EOF'</div><div>SET dedup:TX1001 1 NX EX 60</div><div>SET
      dedup:TX1001 1 NX EX 60</div><div>TTL dedup:TX1001</div><div>SET bl:jti-7f3a
      1 EX 240</div><div>TTL bl:jti-7f3a</div><div>EXISTS bl:jti-7f3a</div><div>EXISTS
      bl:jti-0000</div><div>EOF</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: 'Ba lệnh đầu là khử trùng: đặt mã giao dịch hạn sáu mươi giây, gửi lại, rồi
      xem hạn. Các lệnh sau là danh sách đen: ghi mã bị thu hồi hạn hai trăm bốn mươi
      giây, rồi hỏi hai mã.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>-&gt; Redirected
      to slot [9306] located at 127.0.0.1:7001</div><div>OK</div><div>(nil)</div><div>(integer)
      60</div><div>OK</div><div>(integer) 240</div><div>(integer) 1</div><div>-&gt;
      Redirected to slot [1074] located at 127.0.0.1:7000</div><div>(integer) 0</div></div>

      $$④ \; 30 < 60 \Rightarrow \hl{\text{từ chối}}; \quad 61 \ge 60 \Rightarrow
      \hlg{\text{được nhận}}; \qquad ⑤ \; 300 - 60 = \hl{240}\ \text{giây}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Kết quả chạy thật: lần đặt đầu thành công, lần gửi lại nhận trả lời rỗng.
      Phép tính thứ tư và thứ năm khớp: giây ba mươi từ chối, giây sáu mươi mốt nhận,
      hạn danh sách đen hai trăm bốn mươi giây.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: Redis thật với hạn thu nhỏ, và thẻ băm'
  checks:
  - alg.bnx_l19_set_nx_ex([0, 1, 3], 2) == ['OK', None, 'OK']
  - alg.bnx_l19_slot('acc:1') == 16276 and alg.bnx_l19_slot('acc:2') == 4087 and not
    alg.bnx_l19_same_slot('acc:1', 'acc:2')
  - alg.bnx_l19_slot('{acc}:1') == 12007 and alg.bnx_l19_node(12007) == 3
  - alg.bnx_l19_slot('foo') == 12182
  - alg.bnx_l19_slot('dedup:TX1001') == 9306 and alg.bnx_l19_node(9306) == 2
  - alg.bnx_l19_ranges() == [(0, 5460), (5461, 10922), (10923, 16383)]
  steps:
  - show: <table class='t'><tr><th>viết trong lệnh</th><th>nghĩa</th></tr><tr><td><code><span>&#36;</span>D
      sh -c '…'</code>, <code><span>&#36;</span>c</code></td><td>chạy cả đoạn lệnh
      bằng vỏ lệnh bên trong hộp; biến <code>c</code> giữ sẵn một lệnh, <code><span>&#36;</span>c</code>
      chạy nó</td></tr><tr><td><code>MSET k1 v1 k2 v2</code></td><td>đặt nhiều khoá
      bằng một lệnh (khác với <code>SET</code> chỉ đặt một khoá)</td></tr></table>
    clear: true
    say: 'Phần kiểm dùng thêm hai chỗ mới nên ta giải trước: đoạn lệnh chạy bằng vỏ
      lệnh trong hộp, và lệnh đặt nhiều khoá bằng một lệnh.'
  - show: '<p><b>Đường khác cho phép ④: Redis thật, hạn thu nhỏ còn 2 giây</b></p><div
      class="code"><div><span>&#36;</span>D sh -c ''</div><div>c="redis-cli --no-raw
      -c -p 7000 SET dedup:TX2002 1 NX EX 2"</div><div><span>&#36;</span>c; sleep
      1; <span>&#36;</span>c; sleep 2; <span>&#36;</span>c''</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>OK</div><div>(nil)</div><div>OK</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Phép tính thứ tư mới chỉ tính tay, nên ta kiểm bằng Redis thật với hạn thu
      nhỏ còn hai giây. Lệnh đặt gửi ba lần: ngay đầu, sau một giây, rồi sau thêm
      hai giây. Kết quả được nhận, từ chối, được nhận, như phép tính tay.'
  - show: '<p><b>Đường khác cho bước 3: lệnh nhiều khoá trên cụm thật</b></p><div
      class="code"><div>r -c &lt;&lt;''EOF''</div><div>MSET acc:1 10 acc:2 20</div><div>CLUSTER
      KEYSLOT acc:1</div><div>CLUSTER KEYSLOT acc:2</div><div>MSET {acc}:1 10 {acc}:2
      20</div><div>CLUSTER KEYSLOT {acc}:1</div><div>EOF</div></div>'
    clear: true
    say: 'Ta kiểm bước ba trên cụm thật, vì lệnh nhiều khoá dễ sai: đặt hai khoá tài
      khoản trong một lệnh, hỏi khe từng khoá, rồi đặt hai khoá chung thẻ băm.'
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>(error) CROSSSLOT
      Keys in request don't hash to the same slot</div><div>(integer) 16276</div><div>(integer)
      4087</div><div>-&gt; Redirected to slot [12007] located at 127.0.0.1:7002</div><div>OK</div><div>(integer)
      12007</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: 'Kết quả chạy thật: lệnh đầu bị từ chối vì hai khoá ở khe mười sáu nghìn
      hai trăm bảy mươi sáu và bốn nghìn không trăm tám mươi bảy. Chung thẻ băm thì
      lệnh chạy được ở khe mười hai nghìn không trăm linh bảy.'
- id: quymo
  kind: example
  title: 'Khi số khoá lớn dần: chia đều cho ba nút, và khi thẻ băm dồn về một nút'
  checks:
  - alg.bnx_l19_node_counts(3000) == [994, 994, 1012] and alg.bnx_l19_node_counts(3000,
    True) == [0, 0, 3000]
  - sum([100008, 99949, 100043]) == 300000 and sum([994, 994, 1012]) == 3000
  - '[alg.bnx_l19_live_dedup(r, 60) for r in (100, 10000, 1000000)] == [6000, 600000,
    60000000]'
  - alg.bnx_l19_live_dedup(10000, 60) // alg.bnx_l19_live_dedup(100, 60) == 100
  - alg.bnx_l19_live_dedup(1000000, 60) // alg.bnx_l19_live_dedup(100, 60) == 10000
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>khoa.find("{")</code></td><td>vị
      trí của <code>{</code> đầu tiên trong chuỗi, hoặc −1 nếu không có; <code>khoa.find("}",
      a + 1)</code> tìm từ vị trí a + 1</td><td><code>"x{ab}".find("{")</code> ra
      1</td></tr><tr><td><code>khoa[a + 1:b]</code></td><td>cắt lát: lấy phần từ vị
      trí a + 1 tới trước vị trí b; ở đây là phần nằm giữa hai ngoặc nhọn</td><td><code>"x{ab}"[2:4]</code>
      ra <code>ab</code></td></tr><tr><td><code>next(i for i, (x, y) in enumerate(dai)
      if x &lt;= k &lt;= y)</code></td><td>duyệt các dải khe; <code>enumerate</code>
      cho thêm số thứ tự i; <code>next</code> lấy i đầu tiên thoả <code>x &lt;= k
      &lt;= y</code>, tức k nằm trong dải</td><td>k = 12182 ra 2, tức nút thứ ba</td></tr></table>'
    clear: true
    say: Hàm tìm cho vị trí ngoặc nhọn đầu tiên, hoặc trừ một nếu không có. Cắt lát
      lấy đoạn từ vị trí đầu tới trước vị trí cuối. Duyệt các dải khe kèm số thứ tự,
      lấy số đầu tiên mà khe nằm trong dải.
  - show: '<p><b>PhanBo.py (1/2): nút giữ khe của một khoá, có tính thẻ băm</b></p><div
      class="code"><div>import binascii</div><div>dai = [(0, 5460), (5461, 10922),
      (10923, 16383)]</div><div>def nut(khoa):</div><div>    a = khoa.find("{")</div><div>    b
      = khoa.find("}", a + 1)</div><div>    if a &gt;= 0 and b &gt; a + 1:         #
      thẻ băm: chỉ băm phần trong {}</div><div>        khoa = khoa[a + 1:b]</div><div>    k
      = binascii.crc_hqx(khoa.encode(), 0) % 16384</div></div>'
    focus:
    - - 1
    - 2
    clear: true
    say: Ta đếm thật, Python có sẵn phép băm này, cho cùng kết quả với hàm tự viết.
      Hàm nút lấy phần trong thẻ băm nếu có, băm rồi tra dải khe để biết nút giữ khoá.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      n in (3000, 300000):</code></td><td>chạy hai lần, n bằng 3000 rồi 300000; <code>range(n)</code>:
      i đi từ 0 tới n − 1</td><td>mỗi cỡ đếm lại từ đầu</td></tr><tr><td><code>f"dedup:{{tx}}:{i}"</code></td><td>chuỗi
      f: <code>{i}</code> được thay bằng giá trị của i; ngoặc nhọn gấp đôi in ra một
      ngoặc nhọn thật</td><td>i = 7 ra <code>dedup:{tx}:7</code></td></tr><tr><td><code>dem[nut(…)]
      += 1</code></td><td><code>dem</code> là danh sách ba ô đếm; <code>nut(…)</code>
      cho số nút 0, 1 hoặc 2; <code>+= 1</code> tăng ô của nút đó thêm 1</td><td>nút
      2 thì <code>dem[2]</code> tăng 1</td></tr></table>'
    clear: true
    say: Vòng ngoài chạy hai cỡ, vòng trong cho i đi từ không tới n trừ một. Chuỗi
      có chữ f thay phần trong ngoặc nhọn bằng giá trị, ngoặc gấp đôi in ra một ngoặc
      thật. Danh sách có ba ô đếm, hàm nút chọn ô để tăng thêm một.
  - show: '<p><b>PhanBo.py (2/2): đếm khoá về từng nút, ở hai cỡ</b></p><div class="code"><div>    return
      next(i for i, (x, y) in enumerate(dai) if x &lt;= k &lt;= y)</div><div>for n
      in (3000, 300000):</div><div>    dem, the = [0, 0, 0], [0, 0, 0]</div><div>    for
      i in range(n):</div><div>        dem[nut(f"dedup:TX{i}")] += 1</div><div>        the[nut(f"dedup:{{tx}}:{i}")]
      += 1</div><div>    print(n, "khoa, nut 1-2-3:", dem, "| chung the bam:", the)</div></div>'
    clear: true
    say: Với mỗi cỡ, ta đếm khoá mã giao dịch về từng nút, rồi đếm lại khi mọi khoá
      chung một thẻ băm.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>3000 khoa, nut 1-2-3:
      [994, 994, 1012] | chung the bam: [0, 0, 3000]</div><div>300000 khoa, nut 1-2-3:
      [100008, 99949, 100043] | chung the bam: [0, 0, 300000]</div></div>'
    clear: true
    say: Kết quả chạy thật cho thấy khoá chia gần đều ba nút ở cả hai cỡ, còn khi
      chung thẻ băm thì toàn bộ về một nút.
  - show: '<table class=''t''><tr><th>số khoá</th><th>chia ba nút (đo thật)</th><th>chung
      một thẻ băm (đo thật)</th><th>mục khử trùng sống cùng lúc = tốc độ × 60 giây
      (mô hình)</th></tr><tr><td><span style=''white-space:nowrap''>3 000 (×1)</span></td><td>994
      / 994 / 1 012</td><td>0 / 0 / 3 000</td><td>100 yêu cầu/giây: 6 000 mục</td></tr><tr><td><span
      style=''white-space:nowrap''>300 000 (×100)</span></td><td>100 008 / 99 949
      / 100 043</td><td>0 / 0 / 300 000</td><td>10 000 yêu cầu/giây: 600 000 mục</td></tr><tr><td><span
      style=''white-space:nowrap''>30 000 000 (×10 000)</span></td><td>(cùng quy luật,
      chưa đo)</td><td>một nút giữ hết</td><td>1 000 000 yêu cầu/giây: 60 000 000
      mục</td></tr></table><p style=''margin-top:14px''><span class=''note''>Hai cỡ
      đầu đo thật bằng Python (cỡ 3 000 khoá cũng đã đối chiếu với Redis thật ở bộ
      kiểm); dòng cuối là mô hình, chưa đo.</span></p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Khoá chia gần đều ba nút ở cả hai cỡ, lệch chưa tới hai phần trăm. Một thẻ
      băm chung thì nút thứ ba gánh hết, cụm mất tác dụng. Số mục khử trùng sống cùng
      lúc bằng tốc độ nhân hạn, nên ở một triệu yêu cầu mỗi giây là sáu mươi triệu.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>một
      nút, mọi khoá</td><td>lệnh nhiều khoá chạy thoải mái</td><td>bộ nhớ và tải bị
      chặn bởi một máy</td><td>dữ liệu nhỏ, tải thấp</td></tr><tr><td>cụm, thẻ băm
      theo từng đối tượng</td><td>chia đều tải, lệnh nhiều khoá trong một đối tượng
      vẫn chạy</td><td>lệnh nhiều khoá khác đối tượng bị từ chối</td><td>dữ liệu lớn
      dần</td></tr><tr><td>cụm, một thẻ băm chung</td><td>lệnh nhiều khoá chạy hết</td><td>một
      nút gánh toàn bộ, mất lợi ích của cụm</td><td>không nên</td></tr></table>
    clear: true
    say: Một nút gãy khi dữ liệu vượt một máy. Cụm chia khe, đổi lại lệnh nhiều khoá
      khác đối tượng bị từ chối, nên đặt thẻ băm theo từng đối tượng.
- id: pitfalls
  kind: pitfall
  title: 'Lỗi hay gặp theo thời gian: lúc mới dựng, lúc tải tăng, lúc vận hành lâu'
  checks:
  - alg.bnx_l19_lock_story(300, 320, owner_check=False) == (2, 1)
  - alg.bnx_l19_lock_story(300, 320) == (2, 0)
  - alg.bnx_l19_overrun(300, 320) == 20
  - alg.bnx_l19_slot('loan:disb:{A1001}') == 1830 and alg.bnx_l19_slot('loan:disb:A1001')
    == 5075
  - alg.bnx_l19_hashed_part('loan:disb:{A1001}') == 'A1001'
  - alg.bnx_l19_processed([0, 90], 60) == 2
  - alg.bnx_l19_processed([0, 90], 120) == 1
  - alg.bnx_l19_set_nx_ex([0, 30], 60)[1] is None and alg.bnx_l19_set_nx_ex([0, 30],
    120)[1] is None
  - not alg.bnx_l19_same_slot('acc:1', 'acc:2')
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (lúc mới dựng).</b> Nhả khoá bằng <code>DEL</code>
      thẳng, hoặc đặt giá trị khoá là số <code>1</code> cho mọi máy.

      Máy A quá hạn, máy B đã lấy khoá, rồi A chạy tới dòng nhả và <b class="red">xoá
      mất khoá của B</b>.

      <br><span class="note">Cách chữa: giá trị là mã chủ khoá ngẫu nhiên; nhả bằng
      lệnh “chỉ xoá nếu giá trị còn là của tôi” (<code>DELEX … IFEQ</code>; bản Redis
      cũ hơn 8.4 dùng một đoạn kịch bản nhỏ so rồi xoá).</span></div>

      '
    clear: true
    say: Lỗi thứ nhất lúc mới dựng là nhả khoá bằng lệnh xoá thẳng, nên máy A quá
      hạn có thể xoá mất khoá của B. Hãy dùng mã chủ khoá ngẫu nhiên và lệnh chỉ xoá
      khi giá trị là của mình.
  - show: '<div class="box warn"><b>Lỗi 2 (lúc tải tăng, chuyển từ một nút sang cụm).</b>
      Mã đang chạy tốt trên một nút bỗng báo

      <code class="red">CROSSSLOT</code>, vì lệnh nhiều khoá chỉ chạy trong cụm khi
      các khoá <b>cùng một khe băm</b>.

      Chữa vội bằng cách gắn <b>cùng một thẻ băm cho mọi khoá</b> thì mọi khoá dồn
      về một nút, cụm mất tác dụng (bảng quy mô vừa đo).

      <br><span class="note">Cách chữa: thẻ băm theo từng đối tượng, ví dụ theo mã
      hồ sơ. Chú ý: viết nguyên <code>loan:disb:{A1001}</code> thì Redis chỉ băm chữ
      <code>A1001</code> (khe 1830, khác khe 5075 của <code>loan:disb:A1001</code>).</span></div>

      '
    clear: true
    say: 'Lỗi thứ hai khi chuyển sang cụm: bỗng báo lỗi các khoá không cùng khe. Chữa
      vội bằng một thẻ băm chung thì mọi khoá dồn về một nút, nên hãy đặt thẻ băm
      theo từng đối tượng.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc vận hành lâu dài).</b>
      Tin rằng khoá Redis có hạn là <b>loại trừ tuyệt đối</b>.

      Khoá hạn 300 giây, tiến trình A bị dừng tới giây 320 (thu gom rác, máy ảo bị
      treo, gọi lõi ngân hàng chậm): quá hạn 320 − 300 = <b class="red">20 giây</b>,

      B đã lấy khoá, và <b>cả hai cùng giải ngân</b>. Nút chính hỏng trước khi nút
      bản sao nhận khoá cũng gây hiệu ứng tương tự.

      <br><span class="note">Cách chữa: khoá chỉ để giảm tranh chấp; lớp chặn cuối
      nằm ở cơ sở dữ liệu (ràng buộc duy nhất theo mã hồ sơ, hoặc đổi trạng thái có
      điều kiện).</span></div>

      '
    clear: true
    say: 'Lỗi thứ ba, của người đã đi làm: tin rằng khoá Redis có hạn là loại trừ
      tuyệt đối. Tiến trình A bị dừng quá hạn hai mươi giây nên máy B lấy được khoá
      và cả hai cùng giải ngân, nên lớp chặn cuối là ràng buộc duy nhất.'
  - show: '<p><b>Lỗi 4 (người đã đi làm, lúc đối tác đổi cách thử lại).</b> Hạn khử
      trùng ngắn hơn thời gian thử lại của bên gửi <i>(số minh hoạ)</i>.</p><table
      class=''t''><tr><th>bên gửi thử lại ở giây</th><th>hạn khử trùng 60 giây</th><th>hạn
      khử trùng 120 giây</th></tr><tr><td>30</td><td>30 &lt; 60: từ chối</td><td>30
      &lt; 120: từ chối</td></tr><tr><td>90</td><td>90 ≥ 60: mục đã hết, <b class=''red''>xử
      lý lần hai</b></td><td>90 &lt; 120: từ chối</td></tr></table><p class=''note''>Cách
      chữa: hạn dài hơn khoảng thử lại dài nhất của bên gửi; và vẫn giữ ràng buộc
      duy nhất theo mã giao dịch ở cơ sở dữ liệu.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Lỗi thứ tư: hạn khử trùng ngắn hơn thời gian thử lại của bên gửi. Hạn sáu
      mươi giây mà bên gửi thử lại ở giây chín mươi thì xử lý hai lần, nên hạn phải
      dài hơn.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l19_crc16('hello') == 50018
  - 3 * 16384 == 49152 and 50018 - 49152 == 866 == alg.bnx_l19_slot('hello')
  - alg.bnx_l19_node(866) == 1
  - alg.bnx_l19_set_nx_ex([0, 45], 60) == ['OK', None]
  - alg.bnx_l19_set_nx_ex([0, 75], 60) == ['OK', 'OK']
  - alg.bnx_l19_bl_ttl(900, 250) == 650
  - alg.bnx_l19_lock_story(300, 301)[0] == 2
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>CRC16
      của khoá <code>hello</code> là 50018. Khoá này ở khe nào, và nút nào trong cụm
      ba nút 0–5460, 5461–10922, 10923–16383?</td></tr><tr><td>2</td><td>Mã giao dịch
      đặt hạn 60 giây ở giây 0. Bên gửi gửi lại ở giây 45 và giây 75: mỗi lần được
      nhận hay bị từ chối? Mã truy cập hạn 900 giây bị thu hồi ở giây 250: mục danh
      sách đen đặt hạn bao nhiêu?</td></tr><tr><td>3</td><td>Quyết định: chống giải
      ngân hai lần cho một hồ sơ bằng (a) chỉ khoá Redis hạn 300 giây, (b) chỉ ràng
      buộc duy nhất ở cơ sở dữ liệu, hay (c) cả hai?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, kết quả băm của một khoá là năm
      mươi nghìn không trăm mười tám, khoá ở khe và nút nào? Câu hai, mã giao dịch
      hạn sáu mươi giây gửi lại ở giây bốn mươi lăm và bảy mươi lăm thì sao? Còn mã
      truy cập hạn chín trăm giây thu hồi ở giây hai trăm năm mươi thì hạn danh sách
      đen là bao nhiêu? Câu ba, chống giải ngân hai lần nên chọn cách nào? Hãy dừng
      video.
  - show: '<p>Câu 1: $3 \cdot 16384 = 49152$.</p>

      $$50018 - 49152 = \hlg{866}; \qquad 0 \le 866 \le 5460 \Rightarrow \hlg{\text{nút
      thứ nhất}}$$

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu một, ba lần mười sáu nghìn ba trăm tám mươi tư là bốn mươi chín
      nghìn một trăm năm mươi hai, nên khe là tám trăm sáu mươi sáu, thuộc nút thứ
      nhất.
    clear: true
  - show: '<p>Câu 2:</p>

      $$45 < 60 \Rightarrow \hl{\text{từ chối}}; \qquad 75 \ge 60 \Rightarrow \hlg{\text{được
      nhận}}; \qquad 900 - 250 = \hlg{650}\ \text{giây}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu hai, giây bốn mươi lăm còn trong hạn nên bị từ chối, giây bảy
      mươi lăm quá hạn nên được nhận. Hạn danh sách đen là chín trăm trừ hai trăm
      năm mươi, tức sáu trăm năm mươi giây.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>(a)
      chỉ khoá Redis hạn 300 giây</td><td>nhanh; chặn sớm phần lớn lần bấm trùng</td><td>tiến
      trình dừng quá 300 giây, hoặc nút chính hỏng trước khi nút bản sao kịp nhận
      khoá, thì vẫn giải ngân hai lần</td></tr><tr><td>(b) chỉ ràng buộc duy nhất
      ở cơ sở dữ liệu</td><td>đúng tuyệt đối: lần ghi thứ hai bị từ chối</td><td>cả
      hai máy cùng gọi lõi ngân hàng rồi mới biết trùng; tốn tải, phải hoàn tác</td></tr><tr><td>(c)
      khoá Redis + ràng buộc duy nhất</td><td>khoá chặn sớm, cơ sở dữ liệu bảo đảm
      đúng</td><td>thêm một hệ phải vận hành; phải quyết định làm gì khi Redis hỏng</td></tr></table>'
    say: Đáp án câu ba, chỉ khoá Redis thì nhanh nhưng tiến trình dừng quá hạn vẫn
      giải ngân hai lần. Chỉ ràng buộc ở cơ sở dữ liệu thì đúng nhưng hai máy cùng
      gọi lõi ngân hàng rồi mới biết trùng. Dùng cả hai thì khoá chặn sớm, còn cơ
      sở dữ liệu bảo đảm.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: khe và nút trong cụm 4 nút, khử trùng hạn 90 giây, danh sách đen'
  steps:
  - show: '<p><b>Đề</b>: viết <code>mau.py</code> (Python, không cần Redis):</p>

