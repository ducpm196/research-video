    say: Đáp án câu ba, chỉ khoá Redis thì nhanh và chặn sớm, nhưng tiến trình dừng
      quá hạn, hoặc nút chính hỏng trước khi bản sao kịp nhận khoá, thì vẫn giải ngân
      hai lần. Chỉ ràng buộc ở cơ sở dữ liệu thì đúng tuyệt đối, nhưng cả hai máy
