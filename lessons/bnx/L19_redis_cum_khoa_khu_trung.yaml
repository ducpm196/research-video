      chỉ ràng buộc duy nhất ở cơ sở dữ liệu</td><td>đúng tuyệt đối: lần ghi thứ hai
      bị từ chối</td><td>cả hai máy cùng gọi lõi ngân hàng rồi mới biết trùng; tốn
      tải, phải hoàn tác</td></tr><tr><td>(c) khoá Redis + ràng buộc duy nhất</td><td>khoá
