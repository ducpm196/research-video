      lý lần hai</b></td><td>90 &lt; 120: từ chối</td></tr></table><p class=''note''>Cách
      chữa: hạn dài hơn khoảng thử lại dài nhất của bên gửi; và vẫn giữ ràng buộc
      duy nhất theo mã giao dịch ở cơ sở dữ liệu.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Lỗi thứ tư cũng của người đã đi làm, lộ ra khi đối tác đổi cách thử lại:
      hạn khử trùng ngắn hơn thời gian thử lại của bên gửi. Với số minh hoạ trong
      bảng, hạn sáu mươi giây mà bên gửi thử lại ở giây chín mươi, lúc đó mục đã hết
      nên yêu cầu được xử lý hai lần. Cách chữa là đặt hạn dài hơn khoảng thử lại
      dài nhất của bên gửi, và vẫn giữ ràng buộc duy nhất theo mã giao dịch ở cơ sở
      dữ liệu.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l19_crc16('hello') == 50018
  - 3 * 16384 == 49152 and 50018 - 49152 == 866 == alg.bnx_l19_slot('hello')
  - alg.bnx_l19_node(866) == 1
  - alg.bnx_l19_set_nx_ex([0, 45], 60) == ['OK', None]
  - alg.bnx_l19_set_nx_ex([0, 75], 60) == ['OK', 'OK']
  - alg.bnx_l19_bl_ttl(900, 250) == 650
  - alg.bnx_l19_lock_story(300, 301)[0] == 2
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>CRC16
      của khoá <code>hello</code> là 50018. Khoá này ở khe nào, và nút nào trong cụm
      ba nút 0–5460, 5461–10922, 10923–16383?</td></tr><tr><td>2</td><td>Mã giao dịch
      đặt hạn 60 giây ở giây 0. Bên gửi gửi lại ở giây 45 và giây 75: mỗi lần được
      nhận hay bị từ chối? Mã truy cập hạn 900 giây bị thu hồi ở giây 250: mục danh
      sách đen đặt hạn bao nhiêu?</td></tr><tr><td>3</td><td>Quyết định: chống giải
      ngân hai lần cho một hồ sơ bằng (a) chỉ khoá Redis hạn 300 giây, (b) chỉ ràng
      buộc duy nhất ở cơ sở dữ liệu, hay (c) cả hai?</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.4'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, kết quả băm của một khoá là năm
      mươi nghìn không trăm mười tám, hỏi khoá ở khe nào và nút nào trong cụm ba nút?
      Câu hai, mã giao dịch đặt hạn sáu mươi giây ở giây không, bên gửi gửi lại ở
      giây bốn mươi lăm và giây bảy mươi lăm, mỗi lần được nhận hay bị từ chối? Cũng
      trong câu hai, mã truy cập hạn chín trăm giây bị thu hồi ở giây hai trăm năm
      mươi, mục danh sách đen đặt hạn bao nhiêu? Câu ba, để chống giải ngân hai lần,
      bạn chọn chỉ khoá Redis, chỉ ràng buộc ở cơ sở dữ liệu, hay cả hai? Hãy dừng
      video lại và làm từng câu ra giấy trước khi xem đáp án.
  - show: '<p>Câu 1: $3 \cdot 16384 = 49152$.</p>

      $$50018 - 49152 = \hlg{866}; \qquad 0 \le 866 \le 5460 \Rightarrow \hlg{\text{nút
      thứ nhất}}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu một, ba lần mười sáu nghìn ba trăm tám mươi tư là bốn mươi chín
      nghìn một trăm năm mươi hai. Vì năm mươi nghìn không trăm mười tám trừ đi số
      đó còn tám trăm sáu mươi sáu, nên khoá ở khe tám trăm sáu mươi sáu, thuộc dải
      của nút thứ nhất.
    clear: true
  - show: '<p>Câu 2:</p>

      $$45 < 60 \Rightarrow \hl{\text{từ chối}}; \qquad 75 \ge 60 \Rightarrow \hlg{\text{được
      nhận}}; \qquad 900 - 250 = \hlg{650}\ \text{giây}$$

      '
    focus:
    - - 1
    - 2
    - 2
    say: Đáp án câu hai, giây bốn mươi lăm còn trong hạn sáu mươi giây nên bị từ chối.
      Giây bảy mươi lăm đã quá hạn nên được nhận như yêu cầu mới. Mã truy cập còn
      chín trăm trừ hai trăm năm mươi, bằng sáu trăm năm mươi giây, nên mục danh sách
      đen đặt hạn sáu trăm năm mươi giây.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>(a)
      chỉ khoá Redis hạn 300 giây</td><td>nhanh; chặn sớm phần lớn lần bấm trùng</td><td>tiến
      trình dừng quá 300 giây, hoặc nút chính hỏng trước khi nút bản sao kịp nhận
