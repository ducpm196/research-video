      quả chạy thật (trích)</b></p><div class="code"><div>x1: 200000 gd/ngay, tb 2.3/s,
      dinh 23/s</div><div>      0.1 GB/ngay, 1 nut ghi</div></div>'
    focus:
    - 1
    - 2
