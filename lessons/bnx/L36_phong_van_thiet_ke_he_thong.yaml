source: 'curriculum/bnx.yaml L36; audit/bnx/verify_bnx.py L36; audit/bnx/sources_l36.md:
  RFC 2119, RFC 9110 (§9.2.2, §15.5.10), Internet-Draft draft-ietf-httpapi-idempotency-key-header,
  hướng dẫn Stripe về yêu cầu lũy đẳng, PostgreSQL 17 (Transaction Isolation), Google
  SRE Book (Addressing Cascading Failures) (đọc 2026-11-14); mã Python 3 + sqlite3
  chạy thật; mọi số đầu vào (khách, giao dịch, hệ số đỉnh, sức một nút, tỉ lệ lỗi)
  là số minh hoạ'
assumes: []
objectives:
- Tính ước lượng giao dịch mỗi giây, dung lượng và số nút ghi ở cỡ ×1, ×100 và ×10
  000 bằng mã
- Thiết kế trung tâm thanh toán theo khung sáu bước và áp cùng khung cho hệ thống
  tín dụng
- Chạy khoá lũy đẳng và chỉ ra khác biệt khi gửi hai lần có và không có khoá
- Kiểm ước lượng bằng phân số và kiểm tổng tiền qua các lần gửi
- Đếm số lệnh lệch và giờ xử lý tay ở 1 000 và 100 000 lệnh
- Đọc 10 câu tiếng Anh kỹ thuật, áp bốn bước vào hai câu và chạy bộ lọc chữ báo mức
  ràng buộc trên cả 10 câu
- Chọn thành phần theo cỡ tải và nêu cái được, cái mất
- Viết chương trình ước lượng tải, chọn thành phần và khoá lũy đẳng trên số liệu mới
