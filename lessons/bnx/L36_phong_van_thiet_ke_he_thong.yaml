    say: Lỗi thứ nhất, của người mới, là vẽ hộp trước, ước lượng sau. Ở cỡ một đỉnh
      chỉ hai mươi ba giao dịch mỗi giây, nên một nút là đủ, còn một nút cho cỡ mười
      nghìn là sập.
