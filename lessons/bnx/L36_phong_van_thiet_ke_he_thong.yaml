- id: english
  kind: example
  title: 'Đọc hướng dẫn kỹ thuật tiếng Anh: 10 câu thật và cách tra từ'
  checks:
  - 1 + 1 + 2 + 6 == 10
  steps:
  - show: '<p><b>Bốn bước đọc một câu tiếng Anh kỹ thuật</b> (nguồn nghĩa của chữ
      viết hoa: RFC 2119):</p><table class=''t''><tr><th>bước</th><th>làm gì</th><th>ví
      dụ</th></tr><tr><td>1</td><td>tìm chữ viết hoa <b>MUST / SHOULD / MAY</b>: mức
      ràng buộc</td><td>MUST = &laquo;an absolute requirement&raquo;; MAY = &laquo;truly
      optional&raquo;</td></tr><tr><td>2</td><td>tìm động từ chính và danh từ lõi,
      bỏ phần phụ sau dấu phẩy</td><td><i>key MUST be unique</i> → khoá phải duy nhất</td></tr><tr><td>3</td><td>từ
      lạ: tra nghĩa kỹ thuật ngay trong bài, rồi mới tra từ điển</td><td><i>conflict</i>
      ở đây là xung đột trạng thái</td></tr><tr><td>4</td><td>kiểm bằng cách chạy
      thử một ví dụ nhỏ</td><td>gửi hai lần cùng khoá, xem số dư</td></tr></table>'
    focus:
    - 0
    - '2.2'
    - '2.3'
    - - '2.4'
      - '2.5'
    clear: true
    say: Có bốn bước đọc một câu tiếng Anh kỹ thuật. Một, tìm chữ viết hoa phải, nên
      hoặc có thể, vì đó là mức ràng buộc. Hai, tìm động từ chính và danh từ lõi.
      Ba, tra nghĩa kỹ thuật của từ lạ, bốn, chạy thử.
  - show: '<table class=''t''><tr><th>#</th><th>câu gốc (trích nguyên văn)</th><th>ý
      tiếng Việt</th></tr><tr><td>1</td><td><i>The 409 (Conflict) status code indicates
      that the request could not be completed due to a conflict with the current state
      of the target resource.</i> <small>(RFC 9110)</small></td><td>yêu cầu không
      làm xong được vì <b>xung đột với trạng thái hiện tại</b> của tài nguyên</td></tr><tr><td>2</td><td><i>An
      idempotency key is a unique value generated by the client which the resource
      uses to recognize subsequent retries of the same request.</i> <small>(draft-key)</small></td><td>khoá
      lũy đẳng: giá trị <b>duy nhất do khách sinh</b>, để máy chủ nhận ra các lần
      gửi lại</td></tr><tr><td>3</td><td><i>The idempotency key MUST be unique and
      MUST NOT be reused with another request with a different request payload.</i>
      <small>(draft-key)</small></td><td>khoá <b>phải</b> duy nhất và <b>cấm</b> dùng
      lại cho yêu cầu có nội dung khác</td></tr><tr><td>4</td><td><i>Retries with
      the same key return the saved response, including 500 errors.</i> <small>(Stripe
      (công ty thanh toán), API v1)</small></td><td>với API v1 của Stripe: gửi lại
      cùng khoá thì nhận <b>kết quả đã lưu</b>, kể cả lỗi 500</td></tr></table>'
    clear: true
    say: Đây là bốn câu thật đầu, trích từ tiêu chuẩn và hướng dẫn chính thức. Câu
      một và hai là định nghĩa, câu ba và bốn ta đọc kỹ ngay sau đây.
  - show: '<p><b>Áp bốn bước vào hai câu</b> (số 3 và số 4 ở bảng trên):</p><table
      class=''t''><tr><th>bước</th><th>câu 3 (bản nháp khoá lũy đẳng)</th><th>câu
      4 (Stripe, API v1)</th></tr><tr><td>1. chữ báo mức</td><td><i>MUST</i> và <i>MUST
      NOT</i>: bắt buộc và cấm</td><td>không có chữ viết hoa: câu mô tả</td></tr><tr><td>2.
      động từ chính, danh từ lõi</td><td><i>key MUST be unique</i>: khoá phải duy
      nhất; cấm dùng lại khi nội dung khác</td><td><i>retries return the saved response</i>:
      gửi lại thì trả kết quả đã lưu</td></tr><tr><td>3. từ lạ</td><td><i>payload</i>
      = nội dung yêu cầu</td><td><i>including 500 errors</i> = kể cả lỗi 500</td></tr><tr><td>4.
      chạy thử</td><td>cùng khoá K1, tiền 500: bị từ chối (đã chạy ở ví dụ khoá lũy
      đẳng)</td><td>cùng khoá K1, lần hai: bỏ qua, trả kết quả cũ (cũng đã chạy)</td></tr></table>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Ta áp bốn bước vào hai câu: câu ba có chữ phải và chữ cấm, nên khoá phải
      duy nhất và cấm dùng lại khi nội dung khác. Câu bốn không có chữ viết hoa nên
      chỉ mô tả việc trả kết quả đã lưu, và bước bốn ta đã chạy.'
  - show: '<table class=''t''><tr><th>#</th><th>câu gốc (trích nguyên văn)</th><th>ý
      tiếng Việt</th></tr><tr><td>5</td><td><i>For API v1, Stripe saves the status
      code and body of the first request made with a given idempotency key after endpoint
      execution begins.</i> <small>(Stripe (công ty thanh toán), API v1)</small></td><td>với
      API v1: lưu mã trạng thái và thân kết quả của yêu cầu <b>đầu tiên</b> có khoá
      đó, sau khi bắt đầu chạy</td></tr><tr><td>6</td><td><i>Read Committed is the
      default isolation level in PostgreSQL.</i> <small>(PostgreSQL)</small></td><td>mức
      cô lập <b>mặc định</b> của PostgreSQL là Read Committed (chỉ thấy dữ liệu đã
      chốt)</td></tr><tr><td>7</td><td><i>Applications using this level must be prepared
      to retry transactions due to serialization failures.</i> <small>(PostgreSQL)</small></td><td>ứng
      dụng dùng mức đang nói tới (Repeatable Read) <b>phải sẵn sàng</b> thử lại giao
      dịch khi gặp lỗi tuần tự hoá</td></tr></table>'
    introduces:
    - bnx_tuan_tu_hoa
    clear: true
    say: Câu năm nói lưu kết quả của yêu cầu đầu tiên. Câu sáu nói mức cô lập mặc
      định, tức mức quy định giao dịch này thấy gì của giao dịch khác. Câu bảy nói
      về lỗi tuần tự hoá, tức hai giao dịch cùng lúc không xếp được lần lượt.
  - show: '<table class=''t''><tr><th>#</th><th>câu gốc (trích nguyên văn)</th><th>ý
      tiếng Việt</th></tr><tr><td>8</td><td><i>Consider having a server-wide retry
      budget.</i> <small>(SRE (sách vận hành của Google))</small></td><td><b>nên cân
      nhắc</b> ngân sách thử lại cho cả máy chủ</td></tr><tr><td>9</td><td><i>The
      server SHOULD generate content that includes enough information for a user to
      recognize the source of the conflict.</i> <small>(RFC 9110)</small></td><td>máy
      chủ <b>nên</b> trả nội dung đủ thông tin để người dùng nhận ra nguồn xung đột</td></tr><tr><td>10</td><td><i>Of
      the request methods defined by this specification, PUT, DELETE, and safe request
      methods are idempotent.</i> <small>(RFC 9110)</small></td><td>PUT (ghi đè),
      DELETE (xoá) và các phương thức an toàn (chỉ đọc, như GET) đều <b>lũy đẳng</b>:
      làm nhiều lần cho kết quả như một lần</td></tr></table>'
    clear: true
    say: Câu tám là lời khuyên, câu chín có chữ nên viết hoa. Câu mười nói hai phương
      thức ghi đè và xoá cùng các phương thức chỉ đọc đều lũy đẳng, tức làm nhiều
      lần cho kết quả như một lần.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>re.search(mau,
      cau)</code></td><td>tìm trong câu chỗ khớp mẫu; có thì trả kết quả, không thì
      <code>None</code></td><td><code>re.search("MUST", "it MUST be")</code> có kết
      quả</td></tr><tr><td><code>\b</code></td><td>ranh giới từ: mẫu khớp cả từ, không
      khớp một mẩu trong từ khác</td><td><code>\bMAY\b</code> khớp <code>MAY</code>,
      không khớp <code>MAYBE</code></td></tr><tr><td><code>(?! NOT)</code></td><td>chỗ
      này không được theo sau bởi <code> NOT</code></td><td><code>MUST(?! NOT)</code>
      khớp <code>MUST be</code>, không khớp <code>MUST NOT</code></td></tr><tr><td><code>(Consider|should)</code></td><td>dấu
      <code>|</code> là &laquo;hoặc&raquo;, ngoặc tròn gom nhóm: khớp <code>Consider</code>
      hoặc <code>should</code></td><td><code>\b(Consider|should)\b</code> khớp <code>should</code>
      trong câu</td></tr></table>'
    clear: true
    say: Hàm tìm trả kết quả nếu câu khớp mẫu, không thì không có gì. Ranh giới từ
      làm mẫu khớp cả từ. Phép kiểm phủ định loại trường hợp chữ phải đi liền chữ
      cấm, dấu gạch đứng nghĩa là hoặc.
  - show: '<p><b>DocCau.py (trích 1/2): hai danh sách</b></p><div class="code"><div>MUC
      = [("MUST NOT", "cam tuyet doi"), ("MUST", "bat buoc"),</div><div>       ("SHOULD",
      "nen"), ("MAY", "tuy chon")]</div><div>TU = ["idempot", "payload", "retr", "conflict",
      "isolation",</div><div>      "serializ", "budget", "unique"]</div></div>'
    clear: true
    say: Hai danh sách ở đầu là bảng chữ báo mức với nghĩa, và các gốc từ cần để ý.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      tu, y in MUC:</code></td><td>mỗi vòng tách một cặp của <code>MUC</code>: <code>tu</code>
      là chữ báo mức, <code>y</code> là nghĩa</td><td><code>("SHOULD", "nen")</code>:
      <code>tu</code> là SHOULD, <code>y</code> là nen</td></tr><tr><td><code>r"\b"
      + tu + r"\b" + (r"(?! NOT)" if tu != "MAY" else "")</code></td><td>chuỗi <code>r"…"</code>
      giữ nguyên dấu <code>\</code>; <code>+</code> nối chuỗi thành mẫu; phần trong
      ngoặc là biểu thức điều kiện: thêm <code>(?! NOT)</code> trừ khi <code>tu</code>
      là MAY</td><td><code>tu = "MUST"</code> ra <code>\bMUST\b(?! NOT)</code></td></tr><tr><td><code>return
      muc or ["mo ta"]</code></td><td>trả <code>muc</code> nếu nó không rỗng, ngược
      lại trả danh sách <code>["mo ta"]</code></td><td></td></tr></table>'
    clear: true
    say: Mỗi vòng tách một cặp thành chữ báo mức và nghĩa. Dấu cộng nối các mẩu thành
      mẫu, biểu thức điều kiện thêm phép kiểm phủ định trừ chữ có thể. Trả danh sách
      mức nếu không rỗng, ngược lại trả mô tả.
  - show: '<p><b>DocCau.py (trích 2/2): bộ lọc chữ báo mức ràng buộc</b></p><div class="code"><div>def
      doc(cau):</div><div>    muc = []</div><div>    for tu, y in MUC:</div><div>        mau
      = r"\b" + tu + r"\b" + (r"(?! NOT)" if tu != "MAY" else "")</div><div>        if
      re.search(mau, cau):</div><div>            muc.append(y)</div><div>    if not
      muc and re.search(r"\bmust\b", cau):</div><div>        muc.append("bat buoc
      (van thuong)")</div><div>    if not muc and re.search(r"\b(Consider|should)\b",
      cau):</div><div>        muc.append("nen (van thuong)")</div><div>    return
      muc or ["mo ta"]</div><div> </div></div>'
    clear: true
    say: 'Ta kiểm bước một bằng mã: hàm tìm chữ viết hoa báo mức, và chữ phải không
      đứng trước chữ cấm để khỏi đếm hai lần.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1 RFC 9110: mo ta
      | conflict</div><div>2 draft-key: mo ta | idempot,retr,unique</div><div>3 draft-key:
      cam tuyet doi + bat buoc | idempot,payload,unique</div><div>4 Stripe: mo ta
      | retr</div><div>5 Stripe: mo ta | idempot</div><div>6 PostgreSQL: mo ta | isolation</div><div>7
      PostgreSQL: bat buoc (van thuong) | retr,serializ</div><div>8 SRE: nen (van
      thuong) | retr,budget</div><div>9 RFC 9110: nen | conflict</div><div>10 RFC
      9110: mo ta | idempot</div></div>$$⑤ \; 10 = \hl{1} \text{ (cấm + bắt buộc)}
      + \hl{1} \text{ bắt buộc} + \hl{2} \text{ nên} + \hl{6} \text{ mô tả}$$<p>Cột
      sau dấu <code>|</code> là gốc từ có trong câu: <code>idempot</code> (lũy đẳng),
      <code>retr</code> (thử lại), <code>unique</code> (duy nhất)…</p>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Kết quả thật: câu ba vừa bắt buộc vừa cấm tuyệt đối, câu bảy bắt buộc, câu
      tám và chín là nên, sáu câu còn lại chỉ mô tả. Cột bên phải liệt kê gốc từ khoá
      tìm thấy trong mỗi câu.'
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
