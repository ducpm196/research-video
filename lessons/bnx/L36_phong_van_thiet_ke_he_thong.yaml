scenes:
- id: hook
  kind: hook
  title: 'Ứng viên A vẽ mười hộp, ứng viên B hỏi trước: ai đúng?'
  checks:
  - alg.bnx_l36_tb(100000, 2, 1) == 2.3 and alg.bnx_l36_dinh(100000, 2, 100, 1) ==
    231
  - alg.bnx_l36_dinh(100000, 2, 10000, 1) == 23148
  steps:
  - show: '<p>Câu hỏi phỏng vấn: &laquo;Thiết kế một <b>trung tâm thanh toán</b> cho
      ngân hàng&raquo;. Ứng viên A vẽ ngay mười hộp. Ứng viên B hỏi trước: bao nhiêu
      khách, bao nhiêu giao dịch, mất tiền thì sao?</p>

      <div class="box key">Số minh hoạ: 100 000 khách, mỗi khách 2 giao dịch mỗi ngày:
      trung bình chỉ <b>2,3 giao dịch mỗi giây</b>. Nhân 100 lần: trung bình <b>231</b>.
      Nhân 10 000 lần: trung bình <b>23 148</b>.

      Và một khách bấm hai lần vì mạng chậm: có bị <b>trừ tiền hai lần</b> không?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: 'Chào bạn, câu hỏi phỏng vấn là thiết kế một trung tâm thanh toán. Ứng viên
      A vẽ ngay mười hộp, ứng viên B hỏi trước: bao nhiêu khách, bao nhiêu giao dịch,
      mất tiền thì sao? Số minh hoạ: một trăm nghìn khách, mỗi khách hai giao dịch
      mỗi ngày, trung bình hai phẩy ba giao dịch mỗi giây. Nhân một trăm lần, trung
      bình là hai trăm ba mươi mốt, nhân mười nghìn lần là hơn hai mươi ba nghìn.
      Khách bấm hai lần có bị trừ hai lần không?'
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>thiết
      kế theo thứ tự nào</td><td>khung <b>sáu bước</b>: yêu cầu → ước lượng → giao
      diện → dữ liệu → thất bại → mở rộng</td></tr><tr><td>tải lớn dần thì sao</td><td>số
      ước lượng ở <b>×1, ×100, ×10 000</b>, tính bằng mã</td></tr><tr><td>gửi hai
      lần, hỏng giữa chừng thì sao</td><td><b>khoá lũy đẳng</b> và <b>đối soát</b></td></tr><tr><td>đọc
      hướng dẫn kỹ thuật tiếng Anh</td><td><b>10 câu thật</b> và cách tra từ</td></tr></table>'
    clear: true
    say: 'Bài này trả lời bốn câu: thiết kế theo thứ tự nào, tải lớn dần thì sao,
      hỏng giữa chừng thì sao, đọc tiếng Anh thế nào.'
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l36_gd(100000, 2, 1) == 200000
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      trung tâm thanh toán</td><td>điểm trung gian nhận lệnh chuyển tiền, ghi sổ và
      chuyển tiếp sang ngân hàng hoặc đối tác</td><td>ứng dụng → trung tâm → ngân
      hàng B</td></tr><tr><td>② hệ thống tín dụng</td><td>chuỗi bước hồ sơ vay: khởi
      tạo, thẩm định, duyệt, giải ngân; mỗi bước ghi nhật ký</td><td>hồ sơ đổi trạng
      thái theo bảng luật</td></tr><tr><td>③ giao dịch mỗi giây</td><td>tải trung
      bình = số giao dịch một ngày : 86 400; <b>đỉnh</b> = trung bình × hệ số đỉnh</td><td>200
      000 : 86 400 ≈ 2,3</td></tr><tr><td>④ khoá lũy đẳng</td><td>mã duy nhất của
      một yêu cầu; gửi lại cùng mã thì chỉ làm <b>một lần</b></td><td>bấm hai lần
      vẫn trừ một lần</td></tr><tr><td>⑤ đối soát</td><td>so hai sổ để tìm lệnh lệch
      rồi xử lý</td><td>A đã trừ, B chưa cộng</td></tr></table>'
    say: Trước hết ta cần hiểu năm điều, trung tâm thanh toán là điểm trung gian nhận
      lệnh chuyển tiền, ghi sổ và chuyển tiếp. Hệ thống tín dụng là chuỗi bước của
      hồ sơ vay. Tải trung bình bằng giao dịch một ngày chia tám mươi sáu nghìn bốn
      trăm giây, đỉnh là trung bình nhân hệ số đỉnh. Khoá lũy đẳng là mã duy nhất
      của một yêu cầu, đối soát là so hai sổ tìm lệnh lệch.
- id: sym
  kind: symbol
  title: Giải mã các chữ trên màn hình
  checks:
  - alg.bnx_l36_gd(100000, 2, 100) == 20000000
  steps:
  - show: '<table class=''t''><tr><th>chữ</th><th>nghĩa</th></tr><tr><td><code>x1</code>,
      <code>x100</code>, <code>x10000</code></td><td>cùng số khách nhân với 1, 100,
      10 000: xem thiết kế còn đúng không khi lớn dần</td></tr><tr><td><code>gd/s</code>,
      <code>tb</code>, <code>dinh</code></td><td>giao dịch mỗi giây; trung bình; đỉnh</td></tr><tr><td><code>RFC</code></td><td>bản
      tiêu chuẩn kỹ thuật của Internet, mỗi bản một số, như RFC 9110 cho HTTP</td></tr><tr><td><code>MUST</code>,
      <code>SHOULD</code>, <code>MAY</code></td><td>chữ viết hoa trong tiêu chuẩn:
      <b>phải</b>, <b>nên</b>, <b>có thể</b>; thêm NOT là cấm</td></tr></table>'
    say: 'Bảng này giải mã các chữ trên màn hình: x một, x một trăm, x mười nghìn
      là cùng số khách nhân với từng hệ số. Chữ RFC là bản tiêu chuẩn kỹ thuật, và
      chữ viết hoa trong đó nghĩa là phải, nên, hoặc có thể.'
  - show: '<table class=''t''><tr><th>chữ</th><th>nghĩa</th></tr><tr><td><code>409</code>,
      <code>422</code></td><td>mã HTTP: mỗi trả lời của máy chủ web kèm một mã ba
      chữ số, như 200 là thành công. 409 báo xung đột với trạng thái hiện tại (như
      yêu cầu cùng khoá còn đang xử lý dở); 422 báo không xử lý được nội dung (như
      cùng khoá nhưng nội dung khác)</td></tr><tr><td>API, cổng API</td><td>API: cách
      một chương trình nhờ chương trình khác làm việc, bằng yêu cầu và trả lời; <code>API
      v1</code> là phiên bản một. <b>Cổng API</b>: cửa chung mọi yêu cầu từ ngoài
      đi qua trước khi vào các dịch vụ</td></tr></table>'
    clear: true
    say: 'Trả lời của máy chủ web kèm mã ba chữ số: bốn trăm linh chín báo xung đột,
      bốn trăm hai mươi hai báo nội dung không xử lý được. Cổng API là cửa chung mọi
      yêu cầu từ ngoài.'
