    say: 'Giả định, số minh hoạ: cứ năm trăm lệnh thì một lệnh ghi nợ xong mà ghi
      có hỏng, mỗi lệnh lệch mất mười phút xử lý tay. Một nghìn lệnh có hai lệch,
      tức không phẩy ba giờ; một trăm nghìn lệnh có hai trăm lệch, tức ba mươi ba
      phẩy ba giờ.'
  - show: '<table class=''t''><tr><th>cách xử lý lệch</th><th>được</th><th>mất</th><th>chọn
      khi</th></tr><tr><td>xử lý tay từng lệnh</td><td>không cần viết mã</td><td>33,3
      giờ ở cỡ 10⁵ lệnh</td><td>cỡ nhỏ, vài lệnh mỗi ngày</td></tr><tr><td>đối soát
      tự động rồi đưa ngoại lệ cho người</td><td>người chỉ xem ca khó</td><td>phải
      có mã chung hai bên, phải kiểm bộ đối soát</td><td>tải lớn, tỉ lệ lỗi thấp nhưng
