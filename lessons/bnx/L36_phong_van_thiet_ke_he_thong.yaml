- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l36_tb(300000, 3, 1) == 10.4 and alg.bnx_l36_gd(300000, 3, 1) * 6 / 86400
    == 62.5
  - alg.bnx_l36_nut(300000, 3, 1, 6, 1500) == 1
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>300
      000 khách, mỗi khách 3 giao dịch mỗi ngày, hệ số đỉnh 6, một nút chịu 1 500
      giao dịch mỗi giây. Trung bình, đỉnh và số nút? (1 chữ số thập phân)</td></tr><tr><td>2</td><td>Hai
      yêu cầu cùng khoá nhưng số tiền khác nhau. Máy chủ nên làm gì, và vì sao?</td></tr><tr><td>3</td><td>Ngân
      hàng B hết giờ sau khi A đã bị trừ. Chọn: hoàn tác A ngay, thử lại có lùi, hay
      đánh dấu chờ đối soát? Vì sao?</td></tr></table>'
    pause: 40
    say: 'Đến lượt bạn, ba câu. Câu một: ba trăm nghìn khách, mỗi khách ba giao dịch
      mỗi ngày, hệ số đỉnh sáu, một nút chịu một nghìn năm trăm giao dịch mỗi giây;
      tính trung bình, đỉnh và số nút. Câu hai: cùng khoá nhưng số tiền khác thì làm
      gì? Câu ba: ngân hàng B hết giờ sau khi A đã bị trừ thì chọn gì? Hãy dừng lại
      làm ra giấy.'
  - show: '<p>Câu 1: giao dịch mỗi ngày = khách × giao dịch mỗi khách.</p>

      $$900\,000 : 86\,400 \approx \hlg{10{,}4}; \quad \text{đỉnh} = 10{,}4167 \times
      6 \approx \hlg{62{,}5}; \quad 62{,}5 : 1\,500 \approx 0{,}04 \to \hlg{1} \text{
      nút (làm tròn lên)}$$

      <p class="note">Nhân từ số chưa làm tròn (10,4167) ra 62,5; nhân từ 10,4 đã
      làm tròn ra 62,4.</p>

      '
    focus:
    - - 1
      - 2
    - 3
    say: 'Đáp án câu một, chín trăm nghìn giao dịch chia tám mươi sáu nghìn bốn trăm
      cho mười phẩy bốn mỗi giây. Nhân sáu từ số chưa làm tròn được đỉnh sáu mươi
      hai phẩy năm, chia một nghìn năm trăm rồi làm tròn lên: một nút.'
    clear: true
  - show: <table class='t'><tr><th>lựa chọn</th><th>kết luận</th><th>vì sao</th></tr><tr><td>xử
      lý lần hai</td><td>từ chối, mã 422</td><td>cùng khoá phải là cùng một việc;
      khác nội dung nghĩa là khách nhầm hoặc có lỗi, làm theo lần nào cũng có thể
      sai</td></tr><tr><td>trả kết quả lần một</td><td>không nên</td><td>khách tưởng
      lệnh mới đã được làm</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    say: Đáp án câu hai, máy chủ nên từ chối với mã bốn trăm hai mươi hai, vì cùng
      khoá phải là cùng một việc mà khác nội dung nghĩa là khách nhầm. Trả kết quả
      lần một thì khách tưởng lệnh mới đã làm.
    clear: true
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hoàn
      tác A ngay</td><td>nhanh, gọn</td><td>B có thể đã ghi có: mất tiền hai đầu</td></tr><tr><td>thử
      lại có lùi, kèm khoá lũy đẳng bên B</td><td>an toàn nếu B nhận khoá</td><td>chậm;
      cần giới hạn số lần</td></tr><tr><td>đánh dấu chờ đối soát</td><td>không bao
      giờ đoán bừa</td><td>khách chờ lâu hơn</td></tr></table>'
    say: Đáp án câu ba, hoàn tác A ngay thì nhanh nhưng B có thể đã ghi có, mất tiền
      hai đầu. Thử lại có lùi kèm khoá lũy đẳng thì an toàn nhưng chậm. Chờ đối soát
      thì không đoán bừa nhưng khách chờ lâu. Hợp lý là thử lại có giới hạn rồi chờ
      đối soát.
    clear: true
