- id: formula
  kind: formula
  title: 'Suy ra từng bước: khung sáu bước cho trung tâm thanh toán'
  checks:
  - alg.bnx_l36_nut(100000, 2, 1, 10, 2000) == 1 and alg.bnx_l36_nut(100000, 2, 100,
    10, 2000) == 2 and alg.bnx_l36_nut(100000, 2, 10000, 10, 2000) == 116
  steps:
  - show: <p><b>Bước 1. Yêu cầu.</b> Hỏi ba nhóm trước khi vẽ:</p><table class='t'><tr><th>nhóm</th><th>ví
      dụ cho trung tâm thanh toán</th></tr><tr><td>chức năng</td><td>nhận lệnh chuyển
      tiền, chuyển sang ngân hàng, tra trạng thái lệnh</td></tr><tr><td>phi chức năng</td><td>không
      mất tiền, không trừ hai lần, chậm tối đa bao lâu, kiểm toán được</td></tr><tr><td>ràng
      buộc</td><td>bao nhiêu khách, mấy giao dịch mỗi khách, tải đỉnh gấp mấy lần
      trung bình</td></tr></table>
    focus:
    - 0
    - '2.2'
    - '2.3'
    - '2.4'
    clear: true
    say: 'Bước một là yêu cầu: ta hỏi ba nhóm trước khi vẽ, vì yêu cầu sai thì thiết
      kế đẹp mấy cũng vô ích. Chức năng là nhận lệnh, chuyển đi, tra trạng thái. Phi
      chức năng là không mất tiền, không trừ hai lần. Ràng buộc là số khách, giao
      dịch mỗi khách, hệ số đỉnh.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>KHACH,
      GD_KHACH, DINH = 100_000, 2, 10</code></td><td>gán nhiều biến một lúc, theo
      thứ tự: <code>KHACH</code> là 100000, <code>GD_KHACH</code> là 2, <code>DINH</code>
      là 10; dấu gạch dưới trong số chỉ để dễ đọc</td><td></td></tr><tr><td><code>import
      math</code>, <code>math.ceil(x)</code>, <code>10**9</code></td><td>nạp thư viện
      toán; <code>ceil</code> làm tròn <b>lên</b> số nguyên (<code>ceil(2.1)</code>
      ra 3); <code>**</code>: lũy thừa, <code>10**9</code> là một tỉ</td><td></td></tr><tr><td><code>for
      he_so in (1, 100, 10_000):</code></td><td>mỗi vòng <code>he_so</code> nhận một
      giá trị trong dãy; các dòng thụt vào là thân vòng</td><td></td></tr><tr><td><code>{tb:.1f}</code>,
      <code>{dinh:.0f}</code></td><td>trong chuỗi f: <code>:.1f</code> giữ 1 chữ số
      sau dấu chấm thập phân, <code>:.0f</code> không giữ chữ số nào, làm tròn thành
      số nguyên</td><td><code>2.314</code> với <code>:.1f</code> in <code>2.3</code></td></tr></table>'
    clear: true
    say: Mã có chỗ lạ nên ta đọc trước. Gán nhiều biến một lúc, gạch dưới trong số
      chỉ để dễ đọc. Hàm làm tròn lên cho số nguyên, hai dấu sao là lũy thừa. Vòng
      lặp cho biến nhận lần lượt từng giá trị. Đuôi chấm một f giữ một chữ số thập
      phân, chấm không f làm tròn thành số nguyên.
  - show: '<p><b>Bước 2a. Số đầu vào</b> (số minh hoạ, giả định) nằm ở đầu mã:</p><p><b>UocLuong.py
      (trích): hằng số</b></p><div class="code"><div>import math</div><div> </div><div>#
      so minh hoa: 100000 khach, 2 gd/khach/ngay, he so dinh 10</div><div># moi giao
      dich 500 byte; moi nut ghi chiu 2000 gd/s (gia dinh)</div><div>KHACH, GD_KHACH,
      DINH = 100_000, 2, 10</div><div>BYTE, NUT = 500, 2000</div></div><table class=''t''><tr><th>tên</th><th>nghĩa</th><th>giá
      trị</th></tr><tr><td><code>KHACH</code>, <code>GD_KHACH</code></td><td>số khách;
      giao dịch mỗi khách mỗi ngày</td><td>100 000; 2</td></tr><tr><td><code>DINH</code></td><td>hệ
      số đỉnh: lúc đông nhất gấp mấy lần trung bình</td><td>10</td></tr><tr><td><code>BYTE</code>,
      <code>NUT</code></td><td>byte mỗi giao dịch; giao dịch mỗi giây một nút ghi
      chịu được</td><td>500; 2 000</td></tr></table>'
    focus:
    - 1
    - 3
    clear: true
    say: Số minh hoạ nằm ở đầu mã nên mọi số sau tính từ đây. Một trăm nghìn khách,
      hai giao dịch mỗi khách, hệ số đỉnh mười, năm trăm byte mỗi giao dịch, hai nghìn
      giao dịch mỗi giây cho một nút.
  - show: '<p><b>Bước 2. Ước lượng.</b> Giao dịch mỗi giây = giao dịch mỗi ngày :
      86 400; đỉnh = trung bình × hệ số đỉnh; số nút = làm tròn lên (đỉnh : sức một
      nút).</p><p><b>UocLuong.py (trích)</b></p><div class="code"><div>for he_so in
      (1, 100, 10_000):</div><div>    gd = KHACH * he_so * GD_KHACH</div><div>    tb
      = gd / 86_400</div><div>    dinh = tb * DINH</div><div>    gb = gd * BYTE /
      10**9</div><div>    nut = math.ceil(dinh / NUT)</div><div>    print(f"x{he_so}:
      {gd} gd/ngay, tb {tb:.1f}/s, dinh {dinh:.0f}/s")</div><div>    print(f"      {gb:.1f}
      GB/ngay, {nut} nut ghi")</div></div>$$200\,000 : 86\,400 \approx \hl{2{,}3}
      \text{ giao dịch mỗi giây}$$'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Bước hai là ước lượng, giao dịch mỗi giây bằng giao dịch mỗi ngày chia tám
      mươi sáu nghìn bốn trăm, vì một ngày có chừng ấy giây. Đỉnh bằng trung bình
      nhân hệ số đỉnh, và số nút bằng đỉnh chia sức một nút, làm tròn lên.
  - show: '<p><b>Bước 3. Giao diện.</b> Một lệnh chuyển tiền gửi kèm <b>khoá lũy đẳng</b>;
      bốn kết quả khác nhau:</p><table class=''t''><tr><th>tình huống</th><th>trả
      về</th></tr><tr><td>khoá mới</td><td>làm, lưu kết quả, trả <code>200</code></td></tr><tr><td>cùng
      khoá, cùng nội dung</td><td>không làm lại, trả kết quả đã lưu</td></tr><tr><td>cùng
      khoá, yêu cầu trước còn đang xử lý</td><td>báo xung đột: mã <code>409</code></td></tr><tr><td>cùng
      khoá, nội dung khác</td><td>từ chối: bản nháp tiêu chuẩn của IETF (tổ chức soạn
      tiêu chuẩn Internet) nêu mã <code>422</code></td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: 'Bước ba là giao diện: lệnh chuyển tiền kèm khoá lũy đẳng có bốn kết quả.
      Khoá mới thì làm, lưu kết quả rồi trả hai trăm; cùng khoá cùng nội dung thì
      trả kết quả đã lưu. Yêu cầu trước đang xử lý dở thì báo xung đột, mã bốn trăm
      linh chín. Cùng khoá nhưng nội dung khác thì từ chối, mã bốn trăm hai mươi hai,
      vì khách có thể nhầm khoá.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>with
      db:</code> … <code>return "da chuyen"</code></td><td>khối giao dịch: các lệnh
      thụt vào bên trong cùng thành công thì được chốt, một lệnh lỗi thì tất cả bị
      hoàn tác</td><td></td></tr><tr><td><code>db.execute("SELECT … WHERE khoa = ?",
      (khoa,)).fetchone()</code></td><td>chạy câu hỏi SQL tìm dòng có khoá đó; <code>?</code>
      được thay bằng giá trị trong bộ <code>(khoa,)</code>; <code>fetchone()</code>
      lấy một dòng, không có thì <code>None</code></td><td></td></tr><tr><td><code>INSERT
      INTO yeu_cau VALUES (?, …)</code>, <code>UPDATE tk SET so_du = so_du - ? WHERE
      ma = ?</code></td><td><code>INSERT</code> thêm một dòng mới; <code>UPDATE …
      SET … WHERE</code> sửa cột của các dòng có <code>ma</code> khớp</td><td><code>so_du
      - 300</code>: A còn 700</td></tr></table>'
    clear: true
    say: Mã dữ liệu có chỗ lạ nên ta đọc trước. Khối giao dịch chốt cả nhóm lệnh nếu
      thành công, lỗi thì hoàn tác cả nhóm. Câu hỏi SQL tìm dòng có khoá, dấu hỏi
      nhận giá trị cho trước. Một lệnh thêm dòng mới, một lệnh sửa cột của các dòng
      khớp.
  - show: '<p><b>Bước 4. Dữ liệu.</b> Bảng <code>yeu_cau</code> có khoá <b>duy nhất</b>
      và sổ cái ghi cùng một <b>giao dịch cơ sở dữ liệu</b>: hoặc cả hai, hoặc không
      gì cả.</p><p><b>KhoaLuyDang.py (1/2): tra khoá trước</b></p><div class="code"><div>def
      chuyen(db, khoa, tu, den, tien):</div><div>    with db:</div><div>        if
      khoa is not None:</div><div>            sql = "SELECT tu, den, tien FROM yeu_cau
      WHERE khoa = ?"</div><div>            cu = db.execute(sql, (khoa,)).fetchone()</div><div>            if
      cu == (tu, den, tien):</div><div>                return "trung khoa, bo qua"</div><div>            if
      cu:</div><div>                return "422: cung khoa, noi dung khac"</div></div>'
    focus:
    - - 1
      - 2
    - 3
    introduces:
    - bnx_giao_dich_csdl
    clear: true
    say: Bước bốn là dữ liệu, giao dịch cơ sở dữ liệu là một nhóm lệnh mà hoặc cả
      nhóm thành công, hoặc không lệnh nào có hiệu lực. Hàm tra khoá trước nên cùng
      khoá cùng nội dung thì bỏ qua, khác nội dung thì từ chối.
  - show: '<p><b>KhoaLuyDang.py (2/2): lưu khoá, trừ A, cộng B</b></p><div class="code"><div>            db.execute("INSERT
      INTO yeu_cau VALUES (?, ?, ?, ?)",</div><div>                       (khoa, tu,
      den, tien))</div><div>        db.execute("UPDATE tk SET so_du = so_du - ? WHERE
      ma = ?",</div><div>                   (tien, tu))</div><div>        db.execute("UPDATE
      tk SET so_du = so_du + ? WHERE ma = ?",</div><div>                   (tien,
      den))</div><div>    return "da chuyen"</div></div><p>Cả bốn lệnh nằm trong cùng
      khối <code>with db:</code>: nếu một lệnh lỗi thì không lệnh nào có hiệu lực.</p>'
    clear: true
    say: Khoá chưa có thì lưu khoá, trừ tiền A rồi cộng tiền B trong cùng một giao
      dịch, vì tách ra thì có lúc đã lưu khoá mà chưa ghi sổ.
  - show: <p><b>Bước 5. Thất bại.</b> Mỗi chỗ hỏng một cách chữa:</p><table class='t'><tr><th>chỗ
      hỏng</th><th>cách chữa</th><th>điều kiện</th></tr><tr><td>mạng chậm, khách gửi
      lại</td><td>khoá lũy đẳng</td><td>giữ khoá đủ lâu</td></tr><tr><td>ghi nợ xong,
      ghi có lỗi</td><td>trạng thái <code>CHO_DOI_SOAT</code>, đối soát tự động</td><td>hai
      bên có mã chung</td></tr><tr><td>đối tác ngừng</td><td>hàng đợi, thử lại có
      lùi, cầu dao</td><td>thử lại chỉ với lệnh có khoá lũy đẳng</td></tr></table>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước năm là thất bại, vì mỗi chỗ hỏng cần một cách chữa riêng. Mạng chậm
      thì dùng khoá lũy đẳng, ghi nợ xong mà ghi có lỗi thì đối soát tự động. Đối
      tác ngừng thì xếp lệnh vào hàng đợi, thử lại có lùi, tức khoảng chờ dài dần,
      và cầu dao tự ngắt cuộc gọi tới đối tác hỏng.
  - show: <p><b>Bước 6. Mở rộng và đánh đổi.</b> Số ở bước hai quyết định chọn gì:</p><table
      class='t'><tr><th>cỡ</th><th>chọn</th><th>được</th><th>mất</th></tr><tr><td>×1</td><td>một
      nút + một cơ sở dữ liệu</td><td>đơn giản, rẻ</td><td>một nút hỏng là ngừng</td></tr><tr><td>×100</td><td>nhóm
      nút + bản sao đọc</td><td>chịu tải, đọc nhanh</td><td>bản sao đọc chậm một nhịp</td></tr><tr><td>×10
      000</td><td>chia theo khoá + hàng đợi</td><td>tải chia đều</td><td>giao dịch
      chéo nhiều phần phức tạp hơn</td></tr></table>
    focus:
    - 0
    - '2.2'
    - '2.3'
    - '2.4'
    introduces:
    - bnx_ban_sao_doc
    - bnx_chia_theo_khoa
    clear: true
    say: 'Bước sáu là mở rộng, và số ở bước hai quyết định chọn gì. Cỡ một: một nút
      cùng một cơ sở dữ liệu là đủ. Cỡ một trăm: nhóm nút cùng bản sao chỉ để đọc.
      Cỡ mười nghìn: chia dữ liệu theo mã tài khoản cho từng nhóm nút, đổi lại giao
      dịch chéo phức tạp hơn.'
  - show: <p><b>Cùng khung cho hệ thống tín dụng:</b></p><table class='t'><tr><th>bước</th><th>hệ
      thống tín dụng (số minh hoạ)</th></tr><tr><td>yêu cầu</td><td>hồ sơ không mất;
      ai duyệt theo bậc; tra lịch sử có đồng ý</td></tr><tr><td>ước lượng</td><td>ít
      hồ sơ nhưng mỗi hồ sơ tra nhiều dòng lịch sử</td></tr><tr><td>giao diện</td><td>tạo
      hồ sơ, chuyển trạng thái kèm phiên bản</td></tr><tr><td>dữ liệu</td><td>bảng
      luật cạnh, nhật ký chuyển, chỉ mục theo mã khách</td></tr><tr><td>thất bại</td><td>hai
      người cùng duyệt; ghi kèm điều kiện trạng thái cũ</td></tr><tr><td>mở rộng</td><td>chỉ
      mục trước, rồi chia theo khách</td></tr></table>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Cùng khung này dùng cho hệ thống tín dụng: hồ sơ không mất, ít hồ sơ nhưng
      nhiều dòng lịch sử. Giao diện và dữ liệu chuyển trạng thái kèm phiên bản, có
      bảng luật và chỉ mục. Thất bại là hai người cùng duyệt, mở rộng là chia theo
      khách.'
- id: example
  kind: example
  title: Ví dụ chạy thật, từng phép tính
  checks:
  - alg.bnx_l36_gb(100000, 2, 100, 500) == 10.0 and alg.bnx_l36_gb(100000, 2, 10000,
    500) == 1000.0
  - 1000 - 2 * 300 == 400 and 1000 - 300 == 700
  steps:
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>x1: 200000 gd/ngay,
      tb 2.3/s, dinh 23/s</div><div>      0.1 GB/ngay, 1 nut ghi</div><div>x100: 20000000
      gd/ngay, tb 231.5/s, dinh 2315/s</div><div>      10.0 GB/ngay, 2 nut ghi</div><div>x10000:
      2000000000 gd/ngay, tb 23148.1/s, dinh 231481/s</div><div>      1000.0 GB/ngay,
      116 nut ghi</div></div>$$① \; \times 1 \to 23; \;\; \times 100 \to 2\,315; \;\;
      \times 10\,000 \to \hl{231\,481} \text{ giao dịch mỗi giây ở đỉnh}$$'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: 'Phép tính thứ nhất là ước lượng ở ba cỡ. Cỡ một: đỉnh hai mươi ba mỗi giây,
      một nút. Cỡ một trăm: đỉnh hai nghìn ba trăm mười lăm, hai nút. Cỡ mười nghìn:
      đỉnh hơn hai trăm ba mươi nghìn, một trăm mười sáu nút.'
  - show: '<p><b>KhoaLuyDang.py (trích): thử gửi hai lần</b></p><div class="code"><div>db
      = tao_hub()</div><div>for _ in range(2):</div><div>    chuyen(db, None, "A",
      "B", 300)</div><div>print("khong khoa, gui 2 lan:", so_du(db))</div><div>db
      = tao_hub()</div><div>for lan in (1, 2):</div><div>    print(f"co khoa K1, lan
      {lan}:", chuyen(db, "K1", "A", "B", 300))</div><div>print("so du:", so_du(db))</div><div>print("cung
      khoa K1, 500:", chuyen(db, "K1", "A", "B", 500))</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ hai là khoá lũy đẳng. Tài khoản A có một nghìn, B có không.
      Ta gửi hai lần lệnh chuyển ba trăm không có khoá, rồi hai lần cùng khoá K một,
      rồi lại khoá đó với năm trăm.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>khong khoa, gui 2
      lan: {''A'': 400, ''B'': 600}</div><div>co khoa K1, lan 1: da chuyen</div><div>co
      khoa K1, lan 2: trung khoa, bo qua</div><div>so du: {''A'': 700, ''B'': 300}</div><div>cung
      khoa K1, 500: 422: cung khoa, noi dung khac</div></div>$$② \; \text{không khoá:
      } 1000 - 2 \times 300 = \hl{400}; \quad \text{có khoá: } 1000 - 300 = \hl{700}$$'
    focus:
    - - 1
    - 2
    - 3
    clear: true
    say: Kết quả thật, không có khoá thì gửi hai lần bị trừ hai lần, A còn bốn trăm.
      Có khoá thì lần hai bị bỏ qua, A còn bảy trăm. Cùng khoá mà tiền khác thì bị
      từ chối, mã bốn trăm hai mươi hai.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: phân số và tổng tiền'
  checks:
  - round(125 / 54, 4) == 2.3148
  steps:
  - show: '<p><b>KiemCanBang.py: phân số, không dùng phép chia số thực của chương
      trình trước</b></p><div class="code"><div>from fractions import Fraction as
      F</div><div> </div><div>tb = F(100_000 * 2, 86_400)</div><div>print(f"tb {tb}
      = {float(tb):.4f} gd/s; dinh {float(tb * 10):.4f}")</div><div>for ten, a, b
      in (("dau", 1000, 0), ("1 lan", 700, 300),</div><div>                  ("2 lan
      sai", 400, 600)):</div><div>    print(f"tong tien {ten}: {a + b}")</div></div>'
    clear: true
