- id: formula
  kind: formula
  title: 'Suy ra từng bước: ký và kiểm một JWT'
  checks:
  - alg.bnx_exp_ok(1300819380, 1300819379)
  - not alg.bnx_exp_ok(1300819380, 1300819380)
  - alg.bnx_risk_window(300, 60) == 240
  - alg.bnx_jwt_sign(alg.bnx_jwt_rfc7515()[0], alg.bnx_jwt_rfc7515()[1].replace(b'1300',
    b'9300'), alg.bnx_jwt_rfc7515()[2]).split('.')[2] != alg.bnx_jwt_part(2)
  - b'\r\n' in alg.bnx_jwt_rfc7515()[1]
  - alg.bnx_jwt_check(alg.bnx_b64u(b'{"alg":"none"}') + '.' + alg.bnx_jwt_part(1)
    + '.', alg.bnx_jwt_rfc7515()[2], 'api-a', 0) == 'thuật toán lạ'
  steps:
  - show: '<p><b>Bước 1.</b> Mã nằm trong điện thoại của khách, nên ai cũng có thể
      sửa nó. Cần một dấu mà <b>chỉ máy chủ</b> làm ra được:

      chữ ký = HMAC(k, “đầu.thân”).</p>

      $$\text{sửa } 1300819380 \to 9300819380 \;\Rightarrow\; \text{phần thân đổi}
      \;\Rightarrow\; \text{chữ ký đúng đổi theo}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, vì mã nằm trong điện thoại của khách nên ai cũng sửa được. Ta cần
      một dấu chỉ máy chủ làm ra được, là HMAC của chuỗi đầu chấm thân với khoá k.
      Làm thử, đổi một chữ số của hạn dùng thì phần thân đổi, và chữ ký đúng cũng
      phải đổi theo.
    introduces:
    - implies
  - show: '<p><b>Bước 2.</b> Ký đúng <b>chuỗi đã viết lại</b> “đầu.thân”, không ký
      JSON đã đọc ra, vì cùng một nội dung có thể viết khác khoảng trắng hay thứ tự
      trường.</p>

      <span class=''note''>Làm thử: phần thân của ví dụ có cả ký tự xuống dòng \r\n,
      vẫn ký được nguyên văn.</span>

      '
    focus:
    - 1
    - 2
    say: Bước hai, ta ký đúng chuỗi đã viết lại, chứ không ký nội dung đã đọc ra,
      vì cùng một nội dung có thể viết khác khoảng trắng hay thứ tự trường. Làm thử,
      phần thân của ví dụ có cả ký tự xuống dòng, và ta vẫn ký nguyên văn từng byte.
  - show: '<p><b>Bước 3.</b> Phía nhận <b>tính lại</b> chữ ký bằng k và so với chữ
      ký gửi kèm. Thuật toán do máy chủ <b>cố định</b> là HS256, không đọc theo trường
      <code>alg</code> của mã gửi tới.</p>

      <span class=''note''>Làm thử: mã ghi <code>alg</code> = <code>none</code> bị
      loại ngay ở cửa ①.</span>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước ba, phía nhận tính lại chữ ký bằng khoá k rồi so với chữ ký gửi kèm.
      Thuật toán do máy chủ cố định, vì nếu đọc theo trường thuật toán trong mã thì
      kẻ gian sẽ tự chọn. Làm thử, mã ghi thuật toán là không có gì thì bị loại ngay
      ở cửa thứ nhất.
  - show: '<p><b>Bước 4.</b> Chữ ký đúng chỉ chứng minh “không ai sửa”. Mã cũ vẫn
      có chữ ký đúng mãi, nên phải kiểm <b>hạn dùng</b>: chỉ nhận khi bây giờ &lt;
      <code>exp</code>.</p>

      <span class=''note''>Làm thử: exp = 1300819380; lúc 1300819379 thì nhận, lúc
      1300819380 thì từ chối.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: 'Bước bốn, chữ ký đúng chỉ chứng minh không ai sửa mã. Mã cũ vẫn có chữ ký
      đúng mãi, nên phải kiểm hạn dùng: chỉ nhận khi bây giờ còn trước hạn. Làm thử,
      hạn là giây một tỉ ba trăm triệu tám trăm mười chín nghìn ba trăm tám mươi.
      Trước đó một giây thì nhận, đúng giây đó thì từ chối.'
  - show: '<p><b>Bước 5.</b> Mã cấp cho dịch vụ này không được dùng ở dịch vụ khác:
      kiểm <code>iss</code> (ai phát hành) và <code>aud</code> (cấp cho ai; <code>aud</code>
      có thể là một danh sách tên, khi đó kiểm tên mình có trong danh sách, RFC 7519
      mục 4.1.3).

      Mã tự mang thông tin nên <b>không hỏi ai</b> khi kiểm, vì vậy khó thu hồi: dùng
      <b>hạn ngắn</b> và <b>mã làm mới</b>.</p>

      <p>Làm thử (số minh hoạ): hạn 300 giây, mã lộ ở giây 60.</p>

      $$300 - 60 = \hl{240}\ \text{giây kẻ gian còn dùng được}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước năm, mã cấp cho dịch vụ này không được dùng ở dịch vụ khác, nên kiểm
      thêm người phát hành và người nhận. Người nhận có thể là một danh sách tên,
      khi đó ta tìm tên mình trong danh sách. Vì mã tự mang thông tin, dịch vụ không
      hỏi ai khi kiểm, nên rất khó thu hồi mã giữa chừng. Cách chữa là hạn ngắn, cộng
      một mã làm mới do máy chủ cấp mã giữ và thu hồi được. Làm thử bằng số minh hoạ,
      hạn ba trăm giây, mã lộ ở giây thứ sáu mươi, thì kẻ gian còn dùng được hai trăm
      bốn mươi giây.
- id: example
  kind: example
  title: Ví dụ của RFC 7515, từng phép tính
  checks:
  - alg.bnx_b64u_len(30) == 40
  - alg.bnx_jwt_part(0) == 'eyJ0eXAiOiJKV1QiLA0KICJhbGciOiJIUzI1NiJ9'
  - len(alg.bnx_jwt_rfc7515()[1]) == 70 and alg.bnx_b64u_len(70) == 23 * 4 + 2 ==
    94
  - alg.bnx_b64u_len(32) == 10 * 4 + 3 == 43
  - alg.bnx_jwt_part(2) == 'dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk'
  - alg.bnx_jwt_tamper().split('.')[1] != alg.bnx_jwt_part(1) and alg.bnx_jwt_tamper().split('.')[2]
    == alg.bnx_jwt_part(2)
  - alg.bnx_utc(1300819380) == '2011-03-22 18:43:00'
  - alg.bnx_jwt_cases(__import__('time').time()) == ['hết hạn', 'chữ ký sai', 'thuật
    toán lạ', 'nhận', 'sai người phát hành/nhận']
  steps:
  - show: '<p><b>Chương trình Python: dữ liệu của RFC 7515 Phụ lục A.1</b></p><div
      class="code"><div>import base64, hmac, hashlib, json</div><div>def b64u(b):      #
      base64url, bỏ dấu "=" ở cuối</div><div>    return base64.urlsafe_b64encode(b).rstrip(b"=").decode()</div><div>def
      unb64u(s):    # thêm lại "=" rồi giải mã</div><div>    return base64.urlsafe_b64decode(s
      + "=" * (-len(s) % 4))</div><div>dau = b''{"typ":"JWT",\r\n "alg":"HS256"}''</div><div>than
      = (b''{"iss":"joe",\r\n "exp":1300819380,\r\n''</div><div>        b'' "http://example.com/is_root":true}'')</div><div>k
      = unb64u("AyM1SysPpbyDfgZld3umj1qzKObwVMkoqQ-EstJQLr_T-1qS0g"</div><div>           "ZH75aKtMN3Yj0iPS4hcgUuTwjAzZr1Z9CAow")</div></div>'
    focus:
    - 1
    - - '2.2'
      - '2.3'
      - '2.4'
      - '2.5'
    - - '2.3'
      - '2.5'
    - - '2.6'
      - '2.7'
      - '2.8'
    - - '2.9'
      - '2.10'
    clear: true
    say: Ta tính lại ví dụ trong RFC bảy nghìn năm trăm mười lăm, phụ lục A một, bằng
      một chương trình Python nhỏ. Hai hàm đầu viết và đọc theo cơ số sáu mươi tư
      cho đường dẫn. Hàm viết bỏ dấu bằng ở cuối, còn hàm đọc thêm lại cho đủ. Phần
      đầu và phần thân được chép đúng từng byte, kể cả ký tự xuống dòng. Cuối cùng
      là khoá k, sáu mươi tư byte, đọc ra từ chuỗi trong RFC.
  - show: '<p>Phần đầu dài 30 byte, là 10 nhóm 3 byte.</p>

      $$① \; 10 \cdot 4 = \hl{40}\ \text{ký tự: eyJ0eXAiOiJKV1QiLA0KICJhbGciOiJIUzI1NiJ9}$$

      '
    focus:
    - - 1
      - 2
    say: Phép tính thứ nhất, phần đầu dài ba mươi byte, là mười nhóm ba byte, nên
      viết lại thành bốn mươi ký tự, bắt đầu bằng e y J không.
  - show: '<p><b>Ký: HMAC SHA256 của “đầu.thân”</b></p><div class="code"><div>def
      ky(than):                 # ký phần thân bằng khoá k</div><div>    vao = b64u(dau)
      + "." + b64u(than)</div><div>    mac = hmac.new(k, vao.encode(), hashlib.sha256).digest()</div><div>    return
      vao + "." + b64u(mac)</div><div>ma = ky(than)</div><div>for phan in ma.split("."):</div><div>    print(phan)</div></div>'
    focus:
    - - '2.1'
      - '2.2'
    - '2.3'
    - - '2.4'
      - '2.5'
      - '2.6'
      - '2.7'
    clear: true
    say: Đây là hàm ký, nó ghép phần đầu và phần thân đã viết lại bằng một dấu chấm,
      gọi là chuỗi vào. Tiếp theo, nó tính HMAC với SHA256 của chuỗi vào bằng khoá
      k, được ba mươi hai byte. Cuối cùng, nó nối chữ ký đã viết lại vào sau, rồi
      in từng phần.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>eyJ0eXAiOiJKV1QiLA0KICJhbGciOiJIUzI1NiJ9</div><div>eyJpc3MiOiJqb2UiLA0KICJleHAiOjEzMDA4MTkzODAsDQogImh0dHA6…</div><div>dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk</div></div>
    focus:
    - - 1
      - 2
    say: Kết quả chạy thật in ba dòng, dòng giữa là phần thân, dài chín mươi tư ký
      tự nên trên màn hình bị cắt bớt, dòng cuối là chữ ký.
  - show: '<p>Phần thân dài 70 byte = 23 nhóm 3 byte, dư 1 byte (viết thành 2 ký tự).</p>

      $$② \; 23 \cdot 4 + 2 = \hl{94}\ \text{ký tự}$$

      '
    focus:
    - - 1
    - 2
    clear: true
    say: Phép tính thứ hai, phần thân dài bảy mươi byte, là hai mươi ba nhóm ba byte
      và dư một byte. Vì byte dư viết thành hai ký tự, ta được chín mươi tư ký tự.
  - show: '$$③ \; \text{HMAC: 32 byte} = 10 \cdot 3 + 2 \;\Rightarrow\; 10 \cdot 4
      + 3 = \hlg{43}\ \text{ký tự}$$

      <p>Chữ ký <code>dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk</code> <b class="green">khớp
      từng ký tự</b> với RFC.</p>

      '
    focus:
    - - 1
    - 2
    say: Phép tính thứ ba, HMAC cho ba mươi hai byte, là mười nhóm ba byte và dư hai
      byte, nên chữ ký dài bốn mươi ba ký tự. Chuỗi ta tính ra khớp từng ký tự với
      chữ ký in trong RFC, vậy chương trình đã làm đúng.
  - show: $$④ \; 1300819380 \to 9300819380 \;\Rightarrow\; \text{chữ ký tính lại}
      \ne \text{dBjftJeZ…} \;\Rightarrow\; \hl{\text{chữ ký sai}}$$
    say: Phép tính thứ tư, sửa chữ số đầu của hạn dùng từ một thành chín, phần thân
      đổi, nên chữ ký tính lại khác hẳn chữ ký ở phép ba. Dịch vụ báo chữ ký sai và
      từ chối.
  - show: '<p><b>Đọc phần thân mà không cần khoá</b></p><div class="code"><div>from
      datetime import datetime, timezone</div><div>t = ma.split(".")[1]          #
      chỉ cần chuỗi mã, KHÔNG cần khoá</div><div>print(json.loads(unb64u(t)))</div><div>print(datetime.fromtimestamp(1300819380,
      timezone.utc))</div></div>'
    focus:
    - '2.3'
    - '2.2'
    - '2.4'
    clear: true
    say: Bây giờ ta đọc phần thân mà không cần khoá. Chỉ cần tách chuỗi mã ở dấu chấm,
      lấy phần thứ hai, rồi đọc ngược lại. Dòng cuối đổi số giây của hạn dùng sang
      ngày giờ theo giờ quốc tế.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>{''iss'': ''joe'',
      ''exp'': 1300819380, ''http://example.com/is_root'': True}</div><div>2011-03-22
      18:43:00+00:00</div></div>'
    focus:
    - - 1
    - 2
    say: Kết quả chạy thật, dòng đầu là toàn bộ phần thân, ai cũng đọc được. Dòng
      hai là hạn dùng, mười tám giờ bốn mươi ba phút ngày hai mươi hai tháng ba năm
      hai nghìn mười một.
  - show: $$⑤ \; 1300819380 \to \text{22/3/2011 18:43:00, sớm hơn hôm nay} \;\Rightarrow\;
      \hl{\text{hết hạn}}$$
    say: Phép tính thứ năm, hạn dùng rơi vào năm hai nghìn mười một, sớm hơn hôm nay
      rất xa, nên dù chữ ký đúng, mã của RFC vẫn bị từ chối vì hết hạn.
  - show: '<p><b>Ráp bốn cửa thành hàm kiểm</b></p><div class="code"><div>def kiem(ma,
      aud, bay_gio):</div><div>    d, t, s = ma.split(".")</div><div>    if json.loads(unb64u(d))["alg"]
      != "HS256": return "thuật toán lạ"</div><div>    mac = hmac.new(k, (d + "."
      + t).encode(), hashlib.sha256)</div><div>    if not hmac.compare_digest(b64u(mac.digest()),
      s):</div><div>        return "chữ ký sai"</div><div>    c = json.loads(unb64u(t))</div><div>    if
      bay_gio &gt;= c["exp"]:</div><div>        return "hết hạn"</div><div>    if
      c.get("iss") != "joe" or c.get("aud") != aud:</div><div>        return "sai
      người phát hành/nhận"</div><div>    return "nhận"</div></div>'
    focus:
    - - '2.1'
      - '2.3'
    - - '2.4'
      - '2.5'
      - '2.6'
    - - '2.7'
      - '2.8'
      - '2.9'
    - - '2.10'
      - '2.11'
      - '2.12'
    clear: true
    say: Ráp bốn cửa thành một hàm kiểm, cửa một đòi thuật toán đúng là HMAC với SHA256.
      Cửa hai tính lại chữ ký và so bằng hàm so sánh thời gian hằng, tức là luôn so
      hết chuỗi nên thời gian không lộ chỗ sai. Cửa ba so thời điểm hiện tại với hạn
      dùng. Cửa bốn kiểm người phát hành và người nhận, qua cả bốn cửa thì mới nhận.
  - show: '<p><b>Năm ca thử</b></p><div class="code"><div>import time</div><div>print(kiem(ma,
      "api-a", time.time()))          # mã RFC, hôm nay</div><div>d, t, s = ma.split(".")</div><div>t2
      = b64u(than.replace(b"1300", b"9300"))      # sửa 1 ký tự</div><div>print(kiem(d
      + "." + t2 + "." + s, "api-a", 1300819379))</div><div>dn = b64u(b''{"alg":"none"}'')                   #
      alg "none"</div><div>print(kiem(dn + "." + t + ".", "api-a", 0))</div><div>ma2
      = ky(b''{"iss":"joe","aud":"api-a","exp":1300819380}'')</div><div>print(kiem(ma2,
      "api-a", 1300819379))</div><div>print(kiem(ma2, "api-b", 1300819379))</div></div>'
    focus:
    - - '2.1'
      - '2.2'
    - - '2.3'
      - '2.4'
      - '2.5'
    - - '2.6'
      - '2.7'
    - - '2.8'
      - '2.9'
      - '2.10'
    clear: true
    say: Năm ca thử, ca một là mã của RFC, kiểm vào hôm nay. Ca hai là mã bị sửa một
      chữ số mà vẫn giữ chữ ký cũ. Ca ba là mã ghi thuật toán là không có gì và bỏ
      trống chữ ký. Ca bốn và ca năm là một mã mới có người nhận API A, kiểm ở API
      A rồi ở API B.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>hết hạn</div><div>chữ
      ký sai</div><div>thuật toán lạ</div><div>nhận</div><div>sai người phát hành/nhận</div></div>
    focus:
    - '2.1'
    - - '2.2'
      - '2.3'
    - - '2.4'
      - '2.5'
    clear: true
    say: Kết quả chạy thật, đúng thứ tự, mã RFC hết hạn. Mã bị sửa thì chữ ký sai,
      mã không có thuật toán bị loại. Mã mới được nhận ở API A, nhưng sang API B thì
      bị từ chối vì sai người nhận.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: công cụ dòng lệnh OpenSSL'
  checks:
  - alg.bnx_jwt_part(2) == 'dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk'
  - alg.bnx_jwt_rfc7515()[2].hex()[:6] == '032335'
  - alg.bnx_utc(1300819380) == '2011-03-22 18:43:00'
  steps:
  - show: '<p><b>Đường khác: tính lại bằng openssl (Git Bash)</b></p><div class="code"><div>printf
      %s eyJ0eXAiOiJKV1QiLA0KICJhbGciOiJIUzI1NiJ9. \</div><div>  eyJpc3MiOiJqb2UiLA0KICJleHAiOjEzMDA4MTkzODAsDQogImh0dHA6Ly9leGFt
      \</div><div>  cGxlLmNvbS9pc19yb290Ijp0cnVlfQ &gt; vao.txt</div><div>openssl
      dgst -sha256 -mac HMAC -binary -macopt hexkey:\</div><div>0323354b2b0fa5bc837e0665777ba68f5ab328e6f054c928a90f84b2d2502ebf\</div><div>d3fb5a92d20647ef968ab4c377623d223d2e2172052e4f08c0cd9af567d080a3
      \</div><div>  vao.txt | openssl base64 -A | tr ''+/'' ''-_'' | tr -d ''=''</div><div>echo</div><div>date
      -u -d @1300819380 ''+%F %T''</div></div>'
    focus:
    - 0
    - - '2.1'
      - '2.2'
      - '2.3'
    - - '2.4'
      - '2.5'
      - '2.6'
    - '2.7'
    - '2.9'
    clear: true
    say: Kiểm bằng một đường hoàn toàn khác, là công cụ dòng lệnh mật mã chạy trong
      cửa sổ lệnh, không dùng Python. Ba dòng đầu ghi chuỗi đầu chấm thân vào một
      tệp. Lệnh tiếp theo tính HMAC với SHA256 bằng khoá k viết ở hệ mười sáu. Rồi
      đổi kết quả sang cơ số sáu mươi tư cho đường dẫn bằng cách thay hai ký tự và
      bỏ dấu bằng. Dòng cuối đổi số giây ra ngày giờ quốc tế.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk</div><div>2011-03-22
      18:43:00</div></div>
    focus:
    - 1
    - 2
    say: Kết quả chạy thật cho thấy chữ ký giống hệt chữ ký Python tính ra, và giống
      RFC, nên hai đường độc lập cho cùng một kết quả. Ngày giờ cũng là mười tám giờ
      bốn mươi ba phút ngày hai mươi hai tháng ba năm hai nghìn mười một.
  - show: <table class='t'><tr><th>đại lượng</th><th>Python</th><th>openssl + date</th><th>RFC
      7515</th></tr><tr><td>chữ ký (43 ký tự)</td><td>dBjftJeZ…</td><td>dBjftJeZ…</td><td>dBjftJeZ…</td></tr><tr><td>hạn
      dùng 1300819380</td><td>22/3/2011 18:43</td><td>22/3/2011 18:43</td><td>—</td></tr></table>
    clear: true
    say: Bảng này đặt ba nguồn cạnh nhau, hai chương trình khác nhau và con số in
      trong RFC cho cùng một chữ ký, nên ta tin phép tính đúng. Hai cách đổi ngày
      giờ cũng khớp nhau.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 64 * len(alg.bnx_jwt_part(2)) == 2752
  - '''joe'' in alg.bnx_unb64u(alg.bnx_jwt_part(1)).decode()'
  - alg.bnx_jwt_cases(0)[2] == 'thuật toán lạ'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Để số căn cước, số dư vào
      phần thân vì nghĩ mã đã được “mã hoá”.

      Phần thân chỉ được <b class="red">viết lại</b> bằng base64url: ở phép ⑤, ta
      đọc được toàn bộ mà không cần khoá.

      <br><span class="note">Cách chữa: phần thân chỉ chứa mã định danh và quyền;
      thông tin nhạy cảm để ở máy chủ.</span></div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới, để số căn cước hay số dư vào phần thân, vì nghĩ
      mã đã được mã hoá. Thật ra phần thân chỉ được viết lại, và ở phép tính thứ năm
      ta đã đọc được toàn bộ mà không cần khoá. Cách chữa là phần thân chỉ chứa mã
      định danh và quyền.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Tin
      trường <code>alg</code></b> của mã gửi tới.

      Kẻ gian ghi <code>none</code> để bỏ chữ ký. Hoặc: có thuật toán ký bằng <b>một
      cặp khoá</b> (khoá riêng giữ kín để ký, khoá công khai phát cho mọi người để
      kiểm); kẻ gian đổi sang HS256 rồi lấy <b>khoá công khai</b> làm khoá HMAC.

      <br><span class="note">Cách chữa: máy chủ cố định danh sách thuật toán (RFC
      8725 mục 3.1); ca thử ③ bị loại.</span></div>

      '
    clear: true
    say: 'Lỗi thứ hai, của người đã đi làm, là tin trường thuật toán trong mã gửi
      tới. Kẻ gian ghi không có thuật toán để bỏ chữ ký. Có thuật toán ký bằng một
      cặp khoá: khoá riêng giữ kín để ký, khoá công khai phát cho mọi người để kiểm.
      Nếu hệ thống vốn ký kiểu đó, kẻ gian đổi sang HMAC rồi dùng khoá công khai,
      thứ ai cũng có, làm khoá bí mật. Cách chữa là máy chủ cố định danh sách thuật
      toán, như ca thử thứ ba đã bị loại.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> So chữ ký bằng <code>==</code>.
      Phép so dừng ở ký tự sai đầu tiên, nên thời gian trả lời lộ ra đã đoán đúng
      bao nhiêu ký tự.

      <br><span class="note">Về nguyên tắc, đoán lần lượt từng ký tự: tối đa $64 \cdot
      43 = 2752$ giá trị phải thử, mỗi giá trị đo lặp nhiều lần, thay vì đoán cả chuỗi.
      Cách chữa: <code>hmac.compare_digest</code>.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, là so chữ ký bằng phép so thường. Phép
      so dừng ở ký tự sai đầu tiên, nên thời gian trả lời lộ ra đã đoán đúng bao nhiêu
      ký tự. Về nguyên tắc, kẻ gian đoán lần lượt từng ký tự, mỗi vị trí sáu mươi
      tư khả năng, bốn mươi ba vị trí. Vậy tối đa hai nghìn bảy trăm năm mươi hai
      giá trị phải thử, mỗi giá trị đo lặp nhiều lần để lọc nhiễu. Cách chữa là dùng
      hàm so sánh thời gian hằng, luôn so hết chuỗi.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - len(b'{"alg":"HS256","typ":"JWT"}') == 27
  - alg.bnx_b64u_len(27) == 36
  - len(alg.bnx_b64u(b'{"alg":"HS256","typ":"JWT"}')) == 36
  - alg.bnx_exp_ok(1300819380, 1300819379) and not alg.bnx_exp_ok(1300819380, 1300819380)
  - alg.bnx_risk_window(3600, 60) == 3540
  - alg.bnx_risk_window(300, 60) == 240
  - 3600 // 300 == 12
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Phần
      đầu <code>{"alg":"HS256","typ":"JWT"}</code> dài 27 byte. Viết bằng base64url
      dài bao nhiêu ký tự?</td></tr><tr><td>2</td><td>Mã có exp = 1300819380, máy
      chủ không cho lệch đồng hồ. Lúc 1300819379 và lúc 1300819380: nhận hay từ chối?</td></tr><tr><td>3</td><td>Quyết
      định (số minh hoạ): mã truy cập hạn 3600 giây, hay hạn 300 giây kèm mã làm mới?
      Giả sử mã lộ ở giây 60.</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, phần đầu dài hai mươi bảy byte,
      viết lại dài bao nhiêu ký tự? Câu hai, mã có hạn dùng như ví dụ, máy chủ không
      cho lệch đồng hồ. Trước hạn một giây và đúng giây hết hạn, nhận hay từ chối?
      Câu ba, chọn mã hạn ba nghìn sáu trăm giây, hay hạn ba trăm giây kèm mã làm
      mới, khi mã lộ ở giây thứ sáu mươi? Hãy dừng video lại và làm từng câu ra giấy
      trước khi xem đáp án.
  - show: '<p>Câu 1: 27 byte = 9 nhóm 3 byte, không dư.</p>

      $$9 \cdot 4 = \hlg{36}\ \text{ký tự}$$

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu một, hai mươi bảy byte là chín nhóm ba byte, không dư, nên viết
      lại thành ba mươi sáu ký tự.
    clear: true
  - show: '<p>Câu 2: chỉ nhận khi bây giờ &lt; exp.</p>

      $$1300819379 \text{ trước } 1300819380 \Rightarrow \hlg{\text{nhận}}; \quad
      1300819380 \text{ không trước chính nó} \Rightarrow \hl{\text{từ chối}}$$

      '
    focus:
    - - 1
    - - 2
    say: Đáp án câu hai, chỉ nhận khi bây giờ còn trước hạn. Trước một giây thì nhận,
      đúng giây hết hạn thì điều kiện sai, nên từ chối.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hạn
      3600 giây</td><td>ứng dụng ít phải xin mã mới</td><td>lộ ở giây 60: kẻ gian
      dùng thêm 3600 − 60 = 3540 giây</td></tr><tr><td>hạn 300 giây + mã làm mới</td><td>lộ
      ở giây 60: chỉ còn 240 giây; mã làm mới thu hồi được ở máy chủ cấp mã</td><td>ứng
      dụng xin mã mới 3600 : 300 = 12 lần mỗi giờ</td></tr><tr><td>danh sách thu hồi,
      tra mỗi lời gọi</td><td>chặn được ngay</td><td>mỗi lời gọi lại phải hỏi một
      kho chung: mất ưu điểm tự mang thông tin</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án câu ba, hạn ba nghìn sáu trăm giây thì ít phải xin mã mới, nhưng mã
      lộ ở giây sáu mươi cho kẻ gian ba nghìn năm trăm bốn mươi giây. Hạn ba trăm
      giây kèm mã làm mới chỉ để hở hai trăm bốn mươi giây, và mã làm mới thu hồi
      được, đổi lại ứng dụng xin mã mới mười hai lần mỗi giờ. Còn danh sách thu hồi
      chặn được ngay, nhưng mỗi lời gọi lại phải hỏi kho chung, mất ưu điểm tự mang
      thông tin.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>đầu.thân: ai cũng đọc</span><span
      class=''a''>→</span><span class=''n''>HMAC với khoá k: chữ ký</span><span class=''a''>→</span><span
      class=''n''>tính lại, so thời gian hằng</span><span class=''a''>→</span><span
      class=''n''>kiểm exp, iss, aud</span><span class=''a''>→</span><span class=''n''>hạn
      ngắn + mã làm mới</span></div>'
    say: Tổng kết chuỗi logic, phần đầu và phần thân ai cũng đọc được. Chữ ký là HMAC
      với khoá k mà chỉ máy chủ giữ. Phía nhận tính lại chữ ký và so bằng hàm thời
      gian hằng, rồi kiểm hạn dùng, người phát hành, người nhận. Vì khó thu hồi, mã
