      không dừng ở ký tự sai đầu tiên; dùng thay cho <code>==</code></td></tr></table>'
    clear: true
    say: Hàm kiểm dùng thêm vài cách viết, nên ta giải nghĩa trước. Dòng đầu cắt mã
      thành ba phần, hàm đọc JSON biến chuỗi thành từ điển, và lệnh lấy trường cho
      kết quả rỗng khi thiếu. Hàm so thời gian hằng luôn so hết chuỗi.
  - show: '<p><b>Ráp bốn cửa thành hàm kiểm</b></p><div class="code"><div>def kiem(ma,
      aud, bay_gio):</div><div>    d, t, s = ma.split(".")</div><div>    if json.loads(unb64u(d))["alg"]
      != "HS256": return "thuật toán lạ"</div><div>    mac = hmac.new(k, (d + "."
      + t).encode(), hashlib.sha256)</div><div>    if not hmac.compare_digest(b64u(mac.digest()),
      s):</div><div>        return "chữ ký sai"</div><div>    c = json.loads(unb64u(t))</div><div>    if
      bay_gio &gt;= c["exp"]:</div><div>        return "hết hạn"</div><div>    if
      c.get("iss") != "joe" or c.get("aud") != aud:</div><div>        return "sai
      người phát hành/nhận"</div><div>    return "nhận"</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Ta ráp bốn cửa thành một hàm kiểm: thuật toán đúng, chữ ký khớp khi so bằng
      hàm thời gian hằng, chưa hết hạn, và đúng người phát hành, người nhận. Chỉ khi
      qua cả bốn cửa thì mã mới được nhận.'
  - show: '<p><b>Năm ca thử</b></p><div class="code"><div>import time</div><div>print(kiem(ma,
      "api-a", time.time()))          # mã RFC, hôm nay</div><div>d, t, s = ma.split(".")</div><div>t2
      = b64u(than.replace(b"1300", b"9300"))      # sửa 1 ký tự</div><div>print(kiem(d
      + "." + t2 + "." + s, "api-a", 1300819379))</div><div>dn = b64u(b''{"alg":"none"}'')                   #
      alg "none"</div><div>print(kiem(dn + "." + t + ".", "api-a", 0))</div><div>ma2
      = ky(b''{"iss":"joe","aud":"api-a","exp":1300819380}'')</div><div>print(kiem(ma2,
      "api-a", 1300819379))</div><div>print(kiem(ma2, "api-b", 1300819379))</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Năm ca thử như sau: ca một là mã RFC kiểm hôm nay, ca hai là mã bị sửa một
      chữ số mà giữ chữ ký cũ, ca ba ghi thuật toán là không có gì. Ca bốn và ca năm
      là mã mới cho dịch vụ api-a, kiểm ở API A rồi ở API B.'
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>hết hạn</div><div>chữ
      ký sai</div><div>thuật toán lạ</div><div>nhận</div><div>sai người phát hành/nhận</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: 'Kết quả đúng thứ tự: mã RFC hết hạn, mã bị sửa thì chữ ký sai, mã không
      có thuật toán bị loại. Mã mới được nhận ở API A nhưng sang API B thì bị từ chối
      vì sai người nhận.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: công cụ dòng lệnh OpenSSL'
  checks:
  - alg.bnx_jwt_part(2) == 'dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk'
  - alg.bnx_jwt_rfc7515()[2].hex()[:6] == '032335'
  - alg.bnx_utc(1300819380) == '2011-03-22 18:43:00'
  steps:
  - show: '<table class=''t''><tr><th>lệnh</th><th>nghĩa</th></tr><tr><td><code>printf
      %s … &gt; vao.txt</code></td><td>in chuỗi đã cho, ghi vào tệp <code>vao.txt</code></td></tr><tr><td><code>openssl
      dgst -sha256 -mac HMAC -macopt hexkey:…</code></td><td>tính HMAC-SHA256 của
      tệp, khoá cho dưới dạng thập lục phân</td></tr><tr><td><code>… | openssl base64
      -A | tr ''+/'' ''-_'' | tr -d ''=''</code></td><td>dấu <code>|</code> chuyển
      đầu ra sang lệnh sau; đổi sang base64 (<code>-A</code>: viết liền một dòng),
      thay <code>+/</code> bằng <code>-_</code>, bỏ <code>=</code></td></tr><tr><td><code>\</code>
      cuối dòng</td><td>nối dòng này với dòng sau thành một lệnh duy nhất (lệnh dài
      nên ngắt dòng)</td></tr><tr><td><code>-binary</code>, <code>echo</code></td><td><code>-binary</code>:
      in byte thô thay vì chữ, để lệnh sau đổi sang base64; <code>echo</code> không
      kèm gì: xuống dòng</td></tr><tr><td><code>date -u -d @1300819380 ''+%F %T''</code></td><td>đổi
      số giây Unix thành ngày giờ quốc tế; chuỗi <code>''+%F %T''</code> đặt mẫu in:
      <code>%F</code> năm-tháng-ngày, <code>%T</code> giờ:phút:giây</td></tr></table>'
    clear: true
    say: Công cụ dòng lệnh có vài cách viết mới, nên ta giải nghĩa trước. Lệnh đầu
      ghi chuỗi vào tệp, lệnh thứ hai tính HMAC với khoá ở thập lục phân, dấu gạch
      đứng chuyển đầu ra sang lệnh sau. Dấu gạch ngược cuối dòng nối lệnh dài, tuỳ
      chọn nhị phân in byte thô, và lệnh ngày đổi số giây thành ngày giờ theo mẫu
      in.
  - show: '<p><b>Đường khác: tính lại bằng openssl (Git Bash)</b></p><div class="code"><div>printf
      %s eyJ0eXAiOiJKV1QiLA0KICJhbGciOiJIUzI1NiJ9. \</div><div>  eyJpc3MiOiJqb2UiLA0KICJleHAiOjEzMDA4MTkzODAsDQogImh0dHA6Ly9leGFt
      \</div><div>  cGxlLmNvbS9pc19yb290Ijp0cnVlfQ &gt; vao.txt</div><div>openssl
      dgst -sha256 -mac HMAC -binary -macopt hexkey:\</div><div>0323354b2b0fa5bc837e0665777ba68f5ab328e6f054c928a90f84b2d2502ebf\</div><div>d3fb5a92d20647ef968ab4c377623d223d2e2172052e4f08c0cd9af567d080a3
      \</div><div>  vao.txt | openssl base64 -A | tr ''+/'' ''-_'' | tr -d ''=''</div><div>echo</div><div>date
      -u -d @1300819380 ''+%F %T''</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta kiểm bằng một đường khác, là công cụ dòng lệnh mật mã, không dùng Python.
      Ba dòng đầu ghi chuỗi đầu chấm thân vào một tệp. Lệnh tiếp theo tính HMAC với
      SHA256 bằng khoá k ở thập lục phân, rồi đổi kết quả sang cơ số sáu mươi tư.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk</div><div>2011-03-22
      18:43:00</div></div>
    clear: true
    say: Chữ ký giống hệt chữ ký Python và chữ ký in trong RFC, nên hai đường cho
      cùng kết quả, ngày giờ cũng khớp.
- id: quymo
  kind: example
  title: 'Khi mã bị lộ: kẻ gian dùng được bao lâu, và ứng dụng xin mã mới bao nhiêu
    lần'
  checks:
  - '[alg.bnx_l03_exposed(h, 60) for h in (300, 3600)] == [240, 3540]'
  - alg.bnx_risk_window(300, 60) == 240 and alg.bnx_risk_window(3600, 60) == 3540
  - '[alg.bnx_l03_refresh_per_hour(u, 300) for u in (1000, 1000000)] == [12000, 12000000]
    and alg.bnx_l03_refresh_per_hour(1000000, 3600) == 1000000'
  - 1000000 // 1000 == 1000 and 3540 // 240 == 14
  steps:
  - show: <table class='t'><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>b'…%d…'
      % han</code></td><td>thay chỗ <code>%d</code> bằng số <code>han</code></td></tr><tr><td><code>sum(kiem(…)
      == "nhận" for t in range(60, 4001))</code></td><td>đếm số giây <code>t</code>
      từ 60 đến 4000 mà mã còn được nhận</td></tr><tr><td><code>u * 3600 // 300</code></td><td><code>//</code>
      là chia lấy phần nguyên</td></tr></table>
    clear: true
    say: 'Khối đo dùng ba cách viết mới nên ta giải nghĩa trước: thay số vào chỗ định
      dạng, đếm số giây mà mã còn được nhận, và phép chia lấy phần nguyên.'
  - show: '<p><b>Đo thật: kẻ gian lấy mã ở giây 60, mỗi giây thử một lần tới giây
      4000</b></p><div class="code"><div>for han in (300, 3600):                 #
      hạn dùng của mã, giây</div><div>    ma = ky(b''{"iss":"joe","aud":"api-a","exp":%d}''
      % han)</div><div>    dung = sum(kiem(ma, "api-a", t) == "nhận" for t in range(60,
      4001))</div><div>    print("han", han, "giay:", dung, "lan dung duoc sau khi
      lo o giay 60")</div><div>for u in (1000, 1000000):               # số người
      dùng</div><div>    moi = u * 3600 // 300</div><div>    cu = u * 3600 // 3600</div><div>    print(u,
      "nguoi dung:", moi, "so voi", cu, "ma moi moi gio")</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta đo theo thời gian, dùng lại hai hàm đó. Ta cấp mã hạn ba trăm giây rồi
      ba nghìn sáu trăm giây, kẻ gian lấy được mã ở giây sáu mươi. Hàm đếm cho biết
      mã còn được nhận bao nhiêu giây, còn hai dòng cuối tính số mã mới mỗi giờ.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>han 300 giay: 240
      lan dung duoc sau khi lo o giay 60</div><div>han 3600 giay: 3540 lan dung duoc
      sau khi lo o giay 60</div><div>1000 nguoi dung: 12000 so voi 1000 ma moi moi
      gio</div><div>1000000 nguoi dung: 12000000 so voi 1000000 ma moi moi gio</div></div><table
      class=''t''><tr><th>hạn dùng</th><th>kẻ gian dùng được</th><th>mã mới mỗi giờ:
      1 000 người</th><th>1 000 000 người (×1 000)</th></tr><tr><td>300 giây</td><td>240
      lần</td><td>12 000</td><td>12 000 000</td></tr><tr><td>3 600 giây</td><td>3
      540 lần</td><td>1 000</td><td>1 000 000</td></tr></table><p class="note">Số
      người dùng và nhịp mỗi người xin mã mới đúng một lần khi mã hết hạn là số minh
      hoạ.</p>'
    focus:
    - 1
    - 3
    clear: true
    say: Hạn ba trăm giây thì kẻ gian dùng được hai trăm bốn mươi lần, hạn ba nghìn
      sáu trăm giây thì ba nghìn năm trăm bốn mươi lần, gấp hơn mười bốn lần. Đổi
      lại, hạn ngắn làm mỗi người xin mã mới mười hai lần mỗi giờ thay vì một.
  - show: '<table class=''t''><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào
      chọn</th></tr><tr><td>hạn dài (3 600 giây)</td><td>ít mã mới, máy cấp mã nhàn</td><td>mã
      lộ thì hở lâu</td><td>dịch vụ rủi ro thấp, ít người dùng</td></tr><tr><td>hạn
      ngắn + mã làm mới</td><td>hở ngắn; thu hồi ở nơi cấp mã</td><td>tải xin mã mới
      nhân 12, máy cấp mã thành điểm nghẽn</td><td>ngân hàng: lệnh chuyển tiền, nhiều
      người dùng</td></tr><tr><td>danh sách thu hồi tra mỗi lời gọi</td><td>chặn ngay</td><td>mỗi
      lời gọi hỏi một kho chung: mất ưu điểm tự mang thông tin</td><td>cần chặn tức
      thì (mất điện thoại, nghi gian lận)</td></tr></table>'
    clear: true
    say: Hạn dài tiện nhưng mã lộ thì hở lâu, hạn ngắn kèm mã làm mới thu hẹp khoảng
      hở nhưng nhân tải lên máy cấp mã mười hai lần. Danh sách thu hồi chặn được ngay
      nhưng mất ưu điểm tự mang thông tin, nên chỉ dùng khi cần chặn tức thì.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 64 * len(alg.bnx_jwt_part(2)) == 2752
  - '''joe'' in alg.bnx_unb64u(alg.bnx_jwt_part(1)).decode()'
  - alg.bnx_jwt_cases(0)[2] == 'thuật toán lạ'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Để số căn cước, số dư vào
      phần thân vì nghĩ mã đã được “mã hoá”.

      Phần thân chỉ được <b class="red">viết lại</b> bằng base64url: ở phép ⑤, ta
      đọc được toàn bộ mà không cần khoá.

      <br><span class="note">Cách chữa: phần thân chỉ chứa mã định danh và quyền;
      thông tin nhạy cảm để ở máy chủ.</span></div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới, là để số căn cước hay số dư vào phần thân vì
      nghĩ mã đã được mã hoá. Phần thân chỉ được viết lại, ta đã đọc được không cần
      khoá, nên chỉ để mã định danh và quyền.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Tin
      trường <code>alg</code></b> của mã gửi tới.

      Kẻ gian ghi <code>none</code> để bỏ chữ ký. Hoặc: có thuật toán ký bằng <b>một
      cặp khoá</b> (khoá riêng giữ kín để ký, khoá công khai phát cho mọi người để
      kiểm); kẻ gian đổi sang HS256 rồi lấy <b>khoá công khai</b> làm khoá HMAC.

      <br><span class="note">Cách chữa: máy chủ cố định danh sách thuật toán (RFC
      8725 mục 3.1); ca thử ③ bị loại.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là tin trường thuật toán trong mã gửi tới.
      Kẻ gian ghi không có thuật toán để bỏ chữ ký. Hoặc, nếu ký bằng cặp khoá riêng
      và công khai, thì đổi sang HMAC và lấy khoá công khai làm khoá bí mật. Vì vậy
      máy chủ phải cố định danh sách thuật toán.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> So chữ ký bằng <code>==</code>.
      Phép so dừng ở ký tự sai đầu tiên, nên thời gian trả lời lộ ra đã đoán đúng
      bao nhiêu ký tự.

      <br><span class="note">Về nguyên tắc (qua mạng thật, độ trễ nhiễu làm việc đo
      khó hơn nhiều), đoán lần lượt từng ký tự: tối đa $64 \cdot 43 = 2752$ giá trị
      phải thử, mỗi giá trị đo lặp nhiều lần, thay vì đoán cả chuỗi. Cách chữa: <code>hmac.compare_digest</code>.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là so chữ ký bằng phép so thường. Phép so
      dừng ở ký tự sai đầu tiên, nên thời gian trả lời lộ ra đã đoán đúng bao nhiêu
      ký tự. Về nguyên tắc kẻ gian đoán từng ký tự, tối đa hai nghìn bảy trăm năm
      mươi hai giá trị, dù qua mạng thật khó đo hơn nhiều. Cách chữa là hàm so thời
      gian hằng.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - len(b'{"alg":"HS256","typ":"JWT"}') == 27
  - alg.bnx_b64u_len(27) == 36
  - len(alg.bnx_b64u(b'{"alg":"HS256","typ":"JWT"}')) == 36
  - alg.bnx_exp_ok(1300819380, 1300819379) and not alg.bnx_exp_ok(1300819380, 1300819380)
  - alg.bnx_risk_window(3600, 60) == 3540
  - alg.bnx_risk_window(300, 60) == 240
  - 3600 // 300 == 12
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Phần
      đầu <code>{"alg":"HS256","typ":"JWT"}</code> dài 27 byte. Viết bằng base64url
      dài bao nhiêu ký tự?</td></tr><tr><td>2</td><td>Mã có exp = 1300819380, máy
      chủ không cộng thêm khoảng lệch đồng hồ (độ chênh cho phép giữa đồng hồ hai
      máy). Lúc 1300819379 và lúc 1300819380: nhận hay từ chối?</td></tr><tr><td>3</td><td>Quyết
      định (số minh hoạ): mã truy cập hạn 3600 giây, hay hạn 300 giây kèm mã làm mới?
      Giả sử mã lộ ở giây 60.</td></tr></table>'
    pause: 25
    say: Đến lượt bạn, ba câu trên màn hình. Câu ba chọn hạn dài hay hạn ngắn kèm
      mã làm mới. Hãy dừng video và làm từng câu ra giấy.
  - show: '<p>Câu 1: 27 byte = 9 nhóm 3 byte, không dư.</p>

      $$9 \cdot 4 = \hlg{36}\ \text{ký tự}$$

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu một, hai mươi bảy byte là chín nhóm ba byte, không dư, nên viết
      lại thành ba mươi sáu ký tự.
    clear: true
  - show: '<p>Câu 2: chỉ nhận khi bây giờ &lt; exp.</p>

      $$1300819379 \text{ trước } 1300819380 \Rightarrow \hlg{\text{nhận}}; \quad
      1300819380 \text{ không trước chính nó} \Rightarrow \hl{\text{từ chối}}$$

      '
    focus:
    - - 1
    - - 2
    say: Đáp án câu hai, chỉ nhận khi bây giờ còn trước hạn. Trước một giây thì nhận,
      đúng giây hết hạn thì điều kiện sai, nên từ chối.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hạn
      3600 giây</td><td>ứng dụng ít phải xin mã mới</td><td>lộ ở giây 60: kẻ gian
      dùng thêm 3600 − 60 = 3540 giây</td></tr><tr><td>hạn 300 giây + mã làm mới</td><td>lộ
      ở giây 60: chỉ còn 240 giây; mã làm mới thu hồi được ở máy chủ cấp mã</td><td>ứng
      dụng xin mã mới 3600 : 300 = 12 lần mỗi giờ</td></tr><tr><td>danh sách thu hồi,
      tra mỗi lời gọi</td><td>chặn được ngay</td><td>mỗi lời gọi lại phải hỏi một
      kho chung: mất ưu điểm tự mang thông tin</td></tr></table>'
    say: Đáp án câu ba, hạn ba nghìn sáu trăm giây thì ít phải xin mã mới, nhưng mã
      lộ ở giây sáu mươi cho kẻ gian ba nghìn năm trăm bốn mươi giây. Hạn ba trăm
      giây kèm mã làm mới chỉ hở hai trăm bốn mươi giây, đổi lại xin mã mới mười hai
      lần mỗi giờ.
    clear: true
