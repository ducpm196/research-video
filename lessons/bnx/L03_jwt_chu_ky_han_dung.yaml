id: L03
course: BNX
series: BNX · Backend ngân hàng mở rộng theo JD
title: 'Bài 3 — JWT: mã truy cập tự mang thông tin, chữ ký HMAC và hạn dùng'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/bnx.yaml L03; audit/bnx/verify_bnx.py L03; RFC 7515 Phụ lục A.1
  (2015, ví dụ HS256); RFC 7519 mục 4.1 (2015); RFC 7519 mục 4.1.3 (aud có thể là
  danh sách); RFC 8725 mục 2.1, 3.1 (2020, đọc 2026-11-11)
assumes: []
objectives:
- Tách và giải mã ba phần của một JWT
- Tính lại chữ ký HS256 và phát hiện phần thân bị sửa
- Kiểm hạn dùng, người phát hành và người nhận
- Nêu cách thu hồi khi mã tự mang thông tin
