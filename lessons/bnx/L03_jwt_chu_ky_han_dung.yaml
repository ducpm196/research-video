objectives:
- Tách và giải mã ba phần của một JWT
- Tính lại chữ ký HS256 và phát hiện phần thân bị sửa
- Kiểm hạn dùng, người phát hành và người nhận
- Nêu cách thu hồi khi mã tự mang thông tin
- Đo số lần kẻ gian dùng được mã bị lộ với hạn 300 giây và 3 600 giây, và số mã mới
  mỗi giờ khi số người dùng tăng
- Tự viết hàm ký và hàm kiểm một JWT HS256 rồi chạy năm ca thử
