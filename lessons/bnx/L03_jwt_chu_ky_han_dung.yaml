scenes:
- id: hook
  kind: hook
  title: Sửa một chữ số để mã sống tới năm 2264?
  checks:
  - len(alg.bnx_jwt_rfc_token().split('.')) == 3
  - alg.bnx_utc(9300819380)[:4] == '2264'
  - alg.bnx_jwt_check(alg.bnx_jwt_tamper(), alg.bnx_jwt_rfc7515()[2], 'api-a', 1300819379)
    == 'chữ ký sai'
  steps:
  - show: '<p>Khách đăng nhập ứng dụng ngân hàng một lần, rồi mỗi lời gọi tới các
      dịch vụ đều kèm một <b>mã truy cập</b>.

      Mã có dạng ba phần nối bằng hai dấu chấm: <code>eyJ0eXAi….eyJpc3Mi….dBjftJeZ…</code></p>

      <div class="box key">Phần giữa ghi hạn dùng <b>1300819380</b>. Kẻ gian sửa <b>một
      chữ số</b> thành <b>9300819380</b>, tức năm <b>2264</b>.

      Dịch vụ có nhận không, khi nó không hỏi cơ sở dữ liệu?</div>

      '
    focus:
    - 1
    - - 2
    - 2
    say: Chào bạn, khách đăng nhập ứng dụng ngân hàng một lần, rồi mỗi lời gọi tới
      các dịch vụ đều kèm một mã truy cập, gồm ba phần nối bằng hai dấu chấm. Phần
      giữa ghi hạn dùng, kẻ gian sửa đúng một chữ số đầu, từ một thành chín, để mã
      sống tới năm hai nghìn hai trăm sáu mươi tư. Dịch vụ có nhận mã đó không, khi
      nó không hỏi lại cơ sở dữ liệu?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>mã
      mang được thông tin gì, ai đọc được</td><td>phần đầu và phần thân chỉ được viết
      lại, ai cầm mã cũng đọc được</td></tr><tr><td>vì sao sửa một ký tự là lộ</td><td>chữ
      ký HMAC tính trên đúng từng byte, chỉ máy chủ có khoá mới tính được</td></tr><tr><td>chữ
      ký đúng đã đủ chưa</td><td>chưa: còn kiểm hạn dùng, người phát hành, người nhận,
      và lo chuyện thu hồi</td></tr></table>'
    say: Hôm nay ta trả lời ba câu, mã mang được thông tin gì, và ai đọc được nó.
      Vì sao sửa một ký tự là bị lộ ngay. Và vì sao chữ ký đúng vẫn chưa đủ để nhận
      mã.
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_b64u(b'abc') == 'YWJj'
  - len(alg.bnx_jwt_rfc7515()[0]) == 30
  - alg.bnx_b64u_len(30) == 40
  - len(alg.bnx_jwt_part(0)) == 40
  - alg.bnx_b64u_len(32) == 43
  - len(alg.bnx_jwt_rfc7515()[2]) == 64
  - alg.bnx_utc(1300819380) == '2011-03-22 18:43:00'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      byte và base64url</td><td>viết dãy byte bằng 64 ký tự an toàn cho đường dẫn;
      mỗi ký tự mang 6 bit, nên 3 byte (24 bit) thành 4 ký tự; dư 1 byte thành 2 ký
      tự, dư 2 byte thành 3 ký tự</td><td><code>abc</code> (3 byte) → <code>YWJj</code></td></tr><tr><td>②
      JSON</td><td>văn bản dạng khoá và giá trị</td><td><code>{"iss":"joe"}</code></td></tr><tr><td>③
      SHA256</td><td>hàm băm: đầu vào dài bao nhiêu cũng ra 32 byte; đổi 1 ký tự là
      ra kết quả khác hẳn</td><td>32 byte → 43 ký tự base64url</td></tr><tr><td>④
      HMAC</td><td>băm có trộn một khoá bí mật: không có khoá thì không tính được</td><td>khoá
      64 byte của ví dụ</td></tr><tr><td>⑤ giờ Unix</td><td>số giây kể từ 0 giờ ngày
      1/1/1970 theo giờ quốc tế</td><td>1300819380 → 22/3/2011 18:43:00</td></tr></table>'
    focus:
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: Trước hết ta cần hiểu năm điều, thứ nhất, cách viết cơ số sáu mươi tư cho
      đường dẫn cho mỗi ký tự mang sáu bit, nên ba byte thành bốn ký tự. Phần dư thì
      một byte thành hai ký tự, còn hai byte thành ba ký tự. Thứ hai, dữ liệu trong
      mã được ghi thành các cặp tên và giá trị, đặt trong ngoặc nhọn. Thứ ba, SHA256
      là hàm băm, đầu vào dài bao nhiêu cũng ra ba mươi hai byte, đổi một ký tự là
      kết quả khác hẳn. Thứ tư, HMAC là phép băm có trộn khoá bí mật, nên không có
      khoá thì không tính được. Thứ năm, thời điểm trong mã được ghi bằng số giây
      kể từ đầu năm một nghìn chín trăm bảy mươi, theo giờ quốc tế.
  - show: '<p>Làm thử: phần đầu của ví dụ dài 30 byte, tức 10 nhóm 3 byte.</p>

      $$10 \cdot 4 = \hl{40}\ \text{ký tự}$$

      '
    focus:
    - - 1
    - 2
    say: Làm thử ngay, phần đầu của ví dụ hôm nay dài ba mươi byte, tức mười nhóm
      ba byte. Vì mỗi nhóm thành bốn ký tự, nên ta được bốn mươi ký tự.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã các từ của một JWT
  checks:
  - alg.bnx_b64u(bytes([251, 255])) == '-_8'
  - '''='' not in alg.bnx_jwt_rfc_token()'
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>JWT
      (JSON Web Token)</td><td>mã ba phần: <b>đầu</b> . <b>thân</b> . <b>chữ ký</b>,
      mỗi phần viết bằng base64url</td></tr><tr><td>phần đầu (header)</td><td><code>alg</code>:
      thuật toán ký, ví dụ <code>HS256</code> = HMAC dùng SHA256</td></tr><tr><td>phần
      thân (payload)</td><td>các trường: <code>iss</code> người phát hành, <code>sub</code>
      chủ thể, <code>aud</code> người nhận, <code>exp</code> hạn dùng, <code>iat</code>
      lúc cấp</td></tr><tr><td>chữ ký (signature)</td><td>với HS256: HMAC của chuỗi
      “đầu.thân” bằng khoá bí mật của máy chủ (thuật toán khác ký bằng một khoá giữ
      kín, kiểm bằng một khoá công bố)</td></tr><tr><td>base64url</td><td>base64 đổi
      <code>+</code> thành <code>-</code>, <code>/</code> thành <code>_</code>, bỏ
      dấu <code>=</code> ở cuối</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: 'Bảng này giải mã các từ của một mã Token tự mang thông tin. Đó là mã ba
      phần, gồm phần đầu, phần thân và chữ ký, nối bằng dấu chấm. Phần đầu ghi thuật
      toán ký, ở đây là HMAC dùng SHA256. Phần thân ghi các trường: người phát hành,
      chủ thể, người nhận, hạn dùng và lúc cấp. Với thuật toán của bài này, chữ ký
      là HMAC của chuỗi đầu chấm thân, tính bằng khoá bí mật của máy chủ, còn có thuật
      toán khác ký bằng một cặp khoá. Cách viết cơ số sáu mươi tư cho đường dẫn thay
      hai ký tự dễ gây hiểu lầm trong đường dẫn, và bỏ dấu bằng ở cuối.'
- id: intuition
  kind: intuition
  title: 'Hình dung: ai cũng đọc được, chỉ máy chủ ký được'
  checks:
  - len(alg.bnx_jwt_part(1)) == 94
  - len(alg.bnx_jwt_part(2)) == 43
  - alg.bnx_jwt_part(0).startswith('eyJ0eXAi')
  - alg.bnx_jwt_part(1).startswith('eyJpc3Mi')
  - alg.bnx_jwt_part(2).startswith('dBjftJeZ')
