scenes:
- id: hook
  kind: hook
  title: Sửa một chữ số để mã sống tới năm 2264?
  checks:
  - len(alg.bnx_jwt_rfc_token().split('.')) == 3
  - alg.bnx_utc(9300819380)[:4] == '2264'
  - alg.bnx_jwt_check(alg.bnx_jwt_tamper(), alg.bnx_jwt_rfc7515()[2], 'api-a', 1300819379)
    == 'chữ ký sai'
  steps:
  - show: '<p>Khách đăng nhập ứng dụng ngân hàng một lần, rồi mỗi lời gọi tới các
      dịch vụ đều kèm một <b>mã truy cập</b>.

      Mã có dạng ba phần nối bằng hai dấu chấm: <code>eyJ0eXAi….eyJpc3Mi….dBjftJeZ…</code></p>

      <div class="box key">Phần giữa ghi hạn dùng <b>1300819380</b>. Kẻ gian sửa <b>một
      chữ số</b> thành <b>9300819380</b>, tức năm <b>2264</b>.

      Dịch vụ có nhận không, khi nó không hỏi cơ sở dữ liệu?</div>

      '
    focus:
    - 1
    - - 2
    - 2
    say: Chào bạn, khách đăng nhập ứng dụng ngân hàng một lần, rồi mỗi lời gọi kèm
      một mã truy cập ba phần nối bằng hai dấu chấm. Phần giữa ghi hạn dùng, kẻ gian
      sửa đúng một chữ số đầu, từ một thành chín, để mã sống tới năm hai nghìn hai
      trăm sáu mươi tư. Dịch vụ có nhận mã đó không, khi nó không hỏi lại cơ sở dữ
      liệu?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>mã
      mang được thông tin gì, ai đọc được</td><td>phần đầu và phần thân chỉ được viết
      lại, ai cầm mã cũng đọc được</td></tr><tr><td>vì sao sửa một ký tự là lộ</td><td>chữ
      ký tính trên đúng từng byte, chỉ máy chủ có khoá mới tính được</td></tr><tr><td>chữ
      ký đúng đã đủ chưa</td><td>chưa: còn kiểm hạn dùng, người phát hành, người nhận,
      và lo chuyện thu hồi</td></tr><tr><td>mã bị lộ thì kẻ gian dùng được bao lâu</td><td>đo
      thật: hạn 300 giây so với hạn 3 600 giây</td></tr></table>'
    say: 'Hôm nay ta trả lời bốn câu: mã mang thông tin gì và ai đọc được, vì sao
      sửa một ký tự là bị lộ. Vì sao chữ ký đúng vẫn chưa đủ, và khi mã bị lộ thì
      kẻ gian dùng được bao lâu.'
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_b64u(b'abc') == 'YWJj'
  - len(alg.bnx_jwt_rfc7515()[0]) == 30
  - alg.bnx_b64u_len(30) == 40
  - len(alg.bnx_jwt_part(0)) == 40
  - alg.bnx_b64u_len(32) == 43
  - len(alg.bnx_jwt_rfc7515()[2]) == 64
  - alg.bnx_utc(1300819380) == '2011-03-22 18:43:00'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      byte, bit và base64url</td><td>1 <b>byte</b> gồm 8 <b>bit</b>, mỗi bit là 0
      hoặc 1; base64url viết dãy byte bằng 64 ký tự an toàn cho đường dẫn; mỗi ký
      tự mang 6 bit, nên 3 byte (24 bit) thành 4 ký tự; dư 1 byte thành 2 ký tự, dư
      2 byte thành 3 ký tự</td><td><code>abc</code> (3 byte) → <code>YWJj</code></td></tr><tr><td>②
      JSON</td><td>văn bản dạng khoá và giá trị</td><td><code>{"iss":"joe"}</code></td></tr><tr><td>③
      SHA256</td><td>hàm băm: đầu vào dài bao nhiêu cũng ra 32 byte; đổi 1 ký tự là
      ra kết quả khác hẳn</td><td>32 byte → 43 ký tự base64url</td></tr><tr><td>④
      HMAC</td><td>băm có trộn một khoá bí mật: không có khoá thì không tính được</td><td>khoá
      64 byte của ví dụ</td></tr><tr><td>⑤ giờ Unix</td><td>số giây kể từ 0 giờ ngày
      1/1/1970 theo giờ quốc tế</td><td>1300819380 → 22/3/2011 18:43:00</td></tr></table>'
    introduces:
    - bnx_base64url
    - bnx_hmac
    say: Trước hết ta cần hiểu năm điều, thứ nhất, một byte gồm tám bit. Cách viết
      cơ số sáu mươi tư cho đường dẫn cho mỗi ký tự mang sáu bit, nên ba byte thành
      bốn ký tự. Thứ hai, dữ liệu trong mã là các cặp tên và giá trị. Thứ ba, SHA256
      là hàm băm, ra ba mươi hai byte. Thứ tư, HMAC là băm trộn khoá bí mật nên không
      có khoá thì không tính được. Thứ năm, thời điểm là số giây từ năm một nghìn
      chín trăm bảy mươi.
  - show: '<p>Làm thử: phần đầu của ví dụ dài 30 byte, tức 10 nhóm 3 byte.</p>

      $$10 \cdot 4 = \hl{40}\ \text{ký tự}$$

      '
    say: Làm thử, phần đầu của ví dụ dài ba mươi byte, tức mười nhóm ba byte, mỗi
      nhóm thành bốn ký tự nên ta được bốn mươi ký tự.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã các từ của một JWT
  checks:
  - alg.bnx_b64u(bytes([251, 255])) == '-_8'
  - '''='' not in alg.bnx_jwt_rfc_token()'
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>JWT
      (JSON Web Token)</td><td>mã ba phần: <b>đầu</b> . <b>thân</b> . <b>chữ ký</b>,
      mỗi phần viết bằng base64url</td></tr><tr><td>phần đầu (header)</td><td><code>alg</code>:
      thuật toán ký, ví dụ <code>HS256</code> = HMAC dùng SHA256; <code>typ</code>:
      loại mã, ở đây <code>JWT</code></td></tr><tr><td>phần thân (payload)</td><td>các
      trường: <code>iss</code> người phát hành, <code>sub</code> chủ thể, <code>aud</code>
      người nhận, <code>exp</code> hạn dùng, <code>iat</code> lúc cấp</td></tr><tr><td>chữ
      ký (signature)</td><td>với HS256: HMAC của chuỗi “đầu.thân” bằng khoá bí mật
      của máy chủ (thuật toán khác ký bằng một khoá giữ kín, kiểm bằng một khoá công
      bố)</td></tr><tr><td>base64url</td><td>base64 đổi <code>+</code> thành <code>-</code>,
      <code>/</code> thành <code>_</code>, bỏ dấu <code>=</code> ở cuối</td></tr></table>'
    say: 'Mã này có ba phần nối bằng dấu chấm: đầu, thân và chữ ký. Phần đầu ghi thuật
      toán ký và loại mã, phần thân ghi người phát hành, chủ thể, người nhận, hạn
      dùng và lúc cấp. Chữ ký là HMAC của chuỗi đầu chấm thân, tính bằng khoá bí mật
      của máy chủ.'
