- id: formula
  kind: formula
  title: 'Suy ra từng bước: dựng thủ tục chuyển tiền bằng T-SQL'
  checks:
  - alg.bnx_l06_lock_order(2, 1) == (1, 2)
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 500000) == (False, {1: 300000,
    2: 1000000})'
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 200000) == (True, {1: 100000,
    2: 1200000})'
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>CREATE
      OR ALTER PROCEDURE dbo.chuyen_tien … AS BEGIN … END;</code></td><td>tạo thủ
      tục, hoặc thay bản cũ nếu đã có; sau <code>AS</code>, khối <code>BEGIN … END</code>
      là thân thủ tục</td></tr><tr><td><code>BEGIN TRAN;</code> … <code>COMMIT;</code>
      … <code>ROLLBACK;</code></td><td>mở giao dịch; chốt (giữ lại); hoàn tác (huỷ
      hết)</td></tr><tr><td><code>SELECT SUM(so_du) AS tong FROM dbo.tk;</code></td><td>cộng
      cột <code>so_du</code> của mọi dòng, đặt tên cột kết quả là <code>tong</code></td></tr></table>
    clear: true
    say: Mã có chỗ lạ nên ta đọc trước. Tạo thủ tục hoặc thay bản cũ, thân nằm giữa
      chữ bắt đầu và kết thúc. Mở giao dịch, chốt để giữ lại, hoặc hoàn tác để huỷ
      hết. Cộng số dư mọi dòng, gọi kết quả là tổng.
  - show: '<p><b>Bước 1. Tham số, rồi bật huỷ cả giao dịch khi lỗi.</b> Bốn tham số;
      <code>@status</code> là tham số ra.</p><div class="code"><div>CREATE OR ALTER
      PROCEDURE dbo.chuyen_tien</div><div>  @from   INT,</div><div>  @to     INT,</div><div>  @amt    BIGINT,</div><div>  @status
      VARCHAR(20) OUTPUT</div><div>AS</div><div>BEGIN</div><div>  SET NOCOUNT ON;</div><div>  SET
      XACT_ABORT ON;</div><div>  DECLARE @x BIGINT, @bal BIGINT;</div></div><p class=''note''>Làm
      thử: chuyển 200 000 từ 1 sang 2 thì @from = 1, @to = 2, @amt = 200 000. <code>GO</code>
      không phải lệnh của máy chủ, chỉ báo công cụ gửi lô.</p>'
    focus:
    - - 1
    - 2
    - 3
    clear: true
    say: Bước một là tham số, vì người gọi phải nói chuyển từ đâu, tới đâu và bao
      nhiêu, nên thủ tục có ba tham số vào và một tham số ra để trả chữ trạng thái.
      Vì muốn lỗi nào cũng hoàn tác cả giao dịch, nên ta bật tuỳ chọn huỷ cả giao
      dịch khi lỗi ngay từ đầu. Biến ở dòng cuối giữ tạm số dư đọc được.
  - show: '<p><b>Bước 2. Khối thử:</b> chặn số tiền không dương, mở giao dịch, khoá
      theo mã tăng dần, kiểm số dư.</p><div class="code"><div>  BEGIN TRY</div><div>    IF
      @amt IS NULL OR @amt &lt;= 0</div><div>      THROW 50002, ''So tien phai lon
      hon 0'', 1;</div><div>    BEGIN TRAN;</div><div>    SELECT @x = so_du FROM dbo.tk
      WITH (UPDLOCK, ROWLOCK)</div><div>     WHERE id = LEAST(@from, @to);</div><div>    SELECT
      @x = so_du FROM dbo.tk WITH (UPDLOCK, ROWLOCK)</div><div>     WHERE id = GREATEST(@from,
      @to);</div><div>    SELECT @bal = so_du FROM dbo.tk WHERE id = @from;</div><div>    IF
      @bal &lt; @amt</div><div>      THROW 50001, ''So du khong du'', 1;</div></div><p
      class=''note''>Làm thử: 300 000 &lt; 500 000 nên <code>THROW 50001</code>; gọi
      với −100 000 thì <code>THROW 50002</code>.</p>'
    focus:
    - - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước hai là khối thử, nó chặn số tiền không dương bằng lỗi năm mươi nghìn
      lẻ hai, rồi mở giao dịch. Vì hai lệnh khoá ngược thứ tự sẽ bế tắc, ta khoá hai
      tài khoản theo mã tăng dần. Hai hàm số nhỏ hơn và số lớn hơn có từ bản hai nghìn
      không trăm hai mươi hai. Thiếu tiền thì ném lỗi năm mươi nghìn lẻ một.
  - show: '<p><b>Bước 3. Ghi, chốt; khối bắt lỗi hoàn tác nếu còn giao dịch mở, rồi
      ném lại lỗi.</b></p><div class="code"><div>    UPDATE dbo.tk SET so_du = so_du
      - @amt WHERE id = @from;</div><div>    UPDATE dbo.tk SET so_du = so_du + @amt
      WHERE id = @to;</div><div>    COMMIT;</div><div>    SET @status = ''OK'';</div><div>  END
      TRY</div><div>  BEGIN CATCH</div><div>    IF @@TRANCOUNT &gt; 0 ROLLBACK;</div><div>    THROW;</div><div>  END
      CATCH</div><div>END;</div><div>GO</div></div><p class=''note''>Làm thử: lỗi
      ở bước 2 thì <code>@@TRANCOUNT</code> = 1, nên hoàn tác; người gọi nhận lỗi,
      tổng vẫn 1 300 000.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba trừ, cộng, chốt rồi ghi trạng thái. Lỗi có thể xảy ra trước hay sau
      khi mở giao dịch, nên khối bắt lỗi kiểm biến đếm giao dịch. Còn mở thì hoàn
      tác, rồi ném lại lỗi vừa bắt để người gọi biết. Lỗi ở bước hai làm biến đếm
      bằng một, nên giao dịch được hoàn tác và tổng vẫn một triệu ba trăm nghìn.
- id: example
  kind: example
  title: Ví dụ chạy thật trên SQL Server, từng phép tính
  checks:
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 500000)[0] is False'
  - 'alg.bnx_l06_total(alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 500000)[1])
    == 1300000'
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 200000)[1] == {1: 100000,
    2: 1200000}'
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 300000, 2: 1000000}, [(2, 500000), (1,
    -500000)], False)) == 1800000'
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 300000, 2: 1000000}, [(2, 500000), (1,
    -500000)], True)) == 1300000'
  steps:
  - show: <p>Gọi thủ tục chuyển $500\,000$ từ A sang B, rồi cộng tổng.</p><div class="code"><div>DECLARE
      @st VARCHAR(20);</div><div>EXEC dbo.chuyen_tien 1, 2, 500000, @st OUTPUT;</div><div>GO</div><div>SELECT
      SUM(so_du) AS tong FROM dbo.tk;</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>Msg 50001, Level 16, State 1, …</div><div>So du khong du</div><div>1300000</div></div>$$①
      \; 300\,000 < 500\,000 \;\Rightarrow\; \hl{\text{THROW 50001, tổng giữ } 1\,300\,000}$$
    focus:
    - - 1
      - 2
    - 4
    introduces:
    - implies
    clear: true
    say: Ta chạy thật trên máy chủ SQL, chuyển năm trăm nghìn từ tài khoản một sang
      hai khiến thủ tục ném lỗi năm mươi nghìn lẻ một, vì ba trăm nghìn nhỏ hơn năm
      trăm nghìn. Khối bắt lỗi đã hoàn tác, nên tổng vẫn một triệu ba trăm nghìn.
  - show: <p>Gọi lại với $200\,000$:</p><div class="code"><div>DECLARE @st VARCHAR(20);</div><div>EXEC
      dbo.chuyen_tien 1, 2, 200000, @st OUTPUT;</div><div>SELECT @st AS trang_thai;</div><div>SELECT
      ten, so_du FROM dbo.tk;</div><div>SELECT SUM(so_du) AS tong FROM dbo.tk;</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>OK</div><div>A 100000</div><div>B
      1200000</div><div>1300000</div></div>$$② \; 300\,000 - 200\,000 = \hl{100\,000};
      \quad ③ \; 1\,000\,000 + 200\,000 = \hl{1\,200\,000}; \quad ④ \; \hlg{1\,300\,000}$$
    clear: true
    say: 'Chuyển hai trăm nghìn thì trạng thái thành công: A còn một trăm nghìn, B
      thành một triệu hai trăm nghìn, tổng vẫn một triệu ba trăm nghìn.'
  - show: <p><b>Dựng lại bảng</b> bằng đúng khối ở phần đầu, để A và B về $300\,000$
      và $1\,000\,000$ trước phép thử lỗi giữa chừng:</p><div class="code"><div>IF
      DB_ID('bnx_l37') IS NULL CREATE DATABASE bnx_l37;</div><div>GO</div><div>USE
      bnx_l37;</div><div>GO</div><div>DROP TABLE IF EXISTS dbo.tk;</div><div>CREATE
      TABLE dbo.tk (</div><div>  id    INT PRIMARY KEY,</div><div>  ten   VARCHAR(10),</div><div>  so_du
      BIGINT CONSTRAINT ck_so_du CHECK (so_du &gt;= 0));</div><div>INSERT INTO dbo.tk
      VALUES (1, 'A', 300000), (2, 'B', 1000000);</div><div>GO</div></div>
    clear: true
    say: Trước phép thử lỗi giữa chừng, ta dựng lại bảng bằng đúng khối ở phần đầu,
      để A và B về ba trăm nghìn và một triệu.
  - show: <p>Cùng lỗi giữa chừng, tuỳ chọn huỷ cả giao dịch khi lỗi <b>tắt</b> (mặc
      định). Dòng <code>GO</code> chia khối thành hai lô:</p><div class="code"><div>SET
      XACT_ABORT OFF;</div><div>BEGIN TRAN;</div><div>UPDATE dbo.tk SET so_du = so_du
      + 500000 WHERE id = 2;</div><div>UPDATE dbo.tk SET so_du = so_du - 500000 WHERE
      id = 1;</div><div>GO</div><div>IF @@TRANCOUNT &gt; 0 COMMIT;</div><div>SELECT
      SUM(so_du) AS tong FROM dbo.tk;</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>Msg 547, Level 16, State 1, …</div><div>The UPDATE statement
      conflicted with the CHECK constraint …</div><div>The statement has been terminated.</div><div>1800000</div></div>$$⑤
      \; 1\,300\,000 + 500\,000 = \hl{1\,800\,000}$$
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Giờ chạy cùng lỗi giữa chừng khi tuỳ chọn huỷ cả giao dịch đang tắt, đúng
      như mặc định. Câu trừ A lỗi, nhưng chỉ riêng câu đó bị huỷ. Giao dịch vẫn mở
      nên lệnh chốt chạy, phần cộng cho B ở lại, tổng thành một triệu tám trăm nghìn.
  - show: <p><b>Dựng lại bảng lần nữa</b>, vì phép thử vừa rồi để lại tổng $1\,800\,000$;
      nếu không dựng lại, lệnh chạy tiếp từ trạng thái hỏng đó sẽ in lại $1\,800\,000$:</p><div
      class="code"><div>IF DB_ID('bnx_l37') IS NULL CREATE DATABASE bnx_l37;</div><div>GO</div><div>USE
      bnx_l37;</div><div>GO</div><div>DROP TABLE IF EXISTS dbo.tk;</div><div>CREATE
      TABLE dbo.tk (</div><div>  id    INT PRIMARY KEY,</div><div>  ten   VARCHAR(10),</div><div>  so_du
      BIGINT CONSTRAINT ck_so_du CHECK (so_du &gt;= 0));</div><div>INSERT INTO dbo.tk
      VALUES (1, 'A', 300000), (2, 'B', 1000000);</div><div>GO</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Phép thử vừa rồi để lại tổng một triệu tám trăm nghìn, nên ta dựng lại bảng
      bằng cùng khối. Nếu chạy tiếp từ trạng thái hỏng đó, kết quả vẫn là một triệu
      tám trăm nghìn.
  - show: '<p>Bảng đã dựng lại. Chỉ đổi một dòng: bật <code>XACT_ABORT</code>.</p><div
      class="code"><div>SET XACT_ABORT ON;</div><div>BEGIN TRAN;</div><div>UPDATE
      dbo.tk SET so_du = so_du + 500000 WHERE id = 2;</div><div>UPDATE dbo.tk SET
      so_du = so_du - 500000 WHERE id = 1;</div><div>GO</div><div>IF @@TRANCOUNT &gt;
      0 COMMIT;</div><div>SELECT SUM(so_du) AS tong FROM dbo.tk;</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>Msg 547, Level 16, State 1, …</div><div>The
      UPDATE statement conflicted with the CHECK constraint …</div><div>1300000</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Chỉ đổi một dòng, bật tuỳ chọn huỷ cả giao dịch khi lỗi. Lần này câu lỗi
      hoàn tác luôn phần cộng cho B và bỏ phần còn lại của lô, nên không còn gì để
      chốt, tổng giữ một triệu ba trăm nghìn.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: Java gọi thủ tục qua JDBC'
  checks:
  - alg.bnx_l37_rows(1, 'A', True, 'A') == 1 and alg.bnx_l37_rows(2, "X' OR '1'='1",
    True) == 0
  steps:
  - show: '<table class=''t''><tr><th>cần có để chạy lại</th><th>chi tiết</th></tr><tr><td>Oracle
      Free trong Docker</td><td>tài khoản <code>bnx</code>; mật khẩu đặt vào biến
      môi trường <code>BNX_PASS</code></td></tr><tr><td>thư viện kết nối</td><td>tệp
      jar <code>ojdbc11-23.26.4.0.0.jar</code> tải từ <code>repo1.maven.org/maven2/com/oracle/database/jdbc/ojdbc11/</code>,
      đưa vào <code>-cp</code> khi biên dịch và chạy</td></tr><tr><td>bảng và thủ
      tục</td><td>bảng <code>bnx_l06_tk</code> (id, ten, so_du) với A 300 000 và B
      1 000 000; thủ tục <code>bnx_l06_chuyen_tien(p_from, p_to, p_amt, p_status OUT)</code>
      cùng ý như thủ tục T-SQL: thiếu tiền thì báo lỗi mã 20001</td></tr></table>'
    clear: true
    say: 'Ta kiểm bằng đường khác: chương trình Java gọi thủ tục qua thư viện kết
      nối chuẩn. Muốn chạy lại cần Oracle trong Docker, mật khẩu trong biến môi trường,
      tệp thư viện, và thủ tục cùng ý với thủ tục T-SQL nên kết quả so được.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>public
      class Goi { … }</code>, <code>public static void main(String[] args) throws
      Exception</code></td><td>khai lớp <code>Goi</code>; <code>main</code> là hàm
      máy chạy đầu tiên, <code>args</code> là mảng chuỗi gõ kèm lúc chạy; <code>throws
      Exception</code>: hàm có thể ném lỗi</td></tr><tr><td><code>import java.sql.*;</code>,
      <code>long tien</code>, <code>String goi = "…"</code></td><td>nạp mọi lớp của
      gói <code>java.sql</code>; khai biến: kiểu, tên, rồi <code>=</code> giá trị;
      <code>long</code>: số nguyên lớn</td></tr><tr><td><code>catch (SQLException
      e) { … e.getErrorCode() … }</code></td><td>lỗi cơ sở dữ liệu thì nhảy vào khối
      <code>catch</code>; <code>e.getErrorCode()</code> cho mã lỗi</td></tr></table>'
    clear: true
    say: Mã Java có chỗ lạ nên ta đọc trước. Hàm chính là chỗ máy bắt đầu chạy, và
      lời báo rằng hàm có thể ném lỗi. Nạp các lớp kết nối; khai biến là kiểu, tên,
      giá trị. Lỗi cơ sở dữ liệu nhảy vào khối bắt lỗi, hàm lấy ra mã lỗi.
  - show: '<p><b>Goi.java (1/4): đưa lớp kết nối vào, khai báo lớp, mở kết nối, mật
      khẩu lấy từ biến môi trường</b></p><div class="code"><div>import java.sql.*;</div><div>
      </div><div>public class Goi {</div></div><div class="code"><div>  public static
      void main(String[] args) throws Exception {</div><div>    String url = "jdbc:oracle:thin:@//localhost:1521/FREEPDB1";</div><div>    String
      pass = System.getenv("BNX_PASS");</div><div>    try (Connection c = DriverManager.getConnection(</div><div>             url,
      "bnx", pass)) {</div><div>      chuyen(c, 500000);</div><div>      chuyen(c,
      200000);</div><div>    }</div><div>  }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Địa chỉ ghi giao thức, máy, cổng và tên dịch vụ. Mật khẩu lấy từ biến môi
      trường nên không nằm trong mã, và khối thử mở ngoặc tự đóng kết nối khi xong,
      kể cả khi có lỗi.
  - show: '<p><b>Goi.java (2/4): gọi thủ tục, tham số ra, lỗi thành ngoại lệ</b></p><div
      class="code"><div>  static void chuyen(Connection c, long tien) {</div><div>    String
      goi = "{call bnx_l06_chuyen_tien(?, ?, ?, ?)}";</div><div>    try (CallableStatement
      cs = c.prepareCall(goi)) {</div><div>      cs.setLong(1, 1); cs.setLong(2, 2);</div><div>      cs.setLong(3,
      tien);</div><div>      cs.registerOutParameter(4, Types.VARCHAR);</div><div>      cs.execute();</div><div>      System.out.println(tien
      + ": " + cs.getString(4));</div><div>    } catch (SQLException e) {</div><div>      System.out.println(tien
      + ": loi " + e.getErrorCode());</div><div>    }</div><div>  }</div></div>'
    focus:
    - - 1
    - 2
    - 2
    clear: true
    say: Hàm chuyển gọi thủ tục, chuỗi trong ngoặc nhọn là cú pháp gọi thủ tục, mỗi
      dấu chấm hỏi là một tham số. Ba tham số vào gán bằng số, tham số thứ tư là tham
      số ra nên phải đăng ký kiểu chữ trước. Thủ tục ném lỗi thì Java nhận ngoại lệ
      mang mã hai mươi nghìn lẻ một.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>new
      String[] {"A", "X'' OR ''1''=''1"}</code>, <code>for (String ten : …)</code></td><td>tạo
      mảng chuỗi với hai phần tử liệt kê; vòng lặp duyệt từng phần tử, mỗi vòng <code>ten</code>
      là một phần tử</td></tr><tr><td><code>rs.next()</code>, <code>rs.getInt(1)</code></td><td><code>rs</code>
      là bảng kết quả; <code>next()</code> nhảy tới dòng kế tiếp (lần đầu là dòng
      đầu); <code>getInt(1)</code> đọc cột số 1 dạng số nguyên</td></tr></table>'
    clear: true
    say: Mã Java có chỗ lạ nên ta đọc trước. Mảng hai chuỗi, vòng lặp cho biến nhận
      từng chuỗi. Phải nhảy tới dòng đầu rồi mới đọc cột thứ nhất dạng số nguyên.
  - show: '<p><b>Tim.java (3/4): tham số hoá bằng PreparedStatement</b></p><div class="code"><div>import
      java.sql.*;</div><div> </div><div>public class Tim {</div><div>  public static
      void main(String[] args) throws Exception {</div><div>    String url = "jdbc:oracle:thin:@//localhost:1521/FREEPDB1";</div><div>    String
      sql = "SELECT COUNT(*) FROM bnx_l06_tk WHERE ten = ?";</div><div>    try (Connection
      c = DriverManager.getConnection(</div><div>             url, "bnx", System.getenv("BNX_PASS"));</div><div>         PreparedStatement
      ps = c.prepareStatement(sql)) {</div><div>      for (String ten : new String[]
      {"A", "X'' OR ''1''=''1"}) {</div><div>        ps.setString(1, ten);</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Với câu tìm tên, ta dùng câu lệnh chuẩn bị sẵn. Dấu chấm hỏi giữ chỗ cho
      giá trị, và giá trị được gán riêng ở dòng sau, nên chuỗi người dùng gõ không
      bao giờ thành một phần câu lệnh.
  - show: '<p><b>Tim.java (4/4)</b></p><div class="code"><div>        try (ResultSet
      rs = ps.executeQuery()) {</div><div>          rs.next();</div><div>          System.out.println(ten
      + ": " + rs.getInt(1) + " dong");</div><div>        }</div><div>      }</div><div>    }</div><div>  }</div><div>}</div></div><p><b>Kết
      quả chạy thật (Goi rồi Tim)</b></p><div class="code"><div>500000: loi 20001</div><div>200000:
      OK</div><div>A: 1 dong</div><div>X'' OR ''1''=''1: 0 dong</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Kết quả thật khớp với công cụ dòng lệnh nên hai đường cùng kết luận: năm
      trăm nghìn báo lỗi hai mươi nghìn lẻ một, hai trăm nghìn thành công. Tên A một
      dòng, chuỗi tấn công không dòng.'
- id: quymo
  kind: example
  title: 'Khi bảng lớn dần: bao nhiêu dòng lộ ra khi ghép chuỗi'
  checks:
  - '[alg.bnx_l37_rows(n, "X'' OR ''1''=''1", False) for n in (2, 200, 20000)] ==
    [2, 200, 20000]'
  - '[alg.bnx_l37_rows(n, "X'' OR ''1''=''1", True) for n in (2, 200, 20000)] == [0,
    0, 0]'
  - '[2 * 100 ** k for k in range(3)] == [2, 200, 20000]'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>nghĩa</th><th>ví dụ nhỏ</th></tr><tr><td><code>SELECT
      TOP (@n) ''K'' AS ten INTO dbo.tk_lon FROM sys.all_objects a, sys.all_objects
      b</code></td><td><code>FROM … a, … b</code> ghép mỗi dòng của bảng hệ thống
      với mọi dòng của chính nó, ra rất nhiều dòng; <code>TOP (@n)</code> giữ n dòng
      đầu; <code>INTO</code> ghi vào bảng mới; <code>''K'' AS ten</code> là cột hằng
      tên <code>ten</code></td><td><code>@n = 200</code> thì bảng mới có 200 dòng,
      đều tên <code>K</code></td></tr><tr><td><code>WHILE @n &lt;= 20000 … SET @n
      = @n * 100</code></td><td>lặp: mỗi vòng nhân n với 100</td><td>n: 2, 200, 20
      000</td></tr><tr><td><code>@sql NVARCHAR(200)</code>, <code>N''…''</code>, <code>+</code></td><td><code>NVARCHAR(200)</code>:
      chuỗi chữ tối đa 200 ký tự; <code>N''…''</code>: chuỗi hằng kiểu đó; <code>+</code>
      nối chuỗi</td><td><code>N''a'' + N''b''</code> ra <code>ab</code></td></tr><tr><td><code>EXEC
      (@sql)</code></td><td>chạy chuỗi trong <code>@sql</code> như một câu lệnh</td><td><code>@sql
      = N''SELECT 1''</code> thì chạy <code>SELECT 1</code></td></tr></table>'
    clear: true
    say: Mã đo quy mô dùng vài cách viết mới. Ghép bảng hệ thống với chính nó cho
      rất nhiều dòng, rồi chỉ giữ n dòng đầu. Vòng lặp nhân n với một trăm, và chuỗi
      hằng nối bằng dấu cộng được chạy như một câu lệnh.
  - show: <p><b>Bảng có 2, 200, 20 000 dòng; đếm dòng lộ ra (1/2)</b></p><div class="code"><div>SET
      NOCOUNT ON;</div><div>DECLARE @n INT = 2, @sql NVARCHAR(200);</div><div>DECLARE
      @ten VARCHAR(50) = 'X'' OR ''1''=''1';</div><div>WHILE @n &lt;= 20000</div><div>BEGIN</div><div>  DROP
      TABLE IF EXISTS dbo.tk_lon;</div><div>  SELECT TOP (@n) 'K' AS ten INTO dbo.tk_lon</div><div>    FROM
      sys.all_objects a, sys.all_objects b;</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bây giờ xem vấn đề đổi thế nào khi bảng lớn dần. Ta tạo bảng hai dòng, rồi
      hai trăm, rồi hai mươi nghìn dòng. Ta đếm số dòng lộ ra, chứ không đo thời gian,
      nên kết quả luôn như nhau.
  - show: '<p><b>(2/2): mỗi vòng thử hai cách</b></p><div class="code"><div>  SET
      @sql = N''SELECT ''''ghep'''', COUNT(*) FROM dbo.tk_lon WHERE ten = ''''''</div><div>           +
      @ten + N'''''''';</div><div>  EXEC (@sql);</div><div>  EXEC sp_executesql</div><div>    N''SELECT
      ''''tham so'''', COUNT(*) FROM dbo.tk_lon WHERE ten = @p'',</div><div>    N''@p
      VARCHAR(50)'', @p = @ten;</div><div>  SET @n = @n * 100;</div><div>END</div></div>'
    clear: true
    say: Mỗi vòng chạy cùng chuỗi tấn công hai lần, một lần ghép chuỗi, một lần truyền
      tham số.
  - show: '<p><b>Kết quả chạy thật trên SQL Server: số dòng lộ ra</b></p><div class="code"><div>ghep
      2</div><div>tham so 0</div><div>ghep 200</div><div>tham so 0</div><div>ghep
      20000</div><div>tham so 0</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Kết quả thật: ghép chuỗi lộ hai, hai trăm rồi hai mươi nghìn dòng, đúng
      bằng cả bảng, còn tham số luôn không dòng. Bảng càng lớn, kẻ xấu càng lấy được
      nhiều.'
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>tham
      số hoá</td><td>chuỗi chỉ là giá trị; máy dùng lại kế hoạch</td><td>không dùng
      được cho tên bảng, tên cột</td><td>mọi giá trị người dùng gõ</td></tr><tr><td>ghép
      chuỗi</td><td>linh hoạt, ghép được cả tên cột</td><td>mở cửa chèn mã; lộ cả
      bảng</td><td>gần như không bao giờ với giá trị gõ vào</td></tr><tr><td>danh
      sách cho phép</td><td>chỉ nhận tên cột nằm trong danh sách viết sẵn</td><td>phải
      cập nhật danh sách khi thêm cột</td><td>tên cột, tên bảng do người dùng chọn</td></tr></table>
    clear: true
    say: Bảng này cho thấy người làm nghề phải chọn gì. Tham số hoá an toàn nhưng
      không dùng được cho tên cột hay tên bảng, nên với tên cột do người dùng chọn
      ta dùng danh sách cho phép viết sẵn. Ghép chuỗi đổi sự linh hoạt lấy cái giá
      là mở cửa chèn mã.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 300000, 2: 1000000}, [(2, 500000), (1,
    -500000)], False)) == 1800000'
  - alg.bnx_l37_rows(2, "X' OR '1'='1", False) == 2
  - alg.bnx_l37_rows(2, "X' OR '1'='1", True) == 0
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người đã đi làm): tin rằng SQL Server tự
      hoàn tác cả giao dịch.</b> Mặc định tuỳ chọn <code>XACT_ABORT</code> tắt: ví
      dụ ⑤ cho tổng 1 800 000. Chữa: bật nó và để khối bắt lỗi hoàn tác rồi ném lại.</div>'
    say: Lỗi thứ nhất, của người đã đi làm, là tin rằng máy chủ SQL tự hoàn tác cả
      giao dịch. Mặc định tuỳ chọn đang tắt, nên phép tính thứ năm cho tổng một triệu
      tám trăm nghìn. Cách chữa là bật nó, và để khối bắt lỗi hoàn tác rồi ném lại.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm): ghép chuỗi người dùng
      gõ vào câu lệnh động.</b> Người dùng gõ <code>X'' OR ''1''=''1</code>.</div><div
      class="code"><div>DECLARE @ten VARCHAR(50) = ''X'''' OR ''''1''''=''''1'';</div><div>DECLARE
      @sql NVARCHAR(200) =</div><div>  N''SELECT ten, so_du FROM dbo.tk WHERE ten
      = '''''' + @ten + N'''''''';</div><div>EXEC (@sql);</div></div><p class=''note''><code>EXEC
      (@sql)</code>: chạy chuỗi vừa nối như một câu lệnh.</p><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>A 300000</div><div>B 1000000</div><div>(2 rows affected)</div></div>'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Lỗi thứ hai là ghép chuỗi người dùng gõ vào câu lệnh động, tức câu lệnh ghép
      thành chuỗi lúc chạy rồi mới thực thi. Điều kiện một bằng một luôn đúng, nên
      máy trả về cả hai tài khoản. Thủ tục lưu trữ không tự chống được kiểu chèn mã
      này.
  - show: '<div class="code"><div>DECLARE @ten VARCHAR(50) = ''X'''' OR ''''1''''=''''1'';</div><div>EXEC
      sp_executesql</div><div>  N''SELECT ten, so_du FROM dbo.tk WHERE ten = @p'',</div><div>  N''@p
      VARCHAR(50)'', @p = @ten;</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>(0
      rows affected)</div></div><p class=''note''>Truyền chuỗi làm <b>tham số</b>
      qua <code>sp_executesql</code>: cả chuỗi chỉ là một cái tên. Oracle: biến gắn,
      <code>EXECUTE IMMEDIATE … USING</code>.</p>'
    focus:
    - 1
    - 3
    clear: true
    say: Cách chữa là truyền chuỗi đó làm tham số, qua thủ tục hệ thống chạy câu lệnh
      động có tham số. Cả chuỗi chỉ là một cái tên, nên không có dòng nào, và Oracle
      cũng truyền giá trị riêng qua biến gắn.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm): kết nối cẩu thả.</b>
      Mật khẩu viết thẳng trong mã (lọt vào kho mã); mở kết nối mà không đóng; ghép
      chuỗi thay vì <code>PreparedStatement</code>. Chữa: mật khẩu từ biến môi trường,
      <code>try</code> tự đóng, dấu <code>?</code>.</div>'
    clear: true
    say: 'Lỗi thứ ba là kết nối cẩu thả: mật khẩu viết thẳng trong mã lọt vào kho
      mã, kết nối không đóng chiếm chỗ mãi, ghép chuỗi mở cửa chèn mã. Cách chữa là
      mật khẩu từ biến môi trường, khối thử tự đóng, giá trị qua dấu chấm hỏi.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 800000, 2: 200000}, [(2, 900000), (1,
    -900000)], False)) == 1900000'
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 800000, 2: 200000}, [(2, 900000), (1,
    -900000)], True)) == 1000000'
  - alg.bnx_l37_rows(500, "X' OR '1'='1", False) == 500 and alg.bnx_l37_rows(500,
    "X' OR '1'='1", True) == 0
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>A
      = 800 000, B = 200 000, XACT_ABORT tắt. Lô: cộng B 900 000, rồi trừ A 900 000
      (vi phạm ràng buộc), rồi chốt. Tổng cuối? Bật XACT_ABORT thì tổng cuối?</td></tr><tr><td>2</td><td>Bảng
      có 500 dòng cùng tên K, tìm theo chuỗi <code>X'' OR ''1''=''1</code>. Ghép chuỗi
      lộ bao nhiêu dòng? Tham số hoá lộ bao nhiêu?</td></tr><tr><td>3</td><td>Quyết
      định: bảo đảm hoàn tác chỉ bằng <code>XACT_ABORT ON</code>, chỉ bằng <code>TRY…CATCH</code>
      có <code>ROLLBACK</code>, hay cả hai?</td></tr></table>'
    pause: 25
    say: 'Bây giờ tới phần bạn tự làm bài. Câu một: A tám trăm nghìn, B hai trăm nghìn,
      tuỳ chọn tắt; lô cộng B chín trăm nghìn, trừ A chín trăm nghìn vi phạm ràng
      buộc, rồi chốt. Tổng cuối bao nhiêu, và khi bật thì sao? Câu hai: bảng năm trăm
      dòng cùng tên K, ghép chuỗi lộ bao nhiêu dòng, tham số lộ bao nhiêu? Câu ba:
      hoàn tác bằng tuỳ chọn, khối bắt lỗi, hay cả hai? Hãy dừng video và làm ra giấy.'
  - show: '<p>Câu 1: câu trừ A bị huỷ riêng, câu cộng B ở lại.</p>

      $$800\,000 + (200\,000 + 900\,000) = \hl{1\,900\,000}; \quad \text{bật: } 800\,000
      + 200\,000 = \hlg{1\,000\,000}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu một, khi tắt, câu trừ A bị huỷ riêng còn câu cộng B ở lại, nên
      B thành một triệu một trăm nghìn và tổng là một triệu chín trăm nghìn. Khi bật,
      cả lô hoàn tác, tổng giữ một triệu.
    clear: true
  - show: '<p>Câu 2: ghép chuỗi → điều kiện luôn đúng → cả bảng.</p>

      <div class=''box key''>ghép chuỗi: <b>500</b> dòng; tham số hoá: <b>0</b> dòng.</div>

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu hai, ghép chuỗi lộ cả năm trăm dòng, vì điều kiện luôn đúng, còn
      tham số hoá lộ không dòng.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>chỉ
      <code>XACT_ABORT ON</code></td><td>mọi lỗi lúc chạy đều huỷ cả giao dịch</td><td>không
      có chỗ báo lỗi rõ hay dọn dẹp</td></tr><tr><td>chỉ <code>TRY…CATCH</code></td><td>tự
      xử lý và báo lỗi rõ</td><td>quên <code>ROLLBACK</code> là giao dịch dở vẫn chốt</td></tr><tr><td>cả
      hai</td><td>lưới an toàn cộng báo lỗi rõ</td><td>hai điều phải nhớ; khối bắt
      lỗi vẫn phải hoàn tác</td></tr></table>
    say: Đáp án câu ba, nên dùng cả hai. Chỉ dùng tuỳ chọn thì mọi lỗi đều hoàn tác,
      nhưng không có chỗ báo lỗi rõ. Chỉ dùng khối bắt lỗi thì quên lệnh hoàn tác
      là giao dịch dở vẫn chốt. Dùng cả hai thì có lưới an toàn cộng báo lỗi rõ.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: ghép chuỗi so với tham số hoá (sqlite)'
  steps:
  - show: '<p><b>Đề</b>: sqlite có bảng <code>tk (ten, so_du)</code> với 4 tài khoản.
      Viết <code>mau.py</code> có hai hàm tìm theo tên:</p>

      <ol><li><code>ghep(ten)</code>: ghép chuỗi <code>ten</code> thẳng vào câu lệnh</li><li><code>tham_so(ten)</code>:
      truyền <code>ten</code> qua dấu <code>?</code></li></ol>

      <p>Với ba chuỗi cho sẵn (có hai chuỗi tấn công), in mỗi chuỗi một dòng: số dòng
      của cách ghép và cách tham số. SQL Server không có trong bộ chấm: sqlite đại
      diện. Dữ liệu và khuôn dòng in nằm trong <code>de.md</code>.</p>

      '
    focus:
    - 1
    - - 2
      - 3
    pause: 120
    say: Bây giờ tới phần bạn tự làm, trên cơ sở dữ liệu nhỏ có sẵn trong Python vì
      bộ chấm không có máy chủ SQL. Viết hai hàm tìm theo tên, một ghép chuỗi, một
      truyền tham số, rồi thử ba chuỗi cho sẵn và in số dòng của mỗi cách, hãy dừng
      video và tự viết.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>chuoi 1: ghep 1 dong,
      tham so 1 dong</div><div>chuoi 2: ghep 4 dong, tham so 0 dong</div><div>chuoi
      3: ghep 2 dong, tham so 0 dong</div></div><p class="note">Chấm bằng Git Bash:
      <code>bash labs/cham.sh BNX L37 mau.py</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> ghép chuỗi là <code>"... WHERE ten
      = ''" + ten + "''"</code>; tham số là <code>db.execute("... WHERE ten = ?",
      (ten,))</code> — nhớ dấu phẩy để thành bộ một phần tử. Đếm bằng <code>len(...fetchall())</code>.

      Lời giải ở <code>labs/BNX/L37/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, ghép chuỗi là nối tên vào giữa hai dấu nháy đơn, còn tham số là
      truyền tên trong một bộ một phần tử qua dấu chấm hỏi. Đếm bằng độ dài danh sách
      kết quả. Lời giải nằm trong thư mục thực hành.
    clear: true
  lab: labs/BNX/L37
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>bật huỷ cả giao dịch khi lỗi</span><span
      class='a'>→</span><span class='n'>khối bắt lỗi hoàn tác rồi ném lại</span><span
      class='a'>→</span><span class='n'>giá trị đi qua tham số</span><span class='a'>→</span><span
      class='n'>kết nối tự đóng, mật khẩu ngoài mã</span></div>
    say: Tổng kết chuỗi logic, bật tuỳ chọn huỷ cả giao dịch khi lỗi, để khối bắt
      lỗi hoàn tác rồi ném lại. Giá trị người dùng gõ chỉ đi qua tham số. Kết nối
      tự đóng và mật khẩu nằm ngoài mã.
  - show: <div class='box key'><b>Tư duy:</b> đừng tin mặc định của một hệ. Chạy thử
      một lỗi giữa giao dịch và một chuỗi tấn công trên đúng hệ bạn dùng, rồi đo tổng
      tiền và số dòng lộ ra.</div>
    say: Điều cần mang theo, đừng tin mặc định của một hệ. Hãy chạy thử một lỗi giữa
      giao dịch và một chuỗi tấn công trên đúng hệ bạn dùng, rồi đo tổng tiền và số
      dòng lộ ra.
  - show: '<p class="note">Bài sau: hàng đợi nằm ngay trong Oracle, rồi hai cách xử
      lý dữ liệu rất lớn.</p>'
    forward_ref: true
    say: Ở bài sau, ta xem hàng đợi nằm ngay trong cơ sở dữ liệu Oracle, rồi hai cách
      xử lý dữ liệu rất lớn khi một máy không đủ.
