scenes:
- id: hook
  kind: hook
  title: Cùng một lỗi giữa chừng, máy chủ khác thì tiền khác
  checks:
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 300000, 2: 1000000}, [(2, 500000), (1,
    -500000)], False)) == 1800000'
  - alg.bnx_l37_rows(2, "X' OR '1'='1", False) == 2
  steps:
  - show: '<p>Cùng hai tài khoản A $300\,000$ và B $1\,000\,000$, cùng lệnh chuyển
      $500\,000$ lỗi giữa chừng. Trên Oracle, với thủ tục có khối ngoại lệ hoàn tác,
      giao dịch hoàn tác <small>(không đo ở bài này)</small>. Trên SQL Server, ở chế
      độ mặc định, tổng thành <b class="red">$1\,800\,000$</b>.</p>

      <div class="box warn">Và một ô tìm tên tài khoản: người gõ <code>X'' OR ''1''=''1</code>
      lấy được <b>mọi</b> dòng của bảng.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, hai tài khoản A ba trăm nghìn và B một triệu, lệnh chuyển năm trăm
      nghìn bị lỗi giữa chừng. Trên Oracle, thủ tục có khối ngoại lệ hoàn tác thì
      giao dịch hoàn tác, nhưng bài này không đo điều đó. Trên máy chủ SQL, ở chế
      độ mặc định, tổng thành một triệu tám trăm nghìn. Và ô tìm tên ghép chuỗi có
      thể lộ mọi dòng của bảng.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>viết
      thủ tục chuyển tiền bằng T-SQL</td><td>T-SQL là ngôn ngữ thủ tục riêng của SQL
      Server; chạy thật và đọc kết quả</td></tr><tr><td>lỗi giữa chừng thì sao</td><td>tuỳ
      chọn <code>XACT_ABORT</code>: khi bật, lỗi lúc chạy huỷ cả giao dịch</td></tr><tr><td>chuỗi
      người dùng gõ thành câu lệnh</td><td>chèn mã: kẻ xấu đưa câu lệnh vào chuỗi
      người dùng gõ; chặn bằng tham số</td></tr><tr><td>Java gọi thủ tục, mở kết nối
      an toàn</td><td>JDBC: thư viện kết nối cơ sở dữ liệu chuẩn của Java</td></tr></table>'
    introduces:
    - bnx_tsql
    - bnx_xact_abort
    - bnx_chen_ma
    - bnx_jdbc
    clear: true
    say: Hôm nay ta trả lời bốn câu, viết thủ tục chuyển tiền bằng ngôn ngữ riêng
      của máy chủ SQL; lỗi giữa chừng thì sao khi tuỳ chọn huỷ cả giao dịch bật hay
      tắt. Chèn mã là gì và chặn bằng tham số thế nào; Java gọi thủ tục và mở kết
      nối an toàn ra sao.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu, rồi dựng bảng'
  checks:
  - 'alg.bnx_l06_total({1: 300000, 2: 1000000}) == 1300000'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Giao dịch</td><td>nhóm câu lệnh cùng chốt (giữ lại) hoặc cùng hoàn tác (huỷ
      hết)</td><td>trừ A và cộng B: cả hai hoặc không gì</td></tr><tr><td>② Lô lệnh
      và <code>GO</code></td><td>máy nhận lệnh theo lô; dòng <code>GO</code> báo công
      cụ gửi lô phía trên đi chạy</td><td>hai lô: tạo thủ tục, rồi gọi nó</td></tr><tr><td>③
      Biến <code>@</code></td><td>tên bắt đầu bằng @, khai bằng <code>DECLARE</code></td><td><code>DECLARE
      @st VARCHAR(20)</code></td></tr><tr><td>④ Kết nối</td><td>chương trình mở kết
      nối tới cơ sở dữ liệu bằng địa chỉ, tên, mật khẩu, và phải đóng nó sau khi dùng</td><td>mỗi
      kết nối bị bỏ quên là một chỗ chiếm không trả</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều, giao dịch là nhóm câu lệnh cùng chốt hoặc
      cùng hoàn tác. Máy chủ nhận lệnh theo lô, dòng GO báo công cụ gửi lô phía trên
      đi chạy. Biến bắt đầu bằng ký hiệu a còng, khai bằng lệnh khai báo. Kết nối
      là đường chương trình mở tới cơ sở dữ liệu, và phải đóng sau khi dùng.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>IF
      DB_ID(''bnx_l37'') IS NULL CREATE DATABASE …;</code>, <code>USE …;</code></td><td>tạo
      cơ sở dữ liệu nếu chưa có; <code>USE</code> chọn nó để các lệnh sau chạy trong
      đó</td></tr><tr><td><code>dbo.tk</code>, <code>VARCHAR(10)</code>, <code>BIGINT</code></td><td><code>dbo.</code>:
      nhóm mặc định đứng trước tên bảng; <code>VARCHAR(10)</code>: chuỗi chữ tối đa
      10 ký tự; <code>BIGINT</code>: số nguyên lớn</td></tr><tr><td><code>PRIMARY
      KEY</code>, <code>CHECK (so_du &gt;= 0)</code></td><td>khoá chính: mỗi dòng
      một giá trị riêng; ràng buộc kiểm tra: lệnh nào làm số dư âm bị từ chối</td></tr><tr><td><code>INSERT
      INTO dbo.tk VALUES (1, ''A'', 300000), …</code>, <code>DROP TABLE IF EXISTS</code></td><td>thêm
      hai dòng, giá trị theo thứ tự cột; <code>DROP … IF EXISTS</code> xoá bảng cũ
      nếu có</td></tr></table>'
    clear: true
    say: Tạo cơ sở dữ liệu nếu chưa có rồi chọn nó. Nhóm mặc định đứng trước tên bảng,
      chuỗi tối đa mười ký tự, số nguyên lớn. Khoá chính định danh dòng, ràng buộc
      kiểm tra cấm số dư âm. Chèn thêm hai dòng, và xoá bảng cũ nếu có.
  - show: <p>Dựng bảng hai tài khoản trên SQL Server 2022 (RTM-CU27-GDR 16.0.4315.2),
      trong Docker.</p><div class="code"><div>IF DB_ID('bnx_l37') IS NULL CREATE DATABASE
      bnx_l37;</div><div>GO</div><div>USE bnx_l37;</div><div>GO</div><div>DROP TABLE
      IF EXISTS dbo.tk;</div><div>CREATE TABLE dbo.tk (</div><div>  id    INT PRIMARY
      KEY,</div><div>  ten   VARCHAR(10),</div><div>  so_du BIGINT CONSTRAINT ck_so_du
      CHECK (so_du &gt;= 0));</div><div>INSERT INTO dbo.tk VALUES (1, 'A', 300000),
      (2, 'B', 1000000);</div><div>GO</div></div>$$300\,000 + 1\,000\,000 = \hlg{1\,300\,000}$$
    focus:
    - 1
    - 2
    clear: true
    say: Ta dựng cơ sở dữ liệu và bảng trên máy chủ SQL hai nghìn không trăm hai mươi
      hai, chạy trong Docker. Hai dòng chèn thêm hai tài khoản, tổng một triệu ba
      trăm nghìn.
- id: sym
  kind: symbol
  title: Giải mã từ khoá T-SQL
  checks:
  - alg.bnx_l06_lock_order(2, 1) == (1, 2)
  steps:
  - show: <table class='t'><tr><th>T-SQL (SQL Server)</th><th>nghĩa</th></tr><tr><td><code>@amt
      BIGINT</code>, <code>@status … OUTPUT</code></td><td>tham số bắt đầu bằng @;
      <code>OUTPUT</code> là tham số ra</td></tr><tr><td><code>SET NOCOUNT ON</code></td><td>tắt
      dòng báo số hàng bị ảnh hưởng</td></tr><tr><td><code>SET XACT_ABORT ON</code></td><td>câu
      lệnh lỗi lúc chạy làm hoàn tác <b>cả</b> giao dịch</td></tr><tr><td><code>BEGIN
      TRY … END TRY BEGIN CATCH … END CATCH</code></td><td>khối thử; khối bắt lỗi
      chạy khi khối thử lỗi</td></tr></table>
    say: Bảng này giải mã từ khoá T-SQL, tham số bắt đầu bằng ký hiệu a còng, và từ
      khoá sau tham số đánh dấu tham số ra. Một lệnh tắt dòng báo số hàng bị ảnh hưởng.
      Tuỳ chọn huỷ giao dịch khi lỗi, lúc bật, làm câu lệnh lỗi hoàn tác cả giao dịch.
      Khối bắt lỗi chạy khi khối thử có lỗi.
  - show: '<table class=''t''><tr><th>T-SQL (SQL Server)</th><th>nghĩa</th></tr><tr><td><code>WITH
      (UPDLOCK, ROWLOCK)</code></td><td>khoá để cập nhật, khoá từng hàng: đọc dòng
      và giữ khoá tới khi chốt, giống <code>FOR UPDATE</code> ở cuối câu <code>SELECT</code>
      của Oracle</td></tr><tr><td><code>@@TRANCOUNT</code></td><td>số lệnh mở giao
      dịch chưa kết thúc; lớn hơn 0 là còn giao dịch mở</td></tr><tr><td><code>THROW
      50001, ''…'', 1;</code> và <code>THROW;</code></td><td>báo lỗi gồm ba phần:
      mã (từ 50000 do mình chọn), thông báo, số trạng thái (ở đây 1); đứng một mình
      trong khối bắt lỗi thì ném lại lỗi vừa bắt</td></tr><tr><td><code>EXEC dbo.chuyen_tien
      1, 2, 500000, @st OUTPUT</code></td><td>gọi thủ tục theo tên, truyền tham số
      theo thứ tự</td></tr><tr><td><code>sp_executesql</code></td><td>thủ tục có sẵn
      chạy một câu lệnh ghép sẵn, kèm giá trị truyền riêng</td></tr></table>'
    introduces:
    - bnx_sp_executesql
    clear: true
    say: Bảng thứ hai nói về khoá, đếm giao dịch và lệnh gọi. Hai gợi ý trong ngoặc
      là khoá để cập nhật, khoá từng hàng, giống khoá dòng của Oracle. Biến đếm cho
      biết còn giao dịch mở hay không. Lệnh ném báo lỗi gồm mã riêng, thông báo và
      số trạng thái, đứng một mình thì ném lại lỗi vừa bắt. Thủ tục có sẵn cuối chạy
      câu lệnh ghép sẵn, kèm giá trị truyền riêng.
  - show: '<table class=''t''><tr><th>viết / thấy trên màn hình</th><th>nghĩa</th></tr><tr><td>bế
      tắc</td><td>hai giao dịch mỗi bên giữ một khoá và chờ khoá của bên kia, nên
      không bên nào đi tiếp. Ví dụ: A giữ tài khoản 1 chờ 2, B giữ tài khoản 2 chờ
      1</td></tr><tr><td><code>Msg 547, Level 16, State 1</code></td><td>đầu dòng
      lỗi của SQL Server: 547 là mã lỗi vi phạm ràng buộc, 16 là mức nặng (lỗi do
      câu lệnh), 1 là số trạng thái</td></tr><tr><td><code>--</code></td><td>mở đầu
      chú thích SQL: từ đó tới hết dòng bị bỏ qua. Ví dụ: <code>WHERE ten = ''B''
      OR so_du &gt; 600 --''</code> bỏ dấu nháy cuối</td></tr><tr><td><code>''X''''
      OR ''''1''''=''''1''</code></td><td>trong chuỗi SQL, hai dấu nháy đơn liền nhau
      là một dấu nháy thật; nên đây là chuỗi <code>X'' OR ''1''=''1</code></td></tr></table>'
    clear: true
    say: Bảng này nói thêm về vài thứ sẽ gặp. Bế tắc là hai giao dịch mỗi bên giữ
      một khoá và chờ khoá của bên kia, nên không bên nào đi tiếp được. Dòng lỗi bắt
      đầu bằng mã lỗi, mức nặng và số trạng thái. Hai gạch ngang mở đầu chú thích,
      và trong chuỗi, hai nháy đơn liền nhau là một nháy thật.
