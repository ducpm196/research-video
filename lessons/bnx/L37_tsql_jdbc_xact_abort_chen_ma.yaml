    clear: true
    say: Hình này cho thấy số phận giao dịch khi một câu lỗi. Câu một cộng B thành
      công, câu hai trừ A lỗi vì cấm số dư âm. Ở chế độ mặc định của máy chủ SQL,
      chỉ câu hai bị huỷ, giao dịch vẫn mở, chốt thì phần cộng B còn, tổng thành một
      triệu tám trăm nghìn. Bật tuỳ chọn huỷ cả giao dịch, hoặc để khối bắt lỗi hoàn
