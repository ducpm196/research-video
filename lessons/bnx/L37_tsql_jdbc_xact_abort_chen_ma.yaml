source: 'curriculum/bnx.yaml L37; audit/bnx/verify_bnx.py L37; audit/bnx/sources_l37.md:
  Microsoft Learn (SET XACT_ABORT, TRY...CATCH, THROW, sp_executesql, LEAST/GREATEST),
  Java SE 21 API java.sql (CallableStatement, PreparedStatement), Oracle JDBC ojdbc11
  23.26.4.0.0 (đọc 2026-11-14); SQL Server 2022 RTM-CU27-GDR 16.0.4315.2 và Oracle
  AI Database 26ai Free 23.26.3 chạy thật trong Docker'
assumes:
- bnx_ngoai_le
objectives:
- Viết thủ tục chuyển tiền có tham số vào và ra bằng T-SQL và chạy trên SQL Server
  2022
- Nêu và đo tổng tiền khi một lỗi xảy ra giữa giao dịch với XACT_ABORT tắt và bật
- Hoàn tác khi lỗi bằng khối TRY…CATCH có ROLLBACK và THROW
- Đếm số dòng lộ ra khi ghép chuỗi và khi tham số hoá, ở bảng 2, 200 và 20 000 dòng
- Gọi thủ tục từ Java bằng CallableStatement và đọc tham số ra
- 'Mở kết nối an toàn: đóng bằng try-with-resources, lấy mật khẩu từ biến môi trường,
  tham số hoá bằng PreparedStatement'
- Chọn cách chặn chèn mã theo tình huống và nêu cái được, cái mất
- Viết hàm tìm tài khoản theo tên bằng ghép chuỗi và bằng tham số, rồi so số dòng
  với chuỗi tấn công
