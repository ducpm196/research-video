  - 'alg.bnx_pb_decode(bytes.fromhex(''120a30313233343536373839'')) == {2: b''0123456789''}'
  - alg.bnx_deadline_chain(2000, [800, 800, 800]) == [('xong', 2000), ('xong', 1200),
    ('hết giờ', 400)]
  steps:
  - show: <table class='t'><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>def
      varint(n):</code> … <code>return x</code></td><td>định nghĩa hàm <code>varint</code>
      nhận đầu vào <code>n</code>; <code>return</code> trả kết quả <code>x</code>
      ra; chữ sau dấu <code>#</code> là chú thích, máy bỏ qua</td></tr><tr><td><code>while
      True:</code> … <code>return</code></td><td>lặp mãi cho tới khi gặp <code>return</code></td></tr><tr><td><code>b,
      n = n &amp; 0x7F, n &gt;&gt; 7</code></td><td>gán hai biến cùng lúc; <code>0x7F</code>
      là 127 viết thập lục phân</td></tr><tr><td><code>b | 0x80 if n else b</code></td><td>nếu
      <code>n</code> khác 0 thì bật bit 8 của <code>b</code>, không thì giữ <code>b</code></td></tr><tr><td><code>out.append(x)</code>,
      <code>bytes(out)</code></td><td>thêm <code>x</code> vào cuối danh sách; đổi
      danh sách số thành dãy byte</td></tr><tr><td><code>m.hex(" ")</code></td><td>viết
      dãy byte thành các chữ số 16, cách nhau dấu cách</td></tr></table>
    say: Mã Python sắp tới có vài cách viết mới, nên ta giải nghĩa trước. Hàm nhận
      đầu vào rồi trả kết quả ra, vòng lặp mãi chỉ dừng khi trả kết quả. Phép hoặc
      kèm điều kiện bật bit tám khi còn phần sau, và dãy byte được in ra thập lục
      phân.
  - show: '<p><b>Chương trình Python mã hoá</b></p><div class="code"><div>def varint(n):                   #
      số nguyên không âm → byte</div><div>    out = []</div><div>    while True:</div><div>        b,
      n = n &amp; 0x7F, n &gt;&gt; 7        # 0x7F = 127: giữ 7 bit thấp</div><div>        out.append(b
      | 0x80 if n else b)   # 0x80 = 128: bật bit 8</div><div>        if n == 0:</div><div>            return
      bytes(out)</div><div> </div><div>def field(num, wire, payload):</div><div>    return
      varint(num &lt;&lt; 3 | wire) + payload</div><div>m = field(1, 0, varint(150))</div><div>print(m.hex("
      "), len(m), "byte")</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Ta cho máy làm lại vì máy không cộng nhầm. Hàm đầu mã một số nguyên: một
      dòng cho b bảy bit thấp và n phần còn lại, rồi bật bit tám nếu còn phần sau.
