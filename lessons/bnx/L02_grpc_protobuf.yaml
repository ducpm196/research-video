  - show: '<p><b>Giải mã: đọc số nguyên biến độ dài</b></p><div class="code"><div>def
      read_varint(buf, i):</div><div>    n = shift = 0</div><div>    while True:</div><div>        b
      = buf[i]</div><div>        i += 1</div><div>        n |= (b &amp; 0x7F) &lt;&lt;
      shift</div><div>        shift += 7</div><div>        if b &lt; 0x80:                   #
