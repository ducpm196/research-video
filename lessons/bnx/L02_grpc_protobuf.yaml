  - show: '<p><b>(tiếp) Trường chuỗi và bản tin chữ</b></p><div class="code"><div>s
      = "0123456789".encode()</div><div>t = field(2, 2, varint(len(s)) + s)    # kiểu
      2: độ dài rồi byte</div><div>print(t.hex(" "), len(t), "byte")</div><div>import
