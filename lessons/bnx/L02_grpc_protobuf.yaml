- id: formula
  kind: formula
  title: 'Suy ra từng bước: mã hoá một trường, rồi chia hạn chót'
  checks:
  - alg.bnx_pb_key(1, 0) == 8 and alg.bnx_pb_key(2, 2) == 18 == 0x12
  - len(alg.bnx_pb_varint(5)) == 1 and len(alg.bnx_pb_varint(150)) == 2
  - alg.bnx_pb_field(2, 2, '0123456789')[:2].hex() == '120a' and len(alg.bnx_pb_field(2,
    2, '0123456789')) == 12
  - alg.bnx_deadline_chain(2000, [800, 800, 800]) == [('xong', 2000), ('xong', 1200),
    ('hết giờ', 400)]
  steps:
  - show: '<p><b>Bước 1. Khoá trường.</b> Bên nhận đọc khoá trước, rồi mới biết đọc
      phần sau thế nào. Có 6 kiểu dây (0 đến 5), vừa trong <b>3 bit</b>, nên khoá
      là <code>(số hiệu &lt;&lt; 3) | kiểu dây</code>. Dịch trái 3 bit là nhân 8;
      kiểu dây nhỏ hơn 8 nên phép HOẶC chính là phép cộng:</p>

      $$\text{khoá} = \text{số hiệu} \times 8 + \text{kiểu dây}$$

      <span class=''note''>Làm thử: trường 1, kiểu 0 → 1 × 8 + 0 = 8 = <code>08</code>;
      trường 2, kiểu 2 → 2 × 8 + 2 = 18 = <code>12</code>.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 3
    - 3
    say: Bước một là cách ghép khoá cho mỗi trường. Bên nhận phải đọc khoá trước,
      rồi mới biết đọc phần sau thế nào. Có sáu kiểu dây, từ không đến năm, vừa trong
      ba bit. Vì vậy khoá bằng số hiệu dịch trái ba bit, rồi hoặc với kiểu dây. Dịch
      trái ba bit là nhân tám, và vì kiểu dây nhỏ hơn tám nên phép hoặc chính là phép
      cộng. Làm thử, trường một kiểu không cho tám. Trường hai kiểu hai cho mười tám,
      viết thập lục phân là một hai.
  - show: '<p><b>Bước 2. Số nguyên biến độ dài (varint).</b> Số nhỏ thì nên tốn ít
      byte. Mỗi byte chỉ mang <b>7 bit</b> giá trị; bit thứ 8 bằng 1 nghĩa là “còn
      byte sau”. Nhóm 7 bit thấp đi trước.</p>

      <span class=''note''>Làm thử: 5 nhỏ hơn 128 → 1 byte <code>05</code>; 150 lớn
      hơn 127 → phải 2 byte.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước hai là số nguyên biến độ dài. Vì số nhỏ thì nên tốn ít byte, mỗi byte
      chỉ mang bảy bit giá trị, còn bit thứ tám bằng một nghĩa là còn byte sau. Nhóm
      bảy bit thấp luôn được ghi ra trước tiên. Làm thử, năm nhỏ hơn một trăm hai
      mươi tám nên chỉ cần một byte. Một trăm năm mươi lớn hơn một trăm hai mươi bảy
      nên phải dùng hai byte.
  - show: '<p><b>Bước 3. Chuỗi (kiểu dây 2).</b> Chữ không có “dấu kết thúc”, nên
      trước các byte phải ghi <b>độ dài</b>: khoá, độ dài, rồi các byte.</p>

      <span class=''note''>Làm thử: <code>"0123456789"</code> → khoá <code>12</code>,
      độ dài 10 = <code>0a</code>, 10 byte chữ → 1 + 1 + 10 = 12 byte.</span>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    clear: true
    say: Bước ba là chuỗi, dùng kiểu dây hai. Vì bên nhận không biết chuỗi dừng ở
      đâu, trước các byte phải ghi độ dài. Thứ tự là khoá, độ dài, rồi các byte. Làm
      thử, chuỗi mười chữ số có khoá một hai, độ dài mười viết là không a, rồi mười
      byte chữ, tổng cộng mười hai byte.
  - show: '<p><b>Bước 4. Hạn chót đi theo lời gọi.</b> Người dùng chỉ chờ một lần,
      nên mỗi dịch vụ phải biết người dùng <b>còn</b> chờ bao lâu:</p>

      $$\text{còn lại} = \text{hạn chót} - \text{thời gian đã dùng}$$

      <span class=''note''>Làm thử: 2 000 − 800 = 1 200 ms cho dịch vụ 2; 1 200 −
      800 = 400 ms cho dịch vụ 3, mà nó cần 800 → hết giờ.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    clear: true
    say: Bước bốn là cách chia hạn chót qua chuỗi lời gọi. Người dùng chỉ chờ một
      lần, nên mỗi dịch vụ phải biết người dùng còn chờ bao lâu. Thời gian còn lại
      bằng hạn chót trừ thời gian đã dùng. Làm thử, dịch vụ hai nhận hai nghìn trừ
      tám trăm, bằng một nghìn hai trăm. Dịch vụ ba nhận một nghìn hai trăm trừ tám
      trăm, bằng bốn trăm, mà nó cần tám trăm, nên hết giờ.
- id: example
  kind: example
  title: Ví dụ trường số 1 mang 150, từng phép tính
  checks:
  - alg.bnx_pb_varint(alg.bnx_pb_key(1, 0)).hex() == '08'
  - (150 & 127, 150 >> 7) == (22, 1)
  - alg.bnx_pb_field(1, 0, 150).hex() == '089601' and (22 | 128) == 0x96
  - 'alg.bnx_json_len({''id'': 150}) - len(alg.bnx_pb_field(1, 0, 150)) == 7'
  - len(alg.bnx_pb_field(1, 0, 150) + alg.bnx_pb_field(2, 2, '0123456789')) == 15
  steps:
  - show: '<p>Trường số 1, kiểu dây 0, giá trị 150. Khoá theo bước 1:</p>

      $$① \; \text{khoá} = 1 \times 8 + 0 = \hl{8} = \texttt{08}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ nhất, khoá của trường số một, kiểu dây không. Theo bước một,
      một nhân tám cộng không bằng tám, viết thập lục phân là không tám.
  - show: '<p>Tách 150 thành nhóm 7 bit (<code>150 &amp; 127</code> và <code>150 &gt;&gt;
      7</code>):</p>

      $$② \; 150 = 1 \times 128 + \hl{22}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ hai, tách một trăm năm mươi thành các nhóm bảy bit. Vì một
      trăm năm mươi bằng một nhân một trăm hai mươi tám cộng hai mươi hai, nhóm thấp
      là hai mươi hai và phần còn lại là một.
  - show: '<p>Còn phần 1 ở sau nên byte đầu bật bit 8 (cộng 128):</p>

      $$③ \; 22 + 128 = 150 = \texttt{96}, \quad 1 = \texttt{01} \;\Rightarrow\; \hlg{\texttt{08
      96 01}}: 3 \text{ byte}$$

      <p class="note">Khớp ví dụ trong trang “Encoding” của protobuf.dev.</p>

      '
    focus:
    - - 1
      - 2
    - - 2
      - 3
    - 3
    say: Phép tính thứ ba, vì còn phần một ở sau, byte đầu bật bit tám, hai mươi hai
