- id: quymo
  kind: example
  title: 'Khi lưu lượng tăng: nhị phân nhỏ hơn chữ bao nhiêu byte'
  checks:
  - alg.bnx_l02_sizes(1000) == (21857, 62786) and alg.bnx_l02_sizes(100000) == (2381377,
    6677790)
  - round(2381377 / 100000, 1) == 23.8 and round(6677790 / 100000, 1) == 66.8 and
    round(21857 / 1000, 1) == 21.9 and round(62786 / 1000, 1) == 62.8
  - 6677790 - 2381377 == 4296413 and 100000 // 1000 == 100
  steps:
  - show: <table class='t'><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>"%010d"
      % i</code></td><td>viết số <code>i</code> thành đúng 10 chữ số, thêm số 0 đứng
      đầu cho đủ</td></tr><tr><td><code>sum(len(…) for i in range(1, n + 1))</code></td><td>cộng
      độ dài của từng bản tin, <code>i</code> chạy từ 1 đến n</td></tr><tr><td><code>json.dumps(d,
      separators=(",", ":"))</code></td><td>viết từ điển <code>d</code> thành chữ
      JSON gọn, không dấu cách</td></tr></table>
    clear: true
    say: 'Khối đo dùng ba cách viết nên ta giải nghĩa trước: định dạng viết số thành
      mười chữ số, hàm cộng tổng độ dài từng bản tin, và cách viết từ điển thành chữ
      gọn.'
  - show: '<p><b>Đo thật: tổng byte của n bản tin, dùng lại hàm varint và field ở
      trên</b></p><div class="code"><div>def msg(i):                 # id = i, số
      tiền = i × 1000</div><div>    s = ("%010d" % i).encode()</div><div>    return
      (field(1, 0, varint(i)) + field(2, 2, varint(len(s)) + s)</div><div>            +
      field(3, 0, varint(i * 1000)) + field(4, 0, varint(5500)))</div><div>for n in
      (1000, 100000):</div><div>    pb = sum(len(msg(i)) for i in range(1, n + 1))</div><div>    js
      = sum(len(json.dumps({"id": i, "to_account": "%010d" % i,</div><div>                             "amount":
      i * 1000, "fee": 5500},</div><div>                            separators=(",",
      ":")).encode())</div><div>             for i in range(1, n + 1))</div><div>    print(n,
      "ban tin:", pb, "byte nhi phan,", js, "byte JSON")</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta đo kích thước khi lưu lượng tăng, dùng lại hai hàm mã hoá lúc nãy. Mã và số tiền
      tăng dần nên số nguyên biến độ dài tốn thêm byte. Ta cộng tổng byte của một
      nghìn và một trăm nghìn bản tin, mã nhị phân rồi mã chữ.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1000 ban tin: 21857
      byte nhi phan, 62786 byte JSON</div><div>100000 ban tin: 2381377 byte nhi phan,
      6677790 byte JSON</div></div><table class=''t''><tr><th>n bản tin</th><th>nhị
      phân</th><th>chữ (JSON)</th><th>trung bình mỗi bản tin</th></tr><tr><td>1 000</td><td>21
      857 byte</td><td>62 786 byte</td><td>21,9 so với 62,8 byte</td></tr><tr><td>100
      000 (gấp 100 lần)</td><td>2 381 377 byte</td><td>6 677 790 byte</td><td>23,8
      so với 66,8 byte</td></tr></table><p class="note">Ước theo trung bình ở 100
      000 (số minh hoạ): 1 000 000 bản tin mỗi ngày ≈ 24 MB nhị phân so với 67 MB
      chữ, chênh khoảng 43 MB mỗi ngày (MB là mê-ga-byte, một triệu byte).</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Ở một nghìn bản tin, nhị phân tốn hơn hai mươi mốt nghìn byte còn chữ hơn
      sáu mươi hai nghìn. Ở một trăm nghìn bản tin, nhị phân hơn hai triệu ba trăm
      tám mươi nghìn byte còn chữ hơn sáu triệu sáu trăm bảy mươi nghìn. Chữ vẫn gấp
      gần ba lần, nên một triệu bản tin mỗi ngày, số minh hoạ, chênh bốn mươi ba triệu
      byte.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>chữ
      (JSON)</td><td>đọc bằng mắt, gỡ lỗi dễ, đối tác nào cũng gọi được</td><td>gấp
      ≈ 2,8 lần byte, và mỗi lần phải đọc lại chữ</td><td>API cho đối tác, lưu lượng
      vừa</td></tr><tr><td>nhị phân (Protocol Buffers)</td><td>nhỏ hơn ≈ 2,8 lần;
      hợp đồng .proto chặt</td><td>cần công cụ để đọc; giữ kỷ luật số hiệu</td><td>gọi
      nội bộ, lưu lượng lớn, hàng đợi</td></tr></table>
    clear: true
    say: Chữ dễ đọc nhưng gấp gần ba lần byte, nên với lưu lượng lớn và gọi nội bộ
      thì nhị phân hợp hơn, đổi lại cần công cụ đọc.
