- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>tệp .proto là hợp đồng</span><span class='a'>→</span><span
      class='n'>trên dây chỉ có số hiệu</span><span class='a'>→</span><span class='n'>khoá
      = số hiệu và kiểu dây</span><span class='a'>→</span><span class='n'>không đổi,
      không dùng lại số hiệu</span><span class='a'>→</span><span class='n'>hạn chót
      đi theo cả chuỗi</span></div>
    say: Trên đường truyền chỉ có số hiệu ghép với kiểu dây thành khoá, nên không
      bao giờ đổi hay dùng lại số hiệu. Mỗi lời gọi mang theo thời gian còn lại để
      cả chuỗi dừng đúng hạn.
  - show: '<div class=''box key''><b>Tư duy:</b> bản tin nhị phân nhỏ vì bỏ hết những
      gì hai bên đã thoả thuận trước. Cái giá là <b>kỷ luật</b>: số hiệu là vĩnh viễn,
      và thời gian chờ của người dùng là của chung cả chuỗi.</div>

      <p class="note">Bài sau: dịch vụ gọi nhau thì phải chứng minh mình là ai, bằng
      một mã truy cập có chữ ký.</p>

      '
    focus:
    - 1
    - 1
    - 2
    forward_ref: true
    say: 'Điều cần mang theo: bản tin nhị phân nhỏ vì bỏ hết những gì hai bên đã thoả
      thuận trước. Cái giá là kỷ luật, vì số hiệu là vĩnh viễn. Bài sau là mã truy
      cập có chữ ký.'
