  - 3 * 800 == 2400 and alg.bnx_deadline_wasted(2000, [800, 800, 800]) == 400
  - '[s for s, _ in alg.bnx_deadline_chain(2000, [800, 800, 800], propagate=False)]
    == [''xong'', ''xong'', ''xong'']'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> “gRPC luôn nhanh hơn REST.”
      (<b>REST</b>: kiểu API thường gặp, gọi qua HTTP với bản tin chữ JSON.) Lợi thật
      nằm ở bản tin nhỏ, gọi theo luồng (gửi nhiều bản tin liên tiếp trong một lời
      gọi), và hợp đồng chặt.

      <br><span class="note">Một lời gọi 100 ms mà 95 ms là truy vấn cơ sở dữ liệu
      (số minh hoạ): đổi cách mã bản tin chỉ có thể bớt trong 100 − 95 = 5 ms còn
      lại.</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là tin rằng khung gọi hàm từ xa luôn nhanh hơn
      REST, kiểu API thường gặp với bản tin chữ. Lợi thật nằm ở bản tin nhỏ, gọi theo
      luồng tức gửi nhiều bản tin liền nhau, và hợp đồng chặt. Lời gọi một trăm mi
      li giây mà chín mươi lăm là truy vấn thì đổi cách mã chỉ bớt năm.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> “Dọn dẹp” tệp mô
      tả bằng cách đổi số hiệu, hoặc xoá trường rồi dùng lại số của nó.</div><div
      class="code"><div>syntax = "proto3";</div><div> </div><div>message Transfer
      {      // bản "dọn dẹp": đổi số hiệu</div><div>  int64 id = 1;</div><div>  string
      to_account = 2;</div><div>  int64 fee = 3;</div><div>  int64 amount = 4;</div><div>}</div></div><p
      class="note">Chữ sau <code>//</code> là chú thích trong tệp mô tả, máy bỏ qua.</p>'
    focus:
    - - '2.6'
      - '2.7'
    - - '2.3'
      - '2.4'
      - '2.5'
      - '2.6'
      - '2.7'
      - '2.8'
    clear: true
    say: 'Lỗi thứ hai, của người đã đi làm, là dọn dẹp tệp mô tả bằng cách đổi số
      hiệu: phí sang số ba, số tiền sang số bốn, còn chữ sau hai gạch chéo là chú
      thích. Bản tin cũ chỉ mang số, không mang tên, nên bên đọc theo tệp mới hiểu
      sai.'
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>V1
      = {1: "id", 3: "amount"}</code></td><td>từ điển: bảng tra từ số hiệu sang tên</td></tr><tr><td><code>d.items()</code></td><td>liệt
      kê từng cặp (khoá, giá trị) của từ điển <code>d</code></td></tr><tr><td><code>{V1[k]:
      v for k, v in d.items()}</code></td><td>viết gọn vòng lặp tạo từ điển mới: với
      mỗi cặp <code>k, v</code> của <code>d</code>, đổi số hiệu <code>k</code> thành
      tên <code>V1[k]</code>, giữ giá trị <code>v</code></td></tr></table>'
    clear: true
    say: Ta đọc lại bản tin cũ bằng hai bảng tra, nên cần giải nghĩa trước. Bảng tra
      là từ điển từ số hiệu sang tên, và dòng gọn tạo từ điển mới đổi số hiệu thành
      tên.
  - show: '<p><b>Giải mã bản tin cũ bằng hai tệp mô tả</b></p><div class="code"><div>old
      = bytes.fromhex("08 96 01 18 a0 c2 1e 20 fc 2a")   # bản tin cũ</div><div>d
      = decode(old)</div><div>V1 = {1: "id", 3: "amount", 4: "fee"}     # theo .proto
      cũ</div><div>V2 = {1: "id", 3: "fee", 4: "amount"}     # theo .proto đổi số
      hiệu</div><div>print(d)</div><div>print({V1[k]: v for k, v in d.items()})</div><div>print({V2[k]:
      v for k, v in d.items()})</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>{1:
      150, 3: 500000, 4: 5500}</div><div>{''id'': 150, ''amount'': 500000, ''fee'':
      5500}</div><div>{''id'': 150, ''fee'': 500000, ''amount'': 5500}</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Ta chứng minh bằng giải mã, rồi tra tên theo tệp cũ và tệp mới. Đọc theo
      tệp cũ thì đúng, còn theo tệp đã đổi thì phí thành năm trăm nghìn mà không có
      lỗi nào được báo.
  - show: '<p><b>Xoá trường đúng cách: giữ chỗ bằng reserved</b></p><div class="code"><div>syntax
      = "proto3";</div><div> </div><div>message Transfer {      // xoá to_account
      đúng cách</div><div>  reserved 2;</div><div>  reserved "to_account";</div><div>  int64
      id = 1;</div><div>  int64 amount = 3;</div><div>  int64 fee = 4;</div><div>}</div></div><p
      class="note">Số hiệu 2 và tên <code>to_account</code> bị khoá lại: ai thêm trường
      mới dùng số 2 sẽ bị trình biên dịch .proto từ chối.</p>'
    focus:
    - - '2.4'
      - '2.5'
    - 3
    clear: true
    say: Cách chữa là không bao giờ đổi hay dùng lại số hiệu. Muốn xoá trường tài
      khoản nhận, ta giữ chỗ số hai và tên của nó, nên trình biên dịch, chương trình
      đọc tệp mô tả, từ chối ai dùng lại.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Mỗi dịch vụ tự đặt
      lại hạn 2 giây, hoặc không đặt hạn nào (mặc định gRPC <b>không</b> có hạn chót).

      <br><span class="note">Đặt lại 2 giây: chuỗi chạy 3 × 800 = 2 400 ms; người
      dùng đã bỏ cuộc ở 2 000 ms, dịch vụ 3 vẫn làm thêm 400 ms vô ích. Không đặt
      hạn: một dịch vụ treo kéo cả chuỗi treo theo.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, là mỗi dịch vụ tự đặt lại hạn hai giây,
      hoặc không đặt hạn vì mặc định khung gọi hàm từ xa không có hạn chót. Đặt lại
      thì chuỗi chạy hai nghìn bốn trăm mi li giây, nên dịch vụ ba làm thêm bốn trăm
      vô ích. Không đặt hạn thì một dịch vụ treo kéo cả chuỗi treo theo.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_pb_field(3, 0, 300).hex() == '18ac02' and alg.bnx_pb_key(3, 0) == 24 and
    (300 & 127, 44 | 128, 300 >> 7) == (44, 172, 2)
  - alg.bnx_deadline_chain(3000, [800] * 4) == [('xong', 3000), ('xong', 2200), ('xong',
    1400), ('hết giờ', 600)]
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Mã
      hoá bằng tay trường số 3 mang số nguyên 300 (kiểu dây 0). Viết các byte thập
      lục phân.</td></tr><tr><td>2</td><td>Hạn chót 3 giây, chuỗi 4 dịch vụ, mỗi dịch
      vụ cần 800 ms, có truyền thời gian còn lại. Dịch vụ nào hết giờ, khi còn bao
      nhiêu ms?</td></tr><tr><td>3</td><td>Quyết định: API cho ví điện tử của đối
      tác gọi vào, và lời gọi nội bộ từ dịch vụ chuyển tiền sang dịch vụ chống gian
      lận. Mỗi chỗ chọn REST + JSON + OpenAPI hay gRPC?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài, ba câu trên màn hình. Câu ba chọn cách gọi
      cho đối tác và nội bộ, hãy dừng video và làm ra giấy.
  - show: '$$\text{khoá} = 3 \times 8 + 0 = 24 = \texttt{18}; \quad 300 = 2 \times
      128 + 44; \quad 44 + 128 = 172 = \texttt{ac}, \; 2 = \texttt{02}$$

      <div class="box key">Câu 1: <code>18 ac 02</code>, 3 byte.</div>

      '
    focus:
    - 1
    - 2
    say: Đáp án câu một, khoá bằng ba nhân tám, tức hai mươi tư, viết là một tám.
      Ba trăm bằng hai nhân một trăm hai mươi tám cộng bốn mươi bốn, nên nhóm thấp
      bật bit tám thành a c, phần hai là không hai, vậy dài ba byte.
    clear: true
  - show: <table class='t'><tr><th>dịch vụ</th><th>còn lại khi bắt đầu</th><th>cần</th><th>kết
      quả</th></tr><tr><td>1</td><td>3 000</td><td>800</td><td>xong</td></tr><tr><td>2</td><td>3
      000 − 800 = 2 200</td><td>800</td><td>xong</td></tr><tr><td>3</td><td>2 200
      − 800 = 1 400</td><td>800</td><td>xong</td></tr><tr><td>4</td><td>1 400 − 800
      = 600</td><td>800</td><td><b class='red'>hết giờ</b></td></tr></table>
    focus:
    - - '1.2'
      - '1.3'
      - '1.4'
      - '1.5'
    say: Đáp án câu hai, ba dịch vụ đầu đều xong, còn dịch vụ bốn chỉ còn sáu trăm
      mà cần tám trăm, nên hết giờ.
    clear: true
  - show: <table class='t'><tr><th>chỗ</th><th>chọn</th><th>được</th><th>mất</th></tr><tr><td>API
      cho ví đối tác</td><td>REST + JSON + OpenAPI</td><td>đối tác nào cũng gọi được,
      đọc bản tin bằng mắt, trang mô tả sẵn</td><td>bản tin to hơn, kiểm lược đồ phải
      tự bật</td></tr><tr><td>chuyển tiền → chống gian lận (nội bộ)</td><td>gRPC</td><td>bản
      tin nhỏ, hợp đồng .proto chặt, có luồng, hạn chót đi theo lời gọi</td><td>cần
      công cụ để đọc bản tin; phải giữ kỷ luật số hiệu</td></tr></table>
    say: Đáp án câu ba, API cho đối tác chọn REST, JSON và OpenAPI vì đối tác nào
      cũng gọi được, đổi lại bản tin to hơn. Lời gọi nội bộ hợp với khung gọi hàm
      từ xa vì bản tin nhỏ, đổi lại phải giữ kỷ luật số hiệu.
    clear: true
