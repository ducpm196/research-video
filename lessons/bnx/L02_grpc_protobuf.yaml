  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>"0123456789".encode()</code></td><td>đổi
      chuỗi chữ thành dãy byte</td></tr><tr><td><code>import json</code></td><td>nạp
      thư viện JSON của Python</td></tr><tr><td><code>{"id": 150}</code></td><td><b>từ
      điển</b>: các cặp <code>tên: giá trị</code> trong ngoặc nhọn; ở đây một cặp,
      tên <code>id</code>, giá trị 150</td></tr><tr><td><code>json.dumps(d, separators=(",",
      ":"))</code></td><td>viết từ điển <code>d</code> thành chữ JSON gọn, không dấu
      cách</td></tr></table>'
    clear: true
    say: Phần tiếp có thêm vài cách viết, nên ta giải nghĩa trước. Lệnh đổi chuỗi
      chữ thành dãy byte, từ điển là các cặp tên và giá trị trong ngoặc nhọn, và hàm
