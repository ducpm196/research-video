scenes:
- id: hook
  kind: hook
  title: Số tiền thành phí, phí thành số tiền, và khách chờ mãi
  checks:
  - 'alg.bnx_pb_named(alg.bnx_pb_field(3, 0, 500000) + alg.bnx_pb_field(4, 0, 5500),
    {3: ''fee'', 4: ''amount''}) == {''fee'': 500000, ''amount'': 5500}'
  - '[s for s, _ in alg.bnx_deadline_chain(2000, [800, 800, 800])] == [''xong'', ''xong'',
    ''hết giờ'']'
  steps:
  - show: '<p>Một dịch vụ nội bộ “dọn dẹp” tệp mô tả bản tin: đổi chỗ số hiệu của
      hai trường. Bản tin cũ còn trong hàng đợi được đọc lại (số minh hoạ):</p><table
      class=''t''><tr><th>trường</th><th>bên gửi ghi</th><th>bên nhận đọc ra</th></tr><tr><td>số
      tiền</td><td>500 000</td><td><b class=''red''>5 500</b></td></tr><tr><td>phí</td><td>5
      500</td><td><b class=''red''>500 000</b></td></tr></table><div class="box warn">Không
      có lỗi nào được báo: bản tin vẫn “hợp lệ”, chỉ có <b>nghĩa</b> bị đảo.</div>'
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - 3
    say: Chào bạn, một đội nội bộ dọn dẹp tệp mô tả bản tin và đổi chỗ số hiệu của
      hai trường. Bản tin cũ còn trong hàng đợi được đọc lại, đây là số minh hoạ.
      Bên gửi ghi số tiền năm trăm nghìn, phí năm nghìn năm trăm. Bên nhận đọc ra
      số tiền năm nghìn năm trăm, và phí năm trăm nghìn. Không có lỗi nào được báo,
      vì bản tin vẫn hợp lệ, chỉ có nghĩa bị đảo.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>bản
      tin nhị phân trông thế nào</td><td>mã hoá bằng tay: khoá trường và số nguyên
      biến độ dài</td></tr><tr><td>vì sao số hiệu trường là bất khả xâm phạm</td><td>giải
      mã bản tin cũ bằng tệp mô tả mới</td></tr><tr><td>vì sao cả chuỗi lời gọi phải
      dừng đúng hạn</td><td>hạn chót 2 giây qua ba dịch vụ, mỗi dịch vụ 800 ms</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Hôm nay ta trả lời ba câu hỏi. Bản tin nhị phân trông thế nào, ta sẽ tự mã
      hoá bằng tay từng byte. Vì sao không được đổi số hiệu trường, ta sẽ giải mã
      bản tin cũ để thấy. Và vì sao cả chuỗi lời gọi phải dừng đúng hạn, với hạn chót
      hai giây qua ba dịch vụ, mỗi dịch vụ cần tám trăm mi li giây.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn phép tính trên byte'
  checks:
  - 128 + 16 + 4 + 2 == 150 == int('10010110', 2) == int('96', 16) == 9 * 16 + 6
  - (1 << 3, 150 >> 7, 150 & 127, 8 | 0, 22 | 128) == (8, 1, 22, 8, 150)
  - 'alg.bnx_json_len({''id'': 150}) == 10 and len(alg.bnx_pb_field(1, 0, 150)) ==
    3'
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Byte và bit</td><td>1 byte = 8 bit, giá trị từ 0 đến 255</td><td>1001 0110 =
      128 + 16 + 4 + 2 = 150</td></tr><tr><td>② Thập lục phân</td><td>mỗi byte viết
      bằng 2 chữ số cơ số 16 (a = 10 … f = 15)</td><td><code>96</code> = 9 × 16 +
      6 = 150</td></tr><tr><td>③ Dịch trái, dịch phải</td><td><code>&lt;&lt; 3</code>
      nhân 2 ba lần; <code>&gt;&gt; 7</code> chia 128 bỏ phần dư</td><td>1 &lt;&lt;
      3 = 8; 150 &gt;&gt; 7 = 1</td></tr><tr><td>④ VÀ, HOẶC theo bit</td><td><code>&amp;
      127</code> giữ 7 bit thấp; <code>|</code> bật thêm bit</td><td>150 &amp; 127
      = 22; 8 | 0 = 8; 22 | 128 = 150</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Trước hết ta cần bốn phép tính trên byte. Một byte gồm tám bit, giá trị từ
      không đến hai trăm năm mươi lăm. Dãy một không không một, không một một không
      là một trăm hai mươi tám cộng mười sáu cộng bốn cộng hai, bằng một trăm năm
      mươi. Thập lục phân viết mỗi byte bằng hai chữ số cơ số mười sáu. Chín sáu thập
      lục phân là chín nhân mười sáu cộng sáu, bằng một trăm năm mươi. Dịch trái ba
      bit là nhân hai ba lần, nên một dịch trái ba bằng tám. Dịch phải bảy bit là
      chia một trăm hai mươi tám bỏ phần dư, nên một trăm năm mươi dịch phải bảy bằng
      một. Phép và với một trăm hai mươi bảy giữ lại bảy bit thấp, nên một trăm năm
      mươi và một trăm hai mươi bảy bằng hai mươi hai. Phép hoặc bật thêm bit, nên
      hai mươi hai hoặc một trăm hai mươi tám bằng một trăm năm mươi.
  - show: '<table class=''t''><tr><th>cách viết</th><th>bản tin <code>{"id":150}</code></th><th>số
      byte</th></tr><tr><td>chữ (JSON)</td><td><code>{</code> <code>"</code> <code>i</code>
      <code>d</code> <code>"</code> <code>:</code> <code>1</code> <code>5</code> <code>0</code>
      <code>}</code></td><td>10, mỗi ký tự 1 byte</td></tr><tr><td>nhị phân (Protocol
      Buffers)</td><td><code>08 96 01</code></td><td>3, tính ở phần sau</td></tr></table><p
      class="note">Hạn chót: thời điểm người gọi thôi chờ, thường cho bằng thời gian
      chờ tối đa tính từ lúc gọi. Ví dụ: chờ tối đa 2 000 ms = 2 giây.</p>'
    focus:
    - '1.2'
    - '1.2'
    - '1.3'
    - 2
    clear: true
