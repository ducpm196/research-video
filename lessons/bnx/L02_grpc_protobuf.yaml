  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>n
      |= x</code></td><td>viết gọn của <code>n = n | x</code>: bật thêm các bit của
      <code>x</code> vào <code>n</code></td></tr><tr><td><code>buf[i]</code>, <code>buf[i:i
      + ln]</code></td><td>byte thứ <code>i</code> của dãy; đoạn cắt bắt đầu từ <code>i</code>,
      dài <code>ln</code> byte</td></tr><tr><td><code>bytes.fromhex("08 96 01")</code>,
      <code>b''0123''</code></td><td>đổi chuỗi thập lục phân thành dãy byte; chữ <code>b</code>
      trước dấu nháy là dãy byte, in ra dạng chữ khi byte đọc được</td></tr><tr><td><code>n
