- id: quymo
  kind: example
  title: 'Khi kho lớn dần: bao nhiêu lần đọc để dựng số dư?'
  checks:
  - alg.bnx_l29_events_to_read(1000000, 0) == 1000000 and 1000000 // 1000 == 1000
  - alg.bnx_l29_events_to_read(2500500, 1000) == alg.bnx_l29_events_to_read(2500,
    1000) == 500
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>db.executemany("INSERT
      …", ((i % 2, i % 97 + 1) for i in range(1000000)))</code></td><td>chạy một lệnh
      thêm cho mỗi bộ trong dãy; dãy sinh ra từng bộ <code>(i % 2, i % 97 + 1)</code>
      cho <code>i</code> từ 0 tới 999999 (<code>%</code> là phần dư)</td><td><code>i
      = 5</code> cho <code>(1, 6)</code></td></tr><tr><td><code>for loai, tien in
      db.execute("SELECT loai, tien FROM sk WHERE seq &lt;= ?", (toi,)):</code></td><td><code>SELECT
      … FROM … WHERE</code> lấy các dòng thoả điều kiện; <code>(toi,)</code> điền
      vào chỗ giữ; vòng lặp nhận từng dòng, tách thành hai biến</td><td><code>toi
      = 1000</code> lấy 1000 dòng đầu</td></tr><tr><td><code>so_du, dem = 0, 0</code>,
      <code>return so_du, dem</code>, <code>for n in (1000, 1000000):</code></td><td>gán
      hai biến cùng bằng 0; hàm trả hai giá trị; vòng lặp thử hai cỡ</td><td></td></tr></table>
    clear: true
    say: Mã đo quy mô có ba chỗ cần đọc trước. Chạy một lệnh thêm cho mỗi bộ giá trị
      trong dãy sinh sẵn, với i chạy từ không tới chín trăm chín mươi chín nghìn chín
      trăm chín mươi chín. Lệnh lấy các dòng thoả điều kiện, và vòng lặp nhận từng
      dòng, tách thành hai biến. Gán hai biến cùng bằng không, hàm trả hai giá trị,
      và vòng lặp thử hai cỡ.
  - show: '<p><b>QuyMoPhat.py (trích): sinh một triệu sự kiện, rồi dựng số dư từ n
      sự kiện đầu</b></p><div class="code"><div>db.execute("CREATE TABLE sk (seq INTEGER
      PRIMARY KEY, loai INTEGER, tien INTEGER)")</div><div>db.executemany("INSERT
      INTO sk (loai, tien) VALUES (?, ?)",</div><div>               ((i % 2, i % 97
      + 1) for i in range(1000000)))</div><div>def dung_lai(toi):</div><div>    so_du,
      dem = 0, 0</div><div>    for loai, tien in db.execute("SELECT loai, tien FROM
      sk WHERE seq &lt;= ?", (toi,)):</div><div>        so_du += tien if loai == 0
      else -tien</div><div>        dem += 1</div><div>    return so_du, dem</div><div>for
      n in (1000, 1000000):</div><div>    so_du, dem = dung_lai(n)</div><div>    print(f"{n}
      su kien: da doc {dem} su kien, so du {so_du}")</div></div><p class="note">Dữ
      liệu sinh: số thứ tự chẵn là nạp, lẻ là rút, số tiền là <code>i % 97 + 1</code>
      (số minh hoạ).</p>'
    focus:
    - - 1
    - 2
    clear: true
    say: Đây là số đo thật, chương trình sinh một triệu sự kiện, rồi hàm dựng lại
      đọc n sự kiện đầu và cộng trừ ra số dư. Ta thử với một nghìn sự kiện, rồi một
      triệu, gấp một nghìn lần.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1000 su kien: da
      doc 1000 su kien, so du -15</div><div>1000000 su kien: da doc 1000000 su kien,
      so du 35</div></div><p class="note">Số dư âm là bình thường: dữ liệu sinh minh
      hoạ không chặn rút quá số dư.</p><p><b>TÍNH TỪ CÔNG THỨC n mod k (không đo kho
      thật): số lần đọc khi có và không có bản chụp</b></p><div class="code"><div>2500
      su kien: khong ban chup doc 2500, chup moi 1000 su kien doc 500</div><div>2500500
      su kien: khong ban chup doc 2500500, chup moi 1000 su kien doc 500</div></div>$$10^3
      \to 10^6 \;(\times 1000): \; \text{đọc } 1\,000 \to 1\,000\,000; \quad \text{có
      bản chụp: } 500 \to 500$$'
    focus:
    - 1
    - 3
    - 5
    clear: true
    say: 'Kết quả đo thật là đọc đúng một nghìn rồi đúng một triệu sự kiện, nên chi
      phí dựng lại tăng theo cỡ kho. Hai dòng sau không đo kho thật mà tính từ công
      thức chia lấy dư: với bản chụp mỗi một nghìn sự kiện, hai cỡ kho đều chỉ đọc
      năm trăm. Bản chụp giữ chi phí dưới một nghìn.'
  - show: '<table class=''t''><tr><th>cách</th><th>chi phí dựng số dư</th><th>đánh
      đổi</th><th>chọn khi</th></tr><tr><td>phát lại từ đầu</td><td>tỉ lệ với số sự
      kiện: 10³ → 10⁶ lần đọc</td><td>đơn giản, không dữ liệu phụ</td><td>tài khoản
      ít giao dịch, kiểm toán một lần</td></tr><tr><td>bản chụp mỗi k sự kiện</td><td>tối
      đa k − 1 lần đọc</td><td>lưu thêm bản chụp; phải dựng lại khi đổi quy tắc áp
      dụng</td><td>tài khoản nhiều giao dịch</td></tr><tr><td>bản chiếu chạy liên
      tục</td><td>một lần đọc dòng đã dựng</td><td>đọc trễ; thêm thành phần phải giám
      sát</td><td>truy vấn số dư rất nhiều</td></tr></table>'
    focus:
    - 0
    - - '1.2'
      - '1.3'
    - '1.4'
    clear: true
    say: Phát lại từ đầu đơn giản nhưng chi phí tỉ lệ với số sự kiện. Bản chụp giới
      hạn chi phí dưới k, đổi lại phải lưu thêm. Bản chiếu truy vấn nhanh nhất, đổi
      lại đọc có thể trễ.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_l29_replay([('NAP', 1000), ('RUT', 300)]) == 700
  - alg.bnx_l29_events_to_read(999999, 1000) == 999
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Dùng kho sự kiện nhưng
      <b class="red">vẫn cho sửa và xoá</b> &laquo;cho tiện&raquo;. Chạy thật: trigger
      chặn cả hai lệnh thông thường (<code>INSERT OR REPLACE</code> và gỡ trigger
      vẫn lách được, nên vẫn cần phân quyền). Một kho sửa được thì không còn là bằng
      chứng: kiểm toán mất giá trị.</div><p><b>Kết quả chạy thật</b></p><div class="code"><div>sua
      su kien: kho su kien chi them, khong sua</div><div>xoa su kien: kho su kien
      chi them, khong xoa</div><div>so su kien: 3</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Lỗi thứ nhất là dùng kho sự kiện nhưng vẫn cho sửa và xoá cho tiện. Đoạn
      lệnh tự chạy chặn lệnh thông thường, nhưng lệnh ghi đè hay gỡ nó vẫn lách được
      nên cần phân quyền.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Đọc
      <b class="red">mô hình đọc ngay sau khi ghi</b> và tin nó đã cập nhật. Chạy
      thật: mới chiếu 2 trên 3 sự kiện thì đọc ra 700 chứ không phải 750.

      Cách chữa: khi cần chắc chắn (kiểm số dư trước khi rút), đọc từ kho hoặc kiểm
      vị trí đã chiếu; còn màn hình hiển thị thì chấp nhận trễ.</div>

      '
    clear: true
    say: 'Lỗi thứ hai: đọc mô hình đọc ngay sau khi ghi và tin nó đã cập nhật. Mới
      chiếu hai trên ba sự kiện thì đọc ra bảy trăm chứ không phải bảy trăm năm mươi.
      Khi cần chắc chắn, như trước khi rút, hãy đọc từ kho.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc tải tăng).</b> <b
      class="red">Phát lại từ đầu</b> cho mỗi lần hỏi số dư. Ở 10³ sự kiện thấy nhanh;
      ở 10⁶ là đọc 1 000 000 sự kiện mỗi lần. Chữa: bản chụp (đọc tối đa 999 sự kiện)
      hoặc bản chiếu chạy liên tục.</div>'
    clear: true
    say: 'Lỗi thứ ba: phát lại từ đầu cho mỗi lần hỏi số dư. Ở một nghìn sự kiện thấy
      nhanh, ở một triệu là đọc một triệu sự kiện mỗi lần, chữa bằng bản chụp hoặc
      bản chiếu.'
  - show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm, lúc vận hành lâu dài).</b>
      <b class="red">Đổi quy tắc áp dụng sự kiện</b> (ví dụ cách tính phí) mà bản
      chụp cũ vẫn dùng quy tắc cũ: số dư dựng từ bản chụp khác số dư phát lại từ đầu.

      Cách chữa: gắn <b>phiên bản quy tắc</b> vào bản chụp, đổi quy tắc thì bỏ bản
      chụp cũ và dựng lại; thêm ca kiểm so hai đường.</div>

      '
    clear: true
    say: 'Lỗi thứ tư: đổi quy tắc mà bản chụp cũ vẫn dùng quy tắc cũ, nên số dư từ
      bản chụp khác số dư phát lại từ đầu. Chữa bằng cách gắn phiên bản quy tắc vào
      bản chụp.'
