scenes:
- id: hook
  kind: hook
  title: 'Số dư 630: bảng chỉ nhớ con số, kho sự kiện nhớ cả đường đi'
  checks:
  - alg.bnx_l29_replay([('NAP', 1000), ('RUT', 300), ('NAP', 50), ('RUT', 120)]) ==
    630
  steps:
  - show: '<p>Hai cách giữ số dư của một tài khoản qua bốn giao dịch: nạp 1000, rút
      300, nạp 50, rút 120.</p>

      <div class="box key">Cách 1 (một bảng số dư, mỗi giao dịch <b>sửa</b> con số):
      còn <b>630</b>, nhưng không ai trả lời được &laquo;630 đến từ đâu&raquo;. Cách
      2 (<b>kho sự kiện chỉ thêm</b>): cũng <b>630</b> và còn đủ bốn sự kiện.

      Sự kiện nhập sai thì sửa ra sao khi kho cấm sửa? Và 10⁶ sự kiện thì dựng lại
      số dư mất bao nhiêu lần đọc?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: 'Chào bạn, hai cách giữ số dư qua bốn giao dịch: nạp một nghìn, rút ba trăm,
      nạp năm mươi, rút một trăm hai mươi. Cách một là bảng số dư mà mỗi giao dịch
      sửa con số, còn sáu trăm ba mươi nhưng không ai biết nó từ đâu. Cách hai là
      kho sự kiện chỉ thêm, cũng ra sáu trăm ba mươi và còn đủ bốn sự kiện. Sự kiện
      sai thì sửa ra sao khi kho cấm sửa, và một triệu sự kiện thì mất bao nhiêu lần
      đọc?'
- id: prereq
  kind: prereq
  title: 'Trước hết: sáu điều cần hiểu'
  checks:
  - 1000 - 300 + 50 - 120 == 630
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      sự kiện (event)</td><td>ghi lại <b>điều đã xảy ra</b>, thì quá khứ, không đổi
      được</td><td><code>NAP 1000</code> trên tài khoản 001</td></tr><tr><td>② số
      dư là suy ra</td><td>số dư không phải dữ liệu gốc: nó là <b>tổng</b> của các
      sự kiện</td><td>1000 − 300 + 50 − 120 = 630</td></tr><tr><td>③ chỉ thêm (append-only)</td><td>chỉ
      ghi thêm vào cuối, không sửa, không xoá</td><td>như sổ cái có bút mực</td></tr><tr><td>④
      trigger</td><td>đoạn lệnh cơ sở dữ liệu tự chạy trước hoặc sau một lệnh ghi</td><td>chặn
      <code>UPDATE</code> và <code>DELETE</code></td></tr><tr><td>⑤ bản chiếu (projection)</td><td>bảng
      tóm tắt <b>dựng từ sự kiện</b> để đọc nhanh; có thể xoá và dựng lại</td><td>bảng
      số dư theo tài khoản</td></tr><tr><td>⑥ <b>CQRS</b> và <b>Event Sourcing</b></td><td>CQRS
      (Command Query Responsibility Segregation): tách mô hình <b>ghi</b> khỏi mô
      hình <b>đọc</b>. Event Sourcing: lưu <b>chuỗi sự kiện</b> làm nguồn sự thật,
      không lưu con số cuối</td><td>bài này làm cả hai: kho sự kiện để ghi, bảng số
      dư để đọc</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    introduces:
    - bnx_cqrs
    - bnx_event_sourcing
    say: Trước hết ta cần hiểu sáu điều, sự kiện ghi lại điều đã xảy ra và không đổi
      được. Số dư là tổng các sự kiện, không phải dữ liệu gốc. Chỉ thêm nghĩa là chỉ
      ghi vào cuối, không sửa, không xoá. Đoạn lệnh tự chạy là đoạn lệnh của cơ sở
      dữ liệu chạy quanh một lệnh ghi. Bản chiếu là bảng tóm tắt dựng từ sự kiện để
      đọc nhanh, và dựng lại được. Hai tên viết tắt trên màn hình là tách mô hình
      ghi khỏi mô hình đọc, và lưu chuỗi sự kiện làm nguồn sự thật.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l29_replay([('NAP', 5), ('RUT', 2)]) == 3
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>NAP</code>,
      <code>RUT</code></td><td>hai loại sự kiện: nạp thì cộng, rút thì trừ</td></tr><tr><td><code>seq</code></td><td>số
      thứ tự tăng dần của sự kiện trong kho: thứ tự là một phần của sự thật</td></tr><tr><td><code>CREATE
      TRIGGER … BEFORE UPDATE ON su_kien BEGIN … END</code></td><td>đoạn tự chạy trước
      mỗi lệnh sửa của bảng; bên trong, <code>RAISE(ABORT, …)</code> huỷ lệnh đang
      chạy và báo lỗi</td></tr><tr><td>phát lại (replay)</td><td>đọc sự kiện từ đầu
      và áp dụng lần lượt để dựng trạng thái</td></tr><tr><td>bản chụp (snapshot)</td><td>số
      dư đã dựng tại một vị trí; lần sau chỉ phát lại phần sau nó</td></tr><tr><td>sự
      kiện bù</td><td>sự kiện mới đảo ngược tác dụng của một sự kiện sai, thay vì
      sửa nó</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Hai loại sự kiện là nạp thì cộng và rút thì trừ. Số thứ tự tăng dần cho biết
      thứ tự, một phần của sự thật. Đoạn lệnh tự chạy trước mỗi lệnh sửa, và lệnh
      huỷ bên trong dừng lệnh đang chạy rồi báo lỗi. Phát lại là áp dụng sự kiện từ
      đầu để dựng trạng thái. Bản chụp là số dư đã dựng tại một vị trí, để chỉ phát
      lại phần sau nó. Sự kiện bù đảo ngược tác dụng của một sự kiện sai, thay vì
      sửa nó.
