- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ sự kiện tới số dư'
  checks:
  - alg.bnx_l29_replay([('NAP', 1000), ('RUT', 300), ('NAP', 50), ('RUT', 120)]) ==
    630
  - alg.bnx_l29_replay([('NAP', 1000), ('RUT', 300), ('NAP', 50), ('RUT', 120), ('RUT',
    500)]) == 130
  - alg.bnx_l29_replay([('NAP', 1000), ('RUT', 300), ('NAP', 50), ('RUT', 120), ('RUT',
    500), ('NAP', 500), ('RUT', 50)]) == 580
  - 2500500 % 1000 == 500
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>sqlite3.connect(":memory:")</code>,
      <code>db.executescript("""…""")</code></td><td>mở một cơ sở dữ liệu nhỏ nằm
      trong bộ nhớ, tắt chương trình là mất; <code>executescript</code> chạy nhiều
      lệnh SQL (câu lệnh nói với cơ sở dữ liệu) viết giữa ba dấu nháy kép</td><td>kho
      tạm, không để lại tệp</td></tr><tr><td><code>CREATE TABLE su_kien (seq INTEGER
      PRIMARY KEY AUTOINCREMENT, tk TEXT, …)</code></td><td>tạo bảng: mỗi cột là tên
      rồi kiểu (<code>INTEGER</code> số nguyên, <code>TEXT</code> chữ); <code>PRIMARY
      KEY AUTOINCREMENT</code>: cột không trùng, tự tăng 1, 2, 3 ở mỗi dòng mới</td><td>dòng
      đầu có <code>seq</code> = 1</td></tr><tr><td><code>INSERT OR REPLACE</code>,
      <code>DROP TRIGGER</code>, chuỗi băm</td><td><code>INSERT OR REPLACE</code>:
      ghi đè dòng cùng <code>seq</code>; <code>DROP TRIGGER</code>: gỡ đoạn tự chạy;
      chuỗi băm: mỗi sự kiện kèm mã băm có cả mã băm sự kiện trước, nên sửa lén một
      sự kiện làm đứt chuỗi</td><td></td></tr></table>'
    introduces:
    - bnx_ma_bam
    clear: true
    say: 'Mã dựng kho dùng ba chỗ mới nên ta giải trước. Mở cơ sở dữ liệu nhỏ trong
      bộ nhớ rồi chạy một loạt lệnh viết giữa ba dấu nháy kép. Tạo bảng gồm các cột,
      mỗi cột có tên và kiểu, và cột khoá chính tự tăng một ở mỗi dòng mới. Ba chỗ
      hở của việc chặn: ghi đè, gỡ đoạn tự chạy, và chuỗi băm là cách phát hiện sửa
      lén.'
  - show: '<p><b>Bước 1.</b> Muốn mọi con số có thể giải thích, ta ghi <b>điều đã
      xảy ra</b> thay vì ghi con số. Mỗi giao dịch là một dòng thêm vào cuối kho,
      với số thứ tự tăng dần.</p><p><b>KhoSuKien.py (trích): bảng sự kiện và hai trigger
      chặn sửa, xoá</b></p><div class="code"><div>db = sqlite3.connect(":memory:")</div><div>db.executescript("""</div><div>CREATE
      TABLE su_kien (seq INTEGER PRIMARY KEY AUTOINCREMENT, tk TEXT, loai TEXT, tien
      INTEGER);</div><div>CREATE TRIGGER khong_sua BEFORE UPDATE ON su_kien</div><div>BEGIN
      SELECT RAISE(ABORT, ''kho su kien chi them, khong sua''); END;</div><div>CREATE
      TRIGGER khong_xoa BEFORE DELETE ON su_kien</div><div>BEGIN SELECT RAISE(ABORT,
      ''kho su kien chi them, khong xoa''); END;</div><div>""")</div></div><p class="note"><b>Giới
      hạn:</b> hai trigger chỉ chặn lệnh <code>UPDATE</code> và <code>DELETE</code>
      thông thường. <code>INSERT OR REPLACE</code> vẫn ghi đè sự kiện cùng <code>seq</code>
      (đo trên SQLite 3.49), còn <code>DROP TRIGGER</code> và <code>DROP TABLE</code>
      vẫn chạy. Nên cần thêm quyền tối thiểu và chuỗi băm nối các sự kiện để phát
      hiện sửa lén.</p>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Bước một: để con số giải thích được, ta ghi điều đã xảy ra thay vì ghi con
      số, mỗi giao dịch là một dòng thêm vào cuối kho. Hai đoạn lệnh tự chạy chặn
      lệnh sửa và xoá thông thường, nhưng lệnh ghi đè hay gỡ vẫn lách được, nên cần
      thêm quyền tối thiểu và chuỗi băm.'
  - show: '<p><b>Bước 2. Số dư là kết quả phát lại.</b> Bắt đầu từ 0, áp dụng từng
      sự kiện theo thứ tự: nạp cộng, rút trừ. Cùng kho thì luôn ra cùng số dư.</p>$$0
      + 1000 = 1000;\;\; 1000 - 300 = 700;\;\; 700 + 50 = 750;\;\; 750 - 120 = \hl{630}$$'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước hai, số dư là kết quả phát lại: bắt đầu từ không, áp dụng từng sự kiện
      theo thứ tự, nạp cộng, rút trừ. Cùng một kho thì ra cùng một số dư, và số dư
      cuối là sáu trăm ba mươi.'
  - show: <p><b>Bước 3. Tách ghi và đọc.</b> Truy vấn &laquo;số dư?&raquo; mà phát
      lại cả kho mỗi lần thì chậm. Nên phía ghi chỉ thêm sự kiện, còn một <b>bộ chiếu</b>
      đọc sự kiện mới và cập nhật <b>bản chiếu</b> (bảng số dư) cho truy vấn nhanh.
      Bản chiếu chạy <b>sau</b> kho nên có thể <b>trễ</b>.</p>
    clear: true
    say: Bước ba tách ghi và đọc, phát lại cả kho mỗi lần hỏi thì chậm, nên phía ghi
      chỉ thêm sự kiện, còn bộ chiếu cập nhật bảng số dư cho truy vấn nhanh. Bản chiếu
      chạy sau kho nên có thể trễ.
  - show: <p><b>Bước 4. Sự kiện sai thì bù.</b> Không sửa được, nên thêm sự kiện <b>đảo
      ngược</b> rồi thêm sự kiện đúng. Lịch sử giữ nguyên cả cái sai lẫn cách sửa,
      nên kiểm toán thấy hết.</p>$$630 - 500 = 130 \;\Rightarrow\; 130 + 500 = 630
      \;\Rightarrow\; 630 - 50 = \hl{580}$$
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước bốn, sự kiện sai thì bù: không sửa được nên ta thêm sự kiện đảo ngược
      rồi sự kiện đúng. Lịch sử giữ cả cái sai lẫn cách sửa, và số dư đúng là năm
      trăm tám mươi.'
    introduces:
    - implies
  - show: '<p><b>Bước 5. Bản chụp.</b> Phát lại từ đầu tốn thời gian tỉ lệ với số
      sự kiện. Cứ mỗi <b>k</b> sự kiện, lưu số dư tại đó. Dựng số dư tại sự kiện thứ
      <b>n</b>: nạp bản chụp gần nhất, đọc phần dư.</p>$$\text{số lần đọc} = \text{(n
      chia lấy dư cho k)} \quad (k = 1000,\; n = 2\,500\,500 \Rightarrow \hl{500})$$'
    focus:
    - - 1
    - 2
    clear: true
    say: 'Bước năm là bản chụp, phát lại từ đầu tốn thời gian tỉ lệ với số sự kiện,
      nên cứ mỗi k sự kiện ta lưu số dư. Dựng số dư tại sự kiện thứ n thì nạp bản
      chụp gần nhất rồi đọc phần dư, tức n chia lấy dư cho k: với k bằng một nghìn,
      chỉ đọc năm trăm.'
