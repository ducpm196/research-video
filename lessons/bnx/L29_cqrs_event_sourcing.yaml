      một nếu rút. Lệnh sửa số dư thành giá trị cũ cộng thêm, và giá trị cũ bị ghi
      đè.
  - show: '<p><b>BangSoDu.py (trích): cách cũ, mỗi giao dịch SỬA con số trong một
      bảng</b></p><div class="code"><div>db = sqlite3.connect(":memory:")</div><div>db.execute("CREATE
      TABLE tk (so TEXT PRIMARY KEY, so_du INTEGER)")</div><div>db.execute("INSERT
