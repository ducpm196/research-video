scenes:
- id: hook
  kind: hook
  title: Cùng một lệnh rút tiền, năm hệ cơ sở dữ liệu trả lời khác nhau
  checks:
  - alg.bnx_l28_withdraw(1000, [600, 600]) == ([1, 0], 400)
  steps:
  - show: '<p>Hai nhân viên cùng lúc thao tác trên một tài khoản. Nhân viên thứ hai
      xin khoá dòng <b>không chờ</b>. Chạy thật trên năm hệ:</p>

      <div class="box key">PostgreSQL báo <code>could not obtain lock on row</code>
      (mã SQLSTATE <code>55P03</code> trong trình điều khiển);
      Oracle báo <code>ORA-00054</code>; SQL Server báo <code>Msg 1222</code>; MySQL
      báo <code>ERROR 3572</code>. MongoDB sửa một bản ghi là nguyên tử, nên bài này
      dùng <b>cập nhật có điều kiện</b> thay cho khoá (MongoDB cũng có giao dịch nhiều
      bản ghi); hệ quan hệ cũng viết được kiểu này.

      Chọn hệ nào cho sổ tiền, và khi nào chọn hệ khác?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, hai nhân viên cùng lúc thao tác trên một tài khoản, người thứ hai
      xin khoá dòng nhưng không chờ. Chạy thật trên năm hệ, bốn hệ quan hệ báo lỗi
      ngay, mỗi hệ một mã riêng. Cơ sở dữ liệu JSON sửa một bản ghi là nguyên tử,
      nên dùng cập nhật có điều kiện thay cho khoá. Chọn hệ nào cho sổ tiền?
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l28_removed(100000, False) == 99999
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa (ví dụ)</th></tr><tr><td>①
      bảng, khoá, chỉ mục</td><td>bảng gồm hàng cột; <b>khoá chính</b>: cột có giá
      trị riêng cho từng hàng; <b>khoá ngoại</b>: cột trỏ tới khoá chính của bảng
      khác; <b>JOIN</b> (nối bảng): ghép hàng hai bảng theo khoá; <b>chỉ mục</b>:
      danh mục tra nhanh theo một cột, như mục lục sách (chỉ mục trên cột <code>so</code>
      để tìm tài khoản)</td></tr><tr><td>② quét tuần tự</td><td>đọc <b>từng dòng</b>
      từ đầu tới cuối để tìm dòng khớp (100 000 dòng thì đọc 100 000 dòng)</td></tr><tr><td>③
      khoá dòng</td><td>khi sửa hoặc xin giữ một dòng, người khác phải chờ hoặc bị
      từ chối (<code>SELECT … FOR UPDATE</code>)</td></tr><tr><td>④ bản ghi JSON lồng
      nhau</td><td>một bản ghi chứa luôn danh sách con, không cần bảng thứ hai (tài
      khoản chứa mảng giao dịch)</td></tr><tr><td>⑤ nguyên tử</td><td>một thao tác
      trọn vẹn: kiểm và sửa trong một bước, không ai chen giữa (trừ tiền chỉ khi còn
      đủ)</td></tr></table>'
    say: Trước hết ta cần hiểu năm điều, khoá chính là cột có giá trị riêng cho từng
      hàng, khoá ngoại trỏ tới khoá chính bảng khác, nối bảng ghép hàng theo khoá.
      Chỉ mục là danh mục tra nhanh theo một cột, còn quét tuần tự là đọc từng dòng
      từ đầu tới cuối. Khoá dòng là khi một người giữ dòng thì người khác phải chờ
      hoặc bị từ chối. Bản ghi JSON lồng nhau chứa luôn danh sách con, và nguyên tử
      là kiểm và sửa trong một bước.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l28_removed(1000, False) == 999
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>Seq
      Scan</code> / <code>Index Scan</code></td><td>quét tuần tự / quét theo chỉ mục
      (kế hoạch của PostgreSQL)</td></tr><tr><td><code>Rows Removed by Filter</code></td><td>số
      dòng đã đọc rồi <b>bị loại</b> vì không khớp điều kiện</td></tr><tr><td><code>COLLSCAN</code>
      / <code>IXSCAN</code></td><td>quét cả kho / quét theo chỉ mục (kế hoạch của
      cơ sở dữ liệu lưu bản ghi JSON)</td></tr><tr><td><code>FOR UPDATE NOWAIT</code></td><td>xin
      giữ dòng để sửa và <b>không chờ</b>: bị giữ rồi thì báo lỗi ngay</td></tr><tr><td><code>$gte</code>,
      <code>$inc</code></td><td>toán tử của bản ghi JSON: lớn hơn hoặc bằng; cộng
      thêm một lượng</td></tr><tr><td><code>updateOne(điều kiện, thay đổi)</code></td><td>sửa
      một bản ghi đúng khi điều kiện còn đúng, trong một bước</td></tr></table>'
    introduces:
    - bnx_gte
    say: Quét tuần tự và quét theo chỉ mục là hai cách đọc trong kế hoạch của PostgreSQL,
      và dòng bị loại cho biết bao nhiêu dòng đã đọc rồi bỏ. Hai tên thứ ba là cách
      đọc tương ứng ở cơ sở dữ liệu JSON. Xin giữ dòng không chờ nghĩa là dòng đã
      bị giữ thì báo lỗi ngay. Hai toán tử là lớn hơn hoặc bằng và cộng thêm.
  - show: '<table class=''t''><tr><th>viết trong lệnh</th><th>đọc là</th><th>ví dụ
      nhỏ</th></tr><tr><td><code>docker run --rm -d --name C IMG</code></td><td>chạy
      một <b>hộp</b> từ ảnh <code>IMG</code>: <code>--rm</code> tự xoá hộp khi dừng,
      <code>-d</code> chạy nền, <code>--name</code> đặt tên</td><td><code>docker run
      --rm -d --name x postgres</code></td></tr><tr><td><code>docker exec -i C …</code>,
      <code>docker cp a.sql C:/a.sql</code></td><td><code>exec</code> chạy lệnh trong
      hộp đang chạy (<code>-d</code>: chạy nền); <code>cp</code> chép tệp vào hộp</td><td><code>docker
      cp a.sql x:/a.sql</code></td></tr><tr><td><code>P="docker exec … psql -tA"</code>,
      <code>&#36;P -q -c "…"</code></td><td>gán cả lệnh vào biến <code>P</code>, rồi
      <code>&#36;P</code> thay nó vào; <code>-c</code> chạy một câu SQL rồi thoát;
      <code>-q</code> ít chữ; <code>-tA</code> bỏ dòng tiêu đề và căn cột</td><td><code>&#36;n</code>,
      <code>&#36;EX</code> cũng là biến</td></tr></table>'
    clear: true
    say: 'Các lệnh Docker: chạy dựng hộp từ ảnh, tự xoá khi dừng và chạy nền; thực
      thi chạy việc trong hộp đang chạy; chép đưa tệp vào hộp. Biến chứa cả lệnh,
      kèm hai tuỳ chọn bỏ tiêu đề và căn cột.'
  - show: '<table class=''t''><tr><th>viết trong lệnh</th><th>đọc là</th><th>ví dụ
      nhỏ</th></tr><tr><td><code>loc() { grep -E "Scan|Rows Removed"; }</code>, <code>…
      | loc</code></td><td><code>loc</code> là hàm lọc: giữ dòng có chữ <code>Scan</code>
      hoặc <code>Rows Removed</code>; dấu <code>|</code> đưa đầu ra lệnh trái vào
      hàm</td><td><code>echo ab | grep a</code> in <code>ab</code></td></tr><tr><td><code>generate_series(1,&#36;n)</code>,
      <code>analyze</code>, <code>explain (analyze, …)</code></td><td><code>generate_series(1,n)</code>
      sinh n dòng số từ 1 tới n; <code>analyze</code> cập nhật thống kê để kế hoạch
      đúng; <code>explain (analyze)</code> chạy thật rồi in kế hoạch</td><td><code>generate_series(1,3)</code>
      ra 1, 2, 3</td></tr><tr><td><code>\! touch /tmp/a.ok</code>, <code>pg_sleep(30)</code></td><td><code>\!</code>
      trong <code>psql</code> chạy lệnh của vỏ lệnh; <code>touch</code> tạo tệp rỗng
      làm tín hiệu; <code>pg_sleep(30)</code> ngủ 30 giây để giữ khoá</td><td>phiên
      B thấy <code>/tmp/a.ok</code> là biết A đã giữ khoá</td></tr></table>'
    introduces:
    - bnx_explain
    clear: true
    say: Hàm lọc giữ các dòng có chữ cho trước. Hàm sinh dãy số tạo ra từng ấy dòng,
      lệnh phân tích cập nhật thống kê, lệnh xem kế hoạch chạy thật rồi in cách đọc.
      Dòng cuối tạo tệp tín hiệu rồi ngủ giữ khoá ba mươi giây.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ nhỏ</th></tr><tr><td><code>DECLARE
      x NUMBER; BEGIN … END; /</code></td><td>khối của Oracle: <code>DECLARE</code>
      khai biến, <code>BEGIN … END</code> là thân; <code>SELECT … INTO x</code> chép
      kết quả vào biến <code>x</code>; <code>ROLLBACK</code> huỷ giao dịch; <code>/</code>
      ở dòng riêng ra lệnh chạy khối</td><td><code>DBMS_SESSION.SLEEP(9)</code> ngủ
      9 giây</td></tr><tr><td><code>dbrun.ora(…)</code>, <code>threading.Thread(target=…)</code></td><td><code>dbrun.ora</code>
      là hàm riêng của khoá gửi SQL tới Oracle trong Docker (không phải lệnh của Oracle);
      <code>Thread</code> chạy hàm song song, <code>start()</code> bắt đầu, <code>join()</code>
      đợi xong; <code>args=(x,)</code>: bộ chứa đối số đưa cho hàm, dấu phẩy cuối
      để thành bộ một phần tử</td><td><code>a.start()</code> rồi <code>a.join()</code></td></tr><tr><td><code>SET
      LOCK_TIMEOUT 0</code>, <code>WITH (UPDLOCK, ROWLOCK)</code></td><td>của SQL
      Server: <code>LOCK_TIMEOUT 0</code> là không chờ khoá; <code>UPDLOCK, ROWLOCK</code>
      xin khoá cập nhật mức dòng</td><td>thay cho <code>FOR UPDATE NOWAIT</code></td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Cuối cùng là mã chạy trên Oracle và SQL Server. Khối của Oracle khai biến,
      chép kết quả vào biến rồi huỷ giao dịch, dấu gạch chéo ra lệnh chạy. Luồng chạy
      hàm song song, nhận đối số trong một bộ. SQL Server đặt thời gian chờ khoá bằng
      không.
- id: intuition
  kind: intuition
  title: 'Hình dung: bảng và bản ghi lồng nhau, chỉ mục và khoá'
  checks:
  - '[alg.bnx_l28_removed(n, False) for n in (1000, 100000, 1000000)] == [999, 99999,
