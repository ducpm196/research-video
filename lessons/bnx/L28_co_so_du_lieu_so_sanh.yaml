  - alg.bnx_l28_removed(1000000, True) == 0
  steps:
  - show: '<div><svg width="1500" height="520" viewBox="0 0 1500 520" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
