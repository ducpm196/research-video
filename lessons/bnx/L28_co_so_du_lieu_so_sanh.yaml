- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ mô hình dữ liệu tới lựa chọn'
  checks:
  - alg.bnx_l28_withdraw(1000, [600, 600]) == ([1, 0], 400)
  - alg.bnx_l28_removed(1000, True) == 0
  - alg.bnx_l28_sql_update(1000, 600) == (1, 400) and alg.bnx_l28_sql_update(400,
    600) == (0, 400)
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>js
      ''…''</code>, <code>print(…)</code></td><td><code>js</code>: hàm của mã chạy
      thật, gửi đoạn lệnh trong cặp nháy đơn tới <code>mongosh</code> (dòng lệnh của
      MongoDB) trong hộp; <code>print</code> in một dòng</td></tr><tr><td><code>db.tk.insertMany([{…},
      {…}])</code></td><td>chèn nhiều bản ghi vào tập <code>tk</code>; <code>[ ]</code>:
      danh sách, <code>{ }</code>: một bản ghi, <code>tên: giá trị</code>: một trường;
      <code>gd: [ … ]</code>: trường chứa danh sách bản ghi con</td></tr><tr><td><code>JSON.stringify(db.tk.findOne({_id:
      "001"}))</code></td><td><code>findOne(điều kiện)</code> lấy một bản ghi khớp;
      <code>JSON.stringify</code> đổi nó thành chữ JSON để in</td></tr><tr><td><code>db.tk.countDocuments({"gd.loai":
      "rut"})</code></td><td>đếm bản ghi khớp điều kiện; <code>"gd.loai"</code>: đi
      vào trường lồng, tức trường <code>loai</code> của các phần tử trong <code>gd</code></td></tr></table>'
    introduces:
    - bnx_mongosh
    clear: true
    say: 'Hàm gửi đoạn lệnh vào cơ sở dữ liệu JSON, nên mỗi lần gọi chạy một đoạn;
      lệnh in ra một dòng. Chèn nhiều bản ghi: ngoặc vuông là danh sách, ngoặc nhọn
      là một bản ghi. Tìm một bản ghi rồi đổi nó thành chữ JSON để in. Đếm bản ghi
      khớp; tên có dấu chấm đi vào trường lồng.'
  - show: '<p><b>Bước 1. Mô hình dữ liệu.</b> Hệ quan hệ tách thông tin thành các
      bảng và nối bằng <b>khoá ngoại</b>: dữ liệu không lặp, ràng buộc chặt, nhưng
      đọc nhiều bảng phải nối. Bản ghi JSON chứa luôn danh sách con: đọc một lần,
      nhưng cùng dữ liệu có thể lặp ở nhiều bản ghi.</p><p><b>Bản ghi JSON lồng nhau
      (trích từ mã chạy thật)</b></p><div class="code"><div>js ''</div><div>db.tk.insertMany([</div><div>  {_id:
      "001", ten: "An", so_du: 1000, gd: [{so: 600, loai: "nap"}, {so: 50, loai: "rut"}]},</div><div>  {_id:
      "002", ten: "Binh", so_du: 300, gd: []}]);</div><div>print(JSON.stringify(db.tk.findOne({_id:
      "001"})));</div><div>print("co gd rut: " + db.tk.countDocuments({"gd.loai":
      "rut"}))''</div></div>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: 'Bước một là mô hình dữ liệu: hệ quan hệ tách thông tin thành các bảng nối
      bằng khoá ngoại, nên dữ liệu không lặp, ràng buộc chặt, nhưng đọc nhiều bảng
      phải nối. Bản ghi JSON chứa luôn danh sách con, đọc một lần là đủ, đổi lại dữ
      liệu có thể lặp.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>for
      n in 1000 100000 1000000; do … done</code></td><td>vòng lặp của vỏ lệnh: <code>n</code>
      lần lượt là ba giá trị; <code><span>&#36;</span>n</code> là giá trị hiện tại;
      các dòng giữa <code>do</code> và <code>done</code> chạy mỗi lần</td></tr><tr><td><code>create
      table t<span>&#36;</span>n (id int primary key, so text)</code></td><td>tạo
      bảng: <code>id int primary key</code> là cột số nguyên làm <b>khoá chính</b>
      (mỗi dòng một giá trị riêng); <code>so text</code> là cột chữ</td></tr><tr><td><code>insert
      into t<span>&#36;</span>n select g, ''K''||g from generate_series(1,<span>&#36;</span>n)
      g</code></td><td>chèn kết quả của câu <code>select</code>: mỗi số <code>g</code>
      thành một dòng; <code>''K''||g</code> nối chữ K với số, ra <code>K1</code>,
      <code>K2</code>…</td></tr><tr><td><code>where so = ''K7''</code>, <code>create
      index on t<span>&#36;</span>n(so)</code></td><td><code>where</code> chỉ giữ
      dòng có cột <code>so</code> bằng <code>K7</code>; <code>create index on t(so)</code>
      tạo chỉ mục trên cột <code>so</code></td></tr></table>'
    clear: true
    say: Vòng lặp cho biến nhận ba cỡ bảng lần lượt. Tạo bảng có cột số nguyên làm
      khoá chính, nên mỗi dòng một giá trị riêng, và một cột chữ. Chèn từng số thành
      một dòng, hai gạch đứng nối chữ cái với số. Điều kiện giữ dòng cần tìm, lệnh
      tạo chỉ mục lập danh mục tra nhanh.
  - show: '<p><b>Bước 2. Chỉ mục.</b> Muốn tìm một giá trị mà không đọc cả bảng, ta
      tạo chỉ mục trên cột đó. Câu lệnh <code>EXPLAIN</code> đặt trước truy vấn bắt
      hệ <b>in kế hoạch</b>: sẽ đọc bảng cách nào, <code>Seq Scan</code> hay <code>Index
      Scan</code>.</p><p><b>ChayPg (trích): với mỗi cỡ bảng, xem kế hoạch trước và
      sau khi tạo chỉ mục</b></p><div class="code"><div>for n in 1000 100000 1000000;
      do</div><div>  <span>&#36;</span>P -q -c "create table t<span>&#36;</span>n
      (id int primary key, so text)"</div><div>  <span>&#36;</span>P -q -c "insert
      into t<span>&#36;</span>n select g, ''K''||g from generate_series(1,<span>&#36;</span>n)
      g"</div><div>  <span>&#36;</span>P -q -c "analyze t<span>&#36;</span>n"</div><div>  echo
      "<span>&#36;</span>n dong, khong chi muc:"</div><div>  <span>&#36;</span>P -c
      "<span>&#36;</span>EX select * from t<span>&#36;</span>n where so = ''K7''"
      | loc</div><div>  <span>&#36;</span>P -q -c "create index on t<span>&#36;</span>n(so)"</div><div>  <span>&#36;</span>P
      -q -c "analyze t<span>&#36;</span>n"</div><div>  echo "<span>&#36;</span>n dong,
      co chi muc:"</div><div>  <span>&#36;</span>P -c "<span>&#36;</span>EX select
      * from t<span>&#36;</span>n where so = ''K7''" | loc</div><div>done</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước hai là chỉ mục: muốn tìm một giá trị mà không đọc cả bảng, nên ta tạo
      chỉ mục trên cột đó. Lệnh xem kế hoạch bắt hệ in ra cách nó sẽ đọc bảng, với
      ba cỡ bảng, trước và sau khi tạo chỉ mục.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>begin;
      … commit;</code></td><td><code>begin</code> mở một <b>giao dịch</b>: các lệnh
      sau thành một khối; <code>commit</code> chốt khối; khoá được giữ tới lúc chốt</td></tr><tr><td><code>select
      1 from tk where id = 1 for update;</code></td><td>chọn dòng <code>id = 1</code>
      và <b>khoá</b> nó; số <code>1</code> chỉ là giá trị bỏ đi, ta cần khoá chứ không
      cần dữ liệu</td></tr></table>'
    clear: true
    say: Mở giao dịch, nên các lệnh sau thành một khối; chốt khối thì khoá mới nhả.
      Chọn dòng cần giữ và khoá nó, số một chỉ là giá trị bỏ đi.
  - show: '<p><b>Bước 3. Hai người cùng sửa một dòng.</b> Ở hệ quan hệ, người thứ
      nhất giữ <b>khoá dòng</b> (<code>FOR UPDATE</code>). Người thứ hai có hai lựa
      chọn: chờ, hoặc <b>không chờ</b> (<code>NOWAIT</code>) và nhận lỗi ngay. Mỗi
      hệ báo lỗi bằng mã riêng, nên ứng dụng phải bắt đúng mã của hệ mình dùng.</p><p><b>Phiên
      A của PostgreSQL: giữ khoá một dòng trong 30 giây</b></p><div class="code"><div>begin;</div><div>select
      1 from tk where id = 1 for update;</div><div>\! touch /tmp/a.ok</div><div>select
      pg_sleep(30);</div><div>commit;</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước ba là hai người cùng sửa một dòng: người thứ nhất giữ khoá dòng, người
      thứ hai chờ hoặc không chờ và nhận lỗi ngay. Mỗi hệ báo lỗi bằng mã riêng, nên
      ứng dụng phải bắt đúng mã của hệ mình dùng.'
  - show: '<p><b>Bước 4. Cập nhật có điều kiện.</b> Ở cơ sở dữ liệu lưu bản ghi JSON,
      ghi trên một bản ghi là <b>nguyên tử</b>. Nên thay vì đọc rồi ghi, ta đưa điều
      kiện vào lệnh: chỉ khi <code>so_du &gt;= 600</code> thì cộng thêm −600. Hai
      lần rút 600 từ 1000: lần đầu khớp điều kiện, lần sau thì không.</p>$$1000 \ge
      600 \Rightarrow 1000 - 600 = 400; \qquad 400 \ge 600 \;\text{sai} \Rightarrow
      \hl{\text{từ chối}}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước bốn là cập nhật có điều kiện: ở cơ sở dữ liệu JSON, ghi trên một bản
      ghi là nguyên tử. Nên thay vì đọc rồi ghi, ta đưa điều kiện vào lệnh sửa. Hai
      lần rút sáu trăm từ một nghìn thì lần đầu còn bốn trăm, lần sau không khớp nên
      bị từ chối.'
    introduces:
    - implies
  - show: '<p><b>Làm thử ở hệ quan hệ.</b> Cùng ý tưởng, một câu cập nhật có thêm
      điều kiện số dư:</p>

      <p><code>UPDATE tk SET so_du = so_du - 600 WHERE id = 1 AND so_du &gt;= 600</code></p>

      <p>Số dòng bị sửa là <b>1</b> khi còn đủ tiền, <b>0</b> khi bị từ chối.</p>

      '
    clear: true
    say: Hệ quan hệ cũng viết được kiểu này, bằng một câu cập nhật có thêm điều kiện
      số dư, và số dòng bị sửa bằng không nghĩa là bị từ chối.
  - show: '<p><b>Bước 5. Chọn.</b> Không có hệ tốt nhất; có hệ hợp với yêu cầu. Đọc
      theo từng tiêu chí:</p><table class=''t''><tr><th>yêu cầu</th><th>nghiêng về</th><th>vì
      sao (điều đo hoặc đã thấy ở bài)</th></tr><tr><td>sổ tiền: nhiều bảng, nhiều
      bên cùng ghi, phải kiểm toán</td><td>hệ quan hệ</td><td>khoá ngoại, giao dịch
      nhiều bảng, khoá dòng báo lỗi rõ</td></tr><tr><td>dữ liệu lồng nhau, đọc nguyên
      một bản ghi, ít nối</td><td>bản ghi JSON</td><td>đọc một lần; sửa một bản ghi
      nguyên tử; nhưng nhiều bản ghi cần giao dịch riêng</td></tr><tr><td>báo cáo
      quét nhiều dòng</td><td>hệ quan hệ có chỉ mục, kế hoạch xem được</td><td>tuỳ
      cỡ bảng mà quét tuần tự hay chỉ mục</td></tr></table>'
    focus:
    - - 1
    - 1
    - 2
    clear: true
    say: 'Bước năm là chọn: không có hệ tốt nhất mà chỉ có hệ hợp với yêu cầu. Sổ
      tiền nhiều bảng, nhiều bên cùng ghi và phải kiểm toán, nên nghiêng về hệ quan
      hệ. Dữ liệu lồng nhau đọc nguyên một bản ghi thì nghiêng về bản ghi JSON, còn
      báo cáo quét nhiều dòng cần chỉ mục.'
- id: example
  kind: example
  title: Ví dụ chạy thật trên năm hệ, từng phép tính
  checks:
  - '[alg.bnx_l28_removed(n, False) for n in (1000, 100000, 1000000)] == [999, 99999,
    999999]'
  - alg.bnx_l28_withdraw(1000, [600, 600]) == ([1, 0], 400)
  steps:
  - show: '<p><b>PostgreSQL 17 chạy trong Docker: hộp chương trình đóng sẵn gọi là
      ảnh (ảnh chính thức, ghim băm)</b></p><div class="code"><div>phien ban: 17.12</div><div>1000
      dong, khong chi muc:</div><div>Seq Scan on t1000 (actual rows=1 loops=1)</div><div>  Rows
      Removed by Filter: 999</div><div>1000 dong, co chi muc:</div><div>Index Scan
      using t1000_so_idx on t1000 (actual rows=1 loops=1)</div></div>$$① \; 1000 \text{
      dòng, không chỉ mục: loại } \hl{999}; \quad \text{có chỉ mục: loại } \hlg{0}$$'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Ta chạy thật bằng Docker, công cụ chạy chương trình trong một hộp đóng sẵn
      gọi là ảnh, mỗi lần một ảnh. Phép tính thứ nhất là PostgreSQL với bảng một nghìn
      dòng: không chỉ mục thì quét tuần tự, loại chín trăm chín mươi chín dòng. Có
      chỉ mục thì không loại dòng nào.'
  - show: '<p><b>Cùng truy vấn ở 10⁵ và 10⁶ dòng</b></p><div class="code"><div>100000
      dong, khong chi muc:</div><div>Seq Scan on t100000 (actual rows=1 loops=1)</div><div>  Rows
      Removed by Filter: 99999</div><div>1000000 dong, khong chi muc:</div><div>Seq
      Scan on t1000000 (actual rows=1 loops=1)</div><div>  Rows Removed by Filter:
      999999</div><div>1000000 dong, co chi muc:</div><div>Index Scan using t1000000_so_idx
      on t1000000 (actual rows=1 loops=1)</div></div>$$② \; 10^3 \to 10^5 \to 10^6
      \text{ dòng: loại } 999 \to 99\,999 \to 999\,999; \; \text{có chỉ mục luôn }
      \hlg{0}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ hai chạy cùng truy vấn ở các cỡ bảng lớn hơn. Số dòng bị loại
      tăng thẳng theo cỡ bảng, còn quét theo chỉ mục vẫn không loại dòng nào.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>docker
      exec -d <span>&#36;</span>C psql -U postgres -q -o /dev/null -f /a.sql</code></td><td><code>-U
      postgres</code> đăng nhập người dùng postgres; <code>-o /dev/null</code> bỏ
      kết quả in ra; <code>-f</code> chạy các câu SQL trong tệp</td></tr><tr><td><code>until
      docker exec <span>&#36;</span>C test -f /tmp/a.ok; do sleep 0.5; done</code></td><td><code>until</code>:
      lặp tới khi lệnh thành công; <code>test -f</code> hỏi tệp có tồn tại không;
      <code>sleep 0.5</code> nghỉ nửa giây giữa hai lần hỏi</td></tr><tr><td><code>…
      2&gt;&amp;1 | head -1</code></td><td><code>2&gt;&amp;1</code> gộp thông báo
      lỗi vào đầu ra; <code>head -1</code> giữ dòng đầu tiên</td></tr><tr><td><code>docker
      rm -f <span>&#36;</span>C &gt;/dev/null 2&gt;&amp;1</code></td><td>xoá hộp (<code>-f</code>:
      kể cả khi đang chạy); <code>&gt;/dev/null 2&gt;&amp;1</code> bỏ mọi chữ in ra</td></tr></table>'
    clear: true
    say: Chạy tệp SQL nền, bỏ kết quả in ra. Cứ nửa giây hỏi một lần tới khi tệp tín
      hiệu xuất hiện. Gộp lỗi vào đầu ra, giữ dòng đầu tiên. Xoá hộp kể cả khi đang
      chạy, bỏ mọi chữ in ra.
  - show: '<p><b>Phiên B của PostgreSQL: chờ phiên A giữ khoá, rồi xin khoá không
      chờ</b></p><div class="code"><div>docker cp a.sql <span>&#36;</span>C:/a.sql</div><div>docker
      exec -d <span>&#36;</span>C psql -U postgres -q -o /dev/null -f /a.sql</div><div>until
      docker exec <span>&#36;</span>C test -f /tmp/a.ok; do sleep 0.5; done</div><div><span>&#36;</span>P
      -c "select * from tk where id = 1 for update nowait" 2&gt;&amp;1 | head -1</div><div>docker
      rm -f <span>&#36;</span>C &gt;/dev/null 2&gt;&amp;1</div></div><p><b>PostgreSQL</b></p><div
      class="code"><div>ERROR:  could not obtain lock on row in relation "tk"</div></div>$$③
      \; \text{PostgreSQL: } \hl{\text{báo lỗi ngay}} \text{ thay vì chờ}$$'
    focus:
    - 1
    - - 3
      - 4
    clear: true
    say: 'Phép tính thứ ba là khoá dòng không chờ: phiên A giữ khoá, mã chờ tới khi
      chắc A đã giữ. Phiên B xin khoá không chờ, và PostgreSQL báo lỗi ngay.'
  - show: '<p><b>SoSanhKhoa.py (trích): phiên A giữ khoá 9 giây trên Oracle, phiên
      B xin không chờ</b></p><div class="code"><div>a = threading.Thread(target=dbrun.ora,
      args=("""</div><div>DECLARE x NUMBER;</div><div>BEGIN</div><div>  SELECT so_du
      INTO x FROM bnx_l28_tk WHERE id = 1 FOR UPDATE;</div><div>  DBMS_SESSION.SLEEP(9);</div><div>  ROLLBACK;</div><div>END;</div><div>/</div><div>""",))</div><div>a.start()</div><div>time.sleep(5)</div><div>o
      = dbrun.ora("SELECT so_du FROM bnx_l28_tk WHERE id = 1 FOR UPDATE NOWAIT;")</div></div>'
    clear: true
    say: 'Phép tính thứ tư làm việc ấy trên Oracle và SQL Server: một nhánh chạy
      song song giữ khoá chín giây trên Oracle, nhánh chính đợi năm giây rồi xin khoá không chờ.'
  - show: '<p><b>SoSanhKhoa.py (trích): phiên B của SQL Server xin khoá bằng câu lệnh
      riêng của nó</b></p><div class="code"><div>xin = """SET LOCK_TIMEOUT 0;</div><div>SELECT
      so_du FROM tk WITH (UPDLOCK, ROWLOCK) WHERE id = 1"""</div><div>o = dbrun.mss(xin,
      db="bnx_l28")</div><div>b.join()</div></div><div class="box key">SQL Server
      <b>không có</b> <code>FOR UPDATE NOWAIT</code>: viết như Oracle thì báo <code>Msg
      1003</code> (<code>FOR UPDATE</code> chỉ dùng cho con trỏ). Cách tương đương:
      <code>SET LOCK_TIMEOUT 0</code> cộng <code>WITH (UPDLOCK, ROWLOCK)</code>.</div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'SQL Server không có câu xin khoá kiểu Oracle: viết thế thì báo mã
      lỗi một nghìn không trăm lẻ ba. Cách tương đương là đặt thời gian chờ khoá bằng
      không rồi xin khoá cập nhật mức dòng.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>docker
      exec -d <span>&#36;</span>C sh -c "mysql -uroot -pbnx_pass bnx &lt; /mysqla.sql
      &gt; /dev/null 2&gt;&amp;1"</code></td><td><code>sh -c "…"</code> chạy chuỗi
      trong nháy như một lệnh vỏ ngay trong hộp, vì dấu <code>&lt;</code> và <code>&gt;</code>
      cần vỏ xử lý; <code>-uroot</code>: người dùng; <code>-p…</code>: mật khẩu; <code>bnx</code>:
      tên cơ sở dữ liệu; <code>&lt; tệp</code>: lấy tệp làm đầu vào</td></tr><tr><td><code>wait_lock</code></td><td>hàm
      của mã chạy thật: hỏi MySQL liên tục tới khi có khoá bản ghi, tức phiên A đã
      giữ khoá</td></tr><tr><td><code>q "select … for update nowait" | head -1</code></td><td><code>q</code>:
      hàm của mã chạy thật, chạy một câu SQL trong hộp; <code>nowait</code>: xin khoá
      không chờ</td></tr></table>'
    clear: true
    say: Chạy lệnh trong vỏ của hộp, lấy tệp SQL làm đầu vào. Hàm chờ khoá hỏi tới khi
      có khoá bản ghi, nghĩa là phiên A đã giữ khoá. Hàm q chạy một câu truy vấn
      trong hộp, xin khoá không chờ.
  - show: '<p><b>ChayMy (trích): phiên A của MySQL giữ khoá 30 giây; wait_lock đợi
      A giữ khoá rồi B xin không chờ</b></p><div class="code"><div>docker cp mysqla.sql
      <span>&#36;</span>C:/mysqla.sql</div><div>docker exec -d <span>&#36;</span>C
      sh -c "mysql -uroot -pbnx_pass bnx &lt; /mysqla.sql &gt; /dev/null 2&gt;&amp;1"</div><div>wait_lock</div><div>q
      "select * from tk where id = 1 for update nowait" | head -1</div><div>docker
      rm -f <span>&#36;</span>C &gt;/dev/null 2&gt;&amp;1</div></div>'
    clear: true
    say: 'Với MySQL ta làm cùng cách: phiên A chạy nền giữ khoá dòng ba
      mươi giây, mã chờ tới khi A đã giữ, rồi phiên B xin khoá không chờ.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>Oracle: ORA-00054:
      Failed to acquire a lock</div><div>SQL Server: Msg 1222: Lock request time out
      period exceeded.</div></div><p><b>MySQL 8.4.13</b></p><div class="code"><div>phien
      ban: 8.4.13</div><div>ERROR 3572 (HY000) at line 1: Statement aborted because
      lock(s) … NOWAIT is set.</div></div>$$④ \; \text{Oracle: ORA-00054}; \;\; \text{SQL
      Server: Msg 1222}; \;\; \text{MySQL: ERROR 3572}$$'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: 'Kết quả thật: Oracle báo mã O R A 00054. SQL Server báo thông
      báo số một nghìn hai trăm hai mươi hai vì hết hạn chờ khoá. MySQL báo lỗi
      ba nghìn năm trăm bảy mươi hai vì không lấy được khoá ngay.'
  - show: '<table class=''t''><tr><th>hệ</th><th>báo gì khi xin khoá dòng không chờ
      (nguyên văn máy in)</th></tr><tr><td>PostgreSQL 17</td><td>ERROR: could not
      obtain lock on row in relation &quot;tk&quot; (SQLSTATE 55P03)</td></tr><tr><td>MySQL 8.4</td><td>ERROR
      3572 (HY000): Statement aborted because lock(s) could not be acquired immediately
      and NOWAIT is set.</td></tr><tr><td>Oracle 26ai</td><td>ORA-00054: Failed to
      acquire a lock</td></tr><tr><td>SQL Server 2022</td><td>Msg 1222: Lock request
      time out period exceeded.</td></tr></table>'
    clear: true
    say: Bảng này đặt bốn hệ cạnh nhau, mỗi hệ một mã lỗi hoặc mã trạng thái SQLSTATE, nên ứng dụng phải bắt lỗi
      theo mã chứ đừng theo chữ.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>var
      rut = () =&gt; db.tk.updateOne(…).modifiedCount;</code></td><td><code>var</code>
      khai biến; <code>() =&gt; …</code> là hàm ngắn không tham số: gọi <code>rut()</code>
      thì chạy phần sau mũi tên; <code>updateOne</code> sửa một bản ghi khớp; <code>modifiedCount</code>
      là số bản ghi đã sửa, 1 hoặc 0</td></tr><tr><td><code>print("rut 600 lan 1:
      " + rut());</code></td><td>gọi hàm rồi nối kết quả vào chuỗi để in</td></tr><tr><td><code>db.tk.findOne({_id:
      "001"}).so_du</code></td><td>lấy bản ghi rồi đọc trường <code>so_du</code> bằng
      dấu chấm</td></tr></table>'
    clear: true
    say: 'Hàm ngắn không tham số: gọi nó thì sửa một bản ghi khớp và trả số bản ghi
      đã sửa. Gọi hàm rồi nối kết quả vào chuỗi để in. Lấy bản ghi rồi đọc trường
      số dư.'
  - show: '<p><b>Cập nhật có điều kiện, gõ trong mongosh là dòng lệnh của MongoDB
      (mã chạy thật)</b></p><div class="code"><div>js ''</div><div>var rut = () =&gt;
      db.tk.updateOne({_id: "001", so_du: {<span>&#36;</span>gte: 600}}, {<span>&#36;</span>inc:
      {so_du: -600}}).modifiedCount;</div><div>print("rut 600 lan 1: " + rut());</div><div>print("rut
      600 lan 2: " + rut());</div><div>print("so du con lai: " + db.tk.findOne({_id:
      "001"}).so_du)''</div></div><p><b>MongoDB 8</b></p><div class="code"><div>rut
      600 lan 1: 1</div><div>rut 600 lan 2: 0</div><div>so du con lai: 400</div></div>$$⑤
      \; 1000 \to 400; \;\; \text{lần 2: } \hl{0} \text{ bản ghi bị sửa}$$'
    focus:
    - 1
    - 4
    clear: true
    say: 'Phép tính thứ năm là cập nhật có điều kiện: chỉ trừ khi số dư còn từ sáu
      trăm trở lên. Lần thứ nhất sửa một bản ghi, còn bốn trăm, lần thứ hai không
      bản ghi nào khớp nên không sửa gì.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: rút tiền có điều kiện so với đọc rồi ghi'
  checks:
  - alg.bnx_l28_withdraw(1000, [600, 600]) == ([1, 0], 400)
  - alg.bnx_l28_lost_update(1000, 600, 600) == (400, 600)
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>tk
      = {"so_du": 1000}</code>, <code>tk["so_du"] -= so</code></td><td>từ điển: <code>tk["so_du"]</code>
      là giá trị của khoá <code>so_du</code>; <code>-=</code> trừ bớt một lượng khỏi
      giá trị đó</td></tr><tr><td><code>def rut_co_dieu_kien(so): … return 1</code></td><td>khai
      hàm; các dòng thụt vào là thân; <code>return</code> trả giá trị về chỗ gọi và
      dừng hàm</td></tr><tr><td><code>doc_a = doc_b = 1000</code></td><td>gán cùng
      một giá trị cho cả hai tên: hai bên cùng đọc số dư trước khi ai ghi</td></tr><tr><td><code>print("con",
      so_du)</code>, <code>#</code></td><td>in các giá trị cách nhau một dấu cách;
      từ <code>#</code> tới hết dòng là ghi chú, máy bỏ qua</td></tr></table>'
    clear: true
    say: Từ điển giữ số dư dưới một khoá; dấu trừ bằng trừ bớt. Khai hàm, lệnh trả
      về đưa giá trị về chỗ gọi. Gán cùng giá trị cho hai tên, nên hai bên cùng đọc
      số dư trước khi ai ghi. Lệnh in các giá trị cách nhau một dấu cách.
  - show: '<p><b>MÔ PHỎNG bằng Python, không phải tranh chấp thật — RutTien.py: cùng
      số dư 1000, hai lần rút 600</b></p><div class="code"><div>tk = {"so_du": 1000}</div><div>
      </div><div>def rut_co_dieu_kien(so):</div><div>    if tk["so_du"] &gt;= so:        #
      kiểm và trừ trong MỘT bước</div><div>        tk["so_du"] -= so</div><div>        return
      1</div><div>    return 0</div><div> </div><div>print("co dieu kien:", rut_co_dieu_kien(600),
      rut_co_dieu_kien(600), "con", tk["so_du"])</div><div>doc_a = doc_b = 1000             #
      hai bên cùng đọc trước khi ai ghi</div><div>so_du = doc_a - 600              #
      A ghi</div><div>so_du = doc_b - 600              # B ghi đè</div><div>print("doc
      roi ghi: con", so_du, ", chi ra 1200 nhung chi bi tru 600")</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Đây là mô phỏng chứ không phải tranh chấp thật. Hàm rút có điều kiện kiểm
      và trừ trong một bước, nên lần thứ hai bị từ chối. Cách sai thì hai bên cùng
      đọc một nghìn rồi mỗi bên ghi một nghìn trừ sáu trăm, nên bên ghi sau đè lên
      bên trước.
  - show: '<div class="box warn"><b>MÔ PHỎNG</b> bằng Python: hai biến gán tay, <b>không
      phải</b> hai phiên tranh chấp thật trên cơ sở dữ liệu.</div><p><b>Kết quả mô
      phỏng</b></p><div class="code"><div>co dieu kien: 1 0 con 400</div><div>doc
      roi ghi: con 400 , chi ra 1200 nhung chi bi tru 600</div></div><table class=''t''><tr><th>cách</th><th>số
      dư cuối</th><th>tiền đã chi ra</th><th>tiền thực sự bị trừ</th></tr><tr><td>cập
      nhật có điều kiện</td><td>400</td><td>600</td><td>600</td></tr><tr><td>đọc rồi
      ghi</td><td>400</td><td>1200</td><td>600</td></tr></table>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Cả hai cách đều ra số dư bốn trăm. Khác biệt ở tiền đã chi: có điều kiện
      chi sáu trăm, còn đọc rồi ghi chi một nghìn hai trăm nhưng chỉ trừ sáu trăm,
      nên ngân hàng mất sáu trăm.'
- id: quymo
  kind: example
  title: 'Khi bảng lớn dần: số dòng bị đọc và bị loại'
  checks:
  - '[alg.bnx_l28_removed(n, False) for n in (1000, 100000, 1000000, 10000000)] ==
    [999, 99999, 999999, 9999999]'
  - 1000000 // 1000 == 1000 and 10000000 // 1000 == 10000
  steps:
  - show: '<table class=''t''><tr><th>số dòng của bảng</th><th>quét tuần tự: dòng
      bị loại</th><th>quét theo chỉ mục: dòng bị loại</th><th>nguồn số</th></tr><tr><td>1
      000 (×1)</td><td>999</td><td>0</td><td>đo thật PostgreSQL 17</td></tr><tr><td>100
      000 (×100)</td><td>99 999</td><td>0</td><td>đo thật PostgreSQL 17</td></tr><tr><td>1
      000 000 (×1 000)</td><td>999 999</td><td>0</td><td>đo thật PostgreSQL 17</td></tr><tr><td>10
      000 000 (×10 000)</td><td>9 999 999</td><td>0</td><td>suy ra: n − 1 (công thức),
      không chạy ở bài</td></tr></table>'
    say: Bảng này cho thấy vấn đề đổi thế nào khi bảng lớn dần, ba dòng đầu là số
      đo thật. Quét tuần tự loại gần một nghìn dòng ở một nghìn dòng, gần một trăm
      nghìn ở một trăm nghìn dòng, gần một triệu ở một triệu dòng. Dòng cuối suy ra
      từ công thức, còn quét theo chỉ mục luôn loại không dòng nào.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>chọn khi</th></tr><tr><td>quét
      tuần tự</td><td>không cần chỉ mục; ghi nhanh</td><td>chi phí đọc tăng theo cỡ
      bảng</td><td>bảng nhỏ, hoặc truy vấn đọc phần lớn bảng</td></tr><tr><td>chỉ
      mục</td><td>đọc một giá trị gần như không đổi theo cỡ bảng</td><td>tốn chỗ;
      mỗi lần ghi phải cập nhật chỉ mục</td><td>tìm ít dòng trong bảng lớn</td></tr><tr><td>tách
      bảng báo cáo / lập bản tóm tắt</td><td>báo cáo nặng không tranh với giao dịch</td><td>dữ
      liệu tóm tắt có thể cũ; thêm việc vận hành</td><td>báo cáo quét nhiều dòng trên
      bảng giao dịch</td></tr></table>
    clear: true
    say: Bảng thứ hai cho thấy phải chọn gì. Quét tuần tự ghi nhanh, nhưng chi phí
      đọc tăng theo cỡ bảng. Chỉ mục giữ chi phí đọc gần như không đổi, đổi lại tốn
      chỗ và làm mỗi lần ghi chậm hơn. Còn báo cáo nặng thì tách bảng riêng để không tranh với giao dịch, đổi lại dữ liệu tóm tắt có thể cũ.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_l28_lost_update(1000, 600, 600) == (400, 600)
  - alg.bnx_l28_removed(1000000, False) == 999999
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người đã đi làm, lúc mới dựng).</b> Chuyển
      mã từ hệ này sang hệ khác mà <b class="red">chỉ đổi câu nối</b>. Cùng việc &laquo;xin
      khoá không chờ&raquo; mà mỗi hệ một cú pháp và một mã lỗi: ứng dụng bắt lỗi
      theo mã của hệ cũ sẽ không bắt được lỗi của hệ mới.

      Cách chữa: gom việc bắt lỗi khoá vào một chỗ, và có ca kiểm cho từng hệ.</div>

      '
    clear: true
    say: 'Lỗi thứ nhất, lúc mới dựng: chuyển mã sang hệ khác mà chỉ đổi câu nối. Cùng
      việc xin khoá không chờ mà mỗi hệ một cú pháp và mã lỗi, nên bắt lỗi theo mã
      hệ cũ không bắt được lỗi hệ mới. Cách chữa là gom việc bắt lỗi khoá vào một
      chỗ, mỗi hệ một ca kiểm.'
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc tải tăng).</b> Quên
      chỉ mục: chạy tốt ở 10³ dòng, nhưng ở 10⁶ dòng mỗi truy vấn loại 999 999 dòng.
      Hoặc ngược lại, <b class="red">lập chỉ mục cho mọi cột</b> làm mỗi lần ghi chậm
      đi và tốn chỗ.

      Chữa: đọc kế hoạch (<code>EXPLAIN</code>) của các truy vấn hay chạy, chỉ lập
      chỉ mục cho cột được tìm nhiều.</div><p><b>Đã đo ở phần ví dụ</b></p><div class="code"><div>1000000
      dong, khong chi muc:</div><div>Seq Scan on t1000000 (actual rows=1 loops=1)</div><div>  Rows
      Removed by Filter: 999999</div></div>

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Lỗi thứ hai, khi tải tăng: quên chỉ mục, nên chạy tốt ở một nghìn dòng nhưng
      ở một triệu dòng mỗi truy vấn loại gần một triệu dòng. Lập chỉ mục cho mọi cột
      thì làm mỗi lần ghi chậm đi và tốn chỗ. Cách chữa là đọc kế hoạch và chỉ lập
      chỉ mục cho cột được tìm nhiều.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc vận hành lâu dài).</b>
      Dùng <b class="red">đọc rồi ghi không điều kiện</b> cho số dư vì &laquo;ít khi
      hai người cùng sửa&raquo;. Mô phỏng: hai lần rút 600 từ 1000 chi ra 1200 mà
      chỉ trừ 600.

      Hiếm gặp không có nghĩa là không gặp; sau nhiều tháng, đến một ngày tải cao
      lỗi xảy ra. Cách chữa: cập nhật có điều kiện (ở hệ quan hệ: <code>UPDATE … WHERE
      so_du &gt;= số rút</code>), hoặc khoá dòng rồi mới đọc.</div>

      '
    clear: true
    say: 'Lỗi thứ ba, khi vận hành lâu dài: đọc rồi ghi không điều kiện cho số dư
      vì ít khi hai người cùng sửa. Mô phỏng cho thấy hai lần rút sáu trăm từ một
      nghìn chi một nghìn hai trăm mà chỉ trừ sáu trăm. Cách chữa là thêm điều kiện
      số dư vào câu cập nhật, hoặc khoá dòng rồi mới đọc.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l28_removed(250000, False) == 249999 and alg.bnx_l28_removed(2500000,
    False) == 2499999
  - alg.bnx_l28_withdraw(900, [400, 400, 400]) == ([1, 1, 0], 100)
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Bảng
      có 250 000 dòng, tìm một giá trị duy nhất. Quét tuần tự loại bao nhiêu dòng?
      Có chỉ mục loại bao nhiêu? Bảng có 2 500 000 dòng thì sao?</td></tr><tr><td>2</td><td>Số
      dư 900. Ba lần rút 400, 400, 400 theo cách cập nhật có điều kiện: mỗi lần được
      (1) hay bị từ chối (0), và số dư cuối?</td></tr><tr><td>3</td><td>Quyết định
      (số minh hoạ): dữ liệu hồ sơ khách gồm thông tin cá nhân, danh sách tài khoản,
      danh sách người thụ hưởng; mỗi lần mở hồ sơ cần đọc đủ ba phần; cập nhật hiếm,
      nhưng mỗi thay đổi phải ghi vết kiểm toán. Chọn: hệ quan hệ, bản ghi JSON, hay
      lai? Vì sao?</td></tr></table>'
    pause: 30
    say: Đến lượt bạn, ba câu để làm ra giấy. Số dòng bị loại của bảng hai trăm năm
      mươi nghìn dòng, số dư cuối sau ba lần rút bốn trăm từ chín trăm, và chọn hệ
      cho hồ sơ khách cần ghi vết kiểm toán. Hãy dừng lại làm ra giấy rồi xem đáp
      án.
  - show: '<p>Câu 1: loại n − 1 dòng khi quét tuần tự, 0 khi có chỉ mục.</p>

      $$250\,000 - 1 = \hlg{249\,999}; \quad \text{chỉ mục: } \hlg{0}; \quad 2\,500\,000
      - 1 = \hlg{2\,499\,999}$$

      '
    focus:
    - 1
    - 2
    say: Đáp án câu một, quét tuần tự loại hai trăm bốn mươi chín nghìn chín trăm
      chín mươi chín dòng, có chỉ mục thì không loại dòng nào. Bảng lớn hơn mười lần
      loại hai triệu bốn trăm chín mươi chín nghìn chín trăm chín mươi chín dòng.
    clear: true
  - show: '<p>Câu 2: lần nào còn đủ tiền thì trừ và được, không đủ thì từ chối.</p>

      $$900 \ge 400 \Rightarrow 500\;(1); \;\; 500 \ge 400 \Rightarrow 100\;(1); \;\;
      100 \ge 400 \text{ sai} \Rightarrow \hlg{0}; \;\; \text{còn } \hlg{100}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu hai, lần một chín trăm đủ bốn trăm nên được, còn năm trăm. Lần
      hai năm trăm vẫn đủ nên được, còn một trăm. Lần ba một trăm không đủ nên bị
      từ chối, số dư cuối là một trăm.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hệ
      quan hệ</td><td>ghi vết kiểm toán, ràng buộc chặt, giao dịch nhiều bảng</td><td>mở
      hồ sơ phải nối ba bảng</td></tr><tr><td>bản ghi JSON</td><td>mở hồ sơ đọc một
      lần</td><td>vết kiểm toán và ràng buộc tự lo; thay đổi nhiều bản ghi cần giao
      dịch riêng</td></tr><tr><td>lai: hệ quan hệ làm nguồn sự thật có vết kiểm toán,
      bản JSON dựng sẵn để mở hồ sơ nhanh</td><td>vừa chặt vừa nhanh</td><td>hai nơi
      phải đồng bộ; bản JSON có thể cũ</td></tr></table>'
    say: 'Đáp án câu ba: hệ quan hệ ghi vết kiểm toán và ràng buộc chặt, đổi lại phải
      nối ba bảng. Bản ghi JSON mở hồ sơ đọc một lần, đổi lại vết kiểm toán phải tự
      lo. Cách lai phải đồng bộ hai nơi, hợp lý là hệ quan hệ, vì kiểm toán nặng và
      cập nhật hiếm.'
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: rút tiền có điều kiện và lỗi đọc rồi ghi'
  steps:
  - show: '<p><b>Đề</b>: tài khoản có số dư <b>700</b>. Viết <code>mau.py</code>:</p>

      <ol><li>hàm <code>rut_co_dieu_kien(tk, so)</code> trừ khi còn đủ, trả 1 hoặc
      0; gọi với 500, 500, 200; in <code>co dieu kien: &lt;ba số cách nhau bằng dấu
      cách&gt; con &lt;số dư&gt;</code></li>

      <li>mô phỏng đọc rồi ghi: A và B cùng đọc 700, mỗi bên ghi 700 − 500; in số
      dư cuối và số tiền mất</li></ol>

      <p class="note">Số liệu khác ví dụ trong bài; định dạng hai dòng in nằm trong
      <code>de.md</code>.</p>

      '
    focus:
    - 1
    - - 2
      - 3
    pause: 150
    say: 'Đến phần bạn tự làm: viết hàm rút có điều kiện cho tài khoản bảy trăm, chạy
      ba lần rút năm trăm, năm trăm, hai trăm rồi in kết quả. Rồi mô phỏng lỗi đọc
      rồi ghi: hai bên cùng đọc bảy trăm, mỗi bên ghi bảy trăm trừ năm trăm, và in
      số dư cuối với số tiền mất, hãy dừng video và tự viết.'
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>co dieu kien: 1 0
      1 con 0</div><div>doc roi ghi: A doc 700, B doc 700, ghi 200 va 200, con 200
      (mat 500)</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh
      BNX L28 mau.py</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> hàm rút: nếu <code>tk["so_du"] &gt;=
      so</code> thì trừ rồi trả 1, ngược lại trả 0. Mô phỏng sai: đặt <code>doc_a
      = doc_b = 700</code> trước, rồi gán <code>so_du = doc_a - 500</code> và <code>so_du
      = doc_b - 500</code>. Số mất = tổng đã chi trừ số thật bị trừ.

      Lời giải đầy đủ ở <code>labs/BNX/L28/loi_giai.py</code> — chỉ mở sau khi bạn
      đã thử.</div>

      '
    say: Nếu kẹt, hàm rút kiểm số dư trước, đủ thì trừ rồi trả một, không đủ thì trả
      không. Với mô phỏng sai, đặt hai biến đọc cùng bằng bảy trăm rồi gán số dư bằng
      mỗi biến trừ năm trăm. Lời giải chỉ mở sau khi đã tự thử.
  lab: labs/BNX/L28
