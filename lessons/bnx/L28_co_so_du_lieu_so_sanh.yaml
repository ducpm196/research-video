      x="750" y="40" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">Cùng
      một tài khoản: hai bảng nối khoá ngoại, hay một bản ghi chứa luôn giao dịch</text><rect
      x="40" y="80" width="680" height="330" rx="12" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="380.0" y="116" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">hệ quan hệ (PostgreSQL, MySQL, Oracle, SQL
