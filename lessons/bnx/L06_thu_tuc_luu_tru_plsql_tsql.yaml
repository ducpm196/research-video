- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tính lại bằng Python thuần'
  checks:
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 200000)[1] == {1: 100000,
    2: 1200000}'
  steps:
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>so_du
      = {1: 300000, 2: 1000000}</code></td><td>từ điển: bảng tra từ mã tài khoản sang
      số dư; <code>so_du[tu] -= tien</code> trừ bớt <code>tien</code> ở mục <code>tu</code></td></tr><tr><td><code>def
      chuyen(tu, den, tien): … return "OK"</code></td><td>định nghĩa hàm nhận ba đầu
      vào; <code>return</code> trả kết quả ra</td></tr><tr><td><code>sum(so_du.values())</code></td><td><code>.values()</code>
      lấy các giá trị của từ điển, <code>sum</code> cộng chúng lại</td></tr></table>'
    clear: true
    say: Mã Python sắp tới có vài cách viết mới, nên ta giải nghĩa trước. Từ điển
      là bảng tra từ mã tài khoản sang số dư, hàm nhận ba đầu vào rồi trả kết quả
      ra, và hàm cuối cộng mọi giá trị của từ điển.
  - show: '<p><b>Mô hình Python thuần: cùng thủ tục, không có cơ sở dữ liệu</b></p><div
      class="code"><div>so_du = {1: 300000, 2: 1000000}</div><div> </div><div> </div><div>def
      chuyen(tu, den, tien):</div><div>    if tien &lt;= 0 or so_du[tu] &lt; tien:</div><div>        return
      "loi"</div><div>    so_du[tu] -= tien</div><div>    so_du[den] += tien</div><div>    return
      "OK"</div><div> </div><div> </div><div>for tien in (500000, 200000):</div><div>    kq
      = chuyen(1, 2, tien)</div><div>    print(tien, kq, so_du, sum(so_du.values()))</div></div>'
    clear: true
    say: 'Ta kiểm bằng đường khác, vì muốn chắc kết quả không phụ thuộc Oracle: viết
      lại thủ tục bằng Python thuần, rồi chạy hai lần chuyển như trên.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>500000 loi {1: 300000,
