- id: formula
  kind: formula
  title: 'Suy ra từng bước: dựng thủ tục chuyển tiền trên Oracle'
  checks:
  - alg.bnx_l06_lock_order(2, 1) == (1, 2)
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 500000) == (False, {1: 300000,
    2: 1000000})'
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 200000) == (True, {1: 100000,
    2: 1200000})'
  steps:
  - show: '<p><b>Bước 1. Tham số, rồi chặn số tiền không dương.</b> Người gọi đưa
      vào: từ tài khoản nào, tới tài khoản nào, bao nhiêu tiền. Thủ tục trả ra một
      chữ trạng thái.</p><div class="code"><div>CREATE OR REPLACE PROCEDURE bnx_l06_chuyen_tien
      (</div><div>  p_from   IN  NUMBER,</div><div>  p_to     IN  NUMBER,</div><div>  p_amt    IN  NUMBER,</div><div>  p_status
      OUT VARCHAR2) AS</div><div>  v_x   NUMBER;</div><div>  v_bal NUMBER;</div><div>BEGIN</div><div>  IF
      p_amt IS NULL OR p_amt &lt;= 0 THEN</div><div>    RAISE_APPLICATION_ERROR(-20002,
      ''So tien phai lon hon 0'');</div><div>  END IF;</div></div><p class=''note''>Làm
      thử: chuyển 200 000 từ 1 sang 2 thì p_from = 1, p_to = 2, p_amt = 200 000; gọi
      với −100 000 thì báo lỗi −20002.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Bước một là tham số. Vì người gọi phải nói chuyển từ đâu, tới đâu và bao
      nhiêu, nên thủ tục có ba tham số vào, và một tham số ra để trả chữ trạng thái.
      Hai biến bên dưới dùng để chứa số dư đọc được. Vì số tiền âm sẽ kéo tiền ngược
      từ người nhận về, nên việc đầu tiên là chặn số tiền không lớn hơn không. Làm
      thử, chuyển hai trăm nghìn từ tài khoản một sang tài khoản hai thì ba tham số
      vào là một, hai và hai trăm nghìn, còn gọi với âm một trăm nghìn thì bị báo
      lỗi.
  - show: '<p><b>Bước 2. Khoá hai tài khoản theo mã tăng dần</b>, dù tiền đi chiều
      nào.</p><div class="code"><div>  SELECT so_du INTO v_x FROM bnx_l06_tk</div><div>   WHERE
      id = LEAST(p_from, p_to) FOR UPDATE;</div><div>  SELECT so_du INTO v_x FROM
      bnx_l06_tk</div><div>   WHERE id = GREATEST(p_from, p_to) FOR UPDATE;</div></div><p
      class=''note''>Làm thử: chuyển từ 2 sang 1 thì vẫn khoá LEAST(2, 1) = 1 trước,
      rồi GREATEST(2, 1) = 2.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, khoá hai tài khoản. Vì hai lệnh khoá ngược thứ tự sẽ bế tắc, nên
      ta luôn khoá tài khoản có mã nhỏ trước, mã lớn sau, dù tiền đi chiều nào. Mỗi
      câu đọc kèm khoá để cập nhật, nên hàng bị giữ tới khi chốt hoặc hoàn tác. Làm
      thử, chuyển từ hai sang một thì vẫn khoá mã một trước, rồi mới tới mã hai.
  - show: '<p><b>Bước 3. Kiểm số dư, thiếu thì báo lỗi</b> trước khi ghi bất cứ gì.</p><div
      class="code"><div>  SELECT so_du INTO v_bal FROM bnx_l06_tk WHERE id = p_from;</div><div>  IF
      v_bal &lt; p_amt THEN</div><div>    RAISE_APPLICATION_ERROR(-20001, ''So du
      khong du'');</div><div>  END IF;</div></div><p class=''note''>Làm thử: 300 000
      &lt; 500 000 nên báo lỗi −20001.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, kiểm số dư. Vì hai tài khoản đã bị khoá, số dư đọc lúc này không
      ai đổi được nữa, nên kiểm ở đây là chắc chắn. Thiếu tiền thì gọi lệnh báo lỗi
      riêng với mã âm hai mươi nghìn lẻ một. Làm thử, ba trăm nghìn nhỏ hơn năm trăm
      nghìn, nên thủ tục báo lỗi.
  - show: '<p><b>Bước 4. Trừ, cộng, chốt</b>, rồi mới ghi trạng thái.</p><div class="code"><div>  UPDATE
      bnx_l06_tk SET so_du = so_du - p_amt WHERE id = p_from;</div><div>  UPDATE bnx_l06_tk
      SET so_du = so_du + p_amt WHERE id = p_to;</div><div>  COMMIT;</div><div>  p_status
      := ''OK'';</div></div><p class=''note''>Làm thử: 300 000 − 200 000 = 100 000;
      1 000 000 + 200 000 = 1 200 000.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn, trừ tài khoản gửi, cộng tài khoản nhận, rồi chốt. Vì hai câu cập
      nhật nằm trong cùng một giao dịch, nên chúng cùng được ghi hoặc cùng bị huỷ.
      Làm thử với hai trăm nghìn, A còn một trăm nghìn, B lên một triệu hai trăm nghìn,
      và tham số ra nhận chữ báo thành công.
  - show: '<p><b>Bước 5. Bắt lỗi: hoàn tác, rồi báo lên.</b></p><div class="code"><div>EXCEPTION</div><div>  WHEN
      OTHERS THEN</div><div>    ROLLBACK;</div><div>    RAISE;</div><div>END;</div><div>/</div></div><p
      class=''note''>Làm thử: lỗi ở bước 3, hoàn tác, người gọi nhận lỗi −20001, tổng
      vẫn 1 300 000.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Bước năm là phần bắt lỗi. Vì bất cứ câu nào phía trên cũng có thể lỗi, nên
      phần này hoàn tác mọi thứ giao dịch đã làm, và nhả luôn hai khoá. Rồi lệnh ném
      tiếp đẩy lỗi lên người gọi, để ứng dụng biết lệnh chuyển thất bại. Làm thử,
      lỗi ở bước ba được hoàn tác, người gọi nhận lỗi, tổng vẫn một triệu ba trăm
      nghìn. Lưu ý, lệnh chốt và hoàn tác trong thủ tục tác động lên cả giao dịch
      của người gọi, nên dòng người gọi ghi trước đó mà chưa chốt cũng bị chốt hoặc
      bị huỷ theo. Dấu gạch chéo ở cuối báo cho công cụ dòng lệnh chạy lệnh tạo thủ
      tục phía trên.
  - show: '<p><b>Bước 6. Gọi từ Java qua JDBC</b>: chuỗi <code>{call …}</code>, mỗi
      dấu <code>?</code> là một tham số; tham số ra phải đăng ký kiểu trước khi chạy.</p><div
      class="code"><div>try (Connection c = DriverManager.getConnection(url, user,
      pass);</div><div>     CallableStatement cs = c.prepareCall(</div><div>         "{call
      bnx_l06_chuyen_tien(?, ?, ?, ?)}")) {</div><div>  cs.setLong(1, 1);</div><div>  cs.setLong(2,
      2);</div><div>  cs.setLong(3, 200000);</div><div>  cs.registerOutParameter(4,
      Types.VARCHAR);</div><div>  cs.execute();</div><div>  System.out.println("trang
      thai: " + cs.getString(4));</div><div>} catch (SQLException e) {</div><div>  System.out.println(e.getErrorCode()
      + " " + e.getMessage());</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Bước sáu, chương trình Java gọi thủ tục qua thư viện kết nối cơ sở dữ liệu
      chuẩn của Java. Chuỗi trong ngoặc nhọn là cú pháp gọi thủ tục, mỗi dấu chấm
      hỏi là một tham số, đánh số từ một. Dòng đầu mở kết nối bằng địa chỉ cơ sở dữ
      liệu, tên và mật khẩu, và kết nối tự đóng khi khối thử kết thúc. Ba tham số
      vào được gán bằng số. Vì tham số thứ tư là tham số ra, nên phải đăng ký kiểu
      chữ cho nó trước khi chạy, rồi mới đọc giá trị sau khi chạy. Nếu thủ tục ném
      lỗi, Java nhận một ngoại lệ mang mã lỗi hai mươi nghìn lẻ một, đúng số sau chữ
      O R A, không có dấu âm, nên ứng dụng biết lệnh chuyển thất bại.
- id: example
  kind: example
  title: Ví dụ chạy thật trên Oracle, từng phép tính
  checks:
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 500000)[0] is False'
  - 'alg.bnx_l06_total(alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 500000)[1])
    == 1300000'
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 200000)[1][1] == 100000'
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 200000)[1][2] == 1200000'
  - 'alg.bnx_l06_total(alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 200000)[1])
    == 1300000'
  steps:
  - show: <p>Tạo bảng hai tài khoản; ràng buộc <code>CHECK</code> cấm số dư âm.</p><div
      class="code"><div>DROP TABLE IF EXISTS bnx_l06_tk;</div><div>CREATE TABLE bnx_l06_tk
      (</div><div>  id    NUMBER PRIMARY KEY,</div><div>  ten   VARCHAR2(10),</div><div>  so_du
      NUMBER CONSTRAINT bnx_l06_ck CHECK (so_du &gt;= 0));</div><div>INSERT INTO bnx_l06_tk
      VALUES (1, 'A', 300000);</div><div>INSERT INTO bnx_l06_tk VALUES (2, 'B', 1000000);</div><div>COMMIT;</div></div>
    focus:
    - 1
    - 1
    - 2
    say: Ta chạy thật trên Oracle. Khối này tạo bảng hai tài khoản, A có ba trăm nghìn,
      B có một triệu. Ràng buộc kiểm tra cấm số dư âm, nên dù thủ tục có quên kiểm
      số dư, cơ sở dữ liệu vẫn chặn được.
  - show: <p>Gọi thủ tục chuyển $500\,000$ từ A sang B, rồi cộng tổng số dư.</p><div
      class="code"><div>DECLARE</div><div>  v_st VARCHAR2(20);</div><div>BEGIN</div><div>  bnx_l06_chuyen_tien(1,
      2, 500000, v_st);</div><div>END;</div><div>/</div><div>SELECT SUM(so_du) AS
      tong FROM bnx_l06_tk;</div></div>
    clear: true
    say: Khối này gọi thủ tục chuyển năm trăm nghìn từ tài khoản một sang tài khoản
      hai, rồi cộng tổng số dư hai tài khoản để xem tiền có lệch không.
  - show: '$$① \; 300\,000 < 500\,000 \;\Rightarrow\; \hl{\text{báo lỗi −20001}}$$<p><b>Kết
      quả chạy thật</b></p><div class="code"><div>ORA-20001: So du khong du</div><div>ORA-06512:
      at "BNX.BNX_L06_CHUYEN_TIEN", line 27</div><div>ORA-06512: at "BNX.BNX_L06_CHUYEN_TIEN",
      line 18</div><div>…</div><div>      TONG</div><div>----------</div><div>   1300000</div></div>'
    focus:
    - 1
    - 2
    introduces:
    - implies
    clear: true
    say: Phép tính thứ nhất, ba trăm nghìn nhỏ hơn năm trăm nghìn, nên thủ tục báo
      lỗi mã âm hai mươi nghìn lẻ một. Trong đầu ra thật, dòng hai mươi bảy là lệnh
      ném tiếp, còn dòng mười tám là nơi lỗi được ném ra.
  - show: '$$② \; 300\,000 + 1\,000\,000 = \hlg{1\,300\,000}$$

      <p>Phần bắt lỗi đã hoàn tác: hai số dư không đổi, tổng in ra đúng $1\,300\,000$.</p>

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ hai, vì phần bắt lỗi đã hoàn tác, hai số dư không đổi. Ba trăm
      nghìn cộng một triệu vẫn là một triệu ba trăm nghìn, khớp với tổng máy in ra.
  - show: '<p>Gọi lại với $200\,000$:</p><div class="code"><div>DECLARE</div><div>  v_st
      VARCHAR2(20);</div><div>BEGIN</div><div>  bnx_l06_chuyen_tien(1, 2, 200000,
      v_st);</div><div>  DBMS_OUTPUT.PUT_LINE(''trang thai: '' || v_st);</div><div>END;</div><div>/</div><div>SELECT
      ten, so_du FROM bnx_l06_tk ORDER BY id;</div><div>SELECT SUM(so_du) AS tong
      FROM bnx_l06_tk;</div></div>$$③ \; 300\,000 - 200\,000 = \hl{100\,000}\ \text{(A)}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Bây giờ gọi lại với hai trăm nghìn, rồi in số dư từng tài khoản. Phép tính
      thứ ba, A còn ba trăm nghìn trừ hai trăm nghìn, bằng một trăm nghìn.
  - show: "$$④ \\; 1\\,000\\,000 + 200\\,000 = \\hl{1\\,200\\,000}\\ \\text{(B)}$$\n\
      $$⑤ \\; 100\\,000 + 1\\,200\\,000 = \\hlg{1\\,300\\,000}$$<p><b>Kết quả chạy\
      \ thật</b></p><div class=\"code\"><div>trang thai: OK</div><div>TEN\t\tSO_DU</div><div>----------\
      \ ----------</div><div>A\t       100000</div><div>B\t      1200000</div><div>\
      \      TONG</div><div>----------</div><div>   1300000</div></div>\n"
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép tính thứ tư, B có một triệu cộng hai trăm nghìn, bằng một triệu hai
      trăm nghìn. Phép tính thứ năm dùng lại hai kết quả trên, một trăm nghìn cộng
      một triệu hai trăm nghìn bằng một triệu ba trăm nghìn. Đầu ra thật in trạng
      thái thành công, A một trăm nghìn, B một triệu hai trăm nghìn, tổng không đổi.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: cùng thủ tục viết lại trên SQL Server'
  checks:
  - 'alg.bnx_l06_total(alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 500000)[1])
    == 1300000'
  - 'alg.bnx_l06_transfer({1: 300000, 2: 1000000}, 1, 2, 200000) == (True, {1: 100000,
    2: 1200000})'
  steps:
  - show: '<p>Đường khác: viết lại thủ tục bằng T-SQL, chạy trên một hệ khác hẳn,
      xem có ra cùng tổng không. Phần đầu (<code>SET NOCOUNT ON</code>: tắt dòng báo
      số hàng bị ảnh hưởng):</p><div class="code"><div>CREATE OR ALTER PROCEDURE dbo.chuyen_tien</div><div>  @from   INT,</div><div>  @to     INT,</div><div>  @amt    BIGINT,</div><div>  @status
      VARCHAR(20) OUTPUT</div><div>AS</div><div>BEGIN</div><div>  SET NOCOUNT ON;</div><div>  SET
      XACT_ABORT ON;</div><div>  DECLARE @x BIGINT, @bal BIGINT;</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Kiểm bằng đường khác. Ta viết lại thủ tục bằng ngôn ngữ thủ tục của máy chủ
      SQL và chạy trên hệ đó, một hệ khác hẳn, xem có ra cùng kết quả không. Phần
      đầu khai bốn tham số, tham số cuối là tham số ra, rồi tắt dòng thông báo số
      hàng bị ảnh hưởng. Vì muốn lỗi nào cũng hoàn tác cả giao dịch, nên ta bật tuỳ
      chọn huỷ cả giao dịch khi lỗi, ngay từ đầu thủ tục.
  - show: '<p>Khối thử: chặn số tiền không dương, mở giao dịch, khoá theo mã tăng
      dần, kiểm số dư.</p><div class="code"><div>  BEGIN TRY</div><div>    IF @amt
      IS NULL OR @amt &lt;= 0</div><div>      THROW 50002, ''So tien phai lon hon
      0'', 1;</div><div>    BEGIN TRAN;</div><div>    SELECT @x = so_du FROM dbo.tk
      WITH (UPDLOCK, ROWLOCK)</div><div>     WHERE id = LEAST(@from, @to);</div><div>    SELECT
      @x = so_du FROM dbo.tk WITH (UPDLOCK, ROWLOCK)</div><div>     WHERE id = GREATEST(@from,
      @to);</div><div>    SELECT @bal = so_du FROM dbo.tk WHERE id = @from;</div><div>    IF
      @bal &lt; @amt</div><div>      THROW 50001, ''So du khong du'', 1;</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Khối thử chặn số tiền không dương bằng lỗi năm mươi nghìn lẻ hai, mở giao
      dịch, rồi khoá hai tài khoản theo mã tăng dần bằng gợi ý khoá để cập nhật. Hai
      hàm số nhỏ hơn và số lớn hơn có từ bản hai nghìn không trăm hai mươi hai. Thiếu
      tiền thì lệnh ném tạo lỗi mã năm mươi nghìn lẻ một.
  - show: <p>Ghi, chốt; khối bắt lỗi hoàn tác nếu còn giao dịch mở, rồi ném lại lỗi.</p><div
      class="code"><div>    UPDATE dbo.tk SET so_du = so_du - @amt WHERE id = @from;</div><div>    UPDATE
      dbo.tk SET so_du = so_du + @amt WHERE id = @to;</div><div>    COMMIT;</div><div>    SET
      @status = 'OK';</div><div>  END TRY</div><div>  BEGIN CATCH</div><div>    IF
      @@TRANCOUNT &gt; 0 ROLLBACK;</div><div>    THROW;</div><div>  END CATCH</div><div>END;</div><div>GO</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phần cuối trừ, cộng, chốt rồi ghi trạng thái. Vì lỗi có thể xảy ra trước
      hay sau khi mở giao dịch, nên khối bắt lỗi kiểm biến đếm giao dịch, còn giao
      dịch mở thì hoàn tác, rồi ném lại đúng lỗi vừa bắt. Dòng chữ GO ở cuối báo cho
      công cụ dòng lệnh gửi các dòng phía trên đi chạy thành một lô.
  - show: <div class="code"><div>DECLARE @st VARCHAR(20);</div><div>EXEC dbo.chuyen_tien
      1, 2, 500000, @st OUTPUT;</div><div>GO</div><div>SELECT SUM(so_du) AS tong FROM
      dbo.tk;</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>Msg
      50001, Level 16, State 1, …</div><div>So du khong du</div><div>1300000</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật lệnh chuyển năm trăm nghìn như trên Oracle. Thủ tục báo lỗi năm
      mươi nghìn lẻ một, khối bắt lỗi đã hoàn tác, nên tổng vẫn một triệu ba trăm
      nghìn.
  - show: <div class="code"><div>DECLARE @st VARCHAR(20);</div><div>EXEC dbo.chuyen_tien
      1, 2, 200000, @st OUTPUT;</div><div>SELECT @st AS trang_thai;</div><div>SELECT
      ten, so_du FROM dbo.tk;</div><div>SELECT SUM(so_du) AS tong FROM dbo.tk;</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>OK</div><div>A 100000</div><div>B
      1200000</div><div>1300000</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Chuyển hai trăm nghìn thì trạng thái thành công, A một trăm nghìn, B một
      triệu hai trăm nghìn, tổng vẫn một triệu ba trăm nghìn. Vì hai hệ khác nhau,
      hai cách viết khác nhau mà cho cùng các con số, nên ta tin kết quả hơn.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 'alg.bnx_l06_total(alg.bnx_l06_swallow({1: 300000, 2: 1000000}, [(2, 500000),
    (1, -500000)], ''none'')) == 1300000'
  - 'alg.bnx_l06_total(alg.bnx_l06_swallow({1: 300000, 2: 1000000}, [(2, 500000),
    (1, -500000)], ''null'')) == 1800000'
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 300000, 2: 1000000}, [(2, 500000), (1,
    -500000)], False)) == 1800000'
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 300000, 2: 1000000}, [(2, 500000), (1,
    -500000)], True)) == 1300000'
  - alg.bnx_l06_inject_rows("X' OR '1'='1", False) == 2
  - alg.bnx_l06_inject_rows("X' OR '1'='1", True) == 0
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người đã đi làm): bắt lỗi rồi nuốt lỗi.</b>
      Trước hết xem khối <b>không</b> bắt lỗi: cộng B trước, trừ A sau.</div><div
      class="code"><div>BEGIN</div><div>  UPDATE bnx_l06_tk SET so_du = so_du + 500000
      WHERE id = 2;</div><div>  UPDATE bnx_l06_tk SET so_du = so_du - 500000 WHERE
      id = 1;</div><div>  COMMIT;</div><div>END;</div><div>/</div><div>COMMIT;</div><div>SELECT
      SUM(so_du) AS tong FROM bnx_l06_tk;</div></div>'
    focus:
    - 1
    - 2
    say: Lỗi thứ nhất, của người đã đi làm, là bắt lỗi rồi nuốt lỗi. Trước hết xem
      khối này không có phần bắt lỗi, nó cộng B trước, rồi trừ A năm trăm nghìn.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>ORA-02290: check
      constraint (BNX.BNX_L06_CK) violated</div><div>      TONG</div><div>----------</div><div>   1300000</div></div><p
      class=''note''>Câu trừ A vi phạm ràng buộc; lỗi về tới người gọi, Oracle hoàn
      tác mọi thay đổi của lời gọi đó.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Câu trừ A vi phạm ràng buộc số dư không âm. Lỗi đi thẳng về người gọi, và
      Oracle hoàn tác mọi thay đổi của chính lời gọi đó, nên tổng vẫn một triệu ba
      trăm nghìn. Lưu ý, đây là hoàn tác cấp câu lệnh của lời gọi từ ứng dụng. Bản
      thân khối mã không tự hoàn tác, nên nếu có ai bắt lỗi ở giữa thì thay đổi còn
      nguyên.
  - show: <div class="code"><div>BEGIN</div><div>  UPDATE bnx_l06_tk SET so_du = so_du
      + 500000 WHERE id = 2;</div><div>  UPDATE bnx_l06_tk SET so_du = so_du - 500000
      WHERE id = 1;</div><div>  COMMIT;</div><div>EXCEPTION</div><div>  WHEN OTHERS
      THEN NULL;</div><div>END;</div><div>/</div><div>COMMIT;</div><div>SELECT SUM(so_du)
      AS tong FROM bnx_l06_tk;</div></div>
    clear: true
    say: Giờ chỉ thêm một phần bắt mọi lỗi mà không làm gì cả. Các câu còn lại giữ
      nguyên.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>      TONG</div><div>----------</div><div>   1800000</div></div><p
      class=''note''><code>WHEN OTHERS THEN NULL</code>: không báo lỗi nào, câu cộng
      B còn lại và được chốt. Cách chữa: hoàn tác rồi <code>RAISE</code> như bước
      5.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi bị nuốt, nên khối chạy xong như thành công, câu cộng cho B còn lại và
      được chốt. Kết quả là tổng một triệu tám trăm nghìn mà không có thông báo nào.
      Cách chữa là hoàn tác rồi ném tiếp lỗi, đúng như bước năm.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm): tin rằng SQL Server tự
      hoàn tác.</b> Mặc định <code>XACT_ABORT OFF</code>.</div><div class="code"><div>SET
      XACT_ABORT OFF;</div><div>BEGIN TRAN;</div><div>UPDATE dbo.tk SET so_du = so_du
      + 500000 WHERE id = 2;</div><div>UPDATE dbo.tk SET so_du = so_du - 500000 WHERE
      id = 1;</div><div>GO</div><div>IF @@TRANCOUNT &gt; 0 COMMIT;</div><div>SELECT
      SUM(so_du) AS tong FROM dbo.tk;</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Lỗi thứ hai, cũng của người đã đi làm, là tin rằng máy chủ SQL tự hoàn tác
      cả giao dịch. Khối này để tuỳ chọn huỷ giao dịch khi lỗi ở mức tắt, đúng như
      mặc định. Nó cộng B, trừ A, rồi chốt nếu còn giao dịch đang mở. Dòng chữ GO
      chia khối thành hai lô, nên lệnh chốt nằm ở lô sau.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>Msg 547, Level 16,
      State 1, …</div><div>The UPDATE statement conflicted with the CHECK constraint
      …</div><div>The statement has been terminated.</div><div>1800000</div></div><p
      class='note'>Chỉ câu trừ A bị huỷ; giao dịch vẫn mở nên lệnh chốt chạy, phần
      cộng B ở lại.</p>
    focus:
    - 1
    - 2
    clear: true
    say: Câu trừ A lỗi chỉ bị huỷ riêng, máy in là câu lệnh đã bị dừng. Vì giao dịch
      vẫn mở, lệnh chốt được chạy, và tổng thành một triệu tám trăm nghìn.
  - show: <div class="code"><div>SET XACT_ABORT ON;</div><div>BEGIN TRAN;</div><div>UPDATE
      dbo.tk SET so_du = so_du + 500000 WHERE id = 2;</div><div>UPDATE dbo.tk SET
      so_du = so_du - 500000 WHERE id = 1;</div><div>GO</div><div>IF @@TRANCOUNT &gt;
      0 COMMIT;</div><div>SELECT SUM(so_du) AS tong FROM dbo.tk;</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>Msg 547, Level 16, State 1, …</div><div>The
      UPDATE statement conflicted with the CHECK constraint …</div><div>1300000</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Chỉ đổi một dòng, bật tuỳ chọn huỷ cả giao dịch khi lỗi. Lần này câu lỗi
      hoàn tác luôn phần cộng cho B và bỏ phần còn lại của lô, nên không còn giao
      dịch nào để chốt, tổng giữ một triệu ba trăm nghìn. Trong thủ tục thật, ta dùng
      cả tuỳ chọn này lẫn khối thử và bắt lỗi.
  - show: '<div class="box warn"><b>Lỗi 3: ghép chuỗi người dùng gõ vào câu lệnh động.</b>
      Người dùng gõ <code>X'' OR ''1''=''1</code>.</div><div class="code"><div>DECLARE
      @ten VARCHAR(50) = ''X'''' OR ''''1''''=''''1'';</div><div>DECLARE @sql NVARCHAR(200)
      =</div><div>  N''SELECT ten, so_du FROM dbo.tk WHERE ten = '''''' + @ten + N'''''''';</div><div>EXEC
      (@sql);</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>A 300000</div><div>B
      1000000</div><div>(2 rows affected)</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba là ghép chuỗi người dùng gõ vào một câu lệnh động, tức câu lệnh
      được ghép thành chuỗi lúc chạy rồi mới đưa máy thực thi. Người dùng gõ chữ X,
      một dấu nháy, rồi thêm điều kiện một bằng một luôn đúng. Sau khi ghép, điều
      kiện tìm theo tên luôn đúng, nên máy trả về cả hai tài khoản. Thủ tục lưu trữ
      không tự chống được kiểu chèn mã này.
  - show: '<div class="code"><div>DECLARE @ten VARCHAR(50) = ''X'''' OR ''''1''''=''''1'';</div><div>EXEC
      sp_executesql</div><div>  N''SELECT ten, so_du FROM dbo.tk WHERE ten = @p'',</div><div>  N''@p
      VARCHAR(50)'', @p = @ten;</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>(0
      rows affected)</div></div><p class=''note''>Truyền chuỗi làm <b>tham số</b>
      qua <code>sp_executesql</code>: cả chuỗi chỉ là một cái tên. Oracle: biến gắn,
      <code>EXECUTE IMMEDIATE … USING</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Cách chữa là truyền chuỗi đó làm tham số, qua thủ tục hệ thống chạy câu lệnh
      động có tham số. Cả chuỗi chỉ được coi là một cái tên, không ai tên như vậy,
      nên không có dòng nào. Trên Oracle cũng vậy, câu lệnh động nhận giá trị qua
      biến gắn, tức một chỗ giữ chỗ có tên mà giá trị được truyền riêng, không ghép
      chuỗi.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 'alg.bnx_l06_transfer({1: 800000, 2: 200000}, 1, 2, 900000) == (False, {1: 800000,
    2: 200000})'
  - 'alg.bnx_l06_total({1: 800000, 2: 200000}) == 1000000'
  - alg.bnx_l06_lock_order(1, 2) == alg.bnx_l06_lock_order(2, 1) == (1, 2)
  - 'alg.bnx_l06_transfer(alg.bnx_l06_transfer({1: 800000, 2: 200000}, 1, 2, 100000)[1],
    2, 1, 50000)[1] == {1: 750000, 2: 250000}'
  - 'alg.bnx_l06_transfer(alg.bnx_l06_transfer({1: 800000, 2: 200000}, 2, 1, 50000)[1],
    1, 2, 100000)[1] == {1: 750000, 2: 250000}'
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>A
      = 800 000, B = 200 000. Gọi thủ tục chuyển 900 000 từ A sang B. Người gọi nhận
      gì, A còn bao nhiêu, tổng bao nhiêu?</td></tr><tr><td>2</td><td>Cùng lúc: lệnh
      P chuyển 100 000 từ A (mã 1) sang B (mã 2), lệnh Q chuyển 50 000 từ B sang A.
      Mỗi lệnh khoá mã nào trước? Số dư cuối?</td></tr><tr><td>3</td><td>Quyết định:
      đặt logic chuyển tiền trong thủ tục lưu trữ, hay trong dịch vụ Java (mã Java
      mở giao dịch, gửi từng câu lệnh)?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, A có tám trăm nghìn, B có hai trăm
      nghìn, gọi thủ tục chuyển chín trăm nghìn từ A sang B. Người gọi nhận gì, A
      còn bao nhiêu, tổng bao nhiêu? Câu hai, cùng lúc lệnh P chuyển một trăm nghìn
      từ A sang B, lệnh Q chuyển năm mươi nghìn từ B sang A. Mỗi lệnh khoá mã nào
      trước, và số dư cuối là bao nhiêu? Câu ba là một quyết định. Đặt logic chuyển
      tiền trong thủ tục lưu trữ, hay trong dịch vụ Java? Hãy dừng video và làm ra
      giấy.
  - show: '<p>Câu 1: $800\,000 < 900\,000$ nên thủ tục báo lỗi −20001 và hoàn tác.</p>

      $$800\,000 + 200\,000 = \hlg{1\,000\,000}\ \text{(A vẫn 800 000)}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu một. Tám trăm nghìn nhỏ hơn chín trăm nghìn, nên người gọi nhận
      lỗi âm hai mươi nghìn lẻ một, và giao dịch được hoàn tác. A vẫn tám trăm nghìn,
      tổng vẫn tám trăm nghìn cộng hai trăm nghìn, bằng một triệu.
    clear: true
  - show: '<p>Câu 2: cả P và Q đều khoá mã 1 rồi mã 2, nên lệnh sau chờ lệnh trước,
      không bế tắc.</p>

      $$A = 800\,000 - 100\,000 + 50\,000 = \hl{750\,000}$$

      $$B = 200\,000 + 100\,000 - 50\,000 = \hl{250\,000}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Đáp án câu hai. Cả hai lệnh đều khoá mã một trước rồi mới tới mã hai, nên
      lệnh đến sau chỉ chờ lệnh đến trước, không có bế tắc. A bằng tám trăm nghìn
      trừ một trăm nghìn cộng năm mươi nghìn, là bảy trăm năm mươi nghìn. B bằng hai
      trăm nghìn cộng một trăm nghìn trừ năm mươi nghìn, là hai trăm năm mươi nghìn,
      và tổng vẫn một triệu.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>thủ
      tục lưu trữ</td><td>một lần gọi qua mạng; khoá giữ ngắn vì mọi câu chạy ngay
      trong cơ sở dữ liệu</td><td>mỗi hệ một ngôn ngữ (bài này viết hai lần); khó
      kiểm thử, khó quản lý phiên bản cùng mã ứng dụng</td></tr><tr><td>dịch vụ Java</td><td>một
      ngôn ngữ, kiểm thử và triển khai như mã thường</td><td>nhiều lượt đi về qua
      mạng trong lúc đang giữ khoá; phải cấu hình đúng việc hoàn tác khi lỗi</td></tr></table>
    say: Đáp án câu ba, không có lựa chọn đúng cho mọi nơi. Thủ tục lưu trữ chỉ cần
      một lần gọi qua mạng, và khoá được giữ ngắn vì mọi câu chạy ngay trong cơ sở
      dữ liệu. Đổi lại, mỗi hệ một ngôn ngữ, như bài này phải viết hai lần, và khó
      kiểm thử cũng như quản lý phiên bản cùng mã ứng dụng. Dịch vụ Java dùng một
      ngôn ngữ, kiểm thử như mã thường, nhưng mỗi câu lệnh là một lượt đi về qua mạng
      trong lúc giữ khoá, và phải cấu hình đúng việc hoàn tác khi lỗi.
