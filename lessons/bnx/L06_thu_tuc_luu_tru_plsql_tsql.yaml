  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>tham số vào, ra</span><span class='a'>→</span><span
      class='n'>khoá theo mã tăng dần</span><span class='a'>→</span><span class='n'>kiểm
      rồi mới ghi</span><span class='a'>→</span><span class='n'>lỗi thì hoàn tác và
      báo lên</span><span class='a'>→</span><span class='n'>tổng giữ nguyên</span></div>
    say: Tổng kết chuỗi logic. Thủ tục nhận tham số vào và trả tham số ra. Nó khoá
      hai tài khoản theo mã tăng dần, kiểm số dư rồi mới ghi. Có lỗi thì hoàn tác
      cả giao dịch và báo lên người gọi, nhờ vậy tổng tiền luôn giữ nguyên.
  - show: <div class='box key'><b>Tư duy:</b> đừng tin “lỗi thì tự hoàn tác”. Hãy
      chạy thử một lỗi ở <b>giữa</b> giao dịch và đo tổng tiền trước và sau, trên
      đúng hệ bạn dùng.</div>
    say: Điều cần mang theo. Đừng tin rằng có lỗi thì hệ thống tự hoàn tác. Hãy chạy
      thử một lỗi ở giữa giao dịch và đo tổng tiền trước và sau, trên đúng hệ bạn
      dùng.
  - show: '<p class="note">Bài sau: Oracle cho khối lượng lớn, chia bảng giao dịch
      theo tháng, lưu dữ liệu JSON, hàng đợi ngay trong cơ sở dữ liệu.</p>'
    forward_ref: true
    say: Ở bài sau, ta xem Oracle xử lý bảng giao dịch rất lớn ra sao, chia bảng theo
