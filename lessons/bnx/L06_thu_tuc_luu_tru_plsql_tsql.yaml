- id: practice
  kind: practice
  title: 'Tự làm: chuyển tiền có hoàn tác (sqlite)'
  steps:
  - show: '<p><b>Đề</b>: sqlite có bảng <code>tk</code> (3 tài khoản 500, 400, 300;
      <code>CHECK (so_du &gt;= 0)</code>). Viết <code>mau.py</code> có <code>chuyen(a,
      b, tien)</code>:</p>

      <ol><li>trong một giao dịch: <b>cộng B trước, rồi trừ A</b></li><li>vi phạm
      <code>CHECK</code> (<code>sqlite3.IntegrityError</code>) thì <code>ROLLBACK</code>,
      trả <code>loi so du khong du</code>; không thì <code>COMMIT</code>, trả <code>OK</code></li></ol>

      <p>Chạy bốn lệnh, in mỗi lệnh một dòng, rồi in tổng tiền. <code>isolation_level=None</code>
      nghĩa là Python không tự mở giao dịch, ta tự gõ <code>BEGIN</code>. Dữ liệu
      và khuôn dòng in nằm trong <code>de.md</code>.</p>

      <p class="note">Trong câu SQL, <code>?</code> là chỗ điền giá trị; <code>try
      … except</code> thử làm, lỗi ràng buộc thì chạy phần <code>except</code>. Phần
      Oracle của bài (thủ tục, ORA-20001, bế tắc) bộ chấm không có; muốn tự chạy,
      xem lệnh Docker ở cuối phần này.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 4
