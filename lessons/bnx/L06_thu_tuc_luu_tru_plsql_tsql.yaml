    alg.bnx_l06_statements(100000) // 1000 == 500
  steps:
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>sqlite3.connect(":memory:",
      isolation_level=None)</code></td><td>mở một cơ sở dữ liệu nhỏ trong bộ nhớ;
      <code>isolation_level=None</code>: Python không tự mở giao dịch, ta tự gõ <code>BEGIN</code></td></tr><tr><td><code>db.set_trace_callback(dem.append)</code></td><td>mỗi
      câu SQL gửi tới <code>db</code> thì thêm vào danh sách <code>dem</code>, để
      đếm</td></tr><tr><td><code>for _ in range(n): …</code></td><td>lặp <code>n</code>
      lần; <code>_</code> là tên biến bỏ đi, không dùng giá trị</td></tr></table>'
    clear: true
    say: Khối đo dùng vài cách viết mới, nên ta giải nghĩa trước. Tuỳ chọn cách ly
      bằng không nghĩa là Python không tự mở giao dịch. Hàm theo dõi ghi mỗi câu gửi
      đi vào một danh sách để đếm, và dấu gạch dưới là tên biến bỏ đi trong vòng lặp.
  - show: '<p><b>Mô hình giản lược: logic nằm ở ứng dụng, đếm mọi câu gửi đi (sqlite
      làm đại diện)</b></p><div class="code"><div>import sqlite3</div><div>db = sqlite3.connect(":memory:",
      isolation_level=None)</div><div>db.execute("CREATE TABLE tk (id INT, so_du INT)")</div><div>db.execute("INSERT
      INTO tk VALUES (1, 99999999), (2, 0)")</div><div>dem = []</div><div>db.set_trace_callback(dem.append)      #
      ghi mỗi câu gửi tới CSDL</div><div>def chuyen():                          #
      logic nằm ở ứng dụng</div><div>    for c in ("BEGIN", "SELECT so_du FROM tk
      WHERE id = 1",</div><div>              "UPDATE tk SET so_du = so_du - 1 WHERE
      id = 1",</div><div>              "UPDATE tk SET so_du = so_du + 1 WHERE id =
      2", "COMMIT"):</div><div>        db.execute(c)</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Đây là mô hình giản lược, không phải số đo của Oracle. Ta giả sử logic nằm
