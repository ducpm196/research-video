scenes:
- id: hook
  kind: hook
  title: Chuyển 500 000 thất bại mà ngân hàng mất 500 000
  checks:
  - 'alg.bnx_l06_total({1: 300000, 2: 1000000}) == 1300000'
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 300000, 2: 1000000}, [(2, 500000), (1,
    -500000)], False)) == 1800000'
  steps:
  - show: '<p>Tài khoản A có $300\,000$, tài khoản B có $1\,000\,000$. Khách A ra
      lệnh chuyển $500\,000$ sang B.</p>

      <p>Một thủ tục viết vội: <b>cộng B trước</b>, rồi trừ A. Trừ A lỗi vì không
      đủ tiền, nhưng phần cộng B vẫn được chốt.</p>

      <div class="box warn">Tổng tiền hai tài khoản: trước $1\,300\,000$, sau <b class="red">$1\,800\,000$</b>.
      Ngân hàng vừa tự sinh ra $500\,000$.</div>

      '
    focus:
    - 1
    - 2
    - 3
    say: Chào bạn, tài khoản A có ba trăm nghìn, B có một triệu, và khách A ra lệnh
      chuyển năm trăm nghìn sang B. Một thủ tục viết vội cộng cho B trước, rồi mới
      trừ A. Trừ A lỗi vì không đủ tiền, nhưng phần cộng cho B vẫn được chốt, nên
      tổng từ một triệu ba trăm nghìn thành một triệu tám trăm nghìn.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>viết
      thủ tục chuyển tiền thế nào</td><td>tham số vào và ra, bằng PL/SQL: ngôn ngữ
      lập trình của Oracle, chạy ngay trong cơ sở dữ liệu</td></tr><tr><td>lỗi giữa
      chừng thì sao</td><td>khối bắt lỗi: hoàn tác cả giao dịch rồi báo lỗi lên</td></tr><tr><td>hai
      lệnh chuyển ngược chiều cùng lúc</td><td>khoá hai tài khoản theo thứ tự mã tăng
      dần</td></tr><tr><td>gọi một thủ tục khác gì gửi từng câu lẻ</td><td>đếm số
      câu gửi tới cơ sở dữ liệu ở ba quy mô</td></tr></table>'
    introduces:
    - bnx_plsql
    clear: true
    say: Hôm nay ta trả lời bốn câu hỏi. Viết thủ tục chuyển tiền thế nào, bằng PL/SQL,
      ngôn ngữ lập trình riêng của Oracle chạy ngay trong cơ sở dữ liệu. Lỗi giữa
      chừng thì hoàn tác ra sao. Hai lệnh ngược chiều cùng lúc thì khoá thế nào cho
      khỏi bế tắc. Và gọi một thủ tục khác gì so với gửi từng câu lẻ.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu, rồi dựng bảng'
  checks:
  - 'alg.bnx_l06_total({1: 300000, 2: 1000000}) == 1300000'
  - alg.bnx_l06_lock_order(2, 1) == (1, 2)
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Giao dịch</td><td>nhóm câu lệnh cùng thành công (chốt) hoặc cùng huỷ (hoàn tác)</td><td>trừ
      A 200 000 và cộng B 200 000: cả hai, hoặc không gì</td></tr><tr><td>② Khoá hàng</td><td><code>SELECT
      … FOR UPDATE</code> đọc và giữ hàng tới khi chốt hoặc hoàn tác; phiên khác muốn
      sửa phải chờ</td><td>phiên 1 khoá A, phiên 2 sửa A phải đợi</td></tr><tr><td>③
      Bế tắc ORA-00060</td><td><b>phiên</b> là một lần làm việc nối vào cơ sở dữ liệu;
      bế tắc là khi hai phiên khoá ngược thứ tự rồi chờ nhau; Oracle phát hiện và
      hoàn tác một câu lệnh của một phiên</td><td>phiên 1 giữ A chờ B, phiên 2 giữ
      B chờ A</td></tr><tr><td>④ Thủ tục lưu trữ</td><td>đoạn mã có tên, cất sẵn trong
      cơ sở dữ liệu, nhận tham số; ứng dụng gọi bằng tên</td><td>chuyen_tien(1, 2,
      200000)</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Giao dịch là nhóm câu lệnh cùng thành công,
      gọi là chốt, hoặc cùng bị huỷ, gọi là hoàn tác. Khoá hàng là đọc một hàng kèm
      ý định sửa, cơ sở dữ liệu giữ hàng đó tới khi chốt hoặc hoàn tác, nên phiên
      khác phải chờ. Bế tắc, mã ORA-00060, là khi hai phiên, mỗi phiên là một lần
      làm việc nối vào cơ sở dữ liệu, khoá ngược thứ tự rồi chờ nhau mãi. Thủ tục
      lưu trữ là đoạn mã có tên, cất sẵn trong cơ sở dữ liệu, để ứng dụng chỉ cần
      gọi tên.
  - show: '<table class=''t''><tr><th>viết trong SQL</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>NUMBER</code>,
      <code>VARCHAR2(10)</code></td><td>kiểu số; kiểu chuỗi của Oracle, dài tối đa
      10 ký tự</td><td><code>so_du NUMBER</code>, <code>ten VARCHAR2(10)</code></td></tr><tr><td><code>INSERT
      INTO bảng VALUES (…)</code></td><td>thêm một dòng, các giá trị theo thứ tự cột;
      nhiều dòng thì ngăn các bộ giá trị bằng dấu phẩy</td><td><code>VALUES (1, ''A'',
      300000)</code>: mã 1, tên A, số dư 300000</td></tr></table>'
    clear: true
    say: Bảng sắp dựng dùng thêm hai cách viết. Kiểu số, và kiểu chuỗi dài tối đa
      mười ký tự, khai kiểu cho từng cột. Lệnh thêm dòng đưa các giá trị vào theo
      thứ tự cột, và nhiều dòng thì ngăn bằng dấu phẩy.
  - show: <p>Dựng bảng hai tài khoản. Chạy trên Oracle Database Free 23 (báo phiên
      bản 26ai Free 23.26.3), trong <b>Docker</b> (công cụ chạy phần mềm đóng gói
      sẵn trong một “thùng”).</p><div class="code"><div>DROP TABLE IF EXISTS bnx_l06_tk;</div><div>CREATE
      TABLE bnx_l06_tk (</div><div>  id    NUMBER PRIMARY KEY,</div><div>  ten   VARCHAR2(10),</div><div>  so_du
      NUMBER CONSTRAINT bnx_l06_ck CHECK (so_du &gt;= 0));</div><div>INSERT INTO bnx_l06_tk
      VALUES (1, 'A', 300000);</div><div>INSERT INTO bnx_l06_tk VALUES (2, 'B', 1000000);</div><div>COMMIT;</div></div>$$300\,000
      + 1\,000\,000 = \hlg{1\,300\,000}$$
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Ta dựng bảng trên Oracle chạy trong Docker, công cụ chạy phần mềm đóng gói
      sẵn. Lệnh xoá bảng nếu đã có giúp chạy lại nhiều lần. Khoá chính là cột mà mỗi
      dòng có một giá trị riêng. Ràng buộc kiểm tra cấm số dư âm, nên dù thủ tục quên
      kiểm, cơ sở dữ liệu vẫn chặn. Lệnh chốt ghi hai dòng vừa chèn lại. Tổng ba trăm
      nghìn cộng một triệu là một triệu ba trăm nghìn, phép thử cho mọi lần chạy.
- id: sym
  kind: symbol
  title: Giải mã từ khoá PL/SQL
  checks:
  - alg.bnx_l06_lock_order(2, 1) == (1, 2)
  - alg.bnx_l06_lock_order(1, 2) == (1, 2)
  steps:
  - show: '<table class=''t''><tr><th>PL/SQL (Oracle)</th><th>nghĩa</th></tr><tr><td><code>p_amt
      IN NUMBER</code></td><td>tham số vào: người gọi đưa số tiền vào</td></tr><tr><td><code>p_status
      OUT VARCHAR2</code></td><td>tham số ra: thủ tục trả chữ <code>OK</code> về cho
      người gọi</td></tr><tr><td><code>CREATE OR REPLACE PROCEDURE … AS … BEGIN …
      END;</code></td><td>đặt tên cho đoạn mã; sau <code>AS</code> khai biến; thân
      nằm giữa <code>BEGIN</code> và <code>END</code></td></tr><tr><td><code>SELECT
      … INTO v_x</code>, <code>p_status := ''OK''</code></td><td>đưa kết quả câu chọn
      vào biến; <code>:=</code> gán giá trị cho biến</td></tr><tr><td><code>LEAST(2,
      1)</code>, <code>GREATEST(2, 1)</code></td><td>số nhỏ hơn là 1, số lớn hơn là
      2</td></tr></table>'
    say: Từ khoá vào nghĩa là tham số vào, người gọi đưa số tiền vào, còn từ khoá
      ra là tham số ra, thủ tục ghi chữ báo thành công vào đó để trả về. Lệnh tạo
      thủ tục đặt tên cho đoạn mã, thân nằm giữa từ khoá mở đầu và kết thúc. Câu chọn
      kèm từ khoá đưa vào chuyển kết quả vào biến, dấu hai chấm bằng gán giá trị cho
      biến. Hai hàm cuối lấy số nhỏ hơn và số lớn hơn.
  - show: '<table class=''t''><tr><th>PL/SQL (Oracle)</th><th>nghĩa</th></tr><tr><td><code>RAISE_APPLICATION_ERROR(-20001,
      ''…'')</code></td><td>tự báo một lỗi có mã riêng, mã nằm trong khoảng −20000
      tới −20999</td></tr><tr><td><code>EXCEPTION WHEN OTHERS THEN</code></td><td>phần
      bắt lỗi: bắt mọi lỗi xảy ra phía trên</td></tr><tr><td><code>RAISE;</code></td><td>ném
      tiếp lỗi vừa bắt lên người gọi</td></tr><tr><td><code>DECLARE … BEGIN … END;</code>
      rồi <code>/</code></td><td>khối không tên để gọi thủ tục; dòng <code>/</code>
      báo công cụ dòng lệnh chạy khối vừa gõ</td></tr><tr><td><code>DBMS_OUTPUT.PUT_LINE(''…'')</code></td><td>in
      một dòng chữ ra màn hình</td></tr></table>'
    introduces:
    - bnx_raise_app_error
    - bnx_dbms_output
    clear: true
    say: Lệnh báo lỗi riêng tự tạo một lỗi có mã từ âm hai mươi nghìn tới âm hai mươi
      nghìn chín trăm chín mươi chín. Phần bắt lỗi bắt mọi lỗi phía trên nó, còn lệnh
      ném tiếp chuyển lỗi lên người gọi. Khối không tên là cách gọi thủ tục từ công
      cụ dòng lệnh, và dấu gạch chéo ở dòng riêng báo công cụ chạy khối. Hàm cuối
      in một dòng chữ.
  - show: '<table class=''t''><tr><th>viết trong PL/SQL</th><th>đọc là</th><th>ví
      dụ</th></tr><tr><td><code>IF điều kiện THEN … END IF;</code></td><td>nếu điều
      kiện đúng thì chạy phần giữa</td><td><code>IF v_bal &lt; p_amt THEN …</code></td></tr><tr><td><code>p_amt
      IS NULL</code></td><td>ô chưa có giá trị (NULL, khác 0); phải hỏi bằng <code>IS
      NULL</code>, vì <code>= NULL</code> không bao giờ cho đúng</td><td>gọi mà quên
      đưa số tiền</td></tr><tr><td><code>a OR b</code></td><td>một trong hai vế đúng
      là đủ</td><td><code>p_amt IS NULL OR p_amt &lt;= 0</code>: trống hoặc không
      dương đều bị chặn</td></tr></table>'
    clear: true
    say: 'Câu kiểm số tiền dùng ba cách viết. Nếu điều kiện đúng thì chạy phần giữa.
      Giá trị trống là ô chưa có gì, khác không, nên phải hỏi bằng từ khoá là trống
      chứ không so bằng. Từ hoặc nối hai vế: một vế đúng là đủ, nên số tiền trống
      hay không dương đều bị chặn.'
  - show: '<table class=''t''><tr><th>câu SQL</th><th>nghĩa</th></tr><tr><td><code>SELECT
      cột FROM bảng WHERE điều kiện</code></td><td>chọn cột từ bảng, chỉ những dòng
      thoả điều kiện; <code>UPDATE bảng SET cột = giá trị WHERE …</code> sửa những
      dòng đó</td></tr><tr><td><code>SUM(so_du) AS tong</code></td><td>cộng cả cột
      <code>so_du</code>; <code>AS tong</code> đặt tên <code>tong</code> cho cột kết
      quả</td></tr><tr><td><code>ORDER BY id</code></td><td>sắp xếp kết quả theo cột
      <code>id</code></td></tr><tr><td><code>''trang thai: '' || v_st</code></td><td><code>||</code>
      nối hai chuỗi lại với nhau</td></tr></table>'
    clear: true
    say: Trước các câu SQL đầu tiên, ta nhắc lại cách đọc. Câu chọn lấy cột từ bảng,
      chỉ những dòng thoả điều kiện, còn câu cập nhật sửa những dòng đó. Hàm tổng
      cộng cả cột và đặt tên cho kết quả, rồi sắp xếp theo một cột, và hai gạch đứng
      nối hai chuỗi.
- id: intuition
  kind: intuition
  title: 'Hình dung: thứ tự khoá, và số phận giao dịch khi một câu lỗi'
  checks:
  - 'alg.bnx_l06_total(alg.bnx_l06_swallow({1: 300000, 2: 1000000}, [(2, 500000),
    (1, -500000)], ''null'')) == 1800000'
  - 'alg.bnx_l06_total(alg.bnx_l06_swallow({1: 300000, 2: 1000000}, [(2, 500000),
