scenes:
- id: hook
  kind: hook
  title: Chuyển 500 000 thất bại mà ngân hàng mất 500 000
  checks:
  - 'alg.bnx_l06_total({1: 300000, 2: 1000000}) == 1300000'
  - 'alg.bnx_l06_total(alg.bnx_l06_batch({1: 300000, 2: 1000000}, [(2, 500000), (1,
    -500000)], False)) == 1800000'
  steps:
  - show: '<p>Tài khoản A có $300\,000$, tài khoản B có $1\,000\,000$. Khách A ra
      lệnh chuyển $500\,000$ sang B.</p>

      <p>Một thủ tục viết vội: <b>cộng B trước</b>, rồi trừ A. Trừ A lỗi vì không
      đủ tiền, nhưng phần cộng B vẫn được chốt.</p>

      <div class="box warn">Tổng tiền hai tài khoản: trước $1\,300\,000$, sau <b class="red">$1\,800\,000$</b>.
      Ngân hàng vừa tự sinh ra $500\,000$.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Chào bạn, tài khoản A có ba trăm nghìn, tài khoản B có một triệu, và khách
      A ra lệnh chuyển năm trăm nghìn sang B. Một thủ tục viết vội cộng tiền cho B
      trước, rồi mới trừ A. Trừ A bị lỗi vì không đủ tiền, nhưng phần cộng cho B vẫn
      được chốt. Tổng tiền hai tài khoản trước là một triệu ba trăm nghìn, sau lại
      là một triệu tám trăm nghìn, tức ngân hàng vừa tự sinh ra năm trăm nghìn.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>viết
      thủ tục chuyển tiền thế nào</td><td>tham số vào và ra, bằng PL/SQL của Oracle
      và T-SQL của SQL Server</td></tr><tr><td>lỗi giữa chừng thì sao</td><td>khối
      bắt lỗi: hoàn tác cả giao dịch rồi báo lỗi lên</td></tr><tr><td>hai lệnh chuyển
      ngược chiều cùng lúc</td><td>khoá hai tài khoản theo thứ tự mã tăng dần</td></tr><tr><td>ứng
      dụng gọi thủ tục ra sao</td><td>Java gọi qua JDBC</td></tr></table>'
    say: Hôm nay ta trả lời bốn câu hỏi. Viết thủ tục chuyển tiền có tham số vào và
      ra thế nào, bằng PL/SQL của Oracle và bằng ngôn ngữ thủ tục của máy chủ SQL.
      Lỗi giữa chừng thì làm gì, để cả giao dịch được hoàn tác. Hai lệnh chuyển ngược
      chiều chạy cùng lúc thì khoá thế nào cho khỏi bế tắc. Và chương trình Java gọi
      thủ tục ra sao, qua thư viện kết nối cơ sở dữ liệu chuẩn của Java.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 'alg.bnx_l06_total({1: 300000, 2: 1000000}) == 1300000'
  - alg.bnx_l06_lock_order(2, 1) == (1, 2)
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Giao dịch</td><td>nhóm câu lệnh cùng thành công (chốt) hoặc cùng huỷ (hoàn tác)</td><td>trừ
      A 200 000 và cộng B 200 000: cả hai, hoặc không gì</td></tr><tr><td>② Khoá hàng</td><td><code>SELECT
      … FOR UPDATE</code> đọc và giữ hàng tới khi chốt hoặc hoàn tác; phiên khác muốn
      sửa phải chờ</td><td>phiên 1 khoá A, phiên 2 sửa A phải đợi</td></tr><tr><td>③
      Bế tắc ORA-00060</td><td>hai phiên khoá ngược thứ tự rồi chờ nhau; Oracle phát
      hiện và hoàn tác một câu lệnh của một phiên</td><td>phiên 1 giữ A chờ B, phiên
      2 giữ B chờ A</td></tr><tr><td>④ Thủ tục lưu trữ</td><td>đoạn mã có tên, cất
      sẵn trong cơ sở dữ liệu, nhận tham số; ứng dụng gọi bằng tên</td><td>chuyen_tien(1,
      2, 200000)</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Giao dịch là một nhóm câu lệnh cùng thành
      công, gọi là chốt, hoặc cùng bị huỷ, gọi là hoàn tác. Khoá hàng là khi ta đọc
      một hàng kèm ý định sửa, cơ sở dữ liệu giữ hàng đó tới khi chốt hoặc hoàn tác,
      nên phiên khác muốn sửa phải chờ. Bế tắc mang mã lỗi ORA-00060 xảy ra khi hai
      phiên khoá ngược thứ tự rồi chờ nhau mãi. Oracle phát hiện và hoàn tác một câu
      lệnh của một phiên. Cuối cùng, thủ tục lưu trữ là một đoạn mã có tên, cất sẵn
      trong cơ sở dữ liệu và nhận tham số, để ứng dụng chỉ cần gọi tên nó.
  - show: '<p>Chuyển tiền giữa hai tài khoản trong cùng ngân hàng không làm tiền sinh
      ra hay mất đi, nên tổng phải giữ nguyên:</p>

      $$300\,000 + 1\,000\,000 = \hlg{1\,300\,000}$$

      <p class="note">Đây là phép thử cho mọi lần chạy trong bài: trước và sau, tổng
      phải là 1 300 000.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Một ví dụ số. Chuyển tiền giữa hai tài khoản trong cùng ngân hàng không làm
      tiền sinh ra hay mất đi, nên tổng phải giữ nguyên. Ba trăm nghìn cộng một triệu
      bằng một triệu ba trăm nghìn. Đó là phép thử ta dùng cho mọi lần chạy trong
      bài.
- id: sym
  kind: symbol
  title: Giải mã từ khoá của hai hệ
  checks:
  - alg.bnx_l06_lock_order(2, 1) == (1, 2)
  - alg.bnx_l06_lock_order(1, 2) == (1, 2)
  steps:
  - show: '<table class=''t''><tr><th>PL/SQL (Oracle)</th><th>nghĩa</th></tr><tr><td><code>p_amt
      IN NUMBER</code></td><td>tham số vào: người gọi đưa số tiền vào</td></tr><tr><td><code>p_status
      OUT VARCHAR2</code></td><td>tham số ra: thủ tục trả chữ <code>OK</code> về cho
      người gọi</td></tr><tr><td><code>LEAST(2, 1)</code>, <code>GREATEST(2, 1)</code></td><td>số
      nhỏ hơn là 1, số lớn hơn là 2</td></tr><tr><td><code>RAISE_APPLICATION_ERROR(-20001,
      ''…'')</code></td><td>tự báo một lỗi có mã riêng, mã nằm trong khoảng −20000
      tới −20999</td></tr><tr><td><code>EXCEPTION WHEN OTHERS THEN</code></td><td>phần
      bắt lỗi: bắt mọi lỗi xảy ra phía trên</td></tr><tr><td><code>RAISE;</code></td><td>ném
      tiếp lỗi vừa bắt lên người gọi</td></tr></table>'
    say: Bảng này giải mã từ khoá PL/SQL. Từ khoá vào sau tên tham số nghĩa là tham
      số vào, người gọi đưa số tiền vào. Từ khoá ra đánh dấu tham số ra, thủ tục ghi
      chữ báo thành công vào đó để trả về. Hai hàm tiếp theo lấy số nhỏ hơn và số
      lớn hơn, với hai và một thì được một và hai. Lệnh báo lỗi riêng của ứng dụng
      tự tạo một lỗi có mã riêng, nằm trong khoảng từ âm hai mươi nghìn tới âm hai
      mươi nghìn chín trăm chín mươi chín. Phần bắt lỗi bắt mọi lỗi xảy ra phía trên
      nó. Còn lệnh ném tiếp chuyển lỗi vừa bắt lên cho người gọi.
  - show: '<table class=''t''><tr><th>T-SQL (SQL Server)</th><th>nghĩa</th></tr><tr><td><code>@amt
      BIGINT</code>, <code>@status … OUTPUT</code></td><td>tham số bắt đầu bằng @;
      OUTPUT là tham số ra</td></tr><tr><td><code>SET XACT_ABORT ON</code></td><td>câu
      lệnh lỗi lúc chạy làm hoàn tác <b>cả</b> giao dịch</td></tr><tr><td><code>BEGIN
      TRY … END TRY BEGIN CATCH … END CATCH</code></td><td>khối thử, và khối bắt lỗi
      chạy khi khối thử lỗi</td></tr><tr><td><code>WITH (UPDLOCK, ROWLOCK)</code></td><td>khoá
      để cập nhật, khoá từng hàng: giống FOR UPDATE</td></tr><tr><td><code>@@TRANCOUNT</code></td><td>số
      lệnh BEGIN TRAN chưa kết thúc (độ lồng); lớn hơn 0 là còn giao dịch mở</td></tr><tr><td><code>THROW;</code></td><td>trong
      khối bắt lỗi: ném lại lỗi vừa bắt</td></tr></table>'
    clear: true
    say: Còn đây là từ khoá của ngôn ngữ thủ tục bên máy chủ SQL. Tham số bắt đầu
      bằng ký hiệu a còng, và từ khoá đứng sau một tham số đánh dấu tham số đó là
      tham số ra. Tuỳ chọn huỷ giao dịch khi lỗi, lúc bật lên, làm một câu lệnh lỗi
      hoàn tác cả giao dịch. Khối thử chứa việc chính, khối bắt lỗi chạy khi khối
      thử có lỗi. Hai gợi ý trong ngoặc là khoá để cập nhật và khoá từng hàng, giống
      khoá để cập nhật của Oracle. Biến đếm cho biết số lệnh mở giao dịch chưa kết
      thúc, lớn hơn không là còn giao dịch đang mở. Cuối cùng, lệnh ném không kèm
      gì, đặt trong khối bắt lỗi, ném lại đúng lỗi vừa bắt.
