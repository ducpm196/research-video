  checks:
  - '[alg.bnx_l06_statements(n) for n in (10, 1000, 100000)] == [50, 5000, 500000]'
  - '[alg.bnx_l06_statements(n) // 5 for n in (10, 1000, 100000)] == [10, 1000, 100000]'
