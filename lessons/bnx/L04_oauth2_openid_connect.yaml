scenes:
- id: hook
  kind: hook
  title: Có nên đưa mật khẩu ngân hàng cho ứng dụng khác?
  checks:
  - alg.bnx_oauth_case('accounts:read', 'api-a', 'payments:write', 'api-a', 10) ==
    403
  steps:
  - show: '<p>Một ứng dụng quản lý chi tiêu muốn đọc lịch sử giao dịch của khách qua
      Open API của ngân hàng (Thông tư 64/2024/TT-NHNN về Open API).</p>

      <div class="box key">Cách tệ: khách đưa <b>mật khẩu</b> cho ứng dụng đó. Ứng
      dụng làm được <b>mọi việc</b>, kể cả chuyển tiền, và khách không rút lại được
      nếu không đổi mật khẩu.</div>

      '
    focus:
    - 1
    - 2
    - 2
    say: Chào bạn, một ứng dụng quản lý chi tiêu muốn đọc lịch sử giao dịch của khách
      qua giao diện lập trình mở của ngân hàng. Cách tệ nhất là khách đưa mật khẩu
      cho ứng dụng đó. Khi ấy ứng dụng làm được mọi việc, kể cả chuyển tiền, và khách
      không rút lại được nếu không đổi mật khẩu.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>ai
      cấp mã, ai kiểm mã</td><td>bốn vai của OAuth 2.0: máy chủ ủy quyền cấp, máy
      chủ tài nguyên kiểm</td></tr><tr><td>mã được làm gì</td><td>phạm vi quyền: mã
      <code>accounts:read</code> gọi lệnh cần <code>payments:write</code> bị <b>403</b></td></tr><tr><td>đăng
      nhập thì sao</td><td>OpenID Connect thêm <b>mã định danh</b>; không dùng nó
      để gọi API</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: 'Hôm nay ta trả lời ba câu, ai cấp mã và ai kiểm mã, theo bốn vai của chuẩn
      ủy quyền. Mã được làm những gì, gọi là phạm vi quyền: mã chỉ được đọc tài khoản
      mà gọi lệnh ghi thanh toán sẽ bị từ chối bốn trăm lẻ ba. Và đăng nhập khác ủy
      quyền ra sao, với mã định danh của chuẩn đăng nhập mở.'
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_pkce_s256('dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk') == 'E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM'
  - alg.bnx_utc(1300819380)[:4] == '2011'
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 360)
    == 401
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      mã truy cập ở bài 3</td><td>ba phần đầu.thân.chữ ký; phía nhận kiểm chữ ký,
      hạn <code>exp</code>, người nhận <code>aud</code></td><td>hạn 1300819380 là
      năm 2011: hết hạn</td></tr><tr><td>② 401 và 403</td><td>401: mã không dùng được
      ở đây (thiếu, sai, hết hạn); 403: mã tốt nhưng thiếu quyền (RFC 6750 mục 3.1)</td><td>mã
      hết hạn → 401; thiếu quyền → 403</td></tr><tr><td>③ chuyển hướng</td><td>máy
      chủ bảo trình duyệt mở một địa chỉ khác, kèm tham số</td><td>ứng dụng → trang
      đăng nhập của ngân hàng</td></tr><tr><td>④ PKCE (băm chuỗi bí mật)</td><td>mỗi
      lần đăng nhập, ứng dụng sinh một chuỗi ngẫu nhiên giữ kín, gửi <b>băm SHA256</b>
      của nó trước, gửi <b>chuỗi gốc</b> sau để máy chủ băm lại và so</td><td>băm
      của <code>dBjftJeZ…</code> = <code>E9Melhoa…</code> (RFC 7636)</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: 'Trước hết ta cần hiểu bốn điều, thứ nhất, mã truy cập như ở bài ba có ba
      phần, phía nhận kiểm chữ ký, hạn dùng và người nhận. Thứ hai, mã bốn trăm lẻ
      một nghĩa là mã không dùng được ở đây, còn bốn trăm lẻ ba nghĩa là mã tốt nhưng
      thiếu quyền. Thứ ba, chuyển hướng là máy chủ bảo trình duyệt mở một địa chỉ
      khác, ví dụ trang đăng nhập của ngân hàng. Thứ tư là cơ chế băm chuỗi bí mật:
      mỗi lần đăng nhập, ứng dụng sinh một chuỗi ngẫu nhiên, gửi băm SHA256 của nó
      trước, rồi gửi chuỗi gốc sau để máy chủ băm lại và so.'
  - show: '<p>Làm thử với chuỗi mẫu của RFC 7636 (RFC này chép lại đúng chuỗi chữ
      ký ở bài 3 làm chuỗi ngẫu nhiên mẫu; ở đây nó <b>không</b> phải chữ ký): băm
      SHA256 rồi viết base64url.</p>

      $$\text{dBjftJeZ4CVP…OEjXk} \to \hl{\text{E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM}}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Làm thử với chuỗi mẫu trong RFC bảy nghìn sáu trăm ba mươi sáu, chuỗi này
      tình cờ trùng chữ ký ở bài ba vì RFC chép lại nó làm ví dụ. Băm SHA256 rồi viết
      lại bằng cơ số sáu mươi tư, ta được chuỗi bắt đầu bằng E chín M, đúng như RFC.
      Ai bắt được chuỗi băm này cũng không suy ngược ra chuỗi gốc, nên dù chặn được
      mã tạm mà máy chủ cấp giữa chừng, kẻ gian vẫn không đổi được nó lấy mã truy
      cập.
- id: sym
  kind: symbol
  title: Giải mã bốn vai và các từ hay gặp
  checks:
  - alg.bnx_scopes('accounts:read payments:write') == ['accounts:read', 'payments:write']
  steps:
  - show: <table class='t'><tr><th>vai (RFC 6749 mục 1.1)</th><th>nghĩa</th><th>trong
      ví dụ ngân hàng</th></tr><tr><td>chủ tài nguyên</td><td>người có quyền cho phép
      truy cập</td><td>khách hàng</td></tr><tr><td>máy khách (client)</td><td>ứng
      dụng gọi API thay mặt chủ tài nguyên, hoặc cho chính nó (dịch vụ gọi dịch vụ)</td><td>ứng
      dụng quản lý chi tiêu, dịch vụ thanh toán</td></tr><tr><td>máy chủ ủy quyền</td><td>xác
      thực chủ tài nguyên rồi <b>cấp</b> mã truy cập</td><td>máy chủ đăng nhập của
      ngân hàng</td></tr><tr><td>máy chủ tài nguyên</td><td>giữ dữ liệu, <b>kiểm</b>
      mã rồi mới trả lời</td><td>API tài khoản; API sổ cái <code>api-a</code></td></tr></table>
    focus:
    - - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã bốn vai, chủ tài nguyên là người có quyền cho phép, ở đây
      là khách hàng. Máy khách là ứng dụng gọi giao diện lập trình thay mặt khách,
      hoặc cho chính nó khi dịch vụ gọi dịch vụ. Máy chủ ủy quyền xác thực khách rồi
      cấp mã. Máy chủ tài nguyên giữ dữ liệu, kiểm mã rồi mới trả lời.
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>scope
      (phạm vi)</td><td>danh sách quyền ngăn bằng dấu cách: <code>accounts:read payments:write</code></td></tr><tr><td>mã
      ủy quyền (code)</td><td>mã tạm, dùng một lần, chỉ để đổi lấy mã truy cập</td></tr><tr><td>Bearer</td><td>“người
      cầm”: ai cầm mã là dùng được, nên phải giữ kín và hạn ngắn</td></tr><tr><td>mã
      định danh (ID token)</td><td>của OpenID Connect: nói <b>ai</b> vừa đăng nhập
      (<code>sub</code>), cấp cho ứng dụng (<code>aud</code>), có <code>iss</code>,
      <code>iat</code>, <code>exp</code>; <code>nonce</code> nếu ứng dụng đã gửi,
      để chống dùng lại mã cũ</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Thêm bốn từ nữa, phạm vi là danh sách quyền ngăn bằng dấu cách, ví dụ đọc
      tài khoản và ghi thanh toán. Mã ủy quyền là mã tạm, chỉ dùng một lần để đổi
      lấy mã truy cập. Kiểu người cầm nghĩa là ai cầm mã là dùng được, nên phải giữ
      kín. Mã định danh nói ai vừa đăng nhập, cấp cho chính ứng dụng, và mang lại
      số dùng một lần mà ứng dụng đã gửi, để chống dùng lại mã cũ.
