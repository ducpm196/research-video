id: L04
course: BNX
series: BNX · Backend ngân hàng mở rộng theo JD
title: 'Bài 4 — OAuth 2.0 và OpenID Connect: ai cấp mã, ai kiểm mã, phạm vi quyền'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/bnx.yaml L04; audit/bnx/verify_bnx.py L04; RFC 6749 mục 1.1, 2.1,
  3.3, 4.4, 5.1 (2012); RFC 6750 mục 3.1 (2012); RFC 7636 phụ lục B (2015); RFC 7519
  mục 4.1.3, 4.1.4 (2015); RFC 9068 (2021); RFC 8252 mục 8.12 (2017); OpenID Connect
  Core 1.0 mục 2 (đọc 2026-11-11)
assumes: []
objectives:
- Gọi tên bốn vai trong OAuth 2.0
- 'Chọn luồng cấp mã: mã ủy quyền có PKCE cho ứng dụng, thông tin máy khách cho dịch
  vụ với dịch vụ'
- Kiểm phạm vi quyền và người nhận của mã truy cập
- Phân biệt mã truy cập với mã định danh của OpenID Connect
