  - {sentence: "Bây giờ tới phần bạn tự làm bài.", reason: "ASR chép “Bây giờ tới phần bạn tự lam bay.” (0.75): lệch âm/thanh thuần Việt: làm bài/lam bay — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ai tải ứng dụng về cũng trích ra được.", reason: "ASR chép “Ai tại ứng dụng về cũng trích tra được.” (0.778): lệch âm/thanh thuần Việt: tải/tại, ra/tra — NOT_VERIFIED bằng tai người"}
  - {sentence: "Phép tính thứ ba, mã cấp cho người nhận API A mang sang API B, người nhận không khớp, nên API B từ chối bốn trăm lẻ một.", reason: "ASR chép “Phép tính thứ ba mà cắp cho người nhận API Amanshagapip, người nhận không khớp, nên APIB từ chối 401.” (0.806): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: mã cấp/mà cắp, mang sang i (trong “a mang sang a p i b” → “amanshagapip”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, mã có hai phạm vi đọc tài khoản và ghi thanh toán, gọi API A cần ghi thanh toán ở giây một nghìn một trăm, kết quả ra sao?", reason: "ASR chép “Câu 1, mà có hai phạm vi độc tài khoản và ghi thanh toán, gọi APYA cần ghi thanh toán ở dây 1100, kết quả ra sao?” (0.885): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; “api” đọc theo luật lexicon (lexicon_vi.BNX.yaml: “A P I”), ASR viết “apya”; lệch âm/thanh thuần Việt: mã/mà, đọc/độc — NOT_VERIFIED bằng tai người"}
