      x="470" y="153" font-size="22" text-anchor="middle" fill="#1f2937">① POST /token,
      phạm vi payments:write</text><line x1="742" y1="231" x2="202" y2="231" stroke="#334155"
      stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="219" font-size="22"
      text-anchor="middle" fill="#1f2937">② mã truy cập: aud api-a, hạn 300 giây</text><line
      x1="198" y1="297" x2="1298" y2="297" stroke="#334155" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="1030" y="285" font-size="22" text-anchor="middle" fill="#1f2937">③ gọi API
      sổ cái, kèm mã</text><line x1="1302" y1="363" x2="202" y2="363" stroke="#334155"
      stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="351" font-size="22"
      text-anchor="middle" fill="#1f2937">④ 200, hoặc 401 / 403</text></svg></div>'
    clear: true
    say: Còn khi dịch vụ gọi dịch vụ thì không có khách nào đăng nhập. Dịch vụ thanh
      toán chạy trên máy chủ, giữ được bí mật, nên tự xin mã bằng mã máy khách và
      bí mật đi kèm. Mã máy khách là tên định danh mà máy chủ ủy quyền cấp cho dịch
      vụ khi đăng ký. Máy chủ ủy quyền trả mã truy cập có người nhận là API A, hạn
      ba trăm giây. Dịch vụ gọi API sổ cái kèm mã, và API trả hai trăm, hoặc từ chối.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: chọn luồng và kiểm mã'
  checks:
  - alg.bnx_last_ok_age(300, 60) == 359
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 359)
    == 200
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 360)
    == 401
  - __import__('base64').b64decode('czZCaGRSa3F0MzpnWDFmQmF0M2JW') == b's6BhdRkqt3:gX1fBat3bV'
  steps:
  - show: '<p><b>Bước 1.</b> API không nên thấy mật khẩu của khách. Vì vậy tách vai:
      máy chủ ủy quyền <b>cấp</b> mã, máy chủ tài nguyên chỉ <b>kiểm</b> mã.</p>

      <span class=''note''>Làm thử: khách gõ mật khẩu ở 1 nơi (máy chủ ủy quyền),
      0 lần ở ứng dụng và API.</span>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, vì giao diện lập trình không nên thấy mật khẩu của khách, ta tách
      vai. Máy chủ ủy quyền cấp mã, còn máy chủ tài nguyên chỉ kiểm mã. Làm thử, khách
      gõ mật khẩu ở đúng một nơi là máy chủ ủy quyền, và không lần nào ở ứng dụng
      hay giao diện lập trình.
  - show: '<p><b>Bước 2.</b> Ứng dụng di động là <b>máy khách công khai</b>: mọi bí
      mật đóng gói trong ứng dụng đều trích ra được (RFC 6749 mục 2.1).

      Nên dùng <b>luồng mã ủy quyền có PKCE</b>: kẻ chặn được mã ở bước ③ không có
      chuỗi gốc để làm bước ④.</p>

      '
    say: Bước hai, ứng dụng di động là máy khách công khai, vì mọi bí mật đóng gói
      trong ứng dụng đều trích ra được. Nên ta dùng luồng mã ủy quyền có băm chuỗi
      bí mật. Kẻ chặn được mã ủy quyền ở bước ba vẫn không có chuỗi gốc để làm bước
      bốn.
  - show: <p><b>Bước 3.</b> Dịch vụ gọi dịch vụ thì không có khách, và dịch vụ chạy
      trên máy chủ <b>giữ được</b> bí mật. Nên dùng <b>luồng thông tin máy khách</b>
      (client credentials, RFC 6749 mục 4.4).</p>
    clear: true
    say: Bước ba, khi dịch vụ gọi dịch vụ thì không có khách nào, và dịch vụ chạy
      trên máy chủ giữ được bí mật. Nên ta dùng luồng thông tin máy khách, chỉ cần
      mã máy khách và bí mật.
  - show: '<p><b>Yêu cầu xin mã (RFC 6749 mục 4.4.2, thêm phạm vi)</b></p><div class="code"><div>POST
      /token HTTP/1.1</div><div>Host: server.example.com</div><div>Authorization:
      Basic czZCaGRSa3F0MzpnWDFmQmF0M2JW</div><div>Content-Type: application/x-www-form-urlencoded</div><div>
      </div><div>grant_type=client_credentials&amp;scope=payments:write</div></div>'
    focus:
    - 0
    - '2.3'
    - '2.6'
    clear: true
    say: Đây là yêu cầu xin mã của luồng thông tin máy khách, theo ví dụ của RFC.
      Dòng xác thực mang mã máy khách và bí mật, viết lại bằng cơ số sáu mươi tư.
      Thân yêu cầu ghi loại luồng là thông tin máy khách, và phạm vi xin là ghi thanh
      toán, nên mã cấp ra chỉ được ghi thanh toán.
  - show: '<p><b>Phản hồi (RFC 6749 mục 5.1)</b></p><div class="code"><div>{</div><div>  "access_token":
      "eyJ0eXAiOiJhdCtqd3QiLCJhbGciOiJ…",</div><div>  "token_type": "Bearer",</div><div>  "expires_in":
      300,</div><div>  "scope": "payments:write"</div><div>}</div></div>'
    focus:
    - - '2.2'
      - '2.3'
      - '2.4'
      - '2.5'
    clear: true
    say: Phản hồi trả mã truy cập, kiểu người cầm, hạn ba trăm giây, và phạm vi đã
      cấp, nên dịch vụ biết sau ba trăm giây phải xin mã mới.
  - show: '<p><b>Bước 4.</b> API kiểm theo thứ tự: chữ ký và người phát hành (như
      bài 3) → <code>aud</code> đúng là mình → hạn (có lệch đồng hồ) → phạm vi.

      Lỗi ở ba cửa đầu là <b>401</b> (mã không dùng được ở đây); qua hết mà thiếu
      phạm vi là <b>403</b>.</p>

      $$300 + 60 = \hl{360}\ \text{: từ giây này từ chối, giây cuối còn nhận là }
      \hlg{359}$$

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, giao diện lập trình kiểm theo thứ tự. Chữ ký và người phát hành
      như bài ba, rồi người nhận phải đúng là mình, rồi hạn dùng, rồi phạm vi. Sai
      ở các cửa đầu là bốn trăm lẻ một, vì mã không dùng được ở đây. Qua hết mà thiếu
      phạm vi thì là bốn trăm lẻ ba. Vì đồng hồ hai máy có thể lệch nhau, ta cho lệch
      sáu mươi giây, nên hạn cộng lệch là giây ba trăm sáu mươi. Giống bài ba, mã
      không được nhận từ đúng giây đó, nên giây cuối còn nhận là ba trăm năm mươi
      chín.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 1000 + 300 == 1300
  - alg.bnx_oauth_case('accounts:read', 'api-a', 'payments:write', 'api-a', 10) ==
    403
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-b', 10) ==
    401
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 359)
    == 200
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 360)
    == 401
  - 'alg.bnx_rs_check({''aud'': ''app-di-dong'', ''exp'': 1300, ''nonce'': ''n-0S6''},
    ''payments:write'', ''api-a'', 1010) == 401'
  steps:
  - show: '<p>Mã cấp lúc giây <code>iat</code> = 1000, <code>expires_in</code> = 300.</p>

      $$① \; 1000 + 300 = \hl{1300} = \text{exp}$$

      '
    focus:
    - - 1
    - 2
    clear: true
    say: Ta tính năm ca, mã được cấp ở giây một nghìn, hạn ba trăm giây. Phép tính
      thứ nhất, hạn dùng là một nghìn cộng ba trăm, bằng một nghìn ba trăm.
  - show: $$② \; \text{phạm vi “accounts:read” không có “payments:write”} \Rightarrow
      \hl{403}$$
    introduces:
    - implies
    say: Phép tính thứ hai, mã chỉ có phạm vi đọc tài khoản, không có ghi thanh toán,
      nên gọi lệnh ghi bị từ chối bốn trăm lẻ ba.
  - show: $$③ \; \text{aud} = \text{api-a} \ne \text{api-b} \Rightarrow \hl{401}$$
    say: Phép tính thứ ba, mã cấp cho người nhận API A mang sang API B, người nhận
      không khớp, nên API B từ chối bốn trăm lẻ một.
  - show: '<p>Dùng lại exp = 1300 ở phép ①.</p>

      $$④ \; 1000 + 359 = 1359 \text{ nhỏ hơn } 1300 + 60 = 1360 \Rightarrow \hlg{200}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư dùng lại hạn một nghìn ba trăm. Ở giây thứ ba trăm năm mươi
      chín, bây giờ là một nghìn ba trăm năm mươi chín, còn nhỏ hơn hạn cộng lệch,
      nên còn nhận.
  - show: $$⑤ \; 1000 + 360 = 1360 \text{ không nhỏ hơn } 1360 \Rightarrow \hl{401}$$
    say: Phép tính thứ năm, chỉ một giây sau, bây giờ là một nghìn ba trăm sáu mươi,
      đã bằng hạn cộng lệch, nên theo đúng quy tắc của bài ba, mã bị từ chối bốn trăm
      lẻ một.
  - show: '<p><b>Máy chủ tài nguyên kiểm mã (Python)</b></p><div class="code"><div>def
      kiem(c, can, toi, bay_gio, lech=60):</div><div>    # c: các trường của mã; chữ
      ký đã kiểm như bài 3</div><div>    aud = c["aud"] if isinstance(c["aud"], list)
      else [c["aud"]]</div><div>    if toi not in aud:</div><div>        return 401       #
      mã không cấp cho API này</div><div>    if bay_gio &gt;= c["exp"] + lech:</div><div>        return
      401       # hết hạn, đã cộng lệch đồng hồ</div><div>    if can not in c["scope"].split("
      "):</div><div>        return 403       # biết ai gọi, nhưng thiếu quyền</div><div>    return
      200</div></div>'
    focus:
    - '2.1'
    - - '2.3'
      - '2.4'
      - '2.5'
    - - '2.6'
      - '2.7'
    - - '2.8'
      - '2.9'
    clear: true
    say: Bây giờ viết thành mã Python, hàm kiểm nhận các trường của mã, quyền cần,
      tên của chính API, và thời điểm hiện tại. Cửa đầu tìm tên mình trong người nhận,
      vì người nhận có thể là một tên hoặc một danh sách tên. Cửa hai từ chối khi
      thời điểm đã tới hạn cộng lệch. Cửa ba tìm quyền cần trong danh sách phạm vi.
  - show: '<p><b>Năm ca thử</b></p><div class="code"><div>cap = 1000                        #
      giây cấp mã (iat)</div><div>doc = {"aud": "api-a", "exp": cap + 300, "scope":
      "accounts:read"}</div><div>ghi = {"aud": "api-a", "exp": cap + 300, "scope":
      "payments:write"}</div><div>print(kiem(doc, "payments:write", "api-a", cap +
      10))</div><div>print(kiem(ghi, "payments:write", "api-b", cap + 10))</div><div>print(kiem(ghi,
      "payments:write", "api-a", cap + 359))</div><div>print(kiem(ghi, "payments:write",
      "api-a", cap + 360))</div><div>idt = {"aud": "app-di-dong", "exp": cap + 300,
      "nonce": "n-0S6"}</div><div>print(kiem(idt, "payments:write", "api-a", cap +
      10))</div></div>'
    focus:
    - '2.4'
    - - '2.5'
      - '2.6'
      - '2.7'
    - - '2.8'
      - '2.9'
    clear: true
    say: Năm ca thử, mã chỉ đọc gọi lệnh ghi. Mã ghi mang sang API B, mã ghi ở giây
      ba trăm năm mươi chín, rồi ba trăm sáu mươi. Ca cuối là một mã định danh, người
      nhận là chính ứng dụng di động, bị đem đi gọi API A.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>403</div><div>401</div><div>200</div><div>401</div><div>401</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: 'Kết quả chạy thật, đúng thứ tự: bốn trăm lẻ ba, bốn trăm lẻ một, hai trăm,
      bốn trăm lẻ một, và bốn trăm lẻ một cho mã định danh. Bốn số đầu khớp các phép
      tính ta vừa làm bằng tay, từ phép hai tới phép năm.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm từng giây'
  checks:
  - alg.bnx_ok_seconds(300, 60, 999) == 360
  - alg.bnx_last_ok_age(300, 60) == 359
  steps:
  - show: <p><b>Đếm thẳng mọi giây từ 0 tới 999</b></p><div class="code"><div>nhan
      = [g for g in range(0, 1000)</div><div>        if kiem(ghi, "payments:write",
      "api-a", cap + g) == 200]</div><div>print(len(nhan), nhan[0], nhan[-1])</div></div>
    focus:
    - - 1
      - 2
    clear: true
    say: Kiểm bằng đường khác, thay vì tính giây biên, ta thử hết một nghìn giây kể
      từ lúc cấp, và giữ lại những giây được nhận.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>360 0 359</div></div>
    focus:
    - 1
    - 2
    say: Kết quả chạy thật cho thấy, vì mọi giây đều được thử, có đúng ba trăm sáu
      mươi giây được nhận, từ giây không tới giây ba trăm năm mươi chín. Vậy giây
      biên ở phép bốn và phép năm là đúng.
  - show: '<table class=''t''><tr><th>quy tắc so ở giây biên</th><th>giây 359</th><th>giây
      360</th></tr><tr><td>bài này: từ chối khi bây giờ ≥ exp + lệch (khớp RFC 7519
      và bài 3)</td><td>nhận</td><td>từ chối</td></tr><tr><td>một số thư viện: từ
      chối khi bây giờ &gt; exp + lệch</td><td>nhận</td><td>nhận (giây 361 mới từ
      chối)</td></tr></table>'
    focus:
    - 0
    - 1
    - 1
    clear: true
    say: Bảng này nhắc một điều người đi làm hay gặp. Bài này từ chối ngay khi bây
      giờ bằng hạn cộng lệch, khớp RFC và bài ba, còn có thư viện chỉ từ chối khi
      lớn hơn. Vì hai cách chỉ khác nhau đúng một giây, hãy đọc kỹ mô tả của thư viện
      mình dùng, rồi chạy thử đúng giây biên, thay vì đoán.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 'alg.bnx_rs_check({''aud'': ''app-di-dong'', ''exp'': 1300}, ''payments:write'',
    ''api-a'', 1010) == 401'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Coi OAuth 2.0 là <b class="red">đăng
      nhập</b>. Mã truy cập dành cho API; ứng dụng không được dựa vào nó để biết ai
      đăng nhập.

      Đó là việc của OpenID Connect: mã định danh bắt buộc có <code>iss</code>, <code>sub</code>,
      <code>aud</code>, <code>exp</code>, <code>iat</code>; có <code>nonce</code>
      nếu ứng dụng đã gửi (OpenID Connect Core 1.0 mục 2).</div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới, là coi chuẩn ủy quyền là đăng nhập. Mã truy
      cập dành cho giao diện lập trình, và ứng dụng không được dựa vào nó để biết
      ai đăng nhập. Đó là việc của chuẩn đăng nhập mở, qua mã định danh bắt buộc có
      người phát hành, chủ thể, người nhận, hạn dùng, lúc cấp, và số dùng một lần
      nếu ứng dụng đã gửi.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Dùng
      mã định danh để gọi API</b>. Người nhận của nó là chính ứng dụng (<code>app-di-dong</code>),
      nên API kiểm <code>aud</code> phải trả <b>401</b>, như ca cuối.

      <br><span class="note">API bỏ qua <code>aud</code> sẽ nhận nhầm. RFC 9068 thêm
      kiểu <code>at+jwt</code> để phân biệt mã truy cập với mã định danh.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là dùng mã định danh để gọi giao diện lập
      trình. Người nhận của nó là chính ứng dụng, nên API kiểm người nhận phải trả
      bốn trăm lẻ một, như ca cuối. API nào bỏ qua người nhận sẽ nhận nhầm, vì cả
      hai loại mã đều có chữ ký đúng.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Đặt <b class="red">bí
      mật máy khách trong ứng dụng di động</b>. Ai tải ứng dụng cũng trích ra được
      (RFC 6749 mục 2.1).

      <br><span class="note">Cách chữa: ứng dụng là máy khách công khai, dùng mã ủy
      quyền có PKCE; bí mật chỉ nằm ở dịch vụ phía máy chủ.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, là đặt bí mật máy khách trong ứng dụng
      di động. Ai tải ứng dụng về cũng trích ra được. Cách chữa là coi ứng dụng là
      máy khách công khai, dùng mã ủy quyền có băm chuỗi bí mật, còn bí mật chỉ nằm
      ở dịch vụ phía máy chủ.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 'alg.bnx_rs_check({''aud'': ''api-a'', ''exp'': 1300, ''scope'': ''accounts:read
    payments:write''}, ''payments:write'', ''api-a'', 1100) == 200'
  - alg.bnx_last_ok_age(600, 60) == 659
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 660,
    ttl=600) == 401
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 659,
    ttl=600) == 200
  - 'alg.bnx_rs_check({''aud'': [''api-a'', ''api-b'', ''api-c'', ''api-d'', ''api-e''],
    ''exp'': 1300, ''scope'': ''payments:write''}, ''payments:write'', ''api-c'',
    1100) == 200'
  - alg.bnx_token_requests_per_hour(1, 300) == 12
  - alg.bnx_token_requests_per_hour(5, 300) == 60
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Mã
      có phạm vi <code>accounts:read payments:write</code>, aud <code>api-a</code>,
      cấp lúc 1000, hạn 300. Gọi <code>api-a</code> cần <code>payments:write</code>
      lúc 1100. Kết quả?</td></tr><tr><td>2</td><td>Mã hạn 600 giây, cho lệch đồng
      hồ 60 giây (quy tắc của bài). Giây cuối còn nhận là giây thứ mấy?</td></tr><tr><td>3</td><td>Quyết
      định (số minh hoạ): 5 API, mã hạn 300 giây. Một mã chung có aud cả 5 API, hay
      mỗi API một mã riêng?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, mã có hai phạm vi đọc tài khoản
      và ghi thanh toán, gọi API A cần ghi thanh toán ở giây một nghìn một trăm, kết
      quả ra sao? Câu hai, mã hạn sáu trăm giây, cho lệch sáu mươi giây, giây cuối
      còn nhận là giây thứ mấy? Câu ba, có năm giao diện lập trình, nên dùng một mã
      chung hay mỗi nơi một mã riêng? Hãy dừng video lại và làm từng câu ra giấy trước
      khi xem đáp án.
  - show: '<p>Câu 1: aud đúng; 1100 &lt; 1300 + 60; phạm vi tách theo dấu cách có
      <code>payments:write</code>.</p>

      $$\Rightarrow \hlg{200}$$

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu một, người nhận đúng, giây một nghìn một trăm còn trong hạn, và
      tách phạm vi theo dấu cách thì có ghi thanh toán, nên kết quả là hai trăm.
    clear: true
  - show: '<p>Câu 2: từ chối khi bây giờ ≥ hạn + lệch.</p>

      $$600 + 60 = 660 \Rightarrow 660 \to 401; \quad \text{giây cuối còn nhận } \hlg{659}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu hai, hạn cộng lệch là sáu trăm cộng sáu mươi, bằng sáu trăm sáu
      mươi, nên từ giây đó bị từ chối. Giây cuối còn nhận là sáu trăm năm mươi chín.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>một
      mã chung, aud là danh sách 5 API</td><td>xin mã 3600 : 300 = 12 lần mỗi giờ</td><td>lộ
      mã thì cả 5 API bị dùng</td></tr><tr><td>mỗi API một mã riêng</td><td>lộ một
      mã chỉ hở 1 API; aud hẹp</td><td>xin mã $5 \cdot 12 = 60$ lần mỗi giờ</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Đáp án câu ba, ta so hai cách theo số lần xin mã và vùng thiệt hại. Một mã
      chung có người nhận là danh sách năm tên, hàm kiểm tìm tên mình trong danh sách,
      nên mỗi giờ chỉ xin mười hai lần, nhưng lộ mã là cả năm nơi bị dùng. Mỗi nơi
      một mã riêng thì lộ một mã chỉ hở một nơi, đổi lại mỗi giờ phải xin sáu mươi
      lần. Nên chọn vùng thiệt hại nhỏ, rồi lưu mã đệm đến gần hạn để giảm số lần
      xin.
    clear: true
    introduces:
    - cdot
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>máy chủ ủy quyền cấp mã</span><span
      class=''a''>→</span><span class=''n''>ứng dụng: mã ủy quyền + PKCE</span><span
      class=''a''>→</span><span class=''n''>dịch vụ: thông tin máy khách</span><span
      class=''a''>→</span><span class=''n''>API kiểm aud, hạn, phạm vi</span><span
      class=''a''>→</span><span class=''n''>401 hay 403</span></div>'
    say: Tổng kết chuỗi logic, máy chủ ủy quyền cấp mã. Ứng dụng di động dùng mã ủy
      quyền có băm chuỗi bí mật, còn dịch vụ gọi dịch vụ dùng thông tin máy khách.
      Giao diện lập trình kiểm người nhận, hạn và phạm vi, rồi trả bốn trăm lẻ một
      hoặc bốn trăm lẻ ba cho đúng.
  - show: '<div class=''box key''><b>Tư duy:</b> tách “ai cấp” khỏi “ai kiểm”, và
      cho mỗi mã <b>ít quyền nhất, ít nơi nhận nhất, hạn ngắn nhất</b> đủ dùng.

      Mã định danh để biết ai đăng nhập; mã truy cập để gọi API.</div>

      '
    say: Điều cần mang theo, tách ai cấp khỏi ai kiểm, và cho mỗi mã ít quyền nhất,
      ít nơi nhận nhất, hạn ngắn nhất mà vẫn đủ dùng. Mã định danh để biết ai đăng
      nhập, còn mã truy cập để gọi giao diện lập trình.
  - show: '<p>Bài sau: khi các dịch vụ gọi nhau, <b>máy</b> cũng phải chứng minh mình
      là ai: hai bên cùng trình chứng chỉ.</p>'
    forward_ref: true
    say: Ở bài năm, ta xem khi các dịch vụ gọi nhau, chính máy cũng phải chứng minh
      mình là ai, bằng cách hai bên cùng trình chứng chỉ.
