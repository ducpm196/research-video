- id: formula
  kind: formula
  title: 'Suy ra từng bước: chọn luồng và kiểm mã'
  checks:
  - alg.bnx_last_ok_age(300, 60) == 359
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 359)
    == 200
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 360)
    == 401
  - __import__('base64').b64decode('czZCaGRSa3F0MzpnWDFmQmF0M2JW') == b's6BhdRkqt3:gX1fBat3bV'
  steps:
  - show: '<p><b>Bước 1.</b> API không nên thấy mật khẩu của khách. Vì vậy tách vai:
      máy chủ ủy quyền <b>cấp</b> mã, máy chủ tài nguyên chỉ <b>kiểm</b> mã.</p>

      <span class=''note''>Làm thử: khách gõ mật khẩu ở 1 nơi (máy chủ ủy quyền),
      0 lần ở ứng dụng và API.</span>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, vì giao diện lập trình không nên thấy mật khẩu của khách, ta tách
      vai. Máy chủ ủy quyền cấp mã, còn máy chủ tài nguyên chỉ kiểm mã. Làm thử, khách
      gõ mật khẩu ở đúng một nơi là máy chủ ủy quyền, và không lần nào ở ứng dụng
      hay giao diện lập trình.
  - show: '<p><b>Bước 2.</b> Ứng dụng di động là <b>máy khách công khai</b>: mọi bí
      mật đóng gói trong ứng dụng đều trích ra được (RFC 6749 mục 2.1).

      Nên dùng <b>luồng mã ủy quyền có PKCE</b>: kẻ chặn được mã ở bước ③ không có
      chuỗi gốc để làm bước ④.</p>

      '
    say: Bước hai, ứng dụng di động là máy khách công khai, vì mọi bí mật đóng gói
      trong ứng dụng đều trích ra được. Nên ta dùng luồng mã ủy quyền có băm chuỗi
      bí mật. Kẻ chặn được mã ủy quyền ở bước ba vẫn không có chuỗi gốc để làm bước
      bốn.
  - show: <p><b>Bước 3.</b> Dịch vụ gọi dịch vụ thì không có khách, và dịch vụ chạy
      trên máy chủ <b>giữ được</b> bí mật. Nên dùng <b>luồng thông tin máy khách</b>
      (client credentials, RFC 6749 mục 4.4).</p>
    clear: true
    say: Bước ba, khi dịch vụ gọi dịch vụ thì không có khách nào, và dịch vụ chạy
      trên máy chủ giữ được bí mật. Nên ta dùng luồng thông tin máy khách, chỉ cần
      mã máy khách và bí mật.
  - show: '<p><b>Yêu cầu xin mã (RFC 6749 mục 4.4.2, thêm phạm vi)</b></p><div class="code"><div>POST
      /token HTTP/1.1</div><div>Host: server.example.com</div><div>Authorization:
      Basic czZCaGRSa3F0MzpnWDFmQmF0M2JW</div><div>Content-Type: application/x-www-form-urlencoded</div><div>
      </div><div>grant_type=client_credentials&amp;scope=payments:write</div></div><p
      class="note">Dòng đầu: phương thức <code>POST</code>, đường dẫn <code>/token</code>,
      phiên bản giao thức web <code>HTTP/1.1</code>. <code>Host</code>: tên máy chủ
      nhận. <code>Content-Type</code>: thân là các cặp <code>tên=giá trị</code> nối
      bằng <code>&amp;</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Đây là yêu cầu xin mã của luồng thông tin máy khách, theo ví dụ của RFC.
      Dòng đầu gồm phương thức gửi dữ liệu, đường dẫn và phiên bản của giao thức,
      dòng tiếp theo là tên máy chủ nhận. Dòng xác thực mang mã máy khách và bí mật
      viết lại bằng cơ số sáu mươi tư, còn dòng loại nội dung báo thân là các cặp
      tên và giá trị nối bằng dấu và. Thân ghi loại luồng và phạm vi xin là ghi thanh
      toán, nên mã cấp ra chỉ được ghi thanh toán.
  - show: '<p><b>Phản hồi (RFC 6749 mục 5.1)</b></p><div class="code"><div>{</div><div>  "access_token":
      "eyJ0eXAiOiJhdCtqd3QiLCJhbGciOiJ…",</div><div>  "token_type": "Bearer",</div><div>  "expires_in":
      300,</div><div>  "scope": "payments:write"</div><div>}</div></div>'
    focus:
    - - '2.2'
      - '2.3'
      - '2.4'
      - '2.5'
    clear: true
    say: Phản hồi trả mã truy cập, kiểu người cầm, hạn ba trăm giây, và phạm vi đã
      cấp, nên dịch vụ biết sau ba trăm giây phải xin mã mới.
  - show: '<p><b>Bước 4.</b> API kiểm theo thứ tự: chữ ký và người phát hành (như
      bài 3) → <code>aud</code> đúng là mình → hạn (có lệch đồng hồ) → phạm vi.

      Lỗi ở ba cửa đầu là <b>401</b> (mã không dùng được ở đây); qua hết mà thiếu
      phạm vi là <b>403</b>.</p>

      $$300 + 60 = \hl{360}\ \text{: từ giây này từ chối, giây cuối còn nhận là }
      \hlg{359}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước bốn, giao diện lập trình kiểm theo thứ tự: chữ ký và người phát hành
      như bài ba, rồi người nhận, hạn dùng, phạm vi. Sai ở các cửa đầu là bốn trăm
      lẻ một, qua hết mà thiếu phạm vi thì là bốn trăm lẻ ba. Vì đồng hồ hai máy có
      thể lệch, ta cho lệch sáu mươi giây, nên giây cuối còn nhận là ba trăm năm mươi
      chín.'
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - 1000 + 300 == 1300
  - alg.bnx_oauth_case('accounts:read', 'api-a', 'payments:write', 'api-a', 10) ==
    403
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-b', 10) ==
    401
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 359)
    == 200
  - alg.bnx_oauth_case('payments:write', 'api-a', 'payments:write', 'api-a', 360)
    == 401
  - 'alg.bnx_rs_check({''aud'': ''app-di-dong'', ''exp'': 1300, ''nonce'': ''n-0S6''},
    ''payments:write'', ''api-a'', 1010) == 401'
  steps:
  - show: '<p>Mã cấp lúc giây <code>iat</code> = 1000, <code>expires_in</code> = 300.</p>

      $$① \; 1000 + 300 = \hl{1300} = \text{exp}$$

      '
    focus:
    - - 1
      - 2
    clear: true
    say: Ta tính năm ca, mã được cấp ở giây một nghìn, hạn ba trăm giây, nên hạn dùng
      là một nghìn ba trăm.
  - show: $$② \; \text{phạm vi “accounts:read” không có “payments:write”} \Rightarrow
      \hl{403}$$
    introduces:
    - implies
    say: Phép tính thứ hai, mã chỉ có phạm vi đọc tài khoản, không có ghi thanh toán,
      nên gọi lệnh ghi bị từ chối bốn trăm lẻ ba.
  - show: $$③ \; \text{aud} = \text{api-a} \ne \text{api-b} \Rightarrow \hl{401}$$
    say: Phép tính thứ ba, mã cấp cho người nhận API A mang sang API B, người nhận
      không khớp, nên API B từ chối bốn trăm lẻ một.
  - show: '<p>Dùng lại exp = 1300 ở phép ①.</p>

      $$④ \; 1000 + 359 = 1359 \text{ nhỏ hơn } 1300 + 60 = 1360 \Rightarrow \hlg{200}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư dùng lại hạn một nghìn ba trăm. Ở giây thứ ba trăm năm mươi
      chín, bây giờ là một nghìn ba trăm năm mươi chín, còn nhỏ hơn hạn cộng lệch,
      nên còn nhận.
  - show: $$⑤ \; 1000 + 360 = 1360 \text{ không nhỏ hơn } 1360 \Rightarrow \hl{401}$$
    say: Phép tính thứ năm, chỉ một giây sau, bây giờ là một nghìn ba trăm sáu mươi,
      đã bằng hạn cộng lệch, nên mã bị từ chối bốn trăm lẻ một.
  - show: <table class='t'><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>def
      kiem(c, can, toi, bay_gio, lech=60):</code></td><td>định nghĩa hàm; tham số
      <code>lech</code> lấy 60 nếu người gọi không truyền</td></tr><tr><td><code>c["aud"]
      if isinstance(c["aud"], list) else [c["aud"]]</code></td><td>nếu <code>aud</code>
      đã là danh sách thì giữ, không thì bọc thành danh sách một phần tử</td></tr><tr><td><code>toi
      not in aud</code></td><td>tên mình không có trong danh sách</td></tr><tr><td><code>c["scope"].split("
      ")</code></td><td>cắt chuỗi ở mỗi dấu cách thành danh sách các quyền</td></tr></table>
    clear: true
    say: Mã Python sắp tới có vài cách viết mới, nên ta giải nghĩa trước. Hàm có một
      tham số lấy sáu mươi nếu không truyền, dòng người nhận bọc một tên thành danh
      sách, và phép cắt chuỗi ở dấu cách cho ra danh sách quyền.
  - show: '<p><b>Máy chủ tài nguyên kiểm mã (Python)</b></p><div class="code"><div>def
      kiem(c, can, toi, bay_gio, lech=60):</div><div>    # c: các trường của mã; chữ
      ký đã kiểm như bài 3</div><div>    aud = c["aud"] if isinstance(c["aud"], list)
      else [c["aud"]]</div><div>    if toi not in aud:</div><div>        return 401       #
      mã không cấp cho API này</div><div>    if bay_gio &gt;= c["exp"] + lech:</div><div>        return
      401       # hết hạn, đã cộng lệch đồng hồ</div><div>    if can not in c["scope"].split("
      "):</div><div>        return 403       # biết ai gọi, nhưng thiếu quyền</div><div>    return
      200</div></div>'
    focus:
    - - '2.3'
      - '2.4'
      - '2.5'
    - - '2.6'
      - '2.7'
    - - '2.8'
      - '2.9'
    clear: true
    say: Bây giờ viết thành mã Python, cửa đầu tìm tên mình trong người nhận, vì người
      nhận có thể là một tên hoặc một danh sách. Cửa hai từ chối khi đã tới hạn cộng
      lệch. Cửa ba tìm quyền cần trong danh sách phạm vi.
  - show: '<p><b>Năm ca thử</b></p><div class="code"><div>cap = 1000                        #
      giây cấp mã (iat)</div><div>doc = {"aud": "api-a", "exp": cap + 300, "scope":
      "accounts:read"}</div><div>ghi = {"aud": "api-a", "exp": cap + 300, "scope":
      "payments:write"}</div><div>print(kiem(doc, "payments:write", "api-a", cap +
      10))</div><div>print(kiem(ghi, "payments:write", "api-b", cap + 10))</div><div>print(kiem(ghi,
      "payments:write", "api-a", cap + 359))</div><div>print(kiem(ghi, "payments:write",
      "api-a", cap + 360))</div><div>idt = {"aud": "app-di-dong", "exp": cap + 300,
      "nonce": "n-0S6"}</div><div>print(kiem(idt, "payments:write", "api-a", cap +
      10))</div></div>'
    focus:
    - '2.4'
    - - '2.5'
      - '2.6'
      - '2.7'
    - - '2.8'
      - '2.9'
    clear: true
    say: Năm ca thử, mã chỉ đọc gọi lệnh ghi. Mã ghi mang sang API B, mã ghi ở giây
      ba trăm năm mươi chín, rồi ba trăm sáu mươi. Ca cuối là một mã định danh, người
      nhận là chính ứng dụng di động, bị đem đi gọi API A.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>403</div><div>401</div><div>200</div><div>401</div><div>401</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: 'Kết quả chạy thật, đúng thứ tự: bốn trăm lẻ ba, bốn trăm lẻ một, hai trăm,
      bốn trăm lẻ một, và bốn trăm lẻ một cho mã định danh. Bốn số đầu khớp các phép
      tính tay.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm từng giây'
  checks:
  - alg.bnx_ok_seconds(300, 60, 999) == 360
  - alg.bnx_last_ok_age(300, 60) == 359
  steps:
  - show: '<p><b>Đếm thẳng mọi giây từ 0 tới 999</b></p><div class="code"><div>nhan
      = [g for g in range(0, 1000)</div><div>        if kiem(ghi, "payments:write",
      "api-a", cap + g) == 200]</div><div>print(len(nhan), nhan[0], nhan[-1])</div></div><p
      class="note">Cách viết gọn: giữ lại những giây <code>g</code> từ 0 tới 999 mà
      <code>kiem</code> cho kết quả 200; <code>nhan[0]</code> và <code>nhan[-1]</code>
      là phần tử đầu và cuối.</p>'
    focus:
    - - 1
      - 2
    clear: true
    say: Kiểm bằng đường khác, thay vì tính giây biên, ta thử hết một nghìn giây kể
      từ lúc cấp, giữ lại những giây được nhận, rồi lấy phần tử đầu và cuối.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>360 0 359</div></div>
    focus:
    - 1
    - 2
    say: Vì mọi giây đều được thử, có đúng ba trăm sáu mươi giây được nhận, từ giây
      không tới giây ba trăm năm mươi chín. Vậy giây biên ở phép bốn và phép năm là
      đúng.
  - show: '<table class=''t''><tr><th>quy tắc so ở giây biên</th><th>giây 359</th><th>giây
      360</th></tr><tr><td>bài này: từ chối khi bây giờ ≥ exp + lệch (khớp RFC 7519
      và bài 3)</td><td>nhận</td><td>từ chối</td></tr><tr><td>cách cài đặt khác chỉ
      từ chối khi bây giờ &gt; exp + lệch</td><td>nhận</td><td>nhận (giây 361 mới
      từ chối)</td></tr></table>'
    clear: true
    say: Bài này từ chối ngay khi bây giờ bằng hạn cộng lệch, khớp RFC, còn một cách
      cài đặt khác chỉ từ chối khi lớn hơn. Hai cách khác nhau đúng một giây, nên
      hãy chạy thử đúng giây biên thay vì đoán.
- id: quymo
  kind: example
  title: 'Khi số máy khách tăng: số lần hỏi máy chủ ủy quyền'
  checks:
  - '[alg.bnx_token_issues(n) for n in (10, 1000, 100000)] == [140, 13360, 1333390]'
  - '[n * 3600 for n in (10, 1000, 100000)] == [36000, 3600000, 360000000]'
  - 100000 // 10 == 10000 and 1000 // 10 == 100 and round(360000000 / 1333390) ==
    270
  steps:
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>t
      = i % (ttl - som)</code></td><td><code>%</code> là phần dư của phép chia: <code>i</code>
      chia cho 270 dư bao nhiêu thì máy khách thứ <code>i</code> bắt đầu ở giây đó,
      nên các máy lệch nhau</td></tr><tr><td><code>while t &lt; gio:</code></td><td>lặp
      mãi khi <code>t</code> còn nhỏ hơn <code>gio</code></td></tr><tr><td><code>t
      += ttl - som</code></td><td>cộng thêm 270 vào <code>t</code>: tới lúc xin mã
      lần sau</td></tr></table>'
    clear: true
    say: Khối đo dùng vài cách viết, nên ta giải nghĩa trước. Dấu phần trăm cho phần
      dư của phép chia, nên mỗi máy khách bắt đầu ở một giây lệch nhau. Vòng lặp chạy
      khi đồng hồ còn nhỏ hơn một giờ, và mỗi lần xin đồng hồ nhích thêm hai trăm
      bảy mươi giây.
  - show: '<p><b>Mỗi máy khách giữ mã trong bộ đệm (chỗ giữ tạm để dùng lại), xin
      lại khi còn 30 giây hạn; ttl là thời gian sống của mã</b></p><div class="code"><div>def
      xin_ma(may_khach, ttl=300, som=30, gio=3600):</div><div>    dem = 0</div><div>    for
      i in range(may_khach):</div><div>        t = i % (ttl - som)       # mỗi máy
      khách bắt đầu lệch nhau</div><div>        while t &lt; gio:</div><div>            dem
      += 1              # một lần xin mã mới</div><div>            t += ttl - som        #
      xin lại khi còn 30 giây hạn</div><div>    return dem</div><div>for n in (10,
      1000, 100000):</div><div>    print(n, "may:", xin_ma(n), "xin ma/gio |", n *
      3600, "hoi lai")</div></div>'
    focus:
    - 0
    - '2.2'
    - '2.8'
    clear: true
    say: 'Hàm này mô phỏng một giờ: mỗi máy khách giữ mã trong bộ đệm, tức chỗ giữ
      tạm để dùng lại, và chỉ xin mã mới khi còn ba mươi giây hạn. Vì xin sớm ba mươi
      giây nên mỗi mã dùng được hai trăm bảy mươi giây. Ta so với cách hỏi lại máy
      chủ ủy quyền ở mỗi yêu cầu, mỗi máy một yêu cầu mỗi giây (số minh hoạ).'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>10 may: 140 xin ma/gio
      | 36000 hoi lai</div><div>1000 may: 13360 xin ma/gio | 3600000 hoi lai</div><div>100000
      may: 1333390 xin ma/gio | 360000000 hoi lai</div></div><table class=''t''><tr><th>số
      máy khách</th><th>xin mã mỗi giờ (kiểm tại chỗ)</th><th>hỏi lại mỗi yêu cầu</th></tr><tr><td>10</td><td>140</td><td>36
      000</td></tr><tr><td>1 000 (gấp 100 lần số máy)</td><td>13 360 (gần 95 lần)</td><td>3
      600 000</td></tr><tr><td>100 000 (gấp 10 000 lần số máy)</td><td>1 333 390 (gần
      9 520 lần)</td><td>360 000 000</td></tr></table>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Mười máy khách xin một trăm bốn mươi lần mỗi giờ. Gấp số máy lên một trăm
      lần thì số lần xin gần chín mươi lăm lần, vì các máy lệch pha, và gấp lên một
      vạn lần thì hơn một triệu ba trăm nghìn. Còn hỏi lại ở mỗi yêu cầu thì lên tới
      ba trăm sáu mươi triệu lần mỗi giờ, nhiều gấp khoảng hai trăm bảy mươi lần.
  - show: <table class='t'><tr><th>cách kiểm mã</th><th>được</th><th>mất</th><th>khi
      nào chọn</th></tr><tr><td>kiểm tại chỗ bằng chữ ký (bài này)</td><td>API không
      phải chờ máy chủ ủy quyền; tải hỏi máy chủ chỉ theo số lần xin mã</td><td>mã
      bị thu hồi vẫn dùng được tới khi hết hạn cộng lệch (tối đa 300 + 60 giây)</td><td>tải
      cao, chấp nhận khoảng hở ngắn</td></tr><tr><td>hỏi lại máy chủ ủy quyền ở mỗi
      yêu cầu</td><td>thu hồi có hiệu lực ngay</td><td>máy chủ ủy quyền thành nút
      cổ chai và điểm hỏng chung của mọi API</td><td>lệnh rất nhạy cảm, tải thấp</td></tr></table>
    clear: true
    say: Kiểm tại chỗ không phải chờ máy chủ ủy quyền, đổi lại mã bị thu hồi vẫn dùng
      được tới hết hạn. Hỏi lại ở mỗi yêu cầu thì thu hồi có hiệu lực ngay, nhưng
      máy chủ ủy quyền thành điểm hỏng chung, nên chỉ đáng dùng cho lệnh rất nhạy
      cảm.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 'alg.bnx_rs_check({''aud'': ''app-di-dong'', ''exp'': 1300}, ''payments:write'',
    ''api-a'', 1010) == 401'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Coi OAuth 2.0 là <b class="red">đăng
      nhập</b>. Mã truy cập dành cho API; ứng dụng không được dựa vào nó để biết ai
      đăng nhập.

      Đó là việc của OpenID Connect: mã định danh bắt buộc có <code>iss</code>, <code>sub</code>,
      <code>aud</code>, <code>exp</code>, <code>iat</code>; có <code>nonce</code>
      nếu ứng dụng đã gửi (OpenID Connect Core 1.0 mục 2).</div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới, là coi chuẩn ủy quyền là đăng nhập. Mã truy
      cập dành cho giao diện lập trình, ứng dụng không được dựa vào nó để biết ai
      đăng nhập. Đó là việc của chuẩn đăng nhập mở, qua mã định danh có người phát
      hành, chủ thể, người nhận, hạn dùng và lúc cấp.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> <b class="red">Dùng
      mã định danh để gọi API</b>. Người nhận của nó là chính ứng dụng (<code>app-di-dong</code>),
      nên API kiểm <code>aud</code> phải trả <b>401</b>, như ca cuối.

      <br><span class="note">API bỏ qua <code>aud</code> sẽ nhận nhầm. RFC 9068 thêm
      kiểu <code>at+jwt</code> để phân biệt mã truy cập với mã định danh.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là dùng mã định danh để gọi giao diện lập
      trình. Người nhận của nó là chính ứng dụng, nên API kiểm người nhận phải trả
      bốn trăm lẻ một, như ca cuối.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Đặt <b class="red">bí
      mật máy khách trong ứng dụng di động</b>. Ai tải ứng dụng cũng trích ra được
      (RFC 6749 mục 2.1).

      <br><span class="note">Cách chữa: ứng dụng là máy khách công khai, dùng mã ủy
      quyền có PKCE; bí mật chỉ nằm ở dịch vụ phía máy chủ.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, là đặt bí mật máy khách trong ứng dụng
      di động. Ai tải ứng dụng về cũng trích ra được. Cách chữa là coi ứng dụng là
      máy khách công khai, dùng mã ủy quyền có băm chuỗi bí mật, còn bí mật chỉ nằm
      ở dịch vụ phía máy chủ.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - 'alg.bnx_rs_check({''aud'': ''api-a'', ''exp'': 1300, ''scope'': ''accounts:read
    payments:write''}, ''payments:write'', ''api-a'', 1100) == 200'
  - 'alg.bnx_rs_check({''aud'': [''api-a'', ''api-b'', ''api-c'', ''api-d'', ''api-e''],
    ''exp'': 1300, ''scope'': ''payments:write''}, ''payments:write'', ''api-c'',
    1100) == 200'
  - alg.bnx_token_requests_per_hour(1, 300) == 12
  - alg.bnx_token_requests_per_hour(5, 300) == 60
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Mã
      có phạm vi <code>accounts:read payments:write</code>, aud <code>api-a</code>,
      cấp lúc 1000, hạn 300. Gọi <code>api-a</code> cần <code>payments:write</code>
      lúc 1100. Kết quả?</td></tr><tr><td>2</td><td>Chọn luồng: ứng dụng ngân hàng
      trên điện thoại khách, và dịch vụ đối soát chạy ban đêm trên máy chủ gọi API
      nội bộ. Mỗi chương trình dùng luồng nào, vì sao?</td></tr><tr><td>3</td><td>Quyết
      định (số minh hoạ): 5 API, mã hạn 300 giây. Một mã chung có aud cả 5 API, hay
      mỗi API một mã riêng?</td></tr></table>'
    pause: 25
    say: Đến lượt bạn, ba câu trên màn hình. Hãy dừng video và làm từng câu ra giấy.
  - show: '<p>Câu 1: aud đúng; 1100 &lt; 1300 + 60; phạm vi tách theo dấu cách có
      <code>payments:write</code>.</p>

      $$\Rightarrow \hlg{200}$$

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu một, người nhận đúng, giây một nghìn một trăm còn trong hạn, và
      tách phạm vi theo dấu cách thì có ghi thanh toán, nên kết quả là hai trăm.
    clear: true
  - show: <table class='t'><tr><th>chương trình</th><th>luồng</th><th>vì sao</th></tr><tr><td>ứng
      dụng trên điện thoại khách</td><td>mã ủy quyền kèm PKCE</td><td>điện thoại không
      cất được bí mật cố định; PKCE là chuỗi bí mật dùng một lần, chỉ máy gửi yêu
      cầu đầu mới có</td></tr><tr><td>dịch vụ đối soát ban đêm</td><td>thông tin máy
      khách</td><td>không có người dùng ngồi đó; bí mật cất ở máy chủ, nơi người ngoài
      không đọc được</td></tr></table>
    say: Đáp án câu hai, ứng dụng điện thoại dùng mã ủy quyền kèm chuỗi băm bí mật,
      vì điện thoại không cất được bí mật cố định. Dịch vụ đối soát ban đêm dùng thông
      tin máy khách, vì không có người dùng ngồi đó và bí mật được cất trên máy chủ.
    clear: true
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>một
      mã chung, aud là danh sách 5 API</td><td>xin mã 3600 : 300 = 12 lần mỗi giờ
      (xin đúng lúc hết hạn, bỏ qua xin sớm)</td><td>lộ mã thì cả 5 API bị dùng</td></tr><tr><td>mỗi
      API một mã riêng</td><td>lộ một mã chỉ hở 1 API; aud hẹp</td><td>xin mã $5 \cdot
      12 = 60$ lần mỗi giờ (cùng cách tính)</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    say: Đáp án câu ba, ta so theo số lần xin mã và vùng thiệt hại. Một mã chung có
      người nhận là danh sách năm tên, mỗi giờ chỉ xin mười hai lần nếu xin đúng lúc
      hết hạn, nhưng lộ mã là cả năm nơi bị dùng. Mỗi nơi một mã riêng thì lộ một
      mã chỉ hở một nơi, đổi lại mỗi giờ phải xin sáu mươi lần, nên chọn vùng thiệt
      hại nhỏ.
    clear: true
    introduces:
    - cdot
- id: practice
  kind: practice
  title: 'Tự làm: đếm số lần xin mã trong một giờ'
  steps:
  - show: '<p><b>Đề</b>: mã hạn <code>TTL = 120</code> giây, xin lại khi còn 20 giây,
      lệch đồng hồ 30 giây, 4 API (số minh hoạ). Viết <code>mau.py</code> mô phỏng
      một giờ:</p>

      <ol><li>một mã chung cho 4 API: đếm số lần xin mã</li><li>mỗi API một mã riêng:
      đếm số lần xin mã</li><li>giây cuối cùng một mã cấp lúc giây 0 còn được nhận</li></ol>

      <p>In ba dòng <code>Mot ma chung: … lan xin ma</code>, <code>Moi API mot ma:
      … lan xin ma</code>, <code>Giay cuoi cung ma con duoc nhan: …</code>.</p>

      '
    focus:
    - 1
    - - 2
      - 3
    pause: 120
    say: 'Bây giờ tới phần bạn tự làm: mã hạn một trăm hai mươi giây, xin lại khi
      còn hai mươi giây, lệch ba mươi giây, bốn giao diện lập trình. Viết chương trình
      đếm số lần xin mã trong một giờ cho hai cách, rồi tìm giây cuối còn nhận, hãy
      dừng video và tự viết.'
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>Mot ma chung: 36 lan
      xin ma</div><div>Moi API mot ma: 144 lan xin ma</div><div>Giay cuoi cung ma
      con duoc nhan: 149</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh BNX L04 mau.py</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> mỗi mã dùng được <code>TTL - 20</code>
      = 100 giây, nên một vòng <code>while</code> cộng 100 vào đồng hồ sau mỗi lần
      xin. Giây cuối còn nhận là giây lớn nhất nhỏ hơn <code>TTL + LECH</code>.

      Lời giải ở <code>labs/BNX/L04/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, mỗi mã dùng được một trăm giây, nên mỗi vòng lặp cộng một trăm vào
      đồng hồ. Giây cuối còn nhận là giây lớn nhất vẫn nhỏ hơn hạn cộng lệch. Lời
      giải nằm trong thư mục thực hành, chỉ mở sau khi đã tự thử.
    clear: true
  lab: labs/BNX/L04
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>máy chủ ủy quyền cấp mã</span><span
      class=''a''>→</span><span class=''n''>ứng dụng: mã ủy quyền + PKCE</span><span
      class=''a''>→</span><span class=''n''>dịch vụ: thông tin máy khách</span><span
      class=''a''>→</span><span class=''n''>API kiểm aud, hạn, phạm vi</span><span
      class=''a''>→</span><span class=''n''>401 hay 403</span></div>'
    say: Máy chủ ủy quyền cấp mã, ứng dụng di động dùng mã ủy quyền có băm chuỗi bí
      mật, còn dịch vụ gọi dịch vụ dùng thông tin máy khách. Giao diện lập trình kiểm
      người nhận, hạn và phạm vi, rồi trả bốn trăm lẻ một hoặc ba.
  - show: '<div class=''box key''><b>Tư duy:</b> tách “ai cấp” khỏi “ai kiểm”, và
      cho mỗi mã <b>ít quyền nhất, ít nơi nhận nhất, hạn ngắn nhất</b> đủ dùng.

      Mã định danh để biết ai đăng nhập; mã truy cập để gọi API.</div>

      '
    say: Điều cần mang theo, tách ai cấp khỏi ai kiểm, và cho mỗi mã ít quyền nhất,
      ít nơi nhận nhất, hạn ngắn nhất mà vẫn đủ dùng. Mã định danh để biết ai đăng
      nhập, mã truy cập để gọi giao diện.
  - show: '<p>Bài sau: khi các dịch vụ gọi nhau, <b>máy</b> cũng phải chứng minh mình
      là ai: hai bên cùng trình chứng chỉ.</p>'
    forward_ref: true
    say: Ở bài năm, ta xem khi các dịch vụ gọi nhau, chính máy cũng phải chứng minh
      mình là ai, bằng cách hai bên cùng trình chứng chỉ.
