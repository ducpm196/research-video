      sau mỗi lần sửa</td><td>không biết cổng thật có trả lời như ta dặn</td></tr><tr><td>100
      ca gọi cổng thử thật</td><td>100 × 2 000 = 200 000 mili giây</td><td>kiểm được
      cả cổng</td><td>chậm 200 lần; mạng rớt thì ca trượt oan</td></tr><tr><td>90
      giả + 10 thật</td><td>90 × 10 + 10 × 2 000 = 20 900 mili giây</td><td>phần xử
