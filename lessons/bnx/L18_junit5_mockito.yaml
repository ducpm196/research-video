      đã sửa. Chuyển 20 000 000 đồng từ TK01: lệnh kiểm tương tác phải đòi cổng được
      gọi mấy lần, với số tiền nào?</td></tr><tr><td>3</td><td>Quyết định (số minh
      hoạ): 100 ca kiểm. Ca dùng đối tượng giả chạy 10 mili giây, ca gọi cổng thử
      thật chạy 2 000 mili giây. Toàn giả, toàn thật, hay 90 giả + 10 thật?</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, theo đề thì phí của ba số tiền
      trên màn hình là bao nhiêu, với mã còn lỗi thì ca nào trượt? Câu hai, chuyển
      hai mươi triệu thì cổng được gọi mấy lần? Câu ba, chọn cách nào cho một trăm
      ca? Hãy tạm dừng và làm ra giấy.
  - show: '<p>Câu 1: 499 999 dưới mốc 500 000; hai số kia nằm từ 500 000 tới dưới
      10 000 000.</p>

      $$499\,999 \to \hlg{0}; \quad 500\,000 \to \hlg{5000}; \quad 9\,999\,999 \to
      \hlg{5000}$$

      <p>Mã còn lỗi cũng trả đúng ba giá trị này: <b>không ca nào trượt</b>. Chỉ ca
      ở đúng 10 000 000 mới bắt được lỗi.</p>

      '
    focus:
    - - 1
      - 2
    - 3
    say: Đáp án câu một, số thứ nhất dưới mốc nên phí bằng không, hai số kia nằm giữa
      hai mốc nên phí năm nghìn. Mã còn lỗi cũng trả đúng ba giá trị này, nên chỉ
      ca ở đúng mười triệu bắt được lỗi.
    clear: true
  - show: '<p>Câu 2: 20 000 000 từ mốc 10 000 000 trở lên nên phí 5 500.</p>

      $$20\,000\,000 + 5\,500 = \hlg{20\,005\,500}; \quad \text{đúng } \hlg{1} \text{
      lần}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu hai, hai mươi triệu từ mốc mười triệu trở lên nên phí năm nghìn
      năm trăm. Lệnh kiểm tương tác đòi cổng gọi đúng một lần, với hai mươi triệu
