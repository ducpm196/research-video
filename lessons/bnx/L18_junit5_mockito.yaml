    clear: true
    say: Hình này cho thấy một ca kiểm chỉ gồm ba việc. Việc một là sắp đặt đầu vào,
      ở đây là số tiền mười triệu đồng. Việc hai là gọi hàm tính phí và nhận về giá
      trị thực tế là năm nghìn. Việc ba là so với giá trị mong đợi lấy từ đề bài là
      năm nghìn năm trăm, và vì hai số khác nhau nên ca trượt.
