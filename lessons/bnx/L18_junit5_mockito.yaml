  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>long[]
      ghi = new long[2];</code></td><td><code>long[]</code>: mảng số nguyên lớn; <code>new
      long[2]</code> tạo mảng 2 ô, ban đầu đều 0; <code>ghi[0]</code> là ô đầu, <code>ghi[1]</code>
      là ô sau</td><td>ghi[0] đếm lần gọi, ghi[1] giữ số tiền</td></tr><tr><td><code>()
      -&gt; { … }</code>, <code>x -&gt; x + 1</code></td><td>hàm ngắn không tên: bên
      trái mũi tên là tham số, bên phải là việc làm; <code>()</code>: không tham số</td><td><code>(tk,
      soTien) -&gt; { ghi[0]++; ghi[1] = soTien; return true; }</code>: cổng giả viết
      tay</td></tr><tr><td><code>ghi[0]++;</code></td><td><code>++</code>:
      tăng giá trị biến lên thêm 1 sau mỗi lần gọi</td><td><code>ghi[0]++</code>:
      tăng số lần gọi thêm 1</td></tr></table>'
    clear: true
    say: 'Mảng hai ô số nguyên lớn lúc đầu đều bằng không, đánh số từ không. Hàm ngắn
      không tên: tham số bên trái mũi tên, việc làm bên phải. Hai dấu cộng sau tên
      biến tăng biến đó thêm một, nên mỗi lần gọi đếm thêm một.'
  - show: '<p><b>Đường khác: tự viết đối tượng giả bằng Java thuần</b></p><div class="code"><div>public
      class Main {</div><div>    public static void main(String[] a) {</div><div>        long[]
      ghi = new long[2];       // [số lần gọi, số tiền]</div><div>        CongThanhToan
      gia = (tk, soTien) -&gt; {    // giả viết tay</div><div>            ghi[0]++;
      ghi[1] = soTien;</div><div>            return true;</div><div>        };</div><div>        long
      phi = new ChuyenTien(gia).chuyen("TK01", 2_000_000);</div><div>        System.out.println(phi
      + " " + ghi[0] + " " + ghi[1]);</div><div>    }</div><div>}</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>5000 1 2005000</div></div>'
    focus:
    - 1
    - 3
    clear: true
