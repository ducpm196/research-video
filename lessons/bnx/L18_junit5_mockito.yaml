scenes:
- id: hook
  kind: hook
  title: Một dấu bằng thừa, mỗi giao dịch thu thiếu 500 đồng
  checks:
  - alg.bnx_jt_fee(10_000_000) == 5500
  - alg.bnx_jt_fee(10_000_000, True) == 5000
  - alg.bnx_jt_fee(10_000_000) - alg.bnx_jt_fee(10_000_000, True) == 500
  - 20_000 * (alg.bnx_jt_fee(10_000_000) - alg.bnx_jt_fee(10_000_000, True)) == 10_000_000
  steps:
  - show: '<p>Ngân hàng tính phí chuyển tiền (số minh hoạ): từ <b>10 000 000</b> đồng
      trở lên thu <b>5 500</b> đồng.

      Lập trình viên viết nhầm <code>&lt;=</code> thay cho <code>&lt;</code>, nên
      khách chuyển <b>đúng 10 000 000</b> chỉ bị thu <b>5 000</b>.</p>

      <div class="box key">Mỗi giao dịch thu thiếu 5 500 − 5 000 = <b>500</b> đồng.
      Với 20 000 giao dịch đúng mốc mỗi tháng (số minh hoạ): 20 000 × 500 = <b>10
      000 000</b> đồng.

      Thử tay ba số tiền bất kỳ đều thấy đúng. Làm sao để máy tự bắt lỗi này trước
      khi lên chạy thật?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: 'Chào bạn, ngân hàng tính phí chuyển tiền bằng số minh hoạ: từ mười triệu
      đồng trở lên thì thu năm nghìn năm trăm đồng. Lập trình viên viết nhầm một dấu
      so sánh, nên khách chuyển đúng mười triệu chỉ bị thu năm nghìn đồng. Mỗi giao
      dịch thu thiếu năm trăm đồng, nên hai mươi nghìn giao dịch đúng mốc mỗi tháng
      làm thu thiếu mười triệu đồng. Thử tay ba số tiền bất kỳ đều thấy đúng, vậy
      làm sao để máy tự bắt lỗi này trước khi lên chạy thật?'
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>viết
      ca kiểm tự động thế nào, đọc bản báo ra sao</td><td>JUnit 5: mỗi nhánh một ca,
      thêm ca ở mốc biên; bản báo ghi mong đợi và thực nhận</td></tr><tr><td>hàm gọi
      ra cổng thanh toán thì kiểm sao</td><td>Mockito: thay cổng bằng đối tượng giả,
      rồi kiểm lời gọi đúng số lần, đúng tham số</td></tr><tr><td>vì sao có ca lúc
      đạt lúc trượt</td><td>ca phụ thuộc đồng hồ thật, mạng hay thứ tự chạy</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Hôm nay ta trả lời ba câu hỏi về kiểm thử tự động trong Java, nơi ca kiểm
      là một đoạn mã nhỏ chạy hàm cần kiểm rồi so kết quả với giá trị mong đợi. Thứ
      nhất, viết ca kiểm tự động thế nào và đọc bản báo ca trượt ra sao. Thứ hai,
      khi hàm gọi ra cổng thanh toán bên ngoài thì kiểm bằng cách nào. Thứ ba, vì
      sao có những ca kiểm lúc đạt lúc trượt.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_jt_fee_branches() == 3
  - alg.bnx_jt_fee(2_000_000) == 5000
  - 2_000_000 + alg.bnx_jt_fee(2_000_000) == 2_005_000
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      nhánh của một hàm</td><td>mỗi câu <code>if</code> rẽ hàm thành các đường đi
      khác nhau; mỗi đường đi là một nhánh</td><td>2 mốc so sánh cắt trục số tiền
      thành 3 khoảng, tức 3 nhánh</td></tr><tr><td>② giao diện (<code>interface</code>)</td><td>bản
      kê tên các hàm, chưa có thân hàm; lớp nào viết đủ các hàm đó thì dùng thay cho
      nhau được</td><td><code>CongThanhToan</code> có một hàm <code>chuyen</code></td></tr><tr><td>③
      phần phụ thuộc bên ngoài</td><td>thứ mã của ta gọi tới nhưng không do ta điều
      khiển</td><td>cổng thanh toán, cơ sở dữ liệu, đồng hồ, mạng</td></tr><tr><td>④
      ngoại lệ (<code>exception</code>)</td><td>cách một hàm báo lỗi: dừng ngay và
      ném lỗi ra cho nơi gọi</td><td>cổng từ chối thì ném <code>IllegalStateException</code></td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều sẽ dùng trong cả bài. Thứ nhất, mỗi câu điều
      kiện rẽ hàm thành các đường đi khác nhau, mỗi đường đi gọi là một nhánh. Thứ
      hai, giao diện là bản kê tên các hàm mà chưa có thân hàm, nên lớp nào viết đủ
      các hàm đó thì dùng thay cho nhau được. Thứ ba, phần phụ thuộc bên ngoài là
      thứ mã của ta gọi tới nhưng không điều khiển được, như cổng thanh toán hay đồng
      hồ. Thứ tư, ngoại lệ là cách một hàm báo lỗi, vì nó dừng ngay và ném lỗi ra
      cho nơi gọi.
  - show: '<p>Làm thử: theo đề, chuyển 2 000 000 đồng thì phí 5 000 đồng, nên số tiền
      trừ ở cổng là</p>

      $$2\,000\,000 + 5\,000 = \hl{2\,005\,000}\ \text{đồng}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Làm thử ngay với đề phí của bài. Chuyển hai triệu đồng thì phí là năm nghìn
      đồng, vì hai triệu nằm giữa hai mốc. Vậy số tiền mà cổng thanh toán phải trừ
      là hai triệu không trăm linh năm nghìn đồng.
- id: sym
  kind: symbol
  title: Giải mã các từ của JUnit 5 và Mockito
  checks:
  - alg.bnx_jt_transfer(2_000_000, accept=False)[0] == 'lỗi'
  - len(alg.bnx_jt_transfer(2_000_000)[1]) == 1
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>JUnit
      5</td><td>bộ khung kiểm thử của Java: tìm các ca kiểm, chạy từng ca, in bản
      báo</td></tr><tr><td><code>@Test</code></td><td>nhãn gắn trước một hàm để báo:
      đây là một ca kiểm</td></tr><tr><td><code>assertEquals(mong đợi, thực tế)</code></td><td>so
      hai giá trị; khác nhau thì ca <b>trượt</b> và bản báo ghi cả hai</td></tr><tr><td><code>assertThrows(loại
      lỗi, đoạn mã)</code></td><td>ca chỉ đạt khi đoạn mã ném đúng loại lỗi đó</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bảng này giải mã các từ của bộ khung kiểm thử, tên gốc hiện trên màn hình.
      Bộ khung tìm các ca kiểm, chạy từng ca, rồi in bản báo. Nhãn a còng đặt trước
      một hàm để báo với bộ khung rằng hàm đó là một ca kiểm. Lệnh so bằng nhận giá
      trị mong đợi trước, giá trị thực tế sau, và nếu hai giá trị khác nhau thì ca
      trượt. Lệnh chờ lỗi thì ngược lại, vì ca chỉ đạt khi đoạn mã bên trong ném đúng
      loại lỗi đã nêu.
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>Mockito</td><td>thư
      viện tạo <b>đối tượng giả</b> (mock) từ một giao diện hay một lớp</td></tr><tr><td><code>mock(X.class)</code></td><td>tạo
      đối tượng giả của X: có đủ các hàm của X nhưng không làm gì, chỉ <b>ghi lại</b>
      mọi lời gọi</td></tr><tr><td><code>when(lời gọi).thenReturn(giá trị)</code></td><td>dặn
      trước: gặp đúng lời gọi này thì trả giá trị này; chưa dặn thì trả giá trị mặc
      định (<code>false</code>, 0, <code>null</code>)</td></tr><tr><td><code>verify(giả,
      times(1)).hàm(tham số)</code></td><td>kiểm tương tác: lời gọi này đã xảy ra
      đúng 1 lần, đúng tham số; <code>times(1)</code> là mặc định</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    clear: true
    say: Bảng thứ hai là các từ của thư viện tạo đối tượng giả. Đối tượng giả có đủ
      các hàm của giao diện, nhưng không làm gì cả, chỉ ghi lại mọi lời gọi. Lệnh
      tạo nhận tên giao diện và trả về một đối tượng giả của giao diện đó. Lệnh dặn
      trước nói rằng gặp đúng lời gọi này thì trả giá trị này, còn chưa dặn thì đối
      tượng giả trả giá trị mặc định, ví dụ sai. Lệnh kiểm tương tác hỏi lại đối tượng
      giả, vì ta cần biết lời gọi đã xảy ra đúng một lần với đúng tham số hay chưa.
