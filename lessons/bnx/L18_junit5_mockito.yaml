  - '[alg.bnx_jt_fee(a) for a in (200_000, 2_000_000, 50_000_000)] == [0, 5000, 5500]'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>public
      class Ten { … }</code></td><td>khai một <b>lớp</b>: khối chứa các hàm và dữ
      liệu của chương trình; <code>public</code>: nơi khác dùng được; phần thân nằm
      giữa cặp ngoặc nhọn</td><td><code>class Phi { … }</code></td></tr><tr><td><code>public
      static kiểu tên(kiểu a, kiểu b)</code></td><td>khai một hàm: <b>kiểu trả về</b>
      (<code>void</code> là không trả gì), <b>tên</b>, rồi <b>tham số</b> trong ngoặc
      tròn, mỗi tham số là kiểu rồi tên; <code>static</code>: thuộc cả lớp</td><td><code>static
      long tinh(long soTien)</code>: trả về số nguyên lớn, nhận một số tiền</td></tr><tr><td><code>if
      (soTien &lt; 500_000) return 0;</code></td><td>nếu điều kiện đúng thì trả về
      giá trị đó và hàm dừng ngay; gạch dưới trong số chỉ để dễ đọc</td><td>200_000
      là 200000, nên trả 0</td></tr></table>'
    clear: true
    say: Lớp là khối chứa các hàm và dữ liệu, nằm giữa cặp ngoặc nhọn. Khai hàm gồm
      kiểu trả về, tên, rồi các tham số. Nếu điều kiện đúng thì hàm trả về ngay, gạch
      dưới chỉ để dễ đọc số.
  - show: '<p><b>Phi.java: hàm tính phí, còn một lỗi ở dấu so sánh</b></p><div class="code"><div>class
      Phi {</div><div>    // Phí chuyển tiền (số minh hoạ). Đề bài:</div><div>    //   dưới
      500 000 đồng: miễn phí</div><div>    //   từ 500 000 tới dưới 10 000 000: phí
      5 000</div><div>    //   từ 10 000 000 trở lên: phí 5 500</div><div>    static
      long tinh(long soTien) {</div><div>        if (soTien &lt; 500_000) return 0;</div><div>        if
      (soTien &lt;= 10_000_000) return 5_000;</div><div>        return 5_500;</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Hàm tính phí viết bằng Java, kèm đề bài ở phần chú thích. Câu điều kiện thứ
      hai viết nhỏ hơn hoặc bằng mười triệu, và đó là chỗ sai so với đề.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>import
      static … .assertEquals;</code></td><td>nhập sẵn một hàm tĩnh để gọi bằng tên
      ngắn, khỏi viết tên lớp phía trước</td><td><code>import static org.junit…Assertions.assertEquals;</code>:
      viết <code>assertEquals(…)</code> thẳng</td></tr><tr><td><code>@Test void mienPhi()
      { … }</code></td><td><code>@Test</code> báo đây là một ca kiểm; <code>void</code>:
      hàm không trả gì; thân hàm giữa cặp ngoặc nhọn</td><td>mỗi ca là một hàm</td></tr></table>'
    clear: true
    say: Câu nhập tĩnh lấy sẵn một hàm để gọi bằng tên ngắn. Nhãn báo đây là một ca
      kiểm, và hàm không trả gì.
  - show: '<p><b>PhiTest.java: bốn ca kiểm viết bằng JUnit 5</b></p><div class="code"><div>import
      static org.junit.jupiter.api.Assertions.assertEquals;</div><div>import org.junit.jupiter.api.Test;</div><div>
      </div><div>class PhiTest {</div><div>    @Test void mienPhi() { assertEquals(0,
      Phi.tinh(200_000)); }</div><div>    @Test void phiVua() { assertEquals(5000,
      Phi.tinh(2_000_000)); }</div><div>    @Test void phiCao() { assertEquals(5500,
      Phi.tinh(50_000_000)); }</div><div>    @Test void bien() { assertEquals(5500,
      Phi.tinh(10_000_000)); }</div><div>}</div></div>$$① \; \text{2 mốc} \Rightarrow
      2 + 1 = \hl{3}\ \text{nhánh} \Rightarrow \text{ít nhất 3 ca kiểm}$$'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Lớp kiểm thử có bốn ca, phép tính thứ nhất, hai mốc cho ba nhánh nên cần
      ít nhất ba ca. Ba ca đầu ở giữa các khoảng, ca thứ tư ở đúng mốc mười triệu.
  - show: '<table class=''t''><tr><th>viết trong mã hoặc lệnh</th><th>nghĩa</th></tr><tr><td><code>javac
      … -d out</code></td><td>ghi các tệp đã biên dịch vào thư mục <code>out</code></td></tr><tr><td><code>execute
      --class-path out --select-class PhiTest</code></td><td>chạy bộ kiểm thử: tìm
      lớp trong <code>out</code>, chọn lớp <code>PhiTest</code></td></tr><tr><td><code>--disable-banner
      --disable-ansi-colors --details-theme ascii</code>; <code>--details summary</code></td><td>chỉ
      chỉnh cách in: bỏ biểu ngữ, bỏ màu, vẽ cây bằng ký tự thường; <code>summary</code>
      chỉ in tóm tắt</td></tr></table>'
    clear: true
    say: Trước khi chạy, ta cần vài chỗ, biên dịch ghi ra thư mục out, còn các cờ
      dài chỉ chỉnh cách in.
  - show: '<p><b>Biên dịch rồi chạy bằng JUnit Platform (thư viện nằm trong thư mục
      lib)</b></p><div class="code"><div>javac -encoding UTF-8 -cp "lib/*" -d out
