      giả + 10 thật</td><td>90 × 10 + 10 × 2 000 = 20 900 mili giây</td><td>phần xử
      lý kiểm nhanh, vẫn có ca canh cổng</td><td>phải nuôi hai loại ca, ca thật chạy
      riêng</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án câu ba, không có lựa chọn nào chỉ toàn được. Toàn giả thì một lượt
      mất một nghìn mili giây nhưng không biết cổng thật. Toàn thật thì chậm gấp hai
      trăm lần và mạng rớt thì trượt oan. Chín mươi giả cộng mười thật mất hai mươi
