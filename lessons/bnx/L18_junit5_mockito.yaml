  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>interface
      CongThanhToan { boolean chuyen(String tk, long soTien); }</code></td><td>giao
      diện: chỉ kê tên và tham số của hàm, chưa có thân; <code>boolean</code>: trả
      về đúng hoặc sai</td><td></td></tr><tr><td><code>static final int NGUONG = 1000;</code>,
      <code>final int tu, den;</code></td><td><code>final</code>: gán giá trị một
      lần rồi không đổi; <code>static</code>: một bản chung cho cả lớp, không có thì
      mỗi đối tượng một bản riêng</td><td><code>private final CongThanhToan cong;</code></td></tr></table>'
    clear: true
    say: Giao diện chỉ kê tên hàm mà chưa có thân hàm, và hàm này trả về đúng hoặc
      sai. Chữ riêng tư là chỉ lớp này dùng được, chữ cuối cùng là gán một lần.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>ChiaDoi(int
      tu, int den) { this.tu = tu; … }</code></td><td><b>hàm tạo</b>: cùng tên lớp,
      không có kiểu trả về, chạy khi <code>new</code>; <code>this.tu = tu</code>:
      chép tham số vào trường của chính đối tượng này</td><td><code>ChuyenTien(CongThanhToan
      cong) { this.cong = cong; }</code></td></tr><tr><td><code>throw new IllegalStateException("…");</code></td><td>ném
      lỗi: tạo một đối tượng lỗi mới rồi ném đi; việc đang làm dừng, nhảy tới nơi
      bắt lỗi</td><td><code>throw new IllegalStateException("cổng từ chối");</code></td></tr></table>'
    clear: true
    say: Hàm tạo cùng tên lớp, chạy khi tạo mới, chép tham số vào trường. Câu này
      ném một đối tượng lỗi, việc đang làm dừng và nhảy tới nơi bắt lỗi.
  - show: '<p><b>ChuyenTien.java: dịch vụ gọi ra cổng thanh toán qua một giao diện</b></p><div
      class="code"><div>interface CongThanhToan { boolean chuyen(String tk, long soTien);
      }</div><div> </div><div>class ChuyenTien {</div><div>    private final CongThanhToan
      cong;</div><div>    ChuyenTien(CongThanhToan cong) { this.cong = cong; }</div><div>    long
      chuyen(String tk, long soTien) {</div><div>        long phi = Phi.tinh(soTien);</div><div>        if
      (!cong.chuyen(tk, soTien + phi))</div><div>            throw new IllegalStateException("cổng
      từ chối");</div><div>        return phi;</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Dịch vụ chuyển tiền nhận cổng qua giao diện và hàm tạo. Nó tính phí rồi gọi
      cổng với số tiền cộng phí, ném lỗi nếu cổng từ chối.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>new
      Kiểu(…)</code>, <code>new int[] {3, 4}</code></td><td><code>new</code>: tạo
      mới; <code>new Kiểu(…)</code> tạo một đối tượng; <code>new int[] {3, 4}</code>
