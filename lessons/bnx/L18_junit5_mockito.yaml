scenes:
- id: hook
  kind: hook
  title: Một dấu bằng thừa, mỗi giao dịch thu thiếu 500 đồng
  checks:
  - alg.bnx_jt_fee(10_000_000) == 5500
  - alg.bnx_jt_fee(10_000_000, True) == 5000
  - alg.bnx_jt_fee(10_000_000) - alg.bnx_jt_fee(10_000_000, True) == 500
  - 20_000 * (alg.bnx_jt_fee(10_000_000) - alg.bnx_jt_fee(10_000_000, True)) == 10_000_000
  steps:
  - show: '<p>Ngân hàng tính phí chuyển tiền (số minh hoạ): từ <b>10 000 000</b> đồng
      trở lên thu <b>5 500</b> đồng.

      Lập trình viên viết nhầm <code>&lt;=</code> thay cho <code>&lt;</code>, nên
      khách chuyển <b>đúng 10 000 000</b> chỉ bị thu <b>5 000</b>.</p>

      <div class="box key">Mỗi giao dịch thu thiếu 5 500 − 5 000 = <b>500</b> đồng.
      Với 20 000 giao dịch đúng mốc mỗi tháng (số minh hoạ): 20 000 × 500 = <b>10
      000 000</b> đồng.

      Thử tay ba số tiền bất kỳ đều thấy đúng. Làm sao để máy tự bắt lỗi này trước
      khi lên chạy thật?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: 'Chào bạn, ngân hàng tính phí chuyển tiền bằng số minh hoạ: từ mười triệu
      đồng trở lên thu năm nghìn năm trăm đồng. Lập trình viên viết nhầm một dấu so
      sánh, nên khách chuyển đúng mười triệu chỉ bị thu năm nghìn. Hai mươi nghìn
      giao dịch đúng mốc mỗi tháng thiếu mười triệu đồng. Thử tay ba số đều đúng,
      vậy làm sao để máy tự bắt lỗi?'
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_jt_fee_branches() == 3
  - alg.bnx_jt_fee(2_000_000) == 5000
  - 2_000_000 + alg.bnx_jt_fee(2_000_000) == 2_005_000
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      nhánh của một hàm</td><td>mỗi câu <code>if</code> rẽ hàm thành các đường đi
      khác nhau; mỗi đường đi là một nhánh</td><td>2 mốc so sánh cắt trục số tiền
      thành 3 khoảng, tức 3 nhánh</td></tr><tr><td>② giao diện (<code>interface</code>)</td><td>bản
      kê tên các hàm, chưa có thân hàm; lớp nào viết đủ các hàm đó thì dùng thay cho
      nhau được</td><td><code>CongThanhToan</code> có một hàm <code>chuyen</code></td></tr><tr><td>③
      phần phụ thuộc bên ngoài</td><td>thứ mã của ta gọi tới nhưng không do ta điều
      khiển</td><td>cổng thanh toán, cơ sở dữ liệu, đồng hồ, mạng</td></tr><tr><td>④
      ngoại lệ (<code>exception</code>)</td><td>cách một hàm báo lỗi: dừng ngay và
      ném lỗi ra cho nơi gọi</td><td>cổng từ chối thì ném <code>IllegalStateException</code></td></tr></table>'
    introduces:
    - bnx_ngoai_le
    say: Trước hết ta cần hiểu bốn điều, câu điều kiện rẽ hàm thành các nhánh. Giao
      diện là bản kê tên các hàm chưa có thân hàm, nên lớp nào viết đủ các hàm đó
      thì dùng thay nhau được. Phần phụ thuộc bên ngoài là thứ mã gọi tới mà không
      điều khiển được, như cổng thanh toán hay đồng hồ. Ngoại lệ là cách một hàm báo
      lỗi.
  - show: '<p>Làm thử: theo đề, chuyển 2 000 000 đồng thì phí 5 000 đồng, nên số tiền
      trừ ở cổng là</p>

      $$2\,000\,000 + 5\,000 = \hl{2\,005\,000}\ \text{đồng}$$

      '
    focus:
    - 1
    - 2
    say: Làm thử với đề phí của bài. Chuyển hai triệu đồng thì phí là năm nghìn, vì
      hai triệu nằm giữa hai mốc, nên cổng thanh toán phải trừ hai triệu không trăm
      linh năm nghìn đồng.
- id: sym
  kind: symbol
  title: Giải mã các từ của JUnit 5 và Mockito
  checks:
  - alg.bnx_jt_transfer(2_000_000, accept=False)[0] == 'lỗi'
  - len(alg.bnx_jt_transfer(2_000_000)[1]) == 1
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>JUnit
      5</td><td>bộ khung kiểm thử của Java: tìm các ca kiểm, chạy từng ca, in bản
      báo</td></tr><tr><td><code>@Test</code></td><td>nhãn (annotation) gắn trước
      một hàm để báo: đây là một ca kiểm</td></tr><tr><td><code>assertEquals(mong
      đợi, thực tế)</code></td><td>so hai giá trị; khác nhau thì ca <b>trượt</b> và
      bản báo ghi cả hai</td></tr><tr><td><code>assertThrows(loại lỗi, đoạn mã)</code></td><td>ca
      chỉ đạt khi đoạn mã ném đúng loại lỗi đó</td></tr></table>'
    introduces:
    - bnx_junit
    clear: true
    say: Bảng này giải mã các từ của bộ khung kiểm thử. Bộ khung chạy từng ca rồi
      in bản báo, và nhãn đặt trước một hàm báo đó là một ca kiểm. Lệnh so bằng nhận
      mong đợi trước, thực tế sau, khác nhau thì ca trượt. Lệnh chờ lỗi chỉ đạt khi
      đoạn mã ném đúng loại lỗi.
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>Mockito</td><td>thư
      viện tạo <b>đối tượng giả</b> (mock) từ một giao diện hay một lớp</td></tr><tr><td><code>mock(X.class)</code></td><td>tạo
      đối tượng giả của X: có đủ các hàm của X nhưng không làm gì, chỉ <b>ghi lại</b>
      mọi lời gọi</td></tr><tr><td><code>when(lời gọi).thenReturn(giá trị)</code></td><td>dặn
      trước: gặp đúng lời gọi này thì trả giá trị này; chưa dặn thì trả giá trị mặc
      định (<code>false</code>, 0, <code>null</code>)</td></tr><tr><td><code>verify(giả,
      times(1)).hàm(tham số)</code></td><td>kiểm tương tác: lời gọi này đã xảy ra
      đúng 1 lần, đúng tham số</td></tr></table>'
    introduces:
    - bnx_mockito
    clear: true
    say: Bảng thứ hai là thư viện đối tượng giả, nó chỉ ghi lại mọi lời gọi. Lệnh
      dặn trước nói gặp lời gọi này thì trả giá trị này, chưa dặn thì trả mặc định
      là sai. Lệnh kiểm tương tác hỏi lời gọi đã xảy ra đúng một lần chưa.
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td><code>static</code></td><td>hàm
      hay biến thuộc về cả lớp, gọi không cần tạo đối tượng: <code>Phi.tinh(…)</code></td></tr><tr><td><code>x
      -&gt; …</code> (lambda)</td><td>một hàm nhỏ không tên viết tại chỗ, dùng làm
      cổng giả hay đoạn mã truyền vào</td></tr><tr><td><code>Instant.parse("…+07:00")</code>,
      <code>Clock.fixed</code></td><td>một thời điểm (giờ cộng 7 so với giờ gốc) /
      đồng hồ đứng yên tại thời điểm đó</td></tr><tr><td><code>Arrays.binarySearch</code>,
      hàm tạo</td><td>tìm một số trong dãy đã sắp xếp (không thấy thì trả số âm);
      hàm tạo là hàm tên trùng lớp, chạy khi tạo đối tượng</td></tr></table>'
    introduces:
    - bnx_binary_search
    clear: true
    say: 'Bảng này giải mã vài chữ Java sẽ gặp: hàm của cả lớp, hàm nhỏ không tên,
      đồng hồ đứng yên, và tìm trong dãy đã sắp xếp.'
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td><code>javac</code>,
      biên dịch; <code>java</code></td><td><code>javac</code> dịch tệp nguồn <code>.java</code>
      thành tệp Java chạy được (biên dịch); <code>java</code> chạy tệp đó</td></tr><tr><td>Maven
      Central</td><td>kho thư viện Java công khai trên mạng; ta tải tệp <code>.jar</code>
      (thư viện đóng gói) từ đó</td></tr><tr><td><code>int</code>, <code>long</code>,
      <code>long[]</code></td><td>số nguyên thường, số nguyên dài, mảng số nguyên
      dài; phần tử thứ i viết <code>a[i]</code>, đếm từ 0</td></tr><tr><td><code>c
      ? x : y</code>, <code>(int) x</code></td><td>chọn x nếu điều kiện c đúng, ngược
      lại y; ép x về số nguyên</td></tr></table>'
    clear: true
    say: Bốn dòng nữa cho cú pháp Java, lệnh biên dịch dịch tệp nguồn thành tệp chạy
      được, thư viện tải từ kho công khai. Mảng đánh số từ không, dấu hỏi hai chấm
      chọn một trong hai giá trị theo điều kiện.
