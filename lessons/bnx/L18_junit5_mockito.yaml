    say: Còn bốn câu hỏi tiếp theo hay gặp, trả lời theo hướng dẫn chính thức. Ca
      kiểm có tham số chạy một hàm nhiều lần với đối số khác nhau, và phải khai ít
      nhất một nguồn đối số. Đối tượng gián điệp bọc một đối tượng thật, nên hàm thật
      được gọi trừ hàm đã dặn trước. Muốn so tham số đã truyền thì dùng bộ bắt tham
      số, rồi khẳng định trên nó sau lệnh kiểm. Nhãn tạo đối tượng giả giảm mã lặp
      lại, và với bộ khung kiểm thử này, hướng dẫn chỉ tới một tiện ích mở rộng riêng.
