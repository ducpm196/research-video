- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_jt_fee_run(True)[0] == 3 and alg.bnx_jt_fee(10_000_000, True) != alg.bnx_jt_fee(10_000_000)
  - alg.bnx_jt_before_cutoff(21, 59) and not alg.bnx_jt_before_cutoff(22, 0)
  - alg.bnx_jt_before_cutoff(15, 0) and not alg.bnx_jt_before_cutoff(22, 30)
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> “Ba ca đều đạt, vậy hàm
      đúng.” Ở ví dụ, ba ca giữa khoảng đều đạt trong khi hàm vẫn sai ở đúng mốc 10
      000 000.

      <b class="red">Ca kiểm đạt không chứng minh mã đúng</b>, chỉ chứng minh các
      trường hợp đã kiểm.

      <br><span class="note">Cách chữa: lấy giá trị mong đợi từ đề bài, không từ mã;
      mỗi nhánh một ca, mỗi mốc thêm ca ở đúng mốc.</span></div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới, là thấy ba ca đều đạt thì kết luận hàm đúng.
      Ở ví dụ, ba ca giữa khoảng đều đạt trong khi hàm vẫn sai ở đúng mốc mười triệu.
      Ca kiểm đạt không chứng minh mã đúng, mà chỉ chứng minh các trường hợp đã kiểm.
      Cách chữa là lấy giá trị mong đợi từ đề bài chứ không từ mã, và thêm ca ở đúng
      mỗi mốc.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc mới dựng).</b> Tin
      rằng ca dùng đối tượng giả đã kiểm được bên ngoài.

      Đối tượng giả trả <code>true</code> vì <b>ta dặn</b> nó thế. Nếu cổng thật đổi
      cách trả lời, mọi ca vẫn đạt.

      <b class="red">Đối tượng giả kiểm cách mã của ta gọi bên ngoài, không kiểm bên
      ngoài chạy đúng.</b>

      <br><span class="note">Cách chữa: giữ thêm một số ít ca gọi môi trường thử của
      cổng; không dặn giả nhiều hơn điều ca kiểm cần.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, hay gặp lúc mới dựng hệ thống, là tin rằng
      ca dùng đối tượng giả đã kiểm được bên ngoài. Đối tượng giả trả lời đúng chỉ
      vì ta dặn nó thế, nên nếu cổng thật đổi cách trả lời thì mọi ca vẫn đạt. Đối
      tượng giả kiểm cách mã của ta gọi bên ngoài, chứ không kiểm bên ngoài chạy đúng.
      Cách chữa là giữ thêm một số ít ca gọi tới môi trường thử của cổng thanh toán.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc vận hành lâu dài).</b>
      Ca kiểm <b class="red">lúc đạt lúc trượt</b> vì phụ thuộc thứ nằm ngoài ca:

      <b>đồng hồ thật</b> (lệnh sau 22 giờ tính sang ngày kế, số minh hoạ: ca chạy
      ban ngày thì đạt, bản dựng ban đêm thì trượt),

      <b>mạng</b> (gọi dịch vụ thật), <b>thứ tự chạy</b> (ca sau dùng dữ liệu ca trước
      để lại).

      <br><span class="note">Cách chữa: đưa đồng hồ vào làm tham số (<code>java.time.Clock</code>)
      rồi cho ca kiểm một đồng hồ đứng yên; thay mạng bằng đối tượng giả; mỗi ca tự
      sắp đặt dữ liệu của mình.</span>

      <br><span class="note">JUnit mặc định tạo một bản thể mới của lớp kiểm thử cho
      mỗi ca, nên trường của lớp (như đối tượng giả) không rò sang ca khác; dữ liệu
      tĩnh hay dữ liệu bên ngoài (tệp, cơ sở dữ liệu) thì có thể rò.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, lộ ra khi vận hành lâu dài, là ca kiểm lúc
      đạt lúc trượt vì phụ thuộc thứ nằm ngoài ca. Thứ nhất là đồng hồ thật, ví dụ
      lệnh sau hai mươi hai giờ tính sang ngày kế, thì ca chạy ban ngày đạt mà bản
      dựng ban đêm lại trượt. Thứ hai là mạng, và thứ ba là thứ tự chạy, khi ca sau
      dùng dữ liệu ca trước để lại. Cách chữa là đưa đồng hồ vào làm tham số, thay
      mạng bằng đối tượng giả, và để mỗi ca tự sắp đặt dữ liệu của mình. Bộ khung
      mặc định tạo một bản thể mới của lớp kiểm thử cho mỗi ca, nên trường của lớp
      không rò sang ca khác, còn dữ liệu tĩnh hay dữ liệu bên ngoài thì có thể rò.
  - show: '<p><b>Đồng hồ là tham số: ca kiểm tự chọn thời điểm</b></p><div class="code"><div>import
      java.time.*;</div><div>public class Main {</div><div>    static boolean kip(Clock
      dongHo) {     // kịp trước 22 giờ</div><div>        return LocalTime.now(dongHo).isBefore(LocalTime.of(22,
      0));</div><div>    }</div><div>    public static void main(String[] a) {</div><div>        ZoneOffset
      vn = ZoneOffset.ofHours(7);</div><div>        Instant t = Instant.parse("2026-11-11T21:59:00+07:00");</div><div>        System.out.println(kip(Clock.fixed(t,
      vn)));</div><div>        System.out.println(kip(Clock.fixed(t.plusSeconds(60),
      vn)));</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
