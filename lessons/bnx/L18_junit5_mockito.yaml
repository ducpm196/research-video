      lấy kiểu ở vế trái</td><td><code>new ChuyenTien(cong).chuyen("TK01", 2_000_000)</code>:
      tạo dịch vụ với cổng giả rồi gọi hàm</td></tr></table>'
    clear: true
    say: Chữ tạo mới tạo một đối tượng, hoặc một mảng với các giá trị liệt kê.
  - show: '<p><b>ChuyenTienTest.java: thay cổng bằng đối tượng giả của Mockito</b></p><div
      class="code"><div>import static org.junit.jupiter.api.Assertions.*;</div><div>import
      static org.mockito.Mockito.*;</div><div>import org.junit.jupiter.api.Test;</div><div>class
      ChuyenTienTest {</div><div>    CongThanhToan cong = mock(CongThanhToan.class);</div><div>    @Test
      void goiCongDungMotLan() {</div><div>        when(cong.chuyen("TK01", 2_005_000)).thenReturn(true);</div><div>        long
      phi = new ChuyenTien(cong).chuyen("TK01", 2_000_000);</div><div>        assertEquals(5000,
      phi);</div><div>        verify(cong, times(1)).chuyen("TK01", 2_005_000);</div><div>    }</div><div>}</div></div>$$④
      \; \text{tham số gọi cổng:}\quad 2\,000\,000 + 5\,000 = \hl{2\,005\,000}$$'
    focus:
    - 1
