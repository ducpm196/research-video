    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án câu ba, không có lựa chọn nào chỉ toàn được. Toàn đối tượng giả thì
      một lượt chỉ mất một nghìn mili giây, nhưng không biết cổng thật có trả lời
      như ta dặn. Toàn cổng thật thì mất hai trăm nghìn mili giây, chậm gấp hai trăm
      lần, và mạng rớt thì ca trượt oan. Chín mươi ca giả cộng mười ca thật mất hai
      mươi nghìn chín trăm mili giây, phần xử lý vẫn kiểm nhanh mà vẫn có ca canh
      cổng, đổi lại phải nuôi hai loại ca.
