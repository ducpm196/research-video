    focus:
    - 1
    - 2
    introduces:
    - bnx_sed_i
    clear: true
    say: Máy chỉ cần bộ Java và một tệp thư viện của bộ khung kiểm thử. Lệnh đầu biên
      dịch, lệnh sau chạy bộ khung.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>+-- JUnit Jupiter
      [OK]</div><div>| ''-- PhiTest [OK]</div><div>|   +-- phiCao() [OK]</div><div>|   +--
      phiVua() [OK]</div><div>|   +-- bien() [X] expected: &lt;5500&gt; but was: &lt;5000&gt;</div><div>|   ''--
      mienPhi() [OK]</div><div>…</div><div>       PhiTest.bien(PhiTest.java:8)</div><div>…</div><div>[         4
      tests found           ]</div><div>[         3 tests successful      ]</div><div>[         1
      tests failed          ]</div></div>

      $$② \; 3\ \text{đạt} + 1\ \text{trượt} = \hl{4}\ \text{ca}; \qquad ③ \; 5500
      - 5000 = \hl{500}\ \text{đồng thu thiếu}$$

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Bản báo chạy thật: ba ca ở giữa khoảng đạt, ca ở mốc biên trượt, mong đợi
      năm nghìn năm trăm nhưng nhận năm nghìn. Phép tính thứ hai, ba đạt cộng một
      trượt là bốn ca. Phép tính thứ ba, thu thiếu năm trăm đồng, đúng số ở đầu bài.'
  - show: '<p>Thứ tự chạy là phiCao, phiVua, bien, mienPhi: <b>không</b> theo thứ
      tự viết trong tệp, nên các ca không được dựa vào nhau.</p>

      <p style=''margin-top:18px''><b>Bộ bốn ca này còn hở:</b> hàm có hai mốc nhưng
      chỉ có ca ở đúng mốc 10 000 000. Lỗi tương tự ở mốc 500 000 vẫn lọt, vì cả bốn
      ca vẫn đạt.</p>

      <p style=''margin-top:18px''><span class=''note''>Quy tắc của bài là mỗi mốc
      một ca ở đúng mốc, nên cần thêm ca ở 500 000 và 499 999; câu 1 cuối bài tính
      các giá trị ấy.</span></p>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bộ khung chạy các ca không theo thứ tự viết, nên các ca không được dựa vào
