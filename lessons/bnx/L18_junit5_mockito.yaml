    say: Hình thứ hai cho thấy vai của đối tượng giả. Dịch vụ chuyển tiền là mã của
      ta, và nó gọi ra cổng thanh toán qua một giao diện. Cổng thật thì cần mạng,
      chạy chậm và trừ tiền thật, nên trong ca kiểm ta thay nó bằng đối tượng giả
