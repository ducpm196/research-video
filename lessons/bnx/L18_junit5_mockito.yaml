  steps:
  - show: '<p><b>Bước 1.</b> Thử tay thì mỗi lần sửa mã lại phải thử lại, và sẽ có
      lần quên. <b>Ca kiểm</b> là một hàm nhỏ: gọi hàm cần kiểm rồi so với giá trị
      mong đợi, nên máy chạy lại được sau mỗi lần sửa.</p>

      <span class=''note''>Làm thử: <code>assertEquals(0, Phi.tinh(200_000))</code>,
      vì 200 000 dưới mốc 500 000 nên đề cho phí 0.</span>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, thử tay thì mỗi lần sửa mã lại phải thử lại và sẽ có lần quên,
      nên ta viết ca kiểm, là hàm nhỏ so kết quả với mong đợi. Làm thử, hai trăm nghìn
      đồng dưới mốc năm trăm nghìn nên mong đợi là không đồng.
  - show: '<p><b>Bước 2.</b> Nhánh nào không chạy trong ca kiểm thì lỗi trong nhánh
      đó không lộ ra, nên <b>mỗi nhánh cần ít nhất một ca</b>.</p>

      $$\text{2 mốc} \;\Rightarrow\; 2 + 1 = \hl{3}\ \text{nhánh} \;\Rightarrow\;
      \text{ít nhất 3 ca}$$

      '
    focus:
    - 1
    - 2
    say: Bước hai, nhánh nào không chạy trong ca kiểm thì lỗi trong nhánh đó không
      lộ ra, nên mỗi nhánh cần ít nhất một ca. Hai mốc cắt trục số tiền thành ba khoảng,
      nên cần ít nhất ba ca.
    introduces:
    - implies
  - show: '<p><b>Bước 3.</b> Ba ca ở <b>giữa</b> ba khoảng vẫn chưa chạm tới dấu so
      sánh. Lỗi <code>&lt;</code> thành <code>&lt;=</code> chỉ lộ ở <b>đúng mốc</b>,
      nên thêm ca ở mốc biên.</p>

      <span class=''note''>Làm thử: tại đúng 10 000 000, đề cho 5 500; mã viết <code>&lt;=</code>
      trả 5 000. Ba ca kia vẫn đạt.</span>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước ba, ba ca ở giữa ba khoảng chưa chạm tới dấu so sánh, vì lỗi nhầm dấu
      chỉ lộ ra ở đúng mốc, nên ta thêm một ca ở mốc biên. Tại đúng mười triệu, đề
      cho năm nghìn năm trăm còn mã nhầm trả năm nghìn.
  - show: '<p><b>Bước 4.</b> Dịch vụ chuyển tiền gọi ra cổng thanh toán. Gọi cổng
      thật trong ca kiểm thì chậm, cần mạng và trừ tiền thật.

      Vì dịch vụ chỉ biết <b>giao diện</b> <code>CongThanhToan</code> và nhận cổng
      qua hàm tạo, ca kiểm đưa vào một <b>đối tượng giả</b>.</p>

      <span class=''note''>Làm thử: dặn giả trả <code>true</code> khi được gọi với
      TK01 và 2 000 000 + 5 000 = 2 005 000.</span>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước bốn, dịch vụ chuyển tiền gọi ra cổng thanh toán, mà gọi cổng thật trong
      ca kiểm thì chậm và trừ tiền thật. Vì dịch vụ nhận cổng qua hàm tạo, nên ca
      kiểm đưa vào một đối tượng giả đã dặn trả lời đúng.
  - show: '<p><b>Bước 5.</b> Giá trị trả về đúng vẫn chưa đủ. Gọi cổng <b>0 lần</b>
      thì tiền không đi; gọi <b>2 lần</b> thì khách bị trừ hai lần.

      Nên ca kiểm hỏi lại đối tượng giả: lời gọi đã xảy ra <b>đúng 1 lần</b> với <b>đúng
      tham số</b> chưa. Đó là <b>kiểm tương tác</b>.</p>

      <span class=''note''>Làm thử: <code>verify(cong, times(1)).chuyen("TK01", 2_005_000)</code>.</span>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước năm, giá trị trả về đúng vẫn chưa đủ, vì gọi cổng không lần nào thì
      tiền không đi, gọi hai lần thì khách bị trừ hai lần. Nên ca kiểm hỏi đối tượng
      giả lời gọi đã xảy ra đúng một lần chưa, đó là kiểm tương tác.
- id: example
  kind: example
  title: Ví dụ chạy thật, từng phép tính
  checks:
