- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đối tượng giả viết tay, không dùng thư viện'
  checks:
  - alg.bnx_jt_transfer(2_000_000)[0] == 5000
  - len(alg.bnx_jt_transfer(2_000_000)[1]) == 1
