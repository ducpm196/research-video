    say: Đoạn mã này cho thấy cách chữa với đồng hồ. Hàm kiểm giờ chốt không tự hỏi
      giờ của máy, mà nhận một đồng hồ làm tham số. Trong phần chạy thử, ta tạo một
      đồng hồ đứng yên ở hai mươi mốt giờ năm mươi chín phút theo giờ Việt Nam. Lần
      in đầu dùng đúng thời điểm đó, còn lần in sau dùng đồng hồ đứng yên ở sáu mươi
      giây sau, tức đúng hai mươi hai giờ.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>true</div><div>false</div></div>
