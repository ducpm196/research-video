    say: 'Nếu bị hỏi về dòng kiểm thử tự động trên hồ sơ xin việc, đây là ba câu hay
      gặp. Chọn ca kiểm thế nào: mỗi nhánh một ca, thêm ca ở mốc biên, mong đợi lấy
      từ đề. Khi nào dùng đối tượng giả: khi phần phụ thuộc chậm hay tốn tiền, và
      nhớ rằng nó chỉ kiểm cách ta gọi. Gặp ca lúc đạt lúc trượt thì tìm phụ thuộc
      ẩn như đồng hồ, mạng, thứ tự chạy và dữ liệu dùng chung.'
  - show: '<table class=''t''><tr><th>Câu hỏi tiếp theo hay gặp</th><th>ý trả lời
      (theo hướng dẫn chính thức)</th></tr><tr><td>Nhiều ca cùng khuôn, chỉ khác số,
      viết sao cho gọn?</td><td><code>@ParameterizedTest</code> chạy một hàm nhiều
      lần với đối số khác nhau; phải khai ít nhất một nguồn đối số, ví dụ <code>@ValueSource</code></td></tr><tr><td>Đối
      tượng gián điệp (spy) khác đối tượng giả ở đâu?</td><td>spy bọc đối tượng thật:
      hàm thật được gọi, trừ hàm đã dặn trước</td></tr><tr><td>Muốn so tham số đã
