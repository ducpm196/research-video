- id: quymo
  kind: example
  title: 'Khi bảng phí lớn dần: số ca cần và số lỗi lọt lưới'
  checks:
  - '[alg.bnx_l18_cases_mid(k) for k in (2, 200, 2000)] == [3, 201, 2001]'
  - '[alg.bnx_l18_cases_edge(k) for k in (2, 200, 2000)] == [5, 401, 4001]'
  - '[alg.bnx_l18_survivors_mid(k) for k in (2, 200, 2000)] == [2, 200, 2000] and
    [alg.bnx_l18_survivors_edge(k) for k in (2, 200, 2000)] == [0, 0, 0]'
  - '[alg.bnx_l18_suite_ms(alg.bnx_l18_cases_edge(k), 10) for k in (2, 200, 2000)]
    == [50, 4010, 40010]'
  - alg.bnx_l18_suite_ms(4001, 2000) == 8_002_000 and 8_002_000 // 3_600_000 == 2
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>import
      java.util.Arrays;</code></td><td>lấy lớp <code>Arrays</code> trong gói <code>java.util</code>
      về dùng</td><td>để gọi <code>Arrays.binarySearch</code></td></tr><tr><td><code>public
      static kiểu tên(kiểu a, kiểu b)</code></td><td>khai một hàm: <b>kiểu trả về</b>
      (<code>void</code> là không trả gì), <b>tên</b>, rồi <b>tham số</b> trong ngoặc
      tròn, mỗi tham số là kiểu rồi tên; <code>static</code>: thuộc cả lớp</td><td><code>static
      int tinh(long x, int loi)</code>: trả về số nguyên, nhận hai tham số</td></tr></table>'
    clear: true
    say: Câu nhập lấy lớp có sẵn trong thư viện Java về dùng. Khai hàm gồm kiểu trả
      về, tên, rồi các tham số.
  - show: '<p><b>BoCa.java (1/4): phí là số mốc ≤ số tiền; lỗi là một mốc bị nhầm
      dấu</b></p><div class="code"><div>import java.util.Arrays;</div><div>public
      class BoCa {</div><div>  static int[] moc;</div><div>  static int dem(long x)
      {               // số mốc ≤ x</div><div>    int i = Arrays.binarySearch(moc,
      (int) x);</div><div>    return i &gt;= 0 ? i + 1 : -i - 1;</div><div>  }</div><div>  static
      int tinh(long x, int loi) {     // loi: chỉ số mốc bị nhầm &lt; thành &lt;=</div><div>    return
      dem(x) - (loi &gt;= 0 &amp;&amp; x == moc[loi] ? 1 : 0);</div><div>  }</div></div>'
    clear: true
    say: 'Ta đo thật bằng Java thuần: bảng phí có k mốc, phí bằng số mốc không vượt
      số tiền, và một lỗi là một mốc bị nhầm dấu so sánh.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      (int i = 1; i &lt;= 10; i++) { … }</code></td><td>vòng lặp đếm: khai biến đếm;
      điều kiện để còn lặp; bước sau mỗi vòng (<code>i++</code>: tăng i thêm 1); thân
      giữa cặp ngoặc nhọn</td><td><code>for (int loi = 0; loi &lt; k; loi++)</code>:
      loi chạy 0, 1, … k − 1</td></tr><tr><td><code>for (long x : ca) { … }</code></td><td>duyệt
      từng phần tử: mỗi vòng <code>x</code> nhận một phần tử của <code>ca</code>,
      theo thứ tự</td><td><code>for (long x : ca)</code>: x là từng số trong bộ ca</td></tr><tr><td><code>int
      so = i;</code>, <code>long t0</code>, <code>boolean ok</code>, <code>String
      s</code></td><td>khai biến: <b>kiểu</b> rồi tên, rồi <code>=</code> giá trị;
      <code>int</code>: số nguyên, <code>long</code>: số nguyên lớn, <code>boolean</code>:
      đúng hoặc sai, <code>String</code>: chuỗi chữ</td><td><code>boolean bat = false;</code>:
      cờ đúng sai, lúc đầu sai</td></tr></table>'
    clear: true
    say: Vòng lặp đếm gồm biến đếm, điều kiện còn lặp, bước sau mỗi vòng. Dấu hai
      chấm duyệt từng phần tử của dãy. Khai biến là viết kiểu rồi tên rồi giá trị,
      như đúng sai hay số nguyên.
  - show: '<p><b>BoCa.java (2/4): đếm lỗi mà bộ ca không bắt được</b></p><div class="code"><div>  static
      int lot(long[] ca, int k) {     // số lỗi mà bộ ca không bắt được</div><div>    int
      song = 0;</div><div>    for (int loi = 0; loi &lt; k; loi++) {</div><div>      boolean
      bat = false;</div><div>      for (long x : ca) if (tinh(x, loi) != tinh(x, -1))
