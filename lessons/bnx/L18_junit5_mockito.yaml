  - show: '<table class=''t''><tr><th>số mốc k</th><th>ca giữa khoảng</th><th>lỗi
      lọt</th><th>ca sát mốc</th><th>lỗi lọt</th><th>chạy 10 ms mỗi ca (số minh hoạ)</th></tr><tr><td><span
      style=''white-space:nowrap''>2 (×1)</span></td><td>3</td><td>2 trên 2</td><td>5</td><td>0</td><td>50
