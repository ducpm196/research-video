- id: formula
  kind: formula
  title: 'Suy ra từng bước: đọc đặc tả thành luật kiểm'
  checks:
  - alg.bnx_oas_match('0123456789')
  - 'alg.bnx_oas_errors({''fromAccount'': ''0123456789'', ''toAccount'': ''9876543210'',
    ''amount'': 0}) == [''amount: nhỏ hơn 1'']'
  - 'alg.bnx_oas_errors({''fromAccount'': ''0123456789'', ''toAccount'': ''9876543210'',
    ''amount'': ''500000''}) == [''amount: sai kiểu'']'
  - alg.bnx_oas_old_valid_after(['purpose']) == 0 and alg.bnx_oas_old_valid_after([])
    == 1
  steps:
  - show: '<p><b>Bước 1. Có đường dẫn nào, phương thức nào</b></p><div class="code"><div>openapi:
      3.0.3</div><div>info:</div><div>  title: Transfer API</div><div>  version: 1.0.0</div><div>paths:</div><div>  /transfers:</div><div>    post:</div><div>      summary:
      Tạo lệnh chuyển khoản</div></div><span class=''note''>Làm thử: <code>POST /transfers</code>
      có trong hợp đồng; <code>DELETE /transfers</code> không có, nên máy chủ không
      hứa gì về nó.</span>'
    focus:
    - - '2.1'
      - '2.2'
      - '2.3'
      - '2.4'
    - - '2.5'
      - '2.6'
      - '2.7'
    - 2
    - 3
    say: Bước một, đặc tả mở đầu bằng phiên bản chuẩn và tên API. Dưới mục đường dẫn
      có đường chuyển tiền, dưới đó là phương thức P O S T. Vì hợp đồng chỉ hứa những
      gì được viết ra, nên đường dẫn hay phương thức không có ở đây thì người gọi
      không được trông vào. Làm thử, phương thức xoá trên cùng đường dẫn không có
      trong hợp đồng này.
  - show: '<p><b>Bước 2. Người gọi phải gửi gì</b></p><div class="code"><div>      parameters:</div><div>        -
      in: header</div><div>          name: Idempotency-Key</div><div>          required:
      true</div><div>          schema:</div><div>            type: string</div><div>      requestBody:</div><div>        required:
      true</div><div>        content:</div><div>          application/json:</div><div>            schema:</div><div>              <span>&#36;</span>ref:
      ''#/components/schemas/TransferRequest''</div></div><span class=''note''>Làm
      thử: yêu cầu thiếu phần đầu <code>Idempotency-Key</code> → 400, chưa cần xem
      thân.</span>'
    focus:
    - - '2.1'
      - '2.2'
      - '2.3'
      - '2.4'
    - - '2.7'
      - '2.8'
      - '2.9'
      - '2.10'
      - '2.11'
      - '2.12'
    - - '2.4'
      - '2.8'
    - 3
    clear: true
    say: Bước hai, mục tham số nói phần đầu phải có khoá lũy đẳng, và chữ bắt buộc
      bằng đúng nghĩa là thiếu thì sai. Thân yêu cầu cũng bắt buộc, viết ở JSON, và
      lược đồ của nó trỏ sang một lược đồ có tên ở cuối đặc tả. Vì cả hai đều bắt
      buộc, nên thiếu phần đầu là sai ngay. Làm thử, yêu cầu thiếu khoá lũy đẳng bị
      trả bốn trăm, máy chủ chưa cần đọc thân.
  - show: '<p><b>Bước 3. Lược đồ: trường nào bắt buộc, dạng gì</b></p><div class="code"><div>components:</div><div>  schemas:</div><div>    TransferRequest:</div><div>      type:
      object</div><div>      required: [fromAccount, toAccount, amount]</div><div>      properties:</div><div>        fromAccount:</div><div>          type:
      string</div><div>          pattern: ''^[0-9]{10,19}<span>&#36;</span>''</div></div><span
      class=''note''>Làm thử: <code>"0123456789"</code> là chuỗi, 10 chữ số → khớp.</span>'
    focus:
    - - '2.3'
      - '2.4'
    - '2.5'
    - - '2.7'
      - '2.8'
      - '2.9'
    - - '2.8'
      - '2.9'
    - 3
    clear: true
    say: 'Bước ba, lược đồ chuyển khoản là một đối tượng. Danh sách bắt buộc gồm ba
      trường: tài khoản chuyển, tài khoản nhận và số tiền. Tài khoản chuyển phải là
      chuỗi khớp mẫu mười đến mười chín chữ số. Vì là chuỗi, nên số không ở đầu vẫn
      được giữ. Làm thử, chuỗi không một hai ba đến chín dài mười chữ số, nên khớp.'
  - show: '<p><b>Bước 4. Tài khoản nhận và số tiền</b></p><div class="code"><div>        toAccount:</div><div>          type:
      string</div><div>          pattern: ''^[0-9]{10,19}<span>&#36;</span>''</div><div>        amount:</div><div>          type:
      integer</div><div>          minimum: 1</div></div><span class=''note''>Làm thử:
      số tiền 0 nhỏ hơn 1 → sai; số tiền <code>"500000"</code> là chuỗi, không phải
      số nguyên → sai.</span>'
    focus:
    - - '2.1'
      - '2.2'
      - '2.3'
    - - '2.4'
      - '2.5'
      - '2.6'
    - 3
    - 3
    clear: true
    say: Bước bốn, tài khoản nhận có cùng luật với tài khoản chuyển. Số tiền phải
      là số nguyên, và giá trị nhỏ nhất là một, vì chuyển không đồng là vô nghĩa.
      Làm thử, số tiền bằng không thì sai. Số tiền năm trăm nghìn viết trong dấu nháy
      là chuỗi, cũng sai, đúng lỗi của hai đội lúc đầu bài.
  - show: '<p><b>Bước 5. Người gọi phải xử lý những phản hồi nào</b></p><div class="code"><div>      responses:</div><div>        ''201'':</div><div>          description:
      Đã tạo lệnh chuyển</div><div>        ''400'':</div><div>          description:
      Yêu cầu sai lược đồ</div><div>        ''409'':</div><div>          description:
      Yêu cầu cùng khoá đang xử lý dở</div><div>        ''422'':</div><div>          description:
      Cùng khoá lũy đẳng nhưng khác nội dung</div></div><p class=''note''>Làm thử:
      4 mã → ứng dụng viết đúng 4 nhánh. 409, 422 theo bản nháp IETF về Idempotency-Key
      (bản 08).</p>'
    focus:
    - '2.1'
    - - '2.2'
      - '2.3'
      - '2.4'
      - '2.5'
    - 3
    - - '2.6'
      - '2.7'
      - '2.8'
      - '2.9'
    - 2
    - 3
    clear: true
    say: Bước năm, mục phản hồi liệt kê bốn mã. Hai trăm linh một là đã tạo lệnh,
      bốn trăm là sai lược đồ. Hai mã cuối theo bản nháp chuẩn về khoá lũy đẳng của
      tổ chức chuẩn hoá giao thức mạng. Bốn trăm linh chín là yêu cầu cùng khoá còn
      đang xử lý dở, bốn trăm hai mươi hai là cùng khoá mà khác nội dung. Vì các mã
      được viết sẵn, người gọi biết trước phải xử lý những trường hợp nào. Làm thử,
      bốn mã thì ứng dụng viết đúng bốn nhánh.
  - show: '<p><b>Bước 6. Luật đổi hợp đồng.</b> Hợp đồng đã có người dùng. Một thay
      đổi là <b class="green">tương thích</b> khi:</p>

      <div class="box key">mọi yêu cầu cũ hợp lệ vẫn hợp lệ, <b>và</b> mọi máy khách
      cũ vẫn đọc được phản hồi mới.</div>

      <span class=''note''>Làm thử: thêm trường bắt buộc <code>purpose</code> vào
      yêu cầu → yêu cầu 1 hợp lệ ở hợp đồng cũ thành 400 → <b class="red">phá vỡ</b>.</span>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    - 3
    clear: true
    say: Bước sáu là luật khi cần đổi một hợp đồng đã có. Hợp đồng đã có người dùng,
      nên một thay đổi chỉ là tương thích khi mọi yêu cầu cũ hợp lệ vẫn hợp lệ, và
      mọi máy khách cũ vẫn đọc được phản hồi mới. Làm thử, thêm một trường bắt buộc
      mới vào yêu cầu. Yêu cầu cũ không có trường đó, nên từ hợp lệ thành bốn trăm.
      Vậy thêm trường bắt buộc vào yêu cầu là thay đổi phá vỡ.
- id: example
  kind: example
  title: Ví dụ ba yêu cầu thử, từng phép tính
  checks:
  - len('0123456789') == 10 and len('9876543210') == 10 and alg.bnx_oas_match('0123456789')
    and alg.bnx_oas_match('9876543210')
  - '[s for s, _ in alg.bnx_oas_batch()] == [201, 400, 400]'
  - '[len(e) for _, e in alg.bnx_oas_batch()] == [0, 1, 1]'
  - alg.bnx_oas_batch()[1][1][0].startswith('amount') and alg.bnx_oas_batch()[2][1][0].startswith('toAccount')
  - 3 - len({'fromAccount', 'amount'}) == 1
  steps:
  - show: '<table class=''t''><tr><th>yêu cầu</th><th>fromAccount</th><th>toAccount</th><th>amount</th></tr><tr><td>1</td><td>0123456789</td><td>9876543210</td><td>500000</td></tr><tr><td>2</td><td>0123456789</td><td>9876543210</td><td>0</td></tr><tr><td>3</td><td>0123456789</td><td>(không
      có)</td><td>500000</td></tr></table><p><b>①</b> Yêu cầu 1, hai tài khoản: <code>len("0123456789")
      = 10</code>, <code>len("9876543210") = 10</code>; 10 nằm trong 10–19 → <b class="green">khớp
      cả hai</b>.</p>'
    focus:
    - 0
    - 1
    - - '1.2'
      - '1.3'
    - '1.4'
    - 2
    - 2
    - 2
    say: Ta kiểm ba yêu cầu thử bằng tay. Bảng dưới đây ghi lại đủ ba yêu cầu thử.
      Yêu cầu một và hai giống nhau, chỉ khác số tiền. Yêu cầu ba không có tài khoản
      nhận. Phép tính thứ nhất, ta xét yêu cầu thử số một. Hai số tài khoản đều là
      chuỗi dài mười chữ số. Mười nằm trong khoảng mười đến mười chín, nên cả hai
      đều khớp.
  - show: '<p><b>②</b> Yêu cầu 1, số tiền: <code>500000</code> là số nguyên và lớn
      hơn 1. Có đủ 3/3 trường bắt buộc → <b class="green">0 lỗi → 201</b>.</p>'
    say: Phép tính thứ hai, số tiền năm trăm nghìn là số nguyên và lớn hơn một. Đủ
      ba trên ba trường bắt buộc, nên không có lỗi nào, máy chủ trả hai trăm linh
      một.
  - show: '<p><b>③</b> Yêu cầu 2: hai tài khoản giống yêu cầu 1, dùng lại kết quả
      ① → khớp. Số tiền <code>0</code> nhỏ hơn 1 → <b class="red">1 lỗi, trường amount
      → 400</b>.</p>'
    say: Phép tính thứ ba, ta xét yêu cầu thử số hai. Hai tài khoản giống yêu cầu
      một, nên dùng lại kết quả phép thứ nhất là khớp. Số tiền bằng không, nhỏ hơn
      một, nên có một lỗi ở trường số tiền, trả bốn trăm.
  - show: '<p><b>④</b> Yêu cầu 3: có 2 trong 3 trường bắt buộc, thiếu 3 − 2 = 1 trường
      là <code>toAccount</code> → <b class="red">1 lỗi → 400</b>.</p>'
    say: Phép tính thứ tư, yêu cầu ba có hai trong ba trường bắt buộc. Ba trừ hai
      bằng một, nên thiếu đúng một trường, là tài khoản nhận. Máy chủ trả bốn trăm
      và nêu tên trường đó.
  - show: '<p><b>⑤</b> Tổng hợp: 1 yêu cầu được 201, 2 yêu cầu bị 400. Chỉ 1 trong
      3 yêu cầu đi tới bước trừ tiền.</p><table class=''t''><tr><th>yêu cầu</th><th>số
      lỗi</th><th>trường sai</th><th>mã</th></tr><tr><td>1</td><td>0</td><td>—</td><td>201</td></tr><tr><td>2</td><td>1</td><td>amount</td><td>400</td></tr><tr><td>3</td><td>1</td><td>toAccount</td><td>400</td></tr></table>'
    focus:
    - 1
    - 2
    - 1
    clear: true
    say: Phép tính thứ năm, ta tổng hợp lại cả ba yêu cầu. Một yêu cầu được hai trăm
      linh một, hai yêu cầu bị bốn trăm. Vậy chỉ một trong ba yêu cầu đi tới bước
      trừ tiền, hai yêu cầu sai bị chặn ở cửa.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: cho máy kiểm lại'
  checks:
  - '[s for s, _ in alg.bnx_oas_batch()] == [201, 400, 400]'
  - 'alg.bnx_oas_errors({''fromAccount'': ''0123456789'', ''toAccount'': None, ''amount'':
    None}) == [''toAccount: sai kiểu'', ''amount: sai kiểu''] and not alg.bnx_oas_match(''0123456789\n'')'
  - 'alg.bnx_oas_change({''required'': [''id''], ''properties'': {''id'': {''type'':
    ''string''}}}, {''required'': [''id''], ''properties'': {''id'': {''type'': ''string''},
    ''fee'': {''type'': ''integer''}}}, ''response'') == ''tương thích'''
  - 'alg.bnx_oas_change({''required'': [''amount''], ''properties'': {''amount'':
    {''type'': ''integer''}}}, {''required'': [''amount'', ''purpose''], ''properties'':
    {''amount'': {''type'': ''integer''}, ''purpose'': {''type'': ''string''}}}, ''request'')
    == ''phá vỡ'''
  - 'alg.bnx_oas_change({''properties'': {''amount'': {''type'': ''integer''}}}, {''properties'':
    {''amount'': {''type'': ''string''}}}, ''request'') == ''phá vỡ'''
  - 'alg.bnx_oas_change({''properties'': {''id'': {''type'': ''string''}, ''toAccount'':
    {''type'': ''string''}}}, {''properties'': {''id'': {''type'': ''string''}}},
    ''response'') == ''phá vỡ'''
  steps:
