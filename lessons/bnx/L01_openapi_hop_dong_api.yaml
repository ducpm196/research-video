scenes:
- id: hook
  kind: hook
  title: Hai đội làm mười ngày, ghép lại thì mọi yêu cầu bị từ chối
  checks:
  - 'alg.bnx_oas_status({''fromAccount'': ''0123456789'', ''to'': ''9876543210'',
    ''amount'': ''500000''}) == 400'
  - 'sorted(alg.bnx_oas_errors({''fromAccount'': ''0123456789'', ''to'': ''9876543210'',
    ''amount'': ''500000''})) == [''amount: sai kiểu'', ''toAccount: thiếu'']'
  steps:
  - show: '<p>Đội ứng dụng và đội máy chủ cùng làm tính năng chuyển tiền trong <b>10
      ngày</b> (số minh hoạ). Không ai viết ra yêu cầu trông thế nào.</p><table class=''t''><tr><th>chỗ</th><th>ứng
      dụng gửi</th><th>máy chủ chờ</th></tr><tr><td>tên trường tài khoản nhận</td><td><code>to</code></td><td><code>toAccount</code></td></tr><tr><td>số
      tiền</td><td><code>"500000"</code> (chuỗi)</td><td><code>500000</code> (số nguyên)</td></tr></table><div
      class="box warn">Ngày ghép nối: máy chủ trả <b class="red">400</b> cho mọi yêu
      cầu.</div>'
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - 3
    say: Chào bạn, đội ứng dụng và đội máy chủ cùng làm tính năng chuyển tiền trong
      mười ngày, đây là số minh hoạ. Không ai viết ra yêu cầu trông thế nào. Ứng dụng
      đặt tên trường tài khoản nhận một kiểu, máy chủ chờ một kiểu khác. Ứng dụng
      gửi số tiền năm trăm nghìn dưới dạng chuỗi chữ, còn máy chủ chờ một số nguyên.
      Ngày ghép nối, máy chủ trả mã bốn trăm cho mọi yêu cầu, và hai đội mất thêm
      nhiều ngày để cãi nhau xem ai sai.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>viết
      hợp đồng API thế nào</td><td>đặc tả OpenAPI: đường dẫn, phương thức, thân yêu
      cầu, phản hồi, lược đồ</td></tr><tr><td>kiểm một yêu cầu ra sao</td><td>so từng
      trường với lược đồ, chỉ ra trường sai</td></tr><tr><td>sửa hợp đồng mà không
      làm gãy ai</td><td>phân biệt thay đổi tương thích và thay đổi phá vỡ</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Hôm nay ta trả lời ba câu hỏi. Viết hợp đồng cho một API thế nào, bằng chuẩn
      đặc tả OpenAPI. Kiểm một yêu cầu ra sao, bằng cách so từng trường với lược đồ.
      Và sửa hợp đồng thế nào để không làm gãy người đang dùng nó.
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnk_retry_sim(2000000, 500000, 3, True) == 1500000
  - 'len(__import__(''json'').loads(''{"fromAccount": "0123456789", "toAccount": "9876543210",
    "amount": 500000}'')) == 3'
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Yêu cầu HTTP</td><td>phương thức và đường dẫn, phần đầu (các cặp tên: giá trị),
      rồi thân</td><td><code>POST /transfers</code></td></tr><tr><td>② Mã trạng thái</td><td>2xx
      là thành công, 4xx là lỗi của người gọi</td><td>201 đã tạo, 400 yêu cầu sai,
      409 xung đột, 422 không xử lý được</td></tr><tr><td>③ Khoá lũy đẳng</td><td>mã
      người gọi gửi kèm mọi lần thử; cùng khoá thì máy chủ chỉ làm một lần</td><td>thử
      3 lần, chỉ trừ tiền 1 lần</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    say: Trước hết ta cần hiểu năm điều, và ba điều đầu sẽ được nhắc lại ngắn gọn
      ngay đây. Một yêu cầu HTTP gồm phương thức và đường dẫn, phần đầu là các cặp
      tên và giá trị, rồi đến thân. Mã trạng thái bắt đầu bằng chữ số hai là thành
      công, bắt đầu bằng bốn là lỗi của người gọi. Ví dụ hai trăm linh một là đã tạo,
      bốn trăm là yêu cầu sai, bốn trăm linh chín là xung đột, bốn trăm hai mươi hai
      là nội dung không xử lý được. Khoá lũy đẳng là mã người gọi gửi kèm mọi lần
      thử, nên thử ba lần thì máy chủ vẫn chỉ trừ tiền một lần.
  - show: '<div class="row"><div class="col"><p><b>④ Thân yêu cầu dạng JSON</b></p><div
      class="code"><div>{</div><div>  "fromAccount": "0123456789",</div><div>  "toAccount":
      "9876543210",</div><div>  "amount": 500000</div><div>}</div></div></div><div
      class="col"><p><b>⑤ Cùng dữ liệu, viết dạng YAML</b></p><div class="code"><div>fromAccount:
      ''0123456789''</div><div>toAccount: ''9876543210''</div><div>amount: 500000</div></div></div></div>

      <p class="note">Cả hai đều là 3 cặp tên: giá trị. YAML bỏ ngoặc, dùng <b>thụt
      lề</b> để chỉ cái gì nằm trong cái gì.</p>

      '
    focus:
    - '1.1'
    - '1.1'
    - '1.2'
    - - '1.2'
      - 2
    clear: true
    say: Điều thứ tư, thân yêu cầu thường viết ở JSON, gồm các cặp tên và giá trị
      trong ngoặc nhọn. Ở đây có ba cặp, số tiền là năm trăm nghìn. Điều thứ năm,
      đặc tả hôm nay viết ở YAML. Cùng ba cặp đó, nhưng bỏ ngoặc và dùng thụt lề để
      chỉ cái gì nằm trong cái gì.
- id: sym
  kind: symbol
  title: Giải mã các từ của một đặc tả
  checks:
  - alg.bnx_oas_match('0123456789') and not alg.bnx_oas_match('12345') and not alg.bnx_oas_match('0123-456789')
  - len('0123456789') == 10 and len('12345') == 5
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>OpenAPI</td><td><b>chuẩn</b>
      viết đặc tả API qua HTTP: có đường dẫn nào, nhận gì, trả gì (tên cũ: Swagger
      Specification)</td></tr><tr><td>Swagger</td><td><b>bộ công cụ</b> làm việc với
      chuẩn đó: Swagger Editor (soạn), Swagger UI (trang thử API), Swagger Codegen
      (sinh mã)</td></tr><tr><td><code>paths</code>, <code>post</code></td><td>đường
      dẫn và phương thức</td></tr><tr><td><code>requestBody</code>, <code>responses</code></td><td>thân
      yêu cầu; phản hồi theo từng mã trạng thái</td></tr><tr><td><code>schema</code>
      (lược đồ)</td><td>kiểu và ràng buộc của từng trường</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: 'Bảng này giải mã năm từ hay gặp trong một đặc tả. OpenAPI là một chuẩn,
      dùng để viết đặc tả cho API qua HTTP, nói có đường dẫn nào, nhận gì và trả gì.
      Tên cũ của chuẩn này có chữ Swagger. Còn Swagger ngày nay là bộ công cụ làm
      việc với chuẩn đó: trình soạn, trang thử API, và bộ sinh mã. Hai từ tiếp theo
      là đường dẫn và phương thức. Rồi thân yêu cầu, và phản hồi theo từng mã trạng
      thái. Cuối cùng, lược đồ là kiểu và ràng buộc của từng trường.'
  - show: '<table class=''t''><tr><th>mảnh</th><th>đọc là</th><th>nghĩa</th></tr><tr><td><code>^</code></td><td>dấu
      mũ</td><td>bắt đầu chuỗi</td></tr><tr><td><code>[0-9]</code></td><td>một chữ
      số từ 0 đến 9</td><td>đúng một ký tự là chữ số</td></tr><tr><td><code>{10,19}</code></td><td>lặp
      từ 10 đến 19 lần</td><td>dài 10 đến 19 chữ số</td></tr><tr><td><code>$</code></td><td>dấu
      đô la</td><td>kết thúc chuỗi: không thêm gì sau</td></tr></table><p class="note">Làm
      thử: <code>0123456789</code> (10 chữ số) khớp; <code>12345</code> (5) không
      khớp; <code>0123-456789</code> (có gạch) không khớp.</p>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    - 2
    clear: true
    say: Số tài khoản trong bài được tả bằng một mẫu chữ. Dấu mũ ở đầu mẫu nghĩa là
      bắt đầu chuỗi. Cặp ngoặc vuông không đến chín là đúng một chữ số. Cặp ngoặc
      nhọn mười, mười chín nghĩa là lặp từ mười đến mười chín lần. Dấu đô la ở cuối
      nghĩa là kết thúc chuỗi, không được thêm gì sau. Làm thử, chuỗi mười chữ số
      thì khớp. Chuỗi năm chữ số thì không khớp, vì ngắn hơn mười. Chuỗi có dấu gạch
      cũng không khớp, vì gạch không phải chữ số.
