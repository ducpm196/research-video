- id: quymo
  kind: example
  title: 'Khi giao dịch lớn dần và chạy lâu: phí cố định và sai số dấu phẩy động'
  checks:
  - '[repr(alg.bnx_l11_float_sum(n)) for n in (10, 10000, 1000000)] == [''0.9999999999999999'',
    ''1000.0000000001588'', ''100000.00000133288'']'
  - '[alg.bnx_l11_fixed_fee_pct(a, 20) for a in (1000, 100000, 10000000)] == [''2'',
    ''0.02'', ''0.0002'']'
  - '[str(alg.bnx_fee(a, ''SHA'', 0, 15)[1]) for a in (1000, 100000, 10000000)] ==
    [''985.00'', ''99985.00'', ''9999985.00'']'
  - 100000 // 1000 == 10000000 // 100000 == 100 and 10000000 // 1000 == 10000
  steps:
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>for
      _ in range(n):</code></td><td>lặp <code>n</code> lần; <code>_</code> là tên
      biến bỏ đi, không dùng giá trị</td></tr><tr><td><code>f, d = 0.0, Decimal(0)</code></td><td>gán
      hai biến cùng lúc: <code>f</code> là số thực, <code>d</code> là số thập phân
      chính xác</td></tr><tr><td><code>f += 0.10</code></td><td>cộng thêm 0,10 vào
      <code>f</code></td></tr></table>'
    clear: true
    say: Khối đo dùng thêm vài cách viết, nên ta giải nghĩa trước. Vòng lặp chạy đúng
      n lần, dấu gạch dưới là tên biến bỏ đi, và hai biến cùng cộng một khoản nhỏ
      mỗi lần.
  - show: '<p><b>Đo thật: cộng 0,10 nhiều lần bằng số thực dấu phẩy động và bằng số
      thập phân chính xác</b></p><div class="code"><div>from decimal import Decimal</div><div>for
      n in (10, 10000, 1000000):</div><div>    f, d = 0.0, Decimal(0)</div><div>    for
      _ in range(n):</div><div>        f += 0.10</div><div>        d += Decimal("0.10")</div><div>    print(n,
      "lan cong 0.10: float", f, "| Decimal", d)</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>10 lan cong 0.10: float 0.9999999999999999 | Decimal 1.00</div><div>10000
      lan cong 0.10: float 1000.0000000001588 | Decimal 1000.00</div><div>1000000
      lan cong 0.10: float 100000.00000133288 | Decimal 100000.00</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Mỗi vòng cộng không phẩy mười, như một khoản phí nhỏ, bằng hai kiểu số, ở
      ba cỡ mười, mười nghìn và một triệu lần. Với mười nghìn lần, số thực lệch ở
      chữ số thập phân thứ mười. Với một triệu lần, lệch ở chữ số thập phân thứ sáu,
      còn số thập phân chính xác luôn đúng. Vì thế tiền lưu bằng số thập phân chính
      xác hoặc số nguyên theo đơn vị nhỏ nhất.
  - show: '<table class=''t''><tr><th>số tiền chuyển (USD)</th><th>SHA: người nhận
      được</th><th>thiếu so với hoá đơn (phí trung gian 15)</th><th>một phí cố định
      khác, 20 USD, chiếm (số minh hoạ)</th></tr><tr><td>1 000</td><td>985</td><td>15</td><td>2
      %</td></tr><tr><td>100 000 (gấp 100 lần)</td><td>99 985</td><td>15</td><td>0,02
      %</td></tr><tr><td>10 000 000 (gấp 10 000 lần)</td><td>9 999 985</td><td>15</td><td>0,0002
      %</td></tr></table>'
    clear: true
    say: Phí cố định đổi ý nghĩa theo quy mô. Phí cố định hai mươi đô la là một khoản
      khác với mười lăm đô la của trung gian, và ở cỡ lớn gấp mười nghìn lần chỉ còn
      chiếm hai phần mười nghìn của một phần trăm. Nhưng chỗ thiếu mười lăm đô la
      của cách chia phí không đổi. Vì hoá đơn chỉ tất toán khi nhận đủ, người nhận
      ở mọi cỡ vẫn phải xử lý chuyển bù.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_iban_mod97('GB82WEST12345698765423') == 49
  - 1000 - alg.bnx_fee(1000, 'SHA', 0, 15)[1] == 15
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người đã đi làm).</b> Chọn chia phí (SHA)
      cho một hoá đơn phải trả <b>đủ</b> 1 000 USD. Người nhận được 985 USD, hoá đơn
      còn nợ 15 USD và phải chuyển thêm một lần nữa, lại mất phí. Chọn OUR cũng <b>chưa
      chắc</b> nhận đủ.

      <br><span class="note">Phép thử: đối chiếu số tiền người nhận báo có với số
      trên hoá đơn; ngân hàng trung gian hoặc ngân hàng nhận <b>có thể</b> trừ phí
      kể cả khi chọn OUR.</span></div>

      '
    clear: true
    say: Lỗi thứ nhất, của người đã đi làm, là chọn chia phí cho hoá đơn phải trả
      đủ một nghìn đô la. Người nhận chỉ được chín trăm tám mươi lăm, còn thiếu mười
      lăm, phải chuyển thêm và lại mất phí. Chọn người gửi chịu hết cũng chưa chắc
      đủ, vì ngân hàng trung gian hoặc ngân hàng nhận vẫn có thể trừ phí, nên luôn
      đối chiếu số báo có.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Coi IBAN “qua phép
      chia 97” là <b>tài khoản đúng người</b>. Phép kiểm chỉ bắt lỗi gõ: đổi chỗ hai
      chữ số cuối thì dư 49, nhưng một số hợp lệ của người khác vẫn dư 1.

      <br><span class="note">Cách chữa: kiểm số trước khi gửi, rồi vẫn đối chiếu tên
      người nhận và xử lý lệnh bị trả về.</span></div>

      '
    say: Lỗi thứ hai, của người đã đi làm, là coi số tài khoản quốc tế qua phép chia
      chín mươi bảy là đúng người nhận. Phép kiểm chỉ bắt lỗi gõ, như đổi chỗ hai
      chữ số cuối thì dư bốn mươi chín, nhưng số hợp lệ của người khác vẫn dư một.
      Cách chữa là kiểm số rồi vẫn đối chiếu tên người nhận.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_iban_digits('GB82WEST12345698765423') == '3214282912345698765423161182'
  - alg.bnx_iban_mod97('GB82WEST12345698765423') == 49 and 49 != 1
  - alg.bnx_fx_vnd(2500, 25400) == 63500000
  - alg.bnx_fee(2500, 'SHA', 0, 20)[1] == 2480
  - alg.bnx_fee(2500, 'OUR', 0, 20)[1] == 2500
  - alg.bnx_nostro_entries('1000', '25400')[3][0] == 'USD' and alg.bnx_nostro_entries('1000',
    '25400')[3][2] == 0 and alg.bnx_nostro_entries('1000', '25400')[3][3] == 1000
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Khách
      gõ GB82WEST12345698765423 (hai chữ số cuối đổi chỗ). Chuỗi số sau khi xếp lại
      và đổi chữ là 3214282912345698765423161182, chia 97 dư 49. Hệ thống làm gì?</td></tr><tr><td>2</td><td>Chuyển
      2 500 USD, tỉ giá bán 25 400, chia phí, ngân hàng gửi không thu phí, trung gian
      trừ 20 USD (số minh hoạ). Khách trả bao nhiêu đồng, người nhận được bao nhiêu?</td></tr><tr><td>3</td><td>Quyết
      định: khách trả một hoá đơn phải nhận đủ 2 500 USD. Khuyên chọn người gửi chịu
      hết (OUR) hay chia phí (SHA)?</td></tr><tr><td>4</td><td>Ngân hàng A chuyển
      1 000 USD qua tài khoản nostro USD mở ở ngân hàng C. Sổ của A ghi Nợ hay Có,
      sổ của C ghi Nợ hay Có, ở tài khoản nào?</td></tr><tr><td>5</td><td>Lệnh chuyển
      tiền cho khách hàng, chọn chia phí: bản tin MT cũ và bản tin ISO 20022 mới gọi
      tên gì, và mã chịu phí viết thế nào?</td></tr></table>'
    pause: 40
    say: Đến lượt bạn, năm câu trên màn hình. Câu ba chọn cách chịu phí cho hoá đơn
      phải nhận đủ. Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: dư phải bằng 1 mới qua.</p>

      $$49 \neq 1 \;\Rightarrow\; \text{từ chối ngay, báo khách gõ lại}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    introduces:
    - neq
    - implies
    say: Đáp án câu một. Số dư phải bằng một mới qua, mà ở đây là bốn mươi chín, khác
      một. Dấu gạch chéo qua dấu bằng nghĩa là khác, mũi tên đôi nghĩa là suy ra.
      Vì vậy hệ thống từ chối ngay.
    clear: true
  - show: $$2\,500 \cdot 25\,400 = \hl{63\,500\,000} \text{ đồng};\quad 2\,500 - 20
      = \hlg{2\,480} \text{ USD}$$
    say: Đáp án câu hai. Khách trả hai nghìn năm trăm nhân hai mươi lăm nghìn bốn
      trăm, bằng sáu mươi ba triệu năm trăm nghìn đồng. Vì chia phí nên người nhận
      được hai nghìn năm trăm trừ hai mươi, bằng hai nghìn bốn trăm tám mươi đô la.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>người
      gửi chịu hết (OUR)</td><td>người nhận thường nhận đủ 2 500, hoá đơn thường tất
      toán một lần</td><td>khách trả thêm phí; phí trung gian khó biết trước; vẫn
      phải đối chiếu số báo có vì ngân hàng nhận có thể trừ phí</td></tr><tr><td>chia
      phí (SHA)</td><td>khách trả ít phí hơn</td><td>người nhận có thể thiếu, phải
      chuyển bù một lần nữa và lại mất phí</td></tr></table>
    say: Đáp án câu ba. Chọn người gửi chịu hết thì người nhận thường nhận đủ và hoá
      đơn thường tất toán một lần, đổi lại khách trả thêm phí. Chia phí thì khách
      trả ít hơn, nhưng người nhận có thể thiếu. Với hoá đơn phải nhận đủ, nên khuyên
      người gửi chịu hết.
    clear: true
  - show: '<table class=''t''><tr><th>câu</th><th>kết quả</th><th>vì sao</th></tr><tr><td>4</td><td>sổ
      A: ghi <b>Có</b> nostro USD tại C, giảm 1 000; sổ C: ghi <b>Nợ</b> vostro của
      A, giảm 1 000</td><td>nostro là tài sản của A, vostro là nợ phải trả của C:
      ghi Có giảm tài sản, ghi Nợ giảm nợ phải trả</td></tr><tr><td>5</td><td>MT103
      trường 71A = SHA; pacs.008 thẻ ChrgBr = SHAR</td><td>cùng một ý chia phí, nay
      có thẻ riêng trong bản tin có cấu trúc</td></tr></table>'
    clear: true
    say: Đáp án câu bốn. Sổ A ghi Có tài khoản ở nước ngoài, giảm một nghìn, vì đó
      là tài sản của A. Sổ C ghi Nợ tài khoản của A, cũng giảm một nghìn, vì đó là
      khoản C nợ A. Đáp án câu năm. Bản tin cũ ghi chia phí ở trường bảy mươi mốt
      A, còn bản tin mới ghi ở thẻ chịu phí.
- id: practice
  kind: practice
  title: 'Tự làm: đọc BIC, kiểm IBAN và tính ba cách chịu phí'
  steps:
  - show: '<p><b>Đề</b>: viết <code>mau.py</code> (Python, in không dấu), số liệu
      là số minh hoạ:</p>

      <ol><li>BIC <code>ABCDDEFFXXX</code>: tách mã tổ chức, mã quốc gia, mã địa điểm,
      mã chi nhánh và in một dòng</li>

      <li>IBAN <code>GB90BANK98765432101234</code> và bản đổi chỗ hai ký tự cuối:
      xếp lại (4 ký tự đầu ra cuối), đổi chữ thành số (A = 10 … Z = 35), chia 97 lấy
      dư; in dư và <code>hop le</code> (dư 1) hoặc <code>khong hop le</code></li>

      <li>chuyển 2 000 USD, phí ngân hàng gửi 8, phí trung gian 12: in số người nhận
      được theo OUR, SHA, BEN và số người gửi trả theo OUR</li></ol>

      <p class="note">Chữ in ra phải đúng từng ký tự như kết quả mong đợi.</p>

      '
    focus:
    - 1
    - 2
    - 3
    pause: 120
    say: Bây giờ tới phần bạn tự làm. Viết chương trình tách mã định danh ngân hàng
      thành bốn phần, kiểm một số tài khoản quốc tế và bản gõ nhầm của nó, rồi tính
      ba cách chịu phí cho hai nghìn đô la. Hãy dừng video và tự viết.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>BIC ABCDDEFFXXX: to
      chuc ABCD, quoc gia DE, dia diem FF, chi nhanh XXX</div><div>GB90BANK98765432101234:
      du 1 -&gt; hop le</div><div>GB90BANK98765432101243: du 50 -&gt; khong hop le</div><div>nguoi
      nhan: OUR 2000 SHA 1988 BEN 1980</div><div>nguoi gui tra: OUR 2020</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh BNX L11 mau.py</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> đổi từng ký tự bằng <code>str(int(c,
      36))</code>, ghép lại rồi <code>int(...) % 97</code>. Phí: OUR người gửi trả
      thêm cả hai phí; SHA trừ phí trung gian khỏi tiền nhận; BEN trừ cả hai.

      Lời giải đầy đủ ở <code>labs/BNX/L11/loi_giai.py</code> — chỉ mở sau khi bạn
      đã thử.</div>

      '
    say: Nếu kẹt, đổi từng ký tự thành số bằng cơ số ba mươi sáu, ghép lại rồi chia
      chín mươi bảy lấy dư. Về phí, người gửi chịu hết thì trả thêm cả hai phí, chia
      phí thì trừ phí trung gian khỏi tiền nhận, người nhận chịu thì trừ cả hai.
    clear: true
  lab: labs/BNX/L11
