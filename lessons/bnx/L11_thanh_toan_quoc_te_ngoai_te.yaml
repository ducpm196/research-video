scenes:
- id: hook
  kind: hook
  title: Chuyển 1 000 USD, người nhận chỉ thấy 985 USD
  checks:
  - alg.bnx_fx_vnd('1000', '25400') == 25400000
  - alg.bnx_fee(1000, 'SHA', 0, 15)[1] == 985
  - 1000 - alg.bnx_fee(1000, 'SHA', 0, 15)[1] == 15
  steps:
  - show: '<p>Khách ở Việt Nam chuyển <b>1 000 USD</b> trả học phí cho một trường
      ở Anh. Ngân hàng trừ <b>25 400 000 đồng</b> theo tỉ giá bán 25 400.</p>

      <div class="box key">Vài ngày sau trường báo chỉ nhận <b>985 USD</b>. 15 USD
      đi đâu, và có ai làm sai không?</div>

      <span class=''note''>(số minh hoạ — không phải tỉ giá hay biểu phí của ngân
      hàng nào)</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, một khách ở Việt Nam chuyển một nghìn đô la Mỹ trả học phí cho
      một trường ở Anh. Ngân hàng trừ của khách hai mươi lăm triệu bốn trăm nghìn
      đồng, theo tỉ giá bán hai mươi lăm nghìn bốn trăm, đây là số minh hoạ. Vài ngày
      sau, trường báo chỉ nhận chín trăm tám mươi lăm đô la. Mười lăm đô la đã đi
      đâu, và có ai làm sai không?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>phần trả lời trong bài</th></tr><tr><td>gửi
      tới đâu, số có bị gõ nhầm không</td><td>mã BIC của ngân hàng, số IBAN và phép
      kiểm chia 97</td></tr><tr><td>tiền đi qua những sổ nào</td><td>tài khoản nostro,
      vostro và bút toán hai đồng tiền</td></tr><tr><td>vì sao người nhận thiếu 15
      USD</td><td>tỉ giá và ba cách chịu phí OUR, SHA, BEN</td></tr><tr><td>lệnh được
      gửi bằng bản tin gì</td><td>từ 22/11/2025: ISO 20022, bản tin pacs.008 thay
      MT103</td></tr></table>'
    say: Bài này trả lời bốn câu hỏi. Thứ nhất, gửi tới ngân hàng nào, và số tài khoản
      có bị gõ nhầm không. Thứ hai, tiền đi qua những cuốn sổ nào. Thứ ba, vì sao
      người nhận thiếu mười lăm đô la. Thứ tư, lệnh chuyển tiền đi bằng loại bản tin
      nào, khi chuẩn mới bắt buộc từ ngày hai mươi hai tháng mười một năm hai nghìn
      không trăm hai mươi lăm.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 100 % 97 == 3 and 100 // 97 == 1
  - 'alg.bnx_balanced_by_ccy([(''VND'', ''A'', 500000, 0), (''VND'', ''B'', 0, 500000)])
    == {''VND'': 0}'
  - alg.bnx_minor_units('USD') == 2 and alg.bnx_minor_units('VND') == 0
  - str(alg.bnx_round('985', 'USD')) == '985.00'
  - alg.bnx_fx_vnd(1000, 25400) == 25400000
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Bút toán kép, Nợ và Có</td><td>mỗi giao dịch ghi ít nhất hai dòng, tổng Nợ bằng
      tổng Có; với tài khoản tiền gửi của khách: ghi Nợ là giảm, ghi Có là tăng; với
      tài sản của ngân hàng (như tiền gửi ở ngân hàng khác) thì ngược lại: ghi Nợ
      là tăng, ghi Có là giảm</td><td>A chuyển B 500 000: Nợ A 500 000, Có B 500 000</td></tr><tr><td>②
      Chia lấy dư</td><td>phần còn lại khi chia một số nguyên cho số khác</td><td>100
      chia 97 được 1, dư 3</td></tr><tr><td>③ Đơn vị nhỏ nhất của đồng tiền</td><td>ISO
      4217 ghi số chữ số lẻ: USD có 2 (cent), VND có 0</td><td>985,00 USD; 25 400
      000 đồng</td></tr><tr><td>④ Tỉ giá bán</td><td>số đồng khách trả để mua của
      ngân hàng 1 đơn vị ngoại tệ</td><td>1 USD = 25 400 đồng (số minh hoạ)</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Trong sổ sách ngân hàng, mỗi giao dịch ghi
      ít nhất hai dòng có tổng bằng không. Kế toán ngân hàng gọi hai phía là Nợ và
      Có, và tổng Nợ luôn bằng tổng Có. Với tài khoản tiền gửi của khách, ghi Nợ là
      giảm, ghi Có là tăng. Còn với tài sản của chính ngân hàng, như tiền ngân hàng
      gửi ở ngân hàng khác, thì ngược lại, ghi Nợ là tăng, ghi Có là giảm. Chia lấy
      dư là phần còn lại khi chia, ví dụ một trăm chia chín mươi bảy được một, dư
      ba. Theo chuẩn ISO bốn hai một bảy, đô la Mỹ có hai chữ số lẻ, còn đồng Việt
      Nam không có chữ số lẻ. Tỉ giá bán là số đồng khách trả để mua của ngân hàng
      một đơn vị ngoại tệ.
  - show: '$$1\,000 \cdot 25\,400 = 25\,400\,000 \text{ đồng}$$

      <span class=''note''>tỉ giá 25 400 là số minh hoạ</span>

      '
    focus:
    - 1
    - 2
    - 1
    clear: true
    say: Một ví dụ số. Mua một nghìn đô la với tỉ giá bán hai mươi lăm nghìn bốn trăm,
      đây là số minh hoạ. Dấu chấm giữa là phép nhân, nên khách trả một nghìn nhân
      hai mươi lăm nghìn bốn trăm, bằng hai mươi lăm triệu bốn trăm nghìn đồng.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã các từ của thanh toán quốc tế
  checks:
  - 'alg.bnx_bic_parts(''WESTGB2LXXX'') == {''to_chuc'': ''WEST'', ''quoc_gia'': ''GB'',
    ''dia_diem'': ''2L'', ''chi_nhanh'': ''XXX''}'
  - alg.bnx_bic_parts('WESTGB2L')['chi_nhanh'] == 'XXX' and len('WESTGB2L') == 8 and
    len('WESTGB2LXXX') == 11
  - len('GB82WEST12345698765432') == 22 and 'GB82WEST12345698765432'[:2] == 'GB'
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>Swift</td><td>mạng
      bản tin giữa các ngân hàng trên thế giới: chở <b>lệnh</b>, không chở tiền</td></tr><tr><td>BIC
      (ISO 9362)</td><td>mã định danh ngân hàng, 8 hoặc 11 ký tự</td></tr><tr><td>IBAN
      (ISO 13616)</td><td>số tài khoản quốc tế: 2 chữ quốc gia, 2 chữ số kiểm, rồi
      số tài khoản trong nước</td></tr><tr><td>nostro</td><td>tài khoản của <b>ta</b>
      mở ở ngân hàng nước ngoài (tiếng Ý: “của chúng tôi”)</td></tr><tr><td>vostro</td><td>cùng
      tài khoản đó nhìn từ ngân hàng giữ nó: tài khoản <b>của bạn</b> ở chỗ tôi</td></tr><tr><td>OUR,
      SHA, BEN</td><td>ai chịu phí: người gửi, chia hai bên, người nhận</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: 'Bảng này giải mã sáu từ. Mạng bản tin liên ngân hàng quốc tế chỉ chở lệnh
      chuyển tiền, không chở tiền. Mã định danh ngân hàng có tám hoặc mười một ký
      tự. Số tài khoản quốc tế gồm hai chữ quốc gia, hai chữ số kiểm, rồi số tài khoản
      trong nước. Tài khoản ngân hàng ta mở ở ngân hàng nước ngoài gọi theo tiếng
      Ý là của chúng tôi. Cùng tài khoản đó, nhìn từ ngân hàng đang giữ nó, gọi là
      của bạn. Ba mã cuối cho biết ai chịu phí: người gửi, chia hai bên, hay người
      nhận.'
  - show: <table class='t'><tr><th>phần của BIC</th><th>số ký tự</th><th>ví dụ WESTGB2LXXX
      (mã minh hoạ)</th></tr><tr><td>mã tổ chức</td><td>4</td><td>WEST</td></tr><tr><td>mã
      quốc gia (ISO 3166)</td><td>2 chữ cái</td><td>GB = Vương quốc Anh</td></tr><tr><td>mã
      địa điểm</td><td>2</td><td>2L</td></tr><tr><td>mã chi nhánh (tuỳ chọn)</td><td>3</td><td>XXX
      = trụ sở chính; bỏ đi còn 8 ký tự WESTGB2L</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    clear: true
    say: Mã định danh ngân hàng chia thành bốn phần. Bốn ký tự đầu là mã tổ chức,
      ở đây là W E S T. Hai chữ cái tiếp theo là mã quốc gia, G B là Vương quốc Anh.
      Hai ký tự sau là mã địa điểm. Ba ký tự cuối là mã chi nhánh, có thể bỏ. Ba chữ
      X nghĩa là trụ sở chính, nên bỏ đi thì còn tám ký tự, vẫn trỏ về trụ sở chính.
  - show: <p><b>Bản tin pacs.008 rút gọn (ISO 20022, dạng XML)</b></p><div class="code"><div>&lt;FIToFICstmrCdtTrf&gt;</div><div>  &lt;GrpHdr&gt;</div><div>    &lt;MsgId&gt;MSG-0001&lt;/MsgId&gt;</div><div>  &lt;/GrpHdr&gt;</div><div>  &lt;CdtTrfTxInf&gt;</div><div>    &lt;IntrBkSttlmAmt
      Ccy="USD"&gt;1000.00&lt;/IntrBkSttlmAmt&gt;</div><div>    &lt;ChrgBr&gt;SHAR&lt;/ChrgBr&gt;</div><div>    &lt;CdtrAgt&gt;&lt;FinInstnId&gt;</div><div>      &lt;BICFI&gt;WESTGB2L&lt;/BICFI&gt;</div><div>    &lt;/FinInstnId&gt;&lt;/CdtrAgt&gt;</div><div>  &lt;/CdtTrfTxInf&gt;</div><div>&lt;/FIToFICstmrCdtTrf&gt;</div></div>
    focus:
    - 2
    - '2.3'
    - '2.6'
    - '2.7'
    - '2.9'
    clear: true
    say: Đây là bản tin chuyển tiền cho khách hàng theo chuẩn ISO hai không không
      hai hai, viết bằng XML và đã rút gọn. Phần nhóm đầu chứa mã bản tin. Phần thông
      tin giao dịch chứa số tiền thanh toán liên ngân hàng, kèm thuộc tính đồng tiền
      là đô la Mỹ. Thẻ người chịu phí ghi chia hai bên. Cuối cùng là ngân hàng của
      người nhận, nhận diện bằng mã tám ký tự vừa giải mã.
