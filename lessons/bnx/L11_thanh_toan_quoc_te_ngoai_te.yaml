      trường, nay tách thành các thẻ riêng. Địa chỉ cũng tách thành từng phần có cấu
      trúc.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: kiểm IBAN, đổi tiền, ghi sổ'
  checks:
  - alg.bnx_iban_digits('GB82WEST12345698765432') == '3214282912345698765432161182'
  - alg.bnx_iban_mod97('GB82WEST12345698765432') == 1
  - len('WEST12345698765432GB82') == 22 and 'GB82WEST12345698765432'[4:] + 'GB82'
    == 'WEST12345698765432GB82'
  - '[ord(c) - 55 for c in ''WESTGB''] == [32, 14, 28, 29, 16, 11]'
  - alg.bnx_iban_check_digits('GB', 'WEST12345698765432') == ('82', 16)
  - alg.bnx_fx_vnd('1000', '25400') == 25400000 and str(alg.bnx_fee('1000', 'SHA',
    0, 15)[1]) == '985.00'
  - 'alg.bnx_balanced_by_ccy(alg.bnx_nostro_entries(''1000'', ''25400'')) == {''VND'':
    0, ''USD'': 0}'
  - '[e[2] or e[3] for e in alg.bnx_nostro_entries(''1000'', ''25400'')] == [25400000,
    25400000, 1000, 1000]'
  steps:
  - show: '<p><b>Bước 1.</b> Đưa 4 ký tự đầu <b>GB82</b> ra cuối: <code>WEST12345698765432GB82</code>.
      Vì số kiểm được tính khi mã quốc gia và số kiểm đứng sau cùng, ta phải xếp lại
      đúng như lúc tính.</p>

      <span class=''note''>Làm thử: chuỗi vẫn đủ 22 ký tự.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, ta đưa bốn ký tự đầu ra cuối chuỗi. Vì số kiểm được tính khi mã
      quốc gia và hai chữ số kiểm đứng sau cùng, nên ta phải xếp lại đúng như lúc
      tính. Làm thử, chuỗi mới vẫn đủ hai mươi hai ký tự.
  - show: '<p><b>Bước 2.</b> Đổi mỗi chữ cái thành số: A = 10, B = 11, …, Z = 35.
      Vì phép chia chỉ làm trên số, chữ phải thành số theo một bảng cố định.</p>

      <span class=''note''>Làm thử: W = 32, E = 14, S = 28, T = 29, G = 16, B = 11
      nên đầu chuỗi WEST thành 32142829.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, ta đổi mỗi chữ cái thành số, A là mười, B là mười một, cứ thế tới
      Z là ba mươi lăm. Vì phép chia chỉ làm trên số, nên chữ phải đổi thành số theo
      một bảng cố định. Làm thử, bốn chữ W E S T thành ba mươi hai, mười bốn, hai
      mươi tám, hai mươi chín.
  - show: '<p><b>Bước 3. Chia cho 97 lấy dư: đúng thì dư bằng 1</b></p><div class="code"><div>iban
      = "GB82WEST12345698765432"</div><div>s = iban[4:] + iban[:4]     # đưa 4 ký
      tự đầu ra cuối</div><div>so = ""</div><div>for c in s:</div><div>    so += str(int(c,
      36))   # chữ số giữ nguyên, A=10 … Z=35</div><div>print(s)</div><div>print(so)</div><div>print(int(so)
      % 97)</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>WEST12345698765432GB82</div><div>3214282912345698765432161182</div><div>1</div></div>'
    focus:
    - 1
    - 2
    - '2.5'
    - 4
    - '4.3'
    clear: true
    say: Bước ba, ta cho Python làm cả ba việc. Câu lệnh thứ hai xếp lại chuỗi, vòng
      lặp đổi từng ký tự thành số theo cơ số ba mươi sáu. Cơ số ba mươi sáu là hệ
      đếm dùng mười chữ số rồi hai mươi sáu chữ cái, nên A là mười và Z là ba mươi
      lăm. Máy in chuỗi đã xếp, chuỗi hai mươi tám chữ số, và số dư khi chia chín
      mươi bảy bằng một. Vì dư bằng một, nên số này qua phép kiểm.
  - show: '<p><b>Bước 4.</b> Vì sao đúng thì dư bằng 1? Vì người lập IBAN chọn số
      kiểm sao cho dư bằng 1: đặt <code>00</code> vào chỗ số kiểm, lấy dư $r$, rồi
      số kiểm $= 98 - r$.</p>

      $$98 - 16 = 82$$

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    clear: true
    say: Bước bốn, vì sao đúng thì dư bằng một? Vì người lập số tài khoản quốc tế
      đã chọn hai chữ số kiểm sao cho dư bằng một. Họ đặt hai số không vào chỗ số
      kiểm và lấy số dư khi chia chín mươi bảy, ở đây là mười sáu. Chín mươi tám trừ
      mười sáu bằng tám mươi hai, đúng hai chữ số kiểm của mẫu.
  - show: '<p><b>Bước 5. Đổi tiền bằng số thập phân chính xác, làm tròn theo từng
      đồng tiền</b></p><div class="code"><div>from decimal import Decimal, ROUND_HALF_UP</div><div>CHU_SO_LE
      = {"USD": 2, "VND": 0}          # ISO 4217</div><div>def tron(x, ccy):</div><div>    mau
      = Decimal(1).scaleb(-CHU_SO_LE[ccy])</div><div>    return x.quantize(mau, rounding=ROUND_HALF_UP)</div><div>usd
      = tron(Decimal("1000"), "USD")</div><div>ti_gia = Decimal("25400")                 #
      tỉ giá bán, số minh hoạ</div><div>print(usd, "USD -&gt;", tron(usd * ti_gia,
      "VND"), "VND")</div><div>phi = tron(Decimal("15"), "USD")          # phí trung
      gian, minh hoạ</div><div>print("SHA: người nhận", tron(usd - phi, "USD"), "USD")</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>1000.00 USD -&gt; 25400000 VND</div><div>SHA:
      người nhận 985.00 USD</div></div>'
    focus:
    - 1
    - '2.1'
    - '2.2'
    - 4
    clear: true
    say: Bước năm là đổi tiền. Vì số thực dấu phẩy động không biểu diễn đúng nhiều
      số thập phân như không phẩy một, nên ta dùng kiểu số thập phân chính xác của
      Python. Hàm làm tròn lấy số chữ số lẻ theo chuẩn ISO bốn hai một bảy, đô la
      tới từng xu, đồng Việt Nam tới từng đồng. Máy in một nghìn đô la thành hai mươi
      lăm triệu bốn trăm nghìn đồng, và người nhận được chín trăm tám mươi lăm đô
      la khi trung gian trừ mười lăm đô la.
  - show: <table class='t'><tr><th>đồng tiền</th><th>tài khoản (tên minh hoạ)</th><th>Nợ</th><th>Có</th></tr><tr><td>VND</td><td>tiền
      gửi của khách</td><td>25 400 000</td><td></td></tr><tr><td>VND</td><td>mua bán
      ngoại tệ (VND)</td><td></td><td>25 400 000</td></tr><tr><td>USD</td><td>mua
      bán ngoại tệ (USD)</td><td>1 000</td><td></td></tr><tr><td>USD</td><td>nostro
      USD tại ngân hàng C</td><td></td><td>1 000</td></tr></table>
    focus:
    - 0
    - 0
    - - '1.2'
      - '1.3'
    - - '1.4'
      - '1.5'
    clear: true
    say: Bước sáu là ghi sổ ở ngân hàng A, và mỗi đồng tiền phải tự cân. Vì không
      thể cộng đô la với đồng, nên ta tách hai vế qua một tài khoản mua bán ngoại
      tệ. Vế đồng Việt Nam, ghi Nợ tiền gửi của khách hai mươi lăm triệu bốn trăm
      nghìn, tức là trừ tiền khách, và ghi Có tài khoản mua bán ngoại tệ cùng số đó.
      Vế đô la, ghi Nợ tài khoản mua bán ngoại tệ một nghìn, ghi Có tài khoản ở nước
      ngoài một nghìn, vì tiền của A ở ngân hàng C giảm đi.
- id: example
  kind: example
  title: Ví dụ 1 000 USD với ba cách chịu phí, từng phép tính
  checks:
  - alg.bnx_fx_vnd(1000, 25400) == 25400000
  - alg.bnx_fee(1000, 'SHA', 5, 15) == (alg.bnx_round(1005, 'USD'), alg.bnx_round(985,
    'USD'))
  - alg.bnx_fee(1000, 'OUR', 5, 15) == (alg.bnx_round(1020, 'USD'), alg.bnx_round(1000,
    'USD'))
  - alg.bnx_fx_vnd(alg.bnx_fee(1000, 'OUR', 5, 15)[0], 25400) == 25908000
  - alg.bnx_fx_vnd(alg.bnx_fee(1000, 'OUR', 5, 15)[0], 25400) - alg.bnx_fx_vnd(1000,
    25400) == 508000
  - alg.bnx_fee(1000, 'BEN', 5, 15)[1] == 980
  steps:
  - show: '<p>Chuyển <b>1 000 USD</b>, tỉ giá bán <b>25 400</b>, phí của trung gian
      <b>15 USD</b>, phí của ngân hàng gửi <b>5 USD</b>. <span class=''note''>(số
      minh hoạ — không phải tỉ giá hay biểu phí của ngân hàng nào)</span></p>

      $$① \; 1\,000 \cdot 25\,400 = \hl{25\,400\,000} \text{ đồng tiền gốc, chưa tính
      phí}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Ta tính từng phép. Chuyển một nghìn đô la, tỉ giá bán hai mươi lăm nghìn
      bốn trăm, phí trung gian mười lăm đô la, phí ngân hàng gửi năm đô la, đều là
      số minh hoạ. Phép tính thứ nhất, tiền gốc chưa tính phí là một nghìn nhân hai
      mươi lăm nghìn bốn trăm, bằng hai mươi lăm triệu bốn trăm nghìn đồng.
  - show: '<p>Chia phí (SHA): người gửi trả phí ngân hàng mình riêng; phí trung gian
      trừ vào tiền chuyển.</p>

      $$② \; 1\,000 - 15 = \hl{985} \text{ USD người nhận được}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ hai, với cách chia phí, người gửi trả phí ngân hàng của mình
      riêng, còn phí trung gian trừ thẳng vào tiền chuyển. Vì vậy người nhận được
      một nghìn trừ mười lăm, bằng chín trăm tám mươi lăm đô la. Đó chính là con số
      trường báo ở đầu bài.
  - show: '<p>Người gửi chịu hết (OUR): người nhận được đủ 1 000; người gửi trả thêm
      phí ngân hàng mình và phí trung gian.</p>

      $$③ \; 1\,000 + 5 + 15 = \hl{1\,020} \text{ USD người gửi trả}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ ba, với cách người gửi chịu hết, người nhận được đủ một nghìn
      đô la. Người gửi trả một nghìn cộng năm cộng mười lăm, bằng một nghìn không
      trăm hai mươi đô la.
  - show: '<p>Dùng lại $1\,020$ ở phép ③, đổi ra đồng:</p>

      $$④ \; 1\,020 \cdot 25\,400 = \hl{25\,908\,000} \text{ đồng, hơn tiền gốc ở
      phép ① là } 508\,000$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, dùng lại một nghìn không trăm hai mươi đô la, nhân hai
      mươi lăm nghìn bốn trăm, bằng hai mươi lăm triệu chín trăm lẻ tám nghìn đồng.
      So với tiền gốc ở phép thứ nhất, khách trả thêm năm trăm lẻ tám nghìn đồng,
      chính là tiền phí để trường nhận đủ.
  - show: '<p>Người nhận chịu hết (BEN): cả phí ngân hàng gửi lẫn phí trung gian trừ
      vào tiền chuyển.</p>

      $$⑤ \; 1\,000 - 5 - 15 = \hlg{980} \text{ USD người nhận được}$$

      '
    focus:
    - 1
    - 2
    say: Phép tính thứ năm, với cách người nhận chịu hết, cả hai khoản phí đều trừ
      vào tiền chuyển. Người nhận được một nghìn trừ năm trừ mười lăm, bằng chín trăm
      tám mươi đô la.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: chia từng chữ số, đổi ngược, cộng sổ'
  checks:
  - '(lambda s: __import__(''functools'').reduce(lambda d, c: (d * 10 + int(c)) %
    97, s, 0))(alg.bnx_iban_digits(''GB82WEST12345698765432'')) == 1'
  - alg.bnx_fx_vnd(1000, 25400) // 25400 == 1000 and alg.bnx_fx_vnd(1000, 25400) %
    25400 == 0
  - alg.bnx_fee(1000, 'SHA', 0, 15)[1] + 15 == 1000
  - set(alg.bnx_balanced_by_ccy(alg.bnx_nostro_entries('1000', '25400')).values())
    == {0}
  steps:
  - show: '<p><b>Đường khác: không dựng số 28 chữ số, chỉ mang số dư qua từng chữ
      số</b></p><div class="code"><div>so = "3214282912345698765432161182"</div><div>du
      = 0</div><div>for c in so:</div><div>    du = (du * 10 + int(c)) % 97   # chỉ
      giữ số dư, số luôn nhỏ</div><div>print(du)</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>1</div></div>'
    focus:
    - 2
    - '2.4'
    - '2.4'
    - 4
    - 0
    say: Kiểm bằng đường khác. Thay vì dựng một số hai mươi tám chữ số, ta đi qua
      từng chữ số và chỉ giữ số dư. Mỗi bước nhân số dư cũ với mười, cộng chữ số mới,
      rồi chia chín mươi bảy lấy dư, vì phép lấy dư đi qua được phép cộng và phép
      nhân. Máy in một, khớp với cách tính cả số. Cách này còn dùng được ở ngôn ngữ
      không có số nguyên lớn.
  - show: '<table class=''t''><tr><th>điều cần kiểm</th><th>đường khác</th><th>kết
      quả</th></tr><tr><td>① 25 400 000 đồng</td><td>chia ngược: 25 400 000 ÷ 25 400</td><td>=
      1 000 USD</td></tr><tr><td>② 985 USD (SHA)</td><td>cộng lại: 985 + 15</td><td>=
      1 000 USD</td></tr><tr><td>bút toán ở bước 6</td><td>tổng Nợ trừ tổng Có, từng
      đồng tiền</td><td>VND: 0; USD: 0</td></tr></table>'
    clear: true
    say: Bảng này kiểm ba kết quả còn lại bằng phép ngược. Vì phép chia ngược phép
      nhân, hai mươi lăm triệu bốn trăm nghìn chia ngược cho tỉ giá được đúng một
      nghìn đô la. Chín trăm tám mươi lăm cộng mười lăm phí được đúng một nghìn. Còn
      bút toán ở bước sáu, tổng Nợ trừ tổng Có của từng đồng tiền đều bằng không.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_float_demo()[0] != 0.3 and repr(alg.bnx_float_demo()[0]) == '0.30000000000000004'
  - alg.bnx_float_demo()[1] == 2.67 and str(alg.bnx_float_demo()[2]) == '2.68'
  - __import__('decimal').Decimal(2.675) < __import__('decimal').Decimal('2.675')
  - alg.bnx_iban_mod97('GB82WEST12345698765423') == 49
  - 1000 - alg.bnx_fee(1000, 'SHA', 0, 15)[1] == 15
  steps:
  - show: '<p><b>Lỗi 1 (người mới): tính tiền bằng số thực dấu phẩy động</b></p><div
      class="code"><div>from decimal import Decimal, ROUND_HALF_UP</div><div>print(0.1
      + 0.2)</div><div>print(round(2.675, 2))</div><div>x = Decimal("2.675")</div><div>print(x.quantize(Decimal("0.01"),
      rounding=ROUND_HALF_UP))</div></div><p><b>Kết quả chạy thật</b></p><div class="code"><div>0.30000000000000004</div><div>2.67</div><div>2.68</div></div>'
    focus:
    - 1
    - '4.1'
    - '4.2'
    - '4.3'
    - 0
    say: Lỗi thứ nhất, của người mới, là tính tiền bằng số thực dấu phẩy động. Máy
      in không phẩy một cộng không phẩy hai thành một số lẻ dài, không phải không
      phẩy ba. Làm tròn hai phẩy sáu trăm bảy mươi lăm tới hai chữ số lại ra hai phẩy
      sáu bảy, vì số đó được lưu là hai phẩy sáu bảy bốn chín chín chín. Kiểu số thập
      phân chính xác cho đúng hai phẩy sáu tám. Phép thử bắt lỗi này là đối chiếu
      với cách tính bằng số nguyên theo xu.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Chọn chia phí (SHA)
      cho một hoá đơn phải trả <b>đủ</b> 1 000 USD. Người nhận được 985 USD, hoá đơn
      còn nợ 15 USD và phải chuyển thêm một lần nữa, lại mất phí.

      <br><span class="note">Phép thử: đối chiếu số tiền người nhận báo có với số
      trên hoá đơn; ngân hàng trung gian <b>có thể</b> trừ phí.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là chọn chia phí cho một hoá đơn phải trả
      đủ một nghìn đô la. Người nhận chỉ được chín trăm tám mươi lăm, hoá đơn còn
      thiếu mười lăm, và phải chuyển thêm một lần nữa, lại mất phí. Phép thử là đối
      chiếu số người nhận báo có với số trên hoá đơn, vì ngân hàng trung gian có thể
      trừ phí.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Coi IBAN “qua phép
      chia 97” là <b>tài khoản đúng người</b>. Phép kiểm chỉ bắt lỗi gõ: đổi chỗ hai
      chữ số cuối thì dư 49, nhưng một số hợp lệ của người khác vẫn dư 1.

      <br><span class="note">Cách chữa: kiểm số trước khi gửi, rồi vẫn đối chiếu tên
      người nhận và xử lý lệnh bị trả về.</span></div>

      '
    say: Lỗi thứ ba, cũng của người đã đi làm, là coi số tài khoản quốc tế qua phép
      chia chín mươi bảy là đúng người nhận. Phép kiểm chỉ bắt lỗi gõ, ví dụ đổi chỗ
      hai chữ số cuối thì số dư thành bốn mươi chín. Nhưng một số hợp lệ của người
      khác vẫn cho dư một. Cách chữa là kiểm số trước khi gửi, rồi vẫn đối chiếu tên
      người nhận và xử lý lệnh bị trả về.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_iban_digits('GB82WEST12345698765423') == '3214282912345698765423161182'
  - alg.bnx_iban_mod97('GB82WEST12345698765423') == 49 and 49 != 1
  - alg.bnx_fx_vnd(2500, 25400) == 63500000
  - alg.bnx_fee(2500, 'SHA', 0, 20)[1] == 2480
  - alg.bnx_fee(2500, 'OUR', 0, 20)[1] == 2500
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Khách
      gõ GB82WEST12345698765423 (hai chữ số cuối đổi chỗ). Chuỗi số sau khi xếp lại
      và đổi chữ là 3214282912345698765423161182, chia 97 dư 49. Hệ thống làm gì?</td></tr><tr><td>2</td><td>Chuyển
      2 500 USD, tỉ giá bán 25 400, chia phí, ngân hàng gửi không thu phí, trung gian
      trừ 20 USD (số minh hoạ). Khách trả bao nhiêu đồng, người nhận được bao nhiêu?</td></tr><tr><td>3</td><td>Quyết
      định: khách trả một hoá đơn phải nhận đủ 2 500 USD. Khuyên chọn người gửi chịu
      hết (OUR) hay chia phí (SHA)?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, khách gõ nhầm, đổi chỗ hai chữ
      số cuối, và chuỗi số sau khi xếp lại chia chín mươi bảy dư bốn mươi chín. Hệ
      thống nên làm gì? Câu hai, chuyển hai nghìn năm trăm đô la, tỉ giá bán hai mươi
      lăm nghìn bốn trăm, chia phí, ngân hàng gửi không thu phí, trung gian trừ hai
      mươi đô la. Khách trả bao nhiêu đồng, người nhận được bao nhiêu? Câu ba, khách
      trả một hoá đơn phải nhận đủ hai nghìn năm trăm đô la. Bạn khuyên chọn người
      gửi chịu hết hay chia phí? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1: dư phải bằng 1 mới qua.</p>

      $$49 \neq 1 \;\Rightarrow\; \text{từ chối ngay, báo khách gõ lại}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    introduces:
    - neq
    - implies
    say: Đáp án câu một. Số dư phải bằng một mới qua, mà ở đây là bốn mươi chín, khác
      một. Dấu gạch chéo qua dấu bằng nghĩa là khác, mũi tên đôi nghĩa là suy ra.
      Vì vậy hệ thống từ chối ngay khi khách nhập, chưa gửi lệnh nào, và yêu cầu khách
      gõ lại.
    clear: true
  - show: $$2\,500 \cdot 25\,400 = \hl{63\,500\,000} \text{ đồng};\quad 2\,500 - 20
      = \hlg{2\,480} \text{ USD}$$
    say: Đáp án câu hai. Khách trả hai nghìn năm trăm nhân hai mươi lăm nghìn bốn
      trăm, bằng sáu mươi ba triệu năm trăm nghìn đồng. Vì chia phí nên phí trung
      gian trừ vào tiền chuyển, người nhận được hai nghìn năm trăm trừ hai mươi, bằng
      hai nghìn bốn trăm tám mươi đô la.
  - show: <table class='t'><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>người
      gửi chịu hết (OUR)</td><td>người nhận nhận đủ 2 500, hoá đơn tất toán một lần</td><td>khách
      trả thêm phí; phí trung gian khó biết trước</td></tr><tr><td>chia phí (SHA)</td><td>khách
      trả ít phí hơn</td><td>người nhận có thể thiếu, phải chuyển bù một lần nữa và
      lại mất phí</td></tr></table>
    say: Đáp án câu ba. Chọn người gửi chịu hết thì người nhận nhận đủ và hoá đơn
      tất toán một lần, đổi lại khách trả thêm phí, mà phí trung gian khó biết trước.
      Chọn chia phí thì khách trả ít phí hơn, nhưng người nhận có thể thiếu và phải
      chuyển bù, lại mất phí. Với hoá đơn phải nhận đủ, nên khuyên người gửi chịu
      hết.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>BIC + IBAN (kiểm chia 97)</span><span
      class='a'>→</span><span class='n'>bản tin pacs.008</span><span class='a'>→</span><span
      class='n'>nostro ở A = vostro ở C</span><span class='a'>→</span><span class='n'>tỉ
      giá + phí OUR/SHA/BEN</span><span class='a'>→</span><span class='n'>số thập
      phân, làm tròn theo ISO 4217</span></div>
    focus:
    - 0
    - '1.1'
    - '1.3'
    - '1.5'
    - '1.7'
    - '1.9'
    say: Tổng kết chuỗi logic. Mã định danh ngân hàng và số tài khoản quốc tế cho
      biết gửi tới đâu, và phép chia chín mươi bảy bắt lỗi gõ. Lệnh đi bằng bản tin
      chuẩn ISO hai không không hai hai. Tiền đi qua tài khoản mà ngân hàng gửi gọi
      là của chúng tôi, còn ngân hàng giữ gọi là của bạn. Số tiền phụ thuộc tỉ giá
      và cách chịu phí. Mọi phép tính dùng số thập phân chính xác, làm tròn theo đơn
      vị nhỏ nhất của từng đồng tiền.
  - show: <div class='box key'><b>Tư duy:</b> trong thanh toán quốc tế, <b>lệnh</b>
      và <b>tiền</b> đi hai đường khác nhau. Lệnh đi bằng bản tin; tiền chỉ đổi số
      dư trong sổ của từng ngân hàng, và mỗi trạm có thể trừ phí.</div>
    say: Điều cần mang theo. Trong thanh toán quốc tế, lệnh và tiền đi hai đường khác
      nhau. Lệnh đi bằng bản tin, còn tiền chỉ đổi số dư trong sổ của từng ngân hàng,
      và mỗi trạm có thể trừ phí.
  - show: '<p class=''small''>Bài sau: ví điện tử và nộp thuế điện tử — tiền trong
      ví thật ra nằm ở đâu, và khi nào một khoản nộp thuế mới thật sự xong.</p>'
    forward_ref: true
    say: Ở bài sau, ta học về ví điện tử và nộp thuế điện tử, tức là tiền trong ví
      thật ra nằm ở đâu, và khi nào một khoản nộp thuế mới thật sự xong.
