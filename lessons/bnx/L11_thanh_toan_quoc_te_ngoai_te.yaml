scenes:
- id: hook
  kind: hook
  title: Chuyển 1 000 USD, người nhận chỉ thấy 985 USD
  checks:
  - alg.bnx_fx_vnd('1000', '25400') == 25400000
  - alg.bnx_fee(1000, 'SHA', 0, 15)[1] == 985
  - 1000 - alg.bnx_fee(1000, 'SHA', 0, 15)[1] == 15
  steps:
  - show: '<p>Khách ở Việt Nam chuyển <b>1 000 USD</b> trả học phí cho một trường
      ở Anh. Ngân hàng trừ <b>25 400 000 đồng</b> theo tỉ giá bán 25 400.</p>

      <div class="box key">Vài ngày sau trường báo chỉ nhận <b>985 USD</b>. 15 USD
      đi đâu, và có ai làm sai không?</div>

      <span class=''note''>(số minh hoạ — không phải tỉ giá hay biểu phí của ngân
      hàng nào)</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, một khách ở Việt Nam chuyển một nghìn đô la Mỹ trả học phí cho
      một trường ở Anh. Ngân hàng trừ hai mươi lăm triệu bốn trăm nghìn đồng, theo
      tỉ giá bán minh hoạ hai mươi lăm nghìn bốn trăm. Vài ngày sau trường báo chỉ
      nhận chín trăm tám mươi lăm đô la. Mười lăm đô la đã đi đâu?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>phần trả lời trong bài</th></tr><tr><td>gửi
      tới đâu, số có bị gõ nhầm không</td><td>mã <b>BIC</b> (mã định danh ngân hàng),
      số <b>IBAN</b> (số tài khoản quốc tế) và phép kiểm chia 97</td></tr><tr><td>tiền
      đi qua những sổ nào</td><td>tài khoản <b>nostro</b> (tài khoản của ta mở ở ngân
      hàng nước ngoài), vostro và bút toán hai đồng tiền</td></tr><tr><td>vì sao người
      nhận thiếu 15 USD</td><td>tỉ giá và ba cách chịu phí OUR, SHA, BEN</td></tr><tr><td>lệnh
      được gửi bằng bản tin gì</td><td>từ 22/11/2025: chuẩn bản tin <b>ISO 20022</b>,
      pacs.008 thay MT103</td></tr></table>'
    introduces:
    - bnx_bic
    - bnx_iban
    - bnx_nostro
    - bnx_iso20022
    say: Bài này trả lời bốn câu hỏi. Số tài khoản có bị gõ nhầm không, tiền đi qua
      những cuốn sổ nào, vì sao người nhận thiếu mười lăm đô la, và lệnh đi bằng loại
      bản tin nào.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 100 % 97 == 3 and 100 // 97 == 1
  - 'alg.bnx_balanced_by_ccy([(''VND'', ''A'', 500000, 0), (''VND'', ''B'', 0, 500000)])
    == {''VND'': 0}'
  - alg.bnx_minor_units('USD') == 2 and alg.bnx_minor_units('VND') == 0
  - str(alg.bnx_round('985', 'USD')) == '985.00'
  - alg.bnx_fx_vnd(1000, 25400) == 25400000
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Bút toán kép, Nợ và Có</td><td>mỗi giao dịch ghi ít nhất hai dòng, tổng Nợ bằng
      tổng Có; với tài khoản tiền gửi của khách: ghi Nợ là giảm, ghi Có là tăng; với
      tài sản của ngân hàng (như tiền gửi ở ngân hàng khác) thì ngược lại: ghi Nợ
      là tăng, ghi Có là giảm</td><td>A chuyển B 500 000: Nợ A 500 000, Có B 500 000</td></tr><tr><td>②
      Chia lấy dư</td><td>phần còn lại khi chia một số nguyên cho số khác</td><td>100
      chia 97 được 1, dư 3</td></tr><tr><td>③ Đơn vị nhỏ nhất của đồng tiền</td><td>ISO
      4217 ghi số chữ số lẻ: USD có 2 (cent), VND có 0</td><td>985,00 USD; 25 400
      000 đồng</td></tr><tr><td>④ Tỉ giá bán</td><td>số đồng khách trả để mua của
      ngân hàng 1 đơn vị ngoại tệ</td><td>1 USD = 25 400 đồng (số minh hoạ)</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều. Kế toán gọi hai phía là Nợ và Có, và tổng
      Nợ bằng tổng Có. Với tiền gửi của khách, ghi Nợ là giảm, ghi Có là tăng, còn
      với tài sản của chính ngân hàng thì ngược lại. Chia lấy dư là phần còn lại khi
      chia, một trăm chia chín mươi bảy dư ba. Theo chuẩn ISO bốn hai một bảy, đô
      la Mỹ có hai chữ số lẻ, còn đồng Việt Nam không có. Tỉ giá bán là số đồng khách
      trả để mua một đơn vị ngoại tệ.
  - show: '$$1\,000 \cdot 25\,400 = 25\,400\,000 \text{ đồng}$$

      <span class=''note''>tỉ giá 25 400 là số minh hoạ</span>

      '
    focus:
    - 1
    - 2
    - 1
    clear: true
    say: Một ví dụ số. Mua một nghìn đô la với tỉ giá bán hai mươi lăm nghìn bốn trăm,
      đây là số minh hoạ. Dấu chấm giữa là phép nhân, nên kết quả là hai mươi lăm
      triệu bốn trăm nghìn đồng.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã các từ của thanh toán quốc tế
  checks:
  - 'alg.bnx_bic_parts(''WESTGB2LXXX'') == {''to_chuc'': ''WEST'', ''quoc_gia'': ''GB'',
    ''dia_diem'': ''2L'', ''chi_nhanh'': ''XXX''}'
  - alg.bnx_bic_parts('WESTGB2L')['chi_nhanh'] == 'XXX' and len('WESTGB2L') == 8 and
    len('WESTGB2LXXX') == 11
  - len('GB82WEST12345698765432') == 22 and 'GB82WEST12345698765432'[:2] == 'GB'
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>Swift</td><td>mạng
      bản tin giữa các ngân hàng trên thế giới: chở <b>lệnh</b>, không chở tiền</td></tr><tr><td>BIC
      (ISO 9362)</td><td>mã định danh ngân hàng, 8 hoặc 11 ký tự</td></tr><tr><td>IBAN
      (ISO 13616)</td><td>số tài khoản quốc tế: 2 chữ quốc gia, 2 chữ số kiểm, rồi
      số tài khoản trong nước</td></tr><tr><td>nostro</td><td>tài khoản của <b>ta</b>
      mở ở ngân hàng nước ngoài (tiếng Ý: “của chúng tôi”)</td></tr><tr><td>vostro</td><td>cùng
      tài khoản đó nhìn từ ngân hàng giữ nó: tài khoản <b>của bạn</b> ở chỗ tôi</td></tr><tr><td>OUR,
      SHA, BEN</td><td>ai chịu phí: người gửi, chia hai bên, người nhận</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.7'
    say: Bảng này giải mã sáu từ. Mạng bản tin giữa các ngân hàng chỉ chở lệnh chuyển
      tiền, không chở tiền. Mã định danh ngân hàng dài tám hoặc mười một ký tự. Số
      tài khoản quốc tế gồm hai chữ quốc gia, hai chữ số kiểm, rồi số tài khoản trong
      nước. Tài khoản của chúng tôi là tài khoản mình mở ở ngân hàng nước ngoài, còn
      tài khoản của bạn là chính nó nhìn từ ngân hàng giữ. Ba mã cuối cho biết ai
      chịu phí.
  - show: <table class='t'><tr><th>phần của BIC</th><th>số ký tự</th><th>ví dụ WESTGB2LXXX
      (mã minh hoạ)</th></tr><tr><td>mã tổ chức</td><td>4</td><td>WEST</td></tr><tr><td>mã
      quốc gia (ISO 3166)</td><td>2 chữ cái</td><td>GB = Vương quốc Anh</td></tr><tr><td>mã
      địa điểm</td><td>2</td><td>2L</td></tr><tr><td>mã chi nhánh (tuỳ chọn)</td><td>3</td><td>XXX
      = trụ sở chính; bỏ đi còn 8 ký tự WESTGB2L</td></tr></table>
    clear: true
    say: Mã định danh ngân hàng chia thành bốn phần. Bốn ký tự đầu là mã tổ chức,
      W E S T. Hai chữ cái tiếp theo là mã quốc gia, G B là Vương quốc Anh. Hai ký
      tự sau là mã địa điểm, và ba ký tự cuối là mã chi nhánh, có thể bỏ.
  - show: '<table class=''t''><tr><th>viết trong thẻ</th><th>đọc là</th><th>trong
      ví dụ</th></tr><tr><td><code>&lt;GrpHdr&gt;</code> chứa <code>&lt;MsgId&gt;</code></td><td>phần
      đầu của cả bản tin; <code>MsgId</code> là mã bản tin</td><td><code>MSG-0001</code></td></tr><tr><td><code>&lt;CdtTrfTxInf&gt;</code>
      chứa <code>&lt;IntrBkSttlmAmt Ccy=&quot;USD&quot;&gt;</code></td><td>thông tin
      một giao dịch; số tiền giữa hai ngân hàng, thuộc tính <code>Ccy</code> ghi đồng
      tiền</td><td><code>1000.00</code> đô la Mỹ</td></tr><tr><td><code>&lt;ChrgBr&gt;</code></td><td>bên
      chịu phí: <code>DEBT</code> người gửi, <code>SHAR</code> chia hai bên, <code>CRED</code>
      người nhận</td><td><code>SHAR</code> = chia phí</td></tr><tr><td><code>&lt;CdtrAgt&gt;</code>
      chứa <code>&lt;FinInstnId&gt;</code> chứa <code>&lt;BICFI&gt;</code></td><td>ngân
      hàng của người nhận; định danh của định chế; mã BIC của nó</td><td><code>WESTGB2L</code></td></tr></table><p
      class="note"><b>XML</b>: văn bản chữ chia thành các <b>thẻ</b> lồng nhau; mỗi
      thẻ mở bằng <code>&lt;Tên&gt;</code>, đóng bằng <code>&lt;/Tên&gt;</code>, chữ
      ở giữa là giá trị.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: 'Bản tin chuẩn mới viết bằng XML: văn bản chia thành các thẻ lồng nhau, mỗi
      thẻ mở rồi đóng, chữ ở giữa là giá trị. Thẻ tiêu đề nhóm chứa mã bản tin. Thẻ
      thông tin giao dịch chứa số tiền, thuộc tính ghi loại tiền. Thẻ bên chịu phí
      ghi ai trả phí, và thẻ ngân hàng người nhận chứa mã ngân hàng.'
  - show: <p><b>Bản tin pacs.008 rút gọn (ISO 20022, dạng XML)</b></p><div class="code"><div>&lt;FIToFICstmrCdtTrf&gt;</div><div>  &lt;GrpHdr&gt;</div><div>    &lt;MsgId&gt;MSG-0001&lt;/MsgId&gt;</div><div>  &lt;/GrpHdr&gt;</div><div>  &lt;CdtTrfTxInf&gt;</div><div>    &lt;IntrBkSttlmAmt
      Ccy="USD"&gt;1000.00&lt;/IntrBkSttlmAmt&gt;</div><div>    &lt;ChrgBr&gt;SHAR&lt;/ChrgBr&gt;</div><div>    &lt;CdtrAgt&gt;&lt;FinInstnId&gt;</div><div>      &lt;BICFI&gt;WESTGB2L&lt;/BICFI&gt;</div><div>    &lt;/FinInstnId&gt;&lt;/CdtrAgt&gt;</div><div>  &lt;/CdtTrfTxInf&gt;</div><div>&lt;/FIToFICstmrCdtTrf&gt;</div></div>
    clear: true
    say: 'Đây là bản tin theo chuẩn ISO hai không không hai hai, đã rút gọn: số tiền
      đô la Mỹ, cách chia phí và ngân hàng nhận bằng mã tám ký tự vừa giải mã.'
