source: 'curriculum/bnx.yaml L27; audit/bnx/verify_bnx.py L27; audit/bnx/sources_l27.md:
  OWASP XML External Entity Prevention Cheat Sheet, man sftp(1) của OpenBSD (đọc 2026-11-13);
  SOAP/WSDL của W3C KHÔNG đọc được nguyên văn (máy chủ w3.org chặn): bài chỉ nói điều
  đo ở máy chủ thử JDK 21; SFTP là mô phỏng'
