- {sentence: "Đọc cả tệp vào bộ nhớ cần bộ nhớ tỉ lệ cỡ tệp, hai mươi bốn tỉ byte ở một tỉ dòng.", reason: "ASR chép “Đọc cả tệp vào bộ nhớ cần bộ nhớ tỷ lệ cỡ tệp, 24 tỷ bay ở 1 tỷ dòng” (0.818): “tỉ” ASR viết chính tả “tỷ” (cùng âm); byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
