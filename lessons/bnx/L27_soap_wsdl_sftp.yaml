scenes:
- id: hook
  kind: hook
  title: 'Hệ cũ nói XML, đối tác gửi tệp lô: ba chỗ ngân hàng hay vấp'
  checks:
  - alg.bnx_l27_soap_status('001', False) == 200 and alg.bnx_l27_soap_status('999',
    False) == 500 and alg.bnx_l27_soap_status('001', True) == 400
  - alg.bnx_l27_batch_check(1000, 1000, True) == 'OK'
  steps:
  - show: '<p>Một ngân hàng nối với hệ thống cũ của đối tác: hỏi số dư bằng <b>phong
      bì XML</b>, và nhận bảng kê đêm bằng <b>tệp lô</b> gửi qua kênh mã hoá. Chạy
      thật ba ca:</p>

      <div class="box key">Mã trạng thái của HTTP: <b>200</b> thành công, <b>400</b>
      yêu cầu sai, <b>500</b> máy chủ báo lỗi. Hỏi tài khoản có thật: trả <b>200</b>,
      số dư 1 250 000. Hỏi tài khoản lạ: trả <b>500</b> kèm phần lỗi. Gửi yêu cầu
      có khai báo loại văn bản cài bẫy: bị <b>400</b>.

      Còn tệp lô: người nhận mở một tệp <b>đang gửi dở</b>, hoặc thiếu 100 dòng mà
      không ai biết. Làm sao tránh?</div>

      '
    focus:
    - 1
    - - 1
    - 1
    - 2
    - 2
    - 2
    say: 'Chào bạn, một ngân hàng nối với hệ thống cũ của đối tác: hỏi số dư bằng
      phong bì XML, nhận bảng kê đêm bằng tệp lô qua kênh mã hoá. Chạy thật ba ca,
      tài khoản có thật trả mã hai trăm, thành công, số dư một triệu hai trăm năm
      mươi nghìn. Tài khoản lạ trả năm trăm, máy chủ báo lỗi. Yêu cầu cài bẫy bị bốn
      trăm, yêu cầu sai. Còn tệp lô, người nhận có thể mở tệp gửi dở, hoặc thiếu một
      trăm dòng mà không ai biết. Làm sao để tránh?'
- id: prereq
  kind: prereq
  title: 'Trước hết: sáu điều cần hiểu'
  checks:
  - alg.bnx_l27_sha_len() == 64
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      XML</td><td>chữ có thẻ mở/đóng lồng nhau; <b>không gian tên</b> (namespace)
      gắn một địa chỉ làm nhãn cho cả bộ thẻ</td><td><code>&lt;ns:soDu&gt;1250000&lt;/ns:soDu&gt;</code></td></tr><tr><td>②
      dịch vụ phong bì (<b>SOAP</b>)</td><td>bên gọi gửi một <b>phong bì</b> XML bằng
      <b>HTTP POST</b> (kiểu yêu cầu gửi kèm dữ liệu, khác GET chỉ xin lấy), nhận
      lại phong bì</td><td>phong bì có <b>thân</b> chứa lệnh; lỗi nằm trong <b>phần
      lỗi</b></td></tr><tr><td>③ tệp mô tả dịch vụ (WSDL)</td><td>tệp XML mô tả dịch
      vụ có những thao tác nào, nhận và trả gì, ở địa chỉ nào</td><td>máy đọc được,
      sinh mã khách</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    introduces:
    - bnx_soap
    say: Trước hết ta cần hiểu sáu điều, XML là chữ có thẻ mở và đóng lồng nhau, không
      gian tên gắn một địa chỉ làm nhãn cho bộ thẻ. Dịch vụ phong bì là bên gọi gửi
      một phong bì XML bằng lệnh gửi của HTTP và nhận lại một phong bì. Tệp mô tả
      dịch vụ là tệp XML nói dịch vụ có thao tác nào, ở địa chỉ nào.
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>④
      mã băm (sha256)</td><td>dãy ký tự cố định sinh từ nội dung; đổi một ký tự thì
      mã băm khác hẳn</td><td>ghi ở dòng cuối của tệp lô</td></tr><tr><td>⑤ tệp lô
      và <b>SFTP</b></td><td><b>tệp lô</b>: tệp <code>.csv</code>, mỗi dòng một bản
      ghi, các cột ngăn bằng một dấu; <b>SFTP</b>: truyền tệp qua kênh <b>SSH</b>
      (đường nối mã hoá giữa hai máy) (bài này mô phỏng bước truyền bằng thư mục cục
      bộ)</td><td>bảng kê đêm <code>lo.csv</code> nhận lúc 3 giờ sáng</td></tr><tr><td>⑥
      đổi tên nguyên tử</td><td>đổi tên tệp là một thao tác trọn vẹn: người khác thấy
      tên cũ hoặc tên mới, không thấy giữa chừng</td><td>ghi <code>lo.csv.part</code>
      rồi đổi thành <code>lo.csv</code></td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    introduces:
    - bnx_sftp
    clear: true
    say: Mã băm là dãy ký tự cố định sinh từ nội dung, đổi một ký tự thì khác hẳn.
      Tệp lô là tệp bảng chữ, mỗi dòng một bản ghi, thường gửi qua kênh truyền tệp
      trên đường nối mã hoá giữa hai máy. Đổi tên nguyên tử là đổi tên tệp trọn vẹn,
      không ai thấy giữa chừng.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l27_sha_len() == 64
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>Envelope</code>,
      <code>Body</code></td><td><b>phong bì</b> và <b>thân</b>: lệnh gửi đi nằm trong
      thân</td></tr><tr><td><code>Fault</code></td><td><b>phần lỗi</b> thay cho kết
      quả: có <code>faultcode</code> (loại lỗi) và <code>faultstring</code> (lời mô
      tả)</td></tr><tr><td><code>SOAPAction</code></td><td>đầu mục HTTP ghi thao tác
      định gọi</td></tr><tr><td><code>message</code>, <code>portType</code>, <code>operation</code>,
      <code>binding</code>, <code>service</code></td><td>trong WSDL: thông điệp, nhóm
      thao tác, một thao tác, cách đóng gói qua giao thức, dịch vụ và địa chỉ</td></tr><tr><td><code>DOCTYPE</code></td><td>khai
      báo loại văn bản ở đầu XML; có thể khai <b>thực thể ngoài</b> (nội dung lấy
      từ tệp khác), nguồn của tấn công <b>XXE</b>: đọc trộm tệp của máy chủ</td></tr><tr><td><code>TRAILER|n|mã</code></td><td>dòng
      cuối tệp lô: <b>n</b> dòng dữ liệu và <b>mã băm</b> của phần dữ liệu</td></tr></table>'
    focus:
    - - '1.2'
      - '1.3'
    - - '1.4'
      - '1.5'
    - '1.6'
    - '1.7'
    introduces:
    - bnx_xxe
    say: Lệnh gửi đi nằm trong thân của phong bì, còn phần lỗi thay cho kết quả, gồm
      loại lỗi và lời mô tả. Đầu mục HTTP ghi thao tác định gọi, và tệp mô tả dịch
      vụ có thông điệp, nhóm thao tác, cách đóng gói, dịch vụ và địa chỉ. Khai báo
      loại văn bản có thể khai thực thể ngoài, nguồn của kiểu tấn công đọc trộm tệp
      máy chủ. Dòng cuối tệp lô ghi số dòng và mã băm.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ nhỏ</th></tr><tr><td><code>type="xsd:string"</code>,
      <code>message="tns:LaySoDuIn"</code></td><td><code>xsd:</code> và <code>tns:</code>
      là tiền tố không gian tên, khai ở đầu tệp bằng <code>xmlns:…</code>; <code>xsd:string</code>
      là kiểu chuỗi chuẩn; <code>tns:LaySoDuIn</code> trỏ tới thông điệp <code>LaySoDuIn</code>
      của chính dịch vụ này</td><td><code>xsd:long</code> là kiểu số nguyên lớn</td></tr><tr><td><code>style="rpc"</code></td><td>kiểu
      <b>gọi hàm từ xa</b>: mỗi thao tác như một hàm có tên và đối số</td><td><code>LaySoDu("001")</code></td></tr><tr><td><code>javac
      -encoding UTF-8 SoapDemo.java</code></td><td><code>javac</code> biên dịch tệp
      Java; <code>-encoding UTF-8</code> báo tệp có chữ có dấu; <code>java</code>
      chạy lớp đã biên dịch; <code>-Dstdout.encoding=UTF-8</code> đặt thuộc tính để
      in chữ có dấu</td><td><code>java SoapDemo</code> chạy lớp <code>SoapDemo</code></td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Mã sắp tới có vài chỗ cần đọc trước. Chữ đứng trước dấu hai chấm là tiền
      tố không gian tên. Kiểu gọi hàm từ xa coi mỗi thao tác như một hàm có đối số.
      Lệnh đầu biên dịch tệp Java, lệnh sau chạy lớp đã biên dịch.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ nhỏ</th></tr><tr><td><code>f"{i:08d}|TK{i
      % 1000:04d}"</code></td><td>chuỗi f: <code>{…}</code> chèn giá trị; <code>:08d</code>
      là số nguyên đủ 8 chữ số, đệm số 0 bên trái; <code>%</code> là phần dư của phép
      chia</td><td><code>f"{7:03d}"</code> là <code>007</code>; <code>1234 % 1000</code>
      là <code>234</code></td></tr><tr><td><code>buf = bytearray()</code>, <code>buf
      += …</code>, <code>del buf[:65536]</code></td><td><code>bytearray</code>: vùng
      byte sửa được; <code>+=</code> nối thêm vào cuối; <code>del buf[:n]</code> xoá
      <code>n</code> byte đầu</td><td><code>[:3]</code> là 3 phần tử đầu, <code>[-1]</code>
      là phần tử cuối</td></tr><tr><td><code>with open(tam, "w") as f:</code>, <code>dong[-1].split("|")</code></td><td><code>with</code>
      mở tệp để ghi và tự đóng khi hết khối; <code>split("|")</code> tách chuỗi thành
      danh sách theo dấu <code>|</code></td><td><code>"a|b".split("|")</code> là <code>["a",
      "b"]</code></td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Với tệp lô, chuỗi đặt trước chữ f chèn giá trị trong ngoặc nhọn, số tám chữ
      số đệm số không, và dấu phần trăm là phần dư. Vùng byte sửa được cho nối thêm
      và xoá đầu. Khối mở tệp tự đóng tệp, và hàm tách chia chuỗi theo dấu gạch đứng.
