- {sentence: "Đổi chữ thành byte, băm, lấy mã dạng chữ số hệ mười sáu.", reason: "ASR chép “Đổi chữ thành by, băm, lấy mã dạng chữ số hệ 16.” (0.923): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
- {sentence: "Đến phần bạn tự làm: viết hàm Python kiểm tệp lô theo dòng cuối, kiểm số dòng trước rồi tới mã băm.", reason: "ASR chép “Đến phần bạn tự làm, viết hàm phai thông kiểm tệp lô theo dòng cuối, kiểm số dòng trước rồi tới mã băm.” (0.933): “python” đọc theo luật lexicon (lexicon_vi.BNX.yaml: “Pai-thon”), ASR viết “phai thông” — NOT_VERIFIED bằng tai người"}
