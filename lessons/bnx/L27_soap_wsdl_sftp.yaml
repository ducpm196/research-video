    focus:
    - - 1
    - 2
    clear: true
    say: 'Phép tính thứ nhất: yêu cầu hợp lệ nhận mã hai trăm và số dư một triệu hai
      trăm năm mươi nghìn. Tệp yêu cầu thụt dòng nặng hai trăm bốn mươi sáu byte,
      viết liền còn hai trăm linh ba, so với hai mươi byte của JSON là khoảng mười
