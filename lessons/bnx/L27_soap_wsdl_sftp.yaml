- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ phong bì tới tệp lô an toàn'
  checks:
  - alg.bnx_l27_batch_check(1000, 900, True) == 'THIEU DONG'
  - alg.bnx_l27_batch_check(1000, 1000, False) == 'SAI MA BAM'
  - alg.bnx_l27_soap_status('999', False) == 500
  steps:
  - show: '<p><b>Bước 1.</b> Muốn hai hệ thống khác nhau hiểu nhau, hai bên phải đồng
      ý một <b>dạng thông điệp</b> cố định. Giao thức phong bì dùng XML: <code>Envelope</code>
      bọc <code>Body</code>, lệnh nằm trong thân, kèm không gian tên để khỏi nhầm
      tên thẻ.</p><p><b>yeu_cau.xml: phong bì gửi đi</b></p><div class="code"><div>&lt;soapenv:Envelope
      xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"</div><div>                  xmlns:ns="urn:bank"&gt;</div><div>  &lt;soapenv:Body&gt;</div><div>    &lt;ns:LaySoDu&gt;</div><div>      &lt;ns:soTaiKhoan&gt;001&lt;/ns:soTaiKhoan&gt;</div><div>    &lt;/ns:LaySoDu&gt;</div><div>  &lt;/soapenv:Body&gt;</div><div>&lt;/soapenv:Envelope&gt;</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Bước một, muốn hai hệ thống khác nhau hiểu nhau, nên hai bên phải đồng ý
      một dạng thông điệp cố định. Giao thức phong bì dùng XML: phong bì bọc thân,
      lệnh nằm trong thân, kèm không gian tên để khỏi nhầm tên thẻ. Phong bì này hỏi
      số dư tài khoản không không một.'
  - show: '<p><b>Bước 2. Mô tả bằng WSDL.</b> Để bên kia khỏi đoán, dịch vụ công bố
      một tệp mô tả: <code>message</code> (dữ liệu vào, ra), <code>portType</code>
      (nhóm thao tác), <code>binding</code> (cách đóng gói qua HTTP), <code>service</code>
      (địa chỉ).</p><p><b>bank.wsdl (trích: hai message, một portType, một operation,
      một binding, mở đầu service)</b></p><div class="code"><div>  &lt;message name="LaySoDuIn"&gt;&lt;part
      name="soTaiKhoan" type="xsd:string"/&gt;&lt;/message&gt;</div><div>  &lt;message
      name="LaySoDuOut"&gt;&lt;part name="soDu" type="xsd:long"/&gt;&lt;/message&gt;</div><div>  &lt;portType
      name="BankPort"&gt;</div><div>    &lt;operation name="LaySoDu"&gt;</div><div>      &lt;input
      message="tns:LaySoDuIn"/&gt;</div><div>      &lt;output message="tns:LaySoDuOut"/&gt;</div><div>    &lt;/operation&gt;</div><div>  &lt;/portType&gt;</div><div>  &lt;binding
      name="BankBinding" type="tns:BankPort"&gt;</div><div>    &lt;soap:binding style="rpc"
      transport="http://schemas.xmlsoap.org/soap/http"/&gt;</div><div>  &lt;/binding&gt;</div><div>  &lt;service
      name="BankService"&gt;</div></div>'
    focus:
    - - 1
    - 2
    - 3
    clear: true
    say: 'Bước hai là mô tả: để bên kia khỏi đoán, dịch vụ công bố một tệp mô tả.
      Nó gồm hai thông điệp cho dữ liệu vào và ra, nhóm thao tác, ràng buộc cho cách
      đóng gói, và khối dịch vụ cho địa chỉ. Bài chỉ đếm phần tử, nên không sinh mã
      khách.'
  - show: '<p><b>Bước 3. Lỗi có cấu trúc.</b> Khi không tra được tài khoản, máy chủ
      không trả một dòng chữ mà trả <b>phần lỗi</b> trong phong bì (<code>faultcode</code>,
      <code>faultstring</code>), để máy bên kia xử lý được. Máy chủ thử trong bài
      trả HTTP <b>500</b> cho lỗi nghiệp vụ và <b>400</b> cho XML không hợp lệ: đó
      là điều đã <b>đo</b>.

      Đặc tả chính thức quy định mã HTTP nào cho phần lỗi thì bài <b>chưa kiểm được</b>
      (NOT_VERIFIED: máy chủ w3.org chặn tải), nên không khẳng định.</p><table class=''t''><tr><th>tình
      huống</th><th>mã HTTP của máy chủ thử</th><th>nội dung</th></tr><tr><td>tài
      khoản có thật</td><td>200</td><td>soDu 1250000</td></tr><tr><td>tài khoản lạ</td><td>500</td><td>faultcode
      soapenv:Client</td></tr><tr><td>có khai báo loại văn bản</td><td>400</td><td>XML
      không hợp lệ</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước ba là lỗi có cấu trúc: không tra được tài khoản thì máy chủ trả phần
      lỗi ngay trong phong bì, nên máy bên kia xử lý được. Máy chủ thử trả năm trăm
      cho lỗi nghiệp vụ và bốn trăm cho XML sai, đó là điều đã đo. Đặc tả chính thức
      quy định mã nào thì bài chưa kiểm được, nên ta không khẳng định.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>var
      f = DocumentBuilderFactory.newInstance();</code></td><td>Java: <code>var</code>
      để máy tự suy kiểu của biến; <code>newInstance()</code> tạo bộ cấu hình cho
      bộ đọc XML; câu kết thúc bằng dấu chấm phẩy</td><td><code>f</code> là bộ cấu
      hình</td></tr><tr><td><code>f.setNamespaceAware(true);</code></td><td>bật chế
      độ hiểu không gian tên: <code>true</code> là bật</td><td></td></tr><tr><td><code>if
      (chan) f.setFeature("…disallow-doctype-decl", true);</code></td><td><code>if
      (đk) câu;</code>: chỉ làm câu sau khi điều kiện đúng; <code>chan</code>: tham
      số đúng/sai của hàm chứa đoạn này; <code>setFeature(tên, true)</code> bật tính
      năng có tên cho trước, ở đây là cấm khai báo loại văn bản</td><td></td></tr></table>'
    clear: true
    say: Tạo bộ cấu hình cho bộ đọc XML, biến được máy tự suy kiểu. Bật chế độ hiểu
      không gian tên, nếu tham số chặn đúng thì bật tính năng cấm khai báo loại văn
      bản, nên thực thể ngoài không được đọc.
  - show: '<p><b>Bước 4. Chặn XML độc.</b> Một yêu cầu có thể mở đầu bằng khai báo
      loại văn bản, khai một <b>thực thể ngoài</b> trỏ tới tệp trên máy chủ. Nếu bộ
      phân tích làm theo, máy chủ bị đọc trộm tệp. Cách phòng được hướng dẫn của OWASP
      (tổ chức về an toàn ứng dụng web) nêu: <b>cấm khai báo loại văn bản</b> khi
      phân tích.</p><p><b>SoapDemo.java (trích, rút gọn)</b></p><div class="code"><div>var
      f = DocumentBuilderFactory.newInstance();</div><div>f.setNamespaceAware(true);</div><div>if
      (chan) f.setFeature(</div><div>    "http://apache.org/xml/features/disallow-doctype-decl",
      true);</div></div>'
    focus:
    - - 1
    - 2
    - 3
    clear: true
    say: 'Bước bốn là chặn XML độc: yêu cầu có thể mở đầu bằng khai báo loại văn bản,
      khai một thực thể ngoài trỏ tới tệp trên máy chủ. Nếu bộ phân tích làm theo,
      máy chủ bị đọc trộm tệp. Cách phòng theo hướng dẫn về an toàn ứng dụng web là
      cấm khai báo loại văn bản, như đoạn mã vừa xem.'
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>def
      gui(thu_muc, ten, noi_dung):</code></td><td>khai hàm Python tên <code>gui</code>
      với ba tham số; các dòng thụt vào là thân hàm</td></tr><tr><td><code>os.path.join(thu_muc,
      ten + ".part")</code></td><td><code>os.path.join</code> ghép thư mục với tên
      thành đường dẫn; <code>+</code> nối thêm đuôi <code>.part</code> vào tên</td></tr><tr><td><code>with
      open(tam, "w") as f:</code>, <code>f.write(noi_dung)</code></td><td><code>open(tam,
      "w")</code> mở tệp để ghi (<code>"w"</code>: write); <code>f.write(…)</code>
      ghi chữ vào tệp; <code>with</code> tự đóng tệp khi hết khối</td></tr><tr><td><code>os.rename(tam,
      đường_dẫn_mới)</code></td><td>đổi tên tệp <code>tam</code> thành tên mới trong
      một thao tác trọn vẹn</td></tr></table>'
    clear: true
    say: Khai hàm gửi tệp với ba tham số. Ghép thư mục với tên thành đường dẫn, dấu
      cộng nối thêm đuôi tạm. Mở tệp để ghi và ghi nội dung vào; khối mở tệp tự đóng
      tệp. Đổi tên tệp tạm thành tên thật, nên người khác không thấy giữa chừng.
  - show: '<p><b>Bước 5. Tệp lô: đổi tên nguyên tử.</b> Bên gửi ghi vào <code>lo.csv.part</code>,
      ghi xong mới đổi tên thành <code>lo.csv</code>. Bên nhận chỉ xử lý tên không
      đuôi <code>.part</code>, nên không bao giờ mở tệp đang ghi dở.</p><p><b>GuiLo.py
      (trích): ghi vào tên tạm rồi đổi tên</b></p><div class="code"><div>def gui(thu_muc,
      ten, noi_dung):</div><div>    tam = os.path.join(thu_muc, ten + ".part")</div><div>    with
      open(tam, "w") as f:</div><div>        f.write(noi_dung)</div><div>    os.rename(tam,
      os.path.join(thu_muc, ten))      # đổi tên nguyên tử</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Bước năm là đổi tên nguyên tử cho tệp lô: bên gửi ghi vào tệp tên tạm, ghi
      xong mới đổi thành tên thật. Bên nhận chỉ xử lý tệp không mang đuôi tạm, nên
      không bao giờ mở tệp đang ghi dở.'
  - show: '<p><b>Bước 6. Tệp lô: đối soát.</b> Dòng cuối ghi <b>n</b> dòng dữ liệu
      và <b>sha256</b> của phần dữ liệu. Bên nhận kiểm theo thứ tự: số dòng trước
      (rẻ), mã băm sau. Mất dòng thì lệch n; đổi một chữ số thì lệch mã băm dù số
      dòng vẫn đủ.</p>$$\text{đủ } n \text{ dòng và } \text{sha256}(\text{dữ liệu})
      = \text{mã ghi ở cuối} \;\Rightarrow\; \text{nhận}$$'
    focus:
    - - 1
    - 2
    clear: true
    say: 'Bước sáu là đối soát: dòng cuối ghi số dòng dữ liệu và mã băm của phần dữ
      liệu. Bên nhận kiểm số dòng trước vì rẻ, mã băm sau, vì mất dòng thì lệch số
      dòng, đổi một chữ số thì lệch mã băm.'
    introduces:
    - implies
- id: example
