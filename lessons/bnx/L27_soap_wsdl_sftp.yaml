    pause: 30
    say: Đến lượt bạn, ba câu để làm ra giấy. Báo lỗi nào trước khi vừa thiếu dòng
      vừa lệch mã băm, tính số byte và khối của tệp hai triệu dòng, và chọn cách nhận
      tệp lô. Hãy dừng lại làm rồi xem đáp án.
  - show: '<p>Câu 1: kiểm số dòng trước (rẻ), nên báo <b>THIEU DONG</b>; không cần
      băm vì đã thấy lỗi.</p>

      $$498 \neq 500 \Rightarrow \hlg{\text{THIEU DONG}}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu một, ta kiểm số dòng trước vì rẻ, nên báo thiếu dòng, và không
      cần băm nữa vì đã thấy lỗi. Bốn trăm chín mươi tám khác năm trăm.
    clear: true
  - show: '<p>Câu 2: byte = số dòng × 40; khối = byte : 65 536 làm tròn lên.</p>

      $$2\,000\,000 \times 40 = \hlg{80\,000\,000} \text{ byte}; \qquad 80\,000\,000
      : 65\,536 \approx 1220{,}7 \Rightarrow \hlg{1221} \text{ khối}$$

      '
    focus:
    - - 1
    - 2
    say: Đáp án câu hai, hai triệu dòng nhân bốn mươi là tám mươi triệu byte, chia
