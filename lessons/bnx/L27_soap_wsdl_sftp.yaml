  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>tra loi 500: soapenv:Client,
      khong co so tai khoan</div><div>tra loi 400 khi yeu cau co DOCTYPE: XML khong
      hop le hoac co DOCTYPE</div></div>$$② \; \text{tài khoản lạ} \Rightarrow \hl{500}
      \text{ kèm Fault}; \quad ③ \; \text{có khai báo loại văn bản} \Rightarrow \hl{400}$$'
