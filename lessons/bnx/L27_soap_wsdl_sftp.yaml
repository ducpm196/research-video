  - show: '<p><b>GuiLo.py (trích; tao_lo(n) dựng lô n dòng kèm TRAILER, định nghĩa
      ở đầu tệp): gửi một tệp xong và một tệp dở</b></p><div class="code"><div>with
      tempfile.TemporaryDirectory() as nhan:</div><div>    lo = tao_lo(1000)</div><div>    gui(nhan,
      "lo1.csv", lo)</div><div>    open(os.path.join(nhan, "lo2.csv.part"), "w").write(lo[:300])   #
      đang gửi dở</div><div>    print("nguoi nhan thay:", sorted(f for f in os.listdir(nhan)
      if not f.endswith(".part")))</div><div>    print("tep dang gui do (bo qua):",
      [f for f in os.listdir(nhan) if f.endswith(".part")])</div></div><p><b>Kết quả
      chạy thật</b></p><div class="code"><div>nguoi nhan thay: [''lo1.csv'']</div><div>tep
      dang gui do (bo qua): [''lo2.csv.part'']</div></div>$$⑤ \; \text{tệp .part bị
      bỏ qua; chỉ lo1.csv được nhận}$$'
    focus:
    - 1
    - 4
    clear: true
    say: 'Phép tính thứ năm là đổi tên nguyên tử: chương trình gửi một tệp đã xong
      và một tệp đang gửi dở. Người nhận chỉ thấy tệp đã đổi tên xong, còn tệp dở
      bị bỏ qua.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: ba ca đối soát tệp lô'
  checks:
  - alg.bnx_l27_batch_check(1000, 1000, True) == 'OK'
  - alg.bnx_l27_batch_check(1000, 900, True) == 'THIEU DONG'
  - alg.bnx_l27_batch_check(1000, 1000, False) == 'SAI MA BAM'
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>noi_dung.rstrip("\n").split("\n")</code></td><td><code>\n</code>
      là ký tự xuống dòng; <code>rstrip</code> cắt xuống dòng ở cuối; <code>split</code>
      tách thành danh sách, mỗi dòng một phần tử</td></tr><tr><td><code>_, so, ma
      = dong[-1].split("|")</code></td><td><code>dong[-1]</code>: phần tử cuối (dòng
      cuối); tách theo <code>|</code> thành ba phần gán vào ba tên; <code>_</code>:
      tên bỏ đi, giữ chỗ cho nhãn <code>TRAILER</code></td></tr><tr><td><code>"\n".join(dong[:-1])
      + "\n"</code></td><td><code>dong[:-1]</code>: mọi dòng trừ dòng cuối; <code>join</code>
      nối chúng bằng xuống dòng; <code>+ "\n"</code> thêm xuống dòng cuối: dựng lại
      đúng phần dữ liệu</td></tr><tr><td><code>len(dong) - 1 != int(so)</code></td><td><code>len</code>
      đếm phần tử; trừ 1 để bỏ dòng cuối; <code>int</code> đổi chuỗi thành số; <code>!=</code>:
      khác nhau</td></tr></table>'
    clear: true
    say: Cắt xuống dòng ở cuối, nên tách ra mỗi dòng một phần tử. Tách dòng cuối thành
      ba phần; dấu gạch dưới giữ chỗ cho nhãn không dùng. Nối mọi dòng trừ dòng cuối
      bằng xuống dòng, dựng lại đúng phần dữ liệu. Đếm số dòng trừ dòng cuối rồi so
      với số ghi ở dòng cuối.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>hashlib.sha256(du_lieu.encode()).hexdigest()</code></td><td><code>encode</code>
      đổi chữ thành byte; <code>sha256</code> băm; <code>hexdigest</code> cho mã băm
      dạng chữ số hệ mười sáu</td></tr><tr><td><code>if … : return "THIEU DONG"</code></td><td>điều
      kiện đúng thì trả kết quả ngay và thoát hàm; qua cả hai kiểm thì chạy tới <code>return
      "OK"</code></td></tr></table>'
    clear: true
    say: Đổi chữ thành byte, băm, lấy mã dạng chữ số hệ mười sáu. Điều kiện đúng thì
      trả ngay và thoát hàm, nên qua cả hai kiểm mới tới kết quả tốt.
  - show: '<p><b>KiemLo.py (trích; tao_lo(n) dựng lô mẫu, ở đầu tệp): kiểm số dòng
      trước, mã băm sau</b></p><div class="code"><div>def kiem(noi_dung):</div><div>    dong
      = noi_dung.rstrip("\n").split("\n")</div><div>    _, so, ma = dong[-1].split("|")</div><div>    du_lieu
      = "\n".join(dong[:-1]) + "\n"</div><div>    if len(dong) - 1 != int(so):</div><div>        return
      "THIEU DONG"</div><div>    if hashlib.sha256(du_lieu.encode()).hexdigest() !=
      ma:</div><div>        return "SAI MA BAM"</div><div>    return "OK"</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Hàm kiểm viết tay này tách dòng cuối, lấy số dòng và mã băm đã ghi. Nó so
      số dòng trước vì chỉ cần đếm, rồi mới băm phần dữ liệu và so với mã đã ghi.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>"\n".join(lo.split("\n")[:900]
      + lo.split("\n")[-2:])</code></td><td>ghép hai danh sách bằng <code>+</code>:
      900 phần tử đầu và hai phần tử cuối (dòng cuối và phần rỗng sau xuống dòng cuối);
      <code>join</code> nối lại thành chữ</td></tr><tr><td><code>lo.replace("0500|TK003|500000",
      "0500|TK003|500001")</code></td><td><code>replace</code> thay chuỗi cũ bằng
      chuỗi mới: ở đây đổi đúng một chữ số</td></tr></table>'
    clear: true
    say: Giữ chín trăm dòng đầu và dòng cuối, bỏ một trăm dòng ở giữa. Thay chuỗi
      cũ bằng chuỗi mới, đổi đúng một chữ số.
  - show: '<p><b>KiemLo.py (trích): ba ca thử</b></p><div class="code"><div>lo = tao_lo(1000)</div><div>cat
      = "\n".join(lo.split("\n")[:900] + lo.split("\n")[-2:])      # mất 100 dòng,
      giữ trailer</div><div>hong = lo.replace("0500|TK003|500000", "0500|TK003|500001")       #
      đổi 1 chữ số</div><div>print("nguyen ven:", kiem(lo))</div><div>print("mat 100
      dong:", kiem(cat))</div><div>print("doi 1 chu so:", kiem(hong))</div></div>'
    clear: true
    say: Ba ca thử là lô nguyên vẹn, lô cắt mất một trăm dòng nhưng giữ dòng cuối,
      và lô đổi một chữ số, nên mỗi ca thử đúng một lớp kiểm.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>nguyen ven: OK</div><div>mat
      100 dong: THIEU DONG</div><div>doi 1 chu so: SAI MA BAM</div></div><table class=''t''><tr><th>ca</th><th>số
      dòng</th><th>mã băm</th><th>kết luận</th></tr><tr><td>nguyên vẹn</td><td>đủ
      1000</td><td>khớp</td><td>OK</td></tr><tr><td>mất 100 dòng</td><td>chỉ 900</td><td>(chưa
      cần kiểm)</td><td>THIEU DONG</td></tr><tr><td>đổi 1 chữ số</td><td>đủ 1000</td><td>lệch</td><td>SAI
      MA BAM</td></tr></table>'
    clear: true
    say: 'Kết quả đúng như mong đợi vì mỗi ca bị đúng một lớp kiểm chặn: lô mất dòng
      bị báo ngay ở bước đếm, lô sai một chữ số bị báo sai mã băm.'
- id: quymo
  kind: example
  title: 'Khi tệp lô lớn dần: đọc và băm theo luồng'
  checks:
  - alg.bnx_l27_chunks(24000) == 1 and alg.bnx_l27_chunks(24000000) == 367
  - 24000000 // 24000 == 1000
  - alg.bnx_l27_chunks(24 * 10**9) == 366211
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>for
      n in (1000, 1000000):</code></td><td>vòng lặp qua dãy cho sẵn: <code>n</code>
      lần lượt là 1000 rồi 1000000</td></tr><tr><td><code>h, byte, khoi = hashlib.sha256(),
      0, 0</code></td><td>gán ba biến một lúc: <code>h</code> là bộ băm còn trống,
      hai biến đếm bắt đầu từ 0; <code>h.update(x)</code> đưa thêm <code>x</code>
      vào bộ băm; <code>hexdigest()[:12]</code> lấy 12 ký tự đầu của mã</td></tr><tr><td><code>for
      i in range(1, n + 1):</code></td><td><code>range(1, n + 1)</code>: các số từ
      1 tới n (dừng trước n + 1)</td></tr><tr><td><code>h.update(buf[:65536]); byte
      += 65536; khoi += 1; del buf[:65536]</code></td><td>dấu <code>;</code> ngăn
      các câu lệnh trên một dòng: băm khối đầu, cộng đếm byte và đếm khối, rồi xoá
      khối đó khỏi vùng đệm</td></tr></table>'
    clear: true
    say: 'Vòng lặp qua hai cỡ tệp cho sẵn. Gán ba biến một lúc: bộ băm trống và hai
      biến đếm. Vòng lặp chạy các số từ một tới n. Một dòng bốn việc: băm khối đầu,
      cộng hai bộ đếm, xoá khối đó khỏi vùng đệm.'
  - show: '<p><b>Đọc theo khối 64 KiB (1 KiB = 1024 byte, nên 65 536 byte), băm dần,
      không giữ cả tệp trong bộ nhớ</b></p><div class="code"><div>for n in (1000,
      1000000):</div><div>    h, byte, khoi = hashlib.sha256(), 0, 0</div><div>    buf
      = bytearray()</div><div>    for i in range(1, n + 1):</div><div>        buf
      += f"{i:08d}|TK{i % 1000:04d}|{i * 7 % 1000000:07d}\n".encode()</div><div>        if
      len(buf) &gt;= 65536:</div><div>            h.update(buf[:65536]); byte += 65536;
      khoi += 1; del buf[:65536]</div><div>    if buf:</div><div>        h.update(buf);
      byte += len(buf); khoi += 1</div><div>    print(f"{n} dong: {byte} byte, {khoi}
      khoi 64 KiB, sha256 {h.hexdigest()[:12]}")</div></div>'
    introduces:
    - bnx_kib
    clear: true
    say: 'Số đo thật: chương trình sinh từng dòng vào vùng đệm, mỗi khi đủ một khối
      sáu mươi lăm nghìn năm trăm ba mươi sáu byte thì băm dần rồi bỏ khối đó.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>1000 dong: 24000
      byte, 1 khoi 64 KiB, sha256 796b27ae9211</div><div>1000000 dong: 24000000 byte,
      367 khoi 64 KiB, sha256 0ddfcd0e4e82</div></div>$$10^3 \to 10^6 \text{ dòng
      } (\times 1000): \; 24\,000 \to 24\,000\,000 \text{ byte}; \;\; 1 \to 367 \text{
      khối}$$'
    focus:
    - 1
    - 3
    clear: true
    say: Mỗi dòng dài hai mươi bốn byte, nên một nghìn dòng là hai mươi bốn nghìn
      byte, vừa một khối. Một triệu dòng, gấp một nghìn lần, là hai mươi bốn triệu
      byte và ba trăm sáu mươi bảy khối, và đọc từng khối rồi băm dần thì bộ nhớ không
      đổi.
  - show: '<table class=''t''><tr><th>cách</th><th>bộ nhớ</th><th>khi nào gãy</th><th>chọn
      khi</th></tr><tr><td>đọc cả tệp vào bộ nhớ rồi băm</td><td>tỉ lệ với cỡ tệp:
      24 MB ở 10⁶ dòng, 24 GB ở 10⁹ dòng</td><td>tệp lớn hơn bộ nhớ trống</td><td>tệp
      nhỏ, đơn giản</td></tr><tr><td>đọc và băm theo luồng</td><td>gần như không đổi
      (một khối 64 KiB)</td><td>không gãy theo cỡ tệp; thời gian tăng tuyến tính</td><td>tệp
      lô thật của ngân hàng</td></tr><tr><td>chia tệp thành nhiều phần có mã băm riêng</td><td>không
      đổi, và gửi lại từng phần được</td><td>phải quản lý danh sách phần</td><td>tệp
      rất lớn, mạng hay đứt</td></tr></table>'
    clear: true
    say: Bảng này cho thấy giải pháp cũ gãy ở đâu. Đọc cả tệp vào bộ nhớ cần bộ nhớ
      tỉ lệ cỡ tệp, hai mươi bốn tỉ byte ở một tỉ dòng. Đọc và băm theo luồng thì
      bộ nhớ gần như không đổi.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
