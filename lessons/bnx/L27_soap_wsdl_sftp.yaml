      sao?</td></tr><tr><td>2</td><td>Mỗi dòng dài 40 byte, tệp 2 triệu dòng, khối
      đọc 64 KiB (65 536 byte). Bao nhiêu byte, bao nhiêu khối (làm tròn lên)?</td></tr><tr><td>3</td><td>Quyết
      định (số minh hoạ): đối tác gửi tệp lô 3 giờ sáng qua kênh mã hoá, bạn quét
