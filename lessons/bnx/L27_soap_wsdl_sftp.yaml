- {sentence: "Ghi ba trăm ký tự đầu vào tệp tạm, mô phỏng tệp gửi dở.", reason: "ASR chép “ghi 300 ký tự đầu vào tẹp tạm, mô phỏng tẹp gửi giỡ.” (0.786): lệch âm/thanh thuần Việt: tệp/tẹp, tệp/tẹp, dở/giỡ — NOT_VERIFIED bằng tai người"}
