      như thư viện Java của hãng</div><div>print(h, "// 65536 =", h // 65536, "; mod
      32768 =", r)</div><div>print("1024 thùng:", r % 1024, "| 128 thùng:", r % 128)</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>2170508415 // 65536 = 33119 ; mod
      32768 = 351</div><div>1024 thùng: 351 | 128 thùng: 95</div></div><p class=''note''>Ở
      <code>r = …</code>: dịch phải 16 = chia nguyên cho 65 536; phép &amp; với 0x7FFF
