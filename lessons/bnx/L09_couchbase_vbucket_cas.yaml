scenes:
- id: hook
  kind: hook
  title: Vì sao cộng điểm thưởng hai lần mà chỉ thấy một lần?
  checks:
  - alg.bnx_cas_story(use_cas=False)[0] == 130
  - alg.bnx_cas_story()[0] == 100 + 50 + 30 == 180
  steps:
  - show: '<p>Hồ sơ khách hàng C1001 có $100$ điểm thưởng. Cùng một lúc, dịch vụ khuyến
      mãi cộng $50$ điểm, dịch vụ hoàn tiền cộng $30$ điểm (số minh hoạ).</p>

      <p>Mong đợi: $100 + 50 + 30 = 180$. Hồ sơ ghi: <b class="red">130</b>.</p>

      <div class="box key">Cả hai cùng đọc 100, mỗi bên tự cộng rồi ghi đè. Lần ghi
      sau xoá mất 50 điểm của lần ghi trước: <b>mất cập nhật</b>.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Chào bạn, hồ sơ khách hàng C một nghìn không trăm linh một có một trăm điểm
      thưởng. Cùng một lúc, dịch vụ khuyến mãi cộng năm mươi điểm, còn dịch vụ hoàn
      tiền cộng ba mươi điểm, đây là số minh hoạ. Ta mong đợi một trăm cộng năm mươi
      cộng ba mươi, bằng một trăm tám mươi. Nhưng hồ sơ chỉ ghi một trăm ba mươi.
      Lý do là cả hai cùng đọc một trăm, mỗi bên tự cộng rồi ghi đè. Lần ghi sau xoá
      mất năm mươi điểm của lần ghi trước, gọi là mất cập nhật.
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời bằng</th></tr><tr><td>lưu
      hồ sơ khách hàng thế nào để lấy ra nhanh</td><td>khoá bản ghi <code>customer::C1001</code></td></tr><tr><td>khoá
      nằm ở máy nào trong cụm</td><td>thùng ảo (vBucket) = băm khoá, rồi tra bản đồ
      cụm</td></tr><tr><td>làm sao không mất 50 điểm</td><td>dấu phiên bản CAS: ghi
      kèm dấu đã đọc, lệch thì bị từ chối</td></tr><tr><td>phiên đăng nhập tự hết
      hạn thế nào</td><td>hạn sống (TTL) tính bằng giây</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Hôm nay ta trả lời bốn câu hỏi. Thứ nhất, lưu hồ sơ khách hàng thế nào để
      lấy ra nhanh, câu trả lời là thiết kế khoá bản ghi. Thứ hai, khoá nằm ở máy
      nào trong cụm, câu trả lời là băm khoá vào một thùng ảo, rồi tra bản đồ cụm.
      Thứ ba, làm sao không mất năm mươi điểm, câu trả lời là dấu phiên bản, ghi kèm
      dấu đã đọc, lệch thì bị từ chối. Thứ tư, phiên đăng nhập tự hết hạn thế nào,
      câu trả lời là hạn sống tính bằng giây.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - 100 + 50 == 150 and alg.bnx_cas_story(use_cas=False)[0] == 130
  - alg.bnx_cas_story(use_cas=False)[0] != alg.bnx_cas_story()[0]
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      Kho khoá → giá trị</td><td>đưa khoá, nhận lại đúng một giá trị, không phải quét</td><td>khoá
      <code>so_du:TK-1001</code></td></tr><tr><td>② Băm rồi chia dư</td><td>cùng khoá
      luôn ra cùng số; số dư khi chia chọn ngăn (như chọn mảnh ở bài 8)</td><td>17
      chia 3 dư 2</td></tr><tr><td>③ Mất cập nhật</td><td>hai bên đọc cùng giá trị
      cũ, cùng ghi; lần ghi sau xoá lần ghi trước</td><td>100 → 150 rồi bị ghi đè
      thành 130</td></tr><tr><td>④ Hạn sống của khoá</td><td>mục tự biến mất sau một
      số giây (Redis cũng có)</td><td>hạn 60 giây</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều. Kho khoá và giá trị nhận một khoá và trả
      lại đúng một giá trị, không phải quét cả kho. Băm rồi chia dư, như ở bài tám
      khi chọn mảnh cho bản ghi tìm kiếm. Cùng khoá luôn ra cùng số, và số dư khi
      chia chọn ra ngăn. Mất cập nhật là khi hai bên đọc cùng một giá trị cũ rồi cùng
      ghi, nên lần ghi sau xoá lần ghi trước. Còn hạn sống là số giây mà sau đó mục
      tự biến mất, Redis cũng có tính năng này.
  - show: $$100 + 50 = 150, \qquad 100 + 30 = 130 \neq 180$$
    focus:
    - 0
    - 1
    - 1
    say: Một ví dụ số cho mất cập nhật. Một bên tính một trăm cộng năm mươi, bằng
      một trăm năm mươi. Bên kia tính từ cùng giá trị cũ, một trăm cộng ba mươi, bằng
      một trăm ba mươi, khác một trăm tám mươi.
- id: sym
  kind: symbol
  title: Giải mã vài từ hay gặp
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>document
      key (khoá bản ghi)</td><td>tên duy nhất của một bản ghi JSON trong kho, ví dụ
      <code>customer::C1001</code></td></tr><tr><td>bucket (thùng dữ liệu)</td><td>nơi
      chứa bản ghi, giống một cơ sở dữ liệu</td></tr><tr><td>vBucket (thùng ảo)</td><td>một
      phần của thùng dữ liệu; khoá → thùng ảo qua băm CRC32. Bộ lưu Couchstore: 1024;
      Magma: 128 hoặc 1024; từ bản 8.0 (Enterprise) thùng mới mặc định Magma 128.
      Bài lấy 1024 làm ví dụ</td></tr><tr><td>cluster map (bản đồ cụm)</td><td>bảng
      thùng ảo → máy đang giữ bản chính; thư viện khách tải về và gọi thẳng máy đó</td></tr><tr><td>CAS
      (dấu phiên bản)</td><td>giá trị đổi mỗi lần bản ghi bị sửa; ghi kèm CAS đã đọc,
      lệch thì bị từ chối</td></tr><tr><td>TTL (hạn sống)</td><td>số giây bản ghi
      được tồn tại trước khi kho tự xoá</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.6'
    - '1.7'
    say: Bảng này giải mã sáu từ. Khoá bản ghi là tên duy nhất của một bản ghi JSON
      trong kho, ví dụ chữ khách hàng bằng tiếng Anh, hai dấu hai chấm, rồi mã khách
      hàng. Thùng dữ liệu là nơi chứa bản ghi, giống một cơ sở dữ liệu. Thùng ảo là
      một phần của thùng dữ liệu, và khoá được băm để chọn thùng ảo. Bộ lưu kiểu cũ
      có một nghìn không trăm hai mươi tư thùng ảo, còn từ bản tám, thùng dữ liệu
      mới mặc định có một trăm hai mươi tám. Bài này lấy một nghìn không trăm hai
      mươi tư làm ví dụ. Bản đồ cụm cho biết thùng ảo nào đang ở máy nào, nên thư
      viện phía ứng dụng gọi thẳng máy đó. Dấu phiên bản là giá trị đổi mỗi lần bản
      ghi bị sửa. Ta ghi kèm dấu đã đọc, nếu lệch thì bị từ chối. Hạn sống là số giây
      bản ghi được tồn tại trước khi kho tự xoá.
