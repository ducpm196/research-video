  - show: '<p><b>Bước 3.</b> Mỗi lần ghi mang theo CAS đã đọc. Kho so: <b>bằng</b>
      thì ghi và đổi CAS; <b>khác</b> thì từ chối.</p>

      $$\text{ghi được} \iff \text{CAS gửi kèm} = \text{CAS hiện tại}$$

      <span class=''note''>Làm thử: P1 gửi 7, kho đang 7 → ghi, CAS đổi. P2 gửi 7,
      kho đang 8 → từ chối. Mô phỏng tăng CAS thêm 1; CAS thật là một số không đoán
