- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: thử mọi thứ tự đọc và ghi'
  checks:
  - alg.bnx_interleavings(True) == (6, [180])
  - alg.bnx_interleavings(False) == (6, [130, 150, 180])
  steps:
  - show: '<p><b>Đường khác: liệt kê mọi thứ tự của 4 sự kiện</b></p><div class="code"><div>from
      itertools import permutations</div><div>def f(order, cas_on):</div><div>    v,
      ver, rd, add = 100, 7, {}, {"P1": 50, "P2": 30}</div><div>    for p in order:</div><div>        if
      p not in rd:                    # lần đầu: đọc</div><div>            rd[p] =
      (v, ver); continue</div><div>        old = rd[p][0] if not cas_on or rd[p][1]
      == ver else v</div><div>        v, ver = old + add[p], ver + 1     # ghi (lệch
      CAS: đọc lại)</div><div>    return v</div><div>od = set(permutations(["P1",
      "P1", "P2", "P2"]))</div><div>for c in (True, False):</div><div>    print(len(od),
      "thứ tự, CAS", c, sorted({f(o, c) for o in od}))</div></div>'
    focus:
    - 2
    - 2
    - '2.7'
    say: Kiểm bằng đường khác. Thay vì chỉ một kịch bản, ta liệt kê mọi thứ tự của
      bốn sự kiện, mỗi tiến trình đọc một lần rồi ghi một lần. Có dấu phiên bản thì
      khi dấu lệch, tiến trình đọc lại giá trị mới rồi mới cộng.
  - show: <p><b>Kết quả chạy thật</b></p><div class="code"><div>6 thứ tự, CAS True
      [180]</div><div>6 thứ tự, CAS False [130, 150, 180]</div></div>
    focus:
    - '2.1'
    - '2.2'
    clear: true
    say: Chạy thật, có sáu thứ tự, và khi bật dấu phiên bản, mọi thứ tự đều cho một
      trăm tám mươi, vì không lần ghi nào dựa trên giá trị cũ. Khi tắt, kết quả có
      thể là một trăm ba mươi, một trăm năm mươi hoặc một trăm tám mươi, tuỳ ai ghi
      sau.
  - show: <table class='t'><tr><th>kiểu</th><th>chặn đọc?</th><th>khi tranh chấp</th></tr><tr><td>CAS
      (khoá lạc quan)</td><td>không</td><td>người ghi sau bị từ chối, tự đọc lại rồi
      thử lại</td></tr><tr><td>khoá bi quan (get-and-lock)</td><td>vẫn đọc được, nhưng
      không ai sửa được nếu không có đúng CAS của khoá</td><td>người khác phải chờ
