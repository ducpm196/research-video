- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_ttl_after_mutation(1800, False) == 0
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Tưởng CAS là <b class="red">khoá</b>:
      đọc kèm CAS thì người khác không đọc được. Sai: CAS không chặn ai đọc, chỉ chặn
      ghi đè bản cũ.

      <br><span class="note">Kèm theo: bắt lỗi “CAS lệch” rồi bỏ qua là mất cập nhật
      y như không có CAS. Phải đọc lại và thử lại, có giới hạn số lần.</span></div>

      '
    say: Lỗi thứ nhất, của người mới, là tưởng dấu phiên bản là một cái khoá, đọc
      kèm dấu thì người khác không đọc được. Sai, dấu không chặn ai đọc, chỉ chặn
      ghi đè bản cũ. Kèm theo đó, bắt lỗi dấu lệch rồi bỏ qua thì vẫn mất cập nhật
      y như không có dấu. Phải đọc lại và thử lại, có giới hạn số lần.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Cập nhật bản ghi
      phiên (gia hạn, ghi lần truy cập) mà <b class="red">không đặt lại hạn sống</b>
      → hạn sống về 0, phiên <b>không bao giờ hết hạn</b>.

      <br><span class="note">Cách chữa: mỗi lần ghi đặt lại hạn sống, hoặc dùng <code>preserve_expiry</code>
      để giữ hạn cũ. Kiểm bằng cách đọc hạn sống sau khi cập nhật.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm. Cập nhật bản ghi phiên, ví dụ ghi lần truy
      cập cuối, mà không đặt lại hạn sống. Hạn sống bị đưa về không, và phiên không
      bao giờ hết hạn. Cách chữa là mỗi lần ghi đặt lại hạn sống, hoặc dùng tuỳ chọn
      giữ hạn cũ. Hãy kiểm bằng cách đọc lại hạn sống sau khi cập nhật.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Để khoá ngẫu nhiên
      rồi mới nghĩ cách truy cập: muốn mở hồ sơ theo mã khách hàng lại phải tìm theo
      trường bên trong, chậm hơn nhiều so với lấy thẳng theo khoá.

      <br><span class="note">Cách chữa: thiết kế khoá trước (<code>customer::&lt;mã&gt;</code>).
      Và kho bản ghi giữ hồ sơ, phiên; <b>sổ cái số dư</b> vẫn ở lõi ngân hàng.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, cũng của người đã đi làm, là để khoá ngẫu nhiên rồi mới nghĩ
      cách truy cập. Muốn mở hồ sơ theo mã khách hàng lại phải tìm theo trường bên
      trong, chậm hơn nhiều so với lấy thẳng theo khoá. Cách chữa là thiết kế khoá
      trước. Và nhớ rằng kho này giữ hồ sơ và phiên, còn sổ cái số dư vẫn ở lõi ngân
      hàng.
