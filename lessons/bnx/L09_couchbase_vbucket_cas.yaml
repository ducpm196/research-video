- id: formula
  kind: formula
  title: 'Suy ra từng bước: khoá, thùng ảo, dấu phiên bản, hạn sống'
  checks:
  - alg.bnx_crc32('customer::C1001') // 65536 == 33119 and 33119 % 32768 == 351
  - alg.bnx_vbucket('customer::C1001') == 351 and alg.bnx_vbucket('customer::C1001',
    128) == 95
  - 2 ** 16 == 65536 and 0x7FFF + 1 == 32768
  - alg.bnx_cas_story()[2][1] == ('P2', 'từ chối')
  - alg.bnx_cas_story()[:2] == (180, 9)
  - alg.bnx_clock_add(9, 0, 0, 1800) == (9, 30, 0)
  - alg.bnx_ttl_after_mutation(1800, False) == 0 and alg.bnx_ttl_after_mutation(1800,
    False, True) == 1800
  steps:
  - show: '<p><b>Bước 1.</b> Kho này tìm nhanh nhất <b>theo khoá</b>, nên khoá phải
      chứa thứ mà ứng dụng luôn có trong tay: loại bản ghi và mã nghiệp vụ.</p>

