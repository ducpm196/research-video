  - show: '<p><b>Bước 4. Kho mô phỏng có CAS</b></p><div class="code"><div>class Store:                      #
      kho một bản ghi, có CAS</div><div>    def __init__(self):</div><div>        self.doc,
      self.cas = {"diem_thuong": 100}, 7</div><div>    def get(self):</div><div>        return
