  - show: '<p><b>Bước 5. Hai tiến trình cùng cộng điểm</b></p><div class="code"><div>s
      = Store()</div><div>d1, c1 = s.get()                  # P1 đọc: CAS 7</div><div>d2,
      c2 = s.get()                  # P2 đọc: CAS 7</div><div>d1["diem_thuong"] +=
