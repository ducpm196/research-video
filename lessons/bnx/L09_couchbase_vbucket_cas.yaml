    focus:
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
    say: Bảng này so hai cách. Dấu phiên bản còn gọi là khoá lạc quan, không chặn
      ai đọc, người ghi sau bị từ chối và tự thử lại. Khoá bi quan thì giữ bản ghi
