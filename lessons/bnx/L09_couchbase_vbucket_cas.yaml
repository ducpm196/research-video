      <span class=''note''>Số minh hoạ. Mỗi lần ghi lại bản ghi phải đặt lại hạn sống:
      ghi mà không đặt thì hạn sống về 0 (không bao giờ hết hạn), trừ khi dùng <code>preserve_expiry</code>
      hoặc thùng dữ liệu có hạn sống tối đa (<code>maxTTL</code>).</span>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Bước sáu, vì phiên đăng nhập phải tự hết hiệu lực, nên khi ghi bản ghi phiên
      ta đặt hạn sống tính bằng giây. Tạo lúc chín giờ đúng, cộng một nghìn tám trăm
