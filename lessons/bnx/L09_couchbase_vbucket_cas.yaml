    focus:
    - '2.1'
    - '2.2'
    - '2.3'
    - '2.4'
    clear: true
    say: Chạy thật, tiến trình một ghi được, dấu mới là tám. Tiến trình hai bị từ
      chối vì dấu lệch. Lần hai, sau khi đọc lại, tiến trình hai ghi được, dấu là
