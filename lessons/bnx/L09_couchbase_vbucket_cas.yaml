      c2))</div><div>print(s.get())</div></div>'
    focus:
    - '2.2'
    - '2.5'
    - '2.7'
    - '2.8'
    clear: true
    say: Bước năm, hai tiến trình cùng đọc, nên cùng thấy dấu bảy. Tiến trình một
