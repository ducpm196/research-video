    say: Tổng kết chuỗi logic. Khoá bản ghi được băm ra thùng ảo ba trăm năm mươi
      mốt, bản đồ cụm chỉ ra máy giữ thùng đó. Mỗi lần ghi mang theo dấu phiên bản,
      lệch thì đọc lại rồi ghi, nên kết quả là một trăm tám mươi điểm, không mất cập
      nhật.
  - show: <div class='box key'><b>Tư duy:</b> thiết kế <b>khoá trước</b>, vì đó là
      cách truy cập chính. Mỗi lần “đọc, sửa, ghi” phải mang CAS. Bản ghi phiên luôn
      có hạn sống, và hạn sống phải được đặt lại mỗi lần ghi.</div>
    say: Điều cần mang theo. Thiết kế khoá trước, vì đó là cách truy cập chính. Mỗi
      lần đọc, sửa, ghi phải mang dấu phiên bản. Bản ghi phiên luôn có hạn sống, và
      phải đặt lại mỗi lần ghi.
