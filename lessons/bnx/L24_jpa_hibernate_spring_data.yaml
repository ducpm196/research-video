      x="750" y="40" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">Cùng
      một việc, hai cách lấy: 1 + N câu SQL hay 1 câu nối bảng</text><text x="380"
      y="90" font-size="26" text-anchor="middle" fill="#dc2626" font-weight="bold">tải
      lười</text><rect x="40" y="110" width="680" height="60" rx="10" fill="#fef3c7"
