- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l24_lazy_sql(200) == 201
  - alg.bnx_l24_rows_join(200, 3) == 600
  - alg.bnx_l24_entities_held(200000, 2) == 600000
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Trang
      quản lý hiện 200 khách, mỗi khách đụng vào danh sách tài khoản. Tải lười cần
      bao nhiêu câu SQL? Nối kèm tải cần bao nhiêu câu? Nếu mỗi khách có 3 tài khoản
      thì câu nối trả về bao nhiêu dòng?</td></tr><tr><td>2</td><td>Mã tải một tài
      khoản trong phiên, đổi số dư, rồi gọi <code>detach</code> trước khi chốt. Số
      dư trong bảng có đổi không? Nếu đổi số dư rồi <b>mới</b> detach, kết quả khác
      không?</td></tr><tr><td>3</td><td>Quyết định (số minh hoạ): màn hình quản trị
      phân trang 20 khách mỗi trang, nhưng một báo cáo đêm đọc 200 000 khách kèm tài
      khoản. Chọn cho từng việc: tải lười, nối kèm tải, hay nối kèm tải theo lô rồi
      xoá ngữ cảnh? Giải thích.</td></tr></table>'
    pause: 30
    say: Đến lượt bạn, ba câu để làm ra giấy. Câu một, hai trăm khách đụng vào danh
      sách tài khoản, tải lười và nối kèm tải cần bao nhiêu câu SQL? Câu hai, đổi
      số dư rồi gỡ đối tượng khỏi ngữ cảnh trước khi chốt, số dư trong bảng có đổi
      không? Câu ba, trang quản trị hai mươi khách còn báo cáo đêm hai trăm nghìn
      khách, chọn cách nào cho từng việc? Hãy tạm dừng và làm ra giấy.
  - show: '<p>Câu 1: tải lười một cộng N, nối kèm tải luôn một câu; số dòng = số khách
      × số tài khoản mỗi khách.</p>

      $$1 + 200 = \hlg{201}; \qquad 1; \qquad 200 \times 3 = \hlg{600} \text{ dòng}$$

      '
    say: 'Đáp án câu một: tải lười cần một cộng hai trăm, tức hai trăm lẻ một câu,
      nối kèm tải luôn một câu, và số dòng bằng hai trăm nhân ba, tức sáu trăm dòng.'
    clear: true
  - show: '<p>Câu 2: theo kết quả chạy thật, đối tượng đã rời ngữ cảnh thì sửa không
      sinh UPDATE. Phải xét <b>thứ tự</b>.</p>

      $$\text{detach rồi mới sửa} \Rightarrow \hlg{0} \text{ UPDATE (số dư giữ nguyên)}$$

      <p>Còn sửa trong ngữ cảnh rồi detach <b>trước</b> khi bộ ánh xạ kịp đẩy xuống:
      thay đổi cũng không được ghi, vì lúc chốt đối tượng không còn được theo dõi.
      Chỉ khi đã đẩy xuống (flush) trước lúc detach thì lệnh UPDATE mới đã chạy.</p>

      '
    focus:
    - 1
    - 2
    say: 'Đáp án câu hai: gỡ đối tượng rồi mới sửa thì không sinh lệnh cập nhật, số
      dư giữ nguyên. Sửa trước rồi gỡ mà chưa đẩy xuống thì cũng không được ghi, vì
      lúc chốt đối tượng không còn được theo dõi.'
  - show: '<table class=''t''><tr><th>việc</th><th>chọn</th><th>vì sao</th></tr><tr><td>trang
      quản trị, 20 khách mỗi trang</td><td>hai bước: lấy mã của 20 khách, rồi nối
      kèm tải theo các mã đó</td><td>cắt trang ngay trong câu nối kèm thì đọc hết
      rồi cắt trong bộ nhớ (đã đo: 1500 đối tượng, so với 60)</td></tr><tr><td>báo
      cáo đêm, 200 000 khách</td><td>nối kèm tải theo lô, mỗi lô xong thì xoá ngữ
      cảnh</td><td>tải lười thành 200 001 câu; nối một lần giữ cả 600 000 đối tượng
      nếu 2 tài khoản mỗi khách trong bộ nhớ</td></tr><tr><td>lệnh kiểm tra một khách</td><td>tải
      lười</td><td>chỉ cần một khách; không tải thứ không dùng</td></tr></table>'
    say: 'Đáp án câu ba: trang quản trị lấy mã của hai mươi khách rồi nối kèm tải
      theo mã, vì cắt trang ngay trong câu nối kèm là đọc hết rồi cắt trong bộ nhớ.
      Báo cáo đêm thì tải lười thành hơn hai trăm nghìn câu, nên chọn nối kèm tải
      theo lô và xoá ngữ cảnh sau mỗi lô. Xem một khách thì tải lười là hợp lý.'
    clear: true
