    clear: true
    say: Hình này cho thấy ngữ cảnh bền vững và bốn trạng thái của một đối tượng.
      Đối tượng mới còn tạm thời, khi lưu thì thành đối tượng được quản lý. Ngữ cảnh
      giữ bản chụp lúc tải, khi chốt đối tượng nào khác bản chụp thì sinh lệnh cập
      nhật.
  - show: '<div><svg width="1500" height="560" viewBox="0 0 1500 560" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
