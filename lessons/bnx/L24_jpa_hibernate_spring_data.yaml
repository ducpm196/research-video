scenes:
- id: hook
  kind: hook
  title: Năm mươi khách, năm mươi mốt câu SQL
  checks:
  - alg.bnx_l24_lazy_sql(50) == 51
  - alg.bnx_l24_lazy_sql(500) == 501
  - alg.bnx_l24_lazy_sql(10000) == 10001
  steps:
  - show: '<p>Màn hình quản lý hiện <b>50 khách</b>, mỗi khách kèm danh sách tài khoản.
      Người viết mã chỉ viết một vòng lặp đọc danh sách tài khoản của từng khách.</p>

      <div class="box key">Máy chạy thật cho ra <b>51 câu SQL</b> chứ không phải một.
      Với 500 khách là <b>501</b> câu; với 10 000 khách là <b>10 001</b> câu.

      Câu SQL nào sinh ra từ dòng nào của mã, và sửa bằng cách nào?</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, màn hình quản lý hiện năm mươi khách, mỗi khách kèm danh sách tài
      khoản, và mã chỉ viết một vòng lặp đọc danh sách ấy. Máy chạy thật cho ra năm
      mươi mốt câu SQL chứ không phải một câu. Với năm trăm khách là năm trăm lẻ một
      câu. Sửa bằng cách nào?
- id: prereq
  kind: prereq
  title: 'Trước hết: năm điều cần hiểu'
  checks:
  - alg.bnx_l24_latency_ms(51, 1) == 51
  - alg.bnx_l24_latency_ms(1, 1) == 1
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      bảng, dòng, khoá ngoại</td><td><b>khoá ngoại</b>: cột ghi mã dòng của bảng khác</td><td>cột
      <code>khach_id</code> ghi mã khách sở hữu tài khoản</td></tr><tr><td>② câu SQL
      và một lần gọi cơ sở dữ liệu</td><td>mỗi câu gửi qua mạng tới máy chủ, có độ
      trễ riêng</td><td>1 ms mỗi câu (số minh hoạ): 51 câu tốn 51 ms</td></tr><tr><td>③
      giao dịch</td><td>nhóm thao tác ghi: <b>chốt</b> thì cùng có hiệu lực, <b>hoàn
      tác</b> thì không cái nào</td><td>chuyển tiền: trừ, rồi cộng</td></tr><tr><td>④
      nhãn (annotation)</td><td>dấu <code>@…</code> đặt trên lớp hoặc trường để dặn
      thư viện</td><td><code>@Entity</code>: lớp này ứng với một bảng</td></tr><tr><td>⑤
      ánh xạ đối tượng và bảng</td><td>thư viện đổi qua lại giữa đối tượng Java và
      dòng của bảng</td><td>Hibernate là một thư viện như thế; JPA là bộ quy ước chung</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - - '1.5'
      - '1.6'
    say: Trước hết ta cần hiểu năm điều, khoá ngoại là cột ghi mã của dòng ở bảng
      khác. Mỗi câu SQL đi qua mạng và có độ trễ riêng. Giao dịch là nhóm thao tác
      ghi, chốt thì cùng có hiệu lực, hoàn tác thì không cái nào có. Nhãn dặn thư
      viện ánh xạ đối tượng Java với dòng của bảng.
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_l24_lazy_sql(1) == 2
  steps:
  - show: '<table class=''t''><tr><th>tên</th><th>nghĩa</th></tr><tr><td><code>@Entity</code></td><td><b>thực
      thể</b>: lớp Java tương ứng một bảng; mỗi đối tượng là một dòng</td></tr><tr><td><code>@Id</code></td><td>trường
      là <b>khoá chính</b> của dòng</td></tr><tr><td><code>@OneToMany</code> / <code>@ManyToOne</code></td><td>một
      khách có nhiều tài khoản / nhiều tài khoản thuộc một khách; <code>mappedBy</code>
      chỉ phía giữ khoá ngoại</td></tr><tr><td><code>Session</code></td><td><b>phiên</b>:
      một lần làm việc với cơ sở dữ liệu; bên trong có <b>ngữ cảnh bền vững</b> giữ
      các đối tượng đã tải</td></tr><tr><td><code>LAZY</code> / <code>EAGER</code></td><td><b>tải
      lười</b>: chờ tới khi đụng mới lấy / <b>tải ngay</b> cùng lúc với đối tượng
      chủ</td></tr><tr><td>JPQL</td><td>ngôn ngữ truy vấn <b>theo đối tượng</b>: <code>select
      k from Khach k</code> hỏi về lớp và trường, không hỏi về bảng và cột</td></tr><tr><td><code>join
      fetch</code></td><td>dặn: nối bảng và <b>tải kèm</b> danh sách trong cùng một
      câu SQL</td></tr></table>'
    say: Bảng này giải mã các tên trên màn hình. Nhãn thực thể báo lớp Java ứng với
      một bảng, nhãn mã định danh đánh dấu khoá chính, hai nhãn quan hệ nói một khách
      có nhiều tài khoản. Phiên chứa ngữ cảnh bền vững giữ các đối tượng đã tải. Tải
      lười là chờ tới khi đụng mới lấy, tải ngay là lấy cùng lúc.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ nhỏ</th></tr><tr><td><code>List&lt;TaiKhoan&gt;
      tk</code></td><td>danh sách mà mỗi phần tử là một <code>TaiKhoan</code></td><td><code>tk.size()</code>
      cho số tài khoản</td></tr><tr><td><code>try (Session s = sf.openSession()) {
      … }</code></td><td>mở một phiên tên <code>s</code>, và <b>tự đóng</b> khi chạy
      ra khỏi khối ngoặc nhọn</td><td>như phòng có cửa tự đóng khi bạn bước ra</td></tr><tr><td><code>for
      (Khach k : ds)</code></td><td>với mỗi khách <code>k</code> trong danh sách <code>ds</code>,
      chạy khối bên dưới một lần</td><td>3 khách thì chạy 3 lần</td></tr><tr><td><code>:n</code>
      và <code>.setParameter("n", n)</code></td><td><code>:n</code> là chỗ trống có
      tên trong câu truy vấn; <code>setParameter</code> điền giá trị vào chỗ trống</td><td><code>where
      k.id &lt;= :n</code> với n = 5 là &laquo;mã từ 1 tới 5&raquo;</td></tr><tr><td><code>interface
      KhachRepo extends CrudRepository&lt;Khach, Long&gt;</code></td><td><b>giao diện</b>
      chỉ liệt kê tên hàm; <code>extends</code> là thừa hưởng hàm có sẵn; hai kiểu
      trong <code>&lt; &gt;</code> là thực thể và kiểu khoá chính</td><td><code>Long</code>:
      kiểu của <code>@Id</code> trong <code>Khach</code></td></tr></table>'
    clear: true
    say: Mã Java sắp tới có vài cách viết cần đọc trước. Khối mở phiên tự đóng phiên
      khi chạy ra khỏi ngoặc, vòng lặp chạy một lần cho mỗi khách, và dấu hai chấm
      cùng tên là chỗ trống trong câu truy vấn. Giao diện chỉ liệt kê tên hàm.
