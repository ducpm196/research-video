      x="380.0" y="308" font-size="22" text-anchor="middle" fill="#1f2937">③ select
      tk where khach_id = 2  (đụng vào K2)</text><rect x="40" y="350" width="680"
      height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text
      x="380.0" y="388" font-size="22" text-anchor="middle" fill="#1f2937">④ select
      tk where khach_id = 3  (đụng vào K3)</text><text x="380" y="460" font-size="24"
      text-anchor="middle" fill="#dc2626" font-weight="bold">1 + N = 1 + 3 = 4 câu;
      với N = 500 là 501 câu</text><text x="1120" y="90" font-size="26" text-anchor="middle"
      fill="#16a34a" font-weight="bold">nối kèm tải (join fetch)</text><rect x="780"
      y="110" width="680" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text
      x="1120.0" y="163" font-size="22" text-anchor="middle" fill="#1f2937">① select
      khach join tk</text><text x="1120.0" y="193" font-size="22" text-anchor="middle"
      fill="#1f2937">trả cả 6 dòng: mỗi khách kèm tài khoản</text><rect x="780" y="270"
      width="680" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text
      x="1120.0" y="318" font-size="22" text-anchor="middle" fill="#1f2937">bộ ánh
      xạ ghép 6 dòng thành 3 khách,</text><text x="1120.0" y="348" font-size="22"
      text-anchor="middle" fill="#1f2937">mỗi khách có danh sách tài khoản đầy đủ</text><text
      x="1120.0" y="378" font-size="22" text-anchor="middle" fill="#1f2937">đụng vào
      danh sách: không thêm câu nào</text><text x="1120" y="460" font-size="24" text-anchor="middle"
      fill="#16a34a" font-weight="bold">luôn 1 câu, nhưng mỗi câu trả về nhiều dòng
      hơn</text><text x="750" y="530" font-size="24" text-anchor="middle" fill="#1f2937"
      font-weight="bold">Đánh đổi: bớt số lần đi tới cơ sở dữ liệu, đổi lại mỗi lần
      trả nhiều dữ liệu hơn</text></svg></div>'
    clear: true
    say: 'Hình thứ hai đặt hai cách lấy dữ liệu cạnh nhau, với ba khách để dễ đếm.
      Bên trái là tải lười: một câu lấy ba khách, rồi mỗi lần đụng vào danh sách lại
      thêm một câu, tổng một cộng N là bốn câu. Bên phải là nối kèm tải: một câu nối
      hai bảng trả sáu dòng, nên đụng vào danh sách không thêm câu nào.'
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ một thực thể tới số câu SQL'
  checks:
  - alg.bnx_l24_lazy_sql(3) == 4 and alg.bnx_l24_lazy_sql(50) == 51
  - alg.bnx_l24_rows_join(3, 2) == 6
  - alg.bnx_l24_find_sql(2) == 1
  - alg.bnx_l24_khach_thay(501, 1, 'trong') == 500 and alg.bnx_l24_khach_thay(501,
    1, 'trai') == 501
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>public
      class Khach { … }</code></td><td>khai một lớp tên Khach; phần thân nằm giữa
      cặp ngoặc nhọn</td></tr><tr><td><code>@Id Long id;</code>, <code>String ten;</code></td><td>khai
      trường: kiểu rồi tên; <code>Long</code>: số nguyên lớn; <code>String</code>:
      chuỗi chữ; nhãn <code>@Id</code> đứng trước: khoá chính</td></tr><tr><td><code>List&lt;TaiKhoan&gt;
      tk = new ArrayList&lt;&gt;();</code></td><td>khai danh sách <code>tk</code>
      các <code>TaiKhoan</code> và gán ngay một danh sách rỗng mới tạo (<code>new</code>);
      <code>&lt;&gt;</code> để trống thì lấy kiểu ở vế trái</td></tr></table>'
    clear: true
    say: Trước khi đọc mã Java, ta cần ba ký hiệu, vì mã dùng chúng ngay. Khai một
      lớp có tên, phần thân nằm giữa cặp ngoặc nhọn. Khai trường là viết kiểu rồi
      tên, và nhãn đứng trước cho biết trường là khoá chính. Câu này khai một danh
      sách tài khoản và gán ngay một danh sách rỗng mới tạo.
  - show: '<p><b>Bước 1.</b> Ta muốn mỗi đối tượng Java ứng với một dòng, nên khai
      <b>thực thể</b>: lớp có nhãn <code>@Entity</code>, một trường khoá chính <code>@Id</code>.

      Quan hệ một–nhiều khai ở cả hai phía, và phía có khoá ngoại là phía &laquo;nhiều&raquo;.</p><p><b>Khach.java:
      khách có danh sách tài khoản</b></p><div class="code"><div>@Entity</div><div>public
      class Khach {</div><div>  @Id Long id;</div><div>  String ten;</div><div>  @OneToMany(mappedBy
      = "khach")</div><div>  List&lt;TaiKhoan&gt; tk = new ArrayList&lt;&gt;();</div><div>}</div></div>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, vì muốn mỗi đối tượng ứng với một dòng, ta khai thực thể bằng nhãn
      trên lớp và một trường khoá chính. Khách có danh sách tài khoản, còn tài khoản
      giữ khoá ngoại.
  - show: '<p><b>TaiKhoan.java: tài khoản thuộc về một khách, tải lười</b></p><div
      class="code"><div>@Entity</div><div>public class TaiKhoan {</div><div>  @Id
      Long id;</div><div>  @ManyToOne(fetch = FetchType.LAZY)</div><div>  Khach khach;</div><div>  long
      soDu;</div><div>}</div></div><p>Làm thử: 1 khách, 2 tài khoản thì bảng tài khoản
      có 2 dòng, cùng ghi <code>khach_id = 1</code>.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Tài khoản khai thuộc về một khách và dặn tải lười, nghĩa là chưa lấy khách
      vội. Làm thử: một khách, hai tài khoản thì hai dòng cùng ghi mã khách là một.'
  - show: '<p><b>Bước 2.</b> Muốn thao tác với dòng, ta cần một nơi giữ các đối tượng
      đang dùng, để không tải trùng và để biết cái nào đã bị sửa. Nơi đó là <b>ngữ
      cảnh bền vững</b> trong một <b>phiên</b>.

      Hai lần tìm cùng một mã trong một phiên cho <b>cùng một đối tượng</b>, và chỉ
      chạy <b>1</b> câu SQL.</p><p><b>DemBan.java (trích)</b></p><div class="code"><div>      TaiKhoan
      a = s.find(TaiKhoan.class, 11L);</div><div>      TaiKhoan b = s.find(TaiKhoan.class,
      11L);</div></div><p>Làm thử: hai lệnh tìm, chỉ một SELECT, vì lệnh thứ hai thấy
      đối tượng đã có trong ngữ cảnh.</p>

      '
    focus:
    - 1
    - 3
    clear: true
    say: Bước hai, vì cần không tải trùng và biết cái nào đã bị sửa, ta giữ các đối
      tượng đang dùng trong ngữ cảnh bền vững của một phiên. Hai lần tìm cùng một
      mã cho cùng một đối tượng và chỉ một câu SQL.
  - show: '<p><b>Bước 3.</b> Một khách có thể có hàng trăm tài khoản, và phần lớn
      màn hình không cần chúng. Nên danh sách quan hệ <b>mặc định tải lười</b>: chỉ
      lấy khi mã <b>đụng tới</b> (<code>k.tk.size()</code>).

      Hậu quả: vòng lặp qua <b>N</b> khách, mỗi khách đụng một lần, sinh <b>N</b>
      câu phụ cộng <b>1</b> câu lấy danh sách khách.</p>

      $$\text{số câu SQL} = 1 + N \qquad (N = 3 \Rightarrow 4;\; N = 50 \Rightarrow
      \hl{51})$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước ba, danh sách quan hệ mặc định tải lười, chỉ lấy khi mã đụng tới, vì
      một khách có thể có hàng trăm tài khoản. Vòng lặp qua N khách sinh N câu phụ
      cộng một câu lấy danh sách khách, nên số câu SQL bằng một cộng N.
    introduces:
    - implies
  - show: '<p><b>Bước 4.</b> Muốn bỏ N câu phụ, ta dặn lấy danh sách <b>cùng lúc</b>
      trong câu truy vấn theo đối tượng, bằng <code>join fetch</code>. Câu SQL sinh
      ra là một phép nối, trả về <b>số dòng = số khách × số tài khoản mỗi khách</b>
      (khi khách nào cũng có tài khoản).</p><p><b>câu truy vấn theo đối tượng</b></p><div
      class="code"><div>select k from Khach k</div><div> join fetch k.tk</div><div>
      where k.id &lt;= :n</div></div>$$\text{số câu SQL} = \hl{1}; \qquad \text{số
      dòng trả về} = N \times 2 \;\; (N = 3 \Rightarrow 6)$$

      <p class="note"><b>Điều kiện:</b> <code>join fetch</code> là nối trong, nên
      khách chưa có tài khoản nào biến mất khỏi kết quả. Muốn giữ họ, viết <code>left
      join fetch</code> (nối trái).</p>

      '
    focus:
    - 1
    - 3
    clear: true
    say: Bước bốn, dặn lấy danh sách cùng lúc bằng phép nối kèm tải, nên chỉ còn một
      câu SQL. Đổi lại số dòng bằng số khách nhân số tài khoản mỗi khách, ba khách
      hai tài khoản là sáu dòng.
  - show: '<p><b>Bước 5.</b> Khi ta sửa đối tượng đang được quản lý, ta <b>không gọi
      hàm lưu nào</b>. Lúc cần, bộ ánh xạ <b>kiểm bẩn</b>: so đối tượng với bản chụp
      lúc tải; khác thì sinh <code>UPDATE</code>.

      Việc ghi các thay đổi xuống cơ sở dữ liệu gọi là <b>đẩy xuống</b> (flush). Mặc
      định đẩy khi chốt giao dịch, và cả <b>ngay trước một truy vấn có thể bị ảnh
      hưởng</b>, để truy vấn thấy dữ liệu mới.</p><p><b>DemBan.java (trích): sửa,
      rồi truy vấn cùng bảng</b></p><div class="code"><div>      a.soDu = a.soDu +
      500;          // không gọi hàm lưu nào</div><div>      s.createQuery("select
      count(t) from TaiKhoan t", Long.class)</div><div>          .getSingleResult();</div></div>

      '
    focus:
    - 1
    - 2
    clear: true
    say: 'Bước năm, sửa đối tượng đang được quản lý thì không gọi hàm lưu nào, vì
      bộ ánh xạ tự kiểm bẩn: so đối tượng với bản chụp lúc tải, khác thì sinh lệnh
      cập nhật. Việc ghi xuống gọi là đẩy xuống, xảy ra khi chốt hoặc trước truy vấn
      kế tiếp.'
  - show: '<p><b>Bước 6.</b> Kho truy cập dữ liệu của Spring (Spring Data) viết gọn
      các việc trên: ta khai một <b>giao diện</b>, Spring tạo phần cài đặt.

      Theo hướng dẫn chính thức, giao diện cơ sở <code>CrudRepository</code> có sẵn
      lưu, tìm theo mã, đếm, xoá; và <b>tên hàm</b> như <code>findByTen</code>, <code>countByTen</code>
      được đọc để <b>sinh truy vấn</b>.</p><p><b>KhachRepo: giao diện, không có thân
      hàm (ghép từ ví dụ của hướng dẫn, không chạy trên máy này)</b></p><div class="code"><div>interface
      KhachRepo extends CrudRepository&lt;Khach, Long&gt; {</div><div>  List&lt;Khach&gt;
      findByTen(String ten);</div><div>  long countByTen(String ten);</div><div>}</div></div><p>Làm
      thử: <code>countByTen("K7")</code> hỏi &laquo;có bao nhiêu khách tên K7&raquo;,
      không cần viết câu truy vấn nào.</p>

      '
    focus:
    - 1
    - 3
    clear: true
    say: 'Bước sáu, kho truy cập dữ liệu của Spring viết gọn các việc trên: ta khai
      một giao diện, Spring tạo phần cài đặt. Theo hướng dẫn chính thức, tên hàm được
      đọc để sinh truy vấn, như hàm đếm theo tên.'
- id: example
  kind: example
  title: Ví dụ chạy thật Hibernate, từng phép tính
  checks:
  - alg.bnx_l24_lazy_sql(2) == 3
  - '[alg.bnx_l24_lazy_sql(n) for n in (5, 50, 500)] == [6, 51, 501]'
  - alg.bnx_l24_join_sql(500) == 1
  - alg.bnx_l24_find_sql(2) == 1
  - alg.bnx_l24_entities_held(500, 2) == 1500
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>static
      SessionFactory mo(int n)</code></td><td>khai hàm: kiểu trả về <code>SessionFactory</code>,
      tên <code>mo</code>, tham số n kiểu số nguyên; <code>static</code>: thuộc cả
      lớp</td></tr><tr><td><code>new Configuration().addAnnotatedClass(Khach.class)</code></td><td>tạo
      mới một đối tượng cấu hình; mỗi <code>.hàm(…)</code> chỉnh nó rồi trả lại chính
      nó nên viết nối nhau; <code>Khach.class</code>: chính lớp Khach; <code>.setProperty("khoá",
      "giá trị")</code>: đặt một thiết lập</td></tr></table>'
    clear: true
    say: Ta cần hai ký hiệu này trước khi đọc mã dựng. Khai hàm gồm kiểu trả về, tên
      hàm, rồi tham số trong ngoặc tròn. Tạo mới một đối tượng cấu hình, rồi gọi nối
      tiếp các hàm, mỗi hàm chỉnh nó và trả lại chính nó.
  - show: '<p><b>Kho.java (đoạn đầu; mã đủ ở tệp kèm labs/BNX/L24/java/Kho.java):
      dựng bộ ánh xạ nối với H2, cơ sở dữ liệu nhỏ trong bộ nhớ</b></p><div class="code"><div>  static
      SessionFactory mo(int n) {</div><div>    SessionFactory sf = new Configuration()</div><div>        .addAnnotatedClass(Khach.class)</div><div>        .addAnnotatedClass(TaiKhoan.class)</div><div>        .setProperty("hibernate.connection.url",
      "jdbc:h2:mem:bnx")</div><div>        .setProperty("hibernate.hbm2ddl.auto",
      "create-drop")</div><div>        .setProperty("hibernate.generate_statistics",
      "true")</div><div>        .buildSessionFactory();</div></div>'
    focus:
    - 0
    - - '2.2'
      - '2.3'
      - '2.4'
      - '2.5'
    - '2.7'
    introduces:
    - bnx_h2
    clear: true
    say: Ta chạy thật bộ ánh xạ bản bảy chấm một, nối với H2, một cơ sở dữ liệu nhỏ
      chạy ngay trong bộ nhớ. Đoạn này khai hai thực thể, địa chỉ cơ sở dữ liệu, và
      dặn tự tạo bảng. Dòng thống kê bật bộ đếm số câu SQL thật.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>public
      static void main(String[] x)</code></td><td>nơi chương trình bắt đầu chạy; <code>String[]
      x</code>: mảng chuỗi gõ kèm, bài không dùng</td></tr><tr><td><code>for (Khach
      k : …getResultList())</code></td><td>duyệt từng phần tử: mỗi vòng <code>k</code>
      là một khách trong kết quả</td></tr></table>'
    clear: true
    say: Ta cần hai ký hiệu Java này trước khi đọc tệp chạy. Hàm chính là nơi chương
      trình bắt đầu chạy. Vòng lặp duyệt từng khách trong kết quả truy vấn.
  - show: '<p><b>DemSql.java (đủ tệp): in từng câu SQL thật</b></p><div class="code"><div>import
      org.hibernate.*;</div><div>public class DemSql {</div><div>  public static void
      main(String[] x) {</div><div>    SessionFactory goc = Kho.mo(2);</div><div>    SessionFactory
