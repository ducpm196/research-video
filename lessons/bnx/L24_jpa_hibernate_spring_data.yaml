- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm bằng sqlite và Python'
  checks:
  - alg.bnx_l24_lazy_sql(50) == 51
  - 1 + 50 == alg.bnx_l24_lazy_sql(50)
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th></tr><tr><td><code>for
      (i,) in db.execute("SELECT id FROM k").fetchall():</code></td><td>mỗi dòng kết
      quả là một bộ một phần tử; <code>(i,)</code> tách phần tử đó ra thành i</td></tr><tr><td><code>db.execute("INSERT
      INTO k VALUES (?)", (i,))</code></td><td><code>?</code> là chỗ trống trong câu
      SQL; bộ <code>(i,)</code> điền giá trị vào đó</td></tr><tr><td><code>db.set_trace_callback(lambda
      c: n.append(c))</code></td><td><code>lambda c: …</code>: hàm ngắn không tên
      nhận câu SQL c và thêm vào danh sách n; sqlite3 gọi nó mỗi lần chạy một câu</td></tr></table>'
    clear: true
    say: Trước khi đọc mã, ta cần ba ký hiệu Python, vì mã dùng chúng ngay. Mỗi dòng
      kết quả là một bộ một phần tử, dấu phẩy tách nó ra thành một tên. Dấu hỏi là
      chỗ trống trong câu SQL, bộ giá trị phía sau điền vào. Hàm ngắn không tên nhận
      câu SQL và thêm vào danh sách, và thư viện gọi nó mỗi lần chạy một câu.
  - show: '<p><b>Đếm câu SQL bằng một thư viện khác hẳn: sqlite3 của Python, không
      dùng Hibernate</b></p><div class="code"><div>db = sqlite3.connect(":memory:")</div><div>db.execute("CREATE
      TABLE k (id INTEGER)")</div><div>db.execute("CREATE TABLE t (id INTEGER, kid
      INTEGER)")</div><div>for i in range(1, 51):</div><div>    db.execute("INSERT
      INTO k VALUES (?)", (i,))</div><div>    db.execute("INSERT INTO t VALUES (?,
      ?)", (i * 10 + 1, i))</div><div>    db.execute("INSERT INTO t VALUES (?, ?)",
      (i * 10 + 2, i))</div><div>n = []</div><div>db.set_trace_callback(lambda c:
      n.append(c))</div><div>for (i,) in db.execute("SELECT id FROM k").fetchall():</div><div>    db.execute("SELECT
      * FROM t WHERE kid = ?", (i,)).fetchall()</div><div>print(len(n), "cau")</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Ta kiểm bằng đường khác hẳn, vì muốn con số không phụ thuộc bộ ánh xạ: mã
      Python tạo hai bảng nhỏ, năm mươi khách, mỗi khách hai tài khoản. Hàm đếm ghi
      nhận mỗi câu SQL chạy, còn mã lặp từng khách và hỏi tài khoản của họ.'
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>51 cau</div></div>

      $$1 + 50 = \hlg{51}$$<table class=''t''><tr><th>cách đếm</th><th>kết quả cho
      50 khách</th></tr><tr><td>Hibernate chạy thật, bộ đếm thống kê</td><td>51 câu</td></tr><tr><td>sqlite3
      của Python, bộ đếm câu SQL</td><td>51 câu</td></tr><tr><td>công thức 1 + N</td><td>1
      + 50 = 51</td></tr></table>

      '
    clear: true
    say: Kết quả chạy thật là năm mươi mốt câu, và ba đường độc lập đều cho cùng con
      số, nên vấn đề một cộng N đến từ cách tải lười, không phải từ một thư viện.
