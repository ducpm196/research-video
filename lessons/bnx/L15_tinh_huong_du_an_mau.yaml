    say: Bảng thứ hai là các mảnh ngoài cơ sở dữ liệu. Outbox ghi sự kiện vào bảng
      trong cùng giao dịch ghi tiền, rồi tiến trình khác gửi sang Kafka, nên Kafka
      hỏng thì sự kiện không mất. Redis đệm đọc nhanh nhưng có thể cũ, nên trừ tiền
      đọc từ Oracle. Mã truy cập cho biết người gọi, mTLS cho biết máy gọi.
