  - show: '<table class=''t''><tr><th>cách xử lý</th><th>được</th><th>mất</th></tr><tr><td>tăng
      số kết nối của bể</td><td>dễ làm, không đổi mã</td><td>cơ sở dữ liệu phải giữ
      thêm tiến trình, có trần; quá trần thì chậm hơn</td></tr><tr><td>nhân bản dịch
      vụ và chia dữ liệu theo tài khoản</td><td>tải chia ra, chịu thêm gần tỉ lệ với
      số mảnh</td><td>chuyển tiền giữa hai mảnh phức tạp hơn (cần chuỗi bước bù trừ:
      mỗi bước có bước huỷ để bù nếu bước sau hỏng)</td></tr><tr><td>xếp hàng bất
      đồng bộ (nhận lệnh vào hàng, trả lời sau) để làm phẳng cao điểm</td><td>cao
      điểm thành dòng đều, Oracle không bị dồn</td><td>khách chờ kết quả lâu hơn,
      thêm chỗ hỏng phải xử lý</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Đây là đánh đổi phải chọn, tăng số kết nối thì dễ nhưng cơ sở dữ liệu có
      trần. Chia dữ liệu theo tài khoản làm tải chia ra, đổi lại chuyển tiền giữa
      hai mảnh cần chuỗi bước bù trừ. Xếp hàng bất đồng bộ, tức nhận lệnh rồi trả
      lời sau, làm phẳng cao điểm, đổi lại khách chờ lâu hơn.
- id: pitfalls
  kind: pitfall
  title: Bài học sai hay gặp khi làm dự án mẫu
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (nặng nhất).</b> <b class="red">Khai số
      đo của dự án mẫu là số của hệ thống ngân hàng thật</b>, kiểu “hệ thống tôi làm
      chịu 116 giao dịch/giây”. Người phỏng vấn hỏi hai lớp là lộ.

      <br><span class="note">Nói đúng: “dự án cá nhân, máy của tôi, dữ liệu giả, đo
      được …”.</span></div>

      '
    say: 'Lỗi nặng nhất là khai số đo của dự án mẫu như số của hệ thống ngân hàng
      thật, kiểu hệ thống tôi chịu một trăm mười sáu giao dịch mỗi giây. Hỏi thêm
      hai lớp là lộ, nên hãy nói đúng: dự án cá nhân, dữ liệu giả.'
  - show: '<div class="box warn"><b>Lỗi 2 (mức hệ thống).</b> <b class="red">Thêm
      công nghệ chỉ vì có trong tin tuyển dụng (JD)</b>: nhét Elasticsearch (cơ sở
      dữ liệu tìm kiếm), Couchbase (cơ sở dữ liệu lưu dữ liệu dạng JSON), gRPC (cách
      gọi nhị phân giữa dịch vụ) vào một API chuyển khoản không có yêu cầu nào cần
      chúng.

      <br><span class="note">Phép thử: bỏ thành phần đó đi thì yêu cầu nào hỏng? Không
      có → bỏ.</span></div>

      '
    clear: true
    say: Lỗi ở mức hệ thống là thêm công nghệ chỉ vì có trong tin tuyển dụng, như
      nhét công cụ tìm kiếm vào API chuyển khoản không cần nó. Phép thử là bỏ thành
      phần đó thì yêu cầu nào hỏng, không có thì bỏ.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> <b class="red">Tối
      ưu trước khi đo</b>: đệm số dư vào Redis cho “nhanh” khi Oracle mới dùng $40$
      trong $300$ ms. Vừa không cần, vừa sai: số dư trong bộ đệm có thể cũ, dùng nó
      để trừ tiền là trừ sai.

      <br><span class="note">Phép thử: đo phân vị 99 của từng chặng trước (gửi nhiều
      lệnh thử, sắp thời gian tăng dần, lấy giá trị ở vị trí 99%), sửa chặng chậm
      nhất.</span></div>

      '
    clear: true
    say: Lỗi của người đã đi làm là tối ưu trước khi đo, ví dụ đệm số dư vào Redis
      trong khi Oracle mới dùng bốn mươi trong ba trăm mili giây. Việc đó vừa không
      cần vừa sai vì số dư trong đệm có thể cũ.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l15_round(alg.bnx_l15_tps(2000000), 1) == Fraction('23.1')
  - alg.bnx_l15_round(alg.bnx_l15_tps(2000000), 3) == Fraction('23.148')
  - alg.bnx_l15_round(alg.bnx_l15_tps(2000000, 8)) == 185
  - 10 + 5 + 20 + 40 + 2 == 77
  - alg.bnx_l15_left(250, [10, 5, 20, 40, 2]) == 250 - 77 == 173
  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000, 10)) == 116
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>2
      000 000 giao dịch/ngày, cao điểm gấp 8 (số minh hoạ): trung bình và cao điểm
      bao nhiêu giao dịch/giây?</td></tr><tr><td>2</td><td>Ngân sách 250 ms; cổng
      10, xác thực 5, dịch vụ 20, Oracle 40, thêm một lần đọc Redis 2 ms. Còn dư bao
      nhiêu?</td></tr><tr><td>3</td><td>Quyết định: ở 116 giao dịch/giây, dùng Outbox
      + Kafka, hay Outbox + một bảng mà dịch vụ thông báo đọc thẳng?</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
    pause: 25
    say: 'Đến lượt bạn, ta có ba câu, câu một: hai triệu giao dịch mỗi ngày, cao điểm
      gấp tám, thì trung bình và cao điểm bao nhiêu mỗi giây? Câu hai: ngân sách hai
      trăm năm mươi mili giây, các chặng mười, năm, hai mươi, bốn mươi và Redis hai,
      còn dư bao nhiêu? Câu ba: ở một trăm mười sáu giao dịch mỗi giây, nên dùng Outbox
      cộng Kafka hay Outbox cộng một bảng? Hãy dừng video và làm ra giấy.'
  - show: '<p>Câu 1:</p>

      $$\frac{2\,000\,000}{86\,400} \approx \hl{23{,}1}, \qquad 8 \cdot 23{,}148 \approx
      \hl{185}\ \text{giao dịch/giây}$$

      '
    focus:
    - 1
    - 2
    say: 'Đáp án câu một: hai triệu chia tám mươi sáu nghìn bốn trăm xấp xỉ hai mươi
      ba phẩy một. Nhân tám, dùng số chưa làm tròn hai mươi ba phẩy một bốn tám, được
      xấp xỉ một trăm tám mươi lăm giao dịch mỗi giây.'
    clear: true
  - show: '<p>Câu 2: các chặng nối tiếp nên cộng lại, $10 + 5 + 20 + 40 + 2 = 77$.</p>

      $$250 - 77 = \hlg{173}\ \text{ms}$$

      '
    say: 'Đáp án câu hai: các chặng nối tiếp nên cộng lại bằng bảy mươi bảy, và hai
      trăm năm mươi trừ bảy mươi bảy còn dư một trăm bảy mươi ba mili giây.'
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th><th>đổi
      khi</th></tr><tr><td>Outbox + một bảng</td><td>ít thành phần, một cơ sở dữ liệu;
      dễ chạy, dễ giải thích; 116/giây là tải nhỏ</td><td>dịch vụ thông báo quét bảng,
      thêm việc cho Oracle; mỗi người nhận mới lại phải đọc bảng</td><td>chỉ một người
      nhận, chưa đo thấy quét bảng làm chậm Oracle</td></tr><tr><td>Outbox + Kafka</td><td>nhiều
      dịch vụ cùng nghe, đọc lại được lịch sử, người nhận đi nhịp riêng</td><td>thêm
      cụm Kafka phải vận hành, thêm chỗ hỏng</td><td>từ hai người nhận trở lên, cần
      đọc lại, hoặc đo thấy bảng là điểm nghẽn</td></tr></table><p class=''note''>Cả
      hai cách đều gửi <b>ít nhất một lần</b>: bên gửi có thể sập sau khi gửi mà chưa
      kịp ghi “đã gửi”, rồi gửi lại. Người nhận phải lũy đẳng ở <b>cả hai</b> cách.</p>'
    focus:
    - '1.2'
    - '1.3'
    - 2
    say: 'Đáp án câu ba là một đánh đổi: Outbox cộng một bảng ít thành phần và dễ
      chạy, vì tải nhỏ, đổi lại mỗi người nhận mới phải đọc bảng. Outbox cộng Kafka
      cho nhiều dịch vụ cùng nghe, đổi lại thêm một cụm phải vận hành. Cả hai cách
      đều có thể gửi lại nên người nhận phải lũy đẳng; chọn Kafka khi có từ hai người
      nhận.'
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: ước lượng tải, ngân sách và bể kết nối'
  steps:
  - show: '<p><b>Đề</b>: viết <code>mau.py</code> cho bộ số liệu trong <code>de.md</code>
      (5 000 000 giao dịch/ngày, cao điểm gấp 6, ngân sách 400 ms, Oracle 120 ms,
      bể 30 kết nối) và in năm dòng:</p>

      <ol><li>tải trung bình và tải cao điểm (giao dịch/giây)</li><li>phần dư của
      ngân sách độ trễ</li><li>số lệnh cùng lúc ở Oracle ở cao điểm</li><li>bể 30
      kết nối đủ không, và cần ít nhất bao nhiêu kết nối</li></ol>

      <p>Các chặng nối tiếp (ms): cổng 12, xác thực 6, dịch vụ 25, Oracle 120, đọc
      Redis 3.</p>

      <p class="note">Số liệu khác ví dụ trong bài; đầu ra viết không dấu.</p>

      '
    focus:
    - 1
    - - 2
      - 3
    pause: 120
    say: 'Bây giờ tới phần bạn tự làm với bộ số liệu mới: năm triệu giao dịch mỗi
      ngày, cao điểm gấp sáu, ngân sách bốn trăm mili giây, năm chặng có trong đề,
      bể ba mươi kết nối. Viết chương trình in tải, phần dư, số lệnh cùng lúc và kết
      luận về bể, hãy dừng video và tự viết.'
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>trung binh 57.9 giao
      dich/giay</div><div>cao diem 347 giao dich/giay</div><div>con du 234 ms</div><div>cung
      luc o Oracle 41.7</div><div>be 30 ket noi: khong du - can it nhat 42</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh BNX L15 mau.py</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> trung bình = 5 000 000 ÷ 86 400; cao
      điểm = 6 × trung bình; dư = 400 − tổng các chặng; cùng lúc = cao điểm CHƯA làm
      tròn × 0,120 (giây; làm tròn chỉ khi in); số kết nối cần = <code>math.ceil</code>
      của số cùng lúc.

      Lời giải ở <code>labs/BNX/L15/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, hãy chia năm triệu cho tám mươi sáu nghìn bốn trăm, nhân sáu, rồi
      nhân với thời gian mỗi lệnh ở Oracle tính bằng giây. Số kết nối cần là số đó
      làm tròn lên. Lời giải nằm trong thư mục thực hành, chỉ mở sau khi đã tự thử.
  lab: labs/BNX/L15
  checks:
  - alg.bnx_l15_round(alg.bnx_l15_tps(5_000_000), 1) == Fraction('57.9') and alg.bnx_l15_round(alg.bnx_l15_tps(5_000_000,
