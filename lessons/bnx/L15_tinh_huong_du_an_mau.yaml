      người gọi là ai, được làm gì; mTLS: hai bên đều xuất trình chứng chỉ, nói máy
      nào đang gọi</td><td>hai lớp xác thực khác nhau</td></tr><tr><td>Docker + GitLab
      CI, cổng API</td><td>đóng gói, kiểm rồi mới triển khai; cổng giới hạn tốc độ</td><td>test
