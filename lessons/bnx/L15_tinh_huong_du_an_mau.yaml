  - show: '<p>Bằng tay: ① 11,6; ② 116; ④ 225; ⑤ 4,63.</p><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>giay moi ngay: 86400</div><div>trung binh: 11.6</div><div>cao
