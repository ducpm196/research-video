      hàng chờ dài thêm 1 156 157 lệnh mỗi giây</td></tr></table>'
    clear: true
    say: Một bể năm mươi kết nối chịu một nghìn hai trăm năm mươi giao dịch mỗi giây.
      Ở gấp trăm lần, cao điểm là mười một nghìn năm trăm bảy mươi bốn nên hàng chờ
