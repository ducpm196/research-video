    focus:
    - - '1.1'
      - '1.3'
    - - '1.5'
      - '1.7'
      - '1.9'
      - '1.11'
    say: 'Tổng kết: từ tin tuyển dụng ta đổi ra mười một phẩy sáu và một trăm mười
      sáu giao dịch mỗi giây, dư hai trăm hai mươi lăm mili giây. Mỗi thành phần trả
