- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ số giao dịch mỗi ngày tới ngân sách'
  checks:
  - 24 * 60 * 60 == 86400
  - alg.bnx_l15_tps(86400) == 1
  - alg.bnx_l15_tps(86400, 10) == 10
  - alg.bnx_l15_left(100, [30, 50]) == 20
  - alg.bnx_l15_inflight(10, 100) == 1
  steps:
  - show: '<p><b>Bước 1.</b> Vì giao dịch được tính theo ngày còn hệ thống chịu tải
      theo giây, nên đổi ngày ra giây: $24 \cdot 60 \cdot 60 = 86\,400$.</p>

      <p><b>Bước 2.</b> Chia đều thì tải trung bình $= \frac{\text{số giao dịch mỗi
      ngày}}{86\,400}$.</p>

      <span class=''note''>Làm thử: $86\,400$ giao dịch/ngày → $\frac{86\,400}{86\,400}
      = 1$ giao dịch/giây.</span>

      '
    focus:
    - 1
    - 2
    - 3
    say: Bước một, vì giao dịch được tính theo ngày còn hệ thống chịu tải theo từng
      giây, nên ta đổi ngày ra giây, được tám mươi sáu nghìn bốn trăm. Bước hai, nếu
      chia đều thì tải trung bình bằng số giao dịch mỗi ngày chia cho tám mươi sáu
      nghìn bốn trăm. Làm thử, tám mươi sáu nghìn bốn trăm giao dịch mỗi ngày chia
      đều là một giao dịch mỗi giây.
  - show: '<p><b>Bước 3.</b> Giao dịch dồn vào giờ đông, nên nhân hệ số cao điểm $k$
      <i>(số minh hoạ; số thật lấy từ nhật ký)</i>.</p>

      <span class=''note''>Làm thử: $1$ giao dịch/giây, $k = 10$ → $10$ giao dịch/giây
      ở cao điểm.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, vì giao dịch dồn vào giờ đông, nên ta nhân thêm hệ số cao điểm k.
      Đây là số minh hoạ, còn số thật phải lấy từ nhật ký. Làm thử, một giao dịch
      mỗi giây với k bằng mười thì cao điểm là mười giao dịch mỗi giây.
  - show: '<p><b>Bước 4.</b> Các chặng chạy <b>nối tiếp</b>, nên thời gian cộng lại:
      phần dư $=$ ngân sách $-$ tổng các chặng.</p>

      <span class=''note''>Làm thử:</span>

      $$100 - (30 + 50) = 20 \text{ ms}$$

      '
    focus:
    - 1
    - 1
    - 3
    say: Bước bốn, vì các chặng chạy nối tiếp, chặng sau chờ chặng trước, nên thời
      gian cộng lại. Phần dư bằng ngân sách trừ tổng các chặng. Làm thử, ngân sách
      một trăm mili giây, hai chặng ba mươi và năm mươi, thì còn dư hai mươi.
  - show: '<p><b>Bước 5.</b> Khi tải ổn định, số lệnh <b>trung bình</b> đang ở một
      chặng <b>cùng lúc</b> $=$ số lệnh đến mỗi giây $\cdot$ thời gian mỗi lệnh ở
      đó (định luật Little), vì mỗi giây có lệnh mới vào trong khi lệnh cũ chưa ra.</p>

      <span class=''note''>Làm thử: $10$ lệnh/giây, mỗi lệnh ở lại $0{,}1$ giây →
      $10 \cdot 0{,}1 = 1$ lệnh cùng lúc, tính trung bình.</span>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước năm, khi tải ổn định, số lệnh trung bình ở một chặng cùng lúc bằng số
      lệnh đến mỗi giây nhân thời gian mỗi lệnh ở đó, vì lệnh mới vào trong khi lệnh
      cũ chưa ra. Giống một quầy giao dịch, mỗi giây mười khách vào, mỗi khách ở lại
      một phần mười giây, thì trung bình trong quầy có một khách.
- id: example
  kind: example
  title: Ví dụ bằng số, từng phép tính
  checks:
  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000), 1) == Fraction('11.6')
  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000), 3) == Fraction('11.574')
  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000, 10)) == 116
  - 10 + 5 + 20 + 40 == 75
  - alg.bnx_l15_left(300, [10, 5, 20, 40]) == 300 - 75 == 225
  - alg.bnx_l15_inflight(116, 40) == Fraction(464, 100)
  - round(float(alg.bnx_l15_inflight(116, 40))) == 5
  steps:
  - show: '<p>Một triệu giao dịch mỗi ngày, dùng lại $86\,400$ giây ở bước 1.</p>

      $$① \; \frac{1\,000\,000}{86\,400} \approx \hl{11{,}6}\ \text{giao dịch/giây}$$

      '
    focus:
    - 1
    - 2
    say: Ta tính từng bước. Phép tính thứ nhất, một triệu chia tám mươi sáu nghìn
      bốn trăm, xấp xỉ mười một phẩy sáu giao dịch mỗi giây.
  - show: '<p>Dùng lại kết quả ① chưa làm tròn ($11{,}574\ldots$), cao điểm gấp $10$
      <i>(số minh hoạ)</i>.</p>

      $$② \; 10 \cdot 11{,}574 \approx \hl{116}\ \text{giao dịch/giây}$$

      '
    focus:
    - 1
    - 2
    introduces:
    - dots
    say: Phép tính thứ hai dùng lại kết quả trước khi làm tròn, là mười một phẩy năm
      bảy bốn. Nhân hệ số cao điểm mười, là số minh hoạ, ta được xấp xỉ một trăm mười
      sáu giao dịch mỗi giây.
  - show: $$③ \; 10 + 5 + 20 + 40 = \hl{75}\ \text{ms}$$
    say: Phép tính thứ ba, cộng bốn chặng nối tiếp. Cổng mười, xác thực năm, dịch
      vụ hai mươi, Oracle bốn mươi, tổng bảy mươi lăm mili giây.
  - show: $$④ \; 300 - 75 = \hlg{225}\ \text{ms còn dư (số minh hoạ)}$$
    clear: true
    say: Phép tính thứ tư, dùng lại số bảy mươi lăm. Ba trăm trừ bảy mươi lăm, còn
      dư hai trăm hai mươi lăm mili giây, và đây vẫn là số minh hoạ.
  - show: '<p>Dùng lại $116$ ở ② và $40$ ms của Oracle ở ③ (đổi ra $0{,}040$ giây).</p>

      $$⑤ \; 116 \cdot 0{,}040 = \hl{4{,}64}\ \text{lệnh cùng lúc ở Oracle (trung
      bình)}$$

      '
    focus:
    - 1
    - 2
    - 2
    say: Phép tính thứ năm dùng lại một trăm mười sáu và bốn mươi mili giây của Oracle,
      đổi ra không phẩy không bốn mươi giây. Theo bước năm, một trăm mười sáu nhân
      không phẩy không bốn mươi bằng bốn phẩy sáu bốn. Vậy ở cao điểm, trung bình
      chỉ khoảng năm lệnh đang chạy cùng lúc trên Oracle.
  - show: '<p><b>Tính lại bằng Python</b></p><div class="code"><div>ngay = 24 * 60
      * 60                 # giây trong một ngày</div><div>tb = 1_000_000 / ngay               #
      giao dịch/giây, trung bình</div><div>cao = 10 * tb                       # cao
      điểm gấp 10 (số minh hoạ)</div><div>du = 300 - (10 + 5 + 20 + 40)       # ms
      còn dư (số minh hoạ)</div><div>dong_thoi = 116 * 40 / 1000         # lệnh cùng
      lúc ở Oracle</div><div>print("giây mỗi ngày:", ngay)</div><div>print("trung
      bình:", round(tb, 1))</div><div>print("cao điểm:", round(cao))</div><div>print("còn
      dư (ms):", du)</div><div>print("cùng lúc ở Oracle:", dong_thoi)</div></div>'
    focus:
    - 1
    - 2
    - 2
    clear: true
    say: Giờ ta cho máy tính lại cả năm số bằng Python. Năm câu lệnh đầu tính số giây
      trong ngày, tải trung bình, tải cao điểm, phần còn dư và số lệnh cùng lúc. Năm
      câu lệnh sau in từng kết quả, có làm tròn tải trung bình một chữ số thập phân
      và tải cao điểm tới hàng đơn vị.
  - show: '<p>Bằng tay: ① 11,6; ② 116; ④ 225; ⑤ 4,64.</p><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>giây mỗi ngày: 86400</div><div>trung bình: 11.6</div><div>cao
      điểm: 116</div><div>còn dư (ms): 225</div><div>cùng lúc ở Oracle: 4.64</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Kết quả chạy thật in ra đúng các số ta đã tính bằng tay. Python dùng dấu
      chấm thay cho dấu phẩy thập phân, nên mười một chấm sáu chính là mười một phẩy
      sáu.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tính theo giờ và cộng ngược'
  checks:
  - alg.bnx_l15_round(Fraction(1000000, 24)) == 41667
  - alg.bnx_l15_round(Fraction(41667, 3600), 1) == Fraction('11.6') == alg.bnx_l15_round(alg.bnx_l15_tps(1000000),
    1)
  - 10 + 5 + 20 + 40 + alg.bnx_l15_left(300, [10, 5, 20, 40]) == 300
  steps:
  - show: '<p>Đường khác: chia theo <b>giờ</b> trước, rồi mới chia theo giây.</p>

      $$\frac{1\,000\,000}{24} \approx 41\,667\ \text{giao dịch/giờ}, \qquad \frac{41\,667}{3\,600}
      \approx \hlg{11{,}6}$$

      <p>Cộng ngược ngân sách: $10 + 5 + 20 + 40 + 225 = \hlg{300}$ ms.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    say: Kiểm bằng đường khác, ta chia theo giờ trước. Một triệu chia hai mươi bốn,
      xấp xỉ bốn mươi mốt nghìn sáu trăm sáu mươi bảy giao dịch mỗi giờ. Chia tiếp
      cho ba nghìn sáu trăm giây, được xấp xỉ mười một phẩy sáu, khớp phép tính thứ
      nhất. Cộng ngược ngân sách, mười cộng năm cộng hai mươi cộng bốn mươi cộng hai
      trăm hai mươi lăm bằng ba trăm, nên phép trừ đúng.
  - show: '<table class=''t''><tr><th>con số</th><th>loại</th><th>nói khi phỏng vấn</th></tr><tr><td>11,6
      và 116 giao dịch/giây</td><td>ước lượng từ đề bài; hệ số 10 là giả định</td><td>“nếu
      cao điểm gấp 10 thì khoảng 116/giây”</td></tr><tr><td>225 ms còn dư</td><td>số
      minh hoạ</td><td>“chặng chậm nhất phải đo, chưa đo thì chưa sửa”</td></tr><tr><td>p99
      của dự án mẫu</td><td>số đo thật, chỉ có khi bạn đo</td><td>“trên máy của tôi,
      dữ liệu giả, công cụ …, ngày …: p99 = …”</td></tr></table>'
    clear: true
    say: Bảng này tách ba loại con số, vì người phỏng vấn sẽ hỏi số đó từ đâu ra.
      Mười một phẩy sáu và một trăm mười sáu là ước lượng từ đề bài, và hệ số mười
      là giả định. Hai trăm hai mươi lăm mili giây là số minh hoạ. Còn phân vị chín
      mươi chín của dự án mẫu là số đo thật, chỉ có khi bạn tự đo, và phải kèm máy,
      dữ liệu, công cụ, ngày đo.
- id: pitfalls
  kind: pitfall
  title: Bài học sai hay gặp khi làm dự án mẫu
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (nặng nhất).</b> <b class="red">Khai số
      đo của dự án mẫu là số của hệ thống ngân hàng thật</b>, kiểu “hệ thống tôi làm
      chịu 116 giao dịch/giây”. Người phỏng vấn hỏi hai lớp là lộ.

      <br><span class="note">Nói đúng: “dự án cá nhân, máy của tôi, dữ liệu giả, đo
      được …”.</span></div>

      '
    say: Lỗi thứ nhất, và nặng nhất, là khai số đo của dự án mẫu như số của hệ thống
      ngân hàng thật, kiểu hệ thống tôi làm chịu một trăm mười sáu giao dịch mỗi giây.
      Người phỏng vấn hỏi thêm hai lớp là lộ. Hãy nói đúng, đây là dự án cá nhân,
      chạy trên máy của tôi với dữ liệu giả, và đo được bao nhiêu.
  - show: '<div class="box warn"><b>Lỗi 2 (mức hệ thống).</b> <b class="red">Thêm
      công nghệ chỉ vì có trong tin tuyển dụng (JD)</b>: nhét Elasticsearch, Couchbase,
      gRPC vào một API chuyển khoản không có yêu cầu nào cần chúng.

      <br><span class="note">Phép thử: bỏ thành phần đó đi thì yêu cầu nào hỏng? Không
      có → bỏ.</span></div>

      '
    say: Lỗi thứ hai ở mức hệ thống, là thêm công nghệ chỉ vì có trong tin tuyển dụng.
      Ví dụ nhét công cụ tìm kiếm, kho lưu theo khoá và lời gọi nhị phân vào một API
      chuyển khoản không có yêu cầu nào cần chúng. Phép thử là hỏi, bỏ thành phần
      đó đi thì yêu cầu nào hỏng. Nếu không có yêu cầu nào hỏng, hãy bỏ nó.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> <b class="red">Tối
      ưu trước khi đo</b>: đệm số dư vào Redis cho “nhanh” khi Oracle mới dùng $40$
      trong $300$ ms. Vừa không cần, vừa sai: số dư trong bộ đệm có thể cũ, dùng nó
      để trừ tiền là trừ sai.

      <br><span class="note">Phép thử: đo phân vị 99 của từng chặng trước, sửa chặng
      chậm nhất.</span></div>

      '
    say: Lỗi thứ ba, của người đã đi làm, là tối ưu trước khi đo. Ví dụ đệm số dư
      vào Redis cho nhanh, trong khi Oracle mới dùng bốn mươi trong ba trăm mili giây.
      Việc đó vừa không cần, vừa sai, vì số dư trong bộ đệm có thể cũ, dùng nó để
      trừ tiền là trừ sai. Phép thử là đo phân vị chín mươi chín của từng chặng trước,
      rồi sửa chặng chậm nhất.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_l15_round(alg.bnx_l15_tps(2000000), 1) == Fraction('23.1')
  - alg.bnx_l15_round(alg.bnx_l15_tps(2000000), 3) == Fraction('23.148')
  - alg.bnx_l15_round(alg.bnx_l15_tps(2000000, 8)) == 185
  - 10 + 5 + 20 + 40 + 2 == 77
  - alg.bnx_l15_left(250, [10, 5, 20, 40, 2]) == 250 - 77 == 173
  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000, 10)) == 116
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>2
      000 000 giao dịch/ngày, cao điểm gấp 8 (số minh hoạ): trung bình và cao điểm
      bao nhiêu giao dịch/giây?</td></tr><tr><td>2</td><td>Ngân sách 250 ms; cổng
      10, xác thực 5, dịch vụ 20, Oracle 40, thêm một lần đọc Redis 2 ms. Còn dư bao
      nhiêu?</td></tr><tr><td>3</td><td>Quyết định: ở 116 giao dịch/giây, dùng Outbox
      + Kafka, hay Outbox + một bảng mà dịch vụ thông báo đọc thẳng?</td></tr></table>'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, hai triệu giao dịch mỗi ngày, cao
      điểm gấp tám, là số minh hoạ, thì trung bình và cao điểm bao nhiêu giao dịch
      mỗi giây? Câu hai, ngân sách hai trăm năm mươi mili giây, gồm cổng mười, xác
      thực năm, dịch vụ hai mươi, Oracle bốn mươi, và thêm một lần đọc Redis hai mili
      giây. Còn dư bao nhiêu? Câu ba là một quyết định. Ở một trăm mười sáu giao dịch
      mỗi giây, nên dùng Outbox cộng Kafka, hay Outbox cộng một bảng mà dịch vụ thông
      báo đọc thẳng? Hãy dừng video và làm ra giấy.
  - show: '<p>Câu 1:</p>

      $$\frac{2\,000\,000}{86\,400} \approx \hl{23{,}1}, \qquad 8 \cdot 23{,}148 \approx
      \hl{185}\ \text{giao dịch/giây}$$

      '
    focus:
    - 1
    - 2
    - 2
    say: Đáp án câu một. Hai triệu chia tám mươi sáu nghìn bốn trăm, xấp xỉ hai mươi
      ba phẩy một giao dịch mỗi giây. Nhân tám, dùng số chưa làm tròn hai mươi ba
      phẩy một bốn tám, được xấp xỉ một trăm tám mươi lăm giao dịch mỗi giây.
    clear: true
  - show: '<p>Câu 2: các chặng nối tiếp nên cộng lại, $10 + 5 + 20 + 40 + 2 = 77$.</p>

      $$250 - 77 = \hlg{173}\ \text{ms}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án câu hai. Các chặng nối tiếp nên cộng lại, mười cộng năm cộng hai mươi
      cộng bốn mươi cộng hai, bằng bảy mươi bảy. Hai trăm năm mươi trừ bảy mươi bảy
      còn dư một trăm bảy mươi ba mili giây.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th><th>đổi
      khi</th></tr><tr><td>Outbox + một bảng</td><td>ít thành phần, một cơ sở dữ liệu;
      dễ chạy, dễ giải thích; 116/giây là tải nhỏ</td><td>dịch vụ thông báo quét bảng,
      thêm việc cho Oracle; mỗi người nhận mới lại phải đọc bảng</td><td>chỉ một người
      nhận, chưa đo thấy quét bảng làm chậm Oracle</td></tr><tr><td>Outbox + Kafka</td><td>nhiều
      dịch vụ cùng nghe, đọc lại được lịch sử, người nhận đi nhịp riêng</td><td>thêm
      cụm Kafka phải vận hành, thêm chỗ hỏng</td><td>từ hai người nhận trở lên, cần
      đọc lại, hoặc đo thấy bảng là điểm nghẽn</td></tr></table><p class=''note''>Cả
      hai cách đều gửi <b>ít nhất một lần</b>: bên gửi có thể sập sau khi gửi mà chưa
      kịp ghi “đã gửi”, rồi gửi lại. Người nhận phải lũy đẳng ở <b>cả hai</b> cách.</p>'
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 1
    - 1
    say: Đáp án câu ba là một đánh đổi. Outbox cộng một bảng có ít thành phần, một
      cơ sở dữ liệu, dễ chạy và dễ giải thích, vì một trăm mười sáu giao dịch mỗi
      giây là tải nhỏ. Đổi lại, quét bảng thêm việc cho Oracle, và mỗi người nhận
      mới lại phải đọc bảng. Outbox cộng Kafka cho nhiều dịch vụ cùng nghe, đọc lại
      được lịch sử, nhưng thêm một cụm phải vận hành. Ở cả hai cách, bên gửi có thể
      sập sau khi gửi mà chưa kịp ghi là đã gửi, rồi gửi lại, nên người nhận phải
      lũy đẳng ở cả hai cách. Ở tải này, Kafka không cần vì thông lượng. Nên chọn
      Kafka khi có từ hai người nhận trở lên, cần đọc lại, hoặc đo thấy bảng là điểm
      nghẽn, và khi phỏng vấn hãy nói đúng lý do đó.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  checks:
  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000), 1) == Fraction('11.6')
  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000, 10)) == 116
  - alg.bnx_l15_left(300, [10, 5, 20, 40]) == 225
  steps:
  - show: '<div class=''chain''><span class=''n''>yêu cầu của tin tuyển dụng</span><span
      class=''a''>→</span><span class=''n''>con số: 11,6 và 116 giao dịch/giây, dư
      225 ms</span><span class=''a''>→</span><span class=''n''>mỗi thành phần trả
      lời một yêu cầu</span><span class=''a''>→</span><span class=''n''>đo trên dự
      án của mình</span><span class=''a''>→</span><span class=''n''>kể đúng số đo,
      đúng nơi đo</span></div>'
    say: Tổng kết chuỗi logic. Bắt đầu từ yêu cầu của tin tuyển dụng, đổi thành con
      số, là mười một phẩy sáu và một trăm mười sáu giao dịch mỗi giây, còn dư hai
      trăm hai mươi lăm mili giây. Mỗi thành phần phải trả lời một yêu cầu. Sau đó
      đo trên dự án của chính mình, và kể đúng số đo, đúng nơi đo.
  - show: <div class='box key'><b>Tư duy chuyên gia:</b> mỗi thành phần phải trả lời
      một yêu cầu; mỗi con số phải nói rõ đo ở đâu; <b>đo trước khi tối ưu</b>.</div>
    say: Điều cần mang theo là tư duy của chuyên gia. Mỗi thành phần phải trả lời
      một yêu cầu, mỗi con số phải nói rõ đo ở đâu, và luôn đo trước khi tối ưu.
  - show: '<p class=''note''>Đây là bài cuối của khoá BNX. Chặng tiếp theo trong chương
      trình: ôn phỏng vấn, kể dự án mẫu này bằng số đo thật của bạn.</p>'
    say: Đây là bài cuối của khoá. Chặng tiếp theo trong chương trình học là ôn phỏng
      vấn, nơi bạn kể dự án mẫu này bằng số đo thật của chính mình, và chúc bạn làm
      tốt.
