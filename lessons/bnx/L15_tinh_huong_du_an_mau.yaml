  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000, 10)) == 116
  - alg.bnx_l15_left(300, [10, 5, 20, 40]) == 225
  steps:
  - show: '<p><b>Tình huống giả định, số minh hoạ.</b> Tin tuyển dụng kỹ sư phần mềm
      ghi: <i>“thiết kế API backend xử lý hàng triệu giao dịch mỗi ngày”</i>, đặc
      tả API bằng Swagger, thủ tục lưu trữ Oracle/MS SQL, Kafka (nơi dịch vụ để lại
      tin cho dịch vụ khác lấy), Redis; điểm cộng Git, Docker.</p>

      <div class="box key">Bạn có hai tuần để dựng dự án mẫu. Người phỏng vấn hỏi:
      “$1\,000\,000$ giao dịch mỗi ngày là bao nhiêu mỗi giây? Mỗi lệnh chuyển được
      bao nhiêu mili giây?”</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, đây là bài tổng hợp, một tình huống giả định với số minh hoạ. Một
      tin tuyển dụng đòi thiết kế API phía máy chủ xử lý hàng triệu giao dịch mỗi
      ngày, dùng Swagger, Oracle, Kafka và Redis. Bạn dựng dự án mẫu trong hai tuần,
      và người phỏng vấn hỏi một triệu giao dịch mỗi ngày là bao nhiêu mỗi giây, mỗi
      lệnh chuyển được bao nhiêu mili giây.
  - show: <table class='t'><tr><th>bước</th><th>việc</th><th>kết quả của bài</th></tr><tr><td>1</td><td>ước
      lượng tải</td><td>trung bình ≈ 11,6 giao dịch/giây; cao điểm ≈ 116</td></tr><tr><td>2</td><td>lập
      ngân sách độ trễ</td><td>300 ms trừ các chặng còn dư 225 ms</td></tr><tr><td>3</td><td>chọn
      thành phần theo yêu cầu</td><td>mỗi thành phần trả lời một yêu cầu, kèm đánh
      đổi</td></tr><tr><td>4</td><td>tải tăng gấp 100 và 10 000 lần</td><td>đếm số
      lệnh cùng lúc ở Oracle, so với số kết nối mở sẵn</td></tr><tr><td>5</td><td>trình
      bày khi phỏng vấn</td><td>số đo thật trên máy của bạn, nói rõ đo ở đâu</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    - - '1.4'
      - '1.5'
      - '1.6'
    clear: true
    say: Bảng này là lộ trình năm bước, một, ước lượng tải, trung bình khoảng mười
      một phẩy sáu giao dịch mỗi giây, cao điểm khoảng một trăm mười sáu. Hai, ngân
      sách độ trễ ba trăm mili giây, còn dư hai trăm hai mươi lăm. Ba, chọn thành
      phần, bốn, tải tăng gấp trăm và vạn lần, năm, trình bày bằng số đo thật.
