- id: quymo
  kind: example
  title: 'Khi tải tăng gấp 100 và 10 000 lần: Oracle chịu ra sao'
  checks:
  - '[alg.bnx_l15_inflight(t, 40) for t in (116, 11574, 1157407)] == [Fraction(464,
    100), Fraction(46296, 100), Fraction(4629628, 100)]'
  - '[alg.bnx_l15_round(alg.bnx_l15_inflight(t, 40), 2) for t in (116, 11574, 1157407)]
