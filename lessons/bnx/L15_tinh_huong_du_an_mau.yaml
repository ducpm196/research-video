    - 1250 == 1156157'
  - 100 * 116 == 11600 and 10_000 * 116 == 1_160_000
  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def
      cung_luc(tps, w=40_000):</code> … <code>return top</code></td><td>hàm tên <code>cung_luc</code>;
      <code>w=40_000</code> là giá trị có sẵn, gọi mà không truyền <code>w</code>
      thì <code>w</code> là 40 000; <code>return</code> trả <code>top</code> về nơi
      gọi</td><td><code>cung_luc(116)</code> dùng w = 40 000</td></tr><tr><td><code>j
      = top = 0</code></td><td>gán 0 cho cả hai biến cùng lúc</td><td>j là 0 và top
      là 0</td></tr><tr><td><code>while đk:</code>, <code>j += 1</code></td><td>lặp
      lại thân vòng chừng nào điều kiện còn đúng; <code>j += 1</code>: cộng 1 vào
      j</td><td><code>while vao[j] + w &lt;= t:</code> rồi <code>j += 1</code>: còn
      thoả thì tăng j thêm 1 và xét lại</td></tr><tr><td><code>for tps in (116, 11_574,
      1_157_407):</code> <code>print(tps, round(tps * 0.040, 2), cung_luc(tps))</code></td><td>chạy
      ba lần, mỗi lần tps nhận một giá trị; <code>round(x, 2)</code> làm tròn x còn
      2 chữ số sau dấu phẩy; <code>print</code> in ba giá trị cách nhau dấu cách</td><td>dòng
      in: 116 4.64 5</td></tr></table>'
    clear: true
    say: Dòng đầu khai hàm, tham số có dấu bằng là giá trị có sẵn khi không truyền,
      và lệnh trả về đưa kết quả cho nơi gọi. Gán hai tên một lần đặt cả hai bằng
      không. Vòng lặp có điều kiện lặp lại thân vòng chừng nào điều kiện còn đúng,
      và dấu cộng bằng cộng một giá trị vào biến. Vòng lặp chạy ba lần với ba mức
      tải, hàm làm tròn giữ hai chữ số sau dấu phẩy, và lệnh in cho ra ba giá trị
      cách nhau dấu cách.
  - show: '<table class=''t''><tr><th>dòng mã</th><th>nghĩa</th><th>ví dụ nhỏ: 10
      ms một lệnh, mỗi lệnh ở lại 40 ms</th></tr><tr><td><code>vao = [i * 1_000_000
      // tps for i in range(tps // 5)]</code></td><td>danh sách thời điểm lệnh đến,
      tính bằng micro giây (phần triệu giây), cách đều nhau; <code>//</code> chia
      lấy phần nguyên; dấu gạch dưới trong <code>1_000_000</code> chỉ để dễ đọc số</td><td>đến
      lúc 0, 10 000, 20 000, … micro giây</td></tr><tr><td><code>for i, t in enumerate(vao):</code></td><td>lặp
      qua từng lệnh, i là số thứ tự, t là thời điểm đến</td><td>i = 4 thì t = 40 000</td></tr><tr><td><code>while
      vao[j] + w &lt;= t: j += 1</code></td><td>bỏ qua lệnh đã xong: lệnh j xong khi
      giờ đến cộng thời gian ở lại không quá t</td><td>lúc t = 40 000: lệnh 0 xong
      vì 0 + 40 000 ≤ 40 000</td></tr><tr><td><code>top = max(top, i - j + 1)</code></td><td>số
      lệnh còn ở lại là i − j + 1; giữ số lớn nhất</td><td>lệnh 1 tới 4 còn ở lại:
      4 − 1 + 1 = 4</td></tr></table>'
    clear: true
    say: Dòng đầu tạo thời điểm đến của các lệnh, cách đều nhau, tính bằng phần triệu
      giây. Vòng lặp bỏ qua những lệnh đã xong, rồi đếm số lệnh còn ở lại và giữ số
      lớn nhất. Cứ mười mili giây một lệnh, mỗi lệnh ở bốn mươi, thì luôn có bốn lệnh
      chồng nhau.
  - show: '<p><b>Đếm số lệnh chạy chồng nhau: lệnh đến đều đặn, mỗi lệnh ở lại Oracle
      40 ms</b></p><div class="code"><div>def cung_luc(tps, w=40_000):            #
      w: micro giay</div><div>    vao = [i * 1_000_000 // tps for i in range(tps //
      5)]</div><div>    j = top = 0</div><div>    for i, t in enumerate(vao):</div><div>        while
      vao[j] + w &lt;= t:</div><div>            j += 1</div><div>        top = max(top,
