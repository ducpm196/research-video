    focus:
    - 1
    - - '3.1'
      - '3.2'
      - '3.3'
    clear: true
    say: 'Ta chạy ở ba mức tải cao điểm, gấp một, một trăm và mười nghìn lần. Cột
      giữa là tải nhân thời gian mỗi lệnh, cột cuối là số đếm thật: năm, bốn trăm
      sáu mươi ba, và bốn mươi sáu nghìn hai trăm chín mươi bảy.'
  - show: '<table class=''t''><tr><th>mức</th><th>giao dịch mỗi ngày</th><th>cao điểm
