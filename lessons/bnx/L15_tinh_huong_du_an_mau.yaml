scenes:
- id: hook
  kind: hook
  title: 'Tình huống: hai tuần, một tin tuyển dụng, một dự án mẫu'
  checks:
  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000), 1) == Fraction('11.6')
  - alg.bnx_l15_round(alg.bnx_l15_tps(1000000, 10)) == 116
  - alg.bnx_l15_left(300, [10, 5, 20, 40]) == 225
  steps:
  - show: '<p><b>Tình huống giả định, số minh hoạ.</b> Tin tuyển dụng kỹ sư phần mềm
      ghi: <i>“thiết kế API backend xử lý hàng triệu giao dịch mỗi ngày”</i>, đặc
      tả API bằng Swagger, thủ tục lưu trữ Oracle/MS SQL, Kafka, Redis; điểm cộng
      Git, Docker.</p>

      <div class="box key">Bạn có hai tuần để dựng dự án mẫu. Người phỏng vấn hỏi:
      “$1\,000\,000$ giao dịch mỗi ngày là bao nhiêu mỗi giây? Mỗi lệnh chuyển được
      bao nhiêu mili giây?”</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, đây là bài cuối của khoá, một tình huống giả định với số minh hoạ.
      Một tin tuyển dụng kỹ sư phần mềm ghi rằng ứng viên sẽ thiết kế API phía máy
      chủ xử lý hàng triệu giao dịch mỗi ngày. Tin đó còn đòi đặc tả API bằng Swagger,
      thủ tục lưu trữ trên Oracle, Kafka và Redis, cộng điểm cho Docker. Bạn có hai
      tuần để dựng một dự án mẫu. Người phỏng vấn hỏi, một triệu giao dịch mỗi ngày
      là bao nhiêu mỗi giây, và mỗi lệnh chuyển được bao nhiêu mili giây?
  - show: <table class='t'><tr><th>bước</th><th>việc</th><th>kết quả của bài</th></tr><tr><td>1</td><td>ước
      lượng tải</td><td>trung bình ≈ 11,6 giao dịch/giây; cao điểm ≈ 116</td></tr><tr><td>2</td><td>lập
      ngân sách độ trễ</td><td>300 ms trừ các chặng còn dư 225 ms</td></tr><tr><td>3</td><td>chọn
      thành phần theo yêu cầu</td><td>mỗi thành phần trả lời một yêu cầu, kèm đánh
      đổi</td></tr><tr><td>4</td><td>trình bày khi phỏng vấn</td><td>số đo thật trên
      máy của bạn, nói rõ đo ở đâu</td></tr></table>
    say: Bảng này là lộ trình bốn bước của bài. Một, ước lượng tải, ra trung bình
      khoảng mười một phẩy sáu giao dịch mỗi giây và cao điểm khoảng một trăm mười
      sáu. Hai, lập ngân sách độ trễ, ba trăm mili giây trừ các chặng còn dư hai trăm
      hai mươi lăm. Ba, chọn thành phần sao cho mỗi thành phần trả lời một yêu cầu,
      kèm đánh đổi. Bốn, trình bày khi phỏng vấn bằng số đo thật trên máy của bạn,
      và nói rõ đo ở đâu.
- id: prereq
  kind: prereq
  title: 'Nhắc lại từ đầu: các mảnh ghép sẽ dùng'
  checks:
  - alg.bnk_unique_key_rows(3) == 1
  - alg.bnk_ledger_unbalanced([(1, 'A', -200000), (1, 'B', 200000)]) == []
  - 300000 + 1000000 == (300000 - 200000) + (1000000 + 200000) == 1300000
  - 24 * 60 * 60 == 86400 == 1 / alg.bnx_l15_tps(1)
  steps:
  - show: '<table class=''t''><tr><th>mảnh ghép</th><th>nghĩa</th><th>ví dụ số</th></tr><tr><td>khoá
      lũy đẳng + <code>UNIQUE</code></td><td>mỗi lệnh mang một khoá; cơ sở dữ liệu
      chỉ cho một dòng mang khoá đó</td><td>3 lần gửi cùng khoá → 1 dòng</td></tr><tr><td>sổ
      cái bút toán kép</td><td>mỗi giao dịch có dòng nợ và dòng có, tổng bằng 0</td><td>$-200\,000
      + 200\,000 = 0$</td></tr><tr><td>thủ tục lưu trữ, khoá theo thứ tự</td><td>khoá
      hai tài khoản theo một thứ tự cố định để tránh bế tắc, lỗi thì hoàn tác</td><td>A
      300 000, B 1 000 000; chuyển 200 000: tổng vẫn 1 300 000</td></tr></table>'
    say: Trước hết, ta nhắc lại từ đầu các mảnh ghép sẽ dùng. Khoá lũy đẳng là mã
      gắn với mỗi lệnh, và ràng buộc duy nhất làm cơ sở dữ liệu chỉ cho một dòng mang
      khoá đó. Ba lần gửi cùng khoá chỉ còn một dòng. Sổ cái bút toán kép ghi mỗi
      giao dịch thành dòng nợ và dòng có, nên tổng bằng không, ví dụ âm hai trăm nghìn
      cộng hai trăm nghìn. Ở bài 6, thủ tục lưu trữ khoá hai tài khoản theo một thứ
      tự cố định để tránh bế tắc, và lỗi thì hoàn tác. Chuyển hai trăm nghìn từ A
      sang B, tổng hai tài khoản vẫn là một triệu ba trăm nghìn.
  - show: '<table class=''t''><tr><th>mảnh ghép</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>Outbox
      → Kafka</td><td>ghi sự kiện vào bảng outbox trong cùng giao dịch ghi tiền; một
      tiến trình khác gửi sang Kafka</td><td>Kafka hỏng 5 phút: sự kiện chờ trong
      bảng, không mất</td></tr><tr><td>Redis đệm đọc</td><td>đọc nhanh nhưng có thể
      cũ; không dùng để quyết định trừ tiền</td><td>sao kê đọc từ đệm, trừ tiền đọc
      từ Oracle</td></tr><tr><td>JWT, mTLS</td><td>JWT nói người gọi là ai, được làm
      gì; mTLS nói máy nào đang gọi</td><td>bài 3, bài 5</td></tr><tr><td>Docker +
      GitLab CI, cổng API</td><td>đóng gói, kiểm rồi mới triển khai; cổng giới hạn
      tốc độ</td><td>test hỏng thì không deploy; 5/giây, sức chứa 10</td></tr></table>'
    clear: true
    say: Bảng thứ hai là các mảnh đi ra ngoài cơ sở dữ liệu. Với Outbox, sự kiện được
      ghi vào một bảng trong cùng giao dịch ghi tiền, rồi một tiến trình khác gửi
      sang Kafka. Kafka hỏng năm phút thì sự kiện chờ trong bảng, không mất. Redis
      đệm đọc cho tốc độ nhưng có thể cũ, nên sao kê đọc từ bộ đệm, còn trừ tiền phải
      đọc từ Oracle. Ở bài 3 và bài 5, mã truy cập tự mang thông tin cho biết người
      gọi là ai, còn mTLS cho biết máy nào đang gọi. Ở bài 13, đường ống kiểm hỏng
      thì không triển khai. Ở bài 14, cổng API giới hạn năm yêu cầu mỗi giây, sức
      chứa mười.
  - show: '<p>Một phép tính khởi động: một ngày có bao nhiêu giây?</p>

      $$24 \cdot 60 \cdot 60 = 86\,400$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Một phép tính khởi động. Một ngày có hai mươi bốn giờ, mỗi giờ sáu mươi phút,
      mỗi phút sáu mươi giây, nên một ngày có tám mươi sáu nghìn bốn trăm giây.
    introduces:
    - cdot
