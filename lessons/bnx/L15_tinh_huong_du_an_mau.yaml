      là số minh hoạ</td><td>gấp $10$</td></tr><tr><td>ngân sách độ trễ</td><td>tổng
      thời gian cho phép của một lệnh, chia cho từng chặng nối tiếp</td><td>$300$
      ms (số minh hoạ)</td></tr><tr><td>phân vị 99 (p99)</td><td>99% yêu cầu nhanh
      hơn số này; trung bình che mất yêu cầu chậm</td><td>p99 = 120 ms: trong mọi
      lệnh đã đo, khoảng 1% chậm hơn 120 ms</td></tr><tr><td>số minh hoạ / số đo thật</td><td>số
      đặt ra để dạy / số bạn đo được, có máy, công cụ, ngày đo</td><td>“trên máy của
      tôi …”</td></tr></table>'
    say: Bảng này giải mã ngôn ngữ của nghề. Tải trung bình là số giao dịch chia đều
      cho mọi giây trong ngày, ví dụ tám mươi sáu nghìn bốn trăm giao dịch mỗi ngày
      là một giao dịch mỗi giây. Hệ số cao điểm cho biết giờ đông nhất gấp mấy lần
      trung bình. Số thật lấy từ nhật ký, còn ở đây là số minh hoạ. Ngân sách độ trễ
      là tổng thời gian cho phép của một lệnh, chia cho từng chặng nối tiếp. Phân
      vị chín mươi chín là mức mà chín mươi chín phần trăm yêu cầu nhanh hơn, vì trung
      bình che mất các yêu cầu chậm. Ví dụ phân vị chín mươi chín là một trăm hai
      mươi mili giây, nghĩa là trong mọi lệnh đã đo, khoảng một phần trăm chậm hơn
      mức đó. Cuối cùng, số minh hoạ là số đặt ra để dạy, còn số đo thật phải kèm
      máy, công cụ và ngày đo.
