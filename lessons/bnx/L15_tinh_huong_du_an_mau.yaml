      mỗi lệnh, và ràng buộc duy nhất chỉ cho một dòng mang khoá đó. Sổ cái bút toán
      kép ghi mỗi giao dịch thành dòng nợ và dòng có với tổng bằng không. Thủ tục
      lưu trữ khoá hai tài khoản theo thứ tự cố định để tránh bế tắc, và lỗi thì hoàn
      tác.
  - show: '<table class=''t''><tr><th>mảnh ghép</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>Outbox
      → Kafka</td><td>ghi sự kiện vào bảng outbox trong cùng giao dịch ghi tiền; một
