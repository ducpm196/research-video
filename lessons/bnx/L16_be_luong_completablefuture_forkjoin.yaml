- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ một luồng tới ba công cụ'
  checks:
  - alg.bnx_pool_rounds(10, 4) == 3 and alg.bnx_pool_makespan([100] * 10, 4) == 300
  - alg.bnx_pool_throughput(4, 100) == 40
  - alg.bnx_queue_backlog(50, 4, 100, 60) == 600
  - alg.bnx_pool_makespan([200, 300, 400], 3) == max(200, 300, 400) == 400
  - alg.bnx_pool_makespan([400, 200, 300], 2) == 500
  - alg.bnx_work_total([200, 300, 400]) == 900
  - 500 + 300 == 800 and alg.bnx_pool_schedule([400, 200, 300], 3)[2][1] == 300
  - 1000000 / 2 ** 6 == 15625 and 1000000 / 2 ** 7 == 7812.5
  - alg.bnx_fj_depth(1000000, 10000) == 7
  - alg.bnx_fj_leaves(1, 1000000, 10000) == 2 ** 7 == 128
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi việc tạo một luồng mới thì tốn, và nghìn việc sẽ
      sinh nghìn luồng. Vì vậy ta giữ sẵn một <b>bể n luồng</b>

      và dùng lại chúng; việc chưa có luồng thì xếp hàng.</p>

      <p>Làm thử: 10 việc, mỗi việc 100 ms, bể 4 luồng.</p>

      $$10 : 4 = 2{,}5 \text{, làm tròn lên: } 3 \text{ lượt} \;\Rightarrow\; 3 \cdot
      100 = \hl{300} \text{ ms}$$

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, mỗi việc tạo một luồng mới thì tốn, và nghìn việc sẽ sinh nghìn
      luồng. Vì vậy ta giữ sẵn một bể có số luồng cố định và dùng lại chúng. Làm thử,
      mười việc chia cho bốn luồng, làm tròn lên, được ba lượt, nên xong sau ba trăm
      mili giây.
    introduces:
    - implies
  - show: '<p><b>Bước 2.</b> Hàng đợi <b>không giới hạn</b> thì việc tới nhanh hơn
      sức xử lý sẽ dồn lại mãi, vì không gì chặn nó.</p>

      <p>Làm thử (số minh hoạ): bể 4 luồng, mỗi việc 100 ms, mỗi giây tới 50 việc.</p>

      $$4 \cdot \frac{1000}{100} = 40 \text{ việc/giây}; \qquad (50 - 40) \cdot 60
      = \hl{600} \text{ việc nằm chờ sau 1 phút}$$

      <span class=''note''>Cách chữa: hàng đợi có giới hạn. Đầy thì từ chối sớm, bên
      gọi biết ngay để thử lại sau.</span>

      '
    focus:
    - 1
    - 2
    - 3
    - 4
    say: Bước hai, nếu hàng đợi không giới hạn thì khi việc tới nhanh hơn sức xử lý,
      hàng sẽ dài mãi, vì không gì chặn nó lại. Làm thử bằng số minh hoạ, bể bốn luồng
      xử lý được bốn mươi việc mỗi giây, mà mỗi giây tới năm mươi việc. Mỗi giây dư
      mười việc, nên sau một phút có sáu trăm việc nằm chờ, và mỗi việc chờ đều giữ
      bộ nhớ. Cách chữa là hàng đợi có giới hạn, đầy thì từ chối sớm để bên gọi biết
      ngay.
  - show: '<p><b>Bước 3.</b> Việc chờ vào ra không dùng nhân xử lý lúc chờ, nên nhiều
      việc chờ <b>cùng lúc</b> được. Khi đủ luồng,

      thời gian chờ cả nhóm là lời gọi <b>dài nhất</b>, không phải tổng. Ký hiệu max
      nghĩa là lấy số lớn nhất.</p>

      $$\max(200, 300, 400) = \hl{400} \text{ ms} \quad \text{thay cho} \quad 200
      + 300 + 400 = 900 \text{ ms}$$

      <span class=''note''>Làm thử: chỉ có 2 luồng, gửi theo thứ tự 400, 200, 300
      thì luồng hai làm 200 rồi 300: chờ 500 ms.</span>

      '
    focus:
    - 1
    - 2
    - 3
    introduces:
    - max_fn
    clear: true
    say: Bước ba, việc chờ vào ra không dùng nhân xử lý lúc chờ, nên nhiều việc chờ
      cùng lúc được. Vì vậy khi đủ luồng, thời gian chờ cả nhóm là lời gọi dài nhất,
      là bốn trăm mili giây. Làm thử với chỉ hai luồng, luồng thứ hai phải làm lời
      gọi hai trăm rồi tới lời gọi ba trăm, nên ta chờ năm trăm mili giây.
  - show: '<p><b>Bước 4.</b> Phiếu hẹn thường chỉ cho ta ngồi chờ. <b>Lời hứa kết
      quả</b> thì ghép được: “khi số dư <b>và</b> hạn mức cùng có,

      hãy cộng lại”, không luồng nào phải đứng chờ để cộng.</p>

      $$\text{khả dụng} = \text{số dư} + \text{hạn mức} = 500 + 300 = \hl{800} \quad
      \text{(số minh hoạ)}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: 'Bước bốn, phiếu hẹn thường chỉ cho ta ngồi chờ. Lời hứa kết quả thì ghép
      được, vì ta dặn trước: khi số dư và hạn mức cùng có thì hãy cộng lại. Làm thử
      bằng số minh hoạ, số dư năm trăm cộng hạn mức ba trăm, được số tiền khả dụng
      là tám trăm.'
  - show: '<p><b>Bước 5.</b> Việc nặng tính toán thì thêm luồng quá số nhân không
      nhanh hơn. Ta <b>chia đôi</b> việc tới khi mỗi mảnh ≤ ngưỡng,

      để mọi nhân đều có việc; luồng hết việc lấy việc của luồng bận.</p>

      <p>Làm thử: 1 000 000 số, ngưỡng 10 000.</p>

      $$\frac{1\,000\,000}{2^6} = 15\,625 > 10\,000; \qquad \frac{1\,000\,000}{2^7}
      = 7\,812{,}5 \le 10\,000 \;\Rightarrow\; 2^7 = \hl{128} \text{ việc lá}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước năm, với việc nặng tính toán, thêm luồng quá số nhân xử lý thì không
      nhanh hơn. Vì vậy ta chia đôi việc tới khi mỗi mảnh không quá ngưỡng, để mọi
      nhân đều có việc. Làm thử, một triệu số với ngưỡng mười nghìn. Chia đôi sáu
      lần còn mười lăm nghìn sáu trăm hai mươi lăm số, vẫn lớn hơn ngưỡng. Chia đôi
      bảy lần thì còn khoảng bảy nghìn tám trăm số, đủ nhỏ, nên có hai mũ bảy, tức
      một trăm hai mươi tám việc lá.
  - show: <table class='t'><tr><th>loại việc</th><th>công cụ</th><th>vì sao</th></tr><tr><td>chờ
      vào ra (gọi dịch vụ, cơ sở dữ liệu)</td><td>bể luồng <b>riêng</b>, hàng đợi
      có giới hạn, ghép bằng CompletableFuture</td><td>lúc chờ không tốn nhân xử lý,
      nên số luồng được nhiều hơn số nhân</td></tr><tr><td>nặng tính toán, chia nhỏ
      được</td><td>ForkJoinPool, số luồng khoảng số nhân</td><td>nhiều luồng hơn số
      nhân chỉ thêm tranh nhau</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
    say: Bước sáu, chọn công cụ theo loại việc. Việc chờ vào ra dùng bể luồng riêng
      có hàng đợi giới hạn, vì lúc chờ không tốn nhân xử lý nên số luồng được nhiều
      hơn số nhân. Việc nặng tính toán dùng bể chia để trị với số luồng khoảng số
      nhân, vì nhiều luồng hơn chỉ thêm tranh nhau.
