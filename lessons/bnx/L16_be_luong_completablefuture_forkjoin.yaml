      <li>in số lượt của 14 việc trên 3 luồng</li><li>hàm đệ quy <code>la(n)</code>
      (hàm tự gọi lại chính nó): số việc lá của <b>100000</b> phần tử, ngưỡng <b>5000</b></li></ol>

      <p class="note">Chi tiết từng dòng in nằm trong <code>de.md</code>. Số liệu
      khác ví dụ trong bài.</p>

      '
