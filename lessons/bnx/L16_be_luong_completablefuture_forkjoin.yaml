scenes:
- id: hook
  kind: hook
  title: 'Ba lời gọi 200, 300, 400 ms: chờ 900 hay 400?'
  checks:
  - alg.bnx_work_total([200, 300, 400]) == 900
  - alg.bnx_pool_makespan([200, 300, 400], 3) == 400
  - alg.bnx_pool_makespan([200, 300, 400], 1) - alg.bnx_pool_makespan([200, 300, 400],
    3) == 500
  steps:
  - show: '<p>Khách mở màn hình tổng quan của ứng dụng ngân hàng. Dịch vụ phải hỏi
      <b>ba nơi</b> (số minh hoạ):

      số dư mất <b>200 ms</b>, hạn mức mất <b>300 ms</b>, điểm tín dụng mất <b>400
      ms</b>.</p>

      <div class="box key">Hỏi lần lượt: $200 + 300 + 400 = 900$ ms. Hỏi cùng lúc
      rồi chờ cả ba: khoảng <b>400 ms</b>.

      Vậy 500 ms kia biến đi đâu, và khi nghìn khách cùng mở thì chuyện gì xảy ra?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, khách mở màn hình tổng quan của ứng dụng ngân hàng, và dịch vụ
      phải hỏi ba nơi, với số minh hoạ như sau. Số dư mất hai trăm mili giây, hạn
      mức mất ba trăm, điểm tín dụng mất bốn trăm mili giây. Hỏi lần lượt thì khách
      chờ chín trăm mili giây, còn hỏi cùng lúc rồi chờ cả ba thì chỉ khoảng bốn trăm.
      Vậy năm trăm mili giây kia biến đi đâu, và khi nghìn khách cùng mở thì chuyện
      gì xảy ra?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>ai
      làm các việc chạy cùng lúc</td><td>một <b>bể luồng</b> có số luồng cố định;
      việc dư xếp vào hàng đợi</td></tr><tr><td>ghép kết quả của nhiều lời gọi thế
      nào</td><td><b>CompletableFuture</b>: lời hứa kết quả, ghép được với nhau; thời
      gian chờ là lời gọi dài nhất</td></tr><tr><td>việc nặng tính toán thì sao</td><td><b>ForkJoinPool</b>:
      chia đôi tới khi đủ nhỏ, luồng rảnh lấy việc của luồng bận</td></tr></table>'
    say: Hôm nay ta trả lời ba câu, ai làm các việc chạy cùng lúc, và vì sao hàng
      đợi của bể luồng phải có giới hạn. Ghép kết quả của nhiều lời gọi song song
      thế nào, và thời gian chờ tính ra sao. Cuối cùng, việc nặng tính toán thì chia
      nhỏ thế nào để mọi nhân xử lý cùng làm.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_pool_makespan([100, 100], 2) == 100
  - alg.bnx_pool_makespan([100] * 3, 1) == 300
  - alg.bnx_pool_makespan([100] * 3, 3) == 100
  - alg.bnx_work_total([100] * 3) == 300
  - alg.bnx_pool_schedule([100] * 5, 4)[4][0] == 100
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      luồng (thread)</td><td>một dòng chạy lệnh trong chương trình; nhiều luồng chạy
      được cùng lúc</td><td>2 luồng, mỗi luồng chờ 100 ms: xong sau khoảng 100 ms,
      không phải 200</td></tr><tr><td>② việc chờ vào ra</td><td>phần lớn thời gian
      là <b>chờ</b> mạng, đĩa, cơ sở dữ liệu; lúc chờ không dùng nhân xử lý</td><td>gọi
      dịch vụ số dư, chờ 200 ms</td></tr><tr><td>③ việc nặng tính toán</td><td>nhân
      xử lý phải <b>làm</b> suốt; một nhân chỉ làm một việc tại một lúc</td><td>cộng
      các số từ 1 tới 1 000 000</td></tr><tr><td>④ hàng đợi</td><td>nơi việc nằm chờ
      khi chưa có luồng nào rảnh; vào trước ra trước</td><td>4 luồng đang bận, việc
      thứ 5 xếp hàng</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều, thứ nhất, luồng là một dòng chạy lệnh trong
      chương trình, và nhiều luồng chạy được cùng lúc. Thứ hai, việc chờ vào ra là
      việc mà phần lớn thời gian chỉ chờ mạng, đĩa hay cơ sở dữ liệu, lúc chờ không
      dùng nhân xử lý. Thứ ba, việc nặng tính toán bắt nhân xử lý làm suốt, mà một
      nhân chỉ làm một việc tại một lúc. Thứ tư, hàng đợi là nơi việc nằm chờ khi
      chưa có luồng nào rảnh, vào trước thì ra trước.
  - show: '<p>Làm thử: 3 việc, mỗi việc chờ 100 ms.</p>

      $$\text{1 luồng: } 3 \cdot 100 = 300 \text{ ms}; \qquad \text{3 luồng: } \hl{100}
      \text{ ms}; \qquad \text{tổng công việc vẫn là } 300$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Làm thử ngay với ba việc, mỗi việc chờ một trăm mili giây. Một luồng làm
      lần lượt nên mất ba trăm mili giây. Ba luồng làm cùng lúc nên chỉ mất một trăm,
      nhưng tổng công việc vẫn là ba trăm, vì không việc nào ngắn đi.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_pool_rounds(10, 4) == 3
  steps:
  - show: '<table class=''t''><tr><th>tên trong Java</th><th>nghĩa</th></tr><tr><td>ExecutorService</td><td><b>bể
      luồng</b>: nhận việc, giao cho các luồng có sẵn; <code>submit</code> gửi một
      việc</td></tr><tr><td>Future</td><td><b>phiếu hẹn</b>: giữ chỗ cho kết quả chưa
      có; <code>get</code> chờ tới khi có</td></tr><tr><td>CompletableFuture</td><td><b>lời
      hứa kết quả</b> ghép được: <code>supplyAsync</code> chạy một việc, <code>thenCombine</code>
      ghép hai kết quả, <code>allOf</code> chờ mọi lời hứa, <code>join</code> lấy
      kết quả</td></tr><tr><td>ForkJoinPool</td><td><b>bể chia để trị</b>: <code>fork</code>
      đẩy việc con vào hàng việc, <code>join</code> chờ kết quả của nó</td></tr><tr><td>RecursiveTask</td><td>một
      việc tự chia mình thành việc con và trả về kết quả</td></tr><tr><td>work-stealing</td><td><b>lấy
      việc của nhau</b>: luồng hết việc lấy việc đang chờ của luồng còn bận</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: 'Bảng này giải mã các tên sẽ hiện trên màn hình. Tên thứ nhất là bể luồng,
      nó nhận việc rồi giao cho các luồng có sẵn. Tên thứ hai là phiếu hẹn, giữ chỗ
      cho một kết quả chưa có, và ta chờ phiếu để lấy kết quả. Tên thứ ba là lời hứa
      kết quả, khác phiếu hẹn ở chỗ ghép được với nhau: ghép hai kết quả, hoặc chờ
      mọi lời hứa cùng xong. Tên thứ tư là bể chia để trị, có lệnh đẩy việc con vào
      hàng việc và lệnh chờ kết quả của việc con. Tên thứ năm là một việc tự chia
      mình thành việc con rồi trả về kết quả. Cuối cùng, lấy việc của nhau nghĩa là
      luồng hết việc thì lấy việc đang chờ của luồng còn bận.'
  - show: '<table class=''t''><tr><th>tên dùng thêm trong mã</th><th>nghĩa</th></tr><tr><td>ThreadPoolExecutor</td><td>bể
      luồng tự dựng, chỉnh được số luồng và hàng đợi (đối số giải ở ví dụ thứ hai)</td></tr><tr><td>ArrayBlockingQueue</td><td>hàng
      đợi có sức chứa cố định: đầy thì không nhận thêm</td></tr><tr><td>RejectedExecutionException</td><td>lỗi
      bể ném ra khi từ chối một việc</td></tr><tr><td>CountDownLatch</td><td>chốt
      đếm ngược: luồng gọi lệnh chờ sẽ đứng tới khi bộ đếm về 0; bài dùng để giữ việc
      lại</td></tr><tr><td>nhân xử lý</td><td>một đơn vị của bộ xử lý, mỗi lúc chạy
      một luồng</td></tr></table>'
    clear: true
    say: Bảng này giải thêm vài tên sẽ gặp trong mã. Bể luồng tự dựng cho chỉnh được
      số luồng và hàng đợi, đối số sẽ giải ở ví dụ thứ hai. Hàng đợi có sức chứa cố
      định thì đầy là không nhận thêm, và lúc ấy bể ném lỗi từ chối. Chốt đếm ngược
      làm các luồng đứng chờ tới khi bộ đếm về không, bài dùng nó để giữ việc lại.
      Nhân xử lý là một đơn vị của bộ xử lý, mỗi lúc chạy một luồng. Trong các chương
      trình sau, khối bắt lỗi ngắt luồng được để trống cho gọn, còn mã thật không
      nên nuốt lỗi này.
