    focus:
    - - 1
    - 2
    say: Đáp án câu hai, gọi lần lượt thì cộng cả bốn, được một nghìn mili giây. Gọi
      song song trên bốn luồng thì chỉ chờ lời gọi dài nhất, là năm trăm mili giây.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hàng
      đợi không giới hạn</td><td>không khách nào bị từ chối ngay</td><td>dư 50 − 40
