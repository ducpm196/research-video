      bộ nhớ đầy dần</td></tr><tr><td>20 chỗ, đầy thì từ chối</td><td>việc được nhận
      chờ nhiều nhất 20 : 40 = 0,5 giây; bộ nhớ có trần</td><td>khoảng 10 việc/giây
      bị từ chối, bên gọi phải thử lại</td></tr><tr><td>20 chỗ, luồng gửi tự chạy</td><td>không
      mất việc, bên gửi tự chậm lại</td><td>luồng nhận yêu cầu bị giữ 100 ms mỗi lần,
      độ trễ lan ngược ra phía trước</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    say: Đáp án câu ba, hàng đợi không giới hạn không từ chối ai, nhưng mỗi giây dư
      mười việc, sau một phút có sáu trăm việc chờ và việc cuối phải chờ mười lăm
      giây. Hàng đợi hai mươi chỗ và từ chối thì việc được nhận chờ nhiều nhất nửa
      giây, đổi lại khoảng mười việc mỗi giây bị từ chối và phải thử lại. Để luồng
      gửi tự chạy thì không mất việc, nhưng luồng nhận yêu cầu bị giữ lại, nên độ
      trễ lan ngược ra phía trước. Nếu khách không chờ nổi mười lăm giây thì giới
      hạn và từ chối sớm tốt hơn, miễn là bên gọi thử lại được an toàn, tức lệnh ghi
      có khoá lũy đẳng.
