scenes:
- id: hook
  kind: hook
  title: 'Ba lời gọi 200, 300, 400 ms: chờ 900 hay 400?'
  checks:
  - alg.bnx_work_total([200, 300, 400]) == 900
  - alg.bnx_pool_makespan([200, 300, 400], 3) == 400
  - alg.bnx_pool_makespan([200, 300, 400], 1) - alg.bnx_pool_makespan([200, 300, 400],
    3) == 500
  steps:
  - show: '<p>Khách mở màn hình tổng quan của ứng dụng ngân hàng. Dịch vụ phải hỏi
      <b>ba nơi</b> (số minh hoạ):

      số dư mất <b>200 ms</b>, hạn mức mất <b>300 ms</b>, điểm tín dụng mất <b>400
      ms</b> (ms là mili giây, một phần nghìn giây).</p>

      <div class="box key">Hỏi lần lượt: $200 + 300 + 400 = 900$ ms. Hỏi cùng lúc
      rồi chờ cả ba: khoảng <b>400 ms</b>.

      Vậy 500 ms kia biến đi đâu, và khi mười nghìn khách cùng mở thì chuyện gì xảy
      ra?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, khách mở màn hình tổng quan, và dịch vụ phải hỏi ba nơi, số liệu
      minh hoạ. Số dư mất hai trăm mili giây, hạn mức ba trăm, điểm tín dụng bốn trăm.
      Hỏi lần lượt thì khách chờ chín trăm, hỏi cùng lúc thì chỉ khoảng bốn trăm.
      Năm trăm kia biến đi đâu, và khi mười nghìn khách cùng mở thì chuyện gì xảy
      ra?
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_pool_makespan([100, 100], 2) == 100
  - alg.bnx_pool_makespan([100] * 3, 1) == 300
  - alg.bnx_pool_makespan([100] * 3, 3) == 100
  - alg.bnx_work_total([100] * 3) == 300
  - alg.bnx_pool_schedule([100] * 5, 4)[4][0] == 100
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      luồng (thread)</td><td>một dòng chạy lệnh trong chương trình; nhiều luồng chạy
      được cùng lúc</td><td>2 luồng, mỗi luồng chờ 100 ms: xong sau khoảng 100 ms,
      không phải 200</td></tr><tr><td>② việc chờ vào ra</td><td>phần lớn thời gian
      là <b>chờ</b> mạng, đĩa, cơ sở dữ liệu; lúc chờ không dùng nhân xử lý</td><td>gọi
      dịch vụ số dư, chờ 200 ms</td></tr><tr><td>③ việc nặng tính toán</td><td>nhân
      xử lý (một đơn vị của bộ xử lý, mỗi lúc chạy một luồng) phải <b>làm</b> suốt</td><td>cộng
      các số từ 1 tới 1 000 000</td></tr><tr><td>④ hàng đợi</td><td>nơi việc nằm chờ
      khi chưa có luồng rảnh; vào trước ra trước</td><td>4 luồng đang bận, việc thứ
      5 xếp hàng</td></tr></table>'
    say: Trước hết ta cần hiểu bốn điều, luồng là một dòng chạy lệnh, và nhiều luồng
      chạy được cùng lúc. Việc chờ vào ra phần lớn chỉ chờ mạng, đĩa hay cơ sở dữ
      liệu, không dùng nhân xử lý. Việc nặng tính toán bắt nhân xử lý làm suốt. Hàng
      đợi là nơi việc chờ khi chưa có luồng rảnh, vào trước thì ra trước.
  - show: '<p>Làm thử: 3 việc, mỗi việc chờ 100 ms.</p>

      $$\text{1 luồng: } 3 \cdot 100 = 300 \text{ ms}; \qquad \text{3 luồng: } \hl{100}
      \text{ ms}; \qquad \text{tổng công việc vẫn là } 300$$

      '
    focus:
    - 1
    - 2
    say: Làm thử với ba việc, mỗi việc chờ một trăm mili giây. Một luồng mất ba trăm,
      ba luồng chỉ mất một trăm, nhưng tổng công việc vẫn là ba trăm.
    introduces:
    - cdot
- id: sym
  kind: symbol
  title: Giải mã các tên trên màn hình
  checks:
  - alg.bnx_pool_rounds(10, 4) == 3
  steps:
  - show: '<table class=''t''><tr><th>tên trong Java</th><th>nghĩa</th></tr><tr><td>ExecutorService</td><td><b>bể
      luồng</b>: nhận việc, giao cho các luồng có sẵn; <code>submit</code> gửi một
      việc</td></tr><tr><td>Future</td><td><b>phiếu hẹn</b>: giữ chỗ cho kết quả chưa
      có; <code>get</code> chờ tới khi có</td></tr><tr><td>CompletableFuture</td><td><b>lời
      hứa kết quả</b> ghép được: <code>supplyAsync</code> chạy một việc, <code>thenCombine</code>
      ghép hai kết quả, <code>allOf</code> chờ mọi lời hứa, <code>join</code> lấy
      kết quả</td></tr><tr><td>ForkJoinPool, RecursiveTask</td><td><b>bể chia để trị</b>:
      một việc tự chia mình thành việc con, <code>fork</code> đẩy việc con vào hàng,
      <code>join</code> chờ kết quả của nó</td></tr></table>'
    introduces:
    - bnx_forkjoin
    clear: true
    say: Bảng này giải mã các tên sẽ hiện trên màn hình. Bể luồng giao việc cho các
      luồng có sẵn, phiếu hẹn giữ chỗ cho kết quả chưa có, còn lời hứa kết quả ghép
      được nhiều kết quả. Bể chia để trị có việc tự chia mình thành việc con.
  - show: '<table class=''t''><tr><th>tên trong Java</th><th>nghĩa</th></tr><tr><td>lấy
      việc của nhau (work-stealing)</td><td>luồng hết việc lấy việc đang chờ của luồng
      còn bận</td></tr><tr><td>ThreadPoolExecutor</td><td>bể luồng tự dựng, chỉnh
      được số luồng và hàng đợi; <code>ArrayBlockingQueue</code> là hàng có sức chứa
      cố định, đầy thì từ chối</td></tr><tr><td>CountDownLatch</td><td>chốt đếm ngược:
      lệnh chờ đứng tới khi bộ đếm về 0; bài dùng để giữ việc lại</td></tr><tr><td><code>()
      -&gt; { … }</code></td><td>viết gọn một việc nhỏ không tên; khối bắt lỗi ngắt
      luồng để trống cho gọn, mã thật không nên nuốt lỗi này</td></tr></table>'
    clear: true
    say: Luồng hết việc thì lấy việc của luồng còn bận. Bể tự dựng chỉnh được số luồng
      và hàng đợi, hàng đầy thì từ chối. Chốt đếm ngược giữ việc lại, còn mũi tên
      viết gọn một việc nhỏ.
  - show: <table class='t'><tr><th>tên trong Java</th><th>nghĩa</th></tr><tr><td>AtomicInteger,
      ConcurrentLinkedQueue, CopyOnWriteArrayList, <code>ConcurrentHashMap.newKeySet()</code></td><td>số
      đếm, hàng, danh sách và tập hợp mà nhiều luồng cùng đụng vào cũng không hỏng
      dữ liệu; HashSet hay ArrayList thường thì có thể hỏng</td></tr><tr><td><code>execute</code>
      / <code>submit</code></td><td>gửi một việc không cần kết quả / gửi một việc
      và nhận lại phiếu hẹn</td></tr><tr><td><code>Runnable</code></td><td>một việc
      không trả kết quả, viết dưới dạng <code>() -&gt; { … }</code></td></tr></table>
    introduces:
    - bnx_atomic_coll
    clear: true
    say: Các lớp ở dòng đầu chứa số đếm, hàng, danh sách hay tập hợp mà nhiều luồng
      cùng đụng vào vẫn an toàn. Lệnh thực thi gửi việc không cần kết quả, còn lệnh
      gửi trả lại phiếu hẹn.
  - show: '<table class=''t''><tr><th>tên trong Java</th><th>nghĩa</th></tr><tr><td><code>import
      static</code></td><td>nhập sẵn tên hàm để khỏi viết lại tên lớp mỗi lần gọi</td></tr><tr><td><code>List&lt;Integer&gt;</code>,
      <code>var</code></td><td>ngoặc nhọn nói kiểu phần tử trong danh sách (số nguyên);
      <code>var</code> để máy tự suy ra kiểu</td></tr><tr><td><code>throws Exception</code></td><td>đặt
      sau tên hàm: hàm này có thể gặp lỗi mà không tự xử lý, để nơi gọi lo; hàm chính
      cho qua để mã ngắn</td></tr><tr><td><code>extends RecursiveTask&lt;Long&gt;</code></td><td><code>extends</code>:
      lớp mới kế thừa lớp mẫu; <code>&lt;Long&gt;</code> nói kết quả của việc là số
      nguyên lớn (kiểu Long)</td></tr></table>'
    clear: true
    say: Nhập tĩnh cho gọi hàm mà khỏi viết tên lớp. Ngoặc nhọn nói kiểu phần tử,
      khai báo ném lỗi nghĩa là hàm không tự xử lý lỗi, còn lớp con kế thừa lớp mẫu.
