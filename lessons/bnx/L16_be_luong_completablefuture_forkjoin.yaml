      nối tiếp một lời hứa khác sinh ra từ kết quả bước trước</td></tr><tr><td><code>orTimeout</code>
      có huỷ việc không?</td><td>không: chỉ hoàn tất lời hứa bằng lỗi quá hạn; việc
