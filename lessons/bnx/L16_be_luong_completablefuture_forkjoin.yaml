      lượt hai trăm mili giây, nên xong sau khoảng sáu trăm mili giây.
    clear: true
  - show: '<p>Câu 2: lần lượt thì cộng, song song đủ luồng thì lấy lời gọi dài nhất.</p>

      $$150 + 250 + 100 + 500 = \hlg{1000} \text{ ms}; \qquad \max(150, 250, 100,
