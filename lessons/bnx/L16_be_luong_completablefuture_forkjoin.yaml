      chọn rõ chính sách khi đầy</td></tr><tr><td>CompletableFuture khác Future ở
      đâu, chạy trên bể nào?</td><td>ghép được (thenCombine, allOf) mà không giữ luồng
      chờ; không truyền bể thì chạy trên bể chung (hoặc luồng mới nếu bể chung dưới
      hai luồng), nên việc chờ vào ra nên truyền bể riêng</td></tr><tr><td>Khi nào
      dùng ForkJoinPool, lấy việc của nhau là gì?</td><td>việc nặng tính toán chia
      nhỏ được; luồng hết việc lấy việc đang chờ của luồng bận; không để việc chờ
