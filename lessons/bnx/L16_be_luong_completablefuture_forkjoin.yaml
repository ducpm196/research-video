    - - 1
    - - 2
      - 3
    pause: 180
    say: Bây giờ tới phần bạn tự làm, viết chương trình Java dựng bể ba luồng với
      hàng đợi năm chỗ, gửi liền mười bốn việc và đếm việc bị từ chối. Rồi viết hàm
      đệ quy, tức hàm tự gọi lại chính nó, đếm việc lá, hãy dừng video và tự viết.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>so luong: 3</div><div>trong
      hang doi: 5</div><div>nhan 8, tu choi 6</div><div>so luot cho 14 viec: 5</div><div>so
      viec la: 32</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh
      BNX L16 Lab.java</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
