    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: 'Nếu người phỏng vấn hỏi về dòng đa luồng trên hồ sơ, đây là ba câu hay gặp.
      Vì sao không dùng thẳng cách tạo bể cố định có sẵn: vì hàng đợi của nó không
      giới hạn. Lời hứa kết quả khác phiếu hẹn ở đâu: nó ghép được mà không giữ luồng
      chờ, và việc chờ vào ra nên được truyền một bể riêng, vì bể chung dùng chung
      cho cả tiến trình. Khi nào dùng bể chia để trị: khi việc nặng tính toán chia
      nhỏ được, và luồng hết việc sẽ lấy việc của luồng bận.'
  - show: '<table class=''t''><tr><th>Câu hỏi tiếp theo hay gặp</th><th>ý trả lời
      (theo hướng dẫn chính thức của Java SE 21)</th></tr><tr><td>Bể tự dựng: số luồng
