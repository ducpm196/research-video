  kind: example
  title: 'Khi tải lớn dần: hàng đợi không giới hạn gãy ở đâu'
  checks:
  - '[alg.bnx_l16_backlog(n, 4) for n in (10, 1000, 100000)] == [6, 996, 99996]'
  - '[alg.bnx_l16_rejected(n, 4, 2) for n in (10, 1000, 100000)] == [4, 994, 99994]'
  - '[alg.bnx_l16_last_start_ms(n, 4, 100) for n in (10, 1000, 100000)] == [200, 24900,
    2499900]'
  - round(2499900 / 60000) == 42 and 24900 // 1000 == 24
  steps:
  - show: '<p><b>HangQuyMo.java (1/3): bể 4 luồng, hàng không giới hạn hoặc hàng 2
      chỗ</b></p><div class="code"><div>import java.util.concurrent.*;</div><div>public
      class HangQuyMo {</div><div>  static void thu(int n, int cho) {</div><div>    CountDownLatch
      cua = new CountDownLatch(1);   // giữ việc lại</div><div>    BlockingQueue&lt;Runnable&gt;
      q = cho &lt; 0 ? new LinkedBlockingQueue&lt;&gt;()</div><div>        : new ArrayBlockingQueue&lt;&gt;(cho);</div><div>    ThreadPoolExecutor
      be = new ThreadPoolExecutor(4, 4, 0,</div><div>        TimeUnit.SECONDS, q);</div><div>    int
      tuChoi = 0;</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta đo thật khi số việc tăng dần. Hàm thử dựng bể bốn luồng, hàng không giới
      hạn nếu tham số âm, còn không thì hàng có sức chứa cố định.
  - show: '<p><b>HangQuyMo.java (2/3): gửi từng việc, đếm việc bị từ chối, in</b></p><div
      class="code"><div>    for (int i = 0; i &lt; n; i++) {</div><div>      try {</div><div>        be.execute(()
      -&gt; {</div><div>          try { cua.await(); } catch (InterruptedException
      e) { }</div><div>        });</div><div>      } catch (RejectedExecutionException
      e) { tuChoi++; }</div><div>    }</div><div>    System.out.println(n + " viec,
      hang " + (cho &lt; 0 ? "vo han"</div><div>        : cho + " cho") + ": trong
      hang " + be.getQueue().size()</div><div>        + ", tu choi " + tuChoi);</div></div>'
    clear: true
    say: Vòng lặp gửi từng việc và đếm việc bị từ chối, rồi in kết quả.
  - show: '<p><b>HangQuyMo.java (3/3): thử ba cỡ</b></p><div class="code"><div>    cua.countDown();</div><div>    be.shutdown();</div><div>  }</div><div>  public
      static void main(String[] a) {</div><div>    for (int n : new int[] {10, 1000,
      100000}) {</div><div>      thu(n, -1);</div><div>      thu(n, 2);</div><div>    }</div><div>  }</div><div>}</div></div>'
    clear: true
    say: Hàm chính thử ba cỡ, mười, một nghìn và một trăm nghìn việc, mỗi cỡ hai lần.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>10 viec, hang vo
      han: trong hang 6, tu choi 0</div><div>10 viec, hang 2 cho: trong hang 2, tu
      choi 4</div><div>1000 viec, hang vo han: trong hang 996, tu choi 0</div><div>1000
      viec, hang 2 cho: trong hang 2, tu choi 994</div><div>100000 viec, hang vo han:
      trong hang 99996, tu choi 0</div><div>100000 viec, hang 2 cho: trong hang 2,
      tu choi 99994</div></div>'
    clear: true
    say: Hàng không giới hạn nuốt mọi việc dư, còn hàng hai chỗ luôn giữ đúng hai
      việc và từ chối phần còn lại.
  - show: '<table class=''t''><tr><th>số việc N</th><th>hàng không giới hạn: việc
      nằm chờ (đo thật)</th><th>việc cuối mới bắt đầu sau (100 ms mỗi việc, số minh
      hoạ)</th><th>hàng 2 chỗ: việc bị từ chối (đo thật)</th></tr><tr><td><span style=''white-space:nowrap''>10
      (×1)</span></td><td>6</td><td>2 lượt = 200 ms</td><td>4</td></tr><tr><td><span
      style=''white-space:nowrap''>1 000 (×100)</span></td><td>996</td><td>249 lượt
      ≈ 25 giây</td><td>994</td></tr><tr><td><span style=''white-space:nowrap''>100
      000 (×10 000)</span></td><td>99 996</td><td>24 999 lượt ≈ 42 phút</td><td>99
      994</td></tr></table><p style=''margin-top:14px''><span class=''note''>Thời
      gian chờ tính từ số đo thật, không đo đồng hồ (đồng hồ phụ thuộc máy). Ở cỡ
      100 000, bể giữ 99 996 phiếu việc trong bộ nhớ.</span></p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ở mười việc, hàng không giới hạn chỉ giữ sáu việc, chẳng ai thấy gì. Gấp
      trăm lần, việc cuối chờ khoảng hai mươi lăm giây. Gấp mười nghìn lần, hàng giữ
      gần một trăm nghìn việc, chờ khoảng bốn mươi hai phút.
  - show: <table class='t'><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào chọn</th></tr><tr><td>hàng
      không giới hạn</td><td>không khách nào bị từ chối ngay</td><td>chờ dài dần,
      bộ nhớ phình theo số việc dư</td><td>tải thấp và chắc chắn không vượt sức bể</td></tr><tr><td>hàng
      có giới hạn, đầy thì từ chối</td><td>thời gian chờ và bộ nhớ có trần</td><td>bên
      gọi phải thử lại, nên lệnh ghi cần khoá lũy đẳng</td><td>tải biến động, cần
      báo sớm cho bên gọi</td></tr></table>
    clear: true
    say: Hàng có giới hạn đặt trần cho thời gian chờ và bộ nhớ, đổi lại bên gọi phải
      thử lại. Vì vậy lệnh ghi cần khoá lũy đẳng, tức mã gửi kèm để gửi lại không
      bị làm hai lần.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_work_total([200, 300, 400]) == 900 and alg.bnx_pool_makespan([200, 300,
    400], 3) == 400
  - alg.bnx_pool_makespan([200, 300, 400], 1) == 900 and alg.bnx_pool_makespan([400,
    200, 300], 2) == 500
  - alg.bnx_l16_backlog(100000, 4) == 99996
  - alg.bnx_shared_order([300, 400], 2, True) == (['chờ 300', 'tính', 'chờ 400'],
    300)
  - alg.bnx_shared_order([300, 400], 2, False) == (['tính', 'chờ 300', 'chờ 400'],
    0)
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới, lúc mới dựng).</b> Nghĩ rằng
      song song làm <b class="red">tổng công việc ít đi</b>.

      Ba lời gọi vẫn tốn $200 + 300 + 400 = 900$ ms công; chỉ có thời gian chờ ngắn
      lại còn 400 ms, và chỉ khi <b>đủ luồng</b>.

      <br><span class="note">Bể chỉ 1 luồng: chờ lại đủ 900 ms. Bể 2 luồng, gửi theo
      thứ tự 400, 200, 300: chờ 500 ms.</span></div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới, là nghĩ song song làm tổng công việc ít đi.
      Ba lời gọi vẫn tốn chín trăm mili giây công, chỉ thời gian chờ ngắn lại.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc tải tăng).</b> Dùng
      <code>Executors.newFixedThreadPool(4)</code> rồi yên tâm.

      Bể này có hàng đợi <b class="red">không giới hạn</b>: bảng quy mô vừa đo cho
      thấy 100 000 việc dồn thành 99 996 việc nằm chờ.

      <br><span class="note">Cách chữa: <code>ThreadPoolExecutor</code> với <code>ArrayBlockingQueue</code>
      có giới hạn. Hàng đầy thì mặc định ném

      <code>RejectedExecutionException</code>; chọn <code>CallerRunsPolicy</code>
      thì luồng gửi tự chạy việc đó, nên bên gửi chậm lại.</span></div>

      '
    clear: true
    say: 'Lỗi thứ hai, của người đã đi làm, lộ ra lúc tải tăng. Bể cố định quen thuộc
      của Java dùng hàng đợi không giới hạn, nên một trăm nghìn việc dồn thành gần
      một trăm nghìn việc chờ, cách chữa: hàng giới hạn.'
  - show: '<p><b>DungChung.java (1/3): hai việc chờ vào ra</b></p><div class="code"><div>import
      java.util.*;</div><div>import java.util.concurrent.*;</div><div>public class
      DungChung {</div><div>  static void thu(Executor io, Executor cpu) throws Exception
      {</div><div>    List&lt;String&gt; xong = new CopyOnWriteArrayList&lt;&gt;();</div><div>    CountDownLatch
      het = new CountDownLatch(3);</div><div>    for (int ms : new int[] {300, 400})
      {</div><div>      io.execute(() -&gt; {               // việc chờ vào ra</div><div>        try
      { Thread.sleep(4*ms); } catch (InterruptedException e) { }</div><div>        xong.add("chờ
      " + ms); het.countDown();</div><div>      });</div><div>    }</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Lỗi thứ ba cần một chương trình nhỏ. Hàm thử nhận hai bể, một cho việc chờ,
      một cho việc tính, và gửi hai việc chờ vào bể thứ nhất.
  - show: '<p><b>DungChung.java (2/3): một việc tính, in thứ tự xong</b></p><div class="code"><div>    cpu.execute(()
      -&gt; { xong.add("tính"); het.countDown(); });</div><div>    het.await();</div><div>    System.out.println(xong);</div><div>  }</div><div>  public
      static void main(String[] a) throws Exception {</div><div>    ExecutorService
      chung = Executors.newFixedThreadPool(2);</div></div>'
    clear: true
    say: Rồi hàm gửi một việc tính ngắn vào bể thứ hai và in thứ tự xong.
  - show: '<p><b>DungChung.java (3/3): một bể dùng chung, rồi tách bể</b></p><div
      class="code"><div>    ExecutorService rieng = Executors.newFixedThreadPool(2);</div><div>    thu(chung,
      chung);                 // một bể cho cả hai loại việc</div><div>    thu(chung,
      rieng);                 // tách bể cho việc tính</div><div>    chung.shutdown();
      rieng.shutdown();</div><div>  }</div><div>}</div></div><p><b>Kết quả chạy thật</b></p><div
      class="code"><div>[chờ 300, tính, chờ 400]</div><div>[tính, chờ 300, chờ 400]</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Lần đầu dùng chung một bể hai luồng, lần sau tách bể cho việc tính. Kết
      quả chạy thật: dùng chung thì việc tính xong sau việc chờ ba trăm vì cả hai
      luồng ngồi chờ, tách bể thì xong trước.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc vận hành lâu dài).</b>
      Cho việc <b class="red">chờ vào ra</b> chạy trong bể dùng chung với việc tính.

      Việc tính cần gần 0 ms mà phải đợi <b>300 ms</b> mới có luồng. Các phương thức
      <code>…Async</code> của CompletableFuture

      <b>không truyền bể</b> thì chạy trên <code>ForkJoinPool.commonPool()</code>,
      bể chung của cả chương trình: hôm nay ổn, vài tháng sau một dịch vụ ngoài chậm
      đi là mọi việc tính đói theo.

      Điều kiện: nếu bể chung không cho nổi hai luồng song song (ví dụ máy chỉ có
      một nhân) thì mỗi việc chạy trên một luồng mới.

      <br><span class="note">Cách chữa: việc chờ vào ra luôn có bể riêng, có giới
      hạn. <code>orTimeout</code> chỉ báo lỗi quá hạn cho bên gọi; việc đang chạy
      không bị huỷ và luồng của bể vẫn bận (theo mô tả trong Javadoc của Java SE 21;
      bài không chạy thử).</span></div>

      '
    clear: true
    say: 'Lỗi thứ ba, của người đã đi làm: việc chờ vào ra chạy chung bể với việc
      tính. Lời hứa kết quả không truyền bể thì chạy trên bể chung, nên dịch vụ ngoài
      chậm là việc tính đói theo, cách chữa là một bể riêng.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_pool_rounds(8, 3) == 3 and alg.bnx_pool_makespan([200] * 8, 3) == 600
  - alg.bnx_work_total([150, 250, 100, 500]) == 1000 and alg.bnx_pool_makespan([150,
    250, 100, 500], 4) == 500
  - alg.bnx_pool_makespan([150, 250, 100, 500], 1) == 1000
  - 50 - alg.bnx_pool_throughput(4, 100) == 10 and alg.bnx_queue_backlog(50, 4, 100,
    60) == 600
  - alg.bnx_queue_backlog(50, 4, 100, 60) / alg.bnx_pool_throughput(4, 100) == 15
  - 20 / alg.bnx_pool_throughput(4, 100) == 0.5
  steps:
  - show: '<table class=''t''><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Bể
      3 luồng nhận 8 việc, mỗi việc 200 ms. Cần mấy lượt, và xong sau khoảng bao lâu?</td></tr><tr><td>2</td><td>Bốn
      lời gọi mất 150, 250, 100 và 500 ms. Gọi lần lượt mất bao lâu? Gọi song song
      trên 4 luồng rồi chờ cả bốn mất bao lâu?</td></tr><tr><td>3</td><td>Quyết định
      (số minh hoạ): bể 4 luồng, mỗi việc 100 ms, giờ cao điểm tới 50 việc/giây. Chọn
      hàng đợi không giới hạn, hàng đợi 20 chỗ và từ chối, hay hàng đợi 20 chỗ và
      luồng gửi tự chạy?</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    pause: 25
    say: Bây giờ tới phần bạn tự làm bài. Câu một, bể ba luồng nhận tám việc, mỗi
      việc hai trăm mili giây, cần mấy lượt và xong sau bao lâu? Câu hai, bốn lời
      gọi mất một trăm năm mươi, hai trăm năm mươi, một trăm và năm trăm, gọi lần
      lượt và song song thì chờ bao lâu? Câu ba chọn loại hàng đợi, hãy tạm dừng và
      làm ra giấy.
  - show: '<p>Câu 1: 8 việc chia cho 3 luồng, làm tròn lên.</p>

      $$8 : 3 \approx 2{,}67 \text{, làm tròn lên: } 3 \text{ lượt} \;\Rightarrow\;
      3 \cdot 200 = \hlg{600} \text{ ms}$$

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu một, tám việc chia ba luồng, làm tròn lên, được ba lượt, tức ba
      lần hai trăm, sáu trăm mili giây.
    clear: true
  - show: '<p>Câu 2: lần lượt thì cộng, song song đủ luồng thì lấy lời gọi dài nhất.</p>

      $$150 + 250 + 100 + 500 = \hlg{1000} \text{ ms}; \qquad \max(150, 250, 100,
      500) = \hlg{500} \text{ ms}$$

      '
    focus:
    - - 1
      - 2
    say: Đáp án câu hai, lần lượt thì cộng cả bốn, được một nghìn mili giây, song
      song thì chờ lời gọi dài nhất, là năm trăm.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hàng
      đợi không giới hạn</td><td>không khách nào bị từ chối ngay</td><td>dư 50 − 40
      = 10 việc/giây: sau 60 giây 600 việc chờ, việc cuối chờ 600 : 40 = 15 giây,
      bộ nhớ đầy dần</td></tr><tr><td>20 chỗ, đầy thì từ chối</td><td>việc được nhận
      chờ nhiều nhất 20 : 40 = 0,5 giây; bộ nhớ có trần</td><td>khoảng 10 việc/giây
      bị từ chối, bên gọi phải thử lại</td></tr><tr><td>20 chỗ, luồng gửi tự chạy</td><td>không
      mất việc, bên gửi tự chậm lại</td><td>luồng nhận yêu cầu bị giữ 100 ms mỗi lần,
      độ trễ lan ngược ra phía trước</td></tr></table>'
    say: Đáp án câu ba, hàng không giới hạn không từ chối ai, nhưng sau một phút việc
      cuối chờ mười lăm giây. Hàng hai mươi chỗ và từ chối thì chờ nhiều nhất nửa
      giây, đổi lại khoảng mười việc mỗi giây phải thử lại, miễn là bên gọi thử lại
      an toàn.
    clear: true
- id: practice
  kind: practice
  title: 'Tự làm: bể luồng giới hạn hàng đợi và việc lá'
  steps:
  - show: '<p><b>Đề</b>: viết <code>Lab.java</code> (<code>import java.util.concurrent.*;</code>):</p>

      <ol><li>bể <b>3 luồng cố định</b> + <code>ArrayBlockingQueue</code> <b>5 chỗ</b>,
      một chốt <code>CountDownLatch(1)</code> giữ việc; gửi liền <b>14 việc</b>, bắt
      <code>RejectedExecutionException</code>; in số luồng, số việc trong hàng, <code>nhan
