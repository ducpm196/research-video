      (số minh hoạ): bể 4 luồng, mỗi việc 100 ms, giờ cao điểm tới 50 việc/giây. Chọn
      hàng đợi không giới hạn, hàng đợi 20 chỗ và từ chối, hay hàng đợi 20 chỗ và
