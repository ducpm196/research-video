    say: Bây giờ tới phần bạn tự làm bài. Câu một, bể ba luồng nhận tám việc, mỗi
      việc hai trăm mili giây, thì cần mấy lượt và xong sau bao lâu? Câu hai, bốn
      lời gọi mất một trăm năm mươi, hai trăm năm mươi, một trăm và năm trăm mili
      giây, gọi lần lượt và gọi song song thì chờ bao lâu? Câu ba, giờ cao điểm việc
      tới nhanh hơn sức xử lý của bể, bạn chọn loại hàng đợi nào trong ba loại trên
      màn hình? Hãy tạm dừng lại và làm từng câu ra giấy trước khi xem đáp án.
  - show: '<p>Câu 1: 8 việc chia cho 3 luồng, làm tròn lên.</p>

      $$8 : 3 \approx 2{,}67 \text{, làm tròn lên: } 3 \text{ lượt} \;\Rightarrow\;
      3 \cdot 200 = \hlg{600} \text{ ms}$$

