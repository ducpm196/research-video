- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, theo từng giai đoạn của hệ thống
  checks:
  - alg.bnx_work_total([200, 300, 400]) == 900 and alg.bnx_pool_makespan([200, 300,
    400], 3) == 400
  - alg.bnx_pool_makespan([200, 300, 400], 1) == 900 and alg.bnx_pool_makespan([400,
    200, 300], 2) == 500
  - alg.bnx_pool_throughput(4, 100) == 40 and alg.bnx_queue_backlog(50, 4, 100, 60)
    == 600
  - alg.bnx_shared_order([300, 400], 2, True) == (['chờ 300', 'tính', 'chờ 400'],
    300)
  - alg.bnx_shared_order([300, 400], 2, False) == (['tính', 'chờ 300', 'chờ 400'],
    0)
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới, lúc mới dựng).</b> Nghĩ rằng
      song song làm <b class="red">tổng công việc ít đi</b>.

      Ba lời gọi vẫn tốn $200 + 300 + 400 = 900$ ms công; chỉ có thời gian chờ ngắn
      lại còn 400 ms, và chỉ khi <b>đủ luồng</b>.

      <br><span class="note">Bể chỉ 1 luồng: chờ lại đủ 900 ms. Bể 2 luồng, gửi theo
      thứ tự 400, 200, 300: chờ 500 ms.</span></div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới lúc mới dựng hệ thống, là nghĩ rằng song song
      làm tổng công việc ít đi. Ba lời gọi vẫn tốn chín trăm mili giây công, chỉ có
      thời gian chờ ngắn lại còn bốn trăm, và chỉ khi đủ luồng. Nếu bể chỉ có một
      luồng thì ta chờ lại đủ chín trăm, còn bể hai luồng thì chờ năm trăm mili giây.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm, lúc tải tăng).</b> Dùng
      <code>Executors.newFixedThreadPool(4)</code> rồi yên tâm.

      Bể này có hàng đợi <b class="red">không giới hạn</b>: tải tăng tới 50 việc/giây
      trong khi bể làm được 40 thì mỗi phút dồn thêm 600 việc, tới khi hết bộ nhớ.

      <br><span class="note">Cách chữa: <code>ThreadPoolExecutor</code> với <code>ArrayBlockingQueue</code>
      có giới hạn. Hàng đầy thì mặc định ném

      <code>RejectedExecutionException</code>; chọn <code>CallerRunsPolicy</code>
      thì luồng gửi tự chạy việc đó, nên bên gửi chậm lại.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, lộ ra lúc tải tăng. Cách tạo bể cố định
      quen thuộc nhất của Java dùng một hàng đợi không giới hạn. Khi tải tăng tới
      năm mươi việc mỗi giây mà bể chỉ làm được bốn mươi, mỗi phút dồn thêm sáu trăm
      việc, cho tới khi hết bộ nhớ. Cách chữa là tự tạo bể với hàng đợi có giới hạn.
      Hàng đầy thì mặc định bể ném lỗi từ chối, như chương trình thứ hai đã cho thấy.
      Ta cũng có thể chọn chính sách để luồng gửi tự chạy việc đó, nhờ vậy bên gửi
      tự chậm lại.
  - show: '<p><b>DungChung.java (trích): hai việc chờ vào ra và một việc tính</b></p><div
      class="code"><div>  static void thu(Executor io, Executor cpu) throws Exception
      {</div><div>    List&lt;String&gt; xong = new CopyOnWriteArrayList&lt;&gt;();</div><div>    CountDownLatch
      het = new CountDownLatch(3);</div><div>    for (int ms : new int[] {300, 400})
      {</div><div>      io.execute(() -&gt; {               // việc chờ vào ra</div><div>        try
      { Thread.sleep(ms); } catch (InterruptedException e) { }</div><div>        xong.add("chờ
      " + ms); het.countDown();</div><div>      });</div><div>    }</div><div>    cpu.execute(()
      -&gt; { xong.add("tính"); het.countDown(); });</div><div>    het.await();</div><div>    System.out.println(xong);</div></div>'
    focus:
    - 0
    - '2.1'
    - - '2.4'
      - '2.5'
      - '2.6'
      - '2.7'
    - '2.10'
    - - '2.2'
      - '2.11'
      - '2.12'
    clear: true
    say: Lỗi thứ ba cần một chương trình nhỏ. Hàm thử nhận hai bể, một cho việc chờ
      vào ra, một cho việc tính. Nó gửi hai việc chờ, ba trăm và bốn trăm mili giây,
      vào bể thứ nhất. Rồi nó gửi một việc tính rất ngắn vào bể thứ hai. Mỗi việc
      xong thì ghi tên vào danh sách, và cuối cùng hàm in danh sách theo thứ tự xong.
  - show: '<p><b>DungChung.java (tiếp): một bể dùng chung, rồi tách bể</b></p><div
      class="code"><div>  public static void main(String[] a) throws Exception {</div><div>    ExecutorService
      chung = Executors.newFixedThreadPool(2);</div><div>    ExecutorService rieng
      = Executors.newFixedThreadPool(2);</div><div>    thu(chung, chung);                 //
      một bể cho cả hai loại việc</div><div>    thu(chung, rieng);                 //
      tách bể cho việc tính</div><div>    chung.shutdown(); rieng.shutdown();</div></div><p><b>Kết
      quả chạy thật</b></p><div class="code"><div>[chờ 300, tính, chờ 400]</div><div>[tính,
      chờ 300, chờ 400]</div></div>'
    focus:
    - - '2.2'
      - '2.3'
    - - '2.4'
      - '2.5'
    - '4.1'
    - '4.2'
    clear: true
    say: 'Hàm chính tạo hai bể, mỗi bể hai luồng. Lần thử đầu dùng chung một bể cho
      cả hai loại việc, lần thử sau cho việc tính một bể riêng. Kết quả chạy thật:
      khi dùng chung, việc tính chỉ xong sau việc chờ ba trăm, vì cả hai luồng đều
      đang ngồi chờ. Khi tách bể, việc tính xong trước tiên.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm, lúc vận hành lâu dài).</b>
      Cho việc <b class="red">chờ vào ra</b> chạy trong bể dùng chung với việc tính.

      Việc tính cần gần 0 ms mà phải đợi <b>300 ms</b> mới có luồng. Trong Java, các
      phương thức <code>…Async</code> của CompletableFuture

      <b>không truyền bể</b> thì chạy trên <code>ForkJoinPool.commonPool()</code>,
      bể chung của cả tiến trình: hôm nay ổn, vài tháng sau một dịch vụ ngoài chậm
      đi là mọi việc tính đói theo.

      Điều kiện: nếu bể chung không cho nổi hai luồng song song (ví dụ máy chỉ có
      một nhân, kể cả khi bị giới hạn còn một nhân) thì mỗi việc chạy trên một luồng
      mới.

      <br><span class="note">Cách chữa: việc chờ vào ra luôn có bể riêng, có giới
      hạn. <code>orTimeout</code> chỉ báo lỗi quá hạn cho bên gọi; việc đang chạy
      không bị huỷ và luồng của bể vẫn bận (chạy thật ở bộ kiểm). Muốn nhả luồng,
      đặt hạn ngay ở nơi gọi ra ngoài.</span></div>

      '
    clear: true
    say: 'Đó là lỗi thứ ba, của người đã đi làm, lộ ra khi vận hành lâu dài: cho việc
      chờ vào ra chạy chung bể với việc tính. Việc tính gần như không tốn thời gian
      mà phải đợi ba trăm mili giây mới có luồng. Trong Java, lời hứa kết quả chạy
      không đồng bộ mà không được truyền bể riêng thì chạy trên một bể chung của cả
      tiến trình. Nếu bể chung không cho nổi hai luồng song song, ví dụ máy chỉ có
      một nhân, thì mỗi việc chạy trên một luồng mới. Hôm nay mọi thứ ổn, nhưng vài
      tháng sau một dịch vụ ngoài chậm đi là mọi việc tính đói theo. Cách chữa là
      việc chờ vào ra luôn có bể riêng, có giới hạn. Lệnh đặt hạn chờ của lời hứa
      kết quả chỉ báo lỗi quá hạn cho bên gọi, còn việc đang chạy không bị huỷ. Luồng
      của bể vẫn bận, nên muốn nhả luồng phải đặt hạn ngay ở nơi gọi ra ngoài.'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.bnx_pool_rounds(8, 3) == 3 and alg.bnx_pool_makespan([200] * 8, 3) == 600
  - alg.bnx_work_total([150, 250, 100, 500]) == 1000 and alg.bnx_pool_makespan([150,
    250, 100, 500], 4) == 500
  - alg.bnx_pool_makespan([150, 250, 100, 500], 1) == 1000
  - 50 - alg.bnx_pool_throughput(4, 100) == 10 and alg.bnx_queue_backlog(50, 4, 100,
