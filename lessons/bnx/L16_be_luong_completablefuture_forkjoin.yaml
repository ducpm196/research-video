  steps:
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>public
      class Ten { … }</code></td><td>khai một <b>lớp</b>: khối chứa các hàm và dữ
      liệu của chương trình; <code>public</code>: nơi khác dùng được; phần thân nằm
      giữa cặp ngoặc nhọn</td><td><code>public class BeLuong { … }</code>: lớp tên
      BeLuong chứa hàm chính</td></tr><tr><td><code>public static void main(String[]
      a)</code></td><td>hàm máy chạy đầu tiên khi mở chương trình; <code>String[]
      a</code>: mảng chuỗi gõ kèm lúc chạy, bài này không dùng</td><td><code>public
      static void main(String[] a) throws Exception {</code>: máy bắt đầu chạy từ
      đây</td></tr></table>'
    clear: true
    say: Lớp là khối chứa các hàm và dữ liệu, nằm giữa cặp ngoặc nhọn. Hàm chính là
      chỗ máy bắt đầu chạy chương trình.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>int
      so = i;</code>, <code>long t0</code>, <code>boolean ok</code>, <code>String
      s</code></td><td>khai biến: <b>kiểu</b> rồi tên, rồi <code>=</code> giá trị;
      <code>int</code>: số nguyên, <code>long</code>: số nguyên lớn, <code>boolean</code>:
      đúng hoặc sai, <code>String</code>: chuỗi chữ</td><td><code>int tong = 0;</code>,
      <code>long t0 = …;</code></td></tr><tr><td><code>new Kiểu(…)</code>, <code>new
      int[] {3, 4}</code></td><td><code>new</code>: tạo mới; <code>new Kiểu(…)</code>
      tạo một đối tượng; <code>new int[] {3, 4}</code> tạo mảng số nguyên với các
      giá trị liệt kê; <code>&lt;&gt;</code> để trống thì lấy kiểu ở vế trái</td><td><code>new
      ArrayList&lt;&gt;()</code>, <code>new CountDownLatch(1)</code>, <code>new int[]
      {300, 400}</code></td></tr></table>'
    clear: true
    say: 'Khai biến là viết kiểu rồi tên rồi giá trị: số nguyên, số nguyên lớn, đúng
      sai, chuỗi chữ. Chữ tạo mới tạo một đối tượng, hoặc một mảng với các giá trị
      liệt kê.'
  - show: '<p><b>BeLuong.java (1/3): nhập thư viện, tạo bể 4 luồng</b></p><div class="code"><div>import
      java.util.*;</div><div>import java.util.concurrent.*;</div><div>public class
      BeLuong {</div><div>  public static void main(String[] a) throws Exception {</div><div>    ExecutorService
      be = Executors.newFixedThreadPool(4);</div><div>    Set&lt;String&gt; luong
      = ConcurrentHashMap.newKeySet();</div><div>    List&lt;Future&lt;Integer&gt;&gt;
      hen = new ArrayList&lt;&gt;();</div><div>    for (int i = 1; i &lt;= 10; i++)
      {</div></div>'
    focus:
    - - 1
    - 2
    clear: true
    say: Ta chạy thật bằng Java, hai dòng đầu nhập thư viện, rồi khai lớp và hàm chính.
      Dòng năm tạo bể bốn luồng, tập hợp ghi tên luồng đã làm, danh sách giữ các phiếu
      hẹn.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>for
      (int i = 1; i &lt;= 10; i++) { … }</code></td><td>vòng lặp đếm: khai biến đếm;
      điều kiện để còn lặp; bước sau mỗi vòng (<code>i++</code>: tăng i thêm 1); thân
      giữa cặp ngoặc nhọn</td><td><code>for (int i = 1; i &lt;= 10; i++)</code>: i
      chạy 1, 2, … 10</td></tr><tr><td><code>for (long x : ca) { … }</code></td><td>duyệt
      từng phần tử: mỗi vòng <code>x</code> nhận một phần tử của <code>ca</code>,
      theo thứ tự</td><td><code>for (Future&lt;Integer&gt; h : hen) tong += h.get();</code>:
      h là từng phiếu hẹn trong <code>hen</code>; <code>tong += x</code> cộng x vào
      tong</td></tr><tr><td><code>() -&gt; { … }</code>, <code>x -&gt; x + 1</code></td><td>hàm
      ngắn không tên: bên trái mũi tên là tham số, bên phải là việc làm; <code>()</code>:
      không tham số</td><td><code>be.submit(() -&gt; { … })</code>: gửi một việc nhỏ
      không tên; trong đó <code>Thread.sleep(100)</code> cho luồng ngủ 100 mili giây</td></tr></table>'
    clear: true
    say: 'Vòng lặp đếm có khai biến đếm, điều kiện còn lặp, bước sau mỗi vòng; hai
      dấu cộng là tăng một. Dấu hai chấm duyệt từng phần tử của dãy, theo thứ tự.
      Hàm ngắn không tên: tham số bên trái mũi tên, việc làm bên phải.'
  - show: '<p><b>BeLuong.java (2/3): gửi 10 việc</b></p><div class="code"><div>      int
      so = i;</div><div>      hen.add(be.submit(() -&gt; {</div><div>        Thread.sleep(100);               //
      mỗi việc chờ 100 ms</div><div>        luong.add(Thread.currentThread().getName());</div><div>        return
      so * so;</div><div>      }));</div><div>    }</div><div>    int tong = 0;</div><div>    for
      (Future&lt;Integer&gt; h : hen) tong += h.get();  // chờ kết quả</div><div>    be.shutdown();</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Vòng lặp gửi mười việc, mỗi việc chờ một trăm mili giây, ghi tên luồng rồi
      trả về bình phương. Sau đó ta chờ từng phiếu hẹn, cộng kết quả và đóng bể.
  - show: '<table class=''t''><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>System.out.println("n
      = " + n);</code></td><td>in một dòng ra màn hình; dấu <code>+</code> giữa chuỗi
      và số nối chúng thành một chuỗi</td><td><code>System.out.println("số luồng đã
