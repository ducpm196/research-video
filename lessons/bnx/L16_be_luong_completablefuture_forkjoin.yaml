    say: Còn bốn câu hỏi tiếp theo hay gặp, trả lời theo hướng dẫn chính thức. Số
      luồng tối đa chỉ có tác dụng khi hàng đợi đầy, còn hàng đợi không giới hạn thì
      số luồng không vượt số lõi. Khi lời hứa kết quả gặp lỗi, lệnh lấy kết quả ném
      lỗi bọc lỗi gốc, còn lệnh bắt lỗi và lệnh xử lý cả hai trường hợp nhận lỗi để
      xử lý. Lệnh ghép hai kết quả khác lệnh nối tiếp ở chỗ lệnh nối tiếp dựng lời
      hứa mới từ kết quả bước trước. Cuối cùng, hạn chờ không huỷ việc đang chạy,
      nó chỉ báo lỗi quá hạn cho bên gọi.
