    say: Máy chủ xin chứng chỉ khách, khách ký bằng khoá riêng. Thư viện kiểm nơi
      cấp và hạn, ứng dụng kiểm tên, người vận hành xoay vòng trước khi hết hạn.
  - show: '<div class=''box key''><b>Tư duy:</b> mTLS trả lời “máy nào đang gọi”,
      mã truy cập trả lời “được làm gì, thay mặt ai”. Cần cả hai.

      Mỗi thông báo lỗi ở ví dụ chỉ về một cửa (riêng “unable to get local issuer
      certificate” có hai nguyên nhân, như câu 2): đọc nó trước khi sửa.</div>

      '
    say: Điều cần mang theo, M T L S trả lời máy nào đang gọi, còn mã truy cập trả
      lời được làm gì và thay mặt ai, nên cần cả hai. Mỗi thông báo lỗi thường chỉ
      về một cửa, nên hãy đọc nó trước khi sửa.
  - show: '<p>Bài sau: viết thủ tục chuyển tiền chạy ngay trong cơ sở dữ liệu Oracle
      và SQL Server.</p>'
