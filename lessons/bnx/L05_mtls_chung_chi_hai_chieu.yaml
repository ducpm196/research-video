- id: quymo
  kind: example
  title: 'Khi số dịch vụ tăng: số lần đổi chứng chỉ mỗi năm'
  checks:
  - '[alg.bnx_l05_rotations_fleet(n, 365) for n in (10, 1000, 100000)] == [10, 1000,
    100000]'
  - '[alg.bnx_l05_rotations_fleet(n, 30) for n in (10, 1000, 100000)] == [180, 18000,
    1800000]'
  - round(1800000 / 365) == 4932 and 100000 // 10 == 10000 and 1000 // 10 == 100
  steps:
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th><th>ví
      dụ</th></tr><tr><td><code>def xoay(dich_vu, han, nam=365):</code></td><td>định
      nghĩa hàm; <code>nam=365</code> là giá trị mặc định nếu lúc gọi không đưa</td><td><code>xoay(10,
      30)</code> dùng nam = 365</td></tr><tr><td><code>han * 2 // 3</code></td><td><code>//</code>
      chia rồi bỏ phần lẻ</td><td><code>365 * 2 // 3</code> = 730 // 3 = 243</td></tr><tr><td><code>for
      _ in range(n):</code></td><td>lặp n lần; tên <code>_</code> nghĩa là không cần
      giá trị đếm</td><td>n = 3: chạy 3 lần</td></tr><tr><td><code>while ngay &lt;=
      nam:</code>, <code>dem += 1</code></td><td>lặp khi điều kiện còn đúng; <code>+=
      1</code> là tăng thêm 1</td><td>dem = 4 thì thành 5</td></tr></table>'
    clear: true
    say: Tham số cuối của hàm có thể có giá trị mặc định. Hai dấu gạch chéo chia rồi
      bỏ phần lẻ, nên ba trăm sáu mươi lăm nhân hai chia ba ra hai trăm bốn mươi ba.
      Vòng lặp một chạy đúng số lần cho trước, vòng lặp hai chạy khi điều kiện còn
      đúng, và cộng một là tăng biến đếm.
  - show: '<p><b>Mỗi dịch vụ xoay chứng chỉ khi đã dùng 2/3 hạn, đếm trong 365 ngày</b></p><div
      class="code"><div>def xoay(dich_vu, han, nam=365):</div><div>    buoc = han
      * 2 // 3          # xoay khi đã dùng 2/3 hạn</div><div>    dem = 0</div><div>    for
      _ in range(dich_vu):</div><div>        ngay = buoc</div><div>        while ngay
      &lt;= nam:</div><div>            dem += 1             # một lần đổi chứng chỉ</div><div>            ngay
      += buoc</div><div>    return dem</div><div>for n in (10, 1000, 100000):</div><div>    print(n,
      "dv: han365 =", xoay(n, 365), "| han30 =", xoay(n, 30))</div></div>'
    clear: true
    say: Hàm này đếm số lần đổi chứng chỉ trong một năm, khi mỗi dịch vụ xoay lúc
      đã dùng hai phần ba hạn, với mười, một nghìn, một trăm nghìn dịch vụ.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>10 dv: han365 = 10
      | han30 = 180</div><div>1000 dv: han365 = 1000 | han30 = 18000</div><div>100000
      dv: han365 = 100000 | han30 = 1800000</div></div><table class=''t''><tr><th>số
      dịch vụ</th><th>hạn 365 ngày: lần đổi trong 365 ngày đầu</th><th>hạn 30 ngày:
      lần đổi mỗi năm</th></tr><tr><td>10</td><td>10</td><td>180</td></tr><tr><td>1
      000 (gấp 100 lần)</td><td>1 000</td><td>18 000</td></tr><tr><td>100 000 (gấp
      10 000 lần)</td><td>100 000</td><td>1 800 000</td></tr></table><p class="note">Hạn
      365 ngày: số liệu là trong 365 ngày đầu; về lâu dài cứ 243 ngày đổi một lần,
      khoảng 1,5 lần mỗi năm (365 : 243).</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Hạn một năm thì trong năm đầu mỗi dịch vụ đổi một lần, về lâu dài khoảng
      một lần rưỡi mỗi năm. Hạn ba mươi ngày thì mỗi dịch vụ đổi mười tám lần, nên
      một trăm nghìn dịch vụ phải đổi một triệu tám trăm nghìn lần. Chia ra gần năm
      nghìn lần mỗi ngày, nên hạn ngắn bắt buộc đi cùng hệ thống cấp tự động.
  - show: '<table class=''t''><tr><th>cách</th><th>được</th><th>mất</th><th>khi nào
      chọn</th></tr><tr><td>hạn dài, đổi bằng tay</td><td>ít lần đổi: khoảng 1 đến
      1,5 lần mỗi năm mỗi dịch vụ</td><td>khoá lộ còn dùng được gần cả năm; quên ngày
      hết hạn là sự cố lúc hai giờ sáng</td><td>ít dịch vụ, hệ thống nhỏ</td></tr><tr><td>hạn
      ngắn, đổi tự động</td><td>khoá lộ chỉ hở vài chục ngày; hạn hết là chuyện thường
      ngày</td><td>phải xây và giữ hệ thống cấp, giám sát; hỏng nó thì mọi dịch vụ
      cùng gặp lỗi</td><td>nhiều dịch vụ, dữ liệu nhạy cảm</td></tr></table>'
    clear: true
    say: Đổi bằng tay chạy được với mười dịch vụ, nhưng gãy ở hàng nghìn, vì quên
      một ngày là sự cố. Hạn ngắn tự động thu hẹp khoảng hở khi lộ khoá, đổi lại phải
      giữ một hệ thống cấp mà hỏng thì mọi dịch vụ cùng lỗi.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - alg.bnx_l05_cases(__import__('datetime').datetime.now()).count('ok') == 1
  - 90 - alg.bnx_rotate_day(90) == 30
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Gặp lỗi chứng chỉ thì <b
      class="red">tắt kiểm</b> “để chạy tạm” (<code>CERT_NONE</code>, <code>verify=False</code>).

      Khi đó cả ba khách sai ở trên đều vào được, và “tạm” thường thành mãi mãi.

      <br><span class="note">Cách chữa: đọc thông báo lỗi như ở ví dụ, sửa đúng chứng
      chỉ hoặc nơi cấp.</span></div>

      '
    clear: true
    say: Lỗi thứ nhất, của người mới, gặp lỗi chứng chỉ thì tắt kiểm để chạy tạm.
      Khi đó cả ba khách sai đều vào được, và cái tạm thường thành mãi mãi, cách chữa
      là đọc thông báo lỗi.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Coi mTLS là <b class="red">phân
      quyền</b>. Chứng chỉ chỉ nói “đây là máy <code>thanh_toan</code>”, không nói
      khách hàng nào, được làm gì.

      <br><span class="note">Cách chữa: mTLS xác thực máy; quyền theo người dùng vẫn
      đi bằng mã truy cập có phạm vi (OAuth 2.0), và ứng dụng tự kiểm tên ở cửa ④.</span></div>

      '
    clear: true
    say: Lỗi thứ hai, của người đã đi làm, là coi M T L S là phân quyền. Chứng chỉ
      chỉ nói đây là máy nào, không nói khách hàng nào, được làm việc gì. Cách chữa
      là dùng M T L S để xác thực máy, còn quyền theo người dùng đi bằng mã truy cập
      có phạm vi.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> <b class="red">Quên
      ngày hết hạn</b>: hai giờ sáng, mọi lệnh gọi trả lỗi như khách <code>het_han</code>.
      Hoặc <b class="red">đổi nơi cấp cùng lúc cho mọi máy</b>: lỗi như khách <code>la_mat</code>
      (unable to get local issuer certificate).

      <br><span class="note">Cách chữa: cảnh báo trước 30 ngày, xoay vòng tự động;
      khi đổi nơi cấp, máy chủ tin <b>cả cũ lẫn mới</b> tới khi mọi khách đã đổi.</span></div>

      '
    clear: true
    say: Lỗi thứ ba, của người đã đi làm, có hai dạng. Quên ngày hết hạn thì hai giờ
      sáng mọi lệnh gọi trả lỗi như khách cũ. Đổi nơi cấp cùng lúc cho mọi máy thì
      lỗi giống khách lạ. Cách chữa là cảnh báo trước ba mươi ngày, xoay vòng tự động,
      và tin cả nơi cấp cũ lẫn mới tới khi mọi khách đã đổi.
