      x1="635" y1="385" x2="725" y2="385" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><line
      x1="1065" y1="385" x2="1145" y2="385" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/></svg></div>'
    clear: true
    say: Máy chủ kiểm khách qua các cửa, một, có trình chứng chỉ không. Hai, có do
      nơi cấp mình tin ký không. Ba, còn hạn không, ba cửa này do thư viện mật mã
      làm, mỗi cửa hỏng có thông báo riêng bằng chữ đỏ. Cửa bốn, tên khách có được
      gọi không, là việc của ứng dụng.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: máy chủ biết khách là ai'
  checks:
  - alg.bnx_l05_cases(__import__('datetime').datetime.now())[2] == 'expired'
  - alg.bnx_rotate_day(90) == 60
  - 90 - alg.bnx_rotate_day(90) == 30
  steps:
  - show: '<p><b>Bước 1.</b> TLS một chiều chỉ chứng minh <b>máy chủ</b> là ai. Ai
      vào được mạng nội bộ cũng mở được kết nối tới sổ cái.</p>

      <span class=''note''>Làm thử: máy lạ gọi bằng kênh một chiều → máy chủ không
      có gì để từ chối.</span>

      '
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, vì mã hoá đường truyền một chiều chỉ chứng minh máy chủ là ai,
      nên ai vào được mạng nội bộ cũng mở được kết nối tới sổ cái. Máy chủ không có
      căn cứ từ chối.
  - show: '<p><b>Bước 2.</b> Máy chủ <b>xin</b> chứng chỉ khách. Khách gửi chứng chỉ
      và một <b>chữ ký</b> bằng khoá riêng trên cuộc <b>bắt tay</b>, tức vài thông
      điệp đầu hai bên trao đổi để trình chứng chỉ và thống nhất khoá trước khi gửi
      dữ liệu (RFC 8446 mục 4.4.3).

      <br><span class=''note''>Làm thử: tệp .crt có thể lộ; tệp .key không rời máy,
      nên kẻ chép .crt vẫn không ký được.</span></p>

      '
    say: Bước hai, máy chủ xin chứng chỉ của khách. Bắt tay là vài thông điệp đầu
      để trình chứng chỉ và thống nhất khoá. Khách gửi chứng chỉ kèm chữ ký bằng khoá
      riêng, nên máy chủ biết khách giữ khoá. Tệp chứng chỉ có thể lộ, nhưng khoá
      riêng không rời máy, nên kẻ chép chứng chỉ vẫn không ký được.
  - show: '<p><b>Bước 3.</b> Máy chủ kiểm <b>chuỗi tin cậy</b> (do ca1 ký) và <b>hạn
      dùng</b> (notBefore ≤ bây giờ ≤ notAfter). Ứng dụng kiểm thêm <b>tên</b>.</p>

      $$\text{het\_han: notAfter } = 1/4/2025, \text{ sớm hơn hôm nay} \;\Rightarrow\;
      \hl{\text{hỏng}}$$

      '
    focus:
    - 1
    - - 1
      - 2
    clear: true
    say: Bước ba, máy chủ kiểm chuỗi tin cậy, tức chứng chỉ có do nơi cấp một ký không,
      và kiểm hạn dùng. Ứng dụng kiểm thêm tên, làm thử, chứng chỉ khách cũ hết hạn
      ngày một tháng tư năm hai nghìn hai mươi lăm, nên hỏng.
  - show: '<p><b>Bước 4.</b> Ở TLS 1.3, khách gửi chứng chỉ <b>sau</b> thông điệp
      kết thúc của máy chủ, nên phía khách thấy bắt tay đã xong rồi máy chủ mới kiểm.

      Lỗi chứng chỉ khách vì vậy hiện ra ở <b>lần đọc đầu tiên</b> (quan sát khi chạy
      thật).</p>

      '
    say: Bước bốn, một chi tiết hay gây bối rối. Ở mã hoá đường truyền một chấm ba,
      khách gửi chứng chỉ sau thông điệp kết thúc của máy chủ, nên khách tưởng bắt
      tay đã xong. Vì vậy lỗi hiện ra ở lần đọc đầu tiên.
  - show: '<p><b>Bước 5.</b> Chứng chỉ hết hạn là sự cố <b>có lịch hẹn trước</b>:
      xoay vòng khi đã dùng 2/3 thời hạn (số minh hoạ).</p>

      $$90 \cdot \frac{2}{3} = \hl{60} \text{ ngày}; \quad 90 - 60 = \hlg{30} \text{
      ngày dự phòng}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước năm, vì ngày hết hạn biết trước, sự cố hết hạn là sự cố có lịch hẹn.
      Ta xoay vòng khi đã dùng hai phần ba thời hạn, số minh hoạ. Chín mươi nhân hai
      phần ba là sáu mươi, còn ba mươi ngày dự phòng.
    introduces:
    - cdot
- id: example
  kind: example
  title: Ví dụ chạy thật, từng ca
  checks:
  - alg.bnx_l05_cases(__import__('datetime').datetime.now()) == ['none', 'ca', 'expired',
    'ok']
  - alg.bnx_l05_server_reason['ca'] == 'unable to get local issuer certificate'
  - alg.bnx_days_between('2025-01-01', '2025-04-01') == 31 + 28 + 31 == 90
  steps:
  - show: '<table class=''t''><tr><th>lệnh <code>openssl</code></th><th>nghĩa</th></tr><tr><td><code>req
      -x509</code></td><td>tạo luôn một chứng chỉ (tự ký, hoặc do một nơi cấp khác
      ký nếu có <code>-CA</code>)</td></tr><tr><td><code>-newkey ed25519 -noenc</code></td><td>tạo
      khoá mới kiểu <code>ed25519</code> (kiểu khoá hiện đại, ngắn); <code>-noenc</code>:
      không đặt mật khẩu cho tệp khoá</td></tr><tr><td><code>-subj /CN=ca1 -days 365</code></td><td>đặt
      tên chủ thể (CN) là <code>ca1</code>; chứng chỉ sống 365 ngày</td></tr><tr><td><code>-addext
      tên=giá trị</code></td><td>thêm một thuộc tính vào chứng chỉ; <code>keyUsage=critical,keyCertSign</code>:
      <code>keyCertSign</code> là được ký chứng chỉ khác, <code>critical</code> là
      phần mềm không hiểu thuộc tính này thì phải từ chối cả chứng chỉ</td></tr><tr><td><code>-keyout
      … -out …</code></td><td>tên tệp khoá riêng; tên tệp chứng chỉ</td></tr><tr><td>dấu
      <code>\</code> cuối dòng</td><td>nối dòng này với dòng sau thành một lệnh duy
      nhất</td></tr></table>'
    clear: true
    say: Các lệnh sắp tới dùng nhiều tuỳ chọn. Lệnh tạo luôn một chứng chỉ, với tên
      chủ thể, số ngày sống và khoá kiểu hiện đại không mật khẩu. Thuộc tính thêm
      vào có thể đánh dấu bắt buộc phải hiểu, dấu gạch ngược nối lệnh dài.
  - show: '<p><b>Bước A: hai nơi cấp tự ký (cần OpenSSL từ 3.4: kiểm bằng openssl
      version, thấp hơn thì cập nhật; chạy trên Git Bash)</b></p><div class="code"><div>export
      MSYS_NO_PATHCONV=1      # chỉ cần trên Git Bash (Windows)</div><div># hai nơi
      cấp (CA) tự ký, được phép ký chứng chỉ khác</div><div>openssl req -x509 -newkey
      ed25519 -noenc -subj /CN=ca1 -days 365 \</div><div>  -addext keyUsage=critical,keyCertSign
      \</div><div>  -keyout ca1.key -out ca1.crt</div><div>openssl req -x509 -newkey
      ed25519 -noenc -subj /CN=ca2 -days 365 \</div><div>  -addext keyUsage=critical,keyCertSign
      \</div><div>  -keyout ca2.key -out ca2.crt</div></div>'
    focus:
    - 0
    - - '2.3'
      - '2.6'
    - '2.1'
    - - '2.4'
      - '2.7'
    clear: true
    say: Bước A tạo hai nơi cấp tự ký, ca một và ca hai, mỗi nơi một cặp khoá và một
      chứng chỉ hạn ba trăm sáu mươi lăm ngày. Dòng đầu chỉ cần trên hệ điều hành
      ghi ở chú thích. Cờ ký chứng chỉ là bắt buộc, vì thiếu nó thì Python ba chấm
      mười ba từ chối nơi cấp ngay. Công cụ cần bản ba chấm bốn trở lên.
  - show: '<table class=''t''><tr><th>lệnh <code>openssl</code> thêm</th><th>nghĩa</th></tr><tr><td><code>-CA
      ca1.crt -CAkey ca1.key</code></td><td>ký bằng chứng chỉ và khoá riêng của nơi
      cấp <code>ca1</code>, không tự ký</td></tr><tr><td><code>basicConstraints=CA:FALSE</code>,
      <code>subjectAltName=DNS:localhost</code></td><td>chứng chỉ lá, không được ký
      chứng chỉ khác; tên máy mà chứng chỉ nhận là đúng</td></tr><tr><td><code>-not_before
      … -not_after …</code></td><td>ngày bắt đầu và ngày hết hạn tự chọn, viết năm
      tháng ngày giờ phút giây rồi chữ Z: <code>20250401000000Z</code> là 1/4/2025</td></tr><tr><td><code>openssl
      verify -CAfile ca1.crt a.crt b.crt</code></td><td>kiểm từng chứng chỉ có do
      nơi cấp trong <code>ca1.crt</code> ký và còn hạn không: in <code>OK</code> hoặc
      lỗi</td></tr></table>'
    clear: true
    say: Hai bước sau dùng thêm bốn cách viết. Chứng chỉ được ký bằng khoá riêng của
      nơi cấp, không tự ký. Chứng chỉ lá không được ký chứng chỉ khác. Hai tuỳ chọn
      ngày đặt ngày bắt đầu và hết hạn. Lệnh cuối kiểm chứng chỉ với nơi cấp.
  - show: '<p><b>Bước B: chứng chỉ máy chủ và khách đúng, do ca1 ký</b></p><div class="code"><div>#
      máy chủ (tên localhost) và hai khách, cùng do ca1 ký</div><div>openssl req -x509
      -newkey ed25519 -noenc -subj /CN=localhost \</div><div>  -addext basicConstraints=CA:FALSE
      -CA ca1.crt -CAkey ca1.key \</div><div>  -addext subjectAltName=DNS:localhost
      -days 90 \</div><div>  -keyout may_chu.key -out may_chu.crt</div><div>openssl
      req -x509 -newkey ed25519 -noenc -subj /CN=thanh_toan \</div><div>  -addext
      basicConstraints=CA:FALSE -CA ca1.crt -CAkey ca1.key \</div><div>  -days 90
      -keyout thanh_toan.key -out thanh_toan.crt</div><div>openssl req -x509 -newkey
      ed25519 -noenc -subj /CN=ke_toan \</div><div>  -addext basicConstraints=CA:FALSE
      -CA ca1.crt -CAkey ca1.key \</div><div>  -days 90 -keyout ke_toan.key -out ke_toan.crt</div></div>'
    clear: true
    say: 'Bước B cho ca một ký ba chứng chỉ lá hạn chín mươi ngày: một cho máy chủ,
      một cho dịch vụ thanh toán là khách đúng, một cho kế toán, còn hạn nhưng không
      được gọi sổ.'
  - show: '<p><b>Bước C: hai khách sai, rồi tự kiểm bằng openssl verify</b></p><div
      class="code"><div># khách lạ: do ca2 ký; khách cũ: hạn dùng đã qua</div><div>openssl
      req -x509 -newkey ed25519 -noenc -subj /CN=la_mat \</div><div>  -addext basicConstraints=CA:FALSE
      -CA ca2.crt -CAkey ca2.key \</div><div>  -days 90 -keyout la_mat.key -out la_mat.crt</div><div>openssl
      req -x509 -newkey ed25519 -noenc -subj /CN=het_han \</div><div>  -addext basicConstraints=CA:FALSE
      -CA ca1.crt -CAkey ca1.key \</div><div>  -not_before 20250101000000Z -not_after
      20250401000000Z \</div><div>  -keyout het_han.key -out het_han.crt</div><div>openssl
      verify -CAfile ca1.crt thanh_toan.crt la_mat.crt het_han.crt</div></div>'
    focus:
    - - '2.1'
      - '2.2'
      - '2.3'
      - '2.4'
    - - '2.5'
      - '2.6'
      - '2.7'
      - '2.8'
    - '2.9'
    clear: true
    say: Bước C tạo hai khách sai, khách lạ do ca hai ký. Khách cũ do ca một ký nhưng
      hạn dùng đã qua từ tháng tư năm hai nghìn hai mươi lăm. Dòng cuối kiểm ba chứng
      chỉ khách với ca một.
  - show: '<table class=''t''><tr><th>từ trong mã Python</th><th>nghĩa</th></tr><tr><td><code>socket</code></td><td>ổ
      cắm mạng: đầu mút của một kết nối giữa hai chương trình</td></tr><tr><td><code>("127.0.0.1",
      0)</code></td><td>địa chỉ của chính máy này (tên chữ là <code>localhost</code>)
      và số <b>cổng</b>; cổng là số chỉ chương trình nào trên máy nhận kết nối, như
      số phòng; số 0 là để hệ điều hành chọn một cổng trống</td></tr><tr><td><code>ssl</code></td><td>thư
      viện TLS có sẵn của Python</td></tr><tr><td><code>ssl.create_default_context(ssl.Purpose.CLIENT_AUTH)</code></td><td>tạo
      bộ cấu hình TLS cho phía <b>máy chủ</b> (sẽ kiểm khách)</td></tr><tr><td><code>load_cert_chain(crt,
      key)</code>, <code>load_verify_locations(ca)</code></td><td>nạp chứng chỉ và
      khoá riêng của mình; nạp nơi cấp mình tin</td></tr></table>'
    introduces:
    - bnx_o_cam_mang
    clear: true
    say: Ổ cắm mạng là đầu mút của một kết nối giữa hai chương trình. Địa chỉ một
      hai bảy chấm không chấm không chấm một là chính máy này, cổng là số chỉ chương
      trình nhận kết nối. Hai lệnh sau tạo cấu hình máy chủ, nạp chứng chỉ, khoá của
      mình và nơi cấp mình tin.
  - show: '<p><b>Máy chủ Python: bắt buộc chứng chỉ khách</b></p><div class="code"><div>import
      socket, ssl</div><div>from threading import Thread, Event</div><div>mc = ssl.create_default_context(ssl.Purpose.CLIENT_AUTH)</div><div>mc.load_cert_chain("may_chu.crt",
      "may_chu.key")</div><div>mc.load_verify_locations("ca1.crt")     # chỉ tin nơi
      cấp ca1</div><div>mc.verify_mode = ssl.CERT_REQUIRED      # bắt buộc chứng chỉ
      khách</div><div>nghe = socket.create_server(("127.0.0.1", 0))  # cổng ngẫu nhiên</div><div>DUOC_PHEP
      = {"thanh_toan"}   # tên được gọi API này</div></div>'
    focus:
    - - '2.1'
      - '2.3'
      - '2.4'
      - '2.5'
      - '2.6'
    - - '2.7'
      - '2.8'
    clear: true
    say: Giờ dựng máy chủ bằng Python, máy chủ nạp chứng chỉ và khoá của mình, chỉ
      tin ca một, và bắt buộc chứng chỉ khách. Nó nghe ở một cổng ngẫu nhiên, dòng
      cuối là danh sách tên được gọi sổ cái, hiện chỉ có dịch vụ thanh toán.
  - show: '<table class=''t''><tr><th>từ trong mã Python</th><th>nghĩa</th></tr><tr><td><code>Thread(target=…).start()</code></td><td><b>luồng</b>:
      một việc chạy song song với việc chính; ở đây một luồng làm máy chủ, luồng chính
      làm khách; <code>th.join()</code> chờ luồng <code>th</code> chạy xong</td></tr><tr><td><code>Event</code>:
      <code>xong.set()</code>, <code>xong.wait()</code></td><td>cờ hiệu giữa hai luồng:
      một bên chờ, bên kia bật cờ khi xong</td></tr><tr><td><code>try: … except ssl.SSLError
      as e:</code></td><td>thử làm; nếu bắt tay hỏng thì nhảy xuống phần xử lý lỗi,
      <code>e</code> là lỗi nhận được</td></tr><tr><td><code>with … as s:</code></td><td>dùng
      một hay nhiều tài nguyên (ngăn bằng dấu phẩy; dấu <code>\</code> cuối dòng nối
      dòng) rồi tự đóng khi ra khỏi khối</td></tr></table>'
    clear: true
    say: Phần mã máy chủ dùng thêm bốn khái niệm. Luồng là một việc chạy song song
      với việc chính, lệnh nối chờ nó xong, và cờ hiệu giúp hai luồng đợi nhau. Thử
      làm và bắt lỗi chạy phần xử lý khi bắt tay hỏng, còn khối dùng tài nguyên tự
      đóng khi xong.
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>mc.wrap_socket(c,
      server_side=True, do_handshake_on_connect=False)</code></td><td>bọc ổ cắm <code>c</code>
      thành kết nối TLS phía máy chủ; <code>False</code>: chưa bắt tay ngay, để bắt
      tay ở dòng sau</td></tr><tr><td><code>dict(x[0] for x in t.getpeercert()["subject"])</code></td><td>lấy
      chứng chỉ khách, gom tên chủ thể thành từ điển; <code>ten["commonName"]</code>
      là tên chung (CN)</td></tr><tr><td><code>getattr(e, "verify_message", e.reason)</code></td><td>lấy
      thuộc tính <code>verify_message</code> của lỗi <code>e</code>; nếu không có
      thì lấy <code>e.reason</code></td></tr></table>'
    clear: true
    say: Mã sắp tới còn ba cách viết nữa. Lệnh bọc ổ cắm thành kết nối mã hoá và hoãn
      bắt tay sang dòng sau. Dòng gom tên trong chứng chỉ khách vào một từ điển, lệnh
      cuối lấy lý do lỗi, thiếu thì lấy lý do chung.
  - show: <table class='t'><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>c,
      _ = nghe.accept()</code></td><td>chờ một khách nối vào; trả về hai giá trị,
      gán cho <code>c</code> (ổ cắm của khách) và <code>_</code> (địa chỉ khách, bỏ
      không dùng)</td></tr><tr><td><code>t.sendall(x.encode())</code></td><td>gửi
      hết chữ <code>x</code> cho khách; <code>.encode()</code> đổi chữ thành byte,
      vì mạng chỉ chở byte</td></tr><tr><td><code>loi.append(x)</code></td><td>thêm
      <code>x</code> vào cuối danh sách <code>loi</code></td></tr><tr><td><code>a;
      b</code></td><td>hai lệnh trên một dòng, chạy lần lượt</td></tr></table>
    clear: true
    say: Mã máy chủ còn bốn cách viết, lệnh chờ khách trả về hai giá trị gán cho hai
      tên, tên gạch dưới là giá trị bỏ đi. Lệnh gửi chữ cho khách, đổi thành byte
      vì mạng chỉ chở byte. Lệnh thêm vào danh sách thêm phần tử cuối, dấu chấm phẩy
      nối hai lệnh.
  - show: '<p><b>Mỗi kết nối: bắt tay, kiểm tên ở cửa ④, chào hoặc từ chối, hoặc ghi
      lý do</b></p><div class="code"><div>def phuc_vu(loi, xong):</div><div>    c,
      _ = nghe.accept()</div><div>    t = mc.wrap_socket(c, server_side=True,</div><div>                       do_handshake_on_connect=False)</div><div>    try:</div><div>        t.do_handshake()</div><div>        ten
      = dict(x[0] for x in t.getpeercert()["subject"])</div><div>        if ten["commonName"]
      in DUOC_PHEP:    # cửa ④: kiểm tên</div><div>            t.sendall(("chào "
      + ten["commonName"]).encode())</div><div>        else:</div><div>            loi.append("tên
      không được phép")</div><div>            t.sendall("từ chối".encode())</div><div>    except
      ssl.SSLError as e:</div><div>        loi.append(getattr(e, "verify_message",
      e.reason))</div><div>    xong.wait(); t.close()      # đợi khách đọc xong mới
      đóng</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Mỗi kết nối, máy chủ bắt tay, rồi đọc tên chung trong chứng chỉ khách, đó
      là cửa bốn. Tên nằm trong danh sách được phép thì chào theo tên đó, còn không
      thì ghi lý do và từ chối. Nếu bắt tay hỏng, nó ghi lý do của thư viện.
  - show: '<table class=''t''><tr><th>cách viết trong Python</th><th>nghĩa</th></tr><tr><td><code>if
      ten:</code></td><td>chạy phần sau khi <code>ten</code> có giá trị thật (không
      phải <code>None</code>, không rỗng)</td></tr><tr><td><code>socket.create_connection(nghe.getsockname())</code></td><td>nối
      tới đúng địa chỉ và cổng mà máy chủ đang nghe</td></tr><tr><td><code>t.recv(64).decode()</code></td><td>đọc
      tối đa 64 byte nhận được, rồi <code>.decode()</code> đổi byte về chữ</td></tr><tr><td><code>f"{ten}\n  khách:
      {kq}"</code></td><td>chuỗi có chữ <code>f</code> đứng đầu: phần trong ngoặc
      nhọn được thay bằng giá trị của biến; <code>\n</code> là xuống dòng</td></tr></table>'
    clear: true
    say: Hàm thử dùng thêm bốn cách viết, điều kiện có tên chạy khi có tên chứng chỉ.
      Lệnh nối tới địa chỉ máy chủ đang nghe. Lệnh đọc tối đa sáu mươi bốn byte rồi
      đổi về chữ. Chuỗi có chữ f đứng đầu thay phần trong ngoặc nhọn bằng giá trị,
      gạch ngược n là xuống dòng.
  - show: '<p><b>Khách: thử với một chứng chỉ (hoặc không có)</b></p><div class="code"><div>def
      thu(ten):</div><div>    loi, xong = [], Event()</div><div>    th = Thread(target=phuc_vu,
      args=(loi, xong)); th.start()</div><div>    kh = ssl.create_default_context(cafile="ca1.crt")</div><div>    if
      ten: kh.load_cert_chain(ten + ".crt", ten + ".key")</div><div>    try:</div><div>        with
      socket.create_connection(nghe.getsockname()) as s, \</div><div>             kh.wrap_socket(s,
      server_hostname="localhost") as t:</div><div>            kq = t.recv(64).decode()   #
      TLS 1.3: lỗi tới ở lần đọc</div><div>    except ssl.SSLError as e: kq = e.reason</div><div>    xong.set();
      th.join()</div><div>    print(f"{ten}\n  khách: {kq}\n  máy chủ: {loi}")</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Hàm thử mở một luồng phục vụ, rồi làm khách. Khách tin ca một để kiểm máy
      chủ, và nạp chứng chỉ của mình nếu có. Khách đọc lời chào hoặc bắt lỗi, rồi
      in kết quả hai phía.
  - show: <p><b>Năm lần thử</b></p><div class="code"><div>for ten in [None, "la_mat",
      "het_han", "ke_toan", "thanh_toan"]:</div><div>    thu(ten)</div></div>
    clear: true
    say: Ta thử năm lần, từ không có chứng chỉ tới khách đúng.
  - show: '<p><b>Kết quả chạy thật</b></p><div class="code"><div>None</div><div>  khách:
      TLSV13_ALERT_CERTIFICATE_REQUIRED</div><div>  máy chủ: [''PEER_DID_NOT_RETURN_A_CERTIFICATE'']</div><div>la_mat</div><div>  khách:
      TLSV1_ALERT_UNKNOWN_CA</div><div>  máy chủ: [''unable to get local issuer certificate'']</div><div>het_han</div><div>  khách:
      SSLV3_ALERT_CERTIFICATE_EXPIRED</div><div>  máy chủ: [''certificate has expired'']</div><div>ke_toan</div><div>  khách:
      từ chối</div><div>  máy chủ: [''tên không được phép'']</div><div>thanh_toan</div><div>  khách:
      chào thanh_toan</div><div>  máy chủ: []</div></div>'
    focus:
    - 1
    - 1
    - 1
    - - 2
    clear: true
    say: Không có chứng chỉ thì máy chủ báo khách không trình chứng chỉ. Khách lạ
      thì không tìm được nơi cấp mình tin. Khách cũ thì chứng chỉ đã hết hạn. Kế toán
      qua ba cửa nhưng tên không có trong danh sách nên bị từ chối ở cửa bốn, khách
      đúng thì nhận được lời chào.
