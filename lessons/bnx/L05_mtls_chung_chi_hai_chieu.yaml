      <br><span class=''note''>Sửa: cấp lại từ đúng nơi cấp, hoặc thêm nơi cấp hợp
      lệ vào danh sách tin. Không tắt kiểm.</span></p>

      '
    clear: true
    say: Đáp án câu hai, giống khách lạ ở ví dụ, chứng chỉ khách do nơi cấp mà máy
      chủ không tin ký, hoặc thiếu chứng chỉ trung gian. Cách sửa là cấp lại từ đúng
      nơi cấp, hoặc thêm nơi cấp hợp lệ vào danh sách tin, không tắt kiểm.
  - show: '<table class=''t''><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr><tr><td>hạn
      365 ngày, đổi bằng tay</td><td>năm đầu đổi 1 lần, về lâu dài khoảng 1,5 lần
      mỗi năm</td><td>khoá lộ ở ngày 10 (không thu hồi): kẻ gian còn dùng 365 − 10
      = 355 ngày; đổi bằng tay dễ quên</td></tr><tr><td>hạn 30 ngày, đổi tự động</td><td>khoá
      lộ ở ngày 10 (không thu hồi): chỉ còn 30 − 10 = 20 ngày; quen đổi nên ít sự
      cố</td><td>xoay ở ngày 20 (2/3 của 30 ngày), nên đổi 365 : 20 ≈ 18 lần mỗi năm
      (lấy phần nguyên); cần hệ thống cấp tự động</td></tr></table><div class=''box
      key''><b>Chốt:</b> chọn hạn 30 ngày, đổi tự động: khoảng hở 20 ngày thay vì
      355. Cái giá là phải có hệ thống cấp tự động và theo dõi; chưa có thì dựng nó
      trước, không lùi về hạn một năm đổi tay. Nếu thu hồi được ngay khi phát hiện,
      khoảng hở nhỏ hơn, nhưng hạn ngắn vẫn là lớp phòng thêm.</div>'
    focus:
    - '1.2'
    - '1.3'
    - 2
    say: Đáp án câu ba, hạn một năm đổi bằng tay thì khoá lộ ở ngày mười cho kẻ gian
      ba trăm năm mươi lăm ngày. Hạn ba mươi ngày đổi tự động chỉ để hở hai mươi ngày,
      đổi lại mỗi năm phải đổi mười tám lần và cần hệ thống cấp tự động. Chốt lại,
      chọn hạn ba mươi ngày, nhưng dựng hệ thống cấp tự động trước.
    clear: true
- id: practice
