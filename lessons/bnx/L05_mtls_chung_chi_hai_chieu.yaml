  title: 'Tự làm: lịch xoay vòng chứng chỉ'
  steps:
  - show: '<p><b>Đề</b>: hôm nay 15/6/2026; ba chứng chỉ (tên, ngày cấp, hạn dùng
      bằng ngày) <code>so_cai</code> cấp 20/4 hạn 60, <code>bao_cao</code> cấp 10/1
      hạn 365, <code>doi_soat</code> cấp 1/5 hạn 30 (số minh hoạ). Viết <code>mau.py</code>
      in mỗi chứng chỉ một dòng:</p>

      <ol><li>ngày xoay = ngày cấp + hạn × 2 // 3 ngày; ngày hết hạn = ngày cấp +
      hạn</li><li>trạng thái: <code>da het han</code>, <code>can xoay, con N ngay</code>
      hoặc <code>chua den han xoay</code></li><li>dòng cuối đếm chứng chỉ phải xử
      lý</li></ol>

      <p class="note">Định dạng từng dòng và dữ liệu mẫu nằm trong <code>de.md</code>.</p>

      '
    focus:
    - 1
    - - 2
      - 3
    pause: 120
    say: 'Bây giờ tới phần bạn tự làm: hôm nay là mười lăm tháng sáu, có ba chứng
      chỉ khác nhau. Viết chương trình Python tính ngày xoay, ngày hết hạn, in trạng
      thái từng chứng chỉ và đếm số cái phải xử lý, hãy dừng video và tự viết.'
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>so_cai: xoay 2026-05-30,
      het han 2026-06-19: can xoay, con 4 ngay</div><div>bao_cao: xoay 2026-09-10,
      het han 2027-01-10: chua den han xoay</div><div>doi_soat: xoay 2026-05-21, het
      han 2026-05-31: da het han</div><div>So chung chi can xu ly: 2</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh BNX L05 mau.py</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - - 1
      - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi, bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> <code>date.fromisoformat("2026-04-20")</code>
      đổi chữ thành ngày; cộng <code>timedelta(days=60)</code> là cộng 60 ngày (ra
      2026-06-19); trừ hai ngày rồi lấy <code>.days</code> cho số ngày giữa chúng;
      <code>//</code> chia bỏ phần lẻ (<code>7 // 2</code> = 3). Xét hết hạn trước,
      rồi mới tới cần xoay.

      Lời giải ở <code>labs/BNX/L05/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>

      '
    say: Nếu kẹt, đổi chữ thành ngày bằng hàm đọc ngày chuẩn, cộng số ngày bằng khoảng
      thời gian, và trừ hai ngày để ra số ngày còn lại. Xét hết hạn trước, rồi mới
