scenes:
- id: hook
  kind: hook
  title: Hai giờ sáng, mọi lệnh gọi sổ cái bị từ chối
  checks:
  - alg.bnx_add_days('2026-03-01', 90) == '2026-05-30'
  steps:
  - show: '<p>Dịch vụ thanh toán gọi API sổ cái trong mạng nội bộ. Hai câu hỏi người
      vận hành hay gặp (số minh hoạ):</p>

      <div class="box key">① Một máy lạ cắm vào mạng nội bộ có gọi được API sổ cái
      không, nếu API chỉ tin “ở trong mạng là người nhà”?<br>

      ② Chứng chỉ của dịch vụ hạn 90 ngày, cấp 1/3/2026. Ngày 30/5/2026 không ai nhớ
      đổi: chuyện gì xảy ra?</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, dịch vụ thanh toán gọi giao diện lập trình của sổ cái trong mạng
      nội bộ. Người vận hành hay gặp hai câu hỏi, với số minh hoạ. Một, một máy lạ
      cắm vào mạng nội bộ có gọi được sổ cái không, nếu sổ cái chỉ tin rằng ở trong
      mạng là người nhà? Hai, chứng chỉ của dịch vụ hạn chín mươi ngày, cấp ngày một
      tháng ba. Đến ngày ba mươi tháng năm không ai nhớ đổi, chuyện gì xảy ra?
  - show: '<table class=''t''><tr><th>câu hỏi</th><th>bài này trả lời</th></tr><tr><td>máy
      chủ biết người gọi là ai bằng cách nào</td><td>mTLS: máy chủ đòi chứng chỉ của
      khách và tự kiểm</td></tr><tr><td>kiểm những gì</td><td>chuỗi tin cậy, hạn dùng,
      tên; chạy thật bằng openssl và Python</td></tr><tr><td>tránh sự cố hết hạn thế
      nào</td><td>theo dõi ngày hết hạn, xoay vòng trước, không tắt kiểm</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Hôm nay ta trả lời ba câu, máy chủ biết người gọi là ai bằng cách nào, câu
      trả lời là M T L S, hai bên cùng trình chứng chỉ. Máy chủ kiểm những gì, ta
      sẽ chạy thật bằng công cụ dòng lệnh và Python. Và làm sao tránh sự cố hết hạn.
- id: prereq
  kind: prereq
  title: 'Trước hết: bốn điều cần hiểu'
  checks:
  - alg.bnx_add_days('2026-03-01', 90) == '2026-05-30'
  - alg.bnx_days_between('2026-03-01', '2026-05-30') == 31 + 30 + 29 == 90
  steps:
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ</th></tr><tr><td>①
      khoá riêng, khoá công khai</td><td>khoá riêng dùng để ký, giữ kín; khoá công
      khai dùng để kiểm chữ ký, ai cũng có</td><td><code>thanh_toan.key</code> giữ
      kín, <code>.crt</code> gửi đi</td></tr><tr><td>② chứng chỉ</td><td>tên + khoá
      công khai + hạn dùng, có chữ ký của <b>nơi cấp</b> (CA)</td><td>CN=thanh_toan,
      do ca1 ký, hạn 90 ngày</td></tr><tr><td>③ chuỗi tin cậy</td><td>tin nơi cấp
      thì tin chứng chỉ nơi đó ký, nếu còn hạn và đúng tên; thường có nơi cấp <b>trung
      gian</b>: gốc → trung gian → lá, bên trình chứng chỉ gửi kèm chứng chỉ trung
      gian</td><td>tin ca1 thì tin <code>may_chu.crt</code> (ở bài này không có trung
      gian)</td></tr><tr><td>④ TLS một chiều</td><td>lớp bọc kết nối: dữ liệu được
      mã hoá, và khách kiểm chứng chỉ máy chủ (tên, hạn, nơi cấp) để biết chắc nói
      với đúng máy chủ; máy chủ <b>không biết</b> khách là ai</td><td>trình duyệt
      mở trang ngân hàng</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Trước hết ta cần hiểu bốn điều, thứ nhất, khoá riêng dùng để ký và phải giữ
      kín, còn khoá công khai dùng để kiểm chữ ký, ai cũng có. Thứ hai, chứng chỉ
      gồm tên, khoá công khai và hạn dùng, có chữ ký của nơi cấp. Thứ ba, chuỗi tin
      cậy nghĩa là tin nơi cấp thì tin chứng chỉ nơi đó ký, nếu chứng chỉ còn hạn
      và đúng tên. Thực tế thường có nơi cấp trung gian đứng giữa nơi cấp gốc và chứng
      chỉ lá, và bên trình chứng chỉ phải gửi kèm chứng chỉ trung gian. Thứ tư, mã
      hoá đường truyền là lớp bọc kết nối, để dữ liệu được mã hoá và khách biết chắc
      mình đang nói với đúng máy chủ. Ở kiểu một chiều, chỉ khách kiểm chứng chỉ máy
      chủ, còn máy chủ không biết khách là ai.
  - show: '<p>Làm thử: chứng chỉ cấp ngày 1/3/2026, hạn 90 ngày.</p>

      $$31 + 30 + 29 = 90 \;\Rightarrow\; \text{hết hạn ngày } \hl{30/5/2026}$$

      '
    focus:
    - 1
    - 2
    clear: true
    say: Làm thử, chứng chỉ cấp ngày một tháng ba, hạn chín mươi ngày. Tháng ba còn
      ba mươi mốt ngày, tháng tư ba mươi ngày, cộng hai mươi chín ngày của tháng năm
      là đủ chín mươi, nên hết hạn ngày ba mươi tháng năm.
    introduces:
    - implies
- id: sym
  kind: symbol
  title: Giải mã các từ trên chứng chỉ
  steps:
  - show: '<table class=''t''><tr><th>từ trên màn hình</th><th>nghĩa</th></tr><tr><td>CA
      (nơi cấp)</td><td>bên ký chứng chỉ; ở đây tự dựng hai nơi cấp ca1, ca2</td></tr><tr><td>CN,
      subjectAltName</td><td>tên trong chứng chỉ: <code>CN=thanh_toan</code>; máy
      chủ ghi tên miền ở <code>DNS:localhost</code></td></tr><tr><td>notBefore, notAfter</td><td>hạn
      dùng: từ ngày nào tới ngày nào</td></tr><tr><td>keyUsage=keyCertSign</td><td>chứng
      chỉ này được phép <b>ký chứng chỉ khác</b> (chỉ nơi cấp mới có); nơi cấp còn
      cần <code>basicConstraints=CA:TRUE</code>, lệnh <code>req -x509</code> tự thêm</td></tr><tr><td>basicConstraints=CA:FALSE</td><td>chứng
      chỉ lá: không được làm nơi cấp</td></tr><tr><td>CERT_REQUIRED</td><td>máy chủ
      <b>bắt buộc</b> khách trình chứng chỉ hợp lệ</td></tr></table>'
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Bảng này giải mã các từ trên chứng chỉ. Nơi cấp là bên ký chứng chỉ, hôm
      nay ta tự dựng hai nơi cấp. Tên trong chứng chỉ ghi ở trường tên chung, còn
      máy chủ ghi tên miền ở trường tên thay thế. Hai trường thời điểm cho biết hạn
      dùng từ ngày nào tới ngày nào. Cờ ký chứng chỉ cho phép ký chứng chỉ khác, chỉ
      nơi cấp mới có, cùng cờ là nơi cấp mà lệnh tạo chứng chỉ tự ký tự thêm vào.
      Cờ không phải nơi cấp đánh dấu chứng chỉ lá. Cuối cùng, chế độ bắt buộc nghĩa
      là máy chủ đòi khách trình chứng chỉ hợp lệ.
