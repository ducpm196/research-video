  # ───────────────────────── 5. SUY RA CÔNG THỨC ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra dung lượng: đếm điểm ảnh, đếm số, đếm bit"
    checks:
      - "6 * 4 == 24 and 24 * 3 == 72 and 72 * 8 == 576 and 576 // 8 == 72"
      - "alg.cvi_frame_bytes(6, 4) == 72"
    steps:
      - show: |
          <p><b>Bước 1 — đếm điểm ảnh.</b> Ảnh là một lưới $H$ hàng, mỗi hàng $W$ điểm ảnh, nên có $W \cdot H$ điểm ảnh. Làm thử ảnh nhỏ ở trên: $6 \cdot 4 = 24$.</p>
        focus: [1, 1, 1]
        say: "Bước một là đếm điểm ảnh. Ảnh là một lưới H hàng, mỗi hàng có W điểm ảnh, nên theo phép nhân có W nhân H điểm ảnh. Làm thử với ảnh nhỏ ở trên, 6 nhân 4 bằng 24 điểm ảnh."
      - show: |
          <p><b>Bước 2 — đếm số.</b> Mỗi điểm ảnh có $C$ số (một số mỗi kênh), nên cả ảnh có $W \cdot H \cdot C$ số. Làm thử: $24 \cdot 3 = 72$.</p>
        focus: [1, 1]
        say: "Bước hai là đếm số, vì mỗi điểm ảnh có C số, một số cho mỗi kênh, nên cả ảnh có W nhân H nhân C số. Làm thử, 24 nhân 3 bằng 72 số."
      - show: |
          <p><b>Bước 3 — đổi ra byte.</b> Mỗi số dài $b$ bit, và 8 bit là một byte, nên chia cho 8:</p>
          $$\text{dung lượng} = \frac{W \cdot H \cdot C \cdot b}{8} \text{ byte}$$
          <p class="note">Làm thử: $\frac{72 \cdot 8}{8} = 72$ byte. Với 8 bit mỗi kênh, số byte đúng bằng số con số.</p>
        introduces: [frac]
        focus: [1, 2, 3, 3]
        say: "Bước ba là đổi ra byte. Mỗi số dài b bit, và 8 bit là một byte, nên ta chia cho 8. Vậy dung lượng bằng W nhân H nhân C nhân b, chia cho 8, tính bằng byte. Làm thử, 72 nhân 8 chia 8 bằng 72 byte, nghĩa là với 8 bit mỗi kênh, số byte đúng bằng số con số."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Một khung 1920 × 1080, rồi một giây video"
    checks:
      - "1920 * 1080 == 2_073_600"
      - "alg.cvi_frame_bytes(1920, 1080) == 2_073_600 * 3 == 6_220_800"
      - "round(alg.cvi_frame_bytes(1920, 1080) / 2 ** 20, 2) == 5.93"
      - "alg.cvi_frame_bytes(1920, 1080) * 30 == 186_624_000 and round(186_624_000 / 1e6, 1) == 186.6"
    steps:
      - show: |
          <p>Khung ảnh màu $W = 1920$, $H = 1080$, $C = 3$, $b = 8$.</p>
          <p><b>Bước 1.</b> Số điểm ảnh: $1920 \cdot 1080 = \hlb{2\,073\,600}$.</p>
        focus: [1, 2]
        say: "Xét một khung ảnh màu rộng 1920, cao 1080, có 3 kênh, mỗi kênh 8 bit. Bước một, số điểm ảnh bằng 1920 nhân 1080, bằng 2 triệu 73 nghìn 600."
      - show: |
          <p><b>Bước 2.</b> Mỗi điểm ảnh 3 byte: $2\,073\,600 \cdot 3 = \hl{6\,220\,800}$ byte.</p>
        say: "Bước hai, mỗi điểm ảnh có 3 kênh, mỗi kênh 1 byte, nên ta có 2 triệu 73 nghìn 600 nhân 3, bằng 6 triệu 220 nghìn 800 byte."
      - show: |
          <p><b>Bước 3.</b> Đổi ra MiB: $\frac{6\,220\,800}{1\,048\,576} \approx \hlg{5{,}93}$ MiB cho <b>một</b> khung.</p>
        introduces: [approx]
        say: "Bước ba, đổi ra đơn vị hai mũ hai mươi byte, ta chia cho 1 triệu 48 nghìn 576, được xấp xỉ 5 phẩy 93 đơn vị cho chỉ một khung ảnh. Dấu bằng lượn sóng đọc là xấp xỉ."
      - clear: true
        show: |
          <p><b>Bước 4.</b> Một giây 30 khung:</p>
          $$6\,220\,800 \cdot 30 = \hlo{186\,624\,000} \text{ byte} \approx 186{,}6 \text{ triệu byte mỗi giây}$$
          <p class="note">Nhân tiếp 3600 giây ra khoảng 672 tỉ byte mỗi giờ — đúng con số ở phần mở đầu.</p>
        focus: [1, 2, 3]
        say: "Bước bốn, một giây video có 30 khung. Nhân 30 được 186 triệu 624 nghìn byte, tức xấp xỉ 186 phẩy 6 triệu byte mỗi giây. Nhân tiếp 3600 giây được khoảng 672 tỉ byte mỗi giờ, đúng con số ở phần mở đầu."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: đếm bit thay vì byte, và hỏi chính máy"
    checks:
      - "2_073_600 * 24 == 49_766_400 and 49_766_400 // 8 == 6_220_800"
      - "np.zeros((1080, 1920, 3), dtype=np.uint8).nbytes == 6_220_800"
    steps:
      - show: |
          <p><b>Đường khác 1 — đếm bit.</b> Mỗi điểm ảnh $3 \cdot 8 = 24$ bit, nên một khung có $2\,073\,600 \cdot 24 = 49\,766\,400$ bit. Chia 8: $6\,220\,800$ byte ✓.</p>
        focus: [1, 1, 1]
        say: "Kiểm tra thứ nhất, đếm bit thay vì byte. Mỗi điểm ảnh có 3 nhân 8, bằng 24 bit, nên một khung có 49 triệu 766 nghìn 400 bit. Chia cho 8 được đúng 6 triệu 220 nghìn 800 byte, khớp kết quả cũ."
      - show: |
          <p><b>Đường khác 2 — hỏi chính máy.</b> Tạo một mảng số nguyên 8 bit hình dạng (1080, 1920, 3) rồi hỏi nó chiếm bao nhiêu byte:</p>
          <div class="code"><div>khung = np.zeros((1080, 1920, 3), dtype=np.uint8)</div><div>khung.nbytes    # 6220800</div></div>
        focus: [1, 2]
        say: "Kiểm tra thứ hai là hỏi chính máy, tạo một mảng số nguyên 8 bit có hình dạng 1080, 1920, 3, rồi hỏi nó chiếm bao nhiêu byte. Máy trả lời 6 triệu 220 nghìn 800, nghĩa là khớp với phép nhân của ta, vì mỗi số 8 bit chiếm đúng một byte."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "np.zeros((1080, 1920, 3)).shape[:2] == (1080, 1920)"
      - "int((np.array([200], dtype=np.uint8) + np.array([100], dtype=np.uint8))[0]) == 44 and (200 + 100) % 256 == 44 and min(255, 200 + 100) == 255"
      - "tuple(np.array([255, 128, 0])[::-1]) == (0, 128, 255)"
      - "round(((128 / 255 + 0.055) / 1.055) ** 2.4, 3) == 0.216 and round(255 * (1.055 * 0.5 ** (1 / 2.4) - 0.055)) == 188"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đảo hàng và cột <b class="red">(ảnh “1920 × 1080” là mảng (1080, 1920, 3))</b>
          <br><span class="note">Màn hình ghi rộng trước, mảng ghi hàng trước. Viết $I[100, 50]$ là hàng 100, cột 50 — không phải “x = 100”. Phép thử: in hình dạng mảng trước khi dùng.</span></div>
        focus: [1, 1, 1, 1]
        say: "Lỗi thứ nhất là đảo hàng và cột. Ảnh mà màn hình ghi là 1920 nhân 1080 lại là mảng hình dạng 1080, 1920, 3, vì màn hình ghi chiều rộng trước, còn mảng ghi hàng trước. Viết I tại 100, 50 là hàng 100, cột 50, không phải điểm có hoành độ 100. Phép thử là in hình dạng mảng trước khi dùng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cộng hai số 8 bit <b class="red">(200 + 100 thành 44)</b>
          <br><span class="note">Số 8 bit chỉ giữ tới 255, phần thừa bị “quay vòng”: $300 - 256 = 44$, điểm sáng hoá tối. Sửa: đổi sang kiểu lớn hơn rồi kẹp về 255.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ hai là cộng hai số 8 bit, ví dụ tăng sáng 200 thêm 100 lại ra 44. Số 8 bit chỉ giữ tới 255, phần thừa bị quay vòng, 300 trừ 256 bằng 44, nên điểm sáng hoá tối. Cách sửa là đổi sang kiểu số lớn hơn, cộng, rồi kẹp về 255."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đảo thứ tự kênh <b class="red">(cam hoá xanh)</b>
          <br><span class="note">Có thư viện đọc ảnh màu theo thứ tự lam, lục, đỏ (OpenCV: BGR). Điểm cam (255, 128, 0) đọc nhầm thứ tự thành (0, 128, 255): màu xanh lam. Phép thử: hiện một ảnh biết trước màu, ví dụ quả cam.</span></div>
        focus: [1, 1, 1, 1]
        say: "Lỗi thứ ba là đảo thứ tự kênh, khiến màu cam hoá xanh. Có thư viện xử lý ảnh nổi tiếng đọc ảnh màu theo thứ tự lam, lục, đỏ, ngược với thứ tự thường gặp. Điểm cam 255, 128, 0 bị đọc nhầm thành 0, 128, 255, tức màu xanh lam. Phép thử là hiện một ảnh đã biết trước màu, ví dụ một quả cam."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Lấy trung bình giá trị điểm ảnh như độ sáng <b class="red">(giá trị không tỉ lệ với ánh sáng)</b></div>
          <table class="t"><tr><th>giá trị điểm ảnh lưu trong tệp</th><th>tỉ lệ ánh sáng thật (đổi sang tuyến tính)</th></tr>
          <tr><td>128, “một nửa” của 255</td><td>chỉ khoảng 0,216 — chưa tới một phần tư</td></tr>
          <tr><td>khoảng 188</td><td>0,5 — mới đúng là nửa ánh sáng</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, lấy trung bình giá trị điểm ảnh như thể đó là độ sáng. Ảnh thường lưu theo một đường cong, nên giá trị 128 chỉ ứng với khoảng 0 phẩy 216 ánh sáng thật, chưa tới một phần tư. Muốn nửa ánh sáng thì giá trị lưu phải khoảng 188. Khi trộn ảnh, làm mờ hay đo độ sáng chính xác, hãy đổi sang giá trị tuyến tính trước, như khoá Đồ hoạ máy tính sẽ dạy kỹ."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: hai phép tính và một quyết định lưu trữ"
    checks:
      - "alg.cvi_frame_bytes(640, 480, 1) == 307_200"
      - "alg.cvi_frame_bytes(224, 224) == 150_528 and round(6_220_800 / 150_528, 1) == 41.3"
      - "alg.cvi_frame_bytes(3840, 2160) == 24_883_200 and alg.cvi_frame_bytes(3840, 2160) * 30 * 3600 == 2_687_385_600_000"
      - "round(2_687_385_600_000 / 1e12, 2) == 2.69 and round(10 ** 12 / (alg.cvi_frame_bytes(3840, 2160) * 30) / 60, 1) == 22.3"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ảnh xám 640 × 480, 8 bit. Bao nhiêu byte?</td></tr>
          <tr><td>2</td><td>Một mạng nhận dạng ảnh nhận ảnh màu 224 × 224, 8 bit. Bao nhiêu byte, và nhỏ hơn khung 1920 × 1080 bao nhiêu lần?</td></tr>
          <tr><td>3</td><td>Camera 3840 × 2160, 30 khung mỗi giây, cần lưu 1 giờ trên ổ 1 TB. Lưu thô được không? Bạn làm gì?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn. Câu một, ảnh xám 640 nhân 480, 8 bit, chiếm bao nhiêu byte? Câu hai, một mạng nhận dạng ảnh nhận ảnh màu 224 nhân 224, hỏi ảnh đó bao nhiêu byte, và nhỏ hơn khung 1920 nhân 1080 bao nhiêu lần? Câu ba, camera 3840 nhân 2160, 30 khung mỗi giây, cần lưu một giờ trên ổ một nghìn tỉ byte, lưu thô được không, và bạn làm gì? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Câu 1.</b> $C = 1$: $\frac{640 \cdot 480 \cdot 1 \cdot 8}{8} = \hlg{307\,200}$ byte.</p>
          <p><b>Câu 2.</b> $224 \cdot 224 \cdot 3 = \hlg{150\,528}$ byte; $\frac{6\,220\,800}{150\,528} \approx 41{,}3$ lần nhỏ hơn — vì thế ảnh phải được thu nhỏ trước khi vào mạng.</p>
        focus: [1, 2, 2]
        say: "Câu một, ảnh xám có một kênh, nên dung lượng là 640 nhân 480 nhân 1 nhân 8 chia 8, bằng 307 nghìn 200 byte. Câu hai, 224 nhân 224 nhân 3 bằng 150 nghìn 528 byte. Khung 1920 nhân 1080 lớn hơn khoảng 41 phẩy 3 lần, vì thế ảnh phải được thu nhỏ trước khi vào mạng."
      - show: |
          <p><b>Câu 3.</b> Một khung $3840 \cdot 2160 \cdot 3 = 24\,883\,200$ byte; một giờ $\approx 2{,}69$ nghìn tỉ byte — ổ 1 TB đầy sau khoảng 22 phút.</p>
          <table class="t"><tr><th>cách làm</th><th>được</th><th>mất</th></tr>
          <tr><td>nén video</td><td>nhỏ đi hàng chục lần</td><td>mất chi tiết nhỏ, tốn tính toán khi giải nén</td></tr>
          <tr><td>giảm khung mỗi giây hoặc độ phân giải</td><td>giảm thẳng theo tỉ lệ</td><td>có thể bỏ lỡ chuyển động nhanh, vật nhỏ</td></tr>
          <tr><td>chỉ lưu đoạn có chuyển động</td><td>bỏ hẳn giờ tĩnh</td><td>cần bộ phát hiện chuyển động đáng tin</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Câu ba, một khung là 24 triệu 883 nghìn 200 byte, nên một giờ khoảng 2 phẩy 69 nghìn tỉ byte. Ổ một nghìn tỉ byte đầy sau khoảng 22 phút, nên lưu thô là không được. Nén video làm dữ liệu nhỏ đi hàng chục lần, nhưng mất chi tiết nhỏ và tốn tính toán khi giải nén. Giảm số khung mỗi giây hay độ phân giải thì giảm thẳng theo tỉ lệ, nhưng có thể bỏ lỡ chuyển động nhanh và vật nhỏ. Chỉ lưu đoạn có chuyển động thì bỏ hẳn các giờ tĩnh, nhưng cần một bộ phát hiện chuyển động đáng tin."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ảnh = mảng H hàng, W cột, C kênh</span><span class="a">→</span>
          <span class="n">b bit cho 2 mũ b mức</span><span class="a">→</span>
          <span class="n">dung lượng $= \frac{W \cdot H \cdot C \cdot b}{8}$</span><span class="a">→</span>
          <span class="n">1920 × 1080: 6 220 800 byte</span><span class="a">→</span>
          <span class="n">30 khung: 186,6 triệu byte mỗi giây</span></div>
        say: "Tổng kết lại, ảnh là một mảng có H hàng, W cột và C kênh. Mỗi số b bit cho 2 mũ b mức, nên dung lượng bằng W nhân H nhân C nhân b chia 8. Một khung 1920 nhân 1080 là 6 triệu 220 nghìn 800 byte, và 30 khung mỗi giây là khoảng 186 phẩy 6 triệu byte."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi viết một dòng xử lý ảnh, hãy <b>in hình dạng, kiểu số và thứ tự kênh</b> của mảng, và nhẩm dung lượng — phần lớn lỗi ảnh là lỗi dữ liệu, không phải lỗi thuật toán.</div>
        say: "Điều cần mang theo, trước khi viết một dòng xử lý ảnh, hãy in hình dạng, kiểu số và thứ tự kênh của mảng, và nhẩm trước dung lượng. Phần lớn lỗi ảnh là lỗi dữ liệu, không phải lỗi thuật toán."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>lọc ảnh</b> — trượt một ô nhỏ 3 × 3 trên ảnh để làm mờ, và để tìm cạnh của vật.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học lọc ảnh, tức trượt một ô nhỏ 3 nhân 3 trên ảnh để làm mờ, và để tìm cạnh của vật. Hẹn gặp bạn ở bài tiếp theo."
