id: L00
course: CVI
series: "CVI · Thị giác máy tính"
title: "Bài 0 — Ảnh số: điểm ảnh, kênh màu, độ sâu bit và dung lượng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cvi.yaml L00; audit/cvi/verify_cvi.py L00; audit/cvi/sources_L00.md; [OCV] OpenCV 4.x, imgcodecs.hpp (IMREAD_COLOR = ảnh 3 kênh thứ tự BGR); [W3C] CSS Color 4, conversions.js (hàm sRGB ↔ tuyến tính); CSA bài 0 (bit, byte, 2 mũ 8 = 256)"
assumes: []
# Quy ước (cả khoá): ảnh I có H hàng (chiều cao), W cột (chiều rộng), C kênh; điểm ảnh ở hàng v, cột u, kênh c viết I[v, u, c];
#   hàng đếm từ trên xuống, cột đếm từ trái sang, bắt đầu từ 0. b = số bit mỗi kênh; 8 bit → 256 mức 0 … 255.
#   Dung lượng chưa nén = H · W · C · b / 8 byte (alg.cvi_frame_bytes). 1 MiB = 2 mũ 20 = 1 048 576 byte (chỉ trên màn hình; lời đọc nói
#   “đơn vị hai mũ hai mươi byte”). Kích thước “1920 × 1080” là rộng × cao (cách ghi của màn hình), mảng trong máy có hình dạng (1080, 1920, 3).
#   Camera giám sát, ổ đĩa 1 TB, camera 4K trong câu tự làm là SỐ MINH HOẠ. Lời đọc không nói tên thư viện (chỉ trên màn hình).
objectives:
  - "Đọc một ảnh màu như một mảng số ba chiều: hàng, cột, kênh"
  - "Tính số mức của một kênh từ số bit: 2 mũ b"
  - "Tính dung lượng một khung và một giây video chưa nén"
  - "Nhận ra ba lỗi dữ liệu ảnh: đảo hàng–cột, tràn số 8 bit, đảo thứ tự kênh"
