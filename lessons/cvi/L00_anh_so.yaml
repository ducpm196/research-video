scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một camera, một ổ 1 TB, chưa tới một tiếng rưỡi"
    checks:
      - "alg.cvi_frame_bytes(1920, 1080) * 30 * 3600 == 671_846_400_000"
      - "round(10 ** 12 / (alg.cvi_frame_bytes(1920, 1080) * 30) / 60) == 89"
    steps:
      - show: |
          <p>Một camera giám sát ghi hình <b>1920 × 1080</b> điểm ảnh, <b>30 khung mỗi giây</b>. Nếu lưu thẳng từng điểm ảnh, không nén, một giờ chiếm khoảng <b>672 tỉ byte</b>.</p>
          <p>Một ổ đĩa 1 TB, tức một nghìn tỉ byte, đầy sau khoảng <b>89 phút</b>.</p>
          <div class="box key">Hôm nay: ảnh trong máy là gì? Vì sao nó lớn như vậy? Và tính dung lượng thế nào cho đúng?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, một camera giám sát ghi hình 1920 nhân 1080 điểm ảnh, 30 khung mỗi giây. Nếu lưu thẳng từng điểm ảnh mà không nén, một giờ chiếm khoảng 672 tỉ byte. Một ổ đĩa một nghìn tỉ byte sẽ đầy sau khoảng 89 phút. Hôm nay ta trả lời ba câu hỏi, ảnh trong máy là gì, vì sao nó lớn như vậy, và tính dung lượng thế nào cho đúng."
      - clear: true
        show: |
          <table class="t"><tr><th>chặng của khoá</th><th>các bài</th><th>trả lời câu hỏi</th></tr>
          <tr><td>ảnh và lọc cổ điển</td><td>bài 0–2</td><td>ảnh là mảng số; làm mờ, tìm cạnh; tách vật khỏi nền bằng ngưỡng</td></tr>
          <tr><td>hình học</td><td>bài 3–6</td><td>camera chiếu thế giới lên ảnh; khớp điểm giữa hai ảnh; bỏ khớp sai; đo độ sâu bằng hai camera</td></tr>
          <tr><td>học sâu cho ảnh</td><td>bài 7–9</td><td>phân loại bằng mạng tích chập học sẵn; tìm vật bằng hộp; tô từng điểm ảnh</td></tr>
          <tr><td>độ bền</td><td>bài 10–11</td><td>ảnh thật khác ảnh huấn luyện; mô hình đúng vì lý do sai</td></tr>
          <tr><td>hành trình</td><td>bài 12</td><td>cuộc thi nhận dạng một triệu ảnh, từ 28% lỗi năm 2010 tới sau năm 2017</td></tr></table>
        forward_ref: true
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng là bản đồ của khoá học. Bài 0 tới bài 2 coi ảnh là mảng số, rồi làm mờ, tìm cạnh và tách vật khỏi nền bằng một ngưỡng. Bài 3 tới bài 6 là hình học, camera chiếu thế giới lên ảnh ra sao, khớp điểm giữa hai ảnh, bỏ khớp sai, và đo độ sâu bằng hai camera. Bài 7 tới bài 9 là học sâu, phân loại bằng mạng tích chập học sẵn, tìm vật bằng hộp, và tô từng điểm ảnh. Bài 10 và bài 11 hỏi mô hình có bền không khi ảnh thật khác ảnh huấn luyện. Bài 12 kể hành trình của cuộc thi nhận dạng một triệu ảnh, từ 28 phần trăm lỗi năm 2010 tới sau năm 2017."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "2 ** 1 == 2 and 2 ** 2 == 4 and 2 ** 8 == 256 and 2 ** 8 - 1 == 255"
      - "2 ** 10 == 1024 and 2 ** 20 == 1_048_576 and 1024 * 1024 == 2 ** 20"
      - "np.zeros((4, 6, 3)).shape[0] == 4 and np.zeros((4, 6, 3)).size == 72 and 4 * 6 * 3 == 72"
    steps:
      - show: |
          <p><b>① Bit và byte</b> (khoá Hệ thống máy tính): một bit có 2 giá trị, 0 hoặc 1. Tám bit là một byte. Với $b$ bit ta viết được $2^b$ số khác nhau:</p>
          $$2^1 = 2, \quad 2^2 = 4, \quad 2^8 = 256 \text{ số, từ } 0 \text{ tới } 255$$
        introduces: [power, arith]
        focus: [1, 1, 2]
        say: "Điều thứ nhất là bit và byte, như ở khoá Hệ thống máy tính, một bit có hai giá trị là 0 hoặc 1, và tám bit là một byte. Với b bit ta viết được 2 mũ b số khác nhau. Vì vậy 1 bit cho 2 số, 2 bit cho 4 số, còn 8 bit cho 256 số, từ 0 tới 255."
      - show: |
          <p><b>② Lũy thừa của 2 dùng cho dung lượng:</b> $2^{10} = 1024$ và $2^{20} = 1024 \cdot 1024 = 1\,048\,576$. Đơn vị MiB bằng đúng $2^{20}$ byte, hơi lớn hơn một triệu byte.</p>
        introduces: [cdot]
        focus: [1, 1, 1]
        say: "Điều thứ hai là lũy thừa của 2 dùng cho dung lượng. 2 mũ 10 bằng 1024, và 2 mũ 20 bằng 1024 nhân 1024, tức 1 triệu 48 nghìn 576, với dấu chấm giữa là phép nhân. Đơn vị hai mũ hai mươi byte vì thế hơi lớn hơn một triệu byte."
      - show: |
          <p><b>③ Mảng nhiều chiều:</b> một bảng 4 hàng, 6 cột là mảng hai chiều có $4 \cdot 6 = 24$ ô. Mỗi ô chứa thêm 3 số thì thành mảng ba chiều, hình dạng (4, 6, 3), có $4 \cdot 6 \cdot 3 = 72$ số. Chỉ số luôn đếm từ 0.</p>
        focus: [1, 1, 1, 1]
        say: "Điều thứ ba là mảng nhiều chiều. Một bảng 4 hàng và 6 cột là mảng hai chiều có 24 ô. Nếu mỗi ô chứa thêm 3 số, ta được mảng ba chiều có hình dạng 4, 6, 3, tổng cộng 72 số. Chỉ số của hàng, cột và số trong ô luôn đếm từ 0."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: H, W, C, b và I[v, u, c]"
    checks:
      - "np.zeros((1080, 1920, 3), dtype=np.uint8).shape == (1080, 1920, 3) and np.iinfo(np.uint8).max == 255"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>khung 1920 × 1080</th></tr>
          <tr><td>$H$</td><td>chiều cao: số hàng điểm ảnh</td><td>1080</td></tr>
          <tr><td>$W$</td><td>chiều rộng: số cột điểm ảnh</td><td>1920</td></tr>
          <tr><td>$C$</td><td>số kênh màu (ảnh xám 1, ảnh màu 3: đỏ, lục, lam)</td><td>3</td></tr>
          <tr><td>$b$</td><td>số bit mỗi kênh</td><td>8, tức mỗi số từ 0 tới 255</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu bốn ký hiệu. H là chiều cao, tức số hàng điểm ảnh, ở đây 1080. W là chiều rộng, tức số cột điểm ảnh, ở đây 1920. C là số kênh màu, ảnh xám có 1 kênh, ảnh màu có 3 kênh là đỏ, lục và lam. Còn b là số bit mỗi kênh, thường là 8, tức mỗi số từ 0 tới 255."
      - clear: true
        show: |
          <p>Giá trị một điểm ảnh viết $I[v, u, c]$: hàng $v$ (đếm từ trên xuống), cột $u$ (đếm từ trái sang), kênh $c$. <b>Hàng đứng trước cột.</b></p>
          <p>Ví dụ: $I[1, 4, 0] = 255$ nghĩa là ở hàng 1, cột 4, kênh đỏ (kênh số 0) có giá trị 255. Cả khung là một mảng hình dạng (1080, 1920, 3).</p>
        introduces: [sub]
        focus: [1, 1, 2, 2]
        say: "Giá trị của một điểm ảnh viết là I với ba chỉ số trong ngoặc vuông, hàng v đếm từ trên xuống, cột u đếm từ trái sang, và kênh c. Hãy nhớ hàng đứng trước cột. Ví dụ, I tại 1, 4, 0 bằng 255 nghĩa là ở hàng 1, cột 4, kênh đỏ có giá trị 255. Cả khung là một mảng hình dạng 1080, 1920, 3, tức chiều cao viết trước."

