scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ 28,2% lỗi xuống 2,251% — rồi bộ thử mới làm tụt 11 điểm"
    checks:
      - "round(28.2 / 2.251, 1) == 12.5"
      - "83 - 72 == 11"
    steps:
      - show: |
          <p>Năm 2010, đội thắng cuộc thi nhận dạng ảnh ImageNet sai <b>28,2%</b> (lỗi năm đáp án). Năm 2017, đội thắng chỉ sai <b>2,251%</b> — ít hơn khoảng 12,5 lần.</p>
          <p>Năm 2019, một nhóm dựng lại bộ thử <b>theo đúng quy trình cũ</b>. Mô hình tốt nhất tụt từ <b>83%</b> xuống <b>72%</b> độ chính xác.</p>
          <div class="box key">Hôm nay: sáu chặng từ 2010 tới 2020 — mỗi chặng vướng ở đâu, xử lý ra sao, và vì sao càng về sau, câu hỏi lớn nhất lại là <b>đo cho đúng</b>.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, năm 2010, đội thắng cuộc thi nhận dạng ảnh ImageNet sai 28 phẩy 2 phần trăm theo cách tính năm đáp án. Năm 2017, đội thắng chỉ sai 2 phẩy 251 phần trăm, ít hơn khoảng 12 phẩy 5 lần. Năm 2019, một nhóm nghiên cứu dựng lại bộ thử theo đúng quy trình cũ. Mô hình tốt nhất tụt từ 83 xuống 72 phần trăm độ chính xác. Hôm nay ta đi qua sáu chặng từ 2010 tới 2020, xem mỗi chặng vướng ở đâu, xử lý ra sao, và vì sao càng về sau, câu hỏi lớn nhất lại là đo cho đúng."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "alg.cvi_receptive_field([(3, 1), (3, 1)]) == 5 and 3 * 3 * 2 * 4 == 72"
      - "alg.cvi_seg7_transform(2, 'flip') == 5"
      - "round(0.5 * 0.95 + 0.5 * 0.5, 3) == 0.725"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 1</td><td><b>trượt bộ lọc</b>: mỗi điểm ra là tổng của tích trên một ô 3 × 3</td><td>cạnh dọc: $10 + 20 + 10 = 40$</td></tr>
          <tr><td>bài 7</td><td><b>trường tiếp nhận</b>: hai lớp 3 × 3 chồng nhau nhìn được ô 5 × 5; một lớp 3 × 3 từ $C$ kênh ra $C'$ kênh có $3 \cdot 3 \cdot C \cdot C'$ trọng số</td><td>$C = 2$, $C' = 4$: 72</td></tr>
          <tr><td>bài 7</td><td><b>tăng cường giữ nhãn</b> và <b>học chuyển giao</b>: dùng lại mạng đã học trên tập lớn</td><td>lật ngang chữ số 2 thành 5: phá nhãn</td></tr>
          <tr><td>bài 10–11</td><td><b>đo theo lát</b>: con số chung trên bộ thử cũ che mất điều kiện mới; mô hình có thể đúng vì lý do sai</td><td>nửa ban ngày 95%, nửa ban đêm 50%: 72,5%</td></tr></table>
        introduces: [cdot, prime]
        focus: [0, "1.2", "1.3", "1.3", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều. Ở bài 1, mỗi điểm ra của bộ lọc là tổng các tích trên một ô 3 nhân 3, như cạnh dọc cho 40. Ở bài 7, hai lớp 3 nhân 3 chồng nhau nhìn được ô 5 nhân 5. Một lớp 3 nhân 3 từ C kênh ra C phẩy kênh có 3 nhân 3 nhân C nhân C phẩy trọng số. Cũng ở bài 7, tăng cường dữ liệu phải giữ nhãn, và học chuyển giao là dùng lại mạng đã học trên tập lớn. Ở bài 10 và 11, con số chung trên bộ thử cũ có thể che mất điều kiện mới, như nửa ban ngày 95 và nửa ban đêm 50 phần trăm cho 72 phẩy 5 phần trăm."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình: lỗi năm đáp án, giảm tương đối, bộ thử giữ kín"
    checks:
      - "round((25.8 - 16.4) / 25.8 * 100) == 36"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>lỗi năm đáp án</b></td><td>mô hình đưa ra 5 đoán; ảnh tính là đúng nếu nhãn thật nằm trong 5 đoán đó. Cuộc thi xếp hạng bằng con số này.</td></tr>
          <tr><td><b>giảm tương đối</b></td><td>$\dfrac{\text{cũ} - \text{mới}}{\text{cũ}}$ — giảm bao nhiêu phần của mức cũ</td></tr>
          <tr><td><b>bộ thử giữ kín</b></td><td>ảnh thử không công bố nhãn; các đội gửi đoán, ban tổ chức chấm</td></tr></table>
          <p class="note">Làm thử: từ 25,8% xuống 16,4% là giảm $\frac{25{,}8 - 16{,}4}{25{,}8} \approx 36\%$ của mức cũ, dù chỉ giảm 9,4 điểm phần trăm.</p>
        introduces: [frac]
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Bài dùng ba thuật ngữ. Lỗi năm đáp án nghĩa là mô hình đưa ra 5 đoán, và một ảnh tính là đúng nếu nhãn thật nằm trong 5 đoán đó, cuộc thi xếp hạng bằng con số này. Giảm tương đối là mức cũ trừ mức mới, chia cho mức cũ, tức giảm bao nhiêu phần của mức cũ. Bộ thử giữ kín là ảnh thử không công bố nhãn, các đội gửi đoán và ban tổ chức chấm. Làm thử, từ 25 phẩy 8 xuống 16 phẩy 4 phần trăm là giảm khoảng 36 phần trăm của mức cũ, dù chỉ giảm 9 phẩy 4 điểm phần trăm."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Sáu năm, sáu cột: lỗi của đội thắng cuộc mỗi năm"
    checks:
      - "[round(380 - 10 * e) for e in (28.2, 25.8, 16.4, 6.7, 3.57, 2.251)] == [98, 122, 216, 313, 344, 357] and round(380 - 10 * 5.1) == 329"
    steps:
      - show: |
          <div><svg width="1500" height="460" viewBox="0 0 1500 460">
          <text x="640" y="40" font-size="23" fill="#1f2937" text-anchor="middle">lỗi năm đáp án của đội thắng mỗi năm (%)</text>
          <line x1="90" y1="380" x2="1160" y2="380" stroke="#1f2937" stroke-width="2"/>
          <g stroke="#1f2937" stroke-width="1">
          <rect x="105" y="98" width="90" height="282" fill="#9ca3af"/><rect x="285" y="122" width="90" height="258" fill="#9ca3af"/>
          <rect x="465" y="216" width="90" height="164" fill="#2a78d6"/><rect x="645" y="313" width="90" height="67" fill="#2a78d6"/>
          <rect x="825" y="344" width="90" height="36" fill="#7c3aed"/><rect x="1005" y="357" width="90" height="23" fill="#059669"/></g>
          <line x1="90" y1="329" x2="1160" y2="329" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="10 6"/>
          <text x="1180" y="336" font-size="22" fill="#dc2626">một người chú thích: 5,1%</text>
          <g font-size="22" fill="#1f2937" text-anchor="middle">
          <text x="150" y="88">28,2</text><text x="330" y="112">25,8</text><text x="510" y="206">16,4</text><text x="690" y="303">6,7</text><text x="870" y="300">3,57</text><text x="1050" y="300">2,251</text>
          <text x="150" y="410">2010</text><text x="330" y="410">2011</text><text x="510" y="410">2012</text><text x="690" y="410">2014</text><text x="870" y="410">2015</text><text x="1050" y="410">2017</text></g>
          <g font-size="20" fill="#6b7280" text-anchor="middle"><text x="240" y="442">xám: đặc trưng thiết kế tay</text><text x="780" y="442">màu: mạng tích chập học từ điểm ảnh</text></g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là sáu cột, mỗi cột là lỗi năm đáp án của đội thắng trong một năm. Hai cột xám năm 2010 và 2011 dùng đặc trưng do người thiết kế, sai 28 phẩy 2 và 25 phẩy 8 phần trăm. Từ năm 2012, các cột màu là mạng tích chập học thẳng từ điểm ảnh, lỗi giảm còn 16 phẩy 4, rồi 6 phẩy 7, rồi 3 phẩy 57, rồi 2 phẩy 251. Đường đứt nét đỏ là 5 phẩy 1 phần trăm, lỗi ước lượng của một người chú thích đã luyện tập, và ta sẽ xem con số đó cần đọc cẩn thận thế nào."

  # ───────────────────────── 5. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2010 — khai sinh: một triệu ảnh, nhãn do nhiều người bầu"
    stage: {year: "2010", scale: "1000 lớp; 1 261 406 ảnh huấn luyện, 50 000 ảnh kiểm định, 150 000 ảnh thử (2010); đội thắng sai 28,2% với đặc trưng điểm thiết kế tay được mã hoá", source: "[RU15]", practice: "nhiều người gán nhãn độc lập cùng một ảnh, số phiếu cần đạt tuỳ độ khó của lớp; kiểm lại một mẫu ngẫu nhiên để đo độ đúng của nhãn"}
    checks:
      - "round(0.282 * 150_000) == 42_300"
      - "round(5 / 1500 * 100, 2) == 0.33 and round(100 - 99.7, 1) == 0.3"
    steps:
      - show: |
          <p><b>Quy mô:</b> <b>1000 lớp</b>; 1&nbsp;261&nbsp;406 ảnh huấn luyện, 50&nbsp;000 ảnh kiểm định, <b>150&nbsp;000 ảnh thử</b>. Ảnh lấy từ máy tìm kiếm, mỗi lớp tìm bằng nhiều từ đồng nghĩa và dịch sang nhiều thứ tiếng.</p>
          <p><b>Điểm nghẽn:</b> “người dùng mắc lỗi” và “không phải lúc nào cũng đồng ý với nhau”, nhất là với lớp khó như giống mèo.</p>
          <p><b>Cách xử lý:</b> nhiều người gán nhãn <b>độc lập</b> cùng một ảnh; ảnh chỉ được nhận khi đa số thuyết phục. Mỗi lớp cho ít nhất 10 người bầu trên một mẫu đầu để biết cần bao nhiêu phiếu.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Ở chặng một, năm 2010, cuộc thi có 1000 lớp, khoảng 1 triệu 261 nghìn ảnh huấn luyện, 50 nghìn ảnh kiểm định và 150 nghìn ảnh thử. Ảnh lấy từ máy tìm kiếm, mỗi lớp tìm bằng nhiều từ đồng nghĩa và dịch sang nhiều thứ tiếng. Điểm nghẽn được nhóm tác giả ghi rõ, người gán nhãn mắc lỗi và không phải lúc nào cũng đồng ý với nhau, nhất là với lớp khó như các giống mèo. Cách xử lý là cho nhiều người gán nhãn độc lập cùng một ảnh, và ảnh chỉ được nhận khi có đa số thuyết phục. Mỗi lớp cho ít nhất 10 người bầu trên một mẫu đầu, để biết lớp đó cần bao nhiêu phiếu."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. đội thắng 2010 sai 28,2% trên bộ thử</td><td>$0{,}282 \cdot 150\,000$</td><td>$\hl{42\,300}$ ảnh sai</td></tr>
          <tr><td>Bước 2. kiểm lại 1500 ảnh thử, thấy 5 nhãn sai</td><td>$\frac{5}{1500}$</td><td>$\approx 0{,}33\%$ — khớp độ đúng 99,7% nhóm tác giả đo</td></tr></table>
          <p class="note">Thực hành: đo độ đúng của <b>chính nhãn</b> bằng một mẫu ngẫu nhiên. Điều kiện: mẫu phải rút ngẫu nhiên, không chọn ảnh “dễ”.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Bảng tính lại hai con số. Bước một, sai 28 phẩy 2 phần trăm trên 150 nghìn ảnh thử là 42 nghìn 300 ảnh sai. Bước hai, nhóm tác giả kiểm lại bằng tay 1500 ảnh thử và thấy 5 nhãn sai, tức khoảng 0 phẩy 33 phần trăm, khớp độ đúng 99 phẩy 7 phần trăm họ đo. Thực hành rút ra là đo độ đúng của chính nhãn bằng một mẫu rút ngẫu nhiên, không chọn những ảnh dễ."

  # ───────────────────────── 6. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2012 — tăng trưởng: 60 triệu tham số, chống học vẹt"
    stage: {year: "2012", scale: "mạng tích chập 60 triệu tham số trên khoảng 1,2 triệu ảnh; 5 mạng gộp sai 16,4%, thêm học trước trên tập lớn hơn sai 15,3%; đội nhì 26,2%", source: "[KR12] [RU15]", practice: "khi mô hình lớn hơn nhiều so với dữ liệu: tăng cường bằng phép biến đổi giữ nhãn (cắt dời, lật ngang) và bỏ ngẫu nhiên nơ-ron khi học; điều kiện: phép biến đổi không được đổi nhãn"}
    checks:
      - "(256 - 224) ** 2 * 2 == 2048"
      - "round((25.8 - 16.4) / 25.8 * 100) == 36 and round(26.2 - 15.3, 1) == 10.9"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> “kích thước mạng làm học vẹt thành vấn đề đáng kể” — 60 triệu tham số mà chỉ khoảng 1,2 triệu ảnh có nhãn.</p>
          <p><b>Cách xử lý 1 — tăng cường giữ nhãn:</b> cắt ngẫu nhiên ô 224 × 224 từ ảnh 256 × 256 và lật ngang. Nhóm tác giả ghi phép này làm tập huấn luyện lớn lên <b>2048 lần</b>, “dù các mẫu tất nhiên phụ thuộc nhau”.</p>
          <p><b>Cách xử lý 2:</b> bỏ ngẫu nhiên một số nơ-ron mỗi lần học ở hai tầng nối đầy đủ; không có nó, mạng “học vẹt đáng kể”.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Ở chặng hai, năm 2012, nhóm tác giả ghi rằng kích thước mạng làm học vẹt thành vấn đề đáng kể. Mạng có 60 triệu tham số, mà chỉ có khoảng 1 phẩy 2 triệu ảnh có nhãn. Cách xử lý thứ nhất là tăng cường giữ nhãn, cắt ngẫu nhiên một ô 224 nhân 224 từ ảnh 256 nhân 256, và lật ngang. Họ ghi rằng phép này làm tập huấn luyện lớn lên 2048 lần, dù các mẫu tất nhiên phụ thuộc lẫn nhau. Cách xử lý thứ hai là bỏ ngẫu nhiên một số nơ-ron mỗi lần học ở hai tầng nối đầy đủ, vì không có nó mạng học vẹt đáng kể."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. số vị trí dời theo mỗi chiều</td><td>$256 - 224$</td><td>32</td></tr>
          <tr><td>Bước 2. dời hai chiều, nhân 2 khi lật ngang</td><td>$32 \cdot 32 \cdot 2$</td><td>$\hlb{2048}$ — đúng hệ số nhóm tác giả ghi</td></tr>
          <tr><td>Bước 3. so với đội thắng năm 2011 (25,8%)</td><td>$\frac{25{,}8 - 16{,}4}{25{,}8}$</td><td>$\approx \hlg{36\%}$ giảm tương đối</td></tr></table>
          <p class="note">Năm mạng gộp lại sai 16,4%; thêm hai mạng học trước trên tập 15 triệu ảnh thì 15,3%, trong khi đội nhì 26,2%. Thực hành: tăng cường giữ nhãn — lật ngang ảnh con mèo vẫn là mèo, nhưng như ở bài 7, lật chữ số 2 lại thành 5.</p>
        focus: [0, "1.2", "1.3", "1.4", 2, 2]
        say: "Bảng tính lại. Bước một, mỗi chiều dời được 256 trừ 224, tức 32 vị trí. Bước hai, dời hai chiều rồi nhân 2 khi lật ngang, 32 nhân 32 nhân 2 bằng 2048, đúng hệ số nhóm tác giả ghi. Bước ba, so với đội thắng năm 2011 sai 25 phẩy 8 phần trăm, mức 16 phẩy 4 là giảm tương đối khoảng 36 phần trăm. Năm mạng gộp lại sai 16 phẩy 4, thêm hai mạng học trước trên tập 15 triệu ảnh thì 15 phẩy 3, trong khi đội nhì sai 26 phẩy 2 phần trăm. Thực hành là tăng cường giữ nhãn, lật ngang ảnh con mèo vẫn là mèo, nhưng như ở bài 7, lật chữ số 2 lại thành 5."

  # ───────────────────────── 7. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2014 — đi sâu: chồng bộ lọc 3 × 3; người làm được bao nhiêu"
    stage: {year: "2014", scale: "mạng tới 19 tầng trọng số toàn bộ lọc 3 × 3 (6,8%); mạng 22 tầng thắng cuộc với 6,67%; một người chú thích đã luyện sai 5,1% trên 1500 ảnh thử", source: "[SI14] [SZ14] [RU15]", practice: "thay một bộ lọc lớn bằng chồng bộ lọc nhỏ: cùng trường tiếp nhận, ít tham số hơn, thêm phi tuyến; khi so với người, ghi rõ người nào, bao nhiêu ảnh, luyện bao lâu"}
    checks:
      - "alg.cvi_receptive_field([(3, 1)] * 3) == 7 and 3 * 3 ** 2 == 27 and 7 ** 2 == 49 and round((49 / 27 - 1) * 100) == 81"
      - "round(0.051 * 1500) == 76 and round(0.068 * 1500) == 102 and 1500 / 60 == 25"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><g stroke="#1f2937" stroke-width="2">
          <rect x="670" y="40" width="60" height="50" fill="#059669"/>
          <rect x="610" y="120" width="60" height="50" fill="#d1fae5"/><rect x="670" y="120" width="60" height="50" fill="#d1fae5"/><rect x="730" y="120" width="60" height="50" fill="#d1fae5"/>
          <rect x="550" y="200" width="60" height="50" fill="#dbeafe"/><rect x="610" y="200" width="60" height="50" fill="#dbeafe"/><rect x="670" y="200" width="60" height="50" fill="#dbeafe"/><rect x="730" y="200" width="60" height="50" fill="#dbeafe"/><rect x="790" y="200" width="60" height="50" fill="#dbeafe"/>
          <rect x="490" y="280" width="60" height="50" fill="#f3f4f6"/><rect x="550" y="280" width="60" height="50" fill="#f3f4f6"/><rect x="610" y="280" width="60" height="50" fill="#f3f4f6"/><rect x="670" y="280" width="60" height="50" fill="#f3f4f6"/><rect x="730" y="280" width="60" height="50" fill="#f3f4f6"/><rect x="790" y="280" width="60" height="50" fill="#f3f4f6"/><rect x="850" y="280" width="60" height="50" fill="#f3f4f6"/></g>
          <g font-size="22" fill="#1f2937" text-anchor="end"><text x="460" y="72">đầu ra lớp 3: 1 điểm</text><text x="460" y="152">đầu ra lớp 2: 3 ô</text><text x="460" y="232">đầu ra lớp 1: 5 ô</text><text x="460" y="312">ảnh vào: 7 ô</text></g>
          <g font-size="22" fill="#1f2937"><text x="950" y="140">ba lớp 3 × 3: trường tiếp nhận 7 × 7</text><text x="950" y="180">tham số 27 C bình phương</text><text x="950" y="220">một lớp 7 × 7: 49 C bình phương</text><text x="950" y="260" fill="#dc2626">nhiều hơn 81%</text></g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Ở chặng ba, năm 2014, một nhóm dùng toàn bộ lọc 3 nhân 3 và đi tới 19 tầng trọng số. Hình cho thấy vì sao, mỗi lớp 3 nhân 3 nới tầm nhìn thêm một ô mỗi phía, nên ba lớp chồng nhau cho một điểm nhìn được 7 ô, tức trường tiếp nhận 7 nhân 7. Với C kênh vào và C kênh ra, ba lớp đó có 3 nhân 9, tức 27 C bình phương trọng số, còn một lớp 7 nhân 7 cần 49 C bình phương, nhiều hơn 81 phần trăm. Nhóm tác giả còn ghi một lợi ích nữa, ba lớp có ba hàm phi tuyến thay vì một, nên mạng phân biệt tốt hơn."
      - clear: true
        show: |
          <p>Cùng năm, một mạng <b>22 tầng</b> thắng với <b>6,67%</b>. Nhóm tổ chức cho hai người luyện tập rồi tự làm bài thi. Người thứ nhất luyện trên 500 ảnh, làm <b>1500 ảnh thử</b>, khoảng 1 ảnh mỗi phút.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. người sai 5,1% trên 1500 ảnh</td><td>$0{,}051 \cdot 1500$</td><td>khoảng 76 ảnh</td></tr>
          <tr><td>Bước 2. mạng 22 tầng sai 6,8% trên cùng 1500 ảnh</td><td>$0{,}068 \cdot 1500$</td><td>102 ảnh</td></tr>
          <tr><td>Bước 3. thời gian người làm</td><td>$\frac{1500}{60}$</td><td>khoảng <b>25 giờ</b> chú thích</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4"]
        say: "Cùng năm, một mạng 22 tầng thắng cuộc với lỗi 6 phẩy 67 phần trăm. Nhóm tổ chức cho hai người luyện tập rồi tự làm bài thi. Người thứ nhất luyện trên 500 ảnh rồi làm 1500 ảnh thử, nhịp trung bình khoảng 1 ảnh mỗi phút. Bước một, người đó sai 5 phẩy 1 phần trăm, tức khoảng 76 ảnh. Bước hai, mạng 22 tầng sai 6 phẩy 8 phần trăm trên cùng 1500 ảnh, tức 102 ảnh. Bước ba, 1500 ảnh với nhịp 1 ảnh mỗi phút là khoảng 25 giờ chú thích."

  # ───────────────────────── 8. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2015 — quy mô lớn: 152 tầng và lối tắt qua tầng"
    stage: {year: "2015", scale: "mạng có lối tắt sâu tới 152 tầng, gấp 8 lần mạng 19 tầng mà ít tính toán hơn; gộp các mạng sai 3,57%, thắng năm 2015", source: "[HE15]", practice: "khi thêm tầng làm lỗi HUẤN LUYỆN tăng (không phải học vẹt), cho mỗi khối học phần dư cộng vào lối tắt; phân biệt lỗi huấn luyện với lỗi thử trước khi chọn cách sửa"}
    checks:
      - "152 // 19 == 8 and 152 / 19 == 8.0"
      - "3.57 < 5.1 and round(3.57 * 1000) == 3570"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> khi tăng số tầng, “độ chính xác bão hoà rồi giảm nhanh”. Bất ngờ là việc giảm này “không do học vẹt”: thêm tầng làm <b>lỗi huấn luyện</b> cao hơn.</p>
          <p><b>Cách xử lý:</b> mỗi khối học phần <b>dư</b> rồi cộng với chính đầu vào qua một <b>lối tắt</b>. Khối nào không cần thì học phần dư gần 0, và đầu ra gần bằng đầu vào.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. độ sâu so với mạng 19 tầng</td><td>$\frac{152}{19}$</td><td>đúng 8 lần, như nhóm tác giả ghi</td></tr>
          <tr><td>Bước 2. lỗi 3,57% trên 100&nbsp;000 ảnh thử</td><td>$0{,}0357 \cdot 100\,000$</td><td>3570 ảnh sai</td></tr></table>
        focus: [1, 1, 2, 2, "3.2", "3.3"]
        say: "Ở chặng bốn, năm 2015, điểm nghẽn là khi tăng số tầng, độ chính xác bão hoà rồi giảm nhanh. Điều bất ngờ là nhóm tác giả ghi việc giảm này không do học vẹt, vì thêm tầng làm chính lỗi huấn luyện cao hơn. Cách xử lý là cho mỗi khối học phần dư, rồi cộng với chính đầu vào qua một lối tắt. Khối nào không cần thì chỉ việc học phần dư gần 0, và đầu ra gần bằng đầu vào. Bước một, 152 tầng chia 19 tầng là đúng 8 lần, như nhóm tác giả ghi. Bước hai, lỗi 3 phẩy 57 phần trăm trên 100 nghìn ảnh thử là 3570 ảnh sai."
      - show: |
          <p class="note">Thực hành: trước khi chọn cách sửa, <b>nhìn lỗi huấn luyện</b>. Lỗi huấn luyện thấp mà lỗi thử cao là học vẹt (thêm dữ liệu, tăng cường, như chặng 2). Lỗi huấn luyện cũng cao là mạng khó học (đổi kiến trúc, như lối tắt).</p>
        say: "Thực hành rút ra là trước khi chọn cách sửa, hãy nhìn lỗi huấn luyện. Lỗi huấn luyện thấp mà lỗi thử cao là học vẹt, nên thêm dữ liệu hay tăng cường như chặng hai. Lỗi huấn luyện cũng cao là mạng khó học, nên phải đổi kiến trúc, như lối tắt."

  # ───────────────────────── 9. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2017 — ổn định: lỗi 2,251% và giới hạn của chính phép đo"
    stage: {year: "2017", scale: "mạng chỉnh trọng số từng kênh thắng năm 2017 với 2,251%, giảm tương đối khoảng 25% so với đội thắng năm 2016; bộ thử 100 000 ảnh giữ nguyên từ 2012", source: "[HU17] [RU15]", practice: "khi lỗi tiến gần tỉ lệ nhãn sai của bộ thử, mỗi phần nghìn cải thiện cần được kiểm lại bằng nhãn đã rà soát; ghi rõ khoảng tin cậy và số ảnh thử"}
    checks:
      - "round(2.251 / 0.75, 2) == 3.0"
      - "round(5 / 1500 * 100_000) == 333 and round(0.02251 * 100_000) == 2251 and round(333 / 2251 * 100) == 15"
    steps:
      - show: |
          <p><b>Quy mô:</b> bộ thử <b>100&nbsp;000 ảnh</b> giữ nguyên từ 2012, nên con số của các năm so được với nhau. Năm 2017, mạng chỉnh trọng số từng kênh thắng với <b>2,251%</b>, “cải thiện tương đối 25%” so với đội thắng năm 2016.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. lỗi của đội thắng 2016 (giảm 25% thì còn 75%)</td><td>$\frac{2{,}251}{0{,}75}$</td><td>khoảng 3,0%</td></tr>
          <tr><td>Bước 2. số ảnh còn sai năm 2017</td><td>$0{,}02251 \cdot 100\,000$</td><td>2251 ảnh</td></tr>
          <tr><td>Bước 3. nếu tỉ lệ nhãn sai 5 trên 1500 ở chặng 1 đúng cho cả bộ thử</td><td>$\frac{5}{1500} \cdot 100\,000$</td><td>khoảng $\hl{333}$ nhãn sai — chừng 15% của 2251</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.4"]
        say: "Ở chặng năm, năm 2017, bộ thử 100 nghìn ảnh đã giữ nguyên từ 2012, nên con số các năm so được với nhau. Một mạng chỉnh trọng số từng kênh thắng với 2 phẩy 251 phần trăm, mà nhóm tác giả ghi là cải thiện tương đối 25 phần trăm so với đội thắng năm 2016. Bước một, giảm 25 phần trăm thì còn 75 phần trăm, nên đội thắng 2016 sai khoảng 2 phẩy 251 chia 0 phẩy 75, xấp xỉ 3 phần trăm. Bước hai, năm 2017 còn 2251 ảnh sai. Bước ba là phép tính của riêng bài này. Nếu tỉ lệ nhãn sai 5 trên 1500 ở chặng một đúng cho cả bộ thử, thì có khoảng 333 nhãn sai, chừng 15 phần trăm số ảnh còn bị chấm là sai."
      - show: |
          <p class="note">Thực hành: khi lỗi tiến gần tỉ lệ nhãn sai, một phần nghìn cải thiện có thể chỉ là mô hình “đoán trúng” nhãn sai. Ghi số ảnh thử, khoảng tin cậy, và rà lại nhãn của các ảnh còn bị chấm sai.</p>
        say: "Thực hành rút ra là khi lỗi tiến gần tỉ lệ nhãn sai, một phần nghìn cải thiện có thể chỉ là mô hình đoán trúng nhãn sai. Hãy ghi số ảnh thử, khoảng tin cậy, và rà lại nhãn của các ảnh còn bị chấm sai."

  # ───────────────────────── 10. CHẶNG 6 ─────────────────────────
  - id: stage6
    kind: example
    title: "Chặng 6, năm 2019 tới 2020 — tiếp tục: bộ thử mới, học trước quy mô lớn"
    stage: {year: "2019", scale: "bộ thử mới dựng lại theo quy trình cũ: mọi mô hình tụt 11–14% trên ImageNet, mô hình tốt nhất 83% → 72%; năm 2020: mạng chia ảnh thành mảnh, học trước trên 14 triệu tới 300 triệu ảnh, đạt 88,55% trên ImageNet", source: "[RE19] [DO20]", practice: "đo lại trên dữ liệu mới thu theo cùng quy trình trước khi tin con số cũ; dùng mô hình học trước ở quy mô lớn rồi chuyển giao; điều kiện: tập nhỏ mà học từ đầu thì kiến trúc ít giả định về ảnh sẽ kém"}
    checks:
      - "83 - 72 == 11"
      - "300 / 14 > 21 and round(88.55 - 83, 2) == 5.55"
    steps:
      - show: |
          <p><b>2019 — đo lại:</b> một nhóm dựng bộ thử mới bằng đúng quy trình thu và lọc ảnh cũ. Mọi mô hình đều tụt <b>11% tới 14%</b>; mô hình tốt nhất từ 83% xuống 72%. Nhóm tác giả ghi: mức tụt “tương đương khoảng năm năm tiến bộ”.</p>
          <p>Điều đáng chú ý: thứ hạng giữ nguyên — mô hình hơn trên bộ thử cũ vẫn hơn trên bộ thử mới. Nguyên nhân họ nêu là các mô hình không tổng quát được sang ảnh “khó hơn một chút”, chứ không phải do các đội chỉnh mô hình theo bộ thử cũ.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Chặng sáu bắt đầu năm 2019, khi một nhóm dựng bộ thử mới bằng đúng quy trình thu và lọc ảnh cũ. Mọi mô hình đều tụt từ 11 tới 14 phần trăm, mô hình tốt nhất từ 83 xuống 72. Nhóm tác giả ghi rằng mức tụt đó tương đương khoảng năm năm tiến bộ. Điều đáng chú ý là thứ hạng giữ nguyên, mô hình hơn trên bộ thử cũ vẫn hơn trên bộ thử mới. Nguyên nhân họ nêu là các mô hình không tổng quát được sang những ảnh khó hơn một chút, chứ không phải do các đội đã chỉnh mô hình theo bộ thử cũ."
      - clear: true
        show: |
          <p><b>2020 — học trước ở quy mô lớn hơn:</b> một mạng chia ảnh thành các mảnh nhỏ và dùng cơ chế chú ý. Học từ đầu trên tập cỡ vừa như ImageNet mà không chính quy hoá mạnh, nó kém mạng có lối tắt cùng cỡ “vài điểm phần trăm”. Học trước trên <b>14 triệu tới 300 triệu ảnh</b> rồi chuyển giao, nó đạt <b>88,55%</b> trên ImageNet.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tập học trước lớn nhất so với nhỏ nhất</td><td>$\frac{300}{14}$</td><td>hơn 21 lần</td></tr>
          <tr><td>Bước 2. so với 83% của mô hình tốt nhất năm 2019 trên bộ thử cũ</td><td>$88{,}55 - 83$</td><td>5,55 điểm phần trăm</td></tr></table>
          <p class="note">Thực hành: dùng mô hình học trước trên tập lớn rồi chuyển giao như ở bài 7, và luôn đo lại trên dữ liệu mới của chính mình.</p>
        focus: [1, 1, 1, "2.2", "2.3", 3]
        say: "Năm 2020, một mạng chia ảnh thành các mảnh nhỏ và dùng cơ chế chú ý, như cách mô hình ngôn ngữ đọc từng từ. Nhóm tác giả ghi rằng học từ đầu trên tập cỡ vừa như ImageNet mà không chính quy hoá mạnh, nó kém mạng có lối tắt cùng cỡ vài điểm phần trăm. Nhưng học trước trên 14 triệu tới 300 triệu ảnh rồi chuyển giao, nó đạt 88 phẩy 55 phần trăm trên ImageNet. Bước một, tập học trước lớn nhất gấp hơn 21 lần tập nhỏ nhất. Bước hai, so với 83 phần trăm của mô hình tốt nhất năm 2019 trên bộ thử cũ là hơn 5 phẩy 55 điểm phần trăm. Thực hành là dùng mô hình học trước trên tập lớn rồi chuyển giao như ở bài 7, và luôn đo lại trên dữ liệu mới của chính mình."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình bằng đường khác"
    checks:
      - "round(28.2 / 6.7, 1) == 4.2 and round(16.4 / 6.7, 1) == 2.4"
      - "len([(dx, dy, f) for dx in range(32) for dy in range(32) for f in (0, 1)]) == 2048"
      - "3 * (3 * 3) == 27 and round(27 * 1.81) == 49"
      - "round(72 / 83, 3) == 0.867"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác</th><th>khớp?</th></tr>
          <tr><td>lỗi giảm 4,2 lần từ 2010 tới 2014</td><td>$\frac{28{,}2}{6{,}7} \approx 4{,}2$; nhóm tổ chức cũng ghi “giảm 4,2 lần”, và từ 2012 “giảm 2,4 lần”: $\frac{16{,}4}{6{,}7} \approx 2{,}4$</td><td>✓</td></tr>
          <tr><td>2048 mẫu từ một ảnh</td><td>liệt kê mọi bộ (dời ngang, dời dọc, lật hay không): $32 \cdot 32 \cdot 2$ bộ</td><td>✓</td></tr>
          <tr><td>81% tham số nhiều hơn</td><td>$27 \cdot 1{,}81 \approx 49$</td><td>✓</td></tr>
          <tr><td>83% → 72%</td><td>$\frac{72}{83} \approx 0{,}867$: tụt 11 điểm, tức khoảng 13% của mức cũ</td><td>✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm bốn con số bằng đường khác. Lỗi giảm 4 phẩy 2 lần từ 2010 tới 2014, vì 28 phẩy 2 chia 6 phẩy 7 xấp xỉ 4 phẩy 2. Nhóm tổ chức cũng ghi giảm 4 phẩy 2 lần, còn từ 2012 là giảm 2 phẩy 4 lần. Hệ số 2048 kiểm bằng cách liệt kê mọi bộ dời ngang, dời dọc, lật hay không lật, được 32 nhân 32 nhân 2 bộ. Con số 81 phần trăm kiểm bằng 27 nhân 1 phẩy 81, xấp xỉ 49. Còn 72 chia 83 xấp xỉ 0 phẩy 867, nghĩa là tụt 11 điểm phần trăm, tức khoảng 13 phần trăm của mức cũ."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
      - "round(0.051 * 1500) == 76 and 1500 / 60 == 25"
      - "83 - 72 == 11"
    steps:
      - show: |
          <div class="box warn"><b>Bài học sai 1.</b> “Từ năm 2015, máy nhận dạng ảnh giỏi hơn người” <b class="red">(một người, 1500 ảnh, lỗi khác loại)</b>
          <br><span class="note">5,1% là lỗi của <b>một</b> người chú thích đã luyện, trên 1500 ảnh, khoảng 25 giờ làm. Nói đúng: thấp hơn ước lượng lỗi của một người chú thích, trên bộ thử này.</span></div>
          <table class="t"><tr><th>loại ảnh</th><th>phần lỗi của máy (mạng 22 tầng)</th><th>phần lỗi của người</th></tr>
          <tr><td>vật rất nhỏ hoặc rất mảnh</td><td>khoảng 21%</td><td>không ảnh nào</td></tr>
          <tr><td>phân biệt giống loài chi tiết (chó, khỉ, rắn, chim)</td><td>7%</td><td>37%</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", 1]
        say: "Bài học sai thứ nhất là từ năm 2015, máy nhận dạng ảnh giỏi hơn người. Con số 5 phẩy 1 phần trăm là lỗi của một người chú thích đã luyện, trên 1500 ảnh, khoảng 25 giờ làm việc. Nhóm tổ chức còn phân tích từng loại lỗi, và người với máy sai ở những loại ảnh khác nhau. Khoảng 21 phần trăm lỗi của máy là vật rất nhỏ hoặc rất mảnh, người không sai ảnh nào loại này. Ngược lại, 37 phần trăm lỗi của người là phân biệt giống loài chi tiết như chó, chim, còn máy chỉ 7 phần trăm. Nói đúng là lỗi của máy thấp hơn ước lượng lỗi của một người chú thích, trên chính bộ thử này."
      - show: |
          <div class="box warn"><b>Bài học sai 2.</b> “Cứ thêm tầng là tốt hơn” <b class="red">(thêm tầng từng làm lỗi huấn luyện tăng)</b>
          <br><span class="note">Chặng 4: trước khi có lối tắt, mạng sâu hơn học kém hơn ngay trên tập huấn luyện. Độ sâu chỉ có ích khi mạng học được nó.</span></div>
        focus: [1, 1]
        say: "Bài học sai thứ hai là cứ thêm tầng là tốt hơn. Ở chặng bốn, trước khi có lối tắt, mạng sâu hơn học kém hơn ngay trên tập huấn luyện, nên độ sâu chỉ có ích khi mạng học được nó."
      - clear: true
        show: |
          <div class="box warn"><b>Bài học sai 3.</b> “Con số trên bộ thử chuẩn là độ chính xác khi triển khai” <b class="red">(83% thành 72% chỉ vì ảnh mới)</b>
          <br><span class="note">Ngay cả ảnh thu theo đúng quy trình cũ cũng làm tụt 11 điểm. Ảnh của camera, ánh sáng, địa điểm khác còn có thể tụt hơn — đo theo lát như bài 10.</span></div>
        focus: [1, 1]
        say: "Bài học sai thứ ba là con số trên bộ thử chuẩn chính là độ chính xác khi triển khai. Ngay cả ảnh thu theo đúng quy trình cũ cũng làm tụt 11 điểm, nên ảnh từ camera, ánh sáng và địa điểm khác còn có thể tụt hơn, và phải đo theo lát như bài 10."
      - show: |
          <div class="box warn"><b>Bài học sai 4 (mức hệ thống).</b> “Chép quy mô của người khổng lồ” <b class="red">(tự học từ đầu một kiến trúc lớn trên vài nghìn ảnh)</b>
          <br><span class="note">Chính bài báo năm 2020 ghi kiến trúc mới kém hơn khi học từ đầu trên tập cỡ vừa. Quy mô của bạn cần mô hình học trước, tăng cường giữ nhãn, và một bộ thử của riêng mình.</span></div>
        focus: [1, 1, 1]
        say: "Bài học sai thứ tư ở mức hệ thống là chép quy mô của người khổng lồ, tự học từ đầu một kiến trúc lớn trên vài nghìn ảnh. Chính bài báo năm 2020 ghi rằng kiến trúc mới kém hơn khi học từ đầu trên tập cỡ vừa. Ở quy mô của bạn, cần mô hình học trước, tăng cường giữ nhãn, và một bộ thử của riêng mình."

  # ───────────────────────── 13. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "round(0.10 * 3000) == 300 and 300 / 60 == 5.0 and 3000 / 60 == 50.0"
      - "round(5 / 1500 * 3000) == 10"
    steps:
      - show: |
          <p>Đội bạn có <b>3000 ảnh</b> đã gán nhãn của 5 loại sản phẩm, một thẻ đồ hoạ, một tuần (số minh hoạ). Mô hình sẽ chạy trên camera ở hai nhà máy khác nhau.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Học từ đầu một kiến trúc lớn, hay chuyển giao từ mô hình học trước? Vì sao?</td></tr>
          <tr><td>2</td><td>Rà lại nhãn: nếu một người rà 1 ảnh mỗi phút, rà hết mất bao lâu, rà 10% mất bao lâu? Nếu tỉ lệ nhãn sai như chặng 1, có khoảng bao nhiêu nhãn sai?</td></tr>
          <tr><td>3</td><td>Bộ thử: lấy ngẫu nhiên 10% của 3000 ảnh, hay thu thêm ảnh mới từ camera hai nhà máy?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Đội bạn có 3000 ảnh đã gán nhãn của 5 loại sản phẩm, một thẻ đồ hoạ và một tuần, và mô hình sẽ chạy trên camera ở hai nhà máy khác nhau. Câu một, học từ đầu một kiến trúc lớn hay chuyển giao từ mô hình học trước, và vì sao? Câu hai, nếu một người rà 1 ảnh mỗi phút, rà hết mất bao lâu, rà 10 phần trăm mất bao lâu, và nếu tỉ lệ nhãn sai như chặng một thì có khoảng bao nhiêu nhãn sai? Câu ba, bộ thử nên lấy ngẫu nhiên 10 phần trăm của 3000 ảnh, hay thu thêm ảnh mới từ camera hai nhà máy? Dừng video và suy nghĩ."
        pause: 25
      - clear: true
        show: |
          <p><b>Câu 1.</b> Chuyển giao từ mô hình học trước, chỉ học lại các tầng cuối, kèm tăng cường giữ nhãn — chặng 2 và chặng 6 cho thấy dữ liệu ít mà mô hình lớn thì học vẹt hoặc kém.</p>
          <p><b>Câu 2.</b> Rà hết: $\frac{3000}{60} = 50$ giờ; rà 10% là 300 ảnh: $\frac{300}{60} = \hlg{5}$ giờ. Tỉ lệ $\frac{5}{1500}$ cho khoảng $\frac{5}{1500} \cdot 3000 = 10$ nhãn sai — rà mẫu để biết tỉ lệ thật của <b>chính</b> dữ liệu mình.</p>
        focus: [1, 1, 2, 2]
        say: "Câu một, nên chuyển giao từ mô hình học trước, chỉ học lại các tầng cuối, kèm tăng cường giữ nhãn. Lý do là chặng hai và chặng sáu cho thấy dữ liệu ít mà mô hình lớn thì dễ học vẹt hoặc kém. Câu hai, rà hết 3000 ảnh mất 50 giờ, rà 10 phần trăm tức 300 ảnh mất 5 giờ. Tỉ lệ 5 trên 1500 cho khoảng 10 nhãn sai, nhưng hãy rà mẫu để biết tỉ lệ thật của chính dữ liệu mình."
      - show: |
          <table class="t"><tr><th>câu 3: bộ thử</th><th>được</th><th>mất</th></tr>
          <tr><td>10% ngẫu nhiên của 3000 ảnh</td><td>có ngay, không tốn công</td><td class="red">cùng nguồn với ảnh huấn luyện — như bộ thử cũ năm 2019</td></tr>
          <tr><td>thu mới từ camera hai nhà máy, chia theo nhà máy</td><td>đo đúng điều kiện triển khai, thấy lát nào yếu</td><td>tốn công thu và gán nhãn</td></tr></table>
          <p class="note">Nên làm cả hai: 10% ngẫu nhiên để chọn mô hình trong lúc phát triển, bộ thử mới theo từng nhà máy để quyết định triển khai.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Câu ba là một đánh đổi. Lấy 10 phần trăm ngẫu nhiên của 3000 ảnh thì có ngay, nhưng cùng nguồn với ảnh huấn luyện, giống bộ thử cũ mà năm 2019 đã cho thấy là lạc quan. Thu mới từ camera hai nhà máy và chia theo nhà máy thì đo đúng điều kiện triển khai, thấy lát nào yếu, nhưng tốn công thu và gán nhãn. Nên làm cả hai, 10 phần trăm ngẫu nhiên để chọn mô hình trong lúc phát triển, và bộ thử mới theo từng nhà máy để quyết định có triển khai hay không."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">2010: nhãn tốt ở quy mô lớn, 28,2%</span><span class="a">→</span>
          <span class="n">2012: chống học vẹt, tăng 2048 lần, 16,4%</span><span class="a">→</span>
          <span class="n">2014: chồng bộ lọc nhỏ, 6,67%</span><span class="a">→</span>
          <span class="n">2015: lối tắt, 152 tầng, 3,57%</span><span class="a">→</span>
          <span class="n">2017: 2,251%, gần mức nhãn sai</span><span class="a">→</span>
          <span class="n">2019–2020: đo lại; học trước rồi chuyển giao</span></div>
        say: "Tổng kết hành trình, năm 2010 bài toán là gán nhãn tốt ở quy mô lớn, với lỗi 28 phẩy 2 phần trăm. Năm 2012 là chống học vẹt bằng tăng cường 2048 lần, còn 16 phẩy 4. Năm 2014 là chồng bộ lọc nhỏ, còn 6 phẩy 67, và năm 2015 là lối tắt với 152 tầng, còn 3 phẩy 57. Năm 2017 còn 2 phẩy 251, gần mức nhãn sai của chính bộ thử. Từ 2019 tới 2020, câu hỏi chuyển sang đo lại trên dữ liệu mới, và học trước ở quy mô lớn rồi chuyển giao."
      - show: |
          <div class="box key"><b>Tư duy chuyên gia:</b> mỗi lần con số đẹp lên, hãy hỏi “đo trên ảnh nào, nhãn đúng tới đâu, và ảnh của mình có giống thế không?”. Tiến bộ thật là tiến bộ còn giữ được khi đổi bộ thử.</div>
        say: "Tư duy chuyên gia cần mang theo, mỗi lần con số đẹp lên, hãy hỏi đo trên ảnh nào, nhãn đúng tới đâu, và ảnh của mình có giống thế không. Tiến bộ thật là tiến bộ còn giữ được khi đổi bộ thử."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá. Từ ảnh là một mảng số ở bài 0 tới cách đọc một hành trình mười năm, chuỗi chung của khoá là: <b>biểu diễn đúng → tính đúng → đo đúng</b>.</p>
        say: "Đây là bài cuối của khoá Thị giác máy tính. Từ ảnh là một mảng số ở bài 0 tới cách đọc một hành trình mười năm, chuỗi chung của khoá là biểu diễn đúng, tính đúng, rồi đo đúng. Cảm ơn bạn đã theo học."
