# Quy ước: “lỗi năm đáp án” = tỉ lệ ảnh mà nhãn đúng KHÔNG nằm trong 5 đoán đầu của mô hình — thước đo xếp hạng của cuộc thi [SZ14] [RU15].
#   “giảm tương đối” = (cũ − mới) / cũ. Mọi sự kiện và con số có nguồn ghi trong audit/cvi/sources_L12.md; con số khác là phép tính lại
#   (checks, verify_parts/L12.py) hoặc ghi “(số minh hoạ)”: đội 3000 ảnh, 5 loại sản phẩm, một thẻ đồ hoạ, một tuần ở câu tự làm.
#   Lời đọc chỉ nói tên “ImageNet” (probe p1: “I-mịt-nét” 8/8, lexicon_vi.CVI.yaml); tên mạng, đội, công ty, chữ viết tắt (VGG, GoogLeNet,
#   ResNet, SENet, ViT, AMT, NEC, XRCE) chỉ trên màn hình: lời đọc nói “mạng toàn bộ lọc 3 nhân 3”, “mạng 22 tầng”, “mạng có lối tắt”,
#   “mạng chỉnh trọng số từng kênh”, “mạng chia ảnh thành mảnh và dùng cơ chế chú ý”. Không nêu tên cá nhân trong lời đọc.
#   Không trùng PAR bài 13: chặng 2012 ở đây nói tăng cường dữ liệu và chống học vẹt, không nói hai thẻ đồ hoạ.
#   Không nói cuộc thi “kết thúc năm 2017” (trang image-net.org không kết nối được — NOT_VERIFIED).
objectives:
  - "Kể lại sáu chặng 2010–2020 của nhận dạng ảnh quy mô lớn, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại mức giảm lỗi 28,2% → 6,7% (4,2 lần), hệ số tăng dữ liệu 2048, tham số 27C² so với 49C², và độ tụt 83% → 72%"
  - "Chọn cách dùng mô hình học sẵn và cách đo cho dự án ở quy mô vài nghìn ảnh"
