    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Báo một con số chung <b class="red">(90,5% che mất ban đêm 50%)</b>
          <br><span class="note">Phép thử: luôn kèm bảng theo lát — mỗi điều kiện một dòng, có số ảnh của lát.</span></div>
        say: "Lỗi thứ nhất là báo một con số chung, để 90 phẩy 5 phần trăm che mất ban đêm chỉ 50 phần trăm. Phép thử là luôn kèm bảng theo lát, mỗi điều kiện một dòng, có cả số ảnh của lát."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chia ngẫu nhiên từng ảnh vào tập học và tập thử <b class="red">(cùng camera, cùng ngày ở cả hai bên)</b>
          <br><span class="note">Ảnh liền nhau của một camera gần như giống hệt: mô hình “nhớ nền” rồi được chấm trên chính nền đó, nên con số đẹp giả. Chia theo điểm đặt, theo ngày, theo chuỗi ảnh như nghiên cứu bẫy ảnh.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ hai là chia ngẫu nhiên từng ảnh vào tập học và tập thử, nên cùng camera, cùng ngày nằm ở cả hai bên. Ảnh liền nhau của một camera gần như giống hệt, mô hình nhớ nền rồi được chấm trên chính nền đó, nên con số đẹp giả. Hãy chia theo điểm đặt, theo ngày, theo chuỗi ảnh như nghiên cứu bẫy ảnh."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Kết luận từ lát quá nhỏ <b class="red">(10 ảnh đêm: 50% ± 32%)</b>
          <br><span class="note">Mười ảnh cho khoảng 18% tới 82%. Phép thử: in số ảnh và sai số chuẩn cạnh mỗi con số của lát.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba là kết luận từ một lát quá nhỏ, ví dụ 10 ảnh đêm cho 50 phần trăm, cộng trừ tới 32 phần trăm. Phép thử là in số ảnh và sai số chuẩn ngay cạnh mỗi con số của lát."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Tính kỳ vọng một lần lúc ra mắt rồi thôi <b class="red">(mùa đông đêm dài hơn)</b></div>
          <table class="t"><tr><th>thời điểm</th><th>tỉ trọng ban đêm</th><th>kỳ vọng $\sum_s q_s a_s$</th></tr>
          <tr><td>lúc ra mắt</td><td>50%</td><td>72,5%</td></tr>
          <tr><td>mùa đông</td><td>70%</td><td class="red">$0{,}3 \cdot 0{,}95 + 0{,}7 \cdot 0{,}5 = 63{,}5\%$</td></tr></table>
          <p class="note">Theo dõi cả <b>tỉ trọng các lát</b> lẫn tỉ lệ đúng từng lát theo thời gian — gọi là <b>giám sát trôi dữ liệu</b>: định kỳ đếm tỉ trọng từng lát trên ảnh thật, tính lại kỳ vọng, và báo động khi nó tụt dưới mức sàn.</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tính kỳ vọng một lần lúc ra mắt rồi thôi. Lúc ra mắt ban đêm chiếm một nửa, kỳ vọng 72 phẩy 5 phần trăm. Mùa đông đêm dài hơn, ban đêm chiếm 70 phần trăm, kỳ vọng tụt còn 63 phẩy 5 phần trăm dù mô hình không đổi. Hãy theo dõi cả tỉ trọng các lát lẫn tỉ lệ đúng từng lát theo thời gian, việc này gọi là giám sát trôi dữ liệu. Cụ thể là định kỳ đếm tỉ trọng từng lát trên ảnh thật, tính lại kỳ vọng, và báo động khi nó tụt dưới mức sàn."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: con số chung, con số triển khai, và cỡ mẫu"
    checks:
      - "round(alg.cvi_mix_acc([(800, 0.92), (200, 0.7)]), 3) == 0.876 and round(alg.cvi_mix_acc([(0.6, 0.92), (0.4, 0.7)]), 3) == 0.832"
      - "round(0.7 * 0.3 * (2 / 0.05) ** 2) == 336 and round(2 * math.sqrt(0.21 / 336), 3) == 0.05"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tập kiểm tra: 800 ảnh trời nắng đúng 92%, 200 ảnh trời mưa đúng 70%. Con số chung? Khi triển khai mưa chiếm 40% thì kỳ vọng bao nhiêu?</td></tr>
          <tr><td>2</td><td>Cần bao nhiêu ảnh mưa để hai sai số chuẩn của tỉ lệ đúng 70% chỉ còn 0,05?</td></tr>
          <tr><td>3</td><td>Trước khi cho xe chạy ở thành phố mới, bạn chọn điều kiện ra mắt nào: con số chung trên 90%, hay mọi lát trên một mức sàn?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn. Câu một, tập kiểm tra có 800 ảnh trời nắng đúng 92 phần trăm và 200 ảnh trời mưa đúng 70 phần trăm, con số chung là bao nhiêu? Khi triển khai mưa chiếm 40 phần trăm thì kỳ vọng bao nhiêu? Câu hai, cần bao nhiêu ảnh mưa để hai sai số chuẩn của tỉ lệ đúng 70 phần trăm chỉ còn 0 phẩy 05? Câu ba, trước khi cho xe chạy ở thành phố mới, bạn chọn điều kiện ra mắt nào? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Câu 1.</b> Chung: $0{,}8 \cdot 0{,}92 + 0{,}2 \cdot 0{,}7 = \hlg{0{,}876}$. Triển khai: $0{,}6 \cdot 0{,}92 + 0{,}4 \cdot 0{,}7 = \hlo{0{,}832}$.</p>
          <p><b>Câu 2.</b> $n = 0{,}7 \cdot 0{,}3 \cdot \left(\frac{2}{0{,}05}\right)^2 = 0{,}21 \cdot 1600 = \hlg{336}$ ảnh mưa.</p>
        focus: [1, 1, 2]
        say: "Câu một, con số chung là 0 phẩy 8 nhân 0 phẩy 92 cộng 0 phẩy 2 nhân 0 phẩy 7, bằng 0 phẩy 876. Khi mưa chiếm 40 phần trăm, kỳ vọng là 0 phẩy 6 nhân 0 phẩy 92 cộng 0 phẩy 4 nhân 0 phẩy 7, bằng 0 phẩy 832. Câu hai, theo công thức đã chuyển vế, n bằng 0 phẩy 21 nhân bình phương của 2 chia 0 phẩy 05, tức 0 phẩy 21 nhân 1600, bằng 336 ảnh mưa."
      - show: |
          <table class="t"><tr><th>câu 3: điều kiện ra mắt</th><th>được</th><th>mất</th></tr>
          <tr><td>con số chung trên 90%</td><td>dễ đạt, dễ báo cáo</td><td class="red">lát yếu và hiếm lọt qua</td></tr>
          <tr><td>mọi lát trên mức sàn, mỗi lát đủ ảnh</td><td>bảo vệ điều kiện xấu nhất</td><td>tốn công thu ảnh cho từng lát</td></tr>
          <tr><td>thêm: ảnh của chính thành phố mới, chia theo điểm đặt</td><td>đo đúng miền sẽ chạy</td><td>phải chạy thử trước khi có số</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Câu ba là một đánh đổi. Con số chung trên 90 phần trăm dễ đạt và dễ báo cáo, nhưng lát yếu và hiếm sẽ lọt qua. Đặt mức sàn cho mọi lát, mỗi lát đủ ảnh, thì bảo vệ được điều kiện xấu nhất nhưng tốn công thu ảnh. Tốt nhất là thêm ảnh của chính thành phố mới, chia theo điểm đặt, để đo đúng miền sẽ chạy, dù phải chạy thử trước khi có số."

