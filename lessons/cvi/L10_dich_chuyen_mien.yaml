        forward_ref: true
        say: "Ở bài sau, bài 11, ta xem một tình huống chuyên gia, khi mô hình đúng vì nền ảnh chứ không vì vật, và phép thử giữ vật, đổi nền để lật tẩy nó. Hẹn gặp bạn ở bài tiếp theo."
