source: "curriculum/cvi.yaml L10; audit/cvi/verify_cvi.py L10; audit/cvi/sources_L10.md; [B18] S. Beery, G. Van Horn, P. Perona, Recognition in Terra Incognita, ECCV 2018, arXiv:1807.04975 (bẫy ảnh: lỗi 20,83% ở điểm đặt máy đã thấy, 41,08% ở điểm mới; chia tập theo điểm đặt và theo ngày); [R19] B. Recht, R. Roelofs, L. Schmidt, V. Shankar, Do ImageNet Classifiers Generalize to ImageNet?, ICML 2019, arXiv:1902.10811 (tập kiểm tra mới 10 000 ảnh, độ chính xác tụt 11% tới 14%, thứ hạng gần như giữ nguyên); MLO bài 8 (giám sát trôi dữ liệu); CS115 bài 13 (phương sai)"
assumes: [arith, cdot, frac, approx, geq, sub, sqrt]
# Quy ước: “lát” = một nhóm ảnh cùng điều kiện (ban ngày, ban đêm, mưa…). n_s = số ảnh của lát s trong tập kiểm tra, a_s = tỉ lệ đúng của lát s;
#   w_s = tỉ trọng lát s trong TẬP KIỂM TRA, q_s = tỉ trọng lát s KHI TRIỂN KHAI. Độ chính xác chung = Σ w_s · a_s (alg.cvi_mix_acc);
#   kỳ vọng khi triển khai = Σ q_s · a_s — chỉ đúng khi tỉ lệ đúng TRONG mỗi lát không đổi (giả thiết, nói rõ trong bài).
#   Sai số chuẩn của tỉ lệ đúng đo trên n ảnh: căn(a · (1 − a) / n); “khoảng hai sai số chuẩn” ≈ khoảng tin cậy 95% (xấp xỉ chuẩn).
#   900/100 ảnh ngày/đêm, mưa/nắng, mùa đông 70% ban đêm là SỐ MINH HOẠ. Sự kiện thật chỉ theo [B18], [R19] (sources_L10.md).
#   Lời đọc: “ImageNet” theo luật lexicon (I-mịt-nét); không đọc tên tác giả.
objectives:
  - "Tách độ chính xác theo lát (sáng, tối, mưa) thay vì một con số chung"
  - "Tính độ chính xác kỳ vọng khi tỉ trọng các lát lúc triển khai khác tập kiểm tra"
  - "Ước lượng cần bao nhiêu ảnh mỗi lát để con số đủ tin, bằng sai số chuẩn"
  - "Lập tập kiểm tra theo điều kiện triển khai và chia tập không rò rỉ (theo điểm đặt camera, theo ngày)"
asr_reviewed:
  - {sentence: "Điều thứ nhất là trung bình có trọng số, như ở bài 2 ta nhân mỗi lớp với tỉ lệ w của nó.", reason: "ASR chép “Điều thứ nhất là trung bình có trọng số, như ở bài hai ta nhân mỗi lớp với tỷ lệ v kết của nó.” (0.917): “tỉ” ASR viết chính tả “tỷ” (cùng âm); chữ w đọc “vê kép” (luật chung), ASR viết tách chữ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Điều thứ ba là tăng bao nhiêu phần trăm, từ a lên b thì tăng b trừ a chia a.", reason: "ASR chép “Điều thứ 3 là tăng bao nhiêu phần trăm, từ A lên B thì tăng B trữ A chia.” (0.923): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: trừ/trữ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "90,5% trên tập kiểm tra, khoảng 72,5% ngoài đường"
    checks:
      - "round(alg.cvi_mix_acc([(900, 0.95), (100, 0.5)]), 3) == 0.905 and round(alg.cvi_mix_acc([(0.5, 0.95), (0.5, 0.5)]), 3) == 0.725"
    steps:
      - show: |
          <p>Một mô hình nhận biển báo giao thông đạt <b>90,5%</b> trên tập kiểm tra 1000 ảnh. Đưa lên xe chạy cả ngày lẫn đêm, đội vận hành chỉ thấy khoảng <b>72,5%</b> đúng.</p>
          <p>Mô hình không đổi. Ảnh đổi: tập kiểm tra có 900 ảnh ban ngày và 100 ảnh ban đêm; trên đường, một nửa thời gian là ban đêm.</p>
          <div class="box key">Hôm nay: vì sao một con số chung che mất điều kiện yếu? Tính trước con số khi triển khai thế nào? Và cần bao nhiêu ảnh mỗi điều kiện để tin được?</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, một mô hình nhận biển báo giao thông đạt 90 phẩy 5 phần trăm trên tập kiểm tra 1000 ảnh. Đưa lên xe chạy cả ngày lẫn đêm, đội vận hành chỉ thấy khoảng 72 phẩy 5 phần trăm đúng. Mô hình không hề đổi, chỉ ảnh đổi. Tập kiểm tra có 900 ảnh ban ngày và 100 ảnh ban đêm, còn trên đường thì một nửa thời gian là ban đêm. Hôm nay ta hỏi, vì sao một con số chung che mất điều kiện yếu, tính trước con số khi triển khai thế nào, và cần bao nhiêu ảnh mỗi điều kiện để tin được."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "(900 * 0.95 + 100 * 0.5) / 1000 == 0.905 and 0.9 * 0.95 + 0.1 * 0.5 == 0.905"
      - "0.5 * (1 - 0.5) == 0.25 and math.sqrt(0.25 / 100) == 0.05"
      - "0.5 * 0.25 + 0.5 * 0.25 == 0.25 and all(abs(a * (1 - a) * (1 - a) + (1 - a) * a * a - a * (1 - a)) < 1e-12 for a in (0.1, 0.5, 0.95))"
      - "abs(100 * 0.25 / (100 * 100) - 0.25 / 100) < 1e-15"
      - "round((41.08 - 20.83) / 20.83, 2) == 0.97"
    steps:
      - show: |
          <p><b>① Trung bình có trọng số</b> (bài 2 dùng tỉ lệ $w$ của mỗi lớp): 900 ảnh đúng 95%, 100 ảnh đúng 50%:</p>
          $$\frac{900 \cdot 0{,}95 + 100 \cdot 0{,}5}{1000} = 0{,}9 \cdot 0{,}95 + 0{,}1 \cdot 0{,}5 = 0{,}905$$
        focus: [1, 2, 2]
        say: "Điều thứ nhất là trung bình có trọng số, như ở bài 2 ta nhân mỗi lớp với tỉ lệ w của nó. Với 900 ảnh đúng 95 phần trăm và 100 ảnh đúng 50 phần trăm, tổng số ảnh đúng chia 1000 bằng 0 phẩy 905. Đó cũng là 0 phẩy 9 nhân 0 phẩy 95, cộng 0 phẩy 1 nhân 0 phẩy 5."
      - show: |
          <p><b>② Một lần đoán là một đồng xu</b> đúng với xác suất $a$: ghi 1 nếu đúng, 0 nếu sai, nên trung bình của nó là $a$. <b>Phương sai</b> — trung bình của bình phương độ lệch so với trung bình — là</p>
          $$a \cdot (1 - a) \cdot (1 - a) + (1 - a) \cdot a \cdot a = a \cdot (1 - a), \qquad a = 0{,}5: \ 0{,}5 \cdot 0{,}25 + 0{,}5 \cdot 0{,}25 = 0{,}25$$
        focus: [1, 1, 2, 2]
        say: "Điều thứ hai, một lần đoán giống một đồng xu, ghi 1 nếu đúng và 0 nếu sai, đúng với xác suất a, nên trung bình của nó bằng a. Phương sai là trung bình của bình phương độ lệch so với trung bình, đo kết quả toả rộng bao nhiêu. Với xác suất a, độ lệch là 1 trừ a, với xác suất 1 trừ a, độ lệch là âm a, nên cộng lại và đặt thừa số chung được a nhân 1 trừ a. Ví dụ a bằng 0 phẩy 5 cho 0 phẩy 5 nhân 0 phẩy 25, cộng 0 phẩy 5 nhân 0 phẩy 25, bằng 0 phẩy 25."
      - clear: true
        show: |
          <p><b>Trung bình của $n$ lần đoán độc lập.</b> Phương sai của tổng bằng tổng các phương sai: $n \cdot a \cdot (1 - a)$. Chia tổng cho $n$ để ra tỉ lệ đúng thì mọi độ lệch nhỏ đi $n$ lần, nên phương sai nhỏ đi $n \cdot n$ lần, còn $\frac{a \cdot (1 - a)}{n}$. Căn của phương sai là <b>độ lệch chuẩn</b>; độ lệch chuẩn của tỉ lệ đúng đo được gọi là <b>sai số chuẩn</b>:</p>
          $$\sqrt{\frac{a \cdot (1 - a)}{n}}, \qquad a = 0{,}5,\ n = 100: \ \sqrt{\frac{0{,}25}{100}} = 0{,}05$$
          <p class="note">Khoảng “cộng trừ hai sai số chuẩn” quanh con số đo được chứa tỉ lệ đúng thật với độ tin chừng 95% (xấp xỉ, khi $n$ đủ lớn).</p>
        focus: [1, 1, 1, 1, 2, 3]
        say: "Với n lần đoán độc lập, phương sai của tổng bằng tổng các phương sai, tức n nhân a nhân 1 trừ a. Chia tổng cho n để ra tỉ lệ đúng thì mọi độ lệch nhỏ đi n lần, nên phương sai nhỏ đi n nhân n lần. Kết quả còn a nhân 1 trừ a, chia cho n. Căn của phương sai là độ lệch chuẩn, và độ lệch chuẩn của tỉ lệ đúng đo được gọi là sai số chuẩn. Với a bằng 0 phẩy 5 và n bằng 100, ta được căn của 0 phẩy 0025, bằng 0 phẩy 05. Khoảng cộng trừ hai sai số chuẩn quanh con số đo được chứa tỉ lệ đúng thật với độ tin chừng 95 phần trăm, khi n đủ lớn."
      - show: |
          <p><b>③ Tăng bao nhiêu phần trăm:</b> từ $a$ lên $b$ là $\frac{b - a}{a}$. Lỗi từ 20,83% lên 41,08%: $\frac{41{,}08 - 20{,}83}{20{,}83} \approx 0{,}97$, tức tăng khoảng 97%, gần gấp đôi.</p>
        focus: [1, 1]
        say: "Điều thứ ba là tăng bao nhiêu phần trăm, từ a lên b thì tăng b trừ a chia a. Lỗi từ 20 phẩy 83 phần trăm lên 41 phẩy 08 phần trăm là tăng khoảng 0 phẩy 97, tức gần gấp đôi, con số ta sẽ gặp lại ở một nghiên cứu thật."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: lát s, a s, w s, q s và tổng có trọng số"
    checks:
      - "round(sum(w * a for w, a in [(0.9, 0.95), (0.1, 0.5)]), 3) == 0.905 and round(sum(q * a for q, a in [(0.5, 0.95), (0.5, 0.5)]), 3) == 0.725"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ biển báo</th></tr>
          <tr><td>lát $s$</td><td>nhóm ảnh cùng điều kiện</td><td>ban ngày, ban đêm</td></tr>
          <tr><td>$a_s$</td><td>tỉ lệ đúng trên lát $s$</td><td>0,95 và 0,5</td></tr>
          <tr><td>$w_s$</td><td>tỉ trọng lát $s$ trong <b>tập kiểm tra</b></td><td>0,9 và 0,1</td></tr>
          <tr><td>$q_s$</td><td>tỉ trọng lát $s$ <b>khi triển khai</b></td><td>0,5 và 0,5</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu các ký hiệu. Một lát s là một nhóm ảnh cùng điều kiện, như ban ngày hay ban đêm. a với chỉ số dưới s là tỉ lệ đúng trên lát đó, ở đây 0 phẩy 95 và 0 phẩy 5. w với chỉ số s là tỉ trọng của lát trong tập kiểm tra, 0 phẩy 9 và 0 phẩy 1. q với chỉ số s là tỉ trọng của lát khi triển khai thật, ở đây mỗi lát một nửa."
      - clear: true
        show: |
          $$\text{độ chính xác chung} = \sum_s w_s \cdot a_s, \qquad \text{kỳ vọng khi triển khai} = \sum_s q_s \cdot a_s$$
          <p class="note">Dấu tổng Sigma hoa: cộng qua mọi lát. Hai công thức dùng <b>cùng</b> các $a_s$, chỉ khác trọng số.</p>
        introduces: [sum]
        focus: [1, 2, 2]
        say: "Chữ Sigma hoa là dấu tổng, nghĩa là cộng qua mọi lát s. Độ chính xác chung là tổng của w s nhân a s, còn kỳ vọng khi triển khai là tổng của q s nhân a s. Hai công thức dùng cùng các tỉ lệ đúng a s, chỉ khác trọng số."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cùng hai lát, hai cách pha: con số chung đổi theo"
    checks:
      - "round(alg.cvi_mix_acc([(900, 0.95), (100, 0.5)]), 3) == 0.905 and round(alg.cvi_mix_acc([(500, 0.95), (500, 0.5)]), 3) == 0.725"
    steps:
      - show: |
          <div><svg width="1500" height="350" viewBox="0 0 1500 350">
          <rect x="250" y="70" width="900" height="70" fill="#60a5fa" stroke="#1f2937" stroke-width="2"/><rect x="1150" y="70" width="100" height="70" fill="#1e3a8a" stroke="#1f2937" stroke-width="2"/>
          <rect x="250" y="210" width="500" height="70" fill="#60a5fa" stroke="#1f2937" stroke-width="2"/><rect x="750" y="210" width="500" height="70" fill="#1e3a8a" stroke="#1f2937" stroke-width="2"/>
          <g font-size="24" text-anchor="end" fill="#1f2937"><text x="230" y="113">tập kiểm tra</text><text x="230" y="253">khi triển khai</text></g>
          <g font-size="23" text-anchor="middle"><text x="700" y="113" fill="#ffffff">ban ngày: 900 ảnh, đúng 95%</text>
          <text x="500" y="253" fill="#ffffff">ban ngày 50%, đúng 95%</text><text x="1000" y="253" fill="#ffffff">ban đêm 50%, đúng 50%</text></g>
          <text x="1200" y="172" font-size="21" text-anchor="middle" fill="#1e3a8a">ban đêm: 100 ảnh, đúng 50%</text>
          <g font-size="24" fill="#1f2937" font-weight="bold"><text x="1280" y="113">chung 90,5%</text><text x="1280" y="253" fill="#dc2626">72,5%</text></g>
          <text x="750" y="330" font-size="21" fill="#6b7280" text-anchor="middle">tỉ lệ đúng trong mỗi lát giữ nguyên; chỉ tỉ trọng các lát thay đổi</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mỗi tập ảnh thành một thanh, chiều dài mỗi đoạn là tỉ trọng của lát. Thanh trên là tập kiểm tra, đoạn ban ngày dài 900, đoạn ban đêm chỉ 100, nên con số chung 90 phẩy 5 phần trăm gần như chỉ là ban ngày. Thanh dưới là lúc triển khai, ban đêm chiếm một nửa. Tỉ lệ đúng trong mỗi lát giữ nguyên, nhưng pha lại thì con số chung tụt còn 72 phẩy 5 phần trăm."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra con số khi triển khai, và nói rõ giả thiết"
    checks:
      - "900 * 0.95 + 100 * 0.5 == 905 and 905 / 1000 == 0.905"
      - "round(500 * 0.95 + 500 * 0.5) == 725 and 725 / 1000 == 0.725"
    steps:
      - show: |
          <p><b>Bước 1 — đếm ảnh đúng theo lát.</b> Ban ngày $900 \cdot 0{,}95 = 855$, ban đêm $100 \cdot 0{,}5 = 50$, tổng 905 trên 1000: độ chính xác chung 0,905 — chính là $\sum_s w_s \cdot a_s$ vì chia cho 1000 biến số ảnh thành tỉ trọng.</p>
        focus: [1, 1, 1, 1]
        say: "Bước một là đếm ảnh đúng theo lát. Ban ngày 900 nhân 0 phẩy 95 được 855 ảnh đúng, ban đêm 100 nhân 0 phẩy 5 được 50 ảnh đúng. Tổng 905 trên 1000, nên độ chính xác chung là 0 phẩy 905. Đó đúng là tổng w s nhân a s, vì chia cho 1000 biến số ảnh thành tỉ trọng."
      - show: |
          <p><b>Bước 2 — giả thiết.</b> Nếu tỉ lệ đúng <b>trong</b> mỗi lát không đổi khi ra đường (ảnh đêm trên đường giống ảnh đêm trong tập kiểm tra), thì 1000 ảnh trên đường có 500 ảnh ngày, 500 ảnh đêm:</p>
          $$500 \cdot 0{,}95 + 500 \cdot 0{,}5 = 475 + 250 = 725 \;\Rightarrow\; \sum_s q_s \cdot a_s = \hlo{0{,}725}$$
        introduces: [implies]
        focus: [1, 1, 2]
        say: "Bước hai là nói rõ giả thiết, tỉ lệ đúng trong mỗi lát không đổi khi ra đường, tức ảnh đêm trên đường giống ảnh đêm trong tập kiểm tra. Khi đó 1000 ảnh trên đường có 500 ảnh ngày đúng 475, và 500 ảnh đêm đúng 250. Tổng là 725, suy ra kỳ vọng 0 phẩy 725."
      - show: |
          <p class="note"><b>Bước 3 — khi giả thiết sai.</b> Nếu trên đường còn có lát mà tập kiểm tra không hề có (mưa lớn, camera mới), công thức không nói được gì cho lát đó: phải thu ảnh của lát mới mà đo.</p>
        say: "Bước ba, khi giả thiết sai thì sao? Nếu trên đường có lát mà tập kiểm tra không hề có, như mưa lớn hay camera mới, thì công thức không nói được gì cho lát đó, nên ta phải thu ảnh của lát mới để đo."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Bao nhiêu ảnh ban đêm thì con số đáng tin?"
    checks:
      - "math.sqrt(0.5 * 0.5 / 100) == 0.05 and 2 * 0.05 == 0.1"
      - "round(math.sqrt(0.5 * 0.5 / 10), 3) == 0.158 and round(2 * math.sqrt(0.5 * 0.5 / 10), 2) == 0.32"
      - "round(math.sqrt(0.95 * 0.05 / 900), 4) == 0.0073"
      - "round(0.25 * (2 / 0.02) ** 2) == 2500 and round(2 * math.sqrt(0.25 / 2500), 3) == 0.02"
    steps:
      - show: |
          <p><b>Bước 1.</b> 100 ảnh đêm, đúng 50%:</p>
          $$\sqrt{\frac{0{,}5 \cdot 0{,}5}{100}} = 0{,}05, \qquad 2 \cdot 0{,}05 = 0{,}1 \;\Rightarrow\; \text{khoảng } 40\% \text{ tới } 60\% \text{ (độ tin chừng 95\%)}$$
        focus: [1, 2]
        say: "Bước một, với 100 ảnh đêm đúng 50 phần trăm, sai số chuẩn bằng căn của 0 phẩy 25 chia 100, bằng 0 phẩy 05. Hai sai số chuẩn là 0 phẩy 1, nên với độ tin chừng 95 phần trăm, tỉ lệ đúng thật nằm khoảng 40 tới 60 phần trăm."
      - show: |
          <p><b>Bước 2.</b> Chỉ 10 ảnh đêm: $\sqrt{\frac{0{,}25}{10}} \approx 0{,}158$, hai sai số chuẩn $\approx 0{,}32$ — khoảng <b>18% tới 82%</b>: gần như không biết gì.</p>
        say: "Bước hai, nếu chỉ có 10 ảnh đêm thì sai số chuẩn xấp xỉ 0 phẩy 158, hai sai số chuẩn khoảng 0 phẩy 32, tức khoảng 18 tới 82 phần trăm, gần như không biết gì."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Ban ngày 900 ảnh, đúng 95%: $\sqrt{\frac{0{,}95 \cdot 0{,}05}{900}} \approx 0{,}0073$ — rất chắc. Tập kiểm tra cũ đo ban ngày kỹ, ban đêm sơ sài.</p>
        say: "Bước ba, ban ngày có 900 ảnh đúng 95 phần trăm, sai số chuẩn chỉ khoảng 0 phẩy 0073, rất chắc. Vậy tập kiểm tra cũ đo ban ngày rất kỹ, nhưng đo ban đêm sơ sài."
      - show: |
          <p><b>Bước 4 — đặt hàng thu ảnh.</b> Muốn hai sai số chuẩn chỉ còn 0,02 ở lát đêm: giải $2 \cdot \sqrt{0{,}25 / n} = 0{,}02$ bằng cách bình phương rồi chuyển vế.</p>
          $$n = 0{,}25 \cdot \left(\frac{2}{0{,}02}\right)^2 = 0{,}25 \cdot 10\,000 = \hlo{2500} \text{ ảnh đêm}$$
        introduces: [power]
        focus: [1, 1, 2]
        say: "Bước bốn là đặt hàng thu ảnh. Muốn hai sai số chuẩn ở lát đêm chỉ còn 0 phẩy 02, ta bình phương hai vế rồi chuyển vế. Được n bằng 0 phẩy 25 nhân bình phương của 2 chia 0 phẩy 02, tức 2500 ảnh đêm."

