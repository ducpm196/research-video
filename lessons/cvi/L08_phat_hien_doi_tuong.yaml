  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: đếm ô vuông, và đọc 101 mức độ phủ"
    checks:
      - "sum(1 for i in range(20) for j in range(20) if 0 <= i < 10 and 0 <= j < 10 and 5 <= i < 15 and 5 <= j < 15) == 25 and sum(1 for i in range(20) for j in range(20) if (i < 10 and j < 10) or (5 <= i < 15 and 5 <= j < 15)) == 175"
      - "round(alg.cvi_ap101([True, True, False, True, False], 3), 3) == 0.916 and (34 + 33 + 34 * 0.75) / 101 == alg.cvi_ap101([True, True, False, True, False], 3)"
    steps:
      - show: |
          <p><b>Đường khác 1 — đếm ô.</b> Chia mặt phẳng thành ô vuông cạnh 1, đếm ô nằm trong cả A lẫn B: 25 ô; nằm trong ít nhất một hộp: 175 ô. Tỉ số $\frac{25}{175}$ ✓ — không cần công thức.</p>
        focus: [1, 1]
        say: "Kiểm tra thứ nhất là đếm ô, ta chia mặt phẳng thành các ô vuông cạnh 1 rồi đếm. Số ô nằm trong cả A lẫn B là 25, số ô nằm trong ít nhất một hộp là 175, khớp tỉ số 25 phần 175 mà không cần công thức."
      - show: |
          <p><b>Đường khác 2 — đọc tại 101 mức độ phủ</b> 0; 0,01; …; 1 như bộ chấm của COCO: 34 + 33 mức đầu đọc được 1, 34 mức cuối đọc được 0,75:</p>
          $$\frac{34 + 33 + 34 \cdot 0{,}75}{101} \approx 0{,}916$$
          <p class="note">Gần khớp 0,917: hai cách chỉ khác nhau ở chỗ lấy mẫu độ phủ.</p>
        introduces: [dots]
        focus: [1, 2, 3]
        say: "Kiểm tra thứ hai đọc đường bao tại 101 mức độ phủ từ 0 tới 1, cách nhau 0 phẩy 01, như bộ chấm của một bộ dữ liệu lớn. Có 67 mức đọc được 1 và 34 mức cuối đọc được 0 phẩy 75, nên trung bình xấp xỉ 0 phẩy 916. Kết quả gần khớp 0 phẩy 917, vì hai cách chỉ khác ở chỗ lấy mẫu."

  # ───────────────────────── 9. NGƯỠNG KHÁC ─────────────────────────
  - id: threshold
    kind: example
    title: "Đổi ngưỡng ghép: 0,75 và trung bình mười ngưỡng"
    checks:
      - "alg.cvi_match_dets([(0.95, (1, 0, 11, 10)), (0.9, (23, 0, 33, 10)), (0.8, (60, 0, 70, 10)), (0.6, (41, 1, 50, 10)), (0.4, (80, 0, 90, 10))], [(0, 0, 10, 10), (20, 0, 30, 10), (40, 0, 50, 10)], 0.75) == [True, False, False, True, False]"
      - "alg.cvi_ap([True, False, False, True, False], 3) == 0.5 and round(1 / 3 * 1 + 1 / 3 * 0.5, 3) == 0.5"
      - "(lambda D, G: round(sum(alg.cvi_ap(alg.cvi_match_dets(D, G, round(0.5 + 0.05 * i, 2)), 3) for i in range(10)) / 10, 3))([(0.95, (1, 0, 11, 10)), (0.9, (23, 0, 33, 10)), (0.8, (60, 0, 70, 10)), (0.6, (41, 1, 50, 10)), (0.4, (80, 0, 90, 10))], [(0, 0, 10, 10), (20, 0, 30, 10), (40, 0, 50, 10)]) == 0.392"
      - "round((0.917 + 6 * 0.5 + 3 * 0) / 10, 3) == 0.392"
    steps:
      - show: |
          <p><b>Ngưỡng 0,75.</b> Phát hiện 2 chỉ chồng 0,538 nên thành <b>sai</b>. Dãy: đúng, sai, sai, đúng, sai; độ phủ chỉ tới 2/3.</p>
          $$\text{AP}_{0{,}75} = \frac{1}{3} \cdot 1 + \frac{1}{3} \cdot 0{,}5 = \hlo{0{,}5}$$
          <p class="note">Con số của kỹ sư thứ hai: cùng mô hình, chỉ đổi yêu cầu hộp phải khít hơn.</p>
        focus: [1, 2, 3]
        say: "Với ngưỡng 0 phẩy 75, phát hiện 2 chỉ chồng 0 phẩy 538 nên thành sai, dãy là đúng, sai, sai, đúng, sai, và độ phủ chỉ tới 2 phần 3. Đường bao có hai bậc, cao 1 và 0 phẩy 5, nên độ chính xác trung bình bằng 0 phẩy 5. Đó là con số của kỹ sư thứ hai, cùng mô hình, chỉ đổi yêu cầu hộp phải khít hơn."
      - show: |
          <table class="t"><tr><th>ngưỡng</th><th>0,50</th><th>0,55 tới 0,80 (6 ngưỡng)</th><th>0,85; 0,90; 0,95</th></tr>
          <tr><td>AP</td><td>0,917</td><td>0,5</td><td>0 (không hộp nào đủ khít)</td></tr></table>
          <p>Bộ chấm của COCO lấy trung bình 10 ngưỡng 0,50; 0,55; …; 0,95: $\frac{0{,}917 + 6 \cdot 0{,}5 + 3 \cdot 0}{10} \approx \hlo{0{,}392}$.</p>
        focus: [1, 1, 2]
        say: "Bảng quét mười ngưỡng. Ở 0 phẩy 5 ta có 0 phẩy 917, từ 0 phẩy 55 tới 0 phẩy 8 chỉ còn 0 phẩy 5, và từ 0 phẩy 85 trở lên bằng 0 vì không hộp nào đủ khít. Bộ chấm của một bộ dữ liệu lớn hay dùng lấy trung bình mười ngưỡng này, được khoảng 0 phẩy 392, một con số thứ ba cho cùng mô hình."

  # ───────────────────────── 10. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "alg.cvi_match_dets([(0.95, (1, 0, 11, 10)), (0.93, (0, 1, 10, 11)), (0.9, (23, 0, 33, 10)), (0.8, (60, 0, 70, 10)), (0.6, (41, 1, 50, 10)), (0.4, (80, 0, 90, 10))], [(0, 0, 10, 10), (20, 0, 30, 10), (40, 0, 50, 10)], 0.5) == [True, False, True, False, True, False]"
      - "round(alg.cvi_ap([True, False, True, False, True, False], 3), 3) == 0.756 and round(alg.cvi_box_iou((0, 1, 10, 11), (1, 0, 11, 10))[2], 3) == 0.681"
      - "alg.cvi_box_iou((0, 0, 4, 4), (1, 0, 5, 4))[2] == 0.6 and round(alg.cvi_box_iou((0, 0, 100, 100), (1, 0, 101, 100))[2], 2) == 0.98"
      - "round(min(0.5, 4 * 4 / ((4 + 10) * (4 + 10))), 3) == 0.082"
      - "alg.cvi_xywh_to_xyxy((5, 5, 10, 10)) == (5, 5, 15, 15) and alg.cvi_box_iou((5, 5, 15, 15), (5, 5, 10, 10))[2] == 0.25"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên loại bỏ không cực đại <b class="red">(hộp trùng bị chấm sai: AP 0,917 tụt còn 0,756)</b>
          <br><span class="note">Thêm một hộp thứ hai điểm 0,93 cũng ôm người $G_1$: người đó đã được ghép, nên hộp này thành <b>sai</b>. Cách chấm phạt cả phát hiện trùng lẫn phát hiện thừa. Hai hộp ấy chồng nhau 0,681, loại bỏ không cực đại đã bỏ được nó.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ nhất là quên loại bỏ không cực đại, làm điểm tụt từ 0 phẩy 917 còn 0 phẩy 756. Một hộp thứ hai điểm 0 phẩy 93 cũng ôm người G một, mà người đó đã được ghép, nên hộp này bị chấm sai vì cách chấm phạt cả phát hiện trùng. Hai hộp ấy chồng nhau 0 phẩy 681, nên bước loại bỏ đã bỏ được nó."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Báo AP mà không ghi ngưỡng <b class="red">(0,917, 0,5 hay 0,392?)</b>
          <br><span class="note">Cùng mô hình cho ba con số. So hai bài báo, hai đội, hai phiên bản: phải cùng ngưỡng, cùng cách lấy trung bình, cùng tập ảnh.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ hai là báo độ chính xác trung bình mà không ghi ngưỡng, vì cùng một mô hình cho ba con số 0 phẩy 917, 0 phẩy 5 và 0 phẩy 392. Khi so hai bài báo, hai đội hay hai phiên bản, phải cùng ngưỡng, cùng cách lấy trung bình, và cùng tập ảnh."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng một ngưỡng cứng cho vật rất nhỏ <b class="red">(lệch 1 điểm ảnh đã mất 40%)</b></div>
          <table class="t"><tr><th>hộp lệch 1 điểm ảnh</th><th>IoU</th></tr>
          <tr><td>vật 4 × 4</td><td>0,6 — sát ngưỡng 0,5</td></tr>
          <tr><td>vật 100 × 100</td><td>0,98</td></tr></table>
          <p class="note">Cuộc thi nhận dạng ảnh quy mô lớn (Russakovsky và cộng sự, 2015) nới ngưỡng cho vật nhỏ: $\min\big(0{,}5,\ \frac{w h}{(w + 10)(h + 10)}\big)$ — vật 4 × 4 chỉ cần 0,082.</p>
        focus: [1, ["2.2", "2.3"], 3]
        say: "Lỗi thứ ba là dùng một ngưỡng cứng cho vật rất nhỏ. Vật 4 nhân 4 lệch chỉ 1 điểm ảnh đã còn 0 phẩy 6, sát ngưỡng, còn vật 100 nhân 100 vẫn được 0 phẩy 98. Vì vậy cuộc thi nhận dạng ảnh quy mô lớn, theo bài tổng kết năm 2015, nới ngưỡng cho vật nhỏ, vật 4 nhân 4 chỉ cần 0 phẩy 082."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Lẫn cách ghi hộp <b class="red">(hộp đúng bị chấm sai)</b>
          <br><span class="note">Bộ dữ liệu COCO ghi hộp là <b>[x, y, rộng, cao]</b>. Hộp [5, 5, 10, 10] nghĩa là (5, 5, 15, 15); đọc nhầm thành góc (5, 5, 10, 10) thì chỉ còn 5 × 5 và giao trên hợp với hộp thật chỉ 0,25 — một phát hiện đúng thành sai. Phép thử: vẽ hộp thật và hộp đoán lên vài ảnh trước khi chấm cả tập.</span></div>
        focus: [1, 1, 1, 1]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm là lẫn cách ghi hộp. Một bộ dữ liệu lớn rất phổ biến ghi hộp là x, y, rộng, cao, nên 5, 5, 10, 10 đi từ 5, 5 tới 15, 15. Đọc nhầm thành hai góc thì hộp chỉ còn 5 nhân 5, giao trên hợp với hộp thật chỉ 0 phẩy 25. Phép thử là vẽ hộp thật và hộp đoán lên vài ảnh trước khi chấm cả tập."

  # ───────────────────────── 11. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: một giao trên hợp, một lượt loại bỏ, rồi chọn ngưỡng báo cáo"
    checks:
      - "alg.cvi_box_iou((0, 0, 4, 4), (2, 0, 6, 4)) == (8, 24, 1 / 3)"
      - "alg.cvi_nms([(0, 0, 4, 4), (2, 0, 6, 4), (1, 0, 5, 4)], [0.9, 0.8, 0.7], 0.5) == [0, 1] and alg.cvi_box_iou((0, 0, 4, 4), (1, 0, 5, 4))[2] == 0.6"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Giao trên hợp của (0, 0, 4, 4) và (2, 0, 6, 4)?</td></tr>
          <tr><td>2</td><td>Ba hộp (0, 0, 4, 4) điểm 0,9; (2, 0, 6, 4) điểm 0,8; (1, 0, 5, 4) điểm 0,7. Chạy loại bỏ không cực đại, ngưỡng 0,5: giữ hộp nào?</td></tr>
          <tr><td>3</td><td>Camera A đếm người qua cổng; camera B dẫn cánh tay robot gắp linh kiện. Mỗi bên báo AP ở ngưỡng nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn. Câu một, tính giao trên hợp của hai hộp trong bảng. Câu hai, chạy loại bỏ không cực đại với ngưỡng 0 phẩy 5 trên ba hộp, giữ hộp nào? Câu ba, camera A đếm người qua cổng, camera B dẫn cánh tay robot gắp linh kiện, mỗi bên báo ở ngưỡng nào? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Câu 1.</b> Rộng giao $\min(4, 6) - \max(0, 2) = 2$, cao 4, giao $= 8$; hợp $= 16 + 16 - 8 = 24$; IoU $= \frac{8}{24} = \hlg{\frac{1}{3}}$.</p>
          <p><b>Câu 2.</b> Giữ (0, 0, 4, 4). Hộp (2, 0, 6, 4) chồng $\frac{1}{3}$, không lớn hơn 0,5 → giữ. Hộp (1, 0, 5, 4) chồng 0,6 với hộp đầu → bỏ. Kết quả: <b>giữ hộp 1 và 2</b>.</p>
        focus: [1, 1, 2, 2]
        say: "Câu một, chiều rộng giao là 4 trừ 2, bằng 2, chiều cao 4, nên giao bằng 8. Hợp bằng 16 cộng 16 trừ 8, bằng 24, nên giao trên hợp là một phần ba. Câu hai, ta giữ hộp đầu có điểm cao nhất, hộp thứ hai chỉ chồng một phần ba nên được giữ. Hộp thứ ba chồng 0 phẩy 6 với hộp đầu nên bị bỏ, kết quả là giữ hộp 1 và hộp 2."
      - show: |
          <table class="t"><tr><th>câu 3</th><th>cần gì</th><th>báo ngưỡng</th><th>đánh đổi</th></tr>
          <tr><td>A: đếm người</td><td>đủ người, không đếm trùng; hộp hơi lệch vẫn được</td><td>0,5</td><td>ngưỡng lỏng không thấy hộp lệch nửa người</td></tr>
          <tr><td>B: robot gắp</td><td>vị trí khít, lệch vài điểm ảnh là gắp trượt</td><td>0,75, kèm trung bình 0,5 tới 0,95</td><td>con số thấp hơn nhiều, nhưng nói đúng điều robot cần</td></tr></table>
          <p class="note">Báo cáo luôn ghi: ngưỡng, cách lấy trung bình, tập ảnh.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Câu ba là quyết định theo việc cần làm. Đếm người cần đủ người, không đếm trùng, hộp hơi lệch vẫn được, nên báo ở ngưỡng 0 phẩy 5. Robot gắp cần vị trí khít, nên báo ở 0 phẩy 75 kèm trung bình mười ngưỡng, con số thấp hơn nhưng nói đúng điều robot cần. Dù chọn gì, báo cáo luôn ghi ngưỡng, cách lấy trung bình và tập ảnh."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">giao trên hợp: giao chia hợp</span><span class="a">→</span>
          <span class="n">loại bỏ không cực đại: một vật một hộp</span><span class="a">→</span>
          <span class="n">ghép theo điểm: đúng, sai, phạt hộp trùng</span><span class="a">→</span>
          <span class="n">độ chuẩn xác theo độ phủ: diện tích là AP</span><span class="a">→</span>
          <span class="n">ngưỡng 0,5 / 0,75 / trung bình: ba con số</span></div>
        say: "Tổng kết lại, giao trên hợp đo hai hộp chồng nhau bao nhiêu, và loại bỏ không cực đại giữ mỗi vật một hộp. Ghép theo điểm cho dãy đúng sai, rồi diện tích dưới đường độ chuẩn xác theo độ phủ là độ chính xác trung bình. Cùng một mô hình cho ba con số tuỳ ngưỡng."
      - show: |
          <div class="box key"><b>Tư duy:</b> một con số đánh giá chỉ có nghĩa kèm <b>luật chấm</b> của nó. Trước khi so hai mô hình, hãy hỏi: ngưỡng bao nhiêu, ghép thế nào, trung bình qua cái gì?</div>
        say: "Điều cần mang theo, một con số đánh giá chỉ có nghĩa khi đi kèm luật chấm của nó. Trước khi so hai mô hình, hãy hỏi ngưỡng bao nhiêu, ghép thế nào, và trung bình qua cái gì."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>phân đoạn ảnh</b> — thay vì vẽ hộp, tô từng điểm ảnh thuộc vật; đo bằng giao trên hợp trên điểm ảnh và hệ số chồng lấp, và vì sao vật nhỏ làm độ chính xác điểm ảnh đánh lừa ta.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học phân đoạn ảnh, tức tô từng điểm ảnh thuộc vật thay vì vẽ hộp. Ta đo bằng giao trên hợp trên điểm ảnh và hệ số chồng lấp. Hẹn gặp bạn ở bài tiếp theo."
