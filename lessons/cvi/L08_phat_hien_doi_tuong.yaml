source: "curriculum/cvi.yaml L08; audit/cvi/verify_cvi.py L08; audit/cvi/sources_L08.md; [R15] O. Russakovsky và cộng sự, ImageNet Large Scale Visual Recognition Challenge, IJCV 2015, arXiv:1409.0575, mục 4.2–4.3 và thuật toán 2 (tiêu chí giao trên hợp lớn hơn 0,5 theo Everingham và cộng sự 2010; ghép tham lam theo điểm; phạt phát hiện trùng; ngưỡng nới cho vật nhỏ); [Y16] J. Redmon và cộng sự, You Only Look Once, arXiv:1506.02640 (45 khung mỗi giây, 63,4 mAP trên PASCAL VOC 2007; loại bỏ không cực đại); [COCO] kho cocoapi chính thức, cocoeval.py (10 ngưỡng 0,5 tới 0,95, 101 mức độ phủ) và coco.py (hộp ghi [x, y, rộng, cao]); CS115 bài 21 (độ chuẩn xác, độ phủ — đã học)"
assumes: [arith, cdot, frac, approx, geq, sub]
# Quy ước: hộp viết (x1, y1, x2, y2) — góc trên trái, góc dưới phải, toạ độ liên tục, diện tích (x2 − x1)·(y2 − y1) (alg.cvi_box_iou).
#   Giao trên hợp viết IoU trên màn hình; lời đọc nói “giao trên hợp”. Một phát hiện = (điểm tin cậy, hộp). Ghép tham lam theo [R15]
#   thuật toán 2 (alg.cvi_match_dets): xếp phát hiện theo điểm giảm dần, mỗi phát hiện lấy hộp thật chưa ghép có giao trên hợp ≥ ngưỡng
#   lớn nhất. AP = diện tích dưới đường độ chuẩn xác đã nội suy (lấy giá trị lớn nhất phía độ phủ cao hơn) (alg.cvi_ap 'all');
#   cocoeval đọc tại 101 mức độ phủ (alg.cvi_ap101) — với ví dụ của bài hai cách cho cùng 0,392 khi lấy trung bình 10 ngưỡng.
#   Ba người, các hộp, điểm tin cậy, lớp “xe” AP 0,60 là SỐ MINH HOẠ. Tên PASCAL VOC, COCO, YOLO, ILSVRC chỉ trên màn hình.
#   Không dạy cách “11 điểm” của PASCAL VOC 2007: bài báo Everingham 2010 chưa đọc được (NOT_VERIFIED, sources_L08.md).
objectives:
  - "Tính giao trên hợp của hai hộp từ toạ độ góc"
  - "Chạy loại bỏ không cực đại để giữ một hộp cho mỗi vật"
  - "Ghép phát hiện với hộp thật, dựng đường độ chuẩn xác – độ phủ và tính độ chính xác trung bình"
  - "Giải thích vì sao ngưỡng giao trên hợp 0,5 hay 0,75 đổi hẳn con số, và báo cáo phải ghi ngưỡng"
asr_reviewed:
  - {sentence: "Bảng quét mười ngưỡng.", reason: "ASR chép “Bản quét 10 ngưỡng.” (0.75): lệch âm/thanh thuần Việt: bảng/bản — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ghép theo điểm cho dãy đúng sai, rồi diện tích dưới đường độ chuẩn xác theo độ phủ là độ chính xác trung bình.", reason: "ASR chép “Gép theo điểm cho dạy đúng sai, rồi diện tích dưới đường đồ chuẩn xác theo đồ phủ là đồ chính xác trung bình.” (0.792): lệch âm/thanh thuần Việt: ghép/gép, dãy/dạy, độ/đồ, độ/đồ, độ/đồ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Số ô nằm trong cả A lẫn B là 25, số ô nằm trong ít nhất một hộp là 175, khớp tỉ số 25 phần 175 mà không cần công thức.", reason: "ASR chép “Số O nằm trong cả A lẫn B là 25, số O nằm trong ít nhất một hộp là 175, khớp tỷ số 25 phần 175 mà không cần công thức.” (0.93): “ô” (ô lưới) ASR viết chữ “O”; “tỉ” ASR viết chính tả “tỷ” (cùng âm) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bên phải, C và D lệch nhau một điểm ảnh, giao bằng 90, hợp bằng 110.", reason: "ASR chép “Bên phải, xe và dây lệch nhau một điểm ảnh, giao bằng 90, hợp bằng 110.” (0.947): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng một mô hình, hai báo cáo: 0,917 và 0,5"
    checks:
      - "round(alg.cvi_ap(alg.cvi_match_dets([(0.95, (1, 0, 11, 10)), (0.9, (23, 0, 33, 10)), (0.8, (60, 0, 70, 10)), (0.6, (41, 1, 50, 10)), (0.4, (80, 0, 90, 10))], [(0, 0, 10, 10), (20, 0, 30, 10), (40, 0, 50, 10)], 0.5), 3), 3) == 0.917"
      - "alg.cvi_ap(alg.cvi_match_dets([(0.95, (1, 0, 11, 10)), (0.9, (23, 0, 33, 10)), (0.8, (60, 0, 70, 10)), (0.6, (41, 1, 50, 10)), (0.4, (80, 0, 90, 10))], [(0, 0, 10, 10), (20, 0, 30, 10), (40, 0, 50, 10)], 0.75), 3) == 0.5"
    steps:
      - show: |
          <p>Một đội làm camera đếm người qua cổng. Hai kỹ sư chấm <b>cùng một mô hình</b> trên <b>cùng một ảnh</b>: người thứ nhất báo độ chính xác trung bình <b>0,917</b>, người thứ hai báo <b>0,5</b>. Không ai tính sai.</p>
          <div class="box key">Hôm nay: thế nào là “tìm đúng” một vật? Vì sao một vật chỉ được giữ một hộp? Và con số độ chính xác trung bình được dựng từ đâu, phụ thuộc vào điều gì?</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một đội làm camera đếm người qua cổng. Hai kỹ sư chấm cùng một mô hình trên cùng một ảnh, người thứ nhất báo độ chính xác trung bình 0 phẩy 917, người thứ hai báo 0 phẩy 5. Không ai tính sai cả. Hôm nay ta hỏi, thế nào là tìm đúng một vật, vì sao mỗi vật chỉ giữ một hộp, và con số này được dựng từ đâu."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "Fraction(9, 9 + 99) == Fraction(1, 12) and Fraction(9, 9 + 1) == Fraction(9, 10)"
      - "(15 - 5) * (12 - 2) == 100"
      - "max(0, min(10, 15) - max(0, 5)) == 5 and max(0, min(10, 30) - max(0, 20)) == 0"
    steps:
      - show: |
          <p><b>① Độ chuẩn xác và độ phủ</b> (khoá Toán cho khoa học máy tính, phần đánh giá phân loại): độ chuẩn xác $= \frac{TP}{TP + FP}$ — trong các lần máy báo, bao nhiêu lần đúng; độ phủ $= \frac{TP}{TP + FN}$ — trong các vật thật, máy tìm ra bao nhiêu.</p>
          <p class="note">Ví dụ xét nghiệm: 9 đúng, 99 báo nhầm, 1 bỏ sót → độ chuẩn xác $\frac{9}{108} = \frac{1}{12}$, độ phủ $\frac{9}{10}$.</p>
        focus: [1, 1, 2]
        say: "Điều thứ nhất là độ chuẩn xác và độ phủ, như ở khoá Toán cho khoa học máy tính, phần đánh giá phân loại. Độ chuẩn xác là số lần đúng chia số lần máy báo, độ phủ là số lần đúng chia số vật thật. Với 9 đúng, 99 báo nhầm và 1 bỏ sót, ta được một phần mười hai và chín phần mười."
      - show: |
          <p><b>② Diện tích hình chữ nhật</b> từ hai góc: rộng $= x_2 - x_1$, cao $= y_2 - y_1$. Hộp từ (5, 2) tới (15, 12):</p>
          $$(15 - 5) \cdot (12 - 2) = 10 \cdot 10 = 100$$
        focus: [1, 2]
        say: "Điều thứ hai là diện tích hình chữ nhật khi biết hai góc. Chiều rộng là x hai trừ x một, chiều cao là y hai trừ y một, nên hộp từ điểm 5, 2 tới điểm 15, 12 có diện tích 10 nhân 10, bằng 100."
      - show: |
          <p><b>③ Phần chung của hai đoạn thẳng:</b> đoạn [0, 10] và [5, 15] chung từ $\max(0, 5) = 5$ tới $\min(10, 15) = 10$, dài 5. Hai đoạn rời nhau [0, 10] và [20, 30]: $10 - 20 \lt 0$, nên độ dài chung lấy bằng 0.</p>
        introduces: [max_fn, min_fn, ltgt]
        focus: [1, 1]
        say: "Điều thứ ba là phần chung của hai đoạn thẳng, bắt đầu ở đầu trái lớn hơn và kết thúc ở đầu phải nhỏ hơn. Đoạn 0 tới 10 và đoạn 5 tới 15 chung từ 5 tới 10, dài 5, còn hai đoạn rời nhau cho hiệu âm, nên độ dài chung lấy bằng 0."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hộp, giao, hợp, IoU và AP"
    checks:
      - "alg.cvi_box_iou((0, 0, 10, 10), (5, 5, 15, 15))[:2] == (25, 175)"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$(x_1, y_1, x_2, y_2)$</td><td>một hộp: góc trên trái $(x_1, y_1)$, góc dưới phải $(x_2, y_2)$; trục $y$ hướng xuống như hàng điểm ảnh</td></tr>
          <tr><td>$A \cap B$</td><td>giao: phần thuộc cả hai hộp</td></tr>
          <tr><td>$A \cup B$</td><td>hợp: phần thuộc ít nhất một hộp</td></tr>
          <tr><td>$\text{IoU}(A, B) = \dfrac{\text{diện tích } A \cap B}{\text{diện tích } A \cup B}$</td><td>giao trên hợp: 0 là rời nhau, 1 là trùng khít</td></tr></table>
        introduces: [cap, cup]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu các ký hiệu. Một hộp ghi bằng góc trên trái và góc dưới phải, trục y hướng xuống như hàng điểm ảnh. Chữ U ngược là phép giao, phần thuộc cả hai hộp. Chữ U xuôi là phép hợp, phần thuộc ít nhất một hộp. Giao trên hợp là diện tích giao chia diện tích hợp, từ 0 khi rời nhau tới 1 khi trùng khít."
      - clear: true
        show: |
          <p><b>AP</b> (độ chính xác trung bình) của <b>một lớp</b> vật: diện tích dưới đường độ chuẩn xác – độ phủ, đi từ 0 tới 1. <b>mAP</b>: trung bình AP của mọi lớp.</p>
          <p class="note">Ví dụ (số minh hoạ): lớp “người” AP 0,917, lớp “xe” AP 0,60 → mAP $= \frac{0{,}917 + 0{,}60}{2} \approx 0{,}758$.</p>
        focus: [1, 1, 2]
        say: "Độ chính xác trung bình của một lớp vật là diện tích dưới đường độ chuẩn xác theo độ phủ, nằm trong khoảng 0 tới 1. Lấy trung bình qua mọi lớp, ta được độ chính xác trung bình của cả mô hình. Ví dụ với số minh hoạ, lớp người được 0 phẩy 917, lớp xe được 0 phẩy 6, trung bình là khoảng 0 phẩy 758."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai cặp hộp: lệch nửa cạnh và lệch một điểm ảnh"
    checks:
      - "alg.cvi_box_iou((0, 0, 10, 10), (5, 5, 15, 15)) == (25, 175, 25 / 175) and round(25 / 175, 3) == 0.143"
      - "alg.cvi_box_iou((0, 0, 10, 10), (1, 0, 11, 10))[:2] == (90, 110) and round(90 / 110, 3) == 0.818"
    steps:
      - show: |
          <div><svg width="1400" height="420" viewBox="0 0 1400 420">
          <rect x="100" y="60" width="200" height="200" fill="#dbeafe" fill-opacity="0.6" stroke="#2a78d6" stroke-width="3"/>
          <rect x="200" y="160" width="200" height="200" fill="#ffedd5" fill-opacity="0.6" stroke="#eb6834" stroke-width="3"/>
          <rect x="200" y="160" width="100" height="100" fill="#059669" fill-opacity="0.45"/>
          <rect x="1000" y="60" width="200" height="200" fill="#dbeafe" fill-opacity="0.6" stroke="#2a78d6" stroke-width="3"/>
          <rect x="1020" y="60" width="200" height="200" fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="10 6"/>
          <rect x="1020" y="60" width="180" height="200" fill="#059669" fill-opacity="0.35"/>
          <g font-size="24" fill="#1f2937">
          <text x="85" y="110" text-anchor="end">A</text><text x="415" y="320">B</text>
          <text x="250" y="218" text-anchor="middle" font-size="21">giao 25</text>
          <text x="985" y="165" text-anchor="end">C</text><text x="1235" y="165">D</text>
          <text x="1110" y="170" text-anchor="middle" font-size="21">giao 90</text></g>
          <g font-size="23" fill="#1f2937">
          <text x="470" y="120">A: (0, 0, 10, 10); B: (5, 5, 15, 15)</text>
          <text x="470" y="170">hợp = 100 + 100 − 25 = 175</text>
          <text x="470" y="220" fill="#dc2626">IoU = 25 / 175 ≈ 0,143: hai vật khác nhau</text></g>
          <g font-size="23" fill="#1f2937" text-anchor="middle">
          <text x="1110" y="310">C: (0, 0, 10, 10); D: (1, 0, 11, 10)</text>
          <text x="1110" y="350">hợp = 100 + 100 − 90 = 110</text>
          <text x="1110" y="390" fill="#059669">IoU = 90 / 110 ≈ 0,818: cùng một vật</text></g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Bên trái, hai hộp A và B cỡ 10 nhân 10 lệch nhau nửa cạnh, phần giao màu lục chỉ 5 nhân 5, bằng 25. Hợp là 100 cộng 100 trừ 25, bằng 175, nên giao trên hợp chỉ khoảng 0 phẩy 143, coi là hai vật khác nhau. Bên phải, C và D lệch nhau một điểm ảnh, giao bằng 90, hợp bằng 110. Giao trên hợp khoảng 0 phẩy 818, rõ ràng là cùng một vật."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra giao trên hợp: giao theo từng chiều, hợp trừ phần đếm hai lần"
    checks:
      - "max(0, min(10, 15) - max(0, 5)) == 5 and max(0, min(10, 15) - max(0, 5)) * max(0, min(10, 15) - max(0, 5)) == 25"
      - "100 + 100 - 25 == 175 and round(25 / 175, 3) == 0.143"
      - "alg.cvi_box_iou((0, 0, 10, 10), (20, 0, 30, 10))[2] == 0"
    steps:
      - show: |
          <p><b>Bước 1 — giao theo từng chiều.</b> Phần giao của hai hộp cũng là một hình chữ nhật, nên theo điều ③, chiều rộng của nó là phần chung của hai đoạn trên trục $x$, chiều cao là phần chung trên trục $y$:</p>
          $$\text{rộng giao} = \max\big(0,\ \min(x_2^A, x_2^B) - \max(x_1^A, x_1^B)\big)$$
          <p class="note">Làm thử A, B: $\max(0, \min(10, 15) - \max(0, 5)) = 5$; chiều cao cũng 5; giao $= 5 \cdot 5 = 25$.</p>
        introduces: [power]
        focus: [1, 1, 2, 3]
        say: "Bước một là giao theo từng chiều. Phần giao của hai hộp cũng là một hình chữ nhật, nên theo điều thứ ba, chiều rộng của nó là phần chung của hai đoạn trên trục x, chiều cao là phần chung trên trục y. Chỉ số trên A và B cho biết toạ độ đó của hộp nào. Làm thử với A và B, chiều rộng giao là 10 trừ 5, bằng 5, chiều cao cũng 5, nên giao bằng 25."
      - show: |
          <p><b>Bước 2 — hợp.</b> Cộng hai diện tích thì phần giao bị <b>đếm hai lần</b>, nên trừ đi một lần:</p>
          $$\text{hợp} = \text{diện tích } A + \text{diện tích } B - \text{giao} = 100 + 100 - 25 = 175$$
        focus: [1, 2]
        say: "Bước hai là phần hợp. Cộng hai diện tích thì phần giao bị đếm hai lần, nên ta trừ đi một lần, được 100 cộng 100 trừ 25, bằng 175."
      - show: |
          <p><b>Bước 3 — chia.</b> $\text{IoU} = \frac{25}{175} \approx 0{,}143$. Hai hộp rời nhau, như (0, 0, 10, 10) và (20, 0, 30, 10), cho rộng giao $\max(0, 10 - 20) = 0$, nên giao trên hợp bằng 0 chứ không âm.</p>
        focus: [1, 1]
        say: "Bước ba, chia giao cho hợp, được 25 chia 175, xấp xỉ 0 phẩy 143. Với hai hộp rời nhau, chiều rộng giao là số lớn hơn giữa 0 và một số âm, tức bằng 0, nên giao trên hợp bằng 0 chứ không bao giờ âm."

  # ───────────────────────── 6. LOẠI BỎ KHÔNG CỰC ĐẠI ─────────────────────────
  - id: nms
    kind: concept
    title: "Loại bỏ không cực đại: mỗi vật giữ một hộp có điểm cao nhất"
    checks:
      - "alg.cvi_nms([(0, 0, 10, 10), (1, 0, 11, 10), (5, 5, 15, 15)], [0.9, 0.8, 0.7], 0.5) == [0, 2]"
      - "alg.cvi_box_iou((0, 0, 10, 10), (1, 0, 11, 10))[2] > 0.5 > alg.cvi_box_iou((0, 0, 10, 10), (5, 5, 15, 15))[2]"
    steps:
      - show: |
          <p>Mạng phát hiện thường cho <b>nhiều hộp chồng nhau</b> quanh cùng một vật. Quy trình loại bỏ không cực đại, ngưỡng 0,5:</p>
          <table class="t"><tr><th>bước</th><th>việc làm</th></tr>
          <tr><td>1</td><td>xếp các hộp theo điểm tin cậy, giảm dần</td></tr>
          <tr><td>2</td><td>giữ hộp điểm cao nhất còn lại</td></tr>
          <tr><td>3</td><td>bỏ mọi hộp có giao trên hợp với nó lớn hơn 0,5</td></tr>
          <tr><td>4</td><td>còn hộp thì quay lại bước 2</td></tr></table>
        focus: [1, "2.2", "2.3", ["2.4", "2.5"]]
