# Quy ước (giữ như ROB bài 11): hệ camera Z hướng ra trước, X sang phải, Y xuống dưới; toạ độ chuẩn hoá x = X/Z, y = Y/Z;
#   điểm ảnh u = f_x·x + c_x, v = f_y·y + c_y. Ma trận nội K (chữ K in đậm) = [f_x 0 c_x; 0 f_y c_y; 0 0 1]; K nhân (X, Y, Z) ra
#   (u·Z, v·Z, Z) rồi chia số cuối (alg.cvi_project). Méo hướng tâm trên toạ độ chuẩn hoá: x_méo = x·(1 + k1·r²), r² = x² + y²
#   (alg.cvi_distort; bài chỉ dùng k1). Sai số chiếu lại = căn trung bình bình phương khoảng cách (alg.cvi_rmse).
#   Ảnh 640 × 480, f = 800 điểm ảnh, tâm (320, 240), k1 = −0,2, ống kính 4 mm, điểm cảm biến 0,005 mm là SỐ MINH HOẠ.
objectives:
  - "Chiếu một điểm 3D lên ảnh bằng ma trận nội: nhân rồi chia cho số cuối"
  - "Tính góc nhìn từ tiêu cự và bề rộng ảnh; đổi tiêu cự milimét sang điểm ảnh"
  - "Tính độ lệch do méo hướng tâm ở tâm và ở góc ảnh"
  - "Đọc sai số chiếu lại và nhận ra khi nó nhỏ mà hiệu chuẩn vẫn sai"
