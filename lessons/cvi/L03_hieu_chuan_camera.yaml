        focus: [0, "1.2", "1.3", "1.4"]
        say: "Câu ba là một kế hoạch có lý do cho từng việc. Chụp ít nhất khoảng 10 ảnh bàn cờ phủ cả bốn góc và nhiều độ nghiêng, vì méo lớn nhất ở góc và sai số chiếu lại chỉ đo ở chỗ có điểm mẫu. Khoá nét, khoá thu phóng và ghi lại độ phân giải, vì tiêu cự trôi 5 phần trăm đã lệch 16 điểm ảnh. Mỗi ca làm việc, đo lại một vật mẫu biết trước kích thước ở giữa và ở góc, để phát hiện camera bị va hoặc tham số trôi."

