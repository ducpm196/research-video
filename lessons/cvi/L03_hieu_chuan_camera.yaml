  - {sentence: "Nửa ảnh rộng W chia 2 điểm ảnh và cách lỗ kim f x điểm ảnh, nên theo định nghĩa tang, tang của nửa góc nhìn bằng 320 chia 800, bằng 0 phẩy 4.", reason: "ASR chép “Nửa ảnh rộng về đúc chia 2 điểm ảnh và cách lỗ kim fx điểm ảnh nên theo định nhễ tan, tan của nửa gốc nhìn bằng 320 chia 800, bằng 0,4.” (0.857): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: nghĩa tang tang/nhễ tan tan, góc/gốc — NOT_VERIFIED bằng tai người"}
  - {sentence: "c x và c y là tâm ảnh, nơi trục nhìn thẳng chạm mặt ảnh, ở đây là 320, 240.", reason: "ASR chép “CX và CE là tâm ảnh nơi trục nhìn thẳng chạm mặt ảnh. Ở đây là 320, 240.” (0.941): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: i (trong “c i” → “ce”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sai số chiếu lại 0,16 điểm ảnh, mà góc ảnh lệch 20"
    checks:
      - "round(800 * 0.1 - 800 * alg.cvi_distort(0.1, 0, -0.2)[0], 2) == 0.16"
      - "math.hypot(640 - (800 * alg.cvi_distort(0.4, 0.3, -0.2)[0] + 320), 480 - (800 * alg.cvi_distort(0.4, 0.3, -0.2)[1] + 240)) == 20"
    steps:
      - show: |
          <p>Một nhóm hiệu chuẩn camera đo kích thước linh kiện trên băng chuyền. Họ chụp bàn cờ, nhưng bàn cờ chỉ nằm <b>giữa ảnh</b>. Phần mềm báo sai số chỉ <b>0,16 điểm ảnh</b> — rất tốt.</p>
          <p>Khi linh kiện chạy ra góc ảnh, phép đo lệch tới <b>20 điểm ảnh</b>.</p>
          <div class="box key">Hôm nay: ma trận nội của camera là gì? Ống kính bẻ cong đường thẳng ra sao? Và vì sao một sai số nhỏ chưa chắc là hiệu chuẩn tốt?</div>
        focus: [1, 1, 1, 2, 3]
        say: "Chào bạn, một nhóm hiệu chuẩn camera để đo kích thước linh kiện trên băng chuyền. Họ chụp bàn cờ, nhưng bàn cờ chỉ nằm ở giữa ảnh. Phần mềm báo sai số chỉ 0 phẩy 16 điểm ảnh, rất tốt. Thế nhưng khi linh kiện chạy ra góc ảnh, phép đo lệch tới 20 điểm ảnh. Hôm nay ta hỏi, ma trận nội của camera là gì, ống kính bẻ cong đường thẳng ra sao, và vì sao một sai số nhỏ chưa chắc là hiệu chuẩn tốt."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "800 * 0.5 / 2 + 320 == 520 and 0.5 / 2 == 0.25 and 800 * 0.25 == 200 and 200 + 320 == 520"
      - "np.array([[1, 2], [3, 4]]).dot([5, 6]).tolist() == [17, 39]"
      - "round(math.degrees(math.atan(1)), 6) == 45 and round(math.tan(math.radians(45)), 6) == 1"
    steps:
      - show: |
          <p><b>① Phép chiếu lỗ kim</b>: ánh sáng từ điểm $(X, Y, Z)$ — $X$ sang phải, $Y$ xuống dưới, $Z$ là độ sâu ra trước — đi qua một lỗ rất nhỏ rồi chạm mặt ảnh cách lỗ một đoạn $f$ (vẽ mặt ảnh trước lỗ để ảnh khỏi bị lật ngược). Hai tam giác đồng dạng (cùng góc, chỉ khác cỡ) nên $\frac{\text{độ lệch trên ảnh}}{f} = \frac{X}{Z}$, tức độ lệch $= f \cdot \frac{X}{Z}$. Cộng $c_x$ để đếm cột từ mép trái:</p>
          $$u = f \cdot \frac{X}{Z} + c_x$$
          <p class="note">Điểm $(0{,}5;\ 0{,}25;\ 2)$ m, $f = 800$, $c_x = 320$: $\frac{0{,}5}{2} = 0{,}25$; $800 \cdot 0{,}25 = 200$ điểm ảnh lệch khỏi tâm; $u = 200 + 320 = 520$.</p>
        focus: [1, 1, 1, 1, 2, 3, 3]
        say: "Trước hết, ta cần hiểu phép chiếu lỗ kim, cách camera đơn giản nhất biến một điểm ba chiều thành điểm ảnh. Ánh sáng từ điểm X, Y, Z đi qua một lỗ rất nhỏ, rồi chạm mặt ảnh cách lỗ một đoạn f, ta vẽ mặt ảnh trước lỗ để ảnh khỏi bị lật ngược. Ở đây X hướng sang phải, Y hướng xuống dưới, còn Z là độ sâu ra phía trước camera. Hai tam giác đồng dạng vì có cùng góc, nên độ lệch trên ảnh chia f bằng X chia Z, tức độ lệch bằng f nhân X chia Z. Cộng thêm c x để đếm cột từ mép trái, ta được u bằng f nhân X chia Z cộng c x. Lấy ví dụ điểm 0 phẩy 5, 0 phẩy 25, 2 mét, với f bằng 800 và c x bằng 320. Ta có 0 phẩy 5 chia 2 bằng 0 phẩy 25, nhân 800 được 200 điểm ảnh lệch khỏi tâm, cộng 320 thành u bằng 520."
      - clear: true
        show: |
          <p><b>② Nhân ma trận với vector</b>: ma trận là một bảng số xếp hàng và cột, vector là một cột số. Mỗi hàng của ma trận nhân từng cặp với vector rồi cộng, cho một số của kết quả.</p>
          $$\begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix} \begin{bmatrix} 5 \\ 6 \end{bmatrix} = \begin{bmatrix} 1 \cdot 5 + 2 \cdot 6 \\ 3 \cdot 5 + 4 \cdot 6 \end{bmatrix} = \begin{bmatrix} 17 \\ 39 \end{bmatrix}$$
        focus: [1, 1, 2]
        say: "Điều thứ hai là nhân ma trận với vector, trong đó ma trận là một bảng số xếp theo hàng và cột, còn vector là một cột số. Mỗi hàng của ma trận nhân từng cặp với vector rồi cộng lại, cho một số của kết quả. Hàng một cho 1 nhân 5 cộng 2 nhân 6, bằng 17, hàng hai cho 3 nhân 5 cộng 4 nhân 6, bằng 39."
      - show: |
          <p><b>③ Tang của một góc</b> trong tam giác vuông: cạnh đối chia cạnh kề, viết $\tan$. Góc 45° có cạnh đối bằng cạnh kề nên $\tan 45° = 1$. Ngược lại, biết tang là 1 thì góc là 45°.</p>
        introduces: [tan_fn]
        focus: [1, 1, 1]
        say: "Điều thứ ba là tang của một góc trong tam giác vuông, bằng cạnh đối chia cạnh kề, viết tắt là ba chữ t a n. Góc 45 độ có cạnh đối bằng cạnh kề, nên tang 45 độ bằng 1. Ngược lại, biết tang bằng 1 thì góc là 45 độ."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: f x, f y, c x, c y, ma trận nội K, hệ số méo k1"
    checks:
      - "4 / 0.005 == 800"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ (ảnh 640 × 480)</th></tr>
          <tr><td>$f_x,\ f_y$</td><td>tiêu cự tính bằng <b>điểm ảnh</b> theo ngang, theo dọc</td><td>800 và 800</td></tr>
          <tr><td>$c_x,\ c_y$</td><td>tâm ảnh: nơi trục nhìn thẳng chạm mặt ảnh</td><td>(320, 240)</td></tr>
          <tr><td>$k_1$</td><td>hệ số méo hướng tâm của ống kính</td><td>$-0{,}2$: điểm bị kéo vào trong</td></tr></table>
          <p class="note">Vì sao tính bằng điểm ảnh: ống kính 4 mm, mỗi điểm cảm biến rộng 0,005 mm, nên $\frac{4}{0{,}005} = 800$ điểm ảnh.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Bảng giới thiệu các tham số trong. f x và f y là tiêu cự tính bằng điểm ảnh theo ngang và theo dọc, ở đây đều là 800. c x và c y là tâm ảnh, nơi trục nhìn thẳng chạm mặt ảnh, ở đây là 320, 240. k một là hệ số méo hướng tâm của ống kính, âm 0 phẩy 2 nghĩa là điểm bị kéo vào trong. Tiêu cự tính bằng điểm ảnh vì ống kính 4 mi-li-mét chia cho bề rộng 0 phẩy 005 mi-li-mét của mỗi điểm cảm biến, bằng 800."
      - clear: true
        show: |
          <p>Ghép bốn số đầu thành <b>ma trận nội</b> $\mathbf{K}$ (chữ K in đậm, để khác bộ lọc ở bài 1):</p>
          $$\mathbf{K} = \begin{bmatrix} f_x & 0 & c_x \\ 0 & f_y & c_y \\ 0 & 0 & 1 \end{bmatrix} = \begin{bmatrix} 800 & 0 & 320 \\ 0 & 800 & 240 \\ 0 & 0 & 1 \end{bmatrix}$$
        introduces: [mat]
        focus: [1, 2, 2]
        say: "Ghép bốn số đó thành ma trận nội, viết bằng chữ K in đậm để khác với bộ lọc ở bài 1, là một ô nhỏ trượt trên ảnh. Hàng một là f x, 0, c x, hàng hai là 0, f y, c y, hàng ba là 0, 0, 1. Với số của ta, ba hàng là 800, 0, 320, rồi 0, 800, 240, rồi 0, 0, 1."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Từ điểm 3D tới điểm ảnh: chia cho Z, nhân tiêu cự, cộng tâm"
    checks:
      - "(0.5 / 2, 0.25 / 2) == (0.25, 0.125) and (800 * 0.25, 800 * 0.125) == (200, 100) and (200 + 320, 100 + 240) == (520, 340)"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330">
          <defs><marker id="cv3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
          <g stroke-width="2.5">
          <rect x="30" y="90" width="270" height="120" rx="12" fill="#dbeafe" stroke="#2a78d6"/>
          <rect x="400" y="90" width="270" height="120" rx="12" fill="#f3f4f6" stroke="#6b7280"/>
          <rect x="770" y="90" width="270" height="120" rx="12" fill="#ffedd5" stroke="#eb6834"/>
          <rect x="1140" y="90" width="330" height="120" rx="12" fill="#d1fae5" stroke="#059669"/></g>
          <g font-size="23" fill="#1f2937" text-anchor="middle">
          <text x="165" y="135" font-weight="bold">điểm 3D (mét)</text><text x="165" y="175">(0,5; 0,25; 2)</text>
          <text x="535" y="135" font-weight="bold">chia cho Z</text><text x="535" y="175">(0,25; 0,125)</text>
          <text x="905" y="135" font-weight="bold">nhân tiêu cự</text><text x="905" y="175">(200; 100)</text>
          <text x="1305" y="135" font-weight="bold">cộng tâm ảnh</text><text x="1305" y="175">u = 520, v = 340</text></g>
          <g stroke="#1f2937" stroke-width="3"><line x1="305" y1="150" x2="392" y2="150" marker-end="url(#cv3a)"/><line x1="675" y1="150" x2="762" y2="150" marker-end="url(#cv3a)"/><line x1="1045" y1="150" x2="1132" y2="150" marker-end="url(#cv3a)"/></g>
          <g font-size="21" fill="#6b7280" text-anchor="middle"><text x="535" y="250">mất độ sâu ở đây</text><text x="905" y="250">mét thành điểm ảnh</text><text x="1305" y="250">gốc dời về góc trên trái</text></g>
          <text x="750" y="305" font-size="22" fill="#1f2937" text-anchor="middle">ma trận nội làm gọn hai bước cuối trong một phép nhân</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình chia phép chiếu thành ba bước. Từ điểm 0 phẩy 5, 0 phẩy 25, 2 mét, ta chia cho Z được 0 phẩy 25 và 0 phẩy 125, và đây là chỗ mất độ sâu. Nhân tiêu cự 800 biến mét thành điểm ảnh, được 200 và 100. Cộng tâm ảnh dời gốc về góc trên trái, ra cột 520 và hàng 340, và ma trận nội làm gọn hai bước cuối trong một phép nhân."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra: nhân ma trận nội, rồi chia cho số cuối"
    checks:
      - "[sum(r * v for r, v in zip(row, (0.5, 0.25, 2))) for row in [[800, 0, 320], [0, 800, 240], [0, 0, 1]]] == [1040, 680, 2]"
      - "(1040 / 2, 680 / 2) == alg.cvi_project([[800, 0, 320], [0, 800, 240], [0, 0, 1]], 0.5, 0.25, 2) == (520, 340)"
      - "(800 * 0.5 + 320 * 2) / 2 == 800 * 0.5 / 2 + 320"
    steps:
      - show: |
          <p><b>Bước 1 — nhân.</b> Theo phép nhân ma trận với vector, $\mathbf{K}$ nhân với điểm $(X, Y, Z)$:</p>
          $$\mathbf{K} \begin{bmatrix} X \\ Y \\ Z \end{bmatrix} = \begin{bmatrix} f_x X + c_x Z \\ f_y Y + c_y Z \\ Z \end{bmatrix}$$
        focus: [1, 2]
        say: "Bước một là nhân, theo phép nhân ma trận với vector, ma trận nội nhân với điểm X, Y, Z. Hàng một cho f x nhân X cộng c x nhân Z, hàng hai cho f y nhân Y cộng c y nhân Z, hàng ba giữ nguyên Z."
      - show: |
          <p><b>Bước 2 — chia cho số cuối.</b> Chia hai số đầu cho $Z$, vì $\frac{f_x X + c_x Z}{Z} = f_x \frac{X}{Z} + c_x$:</p>
          $$u = \frac{f_x X + c_x Z}{Z} = f_x \cdot \frac{X}{Z} + c_x$$
          <p class="note">Đúng công thức lỗ kim đã ôn — ma trận chỉ là cách viết gọn, phép chia cho $Z$ là chỗ mất độ sâu.</p>
        focus: [1, 2, 3]
        say: "Bước hai là chia hai số đầu cho số cuối Z. Vì f x nhân X cộng c x nhân Z, chia cho Z, bằng f x nhân X chia Z cộng c x, ta được đúng công thức lỗ kim đã ôn. Ma trận chỉ là cách viết gọn, còn phép chia cho Z vẫn là chỗ mất độ sâu."
      - clear: true
        show: |
          <p><b>Bước 3 — góc nhìn từ tiêu cự.</b> Nửa ảnh rộng $\frac{W}{2}$ điểm ảnh, cách lỗ kim $f_x$ điểm ảnh, nên theo định nghĩa tang:</p>
          $$\tan\frac{\text{góc nhìn}}{2} = \frac{W / 2}{f_x} = \frac{320}{800} = 0{,}4 \;\Rightarrow\; \text{nửa góc} \approx 21{,}8° \text{ (bấm tang ngược)},\ \text{góc nhìn} \approx 2 \cdot 21{,}8° = 43{,}6°$$
          <p class="note">Tiêu cự càng lớn, góc nhìn càng hẹp: ống kính chụp xa.</p>
        focus: [1, 2, 2, 3]
        say: "Bước ba, suy ra góc nhìn từ tiêu cự. Nửa ảnh rộng W chia 2 điểm ảnh và cách lỗ kim f x điểm ảnh, nên theo định nghĩa tang, tang của nửa góc nhìn bằng 320 chia 800, bằng 0 phẩy 4. Vậy nửa góc khoảng 21 phẩy 8 độ, bấm nút tang ngược trên máy tính, và góc nhìn khoảng 43 phẩy 6 độ. Tiêu cự càng lớn thì góc nhìn càng hẹp, như ống kính chụp xa."

  # ───────────────────────── 6. MÉO ỐNG KÍNH ─────────────────────────
  - id: distort
    kind: concept
    title: "Méo hướng tâm: tâm không lệch, góc lệch nhiều"
    checks:
      - "alg.cvi_distort(0, 0, -0.2) == (0, 0) and alg.cvi_distort(0.4, 0.3, -0.2) == (0.38, 0.285)"
      - "round(0.4 ** 2 + 0.3 ** 2, 6) == 0.25 and round(1 - 0.2 * 0.25, 6) == 0.95"
    steps:
      - show: |
          <p>Ống kính thật bẻ tia sáng gần mép nhiều hơn gần tâm. Trên toạ độ chuẩn hoá $x = \frac{X}{Z}$, $y = \frac{Y}{Z}$, với $r^2 = x^2 + y^2$ là bình phương khoảng cách tới tâm:</p>
          $$x_{\text{méo}} = x \cdot (1 + k_1 r^2), \qquad y_{\text{méo}} = y \cdot (1 + k_1 r^2)$$
          <p class="note">Ở góc ảnh $x = 0{,}4$, $y = 0{,}3$: $r^2 = 0{,}16 + 0{,}09 = 0{,}25$; $k_1 = -0{,}2$ cho hệ số $1 - 0{,}05 = 0{,}95$, nên $(0{,}38;\ 0{,}285)$.</p>
        focus: [1, 2, 3, 3]
        say: "Ống kính thật bẻ tia sáng ở gần mép nhiều hơn ở gần tâm, ta dùng toạ độ chuẩn hoá, tức x bằng X chia Z và y bằng Y chia Z. Trên toạ độ chuẩn hoá, gọi r bình phương là bình phương khoảng cách tới tâm, thì x méo bằng x nhân với 1 cộng k một nhân r bình phương, và y cũng vậy. Ở góc ảnh, x bằng 0 phẩy 4, y bằng 0 phẩy 3, nên r bình phương bằng 0 phẩy 25. Với k một bằng âm 0 phẩy 2, hệ số là 0 phẩy 95, và điểm co về 0 phẩy 38, 0 phẩy 285."
      - clear: true
        show: |
