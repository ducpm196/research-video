        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, cùng ma trận nội như trên. Câu một, điểm âm 0 phẩy 4, 0 phẩy 3, 4 mét rơi vào điểm ảnh nào? Câu hai, với k một bằng âm 0 phẩy 1, điểm có toạ độ chuẩn hoá 0 phẩy 3, 0 phẩy 4 rơi vào đâu, và lệch bao nhiêu điểm ảnh so với khi không méo? Câu ba, camera đo linh kiện lâu dài trên băng chuyền, bạn lập kế hoạch hiệu chuẩn thế nào, chụp gì, giữ gì cố định, và kiểm lại khi nào? Dừng video và làm ra giấy."
