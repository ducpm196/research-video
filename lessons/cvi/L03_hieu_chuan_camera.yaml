      - clear: true
        show: |
          <p><b>Câu 1.</b> Chia cho $Z$: $(-0{,}1;\ 0{,}075)$; nhân 800: $(-80;\ 60)$; cộng tâm: $\hlg{(240, 300)}$ — bên trái, phía dưới tâm.</p>
          <p><b>Câu 2.</b> $r^2 = 0{,}09 + 0{,}16 = 0{,}25$, hệ số $1 - 0{,}025 = 0{,}975$: $(0{,}2925;\ 0{,}39)$ → $(554, 552)$. Không méo thì $(560, 560)$, nên lệch $\sqrt{6^2 + 8^2} = \hlg{10}$ điểm ảnh.</p>
        focus: [1, 2, 2]
        say: "Câu một, chia cho Z được âm 0 phẩy 1 và 0 phẩy 075, nhân 800 được âm 80 và 60, cộng tâm ra 240, 300, tức bên trái và phía dưới tâm. Câu hai, r bình phương bằng 0 phẩy 25 nên hệ số là 0 phẩy 975, điểm rơi vào 554, 552. Không méo thì điểm ở 560, 560, nên độ lệch là căn của 6 bình phương cộng 8 bình phương, bằng 10 điểm ảnh."
