  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Một điểm qua ma trận nội, rồi qua ống kính"
    checks:
      - "[sum(r * v for r, v in zip(row, (0.5, 0.25, 2))) for row in [[800, 0, 320], [0, 800, 240], [0, 0, 1]]] == [1040, 680, 2] and alg.cvi_project([[800, 0, 320], [0, 800, 240], [0, 0, 1]], 0.5, 0.25, 2) == (520, 340)"
      - "0.25 ** 2 + 0.125 ** 2 == 0.078125 and 1 - 0.2 * 0.078125 == 0.984375"
      - "alg.cvi_distort(0.25, 0.125, -0.2) == (0.24609375, 0.123046875) and round(800 * 0.24609375 + 320, 2) == 516.88 and round(800 * 0.123046875 + 240, 2) == 338.44"
      - "(800 * 0.38 + 320, 800 * 0.285 + 240) == (624, 468) and math.hypot(640 - 624, 480 - 468) == 20"
    steps:
      - show: |
          <p><b>Bước 1 — nhân ma trận nội.</b> Điểm $(0{,}5;\ 0{,}25;\ 2)$:</p>
          $$\begin{bmatrix} 800 \cdot 0{,}5 + 320 \cdot 2 \\ 800 \cdot 0{,}25 + 240 \cdot 2 \\ 2 \end{bmatrix} = \begin{bmatrix} 1040 \\ 680 \\ 2 \end{bmatrix} \;\Rightarrow\; (u, v) = \left(\frac{1040}{2}, \frac{680}{2}\right) = \hlg{(520, 340)}$$
        focus: [1, 2]
        say: "Bước một, nhân ma trận nội với điểm 0 phẩy 5, 0 phẩy 25, 2. Hàng một cho 400 cộng 640, bằng 1040, hàng hai cho 200 cộng 480, bằng 680, và số cuối là 2, nên chia cho 2 ta được điểm ảnh 520, 340."
      - show: |
          <p><b>Bước 2 — khoảng cách tới tâm.</b> Toạ độ chuẩn hoá $(0{,}25;\ 0{,}125)$: $r^2 = 0{,}0625 + 0{,}015625 = 0{,}078125$; hệ số méo $1 - 0{,}2 \cdot 0{,}078125 = 0{,}984375$.</p>
        say: "Bước hai, toạ độ chuẩn hoá là 0 phẩy 25 và 0 phẩy 125, nên r bình phương bằng 0 phẩy 078125. Thay vào, hệ số méo bằng 1 trừ 0 phẩy 2 nhân số đó, tức 0 phẩy 984375."
      - clear: true
        show: |
          <p><b>Bước 3 — điểm ảnh sau méo.</b> Nhân hệ số rồi chiếu tiếp: $x_{\text{méo}} \approx 0{,}2461$, $y_{\text{méo}} \approx 0{,}1230$:</p>
          $$u \approx 800 \cdot 0{,}2461 + 320 \approx \hlo{516{,}9}, \qquad v \approx 338{,}4$$
          <p class="note">Lệch khoảng 3,1 và 1,6 điểm ảnh so với (520, 340) — điểm này còn gần tâm.</p>
        focus: [1, 2, 3]
        say: "Bước ba, nhân hệ số méo rồi chiếu tiếp, x méo xấp xỉ 0 phẩy 2461, y méo xấp xỉ 0 phẩy 1230. Vì vậy u xấp xỉ 516 phẩy 9, v xấp xỉ 338 phẩy 4. Điểm lệch khoảng 3 phẩy 1 và 1 phẩy 6 điểm ảnh so với 520, 340, vì nó còn gần tâm."
      - show: |
          <p><b>Bước 4 — ở góc ảnh.</b> Điểm lẽ ra rơi vào góc $(640, 480)$ bị kéo về $(800 \cdot 0{,}38 + 320,\ 800 \cdot 0{,}285 + 240) = (624, 468)$:</p>
          $$\sqrt{16^2 + 12^2} = \sqrt{400} = \hlo{20} \text{ điểm ảnh}$$
        introduces: [sqrt]
        focus: [1, 2]
        say: "Bước bốn, xét điểm lẽ ra rơi đúng vào góc ảnh 640, 480. Ống kính kéo nó về 624, 468, lệch 16 điểm ảnh theo ngang và 12 theo dọc, nên theo định lý tam giác vuông, độ lệch là căn của 400, bằng 20 điểm ảnh."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: đi đường lỗ kim không dùng ma trận, và đo sai số chiếu lại"
    checks:
      - "800 * 0.5 / 2 + 320 == 520 and 800 * 0.25 / 2 + 240 == 340"
      - "round(alg.cvi_rmse([(0, 0)] * 3, [(0.6, 0.8), (0, 0.2), (0.4, 0.2)]), 2) == 0.64 and round((1 + 0.04 + 0.2) / 3, 4) == 0.4133"
    steps:
      - show: |
          <p><b>Đường khác 1 — công thức lỗ kim, không dùng ma trận.</b> $u = 800 \cdot \frac{0{,}5}{2} + 320 = 520$, $v = 800 \cdot \frac{0{,}25}{2} + 240 = 340$ ✓ — trùng bước 1.</p>
        focus: [1, 1]
        say: "Kiểm tra thứ nhất đi đường lỗ kim, không dùng ma trận. Thay số vào công thức lỗ kim, ta có u bằng 800 nhân 0 phẩy 5 chia 2 cộng 320, bằng 520, và v bằng 340, trùng kết quả của phép nhân ma trận ở bước một."
      - show: |
          <p><b>Đường khác 2 — sai số chiếu lại.</b> Sau hiệu chuẩn, chiếu lại các góc bàn cờ và so với góc phát hiện trên ảnh:</p>
          <table class="t"><tr><th>góc</th><th>lệch (ngang; dọc)</th><th>bình phương khoảng cách</th></tr>
          <tr><td>1</td><td>0,6; 0,8</td><td>1</td></tr>
          <tr><td>2</td><td>0; 0,2</td><td>0,04</td></tr>
          <tr><td>3</td><td>0,4; 0,2</td><td>0,2</td></tr></table>
          $$\sqrt{\frac{1 + 0{,}04 + 0{,}2}{3}} \approx 0{,}64 \text{ điểm ảnh}$$
        focus: [1, "2.2", ["2.3", "2.4"], 3]
        say: "Kiểm tra thứ hai là sai số chiếu lại, tức sau hiệu chuẩn, ta chiếu lại các góc bàn cờ bằng mô hình rồi so với góc phát hiện được trên ảnh. Góc một lệch 0 phẩy 6 và 0 phẩy 8, bình phương khoảng cách bằng 1. Hai góc còn lại cho 0 phẩy 04 và 0 phẩy 2. Lấy trung bình rồi khai căn, ta được khoảng 0 phẩy 64 điểm ảnh, nghĩa là mô hình khớp các góc đã đo tới dưới một điểm ảnh."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "1040 > 640 and 680 > 480"
      - "840 * 0.4 - 800 * 0.4 == 16"
      - "800 * 320 / 640 == 400 and 800 * 0.25 + 320 == 520 and 400 * 0.25 + 160 == 260"
      - "round(800 * 0.1 - 800 * alg.cvi_distort(0.1, 0, -0.2)[0], 2) == 0.16 and math.hypot(16, 12) == 20"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên chia cho số cuối <b class="red">(điểm ảnh 1040 trên ảnh rộng 640)</b>
          <br><span class="note">Nhân $\mathbf{K}$ xong ra (1040, 680, 2): hai số đầu chưa phải điểm ảnh. Phép thử: điểm ảnh phải nằm trong 0 tới 640 và 0 tới 480.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất là quên chia cho số cuối, nên ra điểm ảnh 1040 trên một ảnh chỉ rộng 640. Phép thử đơn giản là mọi điểm ảnh của vật nhìn thấy phải nằm trong khoảng 0 tới 640 theo ngang và 0 tới 480 theo dọc."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng tự lấy nét hoặc thu phóng sau khi hiệu chuẩn <b class="red">(tiêu cự đổi)</b>
          <br><span class="note">Tiêu cự trôi từ 800 lên 840 (5%): điểm có $\frac{X}{Z} = 0{,}4$ dời từ 320 lên 336 điểm ảnh so với tâm — lệch 16. Sửa: khoá nét và thu phóng, hoặc hiệu chuẩn lại sau mỗi lần đổi.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ hai là để camera tự lấy nét hoặc thu phóng sau khi đã hiệu chuẩn, khiến tiêu cự đổi. Tiêu cự trôi từ 800 lên 840, chỉ 5 phần trăm, mà điểm có X chia Z bằng 0 phẩy 4 đã dời 16 điểm ảnh. Cách sửa là khoá nét và thu phóng, hoặc hiệu chuẩn lại sau mỗi lần đổi."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Thu nhỏ ảnh mà giữ ma trận cũ <b class="red">(điểm ở cột 260 bị tính thành 520)</b>
          <br><span class="note">Ảnh 640 × 480 thu còn 320 × 240 thì mỗi điểm ảnh mới phủ gấp đôi bề rộng, nên $f_x, f_y, c_x, c_y$ — đều đếm bằng điểm ảnh — chia đôi: điểm ở cột 520 giờ ở cột $400 \cdot 0{,}25 + 160 = 260$, không phải 520. Lưu ma trận kèm độ phân giải đã hiệu chuẩn.</span></div>
        focus: [1, 1, 1, 1]
        say: "Lỗi thứ ba là thu nhỏ ảnh mà giữ ma trận cũ, nên điểm thật ở cột 260 bị tính thành cột 520. Thu ảnh 640 nhân 480 còn 320 nhân 240 thì mỗi điểm ảnh mới phủ gấp đôi bề rộng. Vì bốn tham số trong đều đếm bằng điểm ảnh, chúng cùng chia đôi, nên điểm ở cột 520 giờ nằm ở cột 260. Vì vậy cần lưu ma trận kèm độ phân giải đã hiệu chuẩn."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Tin sai số chiếu lại nhỏ khi bàn cờ chỉ nằm giữa ảnh <b class="red">(0,16 ở giữa, 20 ở góc)</b></div>
          <table class="t"><tr><th>vùng ảnh</th><th>độ lệch do méo (k1 = −0,2)</th><th>mô hình bỏ qua méo có lộ ra?</th></tr>
          <tr><td>giữa ảnh, $\frac{X}{Z} = 0{,}1$</td><td>0,16 điểm ảnh</td><td>không — sai số chiếu lại vẫn “đẹp”</td></tr>
          <tr><td>góc ảnh</td><td>20 điểm ảnh</td><td class="red">có — nhưng không có góc bàn cờ nào ở đó để đo</td></tr></table>
          <p class="note">Sai số chiếu lại chỉ đo ở chỗ có điểm mẫu. Chụp ít nhất khoảng 10 ảnh bàn cờ, phủ cả bốn góc và nhiều độ nghiêng.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tin sai số chiếu lại nhỏ khi bàn cờ chỉ nằm giữa ảnh. Ở giữa ảnh, méo chỉ dời điểm 0 phẩy 16 điểm ảnh, nên một mô hình bỏ qua méo vẫn cho sai số chiếu lại rất đẹp. Ở góc ảnh, méo dời tới 20 điểm ảnh, nhưng không có góc bàn cờ nào ở đó để lộ ra lỗi. Sai số chiếu lại chỉ đo ở chỗ có điểm mẫu, nên hãy chụp ít nhất khoảng 10 ảnh bàn cờ, phủ cả bốn góc và nhiều độ nghiêng."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: chiếu một điểm, tính độ méo, rồi lập kế hoạch hiệu chuẩn"
    checks:
      - "alg.cvi_project([[800, 0, 320], [0, 800, 240], [0, 0, 1]], -0.4, 0.3, 4) == (240, 300) and -0.4 / 4 == -0.1 and 0.3 / 4 == 0.075"
      - "round(0.3 ** 2 + 0.4 ** 2, 6) == 0.25 and round(1 - 0.1 * 0.25, 6) == 0.975 and tuple(round(800 * c + o, 6) for c, o in zip(alg.cvi_distort(0.3, 0.4, -0.1), (320, 240))) == (554, 552) and math.hypot(560 - 554, 560 - 552) == 10"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề (cùng $\mathbf{K}$: $f = 800$, tâm (320, 240))</th></tr>
          <tr><td>1</td><td>Điểm $(-0{,}4;\ 0{,}3;\ 4)$ m rơi vào điểm ảnh nào?</td></tr>
