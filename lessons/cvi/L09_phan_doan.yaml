          <rect x="560" y="70" width="34" height="34" fill="#86efac"/><text x="610" y="96">TP: 4 hàng × 10 = 40 điểm ảnh tô trúng</text>
          <rect x="560" y="130" width="34" height="34" fill="#fdba74"/><text x="610" y="156">FP: hàng dưới cùng của vùng tô, 10 điểm tô thừa</text>
          <rect x="560" y="190" width="34" height="34" fill="#93c5fd"/><text x="610" y="216">FN: hàng trên cùng của vùng thật, 10 điểm bỏ sót</text>
          <rect x="560" y="250" width="34" height="34" fill="#ffffff" stroke="#d1d5db"/><text x="610" y="276">TN: 4 hàng nền còn lại, 40 điểm</text>
          <line x1="560" y1="330" x2="600" y2="330" stroke="#2a78d6" stroke-width="4"/><text x="610" y="338">viền liền: vùng vật thật (50 điểm)</text>
