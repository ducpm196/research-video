id: L09
course: CVI
series: "CVI · Thị giác máy tính"
title: "Bài 9 — Phân đoạn ảnh: IoU, hệ số Dice và lớp hiếm"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cvi.yaml L09; audit/cvi/verify_cvi.py L09; audit/cvi/sources_L09.md (bài không nêu sự kiện có thật; mọi số tự tính); CVI bài 8 (giao trên hợp của hộp, TP/FP/FN khi ghép)"
assumes: [arith, cdot, frac, approx, geq, cap, cup, sub]
# Quy ước: mặt nạ = lưới 0/1 cùng cỡ ảnh, 1 = điểm ảnh thuộc vật. Trên điểm ảnh: TP = đoán vật và đúng là vật, FP = đoán vật nhưng là nền,
#   FN = bỏ sót điểm của vật, TN = nền đoán là nền (alg.cvi_mask_counts). IoU = TP / (TP + FP + FN), Dice = 2TP / (2TP + FP + FN)
#   (alg.cvi_iou_dice); độ chính xác điểm ảnh = (TP + TN) / số điểm ảnh. mIoU = trung bình IoU của mọi lớp (kể cả nền).
#   Tên IoU, Dice chỉ trên màn hình (probe không đạt — lexicon_vi.CVI.yaml); lời đọc nói “giao trên hợp”, “hệ số chồng lấp”.
#   Lưới 10 × 10, ảnh 20 × 20 có vật 4 điểm ảnh, hai bài báo A và B, ảnh chụp vết nứt là SỐ MINH HOẠ.
objectives:
  - "Đếm TP, FP, FN trên mặt nạ và tính giao trên hợp, hệ số chồng lấp"
  - "Suy ra hệ số chồng lấp = 2 · IoU / (1 + IoU) và đổi qua lại hai thước đo"
  - "Giải thích bằng số vì sao độ chính xác điểm ảnh đánh lừa khi vật nhỏ, và mIoU sửa được"
  - "Nhận ra hai cách lấy trung bình (theo ảnh, gộp cả tập) và ca mặt nạ rỗng 0/0"
asr_reviewed:
  - {sentence: "Giao trên hợp của lớp vết nứt gộp cả tập không bị nền lấn át, nhưng vết dài và to sẽ lấn át vết mảnh.", reason: "ASR chép “Giao trên hộp của lớp vết nước gột cả tập không bị nền lấn ác, nhưng vết dài và to sẽ lấn ác vết mảnh.” (0.68): lệch âm/thanh thuần Việt: hợp/hộp, vết nứt gộp/véc nước gột, át/ác, vết/véc, át vết/ác véc — NOT_VERIFIED bằng tai người"}
  - {sentence: "Thay số, 0 phẩy 9 chia 1 phẩy 1, xấp xỉ 0 phẩy 818.", reason: "ASR chép “Thay số 0,9 × 1,1 xếp sĩ 0,818.” (0.774): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; lệch âm/thanh thuần Việt: chia/∅, xấp xỉ không (trong “xấp xỉ không phẩy” → “xếp sĩ”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Loại cuối là nền được giữ đúng là nền.", reason: "ASR chép “Loại cuối là nên được giữ đúng là nên.” (0.778): lệch âm/thanh thuần Việt: nền/nên, nền/nên — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đúng 99 phần trăm điểm ảnh mà không tô trúng vật nào"
    checks:
      - "alg.cvi_mask_counts([[0] * 20 for _ in range(20)], [[int(r < 2 and c < 2) for c in range(20)] for r in range(20)]) == (0, 0, 4, 396) and 396 / 400 == 0.99"
    steps:
      - show: |
          <p>Một mô hình tô <b>vết nứt</b> trên ảnh mặt đường 20 × 20 điểm ảnh. Vết nứt chỉ chiếm 4 điểm ảnh, tức 1% ảnh. Mô hình tô <b>toàn bộ là nền</b>.</p>
          <p>Báo cáo ghi: “độ chính xác điểm ảnh <b>99%</b>”. Nhưng mô hình không tìm ra một điểm nứt nào.</p>
          <div class="box key">Hôm nay: chấm một mặt nạ tô điểm ảnh thế nào? Hai thước đo chồng lấp liên hệ ra sao? Và vì sao vật nhỏ làm con số đẹp mà vô nghĩa?</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, một mô hình tô vết nứt trên ảnh mặt đường 20 nhân 20 điểm ảnh. Vết nứt chỉ chiếm 4 điểm ảnh, tức 1 phần trăm ảnh, và mô hình tô toàn bộ là nền. Báo cáo ghi độ chính xác điểm ảnh 99 phần trăm. Nhưng mô hình không tìm ra một điểm nứt nào. Hôm nay ta hỏi, chấm một mặt nạ tô điểm ảnh thế nào, hai thước đo chồng lấp liên hệ ra sao, và vì sao vật nhỏ làm con số đẹp mà vô nghĩa."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "Fraction(25, 175) == Fraction(1, 7) and (10 - 5) * (10 - 5) == 25 and 10 * 10 + 10 * 10 - 25 == 175"
      - "Fraction(80, 100) == Fraction(80 // 20, 100 // 20) == Fraction(4, 5)"
      - "(Fraction(1, 2) + Fraction(3, 4)) / 2 == Fraction(5, 8) and Fraction(1 + 3, 2 + 4) == Fraction(2, 3)"
    steps:
      - show: |
          <p><b>① Giao trên hợp</b> (bài 8): hai hộp $A$, $B$ — diện tích $A \cap B$ chia diện tích $A \cup B$. Mỗi hộp ghi bằng bốn số (x trái, y trên, x phải, y dưới). Hộp (0, 0, 10, 10) và (5, 5, 15, 15) đều là hình vuông cạnh 10, lệch nhau nửa cạnh: phần giao là ô $5 \cdot 5 = 25$, phần hợp là $100 + 100 - 25 = 175$, nên $\frac{25}{175} = \frac{1}{7} \approx 0{,}143$.</p>
        focus: [1, 1, 1, 1]
        say: "Điều thứ nhất, ở bài 8 ta đo hai hộp chồng nhau bằng giao trên hợp, tức diện tích phần giao chia diện tích phần hợp. Mỗi hộp được ghi bằng bốn số, là toạ độ bên trái, bên trên, bên phải và bên dưới của nó. Hộp 0, 0, 10, 10 và hộp 5, 5, 15, 15 đều là hình vuông cạnh 10, lệch nhau nửa cạnh, nên phần giao là ô vuông 5 nhân 5, bằng 25. Phần hợp là 100 cộng 100 trừ 25, bằng 175, nên giao trên hợp bằng 25 chia 175, tức một phần bảy, xấp xỉ 0 phẩy 143."
      - show: |
          <p><b>② Chia cả tử và mẫu cho cùng một số</b> không đổi giá trị phân số:</p>
          $$\frac{80}{100} = \frac{80 : 20}{100 : 20} = \frac{4}{5} = 0{,}8$$
        focus: [1, 2]
        say: "Điều thứ hai, chia cả tử và mẫu cho cùng một số khác 0 thì phân số không đổi. Ví dụ 80 phần 100, chia cả hai cho 20, được 4 phần 5, bằng 0 phẩy 8."
      - show: |
          <p><b>③ Trung bình của tỉ số khác tỉ số của tổng:</b> hai tỉ số $\frac{1}{2}$ và $\frac{3}{4}$ có trung bình $\frac{0{,}5 + 0{,}75}{2} = 0{,}625$; gộp tử và mẫu thì $\frac{1 + 3}{2 + 4} = \frac{4}{6} \approx 0{,}667$.</p>
        focus: [1, 1]
        say: "Điều thứ ba, trung bình của các tỉ số khác tỉ số của tổng. Một phần hai và ba phần tư có trung bình 0 phẩy 625, còn gộp tử với tử, mẫu với mẫu thì được 4 phần 6, xấp xỉ 0 phẩy 667."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: mặt nạ, TP, FP, FN, TN và ba thước đo"
    steps:
      - show: |
          <table class="t"><tr><th>ô</th><th>mô hình tô</th><th>sự thật</th><th>nghĩa</th></tr>
          <tr><td>TP</td><td>vật</td><td>vật</td><td>tô trúng</td></tr>
          <tr><td>FP</td><td>vật</td><td>nền</td><td>tô thừa</td></tr>
          <tr><td>FN</td><td>nền</td><td>vật</td><td>bỏ sót</td></tr>
          <tr><td>TN</td><td>nền</td><td>nền</td><td>nền đúng là nền</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Mặt nạ là một lưới số 0 và 1 cùng cỡ ảnh, số 1 là điểm ảnh thuộc vật, và ta đếm bốn loại điểm ảnh. Loại thứ nhất là điểm mô hình tô là vật và đúng là vật, gọi là tô trúng. Loại thứ hai tô là vật nhưng thật ra là nền, gọi là tô thừa. Loại thứ ba là điểm của vật mà mô hình bỏ sót. Loại cuối là nền được giữ đúng là nền."
      - clear: true
        show: |
          $$\text{IoU} = \frac{TP}{TP + FP + FN}, \qquad \text{Dice} = \frac{2\,TP}{2\,TP + FP + FN}, \qquad \text{độ chính xác điểm ảnh} = \frac{TP + TN}{\text{số điểm ảnh}}$$
          <p class="note">IoU là giao trên hợp của hai vùng tô: giao là TP, hợp là TP + FP + FN. Dice, hệ số chồng lấp, đếm phần giao <b>hai lần</b>. Chỉ độ chính xác điểm ảnh có TN.</p>
        focus: [1, 2, 2, 2]
        say: "Ba thước đo hiện trên màn hình, chữ viết tắt chỉ để ghi. Giao trên hợp là số tô trúng chia tổng tô trúng, tô thừa và bỏ sót, vì phần giao của hai vùng là phần tô trúng, còn phần hợp gồm cả ba loại. Hệ số chồng lấp đếm phần giao hai lần, tức hai lần số tô trúng chia cho hai lần số tô trúng cộng tô thừa cộng bỏ sót. Chỉ riêng độ chính xác điểm ảnh có đếm nền đúng."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Lưới 10 × 10: vùng thật và vùng tô lệch nhau một hàng"
    checks:
      - "alg.cvi_mask_counts([[int(2 <= r <= 6) for c in range(10)] for r in range(10)], [[int(1 <= r <= 5) for c in range(10)] for r in range(10)]) == (40, 10, 10, 40)"
    steps:
      - show: |
          <div><svg width="1400" height="470" viewBox="0 0 1400 470">
          <rect x="80" y="80" width="400" height="40" fill="#93c5fd"/><rect x="80" y="120" width="400" height="160" fill="#86efac"/><rect x="80" y="280" width="400" height="40" fill="#fdba74"/>
          <g stroke="#d1d5db" stroke-width="1"><line x1="80" y1="40" x2="80" y2="440"/><line x1="120" y1="40" x2="120" y2="440"/><line x1="160" y1="40" x2="160" y2="440"/><line x1="200" y1="40" x2="200" y2="440"/><line x1="240" y1="40" x2="240" y2="440"/><line x1="280" y1="40" x2="280" y2="440"/><line x1="320" y1="40" x2="320" y2="440"/><line x1="360" y1="40" x2="360" y2="440"/><line x1="400" y1="40" x2="400" y2="440"/><line x1="440" y1="40" x2="440" y2="440"/><line x1="480" y1="40" x2="480" y2="440"/><line x1="80" y1="40" x2="480" y2="40"/><line x1="80" y1="80" x2="480" y2="80"/><line x1="80" y1="120" x2="480" y2="120"/><line x1="80" y1="160" x2="480" y2="160"/><line x1="80" y1="200" x2="480" y2="200"/><line x1="80" y1="240" x2="480" y2="240"/><line x1="80" y1="280" x2="480" y2="280"/><line x1="80" y1="320" x2="480" y2="320"/><line x1="80" y1="360" x2="480" y2="360"/><line x1="80" y1="400" x2="480" y2="400"/><line x1="80" y1="440" x2="480" y2="440"/></g>
