id: L01
course: CVI
series: "CVI · Thị giác máy tính"
title: "Bài 1 — Lọc ảnh bằng tích chập: làm mờ, phát hiện cạnh Sobel"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cvi.yaml L01; audit/cvi/verify_cvi.py L01; audit/cvi/sources_L01.md (bài không nêu sự kiện lịch sử; mọi số tự tính); CS115 bài 34 (trượt bộ lọc, tương quan chéo, kích thước đầu ra — đã học)"
assumes: [arith, cdot, frac, approx, power, sub]
# Quy ước (cả khoá): ảnh I, bộ lọc K cỡ 3 × 3; I ⋆ K = tương quan chéo (đặt K lên ô, nhân từng cặp, cộng — KHÔNG lật), là phép mà thư viện
#   học sâu gọi là “tích chập” (alg.cvi_xcorr2d); I ∗ K = tích chập toán học (lật K 180 độ trước, alg.cvi_conv2d). Đầu ra “valid”: cạnh
#   N − k + 1. Sobel ngang S_x = [−1 0 1; −2 0 2; −1 0 1] đo thay đổi theo chiều ngang (dương khi bên phải sáng hơn); S_y là chuyển vị
#   (dương khi bên dưới sáng hơn). Độ lớn cạnh = căn(G_x² + G_y²). Tín hiệu một chiều có hạt nhiễu 9 và cạnh 0 → 12 là SỐ MINH HOẠ.
#   Tên Sobel chỉ trên màn hình (probe p1: ≤ 5/8, lexicon_vi.CVI.yaml); lời đọc nói “bộ lọc tìm cạnh”.
objectives:
  - "Tính một điểm ra của bộ lọc 3 × 3: làm mờ trung bình, Sobel S_x (đo thay đổi ngang, tìm cạnh dọc) và S_y"
  - "Suy ra Sobel = làm mượt theo một chiều nhân lấy hiệu theo chiều kia"
  - "Giải thích bằng số vì sao làm mờ trước khi lấy cạnh giảm cạnh giả do nhiễu"
  - "Nhận ra lỗi đổi dấu khi lật bộ lọc, lỗi lưu số âm vào ảnh 8 bit và lỗi ngưỡng cố định khi đổi độ sáng"
asr_reviewed:
  - {sentence: "Nếu ảnh có thêm một cột, ta trượt bộ lọc sang phải một cột, ô mới là 2, 0, 4, 1, cho 2 trừ 1, bằng 1.", reason: "ASR chép “Nếu ảnh có thêm 1 cột, ta trực bộ lọc sang phải 1 cột, ôm mới là 2, 0, 4, 1, cho 2 trừ 1, bằng 1.” (0.926): “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: trượt/trực — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cách sửa là đệm bằng cách lặp lại điểm ảnh ở mép, hoặc bỏ dải viền khi đo.", reason: "ASR chép “Cắt sữa là đềm bằng cách lập lại điểm ảnh ở mép hoặc bỏ giải viền khi đo.” (0.778): lệch âm/thanh thuần Việt: cách sửa/cắt sữa, đệm/đềm, lặp/lập — NOT_VERIFIED bằng tai người"}
  - {sentence: "Làm thử, G x bằng 30, G y bằng 40, mũi tên kép đọc là suy ra, độ lớn bằng căn của 2500, bằng 50.", reason: "ASR chép “Làm thử, gx bằng 30, ge bằng 40, mũi tên kép độc là suy ra, độ lớn bằng căng của 2500 bằng 50.” (0.885): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: i (trong “g i” → “ge”), đọc/độc, căn/căng — NOT_VERIFIED bằng tai người"}
  - {sentence: "G x bằng 30 và G y cũng bằng 30, nên theo công thức độ lớn cạnh, ta được căn của 1800, xấp xỉ 42 phẩy 4, và hướng của cạnh nghiêng đúng 45 độ.", reason: "ASR chép “GX bằng 30 và GY cũng bằng 30, nên theo công thức độ lớn cạnh, ta được căn của 1800, sắp xỉ 42,4 và hướng của cạnh nghiên đúng 45 độ.” (0.92): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: i (trong “g i” → “gy”), xấp/sắp, nghiêng/nghiên — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một hạt nhiễu mạnh gần bằng một cạnh thật"
    checks:
      - "max(map(abs, alg.cvi_filter1d([0, 0, 0, 9, 0, 0, 0, 0, 12, 12, 12, 12], [-1, 0, 1]))) == 12 and abs(alg.cvi_filter1d([0, 0, 0, 9, 0, 0, 0, 0, 12, 12, 12, 12], [-1, 0, 1])[1]) == 9"
    steps:
      - show: |
          <p>Một camera kiểm tra mép tấm thép trên dây chuyền. Bộ tìm cạnh báo cạnh thật với độ mạnh <b>12</b>, nhưng một hạt nhiễu đơn lẻ cũng cho độ mạnh <b>9</b>. Đặt ngưỡng 6 (độ mạnh từ 6 trở lên thì coi là cạnh) thì máy thấy “cạnh” ở cả hai chỗ.</p>
          <div class="box key">Hôm nay: một bộ lọc 3 × 3 làm mờ và tìm cạnh thế nào? Vì sao một bộ tìm cạnh kinh điển lại có sẵn một phép làm mờ bên trong? Và làm mờ trước giúp được bao nhiêu?</div>
        focus: [1, 1, 1, 2, 2]
        say: "Chào bạn, một camera kiểm tra mép tấm thép trên dây chuyền. Bộ tìm cạnh báo cạnh thật với độ mạnh 12, nhưng một hạt nhiễu đơn lẻ cũng cho độ mạnh 9. Đặt ngưỡng 6, nghĩa là độ mạnh từ 6 trở lên thì coi là cạnh, máy sẽ thấy cạnh ở cả hai chỗ. Hôm nay ta hỏi, một bộ lọc 3 nhân 3 làm mờ và tìm cạnh thế nào. Vì sao một bộ tìm cạnh kinh điển có sẵn một phép làm mờ bên trong, và làm mờ trước giúp được bao nhiêu?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "alg.cvi_xcorr2d([[1, 2], [3, 4]], [[1, 0], [0, -1]]) == [[-3]] and alg.cvi_xcorr2d([[1, 2, 0], [3, 4, 1]], [[1, 0], [0, -1]]) == [[-3, 1]]"
      - "alg.cvi_out_size(640, 3) == 638 and len(alg.cvi_xcorr2d([[0] * 6] * 6, [[0] * 3] * 3)) == 4"
      - "(10 + 20 + 30) / 3 == 20 and (1 * 10 + 2 * 20 + 1 * 30) / 4 == 20"
    steps:
      - show: |
          <p><b>① Trượt bộ lọc</b>: <b>bộ lọc</b> là một bảng số nhỏ. Đặt nó lên một ô của ảnh, nhân từng cặp số cùng chỗ, cộng lại được <b>một</b> số của ảnh ra; rồi trượt sang ô kế bên và làm lại.</p>
          $$\begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix} \text{ với } \begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}: \quad 1 \cdot 1 + 2 \cdot 0 + 3 \cdot 0 + 4 \cdot (-1) = -3$$
          <p class="note">Ảnh có thêm một cột, hai hàng 1, 2, 0 và 3, 4, 1: trượt sang phải một cột, ô mới 2, 0, 4, 1 cho $2 \cdot 1 + 0 + 0 + 1 \cdot (-1) = 1$. Ảnh ra gồm hai số: $-3$ và $1$.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Trước hết, ta cần hiểu phép trượt bộ lọc. Bộ lọc là một bảng số nhỏ, ta đặt nó lên một ô của ảnh, nhân từng cặp số cùng chỗ rồi cộng lại, được một số của ảnh ra. Ví dụ ô 1, 2, 3, 4 với bộ lọc 1, 0, 0, âm 1 cho 1 trừ 4, bằng âm 3. Nếu ảnh có thêm một cột, ta trượt bộ lọc sang phải một cột, ô mới là 2, 0, 4, 1, cho 2 trừ 1, bằng 1. Vậy ảnh hai hàng ba cột cho ảnh ra gồm hai số, âm 3 và 1."
      - show: |
          <p><b>② Kích thước đầu ra khi không đệm:</b> bộ lọc cạnh $k$ trên ảnh cạnh $N$ cho $N - k + 1$ vị trí. Ảnh 6 × 6 với bộ lọc 3 × 3 còn 4 × 4; ảnh rộng 640 còn 638.</p>
        focus: [1, 1]
        say: "Điều thứ hai, khi không đệm thêm viền, bộ lọc cạnh k trên ảnh cạnh N chỉ có N trừ k cộng 1 vị trí đặt được. Vì vậy ảnh 6 nhân 6 với bộ lọc 3 nhân 3 còn 4 nhân 4, và ảnh rộng 640 còn 638."
      - show: |
          <p><b>③ Trung bình có trọng số:</b> trung bình thường của 10, 20, 30 là $\frac{10 + 20 + 30}{3} = 20$. Trọng số 1, 2, 1 (ô giữa nặng gấp đôi): $\frac{1 \cdot 10 + 2 \cdot 20 + 1 \cdot 30}{4} = 20$ — chia cho tổng trọng số để độ sáng không đổi.</p>
        focus: [1, 1, 1]
        say: "Điều thứ ba là trung bình có trọng số. Trung bình thường của 10, 20 và 30 là 20. Với trọng số 1, 2, 1, tức ô giữa nặng gấp đôi, ta chia cho tổng trọng số là 4, vẫn được 20, nên độ sáng chung không đổi."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: tương quan chéo, tích chập, G x, G y và độ lớn cạnh"
    checks:
      - "alg.cvi_conv2d([[1, 2], [3, 4]], [[1, 0], [0, -1]]) == [[3]] and alg.cvi_xcorr2d([[1, 2], [3, 4]], [[1, 0], [0, -1]]) == [[-3]]"
      - "math.sqrt(30 ** 2 + 40 ** 2) == 50"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc là</th><th>nghĩa</th></tr>
          <tr><td>$I \star K$</td><td>tương quan chéo</td><td>trượt, nhân từng cặp, cộng — <b>không lật</b> $K$; thư viện học sâu gọi phép này là “tích chập”</td></tr>
          <tr><td>$I \ast K$</td><td>tích chập (toán học)</td><td>lật $K$ 180 độ trước rồi mới trượt</td></tr></table>
          <p class="note">Làm thử với ví dụ ôn nền: không lật cho $-3$; lật bộ lọc thành $\begin{bmatrix} -1 & 0 \\ 0 & 1 \end{bmatrix}$ cho $-1 + 4 = 3$ — đổi dấu.</p>
        introduces: [xcorr, conv]
        focus: [0, "1.2", "1.3", 2]
        say: "Bảng có hai phép. Ngôi sao năm cánh đọc là tương quan chéo, tức trượt, nhân từng cặp, cộng lại mà không lật bộ lọc, và thư viện học sâu gọi chính phép này là tích chập. Dấu sao nhỏ đọc là tích chập theo nghĩa toán học, lật bộ lọc 180 độ trước rồi mới trượt. Làm thử với ví dụ ôn nền, không lật cho âm 3, còn lật bộ lọc thì cho âm 1 cộng 4, bằng 3, tức đổi dấu."
      - clear: true
        show: |
          <p>$G_x$: độ thay đổi theo chiều <b>ngang</b> (dương khi bên phải sáng hơn). $G_y$: độ thay đổi theo chiều <b>dọc</b> (dương khi bên dưới sáng hơn).</p>
          $$\text{độ lớn cạnh} = \sqrt{G_x^2 + G_y^2}, \qquad G_x = 30,\ G_y = 40 \;\Rightarrow\; \sqrt{900 + 1600} = 50$$
        introduces: [sqrt, implies]
        focus: [1, 1, 2, 2]
        say: "Chữ G với chỉ số dưới x là độ thay đổi theo chiều ngang, dương khi bên phải sáng hơn. G với chỉ số dưới y là độ thay đổi theo chiều dọc, dương khi bên dưới sáng hơn. Độ lớn cạnh bằng căn của G x bình phương cộng G y bình phương, như độ dài cạnh huyền của tam giác vuông. Làm thử, G x bằng 30, G y bằng 40, mũi tên kép đọc là suy ra, độ lớn bằng căn của 2500, bằng 50."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bộ lọc tìm cạnh đặt lên vùng có cột phải sáng"
    checks:
      - "alg.cvi_xcorr2d([[0, 0, 10]] * 3, [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]]) == [[40]] and [[p * k for p, k in zip(r1, r2)] for r1, r2 in zip([[0, 0, 10]] * 3, [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]])] == [[0, 0, 10], [0, 0, 20], [0, 0, 10]]"
