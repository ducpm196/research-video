  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "alg.cvi_conv2d([[0, 0, 10]] * 3, [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]]) == [[-40]]"
      - "int(np.array([-40]).astype(np.uint8)[0]) == 216 and int(np.clip(-40, 0, 255)) == 0"
      - "alg.cvi_xcorr2d([[0, 100, 100]] * 3, [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]]) == [[400]]"
      - "alg.cvi_xcorr2d([[0, 0, 5]] * 3, [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]]) == [[20]] and 20 < 30 < 40"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lẫn tương quan chéo với tích chập <b class="red">(đổi dấu: 40 thành −40)</b>
          <br><span class="note">Lật bộ lọc tìm cạnh 180 độ làm cột âm sang phải: cùng vùng cho $-40$, hướng cạnh bị đảo. Phép thử: chạy trên vùng biết trước (trái tối, phải sáng) và xem dấu.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ nhất là lẫn tương quan chéo với tích chập, làm 40 đổi thành âm 40. Lật bộ lọc tìm cạnh 180 độ sẽ đưa cột âm sang phải, nên cùng vùng cho âm 40 và hướng cạnh bị đảo. Phép thử là chạy trên một vùng biết trước, trái tối và phải sáng, rồi xem dấu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lưu kết quả có dấu vào ảnh 8 bit không dấu <b class="red">(−40 thành 216, hoặc thành 0)</b>
          <br><span class="note">Ép kiểu làm $-40$ quay vòng thành $256 - 40 = 216$; kẹp về khoảng 0 tới 255 thì mọi cạnh “tối sang sáng theo chiều ngược” biến mất. Sửa: giữ số có dấu, hoặc lấy độ lớn trước khi lưu.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ hai là lưu kết quả có dấu vào ảnh 8 bit không dấu, nên âm 40 thành 216, hoặc thành 0. Ép kiểu làm âm 40 quay vòng thành 256 trừ 40, bằng 216, còn kẹp về khoảng 0 tới 255 thì mọi cạnh theo chiều ngược lại biến mất. Cách sửa là giữ số có dấu, hoặc lấy độ lớn trước khi lưu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đệm số 0 quanh viền <b class="red">(cạnh giả 400 ở mép ảnh)</b>
          <br><span class="note">Ảnh đều 100 khắp nơi, đệm cột 0 bên trái: ô mép có vùng 0, 100, 100 mỗi hàng nên $G_x = 400$ — mạnh gấp 10 lần cạnh thật ở ví dụ. Sửa: đệm bằng cách lặp lại điểm ảnh mép, hoặc bỏ dải viền khi đo.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ ba là đệm số 0 quanh viền để giữ kích thước, làm hiện cạnh giả 400 ở mép ảnh. Một ảnh đều 100 khắp nơi, đệm thêm cột 0 bên trái, thì ô ở mép có vùng 0, 100, 100 mỗi hàng nên G x bằng 400, mạnh gấp 10 lần cạnh thật ở ví dụ. Cách sửa là đệm bằng cách lặp lại điểm ảnh ở mép, hoặc bỏ dải viền khi đo."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Ngưỡng cạnh cố định khi ánh sáng thay đổi <b class="red">(buổi chiều mất cạnh)</b></div>
          <table class="t"><tr><th>cùng mép thép, ngưỡng 30</th><th>vùng ảnh</th><th>$G_x$</th><th>kết luận</th></tr>
          <tr><td>buổi sáng</td><td>0, 0, 10 mỗi hàng</td><td>40</td><td>có cạnh</td></tr>
          <tr><td>buổi chiều, tối đi một nửa</td><td>0, 0, 5 mỗi hàng</td><td>20</td><td class="red">bỏ sót</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đặt ngưỡng cạnh cố định trong khi ánh sáng thay đổi. Buổi sáng, mép thép cho G x bằng 40, vượt ngưỡng 30. Buổi chiều ảnh tối đi một nửa, bộ lọc tuyến tính nên G x cũng giảm một nửa còn 20, và cạnh bị bỏ sót. Người làm nghề đặt ngưỡng theo tỉ lệ của cạnh mạnh nhất trong ảnh, hoặc chuẩn hoá độ sáng trước khi lọc."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: làm mờ một điểm, đo một cạnh ngang, rồi chọn ngưỡng"
    checks:
      - "alg.cvi_xcorr2d([[9, 0, 0], [0, 0, 0], [0, 0, 0]], [[1 / 9] * 3] * 3) == [[1.0]]"
      - "alg.cvi_xcorr2d([[10, 10, 10], [0, 0, 0], [0, 0, 0]], [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]]) == [[0]] and alg.cvi_xcorr2d([[10, 10, 10], [0, 0, 0], [0, 0, 0]], [[-1, -2, -1], [0, 0, 0], [1, 2, 1]]) == [[-40]]"
      - "0.5 * 40 == 20 and 0.5 * 20 == 10 and 20 >= 0.5 * 40 and 10 >= 0.5 * 20"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Làm mờ trung bình 3 × 3 (mỗi trọng số $\frac{1}{9}$) tại tâm vùng chỉ có một điểm 9 ở góc, còn lại 0. Ra bao nhiêu?</td></tr>
          <tr><td>2</td><td>Vùng hàng trên 10, 10, 10, hai hàng dưới 0. Tính $G_x$, $G_y$ và độ lớn cạnh.</td></tr>
          <tr><td>3</td><td>Dây chuyền chạy cả sáng lẫn chiều. Bạn giữ ngưỡng 30 cố định hay dùng “một nửa cạnh mạnh nhất trong ảnh”?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn. Câu một, làm mờ trung bình 3 nhân 3, mỗi trọng số một phần chín, tại tâm một vùng chỉ có một điểm 9 ở góc, còn lại là 0, ra bao nhiêu? Câu hai, vùng có hàng trên 10, 10, 10 và hai hàng dưới bằng 0, hãy tính G x, G y và độ lớn cạnh. Câu ba, dây chuyền chạy cả sáng lẫn chiều, bạn giữ ngưỡng 30 cố định, hay dùng một nửa cạnh mạnh nhất trong ảnh? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Câu 1.</b> $\frac{9 + 0 + \dots + 0}{9} = \hlg{1}$ — một hạt nhiễu 9 chỉ còn 1, nhưng nó loang ra cả vùng 3 × 3.</p>
          <p><b>Câu 2.</b> Ba cột giống nhau nên $G_x = 0$. Hàng dưới trừ hàng trên: $G_y = 0 - (10 + 20 + 10) = -40$; độ lớn $\sqrt{0 + 1600} = \hlg{40}$ — cạnh ngang, bên trên sáng hơn.</p>
        introduces: [dots]
        focus: [1, 1, 2, 2]
        say: "Câu một, ta cộng 9 với tám số 0 rồi chia 9, được 1, nghĩa là hạt nhiễu 9 chỉ còn 1, nhưng nó loang ra cả vùng 3 nhân 3. Dấu ba chấm nghĩa là cứ thế cộng tiếp các số còn lại. Câu hai, ba cột giống nhau nên G x bằng 0. Hàng dưới trừ hàng trên cho G y bằng âm 40, nên độ lớn là căn của 1600, bằng 40, một cạnh ngang với bên trên sáng hơn."
      - show: |
