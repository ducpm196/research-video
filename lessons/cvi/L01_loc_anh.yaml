      - "[round(v, 6) for v in alg.cvi_filter1d(alg.cvi_filter1d([0, 0, 0, 9, 0, 0, 0, 0, 12, 12, 12, 12], [1 / 3] * 3), [-1, 0, 1])] == [3, 0, -3, -3, 4, 8, 8, 4]"
