          <g font-size="22" fill="#1f2937" text-anchor="middle"><text x="165" y="60">vùng ảnh 3 × 3</text><text x="525" y="60">bộ lọc đo thay đổi theo chiều ngang</text><text x="885" y="60">tích từng ô</text></g>
