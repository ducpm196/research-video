        say: "Câu ba là một đánh đổi. Ngưỡng cố định 30 thấy cạnh buổi sáng nhưng bỏ sót buổi chiều, và phải chỉnh tay mỗi khi đổi đèn. Ngưỡng bằng một nửa cạnh mạnh nhất là 20 buổi sáng, 10 buổi chiều, nên thấy cả hai, nhưng ảnh không có cạnh nào thì nhiễu lại thành cạnh mạnh nhất. Vì vậy hãy chọn ngưỡng theo tỉ lệ, kèm một ngưỡng sàn tuyệt đối nhỏ để ảnh trống không báo cạnh giả."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
