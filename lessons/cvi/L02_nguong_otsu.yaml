id: L02
course: CVI
series: "CVI · Thị giác máy tính"
title: "Bài 2 — Biểu đồ tần suất, cân bằng và ngưỡng Otsu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cvi.yaml L02; audit/cvi/verify_cvi.py L02; audit/cvi/sources_L02.md; N. Otsu, A Threshold Selection Method from Gray-Level Histograms, IEEE Trans. Systems, Man, and Cybernetics 9(1), 62–66 (1979) — siêu dữ liệu Crossref, chưa đọc toàn văn; [OCVT] OpenCV 4.x, hướng dẫn Image Thresholding (ngưỡng thích nghi, Otsu: cực tiểu phương sai trong lớp có trọng số); CS115 bài 13 (trung bình, phương sai)"
assumes: [arith, cdot, frac, approx, power, sub]
# Quy ước: biểu đồ tần suất h(v) = số điểm ảnh có giá trị v. Ngưỡng t: lớp 0 (tối) gồm giá trị ≤ t, lớp 1 (sáng) gồm giá trị > t.
#   w_0, w_1 = tỉ lệ điểm ảnh của mỗi lớp; mu_0, mu_1 = trung bình mỗi lớp; phương sai giữa lớp sigma_B bình phương = w_0·w_1·(mu_0 − mu_1)²
#   (alg.cvi_otsu vét mọi ngưỡng). Phương sai trong lớp sigma_W bình phương = w_0·sigma_0² + w_1·sigma_1²; tổng hai phần = phương sai cả ảnh.
#   Cân bằng: mức v → làm tròn((L − 1) · tỉ lệ tích lũy tới v) (alg.cvi_equalize), L = số mức. Mọi điểm ảnh, ảnh hoá đơn là SỐ MINH HOẠ.
#   Tên Otsu chỉ trên màn hình (probe p1: 0/8, lexicon_vi.CVI.yaml); lời đọc nói “phương pháp chọn ngưỡng tự động”.
objectives:
  - "Lập biểu đồ tần suất và đọc ra hai đỉnh tối, sáng"
  - "Vét mọi ngưỡng và chọn ngưỡng làm phương sai giữa hai lớp lớn nhất"
  - "Cân bằng biểu đồ của một ảnh nhỏ bằng tỉ lệ tích lũy"
  - "Nhận ra khi ánh sáng không đều hoặc biểu đồ một đỉnh thì một ngưỡng toàn cục thất bại"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chụp hoá đơn có bóng tay: một ngưỡng làm đen cả nửa tờ"
    checks:
      - "alg.cvi_otsu([200, 200, 200, 120, 110, 110, 110, 30])[0] == 120"
    steps:
      - show: |
          <p>Ứng dụng quét giấy tờ phải tách <b>chữ</b> (tối) khỏi <b>giấy</b> (sáng). Ảnh chụp tờ hoá đơn có bóng tay ở nửa dưới: giấy trong bóng chỉ còn sáng 110, tối hơn cả chữ ở nửa trên (120).</p>
          <p>Một ngưỡng cho cả ảnh xếp giấy trong bóng vào nhóm “chữ” — nửa dưới đen kịt.</p>
          <div class="box key">Hôm nay: máy tự chọn ngưỡng thế nào? Vì sao “tách hai nhóm xa nhau nhất” cho ra một công thức? Và khi nào một ngưỡng cho cả ảnh là không đủ?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, một ứng dụng quét giấy tờ phải tách chữ màu tối khỏi giấy màu sáng. Ảnh chụp tờ hoá đơn có bóng tay ở nửa dưới, giấy trong bóng chỉ còn sáng 110, tối hơn cả chữ ở nửa trên là 120. Một ngưỡng cho cả ảnh sẽ xếp giấy trong bóng vào nhóm chữ, nên nửa dưới đen kịt. Hôm nay ta hỏi, máy tự chọn ngưỡng thế nào, vì sao tách hai nhóm xa nhau nhất lại cho ra một công thức, và khi nào một ngưỡng cho cả ảnh là không đủ."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "round(sum([10, 10, 12]) / 3, 3) == 10.667"
      - "round(sum((x - 32 / 3) ** 2 for x in [10, 10, 12]) / 3, 3) == 0.889"
      - "2 / 6 == 1 / 3 and [sum([2, 4, 1][:i + 1]) for i in range(3)] == [2, 6, 7]"
    steps:
      - show: |
          <p><b>① Trung bình</b> (khoá Toán cho khoa học máy tính, phần xác suất): cộng lại rồi chia số phần tử. Nhóm 10, 10, 12: $\frac{10 + 10 + 12}{3} = \frac{32}{3} \approx 10{,}667$.</p>
        focus: [1, 1]
        say: "Điều thứ nhất là trung bình, như ở khoá Toán cho khoa học máy tính, phần xác suất, ta cộng lại rồi chia cho số phần tử. Nhóm 10, 10, 12 có trung bình 32 chia 3, xấp xỉ 10 phẩy 667."
      - show: |
          <p><b>② Phương sai:</b> trung bình của bình phương độ lệch so với trung bình — đo nhóm “toả rộng” bao nhiêu.</p>
          $$\frac{(10 - 10{,}667)^2 + (10 - 10{,}667)^2 + (12 - 10{,}667)^2}{3} \approx \frac{0{,}444 + 0{,}444 + 1{,}778}{3} \approx 0{,}889$$
        focus: [1, 2]
        say: "Điều thứ hai là phương sai, tức trung bình của bình phương độ lệch so với trung bình, đo xem nhóm toả rộng bao nhiêu. Với nhóm 10, 10, 12, ba bình phương độ lệch là 0 phẩy 444, 0 phẩy 444 và 1 phẩy 778, chia 3 được xấp xỉ 0 phẩy 889, một nhóm rất chụm."
      - show: |
          <p><b>③ Tỉ lệ và tổng tích lũy:</b> 2 trong 6 điểm là tỉ lệ $\frac{2}{6} = \frac{1}{3}$. Dãy đếm 2, 4, 1 có tổng tích lũy (cộng dồn từ đầu) là 2, 6, 7.</p>
        focus: [1, 1]
        say: "Điều thứ ba là tỉ lệ và tổng tích lũy. Hai trong sáu điểm là tỉ lệ một phần ba, còn dãy đếm 2, 4, 1 có tổng tích lũy, tức cộng dồn từ đầu, là 2, 6 và 7."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: h(v), t, w, mu và hai loại phương sai"
    checks:
      - "alg.cvi_hist([10, 10, 12, 50, 52, 55], 60)[10] == 2 and alg.cvi_hist([10, 10, 12, 50, 52, 55], 60)[12] == 1"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ: 10, 10, 12, 50, 52, 55</th></tr>
          <tr><td>$h(v)$</td><td>biểu đồ tần suất: số điểm ảnh có giá trị $v$</td><td>$h(10) = 2$, $h(12) = 1$</td></tr>
          <tr><td>$t$</td><td>ngưỡng: lớp 0 gồm giá trị $\le t$, lớp 1 gồm giá trị $\gt t$</td><td>$t = 12$: lớp 0 là 10, 10, 12</td></tr>
          <tr><td>$w_0,\ w_1$</td><td>tỉ lệ điểm ảnh của lớp 0, lớp 1</td><td>$\frac{3}{6}$ và $\frac{3}{6}$</td></tr>
          <tr><td>$\mu_0,\ \mu_1$</td><td>trung bình của mỗi lớp (chữ Hy Lạp mu)</td><td>$10{,}667$ và $52{,}333$</td></tr></table>
        introduces: [geq, ltgt, mu]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu bốn ký hiệu. h của v là biểu đồ tần suất, số điểm ảnh có giá trị v, ví dụ h của 10 bằng 2. Chữ t là ngưỡng, lớp 0 gồm các giá trị nhỏ hơn hoặc bằng t, lớp 1 gồm các giá trị lớn hơn t. Chữ w với chỉ số dưới 0 và 1 là tỉ lệ điểm ảnh của mỗi lớp. Chữ Hy Lạp mu với chỉ số dưới là trung bình của mỗi lớp."
      - clear: true
        show: |
          <p>$\sigma_B^2$ (đọc: xích ma B bình phương) — <b>phương sai giữa hai lớp</b>: hai trung bình cách xa nhau bao nhiêu, có tính cỡ mỗi lớp.</p>
          <p>$\sigma_W^2$ — <b>phương sai trong lớp</b>: mỗi lớp tự toả rộng bao nhiêu, cộng theo tỉ lệ $w_0, w_1$. Chỉ số B, W lấy từ chữ đầu tiếng Anh của “giữa” và “trong”.</p>
        introduces: [sigma]
        focus: [1, 2, 2]
        say: "Chữ Hy Lạp xích ma với chỉ số dưới B và mũ hai là phương sai giữa hai lớp, đo hai trung bình cách xa nhau bao nhiêu, có tính cỡ của mỗi lớp. Xích ma với chỉ số dưới W và mũ hai là phương sai trong lớp, đo mỗi lớp tự toả rộng bao nhiêu, cộng theo tỉ lệ w. Hai chỉ số B và W lấy từ chữ đầu của hai từ tiếng Anh nghĩa là giữa và trong."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Biểu đồ hai đỉnh: đặt ngưỡng ở khe giữa"
    checks:
      - "[round(100 + v * 22) for v in (10, 12, 50, 52, 55)] == [320, 364, 1200, 1244, 1310] and round(100 + 32 / 3 * 22) == 335 and round(100 + 157 / 3 * 22) == 1251"
      - "round(157 / 3 - 32 / 3, 1) == 41.7"
    steps:
      - show: |
          <div><svg width="1500" height="450" viewBox="0 0 1500 450">
          <defs><marker id="cv2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
          <rect x="260" y="95" width="522" height="205" fill="#dbeafe"/><rect x="782" y="95" width="588" height="205" fill="#ffedd5"/>
