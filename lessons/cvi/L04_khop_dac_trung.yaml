          <rect x="480" y="60" width="30" height="30" fill="none" stroke="#2a78d6" stroke-width="5"/><text x="530" y="84">vùng phẳng: dời ngang 0, dọc 0, chéo 0 — không có gì để bám</text>
          <rect x="480" y="150" width="30" height="30" fill="none" stroke="#eb6834" stroke-width="5"/><text x="530" y="174">cạnh ngang: dời ngang 0, dọc 300, chéo 300 — trượt dọc cạnh</text>
          <text x="530" y="208">không ai biết đã trượt bao xa</text>
          <rect x="480" y="250" width="30" height="30" fill="none" stroke="#059669" stroke-width="5"/><text x="530" y="274">góc: dời ngang 200, dọc 200, chéo 500 — dời hướng</text>
          <text x="530" y="308">nào cũng lộ, nên định vị được chính xác</text></g>
          <text x="245" y="395" font-size="21" fill="#6b7280" text-anchor="middle">ảnh 11 × 11: góc dưới phải sáng 10, còn lại 0</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là một ảnh 11 nhân 11, góc dưới bên phải sáng 10, phần còn lại tối 0, và ba cửa sổ 3 nhân 3 đặt ở ba chỗ. Cửa sổ xanh lam nằm trong vùng phẳng, dời theo hướng nào thì nội dung cũng không đổi, nên không có gì để bám. Cửa sổ cam nằm trên cạnh ngang, dời ngang dọc theo cạnh thì không đổi, nên ta không biết nó đã trượt bao xa. Cửa sổ xanh lục nằm ở góc, dời hướng nào cũng lộ ra khác biệt, nên định vị được chính xác."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra tiêu chí điểm góc: dời hướng nào cũng phải đổi nhiều"
    checks:
      - "(lambda I: alg.cvi_ssd_shift(I, 4, 4, 0, 1))([[10 if (r >= 4 and c >= 4) else 0 for c in range(11)] for r in range(11)]) == 200 and 2 * 10 ** 2 == 200"
      - "min([0, 0, 0]) == 0 and min([0, 300, 300]) == 0 and min([200, 200, 500]) == 200"
    steps:
      - show: |
          <p><b>Bước 1 — muốn gì.</b> Một điểm tốt để khớp là điểm mà nếu ta đặt sai lệch một chút, nội dung cửa sổ sẽ khác hẳn. Đo “khác” bằng tổng bình phương chênh lệch khi dời:</p>
          $$E(a, b) = \text{tổng trên 9 ô của } (\text{ô sau khi dời} - \text{ô gốc})^2$$
        focus: [1, 1, 2]
        say: "Bước một, ta muốn gì? Một điểm tốt để khớp là điểm mà nếu đặt sai lệch một chút thì nội dung cửa sổ khác hẳn. Vì vậy ta đo sự khác nhau bằng tổng bình phương chênh lệch khi dời, cộng trên 9 ô bình phương của ô sau khi dời trừ ô gốc."
      - show: |
          <p><b>Bước 2 — làm thử ở góc, dời ngang 1 cột.</b> Cửa sổ gốc có 4 ô sáng; sau khi dời có 6 ô sáng. Đúng 2 ô đổi từ 0 thành 10:</p>
          $$E(1, 0) = 2 \cdot (10 - 0)^2 = 2 \cdot 100 = 200$$
        focus: [1, 1, 2]
        say: "Bước hai, làm thử ở góc với phép dời ngang 1 cột. Cửa sổ gốc có 4 ô sáng, sau khi dời có 6 ô sáng, nên đúng 2 ô đổi từ 0 thành 10. Thay vào công thức, E bằng 2 nhân 10 bình phương, bằng 200."
      - clear: true
        show: |
          <p><b>Bước 3 — lấy hướng yếu nhất.</b> Cạnh chỉ đổi theo một số hướng; vùng phẳng không đổi theo hướng nào. Vì vậy điểm góc là điểm mà <b>ngay cả hướng dời đổi ít nhất</b> vẫn đổi nhiều:</p>
          $$\text{điểm góc} \iff \min\big(E(1, 0),\ E(0, 1),\ E(1, 1)\big) \text{ lớn}$$
          <p class="note">Làm thử: vùng phẳng $\min(0, 0, 0) = 0$; cạnh $\min(0, 300, 300) = 0$; góc $\min(200, 200, 500) = \hlg{200}$ — chỉ góc vượt qua.</p>
        introduces: [iff, min_fn]
        focus: [1, 1, 2, 3]
        say: "Bước ba là lấy hướng yếu nhất. Cạnh chỉ đổi theo một số hướng, còn vùng phẳng không đổi theo hướng nào. Vì vậy điểm góc là điểm mà ngay cả hướng dời đổi ít nhất vẫn đổi nhiều, mũi tên hai chiều đọc là khi và chỉ khi, còn min là lấy số nhỏ nhất. Làm thử, vùng phẳng cho 0, cạnh cũng cho 0, chỉ góc cho 200, nên chỉ góc vượt qua."
      - show: |
          <p class="note">Các bộ dò điểm góc thật dùng cùng ý này nhưng thay ba hướng dời bằng mọi hướng, tính gọn qua đạo hàm của ảnh — chính là các $G_x$, $G_y$ tìm cạnh ở bài 1.</p>
        say: "Các bộ dò điểm góc thật dùng cùng ý này, nhưng xét mọi hướng dời và tính gọn qua đạo hàm của ảnh. Đó chính là hai độ thay đổi ngang và dọc mà ta đã đo bằng bộ lọc tìm cạnh ở bài 1, nghĩa là bài này dựng tiếp trên bài đó."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Khớp hai điểm: một cặp rõ ràng, một cặp mơ hồ"
