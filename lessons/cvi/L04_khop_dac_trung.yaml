id: L04
course: CVI
series: "CVI · Thị giác máy tính"
title: "Bài 4 — Đặc trưng và khớp ảnh: điểm góc, mô tả, phép thử tỉ số"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cvi.yaml L04; audit/cvi/verify_cvi.py L04; audit/cvi/sources_L04.md; [L04] D. G. Lowe, Distinctive Image Features from Scale-Invariant Keypoints, IJCV 60(2), 91–110 (2004), bản PDF trên trang tác giả (mục 1: ảnh 500 × 500 cho khoảng 2000 đặc trưng; mục 6.1: mô tả 4 × 4 × 8 = 128 số; mục 7.1: phép thử tỉ số 0,8 bỏ 90% khớp sai, mất dưới 5% khớp đúng); CVI bài 1 (tìm cạnh)"
assumes: [arith, cdot, frac, approx, power, sub, sqrt, implies, geq, ltgt]
# Quy ước: ảnh I chỉ số [hàng, cột]; E(a, b) = tổng bình phương chênh lệch giữa cửa sổ 3 × 3 quanh một điểm và cửa sổ dời a cột, b hàng
#   (alg.cvi_ssd_shift; ba hướng dời: ngang (a, b) = (1, 0), dọc (0, 1), chéo (1, 1)). Mô tả = một vector số tóm tắt vùng quanh điểm
#   (bài báo năm 2004 dùng 128 số; hình vẽ dùng 2 số cho dễ thấy). d1, d2 = khoảng cách Euclid tới mô tả gần nhất, gần nhì
#   (alg.cvi_match); tỉ số r = d1 / d2, giữ khi r nhỏ hơn 0,8. Ảnh 11 × 11, mô tả, tường gạch là SỐ MINH HOẠ.
#   Tên SIFT, Lowe chỉ trên màn hình (chưa có probe đạt); lời đọc nói “bài báo năm 2004 về đặc trưng bất biến theo tỉ lệ”.
objectives:
  - "Tính tổng bình phương chênh lệch khi dời cửa sổ và phân biệt vùng phẳng, cạnh, góc"
  - "Tính khoảng cách mô tả gần nhất, gần nhì và tỉ số của chúng"
  - "Giữ một cặp khớp khi tỉ số nhỏ hơn 0,8, bỏ khi mơ hồ"
  - "Giải thích vì sao vùng lặp lại sinh khớp sai và vì sao vẫn cần kiểm hình học"
asr_reviewed:
  - {sentence: "Điểm p có một láng giềng rất gần là b một, và láng giềng thứ hai xa hơn hẳn.", reason: "ASR chép “Điểm T có một láng giềng rất gần là B1 và láng giềng thứ hai xa hơn hẳn.” (0.947): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ghép hai ảnh bức tường gạch: một nửa số cặp khớp là sai"
    checks:
      - "round(100 * (1 - 0.05)) == 95 and round(100 * (1 - 0.9)) == 10 and round(95 / (95 + 10), 3) == 0.905"
    steps:
      - show: |
          <p>Một ứng dụng ghép hai ảnh chụp chồng mép của một bức tường lát gạch thành ảnh toàn cảnh. Máy tìm được 200 cặp điểm “giống nhau” giữa hai ảnh, nhưng giả sử <b>100 cặp là sai</b>: viên gạch này bị ghép với viên gạch khác y hệt.</p>
          <p>Một phép thử đơn giản trên mỗi cặp — so khoảng cách gần nhất với gần nhì — bỏ <b>90%</b> cặp sai mà chỉ mất <b>dưới 5%</b> cặp đúng trên bộ ảnh thử của Lowe (2004). Giả sử tỉ lệ đó cũng đúng ở đây: còn lại ít nhất 95 cặp đúng, nhiều nhất 10 cặp sai: phần đúng tăng từ 50% lên khoảng <b>90,5%</b>.</p>
          <div class="box key">Hôm nay: điểm nào đáng để khớp? Mô tả một điểm bằng số ra sao? Và vì sao “gần nhất” chưa đủ, phải hỏi thêm “gần nhì”?</div>
        focus: [1, 1, 2, 2, 2, 3]
        say: "Chào bạn, một ứng dụng ghép hai ảnh chụp chồng mép của một bức tường lát gạch thành ảnh toàn cảnh. Máy tìm được 200 cặp điểm giống nhau, nhưng giả sử 100 cặp là sai, vì viên gạch này bị ghép với một viên gạch khác y hệt. Theo bài báo năm 2004 về đặc trưng bất biến theo tỉ lệ, phép thử so khoảng cách gần nhất với gần nhì bỏ được 90 phần trăm cặp sai. Nó chỉ mất dưới 5 phần trăm cặp đúng, trên bộ ảnh thử của bài báo đó. Giả sử tỉ lệ ấy cũng đúng ở đây, thì còn ít nhất 95 cặp đúng và nhiều nhất 10 cặp sai, phần đúng tăng từ 50 lên khoảng 90 phẩy 5 phần trăm. Hôm nay ta hỏi, điểm nào đáng để khớp, mô tả một điểm bằng số ra sao, và vì sao gần nhất chưa đủ mà phải hỏi thêm gần nhì?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "sum((a - b) ** 2 for a, b in zip([1, 2, 3], [1, 4, 3])) == 4"
      - "math.dist((0, 0), (3, 4)) == 5 and math.sqrt(9 + 16) == 5"
      - "round(0.3 / 0.5, 10) == 0.6 and 0.6 < 0.8"
    steps:
      - show: |
          <p><b>① Tổng bình phương chênh lệch:</b> so hai dãy số ô theo ô, lấy hiệu, bình phương, cộng. Dãy 1, 2, 3 với 1, 4, 3:</p>
          $$(1 - 1)^2 + (2 - 4)^2 + (3 - 3)^2 = 0 + 4 + 0 = 4$$
        focus: [1, 2]
        say: "Điều thứ nhất là tổng bình phương chênh lệch, ta so hai dãy số ô theo ô, lấy hiệu, bình phương rồi cộng lại. Dãy 1, 2, 3 so với dãy 1, 4, 3 chỉ lệch ở ô giữa, hiệu bằng âm 2, bình phương bằng 4, nên tổng bằng 4."
      - show: |
          <p><b>② Khoảng cách giữa hai điểm</b> (định lý Pythagore): từ (0, 0) tới (3, 4) là $\sqrt{3^2 + 4^2} = \sqrt{25} = 5$. Với vector nhiều số cũng vậy: cộng bình phương mọi hiệu rồi lấy căn.</p>
        focus: [1, 1]
        say: "Điều thứ hai là khoảng cách giữa hai điểm, theo định lý về tam giác vuông, từ điểm 0, 0 tới điểm 3, 4 là căn của 9 cộng 16, bằng 5. Với vector có nhiều số cũng vậy, ta cộng bình phương mọi hiệu rồi lấy căn."
      - show: |
          <p><b>③ Tỉ số và so sánh:</b> $\frac{0{,}3}{0{,}5} = 0{,}6$, và $0{,}6 \lt 0{,}8$. Tỉ số gần 1 nghĩa là hai số gần bằng nhau.</p>
        focus: [1, 1]
        say: "Điều thứ ba là tỉ số và phép so sánh, 0 phẩy 3 chia 0 phẩy 5 bằng 0 phẩy 6, nhỏ hơn 0 phẩy 8. Tỉ số càng gần 1 nghĩa là hai số càng gần bằng nhau."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: E(a, b), mô tả, d1, d2 và tỉ số r"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$E(a, b)$</td><td>tổng bình phương chênh lệch giữa cửa sổ 3 × 3 quanh một điểm và cửa sổ đó <b>dời</b> $a$ cột, $b$ hàng</td></tr>
          <tr><td>mô tả</td><td>một vector số tóm tắt vùng quanh điểm; bài báo năm 2004 dùng $4 \cdot 4 \cdot 8 = 128$ số</td></tr>
          <tr><td>$d_1,\ d_2$</td><td>khoảng cách từ mô tả của điểm tới mô tả <b>gần nhất</b> và <b>gần nhì</b> trong ảnh kia</td></tr>
          <tr><td>$r = \frac{d_1}{d_2}$</td><td>tỉ số; giữ cặp khớp khi $r \lt 0{,}8$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu bốn ký hiệu. E của a, b là tổng bình phương chênh lệch giữa cửa sổ 3 nhân 3 quanh một điểm và chính cửa sổ đó khi dời a cột, b hàng. Mô tả là một vector số tóm tắt vùng quanh điểm, bài báo năm 2004 dùng 4 nhân 4 nhân 8, bằng 128 số. d một và d hai là khoảng cách từ mô tả của điểm tới mô tả gần nhất và gần nhì trong ảnh kia. Còn r bằng d một chia d hai, và ta giữ cặp khớp khi r nhỏ hơn 0 phẩy 8."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
