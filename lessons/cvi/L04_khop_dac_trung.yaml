      - "(lambda I: [alg.cvi_ssd_shift(I, 4, 8, b, a) for a, b in [(1, 0), (0, 1), (1, 1)]] == [0, 300, 300])([[10 if (r >= 4 and c >= 4) else 0 for c in range(11)] for r in range(11)])"
      - "(lambda I: [alg.cvi_ssd_shift(I, 4, 4, b, a) for a, b in [(1, 0), (0, 1), (1, 1)]] == [200, 200, 500])([[10 if (r >= 4 and c >= 4) else 0 for c in range(11)] for r in range(11)])"
    steps:
      - show: |
