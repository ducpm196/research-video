          <line x1="80" y1="70" x2="410" y2="70"/><line x1="80" y1="100" x2="410" y2="100"/><line x1="80" y1="130" x2="410" y2="130"/><line x1="80" y1="160" x2="410" y2="160"/><line x1="80" y1="190" x2="410" y2="190"/><line x1="80" y1="220" x2="410" y2="220"/><line x1="80" y1="250" x2="410" y2="250"/><line x1="80" y1="280" x2="410" y2="280"/><line x1="80" y1="310" x2="410" y2="310"/><line x1="80" y1="340" x2="410" y2="340"/></g>
