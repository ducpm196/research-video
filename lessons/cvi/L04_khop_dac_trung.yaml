      - "[round(x, 3) for x in alg.cvi_match([(0.2, 0.2)], [(0.5, 0.2), (0.2, 0.7), (1.07, 1.16), (0.5, 1.2)])[0][2:5]] == [0.3, 0.5, 0.6] and alg.cvi_match([(0.2, 0.2)], [(0.5, 0.2), (0.2, 0.7), (1.07, 1.16), (0.5, 1.2)])[0][5]"
      - "[round(math.dist((0.8, 0.8), b), 3) for b in [(0.5, 0.2), (0.2, 0.7), (1.07, 1.16), (0.5, 1.2)]] == [0.671, 0.608, 0.45, 0.5]"
      - "[round(x, 3) for x in alg.cvi_match([(0.8, 0.8)], [(0.5, 0.2), (0.2, 0.7), (1.07, 1.16), (0.5, 1.2)])[0][2:5]] == [0.45, 0.5, 0.9] and not alg.cvi_match([(0.8, 0.8)], [(0.5, 0.2), (0.2, 0.7), (1.07, 1.16), (0.5, 1.2)])[0][5]"
    steps:
