          <g fill="#eb6834"><rect x="210" y="309" width="20" height="20"/><rect x="126" y="169" width="20" height="20"/><rect x="370" y="40" width="20" height="20"/><rect x="210" y="29" width="20" height="20"/></g>
          <g fill="#2a78d6"><circle cx="136" cy="319" r="10"/><circle cx="304" cy="151" r="10"/></g>
          <g font-size="21" fill="#1f2937"><text x="120" y="327" text-anchor="end">p</text><text x="238" y="315">b1</text><text x="154" y="185">b2</text><text x="398" y="56">b3</text><text x="200" y="45" text-anchor="end">b4</text><text x="320" y="172">q</text></g>
          <g font-size="20" fill="#2a78d6"><text x="178" y="347" text-anchor="middle">0,3</text><text x="112" y="258" text-anchor="end">0,5</text><text x="360" y="122">0,45</text><text x="226" y="112" text-anchor="end">0,5</text></g>
          <g font-size="22" fill="#1f2937"><text x="520" y="80">chấm lam: mô tả của p, q (ảnh 1)</text><text x="520" y="120">ô cam: mô tả b1, b2, b3, b4 (ảnh 2)</text>
          <text x="520" y="200">p: gần nhất 0,3, gần nhì 0,5 → rõ ràng</text><text x="520" y="240">q: gần nhất 0,45, gần nhì 0,5 → mơ hồ</text>
          <text x="520" y="320" fill="#6b7280">hình vẽ mô tả 2 số; thật sự là 128 số</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ mỗi mô tả như một điểm, chấm lam là hai điểm p và q của ảnh thứ nhất, ô cam là bốn mô tả b một tới b bốn của ảnh thứ hai. Điểm p có một láng giềng rất gần là b một, và láng giềng thứ hai xa hơn hẳn. Điểm q thì có hai láng giềng b ba và b bốn gần như cách đều."
      - clear: true
        show: |
          <p>Mô tả: $p = (0{,}2;\ 0{,}2)$; $b_1 = (0{,}5;\ 0{,}2)$, $b_2 = (0{,}2;\ 0{,}7)$, $b_3 = (1{,}07;\ 1{,}16)$, $b_4 = (0{,}5;\ 1{,}2)$.</p>
          <p><b>Bước 1.</b> Khoảng cách từ $p$: tới $b_1$ là $\sqrt{0{,}3^2 + 0^2} = 0{,}3$; tới $b_2$ là $0{,}5$; tới $b_3$ khoảng $1{,}296$; tới $b_4$ khoảng $1{,}044$.</p>
        focus: [1, 2]
        say: "Mô tả của p là 0 phẩy 2 và 0 phẩy 2, bốn mô tả của ảnh kia ghi trên bảng. Bước một, khoảng cách từ p tới b một là căn của 0 phẩy 3 bình phương, bằng 0 phẩy 3, tới b hai là 0 phẩy 5, còn tới b ba và b bốn đều hơn 1."
      - show: |
          <p><b>Bước 2.</b> $d_1 = 0{,}3$ (tới $b_1$), $d_2 = 0{,}5$ (tới $b_2$): $r = \frac{0{,}3}{0{,}5} = \hlg{0{,}6} \lt 0{,}8$ → <b>giữ</b> cặp $p$ với $b_1$.</p>
        say: "Bước hai, gần nhất là 0 phẩy 3 tới b một, gần nhì là 0 phẩy 5 tới b hai. Vì vậy tỉ số bằng 0 phẩy 6, nhỏ hơn 0 phẩy 8, và ta giữ cặp p với b một."
      - clear: true
        show: |
          <p>Mô tả $q = (0{,}8;\ 0{,}8)$, cùng bốn mô tả $b_1 \dots b_4$ như trên.</p>
          <p><b>Bước 3.</b> Khoảng cách từ $q$: tới $b_1$ khoảng $0{,}671$; tới $b_2$ khoảng $0{,}608$; tới $b_3$ là $\sqrt{0{,}27^2 + 0{,}36^2} = 0{,}45$; tới $b_4$ là $\sqrt{0{,}3^2 + 0{,}4^2} = 0{,}5$.</p>
          <p><b>Bước 4.</b> $d_1 = 0{,}45$, $d_2 = 0{,}5$: $r = \hlo{0{,}9} \gt 0{,}8$ → <b>bỏ</b>, vì $b_3$ và $b_4$ gần như cách đều — đúng là trường hợp hai viên gạch giống nhau.</p>
        introduces: [dots]
        focus: [1, 2, 3, 3]
        say: "Bây giờ xét điểm q bằng 0 phẩy 8 và 0 phẩy 8, với cùng bốn mô tả, dấu ba chấm nghĩa là từ b một tới b bốn. Bước ba, khoảng cách từ q tới b ba là căn của 0 phẩy 27 bình phương cộng 0 phẩy 36 bình phương, bằng 0 phẩy 45, tới b bốn là 0 phẩy 5. Bước bốn, tỉ số bằng 0 phẩy 45 chia 0 phẩy 5, bằng 0 phẩy 9, lớn hơn 0 phẩy 8, nên ta bỏ cặp này. Lý do là b ba và b bốn gần như cách đều q, đúng như hai viên gạch giống nhau."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: so bình phương khoảng cách, không cần lấy căn"
    checks:
      - "round(0.3 ** 2, 4) == 0.09 and round(0.5 ** 2, 4) == 0.25 and round(0.09 / 0.25, 2) == 0.36 and round(0.8 ** 2, 2) == 0.64"
      - "round(0.45 ** 2, 4) == 0.2025 and round(0.2025 / 0.25, 2) == 0.81 and 0.81 > 0.64"
    steps:
      - show: |
          <p><b>Đường khác:</b> $r \lt 0{,}8$ tương đương $r^2 \lt 0{,}64$, vì cả hai vế đều dương. Bình phương khoảng cách tính ngay được, không cần căn.</p>
          <table class="t"><tr><th>điểm</th><th>$d_1^2$</th><th>$d_2^2$</th><th>$r^2$</th><th>so với $0{,}64$</th></tr>
          <tr><td>$p$</td><td>0,09</td><td>0,25</td><td>0,36</td><td>nhỏ hơn → giữ ✓</td></tr>
          <tr><td>$q$</td><td>0,2025</td><td>0,25</td><td>0,81</td><td>lớn hơn → bỏ ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Kiểm bằng đường khác, tỉ số nhỏ hơn 0 phẩy 8 tương đương bình phương tỉ số nhỏ hơn 0 phẩy 64, vì cả hai vế đều dương. Với p, bình phương hai khoảng cách là 0 phẩy 09 và 0 phẩy 25, tỉ số 0 phẩy 36, nhỏ hơn 0 phẩy 64, nên giữ, khớp với kết quả trước. Với q, tỉ số bình phương là 0 phẩy 81, lớn hơn 0 phẩy 64, nên bỏ, cũng khớp."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "0.45 < 0.5 and round(0.45 / 0.5, 2) == 0.9"
      - "round(0.40 / 0.42, 3) == 0.952"
      - "round(0.43 / 0.5, 2) == 0.86 and round((0.43 / 0.5) ** 2, 3) == 0.74 and (0.43 / 0.5) ** 2 < 0.8 < 0.43 / 0.5 and round(math.sqrt(0.8), 3) == 0.894"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ đặt ngưỡng trên khoảng cách gần nhất <b class="red">(cặp mơ hồ lọt qua)</b>
          <br><span class="note">Ngưỡng “$d_1 \lt 0{,}5$ thì giữ” giữ luôn cặp $q$ ($d_1 = 0{,}45$) dù nó mơ hồ. Bài báo năm 2004 ghi rõ một ngưỡng chung trên khoảng cách gần nhất làm việc kém, vì có mô tả phân biệt tốt hơn mô tả khác.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ nhất là chỉ đặt ngưỡng trên khoảng cách gần nhất, nên cặp mơ hồ lọt qua, ví dụ ngưỡng d một nhỏ hơn 0 phẩy 5 thì giữ sẽ giữ luôn cặp q. Bài báo năm 2004 ghi rõ một ngưỡng chung trên khoảng cách gần nhất làm việc kém, vì có mô tả phân biệt tốt hơn mô tả khác."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tin khớp ở vùng lặp lại <b class="red">(gạch lát, cửa sổ toà nhà, hàng rào)</b>
          <br><span class="note">Mỗi viên gạch có vài “anh em” gần như giống hệt, nên $d_1 \approx d_2$: ví dụ 0,40 và 0,42 cho $r \approx 0{,}952$. Phép thử tỉ số loại chúng; đừng hạ chuẩn để “có đủ điểm” — tìm điểm ở vùng không lặp.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ hai là tin khớp ở vùng lặp lại như gạch lát, cửa sổ toà nhà hay hàng rào. Mỗi viên gạch có vài anh em gần như giống hệt, nên hai khoảng cách gần bằng nhau, ví dụ 0 phẩy 40 và 0 phẩy 42 cho tỉ số khoảng 0 phẩy 952. Phép thử tỉ số loại chúng, và đừng hạ chuẩn chỉ để có đủ điểm, hãy tìm điểm ở vùng không lặp."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Coi cặp qua được phép thử tỉ số là đúng chắc chắn <b class="red">(vẫn còn khớp sai)</b>
          <br><span class="note">Ở phần mở đầu, vẫn còn tới 10 cặp sai trong khoảng 105 cặp giữ lại. Cần thêm một bước kiểm hình học: mọi cặp đúng phải cùng tuân theo một phép biến đổi giữa hai ảnh.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ ba là coi cặp qua được phép thử tỉ số là đúng chắc chắn, trong khi vẫn còn khớp sai. Ở phần mở đầu, vẫn còn tới 10 cặp sai trong khoảng 105 cặp giữ lại. Vì thế cần thêm một bước kiểm hình học, nghĩa là mọi cặp đúng phải cùng tuân theo một phép biến đổi giữa hai ảnh."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> So <b>bình phương</b> khoảng cách với ngưỡng 0,8 <b class="red">(ngưỡng thật thành 0,894)</b></div>
          <table class="t"><tr><th>$d_1 = 0{,}43$, $d_2 = 0{,}5$</th><th>giá trị</th><th>so với 0,8</th></tr>
          <tr><td>tỉ số khoảng cách $r$</td><td>0,86</td><td>lớn hơn → bỏ (đúng)</td></tr>
          <tr><td>tỉ số bình phương $r^2$</td><td>0,74</td><td class="red">nhỏ hơn → giữ (sai)</td></tr></table>
          <p class="note">Nhiều thư viện tìm láng giềng trả về bình phương khoảng cách cho nhanh. Đọc kỹ đơn vị; nếu là bình phương thì so với $0{,}8^2 = 0{,}64$.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, so bình phương khoảng cách với ngưỡng 0 phẩy 8, khiến ngưỡng thật thành 0 phẩy 894. Với d một bằng 0 phẩy 43 và d hai bằng 0 phẩy 5, tỉ số khoảng cách là 0 phẩy 86, lớn hơn 0 phẩy 8, nên bỏ là đúng. Nhưng tỉ số bình phương chỉ 0 phẩy 74, nhỏ hơn 0 phẩy 8, nên cặp mơ hồ bị giữ lại. Nhiều thư viện tìm láng giềng trả về bình phương khoảng cách cho nhanh, nên hãy đọc kỹ đơn vị và so với 0 phẩy 64 nếu là bình phương."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: hai phép thử tỉ số và một quyết định ghép ảnh"
    checks:
      - "round(0.2 / 0.4, 2) == 0.5 and round(0.40 / 0.42, 3) == 0.952"
      - "(lambda I: [alg.cvi_ssd_shift(I, 4, 8, b, a) for a, b in [(1, 0), (0, 1), (1, 1)]])([[10 if (r >= 4 and c >= 4) else 0 for c in range(11)] for r in range(11)]) == [0, 300, 300] and 3 * 10 ** 2 == 300"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Điểm A: gần nhất 0,2, gần nhì 0,4. Điểm B: gần nhất 0,40, gần nhì 0,42. Giữ điểm nào?</td></tr>
          <tr><td>2</td><td>Ở cửa sổ cạnh ngang của hình ba cửa sổ, vì sao dời dọc 1 hàng cho $E = 300$? Điểm đó có phải điểm góc không?</td></tr>
          <tr><td>3</td><td>Ghép ảnh tường gạch, sau phép thử 0,8 chỉ còn 12 cặp. Bạn hạ chuẩn lên 0,95 cho nhiều cặp hơn, hay làm gì khác?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn. Câu một, điểm A có gần nhất 0 phẩy 2 và gần nhì 0 phẩy 4, điểm B có gần nhất 0 phẩy 40 và gần nhì 0 phẩy 42, bạn giữ điểm nào? Câu hai, ở cửa sổ cạnh ngang trong hình ba cửa sổ, vì sao dời dọc 1 hàng cho E bằng 300, và điểm đó có phải điểm góc không? Câu ba, ghép ảnh tường gạch mà sau phép thử 0 phẩy 8 chỉ còn 12 cặp, bạn nới chuẩn lên 0 phẩy 95 cho nhiều cặp hơn, hay làm gì khác? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Câu 1.</b> A: $\frac{0{,}2}{0{,}4} = \hlg{0{,}5}$ → giữ. B: $\frac{0{,}40}{0{,}42} \approx 0{,}952$ → bỏ, vì mơ hồ.</p>
          <p><b>Câu 2.</b> Dời dọc 1 hàng: hàng tối trên cùng của cửa sổ được thay bằng hàng sáng, nên đúng 3 ô đổi từ 0 thành 10: $3 \cdot 10^2 = 300$. Nhưng dời ngang cho 0, nên $\min = 0$: <b>không</b> phải điểm góc.</p>
        focus: [1, 1, 2, 2]
        say: "Câu một, điểm A có tỉ số 0 phẩy 2 chia 0 phẩy 4, bằng 0 phẩy 5, nên giữ. Điểm B có tỉ số khoảng 0 phẩy 952, nên bỏ vì mơ hồ. Câu hai, dời dọc 1 hàng thì đúng 3 ô đổi từ 0 thành 10, nên E bằng 3 nhân 100, bằng 300. Nhưng dời ngang cho 0, nên số nhỏ nhất bằng 0 và đó không phải điểm góc."
      - show: |
          <table class="t"><tr><th>câu 3</th><th>được</th><th>mất</th></tr>
          <tr><td>nới chuẩn lên 0,95</td><td>nhiều cặp hơn</td><td class="red">thêm chủ yếu cặp gạch mơ hồ, ảnh ghép lệch</td></tr>
          <tr><td>giữ 0,8, thêm điểm ở mép tường, khung cửa, đồ vật</td><td>cặp ít mà rõ ràng</td><td>cần chụp chồng mép rộng hơn</td></tr>
          <tr><td>giữ 0,8, rồi kiểm hình học trên 12 cặp</td><td>12 cặp đúng là đủ cho một phép biến đổi</td><td>tốn thêm một bước tính</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Câu ba là một đánh đổi. Nới chuẩn lên 0 phẩy 95 cho nhiều cặp hơn, nhưng phần thêm vào chủ yếu là cặp gạch mơ hồ, làm ảnh ghép lệch. Giữ chuẩn 0 phẩy 8 và thêm điểm ở mép tường, khung cửa hay đồ vật cho ít cặp mà rõ ràng, nhưng cần chụp chồng mép rộng hơn. Giữ chuẩn rồi kiểm hình học trên 12 cặp thường là đủ, vì một phép biến đổi giữa hai ảnh chỉ cần vài cặp đúng."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">điểm tốt: dời hướng nào cũng đổi</span><span class="a">→</span>
          <span class="n">góc: min của E vẫn lớn</span><span class="a">→</span>
          <span class="n">mô tả = vector số quanh điểm</span><span class="a">→</span>
          <span class="n">gần nhất chia gần nhì nhỏ hơn 0,8 thì giữ</span><span class="a">→</span>
          <span class="n">vẫn còn khớp sai: phải kiểm hình học</span></div>
        say: "Tổng kết lại, một điểm tốt để khớp là điểm mà dời hướng nào nội dung cũng đổi, nên ở góc thì ngay cả hướng yếu nhất vẫn cho E lớn. Mỗi điểm được tóm tắt bằng một vector mô tả, và ta chỉ giữ cặp khớp khi khoảng cách gần nhất chia gần nhì nhỏ hơn 0 phẩy 8. Dù vậy vẫn còn khớp sai, nên phải kiểm hình học."
      - show: |
          <div class="box key"><b>Tư duy:</b> “giống nhất” chưa phải là “đúng”. Chuyên gia hỏi thêm: có ứng viên thứ hai nào gần như giống bằng không? Nếu có, câu trả lời là “không biết”, và không biết thì bỏ.</div>
        say: "Điều cần mang theo, giống nhất chưa phải là đúng. Chuyên gia hỏi thêm, có ứng viên thứ hai nào gần như giống bằng không? Nếu có, câu trả lời là không biết, và không biết thì bỏ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>ước lượng bền vững</b> — bốc ngẫu nhiên vài cặp, dựng phép biến đổi, đếm xem bao nhiêu cặp đồng ý, và tính cần bốc bao nhiêu lần là đủ chắc.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học ước lượng bền vững, bốc ngẫu nhiên vài cặp, dựng phép biến đổi và đếm xem bao nhiêu cặp đồng ý. Ta cũng tính cần bốc bao nhiêu lần là đủ chắc. Hẹn gặp bạn ở bài tiếp theo."
