scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "300 ảnh, đúng 100% lúc học, 60% lúc dùng"
    checks:
      - "512 * 10 + 10 == 5130 and 3 * 3 * 512 * 512 + 512 == 2_359_808"
    steps:
      - show: |
          <p>Một xưởng có <b>300 ảnh</b> sản phẩm, gán nhãn 10 loại lỗi. Họ huấn luyện từ đầu một mạng tích chập hàng triệu tham số: đúng <b>100%</b> trên ảnh đã học, chỉ <b>60%</b> trên ảnh mới (số minh hoạ).</p>
          <p>Cách khác: mượn một mạng đã học sẵn trên hơn một triệu ảnh, giữ nguyên phần thân, chỉ học lại lớp cuối — <b>5130 tham số</b>.</p>
          <div class="box key">Hôm nay: một ô ở lớp sâu “nhìn” được bao nhiêu điểm ảnh? Vì sao phần thân học từ ảnh khác vẫn dùng được? Và tăng cường dữ liệu thế nào mà không dạy mô hình điều sai?</div>
        focus: [1, 1, 2, 3, 3]
        say: "Chào bạn, một xưởng có 300 ảnh sản phẩm, gán nhãn 10 loại lỗi. Họ huấn luyện từ đầu một mạng tích chập hàng triệu tham số, và nó đúng 100 phần trăm trên ảnh đã học nhưng chỉ 60 phần trăm trên ảnh mới. Cách khác là mượn một mạng đã học sẵn trên hơn một triệu ảnh, giữ nguyên phần thân, chỉ học lại lớp cuối có 5130 tham số. Hôm nay ta hỏi, một ô ở lớp sâu nhìn được bao nhiêu điểm ảnh. Vì sao phần thân học từ ảnh khác vẫn dùng được, và tăng cường dữ liệu thế nào mà không dạy mô hình điều sai?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều về mạng tích chập"
    checks:
      - "4 * 2 + 2 == 10 and (4 + 1) * 2 == 10"
      - "alg.cvi_out_size(224, 7, 3, 2) == 112 and (224 + 2 * 3 - 7) // 2 + 1 == 112 and alg.cvi_out_size(112, 3, 1, 2) == 56"
      - "alg.cvi_out_size(5, 3, 0, 2) == 2 and (5 - 3) // 2 + 1 == 2 and [i for i in range(0, 5 - 3 + 1, 2)] == [0, 2]"
      - "3 * 3 * 3 * 64 + 64 == 1792 and (3 * 3 * 3 + 1) * 64 == 1792"
      - "[max(1, 5), max(2, 8)] == [5, 8]"
    steps:
      - show: |
          <p><b>① Lớp đầy đủ</b>: mỗi số ra bằng tổng của (trọng số nhân số vào) qua <b>mọi</b> số vào, cộng một <b>hệ số tự do</b>. Vậy $n$ số vào, $m$ số ra cần $n \cdot m$ trọng số và $m$ hệ số tự do. Ví dụ 4 vào, 2 ra: mỗi số ra cần $4 + 1 = 5$ số, tổng $4 \cdot 2 + 2 = 10$ <b>tham số</b> — những con số mạng tự chỉnh khi học.</p>
        focus: [1, 1, 1, 1]
        say: "Trước hết, ta ôn lại từ đầu bốn điều về mạng tích chập. Lớp đầy đủ là lớp mà mỗi số ra bằng tổng của trọng số nhân số vào, lấy qua mọi số vào, rồi cộng một hệ số tự do. Vì vậy n số vào và m số ra cần n nhân m trọng số, cộng m hệ số tự do. Ví dụ 4 vào 2 ra, mỗi số ra cần 4 cộng 1 bằng 5 số, tổng cộng 10 tham số, tức những con số mạng tự chỉnh khi học."
      - show: |
          <p><b>② Kích thước đầu ra</b> của tích chập (trượt bộ lọc như bài 1): cạnh ảnh $N$, bộ lọc $k$, <b>đệm</b> $P$ (thêm $P$ hàng, $P$ cột số 0 quanh viền), <b>bước nhảy</b> $S$ (mỗi lần trượt đi $S$ ô):</p>
          $$\Big\lfloor \frac{N + 2P - k}{S} \Big\rfloor + 1, \qquad \Big\lfloor \frac{224 + 6 - 7}{2} \Big\rfloor + 1 = \lfloor 111{,}5 \rfloor + 1 = 112$$
          <p class="note">Ví dụ nhỏ: cạnh 5, bộ lọc 3, không đệm, bước 2 — bộ lọc chỉ đặt được ở vị trí 0 và 2: $\lfloor \frac{5 - 3}{2} \rfloor + 1 = 2$ chỗ.</p>
        introduces: [floor]
        focus: [1, 1, 2, 3, 2]
        say: "Thứ hai là kích thước đầu ra của tích chập, tức phép trượt bộ lọc như ở bài 1. Đệm P nghĩa là thêm P hàng và P cột số 0 quanh viền ảnh, còn bước nhảy S nghĩa là mỗi lần trượt bộ lọc đi S ô. Dấu ngoặc vuông gãy dưới là làm tròn xuống. Ví dụ nhỏ, ảnh cạnh 5, bộ lọc 3, không đệm, bước nhảy 2, thì bộ lọc chỉ đặt được ở vị trí 0 và 2, tức 2 chỗ, khớp công thức. Ảnh 224 với bộ lọc 7, đệm 3, bước nhảy 2 cho 111 phẩy 5, làm tròn xuống 111, cộng 1 bằng 112."
      - clear: true
        show: |
          <p><b>③ Một lớp tích chập</b> $k \times k$, $C_{\text{vào}}$ kênh vào, $C_{\text{ra}}$ bộ lọc: mỗi bộ lọc phủ cả $C_{\text{vào}}$ kênh (như 3 kênh màu ở bài 0), nên có $k \cdot k \cdot C_{\text{vào}}$ trọng số và 1 hệ số tự do; cả lớp $k \cdot k \cdot C_{\text{vào}} \cdot C_{\text{ra}} + C_{\text{ra}}$ tham số. Lớp đầu trên ảnh màu, 64 bộ lọc 3 × 3: $3 \cdot 3 \cdot 3 \cdot 64 + 64 = 1792$.</p>
          <p class="note">Nhiều tham số mà ít ảnh thì mạng <b>học thuộc</b>: đúng gần hết trên ảnh đã học, sai nhiều trên ảnh mới — gọi là <b>quá khớp</b>.</p>
        focus: [1, 1, 1, 2]
        say: "Thứ ba, xét một lớp tích chập k nhân k, có C vào kênh vào và C ra bộ lọc. Mỗi bộ lọc phủ cả C vào kênh, như 3 kênh màu ở bài 0, nên có k nhân k nhân C vào trọng số cộng 1 hệ số tự do, rồi nhân cho C ra bộ lọc. Ví dụ lớp đầu trên ảnh màu với 64 bộ lọc 3 nhân 3 có 3 nhân 3 nhân 3 nhân 64 cộng 64, bằng 1792 tham số. Nhiều tham số mà ít ảnh thì mạng học thuộc, đúng gần hết trên ảnh đã học mà sai nhiều trên ảnh mới, và đó gọi là quá khớp."
      - show: |
          <p><b>④ Mạng tích chập</b>: chồng nhiều lớp tích chập — mỗi lớp gồm nhiều bộ lọc mà mạng <b>tự học</b> trọng số, thay vì ta chọn sẵn như bộ lọc tìm cạnh ở bài 1 — xen giữa là <b>lớp gộp</b>: lấy số lớn nhất trong mỗi ô nhỏ, không có tham số. Cuối mạng là lớp đầy đủ cho điểm từng loại.</p>
          <p class="note">Gộp từng cặp trên hàng 1, 5, 2, 8 (bước 2): giữ số lớn hơn của mỗi cặp, còn 5 và 8.</p>
        focus: [1, 1, 1, 2]
        say: "Thứ tư, mạng tích chập là chồng nhiều lớp tích chập, mỗi lớp gồm nhiều bộ lọc mà mạng tự học trọng số, thay vì ta chọn sẵn như bộ lọc tìm cạnh ở bài 1. Xen giữa các lớp đó là lớp gộp, lấy số lớn nhất trong mỗi ô nhỏ và không có tham số nào. Cuối mạng là một lớp đầy đủ, cho điểm từng loại. Ví dụ gộp từng cặp trên hàng 1, 5, 2, 8 chỉ giữ số lớn hơn của mỗi cặp, nên còn 5 và 8."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: trường tiếp nhận, phần thân, đặc trưng, đầu phân loại"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>trường tiếp nhận</b> $r$</td><td>số điểm ảnh (theo một chiều) mà một ô ở lớp sâu chịu ảnh hưởng</td></tr>
          <tr><td><b>phần thân</b></td><td>các lớp tích chập đầu; học trên một bộ ảnh lớn rồi <b>đóng băng</b> (không đổi trọng số)</td></tr>
          <tr><td><b>đặc trưng</b></td><td>vector số ở cuối phần thân; mạng có lối tắt 18 lớp cho 512 số</td></tr>
          <tr><td><b>đầu phân loại</b></td><td>lớp đầy đủ cuối cùng: 512 số vào, một điểm cho mỗi lớp; đây là phần học lại</td></tr></table>
          <p class="note"><b>Mạng có lối tắt</b> (ResNet, He và cộng sự 2015): mỗi khối vài lớp cộng thẳng đầu vào của khối vào đầu ra của nó, nhờ đó học được mạng rất sâu; bản 18 lớp là bản nhỏ nhất trong bài báo.</p>
        focus: [0, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng giới thiệu bốn thuật ngữ. Trường tiếp nhận, chữ r, là số điểm ảnh theo một chiều mà một ô ở lớp sâu chịu ảnh hưởng. Phần thân là các lớp tích chập đầu, học trên một bộ ảnh lớn rồi đóng băng, tức không đổi trọng số nữa. Đặc trưng là vector số ở cuối phần thân, mạng có lối tắt 18 lớp cho 512 số. Đầu phân loại là lớp đầy đủ cuối cùng, nhận 512 số và cho một điểm mỗi lớp, và đây là phần ta học lại. Còn mạng có lối tắt là mạng mà mỗi khối vài lớp cộng thẳng đầu vào của khối vào đầu ra của nó, nhờ đó học được mạng rất sâu."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi lớp 3 × 3 nhìn rộng thêm 2 điểm ảnh"
    checks:
      - "[alg.cvi_receptive_field([(3, 1)] * n) for n in (1, 2, 3)] == [3, 5, 7]"
      - "(lambda f: sum(1 for i in range(15) if f(np.eye(15)[i])[4] != 0))(lambda x: np.convolve(np.convolve(np.convolve(x, np.ones(3), 'valid'), np.ones(3), 'valid'), np.ones(3), 'valid')) == 7"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380">
          <g stroke="#94a3b8" stroke-width="2" fill="none"><line x1="675" y1="90" x2="625" y2="130"/><line x1="725" y1="90" x2="775" y2="130"/><line x1="625" y1="180" x2="575" y2="220"/><line x1="775" y1="180" x2="825" y2="220"/><line x1="575" y1="270" x2="525" y2="310"/><line x1="825" y1="270" x2="875" y2="310"/></g>
          <g stroke="#1f2937" stroke-width="2">
          <rect x="675" y="40" width="50" height="50" fill="#059669"/>
          <rect x="625" y="130" width="50" height="50" fill="#a7f3d0"/><rect x="675" y="130" width="50" height="50" fill="#a7f3d0"/><rect x="725" y="130" width="50" height="50" fill="#a7f3d0"/>
          <rect x="575" y="220" width="50" height="50" fill="#dbeafe"/><rect x="625" y="220" width="50" height="50" fill="#dbeafe"/><rect x="675" y="220" width="50" height="50" fill="#dbeafe"/><rect x="725" y="220" width="50" height="50" fill="#dbeafe"/><rect x="775" y="220" width="50" height="50" fill="#dbeafe"/>
          <rect x="525" y="310" width="50" height="50" fill="#fde68a"/><rect x="575" y="310" width="50" height="50" fill="#fde68a"/><rect x="625" y="310" width="50" height="50" fill="#fde68a"/><rect x="675" y="310" width="50" height="50" fill="#fde68a"/><rect x="725" y="310" width="50" height="50" fill="#fde68a"/><rect x="775" y="310" width="50" height="50" fill="#fde68a"/><rect x="825" y="310" width="50" height="50" fill="#fde68a"/>
          </g>
          <g font-size="22" fill="#1f2937" text-anchor="end"><text x="560" y="73">lớp 3: một ô</text><text x="510" y="163">lớp 2: 3 ô</text><text x="460" y="253">lớp 1: 5 ô</text><text x="410" y="343">ảnh: 7 điểm ảnh</text></g>
          <g font-size="22" fill="#6b7280"><text x="920" y="163">mỗi ô nhìn 3 ô bên dưới</text><text x="920" y="253">hai ô kề nhau lệch 1 → thêm 2</text><text x="920" y="343">ba lớp 3 × 3: r = 1 + 2 + 2 + 2 = 7</text></g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đi từ trên xuống, một ô ở lớp 3 nhìn 3 ô của lớp 2 bên dưới nó. Ba ô đó, mỗi ô lại nhìn 3 ô của lớp 1, nhưng chúng kề nhau nên chỉ thêm 1 ô mỗi bên, tổng cộng 5 ô. Năm ô đó nhìn 7 điểm ảnh của ảnh gốc. Vậy ba lớp 3 nhân 3 cho trường tiếp nhận bằng 1 cộng 3 nhân 2, bằng 7 điểm ảnh, vẫn rất nhỏ so với ảnh 224."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra trường tiếp nhận khi có bước nhảy"
    checks:
      - "alg.cvi_receptive_field([(3, 1)]) == 3 and alg.cvi_receptive_field([(3, 1), (3, 1)]) == 3 + 2 * 1"
      - "alg.cvi_receptive_field([(7, 2)]) == 7 and alg.cvi_receptive_field([(7, 2), (3, 2)]) == 7 + 2 * 2 == 11 and alg.cvi_receptive_field([(7, 2), (3, 2), (3, 1)]) == 11 + 2 * 4 == 19"
    steps:
      - show: |
          <p><b>Bước 1 — thêm một lớp.</b> Lớp mới cạnh $k$ nhìn $k$ ô liền nhau của lớp dưới; các ô này lệch nhau $j$ điểm ảnh, với $j$ là tích các bước nhảy phía trước. Nên mỗi lớp thêm $(k - 1) \cdot j$:</p>
          $$r \leftarrow r + (k - 1) \cdot j$$
          <p class="note">Làm thử hai lớp 3 × 3 bước 1: $r = 3 + 2 \cdot 1 = 5$, đúng như hình.</p>
        introduces: [assign]
        focus: [1, 1, 1, 2, 3]
        say: "Bước một, thêm một lớp. Lớp mới cạnh k nhìn k ô liền nhau của lớp dưới, các ô này lệch nhau j điểm ảnh, với j là tích các bước nhảy phía trước. Vì vậy mỗi lớp thêm k trừ 1 nhân j. Mũi tên trái nghĩa là thay r bằng giá trị mới. Làm thử hai lớp 3 nhân 3 bước 1, r bằng 3 cộng 2 nhân 1, bằng 5, đúng như hình."
      - show: |
          <p><b>Bước 2 — bước nhảy làm $j$ gấp đôi.</b> Tầng đầu của mạng có lối tắt (bảng 1, He và cộng sự 2015): tích chập 7 × 7 bước 2, rồi gộp 3 × 3 bước 2, rồi tích chập 3 × 3.</p>
          <table class="t"><tr><th>lớp</th><th>$k$, bước</th><th>$j$ trước lớp</th><th>$r$ sau lớp</th></tr>
          <tr><td>tích chập đầu</td><td>7, bước 2</td><td>1</td><td>7</td></tr>
          <tr><td>gộp</td><td>3, bước 2</td><td>2</td><td>$7 + 2 \cdot 2 = 11$</td></tr>
          <tr><td>tích chập 3 × 3</td><td>3, bước 1</td><td>4</td><td>$11 + 2 \cdot 4 = \hlg{19}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước hai, bước nhảy làm j gấp đôi. Tầng đầu của mạng có lối tắt, theo bảng 1 của bài báo năm 2015, là tích chập 7 nhân 7 bước 2, cho r bằng 7. Tiếp theo là lớp gộp 3 nhân 3 bước 2, lúc này j bằng 2, nên r bằng 7 cộng 2 nhân 2, bằng 11. Rồi một lớp 3 nhân 3, j đã là 4, nên r bằng 11 cộng 2 nhân 4, bằng 19."
      - clear: true
        show: |
          <p class="note">So sánh: ba lớp 3 × 3 không bước nhảy chỉ cho 7; ba lớp có hai bước nhảy cho 19. Bước nhảy và gộp làm trường tiếp nhận tăng theo cấp số nhân, nhờ đó lớp sâu “thấy” được cả vật lớn.</p>
        say: "So sánh lại, ba lớp 3 nhân 3 không bước nhảy chỉ cho 7, còn ba lớp có hai bước nhảy cho 19. Vì bước nhảy làm j gấp đôi mỗi lần, nên trường tiếp nhận tăng rất nhanh, nhờ đó lớp sâu thấy được cả vật lớn."

  - id: transfer
    kind: intuition
    title: "Học chuyển giao: giữ phần thân, thay lớp cuối"
    steps:
