  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Đếm tham số, tính điểm, và chọn phép tăng cường"
    checks:
      - "512 * 10 + 10 == 5130"
      - "3 * 3 * 512 * 512 + 512 == 2_359_808 and round(2_359_808 / 5130) == 460"
      - "3 * 3 * 512 * 512 == 2_359_296 and round(2_359_296 / 5130) == 460"
      - "(lambda W, b, x: [round(sum(wi * xi for wi, xi in zip(w, x)) + bb, 3) for w, bb in zip(W, b)])([[0.5, -1, 1, 0], [1, 1, -0.5, 0.5]], [0.1, 0], [1, 0, 2, 1]) == [2.6, 0.5]"
      - "alg.cvi_seg7_transform(6, 'rot180') == 9 and alg.cvi_seg7_transform(2, 'flip') == 5 and alg.cvi_seg7_transform(6, 'flip') is None and alg.cvi_seg7_transform(8, 'flip') == 8"
    steps:
      - show: |
          <p><b>Bước 1 — tham số của đầu phân loại.</b> 512 đặc trưng vào, 10 loại lỗi ra:</p>
          $$512 \cdot 10 + 10 = \hlg{5130}$$
          <p><b>Bước 2 — so với một lớp của phần thân.</b> Khối cuối có lớp 3 × 3, 512 kênh vào, 512 bộ lọc: $3 \cdot 3 \cdot 512 \cdot 512 + 512 = 2\,359\,808$ — gấp khoảng <b>460</b> lần cả đầu phân loại.</p>
          <p class="note">Số này tính cả hệ số tự do, như công thức ở phần ôn. Mạng có <b>chuẩn hoá theo lô</b> sau mỗi tích chập (như mạng có lối tắt) thì bỏ hệ số tự do vì bước chuẩn hoá đã triệt nó: còn $3 \cdot 3 \cdot 512 \cdot 512 = 2\,359\,296$, vẫn gấp khoảng 460 lần.</p>
        focus: [1, 2, 3, 4]
        say: "Bước một, đầu phân loại nhận 512 đặc trưng và cho 10 loại lỗi, nên theo công thức lớp đầy đủ có 512 nhân 10 cộng 10, bằng 5130 tham số. Bước hai, so với chỉ một lớp của phần thân, lớp 3 nhân 3 với 512 kênh vào và 512 bộ lọc có 2 triệu 359 nghìn 808 tham số. Con số đó gấp khoảng 460 lần cả đầu phân loại, nên với 300 ảnh, học lại lớp cuối an toàn hơn nhiều. Số này tính cả hệ số tự do, còn mạng có chuẩn hoá theo lô sau mỗi tích chập thì bỏ hệ số tự do, chỉ còn 2 triệu 359 nghìn 296, kết luận vẫn như vậy."
      - clear: true
        show: |
          <p><b>Bước 3 — đầu phân loại tính điểm</b> (thu nhỏ: 4 đặc trưng $x = (1, 0, 2, 1)$, 2 lớp):</p>
          <table class="t"><tr><th>lớp</th><th>trọng số</th><th>tự do</th><th>điểm</th></tr>
          <tr><td>trầy xước</td><td>0,5; −1; 1; 0</td><td>0,1</td><td>$0{,}5 + 0 + 2 + 0 + 0{,}1 = \hlg{2{,}6}$</td></tr>
          <tr><td>móp</td><td>1; 1; −0,5; 0,5</td><td>0</td><td>$1 + 0 - 1 + 0{,}5 = 0{,}5$</td></tr></table>
          <p class="note">Chọn lớp điểm cao nhất: trầy xước. Học lại đầu phân loại là chỉnh 10 số này ($4 \cdot 2 + 2$).</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước ba, xem đầu phân loại tính điểm trên một bản thu nhỏ với 4 đặc trưng và 2 lớp. Lớp trầy xước nhân từng đặc trưng với trọng số rồi cộng hệ số tự do, được 2 phẩy 6. Lớp móp được 0 phẩy 5. Máy chọn lớp điểm cao nhất là trầy xước, và học lại đầu phân loại chính là chỉnh 10 con số này."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 4 — tăng cường trên chữ số bảy đoạn</th><th>kết quả</th><th>giữ nhãn?</th></tr>
          <tr><td>xoay 180° chữ 6</td><td>thành 9</td><td class="red">không — dạy mô hình “6 là 9”</td></tr>
          <tr><td>lật ngang chữ 2</td><td>thành 5</td><td class="red">không</td></tr>
          <tr><td>lật ngang chữ 6</td><td>không còn là chữ số nào</td><td class="red">không</td></tr>
          <tr><td>dịch 2 điểm ảnh, đổi sáng tối nhẹ</td><td>vẫn là chữ cũ</td><td>có</td></tr></table>
          <p class="note">Ảnh tự nhiên (con mèo, cái cốc) thì lật ngang vẫn giữ nhãn — chính bài báo năm 2015 dùng lật ngang khi học trên một triệu ảnh. Chữ số, chữ viết, biển báo trái phải thì không.</p>
        focus: [0, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bước bốn là chọn phép tăng cường, thử trên chữ số bảy đoạn. Xoay 180 độ chữ 6 thì thành 9, nên nếu vẫn gán nhãn 6 là dạy mô hình điều sai. Lật ngang chữ 2 thì thành 5. Lật ngang chữ 6 thì không còn là chữ số nào. Dịch vài điểm ảnh hay đổi sáng tối nhẹ thì vẫn là chữ cũ, nên đó là phép tăng cường an toàn. Với ảnh tự nhiên như con mèo hay cái cốc thì lật ngang vẫn giữ nhãn, nhưng chữ số và biển báo trái phải thì không."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: đếm trường tiếp nhận bằng cách chọc từng điểm ảnh"
    checks:
      - "(lambda f: [i for i in range(15) if f(np.eye(15)[i])[4] != 0])(lambda x: np.convolve(np.convolve(np.convolve(x, np.ones(3), 'valid'), np.ones(3), 'valid'), np.ones(3), 'valid')) == [4, 5, 6, 7, 8, 9, 10]"
      - "len(np.convolve(np.convolve(np.convolve(np.zeros(15), np.ones(3), 'valid'), np.ones(3), 'valid'), np.ones(3), 'valid')) == 9"
    steps:
      - show: |
          <p><b>Đường khác:</b> không dùng công thức. Cho một hàng 15 điểm ảnh toàn 0, bật <b>một</b> điểm thành 1, chạy qua ba lớp 3 × 3 (mọi trọng số bằng 1), rồi xem ô ra số 4 có khác 0 không. Lặp lại cho từng vị trí:</p>
          <table class="t"><tr><th>điểm ảnh bật</th><th>0 … 3</th><th>4 … 10</th><th>11 … 14</th></tr>
          <tr><td>ô ra số 4 khác 0?</td><td>không</td><td>$\hlg{có — 7 vị trí}$</td><td>không</td></tr></table>
        introduces: [dots]
        focus: [1, 1, 2, 2]
        say: "Kiểm bằng đường khác, không dùng công thức. Ta cho một hàng 15 điểm ảnh toàn 0, bật một điểm thành 1, chạy qua ba lớp 3 nhân 3 với mọi trọng số bằng 1, rồi xem ô ra số 4 có khác 0 không. Lặp lại cho từng vị trí, chỉ các điểm từ 4 tới 10 làm ô đó thay đổi, dấu ba chấm nghĩa là các số ở giữa. Đúng 7 vị trí, khớp với công thức 1 cộng 3 nhân 2."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "3 * 3 * 512 * 512 + 512 > 300 * 1000"
      - "alg.cvi_seg7_transform(2, 'flip') == 5 and alg.cvi_seg7_transform(6, 'rot180') == 9"
      - "alg.cvi_receptive_field([(3, 1)] * 3) == 7 and 7 < 100"
      - "(180 - 120) / 60 == 1.0 and round(180 / 255, 3) == 0.706 and (60 - 120) / 60 == -1.0 and round(60 / 255, 3) == 0.235"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Học lại cả mạng với vài trăm ảnh <b class="red">(học thuộc, như phần mở đầu)</b>
          <br><span class="note">Một lớp của phần thân đã có hơn 2 triệu tham số, mà chỉ có 300 ảnh. Bài báo năm 2014 về khả năng chuyển giao ghi: dữ liệu đích nhỏ và nhiều tham số thì tinh chỉnh dễ quá khớp, nên đặc trưng thường được đóng băng.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ nhất là học lại cả mạng với vài trăm ảnh, nên mạng học thuộc như ở phần mở đầu. Một lớp của phần thân đã có hơn 2 triệu tham số, mà chỉ có 300 ảnh. Bài báo năm 2014 về khả năng chuyển giao ghi rằng khi dữ liệu đích nhỏ và nhiều tham số thì tinh chỉnh dễ quá khớp, nên đặc trưng thường được đóng băng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tăng cường làm đổi nhãn <b class="red">(xoay chữ số, lật biển báo)</b>
          <br><span class="note">Lật ngang chữ 2 thành 5; lật biển “rẽ trái” thành “rẽ phải”. Phép thử: in vài ảnh sau tăng cường kèm nhãn, nhìn bằng mắt trước khi huấn luyện.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ hai là tăng cường làm đổi nhãn, ví dụ xoay chữ số hay lật biển báo, lật ngang chữ 2 thành 5 và lật biển rẽ trái thành rẽ phải. Phép thử là in vài ảnh sau tăng cường kèm nhãn, rồi nhìn bằng mắt trước khi huấn luyện."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng mạng nông cho vật lớn <b class="red">(trường tiếp nhận 7 điểm ảnh, vật rộng 100)</b>
          <br><span class="note">Ba lớp 3 × 3 không bước nhảy chỉ nhìn 7 điểm ảnh: mỗi ô ra chỉ thấy một mảnh vân của vật rộng 100 điểm ảnh. Phép thử: tính $r$ của lớp cuối và so với cỡ vật trong ảnh.</span></div>
        focus: [1, 1]
        say: "Lỗi thứ ba là dùng mạng nông cho vật lớn, khi trường tiếp nhận chỉ 7 điểm ảnh mà vật rộng 100. Mỗi ô ra chỉ thấy một mảnh vân của vật, nên phép thử là tính trường tiếp nhận của lớp cuối và so với cỡ vật trong ảnh."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Chuẩn hoá đầu vào khác lúc mạng được học sẵn <b class="red">(điểm tối thành điểm sáng)</b></div>
          <table class="t"><tr><th>điểm ảnh</th><th>lúc học sẵn: $\frac{x - 120}{60}$</th><th>lúc dùng, quên trừ: $\frac{x}{255}$</th></tr>
          <tr><td>sáng, 180</td><td>1,0</td><td>0,706</td></tr>
          <tr><td>tối, 60</td><td>−1,0</td><td class="red">0,235 — đổi dấu</td></tr></table>
          <p class="note">Bài báo năm 2015 trừ trung bình từng điểm ảnh khi học. Mạng chạy vẫn ra kết quả, chỉ âm thầm kém đi. Lưu phép chuẩn hoá cùng trọng số, và thử một ảnh mẫu: đặc trưng phải khớp với lúc học.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, chuẩn hoá đầu vào khác lúc mạng được học sẵn, làm điểm tối thành điểm sáng. Giả sử lúc học sẵn, điểm ảnh được trừ 120 rồi chia 60, nên điểm sáng 180 thành 1. Lúc dùng lại quên trừ, chỉ chia 255, nên điểm tối 60 thành 0 phẩy 235 thay vì âm 1, đổi cả dấu. Mạng vẫn chạy và vẫn ra kết quả, chỉ âm thầm kém đi, nên hãy lưu phép chuẩn hoá cùng trọng số và thử một ảnh mẫu xem đặc trưng có khớp lúc học không."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: trường tiếp nhận, số tham số, và chọn cách học"
    checks:
      - "alg.cvi_receptive_field([(3, 1)] * 5) == 11"
      - "512 * 3 + 3 == 1539"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Năm lớp 3 × 3, bước 1. Trường tiếp nhận của lớp cuối?</td></tr>
          <tr><td>2</td><td>Đặc trưng 512 số, phân loại 3 loại quả. Đầu phân loại có bao nhiêu tham số?</td></tr>
          <tr><td>3</td><td>Bạn có 2000 ảnh của 3 loại quả. Đóng băng phần thân, tinh chỉnh khối cuối, hay học lại cả mạng?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn. Câu một, năm lớp 3 nhân 3 bước 1, trường tiếp nhận của lớp cuối là bao nhiêu? Câu hai, đặc trưng 512 số, phân loại 3 loại quả, đầu phân loại có bao nhiêu tham số? Câu ba, bạn có 2000 ảnh của 3 loại quả, nên đóng băng phần thân, tinh chỉnh khối cuối, hay học lại cả mạng? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Câu 1.</b> Mỗi lớp thêm $(3 - 1) \cdot 1 = 2$: $r = 1 + 5 \cdot 2 = \hlg{11}$.</p>
          <p><b>Câu 2.</b> $512 \cdot 3 + 3 = \hlg{1539}$ tham số.</p>
        focus: [1, 2]
        say: "Câu một, mỗi lớp thêm 3 trừ 1 nhân 1, bằng 2, nên r bằng 1 cộng 5 nhân 2, bằng 11. Câu hai, theo công thức lớp đầy đủ, 512 nhân 3 cộng 3, bằng 1539 tham số."
      - show: |
          <table class="t"><tr><th>câu 3</th><th>được</th><th>mất</th></tr>
          <tr><td>đóng băng, chỉ học lớp cuối</td><td>nhanh, khó quá khớp</td><td>đặc trưng có thể chưa hợp quả của bạn</td></tr>
          <tr><td>tinh chỉnh khối cuối, tốc độ học nhỏ</td><td>đặc trưng riêng hơn, thường chính xác hơn</td><td>cần tập kiểm định để dừng đúng lúc</td></tr>
          <tr><td>học lại cả mạng</td><td>tự do nhất</td><td class="red">hàng triệu tham số với 2000 ảnh: dễ học thuộc</td></tr></table>
          <p class="note">Làm theo thứ tự: đóng băng trước làm mốc, rồi mới thử tinh chỉnh; chỉ giữ cách mới nếu nó hơn trên tập kiểm định.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Câu ba là một đánh đổi. Đóng băng và chỉ học lớp cuối thì nhanh và khó quá khớp, nhưng đặc trưng có thể chưa hợp với quả của bạn. Tinh chỉnh khối cuối với tốc độ học nhỏ cho đặc trưng riêng hơn, thường chính xác hơn, nhưng cần tập kiểm định để dừng đúng lúc. Học lại cả mạng thì tự do nhất, nhưng hàng triệu tham số với 2000 ảnh rất dễ học thuộc. Hãy đóng băng trước để làm mốc, rồi mới thử tinh chỉnh, và chỉ giữ cách mới nếu nó hơn trên tập kiểm định."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
