source: "curriculum/cvi.yaml L07; audit/cvi/verify_cvi.py L07; audit/cvi/sources_L07.md; [H15] K. He, X. Zhang, S. Ren, J. Sun, Deep Residual Learning for Image Recognition, arXiv:1512.03385 (2015) — bảng 1 (mạng 18 lớp: tầng đầu 7 × 7 bước 2, gộp 3 × 3 bước 2, khối cuối 3 × 3 với 512 kênh trên lưới 7 × 7, lấy trung bình rồi lớp đầy đủ), mục 3.4 (cắt 224 × 224, lật ngang, trừ trung bình từng điểm ảnh); [Y14] J. Yosinski, J. Clune, Y. Bengio, H. Lipson, How transferable are features in deep neural networks?, arXiv:1411.1792 (2014) — mục 1 (đặc trưng lớp đầu chung, lớp cuối riêng; đóng băng khi dữ liệu đích nhỏ); CS115 bài 34 (trượt bộ lọc, kích thước đầu ra, đếm tham số), bài 19 (quá khớp) — đã học"
assumes: [arith, cdot, frac, approx, power, sub, geq, ltgt, implies]
# Quy ước: trường tiếp nhận r = số điểm ảnh (theo một chiều) mà một ô ở lớp sâu “nhìn thấy”; lớp (k, s) = bộ lọc cạnh k, bước nhảy s;
#   r ← r + (k − 1)·j, j = tích các bước nhảy của các lớp trước (alg.cvi_receptive_field). Đặc trưng = vector 512 số ở cuối phần thân
#   của mạng 18 lớp trong [H15]; lớp cuối (đầu phân loại) có 512·C + C tham số với C lớp. Chữ số bảy đoạn: alg.cvi_seg7_transform.
#   Xưởng 300 ảnh, 500 ảnh, tỉ lệ 100% / 60%, chuẩn hoá (x − 120)/60 là SỐ MINH HOẠ. Tên ResNet chỉ trên màn hình (probe ≤ 4/8);
#   lời đọc nói “mạng có lối tắt”. ImageNet đọc theo luật “I-mịt-nét” (lexicon_vi.CVI.yaml), chỉ một hai câu.
objectives:
  - "Tính trường tiếp nhận của một chồng lớp tích chập, có và không có bước nhảy"
  - "Đếm tham số khi chỉ huấn luyện lại lớp cuối, so với một lớp tích chập của phần thân"
  - "Chọn phép tăng cường dữ liệu không phá nhãn"
  - "Nhận ra lỗi chuẩn hoá đầu vào khác lúc mạng được học sẵn"
