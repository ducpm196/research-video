  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính chi phí từng chênh lệch, chọn chỗ thấp nhất, rồi ra độ sâu"
    checks:
      - "alg.cvi_sad_costs([10, 10, 10, 10, 20, 90, 40, 10, 10, 10, 10, 10], [10, 20, 90, 40, 10, 10, 10, 10, 10, 10, 10, 10], 5, 1, 4)[:2] == [120, 130] and sum(abs(a - 10) for a in [20, 90, 40]) == 120"
      - "alg.cvi_sad_costs([10, 10, 10, 10, 20, 90, 40, 10, 10, 10, 10, 10], [10, 20, 90, 40, 10, 10, 10, 10, 10, 10, 10, 10], 5, 1, 4) == [120, 130, 150, 0, 130]"
      - "min(range(5), key=lambda d: alg.cvi_sad_costs([10, 10, 10, 10, 20, 90, 40, 10, 10, 10, 10, 10], [10, 20, 90, 40, 10, 10, 10, 10, 10, 10, 10, 10], 5, 1, 4)[d]) == 3"
      - "700 * 0.12 / 42 == 2.0 and round(84 / 3, 6) == 28"
    steps:
      - show: |
          <p>Cửa sổ ảnh trái quanh cột 5: 20, 90, 40. Hàng ảnh phải: 10, 20, 90, 40, 10, 10, …</p>
          <p><b>Bước 1.</b> $d = 0$: so với cột 4–6 của ảnh phải (10, 10, 10): $\lvert 20 - 10 \rvert + \lvert 90 - 10 \rvert + \lvert 40 - 10 \rvert = 10 + 80 + 30 = 120$.</p>
        introduces: [dots]
        focus: [1, 2]
        say: "Cửa sổ ảnh trái quanh cột 5 gồm 20, 90, 40, còn hàng ảnh phải bắt đầu bằng 10, 20, 90, 40, rồi toàn 10, dấu ba chấm nghĩa là cứ thế tiếp tục. Bước một, với d bằng 0, so với cột 4 tới 6 của ảnh phải là ba số 10, chi phí bằng 10 cộng 80 cộng 30, bằng 120."
      - show: |
          <table class="t"><tr><th>Bước 2 — mọi $d$</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>cửa sổ ảnh phải</td><td>10, 10, 10</td><td>40, 10, 10</td><td>90, 40, 10</td><td>20, 90, 40</td><td>10, 20, 90</td></tr>
          <tr><td>chi phí</td><td>120</td><td>130</td><td>150</td><td>$\hlg{0}$</td><td>130</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bước hai, làm như vậy cho mọi chênh lệch từ 0 tới 4. Hàng giữa là cửa sổ ảnh phải ứng với từng d, dời dần sang trái. Chi phí lần lượt là 120, 130, 150, 0 và 130."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Chọn $d$ có chi phí thấp nhất: $d = \hlg{3}$ (chi phí 0). Thấp nhất rõ rệt — mọi $d$ khác đều từ 120 trở lên.</p>
          <p><b>Bước 4.</b> Ra độ sâu bằng công thức đã ôn, $f \cdot B = 84$. Với $d = 3$: $Z = \frac{84}{3} = 28$ m — một vật rất xa; với $d = 42$ như ví dụ ôn nền: $Z = \hlo{2}$ m.</p>
        focus: [1, 1, 2, 2]
        say: "Bước ba, ta chọn d có chi phí thấp nhất, ở đây d bằng 3 với chi phí 0. Đó là một cực tiểu rõ rệt, vì mọi d khác đều có chi phí từ 120 trở lên. Bước bốn, ra độ sâu bằng công thức đã ôn, với f nhân B bằng 84, d bằng 3 cho Z bằng 28 mét, một vật rất xa. Còn d bằng 42 như ví dụ ôn nền cho Z bằng 2 mét."

  # ───────────────────────── 7. SUY RA SAI SỐ ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra sai số độ sâu: tỉ lệ với Z bình phương"
    checks:
      - "round(84 / 41 - 84 / 42, 4) == round(84 * 1 / (41 * 42), 4) == 0.0488"
      - "round(2 ** 2 * 1 / 84, 4) == 0.0476"
      - "round(84 / 8, 1) == 10.5 and round(8 ** 2 / 84, 3) == 0.762 and round(84 / 9.5 - 8, 2) == 0.84 and round(8 - 84 / 11.5, 2) == 0.7"
    steps:
      - show: |
          <p><b>Bước 1 — đo sai $d$ đi $\delta d$.</b> Độ sâu mới trừ độ sâu cũ, quy đồng như phần ôn nền:</p>
          $$\frac{fB}{d - \delta d} - \frac{fB}{d} = \frac{fB \cdot \delta d}{d \cdot (d - \delta d)} \approx \frac{fB \cdot \delta d}{d^2}$$
          <p class="note">Làm thử $d = 42$, $\delta d = 1$: $\frac{84}{41 \cdot 42} \approx 0{,}0488$ m. Khi $\delta d$ nhỏ hơn $d$ nhiều, $d - \delta d \approx d$.</p>
        focus: [1, 2, 2, 3]
        say: "Bước một, giả sử đo sai d đi một lượng nhỏ. Lấy độ sâu mới trừ độ sâu cũ và quy đồng mẫu số như phần ôn nền, ta được f B nhân sai lệch của d, chia cho d nhân d trừ sai lệch. Vì sai lệch nhỏ hơn d nhiều, kết quả xấp xỉ chia cho d bình phương. Làm thử với d bằng 42 và sai 1 điểm ảnh, ra 84 chia 41 nhân 42, xấp xỉ 0 phẩy 0488 mét."
      - show: |
          <p><b>Bước 2 — thay $d = \frac{fB}{Z}$.</b> Vì $d^2 = \frac{(fB)^2}{Z^2}$, nên</p>
          $$\delta Z \approx \frac{fB \cdot \delta d}{d^2} = \frac{Z^2 \cdot \delta d}{f B}$$
          <p class="note">Làm thử $Z = 2$: $\frac{4 \cdot 1}{84} \approx 0{,}0476$ m, gần 0,0488 ở bước 1 ✓.</p>
        focus: [1, 2, 3]
        say: "Bước hai, thay d bằng f B chia Z, nên d bình phương bằng f B bình phương chia Z bình phương. Rút gọn, sai lệch độ sâu xấp xỉ Z bình phương nhân sai lệch của d, chia cho f nhân B. Làm thử với Z bằng 2 mét, 4 chia 84 xấp xỉ 0 phẩy 0476, gần với 0 phẩy 0488 ở bước một."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 3 — cùng sai 1 điểm ảnh</th><th>$Z = 2$ m</th><th>$Z = 8$ m</th></tr>
          <tr><td>chênh lệch $d = \frac{84}{Z}$</td><td>42</td><td>10,5</td></tr>
          <tr><td>công thức gần đúng $\frac{Z^2}{84}$</td><td>0,048 m</td><td>$\hlo{0{,}762}$ m</td></tr>
          <tr><td>tính đúng $\frac{84}{d \pm 1}$</td><td>1,953 … 2,049 m</td><td>7,30 … 8,84 m</td></tr></table>
          <p class="note">Xa gấp 4 lần, sai số gấp 16 lần: đó là ý nghĩa của “tỉ lệ với $Z^2$”.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước ba, thay số để so hai khoảng cách với cùng sai 1 điểm ảnh. Ở 2 mét chênh lệch là 42, còn ở 8 mét chỉ còn 10 phẩy 5. Công thức gần đúng cho 0 phẩy 048 mét ở 2 mét, nhưng tới 0 phẩy 762 mét ở 8 mét. Tính đúng thì ở 8 mét độ sâu nằm trong khoảng 7 phẩy 30 tới 8 phẩy 84 mét. Xa gấp 4 lần thì sai số gấp 16 lần, đó là ý nghĩa của tỉ lệ với Z bình phương."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: chiếu thẳng vào hai camera, và so gần đúng với tính đúng"
    checks:
      - "round(alg.pinhole(1.0, 0, 8, 700, 320, 240)[0] - alg.pinhole(1.0 - 0.12, 0, 8, 700, 320, 240)[0], 6) == 10.5 and round(84 / 10.5, 6) == 8"
      - "round(84 / 9.5 - 84 / 11.5, 2) == 1.54 and round(2 * 8 ** 2 / 84, 2) == 1.52"
    steps:
      - show: |
          <p><b>Đường khác 1 — chiếu thẳng</b> điểm (1; 0; 8) m vào từng camera, $f = 700$, tâm cột 320; camera phải dời 0,12 m nên thấy $X = 0{,}88$:</p>
          $$700 \cdot \frac{1}{8} + 320 = 407{,}5, \qquad 700 \cdot \frac{0{,}88}{8} + 320 = 397, \qquad 407{,}5 - 397 = 10{,}5 = \frac{84}{8} \checkmark$$
        focus: [1, 2, 2]
        say: "Kiểm tra thứ nhất là chiếu thẳng một điểm ở 8 mét vào hai camera, theo công thức lỗ kim. Camera trái cho cột 700 nhân 1 chia 8 cộng 320, bằng 407 phẩy 5, còn camera phải dời 0 phẩy 12 mét cho cột 397. Chênh lệch bằng 10 phẩy 5, đúng bằng 84 chia 8, khớp với bảng."
      - show: |
          <p><b>Đường khác 2 — bề rộng khoảng sai</b> ở 8 m, tính đúng so với gần đúng:</p>
          $$\frac{84}{9{,}5} - \frac{84}{11{,}5} \approx 8{,}84 - 7{,}30 = 1{,}54 \quad \text{so với} \quad 2 \cdot \frac{64}{84} \approx 1{,}52 \checkmark$$
        focus: [1, 2, 2]
        say: "Kiểm tra thứ hai so bề rộng của khoảng sai. Tính đúng, 8 phẩy 84 trừ 7 phẩy 30 xấp xỉ 1 phẩy 54 mét. Công thức gần đúng hai phía cho khoảng 1 phẩy 52 mét, nên nó dùng được để ước lượng nhanh."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "alg.cvi_sad_costs([50] * 12, [50] * 12, 5, 1, 4) == [0, 0, 0, 0, 0]"
      - "alg.cvi_sad_costs([10, 10, 10, 10, 20, 90, 40, 10, 10, 10, 10, 10], [10] * 12, 5, 1, 4) == [120] * 5"
      - "round(84 / 0.5) == 168 and round(84 / 0.4) == 210 and 210 > 168"
      - "640 * 480 * 169 == 51_916_800"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin độ sâu ở vùng không có vân <b class="red">(tường trắng: mọi chênh lệch đều “khớp”)</b>
          <br><span class="note">Hàng đều 50: chi phí với mọi $d$ là 0, 0, 0, 0, 0 — không có cực tiểu riêng. Phép thử: cực tiểu phải thấp hơn hẳn chi phí thấp nhì; không thì đánh dấu “không biết”. Camera có máy chiếu chấm sáng lên tường để tạo vân.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ nhất là tin độ sâu ở vùng không có vân, như tường trắng, nơi mọi chênh lệch đều khớp. Với một hàng đều 50, chi phí ở mọi d đều bằng 0, không có cực tiểu riêng. Phép thử là cực tiểu phải thấp hơn hẳn chi phí thấp nhì, giống phép thử tỉ số ở bài 4, không thì đánh dấu là không biết."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Bỏ qua chỗ bị che <b class="red">(điểm chỉ một camera thấy)</b>
          <br><span class="note">Nếu vật 20, 90, 40 bị che khuất trong ảnh phải, mọi chi phí đều 120 — cực tiểu vẫn được “chọn” nhưng vô nghĩa. Phép thử: khớp từ trái sang phải rồi từ phải sang trái, hai lần phải ra cùng $d$.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ hai là bỏ qua chỗ bị che, tức điểm chỉ một camera thấy được. Nếu vật 20, 90, 40 bị che khuất trong ảnh phải thì mọi chi phí đều bằng 120, máy vẫn chọn một cực tiểu nhưng nó vô nghĩa. Phép thử là khớp từ trái sang phải rồi từ phải sang trái, hai lần phải ra cùng một chênh lệch."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Khớp khi hai ảnh chưa nắn cùng hàng <b class="red">(điểm khớp nằm ở hàng khác)</b>
          <br><span class="note">Camera xoay nhẹ hay lệch độ cao làm điểm ảnh phải lệch vài hàng; tìm trên đúng hàng thì không bao giờ gặp. Hiệu chuẩn hai camera và nắn ảnh trước, kiểm lại sau mỗi lần va chạm.</span></div>
        focus: [1, 1, 1]
        say: "Lỗi thứ ba là khớp khi hai ảnh chưa nắn cùng hàng, nên điểm khớp nằm ở hàng khác. Camera xoay nhẹ hay lệch độ cao làm điểm ở ảnh phải lệch vài hàng, và tìm trên đúng hàng thì không bao giờ gặp. Vì vậy phải hiệu chuẩn hai camera, nắn ảnh trước, và kiểm lại sau mỗi lần va chạm."
      - show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đặt dải tìm chênh lệch quá hẹp <b class="red">(vật sát camera bị đo thành xa)</b></div>
          <table class="t"><tr><th>$fB = 84$</th><th>độ sâu</th><th>chênh lệch thật</th><th>dải tìm 0 … 168</th></tr>
          <tr><td>gần nhất dự kiến</td><td>0,5 m</td><td>168</td><td>vừa đủ</td></tr>
          <tr><td>vật đưa sát hơn</td><td>0,4 m</td><td>210</td><td class="red">ngoài dải: máy chọn một $d$ sai, thường cho độ sâu lớn hơn</td></tr></table>
          <p class="note">Dải rộng thì tốn: ảnh 640 × 480 với 169 giá trị $d$ là $640 \cdot 480 \cdot 169 = 51\,916\,800$ lần tính chi phí mỗi khung. Chọn dải theo khoảng cách gần nhất <b>thật sự</b> gặp, và báo “quá gần” thay vì đoán.</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đặt dải tìm chênh lệch quá hẹp, nên vật sát camera bị đo thành xa. Với f B bằng 84, vật gần nhất dự kiến ở 0 phẩy 5 mét có chênh lệch 168, vừa đủ với dải 0 tới 168. Nhưng vật đưa sát tới 0 phẩy 4 mét có chênh lệch 210, nằm ngoài dải, nên máy chọn một d sai, thường cho độ sâu lớn hơn thật, rất nguy hiểm cho robot. Dải rộng thì tốn, ảnh 640 nhân 480 với 169 giá trị d là gần 52 triệu lần tính chi phí mỗi khung. Hãy chọn dải theo khoảng cách gần nhất thật sự gặp, và báo quá gần thay vì đoán."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: một lần khớp, một sai số, và chọn khoảng cách hai camera"
    checks:
      - "alg.cvi_sad_costs([0, 0, 30, 60, 30, 0, 0, 0], [30, 60, 30, 0, 0, 0, 0, 0], 3, 1, 2) == [90, 90, 0] and 0 + 60 + 30 == 30 + 30 + 30 == 90"
      - "round(4 ** 2 / 84, 3) == 0.19 and 84 / 4 == 21 and 84 / 20 == 4.2 and round(84 / 22, 2) == 3.82"
      - "round(8 ** 2 * 1 / (700 * 0.2), 3) == 0.457 and round(8 ** 2 / (700 * 0.46), 3) == 0.199 and round(700 * 0.46 / 0.5) == 644 > 640 and round(8 ** 2 / 84, 2) == 0.76"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề ($f = 700$)</th></tr>
          <tr><td>1</td><td>Ảnh trái: 0, 0, 30, 60, 30, 0, 0, 0; ảnh phải: 30, 60, 30, 0, 0, 0, 0, 0. Cửa sổ 3 ô quanh cột 3 ảnh trái. Chi phí với $d = 0, 1, 2$? Chọn $d$ nào?</td></tr>
          <tr><td>2</td><td>$B = 0{,}12$ m, vật ở 4 m. Sai 1 điểm ảnh thì độ sâu lệch khoảng bao nhiêu?</td></tr>
          <tr><td>3</td><td>Cần đo vật ở 8 m với sai số không quá 0,2 m khi sai 1 điểm ảnh. Đặt hai camera cách nhau ít nhất bao nhiêu? Mất gì?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với tiêu cự 700. Câu một, cho hai hàng ảnh trên bảng và cửa sổ 3 ô quanh cột 3 của ảnh trái, hãy tính chi phí với d bằng 0, 1, 2 và chọn d. Câu hai, với B bằng 0 phẩy 12 mét và vật ở 4 mét, sai 1 điểm ảnh thì độ sâu lệch khoảng bao nhiêu? Câu ba, cần đo vật ở 8 mét với sai số không quá 0 phẩy 2 mét khi sai 1 điểm ảnh, đặt hai camera cách nhau ít nhất bao nhiêu, và mất gì? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p><b>Câu 1.</b> Cửa sổ trái quanh cột 3: 30, 60, 30.</p>
          <table class="t"><tr><th>$d$</th><th>0</th><th>1</th><th>2</th></tr>
          <tr><td>cửa sổ ảnh phải</td><td>30, 0, 0</td><td>60, 30, 0</td><td>30, 60, 30</td></tr>
          <tr><td>chi phí</td><td>$0 + 60 + 30 = 90$</td><td>$30 + 30 + 30 = 90$</td><td>$\hlg{0}$</td></tr></table>
          <p>Chọn $d = 2$. <b>Câu 2.</b> $Z = 4$: $d = \frac{84}{4} = 21$; $\delta Z \approx \frac{4^2}{84} \approx \hlg{0{,}19}$ m (tính đúng: $\frac{84}{20} = 4{,}2$, $\frac{84}{22} \approx 3{,}82$).</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Câu một, cửa sổ trái quanh cột 3 gồm 30, 60, 30. Với d bằng 0, so với 30, 0, 0, chi phí bằng 90. Với d bằng 1 cũng được 90, còn d bằng 2 gặp đúng 30, 60, 30, chi phí bằng 0, nên ta chọn d bằng 2. Câu hai, vật ở 4 mét có chênh lệch 84 chia 4, bằng 21. Sai 1 điểm ảnh thì độ sâu lệch khoảng 16 chia 84, xấp xỉ 0 phẩy 19 mét."
      - clear: true
        show: |
          <p><b>Câu 3.</b> Từ $\delta Z \approx \frac{Z^2 \cdot \delta d}{f B} \le 0{,}2$, chuyển vế: $B \ge \frac{8^2 \cdot 1}{700 \cdot 0{,}2} \approx 0{,}457$ m — chọn 0,46 m, sai số $\frac{64}{700 \cdot 0{,}46} \approx 0{,}199$ m.</p>
          <table class="t"><tr><th>khoảng cách hai camera</th><th>được</th><th>mất</th></tr>
          <tr><td>0,12 m</td><td>gọn, vật gần vẫn thấy ở cả hai ảnh</td><td class="red">ở 8 m sai khoảng 0,76 m</td></tr>
          <tr><td>0,46 m</td><td>ở 8 m sai khoảng 0,2 m</td><td>vật ở 0,5 m có $d = \frac{700 \cdot 0{,}46}{0{,}5} = 644$ điểm ảnh — rộng hơn cả ảnh 640</td></tr></table>
        focus: [1, 1, 0, "2.2", "2.3"]
        say: "Câu ba, ta đặt công thức sai số nhỏ hơn hoặc bằng 0 phẩy 2 rồi chuyển vế, được B lớn hơn hoặc bằng 64 chia 140, xấp xỉ 0 phẩy 457 mét. Vì vậy chọn 0 phẩy 46 mét, sai số còn khoảng 0 phẩy 199. Đây là một đánh đổi. Khoảng cách 0 phẩy 12 mét gọn và vật gần vẫn thấy ở cả hai ảnh, nhưng ở 8 mét sai khoảng 0 phẩy 76 mét. Khoảng cách 0 phẩy 46 mét đo xa tốt, nhưng vật ở 0 phẩy 5 mét có chênh lệch 644 điểm ảnh, rộng hơn cả ảnh, nên vùng gần không đo được."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hai camera song song, đã nắn: cùng hàng</span><span class="a">→</span>
          <span class="n">trượt cửa sổ trên một hàng, chi phí thấp nhất cho d</span><span class="a">→</span>
          <span class="n">$Z = \frac{f \cdot B}{d}$</span><span class="a">→</span>
          <span class="n">$\delta Z \approx \frac{Z^2 \cdot \delta d}{f \cdot B}$</span><span class="a">→</span>
          <span class="n">chọn B và dải tìm theo xa nhất, gần nhất cần đo</span></div>
        say: "Tổng kết lại, hai camera song song đã nắn thì điểm khớp nằm trên cùng một hàng, nên ta trượt cửa sổ trên một hàng và chọn chênh lệch có chi phí thấp nhất. Độ sâu bằng f nhân B chia d, và sai số xấp xỉ Z bình phương nhân sai lệch của d chia f nhân B. Vì vậy chọn khoảng cách hai camera và dải tìm theo chỗ xa nhất và gần nhất cần đo."
      - show: |
          <div class="box key"><b>Tư duy:</b> độ sâu từ hai camera không có một “độ chính xác” duy nhất — nó tốt ở gần, tệ dần theo bình phương khoảng cách, và bằng không ở chỗ không có vân. Luôn hỏi: đo ở bao xa, trên bề mặt nào?</div>
        say: "Điều cần mang theo, độ sâu từ hai camera không có một độ chính xác duy nhất. Nó tốt ở gần, tệ dần theo bình phương khoảng cách, và mất hẳn ở chỗ không có vân, nên hãy luôn hỏi đo ở bao xa, trên bề mặt nào."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>phân loại ảnh bằng mạng tích chập học sẵn</b> — mượn một mạng đã học trên hàng triệu ảnh, chỉ dạy lại lớp cuối cho bài toán của mình bằng vài trăm ảnh.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học phân loại ảnh bằng mạng tích chập học sẵn. Ta mượn một mạng đã học trên hàng triệu ảnh, rồi chỉ dạy lại lớp cuối cho bài toán của mình bằng vài trăm ảnh. Hẹn gặp bạn ở bài tiếp theo."
