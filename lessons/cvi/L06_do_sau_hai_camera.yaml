id: L06
course: CVI
series: "CVI · Thị giác máy tính"
title: "Bài 6 — Hình học hai góc nhìn: độ sâu từ chênh lệch ảnh"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cvi.yaml L06; audit/cvi/verify_cvi.py L06; audit/cvi/sources_L06.md (không có sự kiện ngoài: mọi số tự tính); ROB bài 11 (camera lỗ kim, Z = f·B/d, sai số tăng theo bình phương — đã học); CVI bài 3 (hiệu chuẩn, ma trận nội), bài 4 (so cửa sổ), bài 5 (điểm sai lớn)"
assumes: [arith, cdot, frac, approx, power, sub, geq, ltgt, implies]
# Quy ước: hai camera giống nhau, đặt song song, cùng độ cao, cách nhau B mét theo chiều ngang (đã hiệu chuẩn và nắn cho cùng hàng);
#   f = tiêu cự (điểm ảnh); chênh lệch d = cột ở ảnh trái trừ cột ở ảnh phải (điểm ảnh); Z = f·B / d (ROB bài 11).
#   Số chính: f = 700, B = 0,12 m, f·B = 84 (giáo án CVI L06). Chi phí khớp SAD = tổng trị tuyệt đối chênh lệch của cửa sổ 1 × 3
#   (alg.cvi_sad_costs). Sai lệch nhỏ của d viết δd, của Z viết δZ (đọc “sai lệch nhỏ của …”); δZ ≈ Z²·δd / (f·B).
#   Hàng điểm ảnh, robot, tường trắng là SỐ MINH HOẠ.
objectives:
  - "Giải thích vì sao với hai camera song song đã nắn hàng, điểm khớp nằm trên cùng một hàng"
  - "Tìm chênh lệch bằng chi phí tổng trị tuyệt đối trên một hàng và tính độ sâu Z = fB/d"
  - "Suy ra sai số độ sâu δZ ≈ Z²·δd/(fB) và tính nó ở 2 m, 8 m"
  - "Chọn khoảng cách hai camera và dải tìm chênh lệch cho một yêu cầu đo"
asr_reviewed:
  - {sentence: "Chi phí của d là tổng trị tuyệt đối chênh lệch giữa cửa sổ ở ảnh trái và cửa sổ dời d cột ở ảnh phải, bằng 0 khi khớp hoàn hảo.", reason: "ASR chép “Chi phí của dê là tổng trị tuyệt đối trên lệch giữa cửa sổ, ảnh trái và cửa sổ dời dây cột ở ảnh phải bằng không khi khấp hoàn hảo.” (0.889): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: chênh/trên, ở/∅, khớp/khấp — NOT_VERIFIED bằng tai người"}
  - {sentence: "Rút gọn, sai lệch độ sâu xấp xỉ Z bình phương nhân sai lệch của d, chia cho f nhân B.", reason: "ASR chép “Rút gọn, sai lệch độ sâu sấp xỉ giác bình phương nhân sai lệch của V, chia cho F nhân B.” (0.952): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đó là một cực tiểu rõ rệt, vì mọi d khác đều có chi phí từ 120 trở lên.", reason: "ASR chép “Đó là một cực tiểu rõ rệt vì mọi giây khác đều có chi phí từ 120 trở lên.” (0.955): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ở 2 m sai 5 cm, ở 8 m sai gần 80 cm — và tường trắng thì chịu"
    checks:
      - "round(84 / 41 - 2, 3) == 0.049 and round(2 - 84 / 43, 3) == 0.047"
      - "round(84 / 9.5 - 8, 2) == 0.84 and round(8 - 84 / 11.5, 2) == 0.7"
    steps:
      - show: |
          <p>Một robot dùng hai camera đặt cách nhau 12 cm để đo khoảng cách. Vật ở <b>2 m</b>: đo sai một điểm ảnh thì lệch khoảng <b>5 cm</b>. Vật ở <b>8 m</b>: cùng sai một điểm ảnh, lệch <b>0,70 tới 0,84 m</b>.</p>
          <p>Gặp một bức tường trắng trơn, máy không đo được gì cả.</p>
          <div class="box key">Hôm nay: máy tìm điểm khớp giữa hai ảnh thế nào, và vì sao chỉ cần tìm trên một hàng? Sai số độ sâu từ đâu ra? Đặt hai camera cách nhau bao nhiêu thì đủ?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, một robot dùng hai camera đặt cách nhau 12 xen-ti-mét để đo khoảng cách. Vật ở 2 mét, đo sai một điểm ảnh thì lệch khoảng 5 xen-ti-mét, nhưng vật ở 8 mét, cùng sai một điểm ảnh lại lệch từ 0 phẩy 70 tới 0 phẩy 84 mét. Gặp một bức tường trắng trơn, máy không đo được gì cả. Hôm nay ta hỏi, máy tìm điểm khớp giữa hai ảnh thế nào, sai số độ sâu từ đâu ra, và đặt hai camera cách nhau bao nhiêu thì đủ?"

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "700 * 0.12 / 42 == 2.0 and round(700 * 0.12, 6) == 84"
      - "sum(abs(a - b) for a, b in zip([20, 90, 40], [20, 90, 40])) == 0 and sum(abs(a - b) for a, b in zip([20, 90, 40], [90, 40, 10])) == 150 and abs(-70) == 70"
      - "round(1 / 41 - 1 / 42, 6) == round(1 / (41 * 42), 6)"
    steps:
      - show: |
          <p><b>① Độ sâu từ hai camera</b> (khoá Robot tự hành): hai camera song song cách nhau $B$, một điểm lệch $d$ điểm ảnh giữa hai ảnh thì</p>
          $$Z = \frac{f \cdot B}{d} = \frac{700 \cdot 0{,}12}{42} = \frac{84}{42} = 2 \text{ m}$$
        focus: [1, 2]
        say: "Điều thứ nhất, ở khoá Robot tự hành ta đã học độ sâu từ hai camera song song cách nhau B. Một điểm lệch d điểm ảnh giữa hai ảnh thì có độ sâu Z bằng f nhân B chia d, ví dụ 700 nhân 0 phẩy 12 chia 42, bằng 84 chia 42, tức 2 mét."
      - show: |
          <p><b>② Trị tuyệt đối</b> $\lvert a \rvert$: bỏ dấu âm, $\lvert -70 \rvert = 70$. Tổng trị tuyệt đối chênh lệch của hai dãy 20, 90, 40 và 90, 40, 10: $70 + 50 + 30 = 150$; hai dãy giống hệt thì bằng 0.</p>
        introduces: [absval]
        focus: [1, 1, 1]
        say: "Điều thứ hai là trị tuyệt đối, viết giữa hai vạch đứng, nghĩa là bỏ dấu âm, trị tuyệt đối của âm 70 bằng 70. Tổng trị tuyệt đối chênh lệch của hai dãy 20, 90, 40 và 90, 40, 10 là 70 cộng 50 cộng 30, bằng 150. Hai dãy giống hệt nhau thì tổng bằng 0."
      - show: |
          <p><b>③ Hiệu hai phân số:</b> $\frac{1}{41} - \frac{1}{42} = \frac{42 - 41}{41 \cdot 42} = \frac{1}{1722}$ — quy đồng mẫu số rồi trừ tử số.</p>
        focus: [1, 1]
        say: "Điều thứ ba là hiệu hai phân số, ta quy đồng mẫu số rồi trừ hai tử số. Vì vậy một phần 41 trừ một phần 42 bằng 42 trừ 41, chia cho 41 nhân 42, tức một phần 1722."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: B, d, chi phí khớp và sai lệch nhỏ δ"
    checks:
      - "alg.cvi_sad_costs([10, 10, 10, 10, 20, 90, 40, 10, 10, 10, 10, 10], [10, 20, 90, 40, 10, 10, 10, 10, 10, 10, 10, 10], 5, 1, 4)[3] == 0"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td>$B$</td><td>khoảng cách giữa hai camera (mét)</td><td>0,12</td></tr>
          <tr><td>$d$</td><td>chênh lệch: cột ở ảnh trái trừ cột ở ảnh phải (điểm ảnh)</td><td>$5 - 2 = 3$</td></tr>
          <tr><td>chi phí$(d)$</td><td>tổng trị tuyệt đối chênh lệch giữa cửa sổ ở ảnh trái và cửa sổ dời $d$ cột ở ảnh phải</td><td>bằng 0 khi khớp hoàn hảo</td></tr>
          <tr><td>$\delta d,\ \delta Z$</td><td>chữ Hy Lạp đen-ta nhỏ: sai lệch nhỏ của $d$, và sai lệch độ sâu kéo theo</td><td>$\delta d = 1$ điểm ảnh</td></tr></table>
        introduces: [smalldelta]
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu bốn ký hiệu. B là khoảng cách giữa hai camera tính bằng mét, ví dụ 0 phẩy 12. d là chênh lệch, bằng cột ở ảnh trái trừ cột ở ảnh phải, ví dụ 5 trừ 2 bằng 3. Chi phí của d là tổng trị tuyệt đối chênh lệch giữa cửa sổ ở ảnh trái và cửa sổ dời d cột ở ảnh phải, bằng 0 khi khớp hoàn hảo. Chữ Hy Lạp đen-ta nhỏ đặt trước d hay Z là một sai lệch nhỏ, ví dụ sai lệch nhỏ của d bằng 1 điểm ảnh."

  # ───────────────────────── 4. VÌ SAO MỘT HÀNG ─────────────────────────
  - id: row
    kind: concept
    title: "Vì sao chỉ cần tìm trên một hàng"
    checks:
      - "alg.pinhole(0.5, 0.3, 2, 700, 320, 240)[1] == alg.pinhole(0.5 - 0.12, 0.3, 2, 700, 320, 240)[1] == 345.0"
      - "round(alg.pinhole(0.5, 0.3, 2, 700, 320, 240)[0] - alg.pinhole(0.5 - 0.12, 0.3, 2, 700, 320, 240)[0], 6) == 42"
    steps:
      - show: |
          <p><b>Bước 1.</b> Camera phải chỉ dời sang ngang $B$, nên với nó điểm $(X, Y, Z)$ thành $(X - B, Y, Z)$: <b>$Y$ và $Z$ không đổi</b>.</p>
          <p><b>Bước 2.</b> Hàng của điểm ảnh $v = f \cdot \frac{Y}{Z} + c_y$ chỉ phụ thuộc $Y$ và $Z$, nên <b>hai ảnh cho cùng một hàng</b>. Chỉ cột thay đổi: $u_{\text{trái}} - u_{\text{phải}} = f \cdot \frac{X}{Z} - f \cdot \frac{X - B}{Z} = \frac{f B}{Z} = d$.</p>
          <p class="note">Làm thử $f = 700$, tâm (320, 240), điểm (0,5; 0,3; 2): hai ảnh đều cho hàng $700 \cdot 0{,}15 + 240 = 345$; chênh cột $\frac{84}{2} = 42$.</p>
        focus: [1, 2, 2, 3]
        say: "Bước một, camera phải chỉ dời sang ngang một đoạn B, nên với nó điểm X, Y, Z thành X trừ B, Y, Z, nghĩa là Y và Z không đổi. Bước hai, hàng của điểm ảnh bằng f nhân Y chia Z cộng c y, chỉ phụ thuộc Y và Z, nên hai ảnh cho cùng một hàng. Chỉ có cột thay đổi, và hiệu hai cột rút gọn đúng bằng f nhân B chia Z, tức chênh lệch d. Làm thử, cả hai ảnh đều cho hàng 345, còn chênh cột bằng 84 chia 2, bằng 42."
      - show: |
          <p class="note">Vì vậy, sau khi hiệu chuẩn và <b>nắn hai ảnh cho cùng hàng</b>, tìm điểm khớp chỉ là tìm trên một hàng — một chiều thay vì cả ảnh. Camera lệch nhau một chút thì phải nắn trước, nếu không điểm khớp nằm ở hàng khác.</p>
        say: "Vì vậy, sau khi hiệu chuẩn và nắn hai ảnh cho cùng hàng, tìm điểm khớp chỉ là tìm trên một hàng, một chiều thay vì cả ảnh. Nếu hai camera lệch nhau một chút thì phải nắn trước, vì không nắn thì điểm khớp nằm ở hàng khác."

  # ───────────────────────── 5. HÌNH DUNG ─────────────────────────
