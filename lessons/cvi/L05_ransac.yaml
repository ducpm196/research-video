  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">điểm sai lớn kéo lệch bình phương tối thiểu</span><span class="a">→</span>
          <span class="n">bốc s điểm, dựng mô hình, đếm điểm đồng ý</span><span class="a">→</span>
          <span class="n">thành công một lần: w mũ s</span><span class="a">→</span>
          <span class="n">$N = \frac{\ln(1 - p)}{\ln(1 - w^s)}$, làm tròn lên</span><span class="a">→</span>
          <span class="n">lọc trước để nâng w rẻ hơn thử thêm</span></div>
        say: "Tổng kết lại, điểm sai lớn kéo lệch bình phương tối thiểu, nên ta bốc s điểm, dựng mô hình và đếm xem bao nhiêu điểm đồng ý. Một lần bốc thành công với xác suất w mũ s, từ đó N bằng lôgarit của 1 trừ p chia lôgarit của 1 trừ w mũ s, làm tròn lên. Vì w nằm ở số mũ, lọc trước để nâng w rẻ hơn thử thêm."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi dữ liệu có thể sai lớn, đừng hỏi “đường nào vừa với mọi điểm?”, hãy hỏi “đường nào được nhiều điểm đồng ý nhất?” — và tính trước phải hỏi bao nhiêu lần.</div>
        say: "Điều cần mang theo, khi dữ liệu có thể sai lớn, đừng hỏi đường nào vừa với mọi điểm. Hãy hỏi đường nào được nhiều điểm đồng ý nhất, và tính trước xem phải hỏi bao nhiêu lần."
