    - 2
    - 2
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>api_ui_ok=1 n_pii=2 cleaned=user [REDACTED] phone [REDACTED]</div></div>
    say: Kết quả chạy thật xác nhận hàm kiểm thử API và UI vượt qua và đếm đủ hai mục PII được ẩn danh sạch trong chuỗi. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Mẫu thay thế dữ liệu cá nhân bằng thẻ ẩn danh chuẩn giúp kỹ sư đọc hiểu bối cảnh lỗi nhật ký mà không lộ danh tính thật.
