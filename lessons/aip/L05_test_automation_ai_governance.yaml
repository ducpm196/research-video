    say: Hãy phòng tránh ba sai lầm thường gặp trong bài toán tự động hoá kiểm thử và quản trị an toàn AI. Thứ nhất là viết bộ định vị giao diện dựa theo cấu trúc lồng thẻ mỏng manh thay cho thẻ định danh kiểm thử bền vững. Thứ hai là để lọt dữ liệu cá nhân thô vào kho dữ liệu huấn luyện hoặc nhật ký sự cố. Thứ ba là quên đo chỉ số công bằng nhóm trước mỗi đợt phát hành mô hình mới. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định khi lưu lượng tăng cao. Cũng cần kiểm thử biểu thức chính quy ẩn danh với nhiều định dạng số điện thoại và thư điện tử thực tế tránh bỏ sót biến thể. Kết hợp rà soát định kỳ định nghĩa nhóm đối chứng để bảo đảm chỉ số công bằng luôn phản ánh đúng thực tế phục vụ.
