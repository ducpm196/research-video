- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - round(0.48 / 0.60, 2) == 0.8
  - 0.80 > 0.70
  steps:
  - clear: true
    show: <p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>import re</div><div>r = {'st':200,'ms':95,'b':{'ok':True,'s':0.85},</div><div>     'sel':'[data-testid="submit-btn"]',</div><div>     'note':'a@bank.vn 0912345678'}</div><div>assert r['st']==200 and r['ms']&lt;=150</div><div>assert 'data-testid' in r['sel']</div><div>pat = r'[\w.+-]+@[\w-]+\.[\w.-]+|\b0\d{9}\b'</div><div>n_pii = len(re.findall(pat, r['note']))</div><div>u = 'user a@bank.vn phone 0912345678'</div><div>s = re.sub(pat, '[REDACTED]', u)</div><div>print(f'api_ui_ok=1 n_pii={n_pii} cleaned={s}')</div></div>
    say: Đoạn mã cài hàm test kiểm hợp đồng API JSON và trình chọn giao diện UI theo mô hình Pytest kết hợp Playwright. Hàm assert kiểm tra mã phản hồi 200, trễ không quá 150 mi-li-giây và thẻ data-testid ổn định. Tiếp theo ta dùng len kết hợp re chấm findall để đếm chính xác số khớp thư điện tử và số điện thoại mười chữ số. Cuối cùng re chấm sub thay thế toàn bộ các đoạn khớp đó bằng thẻ ẩn danh chuẩn nhằm bảo vệ nhật ký. Dùng thẻ định danh kiểm thử chuyên dụng giữ kịch bản kiểm tra giao diện ổn định trước mọi chỉnh sửa màu sắc hay bố cục.
