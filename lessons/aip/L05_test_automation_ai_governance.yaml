    say: Bảng ký hiệu chốt lại ba tiêu chuẩn thực thi của bộ kiểm thử tự động và quản trị dữ liệu AI. Ở tầng kiểm thử giao diện theo kiểu Playwright hay kiểm API theo phong cách Postman, ta dùng thuộc tính định danh ổn định thay cấu trúc dễ gãy. Mẫu chính quy dùng gạch chéo w khớp chữ số, gạch chéo b khoá ranh giới từ và không d9 khớp số điện thoại mười chữ số. Hàm re chấm findall trả về danh sách mọi đoạn khớp để đếm bằng len trước khi re chấm sub che sạch thành thẻ ẩn danh. Và ngưỡng công bằng bốn phần năm chặn ngay mọi mô hình có dấu hiệu phân biệt đối xử. Những quy chuẩn trên sẽ xuyên suốt từ phần chạy thực nghiệm mẫu tới bài tập thực hành cuối bài. Bộ ba tiêu chuẩn gắn chặt chất lượng kỹ nghệ phần mềm với trách nhiệm quản trị AI trong thực tế vận hành. Quy tắc bốn phần năm mang lại ngưỡng kiểm định rõ ràng giúp phát hiện sớm sự thiên vị ẩn giấu.
