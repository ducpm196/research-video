  - show: <table class='t'><tr><th>Gợi ý triển khai AIP:L05</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (tách dòng log)</b></td><td>Cắt theo <code>'log_line='</code> trước để giữ nguyên vẹn toàn bộ chuỗi sau dấu bằng chứa khoảng trắng</td></tr><tr><td><b>Bước 2 (đếm &amp; che PII)</b></td><td>Dùng <code>len(re.findall(pat, log_line))</code> đếm đủ số khớp email và SĐT rồi gọi <code>re.sub</code> thay bằng <code>[REDACTED]</code></td></tr><tr><td><b>Bước 3 (QA + Governance)</b></td><td>Yêu cầu <code>data-testid</code> trong selector và tỉ số <code>rate_unpriv / rate_priv &gt;= 0.80</code> mới cho xuất bản</td></tr></table>
    say: Gợi ý triển khai nhắc bạn mẹo phân tích an toàn chuỗi đầu vào có chứa khoảng trắng tự do. Nếu tách toàn bộ dòng theo khoảng trắng ngay từ đầu, chuỗi nhật ký có nhiều từ sẽ bị gãy thành từng mảnh nhỏ. Do đó bạn luôn tách phần sau từ khoá log line trước rồi mới áp biểu thức chính quy đếm đủ số mẫu PII cần che. Kiểm kỹ trường hợp mẫu số tỉ lệ duyệt của nhóm chuẩn bằng không để xử lý biên an toàn không gây lỗi phép chia.
