  - show: <table class='t'><tr><th>Thực hành AIP:L05</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Kiểm thử API/UI, ẩn danh PII trước nhật ký và đánh giá công bằng AI Governance (DI &gt;= 0,80)</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>status=200 lat_ms=95 max_lat=150 selector=[data-testid="pay-btn"] log_line=req from a@bank.vn phone 0912345678; rate_priv=0.60 rate_unpriv=0.48</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh AIP L05 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Hãy hoàn thiện bài thực hành tổng kết gồm ba chốt kiểm tra tự động hoá API và UI. Bộ lọc dữ liệu cá nhân PII cùng chuẩn công bằng AI Governance từ luồng chuẩn qua sys chấm stdin chấm read chia hai dòng bằng splitlines. Lưu ý tách chính xác chuỗi nhật ký chứa khoảng trắng ở cuối dòng đầu để không cắt mất địa chỉ thư điện tử hay số điện thoại. Đọc kỹ quy chuẩn đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng để đáp ứng đủ cả ca ẩn. Chú ý kiểm thử đủ mọi tiêu chí từ thời gian phản hồi, trình chọn giao diện, che dữ liệu cá nhân tới ngưỡng công bằng. Chỉ cần một điều kiện đơn lẻ trượt chuẩn, cờ sẵn sàng phát hành tổng hợp cuối cùng phải hạ về không ngay lập tức.
    focus:
