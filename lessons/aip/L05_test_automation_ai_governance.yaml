    say: Đầu ra chuẩn xác nhận bài kiểm đạt một với hai mục PII được ẩn danh sạch sẽ, tỉ lệ tác động bằng không phẩy tám trăm và đủ chuẩn phát hành sản phẩm. Khi toàn bộ các dòng đầu ra đều khớp tuyệt đối với đáp án chuẩn và hai ca ẩn đều thông qua, bạn có thể an tâm lưu kết quả và chuyển tiếp. Làm tròn ba chữ số thập phân cho chỉ số tác động chênh lệch khớp hoàn toàn định dạng mong đợi trên các ca ẩn.
