    say: Bảng ký hiệu nêu rõ công thức chỉ số ổn định quần thể và thang đánh giá ba mức phổ biến trong vận hành mô hình tài
      chính. Thay vì nhìn bằng mắt từng biểu đồ cột, công thức tổng của hiệu nhân với lô-ga-rít tỉ số xác suất gộp thành một
