- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - round(0.40 + 0.30 + 0.20 + 0.10, 6) == 1.0
  - round(0.15 + 0.25 + 0.30 + 0.30, 6) == 1.0
  steps:
  - show: <div class='box key'><p><b>1. Chỉ số ổn định quần thể (PSI):</b> <code>PSI = sum_{i=1..K} (q_i - p_i) * ln(q_i /
      p_i)</code> với cắt biên <code>max(x, 1e-6)</code>.</p><p><b>2. Quy tắc phát hành lại:</b> <code>promote = (PSI &gt;=
      0,20) and (new_score &gt;= old_score + margin)</code>.</p></div>
    say: Hai biểu thức là xương sống của mọi hệ thống phát hiện trôi dữ liệu và tự động thích ứng ngoài sản xuất. Nhờ kẹp
      giá trị tối thiểu một phần triệu vào xác suất từng giỏ. Công thức PSI giữ an toàn tuyệt đối khi gặp một giỏ rỗng trên
      tập mới thay vì văng lỗi lô-ga-rít bằng không. Và quy tắc phát hành lại bảo đảm chỉ bản tái huấn luyện nào thật sự vượt
      mặt bản cũ mới được phép lên ngôi. Yêu cầu bản mới phải vượt bản cũ một biên độ an toàn nhỏ giúp tránh thay thế mô hình
      chỉ vì biến động ngẫu nhiên không đáng kể. Giá trị biên một phần trăm thường là điểm cân bằng hợp lý giữa tốc độ cập
      nhật mô hình và sự ổn định của hệ thống.
