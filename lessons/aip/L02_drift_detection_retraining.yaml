      dõi 200 đặc trưng</td><td>Báo động giả nếu feature không quan trọng</td><td>Ưu tiên kích hoạt retrain theo top 10 đặc
      trưng có trọng số cao</td></tr><tr><td>Tái huấn luyện hàng tuần</td><td>Chi phí GPU cao & có thể tụt điểm</td><td>Chỉ
      kích hoạt khi PSI >= 0,20 & ép qua bài test đối chứng</td></tr></table>
    say: Bảng tổng kết cách kích hoạt đường ống tự động tái huấn luyện có chốt kiểm vượt đường nền hiện hữu khi hệ thống giám
      sát hàng trăm cột đặc trưng. Thay vì tái huấn luyện vì một cột phụ trợ ít dùng, đội ngũ gán trọng số ưu tiên cho nhóm
      đặc trưng cốt lõi quyết định mô hình. Cùng với phép làm mượt phòng chia không, bộ giám sát vận hành ổn định quanh năm
      không gặp sự cố sập lô. Theo dõi đồng thời nhiều đặc trưng theo trọng số quan trọng giúp tập trung nguồn lực vào các
      biến thực sự tác động tới quyết định. Tự động lưu lại lịch sử chỉ số ổn định theo từng ngày giúp đội vận hành nhận ra
      xu hướng dịch chuyển dần theo từng quý.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: '<table class=''t''><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class=''box warn''><b>Lỗi 1 (không kẹp
      eps khi tính PSI):</b> Gặp một giỏ mới có xác suất 0 liền ném ngoại lệ <code>ValueError: math domain error</code>.<br><b>Lỗi
      2 (retrain mù đẩy thẳng):</b> Chạy lại mô hình tự động hàng ngày rồi ghi đè lên Production mà không so sánh thắng thua
      với bản cũ.<br><b>Lỗi 3 (dùng bin không cố định):</b> Chia lại biên giỏ theo phân vị của tập mới làm mất ý nghĩa đối
      chiếu với thước đo gốc.</div></td></tr></table>'
    say: Hãy phòng tránh ba sai lầm kỹ thuật phổ biến khi triển khai giám sát trôi dữ liệu. Thứ nhất là quên bảo vệ phép chia
      và lô-ga-rít khi xác suất một giỏ bất kỳ rơi về không. Thứ hai là cho phép quy trình tự động tái huấn luyện xuất bản
      thẳng mô hình mới khi chưa vượt chốt kiểm thử đường nền. Thứ ba là tính lại biên chia giỏ trên dữ liệu mới thay vì giữ
      nguyên tập biên giỏ lúc huấn luyện gốc. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định khi lưu
      lượng tăng cao. Hãy bảo đảm luôn áp dụng cùng ngưỡng làm mượt cho cả hai vế phân phối cơ sở và phân phối hiện tại để
      giữ tính nhất quán công thức. Tất cả biên chia giỏ phải được lưu cứng cùng phiên bản mô hình trong sổ đăng ký ngay từ
      lúc hoàn tất huấn luyện.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - round(0.40 + 0.30 + 0.20 + 0.10, 6) == 1.0
  - round(0.15 + 0.25 + 0.30 + 0.30, 6) == 1.0
  steps:
  - show: <ol><li>Tại sao phải cố định các ngưỡng chia giỏ từ tập Baseline khi tính PSI trên tập Production?</li><li>Khi phát
      hiện PSI = 0,28 nhưng mô hình vừa huấn luyện lại đạt F1 thấp hơn mô hình đang chạy, hệ thống nên xử lý thế nào?</li></ol>
    say: Mời bạn tự trả lời hai câu hỏi chốt bài hai. Câu một, tại sao phải giữ nguyên các mốc biên chia giỏ từ lúc huấn luyện
      cơ sở khi tính PSI? Câu hai, nếu đã trôi dữ liệu nặng nhưng mô hình tái huấn luyện cho điểm kém hơn bản cũ thì nên làm
      gì? Tạm dừng và tự trả lời. Hai câu hỏi này củng cố nguyên tắc chuẩn hoá hệ quy chiếu và tư duy phòng thủ khi tự động
      hoá tái huấn luyện.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Để đo sự dịch chuyển phân bố trên cùng một hệ quy chiếu
      khoảng giá trị; chia lại biên trên tập mới sẽ làm thay đổi tỉ lệ từng giỏ.</p></td></tr></table>
    say: 'Đáp án câu một: nhằm đối chiếu trên cùng một thước đo giá trị cố định thay vì làm biến dạng tỉ lệ giỏ. Nếu mỗi ngày
      lại thay đổi biên chia giỏ theo dữ liệu mới thì con số so sánh giữa các ngày không còn ý nghĩa thống kê nữa.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Không xuất bản bản kém hơn; giữ mô hình cũ và phát cảnh
      báo cho kỹ sư kiểm tra chất lượng nhãn hoặc thay đổi đặc trưng mới.</p></td></tr></table>
    say: 'Đáp án câu hai: giữ nguyên mô hình cũ trên sản xuất và phát cảnh báo để kỹ sư điều tra lại chất lượng dữ liệu mới.
      Một bản cập nhật tồi bị chặn lại kịp thời chính là minh chứng cho giá trị của lớp kiểm chứng vượt đường nền.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm bài tập và chấm tự động
  lab: labs/AIP/L02
  steps:
  - show: <table class='t'><tr><th>Thực hành AIP:L02</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Kích
      hoạt đường ống tự động tái huấn luyện có chốt kiểm vượt đường nền hiện hữu</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>base=0.40,0.30,0.20,0.10;
      prod=0.15,0.25,0.30,0.30; old_f1=0.80 new_f1=0.85 margin=0.01</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash
      labs/cham.sh AIP L02 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự cài đặt công cụ đo trôi dữ liệu PSI và cổng quyết định tái huấn luyện tự động từ luồng chuẩn. Lưu ý chuẩn
      hoá mảng tỉ lệ giỏ, kẹp giá trị tối thiểu chống lỗi lô-ga-rít không và xử lý đủ cả ba ngưỡng phân loại. Đọc kỹ quy chuẩn
      đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng để đáp ứng đủ cả ca ẩn. Chú ý kiểm đủ ba mức trạng
      thái trôi gồm ổn định, cảnh báo theo dõi và nghiêm trọng tại đúng các mốc không phẩy một và không phẩy hai. Đầu ra chỉ
      số ổn định cần hiển thị chính xác bốn chữ số thập phân theo đúng chuẩn quy định.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai AIP:L02</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (chuẩn hoá + kẹp)</b></td><td>Chia mỗi phần tử cho tổng mảng rồi áp <code>max(..., 1e-6)</code> trước khi gọi <code>math.log</code></td></tr><tr><td><b>Bước
      2 (ngưỡng 3 cấp)</b></td><td>Phân loại <code>SEVERE (&gt;=0.20)</code>, <code>WARN (&gt;=0.10)</code>, còn lại là <code>STABLE</code></td></tr><tr><td><b>Bước
      3 (cổng thăng cấp)</b></td><td>Chỉ kiểm <code>new_f1 &gt;= old_f1 + margin</code> khi trôi ở mức <code>SEVERE</code></td></tr></table>
    say: Gợi ý triển khai nhắc bạn kiểm tra đủ ba mức phân loại ở đầu vào ẩn. Trong ca cảnh báo nhẹ, dù điểm tái huấn luyện
      có giả định cao hơn, quyết định vẫn phải giữ ở mức chưa cần tái huấn luyện tự động. Ở ca chứa giỏ bằng không, phép kẹp
      một phần triệu đảm bảo tính toán liên tục không gãy giữa chừng. Nhờ chuẩn hoá cả hai mảng trước khi kẹp một phần triệu,
      phép tính luôn khép kín ngay cả khi đầu vào truyền số lượng thô thay vì tỉ lệ.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>psi=0.5146</div><div>drift_level=SEVERE</div><div>retrain_decision=PROMOTE_NEW</div></div>
    say: Đầu ra chuẩn cho bốn giỏ cơ sở hiển thị chỉ số ổn định không phẩy năm một bốn sáu, mức trôi nghiêm trọng và chấp nhận
      thăng cấp bản mới. Khi toàn bộ các dòng đầu ra đều khớp tuyệt đối với đáp án chuẩn và hai ca ẩn đều thông qua, bạn có
      thể an tâm lưu kết quả và chuyển tiếp. Kiểm chứng cả trường hợp không có trôi nặng thì quyết định luôn giữ nguyên bản
      hiện hành mà không kích hoạt huấn luyện dư thừa.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Đo PSI hàng ngày với eps</span><span class="a">→</span><span class="n">Cảnh báo
      3 ngưỡng trôi</span><span class="a">→</span><span class="n">Retrain phải thắng đường nền</span></div>
    say: Chuỗi tổng kết nối liền quy trình giám sát dữ liệu vận hành theo chỉ số PSI với cơ chế tái huấn luyện có kiểm chứng
      hiệu năng an toàn. Mọi quy trình đều được chứng minh bằng số liệu định lượng chạy thật thay cho mô tả lý thuyết suông.
      Giám sát trôi dữ liệu chủ động kết hợp tái huấn luyện có chốt kiểm giữ mô hình duy trì phong độ cao suốt vòng đời vận
      hành.
    focus:
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành AIP:L02:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Chúc mừng bạn đã nắm chắc bài kiểm trôi dữ liệu và sẵn sàng tối ưu phục vụ suy luận tốc độ cao tại bài ba.
    clear: true
    forward_ref: true
