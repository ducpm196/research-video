- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - round(0.40 + 0.30 + 0.20 + 0.10, 6) == 1.0
  - round(0.15 + 0.25 + 0.30 + 0.30, 6) == 1.0
  steps:
  - show: '<p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>import math</div><div>base = [0.40, 0.30, 0.20, 0.10]</div><div>prod = [0.15, 0.25, 0.30, 0.30]</div><div>eps = 1e-6</div><div>psi = sum(</div><div>    (max(q, eps) - max(p, eps)) * math.log(max(q, eps) / max(p, eps))</div><div>    for p, q in zip(base, prod)</div><div>)</div><div>print(f''psi={psi:.3f} action={"RETRAIN" if psi &gt;= 0.20 else "OK"}'')</div></div>'
    say: Đoạn mã đo mức độ dịch chuyển phân phối đặc trưng đầu vào bằng chỉ số ổn định quần thể PSI trên bốn giỏ dữ liệu chuẩn
      hoá. Phân phối sản xuất đã dịch chuyển rõ rệt từ nhóm đầu sang nhóm cuối so với cửa sổ cơ sở lúc huấn luyện. Biểu thức
      cộng dồn từng giỏ có bảo vệ giá trị không trả về mức PSI tổng hợp để đối chiếu trực tiếp với ngưỡng không phẩy hai.
      Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Tính từng số hạng sai khác nhân với
      lô-ga-rít tỉ số xác suất phản ánh mức độ lệch phân bố ở từng khoảng giá trị riêng lẻ.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>psi=0.515 action=RETRAIN</div></div>
    say: Kết quả chạy thật đạt không phẩy năm một năm vượt ngưỡng không phẩy hai, lập tức chuyển trạng thái hành động sang
      kích hoạt tái huấn luyện. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Ngưỡng không
      phẩy hai đánh dấu ranh giới rõ ràng giữa biến động mùa vụ bình thường và tình huống cần tái huấn luyện ngay.
