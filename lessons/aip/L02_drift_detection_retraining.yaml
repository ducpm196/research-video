    say: Khi một cơn sốt mua sắm mới làm phân bố nhóm khách hàng thay đổi chóng mặt chỉ trong hai tuần, việc đợi kỹ sư mở
      biểu đồ kiểm tra thủ công luôn quá chậm trễ. Ngược lại, tự động huấn luyện lại hàng đêm mà không kiểm tra chất lượng
      trên tập giữ lại gần nhất rất dễ thay nhầm mô hình kém hơn bởi dữ liệu nhiễu đột xuất.
