- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - round(0.40 + 0.30 + 0.20 + 0.10, 6) == 1.0
  - round(0.15 + 0.25 + 0.30 + 0.30, 6) == 1.0
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>def gate_promote(psi, old_f1, new_f1, margin=0.01):</div><div>    if psi &lt; 0.10:</div><div>        return ''STABLE''</div><div>    if psi &lt; 0.20:</div><div>        return ''WARN''</div><div>    return ''PROMOTE_NEW'' if new_f1 &gt;= old_f1 + margin else ''KEEP_OLD_ALERT''</div><div></div><div>print(gate_promote(0.15, 0.80, 0.84), gate_promote(0.35, 0.80, 0.84), gate_promote(0.35, 0.80, 0.78))</div></div>'
    say: Phép kiểm chứng thứ hai phân loại đủ ngưỡng trôi nhẹ từ không phẩy một và trôi nặng từ không phẩy hai. Nhờ có hai ngưỡng tách biệt nên đường ống tự động tái huấn luyện chỉ chạy khi vượt chuẩn và có kiểm chứng vượt đường nền hiện hữu. Với PSI bằng không phẩy một lăm nằm giữa hai ngưỡng, hệ thống trả về mức cảnh báo nhẹ dù mô hình thử đạt điểm cao hơn. Khi PSI tăng lên không phẩy ba lăm, mô hình mới đạt không phẩy tám bốn được thăng cấp, còn bản tụt xuống không phẩy bảy tám bị giữ lại kèm cảnh báo. Việc giữ nguyên mô hình đang chạy kèm phát cảnh báo khi tái huấn luyện thất bại giúp ngăn lỗi dữ liệu nhãn bẩn tràn lên sản xuất.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>WARN PROMOTE_NEW KEEP_OLD_ALERT</div></div>
    say: Đầu ra xác nhận rõ ba nhánh gồm cảnh báo nhẹ không kích hoạt tái huấn luyện và hai nhánh quyết định trái ngược khi trôi nặng. Kỹ sư
