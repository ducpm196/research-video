- id: practice
  kind: practice
  title: Tự làm bài tập và chấm tự động
  lab: labs/AIP/L03
  steps:
  - show: <table class='t'><tr><th>Thực hành AIP:L03</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Mô phỏng gom lô động Dynamic Batching, đo cận độ trễ P99 và kiểm tra dung lượng lượng tử hoá trên thiết bị Edge/IoT</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n_reqs=20
      max_batch=8 fixed_ms=10.0 per_item_ms=2.0 wait_ms=5.0; params_millions=50.0 bits=8 edge_ram_mb=64.0</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh AIP L03 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Hãy cài đặt bộ tính toán hiệu năng phục vụ suy luận gom lô động và kiểm định dung lượng triển khai biên Edge từ luồng
      chuẩn. Cần chú ý công thức tổng thời gian cho cả phần lô đầy lẫn lô lẻ cuối cùng trước khi tính thông lượng. Đọc kỹ
      quy chuẩn đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng để đáp ứng đủ cả ca ẩn. Hãy chú ý tính chính
      xác tổng số lô bằng phép làm tròn lên khi số yêu cầu không chia hết cho kích thước lô tối đa. Kiểm chứng đồng thời điều
      kiện vừa bộ nhớ thiết bị biên cho kết quả tổng hợp ở dòng đầu ra cuối cùng.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
