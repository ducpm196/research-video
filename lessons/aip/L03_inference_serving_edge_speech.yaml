      thưa, bộ đệm xả ngay lô hiện có khi chạm ngưỡng chờ tối đa để giữ độ trễ thấp cho hệ thống giọng nói tương tác. Khi
      lưu lượng cao, từng lô đầy kích thước được đẩy vào bộ máy nhân song song hoặc bản nén tám bít trên thiết bị biên.
