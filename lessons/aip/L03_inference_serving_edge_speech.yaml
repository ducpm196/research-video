- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - (10 + 2 * 8) / 8 == 3.25
  - 32 / 8 == 4
  steps:
  - show: '<p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>fixed_ms, per_ms, wait_ms = 10.0, 2.0, 5.0</div><div>for k in (1, 8):</div><div>    tb = fixed_ms + k * per_ms</div><div>    qps = k * 1000.0 / tb</div><div>    worst_p99 = wait_ms + tb</div><div>    print(f''batch={k} tb={tb:.1f}ms qps={qps:.1f} p99_bound={worst_p99:.1f}ms'')</div></div>'
    say: Đoạn mã tối ưu thông lượng phục vụ suy luận AI trên backend bằng kỹ thuật gom lô động Dynamic Batching. Đồng thời đo cân bằng kích thước lô với cận độ trễ đuôi cho Speech ASR hay TTS khi đợi tối đa năm mi-li-giây. Chi phí cố định mười mi-li-giây trên một phép gọi đơn khiến hiệu suất nghẽn ở tám mươi ba phẩy ba yêu cầu mỗi giây với độ trễ đuôi mười bảy mi-li-giây. Khi gộp thành lô tám mẫu, thông lượng tăng vọt lên ba trăm lẻ bảy phẩy bảy yêu cầu mỗi giây nhưng độ trễ xấu nhất tăng lên ba mươi mốt mi-li-giây. Điều này cho thấy kích thước lô lớn kéo thông lượng lên gần bốn lần đổi lấy biên độ trễ đuôi cao hơn nhưng vẫn rất an toàn dưới trần giọng nói.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>batch=1 tb=12.0ms qps=83.3 p99_bound=17.0ms</div><div>batch=8 tb=26.0ms
      qps=307.7 p99_bound=31.0ms</div></div>
    say: Đầu ra chạy thật chứng nhận thông lượng tăng gần gấp bốn lần từ tám mươi ba phẩy ba lên ba trăm lẻ bảy phẩy bảy yêu cầu mỗi giây. Đồng thời biên độ trễ đuôi tăng từ mười bảy lên ba mươi mốt mi-li-giây. Điều này giữ nguyên bất biến cân bằng thông lượng và độ trễ đuôi khi đặt ngưỡng gom lô trên hệ thống giọng nói. Độ trễ xấu nhất ba mươi mốt mi-li-giây vẫn nằm gọn dưới ngưỡng ba trăm mi-li-giây cho trải nghiệm đàm thoại tự nhiên. Nhờ vậy thông lượng đạt hơn ba trăm yêu cầu mỗi giây mà vẫn giữ chất lượng hội thoại mượt mà.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - (10 + 2 * 8) / 8 == 3.25
  - 32 / 8 == 4
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>params_m = 50.0</div><div>ram_fp32_mb = params_m * 4.0</div><div>ram_int8_mb = params_m * 1.0</div><div>edge_limit_mb = 64.0</div><div>fits = int(ram_int8_mb &lt;= edge_limit_mb)</div><div>print(f''fp32={ram_fp32_mb:.0f}MB int8={ram_int8_mb:.0f}MB fits_edge={fits}'')</div></div>'
    say: Phép kiểm chứng thứ hai đánh giá lượng tử hoá mô hình giảm kích thước và độ trễ triển khai trên thiết bị Edge/IoT
      có bộ nhớ RAM giới hạn. Một mô hình năm mươi triệu tham số lưu ở chuẩn số thực ba mươi hai bít chiếm tới hai trăm mê-ga-bai
      nên hoàn toàn không nạp lọt bo mạch sáu tư mê-ga-bai. Sau khi chuyển xuống chuẩn tám bít, kích thước giảm bốn lần xuống
      chỉ còn năm mươi mê-ga-bai nằm gọn dưới ngưỡng giới hạn. Tỉ lệ thu gọn bốn lần từ số thực ba mươi hai bít xuống số nguyên
      tám bít mở ra cơ hội chạy ngoại tuyến hoàn toàn trên thiết bị biên.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>fp32=200MB int8=50MB fits_edge=1</div></div>
    say: Kết quả kiểm chứng cho thấy bản INT8 thu gọn xuống năm mươi mê-ga-bai và vượt qua điều kiện chạy thực tế trên thiết
      bị biên. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Nhờ chừa sẵn khoảng trống
      bộ nhớ cho ngăn xếp thực thi, ứng dụng nhúng không gặp tình trạng giật khung hay thoát đột ngột.
