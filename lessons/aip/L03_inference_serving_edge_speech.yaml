  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>khuyến nghị kiến trúc</th></tr><tr><td>Voice/Speech
      AI ASR-TTS</td><td>Nhạy cảm với độ trễ đầu-cuối < 300 ms</td><td>Đặt max_wait_ms nhỏ (5-10 ms) + streaming từng đoạn
      âm thanh</td></tr><tr><td>Gom lô chờ quá dài 200 ms</td><td>Thông lượng cao nhưng rớt P99 SLA</td><td>Tự xả lô ngay
      khi chạm đồng hồ wait hoặc đủ batch_size</td></tr><tr><td>Thiết bị Edge / IoT 64 MB</td><td>Tràn RAM khi nạp mô hình
      FP32</td><td>Lượng tử hoá INT8/INT4 + cắt tỉa trọng số chạy trên CPU</td></tr></table>
    say: Bảng kiến trúc đo cân bằng giữa kích thước lô tối đa và độ trễ đuôi P99 trên hệ thống Speech ASR/TTS lẫn triển khai
      biên. Với ứng dụng tương tác giọng nói, giữ cửa sổ chờ gom lô cực ngắn và phát từng đoạn âm thanh vừa tổng hợp giúp
      người dùng nghe phản hồi tức thì. Trên thiết bị biên có bộ nhớ hạn chế, kết hợp lượng tử hoá tám bít cùng kiểm tra ngưỡng
      RAM trước lúc đóng gói giúp tránh lỗi tràn bộ nhớ tại thực địa. Đối với nhận dạng và tổng hợp giọng nói, kết hợp phát
      âm thanh cuốn chiếu từng đoạn nhỏ che giấu hoàn toàn độ trễ chờ toàn câu. Trước mỗi đợt phát hành mô hình lượng tử hoá,
      luôn chạy kiểm chứng độ chính xác trên tập mẫu chuẩn để giữ sai số trong ngưỡng cho phép.
