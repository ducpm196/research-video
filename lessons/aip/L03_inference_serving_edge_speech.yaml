  steps:
  - show: '<div class=''box key''><p>Với chi phí cố định <code>10 ms</code> và <code>2 ms</code> mỗi mẫu: chạy đơn tốn <b>12
      ms/mẫu</b> (83,3 req/s), còn <b>Dynamic Batching 8 mẫu</b> chỉ tốn <code>(10 + 16)/8 = <b>3,25 ms/mẫu</b></code> (307,7
      req/s).</p></div>'
    say: Một máy chủ backend phục vụ hệ thống tổng hợp hay nhận dạng giọng nói Speech AI nếu chạy từng câu một sẽ tốn phần
      lớn thời gian. Lý do là bộ máy phải khởi tạo lại nhân ma trận trên mỗi yêu cầu. Nhờ gom lô động Dynamic Batching đợi
      tối đa vài mi-li-giây để ghép tám câu vào một lượt tính duy nhất. Thông lượng hệ thống lập tức nhảy vọt gấp gần bốn
      lần mà không cần mua thêm phần cứng.
    clear: true
  - show: <div class='box ok'><p><b>Mục tiêu hôm nay:</b> Mô phỏng chi phí <b>Dynamic Batching</b> và tính ngân sách bộ nhớ
      <b>Edge INT8</b>.</p></div>
    say: Hôm nay ta mô phỏng chính xác chi phí gom lô động và tính ngân sách bộ nhớ cho suy luận Edge/IoT. Hiểu rõ mối quan
      hệ giữa kích thước lô, cửa sổ chờ và dung lượng bộ nhớ là chìa khoá vận hành dịch vụ suy luận AI tiết kiệm chi phí.
      Điều này đặc biệt sống còn trong các hệ thống giọng nói tương tác đòi hỏi phản hồi tự nhiên dưới ba trăm mi-li-giây.
    clear: true
