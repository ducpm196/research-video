    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai AIP:L03</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (chia lô động)</b></td><td>Tính số lô bằng <code>math.ceil(n_reqs / max_batch)</code>, tổng thời gian là <code>n_batches
      * fixed + n_reqs * per_item</code></td></tr><tr><td><b>Bước 2 (độ trễ đỉnh)</b></td><td>Cộng cửa sổ chờ <code>wait_ms</code>
      với thời gian xử lý một lô đầy <code>fixed + max_batch * per_item</code></td></tr><tr><td><b>Bước 3 (bộ nhớ Edge)</b></td><td>Tính
      dung lượng <code>params_millions * (bits / 8.0)</code> và so với giới hạn <code>edge_ram_mb</code></td></tr></table>
    say: Gợi ý triển khai làm rõ mẹo rút gọn công thức tổng thời gian qua mọi lô kích thước khác nhau. Bởi mọi lô đều chịu
      chung một lần chi phí cố định và tổng số phần tử đi qua mọi lô đúng bằng tổng số yêu cầu. Ta tính trực tiếp tổng thời
      gian mà không cần tách riêng kích thước lô dư cuối. Hãy kiểm thử với cả ba độ rộng bít gồm bốn, tám và ba mươi hai.
      Mỗi phần tử trong tổng thời gian xử lý được chia rõ thành chi phí mở lô nhân số lô cộng chi phí tính nhân tổng phần
      tử.
