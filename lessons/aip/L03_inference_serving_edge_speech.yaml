- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - (10 + 2 * 8) / 8 == 3.25
  - 32 / 8 == 4
  steps:
  - show: <div class='box key'><p><b>1. Thông lượng gom lô kích thước k:</b> <code>T_batch(k) = T_fixed + k * T_item</code>;
      <code>QPS(k) = k * 1000 / T_batch(k)</code>.</p><p><b>2. Độ trễ xấu nhất (P99):</b> <code>Latency_worst = max_wait_ms
      + T_batch(max_batch)</code> và tỉ lệ nén RAM <code>FP32/INT8 = <b>4x</b></code>.</p></div>
    say: Hai công thức định lượng cho phép kỹ sư cấu hình cổng phục vụ suy luận theo đúng chỉ tiêu SLA sản phẩm. Thông lượng
      QPS tăng vọt khi kích thước lô tiến về vùng cân bằng, nhưng độ trễ xấu nhất của người dùng luôn bị cộng thêm một khoảng
      chờ cửa sổ gom lô. Vì vậy trong các ứng dụng thoại Speech AI thời gian thực, ngưỡng chờ gom lô thường phải giữ cực nhỏ
      dưới mười mi-li-giây. Cộng thêm thời gian chờ tối đa vào thời gian chạy một lô cho ra cận trên đáng tin cậy cho độ trễ
      xấu nhất. Kỹ sư dựa trực tiếp vào công thức này để chứng minh thiết kế đáp ứng đúng cam kết tốc độ với đối tác trước
      lúc triển khai.
