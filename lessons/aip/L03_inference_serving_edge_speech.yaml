  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (wait_ms quá lớn):</b>
      Đặt thời gian chờ gom lô 100 ms cho API thời gian thực làm mọi người dùng đều chịu thêm 100 ms độ trễ vô ích.<br><b>Lỗi
      2 (không giới hạn hàng đợi):</b> Cho hàng đợi đầu vào tích tụ không chặn trên gây bùng nổ độ trễ vài chục giây khi quá
      tải.<br><b>Lỗi 3 (lượng tử hoá không hiệu chuẩn):</b> Ép thẳng xuống INT8 mà không chạy tập hiệu chuẩn dễ làm rơi mạnh
      độ chính xác câu thoại.</div></td></tr></table>
    say: Hãy lưu tâm ba lỗi thường gặp khi triển khai dịch vụ suy luận tốc độ cao và chạy trên thiết bị biên. Thứ nhất là
      cấu hình cửa sổ chờ gom lô quá lớn so với ngưỡng thời gian cho phép của giao diện người dùng. Thứ hai là để hàng đợi
      tiếp nhận tăng không giới hạn thay vì trả mã từ chối bận khi đã đầy tải. Thứ ba là nén trọng số về tám bít mà bỏ qua
      tập dữ liệu hiệu chuẩn biên độ kích hoạt. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định khi
      lưu lượng tăng cao. Ngoài việc chọn cửa sổ chờ hợp lý, cần giới hạn độ dài hàng đợi đầu vào để hệ thống tự bảo vệ và
      trả mã bận khi quá tải. Nếu cứ nhận vô hạn vào hàng đợi, mọi yêu cầu đều quá hạn trước khi kịp tới lượt tính toán.
