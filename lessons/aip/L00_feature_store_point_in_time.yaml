- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 8 <= 10
  - 12 > 10
  steps:
  - show: '<div class=''box key''><p><b>1. Luật Point-in-Time:</b> <code>feat(u, t_event) = argmax_{f: f.u==u và f.ts <= t_event}
      f.ts</code>.</p><p><b>2. Bất biến đồng nhất:</b> <code>|val_offline - val_online| &lt;= 1e-5</code> tại cùng cặp <code>(entity_id,
      t_event)</code>.</p></div>'
    say: Hai biểu thức định lượng là thước đo vàng khi kiểm định mọi đường ống nạp đặc trưng AI chuyên nghiệp. Công thức thứ
      nhất xác định chính xác đặc trưng hợp lệ phải cùng thực thể và có dấu thời gian lớn nhất nhưng vẫn nhỏ hơn hoặc bằng
      thời điểm sự kiện. Điều kiện thứ hai bắt buộc hai nhánh ngoại tuyến và trực tuyến phải cho ra cùng một giá trị số trong
      sai số một phần trăm nghìn. Vì bất kỳ độ lệch nào cũng làm dịch điểm cắt của mô hình. Toán tử tìm cực đại theo dấu thời gian
      chọn đúng ảnh chụp trạng thái thực tế của người dùng ngay trước lúc bấm nút thanh toán. Kết hợp kiểm tra sai lệch cực
      đại trên toàn bộ véc-tơ đặc trưng giúp ngăn lỗi lệch tỉ lệ chuẩn hoá khi phục vụ thật.
    focus:
