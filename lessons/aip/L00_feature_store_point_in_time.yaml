- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - 8 <= 10
  - 12 > 10
  steps:
  - clear: true
    show: '<p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>def calc_feat(v): return round(v / 100.0, 2)</div><div>feats, t_event = [(4, 120), (8, 350), (12, 999)], 10</div><div>valid = [(ts, val) for ts, val in feats if ts &lt;= t_event]</div><div>ts, val = max(valid); drop = len(feats) - len(valid)</div><div>out = f''picked_ts={ts} picked_val={val}''</div><div>print(out, f''feat={calc_feat(val)} dropped={drop}'')</div></div>'
    say: Đoạn mã định nghĩa một hàm công thức tính đặc trưng dùng chung cho cả huấn luyện ngoại tuyến và phục vụ trực tuyến rồi chạy ghép Point-in-Time. Dù bảng lịch sử đã ghi nhận mốc mười hai với giá trị chín chín chín. Bước lọc quá khứ vẫn loại
      hoàn toàn bản ghi đó vì nó xảy ra sau thời khắc quyết định t bằng mười. Hệ thống giữ đúng mốc tám với giá trị ba trăm năm mươi và áp cùng công thức chia một trăm ra ba phẩy năm. Chỉ với hai bước lọc nhỏ hơn bằng mốc sự kiện và chọn
      cực đại theo thời gian, bài toán rò rỉ dữ liệu và lệch công thức được giải quyết dứt điểm.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>picked_ts=8 picked_val=350 feat=3.5 dropped=1</div></div>
    say: Kết quả chạy thật xác nhận hệ thống chọn mốc tám với giá trị ba trăm năm mươi và bỏ một bản ghi tương lai để bảo
      đảm tính nhân quả. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Cờ đếm số bản ghi
