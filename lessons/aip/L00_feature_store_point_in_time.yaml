- id: sym
  kind: symbol
  title: Quy chuẩn và cấu trúc dữ liệu
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>ý nghĩa cài đặt</th></tr><tr><td><code>as-of join (ts_f &lt;= ts_e)</code></td><td>Với
      sự kiện lúc <code>ts_e</code>, lấy giá trị đặc trưng mới nhất có <code>ts_f &lt;= ts_e</code></td></tr><tr><td><code>Offline
      / Online Parity</code></td><td>Chênh lệch giữa véc-tơ huấn luyện ngoại tuyến và véc-tơ phục vụ thời gian thực phải &lt;
      1e-6</td></tr><tr><td><code>Future Leakage Guard</code></td><td>Tất cả bản ghi có dấu thời gian lớn hơn thời điểm nhãn
      bị loại hoàn toàn</td></tr></table>
    say: Bảng ký hiệu tóm tắt ba nguyên tắc kỹ thuật bảo vệ độ tinh khiết của kho đặc trưng AI. Phép nối theo thời điểm đảm
      bảo chỉ sử dụng tri thức đã hình thành trước hoặc đúng thời khắc sự kiện diễn ra. Kiểm tra đồng nhất trực tuyến và ngoại
      tuyến phát hiện kịp thời bất kỳ sai khác công thức hay làm tròn số nào. Rào chặn tương lai cấm tuyệt đối việc đọc nhầm
      các dòng phát sinh sau giờ chốt. Những quy chuẩn trên sẽ xuyên suốt từ phần chạy thực nghiệm mẫu tới bài tập thực hành
      cuối bài. Phép nối bất đẳng thức giữ lại dòng đặc trưng hợp lệ mới nhất mà vẫn loại hoàn toàn mọi cập nhật đến trễ hơn
      mốc quyết định. Đặt ngưỡng sai lệch cực nhỏ một phần triệu giúp phát hiện kịp thời sự khác biệt dấu phẩy động giữa hai
      ngôn ngữ lập trình.
