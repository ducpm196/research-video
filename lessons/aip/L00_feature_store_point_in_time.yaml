- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - 8 <= 10
  - 12 > 10
  steps:
  - show: <ol><li>Nếu nhãn giao dịch có dấu thời gian <code>t=10</code> và lịch sử đặc trưng có ở <code>t=5, t=10, t=14</code>,
      bản ghi nào hợp lệ?</li><li>Làm sao phát hiện sớm độ lệch công thức giữa Online Feature Store và Offline Feature Store?</li></ol>
    say: Hãy kiểm tra kiến thức bài mở đầu bằng hai câu hỏi thực tế. Câu một, với sự kiện tại mốc mười và ba bản ghi đặc trưng
      ở năm, mười, mười bốn thì bản ghi nào được phép dùng? Câu hai, làm cách nào phát hiện sớm độ lệch giữa hai nhánh kho
      đặc trưng? Tạm dừng và tự trả lời. Nhớ áp dụng đúng định nghĩa ghép theo thời điểm và phương pháp đo sai lệch giữa hai
      nhánh lưu trữ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Chọn bản ghi <code>t = <b>10</b></code> (mới nhất thoả
      mãn <code>ts_f &lt;= t_event</code>); loại hoàn toàn <code>t = 14</code> ở tương lai.</p></td></tr></table>
    say: 'Đáp án câu một: chọn mốc mười nếu quy ước nhỏ hơn bằng đã sẵn sàng trước quyết định và tuyệt đối loại mốc mười bốn
      ở tương lai. Khoảng thời gian trùng đúng mốc mười chỉ hợp lệ nếu đặc trưng đó thực sự đã tính xong trước khi mô hình
      được gọi.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Ghi vết véc-tơ phục vụ Online theo từng yêu cầu thật
      rồi đối chiếu sai khác với kết quả truy xuất lại từ Offline ở cùng cặp mã và thời điểm.</p></td></tr></table>
    say: 'Đáp án câu hai: ghi lại véc-tơ phục vụ trực tuyến rồi định kỳ đối chiếu với kết quả truy xuất ngoại tuyến tại đúng
      cặp thực thể và mốc thời gian đó. Nhật ký đối chiếu định kỳ trên mẫu lưu lượng thật là phương pháp tin cậy nhất để bắt
      lỗi trôi công thức giữa hai môi trường.'
    clear: true
- id: practice
  kind: practice
  title: Tự làm bài tập và chấm tự động
  lab: labs/AIP/L00
  steps:
  - show: <table class='t'><tr><th>Thực hành AIP:L00</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Áp
      dụng ghép theo thời điểm Point-in-Time để triệt tiêu rò rỉ dữ liệu từ tương lai</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>events=u1:10:350.0,u2:20:80.0;
      features=u1:4:120.0,u1:8:350.0,u1:12:999.0,u2:15:80.0,u2:25:500.0; parity_tol=1e-5</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash
      labs/cham.sh AIP L00 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Hãy tự cài đặt công cụ ghép nối Point-in-Time và kiểm định độ lệch trực tuyến ngoại tuyến cho Feature Store từ luồng
      chuẩn. Lưu ý lọc chặt theo từng định danh thực thể và giữ quy chuẩn chỉ chọn dấu thời gian nhỏ hơn hoặc bằng thời điểm
      sự kiện. Đọc kỹ quy chuẩn đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng để đáp ứng đủ cả ca ẩn.
      Chú ý xử lý gọn trường hợp thực thể hoàn toàn không có bản ghi đặc trưng nào trước mốc thời điểm sự kiện. Kiểm kỹ cách
      tính sai lệch lớn nhất trên toàn bộ các cặp véc-tơ trực tuyến và ngoại tuyến đưa vào từ luồng chuẩn.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai AIP:L00</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (gom đặc trưng)</b></td><td>Nhóm danh sách cặp <code>(feat_ts, feat_val)</code> vào từ điển theo khoá <code>entity_id</code></td></tr><tr><td><b>Bước
      2 (as-of join)</b></td><td>Lọc các bản ghi <code>feat_ts &lt;= ev_ts</code> rồi lấy phần tử có <code>feat_ts</code>
      lớn nhất</td></tr><tr><td><b>Bước 3 (kiểm parity)</b></td><td>Đo chênh lệch tuyệt đối với <code>online_val</code> và
      yêu cầu vừa không thiếu vừa dưới ngưỡng <code>parity_tol</code></td></tr></table>
    say: Gợi ý triển khai nhắc bạn hai điểm biên thường gặp ở các ca kiểm ẩn. Thứ nhất nếu một thực thể chỉ tồn tại các cập
      nhật ở tương lai hoàn toàn lớn hơn thời điểm sự kiện. Phép lọc phải trả về danh sách rỗng và tăng bộ đếm thiếu lên một
      thay vì lấy đại giá trị đầu. Thứ hai kiểm tra điều kiện parity chỉ đạt khi đồng thời không thiếu thực thể nào và sai
      lệch tối đa dưới ngưỡng. Khi danh sách ứng viên sau lọc thời gian trống rỗng, thuật toán tăng bộ đếm thiếu lên một và
      tiếp tục xử lý các sự kiện kế tiếp.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>joined_count=2 missing_count=0</div><div>max_skew=0.000000</div><div>parity_ok=1</div></div>
    say: Đầu ra chuẩn cho hai sự kiện u một và u hai ghép thành công cả hai không thiếu bản ghi nào, độ lệch bằng không và
      đạt chuẩn đồng nhất một. Khi toàn bộ các dòng đầu ra đều khớp tuyệt đối với đáp án chuẩn và hai ca ẩn đều thông qua,
      bạn có thể an tâm lưu kết quả và chuyển tiếp. Định dạng sáu chữ số thập phân ở dòng sai lệch tối đa bảo đảm khớp chính
      xác từng ký tự với bộ kiểm tự động.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: recap
  kind: recap
  title: Tổng kết bất biến bài học
  steps:
  - show: <div class="chain"><span class="n">Ghép Point-in-Time &lt;= ts</span><span class="a">→</span><span class="n">Chặn
      100% nhãn tương lai</span><span class="a">→</span><span class="n">Kiểm parity Online/Offline</span></div>
    say: Chuỗi nguyên tắc chốt lại cách thiết kế Feature Store chuẩn công nghiệp loại bỏ rò rỉ dữ liệu thời gian. Bảo toàn
      độ chính xác từ phòng thí nghiệm ra sản xuất. Mọi quy trình đều được chứng minh bằng số liệu định lượng chạy thật thay
      cho mô tả lý thuyết suông. Ba chốt chặn nhân quả và đồng nhất là nền móng bắt buộc cho mọi hệ thống học máy vận hành
      tin cậy trong doanh nghiệp.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
  - show: <div class='box ok'><b>Hoàn thành AIP:L00:</b> đã kiểm chứng toàn bộ bất biến cốt lõi.</div>
    say: Chúc mừng bạn đã hoàn thành bài mở đầu của khoá kỹ thuật AI ứng dụng và sẵn sàng chuyển sang bài tiếp theo về Experiment
      Tracking. Model Registry và kiểm thử A/B.
