    say: Hình minh hoạ cách ghép đúng một sự kiện thanh toán xảy ra tại thời điểm mười giờ sáng. Trong bảng lịch sử có ba
      cập nhật đặc trưng tại các mốc bốn, tám và mười hai giờ. Phép nối Point-in-Time tự động loại mốc mười hai giờ ở tương
      lai và chọn chính xác bản ghi mới nhất đã tồn tại ở mốc tám giờ. Nhờ đường ranh giới thời gian cố định tại mười giờ,
      mọi bản ghi phát sinh sau mốc này hoàn toàn vô hình đối với mẫu huấn luyện. Điều đó buộc mô hình học đúng tín hiệu dự
      báo nhân quả thay vì học vẹt kết quả từ tương lai.
