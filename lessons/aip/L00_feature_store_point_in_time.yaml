  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (nối thiếu điều
      kiện <= ts):</b> Dùng phép <code>JOIN ON entity_id</code> thông thường kéo luôn sự kiện tương lai làm giả mạo kết quả.<br><b>Lỗi
      2 (lệch múi giờ UTC vs +7):</b> Nhánh ngoại tuyến dùng giờ địa phương còn nhánh trực tuyến dùng UTC gây lệch khớp 7
      tiếng.<br><b>Lỗi 3 (nhầm thứ tự biên =):</b> Không thống nhất dùng nhỏ hơn hẳn hay nhỏ hơn bằng ở mốc giây trùng nhau
      giữa nhãn và cập nhật.</div></td></tr></table>
    say: Hãy tránh ba lỗi rất đắt giá khi vận hành kho đặc trưng Feature Store cho các bài toán AI thực chiến. Lỗi đầu tiên
      và phổ biến nhất là viết câu lệnh nối bảng thông thường thiếu điều kiện chặn dấu thời gian, dẫn tới rò rỉ nhãn tương
      lai. Lỗi thứ hai là lệch chuẩn múi giờ giữa kho phân tích và dịch vụ trực tuyến khiến toàn bộ cửa sổ bảy ngày bị dịch
      sai. Lỗi thứ ba là không quy ước rõ bất đẳng thức tại thời điểm trùng khớp đúng giây sự kiện. Nhận diện sớm các lỗi
      cấu trúc này giúp hệ thống giữ vững tính ổn định khi lưu lượng tăng cao. Ngoài múi giờ và điều kiện biên, nhớ kiểm tra
      kỹ trường hợp bản ghi lịch sử bị cập nhật bù muộn sau khi giao dịch đã chốt. Cách tốt nhất là luôn lưu hai cột thời
      gian riêng biệt gồm thời điểm phát sinh sự kiện và thời điểm hệ thống ghi nhận.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
