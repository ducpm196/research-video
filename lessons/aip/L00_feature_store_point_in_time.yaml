      véc-tơ hàng ngày</td></tr><tr><td>Dữ liệu đến trễ (late event)</td><td>Khoá trực tuyến thiếu cập nhật</td><td>Đặt vùng
      trễ watermark & lưu lịch sử phiên bản đầy đủ</td></tr></table>
    say: Bảng kiến trúc hướng dẫn cách áp dụng ghép theo thời điểm Point-in-Time. Để triệt tiêu rò rỉ dữ liệu từ tương lai
      khi đối chiếu huấn luyện phục vụ ở quy mô hàng chục triệu sự kiện mỗi ngày. Thay vì quét tuyến tính từng cặp sự kiện
      và đặc trưng tốn bình phương thời gian. Việc sắp sẵn dãy thời gian theo từng thực thể cho phép tìm kiếm nhị phân trong
      thời gian lô-ga-rít. Đồng thời kiểm chéo định kỳ giữa hai nhánh kho đặc trưng giữ cho mô hình sản xuất hành xử y hệt
      lúc đánh giá kiểm thử. Trên bảng mười triệu sự kiện, cấu trúc tìm kiếm nhị phân theo thời gian giảm số phép so sánh
      mỗi dòng xuống còn khoảng hai mươi lần. Khi kết hợp lưu kho theo từng ngày và phân vùng theo định danh khách hàng, tốc
      độ nạp tập huấn luyện tăng gấp hàng chục lần.
