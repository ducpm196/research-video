  title: Feature Store đồng nhất và ghép Point-in-Time
  checks:
  - 8 <= 10
  - 12 > 10
  steps:
  - show: '<div class=''box key''><p>Ghép sự kiện lúc <code>t = 10</code> với lịch sử đặc trưng ở <code>t = 4, 8, 12</code>:
      nối thường dễ lấy nhầm <b>t = 12 (tương lai)</b>, còn <b>Point-in-Time</b> chốt đúng <code>t = <b>8</b></code>.</p></div>'
    say: Vì dữ liệu tương lai thường tương quan cực mạnh với kết quả gian lận hay rời bỏ dịch vụ. Chỉ cần một phép ghép bảng
      cẩu thả đưa nhầm đặc trưng sau thời điểm nhãn vào tập huấn luyện cũng tạo nên độ chính xác ảo chín chín phần trăm. Khi
      đưa ra chạy thật lúc chưa có dữ liệu tương lai đó, mô hình lập tức sụp đổ khiến doanh nghiệp thiệt hại nặng nề.
    clear: true
  - show: <div class='box ok'><p><b>Mục tiêu hôm nay:</b> Cài <b>Feature Store</b> ghép Point-in-Time <code>ts_f &lt;= ts_e</code>
      và đối chiếu tương đương <b>Offline / Online</b>.</p></div>
    say: Hôm nay ta cài đặt chuẩn kho đặc trưng Feature Store với ghép Point-in-Time chống rò rỉ và kiểm chứng tương đương
      trực tuyến. Ngược lại khi lọc chặt theo dấu thời gian sự kiện, mô hình chỉ nhận đúng dữ liệu đã xảy ra trước thời khắc
      ra quyết định. Quy trình đối chiếu hai nhánh giúp đảm bảo kết quả đánh giá trên máy cá nhân phản ánh trung thực độ chính
      xác khi vận hành thật.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối kiến thức trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Rò rỉ dữ liệu thời gian</td><td>Dữ
      liệu phát sinh sau thời điểm dự báo không bao giờ có mặt khi mô hình chạy thật</td></tr><tr><td>Kho đặc trưng nền tảng</td><td>Lưu
      véc-tơ đặc trưng tái sử dụng xuyên suốt nhiều mô hình AI trong tổ chức</td></tr><tr><td>Khái niệm ghép theo khoá và
      mốc giờ</td><td>Tìm bản ghi gần nhất về phía quá khứ trước thời điểm sự kiện nhãn</td></tr></table>
    say: Một trong những nguyên nhân thầm lặng khiến mô hình học máy đạt điểm kiểm thử xuất sắc. Nhưng thất bại thảm hại ngoài
      sản xuất là độ lệch giữa lúc huấn luyện và lúc phục vụ. Nếu đội dữ liệu viết mã tổng hợp lịch sử chi tiêu bằng SQL trên
      kho lớn còn đội phần mềm viết lại bằng Java trong dịch vụ trực tuyến. Hai công thức dễ sai lệch dần theo thời gian.
      Tệ hơn nữa, phép nối bảng thiếu điều kiện thời gian vô tình kéo giá trị tương lai vào dòng huấn luyện. Kho đặc trưng
      Feature Store kết hợp thuật toán ghép Point-in-Time giải quyết dứt điểm cả hai vấn đề này. Kết nối chặt chẽ các nền
      tảng này giúp giải pháp cài đặt gọn gàng và ổn định. Việc dùng chung một định nghĩa đặc trưng giữa hai môi trường giảm
      đáng kể công sức bảo trì và gỡ lỗi mỗi lần nâng cấp mô hình. Mỗi biến đổi thời gian đều phải gắn múi giờ thống nhất
      để tránh lệch cửa sổ tổng hợp lịch sử giao dịch.
