- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 1.96 ** 2 > 3.84
  - 0.85 > 0.80
  steps:
  - show: <p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>import math</div><div>na, ca = 1000, 100</div><div>nb,
      cb = 1000, 140</div><div>pa, pb = ca / na, cb / nb</div><div>pp = (ca + cb) / (na + nb)</div><div>se = math.sqrt(pp
      * (1.0 - pp) * (1.0 / na + 1.0 / nb))</div><div>z = (pb - pa) / se</div><div>print(f'pa={pa:.3f} pb={pb:.3f} z={z:.2f}
      ship={int(z &gt;= 1.96)}')</div></div>
    say: Phép kiểm chứng thứ hai đánh giá thử nghiệm A/B trực tuyến bằng kiểm định thống kê z giữa phiên bản hiện tại A và
      phiên bản mới B. Với mỗi nhóm một nghìn lượt người dùng và số chuyển đổi tăng từ một trăm lên một trăm bốn mươi, ta
      tính sai số chuẩn gộp để quy ra thống kê kiểm định. Nếu giá trị z đạt từ một phẩy chín sáu trở lên, đội ngũ mới có đủ
      bằng chứng chuyển toàn bộ lưu lượng sang bản B. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định
      nghĩa gốc. Tỉ lệ chuyển đổi tăng từ mười phần trăm lên mười bốn phần trăm trên hai nghìn lượt tạo ra mức chênh lệch
      thống kê rõ rệt vượt chuẩn tin cậy.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>pa=0.100 pb=0.140 z=2.75 ship=1</div></div>
    say: Kết quả chạy độc lập cho z bằng hai phẩy bảy năm lớn hơn hẳn ngưỡng một phẩy chín sáu nên quyết định mở rộng lên
      Production trả về một. Ngược lại nếu thống kê z thấp hơn ngưỡng một phẩy chín sáu, hệ thống giữ nguyên phiên bản cũ
      để tránh chi phí chuyển đổi vô ích.
    clear: true
    focus:
    - 1
    - 2
- id: quymo
