      thái Registry</td><td>Chồng chéo phiên bản khó quay lui</td><td>Đánh số nguyên v1, v2... & giữ tag bản Production trước
      để rollback < 5 s</td></tr><tr><td>Thử nghiệm A/B trên 1% tải</td><td>Nhiễu biến động theo giờ trong ngày</td><td>Phân
      chia cố định theo mã người dùng và chạy đủ chu kỳ ngày</td></tr><tr><td>Nhật ký thí nghiệm rời rạc</td><td>Không tái
      tạo lại mô hình cũ</td><td>Lưu kèm hash tập dữ liệu, random_state và tệp yêu cầu thư viện</td></tr></table>
    say: Bảng vận hành làm rõ cách quản trị chuyển trạng thái mô hình trong Model Registry từ Staging lên Production và quy
      tắc chia lưu lượng A/B ở quy mô lớn. Phân chia người dùng theo hàm băm cố định của mã định danh bảo đảm một khách hàng
      không bị nhảy qua nhảy lại giữa hai giao diện khác nhau trong cùng một ngày. Đồng thời giữ nguyên phiên bản cũ trong
      sổ đăng ký giúp quay lui tức thì nếu phát sinh sự cố bất thường sau lúc nâng tỉ lệ. Kỹ thuật phân nhóm tất định bằng
      hàm băm trên mã người dùng đảm bảo trải nghiệm nhất quán xuyên suốt các lần truy cập trong ngày. Đồng thời giữ nguyên
      bản lưu phiên bản trước trong sổ đăng ký cho phép hoàn tác lưu lượng chỉ trong vài giây khi gặp lỗi.
