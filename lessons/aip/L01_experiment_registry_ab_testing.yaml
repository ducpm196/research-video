      width="260" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="790.0" y="75" font-size="18"
      font-weight="700" text-anchor="middle" fill="#1e293b">Triển khai A/B Production</text><text x="790.0" y="102" font-size="15"
      text-anchor="middle" fill="#475569">Đo z-score &gt; 1,96 mới thay</text></svg></div>
    say: Sơ đồ đường ống phát hành chuẩn MLOps gồm ba cổng gác liên tiếp từ phòng thí nghiệm ra thực tế. Mọi cuộc chạy thử
      nghiệm tự động ghi nhận siêu tham số vào bảng theo dõi chung. Ứng viên sáng giá nhất bước qua bộ lọc đa điều kiện tại
      Model Registry để vào thử nghiệm A/B đối đầu trực tiếp với mô hình Production hiện hữu. Cấu trúc lọc theo phễu ba tầng
      loại bỏ nhanh các phiên bản kém ngay từ lúc chưa tốn chi phí phục vụ lưu lượng thật. Chỉ những mô hình vừa chính xác
      vừa đủ nhanh mới nhận cơ hội chứng minh hiệu quả tài chính trên người dùng thực tế.
    clear: true
- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 1.96 ** 2 > 3.84
  - 0.85 > 0.80
  steps:
  - show: <div class='box key'><p><b>1. Kiểm tra thăng cấp Registry:</b> <code>eligible = (score &gt;= min_score) and (lat_ms
      &lt;= max_lat)</code>.</p><p><b>2. Kiểm định A/B hai tỉ lệ:</b> <code>z = (p_B - p_A) / sqrt(p_pool*(1-p_pool)*(1/n_A
      + 1/n_B))</code>; chấp nhận thăng cấp khi <code>p_B &gt; p_A</code> và <code>z &gt;= 1,96</code> (p &lt; 0,05).</p></div>
    say: Hai công thức định lượng bảo đảm mọi quyết định thăng cấp mô hình đều có căn cứ rõ ràng và tái lập được. Điều kiện
      đầu tiên loại bỏ ngay các thí nghiệm đánh đổi tốc độ lấy điểm số hão. Công thức kiểm định thống kê z đo khoảng cách
      chênh lệch tỉ lệ thành công theo đơn vị độ lệch chuẩn gộp. Giúp loại bỏ nhiễu ngẫu nhiên ở độ tin cậy chín mươi lăm
      phần trăm vì ngưỡng chuẩn một phẩy chín sáu tương ứng mức xác suất dưới năm phần trăm. Trong thử nghiệm quy mô lớn,
      tính trước cỡ mẫu cần thiết trước khi chạy là nguyên tắc thống kê quan trọng nhất để giữ sai số loại một ở mức thấp.
      Nếu chỉ nhìn sự chênh lệch thô giữa hai tỉ lệ mà bỏ qua sai số chuẩn gộp, bạn rất dễ kết luận nhầm trên mẫu nhỏ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - 1.96 ** 2 > 3.84
  - 0.85 > 0.80
  steps:
  - show: '<p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>runs = [</div><div>    {''id'': ''r1'', ''seed'': 42, ''lr'': 0.1, ''f1'':
      0.88, ''lat'': 40.0},</div><div>    {''id'': ''r2'', ''seed'': 42, ''lr'': 0.05, ''f1'': 0.86, ''lat'': 18.0},</div><div>    {''id'': ''r3'', ''seed'': 42, ''lr'': 0.01, ''f1'':
      0.81, ''lat'': 12.0},</div><div>]</div><div>cands = [r for r in runs if r[''f1''] &gt;= 0.85 and r[''lat''] &lt;= 25.0]</div><div>best
      = max(cands, key=lambda r: r[''f1'']) if cands else None</div><div>print(f''staging_cands={len(cands)} promoted={best["id"]
      if best else "NONE"}'')</div></div>'
    say: Đoạn mã minh hoạ quy trình ghi nhật ký siêu tham số và chỉ số thực nghiệm vào Experiment Tracking rồi sàng lọc ứng
      viên thăng cấp. Lượt chạy đầu tiên đạt F1 rất cao không phẩy tám tám nhưng thời gian phản hồi lên tới bốn mươi mi-li-giây
      nên bị loại thẳng tay do vượt trần hai mươi lăm. Chỉ lượt r hai đạt đủ cả điểm chất lượng lẫn giới hạn độ trễ mới được
      đưa lên hàng đợi kiểm chứng. Việc chọn lọc theo cả hai điều kiện cùng lúc ngăn chặn tình trạng hy sinh trải nghiệm tốc
      độ chỉ để lấy thêm vài phần nghìn điểm F1.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>staging_cands=1 promoted=r2</div></div>
    say: Đầu ra xác nhận có duy nhất một lượt đạt tiêu chuẩn kép và được gắn thẻ ứng viên lên môi trường chạy thử. Điều này
      giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Nhờ gán thẻ phiên bản ứng viên tự động ngay
      trong sổ đăng ký, đội ngũ biết chính xác tệp trọng số nào sẵn sàng cho thử nghiệm trực tuyến.
