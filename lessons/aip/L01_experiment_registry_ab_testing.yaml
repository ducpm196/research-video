- id: pitfalls
  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (nhìn lén dừng
      sớm p-hacking):</b> Kết thúc thử nghiệm A/B ngay lúc thấy p nhỏ hơn 0,05 ở mẫu nhỏ trước khi đủ cỡ mẫu kế hoạch.<br><b>Lỗi
      2 (ghi đè tệp latest):</b> Gắn thẻ ghi đè liên tục lên cùng tên <code>model_latest.bin</code> làm mất khả năng quay
      lui nhanh.<br><b>Lỗi 3 (bỏ qua trần latency):</b> Thăng cấp mô hình nặng chỉ vì tăng 0,2% F1 làm rớt SLA độ trễ toàn
      cổng API.</div></td></tr></table>
    say: Hãy lưu tâm ba lỗi thường làm sai lệch quá trình chọn lọc và triển khai mô hình AI. Lỗi đầu tiên là nhìn lén bảng
      đo mỗi giờ rồi dừng thử nghiệm sớm ngay khoảnh khắc nhóm B tạm vượt nhóm A một cách ngẫu nhiên. Lỗi thứ hai là xuất
      mô hình đè lên tên tệp duy nhất khiến việc phục hồi bản cũ tốn hàng giờ tìm kiếm. Lỗi thứ ba là quên gắn trần độ trễ
      tại bước kiểm duyệt Model Registry. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định khi lưu lượng
      tăng cao. Bên cạnh lỗi dừng thử nghiệm sớm, cần tránh chia nhóm lệch do lỗi múi giờ hoặc người dùng đổi thiết bị giữa
      chừng. Luôn ghi lại đầy đủ thông số phần cứng và phiên bản thư viện chạy kèm với từng bản ghi trong kho lưu trữ thí
      nghiệm.
