- id: sym
  kind: symbol
  title: Quy chuẩn và cấu trúc dữ liệu
  steps:
  - show: <table class='t'><tr><th>viết trong mã</th><th>ý nghĩa cài đặt</th></tr><tr><td><code>Intent + Slot Memory</code></td><td>Lưu
      ý định hiện hành và các tham số đã gom qua từng lượt hội thoại</td></tr><tr><td><code>Tool Allowlist &amp; Schema</code></td><td>Chỉ
      cho phép gọi tên công cụ nằm trong danh sách trắng với kiểu tham số hợp lệ</td></tr><tr><td><code>max_tool_steps</code></td><td>Ngưỡng
      bước gọi công cụ tối đa trong 1 phiên tránh vòng lặp vô hạn</td></tr></table>
    say: Bảng ký hiệu nêu ba chốt bảo vệ sống còn đối với các hệ thống NLP hội thoại và tác tử thông minh. Bộ nhớ ý định và
      khe thông tin giúp cuộc trò chuyện liền mạch tự nhiên mà không bắt khách hàng nhắc lại từ đầu. Danh sách trắng công
      cụ kết hợp kiểm định kiểu đầu vào ngăn triệt để lỗi gọi hàm nguy hiểm do bị điều khiển câu lệnh. Giới hạn bước tối đa
      giữ chi phí và thời gian xử lý trong tầm kiểm soát. Những quy chuẩn trên sẽ xuyên suốt từ phần chạy thực nghiệm mẫu
      tới bài tập thực hành cuối bài. Ba cấu trúc dữ liệu ngắn gọn gồm bộ nhớ khe, danh sách trắng công cụ và bộ đếm bước
      giải quyết hầu hết rủi ro triển khai thực tế. Tất cả luật kiểm tra đều nằm trong tầng mã ứng dụng độc lập hoàn toàn
      với mô hình ngôn ngữ lớn.
