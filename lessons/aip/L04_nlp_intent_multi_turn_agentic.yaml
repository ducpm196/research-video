    say: Sơ đồ đường ống tác tử an toàn đi từ bước phân tích ngôn ngữ tự nhiên tới lớp thực thi công cụ bên dưới. Ở tầng đầu,
      mô hình ghép thông tin lượt hiện tại với trạng thái tích lũy từ các lượt trước đó. Khi tác tử đề xuất gọi công cụ ngoài,
      bộ lọc trung gian kiểm đồng thời danh sách cho phép, lược đồ đối số và bộ đếm bước tối đa trước khi chạy thật.
