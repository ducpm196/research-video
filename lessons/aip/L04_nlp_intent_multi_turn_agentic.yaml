    say: 'Đáp án câu một: cần làm mới hoặc cô lập tập khe dữ liệu gắn với ý định cũ để tránh nhầm lẫn tham số giữa hai nghiệp
      vụ. Tách rạch ròi tập khe dữ liệu cho từng ý định ngăn hoàn toàn việc nhầm số tiền hay người nhận giữa các nghiệp vụ
      khác nhau.'
