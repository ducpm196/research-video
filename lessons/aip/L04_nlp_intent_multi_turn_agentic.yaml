- id: quymo
  kind: example
  title: Quy mô tải và điểm nghẽn vận hành
  checks:
  - 500 > 0 and 2 <= 5
  - 5 >= 3
  steps:
  - show: <table class='t'><tr><th>quy mô / bẫy</th><th>tác động</th><th>khuyến nghị kiến trúc</th></tr><tr><td>Hồ sơ ngoài
      có prompt injection</td><td>Cố ép tác tử gọi tool xuất dữ liệu</td><td>Áp Allowlist cứng theo quyền người dùng & chặn
      gọi hàm nhạy cảm</td></tr><tr><td>Công cụ trả lỗi không rõ nghĩa</td><td>Tác tử gọi đi gọi lại 30 vòng</td><td>Khoá
      max_steps nhỏ (3-6) & bắt buộc hỏi xác nhận người dùng</td></tr><tr><td>Người dùng đổi chủ đề đột ngột</td><td>Mang
      nhầm slot cũ sang ý định mới</td><td>Xoá sạch state.slots nếu nhận diện ra intent mới khác hẳn cũ</td></tr></table>
    say: Bảng vận hành tóm tắt cách xử lý đồng thời lỗi đổi chủ đề đột ngột và giới hạn vòng lặp suy luận tối đa trên hệ thống
      thực tế lớn. Nếu người dùng đang dở giao dịch chuyển tiền bỗng chuyển sang hỏi tỉ giá ngoại tệ. Bộ nhớ hội thoại phải
      biết làm sạch hoặc tách ngữ cảnh mới để không trộn nhầm tham số cũ. Ngoài ra khoá cứng giới hạn số bước công cụ tối
      đa trong mỗi lượt giúp chặn đứng mọi chi phí mất kiểm soát. Trên hệ thống phục vụ hàng trăm nghìn cuộc hội thoại, cô
      lập danh sách trắng theo quyền từng phiên người dùng là nguyên tắc bắt buộc. Không bao giờ trao quyền quản trị rộng
      cho một tác tử phục vụ khách hàng thông thường.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
