- id: example
  kind: example
  title: Chạy thật mô-đun cốt lõi
  checks:
  - 500 > 0 and 2 <= 5
  - 5 >= 3
  steps:
  - show: '<p><b>Thử nghiệm Python chạy thật</b></p><div class="code"><div>turns = [{''intent'': ''transfer'', ''slots'':
      {''to'': ''an''}}, {''slots'': {''amt'': 500}}]</div><div>state = {''intent'': None, ''slots'': {}}</div><div>req =
      {''to'', ''amt''}</div><div>for t in turns:</div><div>    if ''intent'' in t: state[''intent''] = t[''intent'']</div><div>    state[''slots''].update(t[''slots''])</div><div>ready
      = req &lt;= set(state[''slots''])</div><div>print(f''intent={state["intent"]} ready={int(ready)} slots={len(state["slots"])}'')</div></div>'
    say: Đoạn mã cài đặt bộ nhớ nhận diện ý định Intent và điền giá trị khe Slot qua hội thoại hai lượt liên tiếp. Ở lượt
      đầu tiên, khách hàng mới nêu ý định chuyển tiền kèm tên người nhận là An nên chưa đủ dữ liệu để thực thi ngay. Tới lượt
      thứ hai khách chỉ gõ mỗi số tiền năm trăm, bộ nhớ tự hợp nhất giữ nguyên ý định cũ vì đang theo dõi liên tục trong phiên.
      Nhờ cơ chế giữ nguyên ý định khi lượt sau chỉ bổ sung tham số mới, người dùng không cần lặp lại yêu cầu dài dòng từ
      đầu.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra chạy thật (Python)</b></p><div class="code"><div>intent=transfer ready=1 slots=2</div></div>
    say: Đầu ra chạy thật xác nhận ý định được bảo toàn là chuyển tiền và cờ sẵn sàng thực thi bật lên bằng một sau khi đủ
      hai khe dữ liệu. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Biến trạng thái rõ
      ràng cho phép kiểm thử toàn bộ luồng hội thoại nhiều lượt bằng bộ kiểm đơn vị thuần tốc độ cao.
    focus:
    - 1
    - 2
    - 2
