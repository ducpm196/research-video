- id: formula
  kind: formula
  title: Công thức và bất biến định lượng
  checks:
  - 500 > 0 and 2 <= 5
  - 5 >= 3
  steps:
  - show: <div class='box key'><p><b>1. Hợp nhất trạng thái hội thoại:</b> <code>state.slots.update(new_slots)</code>; sẵn
      sàng thực thi khi <code>required_slots &lt;= set(state.slots)</code>.</p><p><b>2. Rào chắn gọi công cụ:</b> <code>allow
      = (tool in ALLOWLIST) and schema_ok(args) and (steps &lt; max_steps)</code>.</p></div>
    say: 'Hai biểu thức định nghĩa chặt điều kiện chuyển tiếp trạng thái của một trợ lý AI đáng tin cậy. Bộ nhớ nhiều lượt
      chỉ cho phép kích hoạt nghiệp vụ khi tập các tham số bắt buộc đã được lấp đầy trọn vẹn qua các lượt trao đổi. Ở tầng
      thực thi, điều kiện cho phép đòi hỏi thoả mãn đồng thời cả ba chốt: tên hàm hợp lệ. Kiểu dữ liệu khớp lược đồ và bộ
      đếm vòng lặp còn dưới ngưỡng. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Khi ghép
      thêm quy tắc đếm giới hạn số bước tối đa cho mỗi lượt người dùng, rủi ro vòng lặp vô tận đốt cạn chi phí gọi mô hình
      được triệt tiêu. Chỉ khi mọi tham số bắt buộc hội tụ đầy đủ và hợp lệ, nút thực thi nghiệp vụ mới được mở khoá an toàn.'
