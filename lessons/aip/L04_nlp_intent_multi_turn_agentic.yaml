    say: 'Đáp án câu hai: vì mô hình vẫn có thể bị chèn lệnh làm chệch hướng, chỉ bộ lọc bằng mã cứng mới bảo vệ tuyệt đối
      hệ thống. Câu lệnh nhắc chỉ mang tính định hướng xác suất, còn danh sách trắng bằng mã cứng mới là hàng rào tất định.'
