- id: check
  kind: check
  title: Đối chứng kiểm thử độc lập
  checks:
  - 500 > 0 and 2 <= 5
  - 5 >= 3
  steps:
  - show: '<p><b>Phép kiểm chứng thứ hai</b></p><div class="code"><div>allow = {''check_bal'': int, ''transfer'': int}</div><div>calls = [(''check_bal'', 100), (''drop_db'', 1), (''transfer'', ''bad''), (''transfer'', 50), (''transfer'', 99)]</div><div>ok_cnt, blk_cnt = 0, 0</div><div>for tool, arg in calls:</div><div>    valid = isinstance(arg, allow.get(tool, ())) and arg &gt; 0</div><div>    if tool in allow and valid and ok_cnt &lt; 2:</div><div>        ok_cnt += 1</div><div>    else:</div><div>        blk_cnt += 1</div><div>print(f''executed={ok_cnt} blocked={blk_cnt}'')</div></div>'
    say: Phép kiểm chứng thứ hai kiểm thử danh sách trắng công cụ Allowlist kèm ràng buộc kiểu số nguyên dương cho tác tử Agentic AI. Đồng thời áp đặt giới hạn tối đa hai bước thực thi trên năm lệnh gọi liên tiếp. Lệnh đầu gọi đúng hàm và đối số dương nên được chạy qua. Lệnh hai gọi hàm lạ bị chặn theo danh sách trắng, lệnh ba truyền chuỗi sai kiểu bị chặn theo lược đồ. Lệnh bốn chạy hợp lệ nâng bộ đếm lên hai nên lệnh năm bị chặn do chạm trần số bước tối đa.
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra kiểm chứng</b></p><div class="code"><div>executed=2 blocked=3</div></div>
    say: Kết quả đối chứng xác nhận đúng hai lượt hợp lệ được chạy và ba lượt vi phạm an toàn, sai kiểu hoặc vượt trần bước bị chặn gọn. Điều này giữ nguyên bất biến tính toán vì phép đối chiếu bám sát định nghĩa gốc. Tách rạch ròi số lượt được chạy và
      số lượt bị chặn giúp đội vận hành theo dõi sát hành vi bất thường trên sản xuất.
    focus:
