scenes:
- id: hook
  kind: hook
  title: Hội thoại Intent/Slot và rào chắn Agentic AI
  checks:
  - 500 > 0 and 2 <= 5
  - 5 >= 3
  steps:
  - show: <div class='box key'><p>Hội thoại <b>2 lượt</b> giữ nguyên intent <code>transfer</code> để ghép đủ slot <code>to=an,
      amt=500</code>; bộ lọc <b>Agentic Guardrail</b> chặn tức thì công cụ lạ ngoài <b>Allowlist</b> và ngắt khi <code>step
      &gt; max_steps</code>.</p></div>
    say: Một tác tử AI thiếu rào chắn có thể bị kẻ tấn công gài đoạn văn ẩn trong hoá đơn hay hồ sơ. Mệnh lệnh ẩn đó ép tác
      tử xuất toàn bộ dữ liệu khách hàng qua công cụ gửi thư điện tử. Ngay cả khi không bị tấn công, một công cụ trả lỗi không
      rõ ràng cũng đủ khiến tác tử xoay vòng lặp lại hàng chục lượt đốt cạn ngân sách chỉ trong một phút.
    clear: true
  - show: <div class='box ok'><p><b>Mục tiêu hôm nay:</b> Cài bộ nhớ <b>Intent/Slot</b> nhiều lượt kèm màng lọc <b>Allowlist</b>
      và trần <code>max_steps</code>.</p></div>
    say: Hôm nay ta cài bộ điền khe hội thoại nhiều lượt kết hợp màng lọc allowlist và bộ đếm bước tối đa. Xây dựng tác tử
      AI hội thoại không chỉ là ghép câu lệnh nhắc mà là thiết kế máy trạng thái và rào chắn phân quyền chặt chẽ bằng mã.
      Hai lớp kiểm soát giúp trải nghiệm hội thoại tự nhiên liền mạch mà vẫn khoá chặt mọi hành vi ngoài ý muốn.
    clear: true
- id: prereq
  kind: prereq
  title: Ôn nền và kết nối kiến thức trước
  steps:
  - show: <table class='t'><tr><th>mảnh ghép nền</th><th>vai trò trong bài</th></tr><tr><td>Phân quyền và kiểm soát công cụ
      tác tử</td><td>Mọi lời gọi hàm ngoài từ AI đều phải xem là đầu vào không tin cậy cần kiểm tra quyền</td></tr><tr><td>Quản
      lý trạng thái phiên làm việc</td><td>Hội thoại nhiều lượt phải mang theo ngữ cảnh ý định và các tham số đã gom từ lượt
      trước</td></tr><tr><td>Chi phí mã thẻ Token và độ trễ vòng lặp</td><td>Mỗi vòng tác tử tự gọi sai lặp lại làm đội chi
      phí và làm chậm người dùng</td></tr></table>
    say: Khi xây dựng trợ lý AI cho ngân hàng hay tổng đài thông minh, người dùng hiếm khi nói đủ toàn bộ tham số trong chỉ
      một câu đơn lẻ. Họ có thể yêu cầu chuyển tiền ở lượt một rồi mới bổ sung tên người nhận và số tiền ở lượt hai. Nên hệ
      thống NLP hội thoại nhiều lượt bắt buộc phải bảo toàn ngữ cảnh ý định Intent và các khe thông tin Slot còn thiếu. Khi
      kết nối sang tác tử Agentic AI có quyền tự gọi công cụ tra cứu hay giao dịch. Rủi ro lớn nhất là chèn lệnh đánh lừa
      mô hình gọi nhầm công cụ ngoài danh mục cho phép hoặc kẹt vào vòng lặp vô tận. Bài học hôm nay trang bị đủ bộ quản lý
      hội thoại nhiều lượt và hai lớp rào chắn Agentic AI. Kết nối chặt chẽ các nền tảng này giúp giải pháp cài đặt gọn gàng
      và ổn định. Lưu trữ trạng thái ý định và các tham số đã thu thập qua nhiều lượt biến cuộc hội thoại rời rạc thành phiên
      giao dịch có ngữ cảnh. Danh sách cho phép kết hợp kiểm định kiểu đầu vào biến tác tử từ một công cụ khó lường thành
      thành phần phần mềm kiểm soát được.
