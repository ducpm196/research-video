- id: practice
  kind: practice
  title: Tự làm bài tập và chấm tự động
  lab: labs/AIP/L04
  steps:
  - show: <table class='t'><tr><th>Thực hành AIP:L04</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Nhiệm vụ</b></td><td>Cài bộ nhớ Intent/Slot nhiều lượt, bộ lọc Allowlist/Schema và giới hạn vòng lặp suy luận tối đa</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>turns=transfer:to=an;KEEP:amt=500;
      required_slots=to,amt; allow=check_bal,transfer max_steps=2 calls=check_bal:10,drop_db:1,transfer:abc,transfer:50,transfer:99</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh AIP L04 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự lập trình bộ quản lý trạng thái hội thoại nhiều lượt và màng lọc công cụ tác tử trên luồng chuẩn. Lưu
      ý xử lý đúng quy tắc đặt lại bộ nhớ khe thông tin khi đổi ý định mới và giữ bộ đếm bước tối đa thật chặt qua các ca
      kiểm ẩn. Đọc kỹ quy chuẩn đọc luồng vào chuẩn và giữ nguyên định dạng đầu ra trên từng dòng để đáp ứng đủ cả ca ẩn.
      Hãy đọc kỹ quy tắc khi gặp chỉ thị giữ nguyên ý định so với lúc người dùng chuyển hẳn sang ý định mới khác hoàn toàn.
      Bộ đếm bước công cụ tối đa cần kiểm trước khi thực hiện phép kiểm tra tham số hoặc ngay đầu vòng xét lời gọi.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.3'
    - '1.4'
    clear: true
    pause: 30
  - show: <table class='t'><tr><th>Gợi ý triển khai AIP:L04</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (chuyển intent)</b></td><td>Nếu <code>it != 'KEEP'</code> và <code>it != cur_intent</code> thì đổi <code>cur_intent</code>
      và đặt lại <code>slots = {}</code></td></tr><tr><td><b>Bước 2 (kiểm slots)</b></td><td>Kiểm tập con <code>set(required_slots)
      &lt;= set(slots)</code> sau lượt cuối</td></tr><tr><td><b>Bước 3 (guard công cụ)</b></td><td>Ép đồng thời <code>exec_cnt
      &lt; max_steps</code>, <code>tool in allow</code> và đối số là số nguyên dương <code>&gt; 0</code></td></tr></table>
    say: Gợi ý triển khai chỉ ra hai bẫy phân tích hay gặp ở các ca kiểm ẩn. Thứ nhất đừng quên khi gặp chỉ thị giữ nguyên
      ngữ cảnh ở lượt sau thì giữ tiếp các khe cũ. Còn nếu xuất hiện ý định khác hoàn toàn thì phải xoá trắng tập khe cũ trước
      khi nạp lượt mới. Thứ hai nhớ kiểm kiểu số nguyên dương bằng khối bắt ngoại lệ để chuỗi chữ không làm sập chương trình.
      Kiểm kỹ thứ tự điều kiện trong màng lọc công cụ để mọi lần vi phạm đều cộng đúng một vào bộ đếm bị chặn.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>final_intent=transfer slots_ready=1</div><div>executed_tools=2</div><div>blocked_tools=3</div></div>
    say: Đầu ra mẫu cho hai lượt hội thoại nối tiếp xác nhận giữ đúng ý định chuyển tiền đã đủ khe dữ liệu. Cho phép hai lượt
      gọi công cụ và chặn ba lượt vi phạm. Khi toàn bộ các dòng đầu ra đều khớp tuyệt đối với đáp án chuẩn và hai ca ẩn đều
      thông qua, bạn có thể an tâm lưu kết quả và chuyển tiếp. Các ca ẩn sẽ thử nhiều chuỗi hội thoại đổi ý định liên tục
      kèm các lời gọi công cụ giả mạo vượt trần bước.
