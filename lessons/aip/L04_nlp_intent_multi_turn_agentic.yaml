- id: pitfalls
  kind: pitfall
  title: Ba sai lầm kỹ thuật thường gặp
  steps:
  - show: <table class='t'><tr><th>cảnh báo lỗi thường gặp</th></tr><tr><td><div class='box warn'><b>Lỗi 1 (không reset slots
      khi đổi intent):</b> Người dùng chuyển từ xem lịch sử sang chuyển khoản mà vẫn mang nhầm tham số cũ.<br><b>Lỗi 2 (cho
      gọi tool theo chuỗi do mô hình ngôn ngữ lớn sinh):</b> Bọc bằng câu lệnh <code>eval()</code> hoặc thiếu kiểm Allowlist
      tạo lỗ hổng thực thi mã.<br><b>Lỗi 3 (vòng lặp không cận trên):</b> Viết vòng lặp <code>while not done:</code> không
      giới hạn bước chạy mãi cho tới khi hết hạn mức API.</div></td></tr></table>
    say: Hãy lưu tâm ba lỗi bảo mật và thiết kế hay gặp khi phát triển hệ thống hội thoại và tác tử thông minh. Lỗi thứ nhất
      là giữ nguyên các tham số cũ dù khách hàng đã chuyển hoàn toàn sang một ý định nghiệp vụ mới khác. Lỗi thứ hai là tin
      tưởng vào tên hàm và đối số do mô hình sinh ra mà không đối chiếu danh sách cho phép lẫn kiểu dữ liệu. Lỗi thứ ba là
      viết vòng lặp suy luận thiếu bộ đếm bước tối đa. Nhận diện sớm các lỗi cấu trúc này giúp hệ thống giữ vững tính ổn định
      khi lưu lượng tăng cao. Ngoài việc dọn sạch tham số khi đổi chủ đề, luôn kiểm tra giới hạn độ dài chuỗi đầu vào từ các
      văn bản bên ngoài đưa vào ngữ cảnh. Mọi ngoại lệ từ công cụ trả ngược lại cho tác tử cần có thông điệp gọn rõ để tránh
      tác tử thử sai lặp vô ích.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
