- id: quiz
  kind: quiz
  title: Kiểm tra nhanh trước khi tự thực hành
  checks:
  - 500 > 0 and 2 <= 5
  - 5 >= 3
  steps:
  - show: <ol><li>Khi người dùng chuyển hẳn từ ý định tra cứu sang ý định chuyển tiền ở lượt hai, bộ quản lý trạng thái cần
      làm gì với các slot cũ?</li><li>Tại sao phải kiểm cả Allowlist lẫn lược đồ kiểu đối số ngoài tầng code Python thay vì
      chỉ nhắc mô hình trong câu lệnh nhắc?</li></ol>
    say: Hãy kiểm tra kiến thức bài bốn qua hai câu hỏi thực tế. Câu một, nếu người dùng đổi sang ý định mới hoàn toàn ở lượt
      sau thì bộ nhớ khe dữ liệu cũ cần xử lý thế nào? Câu hai, tại sao không chỉ dặn dò mô hình trong câu lệnh nhắc mà phải
      kiểm Allowlist trong mã nguồn? Tạm dừng và tự trả lời. Hai câu hỏi này kiểm tra trực giác xử lý ngữ cảnh chuyển chủ
      đề và lý do bảo vệ ở tầng mã cứng.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
