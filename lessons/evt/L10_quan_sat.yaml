  reason: 'ASR chép “Vê chỉ bắt đầu khi cả hai đã xong nên kết quả cuối có mặt lúc 90.” (0.944): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người'
