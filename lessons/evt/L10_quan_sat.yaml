    - '2.3'
    - '2.3'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, là lấy mẫu dấu vết quá sớm. Dấu vết là bản ghi mọi bước của một đơn, gom lại theo mã tương quan. Để tiết kiệm chỗ lưu, họ lấy mẫu, tức chỉ giữ ngẫu nhiên 1 phần trăm dấu vết, và quyết định ngay lúc đơn mới bắt đầu. Với 100 nghìn đơn mỗi ngày, 1 phần trăm chậm là 1000 đơn, nhưng lấy mẫu 1 phần trăm thì chỉ giữ 1000 dấu vết. Trong đó, đơn chậm chỉ khoảng 10, nên lúc khách báo chậm thì gần như không có dấu vết để xem. Cách khác là quyết định khi đơn đã xong, giữ mọi đơn chậm cộng 1 phần trăm đơn còn lại. Ta giữ 1000 cộng 990, bằng 1990 dấu vết, chỉ gấp đôi chỗ lưu mà có đủ 1000 đơn chậm.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.e2e_latency([5, [15, 40, 25], 10, [8, 12]]) == 67 and max(15, 40, 25) == 40 and max(8, 12) == 12 and 5 + 40 + 10 + 12 == 67
  - alg.e2e_latency([5, [15, 20, 25], 10, [8, 12]]) == 52 and 67 - 52 == 15 and 40 - 20 == 20
  steps:
  - show: |
      <table class="t"><tr><th>câu</th><th>đề</th></tr>
      <tr><td>1</td><td>Chuỗi: 5 ms → song song 15, 40, 25 ms → 10 ms → song song 8, 12 ms. Độ trễ đầu–cuối?</td></tr>
      <tr><td>2</td><td>Muốn giảm độ trễ, sửa khâu nào trước?</td></tr></table>
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, chuỗi gồm 5 mi li giây, rồi song song 15, 40, và 25, rồi 10, rồi song song 8 và 12. Độ trễ đầu cuối là bao nhiêu? Câu hai, muốn giảm độ trễ thì sửa khâu nào trước? Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: |
      <table class="t"><tr><th>khâu</th><th>5</th><th>song song 15, 40, 25</th><th>10</th><th>song song 8, 12</th><th>tổng</th></tr>
      <tr><td>lấy</td><td>5</td><td>$\max = 40$</td><td>10</td><td>$\max = 12$</td><td>$\hl{67}$ ms</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.2'
    say: Đáp án câu một, đi từng khâu. Khâu đầu lấy 5, nhóm song song đầu lấy số lớn nhất là 40, khâu tiếp lấy 10, nhóm song song cuối lấy 12. Cộng lại, 5 cộng 40 cộng 10 cộng 12, bằng 67 mi li giây.
  - show: |
      <p>② Khâu 40 ms — đóng góp lớn nhất trên đường dài nhất. Thử: giảm nó từ 40 xuống 20 thì nhánh 25 ms thành lâu nhất, độ trễ còn $5 + 25 + 10 + 12 = 52$ ms — chỉ lợi $67 - 52 = 15$ ms dù khâu nhanh hơn 20 ms.</p>
    say: Câu hai, sửa khâu 40 mi li giây trước, vì nó đóng góp lớn nhất trên đường dài nhất. Thử giảm nó từ 40 xuống 20, lúc đó nhánh 25 mi li giây thành lâu nhất, độ trễ còn 5 cộng 25 cộng 10 cộng 12, bằng 52. Ta chỉ lợi 67 trừ 52, bằng 15 mi li giây, dù khâu đó nhanh hơn 20, vì đường dài nhất đã đổi sang nhánh khác.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/EVT/L10
  steps:
  - show: <table class='t'><tr><th>Thực hành EVT:L10</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/EVT/L10/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Đường găng trên đồ thị vết (DAG) có hai nhánh chạy song song</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>seq_ms=...<br/>critical_ms=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh EVT L10 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
    say: Bây giờ đến phần bạn tự thực hành và chấm thật trên máy. Hãy mở tệp đề bài, đọc kỹ dữ liệu vào cùng khuôn đầu ra cần in, tự viết chương trình rồi gõ lệnh dòng lệnh để tự chấm trước khi xem kết quả.
    focus:
    - '1.2'
    - '1.3'
    clear: true
    pause: 30
  - show: <p><b>Kết quả mong đợi cần khớp (2 dòng)</b></p><div class="code"><div>seq_ms=140</div><div>critical_ms=110</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>a, b = ...</code></td><td>Giải nén nhiều giá trị cùng lúc vào các tên biến tương ứng theo thứ tự</td></tr><tr><td><code>max(...)</code></td><td>Hàm/phương thức dựng sẵn thường dùng (sắp xếp, cực trị, ghép đôi, đánh chỉ số, làm tròn, lấy/thêm phần tử)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{ten_bien}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo để bạn tự đối chiếu cách viết.
    clear: true
  - show: <p><b>Lời giải tham khảo EVT:L10 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>a, b, c, d = 15, 30, 70, 25</div><div>seq = a + b + c + d</div><div>crit = a + max(b, c) + d</div><div>print(f'seq_ms={seq}')</div><div>print(f'critical_ms={crit}')</div></div>
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">mã tương quan chép vào mọi bước</span><span class="a">→</span>
      <span class="n">nối tiếp cộng, song song lấy lâu nhất</span><span class="a">→</span>
      <span class="n">đo từ lúc xảy ra, gồm cả thời gian chờ</span><span class="a">→</span>
      <span class="n">nhìn phân vị cao, không chỉ trung bình</span></div>
    say: Tổng kết lại, mã tương quan phải được chép vào mọi bước. Độ trễ nối tiếp thì cộng, song song thì lấy nhánh lâu nhất. Đo từ lúc sự kiện xảy ra, gồm cả thời gian chờ, và nhìn phân vị cao, không chỉ trung bình. Đồ thị không chu trình giúp xác định đúng đường găng quyết định độ trễ toàn đơn.
  - show: |
      <div class="box key"><b>Tư duy:</b> trong hệ không ai gọi ai trực tiếp, dấu vết là <b>thứ duy nhất</b> nối các mảnh thành một câu chuyện — hãy thiết kế nó từ ngày đầu.</div>
      <p class="note"><b>Hai mức quy mô:</b> dựng dấu vết theo một đơn lẻ [A → nhánh chậm nhất giữa B, C → D = 90 ms]; ở lưu lượng 100 000 đơn/ngày, chỉ lưu mẫu khoảng 1% cho trường hợp bình thường và lưu 100% các đơn chậm hoặc lỗi để tiết kiệm chi phí.</p>
    focus:
    - 1
    - 2
    - 2
    say: Điều cần mang theo, trong hệ không ai gọi ai trực tiếp, dấu vết là thứ duy nhất nối các mảnh thành một câu chuyện, nên hãy thiết kế nó từ ngày đầu. Xét hai mức quy mô, vẽ vết cho một đơn lẻ giúp thấy rõ nhánh song song dài 90 mi li giây. Trên 100 000 đơn mỗi ngày, ta chỉ lấy mẫu đơn thường và giữ trọn vẹn các đơn lỗi.
  - clear: true
    show: |
      <p class="note">Bài sau (bài 11): <b>tình huống chuyên gia theo dòng thời gian</b> — hệ nhật ký sự kiện Kafka, ra đời ở LinkedIn năm 2010, từ bài báo năm 2011 tới khi bỏ ZooKeeper.</p>
    forward_ref: true
    say: Ở bài sau, bài 11, ta đi lại hành trình của một hệ nhật ký sự kiện thật, ra đời năm 2010. Ta đi từ bài báo năm 2011 tới khi nó bỏ được dịch vụ điều phối bên ngoài mà nó từng phụ thuộc. Đi theo từng chặng, ta sẽ thấy mỗi thực hành tốt ra đời từ điểm nghẽn nào. Hẹn gặp lại bạn ở bài tiếp theo của khoá.
