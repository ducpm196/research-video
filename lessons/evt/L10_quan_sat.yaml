id: L10
course: EVT
series: "EVT · Kiến trúc hướng sự kiện"
title: "Bài 10 — Quan sát hệ hướng sự kiện: mã tương quan và độ trễ đầu–cuối"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/evt.yaml L10; audit/evt/verify_evt.py L10; W3C Trace Context (Khuyến nghị 2021); B. Sigelman và cộng sự, Dapper (Google, 2010); bài 6, bài 8"
assumes: [arith]
# Quy ước: mã tương quan = một mã sinh ở sự kiện đầu tiên và được chép vào MỌI sự kiện, lệnh và dòng nhật ký sinh ra từ nó. Độ trễ đầu–cuối của một chuỗi khâu =
#   tổng các khâu nối tiếp, với nhánh song song lấy nhánh LÂU NHẤT (alg.e2e_latency). Các mi li giây là SỐ MINH HOẠ.
objectives:
  - "Truyền mã tương quan qua mọi sự kiện"
  - "Tính độ trễ đầu–cuối của nhánh song song và nối tiếp"
  - "Đo độ trễ từ lúc sự kiện xảy ra, không từ lúc mỗi khâu nhận"
asr_reviewed:
  - {sentence: "Hình vẽ bốn dịch vụ A, B, C, D trên cùng một trục thời gian tính bằng mi li giây.", reason: "ASR chép “Hình vẽ bốn dịch vụ A, B, C, G trên cùng một trục thời gian tính bằng mili giây.” (0.872): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
  - {sentence: "D chỉ bắt đầu khi cả hai đã xong, nên kết quả cuối có mặt lúc 90.", reason: "ASR chép “Vê chỉ bắt đầu khi cả hai đã xong nên kết quả cuối có mặt lúc 90.” (0.944): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cộng tất cả là sai, ra 110 mi li giây.", reason: "ASR chép “Cộng tất cả là sai, ra 110 mili dây.” (0.783): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sáu dịch vụ, sáu dòng nhật ký không nối được"
    checks:
      - "alg.e2e_latency([10, [20, 50], 30]) == 90"
    steps:
      - show: |
          <p>Khách báo: “đơn 42 đặt lúc 9 giờ mà 9 giờ 20 mới có thư xác nhận”. Đơn đi qua 6 dịch vụ qua các sự kiện. Mỗi dịch vụ đều có nhật ký, mỗi dịch vụ đều báo “tôi xử lý trong vài mi li giây” — nhưng không ai nối được 6 dòng nhật ký đó thành một câu chuyện.</p>
          <div class="box key">Hôm nay: <b>mã tương quan</b> nối mọi bước, và cách tính <b>độ trễ đầu–cuối</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, khách báo rằng đơn 42 đặt lúc 9 giờ mà 9 giờ 20 mới có thư xác nhận. Đơn đi qua 6 dịch vụ qua các sự kiện. Mỗi dịch vụ đều có nhật ký, và đều báo tôi xử lý trong vài mi li giây, nhưng không ai nối được 6 dòng nhật ký đó thành một câu chuyện. Hôm nay ta học mã tương quan để nối mọi bước, và cách tính độ trễ đầu cuối."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: nối tiếp thì cộng, song song thì chờ người chậm nhất"
    checks:
      - "5 + 25 == 30 and max(15, 25) == 25 and 15 + 25 == 40"
    steps:
      - show: |
          <table class="t"><tr><th>hai việc</th><th>xong sau</th><th>vì sao</th></tr>
          <tr><td>nối tiếp: 5 phút, rồi mới tới 25 phút</td><td>$5 + 25 = 30$ phút</td><td>việc sau chờ việc trước</td></tr>
          <tr><td>song song: 15 phút và 25 phút, hai người làm</td><td>25 phút (không phải 40)</td><td>xong khi người chậm nhất xong</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn hai cách ghép thời gian. Hai việc nối tiếp, 5 phút rồi mới tới 25 phút, thì xong sau 5 cộng 25, bằng 30 phút, vì việc sau phải chờ việc trước. Hai việc song song, 15 phút và 25 phút do hai người làm cùng lúc, thì xong sau 25 phút chứ không phải 40, vì cả nhóm chỉ xong khi người chậm nhất xong."
      - show: |
          $$\max(15, 25) = 25$$
        introduces: [max_fn]
        say: "Kí hiệu trên màn hình nghĩa là lấy số lớn nhất trong ngoặc, đọc là số lớn nhất của 15 và 25, bằng 25. Đó chính là thời gian của hai nhánh song song."

  - id: sym
    kind: symbol
    title: "Giải mã: mã tương quan, mã nguyên nhân, độ trễ đầu–cuối"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>mã tương quan</b></td><td>sinh một lần ở sự kiện đầu, chép vào <b>mọi</b> sự kiện, lệnh, dòng nhật ký sinh ra sau đó</td></tr>
          <tr><td><b>mã nguyên nhân</b></td><td>mã của sự kiện trực tiếp gây ra sự kiện này — dựng lại được cây nhân quả</td></tr>
          <tr><td><b>độ trễ đầu–cuối</b></td><td>từ lúc sự kiện đầu <b>xảy ra</b> tới lúc kết quả cuối có mặt; nối tiếp thì cộng, song song thì lấy nhánh lâu nhất</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng có ba khái niệm. Mã tương quan được sinh một lần ở sự kiện đầu, và được chép vào mọi sự kiện, lệnh, và dòng nhật ký sinh ra sau đó. Mã nguyên nhân là mã của sự kiện trực tiếp gây ra sự kiện này, giúp dựng lại được cây nhân quả. Độ trễ đầu cuối tính từ lúc sự kiện đầu xảy ra tới lúc kết quả cuối có mặt, nối tiếp thì cộng, còn song song thì lấy nhánh lâu nhất."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ghép nhật ký thành một dòng thời gian"
    checks:
      - "10 + 20 == 30 and 10 + 50 == 60 and 60 + 30 == 90 == alg.e2e_latency([10, [20, 50], 30])"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><g font-size="21" fill="#1f2937"><text x="40" y="92">A</text><text x="40" y="152">B</text><text x="40" y="212">C</text><text x="40" y="272">D</text></g><rect x="200" y="60" width="110" height="44" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="255" y="90" font-size="21" text-anchor="middle" fill="#1f2937"></text><rect x="310" y="120" width="220" height="44" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="420" y="150" font-size="21" text-anchor="middle" fill="#1f2937">B 20</text><rect x="310" y="180" width="550" height="44" rx="6" fill="#fde7d9" stroke="#1f2937" stroke-width="2"/><text x="585" y="210" font-size="21" text-anchor="middle" fill="#1f2937">C 50</text><rect x="860" y="240" width="330" height="44" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="1025" y="270" font-size="21" text-anchor="middle" fill="#1f2937">D 30</text><line x1="530" y1="142" x2="860" y2="142" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6"/><text x="904" y="150" font-size="19" fill="#6b7280">B xong, chờ C</text><line x1="200" y1="330" x2="1410" y2="330" stroke="#6b7280" stroke-width="3"/><line x1="200" y1="330" x2="200" y2="345" stroke="#6b7280" stroke-width="2"/><text x="200" y="372" font-size="19" text-anchor="middle" fill="#1f2937">0</text><line x1="310" y1="330" x2="310" y2="345" stroke="#6b7280" stroke-width="2"/><text x="310" y="372" font-size="19" text-anchor="middle" fill="#1f2937">10</text><line x1="530" y1="330" x2="530" y2="345" stroke="#6b7280" stroke-width="2"/><text x="530" y="372" font-size="19" text-anchor="middle" fill="#1f2937">30</text><line x1="860" y1="330" x2="860" y2="345" stroke="#6b7280" stroke-width="2"/><text x="860" y="372" font-size="19" text-anchor="middle" fill="#1f2937">60</text><line x1="1190" y1="330" x2="1190" y2="345" stroke="#6b7280" stroke-width="2"/><text x="1190" y="372" font-size="19" text-anchor="middle" fill="#1f2937">90</text><line x1="1410" y1="330" x2="1410" y2="345" stroke="#6b7280" stroke-width="2"/><text x="1410" y="372" font-size="19" text-anchor="middle" fill="#1f2937">110</text><line x1="1190" y1="40" x2="1190" y2="325" stroke="#059669" stroke-width="3" stroke-dasharray="10 8"/><text x="1202" y="60" font-size="21" fill="#059669">xong lúc 90 ms</text><text x="322" y="90" font-size="19" fill="#1f2937">A 10 ms</text><text x="1424" y="337" font-size="19" fill="#1f2937">ms</text><text x="40" y="412" font-size="21" fill="#2a78d6">mọi khối ghi cùng mã tương quan “đơn 42”, nên nhật ký của 4 dịch vụ ghép được thành một dòng thời gian</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ bốn dịch vụ A, B, C, D trên cùng một trục thời gian tính bằng mi li giây. Ghép được như vậy là nhờ mọi dòng nhật ký đều mang cùng mã tương quan, đơn 42, nên chỉ cần lọc theo mã đó. A chạy từ 0 tới 10, rồi B và C cùng bắt đầu, B xong lúc 30 và phải đứng chờ, đường đứt nét màu xám, vì C tới 60 mới xong. D chỉ bắt đầu khi cả hai đã xong, nên kết quả cuối có mặt lúc 90."

  - id: example
    kind: example
    title: "A, rồi B và C song song, rồi D"
    checks:
      - "alg.e2e_latency([10, [20, 50], 30]) == 90 and 10 + 20 + 50 + 30 == 110"
    steps:
      - show: |
          <div class="chain"><span class="n">A: 10 ms</span><span class="a">→</span><span class="n">song song: B 20 ms, C 50 ms</span><span class="a">→</span><span class="n">D: 30 ms (chờ cả B và C)</span></div>
          <p><b>Bước 1</b> — A bắt đầu lúc 0, xong lúc <b>10</b> ms.</p>
        focus: [1, 2]
        say: "Sơ đồ có A mất 10 mi li giây, rồi B mất 20 và C mất 50 chạy song song, rồi D mất 30 và chờ cả B lẫn C. Bước một, A bắt đầu lúc 0 và xong lúc 10 mi li giây."
      - show: |
          <p><b>Bước 2</b> — B và C cùng bắt đầu lúc 10: B xong lúc $10 + 20 = 30$, C xong lúc $10 + 50 = 60$ ms.</p>
        say: "Bước hai, B và C cùng bắt đầu lúc 10. B xong lúc 10 cộng 20, bằng 30, còn C xong lúc 10 cộng 50, bằng 60 mi li giây."
      - show: |
          <p><b>Bước 3</b> — D chờ cả hai: bắt đầu lúc $\max(30, 60) = 60$, xong lúc $60 + 30 = \hl{90}$ ms. Gộp lại: $10 + \max(20, 50) + 30 = 90$.</p>
        say: "Bước ba, D phải chờ cả hai, nên bắt đầu lúc số lớn hơn trong 30 và 60, tức là 60, và xong lúc 60 cộng 30, bằng 90 mi li giây. Gộp lại thành một dòng, ta có 10 cộng số lớn nhất trong 20 và 50, cộng 30, bằng 90."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 4 — so cách tính</th><th>kết quả</th></tr>
          <tr><td>nối tiếp cộng, song song lấy lâu nhất</td><td>$\hl{90}$ ms</td></tr>
          <tr><td>cộng tất cả (sai)</td><td>$10 + 20 + 50 + 30 = 110$ ms</td></tr></table>
          <p>Muốn giảm độ trễ, sửa C — nhánh lâu nhất. Làm B nhanh hơn không đổi được gì.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước bốn, so hai cách tính. Nối tiếp thì cộng, song song thì lấy lâu nhất, ra 90 mi li giây. Cộng tất cả là sai, ra 110 mi li giây. Muốn giảm độ trễ thì sửa C, nhánh lâu nhất, còn làm B nhanh hơn không đổi được gì."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê mọi đường đi"
    checks:
      - "[10 + 20 + 30, 10 + 50 + 30] == [60, 90] and max(60, 90) == 90 == alg.e2e_latency([10, [20, 50], 30]) and alg.e2e_latency([10, [5, 50], 30]) == 90 and alg.e2e_latency([10, [20, 30], 30]) == 70"
    steps:
      - show: |
          <table class="t"><tr><th>đường đi từ A tới D</th><th>tổng</th></tr>
          <tr><td>A → B → D</td><td>$10 + 20 + 30 = 60$</td></tr>
          <tr><td>A → C → D</td><td>$10 + 50 + 30 = \hl{90}$ (dài nhất)</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, liệt kê mọi đường đi từ A tới D, vì kết quả cuối phải chờ đường dài nhất. Đường qua B dài 10 cộng 20 cộng 30, bằng 60. Đường qua C dài 10 cộng 50 cộng 30, bằng 90, là đường dài nhất, khớp kết quả 90."
      - show: |
          <table class="t"><tr><th>thử sửa</th><th>độ trễ mới</th></tr>
          <tr><td>B từ 20 xuống 5 ms</td><td>vẫn 90 ms</td></tr>
          <tr><td>C từ 50 xuống 30 ms</td><td>70 ms</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Thử sửa từng khâu để kiểm kết luận. Làm B nhanh từ 20 xuống 5 mi li giây, độ trễ vẫn 90, vì đường qua C không đổi. Làm C nhanh từ 50 xuống 30, cả hai đường đều còn 70, nên độ trễ giảm xuống 70."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "100000 // 100 == 1000 and 1000 // 100 == 10 and (100000 - 1000) // 100 == 990 and 1000 + 990 == 1990 and round(1990 / 1000) == 2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đo độ trễ từ lúc mỗi khâu nhận <b class="red">(bỏ qua thời gian nằm chờ trong hàng đợi)</b>
          <br><span class="note">Mỗi khâu xử lý 5 ms nhưng sự kiện chờ 20 phút trong hàng đợi (bài 8). Ghi thời điểm xảy ra vào sự kiện, đo từ đó tới kết quả cuối.</span></div>
        say: "Lỗi thứ nhất, đo độ trễ từ lúc mỗi khâu nhận, nên bỏ qua thời gian nằm chờ trong hàng đợi. Mỗi khâu xử lý 5 mi li giây, nhưng sự kiện có thể chờ 20 phút trong hàng đợi, như khi tồn đọng tăng. Hãy ghi thời điểm xảy ra vào sự kiện, và đo từ đó tới kết quả cuối."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Một dịch vụ quên chép mã tương quan <b class="red">(câu chuyện đứt ở giữa)</b>
          <br><span class="note">Chỉ một chỗ quên là mọi bước sau mất dấu. Đặt việc chép mã vào thư viện gửi và nhận chung, không để từng nhóm tự nhớ.</span></div>
        say: "Lỗi thứ hai, một dịch vụ quên chép mã tương quan, nên câu chuyện đứt ở giữa. Chỉ một chỗ quên là mọi bước sau mất dấu. Hãy đặt việc chép mã vào thư viện gửi và nhận dùng chung, đừng để từng nhóm tự nhớ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ nhìn độ trễ trung bình <b class="red">(khách chậm nhất bị giấu)</b>
          <br><span class="note">Trung bình 90 ms có thể giấu 1% khách chờ 20 phút. Theo dõi phân vị 99 và thời gian trễ của sự kiện cũ nhất.</span></div>
        say: "Lỗi thứ ba, chỉ nhìn độ trễ trung bình, nên khách chậm nhất bị giấu. Trung bình 90 mi li giây có thể giấu 1 phần trăm khách chờ 20 phút. Hãy theo dõi phân vị 99, và thời gian trễ của sự kiện cũ nhất."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Lấy mẫu dấu vết ngẫu nhiên 1% <b>ngay từ đầu</b> <b class="red">(đơn chậm hầu như không được giữ)</b></div>
          <table class="t"><tr><th>100 000 đơn mỗi ngày, 1% chậm = 1000 đơn</th><th>dấu vết giữ lại</th><th>trong đó đơn chậm</th></tr>
          <tr><td>quyết định giữ hay bỏ lúc đơn mới bắt đầu, 1%</td><td>1000</td><td>khoảng 10</td></tr>
          <tr><td>quyết định khi đơn đã xong: giữ mọi đơn chậm + 1% đơn còn lại</td><td>$1000 + 990 = 1990$</td><td>1000</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, để tiết kiệm chỗ lưu, họ lấy mẫu ngẫu nhiên 1 phần trăm dấu vết, và quyết định ngay lúc đơn mới bắt đầu. Với 100 nghìn đơn mỗi ngày, 1 phần trăm chậm là 1000 đơn, nhưng lấy mẫu 1 phần trăm thì chỉ giữ 1000 dấu vết. Trong đó, đơn chậm chỉ khoảng 10, nên lúc khách báo chậm thì gần như không có dấu vết để xem. Cách khác là quyết định khi đơn đã xong, giữ mọi đơn chậm cộng 1 phần trăm đơn còn lại. Ta giữ 1000 cộng 990, bằng 1990 dấu vết, chỉ gấp đôi chỗ lưu mà có đủ 1000 đơn chậm."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.e2e_latency([5, [15, 40, 25], 10, [8, 12]]) == 67 and max(15, 40, 25) == 40 and max(8, 12) == 12 and 5 + 40 + 10 + 12 == 67"
