</text><line x1="1410" y1="330" x2="1410" y2="345" stroke="#6b7280" stroke-width="2"/><text x="1410" y="372" font-size="19" text-anchor="middle" fill="#1f2937">110</text><line x1="1190" y1="40" x2="1190" y2="325" stroke="#059669" stroke-width="3" stroke-dasharray="10 8"/><text x="1202" y="60" font-size="21" fill="#059669">xong lúc 90 ms</text><text x="322" y="90" font-size="19" fill="#1f2937">A 10 ms</text><text x="1424" y="337" font-size="19" fill="#1f2937">ms</text><text x="40" y="412" font-size="21" fill="#2a78d6">mọi khối ghi cùng mã tương quan “đơn 42”, nên nhật ký của 4 dịch vụ ghép được thành một dòng thời gian</text></svg></div>
    focus:
