          <tr><td>bộ điều khiển đọc lại toàn bộ trạng thái từ ZooKeeper khi được bầu</td><td>3 nút bộ điều khiển chạy đồng thuận đa số (Raft) trên nhật ký siêu dữ liệu; bản theo là dự phòng nóng</td></tr>
          <tr><td>bộ điều khiển đẩy thay đổi</td><td>máy chủ <b>tự kéo</b> từ vị trí đã đọc, chỉ lấy phần thay đổi, theo đúng một thứ tự</td></tr>
          <tr><td>máy chủ mất liên lạc vẫn phục vụ</td><td>chưa có siêu dữ liệu mới thì bị <b>rào lại</b>, không trả lời khách</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Cách xử lý xuất phát từ một nhận xét, người dùng được hưởng lợi từ nhật ký, nhưng chính hệ lại bị bỏ ra ngoài. Vì vậy siêu dữ liệu được đưa vào một nhật ký sự kiện, giống cách gấp sự kiện ở bài 4. Ba nút bộ điều khiển chạy thuật toán đồng thuận theo đa số trên nhật ký đó, các bản theo là dự phòng nóng. Máy chủ tự kéo từ vị trí đã đọc, chỉ lấy phần thay đổi, theo đúng một thứ tự. Máy chủ chưa lấy được siêu dữ liệu mới thì bị rào lại, không trả lời khách."
      - clear: true
        show: |
          <table class="t"><tr><th>số nút bộ điều khiển</th><th>đa số cần còn sống</th><th>chịu được bao nhiêu nút hỏng</th></tr>
          <tr><td>3</td><td>$3 : 2$ lấy phần nguyên, cộng 1 $= 2$</td><td>$3 - 2 = \hlg{1}$</td></tr>
          <tr><td>4</td><td>$4 : 2 + 1 = 3$</td><td>$4 - 3 = 1$ — thêm nút mà không chịu thêm lỗi</td></tr>
          <tr><td>5</td><td>$5 : 2$ lấy phần nguyên, cộng 1 $= 3$</td><td>$5 - 3 = \hlg{2}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đề xuất ghi rằng 3 nút chịu được 1 nút hỏng, 5 nút chịu được 2, và ta tính lại được. Với 3 nút, 3 chia 2 lấy phần nguyên là 1, cộng 1 được đa số 2, nên chịu được 3 trừ 2 bằng 1 nút hỏng. Với 4 nút, đa số là 3, vẫn chỉ chịu được 1 nút hỏng, nên thêm nút mà không chịu thêm lỗi. Với 5 nút, đa số là 3, chịu được 2 nút hỏng."
      - clear: true
        show: |
          <p><b>Vì sao chỉ kéo phần thay đổi</b> (số minh hoạ): cụm có 1 000 000 bản ghi siêu dữ liệu; một máy chủ khởi động lại sau khi có 2 000 thay đổi.</p>
          <p>Kéo từ vị trí đã đọc: chỉ 2 000 bản ghi, bằng $1\,000\,000 : 2\,000 = \hlg{500}$ lần ít hơn đọc lại tất cả.</p>
        focus: [1, 2, 2]
        say: "Vì sao chỉ kéo phần thay đổi? Làm thử với số minh hoạ, cụm có 1 triệu bản ghi siêu dữ liệu, và một máy chủ khởi động lại sau khi có 2 nghìn thay đổi. Kéo từ vị trí đã đọc thì chỉ cần 2 nghìn bản ghi, ít hơn đọc lại tất cả 500 lần."

  # ───────────────────────── 9. CHẶNG 5 ─────────────────────────
