          <tr><td>10/2022 (bản 3.3)</td><td>sẵn sàng cho sản xuất, nhưng <b>chỉ với cụm mới</b>; vài tính năng còn thiếu</td></tr>
          <tr><td>6/2023 (bản 3.5)</td><td>ZooKeeper bị <b>đánh dấu lỗi thời</b>, hẹn gỡ ở bản 4.0</td></tr>
          <tr><td>10/2023 (bản 3.6)</td><td>lần đầu <b>chuyển cụm cũ</b> sẵn sàng cho sản xuất</td></tr>
          <tr><td>11/2024 (bản 3.9)</td><td>bản 3.x cuối cùng, là <b>cầu nối</b>; đã chuyển hàng nghìn cụm, sửa nhiều lỗi</td></tr>
          <tr><td>3/2025 (bản 4.0)</td><td>bản lớn đầu tiên <b>hoàn toàn không ZooKeeper</b></td></tr></table>
