scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ gần 1 tỉ tin mỗi ngày tới 800 tỉ tin mỗi ngày"
    checks:
      - "800 * 10**9 // 10**9 == 800 and 2025 - 2011 == 14"
    steps:
      - show: |
          <p>Năm <b>2011</b>, Kafka ở LinkedIn nhận <b>gần 1 tỉ tin</b> mỗi ngày. Năm <b>2015</b>, con số là <b>hơn 800 tỉ tin</b> mỗi ngày, trên hơn 1100 máy chủ.</p>
          <p>Năm <b>2025</b>, bản 4.0 chạy <b>hoàn toàn không cần ZooKeeper</b> — hệ điều phối đã đi cùng Kafka hơn 10 năm.</p>
          <div class="box key">Hôm nay: đi lại hành trình ấy qua năm chặng. Ở mỗi chặng, quy mô làm lộ ra một điểm nghẽn — và chuyên gia đã xử lý ra sao.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, năm 2011, hệ nhật ký sự kiện Kafka ở một mạng xã hội việc làm lớn nhận gần 1 tỉ tin mỗi ngày. Bốn năm sau, con số là hơn 800 tỉ tin mỗi ngày, trên hơn 1100 máy chủ. Năm 2025, bản 4 chấm 0 chạy hoàn toàn không cần dịch vụ điều phối bên ngoài, thứ đã đi cùng nó hơn mười năm. Hôm nay ta đi lại hành trình ấy qua năm chặng, xem mỗi quy mô làm lộ ra điểm nghẽn nào và chuyên gia xử lý ra sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều đã học"
    checks:
      - "1_000_000 // 1000 * 1000 == 1_000_000 and 1000 - 1 == 999"
      - "7 < 30"
      - "5 // 2 + 1 == 3 and 5 - 3 == 2"
    steps:
      - show: |
          <table class="t"><tr><th>đã học</th><th>điều cần nhớ</th><th>ví dụ số</th></tr>
          <tr><td>bài 2</td><td>người tiêu thụ <b>lũy đẳng</b>: nhớ mã tin đã xử lý, tin đến lần hai thì bỏ qua</td><td>tin số 42 đến 2 lần → chỉ tính 1 lần</td></tr>
          <tr><td>bài 4</td><td>trạng thái = <b>gấp</b> các sự kiện; ảnh chụp giới hạn số sự kiện phải phát lại</td><td>1 triệu sự kiện, chụp mỗi 1000 → phát lại tối đa 999</td></tr>
          <tr><td>bài 9</td><td>muốn tính lại thì nhật ký phải còn giữ dữ liệu cũ</td><td>giữ 7 ngày → không phát lại được 30 ngày</td></tr>
          <tr><td>khoá hệ phân tán</td><td>đồng thuận cần <b>đa số</b> nút còn sống</td><td>5 nút, đa số là 3 → chịu được 2 nút hỏng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều đã học. Ở bài 2, người tiêu thụ lũy đẳng nhớ mã tin đã xử lý, nên tin số 42 đến hai lần chỉ tính một lần. Ở bài 4, trạng thái là kết quả gấp các sự kiện, chụp ảnh mỗi 1000 sự kiện thì chỉ phải phát lại tối đa 999. Ở bài 9, nhật ký chỉ giữ 7 ngày thì không thể phát lại 30 ngày. Ở khoá hệ phân tán, đồng thuận cần đa số, nên 5 nút có đa số là 3 và chịu được 2 nút hỏng."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>máy chủ nhật ký</b> (broker)</td><td>máy lưu các phân vùng và trả tin cho người đọc</td></tr>
          <tr><td><b>vị trí</b> (offset)</td><td>số thứ tự của một tin trong nhật ký của một phân vùng</td></tr>
          <tr><td><b>siêu dữ liệu</b></td><td>dữ liệu về cụm: có chủ đề nào, phân vùng nào, bản sao ở đâu, ai đang dẫn</td></tr>
          <tr><td><b>bộ điều khiển</b></td><td>tiến trình quyết định và phát đi các thay đổi siêu dữ liệu</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Máy chủ nhật ký là máy lưu các phân vùng và trả tin cho người đọc. Vị trí là số thứ tự của một tin trong nhật ký của một phân vùng. Siêu dữ liệu là dữ liệu về chính cụm máy, như phân vùng nào, bản sao ở đâu, ai đang dẫn. Bộ điều khiển là tiến trình quyết định và phát đi các thay đổi siêu dữ liệu."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="150" cy="150" r="15" fill="#9ca3af"/><text x="150" y="108" font-weight="bold">2010 → 2011</text><text x="150" y="200">nhật ký ghi nối đuôi</text><text x="150" y="232">gần 1 tỉ tin mỗi ngày</text>
          <circle cx="490" cy="150" r="15" fill="#2a78d6"/><text x="490" y="108" font-weight="bold">2012 → 2015</text><text x="490" y="200">thêm bản sao</text><text x="490" y="232">mất máy không mất tin</text>
          <circle cx="830" cy="150" r="15" fill="#7c3aed"/><text x="830" y="108" font-weight="bold">2015</text><text x="830" y="200">800 tỉ tin mỗi ngày</text><text x="830" y="232">nhiều tầng, đếm kiểm</text>
          <circle cx="1170" cy="150" r="15" fill="#eb6834"/><text x="1170" y="108" font-weight="bold">2019</text><text x="1170" y="200">siêu dữ liệu</text><text x="1170" y="232">thành một nhật ký</text>
          <circle cx="1510" cy="150" r="15" fill="#059669"/><text x="1510" y="108" font-weight="bold">2021 → 2025</text><text x="1510" y="200">chuyển dần, có cầu nối</text><text x="1510" y="232">4.0: không ZooKeeper</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô lớn → điểm nghẽn mới → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Từ 2010 tới 2011, hệ ra đời như một nhật ký chỉ ghi nối đuôi. Từ 2012 tới 2015 nó có bản sao, rồi năm 2015 chạm 800 tỉ tin mỗi ngày. Năm 2019 có đề xuất đưa siêu dữ liệu vào chính nhật ký, và từ 2021 tới 2025 là giai đoạn chuyển dần, ổn định và tiếp tục phát triển."

  # ───────────────────────── 5. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2010 tới 2011 — khai sinh: một nhật ký chỉ ghi nối đuôi"
    stage: {year: "2010 → 2011", scale: "hàng trăm GB và gần 1 tỉ tin mỗi ngày; một cụm ở mỗi trung tâm dữ liệu", source: "[K11] §1–§5, [V15] §1", practice: "ghi nối đuôi và gộp lô; người đọc tự giữ vị trí và kéo theo sức mình; giữ theo thời gian để đọc lại"}
    checks:
      - "round(10**9 / 86400) == 11574"
      - "400_000 // 50_000 == 8"
      - "400_000 * 200 * 8 == 640_000_000 and 640_000_000 / 10**9 == 0.64"
    steps:
      - show: |
          <p><b>Quy mô:</b> năm 2011, hệ nhận hàng trăm GB, <b>gần 1 tỉ tin</b> mỗi ngày; ngoài phân tích ngoại tuyến, nhiều tính năng cần dữ liệu với độ trễ <b>không quá vài giây</b>.</p>
          <p><b>Điểm nghẽn:</b> hệ hàng đợi cũ gửi <b>mỗi tin một vòng mạng</b>, không gộp lô được; và chậm hẳn khi tin <b>dồn lại</b> chờ người đọc ngoại tuyến nạp theo đợt lớn.</p>
        focus: [1, 1, 2, 2]
        say: "Ở chặng một, năm 2011, hệ nhận hàng trăm GB, tức gần 1 tỉ tin mỗi ngày. Ngoài phân tích ngoại tuyến, nhiều tính năng cần dữ liệu với độ trễ không quá vài giây. Điểm nghẽn là hệ hàng đợi cũ gửi mỗi tin một vòng mạng, không gộp lô được. Chúng còn chậm hẳn khi tin dồn lại, chờ người đọc ngoại tuyến nạp theo từng đợt lớn."
