# Quy ước: “máy chủ nhật ký” = broker; “vị trí” = offset (số thứ tự của tin trong nhật ký một phân vùng); “bộ điều khiển” = controller;
#   “siêu dữ liệu” = danh sách chủ đề, phân vùng, bản sao, ai đang dẫn. Mọi sự kiện và con số có nguồn ở audit/evt/sources_L11.md;
#   con số khác là phép tính lại (checks, verify_evt.py L11) hoặc ghi “(số minh hoạ)”. Không nêu tên cá nhân trong lời đọc.
#   Tên sản phẩm KRaft, Raft, Hadoop chỉ trên màn hình; lời đọc: “chế độ tự quản siêu dữ liệu”, “thuật toán đồng thuận theo đa số”.
#   Kafka, LinkedIn, ZooKeeper: luật đọc ở tools/registry/lexicon_vi.EVT.yaml (probe audit/evt/probes/p1_hanh_trinh.md).
objectives:
  - "Kể lại hành trình của hệ nhật ký sự kiện Kafka qua năm chặng, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt của từng chặng: tin mỗi giây, số bản sao để chịu máy hỏng, số nút đa số, số ngày chuyển đổi"
  - "Chọn thực hành phù hợp với quy mô của chính mình, không chép quy mô của hệ thống khác"
