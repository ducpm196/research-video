          <p class="note">Mỗi ô là một tin, số trong ô là vị trí của nó (số minh hoạ). Máy chủ không nhớ ai đọc tới đâu; mỗi người đọc tự giữ vị trí của mình.</p>
        focus: [1, 1, 2]
        say: "Cách giải là mỗi phân vùng một nhật ký chỉ ghi nối đuôi, tin mới luôn vào cuối và được gọi bằng vị trí chứ không có mã riêng. Mỗi người đọc tự giữ vị trí và tự kéo tin theo sức mình, ở đây A ở vị trí 2, B ở vị trí 6. Máy chủ không nhớ ai đọc tới đâu, nên xoá tin theo thời gian, thường sau 7 ngày."
      - clear: true
        show: |
          <table class="t"><tr><th>lựa chọn năm 2011</th><th>được</th><th>đổi lại</th></tr>
          <tr><td>người đọc có thể <b>lùi về vị trí cũ</b></td><td>sửa lỗi xong thì đọc lại</td><td>máy chủ phải giữ tin nhiều ngày</td></tr>
          <tr><td>chỉ bảo đảm <b>ít nhất một lần</b>; thứ tự chỉ trong <b>một phân vùng</b></td><td>đơn giản, rẻ</td><td>người đọc tự lọc tin trùng</td></tr>
          <tr><td><b>chưa có bản sao</b></td><td>nhanh</td><td>hỏng đĩa là mất tin chưa đọc</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng ghi ba lựa chọn khác và cái giá của chúng. Người đọc có thể lùi về vị trí cũ để đọc lại sau khi sửa lỗi, đổi lại máy chủ phải giữ tin nhiều ngày. Hệ chỉ bảo đảm giao ít nhất một lần, thứ tự chỉ đúng trong một phân vùng, nên người đọc tự lọc tin trùng. Lúc đó chưa có bản sao, nên một máy hỏng đĩa là mất mọi tin chưa đọc."
      - clear: true
        show: |
          <table class="t"><tr><th>con số năm 2011</th><th>tính lại</th></tr>
          <tr><td>gần 1 tỉ tin mỗi ngày</td><td>$1\,000\,000\,000 : 86\,400 \approx \hlg{11\,574}$ tin mỗi giây, trung bình</td></tr>
          <tr><td>thử nghiệm: tin 200 byte, gộp 1 tin ↔ gộp 50 tin</td><td>50 000 ↔ 400 000 tin mỗi giây: $400\,000 : 50\,000 = \hlg{8}$ lần</td></tr>
          <tr><td>riêng phần nội dung, gộp 50 tin</td><td>$400\,000 \cdot 200 \cdot 8 = 640$ triệu bit mỗi giây, bằng $0{,}64$ đường truyền 1 tỉ bit mỗi giây</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.4"]
        say: "Giờ tính lại các con số. Gần 1 tỉ tin mỗi ngày chia cho 86 nghìn 400 giây, được khoảng 11 nghìn 574 tin mỗi giây trung bình. Trong thử nghiệm với tin 200 byte, gộp 50 tin một lần cho 400 nghìn tin mỗi giây, so với 50 nghìn khi gửi lẻ, tức gấp 8 lần. Riêng phần nội dung là 400 nghìn nhân 200 byte nhân 8 bit, bằng 640 triệu bit mỗi giây. Đó là 0 phẩy 64 của đường truyền 1 tỉ bit, và nhóm tác giả ghi là gần lấp đầy đường truyền."

  # ───────────────────────── 6. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2012 tới 2015 — tăng trưởng: thêm bản sao cho nhật ký"
    stage: {year: "2012 → 2015", scale: "dự án Apache cấp cao từ tháng 10/2012; hơn 300 triệu thành viên (2015); dùng làm kho gốc và xử lý luồng", source: "[V15] §1–§2, [K11] §3.3", practice: "sao chép mỗi phân vùng: một bản dẫn, các bản theo; tách bầu bản dẫn (đa số) khỏi việc chép dữ liệu (chính–phụ)"}
    checks:
      - "[f + 1 for f in (1, 2)] == [2, 3] and [2 * f + 1 for f in (1, 2)] == [3, 5]"
      - "1 * (1 + 1) == 2 and 1 * (2 * 1 + 1) == 3 and 3 - 2 == 1"
    steps:
      - show: |
          <p><b>Quy mô:</b> từ tháng 10/2012, Kafka là dự án Apache cấp cao, được dùng rộng rãi ngoài LinkedIn. Năm 2015, LinkedIn có hơn <b>300 triệu thành viên</b>, và nhật ký được dùng làm <b>kho gốc</b> cho dữ liệu, không chỉ để chở nhật ký truy cập.</p>
          <p><b>Điểm nghẽn:</b> bài báo năm 2011 tự ghi: máy chủ chết thì tin chưa đọc <b>không đọc được</b>; đĩa hỏng hẳn thì tin chưa đọc <b>mất vĩnh viễn</b>.</p>
        focus: [1, 1, 2, 2]
        say: "Ở chặng hai, từ tháng 10 năm 2012, hệ thành một dự án mã nguồn mở cấp cao và được dùng rộng rãi ngoài công ty nơi nó ra đời. Năm 2015, công ty đó có hơn 300 triệu thành viên, và nhật ký được dùng làm kho gốc cho dữ liệu, không chỉ chở nhật ký truy cập. Điểm nghẽn đã được chính bài báo năm 2011 ghi ra, máy chủ chết thì tin chưa đọc không đọc được. Còn nếu đĩa hỏng hẳn thì tin chưa đọc mất vĩnh viễn."
      - clear: true
        show: |
          <table class="t"><tr><th>cách xử lý (bản 0.8.0, theo bài tóm tắt năm 2015)</th><th>vì sao</th></tr>
          <tr><td>mỗi phân vùng có <b>một bản dẫn</b> và các <b>bản theo</b>; mọi lần ghi đi qua bản dẫn</td><td>một nơi quyết định thứ tự</td></tr>
          <tr><td><b>bầu bản dẫn</b> và giữ danh sách bản sao: giao cho ZooKeeper, chạy theo <b>đa số</b></td><td>quyết định cần đồng thuận</td></tr>
          <tr><td><b>chép dữ liệu</b>: kiểu chính–phụ, bản dẫn chờ <b>mọi bản đồng bộ</b> rồi mới xác nhận</td><td>cùng trung tâm dữ liệu, độ trễ ổn định → ít bản hơn</td></tr>
          <tr><td>người đọc chỉ thấy tin đã chép tới mọi bản đồng bộ</td><td>không đọc tin có thể bị mất</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Cách xử lý ở bản 0 chấm 8 chấm 0 được tóm tắt trong bảng. Mỗi phân vùng có một bản dẫn và các bản theo, mọi lần ghi đi qua bản dẫn. Việc bầu bản dẫn và giữ danh sách bản sao được giao cho một dịch vụ điều phối bên ngoài, chạy theo đa số. Việc chép dữ liệu theo kiểu chính phụ, bản dẫn chờ mọi bản đồng bộ rồi mới xác nhận. Người đọc chỉ thấy tin đã chép tới mọi bản đồng bộ."
      - clear: true
        show: |
          <p>Muốn chịu được $F$ máy hỏng mà không mất tin (bài tóm tắt năm 2015):</p>
          <table class="t"><tr><th>số máy hỏng chịu được</th><th>chính–phụ: $F + 1$ bản</th><th>đa số: $2F + 1$ bản</th></tr>
          <tr><td>$F = 1$</td><td>$1 + 1 = \hlg{2}$</td><td>$2 \cdot 1 + 1 = 3$</td></tr>
          <tr><td>$F = 2$</td><td>$2 + 1 = \hlg{3}$</td><td>$2 \cdot 2 + 1 = 5$</td></tr></table>
          <p class="note">Ví dụ nhóm tác giả nêu: nhật ký 2 bản, trong khi cụm ZooKeeper dùng 5 nút — số bản dữ liệu tách khỏi số nút cần cho đồng thuận.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Vì sao chọn chính phụ, khi gọi F là số máy hỏng muốn chịu được? Kiểu chính phụ cần F cộng 1 bản, nên với F bằng 1 chỉ cần 2 bản, còn kiểu đa số cần 2 nhân 1 cộng 1, bằng 3 bản. Với F bằng 2, đó là 3 bản so với 5 bản. Nhóm tác giả nêu ví dụ nhật ký 2 bản trong khi dịch vụ điều phối dùng 5 nút, vì số bản dữ liệu đã tách khỏi số nút đồng thuận."
      - clear: true
        show: |
          <p><b>Làm thử</b> (số minh hoạ): mỗi ngày ghi 1 TB, muốn chịu 1 máy hỏng.</p>
          <table class="t"><tr><th>cách chép</th><th>đĩa mỗi ngày</th></tr>
          <tr><td>chính–phụ, 2 bản</td><td>$1 \cdot 2 = \hlg{2}$ TB</td></tr>
          <tr><td>đa số, 3 bản</td><td>$1 \cdot 3 = 3$ TB — nhiều hơn $3 - 2 = 1$ TB mỗi ngày</td></tr></table>
          <p class="note">Điều kiện: cách chính–phụ hợp khi các bản ở <b>cùng một trung tâm dữ liệu</b>, độ trễ ít dao động — đúng lý do nhóm tác giả ghi.</p>
        focus: [1, "2.2", 3]
        say: "Làm thử với số minh hoạ, mỗi ngày ghi 1 nghìn GB và muốn chịu được 1 máy hỏng. Chép chính phụ 2 bản tốn 2 nghìn GB mỗi ngày, còn đa số 3 bản tốn 3 nghìn GB, nhiều hơn 1 nghìn GB. Cách chính phụ đúng khi các bản ở cùng một trung tâm dữ liệu, nơi độ trễ ít dao động."

