        focus: [1, "1.2", "1.3", "1.4"]
        say: "Ở chặng bốn, tháng 10 năm 2019, cộng đồng phát triển mở đề xuất số 500, ghi ra ba điểm nghẽn. Bộ điều khiển đẩy thay đổi tới từng máy chủ, có máy chỉ nhận một phần rồi thôi, nên các máy chủ lệch nhau. Trạng thái trong dịch vụ điều phối thường không khớp trạng thái trong bộ nhớ bộ điều khiển, có lúc chỉ khởi động lại mới hết lệch. Dịch vụ điều phối còn là hệ phân tán thứ hai với cấu hình riêng, nên dễ bật bảo mật ở một bên mà quên bên kia."
