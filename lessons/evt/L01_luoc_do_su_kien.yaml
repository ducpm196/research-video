id: L01
course: EVT
series: "EVT · Kiến trúc hướng sự kiện"
title: "Bài 1 — Lược đồ sự kiện và tiến hoá lược đồ: tương thích ngược, tương thích xuôi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/evt.yaml L01; audit/evt/verify_evt.py L01; đặc tả Apache Avro — quy tắc phân giải lược đồ; tài liệu Confluent Schema Registry — kiểu tương thích BACKWARD, FORWARD, FULL (bản hiện hành, tên sản phẩm chỉ trên màn hình); M. Kleppmann (2017), chương 4; bài 0"
assumes: [arith]
# Quy ước: lược đồ = {trường: mặc định hoặc BẮT BUỘC}; người nhận bỏ qua trường lạ, điền mặc định cho trường thiếu, hỏng khi thiếu trường bắt buộc (alg.read_event).
#   Tương thích NGƯỢC = người nhận lược đồ mới đọc được sự kiện cũ; tương thích XUÔI = người nhận lược đồ cũ đọc được sự kiện mới (alg.schema_compat).
objectives:
  - "Phân loại thay đổi lược đồ an toàn và phá vỡ"
  - "Phân biệt tương thích ngược và tương thích xuôi"
  - "Chọn thứ tự triển khai người gửi và người nhận"
asr_reviewed:
  - {sentence: "Chiều ngược, người nhận mới đọc sự kiện cũ thiếu ghi chú, thì tự điền rỗng, nên đọc được.", reason: "ASR chép “Chiều Ngư, người nhận mới đọc sự kiện của thiếu ghi chú, thì tự điên rộng nên đọc đưa.” (0.737): lệch âm/thanh thuần Việt: ngược/ngư, cũ/của, điền rỗng/điên rộng, được/đưa — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đáp án câu một, thêm kênh là trường tuỳ chọn có giá trị mặc định, ví dụ web, rồi thử từng chiều.", reason: "ASR chép “Đáp án câu 1, thêm kênh là trường tùy chọn có giá trị mặc định, ví dụ quét, rồi thử từng chiêu.” (0.909): web đọc thô (probe NET p2: 8/8), lần này ASR viết sai; lệch âm/thanh thuần Việt: chiều/chiêu — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một trường mới, dịch vụ thống kê hỏng lúc nửa đêm"
    checks:
      - "alg.schema_compat({'ma': alg.REQUIRED, 'tien': alg.REQUIRED}, {'ma': alg.REQUIRED, 'tien': alg.REQUIRED, 'kenh': alg.REQUIRED}) == (False, True)"
    steps:
      - show: |
          <p>Nhóm đặt hàng thêm trường bắt buộc “kênh bán” vào sự kiện “đơn đã được tạo” và triển khai lúc 11 giờ đêm. Dịch vụ thống kê đã cập nhật lược đồ mới từ chiều; đêm đó nó phát lại nhật ký của tuần trước và hỏng ngay: các sự kiện cũ <b>không có</b> trường đó.</p>
          <div class="box key">Hôm nay: <b>tiến hoá lược đồ</b> — thay đổi nào an toàn, theo chiều nào, và triển khai bên nào trước.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, nhóm đặt hàng thêm trường bắt buộc kênh bán vào sự kiện đơn đã được tạo, và triển khai lúc 11 giờ đêm. Dịch vụ thống kê đã cập nhật lược đồ mới từ chiều, và đêm đó hỏng ngay khi phát lại nhật ký của tuần trước, vì các sự kiện cũ không có trường đó. Hôm nay ta học tiến hoá lược đồ, thay đổi nào an toàn, theo chiều nào, và triển khai bên nào trước."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: người nhận đọc một sự kiện thế nào"
    checks:
      - "(lambda R: alg.read_event({'ma': 42, 'tien': 150000}, {'ma': R, 'tien': R, 'ghi_chu': ''}) == {'ma': 42, 'tien': 150000, 'ghi_chu': ''} and alg.read_event({'ma': 42, 'tien': 150000}, {'ma': R}) == {'ma': 42})(alg.REQUIRED)"
      - "(lambda R: alg.read_event({'ma': 42}, {'ma': R, 'tien': R}) is None)(alg.REQUIRED)"
    steps:
      - show: |
          <p>Ở bài 0: sự kiện là thông báo <b>điều đã xảy ra</b>; người gửi không biết ai đọc. <b>Nhật ký sự kiện</b> là dãy sự kiện ghi nối đuôi và giữ lại lâu; đọc lại nó từ đầu gọi là <b>phát lại</b>. Mỗi người nhận đọc sự kiện theo <b>lược đồ của mình</b>: danh sách trường, trường nào bắt buộc, trường nào có giá trị mặc định.</p>
          <table class="t"><tr><th>sự kiện đến</th><th>lược đồ người nhận</th><th>đọc được</th></tr>
          <tr><td>mã 42, tiền 150 000</td><td>mã, tiền bắt buộc; ghi chú mặc định rỗng</td><td>mã 42, tiền 150 000, ghi chú rỗng</td></tr>
          <tr><td>mã 42, tiền 150 000</td><td>chỉ cần mã</td><td>mã 42 (bỏ qua tiền)</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3"]
        say: "Trước hết, nhắc lại từ bài 0, sự kiện là thông báo điều đã xảy ra, và người gửi không biết ai đọc. Nhật ký sự kiện là dãy sự kiện được ghi nối đuôi nhau và giữ lại lâu, còn đọc lại nó từ đầu gọi là phát lại. Mỗi người nhận đọc sự kiện theo lược đồ của mình, gồm danh sách trường, trường nào bắt buộc, trường nào có giá trị mặc định. Bảng có hai ví dụ, cùng một sự kiện mã 42, tiền 150 nghìn. Người nhận cần mã, tiền, và ghi chú mặc định rỗng thì đọc được mã 42, tiền 150 nghìn, và tự điền ghi chú rỗng. Người nhận chỉ cần mã thì đọc mã 42, và bỏ qua trường tiền mà nó không biết."
      - show: |
          <div class="box warn">Sự kiện chỉ có mã 42, người nhận cần mã <b>và</b> tiền bắt buộc → thiếu trường bắt buộc, không có mặc định để điền → <b>đọc hỏng</b>.</div>
        say: "Trường hợp còn lại, sự kiện chỉ có mã 42, nhưng người nhận cần cả mã và tiền, đều bắt buộc. Thiếu trường bắt buộc mà không có mặc định để điền, nên người nhận đọc hỏng. Cả bài hôm nay chỉ dùng ba quy tắc này."

  - id: sym
    kind: symbol
    title: "Giải mã: hai chiều tương thích"
    steps:
      - show: |
          <table class="t"><tr><th>chiều</th><th>nghĩa</th><th>cần khi</th></tr>
          <tr><td><b>tương thích ngược</b></td><td>người nhận dùng lược đồ <b>mới</b> đọc được sự kiện <b>cũ</b></td><td>cập nhật người nhận trước; phát lại nhật ký cũ</td></tr>
          <tr><td><b>tương thích xuôi</b></td><td>người nhận dùng lược đồ <b>cũ</b> đọc được sự kiện <b>mới</b></td><td>cập nhật người gửi trước</td></tr>
          <tr><td><b>tương thích đầy đủ</b></td><td>cả hai chiều</td><td>không kiểm soát được thứ tự triển khai</td></tr></table>
          <p>Hai quy tắc đọc: <b>bỏ qua trường lạ</b>; <b>điền mặc định</b> cho trường thiếu — nếu trường đó có mặc định.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng có ba mức tương thích. Tương thích ngược nghĩa là người nhận dùng lược đồ mới đọc được sự kiện cũ, cần khi cập nhật người nhận trước, hoặc khi phát lại nhật ký cũ. Tương thích xuôi nghĩa là người nhận dùng lược đồ cũ đọc được sự kiện mới, cần khi cập nhật người gửi trước. Tương thích đầy đủ là cả hai chiều, cần khi không kiểm soát được thứ tự triển khai. Có hai quy tắc đọc, bỏ qua trường lạ, và điền giá trị mặc định cho trường thiếu, nếu trường đó có mặc định."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một nhật ký, hai bản lược đồ cùng sống"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arE1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="150" y="170" width="180" height="80" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="240" y="218" font-size="21" text-anchor="middle" fill="#1f2937">sự kiện bản 1</text><rect x="350" y="170" width="180" height="80" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="440" y="218" font-size="21" text-anchor="middle" fill="#1f2937">sự kiện bản 1</text><rect x="550" y="170" width="180" height="80" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="640" y="218" font-size="21" text-anchor="middle" fill="#1f2937">sự kiện bản 1</text><rect x="750" y="170" width="180" height="80" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="840" y="218" font-size="21" text-anchor="middle" fill="#1f2937">sự kiện bản 1</text><rect x="950" y="170" width="180" height="80" rx="8" fill="#fde7d9" stroke="#1f2937" stroke-width="2"/><text x="1040" y="218" font-size="21" text-anchor="middle" fill="#1f2937">sự kiện bản 2</text><rect x="1150" y="170" width="180" height="80" rx="8" fill="#fde7d9" stroke="#1f2937" stroke-width="2"/><text x="1240" y="218" font-size="21" text-anchor="middle" fill="#1f2937">sự kiện bản 2</text><g stroke-width="4" fill="none"><polyline points="150,150 150,130 930,130 930,150" stroke="#2a78d6"/><polyline points="950,270 950,290 1330,290 1330,270" stroke="#eb6834"/></g><g font-size="22" text-anchor="middle"><text x="540" y="70" fill="#2a78d6" font-weight="bold">người nhận MỚI (lược đồ bản 2) phát lại từ đầu</text><text x="540" y="110" fill="#2a78d6">đọc sự kiện bản 1: cần tương thích NGƯỢC</text><text x="1000" y="335" fill="#eb6834" font-weight="bold">người nhận CŨ (lược đồ bản 1) chưa cập nhật</text><text x="1000" y="370" fill="#eb6834">đọc sự kiện bản 2: cần tương thích XUÔI</text></g><line x1="150" y1="400" x2="560" y2="400" stroke="#1f2937" stroke-width="3" marker-end="url(#arE1)"/><text x="580" y="407" font-size="20" fill="#1f2937">nhật ký, theo thời gian</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ một nhật ký sự kiện, bốn ô xanh đầu viết theo lược đồ bản 1, hai ô cam sau viết theo lược đồ bản 2. Người nhận mới dùng lược đồ bản 2 mà phát lại từ đầu thì phải đọc các sự kiện bản 1, đó là tương thích ngược. Người nhận cũ chưa cập nhật vẫn dùng lược đồ bản 1, nhưng sự kiện bản 2 cứ thế đến, đó là tương thích xuôi. Trong một nhật ký giữ lâu, hai bản lược đồ luôn cùng sống một lúc."

  - id: example
    kind: example
    title: "Bốn thay đổi trên lược đồ “đơn đã được tạo”"
    checks:
      - "(lambda R: [alg.schema_compat({'ma': R, 'tien': R}, n) for n in ({'ma': R, 'tien': R, 'ghi_chu': ''}, {'ma': R, 'tien': R, 'kenh': R}, {'ma': R})])(alg.REQUIRED) == [(True, True), (False, True), (True, False)]"
      - "(lambda R: alg.schema_compat({'ma': R, 'tien': R, 'ghi_chu': ''}, {'ma': R, 'tien': R}))(alg.REQUIRED) == (True, True)"
    steps:
      - show: |
          <p><b>Bước 1 — thêm trường tuỳ chọn “ghi chú”</b> (mặc định rỗng). Lược đồ cũ: mã, tiền bắt buộc.</p>
          <table class="t"><tr><th>chiều</th><th>ai đọc gì</th><th>kết quả</th></tr>
          <tr><td>ngược</td><td>người nhận mới đọc sự kiện cũ (thiếu ghi chú)</td><td>điền rỗng — <b>được</b></td></tr>
          <tr><td>xuôi</td><td>người nhận cũ đọc sự kiện mới (thừa ghi chú)</td><td>bỏ qua — <b>được</b></td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước một, thêm trường tuỳ chọn ghi chú, mặc định rỗng, vào lược đồ cũ có mã và tiền bắt buộc. Chiều ngược, người nhận mới đọc sự kiện cũ thiếu ghi chú, thì tự điền rỗng, nên đọc được. Chiều xuôi, người nhận cũ đọc sự kiện mới thừa ghi chú, thì bỏ qua trường lạ, cũng đọc được."
      - show: |
          <p><b>Bước 2 — thêm trường bắt buộc “kênh”.</b> Ngược: người nhận mới đọc sự kiện cũ, thiếu “kênh”, không có mặc định → <b>hỏng</b>. Xuôi: người nhận cũ bỏ qua “kênh” → được.</p>
        say: "Bước hai, thêm trường bắt buộc kênh. Chiều ngược, người nhận mới đọc sự kiện cũ thiếu kênh, mà kênh không có mặc định, nên hỏng. Đây chính là chuyện lúc nửa đêm ở đầu bài. Chiều xuôi vẫn được, vì người nhận cũ bỏ qua trường kênh."
      - show: |
          <p><b>Bước 3 — xoá trường bắt buộc “tiền”.</b> Ngược: người nhận mới không cần “tiền”, bỏ qua nó → được. Xuôi: người nhận cũ vẫn cần “tiền”, sự kiện mới không có → <b>hỏng</b>.</p>
        say: "Bước ba, xoá trường bắt buộc tiền. Chiều ngược được, vì người nhận mới không cần tiền nên bỏ qua nó. Chiều xuôi hỏng, vì người nhận cũ vẫn cần tiền mà sự kiện mới không còn trường đó."
      - clear: true
        show: |
          <table class="t"><tr><th>thay đổi (lược đồ cũ: mã, tiền bắt buộc)</th><th>ngược</th><th>xuôi</th></tr>
          <tr><td>thêm trường <b>tuỳ chọn</b> “ghi chú” (mặc định rỗng)</td><td>có</td><td>có — $\hl{\text{an toàn cả hai chiều}}$</td></tr>
          <tr><td>thêm trường <b>bắt buộc</b> “kênh”</td><td><b>không</b> (sự kiện cũ thiếu)</td><td>có</td></tr>
          <tr><td>xoá trường bắt buộc “tiền”</td><td>có</td><td><b>không</b> (người nhận cũ cần nó)</td></tr>
          <tr><td>xoá trường tuỳ chọn “ghi chú”</td><td>có</td><td>có</td></tr></table>
          <p>Bước 4: chỉ thay đổi với trường tuỳ chọn có mặc định là an toàn mọi chiều.</p>
        focus: [1, "1.5", "1.5", 2]
        say: "Bước bốn, xoá trường tuỳ chọn ghi chú, rồi gom cả bốn thay đổi vào một bảng. Người nhận mới bỏ qua ghi chú trong sự kiện cũ, còn người nhận cũ thiếu ghi chú thì tự điền rỗng. Vì vậy xoá trường tuỳ chọn cũng an toàn cả hai chiều. Kết luận, chỉ thay đổi với trường tuỳ chọn có mặc định là an toàn mọi chiều."

  - id: check
    kind: check
    title: "Tự kiểm: một quy tắc đếm, thử trên 729 cặp lược đồ"
    checks:
      - "(lambda R, it: (lambda S: len(S) == 27 and len(S) ** 2 == 729 and all(alg.schema_compat(o, n) == (all(f in o for f in n if n[f] is R), all(f in n for f in o if o[f] is R)) for o in S for n in S))([{f: v for f, v in zip('abc', c) if v != 0} for c in it.product([0, '', R], repeat=3)]))(alg.REQUIRED, __import__('itertools'))"
      - "3 ** 3 == 27 and 27 * 27 == 729"
    steps:
      - show: |
          <table class="t"><tr><th>quy tắc đếm</th><th>hỏng khi</th></tr>
          <tr><td>ngược</td><td>lược đồ <b>mới</b> có trường bắt buộc mà lược đồ cũ <b>không có</b></td></tr>
          <tr><td>xuôi</td><td>lược đồ <b>cũ</b> có trường bắt buộc mà lược đồ mới <b>không có</b></td></tr></table>
        focus: [1, "1.2", "1.3", 0]
        say: "Kiểm bằng đường khác, thay vì chạy bộ đọc, ta chỉ đếm trường bắt buộc. Chiều ngược hỏng khi lược đồ mới có trường bắt buộc mà lược đồ cũ không có, như thêm kênh. Chiều xuôi hỏng khi lược đồ cũ có trường bắt buộc mà lược đồ mới không có, như xoá tiền. Áp vào bốn thay đổi, quy tắc cho đúng bảng của ví dụ."
      - show: |
          <table class="t"><tr><th>máy thử hết</th><th>số lượng</th></tr>
          <tr><td>3 trường, mỗi trường vắng, tuỳ chọn hoặc bắt buộc</td><td>$3^3 = 27$ lược đồ</td></tr>
          <tr><td>cặp (cũ, mới)</td><td>$27 \cdot 27 = \hl{729}$</td></tr>
          <tr><td>cặp mà quy tắc đếm khớp bộ đọc mô phỏng</td><td>cả 729 ✓</td></tr></table>
        introduces: [power, cdot]
        focus: ["1.2", "1.3", "1.4"]
        say: "Để chắc hơn, cho máy thử hết. Với 3 trường, mỗi trường có thể vắng, tuỳ chọn, hoặc bắt buộc, nên có 3 mũ 3 bằng 27 lược đồ, và 27 nhân 27 bằng 729 cặp lược đồ cũ và mới. Quy tắc đếm khớp với bộ đọc mô phỏng ở cả 729 cặp."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc và 1 lỗi người đi làm"
    checks:
      - "(lambda R: (lambda v1, v2, v3: alg.schema_compat(v1, v2)[0] and alg.schema_compat(v2, v3)[0] and not alg.schema_compat(v1, v3)[0])({'ma': R, 'tien': R}, {'ma': R, 'tien': R, 'kenh': 'web'}, {'ma': R, 'tien': R, 'kenh': R}))(alg.REQUIRED)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên nhật ký giữ sự kiện nhiều năm <b class="red">(người nhận mới không đọc được quá khứ)</b>
          <br><span class="note">Phát lại để dựng một bảng đọc mới sẽ đọc cả sự kiện năm năm trước. Mọi lược đồ mới phải tương thích ngược với <b>mọi</b> phiên bản còn trong nhật ký.</span></div>
        say: "Lỗi thứ nhất, quên rằng nhật ký giữ sự kiện nhiều năm, nên người nhận mới không đọc được quá khứ. Khi phát lại để dựng một bảng đọc mới, ta đọc cả sự kiện từ năm năm trước. Mọi lược đồ mới phải tương thích ngược với mọi phiên bản còn trong nhật ký."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đổi nghĩa mà giữ tên <b class="red">(máy kiểm lược đồ không bắt được)</b>
          <br><span class="note">“tiền” từng là chưa thuế, nay là đã thuế: kiểu dữ liệu y nguyên, kiểm lược đồ vẫn qua, mọi báo cáo sai. Đổi nghĩa thì đặt <b>tên mới</b>.</span></div>
        say: "Lỗi thứ hai, đổi nghĩa mà giữ tên, nên máy kiểm lược đồ không bắt được. Trường tiền từng là chưa thuế, nay là đã thuế, kiểu dữ liệu y nguyên, kiểm lược đồ vẫn qua, nhưng mọi báo cáo đều sai. Đổi nghĩa thì hãy đặt tên mới."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Không kiểm lược đồ khi ghi <b class="red">(rác vào nhật ký vĩnh viễn)</b>
          <br><span class="note">Người gửi phải kiểm sự kiện với lược đồ đã đăng ký <b>trước</b> khi ghi; <b>kho lược đồ</b> (dịch vụ lưu mọi phiên bản lược đồ đã đăng ký) từ chối phiên bản mới phá vỡ quy tắc tương thích đã chọn.</span></div>
        say: "Lỗi thứ ba, không kiểm lược đồ khi ghi, nên rác vào nhật ký vĩnh viễn. Người gửi phải kiểm sự kiện với lược đồ đã đăng ký trước khi ghi. Kho lược đồ, tức dịch vụ lưu mọi phiên bản lược đồ đã đăng ký, phải từ chối phiên bản mới nào phá vỡ quy tắc tương thích đã chọn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Kho lược đồ chỉ so với <b>bản liền trước</b> <b class="red">(từng bước đều qua, cả chuỗi thì hỏng)</b></div>
          <table class="t"><tr><th>bản</th><th>trường “kênh”</th><th>so với</th><th>tương thích ngược?</th></tr>
          <tr><td>1</td><td>chưa có</td><td></td><td></td></tr>
          <tr><td>2</td><td>tuỳ chọn, mặc định “web”</td><td>bản 1</td><td>có</td></tr>
          <tr><td>3</td><td>bắt buộc</td><td>bản 2</td><td>có (sự kiện bản 2 luôn ghi “kênh”)</td></tr>
          <tr><td>3</td><td>bắt buộc</td><td>bản 1</td><td><b class="red">không</b> — phát lại sự kiện bản 1 là hỏng</td></tr></table>
        focus: [1, "2.3", "2.4", "2.5", "2.5"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, kho lược đồ chỉ so bản mới với bản liền trước, nên từng bước đều qua mà cả chuỗi thì hỏng. Bản 2 thêm kênh là trường tuỳ chọn, mặc định web, so với bản 1 thì tương thích ngược. Bản 3 đổi kênh thành bắt buộc, so với bản 2 vẫn qua, vì mọi sự kiện bản 2 đều đã ghi kênh. Nhưng so với bản 1 thì không, và ngày phát lại nhật ký từ đầu, sự kiện bản 1 làm người nhận hỏng. Người làm nghề đặt kho lược đồ kiểm với mọi bản còn nằm trong nhật ký, không chỉ bản liền trước."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda R: alg.schema_compat({'ma': R, 'tien': R}, {'ma': R, 'tien': R, 'kenh': 'web'}))(alg.REQUIRED) == (True, True)"
      - "(lambda R: alg.read_event({'ma': 42, 'tien': 150000}, {'ma': R, 'tien': R, 'kenh': 'web'}) == {'ma': 42, 'tien': 150000, 'kenh': 'web'} and alg.read_event({'ma': 42, 'tien': 150000, 'kenh': 'di động'}, {'ma': R, 'tien': R}) == {'ma': 42, 'tien': 150000})(alg.REQUIRED)"
      - "(lambda R: alg.schema_compat({'ma': R, 'tien': R}, {'ma': R}) == (True, False))(alg.REQUIRED)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Muốn thêm “kênh” mà vẫn an toàn cả hai chiều, phải làm gì?</td></tr>
          <tr><td>2</td><td>Thay đổi chỉ tương thích ngược thì nên triển khai người gửi hay người nhận trước?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, muốn thêm trường kênh mà vẫn an toàn cả hai chiều thì phải làm gì? Câu hai, một thay đổi chỉ tương thích ngược thì nên triển khai người gửi hay người nhận trước? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Thêm “kênh” là trường <b>tuỳ chọn có mặc định</b> (ví dụ “web”). Thử từng chiều:</p>
          <table class="t"><tr><th>chiều</th><th>sự kiện</th><th>người nhận đọc được</th></tr>
          <tr><td>ngược</td><td>cũ: mã 42, tiền 150 000</td><td>mã 42, tiền 150 000, kênh “web” (điền mặc định)</td></tr>
          <tr><td>xuôi</td><td>mới: mã 42, tiền 150 000, kênh “di động”</td><td>mã 42, tiền 150 000 (bỏ qua kênh)</td></tr></table>
          <p>→ tương thích $\hl{\text{cả hai chiều}}$.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Đáp án câu một, thêm kênh là trường tuỳ chọn có giá trị mặc định, ví dụ web, rồi thử từng chiều. Chiều ngược, người nhận mới đọc sự kiện cũ có mã 42, tiền 150 nghìn, và tự điền kênh là web. Chiều xuôi, người nhận cũ đọc sự kiện mới có kênh di động, và chỉ việc bỏ qua trường kênh. Vậy tương thích cả hai chiều."
      - show: |
          <table class="t"><tr><th>thay đổi chỉ tương thích ngược, triển khai trước</th><th>trong lúc chờ bên kia</th><th>kết quả</th></tr>
          <tr><td>người gửi</td><td>người nhận cũ đọc sự kiện mới: cần xuôi</td><td><b class="red">hỏng</b></td></tr>
          <tr><td>$\hl{\text{người nhận}}$</td><td>người nhận mới đọc sự kiện cũ: cần ngược</td><td>được</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu hai, xét từng thứ tự. Nếu triển khai người gửi trước, người nhận cũ sẽ đọc sự kiện mới, việc đó cần tương thích xuôi, mà thay đổi này không có, nên hỏng. Nếu triển khai người nhận trước, người nhận mới đọc được cả sự kiện cũ lẫn mới nhờ tương thích ngược, rồi sau đó mới cho người gửi viết theo lược đồ mới."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bỏ qua trường lạ, điền mặc định</span><span class="a">→</span>
          <span class="n">thêm, xoá trường tuỳ chọn: an toàn</span><span class="a">→</span>
          <span class="n">ngược: người nhận trước; xuôi: người gửi trước</span><span class="a">→</span>
          <span class="n">đổi nghĩa thì đổi tên; kiểm lược đồ khi ghi</span></div>
        say: "Tổng kết lại, người nhận bỏ qua trường lạ và điền mặc định, nên thêm hay xoá trường tuỳ chọn là an toàn. Thay đổi tương thích ngược thì triển khai người nhận trước, tương thích xuôi thì người gửi trước. Đổi nghĩa thì đổi tên, và kiểm lược đồ khi ghi."
      - show: |
          <div class="box key"><b>Tư duy:</b> một sự kiện đã ghi sẽ được đọc bởi những chương trình <b>chưa được viết ra</b> — hãy viết cho cả họ.</div>
        say: "Điều cần mang theo, một sự kiện đã ghi sẽ được đọc bởi những chương trình chưa được viết ra, nên hãy viết cho cả họ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>người tiêu thụ lũy đẳng</b>, thử lại và kênh thư chết.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học người tiêu thụ lũy đẳng, thử lại, và kênh thư chết. Hẹn gặp bạn ở bài tiếp theo."
