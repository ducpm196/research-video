      tại: mỗi ngày tiến 1 ngày</text><text x="1299" y="160" fill="#059669">gặp nhau</text><text x="1299" y="188" fill="#059669">sau
      7,5 ngày</text><text x="160" y="385" fill="#b91c1c">ô đỏ: nhật ký chỉ giữ 7 ngày thì mọi thứ bên trái ô đỏ đã bị xoá</text><text
      x="1372" y="306" font-size="19">ngày</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ trục thời gian của dữ liệu, mốc 0 là lúc bắt đầu sửa. Mũi tên xanh là con trỏ phát lại, xuất phát từ dữ liệu
      30 ngày trước, mỗi ngày đọc được 5 ngày dữ liệu. Mũi tên cam là hiện tại, vẫn tiến đều mỗi ngày 1 ngày, nên con trỏ
      phải đuổi theo một đích đang chạy, và hai mũi tên gặp nhau sau 7 phẩy 5 ngày. Ô đỏ nhắc rằng nếu nhật ký chỉ giữ 7 ngày,
      phần bên trái ô đỏ đã bị xoá, và con trỏ không có chỗ để xuất phát. Thay vì giữ hai phiên bản công thức viết bằng hai
      ngôn ngữ cho lô và luồng, một dòng duy nhất phát lại xử hết.
- id: example
  kind: example
  title: Tính lại 30 ngày, phát lại nhanh gấp 5 lần
  checks:
  - 30 / 5 == 6 and alg.drain_seconds(30, 1, 5) == 7.5 and 7.5 * 5 == 37.5 == 30 + 7.5
  steps:
  - show: '<p><b>Bước 1 — riêng phần tồn.</b> Nếu dữ liệu mới dừng, chỉ xử lý 30 ngày cũ: $30 / 5 = 6$ ngày.</p>

      '
    say: Bước một, tính riêng phần tồn. Nếu dữ liệu mới dừng hẳn, chỉ cần xử lý 30 ngày cũ, mất 30 chia 5, bằng 6 ngày.
  - show: '<p><b>Bước 2 — tốc độ thu hẹp.</b> Mỗi ngày con trỏ tiến 5 ngày dữ liệu, hiện tại tiến 1 → khoảng cách giảm $5
      - 1 = 4$ ngày dữ liệu mỗi ngày.</p>

      '
    say: Bước hai, tính tốc độ thu hẹp khoảng cách. Mỗi ngày con trỏ tiến 5 ngày dữ liệu, nhưng hiện tại cũng tiến 1 ngày,
      nên khoảng cách chỉ giảm 5 trừ 1, bằng 4 ngày dữ liệu mỗi ngày.
  - show: '<p><b>Bước 3 — đuổi kịp hiện tại.</b> $30 / (5 - 1) = 30 / 4 = \hl{7{,}5}$ ngày. Giống công thức xả ở bài 8: tồn
      30 ngày, xử lý 5, đến 1.</p>

      '
    say: Bước ba, khoảng cách ban đầu là 30 ngày, mỗi ngày giảm 4, nên đuổi kịp hiện tại mất 30 chia cho 5 trừ 1, bằng 7 phẩy
      5 ngày. Đây giống công thức xả ở bài 8, với tồn 30 ngày, tốc độ xử lý 5, tốc độ đến 1.
  - clear: true
    show: '<table class="t"><tr><th>Bước 4 — kiểm lượng đã xử lý</th><th>tính</th></tr>

      <tr><td>con trỏ đọc trong 7,5 ngày</td><td>$7{,}5 \cdot 5 = 37{,}5$ ngày dữ liệu</td></tr>

      <tr><td>cần đọc: 30 ngày cũ + phần mới đến</td><td>$30 + 7{,}5 = 37{,}5$ ngày dữ liệu ✓</td></tr></table>

      <p>Trong 7,5 ngày đó, bản cũ vẫn chạy để bảng điều khiển không tắt; đuổi kịp rồi mới đổi sang bản mới.</p>

      <p class="note"><b>So sánh kiến trúc hai đường với một đường phát lại:</b> giữ hai nhánh lô và luồng riêng tốn công
      bảo trì hai bộ mã dễ lệch số, còn gom về một luồng kèm nhật ký giữ lại chỉ dùng một đường mã cho cả dữ liệu mới và phát
      lại.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 3
    say: Bước bốn, kiểm lượng đã xử lý. Trong 7 phẩy 5 ngày, con trỏ đọc được 7 phẩy 5 nhân 5, bằng 37 phẩy 5 ngày dữ liệu.
      Lượng cần đọc là 30 ngày cũ cộng 7 phẩy 5 ngày mới đến, cũng bằng 37 phẩy 5, khớp nhau. Trong 7 phẩy 5 ngày đó, bản
      cũ vẫn chạy để bảng điều khiển không tắt, và đuổi kịp rồi mới đổi sang bản mới. So sánh hai cách tổ chức, gộp về một
      luồng phát lại giúp tránh viết và đối chiếu hai bộ mã song song như kiến trúc hai nhánh.
- id: check
  kind: check
  title: 'Tự kiểm: theo dõi khoảng cách từng ngày'
  checks:
  - '[30 - 4 * d for d in range(8)] == [30, 26, 22, 18, 14, 10, 6, 2] and 30 - 4 * 7.5 == 0 and min(d / 2 for d in range(40)
    if (30 + d / 2) - 5 * (d / 2) <= 0) == 7.5'
  steps:
  - show: '<table class="t"><tr><th>ngày thứ</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>7,5</th></tr>

      <tr><td>khoảng cách (ngày dữ liệu)</td><td>30</td><td>26</td><td>22</td><td>18</td><td>14</td><td>10</td><td>6</td><td>2</td><td>$\hl{0}$</td></tr></table>

      <p class="note"><b>Chọn thời gian giữ nhật ký:</b> đặt hạn lưu lớn hơn cửa sổ sửa lỗi nghiệp vụ dài nhất cộng thêm thời
      gian phát lại và kiểm tra sai số, tránh xoá mất mốc đầu trước khi phát hiện hỏng.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    - '1.2'
    - 2
    say: Kiểm bằng đường khác, không dùng công thức, mà theo dõi khoảng cách giữa con trỏ và hiện tại sau từng ngày. Bắt đầu
      là 30, sau 1 ngày còn 26, rồi 22, 18, cứ mỗi ngày bớt 4. Tới ngày thứ 7 còn 2, và sau thêm nửa ngày thì về 0. Vậy đuổi
      kịp sau 7 phẩy 5 ngày, khớp kết quả, chứ không phải 6 ngày. Khi chọn thời gian giữ nhật ký, hãy đặt dài hơn quãng thời
      gian phát hiện lỗi cộng thời gian chạy lại hoàn tất.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc và 1 lỗi người đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nhật ký chỉ giữ 7 ngày <b class="red">(không phát lại được 30 ngày)</b>

      <br><span class="note">Thời gian giữ quyết định khả năng <b>sửa sai</b>. Giữ nhật ký ít nhất bằng khoảng lâu nhất cần
      tính lại, hoặc chép nhật ký sang kho lưu trữ rẻ để phát lại từ đó.</span></div>

      '
    say: Lỗi thứ nhất, nhật ký chỉ giữ 7 ngày, nên không phát lại được 30 ngày. Thời gian giữ quyết định khả năng sửa sai.
      Hãy giữ nhật ký ít nhất bằng khoảng lâu nhất cần tính lại, hoặc chép nhật ký sang kho lưu trữ rẻ để phát lại từ đó.
  - show: '<div class=''box warn''><b>Cô lập tác dụng phụ khi phát lại:</b> Chế độ phát lại chỉ dựng lại bảng đọc nội bộ,
      tuyệt đối khoá bước gửi thư hay trừ tiền ra ngoài.</div>

      '
    say: Gọi thẳng dịch vụ gửi thư điện tử hay trừ tiền khi chạy chế độ phát lại dữ liệu cũ sẽ gây thảm hoạ kép ngoài đời.
      Mọi bước phát lại bắt buộc phải tách biệt rõ ràng chế độ chỉ tái tạo bảng đọc nội bộ không phát tác dụng phụ. Thiết
      kế rõ chế độ chạy phát lại cô lập tác dụng phụ là quy tắc sống còn mọi dự án hướng sự kiện.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Tính thời gian đuổi kịp bằng tồn / $k$ <b class="red">(quên dữ liệu mới vẫn
      đến)</b>

      <br><span class="note">Với $k = 2$: tồn / 2 hứa “15 ngày” nhưng thực tế $30 / (2 - 1) = 30$ ngày. khi $k$ tiến gần 1
      từ phía trên thì hai cách tính lệch nhau rất lớn.</span></div>

      '
    say: Lỗi thứ hai, tính thời gian đuổi kịp bằng tồn chia k, mà quên rằng dữ liệu mới vẫn đến. Với k bằng 2, phép chia tồn
      cho 2 hứa 15 ngày, nhưng thực tế là 30 chia cho 2 trừ 1, bằng 30 ngày. Khi k tiến gần 1 từ phía trên thì hai cách tính
      lệch nhau rất lớn.
  - show: '<div class=''box warn''><b>Chính sách lưu trữ nhật ký dài:</b> Thời hạn giữ nhật ký quá ngắn làm mất dữ liệu gốc
      trước khi kịp phát hiện và phát lại để sửa lỗi.</div>

      '
    say: Thời gian lưu giữ nhật ký quá ngắn khiến dữ liệu gốc biến mất trước khi đội ngũ kịp phát hiện lỗi tính toán. Đặt
      chu kỳ lưu giữ nhật ký dài tối thiểu vài tháng mở ra không gian phát lại kiểm toán an toàn. Lưu giữ đầy đủ vết nhật
      ký lịch sử giúp đội phát triển yên tâm phát lại sửa lỗi bất kỳ lúc nào.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Phát lại kích hoạt tác dụng phụ <b class="red">(gửi lại thư của 30 ngày)</b>

      <br><span class="note">Bản phát lại chỉ ghi vào <b>bảng mới</b>; mọi việc ra bên ngoài như gửi thư hay gọi đối tác phải
      tắt khi phát lại.</span></div>

      '
    say: Lỗi thứ ba, phát lại kích hoạt tác dụng phụ, nên gửi lại thư của 30 ngày. Bản phát lại chỉ ghi vào bảng mới, và mọi
      việc ra bên ngoài như gửi thư hay gọi đối tác phải tắt khi phát lại. Phát lại dữ liệu lịch sử lên thẳng chủ đề sản xuất
      hiện hành có thể làm tắc nghẽn dữ liệu thời gian thực mới nhất. Tách chủ đề đọc phát lại sang kênh riêng tránh làm chậm
      dữ liệu thời gian thực của người dùng.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Hẹn giờ đổi sang bản mới theo “phần tồn xong sau 6 ngày”
      <b class="red">(bảng điều khiển lùi về quá khứ)</b></div>

      <table class="t"><tr><th>đổi sang bản mới sau</th><th>khoảng cách còn lại</th><th>bảng điều khiển hiện</th></tr>

      <tr><td>6 ngày (theo lịch hẹn)</td><td>$30 - 4 \cdot 6 = 6$ ngày dữ liệu</td><td>số liệu cũ 6 ngày</td></tr>

      <tr><td>7,5 ngày</td><td>$30 - 4 \cdot 7{,}5 = 0$</td><td>số liệu hiện tại</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.2'
    - '2.3'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, hẹn giờ đổi sang bản mới theo lịch, tính bằng phần tồn xong sau 6 ngày. Sau
      6 ngày, khoảng cách còn lại là 30 trừ 4 nhân 6, bằng 6 ngày dữ liệu, nên ngay sau khi đổi, bảng điều khiển hiện số liệu
      cũ 6 ngày, như lùi về quá khứ. Phải chờ tới 7 phẩy 5 ngày, khoảng cách mới về 0. Người làm nghề không đổi theo lịch
      hẹn, mà đo độ trễ thật của bản mới và chỉ đổi khi nó đã sát hiện tại.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.drain_seconds(14, 1, 3) == 7 and 14 / 3 < 7 and 3 - 1 == 2 and round(14 / 3, 1) == 4.7
  - all(3 * d >= d for d in range(8)) and [3 * d for d in (0, 1, 7)] == [0, 3, 21] and 3 * 7 == 14 + 7
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Cần tính lại 14 ngày, phát lại nhanh gấp 3 lần. Bao lâu đuổi kịp hiện tại?</td></tr>

      <tr><td>2</td><td>Nhật ký phải giữ tối thiểu bao lâu để làm được việc này?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, cần tính lại 14 ngày, phát lại nhanh gấp 3 lần, thì bao lâu đuổi kịp hiện tại?
      Câu hai, nhật ký phải giữ tối thiểu bao lâu để làm được việc này? Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Mỗi ngày khoảng cách giảm $3 - 1 = 2$ ngày dữ liệu → $14 / (3 - 1) = 14 / 2 = \hl{7}$ ngày (không phải $14
      / 3 \approx 4{,}7$).</p>

      '
    say: Đáp án câu một, mỗi ngày con trỏ tiến 3 ngày dữ liệu, hiện tại tiến 1, nên khoảng cách giảm 3 trừ 1, bằng 2 ngày
      dữ liệu mỗi ngày. Khoảng cách 14 ngày, nên đuổi kịp sau 14 chia 2, bằng 7 ngày, chứ không phải 14 chia 3, khoảng 4 phẩy
      7. Tính tổng dung lượng lưu giữ nhật ký bằng tốc độ ghi nhân trọn thời gian lưu giữ cộng dự phòng nén.
  - show: '<p>② Lúc bắt đầu, con trỏ phải đọc được dữ liệu 14 ngày trước → giữ ít nhất <b>14 ngày</b>. Sau đó mốc xoá chỉ
      tiến 1 ngày mỗi ngày, con trỏ tiến 3, nên không bị đuổi kịp:</p>

      <table class="t"><tr><th>ngày thứ</th><th>con trỏ đã đọc thêm</th><th>mốc xoá đã tiến</th></tr>

      <tr><td>0</td><td>0</td><td>0</td></tr><tr><td>1</td><td>3 ngày dữ liệu</td><td>1 ngày</td></tr><tr><td>7</td><td>21
      = 14 + 7 (đuổi kịp)</td><td>7 ngày</td></tr></table>

      <p>Cộng thêm một khoảng dự phòng cho lần chạy hỏng phải làm lại.</p>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.4'
    - 3
    say: Câu hai, lúc bắt đầu, con trỏ phải đọc được dữ liệu của 14 ngày trước, nên nhật ký phải giữ ít nhất 14 ngày. Sau
      đó, mốc xoá của nhật ký chỉ tiến 1 ngày mỗi ngày, còn con trỏ tiến 3, nên mốc xoá không bao giờ bắt kịp con trỏ. Bảng
      cho thấy sau 1 ngày, con trỏ đã đọc thêm 3 ngày dữ liệu, mốc xoá mới tiến 1 ngày. Sau 7 ngày, con trỏ đã đọc 21 ngày
      dữ liệu, đúng bằng 14 cộng 7, tức là đuổi kịp hiện tại. Nên cộng thêm một khoảng dự phòng, phòng khi lần chạy hỏng và
      phải làm lại.
