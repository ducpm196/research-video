  - show: <table class='t'><tr><th>Gợi ý triển khai EVT:L09</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (ước lượng thiếu dòng mới)</b></td><td>Chia thẳng số ngày lịch sử cho hệ số tốc độ đọc</td></tr><tr><td><b>Bước 2 (tốc
      độ đuổi ròng)</b></td><td>Trừ đi một đơn vị vì dữ liệu mới vẫn sinh thêm mỗi ngày</td></tr><tr><td><b>Bước 3 (thời gian
      đuổi kịp)</b></td><td>Chia số ngày lịch sử cho tốc độ đọc ròng để ra kết quả thật</td></tr></table>
    say: Gợi ý cài đặt bài số 9 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 2 dòng khớp định dạng. In đủ hai dòng so sánh số ngày
      ngây thơ với số ngày đuổi kịp thật làm tròn một chữ số thập phân.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (2 dòng)</b></p><div class="code"><div>naive_days=5.0</div><div>real_catchup_days=6.7</div></div>
    say: Màn hình hiện 2 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">hai đường: viết hai lần; một đường: phát lại</span><span class="a">→</span>

      <span class="n">đuổi kịp = tồn / (k − 1)</span><span class="a">→</span>

      <span class="n">giữ nhật ký ≥ khoảng cần tính lại</span><span class="a">→</span>

      <span class="n">phát lại vào bảng mới, tắt tác dụng phụ</span></div>

      '
    say: Tổng kết lại, cách hai đường phải viết phép tính hai lần, còn cách một đường thì phát lại. Thời gian đuổi kịp bằng
      tồn chia cho k trừ 1. Giữ nhật ký ít nhất bằng khoảng cần tính lại, phát lại vào bảng mới, và tắt mọi tác dụng phụ.
      Một đường nhật ký giữ đủ dài xoá bỏ nỗi ám ảnh viết trùng hai lần mã xử lý cho lô và luồng. Duy trì một đường mã duy
      nhất xử lý phát lại giúp triệt tiêu sai lệch logic giữa lô và luồng.
  - show: '<div class="box key"><b>Tư duy:</b> một hệ tốt không phải hệ không bao giờ sai, mà là hệ <b>tính lại được</b> khi
      đã sai.</div>

      <p class="note"><b>So sánh hai quy mô:</b> phát lại 14 ngày ở tốc độ 3x mất 7 ngày đuổi kịp; lên 30 ngày ở tốc độ 5x
      mất 7,5 ngày (bộ phận chỉ giữ nhật ký 7 ngày sẽ mất dữ liệu để sửa sai).</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Điều cần mang theo, một hệ tốt không phải hệ không bao giờ sai, mà là hệ tính lại được khi đã sai. Ở hai mức quy
      mô, chạy bù 14 ngày ở tốc độ gấp 3 mất 7 ngày đuổi kịp. Lên 30 ngày ở tốc độ gấp 5 cần 7 ngày rưỡi, vượt giới hạn nhật
      ký ngắn hạn nếu lưu quá ít ngày. Luôn bảo vệ mọi tác dụng phụ bên ngoài bằng cờ phát lại để tránh lặp lại hành động
      gửi thông báo ra ngoài. Đo sẵn dung lượng ổ lưu nhật ký định kỳ giúp dễ dàng lên ngân sách cho kế hoạch giữ lịch sử
      dài.
  - clear: true
    show: '<p class="note">Bài sau (bài 10): <b>quan sát</b> hệ hướng sự kiện — mã tương quan và độ trễ đầu–cuối.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 10, ta học cách quan sát hệ hướng sự kiện, với mã tương quan và độ trễ đầu cuối. Hẹn gặp bạn ở bài
      tiếp theo. Bài kế tiếp tập trung vào cách theo dõi dòng chảy phân mảnh qua hàng chục dịch vụ bằng vết tương quan.
