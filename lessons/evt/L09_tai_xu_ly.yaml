scenes:
- id: hook
  kind: hook
  title: Phép tính sai suốt 30 ngày
  checks:
  - alg.drain_seconds(30, 1, 5) == 7.5
  steps:
  - show: '<p>Nhóm dữ liệu phát hiện phép tính doanh thu theo vùng đã sai từ 30 ngày trước. Sửa mã thì dễ. Khó là: làm sao
      tính lại 30 ngày đã qua, trong khi dữ liệu hôm nay vẫn đổ vào và bảng điều khiển vẫn phải chạy?</p>

      <div class="box key">Hôm nay: <b>tái xử lý</b> — hai cách tổ chức, tính thời gian đuổi kịp, và cần giữ nhật ký bao lâu.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, nhóm dữ liệu phát hiện phép tính doanh thu theo vùng đã sai từ 30 ngày trước. Sửa mã thì dễ. Khó là làm
      sao tính lại 30 ngày đã qua, trong khi dữ liệu hôm nay vẫn đổ vào, và bảng điều khiển vẫn phải chạy. Hôm nay ta học
      tái xử lý, hai cách tổ chức, cách tính thời gian đuổi kịp, và cần giữ nhật ký bao lâu. Khi sửa một công thức tính điểm
      lỗi trong phần mềm, làm sao cập nhật lại hàng triệu dữ liệu đã qua? Khả năng phát lại luồng sự kiện biến việc sửa sai
      dữ liệu lịch sử thành quy trình lặp tự động sạch sẽ.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: lượng bằng tốc độ nhân thời gian, và công thức xả'
  checks:
  - 5 * 1 == 5 and 5 * 6 == 30 and 6 - 2 == 4 and alg.drain_seconds(100, 2, 6) == 25 and 25 * 6 == 150 == 100 + 25 * 2
  steps:
  - show: '<table class="t"><tr><th>phát lại nhanh gấp 5 lần</th><th>thời gian đồng hồ</th><th>lượng dữ liệu xử lý được</th></tr>

      <tr><td>chạy 1 ngày</td><td>1 ngày</td><td>$5 \cdot 1 = 5$ ngày dữ liệu</td></tr>

      <tr><td>chạy 6 ngày</td><td>6 ngày</td><td>$5 \cdot 6 = 30$ ngày dữ liệu</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Trước hết, ôn một phép tính quen thuộc, lượng bằng tốc độ nhân thời gian. Phát lại nhanh gấp 5 lần nghĩa là chạy
      1 ngày thì xử lý được 5 nhân 1, bằng 5 ngày dữ liệu. Chạy 6 ngày thì xử lý được 5 nhân 6, bằng 30 ngày dữ liệu. Đặt
      thời hạn lưu giữ nhật ký đủ dài mở khoá năng lực tua lại trạng thái chỉ bằng cách đặt lại con trỏ đọc.
  - show: '<p>Bài 8 tính thời gian <b>xả</b> hàng tồn khi dữ liệu vẫn đến: mỗi giây tồn giảm (tốc độ xử lý − tốc độ đến).</p>

      $$\text{tồn } 100, \text{ đến } 2/\text{s}, \text{ xử lý } 6/\text{s}: \quad \frac{100}{6 - 2} = \frac{100}{4} = 25
      \text{ s}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bài 8 đã tính thời gian xả hàng tồn khi dữ liệu vẫn đến. Mỗi giây, tồn giảm đúng bằng tốc độ xử lý trừ tốc độ đến.
      Ví dụ tồn 100 sự kiện, đến 2 mỗi giây, xử lý 6 mỗi giây, thì mỗi giây tồn giảm 4, nên xả hết sau 100 chia 4, bằng 25
      giây. Kiểm lại, trong 25 giây đã xử lý 150 sự kiện, đúng bằng 100 sự kiện tồn cộng 50 sự kiện mới đến.
- id: sym
  kind: symbol
  title: 'Giải mã: hai cách tổ chức tái xử lý'
  steps:
  - show: '<p><b>Xử lý lô</b>: gom dữ liệu đã có rồi chạy một lần trên cả khối (ví dụ mỗi đêm). <b>Xử lý luồng</b>: xử lý
      từng sự kiện ngay khi nó đến.</p>

      <table class="t"><tr><th>cách</th><th>làm gì</th><th>cái giá</th></tr>

      <tr><td><b>hai đường</b> (thường gọi kiến trúc Lambda)</td><td>đường lô tính lại toàn bộ định kỳ; đường luồng cho kết
      quả nhanh, tạm thời</td><td>một phép tính viết <b>hai lần</b>, hai bản dễ lệch nhau</td></tr>

      <tr><td><b>một đường phát lại</b> (thường gọi kiến trúc Kappa)</td><td>chỉ có xử lý luồng; sửa thì chạy bản mới từ đầu
      nhật ký, song song bản cũ, đuổi kịp rồi đổi</td><td>nhật ký phải giữ đủ lâu; phát lại tốn tài nguyên</td></tr></table>

      <p>Gọi $k$ là số lần phát lại nhanh hơn tốc độ dữ liệu đến.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    - 3
    - 3
    say: Trước hết, xử lý lô là gom dữ liệu đã có rồi chạy một lần trên cả khối, ví dụ mỗi đêm. Còn xử lý luồng là xử lý từng
      sự kiện ngay khi nó đến. Bảng so hai cách tổ chức tái xử lý. Cách hai đường có đường lô tính lại toàn bộ định kỳ, và
      đường luồng cho kết quả nhanh nhưng tạm thời, cái giá là một phép tính viết hai lần, và hai bản dễ lệch nhau. Cách một
      đường phát lại chỉ có xử lý luồng, sửa thì chạy bản mới từ đầu nhật ký, song song với bản cũ, đuổi kịp rồi mới đổi.
      Cái giá của cách này là nhật ký phải giữ đủ lâu, và phát lại tốn tài nguyên. Gọi k là số lần phát lại nhanh hơn tốc
      độ dữ liệu đến. So sánh hai kiến trúc hai đường riêng biệt với một đường lưu gốc phát lại cho thấy lợi ích bảo trì mã.
