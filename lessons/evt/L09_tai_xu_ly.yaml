      thời gian giữ nhật ký theo khoảng cần tái xử lý</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>hist_days=20.0 speed=4.0</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh EVT L09 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 9 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Đọc số ngày dữ liệu lịch sử cần phát lại và hệ số tốc
      độ xử lý lại so với tốc độ mới sinh từ luồng chuẩn. Tính song song ước lượng ngây thơ bỏ qua dữ liệu mới và thời gian
      đuổi kịp thực tế khi tốc độ hiệu dụng giảm đi một.
    clear: true
    pause: 30
