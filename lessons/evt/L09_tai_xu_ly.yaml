          <table class="t"><tr><th>ngày thứ</th><th>con trỏ đã đọc thêm</th><th>mốc xoá đã tiến</th></tr>
          <tr><td>0</td><td>0</td><td>0</td></tr><tr><td>1</td><td>3 ngày dữ liệu</td><td>1 ngày</td></tr><tr><td>7</td><td>21 = 14 + 7 (đuổi kịp)</td><td>7 ngày</td></tr></table>
          <p>Cộng thêm một khoảng dự phòng cho lần chạy hỏng phải làm lại.</p>
        focus: [1, 1, "2.2", "2.4", 3]
        say: "Câu hai, lúc bắt đầu, con trỏ phải đọc được dữ liệu của 14 ngày trước, nên nhật ký phải giữ ít nhất 14 ngày. Sau đó, mốc xoá của nhật ký chỉ tiến 1 ngày mỗi ngày, còn con trỏ tiến 3, nên mốc xoá không bao giờ bắt kịp con trỏ. Bảng cho thấy sau 1 ngày, con trỏ đã đọc thêm 3 ngày dữ liệu, mốc xoá mới tiến 1 ngày. Sau 7 ngày, con trỏ đã đọc 21 ngày dữ liệu, đúng bằng 14 cộng 7, tức là đuổi kịp hiện tại. Nên cộng thêm một khoảng dự phòng, phòng khi lần chạy hỏng và phải làm lại."

