title: 'Bài 9 — Tái xử lý: hai đường lô và luồng, một đường phát lại, và thời gian giữ nhật ký'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/evt.yaml L09; audit/evt/verify_evt.py L09; N. Marz, J. Warren, Big Data (2015) — kiến trúc Lambda (tên
  chỉ trên màn hình); J. Kreps, Questioning the Lambda Architecture (2014) — kiến trúc Kappa (tên chỉ trên màn hình); bài
  4, bài 8
