    clear: true
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">thứ tự chỉ có trong một phân vùng</span><span class="a">→</span>
      <span class="n">khoá phân vùng = thứ tự cần giữ</span><span class="a">→</span>
      <span class="n">thử lại vẫn làm bản cũ đến muộn</span><span class="a">→</span>
      <span class="n">phiên bản theo khoá: chỉ nhận số lớn hơn</span></div>
    say: Tổng kết lại, thứ tự chỉ có trong một phân vùng, nên chọn khoá phân vùng theo thứ tự cần giữ. Thử lại vẫn có thể làm bản cũ đến muộn, nên dùng phiên bản theo khoá, và chỉ nhận số lớn hơn. Nhờ gắn số phiên bản cùng đồng bộ thời gian mạng, hệ thống không tin mù vào thứ tự gói tin đến sau.
  - show: |
      <div class="box key"><b>Tư duy:</b> đừng tin thứ tự đến — hãy để <b>dữ liệu tự mang</b> thứ tự của nó.</div>
      <p class="note"><b>Hai mức quy mô:</b> hệ nhỏ 100 đơn/phút dùng 1 phân vùng còn gánh nổi thứ tự toàn cục; lên 6 000+ đơn/phút phải tách 6–64 phân vùng theo khoá và lưu phiên bản $v$ cùng dòng dữ liệu để chặn bản cũ ngay cả khi khởi động lại.</p>
