  - show: <p><b>Kết quả mong đợi cần khớp (2 dòng)</b></p><div class="code"><div>final_ver=5</div><div>final_city=DN</div></div>
    say: Đây là kết quả mong đợi khi chạy đúng bài làm, dùng để bạn đối chiếu từng dòng trên máy của mình.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>for a, b in ds:</code></td><td>Giải nén nhiều giá trị cùng lúc vào các tên biến tương ứng theo thứ tự</td></tr><tr><td><code>[a, b, ...]</code></td><td>Danh sách nhiều phần tử theo thứ tự (lấy phần tử thứ <code>i</code> bằng <code>ds[i]</code>, đếm từ <code>0</code>)</td></tr><tr><td><code>(a, b) / tuple(...)</code></td><td>Bộ giá trị cố định đóng gói theo thứ tự (không thay đổi sau khi tạo)</td></tr><tr><td><code>&lt; / &lt;= / &gt; / &gt;=</code></td><td>So sánh hai vế, kiểm tra rỗng bằng <code>is None</code> hoặc kẹp khoảng trả về Đúng/Sai</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 1) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>f&quot;...{ten_bien}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
    say: Bảng này giải thích từng ký hiệu dùng trong lời giải tham khảo (phần 2) để bạn tự đối chiếu cách viết.
    clear: true
  - show: <p><b>Lời giải tham khảo EVT:L03 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>cur_ver, cur_city = 0, ''</div><div>for ver, city in [(2, 'HN'), (5, 'DN'), (3, 'HCM')]:</div><div>    if ver &gt; cur_ver:</div><div>        cur_ver, cur_city = ver, city</div><div>print(f'final_ver={cur_ver}')</div><div>print(f'final_city={cur_city}')</div></div>
