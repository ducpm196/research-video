id: L03
course: EVT
series: "EVT · Kiến trúc hướng sự kiện"
title: "Bài 3 — Thứ tự và trùng lặp: phân vùng theo khoá, phiên bản theo khoá"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/evt.yaml L03; audit/evt/verify_evt.py L03; M. Kleppmann (2017), chương 11 — thứ tự trong nhật ký phân vùng; J. Kreps, The Log (2013); bài 2"
assumes: [arith, ltgt]
# Quy ước: nhật ký chỉ giữ thứ tự TRONG một phân vùng; cùng khoá → cùng phân vùng → giữ thứ tự theo khoá. Nhưng thử lại, nhiều người gửi, hay phát lại vẫn có thể
#   làm bản cũ đến sau bản mới. Bảo vệ bằng phiên bản: chỉ nhận cập nhật có phiên bản LỚN HƠN bản đang giữ (alg.apply_versioned). Thứ tự đến 1, 3, 2 là SỐ MINH HOẠ.
objectives:
  - "Biết nhật ký chỉ giữ thứ tự trong một phân vùng"
  - "Chọn khoá phân vùng để giữ thứ tự cần thiết"
  - "Chặn bản cũ ghi đè bản mới bằng phiên bản theo khoá"
asr_reviewed:
  - {sentence: "Bản v bằng 1, giá trị W, có 1 không lớn hơn 2 nên bỏ, trong khi ghi đè mù đổi sang W.", reason: "ASR chép “Bản V bằng 1, giá trị V đúc có 1 không lớn hơn 2 nên bỏ trong khi ghi đề mù đổi sang V đúc.” (0.833): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: đè/đề — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hai máy lệch nhau vài trăm mi li giây là thường, nên bản mới viết trên máy chậm đồng hồ trông cũ hơn.", reason: "ASR chép “Hai máy lệch nhau vài trăm mili dây là thường, nền bản mới viết trên máy chậm đồng hồ trong củ hơn.” (0.756): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: nên/nền, trông cũ/trong củ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, cập nhật đến theo thứ tự v bằng 2, 1, 4, 3, với giá trị X, W, Z, Y.", reason: "ASR chép “Câu 1, cập nhật đến theo thứ tự về bằng 2, 1, 4, 3, với giá trị ích, về đúc, giết, y.” (0.884): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Địa chỉ cũ ghi đè địa chỉ mới"
    checks:
      - "alg.apply_versioned([(1, 'A'), (3, 'C'), (2, 'B')], guard=False) == (2, 'B')"
    steps:
      - show: |
          <p>Khách đổi địa chỉ giao hàng ba lần trong một phút: A, rồi B, rồi C. Do một lần gửi bị thử lại, bản B đến <b>sau</b> bản C. Bảng địa chỉ của dịch vụ giao hàng giữ B — và hàng được gửi tới địa chỉ khách đã bỏ.</p>
          <div class="box key">Hôm nay: <b>thứ tự</b> và <b>trùng lặp</b> — giữ thứ tự ở đâu, và khi không giữ được thì chặn bằng gì.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, khách đổi địa chỉ giao hàng ba lần trong một phút, A, rồi B, rồi C. Do một lần gửi bị thử lại, bản B đến sau bản C. Bảng địa chỉ của dịch vụ giao hàng giữ B, và hàng được gửi tới địa chỉ khách đã bỏ. Hôm nay ta học thứ tự và trùng lặp, giữ thứ tự ở đâu, và khi không giữ được thì chặn bằng gì."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: thử lại sinh bản trùng, chia lấy dư chọn phân vùng"
    checks:
      - "alg.consume_with_dlq(5, {3}) == (2, 0, None)"
      - "17 % 6 == 5 and 23 % 6 == 5 and 18 % 6 == 0 and 17 == 2 * 6 + 5 and 23 == 3 * 6 + 5 and 18 == 3 * 6 + 0"
    steps:
      - show: |
          <p>Ở bài 2: người tiêu thụ đọc <b>tuần tự</b> trong một phân vùng, gặp lỗi thì <b>thử lại</b>. Phía người gửi cũng vậy: gửi bản B, mất xác nhận, gửi lại B. Kết quả: B có thể đến <b>hai lần</b>, hoặc bản gửi lại đến <b>sau</b> bản C gửi kế tiếp.</p>
        say: "Trước hết, nhắc lại bài 2, người tiêu thụ đọc tuần tự trong một phân vùng, và gặp lỗi thì thử lại. Phía người gửi cũng vậy, gửi bản B, không nhận được xác nhận, thì gửi lại B. Kết quả là B có thể đến hai lần, hoặc bản gửi lại đến sau bản C gửi kế tiếp."
      - show: |
          <table class="t"><tr><th>6 phân vùng, giá trị băm của khoá</th><th>chia 6 lấy dư</th><th>phân vùng</th></tr>
          <tr><td>17</td><td>$17 = 2 \times 6 + 5$</td><td>5</td></tr>
          <tr><td>23</td><td>$23 = 3 \times 6 + 5$</td><td>5</td></tr>
          <tr><td>18</td><td>$18 = 3 \times 6 + 0$</td><td>0</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Ở khoá Kỹ thuật dữ liệu, phân vùng được chọn bằng cách băm khoá rồi chia lấy dư cho số phân vùng. Với 6 phân vùng, khoá có giá trị băm 17 thì 17 bằng 2 lần 6 cộng 5, vào phân vùng 5. Giá trị băm 23 bằng 3 lần 6 cộng 5, cũng vào phân vùng 5. Giá trị băm 18 chia hết cho 6, vào phân vùng 0, và cùng một khoá thì lần nào cũng vào cùng một phân vùng."

  - id: sym
    kind: symbol
    title: "Giải mã: phân vùng, khoá, phiên bản"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>phân vùng</b></td><td>một nhật ký con; thứ tự chỉ được giữ <b>bên trong</b> một phân vùng</td></tr>
          <tr><td><b>khoá phân vùng</b></td><td>chọn phân vùng theo khoá (ví dụ mã khách) → mọi sự kiện của một khách đi một đường, đúng thứ tự</td></tr>
          <tr><td><b>giao ít nhất một lần</b></td><td>thông điệp có thể đến <b>hai lần</b>; bản cũ có thể đến muộn khi thử lại</td></tr>
          <tr><td><b>phiên bản theo khoá</b> $v$</td><td>số tăng dần của mỗi khoá; chỉ nhận cập nhật có $v$ <b>lớn hơn</b> bản đang giữ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        introduces: [ltgt]
        say: "Bảng có bốn khái niệm. Phân vùng là một nhật ký con, và thứ tự chỉ được giữ bên trong một phân vùng. Khoá phân vùng chọn phân vùng theo khoá, ví dụ mã khách, nên mọi sự kiện của một khách đi một đường, đúng thứ tự. Giao ít nhất một lần nghĩa là thông điệp có thể đến hai lần, và bản cũ có thể đến muộn khi thử lại. Phiên bản theo khoá, kí hiệu v, là số tăng dần của mỗi khoá, và ta chỉ nhận cập nhật có v lớn hơn bản đang giữ."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Thứ tự gửi khác thứ tự đến"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><defs><marker id="arE3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="23" fill="#1f2937" font-weight="bold"><text x="60" y="88">gửi</text><text x="60" y="318">đến</text></g><rect x="260" y="45" width="150" height="66" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="335" y="87" font-size="24" text-anchor="middle" fill="#1f2937">A, v = 1</text><rect x="460" y="45" width="150" height="66" rx="8" fill="#fde7d9" stroke="#1f2937" stroke-width="2"/><text x="535" y="87" font-size="24" text-anchor="middle" fill="#1f2937">B, v = 2</text><rect x="660" y="45" width="150" height="66" rx="8" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="735" y="87" font-size="24" text-anchor="middle" fill="#1f2937">C, v = 3</text><rect x="260" y="275" width="150" height="66" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="335" y="317" font-size="24" text-anchor="middle" fill="#1f2937">A, v = 1</text><rect x="460" y="275" width="150" height="66" rx="8" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="535" y="317" font-size="24" text-anchor="middle" fill="#1f2937">C, v = 3</text><rect x="660" y="275" width="150" height="66" rx="8" fill="#fde7d9" stroke="#1f2937" stroke-width="2"/><text x="735" y="317" font-size="24" text-anchor="middle" fill="#1f2937">B, v = 2</text><g stroke-width="3" fill="none"><line x1="335" y1="113" x2="335" y2="270" stroke="#1f2937" marker-end="url(#arE3)"/><line x1="535" y1="113" x2="725" y2="270" stroke="#eb6834" stroke-dasharray="10 8" marker-end="url(#arE3)"/><line x1="735" y1="113" x2="545" y2="270" stroke="#1f2937" marker-end="url(#arE3)"/></g><text x="680" y="200" font-size="21" fill="#eb6834">B gửi lại, đến muộn</text><rect x="950" y="70" width="480" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1190" y="112" font-size="23" text-anchor="middle" fill="#b91c1c" font-weight="bold">ghi đè mù</text><text x="1190" y="148" font-size="22" text-anchor="middle" fill="#b91c1c">giữ bản đến cuối: B, sai</text><rect x="950" y="230" width="480" height="100" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1190" y="272" font-size="23" text-anchor="middle" fill="#059669" font-weight="bold">chỉ nhận v lớn hơn</text><text x="1190" y="308" font-size="22" text-anchor="middle" fill="#059669">giữ v lớn nhất: C, đúng</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ hàng trên là thứ tự gửi, A với v bằng 1, B với v bằng 2, C với v bằng 3. Bản B phải gửi lại, nên đi đường đứt nét màu cam và đến muộn, sau C. Ghi đè mù chỉ biết giữ bản đến cuối, nên ra B, sai. Còn khi mỗi bản tự mang số phiên bản, người nhận giữ bản có v lớn nhất là C, bất kể thứ tự đến."

  - id: example
    kind: example
    title: "Thứ tự đến 1, 3, 2: có và không có phiên bản"
    checks:
      - "alg.apply_versioned([(1, 'A'), (3, 'C'), (2, 'B')], guard=False) == (2, 'B') and alg.apply_versioned([(1, 'A'), (3, 'C'), (2, 'B')]) == (3, 'C')"
      - "alg.apply_versioned([(1, 'A'), (3, 'C'), (3, 'C'), (2, 'B')]) == (3, 'C')"
    steps:
      - show: |
          <p><b>Bước 1</b> — đến $v = 1$, địa chỉ A. Đang giữ $v = 0$ (chưa có gì); $1 > 0$ → nhận, giữ A.</p>
        say: "Bước một, bản v bằng 1, địa chỉ A, đến. Người nhận đang giữ v bằng 0, tức chưa có gì, và 1 lớn hơn 0, nên nhận, giữ A."
      - show: |
          <p><b>Bước 2</b> — đến $v = 3$, địa chỉ C. $3 > 1$ → nhận, giữ C.</p>
        say: "Bước hai, bản v bằng 3, địa chỉ C, đến. 3 lớn hơn 1, nên nhận, giữ C. Ghi đè mù lúc này cũng đang giữ C."
      - show: |
          <p><b>Bước 3</b> — đến $v = 2$, địa chỉ B. Ghi đè mù: giữ <b class="red">B — sai</b>. Có phiên bản: 2 không lớn hơn 3 → bỏ, vẫn giữ $\hl{\text{C}}$.</p>
        say: "Bước ba, bản v bằng 2, địa chỉ B, đến muộn. Ghi đè mù thay C bằng B, và đó là sai. Cách có phiên bản so 2 với 3, thấy 2 không lớn hơn 3, nên bỏ bản này và vẫn giữ C."
      - clear: true
        show: |
          <table class="t"><tr><th>đến</th><th>ghi đè mù</th><th>chỉ nhận $v$ lớn hơn</th></tr>
          <tr><td>$v = 1$, địa chỉ A</td><td>A</td><td>A (1 &gt; 0, nhận)</td></tr>
          <tr><td>$v = 3$, địa chỉ C</td><td>C</td><td>C (3 &gt; 1, nhận)</td></tr>
          <tr><td>$v = 2$, địa chỉ B</td><td><b class="red">B — sai</b></td><td>$\hl{\text{C}}$ (2 không lớn hơn 3, bỏ)</td></tr>
          <tr><td>$v = 3$, địa chỉ C, lần hai</td><td>C</td><td>C (3 không lớn hơn 3, bỏ)</td></tr></table>
          <p><b>Bước 4</b> — bản C đến hai lần cũng không sao: <b>vừa đúng thứ tự vừa lũy đẳng</b>.</p>
        focus: [1, "1.2", "1.4", "1.5", 2]
        say: "Bảng gom lại cả ba bước. Hai bản đầu, cả hai cách đều nhận. Bản B đến muộn là chỗ hai cách khác nhau. Bước bốn, nếu bản C bị giao lại lần hai, nó có v bằng 3, không lớn hơn 3, nên bị bỏ. Một phép so sánh vừa giữ đúng thứ tự vừa làm người nhận lũy đẳng."

  - id: check
    kind: check
    title: "Tự kiểm: thử cả 6 thứ tự đến"
    checks:
      - "(lambda P: len(P) == 6 and [alg.apply_versioned(list(p), guard=False)[1] for p in P] == ['C', 'B', 'C', 'A', 'B', 'A'] and all(alg.apply_versioned(list(p)) == (3, 'C') for p in P))(list(__import__('itertools').permutations([(1, 'A'), (2, 'B'), (3, 'C')])))"
      - "sum(alg.apply_versioned(list(p), guard=False) != (3, 'C') for p in __import__('itertools').permutations([(1, 'A'), (2, 'B'), (3, 'C')])) == 4 and all(alg.apply_versioned(list(p)) == (3, 'C') for p in __import__('itertools').permutations([(1, 'A'), (2, 'B'), (3, 'C'), (3, 'C')]))"
    steps:
      - show: |
          <table class="t"><tr><th>thứ tự $v$ đến</th><th>1, 2, 3</th><th>1, 3, 2</th><th>2, 1, 3</th><th>2, 3, 1</th><th>3, 1, 2</th><th>3, 2, 1</th></tr>
          <tr><td>ghi đè mù</td><td>C</td><td class="red">B</td><td>C</td><td class="red">A</td><td class="red">B</td><td class="red">A</td></tr>
          <tr><td>chỉ nhận $v$ lớn hơn</td><td>C</td><td>C</td><td>C</td><td>C</td><td>C</td><td>C</td></tr></table>
        focus: [1, "1.1", "1.2", "1.3"]
        say: "Kiểm bằng đường khác, thay vì lần theo một thứ tự, ta thử cả 6 thứ tự đến có thể có của ba bản. Ghi đè mù luôn giữ bản đến cuối, nên chỉ đúng khi C đến cuối, sai ở 4 trên 6 thứ tự. Cách chỉ nhận v lớn hơn giữ C ở cả 6 thứ tự. Máy thử thêm trường hợp C bị giao hai lần, mọi thứ tự đến đều vẫn giữ C."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc và 1 lỗi người đi làm"
    checks:
      - "alg.apply_versioned([(1, 'A'), (3, 'C'), (2, 'B')]) == (3, 'C') and alg.apply_versioned([(2, 'B')]) == (2, 'B')"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng giờ máy làm phiên bản <b class="red">(đồng hồ các máy lệch nhau)</b>
          <br><span class="note">Hai máy lệch nhau vài trăm mi li giây là thường: bản mới viết trên máy chậm đồng hồ trông “cũ hơn”. Phiên bản nên do một nguồn cấp, như số thứ tự của bản ghi trong cơ sở dữ liệu.</span></div>
        say: "Lỗi thứ nhất, dùng giờ máy làm phiên bản, trong khi đồng hồ các máy lệch nhau. Hai máy lệch nhau vài trăm mi li giây là thường, nên bản mới viết trên máy chậm đồng hồ trông cũ hơn. Phiên bản nên do một nguồn cấp, như số thứ tự của bản ghi trong cơ sở dữ liệu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đòi thứ tự toàn cục <b class="red">(chỉ còn một phân vùng, mất khả năng mở rộng)</b>
          <br><span class="note">Hiếm khi cần thứ tự giữa hai khách khác nhau. Chỉ giữ thứ tự <b>theo khoá</b> cần giữ, để chia được nhiều phân vùng chạy song song.</span></div>
        say: "Lỗi thứ hai, đòi thứ tự toàn cục, nên chỉ còn một phân vùng và mất khả năng mở rộng. Hiếm khi cần thứ tự giữa hai khách khác nhau. Chỉ giữ thứ tự theo khoá cần giữ, để chia được nhiều phân vùng chạy song song."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đổi số phân vùng khi đang chạy <b class="red">(một khoá chuyển sang phân vùng khác)</b>
          <br><span class="note">Phân vùng = băm khoá rồi chia lấy dư cho số phân vùng; đổi từ 6 lên 8 thì nhiều khoá đổi đường, sự kiện mới có thể được xử lý trước sự kiện cũ còn nằm ở đường cũ.</span></div>
        say: "Lỗi thứ ba, đổi số phân vùng khi đang chạy, nên một khoá chuyển sang phân vùng khác. Phân vùng được chọn bằng cách băm khoá rồi chia lấy dư cho số phân vùng, nên đổi từ 6 lên 8 thì nhiều khoá đổi đường. Khi đó sự kiện mới có thể được xử lý trước sự kiện cũ còn nằm ở đường cũ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Giữ phiên bản <b>trong bộ nhớ</b> của người tiêu thụ <b class="red">(khởi động lại là quên)</b></div>
          <table class="t"><tr><th>thời điểm</th><th>phiên bản đang giữ</th><th>bản B, $v = 2$ đến muộn</th></tr>
          <tr><td>trước khởi động lại</td><td>$v = 3$, C</td><td>2 không lớn hơn 3: bỏ</td></tr>
          <tr><td>sau khởi động lại, phiên bản trong bộ nhớ</td><td>$v = 0$</td><td>2 &gt; 0: nhận <b class="red">B — sai</b></td></tr>
          <tr><td>sau khởi động lại, phiên bản lưu cùng dòng địa chỉ</td><td>$v = 3$, C</td><td>bỏ, vẫn giữ C</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, giữ phiên bản trong bộ nhớ của người tiêu thụ, nên khởi động lại là quên. Trước khởi động lại, người tiêu thụ giữ v bằng 3 và bỏ đúng bản B đến muộn. Sau khởi động lại, bộ nhớ về v bằng 0, bản B có v bằng 2 lớn hơn 0 nên được nhận, và địa chỉ lại sai. Người làm nghề lưu phiên bản cùng dòng với địa chỉ, và chỉ ghi khi phiên bản mới lớn hơn phiên bản trong dòng đó. Như vậy khởi động lại bao nhiêu lần, phép so sánh vẫn đọc được v bằng 3."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.apply_versioned([(2, 'X'), (1, 'W'), (4, 'Z'), (3, 'Y')]) == (4, 'Z') and alg.apply_versioned([(2, 'X'), (1, 'W'), (4, 'Z'), (3, 'Y')], guard=False) == (3, 'Y')"
      - "[alg.apply_versioned([(2, 'X'), (1, 'W'), (4, 'Z'), (3, 'Y')][:k]) for k in range(1, 5)] == [(2, 'X'), (2, 'X'), (4, 'Z'), (4, 'Z')] and 42 % 6 == 0 and 42 == 7 * 6 + 0"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cập nhật đến theo thứ tự $v$ = 2, 1, 4, 3 với giá trị X, W, Z, Y. Ghi đè mù giữ gì? Chỉ nhận $v$ lớn hơn giữ gì?</td></tr>
          <tr><td>2</td><td>Sự kiện đơn hàng cần đúng thứ tự trong từng đơn. Chọn khoá phân vùng nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cập nhật đến theo thứ tự v bằng 2, 1, 4, 3, với giá trị X, W, Z, Y. Ghi đè mù giữ gì? Chỉ nhận v lớn hơn thì giữ gì? Câu hai, sự kiện đơn hàng cần đúng thứ tự trong từng đơn. Nên chọn khoá phân vùng nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>đến</th><th>ghi đè mù</th><th>chỉ nhận $v$ lớn hơn</th></tr>
          <tr><td>$v = 2$, X</td><td>X</td><td>X (2 &gt; 0, nhận)</td></tr>
          <tr><td>$v = 1$, W</td><td>W</td><td>X (1 không lớn hơn 2, bỏ)</td></tr>
          <tr><td>$v = 4$, Z</td><td>Z</td><td>Z (4 &gt; 2, nhận)</td></tr>
          <tr><td>$v = 3$, Y</td><td><b class="red">Y</b></td><td>$\hl{\text{Z}}$ (3 không lớn hơn 4, bỏ)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Đáp án câu một, đi từng dòng. Bản v bằng 2, giá trị X, đến trước, 2 lớn hơn 0 nên nhận X. Bản v bằng 1, giá trị W, có 1 không lớn hơn 2 nên bỏ, trong khi ghi đè mù đổi sang W. Bản v bằng 4, giá trị Z, có 4 lớn hơn 2 nên nhận Z. Bản cuối v bằng 3, giá trị Y, có 3 không lớn hơn 4 nên bỏ, giữ Z. Ghi đè mù thì giữ bản đến cuối là Y."
      - show: |
          <p>② Khoá = <b>mã đơn</b>. Ví dụ đơn 42 với 6 phân vùng: $42 = 7 \times 6 + 0$ → mọi sự kiện của đơn 42 vào phân vùng 0, đúng thứ tự; các đơn khác nhau rải ra nhiều phân vùng, chạy song song.</p>
        say: "Câu hai, chọn khoá là mã đơn. Ví dụ đơn 42 với 6 phân vùng, 42 bằng 7 lần 6 cộng 0, nên mọi sự kiện của đơn 42 luôn vào phân vùng 0, đúng thứ tự. Các đơn khác nhau rải ra nhiều phân vùng và chạy song song."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">thứ tự chỉ có trong một phân vùng</span><span class="a">→</span>
          <span class="n">khoá phân vùng = thứ tự cần giữ</span><span class="a">→</span>
          <span class="n">thử lại vẫn làm bản cũ đến muộn</span><span class="a">→</span>
          <span class="n">phiên bản theo khoá: chỉ nhận số lớn hơn</span></div>
        say: "Tổng kết lại, thứ tự chỉ có trong một phân vùng, nên chọn khoá phân vùng theo thứ tự cần giữ. Thử lại vẫn có thể làm bản cũ đến muộn, nên dùng phiên bản theo khoá, và chỉ nhận số lớn hơn."
      - show: |
          <div class="box key"><b>Tư duy:</b> đừng tin thứ tự đến — hãy để <b>dữ liệu tự mang</b> thứ tự của nó.</div>
        say: "Điều cần mang theo, đừng tin thứ tự đến, hãy để dữ liệu tự mang thứ tự của nó."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>ghi nguồn sự kiện</b> — lưu chuỗi sự kiện thay vì trạng thái.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học ghi nguồn sự kiện, tức là lưu chuỗi sự kiện thay vì lưu trạng thái. Hẹn gặp bạn ở bài tiếp theo."
