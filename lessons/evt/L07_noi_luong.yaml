source: "curriculum/evt.yaml L07; audit/evt/verify_evt.py L07; M. Kleppmann (2017), chương 11 — nối luồng; T. Akidau và cộng sự, The Dataflow Model (VLDB 2015); bài 3"
assumes: [arith, ltgt, cdot]
# Quy ước: nối luồng–bảng = mỗi sự kiện tra trạng thái MỚI NHẤT của bảng tại lúc xử lý. Nối luồng–luồng theo cửa sổ W: lượt bấm khớp lượt hiển thị cùng mã khi
#   0 ≤ t_bấm − t_hiển_thị ≤ W (alg.window_join). Thời điểm (phút) là SỐ MINH HOẠ.
objectives:
  - "Nối sự kiện với trạng thái mới nhất của bảng"
  - "Nối hai luồng trong một cửa sổ thời gian"
  - "Ước lượng trạng thái phải giữ theo độ dài cửa sổ"
asr_reviewed:
  - {sentence: "Mỗi lượt hiển thị phải nằm trong bộ nhớ suốt W phút.", reason: "ASR chép “Mỗi lượt hiển thị phải nằm trong bộ nhớ suốt về đúc phúc.” (0.8): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: phút (trong “w phút” → “về đúc phúc”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, lượt bấm d, lượt hiển thị d lúc 3.", reason: "ASR chép “Bước 3, lượt bấm G, lượt hiển thị G lúc 3.” (0.818): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàng a 3 chỉ có ô a cùng mã, hiệu 3, khớp.", reason: "ASR chép “Hàng A3 chỉ có OA cùng mã, hiệu 3, khớp.” (0.87): “ô” (ô lưới) ASR viết chữ “O”; chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàng b 13 chỉ có ô b cùng mã, hiệu 12, quá 10.", reason: "ASR chép “Hàng B13 chỉ có OB cùng mã, hiệu 12, quá mười.” (0.897): “ô” (ô lưới) ASR viết chữ “O”; chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Thử nới cửa sổ từ 10 lên 15 phút, ô b có hiệu 12, nhỏ hơn 15, nên khớp, và kết quả thành 3 cặp.", reason: "ASR chép “Thử nới cửa sổ từ 10 lên 15 phút, OB có hiểu 12, nhỏ hơn 15, nên khớp và kết quả thành 3 cặp.” (0.909): “ô” (ô lưới) ASR viết chữ “O”; chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: hiệu/hiểu — NOT_VERIFIED bằng tai người"}
  - {sentence: "Người làm nghề đo khoảng cách thật giữa hiển thị và bấm, rồi chọn W phủ phần lớn các lượt bấm, chứ không chọn theo cảm giác.", reason: "ASR chép “Người làm nghề đo khoảng cách thật giữa hiển thị và bấm, rồi chọn vê đúc phủ phần lớn các lược bấm, chứ không chọn theo cảm giác.” (0.909): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: lượt/lược — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cùng một dữ liệu, độ dài cửa sổ làm đổi kết quả, nên W là một quyết định nghiệp vụ, không chỉ là một tham số kỹ thuật.", reason: "ASR chép “Cùng một giữ liệu, độ dài cửa số làm đổi kết quả nên VDUP là một quyết định nghiệp vụ, không chỉ là một tham số kỹ thuật.” (0.929): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: sổ/số — NOT_VERIFIED bằng tai người"}
  - {sentence: "Giả sử có 1000 lượt hiển thị mỗi phút và W bằng 10, thì lúc nào cũng giữ khoảng 1000 nhân 10, bằng 10 nghìn lượt.", reason: "ASR chép “Giả sử có 1 nghìn lượt hiển thị mỗi phút và về đúc bằng 10 thì lúc nào cũng giữ khoảng 1 nghìn nhân 10 bằng 10 nghìn lượt.” (0.947): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ ba, nối luồng với bảng mà bảng chưa nạp xong, nên đơn đầu ngày thiếu hạng thành viên.", reason: "ASR chép “Lỗi thứ ba, nối lùng với bản mà bản chưa nặp xong nên đơn đầu ngày thiếu hàng thành viên.” (0.75): lệch âm/thanh thuần Việt: luồng/lùng, bảng/bản, bảng/bản, nạp/nặp, hạng/hàng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nối luồng với luồng phải giữ các lượt hiển thị trong W phút gần nhất để chờ lượt bấm.", reason: "ASR chép “Nối lùng với lùng phải giữ các lượt hiện thị trong về đúc phút gần nhất để chờ lượt bấm.” (0.769): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: luồng/lùng, luồng/lùng, hiển/hiện — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lượt hiển thị là x lúc 5, y lúc 8, còn lượt bấm là x lúc 4, x lúc 9, y lúc 20, z lúc 9, với cửa sổ W bằng 10.", reason: "ASR chép “Lược hiển thị là X lúc 5, Y lúc 8, còn lược bấm là X lúc 4, X lúc 9, Y lúc 20, Jack lúc 9, với cửa sổ V đúc bằng 10.” (0.866): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: lượt/lược, lượt/lược — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ghép theo thời điểm xảy ra, và nhớ rằng W càng dài thì trạng thái phải giữ càng lớn.", reason: "ASR chép “Gép theo thời điểm xảy ra, và nhớ rằng với đúc càng dài thì trạng thái phải giữ càng lớn.” (0.872): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: ghép/gép — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tổng kết lại, nối luồng với bảng là tra bản mới nhất, còn nối luồng với luồng là ghép cùng mã trong cửa sổ W.", reason: "ASR chép “Tổng kết lại, nối luồng với bảng là tra bảng mới nhất, còn nối luồng với luồng là ghép cùng mã trong cửa sổ v-duc.” (0.902): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: bản/bảng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nối luồng với luồng là ghép hai sự kiện cùng mã, nếu thời điểm bấm trừ thời điểm hiển thị nằm từ 0 tới W, ví dụ W bằng 10 phút.", reason: "ASR chép “Nối luồng với luồng là ghép hai sự kiện cùng mã nếu thời điểm bấm trừ thời điểm hiển thị nằm từ không tới v-dup, ví dụ v-dup bằng 10 phút.” (0.906): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở đây t là thời điểm xảy ra sự kiện, W là độ dài cửa sổ.", reason: "ASR chép “Ở đây tê là thời điểm xảy ra sự kiện, về đúc là độ dài cửa sổ.” (0.909): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hãy chọn W theo hành vi thật, vì phần lớn lượt bấm đến trong vài phút, và luôn có giới hạn.", reason: "ASR chép “Hãy chọn vê đúc theo hành vi thật, vì phần lớn lượt bấm đến trong vài phút và luôn có giới hạn.” (0.93): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lượt bấm này thuộc lượt hiển thị nào?"
    checks:
      - "len(alg.window_join({'a': 0, 'b': 1, 'c': 2, 'd': 3, 'e': 4}, [('a', 3), ('b', 13), ('d', 10)], 10)) == 2"
    steps:
      - show: |
          <p>Hệ quảng cáo nhận hai luồng: lượt <b>hiển thị</b> và lượt <b>bấm</b>. Để tính tỉ lệ bấm, mỗi lượt bấm phải được ghép với lượt hiển thị của nó. Hai luồng đến riêng, không đồng thời, và không thể chờ “hết dữ liệu” vì luồng không bao giờ hết.</p>
          <div class="box key">Hôm nay: <b>nối luồng</b> — với một bảng, và với một luồng khác trong một <b>cửa sổ thời gian</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, hệ quảng cáo nhận hai luồng, lượt hiển thị và lượt bấm. Để tính tỉ lệ bấm, mỗi lượt bấm phải được ghép với lượt hiển thị của nó. Hai luồng đến riêng, không đồng thời, và không thể chờ hết dữ liệu, vì luồng không bao giờ hết. Hôm nay ta học nối luồng, với một bảng, và với một luồng khác trong một cửa sổ thời gian."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: khoảng cách thời gian và tra bảng"
    checks:
      - "9 - 2 == 7 and 0 <= 9 - 2 <= 10 and 1 - 2 == -1 and 14 - 2 == 12 and 12 > 10"
      - "{'7': 'vàng'}['7'] == 'vàng'"
    steps:
      - show: |
          <table class="t"><tr><th>hiển thị lúc 2, cửa sổ 10 phút</th><th>bấm trừ hiển thị</th><th>nằm từ 0 tới 10?</th></tr>
          <tr><td>bấm lúc 9</td><td>$9 - 2 = 7$</td><td>có</td></tr>
          <tr><td>bấm lúc 1</td><td>$1 - 2 = -1$</td><td>không: bấm trước khi thấy</td></tr>
          <tr><td>bấm lúc 14</td><td>$14 - 2 = 12$</td><td>không: $12 \gt 10$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        introduces: [ltgt]
        say: "Trước hết, ôn cách đo khoảng cách thời gian. Một quảng cáo hiển thị lúc phút thứ 2, cửa sổ dài 10 phút, ta lấy thời điểm bấm trừ thời điểm hiển thị. Bấm lúc 9 thì 9 trừ 2 bằng 7, nằm từ 0 tới 10, nên lọt cửa sổ. Bấm lúc 1 thì 1 trừ 2 bằng âm 1, nghĩa là bấm trước khi thấy, vô lý, nên loại; còn bấm lúc 14 thì 14 trừ 2 bằng 12, lớn hơn 10, cũng loại."
      - show: |
          <p>Ở khoá Hệ phân tán và dữ liệu lớn, mỗi sự kiện mang <b>thời điểm xảy ra</b> của nó, khác với lúc máy xử lý. Còn <b>tra bảng</b> thì quen thuộc: bảng hạng thành viên ghi khách 7 → vàng, một sự kiện của khách 7 tra ra “vàng”.</p>
        focus: [1, 1, 1]
        say: "Ở khoá Hệ phân tán và dữ liệu lớn, ta đã gặp ý này, mỗi sự kiện mang thời điểm xảy ra của nó, khác với lúc máy xử lý nó. Còn tra bảng thì rất quen thuộc. Bảng hạng thành viên ghi khách 7 là hạng vàng, nên một sự kiện của khách 7 tra vào sẽ ra vàng."

  - id: sym
    kind: symbol
    title: "Giải mã: hai kiểu nối luồng"
    steps:
      - show: |
          <table class="t"><tr><th>kiểu nối</th><th>cách làm</th><th>ví dụ</th></tr>
          <tr><td><b>luồng với bảng</b></td><td>mỗi sự kiện tra <b>bản mới nhất</b> của bảng lúc xử lý</td><td>sự kiện đơn hàng thêm hạng thành viên của khách</td></tr>
          <tr><td><b>luồng với luồng</b></td><td>ghép hai sự kiện cùng mã nếu $0 \le t_{\text{bấm}} - t_{\text{hiển thị}} \le W$</td><td>lượt bấm với lượt hiển thị, $W$ = 10 phút</td></tr></table>
          <p>$t$ là thời điểm xảy ra sự kiện, $W$ là độ dài cửa sổ. Nối luồng với luồng phải <b>giữ</b> các lượt hiển thị trong $W$ phút gần nhất để chờ lượt bấm.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Bảng này so sánh hai kiểu nối dữ liệu luồng. Nối luồng với bảng là mỗi sự kiện tra bản mới nhất của bảng lúc xử lý, ví dụ sự kiện đơn hàng được thêm hạng thành viên của khách. Nối luồng với luồng là ghép hai sự kiện cùng mã, nếu thời điểm bấm trừ thời điểm hiển thị nằm từ 0 tới W, ví dụ W bằng 10 phút. Ở đây t là thời điểm xảy ra sự kiện, W là độ dài cửa sổ. Nối luồng với luồng phải giữ các lượt hiển thị trong W phút gần nhất để chờ lượt bấm."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi lượt hiển thị mở một cửa sổ chờ"
    steps:
      - show: |
          <div><svg width="1500" height="450" viewBox="0 0 1500 450"><text x="150" y="58" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">a</text><rect x="200" y="35" width="550" height="30" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><circle cx="200" cy="50" r="10" fill="#2a78d6"/><circle cx="365" cy="50" r="13" fill="#eb6834" stroke="#1f2937" stroke-width="2"/><text x="1350" y="58" font-size="22" fill="#059669" font-weight="bold">khớp</text><text x="150" y="118" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">b</text><rect x="255" y="95" width="550" height="30" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><circle cx="255" cy="110" r="10" fill="#2a78d6"/><circle cx="915" cy="110" r="13" fill="#eb6834" stroke="#1f2937" stroke-width="2"/><text x="1350" y="118" font-size="22" fill="#b91c1c" font-weight="bold">không khớp</text><text x="150" y="178" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">c</text><rect x="310" y="155" width="550" height="30" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><circle cx="310" cy="170" r="10" fill="#2a78d6"/><text x="1350" y="178" font-size="22" fill="#6b7280" font-weight="bold">không bấm</text><text x="150" y="238" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">d</text><rect x="365" y="215" width="550" height="30" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><circle cx="365" cy="230" r="10" fill="#2a78d6"/><circle cx="750" cy="230" r="13" fill="#eb6834" stroke="#1f2937" stroke-width="2"/><text x="1350" y="238" font-size="22" fill="#059669" font-weight="bold">khớp</text><text x="150" y="298" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">e</text><rect x="420" y="275" width="550" height="30" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><circle cx="420" cy="290" r="10" fill="#2a78d6"/><text x="1350" y="298" font-size="22" fill="#6b7280" font-weight="bold">không bấm</text><line x1="190" y1="340" x2="1310" y2="340" stroke="#1f2937" stroke-width="2"/><line x1="200" y1="333" x2="200" y2="347" stroke="#1f2937" stroke-width="2"/><text x="200" y="375" font-size="20" text-anchor="middle" fill="#1f2937">0</text><line x1="475" y1="333" x2="475" y2="347" stroke="#1f2937" stroke-width="2"/><text x="475" y="375" font-size="20" text-anchor="middle" fill="#1f2937">5</text><line x1="750" y1="333" x2="750" y2="347" stroke="#1f2937" stroke-width="2"/><text x="750" y="375" font-size="20" text-anchor="middle" fill="#1f2937">10</text><line x1="1025" y1="333" x2="1025" y2="347" stroke="#1f2937" stroke-width="2"/><text x="1025" y="375" font-size="20" text-anchor="middle" fill="#1f2937">15</text><line x1="1300" y1="333" x2="1300" y2="347" stroke="#1f2937" stroke-width="2"/><text x="1300" y="375" font-size="20" text-anchor="middle" fill="#1f2937">20</text><text x="1320" y="375" font-size="20" fill="#1f2937">phút</text><g font-size="21"><circle cx="220" cy="425" r="9" fill="#2a78d6"/><text x="240" y="432" fill="#2a78d6">lượt hiển thị, thanh xanh là cửa sổ 10 phút của nó</text><circle cx="900" cy="425" r="11" fill="#eb6834"/><text x="920" y="432" fill="#eb6834">lượt bấm</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mỗi lượt hiển thị như một chấm xanh, kèm một thanh xanh dài 10 phút về phía sau, đó là cửa sổ nó đứng chờ lượt bấm. Chấm cam là lượt bấm, nếu rơi vào trong thanh cùng hàng thì khớp, như hàng a và hàng d. Ở hàng b, chấm cam nằm ngoài, sau khi thanh đã hết, nên không khớp. Trong suốt 10 phút đó, bộ xử lý phải giữ lượt hiển thị trong bộ nhớ, và đó chính là trạng thái của phép nối."

  - id: example
    kind: example
    title: "5 lượt hiển thị, 3 lượt bấm, cửa sổ 10 phút"
    checks:
      - "alg.window_join({'a': 0, 'b': 1, 'c': 2, 'd': 3, 'e': 4}, [('a', 3), ('b', 13), ('d', 10)], 10) == [('a', 3), ('d', 10)]"
      - "3 - 0 == 3 and 13 - 1 == 12 and 10 - 3 == 7 and 2 / 5 == 0.4 and 1000 * 10 == 10000"
    steps:
      - show: |
          <p>Hiển thị (phút): a 0, b 1, c 2, d 3, e 4. Bấm: a lúc 3, b lúc 13, d lúc 10.</p>
          <p><b>Bước 1 — lượt bấm a.</b> Tìm lượt hiển thị cùng mã a (lúc 0): $3 - 0 = 3$, nằm từ 0 tới 10 → <b>khớp</b>.</p>
        focus: [1, 2, 2]
        say: "Lượt hiển thị theo phút là a lúc 0, b lúc 1, c lúc 2, d lúc 3, e lúc 4, còn lượt bấm là a lúc 3, b lúc 13, d lúc 10. Bước một, xét lượt bấm a, ta tìm lượt hiển thị cùng mã a, lúc 0. Hiệu là 3 trừ 0, bằng 3 phút, nằm từ 0 tới 10, nên khớp."
      - show: |
          <p><b>Bước 2 — lượt bấm b.</b> Hiển thị b lúc 1: $13 - 1 = 12$, mà $12 \gt 10$ → <b>không khớp</b>; cửa sổ của b đã đóng ở phút 11.</p>
        say: "Bước hai, lượt bấm b, lượt hiển thị b lúc 1. Hiệu là 13 trừ 1, bằng 12, lớn hơn 10, nên không khớp, vì cửa sổ của b đã đóng từ phút 11."
      - show: |
          <p><b>Bước 3 — lượt bấm d.</b> Hiển thị d lúc 3: $10 - 3 = 7$ → <b>khớp</b>. Hai lượt hiển thị c và e không có lượt bấm nào.</p>
        say: "Bước ba, lượt bấm d, lượt hiển thị d lúc 3. Hiệu là 10 trừ 3, bằng 7, nên khớp. Hai lượt hiển thị c và e không có lượt bấm nào."
      - clear: true
        show: |
          <table class="t"><tr><th>lượt bấm</th><th>$t_{\text{bấm}} - t_{\text{hiển thị}}$</th><th>khớp với $W = 10$?</th></tr>
          <tr><td>a</td><td>$3 - 0 = 3$</td><td>có</td></tr>
          <tr><td>b</td><td>$13 - 1 = 12$</td><td><b>không</b> (12 &gt; 10)</td></tr>
          <tr><td>d</td><td>$10 - 3 = 7$</td><td>có</td></tr></table>
          <p><b>Bước 4.</b> Kết quả: $\hl{2}$ cặp khớp. Tỉ lệ bấm trong 10 phút là $2/5 = 40\%$.</p>
        focus: [1, 2]
        say: "Bước bốn, gom kết quả vào bảng, được 2 cặp khớp. Tỉ lệ bấm trong 10 phút là 2 trên 5, bằng 40 phần trăm."
      - show: |
          <p><b>Bước 5 — trạng thái phải giữ.</b> Mỗi lượt hiển thị nằm trong bộ nhớ $W$ phút. Giả sử 1000 lượt hiển thị mỗi phút, $W = 10$: giữ khoảng $1000 \cdot 10 = \hl{10\,000}$ lượt.</p>
        say: "Bước năm, ước lượng trạng thái phải giữ. Mỗi lượt hiển thị phải nằm trong bộ nhớ suốt W phút. Giả sử có 1000 lượt hiển thị mỗi phút và W bằng 10, thì lúc nào cũng giữ khoảng 1000 nhân 10, bằng 10 nghìn lượt."

  - id: check
    kind: check
    title: "Tự kiểm: dò hết 15 cặp"
    checks:
      - "(lambda imps, clk: len(clk) * len(imps) == 15 and [(k, t) for k, t in clk for k2, t2 in imps if k == k2] == [('a', 3), ('b', 13), ('d', 10)] and sum(1 for k, t in clk for k2, t2 in imps if k == k2 and 0 <= t - t2 <= 10) == 2)([('a', 0), ('b', 1), ('c', 2), ('d', 3), ('e', 4)], [('a', 3), ('b', 13), ('d', 10)])"
      - "len(alg.window_join({'a': 0, 'b': 1, 'c': 2, 'd': 3, 'e': 4}, [('a', 3), ('b', 13), ('d', 10)], 15)) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>bấm \ hiển thị</th><th>a 0</th><th>b 1</th><th>c 2</th><th>d 3</th><th>e 4</th></tr>
          <tr><td>a 3</td><td>3 ✓</td><td>khác mã</td><td>khác mã</td><td>khác mã</td><td>khác mã</td></tr>
          <tr><td>b 13</td><td>khác mã</td><td>12, quá 10</td><td>khác mã</td><td>khác mã</td><td>khác mã</td></tr>
          <tr><td>d 10</td><td>khác mã</td><td>khác mã</td><td>khác mã</td><td>7 ✓</td><td>khác mã</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, không tìm theo mã nữa mà dò hết mọi cặp, 3 lượt bấm nhân 5 lượt hiển thị, bằng 15 ô. Hàng a 3 chỉ có ô a cùng mã, hiệu 3, khớp. Hàng b 13 chỉ có ô b cùng mã, hiệu 12, quá 10. Hàng d 10 chỉ có ô d cùng mã, hiệu 7, khớp, nên đếm lại vẫn đúng 2 cặp."
      - show: |
          <table class="t"><tr><th>cửa sổ</th><th>ô b: hiệu 12</th><th>số cặp khớp</th></tr>
          <tr><td>$W = 10$</td><td>$12 \gt 10$: loại</td><td>2</td></tr>
          <tr><td>$W = 15$</td><td>$12 \le 15$: khớp</td><td>3</td></tr></table>
        say: "Thử nới cửa sổ từ 10 lên 15 phút, ô b có hiệu 12, nhỏ hơn 15, nên khớp, và kết quả thành 3 cặp. Cùng một dữ liệu, độ dài cửa sổ làm đổi kết quả, nên W là một quyết định nghiệp vụ, không chỉ là một tham số kỹ thuật."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc"
    checks:
      - "1000 * 10 == 10000 and 24 * 60 == 1440 and 1000 * 1440 == 1440000 and 1440000 // 10000 == 144"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Cửa sổ dài vô hạn <b class="red">(trạng thái phình mãi)</b>
          <br><span class="note">Giữ mọi lượt hiển thị để chờ lượt bấm thì bộ nhớ tăng mãi. Chọn $W$ theo hành vi thật (phần lớn lượt bấm đến trong vài phút) và có giới hạn.</span></div>
        say: "Lỗi thứ nhất, cửa sổ dài vô hạn, nên trạng thái phình mãi. Giữ mọi lượt hiển thị để chờ lượt bấm thì bộ nhớ tăng mãi. Hãy chọn W theo hành vi thật, vì phần lớn lượt bấm đến trong vài phút, và luôn có giới hạn."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng thời điểm xử lý thay cho thời điểm xảy ra <b class="red">(máy chậm làm đổi kết quả)</b>
          <br><span class="note">Cùng dữ liệu, chạy lúc bộ xử lý trễ 5 phút sẽ ra cặp khớp khác. Ghép theo thời điểm <b>xảy ra</b> ghi trong sự kiện, và chờ thêm một khoảng cho sự kiện đến muộn.</span></div>
        say: "Lỗi thứ hai, dùng thời điểm xử lý thay cho thời điểm xảy ra, nên máy chậm làm đổi kết quả. Cùng dữ liệu, chạy lúc bộ xử lý trễ 5 phút sẽ ra cặp khớp khác. Hãy ghép theo thời điểm xảy ra ghi trong sự kiện, và chờ thêm một khoảng cho sự kiện đến muộn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nối luồng với bảng mà bảng chưa nạp <b class="red">(đơn đầu ngày thiếu hạng thành viên)</b>
          <br><span class="note">Khởi động bộ xử lý phải nạp xong bảng trước khi xử lý luồng; nếu không, các sự kiện đầu tiên tra vào bảng rỗng.</span></div>
        say: "Lỗi thứ ba, nối luồng với bảng mà bảng chưa nạp xong, nên đơn đầu ngày thiếu hạng thành viên. Khi khởi động, bộ xử lý phải nạp xong bảng trước khi xử lý luồng, nếu không các sự kiện đầu tiên sẽ tra vào một bảng rỗng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Kéo cửa sổ từ 10 phút lên 1 ngày “cho chắc” <b class="red">(trạng thái gấp 144, kết quả chốt muộn 1 ngày)</b></div>
          <table class="t"><tr><th>1000 lượt hiển thị mỗi phút</th><th>lượt phải giữ</th><th>khi nào chốt được “không bấm”</th></tr>
          <tr><td>$W = 10$ phút</td><td>$1000 \cdot 10 = 10\,000$</td><td>sau 10 phút</td></tr>
          <tr><td>$W = 1$ ngày $= 1440$ phút</td><td>$1000 \cdot 1440 = 1\,440\,000$</td><td>sau cả một ngày</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, sợ sót lượt bấm nên kéo cửa sổ từ 10 phút lên 1 ngày cho chắc. Với 1000 lượt hiển thị mỗi phút, cửa sổ 10 phút chỉ phải giữ 10 nghìn lượt. Một ngày có 1440 phút, nên phải giữ 1000 nhân 1440, bằng 1 triệu 440 nghìn lượt, gấp 144 lần. Chưa hết, một lượt hiển thị chỉ được chốt là không bấm khi cửa sổ của nó đóng, nên báo cáo tỉ lệ bấm trễ cả một ngày. Người làm nghề đo khoảng cách thật giữa hiển thị và bấm, rồi chọn W phủ phần lớn các lượt bấm, chứ không chọn theo cảm giác."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.window_join({'x': 5, 'y': 8}, [('x', 4), ('x', 9), ('y', 20), ('z', 9)], 10) == [('x', 9)]"
      - "9 - 5 == 4 and 4 - 5 == -1 and 20 - 8 == 12 and 2000 * 15 == 30000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hiển thị: x lúc 5, y lúc 8. Bấm: x lúc 4, x lúc 9, y lúc 20, z lúc 9. Cửa sổ $W = 10$. Lượt bấm nào khớp? Giải thích từng lượt bị loại.</td></tr>
          <tr><td>2</td><td>Mỗi phút có 2000 lượt hiển thị, $W = 15$ phút. Phải giữ khoảng bao nhiêu lượt hiển thị?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Lượt hiển thị là x lúc 5, y lúc 8, còn lượt bấm là x lúc 4, x lúc 9, y lúc 20, z lúc 9, với cửa sổ W bằng 10. Câu một, lượt bấm nào khớp, và vì sao từng lượt còn lại bị loại? Câu hai, mỗi phút có 2000 lượt hiển thị, cửa sổ dài 15 phút, thì phải giữ khoảng bao nhiêu lượt hiển thị? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>lượt bấm</th><th>hiển thị cùng mã</th><th>hiệu</th><th>kết luận</th></tr>
          <tr><td>x lúc 4</td><td>x lúc 5</td><td>$4 - 5 = -1$</td><td>loại: bấm trước khi hiển thị</td></tr>
          <tr><td>x lúc 9</td><td>x lúc 5</td><td>$9 - 5 = 4$</td><td>$\hl{\text{khớp}}$</td></tr>
          <tr><td>y lúc 20</td><td>y lúc 8</td><td>$20 - 8 = 12$</td><td>loại: $12 \gt 10$</td></tr>
          <tr><td>z lúc 9</td><td>không có</td><td>—</td><td>loại: không có mã z</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, xét từng lượt bấm. Lượt x lúc 4 bấm trước khi hiển thị, vì 4 trừ 5 ra âm 1, nên loại. Lượt x lúc 9 khớp, vì 9 trừ 5 bằng 4, nằm từ 0 tới 10. Lượt y lúc 20 cách 20 trừ 8, bằng 12, lớn hơn 10, nên loại. Lượt z không có lượt hiển thị nào cùng mã, nên chỉ còn đúng một cặp là x lúc 9."
      - show: |
          <p>② Mỗi lượt hiển thị nằm trong bộ nhớ 15 phút, mỗi phút thêm 2000 lượt → giữ khoảng $2000 \cdot 15 = \hl{30\,000}$ lượt.</p>
        say: "Câu hai, mỗi lượt hiển thị nằm trong bộ nhớ 15 phút, và mỗi phút có thêm 2000 lượt mới, nên lúc nào cũng giữ khoảng 2000 nhân 15, bằng 30 nghìn lượt hiển thị."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">luồng với bảng: tra bản mới nhất</span><span class="a">→</span>
          <span class="n">luồng với luồng: cùng mã, trong cửa sổ W</span><span class="a">→</span>
          <span class="n">ghép theo thời điểm xảy ra</span><span class="a">→</span>
          <span class="n">W càng dài, trạng thái càng lớn</span></div>
        say: "Tổng kết lại, nối luồng với bảng là tra bản mới nhất, còn nối luồng với luồng là ghép cùng mã trong cửa sổ W. Ghép theo thời điểm xảy ra, và nhớ rằng W càng dài thì trạng thái phải giữ càng lớn."
      - show: |
          <div class="box key"><b>Tư duy:</b> với dữ liệu không bao giờ hết, câu hỏi “đã đủ chưa” được thay bằng <b>“chờ bao lâu thì đủ”</b>.</div>
        say: "Điều cần mang theo, với dữ liệu không bao giờ hết, câu hỏi đã đủ chưa được thay bằng câu hỏi chờ bao lâu thì đủ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): <b>áp lực ngược</b> và độ trễ tiêu thụ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta học áp lực ngược và độ trễ tiêu thụ. Hẹn gặp bạn ở bài tiếp theo."
