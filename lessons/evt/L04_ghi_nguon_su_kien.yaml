id: L04
course: EVT
series: "EVT · Kiến trúc hướng sự kiện"
title: "Bài 4 — Ghi nguồn sự kiện: trạng thái là kết quả gấp các sự kiện"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/evt.yaml L04; audit/evt/verify_evt.py L04; M. Fowler, Event Sourcing (2005); G. Young, CQRS Documents (2010); bài 3"
assumes: [arith]
# Quy ước: sự kiện của tài khoản là số tiền cộng vào (nạp dương, rút âm); trạng thái = số dư = gấp (cộng dồn) các sự kiện (alg.fold_events).
#   Ảnh chụp mỗi s sự kiện → khi dựng lại chỉ phát lại tối đa s − 1 sự kiện sau ảnh chụp gần nhất (alg.replay_cost). Các số tiền là SỐ MINH HOẠ.
objectives:
  - "Dựng trạng thái bằng cách gấp chuỗi sự kiện"
  - "Dùng ảnh chụp trạng thái để giới hạn chi phí phát lại"
  - "Sửa sai bằng sự kiện bù trừ, không sửa lịch sử"
asr_reviewed:
  - {sentence: "Câu hai, phát hiện lần rút 80 là trừ nhầm, thì ghi gì vào nhật ký?", reason: "ASR chép “Câu 2, phát hiện lần trúc 80 là trường nhầm thì di dì vào nhật ký.” (0.765): lệch âm/thanh thuần Việt: rút/trúc, trừ/trường, ghi gì/di dì — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ nhất, sửa hoặc xoá sự kiện cũ, nên mất dấu vết và các bảng đọc lệch nhau.", reason: "ASR chép “Lội thứ nhất, sửa hoặc xóa sự kiện cũ nên mất dấu vết và các bản độc lệch nhau.” (0.789): lệch âm/thanh thuần Việt: lỗi/lội, vết/véc, bảng đọc/bản độc — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Số dư 100 — nhưng vì sao?"
    checks:
      - "alg.fold_events([100, -30, 50, -20]) == 100"
    steps:
      - show: |
          <p>Bảng tài khoản chỉ lưu một cột “số dư”. Khách khiếu nại: “tôi nạp 100, rút 30, nạp 50 — sao chỉ còn 100, không phải 120?”. Bảng chỉ có con số hiện tại; không ai biết số dư đã đi qua những bước nào, và bước nào sai.</p>
          <div class="box key">Hôm nay: <b>ghi nguồn sự kiện</b> — lưu <b>mọi điều đã xảy ra</b>; số dư chỉ là kết quả cộng dồn.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, bảng tài khoản chỉ lưu một cột số dư. Khách khiếu nại rằng tôi nạp 100, rút 30, nạp 50, sao chỉ còn 100 mà không phải 120? Bảng chỉ có con số hiện tại, nên không ai biết số dư đã đi qua những bước nào, và bước nào sai. Hôm nay ta học ghi nguồn sự kiện, lưu mọi điều đã xảy ra, còn số dư chỉ là kết quả cộng dồn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cộng dồn và phần dư"
    checks:
      - "list(__import__('itertools').accumulate([50, -20, 10])) == [50, 30, 40] and 2350 // 1000 * 1000 == 2000 and 2350 - 2000 == 350 == 2350 % 1000"
    steps:
      - show: |
          <table class="t"><tr><th>số cộng vào</th><th>+50</th><th>−20</th><th>+10</th></tr>
          <tr><td>cộng dồn từ 0</td><td>50</td><td>30</td><td>40</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Trước hết, ôn phép cộng dồn. Bắt đầu từ 0, cộng 50 được 50, cộng âm 20 được 30, cộng 10 được 40. Mỗi ô dòng dưới là tổng của mọi số từ đầu tới cột đó."
      - show: |
          <p>Phần dư: mốc tròn nghìn gần nhất không vượt 2350 là $2000$; còn lại $2350 - 2000 = 350$, chính là phần dư khi chia 2350 cho 1000.</p>
        say: "Thứ hai, ôn phần dư. Mốc tròn nghìn gần nhất không vượt quá 2350 là 2000, còn lại 2350 trừ 2000 bằng 350. Con số 350 chính là phần dư khi chia 2350 cho 1000, và lát nữa nó cho biết phải làm lại bao nhiêu việc."
      - show: |
          <p>Ở bài 3, mỗi cập nhật của một khoá mang <b>số phiên bản</b> tăng dần 1, 2, 3… Ở đây mỗi sự kiện của một tài khoản cũng có <b>số thứ tự</b> trong nhật ký: sự kiện thứ 1, thứ 2, thứ 3…</p>
        say: "Ở bài 3, mỗi cập nhật của một khoá mang số phiên bản tăng dần 1, 2, 3. Ở đây mỗi sự kiện của một tài khoản cũng có số thứ tự trong nhật ký, sự kiện thứ nhất, thứ hai, thứ ba, và cứ thế."

  - id: sym
    kind: symbol
    title: "Giải mã: nhật ký sự kiện, gấp, ảnh chụp"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>nhật ký sự kiện</b></td><td>chỉ ghi thêm vào cuối: “đã nạp 100”, “đã rút 30”… — không sửa, không xoá</td></tr>
          <tr><td><b>gấp</b></td><td>đi từ trạng thái đầu, áp lần lượt từng sự kiện → trạng thái hiện tại</td></tr>
          <tr><td><b>ảnh chụp</b></td><td>lưu trạng thái đã gấp tại sự kiện thứ $s$, $2s$, … để khỏi gấp lại từ đầu</td></tr>
          <tr><td><b>sự kiện bù trừ</b></td><td>sai thì ghi thêm sự kiện sửa (“hoàn 20 do trừ nhầm”), lịch sử giữ nguyên</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng có bốn khái niệm. Nhật ký sự kiện chỉ ghi thêm vào cuối, như đã nạp 100, đã rút 30, và không sửa, không xoá. Gấp là đi từ trạng thái đầu, áp lần lượt từng sự kiện để ra trạng thái hiện tại. Ảnh chụp là lưu trạng thái đã gấp tại sự kiện thứ s, 2 s, và tiếp tục như vậy, để khỏi gấp lại từ đầu. Sự kiện bù trừ là khi sai thì ghi thêm sự kiện sửa, như hoàn 20 do trừ nhầm, còn lịch sử giữ nguyên."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Nhật ký là dải băng, số dư là con trỏ chạy trên đó"
    checks:
      - "list(__import__('itertools').accumulate([100, -30, 50, -20])) == [100, 70, 120, 100] and 4999 - 4000 == 999"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arE4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="160" y="40" width="230" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="275" y="82" font-size="24" text-anchor="middle" fill="#1f2937">1. nạp 100</text><line x1="275" y1="108" x2="275" y2="140" stroke="#1f2937" stroke-width="3" marker-end="url(#arE4)"/><text x="275" y="178" font-size="26" font-weight="bold" text-anchor="middle" fill="#059669">số dư 100</text><rect x="460" y="40" width="230" height="64" rx="8" fill="#fde7d9" stroke="#1f2937" stroke-width="2"/><text x="575" y="82" font-size="24" text-anchor="middle" fill="#1f2937">2. rút 30</text><line x1="575" y1="108" x2="575" y2="140" stroke="#1f2937" stroke-width="3" marker-end="url(#arE4)"/><text x="575" y="178" font-size="26" font-weight="bold" text-anchor="middle" fill="#059669">số dư 70</text><rect x="760" y="40" width="230" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="875" y="82" font-size="24" text-anchor="middle" fill="#1f2937">3. nạp 50</text><line x1="875" y1="108" x2="875" y2="140" stroke="#1f2937" stroke-width="3" marker-end="url(#arE4)"/><text x="875" y="178" font-size="26" font-weight="bold" text-anchor="middle" fill="#059669">số dư 120</text><rect x="1060" y="40" width="230" height="64" rx="8" fill="#fde7d9" stroke="#1f2937" stroke-width="2"/><text x="1175" y="82" font-size="24" text-anchor="middle" fill="#1f2937">4. rút 20</text><line x1="1175" y1="108" x2="1175" y2="140" stroke="#1f2937" stroke-width="3" marker-end="url(#arE4)"/><text x="1175" y="178" font-size="26" font-weight="bold" text-anchor="middle" fill="#059669">số dư 100</text><text x="1390" y="82" font-size="22" text-anchor="middle" fill="#6b7280">chỉ ghi thêm</text><line x1="120" y1="300" x2="1400" y2="300" stroke="#6b7280" stroke-width="3"/><line x1="160" y1="270" x2="160" y2="330" stroke="#2a78d6" stroke-width="5"/><text x="160" y="360" font-size="21" text-anchor="middle" fill="#2a78d6">ảnh 1000</text><line x1="435" y1="270" x2="435" y2="330" stroke="#2a78d6" stroke-width="5"/><text x="435" y="360" font-size="21" text-anchor="middle" fill="#2a78d6">ảnh 2000</text><line x1="710" y1="270" x2="710" y2="330" stroke="#2a78d6" stroke-width="5"/><text x="710" y="360" font-size="21" text-anchor="middle" fill="#2a78d6">ảnh 3000</text><line x1="985" y1="270" x2="985" y2="330" stroke="#2a78d6" stroke-width="5"/><text x="985" y="360" font-size="21" text-anchor="middle" fill="#2a78d6">ảnh 4000</text><rect x="985" y="285" width="275" height="30" fill="#fde7d9" stroke="#eb6834" stroke-width="2"/><line x1="1260" y1="250" x2="1260" y2="330" stroke="#b91c1c" stroke-width="4"/><text x="1260" y="240" font-size="21" text-anchor="middle" fill="#b91c1c">bây giờ: sự kiện 4999</text><text x="1122" y="400" font-size="22" text-anchor="middle" fill="#eb6834">phát lại 999 sự kiện</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Dòng trên là nhật ký của một tài khoản, bốn ô sự kiện nằm nối đuôi, và ô mới chỉ được ghi thêm vào cuối. Mũi tên dưới mỗi ô là số dư sau khi cộng dồn tới ô đó, 100, 70, 120, rồi 100. Dòng dưới là một nhật ký dài hơn nhiều, cứ mỗi 1000 sự kiện lại lưu một ảnh chụp số dư, vạch xanh. Đang ở sự kiện 4999 thì chỉ cần lấy ảnh ở 4000 rồi phát lại 999 sự kiện trong đoạn cam."

  - id: example
    kind: example
    title: "Gấp bốn sự kiện; một triệu sự kiện với ảnh chụp"
    checks:
      - "alg.fold_events([100, -30, 50, -20]) == 100 and [alg.fold_events([100, -30, 50, -20][:i]) for i in range(1, 5)] == [100, 70, 120, 100]"
      - "alg.replay_cost(10**6, 1000) == 999 and alg.replay_cost(10**6, 0) == 10**6"
    steps:
      - show: |
          <table class="t"><tr><th>sự kiện</th><th>phép tính</th><th>số dư sau sự kiện</th></tr>
          <tr><td>đã nạp 100</td><td>$0 + 100$</td><td>100</td></tr>
          <tr><td>đã rút 30</td><td>$100 - 30$</td><td>70</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước một, gấp hai sự kiện đầu, bắt đầu từ số dư 0. Đã nạp 100, nên 0 cộng 100 bằng 100. Đã rút 30, nên 100 trừ 30 bằng 70."
      - show: |
          <table class="t"><tr><th>sự kiện</th><th>phép tính</th><th>số dư sau sự kiện</th></tr>
          <tr><td>đã nạp 50</td><td>$70 + 50$</td><td>120</td></tr>
          <tr><td>đã rút 20</td><td>$120 - 20$</td><td>$\hl{100}$</td></tr></table>
          <p>Khách quên lần rút 20 — nhật ký trả lời được ngay.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước hai, gấp tiếp hai sự kiện sau. Đã nạp 50, nên 70 cộng 50 bằng 120. Đã rút 20, nên 120 trừ 20 bằng 100. Khách quên lần rút 20, và nhật ký trả lời được ngay."
      - clear: true
        show: |
          <p><b>Bước 3 — một tài khoản có 1 triệu sự kiện, chụp ảnh mỗi 1000.</b> Tệ nhất là đang ở sự kiện 999 999: ảnh gần nhất ở 999 000, phải phát lại $999\,999 - 999\,000 = \hl{999}$ sự kiện, thay vì gấp 1 triệu.</p>
        say: "Bước ba, một tài khoản có 1 triệu sự kiện, chụp ảnh mỗi 1000 sự kiện. Tệ nhất là đang ở sự kiện 999 nghìn 999, vì ảnh gần nhất nằm ở 999 nghìn, nên phải phát lại 999 sự kiện. Đó là thay vì phải gấp cả 1 triệu sự kiện."
      - show: |
          <table class="t"><tr><th>bước 4 — cái giá</th><th>không chụp</th><th>chụp mỗi 1000</th></tr>
          <tr><td>phát lại tối đa</td><td>1 000 000</td><td>999</td></tr>
          <tr><td>số ảnh phải lưu</td><td>0</td><td>$\frac{1\,000\,000}{1000} = 1000$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước bốn, đặt cái giá lên bàn cân. Không chụp thì phát lại tối đa 1 triệu sự kiện, còn chụp mỗi 1000 thì tối đa 999. Đổi lại phải lưu 1 triệu chia 1000, bằng 1000 ảnh, và nhật ký vẫn giữ nguyên đủ mọi sự kiện."

  - id: check
    kind: check
    title: "Tự kiểm: dựng từ ảnh có khớp gấp từ đầu không"
    checks:
      - "(lambda ev: all(ev[k - 1] + sum([100, -30, 50, -20][k:]) == 100 for k in range(1, 5)))(list(__import__('itertools').accumulate([100, -30, 50, -20])))"
      - "max(n - n // 1000 * 1000 for n in range(1, 10**6 + 1)) == 999 == alg.replay_cost(10**6, 1000) and [n - n // 1000 * 1000 for n in (999, 1000, 1999, 2500)] == [999, 0, 999, 500]"
    steps:
      - show: |
          <table class="t"><tr><th>ảnh chụp sau sự kiện</th><th>số dư trong ảnh</th><th>phát lại phần còn lại</th><th>kết quả</th></tr>
          <tr><td>thứ 2</td><td>70</td><td>$70 + 50 - 20$</td><td>100 ✓</td></tr>
          <tr><td>thứ 3</td><td>120</td><td>$120 - 20$</td><td>100 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, dựng số dư từ ảnh chụp thay vì gấp từ đầu, vì hai cách phải ra cùng một số. Lấy ảnh sau sự kiện thứ hai, số dư 70, phát lại phần còn lại, 70 cộng 50 trừ 20 bằng 100. Lấy ảnh sau sự kiện thứ ba, số dư 120, trừ 20 cũng bằng 100, khớp."
      - show: |
          <table class="t"><tr><th>đang ở sự kiện</th><th>999</th><th>1000</th><th>1999</th><th>2500</th></tr>
          <tr><td>phải phát lại</td><td>999</td><td>0</td><td>999</td><td>500</td></tr></table>
          <p>Cho máy thử <b>mọi</b> vị trí từ 1 tới 1 triệu: lớn nhất là $\hl{999}$ ✓.</p>
        focus: [1, "1.2", 2]
        say: "Còn con số 999, ta thử từng vị trí, vì số phải phát lại chính là phần dư khi chia vị trí cho 1000. Ở 999 phải phát lại 999, ở 1000 thì 0, ở 1999 lại 999, ở 2500 thì 500. Cho máy thử mọi vị trí từ 1 tới 1 triệu, lớn nhất đúng là 999."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc và 1 lỗi người đi làm"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Sửa hoặc xoá sự kiện cũ <b class="red">(mất dấu vết, các bảng đọc lệch nhau)</b>
          <br><span class="note">Các dịch vụ khác đã đọc sự kiện đó. Sai thì ghi <b>sự kiện bù trừ</b>; dữ liệu cá nhân phải xoá theo luật thì mã hoá mỗi người một khoá rồi huỷ khoá.</span></div>
        say: "Lỗi thứ nhất, sửa hoặc xoá sự kiện cũ, nên mất dấu vết và các bảng đọc lệch nhau. Các dịch vụ khác đã đọc sự kiện đó rồi. Nếu sai, hãy ghi thêm một sự kiện bù trừ thay vì sửa. Dữ liệu cá nhân phải xoá theo luật thì mã hoá mỗi người một khoá, rồi huỷ khoá đó."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Gấp có tác dụng phụ <b class="red">(dựng lại là gửi lại thư cho khách)</b>
          <br><span class="note">Hàm gấp chỉ được <b>tính</b> trạng thái. Gửi thư, gọi dịch vụ ngoài thuộc về người nghe sự kiện mới, không chạy lại khi phát lại.</span></div>
        say: "Lỗi thứ hai, hàm gấp có tác dụng phụ, nên dựng lại là gửi lại thư cho khách. Hàm gấp chỉ được tính trạng thái. Gửi thư, hay gọi dịch vụ ngoài, thuộc về người nghe sự kiện mới, và không chạy lại khi phát lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng ghi nguồn sự kiện cho mọi thứ <b class="red">(phức tạp mà không được gì)</b>
          <br><span class="note">Hợp với nơi lịch sử có giá trị: tiền, kho, hồ sơ có kiểm toán. Danh mục sản phẩm sửa tên thì bảng thường là đủ.</span></div>
        say: "Lỗi thứ ba, dùng ghi nguồn sự kiện cho mọi thứ, nên phức tạp mà không được gì. Nó hợp với nơi lịch sử có giá trị, như tiền, kho, và hồ sơ có kiểm toán. Danh mục sản phẩm chỉ sửa tên thì bảng thường là đủ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đổi hàm gấp nhưng vẫn dùng ảnh chụp cũ <b class="red">(cùng nhật ký, ba số dư)</b></div>
          <table class="t"><tr><th>luật mới: mỗi lần rút thu phí 1</th><th>phép tính</th><th>số dư</th></tr>
          <tr><td>hàm gấp cũ, gấp từ đầu</td><td>$100 - 30 + 50 - 20$</td><td>100</td></tr>
          <tr><td>hàm gấp mới, gấp từ đầu</td><td>$100 - 31 + 50 - 21$</td><td>98</td></tr>
          <tr><td>ảnh cũ sau sự kiện 2, phát lại bằng hàm mới</td><td>$70 + 50 - 21$</td><td>99</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0, 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đổi hàm gấp nhưng vẫn dùng ảnh chụp cũ. Giả sử luật mới là mỗi lần rút thu phí 1, thì gấp từ đầu bằng hàm cũ vẫn ra 100. Gấp từ đầu bằng hàm mới ra 100 trừ 31 cộng 50 trừ 21, bằng 98. Nhưng nếu lấy ảnh cũ sau sự kiện thứ hai, số dư 70, rồi phát lại bằng hàm mới, thì được 70 cộng 50 trừ 21, bằng 99. Ảnh chụp chỉ là kết quả tính sẵn của một phiên bản hàm gấp. Người làm nghề ghi phiên bản hàm gấp vào ảnh, và đổi hàm thì bỏ ảnh cũ, dựng lại từ nhật ký."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.fold_events([200, -50, -80, 30]) == 100 and alg.fold_events([-80, 80], 100) == 100 and alg.replay_cost(50000, 500) == 499"
      - "list(__import__('itertools').accumulate([200, -50, -80, 30])) == [200, 150, 70, 100] and alg.fold_events([200, -50, -80, 30, 80]) == 180 and max(n % 500 for n in range(1, 50001)) == 499"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Gấp: nạp 200, rút 50, rút 80, nạp 30. Số dư?</td></tr>
          <tr><td>2</td><td>Phát hiện lần rút 80 là trừ nhầm. Ghi gì vào nhật ký?</td></tr>
          <tr><td>3</td><td>Chụp ảnh mỗi 500 sự kiện: phát lại tối đa bao nhiêu sự kiện?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, gấp các sự kiện nạp 200, rút 50, rút 80, nạp 30, thì số dư là bao nhiêu? Câu hai, phát hiện lần rút 80 là trừ nhầm, thì ghi gì vào nhật ký? Câu ba, chụp ảnh mỗi 500 sự kiện thì phải phát lại tối đa bao nhiêu sự kiện? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>① sự kiện</th><th>nạp 200</th><th>rút 50</th><th>rút 80</th><th>nạp 30</th></tr>
          <tr><td>số dư</td><td>200</td><td>150</td><td>70</td><td>$\hl{100}$</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Đáp án câu một, gấp từng sự kiện từ 0. Nạp 200 được 200, rút 50 còn 150, rút 80 còn 70. Cuối cùng nạp 30 được 100."
      - show: |
          <p>② Ghi thêm sự kiện bù trừ “đã hoàn 80 do trừ nhầm”: $100 + 80 = 180$; lần rút 80 vẫn nằm trong lịch sử.</p>
          <p>③ Xa ảnh nhất là ngay trước ảnh kế tiếp (sự kiện 499, 999…): phát lại tối đa $\hl{499}$ sự kiện sau ảnh chụp gần nhất.</p>
        focus: [1, 1, 2, 2]
        say: "Câu hai, không sửa lần rút 80, mà ghi thêm sự kiện bù trừ đã hoàn 80 do trừ nhầm. Số dư thành 100 cộng 80 bằng 180, và lần rút 80 vẫn nằm trong lịch sử. Câu ba, vị trí xa ảnh nhất là ngay trước ảnh kế tiếp, ví dụ sự kiện 499 hay 999. Vậy phát lại tối đa 499 sự kiện sau ảnh chụp gần nhất."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">lưu sự kiện, chỉ ghi thêm</span><span class="a">→</span>
          <span class="n">trạng thái = gấp các sự kiện</span><span class="a">→</span>
          <span class="n">ảnh chụp giới hạn số sự kiện phát lại</span><span class="a">→</span>
          <span class="n">sai thì ghi sự kiện bù trừ</span></div>
        say: "Tổng kết lại, ta lưu sự kiện và chỉ ghi thêm, còn trạng thái là kết quả gấp các sự kiện. Ảnh chụp giới hạn số sự kiện phải phát lại, và khi sai thì ghi sự kiện bù trừ."
      - show: |
          <div class="box key"><b>Tư duy:</b> trạng thái là câu trả lời; lịch sử sự kiện là <b>bằng chứng</b> — giữ bằng chứng thì luôn tính lại được câu trả lời.</div>
        say: "Điều cần mang theo, trạng thái là câu trả lời, còn lịch sử sự kiện là bằng chứng, nên giữ bằng chứng thì luôn tính lại được câu trả lời."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>tách mô hình ghi và mô hình đọc</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học cách tách mô hình ghi và mô hình đọc. Hẹn gặp bạn ở bài tiếp theo."
