id: L00
course: EVT
series: "EVT · Kiến trúc hướng sự kiện"
title: "Bài 0 — Sự kiện, lệnh và truy vấn: vì sao hướng sự kiện"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/evt.yaml L00; audit/evt/verify_evt.py L00; M. Fowler, What do you mean by “Event-Driven”? (2017); G. Hohpe, B. Woolf, Enterprise Integration Patterns (2003), chương 3"
assumes: [arith, frac, cdot]
# Quy ước: “lệnh” = yêu cầu một bên làm việc gì (có thể bị từ chối); “sự kiện” = thông báo điều ĐÃ xảy ra, đặt tên ở thì quá khứ; “truy vấn” = hỏi trạng thái.
#   Số kết nối điểm–điểm tối đa giữa n dịch vụ = n(n − 1)/2 (alg.point_to_point_links). 10 dịch vụ là SỐ MINH HOẠ.
objectives:
  - "Phân biệt sự kiện, lệnh và truy vấn"
  - "Ước lượng số kết nối điểm–điểm so với qua kênh sự kiện"
  - "Biết sự kiện tách phụ thuộc lúc chạy, không tách phụ thuộc về nghĩa"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Thêm một dịch vụ, lại sửa dịch vụ đặt hàng"
    checks:
      - "alg.point_to_point_links(10) == 45"
    steps:
      - show: |
          <p>Khi có đơn hàng mới, dịch vụ đặt hàng phải gọi lần lượt: kho, thanh toán, giao hàng, thư điện tử, điểm thưởng. Công ty muốn thêm dịch vụ chống gian lận — lại phải sửa dịch vụ đặt hàng. Và khi thư điện tử chậm, cả việc đặt hàng chậm theo.</p>
          <div class="box key">Hôm nay: <b>hướng sự kiện</b> — dịch vụ đặt hàng chỉ <b>công bố</b> “đơn đã được tạo”, ai cần thì tự nghe.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, khi có đơn hàng mới, dịch vụ đặt hàng phải gọi lần lượt kho, thanh toán, giao hàng, thư điện tử, và điểm thưởng. Công ty muốn thêm dịch vụ chống gian lận, và lại phải sửa dịch vụ đặt hàng. Khi thư điện tử chậm, cả việc đặt hàng chậm theo. Hôm nay ta học kiến trúc hướng sự kiện, nơi dịch vụ đặt hàng chỉ công bố đơn đã được tạo, và ai cần thì tự nghe."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đếm số cặp trong một nhóm"
    checks:
      - "list(__import__('itertools').combinations('ABCD', 2)) == [('A', 'B'), ('A', 'C'), ('A', 'D'), ('B', 'C'), ('B', 'D'), ('C', 'D')] and 4 * 3 == 12 and 12 // 2 == 6 == alg.point_to_point_links(4)"
    steps:
      - show: |
          <table class="t"><tr><th>4 dịch vụ A, B, C, D</th><th>các cặp</th><th>số cặp</th></tr>
          <tr><td>liệt kê</td><td>AB, AC, AD, BC, BD, CD</td><td>6</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Trước hết, ôn cách đếm số cặp trong một nhóm. Với 4 dịch vụ A, B, C, D, liệt kê hết các cặp, ta được A với B, A với C, A với D, B với C, B với D, và C với D. Tổng cộng 6 cặp."
      - show: |
          $$\frac{n \cdot (n - 1)}{2}, \quad n = 4: \quad \frac{4 \cdot 3}{2} = \frac{12}{2} = 6$$
        say: "Không cần liệt kê, mỗi dịch vụ ghép với n trừ 1 dịch vụ còn lại, nên có n nhân n trừ 1 lần ghép. Nhưng mỗi cặp bị đếm hai lần, A ghép B và B ghép A là một, nên chia 2. Với n bằng 4, ta có 4 nhân 3 bằng 12, chia 2 được 6, khớp với cách liệt kê."

  - id: sym
    kind: symbol
    title: "Giải mã: lệnh, sự kiện, truy vấn"
    steps:
      - show: |
          <table class="t"><tr><th>loại</th><th>ví dụ</th><th>người gửi biết gì về người nhận</th></tr>
          <tr><td><b>lệnh</b></td><td>“trừ kho 2 món cho đơn 42”</td><td>biết chính xác ai làm, chờ kết quả, có thể bị từ chối</td></tr>
          <tr><td><b>sự kiện</b></td><td>“đơn 42 đã được tạo”</td><td><b>không</b> biết ai nghe, không chờ ai</td></tr>
          <tr><td><b>truy vấn</b></td><td>“đơn 42 đang ở trạng thái nào?”</td><td>biết ai trả lời, không đổi trạng thái</td></tr></table>
          <p>Sự kiện đặt tên ở <b>thì quá khứ</b>: đã xảy ra, không ai phản đối được. Người nhận tự quyết định làm gì.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Bảng so ba loại thông điệp. Lệnh như trừ kho 2 món cho đơn 42, người gửi biết chính xác ai làm, chờ kết quả, và có thể bị từ chối. Sự kiện như đơn 42 đã được tạo, người gửi không biết ai nghe, và không chờ ai. Truy vấn như đơn 42 đang ở trạng thái nào, người gửi biết ai trả lời, và không làm đổi trạng thái. Sự kiện đặt tên ở thì quá khứ, vì nó đã xảy ra và không ai phản đối được. Người nhận tự quyết định làm gì."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Lưới chằng chịt hay một ngôi sao"
    checks:
      - "alg.point_to_point_links(5) == 10 and len(list(__import__('itertools').combinations(range(5), 2))) == 10"
    steps:
      - show: |
          <div><svg width="1500" height="470" viewBox="0 0 1500 470"><g stroke="#eb6834" stroke-width="3"><line x1="370" y1="65" x2="513" y2="169"/><line x1="370" y1="65" x2="458" y2="336"/><line x1="370" y1="65" x2="282" y2="336"/><line x1="370" y1="65" x2="227" y2="169"/><line x1="513" y1="169" x2="458" y2="336"/><line x1="513" y1="169" x2="282" y2="336"/><line x1="513" y1="169" x2="227" y2="169"/><line x1="458" y1="336" x2="282" y2="336"/><line x1="458" y1="336" x2="227" y2="169"/><line x1="282" y1="336" x2="227" y2="169"/></g><g stroke="#2a78d6" stroke-width="3"><line x1="1130" y1="55" x2="1130" y2="215"/><line x1="1282" y1="166" x2="1130" y2="215"/><line x1="1224" y1="344" x2="1130" y2="215"/><line x1="1036" y1="344" x2="1130" y2="215"/><line x1="978" y1="166" x2="1130" y2="215"/></g><circle cx="370" cy="65" r="52" fill="#fde7d9" stroke="#1f2937" stroke-width="3"/><text x="370" y="72" font-size="19" text-anchor="middle" fill="#1f2937">đặt hàng</text><circle cx="513" cy="169" r="52" fill="#fde7d9" stroke="#1f2937" stroke-width="3"/><text x="513" y="176" font-size="19" text-anchor="middle" fill="#1f2937">kho</text><circle cx="458" cy="336" r="52" fill="#fde7d9" stroke="#1f2937" stroke-width="3"/><text x="458" y="343" font-size="19" text-anchor="middle" fill="#1f2937">thanh toán</text><circle cx="282" cy="336" r="52" fill="#fde7d9" stroke="#1f2937" stroke-width="3"/><text x="282" y="343" font-size="19" text-anchor="middle" fill="#1f2937">giao hàng</text><circle cx="227" cy="169" r="52" fill="#fde7d9" stroke="#1f2937" stroke-width="3"/><text x="227" y="176" font-size="19" text-anchor="middle" fill="#1f2937">thư</text><circle cx="1130" cy="55" r="52" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1130" y="62" font-size="19" text-anchor="middle" fill="#1f2937">đặt hàng</text><circle cx="1282" cy="166" r="52" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1282" y="173" font-size="19" text-anchor="middle" fill="#1f2937">kho</text><circle cx="1224" cy="344" r="52" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1224" y="351" font-size="19" text-anchor="middle" fill="#1f2937">thanh toán</text><circle cx="1036" cy="344" r="52" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1036" y="351" font-size="19" text-anchor="middle" fill="#1f2937">giao hàng</text><circle cx="978" cy="166" r="52" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="978" y="173" font-size="19" text-anchor="middle" fill="#1f2937">thư</text><rect x="1060" y="190" width="140" height="50" rx="10" fill="#059669"/><text x="1130" y="223" font-size="21" text-anchor="middle" fill="#ffffff" font-weight="bold">kênh sự kiện</text><line x1="750" y1="20" x2="750" y2="400" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 8"/><g font-size="25" text-anchor="middle" font-weight="bold"><text x="370" y="445" fill="#eb6834">gọi thẳng nhau: 10 đường nối</text><text x="1130" y="445" fill="#2a78d6">qua một kênh: 5 đường nối</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình bên trái là 5 dịch vụ gọi thẳng nhau, mỗi cặp có thể cần một đường nối, nên có tới 10 đường màu cam. Hình bên phải là cùng 5 dịch vụ đó, nhưng mỗi dịch vụ chỉ nối với một kênh sự kiện ở giữa, nên chỉ có 5 đường màu xanh. Người gửi đặt sự kiện vào kênh, người nhận lấy sự kiện từ kênh, hai bên không cần biết nhau. Thêm một dịch vụ vào bên phải chỉ là thêm một tia nữa vào ngôi sao."

  - id: example
    kind: example
    title: "10 dịch vụ: 45 đường nối hay 10"
    checks:
      - "alg.point_to_point_links(10) == 45 and alg.point_to_point_links(11) - alg.point_to_point_links(10) == 10"
    steps:
      - show: |
          <p><b>Bước 1 — gọi điểm–điểm.</b> Mỗi dịch vụ có thể gọi 9 dịch vụ còn lại; mỗi cặp đếm hai lần:</p>
          $$\frac{10 \cdot 9}{2} = \frac{90}{2} = \hl{45} \text{ kết nối tối đa}$$
        focus: [1, 2]
        say: "Bước một, nối 10 dịch vụ bằng cách gọi điểm tới điểm. Mỗi dịch vụ có thể gọi 9 dịch vụ còn lại, được 10 nhân 9 bằng 90, nhưng mỗi cặp bị đếm hai lần, nên chia 2, còn tối đa 45 kết nối."
      - show: |
          <p><b>Bước 2 — qua một kênh sự kiện.</b> Mỗi dịch vụ chỉ nối với kênh: $10 \cdot 1 = 10$ kết nối.</p>
        say: "Bước hai, nối qua một kênh sự kiện. Mỗi dịch vụ chỉ có một kết nối tới kênh, nên 10 dịch vụ cần 10 nhân 1, bằng 10 kết nối."
      - clear: true
        show: |
          <table class="t"><tr><th>thêm dịch vụ thứ 11</th><th>trước</th><th>sau</th><th>thêm</th></tr>
          <tr><td>gọi điểm–điểm</td><td>45</td><td>$\frac{11 \cdot 10}{2} = 55$</td><td>tới 10, sửa các dịch vụ liên quan</td></tr>
          <tr><td>qua một kênh sự kiện</td><td>10</td><td>11</td><td>1, không sửa ai</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3"]
        say: "Bước ba, thêm dịch vụ thứ 11. Gọi điểm tới điểm, số kết nối tối đa từ 45 lên 11 nhân 10 chia 2, bằng 55. Như vậy thêm tới 10 kết nối, và phải sửa các dịch vụ liên quan. Qua kênh sự kiện thì từ 10 lên 11, chỉ thêm 1 kết nối, không sửa ai."
      - show: |
          <div class="box key"><b>Bước 4 — quyết định.</b> Dịch vụ chống gian lận mới chỉ cần <b>đăng ký nghe</b> sự kiện “đơn đã được tạo”. Dịch vụ đặt hàng không đổi một dòng mã.</div>
        say: "Bước bốn, quyết định cho tình huống mở đầu. Dịch vụ chống gian lận mới chỉ cần đăng ký nghe sự kiện đơn đã được tạo. Dịch vụ đặt hàng không đổi một dòng mã."

  - id: check
    kind: check
    title: "Tự kiểm: thêm từng dịch vụ một"
    checks:
      - "list(__import__('itertools').accumulate(range(1, 10))) == [1, 3, 6, 10, 15, 21, 28, 36, 45] and sum(range(10)) == 45 == alg.point_to_point_links(10) and all(sum(range(n)) == alg.point_to_point_links(n) for n in range(1, 30))"
    steps:
      - show: |
          <table class="t"><tr><th>dịch vụ thứ</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>
          <tr><td>đường mới</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td></tr>
          <tr><td>cộng dồn</td><td>1</td><td>3</td><td>6</td><td>10</td><td>15</td><td>21</td><td>28</td><td>36</td><td>$\hl{45}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, thêm từng dịch vụ một và đếm số đường mới, vì dịch vụ thứ k chỉ cần nối với k trừ 1 dịch vụ đã có. Dịch vụ thứ hai thêm 1 đường, thứ ba thêm 2, cứ thế tới dịch vụ thứ mười thêm 9 đường. Cộng dồn lại, 1, 3, 6, 10, rồi tới 45. Kết quả khớp với công thức 10 nhân 9 chia 2."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc và 1 lỗi người đi làm"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Gửi lệnh đội lốt sự kiện <b class="red">(vẫn phụ thuộc chặt)</b>
          <br><span class="note">“Hãy gửi thư cho khách 42” phát lên kênh sự kiện vẫn là lệnh: người gửi chờ đúng một bên làm. Sự kiện mô tả <b>điều đã xảy ra</b>; việc ai làm gì là quyết định của người nhận.</span></div>
        say: "Lỗi thứ nhất, gửi lệnh đội lốt sự kiện, nên vẫn phụ thuộc chặt. Câu hãy gửi thư cho khách 42 phát lên kênh sự kiện vẫn là lệnh, vì người gửi chờ đúng một bên làm. Sự kiện mô tả điều đã xảy ra, còn việc ai làm gì là quyết định của người nhận."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ hướng sự kiện là hết phụ thuộc <b class="red">(phụ thuộc về nghĩa vẫn còn)</b>
          <br><span class="note">Đổi ý nghĩa trường “tổng tiền” (có hay không có thuế) làm sai mọi người nhận, dù không ai gọi ai. <b>Lược đồ sự kiện</b> (bản mô tả sự kiện có những trường nào, mỗi trường nghĩa là gì) là một hợp đồng.</span></div>
        say: "Lỗi thứ hai, nghĩ hướng sự kiện là hết phụ thuộc, trong khi phụ thuộc về nghĩa vẫn còn. Đổi ý nghĩa trường tổng tiền, có hay không có thuế, làm sai mọi người nhận, dù không ai gọi ai. Lược đồ sự kiện, tức bản mô tả sự kiện có những trường nào và mỗi trường nghĩa là gì, chính là một hợp đồng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng sự kiện cho việc cần trả lời ngay <b class="red">(người dùng ngồi chờ)</b>
          <br><span class="note">“Còn hàng không?” cần câu trả lời trong vài trăm mi li giây — dùng truy vấn đồng bộ. Hướng sự kiện hợp với việc làm <b>sau</b>: thư, điểm thưởng, thống kê.</span></div>
        say: "Lỗi thứ ba, dùng sự kiện cho việc cần trả lời ngay, nên người dùng ngồi chờ. Câu hỏi còn hàng không cần câu trả lời trong vài trăm mi li giây, nên hãy dùng truy vấn đồng bộ. Hướng sự kiện hợp với những việc làm sau, như gửi thư, cộng điểm thưởng, và thống kê."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Sự kiện chỉ mang mã đơn, mọi người nhận <b>gọi ngược</b> lại hỏi chi tiết <b class="red">(phụ thuộc lúc chạy quay về)</b></div>
          <table class="t"><tr><th>1000 đơn mỗi phút, 5 người nhận</th><th>lần gọi ngược mỗi phút</th><th>dịch vụ đặt hàng chết thì</th></tr>
          <tr><td>sự kiện chỉ có “đơn 42 đã được tạo”</td><td>$5 \cdot 1000 = 5000$</td><td>cả 5 người nhận kẹt theo</td></tr>
          <tr><td>sự kiện mang sẵn món hàng, số tiền, địa chỉ</td><td>0</td><td>người nhận vẫn làm tiếp</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, sự kiện chỉ mang mã đơn, nên mọi người nhận phải gọi ngược lại dịch vụ đặt hàng để hỏi chi tiết. Với 1000 đơn mỗi phút và 5 người nhận, dịch vụ đặt hàng phải trả lời thêm 5 nhân 1000, bằng 5000 lần gọi ngược mỗi phút. Tệ hơn, khi dịch vụ đặt hàng chết thì cả 5 người nhận kẹt theo, đúng cái phụ thuộc lúc chạy mà ta muốn bỏ. Nếu sự kiện mang sẵn món hàng, số tiền và địa chỉ, thì không còn lần gọi ngược nào. Người nhận vẫn làm tiếp được kể cả khi dịch vụ đặt hàng đang tắt."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.point_to_point_links(6) == 15 and 6 * 5 == 30 and 1 + 2 + 3 + 4 + 5 == 15"
    steps:
      - show: |
