id: L02
course: EVT
series: "EVT · Kiến trúc hướng sự kiện"
title: "Bài 2 — Người tiêu thụ lũy đẳng, thử lại và kênh thư chết"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/evt.yaml L02; audit/evt/verify_evt.py L02; G. Hohpe, B. Woolf, Enterprise Integration Patterns (2003) — Dead Letter Channel, Idempotent Receiver; tài liệu hàng đợi của các nhà cung cấp lớn — số lần nhận tối đa trước khi chuyển kênh thư chết (bản hiện hành, tên chỉ trên màn hình); bài 0"
assumes: [arith, cdot]
# Quy ước: một phân vùng xử lý TUẦN TỰ (để giữ thứ tự); “thông điệp độc” luôn lỗi dù thử bao nhiêu lần (dữ liệu hỏng, lỗi mã). Không có kênh thư chết thì người tiêu thụ
#   kẹt tại thông điệp đó; có thì thử k lần rồi chuyển sang kênh thư chết và đi tiếp (alg.consume_with_dlq). Lũy đẳng: lưu mã thông điệp đã xử lý, gặp lại thì bỏ qua.
objectives:
  - "Xử lý thông điệp độc không làm tắc cả phân vùng"
  - "Phân biệt lỗi tạm thời và lỗi vĩnh viễn khi thử lại"
  - "Thiết kế kênh thư chết có quy trình xử lý lại"
asr_reviewed:
  - {sentence: "Đáp án câu một, giải từng dòng.", reason: "ASR chép “Đáp án câu một, giải tương dung.” (0.714): lệch âm/thanh thuần Việt: từng dòng/tương dung — NOT_VERIFIED bằng tai người"}
  - {sentence: "Gom lại thành bảng.", reason: "ASR chép “gom lại thành bản.” (0.75): lệch âm/thanh thuần Việt: bảng/bản — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một thông điệp hỏng chặn 990 thông điệp lành"
    checks:
      - "alg.consume_with_dlq(1000, {10}) == (9, 0, None)"
      - "1000 - 10 == 990 and 1000 - alg.consume_with_dlq(1000, {10})[0] - 1 == 990"
    steps:
      - show: |
          <p>Dịch vụ giao hàng xử lý sự kiện theo thứ tự trong một phân vùng. Sự kiện thứ 10 có địa chỉ bị hỏng mã ký tự, lần nào xử lý cũng lỗi. Người tiêu thụ thử lại mãi — và <b>990 đơn</b> phía sau đứng chờ, dù không có lỗi gì. Khách gọi điện hỏi đơn đâu.</p>
          <div class="box key">Hôm nay: <b>thử lại có giới hạn</b>, <b>kênh thư chết</b>, và <b>người tiêu thụ lũy đẳng</b>.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, dịch vụ giao hàng xử lý sự kiện theo thứ tự trong một phân vùng. Sự kiện thứ 10 có địa chỉ bị hỏng mã ký tự, lần nào xử lý cũng lỗi. Người tiêu thụ thử lại mãi, và 990 đơn phía sau đứng chờ, dù không có lỗi gì. Khách gọi điện hỏi đơn đâu. Hôm nay ta học thử lại có giới hạn, kênh thư chết, và người tiêu thụ lũy đẳng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phân vùng đọc tuần tự, và lũy đẳng"
    checks:
      - "alg.consume_with_dlq(5, {3}) == (2, 0, None) and 5 - 3 == 2"
      - "len(set([5, 6, 6, 7])) == 3 and len([5, 6, 6, 7]) == 4"
    steps:
      - show: |
          <p>Ở khoá Kỹ thuật dữ liệu: một <b>phân vùng</b> là một nhật ký đánh số 1, 2, 3, …; người tiêu thụ đọc <b>tuần tự</b> và chỉ dời <b>vị trí đọc</b> qua thông điệp đã xử lý xong.</p>
          <table class="t"><tr><th>phân vùng 5 thông điệp, thông điệp 3 luôn lỗi</th><th>kết quả</th></tr>
          <tr><td>xử lý 1, 2</td><td>vị trí đọc dời tới 3</td></tr>
          <tr><td>thông điệp 3 lỗi, thử lại</td><td>đứng ở 3; 4 và 5 chờ</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Trước hết, ôn từ khoá Kỹ thuật dữ liệu, một phân vùng là một nhật ký đánh số 1, 2, 3. Người tiêu thụ đọc tuần tự, và chỉ dời vị trí đọc qua thông điệp đã xử lý xong. Xét phân vùng 5 thông điệp, trong đó thông điệp 3 luôn lỗi. Người tiêu thụ xử lý 1 và 2, vị trí đọc dời tới 3. Thông điệp 3 lỗi thì vị trí đọc đứng yên ở đó, và 2 thông điệp 4 và 5 phải chờ."
      - show: |
          <p>Ở khoá Kiến trúc hệ thống: <b>lũy đẳng</b> là làm hai lần cũng như làm một lần. Nhận các mã 5, 6, 6, 7 (mã 6 bị giao lại): giữ tập mã đã xử lý → 4 lần nhận, chỉ <b>3</b> lần xử lý thật.</p>
        say: "Ở khoá Kiến trúc hệ thống, lũy đẳng nghĩa là làm hai lần cũng như làm một lần. Giả sử nhận các thông điệp mã 5, 6, 6, 7, trong đó mã 6 bị giao lại. Người nhận giữ tập mã đã xử lý, nên 4 lần nhận chỉ thành 3 lần xử lý thật."

  - id: sym
    kind: symbol
    title: "Giải mã: lỗi tạm thời, thông điệp độc, kênh thư chết"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th><th>cách xử lý</th></tr>
          <tr><td><b>lỗi tạm thời</b></td><td>mạng chập chờn, dịch vụ khác đang quá tải</td><td>thử lại có lùi dần</td></tr>
          <tr><td><b>thông điệp độc</b></td><td>thử bao nhiêu lần cũng lỗi: dữ liệu hỏng, lỗi mã</td><td>sau k lần, chuyển đi để không chặn phía sau</td></tr>
          <tr><td><b>kênh thư chết</b></td><td>nơi cất thông điệp hỏng, kèm lý do lỗi và số lần thử</td><td>cảnh báo, người xem, sửa rồi phát lại</td></tr>
          <tr><td><b>người tiêu thụ lũy đẳng</b></td><td>xử lý một thông điệp hai lần có kết quả như một lần</td><td>lưu mã thông điệp đã xử lý</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng có bốn khái niệm. Lỗi tạm thời là mạng chập chờn, hay dịch vụ khác đang quá tải, nên thử lại có lùi dần. Thông điệp độc là thông điệp thử bao nhiêu lần cũng lỗi, do dữ liệu hỏng hay lỗi mã, nên sau k lần thì chuyển đi để không chặn phía sau. Kênh thư chết là nơi cất thông điệp hỏng, kèm lý do lỗi và số lần thử, để cảnh báo, có người xem, sửa, rồi phát lại. Người tiêu thụ lũy đẳng xử lý một thông điệp hai lần cũng có kết quả như một lần, bằng cách lưu mã các thông điệp đã xử lý."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cách ly cái hỏng để hàng đi tiếp"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arE2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="100" y="120" width="105" height="70" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="152" y="164" font-size="24" text-anchor="middle" fill="#1f2937">1</text><rect x="225" y="120" width="105" height="70" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="277" y="164" font-size="24" text-anchor="middle" fill="#1f2937">2</text><rect x="350" y="120" width="105" height="70" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="402" y="164" font-size="24" text-anchor="middle" fill="#1f2937">3</text><rect x="475" y="120" width="105" height="70" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="527" y="164" font-size="24" text-anchor="middle" fill="#1f2937">…</text><rect x="600" y="120" width="105" height="70" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="652" y="164" font-size="24" text-anchor="middle" fill="#1f2937">9</text><rect x="725" y="120" width="105" height="70" rx="6" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="777" y="164" font-size="24" text-anchor="middle" fill="#1f2937">10</text><rect x="850" y="120" width="105" height="70" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="902" y="164" font-size="24" text-anchor="middle" fill="#1f2937">11</text><rect x="975" y="120" width="105" height="70" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="1027" y="164" font-size="24" text-anchor="middle" fill="#1f2937">12</text><rect x="1100" y="120" width="105" height="70" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="1152" y="164" font-size="24" text-anchor="middle" fill="#1f2937">…</text><rect x="1225" y="120" width="105" height="70" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="1277" y="164" font-size="24" text-anchor="middle" fill="#1f2937">1000</text><path d="M747,118 C717,50 837,50 807,118" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arE2)"/><text x="777" y="45" font-size="22" text-anchor="middle" fill="#b91c1c">thử 3 lần</text><line x1="777" y1="192" x2="777" y2="300" stroke="#b91c1c" stroke-width="3" marker-end="url(#arE2)"/><rect x="637" y="305" width="280" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="777" y="343" font-size="22" text-anchor="middle" fill="#b91c1c" font-weight="bold">kênh thư chết</text><text x="947" y="343" font-size="20" fill="#1f2937">kèm lý do lỗi, chờ người sửa</text><g font-size="21" text-anchor="middle"><text x="390" y="240" fill="#059669">đã xử lý xong</text><text x="1100" y="240" fill="#1f2937">vẫn được xử lý tiếp</text></g><line x1="100" y1="405" x2="500" y2="405" stroke="#1f2937" stroke-width="3" marker-end="url(#arE2)"/><text x="520" y="412" font-size="20" fill="#1f2937">thứ tự đọc trong phân vùng</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ một phân vùng 1000 thông điệp, đọc từ trái sang phải. Các ô xanh đã xử lý xong, ô đỏ số 10 là thông điệp độc. Mũi tên vòng phía trên là ba lần thử, sau đó thông điệp 10 rơi xuống kênh thư chết, kèm lý do lỗi, chờ người sửa. Nhờ vậy vị trí đọc đi tiếp qua 11, 12, cho tới 1000."

  - id: example
    kind: example
    title: "1000 thông điệp, thông điệp thứ 10 độc"
    checks:
      - "alg.consume_with_dlq(1000, {10}) == (9, 0, None) and alg.consume_with_dlq(1000, {10}, 3) == (999, 1, 1002)"
    steps:
      - show: |
          <p><b>Bước 1 — thử lại mãi.</b> Xử lý xong 1 tới 9, tức <b>9</b> thông điệp. Tới 10 thì kẹt: $1000 - 10 = 990$ thông điệp lành phía sau đứng chờ, số lần thử tăng mãi.</p>
        say: "Bước một, chính sách thử lại mãi. Người tiêu thụ xử lý xong thông điệp 1 tới 9, tức 9 thông điệp. Tới thông điệp 10 thì kẹt, 1000 trừ 10 bằng 990 thông điệp lành phía sau đứng chờ, và số lần thử tăng mãi."
      - show: |
          <p><b>Bước 2 — thử 3 lần rồi chuyển kênh thư chết.</b> Thông điệp 10 thử 3 lần, rồi sang kênh thư chết; vị trí đọc đi tiếp: xử lý $1000 - 1 = \hl{999}$ thông điệp, kênh thư chết có <b>1</b>.</p>
        say: "Bước hai, thử 3 lần rồi chuyển kênh thư chết. Thông điệp 10 được thử 3 lần, rồi chuyển sang kênh thư chết, và vị trí đọc đi tiếp. Kết quả xử lý được 1000 trừ 1, bằng 999 thông điệp, và kênh thư chết có 1 thông điệp."
      - show: |
          <p><b>Bước 3 — tổng lần thử.</b> 999 thông điệp lành, mỗi cái 1 lần; thông điệp độc 3 lần: $999 + 3 = 1002$.</p>
        say: "Bước ba, đếm tổng lần thử. 999 thông điệp lành, mỗi cái thử 1 lần, cộng 3 lần cho thông điệp độc, được 999 cộng 3, bằng 1002 lần thử."
      - clear: true
        show: |
          <table class="t"><tr><th>chính sách</th><th>đã xử lý</th><th>kênh thư chết</th><th>tổng lần thử</th></tr>
          <tr><td>thử lại mãi</td><td>9 — rồi kẹt</td><td>0</td><td>vô hạn</td></tr>
          <tr><td>thử 3 lần rồi chuyển kênh thư chết</td><td>$\hl{999}$</td><td>1</td><td>$999 + 3 = 1002$</td></tr></table>
          <p><b>Bước 4</b> — thông điệp hỏng không mất: nằm ở kênh thư chết với lý do “lỗi mã ký tự”. Sửa dữ liệu rồi phát lại: $999 + 1 = 1000$ đơn đều được giao.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Gom lại thành bảng. Thử lại mãi thì xử lý 9 rồi kẹt, còn thử 3 lần rồi chuyển kênh thư chết thì xử lý 999, với 1002 lần thử. Bước bốn, thông điệp hỏng không mất, nó nằm ở kênh thư chết với lý do lỗi mã ký tự. Người phụ trách sửa dữ liệu rồi phát lại. Khi đó 999 cộng 1, bằng 1000 đơn đều được giao."
      - clear: true
        show: |
          <div class="box warn"><b>Lưu ý thứ tự.</b> Ở đây mỗi thông điệp là một đơn riêng. Nếu sau #10 còn thông điệp <b>của cùng đơn</b>, xử lý tiếp chúng rồi mới phát lại #10 là <b>sai thứ tự</b> của đơn đó.
          <br><span class="note">Khi thứ tự trong một đơn quan trọng: chuyển luôn các thông điệp sau của cùng đơn vào kênh thư chết (hoặc chặn riêng đơn đó) tới khi #10 được sửa.</span></div>
        focus: [1, 1, 1]
        say: "Một lưu ý về thứ tự, ở đây mỗi thông điệp là một đơn riêng. Nếu sau thông điệp 10 còn thông điệp của cùng đơn, mà ta xử lý tiếp chúng rồi mới phát lại thông điệp 10, thì thứ tự của đơn đó bị sai. Khi thứ tự trong một đơn quan trọng, hãy chuyển luôn các thông điệp sau của cùng đơn vào kênh thư chết, hoặc chặn riêng đơn đó, tới khi thông điệp 10 được sửa."

  - id: check
    kind: check
    title: "Tự kiểm: đếm lần thử theo từng đoạn"
    checks:
      - "9 * 1 + 3 + 990 * 1 == 1002 and sum(3 if i == 10 else 1 for i in range(1, 1001)) == 1002 == alg.consume_with_dlq(1000, {10}, 3)[2] and 9 + 990 == 999"
    steps:
      - show: |
          <table class="t"><tr><th>đoạn của phân vùng</th><th>số thông điệp</th><th>lần thử</th></tr>
          <tr><td>1 tới 9</td><td>9</td><td>9</td></tr>
          <tr><td>10 (độc)</td><td>1</td><td>3</td></tr>
          <tr><td>11 tới 1000</td><td>990</td><td>990</td></tr>
          <tr><td>cộng</td><td>đã xử lý $9 + 990 = 999$</td><td>$9 + 3 + 990 = \hl{1002}$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Kiểm bằng đường khác, chia phân vùng thành ba đoạn rồi đếm lần thử từng đoạn, vì mỗi đoạn có cách thử khác nhau. Đoạn 1 tới 9 có 9 thông điệp, 9 lần thử. Thông điệp độc số 10 tốn 3 lần thử. Đoạn 11 tới 1000 có 990 thông điệp, 990 lần thử. Cộng lại, đã xử lý 9 cộng 990 bằng 999, và tổng lần thử 9 cộng 3 cộng 990 bằng 1002, khớp kết quả."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc và 1 lỗi người đi làm"
    checks:
      - "1 + 2 + 4 + 8 == 15 and 20 * 15 == 300 and 300 / 60 == 5"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Kênh thư chết không ai đọc <b class="red">(thùng rác có tên đẹp)</b>
          <br><span class="note">Cảnh báo khi kênh thư chết có thông điệp mới; ghi người phụ trách; có công cụ xem, sửa và phát lại từng thông điệp.</span></div>
        say: "Lỗi thứ nhất, kênh thư chết không ai đọc, thành một thùng rác có tên đẹp. Hãy cảnh báo khi kênh thư chết có thông điệp mới, ghi người phụ trách, và có công cụ xem, sửa, rồi phát lại từng thông điệp."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Thử lại ngay lập tức với lỗi tạm thời <b class="red">(dồn thêm tải lên dịch vụ đang quá tải)</b>
          <br><span class="note">Lùi dần có ngẫu nhiên: chờ 1, 2, 4, 8 giây cộng một chút ngẫu nhiên. Phân biệt lỗi tạm thời (thử lại) với lỗi dữ liệu (chuyển ngay kênh thư chết).</span></div>
        say: "Lỗi thứ hai, thử lại ngay lập tức với lỗi tạm thời, nên dồn thêm tải lên dịch vụ đang quá tải. Hãy lùi dần có ngẫu nhiên, chờ 1, 2, 4, 8 giây cộng một chút ngẫu nhiên. Phân biệt lỗi tạm thời để thử lại, với lỗi dữ liệu để chuyển ngay sang kênh thư chết."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Xử lý không lũy đẳng <b class="red">(thử lại thành giao hai lần)</b>
          <br><span class="note">Xử lý xong, ghi nhận vị trí đọc thất bại, thông điệp được giao lại: đơn bị tạo vận đơn hai lần. Lưu mã thông điệp đã xử lý cùng giao dịch với thay đổi.</span></div>
        say: "Lỗi thứ ba, xử lý không lũy đẳng, nên thử lại thành giao hàng hai lần. Xử lý xong mà ghi nhận vị trí đọc thất bại thì thông điệp được giao lại, và đơn bị tạo vận đơn hai lần. Hãy lưu mã thông điệp đã xử lý trong cùng giao dịch với thay đổi."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Lùi dần <b>ngay trong phân vùng</b> với thông điệp độc <b class="red">(phân vùng đứng yên trong lúc chờ)</b></div>
          <table class="t"><tr><th>thử 5 lần, chờ 1, 2, 4, 8 giây giữa các lần</th><th>phân vùng đứng yên</th></tr>
          <tr><td>mỗi thông điệp độc</td><td>$1 + 2 + 4 + 8 = 15$ giây</td></tr>
          <tr><td>20 thông điệp độc mỗi giờ</td><td>$20 \cdot 15 = 300$ giây = 5 phút mỗi giờ</td></tr>
          <tr><td>lỗi dữ liệu chuyển ngay kênh thư chết, không chờ</td><td>0 giây</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, áp lùi dần ngay trong phân vùng cho cả thông điệp độc, nên phân vùng đứng yên trong lúc chờ. Thử 5 lần, chờ 1, 2, 4, 8 giây giữa các lần, thì mỗi thông điệp độc giữ phân vùng 1 cộng 2 cộng 4 cộng 8, bằng 15 giây. Nếu mỗi giờ có 20 thông điệp độc, phân vùng đứng yên 20 nhân 15 bằng 300 giây, tức 5 phút mỗi giờ. Người làm nghề phân loại lỗi trước, lỗi dữ liệu thì chuyển ngay sang kênh thư chết, không chờ giây nào. Lùi dần chỉ dành cho lỗi tạm thời, khi chờ thật sự có ích."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.consume_with_dlq(500, {7, 300}, 5) == (498, 2, 508) and alg.consume_with_dlq(500, {7, 300}) == (6, 0, None)"
      - "500 - 2 == 498 and 2 * 5 == 10 and 498 + 10 == 508 and 500 - 7 == 493"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>500 thông điệp, thông điệp 7 và 300 độc, thử 5 lần rồi chuyển kênh thư chết. Đã xử lý bao nhiêu, kênh thư chết có bao nhiêu, tổng lần thử?</td></tr>
          <tr><td>2</td><td>Không có kênh thư chết thì xử lý được bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, có 500 thông điệp, thông điệp 7 và 300 là độc, thử 5 lần rồi chuyển kênh thư chết. Đã xử lý bao nhiêu, kênh thư chết có bao nhiêu, và tổng lần thử là bao nhiêu? Câu hai, không có kênh thư chết thì xử lý được bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>thông điệp lành</td><td>$500 - 2$</td><td>$\hl{498}$ đã xử lý, mỗi cái 1 lần thử</td></tr>
          <tr><td>thông điệp độc 7 và 300</td><td>$2 \cdot 5$</td><td>10 lần thử, 2 nằm ở kênh thư chết</td></tr>
          <tr><td>tổng lần thử</td><td>$498 + 10$</td><td>508</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, giải từng dòng. Thông điệp lành có 500 trừ 2, bằng 498, mỗi cái 1 lần thử, và đều được xử lý. Hai thông điệp độc 7 và 300, mỗi cái thử 5 lần, được 2 nhân 5 bằng 10 lần thử, rồi cả 2 nằm ở kênh thư chết. Tổng lần thử là 498 cộng 10, bằng 508."
      - show: |
          <p>② Không có kênh thư chết: xử lý 1 tới 6, tức chỉ <b>6</b>, rồi kẹt ở thông điệp 7. Thông điệp độc 300 thậm chí chưa được đọc tới; $500 - 7 = 493$ thông điệp phía sau đứng chờ.</p>
        say: "Câu hai, không có kênh thư chết thì người tiêu thụ xử lý 1 tới 6, tức chỉ 6 thông điệp, rồi kẹt ở thông điệp 7. Thông điệp độc 300 thậm chí chưa được đọc tới, và 500 trừ 7, bằng 493 thông điệp phía sau đứng chờ."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">lỗi tạm thời: thử lại có lùi dần</span><span class="a">→</span>
          <span class="n">thông điệp độc: sau k lần, sang kênh thư chết</span><span class="a">→</span>
          <span class="n">kênh thư chết có người xem, sửa, phát lại</span><span class="a">→</span>
          <span class="n">người tiêu thụ lũy đẳng: lưu mã đã xử lý</span></div>
        say: "Tổng kết lại, lỗi tạm thời thì thử lại có lùi dần, còn thông điệp độc thì sau k lần chuyển sang kênh thư chết. Kênh thư chết phải có người xem, sửa và phát lại, và người tiêu thụ phải lũy đẳng bằng cách lưu mã đã xử lý."
      - show: |
          <div class="box key"><b>Tư duy:</b> đừng để <b>một</b> phần tử hỏng chặn <b>tất cả</b> phần tử lành — cách ly cái hỏng, đi tiếp, rồi quay lại sửa.</div>
        say: "Điều cần mang theo, đừng để một phần tử hỏng chặn tất cả phần tử lành, hãy cách ly cái hỏng, đi tiếp, rồi quay lại sửa."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>thứ tự, trùng lặp</b> và phiên bản theo khoá.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học thứ tự, trùng lặp, và phiên bản theo khoá. Hẹn gặp bạn ở bài tiếp theo."
