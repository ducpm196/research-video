- id: example
  kind: example
  title: Ba tiến trình, hai thông điệp
  checks:
  - alg.lamport_run([('P1', 'local', None), ('P1', 'send', 'm1'), ('P2', 'local', None), ('P2', 'recv', 'm1'), ('P2', 'send', 'm2'), ('P3', 'recv', 'm2'), ('P3', 'local', None)]) == [1, 2, 1, 3, 4, 5, 6]
  steps:
  - show: '<div><svg width="980" height="340" viewBox="0 0 980 340"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><line x1="90" y1="50" x2="960" y2="50" stroke="#1f2937" stroke-width="2.5"/><text x="76" y="57" font-size="22" fill="#1f2937" text-anchor="end" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">P1</text><line x1="90" y1="170" x2="960" y2="170" stroke="#1f2937" stroke-width="2.5"/><text x="76" y="177" font-size="22" fill="#1f2937" text-anchor="end" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">P2</text><line x1="90" y1="290" x2="960" y2="290" stroke="#1f2937" stroke-width="2.5"/><text x="76" y="297" font-size="22" fill="#1f2937" text-anchor="end" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">P3</text><line x1="298" y1="64" x2="456" y2="156" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ar)"/><line x1="614" y1="184" x2="772" y2="276" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ar)"/><circle cx="140" cy="50" r="11" fill="#2a78d6"/><text x="140" y="28" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">1</text><circle cx="298" cy="50" r="11" fill="#2a78d6"/><text x="298" y="28" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">2</text><circle cx="140" cy="170" r="11" fill="#2a78d6"/><text x="140" y="148" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">1</text><circle cx="456" cy="170" r="11" fill="#2a78d6"/><text x="456" y="148" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">3</text><circle cx="614" cy="170" r="11" fill="#2a78d6"/><text x="614" y="148" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">4</text><circle cx="772" cy="290" r="11" fill="#2a78d6"/><text x="772" y="268" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">5</text><circle cx="930" cy="290" r="11" fill="#2a78d6"/><text x="930" y="268" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold" stroke="#fffbeb" stroke-width="5" paint-order="stroke">6</text></svg></div>

      <p><b>Bước 1</b> — mọi đồng hồ bắt đầu từ 0. P1: cục bộ $0 + 1 = 1$, gửi m1: $1 + 1 = 2$ (kèm nhãn 2). P2: cục bộ $0 + 1 = 1$.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Trên hình, mũi tên cam là thông điệp, số trên mỗi chấm là nhãn Lamport. Bước một, mọi đồng hồ bắt đầu từ 0. P1 có một sự kiện cục bộ, nhãn 1, rồi gửi thông điệp m1 ở nhãn 2, và nhãn 2 đi kèm thông điệp. P2 cũng có một sự kiện cục bộ, nhãn 1.
  - show: '<p><b>Bước 2</b> — P2 nhận m1 (nhãn 2) khi đồng hồ P2 là 1: $\max(1, 2) + 1 = \hl{3}$.</p>

      '
    say: Bước hai, P2 nhận thông điệp của P1 mang nhãn 2 khi đồng hồ của P2 đang là 1, nên nhãn mới là 3.
  - show: '<p><b>Bước 3</b> — P2 gửi m2: $3 + 1 = 4$, kèm nhãn 4.</p>

      '
    say: Bước ba, P2 gửi thông điệp m2, đồng hồ tăng từ 3 lên 4, và nhãn 4 đi kèm thông điệp.
  - clear: true
    show: '<p><b>Bước 4</b> — P3 chưa có sự kiện nào (đồng hồ 0), nhận m2 mang nhãn 4: $\max(0, 4) + 1 = \hl{5}$; rồi cục bộ: $5 + 1 = 6$.</p>

      <table class="t"><tr><th>xếp theo nhãn (hòa thì theo số hiệu tiến trình)</th><th>1</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>

      <tr><td>sự kiện</td><td>P1 cục bộ</td><td>P2 cục bộ</td><td>P1 gửi m1</td><td>P2 nhận m1</td><td>P2 gửi m2</td><td>P3 nhận m2</td><td>P3 cục bộ</td></tr></table>

      <div class="box key">Tính chất: nếu a → b thì $C(a) \lt C(b)$. Xếp mọi sự kiện theo nhãn (hòa thì theo số hiệu tiến trình) cho một <b>thứ tự toàn phần</b> (mọi cặp sự kiện đều xếp được trước–sau) khớp với nhân quả.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    say: Bước bốn, P3 chưa có sự kiện nào, đồng hồ là 0. P3 nhận thông điệp mang nhãn 4, nên nhãn mới là 5, rồi sự kiện cục bộ sau đó mang nhãn 6. Bảng xếp cả bảy sự kiện theo nhãn, hai sự kiện cùng nhãn 1 thì P1 đứng trước P2. Tính chất quan trọng là nếu a xảy ra trước b thì nhãn của a nhỏ hơn nhãn của b. Xếp mọi sự kiện theo nhãn, hòa thì theo số hiệu tiến trình, ta được một thứ tự toàn phần, tức mọi cặp sự kiện đều xếp được trước sau, khớp với quan hệ nhân quả.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm chuỗi dài nhất'
  checks:
  - '(lambda pr: (lambda f: [f(f, i) for i in range(7)])(lambda f, i: 1 + max([f(f, j) for j in pr[i]], default=0)))({0: [], 1: [0], 2: [], 3: [2, 1], 4: [3], 5: [4], 6: [5]}) == alg.lamport_run([(''P1'', ''local'', None), (''P1'', ''send'', ''m1''), (''P2'', ''local'', None), (''P2'', ''recv'', ''m1''), (''P2'', ''send'', ''m2''), (''P3'', ''recv'', ''m2''), (''P3'', ''local'', None)])'
  steps:
  - show: '<p>Nhãn Lamport = số sự kiện trên <b>chuỗi nhân quả dài nhất</b> dẫn tới sự kiện đó (đi theo thông điệp và theo trục mỗi tiến trình). Đếm thẳng, không dùng luật max:</p>

      <table class="t"><tr><th>sự kiện</th><th>chuỗi dài nhất dẫn tới nó</th><th>đếm</th><th>nhãn đã tính</th></tr>

      <tr><td>P2 nhận m1</td><td>P1 cục bộ → P1 gửi m1 → P2 nhận m1 (chuỗi kia: P2 cục bộ → P2 nhận m1, chỉ 2)</td><td>3</td><td>3 ✓</td></tr>

      <tr><td>P3 nhận m2</td><td>P1 cục bộ → P1 gửi m1 → P2 nhận m1 → P2 gửi m2 → P3 nhận m2</td><td>5</td><td>5 ✓</td></tr>

      <tr><td>P3 cục bộ</td><td>chuỗi trên, thêm P3 cục bộ</td><td>6</td><td>6 ✓</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.2'
    - '2.3'
    - '2.4'
    say: Kiểm bằng một đường khác, không dùng luật lấy số lớn hơn. Với cách gán nhãn này, nhãn của một sự kiện đúng bằng số sự kiện trên chuỗi nhân quả dài nhất dẫn tới nó, đi theo thông điệp và theo trục mỗi tiến trình. Với P2 nhận m1, chuỗi dài nhất là P1 cục bộ, P1 gửi, rồi P2 nhận, có 3 sự kiện. Chuỗi kia, P2 cục bộ rồi P2 nhận, chỉ có 2, nên nhãn là 3, khớp. Với P3 nhận m2, chuỗi dài nhất đi qua cả P1 và P2, có 5 sự kiện, khớp nhãn 5. Thêm sự kiện cục bộ của P3 được 6, cũng khớp, và máy đếm lại cả bảy sự kiện đều trùng với nhãn đã tính.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc, 1 lỗi người đã đi làm
  checks:
  - max(1, 5) + 1 == 6 and 1 + 1 == 2 and 2 < 5 < 6
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Xếp thứ tự sự kiện bằng giờ hệ thống của từng máy <b class="red">(sai)</b>

      <br><span class="note">Đồng hồ lệch nhau vài mi li giây tới vài giây, có thể nhảy lùi khi đồng bộ lại — như ví dụ mở đầu.</span></div>

      '
    say: Lỗi thứ nhất, xếp thứ tự sự kiện bằng giờ hệ thống của từng máy. Đồng hồ các máy lệch nhau từ vài mi li giây tới vài giây, và có thể nhảy lùi khi đồng bộ lại, như ví dụ mở đầu. Dùng thời gian thực máy cục bộ để so sánh trình tự sửa ghi giữa hai nút rất dễ đảo ngược nhân quả khi đồng hồ trôi.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Đảo chiều tính chất: nhãn nhỏ hơn thì xảy ra trước <b class="red">(sai)</b>

      <br><span class="note">Ở ví dụ vừa rồi, P2 có sự kiện nhãn 1 và P1 có sự kiện nhãn 2, nhưng hai sự kiện đó không liên hệ nhân quả. Chỉ nhìn nhãn Lamport thì không biết chắc.</span></div>

      '
    say: Lỗi thứ hai, đảo chiều tính chất, cho rằng nhãn nhỏ hơn thì xảy ra trước. Ở ví dụ vừa rồi, P2 có sự kiện nhãn 1, P1 có sự kiện nhãn 2, nhưng hai sự kiện đó không có liên hệ nhân quả nào. Chỉ nhìn nhãn Lamport thì không biết chắc được. Quên kèm dấu thời gian lô-gíc vào trong phần đầu bản tin sẽ cắt đứt toàn bộ dây truyền đồng bộ nhân quả.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Coi hết giờ chờ là bằng chứng nút đã chết <b class="red">(sai)</b>

      <br><span class="note">Nút có thể chỉ chậm, rồi tiếp tục làm việc như chưa có gì. Thiết kế phải chịu được cả trường hợp “tưởng chết mà vẫn sống”.</span></div>

      '
    say: Lỗi thứ ba, coi hết giờ chờ là bằng chứng nút đã chết. Nút có thể chỉ chậm, rồi tiếp tục làm việc như chưa có gì, nên thiết kế phải chịu được cả trường hợp tưởng chết mà vẫn sống. Hai sự kiện có giá trị đồng hồ bằng nhau hoặc một bên lớn hơn chưa chắc khẳng định được quan hệ nhân quả thật.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Cài đúng luật nhận ở đường chính, nhưng quên ở một đường phụ (ví dụ đoạn mã nhận lại thông điệp được gửi lại) <b class="red">(nhãn lùi)</b></div>

      <table class="t"><tr><th>P1 gửi kèm nhãn 5, P2 đang ở 1</th><th>nhãn của việc nhận</th><th>so với nhãn gửi 5</th></tr>

      <tr><td>đúng luật: $\max(1, 5) + 1$</td><td>6</td><td>lớn hơn ✓</td></tr>

      <tr><td>quên lấy max, chỉ cộng 1: $1 + 1$</td><td>2</td><td><b class="red">nhỏ hơn</b>: nhật ký lại “nhận trước khi gửi”</td></tr></table>

      <p class="note">Người có kinh nghiệm thêm một phép kiểm tự động: trong nhật ký, mọi cặp gửi–nhận phải có nhãn nhận lớn hơn nhãn gửi.</p>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    - 3
    say: Lỗi thứ tư hay gặp ở người đã đi làm, cài đúng luật nhận ở đường chính, nhưng quên ở một đường phụ, ví dụ đoạn mã nhận lại một thông điệp được gửi lại. Giả sử P1 gửi kèm nhãn 5, còn P2 đang ở 1. Đúng luật thì P2 lấy số lớn hơn giữa 1 và 5, cộng 1, được 6, lớn hơn 5. Đường phụ quên lấy số lớn hơn, chỉ cộng 1, được 2, nhỏ hơn 5. Nhật ký lại ghi nhận trước khi gửi, đúng cái lỗi ở đầu bài. Người có kinh nghiệm thêm một phép kiểm tự động, trong nhật ký mọi cặp gửi và nhận phải có nhãn nhận lớn hơn nhãn gửi.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.lamport_run([('P1', 'local', None), ('P1', 'local', None), ('P1', 'send', 'm'), ('P2', 'recv', 'm'), ('P2', 'local', None)]) == [1, 2, 3, 4, 5]
  - alg.lamport_run([('P1', 'send', 'm')] + [('P2', 'local', None)] * 7 + [('P2', 'recv', 'm')])[-1] == 8
  - max(0, 3) + 1 == 4 and max(7, 1) + 1 == 8 and 1 + 1 == 2 < 7
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>P1: cục bộ, cục bộ, gửi m. P2: nhận m (sự kiện đầu tiên của P2), rồi cục bộ. Ghi nhãn mọi sự kiện.</td></tr>

      <tr><td>2</td><td>P2 đã có 7 sự kiện (nhãn tới 7), rồi nhận thông điệp nhãn 1. Nhãn của sự kiện nhận?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, P1 có hai sự kiện cục bộ rồi gửi m, P2 nhận m ở sự kiện đầu tiên rồi có một sự kiện cục bộ. Hãy ghi nhãn đồng hồ cho mọi sự kiện của cả hai tiến trình. Câu hai, P2 đã có 7 sự kiện với nhãn tới 7, rồi nhận một thông điệp mang nhãn 1. Nhãn của sự kiện nhận là bao nhiêu? Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<table class="t"><tr><th>câu 1</th><th>luật</th><th>nhãn</th></tr>

      <tr><td>P1 cục bộ, cục bộ</td><td>$0 + 1$, rồi $1 + 1$</td><td>1, 2</td></tr>

      <tr><td>P1 gửi m (kèm nhãn)</td><td>$2 + 1$</td><td>3</td></tr>

      <tr><td>P2 nhận m (đồng hồ P2 đang 0)</td><td>$\max(0, 3) + 1$</td><td>$\hl{4}$</td></tr>

      <tr><td>P2 cục bộ</td><td>$4 + 1$</td><td>5</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Đáp án câu một, làm từng sự kiện. P1 có hai sự kiện cục bộ, nhãn 1 rồi 2. P1 gửi m ở nhãn 3, và nhãn 3 đi kèm thông điệp. P2 chưa có sự kiện nào nên đồng hồ là 0, khi nhận m thì lấy số lớn hơn giữa 0 và 3, cộng 1, được 4. Sự kiện cục bộ sau đó của P2 mang nhãn 5. Lấy cực đại giữa đồng hồ hiện tại của máy nhận và nhãn trong tin nhắn cộng một cho ra dấu thời gian chuẩn xác.
  - show: '<p>② P2 đang ở 7, thông điệp mang nhãn 1: $\max(7, 1) + 1 = \hl{8}$.</p>

      <p class="note">Nếu chỉ nhìn nhãn thông điệp ($1 + 1 = 2$) thì đồng hồ của P2 lùi từ 7 về 2 — luật lấy số lớn hơn chặn đúng chuyện này.</p>

      '
    focus:
    - 1
    - 2
    say: Câu hai, P2 đang ở 7, thông điệp mang nhãn 1, số lớn hơn giữa 7 và 1, cộng 1, bằng 8, vì đồng hồ không bao giờ lùi. Nếu chỉ nhìn nhãn của thông điệp mà lấy 1 cộng 1 bằng 2, đồng hồ của P2 sẽ lùi từ 7 về 2, và luật lấy số lớn hơn chặn đúng chuyện này.
