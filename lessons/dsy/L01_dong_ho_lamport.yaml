- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">chậm hay chết: không phân biệt được</span><span class="a">→</span>

      <span class="n">giờ hệ thống lệch</span><span class="a">→</span>

      <span class="n">Lamport: +1, nhận lấy max + 1</span><span class="a">→</span>

      <span class="n">a → b ⇒ C(a) &lt; C(b)</span></div>

      '
    introduces:
    - implies
    say: Tổng kết lại, qua mạng ta không phân biệt được chậm hay chết, và giờ hệ thống của các máy bị lệch. Đồng hồ Lamport tăng 1 mỗi sự kiện, khi nhận thì lấy số lớn hơn rồi cộng 1, và nếu a xảy ra trước b thì nhãn của a nhỏ hơn. Đồng hồ lô-gíc xếp mọi biến cố liên kết nhân quả vào đúng chiều thời gian bất chấp sai lệch thạch anh phần cứng.
  - show: '<div class="box key"><b>Tư duy:</b> khi không đo được thời gian thật, hãy dựa vào <b>quan hệ nhân quả</b> — cái gì có thể ảnh hưởng tới cái gì.</div>

      '
    say: Điều cần mang theo, khi không đo được thời gian thật, hãy dựa vào quan hệ nhân quả, cái gì có thể ảnh hưởng tới cái gì. Tuy nhiên đồng hồ vô hướng vẫn chưa phân biệt rành mạch hai sự kiện độc lập song song mà ta giải ở bài kế.
  - clear: true
    show: '<p class="note">Bài sau (bài 2): <b>đồng hồ vector</b> — biết chắc hai sự kiện có liên hệ hay đồng thời.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 2, ta học đồng hồ vector, biết chắc hai sự kiện có liên hệ nhân quả hay xảy ra đồng thời. Hẹn gặp bạn ở bài tiếp theo.
