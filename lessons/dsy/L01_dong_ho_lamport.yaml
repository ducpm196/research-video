scenes:
- id: hook
  kind: hook
  title: Nhận trước khi gửi?
  checks:
  - 98 < 100
  steps:
  - show: '<p>Máy A gửi thông điệp lúc đồng hồ của A chỉ 100 ms. Đồng hồ máy B chạy chậm 5 ms; thông điệp tới sau 3 ms, B ghi “nhận lúc 98 ms”. Theo nhật ký, thông điệp được <b>nhận trước khi gửi</b>.</p>

      <div class="box key">Hôm nay: các kiểu <b>hỏng hóc</b>, và cách xếp thứ tự sự kiện không cần đồng hồ chung — <b>đồng hồ lôgic Lamport</b>.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, máy A gửi một thông điệp lúc đồng hồ của A chỉ 100 mi li giây. Đồng hồ của máy B chạy chậm 5 mi li giây, thông điệp tới sau 3 mi li giây, nên B ghi là nhận lúc 98 mi li giây. Theo nhật ký, thông điệp được nhận trước khi gửi. Hôm nay ta học các kiểu hỏng hóc, và cách xếp thứ tự sự kiện mà không cần đồng hồ chung, với đồng hồ lô-gic của Lamport. Trên nhiều máy không chung đồng hồ vật lý chính xác tuyệt đối, xác định sự kiện nào xảy ra trước đòi hỏi đồng hồ lô-gíc.
- id: prereq
  kind: prereq
  title: 'Ôn lại: số lớn hơn, phép gán, và điều bài 0 đã cho thấy'
  checks:
  - max(3, 5) == 5 and max(4, 4) == 4 and 4 + 1 == 5
  - round(1 - 0.999 ** 100, 3) == 0.095 and 150 / 0.5 == 300
  steps:
  - show: '<table class="t"><tr><th>phép</th><th>đọc là</th><th>ví dụ</th></tr>

      <tr><td>$\max(a, b)$</td><td>số lớn hơn trong hai số</td><td>$\max(3, 5) = 5$; $\max(4, 4) = 4$</td></tr>

      <tr><td>$C \leftarrow C + 1$</td><td>gán: tính vế phải rồi ghi vào $C$</td><td>$C$ đang là 4 → sau phép gán $C$ là 5</td></tr></table>

      '
    introduces:
    - max_fn
    - assign
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    say: Bài này dùng hai phép nhỏ. Thứ nhất, ký hiệu này đọc là số lớn hơn trong hai số a và b. Số lớn hơn giữa 3 và 5 là 5, còn giữa 4 và 4 là 4. Thứ hai, mũi tên chỉ sang trái, C nhận C cộng 1, là phép gán, tính vế phải rồi ghi kết quả vào C. Nếu C đang là 4 thì sau phép gán, C là 5. Các máy thực thể có thể rớt đột ngột hoặc mất liên lạc từng phần tạo thành mô hình hỏng hóc khác nhau.
  - show: '<table class="t"><tr><th>ở bài 0 ta đã thấy</th><th>con số</th></tr>

      <tr><td>nhiều máy thì hỏng một phần là chuyện thường</td><td>100 máy, mỗi máy hỏng 0,1% số ngày: ≈ 9,5% số ngày có máy hỏng</td></tr>

      <tr><td>thông điệp qua mạng tới sau một khoảng trễ</td><td>khứ hồi ≈ 0,5 ms trong một trung tâm dữ liệu, ≈ 150 ms xuyên lục địa</td></tr>

      <tr><td>mỗi máy một đồng hồ riêng</td><td>không có đồng hồ chung để so</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Bài này cũng dựa vào ba điều đã thấy ở bài 0. Với nhiều máy, hỏng một phần là chuyện thường, 100 máy mỗi máy hỏng 0 phẩy 1 phần trăm số ngày thì khoảng 9 phẩy 5 phần trăm số ngày có máy hỏng. Thông điệp qua mạng luôn tới sau một khoảng trễ, khứ hồi khoảng nửa mi li giây trong một trung tâm dữ liệu và khoảng 150 mi li giây xuyên lục địa. Và mỗi máy có một đồng hồ riêng, không có đồng hồ chung để so.
- id: models
  kind: concept
  title: Mô hình hỏng hóc
  steps:
  - show: '<table class="t"><tr><th>mô hình</th><th>nút (một máy của hệ thống) làm gì khi hỏng</th></tr>

      <tr><td>dừng hẳn</td><td>ngừng mọi hoạt động, không quay lại</td></tr>

      <tr><td>dừng rồi chạy lại</td><td>ngừng, rồi khởi động lại (mất bộ nhớ, còn ổ đĩa)</td></tr>

      <tr><td>mất thông điệp</td><td>vẫn chạy nhưng thỉnh thoảng không gửi, không nhận được</td></tr>

      <tr><td>tuỳ tiện</td><td>gửi nội dung sai, do lỗi hay thậm chí cố ý lừa (ít gặp khi mọi máy do một tổ chức quản lý; phải tính tới khi có máy lạ không tin cậy)</td></tr></table>

      <div class="box key">Qua mạng, nút <b>chậm</b> và nút <b>chết</b> trông giống hệt nhau: chỉ thấy “chưa có trả lời”. Hết giờ chờ chỉ là <b>đoán</b>.</div>

      '
    focus:
    - 1
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    say: Trong bài này, nút là một máy tham gia hệ thống. Người ta thường dùng bốn mô hình hỏng hóc của một nút. Dừng hẳn, nút ngừng mọi hoạt động và không quay lại. Dừng rồi chạy lại, nút ngừng rồi khởi động lại, mất bộ nhớ nhưng còn ổ đĩa. Mất thông điệp, nút vẫn chạy nhưng thỉnh thoảng không gửi hay không nhận được. Tuỳ tiện, nút gửi nội dung sai, do lỗi hay thậm chí cố ý lừa, ít gặp khi mọi máy do một tổ chức quản lý, nhưng phải tính tới khi có máy lạ không tin cậy. Qua mạng, nút chậm và nút chết trông giống hệt nhau, ta chỉ thấy chưa có trả lời. Hết giờ chờ chỉ là một phỏng đoán.
- id: sym
  kind: symbol
  title: 'Giải mã: xảy ra trước, đồng hồ Lamport'
  checks:
  - alg.lamport_run([('P1', 'send', 'm'), ('P2', 'local', None), ('P2', 'recv', 'm')]) == [1, 1, 2]
  steps:
  - show: '<p><b>Tiến trình</b>: một chương trình đang chạy trên một nút (P1, P2, P3). Ba loại <b>sự kiện</b>: cục bộ (tự làm, không liên lạc), gửi, nhận thông điệp.</p>

      <p><b>a xảy ra trước b</b> (a → b): a, b cùng tiến trình và a trước; hoặc a là gửi, b là nhận cùng thông điệp; hoặc nối được qua một chuỗi như vậy.</p>

      <p><b>Đồng hồ Lamport</b> — mỗi tiến trình một số đếm $C$:</p>

      <ol><li>sự kiện cục bộ hoặc gửi: $C \leftarrow C + 1$; gửi kèm $C$;</li><li>nhận thông điệp mang nhãn $t$: $C \leftarrow \max(C, t) + 1$.</li></ol>

      <p class="note">Ví dụ: P1 gửi ở nhãn 1; P2 đã có một sự kiện nhãn 1 → nhận ở $\max(1, 1) + 1 = \hl{2}$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - '4.1'
    - '4.2'
    - 5
    - 5
    say: Trước hết, tiến trình là một chương trình đang chạy trên một nút, ở đây là P1, P2 và P3. Mỗi tiến trình có ba loại sự kiện, tự làm một việc cục bộ mà không liên lạc với ai, gửi, hoặc nhận thông điệp. A xảy ra trước b khi a và b cùng một tiến trình và a đến trước. Hoặc a là gửi và b là nhận cùng một thông điệp, hoặc hai sự kiện nối được qua một chuỗi như vậy. Đồng hồ Lamport cho mỗi tiến trình một số đếm C. Với sự kiện cục bộ hoặc gửi, C tăng thêm 1, và khi gửi thì kèm theo C. Khi nhận thông điệp mang nhãn t, C thành số lớn hơn giữa C và t, cộng 1. Ví dụ P1 gửi ở nhãn 1, P2 đã có một sự kiện nhãn 1, nên P2 nhận ở nhãn 2. Quy tắc cập nhật đồng hồ tăng thêm một sau mỗi biến cố cục bộ và lấy lớn nhất cộng một khi nhận tin nhắn.
- id: intuition
  kind: intuition
  title: Giờ máy có thể đảo thứ tự, nhãn đi kèm thông điệp thì không
  checks:
  - 100 - 5 + 3 == 98 and max(2, 4) + 1 == 5
  - '(lambda r: (r[3], r[6]))(alg.lamport_run([(''P1'', ''local'', None)] * 3 + [(''P1'', ''send'', ''m''), (''P2'', ''local'', None), (''P2'', ''local'', None), (''P2'', ''recv'', ''m'')])) == (4, 5)'
  steps:
  - show: '<div><svg width="1500" height="480" viewBox="0 0 1500 480"><defs><marker id="ah1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#eb6834"/></marker></defs><g font-size="23" fill="#1f2937"><text x="30" y="35" font-weight="bold" fill="#2a78d6">giờ hệ thống của từng máy</text><text x="30" y="98" font-weight="bold">máy A</text><line x1="150" y1="90" x2="1080" y2="90" stroke="#6b7280" stroke-width="3"/><text x="30" y="188" font-weight="bold">máy B</text><line x1="150" y1="180" x2="1080" y2="180" stroke="#6b7280" stroke-width="3"/><circle cx="400" cy="90" r="9" fill="#2a78d6"/><text x="400" y="72" text-anchor="middle">gửi: đồng hồ A = 100 ms</text><line x1="400" y1="90" x2="616" y2="176" stroke="#eb6834" stroke-width="4" marker-end="url(#ah1)"/><circle cx="620" cy="180" r="9" fill="#2a78d6"/><text x="620" y="215" text-anchor="middle">nhận: đồng hồ B = 98 ms</text><text x="1110" y="125" fill="#b91c1c">nhật ký: nhận trước gửi</text><text x="1110" y="157" fill="#b91c1c">(98 ms ghi trước 100 ms)</text><text x="30" y="270" font-weight="bold" fill="#059669">đồng hồ Lamport: nhãn đi kèm thông điệp</text><text x="30" y="338" font-weight="bold">P1</text><line x1="150" y1="330" x2="1080" y2="330" stroke="#6b7280" stroke-width="3"/><text x="30" y="428" font-weight="bold">P2</text><line x1="150" y1="420" x2="1080" y2="420" stroke="#6b7280" stroke-width="3"/><circle cx="400" cy="330" r="9" fill="#2a78d6"/><text x="400" y="312" text-anchor="middle">C = 4, gửi kèm nhãn 4</text><circle cx="250" cy="420" r="9" fill="#6b7280"/><text x="250" y="455" text-anchor="middle">C = 2</text><line x1="400" y1="330" x2="616" y2="416" stroke="#eb6834" stroke-width="4" marker-end="url(#ah1)"/><circle cx="620" cy="420" r="9" fill="#059669"/><text x="640" y="455" text-anchor="middle">nhận: max(2, 4) + 1 = 5</text><text x="1110" y="365" fill="#059669">nhận mang nhãn 5, lớn hơn 4:</text><text x="1110" y="397" fill="#059669">luôn đúng thứ tự</text></g></svg></div>

      '
    say: Nửa trên là ví dụ mở đầu, dùng giờ hệ thống của từng máy. A gửi lúc đồng hồ A chỉ 100 mi li giây, B nhận khi đồng hồ B chỉ 98, vì đồng hồ B chậm 5 mà thông điệp chỉ đi mất 3. Nhật ký vì vậy ghi việc nhận trước việc gửi. Nửa dưới là đồng hồ Lamport, mỗi tiến trình một số đếm, và số đếm của người gửi đi kèm theo thông điệp. Giống số thứ tự văn bản đến và đi giúp nhân viên khôi phục trình tự nhân quả dù đồng hồ treo tường mỗi phòng chạy lệch.
  - show: '<div><svg width="1500" height="480" viewBox="0 0 1500 480"><defs><marker id="ah1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#eb6834"/></marker></defs><g font-size="23" fill="#1f2937"><text x="30" y="35" font-weight="bold" fill="#2a78d6">giờ hệ thống của từng máy</text><text x="30" y="98" font-weight="bold">máy A</text><line x1="150" y1="90" x2="1080" y2="90" stroke="#6b7280" stroke-width="3"/><text x="30" y="188" font-weight="bold">máy B</text><line x1="150" y1="180" x2="1080" y2="180" stroke="#6b7280" stroke-width="3"/><circle cx="400" cy="90" r="9" fill="#2a78d6"/><text x="400" y="72" text-anchor="middle">gửi: đồng hồ A = 100 ms</text><line x1="400" y1="90" x2="616" y2="176" stroke="#eb6834" stroke-width="4" marker-end="url(#ah1)"/><circle cx="620" cy="180" r="9" fill="#2a78d6"/><text x="620" y="215" text-anchor="middle">nhận: đồng hồ B = 98 ms</text><text x="1110" y="125" fill="#b91c1c">nhật ký: nhận trước gửi</text><text x="1110" y="157" fill="#b91c1c">(98 ms ghi trước 100 ms)</text><text x="30" y="270" font-weight="bold" fill="#059669">đồng hồ Lamport: nhãn đi kèm thông điệp</text><text x="30" y="338" font-weight="bold">P1</text><line x1="150" y1="330" x2="1080" y2="330" stroke="#6b7280" stroke-width="3"/><text x="30" y="428" font-weight="bold">P2</text><line x1="150" y1="420" x2="1080" y2="420" stroke="#6b7280" stroke-width="3"/><circle cx="400" cy="330" r="9" fill="#2a78d6"/><text x="400" y="312" text-anchor="middle">C = 4, gửi kèm nhãn 4</text><circle cx="250" cy="420" r="9" fill="#6b7280"/><text x="250" y="455" text-anchor="middle">C = 2</text><line x1="400" y1="330" x2="616" y2="416" stroke="#eb6834" stroke-width="4" marker-end="url(#ah1)"/><circle cx="620" cy="420" r="9" fill="#059669"/><text x="640" y="455" text-anchor="middle">nhận: max(2, 4) + 1 = 5</text><text x="1110" y="365" fill="#059669">nhận mang nhãn 5, lớn hơn 4:</text><text x="1110" y="397" fill="#059669">luôn đúng thứ tự</text></g></svg></div>

      '
    say: P1 gửi ở nhãn 4, P2 đang ở 2, nên khi nhận, P2 lấy số lớn hơn giữa 2 và 4, cộng 1, được 5. Vì người nhận luôn nhảy qua nhãn của người gửi, việc nhận luôn mang nhãn lớn hơn việc gửi, dù đồng hồ thật lệch bao nhiêu.
