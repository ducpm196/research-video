id: L03
course: DSY
series: "DSY · Hệ phân tán và dữ liệu lớn"
title: "Bài 3 — Sao chép dữ liệu và đại biểu đọc–ghi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsy.yaml L03; audit/dsy/verify_dsy.py L03; D. K. Gifford, Weighted Voting for Replicated Data, SOSP 1979; G. DeCandia và cộng sự, Dynamo, SOSP 2007; M. Kleppmann, Designing Data-Intensive Applications (2017), chương 5; DBS bài 11"
assumes: [arith, ltgt]
# Quy ước: N bản sao, ghi xong khi W bản xác nhận, đọc hỏi R bản và lấy bản có số phiên bản lớn nhất. “Giao nhau” kiểm bằng VÉT CẠN mọi tập
#   đọc cỡ R và mọi tập ghi cỡ W (alg.quorum_overlap). Số nút hỏng chịu được khi ghi: N − W; khi đọc: N − R.
objectives:
  - "Phân biệt sao chép đồng bộ và bất đồng bộ"
  - "Chọn R, W sao cho đọc luôn thấy bản ghi mới nhất"
  - "Tính số nút hỏng chịu được"
asr_reviewed:
  - {sentence: "Câu hai, với R bằng 2 và W bằng 4.", reason: "ASR chép “Câu 2, với R bằng 2 và V đúc bằng 4.” (0.857): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước hai, giữ W bằng 2 nhưng chỉ đọc một máy.", reason: "ASR chép “Bước 2, giữ vây đúc bằng 2 nhưng chỉ đọc một máy.” (0.87): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Giả sử ba bản sao trả lời sau 1, 20 và 150 mi li giây, thì ghi chỉ phải chờ bản xác nhận thứ W, tức 1, 20 hoặc 150 mi li giây.", reason: "ASR chép “Giả sử 3 bản sao trả lời sau 1, 20 và 150 mili giây thì ghi chỉ phải chờ bản xác nhận thứ về đúc, tức 1, 20 hoặc 150 mili giây.” (0.889): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với R bằng 1 và W bằng 2, cũng có 9 cặp, trong đó đúng 3 cặp rời nhau, vì mỗi máy đọc lẻ có đúng một tập ghi không chứa nó.", reason: "ASR chép “Với error bằng 1 và vi đúc bằng 2 cũng có 9 cặp, trong đó đúng 3 cặp rời nhau vì mỗi máy đọc lẽ có đúng 1 tập ghi không chứa nó.” (0.892): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: linh/lẽ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với N bằng 3, R và W bằng 2, có 9 cặp đọc và ghi, không cặp nào rời nhau, khớp với luôn gặp.", reason: "ASR chép “Với N bằng 3, R và V đúc bằng 2, có 9 cặp độc và ghi, không cặp nào rời nhau, khớp với luôn gặp.” (0.898): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: đọc/độc — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cách của người có kinh nghiệm là giữ W bằng 2 và R bằng 2.", reason: "ASR chép “Cách của người có kinh nghiệm là giữ V đúc bằng 2 và R bằng 2.” (0.903): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ tư hay gặp ở người đã đi làm, thấy ghi chậm thì hạ W xuống 1, trong khi đọc vẫn chỉ hỏi một máy.", reason: "ASR chép “Lỗi thứ tư hay gặp ở người đã đi làm, thấy ghi chậm thì hạ về đút xuống một, trong khi độc vẫn chỉ hỏi một máy.” (0.906): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: đọc/độc — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với N bằng 5, R và W bằng 3, có 10 nhân 10, bằng 100 cặp, không cặp nào rời nhau.", reason: "ASR chép “Với N bằng 5, R và V đúc bằng 3, có 10 nhân 10 bằng 100 cặp, không cặp nào rời nhau.” (0.933): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hạ W xuống 1 đúng là nhanh nhất, nhưng 1 cộng 1 không lớn hơn 3, nên đọc có thể gặp bản cũ.", reason: "ASR chép “Hạ với Đúc xuống một đúng là nhanh nhất, nhưng một cộng 1 không lớn hơn 3 nên đọc có thể gặp bản cũ.” (0.936): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước một, lấy N bằng 3 và W bằng 2, lệnh ghi x bằng v2 xong khi máy 1 và máy 2 xác nhận, còn máy 3 vẫn giữ v1.", reason: "ASR chép “Bước 1, lấy N bằng 3 và V đúc bằng 2, lệnh ghi ít bằng V2 xong khi máy 1 và máy 2 xác nhận, còn máy 3 vẫn giữ V1.” (0.954): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tổng quát, ghi chịu được N trừ W máy hỏng, đọc chịu được N trừ R máy hỏng.", reason: "ASR chép “Tổng quắc, ghi chịu được N-V đúc máy hỏng”: W đọc tên chữ cái “vê đúp” (ASR viết “V đúc”) như mọi câu có W của bài; “trừ” bị ASR đổi thành dấu “-”; quát/quắc lệch thanh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Luôn gặp đúng khi R cộng W lớn hơn N.", reason: "ASR chép “R cộng với đút lớn hơn N”: W đọc tên chữ cái “vê đúp”, ASR viết “với đút”; R, N chép đúng, công thức R + W > N hiện trên màn hình — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàng R bằng 1 chỉ luôn gặp khi W bằng 3.", reason: "ASR chép “khi V đúc bằng ba”: W đọc “vê đúp” (tên chữ cái), các số chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với đại biểu N, R, W, nếu R cộng W lớn hơn N thì đọc luôn gặp ghi, và ghi chịu được N trừ W, đọc chịu được N trừ R máy hỏng.", reason: "ASR chép “N, R, V-đúc … R cộng V-đúc … N trừ V-đúc”: cả ba lần W đọc tên chữ cái “vê đúp”; phần còn lại chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàng R bằng 2 luôn gặp khi W từ 2 trở lên.", reason: "ASR chép “khi V-đút từ 2 trở lên”: W đọc “vê đúp” (tên chữ cái), các số chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ hai, nghĩ R cộng W lớn hơn N là giải quyết mọi chuyện.", reason: "ASR chép “nghĩ R cộng V đúc lớn hơn N”: W đọc “vê đúp” (tên chữ cái); câu còn lại chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với N bằng 5, có thể chọn cân bằng, R và W đều bằng 3, khi đó cả đọc lẫn ghi chịu được 2 máy hỏng.", reason: "ASR chép “R và V đút đều bằng 3 … cả độc lẫn ghi”: W đọc “vê đúp”, đọc/độc lệch thanh; các số chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cách thứ ba là đại biểu, có N bản sao, ghi xong khi W bản xác nhận.", reason: "ASR chép “ghi xong khi về đúc bản xác nhận”: W đọc “vê đúp” (tên chữ cái), ASR viết “về đúc” — NOT_VERIFIED bằng tai người"}
  - {sentence: "N bằng 4 với R và W bằng 3 vẫn chỉ chịu được 1 máy hỏng, giống N bằng 3 với R và W bằng 2, nên máy thứ tư chỉ thêm chi phí.", reason: "ASR chép “R và V đút bằng 3 … R và V đút bằng 2”: W đọc “vê đúp” cả hai lần; các số chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, với R bằng 2 và W bằng 4, ghi chịu được mấy máy hỏng, đọc chịu được mấy?", reason: "ASR chép “R bằng 2 và V đúc bằng 4”: W đọc “vê đúp” (tên chữ cái); câu còn lại đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, trong ba cặp R và W là 2 và 3, 2 và 4, 3 và 3, cặp nào bảo đảm đọc thấy bản mới nhất?", reason: "ASR chép “trong 3 cặp R và V đúc là 2 và 3, 2 và 4, 3 và 3”: W đọc “vê đúp”; mọi cặp số chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hoặc chọn đọc nhanh, R bằng 1 và W bằng 5, đọc chịu được 4 máy hỏng nhưng ghi không chịu được máy hỏng nào, chỉ một máy hỏng là không ghi được.", reason: "ASR chép “R bằng 1 và V đút bằng 5”: W đọc “vê đúp” (tên chữ cái); câu còn lại đúng (0,955) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đã báo thành công mà dữ liệu biến mất"
    steps:
      - show: |
          <p>Máy chính nhận lệnh chuyển tiền, báo “thành công” ngay, rồi mới gửi bản sao sang máy phụ. Máy chính hỏng trước khi kịp gửi. Máy phụ lên thay — giao dịch <b>không còn</b>.</p>
          <div class="box key">Hôm nay: <b>sao chép</b> dữ liệu sang nhiều máy, và cách chọn số bản đọc, số bản ghi để không đọc phải bản cũ.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, máy chính nhận một lệnh chuyển tiền, báo thành công ngay, rồi mới gửi bản sao sang máy phụ. Máy chính hỏng trước khi kịp gửi. Máy phụ lên thay, và giao dịch không còn nữa. Hôm nay ta học sao chép dữ liệu sang nhiều máy, và cách chọn số bản đọc, số bản ghi để không đọc phải bản cũ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: số phiên bản, đếm tập con, chuồng bồ câu"
    checks:
      - "max([5, 7, 6]) == 7"
      - "math.comb(3, 2) == 3 and len(list(__import__('itertools').combinations(range(3), 2))) == 3 and 3 * 3 == 9"
      - "2 + 2 > 3 and alg.quorum_overlap(3, 2, 2)"
    steps:
      - show: |
          <p><b>Số phiên bản</b>: mỗi lần ghi một khoá, số phiên bản của khoá đó tăng thêm 1. Bản nào có số lớn hơn thì mới hơn.</p>
          <table class="t"><tr><th>hỏi 3 bản sao</th><th>bản 1</th><th>bản 2</th><th>bản 3</th><th>lấy</th></tr>
          <tr><td>số phiên bản</td><td>5</td><td>7</td><td>6</td><td>$\hl{7}$ (lớn nhất)</td></tr></table>
        focus: [1, 1, 2]
        say: "Bài này dựa vào ba điều nhỏ. Điều thứ nhất là số phiên bản, mỗi lần ghi một khoá thì số phiên bản của khoá đó tăng thêm 1, bản nào có số lớn hơn thì mới hơn. Hỏi ba bản sao, nhận về các số 5, 7 và 6, ta lấy bản số 7, vì đó là bản mới nhất."
      - show: |
          <p><b>Đếm tập con</b> (khoá Toán rời rạc): chọn 2 máy trong 3 máy có $C(3, 2) = 3$ cách: {1, 2}, {1, 3}, {2, 3}.</p>
          <table class="t"><tr><th>số tập ghi cỡ 2</th><th>số tập đọc cỡ 2</th><th>số cặp (đọc, ghi)</th></tr>
          <tr><td>3</td><td>3</td><td>$3 \cdot 3 = 9$</td></tr></table>
        introduces: [cdot]
        focus: [1, 1, 2]
        say: "Điều thứ hai, ở khoá Toán rời rạc ta đếm tập con bằng tổ hợp. Chọn 2 máy trong 3 máy có tổ hợp chập 2 của 3, bằng 3 cách, là máy 1 và 2, máy 1 và 3, máy 2 và 3. Có 3 tập ghi và 3 tập đọc cỡ 2, nên có 3 nhân 3, bằng 9 cặp đọc và ghi cần kiểm."
      - show: |
          <p><b>Chuồng bồ câu</b>: nhét nhiều chim hơn số chuồng thì có chuồng chứa hai chim.</p>
          <table class="t"><tr><th>chuồng = máy</th><th>chim</th><th>kết luận</th></tr>
          <tr><td>3 máy</td><td>2 máy của tập đọc + 2 máy của tập ghi = 4</td><td>$4 \gt 3$ → có máy nằm trong <b>cả hai</b> tập</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Điều thứ ba là nguyên lý chuồng bồ câu, nhét nhiều chim hơn số chuồng thì có chuồng chứa hai chim. Coi 3 máy là 3 chuồng, 2 máy của tập đọc và 2 máy của tập ghi là 4 con chim. Vì 4 lớn hơn 3, chắc chắn có một máy nằm trong cả hai tập."

  - id: sym
    kind: symbol
    title: "Giải mã: đồng bộ, bất đồng bộ, N, R, W"
    steps:
      - show: |
          <table class="t"><tr><th>sao chép</th><th>báo thành công khi</th><th>đánh đổi</th></tr>
          <tr><td>đồng bộ</td><td>bản sao đã nhận</td><td>an toàn hơn, chậm hơn; bản sao hỏng thì ghi bị chặn</td></tr>
          <tr><td>bất đồng bộ</td><td>chỉ máy chính đã ghi</td><td>nhanh, nhưng mất ghi khi máy chính hỏng (như mở đầu)</td></tr></table>
          <p><b>Đại biểu</b>: N bản sao. Ghi xong khi <b>W</b> bản xác nhận; đọc hỏi <b>R</b> bản, lấy bản có số phiên bản lớn nhất.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Có hai kiểu sao chép dữ liệu từ máy chính sang bản sao. Đồng bộ báo thành công khi bản sao đã nhận, an toàn hơn nhưng chậm hơn, và bản sao hỏng thì ghi bị chặn. Bất đồng bộ báo thành công khi chỉ máy chính đã ghi, nhanh, nhưng mất ghi khi máy chính hỏng như ví dụ mở đầu. Cách thứ ba là đại biểu, có N bản sao, ghi xong khi W bản xác nhận. Khi đọc thì hỏi R bản, và lấy bản có số phiên bản lớn nhất."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Tập đọc chồng lên tập ghi"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><g font-size="23" fill="#1f2937"><text x="20" y="40" font-weight="bold">N = 3 bản sao; ghi x = v2 với W = 2, rồi đọc với R = 2</text><rect x="180" y="110" width="720" height="160" rx="14" fill="none" stroke="#2a78d6" stroke-width="4" stroke-dasharray="12 8"/><text x="400" y="96" text-anchor="middle" fill="#2a78d6" font-weight="bold">tập ghi: máy 1, 2</text><rect x="600" y="122" width="720" height="160" rx="14" fill="none" stroke="#eb6834" stroke-width="4" stroke-dasharray="12 8"/><text x="1100" y="312" text-anchor="middle" fill="#eb6834" font-weight="bold">tập đọc: máy 2, 3</text><rect x="220" y="140" width="250" height="110" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="345" y="185" text-anchor="middle">máy 1</text><text x="345" y="225" text-anchor="middle">x = v2</text><rect x="625" y="150" width="250" height="110" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="750" y="195" text-anchor="middle">máy 2</text><text x="750" y="235" text-anchor="middle" font-weight="bold">x = v2</text><rect x="1030" y="150" width="250" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="1155" y="195" text-anchor="middle">máy 3</text><text x="1155" y="235" text-anchor="middle">x = v1 (cũ)</text><text x="750" y="360" text-anchor="middle" fill="#059669">máy 2 thuộc cả hai tập: đọc thấy v2, lấy số phiên bản lớn nhất</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ 3 bản sao của khoá x. Lệnh ghi x bằng v2 chỉ cần 2 máy xác nhận, ở đây là máy 1 và máy 2, còn máy 3 vẫn giữ bản cũ v1. Sau đó một lần đọc hỏi 2 máy, chẳng may là máy 2 và máy 3. Nhưng máy 2 nằm trong cả hai tập, nó trả về v2, và vì người đọc lấy số phiên bản lớn nhất nên đọc được bản mới."

  - id: example
    kind: example
    title: "R + W > N: mọi tập đọc gặp mọi tập ghi"
    checks:
      - "[[alg.quorum_overlap(3, r, w) for w in (1, 2, 3)] for r in (1, 2, 3)] == [[False, False, True], [False, True, True], [True, True, True]]"
      - "all(alg.quorum_overlap(3, r, w) == (r + w > 3) for r in (1, 2, 3) for w in (1, 2, 3))"
    steps:
      - show: |
          <p><b>Bước một</b> — N = 3, W = 2: ghi <code>x = v2</code> xong khi máy 1 và máy 2 xác nhận; máy 3 còn <code>v1</code>.</p>
          <table class="t"><tr><th>tập đọc R = 2</th><th>có máy đã ghi?</th><th>đọc được</th></tr>
          <tr><td>máy 1, 2</td><td>có (cả hai)</td><td>v2</td></tr>
          <tr><td>máy 1, 3</td><td>có (máy 1)</td><td>v2</td></tr>
          <tr><td>máy 2, 3</td><td>có (máy 2)</td><td>v2</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước một, lấy N bằng 3 và W bằng 2, lệnh ghi x bằng v2 xong khi máy 1 và máy 2 xác nhận, còn máy 3 vẫn giữ v1. Tập đọc gồm máy 1 và 2 thì cả hai đều có bản mới. Tập đọc gồm máy 1 và 3 có máy 1 đã ghi, nên vẫn đọc được v2. Tập đọc gồm máy 2 và 3 có máy 2 đã ghi, cũng đọc được v2."
      - show: |
          <p><b>Bước 2</b> — giữ W = 2 nhưng đọc chỉ R = 1:</p>
          <table class="t"><tr><th>tập đọc R = 1</th><th>đọc được</th></tr>
          <tr><td>máy 1</td><td>v2</td></tr><tr><td>máy 2</td><td>v2</td></tr>
          <tr><td>máy 3</td><td><b class="red">v1 — bản cũ</b></td></tr></table>
          <p class="note">$1 + 2 = 3$, không lớn hơn $N = 3$: có một tập đọc trượt hẳn tập ghi.</p>
        focus: [1, "2.2", "2.4", 3]
        say: "Bước hai, giữ W bằng 2 nhưng chỉ đọc một máy. Đọc máy 1 hay máy 2 thì được v2. Đọc trúng máy 3 thì được v1, một bản cũ. Ở đây 1 cộng 2 bằng 3, không lớn hơn N, nên có một tập đọc trượt hẳn tập ghi."
      - clear: true
        show: |
          <p><b>Bước 3</b> — N = 3, kiểm <b>mọi</b> tập đọc và tập ghi (vét cạn):</p>
          <table class="t"><tr><th>R \ W</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>1</td><td>có thể trượt</td><td>có thể trượt</td><td>luôn gặp</td></tr>
          <tr><td>2</td><td>có thể trượt</td><td>$\hl{\text{luôn gặp}}$</td><td>luôn gặp</td></tr>
          <tr><td>3</td><td>luôn gặp</td><td>luôn gặp</td><td>luôn gặp</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, với N bằng 3, ta kiểm mọi tập đọc và mọi tập ghi bằng vét cạn. Hàng R bằng 1 chỉ luôn gặp khi W bằng 3. Hàng R bằng 2 luôn gặp khi W từ 2 trở lên. Hàng R bằng 3 thì luôn gặp."
      - show: |
          <p><b>Bước 4</b> — đọc quy luật của bảng:</p>
          $$R + W \gt N \quad \to \quad \text{luôn gặp}$$
          <p>Hai tập có tổng cỡ lớn hơn N thì phải chung ít nhất một máy (nguyên lý chuồng bồ câu). Máy chung đó có bản mới nhất.</p>
        focus: [1, 2, 3]
        say: "Bước bốn, đọc quy luật của bảng. Luôn gặp đúng khi R cộng W lớn hơn N. Hai tập có tổng cỡ lớn hơn N thì phải chung ít nhất một máy, theo nguyên lý chuồng bồ câu, và máy chung đó có bản mới nhất."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: đếm từng cặp"
    checks:
      - "sum(1 for a in __import__('itertools').combinations(range(3), 2) for b in __import__('itertools').combinations(range(3), 2) if not set(a) & set(b)) == 0"
      - "sum(1 for a in __import__('itertools').combinations(range(3), 1) for b in __import__('itertools').combinations(range(3), 2) if not set(a) & set(b)) == 3 and 3 * 3 == 9"
      - "math.comb(5, 3) ** 2 == 100 and min(len(set(a) & set(b)) for a in __import__('itertools').combinations(range(5), 3) for b in __import__('itertools').combinations(range(5), 3)) == 1 == 3 + 3 - 5"
    steps:
      - show: |
          <table class="t"><tr><th>trường hợp</th><th>số cặp (đọc, ghi)</th><th>số cặp không chung máy nào</th><th>kết luận</th></tr>
          <tr><td>N = 3, R = 2, W = 2</td><td>$3 \cdot 3 = 9$</td><td>0</td><td>luôn gặp ✓</td></tr>
          <tr><td>N = 3, R = 1, W = 2</td><td>$3 \cdot 3 = 9$</td><td>3 (mỗi máy đọc lẻ có đúng một tập ghi không chứa nó)</td><td>có thể trượt ✓</td></tr>
          <tr><td>N = 5, R = 3, W = 3</td><td>$10 \cdot 10 = 100$</td><td>0; ít nhất $3 + 3 - 5 = 1$ máy chung</td><td>luôn gặp ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.4"]
        say: "Kiểm bằng đường khác, ta không dùng công thức mà đếm thẳng từng cặp. Với N bằng 3, R và W bằng 2, có 9 cặp đọc và ghi, không cặp nào rời nhau, khớp với luôn gặp. Với R bằng 1 và W bằng 2, cũng có 9 cặp, trong đó đúng 3 cặp rời nhau, vì mỗi máy đọc lẻ có đúng một tập ghi không chứa nó. Với N bằng 5, R và W bằng 3, có 10 nhân 10, bằng 100 cặp, không cặp nào rời nhau. Mỗi cặp chung ít nhất 3 cộng 3 trừ 5, bằng 1 máy."

  # ───────────────────────── 4. CHỊU LỖI ─────────────────────────
  - id: tolerance
    kind: concept
    title: "Chọn R, W: tốc độ và chịu lỗi"
    checks:
      - "alg.quorum_overlap(5, 3, 3) and alg.quorum_overlap(5, 1, 5) and (5 - 3, 5 - 3, 5 - 1, 5 - 5) == (2, 2, 4, 0)"
    steps:
      - show: |
          <table class="t"><tr><th>N = 5</th><th>R</th><th>W</th><th>đọc chịu được</th><th>ghi chịu được</th></tr>
          <tr><td>cân bằng</td><td>3</td><td>3</td><td>2 máy hỏng</td><td>2 máy hỏng</td></tr>
          <tr><td>đọc nhanh</td><td>1</td><td>5</td><td>4 máy hỏng</td><td><b class="red">0</b>: một máy hỏng là không ghi được</td></tr></table>
          <p class="note">Ghi chịu được $N - W$ máy hỏng, đọc chịu được $N - R$ máy hỏng.</p>
        focus: ["1.2", "1.3", 2]
        say: "Với N bằng 5, có thể chọn cân bằng, R và W đều bằng 3, khi đó cả đọc lẫn ghi chịu được 2 máy hỏng. Hoặc chọn đọc nhanh, R bằng 1 và W bằng 5, đọc chịu được 4 máy hỏng nhưng ghi không chịu được máy hỏng nào, chỉ một máy hỏng là không ghi được. Tổng quát, ghi chịu được N trừ W máy hỏng, đọc chịu được N trừ R máy hỏng."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "[sorted([1, 20, 150])[w - 1] for w in (1, 2, 3)] == [1, 20, 150]"
      - "alg.quorum_overlap(3, 2, 2) and not alg.quorum_overlap(3, 1, 1) and 3 - 2 == 1"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Sao chép bất đồng bộ mà báo “đã lưu an toàn” <b class="red">(sai)</b>
          <br><span class="note">Ghi đã báo thành công vẫn có thể mất. Dữ liệu quan trọng (tiền) cần ít nhất một bản sao xác nhận trước khi báo.</span></div>
        say: "Lỗi thứ nhất, sao chép bất đồng bộ mà vẫn báo đã lưu an toàn. Ghi đã báo thành công vẫn có thể mất, nên dữ liệu quan trọng như tiền cần ít nhất một bản sao xác nhận trước khi báo."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ $R + W \gt N$ giải quyết mọi chuyện <b class="red">(chưa đủ)</b>
          <br><span class="note">Hai ghi đồng thời vào hai tập khác nhau vẫn cần cách quyết bản nào thắng (đồng hồ vector, bài 2). Khi thiếu máy mà ghi tạm sang máy khác, tính chất giao nhau mất.</span></div>
        say: "Lỗi thứ hai, nghĩ R cộng W lớn hơn N là giải quyết mọi chuyện. Hai lệnh ghi đồng thời vào hai tập khác nhau vẫn cần cách quyết bản nào thắng, như đồng hồ vector ở bài 2. Khi thiếu máy mà ghi tạm sang máy khác, tính chất giao nhau cũng mất."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn N chẵn để “cân bằng” <b class="red">(lãng phí)</b>
          <br><span class="note">N = 4 với R = W = 3 vẫn chỉ chịu được 1 máy hỏng, như N = 3 với R = W = 2. Thêm máy thứ tư chỉ thêm chi phí.</span></div>
        say: "Lỗi thứ ba, chọn N chẵn cho cân bằng. N bằng 4 với R và W bằng 3 vẫn chỉ chịu được 1 máy hỏng, giống N bằng 3 với R và W bằng 2, nên máy thứ tư chỉ thêm chi phí."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Hạ W xuống 1 để ghi nhanh, giữ R = 1 <b class="red">(mất bảo đảm đọc mới)</b></div>
          <table class="t"><tr><th>N = 3, ba bản sao chờ xác nhận sau</th><th>W = 1</th><th>W = 2</th><th>W = 3</th></tr>
          <tr><td>chờ bản xác nhận thứ W: 1 ms, 20 ms, 150 ms</td><td>1 ms</td><td>$\hl{20}$ ms</td><td>150 ms</td></tr>
          <tr><td>đọc R = 1 có luôn thấy bản mới?</td><td><b class="red">không</b> ($1 + 1 \le 3$)</td><td>cần R = 2</td><td>có</td></tr></table>
          <p class="note">Ghi chỉ chờ bản sao nhanh thứ W, không chờ bản chậm nhất. W = 2, R = 2 vẫn ghi trong 20 ms và một máy hỏng vẫn chạy.</p>
        introduces: [geq]
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, thấy ghi chậm thì hạ W xuống 1, trong khi đọc vẫn chỉ hỏi một máy. Giả sử ba bản sao trả lời sau 1, 20 và 150 mi li giây, thì ghi chỉ phải chờ bản xác nhận thứ W, tức 1, 20 hoặc 150 mi li giây. Hạ W xuống 1 đúng là nhanh nhất, nhưng 1 cộng 1 không lớn hơn 3, nên đọc có thể gặp bản cũ. Cách của người có kinh nghiệm là giữ W bằng 2 và R bằng 2. Ghi chỉ chờ bản sao nhanh thứ hai, khoảng 20 mi li giây, không phải chờ bản chậm nhất, và một máy hỏng thì hệ vẫn chạy."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[alg.quorum_overlap(5, r, w) for r, w in ((2, 3), (2, 4), (3, 3))] == [False, True, True]"
      - "5 - 4 == 1 and 5 - 2 == 3"
      - "not set([0, 1]) & set([2, 3, 4]) and 2 + 3 == 5 and 2 + 4 == 6 == 3 + 3"
    steps:
      - show: |
          <p>N = 5.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cặp nào bảo đảm đọc thấy bản mới nhất: (R, W) = (2, 3), (2, 4), (3, 3)?</td></tr>
          <tr><td>2</td><td>Với (2, 4): ghi chịu được mấy máy hỏng, đọc chịu được mấy?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, với N bằng 5. Câu một, trong ba cặp R và W là 2 và 3, 2 và 4, 3 và 3, cặp nào bảo đảm đọc thấy bản mới nhất? Câu hai, với R bằng 2 và W bằng 4, ghi chịu được mấy máy hỏng, đọc chịu được mấy? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: (R, W)</th><th>R + W</th><th>so với N = 5</th><th>bảo đảm?</th></tr>
          <tr><td>(2, 3)</td><td>5</td><td>bằng, không lớn hơn</td><td>không: đọc máy 1, 2 trượt ghi máy 3, 4, 5</td></tr>
          <tr><td>(2, 4)</td><td>6</td><td>$6 \gt 5$</td><td>$\hl{\text{có}}$</td></tr>
          <tr><td>(3, 3)</td><td>6</td><td>$6 \gt 5$</td><td>$\hl{\text{có}}$</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, cộng từng cặp rồi so với N bằng 5. Cặp 2 và 3 có tổng bằng 5, đúng bằng N, nên không bảo đảm. Ví dụ đọc máy 1 và 2 sẽ trượt hẳn lần ghi vào máy 3, 4 và 5. Cặp 2 và 4 có tổng 6, lớn hơn 5, nên bảo đảm. Cặp 3 và 3 cũng có tổng 6, nên cũng bảo đảm."
      - show: |
          <table class="t"><tr><th>câu 2: (R, W) = (2, 4)</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>ghi cần 4 trong 5 máy sống</td><td>$5 - 4$</td><td>chịu được $\hl{1}$ máy hỏng</td></tr>
          <tr><td>đọc cần 2 trong 5 máy sống</td><td>$5 - 2$</td><td>chịu được $\hl{3}$ máy hỏng</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu hai, với R bằng 2 và W bằng 4. Ghi cần 4 trong 5 máy còn sống, nên 5 trừ 4, chịu được 1 máy hỏng. Đọc chỉ cần 2 máy sống, nên 5 trừ 2, chịu được 3 máy hỏng."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bất đồng bộ: nhanh, có thể mất ghi</span><span class="a">→</span>
          <span class="n">đại biểu N, R, W</span><span class="a">→</span>
          <span class="n">R + W &gt; N: luôn gặp</span><span class="a">→</span>
          <span class="n">chịu được N − W, N − R máy hỏng</span></div>
        say: "Tổng kết lại, sao chép bất đồng bộ thì nhanh nhưng có thể mất ghi. Với đại biểu N, R, W, nếu R cộng W lớn hơn N thì đọc luôn gặp ghi, và ghi chịu được N trừ W, đọc chịu được N trừ R máy hỏng."
      - show: |
          <div class="box key"><b>Tư duy:</b> một bảo đảm trong hệ phân tán thường đến từ một lập luận đếm đơn giản — ở đây, hai đa số luôn có phần chung.</div>
        say: "Điều cần mang theo, một bảo đảm trong hệ phân tán thường đến từ một lập luận đếm đơn giản, ở đây là hai tập đủ lớn luôn có phần chung."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): khi mạng bị chia đôi — <b>định lý CAP</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta xét điều xảy ra khi mạng bị chia đôi, với định lý về nhất quán và sẵn sàng. Hẹn gặp bạn ở bài tiếp theo."
