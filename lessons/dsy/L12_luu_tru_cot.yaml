# Quy ước: bảng 10^8 dòng × 8 cột, mỗi ô 8 byte (số liệu minh hoạ). Nén theo loạt (run-length) = alg.rle: dãy → các cặp (giá trị, số lần lặp liền nhau).
#   Mã hoá từ điển: thay chuỗi bằng số hiệu nhỏ. Mọi số do Python trong checks.
objectives:
  - "Phân biệt lưu theo dòng và theo cột"
  - "Tính lượng dữ liệu phải đọc"
  - "Hiểu vì sao cột nén tốt, và khi nào lưu theo cột chậm"
