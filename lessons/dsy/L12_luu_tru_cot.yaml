scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tính trung bình một cột mà phải đọc cả bảng"
    checks:
      - "10 ** 8 * 8 * 8 / 10 ** 9 == 6.4 and 10 ** 8 * 8 / 10 ** 9 == 0.8"
    steps:
      - show: |
          <p>Bảng bán hàng 100 triệu dòng, 8 cột, mỗi ô 8 byte: $\hl{6{,}4}$ GB. Câu hỏi “giá trung bình là bao nhiêu?” chỉ cần cột giá — 0,8 GB. Nhưng nếu đĩa lưu <b>từng dòng</b> liền nhau, phải đọc cả 6,4 GB.</p>
          <div class="box key">Hôm nay: <b>lưu trữ theo cột</b> và <b>nén</b> — cách các hệ phân tích dữ liệu lớn có thể đọc ít hơn hàng chục lần.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một bảng bán hàng có 100 triệu dòng, 8 cột, mỗi ô 8 byte, tổng cộng 6 phẩy 4 ghi-ga-byte. Câu hỏi giá trung bình là bao nhiêu chỉ cần cột giá, tức 0 phẩy 8 ghi-ga-byte. Nhưng nếu đĩa lưu từng dòng liền nhau, ta phải đọc cả 6 phẩy 4 ghi-ga-byte. Hôm nay ta học lưu trữ theo cột và nén, cách các hệ phân tích dữ liệu lớn có thể đọc ít hơn hàng chục lần."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đổi byte ra GB, và bao nhiêu bit cho bao nhiêu giá trị"
    checks:
      - "10 ** 8 * 8 == 8 * 10 ** 8 and 8 * 10 ** 8 / 10 ** 9 == 0.8 and 10 ** 8 * 8 * 8 / 10 ** 9 == 6.4"
      - "[2 ** k for k in (1, 2, 3)] == [2, 4, 8]"
    steps:
      - show: |
          <p>Trong bài này, <b>1 GB = $10^9$ byte</b> (một tỉ byte).</p>
          <table class="t"><tr><th>đại lượng</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>một cột, 100 triệu dòng, ô 8 byte</td><td>$10^8 \cdot 8 = 8 \cdot 10^8$ byte</td><td>0,8 GB</td></tr>
          <tr><td>cả 8 cột</td><td>$8 \cdot 0{,}8$</td><td>6,4 GB</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Trước hết ta ôn cách đổi đơn vị. Trong bài này, một ghi-ga-byte là 10 mũ 9 byte, tức một tỉ byte. Một cột có 100 triệu dòng, mỗi ô 8 byte, là 10 mũ 8 nhân 8, bằng 8 nhân 10 mũ 8 byte, tức 0 phẩy 8 ghi-ga-byte. Cả 8 cột thì gấp 8 lần, bằng 6 phẩy 4 ghi-ga-byte."
      - show: |
          <table class="t"><tr><th>số bit mỗi ô</th><th>số giá trị phân biệt được</th></tr>
          <tr><td>1</td><td>$2^1 = 2$ (ví dụ 0 và 1)</td></tr>
          <tr><td>2</td><td>$2^2 = 4$</td></tr>
          <tr><td>3</td><td>$2^3 = 8$</td></tr></table>
          <p class="note">Đĩa và bộ nhớ đọc theo từng <b>khối liền nhau</b>: dữ liệu nằm cạnh nhau thì được đọc cùng lúc.</p>
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Điều thứ hai, một bit có hai trạng thái, nên phân biệt được 2 giá trị, ví dụ 0 và 1. Hai bit phân biệt được 2 mũ 2, bằng 4 giá trị. Ba bit phân biệt được 2 mũ 3, bằng 8 giá trị. Cuối cùng, đĩa và bộ nhớ đọc theo từng khối liền nhau, nên dữ liệu nằm cạnh nhau thì được đọc cùng lúc."

  - id: sym
    kind: symbol
    title: "Giải mã: theo dòng và theo cột"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>theo dòng</th><th>theo cột</th></tr>
          <tr><td>trên đĩa</td><td>dòng thứ nhất (mọi cột), dòng thứ hai (mọi cột), …</td><td>cột giá (mọi dòng), cột nước (mọi dòng), …</td></tr>
          <tr><td>nhanh khi</td><td>đọc/ghi <b>trọn một dòng</b>: đơn hàng mới, tra một khách</td><td>đọc <b>vài cột của rất nhiều dòng</b>: tổng, trung bình, đếm</td></tr>
          <tr><td>hợp với</td><td>hệ giao dịch (đặt hàng, chuyển tiền: mỗi lần vài dòng)</td><td>hệ phân tích, kho dữ liệu (gom dữ liệu nhiều năm để thống kê)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "So sánh hai cách lưu. Theo dòng thì trên đĩa là dòng thứ nhất với mọi cột, rồi dòng thứ hai với mọi cột, còn theo cột thì là cột giá của mọi dòng, rồi cột nước của mọi dòng. Theo dòng nhanh khi đọc hay ghi trọn một dòng, như một đơn hàng mới hay tra một khách. Theo cột nhanh khi đọc vài cột của rất nhiều dòng, như tính tổng, trung bình hay đếm. Vì vậy lưu theo dòng hợp với hệ giao dịch như đặt hàng hay chuyển tiền, mỗi lần chỉ đọc ghi vài dòng. Còn lưu theo cột hợp với hệ phân tích và kho dữ liệu, nơi gom dữ liệu nhiều năm để thống kê."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cùng một bảng, hai cách xếp trên đĩa"
    checks:
      - "4 * 3 == 12 and (20 + 30 + 20 + 50) / 4 == 30"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><g font-size="22" fill="#1f2937"><text x="20" y="40" font-weight="bold">bảng 4 dòng × 3 cột (mã, giá, nước); câu hỏi: giá trung bình?</text><text x="20" y="108">theo dòng</text><rect x="250" y="70" width="92" height="58" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="296" y="108" text-anchor="middle">1</text><rect x="342" y="70" width="92" height="58" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="388" y="108" text-anchor="middle">20</text><rect x="434" y="70" width="92" height="58" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="480" y="108" text-anchor="middle">VN</text><rect x="548" y="70" width="92" height="58" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="594" y="108" text-anchor="middle">2</text><rect x="640" y="70" width="92" height="58" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="686" y="108" text-anchor="middle">30</text><rect x="732" y="70" width="92" height="58" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="778" y="108" text-anchor="middle">US</text><rect x="846" y="70" width="92" height="58" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="892" y="108" text-anchor="middle">3</text><rect x="938" y="70" width="92" height="58" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="984" y="108" text-anchor="middle">20</text><rect x="1030" y="70" width="92" height="58" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="1076" y="108" text-anchor="middle">VN</text><rect x="1144" y="70" width="92" height="58" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="1190" y="108" text-anchor="middle">4</text><rect x="1236" y="70" width="92" height="58" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="1282" y="108" text-anchor="middle">50</text><rect x="1328" y="70" width="92" height="58" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="1374" y="108" text-anchor="middle">VN</text><line x1="250" y1="145" x2="1420" y2="145" stroke="#b91c1c" stroke-width="5"/><text x="250" y="180" fill="#b91c1c">phải đọc cả 12 ô, vì giá nằm xen giữa mã và nước</text><text x="20" y="288">theo cột</text><rect x="250" y="250" width="92" height="58" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="296" y="288" text-anchor="middle">1</text><rect x="342" y="250" width="92" height="58" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="388" y="288" text-anchor="middle">2</text><rect x="434" y="250" width="92" height="58" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="480" y="288" text-anchor="middle">3</text><rect x="526" y="250" width="92" height="58" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="572" y="288" text-anchor="middle">4</text><rect x="640" y="250" width="92" height="58" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="686" y="288" text-anchor="middle">20</text><rect x="732" y="250" width="92" height="58" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="778" y="288" text-anchor="middle">30</text><rect x="824" y="250" width="92" height="58" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="870" y="288" text-anchor="middle">20</text><rect x="916" y="250" width="92" height="58" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="962" y="288" text-anchor="middle">50</text><rect x="1030" y="250" width="92" height="58" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="1076" y="288" text-anchor="middle">VN</text><rect x="1122" y="250" width="92" height="58" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="1168" y="288" text-anchor="middle">US</text><rect x="1214" y="250" width="92" height="58" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="1260" y="288" text-anchor="middle">VN</text><rect x="1306" y="250" width="92" height="58" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="1352" y="288" text-anchor="middle">VN</text><line x1="640" y1="325" x2="1008" y2="325" stroke="#059669" stroke-width="5"/><text x="640" y="360" fill="#059669">chỉ đọc 4 ô của cột giá</text><text x="20" y="405" fill="#059669" font-weight="bold">giá trung bình = (20 + 30 + 20 + 50) / 4 = 30</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ một bảng nhỏ 4 dòng, 3 cột là mã, giá và nước, xếp trên đĩa theo hai cách. Theo dòng, giá của mỗi dòng nằm xen giữa mã và nước, nên muốn tính giá trung bình ta phải đọc cả 12 ô. Theo cột, 4 giá nằm liền nhau, nên chỉ đọc 4 ô của cột giá. Kết quả như nhau, giá trung bình bằng 20 cộng 30 cộng 20 cộng 50, chia 4, bằng 30, nhưng cách thứ hai đọc ít hơn 3 lần."

  - id: example
    kind: example
    title: "Nén theo loạt: một cột lặp nhiều"
    checks:
      - "alg.rle(['VN'] * 6 + ['US'] * 3 + ['VN']) == [('VN', 6), ('US', 3), ('VN', 1)]"
      - "alg.rle(sorted(['VN'] * 6 + ['US'] * 3 + ['VN'])) == [('US', 3), ('VN', 7)]"
    steps:
      - show: |
          <p>Cột “nước” của 10 dòng:</p>
          <table class="t"><tr><th>dòng</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr>
          <tr><th>nước</th><td>VN</td><td>VN</td><td>VN</td><td>VN</td><td>VN</td><td>VN</td><td>US</td><td>US</td><td>US</td><td>VN</td></tr></table>
        focus: [1, 2]
        say: "Bước một, xét cột nước của 10 dòng. Cột gồm sáu lần Việt Nam, ba lần Mỹ, rồi một lần Việt Nam."
      - show: |
          <p><b>Bước 2 — nén theo loạt</b>: đi từ trái sang phải, mỗi khi giá trị đổi thì đóng một loạt, ghi (giá trị, số lần lặp liền nhau).</p>
          <table class="t"><tr><th>loạt</th><th>dòng</th><th>cặp</th></tr>
          <tr><td>1</td><td>1 – 6</td><td>(VN, 6)</td></tr><tr><td>2</td><td>7 – 9</td><td>(US, 3)</td></tr><tr><td>3</td><td>10</td><td>(VN, 1)</td></tr></table>
          <p>$\hl{3}$ cặp thay cho 10 giá trị.</p>
        focus: [1, 2, 2, 3]
        say: "Bước hai, nén theo loạt. Ta đi từ trái sang phải, mỗi khi giá trị đổi thì đóng một loạt, và ghi giá trị cùng số lần lặp liền nhau. Được ba loạt, Việt Nam 6 lần, Mỹ 3 lần, Việt Nam 1 lần. Vậy chỉ cần ba cặp thay cho 10 giá trị."
      - clear: true
        show: |
          <p><b>Bước 3 — sắp bảng theo cột này trước</b>: mọi US đứng cạnh nhau, mọi VN đứng cạnh nhau.</p>
          <table class="t"><tr><th>loạt</th><th>cặp</th></tr><tr><td>1</td><td>(US, 3)</td></tr><tr><td>2</td><td>(VN, 7)</td></tr></table>
          <p>Chỉ còn $\hl{2}$ cặp: lần Việt Nam lẻ loi ở cuối cột đã nhập vào loạt dài.</p>
        focus: [1, 2, 3]
        say: "Bước ba, nếu sắp bảng theo cột này trước, mọi giá trị Mỹ đứng cạnh nhau và mọi giá trị Việt Nam đứng cạnh nhau. Ta còn hai cặp, Mỹ 3 lần và Việt Nam 7 lần. Lần Việt Nam lẻ loi ở dòng thứ mười đã nhập vào loạt dài."
      - clear: true
        show: |
          <p><b>Bước 4 — mã hoá từ điển</b>: VN → 0, US → 1. Cột chỉ có 2 giá trị, nên mỗi ô cần 1 bit.</p>
          <table class="t"><tr><th>cách lưu 10 ô</th><th>tính</th><th>số bit</th></tr>
          <tr><td>chuỗi 2 ký tự, mỗi ký tự 1 byte</td><td>$10 \cdot 2 \cdot 8$</td><td>160</td></tr>
          <tr><td>số hiệu trong từ điển</td><td>$10 \cdot 1$</td><td>$\hl{10}$, nhỏ hơn 16 lần</td></tr></table>
          <div class="box key">Trong một cột, các giá trị cùng kiểu và hay lặp: nén tốt hơn nhiều so với một dòng trộn đủ loại dữ liệu.</div>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước bốn, mã hoá từ điển thay hai chuỗi bằng 0 và 1, và vì cột chỉ có 2 giá trị nên mỗi ô chỉ cần 1 bit. Lưu nguyên chuỗi 2 ký tự, mỗi ký tự 1 byte, thì 10 ô tốn 10 nhân 2 nhân 8, bằng 160 bit. Lưu số hiệu trong từ điển chỉ tốn 10 bit, nhỏ hơn 16 lần. Trong một cột, các giá trị cùng kiểu và hay lặp lại, nên nén tốt hơn nhiều so với một dòng trộn đủ loại dữ liệu."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "sum(c for _, c in alg.rle(['VN'] * 6 + ['US'] * 3 + ['VN'])) == 10 and [v for v, c in alg.rle(['VN'] * 6 + ['US'] * 3 + ['VN']) for _ in range(c)] == ['VN'] * 6 + ['US'] * 3 + ['VN']"
      - "(lambda a: 1 + sum(a[i] != a[i - 1] for i in range(1, len(a))))(['VN'] * 6 + ['US'] * 3 + ['VN']) == 3"
      - "8 * 8 == 64 and 10 ** 8 * 64 == 64 * 10 ** 8 and 10 ** 8 * 64 / 10 ** 9 == 6.4 and 6.4 / 0.8 == 8"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>3 cặp có mất gì không?</td><td>giải nén: viết lại VN 6 lần, US 3 lần, VN 1 lần; tổng số lần $6 + 3 + 1 = 10$</td><td>đúng 10 giá trị như cũ ✓</td></tr>
          <tr><td>đếm loạt không cần nén</td><td>số loạt = 1 + số chỗ giá trị đổi; đổi sau ô thứ sáu và sau ô thứ chín</td><td>$1 + 2 = 3$ ✓</td></tr>
          <tr><td>6,4 GB tính theo từng dòng</td><td>mỗi dòng có 8 cột: $8 \cdot 8 = 64$ byte, nhân $10^8$ dòng</td><td>6,4 GB; chia 0,8 GB được 8, đúng bằng số cột ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Kiểm bằng đường khác. Giải nén ba cặp, viết lại Việt Nam 6 lần, Mỹ 3 lần, Việt Nam 1 lần. Tổng số lần là 6 cộng 3 cộng 1 bằng 10, đúng 10 giá trị như cũ, nên nén không mất gì. Đếm số loạt mà không cần nén, số loạt bằng 1 cộng số chỗ giá trị đổi, ở đây đổi hai lần, nên có 3 loạt. Tính lại 6 phẩy 4 ghi-ga-byte theo từng dòng, mỗi dòng có 8 cột, nhân 8 byte bằng 64 byte. Nhân 100 triệu dòng được 6 phẩy 4 ghi-ga-byte, và chia cho 0 phẩy 8 thì được 8, đúng bằng số cột."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "(lambda rows: (len(alg.rle([n for _, n in sorted(rows)])), len(alg.rle([n for _, n in sorted(rows, key=lambda r: (r[1], r[0]))]))))([(i, 'VN' if i % 2 else 'US') for i in range(1, 9)]) == (8, 2)"
      - "8 + 8 == 16 and 2 + 8 == 10"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng lưu theo cột cho hệ giao dịch <b class="red">(chậm)</b>
          <br><span class="note">Thêm một đơn hàng 8 cột = ghi vào 8 tệp khác nhau; đọc một dòng = ghép từ 8 chỗ. Lưu theo cột cho phân tích, theo dòng cho giao dịch.</span></div>
        say: "Lỗi thứ nhất, dùng lưu theo cột cho hệ giao dịch. Thêm một đơn hàng 8 cột nghĩa là ghi vào 8 tệp khác nhau, đọc một dòng là ghép từ 8 chỗ. Lưu theo cột cho phân tích, theo dòng cho giao dịch."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Truy vấn kiểu “lấy mọi cột” trên kho theo cột <b class="red">(mất lợi thế)</b>
          <br><span class="note">Đọc đủ 8 cột là đọc lại cả bảng. Chỉ chọn những cột thật sự cần.</span></div>
        say: "Lỗi thứ hai, truy vấn kiểu lấy mọi cột trên kho lưu theo cột. Đọc đủ 8 cột là đọc lại cả bảng, nên chỉ chọn những cột thật sự cần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Mong nén theo loạt tốt trên dữ liệu chưa sắp <b class="red">(kém)</b>
          <br><span class="note">Giá trị xen kẽ (VN, US, VN, US…) thì mỗi loạt dài 1: nén không giảm gì. Sắp theo cột hay lọc trước.</span></div>
        say: "Lỗi thứ ba, mong nén theo loạt tốt trên dữ liệu chưa sắp. Nếu giá trị xen kẽ nhau, mỗi loạt chỉ dài 1 và nén không giảm được gì, nên hãy sắp theo cột hay dùng để lọc trước."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Chọn thứ tự sắp của kho theo cột gần như không lặp (mã đơn, thời điểm) <b class="red">(phá nén)</b></div>
          <table class="t"><tr><th>8 đơn, nước xen kẽ VN, US</th><th>loạt ở cột nước</th><th>loạt ở cột mã đơn</th><th>tổng số cặp</th></tr>
          <tr><td>sắp theo mã đơn</td><td>8</td><td>8</td><td>16</td></tr>
          <tr><td>sắp theo nước, rồi mới theo mã đơn</td><td>$\hl{2}$</td><td>8</td><td>$\hl{10}$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, chọn thứ tự sắp của kho theo một cột gần như không lặp, như mã đơn hay thời điểm. Lấy 8 đơn có nước xen kẽ Việt Nam, Mỹ. Sắp theo mã đơn thì cột nước đổi giá trị ở mỗi dòng, có 8 loạt, cộng 8 loạt của mã đơn là 16 cặp. Sắp theo nước trước, rồi mới theo mã đơn, thì cột nước chỉ còn 2 loạt, tổng 10 cặp. Người có kinh nghiệm đặt cột ít giá trị khác nhau lên đầu thứ tự sắp, rồi đo lại kích thước sau khi nén."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.rle(list('AABBBACC')) == [('A', 2), ('B', 3), ('A', 1), ('C', 2)] and alg.rle(sorted('AABBBACC')) == [('A', 3), ('B', 3), ('C', 2)]"
      - "10 ** 8 * 10 * 4 / 10 ** 9 == 4.0 and 10 ** 8 * 2 * 4 / 10 ** 9 == 0.8"
      - "10 ** 8 * 10 * 4 == 4 * 10 ** 9 and 10 ** 8 * 2 * 4 == 8 * 10 ** 8 and 4 / 0.8 == 5 == 10 / 2 and sorted('AABBBACC') == list('AAABBBCC')"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nén theo loạt cột A, A, B, B, B, A, C, C. Nếu sắp trước thì sao?</td></tr>
          <tr><td>2</td><td>Bảng 100 triệu dòng, 10 cột, ô 4 byte. Truy vấn cần 2 cột: lưu theo dòng đọc bao nhiêu GB, theo cột bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, nén theo loạt cột A, A, B, B, B, A, C, C. Nếu sắp trước thì sao? Câu hai, bảng 100 triệu dòng, 10 cột, mỗi ô 4 byte, một truy vấn cần 2 cột. Lưu theo dòng phải đọc bao nhiêu ghi-ga-byte, theo cột thì bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>các loạt</th><th>số cặp</th></tr>
          <tr><td>giữ nguyên thứ tự</td><td>(A, 2) (B, 3) (A, 1) (C, 2)</td><td>4</td></tr>
          <tr><td>sắp trước: A, A, A, B, B, B, C, C</td><td>(A, 3) (B, 3) (C, 2)</td><td>$\hl{3}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, làm từng bước. Giữ nguyên thứ tự, đi từ trái sang phải được bốn loạt, A 2 lần, B 3 lần, A 1 lần, C 2 lần, tức 4 cặp. Sắp trước thì ba chữ A đứng cạnh nhau, được A 3 lần, B 3 lần, C 2 lần, chỉ 3 cặp."
      - show: |
          <table class="t"><tr><th>câu 2</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>theo dòng: đọc cả 10 cột</td><td>$10^8 \cdot 10 \cdot 4 = 4 \cdot 10^9$ byte</td><td>4 GB</td></tr>
          <tr><td>theo cột: chỉ 2 cột</td><td>$10^8 \cdot 2 \cdot 4 = 8 \cdot 10^8$ byte</td><td>$\hl{0{,}8}$ GB, ít hơn 5 lần</td></tr></table>
        focus: [1, "1.2", "1.3", 1]
        say: "Câu hai, lưu theo dòng phải đọc 4 ghi-ga-byte, theo cột chỉ đọc 0 phẩy 8 ghi-ga-byte. Vì theo dòng phải đọc cả 10 cột, 10 mũ 8 nhân 10 nhân 4, bằng 4 nhân 10 mũ 9 byte. Còn theo cột chỉ đọc 2 cột, 10 mũ 8 nhân 2 nhân 4, bằng 8 nhân 10 mũ 8 byte. Tức là ít hơn 5 lần, đúng bằng 10 cột chia 2 cột."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">theo dòng: giao dịch</span><span class="a">→</span>
          <span class="n">theo cột: phân tích, chỉ đọc cột cần</span><span class="a">→</span>
          <span class="n">cột lặp nhiều: nén theo loạt, từ điển</span><span class="a">→</span>
          <span class="n">sắp trước: nén tốt hơn</span></div>
        say: "Tổng kết lại, lưu theo dòng cho giao dịch, lưu theo cột cho phân tích, chỉ đọc cột cần. Cột lặp nhiều thì nén theo loạt và mã hoá từ điển, và sắp trước thì nén tốt hơn."
      - show: |
          <div class="box key"><b>Tư duy:</b> bố trí dữ liệu theo cách nó được <b>đọc</b>, không theo cách nó được <b>ghi</b> lần đầu.</div>
        say: "Điều cần mang theo, hãy bố trí dữ liệu theo cách nó được đọc, không theo cách nó được ghi lần đầu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): một giao dịch trên nhiều máy — <b>cam kết hai pha</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta học cách thực hiện một giao dịch trên nhiều máy, với cam kết hai pha. Hẹn gặp bạn ở bài tiếp theo."
