  - id: example
    kind: example
    title: "10 bit mỗi phần tử, 7 hàm băm"
    checks:
      - "round(alg.bloom_fp(10, 7), 4) == 0.0082 and round(10 * math.log(2), 2) == 6.93"
      - "alg.bloom_sim(1000, 10, 7) == (0.008215, 0)"
      - "round(alg.bloom_fp(10, 3), 4) == 0.0174 and round(alg.bloom_fp(5, 3), 4) == 0.0918"
      - "round(math.log(2), 3) == 0.693 and abs(math.exp(math.log(2)) - 2) < 1e-12 and 7000 / 10000 == 0.7 and abs((1 - 1 / 10000) ** 7000 - ((1 - 1 / 10000) ** 10000) ** 0.7) < 1e-12 and min(range(1, 15), key=lambda k: alg.bloom_fp(10, k)) == 7"
      - "round(1 - 1 / 10000, 4) == 0.9999 and round((1 - 1 / 10000) ** 7000, 4) == 0.4966 and round(math.exp(-0.7), 4) == 0.4966"
      - "round(1 - 0.4966, 4) == 0.5034 and round(0.5034 ** 7, 4) == 0.0082"
    steps:
      - show: |
          <p><b>Bước một</b> — một lần băm bật đúng 1 trong m bit. Một bit cố định <b>không</b> bị lần băm đó bật:</p>
          $$1 - \frac{1}{m} \quad (m = 10\,000:\ 0{,}9999)$$
        focus: [0, 1, 2]
        say: "Bước một, suy ra công thức. Một lần băm bật đúng 1 trong m bit, nên một bit cố định không bị lần băm đó bật với xác suất 1 trừ 1 phần m. Với m bằng mười nghìn bit, xác suất đó là 0 phẩy 9999."
      - show: |
          <p><b>Bước 2</b> — n phần tử, mỗi phần tử k lần băm: tổng $kn$ lần. Bit vẫn là 0 sau tất cả: viết $kn = m \cdot \frac{kn}{m}$,</p>
          $$\left(1 - \frac{1}{m}\right)^{kn} = \left[\left(1 - \frac{1}{m}\right)^{m}\right]^{kn/m} \approx \left(\frac{1}{e}\right)^{kn/m} = e^{-kn/m}$$
          $$n = 1000,\ k = 7,\ m = 10\,000:\ \frac{kn}{m} = 0{,}7;\quad \left(1 - \frac{1}{10\,000}\right)^{7000} \approx e^{-0{,}7} \approx 0{,}4966$$
        introduces: [exp]
        focus: [1, 1, 2, 2, 3]
        say: "Bước hai, có n phần tử, mỗi phần tử băm k lần, tổng cộng k nhân n lần. Bit vẫn là 0 sau tất cả với xác suất 1 trừ 1 phần m, mũ k n. Tách số mũ k n thành m nhân k n chia m, thì lũy thừa này bằng 1 trừ 1 phần m mũ m, tất cả lại mũ k n chia m. Phần trong ngoặc gần 1 phần e như ở phần chuẩn bị, nên kết quả xấp xỉ 1 phần e mũ k n chia m, viết gọn là e mũ âm k n chia m. Với một nghìn phần tử và k bằng 7, ta có 7 nghìn lần băm trên mười nghìn bit, xác suất bit vẫn là 0 khoảng e mũ âm 0 phẩy 7, bằng 0 phẩy 4966."
      - clear: true
        show: |
          <p><b>Bước 3</b> — tỉ lệ bit đã bật là phần còn lại:</p>
          $$1 - 0{,}4966 = 0{,}5034 \quad \text{(gần một nửa)}$$
        focus: [2]
        say: "Bước ba, tỉ lệ bit đã bật là phần còn lại, 1 trừ 0 phẩy 4966, bằng 0 phẩy 5034, tức gần một nửa số bit đã là 1."
      - show: |
          <p><b>Bước 4</b> — hỏi một khoá chưa thêm: nói nhầm khi <b>cả k bit</b> của nó đều đã bật:</p>
          $$\left(1 - e^{-kn/m}\right)^k = 0{,}5034^7 \approx \hl{0{,}0082} = 0{,}82\%$$
        focus: [1, 2, 2, 2]
        say: "Bước bốn, hỏi một khoá chưa được thêm. Bộ lọc nói nhầm khi cả k bit của nó đều đã bật, như khoá z trong hình. Xác suất đó là 0 phẩy 5034 mũ 7, khoảng 0 phẩy 0082, tức 0 phẩy 82 phần trăm. Đó chính là công thức 1 trừ e mũ âm k n chia m, tất cả mũ k."
      - clear: true
        show: |
          <p><b>Bước 5</b> — đổi cấu hình, tính lại bằng cùng công thức:</p>
          <table class="t"><tr><th>bit mỗi phần tử</th><th>k</th><th>dương tính giả</th></tr>
          <tr><td>10</td><td>7 (gần tối ưu $10 \ln 2 \approx 6{,}93$)</td><td>0,82%</td></tr><tr><td>10</td><td>3</td><td>1,74%</td></tr><tr><td>5</td><td>3</td><td>9,18%</td></tr></table>
          <p class="note">$\ln 2 \approx 0{,}693$ (lô-ga-rít tự nhiên của 2) là số mũ $x$ để $e^x = 2$. Người ta chứng minh số hàm băm tốt nhất là (số bit mỗi phần tử) $\cdot \ln 2$.</p>
        introduces: [log]
        focus: [1, "2.2", 3, 3, "2.3", "2.4"]
        say: "Bước năm, đổi cấu hình rồi tính lại bằng cùng công thức. 10 bit mỗi phần tử với k bằng 7, gần mức tối ưu là 10 nhân lô-ga-rít tự nhiên của 2, khoảng 6 phẩy 93, cho 0 phẩy 82 phần trăm. Ở đây lô-ga-rít tự nhiên của 2, khoảng 0 phẩy 693, là số mũ x sao cho e mũ x bằng 2. Người ta chứng minh được số hàm băm tốt nhất bằng số bit mỗi phần tử nhân với con số này. 10 bit với k bằng 3 cho 1 phẩy 74 phần trăm. 5 bit với k bằng 3 cho tới 9 phẩy 18 phần trăm."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "alg.bloom_sim(1000, 10, 7) == (0.008215, 0)"
      - "(lambda it: Fraction(sum(all(b in set(ins) for b in q) for ins in it.product(range(8), repeat=4) for q in it.product(range(8), repeat=2)), 8 ** 6))(__import__('itertools')) == Fraction(5825, 32768) and 8 ** 6 == 262144"
      - "round(5825 / 32768, 3) == 0.178 and round((1 - (1 - 1 / 8) ** 4) ** 2, 3) == 0.171"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>bộ lọc thật</td><td>1000 khoá, 10 000 bit, 7 hàm băm; thử 200 000 khoá không có, đếm số lần nói nhầm</td><td>0,8215% so với 0,82% ✓; <b>0</b> âm tính giả</td></tr>
          <tr><td>bộ lọc tí hon, liệt kê hết</td><td>8 bit, 2 hàm băm, 2 phần tử: mọi cách băm, $8^6 = 262\,144$ trường hợp</td><td>đếm thẳng 17,8%; công thức $\left(1 - \left(\frac{7}{8}\right)^4\right)^2$ cho 17,1% ✓ gần</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, không dùng công thức. Dựng một bộ lọc thật với một nghìn khoá, mười nghìn bit, 7 hàm băm, rồi thử hai trăm nghìn khoá không có và đếm số lần nói nhầm. Kết quả 0 phẩy 8215 phần trăm, khớp 0 phẩy 82, và không có âm tính giả nào. Với một bộ lọc tí hon 8 bit, 2 hàm băm, 2 phần tử, ta liệt kê hết mọi cách băm, 8 mũ 6 bằng 262 nghìn 144 trường hợp. Đếm thẳng được 17 phẩy 8 phần trăm. Công thức cho 17 phẩy 1, hơi thấp hơn vì công thức coi các bit độc lập, nhưng với bộ lọc lớn hai con số gần như trùng nhau."

  # ───────────────────────── 4. ĐẾM KHÁC NHAU ─────────────────────────
  - id: distinct
    kind: concept
    title: "Đếm số phần tử khác nhau bằng 256 con số"
    checks:
      - "round(alg.kmv_estimate([i % 100000 for i in range(300000)], 256)) == 92806 and round(1 / math.sqrt(254), 3) == 0.063"
      - "round((100000 - 92806) / 100000 * 100) == 7 and 1 / math.sqrt(254) < 0.072 < 2 / math.sqrt(254)"
      - "(lambda k, D: (Fraction(D, k - 1) * (k - 1) == D, Fraction(D, k - 1) * k > D))(256, 100000) == (True, True)"
    steps:
      - show: |
          <p>Luồng 300 000 lượt truy cập từ 100 000 người khác nhau. Băm mỗi người về một số từ 0 tới dưới 1 (cùng người, cùng số), giữ <b>256 giá trị nhỏ nhất khác nhau</b>. D người khác nhau cho D số rải đều trên đoạn dài 1, trung bình cứ $\frac{1}{D}$ một số, nên số nhỏ thứ 256, gọi là $v_{256}$, khoảng $256 / D$ → ước lượng $D \approx 255 / v_{256}$. Chia $255 = 256 - 1$ vì người ta chứng minh được $255 / v_{256}$ <b>trung bình đúng bằng D</b>, còn $256 / v_{256}$ trung bình hơi lớn hơn D.</p>
          <p>Kết quả: ước lượng $\hl{92\,806}$ (thật là 100 000, lệch 7%). <b>Sai số chuẩn</b> (mức lệch thường gặp giữa ước lượng và số thật) khi giữ $k$ giá trị khoảng $1/\sqrt{k-2}$; với $k = 256$ là $1/\sqrt{254} \approx 6{,}3\%$, nên lệch 7% là bình thường. Con số này chỉ phụ thuộc số giá trị giữ lại, không phụ thuộc kích thước luồng.</p>
        introduces: [sub]
        focus: [1, 1, 1, 1, 1, 1, 2, 2, 2, 2]
        say: "Bài toán thứ hai là đếm số phần tử khác nhau. Luồng có ba trăm nghìn lượt truy cập từ một trăm nghìn người khác nhau. Ta băm mỗi người về một số từ 0 tới dưới 1, cùng người thì cùng số, và chỉ giữ 256 giá trị nhỏ nhất khác nhau. D người khác nhau cho D con số rải đều trên đoạn dài 1, trung bình cứ 1 phần D lại có một số, nên số nhỏ thứ 256 nằm khoảng 256 chia D. Đảo lại, D xấp xỉ 256 chia số nhỏ thứ 256, nhưng người ta dùng 255, tức 256 trừ 1. Lý do là người ta chứng minh được chia 255 thì trung bình qua nhiều lần chạy đúng bằng D, còn chia 256 thì trung bình hơi lớn hơn D. Kết quả ước lượng là chín mươi hai nghìn tám trăm linh sáu, trong khi số thật là một trăm nghìn, lệch 7 phần trăm. Sai số chuẩn là mức lệch thường gặp giữa ước lượng và số thật, và khi giữ k giá trị thì nó khoảng 1 chia căn của k trừ 2. Với k bằng 256, đó là 1 chia căn của 254, khoảng 6 phẩy 3 phần trăm, nên lệch 7 phần trăm là bình thường. Con số này chỉ phụ thuộc số giá trị giữ lại, không phụ thuộc kích thước luồng."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "round(alg.bloom_fp(5, 7), 3) == 0.138 and alg.bloom_sim(1000, 5, 7)[0] == 0.13918"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Xoá phần tử khỏi bộ lọc bằng cách tắt bit <b class="red">(sai)</b>
          <br><span class="note">Bit đó có thể đang được phần tử khác dùng → tạo âm tính giả. Bộ lọc chuẩn không xoá được; cần biến thể đếm (mỗi ô là bộ đếm).</span></div>
        say: "Lỗi thứ nhất, xoá phần tử khỏi bộ lọc bằng cách tắt bit. Bit đó có thể đang được phần tử khác dùng, và ta tạo ra âm tính giả. Bộ lọc chuẩn không xoá được, cần một biến thể mà mỗi ô là một bộ đếm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn kích thước cho số phần tử hiện tại <b class="red">(hỏng dần)</b>
          <br><span class="note">Thêm gấp đôi số phần tử dự kiến thì số bit mỗi phần tử còn 5, mà vẫn 7 hàm băm: dương tính giả từ 0,82% lên khoảng 14%. Chọn m theo số phần tử tối đa.</span></div>
          <table class="t"><tr><th>số phần tử</th><th>bit mỗi phần tử</th><th>k</th><th>dương tính giả</th></tr>
          <tr><td>như dự kiến</td><td>10</td><td>7</td><td>0,82%</td></tr>
          <tr><td>gấp đôi</td><td>5</td><td>7</td><td class="red">≈ 13,8% (đo thật 13,9%)</td></tr></table>
        focus: [1, 2, 1]
        say: "Lỗi thứ hai, chọn kích thước theo số phần tử hiện tại. Thêm gấp đôi số phần tử dự kiến thì số bit mỗi phần tử chỉ còn 5, mà vẫn dùng 7 hàm băm, nên dương tính giả tăng từ 0 phẩy 82 lên khoảng 14 phần trăm. Hãy chọn m theo số phần tử tối đa."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng cấu trúc xác suất khi cần câu trả lời chắc chắn <b class="red">(sai chỗ)</b>
          <br><span class="note">“Tài khoản này đã bị khoá chưa?” không được trả lời “có thể”. Dùng bộ lọc để lọc nhanh, rồi kiểm lại chính xác khi nó nói “có thể”.</span></div>
        say: "Lỗi thứ ba, dùng cấu trúc xác suất khi cần câu trả lời chắc chắn. Câu hỏi tài khoản này đã bị khoá chưa không được trả lời là có thể, nên hãy dùng bộ lọc để lọc nhanh, rồi kiểm lại chính xác khi nó nói có thể."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.bloom_fp(8, 6), 4) == 0.0216 and round(8 * math.log(2), 2) == 5.55"
      - "10 ** 8 * 8 / 8 / 10 ** 6 == 100"
      - "round(math.exp(-0.75), 4) == 0.4724 and round(1 - math.exp(-0.75), 4) == 0.5276 and round(0.5276 ** 6, 4) == 0.0216"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>8 bit mỗi phần tử, 6 hàm băm: tỉ lệ dương tính giả khoảng bao nhiêu? k tối ưu?</td></tr>
          <tr><td>2</td><td>100 triệu phần tử, 8 bit mỗi phần tử: bộ lọc cần bao nhiêu MB?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với 8 bit mỗi phần tử và 6 hàm băm, tỉ lệ dương tính giả khoảng bao nhiêu? K tối ưu là bao nhiêu? Câu hai, 100 triệu phần tử, 8 bit mỗi phần tử, bộ lọc cần bao nhiêu mê-ga-byte? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>bit vẫn là 0</td><td>$e^{-6/8} = e^{-0{,}75}$</td><td>0,4724</td></tr>
          <tr><td>bit đã bật</td><td>$1 - 0{,}4724$</td><td>0,5276</td></tr>
          <tr><td>cả 6 bit đã bật</td><td>$0{,}5276^6$</td><td>$\approx \hl{2{,}16\%}$</td></tr>
          <tr><td>k tối ưu</td><td>$8 \ln 2$</td><td>$\approx 5{,}55$, nên 6 là hợp lý</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, làm theo đúng bốn bước đã suy ra. Bit vẫn là 0 với xác suất e mũ âm 6 phần 8, tức e mũ âm 0 phẩy 75, khoảng 0 phẩy 4724. Bit đã bật với xác suất 1 trừ số đó, bằng 0 phẩy 5276. Cả 6 bit đều đã bật với xác suất 0 phẩy 5276 mũ 6, khoảng 2 phẩy 16 phần trăm. K tối ưu là 8 nhân lô-ga-rít tự nhiên của 2, khoảng 5 phẩy 55, nên chọn 6 là hợp lý."
      - show: |
          <table class="t"><tr><th>câu 2</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>tổng số bit</td><td>$10^8 \cdot 8$</td><td>$8 \cdot 10^8$ bit</td></tr>
          <tr><td>đổi ra byte</td><td>$8 \cdot 10^8 / 8$</td><td>$10^8$ byte $= \hl{100}$ MB</td></tr></table>
        focus: [0, 1]
        say: "Câu hai, 100 triệu nhân 8 bit là 100 triệu byte, tức 100 mê-ga-byte. Từng bước, tổng số bit là 100 triệu nhân 8, tức 800 triệu bit, rồi chia cho 8 để đổi ra byte."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bộ lọc: k bit cho mỗi phần tử</span><span class="a">→</span>
          <span class="n">không âm tính giả, dương tính giả tính được</span><span class="a">→</span>
          <span class="n">10 bit/phần tử: ≈ 0,8%</span><span class="a">→</span>
          <span class="n">đếm khác nhau: giữ k giá trị nhỏ nhất</span></div>
        say: "Tổng kết lại, bộ lọc dùng k bit cho mỗi phần tử, không có âm tính giả, còn dương tính giả tính trước được, khoảng 0 phẩy 8 phần trăm với 10 bit mỗi phần tử. Để đếm số phần tử khác nhau, chỉ cần giữ k giá trị băm nhỏ nhất."
      - show: |
          <div class="box key"><b>Tư duy:</b> câu trả lời “gần đúng, với sai số biết trước” thường đủ dùng — và rẻ hơn câu trả lời chính xác hàng chục lần.</div>
        say: "Điều cần mang theo, một câu trả lời gần đúng với sai số biết trước thường đủ dùng, và rẻ hơn câu trả lời chính xác hàng chục lần."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): lấy mẫu ngẫu nhiên công bằng từ một luồng không biết trước độ dài — <b>lấy mẫu hồ chứa</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta học cách lấy mẫu ngẫu nhiên công bằng từ một luồng không biết trước độ dài, gọi là lấy mẫu hồ chứa. Hẹn gặp bạn ở bài tiếp theo."
