id: L10
course: DSY
series: "DSY · Hệ phân tán và dữ liệu lớn"
title: "Bài 10 — Cấu trúc xác suất: bộ lọc Bloom, đếm phần tử khác nhau"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsy.yaml L10; audit/dsy/verify_dsy.py L10; B. H. Bloom, Space/Time Trade-offs in Hash Coding with Allowable Errors, CACM 13(7), 1970; Z. Bar-Yossef và cộng sự, Counting Distinct Elements in a Data Stream, RANDOM 2002 (k giá trị nhỏ nhất); K. Beyer, P. J. Haas, B. Reinwald, Y. Sismanis, R. Gemulla, On Synopses for Distinct-Value Estimation Under Multiset Operations, SIGMOD 2007 ((k − 1)/v_k không lệch, sai số chuẩn tương đối ≈ 1/√(k − 2)); A. Broder, M. Mitzenmacher, Network Applications of Bloom Filters, Internet Mathematics 1(4), 2004 (k tối ưu = (m/n) ln 2); DMS bài 19 (xác suất)"
assumes: [arith, frac, approx, power, cdot, sqrt]
# Quy ước: bộ lọc Bloom m bit, k hàm băm, n phần tử; tỉ lệ dương tính giả xấp xỉ (1 − e^{−kn/m})^k (alg.bloom_fp) và đo thật bằng alg.bloom_sim
#   (1000 khoá, 10 bit/khoá, 7 hàm băm, thử 200 000 khoá không có). Đếm khác nhau: k giá trị băm nhỏ nhất (alg.kmv_estimate, k = 256) trên
#   300 000 phần tử gồm 100 000 giá trị khác nhau. Tên Bloom chỉ trên màn hình; lời đọc nói “bộ lọc băm nhiều bit”.
objectives:
  - "Hiểu bộ lọc Bloom: không âm tính giả, có dương tính giả"
  - "Tính tỉ lệ dương tính giả theo số bit mỗi phần tử"
  - "Đếm số phần tử khác nhau bằng bộ nhớ cố định"
