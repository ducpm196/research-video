scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một tỉ địa chỉ web, kiểm “đã thấy chưa”"
    checks:
      - "10 ** 9 * 50 / 10 ** 9 == 50 and 10 ** 9 * 10 / 8 / 10 ** 9 == 1.25"
    steps:
      - show: |
          <p>Bộ thu thập web cần biết một địa chỉ đã ghé chưa. Một tỉ địa chỉ, mỗi địa chỉ khoảng 50 byte (số minh hoạ): <b>50 GB</b> — quá tốn nếu chỉ để trả lời “đã thấy chưa”.</p>
          <p>Nếu chấp nhận thỉnh thoảng nói nhầm “đã thấy” (rồi bỏ qua một trang chưa ghé): chỉ cần khoảng $\hl{1{,}25}$ GB.</p>
          <div class="box key">Hôm nay: <b>cấu trúc xác suất</b> — đổi một chút sai số lấy rất nhiều bộ nhớ.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, một bộ thu thập các trang mạng cần biết một địa chỉ đã được ghé chưa. Một tỉ địa chỉ, mỗi địa chỉ khoảng 50 byte, tổng cộng 50 ghi-ga-byte, quá tốn nếu chỉ để trả lời đã thấy chưa. Nếu chấp nhận thỉnh thoảng nói nhầm là đã thấy, rồi bỏ qua một trang chưa ghé, thì chỉ cần khoảng 1 phẩy 25 ghi-ga-byte. Hôm nay ta học cấu trúc xác suất, đổi một chút sai số lấy rất nhiều bộ nhớ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: bit và byte, hàm băm, và con số 1 phần e"
    checks:
      - "10 ** 9 * 10 == 10 ** 10 and 10 ** 10 / 8 == 1.25 * 10 ** 9"
      - "(23 % 10, 47 % 10, 33 % 10) == (3, 7, 3)"
      - "round((1 - 1 / 10) ** 10, 3) == 0.349 and round((1 - 1 / 1000) ** 1000, 3) == 0.368 and round(1 / math.e, 3) == 0.368"
      - "(1 - 1 / 2) ** 2 == 0.5 * 0.5 == 0.25 and round(math.e, 3) == 2.718 and (1 - 1 / 2) ** 2 < (1 - 1 / 10) ** 10 < (1 - 1 / 1000) ** 1000 < 1 / math.e"
    steps:
      - show: |
          <table class="t"><tr><th>đổi đơn vị</th><th>ví dụ</th></tr>
          <tr><td>1 byte = 8 bit</td><td>một tỉ phần tử, 10 bit mỗi phần tử: $10^{10}$ bit</td></tr>
          <tr><td>chia 8 ra byte</td><td>$10^{10} / 8 = 1{,}25$ tỉ byte $= \hl{1{,}25}$ GB — đúng con số mở đầu</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3"]
        say: "Bài này cần ba điều quen thuộc. Thứ nhất, đổi đơn vị, 1 byte gồm 8 bit. Một tỉ phần tử, mỗi phần tử 10 bit, là 10 mũ 10 bit. Chia cho 8 được 1 phẩy 25 tỉ byte, tức 1 phẩy 25 ghi-ga-byte, đúng con số ở phần mở đầu."
      - show: |
          <p><b>Hàm băm</b> biến một khoá thành một số trong $0, 1, \dots, m - 1$. Ví dụ đơn giản với $m = 10$: lấy số dư khi chia 10.</p>
          <table class="t"><tr><th>khoá</th><td>23</td><td>47</td><td>33</td></tr>
          <tr><th>băm</th><td>3</td><td>7</td><td>$\hl{3}$ — trùng với 23</td></tr></table>
        introduces: [dots]
        focus: [1, 2, 2, 2]
        say: "Thứ hai, ở bài 6 ta đã dùng hàm băm, một hàm biến mỗi khoá thành một con số, cùng khoá thì luôn ra cùng số. Ví dụ đơn giản với m bằng 10, lấy số dư khi chia cho 10. Khoá 23 cho 3, khoá 47 cho 7. Khoá 33 cũng cho 3, trùng với 23, vì khoá khác nhau vẫn có thể rơi vào cùng một ô."
      - clear: true
        show: |
          <p>Con số $e \approx 2{,}718$ là một hằng số của toán học, như số pi. Khi $m$ lớn, $\left(1 - \frac{1}{m}\right)^m$ tiến gần $\frac{1}{e} \approx 0{,}368$.</p>
          <table class="t"><tr><th>m</th><th>$\left(1 - \frac{1}{m}\right)^m$</th></tr>
          <tr><td>2</td><td>$0{,}5 \cdot 0{,}5 = 0{,}25$</td></tr><tr><td>10</td><td>0,349</td></tr><tr><td>1000</td><td>$\hl{0{,}368}$</td></tr></table>
          <p class="note">Nghĩa: có m ô, rút ngẫu nhiên m lần, mỗi lần một ô. Một ô cố định không bị rút ở một lần với $1 - \frac{1}{m}$, không bị rút lần nào với $\left(1 - \frac{1}{m}\right)^m$.</p>
        focus: [1, 3, 3, "2.2", "2.3", "2.4", 1]
        say: "Thứ ba là con số e, khoảng 2 phẩy 718, một hằng số của toán học giống như số pi. Hãy tưởng tượng có m ô, và ta rút ngẫu nhiên m lần, mỗi lần một ô. Một ô cố định không bị rút ở một lần với xác suất 1 trừ 1 phần m, nên không bị rút lần nào với xác suất 1 trừ 1 phần m, tất cả mũ m. Với m bằng 2, đó là 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 25. Với m bằng 10, con số là 0 phẩy 349. Với m bằng 1000, con số đã là 0 phẩy 368. Khi m càng lớn, con số càng gần 1 phần e, khoảng 0 phẩy 368."

  - id: sym
    kind: symbol
    title: "Giải mã: bộ lọc Bloom"
    steps:
      - show: |
          <p>Một mảng <b>m bit</b>, ban đầu toàn 0, và <b>k hàm băm</b>.</p>
          <ol><li><b>Thêm</b> x: tính k giá trị băm, bật k bit đó lên 1.</li>
          <li><b>Hỏi</b> x: nếu có một bit trong k bit là 0 → x <b>chắc chắn chưa</b> thêm. Nếu cả k bit là 1 → x <b>có thể</b> đã thêm (hoặc các bit đó bị phần tử khác bật).</li></ol>
          <div class="box key">Không bao giờ âm tính giả; có dương tính giả với xác suất tính được.</div>
        focus: [1, "2.1", "2.2", "2.2", 3]
        say: "Bộ lọc gồm một mảng m bit, ban đầu toàn 0, và k hàm băm. Để thêm x, tính k giá trị băm và bật k bit đó lên 1. Để hỏi x, nếu có một bit trong k bit là 0 thì x chắc chắn chưa được thêm. Nếu cả k bit đều là 1 thì x có thể đã được thêm, hoặc các bit đó bị phần tử khác bật. Vì vậy bộ lọc không bao giờ âm tính giả, chỉ có dương tính giả với xác suất tính được."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bit do phần tử khác bật gây ra dương tính giả"
    checks:
      - "set((1, 6, 11)) | set((4, 9, 13)) == {1, 4, 6, 9, 11, 13} and set((4, 6, 11)) <= {1, 4, 6, 9, 11, 13} and 2 not in {1, 4, 6, 9, 11, 13}"
    steps:
      - show: |
