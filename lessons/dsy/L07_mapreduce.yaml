id: L07
course: DSY
series: "DSY · Hệ phân tán và dữ liệu lớn"
title: "Bài 7 — MapReduce: map, xáo trộn, reduce"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsy.yaml L07; audit/dsy/verify_dsy.py L07; J. Dean, S. Ghemawat, MapReduce: Simplified Data Processing on Large Clusters, OSDI 2004"
assumes: [arith, frac]
# Quy ước: tên MapReduce, map, reduce chỉ trên màn hình; lời đọc nói “ánh xạ”, “xáo trộn”, “rút gọn”. Mỗi dòng văn bản là một tác vụ ánh xạ;
#   “gộp sớm” (combiner) cộng cục bộ trước khi xáo trộn. Kết quả và số cặp gửi qua mạng do alg.word_count trong checks.
objectives:
  - "Viết một phép tính theo ba bước ánh xạ, xáo trộn, rút gọn"
  - "Hiểu vì sao xáo trộn thường đắt nhất"
  - "Dùng gộp sớm đúng chỗ"
asr_reviewed:
  - {sentence: "Từ lặp càng nhiều, gộp sớm càng bớt nhiều cặp phải gửi.", reason: "ASR chép “Tự lập càng nhiều, gột sớm càng bớt nhiều cặp phải gửi.” (0.75): lệch âm/thanh thuần Việt: từ lặp/tự lập, gộp/gột — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ánh xạ phát mỗi từ kèm số 1, ba cặp cho mỗi dòng.", reason: "ASR chép “Ánh xả phát mũi từ kèm số 1, 3 cặp cho mũi dòng.” (0.769): lệch âm/thanh thuần Việt: xạ/xả, mỗi/mũi, mỗi/mũi — NOT_VERIFIED bằng tai người"}
  - {sentence: "Máy a nhận danh sách 1, 1, 1, hoặc 2 và 1 nếu đã gộp sớm.", reason: "ASR chép “Mấy ai nhận danh sách 1, 1, 1, hoặc 2 và 1 nếu đã gột sớm?” (0.812): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: máy (trong “máy a” → “mấy ai”), gộp/gột — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bây giờ đến lượt bạn tự làm với hai dòng, x y x và y y z.", reason: "ASR chép “x, y, x và y, z”: chữ y thứ hai của dòng “y y z” bị gộp khi hai tên chữ cái “i” liền nhau; hai dòng dữ liệu hiện trên màn hình — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đếm từ khi dữ liệu vượt xa một máy"
    steps:
      - show: |
          <p>Đếm số lần mỗi từ xuất hiện trong toàn bộ trang web đã thu thập — nhiều hơn mọi ổ đĩa của một máy. Cần hàng nghìn máy, và máy nào cũng có thể hỏng giữa chừng.</p>
          <div class="box key">Hôm nay: mô hình <b>MapReduce</b> (2004) — người viết chỉ viết hai hàm nhỏ, hệ thống lo chia việc, gửi dữ liệu, và chạy lại khi hỏng.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, hãy đếm số lần mỗi từ xuất hiện trong toàn bộ các trang mạng đã thu thập, nhiều hơn mọi ổ đĩa của một máy. Ta cần hàng nghìn máy, và máy nào cũng có thể hỏng giữa chừng. Hôm nay ta học mô hình ánh xạ rồi rút gọn, công bố năm 2004, người viết chỉ viết hai hàm nhỏ, còn hệ thống lo chia việc, gửi dữ liệu, và chạy lại khi hỏng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: đếm bằng bảng, chọn máy bằng băm, cộng theo nhóm"
    checks:
      - "__import__('collections').Counter('a b a'.split()) == {'a': 2, 'b': 1} and 7 % 3 == 1"
      - "(1 + 1) + 1 == 1 + (1 + 1) == 3 and (2 + 1) == 3"
    steps:
      - show: |
          <p><b>Đếm từ trên một máy</b>: đi qua từng từ, tăng ô của từ đó trong một bảng đếm.</p>
          <table class="t"><tr><th>đọc</th><th>bảng đếm sau bước đó</th></tr>
          <tr><td>a</td><td>a: 1</td></tr><tr><td>b</td><td>a: 1, b: 1</td></tr><tr><td>a</td><td>a: <b>2</b>, b: 1</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Trước hết, nhớ lại cách đếm từ trên một máy. Ta đi qua từng từ, và tăng ô của từ đó trong một bảng đếm. Đọc dòng a b a, chữ a đầu tiên cho a bằng 1, rồi chữ b cho b bằng 1, rồi chữ a thứ hai tăng a lên 2. Khi dữ liệu quá lớn cho một máy, ta phải chia việc đếm này ra nhiều máy."
      - clear: true
        show: |
          <p><b>Chọn máy bằng băm</b>: máy = băm(khoá) mod số máy. Cùng khoá luôn ra cùng số, nên luôn về cùng máy.</p>
          <table class="t"><tr><th>khoá</th><th>băm (giả sử)</th><th>3 máy nhận</th></tr>
          <tr><td>a</td><td>7</td><td>7 mod 3 = 1 → máy 1, <b>mọi</b> dữ liệu có khoá a</td></tr></table>
        focus: [1, 1, "2.2"]
        say: "Ở bài 6, ta đã chia khoá cho các máy bằng số dư của giá trị băm, máy bằng băm của khoá chia lấy dư cho số máy. Cùng một khoá luôn ra cùng một số, nên luôn về cùng một máy. Giả sử khoá a băm ra 7 và có 3 máy nhận, thì 7 chia 3 dư 1, mọi dữ liệu có khoá a, dù sinh ra ở máy nào, đều về máy 1."
      - show: |
          <p><b>Cộng theo nhóm nào cũng được</b>: đổi cách nhóm, đổi thứ tự, tổng không đổi.</p>
          $$(1 + 1) + 1 = 2 + 1 = 3 = 1 + (1 + 1)$$
        focus: [1, 2, 0]
        say: "Điều thứ ba, phép cộng cho phép nhóm tuỳ ý. Một cộng 1 trước rồi cộng 1, được 2 cộng 1 bằng 3, giống hệt cộng hai số sau trước. Chính tính chất này cho phép mỗi máy cộng một phần trước, rồi gửi kết quả nhỏ đi."

  - id: sym
    kind: symbol
    title: "Giải mã: ba bước"
    steps:
      - show: |
          <ol><li><b>map</b> (ánh xạ): mỗi máy đọc một phần dữ liệu, phát ra các cặp (khoá, giá trị). Đếm từ: mỗi từ phát <code>(từ, 1)</code>.</li>
          <li><b>xáo trộn</b>: hệ thống gom mọi cặp cùng khoá về <b>cùng một máy</b> (máy = băm(khoá) mod số máy rút gọn) — đi qua mạng.</li>
          <li><b>reduce</b> (rút gọn): với mỗi khoá, gộp danh sách giá trị. Đếm từ: cộng các số 1.</li></ol>
        focus: [1, "1.1", "1.2", "1.3"]
        say: "Có ba bước. Bước ánh xạ, mỗi máy đọc một phần dữ liệu và phát ra các cặp khoá và giá trị, với bài đếm từ thì mỗi từ phát ra cặp từ đó và số 1. Bước xáo trộn, hệ thống gom mọi cặp cùng khoá về cùng một máy, chọn máy bằng giá trị băm của khoá, dữ liệu đi qua mạng. Bước rút gọn, với mỗi khoá thì gộp danh sách giá trị, với bài đếm từ là cộng các số 1."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Dữ liệu đi đâu: từ dòng chữ tới kết quả"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><g font-size="23" fill="#1f2937"><text x="160" y="38" text-anchor="middle" font-weight="bold">ánh xạ</text><rect x="40" y="60" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="160" y="98" text-anchor="middle">dòng đầu</text><text x="160" y="130" text-anchor="middle" font-weight="bold">a b a</text><rect x="40" y="230" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="160" y="268" text-anchor="middle">dòng sau</text><text x="160" y="300" text-anchor="middle" font-weight="bold">c b a</text><line x1="280" y1="105" x2="340" y2="105" stroke="#1f2937" stroke-width="3"/><line x1="280" y1="275" x2="340" y2="275" stroke="#1f2937" stroke-width="3"/><text x="350" y="113">(a,1) (b,1) (a,1)</text><text x="350" y="283">(c,1) (b,1) (a,1)</text><rect x="760" y="20" width="300" height="330" rx="10" fill="#fff7ed" stroke="#eb6834" stroke-width="2" stroke-dasharray="8 6"/><text x="910" y="50" text-anchor="middle" fill="#eb6834" font-weight="bold">xáo trộn qua mạng</text><line x1="580" y1="122" x2="1100" y2="85" stroke="#2a78d6" stroke-width="3"/><line x1="580" y1="122" x2="1100" y2="205" stroke="#d97706" stroke-width="3"/><line x1="580" y1="292" x2="1100" y2="85" stroke="#2a78d6" stroke-width="3"/><line x1="580" y1="292" x2="1100" y2="205" stroke="#d97706" stroke-width="3"/><line x1="580" y1="292" x2="1100" y2="315" stroke="#059669" stroke-width="3"/><rect x="1100" y="50" width="210" height="70" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="1205" y="94" text-anchor="middle">rút gọn a</text><text x="1330" y="94" font-weight="bold" fill="#059669">a 3</text><rect x="1100" y="170" width="210" height="70" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="1205" y="214" text-anchor="middle">rút gọn b</text><text x="1330" y="214" font-weight="bold" fill="#059669">b 2</text><rect x="1100" y="280" width="210" height="70" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="1205" y="324" text-anchor="middle">rút gọn c</text><text x="1330" y="324" font-weight="bold" fill="#059669">c 1</text><text x="750" y="400" text-anchor="middle" fill="#b91c1c">mọi cặp cùng khoá về cùng một máy rút gọn: 6 cặp đi qua mạng</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ đường đi của dữ liệu. Bên trái, mỗi dòng chữ là một tác vụ ánh xạ, phát ra các cặp từ và số 1. Ở giữa là vùng xáo trộn, mọi cặp có khoá a, dù sinh ra ở dòng nào, đều chạy về máy rút gọn a, tương tự cho b và c. Bên phải, mỗi máy rút gọn cộng các số 1 của mình, được a 3, b 2, c 1, và tổng cộng có 6 cặp phải đi qua mạng."

  - id: example
    kind: example
    title: "Đếm từ trên hai dòng"
    checks:
      - "alg.word_count(['a b a', 'c b a']) == ({'a': 3, 'b': 2, 'c': 1}, 6)"
      - "alg.word_count(['a b a', 'c b a'], combine=True) == ({'a': 3, 'b': 2, 'c': 1}, 5)"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>dòng “a b a”</th><th>dòng “c b a”</th></tr>
          <tr><td>ánh xạ</td><td>(a,1) (b,1) (a,1)</td><td>(c,1) (b,1) (a,1)</td></tr></table>
          <p><b>Bước 1</b> — hai tác vụ ánh xạ phát $3 + 3 = 6$ cặp.</p>
        focus: [1, "1.2", 2]
        say: "Bước một, hai dòng a b a và c b a, mỗi dòng là một tác vụ ánh xạ. Mỗi từ được phát ra kèm số 1, dòng đầu ba cặp, dòng sau ba cặp. Tổng cộng 3 cộng 3 bằng 6 cặp."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>dòng “a b a”</th><th>dòng “c b a”</th></tr>
          <tr><td>ánh xạ</td><td>(a,1) (b,1) (a,1)</td><td>(c,1) (b,1) (a,1)</td></tr>
          <tr><td>gộp sớm (tuỳ chọn)</td><td>(a,2) (b,1)</td><td>(c,1) (b,1) (a,1)</td></tr></table>
          <p><b>Bước 2</b> — gộp sớm: còn $2 + 3 = 5$ cặp.</p>
        focus: [0, "1.3", "1.3", 2]
        say: "Bước hai là tuỳ chọn, gọi là gộp sớm. Dòng đầu có hai chữ a, nên cộng cục bộ thành a 2 và b 1. Dòng sau không có từ lặp, nên giữ nguyên ba cặp. Còn 2 cộng 3 bằng 5 cặp."
      - clear: true
        show: |
          <table class="t"><tr><th>máy rút gọn</th><th>nhận (không gộp sớm)</th><th>nhận (gộp sớm)</th></tr>
          <tr><td>a</td><td>[1, 1, 1]</td><td>[2, 1]</td></tr>
          <tr><td>b</td><td>[1, 1]</td><td>[1, 1]</td></tr>
          <tr><td>c</td><td>[1]</td><td>[1]</td></tr></table>
          <p><b>Bước 3</b> — xáo trộn gom mọi giá trị cùng khoá về một máy.</p>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bước ba, xáo trộn gom mọi giá trị cùng khoá về một máy. Máy a nhận danh sách 1, 1, 1, hoặc 2 và 1 nếu đã gộp sớm. Máy b nhận 1 và 1. Máy c nhận một số 1."
      - clear: true
        show: |
          <table class="t"><tr><th>máy rút gọn</th><th>cộng</th><th>kết quả</th></tr>
          <tr><td>a</td><td>$1 + 1 + 1 = 2 + 1$</td><td>3</td></tr>
          <tr><td>b</td><td>$1 + 1$</td><td>2</td></tr>
          <tr><td>c</td><td>1</td><td>1</td></tr></table>
          <p><b>Bước 4</b> — rút gọn: $\hl{a\ 3,\ b\ 2,\ c\ 1}$, có gộp sớm hay không cũng vậy.</p>
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Bước bốn, rút gọn cộng lại từng danh sách. Máy a cộng 1 cộng 1 cộng 1, hay 2 cộng 1, đều bằng 3. Máy b được 2, máy c được 1. Kết quả là a 3, b 2, c 1, có gộp sớm hay không cũng vậy, vì phép cộng cho phép nhóm tuỳ ý."
      - clear: true
        show: |
          <table class="t"><tr><th>hai dòng</th><th>cặp qua mạng, không gộp</th><th>gộp sớm</th></tr>
          <tr><td>“a b a”, “c b a”</td><td>6</td><td>5</td></tr>
          <tr><td>“a a a a a”, “a a a a b”</td><td>10</td><td>$\hl{3}$</td></tr></table>
          <p><b>Bước 5</b> — từ lặp càng nhiều, gộp sớm càng bớt nhiều cặp phải gửi.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Bước năm, đếm số cặp gửi qua mạng. Với hai dòng của ta, 6 cặp khi không gộp sớm, 5 cặp khi gộp sớm. Với hai dòng toàn chữ a, chỉ có một chữ b, mười cặp chỉ còn 3 cặp, vì mỗi dòng gửi một cặp cho mỗi từ khác nhau. Từ lặp càng nhiều, gộp sớm càng bớt nhiều cặp phải gửi."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "[i + 1 for i, w in enumerate('a b a c b a'.split()) if w == 'a'] == [1, 3, 6] and 'a b a c b a'.split().count('b') == 2 and len('a b a c b a'.split()) == 3 + 2 + 1 == 6"
      - "len(set('a b a'.split())) + len(set('c b a'.split())) == 2 + 3 == 5 and sum([2, 1]) == sum([1, 1, 1]) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>a 3, b 2, c 1</td><td>nối hai dòng thành “a b a c b a”, đếm tay: a ở vị trí 1, 3, 6; b ở 2, 5; c ở 4</td><td>3, 2, 1 ✓</td></tr>
          <tr><td>6 cặp không gộp</td><td>mỗi từ một cặp: số từ $= 3 + 2 + 1$</td><td>6 ✓</td></tr>
          <tr><td>5 cặp gộp sớm</td><td>mỗi dòng một cặp cho mỗi từ khác nhau: $2 + 3$</td><td>5 ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, không qua ba bước. Nối hai dòng thành một chuỗi rồi đếm tay, chữ a ở vị trí 1, 3, 6, chữ b ở vị trí 2 và 5, chữ c ở vị trí 4, được 3, 2, 1, khớp. Không gộp sớm thì mỗi từ thành một cặp, nên số cặp bằng số từ, 3 cộng 2 cộng 1 bằng 6. Gộp sớm thì mỗi dòng gửi một cặp cho mỗi từ khác nhau, dòng đầu có 2 từ khác nhau, dòng sau có 3, tổng 5, khớp."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "(1 + 2 + 3 + 4) / 4 == 2.5 and ((1 + 2 + 3) / 3 + 4) / 2 == 3.0"
      - "alg.word_count(['a a a a a', 'a a a a b']) == ({'a': 9, 'b': 1}, 10) and alg.word_count(['a a a a a', 'a a a a b'], combine=True)[1] == 3"
      - "alg.word_count(['u1 u2 u3', 'u4 u5 u6'])[1] == alg.word_count(['u1 u2 u3', 'u4 u5 u6'], combine=True)[1] == 6"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Gộp sớm một phép không kết hợp được <b class="red">(sai kết quả)</b>
          <br><span class="note">Trung bình của [1, 2, 3, 4] là 2,5. Gộp sớm thành trung bình từng phần — 2 (của 1, 2, 3) và 4 — rồi lấy trung bình: 3. Gộp sớm phải gửi (tổng, số lượng), không gửi trung bình.</span></div>
        say: "Lỗi thứ nhất, gộp sớm một phép không kết hợp được. Trung bình của 1, 2, 3, 4 là 2 phẩy 5. Nếu gộp sớm thành trung bình từng phần, 2 cho nhóm 1, 2, 3 và 4 cho nhóm còn lại, rồi lấy trung bình thì được 3, sai. Gộp sớm phải gửi tổng và số lượng, không gửi trung bình."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Gửi toàn bộ dữ liệu qua bước xáo trộn <b class="red">(chậm)</b>
          <br><span class="note">Mạng thường là phần đắt nhất. Lọc bớt dòng, bỏ cột không cần, và gộp sớm ngay ở bước ánh xạ.</span></div>
        say: "Lỗi thứ hai, gửi toàn bộ dữ liệu qua bước xáo trộn. Mạng thường là phần đắt nhất, nên hãy lọc bớt dòng, bỏ cột không cần, và gộp sớm ngay ở bước ánh xạ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Hàm ánh xạ có tác dụng phụ <b class="red">(sai khi chạy lại)</b>
          <br><span class="note">Máy hỏng thì hệ thống chạy lại tác vụ ở máy khác. Hàm ghi ra ngoài (gửi thư, cộng tiền) sẽ làm việc đó hai lần. Hàm ánh xạ, rút gọn phải <b>thuần</b>: cùng đầu vào luôn cho cùng đầu ra, và không thay đổi gì bên ngoài. Đếm từ là hàm thuần: chạy lại bao nhiêu lần cũng ra cùng bảng đếm.</span></div>
        say: "Lỗi thứ ba, hàm ánh xạ có tác dụng phụ, tức làm thay đổi thứ gì đó bên ngoài hàm. Máy hỏng thì hệ thống chạy lại tác vụ ở máy khác, và một hàm ghi ra ngoài, như gửi thư hay cộng tiền, sẽ làm việc đó hai lần. Hàm ánh xạ và rút gọn phải là hàm thuần, tức cùng đầu vào luôn cho cùng đầu ra, và không thay đổi gì bên ngoài. Hàm đếm từ là hàm thuần, chạy lại bao nhiêu lần cũng ra cùng một bảng đếm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Bật gộp sớm cho mọi công việc mà không đo <b class="red">(tốn công, không bớt gì)</b></div>
          <table class="t"><tr><th>dữ liệu (2 dòng)</th><th>cặp không gộp</th><th>cặp gộp sớm</th></tr>
          <tr><td>từ lặp nhiều: “a a a a a”, “a a a a b”</td><td>10</td><td>3</td></tr>
          <tr><td>khoá không lặp: 6 mã người dùng khác nhau</td><td>6</td><td>$\hl{6}$</td></tr></table>
          <p class="note">Gộp sớm tốn bộ nhớ và thời gian ở máy ánh xạ. Đo tỉ lệ cặp trước và sau trên một phần nhỏ dữ liệu rồi mới quyết.</p>
        focus: [1, "2.2", "2.3", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, bật gộp sớm cho mọi công việc mà không đo. Với dữ liệu có từ lặp nhiều, mười cặp chỉ còn 3 cặp, rất đáng. Nhưng nếu khoá hầu như không lặp, ví dụ đếm theo mã người dùng, mỗi dòng gồm các mã khác nhau, thì 6 cặp vẫn là 6 cặp. Khi đó gộp sớm chỉ tốn thêm bộ nhớ và thời gian ở máy ánh xạ. Người có kinh nghiệm đo tỉ lệ cặp trước và sau trên một phần nhỏ dữ liệu, rồi mới quyết có bật hay không."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.word_count(['x y x', 'y y z']) == ({'x': 2, 'y': 3, 'z': 1}, 6) and alg.word_count(['x y x', 'y y z'], combine=True)[1] == 4"
    steps:
      - show: |
          <p>Hai dòng: “x y x” và “y y z”.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Kết quả đếm từ?</td></tr>
          <tr><td>2</td><td>Số cặp gửi qua mạng khi không gộp sớm và khi gộp sớm?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm với hai dòng, x y x và y y z. Câu một, kết quả đếm từ là gì? Câu hai, số cặp gửi qua mạng khi không gộp sớm và khi gộp sớm là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>làm</th></tr>
          <tr><td>ánh xạ</td><td>(x,1) (y,1) (x,1) | (y,1) (y,1) (z,1)</td></tr>
          <tr><td>xáo trộn</td><td>x nhận [1, 1]; y nhận [1, 1, 1]; z nhận [1]</td></tr>
          <tr><td>rút gọn</td><td>$\hl{x\ 2,\ y\ 3,\ z\ 1}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, làm từng bước. Ánh xạ phát mỗi từ kèm số 1, ba cặp cho mỗi dòng. Xáo trộn gom x về hai số 1, y về ba số 1, vì y có một lần ở dòng đầu và hai lần ở dòng sau, còn z về một số 1. Rút gọn cộng lại, được x 2, y 3, z 1."
      - show: |
          <table class="t"><tr><th>câu 2</th><th>dòng “x y x”</th><th>dòng “y y z”</th><th>tổng</th></tr>
          <tr><td>không gộp</td><td>3 cặp</td><td>3 cặp</td><td>6</td></tr>
          <tr><td>gộp sớm</td><td>(x,2) (y,1)</td><td>(y,2) (z,1)</td><td>$\hl{4}$</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Câu hai, không gộp sớm thì mỗi dòng gửi 3 cặp, tổng 6 cặp. Gộp sớm thì dòng đầu thành x 2 và y 1, dòng sau thành y 2 và z 1, mỗi dòng còn 2 cặp, tổng 4 cặp."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">ánh xạ: phát (khoá, giá trị)</span><span class="a">→</span>
          <span class="n">xáo trộn: gom theo khoá, qua mạng</span><span class="a">→</span>
          <span class="n">rút gọn: gộp mỗi khoá</span><span class="a">→</span>
          <span class="n">hàm thuần: chạy lại an toàn</span></div>
        say: "Tổng kết lại, ánh xạ phát ra các cặp khoá và giá trị, xáo trộn gom theo khoá qua mạng, rút gọn gộp từng khoá, và vì hàm là thuần nên chạy lại khi hỏng là an toàn."
      - show: |
          <div class="box key"><b>Tư duy:</b> tách “tính gì” (hai hàm nhỏ, thuần) khỏi “chạy ở đâu, hỏng thì sao” (hệ thống lo). Ràng buộc chặt sinh ra tự do lớn.</div>
        say: "Điều cần mang theo, hãy tách tính gì, là hai hàm nhỏ và thuần, khỏi chạy ở đâu và hỏng thì sao, là việc hệ thống lo. Một ràng buộc chặt sinh ra tự do lớn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): khi một tác vụ chậm kéo cả công việc — <b>lệch dữ liệu</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta xem khi một tác vụ chậm kéo cả công việc, gọi là lệch dữ liệu. Hẹn gặp bạn ở bài tiếp theo."
