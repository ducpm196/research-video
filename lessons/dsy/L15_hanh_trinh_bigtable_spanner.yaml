          <tr><td>2017</td><td>hơn 5000 cơ sở dữ liệu, hàng chục triệu truy vấn mỗi giây, hàng trăm petabyte; có bản thử nghiệm công khai trên đám mây</td><td>quy mô rất lớn</td></tr>
