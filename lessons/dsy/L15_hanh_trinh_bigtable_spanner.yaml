assumes: [arith]
# Quy ước: “mảnh” = một dải dòng liên tiếp theo khoá (tablet). “Độ bất định” = nửa bề rộng khoảng giờ mà đồng hồ trả về (ε của [SP12]).
#   Mọi sự kiện và con số có nguồn ghi trong audit/dsy/sources_L15.md; con số khác là phép tính lại (checks, audit/dsy/verify_dsy.py L15a–f)
#   hoặc ghi “(số minh hoạ)”: 20 khách hàng chia 4 → 5 mảnh, giờ thật 100 ms, máy nhanh 5 ms, cửa hàng 200 GB, 5 bản ở 2–3 thành phố.
#   Lời đọc không nói tên người, “MySQL”, “Megastore”, “Chubby”, “Paxos”, “F1”, “GPS”, “TrueTime”: nói “cơ sở dữ liệu quan hệ”, “một hệ
#   khác”, “dịch vụ khoá phân tán”, “nhóm đồng thuận đa số”, “hệ quảng cáo”, “vệ tinh định vị”, “đồng hồ trả về khoảng giờ”.
#   Google, Spanner đọc thô (8/8); Bigtable không đọc được (≤ 3/8) → lời đọc nói “hệ bảng lớn”, chữ Bigtable chỉ trên màn hình
#   (tools/registry/lexicon_vi.DSY.yaml, probe audit/dsy/probes/p2_hanh_trinh.md).
objectives:
  - "Kể lại hành trình lưu trữ dữ liệu của Google từ Bigtable tới Spanner qua năm chặng, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt của từng chặng: số mảnh địa chỉ được, phần khoá phải dời khi chia lại, thời gian chờ cam kết"
  - "Chọn thực hành phù hợp với quy mô của chính mình, không chép quy mô của hệ thống khác"
