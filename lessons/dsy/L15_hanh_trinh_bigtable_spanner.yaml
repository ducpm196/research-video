  # ───────────────────────── 10. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm ba con số của hành trình"
    checks:
      - "131072 * 131072 == 17179869184 == 16 * 1073741824 == 2 ** 34"
      - "sum(1 for k in range(20) if k % 4 == k % 5) == 4 and 1 - 4 / 20 == 0.8"
      - "(100 + 4) + 4 - 100 == 8 == 2 * 4"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>$2^{34}$ mảnh</td><td>$2^{34} = 16 \cdot 2^{30} = 16 \cdot 1\,073\,741\,824 = 17\,179\,869\,184$, khớp $131\,072 \cdot 131\,072$ ✓</td></tr>
          <tr><td>80% khoá phải dời</td><td>chỉ đứng yên khi hai số dư bằng nhau; trong 20 mã chỉ có 0, 1, 2, 3 → đứng yên $\frac{4}{20}$ = 20%, dời 80% ✓</td></tr>
          <tr><td>chờ 8 ms</td><td>dấu = giờ ghi + 4; sớm nhất = giờ thật − 4 phải quá dấu → giờ thật quá giờ ghi + 8 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Ta kiểm lại ba con số bằng đường khác. Vì 2 mũ 34 bằng 16 nhân 2 mũ 30, khoảng 16 nhân 1 phẩy 07 tỉ, nên được khoảng 17 phẩy 2 tỉ, khớp phép nhân lúc trước. Với 80 phần trăm, chỉ 4 mã từ 0 tới 3 có hai số dư bằng nhau, nên đứng yên 20 phần trăm và dời 80 phần trăm. Với 8 mi li giây, vì dấu là giờ ghi cộng 4 và giá trị sớm nhất là giờ thật trừ 4, nên phải chờ tới giờ ghi cộng 8."

  # ───────────────────────── 11. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
