          <tr><td><b class="red">2.</b> “Hệ của mình cũng cần đồng hồ nguyên tử”</td><td>Spanner thiết kế cho hàng triệu máy, hàng trăm trung tâm; nhóm Spanner dự đoán phần lớn ứng dụng khác chỉ cần 3–5 trung tâm một vùng</td><td>hỏi trước: có cần thứ tự giao dịch toàn cầu không?</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là cho rằng hệ bảng lớn sai vì thiếu giao dịch nhiều dòng. Thật ra năm 2006 phần lớn ứng dụng chỉ cần giao dịch một dòng, và tới năm 2012 nhu cầu mới rõ, khi người dùng phàn nàn liên tục vì thiếu giao dịch nhiều dòng. Bài học sai thứ hai là nghĩ hệ của mình cũng cần đồng hồ nguyên tử, trong khi Spanner thiết kế cho hàng triệu máy, nên hãy hỏi trước mình có cần thứ tự toàn cầu không."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Cứ chia mảnh bằng tay, khi nào cần thì chia lại”</td><td>lần chia lại cuối của hệ quảng cáo mất hơn 2 năm, hàng chục đội; chia theo số dư dời 80% khách</td><td>chọn khoá chia sớm, giấu việc chia khỏi mã nghiệp vụ, hoặc dùng hệ tự chia lại</td></tr>
          <tr><td><b class="red">4.</b> “Đồng hồ máy chủ đã đồng bộ, lấy giờ máy làm thứ tự”</td><td>nhóm Bigtable đã gặp đồng hồ lệch lớn. Minh hoạ: máy A nhanh 5 ms ghi lúc 100 → dấu 105; máy B ghi sau, lúc 102 → dấu 102: bản ghi sau trông như trước</td><td>coi giờ là một khoảng; cần thứ tự thì dùng đồng hồ đếm sự kiện, hoặc chờ hết độ bất định</td></tr></table>
        focus: ["1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba là cứ chia mảnh bằng tay, khi nào cần thì chia lại, trong khi lần chia lại cuối của hệ quảng cáo mất hơn hai năm. Bài học sai thứ tư là tin đồng hồ máy chủ đã đồng bộ, rồi lấy giờ máy làm thứ tự. Ví dụ minh hoạ, máy A nhanh 5 mi li giây ghi lúc 100 nên có dấu 105, còn máy B ghi sau, lúc 102, có dấu 102, nên bản ghi sau lại trông như trước. Hãy coi giờ là một khoảng, và khi cần thứ tự thì dùng đồng hồ đếm sự kiện hoặc chờ hết độ bất định."

  # ───────────────────────── 12. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "[200 * 1.5 ** n for n in range(5)] == [200, 300, 450, 675, 1012.5] and 200 * 1.5 ** 3 < 1000 < 200 * 1.5 ** 4"
      - "5 - 3 < 3 and 5 - 2 >= 3 and min(5 - c for c in (2, 2, 1)) >= 3"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ)</th></tr>
          <tr><td>1</td><td>Cửa hàng trực tuyến: một máy chủ cơ sở dữ liệu quan hệ, 200 GB, mỗi năm tăng gấp 1,5; máy chứa thoải mái 1 TB. Chia mảnh ngay hay chưa?</td></tr>
          <tr><td>2</td><td>Bạn có 5 bản sao: đặt ở hai thành phố (3 + 2) hay ba thành phố (2 + 2 + 1)?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với các số minh hoạ. Câu một, cửa hàng trực tuyến có một máy chủ chứa 200 ghi-ga-byte, mỗi năm tăng gấp 1 phẩy 5, máy chứa thoải mái 1 TB, vậy có nên chia mảnh ngay không? Câu hai, bạn có 5 bản sao, nên đặt ở hai thành phố theo kiểu 3 cộng 2, hay ở ba thành phố theo kiểu 2 cộng 2 cộng 1? Dừng video và viết câu trả lời ra giấy."
        pause: 20
      - clear: true
        show: |
          <p>Câu 1, bước 1: $200 \to 300 \to 450 \to 675 \to \hl{1012{,}5}$ GB — năm thứ 4 mới vượt 1 TB.</p>
          <table class="t"><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>chưa chia, giữ một máy</td><td>giao dịch, truy vấn trên toàn bộ dữ liệu, vận hành đơn giản</td><td>phải tính trước lúc chuyển</td></tr>
          <tr><td>chia mảnh bằng tay ngay</td><td>chịu tải lâu hơn</td><td>mã ứng dụng phải biết mảnh; chia lại sau có thể dời tới 80% khách</td></tr></table>
          <p class="note">Chọn: chưa chia, nhưng chọn sẵn khoá chia (mã khách hàng) và giấu nó sau một lớp truy cập. Đổi lựa chọn khi dữ liệu tăng nhanh hơn, hay cần phục vụ nhiều vùng.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Đáp án câu một, bước một là tính dung lượng, 200 nhân 1 phẩy 5 được 300, rồi 450, rồi 675, và năm thứ tư là 1012 phẩy 5 ghi-ga-byte, mới vượt 1 TB. Giữ một máy thì còn giao dịch, truy vấn trên toàn bộ dữ liệu và vận hành đơn giản. Chia mảnh bằng tay ngay thì mã ứng dụng phải biết mảnh, và lần chia lại sau có thể dời tới 80 phần trăm khách hàng. Nên chưa chia, nhưng chọn sẵn khoá chia là mã khách hàng và giấu nó sau một lớp truy cập, rồi đổi khi dữ liệu tăng nhanh hơn hay cần nhiều vùng."
      - clear: true
        show: |
          <table class="t"><tr><th>cách đặt 5 bản</th><th>mất cả một thành phố</th><th>còn lại</th><th>ghi được? (cần đa số 3)</th></tr>
          <tr><td>3 + 2</td><td>thành phố có 3 bản / có 2 bản</td><td>2 / 3</td><td><b class="red">không</b> / được</td></tr>
          <tr><td>2 + 2 + 1</td><td>bất kỳ thành phố nào</td><td>ít nhất 3</td><td>được</td></tr></table>
          <p class="note">Đổi lại, 2 + 2 + 1 thì mỗi lần ghi phải chờ xác nhận từ thành phố khác; 3 + 2 có thể đủ đa số ngay trong một thành phố. Chọn 3 thành phố khi mất cả một thành phố là rủi ro thật; chọn 3 + 2 khi độ trễ ghi quan trọng hơn.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Đáp án câu hai dùng quy tắc đa số của bài 5, 5 bản cần 3 bản đồng ý mới ghi được. Với kiểu 3 cộng 2, mất thành phố có 3 bản thì chỉ còn 2 nên không ghi được. Với kiểu 2 cộng 2 cộng 1, mất bất kỳ thành phố nào cũng còn ít nhất 3 bản. Đổi lại, mỗi lần ghi phải chờ thành phố khác xác nhận, còn kiểu 3 cộng 2 có thể đủ đa số ngay trong một thành phố. Hãy chọn ba thành phố khi mất cả một thành phố là rủi ro thật, và chọn 3 cộng 2 khi độ trễ ghi quan trọng hơn."

