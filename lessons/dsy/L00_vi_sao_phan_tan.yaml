source: "curriculum/dsy.yaml L00; audit/dsy/verify_dsy.py L00; P. Deutsch, J. Gosling, Fallacies of Distributed Computing (1994–1997); J. Dean, Numbers Everyone Should Know (2009); G. Amdahl (1967); CSA bài 13; NET bài 1"
assumes: [arith, frac, approx, power, cdot]
# Quy ước: độ trễ khứ hồi điển hình (Dean 2009): trong cùng trung tâm dữ liệu ≈ 0,5 ms, xuyên lục địa ≈ 150 ms — số ĐIỂN HÌNH, đổi theo
#   phần cứng; tính toán chỉ dùng chúng để so cấp độ. Amdahl: tăng tốc = 1 / ((1 − p) + p/N) như CSA bài 13. Xác suất hỏng độc lập giữa các máy.
objectives:
  - "Biết lý do phải dùng nhiều máy"
  - "Biết cái giá: độ trễ, hỏng một phần, phần tuần tự"
  - "Nhận ra tám giả định sai về mạng"
asr_reviewed:
  - {sentence: "Tăng tốc là thời gian cũ chia thời gian mới, tức 1 chia cho tổng đó, và công thức này gọi là định luật Amdahl.", reason: "ASR chép “Tăng tốc là thời gian cũ chia thời gian mới, tức mục chia cho tổng đó và công thức này gọi là định luật am đang.” (0.923): “amdahl” đọc theo luật lexicon (lexicon_vi.DSY.yaml: “Am-đan”), ASR viết “đang”; lệch âm/thanh thuần Việt: một/mục — NOT_VERIFIED bằng tai người"}
  - {sentence: "Phần tuần tự giới hạn tăng tốc theo định luật Amdahl, và thêm máy còn thêm chi phí phối hợp.", reason: "ASR chép “theo định luật am đang”: Amdahl đọc “Am-đan” theo lexicon (probe CSA p1 8/8), đan/đang lệch âm cuối; phần còn lại chép đúng (0,952) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một máy không đủ — nhiều máy lại sinh chuyện"
    checks:
      - "round(1 - 0.999 ** 100, 3) == 0.095"
    steps:
      - show: |
          <p>Dữ liệu vượt ổ đĩa một máy, người dùng ở khắp thế giới, máy nào cũng có ngày hỏng: ta phải dùng <b>nhiều máy</b>.</p>
          <p>Nhưng 100 máy, mỗi máy hỏng 0,1% số ngày: xác suất có ít nhất một máy hỏng trong một ngày là $1 - 0{,}999^{100} \approx \hl{9{,}5\%}$. Hỏng <b>một phần</b> trở thành chuyện thường.</p>
          <div class="box key">Hôm nay: vì sao phân tán, cái giá của nó, và <b>tám giả định sai</b> về mạng mà người mới hay mắc.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, dữ liệu vượt ổ đĩa của một máy, người dùng ở khắp thế giới, và máy nào cũng có ngày hỏng, nên ta phải dùng nhiều máy. Nhưng với 100 máy, mỗi máy hỏng 0 phẩy 1 phần trăm số ngày, xác suất có ít nhất một máy hỏng trong một ngày là khoảng 9 phẩy 5 phần trăm. Vì vậy hỏng một phần trở thành chuyện xảy ra hằng ngày. Hôm nay ta học vì sao phải phân tán, cái giá của nó, và tám giả định sai về mạng mà người mới hay mắc."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: xác suất độc lập, mi li giây, công thức tăng tốc"
    checks:
      - "round(0.999 * 0.999, 6) == 0.998001 and round(1 - 0.998001, 6) == 0.001999"
      - "15000 / 1000 == 15 and round(1 / (0.5 + 0.5 / 2), 2) == 1.33 and 0.5 + 0.5 / 2 == 0.75"
    steps:
      - show: |
          <p><b>Hai sự kiện độc lập</b>: xác suất cả hai cùng xảy ra bằng tích hai xác suất. “Ít nhất một” = 1 trừ “không cái nào”.</p>
          <table class="t"><tr><th>hai máy, mỗi máy sống 99,9% số ngày</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>cả hai cùng sống</td><td>$0{,}999 \cdot 0{,}999$</td><td>0,998001</td></tr>
          <tr><td>có ít nhất một máy hỏng</td><td>$1 - 0{,}998001$</td><td>0,001999 ≈ 0,2%</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Trước hết, ta cần hiểu ba điều. Thứ nhất, với hai sự kiện độc lập, xác suất cả hai cùng xảy ra bằng tích hai xác suất. Hai máy, mỗi máy sống 99 phẩy 9 phần trăm số ngày, thì cả hai cùng sống với xác suất 0 phẩy 999 nhân 0 phẩy 999, bằng 0 phẩy 998001. Xác suất có ít nhất một máy hỏng là 1 trừ đi số đó, bằng 0 phẩy 001999, khoảng 0 phẩy 2 phần trăm. Với n máy, ta thay tích hai số bằng 0 phẩy 999 mũ n."
      - show: |
          <table class="t"><tr><th>nền</th><th>ví dụ</th></tr>
          <tr><td>1 giây = 1000 mi li giây (ms)</td><td>15 000 ms = 15 giây</td></tr>
          <tr><td>tăng tốc khi dùng $N$ máy, phần song song được là $p$ (<b>định luật Amdahl</b>): thời gian một máy $= (1 - p) + p = 1$; $N$ máy: $(1 - p) + p / N$; tăng tốc $= \dfrac{\text{cũ}}{\text{mới}} = \dfrac{1}{(1 - p) + p / N}$</td><td>$p = 0{,}5$, $N = 2$: $\dfrac{1}{0{,}5 + 0{,}25} = \dfrac{1}{0{,}75} \approx 1{,}33$ lần</td></tr></table>
        focus: ["1.2", "1.3", "1.3", "1.3", "1.3", "1.3", "1.3"]
        say: "Thứ hai, một giây bằng 1000 mi li giây, nên 15 nghìn mi li giây là 15 giây. Thứ ba là công thức tăng tốc, với p là phần công việc chạy song song được và N là số máy. Coi thời gian chạy trên một máy là 1, gồm phần tuần tự 1 trừ p mà chỉ một máy làm được, cộng phần song song p. Dùng N máy thì phần song song chia đều còn p chia N, phần tuần tự giữ nguyên, nên thời gian mới là 1 trừ p, cộng p chia N. Tăng tốc là thời gian cũ chia thời gian mới, tức 1 chia cho tổng đó, và công thức này gọi là định luật Amdahl. Ví dụ một nửa công việc song song được và dùng 2 máy, thời gian mới là 0 phẩy 5 cộng 0 phẩy 25, bằng 0 phẩy 75. Vậy tăng tốc chỉ khoảng 1 phẩy 33 lần, chứ không phải 2 lần."

  - id: sym
    kind: symbol
    title: "Giải mã: ba lý do, ba cái giá"
    steps:
      - show: |
          <table class="t"><tr><th>lý do dùng nhiều máy</th><th>cái giá</th></tr>
          <tr><td><b>quy mô</b>: dữ liệu, lượng truy cập vượt một máy</td><td><b>độ trễ</b>: gọi qua mạng chậm hơn gọi hàm hàng trăm nghìn lần</td></tr>
          <tr><td><b>chịu lỗi</b>: một máy hỏng, máy khác làm thay</td><td><b>hỏng một phần</b>: vài máy hỏng, số còn lại không biết chắc</td></tr>
          <tr><td><b>gần người dùng</b>: đặt máy ở nhiều châu lục</td><td><b>không có đồng hồ chung</b>, không có bộ nhớ chung</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Có ba lý do để dùng nhiều máy, đi kèm ba cái giá. Lý do quy mô, dữ liệu và lượng truy cập vượt một máy, đổi lại là độ trễ, gọi qua mạng chậm hơn gọi hàm hàng trăm nghìn lần. Lý do chịu lỗi, một máy hỏng thì máy khác làm thay, đổi lại là hỏng một phần, vài máy hỏng mà số còn lại không biết chắc. Lý do gần người dùng, đặt máy ở nhiều châu lục, đổi lại là không có đồng hồ chung, cũng không có bộ nhớ chung."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Gọi qua mạng: ba chuyện có thể xảy ra"
    steps:
      - show: |
          <div><svg width="1500" height="520" viewBox="0 0 1500 520"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker></defs><g font-size="23" fill="#1f2937"><text x="200" y="40" text-anchor="middle" font-weight="bold">người gọi</text><text x="870" y="40" text-anchor="middle" font-weight="bold">máy chủ</text><line x1="200" y1="55" x2="200" y2="450" stroke="#6b7280" stroke-width="3"/><line x1="870" y1="55" x2="870" y2="365" stroke="#6b7280" stroke-width="3"/><line x1="210" y1="80" x2="870" y2="115" stroke="#2a78d6" stroke-width="4" marker-end="url(#ah)"/><line x1="870" y1="135" x2="210" y2="170" stroke="#059669" stroke-width="4" marker-end="url(#ah)"/><text x="960" y="125" fill="#059669">1. trả lời tới: biết kết quả</text><line x1="210" y1="205" x2="520" y2="221" stroke="#2a78d6" stroke-width="4"/><line x1="527" y1="204" x2="563" y2="240" stroke="#b91c1c" stroke-width="5"/><line x1="527" y1="240" x2="563" y2="204" stroke="#b91c1c" stroke-width="5"/><text x="960" y="250">2. yêu cầu mất: máy chủ chưa làm gì</text><line x1="210" y1="330" x2="870" y2="365" stroke="#2a78d6" stroke-width="4" marker-end="url(#ah)"/><rect x="830" y="370" width="80" height="34" rx="6" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="870" y="394" text-anchor="middle" font-size="19">đã chạy</text><line x1="830" y1="410" x2="560" y2="425" stroke="#059669" stroke-width="4" stroke-dasharray="10 7"/><line x1="517" y1="408" x2="553" y2="444" stroke="#b91c1c" stroke-width="5"/><line x1="517" y1="444" x2="553" y2="408" stroke="#b91c1c" stroke-width="5"/><text x="960" y="375">3. đã chạy xong, trả lời bị mất</text><text x="750" y="500" text-anchor="middle" fill="#b91c1c" font-weight="bold">hàng 2 và hàng 3: người gọi chỉ thấy “hết giờ chờ, chưa có trả lời”</text></g></svg></div>
        focus: [1, 1, 1, 1, 1, 1]
        say: "Hình vẽ ba chuyện có thể xảy ra khi người gọi gửi một yêu cầu qua mạng tới máy chủ. Hàng thứ nhất, yêu cầu tới nơi, máy chủ trả lời, và người gọi biết kết quả. Hàng thứ hai, yêu cầu mất giữa đường, máy chủ chưa làm gì cả. Hàng thứ ba, máy chủ đã chạy xong, nhưng câu trả lời bị mất trên đường về. Ở hàng hai và hàng ba, người gọi chỉ thấy một điều, hết giờ chờ mà chưa có trả lời. Nó không biết việc đã được làm hay chưa, và đó chính là hỏng một phần."

  - id: example
    kind: example
    title: "Cấp độ độ trễ và giới hạn của thêm máy"
    checks:
      - "100 * 0.5 == 50 and 100 * 150 / 1000 == 15 and 150 / 0.5 == 300"
      - "round(1 / (0.1 + 0.9 / 10), 2) == 5.26 and round(1 / 0.1) == 10"
    steps:
      - show: |
          <p><b>Bước 1</b> — 100 lời gọi nối tiếp, <b>trong cùng trung tâm dữ liệu</b> (khứ hồi ≈ 0,5 ms):</p>
          $$100 \cdot 0{,}5 \text{ ms} = 50 \text{ ms}$$
        focus: [1, 2]
        say: "Bước một, một lời gọi khứ hồi trong cùng trung tâm dữ liệu mất khoảng nửa mi li giây. Gọi 100 lần nối tiếp, mỗi lần chờ lần trước xong, mất 100 nhân 0 phẩy 5, bằng 50 mi li giây."
      - show: |
          <p><b>Bước 2</b> — cùng 100 lời gọi, nhưng <b>xuyên lục địa</b> (khứ hồi ≈ 150 ms):</p>
          $$100 \cdot 150 \text{ ms} = 15\,000 \text{ ms} = \hl{15} \text{ giây}$$
        focus: [1, 2]
        say: "Bước hai, một lời gọi khứ hồi xuyên lục địa mất khoảng 150 mi li giây. Cùng 100 lời gọi nối tiếp mất 15 nghìn mi li giây, tức là 15 giây, chậm gấp 300 lần, chỉ vì khoảng cách."
      - clear: true
        show: |
          <p><b>Bước 3</b> — 90% công việc song song được, 10 máy: thay $p = 0{,}9$, $N = 10$:</p>
          $$\frac{1}{0{,}1 + \frac{0{,}9}{10}} = \frac{1}{0{,}1 + 0{,}09} = \frac{1}{0{,}19} \approx \hl{5{,}26} \text{ lần}$$
        focus: [1, 2, 2]
        say: "Bước ba, giả sử 90 phần trăm công việc song song được và dùng 10 máy. Phần tuần tự là 0 phẩy 1, phần song song chia đều là 0 phẩy 9 chia 10, bằng 0 phẩy 09, cộng lại được 0 phẩy 19. Một chia 0 phẩy 19 cho tăng tốc chỉ khoảng 5 phẩy 26 lần, dù dùng tới 10 máy."
      - show: |
          <p><b>Bước 4</b> — thêm máy mãi, phần $\frac{0{,}9}{N}$ tiến về 0, chỉ còn phần tuần tự:</p>
          $$\frac{1}{0{,}1} = 10 \text{ lần}$$
          <div class="box key">Có vô số máy cũng không quá 10 lần: phần tuần tự 10% vẫn còn đó.</div>
        focus: [1, 2, 3]
        say: "Bước bốn, nếu thêm máy mãi, phần 0 phẩy 9 chia N tiến về 0, chỉ còn lại phần tuần tự 0 phẩy 1. Một chia 0 phẩy 1 bằng 10. Có vô số máy cũng không vượt quá 10 lần, vì phần tuần tự 10 phần trăm vẫn còn đó."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "10 + 90 / 10 == 19 and round(100 / 19, 2) == 5.26"
      - "round(100 * 0.001, 3) == 0.1 and 0.09 < 1 - 0.999 ** 100 < 0.1"
      - "2 ** 3 == 8 and abs(sum(math.prod(0.999 if u else 0.001 for u in c) for c in __import__('itertools').product([1, 0], repeat=3) if not all(c)) - (1 - 0.999 ** 3)) < 1e-12 and round(1 - 0.999 ** 3, 3) == 0.003"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>tăng tốc 5,26 lần</td><td>đo bằng giây: việc 100 giây trên một máy = 10 giây tuần tự + 90 giây chia 10 máy = 10 + 9 = 19 giây; $\frac{100}{19}$</td><td>≈ 5,26 ✓</td></tr>
          <tr><td>9,5% ở mở đầu</td><td>ước lượng nhanh: $100 \cdot 0{,}1\% = 10\%$ — hơi dư, vì ngày có hai máy cùng hỏng bị đếm hai lần</td><td>9,5% &lt; 10% ✓</td></tr>
          <tr><td>công thức “1 trừ”</td><td>3 máy: liệt kê đủ $2^3 = 8$ trường hợp sống/hỏng, cộng xác suất 7 trường hợp có máy hỏng</td><td>≈ 0,003 = $1 - 0{,}999^3$ ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Bây giờ kiểm lại bằng những đường khác, không dùng lại công thức. Đo bằng giây, một việc mất 100 giây trên một máy gồm 10 giây tuần tự và 90 giây song song. Chia phần song song cho 10 máy còn 9 giây, tổng 19 giây, và 100 chia 19 khoảng 5 phẩy 26, khớp. Ước lượng nhanh con số mở đầu, 100 máy nhân 0 phẩy 1 phần trăm được 10 phần trăm. Con số này hơi dư so với 9 phẩy 5, vì những ngày có hai máy cùng hỏng bị đếm hai lần. Với 3 máy, liệt kê đủ 2 mũ 3 bằng 8 trường hợp sống hay hỏng. Cộng xác suất của 7 trường hợp có máy hỏng được khoảng 0 phẩy 003, đúng bằng 1 trừ 0 phẩy 999 mũ 3."

  # ───────────────────────── 4. TÁM GIẢ ĐỊNH ─────────────────────────
  - id: fallacies
    kind: concept
    title: "Tám giả định sai về mạng"
    steps:
      - show: |
          <table class="t"><tr><th>#</th><th>giả định sai</th><th>#</th><th>giả định sai</th></tr>
          <tr><td>1</td><td>Mạng luôn tin cậy.</td><td>5</td><td>Cấu trúc mạng không đổi.</td></tr>
          <tr><td>2</td><td>Độ trễ bằng 0.</td><td>6</td><td>Chỉ có một người quản trị.</td></tr>
          <tr><td>3</td><td>Băng thông vô hạn.</td><td>7</td><td>Chi phí truyền bằng 0.</td></tr>
          <tr><td>4</td><td>Mạng an toàn.</td><td>8</td><td>Mạng đồng nhất.</td></tr></table>
          <p class="note">Tổng kết từ kinh nghiệm thực tế những năm 1990. Mỗi giả định sai là một loại lỗi: gói tin mất, hết giờ chờ, nghẽn, bị nghe lén, đường đi đổi…</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Tám giả định sai về mạng như sau. Một, mạng luôn tin cậy, gói tin gửi đi thì chắc chắn tới. Hai, độ trễ bằng 0. Ba, băng thông vô hạn. Bốn, mạng an toàn. Năm, cấu trúc mạng không đổi. Sáu, chỉ có một người quản trị. Bảy, chi phí truyền bằng 0. Tám, mạng đồng nhất. Đây là tổng kết từ kinh nghiệm thực tế những năm 1990. Mỗi giả định sai là một loại lỗi, như gói tin mất, hết giờ chờ, nghẽn mạng, bị nghe lén, hay đường đi thay đổi."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "[3 ** k for k in (1, 2, 3)] == [3, 9, 27]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Gọi dịch vụ từ xa như gọi hàm cục bộ <b class="red">(sai)</b>
          <br><span class="note">Lời gọi có thể chậm, mất, hoặc chạy rồi mà không trả lời. Luôn đặt giờ chờ và nghĩ “nếu không có câu trả lời thì sao”.</span></div>
        say: "Lỗi thứ nhất, gọi dịch vụ từ xa như gọi một hàm cục bộ. Lời gọi có thể chậm, có thể mất, hoặc đã chạy rồi mà không trả lời, nên luôn đặt giờ chờ và nghĩ xem nếu không có câu trả lời thì sao."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ thêm máy là nhanh hơn tương ứng <b class="red">(sai)</b>
          <br><span class="note">Phần tuần tự giới hạn tăng tốc (Amdahl); thêm máy còn thêm chi phí phối hợp.</span></div>
        say: "Lỗi thứ hai, nghĩ thêm máy là nhanh hơn tương ứng. Phần tuần tự giới hạn tăng tốc theo định luật Amdahl, và thêm máy còn thêm chi phí phối hợp."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Phân tán khi một máy là đủ <b class="red">(phức tạp vô ích)</b>
          <br><span class="note">Mọi khó khăn trong khoá này đến từ việc phân tán. Một máy tốt với dữ liệu vừa bộ nhớ thường nhanh và đơn giản hơn.</span></div>
        say: "Lỗi thứ ba, phân tán khi một máy là đủ. Mọi khó khăn trong khoá này đều đến từ việc phân tán, và một máy tốt với dữ liệu vừa bộ nhớ thường nhanh và đơn giản hơn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Hết giờ chờ thì thử lại, và đặt thử lại ở <b>mọi</b> tầng <b class="red">(nhân tải lên đúng lúc hệ thống đang chậm)</b></div>
          <table class="t"><tr><th>chặng gọi nối nhau, mỗi chặng thử tối đa 3 lần</th><th>số yêu cầu tới máy cuối cho 1 yêu cầu của khách</th></tr>
          <tr><td>1 chặng</td><td>3</td></tr><tr><td>2 chặng</td><td>$3 \cdot 3 = 9$</td></tr><tr><td>3 chặng</td><td>$3 \cdot 3 \cdot 3 = \hl{27}$</td></tr></table>
          <p class="note">Người có kinh nghiệm: chỉ thử lại ở một tầng, giới hạn số lần, chờ lâu dần giữa các lần, và gắn mã cho yêu cầu để máy chủ nhận ra yêu cầu lặp.</p>
        focus: [1, 1, 2, "2.3", "2.4", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, hết giờ chờ thì thử lại, và đặt thử lại ở mọi tầng của hệ thống. Nghe thì an toàn, nhưng khi máy cuối đang chậm, mỗi lần thử lại lại đổ thêm tải vào chính nó. Mỗi chặng thử tối đa 3 lần. Một chặng thì máy cuối nhận 3 yêu cầu, hai chặng nối nhau thì 3 nhân 3 bằng 9. Ba chặng thì 27 yêu cầu cho chỉ một yêu cầu của khách. Người có kinh nghiệm chỉ thử lại ở một tầng, giới hạn số lần và chờ lâu dần giữa các lần. Họ còn gắn mã cho yêu cầu để máy chủ nhận ra yêu cầu lặp, vì một yêu cầu có thể đã chạy xong, chỉ mất câu trả lời."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(1 / (0.05 + 0.95 / 20), 2) == 10.26 and round(1 / 0.05) == 20"
      - "round(1 - 0.999 ** 1000, 3) == 0.632"
      - "round(1 - 0.95, 2) == 0.05 and round(0.95 / 20, 4) == 0.0475 and round(0.05 + 0.0475, 4) == 0.0975 and round(0.999 ** 1000, 3) == 0.368 and round(1 - 0.368, 3) == 0.632"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>95% công việc song song được. 20 máy tăng tốc bao nhiêu? Tối đa bao nhiêu?</td></tr>
          <tr><td>2</td><td>1000 máy, mỗi máy hỏng 0,1% số ngày (độc lập): xác suất một ngày có ít nhất một máy hỏng?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 95 phần trăm công việc song song được, 20 máy tăng tốc bao nhiêu lần? Tối đa là bao nhiêu? Câu hai, 1000 máy, mỗi máy hỏng 0 phẩy 1 phần trăm số ngày một cách độc lập, xác suất một ngày có ít nhất một máy hỏng là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>phần tuần tự</td><td>$1 - 0{,}95$</td><td>0,05</td></tr>
          <tr><td>phần song song chia 20 máy</td><td>$0{,}95 / 20$</td><td>0,0475</td></tr>
          <tr><td>tăng tốc</td><td>$\dfrac{1}{0{,}05 + 0{,}0475} = \dfrac{1}{0{,}0975}$</td><td>$\approx \hl{10{,}26}$ lần</td></tr>
          <tr><td>tối đa (vô số máy)</td><td>$\dfrac{1}{0{,}05}$</td><td>20 lần</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, làm từng bước. Phần tuần tự là 1 trừ 0 phẩy 95, bằng 0 phẩy 05. Phần song song chia cho 20 máy là 0 phẩy 95 chia 20, bằng 0 phẩy 0475. Cộng lại được 0 phẩy 0975, và 1 chia cho số đó khoảng 10 phẩy 26 lần, chỉ hơn một nửa số máy. Có vô số máy thì tối đa là 1 chia 0 phẩy 05, bằng 20 lần."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>cả 1000 máy cùng sống</td><td>$0{,}999^{1000}$</td><td>≈ 0,368</td></tr>
          <tr><td>có ít nhất một máy hỏng</td><td>$1 - 0{,}368$</td><td>≈ $\hl{63{,}2\%}$</td></tr></table>
          <div class="box key">Quyết định: với 1000 máy, hỏng máy là chuyện gần như ngày nào cũng có — hệ thống phải tự chạy tiếp khi một máy hỏng.</div>
        focus: ["1.2", "1.3", 2]
        say: "Câu hai, các máy hỏng độc lập nên xác suất cả 1000 máy cùng sống là 0 phẩy 999 mũ 1000, khoảng 0 phẩy 368. Xác suất có ít nhất một máy hỏng là 1 trừ 0 phẩy 368, khoảng 63 phẩy 2 phần trăm. Vậy với 1000 máy, gần như ngày nào cũng có máy hỏng, và hệ thống phải tự chạy tiếp khi một máy hỏng, không chờ người sửa."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">quy mô, chịu lỗi, gần người dùng</span><span class="a">→</span>
          <span class="n">độ trễ, hỏng một phần, không đồng hồ chung</span><span class="a">→</span>
          <span class="n">tám giả định sai</span><span class="a">→</span>
          <span class="n">thiết kế cho hỏng hóc</span></div>
        say: "Tổng kết lại, ta phân tán vì quy mô, chịu lỗi và gần người dùng. Cái giá là độ trễ, hỏng một phần, và không có đồng hồ chung. Đừng mắc tám giả định sai về mạng, và hãy thiết kế cho hỏng hóc ngay từ đầu."
      - show: |
          <div class="box key"><b>Tư duy:</b> với nhiều máy, hỏng hóc không phải ngoại lệ mà là trạng thái bình thường. Câu hỏi không phải “nếu hỏng” mà là “khi hỏng”.</div>
        say: "Điều cần mang theo, với nhiều máy, hỏng hóc không phải ngoại lệ mà là trạng thái bình thường. Câu hỏi không phải nếu hỏng, mà là khi hỏng thì sao."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>mô hình hỏng hóc</b> và xếp thứ tự sự kiện khi không có đồng hồ chung — <b>đồng hồ lôgic</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học mô hình hỏng hóc, và cách xếp thứ tự sự kiện khi không có đồng hồ chung, với đồng hồ lô-gic. Hẹn gặp bạn ở bài tiếp theo."
