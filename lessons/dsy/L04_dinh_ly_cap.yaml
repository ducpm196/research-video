id: L04
course: DSY
series: "DSY · Hệ phân tán và dữ liệu lớn"
title: "Bài 4 — Định lý CAP và đánh đổi độ trễ–nhất quán"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsy.yaml L04; audit/dsy/verify_dsy.py L04; E. Brewer, PODC 2000 (phỏng đoán); S. Gilbert, N. Lynch, Brewer's Conjecture and the Feasibility of Consistent, Available, Partition-Tolerant Web Services, SIGACT News 33(2), 2002; D. Abadi, Consistency Tradeoffs in Modern Distributed Database System Design, IEEE Computer 45(2), 2012"
assumes: [arith, ltgt]
# Quy ước: C = nhất quán theo nghĩa “mọi lần đọc thấy lần ghi mới nhất đã hoàn tất” (tuyến tính hoá, như Gilbert–Lynch); A = mọi yêu cầu tới
#   nút không hỏng đều được trả lời; P = mạng bị chia thành các phần không liên lạc được. Mô phỏng hai nút do Python trong checks; độ trễ
#   xuyên lục địa ≈ 150 ms như bài 0. Tên “CAP” chỉ trên màn hình; lời đọc gọi “định lý nhất quán – sẵn sàng – phân vùng”.
objectives:
  - "Phát biểu đúng định lý CAP"
  - "Biết lựa chọn chỉ bắt buộc khi có phân vùng"
  - "Hiểu đánh đổi độ trễ–nhất quán lúc bình thường"
asr_reviewed:
  - {sentence: "Ghi xong khi W bản xác nhận, đọc thì hỏi R bản, và nếu R cộng W lớn hơn N thì đọc luôn gặp bản mới nhất.", reason: "ASR chép “Ghi xong khi VDUK bản xác nhận, đọc thì hỏi R bản, và nếu R cộng VDUK lớn hơn N thì đọc luôn gặp bản mới nhất.” (0.926): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chọn R và W cùng bằng 3, tức hơn một nửa, gọi là đa số, thì tổng 6 lớn hơn 5, đọc luôn gặp ghi.", reason: "ASR chép “Chọn R và V đút cùng bằng 3, tức hơn một nửa, gọi là đa số, thì tổng 6 lớn hơn 5, đọc luôn gặp ghi.” (0.941): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cáp biển bị đứt"
    steps:
      - show: |
          <p>Hệ thống có hai trung tâm dữ liệu ở hai châu lục. Cáp biển bị đứt: hai bên vẫn chạy nhưng không liên lạc được với nhau. Một khách ở châu Á đổi mật khẩu; ngay sau đó, ở châu Âu có người đăng nhập bằng mật khẩu cũ. Cho vào hay không?</p>
          <div class="box key">Hôm nay: <b>định lý CAP</b> — khi mạng bị chia, phải chọn giữa trả lời đúng và trả lời ngay.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một hệ thống có hai trung tâm dữ liệu ở hai châu lục. Cáp biển bị đứt, hai bên vẫn chạy nhưng không liên lạc được với nhau. Một khách ở châu Á đổi mật khẩu, ngay sau đó ở châu Âu có người đăng nhập bằng mật khẩu cũ, vậy cho vào hay không? Hôm nay ta học định lý về nhất quán, sẵn sàng và phân vùng, khi mạng bị chia, phải chọn giữa trả lời đúng và trả lời ngay."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: bản sao, đa số, và độ trễ theo khoảng cách"
    checks:
      - "alg.quorum_overlap(5, 3, 3) and not alg.quorum_overlap(5, 2, 2) and 5 // 2 + 1 == 3"
      - "150 / 0.5 == 300 and 2 * 0.5 == 1.0"
    steps:
      - show: |
          <p>Ở bài 3: dữ liệu có <b>N bản sao</b> trên N máy; ghi xong khi W bản xác nhận, đọc hỏi R bản; nếu $R + W \gt N$ thì đọc luôn gặp bản mới nhất.</p>
          <table class="t"><tr><th>N = 5</th><th>R = W</th><th>R + W</th><th>đọc luôn gặp ghi?</th></tr>
          <tr><td>hơn một nửa (<b>đa số</b>)</td><td>3</td><td>6 &gt; 5</td><td>có</td></tr>
          <tr><td>không quá một nửa</td><td>2</td><td>4</td><td>không</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Ở bài 3, ta đã học sao chép, dữ liệu có N bản sao trên N máy. Ghi xong khi W bản xác nhận, đọc thì hỏi R bản, và nếu R cộng W lớn hơn N thì đọc luôn gặp bản mới nhất. Bảng lấy N bằng 5. Chọn R và W cùng bằng 3, tức hơn một nửa, gọi là đa số, thì tổng 6 lớn hơn 5, đọc luôn gặp ghi. Chọn cùng bằng 2 thì tổng 4, không bảo đảm."
      - show: |
          <p>Ở bài 0: một lần hỏi rồi chờ trả lời (khứ hồi) có độ trễ phụ thuộc khoảng cách.</p>
          <table class="t"><tr><th>khứ hồi</th><th>độ trễ điển hình</th></tr>
          <tr><td>trong cùng trung tâm dữ liệu</td><td>≈ 0,5 ms</td></tr>
          <tr><td>xuyên lục địa</td><td>≈ 150 ms = $150 / 0{,}5 = \hl{300}$ lần</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Ở bài 0, ta đã thấy một lần hỏi rồi chờ trả lời, gọi là khứ hồi, có độ trễ phụ thuộc khoảng cách. Trong cùng trung tâm dữ liệu, khứ hồi mất khoảng 0 phẩy 5 mi li giây. Xuyên lục địa mất khoảng 150 mi li giây, tức 150 chia 0 phẩy 5, gấp 300 lần."

  - id: sym
    kind: symbol
    title: "Giải mã: C, A, P"
    steps:
      - show: |
          <table class="t"><tr><th>chữ</th><th>nghĩa (theo Gilbert và Lynch, 2002)</th></tr>
          <tr><td>C — nhất quán</td><td>mọi lần đọc thấy lần ghi mới nhất đã hoàn tất, như chỉ có một bản dữ liệu</td></tr>
          <tr><td>A — sẵn sàng</td><td>mọi yêu cầu tới một nút chưa hỏng đều được trả lời</td></tr>
          <tr><td>P — chịu phân vùng</td><td>hệ thống vẫn chạy khi mạng bị chia thành các phần không liên lạc được</td></tr></table>
          <div class="box key"><b>Định lý</b>: khi có phân vùng, không hệ nào giữ được <b>cả</b> C lẫn A. Phân vùng thì không tránh được — nên lựa chọn thật sự là C <b>hay</b> A trong lúc phân vùng.</div>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Ba chữ cái có nghĩa như sau. Nhất quán là mọi lần đọc thấy lần ghi mới nhất đã hoàn tất, như thể chỉ có một bản dữ liệu. Sẵn sàng là mọi yêu cầu tới một nút chưa hỏng đều được trả lời. Chịu phân vùng là hệ thống vẫn chạy khi mạng bị chia thành các phần không liên lạc được. Định lý nói rằng khi có phân vùng, không hệ thống nào giữ được cả nhất quán lẫn sẵn sàng. Phân vùng thì không tránh được, nên lựa chọn thật sự là nhất quán hay sẵn sàng trong lúc phân vùng."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cáp đứt: B phải chọn"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><g font-size="23" fill="#1f2937"><text x="300" y="45" text-anchor="middle" fill="#2a78d6" font-weight="bold">khách 1: ghi x = 2</text><line x1="300" y1="58" x2="300" y2="115" stroke="#2a78d6" stroke-width="4"/><text x="1200" y="45" text-anchor="middle" fill="#eb6834" font-weight="bold">khách 2: đọc x</text><line x1="1200" y1="58" x2="1200" y2="115" stroke="#eb6834" stroke-width="4"/><rect x="120" y="120" width="360" height="130" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="300" y="172" text-anchor="middle">nút A (châu Á)</text><text x="300" y="215" text-anchor="middle" font-weight="bold">x = 2 (vừa ghi)</text><rect x="1020" y="120" width="360" height="130" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="1200" y="172" text-anchor="middle">nút B (châu Âu)</text><text x="1200" y="215" text-anchor="middle">x = 1</text><line x1="480" y1="185" x2="1020" y2="185" stroke="#6b7280" stroke-width="4" stroke-dasharray="12 8"/><line x1="728" y1="163" x2="772" y2="207" stroke="#b91c1c" stroke-width="6"/><line x1="728" y1="207" x2="772" y2="163" stroke="#b91c1c" stroke-width="6"/><text x="750" y="145" text-anchor="middle" fill="#b91c1c" font-weight="bold">cáp đứt</text><line x1="1150" y1="250" x2="920" y2="300" stroke="#1f2937" stroke-width="3"/><line x1="1250" y1="250" x2="1300" y2="300" stroke="#1f2937" stroke-width="3"/><rect x="720" y="300" width="400" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="920" y="338" text-anchor="middle">từ chối: giữ C, mất A</text><rect x="1140" y="300" width="340" height="60" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1310" y="338" text-anchor="middle">trả x = 1: giữ A, mất C</text><text x="120" y="320" fill="#b91c1c">B không thể biết</text><text x="120" y="352" fill="#b91c1c">A đã ghi x = 2</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ hai nút ở hai châu lục, nối nhau bằng cáp biển, và cáp vừa đứt. Khách 1 ghi x bằng 2 vào nút A ở châu Á, nên A có giá trị mới. Khách 2 hỏi x ở nút B bên châu Âu, mà B không thể biết A vừa ghi. B chỉ còn hai đường, từ chối thì giữ nhất quán nhưng mất sẵn sàng, còn trả lời x bằng 1 thì giữ sẵn sàng nhưng mất nhất quán."

  - id: example
    kind: example
    title: "Hai nút, một phân vùng"
    checks:
      - "(lambda a, b: (a['x'], b['x']))(*(lambda a, b: (a.update(x=2), (a, b))[1])({'x': 1}, {'x': 1})) == (2, 1)"
    steps:
      - show: |
          <p><b>Bước một</b> — trạng thái trước và sau lần ghi, khi mạng giữa A và B đã đứt:</p>
          <table class="t"><tr><th>thời điểm</th><th>nút A</th><th>nút B</th></tr>
          <tr><td>trước</td><td><code>x = 1</code></td><td><code>x = 1</code></td></tr>
          <tr><td>khách 1 ghi <code>x = 2</code> vào A</td><td><code>x = 2</code></td><td><code>x = 1</code> (không nhận được tin)</td></tr></table>
        focus: [1, "2.3"]
        say: "Bước một, hai nút A và B cùng giữ x bằng 1, và mạng giữa A và B đã đứt. Khách 1 ghi x bằng 2 vào A, nên A có x bằng 2, còn B vẫn giữ x bằng 1 vì không nhận được tin nào."
      - show: |
          <p><b>Bước 2</b> — khách 2 đọc <code>x</code> từ B. Cách thứ nhất: B <b>từ chối</b> (báo lỗi, hoặc chờ tới khi nối lại được với A).</p>
          <table class="t"><tr><th>B chọn</th><th>trả lời</th><th>giữ được</th><th>mất</th></tr>
          <tr><td>từ chối (báo lỗi, chờ)</td><td>—</td><td>C</td><td>A</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước hai, khách 2 đọc x từ B, và cách thứ nhất là B từ chối, báo lỗi hoặc chờ tới khi nối lại được với A. Không trả lời sai nên giữ được nhất quán. Nhưng một nút chưa hỏng lại không trả lời, nên mất sẵn sàng."
      - show: |
          <p><b>Bước 3</b> — cách thứ hai: B <b>trả lời ngay</b> bằng thứ nó có.</p>
          <table class="t"><tr><th>B chọn</th><th>trả lời</th><th>giữ được</th><th>mất</th></tr>
          <tr><td>trả lời ngay</td><td><code>x = 1</code> (cũ)</td><td>A</td><td>C</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước ba, cách thứ hai là B trả lời ngay bằng thứ nó có, tức x bằng 1. Khách được trả lời nên giữ được sẵn sàng. Nhưng lần ghi mới nhất đã hoàn tất là x bằng 2, nên mất nhất quán."
      - clear: true
        show: |
          <p><b>Bước 4</b> — vì sao không có cách thứ ba:</p>
          <table class="t"><tr><th>thế giới</th><th>A đã ghi?</th><th>B đang giữ</th><th>trả lời đúng phải là</th></tr>
          <tr><td>thứ nhất</td><td>chưa</td><td><code>x = 1</code></td><td>1</td></tr>
          <tr><td>thứ hai</td><td>rồi</td><td><code>x = 1</code></td><td>2</td></tr></table>
          <div class="box key">B thấy <b>hai thế giới y hệt nhau</b>, nên trả lời giống nhau — sai ở ít nhất một thế giới, trừ khi nó từ chối.</div>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước bốn, vì sao không có cách thứ ba. Ở thế giới thứ nhất A chưa ghi, câu trả lời đúng là 1. Ở thế giới thứ hai A đã ghi, câu trả lời đúng là 2, nhưng B vẫn đang giữ x bằng 1 như cũ. Vì B thấy hai thế giới y hệt nhau, nó sẽ trả lời giống nhau, nên sai ở ít nhất một thế giới, trừ khi nó từ chối."

  - id: check
    kind: check
    title: "Tự kiểm: thử hết mọi cách trả lời của B"
    checks:
      - "not any((a is not None) and all(a == w for w in (1, 2)) for a in (1, 2, None))"
      - "[(a, a is not None, a is None or a == 2) for a in (1, 2, None)] == [(1, True, False), (2, True, True), (None, False, True)]"
      - "[(a, a is None or a == 1) for a in (1, 2, None)] == [(1, True), (2, False), (None, True)]"
    steps:
      - show: |
          <table class="t"><tr><th>B làm gì</th><th>sẵn sàng?</th><th>đúng khi A <b>đã</b> ghi?</th><th>đúng khi A <b>chưa</b> ghi?</th></tr>
          <tr><td>trả 1</td><td>có</td><td><b class="red">sai</b></td><td>đúng</td></tr>
          <tr><td>trả 2 (đoán)</td><td>có</td><td>đúng</td><td><b class="red">sai</b></td></tr>
          <tr><td>từ chối</td><td><b class="red">không</b></td><td>không sai</td><td>không sai</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Kiểm bằng đường khác, ta không lập luận nữa mà thử hết mọi cách trả lời của B. Trả 1 thì sẵn sàng, nhưng sai khi A đã ghi, vì lúc đó đáp án đúng là 2. Trả 2, tức đoán mò, thì sẵn sàng, nhưng sai khi A chưa ghi, vì lúc đó đáp án đúng là 1. Từ chối thì không bao giờ sai, nhưng mất sẵn sàng. Không dòng nào vừa sẵn sàng vừa đúng trong cả hai thế giới, đúng như định lý."

  # ───────────────────────── 4. LÚC BÌNH THƯỜNG ─────────────────────────
  - id: normal
    kind: concept
    title: "Không có phân vùng: độ trễ hay nhất quán"
    checks:
      - "150 / 0.5 == 300"
    steps:
      - show: |
          <p>Phần lớn thời gian mạng không bị chia. Vẫn có đánh đổi (Abadi, 2012): muốn mọi lần đọc thấy bản mới nhất, mỗi lần ghi phải chờ các bản sao ở xa xác nhận.</p>
          <table class="t"><tr><th>ghi chờ bản sao ở</th><th>thêm vào mỗi lần ghi</th></tr>
          <tr><td>cùng trung tâm dữ liệu</td><td>≈ 0,5 ms</td></tr>
          <tr><td>lục địa khác</td><td>≈ 150 ms, gấp $\hl{300}$ lần</td></tr></table>
          <div class="box key">Khi phân vùng: chọn nhất quán hay sẵn sàng. Lúc bình thường: chọn nhất quán hay <b>độ trễ thấp</b>.</div>
        focus: [1, 1, "2.3", 3]
        say: "Phần lớn thời gian mạng không bị chia, nhưng vẫn có một đánh đổi khác, như một nghiên cứu năm 2012 chỉ ra. Muốn mọi lần đọc thấy bản mới nhất thì mỗi lần ghi phải chờ các bản sao ở xa xác nhận. Xuyên lục địa là thêm khoảng 150 mi li giây, gấp 300 lần một lời gọi trong cùng trung tâm dữ liệu. Tóm lại, khi phân vùng thì chọn nhất quán hay sẵn sàng, còn lúc bình thường thì chọn nhất quán hay độ trễ thấp."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "alg.majority_tolerance(4) == (3, 1) and max(2, 2) < 3"
      - "alg.majority_tolerance(5)[0] == 3 and [5 - s for s in (2, 2, 1)] == [3, 3, 4] and all(5 - s >= 3 for s in (2, 2, 1))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “Chọn 2 trong 3” lúc bình thường <b class="red">(sai)</b>
          <br><span class="note">Lựa chọn chỉ <b>bắt buộc</b> khi có phân vùng. Lúc mạng tốt, hệ có thể vừa nhất quán vừa sẵn sàng.</span></div>
        say: "Lỗi thứ nhất, hiểu định lý là chọn 2 trong 3 lúc bình thường. Lựa chọn chỉ bắt buộc khi có phân vùng, lúc mạng tốt thì hệ thống có thể vừa nhất quán vừa sẵn sàng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> “Hệ của tôi bỏ P” <b class="red">(vô nghĩa)</b>
          <br><span class="note">Phân vùng không phải tính năng để chọn, nó xảy ra dù muốn hay không. Bỏ P chỉ có nghĩa với một máy duy nhất.</span></div>
        say: "Lỗi thứ hai, nói hệ của tôi bỏ chịu phân vùng. Phân vùng không phải một tính năng để chọn, nó xảy ra dù muốn hay không, và bỏ nó chỉ có nghĩa khi chỉ có một máy duy nhất."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn một kiểu cho cả hệ thống <b class="red">(thô)</b>
          <br><span class="note">Số dư tài khoản, mật khẩu: cần nhất quán. Số lượt thích, gợi ý sản phẩm: sẵn sàng quan trọng hơn. Chọn theo <b>từng loại dữ liệu</b>.</span></div>
        say: "Lỗi thứ ba, chọn một kiểu cho cả hệ thống. Số dư tài khoản hay mật khẩu cần nhất quán, còn số lượt thích hay gợi ý sản phẩm thì sẵn sàng quan trọng hơn, nên hãy chọn theo từng loại dữ liệu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Chọn nhất quán, đặt bản sao chia đều cho <b>hai</b> trung tâm dữ liệu <b class="red">(cáp đứt là cả hệ ngừng ghi)</b></div>
          <table class="t"><tr><th>cách đặt</th><th>đa số cần</th><th>cáp giữa hai nơi đứt</th></tr>
          <tr><td>4 nút: 2 ở châu Á + 2 ở châu Âu</td><td>3</td><td>mỗi bên chỉ 2 &lt; 3: <b class="red">không bên nào ghi được</b></td></tr>
          <tr><td>5 nút ở 3 nơi: 2 + 2 + 1</td><td>3</td><td>mất một nơi bất kỳ còn 3 hoặc 4 nút ≥ 3: $\hl{\text{vẫn ghi}}$</td></tr></table>
        introduces: [geq]
        focus: [1, "2.2", "2.2", "2.3", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, chọn nhất quán nhưng chia đều bản sao cho hai trung tâm dữ liệu. Với 4 nút, 2 ở châu Á và 2 ở châu Âu, đa số cần 3 nút. Cáp đứt thì mỗi bên chỉ có 2, nhỏ hơn 3, nên không bên nào ghi được, cả hệ ngừng ghi dù không máy nào hỏng. Người có kinh nghiệm đặt 5 nút ở 3 nơi, 2 cộng 2 cộng 1. Mất liên lạc với một nơi bất kỳ thì phía còn lại vẫn có 3 hoặc 4 nút, đủ đa số, nên vẫn ghi được."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.majority_tolerance(5) == (3, 2) and 2 < alg.majority_tolerance(5)[0]"
      - "3 >= alg.majority_tolerance(5)[0] and 3 + 2 == 5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Mạng của 5 nút bị chia thành nhóm 3 và nhóm 2. Hệ chọn nhất quán, ghi cần đa số. Nhóm nào còn nhận ghi được?</td></tr>
          <tr><td>2</td><td>Giỏ hàng trong mùa giảm giá: nên ưu tiên nhất quán hay sẵn sàng khi phân vùng? Vì sao?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, mạng của 5 nút bị chia thành nhóm 3 nút và nhóm 2 nút. Hệ thống chọn nhất quán, ghi cần đa số, vậy nhóm nào còn nhận ghi được? Câu hai, với giỏ hàng trong mùa giảm giá, khi phân vùng nên ưu tiên nhất quán hay sẵn sàng, và vì sao? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>đa số của 5 nút</td><td>hơn một nửa của 5</td><td>3</td></tr>
          <tr><td>nhóm 3 nút</td><td>$3 \ge 3$</td><td>$\hl{\text{nhận ghi}}$</td></tr>
          <tr><td>nhóm 2 nút</td><td>$2 \lt 3$</td><td>từ chối ghi: mất sẵn sàng ở phía đó</td></tr></table>
        introduces: [geq]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, làm từng bước. Đa số của 5 nút là hơn một nửa, tức 3 nút. Nhóm 3 nút có đủ 3, nên vẫn nhận ghi. Nhóm 2 nút chỉ có 2, nhỏ hơn 3, nên phải từ chối ghi, tức mất sẵn sàng ở phía đó."
      - show: |
          <table class="t"><tr><th>câu 2: giỏ hàng</th><th>chọn</th><th>lý do</th></tr>
          <tr><td>thêm hàng vào giỏ</td><td>$\hl{\text{sẵn sàng}}$</td><td>khách được phục vụ ngay; sau phân vùng gộp hai bản giỏ</td></tr>
          <tr><td>bước trừ tiền</td><td>nhất quán</td><td>không được trừ hai lần hay trừ theo số dư cũ</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3"]
        say: "Câu hai, tách theo từng loại dữ liệu. Thêm hàng vào giỏ thường chọn sẵn sàng, khách được phục vụ ngay. Sau phân vùng thì gộp hai bản giỏ lại, như đồng hồ vector ở bài 2 giúp phát hiện hai lần ghi đồng thời để gộp. Riêng bước trừ tiền thì cần nhất quán, vì không được trừ hai lần hay trừ theo số dư cũ."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">phân vùng không tránh được</span><span class="a">→</span>
          <span class="n">khi phân vùng: C hay A</span><span class="a">→</span>
          <span class="n">lúc bình thường: C hay độ trễ</span><span class="a">→</span>
          <span class="n">chọn theo loại dữ liệu</span></div>
        say: "Tổng kết lại, phân vùng không tránh được. Khi phân vùng thì chọn nhất quán hay sẵn sàng, lúc bình thường thì chọn nhất quán hay độ trễ thấp, và hãy chọn theo từng loại dữ liệu."
      - show: |
          <div class="box key"><b>Tư duy:</b> một định lý bất khả cho biết <b>không</b> nên tìm gì. Thay vì mong một hệ hoàn hảo, hãy chọn rõ mình chịu mất gì, ở đâu.</div>
        say: "Điều cần mang theo, một định lý bất khả cho biết không nên tìm kiếm điều gì. Thay vì mong một hệ hoàn hảo, hãy chọn rõ mình chịu mất gì, và ở đâu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): nhiều nút cùng thống nhất một giá trị — <b>đồng thuận</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học cách nhiều nút cùng thống nhất một giá trị, gọi là đồng thuận. Hẹn gặp bạn ở bài tiếp theo."
