id: L04
course: OSY
series: "OSY · Hệ điều hành"
title: "Bài 4 — Tranh chấp và vùng găng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/osy.yaml L04; audit/verify_plan_curricula.py OSY:L04; R. Arpaci-Dusseau, A. Arpaci-Dusseau, Operating Systems: Three Easy Pieces, chương 26"
assumes: [arith, dots]
# Quy ước: x là biến dùng chung, ban đầu 0. “x++” trong mã máy là 3 bước: đọc x vào thanh ghi, cộng 1 vào thanh ghi, ghi thanh ghi về x.
#   Mỗi luồng có thanh ghi riêng. Mọi con số về cách xen kẽ do alg.race_run / alg.race_finals duyệt hết, không ước lượng.
objectives:
  - "Chỉ ra điều kiện tranh chấp trong x++"
  - "Phát biểu ba yêu cầu của lời giải vùng găng"
  - "Giải thích vì sao chạy thử nhiều lần không chứng minh được đúng"
asr_reviewed:
  - {sentence: "Vậy x cuối chỉ bằng 1, mất một lần cộng của A.", reason: "ASR chép “Vậy ít cuối chỉ bằng một, mất một lần cộng qua.” (0.87): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: của (trong “của a” → “qua”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Giờ ta xem một cách xen kẽ cụ thể giữa hai luồng.", reason: "câu đã viết dài ra (bản 6 từ khớp 0,714); vẫn xen/xem, kẽ/kẻ, luồng/luôn: cặp nhầm âm cuối n/m, ng/n và thanh ngã/hỏi lặp ở mọi câu có “luồng” của L01, L04, L09 — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hai, tìm cặp đọc rồi ghi mà luồng khác chen vào giữa được.", reason: "hai/hay (cặp đã biết, SKILL Bước 5), đọc/độc, rồi/đồ, luồng/luôn: nhầm thanh và phụ âm đầu của ASR; câu đủ nghĩa — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, thứ tự A A A B B B thì sao?", reason: "chuỗi “A A A” đọc tên chữ cái liền nhau; ASR bỏ mất, còn “B B B” chép đúng “BBB”; thứ tự hiện trên màn hình — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ghi, chép thanh ghi về lại x.", reason: "chữ “x” (đọc “ích”) ở cuối câu bị ASR bỏ; mọi từ khác khớp; x hiện trên màn hình — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai luồng, mỗi luồng cộng 1 — kết quả là 1"
    checks:
      - "alg.race_finals(1) == {1, 2}"
    steps:
      - show: |
          <p>Hai luồng cùng chạy <code>x++</code> một lần, $x$ bắt đầu bằng 0. Bạn chắc kết quả là 2?</p>
          <p>Có lúc kết quả là <b class="red">1</b> — một lần cộng đã <b>biến mất</b>.</p>
          <div class="box key">Hôm nay: vì sao chuyện đó xảy ra, và điều kiện để một đoạn mã dùng chung chạy đúng.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, hai luồng cùng chạy lệnh tăng x thêm 1, mỗi luồng một lần, và x bắt đầu bằng 0. Bạn chắc kết quả là 2 chứ? Có lúc kết quả là 1, một lần cộng đã biến mất. Hôm nay ta tìm hiểu vì sao chuyện đó xảy ra, và điều kiện để một đoạn mã dùng chung chạy đúng."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: bản sao trong thanh ghi, và đếm mọi thứ tự"
    checks:
      - "alg.race_run('AAA')[0] == 1 and [s[2] for s in alg.race_run('AAA')[1]] == [0, 1, 1] and 5 + 1 == 6"
      - "len(set(__import__('itertools').permutations('AABB'))) == 6 == __import__('math').comb(4, 2)"
    steps:
      - show: |
          <p>Một luồng, chạy một mình, tăng $x$ từ 5. Thanh ghi giữ một <b>bản sao</b>; $x$ chỉ đổi khi ghi về.</p>
          <table class="t"><tr><th>bước</th><th>thanh ghi</th><th>$x$</th></tr>
          <tr><td>đọc</td><td>5</td><td>5</td></tr>
          <tr><td>cộng</td><td>6</td><td>5 (chưa đổi)</td></tr>
          <tr><td>ghi</td><td>6</td><td>$\hl{6}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Trước hết, ta ôn cách một luồng chạy một mình tăng x từ 5, để thấy thanh ghi chỉ giữ một bản sao. Bước đọc chép 5 vào thanh ghi. Bước cộng làm thanh ghi thành 6, nhưng x vẫn là 5, vì chưa ai ghi về. Bước ghi chép 6 về x, lúc này x mới bằng 6."
      - show: |
          <p>Đếm mọi thứ tự: luồng A có 2 bước, luồng B có 2 bước, giữ đúng thứ tự trong mỗi luồng.</p>
          <table class="t"><tr><th colspan="6">mọi cách xen kẽ</th></tr>
          <tr><td>AABB</td><td>ABAB</td><td>ABBA</td><td>BAAB</td><td>BABA</td><td>BBAA</td></tr></table>
          <p>Chọn 2 trong 4 vị trí cho A: $\frac{4 \times 3}{2} = 6$ cách.</p>
        focus: [1, 2, 3]
        say: "Thứ hai, ta ôn cách đếm mọi thứ tự. Luồng A có 2 bước, luồng B có 2 bước, và trong mỗi luồng các bước giữ đúng thứ tự, nên liệt kê ra được đúng 6 cách xen kẽ như bảng. Đếm nhanh hơn, ta chọn 2 trong 4 vị trí cho các bước của A, được 4 nhân 3 chia 2, bằng 6 cách, khớp với bảng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: x++ là ba bước"
    steps:
      - show: |
          <div class="code"><div>đọc:  thanh ghi ← x</div><div>cộng: thanh ghi ← thanh ghi + 1</div><div>ghi:  x ← thanh ghi</div></div>
          <p>Mỗi luồng có <b>thanh ghi riêng</b>, nhưng $x$ là <b>chung</b>. Bộ lập lịch có thể chuyển sang luồng khác <b>giữa bất kỳ hai bước nào</b>.</p>
        introduces: [assign]
        focus: ["1.1", "1.2", "1.3", 2, 2]
        say: "Lệnh x cộng cộng trong mã máy thật ra là ba bước. Bước đọc, chép x vào thanh ghi, mũi tên nghĩa là thay giá trị bên trái bằng giá trị bên phải. Bước cộng, tăng thanh ghi thêm 1. Bước ghi, chép thanh ghi về lại x. Mỗi luồng có thanh ghi riêng nhưng x là chung, và bộ lập lịch có thể chuyển sang luồng khác giữa bất kỳ hai bước nào."

  # ───────────────────────── 2b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: hai bản sao riêng, một biến chung"
    checks:
      - "[s[3] for s in alg.race_run('ABABAB')[1]] == [0, 0, 0, 0, 1, 1]"
      - "[(s[0], s[1], s[2]) for s in alg.race_run('ABABAB')[1]] == [('A', 'load', 0), ('B', 'load', 0), ('A', 'add', 1), ('B', 'add', 1), ('A', 'store', 1), ('B', 'store', 1)]"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arO4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arO4r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><text x="20" y="100" font-size="24" font-weight="bold" fill="#2563eb">thanh ghi A</text><text x="20" y="225" font-size="24" font-weight="bold" fill="#1f2937">x chung</text><text x="20" y="350" font-size="24" font-weight="bold" fill="#16a34a">thanh ghi B</text><text x="340" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">1. A đọc</text><rect x="285" y="65" width="110" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="340" y="100" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="285" y="190" width="110" height="50" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="340" y="225" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><text x="530" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">2. B đọc</text><rect x="475" y="65" width="110" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="530" y="100" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="475" y="190" width="110" height="50" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="530" y="225" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="475" y="315" width="110" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="530" y="350" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><text x="720" y="34" font-size="22" font-weight="bold" t