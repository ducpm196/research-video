x="1100" y="350" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><text x="1290" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">6. B ghi đè</text><rect x="1235" y="65" width="110" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="1290" y="100" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="1235" y="190" width="110" height="50" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1290" y="225" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="1235" y="315" width="110" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1290" y="350" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="340" y1="188" x2="340" y2="122" marker-end="url(#arO4)"/><line x1="530" y1="242" x2="530" y2="308" marker-end="url(#arO4)"/><line x1="1100" y1="117" x2="1100" y2="183" marker-end="url(#arO4)"/></g><line x1="1290" y1="313" x2="1290" y2="247" stroke="#dc2626" stroke-width="4" marker-end="url(#arO4r)"/><text x="720" y="150" font-size="22" text-anchor="middle" fill="#2563eb">+1</text><text x="910" y="290" font-size="22" text-anchor="middle" fill="#16a34a">+1</text><text x="750" y="410" font-size="24" text-anchor="middle" fill="#dc2626">B ghi 1 đè lên 1 của A: hai lần cộng mà x chỉ tăng 1</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này vẽ ba làn, thanh ghi riêng của luồng A ở trên, biến x dùng chung ở giữa, thanh ghi riêng của luồng B ở dưới. Mũi tên đi xuống từ x là một lần đọc, chép giá trị của x vào bản sao riêng. Cả hai luồng đều đọc khi x còn là 0, nên mỗi bên cộng 1 vào bản sao của mình và cùng được 1. Đến lúc ghi, mũi tên đỏ của B chép 1 đè lên đúng con số 1 mà A vừa ghi, nên hai lần cộng mà x chỉ tăng có 1."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Một cách xen kẽ làm mất một lần cộng"
    checks:
      - "alg.race_run('ABABAB')[0] == 1"
      - "[s[3] for s in alg.race_run('ABABAB')[1]] == [0, 0, 0, 0, 1, 1] and [s[2] for s in alg.race_run('ABABAB')[1]] == [0, 0, 1, 1, 1, 1]"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>luồng A</th><th>luồng B</th><th>$x$</th></tr>
          <tr><td>1</td><td>đọc: thanh ghi A = 0</td><td></td><td>0</td></tr></table>
        focus: [0, "1.2"]
        say: "Giờ ta xem một cách xen kẽ cụ thể giữa hai luồng. Bước 1, luồng A đọc x được 0."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>luồng A</th><th>luồng B</th><th>$x$</th></tr>
          <tr><td>1</td><td>đọc: thanh ghi A = 0</td><td></td><td>0</td></tr>
          <tr><td>2</td><td></td><td>đọc: thanh ghi B = 0</td><td>0</td></tr></table>
        focus: ["1.3"]
        say: "Bước 2, trước khi A kịp ghi, luồng B cũng đọc x, vẫn được 0."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>luồng A</th><th>luồng B</th><th>$x$</th></tr>
          <tr><td>1</td><td>đọc: thanh ghi A = 0</td><td></td><td>0</td></tr>
          <tr><td>2</td><td></td><td>đọc: thanh ghi B = 0</td><td>0</td></tr>
          <tr><td>3–4</td><td>cộng: thanh ghi A = 1</td><td>cộng: thanh ghi B = 1</td><td>0</td></tr></table>
        focus: ["1.4", "1.4"]
        say: "Bước 3, hai luồng cùng cộng 1 vào thanh ghi riêng, mỗi thanh ghi bằng 1. Biến x chung vẫn là 0, vì chưa luồng nào ghi về."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>luồng A</th><th>luồng B</th><th>$x$</th></tr>
          <tr><td>1</td><td>đọc: thanh ghi A = 0</td><td></td><td>0</td></tr>
          <tr><td>2</td><td></td><td>đọc: thanh ghi B = 0</td><td>0</td></tr>
          <tr><td>3–4</td><td>cộng: thanh ghi A = 1</td><td>cộng: thanh ghi B = 1</td><td>0</td></tr>
          <tr><td>5–6</td><td>ghi: $x$ = 1</td><td>ghi: $x$ = 1</td><td>$\hl{1}$</td></tr></table>
        focus: ["1.5"]
        say: "Bước 4, cả hai cùng ghi 1 vào x, nên x bằng 1, lần cộng của A bị B ghi đè mất."
      - show: |
          <div class="box key">Lỗi xảy ra vì B đọc $x$ <b>sau</b> khi A đọc nhưng <b>trước</b> khi A ghi. Kết quả phụ thuộc thứ tự chạy: đó là <b>điều kiện tranh chấp</b>.</div>
        say: "Lỗi xảy ra vì B đọc x sau khi A đã đọc, nhưng trước khi A kịp ghi. Khi kết quả phụ thuộc vào thứ tự chạy như vậy, ta gọi là điều kiện tranh chấp."

  # ───────────────────────── 4. MÁY DUYỆT HẾT ─────────────────────────
  - id: count
    kind: concept
    title: "Máy duyệt mọi cách xen kẽ"
    checks:
      - "__import__('math').comb(6, 3) == 20 and alg.race_finals(1) == {1, 2}"
      - "6 * 5 * 4 / (3 * 2 * 1) == 20"
      - "__import__('math').comb(12, 6) == 924 and alg.race_finals(2) == {2, 3, 4}"
      - "sum(alg.race_run(''.join('A' if i in p else 'B' for i in range(6)))[0] == 2 for p in __import__('itertools').combinations(range(6), 3)) == 2"
    steps:
      - show: |
          <p>Mỗi luồng tăng 1 lần: 6 bước, chọn 3 vị trí cho các bước của A → 20 cách xen kẽ. Chỉ <b>2</b> cách cho $x = 2$ (một luồng chạy xong hẳn rồi luồng kia mới bắt đầu); 18 cách còn lại cho $x = 1$.</p>
          <p>Mỗi luồng tăng 2 lần: 924 cách xen kẽ, $x$ cuối có thể là $\hl{2}$, $\hl{3}$ hoặc $\hl{4}$ — không chỉ 4.</p>
          $$\text{chọn 3 trong 6} = \frac{6 \times 5 \times 4}{3 \times 2 \times 1} = 20$$
        focus: [0, 1, 1, 2]
        say: "Máy đã duyệt hết mọi khả năng. Khi mỗi luồng tăng một lần, có 6 bước và 20 cách xen kẽ, vì chỉ cần chọn 3 trong 6 vị trí cho các bước của A. Chỉ 2 cách cho x bằng 2, là khi một luồng chạy xong hẳn rồi luồng kia mới bắt đầu, còn 18 cách cho x bằng 1. Khi mỗi luồng tăng hai lần, có 924 cách xen kẽ, và x cuối có thể là 2, 3 hoặc 4."

  # ───────────────────────── 5. VÙNG GĂNG ─────────────────────────
  - id: cs
    kind: concept
    title: "Vùng găng và ba yêu cầu của lời giải"
    steps:
      - show: |
          <p><b>Vùng găng</b>: đoạn mã truy cập dữ liệu dùng chung (ở đây: cả ba bước của <code>x++</code>). Lời giải đúng phải bảo đảm:</p>
          <ol><li><b>Loại trừ lẫn nhau</b>: tại mỗi lúc, nhiều nhất một luồng ở trong vùng găng.</li>
          <li><b>Tiến triển</b>: nếu vùng găng trống và có luồng muốn vào, phải có luồng được vào — không treo mãi.</li>
          <li><b>Chờ có giới hạn</b>: một luồng đã xin vào thì chỉ phải nhường cho người khác một số lần hữu hạn.</li></ol>
        focus: [1, "2.1", "2.2", "2.3"]
        say: "Vùng găng là đoạn mã truy cập dữ liệu dùng chung, ở đây là cả ba bước của lệnh tăng x. Yêu cầu thứ nhất, loại trừ lẫn nhau, tại mỗi lúc nhiều nhất một luồng ở trong vùng găng. Yêu cầu thứ hai, tiến triển, nếu vùng găng đang trống và có luồng muốn vào thì phải có luồng được vào. Yêu cầu thứ ba, chờ có giới hạn, một luồng đã xin vào thì chỉ phải nhường cho người khác một số lần hữu hạn."
      - show: |
          <div class="box key">Ví dụ: bảo đảm cả 3 bước của A xong trước khi B đọc → chỉ còn 2 cách xen kẽ hợp lệ, cả hai đều cho $x = 2$.</div>
        say: "Ví dụ, nếu bảo đảm cả ba bước của A xong trước khi B được đọc, chỉ còn 2 cách xen kẽ hợp lệ, và cả hai đều cho x bằng 2."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "alg.race_run('AAABBB')[0] == 2 and alg.race_run('BBBAAA')[0] == 2"
      - "[s[2] for s in alg.race_run('ABABAB')[1] if s[:2] == ('B', 'load')] == [0] and alg.race_run('ABABAB')[0] == 0 + 1"
      - "[s[2] for s in alg.race_run('AAABBB')[1] if s[:2] == ('B', 'load')] == [1] and alg.race_run('AAABBB')[0] == 1 + 1"
    steps:
      - show: |
          <p><b>Kiểm bằng đường khác:</b> $x$ cuối = giá trị mà <b>người ghi sau cùng</b> đã đọc, cộng 1.</p>
          <table class="t"><tr><th>thứ tự</th><th>người ghi sau cùng</th><th>nó đã đọc</th><th>$x$ cuối</th><th>chạy thật</th></tr>
          <tr><td>A B A B A B</td><td>B</td><td>0</td><td>$0 + 1 = 1$</td><td>1 ✓</td></tr>
          <tr><td>A A A B B B</td><td>B</td><td>1</td><td>$1 + 1 = 2$</td><td>2 ✓</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Kiểm lại bằng đường khác, không lần từng bước mà chỉ nhìn người ghi sau cùng, vì lần ghi sau cùng quyết định x cuối, bằng giá trị mà người đó đã đọc cộng 1. Với thứ tự xen kẽ ở ví dụ, B ghi sau cùng và B đã đọc 0, nên x cuối bằng 1, khớp. Với thứ tự A chạy hết rồi mới tới B, B đọc được 1, nên x cuối bằng 2, cũng khớp với máy chạy thật."
      - show: |
          <ol><li>Có biến nào nhiều luồng cùng <b>ghi</b> (hoặc một ghi, một đọc) không? Có thì có thể tranh chấp.</li>
          <li>Tìm cặp “đọc rồi ghi” mà luồng khác chen vào giữa được.</li>
          <li>Kết quả có đổi khi đổi thứ tự xen kẽ không? Đổi là có lỗi.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba câu hỏi. Một, có biến nào mà nhiều luồng cùng ghi, hoặc một luồng ghi một luồng đọc không, nếu có thì có thể tranh chấp. Hai, tìm cặp đọc rồi ghi mà luồng khác chen vào giữa được. Ba, kết quả có đổi khi đổi thứ tự xen kẽ không, vì đổi nghĩa là có lỗi."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay gặp, kể cả của người đã đi làm"
    checks:
      - "alg.race_finals(1) == {1, 2} and min(alg.race_finals(1)) == 1 and 2 * 1 == 2"
      - "alg.race_finals(2) == {2, 3, 4} and min(alg.race_finals(2)) == 2 and 2 * 2 == 4 and 2 / 4 == 0.5"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chạy thử 1000 lần đều ra đúng nên kết luận không có lỗi <b class="red">(sai)</b>
          <br><span class="note">Bộ lập lịch hiếm khi chuyển luồng đúng giữa đọc và ghi — lỗi hiếm, nên thử không bắt được, nhưng vẫn có thật.</span></div>
        say: "Lỗi thứ nhất, chạy thử 1000 lần đều ra đúng rồi kết luận không có lỗi. Bộ lập lịch hiếm khi chuyển luồng đúng vào giữa bước đọc và bước ghi, nên lỗi hiếm và thử không bắt được, nhưng lỗi vẫn có thật."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ <code>x++</code> là một lệnh nên không bị chen ngang <b class="red">(sai)</b>
          <br><span class="note">Một dòng mã nguồn thường thành nhiều bước mã máy. Kể cả khi trình dịch ra <b>một</b> lệnh máy, lệnh đó vẫn đọc–sửa–ghi bộ nhớ; trên máy nhiều lõi nó không nguyên tử nếu không dùng lệnh nguyên tử (x86: tiền tố <code>lock</code>).</span></div>
        say: "Lỗi thứ hai, nghĩ lệnh tăng x là một lệnh nên không bị chen ngang. Một dòng mã nguồn thường thành nhiều bước mã máy. Kể cả khi chỉ ra một lệnh máy, lệnh đó vẫn đọc, sửa rồi ghi bộ nhớ, và trên máy nhiều lõi, lõi khác vẫn chen vào được nếu không dùng lệnh nguyên tử của phần cứng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> Bộ đếm thống kê không khoá vì “có lệch thì chỉ lệch chút ít” <b class="red">(sai)</b></div>
          <table class="t"><tr><th>mỗi luồng tăng</th><th>đúng phải là</th><th>nhỏ nhất có thể (máy duyệt hết)</th><th>mất</th></tr>
          <tr><td>1 lần</td><td>2</td><td>1</td><td>một nửa</td></tr>
          <tr><td>2 lần</td><td>4</td><td>2</td><td>$\hl{\text{một nửa}}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là để bộ đếm thống kê không khoá, vì nghĩ có lệch thì chỉ lệch chút ít. Máy duyệt hết các cách xen kẽ cho thấy, khi mỗi luồng tăng 1 lần, kết quả có thể chỉ là 1 thay vì 2. Khi mỗi luồng tăng 2 lần, kết quả có thể chỉ là 2 thay vì 4, mất tới một nửa số lần đếm, nên con số đó không dùng để ra quyết định được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Chỉ bảo vệ chỗ ghi, không bảo vệ chỗ đọc <b class="red">(sai)</b>
          <br><span class="note">Ví dụ trên hỏng vì B <b>đọc</b> giữa lúc A đọc và ghi. Cả chuỗi đọc–cộng–ghi phải nằm trong vùng găng.</span></div>
        say: "Lỗi thứ tư, chỉ bảo vệ chỗ ghi mà không bảo vệ chỗ đọc. Ví dụ trên hỏng chính vì B đọc giữa lúc A đọc và ghi, nên cả chuỗi đọc, cộng, ghi phải nằm trong vùng găng."
      - show: |
          <div class="box warn"><b>Lỗi 5.</b> Chữa bằng cờ “đang bận” đọc rồi đặt bằng mã thường <b class="red">(vẫn sai)</b>
          <br><span class="note">Đọc cờ rồi đặt cờ cũng là “đọc rồi ghi” — hai luồng cùng thấy cờ trống và cùng vào. Cần một lệnh không chia nhỏ được của phần cứng.</span></div>
        say: "Lỗi thứ năm, chữa bằng một cờ đang bận, đọc cờ rồi đặt cờ bằng mã thường. Đọc rồi đặt cờ cũng là đọc rồi ghi, nên hai luồng có thể cùng thấy cờ trống và cùng vào, cần một lệnh không chia nhỏ được của phần cứng."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.race_run('AABABB')[0] == 1 and alg.race_run('AAABBB')[0] == 2"
    steps:
      - show: |
          <p>Mỗi luồng tăng 1 lần. Chuỗi chữ cho biết luồng nào chạy bước kế tiếp của nó (đọc → cộng → ghi).</p>
          <table class="t"><tr><th>câu</th><th>thứ tự</th><th>hỏi</th></tr>
          <tr><td>1</td><td>A A B A B B</td><td>$x$ cuối bằng mấy?</td></tr>
          <tr><td>2</td><td>A A A B B B</td><td>$x$ cuối bằng mấy?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Mỗi luồng tăng x một lần, chuỗi chữ cho biết luồng nào chạy bước kế tiếp của nó. Câu một, thứ tự A A B A B B, x cuối bằng mấy? Câu hai, thứ tự A A A B B B thì sao? Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p>① Thứ tự A A B A B B, lần từng bước:</p>
          <table class="t"><tr><th>luồng</th><th>A</th><th>A</th><th>B</th><th>A</th><th>B</th><th>B</th></tr>
          <tr><td>việc</td><td>đọc 0</td><td>cộng: 1</td><td>đọc 0 (A chưa ghi!)</td><td>ghi: $x$ = 1</td><td>cộng: 1</td><td>ghi: $x$ = 1</td></tr></table>
          <p>$\hl{x = 1}$</p>
        focus: [1, "2.2", "2.2", 3]
        say: "Đáp án câu một, ta lần từng bước. A đọc 0 và cộng, rồi B đọc x khi A chưa ghi nên cũng được 0. Sau đó A ghi 1, B cộng và cũng ghi 1. Vậy x cuối chỉ bằng 1, mất một lần cộng của A."
      - show: |
          <p>② A A A B B B: A xong cả ba bước ($x$ = 1), rồi B mới đọc 1, cộng thành 2, ghi:</p>
          $$x = 1 + 1 = \hl{2}$$
        focus: [1, 2]
        say: "Câu hai, A chạy xong cả ba bước rồi B mới đọc được 1, nên x bằng 2. Đây chính là thứ tự mà vùng găng muốn bảo đảm."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">x++ = đọc, cộng, ghi</span><span class="a">→</span>
          <span class="n">luồng khác chen giữa đọc và ghi</span><span class="a">→</span>
          <span class="n">mất cập nhật: tranh chấp</span><span class="a">→</span>
          <span class="n">vùng găng: loại trừ, tiến triển, chờ có hạn</span></div>
        say: "Tổng kết lại, lệnh tăng x là ba bước đọc, cộng, ghi. Nếu luồng khác chen vào giữa đọc và ghi, một lần cập nhật bị mất, đó là tranh chấp. Lời giải vùng găng phải bảo đảm loại trừ lẫn nhau, tiến triển, và chờ có giới hạn."
      - show: |
          <div class="box key"><b>Tư duy:</b> với mã đồng thời, phải lập luận về <b>mọi</b> thứ tự có thể — thử nghiệm chỉ thấy những thứ tự hay gặp.</div>
        say: "Điều cần mang theo, với mã đồng thời phải lập luận về mọi thứ tự có thể xảy ra, vì thử nghiệm chỉ thấy được những thứ tự hay gặp."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): công cụ để làm vùng găng đúng — <b>khoá</b> và bộ đếm đồng bộ, qua bài toán sản xuất–tiêu thụ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học các công cụ để làm vùng găng đúng, gồm khoá và bộ đếm đồng bộ, qua bài toán sản xuất và tiêu thụ. Hẹn gặp bạn ở bài tiếp theo."
