id: L01
course: OSY
series: "OSY · Hệ điều hành"
title: "Bài 1 — Tiến trình và luồng: trạng thái, fork, chuyển ngữ cảnh"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/osy.yaml L01; audit/verify_plan_curricula.py OSY:L01; R. Arpaci-Dusseau, A. Arpaci-Dusseau, Operating Systems: Three Easy Pieces, chương 4–5, 26"
assumes: [arith, power, dots]
# Quy ước: fork() (POSIX) chỉ hiện trên màn hình; lời đọc nói “lời gọi tạo tiến trình con” (probe p1: không cách viết nào của “fork” đạt 7/8).
#   Số tiến trình / số lần in do alg.fork_loop mô phỏng, không đếm tay.
objectives:
  - "Phân biệt chương trình, tiến trình, luồng"
  - "Vẽ sơ đồ trạng thái tiến trình"
  - "Đếm số tiến trình sau các lời gọi fork"
asr_reviewed:
  - {sentence: "Bắt đầu từ 1, nhân 2 được 2, nhân 2 nữa được 4, nhân 2 lần nữa được 8.", reason: "ASR chép “Bắt đầu từ một, nhần hai được hai, nhần hai nửa được bốn, nhần hai lần nữa được tám.” (0.789): lệch âm/thanh thuần Việt: nhân/nhần, nhân/nhần, nữa/nửa, nhân/nhần — NOT_VERIFIED bằng tai người"}
  - {sentence: "Trước vòng lặp có 1 tiến trình.", reason: "lặp/lập, tiến/tiếng: nhầm thanh và âm cuối của ASR ở câu 7 từ; “tiến trình” chép đúng ở các câu dài của L01; số 1 khớp — NOT_VERIFIED bằng tai người"}
  - {sentence: "Còn luồng thì dùng chung bộ nhớ trong một tiến trình.", reason: "còn/con, luồng/luôn, tiến/tiếng: nhầm thanh và âm cuối ng/n của ASR; “luồng” chép đúng ở các khung khác của L01 — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ba dòng mã, tám tiến trình"
    checks:
      - "alg.fork_loop(3, print_after=False)[0] == 8"
    steps:
      - show: |
          <div class="code"><div>for (int i = 0; i &lt; 3; i++)</div><div>    fork();</div></div>
          <p>Sau đoạn mã này có bao nhiêu tiến trình? Không phải 3, không phải 4 — mà là <b>8</b>.</p>
          <div class="box key">Hôm nay: tiến trình là gì, nó đi qua những trạng thái nào, và vì sao một vòng lặp nhỏ sinh ra nhiều tiến trình như vậy.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, vòng lặp ba lần này mỗi lần gọi một lời gọi tạo tiến trình con. Sau đoạn mã có bao nhiêu tiến trình? Không phải 3, không phải 4, mà là 8. Hôm nay ta học tiến trình là gì, nó đi qua những trạng thái nào, và vì sao một vòng lặp nhỏ sinh ra nhiều tiến trình như vậy."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đọc vòng lặp, nhân đôi liên tiếp"
    checks:
      - "[i for i in range(3)] == [0, 1, 2] and len(range(3)) == 3"
      - "[2 ** k for k in (1, 2, 3)] == [2, 4, 8] and 1 * 2 * 2 * 2 == 8"
    steps:
      - show: |
          <div class="code"><div>for (int i = 0; i &lt; 3; i++)   // i++: tăng i thêm 1 sau mỗi lượt</div><div>    fork();</div></div>
          <table class="t"><tr><th>lượt</th><th>giá trị i</th><th>điều kiện i &lt; 3</th></tr>
          <tr><td>1</td><td>0</td><td>đúng, chạy thân vòng</td></tr>
          <tr><td>2</td><td>1</td><td>đúng, chạy thân vòng</td></tr>
          <tr><td>3</td><td>2</td><td>đúng, chạy thân vòng</td></tr>
          <tr><td>hết</td><td>3</td><td>sai, thoát vòng</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4", "2.5"]
        say: "Trước hết, ta ôn cách đọc vòng lặp ở đầu bài. Biến đếm i bắt đầu từ 0, được tăng thêm 1 sau mỗi lượt, và thân vòng chạy chừng nào i còn nhỏ hơn 3. Lượt đầu i bằng 0, điều kiện đúng nên chạy thân vòng. Lượt hai i bằng 1, vẫn chạy. Lượt ba i bằng 2, vẫn chạy. Khi i tăng lên 3, điều kiện sai nên vòng lặp kết thúc, tổng cộng đúng 3 lượt."
      - show: |
          <p>Nhân đôi liên tiếp: bắt đầu từ 1, mỗi lần nhân 2.</p>
          $$1 \times 2 = 2, \quad 2 \times 2 = 4, \quad 4 \times 2 = 8 = 2^3$$
          <p class="note">$2^3$ đọc là “2 mũ 3”: số 2 nhân với chính nó 3 lần.</p>
        focus: [1, 2, 3]
        say: "Phép tính thứ hai là nhân đôi liên tiếp. Bắt đầu từ 1, nhân 2 được 2, nhân 2 nữa được 4, nhân 2 lần nữa được 8. Viết gọn là 2 mũ 3, tức số 2 nhân với chính nó 3 lần."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: chương trình, tiến trình, luồng"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>là gì</th></tr>
          <tr><td><b>chương trình</b></td><td>tệp mã nằm trên đĩa — chưa chạy</td></tr>
          <tr><td><b>tiến trình</b></td><td>chương trình <b>đang chạy</b>: có không gian địa chỉ riêng, thanh ghi, tệp đang mở</td></tr>
          <tr><td><b>luồng</b></td><td>một dòng thực thi bên trong tiến trình: thanh ghi và ngăn xếp riêng, nhưng <b>dùng chung</b> bộ nhớ với các luồng khác cùng tiến trình</td></tr></table>
          <p class="note">Không gian địa chỉ: vùng nhớ tiến trình thấy như của riêng mình. Thanh ghi: ô nhớ nhỏ ngay trong bộ xử lý. Ngăn xếp: vùng nhớ giữ biến cục bộ và chỗ quay về của lời gọi hàm.</p>
        focus: [0, "1.2", "1.3", "1.4", 2, 2]
        say: "Ba khái niệm cần phân biệt. Chương trình là tệp mã nằm trên đĩa, chưa chạy. Tiến trình là chương trình đang chạy, có không gian địa chỉ riêng, thanh ghi riêng, và các tệp đang mở. Luồng là một dòng thực thi bên trong tiến trình, có thanh ghi và ngăn xếp riêng, nhưng dùng chung bộ nhớ với các luồng khác của cùng tiến trình. Ở đây, không gian địa chỉ là vùng nhớ mà tiến trình thấy như của riêng mình, còn thanh ghi là các ô nhớ nhỏ ngay trong bộ xử lý. Ngăn xếp là vùng nhớ giữ các biến cục bộ và chỗ quay về của mỗi lời gọi hàm."

  # ───────────────────────── 3. TRẠNG THÁI ─────────────────────────
  - id: states
    kind: concept
    title: "Năm trạng thái của tiến trình"
    steps:
      - show: |
          <div class="chain"><span class="n">mới</span><span class="a">→</span><span class="n">sẵn sàng</span><span class="a">⇄</span>
          <span class="n">đang chạy</span><span class="a">→</span><span class="n">kết thúc</span></div>
          <ul><li>sẵn sàng → đang chạy: bộ lập lịch chọn nó; đang chạy → sẵn sàng: hết lượt (ngắt định thời).</li>
          <li>đang chạy → <b>chờ</b>: đợi vào/ra (đọc đĩa, gõ phím); chờ → sẵn sàng: vào/ra xong.</li></ul>
          <p class="note">Bộ lập lịch: phần của nhân chọn tiến trình chạy tiếp. Ngắt định thời: tín hiệu đồng hồ phần cứng gửi định kỳ để nhân lấy lại bộ xử lý.</p>
        focus: [1, "2.1", 3, "2.2"]
        say: "Một tiến trình đi qua năm trạng thái, mới, sẵn sàng, đang chạy, chờ, và kết thúc. Từ sẵn sàng sang đang chạy khi bộ lập lịch chọn nó, và quay lại sẵn sàng khi hết lượt do ngắt định thời. Bộ lập lịch là phần của nhân chọn tiến trình chạy tiếp, còn ngắt định thời là tín hiệu đồng hồ phần cứng gửi định kỳ để nhân lấy lại bộ xử lý. Từ đang chạy sang chờ khi nó đợi vào ra, như đọc đĩa hay chờ phím bấm, rồi về sẵn sàng khi vào ra xong."
      - show: |
          <div class="box key">Một lõi chỉ có <b>một</b> tiến trình ở trạng thái đang chạy tại mỗi lúc. Chuyển ngữ cảnh (bài 0) = lưu thanh ghi của tiến trình cũ, nạp của tiến trình mới.</div>
        say: "Một lõi chỉ có một tiến trình đang chạy tại mỗi lúc. Như ở bài 0, chuyển ngữ cảnh là lưu thanh ghi của tiến trình cũ và nạp thanh ghi của tiến trình mới."

  # ───────────────────────── 4. FORK ─────────────────────────
  - id: fork
    kind: concept
    title: "fork(): tạo bản sao của tiến trình"
    steps:
      - show: |
          <p><code>fork()</code> tạo tiến trình <b>con</b> là bản sao của tiến trình <b>cha</b>: cùng mã, bản sao bộ nhớ, và cả hai chạy tiếp từ <b>ngay sau</b> lời gọi.</p>
          <p>Giá trị trả về khác nhau: con nhận 0, cha nhận số hiệu của con. Nhờ đó hai bên rẽ nhánh làm việc khác nhau.</p>
          <div class="code"><div>int x = 5;</div><div>if (fork() == 0) { x = x + 1; }   // chỉ con chạy dòng này</div><div>// cha vẫn thấy x = 5, con thấy x = 6: hai bản bộ nhớ riêng</div></div>
        focus: [1, 2, "3.1", "3.2", "3.3"]
        say: "Lời gọi tạo tiến trình con sinh ra một bản sao của tiến trình cha, cùng mã và có bản sao bộ nhớ, rồi cả hai chạy tiếp từ ngay sau lời gọi. Giá trị trả về khác nhau, con nhận 0 còn cha nhận số hiệu của con, nhờ đó hai bên rẽ nhánh làm việc khác nhau. Ví dụ x bằng 5. Chỉ tiến trình con chạy lệnh tăng x thêm 1. Cha vẫn thấy x bằng 5, con thấy x bằng 6, vì hai bên có hai bản bộ nhớ riêng."

  # ───────────────────────── 4b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cây tiến trình: mỗi vòng, mọi nút đều tách đôi"
    steps:
      - show: |
          <div><svg width="1500" height="560" viewBox="0 0 1500 560"><line x1="172" y1="242" x2="528" y2="138" stroke="#64748b" stroke-width="3"/><line x1="172" y1="242" x2="528" y2="346" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7"/><line x1="572" y1="138" x2="928" y2="86" stroke="#64748b" stroke-width="3"/><line x1="572" y1="138" x2="928" y2="190" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7"/><line x1="572" y1="346" x2="928" y2="294" stroke="#64748b" stroke-width="3"/><line x1="572" y1="346" x2="928" y2="398" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7"/><line x1="972" y1="86" x2="1328" y2="60" stroke="#64748b" stroke-width="3"/><line x1="972" y1="86" x2="1328" y2="112" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7"/><line x1="972" y1="190" x2="1328" y2="164" stroke="#64748b" stroke-width="3"/><line x1="972" y1="190" x2="1328" y2="216" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7"/><line x1="972" y1="294" x2="1328" y2="268" stroke="#64748b" stroke-width="3"/><line x1="972" y1="294" x2="1328" y2="320" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7"/><line x1="972" y1="398" x2="1328" y2="372" stroke="#64748b" stroke-width="3"/><line x1="972" y1="398" x2="1328" y2="424" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7"/><circle cx="150" cy="242" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="550" cy="138" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="550" cy="346" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="950" cy="86" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="950" cy="190" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="950" cy="294" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="950" cy="398" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="1350" cy="60" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="1350" cy="112" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="1350" cy="164" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="1350" cy="216" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="1350" cy="268" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="1350" cy="320" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="1350" cy="372" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="1350" cy="424" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="150" y="486" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">trước: 1</text><text x="550" y="486" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">sau vòng 1: 2</text><text x="950" y="486" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">sau vòng 2: 4</text><text x="1350" y="486" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">sau vòng 3: 8</text><line x1="420" y1="530" x2="480" y2="530" stroke="#64748b" stroke-width="3"/><text x="490" y="538" font-size="24" fill="#1f2937">cha chạy tiếp</text><line x1="760" y1="530" x2="820" y2="530" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 7"/><text x="830" y="538" font-size="24" fill="#dc2626">con mới, chạy tiếp từ sau lời gọi</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này vẽ các tiến trình như các chấm tròn, mỗi cột là một thời điểm. Ở mỗi vòng, mỗi chấm đi tiếp theo hai đường. Đường xám là chính tiến trình cũ chạy tiếp, đường đỏ đứt nét là tiến trình con vừa sinh ra. Vì con chạy tiếp từ ngay sau lời gọi, nó cũng đi hết các vòng còn lại, nên số chấm cứ thế nhân đôi, 1, 2, 4, rồi 8."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Đếm tiến trình sau vòng lặp"
    checks:
      - "[alg.fork_loop(k, print_after=False)[0] for k in (1, 2, 3)] == [2, 4, 8]"
      - "alg.fork_loop(3, print_after=False)[0] == 2 ** 3"
    steps:
      - show: |
          <p><b>Bước 1.</b> Trước vòng lặp: 1 tiến trình.</p>
          $$\text{số tiến trình} = \hl{1}$$
        focus: [0, 1]
        say: "Đếm từng vòng. Trước vòng lặp có 1 tiến trình."
      - show: |
          <p><b>Bước 2.</b> Vòng 1: mỗi tiến trình đang có gọi một lần, mỗi lần tách đôi.</p>
          $$1 \times 2 = \hl{2}$$
        focus: [1]
        say: "Ở vòng 1, tiến trình đó gọi một lần và tách đôi, được 2."
      - show: |
          <p><b>Bước 3.</b> Vòng 2: cả 2 tiến trình đều chạy tiếp vòng lặp và tách đôi.</p>
          $$2 \times 2 = \hl{4}$$
        focus: [1]
        say: "Ở vòng 2, cả 2 tiến trình đều chạy tiếp vòng lặp, vì con chạy tiếp từ sau lời gọi với cùng giá trị i, nên tách đôi thành 4."
      - show: |
          <p><b>Bước 4.</b> Vòng 3, rồi tổng quát $n$ vòng, kể cả tiến trình gốc:</p>
          $$4 \times 2 = \hl{8} = 2^3, \qquad n \text{ vòng} \to 2^n$$
        focus: [2]
        say: "Vòng 3 được 8, và tổng quát n vòng cho 2 mũ n tiến trình, kể cả tiến trình gốc."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "alg.fork_loop(2, print_after=False)[0] == 4"
      - "1 + 1 + 2 + 4 == 8 == alg.fork_loop(3, print_after=False)[0]"
    steps:
      - show: |
          <p><b>Kiểm bằng đường khác:</b> không nhân đôi, mà đếm số con <b>mới sinh</b> ở mỗi vòng rồi cộng.</p>
          <table class="t"><tr><th>vòng</th><th>số tiến trình gọi tạo con</th><th>con mới sinh</th></tr>
          <tr><td>1</td><td>1</td><td>1</td></tr>
          <tr><td>2</td><td>2</td><td>2</td></tr>
          <tr><td>3</td><td>4</td><td>4</td></tr></table>
          <p>Gốc + con mới: $1 + 1 + 2 + 4 = \hl{8}$ ✓ khớp $2^3$.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Kiểm lại bằng đường khác, ta không nhân đôi nữa mà đếm số tiến trình con mới sinh ở mỗi vòng. Ở vòng 1, chỉ 1 tiến trình gọi, nên sinh 1 con. Ở vòng 2, có 2 tiến trình gọi, nên sinh 2 con. Ở vòng 3, có 4 tiến trình gọi, nên sinh 4 con. Cộng tiến trình gốc với các con mới, 1 cộng 1 cộng 2 cộng 4 bằng 8, khớp với 2 mũ 3."
      - show: |
          <ol><li>Vẽ cây: mỗi lời gọi đổi một nút lá thành hai nút. Đếm lá = số tiến trình.</li>
          <li>Thử $n = 1$: phải ra 2 (cha và một con).</li>
          <li>Hỏi: tiến trình con bắt đầu chạy từ dòng nào, với biến đếm bằng bao nhiêu?</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, vẽ cây, mỗi lời gọi đổi một nút lá thành hai nút, nên số lá là số tiến trình. Hai, thử với một vòng, phải ra 2, gồm cha và một con. Ba, luôn hỏi tiến trình con bắt đầu chạy từ dòng nào, với biến đếm bằng bao nhiêu, vì nó chạy tiếp ngay sau lời gọi."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "5 lỗi hay gặp, kể cả của người đã đi làm"
    checks:
      - "1 + 10 == 11 and alg.fork_loop(10, print_after=False)[0] == 2 ** 10 == 1024"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ con chạy lại từ đầu chương trình <b class="red">(sai)</b>
          <br><span class="note">Con chạy tiếp từ ngay sau lời gọi, với mọi biến giống hệt cha tại lúc đó.</span></div>
        say: "Lỗi thứ nhất, nghĩ tiến trình con chạy lại từ đầu chương trình. Con chạy tiếp từ ngay sau lời gọi, với mọi biến giống hệt cha tại lúc đó."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ con sửa biến thì cha thấy <b class="red">(sai)</b>
          <br><span class="note">Tiến trình con có không gian địa chỉ riêng. Chỉ <b>luồng</b> mới dùng chung bộ nhớ.</span></div>
        say: "Lỗi thứ hai, nghĩ tiến trình con sửa biến thì cha cũng thấy. Tiến trình con có không gian địa chỉ riêng, chỉ các luồng trong cùng tiến trình mới dùng chung bộ nhớ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — của người đã đi làm.</b> Vòng lặp tạo con mà quên cho con thoát <b class="red">(bùng nổ)</b></div>
          <table class="t"><tr><th>máy chủ muốn 10 tiến trình con phục vụ</th><th>tổng số tiến trình</th></tr>
          <tr><td>con làm việc rồi thoát ngay, chỉ cha lặp tiếp</td><td>$1 + 10 = 11$</td></tr>
          <tr><td>quên lệnh thoát: con cũng chạy tiếp vòng lặp</td><td>$2^{10} = \hl{1024}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là viết vòng lặp tạo tiến trình con mà quên cho con thoát. Một máy chủ muốn 10 tiến trình con phục vụ, nếu mỗi con làm việc rồi thoát ngay thì tổng cộng chỉ có 11 tiến trình, kể cả cha. Nếu quên lệnh thoát, con cũng chạy tiếp vòng lặp và cũng sinh con, nên số tiến trình nhân đôi 10 lần, thành 1024, đủ làm máy chậm hẳn đi."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ luồng an toàn hơn tiến trình vì nhẹ hơn <b class="red">(ngược lại)</b>
          <br><span class="note">Dùng chung bộ nhớ nên luồng nhanh hơn khi trao đổi dữ liệu, nhưng một luồng ghi sai làm hỏng cả tiến trình.</span></div>
        say: "Lỗi thứ tư, nghĩ luồng an toàn hơn tiến trình vì nhẹ hơn. Dùng chung bộ nhớ nên luồng trao đổi dữ liệu nhanh hơn, nhưng một luồng ghi sai là làm hỏng cả tiến trình."
      - show: |
          <div class="box warn"><b>Lỗi 5.</b> Nhầm “chờ” với “sẵn sàng” <b class="red">(sai)</b>
          <br><span class="note">Sẵn sàng = chỉ thiếu bộ xử lý. Chờ = đợi sự kiện khác (vào/ra); có bộ xử lý rảnh cũng chưa chạy được.</span></div>
        say: "Lỗi thứ năm, nhầm trạng thái chờ với sẵn sàng. Sẵn sàng nghĩa là chỉ thiếu bộ xử lý, còn chờ nghĩa là đang đợi một sự kiện khác như vào ra, có bộ xử lý rảnh cũng chưa chạy được."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.fork_loop(2) == (4, 6)"
      - "1 * 2 * 2 == 2 ** 2 == 4 and 2 + 4 == 6"
      - "(lambda f: f(f, [0], 2))(lambda f, ps, n: sum(ps) if n == 0 else f(f, [b + 1 for b in ps for _ in (0, 1)], n - 1)) == 4 * 2 == 8"
    steps:
      - show: |
          <div class="code"><div>for (int i = 0; i &lt; 2; i++) {</div><div>    fork();</div><div>    write(1, "x", 1);</div><div>}</div></div>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cuối cùng có bao nhiêu tiến trình?</td></tr>
          <tr><td>2</td><td>Chữ x được in bao nhiêu lần?</td></tr></table>
        focus: [0, 0, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Vòng lặp hai lần, mỗi lần gọi tạo tiến trình con rồi ghi thẳng chữ x ra màn hình, không qua bộ đệm. Câu một, cuối cùng có bao nhiêu tiến trình? Câu hai, chữ x được in bao nhiêu lần? Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p>① Vòng lặp chạy 2 lượt, mỗi lượt số tiến trình nhân đôi:</p>
          $$1 \times 2 \times 2 = 2^2 = \hl{4} \text{ tiến trình}$$
        focus: [1, 2]
        say: "Đáp án câu một, vòng lặp chạy 2 lượt, và mỗi lượt số tiến trình nhân đôi. Từ 1 thành 2 rồi thành 4, tức 2 mũ 2 bằng 4 tiến trình."
      - show: |
          <table class="t"><tr><th>vòng</th><th>số tiến trình sau lời gọi</th><th>lần in x</th></tr>
          <tr><td>1</td><td>2</td><td>2</td></tr>
          <tr><td>2</td><td>4</td><td>4</td></tr>
          <tr><td>tổng</td><td></td><td>$2 + 4 = \hl{6}$</td></tr></table>
          <p class="note">Đề dùng <code>write</code> vì <code>printf("x")</code> giữ chữ trong bộ đệm; fork sao chép cả bộ đệm, nên bản printf thường in tới $4 \times 2 = 8$ chữ.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Câu hai, lệnh ghi nằm sau lời gọi, nên mọi tiến trình đang có ở vòng đó đều ghi. Ở vòng 1 có 2 tiến trình cùng ghi nên được 2 lần. Ở vòng 2 có 4 tiến trình cùng ghi nên được 4 lần. Tổng cộng 6 lần. Đề dùng lời gọi ghi thẳng, vì lệnh in thường giữ chữ trong bộ đệm, mà tiến trình con sao chép cả bộ đệm, nên có thể in tới 8 chữ."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tiến trình = chương trình đang chạy</span><span class="a">→</span>
          <span class="n">mới, sẵn sàng, chạy, chờ, kết thúc</span><span class="a">→</span>
          <span class="n">fork: bản sao, chạy tiếp sau lời gọi</span><span class="a">→</span>
          <span class="n">luồng: dùng chung bộ nhớ</span></div>
        say: "Tổng kết lại, tiến trình là chương trình đang chạy, đi qua các trạng thái mới, sẵn sàng, đang chạy, chờ và kết thúc. Lời gọi tạo tiến trình con sinh bản sao chạy tiếp từ sau lời gọi. Còn luồng thì dùng chung bộ nhớ trong một tiến trình."
      - show: |
          <div class="box key"><b>Tư duy:</b> muốn hiểu mã đồng thời, hãy hỏi “ai đang chạy dòng này, với bản bộ nhớ nào?”.</div>
        say: "Điều cần mang theo, muốn hiểu mã đồng thời, hãy luôn hỏi ai đang chạy dòng này, và với bản bộ nhớ nào."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): khi nhiều tiến trình cùng <b>sẵn sàng</b>, hệ điều hành chọn ai chạy trước — <b>lập lịch CPU</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta xem khi nhiều tiến trình cùng sẵn sàng, hệ điều hành chọn ai chạy trước, gọi là lập lịch. Hẹn gặp bạn ở bài tiếp theo."
