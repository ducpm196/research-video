rate: "-5%"
depth: full
source: "curriculum/osy.yaml L05; E. Dijkstra (1965), semaphore; R. Arpaci-Dusseau, A. Arpaci-Dusseau, Operating Systems: Three Easy Pieces, chương 28, 31"
assumes: [arith, dots]
# Quy ước: khoá (mutex) có hai thao tác lấy / trả; semaphore đọc “xe-ma-pho” (lexicon OSY, probe p1 7/8), thao tác wait / signal chỉ
#   ghi trên màn hình, lời đọc nói “chờ” / “báo”. “mutex” không đọc (probe p1: mọi cách viết ≤ 1/8) — lời đọc nói “khoá”.
#   Mọi kết luận bế tắc / không bế tắc do alg.prodcons duyệt MỌI cách xen kẽ, không chạy thử ngẫu nhiên.
objectives:
  - "Dùng khoá bảo vệ vùng găng"
  - "Giải bài sản xuất–tiêu thụ với hai semaphore đếm và một khoá"
  - "Nhận ra bế tắc do sai thứ tự chờ"
asr_reviewed:
