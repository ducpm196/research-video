  - {sentence: "Bảng nhắc lại hai kết quả đó của máy với bản đảo thứ tự, quầy 5 ô.", reason: "ASR chép “Bạn nhắc lại hai kết quả đó của máy với bảng đạo thứ tự, quầy 5 ohm.” (0.765): “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: bảng/bạn, bản đảo/bảng đạo — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cách một, cộng hai bộ đếm ở mỗi dòng đã dò, 5 với 0, 4 với 1, cho tới 0 với 5, lúc nào cũng được 5, đúng bằng số ô.", reason: "ASR chép “Cách 1, cộng 2 bộ đếm ở mũi dòng đã giò 5 với 0, 4 với 1, cho tới 0 với 5, lúc nào cũng được 5, đúng bằng số ố.” (0.935): “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: mỗi/mũi — NOT_VERIFIED bằng tai người"}
  - {sentence: "Semaphore đếm số vé và bắt chờ khi hết vé.", reason: "Semaphore đọc “Xe-ma-pho” (lexicon_vi.OSY.yaml); ASR chép “Xe MAFO” — đủ ba âm tiết xe, ma, pho, chỉ khác cách viết — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bếp và người phục vụ"
    steps:
      - show: |
          <p>Bếp đặt món lên quầy 5 chỗ, người phục vụ lấy món đi. Quầy đầy thì bếp phải dừng; quầy trống thì người phục vụ phải đợi; và hai người không được cùng thò tay vào một chỗ.</p>
          <div class="box key">Ở bài 4 ta thấy hai luồng cùng sửa dữ liệu chung thì mất cập nhật. Hôm nay: <b>khoá</b> và <b>semaphore</b> — công cụ để phối hợp đúng.</div>
        focus: [1, 1, 2, 2]
        say: "Chào bạn, bếp đặt món lên một quầy 5 chỗ, người phục vụ lấy món đi. Quầy đầy thì bếp phải dừng, quầy trống thì người phục vụ phải đợi, và hai người không được cùng thò tay vào một chỗ. Ở bài 4 ta thấy hai luồng cùng sửa dữ liệu chung thì mất cập nhật. Hôm nay ta học khoá và semaphore, hai công cụ để phối hợp các luồng cho đúng."

  # ───────────────────────── 2. KHOÁ ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: mất cập nhật, và đếm vé"
    checks:
      - "5 + 1 == 6 and 5 + 1 + 1 == 7"
      - "(lambda v: v == [3, 2, 1, 0])([3 - k for k in range(4)])"
      - "0 + 1 == 1 and 1 - 1 == 0"
    steps:
      - show: |
          <table class="t"><tr><th>lúc</th><th>luồng A</th><th>luồng B</th><th>x trong bộ nhớ</th></tr>
          <tr><td>1</td><td>đọc x = 5</td><td></td><td>5</td></tr>
          <tr><td>2</td><td></td><td>đọc x = 5</td><td>5</td></tr>
          <tr><td>3</td><td>ghi 5 + 1 = 6</td><td></td><td>6</td></tr>
          <tr><td>4</td><td></td><td>ghi 5 + 1 = 6</td><td>$\hl{6}$, đúng ra phải là 7</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Trước hết, ôn lại điều ta đã thấy ở bài 4, lệnh tăng x thêm 1 thực ra gồm ba bước là đọc, cộng và ghi. Lúc đầu x bằng 5, luồng A đọc được 5. Ngay sau đó luồng B cũng đọc được 5, vì A chưa kịp ghi. Luồng A ghi 5 cộng 1 bằng 6. Luồng B cũng ghi 6, nên một lần cộng bị mất, đúng ra x phải bằng 7."
      - show: |
          <table class="t"><tr><th>sự kiện ở bãi xe 3 chỗ</th><th>số thẻ còn lại</th></tr>
          <tr><td>lúc đầu</td><td>3</td></tr>
          <tr><td>xe 1, xe 2, xe 3 lần lượt vào, mỗi xe lấy 1 thẻ</td><td>2, 1, 0</td></tr>
          <tr><td>xe 4 đến, còn 0 thẻ</td><td>đứng đợi ở cổng</td></tr>
          <tr><td>xe 1 ra, trả thẻ: 0 + 1</td><td>1, xe 4 lấy thẻ vào: 1 − 1 = 0</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Phép tính thứ hai ta cần chỉ là đếm lên và đếm xuống, như thẻ gửi xe. Một bãi xe có 3 chỗ, cổng giữ 3 thẻ. Xe 1, xe 2, xe 3 lần lượt vào, mỗi xe lấy 1 thẻ, số thẻ còn 2, rồi 1, rồi 0. Xe 4 đến khi đã hết thẻ, nên phải đứng đợi ở cổng. Khi xe 1 ra và trả thẻ, số thẻ thành 1, xe 4 lấy thẻ đó đi vào, số thẻ lại về 0."

  - id: sym
    kind: symbol
    title: "Giải mã: khoá (mutex)"
    steps:
      - show: |
          <div class="code"><div>lấy(khoá);      // có người giữ thì đứng đợi</div><div>x = x + 1;      // vùng găng</div><div>trả(khoá);</div></div>
          <p>Chỉ một luồng giữ khoá tại mỗi lúc. Phần cứng có lệnh <b>kiểm-và-đặt</b> làm trọn “đọc cờ rồi đặt cờ” trong một bước không chen ngang được, nên tự lấy khoá không bị tranh chấp như cờ thường ở bài 4.</p>
        focus: ["1.1", "1.2", "1.3", 2, 2]
        say: "Khoá có hai thao tác là lấy khoá và trả khoá. Lấy khoá, nếu có người đang giữ thì đứng đợi. Vùng găng nằm giữa lấy và trả. Chỉ một luồng giữ khoá tại mỗi lúc. Phần cứng có lệnh kiểm và đặt, làm trọn việc đọc cờ rồi đặt cờ trong một bước không ai chen ngang được, nên việc lấy khoá không bị tranh chấp như dùng cờ thường ở bài 4."

  # ───────────────────────── 3. SEMAPHORE ─────────────────────────
  - id: sem
    kind: symbol
    title: "Giải mã: semaphore đếm"
    steps:
      - show: |
          <p><b>Semaphore</b> $s$ là một số nguyên không âm với hai thao tác không chen ngang được:</p>
          <ul><li><code>wait(s)</code>: nếu $s$ &gt; 0 thì giảm 1 và đi tiếp; nếu $s$ = 0 thì đứng đợi.</li>
          <li><code>signal(s)</code>: tăng $s$ thêm 1 (đánh thức một luồng đang đợi, nếu có).</li></ul>
          <p class="note">$s$ = số “vé” còn lại. Khoá chính là semaphore bắt đầu bằng 1.</p>
        focus: [1, "2.1", "2.2", 3]
        say: "Semaphore là một số nguyên không âm với hai thao tác không chen ngang được. Thao tác chờ, nếu số đó lớn hơn 0 thì giảm 1 và đi tiếp, nếu bằng 0 thì đứng đợi. Thao tác báo, tăng số đó thêm 1, và đánh thức một luồng đang đợi nếu có. Hãy hình dung nó là số vé còn lại, và khoá chính là một semaphore bắt đầu bằng 1."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Quầy 5 chỗ, hai bộ đếm và một cánh cửa"
    checks:
      - "3 + 2 == 5 and 5 + 0 == 5"
    steps:
      - show: |
          <div><svg width="1400" height="360" viewBox="0 0 1400 360"><defs><marker id="arQ5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="40" y="130" width="200" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="140" y="190" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">bếp</text><rect x="1160" y="130" width="200" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1260" y="190" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">phục vụ</text><rect x="400" y="100" width="630" height="160" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="12 8"/><text x="715" y="85" font-size="24" text-anchor="middle" fill="#b45309">khoá: mỗi lúc chỉ 1 người chạm quầy</text><rect x="420" y="120" width="110" height="120" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="475" y="190" font-size="26" text-anchor="middle" fill="#1f2937">món</text><rect x="540" y="120" width="110" height="120" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="595" y="190" font-size="26" text-anchor="middle" fill="#1f2937">món</text><rect x="660" y="120" width="110" height="120" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="715" y="190" font-size="26" text-anchor="middle" fill="#1f2937">món</text><rect x="780" y="120" width="110" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><rect x="900" y="120" width="110" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><line x1="245" y1="180" x2="395" y2="180" stroke="#1f2937" stroke-width="4" marker-end="url(#arQ5a)"/><line x1="1035" y1="180" x2="1155" y2="180" stroke="#1f2937" stroke-width="4" marker-end="url(#arQ5a)"/><text x="140" y="300" font-size="26" text-anchor="middle" fill="#1f2937">đặt món</text><text x="1260" y="300" font-size="26" text-anchor="middle" fill="#1f2937">lấy món</text><text x="715" y="310" font-size="26" text-anchor="middle" fill="#1f2937">trống = 2, đầy = 3</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này vẽ đúng chiếc quầy 5 chỗ ở đầu bài, đang có 3 món, còn 2 chỗ trống. Bộ đếm trống cho biết bếp còn được đặt mấy món, bộ đếm đầy cho biết người phục vụ còn lấy được mấy món. Khung vàng nét đứt là khoá, mỗi lúc chỉ một người được thò tay vào quầy. Món đi một chiều, từ bếp vào quầy rồi từ quầy ra người phục vụ."
      - clear: true
        show: |
          <div><svg width="1400" height="360" viewBox="0 0 1400 360"><defs><marker id="arQ5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="40" y="130" width="200" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="140" y="190" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">bếp</text><rect x="1160" y="130" width="200" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1260" y="190" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">phục vụ</text><rect x="400" y="100" width="630" height="160" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="12 8"/><text x="715" y="85" font-size="24" text-anchor="middle" fill="#b45309">khoá: mỗi lúc chỉ 1 người chạm quầy</text><rect x="420" y="120" width="110" height="120" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="475" y="190" font-size="26" text-anchor="middle" fill="#1f2937">món</text><rect x="540" y="120" width="110" height="120" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="595" y="190" font-size="26" text-anchor="middle" fill="#1f2937">món</text><rect x="660" y="120" width="110" height="120" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="715" y="190" font-size="26" text-anchor="middle" fill="#1f2937">món</text><rect x="780" y="120" width="110" height="120" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="835" y="190" font-size="26" text-anchor="middle" fill="#1f2937">món</text><rect x="900" y="120" width="110" height="120" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="955" y="190" font-size="26" text-anchor="middle" fill="#1f2937">món</text><line x1="245" y1="180" x2="395" y2="180" stroke="#1f2937" stroke-width="4" marker-end="url(#arQ5b)"/><line x1="1035" y1="180" x2="1155" y2="180" stroke="#1f2937" stroke-width="4" marker-end="url(#arQ5b)"/><text x="140" y="300" font-size="26" text-anchor="middle" fill="#b91c1c">bếp đứng đợi</text><text x="1260" y="300" font-size="26" text-anchor="middle" fill="#1f2937">vẫn lấy được</text><text x="715" y="310" font-size="26" text-anchor="middle" fill="#1f2937">trống = 0, đầy = 5</text></svg></div>
        focus: [1, 1, 1]
        say: "Khi quầy đã đủ 5 món, bộ đếm trống bằng 0, nên bếp phải đứng đợi ở ngoài khung khoá, không giữ khoá. Người phục vụ vẫn vào được quầy để lấy món, vì bộ đếm đầy đang bằng 5. Mỗi lần lấy xong một món, một chỗ trống mới xuất hiện và bếp được đi tiếp."

  - id: example
    kind: example
    title: "Sản xuất–tiêu thụ, bộ đệm 5 ô"
    checks:
      - "alg.prodcons(5, 7) == {'deadlock': False, 'min_items': 0, 'max_items': 5, 'both_inside': False}"
      - "5 - 1 == 4 and 0 + 1 == 1"
      - "[4 - k for k in range(1, 5)] == [3, 2, 1, 0] and [1 + k for k in range(1, 5)] == [2, 3, 4, 5]"
      - "5 - 1 == 4 and 0 + 1 == 1 and 1 - 1 == 0 and 4 + 1 == 5"
    steps:
      - show: |
          <p>Ba công cụ: <b>trống</b> = 5 (số ô trống), <b>đầy</b> = 0 (số ô có món), <b>khoá</b> = 1.</p>
          <div class="row"><div class="col"><b>sản xuất</b><div class="code"><div>wait(trống)</div><div>lấy(khoá)</div><div>đặt món</div><div>trả(khoá)</div><div>signal(đầy)</div></div></div>
          <div class="col"><b>tiêu thụ</b><div class="code"><div>wait(đầy)</div><div>lấy(khoá)</div><div>lấy món</div><div>trả(khoá)</div><div>signal(trống)</div></div></div></div>
        focus: [1, "2.1", "2.2", "2.1", 2]
        say: "Ta dùng ba công cụ, semaphore trống bắt đầu bằng 5, semaphore đầy bắt đầu bằng 0, và một khoá. Bên sản xuất chờ có ô trống, lấy khoá, đặt món, trả khoá, rồi báo có thêm một ô đầy. Bên tiêu thụ làm đối xứng, chờ có ô đầy, lấy khoá, lấy món, trả khoá, rồi báo có thêm một ô trống. Semaphore trống chặn bếp khi quầy đầy, semaphore đầy chặn người phục vụ khi quầy trống. Còn khoá bảo đảm không ai cùng sửa bộ đệm."
      - clear: true
        show: |
          <p><b>Bước 1</b> — bếp đặt món đầu tiên:</p>
          <table class="t"><tr><th>lệnh</th><th>trống</th><th>đầy</th><th>khoá</th></tr>
          <tr><td>lúc đầu</td><td>5</td><td>0</td><td>1</td></tr>
          <tr><td>wait(trống): 5 − 1</td><td>4</td><td>0</td><td>1</td></tr>
          <tr><td>lấy(khoá), đặt món, trả(khoá)</td><td>4</td><td>0</td><td>1 → 0 → 1</td></tr>
          <tr><td>signal(đầy): 0 + 1</td><td>4</td><td>$\hl{1}$</td><td>1</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bây giờ dò từng lệnh bằng số. Bước một, bếp đặt món đầu tiên, lúc đầu trống bằng 5, đầy bằng 0, khoá bằng 1. Lệnh chờ ô trống thấy 5 lớn hơn 0, nên giảm còn 4 và đi tiếp. Bếp lấy khoá, khoá về 0, đặt món, rồi trả khoá, khoá lại bằng 1. Lệnh báo ô đầy tăng đầy từ 0 lên 1."
      - clear: true
        show: |
          <p><b>Bước 2</b> — bếp đặt thêm 4 món, mỗi món lặp đúng Bước 1:</p>
          <table class="t"><tr><th>món thứ</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>trống</td><td>3</td><td>2</td><td>1</td><td>$\hl{0}$</td></tr>
          <tr><td>đầy</td><td>2</td><td>3</td><td>4</td><td>$\hl{5}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước hai, bếp đặt thêm 4 món, mỗi món lặp đúng các lệnh của bước một. Mỗi món làm trống giảm 1, từ 4 xuống 3, 2, 1 rồi 0. Đồng thời đầy tăng 1, từ 1 lên 2, 3, 4 rồi 5."
      - show: |
          <p><b>Bước 3</b> — bếp muốn đặt món thứ 6:</p>
          <table class="t"><tr><th>lệnh</th><th>trống</th><th>kết quả</th></tr>
          <tr><td>wait(trống)</td><td>0</td><td><b class="red">đứng đợi</b>, chưa lấy khoá</td></tr></table>
        focus: [1, "2.2"]
        say: "Bước ba, bếp muốn đặt món thứ 6, lệnh chờ ô trống thấy trống bằng 0. Bếp phải đứng đợi, và vì lệnh chờ này nằm trước lệnh lấy khoá, bếp đứng đợi mà không giữ khoá."
      - clear: true
        show: |
          <p><b>Bước 4</b> — người phục vụ lấy 1 món:</p>
          <table class="t"><tr><th>lệnh</th><th>trống</th><th>đầy</th></tr>
          <tr><td>wait(đầy): 5 − 1</td><td>0</td><td>4</td></tr>
          <tr><td>lấy(khoá), lấy món, trả(khoá)</td><td>0</td><td>4</td></tr>
          <tr><td>signal(trống): 0 + 1</td><td>1</td><td>4</td></tr>
          <tr><td>bếp được đi tiếp: trống 1 − 1, đặt món thứ 6, đầy 4 + 1</td><td>$\hl{0}$</td><td>$\hl{5}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước bốn, người phục vụ lấy một món. Lệnh chờ ô đầy giảm đầy từ 5 xuống 4. Người phục vụ lấy khoá, lấy món rồi trả khoá, khoá vẫn rảnh nên không ai phải đợi. Lệnh báo ô trống tăng trống từ 0 lên 1, và đánh thức bếp. Bếp giảm trống về 0, đặt món thứ 6, rồi tăng đầy trở lại 5."
      - clear: true
        show: |
          <p><b>Bước 5</b> — từ một lần chạy sang mọi lần chạy:</p>
          <div class="box key">Máy duyệt <b>mọi</b> cách xen kẽ (7 vòng mỗi bên): không bế tắc; số món luôn trong khoảng $\hl{0}$ đến $\hl{5}$; không lúc nào hai bên cùng ở bước đặt và lấy.</div>
        focus: [1, 2, 2]
        say: "Bước năm, một lần dò tay chỉ là một thứ tự chạy, nên ta cho máy làm phần còn lại. Máy đã duyệt mọi cách xen kẽ với 7 vòng mỗi bên. Không có bế tắc, số món luôn nằm trong khoảng 0 đến 5, và không lúc nào hai bên cùng ở bước đặt và bước lấy."

  # ───────────────────────── 5. ĐẢO THỨ TỰ ─────────────────────────
  - id: swap
    kind: concept
    title: "Đảo hai dòng wait — bế tắc"
    checks:
      - "alg.prodcons(5, 7, producer_swapped=True)['deadlock'] is True"
      - "alg.prodcons(5, 4, producer_swapped=True)['deadlock'] is False"
    steps:
      - show: |
          <p>Sửa bên sản xuất thành <code>lấy(khoá)</code> rồi mới <code>wait(trống)</code>:</p>
          <ol><li>Quầy đầy (trống = 0). Bếp lấy khoá, rồi đứng đợi ô trống — <b>vẫn giữ khoá</b>.</li>
          <li>Người phục vụ muốn lấy món phải lấy khoá → đợi bếp trả khoá.</li>
          <li>Hai bên chờ nhau mãi: <b class="red">bế tắc</b>. Máy tìm ra trạng thái đó khi chạy 7 vòng.</li></ol>
          <p class="note">Chỉ 4 vòng thì quầy chưa bao giờ đầy, máy không thấy bế tắc — lỗi ẩn đến khi tải cao.</p>
        focus: [1, "2.1", "2.2", "2.3", 3]
        say: "Bây giờ thử sửa bên sản xuất, lấy khoá trước rồi mới chờ ô trống. Khi quầy đầy, bếp lấy khoá rồi đứng đợi ô trống, mà vẫn giữ khoá. Người phục vụ muốn lấy món phải lấy khoá, nên đợi bếp trả khoá. Hai bên chờ nhau mãi, đó là bế tắc, và máy tìm ra đúng trạng thái này khi chạy 7 vòng. Nhưng chỉ chạy 4 vòng thì quầy chưa bao giờ đầy, máy không thấy bế tắc, nghĩa là lỗi nằm ẩn đến khi tải cao."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "alg.prodcons(2, 3)['deadlock'] is False"
      - "all(a + b == 5 for a, b in [(5, 0), (4, 1), (3, 2), (2, 3), (1, 4), (0, 5)])"
      - "6 - 1 == 5 and 5 - 5 == 0"
    steps:
      - show: |
          <ol><li>Luôn có trống + đầy + (số món đang được đặt hoặc lấy dở) = số ô.</li>
          <li>Không bao giờ chờ một semaphore <b>trong khi giữ khoá</b>, trừ khi chắc semaphore đó không chặn được.</li>
          <li>Mỗi lần lấy khoá phải có đúng một lần trả trên mọi nhánh, kể cả nhánh báo lỗi.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, tổng trống cộng đầy cộng số món đang đặt hoặc lấy dở luôn bằng số ô. Hai, không bao giờ chờ một semaphore trong khi đang giữ khoá, trừ khi chắc nó không chặn được, vì người khác cần khoá đó để giải phóng bạn. Ba, mỗi lần lấy khoá phải có đúng một lần trả trên mọi nhánh, kể cả nhánh báo lỗi."
      - show: |
          <p>Kiểm bốn bước vừa dò bằng <b>hai đường khác</b>:</p>
          <table class="t"><tr><th>cách kiểm</th><th>phép tính</th><th>khớp?</th></tr>
          <tr><td>cộng hai bộ đếm ở mỗi dòng đã dò (5 và 0, 4 và 1, …, 0 và 5)</td><td>luôn bằng 5</td><td>✓ đúng bằng số ô</td></tr>
          <tr><td>đếm thẳng số món: đặt xong 6, lấy xong 1</td><td>$6 - 1 = \hl{5}$</td><td>✓ bằng đầy = 5</td></tr>
          <tr><td>số ô trống = số ô − số món</td><td>$5 - 5 = \hl{0}$</td><td>✓ bằng trống = 0</td></tr></table>
        focus: [0, "2.2", "2.3", "2.4"]
        say: "Giờ kiểm bốn bước vừa dò bằng đường khác, vì đọc lại bảng thì không bắt được lỗi. Cách một, cộng hai bộ đếm ở mỗi dòng đã dò, 5 với 0, 4 với 1, cho tới 0 với 5, lúc nào cũng được 5, đúng bằng số ô. Cách hai, đếm thẳng số món, bếp đặt xong 6 món, người phục vụ lấy xong 1 món, còn 6 trừ 1 bằng 5 món, khớp với đầy bằng 5. Cuối cùng, số ô trống bằng 5 ô trừ 5 món, bằng 0, khớp với trống bằng 0."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đảo thứ tự hai lệnh chờ <b class="red">(bế tắc)</b>
          <br><span class="note">Chờ tài nguyên đếm (trống / đầy) <b>trước</b>, lấy khoá <b>sau</b>.</span></div>
        say: "Lỗi thứ nhất, đảo thứ tự hai lệnh chờ. Hãy chờ tài nguyên đếm như trống hay đầy trước, rồi mới lấy khoá."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên trả khoá trên nhánh lỗi <b class="red">(treo)</b>
          <br><span class="note">Một lệnh thoát sớm giữa vùng găng là mọi luồng khác đợi mãi. Dùng cấu trúc tự trả khoá của ngôn ngữ.</span></div>
        say: "Lỗi thứ hai, quên trả khoá trên nhánh lỗi. Chỉ một lệnh thoát sớm giữa vùng găng là mọi luồng khác phải đợi mãi, nên hãy dùng cấu trúc tự trả khoá của ngôn ngữ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Khoá quá rộng <b class="red">(chậm)</b>
          <br><span class="note">Giữ khoá cả lúc nấu món (việc dài, không chạm dữ liệu chung) làm mọi luồng xếp hàng — chỉ khoá đúng phần sửa bộ đệm.</span></div>
        say: "Lỗi thứ ba, khoá quá rộng. Giữ khoá cả lúc nấu món, một việc dài không chạm dữ liệu chung, làm mọi luồng phải xếp hàng, nên chỉ khoá đúng phần sửa bộ đệm."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin vào kiểm thử tải nhẹ <b class="red">(sai)</b>
          <br><span class="note">Như ví dụ: 4 vòng không lộ bế tắc, 7 vòng mới lộ. Phải lập luận hoặc kiểm mô hình, không chỉ chạy thử.</span></div>
          <table class="t"><tr><th>bản đảo thứ tự, quầy 5 ô</th><th>4 vòng mỗi bên</th><th>7 vòng mỗi bên</th></tr>
          <tr><td>máy duyệt mọi cách xen kẽ</td><td>không thấy bế tắc</td><td><b class="red">có bế tắc</b></td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ tư, tin vào kiểm thử với tải nhẹ, một lỗi người đã đi làm hay gặp vì bộ kiểm thử chạy xanh. Như ví dụ, 4 vòng không lộ bế tắc, 7 vòng mới lộ, nên phải lập luận hoặc kiểm mọi trạng thái, không chỉ chạy thử. Bảng nhắc lại hai kết quả đó của máy với bản đảo thứ tự, quầy 5 ô."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.prodcons(3, 5, consumer_swapped=True)['deadlock'] is True"
      - "1 - 1 == 0 and 3 - 1 == 2"
      - "alg.prodcons(3, 5)['deadlock'] is False and 0 + 1 == 1"
    steps:
      - show: |
          <p>Bộ đệm 3 ô. Bên <b>tiêu thụ</b> bị viết thành <code>lấy(khoá)</code> rồi mới <code>wait(đầy)</code>; bên sản xuất đúng.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Có thể bế tắc không? Ở trạng thái nào?</td></tr>
          <tr><td>2</td><td>Sửa thế nào?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Bộ đệm 3 ô, bên tiêu thụ bị viết thành lấy khoá trước rồi mới chờ ô đầy, còn bên sản xuất viết đúng. Câu một, có thể bế tắc không, ở trạng thái nào? Câu hai, sửa thế nào? Dừng video và làm ra giấy."
        pause: 10
      - clear: true
        show: |
          <p>① Dò từ lúc quầy <b>trống</b>: trống = 3, đầy = 0, khoá = 1.</p>
          <table class="t"><tr><th>ai</th><th>lệnh</th><th>sau lệnh</th></tr>
          <tr><td>tiêu thụ</td><td>lấy(khoá): 1 − 1</td><td>khoá = 0</td></tr>
          <tr><td>tiêu thụ</td><td>wait(đầy), đầy = 0</td><td>đứng đợi, <b>vẫn giữ khoá</b></td></tr>
          <tr><td>sản xuất</td><td>wait(trống): 3 − 1</td><td>trống = 2</td></tr>
          <tr><td>sản xuất</td><td>lấy(khoá), khoá = 0</td><td>đứng đợi → $\hl{\text{bế tắc}}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5", 0]
        say: "Đáp án câu một, có, và ta dò từ lúc quầy trống, với trống bằng 3, đầy bằng 0, khoá bằng 1. Bên tiêu thụ lấy khoá trước, khoá về 0. Rồi nó chờ ô đầy, mà đầy bằng 0, nên đứng đợi trong khi vẫn giữ khoá. Bếp chờ ô trống, trống bằng 3 nên giảm còn 2 và đi tiếp. Bếp cần lấy khoá để đặt món, nhưng khoá đang bằng 0, nên bếp cũng đứng đợi. Hai bên chờ nhau mãi, đó là bế tắc, và máy duyệt mọi cách xen kẽ đã xác nhận trạng thái này."
      - show: |
          <p>② Đổi lại: <code>wait(đầy)</code> trước, <code>lấy(khoá)</code> sau. Lúc quầy trống, bên tiêu thụ đứng đợi <b>không giữ khoá</b>, bếp lấy khoá đặt món rồi báo đầy = 1, bên tiêu thụ đi tiếp.</p>
        say: "Câu hai, đổi lại thứ tự, chờ ô đầy trước, lấy khoá sau. Khi đó, lúc quầy trống bên tiêu thụ đứng đợi mà không giữ khoá. Bếp lấy được khoá, đặt món, rồi báo đầy bằng 1, và bên tiêu thụ được đi tiếp."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">khoá: một người một lúc</span><span class="a">→</span>
          <span class="n">semaphore: đếm vé, chờ khi hết</span><span class="a">→</span>
          <span class="n">trống, đầy, khoá</span><span class="a">→</span>
          <span class="n">chờ vé trước, lấy khoá sau</span></div>
        say: "Tổng kết lại, khoá bảo đảm một người một lúc. Semaphore đếm số vé và bắt chờ khi hết vé. Bài sản xuất tiêu thụ dùng hai semaphore trống, đầy và một khoá. Và luôn chờ vé trước, lấy khoá sau."
      - show: |
          <div class="box key"><b>Tư duy:</b> đừng bao giờ đứng chờ trong khi giữ thứ mà người khác cần để giải phóng bạn.</div>
        say: "Điều cần mang theo, đừng bao giờ đứng chờ trong khi đang giữ thứ mà người khác cần để giải phóng bạn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>bế tắc</b> nói chung — bốn điều kiện Coffman và cách phá một điều kiện.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học bế tắc nói chung, gồm bốn điều kiện cần của nó, và cách phá một điều kiện để phòng bế tắc. Hẹn gặp bạn ở bài tiếp theo."
