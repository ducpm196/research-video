  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">xoay vòng: mỗi lượt tối đa $q$</span><span class="a">→</span>
          <span class="n">phản hồi nhanh, không cần biết trước</span><span class="a">→</span>
          <span class="n">$q$ vừa phải: lớn hơn nhiều chi phí chuyển</span><span class="a">→</span>
          <span class="n">ưu tiên + lão hoá: không ai đói</span></div>
        say: "Tổng kết lại, xoay vòng cho mỗi tiến trình chạy tối đa q mỗi lượt. Nó cho phản hồi nhanh mà không cần biết trước thời gian chạy. Lượng tử phải lớn hơn nhiều chi phí chuyển ngữ cảnh. Và ưu tiên kết hợp lão hoá bảo đảm không ai bị đói."
      - show: |
          <div class="box key"><b>Tư duy:</b> công bằng và hiệu quả kéo về hai phía — một cơ chế tốt có tham số (như $q$) để chọn điểm cân bằng.</div>
        say: "Điều cần mang theo, công bằng và hiệu quả thường kéo về hai phía, nên một cơ chế tốt có tham số, như lượng tử q, để chọn điểm cân bằng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): khi hai luồng cùng sửa một biến — <b>tranh chấp</b> và vùng găng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta xem chuyện gì xảy ra khi hai luồng cùng sửa một biến, gọi là tranh chấp. Hẹn gặp bạn ở bài tiếp theo."
