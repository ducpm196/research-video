or="middle">6</text><text x="550.0" y="114" font-size="26" text-anchor="middle">8</text><text x="616.2" y="114" font-size="26" text-anchor="middle">9</text><text x="748.8" y="114" font-size="26" text-anchor="middle">11</text><text x="815.0" y="114" font-size="26" text-anchor="middle">12</text><text x="947.5" y="114" font-size="26" text-anchor="middle">14</text><text x="1080.0" y="114" font-size="26" text-anchor="middle">16</text></svg></div>
