scenes:
- id: hook
  kind: hook
  title: Một cấu trúc cho cả tệp 1 byte lẫn tệp 4 TiB
  checks:
  - round(alg.inode_max(12, 3, 4096, 4) / 2 ** 40, 3) == 4.004
  steps:
  - show: '<p>Phần lớn tệp trên máy chỉ vài KB; vài tệp (video, cơ sở dữ liệu) lên tới hàng trăm GB.</p>

      <p>Nhiều hệ thống tệp truyền thống kiểu Unix dùng <b>một</b> cấu trúc cố định 15 con trỏ cho mọi tệp, mà vẫn đọc tệp
      nhỏ rất nhanh. Về lý thuyết, các con trỏ đủ chỉ tới tệp khoảng <b>4 TiB</b> (hệ thống thật còn bị giới hạn khác chặn
      thấp hơn).</p>

      <div class="box key">Hôm nay: nút chỉ mục (inode), con trỏ trực tiếp và gián tiếp — và cách tính kích thước tối đa,
      số lần đọc đĩa.</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Chào bạn, phần lớn tệp trên máy chỉ vài KB, nhưng vài tệp như video hay cơ sở dữ liệu lên tới hàng trăm GB. Nhiều
      hệ thống tệp truyền thống dùng một cấu trúc cố định 15 con trỏ cho mọi tệp, mà vẫn đọc tệp nhỏ rất nhanh. Về lý thuyết
      các con trỏ đủ chỉ tới tệp khoảng 4 TiB, dù hệ thống thật còn bị những giới hạn khác chặn thấp hơn. Hôm nay ta học nút
      chỉ mục, con trỏ trực tiếp và gián tiếp, cách tính kích thước tối đa và số lần đọc đĩa. Chỉ với một cấu trúc chỉ mục
      gọn nhẹ, hệ điều hành quản lý từ tệp vài byte tới tệp hàng nghìn ghi-ga-bai.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: lũy thừa của 2 và số thứ tự khối'
  checks:
  - 2 ** 10 == 1024 and 2 ** 12 == 4096 and 2 ** 20 == 1024 ** 2 and 2 ** 40 == 1024 ** 4 and 2 ** 30 * 2 ** 12 == 2 ** 42
  - 40 * 1024 == 40960 and 40960 // 4096 == 10 and 40960 % 4096 == 0
  steps:
  - show: '<table class="t"><tr><th>đơn vị</th><th>bằng</th><th>số byte</th></tr>

      <tr><td>1 KiB</td><td>$2^{10}$</td><td>1024</td></tr>

      <tr><td>4 KiB</td><td>$2^{12}$</td><td>4096</td></tr>

      <tr><td>1 MiB, 1 GiB, 1 TiB</td><td>$2^{20}$, $2^{30}$, $2^{40}$</td><td>mỗi bậc gấp 1024 lần bậc trước</td></tr></table>

      $$2^{30} \times 2^{12} = 2^{30 + 12} = 2^{42}$$

      '
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    say: Bài này tính toàn bằng lũy thừa của 2, nên ta ôn lại một chút. Một KiB bằng 2 mũ 10, tức 1024 byte. Bốn KiB bằng
      2 mũ 12, tức 4096 byte, còn MiB và TiB là 2 mũ 20 và 2 mũ 40, ở giữa còn một bậc 2 mũ 30, mỗi bậc gấp 1024 lần bậc trước.
      Nhân hai lũy thừa cùng cơ số 2 thì cộng số mũ, ví dụ 2 mũ 30 nhân 2 mũ 12 bằng 2 mũ 42. Phép lũy thừa theo cơ số kích
      thước khối mở rộng không gian địa chỉ nhanh gấp bội ở mỗi tầng gián tiếp.
  - show: '<p>Khối đánh số từ 0. Byte ở vị trí $x$ nằm ở khối số = phần nguyên của $x$ chia cỡ khối:</p>

      $$40 \text{ KiB} = 40\,960 \text{ byte}, \quad 40\,960 : 4096 = \hl{10} \;\to\; \text{khối số } 10$$

      '
    focus:
    - 1
    - 2
    - 2
    say: Điều thứ hai, các khối của một tệp được đánh số từ 0, và byte ở vị trí x nằm ở khối có số bằng phần nguyên của x
      chia cho cỡ khối. Ví dụ vị trí 40 KiB là 40960 byte, chia 4096 được đúng 10, nên byte đó nằm ở khối số 10, tức là khối
      thứ mười một. Đánh chỉ số bắt đầu từ không luôn yêu cầu trừ một trước khi tra cứu vị trí khối dữ liệu thực tế.
- id: sym
  kind: symbol
  title: 'Giải mã: nút chỉ mục (inode)'
  checks:
  - 4096 // 4 == 1024
  steps:
  - show: '<p>Đĩa chia thành <b>khối</b> 4 KiB. Mỗi tệp có một <b>nút chỉ mục</b> (inode): kích thước, chủ sở hữu, quyền,
      thời gian, và 15 <b>con trỏ khối</b> (con trỏ = số hiệu 4 byte của một khối trên đĩa):</p>

      <table class="t"><tr><th>con trỏ</th><th>trỏ tới</th></tr>

      <tr><td>12 trực tiếp</td><td>12 khối dữ liệu</td></tr>

      <tr><td>1 gián tiếp đơn</td><td>một khối chứa 1024 con trỏ → 1024 khối dữ liệu</td></tr>

      <tr><td>1 gián tiếp đôi</td><td>khối con trỏ → 1024 khối con trỏ → $1024^2$ khối dữ liệu</td></tr>

      <tr><td>1 gián tiếp ba</td><td>ba tầng khối con trỏ → $1024^3$ khối dữ liệu</td></tr></table>

      <p class="note">Tên tệp <b>không</b> nằm trong nút chỉ mục: thư mục là bảng “tên → số hiệu nút chỉ mục”.</p>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - 3
    - 3
    say: Đĩa chia thành các khối 4 KiB, và mỗi tệp có một nút chỉ mục ghi kích thước, chủ sở hữu, quyền, thời gian, cùng 15
      con trỏ khối. Mỗi con trỏ chỉ là một số dài 4 byte ghi số hiệu của một khối trên đĩa. 12 con trỏ đầu trỏ thẳng tới 12
      khối dữ liệu. Con trỏ gián tiếp đơn trỏ tới một khối chứa 1024 con trỏ, vì 4096 byte chia 4 byte mỗi con trỏ bằng 1024.
      Con trỏ gián tiếp đôi đi qua hai tầng như vậy, được 1024 bình phương khối. Con trỏ gián tiếp ba đi qua ba tầng, được
      1024 mũ 3 khối. Lưu ý tên tệp không nằm trong nút chỉ mục, thư mục mới là bảng ghi tên và số hiệu nút chỉ mục. Tách
      rời tên tệp trong thư mục khỏi khối quản lý siêu dữ liệu cho phép một tệp mang nhiều tên gọi khác nhau.
