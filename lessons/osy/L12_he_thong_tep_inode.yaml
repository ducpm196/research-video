      x="760" y="440" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">mỗi tầng khối con trỏ thêm 1 lần
      đọc đĩa: số lần đọc = 2 + số tầng gián tiếp</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ đường đi từ nút chỉ mục tới khối dữ liệu theo từng loại con trỏ. Hàng trên cùng, con trỏ trực tiếp chỉ thẳng
