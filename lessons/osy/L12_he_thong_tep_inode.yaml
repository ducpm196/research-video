      con trỏ, nên gián tiếp đơn tốn 3 lần, gián tiếp đôi 4 lần, gián tiếp ba 5 lần. Đổi lại, mỗi tầng thêm vào nhân số khối
      phủ được lên 1024 lần, đó là lý do một cấu trúc nhỏ chứa được tệp khổng lồ. Con trỏ trực tiếp phục vụ tệp cấu hình nhỏ
      siêu nhanh trong khi các nhánh gián tiếp lo tệp đa phương tiện lớn.
- id: example
  kind: example
  title: Kích thước tệp tối đa
  checks:
  - alg.inode_max(12, 3, 4096, 4) == (12 + 1024 + 1024 ** 2 + 1024 ** 3) * 4096
  - 2 ** 40 == 1099511627776 and round(1024 / 1000 - 1, 3) == 0.024 and round(2 ** 40 / 10 ** 12 - 1, 2) == 0.1
  - round(alg.inode_max(12, 3, 4096, 4) / 2 ** 40, 3) == 4.004
  - 4096 // 4 == 1024 and 1024 ** 2 == 1048576 and 1024 ** 3 == 1073741824 and 12 + 1024 + 1048576 + 1073741824 == 1074791436
    and 1074791436 * 4096 == alg.inode_max(12, 3, 4096, 4) and 2 ** 42 // 2 ** 40 == 4
  steps:
  - show: '<p>Số khối tối đa $= 12 + 1024 + 1024^2 + 1024^3$.</p>

      <p><b>Bước 1.</b> Gián tiếp đơn: $4096 : 4 = 1024$ con trỏ → <b>1024</b> khối.</p>

      '
    focus:
    - 1
    - 2
    say: Số khối tối đa bằng tổng bốn phần, 12 cộng 1024 cộng 1024 bình phương cộng 1024 mũ 3. Bước một, phần trực tiếp là
      12 khối, còn gián tiếp đơn phủ 1024 khối, vì một khối 4096 byte chia cho 4 byte mỗi con trỏ được 1024 con trỏ.
  - show: '$$\text{Bước 2. Gián tiếp đôi: } 1024^2 = 1\,048\,576 \text{ khối}$$

      '
    say: Bước hai, gián tiếp đôi có 1024 khối con trỏ, mỗi khối lại trỏ tới 1024 khối dữ liệu, nên phủ 1024 bình phương, bằng
      1 triệu 48 nghìn 576 khối.
  - show: '$$\text{Bước 3. Gián tiếp ba: } 1024^3 = 1\,073\,741\,824 \text{ khối}$$

      '
    say: Bước ba, gián tiếp ba thêm một tầng nữa, nên nhân thêm 1024, được 1024 mũ 3, khoảng 1 tỉ 74 triệu khối.
  - show: '$$\text{Bước 4. } 12 + 1024 + 1\,048\,576 + 1\,073\,741\,824 = 1\,074\,791\,436 \text{ khối}$$

      '
    say: Bước bốn, cộng cả bốn phần, ta được 1 tỉ 74 triệu 791 nghìn 436 khối, gần như toàn bộ là phần gián tiếp ba.
  - clear: true
    show: '<p><b>Bước 5.</b> Nhân 4096 byte: $(12 + 1024 + 1024^2 + 1024^3) \times 4096 \approx \hl{4{,}004}$ TiB.</p>

      <p class="note">Gần như toàn bộ đến từ tầng gián tiếp ba: $1024^3 \times 4096 = 2^{30} \times 2^{12} = 2^{42}$ byte
      = 4 TiB.</p>

      $$2^{42} : 2^{40} = 2^{2} = 4$$

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Bước năm, đổi số khối ra byte rồi ra TiB. Nhân với 4096 byte mỗi khối, được khoảng 4 phẩy 004 TiB. Gần như toàn bộ
      đến từ tầng gián tiếp ba, vì 1024 mũ 3 nhân 4096 bằng 2 mũ 30 nhân 2 mũ 12, tức 2 mũ 42 byte, đúng 4 TiB. Cách đánh
      chỉ mục nhiều tầng vừa giữ cấu trúc quản lý gọn nhẹ cho tệp nhỏ vừa mở rộng tới kích thước hàng tê-ra-bai.
- id: reads
  kind: concept
  title: Đọc một byte tốn mấy lần đọc đĩa?
  checks:
  - alg.inode_reads(40 * 1024, 12, 4096, 4) == 2 and alg.inode_reads(48 * 1024, 12, 4096, 4) == 3
  - 100 * 2 ** 20 // 4096 == 25600 and alg.inode_reads(100 * 2 ** 20, 12, 4096, 4) == 4
  steps:
  - show: '<table class="t"><tr><th>vị trí byte</th><th>khối số</th><th>đi qua</th><th>lần đọc</th></tr>

      <tr><td>40 KiB</td><td>10 &lt; 12</td><td>trực tiếp: nút chỉ mục + khối dữ liệu</td><td><b>2</b></td></tr>

      <tr><td>48 KiB</td><td>12</td><td>gián tiếp đơn: nút chỉ mục + khối con trỏ + dữ liệu</td><td><b>3</b></td></tr>

      <tr><td>100 MiB</td><td>25 600 &gt; 12 + 1024</td><td>gián tiếp đôi</td><td>$\hl{4}$</td></tr></table>

      <div class="box key">Tệp nhỏ (≤ 48 KiB) chỉ cần con trỏ trực tiếp → nhanh; tệp lớn trả thêm vài lần đọc cho phần xa
      — và bộ nhớ đệm thường giữ sẵn các khối con trỏ.</div>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    say: Đếm số lần đọc đĩa khi đã biết số hiệu nút chỉ mục và chưa có gì trong bộ nhớ đệm. Byte ở vị trí 40 KiB nằm ở khối
      số 10, nhỏ hơn 12, nên dùng con trỏ trực tiếp, đọc nút chỉ mục rồi khối dữ liệu, tổng 2 lần. Vị trí 48 KiB nằm ở khối
      số 12, vượt qua 12 con trỏ trực tiếp, nên phải đọc thêm một khối con trỏ, tổng 3 lần. Vị trí 100 MiB là khối số 25600,
      vượt quá 12 cộng 1024, nên đi qua gián tiếp đôi, tổng 4 lần. Vì vậy tệp nhỏ đọc rất nhanh, tệp lớn trả thêm vài lần
      đọc, và bộ nhớ đệm thường giữ sẵn các khối con trỏ. Bộ đệm khối trong bộ nhớ giữ sẵn các trang chỉ mục hay dùng nhất
      nhằm giảm mạnh lượt chạm đĩa.
- id: verify
  kind: check
  title: Tự kiểm
  checks:
  - 12 * 4096 == 48 * 1024 and (12 + 1024) * 4096 == 4243456
  - 1024 * 4096 == 4 * 2 ** 20 and 1 + 2 + 1 == 4 and alg.inode_reads(100 * 2 ** 20, 12, 4096, 4) == 1 + 2 + 1
  - 2 ** 30 * 2 ** 12 == 2 ** 42 and 2 ** 42 / 2 ** 40 == 4 and 2 ** 32 / 2 ** 40 == 1 / 256 and round(1 / 256, 4) == 0.0039
    and round(1036 * 4096 / 2 ** 40, 6) == 0.000004 and round(1036 * 4096 / 2 ** 20) == 4
  - round(4 + 1 / 256 + 1036 * 4096 / 2 ** 40, 4) == 4.0039 and round(4 + 1 / 256 + 1036 * 4096 / 2 ** 40, 3) == 4.004 and
    abs(4 + 1 / 256 + 1036 * 4096 / 2 ** 40 - alg.inode_max(12, 3, 4096, 4) / 2 ** 40) < 1e-12
  steps:
  - show: '<table class="t"><tr><th>phép thử</th><th>với số của bài</th></tr>

      <tr><td>số con trỏ mỗi khối = cỡ khối ÷ cỡ con trỏ</td><td>4096 ÷ 4 = 1024</td></tr>

      <tr><td>ranh giới: trực tiếp tới 12 × 4 KiB; gián tiếp đơn thêm 1024 × 4 KiB</td><td>48 KiB; thêm 4 MiB</td></tr>

      <tr><td>đếm số lần đọc = 1 + tầng gián tiếp + 1</td><td>40 KiB (trực tiếp): 2; 48 KiB (đơn): 3; 100 MiB (đôi): 4</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Tự kiểm bằng ba cách. Một, số con trỏ trong mỗi khối bằng cỡ khối chia cỡ con trỏ, vì khối con trỏ chỉ chứa các con
      trỏ. Hai, nhớ các ranh giới, con trỏ trực tiếp phủ tới 48 KiB, gián tiếp đơn phủ thêm 4 MiB. Ba, số lần đọc bằng 1 lần
      cho nút chỉ mục, cộng số tầng gián tiếp, cộng 1 lần cho khối dữ liệu.
  - show: '<table class="t"><tr><th>đường khác: cộng từng tầng theo lũy thừa của 2</th><th>byte</th><th>đổi ra TiB</th></tr>

      <tr><td>gián tiếp ba: $2^{30} \times 2^{12}$</td><td>$2^{42}$</td><td>4</td></tr>

      <tr><td>gián tiếp đôi: $2^{20} \times 2^{12}$</td><td>$2^{32}$</td><td>$\frac{1}{256} \approx 0{,}0039$</td></tr>

      <tr><td>gián tiếp đơn + trực tiếp: $1036 \times 4096$</td><td>≈ 4 MiB</td><td>≈ 0,000004</td></tr>

      <tr><td>tổng</td><td></td><td>$\approx 4{,}0039 \approx \hl{4{,}004}$ ✓</td></tr></table>

      '
    introduces:
    - frac
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bây giờ kiểm con số 4 phẩy 004 bằng một đường khác, cộng từng tầng theo lũy thừa của 2 thay vì nhân số lớn. Tầng
      gián tiếp ba cho 2 mũ 42 byte, đúng 4 TiB. Tầng gián tiếp đôi cho 2 mũ 32 byte, chia 2 mũ 40 được 1 phần 256, khoảng
      0 phẩy 0039 TiB. Phần gián tiếp đơn và trực tiếp chỉ khoảng 4 MiB, nhỏ tới mức chỉ đóng góp chừng 4 phần triệu TiB.
      Cộng lại khoảng 4 phẩy 0039, làm tròn ba chữ số được 4 phẩy 004, khớp với phép nhân trực tiếp.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ xoá tệp là xoá dữ liệu <b class="red">(sai)</b>

      <br><span class="note">Xoá chỉ gỡ một tên; khi không còn tên nào trỏ tới và không tiến trình nào đang mở, khối mới được
      đánh dấu là trống. Dữ liệu còn trên đĩa đến khi bị ghi đè — muốn huỷ thật phải ghi đè hoặc mã hoá.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ xoá tệp là xoá dữ liệu. Xoá chỉ gỡ một tên, và chỉ khi không còn tên nào trỏ tới, cũng không tiến
      trình nào đang mở, các khối mới được đánh dấu là trống. Dữ liệu vẫn còn nằm trên đĩa đến khi bị ghi đè, nên muốn huỷ
      thật phải ghi đè hoặc mã hoá. Xoá tên tệp chỉ huỷ liên kết thư mục chứ chưa xoá sạch dữ liệu nằm rải rác trên từng khối
      đĩa. Chỉ thu hồi vùng dữ liệu thực trên đĩa khi bộ đếm liên kết trỏ tới nút chỉ mục giảm về không hoàn toàn.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Nghĩ tên tệp nằm trong nút chỉ mục <b class="red">(sai)</b>

      <br><span class="note">Tên nằm trong thư mục; một nút chỉ mục có thể có nhiều tên (liên kết cứng).</span></div>

      '
    say: Lỗi thứ hai, nghĩ tên tệp nằm trong nút chỉ mục. Tên nằm trong thư mục, và một nút chỉ mục có thể có nhiều tên, gọi
      là liên kết cứng. Bộ đếm liên kết cứng bảo đảm phần dữ liệu chỉ thực sự bị giải phóng khi không còn tên nào trỏ tới.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Quên trừ phần trực tiếp khi xác định tầng <b class="red">(lệch)</b>

      <br><span class="note">Khối số 12 là khối <b>đầu tiên</b> của gián tiếp đơn, không phải khối thứ 12 của nó.</span></div>

      '
    say: Lỗi thứ ba, quên trừ phần trực tiếp khi xác định khối thuộc tầng nào. Khối số 12 là khối đầu tiên của gián tiếp đơn,
      không phải khối thứ 12 của nó. Con trỏ trực tiếp thường kết thúc sớm ngay trước ngưỡng con trỏ gián tiếp đơn đầu tiên.
  - show: '<div class="box warn"><b>Lỗi 4.</b> Nhầm KB và KiB khi tính giới hạn <b class="red">(sai số)</b>

      <br><span class="note">Tính bằng lũy thừa của 2 (KiB, MiB, TiB); đổi sang hệ 10 ở bước cuối nếu cần.</span></div>

      <table class="t"><tr><th>hệ 2</th><th>hệ 10</th><th>lệch</th></tr><tr><td>1 KiB = 1024 byte</td><td>1 KB = 1000 byte</td><td>2,4%</td></tr><tr><td>1
      TiB = 1 099 511 627 776 byte</td><td>1 TB = $10^{12}$ byte</td><td><b class="red">≈ 10%</b></td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Lỗi thứ tư, nhầm đơn vị hệ 10 và hệ 2 khi tính giới hạn. Hãy tính bằng lũy thừa của 2, rồi mới đổi sang hệ 10 ở bước
      cuối nếu cần. Độ lệch giữa hai hệ chỉ 2 phẩy 4 phần trăm ở bậc nghìn, nhưng tăng lên khoảng 10 phần trăm ở bậc nghìn
      tỉ, đủ để một ổ đĩa trông như thiếu dung lượng. Hàng triệu tệp văn bản tí hon có thể đốt sạch toàn bộ nút chỉ mục dù
      dung lượng ổ cứng vẫn trống trơn.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.inode_max(10, 2, 1024, 4) == (10 + 256 + 256 ** 2) * 1024 and round(alg.inode_max(10, 2, 1024, 4) / 2 ** 20, 2) ==
    64.26
  - alg.inode_reads(300 * 1024, 10, 1024, 4) == 4
  - 1024 // 4 == 256 and 256 ** 2 == 65536 and 10 + 256 + 65536 == 65802 and round(65802 / 1024, 2) == 64.26 and 300 * 1024
    // 1024 == 300 and 10 + 256 - 1 == 265 and 300 > 265 and 2 + 2 == 4
  steps:
  - show: '<p>Khối 1 KiB, con trỏ 4 byte, nút chỉ mục có 10 con trỏ trực tiếp, 1 gián tiếp đơn, 1 gián tiếp đôi.</p>

      <table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Kích thước tệp tối đa?</td></tr>

      <tr><td>2</td><td>Đọc byte ở vị trí 300 KiB tốn mấy lần đọc đĩa?</td></tr></table>

      '
    focus:
    - 0
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Khối 1 KiB, con trỏ 4 byte, nút chỉ mục có 10 con trỏ trực tiếp, một gián tiếp đơn và
      một gián tiếp đôi. Câu một, kích thước tệp tối đa là bao nhiêu? Câu hai, đọc byte ở vị trí 300 KiB tốn mấy lần đọc đĩa?
      Dừng video và làm ra giấy.
    pause: 12
  - clear: true
    show: '<p>① 1024 ÷ 4 = 256 con trỏ/khối → $(10 + 256 + 256^2) \times 1024 \approx \hl{64{,}26}$ MiB.</p>

      $$10 + 256 + 65\,536 = 65\,802 \text{ khối} = 65\,802 \text{ KiB}, \quad 65\,802 : 1024 \approx 64{,}26 \text{ MiB}$$

      '
    focus:
    - 1
    - 2
    - 2
    say: Đáp án câu một, mỗi khối chứa 256 con trỏ, nên tối đa là 10 cộng 256 cộng 256 bình phương khối, nhân 1 KiB, khoảng
      64 phẩy 26 MiB. Cụ thể, 256 bình phương bằng 65536, cộng thêm 266 được 65802 khối, mỗi khối 1 KiB, nên chia 1024 được
      khoảng 64 phẩy 26 MiB. Trừ đi phần phủ của nhóm trực tiếp và gián tiếp đơn xác định ngay khối đích nằm sâu ở tầng hai.
  - show: '<table class="t"><tr><th>bước</th><th>câu ②</th></tr>

      <tr><td>khối số</td><td>300 KiB : 1 KiB = 300</td></tr>

      <tr><td>trực tiếp phủ khối 0–9, gián tiếp đơn phủ khối 10–265</td><td>300 &gt; 265 → gián tiếp đôi</td></tr>

      <tr><td>lần đọc = 2 + số tầng</td><td>$2 + 2 = \hl{4}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Câu hai, trực tiếp và gián tiếp đơn chỉ phủ tới 266 KiB, nhỏ hơn 300, nên phải đi qua gián tiếp đôi, tốn 4 lần đọc.
      Từng bước, vì khối 1 KiB nên byte ở vị trí 300 KiB nằm ở khối số 300. Mười con trỏ trực tiếp phủ khối 0 tới 9, gián
      tiếp đơn phủ tiếp 256 khối, từ 10 tới 265, mà 300 lớn hơn 265. Vậy phải qua hai tầng con trỏ, số lần đọc là 2 cộng 2,
      bằng 4.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/OSY/L12
  steps:
  - show: <table class='t'><tr><th>Thực hành OSY:L12</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Tính
      dung lượng trực tiếp và gián tiếp hai cấp của nút chỉ mục tệp</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>blk=4096
      ptr=4 direct_n=12</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh OSY L12 duong_dan/bai_cua_ban.py</code>
      (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 12 với kích thước khối, kích thước con trỏ và số con trỏ trực tiếp. Tính dung lượng dữ
      liệu trực tiếp theo đơn vị ki-bi-bai và số con trỏ vừa trong một khối gián tiếp cấp một. Sau đó tính dung lượng tối
      đa do tầng gián tiếp cấp hai quản lý theo đơn vị mê-bi-bai. In đủ ba dòng khớp khuôn mẫu rồi chạy lệnh tự chấm kèm hai
      ca kiểm ẩn.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai OSY:L12</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (con trỏ mỗi khối)</b></td><td>Tính số con trỏ vừa một khối <code>fan = blk // ptr</code></td></tr><tr><td><b>Bước 2
      (trực tiếp)</b></td><td>Nhân <code>direct_n * blk</code> rồi chia 1024 đổi sang KiB</td></tr><tr><td><b>Bước 3 (hai
      cấp)</b></td><td>Nhân <code>fan * fan * blk</code> rồi chia <code>1024 * 1024</code> đổi sang MiB</td></tr></table>
    say: Gợi ý cài đặt bài số 12 theo ba bước chuyển đổi đơn vị. Bước một chia kích thước khối cho kích thước con trỏ để biết
      số nhánh trong một khối chỉ mục. Bước hai tính từng mức trực tiếp và hai cấp gián tiếp rồi đổi chính xác ra đơn vị yêu
      cầu.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>direct_kib=48</div><div>single_ind_blocks=1024</div><div>double_ind_mib=4096</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">thư mục: tên → nút chỉ mục</span><span class="a">→</span>

      <span class="n">12 trực tiếp: tệp nhỏ nhanh</span><span class="a">→</span>

      <span class="n">gián tiếp 1, 2, 3 tầng: tệp lớn</span><span class="a">→</span>

      <span class="n">đọc = 2 + số tầng</span></div>

      '
    say: Tổng kết lại, thư mục ánh xạ tên sang nút chỉ mục. 12 con trỏ trực tiếp làm tệp nhỏ đọc nhanh, các tầng gián tiếp
      một, hai, ba chứa được tệp lớn, và số lần đọc bằng 2 cộng số tầng gián tiếp. Chi phí truy cập tăng tuyến tính rất chậm
      theo từng tầng con trỏ cân xứng với dung lượng khổng lồ. Thiết kế nút chỉ mục nhiều tầng vừa tiết kiệm bộ nhớ cho tệp
      nhỏ vừa mở rộng mượt tới dung lượng cực lớn.
  - show: '<div class="box key"><b>Tư duy:</b> thiết kế cho trường hợp phổ biến (tệp nhỏ) thật nhanh, và cho trường hợp hiếm
      (tệp lớn) vẫn chạy được.</div>

      '
    say: Điều cần mang theo, hãy thiết kế cho trường hợp phổ biến thật nhanh, và cho trường hợp hiếm vẫn chạy được. Thiết
      kế nút chỉ mục phân tầng đạt điểm ngọt giữa tốc độ tệp nhỏ và sức chứa tệp siêu lớn.
  - clear: true
    show: '<p class="note">Bài sau (bài 13): đầu đọc nên đi theo thứ tự nào — <b>lập lịch đĩa</b> và đặc điểm SSD.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 13, ta xem đầu đọc nên đi theo thứ tự nào, với cách lập lịch đĩa và đặc điểm của ổ thể rắn. Hẹn gặp
      bạn ở bài tiếp theo. Hiểu cách tệp trải các khối trên mặt đĩa chuẩn bị trực tiếp cho bài toán sắp lịch đầu đọc kế tiếp.
