scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một cấu trúc cho cả tệp 1 byte lẫn tệp 4 TiB"
    checks:
      - "round(alg.inode_max(12, 3, 4096, 4) / 2 ** 40, 3) == 4.004"
    steps:
      - show: |
          <p>Phần lớn tệp trên máy chỉ vài KB; vài tệp (video, cơ sở dữ liệu) lên tới hàng trăm GB.</p>
          <p>Nhiều hệ thống tệp truyền thống kiểu Unix dùng <b>một</b> cấu trúc cố định 15 con trỏ cho mọi tệp, mà vẫn đọc tệp nhỏ rất nhanh. Về lý thuyết, các con trỏ đủ chỉ tới tệp khoảng <b>4 TiB</b> (hệ thống thật còn bị giới hạn khác chặn thấp hơn).</p>
          <div class="box key">Hôm nay: nút chỉ mục (inode), con trỏ trực tiếp và gián tiếp — và cách tính kích thước tối đa, số lần đọc đĩa.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, phần lớn tệp trên máy chỉ vài KB, nhưng vài tệp như video hay cơ sở dữ liệu lên tới hàng trăm GB. Nhiều hệ thống tệp truyền thống dùng một cấu trúc cố định 15 con trỏ cho mọi tệp, mà vẫn đọc tệp nhỏ rất nhanh. Về lý thuyết các con trỏ đủ chỉ tới tệp khoảng 4 TiB, dù hệ thống thật còn bị những giới hạn khác chặn thấp hơn. Hôm nay ta học nút chỉ mục, con trỏ trực tiếp và gián tiếp, cách tính kích thước tối đa và số lần đọc đĩa."

  # ───────────────────────── 1b. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa của 2 và số thứ tự khối"
    checks:
      - "2 ** 10 == 1024 and 2 ** 12 == 4096 and 2 ** 20 == 1024 ** 2 and 2 ** 40 == 1024 ** 4 and 2 ** 30 * 2 ** 12 == 2 ** 42"
      - "40 * 1024 == 40960 and 40960 // 4096 == 10 and 40960 % 4096 == 0"
    steps:
      - show: |
          <table class="t"><tr><th>đơn vị</th><th>bằng</th><th>số byte</th></tr>
          <tr><td>1 KiB</td><td>$2^{10}$</td><td>1024</td></tr>
          <tr><td>4 KiB</td><td>$2^{12}$</td><td>4096</td></tr>
          <tr><td>1 MiB, 1 GiB, 1 TiB</td><td>$2^{20}$, $2^{30}$, $2^{40}$</td><td>mỗi bậc gấp 1024 lần bậc trước</td></tr></table>
          $$2^{30} \times 2^{12} = 2^{30 + 12} = 2^{42}$$
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Bài này tính toàn bằng lũy thừa của 2, nên ta ôn lại một chút. Một KiB bằng 2 mũ 10, tức 1024 byte. Bốn KiB bằng 2 mũ 12, tức 4096 byte, còn MiB và TiB là 2 mũ 20 và 2 mũ 40, ở giữa còn một bậc 2 mũ 30, mỗi bậc gấp 1024 lần bậc trước. Nhân hai lũy thừa cùng cơ số 2 thì cộng số mũ, ví dụ 2 mũ 30 nhân 2 mũ 12 bằng 2 mũ 42."
      - show: |
          <p>Khối đánh số từ 0. Byte ở vị trí $x$ nằm ở khối số = phần nguyên của $x$ chia cỡ khối:</p>
          $$40 \text{ KiB} = 40\,960 \text{ byte}, \quad 40\,960 : 4096 = \hl{10} \;\to\; \text{khối số } 10$$
        focus: [1, 2]
        say: "Điều thứ hai, các khối của một tệp được đánh số từ 0, và byte ở vị trí x nằm ở khối có số bằng phần nguyên của x chia cho cỡ khối. Ví dụ vị trí 40 KiB là 40960 byte, chia 4096 được đúng 10, nên byte đó nằm ở khối số 10, tức là khối thứ mười một."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: nút chỉ mục (inode)"
    checks:
      - "4096 // 4 == 1024"
    steps:
      - show: |
          <p>Đĩa chia thành <b>khối</b> 4 KiB. Mỗi tệp có một <b>nút chỉ mục</b> (inode): kích thước, chủ sở hữu, quyền, thời gian, và 15 <b>con trỏ khối</b> (con trỏ = số hiệu 4 byte của một khối trên đĩa):</p>
          <table class="t"><tr><th>con trỏ</th><th>trỏ tới</th></tr>
          <tr><td>12 trực tiếp</td><td>12 khối dữ liệu</td></tr>
          <tr><td>1 gián tiếp đơn</td><td>một khối chứa 1024 con trỏ → 1024 khối dữ liệu</td></tr>
          <tr><td>1 gián tiếp đôi</td><td>khối con trỏ → 1024 khối con trỏ → $1024^2$ khối dữ liệu</td></tr>
          <tr><td>1 gián tiếp ba</td><td>ba tầng khối con trỏ → $1024^3$ khối dữ liệu</td></tr></table>
          <p class="note">Tên tệp <b>không</b> nằm trong nút chỉ mục: thư mục là bảng “tên → số hiệu nút chỉ mục”.</p>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.5", 3]
        say: "Đĩa chia thành các khối 4 KiB, và mỗi tệp có một nút chỉ mục ghi kích thước, chủ sở hữu, quyền, thời gian, cùng 15 con trỏ khối. Mỗi con trỏ chỉ là một số dài 4 byte ghi số hiệu của một khối trên đĩa. 12 con trỏ đầu trỏ thẳng tới 12 khối dữ liệu. Con trỏ gián tiếp đơn trỏ tới một khối chứa 1024 con trỏ, vì 4096 byte chia 4 byte mỗi con trỏ bằng 1024. Con trỏ gián tiếp đôi đi qua hai tầng như vậy, được 1024 bình phương khối. Con trỏ gián tiếp ba đi qua ba tầng, được 1024 mũ 3 khối. Lưu ý tên tệp không nằm trong nút chỉ mục, thư mục mới là bảng ghi tên và số hiệu nút chỉ mục."

  # ───────────────────────── 2b. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Từ nút chỉ mục tới khối dữ liệu: đi qua mấy tầng?"
    checks:
      - "[alg.inode_reads(o, 12, 4096, 4) for o in (0, 12 * 4096, (12 + 1024) * 4096, (12 + 1024 + 1024 ** 2) * 4096)] == [2, 3, 4, 5]"
    steps:
      - show: |
          <div><svg width="1520" height="460" viewBox="0 0 1520 460"><defs><marker id="arI12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="170" y="36" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">nút chỉ mục</text><text x="765" y="36" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">khối con trỏ (mỗi khối 1024 con trỏ)</text><text x="1275" y="36" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">khối dữ liệu 4 KiB</text><text x="1460" y="36" font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">số lần đọc</text><rect x="40" y="55" width="260" height="345" fill="#f1f5f9" stroke="#1f2937" stroke-width="3"/><rect x="55" y="70" width="230" height="62" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="170" y="108.7" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">12 trực tiếp</text><line x1="285" y1="101" x2="1145" y2="101" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="1150" y="70" width="250" height="62" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="1275" y="108" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">12 khối</text><text x="1460" y="109" font-size="24" text-anchor="middle" fill="#b91c1c" font-weight="bold">2 lần</text><rect x="55" y="152" width="230" height="62" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="170" y="190.7" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">gián tiếp đơn</text><line x1="285" y1="183" x2="415" y2="183" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="420" y="152" width="170" height="62" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="505" y="190" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1024 con trỏ</text><line x1="590" y1="183" x2="1145" y2="183" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="1150" y="152" width="250" height="62" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="1275" y="190" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1024 khối</text><text x="1460" y="191" font-size="24" text-anchor="middle" fill="#b91c1c" font-weight="bold">3 lần</text><rect x="55" y="234" width="230" height="62" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="170" y="272.7" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">gián tiếp đôi</text><line x1="285" y1="265" x2="415" y2="265" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="420" y="234" width="170" height="62" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="505" y="272" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1024 con trỏ</text><line x1="590" y1="265" x2="645" y2="265" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="650" y="234" width="170" height="62" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="735" y="272" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1024 con trỏ</text><line x1="820" y1="265" x2="1145" y2="265" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="1150" y="234" width="250" height="62" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="1275" y="272" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1024 × 1024 khối</text><text x="1460" y="273" font-size="24" text-anchor="middle" fill="#b91c1c" font-weight="bold">4 lần</text><rect x="55" y="316" width="230" height="62" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="170" y="354.7" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">gián tiếp ba</text><line x1="285" y1="347" x2="415" y2="347" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="420" y="316" width="170" height="62" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="505" y="354" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1024 con trỏ</text><line x1="590" y1="347" x2="645" y2="347" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="650" y="316" width="170" height="62" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="735" y="354" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1024 con trỏ</text><line x1="820" y1="347" x2="875" y2="347" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="880" y="316" width="170" height="62" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="965" y="354" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1024 con trỏ</text><line x1="1050" y1="347" x2="1145" y2="347" stroke="#1f2937" stroke-width="3" marker-end="url(#arI12)"/><rect x="1150" y="316" width="250" height="62" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="1275" y="354" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1024 × 1024 × 1024</text><text x="1460" y="355" font-size="24" text-anchor="middle" fill="#b91c1c" font-weight="bold">5 lần</text><text x="760" y="440" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">mỗi tầng khối con trỏ thêm 1 lần đọc đĩa: số lần đọc = 2 + số tầng gián tiếp</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ đường đi từ nút chỉ mục tới khối dữ liệu theo từng loại con trỏ. Hàng trên cùng, con trỏ trực tiếp chỉ thẳng vào khối dữ liệu, nên đọc nút chỉ mục rồi đọc dữ liệu, tổng 2 lần. Mỗi hàng bên dưới chen thêm một khối vàng chứa 1024 con trỏ, nên gián tiếp đơn tốn 3 lần, gián tiếp đôi 4 lần, gián tiếp ba 5 lần. Đổi lại, mỗi tầng thêm vào nhân số khối phủ được lên 1024 lần, đó là lý do một cấu trúc nhỏ chứa được tệp khổng lồ."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Kích thước tệp tối đa"
    checks:
      - "alg.inode_max(12, 3, 4096, 4) == (12 + 1024 + 1024 ** 2 + 1024 ** 3) * 4096"
      - "2 ** 40 == 1099511627776 and round(1024 / 1000 - 1, 3) == 0.024 and round(2 ** 40 / 10 ** 12 - 1, 2) == 0.1"
      - "round(alg.inode_max(12, 3, 4096, 4) / 2 ** 40, 3) == 4.004"
      - "4096 // 4 == 1024 and 1024 ** 2 == 1048576 and 1024 ** 3 == 1073741824 and 12 + 1024 + 1048576 + 1073741824 == 1074791436 and 1074791436 * 4096 == alg.inode_max(12, 3, 4096, 4) and 2 ** 42 // 2 ** 40 == 4"
    steps:
      - show: |
          <p>Số khối tối đa $= 12 + 1024 + 1024^2 + 1024^3$.</p>
          <p><b>Bước 1.</b> Gián tiếp đơn: $4096 : 4 = 1024$ con trỏ → <b>1024</b> khối.</p>
        focus: [1, 2]
        say: "Số khối tối đa bằng tổng bốn phần, 12 cộng 1024 cộng 1024 bình phương cộng 1024 mũ 3. Bước một, phần trực tiếp là 12 khối, còn gián tiếp đơn phủ 1024 khối, vì một khối 4096 byte chia cho 4 byte mỗi con trỏ được 1024 con trỏ."
      - show: |
          $$\text{Bước 2. Gián tiếp đôi: } 1024^2 = 1\,048\,576 \text{ khối}$$
        say: "Bước hai, gián tiếp đôi có 1024 khối con trỏ, mỗi khối lại trỏ tới 1024 khối dữ liệu, nên phủ 1024 bình phương, bằng 1 triệu 48 nghìn 576 khối."
      - show: |
          $$\text{Bước 3. Gián tiếp ba: } 1024^3 = 1\,073\,741\,824 \text{ khối}$$
        say: "Bước ba, gián tiếp ba thêm một tầng nữa, nên nhân thêm 1024, được 1024 mũ 3, khoảng 1 tỉ 74 triệu khối."
      - show: |
          $$\text{Bước 4. } 12 + 1024 + 1\,048\,576 + 1\,073\,741\,824 = 1\,074\,791\,436 \text{ khối}$$
        say: "Bước bốn, cộng cả bốn phần, ta được 1 tỉ 74 triệu 791 nghìn 436 khối, gần như toàn bộ là phần gián tiếp ba."
      - clear: true
        show: |
          <p><b>Bước 5.</b> Nhân 4096 byte: $(12 + 1024 + 1024^2 + 1024^3) \times 4096 \approx \hl{4{,}004}$ TiB.</p>
          <p class="note">Gần như toàn bộ đến từ tầng gián tiếp ba: $1024^3 \times 4096 = 2^{30} \times 2^{12} = 2^{42}$ byte = 4 TiB.</p>
          $$2^{42} : 2^{40} = 2^{2} = 4$$
        focus: [1, 1, 2]
        say: "Bước năm, đổi số khối ra byte rồi ra TiB. Nhân với 4096 byte mỗi khối, được khoảng 4 phẩy 004 TiB. Gần như toàn bộ đến từ tầng gián tiếp ba, vì 1024 mũ 3 nhân 4096 bằng 2 mũ 30 nhân 2 mũ 12, tức 2 mũ 42 byte, đúng 4 TiB."

  # ───────────────────────── 4. SỐ LẦN ĐỌC ─────────────────────────
  - id: reads
    kind: concept
    title: "Đọc một byte tốn mấy lần đọc đĩa?"
    checks:
      - "alg.inode_reads(40 * 1024, 12, 4096, 4) == 2 and alg.inode_reads(48 * 1024, 12, 4096, 4) == 3"
      - "100 * 2 ** 20 // 4096 == 25600 and alg.inode_reads(100 * 2 ** 20, 12, 4096, 4) == 4"
    steps:
      - show: |
          <table class="t"><tr><th>vị trí byte</th><th>khối số</th><th>đi qua</th><th>lần đọc</th></tr>
          <tr><td>40 KiB</td><td>10 &lt; 12</td><td>trực tiếp: nút chỉ mục + khối dữ liệu</td><td><b>2</b></td></tr>
          <tr><td>48 KiB</td><td>12</td><td>gián tiếp đơn: nút chỉ mục + khối con trỏ + dữ liệu</td><td><b>3</b></td></tr>
          <tr><td>100 MiB</td><td>25 600 &gt; 12 + 1024</td><td>gián tiếp đôi</td><td>$\hl{4}$</td></tr></table>
          <div class="box key">Tệp nhỏ (≤ 48 KiB) chỉ cần con trỏ trực tiếp → nhanh; tệp lớn trả thêm vài lần đọc cho phần xa — và bộ nhớ đệm thường giữ sẵn các khối con trỏ.</div>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Đếm số lần đọc đĩa khi đã biết số hiệu nút chỉ mục và chưa có gì trong bộ nhớ đệm. Byte ở vị trí 40 KiB nằm ở khối số 10, nhỏ hơn 12, nên dùng con trỏ trực tiếp, đọc nút chỉ mục rồi khối dữ liệu, tổng 2 lần. Vị trí 48 KiB nằm ở khối số 12, vượt qua 12 con trỏ trực tiếp, nên phải đọc thêm một khối con trỏ, tổng 3 lần. Vị trí 100 MiB là khối số 25600, vượt quá 12 cộng 1024, nên đi qua gián tiếp đôi, tổng 4 lần. Vì vậy tệp nhỏ đọc rất nhanh, tệp lớn trả thêm vài lần đọc, và bộ nhớ đệm thường giữ sẵn các khối con trỏ."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "12 * 4096 == 48 * 1024 and (12 + 1024) * 4096 == 4243456"
      - "1024 * 4096 == 4 * 2 ** 20 and 1 + 2 + 1 == 4 and alg.inode_reads(100 * 2 ** 20, 12, 4096, 4) == 1 + 2 + 1"
      - "2 ** 30 * 2 ** 12 == 2 ** 42 and 2 ** 42 / 2 ** 40 == 4 and 2 ** 32 / 2 ** 40 == 1 / 256 and round(1 / 256, 4) == 0.0039 and round(1036 * 4096 / 2 ** 40, 6) == 0.000004 and round(1036 * 4096 / 2 ** 20) == 4"
      - "round(4 + 1 / 256 + 1036 * 4096 / 2 ** 40, 4) == 4.0039 and round(4 + 1 / 256 + 1036 * 4096 / 2 ** 40, 3) == 4.004 and abs(4 + 1 / 256 + 1036 * 4096 / 2 ** 40 - alg.inode_max(12, 3, 4096, 4) / 2 ** 40) < 1e-12"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th><th>với số của bài</th></tr>
          <tr><td>số con trỏ mỗi khối = cỡ khối ÷ cỡ con trỏ</td><td>4096 ÷ 4 = 1024</td></tr>
          <tr><td>ranh giới: trực tiếp tới 12 × 4 KiB; gián tiếp đơn thêm 1024 × 4 KiB</td><td>48 KiB; thêm 4 MiB</td></tr>
          <tr><td>số lần đọc = 1 (nút chỉ mục) + số tầng gián tiếp + 1 (dữ liệu)</td><td>đôi: 1 + 2 + 1 = 4</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, số con trỏ trong mỗi khối bằng cỡ khối chia cỡ con trỏ, vì khối con trỏ chỉ chứa các con trỏ. Hai, nhớ các ranh giới, con trỏ trực tiếp phủ tới 48 KiB, gián tiếp đơn phủ thêm 4 MiB. Ba, số lần đọc bằng 1 lần cho nút chỉ mục, cộng số tầng gián tiếp, cộng 1 lần cho khối dữ liệu."
      - show: |
          <table class="t"><tr><th>đường khác: cộng từng tầng theo lũy thừa của 2</th><th>byte</th><th>đổi ra TiB</th></tr>
          <tr><td>gián tiếp ba: $2^{30} \times 2^{12}$</td><td>$2^{42}$</td><td>4</td></tr>
          <tr><td>gián tiếp đôi: $2^{20} \times 2^{12}$</td><td>$2^{32}$</td><td>$\frac{1}{256} \approx 0{,}0039$</td></tr>
          <tr><td>gián tiếp đơn + trực tiếp: $1036 \times 4096$</td><td>≈ 4 MiB</td><td>≈ 0,000004</td></tr>
          <tr><td>tổng</td><td></td><td>$\approx 4{,}0039 \approx \hl{4{,}004}$ ✓</td></tr></table>
        introduces: [frac]
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bây giờ kiểm con số 4 phẩy 004 bằng một đường khác, cộng từng tầng theo lũy thừa của 2 thay vì nhân số lớn. Tầng gián tiếp ba cho 2 mũ 42 byte, đúng 4 TiB. Tầng gián tiếp đôi cho 2 mũ 32 byte, chia 2 mũ 40 được 1 phần 256, khoảng 0 phẩy 0039 TiB. Phần gián tiếp đơn và trực tiếp chỉ khoảng 4 MiB, nhỏ tới mức chỉ đóng góp chừng 4 phần triệu TiB. Cộng lại khoảng 4 phẩy 0039, làm tròn ba chữ số được 4 phẩy 004, khớp với phép nhân trực tiếp."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ xoá tệp là xoá dữ liệu <b class="red">(sai)</b>
          <br><span class="note">Xoá chỉ gỡ một tên; khi không còn tên nào trỏ tới và không tiến trình nào đang mở, khối mới được đánh dấu là trống. Dữ liệu còn trên đĩa đến khi bị ghi đè — muốn huỷ thật phải ghi đè hoặc mã hoá.</span></div>
        say: "Lỗi thứ nhất, nghĩ xoá tệp là xoá dữ liệu. Xoá chỉ gỡ một tên, và chỉ khi không còn tên nào trỏ tới, cũng không tiến trình nào đang mở, các khối mới được đánh dấu là trống. Dữ liệu vẫn còn nằm trên đĩa đến khi bị ghi đè, nên muốn huỷ thật phải ghi đè hoặc mã hoá."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ tên tệp nằm trong nút chỉ mục <b class="red">(sai)</b>
          <br><span class="note">Tên nằm trong thư mục; một nút chỉ mục có thể có nhiều tên (liên kết cứng).</span></div>
        say: "Lỗi thứ hai, nghĩ tên tệp nằm trong nút chỉ mục. Tên nằm trong thư mục, và một nút chỉ mục có thể có nhiều tên, gọi là liên kết cứng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên trừ phần trực tiếp khi xác định tầng <b class="red">(lệch)</b>
          <br><span class="note">Khối số 12 là khối <b>đầu tiên</b> của gián tiếp đơn, không phải khối thứ 12 của nó.</span></div>
        say: "Lỗi thứ ba, quên trừ phần trực tiếp khi xác định khối thuộc tầng nào. Khối số 12 là khối đầu tiên của gián tiếp đơn, không phải khối thứ 12 của nó."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nhầm KB và KiB khi tính giới hạn <b class="red">(sai số)</b>
          <br><span class="note">Tính bằng lũy thừa của 2 (KiB, MiB, TiB); đổi sang hệ 10 ở bước cuối nếu cần.</span></div>
          <table class="t"><tr><th>hệ 2</th><th>hệ 10</th><th>lệch</th></tr><tr><td>1 KiB = 1024 byte</td><td>1 KB = 1000 byte</td><td>2,4%</td></tr><tr><td>1 TiB = 1 099 511 627 776 byte</td><td>1 TB = $10^{12}$ byte</td><td><b class="red">≈ 10%</b></td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ tư, nhầm đơn vị hệ 10 và hệ 2 khi tính giới hạn. Hãy tính bằng lũy thừa của 2, rồi mới đổi sang hệ 10 ở bước cuối nếu cần. Độ lệch giữa hai hệ chỉ 2 phẩy 4 phần trăm ở bậc nghìn, nhưng tăng lên khoảng 10 phần trăm ở bậc nghìn tỉ, đủ để một ổ đĩa trông như thiếu dung lượng."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.inode_max(10, 2, 1024, 4) == (10 + 256 + 256 ** 2) * 1024 and round(alg.inode_max(10, 2, 1024, 4) / 2 ** 20, 2) == 64.26"
      - "alg.inode_reads(300 * 1024, 10, 1024, 4) == 4"
      - "1024 // 4 == 256 and 256 ** 2 == 65536 and 10 + 256 + 65536 == 65802 and round(65802 / 1024, 2) == 64.26 and 300 * 1024 // 1024 == 300 and 10 + 256 - 1 == 265 and 300 > 265 and 2 + 2 == 4"
    steps:
      - show: |
          <p>Khối 1 KiB, con trỏ 4 byte, nút chỉ mục có 10 con trỏ trực tiếp, 1 gián tiếp đơn, 1 gián tiếp đôi.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Kích thước tệp tối đa?</td></tr>
          <tr><td>2</td><td>Đọc byte ở vị trí 300 KiB tốn mấy lần đọc đĩa?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Khối 1 KiB, con trỏ 4 byte, nút chỉ mục có 10 con trỏ trực tiếp, một gián tiếp đơn và một gián tiếp đôi. Câu một, kích thước tệp tối đa là bao nhiêu? Câu hai, đọc byte ở vị trí 300 KiB tốn mấy lần đọc đĩa? Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <p>① 1024 ÷ 4 = 256 con trỏ/khối → $(10 + 256 + 256^2) \times 1024 \approx \hl{64{,}26}$ MiB.</p>
          $$10 + 256 + 65\,536 = 65\,802 \text{ khối} = 65\,802 \text{ KiB}, \quad 65\,802 : 1024 \approx 64{,}26 \text{ MiB}$$
        focus: [1, 2]
        say: "Đáp án câu một, mỗi khối chứa 256 con trỏ, nên tối đa là 10 cộng 256 cộng 256 bình phương khối, nhân 1 KiB, khoảng 64 phẩy 26 MiB. Cụ thể, 256 bình phương bằng 65536, cộng thêm 266 được 65802 khối, mỗi khối 1 KiB, nên chia 1024 được khoảng 64 phẩy 26 MiB."
      - show: |
          <table class="t"><tr><th>bước</th><th>câu ②</th></tr>
          <tr><td>khối số</td><td>300 KiB : 1 KiB = 300</td></tr>
          <tr><td>trực tiếp phủ khối 0–9, gián tiếp đơn phủ khối 10–265</td><td>300 &gt; 265 → gián tiếp đôi</td></tr>
          <tr><td>lần đọc = 2 + số tầng</td><td>$2 + 2 = \hl{4}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, trực tiếp và gián tiếp đơn chỉ phủ tới 266 KiB, nhỏ hơn 300, nên phải đi qua gián tiếp đôi, tốn 4 lần đọc. Từng bước, vì khối 1 KiB nên byte ở vị trí 300 KiB nằm ở khối số 300. Mười con trỏ trực tiếp phủ khối 0 tới 9, gián tiếp đơn phủ tiếp 256 khối, từ 10 tới 265, mà 300 lớn hơn 265. Vậy phải qua hai tầng con trỏ, số lần đọc là 2 cộng 2, bằng 4."

