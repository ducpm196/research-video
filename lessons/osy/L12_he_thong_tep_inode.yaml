id: L12
course: OSY
series: "OSY · Hệ điều hành"
title: "Bài 12 — Hệ thống tệp: inode, khối, chỉ mục nhiều tầng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/osy.yaml L12; audit/verify_plan_curricula.py OSY:L12; D. Ritchie, K. Thompson (1974), “The UNIX Time-Sharing System”; R. Arpaci-Dusseau, A. Arpaci-Dusseau, Operating Systems: Three Easy Pieces, chương 40"
assumes: [arith, power, sub, dots, approx]
# Quy ước: khối 4 KiB, con trỏ khối 4 byte → một khối chứa 4096 / 4 = 1024 con trỏ. “inode” chỉ trên màn hình; lời đọc nói “nút chỉ mục”.
#   TiB = 2⁴⁰ byte. Số lần đọc đĩa tính khi CHƯA có gì trong bộ nhớ đệm. Mọi con số do alg.inode_max / alg.inode_reads tính.
objectives:
  - "Mô tả cấu trúc nút chỉ mục của tệp"
  - "Tính kích thước tệp tối đa"
  - "Đếm số lần đọc đĩa để truy cập một khối"
asr_reviewed:
  - {sentence: "Bốn KiB bằng 2 mũ 12, tức 4096 byte, còn MiB và TiB là 2 mũ 20 và 2 mũ 40, ở giữa còn một bậc 2 mũ 30, mỗi bậc gấp 1024 lần bậc trước.", reason: "ASR chép “4 kilobyte bằng 2 mũ 12, tức 4096 byte, còn megabyte và terabyte là 2 mũ 20 và 2 mũ 40, ở giữa còn một bật 2 mũ 30, mỗi bật cấp 1024 lần bật trước.” (0.865): “kib” đọc theo luật lexicon (lexicon_vi.OSY.yaml: “ki-lô-byte”), ASR viết “kilobyte”; MiB đọc “mê-ga-byte” (quy ước OSY/DEN: cách nói thông dụng, màn hình giữ MiB, câu nêu rõ 2 mũ 20), ASR viết “MB”; “tib” đọc theo luật lexicon (lexicon_vi.OSY.yaml: “tê-ra-byte”), ASR viết “terabyte”; lệch âm/thanh thuần Việt: bậc/bật, bậc gấp/bật cấp, bậc/bật — NOT_VERIFIED bằng tai người"}
