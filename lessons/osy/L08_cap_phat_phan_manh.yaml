          <br><span class="note">Ngoài: lãng phí <b>giữa</b> các vùng đã cấp. Trong: lãng phí <b>bên trong</b> vùng đã cấp.</span></div>
        say: "Lỗi thứ hai, nhầm phân mảnh trong và ngoài. Phân mảnh ngoài là lãng phí giữa các vùng đã cấp, phân mảnh trong là lãng phí nằm bên trong vùng đã cấp."
