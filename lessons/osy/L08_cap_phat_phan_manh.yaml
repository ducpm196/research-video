          <br><span class="note">Lỗ 150, 100; yêu cầu 50, 100, 100: vừa đầu tiên đặt đủ cả ba, vừa nhất kẹt ở yêu cầu cuối. Tốt hay xấu tuỳ chuỗi yêu cầu.</span></div>
