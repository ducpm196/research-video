          <tr><td>vừa đầu tiên</td><td>288, 200, 300, 183</td><td>288</td><td>100, $\hl{176}$, 200, 300, 183</td></tr>
          <tr><td>vừa nhất</td><td>200, 600</td><td>200</td><td>100, 83, $\hl{88}$, 88, 600</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, yêu cầu 112. Vừa đầu tiên gặp lỗ 288 trước tiên, đặt vào đó còn 176. Vừa nhất chỉ có hai lỗ đủ lớn là 200 và 600, chọn lỗ 200, còn lại 88."
      - show: |
          <p><b>Bước 4</b> — yêu cầu 426.</p>
          <table class="t"><tr><th>cách</th><th>lỗ đủ lớn</th><th>kết quả</th></tr>
          <tr><td>vừa đầu tiên</td><td>không có (lớn nhất là 300)</td><td><b class="red">không lỗ nào đủ</b></td></tr>
          <tr><td>vừa nhất</td><td>chỉ 600</td><td>đặt được, lỗ 600 → còn $\hl{174}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.2", 0]
        say: "Bước bốn, yêu cầu 426. Với vừa đầu tiên, không còn lỗ nào đủ, vì lỗ 600 đã bị chia và lỗ lớn nhất chỉ còn 300. Với vừa nhất, lỗ 600 vẫn nguyên, nên đặt được, còn lại 174. Cùng bốn yêu cầu, hai cách chọn cho hai kết cục khác nhau. Lý do là vừa đầu tiên đã cắt vụn lỗ lớn nhất ngay từ bước hai."

  # ───────────────────────── 4. PHÂN MẢNH ─────────────────────────
  - id: frag
    kind: concept
    title: "Phân mảnh ngoài và phân mảnh trong"
    checks:
      - "__import__('math').ceil(72766 / 4096) == 18 and 18 * 4096 - 72766 == 962"
      - "959 > 2 * 426 and 100 + 176 + 200 + 300 + 183 == 959 and max([100, 176, 200, 300, 183]) == 300 < 426"
    steps:
      - show: |
          <div><svg width="1400" height="300" viewBox="0 0 1400 300"><rect x="20" y="60" width="62" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="51" y="114" font-size="22" text-anchor="middle" fill="#1f2937">100</text><rect x="82.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="138" y="60" width="131" height="90" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="204" y="114" font-size="22" text-anchor="middle" fill="#1f2937">212</text><rect x="269" y="60" width="69" height="90" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="304" y="114" font-size="22" text-anchor="middle" fill="#1f2937">112</text><rect x="339" y="60" width="109" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="393" y="114" font-size="22" text-anchor="middle" fill="#1f2937">176</text><rect x="448.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="504" y="60" width="124" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="566" y="114" font-size="22" text-anchor="middle" fill="#1f2937">200</text><rect x="628.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="684" y="60" width="186" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="777" y="114" font-size="22" text-anchor="middle" fill="#1f2937">300</text><rect x="870.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="926" y="60" width="259" height="90" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="1055" y="114" font-size="22" text-anchor="middle" fill="#1f2937">417</text><rect x="1185" y="60" width="113" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="1241" y="114" font-size="22" text-anchor="middle" fill="#1f2937">183</text><text x="20" y="210" font-size="26" fill="#1f2937">Năm lỗ trắng cộng lại 959, nhưng 426 cần MỘT lỗ liền ≥ 426: lỗ lớn nhất chỉ 300.</text></svg></div>
        focus: [1, 1, 1]
        say: "Đây là dải bộ nhớ sau khi vừa đầu tiên đặt xong ba yêu cầu 212, 112 và 417. Năm lỗ còn lại nằm rải rác, cộng lại 959, nhiều hơn gấp đôi 426. Nhưng yêu cầu 426 cần một lỗ liền, mà lỗ lớn nhất chỉ 300, nên không đặt được."
      - clear: true
        show: |
          <p><b>Phân mảnh ngoài</b>: tổng trống đủ, nhưng không có <b>một</b> lỗ đủ lớn. Sau vừa đầu tiên ở trên: trống 100 + 176 + 200 + 300 + 183 = 959 KB, lỗ lớn nhất 300.</p>
          <p><b>Phân mảnh trong</b>: cấp theo khối cố định nên khối cuối thừa. Khối 4096 byte, chương trình 72 766 byte → 18 khối, thừa $18 \times 4096 - 72\,766 = \hl{962}$ byte nằm <b>bên trong</b> vùng đã cấp.</p>
        focus: [1, 1, 2, 2]
        say: "Phân mảnh ngoài là khi tổng bộ nhớ trống đủ, nhưng không có một lỗ nào đủ lớn. Sau ví dụ vừa đầu tiên, còn trống 959 KB mà lỗ lớn nhất chỉ 300. Phân mảnh trong là khi cấp theo khối cố định nên khối cuối bị thừa. Ví dụ khối 4096 byte, chương trình 72766 byte cần 18 khối, thừa 962 byte nằm ngay bên trong vùng đã cấp."
      - show: |
          <div class="box key">Chữa phân mảnh ngoài: <b>dồn bộ nhớ</b> (chép các chương trình sát nhau — tốn thời gian), hoặc bỏ hẳn yêu cầu “liền mạch”: đó là ý tưởng của <b>phân trang</b>.</div>
        say: "Có hai cách chữa phân mảnh ngoài. Một là dồn bộ nhớ, chép các chương trình nằm sát nhau, nhưng tốn thời gian. Hai là bỏ hẳn yêu cầu phải liền mạch, đó là ý tưởng của phân trang."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "sum([100, 500, 200, 300, 600]) - (212 + 417 + 112) == 959"
      - "212 + 417 + 112 + 426 == 1167 and 1700 - 1167 == 533 and 100 + 83 + 88 + 88 + 174 == 533"
      - "sorted([500, 300, 600])[0] == 300 and sorted([500, 600])[0] == 500 and sorted([200, 600])[0] == 200"
    steps:
      - show: |
          <ol><li>Tổng trống sau cấp = tổng lỗ ban đầu − tổng các yêu cầu đã đặt được. Vừa đầu tiên: 1700 − (212 + 417 + 112) = 959 KB.</li>
          <li>Mỗi bước, lỗ được chọn phải ≥ yêu cầu; phần thừa = lỗ − yêu cầu.</li>
          <li>Kiểm “vừa nhất” bằng cách liệt kê <b>mọi</b> lỗ đủ lớn trước khi chọn.</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, tổng trống sau khi cấp bằng tổng lỗ ban đầu trừ tổng các yêu cầu đã đặt được, với vừa đầu tiên là 1700 trừ 741, bằng 959. Hai, ở mỗi bước, lỗ được chọn phải lớn hơn hoặc bằng yêu cầu, và phần thừa bằng lỗ trừ yêu cầu, vì lỗ chỉ mất đúng phần được cấp. Ba, kiểm cách vừa nhất bằng cách liệt kê mọi lỗ đủ lớn rồi mới chọn lỗ nhỏ nhất."
      - show: |
          <table class="t"><tr><th>kiểm vừa nhất bằng đường khác</th><th>phép tính</th><th>khớp?</th></tr>
          <tr><td>tổng trống = 1700 − tổng 4 yêu cầu</td><td>1700 − 1167 = 533</td><td></td></tr>
          <tr><td>cộng thẳng các lỗ cuối 100, 83, 88, 88, 174</td><td>533</td><td>✓</td></tr>
          <tr><td>xếp lỗ đủ lớn tăng dần, lấy đầu danh sách</td><td>300; 500; 200; 600</td><td>✓ đúng 4 lỗ đã chọn</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Giờ kiểm kết quả vừa nhất bằng hai đường khác. Bốn yêu cầu cộng lại 1167, nên tổng trống phải là 1700 trừ 1167, bằng 533. Cộng thẳng năm lỗ cuối 100, 83, 88, 88 và 174, cũng được 533, khớp. Cuối cùng, ở mỗi bước, xếp các lỗ đủ lớn theo thứ tự tăng dần rồi lấy lỗ đầu danh sách, ta được 300, 500, 200 và 600, đúng bốn lỗ đã chọn."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "None not in alg.fit([150, 100], [50, 100, 100], 'first') and None in alg.fit([150, 100], [50, 100, 100], 'best')"
      - "(lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([150, 100], [50], 'first') == [100, 100] and (lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([150, 100], [50, 100], 'first') == [0, 100] and (lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([150, 100], [50, 100, 100], 'first') == [0, 0]"
      - "(lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([150, 100], [50], 'best') == [150, 50] and (lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([150, 100], [50, 100], 'best') == [50, 50] and max((lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([150, 100], [50, 100], 'best')) < 100"
    title: "4 lỗi người mới hay mắc"
    steps:
