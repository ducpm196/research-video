scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Còn 959 KB trống mà không đặt nổi 426 KB"
    checks:
      - "sum([100, 176, 200, 300, 183]) == 959 and max([100, 176, 200, 300, 183]) < 426"
    steps:
      - show: |
          <p>Bộ nhớ còn tổng cộng <b>959 KB</b> trống, chương trình mới chỉ cần <b>426 KB</b> — vậy mà không đặt được.</p>
          <p>Vì 959 KB đó nằm rải rác thành năm mẩu, mẩu lớn nhất chỉ 300 KB.</p>
          <div class="box key">Hôm nay: khi mỗi chương trình phải nằm trong <b>một vùng liền</b>, chọn lỗ nào để đặt, và hiện tượng phân mảnh.</div>
        focus: [1, 2, 3]
        say: "Chào bạn, bộ nhớ còn tổng cộng 959 KB trống, chương trình mới chỉ cần 426 KB, vậy mà không đặt được. Vì 959 KB đó nằm rải rác thành năm mẩu, mẩu lớn nhất chỉ 300 KB. Hôm nay ta học cách chọn chỗ đặt khi mỗi chương trình phải nằm trong một vùng liền, và hiện tượng phân mảnh."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: trừ, so sánh, và chia làm tròn lên"
    checks:
      - "500 - 212 == 288 and not 288 >= 417 and 600 >= 417"
      - "17 * 4096 == 69632 and 69632 < 72766 and 18 * 4096 == 73728 and 73728 >= 72766 and __import__('math').ceil(72766 / 4096) == 18"
    steps:
      - show: |
          <table class="t"><tr><th>việc</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>đặt 212 vào vùng trống 500, phần còn lại</td><td>500 − 212</td><td>288</td></tr>
          <tr><td>yêu cầu 417 có vừa phần 288 không?</td><td>288 ≥ 417?</td><td>không</td></tr>
          <tr><td>yêu cầu 417 có vừa vùng 600 không?</td><td>600 ≥ 417?</td><td>có</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bài này chỉ dùng phép trừ và phép so sánh, nhưng dùng rất nhiều lần. Đặt một chương trình 212 vào một vùng trống 500, phần còn lại là 500 trừ 212, bằng 288. Muốn biết yêu cầu 417 có vừa phần 288 đó không, ta so sánh, 288 nhỏ hơn 417 nên không vừa. Vùng 600 thì lớn hơn 417, nên vừa."
      - show: |
          <table class="t"><tr><th>chia 72 766 byte thành khối 4096 byte</th><th>phép tính</th><th>đủ chứa?</th></tr>
          <tr><td>17 khối</td><td>17 × 4096 = 69 632</td><td>không, nhỏ hơn 72 766</td></tr>
          <tr><td>18 khối</td><td>18 × 4096 = 73 728</td><td>có → làm tròn lên: 18 khối</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Phép thứ hai là chia rồi làm tròn lên, dùng khi cấp theo khối cố định. Muốn chứa 72766 byte bằng các khối 4096 byte, thử 17 khối thì được 17 nhân 4096 bằng 69632, nhỏ hơn 72766, chưa đủ. Thử 18 khối được 73728, đủ chứa, nên cần 18 khối, tức là kết quả chia được làm tròn lên."

  - id: sym
    kind: symbol
    title: "Giải mã: lỗ, vừa đầu tiên, vừa nhất"
    steps:
      - show: |
          <p><b>Lỗ</b>: một vùng nhớ trống liền mạch. Yêu cầu $r$ KB đặt được vào lỗ có kích thước ≥ $r$; phần thừa thành lỗ nhỏ hơn.</p>
          <ul><li><b>Vừa đầu tiên</b>: duyệt từ đầu, chọn lỗ <b>đầu tiên</b> đủ lớn — nhanh.</li>
          <li><b>Vừa nhất</b>: chọn lỗ đủ lớn <b>nhỏ nhất</b> — phần thừa ít nhất.</li></ul>
        focus: [1, 1, "2.1", "2.2"]
        say: "Lỗ là một vùng nhớ trống liền mạch. Một yêu cầu r KB đặt được vào lỗ có kích thước lớn hơn hoặc bằng r, phần thừa trở thành một lỗ nhỏ hơn. Cách vừa đầu tiên duyệt từ đầu và chọn lỗ đầu tiên đủ lớn, nên rất nhanh. Cách vừa nhất chọn lỗ nhỏ nhất trong các lỗ đủ lớn, để phần thừa ít nhất."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: bộ nhớ là một dải, lỗ bị chia nhỏ dần"
    checks:
      - "sum([100, 500, 200, 300, 600]) == 1700 and 500 - 212 == 288"
    steps:
      - show: |
          <div><svg width="1400" height="300" viewBox="0 0 1400 300"><rect x="20" y="60" width="62" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="51" y="114" font-size="22" text-anchor="middle" fill="#1f2937">100</text><rect x="82.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="138" y="60" width="310" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="293" y="114" font-size="22" text-anchor="middle" fill="#1f2937">500</text><rect x="448.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="504" y="60" width="124" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="566" y="114" font-size="22" text-anchor="middle" fill="#1f2937">200</text><rect x="628.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="684" y="60" width="186" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="777" y="114" font-size="22" text-anchor="middle" fill="#1f2937">300</text><rect x="870.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="926" y="60" width="372" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="1112" y="114" font-size="22" text-anchor="middle" fill="#1f2937">600</text><text x="20" y="210" font-size="26" fill="#1f2937">Bộ nhớ là một dải địa chỉ: lỗ trống (trắng, viền xanh lá) nằm xen giữa các vùng đã cấp (xám).</text></svg></div>
        focus: [1, 1, 1]
        say: "Hãy hình dung bộ nhớ là một dải địa chỉ nằm ngang. Các vùng xám đã cấp cho chương trình khác, xen giữa là năm lỗ trống 100, 500, 200, 300 và 600, tổng 1700. Một chương trình mới phải nằm trọn trong một lỗ, không được vắt qua vùng xám."
      - clear: true
        show: |
          <div><svg width="1400" height="300" viewBox="0 0 1400 300"><rect x="20" y="60" width="62" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="51" y="114" font-size="22" text-anchor="middle" fill="#1f2937">100</text><rect x="82.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="138" y="60" width="131" height="90" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="204" y="114" font-size="22" text-anchor="middle" fill="#1f2937">212</text><rect x="269" y="60" width="179" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="359" y="114" font-size="22" text-anchor="middle" fill="#1f2937">288</text><rect x="448.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="504" y="60" width="124" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="566" y="114" font-size="22" text-anchor="middle" fill="#1f2937">200</text><rect x="628.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="684" y="60" width="186" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="777" y="114" font-size="22" text-anchor="middle" fill="#1f2937">300</text><rect x="870.0" y="60" width="56" height="90" fill="#9ca3af" stroke="#374151" stroke-width="2"/><rect x="926" y="60" width="372" height="90" fill="#ffffff" stroke="#16a34a" stroke-width="3"/><text x="1112" y="114" font-size="22" text-anchor="middle" fill="#1f2937">600</text><text x="20" y="210" font-size="26" fill="#1f2937">Đặt 212 vào lỗ 500: phần đầu lỗ được cấp (xanh dương), phần thừa 500 − 212 = 288 thành một lỗ mới nhỏ hơn.</text></svg></div>
        focus: [1, 1, 1]
        say: "Đặt một yêu cầu 212 vào lỗ 500, phần đầu lỗ được cấp, tô màu xanh dương. Phần thừa 500 trừ 212, bằng 288, trở thành một lỗ mới nhỏ hơn. Cứ mỗi lần cấp, một lỗ lớn bị chia thành một lỗ nhỏ hơn, và đó là gốc rễ của phân mảnh."

  - id: example
    kind: example
    title: "Lỗ 100, 500, 200, 300, 600; yêu cầu 212, 417, 112, 426"
    checks:
      - "alg.fit([100, 500, 200, 300, 600], [212, 417, 112, 426], 'first') == [1, 4, 1, None]"
      - "alg.fit([100, 500, 200, 300, 600], [212, 417, 112, 426], 'best') == [3, 1, 2, 4]"
      - "(lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([100, 500, 200, 300, 600], [212], 'first') == [100, 288, 200, 300, 600] and (lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([100, 500, 200, 300, 600], [212], 'best') == [100, 500, 200, 88, 600]"
      - "(lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([100, 500, 200, 300, 600], [212, 417], 'first') == [100, 288, 200, 300, 183] and (lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([100, 500, 200, 300, 600], [212, 417], 'best') == [100, 83, 200, 88, 600]"
      - "(lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([100, 500, 200, 300, 600], [212, 417, 112], 'first') == [100, 176, 200, 300, 183] and (lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([100, 500, 200, 300, 600], [212, 417, 112], 'best') == [100, 83, 88, 88, 600]"
      - "(lambda holes, req, how: [h - sum(r for r, i in zip(req, alg.fit(holes, req, how)) if i == k) for k, h in enumerate(holes)])([100, 500, 200, 300, 600], [212, 417, 112, 426], 'best') == [100, 83, 88, 88, 174] and max([100, 176, 200, 300, 183]) == 300"
    steps:
      - clear: true
        show: |
          <p><b>Bước 1</b> — yêu cầu 212. Lỗ đủ lớn: 500, 300, 600.</p>
          <table class="t"><tr><th>cách</th><th>các lỗ trước</th><th>chọn</th><th>các lỗ sau</th></tr>
          <tr><td>vừa đầu tiên</td><td>100, 500, 200, 300, 600</td><td>500 (đầu tiên)</td><td>100, $\hl{288}$, 200, 300, 600</td></tr>
          <tr><td>vừa nhất</td><td>100, 500, 200, 300, 600</td><td>300 (nhỏ nhất)</td><td>100, 500, 200, $\hl{88}$, 600</td></tr></table>
        focus: [0, 1, "2.2", "2.3"]
        say: "Bây giờ theo dõi từng yêu cầu, mỗi bước một yêu cầu, và luôn liệt kê các lỗ đủ lớn trước khi chọn. Bước một, yêu cầu 212, các lỗ đủ lớn là 500, 300 và 600. Vừa đầu tiên lấy lỗ 500 vì đó là lỗ đủ lớn đầu tiên, còn lại 288. Vừa nhất lấy lỗ 300 vì đó là lỗ đủ lớn nhỏ nhất, còn lại 88."
      - show: |
          <p><b>Bước 2</b> — yêu cầu 417.</p>
          <table class="t"><tr><th>cách</th><th>lỗ đủ lớn</th><th>chọn</th><th>các lỗ sau</th></tr>
          <tr><td>vừa đầu tiên</td><td>chỉ 600</td><td>600</td><td>100, 288, 200, 300, $\hl{183}$</td></tr>
          <tr><td>vừa nhất</td><td>500, 600</td><td>500</td><td>100, $\hl{83}$, 200, 88, 600</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước hai, yêu cầu 417. Với vừa đầu tiên, lỗ 500 đã bị chia còn 288, nên chỉ còn lỗ 600 đủ lớn, đặt vào đó còn 183. Với vừa nhất, lỗ 500 vẫn nguyên nên được chọn vì nhỏ hơn 600, còn lại 83."
      - clear: true
        show: |
