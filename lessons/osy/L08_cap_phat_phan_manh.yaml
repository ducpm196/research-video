        say: "Lỗi thứ ba, quên rằng lỗ bị chia sẽ đổi kích thước. Sau khi đặt 212 vào lỗ 500, lỗ đó chỉ còn 288, và các yêu cầu sau phải nhìn kích thước mới này."
