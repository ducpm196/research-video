# Quy ước: “lỗ” = một vùng nhớ trống liền mạch, kích thước tính bằng KB. Vừa đầu tiên (first fit) / vừa nhất (best fit): tên tiếng Anh
#   chỉ trên màn hình. Mọi kết quả đặt chỗ do alg.fit mô phỏng.
objectives:
  - "Mô phỏng vừa đầu tiên, vừa nhất"
  - "Phân biệt phân mảnh trong và ngoài"
  - "Giải thích vì sao không chiến lược nào luôn tốt nhất"
