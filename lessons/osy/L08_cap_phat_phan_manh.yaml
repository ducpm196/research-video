        say: "Lỗi thứ tư, nghĩ dồn bộ nhớ là miễn phí. Phải chép hàng trăm triệu byte, và chương trình bị dời phải dừng trong lúc chép. Hơn nữa, chỉ dồn được khi phần cứng dịch địa chỉ lúc chạy, nếu không thì mọi địa chỉ trong chương trình đều sai sau khi dời."

