          <tr><td>100</td><td>lỗ 100 đầu → (0, 100)</td><td>lỗ 150 → (50, 50)</td></tr>
          <tr><td>100</td><td>lỗ 100 → (0, 0) ✓</td><td><b class="red">không lỗ nào đủ</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bảng dò từng bước ví dụ đó. Yêu cầu 50, vừa đầu tiên cắt lỗ 150 còn 100, vừa nhất cắt lỗ 100 còn 50. Yêu cầu 100, vừa đầu tiên dùng lỗ 100 đầu tiên, vừa nhất phải cắt lỗ 150 còn 50. Yêu cầu 100 cuối, vừa đầu tiên vẫn còn một lỗ 100, còn vừa nhất chỉ còn hai mẩu 50, nên kẹt."
      - show: |
