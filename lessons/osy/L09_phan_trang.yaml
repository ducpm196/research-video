scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bỏ yêu cầu liền mạch"
    steps:
      - show: |
          <p>Ở bài 8, chương trình phải nằm trong <b>một vùng liền</b>, nên bộ nhớ còn 959 KB trống mà không đặt nổi 426 KB.</p>
          <p>Ý tưởng: cắt chương trình thành các mẩu bằng nhau (<b>trang</b>), cắt bộ nhớ thành các ô cùng cỡ (<b>khung</b>), rồi đặt mỗi trang vào <b>bất kỳ</b> khung trống nào.</p>
          <div class="box key">Hôm nay: phân trang — hết <b>phân mảnh ngoài</b> (tổng chỗ trống đủ nhưng không có một vùng liền đủ lớn), đổi lại cần một bảng để dịch địa chỉ.</div>
        focus: [1, 2, 3, 3]
        say: "Chào bạn, ở bài 8, chương trình phải nằm trong một vùng liền, nên bộ nhớ còn 959 KB trống mà không đặt nổi 426 KB. Ý tưởng mới là cắt chương trình thành các mẩu bằng nhau gọi là trang, cắt bộ nhớ thành các ô cùng cỡ gọi là khung, rồi đặt mỗi trang vào bất kỳ khung trống nào. Hôm nay ta học phân trang, cách này hết phân mảnh ngoài, đổi lại cần một bảng để dịch địa chỉ. Phân mảnh ngoài là khi tổng chỗ trống đủ, nhưng nằm rải rác nên không có một vùng liền nào đủ lớn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hệ mười sáu, và cắt bỏ chữ số cuối"
    checks:
      - "0x3A7F == 3 * 4096 + 10 * 256 + 7 * 16 + 15 and 0x3A7F == 14975"
      - "0x3A7F // 16 ** 3 == 3 and 0x3A7F % 16 ** 3 == 0xA7F and 16 ** 3 == 2 ** 12 == 4096"
      - "0x7 * 16 ** 3 == 0x7000 and 0x7000 + 0xA7F == 0x7A7F"
    steps:
      - show: |
          <table class="t"><tr><th>chữ số hệ mười sáu</th><th>0 … 9</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr>
          <tr><td>giá trị</td><td>0 … 9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td></tr>
          <tr><td>số bit</td><td colspan="7">mỗi chữ số đúng 4 bit, vì 16 = 2 × 2 × 2 × 2</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bài này viết địa chỉ trong hệ mười sáu, nên ta ôn lại một chút. Hệ mười sáu dùng các chữ số 0 đến 9, rồi A là 10, B là 11, cho tới F là 15. Mỗi chữ số hệ mười sáu ứng với đúng 4 bit, vì 16 bằng 2 nhân 2 nhân 2 nhân 2."
      - show: |
          <table class="t"><tr><th>việc</th><th>làm với 0x3A7F</th><th>kết quả</th></tr>
          <tr><td>bỏ 12 bit thấp = bỏ 3 chữ số cuối</td><td>3 | A7F</td><td>3</td></tr>
          <tr><td>giữ 12 bit thấp = giữ 3 chữ số cuối</td><td>3 | A7F</td><td>A7F</td></tr>
          <tr><td>dịch trái 12 bit = thêm 3 chữ số 0</td><td>7 → 7000</td><td>0x7000</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Vì mỗi chữ số là 4 bit, nên 12 bit đúng bằng 3 chữ số hệ mười sáu. Bỏ 12 bit thấp của 3 A 7 F hệ mười sáu nghĩa là bỏ 3 chữ số cuối, còn lại 3. Giữ 12 bit thấp nghĩa là giữ 3 chữ số cuối, được A 7 F. Ngược lại, dịch trái 12 bit nghĩa là viết thêm 3 chữ số 0, nên 7 thành 7 0 0 0 hệ mười sáu."

  - id: sym
    kind: symbol
    title: "Giải mã: số trang, độ dời, bảng trang"
    checks:
      - "2 ** 12 == 4096 and 32 - 12 == 20"
    steps:
      - show: |
          <p><b>Địa chỉ ảo</b>: địa chỉ chương trình tự dùng, như thể nó có riêng một dải liền bắt đầu từ 0. <b>Địa chỉ vật lý</b>: vị trí thật của byte đó trong bộ nhớ.</p>
          <p>Trang 4 KiB = $2^{12}$ byte, nên địa chỉ ảo 32 bit = <b>số trang</b> (20 bit cao) + <b>độ dời</b> (12 bit thấp).</p>
          <p>Số trang $= \text{địa chỉ} \gg 12$; độ dời = 12 bit thấp. <b>Bảng trang</b> của tiến trình: mục thứ $k$ ghi khung chứa trang $k$, và bit có mặt (1 = trang đang ở trong bộ nhớ).</p>
          <p>Địa chỉ vật lý = (số khung $\ll 12$) + độ dời. Độ dời <b>không đổi</b>.</p>
        focus: [1, 1, 2, 3, 3, 4]
        say: "Trước hết, ta cần phân biệt hai loại địa chỉ. Địa chỉ ảo là địa chỉ chương trình tự dùng, như thể nó có riêng một dải liền bắt đầu từ 0, còn địa chỉ vật lý là vị trí thật của byte đó trong bộ nhớ. Trang 4 KiB bằng 2 mũ 12 byte, nên một địa chỉ ảo 32 bit gồm số trang ở 20 bit cao và độ dời ở 12 bit thấp. Số trang có được bằng cách dịch phải địa chỉ 12 bit, độ dời là 12 bit thấp. Mỗi tiến trình có một bảng trang, mục thứ k ghi khung đang chứa trang k và một bit có mặt, bằng 1 khi trang đang nằm trong bộ nhớ. Địa chỉ vật lý bằng số khung dịch trái 12 bit, cộng độ dời, và độ dời không đổi."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình dung: chỉ số trang đi qua bảng, độ dời đi thẳng"
    checks:
      - "0x3A7F >> 12 == 3 and 0x3A7F & 0xFFF == 0xA7F and (7 << 12) | 0xA7F == 0x7A7F"
    steps:
      - show: |
          <div><svg width="1400" height="400" viewBox="0 0 1400 400"><defs><marker id="arP9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="215" y="40" font-size="24" text-anchor="middle" fill="#1f2937">địa chỉ ảo 0x3A7F</text><rect x="40" y="60" width="140" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="110.0" y="106" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><rect x="180" y="60" width="210" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="285.0" y="106" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">A7F</text><text x="128" y="160" font-size="22" text-anchor="middle" fill="#1f2937">số trang</text><text x="255" y="160" font-size="22" text-anchor="middle" fill="#1f2937">độ dời</text><text x="725" y="25" font-size="24" text-anchor="middle" fill="#1f2937">bảng trang</text><rect x="560" y="40" width="330" height="56" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="575" y="77" font-size="24" fill="#1f2937" font-weight="normal">mục 0</text><rect x="560" y="96" width="330" height="56" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="575" y="133" font-size="24" fill="#1f2937" font-weight="normal">mục 1</text><rect x="560" y="152" width="330" height="56" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="575" y="189" font-size="24" fill="#1f2937" font-weight="normal">mục 2</text><rect x="560" y="208" width="330" height="56" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="575" y="245" font-size="24" fill="#1f2937" font-weight="bold">mục 3: khung 7, có mặt 1</text><rect x="560" y="264" width="330" height="56" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="575" y="301" font-size="24" fill="#1f2937" font-weight="normal">…</text><text x="1185" y="40" font-size="24" text-anchor="middle" fill="#1f2937">địa chỉ vật lý 0x7A7F</text><rect x="1010" y="60" width="140" height="70" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1080.0" y="106" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">7</text><rect x="1150" y="60" width="210" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1255.0" y="106" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">A7F</text><text x="1080" y="160" font-size="22" text-anchor="middle" fill="#1f2937">số khung</text><g fill="none" stroke="#1f2937" stroke-width="4"><path d="M62,130 L62,236 L552,236" marker-end="url(#arP9)"/><path d="M890,236 L960,236 L960,95 L1002,95" marker-end="url(#arP9)"/></g><path d="M345,130 L345,350 L1255,350 L1255,140" fill="none" stroke="#16a34a" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arP9)"/><text x="770" y="385" font-size="22" text-anchor="middle" fill="#15803d">độ dời đi thẳng, không qua bảng</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy đường đi của một địa chỉ. Địa chỉ ảo bị cắt làm hai phần, số trang 3 ở bên trái và độ dời A 7 F ở bên phải. Số trang đi vào bảng trang, tìm tới mục 3, ở đó ghi khung 7 và bit có mặt bằng 1, nên khung 7 trở thành phần đầu của địa chỉ vật lý. Độ dời thì đi thẳng sang theo đường nét đứt, không qua bảng, vì vị trí trong trang cũng chính là vị trí trong khung."

  - id: example
    kind: example
    title: "Dịch địa chỉ 0x3A7F"
    checks:
      - "(0x3A7F >> 12, 0x3A7F & 0xFFF) == (3, 0xA7F)"
      - "(7 << 12) | 0xA7F == 0x7A7F"
    steps:
      - show: |
          <p><b>Bước 1</b> — số trang: bỏ 12 bit thấp, tức 3 chữ số cuối.</p>
          $$\texttt{0x3A7F} \gg 12 = \hl{3}$$
        focus: [1, 2]
        say: "Bây giờ làm lại từng bước bằng số. Bước một, tìm số trang của địa chỉ 3 A 7 F hệ mười sáu, dịch phải 12 bit, tức là bỏ 3 chữ số cuối, được trang 3."
      - show: |
          <p><b>Bước 2</b> — độ dời: giữ 12 bit thấp, tức 3 chữ số cuối.</p>
          $$\text{độ dời} = \hl{\texttt{0xA7F}}$$
        focus: [1, 2]
        say: "Bước hai, tìm độ dời, ta giữ 12 bit thấp, tức là 3 chữ số cuối. Độ dời là A 7 F hệ mười sáu."
      - clear: true
        show: |
          <p><b>Bước 3</b> — tra bảng trang ở mục 3:</p>
          <table class="t"><tr><th>mục</th><th>khung</th><th>có mặt</th></tr><tr><td>3</td><td>$\hl{7}$</td><td>1</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước ba, tra bảng trang của tiến trình ở mục 3. Mục này ghi khung 7. Bit có mặt bằng 1, nên trang đang nằm trong bộ nhớ và ta dùng được ngay."
      - show: |
          <p><b>Bước 4</b> — ghép: dịch số khung trái 12 bit, rồi cộng độ dời giữ nguyên.</p>
          $$(7 \ll 12) + \texttt{0xA7F} = \texttt{0x7000} + \texttt{0xA7F} = \hl{\texttt{0x7A7F}}$$
        focus: [1, 2]
        say: "Bước bốn, ghép lại, dịch khung 7 sang trái 12 bit được 7 0 0 0 hệ mười sáu. Cộng độ dời giữ nguyên A 7 F, ta được địa chỉ vật lý 7 A 7 F hệ mười sáu."

  # ───────────────────────── 4. HAI TẦNG ─────────────────────────
  - id: twolevel
    kind: concept
    title: "Bảng trang hai tầng"
    checks:
      - "2 ** 20 * 4 == 4 * 2 ** 20 and 4096 + 2 * 4096 == 12288"
      - "(0x00403ABC >> 22, (0x00403ABC >> 12) & 0x3FF, 0x00403ABC & 0xFFF) == (1, 3, 0xABC)"
      - "0x00403ABC == 0x00400000 + 0x3ABC and 0x00400000 == 2 ** 22 == 4 * 2 ** 20 and 0x3ABC >> 12 == 3 and 0x3ABC & 0xFFF == 0xABC"
      - "2 ** 20 * 4 == 2 ** 22"
      - "1024 * 4096 == 4 * 2 ** 20 and len({a >> 22 for a in range(0, 8 * 2 ** 20, 4096)}) == 2 and len({a >> 22 for a in range(2 ** 20, 9 * 2 ** 20, 4096)}) == 3 and 4096 + 3 * 4096 == 16 * 1024"
    steps:
      - show: |
          <p>Bảng phẳng (một tầng): $2^{20}$ mục × 4 byte = $2^{22}$ byte = <b>4 MiB</b> (1 MiB = $2^{20}$ byte) cho <b>mỗi</b> tiến trình — kể cả tiến trình chỉ dùng vài trang.</p>
          <p>Hai tầng: chia 20 bit số trang thành 10 bit chọn mục trong <b>thư mục</b> (bảng tầng ngoài, mỗi mục trỏ tới một bảng con) + 10 bit chọn mục trong <b>bảng con</b> (ghi số khung). Thư mục 1024 mục; bảng con nào không dùng thì <b>không cấp</b>.</p>
          <p>Tiến trình dùng 8 MiB liền: thư mục 4 KiB + 2 bảng con × 4 KiB = $\hl{12}$ KiB, thay vì 4 MiB.</p>
          <p class="note">Mỗi bảng con phủ 1024 trang × 4 KiB = 4 MiB, nên con số 2 đúng khi vùng nhớ bắt đầu ở một mốc chia hết cho 4 MiB; lệch mốc thì vùng chạm 3 bảng con, tổng 16 KiB.</p>
        focus: [1, 2, 2, 2, 3, 4, 4]
        say: "Bảng trang phẳng, tức một tầng, có 2 mũ 20 mục, mỗi mục 4 byte, tức 2 mũ 22 byte, bằng 4 MiB cho mỗi tiến trình, kể cả tiến trình chỉ dùng vài trang. Bảng hai tầng chia 20 bit số trang thành 10 bit chọn mục trong thư mục và 10 bit chọn mục trong bảng con. Thư mục là bảng tầng ngoài, mỗi mục của nó trỏ tới một bảng con, còn bảng con mới ghi số khung. Thư mục có 1024 mục, và bảng con nào không dùng thì không cấp. Một tiến trình dùng 8 MiB liền nhau chỉ cần thư mục 4 KiB cộng 2 bảng con, tổng 12 KiB thay vì 4 MiB. Con số 2 bảng con chỉ đúng khi vùng nhớ bắt đầu ở một mốc chia hết cho 4 MiB, vì mỗi bảng con phủ 1024 trang. Nếu lệch mốc, vùng nhớ chạm 3 bảng con, tổng cộng 16 KiB."
      - clear: true
        show: |
          <p>Ví dụ $\texttt{0x00403ABC} =\texttt{0x00400000} + \texttt{0x3ABC}$. Phần $\texttt{0x00400000} = 2^{22}$ = đúng 1 lần 4 MiB → 10 bit đầu = 1. Phần $\texttt{0x3ABC}$: trang 3, độ dời $\texttt{0xABC}$ → 10 bit giữa = 3.</p>
          <p>Vậy: thư mục mục 1 → bảng con mục 3 → khung.</p>
          <p class="note">Giá phải trả: bảng một tầng, mỗi lần đọc dữ liệu tốn <b>2</b> lần đọc bộ nhớ (1 mục bảng + 1 dữ liệu); hai tầng tốn <b>3</b> lần (2 mục bảng + 1 dữ liệu).</p>
        focus: [1, 1, 1, 2, 3, 3]
        say: "Ví dụ địa chỉ 0 0 4 0 3 A B C hệ mười sáu, ta tách nó thành 0 0 4 0 0 0 0 0 cộng 3 A B C. Phần đầu bằng 2 mũ 22, đúng một lần 4 MiB, nên 10 bit đầu bằng 1. Còn phần 3 A B C nằm ở trang 3 với độ dời A B C, nên 10 bit giữa bằng 3. Vậy tra mục 1 của thư mục, rồi mục 3 của bảng con, để ra khung. Giá phải trả là với bảng một tầng, mỗi lần đọc dữ liệu đã tốn 2 lần đọc bộ nhớ, một cho mục bảng trang và một cho chính dữ liệu. Với hai tầng thì tốn tới 3 lần, vì phải đọc cả mục thư mục lẫn mục bảng con."

  # ───────────────────────── 4b. BỘ ĐỆM DỊCH ĐỊA CHỈ ─────────────────────────
  - id: tlb
    kind: concept
    title: "Bộ đệm dịch địa chỉ: nhớ sẵn vài lần dịch gần đây"
    checks:
      - "[a >> 12 for a in (0x3A7F, 0x3A80, 0x3B00, 0x5004)] == [3, 3, 3, 5]"
      - "2 + 1 + 1 + 2 == 6 and 4 * 2 == 8"
      - "round(0.8 * 10 + 0.2 * 20, 9) == 12 and round(0.99 * 10 + 0.01 * 20, 9) == 10.1"
      - "round(0.99 * 10 + 0.01 * 30, 9) == 10.2 and 10 + 10 + 10 == 30 and 30 / 10 == 3"
    steps:
      - clear: true
        show: |
          <p><b>Bộ đệm dịch địa chỉ</b> (tiếng Anh: TLB): một bảng rất nhỏ, rất nhanh nằm ngay trong bộ xử lý, ghi lại vài cặp <b>số trang → số khung</b> vừa dịch xong.</p>
          <p>Tra thấy số trang trong bộ đệm: <b>trúng</b> — bỏ qua bảng trang. Không thấy: <b>trượt</b> — đọc bảng trang như cũ, rồi ghi cặp đó vào bộ đệm.</p>
          <p>Vì sao bộ đệm nhỏ mà hay trúng: một trang có 4096 byte, chương trình thường đọc nhiều byte liền nhau trong cùng một trang trước khi sang trang khác.</p>
        focus: [1, 1, 2, 2, 3]
        say: "Phần cứng giấu bớt chi phí đó bằng một bộ đệm dịch địa chỉ. Đây là một bảng rất nhỏ và rất nhanh nằm ngay trong bộ xử lý, ghi lại vài cặp số trang và số khung vừa dịch xong. Khi tra thấy số trang trong bộ đệm, ta gọi là trúng, và bỏ qua được bảng trang trong bộ nhớ. Khi không thấy, ta gọi là trượt, máy đọc bảng trang như cũ rồi ghi cặp đó vào bộ đệm cho lần sau. Bộ đệm nhỏ mà vẫn hay trúng, vì một trang có 4096 byte, và chương trình thường đọc nhiều byte liền nhau trong cùng một trang trước khi sang trang khác."
      - clear: true
        show: |
          <p>Ví dụ: bảng trang một tầng, bộ đệm lúc đầu trống, chương trình đọc lần lượt 4 địa chỉ.</p>
          <table class="t"><tr><th>địa chỉ</th><th>số trang</th><th>bộ đệm</th><th>số lần đọc bộ nhớ</th></tr>
          <tr><td>0x3A7F</td><td>3</td><td>trượt → ghi cặp (3 → 7)</td><td>2</td></tr>
          <tr><td>0x3A80</td><td>3</td><td>trúng</td><td>1</td></tr>
          <tr><td>0x3B00</td><td>3</td><td>trúng</td><td>1</td></tr>
          <tr><td>0x5004</td><td>5</td><td>trượt → ghi cặp của trang 5</td><td>2</td></tr></table>
          <p>Tổng 2 + 1 + 1 + 2 = $\hl{6}$ lần đọc, thay vì 4 × 2 = 8 khi không có bộ đệm.</p>
        focus: [1, "2.2", "2.2", "2.3", "2.4", "2.5", 3]
        say: "Ta thử một ví dụ nhỏ, bảng trang một tầng, bộ đệm lúc đầu trống, và chương trình đọc lần lượt bốn địa chỉ. Địa chỉ 3 A 7 F hệ mười sáu thuộc trang 3, bộ đệm chưa có nên trượt, máy đọc mục bảng trang rồi đọc dữ liệu, tốn 2 lần. Máy cũng ghi cặp trang 3, khung 7 vào bộ đệm cho lần sau. Địa chỉ 3 A 8 0 hệ mười sáu cũng thuộc trang 3, nên trúng, chỉ tốn 1 lần đọc dữ liệu. Địa chỉ 3 B 0 0 hệ mười sáu vẫn thuộc trang 3, lại trúng, cũng chỉ 1 lần đọc. Địa chỉ 5 0 0 4 hệ mười sáu thuộc trang 5, bộ đệm chưa có nên trượt, tốn 2 lần đọc. Tổng cộng 2 cộng 1 cộng 1 cộng 2 bằng 6 lần đọc bộ nhớ, thay vì 4 nhân 2 bằng 8 nếu không có bộ đệm."
      - clear: true
        show: |
          <p><b>Thời gian truy cập hiệu dụng</b> $T$: thời gian trung bình của một lần đọc, tính theo <b>tỉ lệ trúng</b> $h$ (phần các lần tra thấy ngay trong bộ đệm):</p>
          $$T = h \times (\text{thời gian khi trúng}) + (1 - h) \times (\text{thời gian khi trượt})$$
          <table class="t"><tr><th>số minh hoạ: một lần đọc bộ nhớ 10 ns, tra bộ đệm coi như 0</th><th>phép tính</th><th>$T$</th></tr>
          <tr><td>một tầng, trúng 80%</td><td>0,8 × 10 + 0,2 × 20</td><td>12 ns</td></tr>
          <tr><td>một tầng, trúng 99%</td><td>0,99 × 10 + 0,01 × 20</td><td>10,1 ns</td></tr>
          <tr><td>hai tầng, trúng 99%</td><td>0,99 × 10 + 0,01 × 30</td><td>$\hl{10{,}2}$ ns</td></tr>
          <tr><td>hai tầng, không có bộ đệm</td><td>10 + 10 + 10</td><td>30 ns</td></tr></table>
        focus: [1, 2, "3.1", "3.2", "3.3", "3.4", "3.5"]
        say: "Để đo lợi ích, ta dùng thời gian truy cập hiệu dụng, tức thời gian trung bình của một lần đọc, tính theo tỉ lệ trúng h, là phần các lần tra thấy ngay trong bộ đệm. Công thức là h nhân thời gian khi trúng, cộng 1 trừ h nhân thời gian khi trượt. Ta lấy số minh hoạ, mỗi lần đọc bộ nhớ mất 10 phần tỉ giây, và coi thời gian tra bộ đệm bằng 0. Với bảng một tầng trúng 80 phần trăm, khi trúng tốn 10, khi trượt tốn 20, nên được 0 phẩy 8 nhân 10 cộng 0 phẩy 2 nhân 20, bằng 12 phần tỉ giây. Nếu trúng 99 phần trăm thì được 0 phẩy 99 nhân 10 cộng 0 phẩy 01 nhân 20, bằng 10 phẩy 1, gần bằng đọc thẳng một lần. Với hai tầng, khi trượt tốn 3 lần đọc, tức 30, nhưng trúng 99 phần trăm thì vẫn chỉ 10 phẩy 2 phần tỉ giây. Không có bộ đệm thì mọi lần đọc với hai tầng đều tốn 30 phần tỉ giây, gấp ba, nên chính bộ đệm này giấu bớt chi phí của bảng hai tầng."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm"
    checks:
      - "0x7A7F & 0xFFF == 0x3A7F & 0xFFF"
      - "0x3A7F == 14975 and 14975 // 4096 == 3 and 14975 - 3 * 4096 == 2687 and 2687 == 0xA7F"
      - "7 * 4096 == 28672 and 28672 + 2687 == 31359 and 31359 == 0x7A7F"
    steps:
      - show: |
          <ol><li>12 bit thấp của địa chỉ vật lý phải trùng 12 bit thấp của địa chỉ ảo.</li>
          <li>Số bit trang + số bit độ dời = độ dài địa chỉ (20 + 12 = 32).</li>
          <li>Hai tầng: 10 + 10 + 12 = 32, và mỗi bảng con vừa đúng một trang (1024 × 4 byte).</li></ol>
        focus: [0, "1.1", "1.2", "1.3"]
        say: "Tự kiểm bằng ba cách. Một, 12 bit thấp của địa chỉ vật lý phải trùng 12 bit thấp của địa chỉ ảo, vì độ dời không đổi. Hai, số bit trang cộng số bit độ dời bằng độ dài địa chỉ, 20 cộng 12 bằng 32. Ba, với hai tầng, 10 cộng 10 cộng 12 bằng 32, và mỗi bảng con vừa đúng một trang, 1024 mục nhân 4 byte."
      - show: |
          <table class="t"><tr><th>làm lại bằng hệ mười, trang = 4096 byte</th><th>phép tính</th></tr>
          <tr><td>0x3A7F đổi sang hệ mười</td><td>14 975</td></tr>
          <tr><td>số trang = phần nguyên của 14 975 : 4096; độ dời = phần dư</td><td>3, dư 14 975 − 3 × 4096 = 2687 = 0xA7F</td></tr>
          <tr><td>địa chỉ vật lý = khung × 4096 + độ dời</td><td>7 × 4096 + 2687 = 31 359 = $\hl{\texttt{0x7A7F}}$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4"]
        say: "Ta kiểm ví dụ bằng một đường khác, hoàn toàn trong hệ mười, không dịch bit. Đổi 3 A 7 F hệ mười sáu sang hệ mười được 14975. Chia 14975 cho 4096, vì mỗi trang 4096 byte, được phần nguyên 3, đó là số trang. Phần dư là 14975 trừ 3 nhân 4096, bằng 2687, đúng bằng A 7 F hệ mười sáu. Địa chỉ vật lý bằng 7 nhân 4096 cộng 2687, bằng 31359, đổi lại đúng là 7 A 7 F hệ mười sáu."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "__import__('math').ceil(10000 / 4096) == 3 and 3 * 4096 - 10000 == 2288"
      - "2 * 4096 == 8192 < 10000 and 3 * 4096 == 12288"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ phân trang hết mọi phân mảnh <b class="red">(chưa đúng)</b>
          <br><span class="note">Hết phân mảnh ngoài, nhưng trang cuối thừa: chương trình 10 000 byte cần 3 trang, thừa 2288 byte (phân mảnh trong).</span></div>
          <table class="t"><tr><th>số trang 4096 byte</th><th>chứa được</th><th>đủ 10 000?</th></tr>
          <tr><td>2</td><td>8192</td><td>không</td></tr><tr><td>3</td><td>12 288</td><td>có, thừa 12 288 − 10 000 = 2288</td></tr></table>
        focus: [1, 1, 1, 2]
        say: "Lỗi thứ nhất, nghĩ phân trang hết mọi phân mảnh. Nó hết phân mảnh ngoài, nhưng trang cuối vẫn thừa, chương trình 10 nghìn byte cần 3 trang và thừa 2288 byte. Phần thừa nằm ngay bên trong vùng đã cấp như vậy gọi là phân mảnh trong. Bảng cho thấy 2 trang chỉ chứa 8192 byte, chưa đủ, còn 3 trang chứa 12288 byte, thừa 2288."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng chung một bảng trang cho mọi tiến trình <b class="red">(sai)</b>
          <br><span class="note">Mỗi tiến trình một bảng; chuyển ngữ cảnh (lúc bộ xử lý dừng tiến trình này để chạy tiến trình khác) đổi luôn thanh ghi trỏ tới bảng trang.</span></div>
        say: "Lỗi thứ hai, nghĩ mọi tiến trình dùng chung một bảng trang. Mỗi tiến trình có bảng riêng, và khi chuyển ngữ cảnh thì đổi luôn thanh ghi trỏ tới bảng trang. Chuyển ngữ cảnh là lúc bộ xử lý dừng tiến trình này để chạy tiến trình khác."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn trang thật lớn để bảng nhỏ <b class="red">(được mất)</b>
          <br><span class="note">Bảng nhỏ đi, nhưng phân mảnh trong tăng và nạp một trang tốn lâu hơn.</span></div>
        say: "Lỗi thứ ba, chọn trang thật lớn để bảng nhỏ đi. Bảng nhỏ hơn thật, nhưng phân mảnh trong tăng và nạp một trang tốn lâu hơn."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tính kích thước bảng hai tầng như bảng phẳng <b class="red">(sai)</b>
          <br><span class="note">Chỉ cấp bảng con cho vùng có dùng — tiết kiệm đến từ chỗ phần lớn không gian địa chỉ bỏ trống.</span></div>
        say: "Lỗi thứ tư, tính kích thước bảng hai tầng như bảng phẳng. Chỉ những vùng có dùng mới được cấp bảng con, và phần tiết kiệm đến từ chỗ phần lớn không gian địa chỉ bỏ trống."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(0x00C01234 >> 22, (0x00C01234 >> 12) & 0x3FF, 0x00C01234 & 0xFFF) == (3, 1, 0x234)"
      - "(0x5B << 12) | 0x234 == 0x5B234 and 0x5B << 12 == 0x5B000 and 0x5B000 + 0x234 == 0x5B234"
      - "format(0x00C01234, '032b')[:10] == '0000000011' and format(0x00C01234, '032b')[10:20] == '0000000001' and format(0x00C01234, '032b')[20:] == '001000110100'"
    steps:
      - show: |
          <p>Bảng hai tầng 10 + 10 + 12 bit, địa chỉ $\texttt{0x00C01234}$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chỉ số thư mục, chỉ số bảng con, độ dời là bao nhiêu?</td></tr>
          <tr><td>2</td><td>Nếu trang đó nằm ở khung $\texttt{0x5B}$, địa chỉ vật lý là gì?</td></tr></table>
        focus: [0, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Bảng hai tầng chia 10, 10 và 12 bit, địa chỉ là 0 0 C 0 1 2 3 4 hệ mười sáu. Câu một, chỉ số thư mục, chỉ số bảng con và độ dời là bao nhiêu? Câu hai, nếu trang đó nằm ở khung 5 B hệ mười sáu, địa chỉ vật lý là gì? Dừng video và làm ra giấy."
        pause: 12
      - clear: true
        show: |
          <p>① Viết 0x00C01234 thành 32 bit, mỗi chữ số 4 bit, rồi cắt 10 + 10 + 12:</p>
          <table class="t"><tr><th>phần</th><th>bit</th><th>giá trị</th></tr>
          <tr><td>10 bit đầu: thư mục</td><td>0000 0000 11</td><td>$\hl{3}$</td></tr>
          <tr><td>10 bit giữa: bảng con</td><td>00 0000 0001</td><td>$\hl{1}$</td></tr>
          <tr><td>12 bit cuối: độ dời</td><td>0010 0011 0100</td><td>$\hl{\texttt{0x234}}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án câu một, viết địa chỉ thành 32 bit, mỗi chữ số hệ mười sáu 4 bit, rồi cắt thành 10, 10 và 12 bit. Mười bit đầu là tám số 0 rồi hai số 1, bằng 3, đó là chỉ số thư mục. Mười bit giữa chỉ có bit cuối bằng 1, nên chỉ số bảng con là 1. Mười hai bit cuối là 3 chữ số cuối, nên độ dời là 2 3 4 hệ mười sáu."
      - show: |
          <p>② Dịch khung trái 12 bit (thêm 3 chữ số 0), rồi cộng độ dời:</p>
          $$(\texttt{0x5B} \ll 12) + \texttt{0x234} = \texttt{0x5B000} + \texttt{0x234} = \hl{\texttt{0x5B234}}$$
        focus: [1, 2]
        say: "Câu hai, dịch khung 5 B sang trái 12 bit, tức là thêm 3 chữ số 0, được 5 B 0 0 0 hệ mười sáu. Cộng độ dời 2 3 4, được địa chỉ vật lý 5 B 2 3 4 hệ mười sáu."

