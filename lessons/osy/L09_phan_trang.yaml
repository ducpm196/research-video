# Quy ước: địa chỉ ảo 32 bit, trang 4 KiB = 2¹² byte, mục bảng trang 4 byte. Số hệ 16 ghi 0x… trong \texttt; lời đọc tách từng chữ số
#   (“3 A 7 F hệ mười sáu”). Phép tách địa chỉ đã học ở CSA bài 14; bài này nhìn từ phía hệ điều hành và thêm bảng trang hai tầng.
objectives:
  - "Tách địa chỉ thành số trang và độ dời"
  - "Tra bảng trang để được địa chỉ vật lý"
  - "Tính kích thước bảng trang một tầng và hai tầng"
  - "Tính thời gian truy cập hiệu dụng khi có bộ đệm dịch địa chỉ"
