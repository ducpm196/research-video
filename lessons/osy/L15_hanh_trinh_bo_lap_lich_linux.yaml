assumes: [arith]
# Quy ước: “bộ lập lịch thời gian hằng” = O(1) scheduler (2002); “bộ lập lịch hoàn toàn công bằng” = CFS (2007);
#   “bộ lập lịch hạn chót ảo” = EEVDF (2023); “lớp lập lịch mở rộng” = sched_ext (2024); “thời gian chạy ảo” = vruntime;
#   “độ trễ hưởng” = lag; “lát thời gian” = time slice. Tên viết tắt và chữ Linux chỉ trên màn hình; lời đọc dùng tên tiếng Việt mô tả
#   (probe audit/osy/probes/p2_hanh_trinh.md; Linux trượt probe ở CLD). Như các bài OSY khác, lời đọc nói “bộ xử lý” (màn hình CPU),
#   “mi li giây” (ms), “phần triệu giây” (µs), “phần tỉ giây” (ns). Mọi sự kiện và con số có nguồn ghi trong audit/osy/sources_L15.md.
#   SỐ MINH HOẠ: 1000 tiến trình sẵn sàng, 1 tiến trình còn lượng tử trên máy 8 CPU, 3 tác vụ lượt 4 ms, lát 3 ms và 9 ms,
#   100 tác vụ trong đó 10 chọn bộ lập lịch thử nghiệm, máy chủ 8 CPU ở phần quyết định.
objectives:
  - "Kể lại hành trình bộ lập lịch CPU của Linux qua năm chặng từ 2002 tới 2024, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại số lần xem mỗi giây, phần CPU theo tác vụ và theo nhóm, và thứ tự chạy theo hạn chót ảo"
  - "Chọn cách chia CPU hợp với quy mô của chính mình, kèm điều kiện đổi lựa chọn"
