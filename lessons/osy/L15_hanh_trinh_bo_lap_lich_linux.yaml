scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai mươi hai năm sửa một câu hỏi: chạy tiến trình nào tiếp?"
    checks:
      - "2024 - 2002 == 22"
    steps:
      - show: |
          <p>Năm 2002, bộ lập lịch của nhân Linux phải <b>duyệt hết</b> mọi tiến trình sẵn sàng mỗi lần chọn; trên máy 8 CPU, có lúc nhiều CPU <b>ngồi không</b> dù còn việc.</p>
          <p>Năm 2007, người dùng máy để bàn gặp cảnh nhạc <b>bị vấp</b> khi có tiến trình chạy vòng lặp vô tận.</p>
          <p>Năm 2023, một tiến trình cần CPU <b>ít nhưng nhanh</b> vẫn chưa có cách nói điều đó với bộ lập lịch.</p>
          <div class="box key">Hôm nay: năm chặng từ 2002 tới 2024, tức 22 năm — mỗi quy mô làm lộ ra điểm nghẽn nào, và đội phát triển nhân đã xử lý ra sao.</div>
        focus: [1, 1, 2, 3, 4]
        say: "Chào bạn, năm 2002, bộ lập lịch của nhân hệ điều hành ghi trên màn hình phải duyệt hết mọi tiến trình sẵn sàng mỗi lần chọn. Trên máy 8 bộ xử lý, có lúc nhiều bộ xử lý ngồi không dù vẫn còn việc. Năm 2007, người dùng máy để bàn gặp cảnh nhạc bị vấp khi có một tiến trình chạy vòng lặp vô tận. Năm 2023, một tiến trình cần bộ xử lý ít nhưng cần nhanh vẫn chưa có cách nói điều đó. Hôm nay ta đi qua năm chặng trong 22 năm, xem mỗi quy mô làm lộ ra điểm nghẽn nào và đã được xử lý ra sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "1000 * 5e-6 == 0.005"
      - "sum(alg.sched_waits([24, 3, 3])) / 3 == 17"
      - "alg.rr_waits([24, 3, 3], 4) == [6, 4, 7]"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 0</td><td>mỗi lần <b>chuyển ngữ cảnh</b> tốn thời gian CPU</td><td>1000 lần mỗi giây, 5 µs mỗi lần → 0,5% CPU</td></tr>
          <tr><td>bài 2</td><td><b>một hàng đợi</b>, đến trước phục vụ trước</td><td>24, 3, 3 → chờ trung bình 17 ms</td></tr>
          <tr><td>bài 3</td><td><b>xoay vòng</b> theo lượng tử; ưu tiên thấp có thể bị <b>đói</b></td><td>q = 4: chờ 6, 4, 7 ms</td></tr>
          <tr><td>bài 5</td><td><b>khoá</b>: một bên giữ, các bên khác phải chờ</td><td>2 CPU cùng muốn sửa hàng đợi → 1 CPU chờ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều đã học ở các bài trước. Ở bài 0, 1000 lần chuyển ngữ cảnh mỗi giây, mỗi lần 5 phần triệu giây, tốn nửa phần trăm thời gian bộ xử lý. Ở bài 2, một hàng đợi đến trước phục vụ trước với ba việc 24, 3, 3 cho thời gian chờ trung bình 17 mi li giây. Ở bài 3, xoay vòng lượng tử 4 cho thời gian chờ 6, 4 và 7, còn tiến trình ưu tiên thấp có thể bị đói. Ở bài 5, khoá chỉ cho một bên giữ, nên hai bộ xử lý cùng muốn sửa một hàng đợi thì một bên phải chờ."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>hàng đợi sẵn sàng</b> (runqueue)</td><td>danh sách tiến trình đang chờ CPU</td></tr>
          <tr><td><b>thời gian hằng</b>, viết O(1)</td><td>số bước không tăng khi số tiến trình tăng</td></tr>
          <tr><td><b>thời gian chạy ảo</b> (vruntime)</td><td>thời gian đã chạy, quy đổi theo phần được hưởng</td></tr>
          <tr><td><b>độ trễ hưởng</b> (lag)</td><td>phần lẽ ra được chạy trừ phần đã chạy; dương là đang bị nợ</td></tr>
          <tr><td><b>lát thời gian</b> (slice)</td><td>một lần được chạy liền, giống lượng tử ở bài 3</td></tr>
          <tr><td><b>đường cũ dự phòng</b></td><td>cách mặc định mà hệ tự quay về khi cách mới hỏng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài dùng sáu thuật ngữ của nghề lập lịch. Hàng đợi sẵn sàng là danh sách tiến trình đang chờ bộ xử lý. Thời gian hằng, viết là O một, nghĩa là số bước không tăng khi số tiến trình tăng. Thời gian chạy ảo là thời gian đã chạy, quy đổi theo phần được hưởng. Độ trễ hưởng là phần lẽ ra được chạy trừ phần đã chạy, dương nghĩa là đang bị nợ. Lát thời gian là một lần được chạy liền, giống lượng tử ở bài 3. Đường cũ dự phòng là cách mặc định mà hệ tự quay về khi cách mới hỏng."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2002</text><text x="160" y="200">mỗi CPU một hàng đợi</text><text x="160" y="232">thời gian hằng O(1)</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2007</text><text x="500" y="200">hoàn toàn công bằng</text><text x="500" y="232">thời gian chạy ảo</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2008</text><text x="850" y="200">công bằng theo nhóm</text><text x="850" y="232">nhiều người, nhiều dịch vụ</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2023</text><text x="1200" y="200">hạn chót ảo</text><text x="1200" y="232">lát ngắn được chạy sớm</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2024</text><text x="1540" y="200">lớp lập lịch mở rộng</text><text x="1540" y="232">có đường cũ dự phòng</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → nhiều người dùng → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1]
        say: "Hình là trục thời gian với năm chặng của hành trình, từ 2002 tới 2024. Mỗi mốc ghi ý chính của chặng đó, từ hàng đợi riêng cho mỗi bộ xử lý tới lớp lập lịch mở rộng có đường cũ dự phòng."

  # ───────────────────────── 5. CƠ CHẾ CHUNG ─────────────────────────
  - id: vrt
    kind: concept
    title: "Cơ chế chung từ 2007: ai chạy ít nhất thì chạy tiếp"
    checks:
      - "alg.cfs_run([1024, 1024, 1024], 4, 6) == ([0, 1, 2, 0, 1, 2], [8, 8, 8])"
    steps:
      - show: |
          <div><svg width="1500" height="300" viewBox="0 0 1500 300">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" fill="#1f2937">
          <text x="40" y="78">A</text><rect x="90" y="52" width="320" height="38" fill="#2a78d6"/><text x="425" y="80">8 ms</text>
          <text x="40" y="148">B</text><rect x="90" y="122" width="160" height="38" fill="#eb6834"/><text x="265" y="150">4 ms — nhỏ nhất</text>
          <text x="40" y="218">C</text><rect x="90" y="192" width="320" height="38" fill="#7c3aed"/><text x="425" y="220">8 ms</text>
          </g>
          <line x1="900" y1="141" x2="640" y2="141" stroke="#059669" stroke-width="3" marker-end="url(#ah)"/>
          <g font-size="24" fill="#059669"><text x="920" y="133">bộ lập lịch chọn tác vụ có</text><text x="920" y="167">thời gian chạy ảo nhỏ nhất</text></g>
          <text x="90" y="280" font-size="22" fill="#6b7280">thanh = thời gian chạy ảo; chạy 4 ms thì thanh dài thêm 4 ms</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là cơ chế chung của các chặng từ năm 2007. Mỗi tác vụ có một thanh đo thời gian chạy ảo, và bộ lập lịch luôn chọn thanh ngắn nhất, ở đây là B với 4 mi li giây. B chạy 4 mi li giây thì thanh của nó dài thêm 4, bằng A và C. Cứ thế, sau 6 lượt 4 mi li giây, cả ba được đúng 8 mi li giây mỗi tác vụ."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2002 — khai sinh: mỗi CPU một hàng đợi"
    stage: {year: "2002", scale: "máy nhiều CPU (ví dụ 8 CPU) và rất nhiều tiến trình sẵn sàng; bộ lập lịch của nhánh 2.4 duyệt mọi tiến trình mỗi lần chọn", source: "[O102] [KN23] [CFS]", practice: "mỗi CPU một hàng đợi và khoá riêng, không vòng lặp nào duyệt hết tiến trình; điều kiện: có bộ cân bằng tải chuyển việc giữa các CPU"}
    checks:
      - "alg.goodness_scan(1000, 8) == (999, 7)"
      - "1000 * 1000 == 10**6 and 7 / 8 == 0.875"
    steps:
      - show: |
          <p><b>Quy mô:</b> máy nhiều CPU, như máy <b>8 CPU</b> mà thư năm 2002 lấy làm ví dụ, và <b>rất nhiều</b> tiến trình sẵn sàng.</p>
          <table class="t"><tr><th>điểm nghẽn của bộ lập lịch nhánh 2.4</th><th>nối về bài nền</th></tr>
          <tr><td>mỗi lần chọn, một vòng lặp <b>duyệt hết</b> hàng đợi để chấm điểm từng tiến trình</td><td>bài 2: một hàng đợi chung</td></tr>
          <tr><td>một <b>khoá lớn</b> cho cả hàng đợi: mọi CPU tranh nhau</td><td>bài 5: một bên giữ, bên khác chờ</td></tr>
          <tr><td>chỉ chia lại lượng tử khi <b>mọi</b> tiến trình đang chạy đã dùng hết: càng nhiều CPU, càng nhiều CPU ngồi không</td><td>bài 3: lượng tử</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ở chặng một, năm 2002, máy đã có nhiều bộ xử lý, như máy 8 bộ xử lý trong một thư gửi nhóm phát triển nhân. Bộ lập lịch cũ chấm điểm từng tiến trình bằng một vòng lặp duyệt hết hàng đợi mỗi lần chọn. Cả hàng đợi chỉ có một khoá lớn, nên theo bài 5, mọi bộ xử lý phải tranh nhau khoá đó. Lượng tử chỉ được chia lại khi mọi tiến trình đang chạy đã dùng hết phần, nên càng nhiều bộ xử lý thì càng nhiều bộ xử lý ngồi không."
      - clear: true
        show: |
          <table class="t"><tr><th>cách xử lý (thư ngày 4/1/2002)</th><th>vì sao</th></tr>
          <tr><td><b>mỗi CPU một hàng đợi</b> và một khoá riêng</td><td>hai CPU chọn việc song song, không chờ nhau</td></tr>
          <tr><td>hai mảng xếp theo ưu tiên: <b>đang chạy</b> và <b>hết lượt</b>; mảng đang chạy rỗng thì <b>đổi hai con trỏ</b></td><td>không có vòng lặp chia lại lượng tử</td></tr>
          <tr><td>một <b>bảng bit</b> đánh dấu mức ưu tiên nào có việc (140 mức)</td><td>tìm mức cao nhất bằng vài lệnh tìm bit</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Thư ngày 4 tháng 1 năm 2002 mô tả cách xử lý gồm ba ý chính. Mỗi bộ xử lý có một hàng đợi và một khoá riêng, nên hai bộ xử lý chọn việc song song mà không chờ nhau. Mỗi hàng đợi có hai mảng xếp theo ưu tiên, đang chạy và hết lượt, và khi mảng đang chạy rỗng thì chỉ cần đổi hai con trỏ. Một bảng bit đánh dấu mức nào trong 140 mức ưu tiên đang có việc, nên tìm mức cao nhất chỉ mất vài lệnh tìm bit."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. cách cũ, 1000 tiến trình sẵn sàng (số minh hoạ)</td><td>chọn một lần: so 1000 tiến trình với nhau</td><td>$\hl{999}$ phép so sánh</td></tr>
          <tr><td>Bước 2. 1000 lần chọn mỗi giây, như bài 0</td><td>1000 nhân 1000 tiến trình phải xem</td><td>$\hl{1\,000\,000}$ lần xem mỗi giây</td></tr>
          <tr><td>Bước 3. cách mới</td><td>tra bảng bit 140 mức, rồi lấy đầu danh sách</td><td>$\hlg{\text{không đổi}}$ dù 1000 hay 10&nbsp;000 tiến trình</td></tr>
          <tr><td>Bước 4. 8 CPU, chỉ 1 tiến trình còn lượng tử (số minh hoạ)</td><td>7 chia 8</td><td>$\hl{87{,}5\%}$ số CPU ngồi chờ chia lại</td></tr></table>
          <p class="note">Thực hành: tách dữ liệu chung thành phần riêng của từng CPU, bỏ mọi vòng lặp duyệt hết. Điều kiện: phải có bộ cân bằng tải chuyển việc giữa các CPU, nếu không CPU này quá tải trong khi CPU kia rảnh.</p>
        focus: ["1.2", "1.3", "1.4", "1.5", 2]
        say: "Làm thử với 1000 tiến trình sẵn sàng, một số minh hoạ, thì bước một, cách cũ so 1000 tiến trình với nhau để chọn một, tức 999 phép so sánh. Bước hai, với 1000 lần chọn mỗi giây như ở bài 0, máy phải xem một triệu lần mỗi giây. Bước ba, cách mới tra bảng bit 140 mức rồi lấy đầu danh sách, nên số bước không đổi dù có 10 nghìn tiến trình. Bước bốn, máy 8 bộ xử lý mà chỉ một tiến trình còn lượng tử thì 7 chia 8, tức 87 phẩy 5 phần trăm số bộ xử lý ngồi chờ. Thực hành là tách dữ liệu chung thành phần riêng của từng bộ xử lý, với điều kiện có bộ cân bằng tải."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2007 — tăng trưởng: thay phép đoán bằng phép đo"
    stage: {year: "2007", scale: "máy để bàn có giao diện, trình phát nhạc, và tiến trình chạy vòng lặp vô tận; bản 2.6.23 ngày 9/10/2007, viết lại khoảng 70% mã bộ lập lịch", source: "[KN23] [CFS] [O102]", practice: "thay bộ đoán tính tương tác bằng một đại lượng đo được: luôn chạy tác vụ có thời gian chạy ảo nhỏ nhất; điều kiện: công bằng đúng là điều người dùng cần"}
    checks:
      - "alg.cfs_run([1024, 1024], 1, 10)[1] == [5, 5] and 100 // 2 == 50"
      - "alg.cfs_run([1024, 1024, 1024], 4, 6)[1] == [8, 8, 8] and 8 * 3 == 24"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> bộ lập lịch thời gian hằng có một <b>bộ đoán tính tương tác</b>: một vòng đệm 4 ô ghi lại hoạt động của tiến trình trong 4 giây gần nhất, tiến trình đòi nhiều CPU thì bị <b>hạ ưu tiên</b>.</p>
          <p>Nhiều người dùng báo các ca không chạy như mong đợi: tiến trình chạy vòng lặp vô tận làm giao diện chậm, nhạc bị vấp. Sửa ca này lại mở ra ca khác.</p>
          <div class="box warn">Kernel Newbies, 2007: đó là trường hợp điển hình của một thuật toán dùng thống kê để <b>đoán tương lai</b> bằng mẹo, và đoán trượt.</div>
        focus: [1, 1, 2, 3]
        say: "Ở chặng hai, bộ lập lịch thời gian hằng có một bộ đoán tính tương tác, ghi hoạt động của tiến trình trong 4 giây gần nhất vào một vòng đệm 4 ô. Tiến trình nào đòi nhiều bộ xử lý thì bị hạ ưu tiên. Nhiều người dùng vẫn gặp ca giao diện chậm, nhạc bị vấp khi có vòng lặp vô tận, và sửa ca này lại mở ra ca khác. Trang tổng kết bản phát hành năm 2007 gọi đó là thuật toán dùng thống kê để đoán tương lai bằng mẹo, và đoán trượt."
      - clear: true
        show: |
          <table class="t"><tr><th>cách xử lý: bộ lập lịch hoàn toàn công bằng (bản 2.6.23, 9/10/2007)</th><th>vì sao</th></tr>
          <tr><td>mô phỏng một <b>CPU lý tưởng</b>: n tác vụ thì mỗi tác vụ chạy với 1/n tốc độ</td><td>2 tác vụ → mỗi tác vụ 50%</td></tr>
          <tr><td>luôn chạy tác vụ có <b>thời gian chạy ảo nhỏ nhất</b>, giữ trong một cây xếp theo thời gian</td><td>ai chạy ít nhất thì chạy tiếp, ai rồi cũng tới lượt</td></tr>
          <tr><td>đo thời gian bằng nano giây; <b>không có mẹo đoán</b>, chỉ một tham số chỉnh chính</td><td>đo thay cho đoán</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bản 2 chấm 6 chấm 23, ngày 9 tháng 10 năm 2007, đưa vào bộ lập lịch hoàn toàn công bằng. Nó mô phỏng một bộ xử lý lý tưởng, n tác vụ thì mỗi tác vụ chạy với một phần n tốc độ, nên 2 tác vụ mỗi bên được 50 phần trăm. Nó luôn chạy tác vụ có thời gian chạy ảo nhỏ nhất, giữ trong một cây xếp theo thời gian, nên tác vụ nào rồi cũng tới lượt. Thời gian được đo tới từng phần tỉ giây, không có mẹo đoán, chỉ một tham số chỉnh chính."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. vòng lặp vô tận và trình phát nhạc, cùng muốn chạy</td><td>100% chia 2 tác vụ</td><td>$\hlg{50\%}$ mỗi bên, không ai bị đói</td></tr>
          <tr><td>Bước 2. ba tác vụ A, B, C, mỗi lượt 4 ms (số minh hoạ)</td><td>chọn thanh ngắn nhất, 6 lượt</td><td>thứ tự A, B, C, A, B, C</td></tr>
          <tr><td>Bước 3. phần mỗi tác vụ</td><td>2 lượt nhân 4 ms</td><td>$\hlg{8}$ ms mỗi tác vụ, đủ 24 ms</td></tr></table>
          <p class="note">Thực hành: thay phép đoán bằng một đại lượng <b>đo được</b>. Điều kiện: “chia đều” phải đúng là điều cần — chặng 3 và chặng 4 cho thấy không phải lúc nào cũng vậy.</p>
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Bước một, vòng lặp vô tận và trình phát nhạc cùng muốn chạy thì mỗi bên được 50 phần trăm, không ai bị đói. Bước hai, ba tác vụ ở hình cơ chế, mỗi lượt 4 mi li giây, chạy theo thứ tự A, B, C rồi lặp lại. Bước ba, mỗi tác vụ được 2 lượt nhân 4, tức 8 trong 24 mi li giây. Thực hành rút ra là thay phép đoán bằng một đại lượng đo được, với điều kiện chia đều đúng là điều người dùng cần."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2008 — nhiều người dùng: công bằng theo nhóm"
    stage: {year: "2008", scale: "một máy chia cho nhiều người dùng, nhiều nhóm việc; bản 2.6.24 ngày 24/1/2008 có lập lịch theo nhóm", source: "[KN24] [CFS]", practice: "chia công bằng cho nhóm trước rồi mới tới từng tác vụ, đặt trọng số nhóm; điều kiện: máy thật sự chia cho nhiều người hay nhiều dịch vụ"}
    checks:
      - "[[x * 100 // 40 for x in g] for g in alg.cfs_groups([1, 2], 1, 40)] == [[50], [25, 25]]"
      - "round(100 / 3, 1) == 33.3 and round(200 / 3, 1) == 66.7"
      - "alg.cfs_run([2048, 1024], 1, 30)[1] == [20, 10] and 2048 + 1024 == 3072 == 3 * 1024"
    steps:
      - show: |
          <p><b>Quy mô:</b> một máy chia cho <b>nhiều người dùng</b>, nhiều nhóm việc. Chia đều theo <b>từng tác vụ</b> thì ai chạy nhiều tác vụ hơn sẽ lấy nhiều CPU hơn.</p>
          <p><b>Cách xử lý</b> (bản 2.6.24, ngày 24/1/2008): <b>lập lịch theo nhóm</b> — chia công bằng giữa các nhóm trước, rồi giữa các tác vụ trong nhóm. Người quản trị tạo nhóm tuỳ ý, ví dụ “đa phương tiện”, “biên dịch”, và đặt <b>trọng số</b> cho nhóm.</p>
          <table class="t"><tr><th>bước: người 1 chạy 1 tác vụ, người 2 chạy 2 tác vụ</th><th>chia theo tác vụ</th><th>chia theo nhóm</th></tr>
          <tr><td>Bước 1. phần của người 1</td><td>100 chia 3 ≈ $\hl{33{,}3\%}$</td><td>100 chia 2 = $\hlg{50\%}$</td></tr>
          <tr><td>Bước 2. phần của người 2</td><td>2 phần 3 ≈ $\hl{66{,}7\%}$</td><td>$\hlg{50\%}$, mỗi tác vụ $\hlg{25\%}$</td></tr></table>
        focus: [1, 2, 2, "3.2", "3.3"]
        say: "Ở chặng ba, một máy được chia cho nhiều người dùng, và chia đều theo tác vụ thì ai chạy nhiều tác vụ hơn sẽ lấy nhiều bộ xử lý hơn. Bản 2 chấm 6 chấm 24, ngày 24 tháng 1 năm 2008, thêm lập lịch theo nhóm, chia công bằng giữa các nhóm trước, rồi mới giữa các tác vụ. Người quản trị tạo nhóm tuỳ ý, như nhóm đa phương tiện hay nhóm biên dịch, và đặt trọng số cho từng nhóm. Bước một, người 1 chạy một tác vụ, chia theo tác vụ chỉ được khoảng 33 phẩy 3 phần trăm, chia theo nhóm được đúng 50. Bước hai, người 2 chạy hai tác vụ thì nhận 50 phần trăm, mỗi tác vụ 25."
      - clear: true
        show: |
          <p>Ví dụ trong hướng dẫn chính thức của nhân: nhóm “đa phương tiện” được <b>gấp đôi</b> nhóm “trình duyệt” — trọng số <b>2048</b> và <b>1024</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tổng trọng số</td><td>2048 cộng 1024</td><td>3072, tức 3 phần 1024</td></tr>
          <tr><td>Bước 2. phần của nhóm đa phương tiện</td><td>2048 chia 3072</td><td>$\hlg{2/3}$; chạy 30 ms thì được 20 ms</td></tr>
          <tr><td>Bước 3. phần của nhóm trình duyệt</td><td>1024 chia 3072</td><td>$\hlb{1/3}$; được 10 ms</td></tr></table>
          <p class="note">Thực hành: chia công bằng cho nhóm trước, rồi mới tới tác vụ. Điều kiện: máy thật sự được chia cho nhiều người hay nhiều dịch vụ.</p>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Hướng dẫn chính thức của nhân cho nhóm đa phương tiện gấp đôi nhóm trình duyệt, với trọng số 2048 và 1024. Bước một, tổng trọng số là 3072, tức 3 phần 1024. Bước hai, nhóm đa phương tiện được 2048 chia 3072, là 2 phần 3, nên trong 30 mi li giây nó chạy 20. Bước ba, nhóm trình duyệt được 1 phần 3, tức 10 mi li giây. Thực hành là chia cho nhóm trước rồi mới tới tác vụ, với điều kiện máy thật sự được chia cho nhiều người hay nhiều dịch vụ."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2023 — ổn định: hạn chót ảo cho việc cần nhanh"
    stage: {year: "2023", scale: "bộ lập lịch phải đúng với gần như mọi loại tải trên rất nhiều loại máy; bộ lập lịch công bằng đã chạy từ 2007 với nhiều lần chỉnh; bản 6.6 ngày 29/10/2023 thay bằng hạn chót ảo", source: "[LWN23] [KN66] [EEV]", practice: "cho tiến trình khai báo nhu cầu bằng lát thời gian thay vì đoán; chạy thử cách mới như một tuỳ chọn song song trước khi thay; điều kiện: lát ngắn đổi lấy nhiều lần chuyển ngữ cảnh hơn"}
    checks:
      - "100 // 5 == 20 and 1000 // 5 == 200 and 20 + 10 == 30"
      - "alg.eevdf_run([9, 3], 36) == [(1, 0, 3), (0, 3, 9), (1, 12, 3), (1, 15, 3), (1, 18, 3), (0, 21, 9), (1, 30, 3), (1, 33, 3)]"
      - "alg.eevdf_run([9, 9], 18) == [(0, 0, 9), (1, 9, 9)]"
      - "[i for i, s, d in alg.eevdf_run([9, 3], 36)].count(1) == 6 and [i for i, s, d in alg.eevdf_run([9, 3], 36)].count(0) == 2"
    steps:
      - show: |
          <p><b>Quy mô:</b> bộ lập lịch phải làm đúng cho <b>gần như mọi loại tải</b> trên rất nhiều loại máy. Bộ lập lịch công bằng đã chạy từ 2007, qua rất nhiều lần chỉnh.</p>
          <table class="t"><tr><th>điểm nghẽn (LWN, 3/2023)</th><th>vì sao</th></tr>
          <tr><td>có tiến trình cần CPU <b>ít nhưng nhanh</b>, mà không có cách khai báo điều đó</td><td>mức ưu tiên chỉ cho <b>nhiều CPU hơn</b>, không cho <b>sớm hơn</b></td></tr>
          <tr><td>lớp thời gian thực thì nhanh, nhưng cần đặc quyền</td><td>dùng sai có thể làm hỏng cả phần còn lại của hệ</td></tr>
          <tr><td>phụ thuộc vào các mẹo và tham số chỉnh, thường mong manh</td><td>bài học của chặng 2 lặp lại</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.4"]
        say: "Ở chặng bốn, bộ lập lịch phải đúng với gần như mọi loại tải, và bộ lập lịch công bằng đã qua rất nhiều lần chỉnh từ 2007. Bài phân tích tháng 3 năm 2023 trên trang tin nhân chỉ ra rằng tiến trình cần bộ xử lý ít nhưng nhanh không có cách khai báo điều đó. Mức ưu tiên chỉ cho nhiều bộ xử lý hơn, không cho chạy sớm hơn. Lớp thời gian thực thì nhanh nhưng cần đặc quyền, dùng sai có thể làm hỏng cả phần còn lại của hệ. Bộ lập lịch còn dựa vào các mẹo và tham số chỉnh mong manh, đúng bài học của chặng hai."
      - clear: true
        show: |
          <table class="t"><tr><th>cách xử lý: hạn chót ảo sớm nhất trong số đủ điều kiện (thuật toán từ 1995)</th><th>làm thử (LWN, 2023)</th></tr>
          <tr><td>chia đều như trước: n tác vụ, mỗi tác vụ 1/n</td><td>5 tác vụ → mỗi tác vụ 20%; trong 1 giây là 200 ms</td></tr>
          <tr><td><b>độ trễ hưởng</b> = phần lẽ ra được chạy trừ phần đã chạy; <b>đủ điều kiện</b> khi độ trễ hưởng không âm</td><td>đã chạy quá phần thì phải chờ</td></tr>
          <tr><td><b>hạn chót ảo</b> = lúc đủ điều kiện + lát thời gian; chạy tác vụ có hạn chót <b>sớm nhất</b></td><td>đủ điều kiện sau 20 ms, lát 10 ms → hạn chót 30 ms</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Cách xử lý dựa trên một thuật toán từ năm 1995, chọn hạn chót ảo sớm nhất trong số tác vụ đủ điều kiện. Nó vẫn chia đều, 5 tác vụ thì mỗi tác vụ 20 phần trăm, tức 200 mi li giây trong một giây. Độ trễ hưởng là phần lẽ ra được chạy trừ phần đã chạy, và tác vụ đủ điều kiện khi độ trễ hưởng không âm. Hạn chót ảo bằng lúc đủ điều kiện cộng lát thời gian, nên đủ điều kiện sau 20 mi li giây với lát 10 thì hạn chót là 30."
      - clear: true
        show: |
          <div><svg width="1500" height="230" viewBox="0 0 1500 230">
          <g font-size="24" fill="#1f2937"><text x="20" y="62">B, lát 9 ms</text><text x="20" y="142">A, lát 3 ms</text></g>
