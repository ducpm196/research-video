          <text x="1440" y="205" font-size="22" fill="#6b7280">ms</text>
          </svg></div>
          <table class="t"><tr><th>bước, A lát 3 ms, B lát 9 ms (số minh hoạ), 36 ms</th><th>kết quả</th></tr>
