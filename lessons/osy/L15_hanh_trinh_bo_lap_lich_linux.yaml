          <tr><td>giao diện <b>không cam kết ổn định</b> giữa các bản nhân</td><td>đổi bản nhân thì phải thử lại</td></tr></table>
        focus: [1, 2, "3.3", "3.4", "3.5"]
        say: "Ở chặng năm, bản 6 chấm 12, ngày 17 tháng 11 năm 2024, hoàn tất việc chuyển từ từ sang hạn chót ảo, bắt đầu từ bản 6 chấm 6. Cùng bản đó có lớp lập lịch mở rộng, cho viết thuật toán lập lịch thành chương trình nhỏ nạp vào nhân, để thử nghiệm nhanh hơn. Thuật toán mới bật, tắt được bất cứ lúc nào, và khi có lỗi hay một tác vụ bị treo, nhân tự quay về bộ mặc định. Ở chế độ từng phần, chỉ tác vụ tự chọn mới dùng thuật toán mới. Giao diện này không cam kết ổn định giữa các bản nhân, nên đổi bản nhân thì phải thử lại."
