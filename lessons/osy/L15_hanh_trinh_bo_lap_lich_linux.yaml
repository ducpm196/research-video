        focus: ["1.2", "1.3", "1.4", 2]
        say: "Bước một, bộ lập lịch công bằng làm mặc định từ 2007 tới 2023, tức 16 năm. Bước hai, từ tháng 10 năm 2023 tới tháng 11 năm 2024 là 12 tháng cộng 1, bằng 13 tháng. Bước ba, 100 tác vụ mà 10 tác vụ chọn thuật toán thử nghiệm, một số minh hoạ, thì 90 tác vụ vẫn ở bộ mặc định. Ổn định không có nghĩa là đứng yên, cách mặc định thay chậm, có giai đoạn song song, còn cách mới được thử ở rìa."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "1000 * 1000 == 10**6 and 1000 * 1000 // 1000 == 1000"
      - "50 + 25 + 25 == 100"
      - "2048 == 2 * 1024 and 2 / (2 + 1) == 2048 / 3072"
      - "sum(d for i, s, d in alg.eevdf_run([9, 3], 36) if i == 1) == 6 * 3 == 18 and 6 * 3 + 2 * 9 == 36"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>1&nbsp;000&nbsp;000 lần xem mỗi giây</td><td>đổi sang mili giây: 1 lần chọn mỗi ms, mỗi lần 1000 tiến trình, 1000 ms → 1000 nhân 1000 ✓</td></tr>
          <tr><td>50%, 25%, 25%</td><td>cộng lại: 50 + 25 + 25 = 100% ✓; mỗi người đúng một nửa ✓</td></tr>
          <tr><td>2/3 cho nhóm 2048</td><td>đếm phần: 2048 là 2 lần 1024, tổng 3 phần, nhóm này giữ 2 ✓</td></tr>
          <tr><td>18 ms mỗi bên</td><td>cộng lại cả trục: 6 nhân 3 cộng 2 nhân 9 = 36 ms, đúng bằng thời gian mô phỏng ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Đổi sang mi li giây, mỗi mi li giây một lần chọn, mỗi lần xem 1000 tiến trình, trong 1000 mi li giây là đúng một triệu lần. Cộng lại, 50 cộng 25 cộng 25 là 100 phần trăm, và mỗi người đúng một nửa. Đếm phần, 2048 là 2 lần 1024, tổng có 3 phần, nhóm này giữ 2 phần. Cộng cả trục thời gian, 6 nhân 3 cộng 2 nhân 9 là 36 mi li giây, đúng bằng thời gian mô phỏng."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Bộ lập lịch mới thì chắc nhanh hơn”</td><td>Kernel Newbies, 2008: ở bản 2.6.23, chuyển ngữ cảnh chậm hơn bộ cũ <b>trên 10%</b>; tối ưu ở bản 2.6.24 mới nhanh hơn</td><td>đo bản mới và bản cũ bằng cùng một phép đo, trên tải của mình</td></tr>
          <tr><td><b class="red">2.</b> “Thêm một mẹo đoán nữa là sửa được ca khó”</td><td>bộ đoán tính tương tác: sửa ca này mở ra ca khác; năm 2023 nhân gỡ bớt tham số chỉnh</td><td>tìm đại lượng đo được, hoặc cho tiến trình tự khai báo nhu cầu</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ nhất là nghĩ bộ lập lịch mới thì chắc nhanh hơn. Năm 2008 có ghi nhận bản 2 chấm 6 chấm 23 chuyển ngữ cảnh chậm hơn bộ cũ trên 10 phần trăm. Hãy đo bản mới và bản cũ bằng cùng một phép đo, trên chính tải của mình. Bài học sai thứ hai là nghĩ thêm một mẹo đoán nữa là sửa được ca khó. Bộ đoán tính tương tác cho thấy sửa ca này lại mở ra ca khác, và năm 2023 nhân còn gỡ bớt tham số chỉnh. Hãy tìm đại lượng đo được, hoặc cho tiến trình tự khai báo nhu cầu."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Dịch vụ cần nhanh thì cho chạy lớp thời gian thực”</td><td>cần đặc quyền; dùng sai làm hỏng cả phần còn lại của hệ</td><td>xin lát thời gian ngắn hơn, hoặc đặt trọng số nhóm</td></tr>
          <tr><td><b class="red">4.</b> “Người khổng lồ tự viết bộ lập lịch, mình cũng nên viết”</td><td>giao diện không ổn định giữa các bản nhân; một máy, vài dịch vụ thì mặc định thường đủ</td><td>đo trước; nếu thử thì dùng chế độ từng phần, giữ đường cũ dự phòng</td></tr></table>
        focus: ["1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba là cho dịch vụ cần nhanh chạy lớp thời gian thực, trong khi lớp này cần đặc quyền, nên hãy xin lát ngắn hơn hoặc đặt trọng số nhóm. Bài học sai thứ tư là thấy người khổng lồ tự viết bộ lập lịch thì mình cũng viết. Giao diện của lớp lập lịch mở rộng không ổn định giữa các bản nhân, và một máy vài dịch vụ thì bộ mặc định thường đã đủ. Hãy đo trước, còn nếu thử thì dùng chế độ từng phần, giữ đường cũ dự phòng."

