        focus: [1, "2.2", "2.3", "2.4"]
        say: "Hình mô phỏng hai tác vụ trong 36 mi li giây, A lát 3 và B lát 9, một số minh hoạ. Bước một, lúc 0 hạn chót của A là 3, của B là 9, nên A chạy trước dù B đứng đầu hàng. Bước hai, A chạy 6 lát nhân 3 là 18, B chạy 2 lát nhân 9 cũng là 18, hai bên được đúng phần như nhau. Bước ba, nếu cả hai cùng lát 9 mi li giây, A phải chờ 9 mi li giây mới được chạy lần đầu."
