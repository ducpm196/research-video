          <p>Cùng bản đó có <b>lớp lập lịch mở rộng</b>: viết thuật toán lập lịch thành chương trình nhỏ nạp vào nhân, để <b>thử nghiệm và tuỳ biến nhanh</b> hơn.</p>
          <table class="t"><tr><th>lưới an toàn (hướng dẫn của nhân)</th><th>vì sao</th></tr>
