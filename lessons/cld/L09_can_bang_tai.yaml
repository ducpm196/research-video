scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chia ngẫu nhiên mà vẫn có máy quá tải"
    checks:
      - "alg.lb_max_load(1) == 243 and 20000 // 100 == 200"
    steps:
      - show: |
          <p>20 000 yêu cầu chia ngẫu nhiên cho 100 máy: trung bình mỗi máy 200. Nhưng máy “xui” nhất nhận tới $\hl{243}$ — nhiều hơn trung bình hơn 20%. Độ trễ của cả hệ do máy đó quyết định.</p>
          <div class="box key">Hôm nay: <b>khám phá dịch vụ</b> và <b>cân bằng tải</b> — và một mẹo nhỏ làm phân bố đều hơn hẳn.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, 20 nghìn yêu cầu chia ngẫu nhiên cho 100 máy, trung bình mỗi máy 200. Nhưng máy xui nhất nhận tới 243, nhiều hơn trung bình hơn 20 phần trăm. Độ trễ của cả hệ lại do máy đó quyết định. Hôm nay ta học khám phá dịch vụ và cân bằng tải, cùng một mẹo nhỏ làm phân bố đều hơn hẳn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: phân giải tên, địa chỉ ổn định, trung bình và phần trăm vượt"
    checks:
      - "600 / 3 == 200 and Fraction(220 - 200, 200) == Fraction(1, 10)"
    steps:
      - show: |
          <table class="t"><tr><th>điều đã học</th><th>ví dụ</th></tr>
          <tr><td><b>DNS</b> (khoá Mạng máy tính): đổi một <b>tên</b> thành địa chỉ máy</td><td>hỏi tên <code>don-hang</code>, nhận về một địa chỉ</td></tr>
          <tr><td>bản ghi có <b>thời gian sống</b>: hết hạn thì phải hỏi lại</td><td>sống 30 giây: sau 30 giây hỏi lại</td></tr>
          <tr><td>đối tượng dịch vụ (bài 5): một địa chỉ ổn định trỏ tới các Pod đang sống</td><td>Pod chết, Pod mới thay: địa chỉ dịch vụ không đổi</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bài này dựa trên ba điều đã học. Ở khoá Mạng máy tính, hệ phân giải tên đổi một tên thành địa chỉ máy, ví dụ hỏi tên đơn hàng thì nhận về một địa chỉ. Mỗi bản ghi có thời gian sống, chẳng hạn 30 giây, hết hạn thì phải hỏi lại. Ở bài 5, đối tượng dịch vụ là một địa chỉ ổn định trỏ tới các Pod đang sống, nên khi Pod chết và Pod mới thay chỗ thì địa chỉ dịch vụ vẫn không đổi."
      - show: |
          <table class="t"><tr><th>phép tính</th><th>ví dụ</th></tr>
          <tr><td>trung bình mỗi máy $= \frac{\text{tổng yêu cầu}}{\text{số máy}}$</td><td>$\frac{600}{3} = 200$</td></tr>
          <tr><td>vượt trung bình bao nhiêu phần trăm $= \frac{\text{máy đó} - \text{trung bình}}{\text{trung bình}}$</td><td>$\frac{220 - 200}{200} = 10\%$</td></tr></table>
        introduces: [frac]
        focus: [1, "1.2", "1.3", 0]
        say: "Ta cũng cần hai phép tính đơn giản. Trung bình mỗi máy bằng tổng yêu cầu chia số máy, ví dụ 600 yêu cầu cho 3 máy là 200 mỗi máy. Một máy nhận 220 thì vượt trung bình 20, chia cho 200, tức 10 phần trăm. Con số vượt này cho biết máy nặng nhất phải gánh thêm bao nhiêu so với lúc chia đều tuyệt đối."

  - id: sym
    kind: symbol
    title: "Giải mã: khám phá dịch vụ, ba cách chia tải"
    steps:
      - show: |
          <p><b>Khám phá dịch vụ</b>: gọi bằng <b>tên</b> ổn định (như <code>don-hang</code>), hệ phân giải tên DNS nội bộ trả về địa chỉ; danh sách Pod phía sau được cập nhật tự động.</p>
          <table class="t"><tr><th>cách chia</th><th>làm gì</th></tr>
          <tr><td>vòng tròn</td><td>lần lượt máy 1, 2, 3, … rồi quay lại</td></tr>
          <tr><td>ít kết nối nhất</td><td>gửi tới máy đang ít việc nhất — cần biết tải của <b>mọi</b> máy</td></tr>
          <tr><td>chọn tốt hơn trong hai</td><td>bốc ngẫu nhiên 2 máy, gửi tới máy ít tải hơn</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Khám phá dịch vụ nghĩa là gọi bằng một tên ổn định, hệ phân giải tên nội bộ trả về địa chỉ, và danh sách Pod phía sau được cập nhật tự động. Bảng so ba cách chia tải. Vòng tròn gửi lần lượt máy 1, 2, 3 rồi quay lại. Ít kết nối nhất gửi tới máy đang ít việc nhất, nhưng cần biết tải của mọi máy. Chọn tốt hơn trong hai bốc ngẫu nhiên 2 máy, rồi gửi tới máy ít tải hơn."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một yêu cầu đi đâu: tên, địa chỉ ổn định, rồi một Pod"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><g font-size="23" fill="#1f2937"><rect x="30" y="150" width="140" height="70" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="100" y="193" text-anchor="middle">khách</text><rect x="250" y="40" width="250" height="80" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="375" y="75" text-anchor="middle">phân giải tên</text><text x="375" y="105" text-anchor="middle" font-size="20">tên don-hang ra địa chỉ</text><line x1="170" y1="165" x2="250" y2="100" stroke="#2a78d6" stroke-width="3"/><rect x="250" y="150" width="250" height="70" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="375" y="183" text-anchor="middle">địa chỉ dịch vụ</text><text x="375" y="208" text-anchor="middle" font-size="20">ổn định</text><line x1="170" y1="185" x2="250" y2="185" stroke="#1f2937" stroke-width="3"/><rect x="580" y="150" width="210" height="70" rx="8" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="685" y="193" text-anchor="middle">bộ cân bằng</text><line x1="500" y1="185" x2="580" y2="185" stroke="#1f2937" stroke-width="3"/><rect x="900" y="40" width="180" height="70" rx="8" fill="#f3f4f6" stroke="#eb6834" stroke-width="3" stroke-dasharray="8 5"/><text x="990" y="83" text-anchor="middle">Pod 1: tải 5</text><rect x="900" y="150" width="180" height="70" rx="8" fill="#d1fae5" stroke="#eb6834" stroke-width="3" stroke-dasharray="8 5"/><text x="990" y="193" text-anchor="middle">Pod 2: tải 3</text><rect x="900" y="260" width="180" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="990" y="303" text-anchor="middle" fill="#6b7280">Pod 3: tải 8</text><line x1="790" y1="175" x2="900" y2="80" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/><line x1="790" y1="185" x2="900" y2="185" stroke="#059669" stroke-width="5"/><line x1="790" y1="195" x2="900" y2="295" stroke="#9ca3af" stroke-width="2"/><text x="1110" y="70" fill="#eb6834">viền cam: 2 máy bốc ngẫu nhiên</text><text x="1110" y="190" fill="#059669" font-weight="bold">gửi tới máy ít tải hơn</text><text x="1110" y="300" fill="#6b7280">lần này không được bốc</text><text x="560" y="365" text-anchor="middle" font-size="22">danh sách Pod sau địa chỉ dịch vụ được cập nhật tự động khi Pod đổi</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ đường đi của một yêu cầu. Khách không nhớ địa chỉ Pod nào, mà hỏi tên đơn hàng và nhận về địa chỉ ổn định của dịch vụ. Sau địa chỉ đó là bộ cân bằng, và danh sách Pod phía sau được cập nhật tự động khi Pod đổi. Với cách chọn tốt hơn trong hai, bộ cân bằng bốc ngẫu nhiên 2 máy, ở đây là Pod 1 tải 5 và Pod 2 tải 3. Nó gửi yêu cầu tới Pod 2 vì ít tải hơn, còn Pod 3 lần này không được bốc."

  - id: example
    kind: example
    title: "Sức mạnh của hai lựa chọn"
    checks:
      - "alg.lb_max_load(1) == 243 and alg.lb_max_load(2) == 202"
    steps:
      - show: |
          <table class="t"><tr><th>20 000 yêu cầu, 100 máy</th><th>tính</th></tr>
          <tr><td>trung bình mỗi máy</td><td>$\frac{20\,000}{100} = \hl{200}$</td></tr>
          <tr><td>chia vòng tròn tuyệt đối</td><td>mỗi máy đúng 200</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước một, có 20 nghìn yêu cầu và 100 máy. Trung bình mỗi máy là 20 nghìn chia 100, bằng 200 yêu cầu. Nếu chia vòng tròn tuyệt đối thì mỗi máy nhận đúng 200, nhưng điều đó cần một bộ chia duy nhất nhớ lượt của mọi yêu cầu."
      - show: |
          <div><svg width="900" height="340" viewBox="0 0 900 340"><line x1="70" y1="280" x2="870" y2="280" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="286" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">0</text><line x1="70" y1="236" x2="870" y2="236" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="242" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">50</text><line x1="70" y1="192" x2="870" y2="192" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="198" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">100</text><line x1="70" y1="147" x2="870" y2="147" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="153" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">150</text><line x1="70" y1="103" x2="870" y2="103" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="109" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">200</text><line x1="70" y1="59" x2="870" y2="59" stroke="#e5e7eb" stroke-width="1.5"/><text x="60" y="65" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">250</text><line x1="70" y1="103" x2="870" y2="103" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="8 6"/><text x="866" y="95" font-size="16" fill="#eb6834" text-anchor="end" font-weight="bold">trung bình 200</text><rect x="210" y="65" width="120" height="215" rx="4" fill="#2a78d6"/><text x="270" y="55" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">máy tải nhất: 243</text><text x="270" y="318" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="normal">chọn 1 máy ngẫu nhiên</text><rect x="570" y="101" width="120" height="179" rx="4" fill="#2a78d6"/><text x="630" y="91" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">máy tải nhất: 202</text><text x="630" y="318" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="normal">ít tải hơn trong 2 máy</text><text x="20" y="24" font-size="16" fill="#6b7280" text-anchor="start" font-weight="normal">yêu cầu</text><line x1="70" y1="280" x2="870" y2="280" stroke="#1f2937" stroke-width="2"/></svg></div>
          <p><b>Bước 2</b> — chọn 1 máy ngẫu nhiên (mô phỏng): máy tải nhất nhận $\hl{243}$, hơn trung bình $243 - 200 = 43$ yêu cầu.</p>
        focus: [1, 1, 2]
        say: "Bước hai, hình so tải của máy nặng nhất theo hai cách chia, đường đứt là mức trung bình 200. Với cách chọn 1 máy ngẫu nhiên, máy nặng nhất cao hơn hẳn mức trung bình. Mô phỏng cho máy tải nhất nhận 243 yêu cầu, hơn trung bình 43 yêu cầu."
      - clear: true
        show: |
          <p><b>Bước 3</b> — chọn máy ít tải hơn trong 2 máy bốc ngẫu nhiên: máy tải nhất chỉ còn $\hl{202}$, hơn trung bình $202 - 200 = 2$.</p>
          <div class="box key">Chỉ cần thêm <b>một</b> lựa chọn ngẫu nhiên, không cần biết tải của cả 100 máy — mà gần như hết lệch (Mitzenmacher, 2001).</div>
        focus: [1, 1, 2]
        say: "Bước ba, cùng 20 nghìn yêu cầu, nhưng mỗi yêu cầu bốc 2 máy và gửi tới máy ít tải hơn. Máy tải nhất chỉ còn 202, hơn trung bình đúng 2 yêu cầu. Chỉ cần thêm một lựa chọn ngẫu nhiên, không cần biết tải của cả 100 máy, mà gần như hết lệch."
      - clear: true
        show: |
          <table class="t"><tr><th>cách chia</th><th>mỗi yêu cầu phải hỏi tải của</th><th>tổng số lần hỏi cho 20 000 yêu cầu</th></tr>
          <tr><td>chọn 1 ngẫu nhiên</td><td>0 máy</td><td>0</td></tr>
          <tr><td>chọn tốt hơn trong hai</td><td>2 máy</td><td>$20\,000 \cdot 2 = 40\,000$</td></tr>
          <tr><td>ít kết nối nhất (xem mọi máy)</td><td>100 máy</td><td>$20\,000 \cdot 100 = 2\,000\,000$</td></tr></table>
          <p><b>Bước 4</b> — chọn tốt hơn trong hai hỏi ít hơn $\frac{2\,000\,000}{40\,000} = \hl{50}$ lần so với xem mọi máy.</p>
        introduces: [cdot]
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước bốn, ta tính cái giá của thông tin. Chọn 1 ngẫu nhiên không cần hỏi tải máy nào. Chọn tốt hơn trong hai hỏi 2 máy mỗi yêu cầu, tổng cộng 40 nghìn lần hỏi. Ít kết nối nhất phải xem cả 100 máy, tổng cộng 2 triệu lần hỏi. Vậy chọn tốt hơn trong hai hỏi ít hơn 50 lần, mà tải lớn nhất chỉ hơn trung bình 2 yêu cầu, nên đây là điểm cân bằng tốt giữa chi phí và độ đều."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: đổi hạt giống, thêm lựa chọn"
    checks:
      - "[alg.lb_max_load(1, seed=s) for s in range(1, 6)] == [243, 235, 248, 244, 239] and [alg.lb_max_load(2, seed=s) for s in range(1, 6)] == [202, 202, 201, 202, 202]"
      - "[alg.lb_max_load(3, seed=s) for s in range(1, 6)] == [201] * 5 and 100 * 200 == 20000"
    steps:
      - show: |
          <table class="t"><tr><th>chạy lại với 5 hạt giống ngẫu nhiên khác nhau</th><th>máy tải nhất</th></tr>
          <tr><td>chọn 1 máy ngẫu nhiên</td><td>235 tới 248</td></tr>
          <tr><td>ít tải hơn trong 2 máy</td><td>201 tới 202</td></tr>
          <tr><td>ít tải nhất trong 3 máy</td><td>201</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Kiểm bằng đường khác, ta chạy lại mô phỏng với 5 hạt giống ngẫu nhiên khác nhau, vì một lần chạy có thể chỉ là may mắn. Chọn 1 máy ngẫu nhiên cho máy tải nhất từ 235 tới 248, lần nào cũng lệch xa trung bình. Chọn ít tải hơn trong 2 máy cho 201 hoặc 202 ở cả 5 lần. Thêm lựa chọn thứ ba chỉ kéo xuống 201, nên từ 1 lên 2 lựa chọn là bước nhảy lớn, còn từ 2 lên 3 gần như không thêm gì. Kết luận 243 so với 202 không phải do một lần chạy may mắn."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "900 // 3 == 300 and 300 / 200 == 1.5 and 900 * 2 / 5 == 360 and 900 / 5 == 180 and 360 / 400 == 180 / 200 == 0.9"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Cân bằng theo kết nối khi kết nối giữ lâu <b class="red">(lệch tải)</b>
          <br><span class="note">Giao thức giữ một kết nối lâu và gửi hàng nghìn yêu cầu qua nó: bộ chia theo kết nối chỉ chia một lần, mọi yêu cầu sau dồn về một máy. Cần cân bằng theo <b>từng yêu cầu</b>.</span></div>
        say: "Lỗi thứ nhất, cân bằng theo kết nối khi kết nối được giữ lâu. Giao thức giữ một kết nối lâu và gửi hàng nghìn yêu cầu qua nó thì bộ chia theo kết nối chỉ chia một lần, mọi yêu cầu sau dồn về một máy. Cần cân bằng theo từng yêu cầu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lưu địa chỉ phân giải được mãi mãi <b class="red">(gọi vào Pod đã chết)</b>
          <br><span class="note">Phân giải tên một lần lúc khởi động rồi giữ địa chỉ: Pod đổi, chương trình vẫn gọi địa chỉ cũ. Tôn trọng thời gian sống của bản ghi, hoặc gọi qua địa chỉ ổn định của dịch vụ.</span></div>
        say: "Lỗi thứ hai, lưu địa chỉ đã phân giải mãi mãi. Phân giải tên một lần lúc khởi động rồi giữ địa chỉ, thì khi Pod đổi chương trình vẫn gọi địa chỉ cũ. Hãy tôn trọng thời gian sống của bản ghi, hoặc gọi qua địa chỉ ổn định của dịch vụ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Gửi việc cho máy chưa sẵn sàng hoặc đang hỏng <b class="red">(lỗi ngẫu nhiên)</b>
          <br><span class="note">Bộ cân bằng phải loại máy không qua kiểm tra sức khoẻ; nếu không, cứ 1 trên 100 yêu cầu rơi vào máy hỏng.</span></div>
        say: "Lỗi thứ ba, gửi việc cho máy chưa sẵn sàng hoặc đang hỏng. Bộ cân bằng phải loại những máy không qua kiểm tra sức khoẻ, nếu không thì cứ 1 trên 100 yêu cầu lại rơi vào máy hỏng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Trộn máy khác cấu hình mà vẫn chia đều <b class="red">(máy nhỏ quá tải)</b></div>
          <table class="t"><tr><th>giả sử: 900 yêu cầu mỗi giây, máy lớn chịu 400, máy nhỏ chịu 200</th><th>máy lớn A</th><th>máy lớn B</th><th>máy nhỏ C</th></tr>
          <tr><td>vòng tròn chia đều</td><td>300</td><td>300</td><td><b class="red">300: gấp 1,5 lần sức chịu</b></td></tr>
          <tr><td>chia theo trọng số 2 : 2 : 1</td><td>360</td><td>360</td><td>180</td></tr>
          <tr><td>mức bận khi chia theo trọng số</td><td>90%</td><td>90%</td><td>90%</td></tr></table>
        focus: [1, "2.1", "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, trộn máy khác cấu hình mà vẫn chia đều. Giả sử có 900 yêu cầu mỗi giây, hai máy lớn mỗi máy chịu 400, một máy nhỏ chỉ chịu 200. Chia vòng tròn đều thì mỗi máy nhận 300, máy nhỏ phải gánh gấp 1 phẩy 5 lần sức chịu, nên độ trễ của cả hệ tăng vọt dù hai máy lớn còn rảnh. Người làm nghề chia theo trọng số 2, 2, 1, nên hai máy lớn nhận 360, máy nhỏ nhận 180. Lúc đó cả ba máy cùng bận 90 phần trăm, không máy nào thành nút thắt. Khi nâng cấp dần một cụm máy, hãy nhớ cập nhật trọng số theo sức chịu thật của từng máy."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[1, 2, 3, 1, 2, 3, 1] == [(i % 3) + 1 for i in range(7)] and round((243 - 200) / 200 * 100, 1) == 21.5"
      - "[[(i % 3) + 1 for i in range(7)].count(m) for m in (1, 2, 3)] == [3, 2, 2] and Fraction(43, 200) == Fraction(215, 1000)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Vòng tròn qua 3 máy: 7 yêu cầu đầu đi tới những máy nào?</td></tr>
          <tr><td>2</td><td>Máy tải nhất 243 so với trung bình 200: vượt bao nhiêu phần trăm?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chia vòng tròn qua 3 máy, 7 yêu cầu đầu đi tới những máy nào? Câu hai, máy tải nhất 243 so với trung bình 200, vượt bao nhiêu phần trăm? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>yêu cầu</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th></tr>
          <tr><td>máy</td><td>1</td><td>2</td><td>3</td><td>1</td><td>2</td><td>3</td><td>1</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Đáp án câu một, ta đi lần lượt và quay lại sau máy 3. Các máy là 1, 2, 3, 1, 2, 3, 1. Máy 1 nhận 3 yêu cầu, máy 2 và máy 3 mỗi máy 2, vì 7 không chia hết cho 3."
      - show: |
          $$\frac{243 - 200}{200} = \frac{43}{200} = 0{,}215 = \hl{21{,}5\%}$$
        focus: [1, 1]
        say: "Câu hai, trước hết lấy hiệu, 243 trừ 200 bằng 43 yêu cầu vượt. Chia cho trung bình 200 được 0 phẩy 215, tức 21 phẩy 5 phần trăm."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">gọi bằng tên dịch vụ</span><span class="a">→</span>
          <span class="n">chia ngẫu nhiên: lệch tự nhiên</span><span class="a">→</span>
          <span class="n">chọn tốt hơn trong hai: gần đều</span><span class="a">→</span>
          <span class="n">kết nối giữ lâu: chia theo yêu cầu</span></div>
        say: "Tổng kết lại, hãy gọi bằng tên dịch vụ. Chia ngẫu nhiên thì lệch tự nhiên, chọn tốt hơn trong hai thì gần đều, và với kết nối giữ lâu thì phải chia theo từng yêu cầu."
      - show: |
          <div class="box key"><b>Tư duy:</b> một chút thông tin đặt đúng chỗ (so hai máy) có giá trị hơn rất nhiều thông tin đầy đủ nhưng đắt (theo dõi mọi máy).</div>
        say: "Điều cần mang theo, một chút thông tin đặt đúng chỗ, như so hai máy, có giá trị hơn rất nhiều thông tin đầy đủ nhưng đắt, như theo dõi mọi máy."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>dung lượng và hàng đợi</b> — định luật Little, M/M/1.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học dung lượng và hàng đợi, với định luật Little và mô hình hàng đợi một máy. Hẹn gặp bạn ở bài tiếp theo."
