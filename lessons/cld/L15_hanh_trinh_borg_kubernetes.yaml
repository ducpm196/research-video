#   Ví dụ 6 tác vụ, bản sao ở tác vụ kế tiếp là GIẢ ĐỊNH MINH HOẠ cho câu “takes down adjacent tasks” của [Q16].
#   Lời đọc không nói “API”, “CNCF”, “Docker”, “Paxos”: nói “giao diện lập trình”, “một quỹ phi lợi nhuận”, “trình chạy container cũ”,
#   “kho dữ liệu nhân bản”. Borg: luật đọc ở tools/registry/lexicon_vi.CLD.yaml (probe p3, p4).
objectives:
  - "Kể lại hành trình quản lý container ở quy mô lớn qua năm chặng, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại con số then chốt của từng chặng: máy tiết kiệm được, phút được phép hỏng, phần dữ liệu mất khi cập nhật"
  - "Chọn thực hành phù hợp với quy mô của chính mình, không chép quy mô của hệ thống khác"
