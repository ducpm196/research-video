source: "curriculum/cld.yaml L00; audit/cld/verify_cld.py L00; J. Dean, Software Engineering Advice from Building Large-Scale Distributed Systems (Stanford CS295, 2007) — bảng độ trễ: tham chiếu bộ nhớ chính 100 ns, khứ hồi trong cùng trung tâm dữ liệu 500 µs; M. Fowler, J. Lewis, Microservices (martinfowler.com, 2014); M. E. Conway, How Do Committees Invent?, Datamation (1968); SWF bài 0 (hợp đồng)"
assumes: [arith, approx]
# Quy ước: “microservice” chỉ trên màn hình; lời đọc nói “vi dịch vụ”. Số độ trễ lấy theo bảng của Dean (2007), là cỡ độ lớn, không phải số đo
#   trên một máy cụ thể; audit/cld/verify_cld.py đo lại trên máy dựng bài (gọi hàm Python và khứ hồi TCP qua localhost) để kiểm thứ tự độ lớn.
objectives:
  - "So sánh nguyên khối và vi dịch vụ"
  - "Liệt kê chi phí của việc tách dịch vụ"
  - "Biết vi dịch vụ giải bài toán tổ chức, không phải bài toán tốc độ"
