id: L01
course: CLD
series: "CLD · Hệ thống hướng dịch vụ"
title: "Bài 1 — Container: tiến trình được cô lập, không phải máy ảo"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cld.yaml L01; audit/cld/verify_cld.py L01; Linux man-pages: namespaces(7), cgroups(7); D. Merkel, Docker: Lightweight Linux Containers for Consistent Development and Deployment, Linux Journal 239 (2014); OSY bài 1 (tiến trình), OSY bài 14 (bảo vệ, đặc quyền)"
assumes: [arith]
# Quy ước: container = tiến trình (hoặc nhóm tiến trình) của nhân Linux được cô lập bằng không gian tên (namespace: thấy gì) và nhóm kiểm soát
#   (cgroup: dùng bao nhiêu). Không gian tên liệt kê theo namespaces(7): mount, PID, mạng, UTS, IPC, người dùng, cgroup, thời gian (8 loại).
objectives:
  - "Giải thích không gian tên và nhóm kiểm soát tài nguyên của nhân"
  - "So sánh container và máy ảo"
  - "Biết giới hạn bảo mật của container"
asr_reviewed:
  - {sentence: "Xoá container là mất luôn mọi tệp nó đã ghi thêm, nên dữ liệu cần giữ phải nằm ở ổ lưu trữ gắn ngoài hoặc cơ sở dữ liệu.", reason: "ASR chép “Xóa cân thaner là mất luôn mọi tạch nó đã ghi thêm…” (0.915): container đọc thô (probe CLD p1: 5/8, ASR viết “cần tên nơi”/“cân thaner”); lệch âm/thanh thuần Việt: tệp/tạch (cùng từ “tệp” các câu khác ASR chép đúng, vd “hệ tệp”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Dựng một máy ảo cho mỗi chương trình thì nặng, mỗi máy ảo thường cả GB và khởi động mất hàng chục giây, tuỳ máy.", reason: "ASR chép “Dựng một máy ảo cho mỗi chương trình thì nặng, mỗi máy ảo thường cả Gigabyte và khởi động mất hàng chục giây, tùy máy.” (0.96): GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “GB/gigabyte” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước bốn, bảng so container với máy ảo theo ba tiêu chí.", reason: "ASR chép “Bước 4, bạn so cần tenor với máy ảo theo 3 tiêu chí.” (0.8): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”); lệch âm/thanh thuần Việt: bảng/bạn — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước một, ta đếm xem container thấy riêng những gì.", reason: "ASR chép “Bước 1, ta đếm xem cần tenner thấy riêng những gì.” (0.857): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, container không mang nhân riêng mà gọi thẳng vào nhân của máy chủ, nên máy chủ phải có đúng loại nhân mà container cần.", reason: "ASR chép “Câu 2, cần tenner không mang nhân riêng mà gọi thẳng vào nhân của máy chủ, nên máy chủ phải có đúng loại nhân mà cần tenner cần.” (0.889): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cả ba chạy trên cùng một nhân, nên không container nào phải mang một hệ điều hành riêng.", reason: "ASR chép “Cả ba chạy trên cùng một nhân, nên không cần tay nơi nào phải mang một hệ điều hành riêng.” (0.895): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Giả sử máy 4096 MB, container A rò rỉ bộ nhớ và phình tới 3500 MB, còn B và C cần 512 MB mỗi cái.", reason: "ASR chép “Giả sử máy 4.096 MB, cần thay nơ A đò rỉ bộ nhớ và phìn tới 3.500 MB, còn B và C cần 512 MB mỗi cái.” (0.895): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”); lệch âm/thanh thuần Việt: rò/đò, phình/phìn — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ tư hay gặp ở người đã đi làm, bỏ giới hạn bộ nhớ để container khỏi bị giết.", reason: "ASR chép “Lỗi thứ tư hay gặp ở người đã đi làm, bỏ giới hạn bộ nhớ để cần tenner khỏi bị giết.” (0.927): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mỗi container chỉ nên có một tiến trình chính.", reason: "ASR chép “Mỗi cân tenner chỉ nên có một tiếng trình chính.” (0.737): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”); lệch âm/thanh thuần Việt: tiến/tiếng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở bài sau, bài 2, ta học cách dựng ảnh container tái lập, với các lớp, bộ nhớ đệm khi dựng, và ghim phiên bản.", reason: "ASR chép “Ở bài sau, bài 2, ta học cách dựng ảnh cần tenor tái lập với các lớp, bộ nhớ đệm khí dựng và game phiên bản.” (0.863): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”); lệch âm/thanh thuần Việt: khi/khí, ghim/game — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hôm nay ta học container, đóng gói chương trình cùng mọi thứ nó cần, và chạy như một tiến trình được cô lập.", reason: "ASR chép “Hôm nay ta học cần tenner, đóng gõi chương trình cùng mọi thứ nó cần và chạy như một tiến trình được cô lập.” (0.894): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”); lệch âm/thanh thuần Việt: gói/gõi — NOT_VERIFIED bằng tai người"}
  - {sentence: "Về nhân hệ điều hành, container dùng chung nhân của máy chủ, còn mỗi máy ảo có nhân riêng.", reason: "ASR chép “Về nhân hệ điều hành cần tên nơi dùng chung nhân của máy chủ còn mỗi máy ảo có nhân riêng.” (0.9): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Container không có phép màu, chỉ là các tính năng nhân đã có từ lâu được ghép lại.", reason: "ASR chép “Cần Tener không có phép màu, chỉ là các tính năng nhân đã có từ lâu được ghép lại.” (0.919): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chạy với quyền quản trị bên trong container, cộng thêm một lỗ hổng nhân, có thể thoát ra máy chủ.", reason: "ASR chép “Chạy với quyền quản trị bên trong Canter, cộng thêm một lỗ hổng nhân có thể thoát ra máy chủ.” (0.95): container đọc thô (probe CLD p1: 5/8, small viết “cần tên nơi”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đáp án câu một, không gian tên tiến trình làm nó thấy mình là số 1, còn nhóm kiểm soát giới hạn CPU.", reason: "ASR chép “Đáp án câu một, không gian tên tiến trình làm nó thấy mình là số một, còn nhóm kiểm soát giới hạn CPL.” (0.957): CPU đọc thô (probe CLD p1: 7/8) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chạy trên máy tôi được mà"
    steps:
      - show: |
          <p>Chương trình chạy tốt trên máy lập trình viên, lên máy chủ thì lỗi: khác phiên bản thư viện, khác cấu hình, khác hệ điều hành. Dựng một máy ảo cho mỗi chương trình thì nặng: mỗi máy ảo thường cả GB và khởi động mất hàng chục giây (cỡ độ lớn, tuỳ máy).</p>
          <div class="box key">Hôm nay: <b>container</b> — đóng gói chương trình cùng mọi thứ nó cần, chạy như một <b>tiến trình được cô lập</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, chương trình chạy tốt trên máy lập trình viên, lên máy chủ thì lỗi vì khác phiên bản thư viện, khác cấu hình, khác hệ điều hành. Dựng một máy ảo cho mỗi chương trình thì nặng, mỗi máy ảo thường cả GB và khởi động mất hàng chục giây, tuỳ máy. Hôm nay ta học container, đóng gói chương trình cùng mọi thứ nó cần, và chạy như một tiến trình được cô lập."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tiến trình, quyền quản trị, phần trăm tài nguyên"
    checks:
      - "2 / 8 == 0.25 and 512 / 4096 == 0.125"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm nền</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td>tiến trình</td><td>một chương trình đang chạy, có vùng nhớ riêng và một số hiệu</td><td>trình duyệt đang mở là một tiến trình</td></tr>
          <tr><td>nhân hệ điều hành</td><td>phần chia CPU, bộ nhớ, tệp, mạng cho mọi tiến trình</td><td>tiến trình muốn đọc tệp phải nhờ nhân</td></tr>
          <tr><td>quyền quản trị</td><td>người dùng được làm mọi việc trên máy</td><td>người dùng thường không sửa được tệp hệ thống</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Trước hết, ta cần hiểu ba khái niệm nền mà bài này dựa vào. Tiến trình là một chương trình đang chạy, có vùng nhớ riêng và một số hiệu, chẳng hạn trình duyệt đang mở. Nhân hệ điều hành chia CPU, bộ nhớ, tệp và mạng cho mọi tiến trình. Vì vậy tiến trình muốn đọc tệp phải nhờ nhân. Quyền quản trị cho phép làm mọi việc trên máy, còn người dùng thường không sửa được tệp hệ thống."
      - show: |
          <table class="t"><tr><th>máy 8 CPU, 4096 MB bộ nhớ</th><th>phần của máy</th></tr>
          <tr><td>dùng 2 CPU</td><td>$\frac{2}{8} = 25\%$</td></tr>
          <tr><td>dùng 512 MB</td><td>$\frac{512}{4096} = 12{,}5\%$</td></tr></table>
        introduces: [frac]
        focus: [1, "1.2", "1.3"]
        say: "Ta còn cần tính phần trăm tài nguyên của một máy. Máy có 8 CPU, một tiến trình dùng 2 CPU thì chiếm 2 phần 8, tức 25 phần trăm. Máy có 4096 MB bộ nhớ, dùng 512 MB thì chiếm 512 phần 4096, tức 12 phẩy 5 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: không gian tên, nhóm kiểm soát"
    checks:
      - "len(alg.LINUX_NAMESPACES) == 8 and {'pid', 'net', 'mnt', 'uts'} <= set(alg.LINUX_NAMESPACES)"
    steps:
      - show: |
          <p>Container không phải một thứ riêng của nhân hệ điều hành (Linux) — nó là tiến trình bình thường được bọc bằng hai cơ chế:</p>
          <table class="t"><tr><th>cơ chế</th><th>quyết định</th><th>ví dụ</th></tr>
          <tr><td><b>không gian tên</b> (namespace)</td><td>tiến trình <b>thấy</b> gì</td><td>thấy mình là tiến trình số 1; thấy hệ tệp, mạng, tên máy riêng (nhân có 8 loại)</td></tr>
          <tr><td><b>nhóm kiểm soát</b> (cgroup)</td><td>tiến trình <b>dùng</b> được bao nhiêu</td><td>tối đa 2 CPU, 512 MB bộ nhớ</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Container không phải một thứ riêng của nhân hệ điều hành, nó là một tiến trình bình thường được bọc bằng hai cơ chế. Bảng so hai cơ chế đó. Không gian tên quyết định tiến trình thấy gì, chẳng hạn thấy mình là tiến trình số 1, thấy hệ tệp, mạng, tên máy riêng, và nhân có 8 loại như vậy. Nhóm kiểm soát quyết định tiến trình dùng được bao nhiêu, chẳng hạn tối đa 2 CPU và 512 MB bộ nhớ."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ba container trên một nhân, ba máy ảo ba nhân"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><g font-size="23" fill="#1f2937"><text x="380" y="34" text-anchor="middle" font-weight="bold">container: chung một nhân</text><rect x="40" y="55" width="220" height="160" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="150" y="95" text-anchor="middle" font-weight="bold">container A</text><text x="150" y="135" text-anchor="middle" font-size="20">thấy mình là</text><text x="150" y="162" text-anchor="middle" font-size="20">tiến trình số 1</text><text x="150" y="200" text-anchor="middle" font-size="20" fill="#eb6834">tối đa 2 CPU, 512 MB</text><rect x="270" y="55" width="220" height="160" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="380" y="95" text-anchor="middle" font-weight="bold">container B</text><text x="380" y="135" text-anchor="middle" font-size="20">thấy mình là</text><text x="380" y="162" text-anchor="middle" font-size="20">tiến trình số 1</text><text x="380" y="200" text-anchor="middle" font-size="20" fill="#eb6834">tối đa 2 CPU, 512 MB</text><rect x="500" y="55" width="220" height="160" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="610" y="95" text-anchor="middle" font-weight="bold">container C</text><text x="610" y="135" text-anchor="middle" font-size="20">thấy mình là</text><text x="610" y="162" text-anchor="middle" font-size="20">tiến trình số 1</text><text x="610" y="200" text-anchor="middle" font-size="20" fill="#eb6834">tối đa 2 CPU, 512 MB</text><rect x="40" y="235" width="680" height="60" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="380" y="273" text-anchor="middle" fill="#2a78d6" font-weight="bold">một nhân Linux chung của máy chủ</text><text x="1130" y="34" text-anchor="middle" font-weight="bold">máy ảo: mỗi máy một nhân</text><rect x="800" y="55" width="200" height="160" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="900" y="95" text-anchor="middle" font-weight="bold">máy ảo 1</text><text x="900" y="132" text-anchor="middle" font-size="20">chương trình</text><rect x="820" y="150" width="160" height="50" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="900" y="182" text-anchor="middle" font-size="20" fill="#2a78d6">nhân riêng</text><rect x="1030" y="55" width="200" height="160" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="1130" y="95" text-anchor="middle" font-weight="bold">máy ảo 2</text><text x="1130" y="132" text-anchor="middle" font-size="20">chương trình</text><rect x="1050" y="150" width="160" height="50" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="1130" y="182" text-anchor="middle" font-size="20" fill="#2a78d6">nhân riêng</text><rect x="1260" y="55" width="200" height="160" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/><text x="1360" y="95" text-anchor="middle" font-weight="bold">máy ảo 3</text><text x="1360" y="132" text-anchor="middle" font-size="20">chương trình</text><rect x="1280" y="150" width="160" height="50" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="1360" y="182" text-anchor="middle" font-size="20" fill="#2a78d6">nhân riêng</text><rect x="800" y="235" width="660" height="60" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="1130" y="273" text-anchor="middle">lớp ảo hoá phần cứng</text><text x="380" y="345" text-anchor="middle" fill="#059669">nhẹ: khởi động như một tiến trình</text><text x="1130" y="345" text-anchor="middle" fill="#b91c1c">nặng hơn: khởi động cả hệ điều hành</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình bên trái là ba container trên một máy chủ. Mỗi container thấy mình là tiến trình số 1, nhờ không gian tên, và bị nhóm kiểm soát giới hạn tối đa 2 CPU, 512 MB. Cả ba cùng nằm trên một nhân chung, nên khởi động nhẹ như một tiến trình. Hình bên phải là ba máy ảo, mỗi máy mang nhân riêng trên lớp ảo hoá phần cứng, nên nặng hơn vì phải khởi động cả hệ điều hành."

  - id: example
    kind: example
    title: "Container và máy ảo"
    steps:
      - show: |
          <table class="t"><tr><th>loại không gian tên</th><th>tiến trình thấy riêng</th></tr>
          <tr><td>PID</td><td>số hiệu tiến trình: thấy mình là số 1</td></tr>
          <tr><td>mount</td><td>cây thư mục, hệ tệp</td></tr>
          <tr><td>mạng</td><td>thiết bị mạng, địa chỉ, cổng</td></tr>
          <tr><td>UTS</td><td>tên máy</td></tr>
          <tr><td>IPC, người dùng, cgroup, thời gian</td><td>kênh liên lạc, bảng người dùng, cây nhóm kiểm soát, đồng hồ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", 1]
        say: "Bước một, ta đếm xem container thấy riêng những gì. Không gian tên tiến trình cho nó số hiệu tiến trình riêng, nên nó thấy mình là số 1. Không gian tên gắn hệ tệp cho nó cây thư mục riêng. Không gian tên mạng cho nó thiết bị mạng, địa chỉ và cổng riêng. Một loại khác cho nó tên máy riêng. Bốn loại còn lại là kênh liên lạc, bảng người dùng, cây nhóm kiểm soát và đồng hồ. Tổng cộng 4 cộng 4 là 8 loại."
      - show: |
          <table class="t"><tr><th>container A trên máy 8 CPU, 4096 MB</th><th>giới hạn</th><th>phần của máy</th></tr>
          <tr><td>CPU</td><td>2 CPU</td><td>$\frac{2}{8} = \hl{25\%}$</td></tr>
          <tr><td>bộ nhớ</td><td>512 MB</td><td>$\frac{512}{4096} = \hl{12{,}5\%}$</td></tr></table>
          <p><b>Bước 2</b> — nhóm kiểm soát chặn trên: dùng thêm CPU thì bị hãm lại, vượt bộ nhớ thì tiến trình bị giết.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước hai, nhóm kiểm soát giới hạn container A trên một máy 8 CPU, 4096 MB. Giới hạn 2 CPU nghĩa là A dùng tối đa 25 phần trăm sức CPU của máy. Giới hạn 512 MB nghĩa là A dùng tối đa 12 phẩy 5 phần trăm bộ nhớ. Đây là chặn trên, nên muốn dùng thêm CPU thì A bị hãm lại, còn vượt bộ nhớ thì tiến trình bị giết."
      - clear: true
        show: |
          <table class="t"><tr><th>ba container A, B, C</th><th>CPU</th><th>bộ nhớ</th></tr>
          <tr><td>tổng giới hạn</td><td>$3 \cdot 2 = 6$</td><td>$3 \cdot 512 = 1536$ MB</td></tr>
          <tr><td>còn lại trên máy</td><td>$8 - 6 = \hl{2}$</td><td>$4096 - 1536 = \hl{2560}$ MB</td></tr></table>
          <p><b>Bước 3</b> — cả ba chạy trên <b>cùng một nhân</b>: không ai mang hệ điều hành riêng.</p>
        introduces: [cdot]
        focus: [1, "1.2", "1.3", 2]
        say: "Bước ba, chạy ba container giống A trên cùng máy. Tổng giới hạn là 3 nhân 2, bằng 6 CPU, và 3 nhân 512, bằng 1536 MB. Máy còn lại 2 CPU và 2560 MB. Cả ba chạy trên cùng một nhân, nên không container nào phải mang một hệ điều hành riêng."
      - clear: true
        show: |
          <table class="t"><tr><th></th><th>container</th><th>máy ảo</th></tr>
          <tr><td>nhân hệ điều hành</td><td><b>dùng chung</b> nhân của máy chủ</td><td>mỗi máy ảo một nhân riêng</td></tr>
          <tr><td>khởi động</td><td>như khởi động một tiến trình</td><td>khởi động cả hệ điều hành</td></tr>
          <tr><td>ranh giới cô lập</td><td>giao diện lời gọi hệ thống của nhân chung</td><td>phần cứng ảo hoá</td></tr></table>
          <div class="box key"><b>Bước 4</b> — mọi container trên một máy chạy trên <b>cùng một nhân</b>. Vì vậy container dựng cho một loại nhân (ví dụ Linux) thì cần đúng loại nhân đó, và một lỗ hổng trong nhân ảnh hưởng mọi container trên máy đó.</div>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Bước bốn, bảng so container với máy ảo theo ba tiêu chí. Về nhân hệ điều hành, container dùng chung nhân của máy chủ, còn mỗi máy ảo có nhân riêng. Về khởi động, container khởi động như một tiến trình, còn máy ảo phải khởi động cả hệ điều hành. Về ranh giới cô lập, container dựa vào giao diện lời gọi hệ thống của nhân chung, còn máy ảo dựa vào phần cứng ảo hoá. Mọi container trên một máy chạy trên cùng một nhân. Vì vậy container dựng cho một loại nhân thì cần đúng loại nhân đó, và một lỗ hổng trong nhân ảnh hưởng mọi container trên máy đó."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "len(alg.LINUX_NAMESPACES) == len({v for v in alg.LINUX_NAMESPACES.values() if v.startswith('CLONE_NEW')}) == 8"
      - "1536 + 2560 == 4096 and 6 + 2 == 8 and 25 * 8 / 100 == 2 and 12.5 * 4096 / 100 == 512"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>8 loại không gian tên</td><td>đếm cờ tạo không gian tên mới của nhân, mỗi loại một cờ</td><td>8 cờ khác nhau ✓</td></tr>
          <tr><td>phần còn lại</td><td>cộng ngược: $1536 + 2560$ và $6 + 2$</td><td>4096 MB và 8 CPU ✓</td></tr>
          <tr><td>phần trăm</td><td>25% của 8 CPU; 12,5% của 4096 MB</td><td>2 CPU và 512 MB ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, vì tính ngược mà vẫn khớp thì phép tính đáng tin. Nhân có một cờ riêng để tạo mỗi loại không gian tên mới, và đếm các cờ đó cũng được 8. Cộng ngược 1536 với 2560 ra đúng 4096 MB, và 6 cộng 2 ra đúng 8 CPU. Lấy 25 phần trăm của 8 CPU được 2 CPU, lấy 12 phẩy 5 phần trăm của 4096 MB được 512 MB, khớp với giới hạn ban đầu."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "4096 - 3500 == 596 and 2 * 512 == 1024 and 4096 - 3500 < 2 * 512"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi container là ranh giới bảo mật mạnh như máy ảo <b class="red">(nguy hiểm)</b>
          <br><span class="note">Chạy với quyền quản trị bên trong container, cộng một lỗ hổng nhân, có thể thoát ra máy chủ. Chạy bằng người dùng thường, bỏ bớt đặc quyền, như nguyên tắc quyền tối thiểu.</span></div>
        say: "Lỗi thứ nhất, coi container là ranh giới bảo mật mạnh như máy ảo. Chạy với quyền quản trị bên trong container, cộng thêm một lỗ hổng nhân, có thể thoát ra máy chủ. Hãy chạy bằng người dùng thường và bỏ bớt đặc quyền, theo nguyên tắc quyền tối thiểu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ghi dữ liệu quan trọng vào hệ tệp của container <b class="red">(mất khi xoá)</b>
          <br><span class="note">Xoá container là mất mọi tệp nó đã ghi thêm. Dữ liệu cần giữ phải nằm ở ổ lưu trữ gắn ngoài hoặc cơ sở dữ liệu.</span></div>
        say: "Lỗi thứ hai, ghi dữ liệu quan trọng vào hệ tệp của container. Xoá container là mất luôn mọi tệp nó đã ghi thêm, nên dữ liệu cần giữ phải nằm ở ổ lưu trữ gắn ngoài hoặc cơ sở dữ liệu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhồi nhiều dịch vụ vào một container <b class="red">(khó quản lý)</b>
          <br><span class="note">Máy chủ web, cơ sở dữ liệu, bộ lập lịch chung một container: một cái chết khó phát hiện, không co giãn riêng được. Mỗi container một tiến trình chính.</span></div>
        say: "Lỗi thứ ba, nhồi nhiều dịch vụ vào một container. Máy chủ web, cơ sở dữ liệu, bộ lập lịch chung một container thì một cái chết khó phát hiện, và không co giãn riêng được. Mỗi container chỉ nên có một tiến trình chính."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Không đặt giới hạn bộ nhớ “cho khỏi bị giết” <b class="red">(cả máy chịu thiệt)</b></div>
          <table class="t"><tr><th>máy 4096 MB; A rò rỉ bộ nhớ, lên tới 3500 MB</th><th>B và C cần 512 MB mỗi cái</th></tr>
          <tr><td>A <b>không</b> có giới hạn</td><td>máy chỉ còn $4096 - 3500 = 596$ MB &lt; 1024 MB: cả máy chậm lại, rồi nhân giết bớt tiến trình. Điểm chọn giết dựa chủ yếu vào bộ nhớ đang dùng nên thường là A, nhưng điểm chỉnh được, nên B hoặc C vẫn có thể bị chọn</td></tr>
          <tr><td>A có giới hạn 512 MB</td><td>A vượt giới hạn thì <b>chỉ A</b> bị giết; B, C chạy tiếp</td></tr></table>
        focus: [1, 1, "2.2", "2.2", "2.2", "2.3", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, bỏ giới hạn bộ nhớ để container khỏi bị giết. Giả sử máy 4096 MB, container A rò rỉ bộ nhớ và phình tới 3500 MB, còn B và C cần 512 MB mỗi cái. Nếu A không có giới hạn, máy chỉ còn 596 MB, ít hơn 1024 MB mà B và C cần, nên cả máy bị chậm lại. Nhân phải giết bớt tiến trình để lấy lại bộ nhớ, và nó chấm điểm chủ yếu theo bộ nhớ đang dùng, nên thường chọn A. Nhưng điểm chấm chỉnh được, nên B hoặc C, vốn chẳng có lỗi gì, vẫn có thể bị chọn thay. Nếu A có giới hạn 512 MB, thì chỉ A bị giết, còn B và C vẫn chạy tiếp. Giới hạn bộ nhớ không làm hại chương trình đúng, nó khoanh vùng thiệt hại của chương trình sai."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.LINUX_NAMESPACES['pid'] == 'CLONE_NEWPID' and 'cgroup' in alg.LINUX_NAMESPACES"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cơ chế nào làm container “thấy” mình là tiến trình số 1? Cơ chế nào giới hạn nó dùng tối đa 1 CPU?</td></tr>
          <tr><td>2</td><td>Máy chủ không chạy nhân Windows (nhân hệ điều hành của nó là Linux) có chạy được trực tiếp một container cần nhân Windows không? Vì sao?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cơ chế nào làm container thấy mình là tiến trình số 1? Cơ chế nào giới hạn nó dùng tối đa 1 CPU? Câu hai, một máy chủ không chạy nhân Windows thì có chạy được trực tiếp một container cần nhân Windows không, và vì sao? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>“thấy” hay “dùng”?</th><th>cơ chế</th></tr>
          <tr><td>thấy mình là số 1</td><td>thấy</td><td>không gian tên tiến trình (PID)</td></tr>
          <tr><td>dùng tối đa 1 CPU</td><td>dùng</td><td>nhóm kiểm soát</td></tr></table>
        focus: [1, "1.2", "1.3", "1.2"]
        say: "Câu một, ta hỏi mỗi yêu cầu là chuyện thấy hay chuyện dùng. Thấy mình là số 1 là chuyện thấy, nên thuộc không gian tên. Dùng tối đa 1 CPU là chuyện dùng, nên thuộc nhóm kiểm soát. Đáp án câu một, không gian tên tiến trình làm nó thấy mình là số 1, còn nhóm kiểm soát giới hạn CPU."
      - show: |
          <p>② Container gọi thẳng vào nhân của máy chủ → máy chủ phải có <b>đúng loại nhân</b> mà container cần.</p>
          <p>Máy chủ chỉ có nhân hệ điều hành Linux → <b>không</b> chạy trực tiếp được; muốn chạy phải có một máy ảo mang nhân Windows.</p>
        focus: [1, 2]
        say: "Câu hai, container không mang nhân riêng mà gọi thẳng vào nhân của máy chủ, nên máy chủ phải có đúng loại nhân mà container cần. Máy chủ ở đây không có nhân Windows, nên không chạy trực tiếp được, muốn chạy thì phải có một máy ảo mang nhân Windows."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">container = tiến trình</span><span class="a">→</span>
          <span class="n">không gian tên: thấy gì</span><span class="a">→</span>
          <span class="n">nhóm kiểm soát: dùng bao nhiêu</span><span class="a">→</span>
          <span class="n">chung nhân: nhẹ nhưng cô lập yếu hơn máy ảo</span></div>
        say: "Tổng kết lại, container là một tiến trình, không gian tên quyết định nó thấy gì, nhóm kiểm soát quyết định nó dùng bao nhiêu. Vì dùng chung nhân nên nó nhẹ, nhưng cô lập yếu hơn máy ảo."
      - show: |
          <div class="box key"><b>Tư duy:</b> hiểu một công nghệ bằng cơ chế bên dưới của nó — container không có phép màu, chỉ là các tính năng nhân đã có từ lâu được ghép lại.</div>
        say: "Điều cần mang theo, hãy hiểu một công nghệ bằng cơ chế bên dưới của nó. Container không có phép màu, chỉ là các tính năng nhân đã có từ lâu được ghép lại."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>ảnh container tái lập</b> — lớp, bộ nhớ đệm khi dựng, ghim phiên bản.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học cách dựng ảnh container tái lập, với các lớp, bộ nhớ đệm khi dựng, và ghim phiên bản. Hẹn gặp bạn ở bài tiếp theo."
