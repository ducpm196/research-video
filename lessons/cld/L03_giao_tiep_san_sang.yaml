          <span class="n">ngừng gần như cộng dồn</span><span class="a">→</span>
          <span class="n">việc không cần chờ: đưa vào hàng đợi</span></div>
        say: "Tổng kết lại, gọi đồng bộ là chờ và cùng chết. Chuỗi n dịch vụ có độ sẵn sàng p mũ n, thời gian ngừng gần như cộng dồn, nên việc không cần chờ hãy đưa vào hàng đợi."
      - show: |
