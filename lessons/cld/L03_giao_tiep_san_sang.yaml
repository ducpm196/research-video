id: L03
course: CLD
series: "CLD · Hệ thống hướng dịch vụ"
title: "Bài 3 — Giao tiếp giữa dịch vụ: đồng bộ, bất đồng bộ, độ sẵn sàng của chuỗi gọi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cld.yaml L03; audit/cld/verify_cld.py L03; M. Nygard, Release It!, 2nd ed. (2018), chương 4 (chuỗi phụ thuộc); G. Hohpe, B. Woolf, Enterprise Integration Patterns (2003), chương 3 (hệ thông điệp); NET bài 12 (giao thức ứng dụng)"
assumes: [arith, cdot, approx, power]
# Quy ước: độ sẵn sàng p = tỉ lệ thời gian dịch vụ trả lời đúng; các dịch vụ hỏng ĐỘC LẬP; chuỗi gọi đồng bộ nối tiếp chỉ thành công khi mọi
#   dịch vụ thành công → p^n (alg.chain_availability). Tháng = 30 ngày = 43 200 phút (alg.downtime_minutes).
objectives:
  - "So sánh gọi đồng bộ và gửi thông điệp"
  - "Tính độ sẵn sàng của chuỗi phụ thuộc"
  - "Giảm phụ thuộc đồng bộ khi có thể"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Năm dịch vụ tốt, một trang tệ"
    checks:
      - "round(alg.chain_availability(0.999, 5), 4) == 0.995 and round(alg.downtime_minutes(alg.chain_availability(0.999, 5))) == 216"
    steps:
      - show: |
          <p>Trang thanh toán gọi lần lượt 5 dịch vụ: giỏ hàng, giá, kho, thanh toán, vận chuyển. Mỗi dịch vụ đạt 99,9% — chỉ ngừng 43 phút mỗi tháng. Vậy mà trang thanh toán ngừng khoảng $\hl{216}$ phút mỗi tháng.</p>
          <div class="box key">Hôm nay: <b>gọi đồng bộ</b>, <b>gửi thông điệp</b>, và vì sao chuỗi càng dài càng kém sẵn sàng.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, trang thanh toán gọi lần lượt 5 dịch vụ, giỏ hàng, giá, kho, thanh toán và vận chuyển. Mỗi dịch vụ đạt 99 phẩy 9 phần trăm, chỉ ngừng 43 phút mỗi tháng. Vậy mà trang thanh toán ngừng khoảng 216 phút mỗi tháng. Hôm nay ta học gọi đồng bộ, gửi thông điệp, và vì sao chuỗi gọi càng dài càng kém sẵn sàng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: phần trăm thời gian, phút trong tháng, xác suất độc lập"
    checks:
      - "30 * 24 * 60 == 43200 and round((1 - 0.999) * 100, 1) == 0.1"
      - "0.5 * 0.5 == 0.25 and round(0.9 * 0.9, 2) == 0.81"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>số phút trong một tháng 30 ngày</td><td>$30 \cdot 24 \cdot 60$</td><td>43 200 phút</td></tr>
          <tr><td>sẵn sàng 99,9% thì ngừng</td><td>$100\% - 99{,}9\%$</td><td>0,1% thời gian</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bài này cần hai phép tính quen thuộc. Một tháng 30 ngày, mỗi ngày 24 giờ, mỗi giờ 60 phút, nên có 30 nhân 24 nhân 60, bằng 43 nghìn 200 phút. Một dịch vụ sẵn sàng 99 phẩy 9 phần trăm thì phần còn lại, 0 phẩy 1 phần trăm thời gian, là lúc nó ngừng."
      - show: |
          <p><b>Hai sự kiện độc lập</b> (khoá Toán cho khoa học máy tính): xác suất <b>cả hai</b> cùng xảy ra = tích hai xác suất.</p>
          <table class="t"><tr><th>ví dụ</th><th>cả hai cùng xảy ra</th></tr>
          <tr><td>hai đồng xu cùng ra mặt ngửa</td><td>$0{,}5 \cdot 0{,}5 = 0{,}25$</td></tr>
          <tr><td>hai dịch vụ, mỗi cái sống 90% thời gian, cùng sống</td><td>$0{,}9 \cdot 0{,}9 = 0{,}81$</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Ở khoá Toán cho khoa học máy tính, ta đã học rằng với hai sự kiện độc lập, xác suất cả hai cùng xảy ra bằng tích hai xác suất. Hai đồng xu cùng ra mặt ngửa có xác suất 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 25. Hai dịch vụ, mỗi cái sống 90 phần trăm thời gian, cùng sống với xác suất 0 phẩy 81. Độc lập nghĩa là cái này hỏng không làm cái kia dễ hỏng hơn."

  - id: sym
    kind: symbol
    title: "Giải mã: đồng bộ, bất đồng bộ, độ sẵn sàng"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>người gọi</th><th>bên nhận chết thì</th></tr>
          <tr><td><b>đồng bộ</b> (gọi và chờ)</td><td>đứng chờ phản hồi</td><td>người gọi cũng lỗi</td></tr>
          <tr><td><b>bất đồng bộ</b> (gửi thông điệp vào hàng đợi)</td><td>gửi xong đi tiếp</td><td>thông điệp nằm chờ, xử lý sau</td></tr></table>
          <p><b>Độ sẵn sàng</b> $p$: tỉ lệ thời gian dịch vụ trả lời đúng. Chuỗi $n$ dịch vụ gọi đồng bộ nối tiếp, hỏng độc lập: thành công khi <b>tất cả</b> thành công → $p^n$.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Bảng so hai cách giao tiếp. Gọi đồng bộ là gọi rồi đứng chờ phản hồi, bên nhận chết thì người gọi cũng lỗi. Gửi bất đồng bộ là đặt thông điệp vào hàng đợi rồi đi tiếp, bên nhận chết thì thông điệp nằm chờ để xử lý sau. Độ sẵn sàng p là tỉ lệ thời gian dịch vụ trả lời đúng. Chuỗi n dịch vụ gọi đồng bộ nối tiếp, hỏng độc lập, chỉ thành công khi tất cả thành công, nên độ sẵn sàng là p mũ n."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Chuỗi chỉ sống khi mọi mắt xích cùng sống"
    steps:
      - show: |
          <div><svg width="1500" height="390" viewBox="0 0 1500 390"><g font-size="23" fill="#1f2937"><text x="20" y="40" font-weight="bold">đồng bộ, nối tiếp: một mắt xích ngừng là cả trang ngừng</text><text x="20" y="108">yêu cầu</text><rect x="150" y="60" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="245" y="95" text-anchor="middle">giỏ hàng</text><text x="245" y="125" text-anchor="middle" font-size="20">99,9%</text><rect x="400" y="60" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="495" y="95" text-anchor="middle">giá</text><text x="495" y="125" text-anchor="middle" font-size="20">99,9%</text><line x1="340" y1="100" x2="400" y2="100" stroke="#1f2937" stroke-width="3"/><rect x="650" y="60" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="745" y="95" text-anchor="middle">kho</text><text x="745" y="125" text-anchor="middle" font-size="20">99,9%</text><line x1="590" y1="100" x2="650" y2="100" stroke="#1f2937" stroke-width="3"/><rect x="900" y="60" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="995" y="95" text-anchor="middle">thanh toán</text><text x="995" y="125" text-anchor="middle" font-size="20">99,9%</text><line x1="840" y1="100" x2="900" y2="100" stroke="#1f2937" stroke-width="3"/><rect x="1150" y="60" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1245" y="95" text-anchor="middle">vận chuyển</text><text x="1245" y="125" text-anchor="middle" font-size="20">99,9%</text><line x1="1090" y1="100" x2="1150" y2="100" stroke="#1f2937" stroke-width="3"/><text x="20" y="200" font-weight="bold">việc không cần chờ đưa sang hàng đợi</text><text x="20" y="262">yêu cầu</text><rect x="150" y="215" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="245" y="262" text-anchor="middle">giỏ hàng</text><rect x="400" y="215" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="495" y="262" text-anchor="middle">kho</text><line x1="340" y1="255" x2="400" y2="255" stroke="#1f2937" stroke-width="3"/><rect x="650" y="215" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="745" y="262" text-anchor="middle">thanh toán</text><line x1="590" y1="255" x2="650" y2="255" stroke="#1f2937" stroke-width="3"/><line x1="840" y1="255" x2="950" y2="255" stroke="#eb6834" stroke-width="3" stroke-dasharray="8 6"/><rect x="950" y="220" width="200" height="70" rx="8" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1050" y="263" text-anchor="middle">hàng đợi</text><line x1="1150" y1="255" x2="1220" y2="255" stroke="#eb6834" stroke-width="3" stroke-dasharray="8 6"/><text x="1230" y="245" font-size="21">thư, điểm thưởng:</text><text x="1230" y="275" font-size="21">xử lý sau</text><text x="750" y="350" text-anchor="middle" fill="#b91c1c">hàng trên: 5 mắt xích cùng phải sống; hàng dưới: chỉ 3 mắt xích liền nét</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hàng trên là trang thanh toán gọi đồng bộ, nối tiếp 5 dịch vụ, mỗi dịch vụ 99 phẩy 9 phần trăm. Yêu cầu chỉ thành công khi cả 5 mắt xích cùng sống, chỉ một cái ngừng là cả trang ngừng. Hàng dưới đưa việc gửi thư và cộng điểm thưởng sang hàng đợi, nên chỉ còn 3 mắt xích liền nét phải cùng sống. Phần đứt nét có ngừng thì thông điệp nằm chờ, khách vẫn đặt được hàng."

  - id: example
    kind: example
    title: "Năm dịch vụ 99,9%"
    checks:
      - "round(0.999 ** 5, 6) == 0.995010 and round(alg.downtime_minutes(0.999)) == 43 and round(alg.downtime_minutes(0.999 ** 5)) == 216"
    steps:
      - show: |
          <table class="t"><tr><th>số dịch vụ $n$</th><th>$0{,}999^n$</th></tr>
          <tr><td>1</td><td>0,999</td></tr><tr><td>2</td><td>0,998001</td></tr><tr><td>3</td><td>0,997003</td></tr>
          <tr><td>4</td><td>0,996006</td></tr><tr><td>5</td><td>$\hl{0{,}995010}$</td></tr></table>
        focus: [1, "1.2", "1.6", 1]
        say: "Bước một, thay p bằng 0 phẩy 999 rồi nhân dần từng dịch vụ một. Một dịch vụ là 0 phẩy 999. Nhân dần tới 5 dịch vụ, ta được 0 phẩy 999 mũ 5, khoảng 0 phẩy 995. Mỗi dịch vụ thêm vào làm chuỗi mất thêm chừng một phần nghìn."
      - show: |
          <p><b>Bước 2</b> — một dịch vụ ngừng 0,1% của tháng:</p>
          $$(1 - 0{,}999) \cdot 43\,200 = 0{,}001 \cdot 43\,200 = 43{,}2 \approx 43 \text{ phút}$$
        focus: [1, 2]
        say: "Bước hai, một dịch vụ ngừng 0 phẩy 1 phần trăm của tháng. Lấy 0 phẩy 001 nhân 43 nghìn 200 được 43 phẩy 2, tức khoảng 43 phút mỗi tháng."
      - clear: true
        show: |
          <p><b>Bước 3</b> — cả chuỗi ngừng phần còn lại sau 0,995010:</p>
          $$(1 - 0{,}995010) \cdot 43\,200 = 0{,}00499 \cdot 43\,200 \approx 215{,}6 \approx \hl{216} \text{ phút}$$
        focus: [1, 2]
        say: "Bước ba, cả chuỗi ngừng phần còn lại sau 0 phẩy 995010, tức 0 phẩy 00499. Nhân với 43 nghìn 200 được khoảng 215 phẩy 6, tức khoảng 216 phút mỗi tháng."
      - show: |
          <table class="t"><tr><th>so sánh</th><th>ngừng mỗi tháng</th></tr>
          <tr><td>một dịch vụ</td><td>≈ 43 phút</td></tr>
          <tr><td>chuỗi 5 dịch vụ</td><td>≈ 216 phút ≈ $5 \cdot 43{,}2$</td></tr></table>
          <div class="box key"><b>Bước 4</b> — thời gian ngừng gần như <b>cộng dồn</b>: 5 dịch vụ ≈ 5 lần. Trang chỉ tốt bằng mắt xích yếu nhất — và còn kém hơn thế.</div>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Bước bốn, so hai kết quả. Một dịch vụ ngừng khoảng 43 phút. Chuỗi 5 dịch vụ ngừng khoảng 216 phút, gần bằng 5 nhân 43 phẩy 2. Thời gian ngừng gần như cộng dồn, 5 dịch vụ thì khoảng 5 lần. Trang chỉ tốt bằng mắt xích yếu nhất, và thực ra còn kém hơn thế."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "5 * 43.2 == 216.0 and 215.5 < (1 - 0.999 ** 5) * 43200 < 216.0"
      - "len(list(__import__('itertools').product([1, 0], repeat=5))) == 32 and abs(sum(math.prod(0.999 if u else 0.001 for u in c) for c in __import__('itertools').product([1, 0], repeat=5) if not all(c)) - (1 - 0.999 ** 5)) < 1e-12"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>cộng thẳng thời gian ngừng</td><td>$5 \cdot 43{,}2 = 216$ phút — hơi dư, vì có lúc hai dịch vụ cùng ngừng mà ta đếm hai lần</td><td>216 so với 215,6 ✓</td></tr>
          <tr><td>liệt kê mọi trường hợp</td><td>5 dịch vụ, mỗi cái sống hoặc ngừng: $2^5 = 32$ trường hợp; cộng xác suất 31 trường hợp có ít nhất một cái ngừng</td><td>0,00499, khớp $1 - 0{,}995010$ ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, vì một đường không dùng lũy thừa mà vẫn ra cùng con số thì đáng tin. Cộng thẳng thời gian ngừng của 5 dịch vụ được 216 phút, hơi dư so với 215 phẩy 6. Đó là vì có lúc hai dịch vụ cùng ngừng, mà phép cộng đếm lúc đó hai lần. Liệt kê mọi trường hợp sống hay ngừng của 5 dịch vụ, ta có 2 mũ 5, bằng 32 trường hợp. Cộng xác suất của 31 trường hợp có ít nhất một cái ngừng, được 0 phẩy 00499, khớp với 1 trừ 0 phẩy 995010."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "round(1 - 0.001 ** 2, 6) == 0.999999 and round(0.999999 ** 5, 6) == 0.999995 and round(alg.downtime_minutes(0.999999 ** 5) * 60) == 13"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Gọi đồng bộ cho việc không cần chờ <b class="red">(phụ thuộc thừa)</b>
          <br><span class="note">Gửi thư xác nhận, cộng điểm thưởng không cần xong trước khi trả lời khách. Đưa vào hàng đợi: dịch vụ thư chết thì đơn hàng vẫn thành công.</span></div>
        say: "Lỗi thứ nhất, gọi đồng bộ cho việc không cần chờ. Gửi thư xác nhận hay cộng điểm thưởng không cần xong trước khi trả lời khách. Hãy đưa vào hàng đợi, để dịch vụ thư có chết thì đơn hàng vẫn thành công."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ bất đồng bộ là miễn phí <b class="red">(chuyển độ phức tạp)</b>
          <br><span class="note">Thông điệp có thể tới trễ, tới hai lần, sai thứ tự. Bên nhận phải xử lý được cả ba.</span></div>
        say: "Lỗi thứ hai, nghĩ bất đồng bộ là miễn phí. Thông điệp có thể tới trễ, tới hai lần, hoặc sai thứ tự, và bên nhận phải xử lý được cả ba trường hợp đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhân độ sẵn sàng khi các lỗi <b>không</b> độc lập <b class="red">(lạc quan)</b>
          <br><span class="note">Năm dịch vụ cùng dùng một cơ sở dữ liệu: nó chết thì cả năm cùng chết. Công thức $p^n$ chỉ đúng khi hỏng độc lập; phụ thuộc chung làm mọi thứ hỏng cùng lúc.</span></div>
        say: "Lỗi thứ ba, nhân độ sẵn sàng khi các lỗi không độc lập. Năm dịch vụ cùng dùng một cơ sở dữ liệu thì nó chết là cả năm cùng chết. Công thức p mũ n chỉ đúng khi hỏng độc lập."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đổi gọi nối tiếp thành gọi song song, tưởng sẵn sàng tăng <b class="red">(chỉ nhanh hơn)</b></div>
          <table class="t"><tr><th>cách</th><th>cần</th><th>sẵn sàng</th></tr>
          <tr><td>5 dịch vụ gọi nối tiếp</td><td>cả 5 trả lời</td><td>0,995010</td></tr>
          <tr><td>5 dịch vụ gọi song song, chờ đủ 5</td><td>vẫn cả 5 trả lời</td><td>0,995010 — <b>không đổi</b></td></tr>
          <tr><td>mỗi dịch vụ chạy 2 bản hỏng độc lập, cần 1 bản sống</td><td>mỗi mắt xích: $1 - 0{,}001^2 = 0{,}999999$</td><td>$0{,}999999^5 \approx 0{,}999995$: ngừng ≈ 13 giây mỗi tháng</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đổi gọi nối tiếp thành gọi song song và tưởng độ sẵn sàng tăng lên. Gọi song song chỉ làm trang nhanh hơn, còn nếu vẫn phải chờ đủ 5 câu trả lời thì vẫn cần cả 5 cùng sống. Vì vậy độ sẵn sàng vẫn là 0 phẩy 995010, không đổi. Thứ làm tăng độ sẵn sàng là bản dự phòng, chẳng hạn mỗi dịch vụ chạy 2 bản hỏng độc lập, chỉ cần 1 bản sống. Khi đó mỗi mắt xích chỉ ngừng khi cả hai bản cùng ngừng, xác suất 0 phẩy 001 bình phương, nên sẵn sàng 0 phẩy 999999. Cả chuỗi còn khoảng 0 phẩy 999995, ngừng chừng 13 giây mỗi tháng, miễn là hai bản thật sự hỏng độc lập như Lỗi 3 đã nói."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.chain_availability(0.99, 3), 4) == 0.9703 and round(alg.downtime_minutes(0.99 ** 3)) == 1283"
      - "round(alg.chain_availability(0.999, 3), 3) == 0.997"
      - "round(1 - 0.9703, 4) == 0.0297 and round(1283 / 60) == 21 and round(alg.downtime_minutes(0.999 ** 3)) == 129"
      - "round(alg.chain_availability(0.999, 4), 3) == 0.996"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>3 dịch vụ nối tiếp, mỗi cái 99%: cả chuỗi sẵn sàng bao nhiêu? Ngừng khoảng bao nhiêu phút mỗi tháng?</td></tr>
          <tr><td>2</td><td>Trang thanh toán chuyển “thư” và “điểm thưởng” sang hàng đợi, còn 3 dịch vụ đồng bộ 99,9%. Sẵn sàng bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 3 dịch vụ nối tiếp, mỗi cái 99 phần trăm, cả chuỗi sẵn sàng bao nhiêu? Ngừng khoảng bao nhiêu phút mỗi tháng? Câu hai, trang thanh toán chuyển thư và điểm thưởng sang hàng đợi, còn lại 3 dịch vụ đồng bộ 99 phẩy 9 phần trăm. Sẵn sàng bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>câu 1</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>sẵn sàng của chuỗi</td><td>$0{,}99^3$</td><td>$\approx \hl{0{,}9703}$</td></tr>
          <tr><td>phần ngừng</td><td>$1 - 0{,}9703$</td><td>0,0297</td></tr>
          <tr><td>phút ngừng mỗi tháng</td><td>$0{,}0297 \cdot 43\,200$</td><td>$\approx \hl{1283}$ phút ≈ 21 giờ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, làm từng bước. Ba dịch vụ nối tiếp nên lấy 0 phẩy 99 mũ 3, khoảng 0 phẩy 9703. Phần ngừng là 1 trừ đi số đó, tức 0 phẩy 0297. Nhân với 43 nghìn 200 phút được khoảng 1283 phút, tức khoảng 21 giờ mỗi tháng."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>chỉ còn 3 mắt xích đồng bộ</td><td>$0{,}999^3$</td><td>$\approx \hl{0{,}997}$</td></tr>
          <tr><td>phút ngừng mỗi tháng</td><td>$(1 - 0{,}997003) \cdot 43\,200$</td><td>≈ 129 phút, thay vì 216</td></tr></table>
          <p>Lưu ý: bước ghi vào hàng đợi cũng là một mắt xích đồng bộ; hàng đợi 99,9% thì chuỗi là $0{,}999^4 \approx 0{,}996$.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, thư và điểm thưởng đã sang hàng đợi, nên chỉ còn 3 mắt xích đồng bộ. Lấy 0 phẩy 999 mũ 3, được khoảng 0 phẩy 997. Đổi ra thời gian, trang ngừng khoảng 129 phút mỗi tháng thay vì 216 phút, tốt hơn chuỗi 5 dịch vụ. Lưu ý, bước ghi vào hàng đợi cũng là một mắt xích đồng bộ, nên nếu hàng đợi sẵn sàng 99 phẩy 9 phần trăm thì chuỗi là 0 phẩy 999 mũ 4, khoảng 0 phẩy 996."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
