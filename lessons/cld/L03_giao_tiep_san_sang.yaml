  steps:
  - show: <table class='t'><tr><th>Thực hành CLD:L03</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/CLD/L03/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Độ sẵn sàng chuỗi 4 dịch vụ nối tiếp nhau cùng đạt 99,8%</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>avail_pct=...%<br/>downtime_min=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh CLD L03 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
