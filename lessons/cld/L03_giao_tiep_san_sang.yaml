asr_reviewed:
- sentence: Chuyển các tác vụ không cần phản hồi ngay sang hàng đợi bất đồng bộ cắt đứt dây chuyền sập đồng loạt giữa các
    dịch vụ liền kề.
  reason: 'ASR chép “Chuyển các tác vụ không cần phản hồi ngay sang hàng đời bất đồng bộ các đức giây truyền sập đồng loạt
    giữa các dịch vụ liên kê.” (0.786): khác biệt [“đợi” → nghe thành “đời”; “cắt đứt” → nghe thành “các đức”; “chuyền” →
    nghe thành “truyền”; “liền kề” → nghe thành “liên kê”]; lệch âm/thanh thuần Việt hoặc cách đọc từ chuyên ngành/số chữ
    — NOT_VERIFIED bằng tai người'
scenes:
- id: hook
  kind: hook
  title: Năm dịch vụ tốt, một trang tệ
  checks:
  - round(alg.chain_availability(0.999, 5), 4) == 0.995 and round(alg.downtime_minutes(alg.chain_availability(0.999, 5)))
    == 216
  steps:
  - show: '<p>Trang thanh toán gọi lần lượt 5 dịch vụ: giỏ hàng, giá, kho, thanh toán, vận chuyển. Mỗi dịch vụ đạt 99,9% —
      chỉ ngừng 43 phút mỗi tháng. Vậy mà trang thanh toán ngừng khoảng $\hl{216}$ phút mỗi tháng.</p>

      <div class="box key">Hôm nay: <b>gọi đồng bộ</b>, <b>gửi thông điệp</b>, và vì sao chuỗi dài hơn làm độ sẵn sàng tụt
      mạnh.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, trang thanh toán gọi lần lượt 5 dịch vụ, giỏ hàng, giá, kho, thanh toán và vận chuyển. Mỗi dịch vụ đạt
      99 phẩy 9 phần trăm, chỉ ngừng 43 phút mỗi tháng. Vậy mà trang thanh toán ngừng khoảng 216 phút mỗi tháng. Hôm nay ta
      học gọi đồng bộ, gửi thông điệp, và vì sao chuỗi gọi dài hơn làm độ sẵn sàng giảm mạnh. Kết nối mười dịch vụ bằng lệnh
      gọi đồng bộ nối tiếp biến một trục trặc nhỏ ở đuôi thành cơn ác mộng sập toàn cầu. Lựa chọn đúng giữa gọi đồng bộ chờ
      ngay và phát thông điệp bất đồng bộ qua hàng đợi định đoạt độ bền chuỗi dịch vụ.
- id: prereq
  kind: prereq
  title: 'Ôn lại: phần trăm thời gian, phút trong tháng, xác suất độc lập'
  checks:
  - 30 * 24 * 60 == 43200 and round((1 - 0.999) * 100, 1) == 0.1
  steps:
  - show: '<table class="t"><tr><th>đại lượng</th><th>tính</th><th>kết quả</th></tr>

      <tr><td>số phút trong một tháng 30 ngày</td><td>$30 \cdot 24 \cdot 60$</td><td>43 200 phút</td></tr>

      <tr><td>sẵn sàng 99,9% thì ngừng</td><td>$100\% - 99{,}9\%$</td><td>0,1% thời gian</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Bài này cần hai phép tính quen thuộc. Một tháng 30 ngày, mỗi ngày 24 giờ, mỗi giờ 60 phút, nên có 30 nhân 24 nhân
      60, bằng 43 nghìn 200 phút. Một dịch vụ sẵn sàng 99 phẩy 9 phần trăm thì phần còn lại, 0 phẩy 1 phần trăm thời gian,
      là lúc nó ngừng. Gọi đồng bộ buộc mọi khâu trong chuỗi phải đồng thời khoẻ mạnh và phản hồi trong quỹ thời gian tổng
      thể.
  - show: '<p><b>Hai sự kiện độc lập</b> (cái này xảy ra không làm cái kia dễ hay khó xảy ra hơn): xác suất <b>cả hai</b>
      cùng xảy ra = tích hai xác suất.</p>

      <table class="t"><tr><th>ví dụ</th><th>cả hai cùng xảy ra</th></tr>

      <tr><td>hai đồng xu cùng ra mặt ngửa</td><td>$0{,}5 \cdot 0{,}5 = 0{,}25$</td></tr>

      <tr><td>hai dịch vụ, mỗi cái sống 90% thời gian, cùng sống</td><td>$0{,}9 \cdot 0{,}9 = 0{,}81$</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Trước hết, ta cần hiểu xác suất của hai sự kiện độc lập, tức cái này xảy ra không làm cái kia dễ hay khó xảy ra hơn.
      Khi đó, xác suất cả hai cùng xảy ra bằng tích hai xác suất. Hai đồng xu cùng ra mặt ngửa có xác suất 0 phẩy 5 nhân 0
      phẩy 5, bằng 0 phẩy 25, vì trong bốn khả năng ngang nhau chỉ có một khả năng cả hai cùng ngửa. Hai dịch vụ, mỗi cái
      sống 90 phần trăm thời gian, cùng sống với xác suất 0 phẩy 81. Với dịch vụ, độc lập nghĩa là cái này hỏng không làm
      cái kia dễ hỏng hơn.
- id: sym
  kind: symbol
  title: 'Giải mã: đồng bộ, bất đồng bộ, độ sẵn sàng'
  steps:
  - show: '<table class="t"><tr><th>cách</th><th>người gọi</th><th>bên nhận chết thì</th></tr>

      <tr><td><b>đồng bộ</b> (gọi và chờ)</td><td>đứng chờ phản hồi</td><td>người gọi cũng lỗi</td></tr>

      <tr><td><b>bất đồng bộ</b> (gửi thông điệp vào hàng đợi)</td><td>gửi xong đi tiếp</td><td>thông điệp nằm chờ, xử lý
      sau</td></tr></table>

      <p><b>Độ sẵn sàng</b> $p$: tỉ lệ thời gian dịch vụ trả lời đúng. Chuỗi $n$ dịch vụ gọi đồng bộ nối tiếp, hỏng độc lập:
      thành công khi <b>tất cả</b> thành công → $p^n$.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    - 2
    say: Bảng so hai cách giao tiếp. Gọi đồng bộ là gọi rồi đứng chờ phản hồi, bên nhận chết thì người gọi cũng lỗi. Gửi bất
      đồng bộ là đặt thông điệp vào hàng đợi rồi đi tiếp, bên nhận chết thì thông điệp nằm chờ để xử lý sau. Độ sẵn sàng p
      là tỉ lệ thời gian dịch vụ trả lời đúng. Chuỗi n dịch vụ gọi đồng bộ nối tiếp, hỏng độc lập, chỉ thành công khi tất
      cả thành công, nên độ sẵn sàng là p mũ n. Xác suất hỏng toàn tuyến đồng bộ tăng vọt theo độ dài chuỗi gọi trong khi
      hàng đợi tách rời từng mắt xích.
