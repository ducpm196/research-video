      y="215" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="745" y="262" text-anchor="middle">thanh
      toán</text><line x1="590" y1="255" x2="650" y2="255" stroke="#1f2937" stroke-width="3"/><line x1="840" y1="255" x2="950"
      y2="255" stroke="#eb6834" stroke-width="3" stroke-dasharray="8 6"/><rect x="950" y="220" width="200" height="70" rx="8"
      fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1050" y="263" text-anchor="middle">hàng đợi</text><line x1="1150"
      y1="255" x2="1220" y2="255" stroke="#eb6834" stroke-width="3" stroke-dasharray="8 6"/><text x="1230" y="245" font-size="21">thư,
      điểm thưởng:</text><text x="1230" y="275" font-size="21">xử lý sau</text><text x="750" y="350" text-anchor="middle"
      fill="#b91c1c">hàng trên: 5 mắt xích cùng phải sống; hàng dưới: chỉ 3 mắt xích liền nét</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hàng trên là trang thanh toán gọi đồng bộ, nối tiếp 5 dịch vụ, mỗi dịch vụ 99 phẩy 9 phần trăm. Yêu cầu chỉ thành
      công khi cả 5 mắt xích cùng sống, chỉ một cái ngừng là cả trang ngừng. Hàng dưới đưa việc gửi thư và cộng điểm thưởng
      sang hàng đợi, nên chỉ còn 3 mắt xích liền nét phải cùng sống. Phần đứt nét có ngừng thì thông điệp nằm chờ, khách vẫn
      đặt được hàng. Thay vì chờ trực tiếp trên đường dây điện thoại qua năm phòng ban, gửi phiếu xử lý qua khay chuyển văn
      bản độc lập.
- id: example
  kind: example
  title: Năm dịch vụ 99,9%
  checks:
  - round(0.999 ** 5, 6) == 0.995010 and round(alg.downtime_minutes(0.999)) == 43 and round(alg.downtime_minutes(0.999 **
    5)) == 216
  steps:
  - show: '<table class="t"><tr><th>số dịch vụ $n$</th><th>$0{,}999^n$</th></tr>

      <tr><td>1</td><td>0,999</td></tr><tr><td>2</td><td>0,998001</td></tr><tr><td>3</td><td>0,997003</td></tr>

      <tr><td>4</td><td>0,996006</td></tr><tr><td>5</td><td>$\hl{0{,}995010}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.6'
    - 1
    say: Bước một, thay p bằng 0 phẩy 999 rồi nhân dần từng dịch vụ một. Một dịch vụ là 0 phẩy 999. Nhân dần tới 5 dịch vụ,
      ta được 0 phẩy 999 mũ 5, khoảng 0 phẩy 995. Mỗi dịch vụ thêm vào làm chuỗi mất thêm chừng một phần nghìn.
  - show: '<p><b>Bước 2</b> — một dịch vụ ngừng 0,1% của tháng:</p>

      $$(1 - 0{,}999) \cdot 43\,200 = 0{,}001 \cdot 43\,200 = 43{,}2 \approx 43 \text{ phút}$$

      '
    focus:
    - 1
    - 2
    say: Bước hai, một dịch vụ ngừng 0 phẩy 1 phần trăm của tháng. Lấy 0 phẩy 001 nhân 43 nghìn 200 được 43 phẩy 2, tức khoảng
      43 phút mỗi tháng.
  - clear: true
    show: '<p><b>Bước 3</b> — cả chuỗi ngừng phần còn lại sau 0,995010:</p>

      $$(1 - 0{,}995010) \cdot 43\,200 = 0{,}00499 \cdot 43\,200 \approx 215{,}6 \approx \hl{216} \text{ phút}$$

      '
    focus:
    - 1
    - 2
    say: Bước ba, cả chuỗi ngừng phần còn lại sau 0 phẩy 995010, tức 0 phẩy 00499. Nhân với 43 nghìn 200 được khoảng 215 phẩy
      6, tức khoảng 216 phút mỗi tháng.
  - show: '<table class="t"><tr><th>so sánh</th><th>ngừng mỗi tháng</th></tr>

      <tr><td>một dịch vụ</td><td>≈ 43 phút</td></tr>

      <tr><td>chuỗi 5 dịch vụ</td><td>≈ 216 phút ≈ $5 \cdot 43{,}2$</td></tr></table>

      <div class="box key"><b>Bước 4</b> — thời gian ngừng gần như <b>cộng dồn</b>: 5 dịch vụ ≈ 5 lần. Trang chỉ tốt bằng
      mắt xích yếu nhất — và còn kém hơn thế.</div>

      <p class="note"><b>So sánh gọi đồng bộ và gửi thông điệp:</b> gọi đồng bộ trả kết quả ngay nhưng ghép chặt độ sẵn sàng
      theo phép nhân nối tiếp; gửi thông điệp bất đồng bộ qua hàng đợi chịu được dịch vụ đích tạm nghỉ khi chưa cần trả lời
      tức thì.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    - 3
    say: Bước bốn, so hai kết quả. Một dịch vụ ngừng khoảng 43 phút. Chuỗi 5 dịch vụ ngừng khoảng 216 phút, gần bằng 5 nhân
      43 phẩy 2. Thời gian ngừng gần như cộng dồn, 5 dịch vụ thì khoảng 5 lần. Trang chỉ tốt bằng mắt xích yếu nhất, và thực
      ra còn kém hơn thế. Khi so sánh hai kiểu giao tiếp, gọi đồng bộ gắn chặt sinh tử các mắt xích liên tiếp, còn gửi thông
      điệp giúp tách nhịp chờ khi có thể trễ.
- id: check
  kind: check
  title: Tự kiểm bằng đường khác
  checks:
  - 5 * 43.2 == 216.0 and 215.5 < (1 - 0.999 ** 5) * 43200 < 216.0
  - len(list(__import__('itertools').product([1, 0], repeat=5))) == 32 and abs(sum(math.prod(0.999 if u else 0.001 for u in
    c) for c in __import__('itertools').product([1, 0], repeat=5) if not all(c)) - (1 - 0.999 ** 5)) < 1e-12
  steps:
  - show: '<table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>cộng thẳng thời gian ngừng</td><td>$5 \cdot 43{,}2 = 216$ phút — hơi dư, vì có lúc hai dịch vụ cùng ngừng mà
      ta đếm hai lần</td><td>216 so với 215,6 ✓</td></tr>

      <tr><td>liệt kê mọi trường hợp</td><td>5 dịch vụ, mỗi cái sống hoặc ngừng: $2^5 = 32$ trường hợp; cộng xác suất 31 trường
      hợp có ít nhất một cái ngừng</td><td>0,00499, khớp $1 - 0{,}995010$ ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác, vì một đường không dùng lũy thừa mà vẫn ra cùng con số thì đáng tin. Cộng thẳng thời gian ngừng
      của 5 dịch vụ được 216 phút, hơi dư so với 215 phẩy 6. Đó là vì có lúc hai dịch vụ cùng ngừng, mà phép cộng đếm lúc
      đó hai lần. Liệt kê mọi trường hợp sống hay ngừng của 5 dịch vụ, ta có 2 mũ 5, bằng 32 trường hợp. Cộng xác suất của
      31 trường hợp có ít nhất một cái ngừng, được 0 phẩy 00499, khớp với 1 trừ 0 phẩy 995010.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc, 1 lỗi người đã đi làm
  checks:
  - round(1 - 0.001 ** 2, 6) == 0.999999 and round(0.999999 ** 5, 6) == 0.999995 and round(alg.downtime_minutes(0.999999 **
    5) * 60) == 13
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Gọi đồng bộ cho việc không cần chờ <b class="red">(phụ thuộc thừa)</b>

      <br><span class="note">Gửi thư xác nhận, cộng điểm thưởng không cần xong trước khi trả lời khách. Đưa vào hàng đợi:
      dịch vụ thư chết thì đơn hàng vẫn thành công.</span></div>

      '
    say: Lỗi thứ nhất, gọi đồng bộ cho việc không cần chờ. Gửi thư xác nhận hay cộng điểm thưởng không cần xong trước khi
      trả lời khách. Hãy đưa vào hàng đợi, để dịch vụ thư có chết thì đơn hàng vẫn thành công. Gọi tuần tự từng bước gửi thư
      điện tử, tính điểm và xuất hoá đơn ngay trong lượt mua hàng của khách. Nối chuỗi năm cuộc gọi đồng bộ liên tiếp khiến
      độ sẵn sàng tổng giảm tụt theo tích xác suất sống của từng mắt xích. Thả lỏng không đặt hạn mức chờ giữa chuỗi năm dịch
      vụ khiến nghẽn một dịch vụ nhỏ làm sập toàn chuỗi.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Nghĩ bất đồng bộ là miễn phí <b class="red">(chuyển độ phức tạp)</b>

      <br><span class="note">Thông điệp có thể tới trễ, tới hai lần, sai thứ tự. Bên nhận phải xử lý được cả ba.</span></div>

      '
    say: Lỗi thứ hai, nghĩ bất đồng bộ là miễn phí. Thông điệp có thể tới trễ, tới hai lần, hoặc sai thứ tự, và bên nhận phải
      xử lý được cả ba trường hợp đó. Không đặt chuẩn thời gian chờ khi kết nối đồng bộ để người dùng giữ kết nối treo hàng
      phút làm cạn sạch luồng phục vụ. Chờ xử lý gửi thư và xuất báo cáo nặng đồng bộ ngay trong lúc khách bấm nút xác nhận
      thanh toán. Gửi sự kiện sang hàng đợi bất đồng bộ trước khi giao dịch cơ sở dữ liệu thật sự ghi nhận thành công.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nhân độ sẵn sàng khi các lỗi <b>không</b> độc lập <b class="red">(lạc quan)</b>

      <br><span class="note">Năm dịch vụ cùng dùng một cơ sở dữ liệu: nó chết thì cả năm cùng chết. Công thức $p^n$ chỉ đúng
      khi hỏng độc lập; phụ thuộc chung làm mọi thứ hỏng cùng lúc.</span></div>

      '
    say: Lỗi thứ ba, nhân độ sẵn sàng khi các lỗi không độc lập. Năm dịch vụ cùng dùng một cơ sở dữ liệu thì nó chết là cả
      năm cùng chết. Công thức p mũ n chỉ đúng khi hỏng độc lập. Chuyển hết mọi tác vụ đọc tức thì sang bất đồng bộ gây khó
      hiểu giao diện khi màn hình phải đợi làm mới. Quên cài cơ chế chống lặp khi đẩy tác vụ sang hàng đợi bất đồng bộ làm
      thư thông báo gửi đúp cho khách.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đổi gọi nối tiếp thành gọi song song, tưởng sẵn sàng tăng
      <b class="red">(chỉ nhanh hơn)</b></div>

      <table class="t"><tr><th>cách</th><th>cần</th><th>sẵn sàng</th></tr>

      <tr><td>5 dịch vụ gọi nối tiếp</td><td>cả 5 trả lời</td><td>0,995010</td></tr>

      <tr><td>5 dịch vụ gọi song song, chờ đủ 5</td><td>vẫn cả 5 trả lời</td><td>0,995010 — <b>không đổi</b></td></tr>

      <tr><td>mỗi dịch vụ chạy 2 bản hỏng độc lập, cần 1 bản sống</td><td>mỗi mắt xích: $1 - 0{,}001^2 = 0{,}999999$</td><td>$0{,}999999^5
      \approx 0{,}999995$: ngừng ≈ 13 giây mỗi tháng</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.4'
    - '2.4'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, đổi gọi nối tiếp thành gọi song song và tưởng độ sẵn sàng tăng lên. Gọi song
      song chỉ làm trang nhanh hơn, còn nếu vẫn phải chờ đủ 5 câu trả lời thì vẫn cần cả 5 cùng sống. Vì vậy độ sẵn sàng vẫn
      là 0 phẩy 995010, không đổi. Thứ làm tăng độ sẵn sàng là bản dự phòng, chẳng hạn mỗi dịch vụ chạy 2 bản hỏng độc lập,
      chỉ cần 1 bản sống. Khi đó mỗi mắt xích chỉ ngừng khi cả hai bản cùng ngừng, xác suất 0 phẩy 001 bình phương, nên sẵn
      sàng 0 phẩy 999999. Cả chuỗi còn khoảng 0 phẩy 999995, ngừng chừng 13 giây mỗi tháng, miễn là hai bản thật sự hỏng độc
      lập như Lỗi 3 đã nói. Thiếu cơ chế báo lỗi cho người dùng nếu tác vụ bất đồng bộ sau cùng bị trục trặc ở tầng hậu xử
      lý.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(alg.chain_availability(0.99, 3), 4) == 0.9703 and round(alg.downtime_minutes(0.99 ** 3)) == 1283
  - round(alg.chain_availability(0.999, 3), 3) == 0.997
  - round(1 - 0.9703, 4) == 0.0297 and round(1283 / 60) == 21 and round(alg.downtime_minutes(0.999 ** 3)) == 129
  - round(alg.chain_availability(0.999, 4), 3) == 0.996
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>3 dịch vụ nối tiếp, mỗi cái 99%: cả chuỗi sẵn sàng bao nhiêu? Ngừng khoảng bao nhiêu phút mỗi tháng?</td></tr>

      <tr><td>2</td><td>Trang thanh toán chuyển “thư” và “điểm thưởng” sang hàng đợi, còn 3 dịch vụ đồng bộ 99,9%. Sẵn sàng
      bao nhiêu?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, 3 dịch vụ nối tiếp, mỗi cái 99 phần trăm, cả chuỗi sẵn sàng bao nhiêu? Ngừng
      khoảng bao nhiêu phút mỗi tháng? Câu hai, trang thanh toán chuyển thư và điểm thưởng sang hàng đợi, còn lại 3 dịch vụ
      đồng bộ 99 phẩy 9 phần trăm. Sẵn sàng bao nhiêu? Dừng video và làm ra giấy.
    pause: 15
  - show: '<table class="t"><tr><th>câu 1</th><th>tính</th><th>kết quả</th></tr>

      <tr><td>sẵn sàng của chuỗi</td><td>$0{,}99^3$</td><td>$\approx \hl{0{,}9703}$</td></tr>

      <tr><td>phần ngừng</td><td>$1 - 0{,}9703$</td><td>0,0297</td></tr>

      <tr><td>phút ngừng mỗi tháng</td><td>$0{,}0297 \cdot 43\,200$</td><td>$\approx \hl{1283}$ phút ≈ 21 giờ</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Đáp án câu một, làm từng bước. Ba dịch vụ nối tiếp nên lấy 0 phẩy 99 mũ 3, khoảng 0 phẩy 9703. Phần ngừng là 1 trừ
      đi số đó, tức 0 phẩy 0297. Nhân với 43 nghìn 200 phút được khoảng 1283 phút, tức khoảng 21 giờ mỗi tháng. Tính chính
      xác độ sẵn sàng tổng thể của chuỗi ba dịch vụ nối tiếp đồng bộ so với một dịch vụ mặt trước tách hàng đợi.
  - clear: true
    show: '<table class="t"><tr><th>câu 2</th><th>tính</th><th>kết quả</th></tr>

      <tr><td>chỉ còn 3 mắt xích đồng bộ</td><td>$0{,}999^3$</td><td>$\approx \hl{0{,}997}$</td></tr>

      <tr><td>phút ngừng mỗi tháng</td><td>$(1 - 0{,}997003) \cdot 43\,200$</td><td>≈ 129 phút, thay vì 216</td></tr></table>

      <p>Lưu ý: bước ghi vào hàng đợi cũng là một mắt xích đồng bộ; hàng đợi 99,9% thì chuỗi là $0{,}999^4 \approx 0{,}996$.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    say: Câu hai, thư và điểm thưởng đã sang hàng đợi, nên chỉ còn 3 mắt xích đồng bộ. Lấy 0 phẩy 999 mũ 3, được khoảng 0
      phẩy 997. Đổi ra thời gian, trang ngừng khoảng 129 phút mỗi tháng thay vì 216 phút, tốt hơn chuỗi 5 dịch vụ. Lưu ý,
      bước ghi vào hàng đợi cũng là một mắt xích đồng bộ, nên nếu hàng đợi sẵn sàng 99 phẩy 9 phần trăm thì chuỗi là 0 phẩy
      999 mũ 4, khoảng 0 phẩy 996.
