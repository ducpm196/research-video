    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>1_000_000</code></td><td>Dấu <code>_</code> giúp dễ đọc số lớn (không đổi giá trị); <code>1e-9</code>/<code>1e6</code> là lũy thừa của 10</td></tr><tr><td><code>**</code></td><td><code>**</code> là lũy thừa; <code>//</code> là chia lấy nguyên; <code>%</code> là chia lấy phần dư</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{:.2f}, {:.1f}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
