      font-weight="bold">đồng bộ, nối tiếp: một mắt xích ngừng là cả trang ngừng</text><text x="20" y="108">yêu cầu</text><rect
      x="150" y="60" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="245" y="95"
