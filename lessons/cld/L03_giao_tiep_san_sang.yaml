      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Từ số chặng gọi nối tiếp và độ sẵn sàng từng dịch vụ,
      nhân xác suất để tính độ sẵn sàng chung theo phần trăm. Sau đó tính số phút gián đoạn kỳ vọng trong một năm năm trăm
