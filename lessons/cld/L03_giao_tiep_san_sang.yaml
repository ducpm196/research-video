- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">đồng bộ: chờ, cùng chết</span><span class="a">→</span>
      <span class="n">chuỗi $n$ dịch vụ: $p^n$</span><span class="a">→</span>
      <span class="n">ngừng gần như cộng dồn</span><span class="a">→</span>
      <span class="n">việc không cần chờ: đưa vào hàng đợi</span></div>
    say: Tổng kết lại, gọi đồng bộ là chờ và cùng chết. Chuỗi n dịch vụ có độ sẵn sàng p mũ n, thời gian ngừng gần như cộng dồn, nên việc không cần chờ hãy đưa vào hàng đợi. Chuyển các tác vụ không cần phản hồi ngay sang hàng đợi bất đồng bộ cắt đứt dây chuyền sập đồng loạt giữa các dịch vụ liền kề.
  - show: |
      <div class="box key"><b>Tư duy:</b> mỗi phụ thuộc đồng bộ là một lá phiếu “tôi chết theo bạn”. Chỉ bỏ phiếu khi thật sự cần câu trả lời ngay.</div>
      <p class="note"><b>Hai mức quy mô:</b> một dịch vụ đạt 99,9% chỉ ngừng ~43 phút/tháng (526 phút/năm); ghép chuỗi nối tiếp 5 dịch vụ thì sẵn sàng tụt xuống ~99,5% — tương đương 216 phút/tháng (2 623 phút/năm) ngừng theo dây chuyền.</p>
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Điều cần mang theo, mỗi phụ thuộc đồng bộ là một lá phiếu tôi chết theo bạn. Chỉ bỏ phiếu khi thật sự cần câu trả lời ngay. Ở hai mức quy mô, 1 dịch vụ đạt 99 phẩy 9 phần trăm chỉ ngừng khoảng 43 phút mỗi tháng. Ghép chuỗi 5 dịch vụ nối tiếp đẩy thời gian gián đoạn lên gấp năm lần.
  - clear: true
    show: |
      <p class="note">Bài sau (bài 4): <b>chịu lỗi</b> — hết giờ, thử lại có lùi, cầu dao ngắt.</p>
    forward_ref: true
    say: Ở bài sau, bài 4, ta học cách chịu lỗi, với hết giờ, thử lại có lùi, và cầu dao ngắt. Hẹn gặp bạn ở bài tiếp theo.
