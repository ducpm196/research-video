        say: "Câu hai, ta tính từng ý. Còn lại 216 trừ 150, bằng 66 phút cho 10 ngày cuối. Đã tiêu khoảng 69 phần trăm ngân sách, tức gần 70 phần trăm, trong khoảng 67 phần trăm thời gian, tức hai phần ba tháng. Vì tiêu nhanh hơn đường tiêu đều một chút, nhóm nên phát hành thận trọng hơn."
      - show: |
