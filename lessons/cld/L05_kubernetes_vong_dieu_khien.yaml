source: "curriculum/cld.yaml L05; audit/cld/verify_cld.py L05; Kubernetes Docs, Concepts → Controllers; Workloads → Pods, Deployments; Services (kubernetes.io, đọc 2026-10-28); B. Burns, B. Grant, D. Oppenheimer, E. Brewer, J. Wilkes, Borg, Omega, and Kubernetes, ACM Queue 14(1), 2016"
