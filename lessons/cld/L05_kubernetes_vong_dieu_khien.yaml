# Quy ước: khoá dạy nguyên lý; tên đối tượng Kubernetes (Pod, Deployment, Service) giữ nguyên trên màn hình. alg.reconcile(desired, kills) mô phỏng
#   vòng điều khiển: mỗi nhịp có kills[t] Pod chết, rồi bộ điều khiển đưa số Pod về mong muốn.
objectives:
  - "Giải thích mô hình khai báo trạng thái mong muốn"
  - "Mô tả Pod, Deployment, Service"
  - "Hiểu vòng điều khiển tự hồi phục"
