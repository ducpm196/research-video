scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ba giờ sáng, một máy chết"
    checks:
      - "alg.reconcile(3, [1])  == [2, 3]"
    steps:
      - show: |
          <p>Ba giờ sáng, một máy chủ chết, mang theo một trong ba bản của dịch vụ đặt hàng. Không ai thức. Vài phút sau, đã có lại đủ 3 bản chạy trên các máy còn lại — không ai gõ lệnh nào.</p>
          <div class="box key">Hôm nay: <b>Kubernetes</b> — ta khai báo <b>muốn gì</b>, hệ thống tự làm cho thực tế khớp với điều đó.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, ba giờ sáng, một máy chủ chết, mang theo một trong ba bản của dịch vụ đặt hàng. Không ai thức cả. Vài phút sau, đã có lại đủ 3 bản chạy trên các máy còn lại, mà không ai gõ lệnh nào. Hôm nay ta học Kubernetes, ta khai báo mình muốn gì, và hệ thống tự làm cho thực tế khớp với điều đó."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: container, ảnh, nhiều bản, và một vòng điều chỉnh quen thuộc"
    checks:
      - "round(2 / 3 * 100) == 67 and 3 - 1 == 2"
      - "28 - 25 == 3 and 25 - 25 == 0"
    steps:
      - show: |
          <table class="t"><tr><th>đã học</th><th>nhắc lại</th><th>ví dụ</th></tr>
          <tr><td>container (bài 1)</td><td>một tiến trình được nhân hệ điều hành cô lập</td><td>chạy dịch vụ đặt hàng</td></tr>
          <tr><td>ảnh (bài 2)</td><td>gói chương trình và thư viện; chạy cùng ảnh nhiều lần ra nhiều bản giống hệt</td><td>một ảnh, 3 bản</td></tr>
          <tr><td>nhiều bản</td><td>một bản chết, các bản khác vẫn phục vụ</td><td>3 bản trên 3 máy, chết 1 máy: còn 2 trên 3 bản, khoảng 67%</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.4"]
        say: "Bài này dựa trên ba điều đã học. Ở bài 1, container là một tiến trình được nhân hệ điều hành cô lập. Ở bài 2, ảnh là gói chương trình cùng thư viện, chạy cùng một ảnh nhiều lần thì ra nhiều bản giống hệt nhau. Chạy nhiều bản để một bản chết thì các bản khác vẫn phục vụ. Ví dụ 3 bản trên 3 máy, chết 1 máy thì còn 2 trên 3 bản, khoảng 67 phần trăm sức phục vụ."
      - show: |
          <p><b>Vòng điều chỉnh quen thuộc</b>: máy lạnh đặt 25 độ. Ta không bảo nó “bật 10 phút”, ta nói <b>muốn</b> 25 độ.</p>
          <table class="t"><tr><th>phòng đo được</th><th>so với 25 độ</th><th>máy lạnh làm</th></tr>
          <tr><td>28 độ</td><td>nóng hơn 3 độ</td><td>chạy làm lạnh</td></tr>
          <tr><td>25 độ</td><td>khớp</td><td>nghỉ</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Một vòng điều chỉnh quen thuộc là máy lạnh đặt 25 độ. Ta không bảo nó bật 10 phút, mà nói mình muốn 25 độ. Máy đo phòng rồi so với điều ta muốn. Phòng 28 độ, nóng hơn 3 độ, thì nó chạy làm lạnh. Phòng đúng 25 độ thì khớp, nên nó nghỉ."

  - id: sym
    kind: symbol
    title: "Giải mã: Pod, Deployment, Service"
    steps:
      - show: |
          <table class="t"><tr><th>đối tượng</th><th>là gì</th></tr>
          <tr><td><b>Pod</b></td><td>đơn vị chạy nhỏ nhất: một (hoặc vài) container chung mạng, chung ổ đĩa; có thể bị xoá và tạo lại bất cứ lúc nào</td></tr>
          <tr><td><b>Deployment</b> (triển khai)</td><td>khai báo “muốn $n$ bản Pod từ ảnh này”; lo việc tạo lại, cập nhật</td></tr>
          <tr><td><b>Service</b> (dịch vụ)</td><td>một địa chỉ ổn định trỏ tới các Pod đang sống, dù Pod đổi liên tục</td></tr></table>
          <div class="box key"><b>Khai báo</b>, không ra lệnh: ta không viết “tạo thêm 1 Pod”, mà viết “muốn có 3 Pod”.</div>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng giới thiệu ba đối tượng cơ bản. Pod là đơn vị chạy nhỏ nhất, gồm một hoặc vài container chung mạng, chung ổ đĩa, và có thể bị xoá rồi tạo lại bất cứ lúc nào. đối tượng triển khai khai báo muốn có n bản Pod từ một ảnh, và lo việc tạo lại, cập nhật. đối tượng dịch vụ là một địa chỉ ổn định trỏ tới các Pod đang sống, dù Pod đổi liên tục. Đây là khai báo chứ không ra lệnh, ta không viết tạo thêm một Pod, mà viết muốn có 3 Pod."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một vòng lặp kéo thực tế về điều ta muốn"
    checks:
      - "alg.reconcile(3, [1]) == [2, 3] and 3 - 2 == 1"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><g font-size="24" fill="#1f2937"><rect x="60" y="40" width="360" height="110" rx="12" stroke="#1f2937" stroke-width="2" fill="#dbeafe"/><text x="240" y="85" text-anchor="middle" font-weight="bold">mong muốn</text><text x="240" y="125" text-anchor="middle">khai báo: 3 bản</text><rect x="1080" y="40" width="360" height="110" rx="12" stroke="#1f2937" stroke-width="2" fill="#ffedd5"/><text x="1260" y="85" text-anchor="middle" font-weight="bold">thực tế trên cụm</text><text x="1260" y="125" text-anchor="middle">đang sống: 2 bản</text><rect x="570" y="40" width="360" height="110" rx="12" stroke="#1f2937" stroke-width="2" fill="#f3f4f6"/><text x="750" y="85" text-anchor="middle" font-weight="bold">so sánh</text><text x="750" y="125" text-anchor="middle" fill="#b91c1c">thiếu 3 trừ 2 = 1</text><rect x="570" y="230" width="360" height="110" rx="12" stroke="#1f2937" stroke-width="2" fill="#d1fae5"/><text x="750" y="275" text-anchor="middle" font-weight="bold">hành động</text><text x="750" y="315" text-anchor="middle" fill="#059669">tạo 1 Pod mới</text><line x1="420" y1="95" x2="570" y2="95" stroke="#2a78d6" stroke-width="4"/><polygon points="570,95 552,85 552,105" fill="#2a78d6"/><line x1="1080" y1="95" x2="930" y2="95" stroke="#eb6834" stroke-width="4"/><polygon points="930,95 948,85 948,105" fill="#eb6834"/><line x1="750" y1="150" x2="750" y2="230" stroke="#1f2937" stroke-width="4"/><polygon points="750,230 740,212 760,212" fill="#1f2937"/><path d="M 930 285 L 1260 285 L 1260 150" fill="none" stroke="#059669" stroke-width="4"/><polygon points="1260,150 1250,168 1270,168" fill="#059669"/><text x="1100" y="320" fill="#059669">thực tế về lại 3</text><text x="60" y="230">quan sát, so sánh, hành động,</text><text x="60" y="265">rồi lặp lại mãi</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ vòng điều khiển, giống hệt máy lạnh nhưng thay nhiệt độ bằng số bản. Ô xanh là điều ta khai báo, muốn 3 bản, còn ô cam là thực tế trên cụm, đang sống 2 bản. Bộ điều khiển so hai ô, thấy thiếu 3 trừ 2 bằng 1, nên hành động tạo 1 Pod mới, và thực tế về lại 3. Vòng này lặp lại mãi, nên dù hỏng lúc nào thì thực tế cũng bị kéo về điều ta muốn."

  - id: example
    kind: example
    title: "Vòng điều khiển: quan sát, so sánh, hành động"
    checks:
      - "alg.reconcile(3, [1, 0, 2]) == [2, 3, 3, 3, 1, 3]"
    steps:
      - show: |
          <div class="chain"><span class="n">quan sát thực tế</span><span class="a">→</span><span class="n">so với mong muốn</span><span class="a">→</span><span class="n">hành động để thu hẹp chênh lệch</span><span class="a">→</span><span class="n">lặp lại</span></div>
          <table class="t"><tr><th>nhịp</th><th>sự kiện</th><th>thực tế</th><th>mong muốn</th><th>bộ điều khiển</th></tr>
          <tr><td>1</td><td>1 Pod chết</td><td>$3 - 1 = 2$</td><td>3</td><td>$2 \neq 3$, thiếu 1 → tạo 1 → <b>3</b></td></tr></table>
        introduces: [neq]
        focus: [1, 2, "2.2", "2.2"]
        say: "Bước một, vòng điều khiển gồm quan sát thực tế, so với mong muốn, hành động để thu hẹp chênh lệch, rồi lặp lại. Bảng ghi ba nhịp của vòng với mong muốn là 3 Pod. Nhịp một, một Pod chết, thực tế còn 2, khác 3, nên bộ điều khiển tạo thêm 1. Thực tế lại là 3."
      - show: |
          <table class="t"><tr><th>nhịp</th><th>sự kiện</th><th>thực tế</th><th>mong muốn</th><th>bộ điều khiển</th></tr>
          <tr><td>2</td><td>không có gì</td><td>3</td><td>3</td><td>khớp → không làm gì</td></tr></table>
          <p><b>Bước 2</b> — chênh lệch bằng 0 thì vòng vẫn chạy, chỉ là không có việc gì để làm.</p>
        focus: [1, "1.2", 2]
        say: "Bước hai, nhịp hai không có gì xảy ra. Thực tế khớp nên không làm gì. Vòng vẫn chạy, chỉ là chênh lệch bằng 0 nên không có việc gì để làm."
      - show: |
          <table class="t"><tr><th>nhịp</th><th>sự kiện</th><th>thực tế</th><th>mong muốn</th><th>bộ điều khiển</th></tr>
          <tr><td>3</td><td>một máy chết, mất 2 Pod</td><td>$3 - 2 = 1$</td><td>3</td><td>thiếu $3 - 1 = 2$ → tạo 2 → <b>3</b></td></tr></table>
          <p><b>Bước 3</b> — bộ điều khiển không cần biết <b>vì sao</b> mất Pod, chỉ cần biết thiếu bao nhiêu.</p>
        focus: [1, "1.2", 2]
        say: "Bước ba, xét nhịp ba. Nhịp ba, một máy chết làm mất 2 Pod, bộ điều khiển tạo thêm 2 và đưa về 3. Bộ điều khiển không cần biết vì sao mất Pod, chỉ cần biết thiếu bao nhiêu."
      - clear: true
        show: |
          <table class="t"><tr><th>mong muốn trừ thực tế</th><th>ví dụ (muốn 3)</th><th>bộ điều khiển</th></tr>
          <tr><td>dương</td><td>thực tế 1: $3 - 1 = 2$</td><td>tạo 2 Pod</td></tr>
          <tr><td>bằng 0</td><td>thực tế 3</td><td>không làm gì</td></tr>
          <tr><td>âm</td><td>thực tế 4: $3 - 4 = -1$</td><td>xoá 1 Pod</td></tr></table>
          <div class="box key"><b>Bước 4</b> — cả vòng chỉ là một phép trừ lặp lại: hành động = mong muốn trừ thực tế.</div>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước bốn, gom lại thành một quy tắc. Nếu mong muốn trừ thực tế là số dương, như 3 trừ 1 bằng 2, thì tạo 2 Pod. Nếu bằng 0 thì không làm gì. Nếu là số âm, ví dụ vì lý do nào đó thực tế là 4, thì 3 trừ 4 bằng âm 1, nên xoá bớt 1 Pod. Cả vòng điều khiển chỉ là một phép trừ được lặp lại mãi."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "[3 - k for k in (1, 0, 2)] == alg.reconcile(3, [1, 0, 2])[0::2] == [2, 3, 1]"
      - "(lambda h: sum(h[i + 1] - h[i] for i in range(0, len(h), 2)))(alg.reconcile(3, [1, 0, 2])) == 1 + 0 + 2 == 3 and alg.reconcile(3, [-1]) == [4, 3]"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>cột thực tế</td><td>mỗi nhịp bắt đầu từ 3, trừ số Pod chết: $3 - 1$, $3 - 0$, $3 - 2$</td><td>2, 3, 1 ✓</td></tr>
          <tr><td>tổng số Pod tạo thêm</td><td>phải bằng tổng số Pod chết, vì cuối nhịp nào cũng về 3</td><td>$1 + 0 + 2 = 3$ ✓</td></tr>
          <tr><td>trường hợp thừa</td><td>máy thử với thực tế 4</td><td>xoá 1, về 3 ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, vì lặp lại bảng thì không phát hiện được lỗi. Cuối nhịp nào cũng về 3, nên thực tế của mỗi nhịp là 3 trừ số Pod chết, tức 2, 3 và 1, khớp với bảng. Cũng vì thế, tổng số Pod tạo thêm phải bằng tổng số Pod chết, 1 cộng 0 cộng 2 bằng 3, và máy đếm lại ra đúng 3. Cho máy thử trường hợp thừa với thực tế là 4, bộ điều khiển xoá 1 và về lại 3."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "alg.reconcile(6, [3]) == [3, 6] and 6 - 3 == 3 and 3 / 6 == 0.5"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lưu dữ liệu quan trọng trong hệ tệp của Pod <b class="red">(mất)</b>
          <br><span class="note">Pod bị xoá và tạo lại là chuyện thường ngày; Pod mới có hệ tệp mới. Dữ liệu cần giữ phải ở ổ lưu trữ bền hoặc cơ sở dữ liệu bên ngoài.</span></div>
        say: "Lỗi thứ nhất, lưu dữ liệu quan trọng trong hệ tệp của Pod. Pod bị xoá và tạo lại là chuyện thường ngày, và Pod mới có hệ tệp mới. Dữ liệu cần giữ phải nằm ở ổ lưu trữ bền hoặc cơ sở dữ liệu bên ngoài."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Sửa tay trực tiếp trên cụm <b class="red">(bị ghi đè)</b>
          <br><span class="note">Xoá bớt một Pod “cho nhẹ”: bộ điều khiển tạo lại ngay vì mong muốn vẫn là 3. Muốn đổi thì đổi <b>khai báo</b>, và lưu khai báo trong kho mã.</span></div>
        say: "Lỗi thứ hai, sửa tay trực tiếp trên cụm. Xoá bớt một Pod cho nhẹ thì bộ điều khiển tạo lại ngay, vì mong muốn vẫn là 3. Muốn đổi thì phải đổi khai báo, và lưu khai báo đó trong kho mã."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Gọi thẳng địa chỉ của một Pod <b class="red">(đổi liên tục)</b>
          <br><span class="note">Pod tạo lại có địa chỉ mới. Luôn gọi qua Service: địa chỉ ổn định, tự trỏ tới các Pod đang sống.</span></div>
        say: "Lỗi thứ ba, gọi thẳng địa chỉ của một Pod. Pod tạo lại sẽ có địa chỉ mới, nên luôn gọi qua đối tượng dịch vụ, một địa chỉ ổn định tự trỏ tới các Pod đang sống."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Hai nơi cùng ghi một con số <b class="red">(giành nhau)</b></div>
          <table class="t"><tr><th>lúc</th><th>ai ghi số bản</th><th>số bản</th></tr>
          <tr><td>giờ cao điểm</td><td>bộ tự co giãn thấy tải cao, nâng lên</td><td>6</td></tr>
          <tr><td>ai đó áp lại khai báo cũ trong kho mã</td><td>khai báo vẫn ghi 3</td><td>3: xoá $6 - 3 = 3$ bản, mất một nửa sức phục vụ</td></tr>
          <tr><td>vài phút sau</td><td>bộ tự co giãn lại nâng lên</td><td>6</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, hai nơi cùng ghi một con số nên giành nhau. Giờ cao điểm, bộ tự co giãn, một bộ điều khiển khác tự tăng giảm số bản theo tải, thấy tải cao và nâng số bản lên 6. Rồi ai đó áp lại khai báo cũ trong kho mã, vẫn ghi 3, nên 3 bản bị xoá, mất một nửa sức phục vụ đúng lúc đông khách nhất. Vài phút sau, bộ tự co giãn lại nâng lên 6, và cứ thế giằng co. Người làm nghề quy định mỗi con số chỉ có một chủ, đã giao số bản cho bộ tự co giãn thì bỏ số bản khỏi khai báo."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.reconcile(5, [2, 0, 1]) == [3, 5, 5, 5, 4, 5]"
    steps:
      - show: |
          <p>Deployment muốn 5 Pod. Nhịp 1: 2 Pod chết. Nhịp 2: không có gì. Nhịp 3: 1 Pod chết.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ở mỗi nhịp, bộ điều khiển thấy bao nhiêu Pod và tạo thêm bao nhiêu?</td></tr>
          <tr><td>2</td><td>Bạn xoá tay 1 Pod khi đang đủ 5. Chuyện gì xảy ra?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, đối tượng triển khai muốn 5 Pod. Nhịp một có 2 Pod chết, nhịp hai không có gì, nhịp ba có 1 Pod chết. Câu một, ở mỗi nhịp, bộ điều khiển thấy bao nhiêu Pod và tạo thêm bao nhiêu? Câu hai, bạn xoá tay 1 Pod khi đang đủ 5, chuyện gì xảy ra? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>nhịp</th><th>thấy</th><th>mong muốn trừ thực tế</th><th>tạo thêm</th></tr>
          <tr><td>1</td><td>$5 - 2 = 3$</td><td>$5 - 3 = 2$</td><td>$\hl{2}$</td></tr>
          <tr><td>2</td><td>5</td><td>0</td><td>0</td></tr>
          <tr><td>3</td><td>$5 - 1 = 4$</td><td>$5 - 4 = 1$</td><td>$\hl{1}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, ta dùng đúng quy tắc của bước bốn. Nhịp một có 2 Pod chết nên thấy 3, mong muốn trừ thực tế bằng 2, nên tạo 2. Nhịp hai thấy 5, chênh lệch bằng 0, nên không làm gì. Ở nhịp ba, bộ điều khiển thấy 4, chênh lệch bằng 1, nên tạo thêm 1."
      - show: |
          <table class="t"><tr><th>bạn làm</th><th>bộ điều khiển thấy</th><th>kết quả</th></tr>
          <tr><td>xoá tay 1 Pod</td><td>$4 \neq 5$, thiếu 1</td><td>tạo lại 1 Pod ngay</td></tr>
          <tr><td>sửa khai báo thành 4</td><td>$5 - 4 = 1$ thừa</td><td>xoá 1, giữ 4</td></tr></table>
        focus: ["1.2", "1.2", "1.3"]
        say: "Câu hai, bộ điều khiển thấy 4 khác 5 nên tạo lại 1 Pod ngay, muốn 4 thì phải sửa khai báo thành 4. Lý do là xoá tay chỉ đổi thực tế, không đổi mong muốn. Khi đó thực tế 5 thừa 1 so với mong muốn 4, nên bộ điều khiển xoá 1 và giữ đúng 4."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">khai báo mong muốn</span><span class="a">→</span>
          <span class="n">vòng điều khiển: quan sát, so sánh, hành động</span><span class="a">→</span>
          <span class="n">Pod tạm thời, Service ổn định</span><span class="a">→</span>
          <span class="n">đổi khai báo, không sửa tay</span></div>
        say: "Tổng kết lại, ta khai báo trạng thái mong muốn, vòng điều khiển quan sát, so sánh và hành động. Pod là tạm thời, đối tượng dịch vụ là ổn định, và muốn đổi thì đổi khai báo, không sửa tay."
      - show: |
          <div class="box key"><b>Tư duy:</b> hệ thống tự hồi phục không phải vì không có gì hỏng, mà vì có một vòng lặp luôn kéo thực tế về điều ta mong muốn.</div>
        say: "Điều cần mang theo, hệ thống tự hồi phục không phải vì không có gì hỏng, mà vì có một vòng lặp luôn kéo thực tế về điều ta mong muốn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>xếp lịch Pod</b> — yêu cầu, giới hạn tài nguyên và xếp thùng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học cách xếp lịch Pod, với yêu cầu, giới hạn tài nguyên, và bài toán xếp thùng. Hẹn gặp bạn ở bài tiếp theo."
