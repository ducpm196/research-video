    * len(x)) - 1]) == (1000, 10, 10)'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Lấy trung bình các p99 của nhiều máy <b class="red">(sai toán)</b>

      <br><span class="note">Máy A: 100 yêu cầu (98 cái 10 ms, 2 cái 1000 ms) → p99 = 1000 ms. Máy B: 900 yêu cầu, đều 10
      ms → p99 = 10 ms. Trung bình hai p99 là 505 ms — nhưng gộp 1000 yêu cầu, chỉ 2 cái chậm, vị trí 990 là 10 ms: p99 thật
      là 10 ms. Phải gộp <b>dữ liệu gốc</b> (hoặc biểu đồ tần suất) rồi mới tính phân vị.</span></div>

      '
    say: Lỗi thứ nhất, lấy trung bình các phân vị 99 của nhiều máy. Máy A có 100 yêu cầu, 98 cái mất 10 mi li giây và 2 cái
      mất 1000, nên phân vị 99 là 1000. Máy B có 900 yêu cầu đều mất 10, nên phân vị 99 là 10.
  - show: ''
    say: Trung bình hai số là 505, nhưng gộp cả 1000 yêu cầu thì chỉ có 2 cái chậm, vị trí 990 vẫn là 10, nên phân vị 99 thật
      chỉ là 10. Phải gộp dữ liệu gốc hoặc biểu đồ tần suất rồi mới tính phân vị. Đưa số định danh người dùng động cực lớn
      làm nhãn cho chỉ số gây bùng nổ bộ nhớ làm sập cả máy thu thập.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Ghi nhật ký không có mã yêu cầu <b class="red">(không nối được)</b>

      <br><span class="note">Một yêu cầu đi qua 6 dịch vụ, mỗi nơi ghi một dòng rời: không biết dòng nào thuộc yêu cầu nào.
      Truyền một <b>mã truy vết</b> qua mọi chặng và ghi nó vào mọi dòng.</span></div>

      '
    say: Lỗi thứ hai, ghi nhật ký không có mã yêu cầu. Một yêu cầu đi qua 6 dịch vụ, mỗi nơi ghi một dòng rời, thì không biết
      dòng nào thuộc yêu cầu nào. Hãy truyền một mã truy vết qua mọi chặng và ghi nó vào mọi dòng. Ghi nhật ký dạng văn bản
      tự do thiếu cấu trúc gây bất khả thi khi lọc tìm nhanh theo mã giao dịch giữa hàng triệu dòng.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Gắn nhãn chỉ số bằng giá trị không giới hạn <b class="red">(bùng nổ chuỗi)</b>

      <br><span class="note">Mỗi giá trị nhãn khác nhau là một <b>chuỗi thời gian</b> riêng (một dãy số đo theo thời gian,
      lưu riêng). Nhãn “mã người dùng” trên một chỉ số tạo một chuỗi cho mỗi người: hàng triệu chuỗi, hệ thống chỉ số quá
      tải. Thông tin từng yêu cầu thuộc về nhật ký và vết truy vết.</span></div>

      '
    say: Lỗi thứ ba, gắn nhãn chỉ số bằng giá trị không giới hạn. Mỗi giá trị nhãn khác nhau là một chuỗi thời gian riêng,
      tức một dãy số đo theo thời gian được lưu riêng. Nhãn mã người dùng trên một chỉ số tạo một chuỗi thời gian cho mỗi
      người, hàng triệu chuỗi làm hệ thống chỉ số quá tải. Thông tin từng yêu cầu thuộc về nhật ký và vết truy vết. Tính giá
      trị trung bình của chỉ số phân vị từ từng máy riêng rẽ làm sai lệch toán học nghiêm trọng các ngưỡng đỉnh.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Cảnh báo theo p99 từng phút của một dịch vụ ít yêu cầu <b
      class="red">(báo động giả)</b></div>

      <table class="t"><tr><th>số yêu cầu trong một phút</th><th>vị trí của p99</th><th>p99 thật ra là</th></tr>

      <tr><td>50</td><td>làm tròn lên 49,5 = 50</td><td>yêu cầu <b>chậm nhất</b>: một yêu cầu lạ là đủ báo động</td></tr>

      <tr><td>100</td><td>99</td><td>yêu cầu chậm thứ hai</td></tr>

      <tr><td>1000</td><td>990</td><td>còn 10 yêu cầu chậm hơn nó</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.2'
    - '2.3'
    - '2.4'
    - 0
    - 0
    say: Lỗi thứ tư hay gặp ở người đã đi làm, đặt cảnh báo theo phân vị 99 của từng phút cho một dịch vụ ít yêu cầu. Phút
      nào chỉ có 50 yêu cầu thì vị trí của phân vị 99 là làm tròn lên 49 phẩy 5, tức 50, nghĩa là chính yêu cầu chậm nhất.
      Chỉ một yêu cầu lạ là đủ đánh thức người trực đêm. Với 100 yêu cầu thì đó là yêu cầu chậm thứ hai. Với 1000 yêu cầu
      thì vẫn còn 10 yêu cầu chậm hơn nó, nên con số ổn định hơn nhiều. Người làm nghề chỉ tin phân vị 99 khi cửa sổ đo có
      đủ nhiều yêu cầu, hoặc gộp cửa sổ dài hơn. Không chọn lọc mẫu tỉ lệ vết truy vết lúc tải lớn khiến đường ống giám sát
      ngốn nhiều tài nguyên hơn cả ứng dụng chính.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
