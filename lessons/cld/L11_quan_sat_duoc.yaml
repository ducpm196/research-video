scenes:
- id: hook
  kind: hook
  title: Trung bình 52 ms, khách vẫn kêu chậm
  checks:
  - sum([20] * 95 + [30, 40, 500, 800, 2000]) / 100 == 52.7
  steps:
  - show: '<p>Bảng theo dõi ghi “độ trễ trung bình $\hl{52{,}7}$ ms” — rất đẹp. Nhưng cứ 100 khách thì vài người phải chờ
      gần một giây hoặc hơn, và họ là những người gửi phản hồi.</p>

      <div class="box key">Hôm nay: <b>quan sát được</b> — ba loại tín hiệu, và vì sao đo <b>phân vị cao</b> thay vì trung
      bình.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, bảng theo dõi ghi độ trễ trung bình 52 phẩy 7 mi li giây, rất đẹp. Nhưng cứ 100 khách thì vài người phải
      chờ gần một giây hoặc hơn, và chính họ là những người gửi phản hồi. Hôm nay ta học về khả năng quan sát được, ba loại
      tín hiệu, và vì sao đo phân vị cao thay vì trung bình. Không đo được những gì bên trong hệ thống đang làm khiến đội
      ngũ mù mờ phỏng đoán suốt bốn tiếng khi xảy ra sự cố. Kết hợp nhịp nhàng nhật ký có cấu trúc, chỉ số tổng hợp và vết
      truy vết phân tán biến hộp đen thành bảng điều khiển trong suốt.
- id: prereq
  kind: prereq
  title: 'Ôn lại: sắp xếp và đếm vị trí, xác suất của sự kiện độc lập'
  checks:
  - '(lambda x: (sum(x) / 10, sorted(x)[math.ceil(0.5 * 10) - 1], sorted(x)[math.ceil(0.9 * 10) - 1], sum(v < 22.8 for v in
    x)))([12, 15, 11, 30, 14, 13, 16, 90, 12, 15]) == (22.8, 14, 30, 8)'
  - round(0.99 * 0.99, 4) == 0.9801 and round(1 - 0.9801, 4) == 0.0199 and round(0.99 ** 3, 4) == 0.9703 and round(1 - 0.99
    ** 3, 4) == 0.0297
  steps:
  - show: '<table class="t"><tr><th>vị trí</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>

      <tr><td>độ trễ (ms), đã sắp tăng</td><td>11</td><td>12</td><td>12</td><td>13</td><td>$\hl{14}$</td><td>15</td><td>15</td><td>16</td><td>$\hl{30}$</td><td>90</td></tr></table>

      <p>Phân vị $p$ của $n$ giá trị: lấy giá trị ở vị trí <b>làm tròn lên</b> của $p$ nhân $n$. Phân vị 50: vị trí 5 → 14
      ms. Phân vị 90: vị trí 9 → 30 ms. Trung bình $\frac{228}{10} = 22{,}8$ ms, lớn hơn 8 trong 10 giá trị.</p>

      '
    focus:
    - 1
    - 2
    - '1.2'
    - '1.2'
    - 2
    - 2
    say: Trước hết, ta cần hiểu trung bình và phân vị. Trung bình là tổng chia cho số giá trị, còn phân vị p của n giá trị
      là giá trị ở vị trí làm tròn lên của p nhân n, sau khi đã sắp tăng dần. Với 10 độ trễ này, phân vị 50 ở vị trí 5, bằng
      14 mi li giây. Phân vị 90 ở vị trí 9, bằng 30 mi li giây. Còn trung bình là 228 chia 10, bằng 22 phẩy 8, lớn hơn 8 trong
      10 giá trị, vì một số 90 đã kéo nó lên. Nhật ký ghi sự kiện rời rạc chi tiết phục vụ điều tra ngữ cảnh chính xác nhưng
      tốn dung lượng lưu trữ khi bùng lỗi.
  - show: '<table class="t"><tr><th>số máy, mỗi máy chậm 1% lần, độc lập</th><th>không máy nào chậm</th><th>ít nhất một máy
      chậm</th></tr>

      <tr><td>1</td><td>0,99</td><td>0,01</td></tr>

      <tr><td>2</td><td>$0{,}99 \cdot 0{,}99 = 0{,}9801$</td><td>$1 - 0{,}9801 = 0{,}0199$</td></tr>

      <tr><td>3</td><td>$0{,}99^3 \approx 0{,}9703$</td><td>$\approx 0{,}0297$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Điều thứ hai, với các sự kiện độc lập, xác suất cùng xảy ra bằng tích các xác suất. Một máy thì xác suất không chậm
      là 0 phẩy 99. Hai máy thì xác suất cả hai không chậm là 0 phẩy 99 nhân 0 phẩy 99, bằng 0 phẩy 9801. Vậy xác suất có
      ít nhất một máy chậm là 1 trừ đi số đó, bằng 0 phẩy 0199. Ba máy thì nhân ba lần, xác suất có máy chậm tăng lên khoảng
      0 phẩy 0297. Chỉ số đo đếm gọn nhẹ theo thời gian lý tưởng cho vẽ đồ thị xu hướng và phát cảnh báo tự động theo phân
      vị.
- id: sym
  kind: symbol
  title: 'Giải mã: ba tín hiệu, phân vị'
  steps:
  - show: '<table class="t"><tr><th>tín hiệu</th><th>là gì</th><th>trả lời câu hỏi</th></tr>

      <tr><td><b>nhật ký</b></td><td>dòng sự kiện có thời điểm</td><td>chuyện gì đã xảy ra với yêu cầu này?</td></tr>

      <tr><td><b>chỉ số</b></td><td>con số gộp theo thời gian (đếm, tỉ lệ lỗi, độ trễ)</td><td>hệ thống đang khoẻ không?</td></tr>

      <tr><td><b>vết truy vết</b></td><td>đường đi của một yêu cầu qua các dịch vụ, có thời gian từng chặng</td><td>chậm ở
      chặng nào?</td></tr></table>

      <p><b>Phân vị 99</b> (p99): sắp các độ trễ tăng dần, lấy giá trị mà 99% yêu cầu không vượt quá.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    say: Bảng giới thiệu ba loại tín hiệu. Nhật ký là các dòng sự kiện có thời điểm, trả lời câu hỏi chuyện gì đã xảy ra với
      yêu cầu này. Chỉ số là con số gộp theo thời gian như số đếm, tỉ lệ lỗi, độ trễ, trả lời câu hỏi hệ thống có đang khoẻ
      không. Vết truy vết là đường đi của một yêu cầu qua các dịch vụ, có thời gian từng chặng, trả lời câu hỏi chậm ở chặng
      nào. Phân vị 99 là giá trị mà 99 phần trăm yêu cầu không vượt quá. Vết truy vết chắp nối mọi chặng thời gian xuyên suốt
      hàng loạt bộ chứa thành biểu đồ thanh ngang rõ ràng.
