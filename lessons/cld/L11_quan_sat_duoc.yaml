    - '1.3'
    - '1.4'
    - '1.5'
    say: Kiểm bằng đường khác, vì một con số tính hai cách mà khớp thì đáng tin hơn. Lấy 20 làm gốc rồi cộng phần vượt của
      năm yêu cầu còn lại, 3270 chia 100 bằng 32 phẩy 7, nên trung bình là 52 phẩy 7. Đếm từ trên xuống, 1 phần trăm của 100
      là 1 yêu cầu được phép vượt, bỏ số 2000 thì giá trị lớn nhất còn lại là 800. Vì 0 phẩy 99 mũ 100 xấp xỉ 1 chia cho số
      e, khoảng 0 phẩy 368, nên xác suất chậm khoảng 0 phẩy 632, rất sát 0 phẩy 634. Cuối cùng, máy thử 20 nghìn yêu cầu,
      mỗi yêu cầu tung ngẫu nhiên 100 máy, đếm được tỉ lệ chậm khoảng 0 phẩy 633.
