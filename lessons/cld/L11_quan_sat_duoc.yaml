- id: example
  kind: example
  title: Trung bình che đuôi; đuôi nhân lên khi gọi nhiều máy
  checks:
  - '(lambda x: (sorted(x)[49], sorted(x)[98], sum(x) / len(x)))([20] * 95 + [30, 40, 500, 800, 2000]) == (20, 800, 52.7)'
  - round(alg.fanout_slow(0.01, 100), 3) == 0.634 and round(1 - 0.99 ** 100, 3) == 0.634
  steps:
  - show: '<table class="t"><tr><th>độ trễ (ms)</th><th>20</th><th>30</th><th>40</th><th>500</th><th>800</th><th>2000</th></tr>

      <tr><td>số yêu cầu</td><td>95</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>

      $$\text{trung bình} = \frac{95 \cdot 20 + 30 + 40 + 500 + 800 + 2000}{100} = \frac{5270}{100} = 52{,}7$$

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Bước một, xét 100 yêu cầu, 95 cái mất 20 mi li giây, còn lại là 30, 40, 500, 800 và 2000. Trung bình bằng tổng chia
      cho 100. Tổng là 95 nhân 20, bằng 1900, cộng thêm 3370 của năm yêu cầu còn lại, được 5270. Chia cho 100, trung bình
      là 52 phẩy 7 mi li giây.
  - show: '<table class="t"><tr><th>vị trí sau khi sắp tăng</th><th>1 tới 95</th><th>96</th><th>97</th><th>98</th><th>99</th><th>100</th></tr>

      <tr><td>độ trễ (ms)</td><td>20</td><td>30</td><td>40</td><td>500</td><td>$\hl{800}$</td><td>2000</td></tr></table>

      <p><b>Bước 2</b> — phân vị 50: vị trí $0{,}5 \cdot 100 = 50$ → 20 ms. Phân vị 99: vị trí $0{,}99 \cdot 100 = 99$ → $\hl{800}$
      ms.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước hai, sắp tăng dần rồi đếm vị trí. Phân vị 50, hay trung vị, nằm ở vị trí 50, rơi vào nhóm 95 giá trị 20, nên
      bằng 20 mi li giây. Phân vị 99 nằm ở vị trí 99, đó là giá trị 800 mi li giây.
  - clear: true
    show: '<table class="t"><tr><th>đại lượng</th><th>giá trị</th><th>số yêu cầu chờ đúng chừng ấy</th></tr>

      <tr><td>trung bình</td><td>52,7 ms</td><td>0</td></tr>

      <tr><td>phân vị 50</td><td>20 ms</td><td>95</td></tr>

      <tr><td>phân vị 99</td><td>800 ms</td><td>1, và 1 yêu cầu còn chờ lâu hơn</td></tr></table>

      <p><b>Bước 3</b> — trung bình bị vài giá trị lớn kéo lên, nhưng vẫn giấu mất 800 ms.</p>

