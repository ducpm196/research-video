id: L11
course: CLD
series: "CLD · Hệ thống hướng dịch vụ"
title: "Bài 11 — Quan sát được: nhật ký, chỉ số, vết truy vết, phân vị"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cld.yaml L11; audit/cld/verify_cld.py L11; J. Dean, L. A. Barroso, The Tail at Scale, CACM 56(2), 2013; B. H. Sigelman và cộng sự, Dapper, a Large-Scale Distributed Systems Tracing Infrastructure, Google Technical Report (2010); Google SRE Book (2016), chương 6"
assumes: [arith, cdot, approx, power]
# Quy ước: phân vị p theo cách “hạng gần nhất”: sắp tăng dần, lấy phần tử thứ ⌈p·n⌉ (đếm từ 1). p99 = phân vị 99%, lời đọc “phân vị 99”.
#   Gọi song song k máy, chờ tất cả, mỗi máy chậm độc lập với xác suất p: P(chậm) = 1 − (1 − p)^k (alg.fanout_slow).
objectives:
  - "Phân biệt ba loại tín hiệu: nhật ký, chỉ số, vết truy vết"
  - "Giải thích vì sao đo phân vị cao thay vì trung bình"
  - "Hiểu độ trễ đuôi khi gọi song song nhiều máy"
asr_reviewed:
  - {sentence: "Chào bạn, bảng theo dõi ghi độ trễ trung bình 52 phẩy 7 mi li giây, rất đẹp.", reason: "ASR chép “Chào bạn! Bản theo dõi di độ trễ trung bình 52,7mL rất đẹp.” (0.789): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: bảng/bản, ghi/di — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Trung bình 52 ms, khách vẫn kêu chậm"
    checks:
      - "sum([20] * 95 + [30, 40, 500, 800, 2000]) / 100 == 52.7"
    steps:
      - show: |
          <p>Bảng theo dõi ghi “độ trễ trung bình $\hl{52{,}7}$ ms” — rất đẹp. Nhưng cứ 100 khách thì vài người phải chờ gần một giây hoặc hơn, và họ là những người gửi phản hồi.</p>
          <div class="box key">Hôm nay: <b>quan sát được</b> — ba loại tín hiệu, và vì sao đo <b>phân vị cao</b> thay vì trung bình.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, bảng theo dõi ghi độ trễ trung bình 52 phẩy 7 mi li giây, rất đẹp. Nhưng cứ 100 khách thì vài người phải chờ gần một giây hoặc hơn, và chính họ là những người gửi phản hồi. Hôm nay ta học về khả năng quan sát được, ba loại tín hiệu, và vì sao đo phân vị cao thay vì trung bình."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: sắp xếp và đếm vị trí, xác suất của sự kiện độc lập"
    checks:
      - "(lambda x: (sum(x) / 10, sorted(x)[math.ceil(0.5 * 10) - 1], sorted(x)[math.ceil(0.9 * 10) - 1], sum(v < 22.8 for v in x)))([12, 15, 11, 30, 14, 13, 16, 90, 12, 15]) == (22.8, 14, 30, 8)"
      - "round(0.99 * 0.99, 4) == 0.9801 and round(1 - 0.9801, 4) == 0.0199 and round(0.99 ** 3, 4) == 0.9703 and round(1 - 0.99 ** 3, 4) == 0.0297"
    steps:
      - show: |
          <table class="t"><tr><th>vị trí</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>
          <tr><td>độ trễ (ms), đã sắp tăng</td><td>11</td><td>12</td><td>12</td><td>13</td><td>$\hl{14}$</td><td>15</td><td>15</td><td>16</td><td>$\hl{30}$</td><td>90</td></tr></table>
          <p>Phân vị $p$ của $n$ giá trị: lấy giá trị ở vị trí <b>làm tròn lên</b> của $p$ nhân $n$. Phân vị 50: vị trí 5 → 14 ms. Phân vị 90: vị trí 9 → 30 ms. Trung bình $\frac{228}{10} = 22{,}8$ ms, lớn hơn 8 trong 10 giá trị.</p>
        focus: [1, 2, "1.2", "1.2", 2]
        say: "Trước hết, ta cần hiểu trung bình và phân vị. Trung bình là tổng chia cho số giá trị, còn phân vị p của n giá trị là giá trị ở vị trí làm tròn lên của p nhân n, sau khi đã sắp tăng dần. Với 10 độ trễ này, phân vị 50 ở vị trí 5, bằng 14 mi li giây. Phân vị 90 ở vị trí 9, bằng 30 mi li giây. Còn trung bình là 228 chia 10, bằng 22 phẩy 8, lớn hơn 8 trong 10 giá trị, vì một số 90 đã kéo nó lên."
      - show: |
          <table class="t"><tr><th>số máy, mỗi máy chậm 1% lần, độc lập</th><th>không máy nào chậm</th><th>ít nhất một máy chậm</th></tr>
          <tr><td>1</td><td>0,99</td><td>0,01</td></tr>
          <tr><td>2</td><td>$0{,}99 \cdot 0{,}99 = 0{,}9801$</td><td>$1 - 0{,}9801 = 0{,}0199$</td></tr>
          <tr><td>3</td><td>$0{,}99^3 \approx 0{,}9703$</td><td>$\approx 0{,}0297$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Điều thứ hai, với các sự kiện độc lập, xác suất cùng xảy ra bằng tích các xác suất. Một máy thì xác suất không chậm là 0 phẩy 99. Hai máy thì xác suất cả hai không chậm là 0 phẩy 99 nhân 0 phẩy 99, bằng 0 phẩy 9801. Vậy xác suất có ít nhất một máy chậm là 1 trừ đi số đó, bằng 0 phẩy 0199. Ba máy thì nhân ba lần, xác suất có máy chậm tăng lên khoảng 0 phẩy 0297."

  - id: sym
    kind: symbol
    title: "Giải mã: ba tín hiệu, phân vị"
    steps:
      - show: |
          <table class="t"><tr><th>tín hiệu</th><th>là gì</th><th>trả lời câu hỏi</th></tr>
          <tr><td><b>nhật ký</b></td><td>dòng sự kiện có thời điểm</td><td>chuyện gì đã xảy ra với yêu cầu này?</td></tr>
          <tr><td><b>chỉ số</b></td><td>con số gộp theo thời gian (đếm, tỉ lệ lỗi, độ trễ)</td><td>hệ thống đang khoẻ không?</td></tr>
          <tr><td><b>vết truy vết</b></td><td>đường đi của một yêu cầu qua các dịch vụ, có thời gian từng chặng</td><td>chậm ở chặng nào?</td></tr></table>
          <p><b>Phân vị 99</b> (p99): sắp các độ trễ tăng dần, lấy giá trị mà 99% yêu cầu không vượt quá.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng giới thiệu ba loại tín hiệu. Nhật ký là các dòng sự kiện có thời điểm, trả lời câu hỏi chuyện gì đã xảy ra với yêu cầu này. Chỉ số là con số gộp theo thời gian như số đếm, tỉ lệ lỗi, độ trễ, trả lời câu hỏi hệ thống có đang khoẻ không. Vết truy vết là đường đi của một yêu cầu qua các dịch vụ, có thời gian từng chặng, trả lời câu hỏi chậm ở chặng nào. Phân vị 99 là giá trị mà 99 phần trăm yêu cầu không vượt quá."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Chờ tất cả thì chờ máy chậm nhất"
    checks:
      - "sorted([20] * 95 + [30, 40, 500, 800, 2000])[98] == 800 and 0.01 * 100 == 1"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><g fill="#1f2937"><rect x="40" y="150" width="180" height="80" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="130" y="198" text-anchor="middle" font-size="24">1 yêu cầu</text><line x1="220" y1="190" x2="330" y2="50" stroke="#6b7280" stroke-width="2"/><text x="340" y="58" font-size="22">máy 1</text><rect x="440" y="38" width="18" height="24" rx="4" fill="#2a78d6"/><line x1="220" y1="190" x2="330" y2="95" stroke="#6b7280" stroke-width="2"/><text x="340" y="103" font-size="22">máy 2</text><rect x="440" y="83" width="18" height="24" rx="4" fill="#2a78d6"/><line x1="220" y1="190" x2="330" y2="140" stroke="#6b7280" stroke-width="2"/><text x="340" y="148" font-size="22">máy 3</text><rect x="440" y="128" width="720" height="24" rx="4" fill="#b91c1c"/><line x1="220" y1="190" x2="330" y2="185" stroke="#6b7280" stroke-width="2"/><text x="340" y="193" font-size="22">máy 4</text><rect x="440" y="173" width="18" height="24" rx="4" fill="#2a78d6"/><line x1="220" y1="190" x2="330" y2="230" stroke="#6b7280" stroke-width="2"/><text x="340" y="238" font-size="22">máy 5</text><rect x="440" y="218" width="18" height="24" rx="4" fill="#2a78d6"/><line x1="220" y1="190" x2="330" y2="320" stroke="#6b7280" stroke-width="2"/><text x="340" y="328" font-size="22">máy 100</text><rect x="440" y="308" width="18" height="24" rx="4" fill="#2a78d6"/><text x="380" y="283" font-size="26">…</text><text x="470" y="58" font-size="20" fill="#2a78d6">20 ms</text><text x="800" y="122" text-anchor="middle" font-size="22" fill="#b91c1c">máy 3 rơi vào 1% lần chậm: 800 ms</text><line x1="1160" y1="30" x2="1160" y2="340" stroke="#eb6834" stroke-width="3" stroke-dasharray="8 6"/><rect x="1220" y="150" width="250" height="80" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="1345" y="185" text-anchor="middle" font-size="22">trả lời sau</text><text x="1345" y="215" text-anchor="middle" font-size="22">800 ms</text><text x="750" y="385" text-anchor="middle" font-size="24" font-weight="bold">yêu cầu chỉ xong khi máy chậm nhất xong</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ một yêu cầu gọi song song tới 100 máy và phải chờ tất cả trả lời. Hầu hết các máy trả lời trong 20 mi li giây, thanh xanh rất ngắn. Nhưng máy 3 lần này rơi vào 1 phần trăm số lần chậm, mất 800 mi li giây. Vì yêu cầu chỉ xong khi máy chậm nhất xong, người dùng chờ 800 mi li giây, dù 99 máy kia đều nhanh."

  - id: example
    kind: example
    title: "Trung bình che đuôi; đuôi nhân lên khi gọi nhiều máy"
    checks:
      - "(lambda x: (sorted(x)[49], sorted(x)[98], sum(x) / len(x)))([20] * 95 + [30, 40, 500, 800, 2000]) == (20, 800, 52.7)"
      - "round(alg.fanout_slow(0.01, 100), 3) == 0.634 and round(1 - 0.99 ** 100, 3) == 0.634"
    steps:
      - show: |
          <table class="t"><tr><th>độ trễ (ms)</th><th>20</th><th>30</th><th>40</th><th>500</th><th>800</th><th>2000</th></tr>
          <tr><td>số yêu cầu</td><td>95</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>
          $$\text{trung bình} = \frac{95 \cdot 20 + 30 + 40 + 500 + 800 + 2000}{100} = \frac{5270}{100} = 52{,}7$$
        focus: [1, 2, 2, 2]
        say: "Bước một, xét 100 yêu cầu, 95 cái mất 20 mi li giây, còn lại là 30, 40, 500, 800 và 2000. Trung bình bằng tổng chia cho 100. Tổng là 95 nhân 20, bằng 1900, cộng thêm 3370 của năm yêu cầu còn lại, được 5270. Chia cho 100, trung bình là 52 phẩy 7 mi li giây."
      - show: |
          <table class="t"><tr><th>vị trí sau khi sắp tăng</th><th>1 tới 95</th><th>96</th><th>97</th><th>98</th><th>99</th><th>100</th></tr>
          <tr><td>độ trễ (ms)</td><td>20</td><td>30</td><td>40</td><td>500</td><td>$\hl{800}$</td><td>2000</td></tr></table>
          <p><b>Bước 2</b> — phân vị 50: vị trí $0{,}5 \cdot 100 = 50$ → 20 ms. Phân vị 99: vị trí $0{,}99 \cdot 100 = 99$ → $\hl{800}$ ms.</p>
        focus: [1, 2, 2]
        say: "Bước hai, sắp tăng dần rồi đếm vị trí. Phân vị 50, hay trung vị, nằm ở vị trí 50, rơi vào nhóm 95 giá trị 20, nên bằng 20 mi li giây. Phân vị 99 nằm ở vị trí 99, đó là giá trị 800 mi li giây."
      - clear: true
        show: |
          <table class="t"><tr><th>đại lượng</th><th>giá trị</th><th>số yêu cầu chờ đúng chừng ấy</th></tr>
          <tr><td>trung bình</td><td>52,7 ms</td><td>0</td></tr>
          <tr><td>phân vị 50</td><td>20 ms</td><td>95</td></tr>
          <tr><td>phân vị 99</td><td>800 ms</td><td>1, và 1 yêu cầu còn chờ lâu hơn</td></tr></table>
          <p><b>Bước 3</b> — trung bình bị vài giá trị lớn kéo lên, nhưng vẫn giấu mất 800 ms.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước ba, so ba con số với dữ liệu thật. Không yêu cầu nào mất đúng 52 phẩy 7 mi li giây. Phân vị 50 là 20, đúng với 95 yêu cầu. Phân vị 99 là 800, và còn một yêu cầu chờ tới 2000. Không ai thật sự chờ 52 phẩy 7, trung bình bị vài giá trị lớn kéo lên mà vẫn giấu mất con số 800."
      - clear: true
        show: |
          <p><b>Bước 4</b> — một yêu cầu gọi <b>song song</b> 100 máy và chờ tất cả. Mỗi máy chậm ở 1% lần (đúng bằng đuôi p99 của nó), độc lập:</p>
          $$P(\text{chậm}) = 1 - 0{,}99^{100} \approx 1 - 0{,}366 = \hl{0{,}634}$$
          <div class="box key">Chuyện “1 trên 100” của từng máy thành chuyện <b>hơn một nửa</b> số yêu cầu. Ở quy mô lớn, đuôi của từng phần thành thân của toàn hệ.</div>
        introduces: [prob]
        focus: [1, 1, 2, 3, 3]
        say: "Bước bốn, bây giờ một yêu cầu gọi song song 100 máy và chờ tất cả. Mỗi máy chậm ở 1 phần trăm số lần, đúng bằng đuôi phân vị 99 của nó, và độc lập với nhau. Xác suất không máy nào chậm là 0 phẩy 99 mũ 100, khoảng 0 phẩy 366, nên xác suất yêu cầu bị chậm khoảng 0 phẩy 634. Chuyện 1 trên 100 của từng máy thành chuyện hơn một nửa số yêu cầu. Ở quy mô lớn, đuôi của từng phần thành thân của toàn hệ."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "20 + (10 + 20 + 480 + 780 + 1980) / 100 == 52.7 and sorted([20] * 95 + [30, 40, 500, 800, 2000])[-2] == 800"
      - "round(math.exp(-1), 3) == 0.368 and round(1 - math.exp(-1), 3) == 0.632 and abs(0.99 ** 100 - math.exp(-1)) < 0.002"
      - "(lambda R, n: round(sum(any(R.random() < 0.01 for _ in range(100)) for _ in range(n)) / n, 3))(__import__('random').Random(1), 20000) == 0.633"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>trung bình</td><td>lấy 20 làm gốc, cộng phần vượt: $20 + \frac{10 + 20 + 480 + 780 + 1980}{100}$</td><td>52,7 ✓</td></tr>
          <tr><td>phân vị 99</td><td>đếm từ trên xuống: 1% của 100 là 1 yêu cầu được vượt, bỏ 2000</td><td>800 ✓</td></tr>
          <tr><td>gọi 100 máy</td><td>$0{,}99^{100} \approx \frac{1}{e} \approx 0{,}368$</td><td>$1 - 0{,}368 \approx 0{,}632$, sát 0,634 ✓</td></tr>
          <tr><td>gọi 100 máy</td><td>máy thử 20 000 yêu cầu, mỗi yêu cầu tung 100 máy</td><td>tỉ lệ chậm ≈ 0,633 ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Kiểm bằng đường khác, vì một con số tính hai cách mà khớp thì đáng tin hơn. Lấy 20 làm gốc rồi cộng phần vượt của năm yêu cầu còn lại, 3270 chia 100 bằng 32 phẩy 7, nên trung bình là 52 phẩy 7. Đếm từ trên xuống, 1 phần trăm của 100 là 1 yêu cầu được phép vượt, bỏ số 2000 thì giá trị lớn nhất còn lại là 800. Vì 0 phẩy 99 mũ 100 xấp xỉ 1 chia cho số e, khoảng 0 phẩy 368, nên xác suất chậm khoảng 0 phẩy 632, rất sát 0 phẩy 634. Cuối cùng, máy thử 20 nghìn yêu cầu, mỗi yêu cầu tung ngẫu nhiên 100 máy, đếm được tỉ lệ chậm khoảng 0 phẩy 633."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "math.ceil(0.99 * 50) == 50 and math.ceil(0.99 * 100) == 99 and math.ceil(0.99 * 1000) == 990 and 1000 - 990 == 10"
      - "(lambda pr: (pr([10] * 98 + [1000] * 2), pr([10] * 900), pr([10] * 98 + [1000] * 2 + [10] * 900)))(lambda x: sorted(x)[math.ceil(0.99 * len(x)) - 1]) == (1000, 10, 10)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Lấy trung bình các p99 của nhiều máy <b class="red">(sai toán)</b>
          <br><span class="note">Máy A: 100 yêu cầu (98 cái 10 ms, 2 cái 1000 ms) → p99 = 1000 ms. Máy B: 900 yêu cầu, đều 10 ms → p99 = 10 ms. Trung bình hai p99 là 505 ms — nhưng gộp 1000 yêu cầu, chỉ 2 cái chậm, vị trí 990 là 10 ms: p99 thật là 10 ms. Phải gộp <b>dữ liệu gốc</b> (hoặc biểu đồ tần suất) rồi mới tính phân vị.</span></div>
        say: "Lỗi thứ nhất, lấy trung bình các phân vị 99 của nhiều máy. Máy A có 100 yêu cầu, 98 cái mất 10 mi li giây và 2 cái mất 1000, nên phân vị 99 là 1000. Máy B có 900 yêu cầu đều mất 10, nên phân vị 99 là 10. Trung bình hai số là 505, nhưng gộp cả 1000 yêu cầu thì chỉ có 2 cái chậm, vị trí 990 vẫn là 10, nên phân vị 99 thật chỉ là 10. Phải gộp dữ liệu gốc hoặc biểu đồ tần suất rồi mới tính phân vị."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ghi nhật ký không có mã yêu cầu <b class="red">(không nối được)</b>
          <br><span class="note">Một yêu cầu đi qua 6 dịch vụ, mỗi nơi ghi một dòng rời: không biết dòng nào thuộc yêu cầu nào. Truyền một <b>mã truy vết</b> qua mọi chặng và ghi nó vào mọi dòng.</span></div>
        say: "Lỗi thứ hai, ghi nhật ký không có mã yêu cầu. Một yêu cầu đi qua 6 dịch vụ, mỗi nơi ghi một dòng rời, thì không biết dòng nào thuộc yêu cầu nào. Hãy truyền một mã truy vết qua mọi chặng và ghi nó vào mọi dòng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Gắn nhãn chỉ số bằng giá trị không giới hạn <b class="red">(bùng nổ chuỗi)</b>
          <br><span class="note">Mỗi giá trị nhãn khác nhau là một <b>chuỗi thời gian</b> riêng (một dãy số đo theo thời gian, lưu riêng). Nhãn “mã người dùng” trên một chỉ số tạo một chuỗi cho mỗi người: hàng triệu chuỗi, hệ thống chỉ số quá tải. Thông tin từng yêu cầu thuộc về nhật ký và vết truy vết.</span></div>
        say: "Lỗi thứ ba, gắn nhãn chỉ số bằng giá trị không giới hạn. Mỗi giá trị nhãn khác nhau là một chuỗi thời gian riêng, tức một dãy số đo theo thời gian được lưu riêng. Nhãn mã người dùng trên một chỉ số tạo một chuỗi thời gian cho mỗi người, hàng triệu chuỗi làm hệ thống chỉ số quá tải. Thông tin từng yêu cầu thuộc về nhật ký và vết truy vết."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Cảnh báo theo p99 từng phút của một dịch vụ ít yêu cầu <b class="red">(báo động giả)</b></div>
          <table class="t"><tr><th>số yêu cầu trong một phút</th><th>vị trí của p99</th><th>p99 thật ra là</th></tr>
          <tr><td>50</td><td>làm tròn lên 49,5 = 50</td><td>yêu cầu <b>chậm nhất</b>: một yêu cầu lạ là đủ báo động</td></tr>
          <tr><td>100</td><td>99</td><td>yêu cầu chậm thứ hai</td></tr>
          <tr><td>1000</td><td>990</td><td>còn 10 yêu cầu chậm hơn nó</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đặt cảnh báo theo phân vị 99 của từng phút cho một dịch vụ ít yêu cầu. Phút nào chỉ có 50 yêu cầu thì vị trí của phân vị 99 là làm tròn lên 49 phẩy 5, tức 50, nghĩa là chính yêu cầu chậm nhất. Chỉ một yêu cầu lạ là đủ đánh thức người trực đêm. Với 100 yêu cầu thì đó là yêu cầu chậm thứ hai. Với 1000 yêu cầu thì vẫn còn 10 yêu cầu chậm hơn nó, nên con số ổn định hơn nhiều. Người làm nghề chỉ tin phân vị 99 khi cửa sổ đo có đủ nhiều yêu cầu, hoặc gộp cửa sổ dài hơn."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.fanout_slow(0.01, 10), 3) == 0.096 and round(alg.fanout_slow(0.001, 100), 3) == 0.095"
      - "round(0.99 ** 10, 3) == 0.904 and round(0.999 ** 100, 3) == 0.905 and round(1 - 0.99 ** 100, 3) == 0.634"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Gọi song song 10 máy, mỗi máy chậm 1% lần: xác suất yêu cầu bị chậm?</td></tr>
          <tr><td>2</td><td>Vẫn 100 máy nhưng mỗi máy chỉ chậm 0,1% lần (tức đuôi p99,9): xác suất bị chậm?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, gọi song song 10 máy, mỗi máy chậm 1 phần trăm số lần, xác suất yêu cầu bị chậm là bao nhiêu? Câu hai, vẫn 100 máy nhưng mỗi máy chỉ chậm 0 phẩy 1 phần trăm số lần, xác suất bị chậm là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Không máy nào chậm: $0{,}99^{10} \approx 0{,}904$.</p>
          $$1 - 0{,}99^{10} \approx 1 - 0{,}904 = \hl{0{,}096}$$
        focus: [1, 2, 2]
        say: "Đáp án câu một, trước hết tính xác suất không máy nào chậm, bằng 0 phẩy 99 mũ 10, khoảng 0 phẩy 904. Lấy phần bù, 1 trừ 0 phẩy 99 mũ 10, khoảng 0 phẩy 096. Vậy gần 1 trong 10 yêu cầu bị chậm."
      - show: |
          <table class="t"><tr><th>100 máy, mỗi máy chậm</th><th>không máy nào chậm</th><th>yêu cầu bị chậm</th></tr>
          <tr><td>1% lần</td><td>$0{,}99^{100} \approx 0{,}366$</td><td>$\approx 0{,}634$</td></tr>
          <tr><td>0,1% lần</td><td>$0{,}999^{100} \approx 0{,}905$</td><td>$\approx \hl{0{,}095}$</td></tr></table>
        focus: [1, "1.3", 1, 1]
        say: "Câu hai, làm tương tự, xác suất không máy nào chậm là 0 phẩy 999 mũ 100, khoảng 0 phẩy 905. Lấy phần bù, 1 trừ 0 phẩy 999 mũ 100, khoảng 0 phẩy 095, nên muốn hệ lớn chạy nhanh, từng máy phải lo tới phân vị rất cao. Đặt cạnh ví dụ, hạ đuôi của từng máy từ 1 phần trăm xuống 0 phẩy 1 phần trăm làm số yêu cầu chậm giảm từ khoảng 63 phần trăm xuống dưới 10 phần trăm. Đó là quyết định đáng làm trước khi thêm máy."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">nhật ký, chỉ số, vết truy vết</span><span class="a">→</span>
          <span class="n">đo phân vị cao, không chỉ trung bình</span><span class="a">→</span>
          <span class="n">gộp dữ liệu gốc rồi mới tính phân vị</span><span class="a">→</span>
          <span class="n">gọi song song nhiều máy: đuôi nhân lên</span></div>
        say: "Tổng kết lại, ba loại tín hiệu là nhật ký, chỉ số và vết truy vết. Hãy đo phân vị cao chứ không chỉ trung bình, gộp dữ liệu gốc rồi mới tính phân vị, và nhớ rằng gọi song song nhiều máy làm đuôi nhân lên."
      - show: |
          <div class="box key"><b>Tư duy:</b> người dùng không trải nghiệm “trung bình”; họ trải nghiệm từng yêu cầu của chính họ.</div>
        say: "Điều cần mang theo, người dùng không trải nghiệm trung bình, họ trải nghiệm từng yêu cầu của chính họ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>mục tiêu mức dịch vụ</b> và <b>ngân sách lỗi</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học mục tiêu mức dịch vụ và ngân sách lỗi. Hẹn gặp bạn ở bài tiếp theo."
