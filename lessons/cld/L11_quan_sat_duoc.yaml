  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Gọi song song 10 máy, mỗi máy chậm 1% lần: xác suất yêu cầu bị chậm?</td></tr>

      <tr><td>2</td><td>Vẫn 100 máy nhưng mỗi máy chỉ chậm 0,1% lần (tức đuôi p99,9): xác suất bị chậm?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, gọi song song 10 máy, mỗi máy chậm 1 phần trăm số lần, xác suất yêu cầu bị
      chậm là bao nhiêu? Câu hai, vẫn 100 máy nhưng mỗi máy chỉ chậm 0 phẩy 1 phần trăm số lần, xác suất bị chậm là bao nhiêu?
      Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① Không máy nào chậm: $0{,}99^{10} \approx 0{,}904$.</p>

      $$1 - 0{,}99^{10} \approx 1 - 0{,}904 = \hl{0{,}096}$$

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Đáp án câu một, trước hết tính xác suất không máy nào chậm, bằng 0 phẩy 99 mũ 10, khoảng 0 phẩy 904. Lấy phần bù,
      1 trừ 0 phẩy 99 mũ 10, khoảng 0 phẩy 096. Vậy gần 1 trong 10 yêu cầu bị chậm. Phân bổ đúng công cụ giám sát cho từng
      loại câu hỏi từ cảnh báo ngưỡng chậm tới tìm đúng hàm làm chậm yêu cầu cụ thể.
  - show: '<table class="t"><tr><th>100 máy, mỗi máy chậm</th><th>không máy nào chậm</th><th>yêu cầu bị chậm</th></tr>

      <tr><td>1% lần</td><td>$0{,}99^{100} \approx 0{,}366$</td><td>$\approx 0{,}634$</td></tr>

      <tr><td>0,1% lần</td><td>$0{,}999^{100} \approx 0{,}905$</td><td>$\approx \hl{0{,}095}$</td></tr></table>

      '
    focus:
    - 1
    - '1.3'
    - 1
    - 1
    say: Câu hai, làm tương tự, xác suất không máy nào chậm là 0 phẩy 999 mũ 100, khoảng 0 phẩy 905. Lấy phần bù, 1 trừ 0
      phẩy 999 mũ 100, khoảng 0 phẩy 095, nên muốn hệ lớn chạy nhanh, từng máy phải lo tới phân vị rất cao. Đặt cạnh ví dụ,
      hạ đuôi của từng máy từ 1 phần trăm xuống 0 phẩy 1 phần trăm làm số yêu cầu chậm giảm từ khoảng 63 phần trăm xuống dưới
      10 phần trăm. Đó là quyết định đáng làm trước khi thêm máy.
