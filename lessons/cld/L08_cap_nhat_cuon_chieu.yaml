id: L08
course: CLD
series: "CLD · Hệ thống hướng dịch vụ"
title: "Bài 8 — Cập nhật cuốn chiếu, xanh–lam và canary"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cld.yaml L08; audit/cld/verify_cld.py L08; Kubernetes Docs, Deployments — Rolling Update Deployment: maxUnavailable (làm tròn xuống), maxSurge (làm tròn lên), mặc định 25% (kubernetes.io, đọc 2026-10-28); J. Humble, D. Farley, Continuous Delivery (2010), chương 10"
assumes: [arith, cdot]
# Quy ước: n bản; u = ⌊n · maxUnavailable⌋ (số bản được phép thiếu), s = ⌈n · maxSurge⌉ (số bản được phép dư). Trong suốt quá trình: số bản sẵn sàng
#   ≥ n − u, tổng số Pod ≤ n + s. alg.rolling_update mô phỏng từng bước và trả (u, s, min sẵn sàng, max tổng, số bước). “canary” chỉ trên màn hình;
#   lời đọc nói “phát hành thử”.
objectives:
  - "Tính số Pod tối thiểu sẵn sàng khi cập nhật cuốn chiếu"
  - "So sánh cuốn chiếu, xanh–lam và phát hành thử"
  - "Giữ tương thích khi bản cũ và mới chạy cùng lúc"
