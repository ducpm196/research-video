<rect x="320" y="278" width="40" height="40" rx="5" fill="#eb6834"/><rect x="370" y="278" width="40" height="40" rx="5" fill="#eb6834"/><rect x="420" y="278" width="40" height="40" rx="5" fill="#eb6834"/><rect x="470" y="278" width="40" height="40" rx="5" fill="#eb6834"/><rect x="520" y="278" width="40" height="40" rx="5" fill="#eb6834"/><rect x="570" y="278" width="40" height="40" rx="5" fill="#eb6834"/><rect x="622" y="280" width="36" height="36" rx="5" fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="6 4"/><rect x="672" y="280" width="36" height="36" rx="5" fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="6 4"/><text x="920" y="308" font-size="24">sẵn sàng 8, tổng 10</text><text x="40" y="360" font-size="24">xong</text><rect x="220" y="330" width="40" height="40" rx="5" fill="#eb6834"/><rect x="270" y="330" width="40" height="40" rx="5" fill="#eb6834"/><rect x="320" y="330" width="40" height="40" rx="5" fill="#eb6834"/><rect x="370" y="330" width="40" height="40" rx="5" fill="#eb6834"/><rect x="420" y="330" width="40" height="40" rx="5" fill="#eb6834"/><rect x="470" y="330" width="40" height="40" rx="5" fill="#eb6834"/><rect x="520" y="330" width="40" height="40" rx="5" fill="#eb6834"/><rect x="570" y="330" width="40" height="40" rx="5" fill="#eb6834"/><rect x="620" y="330" width="40" height="40" rx="5" fill="#eb6834"/><rect x="670" y="330" width="40" height="40" rx="5" fill="#eb6834"/><text x="920" y="360" font-size="24">sẵn sàng 10, tổng 10</text><line x1="615" y1="55" x2="615" y2="385" stroke="#059669" stroke-width="3" stroke-dasharray="10 6"/><text x="615" y="40" text-anchor="middle" font-size="22" fill="#059669">8 bản: mức tối thiểu</text><rect x="1180" y="80" width="30" height="30" rx="5" fill="#2a78d6"/><text x="1222" y="104" font-size="22">Pod cũ</text><rect x="1180" y="130" width="30" height="30" rx="5" fill="#eb6834"/><text x="1222" y="154" font-size="22">Pod mới sẵn sàng</text><rect x="1182" y="182" width="26" height="26" rx="5" fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="6 4"/><text x="1222" y="204" font-size="22">Pod mới đang khởi động</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ 10 bản được thay qua 4 vòng, mỗi hàng là trạng thái sau một vòng. Ô xanh là Pod cũ, ô cam đặc là Pod mới đã sẵn sàng, ô cam đứt nét là Pod mới đang khởi động. Ở mọi hàng, số ô đặc, tức số Pod sẵn sàng, không bao giờ xuống dưới đường xanh lá 8 bản. Pod cũ chỉ bị xoá khi đã có đủ Pod khác sẵn sàng thay chỗ, nên khách không thấy gián đoạn. Trong mỗi vòng, lúc Pod mới vừa được tạo mà Pod cũ chưa xoá, tổng số Pod lên tới 13."

  - id: example
    kind: example
    title: "Cuốn chiếu 10 bản với 25%"
    checks:
      - "alg.rolling_update(10, 0.25, 0.25)[:4] == (2, 3, 8, 13)"
      - "math.floor(10 * 0.25) == 2 and math.ceil(10 * 0.25) == 3"
    steps:
      - show: |
          <p><b>Bước 1</b> — 10 bản, được phép <b>thiếu</b> 25% và <b>dư</b> 25%:</p>
          $$10 \cdot 0{,}25 = 2{,}5$$
          <p>Không có nửa Pod, nên phải làm tròn — và mỗi tham số làm tròn một hướng.</p>
        focus: [1, 2, 3]
        say: "Bước một, có 10 bản, được phép thiếu 25 phần trăm và dư 25 phần trăm. 10 nhân 0 phẩy 25 bằng 2 phẩy 5. Không có nửa Pod, nên phải làm tròn, và mỗi tham số làm tròn theo một hướng."
      - show: |
          <table class="t"><tr><th>tham số</th><th>làm tròn</th><th>kết quả</th><th>nghĩa</th></tr>
          <tr><td>được thiếu</td><td>xuống: $\lfloor 2{,}5 \rfloor$</td><td>2</td><td>luôn $\geq 10 - 2 = \hl{8}$ bản sẵn sàng</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Bước hai, số được thiếu làm tròn xuống thành 2. Vì vậy luôn có ít nhất 10 trừ 2, bằng 8 bản sẵn sàng. Làm tròn xuống nghĩa là thiếu ít hơn, tức an toàn hơn cho khách."
      - show: |
          <table class="t"><tr><th>tham số</th><th>làm tròn</th><th>kết quả</th><th>nghĩa</th></tr>
          <tr><td>được dư</td><td>lên: $\lceil 2{,}5 \rceil$</td><td>3</td><td>tối đa $10 + 3 = \hl{13}$ Pod cùng lúc</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Bước ba, số được dư làm tròn lên thành 3. Vì vậy có tối đa 10 cộng 3, bằng 13 Pod cùng lúc. Làm tròn lên cho phép tạo thêm nhiều Pod mới một lúc, nên cập nhật xong nhanh hơn."
      - clear: true
        show: |
          <table class="t"><tr><th>vòng</th><th>tạo Pod mới</th><th>xoá Pod cũ</th><th>còn cũ</th><th>sẵn sàng thấp nhất</th><th>tổng cao nhất</th></tr>
          <tr><td>1</td><td>3</td><td>2</td><td>8</td><td>8</td><td>13</td></tr>
          <tr><td>2</td><td>2</td><td>3</td><td>5</td><td>8</td><td>13</td></tr>
          <tr><td>3</td><td>3</td><td>2</td><td>3</td><td>8</td><td>13</td></tr>
          <tr><td>4</td><td>2</td><td>3</td><td>0</td><td>8</td><td>13</td></tr></table>
          <p><b>Bước 4</b> — mô phỏng từng vòng: không lúc nào dưới 8, không lúc nào trên 13; xong sau 4 vòng.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bước bốn, ta mô phỏng từng vòng. Vòng một tạo 3 Pod mới cho tổng lên 13, rồi xoá 2 Pod cũ, còn 8 Pod cũ sẵn sàng. Vòng hai, 3 Pod mới đã sẵn sàng nên xoá được 3 Pod cũ, còn 5, và tạo thêm 2 Pod mới. Vòng ba tạo 3, xoá 2, còn 3 Pod cũ. Vòng bốn tạo 2, xoá 3 Pod cũ cuối cùng. Suốt bốn vòng, không lúc nào dưới 8 bản sẵn sàng hay trên 13 Pod, và việc cập nhật xong sau 4 vòng."
      - show: |
          <div class="box key"><b>Bước 5</b> — làm tròn theo hướng <b>an toàn</b>: thiếu thì làm tròn xuống (thiếu ít hơn), dư thì làm tròn lên (cập nhật nhanh hơn).</div>
        say: "Bước năm, rút ra quy tắc. Làm tròn theo hướng an toàn, thiếu thì làm tròn xuống để thiếu ít hơn, dư thì làm tròn lên để cập nhật nhanh hơn."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác: đếm và đổi ra phần trăm"
    checks:
      - "3 + 2 + 3 + 2 == 10 == 2 + 3 + 2 + 3 and 10 - (2 + 3 + 2 + 3) == 0"
      - "Fraction(8, 10) == Fraction(4, 5) and Fraction(8, 10) >= Fraction(3, 4) and 13 / 10 == 1.3 > 1.25 and 2 / 10 < 0.25"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>đã thay hết?</td><td>cộng cột tạo: $3 + 2 + 3 + 2$; cộng cột xoá: $2 + 3 + 2 + 3$</td><td>10 mới, 10 cũ bị xoá ✓</td></tr>
          <tr><td>thiếu bao nhiêu phần trăm?</td><td>$\frac{8}{10} = 80\%$ còn sẵn sàng</td><td>thiếu thật 20% ≤ 25% ✓</td></tr>
          <tr><td>dư bao nhiêu phần trăm?</td><td>$\frac{13}{10} = 130\%$</td><td>dư thật 30%, nhỉnh hơn 25% vì làm tròn lên</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.4"]
        say: "Kiểm bằng đường khác, ta đếm lại và đổi ra phần trăm, vì hai cách tính độc lập mà khớp thì đáng tin. Cộng cột tạo được 3 cộng 2 cộng 3 cộng 2, bằng 10 Pod mới, cộng cột xoá cũng được 10 Pod cũ, nên đã thay hết. Thấp nhất còn 8 trên 10, tức 80 phần trăm, nên thiếu thật chỉ 20 phần trăm, không quá 25. Cao nhất 13 trên 10, tức 130 phần trăm, dư thật 30 phần trăm. Con số này nhỉnh hơn 25 phần trăm vì số được dư làm tròn lên, nên khi tính máy cho cụm hãy dùng 13 chứ đừng dùng 12 phẩy 5."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "2000 * 5 // 100 == 100 and 100 * 10 == 1000 and 1000 * Fraction(1, 1000) == 1 and 1000 * Fraction(2, 1000) == 2"
      - "round((1 - 0.002) ** 1000, 3) == 0.135 and round(1 / (1 - 0.002) ** 1000) == 7"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đổi lược đồ cơ sở dữ liệu không tương thích ngược <b class="red">(bản cũ chết)</b>
          <br><span class="note">Bản mới đổi tên cột; trong lúc cuốn chiếu, bản cũ vẫn chạy và đọc cột cũ → lỗi. Đổi theo nhiều bước: thêm cột mới, ghi cả hai, chuyển đọc, rồi mới bỏ cột cũ.</span></div>
        say: "Lỗi thứ nhất, đổi lược đồ cơ sở dữ liệu không tương thích ngược. Bản mới đổi tên cột, trong lúc cuốn chiếu bản cũ vẫn chạy và đọc cột cũ nên bị lỗi. Hãy đổi theo nhiều bước, thêm cột mới, ghi cả hai, chuyển đọc, rồi mới bỏ cột cũ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Không có kiểm tra sẵn sàng <b class="red">(nhận khách quá sớm)</b>
          <br><span class="note">Pod mới vừa khởi động đã nhận lưu lượng trong khi còn đang nạp dữ liệu: khách gặp lỗi. Khai báo kiểm tra sẵn sàng để chỉ nhận yêu cầu khi đã sẵn sàng thật.</span></div>
        say: "Lỗi thứ hai, không có kiểm tra sẵn sàng. Pod mới vừa khởi động đã nhận lưu lượng trong khi còn đang nạp dữ liệu, và khách gặp lỗi. Hãy khai báo kiểm tra sẵn sàng, để Pod chỉ nhận yêu cầu khi đã sẵn sàng thật."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Phát hành thử mà không có tiêu chí dừng <b class="red">(chỉ để cho có)</b>
          <br><span class="note">Cho 5% lưu lượng vào bản mới nhưng không ai so tỉ lệ lỗi, độ trễ với bản cũ. Viết sẵn ngưỡng: lỗi tăng quá X hoặc p99 tăng quá Y thì tự quay lại.</span></div>
        say: "Lỗi thứ ba, phát hành thử mà không có tiêu chí dừng. Cho 5 phần trăm lưu lượng vào bản mới nhưng không ai so tỉ lệ lỗi và độ trễ với bản cũ. Hãy viết sẵn ngưỡng, lỗi hay độ trễ tăng quá mức đó thì tự quay lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Kết luận phát hành thử quá sớm, khi mới có quá ít yêu cầu <b class="red">(lỗi lọt qua)</b></div>
          <table class="t"><tr><th>giả sử: 2000 yêu cầu mỗi phút, bản thử nhận 5%</th><th>con số</th></tr>
          <tr><td>bản thử nhận mỗi phút</td><td>$2000 \cdot 5\% = 100$ yêu cầu</td></tr>
          <tr><td>sau 10 phút</td><td>1000 yêu cầu</td></tr>
          <tr><td>bản cũ lỗi 0,1%, bản mới lỗi gấp đôi 0,2%</td><td>kì vọng 1 lỗi so với 2 lỗi</td></tr>
          <tr><td>bản mới tệ gấp đôi mà 1000 yêu cầu không lỗi nào</td><td>$0{,}998^{1000} \approx 0{,}135$</td></tr></table>
        introduces: [power, approx]
        focus: [1, "2.2", "2.4", "2.5", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, kết luận phát hành thử quá sớm, khi mới có quá ít yêu cầu. Giả sử dịch vụ nhận 2000 yêu cầu mỗi phút, bản thử nhận 5 phần trăm, tức 100 yêu cầu mỗi phút, sau 10 phút là 1000 yêu cầu. Bản cũ lỗi 0 phẩy 1 phần trăm, bản mới lỗi gấp đôi, thì trong 1000 yêu cầu ta chỉ kì vọng 1 lỗi so với 2 lỗi, quá ít để phân biệt. Xác suất bản mới tệ gấp đôi mà cả 1000 yêu cầu không lỗi nào là 0 phẩy 998 mũ 1000, khoảng 0 phẩy 135, tức cứ khoảng 7 lần thì có một lần trông hoàn toàn sạch. Người làm nghề tính trước cần bao nhiêu yêu cầu mới đủ thấy khác biệt, rồi mới đặt thời gian chờ cho bản thử."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.rolling_update(4, 0.25, 0.25)[:4] == (1, 1, 3, 5) and alg.rolling_update(8, 0.25, 0.25)[:4] == (2, 2, 6, 10)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>4 bản, được thiếu 25%, được dư 25%: tối thiểu mấy bản sẵn sàng, tối đa mấy Pod?</td></tr>
          <tr><td>2</td><td>8 bản, cùng tham số: tối thiểu và tối đa?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 4 bản, được thiếu 25 phần trăm, được dư 25 phần trăm, tối thiểu mấy bản sẵn sàng, và tối đa mấy Pod? Câu hai, 8 bản với cùng tham số thì tối thiểu và tối đa là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: 4 bản</th><th>tính</th></tr>
          <tr><td>$4 \cdot 0{,}25$</td><td>$= 1$, đã nguyên: làm tròn xuống hay lên đều là 1</td></tr>
          <tr><td>tối thiểu sẵn sàng</td><td>$4 - 1 = \hl{3}$</td></tr>
          <tr><td>tối đa Pod</td><td>$4 + 1 = \hl{5}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, có 4 bản. 4 nhân 0 phẩy 25 bằng 1, đã là số nguyên nên làm tròn xuống hay lên đều được 1. Tối thiểu sẵn sàng là 4 trừ 1, bằng 3 bản. Tối đa là 4 cộng 1, bằng 5 Pod."
      - show: |
          <table class="t"><tr><th>câu 2: 8 bản</th><th>tính</th></tr>
          <tr><td>$8 \cdot 0{,}25$</td><td>$= 2$, đã nguyên</td></tr>
          <tr><td>tối thiểu sẵn sàng</td><td>$8 - 2 = \hl{6}$</td></tr>
          <tr><td>tối đa Pod</td><td>$8 + 2 = \hl{10}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, có 8 bản. 8 nhân 0 phẩy 25 bằng 2, cũng đã nguyên. Tối thiểu sẵn sàng là 8 trừ 2, bằng 6 bản. Tối đa là 8 cộng 2, bằng 10 Pod."

