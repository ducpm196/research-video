scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Phát hành lúc 2 giờ chiều mà không ai thấy"
    steps:
      - show: |
          <p>Ngày trước: phát hành phải chọn 2 giờ sáng, tắt hết, chép bản mới, bật lại, cầu mong. Bây giờ: phát hành giữa giờ làm việc, khách vẫn mua hàng bình thường, và nếu bản mới lỗi thì quay lại trong vài phút.</p>
          <div class="box key">Hôm nay: ba cách phát hành không ngừng dịch vụ — <b>cuốn chiếu</b>, <b>xanh–lam</b>, <b>phát hành thử</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, ngày trước phát hành phải chọn 2 giờ sáng, tắt hết, chép bản mới, bật lại, và cầu mong. Bây giờ ta phát hành giữa giờ làm việc, khách vẫn mua hàng bình thường, và nếu bản mới lỗi thì quay lại trong vài phút. Hôm nay ta học ba cách phát hành không ngừng dịch vụ, cuốn chiếu, xanh lam, và phát hành thử."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: khai báo số bản, Pod sẵn sàng, làm tròn xuống và lên"
    checks:
      - "alg.reconcile(3, [1]) == [2, 3]"
      - "math.floor(2.5) == 2 and math.ceil(2.5) == 3 and math.floor(2) == math.ceil(2) == 2 and 10 * 0.25 == 2.5"
    steps:
      - show: |
          <table class="t"><tr><th>điều đã học ở bài 5</th><th>ví dụ</th></tr>
          <tr><td>đối tượng triển khai khai báo muốn có n bản Pod từ một ảnh</td><td>muốn 3 bản</td></tr>
          <tr><td>vòng điều khiển: thấy thiếu thì tạo, thấy thừa thì xoá</td><td>1 Pod chết: thấy 2, tạo lại 1, về 3</td></tr>
          <tr><td>Pod <b>sẵn sàng</b>: đã khởi động xong, nhận được yêu cầu</td><td>Pod vừa tạo còn nạp dữ liệu: chưa sẵn sàng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Ở bài 5 ta đã học ba điều sẽ dùng hôm nay. Đối tượng triển khai khai báo muốn có n bản Pod từ một ảnh, ví dụ muốn 3 bản. Vòng điều khiển thấy thiếu thì tạo, thấy thừa thì xoá, nên khi một Pod chết, nó thấy 2 và tạo lại 1 cho đủ 3. Một Pod chỉ tính là sẵn sàng khi đã khởi động xong và nhận được yêu cầu, Pod vừa tạo còn đang nạp dữ liệu thì chưa sẵn sàng."
      - show: |
          <table class="t"><tr><th>số</th><th>làm tròn xuống $\lfloor \cdot \rfloor$</th><th>làm tròn lên $\lceil \cdot \rceil$</th></tr>
          <tr><td>2,5</td><td>2</td><td>3</td></tr>
          <tr><td>2</td><td>2</td><td>2</td></tr></table>
        introduces: [floor, ceil]
        focus: [1, "1.2", "1.3", 0]
        say: "Bài này dùng hai cách làm tròn. Với 2 phẩy 5, làm tròn xuống được 2, làm tròn lên được 3. Với số đã nguyên như 2, cả hai cách đều giữ nguyên 2. Chỉ khi phép nhân ra số lẻ thì hai cách mới cho kết quả khác nhau."

  - id: sym
    kind: symbol
    title: "Giải mã: ba chiến lược phát hành"
    steps:
      - show: |
          <table class="t"><tr><th>chiến lược</th><th>cách làm</th><th>đánh đổi</th></tr>
          <tr><td><b>cuốn chiếu</b></td><td>thay dần từng nhóm Pod cũ bằng Pod mới</td><td>ít tài nguyên thừa; bản cũ và mới chạy <b>cùng lúc</b></td></tr>
          <tr><td><b>xanh–lam</b></td><td>dựng đủ một bộ mới bên cạnh, chuyển toàn bộ lưu lượng một lần</td><td>quay lại tức thì; tốn gấp đôi tài nguyên lúc chuyển</td></tr>
          <tr><td><b>canary</b> (phát hành thử)</td><td>cho bản mới nhận một phần nhỏ (ví dụ 5%) lưu lượng, theo dõi chỉ số rồi mới mở rộng</td><td>lỗi chỉ chạm ít khách; cần chỉ số tốt để quyết định</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng so ba chiến lược phát hành. Cuốn chiếu thay dần từng nhóm Pod cũ bằng Pod mới, ít tài nguyên thừa, nhưng bản cũ và bản mới chạy cùng lúc. Xanh lam dựng đủ một bộ mới bên cạnh rồi chuyển toàn bộ lưu lượng một lần, quay lại tức thì nhưng tốn gấp đôi tài nguyên lúc chuyển. Phát hành thử cho bản mới nhận một phần nhỏ lưu lượng, ví dụ 5 phần trăm, theo dõi chỉ số rồi mới mở rộng, lỗi chỉ chạm ít khách nhưng cần chỉ số tốt để quyết định."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cuốn chiếu: xanh lùi dần, cam tiến dần"
    checks:
      - "(lambda R: all(o + r >= 8 for o, r, s in R) and [o + r for o, r, s in R] == [10, 8, 8, 8, 8, 10] and R[-1] == (0, 10, 0))([(10, 0, 0), (8, 0, 3), (5, 3, 2), (3, 5, 3), (0, 8, 2), (0, 10, 0)])"
      - "alg.rolling_update(10)[2:5] == (8, 13, 4)"
    steps:
