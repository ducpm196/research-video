scenes:
- id: hook
  kind: hook
  title: Nút thắt sống còn khi tích hợp hệ thống với Core Banking
  steps:
  - show: '<p>Trong hệ thống ngân hàng, Core Banking Temenos T24 chính là trái tim
      nắm giữ mọi sổ cái và dòng tiền.</p>

      <div class="box key">Mọi giao dịch nạp rút, chuyển tiền, hay giải ngân đều phải
      đi qua <b>bản tin OFS</b> và <b>hàng đợi IBM MQ</b>.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, trong kiến trúc công nghệ ngân hàng, Core Banking Temenos T24 là
      trái tim nắm giữ toàn bộ số dư và sổ cái. Mọi giao dịch mở tài khoản, chuyển
      tiền liên ngân hàng, hay tất toán sổ tiết kiệm đều phải gửi lệnh vào Core T24.
      Nếu tầng tích hợp xử lý sai cú pháp hoặc treo kết nối hàng đợi, toàn bộ cổng
      thanh toán sẽ tê liệt ngay lập tức.
  - show: '<p>Hôm nay, ta mổ xẻ chi tiết: <b>Cấu trúc bản tin OFS</b> (chuỗi văn bản
      phân cách bằng dấu phẩy), <b>mô hình Request-Reply bất đồng bộ</b>, và <b>cách
      ước lượng tải qua IBM MQ</b> (số liệu ví dụ minh họa).</p>'
    focus:
    - 0
    - 0
    say: 'Hôm nay ta cùng phân tích sâu bản chất kỹ thuật: cấu trúc bản tin OFS, cơ
      chế gửi nhận bất đồng bộ qua IBM MQ, và giải pháp xử lý timeout chuẩn Senior.
      Nắm chắc bài này, bạn sẽ hoàn toàn tự tin trả lời mọi câu hỏi kiến trúc tích
      hợp Core tại ACB.'
- id: prereq
  kind: prereq
  title: 'Ôn lại: Khái niệm hàng đợi tin nhắn, định danh tương quan và độ trễ'
  checks:
  - 5000 * 60 == 300000 and 300000 * 60 == 18000000
  - 1000 // 35 == 28 and 35 * 28 == 980
  steps:
  - show: "<p><b>Ba khái niệm cốt lõi cần nhớ trước khi làm việc với IBM MQ</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>khái niệm</th><th>ý nghĩa kỹ thuật</th><th>vai\
      \ trò trong Core T24</th></tr>\n  <tr><td>Message Queue</td><td>hàng đợi lưu\
      \ trữ tin nhắn trung gian</td><td>đệm tải, đảm bảo không mất bản tin khi Core\
      \ bận</td></tr>\n  <tr><td>Correlation ID</td><td>chuỗi định danh duy nhất của\
      \ mỗi yêu cầu</td><td>ghép cặp chính xác phản hồi với yêu cầu ban đầu</td></tr>\n\
      \  <tr><td>Connection Pool</td><td>tập hợp các kết nối mở sẵn đến Broker</td><td>tái\
      \ sử dụng kết nối mạng, tránh tạo lại tốn tài nguyên</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước tiên ta ôn lại ba khái niệm nền tảng trong truyền thông tin nhắn. Hàng
      đợi tin nhắn đóng vai trò vùng đệm, bảo đảm không làm mất dữ liệu khi Core Banking
      xử lý chậm. Định danh tương quan là chuỗi ngẫu nhiên duy nhất giúp ta ghép đúng
      câu trả lời của từng giao dịch. Nhóm kết nối mở sẵn giúp tái sử dụng đường truyền
      mạng mà không tốn công bắt tay lại.
  - show: '<div class="box key">Ví dụ minh họa (không phải số liệu thật của ngân hàng):
      ở lưu lượng giả định $5\,000$ lệnh mỗi giây, mỗi phút hệ thống xử lý $5\,000
      \times 60 = 300\,000$ lệnh. Nếu độ trễ giả định là $35$ ms, một kết nối xử lý
      tuần tự gánh được $1\,000 / 35 \approx 28$ lệnh mỗi giây.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta làm một phép tính nhanh về khả năng tải với số liệu giả định. Ở mức 5
      nghìn lệnh mỗi giây, mỗi phút có 300 nghìn bản tin được luân chuyển. Với độ
      trễ giả định 35 mi li giây, một kết nối xử lý tuần tự có thể làm 28 lượt hỏi
      đáp trong một giây. Do đó ta cần cấu hình kích
      thước nhóm kết nối hợp lý để khai thác tối đa tài nguyên.
