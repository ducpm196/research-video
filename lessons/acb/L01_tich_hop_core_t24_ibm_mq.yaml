    say: 'Nhìn lên sơ đồ luồng kiến trúc tích hợp. Dịch vụ thanh toán là một vi dịch vụ, tức một chương trình nhỏ chạy riêng và lo đúng một việc. Bước một, dịch vụ thanh toán tạo bản tin OFS và gán một mã định danh tương quan ngẫu nhiên. Bước hai, bản tin được đẩy vào hàng đợi yêu cầu trên máy chủ IBM MQ. Bước ba, tiến trình lắng nghe của T24 bốc bản tin ra để hạch toán, tức ghi nợ trừ tiền tài khoản này và ghi có cộng tiền tài khoản kia, vào cơ sở dữ liệu sổ cái. Bước bốn, T24 đẩy kết quả vào hàng đợi trả lời với cùng mã định danh ban đầu. Cuối cùng, bên nhận tin, tức chương trình đọc tin ra khỏi hàng đợi trả lời, so khớp mã định danh để trả kết quả cho khách hàng.'
