- id: symbol
  kind: symbol
  title: Giải mã cú pháp bản tin OFS trong Temenos T24
  steps:
  - show: '<p><b>Cấu trúc một bản tin OFS</b> (chuỗi văn bản phân cách bằng dấu phẩy,
      không phải XML):</p>

      <div class="box code"><code>APPLICATION,VERSION/FUNCTION/PROCESS,USER/PASSWORD/COMPANY,TRANSACTION.ID,TÊN.TRƯỜNG=GIÁ.TRỊ,...</code></div>

      <table class="t"> <tr><th>thành phần OFS</th><th>ví dụ minh họa</th><th>ý nghĩa</th></tr>
      <tr><td>APPLICATION</td><td>FUNDS.TRANSFER</td><td>ứng dụng chuyển tiền</td></tr>
      <tr><td>OPTIONS</td><td>ACTR/I/PROCESS</td><td>version, chức năng nhập, xử lý</td></tr>
      <tr><td>USER/PASSWORD/COMPANY</td><td>INPUTTER/******/VN0010001</td><td>người dùng / mật
      khẩu / mã công ty (đơn vị ngân hàng)</td></tr> <tr><td>TRANSACTION.ID</td><td>(để
      trống)</td><td>T24 tự sinh mã giao dịch (mã FT)</td></tr> <tr><td>DEBIT.ACCT.NO / CREDIT.ACCT.NO</td><td>0123456789
      / 9876543210</td><td>tài khoản nguồn / đích</td></tr> <tr><td>DEBIT.AMOUNT</td><td>5000000</td><td>số
      tiền trích nợ</td></tr> </table>

      <p class="note">Cú pháp rút gọn để học; hãy hỏi lại bản mô tả chính thức của Temenos mà ngân hàng đang dùng.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bản tin OFS tuân theo cấu trúc phân cách nghiêm ngặt. Phần đầu là tên ứng
      dụng, tiếp theo là phần tuỳ chọn gồm phiên bản giao diện và chức năng xử lý.
      Sau đó là người dùng kết nối gồm tên, mật khẩu và mã công ty, tức mã đơn vị trong ngân hàng. Rồi đến mã giao dịch, để trống cho Core tự sinh, đó là mã chuyển tiền do T24 tạo. Các
      trường dữ liệu phía sau có dạng tên bằng giá trị, mang số tài khoản nguồn và tài khoản đích. Nó cũng chỉ
      định số tiền cần trích nợ của giao dịch. Nếu thiếu một dấu phẩy hoặc sai tên
      trường, T24 sẽ từ chối lệnh và trả về bản tin báo lỗi. Đây là cú pháp rút gọn để học, hãy hỏi lại bản mô tả chính thức của Temenos mà ngân hàng đang dùng.
  - clear: true
    show: '<p><b>Ráp các phần lại thành một bản tin OFS</b> (ví dụ minh họa; bản thật
      nằm trên một dòng, ở đây xuống dòng sau dấu phẩy cho vừa màn hình):</p>

      <div class="box code"><div>FUNDS.TRANSFER,ACTR/I/PROCESS,INPUTTER/******/VN0010001,,</div><div>DEBIT.ACCT.NO=0123456789,CREDIT.ACCT.NO=9876543210,DEBIT.AMOUNT=5000000</div></div>

      <p>Hai dấu phẩy liền nhau <code>,,</code> là chỗ mã giao dịch để trống.</p>'
    focus:
    - 0
    - 0
    say: Ráp tất cả các phần lại, ta được một bản tin trọn vẹn, các phần cách nhau
      bằng dấu phẩy. Vì mã giao dịch để trống cho Core tự sinh, trong bản tin có hai
      dấu phẩy đứng liền nhau.
- id: example
  kind: example
  title: Tính toán kích thước hàng đợi và thời gian quay vòng lệnh
  checks:
  - 2 * 3 == 6
  - 5000 * 35 == 175000 and 175000 // 1000 == 175
  - -(-5000 // 28) == 179 and 28 * 179 >= 5000
  - 5000 * 2 == 10000
  steps:
  - show: '<p><b>Bước 1 — Tính số lượng bản tin đồng thời trong hàng đợi (Little''s
      Law)</b>:</p>

      <div class="box key">Định luật Little: $L = N \times W$ — số việc đang nằm trong
      hệ thống bằng tốc độ việc đến nhân thời gian mỗi việc ở lại. Ví dụ nhỏ: mỗi
      giây $2$ khách vào quán, mỗi khách ngồi $3$ giây thì trung bình có $2 \times
      3 = 6$ khách trong quán.<br/>

      Với thông lượng $N = 5\,000$ lệnh/giây, thời gian phản hồi $W = 35$ ms $= 0{,}035$
      giây.<br/>

      Số bản tin trung bình đang chờ phản hồi trong hệ thống: $L = 5\,000 \times 0{,}035
      = 175$ bản tin (số liệu ví dụ minh họa).</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bước một, ta tính số bản tin đang được xử lý đồng thời theo định luật Lít-tơn.
      Định luật này nói rằng số việc đang nằm trong hệ thống bằng tốc độ việc đến
      nhân với thời gian mỗi việc ở lại. Ví dụ, mỗi giây có hai khách vào quán và
      mỗi khách ngồi ba giây, thì trung bình trong quán luôn có sáu khách. Với lưu
      lượng giả định 5 nghìn lệnh mỗi giây và thời gian xử lý 35 mi li giây, trung
      bình có 175 bản tin đang chờ phản hồi. Đây là số giao dịch đang bay trong hệ
      thống, chưa phải là số kết nối cần mở.
  - clear: true
    show: '<p><b>Bước 2 — Số kết nối phụ thuộc mô hình gửi nhận</b>:</p>

      <table class="t"> <tr><th>mô hình</th><th>công thức</th><th>kết quả (ví dụ minh
      họa)</th></tr> <tr><td>Mỗi kết nối xử lý tuần tự một lệnh</td><td>$5\,000 /
      28$</td><td>$\approx 179$ kết nối (gần bằng $L = 175$)</td></tr> <tr><td>Request-Reply
      bất đồng bộ (CorrelationID)</td><td>nhiều bản tin chờ trên một kết nối</td><td>vài
      kết nối, chọn theo thông lượng đo được</td></tr> </table>'
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, số kết nối cần mở phụ thuộc vào mô hình gửi nhận. Nếu mỗi kết nối
      xử lý tuần tự 28 lệnh mỗi giây, ta cần khoảng 179 kết nối, xấp xỉ số bản tin
      đang chờ. Còn với mô hình bất đồng bộ dùng mã tương quan, một kết nối mang được
      nhiều bản tin cùng lúc nên chỉ cần vài kết nối, chọn theo thông lượng đo thực
      tế.
  - clear: true
    show: '<p><b>Bước 3 — Cấu hình hàng đợi vào và hàng đợi ra</b>:</p>

      <div class="box key">Nên tách hai hàng đợi độc lập (cách thường dùng để tránh đọc nhầm trả lời): <code>T24.OFS.REQUEST</code>
      (vào) và <code>T24.OFS.REPLY</code> (ra). Dung lượng tối đa (ví dụ minh họa):
      $10\,000$ bản tin, bằng hai lần lưu lượng giả định mỗi giây.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước ba, ta phân tách rạch ròi hàng đợi gửi lệnh và hàng đợi nhận kết quả.
      Nên tách riêng, vì khi dùng chung một hàng đợi hai chiều thì bên gửi lệnh có thể đọc nhầm bản tin trả lời và tranh chấp đọc ghi.
      Ví dụ cấu hình dung lượng hàng đợi 10 nghìn bản tin giúp hệ thống hấp thụ các
      đợt tải đột biến ngắn.
- id: code
  kind: example
  title: 'Chạy thử bằng mã Python (mô phỏng): ráp bản tin OFS và ghép trả lời theo
    mã'
  checks:
  - '''FUNDS.TRANSFER,ACTR/I/PROCESS,INPUTTER/******/VN0010001,,DEBIT.AMOUNT=5000000''.split('','')[4]
    == ''DEBIT.AMOUNT=5000000'''
  - 'len({''c1'': ''a'', ''c2'': ''b''}) - 2 == 0'
  steps:
  - clear: true
    show: |
      <p><b>Đọc trước</b> — bốn cách viết trong mã ráp bản tin:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def ofs(app, opts, user, tid, tien):</code></td><td><code>def</code> đặt tên cho một <b>hàm</b>, tức một đoạn việc dùng lại được; tên trong ngoặc là các đầu vào</td><td>gọi <code>ofs(...)</code> với năm giá trị thì máy chạy các dòng thụt vào dưới</td></tr><tr><td><code>"DEBIT.AMOUNT=" + tien</code></td><td>dấu cộng giữa hai chuỗi chữ là <b>nối</b> chúng lại</td><td><code>"ab" + "cd"</code> ra <code>abcd</code></td></tr><tr><td><code>return ",".join([a, b])</code></td><td><code>return</code> đưa giá trị ra khỏi hàm; <code>",".join([...])</code> nối các phần trong ngoặc vuông, mỗi chỗ nối là một dấu phẩy</td><td><code>",".join(["x", "y"])</code> ra <code>x,y</code></td></tr><tr><td><code>tin.split(",")[4]</code></td><td><code>split</code> tách chuỗi theo dấu phẩy; <code>[4]</code> lấy phần thứ năm vì máy đếm từ 0</td><td><code>"a,b,c".split(",")[1]</code> ra <code>b</code></td></tr></table>
    say: Trước khi đọc mã, ta học bốn cách viết. Dòng mở đầu một hàm đặt tên cho một đoạn việc dùng lại được, các tên trong ngoặc là đầu vào. Dấu cộng giữa hai chuỗi chữ nghĩa là nối chúng lại. Lệnh trả kết quả đưa giá trị ra khỏi hàm, còn lệnh nối ghép các phần trong ngoặc vuông, mỗi chỗ nối là một dấu phẩy. Lệnh tách cắt chuỗi theo dấu phẩy, rồi ta lấy phần thứ năm vì máy đếm từ không.
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
    show: '<p><b>Mô phỏng bằng Python</b> — T24 và IBM MQ thật không chạy trên máy
      này.</p><div
      class="code"><div>def ofs(app, opts, user, tid, tien):</div><div>    kv = "DEBIT.AMOUNT=" + tien</div><div>    return ",".join([app,
      opts, user, tid, kv])</div><div> </div><div>tin = ofs("FUNDS.TRANSFER", "ACTR/I/PROCESS",</div><div>          "INPUTTER/******/VN0010001",
      "", "5000000")</div><div>print(tin)</div><div>print(tin.split(",")[4])</div></div><p><b>Kết
      quả khi chạy</b></p><div class="code"><div>FUNDS.TRANSFER,ACTR/I/PROCESS,INPUTTER/******/VN0010001,,DEBIT.AMOUNT=5000000</div><div>DEBIT.AMOUNT=5000000</div></div>'
    say: Đây là mô phỏng bằng ngôn ngữ Python, vì T24 và IBM MQ thật không chạy được
      trên máy của bạn. Gọi hàm với năm giá trị thì ra một chuỗi bản tin, như tên trường nối với số tiền. Mã giao dịch để chuỗi rỗng nên xuất hiện hai dấu phẩy
      liền nhau. Dòng in thứ hai lấy phần thứ năm, là cặp tên trường và số tiền.
    focus:
    - 0
    - 0
    - 0
    - 0
  - clear: true
    show: |
      <p><b>Đọc trước</b> — bốn chỗ lạ trong mã ghép trả lời:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>cho = {"c1": "chuyen 5tr", ...}</code></td><td>ngoặc nhọn tạo <b>từ điển</b>, tức bảng tra: mã đứng trước dấu hai chấm, nội dung đứng sau</td><td><code>cho["c1"]</code> ra <code>chuyen 5tr</code></td></tr><tr><td><code>tra_loi = [("c2", "OK"), ("c1", "LOI")]</code></td><td>ngoặc vuông tạo <b>danh sách</b>; mỗi cặp trong ngoặc tròn gồm một mã và một kết quả</td><td>cặp đầu có mã <code>c2</code>, kết quả <code>OK</code></td></tr><tr><td><code>for cid, kq in tra_loi:</code></td><td>vòng lặp lấy lần lượt từng cặp, gán mã vào <code>cid</code>, kết quả vào <code>kq</code>, rồi chạy các dòng thụt vào</td><td>lần một <code>cid</code> là <code>c2</code>, <code>kq</code> là <code>OK</code></td></tr><tr><td><code>cho.pop(cid)</code> và <code>len(cho)</code></td><td><code>pop</code> lấy ra theo mã và xoá khỏi bảng; <code>len</code> đếm số phần tử còn lại</td><td>sau hai lần <code>pop</code>, <code>len(cho)</code> là 0</td></tr></table>
    say: Tiếp theo là phần ghép trả lời, có bốn chỗ cần đọc. Dấu ngoặc nhọn tạo từ điển, tức bảng tra, mã đứng trước dấu hai chấm và nội dung đứng sau. Dấu ngoặc vuông tạo danh sách, mỗi cặp trong ngoặc tròn gồm một mã và một kết quả. Dòng mở đầu vòng lặp lấy lần lượt từng cặp, gán mã vào tên thứ nhất, kết quả vào tên thứ hai, rồi chạy các dòng thụt vào. Lệnh lấy ra theo mã và xoá khỏi bảng, còn lệnh đếm cho biết còn lại bao nhiêu phần tử.
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
    show: '<p>Ghép trả lời với yêu cầu theo mã tương quan, trả lời đến <b>sai thứ
      tự</b> (mô phỏng):</p><div class="code"><div>cho = {"c1": "chuyen 5tr", "c2":
      "chuyen 2tr"}</div><div>tra_loi = [("c2", "OK"), ("c1", "LOI")]</div><div>for
      cid, kq in tra_loi:</div><div>    print(cid, cho.pop(cid), "-&gt;", kq)</div><div>print("con
      cho:", len(cho))</div></div><p><b>Kết quả khi chạy</b></p><div class="code"><div>c2
      chuyen 2tr -&gt; OK</div><div>c1 chuyen 5tr -&gt; LOI</div><div>con cho: 0</div></div>'
    say: Bây giờ ghép trả lời với yêu cầu. Biến cho là một từ điển ghi hai yêu cầu đang chờ, mỗi
      yêu cầu có một mã. Hai trả lời đến sai thứ tự, mã thứ hai đến trước. Mỗi lần lấy
      ra theo mã rồi xoá mục đó khỏi bảng chờ, nên mỗi trả lời tìm đúng yêu cầu của
      nó. Cuối cùng không còn yêu cầu nào chờ, và đó là lý do ta dùng mã tương quan
      chứ không dựa vào thứ tự đến.
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
- id: check
  kind: check
  title: Kiểm tra xử lý tình huống Timeout của Core T24
  checks:
  - 3000 // 1000 == 3
  - 5000000 - 0 == 5000000
  steps:
  - show: "<p><b>Tình huống phỏng vấn</b>: Gửi lệnh trích nợ 5 triệu đồng qua IBM\
      \ MQ nhưng sau 3 giây không nhận được phản hồi từ T24. Bạn xử lý thế nào?</p>\n\
      <table class=\"t\">\n  <tr><th>hành động sai</th><th>hậu quả</th><th>cách xử lý chuẩn Senior</th></tr>\n\
      \  <tr><td>Báo lỗi thất bại ngay cho khách</td><td>Khách bấm thử lại trong khi lệnh cũ có thể đã hạch toán</td><td>Chuyển trạng thái giao dịch\
      \ sang IN_DOUBT (nghi vấn: chưa biết lệnh đã hạch toán hay chưa)</td></tr>\n\
      \  <tr><td>Tự động gửi lại lệnh khi chưa biết kết quả</td><td>Trừ tiền hai lần</td><td>Kích hoạt Worker (tiến\
      \ trình chạy nền) truy vấn giao dịch theo mã tham chiếu trên T24</td></tr>\n\
      \  <tr><td>Hoàn tiền ngay khi chưa tra soát</td><td>Lệch sổ cái, hoặc hoàn tiền cho lệnh thực ra đã thành công</td><td>Chỉ hoàn tiền khi có\
      \ kết quả đối soát chính xác (đối soát là so sổ hai bên xem từng khoản có khớp không)</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Ta kiểm tra tình huống thực tế khi máy chủ Core T24 bị quá tải dẫn tới hết
      thời gian chờ 3 giây. Do Core chưa trả kết quả, cách làm nghiệp dư là báo lỗi
      thất bại ngay hoặc tự động bấm gửi lại lệnh. Sai lầm này vì thế sẽ khiến tài
      khoản khách hàng bị trừ tiền hai lần hoặc làm lệch sổ cái ngân hàng.
  - clear: true
    show: '<div class="box key"><b>Quy tắc xử lý bất biến</b>: Vì chưa nhận được phản
      hồi, ta chuyển trạng thái sang nghi vấn. Sau 3 giây, Worker tự động truy vấn
      T24 theo mã tham chiếu để kiểm tra lệnh 5 triệu đã hạch toán hay chưa. Chỉ khi
      có kết quả chắc chắn mới hoàn tiền hoặc xác nhận thành công.</div>'
    focus:
    - 0
    - 0
    say: Vì bản tin có thể đã vào Core và được hạch toán, ta phải đánh dấu trạng thái
      nghi vấn. Do Core chưa trả kết quả, tiến trình tự động sẽ tra cứu lại sau 3
      giây để bảo toàn trọn vẹn số tiền cho khách hàng.
- id: pitfall
  kind: pitfall
  title: Ba sai lầm nghiêm trọng khi tích hợp IBM MQ và Core T24
  steps:
  - show: "<table class=\"t\">\n  <tr><th>sai lầm sơ cấp</th><th>hậu quả kỹ thuật</th><th>giải\
      \ pháp chuẩn Senior</th></tr>\n  <tr><td>Dùng luồng đồng bộ chờ kết quả</td><td>cạn\
      \ kiệt luồng máy chủ web khi Core chậm</td><td>xử lý bất đồng bộ hoặc dùng luồng\
      \ ảo Java 21 (luồng nhẹ, chờ không giữ luồng nền), nhả luồng nền trong lúc chờ</td></tr>\n\
      \  <tr><td>Không thiết lập Message Expiry (hạn sống của bản tin)</td><td>bản\
      \ tin cũ ứ đọng hàng đợi, có thể bị hạch toán muộn sang ngày hôm sau</td><td>đặt\
      \ hạn sống, ví dụ 60 giây (số minh hoạ)</td></tr>\n  <tr><td>Bỏ qua bản tin\
      \ độc (poison message)</td><td>một bản tin hỏng bị đọc lại mãi, làm đứng tiến\
      \ trình đọc</td><td>ngưỡng đọc lại và hàng đợi chuyển lỗi (BOTHRESH = 3, BOQNAME)</td></tr>\n\
      </table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Có ba sai lầm chí mạng khi tích hợp với hệ thống lõi qua hàng đợi. Thứ nhất
      là dùng luồng đồng bộ chờ kết quả. Luồng là một đường xử lý việc của máy chủ,
      số luồng có hạn, nên mỗi lệnh đứng chờ giữ một luồng và Core chậm là máy chủ
      cạn luồng. Thứ hai là không đặt hạn sống cho bản tin khiến các lệnh cũ ứ đọng
      và có thể bị hạch toán muộn sang ngày hôm sau. Thứ ba là không đặt ngưỡng đọc
      lại và hàng đợi chuyển lỗi. Ngưỡng đọc lại là số lần tối đa được đọc một bản
      tin, còn hàng đợi chuyển lỗi là nơi cất bản tin vượt ngưỡng. Thiếu chúng thì
      một bản tin hỏng bị đọc đi đọc lại mãi và làm nghẽn tiến trình đọc.
- id: quymo
  kind: example
  title: 'Quy mô và thời gian: cùng đường ống ở ×1, ×100 và ×10 000 (số minh hoạ)'
  checks:
  - 50 * 35 // 1000 == 1 and 50 * 35 / 1000 == 1.75 and 5000 * 35 // 1000 == 175 and
    500000 * 35 // 1000 == 17500
  - -(-50 // 28) == 2 and -(-5000 // 28) == 179 and -(-500000 // 28) == 17858
  - 5000 - 4000 == 1000 and 1000 * 60 == 60000 and 60000 // 4000 == 15 and 1000 *
    10 == 10000 and 10000 / 4000 == 2.5
  steps:
  - show: '<p>Độ trễ $35$ ms $= 0{,}035$ giây, một kết nối tuần tự làm $28$ lệnh mỗi
      giây (số minh hoạ):</p><table class="t"><tr><th>cỡ</th><th>lệnh mỗi giây</th><th>đang
      chờ (lệnh × 0,035 giây)</th><th>kết nối nếu tuần tự (lệnh : 28)</th><th>chọn
      gì</th></tr><tr><td>×1</td><td>50</td><td>1,75</td><td>2</td><td>một kết nối,
      một cặp hàng đợi</td></tr><tr><td>×100</td><td>5&nbsp;000</td><td>175</td><td>179</td><td>nhóm
      kết nối, ghép theo mã tương quan để cần ít kết nối hơn</td></tr><tr><td>×10&nbsp;000</td><td>500&nbsp;000</td><td>17&nbsp;500</td><td>17&nbsp;858</td><td>nhiều
      bộ quản lý hàng đợi, chia tài khoản thành nhiều nhóm, mỗi bộ lo một nhóm; Core trở thành nút cổ chai</td></tr></table><p
      class="note">Số kết nối làm tròn lên: $50 / 28 \approx 1{,}8 \to 2$; $500\,000
      / 28 \approx 17\,857{,}1 \to 17\,858$.</p>'
    say: 'Ta giữ độ trễ 35 mi li giây và tăng tải, với số minh hoạ. Ở cỡ một, 50 lệnh mỗi giây, chỉ cần hai kết nối tuần tự. Ở cỡ một trăm, đúng 5 nghìn lệnh mỗi giây của ví dụ, ta cần 179 kết nối nếu làm tuần tự, nên mới cần ghép theo mã tương quan. Ở cỡ mười nghìn, 500 nghìn lệnh mỗi giây, một bộ quản lý hàng đợi, tức một tiến trình MQ giữ các hàng đợi, không đủ. Phải chia tài khoản thành nhiều nhóm, mỗi bộ lo một nhóm. Khi đó nút cổ chai là Core, vì hàng đợi chỉ giữ hộ chứ không làm Core nhanh hơn.'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
  - show: '<p>Theo thời gian: lệnh đến $5\,000$ mỗi giây nhưng Core chỉ xử lý $4\,000$
      mỗi giây (số minh hoạ):</p><table class="t"><tr><th>giây</th><th>bản tin ứ lại</th><th>bản
      tin cuối phải chờ</th></tr><tr><td>10</td><td>10&nbsp;000</td><td>2,5 giây</td></tr><tr><td>60</td><td>60&nbsp;000</td><td>15
      giây</td></tr></table><p class="note">Ứ mỗi giây $5\,000 - 4\,000 = 1\,000$;
      sau $60$ giây ứ $60\,000$; bản cuối chờ $60\,000 / 4\,000 = 15$ giây.</p>'
    say: Còn theo thời gian thì sao. Giả sử lệnh đến 5 nghìn mỗi giây mà Core chỉ
      xử lý 4 nghìn mỗi giây. Mỗi giây hàng đợi ứ thêm một nghìn bản tin, sau 60 giây
      là 60 nghìn. Bản tin đến cuối phải chờ 15 giây. Nếu hạn sống của bản tin chỉ
      là 10 giây thì các lệnh cuối hết hạn trước khi được xử lý, đó là lý do phải
      đặt hạn sống và cho khách biết lệnh chưa chắc thành công.
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    clear: true
- id: quiz
  kind: quiz
  title: Thử thách phản xạ kiến trúc phỏng vấn ACB
  checks:
  - 1000 - 35 == 965 and 35 + 965 == 1000
  - 5000000 * 2 == 10000000
  steps:
  - pause: 15
    show: "<p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Khi kết nối Core T24 qua IBM MQ,\
      \ tại sao kỹ sư nên dùng thuộc tính <code>JMSCorrelationID</code> thay vì mở\
      \ một hàng đợi riêng cho mỗi người dùng?</p>\n<ul>\n  <li><b>A</b>: Vì thuộc\
      \ tính này tự mã hoá nội dung bản tin nên gửi nhanh và an toàn hơn nhiều.</li>\n  <li><b>B</b>:\
      \ Vì giao thức TCP chỉ cho phép một kết nối duy nhất giữa hai máy với nhau.</li>\n  <li><b>C</b>:\
      \ Vì mở hàng triệu hàng đợi riêng sẽ làm quá tải việc quản lý và bộ nhớ của máy chủ.</li>\n  <li><b>D</b>:\
      \ Vì hàng đợi riêng không giữ được bản tin khi máy chủ IBM MQ khởi động lại giữa chừng.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Hãy cùng thử thách với một câu hỏi luyện tập về kiến trúc tích hợp. Khi kết
      nối Core T24 qua IBM MQ, tại sao ta nên dùng mã định danh tương quan thay vì
      mở hàng đợi riêng cho từng khách hàng? Bạn có 15 giây suy nghĩ trước khi nghe
      đáp án chuẩn xác.
  - clear: true
    show: '<div class="box key"><b>Đáp án chính xác là C</b>!</div>

      <p><b>Bước 1 — Phân tích chi phí tài nguyên máy chủ IBM MQ</b>:</p>

      <p>Mỗi hàng đợi là một đối tượng trên máy chủ IBM MQ: phải được định nghĩa,
      cấp quyền, theo dõi, và chiếm bộ nhớ cùng dung lượng đĩa. Mở riêng cho hàng
      triệu khách hàng thì tài nguyên và công quản trị tăng theo số khách, máy chủ
      dễ quá tải.</p>'
    focus:
    - 0
    - 0
    say: Đáp án chính xác là phương án C. Bước một, mỗi hàng đợi là một đối tượng
      máy chủ phải quản lý và tốn tài nguyên, nên hàng triệu hàng đợi riêng sẽ làm
      quá tải máy chủ tin nhắn.
  - clear: true
    show: '<p><b>Bước 2 — Ưu thế của mã định danh tương quan JMSCorrelationID</b>:</p>

      <div class="box key">Sử dụng chung 2 hàng đợi lớn kèm <code>JMSCorrelationID</code>
      giúp ghép đúng kết quả mà chỉ tiêu tốn tài nguyên tối thiểu. Lưu ý: chống trừ
      tiền trùng là việc của khoá chống lặp (idempotency key), không phải của CorrelationID.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, dùng chung hai hàng đợi lớn và phân loại bằng mã định danh giúp
      ghép đúng kết quả mà tốn rất ít tài nguyên. Lưu ý, chống trừ tiền trùng lặp
      là nhiệm vụ của khoá chống lặp, không phải của mã định danh tương quan. Khoá
      chống lặp, tên chuyên môn là khoá lũy đẳng, là một mã riêng của mỗi lệnh, gặp
      lại mã đã xử lý thì bỏ qua.
    introduces:
    - acb_idem
- id: practice
  kind: practice
  title: 'Tự làm: ráp bản tin, ghép trả lời theo mã và tính số kết nối'
  checks:
  - 2000 * 45 // 1000 == 90 and 1000 // 45 == 22 and -(-2000 // 22) == 91 and 22 *
    91 >= 2000
  steps:
  - show: <p><b>Đề</b> (số minh hoạ). Viết <code>mau.py</code> ráp bản tin OFS, đếm
      số cặp tên=giá trị, ghép trả lời theo mã, rồi tính số bản tin đang chờ và số
      kết nối tuần tự:</p><table class="t"><tr><th>dữ kiện</th><th>giá trị</th></tr><tr><td>chuyển</td><td>1&nbsp;250&nbsp;000
      từ <code>5550001111</code> sang <code>6660002222</code></td></tr><tr><td>mã
      công ty</td><td><code>VN0010002</code></td></tr><tr><td>yêu cầu chờ</td><td><code>a1</code>
      (2tr), <code>a2</code> (1tr), <code>a3</code> (7tr)</td></tr><tr><td>trả lời
      đến</td><td><code>a3 OK</code>, <code>a1 OK</code>, <code>a2 LOI</code></td></tr><tr><td>tải,
      độ trễ</td><td>2&nbsp;000 lệnh mỗi giây, 45 ms</td></tr></table><p class="note">Lưu
      bài làm thành tệp <code>mau.py</code> rồi chạy bằng lệnh <code>python mau.py</code>; khung từng dòng in ra nằm trong <code>de.md</code>.</p>
    say: Bây giờ tới phần bạn tự làm với số liệu mới trên màn hình. Hãy ráp bản tin
      OFS, đếm số cặp tên và giá trị, rồi ghép ba trả lời đến sai thứ tự theo mã.
      Sau đó tính số bản tin đang chờ và số kết nối nếu làm tuần tự. Lưu bài thành tệp mau, chạy bằng lệnh Python kèm tên tệp, rồi dừng video và
      tự làm.
    focus:
    - 0
    - 0
    - 0
    - 0
    pause: 180
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>ofs dau: FUNDS.TRANSFER,ACTR/I/PROCESS,INPUTTER/******/VN0010002,,</div><div>ofs
      cap: DEBIT.ACCT.NO=5550001111,CREDIT.ACCT.NO=6660002222,DEBIT.AMOUNT=1250000</div><div>so
      truong: 3</div><div>a3 7tr -&gt; OK</div><div>a1 2tr -&gt; OK</div><div>a2 1tr
      -&gt; LOI</div><div>con cho: 0</div><div>dang cho: 90</div><div>ket noi tuan
      tu: 91</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh
      ACB L01 mau.py</code> — <code>bash</code> chạy tệp lệnh; <code>labs/cham.sh</code> là tệp chấm bài; <code>ACB L01 mau.py</code> là khoá, bài, tên tệp của bạn (lưu <code>mau.py</code> rồi chạy riêng bằng <code>python mau.py</code>). In <b>ĐÚNG</b> khi mọi dòng trùng.</p>'
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Muốn chấm bằng máy, gõ lệnh ở chân màn hình, nó chạy tệp chấm bài kèm khoá học, mã bài và tên tệp của bạn, và in chữ ĐÚNG khi mọi dòng trùng.
    focus:
    - 0
    - 0
    - 0
    clear: true
  - show: <div class="box key"><b>Nếu kẹt:</b> nối các phần bằng dấu phẩy, mã giao
      dịch là chuỗi rỗng; các cặp bắt đầu từ phần thứ năm. Ghép bằng từ điển và lệnh
      lấy ra theo mã. Đang chờ = tải × độ trễ ÷ 1000; mỗi kết nối làm 1000 ÷ 45 lệnh
      (chia nguyên), số kết nối làm tròn lên.<br>Lời giải đầy đủ ở <code>labs/ACB/L01/loi_giai.py</code>
      — chỉ mở sau khi bạn đã thử.</div>
    say: Nếu kẹt, nối các phần bằng dấu phẩy với mã giao dịch rỗng, và các cặp bắt
      đầu từ phần thứ năm. Ghép bằng từ điển và lệnh lấy ra theo mã. Số bản tin đang
