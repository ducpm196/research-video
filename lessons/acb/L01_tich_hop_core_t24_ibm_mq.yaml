- id: symbol
  kind: symbol
  title: Giải mã cú pháp bản tin OFS trong Temenos T24
  steps:
  - show: '<p><b>Cấu trúc một bản tin OFS</b> (chuỗi văn bản phân cách bằng dấu phẩy,
      không phải XML):</p>

      <div class="box code"><code>APPLICATION,VERSION/FUNCTION/PROCESS,USER/PASSWORD/COMPANY,TRANSACTION.ID,FIELD:MV:SV=VALUE,...</code></div>

      <table class="t">
        <tr><th>thành phần OFS</th><th>ví dụ minh họa</th><th>ý nghĩa</th></tr>
        <tr><td>APPLICATION</td><td>FUNDS.TRANSFER</td><td>ứng dụng chuyển tiền</td></tr>
        <tr><td>OPTIONS</td><td>ACTR/I/PROCESS</td><td>version, chức năng nhập, xử lý</td></tr>
        <tr><td>TRANSACTION.ID</td><td>(để trống)</td><td>T24 tự sinh mã FT</td></tr>
        <tr><td>DEBIT.ACCT.NO / CREDIT.ACCT.NO</td><td>0123456789 / 9876543210</td><td>tài khoản nguồn / đích</td></tr>
        <tr><td>DEBIT.AMOUNT</td><td>5000000</td><td>số tiền trích nợ</td></tr>
      </table>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bản tin OFS tuân theo cấu trúc phân cách nghiêm ngặt. Phần đầu là tên ứng
      dụng, tiếp theo là phần tuỳ chọn gồm phiên bản giao diện và chức năng xử lý.
      Sau đó là người dùng kết nối, rồi mã giao dịch để trống cho Core tự sinh. Các
      trường dữ liệu phía sau mang số tài khoản nguồn và tài khoản đích. Nó cũng chỉ định số tiền cần trích nợ của giao dịch. Nếu thiếu một dấu
      phẩy hoặc sai tên trường, T24 sẽ từ chối xử lý ngay lập tức.
- id: example
  kind: example
  title: Tính toán kích thước hàng đợi và thời gian quay vòng lệnh
  checks:
  - 5000 * 35 == 175000 and 175000 // 1000 == 175
  - -(-5000 // 28) == 179 and 28 * 179 >= 5000
  - 5000 * 2 == 10000
  steps:
  - show: '<p><b>Bước 1 — Tính số lượng bản tin đồng thời trong hàng đợi (Little''s
      Law)</b>:</p>

      <div class="box key">Định luật Little: $L = N \times W$.<br/>

      Với thông lượng $N = 5\,000$ lệnh/giây, thời gian phản hồi $W = 35$ ms $= 0{,}035$
      giây.<br/>

      Số bản tin trung bình đang chờ phản hồi trong hệ thống: $L = 5\,000 \times
      0{,}035 = 175$ bản tin (số liệu ví dụ minh họa).</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta tính số bản tin đang được xử lý đồng thời theo định luật Lít-tơn.
      Với lưu lượng giả định 5 nghìn lệnh mỗi giây và thời gian xử lý 35 mi li giây,
      trung bình có 175 bản tin đang chờ phản hồi. Đây là số giao dịch đang bay trong
      hệ thống, chưa phải là số kết nối cần mở.
  - clear: true
    show: '<p><b>Bước 2 — Số kết nối phụ thuộc mô hình gửi nhận</b>:</p>

      <table class="t">
        <tr><th>mô hình</th><th>công thức</th><th>kết quả (ví dụ minh họa)</th></tr>
        <tr><td>Mỗi kết nối xử lý tuần tự một lệnh</td><td>$5\,000 / 28$</td><td>$\approx 179$ kết nối (gần bằng $L = 175$)</td></tr>
        <tr><td>Request-Reply bất đồng bộ (CorrelationID)</td><td>nhiều bản tin chờ trên một kết nối</td><td>vài kết nối, chọn theo thông lượng đo được</td></tr>
      </table>'
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, số kết nối cần mở phụ thuộc vào mô hình gửi nhận. Nếu mỗi kết nối
      xử lý tuần tự 28 lệnh mỗi giây, ta cần khoảng 179 kết nối, xấp xỉ số bản tin
      đang chờ. Còn với mô hình bất đồng bộ dùng mã tương quan, một kết nối mang được
      nhiều bản tin cùng lúc nên chỉ cần vài kết nối, chọn theo thông lượng đo thực
      tế.
  - clear: true
    show: '<p><b>Bước 3 — Cấu hình hàng đợi vào và hàng đợi ra</b>:</p>

      <div class="box key">Tách biệt hoàn toàn hai hàng đợi độc lập: <code>T24.OFS.REQUEST</code>
      (vào) và <code>T24.OFS.REPLY</code> (ra). Dung lượng tối đa (ví dụ minh họa):
