  - clear: true
    show: '<p><b>Đọc trước</b> bốn chỗ lạ của mã sắp thứ tự:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>sorted([2, 1])</code></td><td>trả về danh sách mới xếp tăng dần; danh sách gốc không đổi</td><td><code>sorted([2, 1])</code> là <code>[1, 2]</code></td></tr><tr><td><code>a_can, b_can = sorted([1, 2]), sorted([2, 1])</code></td><td>gán một lúc hai tên: tên thứ nhất nhận giá trị thứ nhất, tên thứ hai nhận giá trị thứ hai</td><td>cả <code>a_can</code> và <code>b_can</code> đều là <code>[1, 2]</code></td></tr><tr><td><code>a_can[0]</code>, <code>a_can[1]</code></td><td>số trong ngoặc vuông là vị trí, đếm từ 0: phần tử đầu, phần tử thứ hai</td><td><code>a_can[0]</code> là 1, <code>a_can[1]</code> là 2</td></tr><tr><td><code>return "duoc"</code></td><td>trả về chữ "duoc" nghĩa là xin khoá thành công, hàm dừng ngay</td><td>tài khoản chưa ai giữ thì ra <code>"duoc"</code></td></tr></table>'
    say: Trước đoạn mã sắp thứ tự, ta đọc thêm bốn chỗ lạ. Hàm sắp xếp trả về danh sách mới xếp tăng dần và không đổi danh sách gốc. Dòng gán hai tên một lúc nhận hai danh sách đã sắp. Số trong ngoặc vuông là vị trí, đếm từ không. Lệnh trả về chữ thành công kết thúc hàm xin khoá.
    focus:
    - 0
