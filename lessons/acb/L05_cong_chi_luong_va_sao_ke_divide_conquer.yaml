- id: symbol
  kind: symbol
  title: Cú pháp Khoá hàng có thứ tự xác định trong Oracle PL/SQL
  steps:
  - clear: true
    show: |
      <p><b>Đọc trước</b> — bốn chỗ lạ trong thủ tục PL/SQL khoá hàng:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>FOR r IN (...) LOOP … END LOOP;</code></td><td>vòng lặp: với mỗi dòng của truy vấn trong ngoặc, gán dòng đó vào <code>r</code> rồi chạy các câu giữa <code>LOOP</code> và <code>END LOOP</code></td><td>truy vấn ra 3 dòng thì chạy 3 vòng</td></tr><tr><td><code>SELECT column_value AS acc FROM TABLE(p_acc_list)</code></td><td><code>TABLE</code> biến danh sách thành các dòng; <code>column_value</code> là cột của mỗi phần tử; <code>AS acc</code> đặt tên cột là <code>acc</code></td><td>danh sách <code>[7, 3]</code> thành hai dòng <code>7</code> và <code>3</code></td></tr><tr><td><code>ORDER BY 1</code></td><td>sắp các dòng theo cột thứ nhất, tăng dần</td><td><code>7, 3</code> thành <code>3, 7</code></td></tr><tr><td><code>SELECT balance INTO v_bal … WHERE account_no = r.acc FOR UPDATE;</code></td><td><code>INTO v_bal</code> bỏ số dư đọc được vào biến; <code>r.acc</code> là mã của vòng đang xét; <code>FOR UPDATE</code> khoá dòng đó</td><td>vòng một khoá tài khoản <code>3</code></td></tr></table>
    say: Trước khi đọc mã, ta học bốn chỗ lạ. Vòng lặp lấy từng dòng của truy vấn trong ngoặc, gán vào một tên rồi chạy các câu ở giữa. Dòng đầu biến danh sách thành các dòng của một bảng, cột được đặt tên gọn. Phần sắp xếp xếp các dòng tăng dần theo cột thứ nhất. Câu cuối đọc số dư bỏ vào một biến và khoá dòng đang xét.
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
    show: '<p><b>Thủ tục lưu trữ Oracle PL/SQL khoá hàng theo thứ tự xác định</b>:</p>

      <div class="box code"><code>FOR r IN (SELECT column_value AS acc<br/>

      &nbsp;&nbsp;FROM TABLE(p_acc_list) ORDER BY 1) LOOP<br/>

      &nbsp;&nbsp;SELECT balance INTO v_bal FROM accounts<br/>

      &nbsp;&nbsp;WHERE account_no = r.acc FOR UPDATE;<br/>

      END LOOP;</code></div>

            <div class="box key">Nguyên lý: sắp xếp danh sách mã tài khoản trước (chưa khoá
      gì), rồi khoá từng tài khoản bằng một câu lệnh riêng theo thứ tự tăng dần. Không
      dựa vào ORDER BY đi kèm FOR UPDATE, vì Oracle khoá dòng theo đường truy cập
      của kế hoạch thực thi, không bảo đảm theo thứ tự sắp xếp.</div>'
    focus: [0, 0, 0, 0]
    say: 'Đây là cách viết an toàn trong thủ tục lưu trữ Oracle, đoạn chương trình PL/SQL được lưu và chạy ngay bên trong cơ sở dữ liệu. Ta sắp mã tài khoản tăng dần trước khi khoá, rồi khoá từng tài khoản theo thứ tự đó. Mỗi vòng xét một mã, đọc số dư bỏ vào một biến, đồng thời khoá dòng vừa đọc. Khi mọi tiến trình khoá theo cùng thứ tự, không thể có vòng chờ.'
- id: example
  kind: example
  title: Minh họa cơ chế ngăn Deadlock và Kỹ thuật Divide-and-Conquer
  checks:
  - 1000 * 10 == 10000
  - 30 // 4 == 7 and 7 + 7 + 7 + 9 == 30
  - 10 + 5 == 15 and 15 - 3 == 12 and 12 + 2 == 14 and 14 - 1 == 13
  - 10 + (5 - 3 + 2 - 1) == 13
  - 150000000000 // 10000 == 15000000
  - 168 // 24 == 7 and 7 < 30
  - 10000 * 45 // 10 == 45000 and 10000 * 1 // 10 == 1000 and 45000 // 1000 == 45
  steps:
  - show: '<p><b>Bước 1 — Vì sao xảy ra Deadlock khi không sắp xếp thứ tự?</b>:</p>

      <div><svg width="1500" height="330" viewBox="0 0 1500 330"><defs><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="22" refY="12" orient="auto"><path d="M0,0 L24,12 L0,24 z" fill="#16a34a"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="22" refY="12" orient="auto"><path d="M0,0 L24,12 L0,24 z" fill="#dc2626"/></marker></defs><g font-size="22" fill="#1f2937" text-anchor="middle"><rect x="60" y="115" width="270" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="195" y="175" font-weight="bold">Tiến trình A</text><rect x="1170" y="115" width="270" height="100" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="1305" y="175" font-weight="bold">Tiến trình B</text><rect x="560" y="15" width="380" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="750" y="64" font-weight="bold">Khoá tài khoản 1</text><rect x="560" y="235" width="380" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="750" y="284" font-weight="bold">Khoá tài khoản 2</text><line x1="330" y1="135" x2="556" y2="70" stroke="#16a34a" stroke-width="5" marker-end="url(#mg)"/><text x="410" y="86" fill="#15803d" font-weight="bold">A giữ</text><line x1="1170" y1="195" x2="944" y2="260" stroke="#16a34a" stroke-width="5" marker-end="url(#mg)"/><text x="1090" y="262" fill="#15803d" font-weight="bold">B giữ</text><line x1="330" y1="195" x2="556" y2="260" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#mr)"/><text x="400" y="268" fill="#b91c1c" font-weight="bold">A xin, phải chờ</text><line x1="1170" y1="135" x2="944" y2="70" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#mr)"/><text x="1100" y="86" fill="#b91c1c" font-weight="bold">B xin, phải chờ</text></g></svg></div>
      <div class="box warn">A giữ khoá 1 và chờ khoá 2; B giữ khoá 2 và chờ khoá 1: A chờ B, B chờ A, không bên nào đi tiếp. Oracle phát hiện vòng chờ, huỷ câu lệnh đang chờ của một bên và báo lỗi <b>ORA-00060</b>.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: 'Bước một, ta xem nguyên nhân bế tắc khoá khi không sắp thứ tự. Tiến trình A giữ tài khoản một và chờ tài khoản hai. Cùng lúc đó, tiến trình B lại giữ tài khoản hai và chờ tài khoản một. Hai tiến trình sẽ chờ nhau mãi, nên Oracle phát hiện vòng chờ và huỷ câu lệnh đang chờ của một bên.'
  - clear: true
    show: "<p><b>Bước 2 — Thuật toán khoá hàng có thứ tự loại bỏ vòng lặp phụ thuộc</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>quy tắc khoá</th><th>hành vi của Tiến trình A</th><th>hành\
      \ vi của Tiến trình B</th></tr>\n  <tr><td>Thứ tự tăng dần</td><td>Bắt buộc\
      \ khoá Tài khoản 1 trước, Tài khoản 2 sau</td><td>Cũng phải khoá Tài khoản 1\
      \ trước, Tài khoản 2 sau</td></tr>\n  <tr><td>Kết quả vận hành</td><td>Tiến\
      \ trình A lấy được khoá Tài khoản 1 và hoàn tất</td><td>Tiến trình B xếp hàng\
      \ chờ A nhả khoá rồi mới đi tiếp</td></tr>\n</table>\n<div class=\"box key\"\
      >Không còn chu trình phụ thuộc chéo giữa các tiến trình cùng tuân thủ quy tắc\
      \ này.</div>"
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, ta áp dụng quy tắc khoá theo thứ tự tăng dần. Cả hai tiến trình
      đều phải xin khoá tài khoản một trước rồi mới đến tài khoản hai. Do đó, tiến
      trình đến sau xếp hàng chờ tiến trình trước hoàn tất.
  - clear: true
    show: |-
      <p><b>Bước 3 — Tối ưu hóa hiệu năng bằng Bulk Collect và Forall</b>:</p>
      <div class="box key">Thay vì gọi $10\,000$ lệnh cập nhật đơn lẻ làm tốn $10\,000$ lần chuyển đổi ngữ cảnh (Context Switch), ta gom thành mảng dữ liệu và cập nhật hàng loạt bằng <code>FORALL</code>.<br/>
      <code>BULK COLLECT</code>: đọc nhiều dòng vào một mảng (danh sách xếp liền nhau) trong một lần gọi; <code>FORALL</code>: gửi cả mảng lệnh cập nhật sang bộ máy SQL trong một lần. Mỗi lần mã PL/SQL gọi sang bộ máy SQL là một lần chuyển ngữ cảnh.<br/>
      Giả định minh họa (phải đo trên hệ thống thật): mỗi lệnh đơn lẻ tốn $4{,}5$ ms, còn trong lô chỉ $0{,}1$ ms mỗi lệnh. Với $10\,000$ lệnh ghi có: $10\,000 \times 4{,}5$ ms $= 45$ giây, so với $10\,000 \times 0{,}1$ ms $= 1$ giây.</div>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: 'Bước ba, ta tăng tốc bằng cách gom nhóm. Mỗi lần mã PL/SQL gọi sang bộ máy SQL là một lần chuyển ngữ cảnh tốn thời gian. Thay vì chạy mười nghìn câu lệnh riêng lẻ, thủ tục đọc các dòng vào một mảng, tức một danh sách xếp liền, và gửi cả mảng đi trong một lần. Giả định mỗi lệnh đơn lẻ tốn 4 phẩy 5 mi li giây, còn trong lô chỉ 0 phẩy 1, thì mười nghìn lệnh mất 45 giây so với một giây.'
  - clear: true
    show: |-
      <p><b>Bước 4 — Kỹ thuật Divide-and-Conquer trong Sao kê Tài khoản lớn</b>:</p>
      <div class="box key">Khách hàng yêu cầu sao kê $30$ ngày với hơn $1\,000\,000$ bản ghi giao dịch, đã được CDC chép sang Kafka (không quét bảng sổ cái chính).<br/>
      Hệ thống chia khoảng thời gian thành $4$ đoạn song song: $7 + 7 + 7 + 9 = 30$ ngày.<br/>
      Kafka Streams chia việc theo phân vùng (phân vùng là một ngăn dữ liệu xử lý độc lập; mỗi tiến trình nhận trọn một số phân vùng): mỗi giao dịch được gắn mã đoạn và ghi vào phân vùng của đoạn đó, nên bốn tiến trình, mỗi tiến trình giữ một phân vùng, xử lý bốn đoạn cùng lúc; ví dụ minh họa: đoạn 9 ngày chứa $1\,000\,000 \times 9 / 30 = 300\,000$ bản ghi nên chậm nhất; ở $100\,000$ bản ghi mỗi giây là xong trong khoảng $3$ giây (giả định bản ghi phân bố đều theo ngày).<br/>
      Điều kiện: Kafka phải giữ dữ liệu ít nhất $30$ ngày (mặc định chỉ $7$ ngày).</div>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Bước bốn, ta xuất sao kê hàng triệu giao dịch bằng kỹ thuật chia để trị. Dữ liệu đã được chép sang Kafka, nên ta không quét bảng sổ cái chính. Khoảng 30 ngày chia thành bốn đoạn dài 7, 7, 7 và 9 ngày, mỗi đoạn nằm trong một phân vùng riêng, tức một ngăn dữ liệu xử lý độc lập, nên bốn tiến trình chạy song song. Kafka phải giữ dữ liệu ít nhất 30 ngày, vì mặc định chỉ giữ 7 ngày. Đoạn chín ngày có 300 nghìn bản ghi nên chậm nhất, và với 100 nghìn bản ghi mỗi giây thì xong trong khoảng ba giây.'
  - clear: true
    show: '<p><b>Bước 5 — Ghép kết quả: số dư lũy kế cần số dư đầu của từng đoạn</b>:</p>

      <div class="box key">Mỗi đoạn trước hết chỉ tính <b>tổng phát sinh</b> của mình.
      Số dư đầu đoạn sau = số dư đầu kỳ + tổng phát sinh các đoạn trước.</div>

      <table class="t"> <tr><th>đoạn</th><th>số dư đầu đoạn (triệu)</th><th>tổng phát
      sinh (triệu)</th><th>số dư cuối đoạn</th></tr> <tr><td>1 (ngày 1–7)</td><td>$10$</td><td>$+5$</td><td>$15$</td></tr>
      <tr><td>2 (ngày 8–14)</td><td>$15$</td><td>$-3$</td><td>$12$</td></tr> <tr><td>3
      (ngày 15–21)</td><td>$12$</td><td>$+2$</td><td>$14$</td></tr> <tr><td>4 (ngày
      22–30)</td><td>$14$</td><td>$-1$</td><td>$13$</td></tr> </table>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Bước năm, số dư đầu đoạn sau phụ thuộc các đoạn trước, nên bốn đoạn không thể tự cộng dồn từ số không. Mỗi đoạn trước hết chỉ tính tổng phát sinh của mình. Với số dư đầu kỳ 10 triệu và tổng phát sinh cộng 5, trừ 3, cộng 2, trừ 1 triệu. Vậy số dư đầu đoạn hai là 15, đoạn ba là 12, đoạn bốn là 14, và cuối kỳ còn 13 triệu. Sau đó mỗi đoạn cộng dồn từng giao dịch từ số dư đầu đoạn của nó.'
- id: code
  kind: example
  title: 'Chạy thử bằng mã Python (mô phỏng): bảng khoá và số dư đầu đoạn'
  checks:
  - '{1: ''A'', 2: ''B''}.get(2) == ''B'' and {1: ''A'', 2: ''B''}.get(1) == ''A'''
  - sorted([2, 1]) == [1, 2]
  - '[10, 10 + 5, 10 + 5 - 3, 10 + 5 - 3 + 2] == [10, 15, 12, 14] and 10 + 5 - 3 +
    2 - 1 == 13'
  steps:
  - show: '<p><b>Đọc trước</b> bốn dòng lạ của mã bảng khoá ở khung sau (mô phỏng):</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>khoa = {}</code> và <code>khoa[tk] = ai</code></td><td><code>{}</code> là từ điển rỗng, một bảng ghi "khoá → tên"; dòng sau ghi thêm một mục</td><td><code>khoa[1] = "A"</code>: tài khoản 1 do A giữ</td></tr><tr><td><code>def lay(ai, tk):</code> và <code>return</code></td><td><code>def</code> đặt tên <code>lay</code> cho một đoạn lệnh nhận hai giá trị; <code>return</code> trả kết quả và dừng; dấu <code>+</code> nối hai chữ</td><td><code>"cho " + "B"</code> ra <code>"cho B"</code></td></tr><tr><td><code>if tk in khoa and khoa[tk] != ai:</code></td><td><code>tk in khoa</code>: tài khoản đã có người giữ; <code>!=</code>: khác; <code>and</code>: cả hai đúng mới chạy các dòng thụt vào</td><td>tài khoản 2 do B giữ, A xin: đúng, ra "cho B"</td></tr><tr><td><code>for ai, tk in (("A", 1), …):</code></td><td>lặp qua từng cặp (người, tài khoản); mỗi vòng gán hai giá trị của cặp vào hai tên</td><td>vòng một: <code>ai</code> = "A", <code>tk</code> = 1</td></tr></table>'
    say: Trước khi đọc mã, ta đọc bốn dòng lạ của nó. Dấu ngoặc nhọn rỗng là từ điển rỗng, một bảng ghi khoá và tên, rồi dòng sau ghi thêm một mục. Hàm nhận hai giá trị, lệnh trả về đưa kết quả ra rồi dừng, và dấu cộng nối hai chữ. Điều kiện hỏi tài khoản đã có người giữ và người giữ khác mình, cả hai đúng mới chạy các dòng thụt vào. Vòng lặp đi qua từng cặp gồm người và tài khoản.
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
    show: |-
      <p><b>Mô phỏng</b> (Oracle không chạy ở đây): A, B xin khoá <b>ngược thứ tự</b>; <code>khoa</code> ghi ai giữ tài khoản:</p><div class="code"><div>khoa = {}</div><div>def lay(ai, tk):</div><div>    if tk in khoa and khoa[tk] != ai:</div><div>        return "cho " + khoa[tk]</div><div>    khoa[tk] = ai</div><div>    return "duoc"</div><div>for ai, tk in (("A", 1), ("B", 2), ("A", 2), ("B", 1)):</div><div>    print(ai, "xin", tk, "-&gt;", lay(ai, tk))</div></div><p><b>Kết quả khi chạy</b></p><div class="code"><div>A xin 1 -&gt; duoc</div><div>B xin 2 -&gt; duoc</div><div>A xin 2 -&gt; cho B</div><div>B xin 1 -&gt; cho A</div></div>
    say: 'Đây là mô phỏng bằng ngôn ngữ Python, vì Oracle thật không chạy được trên máy của bạn. A xin tài khoản một và được, B xin tài khoản hai và được. Rồi A xin tài khoản hai thì phải chờ B, còn B xin tài khoản một thì phải chờ A. A chờ B và B chờ A, đó chính là vòng chờ khép kín mà Oracle báo bằng lỗi ORA không không không sáu không.'
    focus: [0, 0, 0, 0]
  - clear: true
    show: '<p><b>Đọc trước</b> cách kiểm vòng chờ bằng từ điển ai chờ ai:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>cho = {"A": "B", "B": "A"}</code></td><td>từ điển ghi ai đang chờ ai: mỗi mục là "người chờ": "người bị chờ"</td><td>A chờ B, và B chờ A</td></tr><tr><td><code>cho["A"]</code></td><td>lấy giá trị ứng với khoá "A" trong từ điển</td><td><code>cho["A"]</code> là <code>"B"</code></td></tr><tr><td><code>cho.get("B")</code></td><td>giống <code>cho["B"]</code>, nhưng nếu không có khoá thì trả về <code>None</code> (rỗng) thay vì báo lỗi</td><td><code>cho.get("B")</code> là <code>"A"</code>; <code>cho.get("Z")</code> là <code>None</code></td></tr><tr><td><code>cho.get(cho["A"]) == "A"</code></td><td>xem người mà A chờ (B) đang chờ ai; <code>==</code> hỏi có bằng "A" không</td><td>B chờ A: đúng, có vòng chờ</td></tr></table>'
    say: Để kiểm vòng chờ bằng mã, ta đọc bốn chỗ lạ. Từ điển ghi ai đang chờ ai, ở đây A chờ B và B chờ A. Dấu ngoặc vuông lấy giá trị ứng với một khoá. Lệnh lấy giá trị an toàn trả về rỗng thay vì báo lỗi khi không có khoá. Câu cuối xem người mà A chờ lại đang chờ ai, bằng A thì có vòng chờ.
    focus:
    - 0
