- id: symbol
  kind: symbol
  title: Cú pháp Khóa hàng có thứ tự xác định và Bulk Collect trong Oracle PL/SQL
  steps:
  - show: '<p><b>Thủ tục lưu trữ Oracle PL/SQL khóa hàng theo thứ tự xác định</b>:</p>

      <div class="box code"><code>FOR r IN (SELECT column_value AS acc<br/>

      &nbsp;&nbsp;FROM TABLE(p_acc_list) ORDER BY 1) LOOP<br/>

      &nbsp;&nbsp;SELECT balance INTO v_bal FROM accounts<br/>

      &nbsp;&nbsp;WHERE account_no = r.acc FOR UPDATE;<br/>

      END LOOP;</code></div>

      <div class="box key">Nguyên lý: sắp xếp danh sách mã tài khoản trước (chưa khóa gì),
      rồi khóa từng tài khoản bằng một câu lệnh riêng theo thứ tự tăng dần. Không dựa
      vào ORDER BY đi kèm FOR UPDATE, vì Oracle khóa dòng theo đường truy cập của kế
      hoạch thực thi, không bảo đảm theo thứ tự sắp xếp.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Đây là cách viết an toàn trong thủ tục lưu trữ Oracle. Ta sắp xếp danh sách
      mã tài khoản trước khi khóa bất cứ thứ gì, rồi khóa từng tài khoản bằng một câu
      lệnh riêng theo thứ tự tăng dần. Khi mọi luồng khóa theo cùng thứ tự, hai luồng
      không thể chờ đợi lẫn nhau thành vòng tròn.
- id: example
  kind: example
  title: Minh họa cơ chế ngăn Deadlock và Kỹ thuật Divide-and-Conquer
  checks:
  - 1000 * 10 == 10000
  - 30 // 4 == 7
  - 150000000000 // 10000 == 15000000
  steps:
  - show: '<p><b>Bước 1 — Vì sao xảy ra Deadlock khi không sắp xếp thứ tự?</b>:</p>

      <div class="box warn">Tiến trình A muốn chuyển tiền: Khóa Tài khoản 1, sau đó
      chờ khóa Tài khoản 2.<br/>

      Tiến trình B cũng chuyển tiền: Khóa Tài khoản 2, sau đó chờ khóa Tài khoản 1.<br/>

      Cả hai tiến trình giữ chặt tài nguyên của nhau mãi mãi, Oracle phát hiện vòng
      bế tắc và ném lỗi <b>ORA-00060</b>!</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước một, ta phân tích nguyên nhân gây ra bế tắc khóa khi không sắp xếp thứ
      tự. Tiến trình A giữ tài khoản một và chờ tài khoản hai. Cùng lúc đó, tiến trình
      B lại giữ tài khoản hai và chờ tài khoản một. Cả hai luồng chờ nhau vô tận khiến
      cơ sở dữ liệu phải huỷ giao dịch.
  - clear: true
    show: "<p><b>Bước 2 — Thuật toán khóa hàng có thứ tự loại bỏ vòng lặp phụ thuộc</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>quy tắc khóa</th><th>hành vi của Tiến trình A</th><th>hành\
      \ vi của Tiến trình B</th></tr>\n  <tr><td>Thứ tự tăng dần</td><td>Bắt buộc\
      \ khóa Tài khoản 1 trước, Tài khoản 2 sau</td><td>Cũng phải khóa Tài khoản 1\
      \ trước, Tài khoản 2 sau</td></tr>\n  <tr><td>Kết quả vận hành</td><td>Tiến\
      \ trình A lấy được khóa Tài khoản 1 và hoàn tất</td><td>Tiến trình B xếp hàng\
      \ chờ A nhả khóa rồi mới đi tiếp</td></tr>\n</table>\n<div class=\"box key\"\
      >Không còn chu trình phụ thuộc chéo giữa các tiến trình cùng tuân thủ quy tắc này.</div>"
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, ta áp dụng quy tắc khóa hàng có thứ tự tăng dần xác định. Cả hai
      tiến trình đều buộc phải xin khóa tài khoản một trước rồi mới đến tài khoản
      hai. Do đó, tiến trình đến sau sẽ kiên nhẫn xếp hàng chờ tiến trình trước hoàn
      tất.
  - clear: true
    show: '<p><b>Bước 3 — Tối ưu hóa hiệu năng bằng Bulk Collect và Forall</b>:</p>

      <div class="box key">Thay vì gọi $10\,000$ lệnh cập nhật đơn lẻ làm tốn $10\,000$
      lần chuyển đổi ngữ cảnh (Context Switch), ta gom thành mảng dữ liệu và cập nhật
      hàng loạt bằng <code>FORALL</code>.<br/>

      Ví dụ minh họa (phải đo trên hệ thống thật): thời gian trích nợ $10\,000$ tài
      khoản giảm từ $45$ giây xuống khoảng <b>$1$ giây</b>.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước ba, ta tối ưu hóa tốc độ bằng cơ chế gom nhóm và cập nhật hàng loạt.
      Thay vì chạy mười nghìn câu lệnh riêng lẻ, thủ tục gom toàn bộ vào một mảng
      duy nhất. Trong ví dụ minh họa, thời gian trích nợ mười nghìn tài khoản giảm
      từ 45 giây xuống khoảng một giây.
  - clear: true
    show: '<p><b>Bước 4 — Kỹ thuật Divide-and-Conquer trong Sao kê Tài khoản lớn</b>:</p>

      <div class="box key">Khách hàng yêu cầu sao kê $30$ ngày với hơn $1\,000\,000$
      bản ghi giao dịch.<br/>

      Hệ thống chia khoảng thời gian thành $4$ phân đoạn song song (mỗi tuần một đoạn).<br/>

      Bốn worker của Kafka Streams đọc dữ liệu từ các máy chủ đọc độc lập, tính toán
      số dư lũy kế và xuất kết quả trong khoảng $2.5$ giây (ví dụ minh họa).</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước bốn, ta giải quyết bài toán xuất sao kê hàng triệu giao dịch bằng kỹ
