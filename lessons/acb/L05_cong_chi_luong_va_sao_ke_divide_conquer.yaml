scenes:
- id: hook
  kind: hook
  title: Bài toán chi lương cho mười nghìn nhân viên cùng một lúc ngày cuối tháng
  steps:
  - show: '<p>Vào ngày cuối tháng, các tập đoàn lớn đồng loạt tải lên các lô chi
      lương hàng chục nghìn nhân viên.</p>

      <div class="box key">Vòng lặp tuần tự gọi từng tài khoản thì quá chậm; còn chạy
      song song mà khoá tài khoản lộn xộn thì dễ gặp bế tắc khoá Oracle ORA-00060.
      Làm sao chi trả toàn bộ thật nhanh (mục tiêu ví dụ: 3 phút) mà không sai một
      đồng?</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, vào ngày cuối tháng, các doanh nghiệp đồng loạt chi lương cho hàng
      chục nghìn nhân sự. Nếu dùng vòng lặp tuần tự để duyệt từng lệnh thì quá chậm,
      còn nếu chạy song song mà khoá tài khoản lộn xộn thì dễ gặp bế tắc khoá. Bế
      tắc khoá là khi hai tiến trình, mỗi bên giữ một khoá mà bên kia cần, rồi chờ
      nhau mãi. Trong Oracle, lỗi này mang mã ORA-00060. Ta cần một kiến trúc phân
      tán mạnh mẽ để xử lý an toàn.
  - clear: true
    show: "<table class=\"t\">\n  <tr><th>điểm nghẽn hệ thống</th><th>hậu quả nghiêm\
      \ trọng</th><th>giải pháp kiến trúc của kỹ sư cấp cao</th></tr>\n  <tr><td>Vòng lặp\
      \ duyệt tuần tự từng lệnh</td><td>Quá tải cổng mạng và chậm tiến độ chi lương</td><td>Mẫu\
      \ Transactional Outbox và xử lý theo lô</td></tr>\n  <tr><td>Khóa tài khoản\
      \ lộn xộn ngẫu nhiên</td><td>Xảy ra bế tắc khóa Oracle ORA-00060</td><td>Thuật\
      \ toán sắp xếp thứ tự tài khoản trước khi khóa</td></tr>\n  <tr><td>Truy vấn\
      \ sao kê hàng triệu giao dịch</td><td>Làm treo cơ sở dữ liệu sổ cái ngân hàng</td><td>Kỹ\
      \ thuật chia để trị: chia nhỏ khoảng thời gian rồi xử lý song song</td></tr>\n</table>\n<p>Hôm nay,\
      \ ta giải mã: <b>Mẫu Transactional Outbox</b>, <b>thuật toán khử bế tắc khóa\
      \ Oracle PL/SQL</b>, và <b>kỹ thuật chia để trị trong sao kê tài khoản</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá ba giải pháp then chốt cho khách hàng doanh
      nghiệp. Ta tìm hiểu mẫu thiết kế hộp thư giao dịch bảo đảm tính toàn vẹn. Ta
      nắm vững quy tắc ngăn bế tắc khóa trong cơ sở dữ liệu. Ta cũng làm
      chủ kỹ thuật chia để trị trong sao kê tài khoản.
- id: prereq
  kind: prereq
  title: 'Kiến thức nền: Lệnh chi theo lô, Transactional Outbox và bế tắc khoá trong Oracle'
  checks:
  - 10000 * 15000000 == 150000000000
  - 10000 // 1000 == 10
  steps:
  - show: "<p><b>Ba khái niệm cốt lõi trong xử lý giao dịch doanh nghiệp</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>khái niệm</th><th>ý nghĩa kỹ thuật</th><th>vai\
      \ trò trong ngân hàng</th></tr>\n  <tr><td>Batch Payroll</td><td>lô lệnh chi\
      \ lương gồm hàng chục nghìn lệnh con</td><td>thực hiện trích nợ công ty và ghi\
      \ có cho nhân viên</td></tr>\n  <tr><td>Transactional Outbox</td><td>ghi dữ\
      \ liệu nghiệp vụ và sự kiện trong cùng một giao dịch cơ sở dữ liệu</td><td>sự kiện chỉ được\
      \ phát khi dữ liệu đã ghi; ứng dụng sập giữa chừng cũng không mất sự kiện</td></tr>\n\
      \  <tr><td>Lỗi ORA-00060</td><td>hai tiến trình cùng chờ khóa tài nguyên của\
      \ nhau</td><td>Oracle huỷ câu lệnh đang chờ của một bên để phá vòng; ứng dụng\
      \ phải bắt lỗi và làm lại</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu ba khái niệm cốt lõi trong thanh toán doanh nghiệp.
      Chi lương theo lô là tập hợp hàng chục nghìn lệnh con được xử lý đồng thời.
      Mẫu hộp thư giao dịch ghi lệnh nghiệp vụ và sự kiện cần phát vào cùng một giao
      dịch cơ sở dữ liệu, nên hoặc cả hai cùng được ghi, hoặc không cái nào được
      ghi. Lỗi ORA không không không sáu không là sự cố bế tắc khóa kinh điển cần
      phòng tránh. Khi gặp lỗi này, Oracle huỷ câu lệnh đang chờ của một bên để phá
      vòng chờ, và ứng dụng phải bắt lỗi rồi làm lại.
  - clear: true
    show: '<p><b>Các công cụ và hệ thống sẽ gặp trong bài</b>:</p>

      <table class="t"><tr><th>tên</th><th>nghĩa bằng lời thường</th></tr>

      <tr><td>Kafka</td><td>hàng đợi sự kiện: chương trình này ghi sự kiện vào, chương
      trình khác đọc ra theo đúng thứ tự; sự kiện được lưu lại nên đọc lại được</td></tr>

      <tr><td>Kafka Streams</td><td>thư viện để viết chương trình đọc sự kiện từ Kafka,
      tính toán (cộng dồn, gộp) rồi ghi kết quả ra</td></tr>

      <tr><td>CDC (Debezium)</td><td>bắt thay đổi dữ liệu: đọc nhật ký thay đổi của
      cơ sở dữ liệu, biến mỗi dòng mới thành một sự kiện trên Kafka</td></tr>

      <tr><td>Core Banking, NAPAS</td><td>Core Banking: hệ thống lõi giữ sổ tài khoản
      của ngân hàng; NAPAS: đơn vị chuyển mạch nối các ngân hàng Việt Nam để chuyển
      tiền liên ngân hàng</td></tr></table>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bài này còn dùng vài tên công cụ, nên ta giải nghĩa luôn từ đầu. Kafka là
      một hàng đợi sự kiện, chương trình này ghi sự kiện vào, chương trình khác đọc
      ra theo đúng thứ tự, và sự kiện được lưu lại nên đọc lại được. Kafka Streams
      là thư viện để viết chương trình đọc sự kiện từ Kafka, tính toán như cộng dồn
      hay gộp, rồi ghi kết quả ra. Công cụ bắt thay đổi dữ liệu đọc nhật ký thay đổi
      của cơ sở dữ liệu, và biến mỗi dòng mới thành một sự kiện trên Kafka. Core Banking
      là hệ thống lõi giữ sổ tài khoản của ngân hàng, còn NAPAS là đơn vị chuyển mạch
      nối các ngân hàng Việt Nam để chuyển tiền liên ngân hàng.
  - clear: true
    show: '<div class="box key">Quy mô bài toán (số minh hoạ): Một tập đoàn có $10\,000$
      nhân viên, mức lương bình quân $15$ triệu đồng.<br/>

      Tổng số tiền giải ngân một đợt: $10\,000 \times 15\,000\,000 = 150$ tỉ đồng.<br/>

      Hệ thống chia lô thành $10$ khối nhỏ, mỗi khối $1\,000$ giao dịch để xử lý song
      song trên Kafka.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Ta xét một bài toán của doanh nghiệp lớn, với số minh hoạ. Với mười nghìn nhân viên,
      tổng số tiền chi lương lên tới 150 tỉ đồng. Để xử lý hiệu quả, hệ thống băm
      nhỏ lô thành mười khối song song trên hàng đợi sự kiện.
