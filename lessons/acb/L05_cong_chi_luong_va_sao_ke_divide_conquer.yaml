      \ lặp gọi qua mạng cho từng người</td><td>Treo luồng mạng và mất hàng giờ để chi lương</td><td>Dùng\
      \ Transactional Outbox và xử lý theo lô</td></tr>\n  <tr><td>Khóa tài nguyên\
      \ không có thứ tự</td><td>Gây bế tắc khóa Deadlock ORA-00060 trong cơ sở dữ liệu</td><td>Sắp\
      \ xếp tài khoản tăng dần trước khi khóa hàng</td></tr>\n  <tr><td>Truy vấn quét\
      \ cạn vào bảng chính của Core Banking</td><td>Làm sập hệ thống hạch toán trực tuyến của\
      \ ngân hàng</td><td>Chia để trị trên dữ liệu đã chép sang Kafka hoặc bản sao\
      \ chỉ đọc (read replica)</td></tr>\n\
      </table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Có ba sai lầm chí mạng cần tránh khi xây dựng cổng chi lương. Thứ nhất là
      gọi mạng tuần tự từng người gây chậm trễ nghiêm trọng. Thứ hai là khóa dữ liệu
      không theo thứ tự gây bế tắc cơ sở dữ liệu. Thứ ba là truy vấn sao kê trực tiếp
      vào sổ cái chính thay vì dùng kỹ thuật chia để trị.
- id: quiz
  kind: quiz
  title: Thử thách kiến trúc xử lý dữ liệu lớn tại ACB
  checks:
  - 60 - 60 == 0
  - 1000 * 2 == 2000
  steps:
  - pause: 15
    show: "<p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong cơ sở dữ liệu Oracle, tại\
      \ sao việc mọi giao dịch chuyển tiền khóa tài khoản theo cùng một thứ tự tăng dần\
      \ lại ngăn được lỗi Deadlock ORA-00060 giữa chúng?</p>\n<ul>\n  <li><b>A</b>: Vì\
      \ mọi giao dịch đều xin khóa tài nguyên theo cùng một thứ tự định sẵn, nên\
      \ không thể hình thành chu trình phụ thuộc lẫn nhau.</li>\n  <li><b>B</b>:\
      \ Vì lệnh ORDER BY tự động tắt tính năng khóa của Oracle.</li>\n  <li><b>C</b>:\
      \ Vì tài khoản sắp xếp trước sẽ được miễn phí giao dịch.</li>\n  <li><b>D</b>:\
      \ Vì Oracle chỉ cho phép một người dùng kết nối tại một thời điểm.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Hãy cùng bước vào một câu hỏi luyện tập về bế tắc khoá. Tại sao
      việc khóa tài khoản theo cùng một thứ tự lại ngăn được lỗi bế tắc khóa? Bạn có 15 giây suy nghĩ trước khi nghe đáp án chuẩn xác.
  - clear: true
    show: '<div class="box key"><b>Đáp án chính xác là A</b>!</div>

      <p><b>Bước 1 — Điều kiện hình thành Deadlock</b>:</p>

      <p>Deadlock chỉ xảy ra khi có chu trình chờ đợi tài nguyên khép kín giữa hai
      hay nhiều giao dịch đồng thời.</p>'
    focus:
    - 0
    - 0
    say: Đáp án chính xác là phương án A. Bước một, bế tắc khóa chỉ xảy ra khi tồn
      tại một chu trình chờ đợi tài nguyên khép kín giữa các giao dịch.
  - clear: true
    show: '<p><b>Bước 2 — Cơ chế phá vỡ chu trình phụ thuộc</b>:</p>

      <div class="box key">Khi toàn bộ các tiến trình cùng tuân thủ quy tắc khóa theo
      thứ tự tăng dần, đồ thị chờ đợi tài nguyên giữa chúng không có chu trình khép
      kín. Do đó, Deadlock giữa các giao dịch này không xảy ra (các luồng khác không
      tuân thủ quy tắc vẫn có thể gây Deadlock).</div>'
    focus:
    - 0
    - 0
    say: Bước hai, khi mọi tiến trình đều khóa tài khoản theo thứ tự tăng dần, đồ
      thị chờ đợi sẽ không có vòng tròn lặp lại. Nhờ vậy, bế tắc khóa giữa các giao
      dịch đó không xảy ra.
- id: recap
  kind: recap
  title: Tổng kết chuỗi logic Cổng Chi lương và Sao kê Divide-and-Conquer
  steps:
