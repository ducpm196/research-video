      tk in khoa and khoa[tk] != ai:</div><div>        return "cho " + khoa[tk]</div><div>    khoa[tk]
      = ai</div><div>    return "duoc"</div><div>a_can, b_can = sorted([1, 2]), sorted([2,
      1])</div><div>for ai, tk in (("A", a_can[0]), ("B", b_can[0]), ("A", a_can[1])):</div><div>    print(ai,
      "xin", tk, "-&gt;", lay(ai, tk))</div></div><p><b>Kết quả khi chạy</b></p><div
