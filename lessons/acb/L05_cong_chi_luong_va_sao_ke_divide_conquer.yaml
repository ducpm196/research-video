    show: |
      <p><b>Đọc trước</b> — bốn dòng lạ trong mã ghép số dư đầu đoạn:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>so_du = 10</code></td><td>gán số 10 vào tên <code>so_du</code></td><td><code>so_du</code> giữ 10 triệu</td></tr><tr><td><code>dau = []</code></td><td>ngoặc vuông rỗng là danh sách trống, chưa có phần tử nào</td><td><code>dau</code> là <code>[]</code></td></tr><tr><td><code>for phat_sinh in [5, -3, 2, -1]:</code></td><td>vòng lặp lấy lần lượt từng số trong danh sách, gán vào <code>phat_sinh</code>, rồi chạy các dòng thụt vào</td><td>vòng một <code>phat_sinh</code> là 5</td></tr><tr><td><code>dau.append(so_du)</code></td><td><code>append</code> thêm giá trị vào cuối danh sách</td><td>thêm 10 thì <code>dau</code> là <code>[10]</code></td></tr></table>
    say: Trước đoạn ghép số dư, ta đọc bốn dòng lạ. Dòng đầu gán số dư đầu kỳ. Ngoặc vuông rỗng là danh sách trống để chứa số dư đầu đoạn. Vòng lặp lấy lần lượt từng tổng phát sinh. Lệnh thêm đặt số dư hiện có vào cuối danh sách.
