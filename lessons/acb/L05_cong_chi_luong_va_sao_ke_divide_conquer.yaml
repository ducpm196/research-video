objectives:
- 'Mô tả mẫu Transactional Outbox: ghi nghiệp vụ và sự kiện trong một giao dịch rồi
  bắt thay đổi đẩy sang Kafka'
- Chạy mô phỏng bảng khoá để thấy hai tiến trình xin khoá ngược thứ tự chờ nhau thành
  vòng, còn xin theo thứ tự tăng dần thì không
- Đọc thủ tục khoá hàng có thứ tự trong PL/SQL và nêu vì sao Oracle báo ORA-00060
- 'Tính tiết kiệm của gom nhóm: số lần chuyển ngữ cảnh khi cập nhật từng dòng và khi
  dùng FORALL'
- Chia khoảng sao kê thành đoạn, tính tổng phát sinh từng đoạn rồi ghép số dư đầu
  đoạn
- 'Chọn cách khởi động lại lô khi mất điện giữa chừng: chỉ làm lệnh chưa hoàn tất,
  tra soát lệnh dở'
- 'Nhận ra ba sai lầm: gọi mạng tuần tự từng người, khoá không thứ tự, quét cạn bảng
  chính để lập sao kê'
- 'So sánh ×1, ×100 và ×10 000: số lệnh, thời gian tuần tự và theo khối, chỗ nghẽn
  khi mọi lệnh trừ cùng một tài khoản'
- Viết mã Python sắp thứ tự khoá, kiểm vòng chờ và ghép số dư đầu đoạn với số mới
