- id: quiz
  kind: quiz
  title: Thử thách kiến trúc xử lý dữ liệu lớn tại ACB
  checks:
  - 60 - 60 == 0
  - 1000 * 2 == 2000
  steps:
  - pause: 15
    show: |-
      <p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong cơ sở dữ liệu Oracle, tại sao việc mọi giao dịch chuyển tiền khoá tài khoản theo cùng một thứ tự tăng dần lại ngăn được lỗi Deadlock ORA-00060 giữa chúng?</p>
      <ul>
        <li><b>A</b>: Vì lệnh ORDER BY khiến Oracle tự động bỏ qua việc khoá dòng khi đọc dữ liệu của tài khoản.</li>
        <li><b>B</b>: Vì mọi giao dịch xin khoá theo cùng một thứ tự, nên không thể có vòng chờ khép kín giữa chúng.</li>
        <li><b>C</b>: Vì tài khoản được sắp xếp trước sẽ luôn được Oracle ưu tiên nhả khoá sớm hơn các tài khoản khác.</li>
        <li><b>D</b>: Vì Oracle chỉ cho phép một người dùng kết nối tại một thời điểm trên mỗi tài khoản ngân hàng.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
    say: Hãy cùng bước vào một câu hỏi luyện tập về bế tắc khoá. Tại sao việc khoá
      tài khoản theo cùng một thứ tự lại ngăn được lỗi bế tắc khoá? Bạn có 15 giây
      suy nghĩ trước khi nghe đáp án chuẩn xác.
  - clear: true
    show: '<div class="box key"><b>Đáp án chính xác là B</b>!</div>

      <p><b>Bước 1 — Điều kiện hình thành Deadlock</b>:</p>

      <p>Deadlock chỉ xảy ra khi có chu trình chờ đợi tài nguyên khép kín giữa hai
      hay nhiều giao dịch đồng thời.</p>'
    focus:
    - 0
    - 0
    say: Đáp án chính xác là phương án B. Bước một, bế tắc khoá chỉ xảy ra khi tồn
      tại một chu trình chờ đợi tài nguyên khép kín giữa các giao dịch.
  - clear: true
    show: '<p><b>Bước 2 — Cơ chế phá vỡ chu trình phụ thuộc</b>:</p>

      <div class="box key">Khi toàn bộ các tiến trình cùng tuân thủ quy tắc khoá theo
      thứ tự tăng dần, đồ thị chờ đợi tài nguyên giữa chúng không có chu trình khép
      kín. Do đó, Deadlock giữa các giao dịch này không xảy ra (các luồng khác không
      tuân thủ quy tắc vẫn có thể gây Deadlock).</div>'
    focus:
    - 0
    - 0
    say: Bước hai, khi mọi tiến trình đều khoá tài khoản theo thứ tự tăng dần, đồ
      thị chờ đợi, tức hình vẽ ai đang chờ ai, sẽ không có vòng tròn khép kín. Nhờ
      vậy, bế tắc khoá giữa các giao dịch đó không xảy ra.
