- id: check
  kind: check
  title: Kiểm tra xử lý tình huống mất mạng giữa chừng khi đang chạy lô chi lương
  checks:
  - 10000 - 9999 == 1
  - 100 > 50
  steps:
  - show: "<p><b>Tình huống phỏng vấn</b>: Khi đang thực hiện chi lương đến nhân viên\
      \ thứ 5 000 thì máy chủ bị mất điện đột ngột. Bạn làm thế nào để khi khởi động\
      \ lại không bị chi trùng tiền cho 5 000 người đầu tiên?</p>\n<table class=\"\
      t\">\n  <tr><th>cách xử lý sơ cấp</th><th>hậu quả</th><th>giải pháp của kỹ sư cấp cao</th></tr>\n\
      \  <tr><td>Chạy lại toàn bộ danh sách từ đầu</td><td>Nhân viên nhận lương 2 lần</td><td>Dựa vào bảng Outbox và\
      \ khoá chống trùng (Idempotency Key: mã riêng của mỗi lệnh con, gặp lại mã đã\
      \ xử lý thì bỏ qua)</td></tr>\n  <tr><td>Chạy lại cả lệnh đã gửi thành công</td><td>Chi trùng, thất thoát hàng tỉ đồng</td><td>Chỉ\
      \ xử lý các bản ghi có trạng thái chờ xử lý (PENDING)</td></tr>\n  <tr><td>Đoán\
      \ đã chi tới đâu rồi chạy tiếp</td><td>Chi thiếu hoặc chi trùng</td><td>Tiếp tục xử lý từ nhân viên thứ 5 001 một\
      \ cách an toàn</td></tr>\n</table>"
    focus: [0, 0]
    say: 'Ta kiểm tra tình huống thực tế khi máy chủ gặp sự cố giữa chừng lúc đang chi lương. Do năm nghìn người đầu tiên đã được nhận tiền, việc chạy lại toàn bộ danh sách từ đầu sẽ khiến nhân viên nhận lương hai lần.'
  - clear: true
    show: '<div class="box key"><b>Quy tắc đảm bảo tính duy nhất</b>: Mỗi lệnh con
      trong bảng Outbox đều được gắn khoá duy nhất gồm mã lô và số thứ tự dòng trong
      lô (một nhân viên có thể có hai dòng, ví dụ lương và thưởng). Khi máy chủ khởi
      động lại, tiến trình chỉ quét các bản ghi chưa hoàn tất. Các giao dịch đã thành
      công sẽ tự động được bỏ qua, không chi lương hai lần.<br/>

      Lệnh đang dở lúc mất điện (đã gửi đi nhưng chưa ghi kết quả) được coi là nghi
      vấn: tra soát trước, không gửi lại ngay.</div>'
    focus:
    - 0
    - 0
    - 0
    say: 'Do đó, hệ thống luôn gán khoá duy nhất cho từng lệnh con trong bảng hộp thư giao dịch, gồm mã lô và số thứ tự dòng. Khi khởi động lại, tiến trình chỉ quét các bản ghi đang chờ xử lý. Riêng lệnh đang dở lúc mất điện, tức đã gửi đi mà chưa ghi kết quả, phải được tra soát trước khi quyết định gửi lại.'
- id: pitfall
  kind: pitfall
  title: Ba sai lầm nghiêm trọng trong kiến trúc xử lý thanh toán theo lô
  steps:
  - show: |-
      <table class="t">
        <tr><th>sai lầm sơ cấp</th><th>hậu quả kỹ thuật & tài chính</th><th>giải pháp của kỹ sư cấp cao</th></tr>
        <tr><td>Duyệt vòng lặp gọi qua mạng cho từng người</td><td>Chương trình đứng chờ mạng từng lệnh và mất hàng giờ khi lô lên tới hàng triệu lệnh</td><td>Dùng Transactional Outbox và xử lý theo lô</td></tr>
        <tr><td>Khoá tài nguyên không có thứ tự</td><td>Gây bế tắc khoá Deadlock ORA-00060 trong cơ sở dữ liệu</td><td>Sắp xếp tài khoản tăng dần trước khi khoá hàng</td></tr>
        <tr><td>Truy vấn quét cạn vào bảng chính của Core Banking</td><td>Làm sập hệ thống hạch toán trực tuyến của ngân hàng</td><td>Chia để trị trên dữ liệu đã chép sang Kafka hoặc bản sao chỉ đọc (read replica)</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Có ba sai lầm chí mạng cần tránh khi xây dựng cổng chi lương. Thứ nhất là
      gọi mạng tuần tự từng người gây chậm trễ nghiêm trọng. Thứ hai là khoá dữ liệu
      không theo thứ tự gây bế tắc cơ sở dữ liệu. Thứ ba là truy vấn sao kê trực tiếp
      vào sổ cái chính thay vì dùng kỹ thuật chia để trị.
- id: quymo
  kind: example
  title: 'Quy mô và thời gian: chi lương và sao kê ở ×1, ×100 và ×10 000 (số minh
    hoạ)'
  checks:
  - 100 * 5 / 1000 == 0.5 and 10000 * 5 // 1000 == 50 and 1000000 * 5 // 1000 == 5000
    and 5000 // 60 == 83
  - 10000 // 10 * 5 // 1000 == 5 and 1000000 // 100 * 5 // 1000 == 50
  - 10000 / 100000 == 0.1 and 1000000 // 100000 == 10 and 1000000 * 9 // 30 / 100000 ==
    3.0 and 100000000 // 100000 == 1000 and 1000 // 100 == 10
  - 10000 * 15000000 == 150000000000
  - round(100000000 / 30 / 100000, 1) == 33.3 and 5000000 // 60 > 0
  steps:
  - show: '<p>Mỗi lệnh gọi mạng tuần tự mất $5$ ms (số minh hoạ); lô chia thành các
      khối chạy song song:</p><table class="t"><tr><th>cỡ</th><th>lệnh chi lương</th><th>tuần
      tự (5 ms mỗi lệnh)</th><th>số khối song song</th><th>mỗi khối làm</th></tr><tr><td>×1</td><td>100</td><td>0,5
      giây</td><td>1</td><td>0,5 giây</td></tr><tr><td>×100</td><td>10&nbsp;000</td><td>50
      giây</td><td>10</td><td>5 giây</td></tr><tr><td>×10&nbsp;000</td><td>1&nbsp;000&nbsp;000</td><td>5&nbsp;000
      giây (khoảng 83 phút)</td><td>100</td><td>50 giây</td></tr></table><p class="note">Mục tiêu ví dụ 3 phút = 180 giây: tuần tự một triệu lệnh vượt xa, chia 100 khối thì 50 giây đạt. Tuần
      tự: $1\,000\,000 \times 5$ ms $= 5\,000$ giây; chia $100$ khối thì mỗi khối
      $10\,000 \times 5$ ms $= 50$ giây.</p>'
    say: 'Ta tăng số lệnh chi lương, với số minh hoạ mỗi lệnh gọi mạng mất 5 mi li giây. Ở cỡ một, 100 lệnh, làm tuần tự mất nửa giây nên không cần chia. Ở cỡ một trăm, 10 nghìn lệnh, tuần tự mất 50 giây, chia mười khối thì mỗi khối còn năm giây. Ở cỡ mười nghìn, một triệu lệnh, tuần tự mất 5 nghìn giây, tức khoảng 83 phút, vượt xa mục tiêu ví dụ ba phút, tức 180 giây. Chia 100 khối thì còn 50 giây, đạt mục tiêu.'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
  - show: '<p>Sao kê: một tiến trình đọc $100\,000$ bản ghi mỗi giây (số minh hoạ);
      chia đoạn song song:</p><table class="t"><tr><th>cỡ</th><th>bản ghi sao kê</th><th>một
      tiến trình (100 000 bản ghi mỗi giây)</th><th>số đoạn song song</th><th>thời
      gian</th></tr><tr><td>×1</td><td>10&nbsp;000</td><td>0,1 giây</td><td>1</td><td>0,1
      giây</td></tr><tr><td>×100</td><td>1&nbsp;000&nbsp;000</td><td>10 giây</td><td>4</td><td>3 giây
      (đoạn 9 ngày, 300&nbsp;000 bản ghi)</td></tr><tr><td>×10&nbsp;000</td><td>100&nbsp;000&nbsp;000</td><td>1&nbsp;000
      giây</td><td>100 (chia đều số bản ghi)</td><td>10 giây</td></tr></table><p class="note">$100\,000\,000
      / 100\,000 = 1\,000$ giây; chia $100$ đoạn đều số bản ghi còn $10$ giây; còn chia theo ngày thì tối đa $30$ đoạn, mỗi đoạn
      hơn $3{,}3$ triệu bản ghi: $100\,000\,000 / 30 / 100\,000 \approx 33{,}3$ giây. Cỡ ×100: đoạn 9 ngày
      có $300\,000$ bản ghi, tức $3$ giây (chia đều số bản ghi thì $2{,}5$ giây).</p>'
    say: 'Với sao kê, một tiến trình đọc 100 nghìn bản ghi mỗi giây. Ở cỡ một trăm, một triệu bản ghi mất 10 giây, chia bốn đoạn theo ngày 7, 7, 7, 9 thì đoạn chín ngày có 300 nghìn bản ghi nên còn ba giây. Ở cỡ mười nghìn, một trăm triệu bản ghi mất 1000 giây, chia đều thành 100 đoạn thì còn 10 giây, còn chia theo ngày tối đa 30 đoạn thì mất khoảng 33 giây. Số đoạn không vượt số phân vùng Kafka, và ghép số dư vẫn tuần tự, nên chia quá nhỏ không còn lợi.'
    focus:
