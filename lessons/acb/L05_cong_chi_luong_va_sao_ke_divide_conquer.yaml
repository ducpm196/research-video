      \ lưu vết giao dịch</td><td>Mẫu Transactional Outbox lưu giữ trạng thái bền\
      \ vững</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bảng tổng hợp làm rõ ba thách thức lớn và giải pháp tương ứng. Ta ngăn lỗi
      bế tắc khóa bằng quy tắc khóa tài khoản theo thứ tự tăng dần. Ta tránh quét
      cơ sở dữ liệu chính bằng cách đọc dữ liệu đã chép sang Kafka và chia theo
      đoạn thời gian. Ta bảo vệ toàn vẹn
      dữ liệu bằng mẫu hộp thư giao dịch lưu vết bền vững.
- id: symbol
  kind: symbol
  title: Cú pháp Khóa hàng có thứ tự xác định và Bulk Collect trong Oracle PL/SQL
  steps:
  - show: '<p><b>Thủ tục lưu trữ Oracle PL/SQL khóa hàng theo thứ tự xác định</b>:</p>

      <div class="box code"><code>FOR r IN (SELECT column_value AS acc<br/>

      &nbsp;&nbsp;FROM TABLE(p_acc_list) ORDER BY 1) LOOP<br/>

      &nbsp;&nbsp;SELECT balance INTO v_bal FROM accounts<br/>

      &nbsp;&nbsp;WHERE account_no = r.acc FOR UPDATE;<br/>

      END LOOP;</code></div>

      <div class="box key">Nguyên lý: sắp xếp danh sách mã tài khoản trước (chưa khóa gì),
      rồi khóa từng tài khoản bằng một câu lệnh riêng theo thứ tự tăng dần. Không dựa
      vào ORDER BY đi kèm FOR UPDATE, vì Oracle khóa dòng theo đường truy cập của kế
      hoạch thực thi, không bảo đảm theo thứ tự sắp xếp.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Đây là cách viết an toàn trong thủ tục lưu trữ Oracle. Thủ tục lưu trữ là
      đoạn chương trình PL/SQL được lưu và chạy ngay bên trong cơ sở dữ liệu. Ta sắp xếp danh sách
      mã tài khoản trước khi khóa bất cứ thứ gì, rồi khóa từng tài khoản bằng một câu
      lệnh riêng theo thứ tự tăng dần. Khi mọi luồng khóa theo cùng thứ tự, hai luồng
      không thể chờ đợi lẫn nhau thành vòng tròn.
- id: example
  kind: example
  title: Minh họa cơ chế ngăn Deadlock và Kỹ thuật Divide-and-Conquer
  checks:
  - 1000 * 10 == 10000
  - 30 // 4 == 7 and 7 + 7 + 7 + 9 == 30
  - 10 + 5 == 15 and 15 - 3 == 12 and 12 + 2 == 14 and 14 - 1 == 13
  - 10 + (5 - 3 + 2 - 1) == 13
  - 150000000000 // 10000 == 15000000
  steps:
  - show: '<p><b>Bước 1 — Vì sao xảy ra Deadlock khi không sắp xếp thứ tự?</b>:</p>

      <div class="box warn">Tiến trình A muốn chuyển tiền: Khóa Tài khoản 1, sau đó
      chờ khóa Tài khoản 2.<br/>

      Tiến trình B cũng chuyển tiền: Khóa Tài khoản 2, sau đó chờ khóa Tài khoản 1.<br/>

      Nếu không ai can thiệp, hai tiến trình chờ nhau mãi. Oracle phát hiện vòng chờ,
      huỷ câu lệnh đang chờ của một bên và báo lỗi <b>ORA-00060</b>!</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước một, ta phân tích nguyên nhân gây ra bế tắc khóa khi không sắp xếp thứ
      tự. Tiến trình A giữ tài khoản một và chờ tài khoản hai. Cùng lúc đó, tiến trình
      B lại giữ tài khoản hai và chờ tài khoản một. Hai luồng sẽ chờ nhau mãi, nên
      Oracle phát hiện vòng chờ và huỷ câu lệnh đang chờ của một bên.
  - clear: true
    show: "<p><b>Bước 2 — Thuật toán khóa hàng có thứ tự loại bỏ vòng lặp phụ thuộc</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>quy tắc khóa</th><th>hành vi của Tiến trình A</th><th>hành\
      \ vi của Tiến trình B</th></tr>\n  <tr><td>Thứ tự tăng dần</td><td>Bắt buộc\
      \ khóa Tài khoản 1 trước, Tài khoản 2 sau</td><td>Cũng phải khóa Tài khoản 1\
      \ trước, Tài khoản 2 sau</td></tr>\n  <tr><td>Kết quả vận hành</td><td>Tiến\
      \ trình A lấy được khóa Tài khoản 1 và hoàn tất</td><td>Tiến trình B xếp hàng\
      \ chờ A nhả khóa rồi mới đi tiếp</td></tr>\n</table>\n<div class=\"box key\"\
      >Không còn chu trình phụ thuộc chéo giữa các tiến trình cùng tuân thủ quy tắc này.</div>"
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, ta áp dụng quy tắc khóa hàng có thứ tự tăng dần xác định. Cả hai
      tiến trình đều buộc phải xin khóa tài khoản một trước rồi mới đến tài khoản
      hai. Do đó, tiến trình đến sau sẽ kiên nhẫn xếp hàng chờ tiến trình trước hoàn
      tất.
  - clear: true
    show: '<p><b>Bước 3 — Tối ưu hóa hiệu năng bằng Bulk Collect và Forall</b>:</p>

      <div class="box key">Thay vì gọi $10\,000$ lệnh cập nhật đơn lẻ làm tốn $10\,000$
      lần chuyển đổi ngữ cảnh (Context Switch), ta gom thành mảng dữ liệu và cập nhật
      hàng loạt bằng <code>FORALL</code>.<br/>

      <code>BULK COLLECT</code>: đọc nhiều dòng vào một mảng trong một lần gọi;
      <code>FORALL</code>: gửi cả mảng lệnh cập nhật sang bộ máy SQL trong một lần.
      Mỗi lần mã PL/SQL gọi sang bộ máy SQL là một lần chuyển ngữ cảnh.<br/>

      Ví dụ minh họa (phải đo trên hệ thống thật): thời gian trích nợ $10\,000$ tài
      khoản giảm từ $45$ giây xuống khoảng <b>$1$ giây</b>.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước ba, ta tối ưu hóa tốc độ bằng cơ chế gom nhóm và cập nhật hàng loạt.
      Mỗi lần mã PL/SQL gọi sang bộ máy SQL là một lần chuyển ngữ cảnh tốn thời gian.
      Thay vì chạy mười nghìn câu lệnh riêng lẻ, thủ tục đọc các dòng vào một mảng
      và gửi cả mảng lệnh cập nhật đi trong một lần. Trong ví dụ minh họa, thời gian trích nợ mười nghìn tài khoản giảm
      từ 45 giây xuống khoảng một giây.
  - clear: true
    show: '<p><b>Bước 4 — Kỹ thuật Divide-and-Conquer trong Sao kê Tài khoản lớn</b>:</p>

      <div class="box key">Khách hàng yêu cầu sao kê $30$ ngày với hơn $1\,000\,000$
      bản ghi giao dịch, đã được CDC chép sang Kafka (không quét bảng sổ cái chính).<br/>

      Hệ thống chia khoảng thời gian thành $4$ đoạn song song: $7 + 7 + 7 + 9 = 30$
      ngày.<br/>

      Bốn tiến trình Kafka Streams xử lý bốn đoạn cùng lúc; ví dụ minh họa: xong trong
      khoảng $2{,}5$ giây.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước bốn, ta giải quyết bài toán xuất sao kê hàng triệu giao dịch bằng kỹ
      thuật chia để trị. Dữ liệu giao dịch đã được chép sang Kafka, nên ta không phải
      quét bảng sổ cái chính. Khoảng thời gian 30 ngày được chia thành bốn đoạn dài
      7, 7, 7 và 9 ngày, xử lý song song. Trong ví dụ minh họa, cả quá trình xong
      trong khoảng hai giây rưỡi.
  - clear: true
    show: '<p><b>Bước 5 — Ghép kết quả: số dư lũy kế cần số dư đầu của từng đoạn</b>:</p>

      <div class="box key">Mỗi đoạn trước hết chỉ tính <b>tổng phát sinh</b> của mình.
      Số dư đầu đoạn sau = số dư đầu kỳ + tổng phát sinh các đoạn trước.</div>

      <table class="t">
        <tr><th>đoạn</th><th>số dư đầu đoạn (triệu)</th><th>tổng phát sinh (triệu)</th><th>số dư cuối đoạn</th></tr>
        <tr><td>1 (ngày 1–7)</td><td>$10$</td><td>$+5$</td><td>$15$</td></tr>
        <tr><td>2 (ngày 8–14)</td><td>$15$</td><td>$-3$</td><td>$12$</td></tr>
        <tr><td>3 (ngày 15–21)</td><td>$12$</td><td>$+2$</td><td>$14$</td></tr>
        <tr><td>4 (ngày 22–30)</td><td>$14$</td><td>$-1$</td><td>$13$</td></tr>
      </table>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bước năm, số dư lũy kế của đoạn sau phụ thuộc vào các đoạn trước, nên không
      thể để bốn đoạn tự cộng dồn từ số không. Mỗi đoạn trước hết chỉ tính tổng phát
      sinh của mình. Ví dụ số dư đầu kỳ là 10 triệu, tổng phát sinh bốn đoạn lần lượt
      là cộng 5, trừ 3, cộng 2 và trừ 1 triệu. Vậy số dư đầu đoạn hai là 15 triệu,
      đầu đoạn ba là 12 triệu, đầu đoạn bốn là 14 triệu, và cuối kỳ còn 13 triệu.
      Sau đó mỗi đoạn mới cộng dồn từng giao dịch bên trong, bắt đầu từ số dư đầu
      đoạn của nó.
- id: check
  kind: check
  title: Kiểm tra xử lý tình huống mất mạng giữa chừng khi đang chạy lô chi lương
  checks:
  - 10000 - 9999 == 1
  - 100 > 50
  steps:
  - show: "<p><b>Tình huống phỏng vấn</b>: Khi đang thực hiện chi lương đến nhân viên\
      \ thứ 5 000 thì máy chủ bị mất điện đột ngột. Bạn làm thế nào để khi khởi động\
      \ lại không bị chi trùng tiền cho 5 000 người đầu tiên?</p>\n<table class=\"\
      t\">\n  <tr><th>cách xử lý sơ cấp</th><th>giải pháp của kỹ sư cấp cao</th></tr>\n\
      \  <tr><td>Chạy lại toàn bộ danh sách từ đầu</td><td>Dựa vào bảng Outbox và\
      \ khóa chống trùng (Idempotency Key: mã riêng của mỗi lệnh con, gặp lại mã đã\
      \ xử lý thì bỏ qua)</td></tr>\n  <tr><td>Làm nhân viên nhận lương\
      \ 2 lần</td><td>Chỉ xử lý các bản ghi có trạng thái chờ xử lý (PENDING)</td></tr>\n  <tr><td>Gây\
      \ thất thoát hàng tỉ đồng</td><td>Tiếp tục xử lý từ nhân viên thứ 5 001 một\
      \ cách an toàn</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Ta kiểm tra tình huống thực tế khi máy chủ gặp sự cố giữa chừng lúc đang
      chi lương. Do năm nghìn người đầu tiên đã được nhận tiền, việc chạy lại toàn
      bộ danh sách từ đầu sẽ khiến nhân viên nhận lương hai lần. Bởi vì điều này gây
      ra thất thoát tài chính lớn cho doanh nghiệp.
  - clear: true
    show: '<div class="box key"><b>Quy tắc đảm bảo tính duy nhất</b>: Mỗi lệnh con
      trong bảng Outbox đều được gắn khóa duy nhất gồm mã lô và số thứ tự dòng trong
      lô (một nhân viên có thể có hai dòng, ví dụ lương và thưởng). Khi máy chủ khởi
      động lại, tiến trình chỉ quét các bản ghi chưa hoàn tất. Các giao dịch đã thành
      công sẽ tự động được bỏ qua, không chi lương hai lần.<br/>

      Lệnh đang dở lúc mất điện (đã gửi đi nhưng chưa ghi kết quả) được coi là nghi
      vấn: tra soát trước, không gửi lại ngay.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Do đó, hệ thống luôn gán khóa duy nhất cho từng lệnh con trong bảng hộp thư
      giao dịch, gồm mã lô và số thứ tự dòng. Khi khởi động lại, tiến trình chỉ quét
      các bản ghi đang chờ xử lý. Riêng lệnh đang dở lúc mất điện, tức đã gửi đi mà
      chưa ghi kết quả, phải được tra soát trước khi quyết định gửi lại. Nhờ vậy,
      năm nghìn người đầu tiên không bị nhận lương hai lần.
- id: pitfall
  kind: pitfall
  title: Ba sai lầm nghiêm trọng trong kiến trúc xử lý thanh toán theo lô
  steps:
  - show: "<table class=\"t\">\n  <tr><th>sai lầm sơ cấp</th><th>hậu quả kỹ thuật\
