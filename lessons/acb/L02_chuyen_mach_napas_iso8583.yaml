      <p><b>Đọc trước</b> — bốn chỗ lạ trong mã giải mã:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>int(chuoi, 16)</code></td><td>đổi chuỗi hệ mười sáu thành một số nguyên</td><td><code>int("72", 16)</code> ra 114</td></tr><tr><td><code>bits &gt;&gt; k</code> và <code>&amp; 1</code></td><td><code>&gt;&gt;</code> dịch sang phải, bỏ k bit bên phải; <code>&amp; 1</code> giữ lại đúng bit cuối</td><td><code>01110010 &gt;&gt; 1</code> là <code>00111001</code>, rồi <code>&amp; 1</code> ra 1</td></tr><tr><td><code>range(1, 65)</code></td><td>các số 1, 2, ..., 64, dừng trước 65</td><td><code>range(1, 4)</code> là 1, 2, 3</td></tr><tr><td><code>ds = []</code> và <code>ds.append(n)</code></td><td>ngoặc vuông rỗng là danh sách trống; <code>append</code> thêm <code>n</code> vào cuối danh sách</td><td>thêm 2 vào danh sách trống ra <code>[2]</code></td></tr></table>
    say: 'Giải mã dùng bốn chỗ đọc khác. Lệnh đổi kèm cơ số mười sáu biến chuỗi hệ mười sáu thành số. Hai dấu lớn hơn dịch sang phải, rồi phép và với một giữ lại bit cuối. Lệnh tạo dãy số từ một tới sáu mươi tư. Ngoặc vuông rỗng là danh sách trống, lệnh thêm bỏ số vào cuối nó.'
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
