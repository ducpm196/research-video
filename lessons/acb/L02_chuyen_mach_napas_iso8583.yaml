    say: 'Tóm lại, chuỗi logic cổng NAPAS gồm khử trùng lặp, dịch mã PIN trong phần cứng và giữ tiền trên hệ thống lõi. Sau đó ta đóng gói bản tin kèm mã toàn vẹn, chốt trích nợ khi nhận phản hồi, và đối soát cuối ngày. Hãy nói rõ con số nào là số minh hoạ, con số nào cần đo trên hệ thống thật.'
