    say: 'Ta giữ độ trễ 120 mi li giây và tăng tải, với số minh hoạ. Ở cỡ một, 80 lệnh mỗi giây, chỉ cần một kết nối bền và một Redis. Ở cỡ một trăm, đúng 8 nghìn lệnh mỗi giây của ví dụ, có 960 giao dịch đang chờ và 480 nghìn khoá cùng tồn tại. Ở cỡ mười nghìn có tới 48 triệu khoá, nhưng nút nghẽn thật là thông lượng ghi. Vì 800 nghìn lần mỗi giây có thể vượt sức một nút Redis, nên phải chia khoá theo tài khoản sang nhiều nút. Số này là minh hoạ, cần đo thật. Thiết bị HSM là phần cứng, nên phải thêm thiết bị khi tải tăng.'
