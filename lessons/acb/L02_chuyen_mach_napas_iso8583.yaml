scenes:
- id: hook
  kind: hook
  title: Huyết mạch thanh toán liên ngân hàng và tiêu chuẩn bảo mật khắt khe
  steps:
  - show: '<p>Mỗi khi bạn chuyển tiền nhanh 247 trên ứng dụng ngân hàng, tiền bay
      sang tài khoản ngân hàng khác chỉ trong vài giây.</p>

      <div class="box key">Đứng sau kỳ tích đó là <b>Cổng thanh toán NAPAS 247</b>,
      xử lý bản tin theo đặc tả kết nối gốc <b>ISO 8583</b> qua đường truyền <b>Socket
      TCP</b> (đặc tả hiện hành cần kiểm với đặc tả kết nối của NAPAS).</div>

      <p>NAPAS: Công ty Cổ phần Thanh toán Quốc gia Việt Nam, vận hành hệ thống chuyển
      mạch tài chính nối các ngân hàng;
      247 = chạy 24 giờ mỗi ngày, 7 ngày mỗi tuần. Socket TCP: một kết nối mạng giữ
      mở liên tục giữa hai máy để gửi nhận dữ liệu theo đúng thứ tự.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, khi bạn chuyển tiền nhanh trên ứng dụng di động, tiền sang ngay
      tài khoản người nhận chỉ sau vài giây. Phía sau sự mượt mà đó là cả một hệ sinh
      thái chuyển mạch liên ngân hàng NAPAS 247 chạy liên tục suốt ngày đêm. NAPAS
      là Công ty Cổ phần Thanh toán Quốc gia Việt Nam, vận hành hệ thống chuyển mạch
      nối các ngân hàng với nhau. Con số 247 nghĩa là chạy 24 giờ mỗi ngày, 7 ngày mỗi tuần. Mỗi giao
      dịch được đóng gói theo đặc tả kết nối của NAPAS, có gốc từ chuẩn ISO 8583, và
      gửi qua đường truyền TCP chuyên dụng. Kết nối TCP là một đường nối mạng giữ mở
      liên tục giữa hai máy, dữ liệu đi tới nơi theo đúng thứ tự đã gửi.
  - clear: true
    show: '<p>Hôm nay, ta mổ xẻ: <b>Cấu trúc bản tin MTI 0200 và 0210</b>, <b>dịch
      mã PIN Block trong thiết bị phần cứng HSM</b>, và <b>cơ chế khử trùng lặp giảm
      nguy cơ trừ tiền hai lần</b>.</p>

      <div class="box key"><b>HSM</b> (Hardware Security Module): thiết bị phần cứng
      chuyên giữ khoá mật mã và làm phép mã hoá ngay bên trong, khoá không ra ngoài
      ở dạng rõ. <b>PIN Block</b> (khối PIN): mã PIN trộn với số thẻ rồi mã hoá thành
      một khối 8 byte.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay ta sẽ cùng giải mã toàn diện kiến trúc cổng NAPAS 247. Ta tìm hiểu
      cấu trúc gói tin chuẩn mực và cơ chế bảo mật phần cứng qua thiết bị HSM. Thiết
      bị HSM là máy phần cứng chuyên giữ khoá mật mã và làm phép mã hoá ngay bên trong
      nó, nên khoá không lộ ra máy chủ ứng dụng ở dạng rõ. Khối PIN là mã PIN được
      trộn với số thẻ rồi mã hoá thành một khối dữ liệu nhỏ. Ta cũng nắm vững giải
      pháp khử trùng lặp đạt chuẩn Senior. Đây là những chủ đề then chốt giúp bạn
      ghi điểm khi phỏng vấn.
- id: prereq
  kind: prereq
  title: 'Kiến thức nền: Bản tin ISO 8583, mã định danh STAN và mã tham chiếu RRN'
  checks:
  - 8000 * 60 == 480000 and 480000 * 60 == 28800000
  - 1500 - 120 == 1380 and 120 + 1380 == 1500
  steps:
  - show: "<p><b>Ba khái niệm cốt lõi của chuẩn thanh toán liên ngân hàng ISO 8583</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>khái niệm</th><th>định nghĩa</th><th>vai trò\
      \ trong giao dịch</th></tr>\n  <tr><td>MTI</td><td>Message Type Identifier (4\
      \ chữ số)</td><td>xác định loại bản tin yêu cầu 0200 hoặc phản hồi 0210</td></tr>\n\
      \  <tr><td>STAN</td><td>System Trace Audit Number (6 chữ số)</td><td>mã vết\
      \ kiểm toán do bên gửi bản tin sinh ra</td></tr>\n  <tr><td>RRN</td><td>Retrieval\
      \ Reference Number (12 ký tự)</td><td>mã tham chiếu truy xuất để tra soát và\
      \ đối soát</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu ba khái niệm cốt lõi của chuẩn thanh toán liên ngân
      hàng. Mã loại bản tin gồm 4 chữ số giúp phân biệt lệnh yêu cầu tài chính và
      kết quả phản hồi. Mã vết kiểm toán là chuỗi 6 số do bên gửi bản tin sinh ra
      để lần theo từng giao dịch. Mã tham chiếu là chuỗi 12 ký tự được dùng làm căn
      cứ đối soát giữa các ngân hàng.
  - show: '<div class="box key">Ví dụ minh họa (số liệu giả định, không phải số liệu
      của NAPAS hay ngân hàng): ở thông lượng $8\,000$ giao dịch mỗi giây, mỗi phút
      có $8\,000 \times 60 = 480\,000$ lệnh. Nếu độ trễ mạng là $120$ ms và ngưỡng
      chờ giả định là $1500$ ms, phần dư là $1500 - 120 = 1380$ ms.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta xem xét một ví dụ hiệu năng với số liệu giả định. Tại mức 8 nghìn giao
      dịch mỗi giây, mỗi phút hệ thống tiếp nhận 480 nghìn bản tin. Với độ trễ trung
      bình giả định 120 mi li giây, hệ thống phản hồi trong ngưỡng chờ giả định 1500
      mi li giây. Khoảng thời gian dư là 1380 mi li giây.
