  steps:
  - show: "<p><b>Tình huống phỏng vấn</b>: Gửi lệnh chuyển tiền 10 triệu đồng sang\
      \ ngân hàng bạn. Socket TCP bị đứt giữa chừng và quá 1500 ms không nhận được\
      \ bản tin 0210. Bạn xử lý thế nào?</p>\n<table class=\"t\">\n  <tr><th>hành\
      \ động sai</th><th>hậu quả</th><th>hành động chuẩn mực Senior</th></tr>\n  <tr><td>Báo giao\
      \ dịch thất bại cho khách</td><td>Khách chuyển lại, trong khi bên kia có thể đã ghi có</td><td>Chuyển trạng thái giao dịch sang IN_DOUBT\
      \ (nghi vấn: chưa biết tiền đã sang bên kia hay chưa)</td></tr>\n  <tr><td>Tự\
      \ động hoàn tiền hoặc trừ tiền lại</td><td>Hoàn tiền cho lệnh đã thành công, hoặc trừ trùng</td><td>Kích hoạt tiến trình tra vấn trạng\
      \ thái định kỳ</td></tr>\n  <tr><td>Bỏ qua việc đối soát cuối ngày</td><td>Thất thoát 10 triệu đồng của ngân hàng mà không ai biết</td><td>Đối\
      \ soát tự động với tệp quyết toán cuối ngày (EOD, End Of Day)</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: 'Ta kiểm tra tình huống kinh điển khi yêu cầu vượt ngưỡng chờ 1500 mi li giây. Do đối tác chưa xác nhận nhận được tiền, báo lỗi thất bại ngay là sai lầm lớn. Nếu ngân hàng tự hoàn tiền khi đầu bên kia đã ghi có thành công, ngân hàng có thể mất 10 triệu đồng nếu không đòi lại được.'
  - clear: true
    show: '<div class="box key"><b>Quy tắc bảo toàn dòng tiền</b>: Vì kết quả mạng
      chưa rõ ràng, ta chuyển trạng thái sang nghi vấn. Hệ thống tự động gửi bản tin
      truy vấn trạng thái theo quy trình tra soát của NAPAS. Chỉ hoàn tiền 10 triệu
      đồng khi đã xác nhận giao dịch thất bại qua tra soát hoặc đối soát; khi đó mới
      gửi yêu cầu đảo (MTI 0400; 0420 là thông báo đảo), theo ISO 8583; đặc tả NAPAS
      cần kiểm, vì có mạng đảo ngay khi hết giờ.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Vì kết quả mạng chưa thể xác định, ta lập tức chuyển lệnh sang trạng thái
      nghi vấn. Tiến trình tự động sẽ truy vấn lại với cổng chuyển mạch, và chỉ hoàn
      tiền khi đã xác nhận giao dịch thất bại. Sau đó mới gửi yêu cầu đảo loại 0400,
      còn 0420 là thông báo đảo, theo chuẩn ISO 8583. Đặc tả NAPAS cần kiểm, vì có mạng đảo ngay khi hết giờ.
