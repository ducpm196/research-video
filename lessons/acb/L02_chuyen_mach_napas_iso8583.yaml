- id: example
  kind: example
  title: Tính toán khả năng tải và thời gian sống khoá khử trùng lặp
  checks:
  - 8000 * 12 // 100 == 960
  - 60 * 1000 == 60000
  - 8000 + 4000 == 12000
  steps:
  - show: '<p><b>Bước 1 — Tính số giao dịch đồng thời trên Socket TCP (Little''s Law)</b>:</p>

      <div class="box key">Định luật Little: $L = N \times W$.<br/>

      Với thông lượng $N = 8\,000$ lệnh/giây, thời gian phản hồi $W = 120$ ms $= 0{,}12$
      giây.<br/>

      Số giao dịch đang chờ phản hồi trung bình: $L = 8\,000 \times 0{,}12 = 960$
      giao dịch (ví dụ minh họa). Đây không phải số kết nối: nhờ ghép cặp theo STAN/RRN,
      chỉ cần vài kết nối bền vững.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta tính số giao dịch đang chờ phản hồi cùng lúc trên đường truyền.
      Áp dụng định luật Lít-tơn với lưu lượng giả định 8 nghìn lệnh mỗi giây và độ
      trễ 120 mi li giây, ta có 960 giao dịch đồng thời. Lưu ý, đây không phải số
      kết nối, vì nhờ ghép cặp theo mã vết và mã tham chiếu, chỉ cần vài kết nối bền
      vững là đủ.
  - clear: true
    show: "<p><b>Bước 2 — Cấu hình khoá khử trùng lặp trong Redis</b> (kho khoá–giá\
      \ trị nằm trong bộ nhớ, nhiều máy chủ dùng chung):</p>\n<table class=\"t\">\n\
      \  <tr><th>thông số cấu hình</th><th>giá trị thiết lập</th><th>lý do kỹ thuật</th></tr>\n\
      \  <tr><td>Cấu trúc khoá</td><td><code>napas:dedup:{stan}:{rrn}</code></td><td>kết\
      \ hợp mã vết và mã tham chiếu duy nhất (ngoặc nhọn là chỗ điền giá trị thật)</td></tr>\n  <tr><td>Thời gian sống TTL</td><td>$60$\
      \ giây $= 60\\,000$ ms</td><td>lớn hơn khoảng đối tác còn có thể gửi lại bản\
      \ tin trùng (giả định $30$ giây, khác ngưỡng chờ 1500 ms của ta)</td></tr>\n\
      \  <tr><td>Lệnh nguyên tử (làm trọn một lệnh, không ai chen giữa)</td><td><code>SET ... NX EX 60</code></td><td><code>NX</code>:\
      \ chỉ ghi nếu khoá chưa có; <code>EX 60</code>: tự xoá sau 60 giây</td></tr>\n\
      \  <tr><td>Chốt chặn cuối</td><td>ràng buộc UNIQUE trong cơ sở dữ liệu (từ chối ghi dòng thứ hai có cùng mã)</td><td>khoá\
      \ Redis chỉ chặn nhanh; khoá có hạn có thể hết hạn hoặc mất khi Redis sập</td></tr>\n\
      </table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Bước hai, ta thiết lập khoá khử trùng lặp trong Redis, kho dữ liệu khoá giá trị nằm trong bộ nhớ, đọc ghi rất nhanh và nhiều máy chủ cùng dùng chung. Ta kết hợp mã vết và mã tham chiếu thành một khoá duy nhất. Lệnh ghi có điều kiện là nguyên tử, tức làm trọn một lệnh mà không ai chen vào giữa. Lệnh này chỉ ghi khi khoá chưa có, nên bản tin gửi lại lần hai ghi thất bại và bị nhận ra là trùng. Giả định đối tác còn gửi lại bản tin trùng trong 30 giây, ta đặt thời gian sống của khoá là 60 giây, tức 60 nghìn mi li giây. Khoá Redis chỉ là lớp chặn nhanh, còn chốt cuối là ràng buộc duy nhất, luật của cơ sở dữ liệu từ chối ghi dòng thứ hai có cùng mã.'
    introduces:
