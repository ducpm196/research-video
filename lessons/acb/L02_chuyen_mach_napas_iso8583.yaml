scenes:
- id: hook
  kind: hook
  title: Huyết mạch thanh toán liên ngân hàng và tiêu chuẩn bảo mật khắt khe
  steps:
  - show: '<p>Mỗi khi bạn chuyển tiền nhanh 247 trên ứng dụng ngân hàng, tiền bay
      sang tài khoản ngân hàng khác chỉ trong vài giây.</p>

      <div class="box key">Đứng sau kỳ tích đó là <b>Cổng thanh toán NAPAS 247</b>,
      xử lý bản tin theo đặc tả kết nối gốc <b>ISO 8583</b> qua đường truyền <b>Socket
      TCP</b> (đặc tả hiện hành cần kiểm với đặc tả kết nối của NAPAS).</div>

      <p>NAPAS: Công ty Cổ phần Thanh toán Quốc gia Việt Nam, vận hành hệ thống chuyển
      mạch tài chính nối các ngân hàng; 247 = chạy 24 giờ mỗi ngày, 7 ngày mỗi tuần.
      Socket TCP: một kết nối mạng giữ mở liên tục giữa hai máy để gửi nhận dữ liệu
      theo đúng thứ tự.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, khi bạn chuyển tiền nhanh trên ứng dụng di động, tiền sang ngay
      tài khoản người nhận chỉ sau vài giây. Phía sau là hệ thống chuyển mạch liên ngân hàng NAPAS 247. NAPAS
      là Công ty Cổ phần Thanh toán Quốc gia Việt Nam, nối các ngân hàng với nhau, và 247 nghĩa là chạy 24 giờ mỗi ngày, 7 ngày
      mỗi tuần. Mỗi giao dịch được đóng gói theo đặc tả có gốc
      từ chuẩn ISO 8583. Gói tin đi qua đường truyền TCP, tức một
      đường nối mạng giữ mở liên tục giữa hai máy, dữ liệu tới nơi theo đúng thứ
      tự đã gửi.
  - clear: true
    show: '<p>Hôm nay, ta mổ xẻ: <b>Cấu trúc bản tin MTI 0200 và 0210</b>, <b>dịch
      mã PIN Block trong thiết bị phần cứng HSM</b>, và <b>cơ chế khử trùng lặp giảm
      nguy cơ trừ tiền hai lần</b>.</p>

      <div class="box key"><b>HSM</b> (Hardware Security Module): thiết bị phần cứng
      chuyên giữ khoá mật mã và làm phép mã hoá ngay bên trong, khoá không ra ngoài
      ở dạng rõ. <b>PIN Block</b> (khối PIN): mã PIN trộn với số thẻ rồi mã hoá thành
      một khối 8 byte (byte = đơn vị nhớ nhỏ, đủ chứa một chữ cái).</div>'
    focus:
    - 0
    - 0
    - 0
    say: 'Hôm nay ta giải mã cổng NAPAS 247, gồm cấu trúc gói tin và cơ chế bảo mật phần cứng qua thiết bị HSM. Thiết bị HSM là máy phần cứng chuyên giữ khoá mật mã và mã hoá ngay bên trong nó, nên khoá không lộ ra máy chủ ứng dụng ở dạng rõ. Khối PIN là mã PIN được trộn với số thẻ rồi mã hoá thành một khối dữ liệu nhỏ.'
    introduces:
    - acb_byte
- id: prereq
  kind: prereq
  title: 'Kiến thức nền: Bản tin ISO 8583, mã định danh STAN và mã tham chiếu RRN'
  checks:
  - 8000 * 60 == 480000 and 480000 * 60 == 28800000
  - 1500 - 120 == 1380 and 120 + 1380 == 1500
  steps:
  - show: "<p><b>Ba khái niệm cốt lõi của chuẩn thanh toán liên ngân hàng ISO 8583</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>khái niệm</th><th>định nghĩa</th><th>vai trò\
      \ trong giao dịch</th></tr>\n  <tr><td>MTI</td><td>Message Type Identifier (4\
      \ chữ số)</td><td>xác định loại bản tin yêu cầu 0200 hoặc phản hồi 0210</td></tr>\n\
      \  <tr><td>STAN</td><td>System Trace Audit Number (6 chữ số)</td><td>mã vết\
      \ kiểm toán do bên gửi bản tin sinh ra</td></tr>\n  <tr><td>RRN</td><td>Retrieval\
      \ Reference Number (12 ký tự)</td><td>mã tham chiếu truy xuất để tra soát và\
      \ đối soát (hai bên so sổ giao dịch, xem từng khoản có khớp không)</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu ba khái niệm cốt lõi của chuẩn thanh toán liên ngân
      hàng. Mã loại bản tin gồm 4 chữ số giúp phân biệt lệnh yêu cầu tài chính và
      kết quả phản hồi. Mã vết kiểm toán là chuỗi 6 số do bên gửi bản tin sinh ra
      để lần theo từng giao dịch. Mã tham chiếu là chuỗi 12 ký tự dùng để đối soát,
      tức hai bên so sổ giao dịch xem từng khoản có khớp không.
  - show: '<div class="box key">Ví dụ minh họa (số liệu giả định, không phải số liệu
      của NAPAS hay ngân hàng): ở thông lượng $8\,000$ giao dịch mỗi giây, mỗi phút
      có $8\,000 \times 60 = 480\,000$ lệnh. Nếu độ trễ mạng là $120$ ms và ngưỡng
      chờ giả định là $1500$ ms, phần dư là $1500 - 120 = 1380$ ms.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta xem xét một ví dụ hiệu năng với số liệu giả định. Tại mức 8 nghìn giao
      dịch mỗi giây, mỗi phút hệ thống tiếp nhận 480 nghìn bản tin. Với độ trễ trung
      bình giả định 120 mi li giây, hệ thống phản hồi trong ngưỡng chờ giả định 1500
      mi li giây. Khoảng thời gian dư là 1380 mi li giây.
- id: concept
  kind: concept
  title: Kiến trúc Luồng Thanh toán Cổng NAPAS 247 qua Socket TCP
  steps:
  - show: "<div>\n  <svg width=\"1500\" height=\"380\" viewBox=\"0 0 1500 380\">\n    <g font-size=\"22\" fill=\"#1f2937\">\n      <text x=\"750\" y=\"35\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"26\">Luồng chuyển tiền đi qua NAPAS 247, theo thứ tự thời gian</text>\n      <rect x=\"50\" y=\"70\" width=\"320\" height=\"240\" rx=\"12\" fill=\"#e0f2fe\" stroke=\"#0284c7\" stroke-width=\"3\"/>\n      <text x=\"210\" y=\"115\" text-anchor=\"middle\" font-weight=\"bold\">1. Digital Channel</text>\n      <text x=\"210\" y=\"160\" text-anchor=\"middle\">Ứng dụng di động</text>\n      <text x=\"210\" y=\"200\" text-anchor=\"middle\">Sinh mã giao dịch</text>\n      <text x=\"210\" y=\"240\" text-anchor=\"middle\">Xác thực sinh trắc học</text>\n      <rect x=\"410\" y=\"70\" width=\"320\" height=\"240\" rx=\"12\" fill=\"#f3e8ff\" stroke=\"#9333ea\" stroke-width=\"3\"/>\n      <text x=\"570\" y=\"115\" text-anchor=\"middle\" font-weight=\"bold\">2. Cổng thanh toán</text>\n      <text x=\"570\" y=\"160\" text-anchor=\"middle\">Khử trùng lặp trước</text>\n      <text x=\"570\" y=\"200\" text-anchor=\"middle\">Tính và kiểm mã MAC</text>\n      <text x=\"570\" y=\"240\" text-anchor=\"middle\">Dịch PIN (giao dịch thẻ)</text>\n      <rect x=\"770\" y=\"70\" width=\"320\" height=\"240\" rx=\"12\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-width=\"3\"/>\n      <text x=\"930\" y=\"115\" text-anchor=\"middle\" font-weight=\"bold\">3. Core Banking</text>\n      <text x=\"930\" y=\"160\" text-anchor=\"middle\">Giữ tiền trước 0200</text>\n      <text x=\"930\" y=\"200\" text-anchor=\"middle\">Chốt nợ khi có 0210</text>\n      <text x=\"930\" y=\"240\" text-anchor=\"middle\">Bảo toàn dòng tiền</text>\n      <rect x=\"1130\" y=\"70\" width=\"320\" height=\"240\" rx=\"12\" fill=\"#dcfce7\" stroke=\"#16a34a\" stroke-width=\"3\"/>\n      <text x=\"1290\" y=\"115\" text-anchor=\"middle\" font-weight=\"bold\">4. NAPAS Switch</text>\n      <text x=\"1290\" y=\"160\" text-anchor=\"middle\">Socket TCP (đường truyền)</text>\n      <text x=\"1290\" y=\"200\" text-anchor=\"middle\">Định tuyến liên ngân hàng</text>\n      <text x=\"1290\" y=\"240\" text-anchor=\"middle\">Bản tin ISO 8583 0200</text>\n      <line x1=\"370\" y1=\"150\" x2=\"410\" y2=\"150\" stroke=\"#0284c7\" stroke-width=\"4\"/>\n      <line x1=\"730\" y1=\"150\" x2=\"770\" y2=\"150\" stroke=\"#9333ea\" stroke-width=\"4\"/>\n      <line x1=\"1090\" y1=\"150\" x2=\"1130\" y2=\"150\" stroke=\"#d97706\" stroke-width=\"4\"/>\n      <line x1=\"1290\" y1=\"310\" x2=\"1290\" y2=\"340\" stroke=\"#16a34a\" stroke-width=\"4\"/>\n      <line x1=\"1290\" y1=\"340\" x2=\"930\" y2=\"340\" stroke=\"#16a34a\" stroke-width=\"4\"/>\n      <line x1=\"930\" y1=\"340\" x2=\"930\" y2=\"310\" stroke=\"#16a34a\" stroke-width=\"4\"/>\n    </g>\n  </svg>\n</div>"
