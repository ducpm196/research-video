      mã một bản đồ bit, mô phỏng khoá khử trùng lặp ở ba thời điểm, và tính số giao
      dịch đang chờ. Lưu bài thành tệp mau, chạy bằng lệnh Python kèm tên tệp, rồi dừng video và tự làm.
