id: L02
course: ACB
series: Phỏng vấn Kỹ sư Tích hợp ACB
title: 'Bài 2 — Chuyển mạch Thanh toán Liên ngân hàng NAPAS 247: ISO 8583 và Socket
  TCP'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/acb.yaml L02; ISO 8583:1987 (MTI 0200/0210, bản đồ bit, trường
  3, 4, 11, 37, 52, 64, 128); ISO 9564-1; PCI PIN Security Requirements; đặc tả kết
  nối NAPAS 247 (chưa kiểm được, cần kiểm với đặc tả NAPAS cấp riêng); Redis SET với
  NX và EX (khoá có hạn); audit/acb/verify_acb.py L02; mã Python 3 mô phỏng chạy thật
  (NAPAS, Redis, HSM thật không chạy trên máy); mọi số tải, độ trễ, hệ số đỉnh là
  số minh hoạ
assumes:
- arith
- approx
- acb_hsm
- acb_mti
- acb_dedup
- acb_ttl
- acb_redis
- acb_stan
- acb_napas
- acb_tcp
- acb_core
objectives:
- Đọc và ráp bản đồ bit của bản tin ISO 8583 để biết bản tin có những trường nào và
  khi nào cần bản đồ bit thứ hai
- 'Mô tả các trường chính của bản tin MTI 0200 và 0210: mã xử lý, số tiền, STAN, RRN,
  khối PIN và mã xác thực MAC'
- Nêu vì sao mã PIN chỉ được dịch bên trong HSM và vì sao phải kiểm MAC trước khi
  xử lý bản tin
- Tính số giao dịch đang chờ, thời gian sống của khoá khử trùng lặp và công suất dự
  phòng giờ cao điểm
- 'Chạy mô phỏng khoá khử trùng lặp có thời gian sống: bản tin trùng bị chặn, bản
  tin trùng sau khi hết hạn lọt qua'
- 'Chọn cách xử lý khi mất kết nối quá hạn chờ: chuyển nghi vấn, tra soát, đối soát
  cuối ngày, không hoàn tiền ngay'
- 'Nhận ra ba sai lầm: ghi PIN vào nhật ký, bỏ kiểm MAC, thiếu đối soát cuối ngày'
- 'So sánh ×1, ×100 và ×10 000: số giao dịch đang chờ, số khoá cùng tồn tại và chỗ
  nghẽn cứng ở phần cứng'
- Viết mã Python ráp và giải mã bản đồ bit, dựng khoá khử trùng lặp có hạn với số
  mới
