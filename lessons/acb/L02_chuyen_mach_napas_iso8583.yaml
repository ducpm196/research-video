- id: symbol
  kind: symbol
  title: Giải mã các trường dữ liệu quan trọng trong bản tin ISO 8583
  checks:
  - '[i + 1 for i in range(8) if (0x72 >> (7 - i)) & 1] == [2, 3, 4, 7]'
  - '[i + 1 for i in range(8) if (0xF2 >> (7 - i)) & 1] == [1, 2, 3, 4, 7]'
  - 0x72 == 0b01110010 and 0xF2 == 0b11110010
  - 64 + 64 == 128
  steps:
  - show: '<p><b>Các trường dữ liệu quan trọng của bản tin MTI 0200</b> (theo ISO
      8583:1987; đặc tả NAPAS cần kiểm):</p>

      <table class="t"> <tr><th>trường dữ liệu</th><th>tên gọi kỹ thuật</th><th>nội
      dung nghiệp vụ</th></tr> <tr><td>Field 3</td><td>Processing Code</td><td>mã
      xử lý (mã cụ thể của NAPAS cần kiểm)</td></tr> <tr><td>Field 4</td><td>Transaction
      Amount</td><td>số tiền; VND không có số lẻ (ISO 4217)</td></tr> <tr><td>Field
      11</td><td>STAN</td><td>mã vết kiểm toán 6 số</td></tr> <tr><td>Field 37</td><td>Retrieval
      Ref Number</td><td>mã tham chiếu 12 ký tự dùng đối soát</td></tr> <tr><td>Field
      52</td><td>PIN Block Data</td><td>khối PIN mã hóa 8 byte (chỉ giao dịch thẻ)</td></tr>
      <tr><td>Field 128</td><td>Message Auth Code</td><td>MAC toàn vẹn (cần bản đồ bit
      thứ hai, giải ở bước sau)</td></tr> </table>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Bản tin ISO 8583 gồm các trường được đánh số theo chuẩn quốc tế. Trường số ba là mã xử lý cho biết loại nghiệp vụ, mã cụ thể cần kiểm với đặc tả của NAPAS. Trường số bốn mang số tiền, đồng Việt Nam không có phần số lẻ. Trường số 11 và 37 là cặp mã định danh dùng để chống trùng và đối soát. Trường số 52 chứa khối PIN đã mã hoá, chỉ có ở giao dịch thẻ. Trường 128 là mã xác thực toàn vẹn, cần bản đồ bit thứ hai.'
  - clear: true
    show: '<p><b>Bản đồ bit (bitmap) cho biết bản tin có những trường nào</b>:</p>

      <div class="box key">Bitmap chính là dãy $64$ bit ngay sau MTI: bit thứ $n$
      bằng $1$ nghĩa là bản tin có trường số $n$.<br/>

      Ví dụ $8$ bit đầu là <code>0111 0010</code>. Mỗi nhóm bốn bit viết thành một chữ số thập lục phân (hệ mười sáu): <code>0111</code> = 4 + 2 + 1 = 7 (bốn vị trí có giá trị 8, 4, 2, 1), <code>0010</code> = 2, nên viết gọn là <code>72</code>:
      bit $2, 3, 4, 7$ bằng $1$ $\to$ có trường $2, 3, 4, 7$.<br/>

      Chữ số hệ mười sáu gồm 0 đến 9 rồi <code>A</code> = 10, <code>B</code> = 11, ..., <code>F</code> = 15.<br/>

      Nếu $8$ bit đầu là <code>1111 0010</code> (<code>F2</code>, tức $15 \times 16 + 2 = 242$): bit $1$ bằng $1$
      $\to$ có thêm <b>bitmap thứ hai</b> (secondary bitmap) $64$ bit cho các trường
      $65$ tới $128$.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Muốn biết bản tin có những trường nào, máy đọc bản đồ bit nằm ngay sau mã loại bản tin. Bản đồ bit là dãy 64 bit, mỗi bit chỉ là không hoặc một, và bit thứ n bằng một nghĩa là bản tin có trường số n. Bốn vị trí của một nhóm có giá trị tám, bốn, hai, một, nên nhóm không một một một bằng bốn cộng hai cộng một là bảy. Cứ bốn bit viết gọn thành một chữ số hệ mười sáu, dùng thêm chữ A đến F cho mười đến mười lăm, nên F hai bằng mười lăm nhân mười sáu cộng hai. Riêng khi bit thứ nhất bằng một, bản tin còn có bản đồ bit thứ hai dài thêm 64 bit, cho các trường từ 65 tới 128.'
  - clear: true
    show: |
      <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g font-size="22" fill="#1f2937" text-anchor="middle"><text x="750" y="35" font-weight="bold" font-size="26">Tám bit đầu của bản đồ bit: 0111 0010</text><text x="215" y="100">bit 1</text><text x="365" y="100">bit 2</text><text x="515" y="100">bit 3</text><text x="665" y="100">bit 4</text><text x="815" y="100">bit 5</text><text x="965" y="100">bit 6</text><text x="1115" y="100">bit 7</text><text x="1265" y="100">bit 8</text><rect x="150" y="115" width="130" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><rect x="300" y="115" width="130" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="450" y="115" width="130" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="600" y="115" width="130" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="750" y="115" width="130" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><rect x="900" y="115" width="130" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><rect x="1050" y="115" width="130" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="1200" y="115" width="130" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><g font-size="40" font-weight="bold"><text x="215" y="165">0</text><text x="365" y="165">1</text><text x="515" y="165">1</text><text x="665" y="165">1</text><text x="815" y="165">0</text><text x="965" y="165">0</text><text x="1115" y="165">1</text><text x="1265" y="165">0</text></g><text x="215" y="225" fill="#6b7280">không</text><text x="365" y="225">trường 2</text><text x="515" y="225">trường 3</text><text x="665" y="225">trường 4</text><text x="815" y="225" fill="#6b7280">không</text><text x="965" y="225" fill="#6b7280">không</text><text x="1115" y="225">trường 7</text><text x="1265" y="225" fill="#6b7280">không</text><path d="M150 245 V257 H730 V245" fill="none" stroke="#0284c7" stroke-width="3"/><path d="M750 245 V257 H1330 V245" fill="none" stroke="#d97706" stroke-width="3"/><text x="440" y="292">0111 là chữ số 7</text><text x="1040" y="292">0010 là chữ số 2</text><text x="750" y="330" font-weight="bold" font-size="26">viết gọn: 72</text></g></svg></div>
    say: Hình minh hoạ tám bit đầu bản đồ bit, không, một, một, một, không, không, một, không. Các ô bằng một nằm ở vị trí 2, 3, 4 và 7, nên bản tin có các trường 2, 3, 4 và 7. Bốn bit đầu thành chữ số bảy, bốn bit sau thành chữ số hai, nên viết gọn là bảy hai.
