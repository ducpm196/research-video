      \ tra soát; cuối ngày đối soát</span>\n</div>\n<p style=\"margin-top: 15px;\"\
      ><b>Mang vào buổi phỏng vấn</b>: nắm bản tin ISO 8583, vì sao PIN chỉ được dịch\
      \ trong HSM, chống trừ tiền kép bằng khoá có hạn cộng ràng buộc duy nhất, và\
      \ khi mất kết nối thì chuyển nghi vấn chứ không hoàn tiền vội. Mỗi con số bạn\
      \ nêu phải là số đã tính hoặc đã đo.</p>"
