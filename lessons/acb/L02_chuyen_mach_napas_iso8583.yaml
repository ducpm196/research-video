    say: 'Bước ba, ta tính công suất dự phòng cho các đợt cao điểm lễ Tết. Nhân lưu lượng cơ sở với hệ số an toàn 1 phẩy 5, hệ thống được thiết kế để gánh tới 12 nghìn lệnh mỗi giây. Đây là mục tiêu thiết kế, phải kiểm chứng bằng kiểm thử tải.'
- id: code
  kind: example
  title: 'Chạy thử bằng mã Python (mô phỏng): bản đồ bit và khoá khử trùng lặp có
    hạn'
  checks:
  - format(sum(1 << (64 - n) for n in [3, 4, 11, 37]), '016X') == '3020000008000000'
  - format(sum(1 << (64 - n) for n in [2, 3, 4, 7]), '016X') == '7200000000000000'
    and 0x72 == 0b01110010
  - 0 + 60 > 20 and 0 + 60 <= 61
  - '[n for n in range(1, 65) if (int(''7200000000000000'', 16) >> (64 - n)) & 1] == [2, 3, 4, 7]'
  steps:
  - clear: true
    show: |
      <p><b>Đọc trước</b> — bốn chỗ lạ trong mã dựng bản đồ bit:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def bando(truong):</code> và <code>for n in truong:</code></td><td><code>def</code> đặt tên cho một <b>hàm</b>; <code>for</code> lấy lần lượt từng số trong danh sách, gán vào <code>n</code>, rồi chạy các dòng thụt vào</td><td><code>bando([3, 4])</code> thì <code>n</code> là 3 rồi 4</td></tr><tr><td><code>1 &lt;&lt; (64 - n)</code></td><td><code>&lt;&lt;</code> dịch số một sang trái, tức thêm bên phải từng ấy bit không</td><td><code>1 &lt;&lt; 3</code> là <code>1000</code> (nhị phân: chỉ dùng chữ số 0 và 1), bằng 8</td></tr><tr><td><code>bits | (...)</code></td><td>dấu gạch đứng là phép <b>hoặc</b> từng bit: bit đã bằng 1 vẫn giữ, bit mới được bật</td><td><code>0101 | 0010</code> ra <code>0111</code></td></tr><tr><td><code>return format(bits, "016X")</code></td><td><code>return</code> đưa kết quả ra khỏi hàm; <code>format</code> viết số ở hệ mười sáu, chữ in hoa, đủ 16 chữ số</td><td><code>format(114, "04X")</code> ra <code>0072</code></td></tr></table>
    say: 'Trước khi đọc mã, ta học bốn chỗ lạ. Dòng mở đầu một hàm đặt tên cho đoạn việc, vòng lặp lấy lần lượt từng số trong danh sách. Hai dấu nhỏ hơn dịch số một sang trái, thêm các bit không bên phải. Dấu gạch đứng là phép hoặc từng bit. Lệnh trả kết quả đưa giá trị ra khỏi hàm, lệnh định dạng viết số ở hệ mười sáu.'
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
    show: <p><b>Mô phỏng bằng Python</b> — NAPAS thật không chạy trên máy này.</p><div class="code"><div>def
      bando(truong):</div><div>    bits = 0</div><div>    for n in truong:</div><div>        bits
      = bits | (1 &lt;&lt; (64 - n))</div><div>    return format(bits, "016X")</div><div>
      </div><div>print(bando([3, 4, 11, 37]))</div><div>print(bando([2, 3, 4, 7]))</div></div><p><b>Kết
      quả khi chạy</b></p><div class="code"><div>3020000008000000</div><div>7200000000000000</div></div>
