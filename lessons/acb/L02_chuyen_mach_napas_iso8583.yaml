  - clear: true
    show: '<p>Giải mã ngược lại, từ chuỗi hệ mười sáu về danh sách trường (mô phỏng):</p><div class="code"><div>def giaima(chuoi):</div><div>    bits = int(chuoi, 16)</div><div>    ds = []</div><div>    for n in range(1, 65):</div><div>        if (bits &gt;&gt; (64 - n)) &amp; 1:</div><div>            ds.append(n)</div><div>    return ds</div><div> </div><div>print(giaima("7200000000000000"))</div></div><p><b>Kết quả khi chạy</b></p><div class="code"><div>[2, 3, 4, 7]</div></div>'
