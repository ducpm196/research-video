    say: 'Nhìn lên sơ đồ luồng chuyển đi, xếp theo thứ tự thời gian. Bước một, ứng dụng số nhận yêu cầu chuyển tiền và xác thực sinh trắc học. Bước hai, Cổng thanh toán kiểm tra khoá khử trùng lặp trước tiên, tức nhận ra bản tin gửi lại để không xử lý hai lần. Với giao dịch thẻ, cổng nhờ thiết bị HSM giải mã khối PIN ngay bên trong phần cứng, gọi là dịch mã PIN, để mã PIN không lộ ra ngoài. Cổng cũng tính và kiểm mã MAC, tức mã xác thực tính từ nội dung bản tin bằng một khoá bí mật, nên ai sửa dù một chữ số thì mã không còn khớp. Bước ba, Core Banking giữ trước số tiền của khách, chưa trích hẳn, và nhờ đã khử trùng lặp nên yêu cầu gửi lại không giữ tiền hai lần. Bước bốn, bản tin ISO 8583 hoàn chỉnh đi qua đường truyền TCP đến cổng chuyển mạch. Khi nhận bản tin trả lời thành công, đường vòng phía dưới đưa kết quả về Core Banking, chốt khoản giữ thành trích nợ, cập nhật sổ cái và báo người gửi.'
