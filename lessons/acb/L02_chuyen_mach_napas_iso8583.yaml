    show: "<p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Tại sao mã PIN của chủ thẻ bắt\
      \ buộc phải được dịch mã (PIN Translation) bên trong thiết bị phần cứng chuyên\
      \ dụng HSM mà không được xử lý bằng code Java trên máy chủ thông thường?</p>\n\
      <ul>\n  <li><b>A</b>: Vì máy chủ Java\
      \ không đủ chính xác để tính các phép toán nhị phân trên khối dữ liệu 8 byte.</li>\n  <li><b>B</b>: Vì HSM giữ khoá trong vùng nhớ phần cứng tự huỷ khi bị can\
      \ thiệp, nên khoá không lộ ra ngoài.</li>\n  <li><b>C</b>: Vì\
      \ thiết bị HSM xử lý nhanh hơn nhiều nên độ trễ mạng liên ngân hàng giảm xuống bằng 0.</li>\n  <li><b>D</b>: Vì\
      \ giao thức TCP của NAPAS chỉ chấp nhận bản tin gửi đi từ một thiết bị phần cứng chuyên dụng.</li>\n</ul>"
