  - format(sum(1 << (64 - n) for n in [1, 3, 4, 11, 37]), '016X') == 'B020000008000000'
    and 128 - 64 == 64
  - 2 * 40 == 80 and 0 + 80 > 30 and 0 + 80 <= 95 and 2400 * 150 // 1000 == 360
  steps:
