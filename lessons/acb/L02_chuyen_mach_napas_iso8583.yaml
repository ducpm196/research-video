      nhị phân đến cổng chuyển mạch. Bước bốn, ô này vẽ ở cuối hình nhưng Core Banking
      đã giữ số tiền của khách trước khi bản tin được gửi đi. Khi nhận bản tin trả lời thành công, nó chốt
      khoản giữ thành trích nợ, cập nhật sổ cái và báo kết quả cho người gửi.
- id: symbol
  kind: symbol
  title: Giải mã các trường dữ liệu quan trọng trong bản tin ISO 8583
  checks:
  - '[i + 1 for i in range(8) if (0x72 >> (7 - i)) & 1] == [2, 3, 4, 7]'
  - '[i + 1 for i in range(8) if (0xF2 >> (7 - i)) & 1] == [1, 2, 3, 4, 7]'
  - 0x72 == 0b01110010 and 0xF2 == 0b11110010
  - 64 + 64 == 128
  steps:
  - show: '<p><b>Các trường dữ liệu quan trọng của bản tin MTI 0200</b> (theo ISO 8583:1987;
      đặc tả NAPAS cần kiểm):</p>

      <table class="t">
        <tr><th>trường dữ liệu</th><th>tên gọi kỹ thuật</th><th>nội dung nghiệp vụ</th></tr>
        <tr><td>Field 3</td><td>Processing Code</td><td>mã xử lý (mã cụ thể của NAPAS cần kiểm)</td></tr>
        <tr><td>Field 4</td><td>Transaction Amount</td><td>số tiền; VND không có số lẻ (ISO 4217)</td></tr>
        <tr><td>Field 11</td><td>STAN</td><td>mã vết kiểm toán 6 số</td></tr>
        <tr><td>Field 37</td><td>Retrieval Ref Number</td><td>mã tham chiếu 12 ký tự dùng đối soát</td></tr>
        <tr><td>Field 52</td><td>PIN Block Data</td><td>khối PIN mã hóa 8 byte (chỉ giao dịch thẻ)</td></tr>
        <tr><td>Field 128</td><td>Message Auth Code</td><td>MAC toàn vẹn (cần bitmap thứ hai)</td></tr>
      </table>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bản tin ISO 8583 bao gồm các trường dữ liệu được đánh số chuẩn quốc tế. Trường
      số ba là mã xử lý cho biết loại nghiệp vụ, mã cụ thể cần kiểm với đặc tả kết
      nối của NAPAS. Trường số bốn mang số tiền, và đồng Việt Nam không có phần số lẻ. Trường
      số 11 và trường số 37 tạo thành cặp mã định danh dùng để chống trùng và đối
      soát. Trường số 52 chứa khối mã PIN đã mã hoá, chỉ có ở giao dịch thẻ. Cuối
      cùng, trường 128 là mã xác thực toàn vẹn, và muốn dùng nó thì bản tin phải có
      bản đồ bit thứ hai.
  - clear: true
    show: '<p><b>Bản đồ bit (bitmap) cho biết bản tin có những trường nào</b>:</p>

      <div class="box key">Bitmap chính là dãy $64$ bit ngay sau MTI: bit thứ $n$ bằng
      $1$ nghĩa là bản tin có trường số $n$.<br/>

      Ví dụ $8$ bit đầu là <code>0111 0010</code> (viết thập lục phân <code>72</code>):
      bit $2, 3, 4, 7$ bằng $1$ $\to$ có trường $2, 3, 4, 7$.<br/>

      Nếu $8$ bit đầu là <code>1111 0010</code> (<code>F2</code>): bit $1$ bằng $1$
      $\to$ có thêm <b>bitmap thứ hai</b> (secondary bitmap) $64$ bit cho các trường
      $65$ tới $128$.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Muốn biết bản tin có những trường nào, máy đọc bản đồ bit nằm ngay sau mã
      loại bản tin. Bản đồ bit là dãy 64 bit, bit thứ n bằng một nghĩa là bản tin
      có trường số n. Ví dụ tám bit đầu là không, một, một, một, không, không, một,
      không, thì bản tin có các trường 2, 3, 4 và 7. Riêng khi bit thứ nhất bằng một,
      bản tin còn có bản đồ bit thứ hai dài thêm 64 bit, dành cho các trường từ 65
      tới 128.
- id: example
  kind: example
  title: Tính toán khả năng tải và thời gian sống khoá khử trùng lặp
  checks:
  - 8000 * 12 // 100 == 960
  - 60 * 1000 == 60000
  - 8000 + 4000 == 12000
  steps:
  - show: '<p><b>Bước 1 — Tính số giao dịch đồng thời trên Socket TCP (Little''s Law)</b>:</p>

      <div class="box key">Định luật Little: $L = N \times W$.<br/>

      Với thông lượng $N = 8\,000$ lệnh/giây, thời gian phản hồi $W = 120$ ms $= 0{,}12$
      giây.<br/>

      Số giao dịch đang chờ phản hồi trung bình: $L = 8\,000 \times 0{,}12 = 960$
      giao dịch (ví dụ minh họa). Đây không phải số kết nối: nhờ ghép cặp theo STAN/RRN,
      chỉ cần vài kết nối bền vững.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta tính số giao dịch đang chờ phản hồi cùng lúc trên đường truyền.
      Áp dụng định luật Lít-tơn với lưu lượng giả định 8 nghìn lệnh mỗi giây và độ
      trễ 120 mi li giây, ta có 960 giao dịch đồng thời. Lưu ý, đây không phải số
      kết nối, vì nhờ ghép cặp theo mã vết và mã tham chiếu, chỉ cần vài kết nối bền
      vững là đủ.
  - clear: true
    show: "<p><b>Bước 2 — Cấu hình khoá khử trùng lặp trong Redis</b> (kho khoá–giá\
      \ trị nằm trong bộ nhớ, nhiều máy chủ dùng chung):</p>\n\
      <table class=\"t\">\n  <tr><th>thông số cấu hình</th><th>giá trị thiết lập</th><th>lý\
      \ do kỹ thuật</th></tr>\n  <tr><td>Cấu trúc khoá</td><td><code>napas:dedup:{stan}:{rrn}</code></td><td>kết\
      \ hợp mã vết và mã tham chiếu duy nhất</td></tr>\n  <tr><td>Thời gian sống TTL</td><td>$60$\
      \ giây $= 60\\,000$ ms</td><td>lớn hơn khoảng đối tác còn có thể gửi lại bản tin\
      \ trùng (giả định $30$ giây, khác ngưỡng chờ 1500 ms của ta)</td></tr>\n  <tr><td>Lệnh thực thi nguyên tử</td><td><code>SET\
      \ ... NX EX 60</code></td><td><code>NX</code>: chỉ ghi nếu khoá chưa có; <code>EX\
      \ 60</code>: tự xoá sau 60 giây</td></tr>\n  <tr><td>Chốt chặn cuối</td><td>ràng\
      \ buộc UNIQUE trong cơ sở dữ liệu</td><td>khoá Redis chỉ chặn nhanh; khoá có hạn có\
      \ thể hết hạn hoặc mất khi Redis sập</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bước hai, ta thiết lập khoá khử trùng lặp trong bộ nhớ đệm phân tán. Redis
      là kho dữ liệu khoá giá trị nằm trong bộ nhớ, đọc ghi rất nhanh và nhiều máy
      chủ cùng dùng chung. Vì mạng viễn thông có thể gửi lại gói tin bị chậm, ta kết
      hợp mã vết và mã tham chiếu thành một khoá duy nhất. Lệnh ghi kèm điều kiện
      chỉ ghi khi khoá chưa có, nên bản tin gửi lại lần hai sẽ ghi thất bại và bị
      nhận ra là trùng. Giả định đối tác còn có thể gửi lại bản tin trùng trong 30
      giây, ta đặt thời gian sống của khoá là 60 giây, tức 60 nghìn mi li giây. Khoá
      Redis chỉ là lớp chặn nhanh, còn chốt chặn cuối cùng vẫn là ràng buộc duy nhất
      trong cơ sở dữ liệu.
  - clear: true
    show: '<p><b>Bước 3 — Dự phòng khả năng mở rộng vào giờ cao điểm</b>:</p>

      <div class="box key">Hệ số dự phòng tải cao điểm (ví dụ minh họa): $1{,}5$.<br/>

      Mục tiêu thiết kế của cụm Gateway: $8\,000 \times 1{,}5 = 8\,000 + 4\,000 =
      12\,000$ giao dịch mỗi giây, cần kiểm chứng bằng kiểm thử tải.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước ba, ta tính toán công suất dự phòng cho các đợt cao điểm lễ Tết. Nhân
      lưu lượng cơ sở với hệ số an toàn 1 phẩy 5, hệ thống được thiết kế để gánh tới
      12 nghìn lệnh mỗi giây. Con số này là mục tiêu thiết kế và phải được kiểm chứng
      bằng kiểm thử tải.
- id: check
  kind: check
  title: Kiểm tra xử lý tình huống mất kết nối mạng liên ngân hàng
  checks:
  - 1500 // 1000 == 1 and 1500 % 1000 == 500
  - 10000000 - 0 == 10000000
  steps:
  - show: "<p><b>Tình huống phỏng vấn</b>: Gửi lệnh chuyển tiền 10 triệu đồng sang\
      \ ngân hàng bạn. Socket TCP bị đứt giữa chừng và quá 1500 ms không nhận được\
      \ bản tin 0210. Bạn xử lý thế nào?</p>\n<table class=\"t\">\n  <tr><th>hành\
      \ động sai lầm</th><th>hành động chuẩn mực Senior</th></tr>\n  <tr><td>Báo giao\
      \ dịch thất bại cho khách</td><td>Chuyển trạng thái giao dịch sang IN_DOUBT\
      \ (nghi vấn: chưa biết tiền đã sang bên kia hay chưa)</td></tr>\n  <tr><td>Tự động hoàn tiền hoặc trừ tiền lại</td><td>Kích\
      \ hoạt tiến trình tra vấn trạng thái định kỳ</td></tr>\n  <tr><td>Gây thất thoát\
      \ 10 triệu đồng của ngân hàng</td><td>Đối soát tự động với tập tin quyết toán\
      \ cuối ngày (EOD, End Of Day)</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Ta kiểm tra tình huống kinh điển khi đường truyền vật lý bị đứt quãng khiến
      yêu cầu vượt quá hạn mức 1500 mi li giây. Do đối tác chưa xác nhận nhận được
      tiền, việc báo lỗi thất bại ngay lập tức là một sai lầm rất lớn. Nếu ngân hàng
      tự ý hoàn tiền trong khi đầu bên kia đã ghi có thành công, ngân hàng có thể
      mất 10 triệu đồng nếu không đòi lại được.
  - clear: true
    show: '<div class="box key"><b>Quy tắc bảo toàn dòng tiền</b>: Vì kết quả mạng
      chưa rõ ràng, ta chuyển trạng thái sang nghi vấn. Hệ thống tự động gửi bản tin
      truy vấn trạng thái theo quy trình tra soát của NAPAS, hoặc thông báo đảo 0420
      nếu đặc tả quy định (cần kiểm với đặc tả kết nối của NAPAS). Chỉ
      hoàn tiền 10 triệu đồng khi đã xác nhận giao dịch thất bại qua tra soát hoặc
      đối soát.</div>'
    focus:
    - 0
    - 0
    say: Vì kết quả mạng chưa thể xác định, ta lập tức chuyển lệnh sang trạng thái
      nghi vấn. Tiến trình tự động sẽ truy vấn lại với cổng chuyển mạch, và chỉ hoàn
      tiền khi đã xác nhận giao dịch thất bại.
