      của hai bản tin, giải mã một bản đồ bit, mô phỏng khoá khử trùng lặp ở ba thời
      điểm và tính số giao dịch đang chờ:</p><table class="t"><tr><th>dữ kiện</th><th>giá
      trị</th></tr><tr><td>bản tin A</td><td>trường 3, 4, 11, 37, 41</td></tr><tr><td>bản
      tin B</td><td>trường 3, 4, 11, 37, 128 (cần bản đồ thứ hai)</td></tr><tr><td>giải
      mã</td><td><code>5030000000000000</code></td></tr><tr><td>khoá</td><td>gửi lại
      tối đa 40 giây, thời gian sống gấp đôi; lệnh ở giây 0, 30, 95</td></tr><tr><td>tải,
      độ trễ</td><td>2&nbsp;400 lệnh mỗi giây, 150 ms</td></tr></table><p class="note">Lưu bài làm thành tệp <code>mau.py</code> rồi chạy bằng lệnh <code>python mau.py</code>.</p>
