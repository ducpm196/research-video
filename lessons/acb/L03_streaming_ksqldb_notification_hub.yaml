      vượt 3), còn thẻ thì gửi và trừ một. Miễn cước = 90 000 × 65 ÷ 100.<br>Lời giải
      đầy đủ ở <code>labs/ACB/L03/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>'
    say: Nếu kẹt, kênh có ứng dụng thì đẩy, không thì xét số tiền từ 50 nghìn. Hàng
      ưu tiên lấy số nhỏ trước. Với xô thẻ, trước mỗi tin cộng số giây đã trôi nhưng
      không vượt ba, còn thẻ thì gửi và trừ một.
