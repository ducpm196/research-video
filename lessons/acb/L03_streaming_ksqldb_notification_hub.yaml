id: L03
course: ACB
series: Phỏng vấn Kỹ sư Tích hợp ACB
title: 'Bài 3 — Kiến trúc Streaming với ksqlDB và Kafka: Omnichannel Notification
  Hub'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/acb.yaml L03; Confluent ksqlDB documentation (CREATE STREAM AS
  SELECT, JOIN, EMIT CHANGES; audit/review/screen_code/ACB.yaml); Apache Kafka (phân
  vùng, giao ít nhất một lần); thuật toán xô thẻ (token bucket); audit/acb/verify_acb.py
  L03; mã Python 3 mô phỏng chạy thật (Kafka, ksqlDB và nhà mạng thật không chạy trên
  máy); lưu lượng, tỉ lệ cài ứng dụng, ngưỡng và thời gian là số minh hoạ, không phải
  số liệu của OCB hay ACB
assumes:
- arith
- approx
- acb_kafka
- acb_redis
- acb_dedup
- acb_microservice
- acb_core
objectives:
- 'Mô tả đường đi của một biến động số dư: bắt thay đổi từ sổ cái, đẩy vào Kafka,
  nối luồng với bảng hồ sơ, rồi chọn kênh gửi'
- Đọc câu ksqlDB nối luồng với bảng (nối trái, CASE, EMIT CHANGES) và chạy mô phỏng
  cùng lôgic chọn kênh bằng Python
- Tính lưu lượng mỗi giây, số tin đi kênh có cước và phần tiết kiệm khi định tuyến
  thông minh
- 'Chạy mô phỏng hàng đợi ưu tiên: mã OTP luôn ra trước tin quảng cáo'
- 'Chọn cách xử lý khi nhà mạng lỗi: cầu dao chuyển nhà mạng dự phòng, hàng đợi ưu
  tiên cho OTP'
- 'Nhận ra ba sai lầm: gộp OTP với quảng cáo, thiếu hàng đợi tin lỗi, không giới hạn
  tốc độ bằng xô thẻ'
- 'So sánh ×1, ×100 và ×10 000: tin mỗi giây, số tiến trình song song và số khoá chống
  trùng trong 24 giờ'
- Viết mã Python chọn kênh, xếp hàng ưu tiên và giới hạn tốc độ bằng xô thẻ với số
  mới
