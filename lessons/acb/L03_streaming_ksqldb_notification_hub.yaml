scenes:
- id: hook
  kind: hook
  title: Bài toán gửi 50 nghìn tin nhắn mỗi phút mà không làm nghẽn hệ thống
  steps:
  - show: '<p>Khi hàng triệu khách hàng đồng loạt nhận lương, mỗi giây phát sinh hàng
      chục nghìn biến động số dư.</p>

      <div class="box key">Nếu từng microservice tự gọi trực tiếp sang nhà mạng viễn
      thông, hệ thống sẽ sập do nghẽn mạng và chi phí cước viễn thông bùng nổ.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, khi hàng triệu khách hàng đồng loạt nhận lương vào đầu tháng, hệ
      thống ngân hàng phát sinh hàng chục nghìn giao dịch mỗi giây. Khách hàng mong
      muốn nhận thông báo biến động số dư tức thì trong chưa đầy một giây. Nếu mỗi
      dịch vụ tự gọi sang nhà mạng viễn thông, hệ thống sẽ nghẽn tắc ngay lập tức.
  - show: '<p>Hôm nay, ta mổ xẻ: <b>Nền tảng Confluent ksqlDB và Kafka Streams</b>,
      <b>kỹ thuật Stream-Table Join thời gian thực</b>, và <b>kiến trúc Omnichannel
      Notification Hub giảm chi phí SMS</b> (số liệu trong bài là ví dụ minh họa).</p>

      <div class="box key"><b>Kafka</b>: hệ thống lưu các sự kiện theo đúng thứ tự
      trong từng chủ đề (topic) để nhiều dịch vụ cùng đọc. <b>ksqlDB</b>: công cụ của
      hãng Confluent cho phép viết câu lệnh giống SQL để xử lý trực tiếp luồng sự kiện
      trên Kafka.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay ta cùng khám phá một kiến trúc thông báo phổ biến trong ngân hàng.
      Ta phân tích nền tảng Confluent cây-x-cu-l-đê-bê và Kafka Streams. Kafka là
      hệ thống lưu các sự kiện theo đúng thứ tự để nhiều dịch vụ cùng đọc. Còn cây-x-cu-l-đê-bê
      là công cụ cho phép viết câu lệnh giống SQL để xử lý trực tiếp luồng sự kiện
      trên Kafka. Ta tìm hiểu kỹ thuật
      kết hợp luồng dữ liệu thời gian thực. Ta cũng giải mã trung tâm thông báo đa
      kênh giúp giảm chi phí cước viễn thông cho ngân hàng.
- id: prereq
  kind: prereq
  title: 'Kiến thức nền: Stream, Table, Change Data Capture và định dạng Avro'
  checks:
  - 50000 * 60 == 3000000 and 3000000 * 24 == 72000000
  - 500 / 1000 == 0.5
  steps:
  - show: "<p><b>Bốn khái niệm nền tảng trong truyền phát dữ liệu Confluent</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>khái niệm</th><th>ý nghĩa kỹ thuật</th><th>vai\
      \ trò trong ngân hàng</th></tr>\n  <tr><td>Stream</td><td>dòng sự kiện chảy\
      \ liên tục không ngừng</td><td>chuỗi các giao dịch phát sinh theo thời gian</td></tr>\n\
      \  <tr><td>Table</td><td>ảnh chụp trạng thái hiện tại của một khóa</td><td>thông\
      \ tin hồ sơ và cài đặt nhận tin của khách</td></tr>\n  <tr><td>CDC</td><td>Change\
      \ Data Capture bắt thay đổi dữ liệu</td><td>bắt biến động số dư từ cơ sở dữ\
      \ liệu sổ cái</td></tr>\n  <tr><td>Avro Schema</td><td>định dạng nhị phân gọn\
      \ kèm lược đồ (schema) mô tả các trường</td><td>thêm trường mới mà dịch vụ cũ\
      \ vẫn đọc được</td></tr>\n\
      </table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu bốn khái niệm then chốt trong xử lý luồng dữ liệu. Luồng
      là dòng sự kiện chảy liên tục thể hiện các giao dịch vừa phát sinh. Bảng là
      ảnh chụp trạng thái mới nhất lưu trữ cài đặt nhận tin của từng khách hàng. Kỹ
      thuật bắt biến động dữ liệu giúp trích xuất tức thời các dòng tiền mới. Avro
      là định dạng ghi dữ liệu nhị phân gọn kèm lược đồ mô tả các trường, cho phép
      thêm trường mới mà dịch vụ cũ vẫn đọc được.
  - clear: true
    show: '<div class="box key">Ví dụ minh họa: ở lưu lượng giả định $50\,000$ thông
      báo mỗi phút, mỗi giờ có $50\,000 \times 60 = 3\,000\,000$ tin nhắn. Mỗi ngày
      hệ thống chuyển phát tới $72\,000\,000$ tin nhắn. Mục tiêu thiết kế độ trễ dưới
      $500$ ms, tức nửa giây tính từ lúc có biến động tới lúc khách nhận thông báo.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta xem xét một quy mô xử lý giả định để luyện tính toán. Tại mức 50 nghìn
      thông báo mỗi phút, mỗi giờ có 3 triệu bản tin được phát đi. Tổng lưu lượng
      một ngày đạt tới 72 triệu thông báo. Mục tiêu thiết kế là hoàn tất chu trình
      trong vòng 500 mi li giây để người dùng không phải chờ đợi.
