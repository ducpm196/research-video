      trùng cả ngày nhưng tốn bộ nhớ</td></tr><tr><td>1 giờ</td><td>300&nbsp;000&nbsp;000</td><td>ít
      khoá hơn; tin gửi lại sau hơn 1 giờ lọt qua</td></tr></table>
    say: 'Ở cỡ mười nghìn, giữ khoá chống trùng 24 giờ là 7 phẩy 2 tỉ khoá, quá nhiều cho bộ nhớ. Rút xuống một giờ thì còn 300 triệu khoá, đổi lại tin gửi lại sau hơn một giờ sẽ lọt qua. Với thông báo thì chấp nhận được, nhưng với lệnh chuyển tiền thì không, nên mỗi loại tin có thời gian sống riêng.'
