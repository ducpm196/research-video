- id: quiz
  kind: quiz
  title: Thử thách kiến trúc luồng dữ liệu
  checks:
  - 3 * 5 == 15
  - 50000 * 2 == 100000
  steps:
  - pause: 15
    show: "<p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong Confluent ksqlDB, tại sao\
      \ bảng hồ sơ người dùng <code>t_customer_preferences</code> nên được tạo dưới\
      \ dạng <code>TABLE</code> thay vì dạng <code>STREAM</code> khi thực hiện kết\
      \ hợp dữ liệu?</p>\n<ul>\n  <li><b>A</b>: Vì ksqlDB không cho phép\
      \ nối hai Stream với nhau, nên bảng hồ sơ buộc phải tạo dưới dạng Table.</li>\n  <li><b>B</b>: Vì Table lưu mọi thay đổi của hồ sơ theo thứ tự thời gian, nên tra cứu nhanh hơn\
      \ Stream nhiều lần.</li>\n  <li><b>C</b>: Vì Stream chỉ chạy được trên\
      \ một máy chủ đơn lẻ, còn Table chạy được trên cả cụm máy chủ.</li>\n  <li><b>D</b>: Vì Table giữ trạng thái mới nhất theo từng\
      \ số tài khoản, nên tra cấu hình nhận tin tức thì,\
      \ không quét lại lịch sử.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Hãy cùng bước vào một câu hỏi luyện tập về kiến trúc luồng dữ liệu. Trong
      công nghệ ksqlDB, tại sao bảng hồ sơ người dùng nên được tạo dưới
      dạng Bảng thay vì dạng Luồng? Bạn có 15 giây suy nghĩ trước khi nghe đáp án
      chuẩn xác.
  - clear: true
    show: '<div class="box key"><b>Đáp án chính xác là D</b>!</div>

      <p><b>Bước 1 — Bản chất của đối tượng Table trong ksqlDB</b>:</p>

      <p>Bảng đại diện cho trạng thái hiện tại của dữ liệu theo từng khoá tài khoản.
      Khi có biến động số dư, hệ thống chỉ cần lấy bản ghi cấu hình mới nhất của đúng
      khách hàng đó.</p>'
    focus:
    - 0
    - 0
    say: Đáp án chính xác là phương án D. Bước một, đối tượng Bảng duy trì trạng thái
      mới nhất cho mỗi khách hàng, giúp việc tra cứu thông tin nhận tin diễn ra tức
      thì.
  - clear: true
    show: '<p><b>Bước 2 — Tối ưu hóa hiệu năng và bộ nhớ</b>:</p>

      <div class="box key">ksqlDB vẫn cho nối hai Stream, nhưng phải kèm cửa sổ thời
      gian (<code>WITHIN</code>), chỉ ghép các sự kiện gần nhau về thời gian: hồ sơ
      khách cập nhật từ lâu sẽ không được ghép với giao dịch mới. Table giữ giá trị
      mới nhất theo từng khoá, nên mỗi giao dịch tra đúng cấu hình hiện tại mà không
      phải giữ và quét cả lịch sử thay đổi.</div>'
    focus:
    - 0
    - 0
    say: Bước hai, ksqlDB vẫn cho nối hai luồng với nhau, nhưng phải kèm
      một cửa sổ thời gian, nên hồ sơ khách cập nhật từ lâu sẽ không được ghép với
      giao dịch mới. Dạng Bảng giữ giá trị mới nhất theo từng khoá, nên mỗi giao dịch
      luôn tra được đúng cấu hình nhận tin hiện tại.
