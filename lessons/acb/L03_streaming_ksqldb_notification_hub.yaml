- id: quiz
  kind: quiz
  title: Thử thách kiến trúc luồng dữ liệu tại ACB
  checks:
  - 3 * 5 == 15
  - 50000 * 2 == 100000
  steps:
  - pause: 15
    show: "<p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong Confluent ksqlDB, tại sao\
      \ bảng hồ sơ người dùng <code>t_customer_preferences</code> phải được tạo dưới\
      \ dạng <code>TABLE</code> thay vì dạng <code>STREAM</code> khi thực hiện kết\
      \ hợp dữ liệu?</p>\n<ul>\n  <li><b>A</b>: Vì Table lưu trữ trạng thái mới nhất\
      \ của mỗi số tài khoản, cho phép tra cứu tức thời cấu hình nhận tin mà không\
      \ cần quét lại toàn bộ lịch sử.</li>\n  <li><b>B</b>: Vì ksqlDB không cho phép\
      \ hai Stream kết hợp với nhau.</li>\n  <li><b>C</b>: Vì Table giúp giảm dung\
      \ lượng ổ đĩa về bằng 0.</li>\n  <li><b>D</b>: Vì Stream chỉ chạy được trên\
      \ một máy chủ đơn lẻ.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Hãy cùng bước vào câu hỏi trắc nghiệm kiến trúc thực chiến của ACB. Trong
      công nghệ cây-x-cu-l-đê-bê, tại sao bảng hồ sơ người dùng bắt buộc phải được
      tạo dưới dạng Bảng thay vì dạng Luồng? Bạn có 15 giây suy nghĩ trước khi nghe
      đáp án chuẩn xác.
  - clear: true
    show: '<div class="box key"><b>Đáp án chính xác là A</b>!</div>

      <p><b>Bước 1 — Bản chất của đối tượng Table trong ksqlDB</b>:</p>

      <p>Bảng đại diện cho trạng thái hiện tại của dữ liệu theo từng khóa tài khoản.
      Khi có biến động số dư, hệ thống chỉ cần lấy bản ghi cấu hình mới nhất của đúng
      khách hàng đó.</p>'
    focus:
    - 0
    - 0
    say: Đáp án chính xác là phương án A. Bước một, đối tượng Bảng duy trì trạng thái
      mới nhất cho mỗi khách hàng, giúp việc tra cứu thông tin nhận tin diễn ra tức
      thì.
  - clear: true
    show: '<p><b>Bước 2 — Tối ưu hóa hiệu năng và bộ nhớ</b>:</p>

      <div class="box key">Nếu dùng Stream, hệ thống phải lưu và quét qua hàng triệu
      bản ghi lịch sử, gây lãng phí bộ nhớ và làm tăng độ trễ vượt quá ngưỡng $500$
      ms. Mô hình Stream-Table Join giúp hệ thống hướng tới mục tiêu ví dụ $50\,000$
      tin nhắn mỗi phút.</div>'
    focus:
    - 0
    - 0
    say: Bước hai, nếu dùng dạng Luồng, hệ thống sẽ phải lưu trữ toàn bộ lịch sử thay
      đổi khiến bộ nhớ bị quá tải. Kỹ thuật kết hợp giữa Luồng và Bảng là bí quyết
      cốt lõi giúp hệ thống đạt hiệu năng đỉnh cao.
