- id: symbol
  kind: symbol
  title: Cú pháp câu lệnh Stream-Table Join trong ksqlDB
  steps:
  - show: '<p><b>Câu lệnh ksqlDB phân luồng thông báo tự động theo thời gian thực</b>:</p>

      <div class="box code"><code>CREATE STREAM s_routed_notifications AS<br/>

      SELECT e.account_no, e.amount, e.balance, p.phone_number, p.email,<br/>

      &nbsp;&nbsp;CASE WHEN p.is_app_installed = TRUE THEN ''OTT_PUSH''<br/>

      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WHEN e.amount >= 50000 THEN ''SMS_BRANDNAME''
      ELSE ''EMAIL'' END AS target_channel<br/>

      FROM s_balance_events e LEFT JOIN t_customer_preferences p<br/>

      ON e.account_no = p.account_no EMIT CHANGES;</code></div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Câu lệnh cây-x-cu-l-đê-bê thể hiện sức mạnh xử lý luồng tức thời. Ta tạo
      một luồng mới bằng cách kết hợp luồng sự kiện giao dịch với bảng hồ sơ khách
      hàng. Mệnh đề điều kiện kiểm tra nếu khách hàng đã cài ứng dụng di động thì
      định tuyến sang thông báo đẩy miễn phí. Nếu chưa cài ứng dụng và số tiền lớn
      hơn 50 nghìn đồng, hệ thống sẽ gửi tin nhắn viễn thông có phí.
- id: example
  kind: example
  title: Tính toán tối ưu hóa chi phí và hiệu năng chuyển phát
  checks:
  - 50000 // 60 == 833 and 833 * 60 == 49980
  - 50000 * 70 // 100 == 35000
  - 50000 - 35000 == 15000
  steps:
  - show: '<p><b>Bước 1 — Tính lưu lượng xử lý mỗi giây (TPS) của luồng thông báo</b>:</p>

      <div class="box key">Lưu lượng tổng: $50\,000$ tin nhắn mỗi phút.<br/>

      Lưu lượng mỗi giây: $50\,000 / 60 \approx 833$ tin nhắn mỗi giây.<br/>

      Tại thời điểm đỉnh tải: hệ thống cần xử lý tới $1\,500$ thông báo mỗi giây.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta tính toán lưu lượng trung bình mỗi giây của đường ống thông
      báo. Với 50 nghìn tin nhắn mỗi phút, tốc độ xử lý tương đương xấp xỉ 833 tin
      nhắn trong một giây. Do đó, cụm máy chủ cần được cấu hình nhóm xử lý song song
      để đáp ứng mức đỉnh 1500 lệnh mỗi giây.
  - clear: true
    show: "<p><b>Bước 2 — Tính toán tỉ lệ tiết kiệm chi phí viễn thông</b> (tỉ lệ giả định):</p>\n\
      <table class=\"t\">\n  <tr><th>kênh chuyển phát</th><th>tỉ lệ phân luồng</th><th>số\
      \ lượng tin/phút</th><th>chi phí phát sinh</th></tr>\n  <tr><td>OTT App Push</td><td>$70\\\
      %$ khách cài ứng dụng</td><td>$50\\,000 \\times 70\\% = 35\\,000$ tin</td><td>$0$\
      \ đồng (hoàn toàn miễn phí)</td></tr>\n  <tr><td>SMS Brandname</td><td>$30\\\
      %$ chưa cài ứng dụng</td><td>$50\\,000 - 35\\,000 = 15\\,000$ tin</td><td>chỉ\
      \ trả cước cho $15\\,000$ tin</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, ta tính toán bài toán kinh tế khi định tuyến thông minh. Giả định
      70 phần trăm khách hàng đã cài ứng dụng di động, ta chuyển 35 nghìn tin sang
      dạng thông báo đẩy miễn phí. Do đó, ngân hàng chỉ phải trả cước viễn thông cho
      15 nghìn tin nhắn trong mỗi phút.
  - clear: true
    show: '<p><b>Bước 3 — Cơ chế bảo vệ chống gửi tin nhắn trùng lặp</b>:</p>

      <div class="box key">Thiết lập bộ nhớ đệm phân tán: <code>SET noti:sent:{event_id}
      1 EX 86400 NX</code>.<br/>

      Khóa lưu giữ trong $86\,400$ giây $= 24$ giờ. Giảm thiểu hiện tượng khách hàng
      nhận 2 tin nhắn trừ tiền giống nhau (Kafka giao ít nhất một lần nên không cam
      kết tuyệt đối).</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước ba, ta thiết lập khóa chống gửi tin nhắn trùng lặp trong bộ nhớ đệm
      phân tán. Khóa được giữ trong 24 giờ tương đương 86 nghìn 400 giây. Nhờ lệnh
      nguyên tử này, phần lớn bản tin trùng lặp do mạng chập chờn bị loại bỏ ngay
      lập tức.
