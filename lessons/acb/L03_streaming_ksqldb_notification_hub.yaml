- id: quymo
  kind: example
  title: 'Quy mô và thời gian: trung tâm thông báo ở ×1, ×100 và ×10 000 (số minh
    hoạ)'
  checks:
  - 500 // 60 == 8 and round(500 / 60, 1) == 8.3 and 50000 // 60 == 833 and 5000000
    // 60 == 83333
  - -(-1500 // 500) == 3 and 150000 // 500 == 300 and round(1500 / (50000 / 60), 2) == 1.8
  - -(-(5000000 / 60) // 500) == 167 and -(-(50000 / 60) // 500) == 2 and -(-(500
    / 60) // 500) == 1
  - 500 * 60 * 24 == 720000 and 50000 * 60 * 24 == 72000000 and 5000000 * 60 * 24
    == 7200000000 and 5000000 * 60 == 300000000
  steps:
  - show: '<p>Mỗi tiến trình xử lý $500$ tin mỗi giây, khoá chống trùng sống $24$
      giờ (số minh hoạ):</p><table class="t"><tr><th>cỡ</th><th>tin mỗi phút</th><th>tin
      mỗi giây</th><th>tiến trình (trung bình)</th><th>khoá
      chống trùng 24 giờ</th><th>chọn gì</th></tr><tr><td>×1</td><td>500</td><td>8,3</td><td>1</td><td>720&nbsp;000</td><td>một
      tiến trình, một phân vùng</td></tr><tr><td>×100</td><td>50&nbsp;000</td><td>833</td><td>2</td><td>72&nbsp;000&nbsp;000</td><td>vài
      phân vùng, hàng đợi ưu tiên cho OTP</td></tr><tr><td>×10&nbsp;000</td><td>5&nbsp;000&nbsp;000</td><td>83&nbsp;333</td><td>167</td><td>7&nbsp;200&nbsp;000&nbsp;000</td><td>hàng
      trăm phân vùng, chia theo mã tài khoản, rút ngắn khoá sống</td></tr></table><p
      class="note">Số tiến trình: $83\,333 / 500 \approx 166{,}7$, làm tròn lên $167$;
      khoá $= 5\,000\,000 \times 60 \times 24 = 7\,200\,000\,000$.</p><p class="note">Theo đỉnh $1\,500$ tin mỗi giây (gấp $1{,}8$ lần): ×100 cần $1\,500 / 500 = 3$ tiến trình, ×10 000 cần $300$.</p><p class="note">Phân vùng (partition) = một ngăn của chủ đề Kafka, giữ một phần sự kiện; mỗi ngăn do một tiến trình đọc.</p>'
    say: Ta tăng lượng tin theo số minh hoạ. Ở cỡ một, 500 tin mỗi phút, tức khoảng
      tám tin mỗi giây, một tiến trình là đủ. Tiến trình là một bản chương trình đọc tin chạy riêng. Ở cỡ một trăm, đúng 50 nghìn tin mỗi
      phút của ví dụ, cần hai tiến trình theo tải trung bình, nhưng đỉnh 1500 tin mỗi giây của ví dụ cần ba. Vì vậy Kafka phải chia chủ đề thành ít nhất ba phân vùng. Phân vùng là một ngăn giữ một phần sự kiện, và mỗi ngăn do một tiến trình đọc. Ở cỡ mười nghìn, hơn 83 nghìn tin mỗi giây, cần 167 tiến trình theo
      trung bình, và đỉnh cần cỡ 300, tức hàng trăm phân vùng. Khi chia thế này, thứ tự chỉ được giữ trong từng phân
      vùng, nên ta chia theo mã tài khoản để tin của một khách vẫn đúng thứ tự.
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    introduces:
    - acb_partition
  - show: <div class="box key"><b>Theo thời gian:</b> ở ×10 000, khoá sống $24$ giờ
