- id: symbol
  kind: symbol
  title: Cú pháp câu lệnh Stream-Table Join trong ksqlDB
  steps:
  - show: '<p><b>Đọc trước</b> bốn cụm sẽ gặp trong câu lệnh ksqlDB ở khung kế tiếp:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>SELECT … FROM …</code></td><td>chọn các cột (SELECT) từ một nguồn dữ liệu (FROM)</td><td><code>SELECT e.amount FROM s_balance_events e</code>: lấy cột số tiền từ luồng giao dịch</td></tr><tr><td><code>CASE WHEN … THEN … ELSE … END</code></td><td>nếu … thì … nếu không thì …; END đóng khối</td><td>nếu đã cài ứng dụng thì ''OTT_PUSH'', nếu không thì xét tiếp</td></tr><tr><td><code>AS target_channel</code></td><td>AS đặt tên cho kết quả vừa tính; <code>target_channel</code> là tên cột mới, nghĩa là kênh đích</td><td>cột mới này chứa ''OTT_PUSH'', ''SMS_BRANDNAME'' hoặc ''EMAIL''</td></tr><tr><td><code>CREATE STREAM tên AS</code></td><td>tạo một luồng mới có tên đó, nội dung là kết quả của câu SELECT phía sau</td><td><code>s_routed_notifications</code> là luồng mới</td></tr></table>'
    say: Trước khi đọc cả câu lệnh, ta đọc bốn cụm lạ. Cụm đầu chọn các cột từ một nguồn dữ liệu. Cụm điều kiện nghĩa là nếu thì, nếu không thì, và có chữ kết thúc để đóng khối. Chữ đặt tên cho kết quả vừa tính, ở đây là cột mới chứa kênh đích. Cụm cuối tạo một luồng mới có tên đó, nội dung là kết quả của phần chọn phía sau.
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
    show: '<p><b>Câu lệnh ksqlDB phân luồng thông báo tự động theo thời gian thực</b>:</p>

      <div class="box code"><code>CREATE STREAM s_routed_notifications AS<br/>

      SELECT e.account_no, e.amount, e.balance, p.phone_number, p.email,<br/>

      &nbsp;&nbsp;CASE WHEN p.is_app_installed = TRUE THEN ''OTT_PUSH''<br/>

      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WHEN e.amount >= 50000 THEN ''SMS_BRANDNAME''
      ELSE ''EMAIL'' END AS target_channel<br/>

      FROM s_balance_events e LEFT JOIN t_customer_preferences p<br/>

      ON e.account_no = p.account_no EMIT CHANGES;</code></div>

      <p><code>LEFT JOIN</code>: giữ mọi giao dịch kể cả khi chưa có hồ sơ khách;
      <code>EMIT CHANGES</code>: đẩy kết quả ra liên tục mỗi khi có sự kiện mới. <code>SELECT</code> chọn cột, <code>CASE WHEN</code> là nếu thì, <code>ON</code> ghép hai bên theo cột chung. Ngưỡng 50000 là số minh hoạ.</p><p class="note">Cách đọc tên: <code>s_balance_events e</code> đặt tên gọn <code>e</code> cho luồng giao dịch, <code>t_customer_preferences p</code> đặt tên gọn <code>p</code> cho bảng hồ sơ khách; <code>e.amount</code> là cột amount (số tiền) của bên <code>e</code>, <code>p.email</code> là cột email của bên <code>p</code>.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Câu lệnh ksqlDB thể hiện sức mạnh xử lý luồng tức thời. Ta tạo
      một luồng mới bằng cách kết hợp luồng sự kiện giao dịch với bảng hồ sơ khách
      hàng. Câu lệnh chọn các cột cần dùng và ghép hai bên theo số tài khoản chung. Chữ e và chữ pê là tên gọn ta đặt cho hai bên, nên e chấm số tiền nghĩa là cột số tiền của luồng giao dịch. Mệnh đề điều kiện kiểm tra nếu khách hàng đã cài ứng dụng di động thì
      định tuyến sang thông báo đẩy không mất cước nhà mạng. Nếu chưa cài ứng dụng
      và số tiền từ 50 nghìn đồng trở lên, một ngưỡng minh hoạ, hệ thống sẽ gửi tin nhắn viễn thông có
      phí, còn lại thì gửi thư điện tử. Phép nối trái giữ lại mọi giao dịch kể cả
      khi chưa có hồ sơ khách. Mệnh đề phát thay đổi khiến kết quả được đẩy ra liên
      tục mỗi khi có sự kiện mới.
- id: example
  kind: example
  title: Tính toán tối ưu hóa chi phí và hiệu năng chuyển phát
  checks:
  - 50000 // 60 == 833 and 833 * 60 == 49980
  - 50000 * 70 // 100 == 35000
  - 50000 - 35000 == 15000
  steps:
  - show: '<p><b>Bước 1 — Tính lưu lượng xử lý mỗi giây (TPS) của luồng thông báo</b>:</p>

      <div class="box key">Lưu lượng tổng: $50\,000$ tin nhắn mỗi phút.<br/>

      Lưu lượng mỗi giây: $50\,000 / 60 \approx 833$ tin nhắn mỗi giây.<br/>

      Tại thời điểm đỉnh tải (giả định): hệ thống cần xử lý tới $1\,500$ thông báo
      mỗi giây.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta tính toán lưu lượng trung bình mỗi giây của đường ống thông
      báo. Với 50 nghìn tin nhắn mỗi phút, tốc độ xử lý tương đương xấp xỉ 833 tin
      nhắn trong một giây. Do đó, cụm máy chủ cần được cấu hình nhóm xử lý song song
      để đáp ứng mức đỉnh giả định 1500 lệnh mỗi giây.
  - clear: true
    show: "<p><b>Bước 2 — Tính toán tỉ lệ tiết kiệm chi phí viễn thông</b> (tỉ lệ\
      \ giả định):</p>\n<table class=\"t\">\n  <tr><th>kênh chuyển phát</th><th>tỉ\
      \ lệ phân luồng</th><th>số lượng tin/phút</th><th>chi phí phát sinh</th></tr>\n\
      \  <tr><td>OTT App Push</td><td>$70\\%$ số tin thuộc khách đã cài ứng dụng</td><td>$50\\\
      ,000 \\times 70\\% = 35\\,000$ tin</td><td>không trả cước nhà mạng</td></tr>\n\
      \  <tr><td>SMS Brandname hoặc Email</td><td>$30\\%$ chưa cài ứng dụng</td><td>$50\\\
      ,000 - 35\\,000 = 15\\,000$ tin</td><td>trả cước SMS cho nhiều nhất $15\\,000$\
      \ tin (tin dưới 50 nghìn đi Email)</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, ta tính toán bài toán kinh tế khi định tuyến thông minh. Giả định
      70 phần trăm số tin thuộc khách đã cài ứng dụng di động, ta chuyển 35 nghìn
      tin sang dạng thông báo đẩy không mất cước nhà mạng. Do đó, ngân hàng chỉ phải
      trả cước viễn thông cho nhiều nhất 15 nghìn tin nhắn mỗi phút, vì tin dưới 50
      nghìn đồng được gửi qua thư điện tử.
  - clear: true
    show: '<p><b>Đọc trước</b> lệnh Redis ở bước 3, từng phần:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>SET khoá giá-trị</code></td><td>ghi một giá trị vào Redis dưới một tên khoá</td><td><code>SET a 1</code>: khoá a giữ giá trị 1</td></tr><tr><td><code>noti:sent:{event_id}</code></td><td>tên khoá; <code>{event_id}</code> là chỗ giữ chỗ, được thay bằng mã sự kiện thật</td><td>sự kiện 77 thì khoá là <code>noti:sent:77</code></td></tr><tr><td><code>EX 86400</code></td><td>khoá tự xoá sau 86400 giây</td><td>86400 giây là 24 giờ</td></tr><tr><td><code>NX</code></td><td>chỉ ghi nếu khoá CHƯA có; nếu có rồi thì không ghi và báo thất bại</td><td>lần gửi thứ hai cùng sự kiện bị chặn</td></tr></table>'
    say: 'Trước bước ba, ta đọc lệnh ghi khoá từng phần. Lệnh ghi một giá trị vào Redis dưới một tên khoá. Phần trong ngoặc nhọn là chỗ giữ chỗ, được thay bằng mã sự kiện thật. Cụm thời hạn cho khoá tự xoá sau 86400 giây, tức 24 giờ. Cụm cuối chỉ cho ghi nếu khoá chưa có, nên lần gửi thứ hai cùng sự kiện bị chặn.'
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
    show: '<p><b>Bước 3 — Cơ chế bảo vệ chống gửi tin nhắn trùng lặp</b>:</p>

      <div class="code"><div>SET noti:sent:{event_id} 1 EX 86400 NX</div></div>

      <div class="box key">Khoá lưu giữ trong $86\,400$ giây $= 24$ giờ. Giảm thiểu hiện tượng khách hàng
      nhận 2 tin nhắn trừ tiền giống nhau (ở cấu hình mặc định Kafka giao ít nhất một lần, và việc gửi SMS ra ngoài Kafka
      không nằm trong cam kết đó, nên không tuyệt đối).<br/>

      Đặt khoá TRƯỚC khi gửi (NX: chỉ đặt được nếu chưa có), và xoá khoá khi gửi lỗi,
      để không chặn nhầm lần gửi lại. Rủi ro: máy sập giữa lúc đã đặt khoá mà chưa
      gửi thì khoá còn tới 24 giờ và tin bị bỏ nhầm, nên cần đối soát hoặc gửi bù.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Bước ba, ta thiết lập khoá chống gửi tin nhắn trùng lặp trong bộ nhớ đệm phân tán. Lệnh này nguyên tử, nghĩa là kiểm khoá và ghi khoá trong một bước, không ai chen vào được. Ta đặt khoá trước khi gửi và xoá khoá nếu gửi lỗi, nên phần lớn bản tin trùng lặp bị loại ngay. Nhưng máy sập giữa chừng có thể làm mất tin, nên cần đối soát, tức hai bên so sổ giao dịch xem từng khoản có khớp không, hoặc gửi bù. Ở cấu hình mặc định, Kafka giao ít nhất một lần, nghĩa là một sự kiện có thể đến hai lần. Việc gửi tin ra ngoài Kafka lại không nằm trong cam kết đó, nên ta cần khoá này.'
- id: code
  kind: example
  title: 'Chạy thử bằng mã Python (mô phỏng): chọn kênh gửi và hàng đợi ưu tiên'
  checks:
  - '[(''OTT_PUSH'' if a else (''SMS_BRANDNAME'' if t >= 50000 else ''EMAIL'')) for
    a, t in [(True, 20000), (False, 80000), (False, 30000), (None, 80000)]] == [''OTT_PUSH'',
    ''SMS_BRANDNAME'', ''EMAIL'', ''SMS_BRANDNAME'']'
  - sorted([(2, 'quang cao'), (1, 'ma OTP'), (2, 'tin thuong')]) == [(1, 'ma OTP'),
    (2, 'quang cao'), (2, 'tin thuong')]
  steps:
  - show: '<p><b>Đọc trước</b> bốn dòng lạ của mã Python ở khung kế tiếp (mô phỏng, số minh hoạ):</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>def kenh(co_app, tien):</code> và <code>return</code></td><td>def đặt tên <code>kenh</code> cho một đoạn lệnh nhận hai giá trị; return trả kết quả về và dừng hàm</td><td><code>kenh(True, 20000)</code> trả về <code>"OTT_PUSH"</code></td></tr><tr><td><code>if co_app:</code> và <code>if tien &gt;= 50000:</code></td><td>nếu giá trị đúng thì chạy các dòng thụt vào bên dưới; <code>False</code> và <code>None</code> (rỗng) đều coi là sai; <code>&gt;=</code> là lớn hơn hoặc bằng</td><td><code>50000 &gt;= 50000</code> đúng; <code>30000 &gt;= 50000</code> sai</td></tr><tr><td><code>for co_app, tien in [(True, 20000), …]:</code></td><td>lặp qua từng cặp trong danh sách; mỗi vòng gán hai giá trị của cặp vào hai tên</td><td>vòng một: <code>co_app</code> = True, <code>tien</code> = 20000</td></tr><tr><td><code>print(co_app, tien, kenh(co_app, tien))</code></td><td>in ba giá trị ra màn hình, cách nhau một khoảng trắng</td><td>dòng in đầu: <code>True 20000 OTT_PUSH</code></td></tr></table>'
    say: Trước khi đọc mã, ta đọc bốn dòng lạ. Dòng định nghĩa hàm đặt tên cho một đoạn lệnh nhận hai giá trị, và lệnh trả về đưa kết quả ra rồi dừng hàm. Dòng điều kiện chỉ chạy các dòng thụt vào bên dưới khi giá trị đúng, còn giá trị rỗng được coi là sai, và dấu lớn hơn hoặc bằng so sánh hai số. Dòng vòng lặp đi qua từng cặp trong danh sách, mỗi vòng gán cặp đó vào hai tên. Lệnh in hiện các giá trị ra màn hình, cách nhau một khoảng trắng.
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
    show: <p><b>Mô phỏng bằng Python</b> — Kafka và ksqlDB thật không chạy trên máy
      này (số minh hoạ):</p><div class="code"><div>def kenh(co_app, tien):</div><div>    if
      co_app:</div><div>        return "OTT_PUSH"</div><div>    if tien &gt;= 50000:</div><div>        return
      "SMS_BRANDNAME"</div><div>    return "EMAIL"</div><div>for co_app, tien in [(True,
      20000), (False, 80000), (False, 30000), (None, 80000)]:</div><div>    print(co_app,
      tien, kenh(co_app, tien))</div></div><p><b>Kết quả khi chạy</b></p><div class="code"><div>True
      20000 OTT_PUSH</div><div>False 80000 SMS_BRANDNAME</div><div>False 30000 EMAIL</div><div>None
      80000 SMS_BRANDNAME</div></div>
    say: Đây là mô phỏng bằng ngôn ngữ Python, vì Kafka và ksqlDB thật không chạy
      được trên máy của bạn. Hàm làm lại đúng cách chọn của câu điều kiện ở trên.
      Khách có ứng dụng thì gửi thông báo đẩy, chưa có mà số tiền từ 50 nghìn trở
      lên thì gửi tin nhắn, còn lại gửi thư điện tử. Giá trị rỗng ở dòng cuối nghĩa
      là chưa có hồ sơ khách, kết quả của phép nối trái khi không có dòng khớp. Vì
      giá trị rỗng không đúng, giao dịch đó rơi xuống điều kiện số tiền và vẫn được
      gửi, không bị mất.
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
  - clear: true
    show: '<p><b>Đọc trước</b> bốn dòng lạ của hàng đợi ưu tiên (thư viện có sẵn của Python):</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>import heapq</code></td><td>nạp thư viện hàng ưu tiên; sau đó gọi hàm của nó bằng <code>heapq.tên_hàm</code></td><td><code>heapq.heappush</code> là hàm đẩy vào</td></tr><tr><td><code>hang = []</code></td><td>tạo danh sách rỗng, đặt tên <code>hang</code></td><td>chưa có tin nào trong hàng</td></tr><tr><td><code>heappush</code> và <code>heappop</code></td><td>push đẩy một cặp (số ưu tiên, nội dung) vào; pop lấy ra cặp có số nhỏ nhất</td><td>đẩy (2, "a") rồi (1, "b"): pop ra (1, "b") trước</td></tr><tr><td><code>while hang:</code></td><td>lặp chừng nào danh sách còn phần tử; hết thì dừng</td><td>3 tin trong hàng thì vòng chạy đúng 3 lần</td></tr></table>'
    say: Tiếp theo là hàng đợi ưu tiên, ta cũng đọc trước bốn dòng lạ. Dòng đầu nạp thư viện hàng ưu tiên có sẵn của Python. Dòng sau tạo danh sách rỗng tên hang. Hai lệnh đẩy vào và lấy ra làm việc với cặp gồm số ưu tiên và nội dung, lấy ra luôn lấy số nhỏ nhất. Dòng vòng lặp chạy chừng nào danh sách còn phần tử.
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
