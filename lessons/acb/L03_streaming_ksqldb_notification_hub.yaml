      qua ứng dụng, gọi là OTT, không phải trả cước nhà mạng, còn tin nhắn SMS mang
      tên ngân hàng thì tính cước từng tin.
- id: symbol
  kind: symbol
  title: Cú pháp câu lệnh Stream-Table Join trong ksqlDB
  steps:
  - show: '<p><b>Câu lệnh ksqlDB phân luồng thông báo tự động theo thời gian thực</b>:</p>

      <div class="box code"><code>CREATE STREAM s_routed_notifications AS<br/>

      SELECT e.account_no, e.amount, e.balance, p.phone_number, p.email,<br/>

      &nbsp;&nbsp;CASE WHEN p.is_app_installed = TRUE THEN ''OTT_PUSH''<br/>

      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;WHEN e.amount >= 50000 THEN ''SMS_BRANDNAME''
      ELSE ''EMAIL'' END AS target_channel<br/>

      FROM s_balance_events e LEFT JOIN t_customer_preferences p<br/>

      ON e.account_no = p.account_no EMIT CHANGES;</code></div>

      <p><code>LEFT JOIN</code>: giữ mọi giao dịch kể cả khi chưa có hồ sơ khách;
      <code>EMIT CHANGES</code>: đẩy kết quả ra liên tục mỗi khi có sự kiện mới.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Câu lệnh cây-x-cu-l-đê-bê thể hiện sức mạnh xử lý luồng tức thời. Ta tạo
      một luồng mới bằng cách kết hợp luồng sự kiện giao dịch với bảng hồ sơ khách
      hàng. Mệnh đề điều kiện kiểm tra nếu khách hàng đã cài ứng dụng di động thì
      định tuyến sang thông báo đẩy không mất cước nhà mạng. Nếu chưa cài ứng dụng
      và số tiền từ 50 nghìn đồng trở lên, hệ thống sẽ gửi tin nhắn viễn thông có
      phí, còn lại thì gửi thư điện tử. Phép nối trái giữ lại mọi giao dịch kể cả
      khi chưa có hồ sơ khách. Mệnh đề phát thay đổi khiến kết quả được đẩy ra liên
      tục mỗi khi có sự kiện mới.
- id: example
  kind: example
  title: Tính toán tối ưu hóa chi phí và hiệu năng chuyển phát
  checks:
  - 50000 // 60 == 833 and 833 * 60 == 49980
  - 50000 * 70 // 100 == 35000
  - 50000 - 35000 == 15000
  steps:
  - show: '<p><b>Bước 1 — Tính lưu lượng xử lý mỗi giây (TPS) của luồng thông báo</b>:</p>

      <div class="box key">Lưu lượng tổng: $50\,000$ tin nhắn mỗi phút.<br/>

      Lưu lượng mỗi giây: $50\,000 / 60 \approx 833$ tin nhắn mỗi giây.<br/>

      Tại thời điểm đỉnh tải (giả định): hệ thống cần xử lý tới $1\,500$ thông báo
      mỗi giây.</div>'
    focus:
