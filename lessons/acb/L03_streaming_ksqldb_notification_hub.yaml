    say: Nhìn lên sơ đồ luồng dữ liệu truyền phát. Bước một, cơ chế bắt biến động
      dữ liệu trích xuất giao dịch từ Core Banking và đẩy vào hàng đợi sự kiện. Bước
      hai, máy chủ cây-x-cu-l-đê-bê kết hợp luồng giao dịch với bảng hồ sơ khách hàng
