      <tr><td><code>da_dung = set()</code>, <code>in</code>, <code>.add</code></td><td><code>set()</code> là tập rỗng, mỗi giá trị chỉ một lần; <code>in</code> hỏi giá trị đã có trong tập chưa; <code>.add</code> thêm vào tập</td><td>vé đã dùng nằm trong <code>da_dung</code></td></tr></table>
