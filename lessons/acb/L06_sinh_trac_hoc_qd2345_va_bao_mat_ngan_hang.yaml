      <ul>
        <li><b>A</b>: Vì máy chủ ngân hàng không thể xử lý hai bước cùng lúc trên cùng một giao dịch của một khách hàng.</li>
        <li><b>B</b>: Vì Core Banking chỉ nhận lệnh trừ tiền khi đã có sẵn ảnh khuôn mặt của khách lưu trong bộ nhớ của nó.</li>
        <li><b>C</b>: Vì thẻ căn cước công dân của khách sẽ bị khoá tự động nếu hai bước được chạy song song với nhau.</li>
        <li><b>D</b>: Vì nếu trừ tiền trước hoặc song song, khi quét mặt thất bại thì khách đã bị trừ tiền và ngân hàng phải hoàn tiền phức tạp.</li>
      </ul>
    focus:
    - 0
    - 0
    - 0
