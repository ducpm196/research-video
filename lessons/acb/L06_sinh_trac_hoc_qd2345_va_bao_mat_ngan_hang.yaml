scenes:
- id: hook
  kind: hook
  title: Bài toán bảo vệ tài khoản ngân hàng trước làn sóng Deepfake và Lừa đảo
  steps:
  - show: '<p>Quyết định 2345/QĐ-NHNN ban hành ngày 18/12/2023, có hiệu lực từ ngày
      01/07/2024, bắt buộc xác thực sinh trắc học.</p>

      <div class="box key">Giao dịch chuyển tiền trực tuyến trên 10 triệu đồng/lần,
      hoặc giao dịch làm tổng trong ngày vượt 20 triệu đồng, phải xác thực sinh trắc
      học khớp với dữ liệu đã đối chiếu chip căn cước (hoặc VNeID).</div>'
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, trước làn sóng lừa đảo công nghệ cao và giả mạo khuôn mặt, Ngân
      hàng Nhà nước đã ban hành Quyết định 2345. Mọi giao dịch chuyển tiền giá trị
      lớn đều bắt buộc phải đối soát khuôn mặt với căn cước công dân gắn chíp. Đây
      là một lớp bảo vệ quan trọng cho tài sản của khách hàng.
  - clear: true
    show: "<table class=\"t\">\n  <tr><th>thách thức kỹ thuật</th><th>nguy cơ bảo\
      \ mật</th><th>giải pháp kiến trúc chuẩn Senior</th></tr>\n  <tr><td>Kẻ gian\
      \ dùng video giả mạo Deepfake</td><td>Tài khoản bị chiếm đoạt số tiền lớn</td><td>SDK\
      \ kiểm tra độ sống Liveness Detection 3D</td></tr>\n  <tr><td>Cổng xác thực\
      \ quốc gia bị nghẽn mạng</td><td>Giao dịch của khách hàng bị treo đứng</td><td>Bộ\
      \ đệm phiên làm việc và kiểm tra tải tự động</td></tr>\n  <tr><td>Kẻ xấu gọi\
      \ thẳng API hạch toán Core</td><td>Bỏ qua bước quét khuôn mặt trên ứng dụng</td><td>Điều\
      \ kiện tiên quyết SAGA Pre-condition Gate</td></tr>\n</table>\n<p>Hôm nay, ta\
      \ giải mã: <b>Chuẩn an ninh Quyết định 2345</b>, <b>cơ chế kiểm tra độ sống\
      \ chống giả mạo</b>, và <b>kiến trúc cổng xác thực sinh trắc học an toàn</b>.</p>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá trọn vẹn kiến trúc an ninh này. Ta tìm hiểu
      tiêu chuẩn xác thực sinh trắc học theo quy định ngân hàng. Ta nắm vững cơ chế
      kiểm tra độ sống chống video giả mạo. Ta cũng làm chủ cổng bảo mật làm điều
      kiện tiên quyết trong điều phối giao dịch.
- id: prereq
  kind: prereq
  title: 'Ôn lại: Ngưỡng giao dịch 10 triệu, Dữ liệu chip CCCD và Giao thức mTLS'
  checks:
  - 10000000 + 10000000 == 20000000
  - 20000000 // 10000000 == 2
  steps:
  - show: "<p><b>Ba quy tắc vàng trong Quyết định 2345 của Ngân hàng Nhà nước</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>hạn mức giao dịch</th><th>yêu cầu bắt buộc</th><th>hình\
      \ thức xác thực</th></tr>\n  <tr><td>Không quá 10 triệu đồng/lần</td><td>Xác thực\
      \ tiêu chuẩn</td><td>Mã PIN hoặc OTP ứng dụng ngân hàng</td></tr>\n  <tr><td>Trên\
      \ 10 triệu đồng/lần</td><td>Bắt buộc sinh trắc học</td><td>Khuôn mặt\
      \ khớp dữ liệu đã đối chiếu chíp CCCD</td></tr>\n  <tr><td>Tổng giao dịch ngày\
      \ vượt 20 triệu</td><td>Bắt buộc sinh trắc học</td><td>Ở giao dịch làm tổng\
      \ vượt 20 triệu (lệnh sau đó: đối chiếu Quyết định 2345)</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước tiên ta ôn lại ba quy tắc vàng trong Quyết định 2345. Giao dịch không
      quá mười triệu đồng chỉ cần xác thực mã pin hoặc mật mã dùng một lần. Khi số
      tiền trên mười triệu đồng, khách hàng bắt buộc phải quét khuôn mặt. Nếu một
      giao dịch làm tổng tiền chuyển trong ngày vượt 20 triệu đồng, giao dịch đó phải
      xác thực sinh trắc học.
  - clear: true
    show: '<div class="box key">Ví dụ: Buổi sáng khách chuyển $8$ triệu đồng (chưa
      cần khuôn mặt). Buổi chiều khách chuyển tiếp $14$ triệu đồng $\to$ Vượt hạn mức
      $10$ triệu và tổng ngày đạt $22$ triệu đồng.<br/>

      Cả hai điều kiện đều chạm ngưỡng, hệ thống kích hoạt cổng sinh trắc học ngay
      lập tức!</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Ta xét một ví dụ thực tế trên ứng dụng ngân hàng. Buổi sáng khách hàng chuyển
      tám triệu đồng thành công mà chưa cần quét mặt. Buổi chiều khách chuyển tiếp
      14 triệu đồng khiến tổng tiền trong ngày lên 22 triệu đồng. Cổng thanh toán
      lập tức yêu cầu nhận diện khuôn mặt trước khi hạch toán.
