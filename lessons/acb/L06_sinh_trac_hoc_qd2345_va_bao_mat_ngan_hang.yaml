scenes:
- id: hook
  kind: hook
  title: Bài toán bảo vệ tài khoản ngân hàng trước làn sóng Deepfake và Lừa đảo
  steps:
  - show: |-
      <p>Xác thực sinh trắc học cho chuyển tiền trực tuyến liên quan hai văn bản của Ngân hàng Nhà nước:</p><ul><li><b>Thông tư 50/2024/TT-NHNN</b>, sửa đổi bởi Thông tư 77/2025/TT-NHNN (hiệu lực 01/03/2026; bản hợp nhất 25/VBHN-NHNN, chưa kiểm).</li><li><b>Quyết định 2345/QĐ-NHNN</b> (theo bài phỏng vấn đã lưu: ngày 18/12/2023, hiệu lực 01/07/2024) — <b>chưa đọc nguyên văn</b>, chưa rõ còn áp dụng hay đã được Thông tư thay.</li></ul><div class="box warn">Bài dùng ngưỡng báo chí và ngân hàng nêu: giao dịch trên 10 triệu đồng một lần, hoặc tổng ngày vượt 20 triệu, phải xác thực sinh trắc học khớp dữ liệu chip căn cước (hoặc VNeID, ứng dụng định danh điện tử của nhà nước). Có nơi gắn con số này với Thông tư 50/2024 (đã được sửa đổi bởi Thông tư 77/2025), có nơi gắn với Quyết định 2345. Bài chưa đọc nguyên văn, chưa kiểm biên "trên" hay "từ" và điều kiện đi kèm; không nêu số điều, số khoản, số phụ lục. Hãy mở văn bản hiện hành.</div>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: "Chào bạn, trước làn sóng lừa đảo công nghệ cao và giả mạo khuôn mặt, Ngân hàng Nhà nước quy định chuyển tiền trực tuyến vượt ngưỡng phải xác thực sinh trắc học. Sinh trắc học là dùng đặc điểm cơ thể, như khuôn mặt, để nhận ra đúng người. Khuôn mặt phải khớp với dữ liệu đã đối chiếu từ chíp căn cước, hoặc từ ứng dụng định danh điện tử của nhà nước. Ngưỡng bài dùng là con số báo chí nêu, có nơi gắn với Thông tư 50 năm 2024, đã được sửa đổi, có nơi gắn với Quyết định 2345. Bài chưa đọc nguyên văn và chưa kiểm ranh giới trên hay từ mười triệu, nên hãy kiểm văn bản hiện hành."
  - clear: true
    show: |-
      <table class="t">
        <tr><th>thách thức kỹ thuật</th><th>nguy cơ bảo mật</th><th>giải pháp kiến trúc chuẩn Senior</th></tr>
        <tr><td>Kẻ gian dùng video giả mạo Deepfake</td><td>Tài khoản bị chiếm đoạt số tiền lớn</td><td>SDK kiểm tra độ sống Liveness Detection 3D</td></tr>
        <tr><td>Cổng xác thực quốc gia bị nghẽn mạng</td><td>Giao dịch của khách hàng bị treo đứng</td><td>Bộ đệm phiên làm việc và kiểm tra tải tự động</td></tr>
        <tr><td>Kẻ xấu gọi thẳng API hạch toán Core</td><td>Bỏ qua bước quét khuôn mặt trên ứng dụng</td><td>Điều kiện tiên quyết SAGA Pre-condition Gate</td></tr>
      </table>
      <p>API là cửa để một chương trình gọi chức năng của chương trình khác; SDK là bộ công cụ phần mềm nhúng vào ứng dụng.</p>
      <p>Hôm nay, ta giải mã: <b>Quy định ngưỡng sinh trắc học</b>, <b>cơ chế kiểm tra độ sống chống giả mạo</b>, và <b>kiến trúc cổng xác thực sinh trắc học an toàn</b>.</p>
    focus:
    - 0
    - 0
    - 0
    say: "Deepfake là video giả khuôn mặt người thật do trí tuệ nhân tạo tạo ra, còn bộ công cụ phần mềm kiểm tra độ sống giúp phân biệt người thật với ảnh hay video. API là cửa để một chương trình gọi chức năng của chương trình khác, và kẻ xấu có thể gọi thẳng cửa đó, bỏ qua ứng dụng. Hôm nay ta tìm hiểu tiêu chuẩn xác thực sinh trắc học, cơ chế kiểm tra độ sống chống video giả mạo, và cổng bảo mật làm điều kiện tiên quyết trong điều phối giao dịch."
    introduces:
    - acb_liveness
- id: prereq
  kind: prereq
  title: 'Kiến thức nền: Ngưỡng giao dịch cần sinh trắc học'
  checks:
  - 10 + 10 == 20
  - 20 // 10 == 2
  - 8 + 14 == 22 and 14 > 10 and 22 > 20
  - 9 + 8 == 17 and 17 <= 20 and 17 + 6 == 23 and 23 > 20 and 6 <= 10
  steps:
  - show: |-
      <p><b>Ba quy tắc về ngưỡng</b> (con số báo chí nêu, gắn Thông tư 50/2024 đã được sửa đổi bởi Thông tư 77/2025 hoặc Quyết định 2345; chưa đọc nguyên văn; số điều chưa nêu):</p><table class="t"><tr><th>hạn mức giao dịch</th><th>yêu cầu</th><th>hình thức xác thực</th></tr><tr><td>Không quá 10 triệu đồng một lần và tổng ngày không vượt 20 triệu</td><td>Xác thực thông thường</td><td>theo chính sách ngân hàng, ví dụ OTP (mã dùng một lần gửi qua điện thoại)</td></tr><tr><td>Trên 10 triệu đồng một lần</td><td>Bắt buộc sinh trắc học</td><td>Khuôn mặt khớp dữ liệu đã đối chiếu chip CCCD</td></tr><tr><td>Giao dịch làm tổng ngày vượt 20 triệu</td><td>Bắt buộc sinh trắc học</td><td>Trong mô phỏng của bài, sau mỗi lần xác thực thành công, tổng cộng dồn tính lại từ 0 (giả định minh hoạ, không có số điều; thực tế phải hỏi ngân hàng hoặc đọc văn bản hiện hành xem tổng ngày có được tính lại hay không)</td></tr></table>
    focus: [0, 0, 0, 0, 0, 0]
    say: "Trước hết là ba quy tắc về ngưỡng, theo con số báo chí nêu, chưa đọc nguyên văn. Giao dịch không quá mười triệu đồng, khi tổng ngày chưa vượt 20 triệu, dùng xác thực thông thường theo chính sách ngân hàng, ví dụ mã dùng một lần gửi qua điện thoại. Trên mười triệu đồng thì khách bắt buộc quét khuôn mặt. Giao dịch làm tổng ngày vượt 20 triệu cũng phải xác thực sinh trắc học. Sau mỗi lần xác thực thành công, tổng cộng dồn tính lại từ không, nhưng đó chỉ là giả định của mô phỏng, không phải điều khoản đã đọc. Thực tế có thể tính khác, nên hãy hỏi ngân hàng hoặc đọc văn bản hiện hành."
  - clear: true
    show: '<div class="box key">Ví dụ: Buổi sáng khách chuyển $8$ triệu đồng (chưa
      cần khuôn mặt). Buổi chiều khách chuyển tiếp $14$ triệu đồng $\to$ Vượt hạn
      mức $10$ triệu và tổng ngày đạt $22$ triệu đồng.<br/>

      Cả hai điều kiện đều chạm ngưỡng, hệ thống kích hoạt cổng sinh trắc học ngay
      lập tức!<br/>

      Ví dụ 2: chuyển $9$ rồi $8$ triệu, tổng $17$ triệu (chưa vượt $20$). Lệnh thứ
      ba chỉ $6$ triệu nhưng làm tổng ngày thành $23$ triệu, vượt $20$ $\to$ lệnh
      $6$ triệu này vẫn phải xác thực sinh trắc học.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: "Ta xét một ví dụ. Buổi sáng khách chuyển tám triệu đồng mà chưa cần quét mặt. Buổi chiều khách chuyển tiếp 14 triệu, lệnh này trên 10 triệu và tổng ngày lên 22 triệu, nên cổng yêu cầu nhận diện khuôn mặt trước khi hạch toán. Ví dụ khác, khách chuyển 9 triệu rồi 8 triệu, tổng 17 triệu nên chưa cần quét mặt. Lệnh thứ ba chỉ 6 triệu nhưng làm tổng ngày thành 23 triệu, vượt 20 triệu, nên vẫn phải xác thực sinh trắc học."
