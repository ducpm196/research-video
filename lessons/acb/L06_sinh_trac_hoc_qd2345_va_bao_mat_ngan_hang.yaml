- id: example
  kind: example
  title: Quy trình xác thực giao dịch năm mươi triệu đồng thực tế
  checks:
  - 50000000 > 10000000
  - 180 - 150 == 30
  - 450 < 1000
  steps:
  - show: '<p><b>Bước 1 — Người dùng tạo lệnh chuyển tiền 50 triệu đồng</b>:</p>

      <div class="box key">Khách hàng nhập số tiền $50\,000\,000$ VND trên ứng dụng
      ACB One.<br/>

      Hệ thống kiểm tra số tiền lớn hơn ngưỡng $10\,000\,000$ VND.<br/>

      Cổng thanh toán yêu cầu người dùng mở camera quét khuôn mặt sống 3D.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước một, khách hàng tạo lệnh chuyển tiền 50 triệu đồng trên ứng dụng. Cổng
      dịch vụ nhận thấy số tiền vượt ngưỡng mười triệu đồng theo quy định. Ứng dụng
      lập tức yêu cầu khách hàng đưa khuôn mặt vào khung hình quét trực tiếp.
  - clear: true
    show: '<p><b>Bước 2 — Kiểm tra độ sống Liveness Detection và so khớp Căn cước</b>:</p>

      <div class="box key">SDK phân tích chuyển động mắt và vi biểu cảm khuôn mặt:
      kiểm tra độ sống đạt.<br/>

      Đặc trưng khuôn mặt được so khớp 1:1 với mẫu sinh trắc đã đăng ký (mẫu đã đối
      chiếu chip CCCD lúc đăng ký).<br/>

      Điểm khớp $0{,}965$ vượt ngưỡng cấu hình (ví dụ minh họa) nên kết luận trùng khớp.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, bộ công cụ phân tích độ sống xác nhận người đang quét là thực thể
      sống. Đặc trưng khuôn mặt được so khớp với mẫu sinh trắc học khách đã đăng ký,
      mẫu này đã được đối chiếu với chíp căn cước. Điểm khớp vượt ngưỡng cấu hình nên
      hệ thống kết luận trùng khớp.
  - clear: true
    show: "<p><b>Bước 3 — Sinh vé xác thực và gửi kèm lệnh chuyển tiền SAGA</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>tham số lệnh</th><th>giá trị kiểm tra</th><th>trạng\
      \ thái an ninh</th></tr>\n  <tr><td>Mã vé Ticket ID</td><td>bio_sec_893412</td><td>Hợp\
      \ lệ và chưa từng sử dụng</td></tr>\n  <tr><td>Thời gian hiệu lực</td><td>Còn\
      \ 150 giây</td><td>Chưa bị hết hạn</td></tr>\n  <tr><td>Điểm số khớp mặt</td><td>0.965\
      \ (Ngưỡng &gt; 0.85, ví dụ minh họa)</td><td>Vượt ngưỡng cấu hình</td></tr>\n</table>\n\
      <div class=\"box key\">Động cơ SAGA xác thực vé thành công, cho phép kích hoạt\
      \ trích nợ Core T24!</div>"
    focus:
    - 0
    - 0
    - 0
    say: Bước ba, cổng an ninh sinh vé điện tử gửi kèm theo yêu cầu giao dịch. Động
      cơ điều phối kiểm tra vé còn hiệu lực và chưa từng được sử dụng trước đây. Khi
      điều kiện tiên quyết được thỏa mãn, lệnh trừ tiền mới được phát hành sang Core
      T24.
  - clear: true
    show: '<p><b>Bước 4 — Hoàn tất chuyển tiền liên ngân hàng qua NAPAS</b>:</p>

      <div class="box key">Ví dụ minh họa: phần xử lý phía máy chủ khoảng <b>$450$
      mili giây</b>, chưa tính thời gian khách quét mặt; con số thật phải đo.<br/>

