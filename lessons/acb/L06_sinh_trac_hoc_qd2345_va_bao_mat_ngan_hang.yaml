    say: "Trước khi xem hàm kiểm vé, ta đọc bốn chỗ lạ. Chữ định nghĩa hàm đặt tên cho hàm nhận ba giá trị, và lệnh trả về dừng hàm, đưa chữ ra. Dấu cộng nối chuỗi chữ, còn hàm đổi số thành chữ giúp nối số tiền. Dấu khác so hai chữ ký, khác nhau nghĩa là vé đã bị sửa. Tập rỗng ghi các vé đã dùng, từ khoá in hỏi vé đã có trong tập chưa, phương thức thêm ghi vé vào tập."
  - clear: true
    show: '<p>Hàm kiểm vé: ba cổng chặn theo thứ tự — chữ ký hoặc tiền bị sửa, hết
