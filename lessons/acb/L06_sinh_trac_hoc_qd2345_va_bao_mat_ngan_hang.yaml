- id: quymo
  kind: example
  title: 'Quy mô và thời gian: cổng sinh trắc học ở ×1, ×100 và ×10 000 (số minh hoạ)'
  checks:
  - round(5 * 0.3, 1) == 1.5 and 500 * 3 // 10 == 150 and 50000 * 3 // 10 == 15000
  - 5 * 180 == 900 and 500 * 180 == 90000 and 50000 * 180 == 9000000 and 50000 * 60
    == 3000000
  steps:
  - show: <p>Mỗi lần so khớp mất $0{,}3$ giây, vé sống tối đa $180$ giây (số minh
      hoạ):</p><table class="t"><tr><th>cỡ</th><th>lượt quét mặt mỗi giây</th><th>đang
      so khớp (lượt × 0,3 giây)</th><th>vé còn hạn tối đa (lượt × 180 giây)</th><th>chọn
      gì</th></tr><tr><td>×1</td><td>5</td><td>1,5</td><td>900</td><td>một máy chủ,
      tập vé đã dùng trong bộ nhớ</td></tr><tr><td>×100</td><td>500</td><td>150</td><td>90&nbsp;000</td><td>nhiều
      máy chủ, tập vé đã dùng dùng chung (Redis)</td></tr><tr><td>×10&nbsp;000</td><td>50&nbsp;000</td><td>15&nbsp;000</td><td>9&nbsp;000&nbsp;000</td><td>chia
      tập vé theo mã khách, rút ngắn hạn vé</td></tr></table><p class="note">Đang
      so khớp $= 5 \times 0{,}3 = 1{,}5$; $500 \times 0{,}3 = 150$; $50\,000 \times
      0{,}3 = 15\,000$. Vé tối đa $= 50\,000 \times 180 = 9\,000\,000$.</p>
    say: Ta tăng số lượt quét mặt mỗi giây, với số minh hoạ mỗi lần so khớp mất 0
      phẩy 3 giây. Ở cỡ một, 5 lượt mỗi giây, chỉ khoảng một rưỡi việc chạy cùng lúc,
      một máy chủ là đủ. Ở cỡ một trăm, 500 lượt mỗi giây, có 150 việc cùng lúc và
      tới 90 nghìn vé còn hạn, nên tập vé đã dùng phải đặt ở nơi dùng chung. Ở cỡ
      mười nghìn, 50 nghìn lượt mỗi giây, có tới 9 triệu vé còn hạn, nên phải chia
      tập vé theo mã khách.
    focus:
    - 0
    - 0
    - 0
    - 0
  - show: <div class="box key"><b>Theo thời gian:</b> vé sống $180$ giây thì tối đa
      $9\,000\,000$ vé cùng nhớ; rút còn $60$ giây thì $3\,000\,000$. Đổi lại, khách
      chậm hơn $60$ giây phải quét lại.</div><table class="t"><tr><th>hạn của vé</th><th>vé
      nhớ tối đa (×10 000)</th><th>đổi lại</th></tr><tr><td>180 giây</td><td>9&nbsp;000&nbsp;000</td><td>khách
      có nhiều thời gian</td></tr><tr><td>60 giây</td><td>3&nbsp;000&nbsp;000</td><td>khách
      mạng chậm phải quét lại</td></tr></table>
    say: Còn theo thời gian thì sao. Vé sống 180 giây thì phải nhớ tới 9 triệu vé
      đã dùng cùng lúc. Rút xuống 60 giây còn 3 triệu vé, đổi lại khách mạng chậm
      sẽ phải quét lại. Hạn vé là đánh đổi giữa an toàn, bộ nhớ và sự tiện lợi của
      khách.
    focus:
    - 0
    - 0
    - 0
    - 0
    clear: true
- id: quiz
  kind: quiz
  title: Thử thách kiến trúc bảo mật giao dịch trực tuyến tại ACB
  checks:
