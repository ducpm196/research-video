    say: "Hàm kiểm vé có ba cổng chặn liên tiếp. Chữ ký tính lại không khớp, tức vé đã bị sửa, thì từ chối. Quá hạn dùng thì từ chối vì hết hạn. Mã vé đã nằm trong tập đã dùng thì từ chối vì dùng lại. Qua hết ba cổng thì ghi vé vào tập đã dùng rồi cho phép. Ở đây ta so chữ ký bằng dấu khác cho dễ đọc. Thực tế phải dùng hàm so sánh an toàn thời gian, luôn mất thời gian như nhau nên kẻ gian không đoán được chữ ký qua độ trễ, cùng chữ ký đủ dài."
