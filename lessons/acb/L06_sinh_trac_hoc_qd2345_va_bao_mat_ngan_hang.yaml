  - clear: true
    show: '<p><b>Bước 2 — Giảm thiểu rủi ro bồi hoàn và sai lệch sổ cái</b>:</p>

      <div class="box key">Nếu cho phép chạy song song hoặc trừ tiền trước, khi người
