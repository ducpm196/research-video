      sao bước sinh trắc học nên là điều kiện tiên quyết trong luồng giao dịch? Bạn
      có 15 giây suy nghĩ trước khi nghe đáp án chuẩn xác.
  - clear: true
    show: '<div class="box key"><b>Đáp án chính xác là D</b>!</div>

      <p><b>Bước 1 — Nguyên lý bảo toàn số dư tài khoản</b>:</p>

      <p>Trong giao dịch tài chính, việc trích nợ tài khoản là bước thay đổi trạng
      thái có tính chất trọng yếu nhất. Không bao giờ được phép trích nợ khi người
      thực hiện chưa được chứng minh là chủ tài khoản hợp pháp.</p>'
    focus:
    - 0
    - 0
