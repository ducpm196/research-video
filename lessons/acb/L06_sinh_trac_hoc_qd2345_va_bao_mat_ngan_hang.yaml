id: L06
course: ACB
series: Phỏng vấn Kỹ sư Tích hợp ACB
title: Bài 6 — Xác thực Sinh trắc học (ngưỡng 10 và 20 triệu chưa đọc nguyên văn) và Bảo mật Giao dịch Trực tuyến
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: 'curriculum/acb.yaml L06; Thông tư 50/2024/TT-NHNN (audit/legal/registry.yaml ghi đã đọc bản gốc Công báo 1279+1280, 30-11-2024; ngưỡng sinh trắc học trên 10 triệu một giao dịch hoặc tổng ngày vượt 20 triệu theo cách hiểu của bài), SỬA ĐỔI bởi Thông tư 77/2025/TT-NHNN hiệu lực 01/3/2026, bản hợp nhất 25/VBHN-NHNN; phụ lục nào chứa con số 10/20 triệu SAU sửa đổi và số điều/khoản: CHƯA đối chiếu (nguồn thứ cấp gắn con số này với Quyết định 2345/QĐ-NHNN hoặc với Phụ lục 02 của Thông tư 50; registry ghi một điều khoản của Thông tư 77 thay các phụ lục từ 01/07/2026 với khách cá nhân, trạng thái CHUA_KIEM); Quyết định 2345/QĐ-NHNN (theo tài liệu phỏng vấn đã lưu: ngày 18/12/2023, hiệu lực 01/07/2024; CHƯA đối chiếu bản gốc, chưa rõ quan hệ với Thông tư 50/2024, bài không khẳng định số điều); nguyên tắc giảm thiểu dữ liệu cá nhân (Luật Bảo vệ dữ liệu cá nhân 91/2025/QH15, CHƯA kiểm số điều, bài chỉ nêu như khuyến nghị thiết kế); quy tắc mô phỏng tổng cộng dồn về 0 sau khi quét là giả định của bài, không phải điều khoản; RFC 2104 (HMAC); audit/acb/verify_acb.py L06; mã Python 3 mô phỏng chạy thật (cổng sinh trắc học, SDK độ sống và chữ ký số thật không chạy trên máy; chữ ký vé được mô phỏng bằng HMAC); kiến trúc cổng, điểm khớp, thời gian và số lượt xác thực là số minh hoạ, không phải thiết kế nội bộ của ACB'
assumes:
- arith
- approx
- acb_saga
- acb_mtls
- acb_redis
- acb_core
- acb_napas
objectives:
- 'Nêu quy tắc ngưỡng sinh trắc học: trên 10 triệu một lần hoặc tổng ngày vượt 20
  triệu, như báo chí nêu, có nơi gắn Thông tư 50/2024 (đã được sửa đổi bởi Thông tư 77/2025), có nơi gắn Quyết định 2345; chưa đọc nguyên văn, không nêu số điều'
- Áp quy tắc ngưỡng vào chuỗi giao dịch trong ngày bằng mã Python mô phỏng và chỉ
  ra giao dịch nào phải quét mặt
- 'Mô tả vé xác thực sinh trắc học: các trường, chữ ký, hạn 3 phút và chỉ dùng một
  lần'
- 'Chạy mô phỏng kiểm vé: chữ ký đúng, tiền bị sửa, vé hết hạn, vé dùng lại'
- 'Chọn thứ tự đúng trong luồng SAGA: kiểm sinh trắc học trước, trừ tiền sau, từ chối
  lệnh gọi thẳng khi thiếu vé'
- 'Nhận ra ba sai lầm: quét mặt sau khi trừ tiền, dùng lại vé, thiếu thử lại có giới
  hạn và đường dự phòng'
- 'So sánh ×1, ×100 và ×10 000: số lượt quét mặt mỗi giây, số vé còn hạn cùng lúc
  và số vé đã dùng cần nhớ'
- Viết mã Python kiểm ngưỡng có cộng dồn trong ngày và kiểm vé với số mới
