- id: code
  kind: example
  title: 'Chạy thử bằng mã Python (mô phỏng): ngưỡng cộng dồn và kiểm vé một lần'
  checks:
  - '[(t > 10 or s + t > 20) for s, t in [(0, 8), (8, 8), (16, 8), (0, 4)]] == [False,
    False, True, False]'
  - 8 + 8 == 16 and 16 + 8 == 24 and 24 > 20 and 0 + 4 == 4
  - 50 != 60 and 200 > 180 and 100 <= 180
  steps:
  - clear: true
    show: |-
      <p><b>Đọc trước: bốn dòng trong mã ngưỡng</b></p>
      <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
      <tr><td><code>for tien in [8, 8, 8, 4]:</code></td><td>lặp: mỗi vòng biến <code>tien</code> nhận một số của danh sách, theo thứ tự</td><td>vòng 1 là 8, vòng 4 là 4</td></tr>
      <tr><td><code>quet = tien &gt; 10 or tong + tien &gt; 20</code></td><td><code>&gt;</code> là lớn hơn; <code>or</code> đúng khi ít nhất một vế đúng; kết quả đúng hay sai gán cho <code>quet</code></td><td><code>tong</code> 16, <code>tien</code> 8: 24 &gt; 20 nên <code>quet</code> đúng</td></tr>
      <tr><td><code>0 if quet else tong + tien</code></td><td>dạng <code>a if c else b</code>: nếu <code>c</code> đúng thì lấy <code>a</code>, không thì lấy <code>b</code></td><td>quét thì tổng về 0, không thì cộng dồn</td></tr>
      <tr><td><code>print(tien, "quet mat" if quet else "thuong", "tong:", tong)</code></td><td>in nhiều giá trị cách nhau một khoảng trắng; chữ trong ngoặc kép in nguyên</td><td><code>8 quet mat tong: 0</code></td></tr></table>
    focus:
    - 0
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    say: "Trước khi xem mã, ta đọc bốn dòng lạ. Vòng lặp cho biến tiền nhận lần lượt từng số trong danh sách. Dòng gán dùng dấu lớn hơn và chữ hoặc, đúng khi ít nhất một vế đúng. Dạng lấy giá trị đầu nếu điều kiện đúng, không thì lấy giá trị sau, nên quét đúng thì tổng về không. Lệnh in hiện nhiều giá trị cách nhau một khoảng trắng."
  - clear: true
    show: |-
      <p><b>Mô phỏng bằng Python</b> — cổng sinh trắc học và SDK độ sống thật không chạy trên máy này. Quy tắc ngưỡng: số tiền trên $10$ triệu, hoặc tổng ngày vượt $20$ triệu thì quét mặt; sau khi quét, tổng về $0$ (giả định của mô phỏng, không phải điều khoản; triệu, số minh hoạ).</p><div class="code"><div>tong = 0</div><div>for tien in [8, 8, 8, 4]:</div><div>    quet = tien &gt; 10 or tong + tien &gt; 20</div><div>    tong = 0 if quet else tong + tien</div><div>    print(tien, "quet mat" if quet else "thuong", "tong:", tong)</div></div><p><b>Kết quả khi chạy</b></p><div class="code"><div>8 thuong tong: 8</div><div>8 thuong tong: 16</div><div>8 quet mat tong: 0</div><div>4 thuong tong: 4</div></div>
    say: "Đây là mô phỏng bằng ngôn ngữ Python, vì cổng sinh trắc học thật không chạy được trên máy của bạn. Vòng lặp đi qua bốn giao dịch trong ngày, tiền tính bằng triệu. Biến quét đúng khi số tiền trên mười, hoặc tổng cộng dồn cộng số tiền này vượt 20. Hai giao dịch tám triệu đầu có tổng 8 rồi 16 nên dùng cách thông thường, cái thứ ba làm tổng thành 24 nên phải quét mặt. Quét xong tổng về không, theo giả định của mô phỏng, nên giao dịch bốn triệu cuối chỉ cộng dồn bốn."
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
  - clear: true
    show: |-
      <p><b>Đọc trước: bốn dòng trong mã dựng vé</b></p>
      <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
      <tr><td><code>import hashlib, hmac</code></td><td>nạp hai thư viện có sẵn của Python: <code>hashlib</code> để băm, <code>hmac</code> để tính mã xác thực HMAC</td><td>không cần cài thêm</td></tr>
      <tr><td><code>b"bi-mat-may-chu"</code> và <code>nd.encode()</code></td><td>chữ <code>b</code> trước dấu nháy, và <code>.encode()</code>: đổi chữ thành dữ liệu thô gồm các số mà hàm băm cần</td><td>khoá bí mật của máy chủ</td></tr>
      <tr><td><code>hmac.new(KHOA, …, hashlib.sha256).hexdigest()[:8]</code></td><td>tính mã từ khoá và nội dung, viết bằng chữ số hệ mười sáu, rồi <code>[:8]</code> lấy 8 ký tự đầu</td><td>chữ ký ngắn 8 ký tự</td></tr>
      <tr><td><code>ve = {"id": "b1", "tien": 50, …}</code></td><td>ngoặc nhọn tạo từ điển: mỗi tên đi với một giá trị; <code>ve["ky"] = x</code> thêm giá trị ở tên <code>ky</code></td><td><code>ve["id"]</code> là <code>"b1"</code></td></tr></table>
    focus:
    - 0
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    introduces:
    - acb_hmac
    say: Còn bốn dòng cho phần dựng vé. Dòng đầu nạp hai thư viện có sẵn, một để băm, một để tính mã xác thực. Chữ b trước dấu nháy và phương thức mã hoá đổi chữ thành dữ liệu thô gồm các số mà hàm băm cần. Hàm tạo mã nhận khoá và nội dung, viết bằng chữ số hệ mười sáu rồi lấy 8 ký tự đầu. Ngoặc nhọn tạo từ điển, mỗi tên đi với một giá trị, và gán vào một tên mới sẽ thêm giá trị đó.
  - clear: true
    show: '<p>Dựng vé: chữ ký <b>mô phỏng bằng HMAC</b> (mã xác thực tính từ nội dung
      và một khoá bí mật); chữ ký số thật dùng cặp khoá công khai và bí mật.</p><div
      class="code"><div>import hashlib, hmac</div><div>KHOA = b"bi-mat-may-chu"</div><div>
      </div><div>def ky(nd):</div><div>    return hmac.new(KHOA, nd.encode(), hashlib.sha256).hexdigest()[:8]</div><div>
      </div><div>ve = {"id": "b1", "tien": 50, "het_han": 180}</div><div>ve["ky"]
      = ky("b1|50|180")</div><div>da_dung = set()</div></div>'
    say: "Tiếp theo là dựng vé. Hàm tính chữ ký trộn nội dung vé với khoá bí mật rồi băm, lấy tám ký tự đầu. Chữ ký ở đây chỉ mô phỏng bằng mã xác thực HMAC, còn chữ ký số thật dùng cặp khoá công khai và bí mật. Vé có mã, số tiền và hạn dùng đến giây thứ 180, kèm chữ ký, còn tập đã dùng ghi các vé đã dùng."
    focus:
    - 0
    - 0
    - 0
    - 0
  - clear: true
    show: |-
      <p><b>Đọc trước: bốn chỗ trong hàm kiểm vé</b></p>
      <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
      <tr><td><code>def kiem(ve, tien, bay_gio): … return</code></td><td><code>def</code> đặt tên một hàm nhận ba giá trị; <code>return</code> dừng hàm và trả chữ ra</td><td><code>return "cho phep"</code></td></tr>
      <tr><td><code>ve["id"] + "|" + str(tien)</code></td><td><code>+</code> nối chuỗi chữ; <code>str(…)</code> đổi số thành chữ để nối được</td><td><code>"b1|" + str(50)</code> ra <code>"b1|50"</code></td></tr>
