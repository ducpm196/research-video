  - clear: true
    show: "<p><b>Bước 3 — Trả mã lỗi 409 Conflict cho người đến sau</b>:</p>\n<table\
      \ class=\"t\">\n  <tr><th>thời điểm</th><th>người dùng</th><th>kết quả cập nhật</th><th>phản\
      \ hồi HTTP</th></tr>\n  <tr><td>10:00:00.120</td><td>Người mua 1</td><td>Thành\
