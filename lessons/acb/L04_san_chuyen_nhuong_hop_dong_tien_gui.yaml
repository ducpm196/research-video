- id: quymo
  kind: example
  title: 'Quy mô và thời gian: một sổ, nhiều người mua cùng lúc (số minh hoạ)'
  checks:
  - 2 - 1 == 1 and 200 - 1 == 199 and 20000 - 1 == 19999
  - round((2 - 1) * 0.02, 2) == 0.02 and round(199 * 0.02, 2) == 3.98 and round(19999
    * 0.02, 2) == 399.98
  steps:
  - show: '<p>Mỗi người giữ khoá bi quan $20$ ms (số minh hoạ); khoá lạc quan chỉ
      cần một câu cập nhật:</p><table class="t"><tr><th>cỡ</th><th>người mua cùng
      lúc</th><th>lạc quan: người nhận 409</th><th>bi quan: người cuối chờ</th><th>chọn gì</th></tr><tr><td>×1</td><td>2</td><td>1</td><td>0,02
      giây</td><td>cách nào cũng được</td></tr><tr><td>×100</td><td>200</td><td>199</td><td>3,98
      giây</td><td>khoá lạc quan: người thua nhận 409 sau một câu cập nhật</td></tr><tr><td>×10&nbsp;000</td><td>20&nbsp;000</td><td>19&nbsp;999</td><td>399,98
      giây (gần 7 phút)</td><td>khoá lạc quan kèm giới hạn gửi lại và báo "đã bán"
      sớm</td></tr></table><p class="note">Bi quan: $(n-1) \times 0{,}02$ giây, ví
      dụ $199 \times 0{,}02 = 3{,}98$; lạc quan: đúng $1$ người thắng, $n-1$ người
      nhận $409$.</p>'
    say: Ta tăng số người mua cùng bấm một sổ, với số minh hoạ. Ở cỡ một, hai người,
      cách nào cũng được. Ở cỡ một trăm, 200 người, khoá bi quan xếp hàng nên người
      cuối chờ gần bốn giây, trong khi khoá lạc quan trả 409 rất nhanh cho 199 người thua.
      Ở cỡ mười nghìn, 20 nghìn người, khoá bi quan bắt người cuối chờ gần 400 giây,
      tức gần bảy phút. Khoá lạc quan vẫn nhanh, nhưng có 19 nghìn 999 yêu cầu thua,
      nên ta phải giới hạn số lần gửi lại và báo đã bán sớm.
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
  - show: <div class="box key"><b>Theo thời gian:</b> nếu cột phiên bản là <b>dấu
      thời gian thô</b> (độ phân giải một giây) thì hai lần ghi trong cùng một giây
      ra cùng một giá trị, và điều kiện so sánh bị lọt. Số phiên bản tăng một mỗi
      lần ghi thì không bị.</div><table class="t"><tr><th>cột dùng để kiểm</th><th>hai
      lần ghi trong cùng một giây</th><th>kết quả</th></tr><tr><td>dấu thời gian thô
      (một giây)</td><td>ra cùng giá trị</td><td>điều kiện so sánh bị lọt</td></tr><tr><td>số
      phiên bản (tăng một mỗi lần ghi)</td><td>luôn khác nhau</td><td>không bị lọt</td></tr></table>
    say: Còn theo thời gian thì sao. Nếu cột kiểm là dấu thời gian thô, hai lần ghi
