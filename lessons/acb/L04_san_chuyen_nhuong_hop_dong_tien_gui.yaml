- id: symbol
  kind: symbol
  title: Cú pháp Câu lệnh Khóa Lạc quan với dấu thời gian
  steps:
  - show: '<p><b>Câu lệnh SQL cập nhật trạng thái nguyên tử bằng Khóa Lạc quan</b>:</p>

      <div class="box code"><code>UPDATE transaction<br/>

      SET status = ''PROCESSING'', receive_cif = :cif, last_access = NOW()<br/>

      WHERE order_id = :id AND channel = :ch AND order_date = :dt AND last_access
      = :old_ts;</code></div>

      <div class="box key">Điều kiện then chốt: Dấu thời gian <code>last_access</code>
      phải khớp chính xác với thời điểm đọc dữ liệu ban đầu!</div>

      <p>Nhiều hệ thống dùng cột số phiên bản tăng dần (<code>version = version +
      1</code>) thay cho dấu thời gian, vì hai lần ghi có thể ra cùng một dấu thời
      gian nếu độ phân giải thấp.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Đây là câu lệnh cập nhật nguyên tử mẫu mực trong hệ thống thực tế. Nguyên
      tử nghĩa là cơ sở dữ liệu kiểm điều kiện và ghi trong cùng một bước, không ai
      chen vào giữa được. Ta cập nhật trạng thái đơn hàng sang xử lý và gán mã CIF
      người mua. Điều kiện then chốt là dấu thời gian truy cập phải trùng khớp giá
      trị lúc đọc. Nhiều hệ thống dùng cột số phiên bản tăng dần thay cho dấu thời
