  - clear: true
    show: "<p><b>Bước 3 — Trả mã lỗi 409 Conflict cho người đến sau</b>:</p>\n<table\
      \ class=\"t\">\n  <tr><th>thời điểm</th><th>người dùng</th><th>kết quả cập nhật</th><th>phản\
      \ hồi HTTP</th></tr>\n  <tr><td>10:00:00.120</td><td>Người mua 1</td><td>Thành\
      \ công 1 dòng</td><td>HTTP 200 OK (Đang hạch toán)</td></tr>\n  <tr><td>10:00:00.125</td><td>Người\
      \ mua 2</td><td>Thất bại 0 dòng</td><td>HTTP 409 Conflict (Sổ đã bán)</td></tr>\n\
      </table>\n<div class=\"box key\">Hai yêu cầu đến cách nhau chỉ $5$ mili giây\
      \ (từ .120 đến .125), và người đến sau nhận 409 ngay trong khoảng đó (ví dụ minh họa).</div>"
    focus:
    - 0
    - 0
    - 0
    say: 'Bước ba, cổng dịch vụ lập tức trả mã lỗi 409, nghĩa là xung đột, cho người đến sau. Khoá dòng chỉ được giữ trong tích tắc của câu lệnh cập nhật, không giữ trong lúc người dùng còn suy nghĩ. Trong ví dụ này, hai yêu cầu đến cách nhau chỉ năm mi li giây, và người đến sau nhận mã 409 ngay trong khoảng đó.'
  - clear: true
    show: |
      <p><b>Đọc trước</b> — bốn chỗ lạ trong đoạn mã Go ở bước sau:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>n, err := res.RowsAffected()</code></td><td><code>:=</code> vừa khai báo vừa gán; hàm trả hai giá trị, <code>n</code> là số dòng bị cập nhật, <code>err</code> là lỗi</td><td><code>n</code> bằng 1 là một dòng đổi, bằng 0 là không dòng nào</td></tr><tr><td><code>if err != nil { return err }</code></td><td><code>nil</code> nghĩa là rỗng, không có gì; <code>err != nil</code> là có lỗi, khi đó thoát hàm và trả lỗi lên</td><td><code>err</code> là <code>nil</code> thì chạy tiếp</td></tr><tr><td><code>c.Status(fiber.StatusConflict)</code></td><td>Fiber là khung viết dịch vụ web bằng Go; <code>c</code> là yêu cầu đang xử lý; <code>Status</code> đặt mã trả về, <code>StatusConflict</code> là mã 409</td><td>trả mã 409 cho người đến sau</td></tr><tr><td><code style="white-space:nowrap">.JSON(fiber.Map{…})</code></td><td><code>JSON</code> gửi về nội dung dạng văn bản có tên và giá trị; <code>fiber.Map</code> là bảng tên và giá trị</td><td>gửi về <code>code</code> bằng <code>"409"</code></td></tr></table>
    say: Trước khi đọc mã, ta học bốn chỗ lạ. Dấu hai chấm bằng vừa khai báo vừa gán, và hàm trả về hai giá trị là số dòng và lỗi. Giá trị rỗng nghĩa là không có gì, nên lỗi khác rỗng là có lỗi, khi đó hàm thoát và trả lỗi lên. Fiber là khung viết dịch vụ chạy trên mạng, lệnh đặt trạng thái gán mã trả về, ở đây là mã 409. Lệnh gửi về một bảng gồm tên và giá trị cho ứng dụng khách.
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
  - clear: true
    show: '<p><b>Bước 4 — Đoạn mã xử lý kết quả trong Go Fiber</b>:</p>

      <div class="box code"><code>n, err := res.RowsAffected() // res: sql.Result
      của câu UPDATE<br/>

      if err != nil { return err }<br/>

