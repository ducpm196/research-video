        <tr><td>Nhiều người cùng mua</td><td>người đến sau xếp hàng chờ khoá; giữ khoá lúc người dùng còn suy nghĩ thì nghẽn</td><td>người đến sau chỉ chờ bằng thời gian một câu cập nhật rồi nhận 409</td></tr>
        <tr><td>Người chỉ xem</td><td colspan="2">đọc thường không bị khoá dòng chặn ở cả hai cách (PostgreSQL giữ nhiều phiên bản dòng, MVCC)</td></tr>
        <tr><td>Ứng dụng phù hợp</td><td>hạch toán trong Core, xung đột thường xuyên</td><td>sàn giao dịch số, xung đột hiếm</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    say: 'Bảng so sánh làm rõ sự khác biệt giữa hai phương pháp kiểm soát đồng thời. Khoá Bi quan dùng câu đọc kèm lệnh khoá dòng, nghĩa là người khác chưa được sửa dòng đó, và giữ khoá từ lúc đọc tới lúc ghi, nên người mua đến sau phải xếp hàng chờ. Khoá Lạc quan không giữ khoá trong khoảng đó, nên người đến sau chỉ chờ bằng thời gian một câu cập nhật rồi nhận lỗi xung đột. Còn người chỉ xem thì ở cả hai cách đều đọc tự do, vì PostgreSQL giữ nhiều phiên bản của một dòng nên lệnh đọc thường không bị chặn.'
  - clear: true
    show: |-
      <p><b>Quy trình chuyển giao quyền sở hữu CIF trên Core T24</b>:</p>
