      \ mua 2</td><td>Thất bại 0 dòng</td><td>HTTP 409 Conflict (Sổ đã bán)</td></tr>\n\
      </table>\n<div class=\"box key\">Toàn bộ quy trình loại trừ xung đột hoàn tất\
      \ trong khoảng $25$ mili giây (ví dụ minh họa).</div>"
    focus:
    - 0
    - 0
    - 0
    say: Bước ba, cổng dịch vụ lập tức trả mã lỗi 409 cho người đến sau. Khoá dòng
