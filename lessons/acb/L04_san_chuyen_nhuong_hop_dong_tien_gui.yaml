  - clear: true
    show: '<p><b>Đọc trước</b> bốn chỗ còn lại của mã người mua:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>db.execute(sql, (7,))</code> và dấu <code>?</code></td><td><code>?</code> là chỗ trống chờ giá trị; <code>(7,)</code> là bộ giá trị điền vào, ở đây chỉ có số 7</td><td><code>ver = ?</code> thành <code>ver = 7</code></td></tr><tr><td><code>.rowcount</code></td><td>số dòng câu lệnh vừa sửa; bằng 0 nghĩa là không sửa được dòng nào</td><td>1 là người thắng, 0 là người thua</td></tr><tr><td><code>for nguoi in ("mua 1", "mua 2"):</code></td><td>lặp lần lượt qua từng chữ trong danh sách; mỗi vòng <code>nguoi</code> nhận một chữ</td><td>vòng một: <code>nguoi</code> = "mua 1"</td></tr><tr><td><code>print(nguoi, "dong tac dong:", n)</code></td><td>in ba giá trị cách nhau một khoảng trắng</td><td>in ra <code>mua 1 dong tac dong: 1</code></td></tr></table>'
    say: Còn bốn chỗ lạ nữa trong phần mã của hai người mua. Dấu hỏi là chỗ trống chờ giá trị, và số bảy được điền vào đó từ bộ giá trị. Thuộc tính đếm dòng cho biết câu lệnh vừa sửa bao nhiêu dòng, không dòng nào nghĩa là thua. Vòng lặp đi lần lượt qua từng chữ trong danh sách. Lệnh in hiện ba giá trị ra màn hình, cách nhau một khoảng trắng.
