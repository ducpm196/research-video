id: L04
course: ACB
series: Phỏng vấn Kỹ sư Tích hợp ACB
title: 'Bài 4 — Sàn Chuyển nhượng Hợp đồng Tiền gửi: Khoá Lạc quan và Máy Trạng thái
  T24'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: 'curriculum/acb.yaml L04; kiến trúc sàn chuyển nhượng contract-transfer (Go
  Fiber, PostgreSQL) làm ví dụ tham chiếu; tài liệu Temenos về OFS không công khai
  (chưa kiểm được phiên bản, xem audit/review/screen_code/ACB.yaml); PostgreSQL (MVCC,
  SELECT FOR UPDATE); RFC 9110 (mã 409 Conflict); audit/acb/verify_acb.py L04; mã
  Python 3 và sqlite3 chạy thật (PostgreSQL và T24 thật không chạy trên máy); thời
  gian, tỉ lệ, lãi suất và số người mua trong bài là số minh hoạ; quy định tiền gửi
  tiết kiệm của Ngân hàng Nhà nước: chưa đối chiếu bản gốc nên bài không nêu số điều'
assumes:
- arith
- approx
- acb_ofs
- acb_core
objectives:
- Mô tả nghiệp vụ chuyển nhượng hợp đồng tiền gửi và vì sao hai người mua cùng lúc
  gây xung đột
- Thiết kế câu cập nhật có điều kiện (khoá lạc quan) và đọc số dòng tác động để biết
  ai thắng
- 'Chạy mô phỏng hai người mua cùng lúc bằng sqlite: người thắng nhận một dòng, người
  thua nhận không dòng và mã 409'
- Mô tả máy trạng thái của lệnh chuyển nhượng và hai bản tin OFS kiểm tra rồi đổi
  chủ sở hữu
- 'Chọn cách xử lý khi T24 hết giờ: chuyển sang HOLD, tra sổ cái, không hoàn tiền
  ngay'
- 'Nhận ra ba sai lầm: giữ khoá bi quan lúc chờ người dùng, bỏ qua số dòng tác động,
  huỷ lệnh khi hết giờ'
- So sánh khoá bi quan với khoá lạc quan khi số người mua cùng lúc là ×1, ×100 và
  ×10 000
- Viết mã Python và sqlite làm cập nhật có điều kiện theo số phiên bản và máy trạng
  thái với số mới
