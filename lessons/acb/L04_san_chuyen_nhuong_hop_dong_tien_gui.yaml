  steps:
  - show: '<p><b>Đọc trước</b> bốn dòng đầu của mã sqlite ở khung sau (mô phỏng, chạy thật):</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>import sqlite3</code> và <code>sqlite3.connect(":memory:")</code></td><td>nạp thư viện cơ sở dữ liệu nhỏ có sẵn của Python; <code>":memory:"</code> là cơ sở dữ liệu tạm nằm trong bộ nhớ, tắt chương trình là mất</td><td><code>db</code> là cơ sở dữ liệu tạm vừa mở</td></tr><tr><td><code>CREATE TABLE so (id INT, ver INT)</code></td><td>tạo bảng tên <code>so</code> có hai cột số nguyên: <code>id</code> và <code>ver</code> (số phiên bản)</td><td>bảng mới còn trống, chưa có dòng nào</td></tr><tr><td><code>INSERT INTO so VALUES (1, 7)</code></td><td>thêm một dòng vào bảng, giá trị theo đúng thứ tự cột</td><td>dòng mới: id = 1, ver = 7</td></tr><tr><td><code>SELECT ver FROM so</code> và <code>.fetchone()[0]</code></td><td>chọn cột ver; <code>fetchone</code> lấy một dòng kết quả, <code>[0]</code> lấy giá trị đầu của dòng đó</td><td>dòng kết quả (8,) thì <code>[0]</code> là 8</td></tr></table>'
    say: Trước khi đọc mã, ta đọc bốn dòng đầu của nó. Dòng đầu nạp thư viện và mở một cơ sở dữ liệu tạm nằm trong bộ nhớ, tắt chương trình là mất. Dòng thứ hai tạo bảng có hai cột số nguyên, mã và số phiên bản. Dòng thứ ba thêm một dòng dữ liệu theo đúng thứ tự cột. Dòng thứ tư chọn cột phiên bản, lấy một dòng kết quả rồi lấy giá trị đầu của dòng.
    focus:
