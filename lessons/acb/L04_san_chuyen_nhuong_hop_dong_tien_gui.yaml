scenes:
- id: hook
  kind: hook
  title: Bài toán hai khách hàng cùng bấm mua một sổ tiết kiệm trong cùng một tích
    tắc
  steps:
  - show: '<p>Trên sàn chuyển nhượng số, một sổ tiết kiệm lãi suất cao được chào bán
      công khai.</p>

      <div class="box key">Nếu hai người mua cùng bấm chấp nhận trong cùng một phần
      nghìn giây, làm sao hệ thống ngân hàng bảo đảm chỉ một người mua thành công
      mà không làm nghẽn cơ sở dữ liệu?</div>'
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, trên sàn ngân hàng số, một sổ tiết kiệm lãi suất cao được chào
      bán. Trong cùng một tích tắc, có thể nhiều người cùng bấm nút mua. Nếu không
      kiểm soát chính xác, ngân hàng có thể bán một sổ cho hai người.
  - clear: true
    show: "<table class=\"t\">\n  <tr><th>kịch bản rủi ro</th><th>hậu quả tài chính</th><th>yêu\
      \ cầu kỹ thuật</th></tr>\n  <tr><td>Hai người mua cùng click đồng thời</td><td>Trừ\
      \ tiền hai lần cho cùng một hợp đồng</td><td>Khóa Lạc quan với thời điểm truy\
      \ cập</td></tr>\n  <tr><td>Core Banking T24 bị sự cố mạng</td><td>Treo lệnh\
      \ hoặc mất đồng bộ số dư</td><td>Máy trạng thái chuyển sang HOLD để đối soát</td></tr>\n\
      </table>\n<p>Hôm nay, ta làm chủ: <b>Bản chất thị trường tiền gửi thứ cấp</b>,\
      \ <b>kỹ thuật Khóa Lạc quan</b>, và <b>máy trạng thái Core Banking T24</b>.</p>\n\
      <div class=\"box warn\">T24 ở đây là <b>kiến trúc tham chiếu</b> rút từ kinh\
      \ nghiệm làm ở OCB; tin tuyển dụng của ACB không nói ACB dùng hệ core (hệ thống\
      \ lõi) nào, khi phỏng vấn hãy hỏi lại hệ core thật.</div>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau giải mã toàn bộ bài toán thực chiến này. Ta tìm hiểu
      nghiệp vụ chuyển nhượng hợp đồng tiền gửi. Ta nắm vững kỹ thuật Khóa Lạc quan
      không gây bế tắc cơ sở dữ liệu. Ta cũng tìm hiểu máy trạng thái, tức danh sách
      các trạng thái của một lệnh và những bước chuyển hợp lệ giữa chúng. Lưu ý, T24
      ở đây là kiến trúc tham chiếu rút từ kinh nghiệm làm ở OCB. Tin tuyển dụng của
      ACB không nói ACB dùng hệ thống lõi nào, nên khi phỏng vấn hãy hỏi lại hệ thống
      lõi thật.
- id: prereq
  kind: prereq
  title: 'Kiến thức nền: Tiền gửi tiết kiệm có kỳ hạn, mã định danh CIF và số dư'
  checks:
  - 500 * 7 // 100 == 35
  - 500000000 > 100000000
  - 500000000 * 335 // 365000 == 458904
  - round(500000000 * 0.001 * 335 / 365) == 458904
  - 35000000 - 458904 == 34541096 and round((35000000 - 458904) / 1e6, 1) == 34.5
  steps:
  - show: "<p><b>Ba khái niệm cốt lõi trong nghiệp vụ tiền gửi ngân hàng</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>thuật ngữ</th><th>bản chất nghiệp vụ</th><th>đặc\
      \ điểm kỹ thuật</th></tr>\n  <tr><td>Term Deposit</td><td>hợp đồng tiền gửi\
      \ có kỳ hạn định trước</td><td>hưởng lãi suất cố định nếu giữ đến ngày đáo hạn</td></tr>\n\
      \  <tr><td>Mã CIF</td><td>Customer Information File: mã định danh duy nhất của một khách hàng</td><td>liên\
      \ kết toàn bộ tài khoản và sổ tiết kiệm của người đó</td></tr>\n  <tr><td>Rút\
      \ trước hạn</td><td>khách hàng rút vốn trước ngày đáo hạn</td><td>phần rút\
      \ thường chỉ hưởng lãi suất không kỳ hạn (rất thấp; theo thông tư NHNN về tiền gửi)</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu ba khái niệm cốt lõi trong ngân hàng. Hợp đồng tiền
      gửi có kỳ hạn mang lại lãi suất cố định hấp dẫn. Mã CIF là mã định danh duy
      nhất của mỗi khách hàng trong sổ cái. Còn nếu rút trước hạn, phần tiền rút thường
      chỉ được hưởng lãi suất không kỳ hạn, rất thấp.
  - clear: true
    show: '<div class="box key">Ví dụ: Khách hàng gửi $500$ triệu đồng kỳ hạn $12$
      tháng với lãi suất $7\%$. Tiền lãi dự kiến là $500 \times 7\% = 35$ triệu đồng.
      Nếu rút trước hạn ở tháng thứ $11$ (khoảng $335$ ngày) và hưởng lãi không kỳ
      hạn giả định $0{,}1\%$/năm: $500\,000\,000 \times 0{,}1\% \times 335 / 365 \approx
      458\,904$ đồng, tức khoảng $459$ nghìn đồng (ví dụ minh họa). Khách mất $35\,000\,000
      - 458\,904 \approx 34{,}5$ triệu đồng tiền lãi.<br/>

      Vì vậy, thay vì rút trước hạn, người cần tiền có thể <b>chuyển nhượng</b> hợp
      đồng cho người khác: người mua trả tiền và nhận quyền hưởng lãi khi đến hạn.</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Ta xét một ví dụ minh họa. Khách hàng gửi 500 triệu đồng kỳ hạn một năm với
      lãi suất 7 phần trăm, nếu giữ đến hạn thì nhận 35 triệu đồng tiền lãi. Nếu rút
      trước hạn ở tháng thứ mười một, tức khoảng 335 ngày, và chỉ hưởng lãi không
      kỳ hạn 0 phẩy 1 phần trăm một năm, tiền lãi chỉ còn khoảng 459 nghìn đồng. Như
      vậy khách mất khoảng 34 phẩy 5 triệu đồng tiền lãi. Vì vậy, thay vì rút trước
      hạn, người cần tiền có thể chuyển nhượng hợp đồng tiền gửi cho người khác trên
      một sàn chuyển nhượng.
