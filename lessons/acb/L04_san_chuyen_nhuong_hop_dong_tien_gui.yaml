    show: '<p><b>Bước 4 — Đoạn mã xử lý kết quả trong Go Fiber</b>:</p>

      <div class="box code"><code>n, err := res.RowsAffected() // res: sql.Result của câu UPDATE<br/>

      if err != nil { return err }<br/>

      if n == 0 {<br/>

      &nbsp;&nbsp;return c.Status(fiber.StatusConflict).JSON(fiber.Map{<br/>

      &nbsp;&nbsp;&nbsp;&nbsp;"code": "409", "message": "Hợp đồng tiền gửi đã có giao
      dịch khác!",<br/>

      &nbsp;&nbsp;})<br/>

      }</code></div>

      <p>Mã viết bằng Go, một ngôn ngữ khác Java: <code>:=</code> vừa khai báo vừa gán;
      hàm trả hai giá trị <code>n</code> và <code>err</code>; <code>nil</code> giống
      <code>null</code> của Java, <code>err != nil</code> nghĩa là có lỗi.</p>'
    focus:
    - 0
    - 0
    - 0
