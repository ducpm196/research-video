      <p>409 là mã lỗi của HTTP, quy ước để ứng dụng và máy chủ nói chuyện qua mạng: mỗi trả lời kèm một mã số, 200 là thành công, 409 là xung đột (dữ liệu vừa bị người khác đổi).</p>
    focus: [0, 0, 0, 0, 0, 0]
    say: 'Nhìn lên sơ đồ bốn tầng của sàn chuyển nhượng. Khách hàng bấm mua sổ trên ứng dụng di động. Dịch vụ viết bằng Fiber, một khung viết dịch vụ chạy trên máy chủ bằng ngôn ngữ khác Java, tiếp nhận và thực thi câu lệnh khoá lạc quan trên PostgreSQL. PostgreSQL là hệ quản trị cơ sở dữ liệu quan hệ mã nguồn mở. Khi hai người tranh nhau, dịch vụ trả mã 409, mã của giao thức truyền tin qua mạng, nghĩa là xung đột, còn mã 200 là thành công. Sau khi khoá thành công, hệ thống gửi bản tin OFS sang Core T24 để đổi quyền sở hữu sổ cái.'
  - clear: true
    show: |-
      <table class="t">
        <tr><th>tiêu chí so sánh</th><th>Khoá Bi quan (Pessimistic)</th><th>Khoá Lạc quan (Optimistic)</th></tr>
