source: curriculum/acb.yaml L04; Kiến trúc Sàn chuyển nhượng hợp đồng tiền gửi contract-transfer
  Go Fiber và PostgreSQL; tài liệu Temenos về OFS (chưa kiểm được phiên bản); thời gian
  và tỉ lệ trong bài là ví dụ minh họa; TT 48/2018/TT-NHNN (tiền gửi tiết kiệm, có chuyển
  giao quyền sở hữu) và TT 49/2018/TT-NHNN (tiền gửi có kỳ hạn, rút trước hạn) — chưa kiểm
  được điều khoản nguyên văn (truy cập 2026-11-10)
assumes:
- arith
- approx
objectives:
- Hiểu rõ nghiệp vụ chuyển nhượng sổ tiết kiệm thứ cấp và nguy cơ xung đột đồng thời
- Thiết kế cơ chế Khóa Lạc quan với trường thời điểm truy cập trên PostgreSQL
- Tích hợp bản tin T24 OFS đổi chủ sở hữu và xử lý ma trận mã lỗi treo lệnh
