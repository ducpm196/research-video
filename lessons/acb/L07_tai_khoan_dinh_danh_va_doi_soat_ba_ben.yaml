    say: "Nếu kẹt, tính lại mã từ gói nhận được rồi so với mã đính kèm. Với mã sự kiện, dùng một tập, thấy rồi thì bỏ qua. Với ba nguồn, xét từng mã có mặt ở nguồn nào, rồi chọn đúng dòng của bảng phân loại. Danh sách đổi thành tập thì bỏ mã trùng, và dấu gạch đứng lấy hợp hai tập. Hàm xếp đặt các mã từ nhỏ đến lớn. Chữ trong hỏi mã có nằm trong danh sách không, còn chữ không đảo đúng thành sai."
