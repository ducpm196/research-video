- id: symbol
  kind: symbol
  title: Cấu trúc Gói tin Webhook và Mã xác thực HMAC-SHA256
  steps:
  - show: '<p><b>Gói tin Webhook Gạch nợ gửi sang ERP đối tác</b>:</p>

      <div class="box code"><code>POST /api/v1/webhook/billing-clear &nbsp;|&nbsp;
      Host: partner-erp.com<br/>

      X-Event-ID: evt_9a8b7c6d5e4f3a2b &nbsp;|&nbsp; X-Signature: sha256=4f5d6e7a...<br/>

      {"virtual_account": "888800123456", "order_id": "ORD_9999", "amount": 1000000,
      "currency": "VND"}</code></div>

      <div class="box key">Khóa an toàn: Header <code>X-Event-ID</code> chống gọi
      lặp, mã <code>X-Signature</code> chống giả mạo! (tên header là ví dụ thiết kế)</div>

      <p>HMAC-SHA256: mã xác thực tính từ nội dung bản tin và một khoá bí mật hai bên
      cùng giữ (không phải chữ ký số khoá công khai); bên nhận tính lại rồi so khớp.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Đây là cấu trúc bản tin thông báo gạch nợ mẫu mực. Bản tin chứa mã sự kiện
      duy nhất, số tài khoản ảo, số tiền và mã xác thực HMAC. Mã này được tính từ
      nội dung bản tin với một khoá bí mật mà hai bên cùng giữ. Bên nhận tính lại mã
      và so khớp, nên gói tin bị sửa hay bị giả mạo trên đường truyền sẽ bị phát hiện.
- id: example
  kind: example
  title: Bốn bước từ Nhận tiền, Ghi Có đến Đối soát Two-Pointer
  checks:
  - 1000000 // 1000 == 1000
  - 3000000 - 500000 == 2500000
  - 180 < 300
  - sorted(set([1, 2, 4]) & set([1, 2, 3, 4]) & set([1, 4])) == [1, 4]
  - sorted((set([1, 2, 4]) & set([1, 2, 3, 4])) - set([1, 4])) == [2]
  - sorted(set([1, 2, 3, 4]) - set([1, 2, 4])) == [3]
  steps:
  - show: "<p><b>Bước 1 — Tiếp nhận giao dịch chuyển tiền NAPAS vào số VA</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>trường dữ liệu</th><th>giá trị tiếp nhận</th><th>ý\
      \ nghĩa định tuyến</th></tr>\n  <tr><td>Số tài khoản đích</td><td><code>888800123456</code></td><td>Đầu\
      \ số VA của đối tác thương mại điện tử</td></tr>\n  <tr><td>Số tiền giao dịch</td><td>$1{,}000{,}000\\\
      text{ VND}$</td><td>Khớp chính xác giá trị đơn hàng ORD_9999</td></tr>\n  <tr><td>Tài\
      \ khoản thực Master</td><td><code>MST_123456789</code></td><td>Nơi nhận dòng\
      \ tiền thực tế trên Core Banking</td></tr>\n</table>\n<div class=\"box key\">Khóa\
      \ phân tán Redis <code>SET va:dedup:TXN_8888 NX EX 120</code> chặn nhanh bản\
      \ tin trùng; chốt cuối là ràng buộc UNIQUE theo mã giao dịch trong cơ sở dữ liệu.</div>"
    focus:
    - 0
    - 0
    - 0
    say: Bước một, người mua quét mã chuyển khoản một triệu đồng từ ngân hàng khác.
      Cổng thanh toán tiếp nhận bản tin và bóc tách đầu số tài khoản ảo. Hệ thống
      nhận diện đây là thanh toán cho đơn hàng 9999 của đối tác.
