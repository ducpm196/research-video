scenes:
- id: hook
  kind: hook
  title: Thách thức gạch nợ tự động hàng trăm nghìn đơn hàng mỗi ngày
  steps:
  - show: '<p>Mỗi ngày, các sàn thương mại điện tử và công ty bảo hiểm thu hộ hàng
      trăm nghìn đơn hàng.</p>

      <div class="box key">Làm sao một ngân hàng như ACB có thể định danh chính xác
      người nộp tiền trong một giây mà không cần đối soát thủ công từng dòng sao kê?</div>'
    focus:
    - 0
    - 0
    - 0
    say: "Chào bạn, các sàn thương mại điện tử thu hộ hàng trăm nghìn đơn mỗi ngày. Hệ thống cần tự động gạch nợ tức thì cho từng người mua. Gạch nợ nghĩa là đánh dấu một khoản phải thu, ví dụ một đơn hàng, là đã được trả tiền."
  - clear: true
    show: "<table class=\"t\">\n  <tr><th>thách thức thu hộ</th><th>hậu quả vận hành</th><th>giải\
      \ pháp kiến trúc</th></tr>\n  <tr><td>Gạch nợ thủ công bằng tay</td><td>Chậm\
      \ trễ giao hàng, tốn nhân lực đối soát</td><td>Tài khoản Định danh Virtual Account</td></tr>\n\
      \  <tr><td>Webhook gửi trùng sang ERP</td><td>Đối tác gạch nợ hoặc cộng tiền\
      \ cho khách hai lần</td><td>Mã xác thực kèm gói tin và mã sự kiện duy nhất</td></tr>\n\
      \  <tr><td>Lệch tiền giữa các hệ thống cuối ngày</td><td>Thất thoát doanh thu,\
      \ sai lệch sổ cái</td><td>Thuật toán đối soát 3 bên Two-Pointer</td></tr>\n\
      </table>\n<p>Hôm nay, ta làm chủ: <b>Tài khoản Định danh Virtual Account</b>,\
      \ <b>Webhook lũy đẳng</b> (Idempotent: gửi lại bao nhiêu lần, kết quả vẫn chỉ tính một lần), và <b>Đối soát 3 bên cuối ngày</b> (EOD, End Of Day).</p>"
    focus:
    - 0
    - 0
    - 0
    say: "Hôm nay ta học thu hộ tự động, gồm tài khoản định danh, thông báo an toàn và đối soát ba bên. Lũy đẳng nghĩa là gửi lại bao nhiêu lần, kết quả vẫn chỉ tính một lần, còn đối soát cuối ngày, viết tắt là e ô đê, là so ba nguồn số liệu cuối mỗi ngày. ERP là phần mềm quản trị doanh nghiệp của đối tác, còn Webhook là việc máy chủ ngân hàng gọi sang máy chủ đối tác để báo tin."
    introduces:
    - acb_webhook
- id: prereq
  kind: prereq
  title: 'Kiến thức nền: Tài khoản Master, số Virtual Account và Gạch nợ'
  checks:
  - '"8888" + "00123456" == "888800123456" and len("888800123456") == 4 + 8'
  steps:
  - show: "<p><b>Ba khái niệm nền tảng trong thu hộ doanh nghiệp</b>:</p>\n<table\
      \ class=\"t\">\n  <tr><th>khái niệm</th><th>đặc điểm cốt lõi</th><th>vai trò\
      \ trong thanh toán</th></tr>\n  <tr><td>Tài khoản thực Master</td><td>Tài khoản\
      \ thanh toán thật của doanh nghiệp mở tại ngân hàng</td><td>Nơi nhận và gom\
      \ dòng tiền thực tế</td></tr>\n  <tr><td>Virtual Account</td><td>Số tài khoản\
      \ ảo sinh động gán cho từng đơn hàng hoặc khách hàng</td><td>Đóng vai trò định\
      \ tuyến dòng tiền nộp</td></tr>\n  <tr><td>Gạch nợ Billing Clear</td><td>Cập\
      \ nhật trạng thái đơn hàng từ chưa trả sang đã thanh toán</td><td>Mở khoá giao\
      \ hàng hoặc kích hoạt bảo hiểm</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: "Trước hết là ba khái niệm cốt lõi của thu hộ. Tài khoản thực là nơi chứa tiền thật của doanh nghiệp tại ngân hàng. Tài khoản ảo là chuỗi số định danh gán riêng cho từng khách mua. Gạch nợ là cập nhật đơn hàng từ chưa trả sang đã thanh toán."
  - clear: true
    show: '<div class="box key">Quy tắc định dạng: Số VA (số tài khoản ảo) gồm tiền tố đối tác (4 chữ
      số như <code>8888</code>) cộng mã định danh đơn hàng (ví dụ <code>00123456</code>,
      8 chữ số), tổng cộng $4 + 8 = 12$ chữ số. Khi chuyển tiền vào <code>888800123456</code>,
      tiền chảy vào tài khoản thực và đối tác biết ngay ai đã trả tiền!</div>'
    focus:
    - 0
    - 0
    - 0
    say: "Ví dụ số tài khoản ảo bắt đầu bằng đầu số 8888 của sàn thương mại điện tử. Phía sau là mã đơn hàng tám chữ số, nên số ảo dài mười hai chữ số. Chuyển tiền vào số này thì hệ thống biết đích danh đơn hàng cần gạch nợ."
