      <div class="box key">Cơ sở dữ liệu hiện đại cũng nối bảng bằng hash join (nạp một bảng vào bảng băm rồi tra từng dòng của bảng kia) hoặc sort-merge join (chính là sắp xếp rồi trộn bằng con trỏ), không phải $O(N^2)$. Đối soát thường làm trên tệp trích xuất vì dữ liệu đến từ ba nguồn khác nhau (sổ cái, tệp NAPAS, nhật ký đối tác) và để không đè tải lên cơ sở dữ liệu đang phục vụ giao dịch. Với 3 triệu giao dịch, mục tiêu ví dụ 180 giây là khả thi; thời gian thật phải đo.</div>
