      <tr><td>header, payload</td><td>header là các dòng thông tin kèm theo (tên: giá trị); payload là phần dữ liệu chính của bản tin</td></tr></table>
    say: "Trước khi xem bản tin, ta làm rõ vài từ. HTTP là quy ước để hai máy nói chuyện qua mạng, trả lời kèm mã số như 200 là thành công, 500 là lỗi phía máy chủ. Dòng đầu ghi phương thức và đường dẫn. Dòng thông tin kèm theo là phần đầu, dữ liệu chính là phần thân."
