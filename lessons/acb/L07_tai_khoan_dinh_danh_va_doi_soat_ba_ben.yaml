      <div class="box key"><b>Nếu kẹt:</b> HMAC: tính lại từ gói nhận được rồi so với mã đính kèm. Mã sự kiện: dùng một tập; thấy rồi thì bỏ qua. Ba nguồn: với mỗi mã trong hợp của ba danh sách, xét mã có mặt ở nguồn nào rồi chọn đúng dòng của bảng phân loại.<br>Lời giải đầy đủ ở <code>labs/ACB/L07/loi_giai.py</code> — chỉ mở sau khi bạn đã thử.</div>
      <table class="t"><tr><th>viết trong lời giải</th><th>đọc là</th><th>ví dụ</th></tr>
      <tr><td><code>set(core) | set(napas)</code></td><td><code>set(danh_sách)</code> đổi danh sách thành tập, bỏ mã trùng; dấu gạch đứng là <b>hợp</b>: mọi mã có ở một trong hai tập</td><td><code>set([1, 2]) | set([2, 3])</code> là <code>{1, 2, 3}</code></td></tr>
      <tr><td><code>sorted(...)</code></td><td>xếp các mã từ nhỏ đến lớn</td><td><code>sorted({3, 1, 2})</code> là <code>[1, 2, 3]</code></td></tr>
