- id: code
  kind: example
  title: 'Chạy thử bằng mã Python: HMAC, webhook, hai con trỏ'
  checks:
  - 1000000 * 9 == 9000000 and len('888800123456') == 12
  - '{''a'': [1, 2, 4], ''b'': [1, 2, 3, 4]}[''b''][2] == 3 and sorted(set([1, 2,
    3, 4]) - set([1, 2, 4])) == [3]'
  steps:
  - clear: true
    show: |-
      <p><b>Đọc trước: ba chỗ lạ trong mã HMAC</b></p>
      <table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr>
      <tr><td><code>b"bi-mat-chung"</code></td><td>chữ <code>b</code> trước dấu nháy: chuỗi byte (byte = đơn vị nhớ nhỏ, đủ chứa một chữ cái), tức dữ liệu thô gồm các số</td><td>khoá bí mật hai bên cùng giữ</td></tr>
      <tr><td><code>noi_dung.encode()</code></td><td>đổi chuỗi chữ thành chuỗi byte để đưa cho hàm tính mã</td><td><code>"abc".encode()</code> ra <code>b"abc"</code></td></tr>
      <tr><td><code>import hashlib, hmac</code><br><code>hmac.new(…).hexdigest()</code><br><code>[:12]</code></td><td>dòng đầu nạp hai thư viện một lần, cách nhau dấu phẩy; <code>hmac.new</code> tính mã từ khoá và nội dung, viết ra chữ số hệ mười sáu, <code>[:12]</code> lấy 12 ký tự đầu</td><td>mã ngắn cho dễ đọc</td></tr><tr><td><code>def ky(noi_dung):</code> và <code>print(...)</code></td><td><code>def</code> đặt tên cho một hàm, <code>return</code> trả kết quả ra khỏi hàm; <code>print(...)</code> in giá trị ra màn hình</td><td><code>print(2 + 3)</code> in <code>5</code></td></tr></table>
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
    introduces:
    - acb_byte
    say: 'Trước khi xem mã, ta đọc bốn chỗ lạ. Chữ b trước dấu nháy tạo dữ liệu thô gồm các số thay vì chữ. Phương thức mã hoá đổi chuỗi chữ thành dữ liệu thô để đưa cho hàm tính mã. Dòng nạp thư viện lấy hai thư viện cùng lúc, rồi hàm tạo mã nhận khoá và nội dung và cắt lấy 12 ký tự đầu. Dòng mở đầu một hàm đặt tên cho đoạn việc, lệnh trả đưa kết quả ra, lệnh in hiện giá trị ra màn hình.'
  - clear: true
    show: |-
      <p><b>Đọc trước: hai chỗ nữa trong mã HMAC</b></p>
