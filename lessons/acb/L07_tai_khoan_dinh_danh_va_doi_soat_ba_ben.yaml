- id: quiz
  kind: quiz
  title: Thử thách tối ưu hóa thuật toán Đối soát
  checks:
  - 3000000 // 1000000 == 3
  - 3000000 ** 2 == 9 * 10 ** 12
  - round(math.log2(3e6), 1) == 21.5
  - round(3e6 * math.log2(3e6) / 1e7, 1) == 6.5
  steps:
  - pause: 15
    show: "<p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong bài toán đối soát 3 triệu\
      \ bản ghi giao dịch cuối ngày giữa Core Banking, NAPAS và Đối tác, vì sao cách\
      \ sắp xếp rồi trộn bằng con trỏ (Two-Pointer Merge) nhanh hơn rất nhiều so với\
      \ vòng lặp lồng nhau so từng cặp bản ghi?</p>\n<ul>\n  <li><b>A</b>: Vì sau\
      \ khi sắp xếp, mỗi con trỏ chỉ đi tới: tốn $O(N \\log N)$ cho sắp xếp và $O(N)$\
      \ cho trộn, thay vì $O(N^2)$ của vòng lặp lồng nhau.</li>\n  <li><b>B</b>: Vì\
      \ con trỏ kép không cần mã giao dịch.</li>\n  <li><b>C</b>: Vì vòng lặp lồng\
      \ nhau chỉ chạy được tối đa 100 dòng dữ liệu.</li>\n  <li><b>D</b>: Vì con trỏ\
      \ kép tự động nạp tiền vào tài khoản ngân hàng.</li>\n</ul>\n<p>Ký hiệu: $\\\
      log N$ (lấy cơ số 2) là số lần phải chia đôi $N$ cho tới khi còn $1$; chữ O(…)\
      \ chỉ cỡ số bước khi $N$ lớn.</p>"
    introduces:
    - log
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Hãy cùng bước vào một câu hỏi luyện tập về thuật toán đối soát. Ký hiệu
      lốc của N, lấy cơ số hai, là số lần phải chia đôi N cho tới khi còn một. Vì sao cách
      sắp xếp rồi trộn bằng con trỏ lại nhanh hơn rất nhiều so với vòng lặp lồng nhau
      khi đối soát hàng triệu bản ghi cuối ngày? Bạn có 15 giây suy nghĩ trước khi
      nghe đáp án chuẩn xác.
  - clear: true
    show: "<div class=\"box key\"><b>Đáp án chính xác là A</b>!</div>\n<p><b>Bước\
      \ 1 — Đếm số phép so với $N = 3\\,000\\,000$</b>:</p>\n<table class=\"t\">\n\
      \  <tr><th>phương pháp đối soát</th><th>độ phức tạp</th><th>số phép so (xấp\
      \ xỉ)</th></tr>\n  <tr><td>Vòng lặp lồng nhau</td><td>$O(N^2)$</td><td>$N^2\
      \ = 9 \\times 10^{12}$</td></tr>\n  <tr><td>Sắp xếp + trộn con trỏ</td><td>$O(N\
      \ \\log N) + O(N)$</td><td>$N \\log N \\approx 3 \\times 10^6 \\times 21{,}5\
      \ \\approx 6{,}5 \\times 10^7$, cộng $3 \\times 10^6$ bước trộn</td></tr>\n\
      </table>"
    focus:
    - 0
    - 0
    - 0
    say: Đáp án chính xác là phương án A. Với 3 triệu bản ghi, vòng lặp lồng nhau
