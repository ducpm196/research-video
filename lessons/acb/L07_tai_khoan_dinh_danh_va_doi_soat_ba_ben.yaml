- id: symbol
  kind: symbol
  title: Cấu trúc Gói tin Webhook và Chữ ký số HMAC-SHA256
  steps:
  - show: '<p><b>Gói tin Webhook Gạch nợ gửi sang ERP đối tác</b>:</p>

      <div class="box code"><code>POST /api/v1/webhook/billing-clear &nbsp;|&nbsp;
      Host: partner-erp.com<br/>

      X-ACB-Event-ID: evt_9a8b7c6d5e4f3a2b &nbsp;|&nbsp; X-ACB-Signature: sha256=4f5d6e7a...<br/>

      {"virtual_account": "888800123456", "order_id": "ORD_9999", "amount": 1000000,
      "currency": "VND"}</code></div>

      <div class="box key">Khóa an toàn: Header <code>X-ACB-Event-ID</code> chống
      gọi lặp, chữ ký <code>X-ACB-Signature</code> chống giả mạo!</div>'
    focus:
    - 0
    - 0
    - 0
    say: Đây là cấu trúc bản tin thông báo gạch nợ mẫu mực. Bản tin chứa mã sự kiện
      duy nhất, số tài khoản ảo, số tiền và chữ ký điện tử bí mật. Chữ ký bảo đảm
      gói tin không bị giả mạo trên đường truyền mạng.
- id: example
  kind: example
  title: Bốn bước từ Nhận tiền, Ghi Có đến Đối soát Two-Pointer
  checks:
  - 1000000 // 1000 == 1000
  - 3000000 - 500000 == 2500000
  - 180 < 300
  steps:
  - show: "<p><b>Bước 1 — Tiếp nhận giao dịch chuyển tiền NAPAS vào số VA</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>trường dữ liệu</th><th>giá trị tiếp nhận</th><th>ý\
      \ nghĩa định tuyến</th></tr>\n  <tr><td>Số tài khoản đích</td><td><code>888800123456</code></td><td>Đầu\
      \ số VA của đối tác thương mại điện tử</td></tr>\n  <tr><td>Số tiền giao dịch</td><td>$1{,}000{,}000\\\
      text{ VND}$</td><td>Khớp chính xác giá trị đơn hàng ORD_9999</td></tr>\n  <tr><td>Tài\
      \ khoản thực Master</td><td><code>ACB_123456789</code></td><td>Nơi nhận dòng\
      \ tiền thực tế trên Core T24</td></tr>\n</table>\n<div class=\"box key\">Khóa\
      \ phân tán Redis <code>SET va:dedup:TXN_8888 NX EX 120</code> bảo đảm chỉ xử\
      \ lý một lần duy nhất.</div>"
    focus:
    - 0
    - 0
    - 0
    say: Bước một, người mua quét mã chuyển khoản một triệu đồng từ ngân hàng khác.
      Cổng thanh toán tiếp nhận bản tin và bóc tách đầu số tài khoản ảo. Hệ thống
      nhận diện đây là thanh toán cho đơn hàng 9999 của đối tác.
  - clear: true
    show: "<p><b>Bước 2 — Hạch toán ghi Có vào Tài khoản thực trên Core T24</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>thông số hạch toán</th><th>giá trị (ví dụ minh họa)</th><th>mục\
      \ tiêu thiết kế</th></tr>\n  <tr><td>Bản tin lõi</td><td><code>FUNDS.TRANSFER</code></td><td>Hạch\
      \ toán tăng số dư tức thời</td></tr>\n  <tr><td>Thời gian ghi Có</td><td>$35\\\
      text{ mili giây}$</td><td>Mục tiêu ví dụ $\\le 100\\text{ mili giây}$</td></tr>\n\
      \  <tr><td>Luồng phát sự kiện</td><td>Topic <code>va.payment.success</code></td><td>Gửi\
      \ tiếp sang Webhook Dispatcher</td></tr>\n</table>\n<div class=\"box key\">Ví dụ minh họa: ghi Có\
      \ mất khoảng $35$ mili giây, cả bước kể cả phát sự kiện khoảng $80$ mili giây.</div>"
    focus:
    - 0
    - 0
    - 0
    say: Bước hai, hệ thống phát lệnh ghi Có vào tài khoản thực của doanh nghiệp trên
      sổ cái lõi. Sau khi hạch toán xong, một sự kiện được đẩy vào luồng truyền dữ
      liệu để gửi thông báo gạch nợ. Trong ví dụ minh họa, toàn bộ bước này mất khoảng
      80 mi li giây.
  - clear: true
    show: "<p><b>Bước 3 — Bắn Webhook gạch nợ sang ERP đối tác kèm chữ ký HMAC</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>thao tác gửi webhook</th><th>cơ chế bảo vệ</th><th>kết\
      \ quả xử lý</th></tr>\n  <tr><td>Ký số HMAC-SHA256</td><td>Khóa bí mật dùng\
      \ chung</td><td>Chống giả mạo gói tin trên đường truyền</td></tr>\n  <tr><td>Header\
      \ X-ACB-Event-ID</td><td>Khóa Redis chống trùng</td><td>ERP gạch nợ an toàn\
      \ không sợ gọi lặp</td></tr>\n</table>\n<div class=\"box key\">Đơn hàng được\
      \ cập nhật sang trạng thái ĐÃ THANH TOÁN và tự động kích hoạt xuất kho!</div>"
    focus:
    - 0
    - 0
    - 0
    say: Bước ba, cổng dịch vụ gửi bản tin thông báo sang hệ thống máy chủ đối tác
      kèm mã định danh sự kiện. Đối tác ghi nhận đơn hàng đã thanh toán thành công
      và tự động đóng gói xuất kho. Khách hàng nhận được thông báo ngay lập tức.
  - clear: true
    show: "<p><b>Bước 4 — Đối soát 3 bên cuối ngày bằng thuật toán Two-Pointer Merge</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>bộ dữ liệu đối soát</th><th>số lượng bản ghi</th><th>phương\
      \ pháp tối ưu hóa</th></tr>\n  <tr><td>Core T24 Ledger</td><td>3,000,000 dòng</td><td>Sắp\
      \ xếp trước theo trans_id trong bộ nhớ</td></tr>\n  <tr><td>NAPAS Clearing File</td><td>3,000,000\
      \ dòng</td><td>Chạy con trỏ song song duyệt tịnh tiến $O(N)$</td></tr>\n  <tr><td>Partner\
      \ ERP Log</td><td>3,000,000 dòng</td><td>Mục tiêu ví dụ: phân loại xong sai lệch trong $180$\
      \ giây</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    say: Bước bốn, đến 23 giờ đêm, tiến trình đối soát ba bên tự động kích hoạt. Thuật
      toán con trỏ kép so khớp 3 triệu bản ghi trên bộ nhớ, với mục tiêu ví dụ là
      180 giây. Giao dịch khớp được quyết toán, giao dịch lệch được chuyển sang tra
      soát.
- id: check
  kind: check
  title: Xử lý sự cố mạng đối tác khi nhận Webhook
  checks:
  - 50000000 > 10000000
  - 180 < 600
  steps:
  - show: "<p><b>Tình huống phỏng vấn</b>: Sau khi tiền đã vào tài khoản thực, Webhook\
      \ bắn sang ERP đối tác bị lỗi HTTP 500 hoặc Timeout. Bạn thiết kế xử lý ra sao\
      \ để đối tác không bị gạch nợ hai lần khi thử lại?</p>\n<table class=\"t\">\n\
      \  <tr><th>cách xử lý sai lầm</th><th>giải pháp chuẩn mực Senior</th></tr>\n\
      \  <tr><td>Thử lại liên tục tức thì dồn dập</td><td>Exponential Backoff lùi\
      \ thời gian có chu kỳ</td></tr>\n  <tr><td>Gửi lại không kèm mã định danh sự\
      \ kiện</td><td>Bắt buộc kèm header X-ACB-Event-ID duy nhất</td></tr>\n  <tr><td>Bỏ\
      \ qua khi gửi không thành công</td><td>Chuyển bản tin lỗi vào Dead Letter Queue</td></tr>\n\
      </table>"
    focus:
    - 0
    - 0
    - 0
    say: Ta kiểm tra tình huống phỏng vấn kinh điển tại ACB. Khi gửi thông báo sang
      đối tác mà gặp lỗi 500 hoặc hết giờ, ta xử lý thế nào? Do việc gửi lại ngay
      lập tức mà không có khóa kiểm soát có thể gây cộng tiền hai lần.
  - clear: true
    show: '<div class="box key"><b>Quy tắc bảo đảm Idempotency</b>: Đối tác sử dụng
      mã sự kiện <code>X-ACB-Event-ID</code> để kiểm tra trong Redis. Nếu mã đã tồn
      tại và đơn hàng đã gạch nợ, đối tác trả về ngay <code>HTTP 200 OK</code> mà
      không cập nhật số dư lần hai! Nếu sau 3 lần thử lại vẫn lỗi, bản tin được lưu
      vào Dead Letter Queue để chờ đối soát đêm.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Giải pháp chuẩn mực là áp dụng cơ chế thử lại lùi thời gian theo cấp số nhân
      kết hợp mã sự kiện duy nhất. Đối tác kiểm tra mã này trên bộ nhớ đệm để từ chối
      xử lý lặp. Nếu sau ba lần vẫn lỗi thì đưa vào hàng đợi chờ rà soát.
- id: pitfall
  kind: pitfall
  title: Ba sai lầm chí mạng trong Virtual Account và Đối soát
  steps:
  - show: "<table class=\"t\">\n  <tr><th>sai lầm sơ cấp</th><th>hậu quả kỹ thuật\
      \ & tài chính</th><th>giải pháp chuẩn Senior</th></tr>\n  <tr><td>Tra cứu tiền\
      \ tố bằng LIKE hoặc Substring</td><td>Gây quét toàn bộ bảng khi hàng triệu tài\
      \ khoản ảo</td><td>Đánh chỉ mục B-Tree hoặc dùng Radix Tree in-memory</td></tr>\n\
      \  <tr><td>Webhook không có chữ ký số bí mật</td><td>Bị tấn công giả mạo bắn\
      \ bản tin gạch nợ khống</td><td>Ký số toàn bộ payload bằng HMAC-SHA256</td></tr>\n\
      \  <tr><td>Dùng vòng lặp lồng nhau đối soát cuối ngày</td><td>Độ phức tạp $O(N^2)$\
      \ làm sập hệ thống sau nửa đêm</td><td>Sắp xếp trước và dùng thuật toán Two-Pointer\
      \ $O(N)$</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Có ba sai lầm nghiêm trọng cần tuyệt đối tránh. Thứ nhất là tra cứu chuỗi
      ký tự chậm chạp làm sập cơ sở dữ liệu. Thứ hai là gửi thông báo không ký số
      khiến đối tác bị tấn công giả mạo. Thứ ba là dùng vòng lặp lồng nhau gây nghẽn
      bộ nhớ khi đối soát.
- id: quiz
  kind: quiz
  title: Thử thách tối ưu hóa thuật toán Đối soát tại ACB
  checks:
  - 3000000 // 1000000 == 3
  - 180 - 15 == 165
  steps:
  - pause: 15
    show: "<p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong bài toán đối soát 3 triệu\
      \ bản ghi giao dịch cuối ngày giữa Core Banking, NAPAS và Đối tác, tại sao thuật\
      \ toán con trỏ kép (Two-Pointer Merge) lại vượt trội hoàn toàn so với việc dùng\
      \ câu lệnh SQL JOIN truyền thống?</p>\n<ul>\n  <li><b>A</b>: Vì sắp xếp trước\
      \ và duyệt con trỏ kép đạt độ phức tạp tuyến tính O(N), chạy trực tiếp trong\
      \ RAM mà không gây nghẽn ổ đĩa cơ sở dữ liệu.</li>\n  <li><b>B</b>: Vì con trỏ\
      \ kép không cần mã giao dịch.</li>\n  <li><b>C</b>: Vì SQL JOIN chỉ hỗ trợ tối\
      \ đa 100 dòng dữ liệu.</li>\n  <li><b>D</b>: Vì con trỏ kép tự động nạp tiền\
      \ vào tài khoản ngân hàng.</li>\n</ul>"
    focus:
    - 0
    - 0
    - 0
    say: Hãy cùng bước vào thử thách kiến trúc phỏng vấn tại ACB. Tại sao thuật toán
      con trỏ kép lại vượt trội hoàn toàn khi đối soát hàng triệu bản ghi cuối ngày?
      Bạn có 15 giây suy nghĩ trước khi nghe đáp án chuẩn xác.
  - clear: true
    show: "<div class=\"box key\"><b>Đáp án chính xác là A</b>!</div>\n<p><b>Bước\
      \ 1 — Phân tích nút thắt của câu lệnh SQL JOIN</b>:</p>\n<table class=\"t\"\
      >\n  <tr><th>phương pháp đối soát</th><th>độ phức tạp thời gian</th><th>ảnh\
      \ hưởng tài nguyên</th></tr>\n  <tr><td>SQL JOIN 3 bảng lớn</td><td>$O(N^2)$\
      \ hoặc quét toàn bảng</td><td>Gây nghẽn Disk I/O và treo database nhiều giờ</td></tr>\n\
      \  <tr><td>Two-Pointer Merge</td><td>$O(N \\text{ log } N) + O(N)$</td><td>Chạy\
      \ trên RAM, mục tiêu ví dụ $180$ giây</td></tr>\n</table>"
    focus:
    - 0
    - 0
    say: Đáp án chính xác là phương án A. Câu lệnh kết nối bảng thông thường đòi hỏi
      quét toàn bộ đĩa cứng và tiêu tốn lượng lớn bộ nhớ đệm.
  - clear: true
    show: '<p><b>Bước 2 — Sức mạnh của Thuật toán Con trỏ kép Two-Pointer</b>:</p>

      <div class="box key">Ta chỉ cần trích xuất file sao kê, sắp xếp theo mã giao
      dịch với độ phức tạp $O(N \text{ log } N)$, sau đó duyệt 3 con trỏ chạy tịnh
      tiến song song một lượt duy nhất với độ phức tạp $O(N)$. Với 3 triệu giao dịch,
      mục tiêu ví dụ 180 giây là khả thi; thời gian thật phải đo.</div>'
    focus:
    - 0
    - 0
    say: Thuật toán con trỏ kép sắp xếp nhanh rồi duyệt tuần tự trong RAM chỉ mất
      vài phút. Giải pháp này giúp tiết kiệm tài nguyên máy chủ tối đa.
- id: recap
  kind: recap
  title: Tổng kết chuỗi logic Thu hộ Virtual Account và Đối soát
  steps:
  - show: "<div class=\"chain\">\n  <span>Tiếp nhận giao dịch chuyển tiền NAPAS</span>\
      \ &rarr;\n  <span>Phân giải đầu số Tài khoản Định danh</span> &rarr;\n  <span>Hạch\
      \ toán ghi Có vào Tài khoản thực</span> &rarr;\n  <span>Bắn Webhook ký số HMAC\
      \ kèm Event-ID</span> &rarr;\n  <span>Đối soát 3 bên EOD bằng Two-Pointer</span>\
      \ &rarr;\n  <span>Quyết toán và bù trừ sai lệch tự động</span>\n</div>\n<table\
      \ class=\"t\" style=\"margin-top: 15px;\">\n  <tr><th>năng lực then chốt</th><th>giá\
      \ trị mang lại cho ngân hàng ACB</th></tr>\n  <tr><td>Tài khoản Định danh</td><td>Tự\
      \ động hóa phần lớn dòng tiền thu hộ, giảm can thiệp thủ công</td></tr>\n  <tr><td>Webhook\
      \ Idempotent</td><td>Chống gạch nợ hai lần khi đối tác kiểm tra Event-ID</td></tr>\n\
      \  <tr><td>Đối soát Two-Pointer</td><td>Khớp hàng triệu giao\
      \ dịch trong thời gian ngắn (phải đo), phát hiện sai lệch tài chính</td></tr>\n</table>\n<p style=\"\
      margin-top: 15px;\"><b>Khẳng định đẳng cấp Senior tại ngân hàng ACB</b>: Nắm\
      \ vững kiến trúc Virtual Account, giải thuật đối soát siêu tốc, bảo vệ an toàn\
      \ dòng tiền và tự tin chinh phục mức lương 50 triệu gross.</p>"
    focus:
    - 0
    - 0
    - 0
    say: Tóm lại, chuỗi logic gồm tiếp nhận thanh toán, phân giải tài khoản ảo, hạch
      toán tài khoản thực, gửi thông báo ký số và đối soát con trỏ kép cuối ngày.
      Nắm vững giải pháp này, bạn làm chủ toàn bộ dòng chảy thu hộ doanh nghiệp. Bạn
      hoàn toàn tự tin đảm nhiệm vị trí kỹ sư tích hợp cấp cao tại ACB.
