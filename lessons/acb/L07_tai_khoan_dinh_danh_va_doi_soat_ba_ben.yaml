- id: pitfall
  kind: pitfall
  title: Ba sai lầm chí mạng trong Virtual Account và Đối soát
  steps:
  - show: |-
      <table class="t">
        <tr><th>sai lầm sơ cấp</th><th>hậu quả kỹ thuật & tài chính</th><th>giải pháp chuẩn Senior</th></tr>
        <tr><td>Tra cứu bằng hàm cắt chuỗi trên cột (SUBSTR) hoặc LIKE '%…'</td><td>Không dùng được chỉ mục, quét toàn bảng khi có hàng triệu tài khoản ảo</td><td>So tiền tố LIKE '8888%' (bắt đầu bằng 8888, dấu % thay cho phần còn lại) trên cột có chỉ mục B-Tree (cấu trúc cây: tra một mã chỉ mất vài bước; tuỳ hệ quản trị, có thể cần kiểu chỉ mục tiền tố riêng, chưa kiểm), hoặc nạp bảng tiền tố nhỏ vào bộ nhớ</td></tr>
        <tr><td>Webhook không có mã xác thực HMAC</td><td>Bị tấn công giả mạo bắn bản tin gạch nợ khống</td><td>Tính mã HMAC-SHA256 trên toàn bộ payload</td></tr>
        <tr><td>Dùng vòng lặp lồng nhau đối soát cuối ngày</td><td>Độ phức tạp $O(N^2)$ làm sập hệ thống sau nửa đêm</td><td>Sắp xếp trước và dùng thuật toán Two-Pointer $O(N)$</td></tr>
      </table>
    focus: [0, 0, 0, 0, 0]
    say: 'Có ba sai lầm nghiêm trọng cần tránh. Thứ nhất là tra cứu bằng hàm cắt chuỗi trên cột, khiến cơ sở dữ liệu không dùng được chỉ mục và phải quét toàn bảng. Chỉ mục là bảng tra giúp tìm nhanh; so tiền tố, tức vài chữ số đầu, vẫn dùng được. Thứ hai là gửi thông báo không kèm mã xác thực, khiến đối tác bị tấn công giả mạo. Thứ ba là vòng lặp lồng nhau, khiến thời gian đối soát tăng theo bình phương số bản ghi.'
- id: quymo
  kind: example
  title: 'Quy mô và thời gian: đối soát ở ×1, ×100 và ×10 000 bản ghi (số minh hoạ)'
  checks:
  - 300 ** 2 == 90000 and 30000 ** 2 == 900000000 and 3000000 ** 2 == 9 * 10 ** 12
  - 90000 / 10 ** 9 == 0.00009 and 900000000 / 10 ** 9 == 0.9 and 9 * 10 ** 12 / 10 **
    9 == 9000 and 9000 / 3600 == 2.5
  - '[round(n * math.log2(n)) for n in (300, 30000, 3000000)] == [2469, 446180, 64549593]'
  - round(64549593 / 10 ** 9, 3) == 0.065 and round(446180 / 10 ** 9, 5) == 0.00045 and
    round(2469 / 10 ** 9, 7) == 0.0000025
  steps:
  - show: |-
      <p>Máy so $10^9$ cặp mỗi giây (số minh hoạ). $\log_2 N$ là số lần chia đôi $N$ cho tới khi còn $1$:</p><table class="t"><tr><th>cỡ</th><th>bản ghi mỗi nguồn (N)</th><th>vòng lặp lồng nhau (N × N)</th><th>thời gian ở 10⁹ phép so mỗi giây</th><th>sắp xếp + trộn (≈ N × log₂N)</th><th>thời gian (chỉ tính phép so)</th></tr><tr><td>×1</td><td>300</td><td>90&nbsp;000</td><td>0,00009 giây</td><td>2&nbsp;469</td><td>0,0000025 giây</td></tr><tr><td>×100</td><td>30&nbsp;000</td><td>900&nbsp;000&nbsp;000</td><td>0,9 giây</td><td>446&nbsp;180</td><td>0,00045 giây</td></tr><tr><td>×10&nbsp;000</td><td>3&nbsp;000&nbsp;000</td><td>9&nbsp;000&nbsp;000&nbsp;000&nbsp;000</td><td>9&nbsp;000 giây (2,5 giờ)</td><td>64&nbsp;549&nbsp;593</td><td>0,065 giây</td></tr></table><p class="note">Ví dụ $N = 3\,000\,000$: $N^2 = 9 \times 10^{12}$, chia $10^9$ ra $9\,000$ giây $= 2{,}5$ giờ; $N \log_2 N \approx 6{,}5 \times 10^7$, chia $10^9$ ra $0{,}065$ giây, chưa tính đọc tệp, sắp xếp ba nguồn và ghi kết quả; cả đối soát cần cỡ $180$ giây như mục tiêu ở ví dụ.</p>
    say: "Ta tăng số bản ghi mỗi nguồn, với số minh hoạ máy so được một tỉ cặp mỗi giây. Ký hiệu lốc hai của N là số lần chia đôi N cho tới khi còn một. Ở cỡ một, 300 bản ghi, vòng lặp lồng nhau mất chưa tới một phần nghìn giây. Ở cỡ một trăm, 30 nghìn bản ghi, nó mất gần một giây, còn sắp xếp rồi trộn chỉ nửa phần nghìn giây. Ở cỡ mười nghìn, 3 triệu bản ghi, vòng lặp lồng nhau cần 9000 giây, tức hai giờ rưỡi. Còn sắp xếp rồi trộn chỉ mất khoảng 0 phẩy 065 giây cho riêng phép so. Chưa tính đọc tệp, sắp xếp và ghi kết quả, nên cả đối soát cần cỡ 180 giây như mục tiêu."
