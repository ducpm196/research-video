id: L07
course: ACB
series: Phỏng vấn Kỹ sư Tích hợp ACB
title: Bài 7 — Thu hộ qua Tài khoản Định danh và Đối soát 3 Bên
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/acb.yaml L07; kiến trúc Thu hộ Doanh nghiệp (ob-virtual-account,
  billing-reconciliation) làm ví dụ tham chiếu; RFC 2104 (HMAC) và FIPS 180-4 (SHA-256);
  đặc tả kết nối NAPAS 247 và tài liệu Temenos chưa kiểm được; audit/acb/verify_acb.py
  L07; mã Python 3 chạy thật bằng thư viện chuẩn hmac, hashlib (máy chủ đối tác ERP,
  NAPAS, T24 là mô phỏng); số bản ghi, tốc độ so sánh (10^9 phép mỗi giây) và thời
  gian trong bài là số minh hoạ
assumes:
- arith
- approx
- acb_idem
- acb_redis
- acb_dedup
- acb_napas
- acb_core
- acb_unique
objectives:
- Phân biệt tài khoản ảo tĩnh và động, và tách số tài khoản ảo thành tiền tố đối tác
  và mã đơn
- Mô tả bốn bước từ nhận tiền, ghi có, gửi webhook đến đối soát cuối ngày
- 'Tính mã HMAC-SHA256 cho gói webhook và kiểm lại phía nhận: nội dung bị sửa thì
  mã lệch'
- 'Chạy mô phỏng nhận webhook gửi lại: lần hai cùng mã sự kiện không gạch nợ thêm'
- Chạy đối soát hai danh sách đã sắp xếp bằng hai con trỏ và đọc cách phân loại mã
  lệch khi mở rộng ra ba nguồn
- 'Chọn cách xử lý khi webhook lỗi: thử lại lùi dần, mã sự kiện, hàng đợi thư lỗi'
- 'Nhận ra ba sai lầm: tra tài khoản ảo bằng hàm cắt chuỗi, webhook không có mã xác
  thực, đối soát bằng vòng lặp lồng nhau'
- So sánh vòng lặp lồng nhau với sắp xếp rồi trộn ở ×1, ×100 và ×10 000 bản ghi
- Viết mã Python kiểm HMAC, nhận webhook theo mã sự kiện và đối soát ba nguồn với
  số mới
