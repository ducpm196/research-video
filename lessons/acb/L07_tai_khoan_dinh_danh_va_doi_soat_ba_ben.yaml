      phục vụ giao dịch. Với 3 triệu giao dịch, mục tiêu ví dụ 180 giây là khả thi;
      thời gian thật phải đo.</div>'
    focus:
    - 0
    - 0
    - 0
    say: Lưu ý, câu lệnh nối bảng của cơ sở dữ liệu hiện đại cũng dùng cách băm hoặc
      sắp xếp rồi trộn, nên không chậm tới mức vòng lặp lồng nhau. Đối soát thường
