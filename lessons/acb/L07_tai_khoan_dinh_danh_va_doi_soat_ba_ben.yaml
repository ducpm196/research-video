- id: quiz
  kind: quiz
  title: Thử thách tối ưu hóa thuật toán Đối soát
  checks:
  - 3000000 // 1000000 == 3
  - 3000000 ** 2 == 9 * 10 ** 12
  - round(math.log2(3e6), 1) == 21.5
  - round(3e6 * math.log2(3e6) / 1e7, 1) == 6.5
  steps:
  - pause: 15
    show: |-
      <p><b>Câu hỏi trắc nghiệm kiến trúc</b>: Trong bài toán đối soát 3 triệu bản ghi giao dịch cuối ngày giữa Core Banking, NAPAS và Đối tác, vì sao cách sắp xếp rồi trộn bằng con trỏ (Two-Pointer Merge) nhanh hơn rất nhiều so với vòng lặp lồng nhau so từng cặp bản ghi?</p>
      <ul>
        <li><b>A</b>: Vì con trỏ kép bỏ qua việc so mã giao dịch nên không cần sắp xếp dữ liệu trước khi chạy.</li>
        <li><b>B</b>: Vì vòng lặp lồng nhau chỉ chạy được tối đa 100 dòng dữ liệu trước khi hệ điều hành chặn.</li>
        <li><b>C</b>: Vì sau khi sắp xếp, mỗi con trỏ chỉ đi tới: sắp xếp tốn $O(N \log N)$, trộn tốn $O(N)$, thay vì $O(N^2)$.</li>
        <li><b>D</b>: Vì con trỏ kép tự động nạp thêm tiền vào tài khoản ngân hàng khi bản ghi bị thiếu.</li>
      </ul>
      <p>Ký hiệu: $\log N$ (lấy cơ số 2) là số lần phải chia đôi $N$ cho tới khi còn $1$; chữ O(…) chỉ cỡ số bước khi $N$ lớn.</p>
