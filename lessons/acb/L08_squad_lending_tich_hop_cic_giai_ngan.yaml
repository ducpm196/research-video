scenes:
- id: hook
  kind: hook
  title: Thách thức tích hợp tín dụng thấu chi và cầm cố sổ tiết kiệm
  steps:
  - show: |-
      <p>Khách hàng cần vốn gấp nhưng không muốn rút sổ tiết kiệm để tránh mất tiền lãi có kỳ hạn.</p>
      <div class="box key">Làm sao một ngân hàng có thể cấp thấu chi 85 triệu đồng bằng cách cầm cố sổ tiết kiệm 100 triệu, ký số hợp đồng online và cấp hạn mức nhanh mà không lo thất thoát vốn? (Thấu chi: cho tài khoản chi vượt số dư tới một hạn mức đã duyệt.)</div>
      <p>Sổ cái: cuốn sổ ghi mọi khoản tiền vào ra và số dư của ngân hàng; phong tỏa: khoá không cho rút phần tiền đó.</p>
    focus: [0, 0, 0, 0]
    say: 'Chào bạn, người gửi tiền cần vốn gấp nhưng không muốn rút sổ tiết kiệm để tránh mất phần lớn tiền lãi có kỳ hạn. Họ muốn được cấp hạn mức thấu chi tức thì dựa trên chính sổ đó. Thấu chi nghĩa là ngân hàng cho phép tài khoản chi vượt số dư, tới một hạn mức đã duyệt. Sổ cái là cuốn sổ ghi mọi khoản tiền vào ra của ngân hàng, và phong tỏa là khoá không cho rút phần tiền đó.'
  - clear: true
    show: "<table class=\"t\">\n  <tr><th>sản phẩm tín dụng</th><th>nghiệp vụ cốt\
      \ lõi</th><th>phân hệ tích hợp</th></tr>\n  <tr><td>Thấu chi cầm cố sổ tiết\
      \ kiệm</td><td>Phong tỏa sổ T24, cấp hạn mức theo tỉ lệ cấp vốn (LTV)</td><td>Dịch\
      \ vụ tín dụng và dịch vụ phong tỏa tài khoản</td></tr>\n  <tr><td>Ký số Cloud CA\
      \ và Cổng CIC</td><td>Ký hợp đồng từ xa, tra nhóm nợ (5 nhóm, TT 31/2024, đã bị\
      \ TT 37/2025 sửa đổi; ví dụ: nhóm 2 trở lên thì không duyệt tự động)</td><td>Ký số đám mây, kết nối\
      \ bảo mật CIC</td></tr>\n</table>\n<p>Hôm nay, ta làm chủ: <b>Thấu chi cầm cố\
      \ sổ tiết kiệm</b> và <b>Giải ngân an toàn</b> (giải ngân = ngân hàng chuyển tiền cho khách vay).</p>\n\
      <div class=\"box warn\">T24 ở đây là <b>kiến trúc tham chiếu</b> rút từ kinh\
      \ nghiệm làm ở OCB (ngân hàng nơi bạn đang làm; Squad Lending chỉ là tên nhóm lấy từ một tin tuyển dụng đã lưu, chưa kiểm); tin tuyển\
      \ dụng của ACB không nói ACB dùng hệ core (hệ thống lõi) nào, khi phỏng vấn\
      \ hãy hỏi lại hệ core thật.</div>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Hôm nay ta học thấu chi cầm cố sổ tiết kiệm trong tín dụng bán lẻ. Ta thiết lập cơ chế phong tỏa sổ cái và giải ngân an toàn, trong đó giải ngân là ngân hàng chuyển tiền cho khách vay. CIC là Trung tâm Thông tin tín dụng Quốc gia thuộc Ngân hàng Nhà nước, nơi ngân hàng tra lịch sử nợ của khách. Theo chính sách ví dụ trong bài, khách đang có nợ quá hạn từ 10 ngày, tức nợ nhóm hai trở lên, thì hồ sơ không được duyệt tự động. Lưu ý, T24 ở đây là kiến trúc tham chiếu từ OCB, ngân hàng nơi bạn đang làm. Squad Lending chỉ là tên một nhóm lấy từ một tin tuyển dụng đã lưu, chưa kiểm. Tin tuyển dụng của ACB không nói ACB dùng hệ thống lõi nào, nên khi phỏng vấn hãy hỏi lại.'
    introduces:
    - acb_cic
    - acb_ltv
- id: prereq
  kind: prereq
  title: 'Ôn lại: Thấu chi, Tỉ lệ LTV, Biên độ Spread và Khoá Phong tỏa'
  checks:
  - 100000000 * 85 // 100 == 85000000
  - 85000000 > 50000000
  steps:
  - show: |-
      <p><b>Bốn khái niệm then chốt trong hệ sinh thái tín dụng số</b>:</p>
      <table class="t">
        <tr><th>khái niệm</th><th>định nghĩa nghiệp vụ</th><th>vai trò kỹ thuật trên Core Banking</th></tr>
        <tr><td>Thấu chi cầm cố</td><td>Vay vốn dựa trên cầm cố hợp đồng tiền gửi điện tử</td><td>Cấp hạn mức chi tiêu âm trên tài khoản thanh toán (CASA: tài khoản dùng chi tiêu hằng ngày)</td></tr>
        <tr><td>Tỉ lệ LTV</td><td>Tỉ lệ cấp vốn trên giá trị sổ tiết kiệm (theo chính sách từng ngân hàng, bài này dùng 85% làm ví dụ)</td><td>Công thức toán học khống chế hạn mức trần</td></tr>
        <tr><td>Biên độ Spread</td><td>Độ chênh lệch giữa lãi suất vay và lãi suất tiền gửi</td><td>Xác định biểu lãi suất tự động cho khoản vay</td></tr>
        <tr><td>Ký số Cloud CA</td><td>Ký số hợp đồng tín dụng trên nền tảng đám mây</td><td>Khoá ký nằm ở tổ chức chứng thực (CA); người ký xác nhận bằng sinh trắc học hoặc OTP theo chính sách ngân hàng (văn bản về chữ ký số đám mây chưa đọc nguyên văn nên bài không nêu số hiệu)</td></tr>
      </table>
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Trước hết là bốn khái niệm then chốt. Thấu chi cầm cố cho phép khách hàng chi tiêu vượt số dư bằng cách cầm cố sổ tiết kiệm. Hạn mức này mở trên tài khoản thanh toán của khách, tức tài khoản dùng chi tiêu hằng ngày. Tỉ lệ cấp vốn khống chế hạn mức tối đa, còn biên độ chênh lệch quy định lãi suất khoản vay. Ký số đám mây là ký hợp đồng từ xa, khoá ký nằm ở tổ chức chứng thực chữ ký số.'
  - clear: true
    show: |-
      <div class="box key">Nguyên tắc phong tỏa hai pha trên Core T24: Khi cấp thấu chi cầm cố, số dư sổ tiết kiệm phải được khoá phong tỏa trước. Khách hàng tuyệt đối không được rút tiền gửi khi chưa tất toán (trả hết nợ rồi đóng khoản vay) xong khoản thấu chi để bảo đảm an toàn thu hồi vốn!</div>
    focus:
    - 0
    - 0
    say: 'Do sổ tiết kiệm đóng vai trò là tài sản bảo đảm, ngân hàng bắt buộc phải khoá phong tỏa số dư trên hệ thống lõi trước khi cấp hạn mức. Người vay không thể rút tiền gửi khi chưa trả hết dư nợ thấu chi, tức số tiền còn nợ ngân hàng.'
