- id: symbol
  kind: symbol
  title: Quy ước Ký hiệu và Công thức Thấu chi Cầm cố
  steps:
  - show: '<p><b>Công thức tính toán hạn mức và lãi suất thấu chi</b>:</p>

      <div class="box key">

      $$\text{Hạn mức cấp: } H = V \times 85\%$$

      $$\text{Lãi suất thấu chi: } r = 6\% + 2{,}5\% = 8{,}5\%\text{ mỗi năm}$$

      $$\text{Tiền lãi: } L = S \times r \times \frac{d}{365}$$

      </div>

      <p>Trong đó $V$ là giá trị sổ tiết kiệm, $r$ là lãi suất thấu chi gồm lãi tiền
      gửi cộng biên độ chênh lệch (số liệu ví dụ minh họa), $S$ là số tiền rút thấu
      chi thực tế, $d$ là số ngày thực tế sử dụng (Thông tư 14/2017/TT-NHNN).</p>'
    focus:
    - 0
    - 0
    - 0
    say: Theo quy chuẩn nghiệp vụ, ta thiết lập công thức tính toán tài chính. Hạn
      mức thấu chi bằng giá trị sổ tiết kiệm nhân với tỉ lệ cấp vốn. Lãi suất vay
      bằng lãi tiền gửi cộng biên độ chênh lệch, và người vay chỉ trả lãi trên số
      tiền thực tế sử dụng theo số ngày thực tế.
  - clear: true
    show: '<p><b>Cơ chế phong tỏa sổ tiết kiệm trước khi cấp hạn mức trên Core T24</b>:</p>

      <pre><code>// 1. Phong tỏa số dư sổ tiết kiệm trên phân hệ tiền gửi

      err := t24.LockDepositAccount(ctx, depositAccNo, holdAmount)

      if err != nil { return ErrDepositLockFailed }


      // 2. Cấp hạn mức thấu chi vào tài khoản thanh toán CASA

      err = t24.GrantOverdraftLimit(ctx, casaAccNo, limitAmount)

      if err != nil { t24.UnlockDepositAccount(ctx, depositAccNo); return err }</code></pre>'
    focus:
    - 0
    - 0
    - 0
    say: Để bảo đảm an toàn sổ cái, ta áp dụng quy trình hai pha nghiêm ngặt. Bước
      một hệ thống khóa phong tỏa số dư trên sổ tiết kiệm. Nếu thành công thì bước
      hai mới cấp hạn mức chi tiêu, còn nếu thất bại thì lập tức giải phóng tài nguyên.
- id: example
  kind: example
  title: 'Thực hành: Cầm cố Sổ tiết kiệm 100 Triệu thấu chi 85 Triệu'
  checks:
  - 100000000 * 85 // 100 == 85000000
  - 60 + 25 == 85
  - 50000000 * 85 * 30 // 365000 == 349315
  - 349315 > 300000
  - 85000000 > 50000000
  steps:
  - show: '<p><b>Dữ liệu bài toán thấu chi cầm cố sổ tiết kiệm</b>:</p>

      <ul>

      <li>Sổ tiết kiệm điện tử có giá trị: $V = 100\,000\,000$ đồng, lãi suất tiền
      gửi (giả định) $6\%$ mỗi năm.</li>

      <li>Tỉ lệ cấp vốn (giả định): $85\%$, biên độ chênh lệch (giả định): $2{,}5\%$
      mỗi năm.</li>

      <li>Khách hàng rút số tiền thấu chi thực tế: $S = 50\,000\,000$ đồng trong thời
      gian $30$ ngày.</li>

      </ul>'
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét khách hàng có sổ tiết kiệm một trăm triệu đồng với lãi suất sáu
      phần trăm một năm. Tỉ lệ cấp vốn giả định là tám mươi lăm phần trăm và biên
