scenes:
- id: hook
  kind: hook
  title: Thách thức tích hợp tín dụng thấu chi và cầm cố sổ tiết kiệm
  steps:
  - show: '<p>Khách hàng cần vốn gấp nhưng không muốn rút sổ tiết kiệm để tránh mất
      tiền lãi có kỳ hạn.</p>

      <div class="box key">Làm sao một ngân hàng có thể cấp thấu chi 85 triệu đồng
      bằng cách cầm cố sổ tiết kiệm 100 triệu, ký số hợp đồng online và cấp hạn mức
      nhanh mà không lo thất thoát vốn? (Thấu chi: cho tài khoản chi vượt số dư tới
      một hạn mức đã duyệt.)</div>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Chào bạn, người gửi tiền cần vốn gấp nhưng không muốn rút sổ tiết kiệm để
      tránh mất phần lớn tiền lãi có kỳ hạn. Họ mong muốn được cấp hạn mức thấu chi
      tức thì dựa trên chính sổ tiết kiệm đó. Thấu chi nghĩa là ngân hàng cho phép
      tài khoản chi vượt số dư, tới một hạn mức đã duyệt. Ngân hàng cần giải pháp tích hợp tự
      động từ cầm cố, phong tỏa sổ cái đến cấp hạn mức nhanh chóng.
  - clear: true
    show: "<table class=\"t\">\n  <tr><th>sản phẩm tín dụng</th><th>nghiệp vụ cốt\
      \ lõi</th><th>phân hệ tích hợp</th></tr>\n  <tr><td>Thấu chi cầm cố sổ tiết\
      \ kiệm</td><td>Phong tỏa sổ T24, cấp hạn mức theo tỉ lệ LTV</td><td>Dịch vụ\
      \ tín dụng và dịch vụ phong tỏa tài khoản</td></tr>\n  <tr><td>Thấu chi lương tín chấp</td><td>Đánh\
      \ giá dòng tiền lương, cấp hạn mức theo bội số lương</td><td>Hệ thống chi lương lô và danh\
      \ sách ưu tiên</td></tr>\n  <tr><td>Ký số Cloud CA và Cổng CIC</td><td>Ký hợp\
      \ đồng từ xa, tra cứu nhóm nợ (5 nhóm theo Thông tư 31/2024/TT-NHNN)</td><td>Cổng\
      \ ký số đám mây và kết nối bảo mật CIC</td></tr>\n</table>\n<p>Hôm nay, ta làm\
      \ chủ: <b>Thấu chi cầm cố sổ tiết kiệm</b>, <b>Thấu chi lương tín chấp</b>,\
      \ và <b>Giải ngân an toàn</b>.</p>\n<div class=\"box warn\">T24 ở đây là <b>kiến\
      \ trúc tham chiếu</b> rút từ kinh nghiệm làm ở OCB (Squad Lending là nhóm phát\
      \ triển tín dụng ở đó); tin tuyển dụng của ACB không nói ACB dùng hệ core (hệ\
      \ thống lõi) nào, khi phỏng vấn hãy hỏi lại hệ core thật.</div>"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Hôm nay, ta cùng nhau khám phá trọn vẹn hệ sinh thái tín dụng bán lẻ tốc
      độ cao. Ta làm chủ nghiệp vụ thấu chi cầm cố sổ tiết kiệm và thấu chi lương
      theo lô. Ta thiết lập cơ chế phong tỏa sổ cái và giải ngân an toàn. CIC là
      Trung tâm Thông tin tín dụng Quốc gia thuộc Ngân hàng Nhà nước, nơi ngân hàng
      tra lịch sử nợ của khách. Lưu ý, T24 ở đây là kiến trúc tham chiếu rút từ kinh
      nghiệm làm ở OCB, và Squad Lending là tên nhóm phát triển tín dụng ở đó. Tin
      tuyển dụng của ACB không nói ACB dùng hệ thống lõi nào, nên khi phỏng vấn hãy
      hỏi lại hệ thống lõi thật.
- id: prereq
  kind: prereq
  title: 'Ôn lại: Thấu chi, Tỉ lệ LTV, Biên độ Spread và Khóa Phong tỏa'
  checks:
  - 100000000 * 85 // 100 == 85000000
  - 85000000 > 50000000
  steps:
  - show: "<p><b>Bốn khái niệm then chốt trong hệ sinh thái tín dụng số</b>:</p>\n\
      <table class=\"t\">\n  <tr><th>khái niệm</th><th>định nghĩa nghiệp vụ</th><th>vai\
      \ trò kỹ thuật trên Core Banking</th></tr>\n  <tr><td>Thấu chi cầm cố</td><td>Vay\
      \ vốn dựa trên cầm cố hợp đồng tiền gửi điện tử</td><td>Cấp hạn mức chi tiêu\
      \ âm trên tài khoản thanh toán (CASA)</td></tr>\n  <tr><td>Tỉ lệ LTV</td><td>Tỉ lệ cấp vốn\
      \ trên giá trị sổ tiết kiệm (theo chính sách từng ngân hàng, bài này dùng 85%\
      \ làm ví dụ)</td><td>Công thức toán học khống chế hạn mức trần</td></tr>\n \
      \ <tr><td>Biên độ Spread</td><td>Độ chênh lệch giữa lãi suất vay và lãi suất\
      \ tiền gửi</td><td>Xác định biểu lãi suất tự động cho khoản vay</td></tr>\n\
      \  <tr><td>Ký số Cloud CA</td><td>Ký số hợp đồng tín dụng trên nền tảng đám\
      \ mây</td><td>Khoá ký nằm ở tổ chức chứng thực (CA); người ký xác nhận bằng\
      \ sinh trắc học hoặc OTP (Nghị định 23/2025/NĐ-CP)</td></tr>\n</table>"
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta cần hiểu bốn khái niệm then chốt trong hệ thống tín dụng ngân
      hàng. Thấu chi cầm cố cho phép khách hàng chi tiêu vượt số dư bằng cách cầm
      cố sổ tiết kiệm. Tỉ lệ cấp vốn khống chế hạn mức tối đa, còn biên độ chênh
      lệch quy định lãi suất khoản vay. Ký số đám mây là ký hợp đồng từ xa, khoá ký
      nằm ở tổ chức chứng thực chữ ký số, người ký xác nhận bằng sinh trắc học hoặc
      mật mã dùng một lần.
  - clear: true
    show: '<div class="box key">Nguyên tắc phong tỏa hai pha trên Core T24: Khi cấp
      thấu chi cầm cố, số dư sổ tiết kiệm phải được khóa phong tỏa trước. Khách hàng
      tuyệt đối không được rút tiền gửi khi chưa tất toán xong khoản thấu chi để bảo
      đảm an toàn thu hồi vốn!</div>'
    focus:
    - 0
    - 0
    - 0
    say: Do sổ tiết kiệm đóng vai trò là tài sản bảo đảm, ngân hàng bắt buộc phải
      khóa phong tỏa số dư trên hệ thống lõi trước khi cấp hạn mức. Người vay không
      thể rút tiền gửi khi chưa trả hết dư nợ thấu chi. Nguyên tắc này giúp ngân hàng
      bảo vệ khả năng thu hồi vốn.
