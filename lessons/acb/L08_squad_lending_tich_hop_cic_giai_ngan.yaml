    say: Còn nếu một bước hỏng sau khi đã khoá sổ thì sao. Khi ký số lỗi, khách bỏ dở hoặc quá hạn chờ ký, hệ thống cũng phải nhả khoá sổ, giống khi cấp hạn mức lỗi. Nếu không, sổ vẫn bị phong tỏa mà khách không có hạn mức, và lệnh nhả khoá lỗi phải được ghi lại để đối soát, tức so sổ hai bên cho khớp từng giao dịch.
