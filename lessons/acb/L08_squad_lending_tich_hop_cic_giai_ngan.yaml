- id: example
  kind: example
  title: 'Thực hành: Cầm cố Sổ tiết kiệm 100 Triệu thấu chi 85 Triệu'
  checks:
  - 100000000 * 85 // 100 == 85000000
  - 60 + 25 == 85
  - 50000000 * 85 * 30 // 365000 == 349315
  - 349315 > 300000
  - 85000000 > 50000000
  steps:
  - show: '<p><b>Dữ liệu bài toán thấu chi cầm cố sổ tiết kiệm</b>:</p>

      <ul>

      <li>Sổ tiết kiệm điện tử có giá trị: $V = 100\,000\,000$ đồng, lãi suất tiền
      gửi (giả định) $6\%$ mỗi năm.</li>

      <li>Tỉ lệ cấp vốn (giả định): $85\%$, biên độ chênh lệch (giả định): $2{,}5\%$
      mỗi năm.</li>

      <li>Khách hàng rút số tiền thấu chi thực tế: $S = 50\,000\,000$ đồng trong thời
      gian $30$ ngày.</li>

      </ul>'
    focus:
    - 0
    - 0
    - 0
    say: Ta xem xét khách hàng có sổ tiết kiệm một trăm triệu đồng với lãi suất sáu
      phần trăm một năm. Tỉ lệ cấp vốn giả định là tám mươi lăm phần trăm và biên
      độ lãi vay giả định là hai phẩy năm phần trăm, chỉ là ví dụ minh họa. Khách
      hàng rút năm mươi triệu đồng để chi tiêu trong ba mươi ngày.
  - clear: true
    show: '<p><b>Bước 1: Tính hạn mức thấu chi và lãi suất vay</b>:</p>

      $$\text{Hạn mức tối đa: } H = 100\,000\,000 \times 85\% = 85\,000\,000\text{
      đồng}$$

      $$\text{Lãi suất vay thấu chi: } r = 6\% + 2{,}5\% = 8{,}5\%\text{ mỗi năm}$$'
    focus:
    - 0
    - 0
    say: Theo công thức, bước một ta tính được hạn mức thấu chi tối đa là tám mươi
      lăm triệu đồng. Lãi suất vay thấu chi bằng sáu phần trăm cộng hai phẩy năm phần
      trăm được tám phẩy năm phần trăm một năm.
  - clear: true
    show: '<p><b>Bước 2: Tính tiền lãi thực tế phải trả cho 30 ngày</b>:</p>

      $$\text{Tiền lãi vay 30 ngày: } L = 50\,000\,000 \times 8{,}5\% \times \frac{30}{365}
      \approx 349\,315\text{ đồng}$$

      <div class="box key">Hiệu quả tài chính: Khách hàng tốn khoảng 349 nghìn đồng
      tiền lãi vay mà không phải tất toán sổ tiết kiệm 100 triệu đồng trước hạn.</div>'
    focus:
    - 0
    - 0
    say: Bước hai, vì khách hàng chỉ rút năm mươi triệu trong ba mươi ngày nên tiền
      lãi vay chỉ khoảng ba trăm bốn mươi chín nghìn đồng. Do đó người vay giải quyết
      được việc gấp mà không làm mất khoản tiền lãi tiết kiệm lớn hơn rất nhiều.
  - clear: true
    show: '<p><b>Bước 3: Điều phối luồng tích hợp hệ thống</b>:</p>

      <table class="t">

      <tr><th>trình tự</th><th>phân hệ xử lý</th><th>thao tác kỹ thuật</th></tr>

      <tr><td>1. Tra CIC</td><td>Cổng CIC, kênh mTLS</td><td>Lấy nhóm nợ; từ nhóm 2 trở lên thì không duyệt
      tự động (chính sách ví dụ)</td></tr>

      <tr><td>2. Khoá sổ</td><td>Core T24 AZ</td><td>Phong tỏa 100 triệu trên sổ tiết
      kiệm</td></tr>

      <tr><td>3. Ký số</td><td>Cloud CA</td><td>Xác thực người ký và ký hợp đồng số</td></tr>

      <tr><td>4. Mở hạn mức</td><td>Core T24 CASA</td><td>Cấp hạn mức thấu chi 85
      triệu sau khi hợp đồng có hiệu lực</td></tr>

      <tr><td>5. Sử dụng hạn mức</td><td>CASA / NAPAS 247</td><td>Khách tự rút hoặc
      chuyển 50 triệu (liên ngân hàng thì qua NAPAS)</td></tr>

      </table>

      <p>mTLS: hai bên đều trình chứng chỉ số, nên chỉ máy được phép mới gọi được Cổng CIC.</p>'
    focus:
    - 0
    - 0
    - 0
    - 0
    say: Bước ba, điều phối các phân hệ. Trước hết hồ sơ tra Cổng CIC qua kênh mTLS, nơi hai bên đều trình chứng chỉ, để lấy nhóm nợ. Rồi sổ tiết kiệm được phong tỏa, khách ký số hợp đồng qua dịch vụ ký số đám mây. Khi hợp đồng có hiệu lực, hạn mức mới được cấp để khách sử dụng.
  - clear: true
