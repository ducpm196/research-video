- id: example
  kind: example
  title: Tính toán lưu lượng giao dịch và kiểm soát rủi ro
  checks:
  - 10000 * 60 == 600000 and 600000 * 60 == 36000000
  - 120 + 35 == 155 and 1500 - 155 == 1345
  - 60 * 1000 == 60000
  steps:
  - show: "<p><b>Bước 1 — Tính lưu lượng mỗi phút và mỗi giờ</b> (lưu lượng giả định):</p>\n<table class=\"\
      t\">\n  <tr><th>đơn vị</th><th>phép tính</th><th>kết quả</th></tr>\n  <tr><td>Mỗi\
      \ phút</td><td>$10\\,000 \\times 60$</td><td>$600\\,000$ giao dịch</td></tr>\n\
      \  <tr><td>Mỗi giờ</td><td>$600\\,000 \\times 60$</td><td>$36\\,000\\,000$ giao\
      \ dịch</td></tr>\n</table>\n"
    focus:
    - 0
    - 0
    - 0
    say: Bước một, ta tính toán lưu lượng tải giả định. Ở mức 10 nghìn lệnh mỗi giây,
      mỗi phút hệ thống xử lý 600 nghìn giao dịch. Trong một giờ cao điểm, tổng số
      giao dịch đạt tới 36 triệu giao dịch.
  - clear: true
    show: "<p><b>Bước 2 — Ước lượng thời gian phản hồi toàn trình</b> (ví dụ minh họa):</p>\n<table\
      \ class=\"t\">\n  <tr><th>thành phần</th><th>thời gian</th><th>ghi chú</th></tr>\n\
      \  <tr><td>Mạng NAPAS</td><td>$120$ ms</td><td>vòng khứ hồi qua mạng liên ngân\
      \ hàng</td></tr>\n  <tr><td>Hạch toán Core</td><td>$35$ ms</td><td>ghi nhận\
      \ giao dịch trên Core T24</td></tr>\n  <tr><td>Toàn trình</td><td>$120 + 35\
      \ = 155$ ms</td><td>thấp hơn nhiều ngưỡng chờ giả định 1500 ms</td></tr>\n</table>\n"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bước hai, ta ước lượng độ trễ toàn trình với số liệu giả định. Thời gian
      mạng NAPAS tốn 120 mi li giây. Hạch toán Core T24 tốn 35 mi li giây. Tổng thời
      gian là 155 mi li giây. Con số này thấp hơn nhiều so với ngưỡng chờ giả định
      1500 mi li giây.
  - clear: true
    show: '<p><b>Bước 3 — Cấu hình khoá khử trùng lặp trong Redis</b>:</p>

      <div class="box key">Thời gian hết hạn khoá: $60 \text{ giây} = 60 \times 1000
      = 60\,000 \text{ ms}$. Chặn các bản tin gửi lại do lỗi mạng trong khoảng thời
      gian này.</div>

      '
    focus:
    - 0
    - 0
    - 0
    say: Bước ba, ta thiết lập khoá khử trùng lặp trong Redis. Khoá được giữ trong
      60 giây, tức 60 nghìn mi li giây. Nhờ đó, các bản tin gửi lặp do mạng chập chờn
      trong khoảng thời gian này đều bị chặn.
