- id: quymo
  kind: example
  title: 'Quy mô: cùng một hệ thống ở ×1, ×100 và ×10 000 (số minh hoạ)'
  checks:
  - 100 * 3600 == 360000 and 10000 * 3600 == 36000000 and 1000000 * 3600 == 3600000000
  - 100 * 0.155 == 15.5 and 10000 * 155 // 1000 == 1550 and 1000000 * 155 // 1000
    == 155000
  - 100 * 60 == 6000 and 10000 * 60 == 600000 and 1000000 * 60 == 60000000
  steps:
  - show: <p>Lấy tải ×1 là 100 giao dịch mỗi giây, độ trễ toàn trình $155$ ms $= 0{,}155$
      giây (số minh hoạ):</p><table class="t"><tr><th>cỡ</th><th>giao dịch mỗi giây</th><th>mỗi
      giờ</th><th>đang chạy cùng lúc (tải × 0,155 giây)</th><th>khoá cùng tồn tại
      (tải × 60 giây)</th><th>chọn gì</th></tr><tr><td>×1</td><td>100</td><td>360&nbsp;000</td><td>15,5</td><td>6&nbsp;000</td><td>một
      máy chủ, gọi đồng bộ (chờ trả lời xong mới làm tiếp) vẫn chịu được</td></tr><tr><td>×100</td><td>10&nbsp;000</td><td>36&nbsp;000&nbsp;000</td><td>1&nbsp;550</td><td>600&nbsp;000</td><td>hàng
      đợi, nhiều máy chủ, Redis dùng chung</td></tr><tr><td>×10&nbsp;000</td><td>1&nbsp;000&nbsp;000</td><td>3&nbsp;600&nbsp;000&nbsp;000</td><td>155&nbsp;000</td><td>60&nbsp;000&nbsp;000</td><td>chia
      dữ liệu theo tài khoản, nhiều nút Redis, SAGA cho giao dịch chéo (nghẽn ở
      thông lượng ghi — 1 triệu lần mỗi giây, số minh hoạ, cần đo)</td></tr></table><p
      class="note">×10 000 là số minh hoạ để thấy cách nghĩ đổi theo cỡ, không phải
      số của ngân hàng nào.</p>
    say: 'Ta giữ nguyên độ trễ 155 mi li giây và chỉ tăng tải, với số minh hoạ. Ở cỡ một, 100 giao dịch mỗi giây, chỉ khoảng 15 việc chạy cùng lúc, nên một máy chủ gọi đồng bộ, tức chờ trả lời xong mới làm tiếp, vẫn chịu được. Ở cỡ một trăm, 10 nghìn giao dịch mỗi giây, có 1550 việc chạy cùng lúc và 600 nghìn khoá cùng tồn tại, nên cần hàng đợi và nhiều máy chủ. Ở cỡ mười nghìn, một triệu giao dịch mỗi giây, 60 triệu khoá nhỏ vẫn có thể vừa bộ nhớ. Nhưng nút nghẽn thật là thông lượng ghi. Một triệu lần ghi khoá mỗi giây có thể vượt sức một nút Redis, tức một máy chạy Redis, nên phải chia dữ liệu theo tài khoản. Số này là minh hoạ, cần đo thật.'
