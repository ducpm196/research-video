  steps:
  - show: '<p><b>Tình huống</b>: Khách hàng có 1 triệu đồng, thanh toán hoá đơn điện
      lực 500 nghìn đồng.</p>

      <p>Core Banking đã trích nợ 500 nghìn, số dư còn 500 nghìn. Nhưng cổng điện
      lực phản hồi hết giờ.</p>

      '
    focus:
    - 0
    - 0
    say: Ta kiểm tra tình huống kinh điển. Tài khoản có một triệu đồng, ngân hàng trừ 500 nghìn
      trả tiền điện, số dư còn 500 nghìn nhưng đối tác báo hết giờ.
  - show: '<div class="box key"><b>Quy tắc bồi hoàn SAGA</b>: Vì đối tác chưa phản
      hồi rõ ràng, hệ thống chuyển sang trạng thái nghi vấn, gọi truy vấn sau 3 giây.
      Do đối tác xác nhận chưa nhận tiền, ta kích hoạt bồi hoàn cộng lại 500 nghìn:
      $500\,000 + 500\,000 = 1\,000\,000$ đồng.</div>

      '
    focus:
    - 0
    - 0
    say: 'Vì đối tác chưa rõ kết quả, hệ thống chuyển sang trạng thái nghi vấn, tức chưa biết bên kia đã nhận tiền hay chưa, và tra cứu sau 3 giây. Do đối tác xác nhận chưa nhận tiền, ta kích hoạt bồi hoàn, tức cộng trả số tiền đã trừ, để hoàn lại đủ một triệu đồng.'
- id: pitfall
  kind: pitfall
  title: Ba sai lầm nghiêm trọng khiến ứng viên bị đánh trượt vòng kỹ thuật
  steps:
  - show: "<table class=\"t\">\n  <tr><th>sai lầm sơ cấp</th><th>hậu quả kỹ thuật</th><th>giải\
      \ pháp chuẩn Senior</th></tr>\n  <tr><td>Tự gọi hàm nội bộ trong Spring (lớp = khuôn mã Java gom dữ liệu và hàm)</td><td>mất\
      \ giao dịch quản lý @Transactional (chú thích Spring bật giao dịch; giao dịch = nhóm lệnh cùng thành công hoặc cùng bị huỷ)</td><td>tách ra dịch vụ riêng để lời gọi\
      \ đi qua lớp bọc của Spring (lớp trung gian mở giao dịch trước khi chạy hàm)</td></tr>\n  <tr><td>Khoá tài khoản ngẫu nhiên</td><td>gây\
      \ lỗi bế tắc khoá trong Oracle</td><td>khoá từng tài khoản theo thứ tự tăng\
      \ dần</td></tr>\n  <tr><td>Thiếu chỉ mục khoá ngoại</td><td>xoá dòng cha hoặc\
      \ sửa khoá chính (cột định danh duy nhất một dòng) của cha thì bảng con (bảng chứa khoá ngoại) bị khoá cả bảng trong lúc câu lệnh chạy</td><td>đánh\
      \ chỉ mục trên cột khoá ngoại của bảng con</td></tr>\n</table>\n"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Có ba sai lầm hay bị dùng để thử ứng viên. Thứ nhất, trong Spring, lớp là khuôn mã Java gom dữ liệu và hàm, còn giao dịch là nhóm lệnh cùng thành công hoặc cùng bị huỷ. Spring bọc dịch vụ trong một lớp trung gian gọi là lớp bọc, lớp này mở giao dịch trước khi chạy hàm. Gọi hàm trong cùng lớp thì đi thẳng, không qua lớp bọc, nên chú thích mở giao dịch bị bỏ qua. Thứ hai là cập nhật tài khoản theo thứ tự ngẫu nhiên, dẫn tới bế tắc khoá, tức hai bên mỗi bên giữ khoá của bên kia rồi chờ nhau mãi. Cách giảm là khoá từng tài khoản theo cùng một thứ tự, nhỏ trước, lớn sau. Thứ ba là quên đánh chỉ mục trên khoá ngoại, tức cột trỏ tới khoá chính của bảng khác, mà khoá chính là cột định danh duy nhất một dòng. Chỉ mục là bảng tra giúp tìm dòng nhanh mà không đọc cả bảng. Thiếu nó thì khi xoá dòng cha, tức dòng được trỏ tới, hoặc sửa khoá chính của cha, Oracle phải khoá cả bảng con, tức bảng chứa khoá ngoại, trong lúc câu lệnh chạy.'
