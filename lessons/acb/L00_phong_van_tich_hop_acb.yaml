objectives:
- Mô tả sơ đồ bốn tầng tích hợp từ ứng dụng tới Core Banking Temenos T24 qua NAPAS
  247 và IBM MQ (kiến trúc tham chiếu rút từ kinh nghiệm làm ở OCB, không khẳng định
  là thiết kế của ACB)
- Tính lưu lượng mỗi phút và mỗi giờ, độ trễ toàn trình và thời gian sống khoá khử
  trùng lặp bằng số
- 'Chọn cách xử lý khi đối tác hết giờ: chuyển nghi vấn, tra soát rồi mới bồi hoàn
  SAGA, không hoàn tiền vội'
- 'Nhận ra ba sai lầm kỹ thuật hay bị hỏi: gọi hàm nội bộ trong Spring, khoá không
  theo thứ tự, thiếu chỉ mục khoá ngoại'
- Phân biệt hai nhóm vai trò trong tin tuyển dụng backend ngân hàng và cách nhấn mạnh
  hồ sơ cho từng nhóm
- Trình bày đề xuất mức lương dựa trên dữ kiện đã kiểm, tách khỏi ước tính thị trường
  chưa kiểm chứng
- 'So sánh cùng một hệ thống ở ×1, ×100 và ×10 000: số giao dịch, số việc chạy cùng
  lúc, số khoá, rồi chọn kiến trúc'
- 'Tính lại bằng mã Python mô phỏng với số mới: tải, độ trễ toàn trình, thời gian
  sống khoá và số dư sau bồi hoàn'
