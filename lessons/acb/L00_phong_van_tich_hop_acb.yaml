scenes:
- id: hook
  kind: hook
  title: Khoảng cách giữa lập trình viên bình thường và Kỹ sư Tích hợp Ngân hàng
  steps:
  - show: '<p>Nhiều bạn nghĩ làm máy chủ (backend) tích hợp chỉ là viết vài API REST
      để lưu dữ liệu. Nhưng khi bước vào ngân hàng lớn như ACB, một lệnh bị nghẽn
      mạng có thể gây thất thoát hàng tỉ đồng.</p>

      <div class="box key">Hôm nay: <b>Toàn cảnh kiến trúc tích hợp ngân hàng</b>
      — từ Temenos T24, NAPAS 247, SAGA đến cách chuẩn bị phỏng vấn và bàn về <b>lương
      gross</b> (lương trước khi trừ thuế và bảo hiểm) có căn cứ.</div>

      <div class="box warn">T24 ở đây là <b>kiến trúc tham chiếu</b> rút từ kinh nghiệm
      làm ở OCB (ngân hàng nơi bạn đang làm); tin tuyển dụng của ACB không nói ACB dùng hệ core (hệ thống lõi)
      nào, khi phỏng vấn hãy hỏi lại hệ core thật.</div>

      <p class="note">API (giao diện lập trình) = cổng để phần mềm này nhờ phần
      mềm khác làm việc; REST = kiểu gọi qua địa chỉ trang mạng. NAPAS = tổ chức vận hành
      mạng chuyển tiền giữa các ngân hàng ở Việt Nam; NAPAS 247 = dịch vụ chuyển nhanh chạy 24 giờ mỗi ngày, 7 ngày mỗi tuần. Hệ thống lõi (core) = phần
      mềm giữ sổ cái và số dư của ngân hàng; T24 là phần mềm lõi của hãng Temenos.</p>

      '
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: 'Chào bạn, nhiều bạn nghĩ làm lập trình viên tích hợp chỉ là viết vài giao diện lập trình để lưu dữ liệu. Giao diện lập trình là cổng để phần mềm này nhờ phần mềm khác làm việc. Nhưng trong ngân hàng, một lệnh nghẽn mạng có thể làm thất thoát hàng tỉ đồng hoặc trừ tiền hai lần. SAGA là cách chia một giao dịch dài thành các bước nhỏ, bước nào hỏng thì chạy bước hoàn tác. Lương gross là lương trước khi trừ thuế và bảo hiểm. Hệ thống lõi là phần mềm giữ sổ cái, tức sổ ghi mọi khoản tiền vào ra của từng tài khoản, và số dư của ngân hàng, T24 là phần mềm lõi của hãng Temenos. NAPAS là tổ chức vận hành mạng chuyển tiền giữa các ngân hàng ở Việt Nam, và dịch vụ hai bốn bảy của NAPAS chạy hai mươi bốn giờ mỗi ngày, bảy ngày mỗi tuần. Lưu ý, T24 ở đây là kiến trúc tham chiếu rút từ kinh nghiệm làm ở OCB, ngân hàng nơi bạn đang làm. Tin tuyển dụng của ACB không nói ACB dùng hệ thống lõi nào, nên khi phỏng vấn hãy hỏi lại.'
    introduces:
    - acb_saga
    - acb_napas
    - acb_core
- id: prereq
  kind: prereq
  title: 'Kiến thức nền: Đơn vị thời gian và ba chỉ số hiệu năng'
  checks:
  - 1000 * 1000 == 1000000 and 1000 // 10 == 100
  - 10000 // 100 == 100 and 60 * 1000 == 60000
  - 200 / 1000 == 0.2
  steps:
  - show: "<table class=\"t\">\n  <tr><th>thông số</th><th>mục tiêu thiết kế (ví dụ\
      \ minh họa)</th><th>ý nghĩa</th></tr>\n  <tr><td>Độ trễ P99</td><td>dưới 200\
      \ ms</td><td>99% giao dịch phản hồi dưới 0,2 giây</td></tr>\n  <tr><td>Thông\
      \ lượng</td><td>10 000 TPS (giao dịch mỗi giây)</td><td>hệ thống gánh 10 nghìn\
      \ lệnh mỗi giây</td></tr>\n  <tr><td>Thời gian sống khoá (TTL)</td><td>60 giây</td><td>khoá\
      \ chống trùng lặp giữ trong một phút</td></tr>\n</table>\n<p class=\"note\">Bản tin = gói dữ liệu gửi từ hệ thống này sang hệ thống khác, ví dụ một lệnh chuyển tiền. Thời gian sống (TTL) = khoảng thời gian khoá còn hiệu lực, hết giờ thì tự xoá.</p>\n"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Trước hết, ta hiểu ba chỉ số hiệu năng. Một
      giây bằng một nghìn mi li giây. Độ trễ 99 phần trăm
      dưới 200 mi li giây nghĩa là cứ 100 giao dịch thì 99 giao dịch phản
      hồi dưới 200 mi li giây. Thông lượng mục tiêu giờ cao điểm là 10 nghìn
      giao dịch mỗi giây. Bản tin là gói dữ liệu gửi từ hệ thống này sang hệ thống khác, ví dụ một lệnh chuyển tiền. Khoá khử trùng lặp, tức dấu ghi nhớ mã giao dịch đã xử
      lý để bản tin gửi lại bị nhận ra, được giữ 60 giây, tức 60 nghìn mi li
      giây. Thời gian khoá còn hiệu lực, hết giờ thì tự xoá, gọi là thời gian sống, viết tắt là tê tê e lờ.
    introduces:
    - acb_dedup
    - acb_p99
    - acb_ttl
- id: symbol
  kind: symbol
  title: Giải mã các thuật ngữ và ký hiệu cốt lõi trong ngành ngân hàng
  steps:
  - show: "<table class=\"t\">\n  <tr><th>thuật ngữ</th><th>tên đầy đủ</th><th>vai\
      \ trò kỹ thuật</th></tr>\n  <tr><td>T24 OFS</td><td>Open Financial Service</td><td>chuỗi\
      \ văn bản giao tiếp với Core Banking Temenos T24</td></tr>\n  <tr><td>IBM MQ</td><td>phần\
      \ mềm hàng đợi tin nhắn</td><td>giữ bản tin tới khi bên nhận lấy ra</td></tr>\n\
      \  <tr><td>ISO 8583</td><td>Financial transaction card originated messages</td><td>chuẩn\
      \ bản tin tài chính, thường gửi qua kết nối TCP (đường truyền hai chiều giữa hai chương trình, dữ liệu đến đủ và đúng thứ tự)</td></tr>\n  <tr><td>SAGA</td><td>Saga\
      \ Pattern</td><td>chuỗi giao dịch cục bộ kèm bước bù trừ khi có bước hỏng</td></tr>\n\
      \  <tr><td>STAN / RRN</td><td>System Trace Audit Number / Retrieval Reference\
      \ Number</td><td>số vết và số tham chiếu để đối soát (hai bên so sổ giao dịch, xem từng khoản có khớp không)</td></tr>\n  <tr><td>Redis</td><td>kho\
      \ khoá–giá trị trong bộ nhớ</td><td>ghi nhớ mã giao dịch đã xử lý</td></tr>\n\
      </table>\n"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Ta giải mã sáu thuật ngữ nền tảng. Bản tin
      OFS là định dạng giao tiếp chuẩn của Core Banking Temenos T24 qua hàng đợi IBM
      MQ. IBM MQ là phần mềm hàng đợi tin nhắn, giữ bản tin cho tới khi bên
      nhận lấy ra. Chuẩn ISO 8583 là giao thức bản tin tài chính qua cổng chuyển
      mạch NAPAS. Bản tin này thường gửi qua kết nối TCP, tức đường truyền hai chiều giữa hai chương trình, dữ liệu đến đủ và đúng thứ tự. Mô hình SAGA là chuỗi giao dịch cục bộ, bước nào hỏng
      thì chạy bước bù trừ để hoàn tác các bước trước. Số kiểm toán STAN cùng số tham
      chiếu RRN là hai mã số dùng để đối soát liên ngân hàng, tức hai bên so sổ giao dịch để xem từng khoản có khớp không. Redis là kho dữ liệu
      nằm trong bộ nhớ, đọc ghi rất nhanh, thường dùng để ghi nhớ mã giao dịch đã
      xử lý.
    introduces:
    - acb_redis
    - acb_tcp
    - acb_stan
    - acb_ofs
    - acb_mq
