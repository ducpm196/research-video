    show: '<p><b>Đáp án câu 2</b>: Nêu đúng vai trò: 3 năm tại OCB là Chuyên viên
      chính trong nhóm tín dụng (tên nhóm “Squad Lending” chỉ lấy từ một tin tuyển dụng đã lưu, chưa kiểm, đừng nói như chức danh thật), trực tiếp làm các luồng tích hợp tín dụng, phối hợp
