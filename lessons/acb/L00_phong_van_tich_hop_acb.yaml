- id: example
  kind: example
  title: Tính toán lưu lượng giao dịch và kiểm soát rủi ro
  checks:
  - 10000 * 60 == 600000 and 600000 * 60 == 36000000
  - 120 + 35 == 155 and 1500 - 155 == 1345
  - 120 + 35 < 200
  - 60 * 1000 == 60000
  steps:
  - show: "<p><b>Bước 1 — Tính lưu lượng mỗi phút và mỗi giờ</b> (lưu lượng giả định):</p>\n\
      <table class=\"t\">\n  <tr><th>đơn vị</th><th>phép tính</th><th>kết quả</th></tr>\n\
      \  <tr><td>Mỗi phút</td><td>$10\\,000 \\times 60$</td><td>$600\\,000$ giao dịch</td></tr>\n\
      \  <tr><td>Mỗi giờ</td><td>$600\\,000 \\times 60$</td><td>$36\\,000\\,000$ giao\
      \ dịch</td></tr>\n</table>\n"
    focus:
    - 0
    - 0
    say: 'Bước một, ta tính lưu lượng giả định. Ở mức 10 nghìn lệnh mỗi giây, mỗi phút có 600 nghìn giao dịch, và một giờ cao điểm đạt 36 triệu.'
  - clear: true
    show: "<p><b>Bước 2 — Ước lượng thời gian phản hồi toàn trình</b> (ví dụ minh\
      \ họa):</p>\n<table class=\"t\">\n  <tr><th>thành phần</th><th>thời gian</th><th>ghi\
      \ chú</th></tr>\n  <tr><td>Mạng NAPAS</td><td>$120$ ms</td><td>vòng khứ hồi\
      \ qua mạng liên ngân hàng</td></tr>\n  <tr><td>Hạch toán Core</td><td>$35$ ms</td><td>ghi\
      \ nhận giao dịch trên Core T24</td></tr>\n  <tr><td>Toàn trình</td><td>$120\
      \ + 35 = 155$ ms</td><td>ước lượng một lần, dưới mốc 200 ms; thấp hơn nhiều ngưỡng chờ\
      \ giả định 1500 ms</td></tr>\n</table>\n<p class=\"note\">P99 không cộng được: muốn biết P99 toàn trình phải đo cả đường đi nhiều lần rồi lấy mốc 99%. Số 155 ms chỉ là ước lượng sơ bộ.</p>\n"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Bước hai, ta ước lượng độ trễ toàn trình với số liệu giả định. Thời gian
      mạng NAPAS tốn 120 mi li giây. Hạch toán Core T24 tốn 35 mi li giây. Tổng
      ước lượng là 155 mi li giây, dưới mốc 200 và thấp hơn nhiều ngưỡng chờ giả định 1500 mi li giây. Nhưng độ trễ 99 phần trăm không cộng được từng đoạn, muốn biết thật phải đo cả đường đi nhiều lần.
  - clear: true
    show: '<p><b>Bước 3 — Cấu hình khoá khử trùng lặp trong Redis</b>:</p>

      <div class="box key">Thời gian hết hạn khoá: $60 \text{ giây} = 60 \times 1000
      = 60\,000 \text{ ms}$. Chặn các bản tin gửi lại do lỗi mạng trong khoảng thời
      gian này.</div>

      '
    focus:
    - 0
    - 0
    say: 'Bước ba, ta thiết lập khoá khử trùng lặp trong Redis. Khoá giữ 60 giây, tức 60 nghìn mi li giây, nên chặn được các bản tin gửi lặp trong khoảng đó.'
- id: code
  kind: example
  title: 'Chạy thử bằng mã Python (mô phỏng): tải, độ trễ toàn trình'
  checks:
  - 10000 * 60 == 600000 and 600000 * 60 == 36000000
  - 120 + 35 == 155 and 155 < 200
  steps:
  - clear: true
    show: |
      <p><b>Đọc trước</b> — bốn kiểu dòng trong mã Python sắp hiện:</p><table class="t"><tr><th>viết trong mã</th><th>đọc là</th><th>ví dụ</th></tr><tr><td><code>tps = 10000</code></td><td>dấu bằng đứng một mình là <b>gán</b>: đặt giá trị bên phải vào cái tên bên trái</td><td>tên <code>tps</code> giữ số 10000</td></tr><tr><td><code>phut = tps * 60</code></td><td>dấu sao là phép nhân; máy tính vế phải rồi mới gán</td><td>10000 nhân 60 ra 600000</td></tr><tr><td><code>print(phut, gio)</code></td><td><code>print</code> là lệnh in ra màn hình, các giá trị cách nhau một dấu cách; chữ trong ngoặc kép in nguyên văn</td><td><code>print(155, "ms")</code> in <code>155 ms</code></td></tr><tr><td><code>if tong &lt; 200:</code> rồi dòng thụt vào</td><td>dấu nhỏ hơn là phép so sánh; dòng thụt vào chỉ chạy khi so sánh đúng</td><td>tong là 155 thì in; là 250 thì bỏ qua</td></tr></table><p class="note">Nhắc nền sẽ dùng lại: <code>==</code> so hai giá trị có bằng nhau không; <code>//</code> chia lấy phần nguyên; <code>round</code> làm tròn; <code>def</code> đặt tên hàm; <code>.replace</code> thay một đoạn chữ bằng đoạn khác.</p>
    say: 'Trước khi đọc mã, ta học bốn kiểu dòng. Dấu bằng đứng một mình là gán giá trị bên phải vào tên bên trái. Dấu sao là phép nhân. Lệnh in hiện giá trị ra màn hình, chữ trong ngoặc kép in nguyên văn. Câu điều kiện so sánh bằng dấu nhỏ hơn, và dòng thụt vào chỉ chạy khi phép so sánh đúng. Dòng nhắc nền ở dưới gồm hai dấu bằng so sánh, hai gạch chéo chia lấy phần nguyên, làm tròn, đặt tên hàm và thay chữ.'
    focus:
    - 0
    - 2.2
    - 2.3
    - 2.4
    - 2.5
