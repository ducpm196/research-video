      học Cử nhân AI tại UIT, dự kiến tốt nghiệp cuối năm 2026. Về tiền: tin tuyển dụng
      của ACB (bản đã lưu, đọc tháng 11 năm 2026, chưa kiểm lại trang gốc; hãy kiểm lại tin hiện hành) ghi lương "Thương lượng"; điều
      ghi rõ là <b>lương tháng 13 cố định</b> và <b>thưởng cuối năm 1–4 tháng lương</b>.
      Mọi con số lương trong bài là <b>số minh hoạ</b>, không phải số có nguồn. Với lương
      cứng L = 40 triệu mỗi tháng (số minh hoạ): cộng lương tháng 13 là $40 \times 13 = 520$
      triệu mỗi năm, cộng thưởng 1–4 tháng thì $40 \times 14 = 560$ đến $40 \times
      17 = 680$ triệu. Khung lương thị trường chỉ có ở các bài tổng hợp chưa kiểm
