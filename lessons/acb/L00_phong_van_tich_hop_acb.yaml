  - 3000 // 1000 == 3
  steps:
  - show: '<p><b>Tình huống</b>: Khách hàng có 1 triệu đồng, thanh toán hoá đơn điện
      lực 500 nghìn đồng.</p>

      <p>Core Banking đã trích nợ 500 nghìn, số dư còn 500 nghìn. Nhưng cổng điện
      lực phản hồi hết giờ.</p>

      '
    focus:
    - 0
    - 0
    say: Ta kiểm tra tình huống kinh điển khi đối tác thanh toán bị nghẽn. Giả sử
      tài khoản có một triệu đồng, ngân hàng trừ 500 nghìn để trả tiền điện, số dư
      còn 500 nghìn đồng nhưng đối tác báo hết giờ.
  - show: '<div class="box key"><b>Quy tắc bồi hoàn SAGA</b>: Vì đối tác chưa phản
      hồi rõ ràng, hệ thống chuyển sang trạng thái nghi vấn, gọi truy vấn sau 3 giây.
      Do đối tác xác nhận chưa nhận tiền, ta kích hoạt bồi hoàn cộng lại 500 nghìn:
      $500\,000 + 500\,000 = 1\,000\,000$ đồng.</div>

      '
    focus:
    - 0
    - 0
    say: Vì đối tác chưa rõ kết quả, hệ thống chuyển sang trạng thái nghi vấn và tra
      cứu sau 3 giây. Do đối tác xác nhận chưa nhận tiền, ta kích hoạt bồi hoàn để
      hoàn lại đủ một triệu đồng an toàn.
