scenes:
- id: hook
  kind: hook
  title: Khoảng cách giữa lập trình viên bình thường và Kỹ sư Tích hợp Ngân hàng
  steps:
  - show: '<p>Nhiều bạn nghĩ làm backend tích hợp chỉ đơn giản là viết vài API REST
      để lưu dữ liệu. Nhưng khi bước vào ngân hàng lớn như ACB, một lệnh bị nghẽn
      mạng có thể gây thất thoát hàng tỉ đồng.</p>

      <div class="box key">Hôm nay: <b>Toàn cảnh kiến trúc tích hợp ngân hàng</b>
      — từ Temenos T24, NAPAS 247, SAGA đến bí quyết chinh phục mức lương <b>50 triệu
      gross</b>.</div>

      '
    focus:
    - 0
    - 0
    - 0
    say: Chào bạn, nhiều bạn nghĩ làm lập trình viên tích hợp chỉ đơn giản là viết
      vài giao diện lập trình để lưu dữ liệu. Nhưng trong ngân hàng, một lệnh nghẽn
      mạng có thể làm thất thoát hàng tỉ đồng hoặc trừ tiền hai lần. Hôm nay ta cùng
      phân tích toàn cảnh kiến trúc tích hợp ngân hàng, từ Core T24, Cổng NAPAS, điều
      phối SAGA, tới mức lương 50 triệu gross.
- id: prereq
  kind: prereq
  title: 'Ôn lại: Đơn vị thời gian, bắt tay mạng và tính nhất quán dữ liệu'
  checks:
  - 1000 * 1000 == 1000000 and 1000 // 10 == 100
  - 10000 // 100 == 100 and 60 * 1000 == 60000
  steps:
  - show: "<table class=\"t\">\n  <tr><th>thông số</th><th>mục tiêu thiết kế (ví dụ minh họa)</th><th>ý\
      \ nghĩa</th></tr>\n  <tr><td>Độ trễ P99</td><td>dưới 100 ms</td><td>99%\
      \ giao dịch phản hồi dưới 0,1 giây</td></tr>\n  <tr><td>Thông lượng</td><td>10\
      \ 000 TPS</td><td>hệ thống gánh 10 nghìn lệnh mỗi giây</td></tr>\n  <tr><td>Thời\
      \ gian sống khoá</td><td>60 giây</td><td>khoá chống trùng lặp giữ trong một\
      \ phút</td></tr>\n</table>\n"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Trước tiên ta ôn lại ba chỉ số hiệu năng huyết mạch trong ngân hàng. Một
      giây bằng một nghìn mi li giây. Ví dụ mục tiêu thiết kế, độ trễ 99 phần trăm
      dưới 100 mi li giây, nghĩa là hầu hết giao dịch phản hồi rất nhanh. Thông lượng
      mục tiêu giờ cao điểm là 10 nghìn giao dịch mỗi giây. Và khoá khử trùng lặp được giữ trong 60 giây, tức
      60 nghìn mi li giây.
- id: symbol
  kind: symbol
  title: Giải mã các thuật ngữ và ký hiệu cốt lõi trong ngành ngân hàng
  steps:
  - show: "<table class=\"t\">\n  <tr><th>thuật ngữ</th><th>tên đầy đủ</th><th>vai\
      \ trò kỹ thuật</th></tr>\n  <tr><td>T24 OFS</td><td>Open Financial Service</td><td>chuỗi\
      \ bản tin giao tiếp với Core Banking Temenos T24</td></tr>\n  <tr><td>ISO 8583</td><td>Financial\
      \ Transaction Message</td><td>chuẩn bản tin tài chính liên ngân hàng qua socket\
      \ TCP</td></tr>\n  <tr><td>SAGA</td><td>Distributed Saga Pattern</td><td>chuỗi\
      \ giao dịch cục bộ kèm giao dịch bồi hoàn tự động</td></tr>\n  <tr><td>STAN\
      \ / RRN</td><td>Trace & Reference Number</td><td>số định danh đối soát giao\
      \ dịch duy nhất trong ngày</td></tr>\n</table>\n"
    focus:
    - 0
    - 0
    - 0
    - 0
    - 0
    say: Để phỏng vấn tự tin, bạn cần giải mã bốn thuật ngữ nền tảng sau. Bản tin
      OFS là định dạng giao tiếp chuẩn của Core Banking Temenos T24 qua hàng đợi IBM
      MQ. Chuẩn ISO 8583 là giao thức bản tin tài chính qua cổng chuyển mạch NAPAS.
      Mô hình SAGA là chuỗi giao dịch phân tán giúp tự động hoàn tiền khi đối tác
      sập. Số kiểm toán STAN cùng số tham chiếu RRN là hai mã số dùng để đối soát
      liên ngân hàng.
