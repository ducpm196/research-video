      lượng, chỉ ghi rõ lương tháng 13 cố định cùng thưởng từ 1 đến 4 tháng lương.
      Mọi con số lương trong bài là số minh hoạ. Với lương
      cứng bốn mươi triệu mỗi tháng, một năm là năm trăm hai mươi triệu cho mười ba tháng lương,
      và từ năm trăm sáu mươi đến sáu trăm tám mươi triệu khi có thưởng. Khung lương thị
      trường chưa kiểm chứng, nên hãy hỏi thẳng khung lương của
      vị trí trước khi nêu con số.
