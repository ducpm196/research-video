- id: formula
  kind: formula
  title: 'Suy ra từng bước: cắt một dòng đối soát thành hai phần'
  checks:
  - len('Nguyen Van An'[0:6]) == 6 - 0
  - all(len('0123456789;1234567'[a:b]) == b - a for a in range(0, 5) for b in range(5,
    18))
  - len('0123456789') + 1 + len('1234567') == len('0123456789;1234567')
  steps:
  - show: <p><b>Bước 1. Độ dài chuỗi con.</b> <code>substring(a, b)</code> lấy chỉ
      số $a$ tới $b - 1$, nên có</p>$$(b - 1) - a + 1 = b - a \text{ ký tự}$$
    focus:
    - 1
    - 1
    - 2
    say: Bước một, đếm độ dài chuỗi con. Hàm cắt lấy từ chỉ số a tới chỉ số b trừ
      một, nên số ký tự là b trừ một, trừ a, cộng một, tức là b trừ a. Ví dụ cắt từ
      không tới sáu được sáu ký tự.
  - show: <p><b>Bước 2. Tìm chỗ cắt.</b> Gọi $p$ là chỉ số dấu <code>;</code>.</p>$$\text{phần
      trước} = \text{substring}(0, p) \qquad \text{phần sau} = \text{substring}(p
      + 1)$$
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước hai, tìm chỗ cắt. Gọi p là chỉ số của dấu chấm phẩy, tìm bằng hàm tìm
      vị trí. Phần trước lấy từ không tới trước p, nên không dính dấu chấm phẩy. Phần
      sau bắt đầu từ p cộng một, vì phải bỏ qua chính dấu chấm phẩy.
  - show: <p><b>Bước 3. Kiểm độ dài:</b> hai phần cộng dấu <code>;</code> phải bằng
      cả dòng.</p>$$p + 1 + (n - p - 1) = n$$
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, kiểm bằng độ dài. Phần trước có p ký tự, dấu chấm phẩy một ký tự,
      phần sau có n trừ p trừ một ký tự. Cộng lại bằng n, nghĩa là không mất và không
      thừa ký tự nào.
  - show: <p><b>Bước 4. Chuỗi bất biến:</b> không hàm nào sửa được chuỗi cũ; kết quả
      nằm ở chuỗi được <b>trả về</b>.</p><div class="code"><div>    String s = "vnd";</div><div>    String
      t = s.toUpperCase();        <span class="cm">// trả về chuỗi MỚI, s giữ nguyên</span></div><div>    System.out.println(s
      + " " + t);</div><div>    s = s + " 2026";                   <span class="cm">//
      tạo chuỗi mới, rồi s trỏ sang nó</span></div><div>    System.out.println(s);</div><div>}</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>vnd VND</div><div>vnd 2026</div></div>
    focus:
    - 1
    - - 2
      - 4
    - - 2
      - 4
    clear: true
    say: Bước bốn, một tính chất quan trọng là chuỗi bất biến, nghĩa là không hàm
      nào sửa được nội dung của chuỗi đã tạo. Hàm đổi chữ hoa trả về chuỗi mới, nên
      biến s vẫn là chữ thường. Phép nối cũng tạo chuỗi mới, rồi biến s trỏ sang nó.
