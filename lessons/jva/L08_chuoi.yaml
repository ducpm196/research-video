- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>chuỗi = dãy ký tự, chỉ số từ 0</span><span
      class='a'>→</span><span class='n'>kết quả ở chuỗi trả về, phải gán lại</span><span
      class='a'>→</span><span class='n'>so nội dung bằng equals</span><span class='a'>→</span><span
      class='n'>chuỗi số → số bằng Long.parseLong</span></div>
    say: Tổng kết chuỗi logic. Chuỗi là dãy ký tự đánh chỉ số từ không. Không hàm
      nào sửa chuỗi cũ, kết quả nằm ở chuỗi trả về, nên phải gán lại. So nội dung
      thì dùng hàm so nội dung, và muốn tính toán thì đổi chuỗi số thành số trước.
  - show: '<div class=''box key''><b>Tư duy:</b> dữ liệu chữ đi vào hệ thống luôn
      qua ba bước: <b>làm sạch</b> (<code>trim</code>),

      <b>tách</b> (<code>indexOf/substring</code> hoặc <code>split</code>), <b>kiểm</b>
      (độ dài, <code>equals</code>). Viết <code>"hằng".equals(x)</code> để không vấp
      giá trị rỗng.</div>

      '
    say: 'Điều cần mang theo. Dữ liệu chữ đi vào hệ thống luôn qua ba bước: làm sạch,
      tách, rồi kiểm độ dài và nội dung. Và hãy đặt chuỗi hằng đứng trước khi so,
      để không vấp giá trị rỗng.'
