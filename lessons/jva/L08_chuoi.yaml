source: curriculum/jva.yaml L08; audit/jva/verify_jva.py L08 (javac/java chạy thật);
  The Java Language Specification, Java SE 21 (JLS §4.3.3 lớp String, §3.10.5 chuỗi
  hằng dùng chung một đối tượng, §15.21.3 so sánh tham chiếu ==, §15.18.1 nối chuỗi);
  java.lang.String (length, charAt, indexOf, substring, trim, split, equals, format),
  java.lang.StringBuilder, java.lang.Long.parseLong, java.util.Formatter (cờ ',' theo
  Locale), Java SE 21 API; JEP 358 thông báo NullPointerException chi tiết; dev.java/learn
assumes: []
objectives:
- Dùng length, charAt, indexOf, substring, trim, split trên chuỗi, với chỉ số từ 0
- Giải thích vì sao == so tham chiếu còn equals so nội dung
- Tách dòng “số tài khoản;số tiền”, đổi phần số bằng Long.parseLong và định dạng 1,234,567
- Tránh lỗi quên gán lại chuỗi, gọi hàm trên giá trị rỗng, nối chuỗi trong vòng lặp
  lớn
