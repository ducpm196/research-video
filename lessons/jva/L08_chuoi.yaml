scenes:
- id: hook
  kind: hook
  title: Hai số tài khoản giống hệt nhau, máy vẫn bảo khác?
  steps:
  - show: '<p>Khách gõ số tài khoản <code>0123456789</code>, hệ thống tra đúng số
      đó trong danh sách… và báo <b>không tìm thấy</b>.</p>

      <div class="box warn">Lỗi thật hay gặp: so hai chuỗi bằng <code>==</code>, hoặc
      quên bỏ khoảng trắng thừa ở hai đầu.</div>

      '
    focus:
    - 1
    - 2
    say: Khách gõ đúng số tài khoản, hệ thống tra đúng số đó trong danh sách, vậy
      mà báo không tìm thấy. Thủ phạm thường là so hai chuỗi bằng dấu bằng bằng, hoặc
      quên bỏ khoảng trắng thừa ở hai đầu.
  - show: '<p>Dữ liệu ngân hàng phần lớn là <b>chữ</b>: số tài khoản, tên khách, từng
      dòng tệp đối soát <code>0123456789;1234567</code>.</p>

      <div class="box key">Hôm nay ta học <b>chuỗi</b>: đọc, cắt, so sánh, đổi thành
      số và định dạng tiền cho đúng.</div>

      '
    focus:
    - 1
    - 2
    say: 'Dữ liệu ngân hàng phần lớn là chữ, như số tài khoản, tên khách, hay từng
      dòng của tệp đối soát, tức tệp hai bên gửi nhau để so khớp giao dịch. Hôm nay
      ta học chuỗi: đọc, cắt, so sánh, đổi thành số, và định dạng tiền cho đúng.'
- id: prereq
  kind: prereq
  title: Ôn lại ba điều sẽ dùng hôm nay
  steps:
  - show: '<table class=''t''><tr><th>đã học</th><th>viết</th><th>dùng lại hôm nay</th></tr><tr><td>①
      mảng: chỉ số từ 0 tới length − 1</td><td><code>a[0]</code>, <code>a.length</code></td><td>ký
      tự trong chuỗi cũng đánh chỉ số từ 0</td></tr><tr><td>② đối tượng và tham chiếu,
      gọi hàm qua dấu chấm</td><td><code>an.nap(1000000)</code></td><td>chuỗi là đối
      tượng: <code>ten.length()</code></td></tr><tr><td>③ dấu <code>+</code> với chuỗi
      là nối chữ</td><td><code>"A" + 1 + 2</code> ra <code>A12</code></td><td>phân
      biệt chuỗi số với số</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Trước hết ta ôn lại ba điều. Thứ nhất, phần tử của mảng đánh chỉ số từ không
      tới độ dài trừ một. Thứ hai, đối tượng được giữ qua tham chiếu, và ta gọi hàm
      của nó qua dấu chấm. Thứ ba, dấu cộng có một vế là chuỗi thì nối chữ, làm từ
      trái sang phải.
- id: sym
  kind: symbol
  title: Giải mã các hàm hay dùng của chuỗi
  steps:
  - show: <p><b>Tệp Chuoi.java</b></p><div class="code"><div>String ten = "Nguyen
      Van An";</div><div>System.out.println(ten.length());          <span class="cm">//
      số ký tự</span></div><div>System.out.println(ten.charAt(0));         <span class="cm">//
      ký tự ở chỉ số 0</span></div><div>System.out.println(ten.indexOf(" "));      <span
      class="cm">// vị trí dấu cách đầu tiên</span></div><div>System.out.println(ten.substring(0,
      6));   <span class="cm">// từ chỉ số 0 tới TRƯỚC 6</span></div><div>System.out.println(ten.substring(7));      <span
      class="cm">// từ chỉ số 7 tới hết</span></div><div>System.out.println("[" +
      "  0123  ".trim() + "]");   <span class="cm">// bỏ khoảng trắng hai đầu</span></div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Chuỗi trong Java là một đối tượng, nên ta gọi hàm của nó qua dấu chấm. Chương
      trình này thử sáu hàm trên tên Nguyễn Văn An.
  - show: <table class='t'><tr><th>viết</th><th>nghĩa</th><th>kết quả</th></tr><tr><td><code>ten.length()</code></td><td>số
      ký tự; chuỗi <b>có</b> ngoặc tròn, mảng thì không</td><td>13</td></tr><tr><td><code>ten.charAt(0)</code></td><td>ký
      tự ở chỉ số 0, đếm từ 0 như mảng</td><td>N</td></tr><tr><td><code>ten.indexOf("
      ")</code></td><td>chỉ số lần xuất hiện đầu tiên; không có thì ra −1</td><td>6</td></tr><tr><td><code>ten.substring(0,
      6)</code></td><td>chuỗi con từ chỉ số 0 tới <b>trước</b> 6</td><td>Nguyen</td></tr><tr><td><code>ten.substring(7)</code></td><td>chuỗi
      con từ chỉ số 7 tới hết</td><td>Van An</td></tr><tr><td><code>"  0123  ".trim()</code></td><td>bỏ
      khoảng trắng ở hai đầu</td><td>[0123]</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    clear: true
    say: Hàm độ dài cho số ký tự, và với chuỗi thì có ngoặc tròn, khác mảng. Hàm lấy
      ký tự đếm chỉ số từ không, giống mảng. Hàm tìm vị trí trả về chỉ số lần xuất
      hiện đầu tiên, không thấy thì ra âm một. Hàm cắt với hai số lấy từ chỉ số đầu
      tới trước chỉ số sau. Với một số, nó lấy từ đó tới hết chuỗi. Hàm cắt khoảng
      trắng bỏ dấu cách thừa ở hai đầu.
