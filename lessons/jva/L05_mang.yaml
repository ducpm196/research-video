scenes:
- id: hook
  kind: hook
  title: 'Năm tài khoản, năm nghìn tài khoản: viết bao nhiêu biến?'
  steps:
  - show: '<p>Ngân hàng nhỏ của bạn có $5$ tài khoản. Người quản lý hỏi: <b>tổng số
      dư</b> là bao nhiêu, tài khoản nào <b>nhiều tiền nhất</b>?</p>

      <div class="box warn">Với những gì đã học, bạn phải khai năm biến <code>soDu1</code>
      … <code>soDu5</code> và viết năm lệnh cộng. Năm nghìn tài khoản thì không viết
      nổi.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Ngân hàng nhỏ của bạn có năm tài khoản. Người quản lý hỏi tổng số dư bao
      nhiêu, và tài khoản nào nhiều tiền nhất. Với những gì đã học, bạn phải khai
      năm biến riêng, còn năm nghìn tài khoản thì không viết nổi.
  - show: '<p>Hôm nay ta học <b>mảng</b>: một tên duy nhất giữ cả một dãy giá trị
      cùng kiểu; mỗi ô có một số thứ tự gọi là <b>chỉ số</b>.</p>

      <div class="box key">Mảng ghép với vòng lặp đếm: năm hay năm nghìn tài khoản
      đều dùng cùng một đoạn mã.</div>

      '
    focus:
    - 1
    - 2
    say: Hôm nay ta học mảng, tức là một tên giữ cả một dãy giá trị cùng kiểu, mỗi
      ô có một số thứ tự gọi là chỉ số. Ghép mảng với vòng lặp đếm, năm hay năm nghìn
      tài khoản đều dùng cùng một đoạn mã.
- id: prereq
  kind: prereq
  title: Ôn lại ba điều sẽ dùng hôm nay
  steps:
  - show: <table class='t'><tr><th>đã học</th><th>viết</th><th>dùng lại hôm nay</th></tr><tr><td>①
      biến kiểu số nguyên dài, tiền tính bằng đồng</td><td><code>long tong = 0;</code></td><td>giữ
      tổng số dư</td></tr><tr><td>② vòng lặp đếm</td><td><code>for (int i = 0; i &lt;
      5; i++)</code></td><td>i lần lượt là 0, 1, 2, 3, 4</td></tr><tr><td>③ rẽ nhánh
      nếu và cộng dồn</td><td><code>if (x &gt; lon)</code>, <code>tong += x;</code></td><td>tìm
      số lớn nhất, cộng tổng</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Trước hết ta ôn lại ba điều. Thứ nhất, tiền được giữ trong biến kiểu số nguyên
      dài, tính theo đơn vị đồng. Thứ hai, vòng lặp đếm từ không, chạy khi biến đếm
      còn nhỏ hơn năm, nên chạy đúng năm lần với không, một, hai, ba, bốn. Thứ ba,
      lệnh rẽ nhánh nếu so sánh hai số, còn phép cộng dồn cộng thêm từng giá trị vào
      tổng.
- id: sym
  kind: symbol
  title: Giải mã ký hiệu của mảng
  steps:
  - show: <p><b>Tệp Mang.java</b></p><div class="code"><div><span class="kw">import</span>
      java.util.Arrays;</div><div> </div><div><span class="kw">public</span> <span
      class="kw">class</span> Mang {</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>        <span class="kw">long</span>[] soDu = {1500000, 250000,
      4000000, 750000, 3200000};</div><div>        System.out.println(soDu.length);           <span
      class="cm">// số phần tử</span></div><div>        System.out.println(soDu[0]);               <span
      class="cm">// phần tử đầu</span></div><div>        System.out.println(soDu[4]);               <span
      class="cm">// phần tử cuối</span></div><div>        System.out.println(Arrays.toString(soDu));
      <span class="cm">// in cả mảng</span></div><div>    }</div><div>}</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Đây là chương trình đầu tiên có mảng. Nó khai một mảng năm số dư, mỗi giá
      trị trong mảng gọi là một phần tử, rồi in số phần tử, phần tử đầu, phần tử cuối,
      và cả mảng.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>long[]
      soDu</code></td><td>biến mảng; dấu <code>[]</code> sau kiểu nghĩa là <b>nhiều</b>
      giá trị kiểu <code>long</code></td></tr><tr><td><code>{1500000, …}</code></td><td>liệt
      kê sẵn giá trị; mỗi giá trị là một <b>phần tử</b>; máy đếm được 5 phần tử</td></tr><tr><td><code>soDu[0]</code></td><td>phần
      tử có chỉ số 0, tức phần tử <b>đầu tiên</b></td></tr><tr><td><code>soDu[4]</code></td><td>phần
      tử <b>cuối</b>, vì chỉ số chạy từ 0 tới 5 − 1</td></tr><tr><td><code>soDu.length</code></td><td>số
      phần tử: một con số gắn sẵn với mảng (gọi là <b>thuộc tính</b>), <b>không</b>
      có ngoặc tròn</td></tr><tr><td><code>import java.util.Arrays;</code></td><td>mượn
      bộ công cụ mảng; <code>Arrays.toString</code> in cả mảng</td></tr><tr><td><code>new
      long[5]</code></td><td>tạo mảng 5 ô mới, ô nào cũng bằng 0</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    clear: true
    say: Ngoặc vuông sau tên kiểu nghĩa là biến giữ nhiều số nguyên dài. Ngoặc nhọn
      liệt kê sẵn năm giá trị ban đầu. Chỉ số không là phần tử đầu tiên. Chỉ số bốn
      là phần tử cuối, vì chỉ số chạy từ không tới năm trừ một. Độ dài là một con
      số gắn sẵn với mảng, gọi là thuộc tính, cho biết số phần tử, và không có ngoặc
      tròn. Dòng nhập ở đầu tệp mượn bộ công cụ mảng, có hàm in cả mảng. Từ khoá tạo
      mới kèm số năm tạo mảng năm ô, ô nào cũng bằng không.
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>5</div><div>1500000</div><div>3200000</div><div>[1500000,
      250000, 4000000, 750000, 3200000]</div></div>
    clear: true
    say: 'Chạy thật, ta được bốn dòng: năm, một triệu năm trăm nghìn, ba triệu hai
      trăm nghìn, và cả mảng trong ngoặc vuông.'
