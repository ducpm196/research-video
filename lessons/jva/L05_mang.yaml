- id: formula
  kind: formula
  title: 'Suy ra từng bước: tạo, gán, sắp xếp, duyệt mảng'
  checks:
  - sorted([1500000, 0, 0, 0, 3200000]) == [0, 0, 0, 1500000, 3200000]
  - list(range(0, 5)) == [0, 1, 2, 3, 4] and max(range(0, 5)) == 5 - 1
  steps:
  - show: <p><b>Bước 1. Tạo mảng 5 ô.</b></p><div class="code"><div><span class="kw">long</span>[]
      a = <span class="kw">new</span> <span class="kw">long</span>[5];              <span
      class="cm">// 5 ô, ô nào cũng bằng 0</span></div><div>System.out.println(Arrays.toString(a));</div></div><span
      class='note'>Ô kiểu số được Java đặt sẵn giá trị 0, nên in ra [0, 0, 0, 0, 0].</span>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, tạo mảng. Từ khoá tạo mới kèm số năm trong ngoặc vuông xin bộ nhớ
      cho năm ô số nguyên dài. Java đặt sẵn giá trị không cho mọi ô kiểu số, nên lệnh
      in cho ra năm số không.
  - show: '<p><b>Bước 2. Gán từng ô theo chỉ số.</b></p><div class="code"><div>a[0]
      = 1500000;                      <span class="cm">// gán ô chỉ số 0</span></div><div>a[4]
      = 3200000;                      <span class="cm">// gán ô chỉ số 4, ô cuối</span></div><div>System.out.println(Arrays.toString(a));</div></div><span
      class=''note''>Ô 0 và ô 4 đổi, ba ô giữa vẫn là 0: [1500000, 0, 0, 0, 3200000].</span>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, gán từng ô. Ta viết tên mảng, chỉ số trong ngoặc vuông, rồi dấu
      bằng và giá trị, giống gán một biến thường. Chỉ ô chỉ số không và ô chỉ số bốn
      được gán, nên ba ô giữa vẫn là không.
  - show: <p><b>Bước 3. Sắp xếp tăng dần.</b></p><div class="code"><div>Arrays.sort(a);                      <span
      class="cm">// sắp tăng dần, sửa ngay trên a</span></div><div>System.out.println(Arrays.toString(a));</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>[0, 0, 0, 0, 0]</div><div>[1500000, 0,
      0, 0, 3200000]</div><div>[0, 0, 0, 1500000, 3200000]</div></div>
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Bước ba, sắp xếp. Hàm sắp xếp của bộ công cụ mảng xếp các ô tăng dần, và
      sửa ngay trên mảng đó chứ không tạo mảng mới. Vì vậy dòng in thứ ba có ba số
      không đứng trước, rồi tới hai số lớn.
  - show: '<p><b>Bước 4. Suy ra vòng lặp duyệt mảng.</b></p><table class=''t''><tr><th>điều
      đã biết</th><th>suy ra</th></tr><tr><td>chỉ số đầu là 0, mảng có <code>a.length</code>
      ô</td><td>chỉ số cuối là <code>a.length - 1</code></td></tr><tr><td>chỉ số hợp
      lệ: 0, 1, …, <code>a.length - 1</code></td><td>điều kiện lặp <code>i &lt; a.length</code>,
      <b>không</b> có dấu bằng</td></tr><tr><td>vòng lặp đếm từ 0, mỗi lần tăng 1</td><td><code>for
      (int i = 0; i &lt; a.length; i++)</code> thăm mỗi ô đúng một lần</td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, suy ra vòng lặp duyệt mảng. Chỉ số bắt đầu từ không, nên chỉ số
      cuối bằng độ dài trừ một. Vì vậy điều kiện lặp là biến đếm nhỏ hơn độ dài, không
      có dấu bằng. Nhờ đó vòng lặp thăm mỗi ô đúng một lần.
- id: example
  kind: example
  title: 'Ví dụ: tổng, số dư lớn nhất và vị trí của nó, từng phép tính'
  checks:
  - sum([1500000, 250000]) == 1750000
  - 1750000 + 4000000 == 5750000
  - 5750000 + 750000 + 3200000 == 9700000 == sum([1500000, 250000, 4000000, 750000,
    3200000])
  - max([1500000, 250000, 4000000, 750000, 3200000]) == 4000000
  - '[1500000, 250000, 4000000, 750000, 3200000].index(4000000) == 2'
  steps:
  - show: <p><b>Tệp TongMang.java, phần chuẩn bị</b></p><div class="code"><div><span
      class="kw">long</span>[] soDu = {1500000, 250000, 4000000, 750000, 3200000};</div><div><span
      class="kw">long</span> tong = 0;</div><div><span class="kw">long</span> lonNhat
      = soDu[0];              <span class="cm">// tạm coi phần tử đầu là lớn nhất</span></div><div><span
      class="kw">int</span> viTri = 0;</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Bây giờ ta trả lời người quản lý. Biến tổng bắt đầu bằng không, biến lớn
      nhất tạm lấy phần tử đầu, và biến vị trí bằng không.
  - show: <p><b>Vòng lặp duyệt mảng</b></p><div class="code"><div><span class="kw">for</span>
      (<span class="kw">int</span> i = 0; i &lt; soDu.length; i++) {</div><div>    tong
      += soDu[i];</div><div>    <span class="kw">if</span> (soDu[i] &gt; lonNhat)
      {         <span class="cm">// gặp số lớn hơn thì ghi lại</span></div><div>        lonNhat
      = soDu[i];</div><div>        viTri = i;</div><div>    }</div><div>}</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Vòng lặp đếm đi qua các chỉ số từ không tới bốn, mỗi vòng cộng phần tử hiện
      tại vào tổng. Nếu phần tử hiện tại lớn hơn số lớn nhất đang giữ, ta ghi lại
      cả giá trị lẫn chỉ số của nó.
  - show: '<div class="code"><div>tong += soDu[i];</div></div>$$① \; i = 0: \; \text{tong}
      = 0 + 1500000 = \hl{1500000}$$$$② \; i = 1: \; \text{tong} = 1500000 + 250000
      = \hl{1750000}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất, chỉ số không, tổng thành một triệu năm trăm nghìn, và
      số này không lớn hơn chính nó. Phép tính thứ hai, tổng thành một triệu bảy trăm
      năm mươi nghìn, còn hai trăm năm mươi nghìn nhỏ hơn nên không ghi lại.
  - show: '<div class="code"><div><span class="kw">if</span> (soDu[i] &gt; lonNhat)
      {         <span class="cm">// gặp số lớn hơn thì ghi lại</span></div><div>    lonNhat
      = soDu[i];</div><div>    viTri = i;</div><div>}</div></div>$$③ \; i = 2: \;
      \text{tong} = 1750000 + 4000000 = \hl{5750000}$$<p>Vì $4000000$ lớn hơn $1500000$:
      lớn nhất thành $4000000$, vị trí thành $2$.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, chỉ số hai, tổng thành năm triệu bảy trăm năm mươi nghìn.
      Vì bốn triệu lớn hơn một triệu năm trăm nghìn, nên lớn nhất thành bốn triệu
      và vị trí thành hai.
  - show: '<div class="code"><div>tong += soDu[i];</div></div>$$④ \; i = 3: \; \text{tong}
      = 5750000 + 750000 = \hl{6500000}$$$$⑤ \; i = 4: \; \text{tong} = 6500000 +
      3200000 = \hlg{9700000}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, tổng thành sáu triệu năm trăm nghìn. Phép tính thứ năm,
      tổng thành chín triệu bảy trăm nghìn, và ba triệu hai trăm nghìn không lớn hơn
      bốn triệu nên lớn nhất giữ nguyên.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Tong: 9700000</div><div>Lon
      nhat: 4000000 o chi so 2</div></div>'
    clear: true
    say: 'Chạy thật, hai dòng in ra đúng như ta tính tay: tổng chín triệu bảy trăm
      nghìn, lớn nhất bốn triệu ở chỉ số hai.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: sắp xếp bản sao và cộng ngược'
  checks:
  - sorted([1500000, 250000, 4000000, 750000, 3200000]) == [250000, 750000, 1500000,
    3200000, 4000000]
  - sum(reversed([250000, 750000, 1500000, 3200000, 4000000])) == 9700000
  steps:
  - show: <p><b>Tệp KiemMang.java</b></p><div class="code"><div><span class="kw">long</span>[]
      banSao = Arrays.copyOf(soDu, soDu.length);</div><div>Arrays.sort(banSao);                 <span
      class="cm">// sắp bản sao, giữ nguyên mảng gốc</span></div><div>System.out.println(Arrays.toString(banSao));</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta kiểm bằng một đường khác hẳn. Chép mảng ra bản sao bằng hàm chép của bộ
      công cụ mảng, rồi sắp xếp bản sao, vì vị trí ban đầu của mảng gốc còn cần dùng.
      Sau khi sắp tăng dần, số lớn nhất phải nằm ở ô cuối.
  - show: '<div class="code"><div><span class="kw">int</span> i = banSao.length -
      1;</div><div><span class="kw">while</span> (i &gt;= 0) {                     <span
      class="cm">// cộng từ ô cuối về ô đầu</span></div><div>    tong += banSao[i];</div><div>    i--;</div><div>}</div><div>System.out.println("Lon
      nhat: " + banSao[banSao.length - 1] + ", tong: " + tong);</div></div>'
    clear: true
    say: Rồi ta cộng ngược từ ô cuối về ô đầu, bằng vòng lặp chạy khi chỉ số còn lớn
      hơn hoặc bằng không. Phép cộng không phụ thuộc thứ tự, nên tổng này phải trùng
      tổng lúc trước.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>[250000, 750000, 1500000,
      3200000, 4000000]</div><div>Lon nhat: 4000000, tong: 9700000</div></div><table
      class=''t''><tr><th></th><th>vòng lặp đếm, mảng gốc</th><th>sắp bản sao, cộng
      ngược</th></tr><tr><td>lớn nhất</td><td>4000000</td><td>4000000 ✓</td></tr><tr><td>tổng</td><td>9700000</td><td>9700000
      ✓</td></tr></table>'
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật, ô cuối của bản sao là bốn triệu, và tổng cộng ngược là chín triệu
      bảy trăm nghìn. Hai cách độc lập cho cùng kết quả, nên ta tin được cả hai con
      số.
- id: quymo
  kind: concept
  title: 'Khi số tài khoản tăng gấp nghìn, gấp triệu lần: duyệt từng ô còn nhanh không?'
  checks:
  - 5000000 // 5000 == 1000
  - 5000 // 5 == 1000
  - 1000 * 2500000 == 2500000000
  - 5000000 // 2 == 2500000
  - 8 * 10000000 == 80000000
  steps:
  - show: '<div class="code"><div><span class="kw">int</span>[] co = {5, 5000, 5000000};                   <span
      class="cm">// số tài khoản: x1, x1000, x1 000 000</span></div><div><span class="kw">for</span>
      (<span class="kw">int</span> k = 0; k &lt; co.length; k++) {</div><div>    <span
      class="kw">long</span>[] tk = <span class="kw">new</span> <span class="kw">long</span>[co[k]];</div><div>    <span
      class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; tk.length;
      i++) {</div><div>        tk[i] = 1000000L + i;                    <span class="cm">//
      số tài khoản tăng dần</span></div><div>    }</div><div>    <span class="kw">long</span>
      can = tk[tk.length - 1];                <span class="cm">// tìm tài khoản nằm
      ở cuối</span></div><div>    <span class="kw">int</span> buoc = 0;</div><div>    <span
      class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; tk.length;
      i++) {</div><div>        buoc++;</div><div>        <span class="kw">if</span>
      (tk[i] == can) {</div><div>            <span class="kw">break</span>;</div><div>        }</div><div>    }</div><div>    System.out.println(co[k]
      + " tai khoan: " + buoc + " buoc");</div><div>}</div></div>'
    clear: true
    say: Ta thử tìm một tài khoản nằm ở ô cuối, bằng cách duyệt từng ô, với ba cỡ
      mảng khác nhau. Chương trình đếm số bước, tức số lần so sánh, chứ không đo giờ,
      để kết quả không phụ thuộc máy.
  - show: '<table class=''t''><tr><th>số tài khoản</th><th>số bước tìm ở ô cuối</th><th>so
      với mảng năm ô</th></tr><tr><td>5</td><td>5</td><td>×1</td></tr><tr><td>5 000</td><td>5
      000</td><td>×1 000</td></tr><tr><td>5 000 000</td><td>5 000 000</td><td>×1 000
      000</td></tr></table><p><b>Kết quả chạy</b></p><div class="code"><div>5 tai
      khoan: 5 buoc</div><div>5000 tai khoan: 5000 buoc</div><div>5000000 tai khoan:
      5000000 buoc</div></div>'
    focus:
    - 1
    - - '1.3'
      - '1.4'
    - - '1.2'
      - '1.4'
    clear: true
    say: Số bước tăng đúng bằng số tài khoản. Gấp một nghìn lần tài khoản thì gấp
      một nghìn lần số bước, gấp một triệu lần thì gấp một triệu lần. Với năm tài
      khoản thì chẳng ai để ý, nhưng với năm triệu tài khoản thì mỗi lần tra cứu là
      năm triệu phép so sánh.
  - show: '<div class="box key"><b>Điều người làm nghề rút ra.</b> Duyệt từng ô có
      giá <b>tỉ lệ với số ô</b>. Nếu mỗi giây có 1 000 lượt tra cứu trên 5 000 000
      tài khoản,

      trung bình mỗi lượt xem một nửa mảng: $1\,000 \times 2\,500\,000 = 2\,500\,000\,000$
      phép so sánh mỗi giây (số minh hoạ).

      Mảng $10\,000\,000$ số <code>long</code> cũng chiếm $8 \times 10\,000\,000 =
      80\,000\,000$ byte. Đó là lý do hệ thống lớn dùng cấu trúc tra cứu riêng và
      chỉ mục của cơ sở dữ liệu.</div>

      '
    clear: true
    say: Duyệt từng ô có giá tỉ lệ với số ô. Nếu mỗi giây có một nghìn lượt tra cứu
      trên năm triệu tài khoản, mỗi lượt trung bình xem một nửa mảng, tức hai tỉ rưỡi
      phép so sánh mỗi giây, số minh hoạ. Mảng mười triệu số nguyên dài còn chiếm
      tám mươi triệu bai bộ nhớ. Đó là lý do hệ thống lớn dùng cấu trúc tra cứu riêng
      và chỉ mục của cơ sở dữ liệu.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Dùng <code>&lt;=</code>
      thay cho <code>&lt;</code> trong vòng lặp duyệt mảng.</div><div class="code"><div><span
      class="kw">long</span>[] soDu = {1500000, 250000, 4000000, 750000, 3200000};</div><div><span
      class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt;= soDu.length;
      i++) {   <span class="cm">// SAI: dấu &lt;= cho i chạy tới 5</span></div><div>    System.out.println(soDu[i]);</div><div>}</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>1500000</div><div>250000</div><div>4000000</div><div>750000</div><div>3200000</div><div><span
      class="cm">Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException:
      Index 5 out of bounds for length 5</span></div></div>'
    focus:
    - 1
    - 4
    - - 2
      - 4
    - 4
    clear: true
    say: Lỗi thứ nhất, của người mới, là viết dấu nhỏ hơn hoặc bằng trong vòng lặp
      duyệt mảng. Năm ô đầu được in bình thường. Tới vòng thứ sáu, máy truy cập ô
      chỉ số năm không tồn tại, và ném ra ngoại lệ vượt chỉ số mảng. Thông báo ghi
      rõ chỉ số năm, độ dài năm, đúng dấu hiệu của lỗi lệch một.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Viết ngoặc tròn sau <code>length</code>
      của mảng.</div><div class="code"><div>System.out.println(soDu.length());   <span
      class="cm">// SAI: độ dài của mảng không có ngoặc tròn</span></div></div><p><b>Trình
      biên dịch báo</b></p><div class="code"><div><span class="cm">error: cannot find
      symbol</span></div></div>'
    focus:
    - 2
    - 4
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là viết thêm ngoặc tròn sau độ dài của mảng.
      Độ dài của mảng là thuộc tính chứ không phải hàm, nên trình biên dịch báo không
      tìm thấy ký hiệu.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Gán <code>nhap =
      soDu</code> rồi tưởng mình đang sửa một bản nháp.</div><div class="code"><div><span
      class="kw">long</span>[] soDu = {1500000, 250000, 4000000};</div><div><span
      class="kw">long</span>[] nhap = soDu;                  <span class="cm">// KHÔNG
      chép: cùng một mảng</span></div><div>nhap[0] = 0;</div><div>System.out.println(soDu[0]);         <span
      class="cm">// mảng gốc cũng đổi</span></div><div><span class="kw">long</span>[]
      banSao = Arrays.copyOf(soDu, soDu.length);  <span class="cm">// chép thật</span></div><div>banSao[1]
      = 0;</div><div>System.out.println(soDu[1]);         <span class="cm">// mảng
      gốc giữ nguyên</span></div></div><p><b>Kết quả chạy</b></p><div class="code"><div>0</div><div>250000</div></div>'
    focus:
    - 2
    - 4
    - - 2
      - 4
    clear: true
    say: 'Lỗi thứ ba gặp cả ở người đã đi làm: gán một biến mới bằng mảng số dư để
      làm bản nháp, rồi sửa bản nháp. Phép gán chỉ chép mũi tên, nên ô đầu của mảng
      gốc cũng thành không. Muốn bản nháp thật thì phải chép bằng hàm chép, khi đó
      mảng gốc giữ nguyên.'
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - '[3, 8, 1, 8, 6].index(max([3, 8, 1, 8, 6])) == 1'
  - len([x for x in [3, 8, 1, 8, 6] if x > 4]) == 3
  - '[3, 8, 1, 8, 6][len([3, 8, 1, 8, 6]) - 1] == 6'
  steps:
  - show: <p><b>Đoán hai dòng in ra</b></p><div class="code"><div><span class="kw">int</span>[]
      a = {3, 8, 1, 8, 6};</div><div><span class="kw">int</span> viTri = 0;</div><div><span
      class="kw">int</span> dem = 0;</div><div><span class="kw">for</span> (<span
      class="kw">int</span> i = 0; i &lt; a.length; i++) {</div><div>    <span class="kw">if</span>
      (a[i] &gt; a[viTri]) {</div><div>        viTri = i;</div><div>    }</div><div>    <span
      class="kw">if</span> (a[i] &gt; 4) {</div><div>        dem++;</div><div>    }</div><div>}</div><div>System.out.println(a.length
      + " " + a[a.length - 1]);</div><div>System.out.println(viTri + " " + dem);</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    pause: 20
    clear: true
    say: Bây giờ tới phần bạn tự làm. Mảng có năm số là ba, tám, một, tám, sáu. Vòng
      lặp ghi lại vị trí số lớn nhất bằng phép so sánh lớn hơn, và đếm các số lớn
      hơn bốn. Hãy dừng video, viết ra giấy hai dòng in ra.
  - show: '<table class=''t''><tr><th>i</th><th>a[i]</th><th>a[i] &gt; a[viTri]?</th><th>viTri</th><th>a[i]
      &gt; 4?</th><th>dem</th></tr><tr><td>0</td><td>3</td><td>3 &gt; 3: sai</td><td>0</td><td>sai</td><td>0</td></tr><tr><td>1</td><td>8</td><td>8
      &gt; 3: đúng</td><td>1</td><td>đúng</td><td>1</td></tr><tr><td>2</td><td>1</td><td>1
      &gt; 8: sai</td><td>1</td><td>sai</td><td>1</td></tr><tr><td>3</td><td>8</td><td>8
      &gt; 8: sai</td><td>1</td><td>đúng</td><td>2</td></tr><tr><td>4</td><td>6</td><td>6
      &gt; 8: sai</td><td>1</td><td>đúng</td><td>3</td></tr></table>'
    focus:
    - 1
    - '1.3'
    - '1.5'
    - - '1.3'
      - '1.5'
      - '1.6'
    say: Đáp án như sau. Ở chỉ số một, tám lớn hơn ba, nên vị trí thành một. Ở chỉ
      số ba, tám không lớn hơn tám, vì phép so sánh không có dấu bằng, nên vị trí
      vẫn là một. Các số lớn hơn bốn là tám, tám và sáu, nên đếm được ba.
    clear: true
  - show: '<p>Dòng thứ nhất: độ dài là $5$; phần tử cuối có chỉ số $5 - 1 = 4$, giá
      trị $6$. Dòng thứ hai: vị trí $1$, đếm được $3$.</p>$$\hl{\text{5 6}} \qquad
      \hl{\text{1 3}}$$'
    focus:
    - 1
    - 2
    say: Dòng thứ nhất in độ dài năm, rồi phần tử ở chỉ số bốn, tức là sáu. Dòng thứ
      hai in vị trí một và số đếm ba.
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>5 6</div><div>1 3</div></div>
    clear: true
    say: Chạy thật chương trình, hai dòng in ra đúng là năm sáu, và một ba.
- id: practice
  kind: practice
  title: 'Tự làm: sáu tài khoản'
  steps:
  - show: '<p><b>Đề</b>: viết <code>SauTaiKhoan.java</code> (số minh hoạ), mảng <code>long[]
      soDu = {820000, 150000, 2400000, 150000, 3600000, 90000};</code></p>

      <ol><li>Một vòng lặp duyệt mảng: tổng; <b>chỉ số</b> số dư nhỏ nhất; số tài
