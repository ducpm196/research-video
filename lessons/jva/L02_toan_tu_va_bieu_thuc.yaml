source: 'curriculum/jva.yaml L02; audit/jva/verify_jva.py L02 (javac/java chạy thật);
  The Java Language Specification, Java SE 21: §15.17.2 (chia số nguyên làm tròn về
  phía 0), §15.17.3 (phần dư: (a/b)*b+(a%b)==a, dấu theo số bị chia), §15.16 (ép kiểu),
  §15.7 (tính từ trái sang phải), §15.23–15.24 (&& và || chỉ tính vế phải khi cần),
  §15.26.2 (gán ghép +=), §15.14.2 (++); dev.java/learn'
assumes: []
objectives:
- Tính đúng phép chia nguyên và chia lấy dư, kể cả với số âm
- Ép kiểu đúng chỗ để giữ phần lẻ, và biết thứ tự tính của biểu thức
- Dùng phép so sánh và phép logic, đặt phép kiểm trước nhờ ngắn mạch
- Tính phí phần trăm bằng số nguyên theo thứ tự nhân trước, chia sau
