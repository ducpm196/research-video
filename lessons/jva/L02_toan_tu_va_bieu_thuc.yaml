    - 1
    - 2
    clear: true
    say: Nhờ vậy ta đặt phép kiểm số người khác không ở vế trái. Số người bằng không
      nên vế trái sai, máy không chạy tới phép chia, và chương trình in giá trị sai
      một cách bình thường, không lỗi.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: chia đều một trăm nghìn cho ba người'
  checks:
  - 100000 // 3 == 33333
  - 100000 - 33333 * 3 == 1
  - 100000 % 3 == 1
  - int(-100000 / 3) == -33333
  - math.fmod(-100000, 3) == -1
  - -100000 - (-33333) * 3 == -1
  steps:
  - show: '<p><b>Bước 1. Thương.</b> Hai vế đều là số nguyên nên kết quả là số nguyên:
      phần lẻ bị <b>bỏ đi</b>.</p>

      $$100\,000 / 3 = 33\,333.333... \to \hl{33\,333}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, tính thương. Một trăm nghìn chia ba bằng ba mươi ba nghìn ba trăm
      ba mươi ba phẩy ba ba mãi. Vì hai vế đều là số nguyên nên Java bỏ phần lẻ, mỗi
      người được ba mươi ba nghìn ba trăm ba mươi ba đồng.
  - show: '<p><b>Bước 2. Số dư</b> là phần chưa chia được: lấy số ban đầu trừ phần
      đã chia.</p>

      $$100\,000 \,\%\, 3 = 100\,000 - 33\,333 \times 3 = 100\,000 - 99\,999 = \hl{1}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, tính số dư. Ba người nhận tổng cộng chín mươi chín nghìn chín trăm
      chín mươi chín đồng, nên còn dư đúng một đồng. Nghĩa là số dư bằng số ban đầu
      trừ đi thương nhân số chia.
  - show: '<p><b>Bước 3. Số âm.</b> Java bỏ phần lẻ bằng cách làm tròn <b>về phía
      0</b>, nên thương không thành −33 334. Số dư mang dấu của số bị chia:</p>

      $$-100\,000 / 3 \to \hl{-33\,333} \qquad -100\,000 - (-33\,333) \times 3 = \hl{-1}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, với số âm. Java bỏ phần lẻ bằng cách làm tròn về phía số không,
      nên thương là âm ba mươi ba nghìn ba trăm ba mươi ba. Theo cùng công thức ở
      bước hai, số dư là âm một, tức là số dư mang dấu của số bị chia.
  - show: <div class="code"><div>System.out.println(100000 / 3);     <span class="cm">//
      mỗi người được bao nhiêu</span></div><div>System.out.println(100000 % 3);     <span
      class="cm">// còn dư bao nhiêu đồng</span></div><div>System.out.println(-100000
      / 3);</div><div>System.out.println(-100000 % 3);</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>33333</div><div>1</div><div>-33333</div><div>-1</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Bước bốn, chạy thật để đối chiếu. Bốn dòng in ra đúng bốn con số ta vừa suy
      ra, cả hai số âm.
- id: example
  kind: example
  title: 'Ví dụ: năm phép chia với bảy và hai'
  checks:
  - 7 // 2 == 3
  - 7 % 2 == 1
  - 7 / 2 == 3.5
  - int(-7 / 2) == -3
  - math.fmod(-7, 2) == -1
  steps:
  - show: <p><b>Tệp ChiaNam.java</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> ChiaNam {</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>        System.out.println(7 / 2);            <span class="cm">//
      (1)</span></div><div>        System.out.println(7 % 2);            <span class="cm">//
      (2)</span></div><div>        System.out.println((<span class="kw">double</span>)
      7 / 2);   <span class="cm">// (3)</span></div><div>        System.out.println(-7
      / 2);           <span class="cm">// (4)</span></div><div>        System.out.println(-7
      % 2);           <span class="cm">// (5)</span></div><div>    }</div><div>}</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Bây giờ ta áp dụng cho năm phép tính với bảy và hai. Hãy đoán từng dòng trước
      khi xem kết quả.
  - show: <div class="code"><div>System.out.println(7 / 2);            <span class="cm">//
      (1)</span></div><div>System.out.println(7 % 2);            <span class="cm">//
      (2)</span></div></div>$$① \; 7 / 2 = 3.5 \to \hl{3} \qquad ② \; 7 \,\%\, 2 =
      7 - 3 \times 2 = \hl{1}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất, bảy chia hai là ba phẩy năm, bỏ phần lẻ còn ba, vì cả
      hai là số nguyên. Phép tính thứ hai, số dư là bảy trừ ba nhân hai, bằng một.
  - show: <div class="code"><div>System.out.println((<span class="kw">double</span>)
      7 / 2);   <span class="cm">// (3)</span></div></div>$$③ \; (\text{double})\,
      7 / 2 = 7.0 / 2 = \hl{3.5}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, phép ép kiểu làm trước phép chia, nên số bảy thành bảy
      phẩy không trước. Có một vế là số thực nên phép chia giữ phần lẻ, ra ba phẩy
      năm.
  - show: <div class="code"><div>System.out.println(-7 / 2);           <span class="cm">//
      (4)</span></div><div>System.out.println(-7 % 2);           <span class="cm">//
      (5)</span></div></div>$$④ \; -7 / 2 = -3.5 \to \hl{-3} \qquad ⑤ \; -7 \,\%\,
      2 = -7 - (-3) \times 2 = \hl{-1}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, âm bảy chia hai là âm ba phẩy năm, làm tròn về phía không
      thành âm ba, không phải âm bốn. Phép tính thứ năm, số dư là âm bảy trừ âm ba
      nhân hai, bằng âm một.
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>3</div><div>1</div><div>3.5</div><div>-3</div><div>-1</div></div>
    clear: true
    say: Chạy thật, năm dòng in ra là ba, một, ba phẩy năm, âm ba và âm một, đúng
      như ta đã tính.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: ghép thương và dư phải ra lại số ban đầu'
  checks:
  - (7 // 2) * 2 + 7 % 2 == 7
  - int(-7 / 2) * 2 + math.fmod(-7, 2) == -7
  - (-4) * 2 + math.fmod(-7, 2) != -7
  steps:
  - show: '<p>Luật luôn đúng với số nguyên (số chia khác 0): <b>thương × số chia +
      dư = số ban đầu</b>.</p><table class=''t''><tr><th>số ban đầu</th><th>thương</th><th>dư</th><th>ghép
      lại</th></tr><tr><td>7</td><td>3</td><td>1</td><td>3 × 2 + 1 = 7 ✓</td></tr><tr><td>−7</td><td>−3</td><td>−1</td><td>(−3)
      × 2 + (−1) = −7 ✓</td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đường kiểm khác là một luật luôn đúng với số nguyên. Thương nhân số chia,
      cộng số dư, phải ra lại số ban đầu. Với bảy, ba nhân hai cộng một là bảy. Với
      âm bảy, âm ba nhân hai cộng âm một là âm bảy, nên cả hai cặp thương và dư đều
      khớp.
  - show: <div class="code"><div><span class="kw">int</span> a = 7;</div><div><span
      class="kw">int</span> b = -7;</div><div>System.out.println((a / 2) * 2 + a %
      2);   <span class="cm">// phải ra lại 7</span></div><div>System.out.println((b
      / 2) * 2 + b % 2);   <span class="cm">// phải ra lại -7</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>7</div><div>-7</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Ta cũng nhờ Java tự ghép lại, và nó in ra đúng bảy và âm bảy. Nếu ai đó nghĩ
      âm bảy chia hai ra âm bốn thì ghép lại sẽ không khớp, nghĩa là luật này bắt
      được hiểu sai.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  checks:
  - 1234567 * (5 // 1000) == 0
  - 1234567 // 1000 * 5 == 6170
  - 1234567 * 5 // 1000 == 6172
  - Fraction(1234567 * 5, 1000) == Fraction(6172835, 1000)
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Đặt phép chia ở vế trái,
      phép kiểm ở vế phải.</div><div class="code"><div><span class="kw">boolean</span>
      moiNguoiTren = tong / soNguoi &gt; 50000 &amp;&amp; soNguoi != 0;</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div><span class="cm">Exception in thread
      "main" java.lang.ArithmeticException: / by zero</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất, của người mới, là đảo thứ tự hai vế. Máy tính vế trái trước,
      mà vế trái là phép chia cho số người bằng không. Chương trình dừng với lỗi chia
      cho không, phép kiểm ở vế phải không kịp chạy. Phép kiểm phải đứng trước phép
      chia.
  - show: <div class="box warn"><b>Lỗi 2 (người mới và cả người đã đi làm).</b> Ép
      kiểu sau khi đã chia nguyên.</div><div class="code"><div>System.out.println((<span
      class="kw">double</span>) (7 / 2));   <span class="cm">// chia nguyên xong mới
      ép</span></div><div>System.out.println((<span class="kw">double</span>) 7 /
      2);     <span class="cm">// ép trước rồi mới chia</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>3.0</div><div>3.5</div></div>
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai là ép kiểu quá muộn. Ở dòng đầu, phần trong ngoặc là bảy chia
      hai được tính trước, ra ba, phần lẻ đã mất. Ép ba thành số thực chỉ được ba
      phẩy không. Muốn giữ phần lẻ thì phải ép trước khi chia, như dòng thứ hai.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tính phí phần trăm
      bằng số nguyên theo sai thứ tự.</div><div class="code"><div><span class="kw">long</span>
      soTien = 1234567;                     <span class="cm">// số tiền chuyển (đồng)</span></div><div><span
      class="cm">// phí 0,5% (số minh hoạ) = soTien * 5 / 1000</span></div><div>System.out.println(soTien
      * (5 / 1000));   <span class="cm">// 5 / 1000 ra 0</span></div><div>System.out.println(soTien
      / 1000 * 5);     <span class="cm">// chia trước, mất phần lẻ</span></div><div>System.out.println(soTien
      * 5 / 1000);     <span class="cm">// nhân trước rồi mới chia</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>0</div><div>6170</div><div>6172</div></div>
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba là tính phí phần trăm bằng số nguyên, với mức phí minh hoạ không
      phẩy năm phần trăm. Dòng đầu tính năm chia một nghìn trước, ra không, nên phí
      bằng không. Dòng hai chia trước nên mất phần lẻ, thiếu hai đồng. Nhân trước
      rồi mới chia thì chỉ bỏ phần lẻ dưới một đồng.
  - show: '<p>Phí đúng là $1\,234\,567 \times 5 / 1000 = 6\,172.835$. Phần lẻ $0.835$
      đồng làm tròn thế nào là <b>quy định nghiệp vụ</b>,

      không phải thói quen của phép chia: khi cần, dùng kiểu số thập phân chính xác
      <code>BigDecimal</code> với cách làm tròn ghi rõ.</p>

      '
    clear: true
    say: Phí chính xác có phần lẻ tám trăm ba mươi lăm phần nghìn đồng. Làm tròn phần
      lẻ thế nào là quy định nghiệp vụ, không nên để phép chia tự quyết. Khi cần,
      ta dùng kiểu số thập phân chính xác đã gặp ở bài trước, kiểu lưu đúng từng chữ
      số thập phân thay vì lưu theo hệ hai, kèm cách làm tròn ghi rõ.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 17 // 5 == 3
  - 17 % 5 == 2
  - 17 / 5 == 3.4
  - (17 > 10 and 17 % 2 == 0) == False
  steps:
  - show: <p><b>Đoán ba dòng in ra</b></p><div class="code"><div><span class="kw">int</span>
      a = 17;</div><div><span class="kw">int</span> b = 5;</div><div>System.out.println(a
      / b + " " + a % b);</div><div>System.out.println((<span class="kw">double</span>)
      a / b);</div><div>System.out.println(a &gt; 10 &amp;&amp; a % 2 == 0);</div></div>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 20
    clear: true
    say: Bây giờ tới phần bạn tự làm. Biến a là mười bảy, biến b là năm. Dòng đầu
      in thương và số dư, cách nhau một dấu cách. Dòng hai ép a thành số thực rồi
      chia. Dòng ba hỏi a lớn hơn mười và a chẵn. Hãy dừng video, viết ra ba dòng
      in ra.
  - show: '<p>Dòng ①: <code>/</code> và <code>%</code> làm trước <code>+</code>, rồi
      nối chữ từ trái sang phải:</p>

      $$17 / 5 = \hl{3} \qquad 17 \,\%\, 5 = 17 - 3 \times 5 = \hl{2} \qquad 3 + \text{"
      "} + 2 \to \text{3 2}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Đáp án dòng một. Phép chia và chia lấy dư làm trước phép cộng, nên ta có
      thương ba và số dư hai. Sau đó nối chữ từ trái sang phải, ra ba, dấu cách, hai.
    clear: true
  - show: '<p>Dòng ②: ép trước rồi chia: $17.0 / 5 = \hl{3.4}$. Dòng ③: $17 > 10$
      đúng, nhưng $17 \,\%\, 2 = 1$ nên “a chẵn” sai, cả biểu thức <b>sai</b>.</p>'
    say: Dòng hai, ép kiểu làm trước nên là mười bảy phẩy không chia năm, ra ba phẩy
      bốn. Dòng ba, mười bảy lớn hơn mười là đúng, nhưng mười bảy chia hai dư một
      nên vế chẵn là sai, và phép và cho kết quả sai.
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>3 2</div><div>3.4</div><div>false</div></div>
    clear: true
    say: Chạy thật, ba dòng in ra là ba dấu cách hai, ba phẩy bốn, và giá trị sai.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>số nguyên / số nguyên: bỏ phần lẻ,
      về phía 0</span><span class=''a''>→</span><span class=''n''>% là phần dư, dấu
      theo số bị chia</span><span class=''a''>→</span><span class=''n''>muốn phần
      lẻ: ép trước khi chia</span><span class=''a''>→</span><span class=''n''>&& và
      || dừng sớm: kiểm trước, chia sau</span></div>'
    say: Tổng kết chuỗi logic. Số nguyên chia số nguyên thì bỏ phần lẻ, làm tròn về
      phía không. Phép chia lấy dư cho phần còn lại, mang dấu của số bị chia. Muốn
      giữ phần lẻ thì ép kiểu trước khi chia. Phép và, phép hoặc dừng sớm, nên đặt
      phép kiểm trước phép chia.
  - show: '<div class=''box key''><b>Tư duy:</b> với mỗi phép chia, hỏi ba câu: hai
      vế là kiểu gì, số chia có thể bằng 0 không,

      và phần lẻ bị bỏ đi thì <b>ai chịu</b>. Với tiền: nhân trước, chia sau, làm
      tròn theo quy định ghi rõ.</div>

      '
    say: Điều cần mang theo. Với mỗi phép chia, hãy hỏi ba câu. Hai vế là kiểu gì,
      số chia có thể bằng không không, và phần lẻ bị bỏ đi thì ai chịu. Với tiền,
      nhân trước, chia sau, và làm tròn theo quy định ghi rõ.
