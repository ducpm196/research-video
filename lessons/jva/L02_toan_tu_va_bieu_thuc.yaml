scenes:
- id: hook
  kind: hook
  title: Bảy chia hai, vì sao Java trả lời là ba?
  steps:
  - show: <div class="code"><div>System.out.println(7 / 2);      <span class="cm">//
      hai số nguyên</span></div><div>System.out.println(7.0 / 2);    <span class="cm">//
      có một số thực</span></div></div><p><b>Kết quả chạy</b></p><div class="code"><div>3</div><div>3.5</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Trên máy tính bỏ túi, bảy chia hai ra ba phẩy năm. Trong Java, dòng đầu in
      ra ba, còn dòng thứ hai lại in ra ba phẩy năm. Hai dòng chỉ khác nhau ở phần
      chấm không viết sau số bảy.
  - show: '<p>Với tiền, phần lẻ bị bỏ đi là <b>tiền thật</b> bị mất hoặc bị thừa.</p>

      <div class="box key">Hôm nay: các phép toán <code>+ - * / %</code>, ép kiểu,
      thứ tự tính, phép so sánh và phép logic, kể cả mẹo <b>ngắn mạch</b> để tránh
      chia cho 0.</div>

      '
    focus:
    - 1
    - 2
    say: Với tiền, phần lẻ bị bỏ đi là tiền thật bị mất hoặc bị thừa. Hôm nay ta học
      các phép toán, cách ép kiểu, thứ tự tính, phép so sánh và phép logic, kể cả
      mẹo ngắn mạch để tránh chia cho không.
- id: prereq
  kind: prereq
  title: Ôn lại biến và kiểu từ bài trước
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      biến</td><td>ngăn nhớ có tên, khai bằng kiểu + tên + giá trị</td></tr><tr><td>②
      kiểu</td><td><code>int</code>, <code>long</code>: số nguyên; <code>double</code>:
      số thực; <code>boolean</code>: đúng hoặc sai</td></tr><tr><td>③ gán <code>=</code></td><td>tính
      vế phải trước, rồi ghi đè vào ngăn bên trái</td></tr><tr><td>④ chia cho 0</td><td>số
      nguyên chia cho 0 là lỗi khi chạy, chương trình dừng</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại từ hai bài trước. Biến là ngăn nhớ có tên, khai bằng kiểu, tên
      và giá trị. Kiểu số nguyên chứa số nguyên, kiểu số thực chứa số có phần lẻ,
      kiểu đúng sai chỉ có đúng hoặc sai. Phép gán tính vế phải rồi ghi đè. Còn chia
      số nguyên cho không là lỗi khi chạy.
- id: sym
  kind: symbol
  title: Giải mã các phép toán
  steps:
  - show: '<p><b>Toán tử</b>: ký hiệu của một phép tính, như <code>+</code> hay <code>%</code>.
      <b>Biểu thức</b>: cụm gồm số, biến và toán tử mà máy tính ra <b>một</b> giá
      trị, như <code>soDu + 50000</code>.</p><table class=''t''><tr><th>viết</th><th>đọc
      là</th><th>ghi chú</th></tr><tr><td><code>+ - *</code></td><td>cộng, trừ, nhân</td><td>như
      toán</td></tr><tr><td><code>/</code></td><td>chia</td><td>hai số nguyên thì
      <b>bỏ phần lẻ</b></td></tr><tr><td><code>%</code></td><td>chia lấy dư</td><td>phần
      còn lại sau phép chia nguyên</td></tr><tr><td><code>(double) x</code></td><td>ép
      kiểu</td><td>đổi x thành số thực trước khi tính tiếp</td></tr><tr><td><code>x
      += 5</code></td><td>cộng dồn</td><td>viết gọn của <code>x = x + 5</code>; có
      cả <code>-=</code>, <code>*=</code></td></tr><tr><td><code>x++</code>, <code>x--</code></td><td>tăng
      một, giảm một</td><td>viết gọn của <code>x = x + 1</code> và <code>x = x - 1</code></td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    - - '2.2'
      - '2.3'
    - '2.4'
    - '2.5'
    - - '2.6'
      - '2.7'
    clear: true
    say: Trước hết là hai từ trong tên bài. Toán tử là ký hiệu của một phép tính,
      còn biểu thức là một cụm gồm số, biến và toán tử mà máy tính ra một giá trị.
      Bảng thứ nhất là các phép tính. Cộng, trừ, nhân giống toán, còn chia hai số
      nguyên thì bỏ phần lẻ. Dấu phần trăm là phép chia lấy dư. Tên kiểu trong ngoặc
      đặt trước một số là ép kiểu, đổi số đó sang kiểu ghi trong ngoặc, ở đây là số
      thực. Cộng bằng là viết gọn của cộng dồn, hai dấu cộng liền nhau là tăng thêm
      một, hai dấu trừ liền nhau là giảm đi một.
  - show: <table class='t'><tr><th>viết</th><th>đọc là</th><th>kết quả</th></tr><tr><td><code>==</code>  <code>!=</code></td><td>bằng,
      khác</td><td>đúng hoặc sai</td></tr><tr><td><code>&lt;</code>  <code>&lt;=</code>  <code>&gt;</code>  <code>&gt;=</code></td><td>nhỏ
      hơn, nhỏ hơn hoặc bằng, lớn hơn, lớn hơn hoặc bằng</td><td>đúng hoặc sai</td></tr><tr><td><code>a
      &amp;&amp; b</code></td><td>a <b>và</b> b</td><td>đúng khi cả hai đúng</td></tr><tr><td><code>a
      || b</code></td><td>a <b>hoặc</b> b</td><td>đúng khi ít nhất một vế đúng</td></tr><tr><td><code>!a</code></td><td><b>không
      phải</b> a</td><td>đảo đúng thành sai và ngược lại</td></tr></table>
    focus:
    - - '1.2'
      - '1.3'
    - '1.2'
    - '1.4'
    - '1.5'
    - '1.6'
    clear: true
    say: Bảng thứ hai là phép so sánh và phép logic, kết quả luôn là đúng hoặc sai.
      Hai dấu bằng liền nhau là so sánh bằng, còn một dấu bằng là phép gán. Hai dấu
      và là phép và, đúng khi cả hai vế đúng. Hai vạch đứng là phép hoặc, đúng khi
      ít nhất một vế đúng. Dấu chấm than đảo đúng thành sai.
  - show: '<div class="code"><div><span class="kw">long</span> soDu = 100000;</div><div>soDu
      += 50000;                  <span class="cm">// như soDu = soDu + 50000</span></div><div>soDu
      -= 20000;                  <span class="cm">// như soDu = soDu - 20000</span></div><div><span
      class="kw">int</span> soLenh = 0;</div><div>soLenh++;                       <span
      class="cm">// tăng thêm 1</span></div><div>soLenh++;</div><div>System.out.println(soDu
      + " dong, " + soLenh + " lenh");</div><div>System.out.println(soDu &gt;= 100000);   <span
      class="cm">// so sánh: ra đúng hoặc sai</span></div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>130000 dong, 2 lenh</div><div>true</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Chương trình này dùng thử. Số dư một trăm nghìn, cộng dồn năm mươi nghìn,
      trừ bớt hai mươi nghìn, còn một trăm ba mươi nghìn. Số lệnh tăng một hai lần
      thành hai. Dòng cuối so sánh số dư với một trăm nghìn, kết quả là giá trị đúng.
- id: intuition
  kind: intuition
  title: 'Hình dung: chia kẹo, thứ tự tính và cửa ngắn mạch'
