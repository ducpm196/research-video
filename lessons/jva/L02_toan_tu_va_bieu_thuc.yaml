      x="540" y="280" font-size="26" text-anchor="middle" fill="#2a78d6" font-weight="bold">7
      / 2 = 3  (mỗi người được 3: thương)</text><text x="1230" y="280" font-size="26"
      text-anchor="middle" fill="#d97706" font-weight="bold">7 % 2 = 1  (số dư)</text><text
      x="750" y="335" font-size="24" text-anchor="middle" fill="#1f2937">kiểm lại:
      3 × 2 + 1 = 7</text></svg></div>'
    clear: true
    say: Hãy hình dung bảy viên kẹo chia đều cho hai người. Mỗi người được ba viên,
      đó là phép chia nguyên. Còn thừa một viên không chia được, đó là phép chia lấy
      dư. Ba nhân hai cộng một lại ra đúng bảy.
  - show: '<div class="code"><div>System.out.println(2 + 3 * 4);      <span class="cm">//
      nhân trước, cộng sau</span></div><div>System.out.println((2 + 3) * 4);    <span
      class="cm">// ngoặc trước</span></div><div>System.out.println(20 - 5 - 3);     <span
      class="cm">// cùng mức: từ trái sang phải</span></div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>14</div><div>20</div><div>12</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Thứ tự tính giống toán. Nhân, chia và chia lấy dư làm trước cộng trừ, nên
      hai cộng ba nhân bốn là mười bốn. Phần trong ngoặc luôn được làm trước, nên
      dòng hai cho kết quả là hai mươi. Các phép cùng mức thì làm từ trái sang phải,
      nên hai mươi trừ năm trừ ba là mười hai.
  - show: '<div><svg width="1500" height="300" viewBox="0 0 1500 300" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="40" y="90" width="360" height="120" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="220.0" y="142" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">vế trái</text><text x="220.0" y="174" font-size="24"
      text-anchor="middle" fill="#1f2937">soNguoi != 0</text><line x1="405" y1="150"
      x2="560" y2="150" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="482" y="140" font-size="22" text-anchor="middle" fill="#dc2626">sai</text><rect
      x="570" y="90" width="380" height="120" rx="10" fill="#fee2e2" stroke="#dc2626"
      stroke-width="3"/><text x="760.0" y="142" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">dừng: cả biểu thức</text><text x="760.0" y="174"
      font-size="24" text-anchor="middle" fill="#1f2937">là SAI</text><line x1="220"
      y1="215" x2="220" y2="270" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="240" y="262" font-size="22" text-anchor="start" fill="#16a34a" font-weight="bold">đúng
      → mới tính vế phải</text><rect x="1010" y="90" width="450" height="120" rx="10"
      fill="#e5e7eb" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6"/><text
      x="1235.0" y="142" font-size="24" text-anchor="middle" fill="#1f2937">vế phải</text><text
      x="1235.0" y="174" font-size="24" text-anchor="middle" fill="#1f2937">tong /
      soNguoi > 50000</text><text x="1235" y="60" font-size="22" text-anchor="middle"
      fill="#6b7280">không bao giờ được tính khi vế trái sai</text></svg></div>'
    clear: true
    say: Phép và có một tính chất quan trọng tên là ngắn mạch. Máy luôn tính giá trị
      của vế trái trước tiên. Nếu vế trái sai thì cả biểu thức chắc chắn sai, nên
      máy dừng luôn, không tính vế phải. Phép hoặc cũng vậy, vế trái đúng thì dừng.
  - show: <div class="code"><div><span class="kw">long</span> tong = 300000;</div><div><span
      class="kw">int</span> soNguoi = 0;</div><div><span class="cm">// vế trái sai
      thì &amp;&amp; dừng luôn, không tính vế phải, nên không chia cho 0</span></div><div><span
      class="kw">boolean</span> moiNguoiTren = soNguoi != 0 &amp;&amp; tong / soNguoi
      &gt; 50000;</div><div>System.out.println(moiNguoiTren);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>false</div></div>
