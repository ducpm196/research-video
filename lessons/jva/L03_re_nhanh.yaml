scenes:
- id: hook
  kind: hook
  title: Chuyển đúng mười triệu, phí tính sai bậc
  steps:
  - show: <p><b>Biểu phí chuyển khoản</b> (số minh hoạ, không phải biểu phí của ngân
      hàng nào):</p><table class='t'><tr><th>số tiền chuyển</th><th>phí (số minh hoạ)</th></tr><tr><td>dưới
      500 000 đồng</td><td>0 đồng</td></tr><tr><td>từ 500 000 đến dưới 10 000 000
      đồng</td><td>2 200 đồng</td></tr><tr><td>từ 10 000 000 đồng trở lên</td><td>5
      500 đồng</td></tr></table>
    focus:
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    say: Đây là một biểu phí chuyển khoản ba bậc, số liệu chỉ để minh hoạ. Dưới năm
      trăm nghìn thì miễn phí. Từ năm trăm nghìn đến dưới mười triệu thì phí hai nghìn
      hai trăm đồng. Từ mười triệu trở lên thì phí năm nghìn năm trăm đồng.
  - show: '<p><b>Một chương trình tính phí cho đúng 10 000 000 đồng in ra</b></p><div
      class="code"><div>10000000 -&gt; phi 2200</div></div><div class="box key">Hôm
      nay: dạy máy <b>chọn</b> việc để làm theo điều kiện, và kiểm thử ở đúng <b>biên</b>
      của mỗi bậc.</div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Một chương trình tính phí cho đúng mười triệu đồng lại ra hai nghìn hai trăm,
      tức là bậc giữa. Lỗi nằm ở dấu so sánh đặt tại biên của bậc phí. Hôm nay ta
      học cách dạy máy chọn việc để làm theo điều kiện, và cách kiểm thử ở đúng biên
      của mỗi bậc.
- id: prereq
  kind: prereq
  title: Ôn lại phép so sánh và phép logic từ bài trước
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      so sánh</td><td><code>&lt;</code> <code>&lt;=</code> <code>&gt;</code> <code>&gt;=</code>
      <code>==</code> <code>!=</code> cho kết quả đúng hoặc sai</td></tr><tr><td>②
      <code>&amp;&amp;</code>, <code>||</code></td><td>và, hoặc; dừng sớm khi đã biết
      kết quả</td></tr><tr><td>③ kiểu đúng sai</td><td><code>boolean</code>: biến
      chỉ giữ đúng hoặc sai</td></tr><tr><td>④ chương trình</td><td>đến giờ mọi lệnh
      đều chạy, lần lượt từ trên xuống</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Ta ôn lại từ bài trước. Phép so sánh như nhỏ hơn, lớn hơn hoặc bằng, cho
      kết quả đúng hoặc sai. Phép và, phép hoặc ghép các điều kiện, và dừng sớm khi
      đã biết kết quả. Kiểu đúng sai giữ đúng một trong hai giá trị đó. Và đến giờ,
      mọi lệnh đều chạy lần lượt từ trên xuống. Hôm nay ta cho máy bỏ qua một số lệnh.
- id: sym
  kind: symbol
  title: Giải mã lệnh rẽ nhánh
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>if
      (đk) { … }</code></td><td><b>nếu</b> điều kiện đúng thì làm khối trong ngoặc
      nhọn</td></tr><tr><td><code>else if (đk2) { … }</code></td><td><b>nếu không,
      mà</b> điều kiện hai đúng thì làm khối này</td></tr><tr><td><code>else { … }</code></td><td><b>nếu
      không</b> (mọi điều kiện trên đều sai) thì làm khối này</td></tr><tr><td><code>switch
      (x) { case A -&gt; …; default -&gt; …; }</code></td><td><b>chọn theo trường
      hợp</b>: x bằng A thì làm việc sau mũi tên; <code>default</code>: không trường
      hợp nào khớp thì làm việc này</td></tr><tr><td><code>đk ? a : b</code></td><td><b>ba
      ngôi</b> (ba phần: điều kiện, a, b): điều kiện đúng thì lấy a, sai thì lấy b</td></tr></table><span
      class=''note''>đk = điều kiện: một biểu thức cho kết quả đúng hoặc sai.</span>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: 'Bảng này là năm cách viết của hôm nay. Lệnh rẽ nhánh nếu: điều kiện trong
      ngoặc tròn đúng thì làm khối trong ngoặc nhọn. Nhánh nếu không, mà, thêm một
      điều kiện nữa. Nhánh nếu không cuối cùng nhận mọi trường hợp còn lại. Lệnh chọn
      theo trường hợp so một giá trị với từng trường hợp, và nhánh mặc định nhận mọi
      giá trị không khớp trường hợp nào. Toán tử ba ngôi, gọi vậy vì có ba phần là
      điều kiện và hai giá trị, chọn một trong hai giá trị đó.'
  - show: '<div class="code"><div><span class="kw">long</span> soDu = 300000;</div><div><span
      class="kw">long</span> soTien = 500000;</div><div><span class="kw">if</span>
      (soTien &lt;= soDu) {            <span class="cm">// điều kiện: đúng hoặc sai</span></div><div>    soDu
      -= soTien;</div><div>    System.out.println("Da rut, con " + soDu);</div><div>}
      <span class="kw">else</span> {                         <span class="cm">// điều
      kiện sai thì làm khối này</span></div><div>    System.out.println("Khong du
      tien");</div><div>}</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Khong
      du tien</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ví dụ rút tiền. Số dư ba trăm nghìn, muốn rút năm trăm nghìn. Điều kiện số
      tiền nhỏ hơn hoặc bằng số dư là sai, nên máy bỏ qua khối đầu và làm khối nếu
      không, in ra không đủ tiền. Chỉ một trong hai khối được chạy.
  - show: <div class="code"><div>String kenh = "APP";</div><div><span class="kw">switch</span>
      (kenh) {</div><div>    <span class="kw">case</span> "ATM" -&gt; System.out.println("Rut
      tien mat");</div><div>    <span class="kw">case</span> "APP", "WEB" -&gt; System.out.println("Chuyen
      khoan online");</div><div>    <span class="kw">default</span> -&gt; System.out.println("Kenh
      khac");</div><div>}</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Chuyen
      khoan online</div></div>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lệnh chọn theo trường hợp, dạng mũi tên, có từ Java mười bốn. Kênh là ứng
      dụng, trùng trường hợp thứ hai, nên in chuyển khoản trực tuyến. Một trường hợp
      có thể gom nhiều giá trị, cách nhau dấu phẩy. Dạng mũi tên chỉ chạy đúng một
      trường hợp rồi thoát.
  - show: '<div class="code"><div><span class="kw">boolean</span> laVip = <span class="kw">true</span>;</div><div><span
      class="kw">long</span> phi = laVip ? 0 : 2200;     <span class="cm">// khách
      VIP được miễn phí (số minh hoạ)</span></div><div>System.out.println("Phi: "
      + phi);</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Phi: 0</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Toán tử ba ngôi gọn hơn khi chỉ cần chọn một giá trị. Khách là khách ưu tiên,
      điều kiện đúng, nên phí lấy giá trị đứng trước dấu hai chấm, là không.
