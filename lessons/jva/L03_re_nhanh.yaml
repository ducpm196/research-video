- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ câu chữ của biểu phí tới điều kiện'
  checks:
  - (500000 < 500000) == False
  - (10000000 > 10000000) == False and 10000000 >= 10**7
  - 499999 < 500000
  - all((x < 500000) + (500000 <= x < 10000000) + (x >= 10000000) == 1 for x in [0,
    499999, 500000, 9999999, 10000000, 10**12])
  steps:
  - show: '<p><b>Bước 1.</b> Đổi từng chữ của quy định thành một dấu so sánh:</p><table
      class=''t''><tr><th>câu chữ</th><th>dấu</th><th>biên có thuộc bậc không</th></tr><tr><td>“dưới
      500 000”</td><td><code>soTien &lt; 500000</code></td><td>không: 500 000 thuộc
      bậc sau</td></tr><tr><td>“từ 10 000 000 trở lên”</td><td><code>soTien &gt;=
      10000000</code></td><td>có: 10 000 000 thuộc bậc này</td></tr></table>'
    focus:
    - 1
    - '2.2'
    - '2.3'
    say: Bước một, đổi chữ thành dấu. Chữ dưới năm trăm nghìn nghĩa là nhỏ hơn hẳn,
      nên đúng năm trăm nghìn không thuộc bậc một. Chữ từ mười triệu trở lên nghĩa
      là lớn hơn hoặc bằng, nên đúng mười triệu thuộc bậc ba.
  - show: '<p><b>Bước 2.</b> Bậc giữa có hai đầu, nên là <b>điều kiện ghép</b> bằng
      phép và:</p>

      $$500\,000 \le \text{soTien} \;\text{ và }\; \text{soTien} < 10\,000\,000$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, bậc giữa có hai đầu. Số tiền phải lớn hơn hoặc bằng năm trăm nghìn,
      và đồng thời nhỏ hơn mười triệu. Vì cần cả hai cùng đúng nên ta ghép bằng phép
      và của bài trước.
  - show: '<p><b>Bước 3.</b> Trong chuỗi <code>if … else if</code>, tới được nhánh
      hai nghĩa là điều kiện một đã <b>sai</b>, tức là đã biết soTien ≥ 500 000. Nên
      chỉ cần viết nửa còn lại:</p><div class="code"><div><span class="kw">if</span>
      (soTien &lt; 500000) {           <span class="cm">// bậc 1: dưới 500 nghìn</span></div><div>    phi
      = 0;</div><div>} <span class="kw">else</span> <span class="kw">if</span> (soTien
      &lt; 10000000) {  <span class="cm">// bậc 2: từ 500 nghìn tới dưới 10 triệu</span></div><div>    phi
      = 2200;</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước ba, rút gọn nhờ thứ tự. Máy chỉ tới nhánh hai khi điều kiện một đã sai,
      nghĩa là số tiền đã lớn hơn hoặc bằng năm trăm nghìn. Vì vậy nhánh hai chỉ cần
      viết nửa còn lại, nhỏ hơn mười triệu.
  - show: '<p><b>Bước 4.</b> Nhánh <code>else</code> nhận mọi số còn lại, tức là soTien
      ≥ 10 000 000, đúng bậc ba. Ba nhánh phủ <b>mọi</b> số tiền, không chồng lên
      nhau.</p><div class="code"><div>} <span class="kw">else</span> {                         <span
      class="cm">// bậc 3: từ 10 triệu trở lên</span></div><div>    phi = 5500;</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước bốn, nhánh nếu không cuối cùng nhận mọi số còn lại. Hai điều kiện trên
      đều sai nghĩa là số tiền từ mười triệu trở lên, đúng bậc ba. Như vậy ba nhánh
      phủ mọi số tiền, và không có số nào rơi vào hai bậc.
- id: example
  kind: example
  title: 'Ví dụ: thử ba số tiền nằm đúng ở biên'
  checks:
  - 499999 < 500000
  - (500000 < 500000) == False
  - 500000 < 10000000
  - (10**7 < 500000) == False
  - (10**7 < 10**7) == False
  steps:
  - show: '<p><b>Tệp Phi.java (dòng đầu đổi số tiền để thử)</b></p><div class="code"><div><span
      class="kw">long</span> soTien = 500000;                 <span class="cm">//
      số tiền chuyển (đồng)</span></div><div><span class="kw">long</span> phi;</div><div><span
      class="kw">if</span> (soTien &lt; 500000) {           <span class="cm">// bậc
      1: dưới 500 nghìn</span></div><div>    phi = 0;</div><div>} <span class="kw">else</span>
      <span class="kw">if</span> (soTien &lt; 10000000) {  <span class="cm">// bậc
      2: từ 500 nghìn tới dưới 10 triệu</span></div><div>    phi = 2200;</div><div>}
      <span class="kw">else</span> {                         <span class="cm">// bậc
      3: từ 10 triệu trở lên</span></div><div>    phi = 5500;</div><div>}</div><div>System.out.println(soTien
      + " -&gt; phi " + phi);</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Đây là chương trình tính phí đầy đủ. Ta thử ba số tiền nằm đúng ở biên, bằng
      cách đổi số ở dòng đầu rồi chạy lại. Có năm phép so sánh, ta đi từng phép.
  - show: <p><b>Thử 499 999 đồng.</b></p>$$① \; 499\,999 < 500\,000 \;\to\; \text{đúng}
      \;\to\; \hl{\text{phí } 0}$$<p><b>Kết quả chạy</b></p><div class="code"><div>499999
      -&gt; phi 0</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Thử bốn trăm chín mươi chín nghìn chín trăm chín mươi chín đồng. Phép so
      sánh thứ nhất, số này nhỏ hơn năm trăm nghìn, đúng. Máy làm khối bậc một, phí
      bằng không, và bỏ qua mọi nhánh sau.
  - show: <p><b>Thử 500 000 đồng.</b></p>$$② \; 500\,000 < 500\,000 \;\to\; \text{sai}
      \qquad ③ \; 500\,000 < 10\,000\,000 \;\to\; \text{đúng} \;\to\; \hl{\text{phí
      } 2\,200}$$<p><b>Kết quả chạy</b></p><div class="code"><div>500000 -&gt; phi
      2200</div></div>
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Thử đúng năm trăm nghìn. Phép so sánh thứ hai, năm trăm nghìn nhỏ hơn năm
      trăm nghìn là sai, vì hai số bằng nhau. Vì vậy máy chưa dừng mà đi tiếp xuống
      dưới. Phép so sánh thứ ba, năm trăm nghìn nhỏ hơn mười triệu là đúng, nên phí
      là hai nghìn hai trăm.
  - show: <p><b>Thử 10 000 000 đồng.</b></p>$$④ \; 10^{7} < 500\,000 \;\to\; \text{sai}
      \qquad ⑤ \; 10^{7} < 10^{7} \;\to\; \text{sai} \;\to\; \texttt{else} \;\to\;
      \hl{\text{phí } 5\,500}$$<p><b>Kết quả chạy</b></p><div class="code"><div>10000000
      -&gt; phi 5500</div></div>
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Thử đúng mười triệu. Phép so sánh thứ tư, mười triệu nhỏ hơn năm trăm nghìn
      là sai. Phép so sánh thứ năm, mười triệu nhỏ hơn mười triệu cũng sai. Hai điều
      kiện đều sai nên máy làm nhánh nếu không cuối cùng, phí năm nghìn năm trăm.
  - show: <table class='t'><tr><th>số tiền</th><th>bậc theo biểu phí</th><th>chương
      trình in</th></tr><tr><td>499 999</td><td>dưới 500 000 → 0</td><td>0 ✓</td></tr><tr><td>500
      000</td><td>từ 500 000 → 2 200</td><td>2 200 ✓</td></tr><tr><td>10 000 000</td><td>từ
      10 000 000 → 5 500</td><td>5 500 ✓</td></tr></table>
    clear: true
    say: Đặt cạnh biểu phí, cả ba số ở biên đều ra đúng bậc. Đây là lý do ta thử ở
      biên, vì lỗi dấu hay nằm đúng ở đó.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: ba điều kiện độc lập, đúng một cái đúng'
  checks:
  - '[x < 500000 for x in (499999, 500000, 10**7)] == [True, False, False]'
  - '[500000 <= x < 10**7 for x in (499999, 500000, 10**7)] == [False, True, False]'
  - '[x >= 10**7 for x in (499999, 500000, 10**7)] == [False, False, True]'
  steps:
  - show: <div class="code"><div><span class="kw">long</span> soTien = 500000;</div><div>System.out.println(soTien
      &lt; 500000);                         <span class="cm">// bậc 1?</span></div><div>System.out.println(soTien
      &gt;= 500000 &amp;&amp; soTien &lt; 10000000);   <span class="cm">// bậc 2?</span></div><div>System.out.println(soTien
      &gt;= 10000000);                      <span class="cm">// bậc 3?</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>false</div><div>true</div><div>false</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đường kiểm khác không dựa vào thứ tự nhánh. Ta viết đủ điều kiện của từng
      bậc, mỗi bậc một phép so sánh riêng, theo đúng câu chữ của biểu phí. Với năm
      trăm nghìn, chỉ điều kiện bậc hai đúng, nên kết quả khớp với chương trình chính.
  - show: '<table class=''t''><tr><th>số tiền</th><th>bậc 1: &lt; 500 000</th><th>bậc
      2: ≥ 500 000 và &lt; 10 000 000</th><th>bậc 3: ≥ 10 000 000</th></tr><tr><td>499
      999</td><td><b>đúng</b></td><td>sai</td><td>sai</td></tr><tr><td>500 000</td><td>sai</td><td><b>đúng</b></td><td>sai</td></tr><tr><td>10
      000 000</td><td>sai</td><td>sai</td><td><b>đúng</b></td></tr></table>'
    clear: true
    say: Làm tương tự cho cả ba số, mỗi hàng có đúng một ô đúng, và ô đó trùng với
      bậc chương trình đã chọn. Nếu một hàng có hai ô đúng hoặc không ô nào đúng,
      nghĩa là quy định hoặc mã có lỗ hổng ở biên.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Viết một dấu bằng trong
      điều kiện.</div><div class="code"><div><span class="kw">if</span> (soLan = 5)
      {                 <span class="cm">// định so sánh, lại viết phép gán</span></div></div><p><b>Trình
      biên dịch báo</b></p><div class="code"><div><span class="cm">error: incompatible
      types: int cannot be converted to boolean</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất, của người mới, là viết một dấu bằng trong điều kiện. Một dấu
      bằng là phép gán, kết quả là một số nguyên, không phải đúng sai. Trình biên
      dịch báo không đổi được số nguyên thành kiểu đúng sai. Muốn so sánh phải viết
      hai dấu bằng.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Bỏ ngoặc nhọn rồi thêm
      lệnh thứ hai.</div><div class="code"><div><span class="kw">long</span> soDu
      = 100000;</div><div><span class="kw">long</span> soTien = 500000;</div><div><span
      class="kw">if</span> (soTien &lt;= soDu)</div><div>    System.out.println("Dong
      y rut");</div><div>    soDu = soDu - soTien;        <span class="cm">// thụt
      lề nhưng KHÔNG thuộc nhánh nếu</span></div><div>System.out.println("So du: "
      + soDu);</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>So du:
      -400000</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai là bỏ ngoặc nhọn. Không có ngoặc nhọn thì nhánh nếu chỉ gồm đúng
      một lệnh ngay sau nó. Lệnh trừ tiền thụt lề trông như nằm trong nhánh, nhưng
      thật ra luôn chạy. Kết quả là từ chối rút mà số dư vẫn bị trừ thành âm. Thói
      quen tốt là luôn viết ngoặc nhọn, kể cả khi chỉ có một lệnh.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Dùng <code>&gt;</code>
      khi quy định ghi “từ … trở lên”.</div><div class="code"><div><span class="kw">long</span>
      soTien = 10000000;</div><div><span class="kw">long</span> phi;</div><div><span
      class="kw">if</span> (soTien &gt; 10000000) {         <span class="cm">// quy
      định ghi "từ 10 triệu": phải là &gt;=</span></div><div>    phi = 5500;</div><div>}
      <span class="kw">else</span> <span class="kw">if</span> (soTien &gt; 500000)
      {</div><div>    phi = 2200;</div><div>} <span class="kw">else</span> {</div><div>    phi
      = 0;</div><div>}</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>10000000
      -&gt; phi 2200</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba hay gặp ở người đã đi làm, là chọn sai dấu ở biên. Biểu phí ghi
      từ mười triệu trở lên, nhưng mã viết lớn hơn hẳn. Đúng mười triệu bị tính phí
      bậc hai. Nhánh thứ hai cũng sai biên, đúng năm trăm nghìn ra miễn phí. Thử với
      số ở giữa khoảng thì không thấy lỗi, nên luôn thử đúng các số ở biên.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 85 >= 50
  - 85 >= 80
  - ('Bac' if 85 >= 50 else 'Vang' if 85 >= 80 else 'Thuong') == 'Bac'
  steps:
  - show: '<p><b>Đoán hai dòng in ra</b></p><div class="code"><div><span class="kw">int</span>
      diem = 85;                   <span class="cm">// điểm tín dụng (số minh hoạ)</span></div><div>String
      hang;</div><div><span class="kw">if</span> (diem &gt;= 50) {</div><div>    hang
      = "Bac";</div><div>} <span class="kw">else</span> <span class="kw">if</span>
      (diem &gt;= 80) {</div><div>    hang = "Vang";</div><div>} <span class="kw">else</span>
      {</div><div>    hang = "Thuong";</div><div>}</div><div>System.out.println(hang);</div><div>System.out.println(diem
      &gt;= 80 ? "Uu tien" : "Binh thuong");</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    pause: 20
    clear: true
    say: Bây giờ tới phần bạn tự làm. Điểm tín dụng là tám mươi lăm, đây là số minh
      hoạ. Chuỗi rẽ nhánh xếp hạng bạc, vàng hoặc thường. Dòng in cuối dùng toán tử
      ba ngôi. Hãy dừng video, viết ra hai dòng in ra, và tìm chỗ sai của chuỗi rẽ
      nhánh.
  - show: '<p>Xét từ trên xuống: $85 \ge 50$ <b>đúng</b> ngay ở nhánh đầu, nên <code>hang</code>
      là Bac và máy <b>không xét tiếp</b> nhánh $85 \ge 80$.</p>

      <p>Dòng cuối: $85 \ge 80$ đúng nên lấy giá trị trước dấu hai chấm.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án như sau. Máy xét từ trên xuống, tám mươi lăm lớn hơn hoặc bằng năm
      mươi là đúng ngay ở nhánh đầu, nên hạng là bạc. Nhánh hạng vàng không bao giờ
      được xét, dù điều kiện của nó cũng đúng. Dòng cuối, tám mươi lăm lớn hơn hoặc
      bằng tám mươi là đúng, nên in ưu tiên.
    clear: true
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Bac</div><div>Uu tien</div></div><div
      class="box key">Sửa: xếp điều kiện <b>chặt nhất lên trước</b>: <code>diem &gt;=
      80</code> rồi mới tới <code>diem &gt;= 50</code>.</div>'
    focus:
    - 2
    - 3
    clear: true
    say: Chạy thật, hai dòng in ra là bạc và ưu tiên. Cách sửa là đặt điều kiện chặt
      nhất lên trước, xét lớn hơn hoặc bằng tám mươi rồi mới tới năm mươi.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>điều kiện cho đúng hoặc sai</span><span
      class='a'>→</span><span class='n'>xét từ trên xuống</span><span class='a'>→</span><span
      class='n'>nhánh đúng đầu tiên chạy, rồi thoát</span><span class='a'>→</span><span
      class='n'>nếu không cuối cùng nhận phần còn lại</span><span class='a'>→</span><span
      class='n'>thử đúng ở biên</span></div>
    say: Tổng kết chuỗi logic. Mỗi điều kiện cho đúng hoặc sai. Máy xét từ trên xuống,
      nhánh đúng đầu tiên được chạy rồi thoát cả chuỗi. Nhánh nếu không cuối cùng
      nhận mọi trường hợp còn lại. Và luôn thử với các số nằm đúng ở biên.
  - show: '<div class=''box key''><b>Tư duy:</b> mỗi chữ “dưới”, “từ”, “trên”, “không
      quá” trong quy định là một dấu so sánh;

      viết ra từng biên và thử đúng số ở biên. Luôn viết ngoặc nhọn.</div>

      '
    say: Điều cần mang theo. Mỗi chữ dưới, từ, trên, không quá trong quy định là một
      dấu so sánh. Hãy viết ra từng biên, thử đúng số ở biên, và luôn viết ngoặc nhọn.
