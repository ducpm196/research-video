    clear: true
    say: Bây giờ tới phần bạn tự làm. Điểm tín dụng là tám mươi lăm, đây là số minh
      hoạ. Chuỗi rẽ nhánh xếp hạng bạc, vàng hoặc thường. Dòng in cuối dùng toán tử
      ba ngôi. Hãy dừng video, viết ra hai dòng in ra, và tìm chỗ sai của chuỗi rẽ
      nhánh.
  - show: '<p>Xét từ trên xuống: $85 \ge 50$ <b>đúng</b> ngay ở nhánh đầu, nên <code>hang</code>
      là Bac và máy <b>không xét tiếp</b> nhánh $85 \ge 80$.</p>

      <p>Dòng cuối: $85 \ge 80$ đúng nên lấy giá trị trước dấu hai chấm.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án như sau. Máy xét từ trên xuống, tám mươi lăm lớn hơn hoặc bằng năm
      mươi là đúng ngay ở nhánh đầu, nên hạng là bạc. Nhánh hạng vàng không bao giờ
      được xét, dù điều kiện của nó cũng đúng. Dòng cuối, tám mươi lăm lớn hơn hoặc
      bằng tám mươi là đúng, nên in ưu tiên.
    clear: true
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Bac</div><div>Uu tien</div></div><div
      class="box key">Sửa: xếp điều kiện <b>chặt nhất lên trước</b>: <code>diem &gt;=
      80</code> rồi mới tới <code>diem &gt;= 50</code>.</div>'
    focus:
    - 2
    - 3
    clear: true
    say: Chạy thật, hai dòng in ra là bạc và ưu tiên. Cách sửa là đặt điều kiện chặt
      nhất lên trước, xét lớn hơn hoặc bằng tám mươi rồi mới tới năm mươi.
- id: practice
  kind: practice
  title: 'Tự làm: lãi theo bậc tiền gửi'
  steps:
  - show: '<p><b>Đề</b>: viết <code>BacLai.java</code> (số minh hoạ).</p>

      <ol><li><code>soTien</code> lấy từ <code>args[0]</code> nếu có, không thì mặc
      định 10 000 000</li>

      <li>Lãi suất (phần nghìn mỗi tháng): dưới 10 000 000 là 3; từ 10 000 000 tới
      dưới 100 000 000 là 4; từ 100 000 000 trở lên là 5</li>

      <li>In <code>… -&gt; suat …, lai thang: …</code> (lãi = <code>soTien * suat
      / 1000</code>)</li>

      <li>Chạy thử đúng ba số ở biên: 9 999 999, 10 000 000, 100 000 000</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 60
    say: Bây giờ tới phần bạn tự làm trên máy. Viết chương trình tính lãi tháng theo
      ba bậc tiền gửi. Số tiền lấy từ chữ gõ thêm nếu có, không thì mặc định mười
      triệu. Dưới mười triệu thì lãi suất ba phần nghìn, từ mười triệu tới dưới một
      trăm triệu thì bốn phần nghìn, từ một trăm triệu trở lên thì năm phần nghìn.
      In số tiền, lãi suất và lãi tháng. Sau đó chạy thử đúng ba số nằm ở biên. Hãy
      dừng video và tự viết, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>10000000 -&gt; suat
      4, lai thang: 40000</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh JVA L03 BacLai.java</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> nhánh đầu <code>soTien &lt; 10000000</code>,
      nhánh hai <code>soTien &lt; 100000000</code>, còn lại là nhánh cuối; thử <code>java
      BacLai 9999999</code> phải ra suất 3, <code>java BacLai 100000000</code> phải
      ra suất 5.

      Lời giải nằm ở <code>labs/JVA/L03/loi_giai.java</code> — chỉ mở sau khi bạn
      đã thử.</div>

      '
    say: Nếu kẹt, nhánh đầu so với mười triệu, nhánh hai so với một trăm triệu, và
      nhánh cuối nhận phần còn lại. Số chín triệu chín trăm chín mươi chín nghìn chín
      trăm chín mươi chín phải ra suất ba, còn đúng một trăm triệu phải ra suất năm.
      Lời giải nằm trong thư mục thực hành của bài, chỉ mở sau khi bạn đã tự thử.
  lab: labs/JVA/L03
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>điều kiện cho đúng hoặc sai</span><span
      class='a'>→</span><span class='n'>xét từ trên xuống</span><span class='a'>→</span><span
      class='n'>nhánh đúng đầu tiên chạy, rồi thoát</span><span class='a'>→</span><span
      class='n'>nếu không cuối cùng nhận phần còn lại</span><span class='a'>→</span><span
      class='n'>thử đúng ở biên</span></div>
    say: Tổng kết chuỗi logic. Mỗi điều kiện cho đúng hoặc sai. Máy xét từ trên xuống,
      nhánh đúng đầu tiên được chạy rồi thoát cả chuỗi. Nhánh nếu không cuối cùng
      nhận mọi trường hợp còn lại. Và luôn thử với các số nằm đúng ở biên.
  - show: '<div class=''box key''><b>Tư duy:</b> mỗi chữ “dưới”, “từ”, “trên”, “không
      quá” trong quy định là một dấu so sánh;

      viết ra từng biên và thử đúng số ở biên. Luôn viết ngoặc nhọn.</div>

      '
    say: Điều cần mang theo. Mỗi chữ dưới, từ, trên, không quá trong quy định là một
      dấu so sánh. Hãy viết ra từng biên, thử đúng số ở biên, và luôn viết ngoặc nhọn.
