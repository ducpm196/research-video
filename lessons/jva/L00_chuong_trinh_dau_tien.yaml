scenes:
- id: hook
  kind: hook
  title: Máy chỉ hiểu số, vậy dòng chữ bạn gõ chạy thành lệnh bằng cách nào?
  steps:
  - show: '<p>Bên trong máy tính chỉ có các số $0$ và $1$. Thế mà bạn gõ một dòng
      chữ, bấm chạy, và màn hình in ra số dư tài khoản.</p>

      <div class="box key">Hôm nay ta đi hết con đường đó: <b>gõ mã nguồn → biên dịch
      → chạy</b>, và viết chương trình Java đầu tiên.</div>

      <span class=''note''><b>Mã nguồn</b>: các dòng lệnh bạn gõ bằng chữ. <b>Biên
      dịch</b>: dịch cả tệp mã nguồn sang dạng máy đọc được, trước khi chạy.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Chào bạn, bên trong máy tính chỉ có các số không và một. Thế mà bạn gõ một
      dòng chữ, bấm chạy, và màn hình in ra số dư tài khoản. Hôm nay ta đi hết con
      đường đó, từ lúc gõ mã nguồn, qua bước biên dịch, tới lúc chạy, và viết chương
      trình Java đầu tiên của bạn. Mã nguồn là các dòng lệnh bạn gõ bằng chữ, còn
      biên dịch là dịch cả tệp mã nguồn sang dạng máy đọc được, trước khi chạy. Mọi
      dịch vụ ngân hàng sau này, từ chuyển khoản tới đối soát, đều bắt đầu từ ba bước
      ấy, và hiểu chúng giúp bạn đọc được thông báo lỗi thay vì sợ nó.
- id: prereq
  kind: prereq
  title: 'Trước hết: ba điều về máy tính'
  steps:
  - show: <table class='t'><tr><th>khái niệm</th><th>nghĩa</th><th>ví dụ đời thường</th></tr><tr><td>①
      Bộ xử lý</td><td>làm từng lệnh rất đơn giản, rất nhanh</td><td>người thu ngân
      bấm máy tính</td></tr><tr><td>② Bộ nhớ</td><td>chỗ để giữ dữ liệu khi đang chạy</td><td>tờ
      giấy nháp</td></tr><tr><td>③ Tệp</td><td>dữ liệu được lưu trên ổ đĩa, có tên</td><td>cuốn
      sổ có tên trên gáy</td></tr><tr><td>④ Thư mục</td><td>ngăn chứa tệp; cửa sổ
      lệnh luôn <b>đứng</b> ở một thư mục</td><td>ngăn tủ đựng các cuốn sổ</td></tr></table>
    say: Trước hết, ta cần hiểu bốn điều về máy tính. Điều thứ nhất, bộ xử lý làm
      từng lệnh rất đơn giản nhưng rất nhanh, giống người thu ngân bấm máy tính. Điều
      thứ hai, bộ nhớ là chỗ giữ dữ liệu khi chương trình đang chạy, giống tờ giấy
      nháp. Điều thứ ba, tệp là dữ liệu được lưu trên ổ đĩa và có tên, giống cuốn
      sổ có tên ghi trên gáy. Điều thứ tư, thư mục là ngăn chứa tệp, giống ngăn tủ
      đựng sổ. Khi ta gõ lệnh cho máy, ta luôn đứng ở một thư mục nào đó, và lệnh
      chỉ thấy các tệp nằm ngay trong thư mục ấy.
  - show: <p>Một <b>chương trình</b> là danh sách lệnh viết sẵn, máy làm lần lượt
      <b>từ trên xuống</b>.</p>
    say: Ghép ba điều lại, một chương trình là danh sách lệnh viết sẵn, và máy làm
      lần lượt từ trên xuống dưới.
- id: sym
  kind: symbol
  title: Giải mã các ký hiệu trong chương trình đầu tiên
  steps:
  - show: '<p><b>Tệp Chao.java</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> Chao {</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>        System.out.println("Chao ban!");</div><div>        System.out.println("So
      du: 100000 dong");</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Đây là chương trình đầu tiên, nằm trong tệp tên là Chao chấm Java. Nó có
      sáu dòng, ta đọc từng ký hiệu một ở bảng sau. Đừng lo nếu chưa hiểu hết, mỗi
      chữ đều sẽ được giải thích.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>public
      class Chao</code></td><td>khai một <b>lớp</b> tên Chao: cái hộp có tên chứa
      mã (mọi lệnh Java nằm trong một lớp); tên tệp phải là <code>Chao.java</code></td></tr><tr><td><code>{
      … }</code></td><td>cặp ngoặc nhọn gom các lệnh thành một khối</td></tr><tr><td><code>public
      static void main(String[] args)</code></td><td><b>hàm</b> là một nhóm lệnh có
      tên; hàm tên <code>main</code> là <b>hàm chính</b>, chỗ máy bắt đầu chạy (từng
      chữ ở bảng sau)</td></tr><tr><td><code>System.out.println(…)</code></td><td>in
      giá trị trong ngoặc ra màn hình rồi xuống dòng</td></tr><tr><td><code>"Chao
      ban!"</code></td><td>một <b>chuỗi</b> (dãy ký tự), nằm giữa hai dấu nháy kép</td></tr><tr><td><code>;</code></td><td>dấu
      chấm phẩy kết thúc một lệnh</td></tr><tr><td><code>// …</code></td><td><b>chú
      thích</b>: từ hai gạch chéo tới hết dòng, máy bỏ qua, viết cho người đọc</td></tr></table>'
    focus:
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    clear: true
    say: Dòng đầu khai một lớp tên Chao. Lớp, nói gọn, là một cái hộp có tên để chứa
      mã, và mọi lệnh Java phải nằm trong một lớp; tên tệp bắt buộc trùng với tên
      lớp. Cặp ngoặc nhọn gom các lệnh thành một khối. Dòng thứ hai khai một hàm,
      tức một nhóm lệnh có tên. Hàm này là hàm chính, chỗ máy bắt đầu chạy, và từng
      chữ của dòng đó ta giải mã ngay ở bảng sau. Lệnh in sẽ in giá trị trong ngoặc
      ra màn hình rồi xuống dòng. Chữ nằm giữa hai dấu nháy kép là một chuỗi, tức
      một dãy ký tự. Dấu chấm phẩy đánh dấu hết một lệnh. Còn hai gạch chéo mở đầu
      một chú thích, phần máy bỏ qua, viết cho người đọc.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>public</code></td><td><b>công
      khai</b>: nơi khác đều gọi được hàm này</td></tr><tr><td><code>static</code></td><td>hàm
      <b>gắn với cả lớp</b>: máy gọi được ngay, chưa cần tạo vật nào từ lớp</td></tr><tr><td><code>void</code></td><td><b>rỗng</b>:
      hàm làm xong không trả giá trị nào về</td></tr><tr><td><code>main</code></td><td><b>tên
      hàm</b>: máy tìm đúng tên này để bắt đầu chạy</td></tr><tr><td><code>String[]
      args</code></td><td>trong ngoặc tròn là <b>tham số</b>: danh sách chữ người
      chạy gõ thêm sau tên lớp (chương trình này chưa dùng)</td></tr><tr><td><code>System.out</code></td><td><code>System</code>:
      kho lệnh có sẵn của hệ thống; <code>out</code>: <b>đầu ra chuẩn</b>, tức màn
      hình</td></tr><tr><td><code>println</code></td><td>lệnh in một dòng rồi xuống
      dòng</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    - 1
    - 1
    clear: true
    forward_ref: true
    say: Bảng này giải mã từng chữ ở dòng hàm chính và dòng lệnh in. Chữ công khai
      nghĩa là nơi khác đều gọi được hàm này. Chữ gắn với lớp nghĩa là máy gọi được
      hàm ngay, chưa cần tạo vật nào từ lớp. Chữ rỗng nghĩa là hàm làm xong không
      trả giá trị nào về. Tiếp theo là tên hàm, máy tìm đúng tên này để bắt đầu chạy.
      Trong ngoặc tròn là tham số, một danh sách chữ mà người chạy chương trình có
      thể gõ thêm sau tên lớp; chương trình này chưa dùng nó. Ở lệnh in, chữ đầu là
      kho lệnh có sẵn của hệ thống, chữ thứ hai là đầu ra chuẩn, tức màn hình. Chữ
      cuối là lệnh in một dòng rồi xuống dòng. Bạn cứ gõ đúng như mẫu. Về sau, bài
      vòng lặp sẽ dùng danh sách chữ gõ thêm, và bài về hàm sẽ giảng kỹ chữ gắn với
      lớp.
