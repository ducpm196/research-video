      fill="#1f2937">Chao ban!</text><text x="750" y="330" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">biên dịch MỘT lần, máy ảo trên mỗi hệ điều
      hành chạy cùng tệp .class</text></svg></div>
    clear: true
    say: 'Hình này là cả con đường. Bên trái là tệp mã nguồn bạn gõ. Trình biên dịch
      đọc nó và tạo ra tệp mã bai, dạng lệnh mà người khó đọc nhưng máy ảo hiểu. Sau
      đó máy ảo Java, viết tắt JVM, nạp tệp mã bai và chạy từng lệnh, rồi kết quả
      hiện ra màn hình. Máy ảo là một chương trình đóng vai một chiếc máy tính tưởng
      tượng: nó đọc mã bai rồi ra lệnh lại cho máy thật. Nhờ có máy ảo, cùng một tệp
      mã bai chạy được trên nhiều hệ điều hành, tức phần mềm nền điều khiển cả chiếc
      máy tính.'
  - show: '<table class=''t''><tr><th>bước</th><th>ai làm</th><th>bắt được lỗi gì</th></tr><tr><td>biên
      dịch</td><td>trình biên dịch <code>javac</code></td><td>viết sai luật của ngôn
      ngữ (thiếu dấu <code>;</code>, sai tên, đặt chữ vào chỗ cần số): <b>lỗi biên
      dịch</b></td></tr><tr><td>chạy</td><td>máy ảo <code>java</code></td><td>chia
      cho 0, đọc ô không tồn tại…: <b>lỗi khi chạy</b> (máy ảo <b>ném ra ngoại lệ</b>:
      báo lỗi rồi dừng)</td></tr></table>'
    say: Hai bước này bắt hai loại lỗi khác nhau. Trình biên dịch bắt lỗi viết sai
      luật của ngôn ngữ, như thiếu dấu chấm phẩy hay sai tên, gọi là lỗi biên dịch,
      và khi đó không có tệp mã bai nào được tạo. Còn máy ảo chỉ phát hiện một số
      lỗi khi đang chạy, như chia cho không. Loại lỗi này gọi là lỗi khi chạy, vì
      chỉ lúc chương trình đang chạy mới lộ ra. Khi gặp nó, máy ảo ném ra một ngoại
      lệ, nghĩa là dừng việc đang làm và in thông báo lỗi.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: tạo, biên dịch, chạy'
  checks:
  - 'len([''Chao ban!'', ''So du: 100000 dong'']) == 2'
  steps:
  - show: '<p><b>Chuẩn bị.</b> Cài bộ công cụ <b>JDK</b> bản 21 trở lên (có bản miễn
      phí, ví dụ ở jdk.java.net hoặc adoptium.net); trong đó có trình biên dịch <code>javac</code>
      và máy ảo <code>java</code>.

      Mở <b>Git Bash</b>: cửa sổ lệnh đi kèm Git for Windows (macOS, Linux: Terminal).
      Cả khoá chỉ dùng cửa sổ này.</p>

      <div class="code"><div>javac -version</div></div>

      <span class=''note''>Làm thử: lệnh in ra số phiên bản, ví dụ javac 21.0.2, là
      máy đã sẵn sàng.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Trước khi bắt đầu, máy cần có bộ công cụ JDK, bản hai mươi mốt trở lên, có
      bản tải miễn phí, vì trong đó có sẵn trình biên dịch và máy ảo. Ta gõ lệnh trong
      cửa sổ lệnh, tức một khung chữ nơi ta gõ lệnh cho máy rồi bấm phím xuống dòng.
      Cả khoá chỉ dùng loại cửa sổ này, tên trên màn hình, để lệnh chạy giống nhau
      trên mọi máy. Làm thử, gõ lệnh hỏi phiên bản của trình biên dịch; nó in ra số
      phiên bản là máy đã sẵn sàng.
  - show: '<p><b>Bước 0. Đứng vào một thư mục làm việc.</b></p>

      <div class="code"><div>mkdir -p ~/hoc/jva</div><div>cd ~/hoc/jva</div><div>pwd</div><div>ls</div></div>

      <span class=''note''>Làm thử: <code>pwd</code> in đường dẫn bạn đang đứng, ví
      dụ /c/Users/ban/hoc/jva; <code>ls</code> chưa in gì vì thư mục còn trống.</span>

      '
    focus:
    - 1
    - '2.1'
    - '2.2'
    - - '2.3'
      - '2.4'
    - 3
    clear: true
    say: Bước không, tạo một thư mục làm việc rồi đứng vào đó. Lệnh tạo thư mục có
      cờ p, nghĩa là không báo lỗi nếu thư mục đã có, và dấu ngã là thư mục nhà của
      bạn. Lệnh đổi thư mục đi vào thư mục vừa tạo. Lệnh in vị trí cho biết bạn đang
      đứng ở đâu, và lệnh liệt kê cho thấy trong đó chưa có tệp nào. Nhớ điều này,
      vì lệnh biên dịch ở bước hai chỉ nhìn thấy các tệp nằm ngay trong thư mục bạn
      đang đứng.
  - show: '<p><b>Bước 1. Tạo tệp.</b> Mở trình soạn mã (ví dụ Visual Studio Code),
      gõ mã, lưu vào đúng thư mục trên với tên <code>Chao.java</code>. Tên tệp trùng
      tên lớp <code>public</code> (công khai: mọi nơi khác đều được dùng), kể cả chữ
      hoa.</p>

      <span class=''note''>Làm thử: lớp tên Chao thì tệp phải là Chao.java, không
      phải chao.java.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: 'Bước một là tạo tệp: mở một trình soạn mã, gõ đoạn mã vào đó, rồi lưu vào
      đúng thư mục vừa đứng, với tên Chao chấm Java. Tên tệp phải trùng tên lớp, kể
      cả chữ hoa chữ thường, vì luật của Java bắt lớp công khai nằm trong tệp cùng
      tên. Làm thử, lớp tên Chao viết hoa chữ đầu, thì tệp cũng viết hoa chữ đầu.'
  - show: '<p><b>Bước 2. Biên dịch.</b></p><div class="code"><div>javac Chao.java</div></div><span
      class=''note''>Làm thử: không có lỗi thì không in gì, và trong thư mục xuất
      hiện thêm tệp Chao.class.</span>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, biên dịch. Gõ lệnh gọi trình biên dịch, kèm tên tệp. Nếu không
      có lỗi thì lệnh này không in gì cả, nghĩa là mã đã đúng luật, và trong thư mục
      xuất hiện thêm một tệp mã bai cùng tên Chao.
  - show: '<p><b>Bước 3. Chạy.</b></p><div class="code"><div>java Chao</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>Chao ban!</div><div>So du: 100000 dong</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước ba, chạy. Gõ lệnh gọi máy ảo kèm tên lớp, không cần đuôi tệp. Máy ảo
      tìm hàm chính và làm từng lệnh từ trên xuống. Lệnh in thứ nhất in dòng chào
      bạn, lệnh in thứ hai in dòng số dư. Có hai lệnh in nên có đúng hai dòng.
- id: example
  kind: example
  title: 'Ví dụ: máy tính toán và nối chữ theo thứ tự nào?'
  checks:
  - 2 + 3 == 5
  - '''Tong: '' + str(2) + str(3) == ''Tong: 23'''
  - '''Tong: '' + str(2 + 3) == ''Tong: 5'''
  - str(2 + 3) + ' dong' == '5 dong'
  steps:
  - show: '<p><b>Tệp Tong.java</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> Tong {</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>        System.out.println(2 + 3);             <span class="cm">//
      (1) phép cộng hai số</span></div><div>        System.out.println("2 + 3");           <span
      class="cm">// (2) một chuỗi chữ</span></div><div>        System.out.println("Tong:
      " + 2 + 3);  <span class="cm">// (3) chuỗi đứng trước</span></div><div>        System.out.println("Tong:
      " + (2 + 3));<span class="cm">// (4) ngoặc tính trước</span></div><div>        System.out.println(2
      + 3 + " dong");   <span class="cm">// (5) số đứng trước</span></div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Chương trình này có năm lệnh in, mỗi lệnh thử một cách viết khác nhau với
      hai số hai và ba. Phần sau hai gạch chéo ở cuối mỗi dòng là chú thích, máy bỏ
      qua, nó chỉ đánh số cho ta dễ theo dõi. Ta đoán từng dòng trước khi chạy.
  - show: <div class="code"><div>System.out.println(2 + 3);             <span class="cm">//
      (1) phép cộng hai số</span></div><div>System.out.println("2 + 3");           <span
      class="cm">// (2) một chuỗi chữ</span></div></div><p>Dòng ① in một phép cộng
      hai số, dòng ② in một chuỗi chữ:</p>$$① \; 2 + 3 = \hl{5} \qquad ② \; \text{"2
      + 3"} \to \text{2 + 3}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất, hai cộng ba là năm, vì cả hai đều là số. Dòng thứ hai
      nằm trong dấu nháy kép nên là chữ, máy in nguyên văn hai cộng ba.
  - show: '<div class="code"><div>System.out.println("Tong: " + 2 + 3);  <span class="cm">//
      (3) chuỗi đứng trước</span></div></div><p>Dòng ③: máy làm <b>từ trái sang phải</b>.
      Chuỗi cộng số thì <b>nối chữ</b>:</p>$$③ \; (\text{"Tong: "} + 2) + 3 = \text{"Tong:
      2"} + 3 = \hl{\text{Tong: 23}}$$'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép tính thứ ba, máy làm từ trái sang phải. Chuỗi tổng cộng với số hai thì
      không cộng số mà nối chữ, ra tổng hai. Rồi nối tiếp số ba, ra tổng hai ba, không
      phải tổng năm.
  - show: '<div class="code"><div>System.out.println("Tong: " + (2 + 3));<span class="cm">//
      (4) ngoặc tính trước</span></div><div>System.out.println(2 + 3 + " dong");   <span
      class="cm">// (5) số đứng trước</span></div></div><p>Dòng ④: ngoặc được tính
      trước. Dòng ⑤: hai số đứng trước nên cộng số trước rồi mới nối chữ.</p>$$④ \;
      \text{"Tong: "} + (2 + 3) = \hlg{\text{Tong: 5}} \qquad ⑤ \; (2 + 3) + \text{"
      dong"} = \hlg{\text{5 dong}}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, phần trong ngoặc được tính trước, ra năm, rồi mới nối vào
      chữ, nên in tổng năm. Phép tính thứ năm, hai số đứng trước nên được cộng thành
      năm trước, rồi mới nối chữ đồng.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>5</div><div>2 + 3</div><div>Tong:
      23</div><div>Tong: 5</div><div>5 dong</div></div>'
    clear: true
    say: 'Chạy thật chương trình, năm dòng in ra đúng như ta đoán: năm, hai cộng ba,
      tổng hai ba, tổng năm, và năm đồng.'
- id: doc_loi
  kind: example
  title: 'Ví dụ: đọc một thông báo lỗi biên dịch thật'
  steps:
  - show: '<p>Tệp <code>Thieu.java</code> quên dấu <code>;</code> ở dòng thứ ba:</p><p><b>Trình
      biên dịch báo</b></p><div class="code"><div><span class="cm">Thieu.java:3: error:
      '';'' expected</span></div><div><span class="cm">        System.out.println("Chao
      ban!")</span></div><div><span class="cm">                                       ^</span></div><div><span
      class="cm">1 error</span></div></div>'
    focus:
    - 0
    - '3.1'
    - '3.2'
    - '3.3'
    - '3.4'
    clear: true
    say: Ta đọc thông báo lỗi từ trên xuống. Dòng đầu cho biết tên tệp, số dòng là
      ba, và lỗi là máy đang chờ một dấu chấm phẩy. Dòng thứ hai là chính dòng mã
      đó, in lại. Dòng thứ ba có dấu mũ, chỉ đúng cột nơi máy nhận ra thiếu, ngay
      sau ngoặc đóng. Dòng cuối đếm số lỗi.
  - show: '<p>Lần này gõ sai chính tả tên lệnh in, thiếu chữ <code>l</code>:</p><p><b>Trình
      biên dịch báo</b></p><div class="code"><div><span class="cm">Chinh.java:3: error:
      cannot find symbol</span></div><div><span class="cm">        System.out.printn("Chao
      ban!");</span></div><div><span class="cm">                  ^</span></div><div><span
      class="cm">  symbol:   method printn(String)</span></div><div><span class="cm">  location:
      variable out of type PrintStream</span></div><div><span class="cm">1 error</span></div></div>'
    focus:
    - '3.2'
    - '3.1'
    - '3.3'
    - - '3.4'
      - '3.5'
    clear: true
    say: 'Lần này ta gõ sai chính tả tên lệnh in, thiếu một chữ cái. Máy báo không
      tìm thấy ký hiệu, nghĩa là nó không biết tên lệnh này. Dấu mũ chỉ đúng chỗ tên
      sai. Hai dòng dưới nói rõ: máy tìm một lệnh tên như thế trong đầu ra của hệ
      thống mà không thấy.'
  - show: '<div class="box key"><b>Cách đọc lỗi biên dịch.</b>

      <ol><li>Đọc <b>dòng đầu</b>: tên tệp, số dòng, lời báo.</li><li>Nhìn <b>dấu
      mũ</b>: máy nhận ra lỗi ở đó.</li>

      <li>Sửa <b>lỗi đầu tiên</b> rồi biên dịch lại: các lỗi sau thường là hệ quả
      của nó.</li></ol>

      <span class="note">Máy báo chỗ nó <b>nhận ra</b>; chỗ sai thật có thể nằm ngay
      trước đó.</span></div>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.3'
    clear: true
    say: Rút ra cách đọc lỗi biên dịch. Một, đọc dòng đầu để biết tệp, dòng và lời
      báo. Hai, nhìn dấu mũ để biết máy nhận ra lỗi ở đâu. Ba, chỉ sửa lỗi đầu tiên
      rồi biên dịch lại, vì các lỗi sau thường là hệ quả của nó. Và nhớ rằng máy báo
      chỗ nó nhận ra lỗi, còn chỗ sai thật có thể nằm ngay trước đó.
- id: quymo
  kind: concept
  title: Khi lô giao dịch lớn dần, lỗi nằm ở đâu thì rẻ nhất?
  checks:
  - 10 // 2 - 1 == 4
  - 10 - (10 // 2 - 1) == 6
  - 1000 // 2 - 1 == 499
  - 1000 - 499 == 501
  - 1000000 // 2 - 1 == 499999
  - 1000000 - 499999 == 500001
  - 1000000 * 1 / 1000 == 1000
  - round(1000 / 60, 1) == 16.7
  - round(499.999 / 60, 1) == 8.3
  - 10 * 1 / 1000 == 0.01
  steps:
  - show: <p>Một lô $n$ lệnh, mỗi lệnh mất $1$ mili giây (số minh hoạ). Lệnh <b>ở
      giữa lô</b> chia cho $0$ nên chương trình dừng.</p><table class='t'><tr><th>lô
      n</th><th>cả lô</th><th>lệnh lỗi</th><th>đã xong</th><th>chưa làm</th><th>làm
      dở phải bỏ</th></tr><tr><td>10</td><td>0,01 giây</td><td>5</td><td>4</td><td>6</td><td>4
      mili giây</td></tr><tr><td>1 000</td><td>1 giây</td><td>500</td><td>499</td><td>501</td><td>0,499
      giây</td></tr><tr><td>1 000 000</td><td>1 000 giây ≈ 16,7 phút</td><td>500 000</td><td>499
      999</td><td>500 001</td><td>499,999 giây ≈ 8,3 phút</td></tr></table>
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    say: Giả sử một lô có n lệnh, mỗi lệnh mất một phần nghìn giây, số minh hoạ. Lệnh
      ở giữa lô chia cho không, nên chương trình dừng giữa chừng. Lô mười lệnh đã
      xong bốn lệnh, còn sáu chưa làm. Lô một nghìn lệnh đã xong bốn trăm chín mươi
      chín, chưa làm năm trăm linh một. Lô một triệu lệnh mất gần mười bảy phút, chết
      ở giữa thì gần tám phút công việc đã làm dở và nửa triệu lệnh nằm chờ.
  - show: '<div class="box key"><b>Điều người làm nghề rút ra.</b> Càng lớn, lỗi chỉ
      lộ lúc chạy càng đắt: phải biết <b>đã xong tới đâu</b> và chạy tiếp thế nào.

      Lỗi biên dịch thì rẻ nhất: <b>0</b> lệnh bị chạy, sửa ngay tại bàn. Vì thế người
      ta dồn nhiều lỗi nhất có thể về phía biên dịch.</div>

      '
    clear: true
    say: Lô càng lớn thì lỗi chỉ lộ lúc chạy càng đắt, vì ta phải biết đã xong tới
      đâu và chạy tiếp thế nào. Lỗi biên dịch rẻ nhất, vì không lệnh nào bị chạy.
      Nên người làm nghề cố đẩy càng nhiều lỗi càng tốt về phía biên dịch.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: nhìn kiểu của từng vế'
  checks:
  - 'len(''5|2 + 3|Tong: 23|Tong: 5|5 dong''.split(''|'')) == 5'
  steps:
  - show: '<table class=''t''><tr><th>dòng</th><th>vế trái của dấu + đầu tiên</th><th>loại
      phép +</th><th>kết quả</th></tr><tr><td>①</td><td>số 2</td><td>cộng số</td><td>5</td></tr><tr><td>③</td><td>chuỗi
      "Tong: "</td><td>nối chữ (cả hai lần)</td><td>Tong: 23</td></tr><tr><td>④</td><td>chuỗi
      "Tong: "</td><td>ngoặc là số 5, rồi nối</td><td>Tong: 5</td></tr><tr><td>⑤</td><td>số
      2</td><td>cộng số, rồi nối</td><td>5 dong</td></tr></table>'
    say: Kiểm bằng đường khác, chỉ cần nhìn kiểu của hai vế mỗi lần gặp dấu cộng,
      làm từ trái sang phải. Nếu cả hai vế đều là số thì cộng số. Nếu một trong hai
      vế là chuỗi thì nối chữ. Áp quy tắc này cho từng dòng, ta ra đúng bốn kết quả
      như khi chạy.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Lưu lớp <code>Chao</code>
      vào tệp <code>Loi.java</code>.</div><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> Chao {</div></div><p><b>Trình biên dịch báo</b></p><div
      class="code"><div><span class="cm">error: class Chao is public, should be declared
      in a file named Chao.java</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là đặt tên tệp khác tên lớp. Lớp tên Chao nhưng
      lưu trong một tệp tên khác. Trình biên dịch từ chối ngay, và báo rằng lớp Chao
      phải nằm trong tệp tên Chao chấm Java.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Biên dịch khi đang đứng
      sai thư mục.</div><div class="code"><div>cd ~</div><div>javac Chao.java</div></div><p><b>Trình
      biên dịch báo</b> (thư mục nhà chưa có tệp Chao.java)</p><div class="code"><div>error:
      file not found: Chao.java</div><div>Usage: javac &lt;options&gt; &lt;source
      files&gt;</div><div>use --help for a list of possible options</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là biên dịch khi đang đứng sai thư mục.
      Lệnh đổi thư mục kèm dấu ngã đưa ta về thư mục nhà, nơi chưa có tệp Chao. Khi
      đó trình biên dịch báo không tìm thấy tệp, vì nó chỉ nhìn thư mục đang đứng.
      Cách sửa là hỏi lại vị trí bằng lệnh in vị trí, rồi đi vào đúng thư mục chứa
      tệp.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tin rằng “biên dịch
      được là chạy đúng”.</div><div class="code"><div>System.out.println("Bat dau");</div><div><span
      class="kw">int</span> soNguoi = 0;</div><div>System.out.println(100000 / soNguoi);</div><div>System.out.println("Ket
      thuc");</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Bat dau</div><div><span
      class="cm">Exception in thread "main" java.lang.ArithmeticException: / by zero</span></div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là tin rằng biên dịch được thì chạy đúng.
      Chương trình này biên dịch không lỗi. Nó tạo một ô nhớ có tên là số người, đặt
      vào số không; loại ô nhớ có tên này gọi là biến. Khi chạy, nó in bắt đầu, rồi
      chia một trăm nghìn cho số không, và máy ảo ném ra ngoại lệ phép tính. Dòng
      kết thúc không được in vì chương trình đã dừng.
