- id: formula
  kind: formula
  title: 'Suy ra từng bước: tạo, biên dịch, chạy'
  checks:
  - 'len([''Chao ban!'', ''So du: 100000 dong'']) == 2'
  steps:
  - show: '<p><b>Bước 1. Tạo tệp.</b> Gõ mã vào tệp <code>Chao.java</code>. Tên tệp
      trùng tên lớp <code>public</code>, kể cả chữ hoa.</p>

      <span class=''note''>Làm thử: lớp tên Chao thì tệp phải là Chao.java, không
      phải chao.java.</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: 'Bước một là tạo tệp: gõ toàn bộ đoạn mã bên trái vào một tệp tên là Chao
      chấm Java. Tên tệp phải trùng tên lớp, kể cả chữ hoa và chữ thường, vì luật
      của Java bắt lớp công khai nằm trong tệp cùng tên. Làm thử, lớp tên Chao viết
      hoa chữ đầu, thì tệp cũng phải viết hoa chữ đầu.'
  - show: '<p><b>Bước 2. Biên dịch.</b></p><div class="code"><div>javac Chao.java</div></div><span
      class=''note''>Làm thử: không có lỗi thì không in gì, và trong thư mục xuất
      hiện thêm tệp Chao.class.</span>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, biên dịch. Gõ lệnh gọi trình biên dịch, kèm tên tệp. Nếu không
      có lỗi thì lệnh này không in gì cả, nghĩa là mã đã đúng luật, và trong thư mục
      xuất hiện thêm một tệp mã bai cùng tên Chao.
  - show: '<p><b>Bước 3. Chạy.</b></p><div class="code"><div>java Chao</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>Chao ban!</div><div>So du: 100000 dong</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước ba, chạy. Gõ lệnh gọi máy ảo kèm tên lớp, không cần đuôi tệp. Máy ảo
      tìm hàm chính và làm từng lệnh từ trên xuống. Lệnh in thứ nhất in dòng chào
      bạn, lệnh in thứ hai in dòng số dư. Có hai lệnh in nên có đúng hai dòng.
- id: example
  kind: example
  title: 'Ví dụ: máy tính toán và nối chữ theo thứ tự nào?'
  checks:
  - 2 + 3 == 5
  - '''Tong: '' + str(2) + str(3) == ''Tong: 23'''
  - '''Tong: '' + str(2 + 3) == ''Tong: 5'''
  - str(2 + 3) + ' dong' == '5 dong'
  steps:
  - show: '<p><b>Tệp Tong.java</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> Tong {</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>        System.out.println(2 + 3);             <span class="cm">//
      (1) phép cộng hai số</span></div><div>        System.out.println("2 + 3");           <span
      class="cm">// (2) một chuỗi chữ</span></div><div>        System.out.println("Tong:
      " + 2 + 3);  <span class="cm">// (3) chuỗi đứng trước</span></div><div>        System.out.println("Tong:
      " + (2 + 3));<span class="cm">// (4) ngoặc tính trước</span></div><div>        System.out.println(2
      + 3 + " dong");   <span class="cm">// (5) số đứng trước</span></div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Chương trình này có năm lệnh in, mỗi lệnh thử một cách viết khác nhau với
      hai số hai và ba. Ta đoán từng dòng trước khi chạy.
  - show: <div class="code"><div>System.out.println(2 + 3);             <span class="cm">//
      (1) phép cộng hai số</span></div><div>System.out.println("2 + 3");           <span
      class="cm">// (2) một chuỗi chữ</span></div></div><p>Dòng ① in một phép cộng
      hai số, dòng ② in một chuỗi chữ:</p>$$① \; 2 + 3 = \hl{5} \qquad ② \; \text{"2
      + 3"} \to \text{2 + 3}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất, hai cộng ba là năm, vì cả hai đều là số. Dòng thứ hai
      nằm trong dấu nháy kép nên là chữ, máy in nguyên văn hai cộng ba.
  - show: '<div class="code"><div>System.out.println("Tong: " + 2 + 3);  <span class="cm">//
      (3) chuỗi đứng trước</span></div></div><p>Dòng ③: máy làm <b>từ trái sang phải</b>.
      Chuỗi cộng số thì <b>nối chữ</b>:</p>$$③ \; (\text{"Tong: "} + 2) + 3 = \text{"Tong:
      2"} + 3 = \hl{\text{Tong: 23}}$$'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép tính thứ ba, máy làm từ trái sang phải. Chuỗi tổng cộng với số hai thì
      không cộng số mà nối chữ, ra tổng hai. Rồi nối tiếp số ba, ra tổng hai ba, không
      phải tổng năm.
  - show: '<div class="code"><div>System.out.println("Tong: " + (2 + 3));<span class="cm">//
      (4) ngoặc tính trước</span></div><div>System.out.println(2 + 3 + " dong");   <span
      class="cm">// (5) số đứng trước</span></div></div><p>Dòng ④: ngoặc được tính
      trước. Dòng ⑤: hai số đứng trước nên cộng số trước rồi mới nối chữ.</p>$$④ \;
      \text{"Tong: "} + (2 + 3) = \hlg{\text{Tong: 5}} \qquad ⑤ \; (2 + 3) + \text{"
      dong"} = \hlg{\text{5 dong}}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, phần trong ngoặc được tính trước, ra năm, rồi mới nối vào
      chữ, nên in tổng năm. Phép tính thứ năm, hai số đứng trước nên được cộng thành
      năm trước, rồi mới nối chữ đồng.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>5</div><div>2 + 3</div><div>Tong:
      23</div><div>Tong: 5</div><div>5 dong</div></div>'
    clear: true
    say: 'Chạy thật chương trình, năm dòng in ra đúng như ta đoán: năm, hai cộng ba,
      tổng hai ba, tổng năm, và năm đồng.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm số dòng và kiểu của từng vế'
  checks:
  - 'len(''5|2 + 3|Tong: 23|Tong: 5|5 dong''.split(''|'')) == 5'
  steps:
  - show: '<table class=''t''><tr><th>dòng</th><th>vế trái lúc gặp dấu +</th><th>loại
      phép +</th><th>kết quả</th></tr><tr><td>①</td><td>số 2</td><td>cộng số</td><td>5</td></tr><tr><td>③</td><td>chuỗi
      "Tong: "</td><td>nối chữ (cả hai lần)</td><td>Tong: 23</td></tr><tr><td>④</td><td>chuỗi
      "Tong: "</td><td>ngoặc là số 5, rồi nối</td><td>Tong: 5</td></tr><tr><td>⑤</td><td>số
      2</td><td>cộng số, rồi nối</td><td>5 dong</td></tr></table>'
    say: Kiểm bằng đường khác, chỉ cần nhìn vế bên trái mỗi lần gặp dấu cộng. Nếu
      vế trái là số và vế phải là số thì cộng số. Nếu một trong hai vế là chuỗi thì
      nối chữ. Áp quy tắc này cho từng dòng, ta ra đúng bốn kết quả như khi chạy.
  - show: '<p>Đếm: chương trình có $5$ lệnh in nên phải có đúng $5$ dòng kết quả.
      Kết quả chạy có $5$ dòng ✓</p>'
    say: Thêm một phép kiểm nữa, chương trình có năm lệnh in thì phải có đúng năm
      dòng kết quả. Kết quả chạy có năm dòng, khớp.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Lưu lớp <code>Chao</code>
      vào tệp <code>Loi.java</code>.</div><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> Chao {</div></div><p><b>Trình biên dịch báo</b></p><div
      class="code"><div><span class="cm">error: should be declared in a file named
      Chao.java</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là đặt tên tệp khác tên lớp. Lớp tên Chao nhưng
      lưu trong một tệp tên khác. Trình biên dịch từ chối ngay, và báo rằng lớp Chao
      phải nằm trong tệp tên Chao chấm Java.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Quên dấu <code>;</code>
      cuối lệnh in.</div><div class="code"><div>System.out.println("Chao ban!")</div></div><p><b>Trình
      biên dịch báo</b></p><div class="code"><div><span class="cm">error: &#x27;;&#x27;
      expected</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai, cũng của người mới, là quên dấu chấm phẩy cuối lệnh. Trình biên
      dịch báo rằng nó đang chờ một dấu chấm phẩy, kèm số dòng. Hãy đọc số dòng trong
      thông báo, đó là chỗ cần sửa.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tin rằng “biên dịch
      được là chạy đúng”.</div><div class="code"><div>System.out.println("Bat dau");</div><div><span
      class="kw">int</span> soNguoi = 0;</div><div>System.out.println(100000 / soNguoi);</div><div>System.out.println("Ket
      thuc");</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Bat dau</div><div><span
      class="cm">Exception in thread "main" java.lang.ArithmeticException: / by zero</span></div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba, của cả người đã đi làm, là tin rằng biên dịch được thì chạy đúng.
      Chương trình này biên dịch không lỗi. Nhưng khi chạy, nó in bắt đầu, rồi chia
      một trăm nghìn cho số người bằng không, và máy ảo ném ra ngoại lệ phép tính.
      Dòng kết thúc không bao giờ được in. Trình biên dịch không biết lúc chạy số
      người bằng bao nhiêu.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - '''A'' + str(1) + str(2) == ''A12'''
  - str(1 + 2) + 'A' == '3A'
  - '''A'' + str(1 + 2) == ''A3'''
  steps:
  - show: <p><b>Đoán ba dòng in ra</b></p><div class="code"><div>System.out.println("A"
      + 1 + 2);</div><div>System.out.println(1 + 2 + "A");</div><div>System.out.println("A"
      + (1 + 2));</div></div>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 20
    clear: true
    say: Bây giờ tới phần bạn tự làm. Chương trình có ba lệnh in. Lệnh một nối chữ
      A với một rồi với hai. Lệnh hai lấy một cộng hai rồi nối chữ A. Lệnh ba nối
      chữ A với một cộng hai đặt trong ngoặc. Hãy dừng video, viết ra giấy ba dòng
      in ra.
  - show: <p>Áp quy tắc vế trái:</p>$$\text{"A"} + 1 + 2 = \hl{\text{A12}} \qquad
      1 + 2 + \text{"A"} = \hl{\text{3A}} \qquad \text{"A"} + (1 + 2) = \hl{\text{A3}}$$
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án như sau. Dòng một, vế trái là chuỗi nên nối cả hai lần, ra A một hai.
      Dòng hai, hai số đứng trước nên cộng thành ba rồi nối, ra ba A. Dòng ba, ngoặc
      tính trước ra ba, rồi nối, ra A ba.
    clear: true
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>A12</div><div>3A</div><div>A3</div></div>
    clear: true
    say: Chạy thật chương trình, ba dòng in ra đúng là A một hai, ba A, và A ba.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>gõ mã nguồn .java</span><span class='a'>→</span><span
      class='n'>biên dịch → .class</span><span class='a'>→</span><span class='n'>máy
      ảo chạy hàm chính</span><span class='a'>→</span><span class='n'>từng lệnh từ
      trên xuống</span></div>
    say: Tổng kết chuỗi logic. Bạn gõ mã nguồn vào tệp Java, trình biên dịch tạo tệp
      mã bai, và máy ảo chạy hàm chính, từng lệnh từ trên xuống.
  - show: '<div class=''box key''><b>Tư duy:</b> lỗi biên dịch thì đọc số dòng mà
      trình biên dịch chỉ ra; lỗi khi chạy thì chương trình

      đã chạy tới một lệnh nào đó rồi mới dừng. Dấu <code>+</code> với chuỗi là <b>nối
      chữ</b>, làm từ trái sang phải.</div>

      '
    say: Điều cần mang theo. Gặp lỗi biên dịch thì đọc số dòng mà trình biên dịch
      chỉ ra. Gặp lỗi khi chạy thì chương trình đã chạy tới một lệnh nào đó rồi mới
      dừng. Và dấu cộng với chuỗi là nối chữ, máy làm từ trái sang phải.
