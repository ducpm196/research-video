    clear: true
    say: Hãy hình dung vòng lặp đếm như đi vòng quanh một sân. Bước một, đặt biến
      tháng bằng một, chỉ làm một lần. Bước hai, hỏi điều kiện. Đúng thì sang bước
      ba, làm thân vòng lặp, rồi bước bốn tăng tháng thêm một. Sau đó quay lại hỏi
      điều kiện. Khi điều kiện sai, máy ra khỏi vòng lặp và chạy lệnh tiếp theo.
  - show: '<div class="code"><div><span class="kw">long</span> hanMuc = 5000000;                      <span
      class="cm">// hạn mức một lệnh (số minh hoạ)</span></div><div><span class="kw">int</span>
      dem = 0;</div><div><span class="kw">for</span> (<span class="kw">int</span>
      i = 1; i &lt;= 8; i++) {</div><div>    <span class="kw">long</span> soTien =
      (i * 7 % 10) * 1000000L;  <span class="cm">// giả lập số tiền lệnh thứ i</span></div><div>    <span
      class="kw">if</span> (soTien &lt;= hanMuc) {</div><div>        <span class="kw">continue</span>;                           <span
      class="cm">// không vượt: sang lệnh sau</span></div><div>    }</div><div>    dem++;</div><div>    System.out.println("Lenh
      " + i + ": " + soTien);</div><div>}</div><div>System.out.println("So lenh vuot:
      " + dem);</div></div>'
    clear: true
    say: Mẫu cộng dồn ta sẽ làm ở ví dụ lãi, còn đây là mẫu đếm. Ta giả lập tám lệnh
      chuyển tiền, số tiền lệnh thứ i tính bằng phép chia lấy dư, vì chưa học cách
      lưu nhiều số. Hạn mức ở đây là số tiền tối đa cho một lệnh, năm triệu đồng,
      số minh hoạ. Lệnh nào không vượt hạn mức thì lệnh bỏ qua nhảy sang lệnh sau,
      còn lệnh vượt thì biến đếm tăng một.
  - show: '<table class=''t''><tr><th>lệnh i</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr><tr><td>i
      × 7 % 10 (triệu)</td><td>7</td><td>4</td><td>1</td><td>8</td><td>5</td><td>2</td><td>9</td><td>6</td></tr><tr><td>vượt
      5 triệu?</td><td><b>có</b></td><td>không</td><td>không</td><td><b>có</b></td><td>không
      (bằng)</td><td>không</td><td><b>có</b></td><td><b>có</b></td></tr></table><p><b>Kết
      quả chạy</b></p><div class="code"><div>Lenh 1: 7000000</div><div>Lenh 4: 8000000</div><div>Lenh
      7: 9000000</div><div>Lenh 8: 6000000</div><div>So lenh vuot: 4</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bảng này tính tay tám lệnh. Lệnh năm đúng bằng năm triệu, không vượt, nên
      bị bỏ qua. Có bốn lệnh vượt là lệnh một, bốn, bảy và tám. Chạy thật, chương
      trình in đúng bốn lệnh đó và số lệnh vượt là bốn.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ mười hai dòng giống nhau tới một vòng lặp'
  checks:
  - 12 - 1 + 1 == 12
  - len(range(1, 13)) == 12
  - len(range(1, 12)) == 11
  - 11 - 1 + 1 == 11
  steps:
  - show: <div class="code"><div>soDu += soDu * 5 / 1000;      <span class="cm">//
      tháng 1</span></div><div>soDu += soDu * 5 / 1000;      <span class="cm">// tháng
      2</span></div><div>soDu += soDu * 5 / 1000;      <span class="cm">// tháng 3</span></div></div><p><b>Bước
      1.</b> Ba dòng <b>giống hệt</b>; chỉ chú thích tháng là khác. Phần lặp lại là
      thân, phần thay đổi là số tháng.</p>
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, tìm phần lặp lại. Ba dòng tính lãi giống hệt nhau, chỉ có số tháng
      là khác, nên dòng tính lãi là thân vòng lặp, còn số tháng là biến đếm.
  - show: '<div class="code"><div><span class="kw">for</span> (<span class="kw">int</span>
      thang = 1; thang &lt;= 12; thang++) {</div></div><p><b>Bước 2.</b> Biến đếm
      cần ba thứ: <b>bắt đầu</b> <code>thang = 1</code>, <b>điều kiện</b> <code>thang
      &lt;= 12</code>, <b>bước</b> <code>thang++</code>.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước hai, viết đầu vòng lặp. Vì cần chạy từ tháng một tới tháng mười hai,
      nên biến tháng bắt đầu bằng một, điều kiện là nhỏ hơn hoặc bằng mười hai, và
      sau mỗi vòng tăng một.
  - show: '<p><b>Bước 3.</b> Tháng nhận lần lượt 1, 2, …, 12, đếm cả hai đầu nên:</p>

      $$\text{số lần chạy} = \text{cuối} - \text{đầu} + 1 = 12 - 1 + 1 = \hl{12}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, đếm số lần thân vòng lặp chạy. Biến tháng nhận một, hai, cho tới
      mười hai, và vì đếm cả hai đầu nên số lần là cuối trừ đầu cộng một. Mười hai
      trừ một cộng một bằng mười hai lần, đúng mười hai tháng.
  - show: '<p><b>Bước 4.</b> Nếu viết <code>thang &lt; 12</code> thì số cuối là 11:</p>

      $$11 - 1 + 1 = \hl{11} \text{ lần, thiếu một tháng}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước bốn, thử đổi dấu. Nếu viết nhỏ hơn hẳn mười hai thì tháng cuối cùng
      được chạy là mười một. Theo cùng công thức, số lần là mười một, thiếu đúng một
      tháng. Chọn dấu sai là lỗi lệch một mà ta sẽ gặp ở phần lỗi.
- id: example
  kind: example
  title: 'Ví dụ: lãi cộng dồn mười hai tháng bằng số nguyên'
  checks:
  - 100000000 * 5 // 1000 == 500000
  - 100500000 * 5 // 1000 == 502500
  - 101002500 * 5 // 1000 == 505012
  - 11 - 4 + 1 == 8
  - 105639579 * 5 // 1000 == 528197
  - 105639579 + 528197 == 106167776
  steps:
  - show: '<p><b>Tệp LaiThang.java</b></p><div class="code"><div><span class="kw">long</span>
      soDu = 100000000;                      <span class="cm">// 100 triệu đồng</span></div><div><span
      class="kw">for</span> (<span class="kw">int</span> thang = 1; thang &lt;= 12;
      thang++) {</div><div>    <span class="kw">long</span> lai = soDu * 5 / 1000;             <span
      class="cm">// 0,5% mỗi tháng (số minh hoạ)</span></div><div>    soDu += lai;                            <span
      class="cm">// cộng dồn: lãi nhập vào gốc</span></div><div>    <span class="kw">if</span>
      (thang &lt;= 3 || thang &gt;= 11) {</div><div>        System.out.println("Thang
      " + thang + ": lai " + lai + ", so du " + soDu);</div><div>    }</div><div>}</div><div>System.out.println("Sau
      12 thang: " + soDu);</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Đây là chương trình đầy đủ. Số dư đầu một trăm triệu đồng, lãi minh hoạ không
      phẩy năm phần trăm mỗi tháng. Mỗi vòng tính lãi bằng số nguyên rồi cộng dồn,
      và in ba tháng đầu cùng hai tháng cuối.
  - show: $$① \; 100\,000\,000 \times 5 / 1000 = \hl{500\,000} \;\to\; 100\,500\,000$$$$②
      \; 100\,500\,000 \times 5 / 1000 = \hl{502\,500} \;\to\; 101\,002\,500$$
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ nhất, tháng một, lãi là năm trăm nghìn, số dư thành một trăm
      triệu năm trăm nghìn. Phép tính thứ hai, tháng hai tính lãi trên số dư mới,
      nên lãi lớn hơn một chút, năm trăm linh hai nghìn năm trăm. Đó chính là cộng
      dồn, lãi tháng trước sinh thêm lãi ở tháng sau.
  - show: $$③ \; 101\,002\,500 \times 5 / 1000 = 505\,012.5 \to \hl{505\,012} \;\to\;
      101\,507\,512$$<p>Phép chia nguyên bỏ 0.5 đồng. Số dư tháng 3 trùng với bản
      viết tay ở đầu bài ✓</p>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, tháng ba, lãi đúng ra là năm trăm linh năm nghìn không
      trăm mười hai phẩy năm. Vì chia số nguyên nên phần lẻ nửa đồng bị bỏ. Số dư
      tháng ba trùng với bản viết tay ở đầu bài, nghĩa là vòng lặp làm đúng việc ta
      đã làm bằng tay.
  - show: '$$④ \; \text{tháng 4 tới 11: thân vòng lặp chạy thêm } 11 - 4 + 1 = 8 \text{
      lần} \;\to\; 105\,639\,579$$$$⑤ \; 105\,639\,579 \times 5 / 1000 = 528\,197.895
      \to \hl{528\,197} \;\to\; \hl{106\,167\,776}$$'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, từ tháng bốn tới tháng mười một, thân vòng lặp chạy thêm
      tám lần, ta để máy làm và đọc số dư nó in ra. Phép tính thứ năm, tháng mười
      hai, lãi khoảng năm trăm hai mươi tám nghìn đồng, bỏ phần lẻ. Số dư cuối là
      khoảng một trăm linh sáu triệu một trăm sáu mươi tám nghìn.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Thang 1: lai 500000, so
      du 100500000</div><div>Thang 2: lai 502500, so du 101002500</div><div>Thang
      3: lai 505012, so du 101507512</div><div>Thang 11: lai 525570, so du 105639579</div><div>Thang
      12: lai 528197, so du 106167776</div><div>Sau 12 thang: 106167776</div></div>'
    clear: true
    say: Chạy thật, sáu dòng in ra khớp với từng phép tính tay, kể cả tháng ba đã
      bỏ nửa đồng.
- id: nhap
  kind: example
  title: 'Ví dụ: lặp qua dữ liệu do người dùng đưa vào'
  checks:
  - 3 == len(['7000000', '4000000', '9000000'])
  - 7000000 + 4000000 + 9000000 == 20000000
  - 1500000 + 2500000 == 4000000
  - 1200000 + 800000 + 500000 + 2500000 == 5000000
  - len(range(0, 3)) == 3 - 0 + 1 - 1
  steps:
  - show: <div class="code"><div><span class="kw">long</span> tong = 0;</div><div><span
      class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; args.length;
      i++) {     <span class="cm">// đi qua từng chữ gõ thêm</span></div><div>    tong
      += Long.parseLong(args[i]);</div><div>}</div></div>
    focus:
    - 1
    - '1.2'
    - '1.2'
    - '1.3'
    clear: true
    say: Ở bài đầu ta thấy danh sách chữ gõ thêm sau tên lớp. Giờ vòng lặp đếm cho
      ta đi qua từng chữ trong danh sách đó. Biến đếm chạy từ không, và điều kiện
      là nhỏ hơn hẳn độ dài danh sách, nên số vòng đúng bằng độ dài, hợp với công
      thức cuối trừ đầu cộng một. Mỗi vòng lấy chữ ở vị trí i, đổi thành số nguyên
      dài rồi cộng dồn.
  - show: <div class="code"><div>javac TongArgs.java</div><div>java TongArgs 7000000
      4000000 9000000</div><div>java TongArgs 1500000 2500000</div><div>java TongArgs</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>3 lenh, tong 20000000</div><div>2 lenh,
      tong 4000000</div><div>0 lenh, tong 0</div></div>
    focus:
    - 1
    - - '1.2'
      - '3.1'
    - - '1.3'
      - '3.2'
    - - '1.4'
      - '3.3'
    clear: true
    say: Biên dịch một lần rồi chạy ba lần. Ba chữ gõ thêm cho ba lệnh, tổng hai mươi
      triệu. Hai chữ cho hai lệnh, tổng bốn triệu. Không chữ nào thì vòng lặp chạy
      không lần nào và tổng bằng không, vì điều kiện sai ngay từ đầu.
  - show: <div class="code"><div>Scanner in = <span class="kw">new</span> Scanner(System.in);</div><div><span
      class="kw">long</span> tong = 0;</div><div><span class="kw">int</span> dem =
      0;</div><div><span class="kw">while</span> (in.hasNextLong()) {                  <span
      class="cm">// còn số để đọc thì lặp</span></div><div>    <span class="kw">long</span>
      soTien = in.nextLong();</div><div>    tong += soTien;</div><div>    dem++;</div><div>}</div><div>System.out.println(dem
      + " lenh, tong " + tong);</div></div>
    focus:
    - '1.4'
    - '1.4'
    - - '1.5'
      - '1.6'
      - '1.7'
    - '1.4'
    clear: true
    say: Cách thứ hai là đọc từ đầu vào cho tới hết. Lệnh hỏi còn số nào kế tiếp để
      đọc không cho đúng hoặc sai, nên ta đặt nó làm điều kiện của vòng lặp trong
      khi. Còn số thì đọc, cộng dồn và đếm. Hết số thì điều kiện sai và vòng lặp tự
      dừng, nên ta không cần biết trước có bao nhiêu số.
  - show: <div class="code"><div>javac TongNhap.java</div><div>echo "1200000 800000
      500000 2500000" | java TongNhap</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>4
      lenh, tong 5000000</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Ta đưa bốn số vào bằng ống, như ở bài rẽ nhánh. Vòng lặp chạy đúng bốn lần
      rồi dừng khi hết số, in bốn lệnh và tổng năm triệu.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: công thức lãi kép'
  checks:
  - abs(100000000 * 1.005**12 - 106167781.19) < 0.01
  - '__import__(''functools'').reduce(lambda s, _: s + s * 5 // 1000, range(12), 100000000)
    == 106167776'
  - int(100000000 * 1.005**12) - 106167776 == 5
  - (1.005**12 - 1) / 0.005 < 13
  steps:
  - show: '<p>Không làm tròn thì mỗi tháng số dư nhân với $1.005$, nên 12 tháng là
      nhân 12 lần:</p>

      $$100\,000\,000 \times 1.005^{12} \approx 106\,167\,781.19$$<div class="code"><div><span
      class="kw">double</span> congThuc = 100000000 * Math.pow(1.005, 12);   <span
      class="cm">// gốc nhân 1,005 mũ 12</span></div><div>System.out.println((<span
      class="kw">long</span>) congThuc);                  <span class="cm">// ép kiểu:
      bỏ phần lẻ</span></div></div><span class=''note''><code>Math.pow(a, n)</code>
      là lệnh có sẵn của Java, tính a mũ n, ra số thực; <code>(long)</code> ép về
      số nguyên dài, bỏ phần lẻ.</span><p><b>Kết quả chạy</b></p><div class="code"><div>106167781</div></div>

      '
    focus:
    - 1
    - 3
    - 5
    clear: true
    say: Đường kiểm khác là công thức lãi kép, tức lãi được nhập vào gốc để tháng
      sau sinh lãi tiếp. Nếu không làm tròn, mỗi tháng số dư được nhân với một phẩy
      không không năm, nên mười hai tháng là nhân mười hai lần. Java có sẵn lệnh tính
      lũy thừa, ép về số nguyên dài để dễ đọc, và chương trình in ra số trên màn hình.
  - show: '<p>Chênh lệch: $106\,167\,781 - 106\,167\,776 = \hl{5}$ đồng. Hợp lý, vì
      mỗi tháng phép chia nguyên bỏ <b>dưới 1 đồng</b>,

      12 tháng bỏ chưa tới 13 đồng (kể cả phần lãi của số tiền bị bỏ).</p>

      '
    clear: true
    say: Hai cách chênh nhau năm đồng. Con số này hợp lý, vì mỗi tháng phép chia nguyên
      chỉ bỏ đi chưa tới một đồng. Mười hai tháng bỏ chưa tới mười ba đồng, kể cả
      phần lãi của số tiền bị bỏ, nên năm đồng nằm trong giới hạn đó.
- id: quymo
  kind: concept
  title: Khi vòng lặp chạy qua nhiều kỳ, phần lẻ bị bỏ cộng dồn
  checks:
  - '__import__(''functools'').reduce(lambda s, _: s + s * 5 // 1000, range(120),
    100000000) == 181939592'
  - '__import__(''functools'').reduce(lambda s, _: s + s * 5 // 1000, range(360),
    100000000) == 602257012'
  - int(100000000 * 1.005**120) == 181939673
  - int(100000000 * 1.005**360) == 602257521
  - 181939673 - 181939592 == 81
  - 602257521 - 602257012 == 509
  - 81 / 5 > 16
  - 509 / 5 > 100
  - 360 / 12 == 30
  steps:
  - show: '<div class="code"><div><span class="kw">long</span> soDu = 100000000;                          <span
      class="cm">// 100 triệu đồng (số minh hoạ)</span></div><div><span class="kw">for</span>
      (<span class="kw">int</span> thang = 1; thang &lt;= 360; thang++) {    <span
      class="cm">// 30 năm</span></div><div>    soDu += soDu * 5 / 1000;                    <span
      class="cm">// 0,5% mỗi tháng, bỏ phần lẻ</span></div><div>    <span class="kw">if</span>
      (thang == 12 || thang == 120 || thang == 360) {</div><div>        <span class="kw">long</span>
      ct = (<span class="kw">long</span>) (100000000 * Math.pow(1.005, thang));   <span
      class="cm">// công thức</span></div><div>        System.out.println(thang +
      ": " + soDu + ", ct " + ct + ", lech " + (ct - soDu));</div><div>    }</div><div>}</div></div>'
    clear: true
    say: Ta cho vòng lặp chạy ba trăm sáu mươi tháng, tức ba mươi năm, với cách bỏ
      phần lẻ từng tháng như ở ví dụ. Rồi so với công thức lãi kép ở ba mốc, mười
      hai tháng, một trăm hai mươi tháng và ba trăm sáu mươi tháng.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>12: 106167776, ct 106167781,
      lech 5</div><div>120: 181939592, ct 181939673, lech 81</div><div>360: 602257012,
      ct 602257521, lech 509</div></div>'
    clear: true
    say: Chạy thật, chương trình in ba dòng, mỗi dòng gồm số dư bỏ phần lẻ, số theo
      công thức, và độ lệch.
  - show: <table class='t'><tr><th>tháng</th><th>số dư (bỏ phần lẻ)</th><th>công thức</th><th>lệch
      (đồng)</th></tr><tr><td>12</td><td>106 167 776</td><td>106 167 781</td><td>5</td></tr><tr><td>120</td><td>181
      939 592</td><td>181 939 673</td><td>81</td></tr><tr><td>360</td><td>602 257
      012</td><td>602 257 521</td><td>509</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
    say: Sau mười hai tháng, lệch năm đồng. Thời gian gấp mười lần mà lệch lên tám
      mươi mốt đồng, gấp hơn mười sáu lần. Sau ba mươi năm lệch năm trăm lẻ chín đồng,
      gấp hơn một trăm lần mốc đầu.
  - show: '<div class="box key"><b>Điều người làm nghề rút ra.</b> Phần lẻ bỏ đi mỗi
      vòng không triệt tiêu mà <b>cộng dồn</b>, lại còn mất cả lãi sinh ra từ phần
      đó, nên độ lệch tăng nhanh hơn thời gian.

      Với tiền thật: quyết định cách làm tròn từng kỳ, ghi vào hợp đồng, và đối chiếu
      với công thức ở các mốc quan trọng.</div>

      '
    clear: true
    say: Phần lẻ bỏ đi mỗi vòng không triệt tiêu mà cộng dồn, lại còn mất cả lãi sinh
      ra từ phần đó, nên độ lệch tăng nhanh hơn thời gian. Với tiền thật, người làm
      nghề quyết định cách làm tròn từng kỳ, ghi vào hợp đồng, và đối chiếu với công
      thức ở các mốc quan trọng.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Lệch một: <code>&lt;</code>
      thay cho <code>&lt;=</code>.</div><div class="code"><div><span class="kw">int</span>
      lanA = 0;</div><div><span class="kw">for</span> (<span class="kw">int</span>
      thang = 1; thang &lt; 12; thang++) {    <span class="cm">// dấu &lt; : dừng
      trước 12</span></div><div>    lanA++;</div><div>}</div><div><span class="kw">int</span>
      lanB = 0;</div><div><span class="kw">for</span> (<span class="kw">int</span>
      thang = 1; thang &lt;= 12; thang++) {   <span class="cm">// dấu &lt;= : chạy
      cả tháng 12</span></div><div>    lanB++;</div><div>}</div><div>System.out.println(lanA
      + " va " + lanB);</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>11
      va 12</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất là lệch một lần. Hai vòng lặp chỉ khác nhau một dấu bằng. Dấu
      nhỏ hơn hẳn dừng trước tháng mười hai, chạy mười một lần. Dấu nhỏ hơn hoặc bằng
      chạy đủ mười hai lần. Cách tránh là dùng công thức cuối trừ đầu cộng một để
      đếm trước số lần.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Quên tăng biến đếm: vòng
      lặp không bao giờ dừng.</div><div class="code"><div><span class="kw">int</span>
      thang = 1;</div><div><span class="kw">int</span> soVong = 0;                 <span
      class="cm">// bộ đếm an toàn, chỉ để chương trình mẫu tự dừng</span></div><div><span
      class="kw">while</span> (thang &lt;= 12) {</div><div>    soVong++;</div><div>    <span
      class="kw">if</span> (soVong == 1000) {</div><div>        System.out.println("Da
      1000 vong, thang van = " + thang);</div><div>        <span class="kw">break</span>;                  <span
      class="cm">// thoát hẳn vòng lặp</span></div><div>    }</div><div>    <span
      class="cm">// quên viết: thang++;</span></div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>Da 1000 vong, thang van = 1</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai là quên tăng biến đếm trong vòng lặp trong khi. Tháng mãi bằng
      một, điều kiện mãi đúng, nên vòng lặp không bao giờ dừng. Chương trình mẫu có
      thêm bộ đếm an toàn, tới vòng thứ một nghìn thì dùng lệnh thoát, để ta thấy
      tháng vẫn bằng một. Trước khi chạy, hãy chỉ ra dòng nào làm điều kiện tiến dần
      tới sai.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Cộng dồn số thực trong
      vòng lặp.</div><div class="code"><div><span class="kw">double</span> tongThuc
      = 0;</div><div><span class="kw">long</span> tongDong = 0;</div><div><span class="kw">for</span>
      (<span class="kw">int</span> i = 1; i &lt;= 10; i++) {</div><div>    tongThuc
      += 0.1;            <span class="cm">// 0,1 nghìn đồng mỗi lần</span></div><div>    tongDong
      += 100;            <span class="cm">// 100 đồng mỗi lần</span></div><div>}</div><div>System.out.println(tongThuc);</div><div>System.out.println(tongDong);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>0.9999999999999999</div><div>1000</div></div>
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba hay gặp ở người đã đi làm, là cộng dồn số thực trong vòng lặp.
      Cộng không phẩy một mười lần không ra một, mà ra một số nhỏ hơn một một chút.
      Sai số nhỏ của từng lần cộng dồn lại sau mỗi vòng. Biến số nguyên dài tính theo
      đồng thì ra đúng một nghìn.
