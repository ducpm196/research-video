    - '1.2'
    say: Đáp án, ta lập bảng. Vòng một và hai cộng vào, tổng là ba. Vòng ba, ba chia
      hết cho ba nên bỏ qua. Vòng bốn và năm cộng, tổng là mười hai. Vòng sáu bỏ qua,
      vòng bảy cộng, tổng là mười chín. Vòng tám, tám lớn hơn bảy nên thoát, các vòng
      chín, mười không bao giờ chạy.
    clear: true
  - show: $$1 + 2 + 4 + 5 + 7 = \hl{19}$$<p><b>Kết quả chạy</b></p><div class="code"><div>tong
      = 19</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Kiểm lại, các số được cộng là một, hai, bốn, năm, bảy, tổng là mười chín.
      Chạy thật, chương trình in tổng bằng mười chín.
- id: practice
  kind: practice
  title: 'Tự làm: tiết kiệm sáu tháng'
  steps:
  - show: '<p><b>Đề</b>: gửi 50 000 000 đồng, lãi 0,6% mỗi tháng, lãi nhập vào gốc.</p>

      <ol><li>Vòng lặp đếm chạy <b>6 tháng</b>; mỗi tháng in <code>Thang 1: lai 300000,
      so du 50300000</code></li>

      <li>Sau vòng lặp in <code>Thang dau tien vuot 51 trieu: …</code></li></ol>

      <p class="note">Lãi tính bằng số nguyên: <code>soDu * 6 / 1000</code>. Tệp tên
      <code>TietKiem.java</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 90
    say: Bây giờ tới phần bạn tự làm trên máy. Gửi năm mươi triệu đồng, lãi không
      phẩy sáu phần trăm mỗi tháng, lãi nhập vào gốc. Viết chương trình dùng vòng
      lặp đếm sáu tháng, mỗi tháng in lãi và số dư. Sau vòng lặp in ra tháng đầu tiên
      số dư vượt năm mươi mốt triệu. Lãi tính bằng số nguyên, nhân sáu rồi chia một
      nghìn. Hãy dừng video, mở trình soạn mã và tự viết, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>Thang 1: lai 300000,
      so du 50300000</div><div>Thang 2: lai 301800, so du 50601800</div><div>Thang
      3: lai 303610, so du 50905410</div><div>Thang 4: lai 305432, so du 51210842</div><div>Thang
      5: lai 307265, so du 51518107</div><div>Thang 6: lai 309108, so du 51827215</div><div>Thang
      dau tien vuot 51 trieu: 4</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh JVA L04 TietKiem.java</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> dùng biến <code>thangVuot</code> bắt
      đầu bằng 0; trong vòng lặp, nếu nó còn bằng 0 <b>và</b> số dư đã vượt 51 triệu
      thì gán nó bằng số tháng hiện tại.

      Lời giải đầy đủ nằm ở <code>labs/JVA/L04/loi_giai.java</code> — chỉ mở sau khi
      bạn đã thử.</div>

      '
    say: Nếu kẹt, dùng một biến nhớ tháng đầu tiên vượt, bắt đầu bằng không. Trong
      vòng lặp, khi biến này còn bằng không và số dư đã vượt năm mươi mốt triệu, gán
      nó bằng số tháng hiện tại. Lời giải đầy đủ nằm trong thư mục thực hành của bài,
      chỉ mở sau khi bạn đã tự thử.
  lab: labs/JVA/L04
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>tìm phần lặp lại</span><span class=''a''>→</span><span
      class=''n''>biến đếm: bắt đầu, điều kiện, bước</span><span class=''a''>→</span><span
      class=''n''>số lần = cuối − đầu + 1</span><span class=''a''>→</span><span class=''n''>cộng
      dồn và đếm</span><span class=''a''>→</span><span class=''n''>điều kiện phải
      tiến tới sai</span></div>'
    say: Tổng kết chuỗi logic. Tìm phần lặp lại để làm thân vòng lặp. Biến đếm cần
      bắt đầu, điều kiện và bước. Đếm trước số lần bằng cuối trừ đầu cộng một. Hai
      mẫu hay dùng là cộng dồn và đếm. Và điều kiện phải tiến dần tới sai thì vòng
      lặp mới dừng.
  - show: '<div class=''box key''><b>Tư duy:</b> trước khi chạy một vòng lặp, trả
      lời ba câu: nó chạy <b>mấy lần</b>, dòng nào làm nó <b>dừng</b>,

      và biến cộng dồn có phải số nguyên tính theo đồng không.</div>

      '
    say: Điều cần mang theo. Trước khi chạy một vòng lặp, hãy trả lời ba câu. Nó chạy
      mấy lần, dòng nào làm nó dừng, và biến cộng dồn có phải số nguyên tính theo
      đồng không.
