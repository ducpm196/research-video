id: L04
course: JVA
series: JVA · Lập trình Java từ con số 0
title: Bài 4 — Vòng lặp
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: 'curriculum/jva.yaml L04; audit/jva/verify_jva.py L04 (javac/java chạy thật);
  The Java Language Specification, Java SE 21: §14.12 (while), §14.13 (do: thân chạy
  trước khi kiểm), §14.14.1 (for cơ bản: khởi tạo, điều kiện, cập nhật), §14.15 (break),
  §14.16 (continue), §15.26.2 (+= ép về kiểu biến), §5.1.3 (ép double sang long bỏ
  phần lẻ); java.lang.Math.pow (Java SE 21 API); dev.java/learn'
assumes: []
objectives:
- Viết vòng lặp trong khi, vòng lặp đếm, vòng lặp làm rồi mới kiểm, và chọn đúng loại
- Đếm trước số lần chạy bằng cuối trừ đầu cộng một, tránh lỗi lệch một
- Dùng hai mẫu cộng dồn và đếm, cùng lệnh thoát và lệnh bỏ qua
- Tính lãi cộng dồn bằng số nguyên theo đồng và kiểm lại bằng công thức lãi kép
asr_reviewed:
- sentence: Tìm phần lặp lại để làm thân vòng lặp.
  reason: 'ASR chép “Tìm phần lập lại để làm thân vòng lập.” (0.778): lệch thanh thuần
    Việt lặp/lập (hai lần); đủ từ — NOT_VERIFIED bằng tai người'
scenes:
- id: hook
  kind: hook
  title: Mười hai tháng lãi, phải viết mười hai lần?
  steps:
  - show: <p><b>Tính lãi ba tháng bằng tay</b></p><div class="code"><div><span class="kw">long</span>
      soDu = 100000000;</div><div>soDu += soDu * 5 / 1000;      <span class="cm">//
      tháng 1</span></div><div>soDu += soDu * 5 / 1000;      <span class="cm">// tháng
      2</span></div><div>soDu += soDu * 5 / 1000;      <span class="cm">// tháng 3</span></div><div>System.out.println(soDu);     <span
      class="cm">// còn 9 dòng y hệt nữa mới đủ 12 tháng</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>101507512</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Muốn tính lãi cộng dồn ba tháng, ta viết ba dòng giống hệt nhau. Mười hai
      tháng thì mười hai dòng. Còn đếm một nghìn lệnh chuyển tiền xem bao nhiêu lệnh
      vượt hạn mức, chẳng lẽ viết một nghìn dòng.
  - show: '<div class="box key">Hôm nay: <b>vòng lặp</b> bảo máy làm lại một khối
      lệnh nhiều lần, với hai mẫu dùng hằng ngày:

      <b>cộng dồn</b> và <b>đếm</b>. Và ba lỗi kinh điển: lệch một, không dừng, cộng
      số thực bị lệch.</div>

      '
    say: 'Hôm nay ta học vòng lặp, cách bảo máy làm lại một khối lệnh nhiều lần, với
      hai mẫu dùng hằng ngày là cộng dồn và đếm. Ta cũng gặp ba lỗi kinh điển: lệch
      một lần, vòng lặp không dừng, và cộng số thực bị lệch.'
- id: prereq
  kind: prereq
  title: Ôn lại điều kiện và phép gán từ các bài trước
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      điều kiện</td><td><code>thang &lt;= 12</code> cho đúng hoặc sai</td></tr><tr><td>②
      rẽ nhánh</td><td><code>if</code>: điều kiện đúng mới làm khối trong ngoặc nhọn</td></tr><tr><td>③
      cộng dồn, tăng một</td><td><code>soDu += lai;</code> và <code>thang++;</code></td></tr><tr><td>④
      chia nguyên</td><td><code>soDu * 5 / 1000</code>: nhân trước, chia sau, bỏ phần
      lẻ đồng</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 1
    say: Ta ôn lại bốn điều. Phép so sánh cho kết quả đúng hoặc sai. Lệnh rẽ nhánh
      nếu chỉ làm khối khi điều kiện đúng. Cộng bằng là cộng dồn, hai dấu cộng là
      tăng thêm một. Và tính phần trăm bằng số nguyên thì nhân trước, chia sau. Vòng
      lặp chỉ là lệnh rẽ nhánh được hỏi lại nhiều lần.
- id: sym
  kind: symbol
  title: Giải mã ba kiểu vòng lặp và hai lệnh điều khiển
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>while
      (đk) { … }</code></td><td><b>trong khi</b> điều kiện đúng thì làm khối, rồi
      kiểm lại</td></tr><tr><td><code>for (bắt đầu; đk; bước) { … }</code></td><td><b>vòng
      lặp đếm</b>: gom bắt đầu, điều kiện, bước vào một dòng</td></tr><tr><td><code>do
      { … } while (đk);</code></td><td><b>làm trước, kiểm sau</b>: chạy ít nhất một
      lần</td></tr><tr><td><code>break;</code></td><td><b>thoát</b> hẳn vòng lặp</td></tr><tr><td><code>continue;</code></td><td><b>bỏ
      qua</b> phần còn lại của vòng này, sang vòng sau</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: Bảng này có ba kiểu vòng lặp và hai lệnh điều khiển. Vòng lặp trong khi kiểm
      điều kiện, đúng thì làm khối rồi kiểm lại. Vòng lặp đếm gom bắt đầu, điều kiện
      và bước vào một dòng. Vòng lặp làm rồi mới kiểm chạy ít nhất một lần. Lệnh thoát
      ra khỏi vòng lặp ngay. Lệnh bỏ qua nhảy sang vòng sau.
  - show: <div class="code"><div><span class="kw">int</span> i = 1;</div><div><span
      class="kw">while</span> (i &lt;= 3) {                    <span class="cm">//
      kiểm trước, đúng thì làm</span></div><div>    System.out.println("while " +
      i);</div><div>    i++;</div><div>}</div><div><span class="kw">for</span> (<span
      class="kw">int</span> k = 1; k &lt;= 3; k++) {      <span class="cm">// bắt
      đầu; điều kiện; bước</span></div><div>    System.out.println("for " + k);</div><div>}</div></div>
    clear: true
    say: 'Chương trình này in từ một tới ba bằng hai cách. Vòng lặp trong khi cần
      ba thứ rời nhau: biến bắt đầu bằng một, điều kiện, và lệnh tăng ở cuối khối.
      Vòng lặp đếm gom đủ ba thứ đó vào ngoặc tròn ở một dòng, nên khó quên hơn.'
  - show: <div class="code"><div><span class="kw">int</span> n = 10;</div><div><span
      class="kw">do</span> {                                <span class="cm">// làm
      trước, kiểm sau</span></div><div>    System.out.println("do " + n);</div><div>    n++;</div><div>}
      <span class="kw">while</span> (n &lt;= 3);</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>while 1</div><div>while 2</div><div>while 3</div><div>for
      1</div><div>for 2</div><div>for 3</div><div>do 10</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Ở vòng lặp làm rồi mới kiểm, n bằng mười nên điều kiện sai ngay từ đầu. Thế
      mà khối vẫn chạy một lần, vì máy làm trước rồi mới kiểm. Kết quả là ba dòng,
      ba dòng, và đúng một dòng.
- id: intuition
  kind: intuition
  title: 'Hình dung: đi vòng quanh một sân, mỗi vòng hỏi lại một lần'
  steps:
  - show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="150" width="260" height="100" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3"/><text x="150.0" y="192" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">① bắt đầu</text><text x="150.0" y="224" font-size="24"
      text-anchor="middle" fill="#1f2937">thang = 1</text><line x1="285" y1="200"
      x2="372" y2="200" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><polygon
      points="375,200 560,115 745,200 560,285" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text
      x="560" y="195" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">②
      thang &lt;= 12 ?</text><text x="560" y="225" font-size="20" text-anchor="middle"
      fill="#1f2937">điều kiện</text><line x1="747" y1="200" x2="858" y2="200" stroke="#16a34a"
      stroke-width="3.5" marker-end="url(#ah)"/><text x="802" y="190" font-size="22"
      text-anchor="middle" fill="#16a34a">đúng</text><rect x="860" y="150" width="320"
      height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text
      x="1020.0" y="192" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">③
      thân vòng lặp</text><text x="1020.0" y="224" font-size="24" text-anchor="middle"
      fill="#1f2937">tính lãi, cộng dồn</text><line x1="1185" y1="200" x2="1258" y2="200"
      stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><rect x="1260" y="150"
      width="220" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text
      x="1370.0" y="192" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">④
      bước</text><text x="1370.0" y="224" font-size="24" text-anchor="middle" fill="#1f2937">thang++</text><path
      d="M1370,252 L1370,350 L560,350 L560,292" fill="none" stroke="#d97706" stroke-width="3.5"
      marker-end="url(#ah)"/><text x="965" y="340" font-size="22" text-anchor="middle"
      fill="#d97706" font-weight="bold">quay lại hỏi điều kiện</text><line x1="560"
      y1="113" x2="560" y2="50" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="580" y="45" font-size="22" text-anchor="start" fill="#dc2626" font-weight="bold">sai:
      ra khỏi vòng lặp, chạy lệnh tiếp theo</text></svg></div>'
    clear: true
    say: Hãy hình dung vòng lặp đếm như đi vòng quanh một sân. Bước một, đặt biến
      tháng bằng một, chỉ làm một lần. Bước hai, hỏi điều kiện. Đúng thì sang bước
      ba, làm thân vòng lặp, rồi bước bốn tăng tháng thêm một. Sau đó quay lại hỏi
      điều kiện. Khi điều kiện sai, máy ra khỏi vòng lặp và chạy lệnh tiếp theo.
  - show: '<div class="code"><div><span class="kw">long</span> hanMuc = 5000000;                      <span
      class="cm">// hạn mức một lệnh (số minh hoạ)</span></div><div><span class="kw">int</span>
      dem = 0;</div><div><span class="kw">for</span> (<span class="kw">int</span>
      i = 1; i &lt;= 8; i++) {</div><div>    <span class="kw">long</span> soTien =
      (i * 7 % 10) * 1000000L;  <span class="cm">// giả lập số tiền lệnh thứ i</span></div><div>    <span
      class="kw">if</span> (soTien &lt;= hanMuc) {</div><div>        <span class="kw">continue</span>;                           <span
      class="cm">// không vượt: sang lệnh sau</span></div><div>    }</div><div>    dem++;</div><div>    System.out.println("Lenh
      " + i + ": " + soTien);</div><div>}</div><div>System.out.println("So lenh vuot:
      " + dem);</div></div>'
    clear: true
    say: Mẫu cộng dồn ta sẽ làm ở ví dụ lãi, còn đây là mẫu đếm. Ta giả lập tám lệnh
      chuyển tiền, số tiền lệnh thứ i tính bằng phép chia lấy dư, vì chưa học cách
      lưu nhiều số. Lệnh nào không vượt hạn mức năm triệu thì lệnh bỏ qua nhảy sang
      lệnh sau. Lệnh vượt thì biến đếm tăng một.
  - show: '<table class=''t''><tr><th>lệnh i</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr><tr><td>i
      × 7 % 10 (triệu)</td><td>7</td><td>4</td><td>1</td><td>8</td><td>5</td><td>2</td><td>9</td><td>6</td></tr><tr><td>vượt
      5 triệu?</td><td><b>có</b></td><td>không</td><td>không</td><td><b>có</b></td><td>không
      (bằng)</td><td>không</td><td><b>có</b></td><td><b>có</b></td></tr></table><p><b>Kết
      quả chạy</b></p><div class="code"><div>Lenh 1: 7000000</div><div>Lenh 4: 8000000</div><div>Lenh
      7: 9000000</div><div>Lenh 8: 6000000</div><div>So lenh vuot: 4</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bảng này tính tay tám lệnh. Lệnh năm đúng bằng năm triệu, không vượt, nên
      bị bỏ qua. Có bốn lệnh vượt là lệnh một, bốn, bảy và tám. Chạy thật, chương
      trình in đúng bốn lệnh đó và số lệnh vượt là bốn.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ mười hai dòng giống nhau tới một vòng lặp'
  checks:
  - 12 - 1 + 1 == 12
  - len(range(1, 13)) == 12
  - len(range(1, 12)) == 11
  - 11 - 1 + 1 == 11
  steps:
  - show: <div class="code"><div>soDu += soDu * 5 / 1000;      <span class="cm">//
      tháng 1</span></div><div>soDu += soDu * 5 / 1000;      <span class="cm">// tháng
      2</span></div><div>soDu += soDu * 5 / 1000;      <span class="cm">// tháng 3</span></div></div><p><b>Bước
      1.</b> Ba dòng <b>giống hệt</b>; chỉ chú thích tháng là khác. Phần lặp lại là
      thân, phần thay đổi là số tháng.</p>
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, tìm phần lặp lại. Ba dòng tính lãi giống hệt nhau, chỉ có số tháng
      là khác, nên dòng tính lãi là thân vòng lặp, còn số tháng là biến đếm.
  - show: '<div class="code"><div><span class="kw">for</span> (<span class="kw">int</span>
      thang = 1; thang &lt;= 12; thang++) {</div></div><p><b>Bước 2.</b> Biến đếm
      cần ba thứ: <b>bắt đầu</b> <code>thang = 1</code>, <b>điều kiện</b> <code>thang
      &lt;= 12</code>, <b>bước</b> <code>thang++</code>.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước hai, viết đầu vòng lặp. Vì cần chạy từ tháng một tới tháng mười hai,
      nên biến tháng bắt đầu bằng một, điều kiện là nhỏ hơn hoặc bằng mười hai, và
      sau mỗi vòng tăng một.
  - show: '<p><b>Bước 3.</b> Tháng nhận lần lượt 1, 2, …, 12, đếm cả hai đầu nên:</p>

      $$\text{số lần chạy} = \text{cuối} - \text{đầu} + 1 = 12 - 1 + 1 = \hl{12}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, đếm số lần thân vòng lặp chạy. Biến tháng nhận một, hai, cho tới
      mười hai, và vì đếm cả hai đầu nên số lần là cuối trừ đầu cộng một. Mười hai
      trừ một cộng một bằng mười hai lần, đúng mười hai tháng.
  - show: '<p><b>Bước 4.</b> Nếu viết <code>thang &lt; 12</code> thì số cuối là 11:</p>

      $$11 - 1 + 1 = \hl{11} \text{ lần, thiếu một tháng}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước bốn, thử đổi dấu. Nếu viết nhỏ hơn hẳn mười hai thì tháng cuối cùng
      được chạy là mười một. Theo cùng công thức, số lần là mười một, thiếu đúng một
      tháng. Chọn dấu sai là lỗi lệch một mà ta sẽ gặp ở phần lỗi.
- id: example
  kind: example
  title: 'Ví dụ: lãi cộng dồn mười hai tháng bằng số nguyên'
  checks:
  - 100000000 * 5 // 1000 == 500000
  - 100500000 * 5 // 1000 == 502500
  - 101002500 * 5 // 1000 == 505012
  - 11 - 4 + 1 == 8
  - 105639579 * 5 // 1000 == 528197
  - 105639579 + 528197 == 106167776
  steps:
  - show: '<p><b>Tệp LaiThang.java</b></p><div class="code"><div><span class="kw">long</span>
      soDu = 100000000;                      <span class="cm">// 100 triệu đồng</span></div><div><span
      class="kw">for</span> (<span class="kw">int</span> thang = 1; thang &lt;= 12;
      thang++) {</div><div>    <span class="kw">long</span> lai = soDu * 5 / 1000;             <span
      class="cm">// 0,5% mỗi tháng (số minh hoạ)</span></div><div>    soDu += lai;                            <span
      class="cm">// cộng dồn: lãi nhập vào gốc</span></div><div>    <span class="kw">if</span>
      (thang &lt;= 3 || thang &gt;= 11) {</div><div>        System.out.println("Thang
      " + thang + ": lai " + lai + ", so du " + soDu);</div><div>    }</div><div>}</div><div>System.out.println("Sau
      12 thang: " + soDu);</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Đây là chương trình đầy đủ. Số dư đầu một trăm triệu đồng, lãi minh hoạ không
      phẩy năm phần trăm mỗi tháng. Mỗi vòng tính lãi bằng số nguyên rồi cộng dồn,
      và in ba tháng đầu cùng hai tháng cuối.
  - show: $$① \; 100\,000\,000 \times 5 / 1000 = \hl{500\,000} \;\to\; 100\,500\,000$$$$②
      \; 100\,500\,000 \times 5 / 1000 = \hl{502\,500} \;\to\; 101\,002\,500$$
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ nhất, tháng một, lãi là năm trăm nghìn, số dư thành một trăm
      triệu năm trăm nghìn. Phép tính thứ hai, tháng hai tính lãi trên số dư mới,
      nên lãi lớn hơn một chút, năm trăm linh hai nghìn năm trăm. Đó chính là cộng
      dồn, lãi tháng trước sinh thêm lãi ở tháng sau.
  - show: $$③ \; 101\,002\,500 \times 5 / 1000 = 505\,012.5 \to \hl{505\,012} \;\to\;
      101\,507\,512$$<p>Phép chia nguyên bỏ 0.5 đồng. Số dư tháng 3 trùng với bản
      viết tay ở đầu bài ✓</p>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, tháng ba, lãi đúng ra là năm trăm linh năm nghìn không
      trăm mười hai phẩy năm. Vì chia số nguyên nên phần lẻ nửa đồng bị bỏ. Số dư
      tháng ba trùng với bản viết tay ở đầu bài, nghĩa là vòng lặp làm đúng việc ta
      đã làm bằng tay.
  - show: '$$④ \; \text{tháng 4 tới 11: thân vòng lặp chạy thêm } 11 - 4 + 1 = 8 \text{
      lần} \;\to\; 105\,639\,579$$$$⑤ \; 105\,639\,579 \times 5 / 1000 = 528\,197.895
      \to \hl{528\,197} \;\to\; \hl{106\,167\,776}$$'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, từ tháng bốn tới tháng mười một, thân vòng lặp chạy thêm
      tám lần, ta để máy làm và đọc số dư nó in ra. Phép tính thứ năm, tháng mười
      hai, lãi khoảng năm trăm hai mươi tám nghìn đồng, bỏ phần lẻ. Số dư cuối là
      khoảng một trăm linh sáu triệu một trăm sáu mươi tám nghìn.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Thang 1: lai 500000, so
      du 100500000</div><div>Thang 2: lai 502500, so du 101002500</div><div>Thang
      3: lai 505012, so du 101507512</div><div>Thang 11: lai 525570, so du 105639579</div><div>Thang
      12: lai 528197, so du 106167776</div><div>Sau 12 thang: 106167776</div></div>'
    clear: true
    say: Chạy thật, sáu dòng in ra khớp với từng phép tính tay, kể cả tháng ba đã
      bỏ nửa đồng.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: công thức lãi kép'
  checks:
  - abs(100000000 * 1.005**12 - 106167781.19) < 0.01
  - '__import__(''functools'').reduce(lambda s, _: s + s * 5 // 1000, range(12), 100000000)
    == 106167776'
  - int(100000000 * 1.005**12) - 106167776 == 5
  - (1.005**12 - 1) / 0.005 < 13
  steps:
  - show: '<p>Không làm tròn thì mỗi tháng số dư nhân với $1.005$, nên 12 tháng là
      nhân 12 lần:</p>

      $$100\,000\,000 \times 1.005^{12} \approx 106\,167\,781.19$$<div class="code"><div><span
      class="kw">double</span> congThuc = 100000000 * Math.pow(1.005, 12);   <span
      class="cm">// gốc nhân 1,005 mũ 12</span></div><div>System.out.println((<span
      class="kw">long</span>) congThuc);                  <span class="cm">// ép kiểu:
      bỏ phần lẻ</span></div></div><span class=''note''><code>Math.pow(a, n)</code>
      là lệnh có sẵn của Java, tính a mũ n, ra số thực; <code>(long)</code> ép về
      số nguyên dài, bỏ phần lẻ.</span><p><b>Kết quả chạy</b></p><div class="code"><div>106167781</div></div>

      '
    focus:
    - 1
    - 3
    - 5
    clear: true
    say: Đường kiểm khác là công thức lãi kép. Nếu không làm tròn, mỗi tháng số dư
      được nhân với một phẩy không không năm, nên mười hai tháng là nhân mười hai
      lần. Java có sẵn lệnh tính lũy thừa, ép về số nguyên dài để dễ đọc, và chương
      trình in ra số trên màn hình.
  - show: '<p>Chênh lệch: $106\,167\,781 - 106\,167\,776 = \hl{5}$ đồng. Hợp lý, vì
      mỗi tháng phép chia nguyên bỏ <b>dưới 1 đồng</b>,

      12 tháng bỏ chưa tới 13 đồng (kể cả phần lãi của số tiền bị bỏ).</p>

      '
    clear: true
    say: Hai cách chênh nhau năm đồng. Con số này hợp lý, vì mỗi tháng phép chia nguyên
      chỉ bỏ đi chưa tới một đồng. Mười hai tháng bỏ chưa tới mười ba đồng, kể cả
      phần lãi của số tiền bị bỏ, nên năm đồng nằm trong giới hạn đó.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Lệch một: <code>&lt;</code>
      thay cho <code>&lt;=</code>.</div><div class="code"><div><span class="kw">int</span>
      lanA = 0;</div><div><span class="kw">for</span> (<span class="kw">int</span>
      thang = 1; thang &lt; 12; thang++) {    <span class="cm">// dấu &lt; : dừng
      trước 12</span></div><div>    lanA++;</div><div>}</div><div><span class="kw">int</span>
      lanB = 0;</div><div><span class="kw">for</span> (<span class="kw">int</span>
      thang = 1; thang &lt;= 12; thang++) {   <span class="cm">// dấu &lt;= : chạy
      cả tháng 12</span></div><div>    lanB++;</div><div>}</div><div>System.out.println(lanA
      + " va " + lanB);</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>11
      va 12</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất là lệch một lần. Hai vòng lặp chỉ khác nhau một dấu bằng. Dấu
      nhỏ hơn hẳn dừng trước tháng mười hai, chạy mười một lần. Dấu nhỏ hơn hoặc bằng
      chạy đủ mười hai lần. Cách tránh là dùng công thức cuối trừ đầu cộng một để
      đếm trước số lần.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Quên tăng biến đếm: vòng
      lặp không bao giờ dừng.</div><div class="code"><div><span class="kw">int</span>
      thang = 1;</div><div><span class="kw">int</span> soVong = 0;                 <span
      class="cm">// bộ đếm an toàn, chỉ để chương trình mẫu tự dừng</span></div><div><span
      class="kw">while</span> (thang &lt;= 12) {</div><div>    soVong++;</div><div>    <span
      class="kw">if</span> (soVong == 1000) {</div><div>        System.out.println("Da
      1000 vong, thang van = " + thang);</div><div>        <span class="kw">break</span>;                  <span
      class="cm">// thoát hẳn vòng lặp</span></div><div>    }</div><div>    <span
      class="cm">// quên viết: thang++;</span></div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>Da 1000 vong, thang van = 1</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai là quên tăng biến đếm trong vòng lặp trong khi. Tháng mãi bằng
      một, điều kiện mãi đúng, nên vòng lặp không bao giờ dừng. Chương trình mẫu có
      thêm bộ đếm an toàn, tới vòng thứ một nghìn thì dùng lệnh thoát, để ta thấy
      tháng vẫn bằng một. Trước khi chạy, hãy chỉ ra dòng nào làm điều kiện tiến dần
      tới sai.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Cộng dồn số thực trong
      vòng lặp.</div><div class="code"><div><span class="kw">double</span> tongThuc
      = 0;</div><div><span class="kw">long</span> tongDong = 0;</div><div><span class="kw">for</span>
      (<span class="kw">int</span> i = 1; i &lt;= 10; i++) {</div><div>    tongThuc
      += 0.1;            <span class="cm">// 0,1 nghìn đồng mỗi lần</span></div><div>    tongDong
      += 100;            <span class="cm">// 100 đồng mỗi lần</span></div><div>}</div><div>System.out.println(tongThuc);</div><div>System.out.println(tongDong);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>0.9999999999999999</div><div>1000</div></div>
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba hay gặp ở người đã đi làm, là cộng dồn số thực trong vòng lặp.
      Cộng không phẩy một mười lần không ra một, mà ra một số nhỏ hơn một một chút.
      Sai số nhỏ của từng lần cộng dồn lại sau mỗi vòng. Biến số nguyên dài tính theo
      đồng thì ra đúng một nghìn.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 1 + 2 + 4 + 5 + 7 == 19
  - sum(i for i in range(1, 8) if i % 3 != 0) == 19
  steps:
  - show: <p><b>Đoán dòng in ra</b></p><div class="code"><div><span class="kw">int</span>
      tong = 0;</div><div><span class="kw">for</span> (<span class="kw">int</span>
      i = 1; i &lt;= 10; i++) {</div><div>    <span class="kw">if</span> (i % 3 ==
      0) {</div><div>        <span class="kw">continue</span>;</div><div>    }</div><div>    <span
      class="kw">if</span> (i &gt; 7) {</div><div>        <span class="kw">break</span>;</div><div>    }</div><div>    tong
      += i;</div><div>}</div><div>System.out.println("tong = " + tong);</div></div>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 20
    clear: true
    say: Bây giờ tới phần bạn tự làm. Biến i chạy từ một tới mười. Số chia hết cho
      ba thì bị bỏ qua. Khi i lớn hơn bảy thì thoát. Còn lại thì cộng i vào tổng.
      Hãy dừng video, lập bảng từng vòng và viết ra dòng in ra.
  - show: <table class='t'><tr><th>i</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr><tr><td>việc
      làm</td><td>cộng</td><td>cộng</td><td>bỏ qua</td><td>cộng</td><td>cộng</td><td>bỏ
      qua</td><td>cộng</td><td><b>thoát</b></td></tr><tr><td>tong sau vòng</td><td>1</td><td>3</td><td>3</td><td>7</td><td>12</td><td>12</td><td>19</td><td>19</td></tr></table>
    focus:
    - 1
    - '1.3'
    - '1.2'
    - - '1.2'
      - '1.3'
    - '1.2'
    - '1.2'
    say: Đáp án, ta lập bảng. Vòng một và hai cộng vào, tổng là ba. Vòng ba, ba chia
      hết cho ba nên bỏ qua. Vòng bốn và năm cộng, tổng là mười hai. Vòng sáu bỏ qua,
      vòng bảy cộng, tổng là mười chín. Vòng tám, tám lớn hơn bảy nên thoát, các vòng
      chín, mười không bao giờ chạy.
    clear: true
  - show: $$1 + 2 + 4 + 5 + 7 = \hl{19}$$<p><b>Kết quả chạy</b></p><div class="code"><div>tong
      = 19</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Kiểm lại, các số được cộng là một, hai, bốn, năm, bảy, tổng là mười chín.
      Chạy thật, chương trình in tổng bằng mười chín.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>tìm phần lặp lại</span><span class=''a''>→</span><span
      class=''n''>biến đếm: bắt đầu, điều kiện, bước</span><span class=''a''>→</span><span
      class=''n''>số lần = cuối − đầu + 1</span><span class=''a''>→</span><span class=''n''>cộng
      dồn và đếm</span><span class=''a''>→</span><span class=''n''>điều kiện phải
      tiến tới sai</span></div>'
    say: Tổng kết chuỗi logic. Tìm phần lặp lại để làm thân vòng lặp. Biến đếm cần
      bắt đầu, điều kiện và bước. Đếm trước số lần bằng cuối trừ đầu cộng một. Hai
      mẫu hay dùng là cộng dồn và đếm. Và điều kiện phải tiến dần tới sai thì vòng
      lặp mới dừng.
  - show: '<div class=''box key''><b>Tư duy:</b> trước khi chạy một vòng lặp, trả
      lời ba câu: nó chạy <b>mấy lần</b>, dòng nào làm nó <b>dừng</b>,

      và biến cộng dồn có phải số nguyên tính theo đồng không.</div>

      '
    say: Điều cần mang theo. Trước khi chạy một vòng lặp, hãy trả lời ba câu. Nó chạy
      mấy lần, dòng nào làm nó dừng, và biến cộng dồn có phải số nguyên tính theo
      đồng không.
