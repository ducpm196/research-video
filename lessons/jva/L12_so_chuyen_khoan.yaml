      đầu</td><td>lệch tổng: 3 500 000 thay vì 3 000 000</td><td>thừa $500\,000 =
      1\,000\,000 - 500\,000$: số dư cũ của A trừ của B</td></tr><tr><td><code>at
      SoCai.kiem</code></td><td>phương thức kiểm phát hiện</td><td>đây chỉ là nơi
      <b>phát hiện</b></td></tr><tr><td><code>at SoCai.chuyen</code></td><td>kiểm
