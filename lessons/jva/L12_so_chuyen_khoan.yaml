    say: 'Một lần chuyển gồm hai bút toán: trừ bên gửi và cộng bên nhận cùng một số
      tiền, nên tổng thay đổi bằng không. Từ đó có hai quy tắc. Kiểm tra trước, sửa
      sau, để lệnh bị từ chối không chạm vào số dư nào. Và kiểm bất biến sau mỗi lệnh,
      để lỗi lộ ra ngay tại lệnh gây ra nó.'
- id: formula
  kind: formula
  title: 'Suy ra từng bước: viết lớp sổ cái'
  checks:
  - 1000000 + 500000 + 1500000 == 3000000
  steps:
  - show: <p><b>Bước 1. Bản đồ số dư và tổng gốc</b></p><div class="code"><div><span
      class="kw">class</span> SoCai {</div><div>    <span class="kw">private</span>
      HashMap&lt;String, Long&gt; soDu = <span class="kw">new</span> HashMap&lt;&gt;();</div><div>    <span
      class="kw">private</span> <span class="kw">long</span> tongGoc = 0;</div><div>
      </div><div>    <span class="kw">void</span> mo(String stk, <span class="kw">long</span>
      tien) {</div><div>        soDu.put(stk, tien);</div><div>        tongGoc +=
      tien;                      <span class="cm">// tổng tiền phải giữ mãi</span></div><div>    }</div><div>
      </div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, sổ cái giữ một bản đồ riêng từ số tài khoản tới số dư, và một tổng
      gốc. Mỗi lần mở tài khoản, ta đặt số dư vào bản đồ và cộng vào tổng gốc, vì
      đó là tổng tiền phải giữ mãi.
  - show: '<p><b>Bước 2. Cộng tổng, và lấy số dư an toàn</b></p><div class="code"><div><span
      class="kw">long</span> tong() {</div><div>    <span class="kw">long</span> t
      = 0;</div><div>    <span class="kw">for</span> (<span class="kw">long</span>
      x : soDu.values()) {</div><div>        t += x;</div><div>    }</div><div>    <span
      class="kw">return</span> t;</div><div>}</div></div><div class="code"><div><span
      class="kw">long</span> lay(String stk) {</div><div>    Long v = soDu.get(stk);</div><div>    <span
      class="kw">if</span> (v == <span class="kw">null</span>) {</div><div>        <span
      class="kw">throw</span> <span class="kw">new</span> IllegalArgumentException("Khong
      co tai khoan " + stk);</div><div>    }</div><div>    <span class="kw">return</span>
      v;</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước hai, phương thức tổng duyệt mọi giá trị của bản đồ và cộng dồn. Phương
      thức lấy dùng lớp bọc, vì bản đồ trả giá trị rỗng khi không có khoá, và khi
      đó ta ném ngoại lệ đối số.
  - show: '<p><b>Bước 3. Chuyển: kiểm tra trước</b></p><div class="code"><div><span
      class="kw">void</span> chuyen(Lenh l) <span class="kw">throws</span> KhongDuTien
      {</div><div>    <span class="kw">long</span> a = lay(l.tu());                 <span
      class="cm">// kiểm tra trước ...</span></div><div>    <span class="kw">long</span>
      b = lay(l.den());</div><div>    <span class="kw">if</span> (l.tien() &lt;= 0)
      {</div><div>        <span class="kw">throw</span> <span class="kw">new</span>
      IllegalArgumentException("So tien phai duong");</div><div>    }</div><div>    <span
      class="kw">if</span> (l.tien() &gt; a) {</div><div>        <span class="kw">throw</span>
      <span class="kw">new</span> KhongDuTien(l.tu() + " chi co " + a);</div><div>    }</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước ba, phương thức chuyển kiểm tra trước. Lấy số dư hai bên, nên tài khoản
      không có sẽ bị ném ngay. Số tiền phải dương, và không được vượt số dư bên gửi,
      nếu không thì ném ngoại lệ không đủ tiền. Đến đây chưa có số dư nào bị sửa.
  - show: '<p><b>Bước 4. Sửa sau, rồi kiểm bất biến</b></p><div class="code"><div>    soDu.put(l.tu(),
      a - l.tien());       <span class="cm">// ... sửa sau: trừ bên gửi</span></div><div>    soDu.put(l.den(),
      b + l.tien());      <span class="cm">// cộng bên nhận</span></div><div>    kiem();                               <span
      class="cm">// kiểm bất biến sau MỖI lần chuyển</span></div><div>}</div><div>
      </div><div><span class="kw">void</span> kiem() {</div><div>    <span class="kw">if</span>
      (tong() != tongGoc) {</div><div>        <span class="kw">throw</span> <span
      class="kw">new</span> IllegalStateException("Lech tong " + tong() + " != " +
      tongGoc);</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước bốn, qua hết kiểm tra mới sửa: trừ bên gửi, cộng bên nhận. Ngay sau
      đó gọi phương thức kiểm. Nếu tổng khác tổng gốc thì ném ngoại lệ trạng thái
      sai, vì bất biến đã vỡ.'
  - show: '<p><b>Bước 5. Chạy danh sách lệnh</b></p><div class="code"><div><span class="kw">for</span>
      (Lenh l : ds) {</div><div>    <span class="kw">try</span> {</div><div>        so.chuyen(l);</div><div>        System.out.println("OK
      " + l);</div><div>    } <span class="kw">catch</span> (KhongDuTien e) {</div><div>        System.out.println("TU
      CHOI " + e.getMessage());</div><div>    } <span class="kw">catch</span> (IllegalArgumentException
      e) {</div><div>        System.out.println("SAI LENH " + e.getMessage());</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước năm, hàm chính duyệt danh sách lệnh. Mỗi lệnh đặt trong khối thử. Không
      đủ tiền thì in từ chối, lệnh sai thì in sai lệnh. Lỗi trạng thái thì không bắt,
      vì đó là lỗi lập trình phải lộ ra.
- id: example
  kind: example
  title: 'Ví dụ: chạy bốn lệnh, từng phép tính'
  checks:
  - 1000000 - 300000 == 700000
  - 500000 + 300000 == 800000
  - 1000000 > 800000
  - 1500000 - 200000 == 1300000
  - 700000 + 200000 == 900000
  - 900000 + 800000 + 1300000 == 3000000
  steps:
  - show: <p><b>Ba tài khoản và bốn lệnh</b></p><div class="code"><div>SoCai so =
      <span class="kw">new</span> SoCai();</div><div>so.mo("A", 1000000);</div><div>so.mo("B",
      500000);</div><div>so.mo("C", 1500000);</div><div>ArrayList&lt;Lenh&gt; ds =
      <span class="kw">new</span> ArrayList&lt;&gt;();</div><div>ds.add(<span class="kw">new</span>
      Lenh("A", "B", 300000));</div><div>ds.add(<span class="kw">new</span> Lenh("B",
      "C", 1000000));</div><div>ds.add(<span class="kw">new</span> Lenh("A", "X",
      50000));</div><div>ds.add(<span class="kw">new</span> Lenh("C", "A", 200000));</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ba tài khoản được mở với một triệu, năm trăm nghìn và một triệu rưỡi. Rồi
      có bốn lệnh chuyển. Ta tính từng bước.
  - show: '$$① \; 1\,000\,000 + 500\,000 + 1\,500\,000 = \hl{3\,000\,000} \text{ (tổng
      gốc)}$$$$② \; \text{A→B}: \; A = 1\,000\,000 - 300\,000 = 700\,000, \; B = 500\,000
      + 300\,000 = \hl{800\,000}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất, tổng gốc là ba triệu. Phép tính thứ hai, lệnh A sang
      B ba trăm nghìn hợp lệ, nên A còn bảy trăm nghìn, B thành tám trăm nghìn.
  - show: '$$③ \; \text{B→C}: \; 1\,000\,000 > 800\,000 \to \text{từ chối, không số
