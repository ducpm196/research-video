    say: 'Bây giờ tới phần bạn tự làm. Sổ đã sửa đúng, số dư đầu vẫn là một triệu,
      năm trăm nghìn và một triệu rưỡi. Ba lệnh mới: B chuyển cho A sáu trăm nghìn,
