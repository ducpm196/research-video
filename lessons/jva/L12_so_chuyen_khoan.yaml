- sentence: 'Lệnh ba nằm đúng biên: một triệu không lớn hơn một triệu, nên được chuyển,
    A về không, C thành hai triệu rưỡi.'
  reason: 'ASR chép “Lệnh 3 nằm đúng biên, 1 triệu không lớn hơn 1 triệu nên được
    chuyển A về 0 sẽ thành 2 triệu rưỡi.” (0.957): tên tài khoản C đọc “xê”, ASR viết
    “sẽ”; số ASR viết dạng chữ số (đúng) — NOT_VERIFIED bằng tai người'
scenes:
- id: hook
  kind: hook
  title: 'Tình huống: viết sổ chuyển khoản mà tiền không tự sinh, không tự mất'
  steps:
  - show: '<p>Bạn được giao viết một <b>sổ chuyển khoản</b> nhỏ cho ba tài khoản A,
      B, C. Yêu cầu quan trọng nhất của mọi sổ ngân hàng:</p>

      <div class="box key">Chuyển tiền chỉ <b>dời</b> tiền từ chỗ này sang chỗ khác:
      <b>tổng tiền trước = tổng tiền sau</b>, sau MỌI lệnh.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Hôm nay là tình huống chuyên gia. Bạn được giao viết một sổ chuyển khoản
      nhỏ cho ba tài khoản A, B, C. Yêu cầu quan trọng nhất của mọi sổ ngân hàng là
      chuyển tiền chỉ dời tiền từ chỗ này sang chỗ khác. Nghĩa là tổng tiền trước
      và sau mọi lệnh phải bằng nhau.
  - show: <div class='chain'><span class='n'>viết sổ</span><span class='a'>→</span><span
      class='n'>chạy bốn lệnh</span><span class='a'>→</span><span class='n'>kiểm bất
      biến tổng tiền</span><span class='a'>→</span><span class='n'>gài một lỗi</span><span
      class='a'>→</span><span class='n'>đọc dấu vết, sửa tận gốc</span></div>
    say: 'Ta đi trọn một vòng như người làm thật: viết sổ, chạy bốn lệnh, kiểm bất
      biến tổng tiền. Rồi ta gài một lỗi đời thường, đọc dấu vết để tìm ra nó, và
      sửa tận gốc.'
- id: prereq
  kind: prereq
  title: 'Ôn lại: ba công cụ sẽ ghép với nhau'
  steps:
  - show: <table class='t'><tr><th>đã học</th><th>dùng vào sổ thế nào</th></tr><tr><td>①
      Lớp giữ bất biến; bản ghi</td><td>lớp <code>SoCai</code> giấu số dư, chỉ cho
      sửa qua <code>chuyen</code>; lệnh chuyển là một bản ghi</td></tr><tr><td>② Bản
      đồ khoá → giá trị</td><td>số tài khoản → số dư; <code>get</code> ra <code>null</code>
      khi không có khoá</td></tr><tr><td>③ Ngoại lệ và dấu vết</td><td>không đủ tiền
      thì ném <code>KhongDuTien</code>; dấu vết đọc từ trên xuống</td></tr></table>
    say: Ta ghép ba công cụ đã học. Thứ nhất, lớp giấu dữ liệu để giữ bất biến, và
      bản ghi để chở một lệnh chuyển. Thứ hai, bản đồ từ số tài khoản tới số dư, với
      phương thức lấy trả giá trị rỗng khi không có khoá. Thứ ba, ngoại lệ tự định
      nghĩa cho trường hợp không đủ tiền, và cách đọc dấu vết từ trên xuống.
  - show: '<table class=''t''><tr><th>khái niệm</th><th>nghĩa bằng lời thường</th></tr><tr><td>bản
      ghi <code>record</code></td><td>kiểu chỉ để chở dữ liệu: khai báo các thành
      phần một lần, máy tự sinh phương thức lấy từng thành phần (như <code>l.tu()</code>)
      và cách in <code>Lenh[tu=A, den=B, tien=300000]</code></td></tr><tr><td>lớp
      bọc <code>Long</code></td><td><code>long</code> là số nguyên thường, luôn có
      một giá trị; <code>Long</code> là một đối tượng bọc một số <code>long</code>,
      nên có thể là <code>null</code>. Bản đồ chỉ chứa đối tượng nên dùng <code>Long</code>;
      gán sang <code>long</code> thì máy tự lấy số ra, gặp <code>null</code> thì ném
      lỗi, nên phải kiểm <code>null</code> trước</td></tr><tr><td><code>throws KhongDuTien</code></td><td><code>KhongDuTien</code>
      kế thừa <code>Exception</code> nên là ngoại lệ <b>phải khai báo</b>: phương
      thức có thể ném nó ghi <code>throws</code>, nơi gọi buộc phải bắt bằng <code>catch</code>
      hoặc khai <code>throws</code> để ném tiếp. <code>IllegalArgumentException</code>,
      <code>IllegalStateException</code> là lỗi lúc chạy, không phải khai báo</td></tr></table>'
    clear: true
    say: Nhắc lại ba khái niệm sẽ gặp trong mã. Bản ghi là kiểu chỉ để chở dữ liệu,
      ta khai báo các thành phần một lần, và máy tự sinh phương thức lấy từng thành
      phần cùng cách in ra. Kiểu số nguyên thường luôn có một giá trị, còn lớp bọc
      của nó là một đối tượng chứa một số, nên có thể là giá trị rỗng. Bản đồ chỉ
      chứa đối tượng nên dùng lớp bọc, và phải kiểm giá trị rỗng trước khi lấy số
      ra, nếu không chương trình sẽ ném lỗi. Ngoại lệ không đủ tiền thuộc loại phải
      khai báo, nên phương thức chuyển ghi rõ là có thể ném nó, và nơi gọi buộc phải
      bắt, hoặc khai báo ném tiếp. Hai ngoại lệ đối số sai và trạng thái sai thuộc
      loại lỗi lúc chạy, nên không phải khai báo.
- id: sym
  kind: symbol
  title: 'Giải mã thiết kế: các phần của sổ'
  steps:
  - show: <p><b>Hai kiểu dữ liệu đầu tệp</b></p><div class="code"><div><span class="kw">class</span>
      KhongDuTien <span class="kw">extends</span> Exception {</div><div>    KhongDuTien(String
      thongBao) { super(thongBao); }</div><div>}</div><div> </div><div><span class="kw">record</span>
      Lenh(String tu, String den, <span class="kw">long</span> tien) {}</div></div><table
      class='t'><tr><th>phần</th><th>việc</th></tr><tr><td><code>mo(stk, tien)</code></td><td>mở
      tài khoản, cộng vào <code>tongGoc</code></td></tr><tr><td><code>tong()</code>,
      <code>lay(stk)</code></td><td>cộng mọi số dư; lấy một số dư (không có thì ném)</td></tr><tr><td><code>chuyen(l)</code></td><td>kiểm
      tra, trừ bên gửi, cộng bên nhận, rồi <code>kiem()</code></td></tr><tr><td><code>kiem()</code></td><td>tổng
      khác <code>tongGoc</code> thì ném <code>IllegalStateException</code></td></tr></table>
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    clear: true
    say: Đầu tệp có loại ngoại lệ không đủ tiền và bản ghi lệnh gồm tài khoản gửi,
      tài khoản nhận, số tiền. Lớp sổ cái có bốn việc. Mở tài khoản thì cộng vào tổng
      gốc. Phương thức tổng cộng mọi số dư, còn phương thức lấy trả một số dư, và
      ném ngoại lệ nếu không có tài khoản. Phương thức chuyển kiểm tra, trừ, cộng,
      rồi gọi phương thức kiểm. Phương thức kiểm ném ngoại lệ trạng thái sai nếu tổng
      lệch tổng gốc, vì đó là lỗi lập trình.
