    - 1
    - 3
    clear: true
    say: 'Nhìn hai dòng đó: bên nhận đang cộng vào số dư của bên gửi. Sửa a thành
      b, chạy lại, và tổng trở về ba triệu.'
  - show: <div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> “Sửa” bằng cách nuốt
      ngoại lệ cho chương trình khỏi dừng.</div><div class="code"><div>} <span class="kw">catch</span>
      (Exception e) {</div><div>    <span class="cm">// tạm bỏ qua cho chương trình
