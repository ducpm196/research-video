source: 'curriculum/jva.yaml L12; audit/jva/verify_jva.py L12 (javac/java chạy thật,
  kể cả dấu vết lỗi với số dòng tính từ mã); The Java Language Specification, Java
  SE 21 (§8.10 bản ghi, §11.1.1 ngoại lệ có kiểm tra, §14.20 lệnh try nhiều khối catch,
  §5.1.8 mở hộp); Java SE 21 API: java.util.HashMap (get trả null khi không có khoá,
  values), java.lang.IllegalStateException, java.lang.IllegalArgumentException, java.lang.Throwable
  (dấu vết ngăn xếp); dev.java/learn. Mọi số tiền là số minh hoạ.'
assumes: []
objectives:
- Ghép lớp, bản ghi, bản đồ, danh sách và ngoại lệ thành một sổ chuyển khoản
- Áp dụng kiểm tra trước, sửa sau và kiểm bất biến tổng tiền sau mỗi lệnh
- Phân biệt nơi phát hiện với nơi sai khi đọc dấu vết lỗi, và sửa tận gốc
- 'Nhận ra hai cách sửa sai: nuốt ngoại lệ và chỉ đối soát cuối ngày'
- Theo dõi toàn bộ tệp sổ cái hoàn chỉnh, từng phần, và gõ lại được
- Dự đoán chi phí kiểm toàn bộ sau mỗi lệnh khi số tài khoản và số lệnh tăng gấp nghìn
  lần, và vì sao cần cơ sở dữ liệu
- 'Dựng sổ chuyển khoản qua ba mốc: sổ và tổng, chuyển có kiểm tra trước, kiểm bất
  biến sau mỗi lệnh'
asr_reviewed:
