      4900000</div></div>
    focus:
    - 1
    - 3
    clear: true
    say: 'Lỗi thứ hai, của người đã đi làm, là sửa bằng cách thêm khối bắt mọi ngoại
      lệ rồi bỏ qua, cho chương trình khỏi dừng. Chương trình chạy hết, nhưng tổng
      thành bốn triệu chín trăm nghìn: gần hai triệu tự sinh ra, không ai được báo.'
  - show: '<table class=''t''><tr><th>lệnh (lỗi gài vẫn còn)</th><th>số dư sau lệnh</th><th>in
      ra</th></tr><tr><td>A → B 300 000</td><td>A = 700 000; B = <b>số dư cũ của A</b>
      + 300 000 = 1 300 000</td><td>phương thức kiểm ném, bị nuốt: không in OK</td></tr><tr><td>B
      → C 1 000 000</td><td>B có 1 300 000 nên qua kiểm tra: B = 300 000; C = 1 300
      000 + 1 000 000 = 2 300 000</td><td>bị nuốt: không in</td></tr><tr><td>A → X
      50 000</td><td>không đổi</td><td>SAI LENH Khong co tai khoan X</td></tr><tr><td>C
      → A 200 000</td><td>C = 2 100 000; A = 2 300 000 + 200 000 = 2 500 000</td><td>bị
      nuốt: không in</td></tr></table>$$2\,500\,000 + 300\,000 + 2\,100\,000 = \hl{4\,900\,000}$$'
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    clear: true
    say: Lần theo từng lệnh để thấy gần hai triệu từ đâu ra. Lệnh một trừ A còn bảy
      trăm nghìn, nhưng B nhận số dư cũ của A cộng ba trăm nghìn, thành một triệu
      ba trăm nghìn. Phương thức kiểm ném ngoại lệ, khối bắt nuốt mất, nên dòng thành
      công không được in. Lệnh hai, B lúc này có một triệu ba trăm nghìn nên qua kiểm
      tra, và B còn ba trăm nghìn. C nhận một triệu ba trăm nghìn cộng một triệu,
      thành hai triệu ba trăm nghìn, và lại bị nuốt. Lệnh ba sai tài khoản nên in
      sai lệnh. Lệnh bốn, C còn hai triệu một trăm nghìn, còn A nhận hai triệu ba
      trăm nghìn cộng hai trăm nghìn, thành hai triệu rưỡi. Cộng ba số dư được bốn
      triệu chín trăm nghìn, đúng dòng chương trình in ra.
  - show: "<div class=\"box warn\"><b>Lỗi 3 (người đã đi làm).</b> Chỉ đối soát cuối\
