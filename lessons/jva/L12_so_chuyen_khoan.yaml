      tài khoản là ba triệu. Sau lệnh, A giảm ba trăm nghìn, B tăng ba trăm nghìn,
      C giữ nguyên, nên tổng vẫn là ba triệu.
  - show: '<table class=''t''><tr><th>bút toán</th><th>thay đổi</th></tr><tr><td>trừ
      bên gửi A</td><td>$-300\,000$</td></tr><tr><td>cộng bên nhận B</td><td>$+300\,000$</td></tr><tr><td>tổng
      thay đổi</td><td>$-300\,000 + 300\,000 = \hlg{0}$</td></tr></table><p>Hai quy
      tắc: <b>kiểm tra trước, sửa sau</b> (bị từ chối thì chưa chạm vào số dư nào),
