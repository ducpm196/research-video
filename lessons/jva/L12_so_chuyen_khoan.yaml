    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba là chỉ đối soát, tức so lại tổng tiền, vào cuối ngày. Lệnh B sang
      C lẽ ra bị từ chối, vẫn chạy được vì số dư đã sai từ lệnh trước. Cuối ngày mới
      biết lệch, và dấu vết chỉ trỏ về hàm chính, không biết lệnh nào gây ra. Kiểm
      sau mỗi lệnh thì dấu vết trỏ đúng lệnh đầu tiên, như ta vừa thấy.
- id: quiz
