      SoLoi.main</code></td><td>đang chạy lệnh <b>đầu tiên</b> (chưa in OK nào)</td><td>lệnh
      A → B 300000</td></tr></table>'
    clear: true
    say: Đọc dấu vết từ trên xuống. Dòng đầu nói tổng thừa năm trăm nghìn, đúng bằng
      số dư cũ của A trừ của B, nên nghi B được cộng nhầm vào số dư của A. Dòng kế
      là phương thức kiểm, nhưng đó chỉ là nơi phát hiện, không phải nơi sai. Dòng
      thứ ba cho biết kiểm được gọi ngay sau hai bút toán, nên lỗi nằm ở hai dòng
