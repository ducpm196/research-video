    say: 'Một lần chuyển gồm hai bút toán, tức hai dòng ghi tăng hoặc giảm số dư:
      trừ bên gửi và cộng bên nhận cùng một số tiền, nên tổng thay đổi bằng không.
      Từ đó có hai quy tắc. Kiểm tra trước, sửa sau, để lệnh bị từ chối không chạm
      vào số dư nào. Và kiểm bất biến sau mỗi lệnh, để lỗi lộ ra ngay tại lệnh gây
      ra nó.'
- id: formula
  kind: formula
  title: 'Suy ra từng bước: viết lớp sổ cái'
  checks:
  - 1000000 + 500000 + 1500000 == 3000000
  steps:
  - show: <p><b>Bước 1. Bản đồ số dư và tổng gốc</b></p><div class="code"><div><span
      class="kw">class</span> SoCai {</div><div>    <span class="kw">private</span>
      HashMap&lt;String, Long&gt; soDu = <span class="kw">new</span> HashMap&lt;&gt;();</div><div>    <span
      class="kw">private</span> <span class="kw">long</span> tongGoc = 0;</div><div>
      </div><div>    <span class="kw">void</span> mo(String stk, <span class="kw">long</span>
      tien) {</div><div>        soDu.put(stk, tien);</div><div>        tongGoc +=
      tien;                      <span class="cm">// tổng tiền phải giữ mãi</span></div><div>    }</div><div>
      </div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, sổ cái giữ một bản đồ riêng từ số tài khoản tới số dư, và một tổng
      gốc. Mỗi lần mở tài khoản, ta đặt số dư vào bản đồ và cộng vào tổng gốc, vì
      đó là tổng tiền phải giữ mãi.
  - show: '<p><b>Bước 2. Cộng tổng, và lấy số dư an toàn</b></p><div class="code"><div><span
      class="kw">long</span> tong() {</div><div>    <span class="kw">long</span> t
      = 0;</div><div>    <span class="kw">for</span> (<span class="kw">long</span>
      x : soDu.values()) {</div><div>        t += x;</div><div>    }</div><div>    <span
      class="kw">return</span> t;</div><div>}</div></div><div class="code"><div><span
      class="kw">long</span> lay(String stk) {</div><div>    Long v = soDu.get(stk);</div><div>    <span
      class="kw">if</span> (v == <span class="kw">null</span>) {</div><div>        <span
      class="kw">throw</span> <span class="kw">new</span> IllegalArgumentException("Khong
      co tai khoan " + stk);</div><div>    }</div><div>    <span class="kw">return</span>
      v;</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước hai, phương thức tổng duyệt mọi giá trị của bản đồ và cộng dồn. Phương
      thức lấy dùng lớp bọc, vì bản đồ trả giá trị rỗng khi không có khoá, và khi
      đó ta ném ngoại lệ đối số.
  - show: '<p><b>Bước 3. Chuyển: kiểm tra trước</b></p><div class="code"><div><span
      class="kw">void</span> chuyen(Lenh l) <span class="kw">throws</span> KhongDuTien
      {</div><div>    <span class="kw">long</span> a = lay(l.tu());                 <span
      class="cm">// kiểm tra trước ...</span></div><div>    <span class="kw">long</span>
      b = lay(l.den());</div><div>    <span class="kw">if</span> (l.tien() &lt;= 0)
      {</div><div>        <span class="kw">throw</span> <span class="kw">new</span>
      IllegalArgumentException("So tien phai duong");</div><div>    }</div><div>    <span
      class="kw">if</span> (l.tien() &gt; a) {</div><div>        <span class="kw">throw</span>
      <span class="kw">new</span> KhongDuTien(l.tu() + " chi co " + a);</div><div>    }</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước ba, phương thức chuyển kiểm tra trước. Lấy số dư hai bên, nên tài khoản
      không có sẽ bị ném ngay. Số tiền phải dương, và không được vượt số dư bên gửi,
      nếu không thì ném ngoại lệ không đủ tiền. Đến đây chưa có số dư nào bị sửa.
  - show: '<p><b>Bước 4. Sửa sau, rồi kiểm bất biến</b></p><div class="code"><div>    soDu.put(l.tu(),
      a - l.tien());       <span class="cm">// ... sửa sau: trừ bên gửi</span></div><div>    soDu.put(l.den(),
      b + l.tien());      <span class="cm">// cộng bên nhận</span></div><div>    kiem();                               <span
      class="cm">// kiểm bất biến sau MỖI lần chuyển</span></div><div>}</div><div>
      </div><div><span class="kw">void</span> kiem() {</div><div>    <span class="kw">if</span>
      (tong() != tongGoc) {</div><div>        <span class="kw">throw</span> <span
      class="kw">new</span> IllegalStateException("Lech tong " + tong() + " != " +
      tongGoc);</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Bước bốn, qua hết kiểm tra mới sửa: trừ bên gửi, cộng bên nhận. Ngay sau
      đó gọi phương thức kiểm. Nếu tổng khác tổng gốc thì ném ngoại lệ trạng thái
      sai, vì bất biến đã vỡ.'
  - show: '<p><b>Bước 5. Chạy danh sách lệnh</b></p><div class="code"><div><span class="kw">for</span>
      (Lenh l : ds) {</div><div>    <span class="kw">try</span> {</div><div>        so.chuyen(l);</div><div>        System.out.println("OK
      " + l);</div><div>    } <span class="kw">catch</span> (KhongDuTien e) {</div><div>        System.out.println("TU
      CHOI " + e.getMessage());</div><div>    } <span class="kw">catch</span> (IllegalArgumentException
      e) {</div><div>        System.out.println("SAI LENH " + e.getMessage());</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước năm, hàm chính duyệt danh sách lệnh. Mỗi lệnh đặt trong khối thử. Không
      đủ tiền thì in từ chối, lệnh sai thì in sai lệnh. Lỗi trạng thái thì không bắt,
      vì đó là lỗi lập trình phải lộ ra.
- id: example
  kind: example
  title: 'Ví dụ: chạy bốn lệnh, từng phép tính'
  checks:
  - 1000000 - 300000 == 700000
  - 500000 + 300000 == 800000
  - 1000000 > 800000
  - 1500000 - 200000 == 1300000
  - 700000 + 200000 == 900000
  - 900000 + 800000 + 1300000 == 3000000
  steps:
  - show: <p><b>Ba tài khoản và bốn lệnh</b></p><div class="code"><div>SoCai so =
      <span class="kw">new</span> SoCai();</div><div>so.mo("A", 1000000);</div><div>so.mo("B",
      500000);</div><div>so.mo("C", 1500000);</div><div>ArrayList&lt;Lenh&gt; ds =
      <span class="kw">new</span> ArrayList&lt;&gt;();</div><div>ds.add(<span class="kw">new</span>
      Lenh("A", "B", 300000));</div><div>ds.add(<span class="kw">new</span> Lenh("B",
      "C", 1000000));</div><div>ds.add(<span class="kw">new</span> Lenh("A", "X",
      50000));</div><div>ds.add(<span class="kw">new</span> Lenh("C", "A", 200000));</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ba tài khoản được mở với một triệu, năm trăm nghìn và một triệu rưỡi. Rồi
      có bốn lệnh chuyển. Ta tính từng bước.
  - show: '$$① \; 1\,000\,000 + 500\,000 + 1\,500\,000 = \hl{3\,000\,000} \text{ (tổng
      gốc)}$$$$② \; \text{A→B}: \; A = 1\,000\,000 - 300\,000 = 700\,000, \; B = 500\,000
      + 300\,000 = \hl{800\,000}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất, tổng gốc là ba triệu. Phép tính thứ hai, lệnh A sang
      B ba trăm nghìn hợp lệ, nên A còn bảy trăm nghìn, B thành tám trăm nghìn.
  - show: '$$③ \; \text{B→C}: \; 1\,000\,000 > 800\,000 \to \text{từ chối, không số
      dư nào đổi}$$$$④ \; \text{A→X}: \; \text{không có tài khoản X} \to \text{sai
      lệnh, không số dư nào đổi}$$'
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ ba, B cần chuyển một triệu nhưng chỉ có tám trăm nghìn, nên
      bị từ chối. Phép tính thứ tư, tài khoản X không tồn tại, nên là sai lệnh. Cả
      hai đều bị chặn ở phần kiểm tra, nên không số dư nào đổi.
  - show: '$$⑤ \; \text{C→A}: \; C = 1\,500\,000 - 200\,000 = 1\,300\,000, \; A =
      700\,000 + 200\,000 = \hl{900\,000}$$$$900\,000 + 800\,000 + 1\,300\,000 = \hlg{3\,000\,000}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ năm, C chuyển hai trăm nghìn cho A, nên C còn một triệu ba
      trăm nghìn, A thành chín trăm nghìn. Cộng lại, tổng vẫn là ba triệu.
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>OK Lenh[tu=A, den=B, tien=300000]</div><div>TU
      CHOI B chi co 800000</div><div>SAI LENH Khong co tai khoan X</div><div>OK Lenh[tu=C,
      den=A, tien=200000]</div><div>A=900000 B=800000 C=1300000</div><div>Tong 3000000</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: 'Chạy thật, sáu dòng khớp từng phép tính: hai lệnh thành công, một từ chối,
      một sai lệnh, ba số dư cuối và tổng ba triệu. Bản ghi lệnh tự in đủ thành phần,
      nên nhật ký đọc được ngay.'
- id: tep
  kind: example
  title: Toàn bộ tệp So.java, từng phần, để bạn gõ lại
  steps:
  - show: <p><b>Tệp So.java, phần 1 trên 7</b></p><div class="code"><div><span class="kw">import</span>
      java.util.ArrayList;</div><div><span class="kw">import</span> java.util.HashMap;</div><div>
      </div><div><span class="kw">class</span> KhongDuTien <span class="kw">extends</span>
      Exception {</div><div>    KhongDuTien(String thongBao) { super(thongBao); }</div><div>}</div><div>
      </div><div><span class="kw">record</span> Lenh(String tu, String den, <span
      class="kw">long</span> tien) {}</div><div> </div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Đây là toàn bộ tệp, chia thành bảy phần để bạn gõ lại. Phần một là hai kiểu
      dữ liệu và các dòng nhập ở đầu tệp.
  - show: <p><b>Tệp So.java, phần 2 trên 7</b></p><div class="code"><div><span class="kw">class</span>
      SoCai {</div><div>    <span class="kw">private</span> HashMap&lt;String, Long&gt;
      soDu = <span class="kw">new</span> HashMap&lt;&gt;();</div><div>    <span class="kw">private</span>
      <span class="kw">long</span> tongGoc = 0;</div><div> </div><div>    <span class="kw">void</span>
      mo(String stk, <span class="kw">long</span> tien) {</div><div>        soDu.put(stk,
      tien);</div><div>        tongGoc += tien;                      <span class="cm">//
      tổng tiền phải giữ mãi</span></div><div>    }</div><div> </div></div>
    clear: true
    say: Phần hai mở đầu lớp sổ cái, với bản đồ số dư, tổng gốc và phương thức mở
      tài khoản.
  - show: '<p><b>Tệp So.java, phần 3 trên 7</b></p><div class="code"><div><span class="kw">long</span>
      tong() {</div><div>    <span class="kw">long</span> t = 0;</div><div>    <span
      class="kw">for</span> (<span class="kw">long</span> x : soDu.values()) {</div><div>        t
      += x;</div><div>    }</div><div>    <span class="kw">return</span> t;</div><div>}</div><div>
      </div><div><span class="kw">long</span> lay(String stk) {</div><div>    Long
      v = soDu.get(stk);</div><div>    <span class="kw">if</span> (v == <span class="kw">null</span>)
      {</div><div>        <span class="kw">throw</span> <span class="kw">new</span>
      IllegalArgumentException("Khong co tai khoan " + stk);</div><div>    }</div><div>    <span
      class="kw">return</span> v;</div><div>}</div></div>'
    clear: true
    say: Phần ba là phương thức cộng tổng và phương thức lấy số dư an toàn.
  - show: <p><b>Tệp So.java, phần 4 trên 7</b></p><div class="code"><div><span class="kw">void</span>
      chuyen(Lenh l) <span class="kw">throws</span> KhongDuTien {</div><div>    <span
      class="kw">long</span> a = lay(l.tu());                 <span class="cm">//
      kiểm tra trước ...</span></div><div>    <span class="kw">long</span> b = lay(l.den());</div><div>    <span
      class="kw">if</span> (l.tien() &lt;= 0) {</div><div>        <span class="kw">throw</span>
      <span class="kw">new</span> IllegalArgumentException("So tien phai duong");</div><div>    }</div><div>    <span
      class="kw">if</span> (l.tien() &gt; a) {</div><div>        <span class="kw">throw</span>
      <span class="kw">new</span> KhongDuTien(l.tu() + " chi co " + a);</div><div>    }</div></div>
    clear: true
    say: 'Phần bốn là nửa đầu của phương thức chuyển: kiểm tra trước, chưa sửa gì.'
  - show: '<p><b>Tệp So.java, phần 5 trên 7</b></p><div class="code"><div>        soDu.put(l.tu(),
      a - l.tien());       <span class="cm">// ... sửa sau: trừ bên gửi</span></div><div>        soDu.put(l.den(),
      b + l.tien());      <span class="cm">// cộng bên nhận</span></div><div>        kiem();                               <span
      class="cm">// kiểm bất biến sau MỖI lần chuyển</span></div><div>    }</div><div>
      </div><div>    <span class="kw">void</span> kiem() {</div><div>        <span
      class="kw">if</span> (tong() != tongGoc) {</div><div>            <span class="kw">throw</span>
      <span class="kw">new</span> IllegalStateException("Lech tong " + tong() + "
      != " + tongGoc);</div><div>        }</div><div>    }</div><div>}</div></div>'
    clear: true
    say: 'Phần năm là nửa sau: sửa hai số dư, rồi phương thức kiểm bất biến.'
  - show: <p><b>Tệp So.java, phần 6 trên 7</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> So {</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>        SoCai so = <span class="kw">new</span> SoCai();</div><div>        so.mo("A",
      1000000);</div><div>        so.mo("B", 500000);</div><div>        so.mo("C",
      1500000);</div><div>        ArrayList&lt;Lenh&gt; ds = <span class="kw">new</span>
      ArrayList&lt;&gt;();</div><div>        ds.add(<span class="kw">new</span> Lenh("A",
      "B", 300000));</div><div>        ds.add(<span class="kw">new</span> Lenh("B",
      "C", 1000000));</div><div>        ds.add(<span class="kw">new</span> Lenh("A",
      "X", 50000));</div><div>        ds.add(<span class="kw">new</span> Lenh("C",
      "A", 200000));</div></div>
    clear: true
    say: Phần sáu là hàm chính, mở ba tài khoản và nạp bốn lệnh vào danh sách.
  - show: '<p><b>Tệp So.java, phần 7 trên 7</b></p><div class="code"><div>        <span
      class="kw">for</span> (Lenh l : ds) {</div><div>            <span class="kw">try</span>
      {</div><div>                so.chuyen(l);</div><div>                System.out.println("OK
      " + l);</div><div>            } <span class="kw">catch</span> (KhongDuTien e)
      {</div><div>                System.out.println("TU CHOI " + e.getMessage());</div><div>            }
      <span class="kw">catch</span> (IllegalArgumentException e) {</div><div>                System.out.println("SAI
      LENH " + e.getMessage());</div><div>            }</div><div>        }</div><div>        System.out.println("A="
      + so.lay("A") + " B=" + so.lay("B") + " C=" + so.lay("C"));</div><div>        System.out.println("Tong
      " + so.tong());</div><div>    }</div><div>}</div></div>'
    clear: true
    say: Phần bảy là vòng lặp chạy từng lệnh trong khối thử, rồi in ba số dư và tổng.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: dòng tiền ròng của từng tài khoản'
  checks:
  - -300000 + 200000 == -100000
  - 1000000 - 100000 == 900000
  - 500000 + 300000 == 800000
  - 1500000 - 200000 == 1300000
  - -100000 + 300000 - 200000 == 0
  steps:
  - show: <table class='t'><tr><th>tài khoản</th><th>đầu ngày</th><th>tiền vào − tiền
      ra</th><th>cuối ngày</th></tr><tr><td>A</td><td>1 000 000</td><td>$-300\,000
      + 200\,000 = -100\,000$</td><td>900 000</td></tr><tr><td>B</td><td>500 000</td><td>$+300\,000$</td><td>800
      000</td></tr><tr><td>C</td><td>1 500 000</td><td>$-200\,000$</td><td>1 300 000</td></tr></table>$$-100\,000
      + 300\,000 - 200\,000 = \hlg{0} \; \checkmark$$
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: 'Kiểm bằng đường khác: không theo từng lệnh, mà cộng dòng tiền ròng của từng
      tài khoản trong cả ngày. A ra ba trăm nghìn, vào hai trăm nghìn, nên ròng âm
      một trăm nghìn, còn chín trăm nghìn. B ròng cộng ba trăm nghìn, C ròng âm hai
      trăm nghìn. Cả ba khớp số dư cuối mà chương trình in ra. Tổng các dòng ròng
      bằng không, nghĩa là tổng tiền không đổi, đúng bất biến.'
- id: quymo
  kind: concept
  title: 'Khi số tài khoản và số lệnh tăng gấp nghìn lần: kiểm tổng sau mỗi lệnh còn
    rẻ không?'
  checks:
  - 3 * 4 == 12
  - 1000 * 1000 == 10**6
  - 10**4 * 10**4 == 10**8
  - 10**6 * 10**6 == 10**12
  - 10**12 * 10 // 10**9 == 10000
  - round(10000 / 3600, 1) == 2.8
  - (10**6 * 10**6) // (1000 * 1000) == 10**6
  steps:
  - show: '<div class="code"><div><span class="kw">for</span> (<span class="kw">int</span>
      k = 0; k &lt; n.length; k++) {</div><div>    HashMap&lt;Integer, Long&gt; soDu
      = <span class="kw">new</span> HashMap&lt;&gt;();</div><div>    <span class="kw">for</span>
      (<span class="kw">int</span> i = 0; i &lt; n[k]; i++) {</div><div>        soDu.put(i,
      1000000L);</div><div>    }</div><div>    <span class="kw">long</span> buoc =
      0;                                <span class="cm">// số lần cộng trong các
      lần kiểm tổng</span></div><div>    <span class="kw">for</span> (<span class="kw">int</span>
      j = 0; j &lt; m[k]; j++) {</div><div>        <span class="kw">long</span> t
      = 0;</div><div>        <span class="kw">for</span> (<span class="kw">long</span>
      x : soDu.values()) {            <span class="cm">// kiểm bất biến: cộng lại
      mọi số dư</span></div><div>            t += x;</div><div>            buoc++;</div><div>        }</div><div>    }</div></div>'
    clear: true
    say: 'Kiểm bất biến sau mỗi lệnh có giá của nó: mỗi lần phải cộng lại mọi số dư.
      Ta đếm số lần cộng với ba quy mô, chương trình thật chạy cả ba.'
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>N=3 M=4: 12 buoc</div><div>N=1000
      M=1000: 1000000 buoc</div><div>N=10000 M=10000: 100000000 buoc</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ba tài khoản bốn lệnh là mười hai lần cộng. Một nghìn tài khoản một nghìn
      lệnh là một triệu lần. Mười nghìn tài khoản mười nghìn lệnh là một trăm triệu
      lần.
  - show: <table class='t'><tr><th>tài khoản N</th><th>lệnh M</th><th>số lần cộng
      = N × M</th><th>thời gian nếu 10 nano giây mỗi lần (số minh hoạ)</th></tr><tr><td>3</td><td>4</td><td>12</td><td>gần
      như không</td></tr><tr><td>1 000</td><td>1 000</td><td>1 000 000</td><td>10
      mili giây</td></tr><tr><td>10 000</td><td>10 000</td><td>100 000 000</td><td>1
      giây</td></tr><tr><td>1 000 000</td><td>1 000 000</td><td>1 000 000 000 000</td><td>10
      000 giây ≈ 2,8 giờ</td></tr></table>
    clear: true
    say: Từ một nghìn lên một triệu, cả tài khoản lẫn lệnh đều gấp một nghìn lần,
      nhưng chi phí gấp một triệu lần, vì hai con số nhân với nhau. Nếu mỗi lần cộng
      mất mười phần tỉ giây, số minh hoạ, thì một triệu tài khoản và một triệu lệnh
      cần gần ba giờ chỉ để kiểm tổng, mỗi ngày.
  - show: '<div class="box key"><b>Điều người làm nghề rút ra.</b> Ba điều đổi khi
      sổ lớn lên.

      <b>① Kiểm gia tăng:</b> mỗi lệnh chuyển chỉ cần kiểm <b>tổng thay đổi của chính
      lệnh đó bằng 0</b> (một phép tính), còn kiểm đầy đủ toàn bộ chạy <b>định kỳ</b>.

      <b>② Tra cứu:</b> bản đồ tra một tài khoản trong cỡ một bước, danh sách phải
      duyệt tới N bước.

      <b>③ Bộ nhớ:</b> dữ liệu nằm trong biến thì <b>mất khi tắt chương trình</b>,
      và nhiều chương trình không dùng chung được. Vì thế hệ thống thật lưu vào <b>cơ
      sở dữ liệu</b>: lưu bền, có giao dịch (làm trọn hoặc hoàn tác), có chỉ mục để
      tra nhanh, và cho nhiều người dùng cùng lúc.</div>

      '
    clear: true
    say: 'Ba điều đổi khi sổ lớn lên. Một, kiểm gia tăng: mỗi lệnh chuyển chỉ cần
      kiểm rằng tổng thay đổi của chính lệnh đó bằng không, là một phép tính, còn
      kiểm đầy đủ toàn bộ thì chạy định kỳ. Hai, bản đồ tra một tài khoản trong cỡ
      một bước, còn danh sách phải duyệt tới N bước. Ba, dữ liệu nằm trong biến thì
      mất khi tắt chương trình, và nhiều chương trình không dùng chung được. Vì thế
      hệ thống thật lưu vào cơ sở dữ liệu, bền, có giao dịch làm trọn hoặc hoàn tác,
      có chỉ mục, và cho nhiều người cùng dùng.'
- id: pitfalls
  kind: pitfall
  title: Lỗi cố ý, đọc dấu vết, và hai cách sửa sai của người đã đi làm
  checks:
  - 700000 + (1000000 + 300000) + 1500000 == 3500000
  - 3500000 - 3000000 == 1000000 - 500000
  - 4900000 - 3000000 == 1900000
  - 1000000 - 300000 == 700000 and 1000000 + 300000 == 1300000
  - 1000000 <= 1300000 and 1300000 - 1000000 == 300000 and 1300000 + 1000000 == 2300000
  - 2300000 - 200000 == 2100000 and 2300000 + 200000 == 2500000
  - 2500000 + 300000 + 2100000 == 4900000
  steps:
  - show: "<div class=\"box warn\"><b>Lỗi 1 (gài cố ý).</b> Chép dòng trừ sang dòng\
