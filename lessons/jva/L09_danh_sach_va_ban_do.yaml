scenes:
- id: hook
  kind: hook
  title: Số giao dịch trong ngày không biết trước, mảng cố định có đủ không?
  steps:
  - show: '<p>Mảng số dư ở bài 5 có đúng $5$ ô, tạo xong là <b>không đổi độ dài</b>.
      Nhưng hôm nay có bao nhiêu giao dịch? Không ai biết trước.</p>

      <p>Khách đưa số tài khoản <code>"A01"</code>, ta muốn tra ra số dư ngay, không
      dò từng ô.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Mảng số dư bạn đã học có năm ô, độ dài cố định. Nhưng số giao dịch trong
      ngày thì không ai biết trước. Còn khi khách đưa số tài khoản, ta muốn tra ra
      số dư ngay.
  - show: '<div class="box key">Hôm nay: <b>danh sách</b> lớn dần theo dữ liệu, và
      <b>bản đồ khoá–giá trị</b> tra số dư theo số tài khoản.

      Cuối bài bạn đếm được số giao dịch theo từng loại.</div>

      <span class=''note''><b>Khoá</b>: thứ dùng để tra (số tài khoản). <b>Giá trị</b>:
      thứ tra ra được (số dư).</span>

      '
    focus:
    - 1
    - 1
    - 2
    say: 'Hôm nay ta học hai công cụ cho hai việc đó: danh sách lớn dần, và bản đồ
      khoá–giá trị. Trong bản đồ, khoá là thứ ta dùng để tra, như số tài khoản, còn
      giá trị là thứ tra ra được, như số dư. Cuối bài, bạn đếm được giao dịch theo
      từng loại.'
- id: prereq
  kind: prereq
  title: 'Ôn lại: mảng, đối tượng và vòng lặp cộng dồn'
  steps:
  - show: <table class='t'><tr><th>đã học</th><th>điều cần nhớ hôm nay</th></tr><tr><td>①
      Mảng</td><td>chỉ số chạy từ <code>0</code> tới <code>n − 1</code>; độ dài cố
      định; vượt chỉ số là lỗi khi chạy</td></tr><tr><td>② Lớp và đối tượng</td><td>lớp
      là bản thiết kế; <code>new</code> tạo một đối tượng theo lớp; gọi phương thức
      (hàm gắn với đối tượng) bằng dấu chấm, như <code>tk.nap(500000)</code></td></tr><tr><td>③
      Vòng lặp cộng dồn</td><td>biến tổng bắt đầu từ <code>0</code>, mỗi vòng cộng
      thêm một phần tử</td></tr></table>
    say: Ta ôn ba điều. Thứ nhất, mảng có chỉ số từ không tới n trừ một, độ dài cố
      định. Thứ hai, lớp là bản thiết kế, từ khoá tạo mới sinh ra một đối tượng theo
      bản thiết kế đó, và ta gọi phương thức, tức hàm gắn với đối tượng, bằng dấu
      chấm. Thứ ba, vòng lặp cộng dồn bắt đầu tổng bằng không, mỗi vòng cộng thêm
      một phần tử.
  - show: <p>Danh sách và bản đồ <b>cũng là lớp</b>, có sẵn trong thư viện của Java
      (gói <code>java.util</code>). Ta chỉ cần tạo đối tượng rồi gọi phương thức.</p>
    say: 'Tin vui là danh sách và bản đồ cũng chỉ là lớp có sẵn trong thư viện, nên
      bạn đã biết cách dùng: tạo đối tượng, rồi gọi phương thức.'
- id: sym
  kind: symbol
  title: 'Giải mã ký hiệu: danh sách, bản đồ và kiểu trong ngoặc nhọn'
  steps:
  - show: '<p><b>Phần thân hàm chính của Tong.java</b></p><div class="code"><div>ArrayList&lt;Long&gt;
      gd = <span class="kw">new</span> ArrayList&lt;&gt;();   <span class="cm">//
      danh sách rỗng</span></div><div>gd.add(500000L);</div><div>gd.add(-200000L);</div><div>gd.add(1500000L);</div><div><span
      class="kw">long</span> tong = 0;</div><div><span class="kw">for</span> (<span
      class="kw">long</span> x : gd) {                       <span class="cm">// lấy
      lần lượt từng phần tử</span></div><div>    tong += x;</div><div>}</div><div>System.out.println("So
      giao dich: " + gd.size());</div><div>System.out.println("Phan tu dau: " + gd.get(0));</div><div>System.out.println("Tong:
      " + tong);</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Chương trình đầu tiên tạo một danh sách giao dịch, thêm ba số tiền, rồi cộng
      tổng. Ta đọc từng ký hiệu ở bảng sau.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>import
      java.util.ArrayList;</code></td><td>dòng đầu tệp: mượn lớp danh sách từ thư
      viện</td></tr><tr><td><code>ArrayList&lt;Long&gt;</code></td><td>danh sách mà
      mỗi phần tử là một số <code>Long</code>; kiểu nằm trong ngoặc nhọn</td></tr><tr><td><code>new
      ArrayList&lt;&gt;()</code></td><td>tạo danh sách rỗng; ngoặc nhọn trống: trình
      biên dịch tự suy ra kiểu</td></tr><tr><td><code>gd.add(500000L)</code></td><td>thêm
      vào <b>cuối</b>; chữ <code>L</code> nói đây là số kiểu <code>long</code></td></tr><tr><td><code>gd.get(0)</code>,
      <code>gd.size()</code></td><td>lấy phần tử ở chỉ số 0; số phần tử hiện có</td></tr><tr><td><code>for
      (long x : gd)</code></td><td>vòng lặp duyệt: lần lượt gán từng phần tử cho <code>x</code>;
      dùng được cả với mảng</td></tr></table>'
    clear: true
    say: Dòng nhập mượn lớp danh sách từ thư viện. Kiểu trong ngoặc nhọn nói mỗi phần
      tử là số nguyên dài. Ngoặc nhọn trống khi tạo mới nghĩa là trình biên dịch tự
      suy ra kiểu. Phương thức thêm đặt phần tử vào cuối, chữ L nói con số thuộc kiểu
      dài. Phương thức lấy nhận chỉ số, phương thức kích thước đếm phần tử. Vòng lặp
      duyệt gán lần lượt từng phần tử cho biến x, và dùng được cả với mảng.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>HashMap&lt;String,
      Long&gt;</code></td><td>bản đồ: khoá là chuỗi (số tài khoản), giá trị là số
      dư</td></tr><tr><td><code>m.put(k, v)</code></td><td>đặt giá trị <code>v</code>
      cho khoá <code>k</code>; khoá đã có thì <b>ghi đè</b></td></tr><tr><td><code>m.get(k)</code></td><td>lấy
      giá trị của khoá <code>k</code>; không có khoá thì ra <code>null</code></td></tr><tr><td><code>m.getOrDefault(k,
      0L)</code></td><td>như <code>get</code>, nhưng không có khoá thì ra giá trị
      mặc định</td></tr><tr><td><code>m.size()</code>, <code>m.values()</code></td><td>số
      khoá; tất cả giá trị, để duyệt</td></tr></table>'
    clear: true
    say: 'Bảng thứ hai là bản đồ, với hai kiểu trong ngoặc nhọn: khoá là chuỗi, giá
      trị là số dư. Phương thức đặt gắn giá trị cho khoá, khoá đã có thì ghi đè. Phương
      thức lấy trả giá trị của khoá, không có khoá thì trả giá trị rỗng. Lấy hoặc
      mặc định thì trả con số mặc định khi không có khoá. Còn lại là đếm số khoá,
      và lấy mọi giá trị để duyệt.'
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>So giao dich: 3</div><div>Phan
      tu dau: 500000</div><div>Tong: 1800000</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Chạy thật chương trình đầu tiên: ba giao dịch, phần tử đầu là năm trăm nghìn.
      Tổng là năm trăm nghìn, trừ hai trăm nghìn, cộng một triệu rưỡi, ra một triệu
      tám trăm nghìn.'
