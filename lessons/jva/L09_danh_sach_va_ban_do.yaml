  - 3 + 2 + 1 == len(['NAP', 'RUT', 'NAP', 'CK', 'NAP', 'RUT'])
  steps:
  - show: '<p><b>Cùng danh sách, cộng theo chỉ số</b></p><div class="code"><div>ArrayList&lt;Long&gt;
      gd = <span class="kw">new</span> ArrayList&lt;&gt;();</div><div>gd.add(500000L);</div><div>gd.add(-200000L);</div><div>gd.add(1500000L);</div><div><span
      class="kw">long</span> tong = 0;</div><div><span class="kw">for</span> (<span
      class="kw">int</span> i = 0; i &lt; gd.size(); i++) {   <span class="cm">//
