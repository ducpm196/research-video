- id: formula
  kind: formula
  title: 'Suy ra từng bước: đếm số giao dịch theo loại'
  checks:
  - '[''NAP'', ''RUT'', ''NAP'', ''CK'', ''NAP'', ''RUT''].count(''NAP'') == 3'
  - '[''NAP'', ''RUT'', ''NAP'', ''CK'', ''NAP'', ''RUT''].count(''RUT'') == 2'
  - len(set(['NAP', 'RUT', 'NAP', 'CK', 'NAP', 'RUT'])) == 3
  steps:
  - show: <p><b>Bước 1. Có dữ liệu và một bản đồ rỗng</b></p><div class="code"><div>String[]
      loai = {"NAP", "RUT", "NAP", "CK", "NAP", "RUT"};</div><div>HashMap&lt;String,
