- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>mảng: độ dài cố định</span><span
      class=''a''>→</span><span class=''n''>danh sách: thêm dần, chỉ số 0…size − 1</span><span
      class=''a''>→</span><span class=''n''>bản đồ: khoá → giá trị</span><span class=''a''>→</span><span
      class=''n''>lấy hoặc mặc định để đếm</span></div>'
    say: Tổng kết chuỗi logic. Mảng có độ dài cố định, còn danh sách thêm dần, chỉ
      số từ không tới kích thước trừ một. Bản đồ tra giá trị theo khoá, và lấy hoặc
      mặc định giúp đếm tần suất, tức mỗi loại xuất hiện bao nhiêu lần, một cách gọn
      gàng.
  - show: '<div class=''box key''><b>Tư duy:</b> kiểu trong ngoặc nhọn luôn là kiểu
      đối tượng; với số là <b>lớp bọc</b> (<code>Long</code>, <code>Integer</code>),
      nên so bằng

      <code>equals</code>, không bằng <code>==</code>. Khoá không có thì <code>get</code>
      ra <code>null</code>. Không xoá phần tử trong vòng lặp duyệt.</div>

      '
    say: Điều cần mang theo. Kiểu trong ngoặc nhọn luôn là đối tượng, với số là lớp
      bọc, nên so bằng nội dung, không so địa chỉ. Thiếu khoá thì phương thức lấy
      trả giá trị rỗng. Và đừng xoá phần tử trong vòng lặp duyệt.
