  - show: <div class="code"><div>soDu.put("A01", 2000000L);                    <span
      class="cm">// (1)</span></div><div>soDu.put("B02", 500000L);                     <span
      class="cm">// (2)</span></div></div><p>Phép ① và ② đặt hai khoá mới:</p>$$①
      \; \text{A01} \to 2\,000\,000 \qquad ② \; \text{B02} \to 500\,000$$
    focus:
