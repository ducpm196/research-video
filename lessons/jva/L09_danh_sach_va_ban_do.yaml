- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Viết kiểu số trần trong
      ngoặc nhọn.</div><div class="code"><div>ArrayList&lt;<span class="kw">long</span>&gt;
      gd = <span class="kw">new</span> ArrayList&lt;&gt;();</div></div><p><b>Trình
