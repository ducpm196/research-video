    - 1
    - 2
    clear: true
    say: 'Kiểm phép đếm: mỗi giao dịch được đếm đúng một lần, nên tổng các số đếm
      phải bằng số phần tử. Ba cộng hai cộng một bằng sáu, và mảng có đúng sáu phần
