    say: Lỗi thứ nhất, của người mới, là viết kiểu số trần trong ngoặc nhọn. Trình
      biên dịch báo kiểu không mong đợi, vì danh sách chỉ chứa đối tượng. Sửa bằng
      lớp bọc, chữ đầu viết hoa.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Xoá phần tử ngay trong
      vòng lặp duyệt.</div><div class="code"><div>ArrayList&lt;String&gt; ds = <span
      class="kw">new</span> ArrayList&lt;&gt;();</div><div>ds.add("A01");</div><div>ds.add("B02");</div><div>ds.add("C03");</div><div>ds.add("D04");</div><div><span
      class="kw">for</span> (String s : ds) {</div><div>    <span class="kw">if</span>
      ("B02".equals(s)) {</div><div>        ds.remove(s);            <span class="cm">//
      xoá ngay trong vòng duyệt</span></div><div>    }</div><div>}</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div><span class="cm">Exception in thread
      "main" java.util.ConcurrentModificationException</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Lỗi thứ hai là xoá phần tử ngay trong vòng lặp duyệt, ở đây là bỏ tài khoản
      B không hai. Danh sách bị đổi giữa chừng, nên ở đây bộ duyệt ném ngoại lệ sửa
      đổi đồng thời. Java chỉ cố gắng phát hiện chứ không hứa lần nào cũng ném: có
      khi vòng lặp dừng sớm và bỏ sót phần tử, nên đừng dựa vào ngoại lệ này.'
  - show: '<p><b>Cách sửa: duyệt theo chỉ số, từ cuối về đầu</b></p><div class="code"><div><span
      class="kw">for</span> (<span class="kw">int</span> i = ds.size() - 1; i &gt;=
      0; i--) {   <span class="cm">// đi từ cuối về đầu</span></div><div>    <span
      class="kw">if</span> ("B02".equals(ds.get(i))) {</div><div>        ds.remove(i);                         <span
      class="cm">// xoá theo chỉ số</span></div><div>    }</div><div>}</div><div>System.out.println(ds);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>[A01, C03, D04]</div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Cách sửa là duyệt theo chỉ số từ cuối về đầu, và xoá theo chỉ số. Xoá một
      ô chỉ làm dịch các ô phía sau, mà các ô đó đã đi qua rồi, nên không bỏ sót ai.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> So hai số lấy từ bản
      đồ bằng <code>==</code>.</div><div class="code"><div>dem.put("NAP", 127);</div><div>dem.put("RUT",
      127);</div><div>dem.put("CK", 128);</div><div>dem.put("THE", 128);</div><div>System.out.println(dem.get("NAP")
      == dem.get("RUT"));</div><div>System.out.println(dem.get("CK") == dem.get("THE"));</div><div>System.out.println(dem.get("CK").equals(dem.get("THE")));</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>true</div><div>false</div><div>true</div></div>
    focus:
    - 1
    - 3
    clear: true
    say: 'Lỗi thứ ba hay gặp ở người đã đi làm: so hai lớp bọc bằng dấu bằng bằng,
      tức so địa chỉ đối tượng chứ không so con số. Một trăm hai mươi bảy thì ra đúng,
      một trăm hai mươi tám lại ra sai.'
  - show: '<div class="box key">Lý do: quy định của Java bảo đảm số trong khoảng $-128$
      tới $127$ được đóng hộp vào <b>cùng một</b> đối tượng có sẵn.

      Ngoài khoảng đó, máy ảo mặc định tạo đối tượng mới, nên <code>==</code> ra <code>false</code>.
      So lớp bọc luôn dùng <code>equals</code>.</div>

      <span class=''note''>Kiểm thử với số đếm nhỏ thì qua, lên hệ thống thật với
      số lớn thì sai: lỗi rất khó tìm.</span>

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Lý do là Java bảo đảm số từ âm một trăm hai mươi tám tới một trăm hai mươi
      bảy được đóng hộp vào cùng một đối tượng có sẵn. Ngoài khoảng đó, máy ảo mặc
      định tạo đối tượng mới, nên phải so bằng nội dung. Lỗi này khó tìm, vì kiểm
      thử với số nhỏ thì qua.
