scenes:
- id: hook
  kind: hook
  title: Biểu phí đổi, phải sửa ở bao nhiêu chỗ?
  steps:
  - show: '<p>Phép tính phí chuyển khoản xuất hiện ở ứng dụng điện thoại, ở quầy giao
      dịch, ở báo cáo cuối ngày… Mỗi chỗ chép lại cùng một đoạn rẽ nhánh.</p>

      <div class="box warn">Biểu phí đổi: sửa mười chỗ, sót một chỗ, và khách hàng
      bị tính phí sai.</div>

      '
    focus:
    - 1
    - 2
    say: Phép tính phí chuyển khoản xuất hiện ở ứng dụng điện thoại, ở quầy giao dịch,
      ở báo cáo cuối ngày, mỗi chỗ chép lại cùng một đoạn rẽ nhánh. Khi biểu phí đổi,
      chỉ cần sót một chỗ là khách hàng bị tính phí sai.
  - show: '<p>Hôm nay ta học <b>hàm</b>, còn gọi là <b>phương thức</b>: đặt tên cho
      một đoạn mã, viết <b>một lần</b>, gọi ở <b>nhiều nơi</b>.</p>

      <div class="box key">Sửa biểu phí khi đó chỉ cần sửa đúng một hàm.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Hôm nay ta học hàm, trong Java còn gọi là phương thức. Ta đặt tên cho một
      đoạn mã, viết một lần, rồi gọi nó ở nhiều nơi. Khi biểu phí đổi, chỉ cần sửa
      đúng một hàm.
- id: prereq
  kind: prereq
  title: Ôn lại ba điều sẽ dùng hôm nay
  steps:
  - show: '<table class=''t''><tr><th>đã học</th><th>viết</th><th>dùng lại hôm nay</th></tr><tr><td>①
      hàm chính: nơi chương trình bắt đầu</td><td><code>public static void main(String[]
      args)</code></td><td>hàm chính sẽ gọi hàm của ta</td></tr><tr><td>② rẽ nhánh
      theo bậc</td><td><code>if … else if … else</code></td><td>thân hàm tính phí</td></tr><tr><td>③
      biến mảng giữ tham chiếu</td><td><code>long[] b = a;</code> thì <code>b</code>,
      <code>a</code> chung một mảng</td><td>hàm nhận mảng</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Trước hết ta ôn lại ba điều. Thứ nhất, hàm chính là nơi chương trình bắt
      đầu chạy, và bạn đã viết nó từ chương trình đầu tiên. Thứ hai, lệnh rẽ nhánh
      nếu, nếu không thì nếu, chọn một bậc phí theo số tiền. Thứ ba, biến mảng chỉ
      giữ tham chiếu, nên hai biến có thể cùng trỏ vào một mảng.
- id: sym
  kind: symbol
  title: Giải mã ký hiệu của một hàm
  steps:
  - show: '<p><b>Tệp Phi.java: hàm tính phí</b></p><div class="code"><div><span class="kw">static</span>
      <span class="kw">long</span> tinhPhi(<span class="kw">long</span> soTien) {       <span
      class="cm">// phí minh hoạ, đơn vị đồng</span></div><div>    <span class="kw">if</span>
      (soTien &lt; 500000) {</div><div>        <span class="kw">return</span> 0;</div><div>    }
      <span class="kw">else</span> <span class="kw">if</span> (soTien &lt; 10000000)
      {</div><div>        <span class="kw">return</span> 2200;</div><div>    }</div><div>    <span
      class="kw">return</span> 5500;</div><div>}</div></div><div class="code"><div>System.out.println(tinhPhi(300000));</div><div>System.out.println(tinhPhi(2000000));</div><div>System.out.println(tinhPhi(10000000));</div></div>'
    focus:
    - 2
    - 3
    clear: true
    say: Đây là hàm tính phí chuyển khoản, với biểu phí là số minh hoạ. Bên dưới là
      ba lời gọi hàm từ hàm chính.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>static</code></td><td>hàm
      thuộc về lớp, nên hàm chính gọi thẳng được</td></tr><tr><td><code>long</code>
      trước tên</td><td><b>kiểu trả về</b>: hàm trả ra một số kiểu <code>long</code></td></tr><tr><td><code>tinhPhi</code></td><td>tên
      hàm, thường là động từ: tính, kiểm, đổi…</td></tr><tr><td><code>(long soTien)</code></td><td><b>tham
      số</b>: biến nhận giá trị mỗi lần hàm được gọi</td></tr><tr><td><code>return
      2200;</code></td><td>trả giá trị về chỗ gọi và <b>kết thúc hàm ngay</b></td></tr><tr><td><code>tinhPhi(2000000)</code></td><td><b>lời
      gọi</b>; 2000000 là đối số, được chép vào <code>soTien</code></td></tr><tr><td><code>void</code></td><td>đứng
      chỗ kiểu trả về: hàm <b>không</b> trả giá trị nào</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    clear: true
    say: Từ khoá tĩnh nghĩa là hàm thuộc về lớp, nên hàm chính gọi thẳng được. Chữ
      đứng trước tên hàm là kiểu trả về, ở đây là số nguyên dài. Tên hàm thường là
      một động từ, như tính, kiểm, đổi. Trong ngoặc tròn là tham số, nhận giá trị
      mỗi lần hàm được gọi. Lệnh trả về đưa giá trị về chỗ gọi, và kết thúc hàm ngay.
      Lời gọi hàm ghi tên hàm và đối số, đối số được chép vào tham số. Hàm không trả
      giá trị nào thì ở chỗ kiểu trả về ghi một từ khoá riêng, nghĩa là không trả
      gì.
- id: intuition
  kind: intuition
  title: 'Hình dung: gọi hàm là gửi đi một bản sao, chờ nhận kết quả'
  steps:
  - show: '<div><svg width="1500" height="360" viewBox="0 0 1500 360" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="40" y="110" width="400" height="150" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="240.0" y="160" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">hàm chính</text><text x="240.0" y="194" font-size="26"
      text-anchor="middle" fill="#1f2937">in tinhPhi(2000000)</text><text x="240.0"
      y="228" font-size="26" text-anchor="middle" fill="#1f2937">đứng chờ…</text><line
      x1="450" y1="150" x2="1030" y2="150" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="740" y="140" font-size="22" text-anchor="middle" fill="#2a78d6">① gọi: chép
      2000000 vào soTien</text><rect x="1040" y="110" width="420" height="150" rx="10"
      fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1250.0" y="160" font-size="26"
      text-anchor="middle" fill="#1f2937" font-weight="bold">tinhPhi</text><text x="1250.0"
      y="194" font-size="26" text-anchor="middle" fill="#1f2937">soTien = 2000000</text><text
      x="1250.0" y="228" font-size="26" text-anchor="middle" fill="#1f2937">return
      2200</text><line x1="1030" y1="230" x2="450" y2="230" stroke="#16a34a" stroke-width="3.5"
      marker-end="url(#ah)"/><text x="740" y="220" font-size="22" text-anchor="middle"
      fill="#16a34a">② trả về 2200, hàm chính chạy tiếp</text><text x="750" y="330"
