      là biến RIÊNG của hàm, sinh ra khi gọi và mất đi khi hàm trả về</text></svg></div>'
    clear: true
    say: Hãy hình dung lời gọi hàm như gửi một phiếu yêu cầu. Hàm chính chép hai triệu
      vào tham số của hàm tính phí, rồi đứng chờ. Gặp lệnh trả về, hàm tính phí gửi
      lại hai nghìn hai trăm, và hàm chính chạy tiếp từ chỗ đã dừng. Tham số là biến
      riêng của hàm, sinh ra khi gọi và mất đi khi hàm trả về.
  - show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="20" width="700" height="360" rx="12" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="370.0" y="58" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">số nguyên: chép GIÁ TRỊ</text><rect x="60"
      y="120" width="260" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text
      x="190.0" y="157" font-size="24" text-anchor="middle" fill="#1f2937">soDu (hàm
      chính)</text><text x="190.0" y="189" font-size="24" text-anchor="middle" fill="#1f2937">500000</text><rect
      x="420" y="120" width="260" height="90" rx="10" fill="#fef3c7" stroke="#d97706"
      stroke-width="3"/><text x="550.0" y="157" font-size="24" text-anchor="middle"
      fill="#1f2937">x (tangSo)</text><text x="550.0" y="189" font-size="24" text-anchor="middle"
      fill="#1f2937">500000 → 600000</text><line x1="325" y1="165" x2="410" y2="165"
      stroke="#d97706" stroke-width="3.5" marker-end="url(#ah)"/><text x="367" y="155"
      font-size="22" text-anchor="middle" fill="#d97706">chép</text><text x="370"
      y="300" font-size="24" text-anchor="middle" fill="#dc2626" font-weight="bold">đổi
      x không đụng tới soDu</text><rect x="780" y="20" width="700" height="360" rx="12"
      fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1130.0" y="58" font-size="26"
      text-anchor="middle" fill="#1f2937" font-weight="bold">mảng: chép MŨI TÊN</text><rect
      x="820" y="100" width="220" height="80" rx="10" fill="#fef3c7" stroke="#d97706"
      stroke-width="3"/><text x="930.0" y="148" font-size="24" text-anchor="middle"
      fill="#1f2937">a (hàm chính)</text><rect x="820" y="240" width="220" height="80"
      rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="930.0" y="288"
      font-size="24" text-anchor="middle" fill="#1f2937">m (tangO)</text><line x1="1045"
      y1="140" x2="1230" y2="190" stroke="#d97706" stroke-width="3.5" marker-end="url(#ah)"/><line
      x1="1045" y1="280" x2="1230" y2="225" stroke="#d97706" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="1240" y="160" width="200" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="1340.0" y="197" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">500000</text><text x="1340.0" y="229" font-size="24"
      text-anchor="middle" fill="#1f2937">→ 600000</text><text x="1130" y="360" font-size="24"
      text-anchor="middle" fill="#16a34a" font-weight="bold">hai tên, MỘT mảng</text></svg></div>'
    clear: true
    say: Java luôn truyền theo giá trị, nghĩa là tham số nhận một bản sao của đối
      số. Với số nguyên, bản sao là chính con số, nên hàm đổi bản sao không làm đổi
      biến của người gọi. Với mảng, bản sao là mũi tên tham chiếu, nên hai tên cùng
      trỏ vào một mảng, và hàm đổi được các ô.
  - show: '<p><b>Tệp GiaTri.java: hai hàm</b></p><div class="code"><div><span class="kw">static</span>
      <span class="kw">void</span> tangSo(<span class="kw">long</span> x) {</div><div>    x
      = x + 100000;                  <span class="cm">// chỉ đổi bản sao x</span></div><div>}</div><div>
      </div><div><span class="kw">static</span> <span class="kw">void</span> tangO(<span
      class="kw">long</span>[] m) {</div><div>    m[0] = m[0] + 100000;            <span
      class="cm">// đổi ô của mảng dùng chung</span></div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật để kiểm hình vẽ. Hàm thứ nhất tăng bản sao của số dư, hàm thứ hai
      tăng ô đầu của mảng.
  - show: <p><b>Hàm chính gọi cả hai</b></p><div class="code"><div><span class="kw">long</span>
      soDu = 500000;</div><div><span class="kw">long</span>[] a = {500000};</div><div>tangSo(soDu);</div><div>tangO(a);</div><div>System.out.println(soDu
      + " " + a[0]);</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>500000
      600000</div></div>
    focus:
    - 2
    - 4
    clear: true
    say: Hàm chính gọi cả hai hàm với số dư và mảng cùng bằng năm trăm nghìn. Kết
      quả in ra năm trăm nghìn và sáu trăm nghìn, đúng như hình.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: tách phép tính phí thành một hàm'
  checks:
  - '[(0 if x < 500000 else (2200 if x < 10000000 else 5500)) for x in [300000, 2000000,
    10000000]] == [0, 2200, 5500]'
  - 2200 * 3 == 6600
  steps:
  - show: <p><b>Bước 1. Hỏi đầu vào và đầu ra.</b> Cần biết gì? Số tiền chuyển. Trả
      ra gì? Số tiền phí.</p><div class="code"><div><span class="kw">static</span>
      <span class="kw">long</span> tinhPhi(<span class="kw">long</span> soTien) {       <span
      class="cm">// phí minh hoạ, đơn vị đồng</span></div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, hỏi hai câu. Hàm cần biết gì để làm việc, đó là số tiền chuyển,
      nên ta có một tham số số nguyên dài. Hàm trả ra gì, đó là số tiền phí, nên kiểu
      trả về cũng là số nguyên dài.
  - show: <p><b>Bước 2. Viết thân hàm.</b> Mỗi nhánh kết thúc bằng một lệnh <code>return</code>.</p><div
      class="code"><div><span class="kw">if</span> (soTien &lt; 500000) {</div><div>    <span
      class="kw">return</span> 0;</div><div>} <span class="kw">else</span> <span class="kw">if</span>
      (soTien &lt; 10000000) {</div><div>    <span class="kw">return</span> 2200;</div><div>}</div><div><span
      class="kw">return</span> 5500;</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Bước hai, viết thân hàm bằng lệnh rẽ nhánh đã học, mỗi nhánh kết thúc bằng
      một lệnh trả về. Dòng trả về cuối cùng phục vụ mọi số tiền từ mười triệu trở
      lên, vì hai nhánh trên đã trả về trước đó.
  - show: <p><b>Bước 3. Gọi hàm với ba số tiền.</b></p><div class="code"><div>System.out.println(tinhPhi(300000));</div><div>System.out.println(tinhPhi(2000000));</div><div>System.out.println(tinhPhi(10000000));</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>0</div><div>2200</div><div>5500</div></div>
    focus:
    - 2
    - '4.1'
    - '4.2'
    - '4.3'
    clear: true
    say: Bước ba, gọi hàm từ hàm chính với ba số tiền. Ba trăm nghìn nhỏ hơn năm trăm
      nghìn nên phí bằng không. Hai triệu rơi vào bậc giữa nên phí là hai nghìn hai
      trăm. Mười triệu không nhỏ hơn mười triệu, nên phí là năm nghìn năm trăm.
  - show: <p><b>Bước 4. Nạp chồng:</b> cùng tên, khác danh sách tham số.</p><div class="code"><div><span
      class="kw">static</span> <span class="kw">long</span> tinhPhi(<span class="kw">long</span>
      soTien, <span class="kw">int</span> soLan) {   <span class="cm">// cùng tên,
      thêm một tham số</span></div><div>    <span class="kw">return</span> tinhPhi(soTien)
      * soLan;</div><div>}</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>2200</div><div>6600</div></div>
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Bước bốn, nạp chồng. Hai hàm được trùng tên nếu danh sách tham số khác nhau,
      và máy chọn hàm theo số lượng và kiểu đối số. Gọi thêm số lần là ba thì ra sáu
      nghìn sáu trăm, vì hai nghìn hai trăm nhân ba.
- id: example
  kind: example
  title: 'Ví dụ: lần theo các lời gọi lồng nhau, từng phép tính'
  checks:
  - (0 if 2000000 < 500000 else (2200 if 2000000 < 10000000 else 5500)) == 2200
  - 2000000 + 2200 == 2002200
  - 5000000 - 2002200 == 2997800
  steps:
  - show: '<p><b>Tệp Goi.java: hàm gọi hàm</b></p><div class="code"><div><span class="kw">static</span>
      <span class="kw">long</span> tongTru(<span class="kw">long</span> soTien) {       <span
      class="cm">// tổng số tiền bị trừ khỏi tài khoản</span></div><div>    <span
      class="kw">long</span> phi = tinhPhi(soTien);          <span class="cm">// gọi
      lồng: hàm gọi hàm</span></div><div>    <span class="kw">return</span> soTien
      + phi;</div><div>}</div></div><div class="code"><div><span class="kw">long</span>
      soDu = 5000000;</div><div>soDu = soDu - tongTru(2000000);</div><div>System.out.println("Con
      lai: " + soDu);</div></div>'
    focus:
    - 2
    - 3
    - 3
    clear: true
    say: Ví dụ này có thêm hàm tính tổng tiền bị trừ, nó gọi lại hàm tính phí. Hàm
      chính có số dư năm triệu và chuyển đi hai triệu. Ta lần theo từng lời gọi.
  - show: <div class="code"><div>soDu = soDu - tongTru(2000000);</div></div>$$① \;
      \text{tongTru}(2000000) \to \text{soTien} = \hl{2000000}$$$$② \; \text{tinhPhi}(2000000)
      \to \text{soTien} = \hl{2000000}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất, hàm chính gọi hàm tổng bị trừ, và hai triệu được chép
      vào tham số của nó. Phép tính thứ hai, hàm này gọi tiếp hàm tính phí, và hai
      triệu lại được chép vào tham số riêng của hàm tính phí.
  - show: <div class="code"><div><span class="kw">if</span> (soTien &lt; 500000) {</div><div>    <span
      class="kw">return</span> 0;</div><div>} <span class="kw">else</span> <span class="kw">if</span>
      (soTien &lt; 10000000) {</div><div>    <span class="kw">return</span> 2200;</div></div>$$③
      \; 2000000 \ge 500000 \text{ và } 2000000 \text{ nhỏ hơn } 10000000 \to \text{return
      } \hl{2200}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, trong hàm tính phí, hai triệu không nhỏ hơn năm trăm nghìn,
      nhưng nhỏ hơn mười triệu. Vì vậy nhánh thứ hai chạy và trả về hai nghìn hai
      trăm.
  - show: '<div class="code"><div><span class="kw">long</span> phi = tinhPhi(soTien);          <span
      class="cm">// gọi lồng: hàm gọi hàm</span></div><div><span class="kw">return</span>
      soTien + phi;</div></div>$$④ \; \text{phi} = 2200, \quad 2000000 + 2200 = \hl{2002200}$$$$⑤
      \; 5000000 - 2002200 = \hlg{2997800}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, quay về hàm tổng bị trừ, biến phí nhận hai nghìn hai trăm,
      và hàm trả về hai triệu không trăm linh hai nghìn hai trăm. Phép tính thứ năm,
      quay về hàm chính, số dư thành hai triệu chín trăm chín mươi bảy nghìn tám trăm.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Con lai: 2997800</div></div>'
    clear: true
    say: Chạy thật chương trình, dòng in ra đúng là hai triệu chín trăm chín mươi
      bảy nghìn tám trăm.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: trừ từng khoản và thử ở biên'
  checks:
  - 5000000 - 2000000 - 2200 == 5000000 - 2002200
  - '[(0 if x < 500000 else (2200 if x < 10000000 else 5500)) for x in [499999, 500000,
    9999999, 10000000]] == [0, 2200, 2200, 5500]'
  steps:
  - show: '<p>Đường khác cho ví dụ: trừ <b>từng khoản</b> thay vì trừ tổng.</p>$$5000000
      - 2000000 - 2200 = 2997800 \; \checkmark$$'
    focus:
    - 1
    - 1
    - 2
    say: Đường kiểm thứ nhất, trừ từng khoản thay vì trừ một tổng. Năm triệu trừ hai
      triệu, rồi trừ tiếp phí, vẫn ra đúng số cũ. Kết quả khớp, nên phép gọi lồng
      đã cộng phí đúng.
  - show: '<p><b>Tệp KiemPhi.java: thử bốn số tiền ở biên</b></p><div class="code"><div><span
      class="kw">long</span>[] thu = {499999, 500000, 9999999, 10000000};   <span
      class="cm">// các số tiền ở biên</span></div><div><span class="kw">for</span>
      (<span class="kw">int</span> i = 0; i &lt; thu.length; i++) {</div><div>    System.out.println(thu[i]
      + " -&gt; " + tinhPhi(thu[i]));</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Đường kiểm thứ hai, thử hàm ở biên, vì lỗi bậc phí thường nằm sát ranh giới.
      Mỗi ranh giới có một số ngay dưới và một số đúng bằng nó, và vòng lặp đếm gọi
      hàm cho từng số.
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>499999 -&gt; 0</div><div>500000
      -&gt; 2200</div><div>9999999 -&gt; 2200</div><div>10000000 -&gt; 5500</div></div><table
      class='t'><tr><th>số tiền</th><th>theo biểu phí (tính tay)</th><th>máy in ra</th></tr><tr><td>499999</td><td>dưới
      500000 → 0</td><td>0 ✓</td></tr><tr><td>500000</td><td>không dưới 500000 → 2200</td><td>2200
      ✓</td></tr><tr><td>9999999</td><td>dưới 10000000 → 2200</td><td>2200 ✓</td></tr><tr><td>10000000</td><td>không
      dưới 10000000 → 5500</td><td>5500 ✓</td></tr></table>
    focus:
    - 3
    - '3.2'
    - '3.3'
    - - '3.4'
      - '3.5'
    clear: true
    say: Ta tính tay theo biểu phí rồi so với máy. Số ngay dưới năm trăm nghìn có
      phí bằng không. Năm trăm nghìn thì không còn dưới mức ấy, nên phí là hai nghìn
      hai trăm. Hai số quanh mười triệu cũng khớp, nên hàm đúng ở cả hai ranh giới.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Dùng biến của hàm khác.</div><div
      class="code"><div>    <span class="kw">long</span> phi = 2200;</div><div>    <span
      class="kw">return</span> phi;</div><div>}</div><div> </div><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>    tinhPhi(2000000);</div><div>    System.out.println(phi);         <span
      class="cm">// SAI: phi chỉ sống bên trong tinhPhi</span></div><div>}</div></div><p><b>Trình
      biên dịch báo</b></p><div class="code"><div><span class="cm">error: cannot find
      symbol</span></div></div>'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Lỗi thứ nhất, của người mới, là dùng biến khai bên trong một hàm khác. Biến
      phí chỉ sống bên trong hàm tính phí. Ra khỏi cặp ngoặc nhọn của hàm đó, tên
      này không còn tồn tại, nên trình biên dịch báo không tìm thấy ký hiệu.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Có nhánh không trả về giá
      trị.</div><div class="code"><div>    <span class="kw">if</span> (soTien &lt;
      500000) {</div><div>        <span class="kw">return</span> 0;</div><div>    }
      <span class="kw">else</span> <span class="kw">if</span> (soTien &lt; 10000000)
      {</div><div>        <span class="kw">return</span> 2200;</div><div>    }</div><div>}                                    <span
      class="cm">// SAI: nhánh còn lại không trả gì</span></div><div> </div></div><p><b>Trình
      biên dịch báo</b></p><div class="code"><div><span class="cm">error: missing
      return statement</span></div></div>'
    focus:
    - 1
    - 2
    - 4
    clear: true
    say: Lỗi thứ hai là quên lệnh trả về ở một nhánh. Hàm hứa trả về số nguyên dài,
      nhưng khi số tiền từ mười triệu trở lên thì không có lệnh trả về nào chạy. Trình
      biên dịch phát hiện ngay, và báo thiếu lệnh trả về.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Tưởng hàm sửa được
      biến số nguyên của người gọi.</div><div class="code"><div><span class="kw">static</span>
      <span class="kw">long</span> truPhi(<span class="kw">long</span> soDu, <span
      class="kw">long</span> phi) {</div><div>    soDu = soDu - phi;               <span
      class="cm">// chỉ đổi bản sao</span></div><div>    <span class="kw">return</span>
      soDu;</div></div><div class="code"><div><span class="kw">long</span> soDu =
      500000;</div><div>truPhi(soDu, 2200);              <span class="cm">// SAI:
      bỏ đi giá trị trả về</span></div><div>System.out.println(soDu);</div><div>soDu
      = truPhi(soDu, 2200);       <span class="cm">// ĐÚNG: gán lại giá trị trả về</span></div><div>System.out.println(soDu);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>500000</div><div>497800</div></div>'
    focus:
    - 3
    - - 2
      - 5
    - - 3
      - 5
    clear: true
    say: 'Lỗi thứ ba gặp cả ở người đã đi làm: gọi hàm trừ phí rồi bỏ đi giá trị trả
      về, vì tưởng hàm đã sửa số dư. Hàm chỉ sửa bản sao, nên số dư vẫn là năm trăm
      nghìn, mà không có báo lỗi nào. Cách đúng là gán lại giá trị trả về, khi đó
      số dư mới là bốn trăm chín mươi bảy nghìn tám trăm.'
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 5 * 2 == 10
  - 5 * 2 ** 3 == 40
  steps:
  - show: <p><b>Đoán hai dòng in ra</b></p><div class="code"><div><span class="kw">static</span>
      <span class="kw">int</span> gapDoi(<span class="kw">int</span> x) {</div><div>    x
      = x * 2;</div><div>    <span class="kw">return</span> x;</div><div>}</div><div><span
      class="kw">static</span> <span class="kw">int</span> gapDoi(<span class="kw">int</span>
      x, <span class="kw">int</span> lan) {</div><div>    <span class="kw">for</span>
      (<span class="kw">int</span> i = 0; i &lt; lan; i++) { x = gapDoi(x); }</div><div>    <span
      class="kw">return</span> x;</div><div>}</div></div><div class="code"><div><span
      class="kw">int</span> a = 5;</div><div><span class="kw">int</span> b = gapDoi(a);</div><div>System.out.println(a
      + " " + b);</div><div>System.out.println(gapDoi(a, 3));</div></div>
    focus:
    - 1
    - 2
    - 3
    - 3
    pause: 20
    clear: true
    say: 'Bây giờ tới phần bạn tự làm. Có hai hàm gấp đôi trùng tên: một hàm nhận
      một số, một hàm nhận thêm số lần lặp. Hàm chính gọi gấp đôi với biến a bằng
      năm, in a và b, rồi gọi bản hai tham số với số lần là ba. Hãy dừng video, viết
      ra giấy hai dòng in ra.'
  - show: '<p>Dòng thứ nhất: tham số <code>x</code> là bản sao, nên <code>a</code>
      vẫn là 5.</p>$$\text{gapDoi}(5) = 5 \times 2 = 10 \quad \to \quad \hl{\text{5
      10}}$$'
    focus:
    - 1
    - 1
    - 2
    say: Đáp án như sau. Hàm gấp đôi chỉ nhân đôi bản sao, nên a vẫn là năm, còn b
      nhận giá trị trả về là mười. Dòng thứ nhất là năm mười.
    clear: true
  - show: '<p>Dòng thứ hai: bản hai tham số gọi bản một tham số ba lần.</p>$$5 \to
      10 \to 20 \to \hl{40}$$'
    focus:
    - 1
    - 2
    say: Dòng thứ hai, máy chọn bản hai tham số vì có hai đối số. Vòng lặp chạy ba
      lần, mỗi lần gọi bản một tham số, nên năm thành mười, rồi hai mươi, rồi bốn
      mươi.
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>5 10</div><div>40</div></div>
    clear: true
    say: Chạy thật chương trình, hai dòng in ra đúng là năm mười, và bốn mươi.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>đặt tên một việc</span><span class='a'>→</span><span
      class='n'>tham số nhận bản sao</span><span class='a'>→</span><span class='n'>return
      trả kết quả</span><span class='a'>→</span><span class='n'>người gọi gán lại
      kết quả</span></div>
    say: Tổng kết chuỗi logic. Ta đặt tên cho một việc thành một hàm, tham số nhận
      bản sao của đối số, lệnh trả về đưa kết quả ra, và người gọi phải gán lại kết
      quả đó.
  - show: '<div class=''box key''><b>Tư duy:</b> mỗi hàm làm <b>một việc</b>, tên
      là động từ nói đúng việc đó. Hàm dài quá một màn hình

      hoặc vừa tính, vừa in, vừa sửa dữ liệu là dấu hiệu nên tách. Muốn đổi số của
      người gọi thì <b>trả về</b> giá trị mới.</div>

      '
    say: Điều cần mang theo. Mỗi hàm chỉ làm một việc, với tên là động từ nói đúng
      việc đó. Hàm quá dài, hoặc vừa tính, vừa in, vừa sửa dữ liệu, là dấu hiệu nên
      tách nhỏ. Muốn đổi số của người gọi thì trả về giá trị mới.
