- id: formula
  kind: formula
  title: 'Suy ra từng bước: vì sao số lớn nhất là 2 147 483 647'
  checks:
  - 4 * 8 == 32
  - 2**32 == 4294967296
  - 2**31 - 1 == 2147483647
  - ((2**31 - 1) + 1 + 2**31) % 2**32 - 2**31 == -2**31
  steps:
  - show: '<p><b>Bước 1.</b> Mỗi byte có 8 ô, mỗi ô chỉ là 0 hoặc 1. Kiểu <code>int</code>
      có 4 byte:</p>

      $$4 \times 8 = \hl{32} \text{ ô}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, đếm số ô. Mỗi bai gồm tám ô, mỗi ô chỉ là không hoặc một, vì máy
      chỉ có hai con số đó. Kiểu số nguyên có bốn bai, nên có bốn nhân tám là ba mươi
      hai ô.
  - show: '<p><b>Bước 2.</b> Mỗi ô thêm vào làm số cách xếp <b>gấp đôi</b>, nên 32
      ô cho:</p>

      $$2^{32} = \hl{4\,294\,967\,296} \text{ giá trị khác nhau}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, đếm số giá trị. Một ô có hai cách, hai ô có bốn cách, vì mỗi ô
      thêm vào làm số cách gấp đôi. Vậy ba mươi hai ô cho hai mũ ba mươi hai, hơn
      bốn tỉ hai trăm triệu giá trị.
  - show: '<p><b>Bước 3.</b> Java chia đôi: một nửa cho số âm, nửa kia cho số 0 và
      số dương:</p>

      $$2^{31} = 2\,147\,483\,648 \text{ số âm} \qquad 2^{31} - 1 = \hl{2\,147\,483\,647}
      \text{ là số dương lớn nhất}$$

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, chia đôi. Một nửa số giá trị dành cho số âm, nửa kia cho số không
      và các số dương. Nửa thứ hai phải nhường một chỗ cho số không, nên số dương
      lớn nhất là hai mũ ba mươi mốt trừ một.
  - show: '<p><b>Bước 4.</b> Cộng 1 vào số lớn nhất: kết quả cần 33 ô, máy chỉ giữ
      32 ô nên <b>bỏ phần tràn</b>, ra số nhỏ nhất.</p><div class="code"><div><span
      class="kw">int</span> lonNhat = Integer.MAX_VALUE;</div><div><span class="kw">int</span>
      nhoNhat = Integer.MIN_VALUE;</div><div>System.out.println(lonNhat);</div><div>System.out.println(nhoNhat);</div><div>System.out.println(lonNhat
      + 1);   <span class="cm">// vượt số lớn nhất một đơn vị</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>2147483647</div><div>-2147483648</div><div>-2147483648</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước bốn, vượt giới hạn. Cộng một vào số lớn nhất thì kết quả cần ba mươi
      ba ô. Theo luật của Java, máy bỏ phần tràn, chỉ giữ ba mươi hai ô. Kết quả là
      số nhỏ nhất của kiểu số nguyên. Chạy thật, dòng cuối đúng là số đó, và không
      có thông báo lỗi nào.
- id: example
  kind: example
  title: 'Ví dụ: cộng ba đợt lương bằng kiểu số nguyên dài'
  checks:
  - 900000000 + 900000000 == 1800000000
  - 1800000000 + 900000000 == 2700000000
  - 3 * 5500 == 16500
  - 2700000000 + 16500 == 2700016500
  steps:
  - show: '<p><b>Tệp Luong.java</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> Luong {</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>        <span class="kw">long</span> dot = 900000000L;          <span
      class="cm">// (1) một đợt lương (số minh hoạ)</span></div><div>        <span
      class="kw">long</span> tong = dot + dot;          <span class="cm">// (2) hai
      đợt</span></div><div>        tong = tong + dot;              <span class="cm">//
      (3) thêm đợt thứ ba</span></div><div>        <span class="kw">long</span> phi
      = 3 * 5500L;           <span class="cm">// (4) phí ba lần chuyển (số minh hoạ)</span></div><div>        <span
      class="kw">long</span> tongTru = tong + phi;      <span class="cm">// (5) tổng
      bị trừ khỏi tài khoản</span></div><div>        System.out.println("Tong luong:
      " + tong);</div><div>        System.out.println("Phi: " + phi);</div><div>        System.out.println("Tong
      tru: " + tongTru);</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ta làm lại bài toán ba đợt lương bằng kiểu số nguyên dài, theo đơn vị đồng.
      Chương trình có năm phép tính đánh số, ta đi từng phép.
  - show: <div class="code"><div><span class="kw">long</span> dot = 900000000L;          <span
      class="cm">// (1) một đợt lương (số minh hoạ)</span></div><div><span class="kw">long</span>
      tong = dot + dot;          <span class="cm">// (2) hai đợt</span></div></div><p>①
      một đợt lương; ② cộng hai đợt:</p>$$① \; 900\,000\,000 \qquad ② \; 900\,000\,000
      + 900\,000\,000 = \hl{1\,800\,000\,000}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất đặt chín trăm triệu vào biến đợt, chữ L báo đây là số
      nguyên dài. Phép tính thứ hai cộng hai đợt, ra một tỉ tám trăm triệu, cất vào
      biến tổng.
  - show: <div class="code"><div>tong = tong + dot;              <span class="cm">//
      (3) thêm đợt thứ ba</span></div></div><p>③ vế phải dùng giá trị <b>cũ</b> của
      <code>tong</code>, rồi ghi đè:</p>$$③ \; 1\,800\,000\,000 + 900\,000\,000 =
      \hl{2\,700\,000\,000}$$
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép tính thứ ba là phép gán ta vừa học. Vế phải dùng giá trị cũ của tổng,
      cộng thêm một đợt, ra hai tỉ bảy trăm triệu rồi ghi đè. Số này vượt giới hạn
      của kiểu số nguyên, nhưng ngăn tám bai chứa thoải mái.
  - show: <div class="code"><div><span class="kw">long</span> phi = 3 * 5500L;           <span
      class="cm">// (4) phí ba lần chuyển (số minh hoạ)</span></div><div><span class="kw">long</span>
      tongTru = tong + phi;      <span class="cm">// (5) tổng bị trừ khỏi tài khoản</span></div></div><p>④
      phí 5 500 đồng mỗi lần (số minh hoạ); ⑤ tổng bị trừ:</p>$$④ \; 3 \times 5\,500
      = \hl{16\,500} \qquad ⑤ \; 2\,700\,000\,000 + 16\,500 = \hl{2\,700\,016\,500}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư tính phí ba lần chuyển, mỗi lần năm nghìn năm trăm đồng,
      là số minh hoạ, ra mười sáu nghìn năm trăm. Phép tính thứ năm cộng phí vào tổng
      lương, ra hai tỉ bảy trăm triệu không trăm mười sáu nghìn năm trăm đồng.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Tong luong: 2700000000</div><div>Phi:
      16500</div><div>Tong tru: 2700016500</div></div>'
    clear: true
    say: Chạy thật chương trình, ba dòng in ra đúng ba con số ta vừa tính tay.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: nhân thay cộng, đoán trước số âm'
  checks:
  - 3 * 900000000 == 2700000000
  - 2700000000 > 2147483647
  - 2700000000 - 2**32 == -1594967296
  - (3 * 900000000 + 2**31) % 2**32 - 2**31 == -1594967296
  steps:
  - show: '<p>Đường khác 1: ba đợt bằng nhau thì <b>nhân</b> thay vì cộng ba lần:</p>

      $$3 \times 900\,000\,000 = 2\,700\,000\,000 \; ✓$$

      '
    focus:
    - 1
    - 2
    say: Đường kiểm thứ nhất, vì ba đợt bằng nhau nên ta nhân ba với chín trăm triệu
      thay vì cộng ba lần. Kết quả hai tỉ bảy trăm triệu, khớp với khi chạy.
  - show: '<p>Đường khác 2: tổng vượt số lớn nhất của <code>int</code>, nên ở đầu
      bài máy đã <b>quay vòng</b>, tức là trừ đúng một vòng $2^{32}$:</p>

      $$2\,700\,000\,000 > 2\,147\,483\,647 \qquad 2\,700\,000\,000 - 4\,294\,967\,296
      = \hl{-1\,594\,967\,296}$$<p><b>Kết quả chạy ở đầu bài</b></p><div class="code"><div>Tong
      luong: -1594967296</div></div>

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đường kiểm thứ hai giải thích số âm ở đầu bài. Hai tỉ bảy vượt số lớn nhất
      của kiểu số nguyên, nên bị quay vòng, nghĩa là trừ đi đúng hai mũ ba mươi hai.
      Phép trừ này cho đúng con số âm mà máy đã in, đến từng chữ số.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Đặt một chuỗi chữ vào ngăn
      kiểu số.</div><div class="code"><div><span class="kw">int</span> soDu = "100000";            <span
      class="cm">// chuỗi chữ, không phải số</span></div></div><p><b>Trình biên dịch
      báo</b></p><div class="code"><div><span class="cm">error: incompatible types:
      String cannot be converted to int</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là đặt một chuỗi trong nháy kép vào ngăn kiểu
      số nguyên. Nhìn giống số, nhưng nháy kép biến nó thành chữ. Trình biên dịch
      từ chối ngay, báo không đổi được chuỗi thành số nguyên.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Dùng <code>int</code>
      cho tổng tiền: tràn số mà không báo.</div><div class="code"><div><span class="kw">int</span>
      dot = 900000000;            <span class="cm">// một đợt lương: 900 triệu đồng
      (số minh hoạ)</span></div><div><span class="kw">int</span> tong = dot + dot
      + dot;     <span class="cm">// ba đợt, cất trong kiểu int</span></div><div>System.out.println("Tong
      luong: " + tong);</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Tong
      luong: -1594967296</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai, gặp cả ở người đã đi làm, là dùng kiểu số nguyên cho tổng tiền.
      Từng khoản thì vừa, cộng lại thì vượt hai tỉ một. Chương trình chạy êm, chỉ
      có con số sai, nên rất khó phát hiện. Tổng tiền luôn dùng kiểu số nguyên dài.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Dùng <code>double</code>
      cho tiền.</div><div class="code"><div><span class="kw">double</span> a = 0.1;                 <span
      class="cm">// 0,1 nghìn đồng = 100 đồng</span></div><div><span class="kw">double</span>
      b = 0.2;                 <span class="cm">// 0,2 nghìn đồng = 200 đồng</span></div><div>System.out.println(a
      + b);      <span class="cm">// mong 0.3</span></div><div><span class="kw">long</span>
      x = 100;                   <span class="cm">// cách đúng: tính theo đồng</span></div><div><span
      class="kw">long</span> y = 200;</div><div>System.out.println(x + y);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>0.30000000000000004</div><div>300</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba là dùng kiểu số thực cho tiền. Không phẩy một cộng không phẩy
      hai ra một số lệch ở chữ số thứ mười bảy sau dấu phẩy. Lý do là số thực lưu
      theo hệ hai, mà không phẩy một trong hệ hai là số lẻ vô hạn, như một phần ba
      trong hệ mười. Cách đúng là đổi ra đồng, một trăm cộng hai trăm ra đúng ba trăm.
  - show: <p>Khi tiền <b>bắt buộc</b> có phần lẻ (tỉ giá, lãi suất), Java có kiểu
      số thập phân chính xác <code>BigDecimal</code>:</p><div class="code"><div>BigDecimal
      a = <span class="kw">new</span> BigDecimal("0.1");   <span class="cm">// tạo
      từ chuỗi "0.1"</span></div><div>BigDecimal b = <span class="kw">new</span> BigDecimal("0.2");</div><div>System.out.println(a.add(b));           <span
      class="cm">// cộng chính xác</span></div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>0.3</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Khi tiền bắt buộc có phần lẻ, như tỉ giá, Java có sẵn một kiểu số thập phân
      chính xác. Tạo số từ chuỗi chữ rồi cộng bằng lệnh riêng, ra đúng không phẩy
      ba. Bài này chỉ cần biết nó tồn tại.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 5 + 10 == 15
  - str(15 + 5) + ' dong' == '20 dong'
  steps:
  - show: <p><b>Đoán ba dòng in ra</b></p><div class="code"><div><span class="kw">int</span>
      x = 5;</div><div><span class="kw">int</span> y = x;</div><div>x = x + 10;</div><div>System.out.println("x
      = " + x);</div><div>System.out.println("y = " + y);</div><div>System.out.println(x
      + y + " dong");</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    pause: 20
    clear: true
    say: Bây giờ tới phần bạn tự làm. Biến x nhận năm, biến y nhận giá trị của x,
      rồi x được cộng thêm mười. Ba lệnh in in x, in y, và in x cộng y nối chữ đồng.
      Hãy dừng video, viết ra giấy ba dòng in ra.
  - show: <table class='t'><tr><th>sau lệnh</th><th>x</th><th>y</th><th>vì sao</th></tr><tr><td><code>int
      x = 5;</code></td><td>5</td><td>—</td><td>tạo ngăn x, đặt 5</td></tr><tr><td><code>int
      y = x;</code></td><td>5</td><td>5</td><td>y nhận <b>bản sao</b> giá trị của
      x</td></tr><tr><td><code>x = x + 10;</code></td><td>15</td><td>5</td><td>chỉ
      ngăn x bị ghi đè; y không đổi</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án, ta lập bảng giá trị sau từng lệnh. Lệnh một tạo x bằng năm. Lệnh
      hai chép giá trị năm sang y, chỉ là bản sao. Lệnh ba ghi đè mười lăm vào x,
      còn y vẫn là năm vì không lệnh nào ghi vào y.
    clear: true
  - show: '<p>Dòng in thứ ba: hai số đứng trước nên cộng trước, rồi mới nối chữ (quy
      tắc vế trái của bài trước):</p>$$15 + 5 + \text{" dong"} = 20 + \text{" dong"}
      = \hl{\text{20 dong}}$$'
    focus:
    - 1
    - 2
    say: Dòng in thứ ba dùng quy tắc vế trái của bài trước. Hai số đứng trước nên
      cộng thành hai mươi, rồi mới nối chữ đồng.
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>x = 15</div><div>y = 5</div><div>20
      dong</div></div>
    clear: true
    say: Chạy thật, ba dòng in ra là x bằng mười lăm, y bằng năm, và hai mươi đồng.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>biến = ngăn có tên</span><span class=''a''>→</span><span
      class=''n''>kiểu = cỡ ngăn và thứ được chứa</span><span class=''a''>→</span><span
      class=''n''>gán: tính vế phải rồi ghi đè</span><span class=''a''>→</span><span
      class=''n''>vượt cỡ thì quay vòng, không báo</span><span class=''a''>→</span><span
      class=''n''>tiền: số nguyên dài theo đồng</span></div>'
    say: Tổng kết chuỗi logic. Biến là ngăn nhớ có tên, kiểu quyết định cỡ ngăn và
      thứ được chứa. Phép gán tính vế phải rồi ghi đè. Vượt cỡ ngăn thì số quay vòng
      mà không báo, vì vậy tiền dùng số nguyên dài theo đồng.
  - show: '<div class=''box key''><b>Tư duy:</b> trước khi khai một biến, hỏi hai
      câu: <b>giá trị lớn nhất</b> nó có thể đạt là bao nhiêu,

      và nó có cần <b>phần lẻ chính xác</b> không. Tổng tiền thì luôn chọn <code>long</code>,
      đơn vị đồng.</div>

      '
    say: Điều cần mang theo. Trước khi khai một biến, hãy hỏi giá trị lớn nhất nó
      có thể đạt là bao nhiêu, và nó có cần phần lẻ chính xác không. Với tổng tiền,
      câu trả lời luôn là kiểu số nguyên dài, đơn vị đồng.
