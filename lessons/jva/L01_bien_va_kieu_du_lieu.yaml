id: L01
course: JVA
series: JVA · Lập trình Java từ con số 0
title: Bài 1 — Biến và kiểu dữ liệu
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: 'curriculum/jva.yaml L01; audit/jva/verify_jva.py L01 (javac/java chạy thật);
  The Java Language Specification, Java SE 21: §4.2.1 (miền giá trị int, long, char),
  §4.2.2 (phép toán số nguyên không báo tràn), §15.18.2 (tràn khi cộng: giữ các bit
  thấp theo bù hai), §4.2.3 (số thực IEEE 754), §3.10.1 (hậu tố L); java.math.BigDecimal
  (Java SE 21 API); dev.java/learn'
assumes: []
objectives:
- Khai báo và gán biến, đọc đúng phép gán là tính vế phải rồi ghi đè
- Chọn đúng kiểu trong sáu kiểu số nguyên, số nguyên dài, số thực, đúng sai, ký tự,
  chuỗi
- Suy ra giới hạn của kiểu số nguyên và giải thích hiện tượng tràn số
- Tính tổng tiền bằng kiểu số nguyên dài theo đồng, biết vì sao không dùng số thực
asr_reviewed:
- sentence: Phép gán tính vế phải rồi ghi đè.
  reason: 'ASR chép “Phép gãng tính vế phải rồi ghi đây.” (0.75): lệch âm/thanh thuần
    Việt gán/gãng, đè/đây; đủ 8 từ — NOT_VERIFIED bằng tai người'
- sentence: Theo luật của Java, máy bỏ phần tràn, chỉ giữ ba mươi hai ô.
  reason: 'ASR chép “Theo luật của Java, máy bỏ phần tràn chỉ giữ 32 ohm.” (0.929):
    “ô” (ô nhớ/bit) ASR viết “ohm”; số ba mươi hai ASR viết 32 (đúng) — NOT_VERIFIED
    bằng tai người'
scenes:
- id: hook
  kind: hook
  title: Ba đợt lương chín trăm triệu, vì sao tổng lại âm?
  steps:
  - show: '<p><b>Một chương trình cộng ba đợt lương, mỗi đợt 900 triệu đồng, in ra</b></p><div
      class="code"><div>Tong luong: -1594967296</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Một chương trình cộng ba đợt lương, mỗi đợt chín trăm triệu đồng. Tổng đúng
      phải là hai tỉ bảy trăm triệu. Thế mà máy in ra một số âm, và không hề báo lỗi.
  - show: '<p>Lỗi không nằm ở phép cộng, mà ở <b>cái ngăn</b> dùng để cất con số.</p>

      <div class="box key">Hôm nay: <b>biến</b> là ngăn nhớ có tên, <b>kiểu</b> quyết
      định ngăn to bao nhiêu và chứa được gì.</div>

      '
    focus:
    - 1
    - 2
    say: Lỗi không nằm ở phép cộng, mà ở cái ngăn dùng để cất con số. Hôm nay ta học
      biến, tức là ngăn nhớ có tên, và kiểu, thứ quyết định ngăn to bao nhiêu và chứa
      được gì.
- id: prereq
  kind: prereq
  title: Ôn lại điều đã biết từ bài trước
  steps:
  - show: <table class='t'><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      chương trình</td><td>máy làm từng lệnh trong hàm chính, từ trên xuống</td></tr><tr><td>②
      lệnh in</td><td><code>System.out.println(…)</code> in giá trị trong ngoặc rồi
      xuống dòng</td></tr><tr><td>③ dấu <code>+</code></td><td>hai số thì cộng; có
      một vế là chuỗi thì nối chữ, làm từ trái sang phải</td></tr><tr><td>④ bộ nhớ</td><td>chỗ
      giữ dữ liệu khi chương trình đang chạy, như tờ giấy nháp</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều từ bài trước. Máy làm từng lệnh trong hàm chính, từ trên
      xuống. Lệnh in in giá trị trong ngoặc. Dấu cộng có một vế là chuỗi thì thành
      nối chữ. Còn bộ nhớ giữ dữ liệu khi chương trình chạy, như tờ giấy nháp.
  - show: '<p>Câu hỏi hôm nay: muốn <b>nhớ</b> một con số để dùng lại ở lệnh sau,
      ta ghi nó vào đâu trên tờ giấy nháp ấy?</p>'
    say: Câu hỏi hôm nay là, muốn nhớ một con số để dùng lại ở lệnh sau, ta ghi nó
      vào đâu trên tờ giấy nháp ấy.
- id: sym
  kind: symbol
  title: Giải mã một dòng khai báo biến
  steps:
  - show: '<p><b>Tệp Bien.java</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> Bien {</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>        <span class="kw">long</span> soDu = 100000;                 <span
      class="cm">// tạo ngăn tên soDu, đặt vào 100000</span></div><div>        System.out.println("So
      du: " + soDu);</div><div>        soDu = soDu + 50000;                <span class="cm">//
      nạp thêm 50000: tính vế phải, ghi đè</span></div><div>        System.out.println("So
      du: " + soDu);</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Đây là chương trình có một biến tên số dư. Dòng thứ ba tạo biến, dòng thứ
      năm cộng thêm năm mươi nghìn. Ta đọc kỹ dòng tạo biến trước.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>long</code></td><td><b>kiểu</b>:
      ngăn này chứa số nguyên, cỡ 8 byte</td></tr><tr><td><code>soDu</code></td><td><b>tên</b>
      biến: chữ đầu viết thường, mỗi từ sau viết hoa chữ đầu</td></tr><tr><td><code>=</code></td><td><b>gán</b>:
      tính vế phải, rồi đặt kết quả vào ngăn bên trái (không phải “bằng” của toán)</td></tr><tr><td><code>100000</code></td><td>giá
      trị đặt vào lúc tạo</td></tr><tr><td><code>;</code></td><td>hết một lệnh, như
      ở bài trước</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - - '1.5'
      - '1.6'
    clear: true
    say: Chữ đầu là kiểu, ở đây là kiểu số nguyên dài, nghĩa là ngăn chỉ chứa số nguyên.
      Tiếp theo là tên biến, chữ đầu viết thường. Dấu bằng là phép gán, không phải
      dấu bằng của toán, vì máy tính vế phải trước rồi đặt kết quả vào ngăn bên trái.
      Sau đó là giá trị lúc tạo, và dấu chấm phẩy.
  - show: '<div class="code"><div>soDu = soDu + 50000;                <span class="cm">//
      nạp thêm 50000: tính vế phải, ghi đè</span></div><div>System.out.println("So
      du: " + soDu);</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>So
      du: 100000</div><div>So du: 150000</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Vì vậy dòng số dư bằng số dư cộng năm mươi nghìn không phải phương trình
      vô lý. Máy đọc giá trị cũ, cộng thêm, rồi ghi đè vào chính ngăn đó, nên lệnh
      in thứ hai in ra số mới.
  - show: <table class='t'><tr><th>kiểu</th><th>chứa gì</th><th>ví dụ giá trị</th><th>cỡ</th></tr><tr><td><code>int</code></td><td>số
      nguyên</td><td><code>3</code>, <code>-15</code></td><td>4 byte</td></tr><tr><td><code>long</code></td><td>số
      nguyên lớn (giá trị lớn viết thêm chữ <code>L</code>)</td><td><code>5000000000L</code></td><td>8
      byte</td></tr><tr><td><code>double</code></td><td>số thực, có phần lẻ</td><td><code>0.055</code></td><td>8
      byte</td></tr><tr><td><code>boolean</code></td><td>đúng hoặc sai</td><td><code>true</code>,
      <code>false</code></td><td>—</td></tr><tr><td><code>char</code></td><td>một
      ký tự, nháy đơn</td><td><code>'A'</code></td><td>2 byte</td></tr><tr><td><code>String</code></td><td>chuỗi
      chữ, nháy kép</td><td><code>"Nguyen Van An"</code></td><td>tuỳ độ dài</td></tr></table>
    focus:
    - 1
    - - '1.2'
      - '1.3'
    - '1.4'
    - '1.5'
    - - '1.6'
      - '1.7'
    clear: true
    say: Đây là sáu kiểu dùng nhiều nhất. Kiểu số nguyên chiếm bốn bai, kiểu số nguyên
      dài chiếm tám bai. Kiểu số thực chứa số có phần lẻ, như lãi suất. Kiểu đúng
      sai chỉ có hai giá trị, đúng hoặc sai. Kiểu ký tự chứa một ký tự trong nháy
      đơn, còn kiểu chuỗi chứa cả dòng chữ trong nháy kép.
  - show: '<div class="code"><div><span class="kw">int</span> soLenh = 3;                     <span
      class="cm">// số nguyên</span></div><div><span class="kw">long</span> soDu =
      5000000000L;            <span class="cm">// số nguyên lớn, chữ L ở cuối</span></div><div><span
      class="kw">double</span> laiSuat = 0.055;             <span class="cm">// số
      thực (số minh hoạ)</span></div><div><span class="kw">boolean</span> daKhoa =
      <span class="kw">false</span>;             <span class="cm">// chỉ đúng hoặc
      sai</span></div><div><span class="kw">char</span> hang = ''A'';                    <span
      class="cm">// một ký tự, nháy đơn</span></div><div>String ten = "Nguyen Van
      An";       <span class="cm">// chuỗi chữ, nháy kép</span></div><div>System.out.println(ten
      + ", hang " + hang);</div><div>System.out.println("So du: " + soDu + ", so lenh:
      " + soLenh);</div><div>System.out.println("Lai: " + laiSuat + ", khoa: " + daKhoa);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>Nguyen Van An, hang A</div><div>So du:
      5000000000, so lenh: 3</div><div>Lai: 0.055, khoa: false</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Đây là cả sáu kiểu trong một chương trình, ba lệnh in cuối dùng phép nối
      chữ để in mọi biến. Để ý số năm tỉ in ra không có chữ L, vì chữ L chỉ là ký
      hiệu trong mã nguồn, báo đây là số nguyên dài.
