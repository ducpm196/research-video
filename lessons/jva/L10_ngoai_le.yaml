scenes:
- id: hook
  kind: hook
  title: Rút quá số dư mà biên lai vẫn in “đã rút”?
  steps:
  - show: '<p><b>Lớp tài khoản kiểu cũ, rút gọn: rút quá số dư thì chỉ in thông báo</b></p><div
      class="code"><div><span class="kw">void</span> rut(<span class="kw">long</span>
      tien) {</div><div>    <span class="kw">if</span> (tien &gt; soDu) {</div><div>        System.out.println("Khong
      du tien");   <span class="cm">// chỉ in, rồi quay về</span></div><div>        <span
      class="kw">return</span>;</div><div>    }</div><div>    soDu -= tien;</div><div>}</div></div><span
      class=''note''>Ở bài 7, hàm rút còn trả về đúng hoặc sai, nhưng không gì <b>buộc</b>
      người gọi phải xem giá trị đó.</span>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Nhớ lại lớp tài khoản ở bài bảy. Bản rút gọn này, khi rút quá số dư, chỉ
      in một dòng thông báo rồi quay về, và để mã ngắn, hàm tạo của nó nhận thẳng
      số dư đầu thay vì tên chủ. Ở bài bảy hàm rút còn trả về đúng hoặc sai, nhưng
      không gì buộc người gọi phải xem giá trị đó.
  - show: '<div class="code"><div><span class="kw">public</span> <span class="kw">static</span>
      <span class="kw">void</span> main(String[] args) {</div><div>    TaiKhoan tk
      = <span class="kw">new</span> TaiKhoan(100000);</div><div>    tk.rut(500000);</div><div>    System.out.println("In
      bien lai: da rut 500000");</div><div>}</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>Khong du tien</div><div>In bien lai: da rut 500000</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Người gọi không hề biết lệnh rút đã thất bại, nên vẫn in biên lai đã rút
      năm trăm nghìn. Với ngân hàng, đó là một lỗi nghiêm trọng.
  - show: '<div class="box key">Hôm nay: <b>ngoại lệ</b> — cách để phương thức <b>báo
      lỗi cho người gọi</b>, và buộc người gọi phải xử lý.

      Bạn cũng học đọc <b>dấu vết ngăn xếp</b> để tìm đúng lệnh gây lỗi.</div>

      <p><b>Ngăn xếp</b> (lời gọi): danh sách các hàm đang chạy dở, hàm được gọi sau
      cùng nằm trên cùng. <b>Dấu vết ngăn xếp</b>: bản in danh sách đó lúc lỗi xảy
      ra.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Hôm nay ta học ngoại lệ, cách để một phương thức báo lỗi cho người gọi và
      buộc người gọi phải xử lý. Bạn cũng sẽ đọc dấu vết ngăn xếp để tìm đúng lệnh
      gây lỗi. Ngăn xếp ở đây là danh sách các hàm đang chạy dở, hàm được gọi sau
      cùng nằm trên cùng, còn dấu vết ngăn xếp là bản in danh sách đó lúc lỗi xảy
      ra.
- id: prereq
  kind: prereq
  title: 'Ôn lại: lớp tài khoản và lỗi khi chạy'
  steps:
  - show: '<table class=''t''><tr><th>đã học</th><th>điều dùng lại hôm nay</th></tr><tr><td>①
      Lớp tài khoản</td><td>trường <code>private</code> số dư, hàm tạo, phương thức
      rút giữ bất biến “số dư không âm”</td></tr><tr><td>② Lỗi khi chạy</td><td>chia
      cho 0 hay vượt chỉ số mảng: máy ảo ném <b>ngoại lệ</b>, chương trình dừng</td></tr><tr><td>③
      Gọi lồng hàm</td><td>hàm chính gọi hàm A, hàm A gọi hàm B; xong B mới quay về
      A</td></tr></table>'
    say: 'Ta ôn ba điều. Thứ nhất, lớp tài khoản có trường số dư riêng, và phương
      thức rút giữ bất biến số dư không âm. Thứ hai, khi chia cho không hay vượt chỉ
      số mảng, máy ảo ném ra ngoại lệ và chương trình dừng. Thứ ba, hàm có thể gọi
      lồng nhau: hàm chính gọi hàm A, hàm A gọi hàm B, xong B mới quay về A.'
- id: sym
  kind: symbol
  title: 'Giải mã ký hiệu: thử, bắt, cuối cùng, ném'
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>try
      { … }</code></td><td><b>khối thử</b>: các lệnh có thể gặp lỗi</td></tr><tr><td><code>catch
      (KhongDuTien e) { … }</code></td><td><b>khối bắt</b>: chạy khi có ngoại lệ đúng
      loại; <code>e</code> là ngoại lệ đó</td></tr><tr><td><code>finally { … }</code></td><td><b>khối
      cuối cùng</b>: chạy mỗi khi rời khối thử, có lỗi hay không (chỉ bỏ lỡ khi cả
      chương trình bị tắt ngang, như gọi <code>System.exit</code>)</td></tr><tr><td><code>throw
      new KhongDuTien("…")</code></td><td><b>ném</b>: tạo ngoại lệ và dừng phương
      thức ngay</td></tr><tr><td><code>throws KhongDuTien</code></td><td>ghi trên
      phương thức: “có thể ném loại này”</td></tr><tr><td><code>class KhongDuTien
      extends Exception</code></td><td><b>kế thừa</b>: lớp mới là <b>một loại</b>
      <code>Exception</code> (lớp cha), nhận sẵn mọi thứ lớp cha có</td></tr><tr><td><code>super(thongBao);</code></td><td>trong
      hàm tạo: gọi hàm tạo của lớp cha, đưa lời nhắn cho lớp cha giữ</td></tr><tr><td><code>e.getMessage()</code></td><td>lấy
      lời nhắn lỗi đã gửi kèm</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    - '1.9'
    say: 'Bảng ký hiệu của bài. Khối thử chứa các lệnh có thể gặp lỗi. Khối bắt chạy
      khi có ngoại lệ đúng loại ghi trong ngoặc, và e chính là ngoại lệ đó. Khối cuối
      cùng chạy mỗi khi rời khối thử, có lỗi hay không, chỉ trừ khi cả chương trình
      bị tắt ngang. Lệnh ném tạo một ngoại lệ và dừng phương thức ngay lập tức. Còn
      khai báo có thể ném thì ghi trên đầu phương thức, báo trước rằng nó có thể ném
      loại này. Dòng kế dùng từ khoá kế thừa: lớp mới là một loại của lớp ngoại lệ
      gốc, gọi là lớp cha, và nhận sẵn mọi thứ lớp cha có. Trong hàm tạo, từ khoá
      gọi lớp cha chuyển lời nhắn lên cho lớp cha giữ. Cuối cùng, ta lấy lời nhắn
      lỗi bằng phương thức lấy lời nhắn.'
- id: intuition
  kind: intuition
  title: 'Hình dung: ngoại lệ đi ngược đường gọi tới khối bắt gần nhất'
  steps:
  - show: '<div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="60" width="300" height="120" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="170.0" y="98" font-size="22" text-anchor="middle"
      fill="#1f2937" font-weight="bold">hàm chính</text><text x="170.0" y="128" font-size="22"
      text-anchor="middle" fill="#1f2937">khối thử</text><text x="170.0" y="158" font-size="22"
      text-anchor="middle" fill="#1f2937">gọi tk.rut(500000)</text><line x1="325"
      y1="120" x2="470" y2="120" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="397" y="110" font-size="22" text-anchor="middle" fill="#2a78d6">gọi</text><rect
      x="480" y="60" width="330" height="120" rx="10" fill="#fee2e2" stroke="#dc2626"
      stroke-width="3"/><text x="645.0" y="98" font-size="22" text-anchor="middle"
      fill="#1f2937" font-weight="bold">rut</text><text x="645.0" y="128" font-size="22"
      text-anchor="middle" fill="#1f2937">500000 > 70000</text><text x="645.0" y="158"
      font-size="22" text-anchor="middle" fill="#1f2937">ném KhongDuTien</text><line
      x1="645" y1="185" x2="645" y2="260" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="660" y="230" font-size="22" text-anchor="start" fill="#dc2626">ngoại lệ quay
      ngược về người gọi</text><rect x="480" y="270" width="330" height="100" rx="10"
      fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="645.0" y="313" font-size="22"
      text-anchor="middle" fill="#1f2937" font-weight="bold">khối bắt</text><text
      x="645.0" y="343" font-size="22" text-anchor="middle" fill="#1f2937">in Tu choi:
      …</text><line x1="815" y1="320" x2="960" y2="320" stroke="#16a34a" stroke-width="3.5"
      marker-end="url(#ah)"/><rect x="970" y="270" width="300" height="100" rx="10"
      fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1120.0" y="313" font-size="22"
      text-anchor="middle" fill="#1f2937" font-weight="bold">khối cuối cùng</text><text
      x="1120.0" y="343" font-size="22" text-anchor="middle" fill="#1f2937">in So
      du: 70000</text><rect x="970" y="60" width="300" height="120" rx="10" fill="#e5e7eb"
      stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6"/><text x="1120.0" y="113"
      font-size="22" text-anchor="middle" fill="#1f2937">lệnh in kế tiếp</text><text
      x="1120.0" y="143" font-size="22" text-anchor="middle" fill="#1f2937">bị bỏ
      qua</text><text x="1120" y="215" font-size="22" text-anchor="middle" fill="#6b7280">không
      chạy</text></svg></div>'
    clear: true
    say: Hình này là đường đi của một ngoại lệ. Trong khối thử, hàm chính gọi rút
      năm trăm nghìn. Số dư chỉ có bảy mươi nghìn, nên phương thức rút ném ngoại lệ
      không đủ tiền và dừng ngay. Ngoại lệ quay ngược về người gọi, và lệnh in kế
      tiếp bị bỏ qua. Máy ảo tìm khối bắt gần nhất đúng loại, chạy nó, rồi chạy khối
      cuối cùng.
  - show: <table class='t'><tr><th></th><th>có kiểm tra</th><th>không kiểm tra</th></tr><tr><td>lớp
      cha</td><td><code>Exception</code> (trừ nhánh <code>RuntimeException</code>)</td><td><code>RuntimeException</code></td></tr><tr><td>ví
      dụ</td><td><code>KhongDuTien</code> (tự viết), <code>IOException</code></td><td><code>ArithmeticException</code>,
      <code>IllegalArgumentException</code></td></tr><tr><td>trình biên dịch</td><td><b>bắt
      buộc</b> bắt, hoặc khai <code>throws</code></td><td>không bắt buộc</td></tr><tr><td>dùng
      cho</td><td>tình huống nghiệp vụ người gọi phải xử lý</td><td>lỗi lập trình,
      đối số sai</td></tr></table>
    clear: true
    say: Ngoại lệ chia làm hai nhóm. Nhóm có kiểm tra gồm con cháu của lớp ngoại lệ
      gốc, trừ nhánh ngoại lệ khi chạy. Với nhóm này, trình biên dịch bắt buộc người
      gọi phải bắt, hoặc khai báo có thể ném tiếp. Nhóm không kiểm tra, như ngoại
      lệ phép tính, thì không bắt buộc, và thường báo lỗi lập trình. Không đủ tiền
      là tình huống người gọi phải xử lý, nên ta xếp nó vào nhóm có kiểm tra.
  - show: '<p><b>Khối thử có tài nguyên: mở ở ngoặc tròn, tự đóng khi rời khối</b></p><div
      class="code"><div>String duLieu = "A01;500000\nB02;300000";</div><div><span
      class="kw">try</span> (BufferedReader r = <span class="kw">new</span> BufferedReader(<span
      class="kw">new</span> StringReader(duLieu))) {</div><div>    System.out.println(r.readLine());</div><div>    System.out.println(r.readLine());</div><div>}
      <span class="kw">catch</span> (IOException e) {                 <span class="cm">//
      có kiểm tra: bắt buộc bắt</span></div><div>    System.out.println("Loi doc:
      " + e.getMessage());</div><div>}</div></div><span class=''note''><code>\n</code>
      là ký tự xuống dòng; <code>r.readLine()</code> đọc từng dòng. Cần <code>import
      java.io.*;</code> ở đầu tệp.</span><p><b>Kết quả chạy</b></p><div class="code"><div>A01;500000</div><div>B02;300000</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Một dạng nữa là khối thử có tài nguyên, tức thứ chương trình mở ra để dùng
      và phải đóng lại khi xong, như một bộ đọc dữ liệu. Bộ đọc được mở trong ngoặc
      tròn sau từ khoá thử, và máy tự đóng nó khi rời khối, dù có lỗi hay không. Dấu
      gạch chéo ngược kèm chữ n trong chuỗi là ký tự xuống dòng, nên dữ liệu có hai
      dòng, và mỗi lần đọc lấy ra một dòng. Đọc dữ liệu có thể gặp ngoại lệ vào ra,
      thuộc nhóm có kiểm tra, nên phải bắt nó hoặc khai báo ném tiếp, và ở đây ta
      bắt.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: rút quá số dư thì ném ngoại lệ tự định nghĩa'
  checks:
  - 100000 - 30000 == 70000
  - 500000 > 70000
  steps:
  - show: <p><b>Bước 1. Định nghĩa loại ngoại lệ “không đủ tiền”</b></p><div class="code"><div><span
      class="kw">class</span> KhongDuTien <span class="kw">extends</span> Exception
      {</div><div>    KhongDuTien(String thongBao) {</div><div>        super(thongBao);                  <span
      class="cm">// giữ lời nhắn lỗi</span></div><div>    }</div><div>}</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, định nghĩa loại ngoại lệ không đủ tiền. Từ khoá kế thừa nói lớp
      này là một loại ngoại lệ có kiểm tra, vì lớp cha là ngoại lệ gốc. Hàm tạo nhận
      lời nhắn, rồi chuyển lên cho lớp cha giữ.
  - show: '<p><b>Bước 2. Phương thức rút: kiểm tra, ném, rồi mới trừ</b></p><div class="code"><div><span
      class="kw">void</span> rut(<span class="kw">long</span> tien) <span class="kw">throws</span>
      KhongDuTien {</div><div>    <span class="kw">if</span> (tien &gt; soDu) {</div><div>        <span
      class="kw">throw</span> <span class="kw">new</span> KhongDuTien("Can " + tien
      + ", chi co " + soDu);</div><div>    }</div><div>    soDu -= tien;</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước hai, phương thức rút khai báo có thể ném không đủ tiền. Số tiền lớn
      hơn số dư thì ném, kèm lời nhắn cần bao nhiêu, có bao nhiêu. Lệnh ném dừng phương
      thức ngay, nên dòng trừ tiền không chạy, và số dư không bao giờ âm.
  - show: '<div class="code"><div>TaiKhoan tk = <span class="kw">new</span> TaiKhoan(100000);</div><div>tk.rut(500000);                   <span
      class="cm">// không bắt, không khai báo</span></div></div><p><b>Trình biên dịch
      báo</b></p><div class="code"><div><span class="cm">error: unreported exception
      KhongDuTien; must be caught or declared to be thrown</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, thử gọi rút mà không bắt. Trình biên dịch từ chối, vì đây là ngoại
      lệ có kiểm tra. Nghĩa là không ai quên được trường hợp không đủ tiền.
  - show: '<p><b>Bước 4. Người gọi bắt và xử lý</b></p><div class="code"><div>TaiKhoan
      tk = <span class="kw">new</span> TaiKhoan(100000);</div><div><span class="kw">try</span>
      {</div><div>    tk.rut(30000);</div><div>    System.out.println("Rut 30000 xong");</div><div>    tk.rut(500000);</div><div>    System.out.println("Dong
      nay khong chay");</div><div>} <span class="kw">catch</span> (KhongDuTien e)
      {</div><div>    System.out.println("Tu choi: " + e.getMessage());</div><div>}
      <span class="kw">finally</span> {</div><div>    System.out.println("So du: "
      + tk.laySoDu());</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, người gọi đặt hai lệnh rút trong khối thử. Lệnh thứ nhất rút ba
      mươi nghìn, thành công. Lệnh thứ hai bị ném ngoại lệ, nên nhảy thẳng tới khối
      bắt, in lời từ chối. Khối cuối cùng in số dư, vì nó luôn chạy.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Rut 30000 xong</div><div>Tu
      choi: Can 500000, chi co 70000</div><div>So du: 70000</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Chạy thật, đúng ba dòng: rút ba mươi nghìn xong, từ chối vì chỉ có bảy mươi
      nghìn, và số dư còn bảy mươi nghìn. Dòng không chạy đúng là không xuất hiện.'
- id: example
  kind: example
  title: 'Ví dụ: thứ tự in của thử, bắt, cuối cùng — từng bước'
  checks:
  - 10 // 2 == 5
  - 'len([''1'', ''2: 5'', ''5: / by zero'', ''6'', ''7'']) == 5'
  steps:
  - show: '<p><b>Tệp ThuTu.java, phần thân hàm chính</b></p><div class="code"><div>System.out.println("1");</div><div><span
      class="kw">try</span> {</div><div>    System.out.println("2: " + chia(10, 2));</div><div>    System.out.println("3:
      " + chia(10, 0));</div><div>    System.out.println("4");</div><div>} <span class="kw">catch</span>
      (ArithmeticException e) {</div><div>    System.out.println("5: " + e.getMessage());</div><div>}
      <span class="kw">finally</span> {</div><div>    System.out.println("6");</div><div>}</div><div>System.out.println("7");</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Ví dụ này có bảy lệnh in, đánh số từ một tới bảy. Ta theo máy ảo qua năm
      bước, rồi đoán những số nào được in.
  - show: '<div class="code"><div>System.out.println("1");</div><div><span class="kw">try</span>
      {</div><div>    System.out.println("2: " + chia(10, 2));</div></div>$$① \; \text{in
      } 1 \qquad ② \; 10 / 2 = \hl{5} \to \text{in “2: 5”}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, in số một, vì lệnh nằm trước khối thử. Bước hai, mười chia hai
      bằng năm, nên in hai, năm.
  - show: '<div class="code"><div>System.out.println("3: " + chia(10, 0));</div><div>System.out.println("4");</div></div>$$③
      \; 10 / 0 \to \text{ném ngoại lệ, bỏ qua “3” và “4”}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Bước ba, mười chia không. Phép chia ném ngoại lệ phép tính ngay trong hàm
      chia, nên lệnh in số ba chưa kịp in, và lệnh in số bốn bị bỏ qua.
  - show: '<div class="code"><div>} <span class="kw">catch</span> (ArithmeticException
      e) {</div><div>    System.out.println("5: " + e.getMessage());</div></div>$$④
      \; \text{khối bắt in “5: / by zero”}$$'
    clear: true
    say: Bước bốn, máy ảo tìm thấy khối bắt đúng loại, in số năm kèm lời nhắn chia
      cho không.
  - show: <div class="code"><div>} <span class="kw">finally</span> {</div><div>    System.out.println("6");</div><div>}</div><div>System.out.println("7");</div></div>$$⑤
      \; \text{khối cuối cùng in } 6, \text{ rồi chạy tiếp, in } 7$$
    focus:
    - 1
    - 2
    clear: true
    say: Bước năm, khối cuối cùng in số sáu. Lỗi đã được xử lý, nên chương trình chạy
      tiếp và in số bảy.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>1</div><div>2: 5</div><div>5:
      / by zero</div><div>6</div><div>7</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Chạy thật, năm dòng in ra đúng như ta theo: một, hai năm, năm kèm lời nhắn,
      sáu, bảy. Số ba và số bốn không xuất hiện.'
- id: luong
  kind: example
  title: 'Ví dụ: hai luồng chạy cùng lúc, hàm chính đợi cả hai'
  checks:
  - sum(range(1, 1001)) == 500500
  - sum(range(1001, 2001)) == 1500500
  - 500500 + 1500500 == 2001000 == sum(range(1, 2001))
  steps:
  - show: <div><svg width="1500" height="380" viewBox="0 0 1500 380" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="140" width="230" height="110" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="135.0" y="187" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">hàm chính</text><text x="135.0" y="219" font-size="24"
      text-anchor="middle" fill="#1f2937">start() hai lần</text><line x1="255" y1="170"
      x2="395" y2="100" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/><line
      x1="255" y1="220" x2="395" y2="290" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="400" y="50" width="380" height="100" rx="10" fill="#dcfce7" stroke="#16a34a"
      stroke-width="3"/><text x="590.0" y="92" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">luồng 1</text><text x="590.0" y="124" font-size="24"
      text-anchor="middle" fill="#1f2937">cộng 1 … 1000</text><rect x="400" y="250"
      width="380" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text
      x="590.0" y="292" font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">luồng
      2</text><text x="590.0" y="324" font-size="24" text-anchor="middle" fill="#1f2937">cộng
      1001 … 2000</text><text x="590" y="210" font-size="24" text-anchor="middle"
      fill="#16a34a" font-weight="bold">chạy CÙNG LÚC</text><line x1="785" y1="100"
      x2="925" y2="170" stroke="#d97706" stroke-width="3.5" marker-end="url(#ah)"/><line
      x1="785" y1="300" x2="925" y2="230" stroke="#d97706" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="930" y="140" width="300" height="110" rx="10" fill="#fef3c7" stroke="#d97706"
      stroke-width="3"/><text x="1080.0" y="187" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">join</text><text x="1080.0" y="219" font-size="24"
      text-anchor="middle" fill="#1f2937">đợi cả hai xong</text><line x1="1235" y1="195"
      x2="1295" y2="195" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="1300" y="140" width="180" height="110" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="1390.0" y="203" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">in kết quả</text></svg></div>
    clear: true
    say: Luồng là một dãy việc chạy cùng lúc với các dãy việc khác trong cùng một
      chương trình. Hàm chính khởi động hai luồng, mỗi luồng cộng một nửa dãy số,
      và hai luồng chạy song song. Sau đó hàm chính đợi cả hai làm xong, rồi mới in
      kết quả.
  - show: '<div class="code"><div><span class="kw">long</span>[] tong = <span class="kw">new</span>
      <span class="kw">long</span>[2];</div><div>Thread a = <span class="kw">new</span>
      Thread(() -&gt; {</div><div>    <span class="kw">for</span> (<span class="kw">int</span>
      i = 1; i &lt;= 1000; i++) { tong[0] += i; }      <span class="cm">// luồng 1:
      cộng 1 tới 1000</span></div><div>});</div><div>Thread b = <span class="kw">new</span>
      Thread(() -&gt; {</div><div>    <span class="kw">for</span> (<span class="kw">int</span>
      i = 1001; i &lt;= 2000; i++) { tong[1] += i; }   <span class="cm">// luồng 2:
      cộng 1001 tới 2000</span></div><div>});</div><div>a.start();</div><div>b.start();                                   <span
      class="cm">// hai luồng chạy cùng lúc</span></div><div>a.join();</div><div>b.join();                                    <span
      class="cm">// đợi cả hai làm xong</span></div><div>System.out.println(tong[0]
      + " " + tong[1] + " " + (tong[0] + tong[1]));</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>500500 1500500 2001000</div></div>'
    focus:
    - - '1.2'
      - '1.5'
    - - '1.3'
      - '1.6'
    - '1.1'
    - - '1.8'
      - '1.9'
    - - '1.10'
      - '1.11'
    - 3
    clear: true
    say: Mỗi luồng nhận việc cần làm, viết bằng hàm nhỏ mũi tên như ở bài danh sách.
      Luồng một cộng từ một tới một nghìn vào ô không, luồng hai cộng từ một nghìn
      không trăm linh một tới hai nghìn vào ô một. Hai luồng ghi vào hai ô khác nhau,
      nên không đụng nhau. Lệnh khởi động cho luồng chạy ngay, và hàm chính không
      đợi. Lệnh đợi bắt hàm chính chờ luồng đó xong, và vì việc chờ có thể bị ngắt
      nên hàm chính phải khai báo lỗi, như khi làm việc với tệp. Kết quả là năm trăm
      nghìn năm trăm, một triệu năm trăm nghìn năm trăm, và tổng hai triệu không trăm
      linh một nghìn, đúng bằng tổng từ một tới hai nghìn.
  - show: '<div class="box key"><b>Điều cần nhớ.</b> Hai luồng chạy cùng lúc nên <b>thứ
      tự xen kẽ giữa chúng không đoán trước được</b>, mỗi lần chạy có thể khác.

      Ở đây an toàn vì mỗi luồng ghi vào ô <b>riêng</b>, và hàm chính chỉ đọc sau
      khi đã đợi. Hai luồng cùng sửa <b>một</b> biến thì kết quả có thể sai: đó là
      chủ đề của khoá sau.</div>

      '
    clear: true
    forward_ref: true
    say: Điều cần nhớ là hai luồng chạy cùng lúc, nên thứ tự xen kẽ giữa chúng không
      đoán trước được, mỗi lần chạy có thể khác. Ở đây an toàn vì mỗi luồng ghi vào
      ô riêng, và hàm chính chỉ đọc sau khi đã đợi. Hai luồng cùng sửa một biến thì
      kết quả có thể sai, và đó là chủ đề của khoá sau.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: bỏ khối bắt, đọc dấu vết ngăn xếp'
  checks:
  - len(['main', 'chiaPhi', 'chia']) == 3
  steps:
  - show: '<p><b>Tệp Vet.java, đủ 12 dòng</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">class</span> Vet {</div><div>    <span class="kw">static</span>
      <span class="kw">int</span> chia(<span class="kw">int</span> a, <span class="kw">int</span>
      b) {</div><div>        <span class="kw">return</span> a / b;</div><div>    }</div><div>    <span
      class="kw">static</span> <span class="kw">int</span> chiaPhi(<span class="kw">int</span>
      phi) {</div><div>        <span class="kw">return</span> chia(phi, 0);              <span
      class="cm">// lỗi cố ý: 0 người</span></div><div>    }</div><div>    <span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>        System.out.println("1");</div><div>        System.out.println(chiaPhi(10));</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Kiểm phép tính thứ ba bằng đường khác: bỏ khối bắt, để máy ảo tự in dấu
      vết ngăn xếp. Đây là cả tệp, dòng một là dòng khai lớp, nên bạn tự đếm được
      số dòng.'
  - show: "<p><b>Không có khối bắt: máy ảo tự in dấu vết</b></p><div class=\"code\"\
      ><div>1</div><div><span class=\"cm\">Exception in thread \"main\" java.lang.ArithmeticException:\
      \ / by zero\n\tat Vet.chia(Vet.java:3)\n\tat Vet.chiaPhi(Vet.java:6)\n\tat Vet.main(Vet.java:10)</span></div></div>\n"
    clear: true
    say: Dòng đầu cho cùng loại ngoại lệ và cùng lời nhắn chia cho không, nên khớp
      với khối bắt ở ví dụ.
  - show: <table class='t'><tr><th>dấu vết</th><th>đọc là</th><th>lệnh ở đó</th></tr><tr><td><code>at
      Vet.chia(Vet.java:3)</code></td><td>lỗi xảy ra ở dòng thứ 3, trong <code>chia</code></td><td><code>return
      a / b;</code> với <code>b = 0</code></td></tr><tr><td><code>at Vet.chiaPhi(Vet.java:6)</code></td><td><code>chia</code>
      được gọi từ dòng thứ 6</td><td><code>return chia(phi, 0);</code></td></tr><tr><td><code>at
      Vet.main(Vet.java:10)</code></td><td><code>chiaPhi</code> được gọi từ hàm chính</td><td><code>chiaPhi(10)</code></td></tr></table>
    clear: true
    say: 'Đọc từ trên xuống. Dòng đầu là nơi lỗi xảy ra: dòng số ba, phép chia a cho
      b, với b bằng không. Dòng kế cho biết ai gọi nó: dòng số sáu, chính là chỗ truyền
      số không, tức gốc của lỗi. Dòng cuối là hàm chính, nơi mọi thứ bắt đầu. Ba dòng
      ứng với ba lần gọi lồng, nên khớp với mã.'
- id: quymo
  kind: concept
  title: Khi số lệnh tăng, một lỗi bị nuốt thành cả nghìn khách bị báo sai
  checks:
  - 1000 // 1000 == 1
  - 100000 // 1000 == 100
  - 1000000 // 1000 == 1000
  steps:
  - show: '<div class="code"><div>        <span class="kw">int</span>[] lo = {1000,
      100000, 1000000};              <span class="cm">// số lệnh mỗi ngày</span></div><div>        <span
      class="kw">for</span> (<span class="kw">int</span> k = 0; k &lt; lo.length;
      k++) {</div><div>            <span class="kw">int</span> nuot = 0;                                <span
      class="cm">// số lệnh lỗi bị khối bắt rỗng nuốt</span></div><div>            <span
      class="kw">for</span> (<span class="kw">int</span> i = 1; i &lt;= lo[k]; i++)
      {</div><div>                <span class="kw">long</span> tien = (i % 1000 ==
      0) ? 500000 : 1000;   <span class="cm">// cứ 1000 lệnh có 1 lệnh rút quá</span></div><div>                <span
      class="kw">try</span> {</div><div>                    rut(100000, tien);</div><div>                }
      <span class="kw">catch</span> (KhongDuTien e) {</div><div>                    nuot++;                              <span
      class="cm">// khối bắt không báo ai</span></div><div>                }</div><div>            }</div><div>            System.out.println(lo[k]
      + " lenh: " + nuot + " lenh bi nuot loi");</div><div>        }</div><div>    }</div><div>}</div></div>'
    clear: true
    say: Giả sử cứ một nghìn lệnh rút thì có một lệnh rút quá số dư, số minh hoạ,
      và khối bắt rỗng nuốt lỗi như ở phần lỗi thường gặp. Ta đếm số lệnh lỗi bị nuốt
      khi số lệnh mỗi ngày lớn dần.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>1000 lenh: 1 lenh bi nuot
      loi</div><div>100000 lenh: 100 lenh bi nuot loi</div><div>1000000 lenh: 1000
      lenh bi nuot loi</div></div>'
    clear: true
    say: Chạy thật, ba dòng in ra số lệnh lỗi bị nuốt ở ba quy mô.
  - show: <table class='t'><tr><th>lệnh mỗi ngày</th><th>lệnh lỗi bị nuốt</th><th>khách
      bị báo đã rút mà tiền không rút</th></tr><tr><td>1 000</td><td>1</td><td>1 khách</td></tr><tr><td>100
      000</td><td>100</td><td>100 khách</td></tr><tr><td>1 000 000</td><td>1 000</td><td>1
      000 khách mỗi ngày</td></tr></table>
    focus:
    - - '1.2'
      - '1.3'
    - '1.4'
    - 1
    clear: true
    say: Một nghìn lệnh chỉ có một lệnh bị nuốt, có khi còn ai đó tìm ra. Một triệu
      lệnh mỗi ngày thì có một nghìn khách được báo đã rút trong khi tiền không rút,
      và ngày nào cũng vậy. Tỉ lệ lỗi rất nhỏ nhân với quy mô cho ra con số tuyệt
      đối lớn.
  - show: '<div class="box key"><b>Điều người làm nghề rút ra.</b> Lỗi bị nuốt thì
      không ai thấy, nên không ai sửa. Mỗi ngoại lệ phải để lại <b>dấu vết</b>:

      báo người dùng, <b>ghi nhật ký</b> kèm mã lỗi, và <b>đếm</b> để theo dõi tỉ
      lệ theo ngày. Tỉ lệ tăng bất thường là tín hiệu sớm nhất của một sự cố.</div>

      '
    clear: true
    say: 'Lỗi bị nuốt thì không ai thấy, nên không ai sửa. Mỗi ngoại lệ phải để lại
      dấu vết: báo người dùng, ghi nhật ký kèm mã lỗi, và đếm để theo dõi tỉ lệ theo
      ngày. Tỉ lệ tăng bất thường là tín hiệu sớm nhất của một sự cố.'
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Bắt loại rộng trước, loại
      hẹp sau.</div><div class="code"><div><span class="kw">try</span> {</div><div>    System.out.println(90000
      / soNguoi);</div><div>} <span class="kw">catch</span> (Exception e) {</div><div>    System.out.println("Loi
      chung");</div><div>} <span class="kw">catch</span> (ArithmeticException e) {</div><div>    System.out.println("Chia
      cho 0");</div><div>}</div></div><p><b>Trình biên dịch báo</b></p><div class="code"><div><span
      class="cm">error: exception ArithmeticException has already been caught</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là đặt khối bắt loại rộng trước loại hẹp. Khối
      bắt ngoại lệ gốc đã bắt mọi thứ, nên khối bắt phép tính phía sau không bao giờ
      tới được, và trình biên dịch báo lỗi. Hãy xếp loại hẹp lên trước.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Khối bắt rỗng nuốt
      mất lỗi.</div><div class="code"><div>TaiKhoan tk = <span class="kw">new</span>
      TaiKhoan(100000);</div><div><span class="kw">try</span> {</div><div>    tk.rut(500000);</div><div>}
      <span class="kw">catch</span> (KhongDuTien e) {</div><div>    <span class="cm">//
      để sau tính</span></div><div>}</div><div>System.out.println("In bien lai: da
      rut 500000");</div><div>System.out.println("So du: " + tk.laySoDu());</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>In bien lai: da rut 500000</div><div>So
      du: 100000</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Lỗi thứ hai, của người đã đi làm, là khối bắt rỗng, định để sau tính. Lỗi
      bị nuốt mất: biên lai ghi đã rút năm trăm nghìn, nhưng số dư vẫn là một trăm
      nghìn. Khách được báo thành công dù tiền không hề rút.'
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Bắt <code>Exception</code>
      quá rộng.</div><div class="code"><div>TaiKhoan tk = <span class="kw">new</span>
      TaiKhoan(100000);</div><div><span class="kw">try</span> {</div><div>    <span
      class="kw">long</span> phi = phiMoiLan(3000, 0);    <span class="cm">// lỗi
      lập trình</span></div><div>    tk.rut(30000 + phi);</div><div>} <span class="kw">catch</span>
      (Exception e) {</div><div>    System.out.println("Khong du tien, vui long nap
      them");</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Khong du
      tien, vui long nap them</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba là bắt loại ngoại lệ gốc, quá rộng. Ở đây lỗi thật là chia cho
      không, một lỗi lập trình. Nhưng khối bắt rộng nuốt luôn nó và báo khách không
      đủ tiền, dù tài khoản còn một trăm nghìn.
  - show: '<div class="box key">Cách sửa lỗi 2 và 3: chỉ bắt <b>đúng loại</b> mình
      xử lý được (<code>KhongDuTien</code>), và trong khối bắt

      <b>làm việc thật</b>: báo người dùng, ghi nhật ký, không in biên lai. Lỗi lập
      trình cứ để lộ ra, kèm dấu vết, để sửa tận gốc.</div>

      '
    clear: true
    say: 'Cách sửa lỗi hai và ba: chỉ bắt đúng loại mình xử lý được, và trong khối
      bắt phải làm việc thật, như báo người dùng hay ghi nhật ký. Còn lỗi lập trình
      thì cứ để lộ ra kèm dấu vết, để sửa tận gốc.'
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 100 - 40 == 60
  - 90 - 60 == 30
  - 90 > 100 - 40
  steps:
  - show: <p><b>Đoán các dòng in ra</b></p><div class="code"><div><span class="kw">static</span>
      <span class="kw">long</span> rut(<span class="kw">long</span> soDu, <span class="kw">long</span>
      tien) {</div><div>    <span class="kw">if</span> (tien &gt; soDu) { <span class="kw">throw</span>
      <span class="kw">new</span> IllegalArgumentException("Thieu " + (tien - soDu));
      }</div><div>    <span class="kw">return</span> soDu - tien;</div><div>}</div></div><div
      class="code"><div><span class="kw">long</span> soDu = 100;</div><div><span class="kw">try</span>
      {</div><div>    soDu = rut(soDu, 40);</div><div>    soDu = rut(soDu, 90);</div><div>    System.out.println("A");</div><div>}
      <span class="kw">catch</span> (IllegalArgumentException e) {</div><div>    System.out.println("B
      " + e.getMessage());</div><div>} <span class="kw">finally</span> {</div><div>    System.out.println("C
      " + soDu);</div><div>}</div></div>
    focus:
    - 1
    - 1
    - 2
    - 3
    pause: 20
    clear: true
    say: Bây giờ tới phần bạn tự làm. Hàm rút ném ngoại lệ đối số không hợp lệ nếu
      số tiền lớn hơn số dư, kèm số tiền còn thiếu. Số dư ban đầu là một trăm, ta
      rút bốn mươi rồi rút chín mươi. Hãy dừng video và viết ra các dòng in ra.
  - show: '<table class=''t''><tr><th>lệnh</th><th>điều xảy ra</th><th>số dư</th></tr><tr><td><code>rut(100,
      40)</code></td><td>$40 \le 100$, trả $100 - 40 = 60$</td><td>60</td></tr><tr><td><code>rut(60,
      90)</code></td><td>$90 > 60$: ném, lời nhắn “Thieu” $90 - 60 = 30$; phép gán
      không xảy ra</td><td>vẫn 60</td></tr><tr><td>khối bắt</td><td>in <b>B Thieu
      30</b>; chữ A bị bỏ qua</td><td>60</td></tr><tr><td>khối cuối cùng</td><td>in
      <b>C 60</b></td><td>60</td></tr></table>'
    say: Đáp án từng bước. Lần rút thứ nhất, bốn mươi không vượt một trăm, nên số
      dư thành sáu mươi. Lần rút thứ hai, chín mươi lớn hơn sáu mươi nên hàm ném,
      lời nhắn thiếu ba mươi, và phép gán không xảy ra. Chữ A bị bỏ qua, khối bắt
      in B thiếu ba mươi. Khối cuối cùng in C sáu mươi.
    clear: true
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>B Thieu 30</div><div>C
      60</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật, đúng hai dòng. Nếu bạn đoán C mười, hãy nhớ phép gán chỉ xảy ra
      khi hàm trả về bình thường.
- id: practice
  kind: practice
  title: 'Tự làm: hạn mức rút trong ngày'
  steps:
  - show: '<p><b>Đề</b>: tệp <code>RutHanMuc.java</code> gồm ba lớp (số minh hoạ):</p>

      <ol><li><code>HetHanMuc extends Exception</code>, hàm tạo gọi <code>super(thongBao)</code></li>

      <li><code>The</code>: hạn mức 2 000 000; <code>rut(long tien) throws HetHanMuc</code>
      <b>ném</b> khi <code>daRut + tien &gt; hanMuc</code>, ngược lại cộng vào <code>daRut</code></li>

      <li>Hàm chính: <code>try</code> rút 800000, 900000, 500000 (in <code>Rut … xong</code>
      sau mỗi lần); <code>catch</code> in <code>Tu choi: …</code>; <code>finally</code>
      in <code>Da rut hom nay: …</code></li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 60
    say: Bây giờ tới phần bạn tự làm trên máy. Viết loại ngoại lệ vượt hạn mức, và
      lớp thẻ có hạn mức hai triệu đồng mỗi ngày. Hàm rút ném ngoại lệ khi tổng đã
      rút cộng số xin rút vượt hạn mức. Hàm chính rút ba lần, tám trăm nghìn, chín
      trăm nghìn và năm trăm nghìn, trong khối thử. Khối bắt in lời từ chối, khối
      cuối cùng in tổng đã rút. Hãy dừng video và tự viết, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>Rut 800000 xong</div><div>Rut
      900000 xong</div><div>Tu choi: Vuot han muc, da rut 1700000, xin rut 500000</div><div>Da
      rut hom nay: 1700000</div></div><p class="note">Chấm bằng Git Bash: <code>bash
      labs/cham.sh JVA L10 RutHanMuc.java</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> hàm <code>rut</code> kiểm <b>trước</b>
      khi cộng: <code>if (daRut + tien &gt; hanMuc) { throw new HetHanMuc(…); }</code>.
      Lần rút thứ ba ném, nên dòng <code>Rut 500000 xong</code> không in.

      Lời giải nằm ở <code>labs/JVA/L10/loi_giai.java</code> — chỉ mở sau khi bạn
      đã thử.</div>

      '
    say: Nếu kẹt, hàm rút kiểm trước khi cộng, và ném khi tổng sẽ vượt hạn mức. Lần
      rút thứ ba bị ném, nên dòng báo rút năm trăm nghìn xong không bao giờ được in.
      Lời giải nằm trong thư mục thực hành của bài, chỉ mở sau khi bạn đã tự thử.
  lab: labs/JVA/L10
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>phát hiện sai → ném ngoại lệ</span><span
      class='a'>→</span><span class='n'>đi ngược đường gọi</span><span class='a'>→</span><span
      class='n'>khối bắt gần nhất đúng loại</span><span class='a'>→</span><span class='n'>khối
      cuối cùng chạy khi rời khối thử</span></div>
    say: Tổng kết chuỗi logic. Phương thức phát hiện điều sai thì ném ngoại lệ. Ngoại
      lệ đi ngược đường gọi, tới khối bắt gần nhất đúng loại. Và khối cuối cùng chạy
      mỗi khi rời khối thử, có lỗi hay không.
  - show: '<div class=''box key''><b>Tư duy:</b> lỗi nghiệp vụ người gọi phải xử lý
      (không đủ tiền) dùng ngoại lệ <b>có kiểm tra</b> tự định nghĩa.

      Chỉ bắt loại mình xử lý được; không để khối bắt rỗng. Gặp dấu vết thì đọc <b>từ
      trên xuống</b>: dòng đầu là nơi lỗi xảy ra.</div>

      '
    say: Điều cần mang theo. Lỗi nghiệp vụ mà người gọi phải xử lý, như không đủ tiền,
      nên là ngoại lệ có kiểm tra tự định nghĩa. Chỉ bắt loại mình xử lý được, và
      đừng để khối bắt rỗng. Gặp dấu vết thì đọc từ trên xuống, dòng đầu là nơi lỗi
      xảy ra.
