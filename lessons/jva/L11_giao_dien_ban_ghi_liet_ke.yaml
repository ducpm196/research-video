scenes:
- id: hook
  kind: hook
  title: 'Mỗi loại phí một công thức: thêm loại mới có phải sửa khắp nơi?'
  steps:
  - show: '<p>Ngân hàng có phí theo bậc (biểu phí bài 3), phí theo phần trăm, rồi
      mai có thêm miễn phí cho khách VIP (đều là số minh hoạ). Viết tất cả vào một
      hàm với chuỗi

      <code>if … else if …</code> thì mỗi lần thêm loại mới lại phải sửa hàm cũ.</p>

      <div class="box key">Hôm nay: <b>giao diện</b> và <b>đa hình</b> (cùng một lời
      gọi, mỗi đối tượng làm theo cách của lớp nó: mỗi cách tính phí là một lớp, chạy
      qua <b>một</b> vòng lặp),

      <b>bản ghi</b> cho dữ liệu giao dịch, <b>kiểu liệt kê</b> cho trạng thái.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: 'Ngân hàng có phí theo bậc như biểu phí ở bài ba, phí theo phần trăm, rồi
      mai lại có miễn phí cho khách đặc biệt, tất cả đều là số minh hoạ. Viết tất
      cả vào một hàm với chuỗi lệnh rẽ nhánh thì mỗi lần thêm loại mới lại phải sửa
      hàm cũ. Hôm nay ta học giao diện và đa hình, để mỗi cách tính phí là một lớp
      riêng, chạy qua cùng một vòng lặp. Đa hình nghĩa là nhiều hình dạng: cùng một
      lời gọi, mỗi đối tượng làm theo cách riêng của lớp nó. Ta cũng học bản ghi cho
      dữ liệu giao dịch, và kiểu liệt kê cho trạng thái giao dịch.'
- id: prereq
  kind: prereq
  title: 'Ôn lại: lớp, danh sách và so bằng nội dung'
  steps:
  - show: <table class='t'><tr><th>đã học</th><th>điều dùng lại hôm nay</th></tr><tr><td>①
      Lớp và đối tượng</td><td>trường, hàm tạo, phương thức, <code>toString</code>;
      mỗi <code>new</code> là một đối tượng riêng</td></tr><tr><td>② Danh sách</td><td><code>ArrayList&lt;…&gt;</code>,
      vòng lặp duyệt từng phần tử</td></tr><tr><td>③ So sánh</td><td><code>==</code>
      so <b>địa chỉ</b> đối tượng; <code>equals</code> so <b>nội dung</b> (như với
      chuỗi)</td></tr></table>
    say: Ta ôn ba điều. Thứ nhất, lớp có trường, hàm tạo và phương thức, và mỗi lần
      tạo mới là một đối tượng riêng. Thứ hai, danh sách và vòng lặp duyệt từng phần
      tử. Thứ ba, với đối tượng, dấu bằng bằng so địa chỉ, còn phương thức so bằng
      so nội dung, như bạn đã thấy với chuỗi.
- id: sym
  kind: symbol
  title: 'Giải mã ký hiệu: giao diện, cài đặt, kế thừa, bản ghi, liệt kê'
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>interface
      CachTinhPhi { long phi(long tien); }</code></td><td><b>giao diện</b>: lời hứa
      “có phương thức này”, chưa có thân</td></tr><tr><td><code>class PhiTheoBac implements
      CachTinhPhi</code></td><td><b>cài</b> giao diện: phải viết đủ thân các phương
      thức đã hứa</td></tr><tr><td><code>@Override</code></td><td><b>ghi đè</b> =
      viết lại phương thức cùng tên, cùng tham số của lớp cha hay giao diện; trình
      biên dịch kiểm giúp</td></tr><tr><td><code>class TaiKhoanVip extends TaiKhoan</code></td><td><b>kế
      thừa</b>: lớp con nhận phương thức của lớp cha, có thể ghi đè</td></tr><tr><td><code>record
      GiaoDich(String stk, long tien) {}</code></td><td><b>bản ghi</b>: lớp dữ liệu
      không đổi; tự sinh <code>stk()</code>, <code>tien()</code>, <code>equals</code>,
      <code>toString</code></td></tr><tr><td><code>enum TrangThai { CHO, THANH_CONG,
      THAT_BAI }</code></td><td><b>kiểu liệt kê</b>: đúng ba giá trị cố định</td></tr></table>'
    say: 'Bảng ký hiệu của bài. Giao diện là một lời hứa: có phương thức tính phí,
      nhận số tiền, trả về phí, nhưng chưa có thân. Một lớp cài giao diện thì phải
      viết đủ thân cho mọi phương thức đã hứa. Ghi đè nghĩa là viết lại một phương
      thức cùng tên, cùng tham số đã có ở lớp cha hoặc giao diện, để thay cách làm.
      Chú thích ghi đè nhờ trình biên dịch kiểm rằng phương thức đó đúng là ghi đè,
      và hàm đổi ra chuỗi ở bài bảy cũng là một phương thức ghi đè. Kế thừa cho lớp
      con nhận các phương thức của lớp cha, và có thể ghi đè chúng. Bản ghi là lớp
      chỉ chứa dữ liệu không đổi, trình biên dịch tự sinh phần còn lại. Kiểu liệt
      kê có đúng một số giá trị cố định.'
