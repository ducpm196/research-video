- id: formula
  kind: formula
  title: 'Suy ra từng bước: hai cách tính phí cài cùng một giao diện'
  checks:
  - 100000 < 500000 and 500000 <= 2000000 < 10000000
  - 100000 * 5 // 1000 == 500
  - max(100000 * 5 // 1000, 1000) == 1000
  - max(2000000 * 5 // 1000, 1000) == 10000
  steps:
  - show: '<p><b>Bước 1. Viết lời hứa</b></p><div class="code"><div><span class="kw">interface</span>
      CachTinhPhi {</div><div>    <span class="kw">long</span> phi(<span class="kw">long</span>
      tien);                      <span class="cm">// lời hứa: có phương thức này</span></div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, viết giao diện. Nó chỉ nói có một phương thức tính phí, nhận số
      tiền và trả về số phí. Không có thân, vì mỗi lớp sẽ tự quyết định công thức.
  - show: '<p><b>Bước 2. Cách thứ nhất: phí theo bậc của bài 3</b></p><div class="code"><div><span
      class="kw">class</span> PhiTheoBac <span class="kw">implements</span> CachTinhPhi
      {    <span class="cm">// biểu phí ba bậc của bài 3</span></div><div>    @Override</div><div>    <span
      class="kw">public</span> <span class="kw">long</span> phi(<span class="kw">long</span>
      tien) {</div><div>        <span class="kw">if</span> (tien &lt; 500000) {</div><div>            <span
      class="kw">return</span> 0;</div><div>        } <span class="kw">else</span>
      <span class="kw">if</span> (tien &lt; 10000000) {</div><div>            <span
      class="kw">return</span> 2200;</div><div>        }</div><div>        <span class="kw">return</span>
      5500;</div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước hai, lớp phí theo bậc cài giao diện, nên phải viết thân cho phương thức
      tính phí, và thân đó chính là biểu phí ba bậc của bài ba, số minh hoạ. Phương
      thức phải công khai, vì phương thức đã hứa trong giao diện luôn công khai.
  - show: '<p><b>Bước 3. Cách thứ hai: phí phần trăm, có mức tối thiểu</b></p><div
      class="code"><div><span class="kw">class</span> PhiPhanTram <span class="kw">implements</span>
      CachTinhPhi {</div><div>    @Override</div><div>    <span class="kw">public</span>
      <span class="kw">long</span> phi(<span class="kw">long</span> tien) {</div><div>        <span
      class="kw">long</span> p = tien * 5 / 1000;             <span class="cm">//
      0,5% như bài 2 (số minh hoạ)</span></div><div>        <span class="kw">return</span>
      p &lt; 1000 ? 1000 : p;           <span class="cm">// tối thiểu 1000</span></div><div>    }</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước ba, lớp phí phần trăm lấy số tiền nhân năm chia một nghìn, tức không
      phẩy năm phần trăm như bài hai, số minh hoạ. Nếu kết quả nhỏ hơn một nghìn thì
      lấy một nghìn, nhờ toán tử ba ngôi, nên phí không bao giờ dưới mức tối thiểu.
  - show: '<p><b>Bước 4. Một vòng lặp cho mọi cách tính</b></p><div class="code"><div>ArrayList&lt;CachTinhPhi&gt;
      ds = <span class="kw">new</span> ArrayList&lt;&gt;();</div><div>ds.add(<span
      class="kw">new</span> PhiTheoBac());</div><div>ds.add(<span class="kw">new</span>
      PhiPhanTram());</div><div><span class="kw">for</span> (CachTinhPhi c : ds) {            <span
      class="cm">// một vòng lặp cho mọi cách tính</span></div><div>    System.out.println(c.phi(100000)
      + " " + c.phi(2000000));</div><div>}</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>0 2200</div><div>1000 10000</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: 'Bước bốn, danh sách có kiểu là giao diện, nên chứa được cả hai lớp. Vòng
      lặp gọi cùng một lệnh cho mọi phần tử. Dòng đầu là phí theo bậc: một trăm nghìn
      dưới năm trăm nghìn nên miễn phí, hai triệu ở bậc hai nên hai nghìn hai trăm.
      Dòng hai là phí phần trăm: một trăm nghìn cho năm trăm, dưới mức tối thiểu nên
      lấy một nghìn, còn hai triệu thì được mười nghìn.'
- id: example
  kind: example
  title: 'Ví dụ: bản ghi và kiểu liệt kê, từng phép tính'
  checks:
  - 500000 + 2200 == 502200
  steps:
  - show: '<p><b>Tệp BanGhi.java, phần đầu</b></p><div class="code"><div><span class="kw">record</span>
      GiaoDich(String stk, <span class="kw">long</span> tien) {}</div><div> </div><div><span
      class="kw">enum</span> TrangThai { CHO, THANH_CONG, THAT_BAI }</div><div> </div><div><span
      class="kw">public</span> <span class="kw">class</span> BanGhi {</div><div>    <span
      class="kw">static</span> String moTa(TrangThai t) {</div><div>        <span
      class="kw">return</span> <span class="kw">switch</span> (t) {</div><div>            <span
      class="kw">case</span> CHO -&gt; "dang cho";</div><div>            <span class="kw">case</span>
      THANH_CONG -&gt; "xong";</div><div>            <span class="kw">case</span>
      THAT_BAI -&gt; "loi";</div><div>        };</div></div><p><code>return switch</code>:
      lệnh chọn của bài 3 dùng như <b>một giá trị</b>, lấy giá trị sau mũi tên.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: 'Ví dụ này khai bản ghi giao dịch gồm số tài khoản và số tiền, và kiểu liệt
      kê ba trạng thái: chờ, thành công, thất bại. Hàm mô tả dùng lệnh chọn dạng mũi
      tên của bài ba như một giá trị: nhánh khớp cho ra chữ đứng sau mũi tên, và hàm
      trả về chữ đó. Không cần nhánh mặc định, vì đã đủ ba trạng thái.'
  - show: <div class="code"><div>GiaoDich a = <span class="kw">new</span> GiaoDich("A01",
      500000);</div><div>GiaoDich b = <span class="kw">new</span> GiaoDich("A01",
      500000);</div><div>System.out.println(a);                       <span class="cm">//
      (1)</span></div></div>$$① \; \text{in a} \to \hl{\text{GiaoDich[stk=A01, tien=500000]}}$$
    focus:
    - 1
    - 2
    clear: true
    say: 'Phép tính thứ nhất in bản ghi a. Bản ghi tự sinh cách in: tên kiểu, rồi
      từng thành phần trong ngoặc vuông.'
  - show: <div class="code"><div>System.out.println(a == b);                  <span
      class="cm">// (2)</span></div><div>System.out.println(a.equals(b));             <span
      class="cm">// (3)</span></div></div>$$② \; a == b \to \hl{\text{false}} \qquad
      ③ \; a.\text{equals}(b) \to \hlg{\text{true}}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ hai so địa chỉ, mà hai lần tạo mới là hai đối tượng, nên ra
      sai. Phép tính thứ ba so nội dung, hai thành phần đều trùng, nên ra đúng.
  - show: <div class="code"><div>System.out.println(a.tien() + 2200);         <span
      class="cm">// (4) cộng phí bậc 2 (minh hoạ)</span></div></div>$$④ \; 500\,000
      + 2\,200 = \hl{502\,200}$$
    clear: true
    say: Phép tính thứ tư lấy số tiền bằng phương thức truy cập tự sinh, cộng phí
      bậc hai là hai nghìn hai trăm, ra năm trăm linh hai nghìn hai trăm.
  - show: <div class="code"><div><span class="kw">case</span> THANH_CONG -&gt; "xong";</div></div><div
      class="code"><div>System.out.println(moTa(TrangThai.THANH_CONG)); <span class="cm">//
      (5)</span></div></div>$$⑤ \; \text{THANH\_CONG} \to \hl{\text{xong}}$$
    clear: true
    say: Phép tính thứ năm đưa trạng thái thành công vào hàm mô tả, và nhánh đó trả
      chữ xong.
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>GiaoDich[stk=A01, tien=500000]</div><div>false</div><div>true</div><div>502200</div><div>xong</div></div>
    clear: true
    say: Chạy thật, năm dòng in ra khớp đúng năm phép tính.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: so tay từng thành phần, và so với lớp thường'
  checks:
  - 100000 * 5 // 1000 < 1000
  - 2000000 * 5 // 1000 >= 1000
  - (0 if 100000 < 500000 else 2200) == 0
  steps:
  - show: <div class="code"><div>GiaoDich a = <span class="kw">new</span> GiaoDich("A01",
      500000);</div><div>GiaoDich b = <span class="kw">new</span> GiaoDich("A01",
      500000);</div><div>System.out.println(a.stk().equals(b.stk()) &amp;&amp; a.tien()
      == b.tien());</div><div>GiaoDichThuong x = <span class="kw">new</span> GiaoDichThuong("A01",
      500000);</div><div>GiaoDichThuong y = <span class="kw">new</span> GiaoDichThuong("A01",
      500000);</div><div>System.out.println(x.equals(y));</div></div><p><b>Kết quả
      chạy</b></p><div class="code"><div>true</div><div>false</div></div>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: 'Kiểm phép tính thứ ba bằng đường khác: so tay từng thành phần. Số tiền so
      bằng dấu bằng bằng được, vì là số trần. Kết quả đúng, khớp với phép so của bản
      ghi. Còn một lớp thường cùng hai trường thì ra sai, vì lớp thường không tự sinh
      phép so nội dung.'
  - show: '<table class=''t''><tr><th>số tiền</th><th>phí theo bậc (bài 3)</th><th>phí
      phần trăm: <code>tien * 5 / 1000</code>, tối thiểu 1000</th></tr><tr><td>100
      000</td><td>dưới 500 000 → 0</td><td>$500 < 1000 \Rightarrow 1000$</td></tr><tr><td>2
      000 000</td><td>bậc 2 → 2 200</td><td>$10000 \ge 1000 \Rightarrow 10000$</td></tr></table>'
    clear: true
    say: Kiểm phí bằng tay, theo đúng công thức. Theo biểu phí bậc, một trăm nghìn
      được miễn phí, còn hai triệu ở bậc hai nên là hai nghìn hai trăm. Phí phần trăm
      của một trăm nghìn là năm trăm, nhỏ hơn mức tối thiểu nên thành một nghìn. Của
      hai triệu là mười nghìn, không dưới mức tối thiểu. Cả bốn số khớp với hai dòng
      in ở bước bốn.
    introduces:
    - implies
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Cài phương thức của giao
      diện mà quên <code>public</code>.</div><div class="code"><div><span class="kw">class</span>
      MienPhi <span class="kw">implements</span> CachTinhPhi {</div><div>    <span
      class="kw">long</span> phi(<span class="kw">long</span> tien) {                 <span
      class="cm">// quên chữ public</span></div><div>        <span class="kw">return</span>
      0;</div><div>    }</div><div>}</div></div><p><b>Trình biên dịch báo</b></p><div
      class="code"><div><span class="cm">error: attempting to assign weaker access
      privileges; was public</span></div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: Lỗi thứ nhất, của người mới, là cài phương thức của giao diện mà quên chữ
      công khai. Phương thức đã hứa trong giao diện luôn công khai, nên bản cài không
      được hẹp hơn, và trình biên dịch báo đang gán quyền truy cập yếu hơn.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Không ghi <code>@Override</code>,
      gõ sai tên mà không ai báo.</div><div class="code"><div><span class="kw">class</span>
      TaiKhoan {</div><div>    <span class="kw">long</span> phiThuongNien() {</div><div>        <span
      class="kw">return</span> 50000;                     <span class="cm">// số minh
      hoạ</span></div><div>    }</div><div>}</div><div> </div><div><span class="kw">class</span>
      TaiKhoanVip <span class="kw">extends</span> TaiKhoan {</div><div>    <span class="kw">long</span>
      phiThuongnien() {                <span class="cm">// gõ sai: chữ n viết thường</span></div><div>        <span
      class="kw">return</span> 0;                         <span class="cm">// khách
      VIP được miễn</span></div><div>    }</div><div>}</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>50000</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai hay gặp ở người đã đi làm. Lớp tài khoản đặc biệt muốn ghi đè
      phí thường niên về không, nhưng gõ sai một chữ n viết thường. Không có lỗi biên
      dịch, vì đó là một phương thức mới hoàn toàn hợp lệ. Khách vẫn bị thu năm mươi
      nghìn.
  - show: '<p><b>Thêm @Override: trình biên dịch bắt ngay</b></p><div class="code"><div><span
      class="kw">class</span> TaiKhoanVip <span class="kw">extends</span> TaiKhoan
      {</div><div>    @Override</div><div>    <span class="kw">long</span> phiThuongnien()
      {                <span class="cm">// vẫn gõ sai, nhưng có chú thích</span></div><div>        <span
      class="kw">return</span> 0;</div><div>    }</div></div><p><b>Trình biên dịch
      báo</b></p><div class="code"><div><span class="cm">error: method does not override
      or implement a method from a supertype</span></div></div>'
    focus:
    - 1
    - 3
    clear: true
    say: 'Thêm chú thích ghi đè, vẫn tên gõ sai đó, thì trình biên dịch báo ngay:
      phương thức này không ghi đè gì cả. Vì vậy, mọi phương thức ghi đè nên có chú
      thích này.'
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Kế thừa nhiều tầng
      thay vì dùng giao diện.</div><div><svg width="1500" height="300" viewBox="0
      0 1500 300" font-family="sans-serif"><defs><marker id="ah" markerUnits="userSpaceOnUse"
      markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,0
      L14,7 L0,14 z" fill="#475569"/></marker></defs><rect x="20" y="40" width="300"
      height="70" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><text
      x="170.0" y="83" font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">TaiKhoan</text><line
      x1="325" y1="75" x2="380" y2="75" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="385" y="40" width="330" height="70" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3"/><text x="550.0" y="83" font-size="22" text-anchor="middle"
      fill="#1f2937">TaiKhoanCaNhan</text><line x1="720" y1="75" x2="775" y2="75"
      stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect x="780" y="40"
      width="330" height="70" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><text
      x="945.0" y="83" font-size="22" text-anchor="middle" fill="#1f2937">TaiKhoanCaNhanVip</text><line
      x1="1115" y1="75" x2="1170" y2="75" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="1175" y="40" width="305" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"
      stroke-width="3"/><text x="1327.5" y="68" font-size="20" text-anchor="middle"
      fill="#1f2937">…VipMienPhi</text><text x="1327.5" y="96" font-size="20" text-anchor="middle"
      fill="#1f2937">sửa cha là vỡ con</text><rect x="20" y="190" width="420" height="90"
      rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="230.0" y="228"
      font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">TaiKhoan</text><text
      x="230.0" y="258" font-size="22" text-anchor="middle" fill="#1f2937">có trường
      CachTinhPhi</text><line x1="445" y1="235" x2="560" y2="235" stroke="#16a34a"
      stroke-width="3.5" marker-end="url(#ah)"/><text x="502" y="225" font-size="22"
      text-anchor="middle" fill="#16a34a">ghép</text><rect x="570" y="190" width="300"
      height="90" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text
      x="720.0" y="243" font-size="22" text-anchor="middle" fill="#1f2937">PhiTheoBac</text><rect
      x="890" y="190" width="300" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="1040.0" y="243" font-size="22" text-anchor="middle"
      fill="#1f2937">PhiPhanTram</text><rect x="1210" y="190" width="270" height="90"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1345.0" y="243"
      font-size="22" text-anchor="middle" fill="#1f2937">MienPhi</text></svg></div>
    focus:
    - 2
    - 2
    - 2
    clear: true
    say: 'Lỗi thứ ba là kế thừa nhiều tầng: tài khoản, tài khoản cá nhân, cá nhân
      đặc biệt, rồi đặc biệt miễn phí. Mỗi tầng phụ thuộc tầng trên, nên sửa lớp cha
      là vỡ lớp con, và mỗi kiểu phí mới lại thêm một tầng. Cách tốt hơn ở hàng dưới:
      tài khoản giữ một trường kiểu giao diện tính phí, rồi ghép cách tính nào cũng
      được.'
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 0 + 300000 * 5 // 1000 == 1500
  steps:
  - show: <p><b>Các kiểu trong bài</b></p><div class="code"><div><span class="kw">interface</span>
      Phi {</div><div>    <span class="kw">long</span> tinh(<span class="kw">long</span>
      tien);</div><div>}</div><div><span class="kw">class</span> MienPhi <span class="kw">implements</span>
      Phi {</div><div>    @Override <span class="kw">public</span> <span class="kw">long</span>
      tinh(<span class="kw">long</span> tien) { <span class="kw">return</span> 0;
      }</div><div>}</div><div><span class="kw">class</span> NuaPhanTram <span class="kw">implements</span>
      Phi {</div><div>    @Override <span class="kw">public</span> <span class="kw">long</span>
      tinh(<span class="kw">long</span> tien) { <span class="kw">return</span> tien
      * 5 / 1000; }</div><div>}</div><div><span class="kw">record</span> GiaoDich(String
      stk, <span class="kw">long</span> tien) {}</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: 'Bây giờ tới phần bạn tự làm. Đây là các kiểu: một giao diện tính phí, lớp
      miễn phí trả không, lớp nửa phần trăm trả số tiền nhân năm chia một nghìn, và
      bản ghi giao dịch.'
  - show: '<p><b>Đoán ba dòng in ra</b></p><div class="code"><div>Phi[] ds = { <span
      class="kw">new</span> MienPhi(), <span class="kw">new</span> NuaPhanTram() };</div><div><span
      class="kw">long</span> tong = 0;</div><div><span class="kw">for</span> (Phi
      p : ds) {</div><div>    tong += p.tinh(300000);</div><div>}</div><div>System.out.println(tong);</div><div>System.out.println(<span
      class="kw">new</span> GiaoDich("B02", 7).equals(<span class="kw">new</span>
      GiaoDich("B02", 7)));</div><div>System.out.println(<span class="kw">new</span>
      GiaoDich("B02", 7) == <span class="kw">new</span> GiaoDich("B02", 7));</div></div>'
    focus:
    - 1
    - 1
    - 2
    pause: 20
    clear: true
    say: Mảng có hai cách tính phí, vòng lặp cộng phí của ba trăm nghìn theo từng
      cách. Rồi ta so hai bản ghi giao dịch bằng nội dung, và bằng địa chỉ. Hãy dừng
      video và viết ra ba dòng in ra.
  - show: '<table class=''t''><tr><th>dòng in</th><th>lý do</th><th>in ra</th></tr><tr><td>①
      <code>tong</code></td><td>$0 + 300\,000 \times 5 / 1000 = 0 + 1\,500$</td><td><b>1500</b></td></tr><tr><td>②
      <code>equals</code></td><td>bản ghi so từng thành phần: B02 = B02, 7 = 7</td><td><b>true</b></td></tr><tr><td>③
      <code>==</code></td><td>hai lần <code>new</code> là hai đối tượng</td><td><b>false</b></td></tr></table>'
    say: Đáp án như sau. Dòng một, miễn phí cho không, nửa phần trăm của ba trăm nghìn
      là một nghìn năm trăm, tổng là một nghìn năm trăm. Dòng hai, bản ghi so từng
      thành phần, đều trùng nên ra đúng. Dòng ba, hai lần tạo mới là hai đối tượng
      khác địa chỉ, nên ra sai.
    clear: true
  - show: <p><b>Kết quả chạy</b></p><div class="code"><div>1500</div><div>true</div><div>false</div></div>
    clear: true
    say: Chạy thật, ba dòng in ra là một nghìn năm trăm, đúng, và sai, khớp đáp án.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>giao diện: lời hứa</span><span class=''a''>→</span><span
      class=''n''>nhiều lớp cài cùng lời hứa</span><span class=''a''>→</span><span
      class=''n''>một vòng lặp gọi, máy chọn bản cài</span><span class=''a''>→</span><span
      class=''n''>bản ghi: so theo nội dung</span><span class=''a''>→</span><span
      class=''n''>kiểu liệt kê: tập giá trị cố định</span></div>'
    say: Tổng kết chuỗi logic. Giao diện là lời hứa, nhiều lớp cài cùng lời hứa đó.
      Một vòng lặp gọi chung một lệnh, máy ảo chọn bản cài theo đối tượng thật.
  - show: '<div class=''box key''><b>Tư duy:</b> nhiều cách làm một việc → <b>giao
      diện</b>, đừng xây tháp kế thừa. Mọi phương thức ghi đè

      đều gắn <code>@Override</code>. Dữ liệu chỉ để chở (giao dịch, lệnh) → <b>bản
      ghi</b>; trạng thái hữu hạn → <b>kiểu liệt kê</b>, không dùng chuỗi tự gõ.</div>

      '
    say: Điều cần mang theo. Nhiều cách làm một việc thì dùng giao diện, đừng xây
      tháp kế thừa. Mọi phương thức ghi đè đều gắn chú thích ghi đè. Dữ liệu chỉ để
      chở như giao dịch thì dùng bản ghi, còn trạng thái hữu hạn thì dùng kiểu liệt
      kê thay vì chuỗi tự gõ.
