    say: Hình này là đa hình. Ở trên là giao diện, lời hứa có phương thức tính phí.
      Hai lớp bên dưới cùng cài lời hứa đó, mỗi lớp một công thức. Vòng lặp chỉ biết
      mỗi phần tử là một cách tính phí, và gọi cùng một lệnh. Máy ảo nhìn đối tượng
