source: 'curriculum/jva.yaml L11; audit/jva/verify_jva.py L11 (javac/java chạy thật);
  The Java Language Specification, Java SE 21 (§8.1.4 một lớp cha trực tiếp, §8.1.5
  cài nhiều giao diện, §8.4.8 kế thừa và ghi đè, §9.4 phương thức giao diện ngầm public,
  §9.6.4.4 @Override, §8.9 kiểu liệt kê, §8.10 bản ghi và equals/toString sinh tự
  động, §15.28.1 switch biểu thức phải đủ trường hợp); Java SE 21 API: java.lang.Record
