id: L07
course: JVA
series: JVA · Lập trình Java từ con số 0
title: 'Bài 7 — Lớp và đối tượng: tài khoản tự giữ luật của mình'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/jva.yaml L07; audit/jva/verify_jva.py L07 (javac/java chạy thật);
  The Java Language Specification, Java SE 21 (JLS §8.1 khai báo lớp, §8.3 trường
  và §8.3.1.1 trường static, §8.8 hàm tạo, §15.8.3 this, §6.6 kiểm soát truy cập private,
  §6.4.1 che khuất tên, §4.12.5 giá trị mặc định null, §15.9 new; Object.toString,
  Java SE 21 API); dev.java/learn
assumes: []
objectives:
- Khai báo lớp có trường riêng tư, hàm tạo, các hàm của đối tượng (nạp, rút) và hàm
  đổi ra chuỗi
- Tạo nhiều đối tượng độc lập bằng từ khoá tạo mới và gọi hàm trên từng đối tượng
- Giữ bất biến số dư không âm bằng cách kiểm trong hàm nạp, hàm rút
- Nhận ra lỗi quên this, trường static dùng chung, trường public phá bất biến
asr_reviewed:
- sentence: Cách sửa là để trường riêng tư.
  reason: 'ASR chép “Các sửa là đẩy trường riêng tư.” (0.714): lệch âm/thanh thuần
    Việt cách/các, để/đẩy; đủ 7 từ — NOT_VERIFIED bằng tai người'
- sentence: Đáp án như sau.
  reason: 'ASR chép “Đáp ản như sau” (0.75): lệch thanh thuần Việt án/ản; câu chuyển
    ý ngắn, đủ từ — NOT_VERIFIED bằng tai người'
scenes:
- id: hook
  kind: hook
  title: Ai giữ cho số dư không bao giờ âm?
  steps:
  - show: '<p>Với mảng, số dư nằm trong một mảng, tên chủ tài khoản nằm trong mảng
      khác, và <b>dòng mã nào cũng gán được</b> <code>soDu[2] = -500000</code>.</p>

      <div class="box warn">Một lệnh gán sai ở đâu đó trong một triệu dòng mã là đủ
      tạo ra số dư âm.</div>

      '
    focus:
    - 1
    - 2
    say: Với mảng, số dư và tên chủ tài khoản nằm ở hai mảng khác nhau, và dòng mã
      nào cũng gán được một số âm vào ô số dư. Chỉ cần một lệnh gán sai trong một
      triệu dòng mã là có số dư âm.
  - show: '<p>Hôm nay ta học <b>lớp</b> và <b>đối tượng</b>: gói dữ liệu cùng <b>luật</b>
      của nó vào một chỗ, và khoá dữ liệu lại.</p>

      <div class="box key">Luật “số dư không bao giờ âm” được viết đúng một lần, bên
      trong lớp tài khoản.</div>

      <span class=''note''>Một điều phải luôn đúng với dữ liệu, như “số dư ≥ 0”, người
      lập trình gọi là <b>bất biến</b>.</span>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Hôm nay ta học lớp và đối tượng. Ta gói dữ liệu cùng luật của nó vào một
      chỗ, rồi khoá dữ liệu lại. Luật số dư không bao giờ âm khi đó được viết đúng
      một lần, bên trong lớp tài khoản. Một điều phải luôn đúng với dữ liệu như vậy,
      người lập trình gọi là bất biến.
- id: prereq
  kind: prereq
  title: Ôn lại ba điều sẽ dùng hôm nay
  steps:
  - show: '<table class=''t''><tr><th>đã học</th><th>viết</th><th>dùng lại hôm nay</th></tr><tr><td>①
      hàm có tham số và giá trị trả về</td><td><code>static long tinhPhi(long soTien)</code></td><td>hàm
      nạp, hàm rút</td></tr><tr><td>② từ khoá tạo mới, biến giữ tham chiếu</td><td><code>long[]
      a = new long[5];</code></td><td>tạo đối tượng tài khoản</td></tr><tr><td>③ chuỗi
      chữ và phép nối</td><td><code>"So du: " + soDu</code></td><td>mô tả tài khoản
      thành một dòng chữ</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Trước hết ta ôn lại ba điều. Thứ nhất, hàm có tham số, kiểu trả về và lệnh
      trả về. Thứ hai, từ khoá tạo mới xin bộ nhớ cho một mảng, và biến chỉ giữ tham
      chiếu tới nó. Thứ ba, chuỗi chữ đặt trong nháy kép, và dấu cộng nối chuỗi với
      số.
- id: sym
  kind: symbol
  title: Giải mã ký hiệu của lớp và đối tượng
  steps:
  - show: '<p><b>Lớp tài khoản: trường và hàm tạo</b></p><div class="code"><div><span
      class="kw">class</span> TaiKhoan {</div><div>    <span class="kw">private</span>
      String chu;                  <span class="cm">// tên chủ tài khoản</span></div><div>    <span
      class="kw">private</span> <span class="kw">long</span> soDu;                   <span
      class="cm">// bất biến: soDu luôn &gt;= 0</span></div><div> </div><div>    TaiKhoan(String
      chu) {               <span class="cm">// hàm tạo: mở tài khoản, số dư 0</span></div><div>        <span
      class="kw">this</span>.chu = chu;</div><div>        <span class="kw">this</span>.soDu
      = 0;</div><div>    }</div></div><div class="code"><div>TaiKhoan an = <span class="kw">new</span>
      TaiKhoan("An");</div><div>TaiKhoan binh = <span class="kw">new</span> TaiKhoan("Binh");</div><div>an.nap(1000000);                     <span
      class="cm">// (1)</span></div></div><span class=''note''>Một tệp chứa được nhiều
      lớp, nhưng chỉ <b>một</b> lớp <code>public</code>, trùng tên tệp: ở đây là lớp
      <code>Ngan</code> có hàm chính, tệp <code>Ngan.java</code>.</span>'
    focus:
    - 2
    - 3
    - 4
    clear: true
    say: Đây là phần đầu của lớp tài khoản, gồm hai trường dữ liệu và một hàm tạo.
      Bên dưới, hàm chính tạo hai đối tượng tài khoản và nạp tiền vào một tài khoản.
      Hai lớp nằm chung một tệp được, miễn là chỉ một lớp công khai, và tên tệp trùng
      tên lớp công khai đó.
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>class
      TaiKhoan { … }</code></td><td><b>lớp</b>: bản thiết kế gồm dữ liệu và hành vi</td></tr><tr><td><code>private
      long soDu;</code></td><td><b>trường</b>: mỗi đối tượng có một bản riêng; <code>private</code>
      = chỉ mã trong lớp được đụng vào</td></tr><tr><td><code>TaiKhoan(String chu)</code></td><td><b>hàm
      tạo</b>: trùng tên lớp, không có kiểu trả về, chạy khi <code>new</code></td></tr><tr><td><code>this.chu
      = chu;</code></td><td><code>this</code> là chính đối tượng này: trường <code>this.chu</code>
      nhận tham số <code>chu</code></td></tr><tr><td><code>new TaiKhoan("An")</code></td><td>tạo
      một <b>đối tượng</b> mới, trả về tham chiếu tới nó</td></tr><tr><td><code>an.nap(1000000)</code></td><td>gọi
      hàm của <b>đúng</b> đối tượng <code>an</code>; không có <code>static</code></td></tr><tr><td><code>public
      String toString()</code></td><td>trả về dòng chữ mô tả; lệnh in tự gọi khi in
      một đối tượng</td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    clear: true
    say: Lớp là bản thiết kế, gồm dữ liệu và hành vi đi kèm. Trường là dữ liệu mỗi
      đối tượng có một bản riêng, còn từ khoá riêng tư nghĩa là chỉ mã trong lớp được
      đụng vào. Hàm tạo trùng tên lớp, không có kiểu trả về, và chạy mỗi khi tạo đối
      tượng. Từ khoá chỉ chính đối tượng này phân biệt trường với tham số trùng tên.
      Từ khoá tạo mới dựng một đối tượng, rồi trả về tham chiếu tới nó. Gọi hàm qua
      tên đối tượng và dấu chấm thì hàm làm việc trên đúng đối tượng đó, nên không
      có từ khoá tĩnh. Hàm đổi ra chuỗi trả về dòng mô tả, và lệnh in tự gọi nó.
