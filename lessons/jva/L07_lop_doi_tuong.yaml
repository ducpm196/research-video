      khi đổi số dư: nạp phải là số dương, rút không được quá số dư. Lệnh gán thẳng
      từ bên ngoài bị trình biên dịch chặn, nên không có đường vào thứ ba.'
- id: formula
  kind: formula
  title: 'Suy ra từng bước: dựng lớp tài khoản giữ luật số dư không âm'
  checks:
  - all(s + x >= 0 for s in [0, 300000] for x in [1, 500000])
  - all(s - x >= 0 for s in [0, 300000, 600000] for x in range(1, s + 1, 100000))
  steps:
  - show: '<p><b>Bước 1. Trường riêng tư.</b> Chỉ mã trong lớp được đổi <code>soDu</code>.</p><div
      class="code"><div><span class="kw">private</span> String chu;                  <span
      class="cm">// tên chủ tài khoản</span></div><div><span class="kw">private</span>
      <span class="kw">long</span> soDu;                   <span class="cm">// bất
      biến: soDu luôn &gt;= 0</span></div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước một, khai hai trường riêng tư. Vì chỉ mã bên trong lớp đổi được số dư,
      nên muốn giữ luật, ta chỉ cần kiểm tra mã trong lớp này.
  - show: '<p><b>Bước 2. Hàm tạo đặt trạng thái ban đầu hợp lệ.</b></p><div class="code"><div>TaiKhoan(String
      chu) {               <span class="cm">// hàm tạo: mở tài khoản, số dư 0</span></div><div>    <span
      class="kw">this</span>.chu = chu;</div><div>    <span class="kw">this</span>.soDu
      = 0;</div><div>}</div></div><span class=''note''>Mới mở: soDu = 0, nên luật
      “không âm” đúng ngay từ đầu.</span>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, viết hàm tạo. Tài khoản mới mở có số dư bằng không, nên luật không
      âm đúng ngay từ lúc tạo. Từ khoá chỉ chính đối tượng này cho biết vế trái là
      trường, còn vế phải là tham số.
  - show: <p><b>Bước 3. Hàm nạp chỉ nhận số dương.</b></p><div class="code"><div><span
      class="kw">void</span> nap(<span class="kw">long</span> soTien) {</div><div>    <span
      class="kw">if</span> (soTien &gt; 0) {</div><div>        soDu += soTien;</div><div>    }
      <span class="kw">else</span> {</div><div>        System.out.println("Tu choi
      nap " + soTien);</div><div>    }</div><div>}</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước ba, hàm nạp chỉ cộng khi số tiền lớn hơn không. Cộng một số dương vào
      số không âm thì vẫn không âm, nên luật vẫn đúng. Số không dương thì bị từ chối
      kèm thông báo.
  - show: <p><b>Bước 4. Hàm rút từ chối khi rút quá số dư.</b></p><div class="code"><div><span
      class="kw">boolean</span> rut(<span class="kw">long</span> soTien) {</div><div>    <span
      class="kw">if</span> (soTien &lt;= 0 || soTien &gt; soDu) {</div><div>        System.out.println("Tu
      choi rut " + soTien + ", so du " + soDu);</div><div>        <span class="kw">return</span>
      <span class="kw">false</span>;</div><div>    }</div><div>    soDu -= soTien;</div><div>    <span
      class="kw">return</span> <span class="kw">true</span>;</div><div>}</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Bước bốn, hàm rút từ chối khi số tiền không dương hoặc lớn hơn số dư, và
      trả về sai. Nếu qua được phép kiểm, số tiền rút không lớn hơn số dư, nên số
      dư sau khi trừ vẫn lớn hơn hoặc bằng không.
  - show: '<p><b>Bước 5. Hàm đọc số dư và hàm mô tả.</b></p><div class="code"><div><span
      class="kw">long</span> laySoDu() {</div><div>    <span class="kw">return</span>
      soDu;</div><div>}</div><div> </div><div><span class="kw">public</span> String
      toString() {</div><div>    <span class="kw">return</span> chu + ": " + soDu
      + " dong";</div><div>}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước năm, thêm hàm đọc số dư để bên ngoài xem được mà không sửa được, và
      hàm đổi ra chuỗi để in tài khoản. Hàm đổi ra chuỗi phải có từ khoá công khai,
      vì mọi đối tượng Java đã có sẵn một hàm cùng tên ở dạng công khai, và bản ta
      viết lại không được hẹp quyền hơn.
- id: example
  kind: example
  title: 'Ví dụ: hai tài khoản độc lập, từng phép tính'
  checks:
  - 0 + 1000000 == 1000000
  - 0 + 300000 == 300000
  - 400000 <= 1000000 and 1000000 - 400000 == 600000
  - 500000 > 300000
  steps:
  - show: '<p><b>Tệp Ngan.java: hàm chính</b></p><div class="code"><div>TaiKhoan an
      = <span class="kw">new</span> TaiKhoan("An");</div><div>TaiKhoan binh = <span
      class="kw">new</span> TaiKhoan("Binh");</div><div>an.nap(1000000);                     <span
      class="cm">// (1)</span></div><div>binh.nap(300000);                    <span
      class="cm">// (2)</span></div><div>an.rut(400000);                      <span
      class="cm">// (3)</span></div><div><span class="kw">boolean</span> ok = binh.rut(500000);       <span
      class="cm">// (4) quá số dư</span></div><div>System.out.println(an);              <span
      class="cm">// (5)</span></div><div>System.out.println(binh + ", rut duoc: "
      + ok);</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Hàm chính tạo hai tài khoản cho An và Bình, rồi làm bốn thao tác và in kết
      quả. Ta lần từng thao tác, với số dư ban đầu đều bằng không.
  - show: '<div class="code"><div>an.nap(1000000);                     <span class="cm">//
      (1)</span></div><div>binh.nap(300000);                    <span class="cm">//
      (2)</span></div></div>$$① \; \text{an: } 0 + 1000000 = \hl{1000000} \qquad ②
      \; \text{binh: } 0 + 300000 = \hl{300000}$$'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép tính thứ nhất, nạp một triệu, số dư của An thành một triệu. Phép tính
      thứ hai, nạp ba trăm nghìn cho Bình. Vì hai đối tượng có trường riêng, nên số
      dư của An không bị ảnh hưởng.
  - show: '<div class="code"><div>an.rut(400000);                      <span class="cm">//
      (3)</span></div></div>$$③ \; 400000 \le 1000000 \to \text{an: } 1000000 - 400000
      = \hl{600000}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ ba, An rút bốn trăm nghìn. Vì bốn trăm nghìn không lớn hơn
      một triệu, nên lệnh rút được chấp nhận, số dư của An còn sáu trăm nghìn.
  - show: <div class="code"><div><span class="kw">boolean</span> ok = binh.rut(500000);       <span
      class="cm">// (4) quá số dư</span></div></div>$$④ \; 500000 > 300000 \to \text{từ
      chối, binh giữ } \hl{300000}, \; \text{ok} = \text{false}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép tính thứ tư, Bình rút năm trăm nghìn, nhiều hơn số dư ba trăm nghìn.
      Hàm rút in thông báo từ chối, không trừ đồng nào, và trả về sai.
  - show: '<div class="code"><div>System.out.println(an);              <span class="cm">//
      (5)</span></div><div>System.out.println(binh + ", rut duoc: " + ok);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>Tu choi rut 500000, so du 300000</div><div>An:
      600000 dong</div><div>Binh: 300000 dong, rut duoc: false</div></div>'
    focus:
    - 1
    - - '3.1'
      - '3.2'
      - '3.3'
    clear: true
    say: Phép tính thứ năm, in hai tài khoản, lệnh in tự gọi hàm đổi ra chuỗi. Chạy
      thật, dòng đầu là thông báo từ chối, rồi An sáu trăm nghìn, Bình ba trăm nghìn
      kèm chữ sai.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: tiền vào trừ tiền ra bằng tổng số dư'
  checks:
  - (1000000 + 300000) - 400000 == 600000 + 300000 == 900000
  steps:
  - show: '<p>Đường khác: không nhìn từng tài khoản, chỉ ghi sổ <b>tiền vào</b> và
      <b>tiền ra</b> thành công.</p>$$(1000000 + 300000) - 400000 = 900000 = 600000
      + 300000$$'
    focus:
    - 1
    - 2
    say: 'Ta kiểm bằng đường khác: không nhìn từng tài khoản, chỉ ghi sổ tiền vào
      và tiền ra thành công. Tiền vào là một triệu ba trăm nghìn, tiền ra chỉ có bốn
      trăm nghìn vì lệnh rút của Bình bị từ chối, nên tổng phải là chín trăm nghìn.'
  - show: '<p><b>Tệp KiemTk.java: ghi sổ ngay cạnh mỗi thao tác</b></p><div class="code"><div><span
      class="kw">long</span> vao = 0;                        <span class="cm">// tổng
      tiền nạp thành công</span></div><div><span class="kw">long</span> ra = 0;                         <span
      class="cm">// tổng tiền rút thành công</span></div><div>an.nap(1000000);    vao
      += 1000000;</div><div>binh.nap(300000);   vao += 300000;</div><div><span class="kw">if</span>
      (an.rut(400000)) { ra += 400000; }</div><div><span class="kw">if</span> (binh.rut(500000))
      { ra += 500000; }</div><div><span class="kw">long</span> tong = an.laySoDu()
      + binh.laySoDu();</div><div>System.out.println(tong + " = " + (vao - ra) + "?
      " + (tong == vao - ra));</div><div>System.out.println("Khong am: " + (an.laySoDu()
      &gt;= 0 &amp;&amp; binh.laySoDu() &gt;= 0));</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Chương trình kiểm ghi sổ ngay cạnh mỗi thao tác, và chỉ cộng tiền ra khi
      hàm rút trả về đúng, vì lệnh rút bị từ chối không lấy đi đồng nào. Cuối cùng
      nó so tổng số dư với tiền vào trừ tiền ra, và kiểm cả hai số dư không âm.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Tu choi rut 500000, so
      du 300000</div><div>900000 = 900000? true</div><div>Khong am: true</div></div>'
    focus:
    - '2.2'
    - '2.3'
    clear: true
    say: Chạy thật, hai vế cùng là chín trăm nghìn và phép so ra đúng, nên không đồng
      nào bị tạo ra hay mất đi. Dòng cuối xác nhận luật không âm vẫn giữ sau mọi thao
      tác.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Quên <code>this.</code>
      khi tham số trùng tên trường.</div><div class="code"><div>TaiKhoan(String chu)
      {</div><div>    chu = chu;                       <span class="cm">// SAI: gán
      tham số cho chính nó</span></div><div>}</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>Chu: null</div></div><span class=''note''><code>null</code>
      là <b>giá trị rỗng</b>: biến chưa trỏ tới đối tượng nào. Trường kiểu chuỗi chưa
      được gán thì mặc định là <code>null</code>.</span>'
    focus:
    - 1
    - - 2
      - 4
    - 5
    clear: true
    say: Lỗi thứ nhất, của người mới, là quên từ khoá chỉ đối tượng này khi tham số
      trùng tên trường. Dòng gán chỉ gán tham số cho chính nó, nên trường tên chủ
      giữ giá trị rỗng mặc định. Giá trị rỗng nghĩa là biến chưa trỏ tới đối tượng
      nào, và trường kiểu chuỗi chưa gán thì mặc định như vậy.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Nhầm <code>static</code>
      với trường riêng của mỗi đối tượng.</div><div class="code"><div><span class="kw">private</span>
      <span class="kw">static</span> <span class="kw">long</span> soDu;            <span
      class="cm">// SAI: một biến chung cho cả lớp</span></div><div>TaiKhoan(String
      chu) { <span class="kw">this</span>.chu = chu; }</div><div><span class="kw">void</span>
      nap(<span class="kw">long</span> soTien) { soDu += soTien; }</div></div><div
      class="code"><div>an.nap(1000000);                 <span class="cm">// chỉ nạp
      vào tài khoản của An</span></div><div>System.out.println(binh);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>Binh: 1000000 dong</div></div>'
    focus:
    - 2
    - 2
    - - 3
      - 5
    clear: true
    say: 'Lỗi thứ hai gặp cả ở người đã đi làm: thêm từ khoá tĩnh vào trường số dư.
      Trường tĩnh thuộc về lớp, chỉ có một bản dùng chung cho mọi đối tượng. Vì vậy
      nạp một triệu cho An, mà in tài khoản Bình cũng thấy một triệu.'
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Để trường <code>public</code>
      cho tiện.</div><div class="code"><div><span class="kw">class</span> TaiKhoan
      {</div><div>    <span class="kw">public</span> <span class="kw">long</span>
      soDu;                    <span class="cm">// SAI: ai cũng sửa được</span></div><div>}</div></div><div
      class="code"><div>an.soDu = -500000;               <span class="cm">// không
      qua rut, không bị kiểm</span></div><div>System.out.println(an.soDu);</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>-500000</div></div><span class=''note''>Lớp
      không viết hàm tạo nào thì Java tự thêm một hàm tạo không tham số, nên <code>new
      TaiKhoan()</code> vẫn chạy.</span>'
    focus:
    - 1
    - - 3
      - 5
    - 6
    clear: true
    say: 'Lỗi thứ ba cũng của người đã đi làm: để trường số dư công khai cho tiện.
      Khi đó một dòng mã bất kỳ gán thẳng âm năm trăm nghìn, không đi qua hàm rút,
      nên không có phép kiểm nào chạy. Để ý lớp này không viết hàm tạo nào, nên Java
      tự thêm một hàm tạo không tham số.'
  - show: '<div class="box key"><b>Sửa:</b> trường <code>private</code>, trình biên
      dịch chặn ngay.</div><div class="code"><div><span class="kw">private</span>
      <span class="kw">long</span> soDu;                   <span class="cm">// ĐÚNG:
      chỉ mã trong lớp được sửa</span></div></div><div class="code"><div>an.soDu =
      -500000;</div></div><p><b>Trình biên dịch báo</b></p><div class="code"><div><span
      class="cm">error: soDu has private access in TaiKhoan</span></div></div>'
    focus:
    - - 1
      - 2
    - - 3
      - 5
    - 5
    clear: true
    say: Cách sửa là để trường riêng tư. Lúc đó cùng dòng gán ấy bị trình biên dịch
      chặn, vì số dư là trường riêng tư của lớp tài khoản. Lỗi bị bắt trước khi chương
      trình kịp chạy.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 500000 - 200000 == 300000
  - 400000 > 300000
  - 300000 - 100000 == 200000
  steps:
  - show: <p><b>Lớp TaiKhoan như trên. Đoán các dòng in ra</b></p><div class="code"><div>TaiKhoan
      c = <span class="kw">new</span> TaiKhoan("Cuc");</div><div>c.nap(500000);</div><div>c.rut(200000);</div><div>c.rut(400000);</div><div>c.nap(-100);</div><div>TaiKhoan
      d = c;</div><div>d.rut(100000);</div><div>System.out.println(c);</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    pause: 20
    clear: true
    say: Bây giờ tới phần bạn tự làm, với lớp tài khoản như trên. Tài khoản của Cúc
      nạp năm trăm nghìn, rút hai trăm nghìn, rút bốn trăm nghìn, rồi nạp âm một trăm.
      Sau đó biến d được gán bằng biến c, rồi rút một trăm nghìn qua d. Hãy dừng video,
      viết ra giấy mọi dòng in ra.
  - show: '<table class=''t''><tr><th>thao tác</th><th>kiểm</th><th>số dư</th><th>in
      ra</th></tr><tr><td>nap(500000)</td><td>500000 &gt; 0</td><td>500000</td><td></td></tr><tr><td>rut(200000)</td><td>200000
      ≤ 500000</td><td>300000</td><td></td></tr><tr><td>rut(400000)</td><td>400000
      &gt; 300000: từ chối</td><td>300000</td><td>Tu choi rut 400000, so du 300000</td></tr><tr><td>nap(-100)</td><td>-100
      không dương: từ chối</td><td>300000</td><td>Tu choi nap -100</td></tr><tr><td>d
      = c; d.rut(100000)</td><td>cùng một đối tượng</td><td>200000</td><td></td></tr></table>'
    focus:
    - 1
    - - '1.2'
      - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    say: Đáp án như sau. Sau khi nạp và rút lần đầu, số dư là ba trăm nghìn. Rút bốn
      trăm nghìn bị từ chối vì quá số dư, nên in dòng từ chối thứ nhất. Nạp âm một
      trăm bị từ chối vì không dương, nên in dòng thứ hai. Biến d trỏ vào cùng đối
      tượng với c, nên số dư của Cúc còn hai trăm nghìn.
    clear: true
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>Tu choi rut 400000, so
      du 300000</div><div>Tu choi nap -100</div><div>Cuc: 200000 dong</div></div>'
    clear: true
    say: Chạy thật chương trình, ta được hai dòng từ chối, rồi dòng cuối là Cúc hai
      trăm nghìn đồng.
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>lớp = bản thiết kế</span><span class='a'>→</span><span
      class='n'>new tạo đối tượng có trường riêng</span><span class='a'>→</span><span
      class='n'>trường private</span><span class='a'>→</span><span class='n'>hàm kiểm
      luật trước khi đổi</span></div>
    say: Tổng kết chuỗi logic. Lớp là bản thiết kế, từ khoá tạo mới dựng đối tượng
      có trường riêng, trường được khoá riêng tư, và chỉ các hàm của lớp, sau khi
      kiểm luật, mới được đổi dữ liệu.
  - show: '<div class=''box key''><b>Tư duy:</b> trước khi viết lớp, hãy viết ra <b>luật</b>
      của nó, ví dụ “số dư không bao giờ âm”.

      Rồi kiểm: mọi đường đổi dữ liệu có đi qua phép kiểm luật không? Trường <code>public</code>
      hay <code>static</code> nhầm chỗ là đường vào thứ ba.</div>

      '
    say: Điều cần mang theo. Trước khi viết một lớp, hãy viết ra luật của nó, ví dụ
      số dư không bao giờ âm. Rồi kiểm xem mọi đường đổi dữ liệu có đi qua phép kiểm
      luật không. Trường công khai, hay trường tĩnh nhầm chỗ, là đường vào thứ ba.
