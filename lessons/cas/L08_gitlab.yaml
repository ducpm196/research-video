# Quy ước: giờ quốc tế (UTC) như bài hậu kiểm. “máy chính / máy phụ” = primary / secondary của cơ sở dữ liệu; “sao chép” = replication;
#   “bản kết xuất” = sao lưu logic bằng pg_dump; “ảnh chụp đĩa” = LVM snapshot / Azure disk snapshot. Tên GitLab, PostgreSQL, pg_dump,
#   LVM, Azure chỉ trên màn hình; lời đọc nói “nền tảng lưu mã nguồn”, “hệ quản trị cơ sở dữ liệu”, “công cụ kết xuất”, “đám mây”.
#   Mốc xoá: nguồn ghi “± 23:30” và mất dữ liệu “17:20 … 23:30” (một chỗ khác ghi “00:00”) → bài dùng 23:30 và nói “khoảng”.
#   486 GB từ 60 Mbit/s × 18 giờ là ƯỚC LƯỢNG của bài (nguồn không ghi cỡ dữ liệu đã chép). 200 GB, 1 Gbit/s ở quiz: SỐ MINH HOẠ.
#   Bài hậu kiểm tự ghi là đã nêu tên người xoá trong tài liệu theo dõi (người đó đồng ý) và sẽ không nêu tên lần sau → bài không nêu.
objectives:
  - "Dựng dòng thời gian từ tải tăng tới lệnh xoá nhầm và tới khi khôi phục"
  - "Phân biệt “có sao lưu” với “khôi phục được” qua bốn cách sao lưu của sự cố"
  - "Tính lượng dữ liệu mất theo thời điểm bản chụp gần nhất, và thời gian chép lại theo băng thông"
  - "Chọn biện pháp ở mức hệ thống: kiểm khôi phục tự động, chụp dày hơn, người phụ trách"
