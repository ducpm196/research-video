scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một hai giây, 300 GB, và không bản sao lưu nào như mong đợi"
    checks:
      - "300 > 0 and 5000 + 5000 + 700 == 10700"
    steps:
      - show: |
          <p>Ngày 31/1/2017, nền tảng lưu mã nguồn <b>GitLab.com</b> (theo bài hậu kiểm 10/2/2017):</p>
          <table class="t"><tr><th>điều đã xảy ra</th></tr>
          <tr><td>một lệnh xoá thư mục dữ liệu được chạy trên <b>máy chính</b> của cơ sở dữ liệu — trong khi người chạy tin đó là <b>máy phụ</b></td></tr>
          <tr><td>lệnh bị dừng sau một hai giây, nhưng khoảng <b>300 GB</b> dữ liệu đã bị xoá</td></tr>
          <tr><td>đi tìm bản sao lưu: “việc tìm và dùng bản sao lưu đều thất bại hoàn toàn”</td></tr>
          <tr><td>dịch vụ ngừng khoảng <b>18 giờ</b>; mất thay đổi của khoảng 5000 dự án, 5000 bình luận, 700 tài khoản mới; kho mã thì không mất</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5", "2.5"]
        say: "Chào bạn, ngày 31 tháng 1 năm 2017, một nền tảng lưu mã nguồn trực tuyến gặp sự cố cơ sở dữ liệu, theo bài hậu kiểm họ công bố mười ngày sau. Một lệnh xoá thư mục dữ liệu được chạy trên máy chính, trong khi người chạy tin rằng đó là máy phụ. Lệnh bị dừng chỉ sau một hai giây, nhưng khoảng 300 ghi-ga-byte dữ liệu đã bị xoá. Rồi đến lúc đi tìm bản sao lưu, và bài hậu kiểm viết, việc tìm và dùng bản sao lưu đều thất bại hoàn toàn. Dịch vụ ngừng khoảng 18 giờ, và mất thay đổi của khoảng 5000 dự án, 5000 bình luận, 700 tài khoản mới. Riêng các kho mã được lưu tách riêng nên không mất."
      - show: |
          <div class="box key">Hôm nay: dòng thời gian từ tải tăng tới lệnh xoá; bốn cách sao lưu, ba cách không dùng được; tính lượng dữ liệu mất và thời gian chép lại.</div>
        say: "Hôm nay ta dựng dòng thời gian từ lúc tải tăng tới lệnh xoá, xem bốn cách sao lưu mà ba cách không dùng được, rồi tính lượng dữ liệu mất và thời gian chép lại."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: nhật ký và máy phụ, dữ liệu mất tối đa, băng thông"
    checks:
      - "100 - 95 == 5 and 88 < 91"
      - "10 - 1 == 9 and 24 - 0 == 24 and 1 - 0 == 1"
      - "60 / 8 == 7.5 and 7.5 * 3600 == 27000"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>nhật ký thay đổi</b>: trước khi sửa dữ liệu, cơ sở dữ liệu ghi việc sửa đó vào một nhật ký, chia thành từng đoạn</td><td>máy tắt giữa chừng thì đọc lại nhật ký là biết việc nào đã làm, việc nào chưa</td><td>đoạn 1: thêm dự án A; đoạn 2: xoá bình luận B…</td></tr>
          <tr><td><b>máy phụ</b> giữ bản sao bằng cách đọc lần lượt các đoạn nhật ký của <b>máy chính</b> và làm lại y hệt</td><td>cùng việc, cùng thứ tự thì ra cùng dữ liệu</td><td>máy chính tới đoạn 100, máy phụ mới đọc tới 95: máy phụ <b>tụt lại</b> 5 đoạn</td></tr>
          <tr><td>máy chính chỉ giữ một số đoạn gần nhất rồi xoá đoạn cũ</td><td>nhật ký không thể lớn mãi</td><td>máy chính chỉ còn từ đoạn 91, máy phụ cần đoạn 88: đoạn đó đã mất → phải <b>dựng lại máy phụ từ đầu</b></td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Trước hết, ta cần hiểu cách một cơ sở dữ liệu giữ bản sao ở máy thứ hai. Trước khi sửa dữ liệu, cơ sở dữ liệu ghi việc sửa đó vào một nhật ký thay đổi, chia thành từng đoạn. Nhờ vậy nếu máy tắt giữa chừng, đọc lại nhật ký là biết việc nào đã làm, việc nào chưa. Máy phụ giữ bản sao bằng cách đọc lần lượt các đoạn nhật ký của máy chính và làm lại y hệt, vì cùng việc theo cùng thứ tự thì ra cùng dữ liệu. Nếu máy chính đã tới đoạn 100 mà máy phụ mới đọc tới đoạn 95, ta nói máy phụ tụt lại 5 đoạn. Máy chính chỉ giữ một số đoạn gần nhất rồi xoá đoạn cũ, vì nhật ký không thể lớn mãi. Nếu máy chính chỉ còn từ đoạn 91 mà máy phụ cần đoạn 88, đoạn đó đã mất, nên máy phụ phải dựng lại từ đầu."
      - clear: true
        show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>lượng dữ liệu mất tối đa</b> khi khôi phục từ bản sao lưu = khoảng cách giữa hai bản sao lưu liền nhau</td><td>mọi thay đổi sau bản gần nhất chưa được lưu ở đâu; tệ nhất là sự cố xảy ra ngay trước bản kế tiếp</td><td>sao lưu lúc 01:00, sự cố lúc 10:00: mất 9 giờ; sao lưu mỗi 24 giờ: có thể mất gần 24 giờ; mỗi 1 giờ: tối đa 1 giờ</td></tr>
          <tr><td>băng thông: 1 byte = 8 bit, nên megabit mỗi giây chia 8 ra megabyte mỗi giây</td><td>đường truyền đo bằng bit, dữ liệu đo bằng byte</td><td>60 megabit mỗi giây = 7,5 megabyte mỗi giây = 27&nbsp;000 megabyte mỗi giờ</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Khi khôi phục từ bản sao lưu, mọi thay đổi sau bản gần nhất đều mất, vì chúng chưa được lưu ở đâu cả. Ví dụ sao lưu lúc 1 giờ sáng mà sự cố xảy ra lúc 10 giờ sáng, thì mất 9 giờ dữ liệu. Tệ nhất là sự cố xảy ra ngay trước bản kế tiếp, nên lượng dữ liệu mất tối đa bằng khoảng cách giữa hai bản sao lưu. Sao lưu mỗi 24 giờ thì có thể mất gần 24 giờ, còn mỗi 1 giờ thì mất tối đa 1 giờ. Về băng thông, một byte là 8 bit, nên số triệu bit mỗi giây chia 8 ra số mê-ga-byte mỗi giây. Vậy 60 triệu bit mỗi giây là 7 phẩy 5 mê-ga-byte mỗi giây, tức 27 nghìn mê-ga-byte mỗi giờ."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của sao lưu và khôi phục"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>sao chép</b> sang máy phụ</td><td>máy phụ chạy theo máy chính từng giây; dùng để <b>chuyển sang</b> khi máy chính hỏng — chép cả lệnh xoá</td></tr>
          <tr><td><b>bản kết xuất</b></td><td>toàn bộ dữ liệu ghi ra thành tệp, làm định kỳ, cất ở nơi khác</td></tr>
          <tr><td><b>ảnh chụp đĩa</b></td><td>bản chụp nguyên một ổ đĩa tại một thời điểm</td></tr>
          <tr><td><b>khôi phục thử</b></td><td>dựng lại thật từ bản sao lưu để biết nó dùng được, và mất bao lâu</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Sao chép sang máy phụ nghĩa là máy phụ chạy theo máy chính từng giây, dùng để chuyển sang khi máy chính hỏng. Chính vì chạy theo từng giây, nó chép cả lệnh xoá. Bản kết xuất là toàn bộ dữ liệu ghi ra thành tệp, làm định kỳ, và cất ở nơi khác. Ảnh chụp đĩa là bản chụp nguyên một ổ đĩa tại một thời điểm. Còn khôi phục thử là dựng lại thật từ bản sao lưu, để biết nó dùng được, và mất bao lâu."

