          <p>Đội bạn dùng lại một mô-đun đọc cảm biến từ sản phẩm cũ (số minh hoạ): giá trị lưu trong số nguyên 16 bit có dấu; sản phẩm cũ đo tối đa 20&nbsp;000. Sản phẩm mới đo được tới <b>50&nbsp;000</b>.</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>50&nbsp;000 có vừa không? Nếu ép thô thì ra số nào?</td></tr>
          <tr><td>2</td><td>Chọn: (a) giữ nguyên vì đã chạy tốt 5 năm; (b) thêm bão hoà ở 32&nbsp;767; (c) đổi sang 32 bit, thêm phép kiểm phạm vi và thử với dữ liệu của sản phẩm mới.</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với số minh hoạ. Đội bạn dùng lại một mô-đun đọc cảm biến, lưu giá trị trong số nguyên 16 bit có dấu. Sản phẩm cũ đo tối đa 20 nghìn, còn sản phẩm mới đo được tới 50 nghìn. Câu một, 50 nghìn có vừa không, và nếu ép thô thì ra số nào? Câu hai, bạn giữ nguyên vì đã chạy tốt 5 năm, thêm bão hoà, hay đổi sang 32 bit kèm phép kiểm phạm vi và thử với dữ liệu mới? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. so với biên</td><td>50&nbsp;000 so với 32&nbsp;767</td><td>lớn hơn: <b>không vừa</b></td></tr>
          <tr><td>Bước 2. ép thô</td><td>50&nbsp;000 − 65&nbsp;536</td><td>$\hl{-15\,536}$: âm, sai cả dấu</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, có hai bước. Bước một, 50 nghìn lớn hơn 32 nghìn 767, nên không vừa. Bước hai, ép thô thì trừ đi 65 nghìn 536, ra âm 15 nghìn 536, một số âm sai cả dấu."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>(a) giữ nguyên</td><td>không tốn gì</td><td>đúng kịch bản năm 1996: giả định cũ, môi trường mới</td></tr>
          <tr><td>(b) bão hoà ở 32&nbsp;767</td><td>nhanh; không bao giờ sai dấu, không dừng máy</td><td>mọi giá trị từ 32&nbsp;767 tới 50&nbsp;000 đọc thành một số: mất thông tin, phải có cờ báo</td></tr>
          <tr><td>(c) 32 bit + kiểm phạm vi + thử dữ liệu mới</td><td>đúng cho cả dải mới; giả định được ghi lại</td><td>phải sửa giao diện và thử lại các mô-đun dùng giá trị này</td></tr></table>
