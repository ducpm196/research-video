        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Đáp án câu hai là một đánh đổi. Giữ nguyên thì không tốn gì, nhưng đó đúng là kịch bản năm 1996, giả định cũ gặp môi trường mới. Bão hoà thì nhanh, không bao giờ sai dấu hay dừng máy, đổi lại mọi giá trị từ 32 nghìn 767 tới 50 nghìn đều đọc thành một số, nên phải có cờ báo. Đổi sang 32 bit kèm phép kiểm phạm vi và thử với dữ liệu mới thì đúng cho cả dải, nhưng phải sửa giao diện và thử lại các mô-đun liên quan. Vậy nên chọn cách thứ ba, giữ bão hoà làm lớp phòng vệ cuối, và chỉ dùng bão hoà tạm thời nếu chưa kịp đổi giao diện."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Thay đổi hệ thống & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">quỹ đạo mới: BH lớn hơn</span><span class="a">→</span>
          <span class="n">đổi 64 bit sang 16 bit, không kiểm</span><span class="a">→</span>
          <span class="n">ngoại lệ: dừng máy</span><span class="a">→</span>
          <span class="n">hai bộ cùng phần mềm cùng tắt</span><span class="a">→</span>
          <span class="n">số chẩn đoán bị đọc như số đo</span></div>
        say: "Tổng kết lại, quỹ đạo mới làm độ lệch ngang lớn hơn, phép đổi sang 16 bit không có kiểm tra gây ngoại lệ, và đặc tả ra lệnh dừng máy. Hai bộ cùng phần mềm cùng tắt, rồi mẫu bit chẩn đoán bị đọc như số đo."
      - show: |
          <div class="box key"><b>Tư duy:</b> báo cáo đề nghị coi phần mềm là <b>có lỗi cho tới khi chứng minh được là đúng</b>. Mỗi thành phần dùng lại phải mang theo <b>giới hạn hoạt động</b> của nó, ghi trong đặc tả.</div>
        say: "Điều cần mang theo, hội đồng điều tra đề nghị coi phần mềm là có lỗi cho tới khi chứng minh được là đúng, chứ không phải ngược lại. Mỗi thành phần được dùng lại phải mang theo giới hạn hoạt động của nó, ghi rõ trong đặc tả."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): Mars Climate Orbiter, 1999 — đơn vị đo không ghi trong kiểu dữ liệu: một bên tính theo pound-lực giây, bên kia đọc như newton giây.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta đọc báo cáo về tàu quỹ đạo khí hậu sao Hoả năm 1999. Đơn vị đo không được ghi trong kiểu dữ liệu, và một bên tính theo đơn vị Anh, bên kia đọc theo đơn vị mét. Hẹn gặp bạn ở bài tiếp theo."
