# Quy ước: “H0” = mốc lệnh đánh lửa động cơ chính ([IB96] mục 3.1 d); “bộ quy chiếu quán tính” = SRI; “máy tính trên khoang” = OBC;
#   “BH” = độ lệch ngang (horizontal bias) — một kết quả của chức năng căn chỉnh. Báo cáo KHÔNG ghi giá trị của BH: mọi giá trị BH trong
#   bài (20 000, 40 000, 50 000) là SỐ MINH HOẠ, ghi rõ trên màn hình. Cất cánh ≈ H0 + 7 s là phép suy từ hai câu của báo cáo
#   (“H0 + 36,7 s … khoảng 30 giây sau cất cánh”; “chạy 50 giây từ H0 − 3 s … khoảng 40 giây bay”), ghi “khoảng”.
#   Lời đọc không nói Ariane, Ada, SRI, ESA (chưa có luật đọc): “tên lửa đẩy châu Âu thế hệ 5 / thế hệ 4”, “ngôn ngữ lập trình của hệ”,
#   “bộ quy chiếu quán tính”, “cơ quan vũ trụ châu Âu”. Không nêu tên người (tên chủ tịch hội đồng chỉ ở `source`).
objectives:
  - "Tính giới hạn số nguyên 16 bit có dấu và kiểm khi nào một phép đổi tràn"
  - "Dựng dòng thời gian từ mốc đánh lửa tới lúc tên lửa vỡ, và tính chức năng căn chỉnh còn chạy bao lâu sau cất cánh"
  - "So sánh ba cách xử lý một giá trị vượt phạm vi: quay vòng, dừng máy, bão hoà"
  - "Phân tích giả định ngầm khi dùng lại một thành phần sang môi trường mới"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ngày 4/6/1996: 40 giây sau khi bắt đầu bay"
    checks:
      - "round(36.7 - 30) == 7"
    steps:
      - show: |
          <p>Ngày <b>4/6/1996</b>, chuyến bay đầu tiên của tên lửa đẩy châu Âu <b>Ariane 5</b> (chuyến 501): chỉ khoảng <b>40 giây</b> sau khi bắt đầu chuỗi bay, ở độ cao khoảng <b>3700 m</b>, tên lửa lệch khỏi quỹ đạo, vỡ ra và nổ.</p>
          <p>Hai bộ quy chiếu quán tính — một chạy chính, một dự phòng — <b>cùng ngừng</b> ở khoảng H0 + 36,7 giây (36,7 giây sau mốc đánh lửa động cơ chính, gọi là H0), cách nhau khoảng 0,05 giây.</p>
          <div class="box key">Hôm nay: một phép đổi sang số nguyên 16 bit, trong một đoạn mã đã chạy tốt trên Ariane 4, và vì sao hai bộ dự phòng không cứu được nhau.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, ngày 4 tháng 6 năm 1996 là chuyến bay đầu tiên của tên lửa đẩy châu Âu thế hệ 5. Chỉ khoảng 40 giây sau khi bắt đầu chuỗi bay, ở độ cao khoảng 3700 mét, tên lửa lệch khỏi quỹ đạo, vỡ ra và nổ. Theo báo cáo của hội đồng điều tra ngày 19 tháng 7 năm đó, hai bộ quy chiếu quán tính cùng ngừng khoảng 36 phẩy 7 giây sau mốc đánh lửa. Một bộ chạy chính và một bộ dự phòng ngừng cách nhau chỉ khoảng 0 phẩy 05 giây. Hôm nay ta tìm hiểu một phép đổi sang số nguyên 16 bit trong đoạn mã đã chạy tốt trên thế hệ 4, và vì sao hai bộ dự phòng không cứu được nhau."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: số nguyên 16 bit có dấu và tràn số"
    checks:
      - "2 ** 2 == len([format(i, '02b') for i in range(4)]) == 4 and 2 ** 16 == 65536 and 2 ** 15 == 32768"
      - "int('1011', 2) - 2 ** 4 == -8 + 0 + 2 + 1 == -5 and int('0111', 2) == 7 and int('1000', 2) - 2 ** 4 == -8"
      - "-2 ** 15 == -32768 and sum(2 ** k for k in range(15)) == 32767"
      - "int(np.array([32767], dtype=np.int64).astype(np.int16)[0]) == 32767 and int(np.array([32768], dtype=np.int64).astype(np.int16)[0]) == -32768"
      - "int(np.array([40000], dtype=np.int64).astype(np.int16)[0]) == 40000 - 65536 == -25536"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td>k bit có <b>2 mũ k</b> mẫu bit khác nhau</td><td>mỗi bit thêm vào có 2 cách chọn, nên số mẫu nhân đôi</td><td>2 bit: 00, 01, 10, 11 = 4 mẫu; 16 bit: 2 mũ 16 = <b>65&nbsp;536</b> mẫu</td></tr>
          <tr><td><b>bù 2</b>: cách ghi số có dấu; bit đầu mang giá trị <b>âm</b> 2 mũ (k − 1), các bit sau mang giá trị dương như thường</td><td>nhờ vậy mọi mẫu có bit đầu là 1 thành số âm: đúng một nửa số mẫu</td><td>4 bit: 1011 = −8 + 0 + 2 + 1 = <b>−5</b>; 0111 = 7 lớn nhất; 1000 = −8 nhỏ nhất</td></tr>
          <tr><td>16 bit có dấu chứa từ âm 2 mũ 15 tới 2 mũ 15 trừ 1</td><td>nhỏ nhất: chỉ bit đầu là 1; lớn nhất: bit đầu 0, mọi bit còn lại là 1</td><td>từ <b>−32&nbsp;768</b> tới <b>32&nbsp;767</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.3", "1.4"]
        say: "Trước hết, ta cần hiểu cách máy lưu số nguyên có dấu bằng các bit, tức các chữ số 0 và 1. Với k bit, mỗi bit thêm vào có hai cách chọn nên số mẫu bit nhân đôi, và 16 bit có 2 mũ 16, tức 65 nghìn 536 mẫu. Cách ghi số có dấu phổ biến gọi là bù 2, trong đó bit đầu mang giá trị âm, bằng 2 mũ của k trừ 1, còn các bit sau mang giá trị dương như thường. Ví dụ với 4 bit, mẫu 1, 0, 1, 1 bằng âm 8 cộng 0 cộng 2 cộng 1, tức âm 5. Mẫu 0, 1, 1, 1 bằng 7 là số lớn nhất, còn mẫu 1, 0, 0, 0 bằng âm 8 là số nhỏ nhất. Theo cùng cách đó, 16 bit có dấu chứa từ âm 32 nghìn 768 tới 32 nghìn 767."
      - clear: true
        show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>tràn</b>: giá trị lớn hơn 32&nbsp;767 hay nhỏ hơn −32&nbsp;768 không có mẫu bit nào</td><td>cả 65&nbsp;536 mẫu đã dùng hết cho dãy −32&nbsp;768 … 32&nbsp;767</td><td>40&nbsp;000 không vừa</td></tr>
          <tr><td><b>ép thô</b> vào 16 bit: chỉ giữ 16 bit cuối, tức trừ đi 65&nbsp;536 (đúng một vòng)</td><td>các bit phía trên bị bỏ; bit đầu còn lại thành bit dấu</td><td>32&nbsp;768 thành −32&nbsp;768; 40&nbsp;000 − 65&nbsp;536 = <b>−25&nbsp;536</b>: đổi cả dấu</td></tr></table>
        focus: ["1.2", "1.3", "1.3"]
        say: "Cả 65 nghìn 536 mẫu đã dùng hết cho dãy từ âm 32 nghìn 768 tới 32 nghìn 767, nên một giá trị như 40 nghìn không có mẫu bit nào, và ta gọi đó là tràn. Nếu ép thô một số quá lớn vào 16 bit, máy chỉ giữ 16 bit cuối, tức là trừ đi 65 nghìn 536, đúng một vòng. Khi đó 32 nghìn 768 thành âm 32 nghìn 768, còn 40 nghìn trừ 65 nghìn 536 thành âm 25 nghìn 536, đổi cả dấu."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của báo cáo"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa trong báo cáo năm 1996</th></tr>
          <tr><td><b>H0</b></td><td>mốc lệnh đánh lửa động cơ chính; “H0 + 36,7 giây” là 36,7 giây sau mốc đó</td></tr>
          <tr><td><b>bộ quy chiếu quán tính</b></td><td>máy đo góc và vận tốc của tên lửa, có máy tính riêng; hai bộ chạy song song, <b>cùng phần cứng, cùng phần mềm</b></td></tr>
          <tr><td><b>căn chỉnh</b></td><td>tính toán chỉ có nghĩa <b>trước khi cất cánh</b>, khi tên lửa đứng yên ở vị trí biết trước</td></tr>
          <tr><td><b>BH, độ lệch ngang</b></td><td>một kết quả của căn chỉnh, liên quan tới vận tốc ngang mà bộ đo cảm nhận</td></tr>
          <tr><td><b>lỗi toán hạng</b></td><td>một <b>ngoại lệ</b> — tín hiệu báo lỗi làm chương trình rời luồng chạy bình thường — khi phép đổi gặp giá trị không biểu diễn được</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng có năm thuật ngữ của báo cáo. Mốc H không là lệnh đánh lửa động cơ chính, và 36 phẩy 7 giây sau mốc đó viết là H không cộng 36 phẩy 7. Bộ quy chiếu quán tính là máy đo góc và vận tốc của tên lửa, có máy tính riêng. Có hai bộ chạy song song, cùng phần cứng và cùng phần mềm, một bộ chạy chính, một bộ chờ sẵn. Căn chỉnh là phép tính chỉ có nghĩa trước khi cất cánh, khi tên lửa đứng yên ở vị trí biết trước. Độ lệch ngang là một kết quả của căn chỉnh, liên quan tới vận tốc ngang. Lỗi toán hạng là một ngoại lệ, tức tín hiệu báo lỗi làm chương trình rời luồng chạy bình thường, xảy ra khi phép đổi gặp một giá trị không biểu diễn được."

  # ───────────────────────── 4. HÌNH CƠ CHẾ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Chuỗi sự kiện: từ một phép đổi tới hai bộ đo cùng tắt"
    steps:
      - show: |
          <div><svg width="1640" height="420" viewBox="0 0 1640 420">
          <defs><marker id="ar2" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1f2937"/></marker></defs>
          <g font-size="23" fill="#1f2937" text-anchor="middle">
          <rect x="20" y="40" width="290" height="100" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/>
          <text x="165" y="82" font-weight="bold">BH: số thực 64 bit</text><text x="165" y="118">quỹ đạo mới: lớn hơn</text>
          <rect x="400" y="40" width="300" height="100" rx="10" fill="#fde2e2" stroke="#e11d48" stroke-width="3"/>
          <text x="550" y="82" font-weight="bold">đổi sang 16 bit có dấu</text><text x="550" y="118">không có phép kiểm</text>
          <rect x="790" y="40" width="300" height="100" rx="10" fill="#fde2e2" stroke="#e11d48" stroke-width="3"/>
          <text x="940" y="82" font-weight="bold">lỗi toán hạng</text><text x="940" y="118">theo đặc tả: dừng máy</text>
          <rect x="1180" y="40" width="440" height="100" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
          <text x="1400" y="82" font-weight="bold">bộ chính gửi mẫu bit chẩn đoán</text><text x="1400" y="118">máy tính trên khoang đọc như số đo</text>
          <line x1="310" y1="90" x2="395" y2="90" stroke="#1f2937" stroke-width="4" marker-end="url(#ar2)"/>
          <line x1="700" y1="90" x2="785" y2="90" stroke="#1f2937" stroke-width="4" marker-end="url(#ar2)"/>
          <line x1="1090" y1="90" x2="1175" y2="90" stroke="#1f2937" stroke-width="4" marker-end="url(#ar2)"/>
          <rect x="400" y="230" width="300" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
          <text x="550" y="268" font-weight="bold">bộ dự phòng</text><text x="550" y="302">cùng phần mềm: tắt trước</text>
          <rect x="790" y="230" width="300" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
          <text x="940" y="268" font-weight="bold">bộ chính</text><text x="940" y="302">tắt khoảng 0,05 giây sau</text>
          <rect x="1180" y="230" width="440" height="90" rx="10" fill="#fde2e2" stroke="#e11d48" stroke-width="3"/>
          <text x="1400" y="268" font-weight="bold">bẻ hết cỡ vòi phun động cơ</text><text x="1400" y="302">góc tấn hơn 20 độ: vỡ ở H0 + 39 giây</text>
          <line x1="700" y1="275" x2="785" y2="275" stroke="#1f2937" stroke-width="4" marker-end="url(#ar2)"/>
          <line x1="1090" y1="275" x2="1175" y2="275" stroke="#1f2937" stroke-width="4" marker-end="url(#ar2)"/>
          <text x="820" y="395" font-size="22" fill="#6b7280">hai bộ chạy cùng một phần mềm, nên gặp cùng một giá trị BH thì cùng hỏng: dự phòng không độc lập</text>
          </g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ chuỗi sự kiện mà báo cáo dựng lại. Độ lệch ngang là số thực 64 bit, và với quỹ đạo của tên lửa mới, nó lớn hơn nhiều so với dự kiến. Phép đổi sang số nguyên 16 bit có dấu không có phép kiểm, nên gây lỗi toán hạng, và theo đặc tả, máy tính của bộ đo phải dừng. Bộ dự phòng chạy cùng phần mềm nên đã tắt trước, bộ chính tắt khoảng 0 phẩy 05 giây sau, rồi gửi một mẫu bit chẩn đoán mà máy tính trên khoang đọc như số đo. Máy tính trên khoang bẻ hết cỡ vòi phun, tức ống đẩy khí, nên góc tấn, tức góc giữa thân tên lửa và hướng bay, vượt 20 độ, và tên lửa vỡ ở giây thứ 39."

  # ───────────────────────── 5. DÒNG THỜI GIAN ─────────────────────────
  - id: timeline
    kind: concept
    title: "Dòng thời gian: chức năng không cần vẫn chạy 40 giây"
    checks:
      - "-3 + 50 == 47 and 47 - 7 == 40"
      - "round(36.7 - 7, 1) == 29.7"
    steps:
      - show: |
          <table class="t"><tr><th>mốc</th><th>dữ kiện trong báo cáo</th></tr>
          <tr><td>H0 − 3 giây</td><td>bộ quy chiếu vào chế độ bay; chức năng căn chỉnh chạy tiếp <b>50 giây</b> kể từ đây</td></tr>
          <tr><td>khoảng H0 + 7 giây</td><td>cất cánh (báo cáo: H0 + 36,7 giây là “khoảng 30 giây sau cất cánh”)</td></tr>
          <tr><td>H0 + 36,7 giây</td><td>bộ dự phòng ngừng; khoảng 0,05 giây sau, bộ chính ngừng</td></tr>
          <tr><td>H0 + 39 giây</td><td>tên lửa bắt đầu vỡ vì lực khí động học</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bây giờ ta đặt các mốc lên dòng thời gian. Ba giây trước mốc đánh lửa, bộ quy chiếu vào chế độ bay, và chức năng căn chỉnh chạy tiếp 50 giây kể từ đây. Báo cáo ghi giây thứ 36 phẩy 7 là khoảng 30 giây sau cất cánh, nên cất cánh vào khoảng giây thứ 7. Ở giây thứ 36 phẩy 7, bộ dự phòng ngừng, và khoảng 0 phẩy 05 giây sau thì bộ chính ngừng. Ở giây thứ 39, tên lửa bắt đầu vỡ vì lực khí động học."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. căn chỉnh dừng lúc</td><td>âm 3 + 50</td><td>H0 + $\hl{47}$ giây</td></tr>
          <tr><td>Bước 2. căn chỉnh còn chạy sau cất cánh</td><td>47 − 7</td><td>khoảng $\hl{40}$ giây — đúng số báo cáo ghi</td></tr>
          <tr><td>Bước 3. hỏng lúc nào kể từ cất cánh</td><td>36,7 − 7</td><td>khoảng 29,7 giây, tức “khoảng 30 giây”</td></tr></table>
          <p class="note">Báo cáo: chức năng này chỉ có nghĩa trước cất cánh; thời lượng 50 giây là yêu cầu của <b>Ariane 4</b>, không cần cho Ariane 5, nhưng được giữ “vì sự đồng nhất”.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Ta tính lại từng mốc. Bước một, căn chỉnh dừng ở âm 3 cộng 50, tức giây thứ 47. Bước hai, trừ đi mốc cất cánh khoảng giây thứ 7, căn chỉnh còn chạy khoảng 40 giây sau cất cánh, đúng số báo cáo ghi. Bước ba, lỗi xảy ra ở 36 phẩy 7 trừ 7, khoảng 29 phẩy 7 giây sau cất cánh. Báo cáo ghi rõ, thời lượng 50 giây là yêu cầu của thế hệ 4, không cần cho thế hệ 5, nhưng được giữ lại vì sự đồng nhất."

  # ───────────────────────── 6. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra: phép đổi nào an toàn, phép đổi nào cần kiểm"
    checks:
      - "(lambda a, b: b != 0 and a / b == 3)(6, 2)"
      - "all(-32768 <= v <= 32767 for v in (0, 20000, -32768, 32767)) and not (-32768 <= 40000 <= 32767)"
      - "max(-32768, min(32767, 40000)) == 32767 and max(-32768, min(32767, -50000)) == -32768"
    steps:
      - show: |
          <p><b>Tiền điều kiện</b> là điều phải đúng <b>trước</b> khi gọi một phép tính, thì phép tính mới hứa cho kết quả đúng — như chia a cho b cần b ≠ 0.</p>
          <p>Phép đổi một số thực v sang 16 bit có dấu chỉ đúng khi v nằm trong phạm vi, nên tiền điều kiện của nó là:</p>
          $$-32\,768 \le v \le 32\,767$$
          <p>Làm thử: v = 20&nbsp;000 thoả; v = 40&nbsp;000 <b>không</b> thoả, vì 40&nbsp;000 lớn hơn 32&nbsp;767.</p>
        focus: [1, 1, [2, 3], 4, 4]
        say: "Bây giờ ta suy ra điều kiện, và trước hết cần hiểu tiền điều kiện là điều phải đúng trước khi gọi một phép tính, thì phép tính mới hứa cho kết quả đúng. Ví dụ quen thuộc là phép chia a cho b có tiền điều kiện b khác 0, nên 6 chia 2 bằng 3 là hợp lệ, còn chia cho 0 thì phải chặn trước. Phép đổi sang 16 bit có dấu chỉ đúng khi v nằm trong phạm vi vừa ôn, nên tiền điều kiện là v không nhỏ hơn âm 32 nghìn 768 và không lớn hơn 32 nghìn 767. Làm thử, 20 nghìn thoả điều kiện. Còn 40 nghìn thì không, vì nó lớn hơn 32 nghìn 767."
      - clear: true
        show: |
          <table class="t"><tr><th>khi tiền điều kiện sai, có ba cách</th><th>v = 40&nbsp;000 (số minh hoạ) cho</th></tr>
          <tr><td>(a) <b>quay vòng</b>: ép thô, giữ 16 bit cuối</td><td>40&nbsp;000 − 65&nbsp;536 = <b>−25&nbsp;536</b>: sai cả dấu, không ai biết</td></tr>
          <tr><td>(b) <b>ngoại lệ</b>, như phép đổi không bảo vệ năm 1996</td><td>lỗi toán hạng → theo đặc tả, <b>dừng máy</b></td></tr>
          <tr><td>(c) <b>bão hoà</b> có phép kiểm: kẹp về biên gần nhất</td><td>32&nbsp;767, kèm cờ báo “đã kẹp”</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Khi tiền điều kiện sai, có ba cách xử lý, ta làm thử với một giá trị minh hoạ 40 nghìn. Quay vòng là ép thô, giữ 16 bit cuối, nên ra âm 25 nghìn 536, sai cả dấu mà không ai biết. Ngoại lệ là điều xảy ra với phép đổi không bảo vệ năm 1996, gây lỗi toán hạng, và theo đặc tả thì máy dừng. Bão hoà có phép kiểm thì kẹp về biên gần nhất, cho 32 nghìn 767, kèm một cờ báo rằng giá trị đã bị kẹp."

  # ───────────────────────── 7. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tái hiện bằng số: vì sao mã đúng trên Ariane 4 lại hỏng trên Ariane 5"
    checks:
      - "-32768 <= 20000 <= 32767 and not (40000 <= 32767)"
      - "7 - 4 == 3 and round(3 / 7 * 100) == 43"
      - "int(np.array([40000], dtype=np.int64).astype(np.int16)[0]) == -25536"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>quỹ đạo</th><th>BH lớn nhất (số minh hoạ)</th><th>tiền điều kiện</th></tr>
          <tr><td>Bước 1</td><td>Ariane 4: vận tốc ngang ban đầu nhỏ</td><td>20&nbsp;000</td><td>thoả: đổi êm, chạy tốt nhiều năm</td></tr>
          <tr><td>Bước 2</td><td>Ariane 5: báo cáo ghi phần đầu quỹ đạo cho vận tốc ngang <b>lớn hơn đáng kể</b></td><td>40&nbsp;000</td><td><b>sai</b>: lỗi toán hạng</td></tr></table>
          <p class="note">Báo cáo không ghi giá trị BH thật; 20&nbsp;000 và 40&nbsp;000 chỉ để thấy cơ chế. Điều báo cáo ghi: BH “cao hơn nhiều so với dự kiến”.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bây giờ ta tái hiện cơ chế bằng số minh hoạ. Bước một, với quỹ đạo thế hệ 4, vận tốc ngang ban đầu nhỏ, giả sử độ lệch ngang lớn nhất là 20 nghìn, tiền điều kiện thoả, nên phép đổi chạy êm suốt nhiều năm. Bước hai, báo cáo ghi phần đầu quỹ đạo thế hệ 5 cho vận tốc ngang lớn hơn đáng kể, giả sử 40 nghìn, tiền điều kiện sai, và phép đổi gây lỗi toán hạng. Báo cáo không ghi giá trị thật, chỉ ghi nó cao hơn nhiều so với dự kiến."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>dữ kiện trong báo cáo</th><th>phép tính</th></tr>
          <tr><td>Bước 3. các phép đổi có thể gây lỗi toán hạng</td><td>7 biến; 4 được bảo vệ</td><td>7 − 4 = $\hl{3}$ biến không bảo vệ, khoảng <b>43%</b></td></tr>
          <tr><td>Bước 4. vì sao không bảo vệ hết</td><td>đặt mục tiêu tải tối đa <b>80%</b> cho máy tính của bộ đo</td><td>bảo vệ tốn thời gian chạy</td></tr>
          <tr><td>Bước 5. vì sao 3 biến được coi là an toàn</td><td>lập luận: bị giới hạn vật lý hoặc còn biên an toàn lớn — <b>sai với BH</b></td><td>không có dữ liệu quỹ đạo nào được dùng để kiểm lập luận</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.4"]
        say: "Báo cáo còn cho biết vì sao phép đổi này không được bảo vệ. Bước ba, phân tích tìm thấy 7 biến mà phép đổi có thể gây lỗi toán hạng, 4 biến được bảo vệ, nên 3 biến, khoảng 43 phần trăm, để trần. Bước bốn, lý do là mục tiêu tải tối đa 80 phần trăm cho máy tính của bộ đo, vì mỗi phép kiểm tốn thời gian chạy. Bước năm, 3 biến kia được coi là an toàn vì lập luận rằng chúng bị giới hạn vật lý, hoặc còn biên an toàn lớn. Với độ lệch ngang, lập luận đó sai, và không có dữ liệu quỹ đạo nào được dùng để kiểm nó."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>dữ kiện trong báo cáo</th><th>hệ quả</th></tr>
          <tr><td>Bước 6. đặc tả xử lý ngoại lệ</td><td>mọi ngoại lệ: báo lên đường truyền, lưu ngữ cảnh lỗi, rồi <b>dừng bộ xử lý</b></td><td>bộ đo thành vô dụng, không khởi động lại được giữa chừng</td></tr>
          <tr><td>Bước 7. văn hoá thiết kế</td><td>chỉ tính tới <b>hỏng phần cứng ngẫu nhiên</b>, mà bộ dự phòng gánh được</td><td>lỗi phần mềm giống nhau ở cả hai bộ: tắt <b>hai bộ còn lành</b></td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bản thân lỗi toán hạng chưa làm hỏng nhiệm vụ. Bước sáu, đặc tả ghi rằng với mọi ngoại lệ, bộ đo báo lỗi lên đường truyền, lưu ngữ cảnh lỗi, rồi dừng bộ xử lý. Đã dừng thì không tính lại được góc, nên bộ đo thành vô dụng. Bước bảy, báo cáo chỉ ra văn hoá thiết kế chỉ tính tới hỏng phần cứng ngẫu nhiên, loại hỏng mà bộ dự phòng gánh được. Nhưng lỗi phần mềm giống nhau ở cả hai bộ, nên kết quả là tắt hai bộ đo vẫn còn lành."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm bằng đường khác: nhìn mẫu bit, và nhìn hai bộ dự phòng"
    checks:
      - "format(32767, '016b') == '0111111111111111' and format(40000, '016b') == '1001110001000000'"
      - "int('1001110001000000', 2) - 2 ** 16 == -25536"
      - "abs(0.1 * 0.1 - 0.01) < 1e-12"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>32&nbsp;767 là số lớn nhất</td><td>mẫu bit 0111&nbsp;1111&nbsp;1111&nbsp;1111: bit đầu 0 là dấu dương, mọi bit còn lại đã là 1 ✓</td></tr>
          <tr><td>40&nbsp;000 quay vòng thành −25&nbsp;536</td><td>40&nbsp;000 = 1001&nbsp;1100&nbsp;0100&nbsp;0000: bit đầu là 1 nên đọc là số âm; giá trị không dấu trừ 65&nbsp;536 ra −25&nbsp;536 ✓</td></tr>
          <tr><td>hai bộ dự phòng</td><td>hỏng <b>độc lập</b> (bộ này hỏng không kéo theo bộ kia) thì xác suất cùng hỏng là tích: mỗi bộ 10% (số minh hoạ) → 10% nhân 10% = 1%; lỗi phần mềm chung: cùng hỏng với cùng giá trị BH — <b>100%</b> khi gặp nó</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.4", "1.4"]
        say: "Ta kiểm lại bằng đường khác. Số 32 nghìn 767 có mẫu bit là một chữ 0 rồi mười lăm chữ 1, bit đầu là dấu dương, mọi bit còn lại đã là 1, nên không có số dương nào lớn hơn. Số 40 nghìn có mẫu bit bắt đầu bằng chữ 1, nên khi đọc kiểu có dấu nó thành số âm, lấy giá trị không dấu trừ 65 nghìn 536 ra âm 25 nghìn 536. Với hai bộ dự phòng hỏng độc lập, tức bộ này hỏng không kéo theo bộ kia, xác suất cùng hỏng là tích hai tỉ lệ. Mỗi bộ hỏng 10 phần trăm thì cả hai cùng hỏng là 0 phẩy 1 nhân 0 phẩy 1, tức chỉ 1 phần trăm. Nhưng hai bộ chạy cùng phần mềm thì gặp cùng giá trị độ lệch ngang sẽ cùng hỏng, chắc chắn."

  # ───────────────────────── 9. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Một lập trình viên quên phép kiểm”</td><td>quyết định bảo vệ biến này, bỏ biến kia do các bên dự án cùng đưa ra, ở nhiều cấp hợp đồng; lý do không ghi trong mã</td><td>ghi giả định ngay cạnh mã, và đưa nó ra duyệt</td></tr>
          <tr><td><b class="red">2.</b> “Mã đã bay tốt trên Ariane 4 thì an toàn”</td><td>đặc tả của bộ đo <b>không chứa dữ liệu quỹ đạo Ariane 5</b>, do các bên cùng thống nhất</td><td>dùng lại một thành phần là dùng lại <b>giả định</b> của nó: kiểm lại với môi trường mới</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ nhất là kết luận một lập trình viên quên phép kiểm. Báo cáo ghi quyết định bảo vệ biến này, bỏ biến kia do các bên trong dự án cùng đưa ra, ở nhiều cấp hợp đồng, còn lý do thì không ghi trong mã. Bài học sai thứ hai là tin mã đã bay tốt trên thế hệ 4 thì an toàn. Đặc tả của bộ đo không chứa dữ liệu quỹ đạo thế hệ 5, do các bên cùng thống nhất, nên dùng lại một thành phần chính là dùng lại giả định của nó."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Có hai bộ dự phòng là an toàn” (người đã đi làm)</td><td>dự phòng chỉ chống hỏng ngẫu nhiên; cùng phần mềm thì cùng hỏng</td><td>ngoại lệ phần mềm không được tắt thiết bị then chốt; trả về ước lượng tốt nhất</td></tr>
          <tr><td><b class="red">4.</b> “Mã không cần nữa thì vô hại”</td><td>căn chỉnh vô nghĩa sau cất cánh mà vẫn chạy 40 giây</td><td>tắt chức năng không cần — báo cáo khuyến nghị tắt căn chỉnh ngay sau cất cánh</td></tr>
          <tr><td><b class="red">5.</b> “Khâu duyệt đã xử lý hàng nghìn vấn đề”</td><td>không phép thử nào cho bộ đo chạy theo đúng chuỗi đếm ngược, thời gian bay và quỹ đạo Ariane 5</td><td>thử với quỹ đạo thật, trên thiết bị thật</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Bài học sai thứ ba hay gặp ở người đã đi làm, tin rằng có hai bộ dự phòng là an toàn. Dự phòng chỉ chống được hỏng ngẫu nhiên, còn cùng phần mềm thì cùng hỏng. Bài học sai thứ tư là nghĩ mã không cần nữa thì vô hại, trong khi chức năng căn chỉnh vô nghĩa sau cất cánh mà vẫn chạy 40 giây. Bài học sai thứ năm là yên tâm vì khâu duyệt đã xử lý hàng nghìn vấn đề. Thực ra không phép thử nào cho bộ đo chạy theo đúng chuỗi đếm ngược, thời gian bay và quỹ đạo mới."

  # ───────────────────────── 10. BẠN SẼ LÀM GÌ ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì?"
    checks:
      - "50000 > 32767 and int(np.array([50000], dtype=np.int64).astype(np.int16)[0]) == -15536"
      - "50000 <= 2 ** 31 - 1"
    steps:
