id: L05
course: CAS
series: "CAS · Tình huống chuyên gia"
title: "Bài 5 — Knight Capital (2012): một máy chủ thiếu bản triển khai và một cờ dùng lại"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cas.yaml L05; audit/cas/sources_L05.md (câu trích nguyên văn, đọc 2026-11-02); audit/cas/ver/L05.py; audit/verify_plan_curricula.py CAS:L05; U.S. Securities and Exchange Commission, Order Instituting Administrative and Cease-and-Desist Proceedings, In the Matter of Knight Capital Americas LLC, Release No. 34-70694, 16/10/2013 (bản PDF www.sec.gov/litigation/admin/2013/34-70694.pdf, tải được trong phiên này) [SEC13]; khoá DevOps (DVO bài 4: sản phẩm dựng bất biến, mã băm; bài 7: phát hành tiệm tiến, cờ tính năng)"
assumes: [arith, frac, power, approx]
# Quy ước: “lệnh mẹ” = lệnh khách gửi vào (parent order); “lệnh con” = lệnh bộ định tuyến gửi ra sàn (child order);
#   “bộ định tuyến” = SMARS; “chức năng cũ” = Power Peg; “cờ” = cờ tính năng. Mọi con số có giờ, ngày, đô la, số lệnh là CITED [SEC13].
#   Lệnh mẹ 100 cổ phiếu, lệnh con 10 cổ phiếu, 100 lệnh con mỗi giây, 1% lỗi mỗi máy, 20 máy là SỐ MINH HOẠ, ghi trên màn hình.
#   Lời đọc không nói Knight Capital, SEC, SMARS, Power Peg, NYSE (chưa có luật đọc): “một công ty môi giới chứng khoán”,
#   “Uỷ ban Chứng khoán Mỹ”, “bộ định tuyến lệnh”, “chức năng cũ”; tên gốc ở trên màn hình. KHÔNG nêu tên hay chức danh người
#   (lệnh của uỷ ban ghi “one of Knight's technicians” — bài nói “ở một máy chủ, bản mới không được chép lên”).
objectives:
  - "Dựng dòng thời gian từ năm 2003 tới sáng 1/8/2012 và đọc các con số của lệnh xử phạt năm 2013"
  - "Giải thích vì sao một cờ dùng lại cộng một máy chủ thiếu bản mới đánh thức mã chết"
  - "Tính tốc độ thua lỗ, tốc độ khớp lệnh, và xác suất có ít nhất một máy lệch khi triển khai bằng tay"
  - "Thiết kế triển khai có kiểm đồng nhất, có nút dừng, và có giới hạn vốn tự động"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sáng 1/8/2012: 45 phút, hơn 460 triệu đô la"
    checks:
      - "460 / 45 > 10"
    steps:
      - show: |
          <p>Sáng <b>1/8/2012</b>, bộ định tuyến lệnh tự động của công ty môi giới Knight Capital nhận <b>212</b> lệnh nhỏ của khách, rồi gửi ra thị trường <b>hàng triệu</b> lệnh trong khoảng <b>45 phút</b>.</p>
          <p>Kết quả: hơn <b>4 triệu</b> lần khớp lệnh, 154 mã cổ phiếu, hơn 397 triệu cổ phiếu — và công ty lỗ <b>hơn 460 triệu đô la</b>.</p>
          <div class="box key">Hôm nay: một cờ tính năng dùng lại, một máy chủ trong tám máy thiếu bản mới, và vì sao không lớp phòng vệ nào dừng được bộ định tuyến.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, sáng ngày 1 tháng 8 năm 2012, bộ định tuyến lệnh tự động của một công ty môi giới chứng khoán Mỹ nhận 212 lệnh nhỏ của khách hàng. Trong khoảng 45 phút sau đó, nó gửi ra thị trường hàng triệu lệnh. Theo lệnh xử phạt năm 2013 của Uỷ ban Chứng khoán Mỹ, kết quả là hơn 4 triệu lần khớp lệnh, trên 154 mã cổ phiếu, hơn 397 triệu cổ phiếu. Công ty lỗ hơn 460 triệu đô la. Hôm nay ta tìm hiểu một cờ tính năng bị dùng lại, một máy chủ trong tám máy thiếu bản mới, và vì sao không lớp phòng vệ nào dừng được bộ định tuyến."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: cờ tính năng, mã băm, xác suất ít nhất một lần"
    checks:
      - "round(1 - 0.9 ** 2, 2) == 0.19 and round(1 - (1 - 0.1) ** 2, 2) == 0.19"
      - "0.1 * 0.1 == 0.010000000000000002 or abs(0.1 * 0.1 - 0.01) < 1e-12"
    steps:
      - show: |
          <table class="t"><tr><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td><b>cờ tính năng</b> (khoá DevOps): công tắc trong mã để bật tắt một chức năng mà không triển khai lại</td><td>cờ “bật” thì chạy nhánh mới, “tắt” thì chạy nhánh cũ</td></tr>
          <tr><td><b>mã băm</b> (khoá DevOps): dấu vân tay của nội dung; đổi một byte là đổi mã băm</td><td>hai máy cùng mã băm thì đang chạy cùng một bản</td></tr>
          <tr><td><b>ít nhất một lần</b> = 1 trừ xác suất không lần nào</td><td>hai việc độc lập, mỗi việc hỏng 10%: ít nhất một hỏng = 1 − 0,9 nhân 0,9 = <b>0,19</b></td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Trước hết, ta ôn ba điều sẽ dùng. Ở khoá tích hợp và triển khai liên tục, cờ tính năng là công tắc trong mã để bật tắt một chức năng mà không phải triển khai lại. Cờ bật thì chạy nhánh mới, tắt thì chạy nhánh cũ. Cũng ở khoá đó, mã băm là dấu vân tay của nội dung, nên hai máy cùng mã băm thì đang chạy cùng một bản. Xác suất có ít nhất một lần hỏng bằng 1 trừ xác suất không lần nào hỏng. Hai việc độc lập, mỗi việc hỏng 10 phần trăm, thì ít nhất một hỏng là 1 trừ 0 phẩy 9 nhân 0 phẩy 9, bằng 0 phẩy 19."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của lệnh xử phạt"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa trong lệnh năm 2013</th></tr>
          <tr><td><b>lệnh mẹ, lệnh con</b></td><td>bộ định tuyến nhận lệnh mẹ, rồi gửi một hay nhiều lệnh con ra các sàn tuỳ lượng hàng sẵn có</td></tr>
          <tr><td><b>chức năng cũ Power Peg</b></td><td>ngừng dùng từ <b>2003</b>, nhưng mã vẫn nằm trên máy chủ và <b>gọi được</b></td></tr>
          <tr><td><b>bộ đếm tích lũy</b></td><td>đếm số cổ phiếu của lệnh mẹ đã khớp, để dừng gửi lệnh con khi đã đủ</td></tr>
          <tr><td><b>cờ dùng lại</b></td><td>cờ từng bật chức năng cũ, nay được dùng để bật chức năng mới cho chương trình bán lẻ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng có bốn thuật ngữ của lệnh xử phạt. Bộ định tuyến nhận lệnh mẹ, rồi gửi một hay nhiều lệnh con ra các sàn, tuỳ lượng hàng sẵn có. Chức năng cũ đã ngừng dùng từ năm 2003, nhưng mã của nó vẫn nằm trên máy chủ và vẫn gọi được. Bộ đếm tích lũy đếm số cổ phiếu của lệnh mẹ đã khớp, để dừng gửi lệnh con khi đã đủ. Cờ dùng lại là cờ từng bật chức năng cũ, nay được dùng để bật chức năng mới cho một chương trình bán lẻ."

