# ═══ BÀI TÌNH HUỐNG — sự cố có thật; case-lessons.md §1–§4 ═══
id: L03
course: CAS
series: "CAS · Tình huống chuyên gia"
title: "Bài 3 — Mars Climate Orbiter (1999): đơn vị đo không ghi trong kiểu dữ liệu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cas.yaml L03; audit/cas/sources_L03.md (câu trích nguyên văn, đọc 2026-11-02); audit/cas/ver/L03.py; audit/verify_plan_curricula.py CAS:L03; Mars Climate Orbiter Mishap Investigation Board, Phase I Report, NASA, 10/11/1999 (bản PDF của NASA LLIS: llis.nasa.gov/llis_lib/pdf/1009464main1_0641-mr.pdf) [MIB99]; NIST, Guide for the Use of the SI (SP 811), Phụ lục B.8 — 1 lbf = 4,448 222 N [NIST]; khoá Nền tảng phần mềm đúng đắn (SWF bài 0: đặc tả), khoá Kỹ thuật lập trình và mẫu thiết kế (SDP bài 2: đóng gói, bất biến lớp)"
assumes: [arith, frac, approx]
# Quy ước: “xung lực” = lực nhân thời gian (impulse); lời đọc nói “đơn vị chuẩn” cho newton giây và “đơn vị Anh” cho
#   pound-lực giây (probe CAS p1: pound/pao ≤ 1/8, newton/niu-tơn 4/8 → KHÔNG đọc tên; tên chỉ trên màn hình). Dấu nhân giữa đơn vị viết bằng chữ “nhân” hoặc khoảng trắng, không dùng dấu chấm giữa.
#   “đốt chỉnh động lượng” = AMD (angular momentum desaturation). Xung 10 lbf·s mỗi lần đốt và 100 lần đốt là SỐ MINH HOẠ;
#   629 kg là khối lượng LÚC PHÓNG trong [MIB99] (dùng xấp xỉ cho phép tính minh hoạ). Mọi độ cao cận điểm, giờ, ngày là CITED.
#   Lời đọc không nói NASA, JPL, tên nhà thầu, tên tệp phần mềm: “cơ quan vũ trụ Mỹ”, “đội dẫn đường”, “đội vận hành tàu của nhà thầu”,
#   “phần mềm mặt đất tính lực nhỏ”. Không nêu tên người.
objectives:
  - "Dựng dòng thời gian từ lúc phóng tới lúc mất tín hiệu và đọc các con số cận điểm"
  - "Tính sai lệch khi đọc pound-lực giây như newton giây: hệ số 4,45, phần bị bỏ sót, vận tốc thiếu"
  - "Tính lại “thấp hơn dự kiến khoảng 170 km” từ hai con số của báo cáo"
  - "Thiết kế giao diện dữ liệu mang đơn vị để máy kiểm được"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ngày 23/9/1999: tín hiệu mất sớm 49 giây"
    checks:
      - "226 - 57 == 169"
    steps:
      - show: |
          <p>Ngày <b>23/9/1999</b>, tàu Mars Climate Orbiter bật động cơ chính để vào quỹ đạo sao Hoả. Theo kế hoạch, tàu đi ra sau sao Hoả nên tín hiệu tạm mất khoảng 21 phút; nhưng tín hiệu mất lúc 09:04:52 giờ quốc tế, <b>sớm hơn dự đoán 49 giây</b>, và không bao giờ trở lại.</p>
          <p>Theo dự kiến, điểm thấp nhất của quỹ đạo cách mặt sao Hoả <b>226 km</b>. Tính lại sau sự cố: chỉ <b>57 km</b>, trong khi tàu cần ít nhất 80 km để sống sót.</p>
          <div class="box key">Hôm nay: một tệp dữ liệu ghi xung lực theo pound-lực giây, bên đọc tưởng là newton giây — và vì sao không phép kiểm nào bắt được trong 9 tháng.</div>
        focus: [1, 1, 1, 2, 2, 3]
        say: "Chào bạn, ngày 23 tháng 9 năm 1999, tàu quỹ đạo khí hậu sao Hoả bật động cơ chính để vào quỹ đạo quanh hành tinh. Theo kế hoạch, tàu sẽ đi ra sau hành tinh nên tín hiệu tạm mất khoảng 21 phút. Nhưng tín hiệu mất lúc 9 giờ 4 phút 52 giây giờ quốc tế, sớm hơn dự đoán 49 giây, và không bao giờ trở lại. Theo báo cáo của hội đồng điều tra, điểm thấp nhất của quỹ đạo dự kiến cách mặt sao Hoả 226 ki-lô-mét. Tính lại sau sự cố, con số đó chỉ còn 57 ki-lô-mét, trong khi tàu cần ít nhất 80 ki-lô-mét để sống sót. Hôm nay ta tìm hiểu một tệp dữ liệu ghi xung lực theo đơn vị Anh, mà bên đọc tưởng là đơn vị chuẩn, và vì sao suốt 9 tháng không phép kiểm nào bắt được."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: xung lực, vận tốc và đổi đơn vị"
    checks:
      - "2 * 5 == 10 and 10 / 20 == 0.5"
      - "round(3 * 4.448, 3) == 13.344"
      - "0.4535924 * 9.80665 > 4.448 and round(0.4535924 * 9.80665, 3) == 4.448"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần dùng</th><th>ví dụ số</th></tr>
          <tr><td><b>xung lực</b> = lực nhân thời gian đẩy; đơn vị mét là newton giây</td><td>lực 2 newton đẩy trong 5 giây: xung 10 newton giây</td></tr>
          <tr><td>vận tốc thay đổi = xung lực chia khối lượng</td><td>xung 10 newton giây vào vật 20 kg: vận tốc đổi 0,5 mét mỗi giây</td></tr>
          <tr><td>đổi đơn vị: 1 pound-lực = 4,448 newton (viện tiêu chuẩn Mỹ), làm tròn 4,45</td><td>3 pound-lực giây = 3 nhân 4,448 = <b>13,344</b> newton giây</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.4", "1.4"]
        say: "Trước hết, ta ôn ba điều sẽ dùng. Xung lực là lực nhân thời gian đẩy, tính bằng đơn vị lực nhân giây, mà bài gọi gọn là đơn vị chuẩn hoặc đơn vị Anh. Theo hệ chuẩn, lực 2 đơn vị lực chuẩn đẩy trong 5 giây cho xung 10 đơn vị chuẩn. Vận tốc thay đổi bằng xung lực chia khối lượng, nên xung 10 đơn vị chuẩn đẩy vật 20 ki-lô-gam làm vận tốc đổi 0 phẩy 5 mét mỗi giây. Hệ Anh Mỹ có một đơn vị lực riêng, gọi tắt là đơn vị lực Anh, còn hệ chuẩn quốc tế có đơn vị lực chuẩn, tên đều ghi trên màn hình. Theo bảng của viện tiêu chuẩn Mỹ, 1 đơn vị lực Anh bằng 4 phẩy 448 đơn vị lực chuẩn, làm tròn là 4 phẩy 45. Vậy xung 3 đơn vị Anh bằng 3 nhân 4 phẩy 448, tức 13 phẩy 344 đơn vị chuẩn."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của báo cáo"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa trong báo cáo năm 1999</th></tr>
          <tr><td><b>đốt chỉnh động lượng</b></td><td>bật các động cơ nhỏ để xả động lượng tích trong bánh đà giữ hướng tàu</td></tr>
          <tr><td><b>tệp lực nhỏ</b></td><td>phần mềm mặt đất tính xung lực mỗi lần đốt, ghi vào một tệp cho đội dẫn đường</td></tr>
          <tr><td><b>đặc tả giao diện phần mềm</b></td><td>văn bản quy định định dạng và <b>đơn vị</b> của tệp: newton giây</td></tr>
          <tr><td><b>cận điểm</b></td><td>điểm thấp nhất của quỹ đạo quanh sao Hoả</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng có bốn thuật ngữ của báo cáo. Đốt chỉnh động lượng là bật các động cơ nhỏ để xả động lượng tích lại trong bánh đà giữ hướng tàu. Tệp lực nhỏ do phần mềm mặt đất tạo ra, ghi xung lực của mỗi lần đốt cho đội dẫn đường dùng. Đặc tả giao diện phần mềm là văn bản quy định định dạng và đơn vị của tệp đó, ở đây là đơn vị chuẩn. Cận điểm là điểm thấp nhất của quỹ đạo quanh sao Hoả."

  # ───────────────────────── 4. HÌNH CƠ CHẾ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Con số đi qua một tệp, đơn vị thì không"
    steps:
      - show: |
          <div><svg width="1640" height="400" viewBox="0 0 1640 400">
          <defs><marker id="ar3" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1f2937"/></marker></defs>
          <g font-size="23" fill="#1f2937" text-anchor="middle">
          <rect x="20" y="40" width="330" height="110" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/>
          <text x="185" y="84" font-weight="bold">phần mềm trên tàu</text><text x="185" y="122">tính theo newton giây: đúng</text>
          <rect x="20" y="230" width="330" height="110" rx="10" fill="#fde2e2" stroke="#e11d48" stroke-width="3"/>
          <text x="185" y="274" font-weight="bold">phần mềm mặt đất</text><text x="185" y="312">ghi theo pound-lực giây: sai</text>
          <rect x="560" y="230" width="380" height="110" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
          <text x="750" y="270" font-weight="bold">tệp lực nhỏ</text><text x="750" y="306">chỉ có con số: 10</text><text x="750" y="334" font-size="20" fill="#6b7280">không có chữ đơn vị nào</text>
          <rect x="1150" y="230" width="470" height="110" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/>
          <text x="1385" y="274" font-weight="bold">đội dẫn đường</text><text x="1385" y="312">đọc 10 là 10 newton giây</text>
          <line x1="350" y1="285" x2="555" y2="285" stroke="#1f2937" stroke-width="4" marker-end="url(#ar3)"/>
          <line x1="940" y1="285" x2="1145" y2="285" stroke="#1f2937" stroke-width="4" marker-end="url(#ar3)"/>
          <text x="1050" y="90" fill="#e11d48" font-weight="bold">thật: 10 pound-lực giây = 44,5 newton giây</text>
          <text x="1050" y="130" fill="#e11d48">mô hình chỉ thấy 1 phần 4,45 lực đẩy, tức khoảng 22,5%</text>
          </g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy con số đi qua một tệp, còn đơn vị thì không. Phần mềm trên tàu tính xung lực theo đơn vị chuẩn và tính đúng, nhưng phần mềm mặt đất lại ghi vào tệp theo đơn vị Anh. Tệp chỉ chứa con số, ví dụ 10, không có chữ đơn vị nào, nên đội dẫn đường đọc 10 thành 10 đơn vị chuẩn. Thật ra 10 đơn vị Anh là khoảng 44 phẩy 5 đơn vị chuẩn, nên mô hình quỹ đạo chỉ thấy khoảng 22 phẩy 5 phần trăm lực đẩy thật."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra: đọc nhầm đơn vị thì mất bao nhiêu"
    checks:
      - "round(10 * 4.448222, 2) == 44.48"
      - "round(10 / (10 * 4.448222) * 100, 1) == 22.5 and round(100 - 10 / (10 * 4.448222) * 100, 1) == 77.5"
      - "round(1 / 4.45, 3) == 0.225"
    steps:
      - show: |
          <p>Gọi x là con số ghi trong tệp. Bên ghi muốn nói x pound-lực giây; bên đọc hiểu là x newton giây.</p>
          <table class="t"><tr><th>bước</th><th>vì sao</th><th>với x = 10 (số minh hoạ)</th></tr>
          <tr><td>Bước 1. xung thật</td><td>đổi đơn vị: nhân 4,448</td><td>44,48 newton giây</td></tr>
          <tr><td>Bước 2. xung trong mô hình</td><td>bên đọc không đổi gì</td><td>10 newton giây</td></tr>
          <tr><td>Bước 3. phần mô hình thấy</td><td>chia bước 2 cho bước 1: x triệt tiêu</td><td>1 phần 4,448 ≈ <b>22,5%</b></td></tr>
          <tr><td>Bước 4. phần bị bỏ sót</td><td>100% trừ phần thấy được</td><td>khoảng $\hl{77{,}5\%}$, với <b>mọi</b> x</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bây giờ ta suy ra từng bước, gọi x là con số ghi trong tệp, bên ghi muốn nói x đơn vị Anh, còn bên đọc hiểu là x đơn vị chuẩn. Bước một, xung thật phải đổi đơn vị, nhân 4 phẩy 448, nên với x bằng 10, xung thật là 44 phẩy 48 đơn vị chuẩn. Bước hai, bên đọc không đổi gì, nên mô hình dùng 10 đơn vị chuẩn. Bước ba, chia bước hai cho bước một thì x triệt tiêu, mô hình chỉ thấy 1 phần 4 phẩy 448, khoảng 22 phẩy 5 phần trăm. Bước bốn, phần bị bỏ sót là khoảng 77 phẩy 5 phần trăm, với mọi giá trị x."
      - show: |
          <p class="note">Báo cáo viết đúng điều này: phần mềm dẫn đường đánh giá thấp tác động của các lần đốt lên quỹ đạo <b>4,45 lần</b> — “1 pound-lực = 4,45 newton”.</p>
        say: "Báo cáo của hội đồng viết đúng điều này. Phần mềm dẫn đường đã đánh giá thấp tác động của các lần đốt lên quỹ đạo 4 phẩy 45 lần, vì 1 đơn vị lực Anh bằng 4 phẩy 45 đơn vị lực chuẩn."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tái hiện bằng số: từ mỗi lần đốt tới 170 km"
    checks:
      - "round(44.48 / 629, 4) == 0.0707 and round(10 / 629, 4) == 0.0159"
      - "round((44.48 - 10) / 629, 4) == 0.0548 and round(100 * (44.48 - 10) / 629, 1) == 5.5"
      - "226 - 57 == 169 and 80 - 57 == 23"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính (khối lượng lúc phóng 629 kg, xung 10 pound-lực giây mỗi lần: số minh hoạ)</th><th>kết quả</th></tr>
          <tr><td>Bước 1. vận tốc thật đổi sau một lần đốt</td><td>44,48 chia 629</td><td>khoảng 0,0707 mét mỗi giây</td></tr>
          <tr><td>Bước 2. mô hình tưởng</td><td>10 chia 629</td><td>khoảng 0,0159 mét mỗi giây</td></tr>
          <tr><td>Bước 3. thiếu mỗi lần</td><td>0,0707 trừ 0,0159</td><td>khoảng $\hl{0{,}0548}$ mét mỗi giây</td></tr>
          <tr><td>Bước 4. sau 100 lần đốt (số minh hoạ)</td><td>100 nhân 0,0548</td><td>khoảng <b>5,5 mét mỗi giây</b> không ai thấy</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bây giờ ta tái hiện cơ chế bằng số, dùng khối lượng lúc phóng 629 ki-lô-gam trong báo cáo, và một xung minh hoạ 10 đơn vị Anh mỗi lần đốt. Bước một, vận tốc thật đổi 44 phẩy 48 chia 629, khoảng 0 phẩy 0707 mét mỗi giây. Bước hai, mô hình tưởng chỉ có 10 chia 629, khoảng 0 phẩy 0159. Bước ba, mỗi lần đốt thiếu khoảng 0 phẩy 0548 mét mỗi giây. Bước bốn, sau 100 lần đốt minh hoạ, khoảng 5 phẩy 5 mét mỗi giây vận tốc không ai thấy trong mô hình."
      - clear: true
        show: |
          <p>Vì sao số lần đốt nhiều? Báo cáo: tấm pin mặt trời <b>lệch một bên</b> thân tàu, áp suất ánh sáng làm động lượng tích nhanh, nên các lần đốt xảy ra <b>nhiều gấp 10 tới 14 lần</b> đội dẫn đường dự kiến.</p>
          <table class="t"><tr><th>cận điểm (km)</th><th>khi nào, theo báo cáo</th></tr>
          <tr><td>226</td><td>mục tiêu sau lần chỉnh quỹ đạo thứ tư, 15/9</td></tr>
          <tr><td>150–170</td><td>tuần trước khi vào quỹ đạo</td></tr>
          <tr><td>110</td><td>khoảng 1 giờ trước khi vào quỹ đạo</td></tr>
          <tr><td>$\hl{57}$</td><td>tính lại sau sự cố, với lực nhỏ đã sửa; thấp nhất tàu chịu được: 80</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Vì sao số lần đốt lại nhiều? Báo cáo ghi tấm pin mặt trời của tàu lệch về một bên thân, áp suất ánh sáng làm động lượng tích nhanh, nên các lần đốt xảy ra nhiều gấp 10 tới 14 lần dự kiến. Sau lần chỉnh quỹ đạo thứ tư ngày 15 tháng 9, cận điểm mục tiêu là 226 ki-lô-mét. Một tuần trước khi vào quỹ đạo, tính toán cho 150 tới 170, và khoảng 1 giờ trước, chỉ còn 110. Tính lại sau sự cố với lực nhỏ đã sửa, cận điểm là 57, dưới mức thấp nhất tàu chịu được là 80 ki-lô-mét."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 5. thấp hơn dự kiến bao nhiêu</td><td>226 − 57</td><td>$\hl{169}$ km — báo cáo viết “khoảng 170 km thấp hơn kế hoạch” ✓</td></tr>
          <tr><td>Bước 6. dưới ngưỡng sống sót bao nhiêu</td><td>80 − 57</td><td>23 km</td></tr>
          <tr><td>Bước 7. từ lúc bật động cơ tới lúc mất tín hiệu</td><td>09:00:46 → 09:04:52</td><td>4 phút 6 giây, sớm 49 giây so với dự đoán</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ta tính lại các con số còn lại. Bước năm, 226 trừ 57 bằng 169 ki-lô-mét, khớp câu của báo cáo, quỹ đạo thấp hơn kế hoạch khoảng 170 ki-lô-mét. Bước sáu, 80 trừ 57 bằng 23, tức thấp hơn ngưỡng sống sót 23 ki-lô-mét. Bước bảy, động cơ bật lúc 9 giờ 0 phút 46 giây, và tín hiệu mất 4 phút 6 giây sau, sớm 49 giây so với dự đoán."

  # ───────────────────────── 7. DÒNG THỜI GIAN ─────────────────────────
  - id: timeline
    kind: concept
    title: "Dòng thời gian: dấu hiệu có từ tháng 4"
    steps:
      - show: |
          <table class="t"><tr><th>thời điểm</th><th>dữ kiện trong báo cáo</th></tr>
          <tr><td>11/12/1998</td><td>phóng tàu; 4 tháng đầu, tệp lực nhỏ <b>không dùng được</b> vì lỗi định dạng; đội dẫn đường tự ước lượng theo thư điện tử báo giờ đốt</td></tr>
          <tr><td>4/1999</td><td>tệp dùng được; trong vòng một tuần đã thấy số liệu <b>đánh giá thấp</b> tác động của các lần đốt</td></tr>
          <tr><td>xuân, hè 1999</td><td>các cách tính quỹ đạo cho kết quả lệch nhau; chỉ <b>báo không chính thức</b>, không được giải quyết</td></tr>
          <tr><td>ngay trước 23/9</td><td>lần chỉnh quỹ đạo thứ năm được bàn bằng lời, <b>không thực hiện</b></td></tr>
          <tr><td>29/9/1999</td><td>phát hiện xung lực trong tệp ghi theo pound-lực giây, thấp đi 4,45 lần</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bây giờ ta đặt các dữ kiện lên dòng thời gian. Tàu được phóng ngày 11 tháng 12 năm 1998, và 4 tháng đầu, tệp lực nhỏ không dùng được vì lỗi định dạng, đội dẫn đường phải tự ước lượng theo thư điện tử báo giờ đốt. Tháng 4 năm 1999, tệp dùng được, và chỉ trong một tuần, số liệu đã cho thấy tác động của các lần đốt bị đánh giá thấp. Suốt mùa xuân và mùa hè, các cách tính quỹ đạo cho kết quả lệch nhau, nhưng chỉ được báo không chính thức. Ngay trước ngày vào quỹ đạo, lần chỉnh thứ năm được bàn bằng lời, nhưng không thực hiện. Ngày 29 tháng 9, đội mới phát hiện xung lực trong tệp ghi theo đơn vị Anh."

  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm bằng đường khác"
    checks:
      - "round(0.4535924 * 9.80665, 4) == 4.4482"
      - "abs(10 * 4.448222 / 629 - 10 / 629 * 4.448222) < 1e-12"
      - "(9 * 3600 + 4 * 60 + 52) - (9 * 3600 + 0 * 60 + 46) == 246 == 4 * 60 + 6"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>4,448</td><td>theo cùng bảng, 1 pao là 0,4535924 kg, gia tốc rơi chuẩn là 9,80665: tích hai số = 4,4482 newton ✓</td></tr>
          <tr><td>0,0707 mét mỗi giây</td><td>nhân thẳng: 0,0159 (mô hình) nhân 4,448 = 0,0707 ✓ — đúng là “thấp đi 4,45 lần”</td></tr>
          <tr><td>4 phút 6 giây</td><td>đổi ra giây từ nửa đêm: 32&nbsp;692 − 32&nbsp;446 = 246 giây = 4 phút 6 giây ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4"]
        say: "Ta kiểm lại bằng đường khác, vì mỗi con số nên có hai cách tính cho cùng kết quả. Một đơn vị lực Anh là trọng lượng của 0 phẩy 4535924 ki-lô-gam ở gia tốc chuẩn 9 phẩy 80665. Tích hai số đó là 4 phẩy 4482, khớp bảng của viện tiêu chuẩn. Vận tốc mô hình 0 phẩy 0159 nhân 4 phẩy 448 cho lại 0 phẩy 0707, đúng là thấp đi 4 phẩy 45 lần. Đổi hai mốc giờ ra số giây từ nửa đêm, 32 nghìn 692 trừ 32 nghìn 446 bằng 246 giây, tức 4 phút 6 giây."

  # ───────────────────────── 9. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Một người quên đổi đơn vị”</td><td>báo cáo: sai sót có xảy ra ở các dự án tàu vũ trụ; quy trình phải bắt được — ở đây có 8 nguyên nhân góp phần</td><td>hỏi vì sao không lớp nào bắt được, trong 9 tháng</td></tr>
          <tr><td><b class="red">2.</b> “Đặc tả đã ghi newton giây là đủ”</td><td>đặc tả giao diện <b>không được tuân theo</b>, và không có phép kiểm tự động nào đối chiếu</td><td>đơn vị nằm trong dữ liệu; máy kiểm, không chỉ người đọc</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ nhất là kết luận một người quên đổi đơn vị. Báo cáo viết sai sót có xảy ra ở các dự án tàu vũ trụ, và quy trình phải bắt được chúng, ở đây hội đồng ghi tới 8 nguyên nhân góp phần. Bài học sai thứ hai là tin rằng đặc tả đã ghi đơn vị chuẩn là đủ. Đặc tả không được tuân theo, và không có phép kiểm tự động nào đối chiếu, nên đơn vị phải nằm ngay trong dữ liệu để máy kiểm được."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Lệch nhỏ thì chưa cần giải quyết” (người đã đi làm)</td><td>các cách tính quỹ đạo lệch nhau từ mùa xuân, chỉ báo không chính thức; cách chỉ dùng độ lệch tần số tín hiệu (Doppler) luôn cho tàu đi gần hơn</td><td>mỗi chênh lệch giữa hai cách tính là một vé sự cố, có người phụ trách, tới khi giải thích được</td></tr>
          <tr><td><b class="red">4.</b> “Cứ đổi hết sang hệ mét là xong”</td><td>lần sau có thể là mét với ki-lô-mét, giây với mili giây</td><td>kiểm tuân thủ đặc tả với <b>mọi</b> dữ liệu trao đổi giữa hai đội, như hội đồng khuyến nghị</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba hay gặp ở người đã đi làm, cho rằng lệch nhỏ thì chưa cần giải quyết. Các cách tính quỹ đạo đã lệch nhau từ mùa xuân, và cách chỉ dùng độ lệch tần số tín hiệu luôn cho thấy tàu đi gần hành tinh hơn, nhưng chỉ được báo không chính thức. Bài học sai thứ tư là nghĩ cứ đổi hết sang hệ mét là xong, trong khi lần sau có thể là mét với ki-lô-mét. Hội đồng khuyến nghị kiểm tuân thủ đặc tả với mọi dữ liệu trao đổi giữa hai đội."

  # ───────────────────────── 10. MÃ MANG ĐƠN VỊ ─────────────────────────
  - id: design
    kind: concept
    title: "Thiết kế: kiểu dữ liệu mang đơn vị"
    checks:
      - "round(10 * 4.448222, 2) == 44.48 and 10 * 1 == 10"
      - "round(10 * 4.448222, 5) == 44.48222 and round(10 * 4.448222 + 10, 5) == 54.48222"
    steps:
      - show: |
          <p><b>Đóng gói</b>: giấu dữ liệu bên trong một kiểu, chỉ cho đi qua vài “cửa” (hàm) có kiểm tra, để giữ một điều <b>luôn đúng</b> — ở đây: giá trị bên trong luôn tính bằng newton giây.</p>
          <pre class="code">class XungLuc:
              def __init__(self, ns):
                  self._ns = ns          # luôn là newton giây
              def niuton_giay(self):
                  return self._ns

          def tu_niuton_giay(x):
              return XungLuc(x)

          def tu_pao_luc_giay(x):
              return XungLuc(x * 4.448222)</pre>
        focus: [1, 1, 2, 2, 2, 2]
        say: "Trước hết, ta cần hiểu đóng gói, tức là giấu dữ liệu bên trong một kiểu dữ liệu, chỉ cho đi qua vài cửa có kiểm tra, để giữ một điều luôn đúng. Ở đây điều luôn đúng là giá trị bên trong luôn tính bằng đơn vị chuẩn. Đoạn mã định nghĩa một kiểu mới tên là xung lực, cất con số trong một biến có dấu gạch dưới ở đầu tên, theo quy ước là bên ngoài không được đụng vào. Muốn tạo một xung lực chỉ có hai cửa, một hàm nhận đơn vị chuẩn, và một hàm nhận đơn vị Anh rồi nhân với 4 phẩy 448222. Bên ghi buộc phải chọn một hàm có tên đơn vị, nên không thể quên đơn vị. Tệp trao đổi cũng ghi thêm một trường đơn vị, và bên đọc từ chối tệp thiếu trường đó."
      - clear: true
        show: |
          <p>Bên ghi phải chọn <b>một hàm có tên đơn vị</b>; bên đọc chỉ nhận được newton giây. Tệp ghi thêm trường đơn vị, bên đọc từ chối tệp thiếu nó.</p>
          <table class="t"><tr><th>bước</th><th>lệnh</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tạo từ 10 pound-lực giây</td><td><code>tu_pao_luc_giay(10).niuton_giay()</code></td><td>10 nhân 4,448222 = <b>44,48222</b> newton giây</td></tr>
          <tr><td>Bước 2. tạo từ 10 newton giây</td><td><code>tu_niuton_giay(10).niuton_giay()</code></td><td><b>10</b> newton giây, giữ nguyên</td></tr>
          <tr><td>Bước 3. bên đọc cộng hai giá trị vừa lấy ra</td><td>44,48222 + 10</td><td><b>54,48222</b> newton giây — cùng một đơn vị, không thể lẫn</td></tr></table>
        focus: ["2.2", "2.3", "2.4"]
        say: "Làm thử với số, bước một, tạo từ 10 đơn vị Anh thì giá trị bên trong là 10 nhân 4 phẩy 448222, tức 44 phẩy 48222 đơn vị chuẩn. Bước hai, tạo từ 10 đơn vị chuẩn thì giá trị giữ nguyên là 10. Bước ba, bên đọc cộng hai giá trị vừa lấy ra được 54 phẩy 48222 đơn vị chuẩn, vì cả hai đã cùng một đơn vị nên không thể lẫn."

  # ───────────────────────── 11. BẠN SẼ LÀM GÌ ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì?"
    checks:
      - "round(2 * 4.448222, 2) == 8.9 and round(100 * (1 - 2 / (2 * 4.448222))) == 78"
    steps:
      - show: |
          <p>Hai đội trao đổi tệp đo lực đẩy hằng ngày (số minh hoạ). Một bản ghi có giá trị <b>2,0</b>; bên ghi dùng pound-lực giây.</p>
          <table class="t"><tr><th>câu</th><th>câu hỏi</th></tr>
          <tr><td>1</td><td>Xung thật là bao nhiêu newton giây? Nếu bên đọc hiểu là newton giây thì bỏ sót mấy phần trăm?</td></tr>
          <tr><td>2</td><td>Chọn: (a) họp lại, nhắc mọi người dùng hệ mét; (b) thêm trường đơn vị vào tệp và kiểu dữ liệu mang đơn vị; (c) như (b), cộng một phép tính độc lập so tệp với số liệu đo trên tàu. Đánh đổi là gì?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn, với số minh hoạ. Hai đội trao đổi tệp đo lực đẩy hằng ngày, một bản ghi có giá trị 2 phẩy 0, và bên ghi dùng đơn vị Anh. Câu một, xung thật là bao nhiêu đơn vị chuẩn, và nếu bên đọc hiểu là đơn vị chuẩn thì bỏ sót mấy phần trăm? Câu hai, bạn họp lại nhắc mọi người dùng hệ mét, thêm trường đơn vị cùng kiểu dữ liệu mang đơn vị, hay làm thêm một phép tính độc lập so tệp với số liệu đo trên tàu? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. xung thật</td><td>2,0 nhân 4,448</td><td>khoảng $\hl{8{,}9}$ newton giây</td></tr>
          <tr><td>Bước 2. bỏ sót</td><td>1 trừ 2 chia 8,9</td><td>khoảng <b>78%</b> — vẫn là 1 phần 4,45, như năm 1999</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Đáp án câu một, bước một, 2 phẩy 0 nhân 4 phẩy 448 là khoảng 8 phẩy 9 đơn vị chuẩn. Bước hai, bên đọc chỉ thấy 2 trên 8 phẩy 9, nên bỏ sót khoảng 78 phần trăm, vẫn đúng tỉ lệ 1 phần 4 phẩy 45 như năm 1999."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>(a) họp, nhắc nhở</td><td>không tốn công</td><td>đặc tả năm 1999 đã ghi đơn vị mà vẫn sai; nhắc nhở là “đập muỗi”: chữa lỗi của người mà không đổi điều kiện sinh ra lỗi</td></tr>
          <tr><td>(b) trường đơn vị + kiểu mang đơn vị</td><td>máy chặn được tệp sai đơn vị ngay lúc đọc</td><td>phải sửa cả hai phía, đổi định dạng tệp</td></tr>
          <tr><td>(c) (b) + phép tính độc lập</td><td>bắt cả lỗi không phải đơn vị: hệ số sai, dấu sai</td><td>tốn thêm công tính và người đọc kết quả</td></tr></table>
          <p class="note">Chọn (c) cho dữ liệu dẫn đường. Điều kiện đổi: dữ liệu không ảnh hưởng an toàn thì (b) là đủ.</p>
        focus: [1, "1.2", "1.2", "1.3", "1.4", 2]
        say: "Đáp án câu hai là một đánh đổi. Họp và nhắc nhở không tốn công, nhưng đặc tả năm 1999 đã ghi đơn vị mà vẫn sai. Đó là đập muỗi như ở bài 0, tức chữa từng lỗi của người mà không đổi điều kiện sinh ra lỗi. Thêm trường đơn vị và kiểu mang đơn vị giúp máy chặn tệp sai ngay lúc đọc, đổi lại phải sửa cả hai phía. Làm thêm phép tính độc lập bắt được cả lỗi không phải đơn vị, như hệ số sai hay dấu sai, nhưng tốn thêm công. Vậy nên chọn cách thứ ba cho dữ liệu dẫn đường, còn dữ liệu không ảnh hưởng an toàn thì cách thứ hai là đủ."

  # ───────────────────────── 12. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Thay đổi hệ thống & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">tệp chỉ chứa con số</span><span class="a">→</span>
          <span class="n">pound-lực giây đọc như newton giây: thấy 1 phần 4,45</span><span class="a">→</span>
          <span class="n">đốt nhiều gấp 10–14 lần dự kiến</span><span class="a">→</span>
          <span class="n">cận điểm 57 km thay vì 226 km</span></div>
        say: "Tổng kết lại, tệp chỉ chứa con số, nên đơn vị Anh bị đọc như đơn vị chuẩn và mô hình chỉ thấy 1 phần 4 phẩy 45 lực đẩy. Các lần đốt nhiều gấp 10 tới 14 lần dự kiến, sai số dồn lại, và cận điểm thật là 57 ki-lô-mét thay vì 226."
      - show: |
          <div class="box key"><b>Tư duy:</b> văn bản đặc tả không thay được phép kiểm. Đơn vị phải đi cùng con số tới tận chỗ dùng, và mỗi chênh lệch giữa hai cách tính phải được giải thích trước khi ra quyết định lớn.</div>
        say: "Điều cần mang theo, văn bản đặc tả không thay được phép kiểm. Đơn vị phải đi cùng con số tới tận chỗ dùng, và mỗi chênh lệch giữa hai cách tính phải được giải thích trước khi ra một quyết định lớn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): Mars Pathfinder, 1997 — đảo ngược ưu tiên giữa ba tác vụ, và một cờ cấu hình được bật từ xa.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta trở lại sao Hoả với tàu Pát-phai-đơ năm 1997, nơi ba tác vụ gặp lỗi đảo ngược ưu tiên, và một cờ cấu hình được bật từ xa để sửa. Hẹn gặp bạn ở bài tiếp theo."
