  - id: sym
    kind: symbol
    title: "Ngôn ngữ của bài hậu kiểm"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>tường lửa ứng dụng</b></td><td>lớp chặn các yêu cầu trang mạng độc hại, bằng rất nhiều <b>quy tắc</b> chứa biểu thức chính quy</td></tr>
          <tr><td><b>chế độ mô phỏng</b></td><td>quy tắc chỉ ghi lại mà không chặn — nhưng biểu thức <b>vẫn được chạy</b></td></tr>
          <tr><td><b>quy trình chuẩn</b></td><td>các bước được viết sẵn cho một loại thay đổi; với quy tắc, nó <b>cho phép</b> đẩy ra toàn cầu</td></tr>
          <tr><td><b>quay lui</b></td><td>cách khớp: thử một lựa chọn, hỏng thì quay lại thử lựa chọn khác</td></tr>
          <tr><td><b>hoàn tác</b></td><td>lùi một thay đổi về bản trước; kế hoạch hoàn tác có ghi sẵn trong phiếu thay đổi</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Tường lửa ứng dụng là lớp chặn các yêu cầu trang mạng độc hại, bằng rất nhiều quy tắc chứa biểu thức chính quy. Ở chế độ mô phỏng, quy tắc chỉ ghi lại mà không chặn, nhưng biểu thức vẫn được chạy. Quy trình chuẩn là các bước được viết sẵn cho một loại thay đổi, và với quy tắc, nó cho phép đẩy thẳng ra toàn cầu. Quay lui là cách khớp, thử một lựa chọn, hỏng thì quay lại thử lựa chọn khác. Còn hoàn tác là lùi một thay đổi về bản trước, và kế hoạch hoàn tác có ghi sẵn trong phiếu thay đổi."

