  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Thay đổi hệ thống & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">mẫu quay lui: bậc n mũ 3</span><span class="a">→</span>
          <span class="n">lớp bảo vệ bị gỡ nhầm, kiểm thử không đo bộ xử lý</span><span class="a">→</span>
          <span class="n">đẩy toàn cầu trong vài giây: 27 phút, 80%</span><span class="a">→</span>
          <span class="n">từng bậc + lối khẩn cấp đã tập + bộ máy khớp không quay lui, thời gian tăng tỉ lệ với độ dài chuỗi</span></div>
        say: "Tổng kết lại, một mẫu quay lui có số lần thử tăng theo bậc n mũ 3. Lớp bảo vệ đã bị gỡ nhầm, kiểm thử không đo bộ xử lý, và quy trình đẩy quy tắc ra toàn cầu trong vài giây. Thế là một lỗi hiệu năng thành 27 phút mất 80 phần trăm lưu lượng. Thay đổi hệ thống là triển khai từng bậc, tập lối khẩn cấp, và đổi sang bộ máy khớp có bảo đảm thời gian chạy. Bộ máy như vậy không quay lui, nên thời gian chạy chỉ tăng tỉ lệ với độ dài chuỗi, và đây là việc công ty ghi sẽ làm."
      - show: |
          <div class="box key"><b>Tư duy:</b> tốc độ triển khai là con dao hai lưỡi — nó nhân <b>cả</b> sai lầm. Nhiều lỗ hổng nhỏ cùng lúc (như một mẫu chậm và một quy trình không có bậc) mới thành sự cố lớn; sửa từng lỗ, không chỉ một.</div>
        say: "Điều cần mang theo, tốc độ triển khai là con dao hai lưỡi, vì nó nhân cả sai lầm. Phải có nhiều lỗ hổng nhỏ cùng lúc, như một mẫu chậm và một quy trình không có bậc, mới thành sự cố lớn, nên hãy sửa từng lỗ, không chỉ một."
