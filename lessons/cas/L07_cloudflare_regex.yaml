# Quy ước: giờ là giờ quốc tế (UTC) như bài hậu kiểm. “tường lửa ứng dụng” = WAF; “quy tắc” = một luật của WAF Managed Rules;
#   “quay lui” CHỈ dùng cho cách khớp biểu thức (backtracking); việc lùi một thay đổi gọi là “hoàn tác” (rollback) để khỏi lẫn.
#   “bộ đếm của bài” = tổng alg.bt_match (số lần thử đặt một ký hiệu của mẫu vào một vị trí) qua MỌI vị trí bắt đầu — đơn vị KHÁC “bước”
#   của công cụ gỡ lỗi Perl mà bài hậu kiểm dùng (23, 33, 45, 555, 4067, 5353 là CITED, không tính lại). Khớp với TOC bài 14.
#   Lời đọc không nói Cloudflare (probe p1 chưa đạt), Perl, PCRE, Lua, CPU: nói “công ty”, “mạng phân phối nội dung”, “bộ xử lý”.
#   1% lưu lượng ở bậc đầu, 50 thay đổi/tuần, 4 bậc × 15 phút: SỐ MINH HOẠ.
objectives:
  - "Dựng dòng thời gian của sự cố và tính thời gian phát hiện, chẩn đoán, tắt, bật lại"
  - "Đếm số lần thử của bộ khớp quay lui với mẫu .*.*=.* trên chuỗi dài, thấy bậc n mũ 3 khi tìm ở mọi vị trí"
  - "Giải thích vì sao quy trình đẩy quy tắc toàn cầu trong vài giây biến một lỗi hiệu năng thành sự cố toàn mạng"
  - "Quyết định khi nào triển khai từng bậc, khi nào giữ lối khẩn cấp"
