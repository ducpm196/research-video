scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một thay đổi nhỏ, 27 phút, 80% lưu lượng"
    checks:
      - "(14 * 60 + 9) - (13 * 60 + 42) == 27"
    steps:
      - show: |
          <p>Ngày 2/7/2019, theo bài hậu kiểm của <b>Cloudflare</b> (12/7/2019):</p>
          <table class="t"><tr><th>giờ quốc tế</th><th>điều đã xảy ra</th></tr>
          <tr><td>13:42</td><td>một thay đổi nhỏ của quy tắc tường lửa ứng dụng được triển khai <b>tự động</b>; mọi lõi bộ xử lý phục vụ lưu lượng trang mạng trên toàn thế giới bị vắt kiệt</td></tr>
          <tr><td>ngay sau đó</td><td>khách thấy trang lỗi 502 (máy tiếp nhận không gọi được phần xử lý phía sau); công ty mất <b>80%</b> lưu lượng</td></tr>
          <tr><td>14:09</td><td>lưu lượng và bộ xử lý trở lại bình thường: <b>27 phút</b></td></tr></table>
          <div class="box key">Bài hậu kiểm ghi: mọi bước trước khi triển khai đều làm “đúng” — có duyệt, có kiểm thử, có kế hoạch hoàn tác.</div>
        focus: [1, "2.2", "2.2", "2.3", "2.4", 3]
        say: "Chào bạn, ngày 2 tháng 7 năm 2019, một công ty mạng phân phối nội dung lớn gặp sự cố, theo bài hậu kiểm họ công bố mười ngày sau. Lúc 13 giờ 42 giờ quốc tế, một thay đổi nhỏ của quy tắc tường lửa ứng dụng được triển khai tự động. Mọi lõi bộ xử lý phục vụ lưu lượng trang mạng trên toàn thế giới bị vắt kiệt. Khách hàng thấy trang lỗi 502, tức trang báo máy tiếp nhận không gọi được phần xử lý phía sau, và công ty mất 80 phần trăm lưu lượng. Tới 14 giờ 9, mọi thứ mới trở lại bình thường, sau 27 phút. Điều đáng học là bài hậu kiểm ghi, mọi bước trước khi triển khai đều làm đúng, có duyệt, có kiểm thử, có kế hoạch hoàn tác."
      - clear: true
        show: |
          <p>Hôm nay: dòng thời gian từng phút; vì sao bộ xử lý cạn (tính lại bằng bộ đếm); và vì sao một quy tắc đi ra <b>cả thế giới</b> trong vài giây.</p>
        say: "Hôm nay ta dựng dòng thời gian từng phút, và tính lại vì sao bộ xử lý cạn bằng một bộ đếm. Ta cũng tìm hiểu vì sao một quy tắc lại đi ra cả thế giới chỉ trong vài giây."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: biểu thức chính quy, phát hành tiệm tiến, bậc tăng"
    checks:
      - "all(__import__('re').fullmatch('x.', s) for s in ('xa', 'x=')) and __import__('re').fullmatch('x.', 'x') is None"
      - "alg.regex_lang('.*=.*', 'x=', 2) == {'=', 'x=', '=x', '=='}"
      - "2 ** 2 == 4 and 2 ** 3 == 8 and 10 ** 3 == 1000 and 20 ** 3 == 8000"
      - "round(100 * 0.01) == 1"
    steps:
      - show: |
          <p><b>Biểu thức chính quy</b>: một mẫu ngắn mô tả những chuỗi ký tự được chấp nhận; máy dùng nó để tìm hay lọc chữ.</p>
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td><code>.</code> (dấu chấm)</td><td>đúng <b>một</b> ký tự bất kỳ</td><td><code>x.</code> khớp xa, x=; không khớp x</td></tr>
          <tr><td><code>*</code> (dấu sao) sau một ký hiệu</td><td>ký hiệu đó lặp 0, 1, 2… lần; nên <code>.*</code> là <b>bao nhiêu ký tự bất kỳ cũng được</b>, kể cả không có</td><td><code>.*=.*</code>: chuỗi có ít nhất một dấu bằng; trong các chuỗi dài tới 2 ký tự x và =, khớp đúng =, x=, =x, ==</td></tr>
          <tr><td>vì sao có thể chậm</td><td>một chuỗi chia cho các <code>.*</code> được theo nhiều cách; bộ khớp kiểu quay lui thử lần lượt từng cách</td><td>phần suy ra sẽ đếm</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", "2.4"]
        say: "Trước hết, ta cần hiểu biểu thức chính quy, tức một mẫu ngắn mô tả những chuỗi ký tự được chấp nhận, mà máy dùng để tìm hay lọc chữ. Trong mẫu, dấu chấm khớp đúng một ký tự bất kỳ, nên mẫu x chấm khớp x a hay x bằng, nhưng không khớp một chữ x đứng một mình. Dấu sao đặt sau một ký hiệu cho phép ký hiệu đó lặp không, một, hay nhiều lần, nên chấm sao là bao nhiêu ký tự bất kỳ cũng được, kể cả không có. Vì vậy mẫu chấm sao, dấu bằng, chấm sao khớp mọi chuỗi có ít nhất một dấu bằng, như dấu bằng, x bằng, bằng x, và hai dấu bằng. Một chuỗi có thể chia cho các chấm sao theo nhiều cách, và bộ khớp kiểu quay lui thử lần lượt từng cách, nên có thể rất chậm."
      - clear: true
        show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>phát hành tiệm tiến</b>: đưa bản mới tới một phần nhỏ người dùng trước, theo dõi, ổn rồi mới mở rộng; có lỗi thì dừng</td><td>lỗi lộ ra khi mới chạm ít người, chưa chạm tất cả</td><td>đưa tới 1% trước: lỗi chỉ chạm 1 trong 100 người dùng</td></tr>
          <tr><td><b>bậc tăng</b>: số bước tăng nhanh thế nào khi n tăng</td><td>gấp đôi n thì n bình phương gấp 2 mũ 2 = 4, n mũ 3 gấp 2 mũ 3 = 8</td><td>n = 10: n mũ 3 là 1000; n = 20: 8000, gấp 8</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Phát hành tiệm tiến là đưa bản mới tới một phần nhỏ người dùng trước, theo dõi, ổn rồi mới mở rộng, còn có lỗi thì dừng lại. Nhờ vậy lỗi lộ ra khi mới chạm ít người, như đưa tới 1 phần trăm trước thì lỗi chỉ chạm 1 trong 100 người dùng. Bậc tăng cho biết số bước tăng nhanh thế nào khi n tăng, và gấp đôi n thì n bình phương gấp 4, còn n mũ 3 gấp 8. Ví dụ 10 mũ 3 là 1000, còn 20 mũ 3 là 8000, đúng gấp 8 lần."

