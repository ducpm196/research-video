  # ───────────────────────── 5. VÍ DỤ: DÒNG THỜI GIAN ─────────────────────────
  - id: example
    kind: example
    title: "Dòng thời gian từng phút, tính lại từng khoảng"
    checks:
      - "(14 * 60 + 9) - (13 * 60 + 42) == 27 and (13 * 60 + 45) - (13 * 60 + 42) == 3"
      - "(14 * 60) - (13 * 60 + 42) == 18 and (14 * 60 + 7) - (14 * 60 + 2) == 5"
      - "(14 * 60 + 52) - (14 * 60 + 9) == 43 and (13 * 60 + 42) - (13 * 60 + 31) == 11"
      - "(lambda f: [f(10), f(20), f(100), f(200)])(lambda n: sum(alg.bt_match('.*.*=.*', 'x' * (n - k))[1] for k in range(n + 1))) == [638, 3773, 358853, 2767703]"
      - "round(2767703 / 358853, 1) == 7.7 and not alg.bt_match('.*.*=.*', 'x' * 20)[0]"
    steps:
      - show: |
          <table class="t"><tr><th>giờ</th><th>bài hậu kiểm ghi</th></tr>
          <tr><td>13:31 → 13:37</td><td>thay đổi được duyệt và gộp; hệ thống dựng chạy kiểm thử: <b>qua</b></td></tr>
          <tr><td>13:42</td><td>triển khai tự động ra toàn cầu</td></tr>
          <tr><td>13:45</td><td>cảnh báo đầu tiên: phép thử từ bên ngoài báo tường lửa hỏng</td></tr>
          <tr><td>14:00</td><td>xác định thủ phạm là tường lửa ứng dụng, loại khả năng bị tấn công</td></tr>
          <tr><td>14:02 → 14:07</td><td>đề xuất tắt tường lửa trên toàn cầu; mất 5 phút mới làm được vì <b>không vào được hệ thống nội bộ</b></td></tr>
          <tr><td>14:09 → 14:52</td><td>trở lại bình thường; thử lại ở <b>một thành phố</b>, rồi bật lại toàn cầu</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6", "1.6", "1.7"]
        say: "Đây là dòng thời gian theo bài hậu kiểm. Từ 13 giờ 31 tới 13 giờ 37, thay đổi được duyệt, được gộp, và hệ thống dựng chạy kiểm thử, kết quả là qua. Lúc 13 giờ 42, thay đổi tự động đi ra toàn cầu. Ba phút sau, cảnh báo đầu tiên kêu, từ một phép thử bên ngoài. Lúc 14 giờ, đội xác định thủ phạm là tường lửa ứng dụng, và loại khả năng bị tấn công. Lúc 14 giờ 2, họ đề xuất tắt tường lửa trên toàn cầu, nhưng mất 5 phút mới làm được, vì không vào được hệ thống nội bộ của chính mình. Mọi thứ trở lại bình thường lúc 14 giờ 9, rồi họ thử lại ở một thành phố trước khi bật lại toàn cầu lúc 14 giờ 52."
      - clear: true
