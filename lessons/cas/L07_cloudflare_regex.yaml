  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm bằng đường khác: đếm tay chuỗi ngắn, đếm phút theo giờ tròn"
    checks:
      - "[alg.bt_match('.*.*=.*', 'x' * m)[1] for m in range(3)] == [3, 8, 15] and 3 + 8 + 15 == 26"
      - "sum(alg.bt_match('.*.*=.*', 'x' * (2 - k))[1] for k in range(3)) == 26"
      - "(60 - 42) + 9 == 27"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>cách đếm “mọi vị trí”</td><td>chuỗi xx: bắt đầu ở vị trí 0 còn xx (15 lần thử), vị trí 1 còn x (8), vị trí 2 còn chuỗi rỗng (3): 15 + 8 + 3 = <b>26</b> = đúng tổng của bộ đếm ✓</td></tr>
          <tr><td>bậc n mũ 3</td><td>(200 chia 100) mũ 3 = 8; số đo 7,7 tiến dần về 8 khi n lớn ✓</td></tr>
          <tr><td>27 phút</td><td>13:42 → 14:00 là 18 phút, thêm 9 phút tới 14:09: 18 + 9 = 27 ✓</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Ta kiểm lại bằng đường khác. Với chuỗi chỉ có hai chữ x, bắt đầu ở vị trí 0 tốn 15 lần thử, ở vị trí 1 còn một chữ x tốn 8, ở vị trí 2 còn chuỗi rỗng tốn 3. Cộng lại 15 cộng 8 cộng 3 là 26, đúng tổng mà bộ đếm cho, nên cách đếm mọi vị trí là đúng. Về bậc tăng, 200 chia 100 rồi mũ 3 là 8, và số đo 7 phẩy 7 tiến dần về 8 khi n lớn. Cuối cùng, 13 giờ 42 tới 14 giờ là 18 phút, thêm 9 phút tới 14 giờ 9, đúng 27 phút."

  # ───────────────────────── 7. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Lỗi của người viết biểu thức”</td><td>bài hậu kiểm ghi <b>11</b> nguyên nhân góp phần, trong đó lớp bảo vệ chống biểu thức ăn quá nhiều bộ xử lý đã bị gỡ <b>nhầm</b> vài tuần trước</td><td>sửa hệ thống: đưa lớp bảo vệ trở lại, rà tay cả 3868 quy tắc</td></tr>
          <tr><td><b class="red">2.</b> “Chế độ mô phỏng thì vô hại”</td><td>mô phỏng chỉ bỏ việc chặn; biểu thức <b>vẫn chạy</b> trên mọi yêu cầu</td><td>coi mọi thay đổi có chạy mã là thay đổi thật</td></tr>
          <tr><td><b class="red">3.</b> “Kiểm thử qua là an toàn”</td><td>bộ kiểm thử chỉ xét chặn đúng, chặn nhầm; <b>không đo</b> bộ xử lý</td><td>đo hiệu năng của mọi quy tắc trong bộ kiểm thử</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Bài học sai thứ nhất là kết luận đây là lỗi của người viết biểu thức. Bài hậu kiểm ghi 11 nguyên nhân góp phần, trong đó có một lớp bảo vệ chống biểu thức ăn quá nhiều bộ xử lý, đã bị gỡ nhầm khi viết lại mã vài tuần trước. Vì thế việc sửa ở mức hệ thống là đưa lớp bảo vệ trở lại, và rà tay cả 3868 quy tắc. Bài học sai thứ hai là nghĩ chế độ mô phỏng thì vô hại, trong khi nó chỉ bỏ việc chặn, còn biểu thức vẫn chạy trên mọi yêu cầu. Hãy coi mọi thay đổi có chạy mã là thay đổi thật. Bài học sai thứ ba là nghĩ kiểm thử qua là an toàn. Bộ kiểm thử chỉ xét chặn đúng hay chặn nhầm mà không đo bộ xử lý, nên phải thêm phép đo hiệu năng cho mọi quy tắc."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">4.</b> “Đã ghi kế hoạch hoàn tác là đủ” (người đã đi làm)</td><td>kế hoạch hoàn tác phải chạy trọn bản dựng tường lửa <b>hai lần</b>, quá lâu; lối vào dự phòng ít được tập; một số người mất quyền vì thông tin đăng nhập hết hạn</td><td>tập cả lối khẩn cấp: tắt toàn cầu, lối vào dự phòng, tài khoản trực</td></tr>
          <tr><td><b class="red">5.</b> “Đẩy toàn cầu trong vài giây là ưu điểm thuần”</td><td>nhanh cả khi <b>sai</b>: 27 phút, cả mạng</td><td>quy tắc thường đi từng bậc như phần mềm; <b>giữ</b> lối đẩy toàn cầu cho tấn công đang diễn ra</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ tư hay gặp ở người đã đi làm, nghĩ rằng đã ghi kế hoạch hoàn tác là đủ. Kế hoạch đó phải chạy trọn bản dựng tường lửa hai lần, quá lâu, lối vào dự phòng ít được tập, và một số người mất quyền vì thông tin đăng nhập đã hết hạn. Vậy phải tập cả lối khẩn cấp, như lệnh tắt toàn cầu, lối vào dự phòng, và tài khoản của người trực. Bài học sai thứ năm là coi đẩy toàn cầu trong vài giây là ưu điểm thuần, trong khi nó nhanh cả khi sai. Việc cần làm công ty ghi sau sự cố là cho quy tắc thường đi từng bậc như phần mềm, nhưng vẫn giữ lối đẩy toàn cầu cho tấn công đang diễn ra."

  # ───────────────────────── 8. BẠN SẼ LÀM GÌ ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì?"
    checks:
      - "4 * 15 == 60 and 4 * 15 // 60 == 1"
      - "round(0.8 * 27, 1) == 21.6 and round(0.01 * (3 + 5), 2) == 0.08"
      - "round(21.6 / 0.08) == 270"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ)</th></tr>
          <tr><td>1</td><td>Hệ của bạn đẩy cấu hình chặn tấn công ra toàn cầu trong 3 giây. Có đề xuất bắt <b>mọi</b> thay đổi qua 4 bậc, mỗi bậc 15 phút. Nhận hay không?</td></tr>
          <tr><td>2</td><td>Nếu bậc đầu chỉ có <b>1%</b> lưu lượng, và lỗi được phát hiện, tắt trong 3 + 5 phút như sự cố này, thì thiệt hại so với cả mạng mất 80% trong 27 phút nhỏ đi bao nhiêu lần? Đo thiệt hại bằng phần lưu lượng nhân số phút.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với số minh hoạ. Câu một, hệ của bạn đẩy cấu hình chặn tấn công ra toàn cầu trong 3 giây, và có đề xuất bắt mọi thay đổi qua 4 bậc, mỗi bậc 15 phút, bạn nhận hay không? Câu hai, giả sử bậc đầu chỉ có 1 phần trăm lưu lượng, và lỗi được phát hiện rồi tắt trong 3 cộng 5 phút như sự cố này. So với cả mạng mất 80 phần trăm trong 27 phút, thiệt hại nhỏ đi bao nhiêu lần? Hãy đo thiệt hại bằng phần lưu lượng nhân số phút. Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>mọi thay đổi qua 4 bậc</td><td>lỗi như sự cố này chỉ chạm bậc đầu</td><td>4 nhân 15 = <b>60 phút</b> mới tới toàn cầu — quá chậm khi đang bị tấn công</td></tr>
          <tr><td><b>từng bậc cho thay đổi thường</b>, lối khẩn cấp cho tấn công đang diễn ra</td><td>giữ cả an toàn lẫn tốc độ khi thật cần</td><td>phải định nghĩa rõ “khẩn cấp”, và tập lối đó định kỳ</td></tr></table>
          <p class="note">Đây cũng đúng là việc công ty ghi sẽ làm sau sự cố. Điều kiện đổi: nếu gần như mọi thay đổi đều “khẩn cấp”, lối khẩn cấp đã thành lối thường — phải xem lại.</p>
        focus: [1, "1.2", "1.3", "1.3", 2]
        say: "Đáp án câu một là một đánh đổi. Bắt mọi thay đổi qua 4 bậc thì một lỗi như sự cố này chỉ chạm bậc đầu, nhưng 4 nhân 15 là 60 phút mới tới toàn cầu, quá chậm khi đang bị tấn công. Chọn từng bậc cho thay đổi thường, và giữ lối khẩn cấp cho tấn công đang diễn ra, thì giữ được cả hai. Đổi lại phải định nghĩa rõ thế nào là khẩn cấp và tập lối đó định kỳ. Đây cũng đúng là việc công ty ghi sẽ làm sau sự cố, và nếu gần như mọi thay đổi đều khẩn cấp thì phải xem lại quy trình."
      - clear: true
