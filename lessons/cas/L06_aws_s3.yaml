scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một tham số nhập sai, bốn giờ mười bảy phút"
    checks:
      - "(13 * 60 + 54) - (9 * 60 + 37) == 4 * 60 + 17"
    steps:
      - show: |
          <p>Sáng 28/2/2017, vùng Bắc Virginia của kho lưu trữ đối tượng <b>Amazon S3</b> (đối tượng: tệp dữ liệu khách gửi lên, như ảnh, bản sao lưu), theo bài tổng kết của AWS:</p>
          <table class="t"><tr><th>giờ Thái Bình Dương</th><th>điều đã xảy ra</th></tr>
          <tr><td>9:37</td><td>một thành viên được phép của đội chạy lệnh theo <b>kịch bản vận hành</b> có sẵn, định gỡ <b>một số ít</b> máy; một tham số <b>nhập sai</b>, gỡ nhiều máy hơn dự định</td></tr>
          <tr><td>sau đó</td><td>hai hệ con phải <b>khởi động lại toàn bộ</b>; trong lúc đó kho không phục vụ được yêu cầu nào</td></tr>
          <tr><td>13:54</td><td>kho chạy bình thường trở lại: <b>4 giờ 17 phút</b></td></tr></table>
        focus: [1, 1, "2.2", "2.2", "2.3", "2.4"]
        say: "Chào bạn, sáng ngày 28 tháng 2 năm 2017, kho lưu trữ đối tượng của Amazon ở một vùng phía đông nước Mỹ ngừng phục vụ. Đối tượng ở đây là các tệp dữ liệu khách gửi lên, như ảnh hay bản sao lưu. Lúc 9 giờ 37, một thành viên được phép của đội chạy một lệnh theo kịch bản vận hành có sẵn, định gỡ một số ít máy. Một tham số của lệnh bị nhập sai, nên nhiều máy hơn dự định bị gỡ. Hai hệ con phải khởi động lại toàn bộ, và trong lúc đó kho không phục vụ được yêu cầu nào. Tới 1 giờ 54 chiều, kho mới chạy bình thường, sau 4 giờ 17 phút."
      - show: |
          <div class="box key">Hôm nay: tính lại từng chặng khôi phục; tìm lớp phòng vệ đã thiếu ở <b>công cụ</b>, ở <b>thiết kế</b> và ở <b>trang báo tình trạng</b>; rồi tự thiết kế một công cụ gỡ máy an toàn.</div>
        say: "Hôm nay ta tính lại từng chặng khôi phục, tìm lớp phòng vệ đã thiếu ở công cụ, ở thiết kế, và ở trang báo tình trạng dịch vụ. Cuối bài, bạn sẽ tự thiết kế một công cụ gỡ máy an toàn hơn."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: đổi giờ, khoảng thời gian, dự phòng và miền lỗi"
    checks:
      - "1 + 12 == 13 and 12 + 0 == 12"
      - "(13 * 60 + 54) - (9 * 60 + 37) == 257 and 257 == 4 * 60 + 17"
      - "0.99 * 0.99 < 0.99 and round(0.01 * 0.01, 4) == 0.0001"
      - "round(0.01 / (0.01 * 0.01)) == 100"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần nhớ</th><th>ví dụ số</th></tr>
          <tr><td>giờ có “sáng / chiều” đổi sang 24 giờ: buổi chiều cộng 12 (trừ 12 giờ trưa)</td><td>1:54 chiều = 13:54; 12:26 trưa giữ nguyên 12:26</td></tr>
          <tr><td>khoảng thời gian: đổi cả hai mốc ra phút, rồi trừ</td><td>13:54 là 834 phút, 9:37 là 577 phút: 834 − 577 = <b>257 phút</b> = 4 giờ 17 phút</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Trước hết, ta cần ba điều, là cách đổi giờ, cách tính khoảng thời gian, và vì sao dự phòng có lúc vô ích. Giờ có sáng và chiều đổi sang cách đếm 24 giờ bằng cách cộng 12 cho buổi chiều, nên 1 giờ 54 chiều là 13 giờ 54, còn 12 giờ 26 trưa giữ nguyên. Muốn tính khoảng thời gian, ta đổi cả hai mốc ra phút kể từ nửa đêm rồi trừ. 13 giờ 54 là 834 phút, 9 giờ 37 là 577 phút, hiệu là 257 phút, tức 4 giờ 17 phút."
      - clear: true
        show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>dự phòng</b>: có thêm bản sao của một thành phần, để bản này hỏng thì bản kia gánh</td><td>thành phần nào rồi cũng có lúc hỏng</td><td>hai máy cùng chạy một dịch vụ</td></tr>
          <tr><td><b>miền lỗi</b>: nhóm thành phần cùng hỏng khi một thứ chung của chúng hỏng</td><td>hai bản sao chung một miền lỗi thì hỏng <b>cùng lúc</b>: dự phòng mất tác dụng</td><td>độc lập, mỗi máy hỏng 1%: cùng hỏng 0,01 nhân 0,01 = <b>0,01%</b>; chung một tủ điện hỏng 1%: cùng tắt ít nhất <b>1%</b>, gấp 100 lần</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Dự phòng là có thêm bản sao của một thành phần, để bản này hỏng thì bản kia gánh, vì thành phần nào rồi cũng có lúc hỏng. Ví dụ đơn giản nhất là hai máy cùng chạy một dịch vụ. Miền lỗi là nhóm thành phần cùng hỏng khi một thứ chung của chúng hỏng, nên hai bản sao chung một miền lỗi sẽ hỏng cùng lúc. Hai máy độc lập, mỗi máy hỏng 1 phần trăm, thì cùng hỏng là 0 phẩy 01 nhân 0 phẩy 01, chỉ 0 phẩy 01 phần trăm. Nhưng nếu cả hai cắm chung một tủ điện có khả năng hỏng 1 phần trăm, thì khả năng cùng tắt ít nhất là 1 phần trăm, gấp 100 lần."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của bài tổng kết"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa trong sự cố này</th></tr>
          <tr><td><b>hệ con chỉ mục</b></td><td>giữ siêu dữ liệu (dữ liệu mô tả đối tượng: tên, kích thước…) và <b>vị trí</b> của mọi đối tượng trong vùng; cần cho mọi yêu cầu đọc, liệt kê, ghi, xoá</td></tr>
          <tr><td><b>hệ con cấp chỗ</b></td><td>cấp chỗ lưu cho đối tượng <b>mới</b> khi ghi; chỉ chạy đúng khi hệ con chỉ mục chạy</td></tr>
          <tr><td><b>kịch bản vận hành</b></td><td>các bước đã viết sẵn cho một thao tác thường làm, như gỡ máy</td></tr>
          <tr><td><b>mức dung lượng tối thiểu</b></td><td>số máy ít nhất mà một hệ con cần để còn phục vụ được</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng đầu có bốn thuật ngữ. Hệ con chỉ mục giữ siêu dữ liệu, tức dữ liệu mô tả đối tượng như tên và kích thước, cùng vị trí của mọi đối tượng trong vùng. Mọi yêu cầu đọc, liệt kê, ghi hay xoá đều cần hệ con này. Hệ con cấp chỗ cấp chỗ lưu cho đối tượng mới khi ghi, và chỉ chạy đúng khi hệ con chỉ mục đang chạy. Kịch bản vận hành là các bước đã viết sẵn cho một thao tác thường làm, như gỡ máy. Mức dung lượng tối thiểu là số máy ít nhất mà một hệ con cần để còn phục vụ được."
      - clear: true
        show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>khởi động lại toàn bộ</b></td><td>dừng và dựng lại cả hệ con, kèm kiểm tính toàn vẹn của siêu dữ liệu — khác thay vài máy hỏng</td></tr>
          <tr><td><b>ô</b></td><td>một phần nhỏ, độc lập của dịch vụ; hỏng một ô chỉ ảnh hưởng phần của ô đó</td></tr>
          <tr><td><b>phụ thuộc vòng</b></td><td>công cụ dùng để báo hay sửa sự cố lại cần chính hệ thống đang hỏng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng thứ hai có thêm ba thuật ngữ. Khởi động lại toàn bộ là dừng và dựng lại cả hệ con, kèm kiểm tính toàn vẹn của siêu dữ liệu, rất khác việc thay vài máy hỏng. Ô là một phần nhỏ và độc lập của dịch vụ, hỏng một ô chỉ ảnh hưởng phần của ô đó. Phụ thuộc vòng là khi công cụ dùng để báo hay sửa sự cố lại cần chính hệ thống đang hỏng."

