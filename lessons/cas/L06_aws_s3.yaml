  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm bằng đường khác: cộng dồn, liệt kê mọi lệnh"
    checks:
      - "(60 - 37) + 3 * 60 + 54 == 257 and (60 - 37) + 2 * 60 + 26 == 169"
      - "sum(1 for k in range(101) if 100 - k >= 70) == 31 and max(k for k in range(101) if 100 - k >= 70) == 30"
      - "-(-30 // 5) * 10 == 60 and -(-4 // 5) * 10 == 10"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>257 phút</td><td>cộng dồn: 9:37 → 10:00 là 23 phút, thêm 3 giờ tới 13:00, thêm 54 phút: 23 + 180 + 54 = 257 ✓</td></tr>
          <tr><td>169 phút</td><td>cộng dồn: 23 + 2 giờ + 26 = 23 + 120 + 26 = 169 ✓</td></tr>
          <tr><td>tối đa 30 máy</td><td>thử hết mọi lệnh gỡ từ 0 tới 100 máy: đúng 31 lệnh được chấp nhận, là 0, 1, … 30 ✓</td></tr>
          <tr><td>60 phút</td><td>đếm lượt: lượt 1 xong 5, lượt 2 xong 10, … lượt 6 xong 30 — 6 lượt nhân 10 phút ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bằng đường khác. Cộng dồn, 9 giờ 37 tới 10 giờ là 23 phút, thêm 3 giờ tới 13 giờ, thêm 54 phút, nên tổng là 257 phút. Cũng cộng dồn như vậy, 23 cộng 120 cộng 26 ra 169 phút. Với phép chặn, ta thử hết mọi lệnh gỡ từ 0 tới 100 máy, và đúng 31 lệnh được chấp nhận, là từ 0 tới 30. Với gỡ chậm, ta đếm lượt, vì mỗi lượt 5 máy nên lượt sáu xong 30 máy, tức 6 lượt nhân 10 phút."

  # ───────────────────────── 7. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    checks:
      - "(11 * 60 + 37) - (9 * 60 + 37) == 120"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Lỗi gõ phím của một người”</td><td>người đó được phép, theo kịch bản có sẵn; ai gõ sai tham số cũng gây đúng hậu quả này</td><td>gõ sai là <b>lỗi chủ động</b> (thao tác sai của người đang vận hành); công cụ cho gỡ quá nhiều quá nhanh là <b>điều kiện tiềm ẩn</b> (quyết định thiết kế nằm chờ từ trước)</td></tr>
          <tr><td><b class="red">2.</b> “Dặn đọc lại tham số hai lần”</td><td>dặn dò là “đập muỗi”: chữa lỗi của người, để nguyên điều kiện sinh ra lỗi</td><td>AWS sửa <b>công cụ</b>: gỡ chậm hơn, chặn dưới mức tối thiểu, rà mọi công cụ vận hành khác</td></tr>
          <tr><td><b class="red">3.</b> “Hệ chịu được mất máy, nên an toàn”</td><td>chịu mất máy khác với <b>khởi động lại toàn bộ</b> — việc nhiều năm chưa làm ở quy mô thật</td><td>diễn tập khôi phục ở quy mô thật; chia nhỏ thành ô để khôi phục từng phần</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Bài học sai thứ nhất là kết luận đây là lỗi gõ phím của một người. Người đó được phép và làm theo kịch bản có sẵn, ai gõ sai tham số cũng gây đúng hậu quả này. Gõ sai là lỗi chủ động, tức thao tác sai của người đang vận hành. Còn công cụ cho gỡ quá nhiều quá nhanh là điều kiện tiềm ẩn, một quyết định thiết kế đã nằm chờ từ trước. Bài học sai thứ hai là dặn mọi người đọc lại tham số hai lần, đó chỉ là đập muỗi, để nguyên điều kiện sinh ra lỗi. Amazon đã sửa chính công cụ, cho gỡ chậm hơn, chặn khi xuống dưới mức tối thiểu, và rà mọi công cụ vận hành khác. Bài học sai thứ ba là nghĩ hệ chịu được mất máy nên an toàn. Chịu mất máy khác hẳn khởi động lại toàn bộ, việc đã nhiều năm chưa làm ở quy mô thật."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">4.</b> “Trang báo tình trạng đặt cạnh dịch vụ cho tiện” (người đã đi làm)</td><td>phụ thuộc vòng: trang cần chính kho đang hỏng, nên <b>120 phút</b> đầu không cập nhật được từng dịch vụ</td><td>như AWS đã sửa: chạy phần quản trị của trang trên <b>nhiều vùng</b>; công cụ chữa cháy không được dựa vào thứ đang cháy</td></tr></table>
        focus: ["1.2", "1.2", "1.2"]
        say: "Bài học sai thứ tư hay gặp ở người đã đi làm, đặt trang báo tình trạng ngay cạnh dịch vụ cho tiện. Đó là phụ thuộc vòng, trang cần chính kho đang hỏng, nên suốt 120 phút đầu không cập nhật được từng dịch vụ, và đội phải báo tin qua mạng xã hội. Cách Amazon đã sửa là chạy phần quản trị của trang trên nhiều vùng, vì công cụ chữa cháy không được dựa vào thứ đang cháy."

  # ───────────────────────── 8. BẠN SẼ LÀM GÌ ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì?"
    checks:
      - "200 - 60 < 150 and 200 - 150 == 50"
      - "round(1 / 12 * 100, 1) == 8.3 and round(1 / 1 * 100) == 100"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ)</th></tr>
          <tr><td>1</td><td>Bạn viết công cụ gỡ máy cho một cụm <b>200</b> máy, cần tối thiểu <b>150</b>. Một lệnh yêu cầu gỡ <b>60</b>. Công cụ nên từ chối cả lệnh, hay gỡ phần được phép?</td></tr>
          <tr><td>2</td><td>Hệ con chỉ mục đang là <b>một khối</b>. Có nên chia thành <b>12 ô</b> độc lập không? Một lỗi làm sập một ô thì bao nhiêu phần trăm đối tượng bị ảnh hưởng?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với số minh hoạ. Câu một, bạn viết công cụ gỡ máy cho một cụm 200 máy, cần tối thiểu 150, và một lệnh yêu cầu gỡ 60, vậy công cụ nên từ chối cả lệnh hay gỡ phần được phép? Câu hai, hệ con chỉ mục đang là một khối, có nên chia thành 12 ô độc lập không, và một lỗi làm sập một ô thì bao nhiêu phần trăm đối tượng bị ảnh hưởng? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>gỡ phần được phép: 200 − 150 = 50 máy</td><td>người vận hành có ngay một phần việc</td><td>nếu 60 là con số <b>gõ sai</b>, công cụ vẫn làm một việc không ai định</td></tr>
          <tr><td><b>từ chối cả lệnh</b>, báo rõ “tối đa 50”</td><td>tham số sai bị chặn trọn; người gõ phải nhìn lại con số</td><td>mất thêm một lần gõ lệnh khi con số là đúng</td></tr></table>
          <p class="note">Chọn từ chối cả lệnh. Điều kiện đổi: chỉ tự gỡ phần được phép khi lệnh đến từ một hệ tự động đã kiểm, không phải từ người gõ tay.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu một là một đánh đổi. Gỡ phần được phép, 200 trừ 150 là 50 máy, cho người vận hành ngay một phần việc, nhưng nếu 60 là con số gõ sai thì công cụ vẫn làm một việc không ai định. Từ chối cả lệnh và báo rõ tối đa 50 thì chặn trọn tham số sai, đổi lại mất thêm một lần gõ khi con số là đúng. Vậy nên chọn từ chối cả lệnh, và chỉ tự gỡ phần được phép khi lệnh đến từ một hệ tự động đã kiểm."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>một lỗi làm sập một phần</th><th>đánh đổi</th></tr>
          <tr><td>một khối</td><td>$\hl{100\%}$ đối tượng bị ảnh hưởng; khởi động lại cả khối khổng lồ</td><td>đơn giản, ít thành phần</td></tr>
          <tr><td>12 ô độc lập</td><td>1 chia 12 ≈ $\hlg{8{,}3\%}$; mỗi ô nhỏ nên thử khôi phục được thường xuyên</td><td>thêm tầng định tuyến tới đúng ô; nhiều thứ phải theo dõi hơn</td></tr></table>
          <p class="note">Chia ô — đúng hướng AWS đã ghi: chia nhỏ để giảm phạm vi ảnh hưởng và thử kỹ việc khôi phục. Điều kiện đổi: hệ còn nhỏ, khởi động lại toàn bộ đã tập được thường xuyên.</p>
        focus: [1, "1.2", "1.3", "1.3", 2]
        say: "Đáp án câu hai cũng là một đánh đổi. Một khối thì một lỗi ảnh hưởng 100 phần trăm đối tượng và phải khởi động lại cả khối khổng lồ, đổi lại đơn giản và ít thành phần. Chia 12 ô thì một ô sập chỉ ảnh hưởng 1 phần 12, khoảng 8 phẩy 3 phần trăm, và mỗi ô đủ nhỏ để thử khôi phục thường xuyên. Đổi lại cần thêm tầng định tuyến và nhiều thứ phải theo dõi hơn. Nên chia ô, đúng hướng Amazon đã ghi, và chỉ giữ một khối khi hệ còn nhỏ, việc khởi động lại toàn bộ đã được tập thường xuyên."

