  # ───────────────────────── 5. VÍ DỤ: DÒNG THỜI GIAN KHÔI PHỤC ─────────────────────────
  - id: example
    kind: example
    title: "Tính lại từng chặng khôi phục"
    checks:
      - "(12 * 60 + 26) - (9 * 60 + 37) == 169 and 169 == 2 * 60 + 49"
      - "(13 * 60 + 18) - (9 * 60 + 37) == 221 and 221 == 3 * 60 + 41"
      - "(13 * 60 + 54) - (9 * 60 + 37) == 257 and (13 * 60 + 54) - (13 * 60 + 18) == 36"
      - "(11 * 60 + 37) - (9 * 60 + 37) == 120"
    steps:
      - show: |
          <table class="t"><tr><th>giờ</th><th>bài tổng kết ghi</th></tr>
          <tr><td>9:37</td><td>lệnh gỡ máy chạy; kho ngừng phục vụ</td></tr>
          <tr><td>11:37</td><td>tới lúc này mới cập nhật được từng dịch vụ trên trang báo tình trạng</td></tr>
          <tr><td>12:26</td><td>hệ con chỉ mục đủ sức để <b>bắt đầu</b> phục vụ đọc, liệt kê, xoá</td></tr>
          <tr><td>13:18</td><td>hệ con chỉ mục khôi phục <b>đầy đủ</b></td></tr>
          <tr><td>13:54</td><td>hệ con cấp chỗ — bắt đầu khôi phục khi chỉ mục chạy được — <b>xong</b>; ghi chạy lại, kho bình thường</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Đây là dòng thời gian theo bài tổng kết, giờ Thái Bình Dương. Lúc 9 giờ 37, lệnh gỡ máy chạy và kho ngừng phục vụ. Phải tới 11 giờ 37 mới cập nhật được từng dịch vụ trên trang báo tình trạng. Lúc 12 giờ 26, hệ con chỉ mục đủ sức để bắt đầu phục vụ đọc, liệt kê và xoá. Lúc 1 giờ 18 chiều, chỉ mục khôi phục đầy đủ. Hệ con cấp chỗ chỉ bắt đầu khôi phục khi chỉ mục đã chạy được, và xong lúc 1 giờ 54 chiều, khi đó việc ghi chạy lại và kho bình thường."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính (đổi ra phút từ nửa đêm)</th><th>kết quả</th></tr>
