        say: "Điều cần mang theo, một thao tác chưa từng tập ở quy mô thật thì thời gian khôi phục là một ẩn số. Diễn tập khôi phục là một phần của thiết kế, và công cụ phải biết từ chối những lệnh mà không ai nên chạy."
