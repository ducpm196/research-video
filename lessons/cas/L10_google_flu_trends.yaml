  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tái hiện bằng số: khớp quá khứ, sai tương lai"
    checks:
      - "[round(x, 2) for x in alg.cas_spurious_fit(10)] == [0.36, 1.42]"
      - "[round(x, 2) for x in alg.cas_spurious_fit(1000)] == [0.16, 3.01]"
      - "[round(x, 2) for x in alg.cas_spurious_fit(10000)] == [0.1, 3.85]"
      - "round(alg.cas_lag_mae(2), 2) == 0.8"
      - "round((0.486 - 0.232) / 0.486 * 100) == 52 and round((0.311 - 0.232) / 0.311 * 100) == 25"
    steps:
      - show: |
          <p>Mô phỏng (số minh hoạ): 20 tuần cúm lên rồi xuống. Mỗi “cụm từ ứng viên” là một chuỗi ngẫu nhiên. Ta chọn chuỗi <b>khớp nhất 10 tuần đầu</b>, rồi xem nó đoán 10 tuần sau ra sao. Đo bằng sai số tuyệt đối trung bình.</p>
          <table class="t"><tr><th>bước</th><th>số ứng viên</th><th>sai số 10 tuần đầu</th><th>sai số 10 tuần sau</th></tr>
          <tr><td>Bước 1</td><td>10</td><td>0,36</td><td>1,42</td></tr>
          <tr><td>Bước 2</td><td>1000</td><td>0,16</td><td>$\hl{3{,}01}$</td></tr>
          <tr><td>Bước 3</td><td>10&nbsp;000</td><td>$\hlb{0{,}10}$</td><td>$\hl{3{,}85}$</td></tr>
          <tr><td>Bước 4. dùng số đo thật trễ 2 tuần</td><td>—</td><td>—</td><td>$\hlg{0{,}80}$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Ta tái hiện cơ chế bằng một mô phỏng với số minh hoạ, 20 tuần cúm lên rồi xuống, mỗi cụm từ ứng viên là một chuỗi ngẫu nhiên. Ta chọn chuỗi khớp nhất 10 tuần đầu, rồi xem nó đoán 10 tuần sau ra sao, đo bằng sai số tuyệt đối trung bình. Bước một, với 10 ứng viên, sai số 10 tuần đầu là 0 phẩy 36, tuần sau là 1 phẩy 42. Bước hai, với 1000 ứng viên, quá khứ khớp hơn, chỉ 0 phẩy 16, nhưng tương lai sai tới 3 phẩy 01. Bước ba, với 10 nghìn ứng viên, quá khứ gần như hoàn hảo, 0 phẩy 10, mà tương lai sai 3 phẩy 85. Bước bốn, chỉ dùng số đo thật trễ 2 tuần, sai số 10 tuần sau là 0 phẩy 80, tốt hơn hẳn."
      - clear: true
        show: |
          <p>Vì sao? Càng nhiều ứng viên, càng chắc tìm được một chuỗi <b>trùng hợp</b> với quá khứ mà không liên quan gì tới cúm. Bài báo gọi cách làm ban đầu là “nửa máy dò cúm, nửa máy dò mùa đông” — từng phải loại tay các cụm từ về bóng rổ trung học.</p>
        focus: [1, 1, 1]
        say: "Vì sao lại như vậy? Càng nhiều ứng viên, càng chắc tìm được một chuỗi trùng hợp với quá khứ mà chẳng liên quan gì tới cúm. Bài báo gọi cách làm ban đầu là nửa máy dò cúm, nửa máy dò mùa đông, và nhóm làm ra nó từng phải loại tay những cụm từ về bóng rổ trung học."
      - show: |
          <table class="t"><tr><th>bước</th><th>số của bài báo (sai số tuyệt đối trung bình, ngoài mẫu)</th><th>kết quả</th></tr>
          <tr><td>Bước 5. chỉ dữ liệu tìm kiếm</td><td>0,486</td><td>tệ nhất</td></tr>
          <tr><td>Bước 6. chỉ số đo trễ của cơ quan y tế</td><td>0,311</td><td>tốt hơn — đúng như mô phỏng</td></tr>
          <tr><td>Bước 7. kết hợp hai nguồn</td><td>0,232; so với chỉ tìm kiếm: (0,486 − 0,232) chia 0,486</td><td>bớt khoảng $\hlg{52\%}$ sai số; so với chỉ số đo trễ bớt khoảng 25%</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.4"]
        say: "Bước năm, theo số của bài báo trên giai đoạn ngoài mẫu, chỉ dùng dữ liệu tìm kiếm có sai số tuyệt đối trung bình 0 phẩy 486, tệ nhất. Bước sáu, chỉ dùng số đo trễ của cơ quan y tế được 0 phẩy 311, tốt hơn, đúng như mô phỏng. Bước bảy, kết hợp hai nguồn được 0 phẩy 232, bớt khoảng 52 phần trăm sai số so với chỉ dùng tìm kiếm. So với chỉ dùng số đo trễ, nó bớt khoảng 25 phần trăm."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm bằng đường khác: đếm tay, và so với tung đồng xu"
    checks:
      - "sum(abs(alg.CAS_FLU[t] - alg.CAS_FLU[t - 2]) for t in range(10, 20)) == 8.0 or round(sum(abs(alg.CAS_FLU[t] - alg.CAS_FLU[t - 2]) for t in range(10, 20)), 6) == 8.0"
      - "sum(math.comb(108, k) for k in range(100, 109)) / 2 ** 108 < 1e-18"
      - "108 // 2 == 54 and round(0.486 - 0.232, 3) == 0.254"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>0,80 của số đo trễ</td><td>đếm tay 10 tuần sau: các hiệu so với 2 tuần trước là 0,1; 0,5; 1,0; 1,3; 1,3; 1,2; 1,0; 0,7; 0,5; 0,4 — cộng lại 8,0, chia 10 = 0,80 ✓</td></tr>
          <tr><td>100 trên 108 tuần</td><td>nếu sai số chỉ là ngẫu nhiên, cao hay thấp như tung đồng xu, ta chờ khoảng 54 tuần cao; khả năng có ít nhất 100 tuần cao nhỏ hơn 1 phần tỉ tỉ: sai <b>có hệ thống</b> ✓</td></tr>
          <tr><td>bớt 52%</td><td>0,486 − 0,232 = 0,254; 0,254 gần đúng một nửa của 0,486 ✓</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3", "1.3", "1.4"]
        say: "Ta kiểm lại bằng đường khác. Ta đếm tay 10 tuần sau của mô phỏng. Hiệu so với 2 tuần trước lần lượt là 0 phẩy 1, 0 phẩy 5, 1, 1 phẩy 3, 1 phẩy 3, 1 phẩy 2, 1, 0 phẩy 7, 0 phẩy 5, và 0 phẩy 4. Cộng lại được 8, chia 10 là 0 phẩy 80, khớp. Nếu sai số chỉ là ngẫu nhiên, cao hay thấp như tung đồng xu, ta chờ khoảng 54 tuần cao trong 108 tuần. Khả năng có ít nhất 100 tuần cao nhỏ hơn một phần tỉ tỉ, nên đây là sai có hệ thống. Cuối cùng, 0 phẩy 486 trừ 0 phẩy 232 là 0 phẩy 254, gần đúng một nửa của 0 phẩy 486."

  # ───────────────────────── 7. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Dữ liệu càng lớn, dự báo càng đúng”</td><td>bài báo: lượng dữ liệu không cho phép bỏ qua chuyện đo có đúng thứ cần đo, có ổn định theo thời gian không</td><td>hỏi dữ liệu đo cái gì, ai có thể làm nó đổi nghĩa</td></tr>
          <tr><td><b class="red">2.</b> “Sai là do báo chí làm người dân hoảng”</td><td>bài báo: có thể là một yếu tố, nhưng không giải thích nổi việc báo cao suốt hơn 2 năm; nghi phạm hợp lý hơn là thay đổi của chính dịch vụ tìm kiếm</td><td>tìm nhiều nguyên nhân góp phần, như ở bài 0</td></tr>
          <tr><td><b class="red">3.</b> “Vậy bỏ hẳn dữ liệu tìm kiếm”</td><td>bài báo: kết hợp tốt hơn từng nguồn riêng</td><td>dùng dữ liệu lớn để <b>bổ sung</b> số đo trực tiếp</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3", "1.4"]
        say: "Bài học sai thứ nhất là nghĩ dữ liệu càng lớn thì dự báo càng đúng. Bài báo viết, lượng dữ liệu không cho phép bỏ qua chuyện ta có đo đúng thứ cần đo không, và phép đo có ổn định theo thời gian không. Hãy hỏi dữ liệu đo cái gì, và ai có thể làm nó đổi nghĩa. Bài học sai thứ hai là đổ cho báo chí làm người dân hoảng. Bài báo nói đó có thể là một yếu tố, nhưng không giải thích nổi việc báo cao suốt hơn 2 năm, còn nghi phạm hợp lý hơn là thay đổi của chính dịch vụ tìm kiếm. Bài học sai thứ ba là vội bỏ hẳn dữ liệu tìm kiếm, trong khi kết hợp lại tốt hơn từng nguồn riêng."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">4.</b> “Đã cập nhật mô hình một lần là xong” (người đã đi làm)</td><td>mô hình được sửa năm 2009 rồi chạy gần như nguyên vậy; sai số có quy luật mà không ai dùng: tuần trước sai báo trước tuần này sai</td><td>theo dõi sai số liên tục; <b>hiệu chỉnh động</b> bằng số đo trực tiếp mới nhất</td></tr>
          <tr><td><b class="red">5.</b> “Mô hình bí mật vẫn kiểm chứng được”</td><td>bài báo: 45 cụm từ chưa từng được công bố; ví dụ đưa ra còn gây hiểu nhầm — người ngoài không làm lại được</td><td>công bố đủ để người khác kiểm lại, ít nhất là cách đo sai số</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ tư hay gặp ở người đã đi làm, nghĩ rằng đã cập nhật mô hình một lần là xong. Mô hình được sửa năm 2009 rồi chạy gần như nguyên vậy, trong khi sai số có quy luật, tuần trước sai báo trước tuần này sai, mà không ai dùng. Việc cần làm là theo dõi sai số liên tục và hiệu chỉnh động bằng số đo trực tiếp mới nhất. Bài học sai thứ năm là tin một mô hình bí mật vẫn kiểm chứng được, trong khi 45 cụm từ chưa từng được công bố, nên người ngoài không làm lại được."

  # ───────────────────────── 8. BẠN SẼ LÀM GÌ ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì?"
    checks:
      - "2 ** 8 == 256 and round(1 / 256 * 100, 2) == 0.39"
      - "round((0.9 - 0.5) / 0.9 * 100) == 44"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ)</th></tr>
          <tr><td>1</td><td>Mô hình đoán số bệnh nhân mỗi tuần từ dữ liệu ứng dụng điện thoại. Tám tuần liền, nó đều đoán <b>cao</b> hơn số thật. Nếu sai chỉ là ngẫu nhiên, khả năng đó là bao nhiêu? Bạn làm gì?</td></tr>
          <tr><td>2</td><td>Mô hình hiện có sai số tuyệt đối trung bình 0,9. Thêm số đo trực tiếp trễ 2 tuần vào, sai số còn 0,5, nhưng phải chờ hệ thống bệnh viện nối dữ liệu mất một quý. Có làm không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với số minh hoạ. Câu một, một mô hình đoán số bệnh nhân mỗi tuần từ dữ liệu ứng dụng điện thoại, và tám tuần liền nó đều đoán cao hơn số thật. Nếu sai chỉ là ngẫu nhiên thì khả năng đó là bao nhiêu? Bạn làm gì? Câu hai, mô hình hiện có sai số tuyệt đối trung bình 0 phẩy 9, thêm số đo trực tiếp trễ 2 tuần thì còn 0 phẩy 5. Nhưng phải chờ hệ thống bệnh viện nối dữ liệu mất một quý, vậy có làm không? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: bước</th><th>vì sao</th><th>kết quả</th></tr>
          <tr><td>Bước 1. mỗi tuần cao hay thấp như tung đồng xu</td><td>tám tuần độc lập, mỗi tuần một nửa: nhân 8 lần một nửa</td><td>1 chia 2 mũ 8 = 1 phần 256 ≈ $\hl{0{,}39\%}$</td></tr>
          <tr><td>Bước 2. kết luận</td><td>quá hiếm để là ngẫu nhiên</td><td>sai <b>có hệ thống</b>: hiệu chỉnh ngay</td></tr></table>
          <p class="note">Được: sửa sớm, trước khi thành tin xấu. Mất: có lúc hiệu chỉnh theo một đợt lệch tạm. Điều kiện đổi: nếu biết rõ một nguyên nhân tạm thời đã qua, ghi lại rồi theo dõi thêm.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Đáp án câu một, giải từng bước. Bước một, nếu mỗi tuần cao hay thấp như tung đồng xu, thì tám tuần độc lập đều cao có khả năng 1 chia 2 mũ 8, tức 1 phần 256, khoảng 0 phẩy 39 phần trăm. Bước hai, quá hiếm để là ngẫu nhiên, nên đây là sai có hệ thống, và phải hiệu chỉnh ngay. Đổi lại, có lúc ta hiệu chỉnh theo một đợt lệch tạm thời. Nếu biết rõ một nguyên nhân tạm thời đã qua, hãy ghi lại rồi theo dõi thêm."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>giữ mô hình cũ</td><td>không tốn công nối dữ liệu</td><td>sai 0,9 mãi, và không có gì kéo mô hình về khi dữ liệu trôi</td></tr>
          <tr><td><b>nối số đo trực tiếp</b></td><td>sai số bớt (0,9 − 0,5) chia 0,9 ≈ $\hlg{44\%}$; có một nguồn neo để hiệu chỉnh liên tục</td><td>một quý công sức; phụ thuộc thêm một nguồn dữ liệu</td></tr></table>
          <p class="note">Chọn nối số đo trực tiếp — đúng bài học của bài báo: kết hợp hai nguồn tốt hơn từng nguồn. Điều kiện đổi: nếu số đo trực tiếp không còn đáng tin hơn, hoặc trễ quá lâu so với lúc cần quyết định.</p>
        focus: [1, "1.2", "1.3", "1.3", 2]
        say: "Đáp án câu hai là một đánh đổi. Giữ mô hình cũ thì không tốn công, nhưng sai 0 phẩy 9 mãi, và không có gì kéo mô hình về khi dữ liệu trôi. Nối số đo trực tiếp thì sai số bớt 0 phẩy 9 trừ 0 phẩy 5, chia 0 phẩy 9, khoảng 44 phần trăm. Ta còn có một nguồn neo để hiệu chỉnh liên tục, đổi lại mất một quý công sức và phụ thuộc thêm một nguồn. Vậy nên chọn nối số đo trực tiếp, đúng bài học kết hợp hai nguồn, trừ khi số đo đó không còn đáng tin hơn, hoặc trễ quá lâu so với lúc cần quyết định."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Thay đổi hệ thống & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">50 triệu ứng viên, 1152 điểm: khớp quá khứ</span><span class="a">→</span>
          <span class="n">dịch vụ tìm kiếm và người dùng đổi: dữ liệu trôi</span><span class="a">→</span>
          <span class="n">báo cao 100 trên 108 tuần, gấp đôi tháng 2/2013</span><span class="a">→</span>
          <span class="n">kết hợp số đo trực tiếp, hiệu chỉnh liên tục, công bố cách làm</span></div>
        say: "Tổng kết lại, chọn vài cụm từ trong 50 triệu ứng viên cho 1152 điểm dữ liệu làm mô hình khớp quá khứ. Khi dịch vụ tìm kiếm và người dùng thay đổi, dữ liệu trôi, và mô hình báo cao 100 trên 108 tuần, gấp đôi vào tháng 2 năm 2013. Thay đổi hệ thống là kết hợp số đo trực tiếp, hiệu chỉnh liên tục, và công bố cách làm để người khác kiểm lại."
      - show: |
          <div class="box key"><b>Tư duy:</b> dữ liệu lớn là <b>bổ sung</b>, không phải thay thế cho số đo trực tiếp. Mô hình đúng hôm qua chỉ là một giả thuyết cho hôm nay — kiểm nó mỗi tuần.</div>
        say: "Điều cần mang theo, dữ liệu lớn là để bổ sung, không phải thay thế cho số đo trực tiếp. Một mô hình đúng hôm qua chỉ là giả thuyết cho hôm nay, nên hãy kiểm nó mỗi tuần."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11, bài cuối): năm 2038 — một sự cố biết trước: số giây đếm bằng 32 bit sẽ tràn. Dự báo, kiểm kê, và di chuyển trước hạn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, cũng là bài cuối của khoá, ta xem năm 2038, một sự cố biết trước, khi số giây đếm bằng 32 bit sẽ tràn. Ta học cách dự báo, kiểm kê, và di chuyển trước hạn. Hẹn gặp bạn ở bài tiếp theo."
