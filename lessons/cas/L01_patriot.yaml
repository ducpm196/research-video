  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm mô hình bằng đường khác"
    checks:
      - "__import__('fractions').Fraction(36000 * 838860, 2 ** 23) < 3600 and round(float(__import__('fractions').Fraction(36000 * 838860, 2 ** 23)), 4) == 3599.9966"
      - "round(100 * 36000 * (0.1 - int(0.1 * 2 ** 24) / 2 ** 24), 4) == 0.1287"
      - "all(round(h * 36000 * (0.1 - 838860 / 2 ** 23), 4) == v for h, v in [(1, 0.0034), (8, 0.0275), (20, 0.0687), (48, 0.1648), (72, 0.2472), (100, 0.3433)])"
      - "[round(t - e, 4) for t, e in [(3600, 0.0034), (28800, 0.0275), (72000, 0.0687), (360000, 0.3433)]] == [3599.9966, 28799.9725, 71999.9313, 359999.6567] and 359999.6567 != 359999.6667"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th><th>kết quả</th></tr>
          <tr><td>cột “thời gian tính ra” của bảng: 1 giờ thì máy tính ra bao nhiêu giây?</td><td>36&nbsp;000 nhân 838&nbsp;860 chia 2 mũ 23 = 3599,9966 — đúng số trong bảng ✓</td></tr>
          <tr><td>nếu máy giữ <b>24</b> bit phần lẻ thì sao?</td><td>100 giờ chỉ sai 0,1287 giây — <b>không khớp</b> 0,3433 <b class="red">(sai)</b></td></tr>
          <tr><td>mô hình 23 bit với cả 6 hàng: 1, 8, 20, 48, 72, 100 giờ</td><td>khớp <b>cả 6</b> sai số trong bảng tới 4 chữ số ✓</td></tr>
          <tr><td>đối chiếu hai cột của bảng: thời gian thật trừ sai số</td><td>5 hàng đầu khớp; hàng 100 giờ: 360&nbsp;000 − 0,3433 = 359&nbsp;999,6567, bảng in 359&nbsp;999,6667 — <b>lệch một chữ số</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Báo cáo không viết mô hình 23 bit, nên ta phải kiểm nó bằng đường khác. Thứ nhất, bảng có cột thời gian máy tính ra, và 36 nghìn nhân 838 nghìn 860 chia 2 mũ 23 cho đúng 3599 phẩy 9966 giây. Thứ hai, nếu máy giữ 24 bit phần lẻ, 100 giờ chỉ sai 0 phẩy 1287 giây, không khớp, nên mô hình đó bị loại. Thứ ba, mô hình 23 bit cho khớp cả sáu hàng của bảng, tới bốn chữ số. Thứ tư, lấy thời gian thật trừ sai số thì năm hàng đầu khớp cột thời gian tính ra. Riêng hàng 100 giờ, phép trừ cho 359 nghìn 999 phẩy 6567, còn bảng in 6667, lệch một chữ số, nên đọc báo cáo cũng phải đối chiếu từng cột."

  # ───────────────────────── 9. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    checks:
      - "1e-16 * 3600000 < 1e-9 and 3600000 * (0.1 - 838860 / 2 ** 23) > 0.34"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Lỗi của người vận hành vì để máy chạy quá lâu”</td><td>thông báo chỉ ghi “rất lâu”, không ghi số giờ; thiết kế giả định vài giờ</td><td>ghi giới hạn thời gian chạy bằng <b>con số</b>, và để máy tự cảnh báo khi gần tới</td></tr>
          <tr><td><b class="red">2.</b> “Khởi động lại mỗi vài giờ là sửa xong”</td><td>chỉ đưa sai số về 0; một lần quên là lỗi quay lại</td><td>sửa cách tính thời gian, như bản phần mềm 16/2</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ nhất là kết luận lỗi do người vận hành để máy chạy quá lâu. Thông báo chỉ ghi chạy rất lâu, không ghi số giờ, còn thiết kế thì giả định vài giờ. Bài học sai thứ hai là nghĩ khởi động lại mỗi vài giờ là sửa xong. Báo cáo ghi khởi động lại mất 60 tới 90 giây và đưa đồng hồ về 0, nhưng đó chỉ là sửa triệu chứng, và một lần quên là lỗi quay lại."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Dùng số thực nhiều bit hơn là hết lỗi” (người đã đi làm)</td><td>0,1 vẫn không ghi đúng trong nhị phân; sai số nhỏ đi nhưng <b>vẫn tăng theo thời gian chạy</b></td><td>đếm nhịp bằng số nguyên, chỉ đổi ra giây khi cần, hoặc chọn nhịp biểu diễn đúng</td></tr>
          <tr><td><b class="red">4.</b> “Phần mềm đã qua kiểm thử”</td><td>kiểm thử theo cách dùng đã định; phép thử chạy dài chỉ được làm <b>sau</b> sự cố</td><td>kiểm thử với thời gian chạy dài nhất có thể gặp</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba hay gặp ở người đã đi làm, nghĩ rằng dùng số thực nhiều bit hơn là hết lỗi. Con số 0 phẩy 1 vẫn không ghi đúng được trong nhị phân, nên sai số nhỏ đi nhưng vẫn tăng theo thời gian chạy. Bài học sai thứ tư là tin phần mềm đã qua kiểm thử. Theo báo cáo, phép thử chạy dài để chắc rằng chạy lâu không gây lỗi khác chỉ được làm sau sự cố, nên hãy kiểm thử với thời gian chạy dài nhất có thể gặp."

