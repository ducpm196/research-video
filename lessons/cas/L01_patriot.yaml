          <tr><td>(a) khởi động lại mỗi 20 phút</td><td>không sửa mã</td><td>mất dữ liệu mỗi lần; một lần lỡ lịch là sai quá giới hạn — sửa triệu chứng như năm 1991</td></tr>
          <tr><td>(b) đếm số nguyên, chia cho 100 khi cần</td><td>giây tính ra <b>không tích lũy</b> sai số</td><td>bộ đếm 32 bit đầy sau 2 mũ 32 nhịp ≈ <b>497 ngày</b>: phải xử lý tràn, hoặc dùng 64 bit</td></tr></table>
          <p class="note">Chọn (b), kèm phép thử chạy dài và phép thử tràn bộ đếm. Điều kiện đổi: chỉ khi trạm chắc chắn tắt hằng ngày thì (a) mới tạm chấp nhận.</p>
        focus: [1, "1.2", "1.3", "1.3", 2]
        say: "Đáp án câu hai là một đánh đổi. Khởi động lại mỗi 20 phút không phải sửa mã, nhưng mất dữ liệu mỗi lần, và một lần lỡ lịch là sai quá giới hạn, đúng kiểu sửa triệu chứng năm 1991. Đếm bằng số nguyên rồi chia cho 100 thì giây tính ra không tích lũy sai số. Đổi lại, bộ đếm 32 bit đầy sau 2 mũ 32 nhịp, khoảng 497 ngày, nên phải xử lý tràn hoặc dùng 64 bit. Vậy nên chọn cách đếm số nguyên, kèm phép thử chạy dài và phép thử tràn bộ đếm."

