  # ───────────────────────── 8. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm bằng đường khác: đếm từng mili giây"
    checks:
      - "(lambda tl: (tl[:2], tl[2:52].count('vua'), tl[52:54], tl[54]))(alg.cas_inversion_sim([dict(name='thap', prio=1, release=0, steps=[('lock', 4)]), dict(name='cao', prio=3, release=2, steps=[('lock', 1)]), dict(name='vua', prio=2, release=2, steps=[('cpu', 50)])], False)[2]) == (['thap', 'thap'], 50, ['thap', 'thap'], 'cao')"
      - "alg.cas_inversion_sim([dict(name='thap', prio=1, release=0, steps=[('lock', 4)]), dict(name='cao', prio=3, release=2, steps=[('lock', 1)]), dict(name='vua', prio=2, release=2, steps=[('cpu', 50)])], False)[1]['cao'] == 52 == 54 - 2"
      - "alg.cas_inversion_sim([dict(name='thap', prio=1, release=0, steps=[('lock', 4)]), dict(name='cao', prio=3, release=2, steps=[('lock', 1)]), dict(name='vua', prio=2, release=2, steps=[('cpu', 50)])], True)[2][:5] == ['thap', 'thap', 'thap', 'thap', 'cao']"
    steps:
      - show: |
          <table class="t"><tr><th>mili giây</th><th>ai chạy (không kế thừa)</th><th>đếm</th></tr>
          <tr><td>0 → 2</td><td>thấp (đã lấy khoá)</td><td>2 ms</td></tr>
          <tr><td>2 → 52</td><td>vừa; cao bị chặn, thấp không được chạy</td><td>50 ms</td></tr>
          <tr><td>52 → 54</td><td>thấp chạy nốt, nhả khoá</td><td>2 ms</td></tr>
          <tr><td>54 → 55</td><td>cao lấy khoá, xong</td><td>chờ từ 2 tới 54: $\hl{52}$ ms ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bằng đường khác, đếm từng mi li giây thay vì dùng công thức. Từ 0 tới 2, tác vụ thấp chạy và đã lấy khoá. Từ 2 tới 52, tác vụ vừa chạy, tác vụ cao bị chặn, còn tác vụ thấp không được chạy. Từ 52 tới 54, tác vụ thấp chạy nốt và nhả khoá. Từ 54 tới 55, tác vụ cao lấy khoá và xong, nên nó đã chờ từ 2 tới 54, đúng 52 mi li giây như công thức r cộng M."
      - clear: true
        show: |
          <table class="t"><tr><th>mili giây</th><th>ai chạy (có kế thừa)</th><th>đếm</th></tr>
          <tr><td>0 → 2</td><td>thấp (đã lấy khoá)</td><td>2 ms</td></tr>
          <tr><td>2 → 4</td><td>thấp, <b>mang ưu tiên cao</b>; vừa phải chờ</td><td>2 ms, nhả khoá</td></tr>
          <tr><td>4 → 5</td><td>cao lấy khoá, xong</td><td>chờ từ 2 tới 4: $\hlg{2}$ ms = r ✓</td></tr></table>
        focus: [0, "1.3", "1.4"]
