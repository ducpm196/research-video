          <tr><td>(a) kế thừa cho riêng khoá này</td><td>sửa nhỏ, đúng chỗ; chờ còn r</td><td>vẫn chờ r; phải chắc cờ chỉ đổi khoá này</td></tr>
          <tr><td>(b) bộ đệm đôi, bỏ khoá chung</td><td>tác vụ cao không bao giờ chờ tác vụ thấp — trên tàu năm 1997, phần lớn tác vụ đã nhận dữ liệu kiểu này</td><td>sửa thiết kế, phải thử lại đường dữ liệu</td></tr>
