  # ───────────────────────── 9. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Lỗi của nhà cung cấp hệ điều hành”</td><td>tắt kế thừa mặc định là lựa chọn có chủ ý vì hiệu năng; đội viết: “chúng tôi đã bỏ sót”, nhiều khoá khác của tàu vẫn có bảo vệ</td><td>dùng phần mềm mua ngoài thì phải biết nó chạy thế nào</td></tr>
          <tr><td><b class="red">2.</b> “Tự khởi động lại là đủ an toàn”</td><td>đúng là tàu được thiết kế để sống sót qua khởi động lại, nhưng mỗi lần, phần việc còn lại của ngày đó bị dời sang hôm sau</td><td>khởi động lại là lớp phòng vệ cuối, không phải cách sửa</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ nhất là đổ cho nhà cung cấp hệ điều hành. Tắt kế thừa mặc định là lựa chọn có chủ ý vì hiệu năng, và chính đội viết rằng họ đã bỏ sót, trong khi nhiều khoá khác của tàu vẫn có bảo vệ. Bài học sai thứ hai là tin tự khởi động lại là đủ an toàn. Tàu đúng là được thiết kế để sống sót qua khởi động lại, nhưng mỗi lần phần việc còn lại của ngày đó bị dời sang hôm sau, nên đó chỉ là lớp phòng vệ cuối."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Đã thử ở tốc độ dữ liệu cao nhất” (người đã đi làm)</td><td>“cao nhất” là mức dự kiến trước khi phóng; thực tế cao hơn, và lỗi nằm ở dải tải chưa thử</td><td>thử cả tải vượt dự kiến; ghi lỗi không lặp lại được thành việc phải theo dõi</td></tr>
          <tr><td><b class="red">4.</b> “Bật cờ là xong, mấy phút”</td><td>cờ toàn cục đổi mọi khoá cùng loại; đội phân tích, nhờ nhà cung cấp đánh giá, thử kỹ rồi mới gửi</td><td>coi một cờ cấu hình như một bản phát hành</td></tr>
          <tr><td><b class="red">5.</b> “Tin bản kể lại”</td><td>bản kể lại gián tiếp (thư 5/12/1997) nói có đồng hồ giám sát, gõ lệnh trực tiếp, công cụ “may mắn còn để lại”; thư 15/12 của đội đính chính cả ba</td><td>đọc nguồn của chính người trong cuộc</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.4", "1.4", "1.4"]
        say: "Bài học sai thứ ba hay gặp ở người đã đi làm, nói rằng đã thử ở tốc độ dữ liệu cao nhất. Nhưng cao nhất chỉ là mức dự kiến trước khi phóng, thực tế cao hơn, và lỗi nằm đúng ở dải tải chưa thử. Bài học sai thứ tư là nghĩ bật cờ là xong trong vài phút. Cờ toàn cục đổi mọi khoá cùng loại, nên đội đã phân tích, nhờ nhà cung cấp đánh giá, và thử kỹ rồi mới gửi. Bài học sai thứ năm là tin bản kể lại. Bản kể lại gián tiếp lan truyền trước đó nói có đồng hồ giám sát, gõ lệnh trực tiếp lên tàu, và công cụ may mắn còn để lại. Thư của chính đội phần mềm đã đính chính cả ba điều đó."

