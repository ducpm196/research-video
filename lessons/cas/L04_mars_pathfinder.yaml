          <tr><td>2. đổi toàn cục thì phần còn lại của hệ thống chạy khác đi thế nào?</td><td>như trên</td></tr>
          <tr><td>3. nhà cung cấp <b>cố ý tắt</b> kế thừa mặc định để chạy nhanh: chậm đi bao nhiêu?</td><td>nhà cung cấp phân tích: ảnh hưởng nhỏ</td></tr>
          <tr><td>4. cơ chế chờ nhiều kênh có đổi hành vi không?</td><td>không, khi mỗi kênh chỉ có một tác vụ chờ — đúng với hệ của tàu</td></tr></table>
