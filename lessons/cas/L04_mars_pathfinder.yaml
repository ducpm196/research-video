# ═══ BÀI TÌNH HUỐNG — sự cố có thật; case-lessons.md §1–§4 ═══
id: L04
course: CAS
series: "CAS · Tình huống chuyên gia"
title: "Bài 4 — Mars Pathfinder (1997): đảo ngược ưu tiên và một cờ cấu hình"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/cas.yaml L04; audit/cas/sources_L04.md (câu trích nguyên văn, đọc 2026-11-02); audit/cas/ver/L04.py; audit/verify_plan_curricula.py CAS:L04; trưởng nhóm phần mềm bay của tàu, What really happened on Mars? — Authoritative Account, thư 15/12/1997, bản chép tại www.cs.unc.edu/~anderson/teach/comp790/papers/mars_pathfinder_long_version.html [GR97]; M. Jones, What Happened on Mars?, thư 5/12/1997, www.cs.cmu.edu/afs/cs/user/raj/www/mars.html (bản kể lại lần hai, bị [GR97] đính chính) [MJ97]; khoá Hệ thống nhúng (ESY bài 10: đảo ngược ưu tiên; bài 15: hành trình sao Hoả), khoá Hệ điều hành (OSY bài 5: khoá loại trừ)"
assumes: [arith]
# Quy ước: “tác vụ cao / vừa / thấp” như khoá Hệ thống nhúng; “khoá” = khoá loại trừ lẫn nhau (mutex); “kế thừa ưu tiên” như ESY bài 10.
#   Tên tác vụ theo [GR97]: tác vụ lập lịch đường truyền (ưu tiên cao nhất), tác vụ phân phát dữ liệu (thứ ba), tác vụ khí tượng (thấp).
#   Mọi mốc mili giây (2, 50, 10…) là SỐ MINH HOẠ, mô phỏng bằng alg.cas_inversion_sim (bước 1 ms, ưu tiên cố định, một khoá).
#   CITED: 8 Hz / 0,125 s, cơ chế, cách tìm và cách sửa theo [GR97]. [MJ97] chỉ dùng cho ngày hạ cánh 4/7/1997 và “vài ngày sau”;
#   các chi tiết [MJ97] mà [GR97] đính chính (đồng hồ giám sát, gõ lệnh qua bộ thông dịch, “may mắn để lại”) được dạy như ví dụ
#   về đọc nguồn gốc. Nhất quán với ESY L15 (cùng nguồn, không lặp số minh hoạ của bài đó).
#   Lời đọc nói “Pát-phai-đơ” (bằng chứng ESY p2 7/8); không đọc VxWorks, ASI/MET, NASA, JPL. Không nêu tên người.
objectives:
  - "Mô phỏng từng mili giây: tác vụ thấp giữ khoá, tác vụ vừa chen vào, tác vụ cao chờ"
  - "Tính thời gian chờ có và không có kế thừa ưu tiên, và tải của tác vụ vừa tới mức nào thì trễ hạn"
  - "Giải thích vì sao lỗi chỉ hiện ra dưới tải cao, và vì sao công cụ ghi vết để sẵn cứu được nhiệm vụ"
  - "Cân nhắc rủi ro của một cờ cấu hình toàn cục trước khi bật"
asr_reviewed:
  - {sentence: "Nhờ vết ghi để sẵn, đội tìm ra lỗi, và kế thừa ưu tiên đưa thời gian chờ về r.", reason: "ASR chép “Nhờ vết ghi để sẵn, đổi tìm ra lỗi và kế thừa ưu tiên đưa thời gian chờ về error.” (0.85): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: vết/véc, đội/đổi — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tháng 7/1997: máy tính trên sao Hoả tự khởi động lại"
    checks:
      - "1 / 8 == 0.125"
    steps:
      - show: |
          <p>Ngày <b>4/7/1997</b>, tàu Mars Pathfinder hạ cánh xuống sao Hoả. Vài ngày sau, ngay khi tàu bắt đầu thu dữ liệu khí tượng, máy tính duy nhất của tàu <b>tự khởi động lại toàn bộ</b>, nhiều lần.</p>
          <p>Mỗi lần khởi động lại, các việc mặt đất đã ra lệnh cho hôm đó bị dừng, phải dời sang <b>hôm sau</b>.</p>
          <div class="box key">Hôm nay: một lỗi đảo ngược ưu tiên trong chu kỳ <b>0,125 giây</b>, tính bằng số khi nào nó xảy ra, và vì sao chỉ một cờ cấu hình mà phải cân nhắc kỹ.</div>
        focus: [1, 1, 2, 3, 3]
        say: "Chào bạn, ngày 4 tháng 7 năm 1997, tàu Pát-phai-đơ hạ cánh xuống sao Hoả. Vài ngày sau, ngay khi tàu bắt đầu thu dữ liệu khí tượng, máy tính duy nhất của tàu tự khởi động lại toàn bộ, nhiều lần. Theo thư năm 1997 của trưởng nhóm phần mềm bay, mỗi lần như vậy các việc mặt đất đã ra lệnh cho hôm đó bị dừng, phải dời sang hôm sau. Hôm nay ta tìm hiểu một lỗi đảo ngược ưu tiên trong chu kỳ 0 phẩy 125 giây, và tính bằng số khi nào nó xảy ra. Ta cũng xem vì sao chỉ một cờ cấu hình mà phải cân nhắc kỹ."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: tác vụ, khoá loại trừ, lập lịch theo ưu tiên"
    checks:
      - "alg.cas_inversion_sim([dict(name='x', prio=2, release=0, steps=[('lock', 3)]), dict(name='y', prio=2, release=1, steps=[('lock', 1)])], False)[0] == {'x': 3, 'y': 4} and 3 - 1 == 2"
      - "alg.cas_inversion_sim([dict(name='p2', prio=2, release=0, steps=[('cpu', 4)]), dict(name='p3', prio=3, release=1, steps=[('cpu', 2)])], False)[0] == {'p3': 3, 'p2': 6}"
      - "alg.cas_inversion_sim([dict(name='thap', prio=1, release=0, steps=[('lock', 3)]), dict(name='cao', prio=3, release=1, steps=[('lock', 1)])], True)[0] == {'thap': 3, 'cao': 4} and 3 - 1 == 2"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>tác vụ</b>: một phần việc chạy riêng; máy một bộ xử lý thì mỗi lúc chỉ chạy được một tác vụ</td><td>nhiều việc phải thay nhau dùng một bộ xử lý</td><td>tác vụ đo, tác vụ gửi dữ liệu, tác vụ ghi nhật ký</td></tr>
          <tr><td><b>khoá loại trừ</b>: mỗi lúc chỉ một tác vụ giữ; tác vụ khác xin khoá thì bị chặn, chờ tới khi khoá được nhả</td><td>hai tác vụ cùng sửa một dữ liệu chung một lúc sẽ làm hỏng nó, như hai người cùng viết lên một tờ giấy</td><td>X giữ khoá từ 0 tới 3 ms; Y xin lúc 1 phải chờ tới 3: chờ 3 − 1 = <b>2 ms</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.3"]
        say: "Trước hết, ta cần hiểu ba khái niệm về cách máy tính chia việc. Một tác vụ là một phần việc chạy riêng, và máy chỉ có một bộ xử lý thì mỗi lúc chỉ chạy được một tác vụ, nên các tác vụ phải thay nhau. Khoá loại trừ cho phép mỗi lúc chỉ một tác vụ giữ, tác vụ khác xin khoá thì bị chặn và phải chờ tới khi khoá được nhả. Lý do là hai tác vụ cùng sửa một dữ liệu chung một lúc sẽ làm hỏng nó, như hai người cùng viết lên một tờ giấy. Ví dụ X giữ khoá từ mốc 0 tới mốc 3, Y xin lúc 1 thì phải chờ tới 3, tức chờ 2 mi li giây."
      - clear: true
        show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>ưu tiên cố định, chiếm quyền</b>: mỗi tác vụ có một số ưu tiên; máy luôn chạy tác vụ sẵn sàng có ưu tiên cao nhất, kể cả phải ngắt tác vụ đang chạy</td><td>việc gấp được làm trước, không phải đợi việc chậm làm xong</td><td>ưu tiên 2 đang chạy; ưu tiên 3 thức dậy ở mốc 1, cần 2 ms → chạy từ 1 tới 3, rồi mới tới lượt ưu tiên 2</td></tr>
          <tr><td><b>kế thừa ưu tiên</b>: tác vụ đang giữ khoá tạm mang ưu tiên của tác vụ cao nhất đang chờ khoá đó, tới khi nhả khoá</td><td>để không tác vụ ưu tiên vừa nào chen vào giữa, làm tác vụ cao phải chờ lâu</td><td>tác vụ thấp còn giữ khoá 2 ms: có kế thừa thì nó chạy ngay phần đó rồi nhả, tác vụ cao chờ đúng <b>2 ms</b></td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Mỗi tác vụ có một số ưu tiên, và với ưu tiên cố định có chiếm quyền, máy luôn chạy tác vụ sẵn sàng có ưu tiên cao nhất, kể cả phải ngắt tác vụ đang chạy. Nhờ vậy việc gấp được làm trước, không phải đợi việc chậm làm xong. Ví dụ tác vụ ưu tiên 2 đang chạy thì tác vụ ưu tiên 3 thức dậy ở mốc 1, cần 2 mi li giây, nên chạy từ 1 tới 3 rồi mới nhường lại. Kế thừa ưu tiên nghĩa là tác vụ đang giữ khoá tạm mang ưu tiên của tác vụ cao nhất đang chờ khoá đó, cho tới khi nhả khoá. Mục đích là để không tác vụ ưu tiên vừa nào chen vào giữa, làm tác vụ cao phải chờ lâu. Ví dụ tác vụ thấp còn giữ khoá 2 mi li giây, có kế thừa thì nó chạy ngay phần đó rồi nhả khoá, nên tác vụ cao chờ đúng 2 mi li giây."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ba tác vụ và một hạn chót cứng"
    checks:
      - "1 / 8 == 0.125 and 0.125 * 1000 == 125"
    steps:
      - show: |
          <table class="t"><tr><th>thành phần (theo thư năm 1997 của trưởng nhóm phần mềm)</th><th>vai trò</th></tr>
          <tr><td><b>chu kỳ 8 Hz</b></td><td>phần cứng đường truyền thừa kế từ tàu trước buộc lập lịch 8 lần mỗi giây: mỗi chu kỳ 0,125 giây = 125 mili giây</td></tr>
          <tr><td><b>tác vụ lập lịch đường truyền</b></td><td>ưu tiên <b>cao nhất</b>; mỗi chu kỳ kiểm tác vụ phân phát đã xong chưa</td></tr>
          <tr><td><b>tác vụ phân phát dữ liệu</b></td><td>ưu tiên <b>thứ ba</b>; phải xong trước lượt lập lịch kế tiếp: <b>hạn chót cứng</b></td></tr>
          <tr><td><b>tác vụ khí tượng</b></td><td>ưu tiên <b>thấp</b>; nhận dữ liệu qua một kênh liên tiến trình (cơ chế gửi dữ liệu giữa các tác vụ), dùng chung một khoá với tác vụ phân phát</td></tr>
          <tr><td>các tác vụ <b>vừa</b></td><td>ưu tiên giữa hai tác vụ trên; không cần khoá đó</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Phần cứng đường truyền thừa kế từ một tàu trước buộc phần mềm lập lịch 8 lần mỗi giây, nên mỗi chu kỳ dài 0 phẩy 125 giây, tức 125 mi li giây. Tác vụ lập lịch đường truyền có ưu tiên cao nhất, và mỗi chu kỳ nó kiểm xem tác vụ phân phát đã xong chưa. Tác vụ phân phát dữ liệu có ưu tiên thứ ba, và phải xong trước lượt lập lịch kế tiếp, một hạn chót cứng. Tác vụ khí tượng có ưu tiên thấp, nhận dữ liệu qua một kênh liên tiến trình, tức cơ chế gửi dữ liệu giữa các tác vụ, và dùng chung một khoá với tác vụ phân phát. Các tác vụ vừa có ưu tiên ở giữa, và không cần khoá đó."

  # ───────────────────────── 4. HÌNH CƠ CHẾ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đảo ngược ưu tiên trên trục thời gian"
    checks:
      - "alg.cas_inversion_sim([dict(name='thap', prio=1, release=0, steps=[('lock', 4)]), dict(name='cao', prio=3, release=2, steps=[('lock', 1)]), dict(name='vua', prio=2, release=2, steps=[('cpu', 50)])], False)[0] == {'vua': 52, 'thap': 54, 'cao': 55}"
      - "alg.cas_inversion_sim([dict(name='thap', prio=1, release=0, steps=[('lock', 4)]), dict(name='cao', prio=3, release=2, steps=[('lock', 1)]), dict(name='vua', prio=2, release=2, steps=[('cpu', 50)])], True)[0] == {'thap': 4, 'cao': 5, 'vua': 55}"
    steps:
      - show: |
          <div><svg width="1640" height="400" viewBox="0 0 1640 400">
          <g font-size="22" fill="#1f2937">
          <text x="20" y="40" font-weight="bold">không kế thừa (số minh hoạ, mili giây; cao = tác vụ phân phát, thấp = tác vụ khí tượng)</text>
          <text x="20" y="92">thấp</text><text x="20" y="132">vừa</text><text x="20" y="172">cao</text>
          <rect x="150" y="70" width="40" height="30" fill="#9ca3af"/><rect x="1190" y="70" width="40" height="30" fill="#9ca3af"/>
          <rect x="190" y="110" width="1000" height="30" fill="#2a78d6"/><text x="690" y="132" fill="#ffffff" text-anchor="middle">tác vụ vừa chạy 50 ms, không cần khoá</text>
          <rect x="190" y="150" width="1040" height="30" fill="#fde2e2" stroke="#e11d48"/><text x="710" y="172" fill="#e11d48" text-anchor="middle">tác vụ cao bị chặn vì khoá: 52 ms</text>
          <rect x="1230" y="150" width="20" height="30" fill="#059669"/>
          <text x="1270" y="172" fill="#e11d48" font-weight="bold">xong ở mốc 55</text>
          <text x="20" y="240" font-weight="bold">có kế thừa</text>
          <text x="20" y="292">thấp</text><text x="20" y="332">vừa</text><text x="20" y="372">cao</text>
          <rect x="150" y="270" width="40" height="30" fill="#9ca3af"/><rect x="190" y="270" width="40" height="30" fill="#7c3aed"/>
          <text x="245" y="292" fill="#7c3aed">mang ưu tiên cao, nhả khoá ở mốc 4</text>
          <rect x="230" y="350" width="20" height="30" fill="#059669"/><text x="265" y="372" fill="#059669" font-weight="bold">cao xong ở mốc 5</text>
          <rect x="250" y="310" width="1000" height="30" fill="#2a78d6"/><text x="750" y="332" fill="#ffffff" text-anchor="middle">tác vụ vừa chạy sau</text>
          </g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian tính bằng mi li giây, với số minh hoạ, trong đó tác vụ cao đóng vai tác vụ phân phát dữ liệu, còn tác vụ thấp là tác vụ khí tượng. Tác vụ thấp lấy khoá ở mốc 0 và cần giữ 4 mi li giây. Ở mốc 2, tác vụ cao và một tác vụ vừa cùng thức dậy, tác vụ cao xin khoá và bị chặn. Ở hàng trên, không kế thừa, nên tác vụ vừa có ưu tiên cao hơn tác vụ thấp, chạy suốt 50 mi li giây, và tác vụ cao bị chặn tới 52 mi li giây. Ở hàng dưới, tác vụ thấp mang ưu tiên của tác vụ cao, chạy nốt 2 mi li giây rồi nhả khoá, và tác vụ cao xong ngay ở mốc 5."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra: tác vụ cao chờ bao lâu"
    steps:
      - show: |
          <p>Lúc tác vụ cao bị chặn, tác vụ thấp còn giữ khoá thêm <b>r</b> mili giây; các tác vụ vừa thức dậy trong lúc đó cần tổng <b>M</b> mili giây.</p>
          <table class="t"><tr><th>bước</th><th>vì sao</th><th>thời gian tác vụ cao chờ</th></tr>
          <tr><td>Bước 1. không kế thừa</td><td>tác vụ vừa có ưu tiên cao hơn tác vụ thấp, nên chạy hết trước; tác vụ thấp chỉ chạy nốt khi chúng xong</td><td>r + M</td></tr>
          <tr><td>Bước 2. có kế thừa</td><td>tác vụ thấp mang ưu tiên cao, nên tác vụ vừa không chen được</td><td>r</td></tr>
          <tr><td>Bước 3. làm thử: r = 2, M = 50</td><td>thay số vào hai dòng trên</td><td>không kế thừa: $\hl{52}$; có kế thừa: $\hlg{2}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4"]
        say: "Bây giờ ta suy ra công thức. Gọi r là thời gian tác vụ thấp còn giữ khoá lúc tác vụ cao bị chặn, và M là tổng thời gian các tác vụ vừa cần trong lúc đó. Bước một, không kế thừa, tác vụ vừa có ưu tiên cao hơn tác vụ thấp nên chạy hết trước, vì vậy tác vụ cao chờ r cộng M. Bước hai, có kế thừa, tác vụ thấp mang ưu tiên cao nên tác vụ vừa không chen được, và tác vụ cao chỉ chờ r. Bước ba, làm thử với r bằng 2 và M bằng 50, ta được 52 so với 2, khớp đúng mô phỏng trong hình."
      - show: |
          <p class="note">Điểm mấu chốt: không kế thừa thì thời gian chờ phụ thuộc <b>M</b> — tải của những tác vụ <b>không liên quan gì tới khoá</b>. Tải càng cao, chờ càng lâu.</p>
        say: "Điểm mấu chốt là, không kế thừa thì thời gian chờ phụ thuộc M, tức tải của những tác vụ không liên quan gì tới khoá. Vì vậy tải càng cao thì tác vụ cao chờ càng lâu."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tái hiện bằng số: tải bao nhiêu thì trễ hạn"
    checks:
      - "[alg.cas_inversion_sim([dict(name='thap', prio=1, release=0, steps=[('lock', 4)]), dict(name='cao', prio=3, release=2, steps=[('lock', 1)]), dict(name='vua', prio=2, release=2, steps=[('cpu', m)])], False)[0]['cao'] - 2 for m in (5, 7, 8, 30)] == [8, 10, 11, 33]"
      - "[alg.cas_inversion_sim([dict(name='thap', prio=1, release=0, steps=[('lock', 4)]), dict(name='cao', prio=3, release=2, steps=[('lock', 1)]), dict(name='vua', prio=2, release=2, steps=[('cpu', m)])], True)[0]['cao'] - 2 for m in (5, 7, 8, 30)] == [3, 3, 3, 3]"
      - "max(m for m in range(0, 60) if 2 + m + 1 <= 10) == 7"
    steps:
      - show: |
          <p>Giả sử tác vụ cao phải xong trong <b>10 mili giây</b> kể từ lúc thức dậy (số minh hoạ); nó cần khoá thêm 1 mili giây. Thời gian xong = chờ + 1 = r + M + 1.</p>
          <table class="t"><tr><th>bước: tải M của tác vụ vừa</th><th>không kế thừa: xong sau</th><th>có kế thừa: xong sau</th></tr>
          <tr><td>Bước 1. M = 5 (tải nhẹ)</td><td>2 + 5 + 1 = 8 ms: kịp</td><td>3 ms: kịp</td></tr>
          <tr><td>Bước 2. M = 7</td><td>10 ms: vừa đúng hạn</td><td>3 ms</td></tr>
          <tr><td>Bước 3. M = 8</td><td>11 ms: <b class="red">trễ hạn → khởi động lại</b></td><td>3 ms</td></tr>
          <tr><td>Bước 4. M = 30 (tải nặng)</td><td>$\hl{33}$ ms: trễ hạn</td><td>$\hlg{3}$ ms</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bây giờ ta tái hiện vì sao lỗi chỉ hiện ra dưới tải cao. Giả sử tác vụ cao phải xong trong 10 mi li giây kể từ lúc thức dậy, và cần khoá thêm 1 mi li giây. Bước một, tải nhẹ M bằng 5 thì không kế thừa vẫn xong sau 8 mi li giây, kịp hạn. Bước hai, M bằng 7 thì xong đúng 10, vừa sát hạn. Bước ba, chỉ thêm 1 mi li giây tải, M bằng 8, tác vụ cao xong sau 11, trễ hạn và máy khởi động lại. Bước bốn, tải nặng 30 thì trễ tới 33, trong khi có kế thừa thì tải nào cũng chỉ 3 mi li giây."
      - clear: true
        show: |
          <table class="t"><tr><th>điều thư năm 1997 ghi</th><th>khớp với bảng số nào</th></tr>
          <tr><td>lỗi chỉ xuất hiện khi đang thu dữ liệu khí tượng <b>và</b> các tác vụ vừa tải nặng</td><td>M nhỏ thì kịp; M lớn mới trễ hạn</td></tr>
          <tr><td>trước khi phóng chỉ thử trường hợp tốt nhất; trên sao Hoả, tốc độ dữ liệu và lượng việc khoa học <b>cao hơn dự kiến</b></td><td>phép thử nằm ở vùng M nhỏ, sao Hoả đẩy M lên</td></tr>
          <tr><td>đã thấy lỗi trước khi hạ cánh, nhưng <b>không làm lặp lại được</b></td><td>chỉ ở một dải tải hẹp mới lộ ra</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bảng số khớp với điều thư năm 1997 ghi lại. Lỗi chỉ xuất hiện khi đang thu dữ liệu khí tượng và các tác vụ vừa tải nặng, đúng như M lớn mới trễ hạn. Trước khi phóng, đội chỉ thử trường hợp tốt nhất, còn trên sao Hoả, tốc độ dữ liệu và lượng việc khoa học cao hơn dự kiến, nên M bị đẩy lên. Đội cũng đã thấy lỗi này trước khi hạ cánh, nhưng không làm nó lặp lại được."

