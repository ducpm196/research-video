  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm bằng đường khác: năm 2000, và độ dài trung bình một năm"
    checks:
      - "sum(366 if y % 4 == 0 else 365 for y in range(1970, 2000)) == 10957 and 10957 * 86400 == 946684800"
      - "sum(366 if y % 4 == 0 else 365 for y in range(2000, 2038)) == 13880 and 10957 + 13880 == 24837"
      - "round((2 ** 31 - 1) / (365.25 * 86400), 2) == 68.05"
      - "(__import__('datetime').date(2038, 1, 19) - __import__('datetime').date(1970, 1, 1)).days == 24855"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>24 837 ngày từ 1970 tới hết 2037</td><td>tách hai đoạn: 1970–1999 có 30 năm, 7 năm nhuận = 10 957 ngày (mốc quen 946 684 800 giây = 1/1/2000); 2000–2037 có 38 năm, 10 năm nhuận = 13 880; cộng lại 24 837 ✓</td></tr>
          <tr><td>khoảng năm 2038</td><td>một năm trung bình 365,25 ngày: 2 147 483 647 chia (365,25 nhân 86 400) ≈ 68,05 năm; 1970 + 68,05 → đầu năm 2038 ✓</td></tr>
          <tr><td>ngày 19/1/2038</td><td>đếm bằng lịch của máy tính, không qua số giây: từ 1/1/1970 tới 19/1/2038 là 24 855 ngày ✓</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Ta kiểm lại bằng đường khác. Từ 1970 tới hết 1999 có 7 năm nhuận, tức 10 nghìn 957 ngày, khớp mốc quen 946 triệu 684 nghìn 800 giây là đầu năm 2000. Từ 2000 tới hết 2037 có 10 năm nhuận, tức 13 nghìn 880 ngày, cộng lại vẫn 24 nghìn 837. Đường thứ hai, một năm trung bình 365 phẩy 25 ngày, nên số giây lớn nhất ứng với khoảng 68 phẩy 05 năm, rơi vào đầu 2038. Đường thứ ba, đếm bằng lịch của máy tính, từ mốc gốc tới 19 tháng 1 năm 2038 đúng là 24 nghìn 855 ngày."

  # ───────────────────────── 8. KIỂM KÊ ─────────────────────────
  - id: inventory
    kind: concept
    title: "Kiểm kê: số giây 32 bit nằm ở những đâu?"
    steps:
      - show: |
          <table class="t"><tr><th>nơi chứa</th><th>nguồn ghi</th><th>vì sao đổi mã chưa đủ</th></tr>
          <tr><td>mã chương trình</td><td>nhân hệ điều hành đã dùng 64 bit bên trong; phần chương trình người dùng vẫn 32 bit thì vẫn “nổ đúng hẹn”</td><td>phải dịch lại; có chương trình cần sửa thêm</td></tr>
          <tr><td>cột cơ sở dữ liệu</td><td>MariaDB trước 11.5: TIMESTAMP tới 2038-01-19 03:14:07</td><td>dữ liệu đã ghi phải chuyển cột</td></tr>
          <tr><td>định dạng tệp, hệ tệp</td><td>ext4, nút chỉ mục 128 byte: dấu thời gian 32 bit có dấu, tràn tháng 1/2038; một trường không được nới</td><td>tệp đã ghi trên đĩa giữ định dạng cũ</td></tr>
          <tr><td>giao thức, giao diện</td><td>bài viết năm 2019: còn lại chủ yếu ở dấu thời gian của hệ tệp và giá trị truyền qua giao diện điều khiển thiết bị</td><td>hai đầu phải đổi cùng nhau</td></tr>
          <tr><td>thiết bị nhúng</td><td>hệ triển khai bây giờ vẫn chạy năm 2038</td><td>có thiết bị không cập nhật được</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Kiểm kê là bước quyết định, vì con số 32 bit nằm ở nhiều nơi hơn ta nghĩ. Nhân hệ điều hành đã dùng 64 bit bên trong, nhưng chương trình người dùng còn 32 bit thì vẫn nổ đúng hẹn. Một hệ quản trị cơ sở dữ liệu trước bản 11.5 chỉ chứa tới 3 giờ 14 phút 7 giây ngày 19 tháng 1 năm 2038, và dữ liệu đã ghi phải chuyển cột. Một hệ tệp phổ biến với nút chỉ mục 128 byte lưu dấu thời gian 32 bit có dấu, và tệp trên đĩa giữ định dạng cũ. Ở giao diện điều khiển thiết bị và giao thức, hai đầu phải đổi cùng nhau. Còn thiết bị nhúng lắp hôm nay vẫn chạy năm 2038, và có cái không cập nhật được."

  # ───────────────────────── 9. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    checks:
      - "2026 + 15 == 2041 and 2041 > 2038 and 2038 - 15 == 2023"
      - "__import__('datetime').date(1965, 5, 1) < __import__('datetime').date(1970, 1, 1)"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Đổi kiểu trong mã là xong”</td><td>cột cơ sở dữ liệu, tệp trên đĩa, giao thức, thiết bị vẫn mang số 32 bit</td><td>kiểm kê mọi nơi lưu và truyền, không chỉ mã</td></tr>
          <tr><td><b class="red">2.</b> “Còn xa, để năm 2037”</td><td>ngày trong <b>tương lai</b> đã vượt: hợp đồng 15 năm ký năm 2024 hết hạn 2039 (số minh hoạ)</td><td>tính hạn sớm nhất = 2038 trừ khoảng thời gian dài nhất hệ phải nhìn trước</td></tr>
          <tr><td><b class="red">3.</b> “Đổi sang không dấu là xong”</td><td>mất mọi ngày trước 1970, như ngày sinh 1965; chỉ lùi hạn tới 2106; thư viện C chuẩn vẫn ghi ứng dụng phải chuyển khỏi giao diện cũ</td><td>chọn 64 bit khi định dạng cho phép</td></tr></table>
        focus: ["1.2", "1.3", "1.3", "1.4"]
        say: "Bài học sai thứ nhất là nghĩ đổi kiểu trong mã là xong, trong khi cột cơ sở dữ liệu, tệp trên đĩa, giao thức và thiết bị vẫn mang số 32 bit. Bài học sai thứ hai là nghĩ còn xa, để tới năm 2037 hẵng làm. Ngày trong tương lai đã vượt giới hạn từ bây giờ, như một hợp đồng 15 năm ký năm 2024 hết hạn năm 2039, số minh hoạ. Bài học sai thứ ba là đổi sang không dấu, cách này mất mọi ngày trước 1970, như ngày sinh năm 1965, và chỉ lùi hạn tới 2106."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">4.</b> “Khởi động lại định kỳ là được” (người đã đi làm)</td><td>chỉ hợp với bộ đếm thời gian chạy như 787 (120 ngày), và chính chỉ thị gọi là tạm thời; đồng hồ lịch thì khởi động lại không lùi được ngày</td><td>sửa kiểu và định dạng; coi lịch tắt điện là lớp phòng vệ có người phụ trách</td></tr>
          <tr><td><b class="red">5.</b> “Đã thử chạy bình thường, không lỗi”</td><td>lỗi chỉ lộ ra khi đồng hồ vượt giới hạn — như bài 1, lỗi chỉ lộ khi chạy lâu hơn giả định</td><td>diễn tập: chạy thử với đồng hồ đặt sang 2038 và sau 2038</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ tư hay gặp ở người đã đi làm, nghĩ rằng khởi động lại định kỳ là được. Cách đó chỉ hợp với bộ đếm thời gian chạy như máy bay 787, và chính chỉ thị gọi là tạm thời, còn đồng hồ lịch thì khởi động lại không lùi được ngày. Bài học sai thứ năm là nghĩ đã chạy thử bình thường mà không lỗi, trong khi lỗi chỉ lộ ra khi đồng hồ vượt giới hạn. Ở bài 1, sai số đồng hồ của tên lửa cũng chỉ lộ ra khi hệ chạy lâu hơn giả định, nên hãy diễn tập với đồng hồ đặt sang năm 2038 và sau đó."

  # ───────────────────────── 10. BẠN SẼ LÀM GÌ ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ xếp thứ tự di chuyển thế nào?"
    checks:
