        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án phần một là tính hạn sớm nhất. Hệ A có hạn năm 2038 trừ 10, tức 2028, vì từ năm đó thẻ mới có hạn sau ngày 19 tháng 1 năm 2038, cột cũ không ghi được. Hệ B có hạn ngay bây giờ, vì 2026 cộng 15 là 2041, vượt 2038, mà sau khi lắp thì không sửa được. Hệ C có hạn năm 2106, còn 80 năm, nhưng vẫn ghi vào kế hoạch chuyển đi."
      - clear: true
        show: |
          <table class="t"><tr><th>thứ tự</th><th>làm gì</th><th>đổi lại mất gì</th></tr>
