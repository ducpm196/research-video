scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một sự cố đã biết trước ngày giờ"
    checks:
      - "2 ** 31 - 1 == 2147483647"
      - "(3 + 7, 14, 7) == (10, 14, 7)"
    steps:
      - show: |
          <p>Các bài trước là sự cố <b>đã xảy ra</b>. Bài này là sự cố <b>biết trước</b>, tới cả từng giây:</p>
          <div class="box warn">03:14:07 giờ quốc tế ngày <b>19/1/2038</b> (10:14:07 giờ Việt Nam): số giây kể từ năm 1970, nếu lưu bằng 32 bit có dấu, đạt giá trị lớn nhất <b>2 147 483 647</b>.</div>
          <p>Một tạp chí kỹ thuật về nhân hệ điều hành viết năm 2019: “các hệ thống triển khai bây giờ vẫn sẽ còn chạy vào năm 2038”.</p>
          <div class="box key">Hôm nay: tính ra đúng giây đó; tính hạn của từng cách sửa; và lập kế hoạch kiểm kê, di chuyển — vì hạn thật của nhiều hệ đến <b>sớm hơn</b> 2038.</div>
        focus: [1, 2, 2, 2, 3, 4]
        say: "Chào bạn, mọi bài trước là sự cố đã xảy ra, còn bài cuối này là một sự cố biết trước, tới từng giây. Lúc 3 giờ 14 phút 7 giây giờ quốc tế ngày 19 tháng 1 năm 2038, số giây kể từ năm 1970 chạm giới hạn của 32 bit có dấu. Ở Việt Nam, lúc đó là 10 giờ 14 phút 7 giây sáng. Con số giới hạn là 2 tỉ 147 triệu 483 nghìn 647. Một tạp chí kỹ thuật về nhân hệ điều hành viết năm 2019 rằng các hệ thống triển khai bây giờ vẫn sẽ còn chạy vào năm 2038. Hôm nay ta tính ra đúng giây đó, tính hạn của từng cách sửa, và thấy vì sao hạn thật của nhiều hệ đến sớm hơn 2038."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: số có dấu, tràn, chia lấy dư, năm nhuận"
    checks:
      - "int('1000', 2) - 2 ** 4 == -8 and int('0111', 2) == 4 + 2 + 1 == 7"
      - "(-2 ** 31, 2 ** 31 - 1) == (-2147483648, 2147483647)"
      - "(-2 ** 15, 2 ** 15 - 1) == (-32768, 32767)"
      - "divmod(100000, 86400) == (1, 13600) and divmod(13600, 3600) == (3, 2800) and divmod(2800, 60) == (46, 40)"
      - "[y for y in (1972, 1974, 2000, 2036) if y % 4 == 0] == [1972, 2000, 2036]"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>bù 2</b>: cách ghi số có dấu bằng n bit; bit đầu mang giá trị <b>âm</b> 2 mũ (n − 1), các bit sau mang giá trị dương như thường</td><td>nhờ vậy mọi mẫu có bit đầu là 1 thành số âm: đúng một nửa số mẫu</td><td>4 bit: 1000 = −8 nhỏ nhất; 0111 = 4 + 2 + 1 = 7 lớn nhất</td></tr>
          <tr><td>n bit có dấu chứa từ âm 2 mũ (n − 1) tới 2 mũ (n − 1) trừ 1</td><td>nhỏ nhất: chỉ bit đầu là 1; lớn nhất: bit đầu 0, còn lại toàn 1</td><td>32 bit: từ −2 147 483 648 tới 2 147 483 647</td></tr>
          <tr><td><b>tràn</b>: đưa vào một giá trị lớn hơn giới hạn, không còn mẫu bit cho nó</td><td>ép thô thì chỉ giữ n bit cuối: quay vòng về số âm nhỏ nhất</td><td>bài 2: 16 bit chứa −32 768 … 32 767; 32 767 + 1 thành −32 768</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Trước hết, ta cần bốn điều, bắt đầu từ cách máy ghi số có dấu bằng n bit, gọi là bù 2. Trong bù 2, bit đầu mang giá trị âm, bằng 2 mũ của n trừ 1, còn các bit sau mang giá trị dương như thường. Ví dụ với 4 bit, mẫu 1, 0, 0, 0 bằng âm 8 là số nhỏ nhất, còn mẫu 0, 1, 1, 1 bằng 4 cộng 2 cộng 1, tức 7, là số lớn nhất. Theo cùng cách đó, số 32 bit có dấu chứa từ âm 2 tỉ 147 triệu 483 nghìn 648 tới 2 tỉ 147 triệu 483 nghìn 647. Đưa vào một giá trị lớn hơn giới hạn là tràn, và nếu ép thô thì nó quay vòng về số âm nhỏ nhất. Ở bài 2, số 16 bit có dấu của tên lửa chỉ chứa từ âm 32 nghìn 768 tới 32 nghìn 767, nên 32 nghìn 767 cộng 1 thành âm 32 nghìn 768."
      - clear: true
        show: |
          <table class="t"><tr><th>điều cần nhớ</th><th>ví dụ số</th></tr>
          <tr><td>chia lấy phần nguyên và phần dư</td><td>100&nbsp;000 giây = 1 ngày (86&nbsp;400) dư 13&nbsp;600 = 3 giờ 46 phút 40 giây</td></tr>
          <tr><td>năm nhuận (từ 1901 tới 2099): năm chia hết cho 4, có 366 ngày</td><td>1972, 2000, 2036 nhuận; 1974 không</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Chia lấy phần nguyên và phần dư thì đổi được giây ra ngày giờ, như 100 nghìn giây là 1 ngày dư 13 nghìn 600 giây, tức 3 giờ 46 phút 40 giây. Từ năm 1901 tới 2099, năm nhuận là năm chia hết cho 4, như 1972, 2000 và 2036."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của bài: mốc gốc, số giây, kiểm kê"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>mốc gốc</b></td><td>00:00:00 giờ quốc tế ngày 1/1/1970; thời điểm được lưu là <b>số giây kể từ mốc gốc</b></td></tr>
          <tr><td><b>kiểu lưu thời gian</b> (<code>time_t</code>)</td><td>kiểu số dùng cho số giây đó; trên nhiều hệ cũ là 32 bit có dấu</td></tr>
          <tr><td><b>quay vòng</b></td><td>vượt giá trị lớn nhất thì nhảy về giá trị nhỏ nhất: thời điểm “lùi” về năm 1901</td></tr>
          <tr><td><b>kiểm kê</b></td><td>liệt kê MỌI nơi lưu hoặc truyền con số đó: mã, cột cơ sở dữ liệu, tệp, giao thức, thiết bị</td></tr>
          <tr><td><b>hạn sớm nhất</b></td><td>ngày đầu tiên một hệ phải xử lý một thời điểm vượt giới hạn — có thể sớm hơn 2038 nhiều năm</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Mốc gốc là 0 giờ ngày 1 tháng 1 năm 1970 theo giờ quốc tế, và một thời điểm được lưu là số giây kể từ mốc gốc. Kiểu lưu thời gian là kiểu số dùng cho số giây đó, trên nhiều hệ cũ là 32 bit có dấu. Quay vòng là vượt giá trị lớn nhất thì nhảy về giá trị nhỏ nhất, nên thời điểm lùi về năm 1901. Kiểm kê là liệt kê mọi nơi lưu hoặc truyền con số đó, từ mã tới thiết bị. Hạn sớm nhất là ngày đầu tiên một hệ phải xử lý một thời điểm vượt giới hạn."

  # ───────────────────────── 4. HÌNH CƠ CHẾ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Thước 32 bit: từ 1901 tới 2038, rồi quay vòng"
    checks:
      - "2 ** 31 - 1 == 0b01111111111111111111111111111111 and 2 ** 31 == 0b10000000000000000000000000000000"
      - "(2 ** 31 - 1 + 1) - 2 ** 32 == -2 ** 31"
    steps:
      - show: |
          <div><svg width="1640" height="380" viewBox="0 0 1640 380">
          <defs><marker id="ar11" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e11d48"/></marker></defs>
          <g font-size="24" fill="#1f2937" text-anchor="middle">
          <rect x="120" y="150" width="700" height="44" fill="#fde2e2" stroke="#e11d48"/>
          <rect x="820" y="150" width="700" height="44" fill="#dcfce7" stroke="#059669"/>
          <text x="470" y="180">số âm: trước 1970</text><text x="1170" y="180">số dương: sau 1970</text>
          <line x1="120" y1="135" x2="120" y2="210" stroke="#1f2937" stroke-width="3"/><line x1="820" y1="135" x2="820" y2="210" stroke="#1f2937" stroke-width="3"/><line x1="1520" y1="135" x2="1520" y2="210" stroke="#1f2937" stroke-width="3"/>
          <text x="120" y="245" font-weight="bold">−2 147 483 648</text><text x="120" y="277">13/12/1901</text>
          <text x="820" y="245" font-weight="bold">0</text><text x="820" y="277">1/1/1970</text>
          <text x="1520" y="245" font-weight="bold">2 147 483 647</text><text x="1520" y="277">19/1/2038</text>
          <path d="M1520,128 C1520,40 120,40 120,128" fill="none" stroke="#e11d48" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#ar11)"/>
          <text x="820" y="32" fill="#e11d48" font-weight="bold">cộng thêm 1 giây: quay vòng về đầu thước</text>
          <text x="820" y="335" font-size="22" fill="#6b7280">bit đầu là bit dấu: 0111…1 (31 chữ số 1) cộng 1 thành 1000…0 — đọc theo bù 2 là số âm nhỏ nhất</text>
          </g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ cả thước 32 bit có dấu thành một đoạn thẳng. Nửa trái là số âm, ứng với thời điểm trước năm 1970, kéo về tới ngày 13 tháng 12 năm 1901. Nửa phải là số dương, kéo tới ngày 19 tháng 1 năm 2038. Bit đầu là bit dấu, nên số lớn nhất là chữ số 0 rồi 31 chữ số 1. Cộng thêm 1 thì thành chữ số 1 rồi 31 chữ số 0, là số âm nhỏ nhất, và thời điểm nhảy về đầu thước."

  # ───────────────────────── 5. SUY RA NGÀY GIỜ ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra: 2 147 483 647 giây là ngày giờ nào?"
    checks:
      - "24 * 60 * 60 == 86400"
      - "divmod(2 ** 31 - 1, 86400) == (24855, 11647)"
      - "divmod(11647, 3600) == (3, 847) and divmod(847, 60) == (14, 7)"
      - "sum(366 if y % 4 == 0 else 365 for y in range(1970, 2038)) == 24837 == 68 * 365 + 17"
      - "24855 - 24837 == 18"
    steps:
      - show: |
          $$2^{31} - 1 = 2\,147\,483\,647 \text{ giây}$$
          <table class="t"><tr><th>bước</th><th>vì sao / phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. một ngày có bao nhiêu giây</td><td>24 giờ nhân 60 phút nhân 60 giây</td><td>$\hlb{86\,400}$ giây</td></tr>
          <tr><td>Bước 2. đổi ra ngày</td><td>2 147 483 647 chia 86 400, lấy phần nguyên và phần dư</td><td>$\hl{24\,855}$ ngày, dư $\hl{11\,647}$ giây</td></tr>
          <tr><td>Bước 3. phần dư ra giờ phút giây</td><td>11 647 = 3 nhân 3600 + 847; 847 = 14 nhân 60 + 7</td><td>$\hlg{03{:}14{:}07}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", "2.4"]
        say: "Bây giờ ta suy ra ngày giờ từ con số 2 mũ 31 trừ 1, tức 2 tỉ 147 triệu 483 nghìn 647 giây. Bước một, một ngày có 24 nhân 60 nhân 60, bằng 86 nghìn 400 giây. Bước hai, ta chia số giây cho 86 nghìn 400, lấy phần nguyên và phần dư. Kết quả là 24 nghìn 855 ngày, dư 11 nghìn 647 giây. Bước ba, phần dư gồm 3 lần 3600 giây, tức 3 giờ, còn 847 giây, tức 14 phút 7 giây, nên giờ là 3 giờ 14 phút 7 giây."
      - clear: true
        show: |
          <p>Còn lại: ngày thứ <b>24 855</b> kể từ 1/1/1970 là ngày nào?</p>
          <table class="t"><tr><th>bước</th><th>vì sao / phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 4. từ 1970 tới hết 2037</td><td>68 năm; năm nhuận 1972, 1976, …, 2036 là 17 năm; 68 nhân 365 + 17</td><td>$\hl{24\,837}$ ngày → hết ngày đó là 1/1/2038</td></tr>
          <tr><td>Bước 5. còn lại trong năm 2038</td><td>24 855 − 24 837</td><td>18 ngày sau 1/1 → $\hlg{19/1/2038}$</td></tr></table>
          <p class="note">Làm thử ngay trên số nhỏ: 100&nbsp;000 giây = 1 ngày dư 13&nbsp;600 giây → 02/1/1970, 03:46:40. Cùng hai phép chia, chỉ khác con số.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Còn lại câu hỏi, ngày thứ 24 nghìn 855 kể từ mốc gốc là ngày nào. Bước bốn, từ 1970 tới hết 2037 có 68 năm, trong đó 17 năm nhuận, nên có 68 nhân 365 cộng 17, bằng 24 nghìn 837 ngày. Bước năm, còn dư 18 ngày sau mùng 1 tháng 1, tức ngày 19 tháng 1 năm 2038. Làm thử với số nhỏ, 100 nghìn giây là 3 giờ 46 phút 40 giây ngày 2 tháng 1 năm 1970."

  # ───────────────────────── 6. VÍ DỤ: MỘT GIÂY SAU, VÀ CÁC CÁCH SỬA ─────────────────────────
  - id: example
    kind: example
    title: "Một giây sau, và hạn của từng cách sửa"
    checks:
      - "divmod(-2 ** 31, 86400) == (-24856, 74752) and divmod(74752, 3600) == (20, 2752) and divmod(2752, 60) == (45, 52)"
      - "sum(366 if y % 4 == 0 else 365 for y in range(1902, 1970)) + 19 == 24856"
      - "__import__('datetime').datetime(1970, 1, 1) + __import__('datetime').timedelta(seconds=2 ** 32 - 1) == __import__('datetime').datetime(2106, 2, 7, 6, 28, 15)"
      - "__import__('datetime').datetime(1970, 1, 1) + __import__('datetime').timedelta(seconds=2 ** 34 - 2 ** 31 - 1) == __import__('datetime').datetime(2446, 5, 10, 22, 38, 55)"
      - "round((2 ** 63 - 1) / 86400 / 365.2425 / 1e9) == 292"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>vì sao / phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. cộng 1 giây vào 2 147 483 647</td><td>quay vòng theo bù 2: thành số âm nhỏ nhất</td><td>$\hl{-2\,147\,483\,648}$</td></tr>
          <tr><td>Bước 2. đổi ra ngày (chia lấy phần nguyên về phía âm)</td><td>−2 147 483 648 = −24 856 ngày + 74 752 giây</td><td>74 752 giây = 20:45:52</td></tr>
          <tr><td>Bước 3. 24 856 ngày trước 1/1/1970</td><td>1902–1969: 68 năm, 17 năm nhuận = 24 837 ngày; thêm 19 ngày cuối năm 1901</td><td>$\hl{13/12/1901}$, 20:45:52</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bây giờ ta xem điều xảy ra một giây sau. Bước một, cộng 1 vào số lớn nhất, theo bù 2 nó quay vòng thành số âm nhỏ nhất. Bước hai, đổi ra ngày theo cách lấy phần nguyên về phía âm, được âm 24 nghìn 856 ngày, cộng 20 giờ 45 phút 52 giây. Bước ba, từ 1902 tới hết 1969 có 24 nghìn 837 ngày, thêm 19 ngày cuối năm 1901, nên máy đọc ra ngày 13 tháng 12 năm 1901."
      - clear: true
        show: |
          <table class="t"><tr><th>cách sửa (nguồn)</th><th>phép tính</th><th>hạn mới</th></tr>
          <tr><td>Bước 4. 32 bit <b>không dấu</b>: thư viện C chuẩn glibc 2.40 cho bản ghi đăng nhập; MariaDB 11.5 cho cột TIMESTAMP</td><td>2 mũ 32 trừ 1 = 4 294 967 295 giây</td><td>$\hl{7/2/2106}$, 06:28:15 — đúng hai nguồn ghi</td></tr>
          <tr><td>Bước 5. <b>34 bit</b>: hệ tệp ext4 với nút chỉ mục (bản ghi mô tả một tệp) lớn hơn 128 byte</td><td>thêm 2 bit: 2 mũ 34 − 2 mũ 31 − 1 giây</td><td>$\hl{10/5/2446}$ — nguồn ghi “tháng 5/2446”</td></tr>
          <tr><td>Bước 6. <b>64 bit</b> có dấu: glibc 2.34 cho phép, nhưng trên x86 32 bit mặc định vẫn là 32 bit (ghi chú của bản 2.34)</td><td>2 mũ 63 giây chia số giây một năm</td><td>khoảng $\hlg{292}$ tỉ năm</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Mỗi cách sửa có một hạn mới, và ta tính được từng hạn. Bước bốn, 32 bit không dấu cho tới ngày 7 tháng 2 năm 2106. Đó đúng là ngày mà thư viện C chuẩn bản 2.40 và một hệ quản trị cơ sở dữ liệu bản 11.5 ghi. Bước năm, khi nút chỉ mục, tức bản ghi mô tả một tệp, đủ lớn, một hệ tệp phổ biến thêm 2 bit thành 34 bit, nên hạn lùi tới tháng 5 năm 2446. Bước sáu, 64 bit có dấu cho khoảng 292 tỉ năm, nhưng theo ghi chú bản 2.34, trên máy x86 32 bit, thư viện C chuẩn mặc định vẫn dùng 32 bit."
      - clear: true
        show: |
          <p><b>Cùng cơ chế, đã xảy ra trong phòng thử:</b> Cục Hàng không Liên bang Mỹ, chỉ thị năm 2015 cho máy bay 787:</p>
          <table class="t"><tr><th>dữ kiện (nguồn ghi)</th><th>suy luận của bài (nguồn KHÔNG ghi)</th></tr>
