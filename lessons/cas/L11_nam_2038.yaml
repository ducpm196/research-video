        focus: [1, "1.2", "1.3", "1.4", 2, 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với ba hệ và số minh hoạ, năm hiện tại là 2026. Hệ A là ứng dụng thành viên chạy trên máy chủ 64 bit, nhưng cột hạn thẻ là kiểu cũ, và thẻ có hạn 10 năm. Hệ B là 2000 đồng hồ đo điện lắp năm 2026, dùng 15 năm, ghi giờ bằng 32 bit có dấu, và không cập nhật từ xa được. Hệ C là bảng nhật ký đăng nhập đã dùng 32 bit không dấu. Với mỗi hệ, hạn sớm nhất là năm nào, bạn xếp thứ tự sửa ra sao, và đổi lại mất gì? Dừng video và viết ra giấy."
