# Quy ước: “số giây kể từ mốc gốc” = số giây kể từ 00:00:00 giờ quốc tế ngày 1/1/1970 (Unix time); “32 bit có dấu” = bù 2 như khoá CSA:
#   từ −2³¹ tới 2³¹ − 1. Tên kiểu time_t, thư viện glibc, hệ tệp ext4, MariaDB chỉ ghi trên màn hình; lời đọc nói “kiểu lưu thời gian”,
#   “thư viện C chuẩn”, “một hệ tệp phổ biến”, “một hệ quản trị cơ sở dữ liệu mã nguồn mở”. 787 đọc là “máy bay chở khách 787”; FAA
#   đọc “Cục Hàng không Liên bang Mỹ”. Đơn vị của bộ đếm trong 787 KHÔNG có trong nguồn: bài chỉ thử một giả thuyết và nói rõ như vậy.
#   Mọi ngày giờ là phép tính lại (checks + audit/cas/ver/L11.py), khớp với ngày giờ nguồn ghi ([MDB], [EXT4]).
objectives:
  - "Tính thời điểm số giây 32 bit có dấu kể từ 1970 tràn, và thời điểm nó quay về sau một giây"
  - "Tính hạn của các cách sửa: không dấu, 34 bit, 64 bit"
  - "Kiểm kê mọi nơi một số giây 32 bit được lưu: mã, cột cơ sở dữ liệu, định dạng tệp, giao thức, thiết bị nhúng, ngày trong tương lai"
  - "Xếp thứ tự di chuyển theo hạn SỚM NHẤT của từng hệ, không theo năm 2038"
