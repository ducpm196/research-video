          <tr><td>B. 2000 đồng hồ đo điện</td><td>lắp năm 2026, dùng <b>15 năm</b>, ghi giờ 32 bit có dấu, <b>không cập nhật từ xa được</b></td></tr>
          <tr><td>C. bảng nhật ký đăng nhập</td><td>đã dùng 32 bit không dấu</td></tr></table>
