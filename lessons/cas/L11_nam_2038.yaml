  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">giới hạn biết trước: 2 mũ 31 − 1 giây</span><span class="a">→</span>
          <span class="n">tính ra giây tràn và giây quay vòng</span><span class="a">→</span>
          <span class="n">kiểm kê mọi nơi lưu, truyền</span><span class="a">→</span>
          <span class="n">hạn sớm nhất của từng hệ</span><span class="a">→</span>
          <span class="n">sửa theo hạn, diễn tập với đồng hồ 2038</span></div>
        say: "Tổng kết lại, giới hạn đã biết trước là 2 mũ 31 trừ 1 giây, từ đó ta tính ra đúng giây tràn và giây quay vòng. Sau đó ta kiểm kê mọi nơi con số được lưu và truyền, tính hạn sớm nhất của từng hệ, rồi sửa theo thứ tự hạn và diễn tập với đồng hồ đặt sang năm 2038."
      - show: |
          <div class="box key"><b>Tư duy:</b> sự cố biết trước vẫn xảy ra nếu không ai <b>kiểm kê</b>. Hạn thật là 2038 trừ đi khoảng thời gian dài nhất mà hệ phải nhìn về tương lai.</div>
        say: "Điều cần mang theo, một sự cố biết trước vẫn xảy ra nếu không ai kiểm kê. Hạn thật của một hệ là năm 2038 trừ đi khoảng thời gian dài nhất mà hệ đó phải nhìn về tương lai."
      - clear: true
        show: |
          <div class="chain"><span class="n">bài 0: dòng thời gian, lớp phòng vệ</span><span class="a">→</span>
          <span class="n">bài 1–3: con số và đơn vị</span><span class="a">→</span>
          <span class="n">bài 4–6: tác vụ, triển khai, khôi phục</span><span class="a">→</span>
          <span class="n">bài 7–10: mẫu chuỗi, sao lưu, độ dài, mô hình</span><span class="a">→</span>
          <span class="n">bài 11: sự cố biết trước</span></div>
          <p class="note">Đây là bài cuối của khoá Tình huống chuyên gia. Mỗi sự cố đều có nhiều nguyên nhân góp phần, và một con số tính lại được từ kiến thức nền.</p>
        focus: [0, 1, 1, 2, 0]
        say: "Đây là bài cuối của khoá Tình huống chuyên gia. Ta đi từ cách viết hậu kiểm ở bài 0, qua con số và đơn vị ở bài 1 tới 3, rồi tác vụ, triển khai, khôi phục ở bài 4 tới 6. Sau đó là mẫu chuỗi, sao lưu, phép kiểm độ dài và mô hình dự báo ở bài 7 tới 10. Sự cố nào cũng có nhiều nguyên nhân góp phần, và một con số tính lại được từ kiến thức nền. Cảm ơn bạn đã theo học khoá này tới tận bài cuối cùng."
