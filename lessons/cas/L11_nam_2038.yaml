          <tr><td>2. A</td><td>thêm cột 64 bit, chép dữ liệu, đọc cả hai trong thời gian chuyển, rồi bỏ cột cũ — xong trước 2028</td><td>một lần chuyển dữ liệu phải diễn tập; mã đọc hai cột tạm thời phức tạp hơn</td></tr>
          <tr><td>3. C</td><td>ghi vào danh mục kiểm kê, không làm ngay</td><td>nợ kỹ thuật được ghi rõ thay vì quên</td></tr></table>
