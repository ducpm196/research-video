          <tr><td>biện pháp: tắt điện định kỳ, không quá <b>120 ngày</b> một lần; chỉ thị tự gọi là “biện pháp tạm thời”</td><td>bốn bộ dự phòng cùng một giả định → lọt cùng lúc, như bài 0</td></tr></table>
