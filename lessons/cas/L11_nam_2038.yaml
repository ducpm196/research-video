      - clear: true
        show: |
          <table class="t"><tr><th>hệ</th><th>hạn sớm nhất</th><th>vì sao</th></tr>
          <tr><td>A</td><td>2038 − 10 = $\hl{2028}$</td><td>từ năm 2028, thẻ mới có hạn sau 19/1/2038: cột cũ không ghi được</td></tr>
          <tr><td>B</td><td>$\hl{ngay bây giờ}$</td><td>2026 + 15 = 2041 vượt 2038, mà sau khi lắp thì không sửa được</td></tr>
