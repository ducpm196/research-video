scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một phép kiểm biên bị thiếu, hơn hai năm"
    checks:
      - "(__import__('datetime').date(2014, 4, 7) - __import__('datetime').date(2012, 3, 14)).days == 754"
    steps:
      - show: |
          <div class="box warn">“Thiếu một phép kiểm biên khi xử lý phần mở rộng nhịp tim … có thể để lộ tới 64k bộ nhớ cho máy bên kia.” <span class="note">— bản tin bảo mật của OpenSSL, 7/4/2014</span></div>
          <table class="t"><tr><th>mốc</th><th>theo trang heartbleed.com</th></tr>
          <tr><td>14/3/2012</td><td>bản 1.0.1 của thư viện mã hoá mã nguồn mở <b>phổ biến nhất</b> mang lỗi ra dùng thật</td></tr>
          <tr><td>7/4/2014</td><td>bản 1.0.1g sửa lỗi — sau <b>754 ngày</b></td></tr>
          <tr><td>ảnh hưởng</td><td>hai <b>phần mềm</b> máy chủ trang mạng mã nguồn mở dùng thư viện này chiếm <b>hơn 66%</b> trang đang hoạt động (khảo sát 4/2014); khai thác <b>không để lại dấu vết</b> trong nhật ký</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.4"]
        say: "Chào bạn, ngày 7 tháng 4 năm 2014, thư viện mã hoá mã nguồn mở phổ biến nhất ra một bản tin bảo mật. Bản tin viết rằng thiếu một phép kiểm biên khi xử lý phần mở rộng nhịp tim có thể để lộ tới 64 nghìn byte bộ nhớ cho máy bên kia. Lỗi đã ra dùng thật từ bản phát hành ngày 14 tháng 3 năm 2012. Bản sửa ra ngày 7 tháng 4 năm 2014, sau 754 ngày. Theo một khảo sát tháng 4 năm 2014, hai phần mềm máy chủ trang mạng mã nguồn mở dùng thư viện này chiếm hơn 66 phần trăm số trang đang hoạt động. Và việc khai thác không để lại dấu vết bất thường nào trong nhật ký."
      - show: |
          <div class="box key">Hôm nay — chỉ ở mức <b>phòng thủ</b>: đọc cấu trúc tin, suy ra điều kiện kiểm đúng bằng số, và rút ra quy tắc cho mọi định dạng tin có trường độ dài.</div>
        say: "Hôm nay ta chỉ học ở mức phòng thủ. Ta đọc cấu trúc của tin nhịp tim, suy ra điều kiện kiểm đúng bằng số, rồi rút ra một quy tắc cho mọi định dạng tin có trường độ dài."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: số không dấu, đọc vượt biên, khoá bí mật trong bộ nhớ"
    checks:
      - "2 * 8 == 16 and 2 ** 2 - 1 == 3 and len(['00', '01', '10', '11']) == 2 ** 2"
      - "2 ** 16 - 1 == 65535 and 2 ** 8 - 1 == 255"
      - "19 + 1 == 20 and 30 - 20 == 10"
    steps:
      - show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>bit</b> là một chữ số 0 hoặc 1; <b>byte</b> là 8 bit</td><td>máy lưu mọi thứ bằng chữ số nhị phân</td><td>2 byte = 16 bit</td></tr>
          <tr><td><b>số không dấu</b> k bit đi từ 0 tới 2 mũ k trừ 1</td><td>k bit có 2 mũ k mẫu (mỗi bit 2 cách chọn); bắt đầu từ 0 nên số lớn nhất kém 1</td><td>2 bit: 00, 01, 10, 11 = 0 tới 3; 8 bit: tới 255; 16 bit: tới 2 mũ 16 − 1 = <b>65&nbsp;535</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.3"]
        say: "Trước hết, ta cần hiểu ba điều về bộ nhớ và về cách hai máy nói chuyện an toàn. Một bit là một chữ số 0 hoặc 1, còn một byte là 8 bit, nên 2 byte là 16 bit. Với k bit có 2 mũ k mẫu khác nhau, vì mỗi bit có hai cách chọn, và số không dấu dùng các mẫu đó cho các số từ 0 trở lên. Bắt đầu từ 0 nên số lớn nhất là 2 mũ k trừ 1, như 2 bit chứa từ 0 tới 3. Vậy 8 bit tới 255, còn 16 bit, tức 2 byte, tới 65 nghìn 535."
      - clear: true
        show: |
          <table class="t"><tr><th>điều cần hiểu</th><th>vì sao</th><th>ví dụ số</th></tr>
          <tr><td><b>bộ nhớ</b> là một dãy ô liền nhau, mỗi ô 1 byte; chương trình đặt nhiều dữ liệu khác nhau sát cạnh nhau</td><td>dùng hết chỗ, không chừa khoảng trống</td><td>vùng A: ô 0 tới ô 19; dữ liệu khác bắt đầu ngay từ ô 20</td></tr>
          <tr><td><b>đọc vượt biên</b>: đọc quá cuối một vùng nhớ là đọc sang dữ liệu của thứ khác nằm kề bên</td><td>máy chỉ đọc lần lượt các ô, không tự chặn</td><td>vùng 20 byte mà đọc 30 byte: 10 byte cuối không thuộc vùng đó</td></tr>
          <tr><td><b>lớp mã hoá kết nối</b>: mã hoá dữ liệu giữa trình duyệt và máy chủ; máy chủ dùng một <b>khoá bí mật</b> chỉ nó biết để chứng minh danh tính và lập kết nối; khoá nằm trong bộ nhớ của <b>tiến trình</b> (chương trình đang chạy)</td><td>khoá phải nằm trong bộ nhớ thì mới dùng được</td><td>bộ nhớ kề bên có thể chứa khoá, mật khẩu, nội dung của người khác</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Bộ nhớ là một dãy ô liền nhau, mỗi ô 1 byte, và một chương trình đặt nhiều dữ liệu khác nhau sát cạnh nhau. Ví dụ vùng A chiếm từ ô 0 tới ô 19 thì dữ liệu khác bắt đầu ngay từ ô 20. Đọc vượt biên là đọc quá cuối một vùng nhớ, tức là đọc sang dữ liệu của thứ khác nằm kề bên, vì máy chỉ đọc lần lượt các ô mà không tự chặn. Vùng 20 byte mà đọc 30 byte thì 10 byte cuối không thuộc vùng đó. Lớp mã hoá kết nối là phần mềm mã hoá dữ liệu giữa trình duyệt và máy chủ, và máy chủ dùng một khoá bí mật chỉ nó biết để chứng minh danh tính. Khoá đó nằm trong bộ nhớ của tiến trình, tức chương trình đang chạy, cạnh mật khẩu và nội dung của người dùng."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của định dạng tin"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa (theo RFC 6520, 2/2012)</th></tr>
          <tr><td><b>tin nhịp tim</b></td><td>một bên gửi “còn sống không?”; bên kia <b>phải</b> trả lời bằng một bản chép <b>đúng</b> phần dữ liệu đã nhận</td></tr>
          <tr><td><b>độ dài khai báo</b></td><td>trường 2 byte trong tin, do <b>bên gửi</b> tự ghi: “phần dữ liệu dài n byte”</td></tr>
          <tr><td><b>phần đệm</b></td><td>byte ngẫu nhiên ở cuối, ít nhất 16 byte; bên nhận bỏ qua</td></tr>
          <tr><td><b>độ dài thật</b> L của bản ghi</td><td>số byte thật sự đã nhận, do lớp bên dưới đếm — bên gửi không sửa được</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ, theo đặc tả năm 2012 của phần mở rộng này. Tin nhịp tim là khi một bên hỏi còn sống không, và bên kia phải trả lời bằng một bản chép đúng phần dữ liệu đã nhận. Độ dài khai báo là trường 2 byte trong tin, do chính bên gửi tự ghi, nói rằng phần dữ liệu dài n byte. Phần đệm là các byte ngẫu nhiên ở cuối, ít nhất 16 byte, và bên nhận bỏ qua. Còn độ dài thật L của bản ghi là số byte thật sự đã nhận, do lớp bên dưới đếm, bên gửi không sửa được."

  # ───────────────────────── 4. HÌNH CƠ CHẾ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai con số độ dài: một do bên kia nói, một do mình đếm"
    steps:
      - show: |
          <div><svg width="1680" height="400" viewBox="0 0 1680 400">
          <g font-size="22" fill="#1f2937" text-anchor="middle">
          <text x="20" y="40" text-anchor="start" font-weight="bold">bản ghi nhận được: L = 20 byte (số minh hoạ)</text>
          <rect x="20" y="60" width="60" height="70" fill="#e0ecfb" stroke="#2a78d6" stroke-width="2"/><text x="50" y="102">loại</text>
          <rect x="80" y="60" width="120" height="70" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="140" y="92">độ dài</text><text x="140" y="120" font-size="19">2 byte</text>
          <rect x="200" y="60" width="60" height="70" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="230" y="102">dữ</text>
          <rect x="260" y="60" width="480" height="70" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="500" y="102">phần đệm 16 byte</text>
          <text x="20" y="175" text-anchor="start">1 + 2 + 1 + 16 = 20 byte: khớp đúng L</text>
          <rect x="760" y="60" width="900" height="70" fill="#fde2e2" stroke="#e11d48" stroke-width="2" stroke-dasharray="8 6"/>
          <text x="1210" y="92" fill="#e11d48">bộ nhớ kề bên: khoá, mật khẩu, dữ liệu của người khác</text><text x="1210" y="120" font-size="19" fill="#e11d48">không thuộc bản ghi</text>
          <text x="20" y="250" text-anchor="start" font-weight="bold">trả lời = chép n byte, bắt đầu từ ô “dữ”</text>
          <line x1="200" y1="285" x2="260" y2="285" stroke="#059669" stroke-width="8"/>
          <text x="20" y="292" text-anchor="start" fill="#059669">n = 1</text>
          <line x1="200" y1="345" x2="1660" y2="345" stroke="#e11d48" stroke-width="8"/>
          <text x="20" y="352" text-anchor="start" fill="#e11d48">n tin theo trường</text>
          <text x="1000" y="385" font-size="20" fill="#e11d48">không kiểm: chép vượt ra ngoài bản ghi</text>
          </g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ một bản ghi nhận được dài 20 byte, một số minh hoạ. Trong đó có 1 byte loại, 2 byte độ dài, 1 byte dữ liệu, và 16 byte đệm, cộng lại đúng 20. Câu trả lời phải chép n byte bắt đầu từ ô dữ liệu, và n lấy từ trường độ dài do bên kia khai. Nếu không đối chiếu n với độ dài thật, một con số khai lớn hơn sẽ làm phần chép chạy vượt ra ngoài bản ghi, sang vùng nhớ kề bên có thể chứa khoá và mật khẩu."

  # ───────────────────────── 5. SUY RA ĐIỀU KIỆN ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra điều kiện kiểm đúng từ cấu trúc tin"
    checks:
      - "1 + 2 + 1 + 16 == 20 and 20 - 3 - 1 == 16"
      - "(lambda n, L: 1 + 2 + n + 16 <= L)(1, 20) and not (lambda n, L: 1 + 2 + n + 16 <= L)(2, 20)"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>vì sao</th><th>kết quả</th></tr>
          <tr><td>Bước 1. các phần cộng lại bằng bản ghi</td><td>theo đặc tả: loại 1 byte, độ dài 2 byte, dữ liệu n byte, đệm p byte</td><td>1 + 2 + n + p = L</td></tr>
          <tr><td>Bước 2. tính phần đệm</td><td>chuyển vế 1 + 2 + n sang bên phải</td><td>p = L − 3 − n</td></tr>
          <tr><td>Bước 3. đặc tả đòi đệm ít nhất 16</td><td>thay p ở bước 2 vào điều kiện p ≥ 16</td><td>L − 3 − n ≥ 16</td></tr>
          <tr><td>Bước 4. viết lại cho dễ kiểm</td><td>chuyển 3 + n sang bên kia</td><td>$\hlg{1 + 2 + n + 16 \leq L}$ — sai thì <b>bỏ qua lặng lẽ</b></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Bây giờ ta suy ra điều kiện kiểm đúng từ chính cấu trúc tin. Bước một, theo đặc tả, loại 1 byte, độ dài 2 byte, dữ liệu n byte và đệm p byte cộng lại bằng độ dài bản ghi L. Bước hai, chuyển vế 1 cộng 2 cộng n sang bên phải, ta được p bằng L trừ 3 trừ n. Bước ba, đặc tả đòi phần đệm ít nhất 16, nên thay p vào, được L trừ 3 trừ n lớn hơn hoặc bằng 16. Bước bốn, chuyển 3 cộng n sang bên kia, điều kiện thành 1 cộng 2 cộng n cộng 16 không vượt L. Đặc tả viết, nếu độ dài khai báo quá lớn thì tin phải bị bỏ qua lặng lẽ."
      - show: |
          <p>Làm thử ngay với bản ghi L = 20 byte: n = 1 cho 1 + 2 + 1 + 16 = 20 ≤ 20, <b>nhận</b>; n = 2 cho 21 &gt; 20, <b>bỏ</b>. Đây đúng là phép kiểm mà bản vá ngày 6/4/2014 thêm vào, chú thích “bỏ qua lặng lẽ theo RFC 6520 mục 4”.</p>
        focus: [1, 1]
        say: "Làm thử ngay với bản ghi 20 byte, n bằng 1 cho 1 cộng 2 cộng 1 cộng 16 bằng 20, không vượt 20, nên nhận, còn n bằng 2 cho 21, vượt 20, nên bỏ. Đây đúng là phép kiểm mà bản vá năm 2014 thêm vào, kèm chú thích bỏ qua lặng lẽ theo đặc tả."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính lại bằng số: khai báo lớn nhất, phần vượt, giới hạn của đặc tả"
    checks:
      - "2 ** 16 - 1 == 65535 and 1 + 2 + 65535 + 16 == 65554 and 65554 > 20"
      - "65535 - (20 - 3) == 65518"
      - "2 ** 14 == 16384 and 16384 - 19 == 16365"
      - "1 + 2 + 16 == 19"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. độ dài khai báo lớn nhất</td><td>trường 2 byte = 16 bit: 2 mũ 16 − 1</td><td>$\hl{65\,535}$ byte — khớp “tới 64k” của bản tin</td></tr>
          <tr><td>Bước 2. kiểm với bản ghi 20 byte</td><td>1 + 2 + 65&nbsp;535 + 16</td><td>65&nbsp;554 &gt; 20: <b>bỏ</b></td></tr>
          <tr><td>Bước 3. nếu thiếu phép kiểm</td><td>chép 65&nbsp;535 byte, nhưng từ ô dữ liệu tới cuối bản ghi chỉ có 20 − 3 = 17 byte: 65&nbsp;535 − 17</td><td>$\hl{65\,518}$ byte nằm ngoài bản ghi</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.4"]
        say: "Ta tính lại bằng số. Bước một, trường độ dài có 2 byte, tức 16 bit, nên khai báo lớn nhất là 2 mũ 16 trừ 1, bằng 65 nghìn 535 byte, khớp chữ tới 64 nghìn byte của bản tin. Bước hai, kiểm với bản ghi 20 byte, 1 cộng 2 cộng 65 nghìn 535 cộng 16 là 65 nghìn 554, vượt xa 20, nên phải bỏ. Bước ba, nếu thiếu phép kiểm thì máy vẫn chép 65 nghìn 535 byte. Nhưng từ ô dữ liệu tới cuối bản ghi chỉ có 20 trừ 3, tức 17 byte, nên 65 nghìn 518 byte trả về nằm ngoài bản ghi."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 4. bản ghi ngắn nhất hợp lệ</td><td>n = 0: 1 + 2 + 0 + 16</td><td>$\hl{19}$ byte — bản vá kiểm điều này <b>trước</b> khi đọc trường độ dài</td></tr>
          <tr><td>Bước 5. đặc tả còn giới hạn cả tin</td><td>tổng tin không vượt 2 mũ 14 = 16&nbsp;384 byte; trừ 19</td><td>n hợp lệ lớn nhất: $\hlg{16\,365}$</td></tr>
          <tr><td>Bước 6. với biến thể chạy trên gói tin rời, bản vá kiểm thêm</td><td>độ dài câu trả lời 1 + 2 + n + 16 không vượt giới hạn tối đa</td><td>không bao giờ tạo câu trả lời quá cỡ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bản vá còn những phép kiểm khác. Bước bốn, bản ghi ngắn nhất hợp lệ, với n bằng 0, dài 1 cộng 2 cộng 16 là 19 byte, và bản vá kiểm điều này trước cả khi đọc trường độ dài. Bước năm, đặc tả giới hạn cả tin không vượt 2 mũ 14, tức 16 nghìn 384 byte, trừ 19 thì n hợp lệ lớn nhất là 16 nghìn 365. Bước sáu, với biến thể chạy trên gói tin rời, bản vá kiểm thêm độ dài câu trả lời không vượt giới hạn tối đa."
      - show: |
          <p class="note">Bộ nhớ lộ ra là phần tình cờ nằm kề trong tiến trình, nên mỗi lần một khác. Trang heartbleed.com: giới hạn 64 KB chỉ là cho <b>một</b> lần; lặp lại thì lộ thêm.</p>
        say: "Bộ nhớ lộ ra là phần tình cờ nằm kề trong tiến trình, nên mỗi lần một khác. Trang thông tin về lỗi ghi rõ, giới hạn 64 nghìn byte chỉ là cho một lần, lặp lại thì lộ thêm."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Kiểm bằng đường khác: thử hết mọi độ dài khai báo"
    checks:
      - "[n for n in range(65536) if 1 + 2 + n + 16 <= 20] == [0, 1]"
      - "max(n for n in range(65536) if 1 + 2 + n + 16 <= 16384) == 16365"
      - "sum(1 for n in range(65536) if 1 + 2 + n + 16 > 20) == 65534"
      - "sum(1 for n in range(65536) if 1 + 2 + n > 20) == 65518"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>điều kiện với L = 20</td><td>thử hết 65&nbsp;536 giá trị của trường 2 byte, từ 0 tới 65&nbsp;535: chỉ n = 0 và n = 1 được nhận; 65&nbsp;534 giá trị bị bỏ ✓</td></tr>
          <tr><td>16&nbsp;365</td><td>thử hết với L = 16&nbsp;384: giá trị lớn nhất được nhận là 16&nbsp;365; 16&nbsp;365 + 19 = 16&nbsp;384 ✓</td></tr>
          <tr><td>phép kiểm cũ “thiếu”</td><td>không kiểm gì thì cả 65&nbsp;536 giá trị đều được nhận; với n từ 18 trở lên, 3 + n vượt 20: 65&nbsp;518 giá trị đọc vượt biên ✓</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Ta kiểm bằng đường khác, thử hết mọi giá trị. Trường 2 byte có 65 nghìn 536 giá trị, từ 0 tới 65 nghìn 535. Với bản ghi 20 byte, chỉ n bằng 0 và n bằng 1 được nhận, còn 65 nghìn 534 giá trị bị bỏ. Với L bằng 16 nghìn 384, giá trị lớn nhất được nhận đúng là 16 nghìn 365, vì cộng thêm 19 ra đúng 16 nghìn 384. Còn khi không kiểm gì, cả 65 nghìn 536 giá trị đều được nhận, và với n từ 18 trở lên, 3 cộng n vượt 20, nên 65 nghìn 518 giá trị đọc vượt biên."

  # ───────────────────────── 8. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai hay gặp"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Đừng dùng thư viện mã nguồn mở”</td><td>đây là thư viện mã hoá phổ biến nhất, cả mạng cùng dựa vào; tự viết lại cũng phải kiểm đúng điều kiện ấy</td><td>đầu tư chung vào rà soát, kiểm thử điều kiện biên của thư viện mọi người cùng dùng</td></tr>
          <tr><td><b class="red">2.</b> “Vá xong là xong”</td><td>khai thác không để dấu vết: khoá bí mật có thể đã lộ</td><td>như trang thông tin về lỗi: vá, thu hồi khoá cũ, cấp khoá mới, rồi người dùng đổi mật khẩu</td></tr>
          <tr><td><b class="red">3.</b> “Chỉ 64 KB, thiệt hại nhỏ”</td><td>64 KB là cho <b>một</b> lần; có thể lặp lại nhiều lần</td><td>đánh giá thiệt hại theo thứ có thể nằm trong bộ nhớ, không theo cỡ một lần</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.4", "1.4"]
        say: "Bài học sai thứ nhất là kết luận đừng dùng thư viện mã nguồn mở. Đây là thư viện mã hoá phổ biến nhất, cả mạng cùng dựa vào, và tự viết lại thì vẫn phải kiểm đúng điều kiện ấy. Bài học đúng là đầu tư chung vào rà soát và kiểm thử điều kiện biên. Bài học sai thứ hai là nghĩ vá xong là xong. Vì khai thác không để dấu vết, khoá bí mật có thể đã lộ, nên phải vá, thu hồi khoá cũ, cấp khoá mới, rồi người dùng đổi mật khẩu. Bài học sai thứ ba là nghĩ chỉ 64 nghìn byte nên thiệt hại nhỏ, trong khi đó chỉ là cho một lần, và có thể lặp lại nhiều lần."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">4.</b> “Bên gửi là phần mềm chuẩn, nó sẽ khai đúng” (người đã đi làm)</td><td>trường độ dài nằm trong tin, do <b>bên gửi</b> ghi; độ dài thật chỉ bên nhận đếm được</td><td>quy tắc: mọi độ dài, số đếm, chỉ số đến từ bên ngoài phải đối chiếu với độ dài <b>thật</b> đã nhận, <b>trước</b> khi dùng</td></tr>
          <tr><td><b class="red">5.</b> “Tính năng nào cũng nên bật sẵn”</td><td>trang thông tin về lỗi: ai chưa nâng cấp ngay được thì dịch lại thư viện <b>không có</b> phần nhịp tim</td><td>tắt phần không dùng để thu nhỏ chỗ có thể sai</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ tư hay gặp ở người đã đi làm, tin rằng bên gửi là phần mềm chuẩn nên sẽ khai đúng. Trường độ dài nằm trong tin do bên gửi ghi, còn độ dài thật chỉ bên nhận đếm được. Vì vậy quy tắc là mọi độ dài, số đếm hay chỉ số đến từ bên ngoài đều phải đối chiếu với độ dài thật trước khi dùng. Bài học sai thứ năm là bật sẵn mọi tính năng. Trang thông tin về lỗi khuyên ai chưa nâng cấp ngay được thì dịch lại thư viện không có phần nhịp tim, tức là tắt phần không dùng để thu nhỏ chỗ có thể sai."

  # ───────────────────────── 9. BẠN SẼ LÀM GÌ ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì?"
    checks:
      - "not (2 + 300 <= 50) and 2 + 48 <= 50"
      - "50 - 2 == 48"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ)</th></tr>
          <tr><td>1</td><td>Bạn viết phần đọc một định dạng tin riêng: <b>2 byte độ dài</b> rồi tới dữ liệu, không có đệm. Một tin thật dài <b>50 byte</b>, trường độ dài ghi <b>300</b>. Viết điều kiện kiểm và cho biết nhận hay bỏ. Độ dài khai báo lớn nhất được nhận là bao nhiêu?</td></tr>
          <tr><td>2</td><td>Sáng nay có bản tin về một lỗi giống hệt trong thư viện bạn dùng. Vá ngay rồi thôi, hay vá <b>và</b> thay khoá, buộc người dùng đổi mật khẩu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với số minh hoạ. Câu một, bạn viết phần đọc một định dạng tin riêng, gồm 2 byte độ dài rồi tới dữ liệu, không có đệm. Một tin thật dài 50 byte mà trường độ dài ghi 300, hãy viết điều kiện kiểm và cho biết nhận hay bỏ. Độ dài khai báo lớn nhất được nhận là bao nhiêu? Câu hai, sáng nay có bản tin về một lỗi giống hệt trong thư viện bạn dùng, bạn vá ngay rồi thôi, hay vá và thay khoá, buộc người dùng đổi mật khẩu? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: bước</th><th>vì sao</th><th>kết quả</th></tr>
          <tr><td>Bước 1. điều kiện</td><td>các phần cộng lại không được vượt độ dài thật: 2 + n ≤ L</td><td>2 + n ≤ 50</td></tr>
          <tr><td>Bước 2. thay n = 300</td><td>2 + 300 = 302</td><td>302 &gt; 50: $\hl{\text{bỏ}}$</td></tr>
          <tr><td>Bước 3. lớn nhất được nhận</td><td>chuyển vế: n ≤ 50 − 2</td><td>n lớn nhất $\hlg{48}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, giải từng bước. Bước một, các phần cộng lại không được vượt độ dài thật, nên điều kiện là 2 cộng n không vượt 50. Bước hai, thay n bằng 300, được 302, vượt 50, nên bỏ tin. Bước ba, chuyển vế, n không vượt 50 trừ 2, nên độ dài khai báo lớn nhất được nhận là 48."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>chỉ vá</td><td>nhanh, không làm phiền ai</td><td>nếu khoá đã lộ — mà khai thác không để dấu vết — kẻ có khoá vẫn giả được máy chủ, giải mã được lưu lượng</td></tr>
          <tr><td><b>vá, thu hồi và cấp khoá mới, rồi đổi mật khẩu</b></td><td>khôi phục được niềm tin vào khoá; trang heartbleed.com khuyên đúng thứ tự này</td><td>tốn công, có thể tốn phí cấp chứng chỉ; người dùng phải đổi mật khẩu</td></tr></table>
          <p class="note">Chọn vá và thay khoá. Điều kiện đổi: chỉ khi chứng minh được tiến trình có lỗi chưa từng giữ khoá hay dữ liệu bí mật nào.</p>
        focus: [1, "1.2", "1.3", "1.3", 2]
        say: "Đáp án câu hai là một đánh đổi. Chỉ vá thì nhanh và không làm phiền ai, nhưng nếu khoá đã lộ thì kẻ có khoá vẫn giả được máy chủ và giải mã được lưu lượng, mà ta không có dấu vết để biết. Vá, thu hồi và cấp khoá mới, rồi đổi mật khẩu thì khôi phục được niềm tin, đúng thứ tự trang thông tin về lỗi khuyên. Đổi lại tốn công, có thể tốn phí chứng chỉ, và người dùng phải đổi mật khẩu. Vậy nên chọn vá và thay khoá, trừ khi chứng minh được tiến trình có lỗi chưa từng giữ khoá hay dữ liệu bí mật nào."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Thay đổi hệ thống & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">trường độ dài 2 byte do bên gửi ghi</span><span class="a">→</span>
          <span class="n">thiếu đối chiếu với độ dài thật</span><span class="a">→</span>
          <span class="n">chép vượt biên, lộ bộ nhớ kề</span><span class="a">→</span>
          <span class="n">kiểm 1 + 2 + n + 16 ≤ L; vá, thay khoá</span></div>
        say: "Tổng kết lại, trường độ dài 2 byte do bên gửi ghi, phần mềm thiếu bước đối chiếu với độ dài thật, nên câu trả lời chép vượt biên và lộ bộ nhớ kề. Cách sửa là kiểm 1 cộng 2 cộng n cộng 16 không vượt L, rồi vá và thay khoá."
      - show: |
          <div class="box key"><b>Tư duy:</b> con số do bên ngoài khai là một <b>lời khai</b>, không phải sự thật. Mọi độ dài phải được đối chiếu với thứ mình tự đếm được, trước khi dùng.</div>
        say: "Điều cần mang theo, con số do bên ngoài khai chỉ là một lời khai, không phải sự thật. Mọi độ dài phải được đối chiếu với thứ mình tự đếm được, trước khi dùng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): Google Flu Trends, 2013 — mô hình đúng hôm qua, sai gấp đôi hôm nay: khi dữ liệu lớn thay đổi dưới chân mô hình.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta đọc về dịch vụ dự báo cúm của Google, một mô hình đúng hôm qua mà sai gấp đôi hôm nay, khi dữ liệu thay đổi dưới chân mô hình. Hẹn gặp bạn ở bài tiếp theo."
