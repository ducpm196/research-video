# ═══ BÀI TÌNH HUỐNG — lỗ hổng Heartbleed (CVE-2014-0160), công bố 7/4/2014; case-lessons.md §1–§4; CHỈ mức khái niệm phòng thủ ═══
id: L09
course: CAS
series: "CAS · Tình huống chuyên gia"
title: "Bài 9 — Heartbleed (2014): thiếu một phép kiểm độ dài"
