assumes: [arith, power, geq]
# Quy ước: “lớp mã hoá kết nối” = TLS; “thư viện” = OpenSSL (tên chỉ trên màn hình; lời đọc nói “thư viện mã hoá mã nguồn mở phổ biến nhất”,
#   đúng lời [HB]). “tin nhịp tim” = HeartbeatMessage; “bản ghi” = bản ghi của lớp mã hoá chứa tin đó, độ dài thật L do lớp dưới biết.
#   Chỉ dạy điều kiện kiểm đúng (phòng thủ) theo [RFC] mục 4 và [FIX]; KHÔNG dạy cách dựng gói, không có mã khai thác. Bản ghi 20 byte mang
#   1 byte dữ liệu, gói 50 byte / khai báo 300 ở quiz: SỐ MINH HOẠ. Tên Heartbleed chỉ trên màn hình (probe p1 chưa có kết quả khi soạn).
objectives:
  - "Đọc cấu trúc tin nhịp tim: loại, độ dài khai báo, dữ liệu, phần đệm"
  - "Suy ra điều kiện kiểm đúng: 1 + 2 + độ dài khai báo + 16 không vượt độ dài thật của bản ghi"
  - "Giải thích vì sao tin độ dài do bên kia khai báo làm lộ bộ nhớ kề, và vì sao vá xong vẫn phải thay khoá"
  - "Áp dụng quy tắc kiểm độ dài cho một định dạng tin khác"
