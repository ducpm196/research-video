title: "Bài 0 — Hệ nhúng: vi điều khiển, ràng buộc tài nguyên và thời hạn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/esy.yaml L00; audit/esy/verify_esy.py L00; Microchip, ATmega328P datasheet (2 KB SRAM, 32 KB flash, tối đa 20 MHz; bo Arduino Uno chạy 16 MHz); G. C. Buttazzo, Hard Real-Time Computing Systems (2011), chương 1"
assumes: [arith, cdot, frac, approx, power, ltgt, geq]
# Quy ước: số liệu vi điều khiển lấy theo ATmega328P (bo Arduino Uno) làm ví dụ cụ thể; máy tính xách tay giả định 16 GB RAM.
#   Thời gian thực CỨNG: trễ hạn là hỏng; MỀM: trễ hạn làm giảm chất lượng. Ví dụ “trung bình nhanh mà xấu nhất chậm” tính trong checks.
objectives:
  - "Phân biệt vi điều khiển và máy tính đa dụng"
  - "Phân biệt thời gian thực cứng và mềm"
  - "Hiểu thời gian thực là đúng hạn có bảo đảm, không phải chạy nhanh"
asr_reviewed:
  - {sentence: "Máy tính đếm theo lũy thừa của 2, nên một ki-lô-byte là 1024 byte, nên 2 ki-lô-byte là 2048 byte.", reason: "ASR chép “Mẫy tính đến theo lũy thừa của 2 nên 1 kilobyte là 1.024 vai nên 2 kilobyte là 2.048 vai.” (0.765): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: máy/mẫy, đếm/đến — NOT_VERIFIED bằng tai người"}
  - {sentence: "Một vi điều khiển phổ biến chỉ có 2 ki-lô-byte bộ nhớ dữ liệu, so với 16 gi-ga-byte, ít hơn tám triệu lần.", reason: "ASR chép “Một vi điều khiển phổ biến chỉ có 2 kilobytes bộ nhớ dữ liệu so với 16 GB, ít hơn 8 triệu lần.” (0.846): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “GB/gigabyte”; lệch âm/thanh thuần Việt: gi (trong “gi ga byte” → “gb”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bù lại, nó rẻ, tốn rất ít điện, khởi động gần như ngay lập tức, và chương trình nằm riêng trong 32 ki-lô-byte bộ nhớ flash.", reason: "ASR chép “Bù lại, nó rẻ, tốn rất ít điện, khởi động gần như ngay lập tức và chương trình nằm riêng trong 32 kg bộ nhớ Phlax.” (0.897): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; từ mượn/tên riêng “flash” đọc thô (không có luật lexicon), ASR viết “phlax” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Trước hết, ta cần hiểu các đơn vị đo bộ nhớ, bắt đầu từ bit, một chữ số chỉ nhận 0 hoặc 1, và 8 bit gộp lại thành một byte.", reason: "ASR chép “Trước hết, ta cần hiểu các đơn vị đo bộ nhớ, bắt đầu từ bit, một chữ số chỉ nhận 0 hoặc 1 và 8 bit gột lại thành một bay.” (0.935): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: gộp/gột — NOT_VERIFIED bằng tai người"}
  - {sentence: "Một gi-ga-byte là 2 mũ 30 byte, khoảng một tỉ byte.", reason: "ASR chép “Một gigabyte là hai mũ ba mươi bay, khoảng một tỷ bay.” (0.615): GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “GB/gigabyte”; byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: gi (trong “gi ga byte” → “gigabyte”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nhưng lần xấu nhất 12 mi li giây vượt hạn 10 tới 2 mi li giây, nên tác vụ A không kịp hạn.", reason: "ASR chép “Nhưng lần xấu nhất 12 mili dây vượt hạng 10 tới 2 mili dây, nền tác vụ A không kịp hạng.” (0.652): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: hạn/hạng, nên (trong “mi li giây nên” → “mili dây nền”), hạn/hạng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hạn 10 mi li giây lớn gấp khoảng 7 phẩy 8 lần con số trung bình này.", reason: "ASR chép “hàng 10 mili dây lớn gấp khoảng 7,8 lần con số trung bình này.” (0.788): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: hạn/hàng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chia 16 gi-ga-byte cho 2 ki-lô-byte, ta được 2 mũ 23, tức là 8 triệu 388 nghìn 608 lần.", reason: "ASR chép “Chia 16 GB cho 2 KB, ta được 2 mũ 23, tức là 8.388.608 lần.” (0.871): GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “GB/gigabyte”; KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; lệch âm/thanh thuần Việt: gi (trong “gi ga byte” → “gb”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Xung nhịp 16 mê-ga-héc, so với khoảng 3 gi-ga-héc.", reason: "ASR chép “16 MHz … 3 GHz”: ASR tự viết đơn vị thành ký hiệu — chứng tỏ nghe đúng “mê-ga-héc”, “gi-ga-héc”; điểm thấp chỉ do cách viết"}
  - {sentence: "So với máy tính xách tay, chênh lệch rất lớn.", reason: "ASR chép “so với mấy tính sách tay trên lật rất lớn”: máy/mấy, x/s, chênh lệch/trên lật (ch/tr, l) — nhầm âm điển hình của ASR tiếng Việt; NOT_VERIFIED bằng tai người"}
  - {sentence: "Một mảng 4 ki-lô-byte đã vượt cả 2 ki-lô-byte bộ nhớ, nên mỗi byte, mỗi mi li giây đều phải tính.", reason: "ASR chép “4 kilobytes … 2 kilobytes … mili dây”: ASR viết liền đơn vị (nghe đúng “ki-lô-byte”); gi/d của ASR"}
  - {sentence: "Lỗi thứ ba, viết mã nhúng như viết mã cho máy tính.", reason: "ASR chép “Lội thứ ba, viết mạ nhúng …”: lỗi/lội, mã/mạ — nhầm thanh ngã/nặng điển hình của ASR (câu tương tự “Lỗi thứ …” khớp ở mọi khoá khác); NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đúng mà muộn vẫn là sai"
    steps:
      - show: |
          <p>Bộ điều khiển túi khí tính đúng là xe đang va chạm — nhưng ra lệnh bung chậm vài chục mili giây so với cần thiết. Kết quả đúng, mà người lái vẫn bị thương.</p>
          <div class="box key">Hôm nay: <b>hệ nhúng</b> — máy tính nhỏ nằm bên trong thiết bị — với tài nguyên rất hạn chế và <b>thời hạn</b> phải giữ.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, bộ điều khiển túi khí tính đúng là xe đang va chạm, nhưng ra lệnh bung chậm vài chục mi li giây so với cần thiết. Kết quả tính toán hoàn toàn đúng, vậy mà người lái vẫn bị thương. Hôm nay ta học hệ nhúng, những máy tính nhỏ nằm bên trong thiết bị, với tài nguyên rất hạn chế và thời hạn phải giữ."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đơn vị bộ nhớ, nhịp đồng hồ, trung bình và lớn nhất"
    checks:
      - "2 * 1024 == 2048 and 2 ** 30 == 1073741824 and 16 * 2 ** 30 // (2 * 2 ** 10) == 2 ** 23 == 8388608"
      - "16_000_000 // 1000 == 16000 and 16000 * 10 == 160000"
      - "(2 + 4 + 9) / 3 == 5 and max([2, 4, 9]) == 9"
    steps:
      - show: |
          <table class="t"><tr><th>đơn vị</th><th>bằng</th><th>ví dụ</th></tr>
          <tr><td>1 bit</td><td>một chữ số chỉ nhận 0 hoặc 1</td><td>8 bit = 1 byte</td></tr>
          <tr><td>1 KB</td><td>1024 byte $= 2^{10}$</td><td>2 KB = 2048 byte</td></tr>
          <tr><td>1 GB</td><td>$2^{30}$ byte, khoảng một tỉ byte</td><td>$\frac{16 \text{ GB}}{2 \text{ KB}} = 2^{23} = 8\,388\,608$</td></tr></table>
        say: "Trước hết, ta cần hiểu các đơn vị đo bộ nhớ, bắt đầu từ bit, một chữ số chỉ nhận 0 hoặc 1, và 8 bit gộp lại thành một byte. Máy tính đếm theo lũy thừa của 2, nên một ki-lô-byte là 1024 byte, nên 2 ki-lô-byte là 2048 byte. Một gi-ga-byte là 2 mũ 30 byte, khoảng một tỉ byte. Chia 16 gi-ga-byte cho 2 ki-lô-byte, ta được 2 mũ 23, tức là 8 triệu 388 nghìn 608 lần."
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>nghĩa</th><th>làm thử</th></tr>
          <tr><td>1 giây</td><td>1000 ms</td><td>hạn 10 ms là một phần trăm giây</td></tr>
          <tr><td>16 MHz</td><td>16 triệu nhịp đồng hồ mỗi giây</td><td>$\frac{16\,000\,000}{1000} = 16\,000$ nhịp mỗi ms</td></tr>
          <tr><td>trong hạn 10 ms</td><td>số nhịp có được</td><td>$16\,000 \cdot 10 = 160\,000$ nhịp</td></tr></table>
        say: "Tiếp theo là đơn vị thời gian, một giây bằng 1000 mi li giây, nên hạn 10 mi li giây là một phần trăm giây. Xung nhịp 16 mê-ga-héc nghĩa là 16 triệu nhịp đồng hồ mỗi giây, chia cho 1000 thì được 16 nghìn nhịp trong mỗi mi li giây. Vậy trong một hạn 10 mi li giây, bộ xử lý có 160 nghìn nhịp để làm việc."
      - show: |
          <p>Trung bình và lớn nhất của ba số 2, 4, 9: trung bình $\frac{2 + 4 + 9}{3} = 5$, lớn nhất là $\hl{9}$.</p>
          <div class="box key">Một số lớn kéo trung bình lên rất ít, nhưng nó chính là số lớn nhất. Bài này cần cả hai con số.</div>
        focus: [1, 1, 2]
        say: "Cuối cùng, ôn lại trung bình và lớn nhất của một dãy số, ví dụ ba số 2, 4 và 9. Trung bình bằng 15 chia 3, tức là 5, còn số lớn nhất là 9. Một số lớn kéo trung bình lên rất ít, nhưng chính nó lại là số lớn nhất, và bài hôm nay cần cả hai con số này."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: vi điều khiển"
    checks:
      - "16 * 2 ** 30 // (2 * 2 ** 10) == 8388608"
      - "round(16e6 / 3e9, 4) == 0.0053"
    steps:
      - show: |
          <p><b>Vi điều khiển</b>: bộ xử lý, bộ nhớ và ngoại vi (chân vào/ra, bộ định thời, ADC, cổng nối tiếp) trên <b>một</b> con chip.</p>
          <table class="t"><tr><th></th><th>vi điều khiển (ATmega328P)</th><th>máy tính xách tay</th></tr>
          <tr><td>bộ nhớ dữ liệu (RAM)</td><td>2 KB</td><td>16 GB — gấp hơn 8 triệu lần</td></tr>
          <tr><td>xung nhịp</td><td>16 MHz</td><td>khoảng 3 GHz</td></tr>
          <tr><td>hệ điều hành</td><td>thường không có, hoặc rất nhỏ</td><td>đầy đủ</td></tr></table>
          <p class="note">Bù lại: rẻ, tốn rất ít điện, và khởi động gần như ngay lập tức. (Chương trình nằm riêng trong 32 KB bộ nhớ flash.)</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3]
        say: "Vi điều khiển là bộ xử lý, bộ nhớ và các ngoại vi như chân vào ra, bộ định thời, bộ chuyển đổi tương tự số và cổng nối tiếp, tất cả trên một con chip. So với máy tính xách tay, chênh lệch rất lớn. Một vi điều khiển phổ biến chỉ có 2 ki-lô-byte bộ nhớ dữ liệu, so với 16 gi-ga-byte, ít hơn tám triệu lần. Xung nhịp 16 mê-ga-héc, so với khoảng 3 gi-ga-héc. Thường không có hệ điều hành, hoặc chỉ có một hệ điều hành rất nhỏ. Bù lại, nó rẻ, tốn rất ít điện, khởi động gần như ngay lập tức, và chương trình nằm riêng trong 32 ki-lô-byte bộ nhớ flash."

  # ───────────────────────── 3. THỜI GIAN THỰC ─────────────────────────
  - id: realtime
    kind: concept
    title: "Thời gian thực cứng và mềm"
    steps:
      - show: |
          <p><b>Thời gian thực</b>: kết quả chỉ đúng khi vừa đúng giá trị, vừa đúng <b>hạn</b>.</p>
          <table class="t"><tr><th>loại</th><th>trễ hạn thì</th><th>ví dụ</th></tr>
          <tr><td><b>cứng</b></td><td>hỏng, có thể nguy hiểm</td><td>túi khí, phanh chống bó, máy tạo nhịp tim</td></tr>
          <tr><td><b>mềm</b></td><td>chất lượng giảm</td><td>phát video (mất một khung hình), loa thông minh (trả lời chậm)</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Một hệ thời gian thực cho kết quả đúng chỉ khi vừa đúng giá trị, vừa đúng hạn. Có hai loại. Thời gian thực cứng, trễ hạn là hỏng và có thể nguy hiểm, như túi khí, phanh chống bó cứng, hay máy tạo nhịp tim. Thời gian thực mềm, trễ hạn chỉ làm giảm chất lượng, như phát video bị mất một khung hình, hay loa thông minh trả lời chậm."

  - id: intuition
    kind: intuition
    title: "Trung bình nằm sát trái, lần xấu nhất nằm trong vùng trễ"
    checks:
      - "(lambda ts: (round(sum(ts) / len(ts), 2), ts.count(1), ts.count(30), sum(1 for x in ts if x > 10)))([1] * 99 + [30]) == (1.29, 99, 1, 1)"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><rect x="550" y="40" width="880" height="220" fill="#fee2e2"/><g fill="#1f2937"><line x1="140" y1="260" x2="1430" y2="260" stroke="#6b7280" stroke-width="2"/><line x1="150" y1="260" x2="150" y2="270" stroke="#6b7280" stroke-width="2"/><text x="150" y="295" text-anchor="middle" font-size="20">0</text><line x1="350" y1="260" x2="350" y2="270" stroke="#6b7280" stroke-width="2"/><text x="350" y="295" text-anchor="middle" font-size="20">5</text><line x1="550" y1="260" x2="550" y2="270" stroke="#6b7280" stroke-width="2"/><text x="550" y="295" text-anchor="middle" font-size="20">10</text><line x1="750" y1="260" x2="750" y2="270" stroke="#6b7280" stroke-width="2"/><text x="750" y="295" text-anchor="middle" font-size="20">15</text><line x1="950" y1="260" x2="950" y2="270" stroke="#6b7280" stroke-width="2"/><text x="950" y="295" text-anchor="middle" font-size="20">20</text><line x1="1150" y1="260" x2="1150" y2="270" stroke="#6b7280" stroke-width="2"/><text x="1150" y="295" text-anchor="middle" font-size="20">25</text><line x1="1350" y1="260" x2="1350" y2="270" stroke="#6b7280" stroke-width="2"/><text x="1350" y="295" text-anchor="middle" font-size="20">30</text><rect x="176" y="90" width="28" height="170" fill="#2a78d6"/><rect x="1336" y="250" width="28" height="10" fill="#eb6834"/><line x1="550" y1="40" x2="550" y2="260" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/><circle cx="202" cy="260" r="8" fill="#059669"/><g font-size="22"><text x="216" y="120" fill="#2a78d6">99 lần: 1 ms</text><text x="1350" y="236" text-anchor="middle" fill="#eb6834">1 lần: 30 ms</text><text x="562" y="72" fill="#b91c1c">hạn 10 ms</text><text x="990" y="120" text-anchor="middle" fill="#b91c1c">vùng trễ hạn</text><text x="192" y="330" fill="#059669">trung bình 1,29 ms</text><text x="1430" y="330" text-anchor="end">thời gian một lần chạy, ms</text></g></g></svg></div>
        say: "Hình vẽ 100 lần đo trên một trục thời gian, cột xanh cao là 99 lần chạy mất 1 mi li giây. Vạch đỏ đứt nét là hạn 10 mi li giây, phần nền hồng bên phải là vùng trễ hạn. Cột cam thấp nằm lọt trong vùng ấy là lần duy nhất mất 30 mi li giây. Chấm xanh lá dưới trục là trung bình, nằm sát bên trái, nên nhìn trung bình thì không bao giờ thấy được cột cam."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Nhanh trung bình chưa phải thời gian thực"
    checks:
      - "(lambda ts: (round(sum(ts) / len(ts), 2), max(ts)))([1] * 99 + [30]) == (1.29, 30)"
      - "max([1] * 99 + [30]) > 10"
    steps:
      - show: |
          <p><b>Bước 1 — số liệu:</b> <b>tác vụ</b> (một việc phần mềm làm đi làm lại) hạn 10 ms, đo 100 lần: 99 lần mất 1 ms, một lần mất 30 ms (khi dữ liệu cần không có sẵn trong bộ nhớ đệm nhanh, hay khi một <b>ngắt</b> — tín hiệu phần cứng bắt chip tạm dừng để làm việc khác — chen vào).</p>
          <p>Tổng thời gian: $99 \cdot 1 + 30 = 129$ ms.</p>
        focus: [1, 1, 1, 2]
        say: "Một tác vụ, tức một việc phần mềm phải làm đi làm lại, có hạn 10 mi li giây. Bước một, đo 100 lần, 99 lần mất 1 mi li giây, nhưng có một lần mất 30 mi li giây. Lần chậm ấy xảy ra khi dữ liệu cần dùng không có sẵn trong bộ nhớ đệm nhanh, hay khi một ngắt, tức tín hiệu phần cứng bắt chip tạm dừng để làm việc khác, chen vào. Cộng lại, 99 nhân 1 rồi cộng 30, tổng thời gian của 100 lần là 129 mi li giây."
      - show: |
          <p><b>Bước 2 — trung bình:</b> $\dfrac{129}{100} = \hl{1{,}29}$ ms — rất nhanh, hạn 10 ms gấp khoảng $\frac{10}{1{,}29} \approx 7{,}8$ lần.</p>
        say: "Bước hai, lấy tổng chia cho 100 lần đo, trung bình chỉ 1 phẩy 29 mi li giây, rất nhanh. Hạn 10 mi li giây lớn gấp khoảng 7 phẩy 8 lần con số trung bình này."
      - show: |
          <p><b>Bước 3 — xấu nhất:</b> $\hl{30}$ ms $\gt$ 10 ms → <b>trễ hạn</b>, vượt $30 - 10 = 20$ ms. Số lần trễ: 1 trong 100, tức 1%.</p>
        say: "Bước ba, nhìn lần xấu nhất, 30 mi li giây, lớn hơn hạn 10, tức là trễ hạn, vượt tới 20 mi li giây. Số lần trễ là 1 trong 100 lần đo, tức là 1 phần trăm."
      - clear: true
        show: |
          <table class="t"><tr><th>tác vụ chạy mỗi 10 ms</th><th>số lần chạy</th><th>số lần trễ (nếu vẫn 1%)</th></tr>
          <tr><td>trong 1 giây</td><td>$\frac{1000}{10} = 100$</td><td>khoảng 1</td></tr>
          <tr><td>trong 1 giờ</td><td>$100 \cdot 3600 = 360\,000$</td><td>khoảng 3600</td></tr></table>
          <div class="box key">Thời gian thực quan tâm thời gian <b>xấu nhất</b>, không phải trung bình. Phải chứng minh được xấu nhất vẫn kịp.</div>
        focus: [1, 1, 1, 2]
        say: "Bước bốn, xem hậu quả. Nếu tác vụ chạy mỗi 10 mi li giây thì một giây chạy 100 lần, và nếu tỉ lệ trễ vẫn là 1 phần trăm thì mỗi giây có khoảng một lần trễ. Một giờ có 360 nghìn lần chạy, tức khoảng 3600 lần trễ, với túi khí thì một lần thôi đã là hỏng. Vì thế thời gian thực quan tâm thời gian xấu nhất chứ không phải trung bình, và phải chứng minh được trường hợp xấu nhất vẫn kịp."

  - id: check
    kind: check
    title: "Tự kiểm: tính trung bình bằng phần thêm, đếm lần vượt hạn"
    checks:
      - "round(1 + (30 - 1) / 100, 2) == 1.29 and 30 - 1 == 29"
      - "sum(1 for x in [1] * 99 + [30] if x > 10) == 1 and sorted([1] * 99 + [30])[-1] == 30"
      - "1000 // 10 == 100 and 100 * 3600 == 360000 and 360000 // 100 == 3600 and round(10 / 1.29, 1) == 7.8"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>tính</th><th>so với bước trên</th></tr>
          <tr><td>mọi lần ít nhất 1 ms; chỉ lần chậm có phần thêm $30 - 1 = 29$ ms</td><td>$1 + \frac{29}{100} = 1{,}29$ ms</td><td>khớp trung bình ✓</td></tr>
          <tr><td>dò cả 100 số, đếm số nào lớn hơn 10</td><td>đúng 1 số (số 30)</td><td>khớp: có trễ hạn ✓</td></tr></table>
        say: "Kiểm bằng đường khác, vì đọc lại phép cộng cũ thì dễ lặp lại đúng chỗ sai cũ. Mọi lần chạy đều mất ít nhất 1 mi li giây, chỉ lần chậm có phần thêm 30 trừ 1, bằng 29 mi li giây. Chia phần thêm cho 100 lần rồi cộng 1, được 1 phẩy 29, khớp với trung bình ở trên. Sau đó dò cả 100 số và đếm số nào lớn hơn 10, chỉ có đúng một số là số 30, khớp kết luận có trễ hạn."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "4 * 1024 == 4096 and 2 * 1024 == 2048 and 4096 > 2048"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ thời gian thực là chạy nhanh <b class="red">(sai)</b>
          <br><span class="note">Một hệ chậm mà luôn kịp hạn vẫn là thời gian thực; một hệ nhanh mà thỉnh thoảng trễ thì không.</span></div>
        say: "Lỗi thứ nhất, nghĩ thời gian thực là chạy nhanh. Một hệ chậm mà luôn kịp hạn vẫn là thời gian thực, còn một hệ nhanh mà thỉnh thoảng trễ hạn thì không."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đo vài lần rồi lấy trung bình làm bảo đảm <b class="red">(sai)</b>
          <br><span class="note">Lần chậm hiếm gặp mới là lần gây tai nạn. Cần phân tích thời gian xấu nhất.</span></div>
        say: "Lỗi thứ hai, đo vài lần rồi lấy trung bình làm bảo đảm. Lần chậm hiếm gặp mới là lần gây tai nạn, nên cần phân tích thời gian xấu nhất."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Viết mã nhúng như mã máy tính <b class="red">(sai)</b>
          <br><span class="note">Một mảng 4 KB đã vượt 2 KB RAM. Mỗi byte, mỗi mili giây đều phải tính.</span></div>
          <table class="t"><tr><th>mảng cần</th><th>RAM có (ATmega328P)</th><th>kết quả</th></tr><tr><td>4 KB = 4096 byte</td><td>2 KB = 2048 byte</td><td>không chứa nổi</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ ba, viết mã nhúng như viết mã cho máy tính. Một mảng 4 ki-lô-byte đã vượt cả 2 ki-lô-byte bộ nhớ, nên mỗi byte, mỗi mi li giây đều phải tính."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Coi thời gian thực mềm là “không cần quan tâm hạn” <b class="red">(sai)</b>
          <br><span class="note">Mềm vẫn có hạn; trễ nhiều thì người dùng vẫn bỏ đi (video giật).</span></div>
        say: "Lỗi thứ tư, coi thời gian thực mềm là không cần quan tâm hạn. Hệ mềm vẫn có hạn, trễ nhiều thì người dùng vẫn bỏ đi, như video bị giật liên tục."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda ts: (sum(ts) / len(ts), max(ts)))([2] * 9 + [12]) == (3.0, 12)"
      - "9 * 2 + 12 == 30 and 12 - 10 == 2 and max([8] * 10) <= 10 and sum([8] * 10) / 10 == 8 and 8 > 3"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Xếp loại cứng hay mềm: máy tạo nhịp tim; trò chơi trực tuyến; bộ điều khiển phanh chống bó cứng; ghi nhật ký nhiệt độ mỗi phút.</td></tr>
          <tr><td>2</td><td>Tác vụ A hạn 10 ms, 10 lần đo: 9 lần 2 ms, một lần 12 ms. Trung bình? Có kịp hạn không?</td></tr>
          <tr><td>3</td><td>Tác vụ B cùng hạn 10 ms, 10 lần đo đều 8 ms. Bộ phanh nên dùng A hay B?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, xếp loại cứng hay mềm cho máy tạo nhịp tim, trò chơi trực tuyến, bộ điều khiển phanh chống bó cứng, và việc ghi nhật ký nhiệt độ mỗi phút. Câu hai, một tác vụ có hạn 10 mi li giây, đo 10 lần được 9 lần 2 mi li giây và một lần 12. Trung bình là bao nhiêu, và tác vụ có kịp hạn không? Câu ba, tác vụ B cùng hạn 10 mi li giây, mười lần đo đều mất 8 mi li giây, vậy bộ phanh nên dùng tác vụ nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>hệ</th><th>trễ hạn thì</th><th>loại</th></tr>
          <tr><td>máy tạo nhịp tim</td><td>nguy hiểm tính mạng</td><td>cứng</td></tr>
          <tr><td>phanh chống bó cứng</td><td>bánh xe bó, xe trượt</td><td>cứng</td></tr>
          <tr><td>trò chơi trực tuyến</td><td>hình giật, khó chịu</td><td>mềm</td></tr>
          <tr><td>ghi nhật ký nhiệt độ mỗi phút</td><td>một dòng ghi muộn vài giây</td><td>mềm</td></tr></table>
        say: "Đáp án câu một, ta hỏi trễ hạn thì chuyện gì xảy ra. Máy tạo nhịp tim trễ là nguy hiểm tính mạng, phanh chống bó cứng trễ thì bánh xe bó và xe trượt, nên cả hai là thời gian thực cứng. Trò chơi trực tuyến trễ thì hình giật, ghi nhật ký nhiệt độ trễ thì một dòng ghi muộn vài giây, nên hai hệ này là thời gian thực mềm."
      - show: |
          <p>② Tổng $9 \cdot 2 + 12 = 30$ ms; trung bình $\dfrac{30}{10} = \hl{3}$ ms. Nhưng xấu nhất 12 ms $\gt$ 10 ms, vượt 2 ms: <b>không kịp</b>.</p>
        say: "Câu hai, tổng thời gian là 9 nhân 2 cộng 12, bằng 30 mi li giây, chia cho 10 lần thì trung bình là 3 mi li giây. Nhưng lần xấu nhất 12 mi li giây vượt hạn 10 tới 2 mi li giây, nên tác vụ A không kịp hạn."
      - show: |
          <p>③ B: trung bình 8 ms, chậm hơn A, nhưng xấu nhất đo được 8 ms $\le$ 10 ms → kịp cả 10 lần, còn A đã trễ ngay trong số đo. Bộ phanh là hệ cứng → chọn <b>B</b>, rồi vẫn phải <b>phân tích thời gian xấu nhất</b> để chứng minh B luôn kịp: 10 lần đo chưa phải bảo đảm.</p>
        say: "Câu ba, tác vụ B có trung bình 8 mi li giây, chậm hơn A nhiều, nhưng lần xấu nhất đo được cũng chỉ 8 mi li giây, nhỏ hơn hạn 10. Vậy B kịp cả 10 lần, còn A đã trễ ngay trong số đo. Bộ phanh là hệ thời gian thực cứng, vì vậy ta chọn tác vụ B, chậm hơn mà an toàn hơn. Nhưng 10 lần đo chưa phải bảo đảm, vẫn phải phân tích thời gian xấu nhất để chứng minh B luôn kịp."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">vi điều khiển: một chip, tài nguyên nhỏ</span><span class="a">→</span>
          <span class="n">thời gian thực: đúng giá trị và đúng hạn</span><span class="a">→</span>
          <span class="n">cứng: trễ là hỏng</span><span class="a">→</span>
          <span class="n">bảo đảm theo thời gian xấu nhất</span></div>
        say: "Tổng kết lại, vi điều khiển gói mọi thứ trên một con chip với tài nguyên nhỏ. Thời gian thực đòi đúng giá trị và đúng hạn, với hệ cứng thì trễ là hỏng, và bảo đảm phải dựa trên thời gian xấu nhất."
      - show: |
          <div class="box key"><b>Tư duy:</b> trong hệ nhúng, câu hỏi không phải “chạy nhanh cỡ nào” mà là “chậm nhất là bao nhiêu, và có kịp không”.</div>
        say: "Điều cần mang theo, trong hệ nhúng câu hỏi không phải chạy nhanh cỡ nào, mà là chậm nhất là bao nhiêu, và có kịp hay không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>thanh ghi ngoại vi</b> và thao tác bit trên chân vào/ra.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học thanh ghi ngoại vi và thao tác bit trên chân vào ra, cách phần mềm điều khiển phần cứng. Hẹn gặp bạn ở bài tiếp theo."
