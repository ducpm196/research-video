  - {sentence: "Khi g trả về, khung của nó được gỡ ra, ngăn xếp lại còn 30 byte.", reason: "ASR chép “Khi Giê trả về, khung của nó được gỡ ra ngăn xếp lại còn 30 bay.” (0.941): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ví dụ hạn là 100 mi li giây, vòng chính dài nhất 60 mi li giây.", reason: "ASR chép “100ml … 60ml”: số khớp, “mi li giây” rút thành “ml” (ASR viết tắt nhầm); cùng đơn vị ở các câu khác của bài chép “mili giây”"}
  - {sentence: "Chuỗi gọi sâu nhất đi từ hàm chính, 64 byte, sang hàm đọc cảm biến, 48 byte, rồi hàm lọc, 96 byte.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
