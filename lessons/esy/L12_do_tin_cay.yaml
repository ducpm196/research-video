scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Thiết bị chạy ba tháng rồi treo"
    steps:
      - show: |
          <p>Một trạm đo đặt trên núi chạy tốt ba tháng, rồi đứng im. Không ai ở đó để bấm nút khởi động lại.</p>
          <div class="box key">Hôm nay: ba công cụ của độ tin cậy — <b>bộ giám sát</b>, <b>ước lượng ngăn xếp</b>, và lý do <b>tránh cấp phát động</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một trạm đo đặt trên núi chạy tốt suốt ba tháng, rồi đứng im. Không có ai ở đó để bấm nút khởi động lại. Hôm nay ta học ba công cụ của độ tin cậy, bộ giám sát, ước lượng ngăn xếp, và lý do nên tránh cấp phát động."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ngăn xếp lớn lên khi gọi hàm, bộ đếm lùi, biên an toàn"
    checks:
      - "10 + 20 + 30 == 60 and 10 + 20 == 30"
      - "100 - 60 == 40 and 100 - 100 == 0"
      - "200 * 1.25 == 250 and 250 - 200 == 50"
    steps:
      - show: |
          <table class="t"><tr><th>lúc</th><th>ngăn xếp đang giữ</th><th>tổng</th></tr>
          <tr><td>hàm chính gọi f</td><td>khung chính 10, khung f 20</td><td>30 byte</td></tr>
          <tr><td>f gọi g</td><td>10, 20, khung g 30</td><td>$\hl{60}$ byte — sâu nhất</td></tr>
          <tr><td>g trả về</td><td>10, 20</td><td>30 byte</td></tr></table>
          <p class="note"><b>Ngăn xếp</b>: vùng nhớ dùng như một chồng đĩa — đặt thêm lên trên cùng, lấy ra cũng từ trên cùng. Mỗi lần gọi hàm, chip đặt thêm một <b>khung</b> gồm <b>địa chỉ trở về</b> (chỗ chương trình phải quay lại khi hàm xong) và <b>biến cục bộ</b> (biến chỉ dùng bên trong hàm đó).</p>
        focus: [2, 2, "1.2", "1.3", "1.4"]
        say: "Trước hết, ta cần hiểu ngăn xếp, một vùng nhớ dùng như chồng đĩa, đặt thêm lên trên cùng và lấy ra cũng từ trên cùng. Mỗi lần gọi hàm, chip đặt thêm một khung, chứa địa chỉ trở về, tức chỗ chương trình phải quay lại khi hàm xong, và các biến cục bộ chỉ dùng bên trong hàm đó. Hàm chính có khung 10 byte gọi hàm f có khung 20 byte, ngăn xếp đang giữ 30 byte. Hàm f gọi tiếp hàm g có khung 30 byte, ngăn xếp lên tới 60 byte, đây là lúc sâu nhất. Khi g trả về, khung của nó được gỡ ra, ngăn xếp lại còn 30 byte."
      - show: |
          <table class="t"><tr><th>ý</th><th>làm thử</th></tr>
          <tr><td>bộ đếm lùi: nạp 100, mỗi mi li giây trừ 1</td><td>sau 60 ms còn $100 - 60 = 40$; sau 100 ms về 0</td></tr>
          <tr><td>biên an toàn 1,25: thêm một phần tư</td><td>$200 \cdot 1{,}25 = 250$, tức thêm 50</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Thêm hai ý nhỏ sẽ dùng trong bài. Một bộ đếm lùi được nạp 100 và mỗi mi li giây trừ đi 1, nên sau 60 mi li giây nó còn 40, sau 100 mi li giây thì về 0. Nhân với biên an toàn 1 phẩy 25 nghĩa là cộng thêm một phần tư, ví dụ 200 nhân 1 phẩy 25 bằng 250, tức là thêm 50."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bộ giám sát"
    checks:
      - "100 > 60 and 100 - 60 == 40"
    steps:
      - show: |
          <p><b>Bộ giám sát</b>: một bộ đếm phần cứng đếm lùi. Chương trình phải <b>cho ăn</b> (đặt lại bộ đếm) trước khi nó về 0; nếu không, chip tự khởi động lại.</p>
          <p>Ví dụ: hạn 100 ms, vòng chính dài nhất 60 ms. Cho ăn một lần mỗi vòng: dư 40 ms. Vòng chính treo → 100 ms sau chip tự khởi động lại.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Bộ giám sát là một bộ đếm phần cứng đếm lùi. Chương trình phải cho nó ăn, tức đặt lại bộ đếm, trước khi nó về 0, nếu không chip sẽ tự khởi động lại. Ví dụ hạn là 100 mi li giây, vòng chính dài nhất 60 mi li giây. Ta cho ăn một lần mỗi vòng, còn dư 40 mi li giây. Nếu vòng chính treo, 100 mi li giây sau chip tự khởi động lại."

  # ───────────────────────── 3. ĐÚNG CHỖ ─────────────────────────
  - id: where
    kind: concept
    title: "Cho ăn ở đâu?"
    steps:
      - show: |
          <table class="t"><tr><th>cho ăn ở</th><th>vòng chính treo thì</th></tr>
          <tr><td>ngắt định thời mỗi 10 ms</td><td>ngắt vẫn chạy, vẫn cho ăn → <b class="red">không bao giờ khởi động lại</b></td></tr>
          <tr><td>cuối vòng chính, sau khi mọi tác vụ báo “còn sống”</td><td>không ai cho ăn → khởi động lại sau 100 ms</td></tr></table>
          <div class="box key">Chỉ cho ăn khi <b>mọi</b> phần quan trọng đã chứng minh mình đang chạy. Ghi lại lý do khởi động lại để biết thiết bị đã gặp gì.</div>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Cho ăn ở đâu mới đúng? Nếu cho ăn trong ngắt định thời mỗi 10 mi li giây, thì khi vòng chính treo, ngắt vẫn chạy và vẫn cho ăn, nên chip không bao giờ khởi động lại. Nếu cho ăn ở cuối vòng chính, sau khi mọi tác vụ đã báo còn sống, thì khi treo không ai cho ăn, và chip khởi động lại sau 100 mi li giây. Vậy chỉ cho ăn khi mọi phần quan trọng đã chứng minh mình đang chạy. Hãy ghi lại lý do khởi động lại, để biết thiết bị đã gặp chuyện gì."

  - id: intuition
    kind: intuition
    title: "Răng cưa của bộ giám sát, cột khung của ngăn xếp"
    checks:
      - "[100 - 60] * 3 == [40, 40, 40] and 180 + 100 == 280 and 60 + 60 + 60 == 180"
      - "64 + 48 == 112 and 112 + 96 == 208 and 208 + 40 == 248"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g fill="#1f2937"><line x1="150" y1="290" x2="1370" y2="290" stroke="#6b7280" stroke-width="2"/><line x1="150" y1="290" x2="150" y2="80" stroke="#6b7280" stroke-width="2"/><polyline points="150,90 330,210 330,90 510,210 510,90 690,210 690,90 990,290" fill="none" stroke="#2a78d6" stroke-width="4"/><polyline points="990,90 1170,210 1170,90 1350,210" fill="none" stroke="#2a78d6" stroke-width="4" stroke-dasharray="10 8"/><line x1="990" y1="290" x2="990" y2="90" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 6"/><circle cx="990" cy="290" r="10" fill="#b91c1c"/><g font-size="22"><text x="330" y="72" text-anchor="middle" fill="#059669">cho ăn</text><text x="510" y="72" text-anchor="middle" fill="#059669">cho ăn</text><text x="690" y="72" text-anchor="middle" fill="#059669">cho ăn</text><text x="140" y="97" text-anchor="end">100</text><text x="140" y="297" text-anchor="end">0</text><text x="338" y="240" fill="#2a78d6">còn 40</text><text x="960" y="100" text-anchor="end" fill="#b91c1c">treo: không ai cho ăn</text><text x="990" y="325" text-anchor="middle" fill="#b91c1c">280 ms: về 0, khởi động lại</text><text x="1370" y="325" text-anchor="end">thời gian, ms</text><text x="160" y="40">số đếm của bộ giám sát</text></g></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đầu vẽ số đếm của bộ giám sát theo thời gian. Mỗi vòng chính dài 60 mi li giây, nên số đếm trôi từ 100 xuống 40 thì được cho ăn và bật lại 100, thành hình răng cưa. Sau lần cho ăn lúc 180 mi li giây, vòng chính treo, không ai cho ăn nữa, số đếm trôi thẳng xuống 0 ở mốc 280. Đúng lúc đó chip tự khởi động lại, và răng cưa bắt đầu lại như cũ."
      - clear: true
        show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g fill="#1f2937" font-size="22"><rect x="560" y="44" width="300" height="256" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="8 6"/><rect x="560" y="249" width="300" height="51" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="880" y="282">hàm chính: 64</text><text x="540" y="257" text-anchor="end">64</text><rect x="560" y="210" width="300" height="38" fill="#059669" stroke="#ffffff" stroke-width="2"/><text x="880" y="238">đọc cảm biến: 48</text><text x="540" y="218" text-anchor="end">112</text><rect x="560" y="134" width="300" height="77" fill="#d97706" stroke="#ffffff" stroke-width="2"/><text x="880" y="180">lọc: 96</text><text x="540" y="142" text-anchor="end">208</text><rect x="560" y="102" width="300" height="32" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><text x="880" y="126">ngắt: 40</text><text x="540" y="110" text-anchor="end">248</text><line x1="560" y1="52" x2="860" y2="52" stroke="#b91c1c" stroke-width="3"/><text x="880" y="56" fill="#b91c1c">nhân biên 1,25: 310</text><text x="540" y="40" text-anchor="end">cấp 320</text><text x="560" y="330">đáy ngăn xếp, khung chồng dần lên trên (byte)</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình thứ hai vẽ ngăn xếp lúc sâu nhất, mỗi khung là một khối, chồng dần từ đáy lên. Hàm chính, hàm đọc cảm biến, hàm lọc, rồi khung ngắt nằm trên cùng, cột số bên trái là tổng dồn tới 248. Vạch đỏ là 310 sau khi nhân biên, còn khung đứt nét là 320 byte ta thực sự cấp."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ước lượng ngăn xếp"
    checks:
      - "64 + 48 + 96 + 40 == 248 and 248 * 1.25 == 310"
    steps:
      - show: |
          <p><b>Bước 1 — chuỗi gọi sâu nhất:</b></p>
          <table class="t"><tr><th>hàm</th><th><code>main</code></th><th><code>doc_cam_bien</code></th><th><code>loc</code></th><th>cộng</th></tr><tr><td>khung (byte)</td><td>64</td><td>48</td><td>96</td><td>$\hl{208}$</td></tr></table>
        focus: [2, 2]
        say: "Chuỗi gọi sâu nhất đi từ hàm chính, 64 byte, sang hàm đọc cảm biến, 48 byte, rồi hàm lọc, 96 byte. Bước một, cộng ba khung của chuỗi gọi này, được 208 byte."
      - show: |
          <p><b>Bước 2 — thêm khung ngắt:</b> ngắt có thể đến lúc sâu nhất: $208 + 40 = \hl{248}$ byte.</p>
        say: "Bước hai, ta phải tính lúc xấu nhất. Một ngắt có thể đến đúng lúc sâu nhất, thêm 40 byte. Tổng cộng 248 byte."
      - show: |
          <p><b>Bước 3 — biên an toàn:</b></p>
          $$248 \cdot 1{,}25 = \hl{310} \text{ byte} \;\to\; \text{cấp } 320$$
        focus: [1, 2]
        say: "Bước ba, vì ước lượng bằng tay có thể sót một hàm nhỏ, ta nhân thêm biên. Nhân biên an toàn 1 phẩy 25 được 310 byte, và ta cấp 320."
      - show: |
          <p><b>Bước 4 — kiểm bằng đo:</b> lúc khởi động tô kín vùng ngăn xếp bằng một mẫu (như <code>0xA5</code>), chạy thử mọi trường hợp, rồi xem mẫu bị ghi đè sâu tới đâu.</p>
          <p class="note">Ví dụ: còn 72 byte trên cùng giữ nguyên mẫu → đã dùng $320 - 72 = 248$ byte, khớp ước lượng.</p>
        focus: [1, 1, 2]
        say: "Bước bốn, kiểm bằng đo. Lúc khởi động hãy tô kín vùng ngăn xếp bằng một mẫu cố định, chạy thử mọi trường hợp, rồi xem mẫu bị ghi đè sâu tới đâu. Ví dụ còn 72 byte trên cùng giữ nguyên mẫu, nghĩa là đã dùng 320 trừ 72, bằng 248 byte, khớp với ước lượng."

  - id: check
    kind: check
    title: "Tự kiểm: cho ngắt đến ở mọi lúc"
    checks:
      - "[64 + 40, 64 + 48 + 40, 64 + 48 + 96 + 40] == [104, 152, 248] and max([104, 152, 248]) == 248"
      - "320 - 72 == 248 and 310 / 248 == 1.25"
    steps:
      - show: |
          <table class="t"><tr><th>ngắt đến khi đang ở</th><th>ngăn xếp lúc đó</th></tr>
          <tr><td>hàm chính</td><td>$64 + 40 = 104$</td></tr>
          <tr><td>hàm đọc cảm biến</td><td>$64 + 48 + 40 = 152$</td></tr>
          <tr><td>hàm lọc</td><td>$64 + 48 + 96 + 40 = \hl{248}$ ✓ lớn nhất</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, thay vì đoán ngắt đến lúc sâu nhất, ta liệt kê mọi lúc ngắt có thể đến. Ngắt đến khi đang ở hàm chính thì ngăn xếp là 104 byte. Đến khi đang ở hàm đọc cảm biến thì là 152 byte. Đến khi đang ở hàm lọc thì là 248 byte, lớn nhất trong ba trường hợp, khớp với cách tính ở trên."

  - id: heap
    kind: concept
    title: "Phân mảnh: còn 400 byte mà xin 300 không được"
    checks:
      - "1000 == 5 * 200 and 2 * 200 == 400 and max(200, 200) < 300"
    steps:
      - show: |
          <table class="t"><tr><th>khối</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>
          <tr><td>200 byte mỗi khối</td><td>dùng</td><td><b>trống</b></td><td>dùng</td><td><b>trống</b></td><td>dùng</td></tr></table>
          <p><b>Cấp phát động</b>: khi đang chạy, chương trình xin một khối bộ nhớ (trong C là hàm <code>malloc</code>), dùng xong thì trả lại (<code>free</code>). <b>Phân mảnh</b>: chỗ trống bị băm thành nhiều mảnh nhỏ không liền nhau.</p>
          <p>Vùng cấp phát 1000 byte, năm khối 200. Giải phóng B và D: trống $\hl{400}$ byte, nhưng khối liền lớn nhất chỉ 200. Xin 300 byte <b>thất bại</b>.</p>
          <div class="box key">Phân mảnh tăng dần theo thời gian chạy — đúng kiểu lỗi “chạy ba tháng rồi treo”. Hệ quan trọng cấp phát hết lúc khởi động, hoặc dùng các khối cố định cỡ.</div>
        focus: [2, 2, 1, 3, 3, 4, 4]
        say: "Cấp phát động nghĩa là khi đang chạy, chương trình xin một khối bộ nhớ, dùng xong thì trả lại. Phân mảnh là khi chỗ trống bị băm thành nhiều mảnh nhỏ không liền nhau. Giả sử vùng cấp phát có 1000 byte, chia thành năm khối 200 byte. Giải phóng khối B và D, tổng cộng trống 400 byte, nhưng khối liền lớn nhất chỉ có 200. Xin 300 byte sẽ thất bại. Phân mảnh tăng dần theo thời gian chạy, đúng kiểu lỗi chạy ba tháng rồi treo. Vì thế hệ quan trọng cấp phát hết ngay lúc khởi động, hoặc chỉ dùng các khối có cỡ cố định."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "248 - 40 == 208 and round(208 * 1.25) == 260 and 260 < 310"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Cho bộ giám sát ăn trong ngắt định thời <b class="red">(sai)</b>
          <br><span class="note">Che mất lỗi treo của vòng chính: thiết bị “sống” mà không làm việc.</span></div>
        say: "Lỗi thứ nhất, cho bộ giám sát ăn trong ngắt định thời. Việc đó che mất lỗi treo của vòng chính, thiết bị trông như còn sống mà không làm việc gì."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên khung ngắt khi ước lượng ngăn xếp <b class="red">(thiếu)</b>
          <br><span class="note">Ngắt dùng ngăn xếp của tác vụ đang chạy (trên nhiều chip). Thiếu khung đó là tràn đúng lúc hiếm gặp nhất.</span></div>
          <table class="t"><tr><th>cách tính</th><th>tổng</th><th>nhân 1,25</th></tr><tr><td>quên ngắt</td><td>208</td><td>260</td></tr><tr><td>đủ ngắt</td><td>248</td><td>310</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ hai, quên khung của ngắt khi ước lượng ngăn xếp. Trên nhiều chip, ngắt dùng ngăn xếp của tác vụ đang chạy, nên thiếu khung đó là tràn đúng vào lúc hiếm gặp nhất. Với ví dụ của bài, quên ngắt chỉ được 208, nhân biên ra 260 byte, thấp hơn mức thật cần là 310."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đệ quy hay mảng lớn trong biến cục bộ <b class="red">(rủi ro)</b>
          <br><span class="note">Độ sâu đệ quy phụ thuộc dữ liệu: không ước lượng được. Mảng lớn đặt tĩnh, không đặt trên ngăn xếp.</span></div>
        say: "Lỗi thứ ba, dùng đệ quy hay mảng lớn trong biến cục bộ. Độ sâu đệ quy phụ thuộc dữ liệu nên không ước lượng được, còn mảng lớn nên đặt tĩnh, không đặt trên ngăn xếp."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Đặt hạn bộ giám sát ngắn hơn vòng chính dài nhất <b class="red">(sai)</b>
          <br><span class="note">Chip tự khởi động lại liên tục dù không có lỗi. Đo vòng dài nhất trước, rồi đặt hạn lớn hơn.</span></div>
        say: "Lỗi thứ tư, đặt hạn bộ giám sát ngắn hơn vòng chính dài nhất. Chip sẽ tự khởi động lại liên tục dù không có lỗi, nên phải đo vòng dài nhất trước, rồi đặt hạn lớn hơn."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "80 + 120 + 56 + 64 == 320 and 320 * 1.25 == 400"
      - "50 < 70"
      - "80 + 120 + 56 == 256 and 256 + 64 == 320 and 100 - 70 == 30 and 1000 - 70 == 930"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chuỗi gọi sâu nhất 80, 120, 56 byte; khung ngắt 64 byte. Biên 1,25: cần bao nhiêu byte ngăn xếp?</td></tr>
          <tr><td>2</td><td>Vòng chính dài nhất 70 ms, hạn bộ giám sát 50 ms. Chuyện gì xảy ra? Nên chọn lại hạn nào trong ba mức 50, 100, 1000 ms?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chuỗi gọi sâu nhất có các khung 80, 120 và 56 byte, khung ngắt 64 byte, với biên 1 phẩy 25 thì cần bao nhiêu byte ngăn xếp? Câu hai, vòng chính dài nhất 70 mi li giây, hạn bộ giám sát 50 mi li giây, chuyện gì xảy ra, và nên chọn lại hạn nào trong ba mức 50, 100 và 1000 mi li giây? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Chuỗi gọi: $80 + 120 + 56 = 256$; thêm khung ngắt: $256 + 64 = 320$; nhân biên: $320 \cdot 1{,}25 = \hl{400}$ byte.</p>
        say: "Câu một làm theo đúng ba bước của ví dụ, cộng ba khung của chuỗi gọi được 256, thêm khung ngắt 64 thành 320. Đáp án câu một, tổng là 320 byte, nhân 1 phẩy 25 được 400 byte."
      - clear: true
        show: |
          <table class="t"><tr><th>hạn</th><th>so với vòng dài nhất 70 ms</th><th>kết quả</th></tr>
          <tr><td>50 ms</td><td>ngắn hơn</td><td>chip <b>tự khởi động lại</b> mỗi khi gặp vòng dài, dù không lỗi</td></tr>
          <tr><td>100 ms</td><td>dư $100 - 70 = 30$ ms</td><td>$\hl{\text{chọn}}$: treo thì 100 ms sau tự hồi phục</td></tr>
          <tr><td>1000 ms</td><td>dư 930 ms</td><td>an toàn nhưng treo cả giây mới hồi phục</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, ta so từng mức hạn với vòng dài nhất 70 mi li giây. Hạn 50 ngắn hơn vòng dài nhất, nên chip tự khởi động lại mỗi khi gặp vòng dài, dù không có lỗi gì. Hạn 100 còn dư 30 mi li giây, và nếu vòng chính treo thì chỉ 100 mi li giây sau chip đã tự hồi phục, nên ta chọn mức này. Hạn 1000 cũng không khởi động lại nhầm, nhưng khi treo thì thiết bị đứng im cả giây mới hồi phục."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bộ giám sát: cho ăn khi mọi phần còn sống</span><span class="a">→</span>
          <span class="n">ngăn xếp: chuỗi sâu nhất + ngắt + biên, rồi đo</span><span class="a">→</span>
          <span class="n">cấp phát hết lúc khởi động</span></div>
        say: "Tổng kết lại, chỉ cho bộ giám sát ăn khi mọi phần quan trọng còn sống. Ngăn xếp bằng chuỗi gọi sâu nhất cộng khung ngắt cộng biên an toàn, rồi kiểm bằng đo. Và cấp phát bộ nhớ hết ngay lúc khởi động."
      - show: |
          <div class="box key"><b>Tư duy:</b> thiết bị không người trông phải tự phát hiện mình hỏng và tự hồi phục. Thiết kế cho ngày thứ một trăm, không chỉ cho lần chạy thử.</div>
        say: "Điều cần mang theo, thiết bị không có người trông phải tự phát hiện mình hỏng và tự hồi phục. Hãy thiết kế cho ngày thứ một trăm, không chỉ cho lần chạy thử."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): <b>năng lượng</b> — chế độ ngủ và tuổi thọ pin.</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta học về năng lượng, chế độ ngủ và cách ước lượng tuổi thọ pin. Hẹn gặp bạn ở bài tiếp theo."
