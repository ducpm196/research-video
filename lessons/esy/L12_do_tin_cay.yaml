title: "Bài 12 — Độ tin cậy: bộ giám sát, tràn ngăn xếp, cấp phát động"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/esy.yaml L12; audit/esy/verify_esy.py L12; J. G. Ganssle, Great Watchdog Timers for Embedded Systems (2016); MISRA C:2012, Directive 4.12 (không cấp phát động); P. Koopman, Better Embedded System Software (2010), chương 18 và 29"
assumes: [arith, cdot, ltgt]
# Quy ước: bộ giám sát (watchdog) = bộ đếm phần cứng tự khởi động lại chip nếu không được “cho ăn” trước hạn. Ước lượng ngăn xếp =
#   tổng khung của chuỗi gọi sâu nhất + khung ngắt (không lồng), nhân biên 1,25. Ví dụ phân mảnh: vùng cấp phát 1000 byte, năm khối
#   200 byte. Mọi số do Python trong checks.
objectives:
  - "Dùng bộ giám sát đúng cách"
  - "Ước lượng và đo ngăn xếp"
  - "Hiểu vì sao tránh cấp phát động khi chạy"
asr_reviewed:
  - {sentence: "Hàm chính có khung 10 byte gọi hàm f có khung 20 byte, ngăn xếp đang giữ 30 byte.", reason: "ASR chép “Hàm 9 có khung 10 bay gọi hàm F có khung 20 bay, ngàn xếp đang giữ 30 bay.” (0.762): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: chính/chín, ngăn (trong “byte ngăn” → “bay nghìn”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Một bộ đếm lùi được nạp 100 và mỗi mi li giây trừ đi 1, nên sau 60 mi li giây nó còn 40, sau 100 mi li giây thì về 0.", reason: "ASR chép “Một bộ đếm lùi được nạp 100 và mỗi mili dây trừ đi 1, nên sau 60 mili dây nó còn 40, sau 100 mili dây thì về không?” (0.783): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàm f gọi tiếp hàm g có khung 30 byte, ngăn xếp lên tới 60 byte, đây là lúc sâu nhất.", reason: "ASR chép “Hàm F gọi tiếp hàm V có khung 30b, ngàn xếp lên tới 60b, đây là lúc sâu nhất.” (0.826): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: ngăn (trong “byte ngăn” → “b nghìn”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ngắt đến khi đang ở hàm chính thì ngăn xếp là 104 byte.", reason: "ASR chép “Ngắt đến khi đang ở hàm chính thì ngăn xét là 104 bay.” (0.875): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: xếp/xét — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đến khi đang ở hàm lọc thì là 248 byte, lớn nhất trong ba trường hợp, khớp với cách tính ở trên.", reason: "ASR chép “Đến khi đang ở Hàm Lộc thì là 248 bài, lớn nhất trong 3 trường hợp, khớp với các tính ở trên.” (0.885): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: lọc/lộc, cách/các — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vạch đỏ là 310 sau khi nhân biên, còn khung đứt nét là 320 byte ta thực sự cấp.", reason: "ASR chép “Vạch đỏ là 310 sau khi nhân biên, còn khung đức nét là 320 baita thực sự cấp.” (0.894): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: đứt/đức, ta (trong “byte ta” → “baita”) — NOT_VERIFIED bằng tai người"}
