  - {sentence: "Ví dụ còn 72 byte trên cùng giữ nguyên mẫu, nghĩa là đã dùng 320 trừ 72, bằng 248 byte, khớp với ước lượng.", reason: "ASR chép “Ví dụ còn 72 bai trên cùng giữ nguyên mẫu, nghĩa là đã dùng 320-72 bằng 248 bai, khớp với ước lượng.” (0.928): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: trừ/∅ — NOT_VERIFIED bằng tai người"}
