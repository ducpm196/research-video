source: "curriculum/esy.yaml L14; audit/esy/verify_esy.py L14; NIST SP 800-193, Platform Firmware Resiliency Guidelines (2018); IETF RFC 9019, A Firmware Update Architecture for Internet of Things (2021); NET bài 14 (hàm băm, chữ ký số)"
assumes: [arith, cdot, frac, approx, power, ltgt]
# Quy ước: phần sụn = chương trình nạp trong bộ nhớ flash của chip. Mã kiểm tổng minh hoạ bằng CRC-32 (zlib.crc32): bắt lỗi ngẫu nhiên,
#   nhưng ai cũng tính lại được. Chữ ký số như NET bài 14: nhà sản xuất ký bằng khoá bí mật, thiết bị kiểm bằng khoá công khai.
#   Cập nhật hai phân vùng A/B có quay lui theo RFC 9019. Số liệu flash là ví dụ; mọi số do Python trong checks.
objectives:
  - "Phân biệt mã kiểm tổng và chữ ký số"
  - "Giải thích khởi động tin cậy"
  - "Thiết kế cập nhật hai phân vùng có quay lui"
