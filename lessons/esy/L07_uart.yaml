title: "Bài 7 — Giao tiếp nối tiếp không đồng bộ (UART)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/esy.yaml L07; audit/esy/verify_esy.py L07; Maxim Integrated, Application Note 2141: Determining Clock Accuracy Requirements for UART Communications (2003); Microchip, ATmega328P datasheet, mục 19 (USART0)"
assumes: [arith, cdot, frac, approx, ltgt]
# Quy ước: khung 8N1 = 1 bit bắt đầu (0) + 8 bit dữ liệu, bit thấp nhất gửi trước + không chẵn lẻ + 1 bit dừng (1) = 10 bit.
#   Với UART tốc độ baud = số bit mỗi giây. Thanh ghi chia UBRR = round(f_clk / (16 · baud)) − 1 (chế độ thường của ATmega328P).
#   Ngưỡng sai lệch: lấy mẫu giữa bit, tới giữa bit dừng (9,5 bit) lệch tích lũy phải < nửa bit → tổng lệch hai bên < 0,5/9,5 ≈ 5,3%;
#   thực hành giữ mỗi bên ≤ 2% (Maxim AN2141). Mọi số do Python tính trong checks.
objectives:
  - "Đọc một khung UART 8N1"
  - "Tính thời gian truyền và tốc độ byte"
  - "Kiểm sai lệch tốc độ do xung nhịp"
