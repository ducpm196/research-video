scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chữ rác trên màn hình"
    steps:
      - show: |
          <p>Nối vi điều khiển với máy tính, mong thấy “Xin chao”, nhưng màn hình hiện một dãy ký tự rác.</p>
          <p>Dây đúng, mã đúng — chỉ có hai đầu <b>không cùng nhịp</b>.</p>
          <div class="box key">Hôm nay: <b>giao tiếp nối tiếp không đồng bộ</b> (UART) — gửi từng bit qua một sợi dây, không có dây xung nhịp chung.</div>
        focus: [1, 2, 3]
        say: "Chào bạn, bạn nối vi điều khiển với máy tính, mong thấy dòng chữ xin chào, nhưng màn hình chỉ hiện một dãy ký tự rác. Dây đúng, mã đúng, chỉ có hai đầu không cùng nhịp. Hôm nay ta học giao tiếp nối tiếp không đồng bộ, gửi từng bit qua một sợi dây mà không có dây xung nhịp chung."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hệ mười sáu, tần số và chu kỳ, phần trăm lệch"
    checks:
      - "0xA == 10 and 0xB == 11 and 0xF == 15 and 16 == 2 ** 4 and 0x41 == 4 * 16 + 1 and chr(65) == 'A'"
      - "0x41 == 65 and format(0x4, '04b') == '0100' and format(0x1, '04b') == '0001' and format(0x41, '08b') == '01000001'"
      - "round(1 / 9600 * 1000, 3) == 0.104 and round(1 / 1000 * 1000, 3) == 1.0"
      - "round((9615 - 9600) / 9600 * 100, 2) == 0.16"
    steps:
      - show: |
          <table class="t"><tr><th>hệ mười sáu</th><th>4 bit</th></tr>
          <tr><td>16 chữ số</td><td>0 … 9, rồi A = 10, B = 11, …, F = 15</td></tr>
          <tr><td>vì sao 4 bit</td><td>$16 = 2^4$: 4 bit có đúng 16 dãy, mỗi dãy ứng một chữ số</td></tr>
          <tr><td>4</td><td>0100</td></tr><tr><td>1</td><td>0001</td></tr>
          <tr><td><code>0x41</code> (tiền tố <code>0x</code>: hệ mười sáu)</td><td>0100 0001 $= 4 \cdot 16 + 1 = 65$ — mã của chữ “A” trong bảng mã ASCII (bảng quy ước mỗi ký tự một số)</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6", "1.6"]
        say: "Trước hết, ta cần hiểu hệ mười sáu, có 16 chữ số, từ 0 tới 9 rồi A bằng 10, B bằng 11, cứ thế tới F bằng 15. Vì 16 bằng 2 mũ 4, mỗi chữ số hệ mười sáu đúng bằng 4 bit, tức một dãy bốn chữ số 0 hoặc 1. Chữ số 4 là 0 1 0 0. Chữ số 1 là 0 0 0 1. Ghép lại, số 41 hệ mười sáu là 0 1 0 0 0 0 0 1, bằng 4 nhân 16 cộng 1, tức 65 ở hệ mười. Theo bảng mã quy ước mỗi ký tự một con số, 65 chính là mã của chữ A."
      - show: |
          <p>Tần số và chu kỳ nghịch đảo nhau: 9600 bit mỗi giây → mỗi bit dài $\frac{1}{9600}$ giây $\approx 0{,}104$ ms. Thử số tròn: 1000 bit mỗi giây → mỗi bit đúng 1 ms.</p>
        say: "Tiếp theo, tần số và chu kỳ là nghịch đảo của nhau. Thử với số tròn trước, 1000 bit mỗi giây thì mỗi bit dài đúng 1 mi li giây. Với 9600 bit mỗi giây, mỗi bit dài 1 phần 9600 giây, khoảng 0 phẩy 104 mi li giây."
      - show: |
          <p>Phần trăm lệch $= \dfrac{\text{được} - \text{muốn}}{\text{muốn}} \cdot 100\%$. Muốn 9600, được 9615: $\dfrac{15}{9600} \cdot 100\% \approx 0{,}16\%$.</p>
        say: "Cuối cùng là phần trăm lệch, lấy giá trị được trừ giá trị muốn, chia cho giá trị muốn, rồi nhân 100. Muốn 9600 mà được 9615 thì lệch 15 phần 9600, khoảng 0 phẩy 16 phần trăm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: khung 8N1"
    checks:
      - "[(0x41 >> i) & 1 for i in range(8)] == [1, 0, 0, 0, 0, 0, 1, 0]"
      - "1 + 8 + 1 == 10"
    steps:
      - show: |
          <p>Dây rảnh ở mức 1. Mỗi byte đi trong một <b>khung</b> 8N1: 8 bit dữ liệu, không bit chẵn lẻ (bit thêm vào để bên nhận kiểm số bit 1 là chẵn hay lẻ), 1 bit dừng.</p>
          <table class="t"><tr><th>bắt đầu</th><th>b0</th><th>b1</th><th>b2</th><th>b3</th><th>b4</th><th>b5</th><th>b6</th><th>b7</th><th>dừng</th></tr>
          <tr><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td></tr></table>
          <p>Ví dụ chữ “A” = <code>0x41</code> = <code>0b01000001</code>, gửi <b>bit thấp nhất trước</b>. Tổng: $1 + 8 + 1 = 10$ bit cho mỗi byte.</p>
        focus: [1, 1, 1, 2, 3, 3]
        say: "Khi rảnh, dây ở mức 1. Mỗi byte đi trong một khung gọi là 8N1, nghĩa là 8 bit dữ liệu, không có bit chẵn lẻ, và 1 bit dừng. Bit chẵn lẻ, nếu có, là một bit thêm vào để bên nhận kiểm xem số bit 1 là chẵn hay lẻ. Khung bắt đầu bằng một bit 0 để báo hiệu, tiếp theo là 8 bit dữ liệu, cuối cùng là bit dừng bằng 1. Ví dụ chữ A có mã 41 hệ mười sáu, và bit thấp nhất được gửi trước. Tổng cộng mỗi byte tốn 10 bit."

  # ───────────────────────── 3. TỐC ĐỘ ─────────────────────────
  - id: speed
    kind: concept
    title: "Tốc độ: bit mỗi giây và byte mỗi giây"
    checks:
      - "round(1 / 9600 * 1000, 3) == 0.104 and 9600 / 10 == 960"
    steps:
      - show: |
          <p>Hai đầu phải hẹn trước cùng một tốc độ, ví dụ 9600 baud = 9600 bit mỗi giây. Mỗi bit dài $1 / 9600 \approx 0{,}104$ ms.</p>
          <p>Mỗi byte tốn 10 bit → $9600 / 10 = \hl{960}$ byte mỗi giây, không phải 1200.</p>
          <div class="box key">Bên nhận thấy cạnh xuống (chỗ dây đổi từ 1 xuống 0) của bit bắt đầu, đợi <b>nửa bit</b>, rồi cứ mỗi một bit lấy mẫu một lần — đúng giữa bit.</div>
        focus: [1, 1, 2, 3]
        say: "Hai đầu phải hẹn trước cùng một tốc độ, ví dụ 9600 bit mỗi giây. Khi đó mỗi bit dài khoảng 0 phẩy 104 mi li giây. Mỗi byte tốn 10 bit, nên tốc độ là 960 byte mỗi giây, không phải 1200. Bên nhận thấy cạnh xuống, tức chỗ dây đổi từ 1 xuống 0, của bit bắt đầu, đợi nửa bit, rồi cứ mỗi một bit lấy mẫu một lần, đúng vào giữa bit."

  - id: intuition
    kind: intuition
