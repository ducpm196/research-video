</div>
        say: "Hình vẽ khung của chữ A trên dây, đường đen là mức điện áp, mỗi ô giữa hai vạch đứt là một bit. Chấm xanh là chỗ bên nhận đúng nhịp lấy mẫu, đúng giữa mỗi bit nên đọc chắc chắn. Hàng chấm cam là bên nhận chậm hơn 3 phẩy 55 phần trăm, mỗi mẫu trễ thêm một chút, tới bit dừng thì mẫu đã gần sát mép. Hàng chấm đỏ lệch 6 phần trăm, mẫu cuối rơi ra ngoài khung, nên bên nhận đọc sai bit dừng."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Sai lệch tốc độ do xung nhịp"
    checks:
      - "round(16e6 / (16 * 9600)) - 1 == 103 and round((16e6 / (16 * 104) - 9600) / 9600 * 100, 2) == 0.16"
      - "round(16e6 / (16 * 115200)) - 1 == 8 and round((16e6 / (16 * 9) - 115200) / 115200 * 100, 2) == -3.55"
      - "round(0.5 / 9.5 * 100, 1) == 5.3 and 3.55 < 5.3 < round(3.55 + 2, 2)"
    steps:
      - show: |
          <p>Chip chỉ tạo được tốc độ (UBRR: hệ số chia) $\dfrac{f_{\text{clk}}}{16 \cdot (\text{UBRR} + 1)}$ với UBRR nguyên. Xung nhịp 16 MHz.</p>
          <p><b>Bước 1 — chọn hệ số chia cho 9600:</b> $\dfrac{16\,000\,000}{16 \cdot 9600} \approx 104{,}17$, làm tròn 104, trừ 1 → UBRR $= 103$.</p>
        introduces: [sub]
        focus: [1, 2, 2]
        say: "Chip chỉ tạo được tốc độ bằng tần số xung nhịp chia cho 16 nhân hệ số chia cộng 1, với hệ số chia là số nguyên, ở đây xung nhịp 16 mê-ga-héc. Bước một, muốn 9600 thì lấy 16 triệu chia cho 16 nhân 9600, được khoảng 104 phẩy 17. Làm tròn thành 104 rồi trừ 1, nên hệ số chia là 103."
      - show: |
          <p><b>Bước 2 — tốc độ thật:</b> $\dfrac{16\,000\,000}{16 \cdot 104} \approx 9615$, lệch $\dfrac{9615 - 9600}{9600} \approx +0{,}16\%$.</p>
        say: "Bước hai, vì hệ số chia phải nguyên, tốc độ thật là 16 triệu chia cho 16 nhân 104, khoảng 9615, lệch 0 phẩy 16 phần trăm so với 9600, rất nhỏ."
      - clear: true
        show: |
          <p><b>Bước 3 — làm lại với 115 200:</b> $\dfrac{16\,000\,000}{16 \cdot 115\,200} \approx 8{,}68$, làm tròn 9, trừ 1 → UBRR $= 8$.</p>
          <table class="t"><tr><th>muốn</th><th>UBRR</th><th>được</th><th>lệch</th></tr>
          <tr><td>9600</td><td>103</td><td>9615</td><td>+0,16%</td></tr>
          <tr><td>115 200</td><td>8</td><td>111 111</td><td>$\hl{-3{,}55\%}$</td></tr></table>
        focus: [1, 1, "2.3"]
        say: "Bước ba, làm lại với một trăm mười lăm nghìn hai trăm. 16 triệu chia cho 16 nhân một trăm mười lăm nghìn hai trăm được khoảng 8 phẩy 68, làm tròn thành 9 rồi trừ 1, nên hệ số chia là 8. Muốn một trăm mười lăm nghìn hai trăm thì chọn hệ số chia 8, chỉ được khoảng một trăm mười một nghìn, lệch âm 3 phẩy 55 phần trăm."
      - show: |
          <p><b>Bước 4 — so với ngưỡng:</b> lệch tích lũy tới giữa bit dừng (9,5 bit) phải dưới nửa bit: tổng lệch hai bên $\lt 0{,}5 / 9{,}5 \approx 5{,}3\%$ — giới hạn lý tưởng; thực tế thấp hơn vì bên nhận chỉ bắt được cạnh xuống tới khoảng một phần mười sáu bit, nên thực hành giữ mỗi bên dưới 2%.</p>
          <div class="box warn">Lệch 3,55% đã quá 2%: một mình nó còn vừa lọt, nhưng chỉ cần đầu bên kia lệch ngược chiều thêm khoảng 2% là vượt 5,3% — đủ gây chữ rác như lúc mở đầu.</div>
        focus: [1, 1, 1, 2, 2]
        say: "Bước bốn, so với ngưỡng. Lệch tích lũy tới giữa bit dừng phải dưới nửa bit, nên tổng lệch hai bên phải dưới khoảng 5 phẩy 3 phần trăm, thực hành giữ mỗi bên dưới 2 phần trăm. Con số 5 phẩy 3 là giới hạn lý tưởng, thực tế thấp hơn vì bên nhận chỉ bắt được cạnh xuống chính xác tới khoảng một phần mười sáu bit. Lệch 3 phẩy 55 phần trăm là quá rủi ro. Một mình nó còn vừa lọt, nhưng chỉ cần đầu bên kia lệch ngược chiều thêm khoảng 2 phần trăm là vượt ngưỡng, đủ gây chữ rác như lúc mở đầu."

  - id: check
    kind: check
    title: "Tự kiểm: thử cả các hệ số chia bên cạnh"
    checks:
      - "[round((16e6 / (16 * (u + 1)) - 9600) / 9600 * 100, 2) for u in (102, 103, 104)] == [1.13, 0.16, -0.79]"
      - "[round((16e6 / (16 * (u + 1)) - 115200) / 115200 * 100, 2) for u in (7, 8, 9)] == [8.51, -3.55, -13.19]"
      - "round(16e6 / (16 * 115200), 2) == 8.68 and round(16e6 / (16 * 9600), 2) == 104.17"
    steps:
      - show: |
          <table class="t"><tr><th>hệ số chia</th><th>lệch so với 9600</th><th>hệ số chia</th><th>lệch so với 115 200</th></tr>
          <tr><td>102</td><td>+1,13%</td><td>7</td><td>+8,51%</td></tr>
          <tr><td>103</td><td>$\hl{+0{,}16\%}$</td><td>8</td><td>$\hl{-3{,}55\%}$</td></tr>
          <tr><td>104</td><td>$-0{,}79\%$</td><td>9</td><td>$-13{,}19\%$</td></tr></table>
        focus: [1, "1.3", "1.3", 1]
        say: "Kiểm bằng đường khác, vì làm tròn có thể chọn nhầm, ta thử luôn các hệ số chia ở hai bên. Với 9600, hệ số 103 lệch ít nhất, chỉ 0 phẩy 16 phần trăm. Với một trăm mười lăm nghìn hai trăm, hệ số 8 cũng là tốt nhất nhưng vẫn lệch 3 phẩy 55 phần trăm, hai bên cạnh còn tệ hơn nhiều. Vậy với xung nhịp 16 mê-ga-héc, không hệ số chia nào đưa tốc độ ấy về dưới 2 phần trăm."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "round(10 / 9600 * 1000, 3) == 1.042 and round(16e6 * 10 / 9600) == 16667"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nối chân truyền với chân truyền <b class="red">(sai)</b>
          <br><span class="note">Truyền của bên này nối vào <b>nhận</b> của bên kia, và hai bên phải chung dây đất.</span></div>
        say: "Lỗi thứ nhất, nối chân truyền với chân truyền. Chân truyền của bên này phải nối vào chân nhận của bên kia, và hai bên phải chung dây đất."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Hai bên khác tốc độ hoặc khác khung <b class="red">(sai)</b>
          <br><span class="note">9600 với 115 200, hay 8N1 với có bit chẵn lẻ: nhận ra rác, không báo lỗi gì rõ ràng.</span></div>
        say: "Lỗi thứ hai, hai bên khác tốc độ hoặc khác định dạng khung. Bên nhận chỉ thấy rác, mà không có báo lỗi nào rõ ràng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng bộ dao động nội không hiệu chỉnh cho tốc độ cao <b class="red">(rủi ro)</b>
          <br><span class="note">Dao động nội có thể lệch vài phần trăm theo nhiệt độ — cộng thêm lệch do UBRR là vượt ngưỡng. Dùng bộ dao động thạch anh (rất ổn định, lệch cỡ vài chục phần triệu).</span></div>
        say: "Lỗi thứ ba, dùng bộ dao động nội chưa hiệu chỉnh cho tốc độ cao. Dao động nội có thể lệch vài phần trăm theo nhiệt độ, cộng thêm lệch do làm tròn là vượt ngưỡng. Hãy dùng bộ dao động thạch anh, rất ổn định, chỉ lệch cỡ vài chục phần triệu."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Gửi từng byte bằng vòng chờ bận <b class="red">(lãng phí)</b>
          <br><span class="note">Mỗi byte ở 9600 mất hơn 1 ms; chờ bận là bỏ phí hàng nghìn lệnh. Dùng ngắt và <b>bộ đệm vòng</b> (mảng chứa các byte chờ gửi, ghi tới cuối thì quay lại đầu).</span></div>
          <table class="t"><tr><th>một byte ở 9600</th><th>bằng</th></tr><tr><td>thời gian</td><td>10 bit chia 9600, khoảng 1,042 ms</td></tr><tr><td>số nhịp ở 16 MHz</td><td>khoảng 16 667 nhịp chỉ để chờ</td></tr></table>
        focus: [1, 1, 1, 2]
        say: "Lỗi thứ tư, gửi từng byte bằng một vòng chờ bận. Mỗi byte ở tốc độ 9600 mất hơn 1 mi li giây, chờ bận là bỏ phí hàng nghìn lệnh, nên hãy dùng ngắt và một bộ đệm vòng. Bộ đệm vòng là một mảng chứa các byte chờ gửi, ghi tới cuối mảng thì quay lại đầu. Bảng cho thấy mỗi byte mất khoảng 1 phẩy 042 mi li giây, tức khoảng 16 nghìn 667 nhịp đồng hồ chỉ để đứng chờ."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "115200 / 10 == 11520 and round(100 * 10 / 9600 * 1000, 1) == 104.2"
      - "[(0x4B >> i) & 1 for i in range(8)] == [1, 1, 0, 1, 0, 0, 1, 0]"
      - "100 * 10 == 1000 and format(0x4B, '08b') == '01001011' and 0x4B == 75"
      - "round(16e6 / (16 * 38400)) - 1 == 25 and round((16e6 / (16 * 26) - 38400) / 38400 * 100, 2) == 0.16 and 38400 // 10 == 3840 and 3840 >= 3000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ở 115 200 baud, khung 8N1: bao nhiêu byte mỗi giây? Gửi 100 byte ở 9600 baud mất bao lâu?</td></tr>
          <tr><td>2</td><td>Viết 8 bit dữ liệu của <code>0x4B</code> theo thứ tự gửi đi.</td></tr>
          <tr><td>3</td><td>Xung nhịp 16 MHz, cần ít nhất 3000 byte mỗi giây. Chọn 38 400 (UBRR 25, lệch +0,16%) hay 115 200 (lệch −3,55%)?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ở tốc độ một trăm mười lăm nghìn hai trăm bit mỗi giây, khung 8N1, gửi được bao nhiêu byte mỗi giây? Gửi 100 byte ở tốc độ 9600 thì mất bao lâu? Câu hai, viết 8 bit dữ liệu của số 4B hệ mười sáu theo thứ tự được gửi đi. Câu ba, xung nhịp vẫn là 16 mê-ga-héc, và hệ cần gửi ít nhất 3000 byte mỗi giây. Nên chọn tốc độ ba mươi tám nghìn bốn trăm bit mỗi giây, lệch 0 phẩy 16 phần trăm, hay tốc độ lớn hơn lệch âm 3 phẩy 55 phần trăm? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Mỗi byte 10 bit: $115\,200 / 10 = \hl{11\,520}$ byte/s. 100 byte là $100 \cdot 10 = 1000$ bit: $1000 / 9600$ giây $\approx \hl{104{,}2}$ ms.</p>
        say: "Đáp án câu một, chia cho 10, được mười một nghìn năm trăm hai mươi byte mỗi giây. Với vế sau, 100 byte nhân 10 bit là 1000 bit, chia cho 9600 bit mỗi giây. Gửi 100 byte ở tốc độ 9600 mất khoảng 104 phẩy 2 mi li giây."
      - show: |
          <table class="t"><tr><th>bước</th><th>kết quả</th></tr>
          <tr><td>4 → 0100, B → 1011</td><td><code>0b01001011</code></td></tr>
          <tr><td>đọc từ bit thấp nhất (phải sang trái)</td><td>$\hl{1,1,0,1,0,0,1,0}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu hai, đổi từng chữ số hệ mười sáu ra 4 bit, chữ số 4 thành 0 1 0 0, chữ số B thành 1 0 1 1. Ghép hai nhóm lại, ta được 0 1 0 0, rồi tới 1 0 1 1. Bắt đầu từ bit thấp nhất, tức đọc từ phải sang trái, thứ tự gửi là 1, 1, 0, 1, 0, 0, 1, 0."
      - show: |
          <p>③ Tốc độ ba mươi tám nghìn bốn trăm: $38\,400 / 10 = 3840$ byte/s, lớn hơn 3000 — <b>đủ</b>, lại chỉ lệch 0,16%. Chọn <b>38 400</b>; tốc độ cao hơn mà lệch 3,55% là mời gọi chữ rác.</p>
        say: "Câu ba, tốc độ ba mươi tám nghìn bốn trăm chia 10 được 3840 byte mỗi giây, đã đủ hơn 3000, lại chỉ lệch 0 phẩy 16 phần trăm. Vậy ta chọn tốc độ thấp hơn này, còn tốc độ cao hơn mà lệch 3 phẩy 55 phần trăm thì chỉ chuốc lấy chữ rác."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bắt đầu 0, 8 bit thấp trước, dừng 1</span><span class="a">→</span>
          <span class="n">10 bit mỗi byte</span><span class="a">→</span>
          <span class="n">lấy mẫu giữa bit</span><span class="a">→</span>
          <span class="n">lệch tốc độ mỗi bên dưới 2%</span></div>
