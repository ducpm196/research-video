id: L08
course: ESY
series: "ESY · Hệ thống nhúng và thời gian thực"
title: "Bài 8 — Bus I²C và SPI"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/esy.yaml L08; audit/esy/verify_esy.py L08; NXP, UM10204 I²C-bus specification and user manual, Rev. 7 (2021), mục 3.1 và 7.1; Motorola, SPI Block Guide V03.06 (2003)"
assumes: [arith, cdot, frac, approx, ltgt, sub]
# Quy ước: I²C địa chỉ 7 bit; byte địa chỉ = (địa chỉ << 1) | R/W (0 ghi, 1 đọc). Mỗi byte trên I²C tốn 9 nhịp (8 bit + 1 bit xác nhận).
#   Điện trở kéo lên: thời gian lên (30% → 70%) t_r = ln(0,7/0,3) · R · C ≈ 0,8473 R C; giới hạn t_r: 1000 ns (chế độ chuẩn 100 kHz),
#   300 ns (chế độ nhanh 400 kHz) — UM10204 bảng 10; R_min = (V_DD − 0,4 V) / 3 mA. Mọi số do Python trong checks.
objectives:
  - "So sánh I²C và SPI: số dây, tốc độ, cách chọn thiết bị"
  - "Ghép byte địa chỉ I²C"
  - "Chọn điện trở kéo lên cho I²C"
