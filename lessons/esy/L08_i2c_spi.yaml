scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một bo mạch, mười chip"
    steps:
      - show: |
          <p>Một bo mạch có cảm biến nhiệt, cảm biến gia tốc, bộ nhớ, màn hình… Nối mỗi chip bằng một cổng nối tiếp riêng thì hết chân.</p>
          <div class="box key">Hôm nay: hai <b>bus</b> dùng chung dây cho nhiều chip, có <b>dây xung nhịp chung</b> nên không lo lệch tốc độ: <b>I²C</b> và <b>SPI</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một bo mạch có cảm biến nhiệt, cảm biến gia tốc, bộ nhớ, màn hình, và nhiều chip khác. Nếu nối mỗi chip bằng một cổng nối tiếp riêng thì vi điều khiển sẽ hết chân. Hôm nay ta học hai chuẩn kết nối dùng chung dây cho nhiều chip, có dây xung nhịp chung nên không lo lệch tốc độ, đó là I²C và SPI."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: dịch trái là nhân 2, định luật Ôm, tiền tố nhỏ"
    checks:
      - "0x48 == 72 and 72 * 2 == 144 and 144 == 0x90 and 0x48 << 1 == 0x90"
      - "round(2.9 / 1000 * 1000, 1) == 2.9 and round(2.9 / 0.003) == 967"
      - "round(1000 * 100e-12 * 1e9) == 100"
    steps:
      - show: |
          <p>Dịch trái 1 bit là nhân 2: <code>0x48</code> $= 72$, $72 \cdot 2 = 144 =$ <code>0x90</code>. Bit cuối mới sinh ra bằng 0, để trống cho một thông tin khác.</p>
        say: "Trước hết, ôn lại ở khoá Hệ thống máy tính, dịch trái 1 bit là nhân 2. Số 48 hệ mười sáu là 72, nhân 2 được 144, chính là 90 hệ mười sáu. Bit cuối mới sinh ra bằng 0, để trống cho một thông tin khác, và bài này sẽ dùng chỗ trống đó."
      - show: |
          <table class="t"><tr><th>định luật Ôm</th><th>làm thử</th></tr>
          <tr><td>dòng $I = \dfrac{U}{R}$</td><td>2,9 V qua 1000 Ω: $I = 2{,}9$ mA</td></tr>
          <tr><td>điện trở $R = \dfrac{U}{I}$</td><td>giữ dòng điện 3 mA với 2,9 V: $R = \dfrac{2{,}9}{0{,}003} \approx 967$ Ω</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Tiếp theo là định luật Ôm, dòng điện bằng điện áp chia điện trở. Ví dụ 2 phẩy 9 vôn đặt lên 1000 ôm thì dòng là 2 phẩy 9 mi-li-am-pe. Đảo lại, muốn dòng điện không quá 3 mi-li-am-pe với 2 phẩy 9 vôn thì điện trở phải khoảng 967 ôm trở lên."
      - show: |
          <table class="t"><tr><th>tiền tố</th><th>bằng</th><th>làm thử</th></tr>
          <tr><td>na-nô (ns)</td><td>một phần tỉ</td><td rowspan="2">$R \cdot C = 1000$ Ω nhân 100 pF $= 100$ ns</td></tr>
          <tr><td>pi-cô (pF)</td><td>một phần nghìn tỉ</td></tr></table>
        focus: [1, "1.2"]
        say: "Cuối cùng là hai tiền tố rất nhỏ, na-nô là một phần tỉ, còn pi-cô là một phần nghìn tỉ. Nhân điện trở với điện dung thì ra một khoảng thời gian, ví dụ 1000 ôm nhân 100 pi-cô-pha-ra bằng 100 na-nô giây."

  # ───────────────────────── 2. SO SÁNH ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hai cách nối nhiều chip"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>SPI</th><th>I²C</th></tr>
          <tr><td>dây</td><td>xung nhịp, ra, vào + một dây <b>chọn chip</b> cho mỗi chip</td><td>chỉ 2: dữ liệu SDA, xung nhịp SCL</td></tr>
          <tr><td>chọn chip</td><td>kéo dây chọn chip của nó xuống 0</td><td>gửi <b>địa chỉ</b> 7 bit trên dây</td></tr>
          <tr><td>tốc độ</td><td>hàng chục MHz, gửi và nhận cùng lúc</td><td>100 kHz hoặc 400 kHz</td></tr>
          <tr><td>xác nhận</td><td>không có</td><td>mỗi byte có bit xác nhận</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "So sánh hai chuẩn. Về số dây, SPI cần dây xung nhịp, dây ra, dây vào, cộng thêm một dây chọn chip cho mỗi chip, còn I²C chỉ cần hai dây, dữ liệu và xung nhịp. Về cách chọn chip, SPI kéo dây chọn chip của nó xuống 0, còn I²C gửi một địa chỉ 7 bit trên dây. Về tốc độ, SPI chạy hàng chục mê-ga-héc và gửi nhận cùng lúc, còn I²C thường chạy một trăm hoặc bốn trăm ki-lô-héc. Về xác nhận, SPI không có, còn I²C có một bit xác nhận sau mỗi byte."

  # ───────────────────────── 3. I2C ─────────────────────────
  - id: i2c
    kind: concept
    title: "Một lần đọc thanh ghi trên I²C"
    checks:
      - "hex(0x48 << 1) == '0x90' and hex((0x48 << 1) | 1) == '0x91'"
      - "9 * 4 == 36 and 5 * 9 == 45 and len(['0x90', 'thanh ghi', '0x91', 'dữ liệu 1', 'dữ liệu 2']) == 5"
    steps:
      - show: |
          <p>Byte địa chỉ = địa chỉ 7 bit dịch trái 1, bit cuối: 0 là ghi, 1 là đọc. Cảm biến địa chỉ <code>0x48</code>: ghi <code>0x90</code>, đọc <code>0x91</code>.</p>
          <div class="chain"><span class="n">bắt đầu</span><span class="a">→</span><span class="n">0x90 + xác nhận</span><span class="a">→</span><span class="n">số thanh ghi + xác nhận</span><span class="a">→</span><span class="n">bắt đầu lại</span><span class="a">→</span><span class="n">0x91 + xác nhận</span><span class="a">→</span><span class="n">2 byte dữ liệu</span><span class="a">→</span><span class="n">dừng</span></div>
          <p class="note">Mỗi byte tốn 9 nhịp (8 bit + 1 bit xác nhận): 4 byte là 36 nhịp, chưa kể bắt đầu và dừng. Lần đọc trên có 5 byte: $5 \cdot 9 = 45$ nhịp.</p>
        focus: [1, 1, 2, 2, 3, 3]
        say: "Byte địa chỉ bằng địa chỉ 7 bit dịch trái 1 vị trí, bit cuối bằng 0 nghĩa là ghi, bằng 1 nghĩa là đọc. Cảm biến có địa chỉ 48 hệ mười sáu thì byte ghi là 90, byte đọc là 91. Để đọc một thanh ghi, ta gửi byte ghi kèm số thanh ghi, rồi bắt đầu lại và gửi byte đọc. Sau đó chip trả về 2 byte dữ liệu, mỗi byte đều có bit xác nhận. Mỗi byte tốn 9 nhịp, nên 4 byte là 36 nhịp, chưa kể bắt đầu và dừng. Lần đọc thanh ghi ở trên gồm 5 byte, nên tốn 5 nhân 9, bằng 45 nhịp."

