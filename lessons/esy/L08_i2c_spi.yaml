  # ───────────────────────── 4. ĐIỆN TRỞ KÉO LÊN ─────────────────────────
  - id: example
    kind: example
    title: "Chọn điện trở kéo lên"
    checks:
      - "round(math.log(0.7 / 0.3), 4) == 0.8473"
      - "round(300e-9 / (0.8473 * 200e-12)) == 1770 and round((3.3 - 0.4) / 3e-3) == 967"
    steps:
      - show: |
          <p>Chip trên I²C chỉ <b>kéo dây xuống 0</b>; mức 1 do <b>điện trở kéo lên</b> $R$ tạo ra. Dây có điện dung $C$, nên lên mức 1 mất thời gian.</p>
          <p><b>Bước 1 — thời gian lên</b> (từ 30% lên 70% điện áp): $t_r = \ln\dfrac{0{,}7}{0{,}3} \cdot R\,C \approx 0{,}8473\,R\,C$.</p>
        introduces: [log]
        focus: [1, 1, 2, 2]
        say: "Chip trên I²C chỉ có thể kéo dây xuống 0, còn mức 1 do một điện trở kéo lên tạo ra. Dây có điện dung, nên từ 0 lên 1 phải mất thời gian. Bước một, thời gian lên từ 30 lên 70 phần trăm điện áp bằng lô-ga-rít tự nhiên, ký hiệu l n, của 0 phẩy 7 chia 0 phẩy 3, nhân điện trở nhân điện dung. Con số đó xấp xỉ 0 phẩy 8473 nhân R nhân C."
      - show: |
          <p><b>Bước 2 — biên trên:</b> chế độ 400 kHz cho phép $t_r \le 300$ ns. Dây $C = 200$ pF:</p>
          <p>$R \le \dfrac{300 \cdot 10^{-9}}{0{,}8473 \cdot 200 \cdot 10^{-12}} \approx \hl{1770}$ Ω.</p>
        focus: [1, 2]
        say: "Bước hai, tìm biên trên của điện trở, vì chế độ bốn trăm ki-lô-héc cho phép thời gian lên tối đa 300 na-nô giây. Dây có điện dung 200 pi-cô-pha-ra thì điện trở không được quá khoảng 1770 ôm."
      - show: |
          <p><b>Bước 3 — biên dưới:</b> $R$ nhỏ thì dòng lớn; chip chỉ hút được 3 mA khi giữ mức 0,4 V. Nguồn 3,3 V: $R \ge \dfrac{3{,}3 - 0{,}4}{0{,}003} \approx \hl{967}$ Ω.</p>
        say: "Bước ba, tìm biên dưới, vì điện trở càng nhỏ thì dòng càng lớn. Chip chỉ hút được 3 mi-li-am-pe khi giữ mức 0 phẩy 4 vôn, nên với nguồn 3 phẩy 3 vôn, theo định luật Ôm điện trở phải từ khoảng 967 ôm trở lên."
      - clear: true
        show: |
          <table class="t"><tr><th>thử $R$</th><th>$t_r = 0{,}8473 \cdot R \cdot 200$ pF</th><th>dòng $\frac{2{,}9 \text{ V}}{R}$</th><th>kết luận</th></tr>
          <tr><td>1 kΩ</td><td>169 ns, đạt</td><td>2,9 mA, đạt</td><td>được</td></tr>
          <tr><td>1,5 kΩ</td><td>254 ns, đạt</td><td>1,93 mA, đạt</td><td>$\hl{\text{chọn}}$, xa cả hai biên</td></tr>
          <tr><td>1,8 kΩ</td><td>305 ns, vượt</td><td>1,61 mA, đạt</td><td>chậm quá</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", 1]
        say: "Bước bốn, thử vài giá trị điện trở thông dụng với cả hai biên. 1 ki-lô-ôm cho thời gian lên 169 na-nô giây và dòng điện 2 phẩy 9 mi-li-am-pe, đều đạt nhưng sát biên dòng. 1 phẩy 5 ki-lô-ôm cho 254 na-nô giây và 1 phẩy 93 mi-li-am-pe, xa cả hai biên. 1 phẩy 8 ki-lô-ôm đã cho 305 na-nô giây, vượt giới hạn 300. Ta chọn trong khoảng 1 tới 1 phẩy 7 ki-lô-ôm, ví dụ 1 phẩy 5 ki-lô-ôm."

  - id: check
    kind: check
    title: "Tự kiểm: cho điện áp lên từng na-nô giây"
    checks:
      - "(lambda k: (next(t for t in range(1, 2000) if 1 - (1 - k) ** t >= 0.3), next(t for t in range(1, 2000) if 1 - (1 - k) ** t >= 0.7)))(1e-9 / (1500 * 200e-12)) == (107, 361)"
      - "round(-math.log(0.7) * 300) == 107 and round(-math.log(0.3) * 300) == 361 and 361 - 107 == 254"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác: mỗi na-nô giây, điện áp tiến thêm phần $\frac{1}{RC}$ của khoảng còn lại</th><th>kết quả</th></tr>
          <tr><td>chạm 30% ở khoảng</td><td>107 ns</td></tr>
          <tr><td>chạm 70% ở khoảng</td><td>361 ns</td></tr>
          <tr><td>chênh lệch</td><td>$361 - 107 = 254$ ns ✓ — khớp $0{,}8473 \cdot 1500 \cdot 200$ pF</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, vì công thức lô-ga-rít rất dễ bấm nhầm, ta cho điện áp đi từng na-nô giây, mỗi lần tiến thêm một phần R nhân C của khoảng còn lại. Với 1 phẩy 5 ki-lô-ôm và 200 pi-cô-pha-ra, điện áp chạm 30 phần trăm ở khoảng 107 na-nô giây. Nó chạm 70 phần trăm ở khoảng 361 na-nô giây. Hiệu là 254 na-nô giây, khớp đúng công thức ở bước một."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "round(1000e-9 / (0.8473 * 200e-12)) == 5901 and round(0.8473 * 10000 * 200e-12 * 1e9) == 1695 and 1695 > 1000 and 1695 > 300"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên điện trở kéo lên của I²C <b class="red">(sai)</b>
          <br><span class="note">Không ai kéo dây lên 1: bus treo ở 0 hoặc chập chờn theo nhiễu.</span></div>
        say: "Lỗi thứ nhất, quên điện trở kéo lên của I²C. Không có gì kéo dây lên mức 1, nên đường dây treo ở 0 hoặc chập chờn theo nhiễu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng điện trở 10 kΩ cho dây dài ở 400 kHz <b class="red">(sai)</b>
          <br><span class="note">Với 200 pF, ngay cả chế độ 100 kHz cũng chỉ cho tới khoảng 5,9 kΩ: cạnh lên quá chậm, bit bị đọc sai.</span></div>
          <table class="t"><tr><th>10 kΩ, 200 pF</th><th>thời gian lên</th><th>giới hạn</th></tr><tr><td>chế độ 400 kHz</td><td>1695 ns</td><td>300 ns, vượt</td></tr><tr><td>chế độ 100 kHz</td><td>1695 ns</td><td>1000 ns, vượt</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ hai, dùng điện trở 10 ki-lô-ôm cho dây dài ở bốn trăm ki-lô-héc. Với 200 pi-cô-pha-ra, ngay cả chế độ một trăm ki-lô-héc cũng chỉ cho tới khoảng 5 phẩy 9 ki-lô-ôm, cạnh lên quá chậm và bit bị đọc sai. Bảng tính sẵn, 10 ki-lô-ôm cho thời gian lên 1695 na-nô giây, vượt cả hai giới hạn 300 và 1000 na-nô giây."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nhầm địa chỉ 7 bit với byte địa chỉ <b class="red">(sai)</b>
          <br><span class="note">Có nơi ghi <code>0x48</code>, có nơi ghi <code>0x90</code> cho cùng một chip. Biết rõ thư viện của bạn muốn dạng nào.</span></div>
        say: "Lỗi thứ ba, nhầm địa chỉ 7 bit với byte địa chỉ đã dịch. Có nơi ghi 48, có nơi ghi 90 cho cùng một chip, nên phải biết rõ thư viện đang dùng muốn dạng nào."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Hai bên SPI khác chế độ xung nhịp <b class="red">(sai)</b>
          <br><span class="note">SPI có 4 chế độ (mức nghỉ của xung nhịp, cạnh lấy mẫu). Lệch chế độ thì mọi bit lệch nửa nhịp; không có bit xác nhận nào báo lỗi.</span></div>
        say: "Lỗi thứ tư, hai bên SPI khác chế độ xung nhịp. SPI có 4 chế độ, khác nhau ở mức nghỉ của xung nhịp và cạnh lấy mẫu. Lệch chế độ thì mọi bit lệch nửa nhịp, mà không có bit xác nhận nào báo lỗi."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "hex(0x3C << 1) == '0x78' and hex((0x3C << 1) | 1) == '0x79'"
      - "round(300e-9 / (0.8473 * 100e-12)) == 3541"
      - "0x3C == 60 and 60 * 2 == 120 and 120 == 0x78 and 120 + 1 == 0x79"
      - "967 <= 1000 <= 3541 and 967 <= 2200 <= 3541 and 4700 > 3541 and round(2.9 / 1000 * 1000, 2) == 2.9 and round(2.9 / 2200 * 1000, 2) == 1.32 and round(0.8473 * 2200 * 100e-12 * 1e9) == 186"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Màn hình địa chỉ 7 bit <code>0x3C</code>: byte địa chỉ khi ghi và khi đọc?</td></tr>
          <tr><td>2</td><td>Chế độ 400 kHz, dây 100 pF: điện trở kéo lên lớn nhất?</td></tr>
          <tr><td>3</td><td>Cùng dây 100 pF, nguồn 3,3 V: chọn 1 kΩ, 2,2 kΩ hay 4,7 kΩ?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, màn hình có địa chỉ 7 bit là 3C hệ mười sáu, byte địa chỉ khi ghi và khi đọc là gì? Câu hai, chế độ bốn trăm ki-lô-héc, dây có điện dung 100 pi-cô-pha-ra, điện trở kéo lên lớn nhất là bao nhiêu? Câu ba, vẫn dây 100 pi-cô-pha-ra và nguồn 3 phẩy 3 vôn, nên chọn 1 ki-lô-ôm, 2 phẩy 2 ki-lô-ôm, hay 4 phẩy 7 ki-lô-ôm? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① <code>0x3C</code> $= 60$; dịch trái 1: $60 \cdot 2 = 120 =$ <code>0x78</code> → ghi $\hl{\texttt{0x78}}$; thêm bit đọc bằng 1 → $\hl{\texttt{0x79}}$.</p>
        say: "Đáp án câu một, dịch trái 1 vị trí, byte ghi là 78 và byte đọc là 79. Tính chậm lại, số 3C hệ mười sáu là 60, nhân 2 được 120, tức đúng 78 hệ mười sáu, thêm bit đọc bằng 1 thì thành 79."
      - show: |
          <p>② $R \le 300 \cdot 10^{-9} / (0{,}8473 \cdot 100 \cdot 10^{-12}) \approx \hl{3541}$ Ω — điện dung giảm một nửa nên biên trên gấp đôi 1770.</p>
        say: "Câu hai, điện dung giảm một nửa nên điện trở lớn nhất gấp đôi, khoảng 3541 ôm. Thay thẳng 100 pi-cô-pha-ra vào công thức biên trên cũng cho đúng con số này."
      - show: |
          <table class="t"><tr><th>thử</th><th>trong khoảng 967 tới 3541 Ω?</th><th>ghi chú</th></tr>
          <tr><td>1 kΩ</td><td>có</td><td>dòng điện 2,9 mA, sát biên 3 mA</td></tr>
          <tr><td>2,2 kΩ</td><td>có</td><td>$\hl{\text{chọn}}$: dòng điện 1,32 mA, lên trong 186 ns</td></tr>
          <tr><td>4,7 kΩ</td><td>không, quá 3541</td><td>cạnh lên quá chậm</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu ba, biên dưới vẫn là 967 ôm vì nguồn không đổi, biên trên là 3541 ôm. 1 ki-lô-ôm nằm trong khoảng nhưng dòng điện 2 phẩy 9 mi-li-am-pe, sát biên 3 mi-li-am-pe. 2 phẩy 2 ki-lô-ôm cho dòng điện 1 phẩy 32 mi-li-am-pe và thời gian lên 186 na-nô giây, xa cả hai biên, nên ta chọn nó. 4 phẩy 7 ki-lô-ôm vượt 3541 ôm, cạnh lên quá chậm."

