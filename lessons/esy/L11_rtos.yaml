scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một vòng lặp làm mọi việc"
    steps:
      - show: |
          <p>Vòng lặp chính vừa đọc cảm biến, vừa giải mã lệnh từ cổng nối tiếp, vừa vẽ màn hình. Vẽ màn hình mất 30 ms — trong lúc đó lệnh đến bị mất.</p>
          <div class="box key">Hôm nay: <b>hệ điều hành thời gian thực</b> — chia chương trình thành các <b>tác vụ</b>, truyền dữ liệu bằng <b>hàng đợi</b>, và đồng bộ an toàn.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, vòng lặp chính vừa đọc cảm biến, vừa giải mã lệnh từ cổng nối tiếp, vừa vẽ màn hình. Vẽ màn hình mất 30 mi li giây, và trong lúc đó lệnh đến bị mất. Hôm nay ta học hệ điều hành thời gian thực, chia chương trình thành các tác vụ, truyền dữ liệu bằng hàng đợi, và đồng bộ một cách an toàn."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: byte mỗi giây, làm tròn lên, ngắt"
    checks:
      - "1 + 8 + 1 == 10 and 9600 // 10 == 960 and round(960 * 0.020, 1) == 19.2"
      - "math.ceil(19.2) == 20 and 19 < 19.2"
      - "9600 // 8 == 1200"
    steps:
      - show: |
          <table class="t"><tr><th>phần của khung</th><th>số bit</th></tr>
          <tr><td>bit bắt đầu</td><td>1</td></tr><tr><td>dữ liệu</td><td>8</td></tr><tr><td>bit dừng</td><td>1</td></tr>
          <tr><td>cộng</td><td>$\hl{10}$ bit cho mỗi byte</td></tr></table>
          <p>Cổng 9600 bit mỗi giây → $\frac{9600}{10} = 960$ byte mỗi giây; trong 20 ms đến $960 \cdot 0{,}02 = 19{,}2$ byte.</p>
        focus: [1, "1.2", "1.5", 2, 2]
        say: "Trước hết, nhắc lại khung truyền nối tiếp ở bài 7, mỗi byte được gói trong một khung. Khung gồm một bit bắt đầu, tám bit dữ liệu, và một bit dừng. Cộng lại là 10 bit cho mỗi byte. Vì thế cổng chạy 9600 bit mỗi giây chỉ mang được 960 byte mỗi giây, chứ không phải 1200. Trong 20 mi li giây, tức 0 phẩy 02 giây, đến 960 nhân 0 phẩy 02, bằng 19 phẩy 2 byte."
      - show: |
          <p>Làm tròn lên: $\lceil 19{,}2 \rceil = 20$. Vì sao không lấy 19? 19 chỗ chứa được 19 byte, phần 0,2 byte nghĩa là có lúc byte thứ 20 đã tới — không có chỗ thì <b>mất</b>.</p>
        introduces: [ceil]
        say: "Tiếp theo là phép làm tròn lên, 19 phẩy 2 làm tròn lên thành 20. Vì sao không lấy 19, vì mỗi chỗ trong hàng đợi chứa trọn một byte, nên phần 0 phẩy 2 nghĩa là có lúc byte thứ 20 đã tới, không có chỗ thì byte đó bị mất."
      - clear: true
        show: |
          <table class="t"><tr><th>lúc</th><th>bộ xử lý làm gì</th></tr>
          <tr><td>trước</td><td>chương trình đang vẽ màn hình</td></tr>
          <tr><td>byte đến</td><td>phần cứng báo ngắt, việc vẽ tạm dừng</td></tr>
          <tr><td>ngay sau</td><td>hàm xử lý ngắt chạy, rất ngắn</td></tr>
          <tr><td>xong ngắt</td><td>quay lại vẽ đúng chỗ dở</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Cuối cùng, nhắc lại ngắt ở bài 2, đây là cách phần cứng chen ngang chương trình. Giả sử chương trình đang vẽ màn hình. Khi một byte đến, phần cứng báo ngắt, và việc vẽ tạm dừng. Hàm xử lý ngắt chạy ngay, và phải rất ngắn. Xong ngắt, bộ xử lý quay lại vẽ tiếp đúng chỗ đang dở."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: tác vụ và ba trạng thái"
    steps:
      - show: |
          <p><b>Tác vụ</b>: một hàm chạy mãi, có <b>ngăn xếp riêng</b> (vùng nhớ riêng cất biến cục bộ và chỗ quay về sau mỗi lần gọi hàm) và một <b>mức ưu tiên</b>. Bộ lập lịch chọn tác vụ sẵn sàng có ưu tiên cao nhất (như bài 9).</p>
          <table class="t"><tr><th>trạng thái</th><th>nghĩa</th></tr>
          <tr><td>đang chạy</td><td>đang dùng bộ xử lý</td></tr>
          <tr><td>sẵn sàng</td><td>muốn chạy, chờ tới lượt</td></tr>
          <tr><td>bị chặn</td><td>chờ một sự kiện: hết thời gian ngủ, dữ liệu vào hàng đợi, khoá được nhả</td></tr></table>
          <p class="note">Tác vụ bị chặn <b>không tốn</b> bộ xử lý — khác hẳn vòng chờ bận.</p>
        focus: [1, 1, 1, 2, "2.2", "2.3", "2.4", 3]
        say: "Tác vụ là một hàm chạy mãi, có ngăn xếp riêng và một mức ưu tiên. Ngăn xếp là vùng nhớ riêng để cất biến cục bộ và chỗ phải quay về sau mỗi lần gọi hàm. Bộ lập lịch luôn chọn tác vụ sẵn sàng có ưu tiên cao nhất, như ở bài 9. Mỗi tác vụ ở một trong ba trạng thái. Đang chạy nghĩa là đang dùng bộ xử lý. Sẵn sàng nghĩa là muốn chạy và đang chờ tới lượt. Bị chặn nghĩa là đang chờ một sự kiện, như hết thời gian ngủ, có dữ liệu vào hàng đợi, hay khoá được nhả. Tác vụ bị chặn không tốn bộ xử lý, khác hẳn một vòng chờ bận."

  # ───────────────────────── 3. HÀNG ĐỢI ─────────────────────────
  - id: queue
    kind: concept
    title: "Ngắt đẩy, tác vụ lấy"
    steps:
      - show: |
          <div class="code"><div><span class="cm">// hàm xử lý ngắt nhận: chỉ đẩy byte vào hàng đợi</span></div><div>void uart_isr(void) { uint8_t b = UDR0; queue_send_from_isr(q, &amp;b); }</div><div></div><div><span class="cm">// tác vụ giải mã, ưu tiên thường: bị chặn tới khi có byte</span></div><div>void decode_task(void) { uint8_t b; for (;;) { queue_receive(q, &amp;b, WAIT_FOREVER); parse(b); } }</div></div>
          <div class="box key">Ngắt ngắn (bài 2); việc giải mã chạy trong tác vụ. Tác vụ vẽ màn hình ưu tiên <b>thấp hơn</b>: byte đến lúc nào cũng được ngắt cất vào hàng đợi, không mất.</div>
        focus: [1, 1, 1, 2, 2]
        say: "Hàm xử lý ngắt nhận chỉ làm một việc, đẩy byte vừa đến vào hàng đợi, đúng quy tắc ngắn ở bài 2. Tác vụ giải mã có ưu tiên thường, nó bị chặn tới khi hàng đợi có byte, lấy ra và giải mã. Khi hàng đợi trống, tác vụ này không tốn gì. Còn tác vụ vẽ màn hình được đặt ưu tiên thấp hơn. Dù đang vẽ, byte đến lúc nào cũng được ngắt cất vào hàng đợi, nên không bị mất."

  - id: intuition
    kind: intuition
    title: "Byte đi đâu khi tác vụ đang bận?"
    checks:
      - "115200 / 10 / 1000 == 11.52 and round(10 * 11.52, 1) == 115.2 and round(64 / 11.52, 1) == 5.6"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><defs><marker id="arE11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g fill="#1f2937"><rect x="20" y="90" width="220" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><rect x="320" y="90" width="220" height="80" rx="10" fill="#fff7ed" stroke="#eb6834" stroke-width="3"/><rect x="620" y="105" width="28" height="50" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><rect x="654" y="105" width="28" height="50" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><rect x="688" y="105" width="28" height="50" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><rect x="722" y="105" width="28" height="50" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><rect x="756" y="105" width="28" height="50" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><rect x="790" y="105" width="28" height="50" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="824" y="105" width="28" height="50" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="858" y="105" width="28" height="50" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="1000" y="90" width="240" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><rect x="1000" y="220" width="240" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="240" y1="130" x2="316" y2="130" marker-end="url(#arE11)"/><line x1="540" y1="130" x2="612" y2="130" marker-end="url(#arE11)"/><line x1="894" y1="130" x2="996" y2="130" marker-end="url(#arE11)"/></g><g font-size="22" text-anchor="middle"><text x="130" y="125">byte đến</text><text x="130" y="155" font-size="19">từ cổng nối tiếp</text><text x="430" y="125">hàm xử lý ngắt</text><text x="430" y="155" font-size="19">chỉ đẩy vào</text><text x="752" y="85" fill="#2a78d6">hàng đợi: 5 byte đang chờ</text><text x="752" y="190" font-size="19" fill="#2a78d6">ô trắng = chỗ còn trống</text><text x="1120" y="125">tác vụ giải mã</text><text x="1120" y="155" font-size="19">bị chặn khi trống</text><text x="1120" y="255">tác vụ vẽ màn hình</text><text x="1120" y="285" font-size="19">ưu tiên thấp hơn</text></g><g font-size="19"><text x="20" y="205">cứ 86,8 phần triệu giây</text><text x="20" y="230">lại có một byte</text></g><text x="20" y="40" font-size="22">Byte không bao giờ chờ tác vụ: ngắt cất nó vào hàng đợi ngay khi tới.</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ đường đi của một byte, từ lúc tới cổng cho tới lúc được giải mã. Byte đến cổng nối tiếp thì hàm xử lý ngắt chạy ngay, việc duy nhất của nó là đẩy byte vào hàng đợi, ở đây đang có 5 byte chờ. Tác vụ giải mã lấy từng byte ra theo nhịp của nó, còn tác vụ vẽ màn hình có ưu tiên thấp hơn, nên dù vẽ lâu cũng không làm mất byte nào."
      - clear: true
        show: |
          <div><svg width="1500" height="370" viewBox="0 0 1500 370"><g fill="#1f2937"><line x1="200" y1="310" x2="1400" y2="310" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="310" x2="200" y2="40" stroke="#6b7280" stroke-width="2"/><text x="200" y="338" text-anchor="middle" font-size="19">0</text><text x="400" y="338" text-anchor="middle" font-size="19">2</text><text x="600" y="338" text-anchor="middle" font-size="19">4</text><text x="800" y="338" text-anchor="middle" font-size="19">6</text><text x="1000" y="338" text-anchor="middle" font-size="19">8</text><text x="1200" y="338" text-anchor="middle" font-size="19">10</text><text x="1400" y="338" text-anchor="middle" font-size="19">12</text><line x1="200" y1="54" x2="1400" y2="54" stroke="#059669" stroke-width="3" stroke-dasharray="10 6"/><line x1="200" y1="78" x2="1400" y2="78" stroke="#d97706" stroke-width="3" stroke-dasharray="10 6"/><line x1="200" y1="182" x2="1400" y2="182" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 6"/><line x1="200" y1="310" x2="1200" y2="79.6" stroke="#2a78d6" stroke-width="5"/><circle cx="1200" cy="79.6" r="9" fill="#2a78d6"/><circle cx="756" cy="182" r="9" fill="#b91c1c"/><g font-size="21"><text x="1410" y="52" fill="#059669">128 chỗ</text><text x="1410" y="98" fill="#d97706">116 chỗ</text><text x="1410" y="189" fill="#b91c1c">64 chỗ</text><text x="772" y="212" fill="#b91c1c">đầy lúc 5,6 ms, từ đây mất byte</text><text x="1216" y="125" fill="#2a78d6">10 ms: 115,2 byte</text><text x="1400" y="365" text-anchor="end">thời gian tác vụ giải mã bị giữ, ms</text><text x="20" y="50">số byte cần chỗ</text></g></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Nhưng nếu chính tác vụ giải mã bị một tác vụ ưu tiên cao hơn giữ lại thì sao, hình vẽ số byte chờ theo thời gian bị giữ. Byte vẫn đến đều, mỗi mi li giây khoảng 11 phẩy 52 byte, nên đường xanh đi lên thẳng, tới 10 mi li giây là 115 phẩy 2 byte. Hàng đợi 64 chỗ đã đầy lúc khoảng 5 phẩy 6 mi li giây, từ đó mọi byte đến đều bị mất. Đường 116 chỗ nằm vừa trên điểm cuối, còn 128 chỗ để thêm một khoảng dư."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Hàng đợi cần bao nhiêu chỗ?"
    checks:
      - "115200 / 10 == 11520 and round(1 / 11520 * 1e6, 1) == 86.8"
      - "round(11520 * 0.010, 1) == 115.2 and math.ceil(11520 * 0.010) == 116"
    steps:
      - show: |
          <p><b>Bước 1 — tốc độ đến:</b> 115 200 baud, khung 8N1 (10 bit mỗi byte): $\frac{115\,200}{10} = 11\,520$ byte mỗi giây, tức cứ $\frac{1}{11\,520}$ giây $\approx 86{,}8$ phần triệu giây một byte.</p>
        say: "Bước một, tính tốc độ đến, cổng nối tiếp chạy một trăm mười lăm nghìn hai trăm bit mỗi giây, khung 8N1, mỗi byte tốn 10 bit. Vậy mỗi giây đến mười một nghìn năm trăm hai mươi byte, cứ khoảng 86 phẩy 8 phần triệu giây một byte."
      - show: |
          <p><b>Bước 2 — số byte dồn lại:</b> tác vụ giải mã có thể bị tác vụ ưu tiên cao hơn giữ tới 10 ms = 0,01 giây. Trong đó đến $11\,520 \cdot 0{,}01 = 115{,}2$ byte.</p>
        say: "Bước hai, giả sử tác vụ giải mã có thể bị tác vụ ưu tiên cao hơn giữ tới 10 mi li giây, tức 0 phẩy 01 giây. Trong 10 mi li giây đó đến 115 phẩy 2 byte."
      - show: |
          <p><b>Bước 3 — làm tròn lên:</b> hàng đợi cần ít nhất $\lceil 115{,}2 \rceil = \hl{116}$ chỗ — 115 chỗ thì có lúc byte thứ 116 không còn chỗ.</p>
        say: "Bước ba, làm tròn lên vì mỗi chỗ chứa trọn một byte, nên hàng đợi cần ít nhất 116 chỗ. Nếu chỉ có 115 chỗ, sẽ có lúc byte thứ 116 tới mà không còn chỗ để cất."
      - clear: true
        show: |
          <table class="t"><tr><th>chọn cỡ</th><th>dư so với 116</th><th>tốn RAM (vi điều khiển 2 KB = 2048 byte)</th></tr>
          <tr><td>116</td><td>0 — không có biên</td><td>$\frac{116}{2048} \approx 5{,}7\%$</td></tr>
          <tr><td>128</td><td>12 chỗ</td><td>$\frac{128}{2048} = 6{,}25\%$</td></tr></table>
          <p><b>Bước 4 — biên an toàn:</b> chọn $\hl{128}$, dư 12 chỗ cho sai số đo, chỉ tốn thêm 12 byte bộ nhớ.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước bốn, cộng thêm biên an toàn, ta so hai cỡ. Lấy đúng 116 thì không có chỗ dư nào, và tốn khoảng 5 phẩy 7 phần trăm bộ nhớ của một vi điều khiển 2 ki-lô-byte. Lấy 128 thì dư 12 chỗ, tốn đúng 6 phẩy 25 phần trăm bộ nhớ. Vì vậy chọn 128, đổi 12 byte bộ nhớ lấy một khoảng dư cho sai số khi đo thời gian bị giữ."

  - id: check
    kind: check
    title: "Tự kiểm: hàng đợi đầy sau bao lâu?"
    checks:
      - "round(116 / 11520 * 1000, 2) == 10.07 and round(115 / 11520 * 1000, 2) == 9.98"
      - "round(116 * 86.8 / 1000, 2) == 10.07 and 116 / 11520 >= 0.010 > 115 / 11520"
      - "round(116 / 2048 * 100, 1) == 5.7 and 128 / 2048 * 100 == 6.25 and 128 - 116 == 12 and round(1 / 11520 * 1e6, 1) == 86.8"
    steps:
      - show: |
          <p>Đường khác: thay vì nhân tốc độ với thời gian, hỏi ngược lại — hàng đợi <b>đầy sau bao lâu</b>? Mỗi byte cách nhau khoảng 86,8 phần triệu giây.</p>
          <table class="t"><tr><th>cỡ hàng đợi</th><th>đầy sau</th><th>so với 10 ms bị giữ</th></tr>
          <tr><td>115 chỗ</td><td>$\frac{115}{11\,520}$ giây $\approx 9{,}98$ ms</td><td>đầy trước khi tác vụ quay lại → mất byte</td></tr>
          <tr><td>116 chỗ</td><td>$\frac{116}{11\,520}$ giây $\approx 10{,}07$ ms</td><td>còn kịp ✓ — khớp kết quả 116</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Kiểm bằng đường khác, vì phép nhân rồi làm tròn có thể làm tròn nhầm. Thay vì nhân tốc độ với thời gian, ta hỏi ngược lại, hàng đợi đầy sau bao lâu, biết mỗi byte cách nhau khoảng 86 phẩy 8 phần triệu giây. Ta đặt hai cỡ hàng đợi cạnh nhau. Hàng đợi 115 chỗ đầy sau khoảng 9 phẩy 98 mi li giây, trước khi tác vụ giải mã được chạy lại, nên mất byte. Hàng đợi 116 chỗ đầy sau khoảng 10 phẩy 07 mi li giây, vẫn kịp, khớp với kết quả 116 ở trên."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "round(64 / 11.52, 1) == 5.6 and int(11520 * 0.010) == 115 and 115 - 64 == 51"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Gọi hàm có thể chờ trong hàm xử lý ngắt <b class="red">(sai)</b>
          <br><span class="note">Ngắt không phải tác vụ, không thể bị chặn: chờ trong ngắt làm treo hệ thống. Chỉ dùng bản “gọi từ ngắt”, không bao giờ chờ.</span></div>
        say: "Lỗi thứ nhất, gọi một hàm có thể chờ ngay trong hàm xử lý ngắt. Ngắt không phải tác vụ nên không thể bị chặn, chờ trong ngắt sẽ làm treo hệ thống. Chỉ dùng phiên bản dành riêng cho ngắt, loại không bao giờ chờ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Hai tác vụ dùng chung biến mà không khoá <b class="red">(sai)</b>
          <br><span class="note">Tác vụ có thể bị cắt ngang giữa đọc–sửa–ghi (bài 1). Dùng hàng đợi để chuyển dữ liệu, hoặc khoá có kế thừa ưu tiên (bài 10: tác vụ đang giữ khoá tạm mang ưu tiên của tác vụ cao đang chờ, để tác vụ trung bình không chen vào).</span></div>
        say: "Lỗi thứ hai, hai tác vụ dùng chung biến mà không khoá. Tác vụ có thể bị cắt ngang giữa đọc, sửa và ghi, như bài 1, nên hãy dùng hàng đợi để chuyển dữ liệu, hoặc dùng khoá có kế thừa ưu tiên như bài 10. Nhắc lại, kế thừa ưu tiên nghĩa là tác vụ đang giữ khoá tạm mang ưu tiên của tác vụ cao đang chờ, để tác vụ trung bình không chen vào được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tác vụ ưu tiên cao chạy mãi không bị chặn <b class="red">(sai)</b>
          <br><span class="note">Mọi tác vụ thấp hơn không bao giờ được chạy. Mỗi vòng của tác vụ phải chờ một sự kiện hoặc ngủ.</span></div>
        say: "Lỗi thứ ba, một tác vụ ưu tiên cao chạy mãi mà không bao giờ bị chặn. Khi đó mọi tác vụ thấp hơn không bao giờ được chạy, nên mỗi vòng của một tác vụ phải chờ một sự kiện hoặc ngủ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Chọn cỡ hàng đợi theo cảm giác <b class="red">(thiếu)</b>
          <br><span class="note">Đầy hàng đợi là mất dữ liệu mà không ai biết. Tính như ví dụ, và đếm số lần đẩy thất bại để phát hiện.</span></div>
          <table class="t"><tr><th>chọn “cho chắc” 64 chỗ, bị giữ 10 ms</th><th>kết quả</th></tr><tr><td>đầy sau</td><td>$\frac{64}{11{,}52} \approx 5{,}6$ ms</td></tr><tr><td>byte đến trong 10 ms</td><td>115</td></tr><tr><td>byte mất</td><td>$115 - 64 = \hl{51}$</td></tr></table>
        focus: [1, 1, 2, "2.4"]
        say: "Lỗi thứ tư, chọn cỡ hàng đợi theo cảm giác. Hàng đợi đầy là mất dữ liệu mà không ai biết, nên hãy tính như ví dụ vừa rồi, và đếm số lần đẩy thất bại để phát hiện sớm. Chẳng hạn chọn 64 chỗ cho chắc, thì với 115 byte đến trong 10 mi li giây, hàng đợi đầy sau khoảng 5 phẩy 6 mi li giây. Kết quả là 51 byte bị mất trong một lần tác vụ bị giữ, và lệnh nhận được bị cắt cụt."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "9600 / 10 == 960 and round(960 * 0.020, 1) == 19.2 and math.ceil(960 * 0.020) == 20"
      - "round(16 / 960 * 1000, 1) == 16.7 and 16 / 960 < 0.020 and 16 < 20"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cổng 9600 baud, 8N1. Tác vụ đọc có thể bị giữ tới 20 ms. Hàng đợi cần ít nhất mấy chỗ?</td></tr>
          <tr><td>2</td><td>Trong ngắt, gọi hàm “chờ khoá tối đa 5 ms” được không?</td></tr>
          <tr><td>3</td><td>Đồng nghiệp đề xuất hàng đợi 16 chỗ cho câu 1 để tiết kiệm bộ nhớ. Duyệt hay không?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cổng nối tiếp 9600 bit mỗi giây, khung 8N1, tác vụ đọc có thể bị giữ tới 20 mi li giây, hàng đợi cần ít nhất mấy chỗ? Câu hai, trong hàm xử lý ngắt, có được gọi hàm chờ khoá tối đa 5 mi li giây không? Câu ba, một đồng nghiệp đề xuất hàng đợi 16 chỗ cho câu một để tiết kiệm bộ nhớ, bạn có duyệt không? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $\frac{9600}{10} = 960$ byte/s; $960 \cdot 0{,}02 = 19{,}2$ → làm tròn lên: ít nhất $\hl{20}$ chỗ, cộng biên an toàn.</p>
        say: "Đáp án câu một, 960 byte mỗi giây, trong 20 mi li giây đến 19 phẩy 2 byte, nên cần ít nhất 20 chỗ, cộng thêm biên an toàn."
      - show: |
          <p>② $\hl{\text{Không}}$: hàm xử lý ngắt không phải tác vụ, không có trạng thái “bị chặn”. Chờ dù 5 ms cũng là chờ — trong lúc đó mọi tác vụ đều đứng. Ngắt chỉ được gọi bản không chờ.</p>
        say: "Câu hai, không được, vì hàm xử lý ngắt không phải tác vụ nên không có trạng thái bị chặn. Chờ dù ngắn cũng là chờ, trong 5 mi li giây đó mọi tác vụ đều phải đứng yên, và ngắt chỉ được gọi phiên bản không chờ."
      - show: |
          <p>③ 16 chỗ đầy sau $\frac{16}{960}$ giây $\approx 16{,}7$ ms $\lt$ 20 ms → mất byte. <b>Không duyệt</b>: cần ít nhất 20 chỗ, mà 4 chỗ thêm chỉ tốn 4 byte.</p>
        say: "Câu ba là một quyết định, hàng đợi 16 chỗ đầy sau 16 chia 960 giây, khoảng 16 phẩy 7 mi li giây, sớm hơn 20 mi li giây bị giữ, nên sẽ mất byte. Vì vậy không duyệt, cần ít nhất 20 chỗ, mà 4 chỗ thêm chỉ tốn đúng 4 byte bộ nhớ."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tác vụ: ngăn xếp riêng, ưu tiên</span><span class="a">→</span>
          <span class="n">bị chặn thì không tốn</span><span class="a">→</span>
          <span class="n">ngắt đẩy, tác vụ lấy</span><span class="a">→</span>
          <span class="n">cỡ hàng đợi = tốc độ đến nhân thời gian bị giữ</span></div>
        say: "Tổng kết lại, mỗi tác vụ có ngăn xếp riêng và một mức ưu tiên, và tác vụ bị chặn thì không tốn bộ xử lý. Ngắt đẩy dữ liệu vào hàng đợi, tác vụ lấy ra, và cỡ hàng đợi bằng tốc độ đến nhân thời gian bị giữ lâu nhất."
      - show: |
          <div class="box key"><b>Tư duy:</b> tách “nhận nhanh” khỏi “xử lý chậm”, nối chúng bằng một bộ đệm có kích thước được tính ra.</div>
        say: "Điều cần mang theo, hãy tách phần nhận nhanh khỏi phần xử lý chậm, và nối chúng bằng một bộ đệm có kích thước được tính ra."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>độ tin cậy</b> — bộ giám sát, tràn ngăn xếp, cấp phát động.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học về độ tin cậy, với bộ giám sát, tràn ngăn xếp và cấp phát động. Hẹn gặp bạn ở bài tiếp theo."
