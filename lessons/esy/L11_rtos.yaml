# Quy ước: mã minh hoạ dùng tên hàm chung (task_create, queue_send_from_isr, queue_receive) — mỗi hệ điều hành đặt tên khác
#   (FreeRTOS: xTaskCreate, xQueueSendFromISR, xQueueReceive). Cỡ hàng đợi = ⌈tốc độ đến · khoảng thời gian xấu nhất giữa hai lần lấy⌉,
#   chưa kể biên an toàn. Khung 8N1 như bài 7 (10 bit mỗi byte). Mọi số do Python trong checks.
objectives:
  - "Chia chương trình thành các tác vụ có ưu tiên"
  - "Truyền dữ liệu từ ngắt sang tác vụ bằng hàng đợi"
  - "Biết hàm nào được gọi trong ngắt"
