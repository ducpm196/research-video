assumes: [arith, cdot, frac, approx, ltgt]
# Quy ước: dòng trung bình = d · I_thức + (1 − d) · I_ngủ (alg.avg_current), d tỉ lệ thời gian thức. Tuổi thọ (giờ) = dung lượng mAh / dòng
#   trung bình mA. Mô hình lý tưởng: bỏ qua tự xả của pin, nhiệt độ, dòng đỉnh — nói rõ ở lỗi 3. Mọi số do alg.avg_current trong checks.
objectives:
  - "Tính dòng trung bình theo chu kỳ thức–ngủ"
  - "Ước lượng tuổi thọ pin"
  - "Biết phần nào đang quyết định tuổi thọ"
asr_reviewed:
  - {sentence: "Đèn báo nguồn, bộ ổn áp, cảm biến không được tắt, mỗi thứ tốn từ vài mi-crô-am-pe tới vài mi-li-am-pe, cộng thẳng vào dòng ngủ.", reason: "ASR chép “Đen báo nguồn, bộ ổn áp, cảm biến không được tắt, mỗi thứ tốn từ vài microamper tới vài milliamper, cộng thẳng vào dòng ngủ.” (0.786): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: đèn/đen, am pe (trong “mi crô am pe” → “microamper”), am pe (trong “mi li am pe” → “milliamper”) — NOT_VERIFIED bằng tai người"}
