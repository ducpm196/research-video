  - {sentence: "Ngủ ở 100 mi-crô-am-pe thay vì 10, dòng trung bình thành 0 phẩy 199 mi-li-am-pe, và tuổi thọ tụt từ 379 xuống 209 ngày.", reason: "ASR chép “100 microampe thấy vì 10 … 0,199 miliampe … 379 xuống 209 ngày”: đơn vị và mọi số đúng; thay/thấy nhầm thanh"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Pin hết sau bốn ngày thay vì một năm"
    steps:
      - show: |
          <p>Cảm biến đo nhiệt độ mỗi phút, pin 1000 mAh. Thức liên tục ở 10 mA: $1000 / 10 = 100$ giờ — hơn bốn ngày.</p>
          <div class="box key">Hôm nay: <b>chế độ ngủ</b> — thức ngắn, ngủ dài — và cách tính <b>tuổi thọ pin</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một cảm biến đo nhiệt độ mỗi phút, dùng pin một nghìn mi-li-am-pe giờ. Nếu thức liên tục ở 10 mi-li-am-pe, pin chỉ dùng được 100 giờ, hơn bốn ngày. Hôm nay ta học chế độ ngủ, thức thật ngắn rồi ngủ thật dài, và cách tính tuổi thọ pin."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: mi-li-am-pe giờ, mi-crô-am-pe, trung bình có trọng số"
    checks:
      - "1000 / 10 == 100 and 1000 / 1 == 1000 and round(100 / 24, 1) == 4.2"
      - "10 / 1000 == 0.01 and 100 / 1000 == 0.1"
      - "(1 * 10 + 9 * 0) / 10 == 1.0 and 0.1 * 10 + 0.9 * 0 == 1.0"
    steps:
      - show: |
          <table class="t"><tr><th>pin 1000 mAh, dòng</th><th>dùng được</th></tr>
          <tr><td>10 mA</td><td>$\frac{1000}{10} = 100$ giờ $\approx 4{,}2$ ngày</td></tr>
          <tr><td>1 mA</td><td>$\frac{1000}{1} = 1000$ giờ</td></tr></table>
          <p class="note">Dòng điện (am-pe, A; 1 mA = một phần nghìn A) đo lượng điện chảy qua mạch mỗi giây. mAh = mi-li-am-pe nhân giờ: dung lượng chia dòng ra số giờ; chia tiếp 24 ra số ngày.</p>
        focus: [2, "1.2", "1.3", 2]
        say: "Trước hết, ta cần hiểu đơn vị của pin, bắt đầu từ dòng điện, đo lượng điện chảy qua mạch mỗi giây, tính bằng am-pe, mà một mi-li-am-pe là một phần nghìn am-pe. Pin một nghìn mi-li-am-pe giờ khi thiết bị tiêu thụ 10 mi-li-am-pe thì dùng được một nghìn chia 10, bằng 100 giờ, khoảng 4 phẩy 2 ngày. Nếu thiết bị chỉ tiêu thụ 1 mi-li-am-pe thì dùng được một nghìn giờ. Nghĩa là lấy dung lượng chia cho dòng điện ra số giờ, rồi chia tiếp cho 24 thì ra số ngày."
      - show: |
          <table class="t"><tr><th>đổi đơn vị</th><th>làm thử</th></tr>
          <tr><td>1 mA = 1000 µA</td><td>10 µA = 0,01 mA; 100 µA = 0,1 mA</td></tr>
          <tr><td>trung bình có trọng số</td><td>10 giây: 1 giây ở 10 mA, 9 giây ở 0 mA → $\frac{1 \cdot 10 + 9 \cdot 0}{10} = 0{,}1 \cdot 10 = 1$ mA</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Tiếp theo, một mi-li-am-pe bằng một nghìn mi-crô-am-pe, nên 10 mi-crô-am-pe là 0 phẩy 01 mi-li-am-pe, còn 100 mi-crô-am-pe là 0 phẩy 1 mi-li-am-pe. Còn trung bình có trọng số thì xét 10 giây, trong đó 1 giây chạy ở 10 mi-li-am-pe và 9 giây không tốn gì. Dòng trung bình là 10 chia 10, bằng 1 mi-li-am-pe, giống hệt 0 phẩy 1 nhân 10, tức tỉ lệ thời gian nhân dòng điện."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: tỉ lệ thức và dòng trung bình"
    checks:
      - "abs(alg.avg_current(0.01, 10, 0.01) - 0.1099) < 1e-12"
      - "round(1000 / 0.1099) == 9099 and round(1000 / 0.1099 / 24) == 379"
    steps:
      - show: |
          <div><svg width="900" height="300" viewBox="0 0 900 300"><polyline points="100,60 112,60 112,230 300,230 300,60 312,60 312,230 500,230 500,60 512,60 512,230 700,230" fill="none" stroke="#2a78d6" stroke-width="3.5"/><text x="88" y="66" font-size="18" fill="#6b7280" text-anchor="end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">10 mA</text><text x="88" y="236" font-size="18" fill="#6b7280" text-anchor="end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">10 µA</text><text x="700" y="30" font-size="19" fill="#1f2937" text-anchor="end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">thức 1% thời gian, ngủ 99% (tỉ lệ vẽ phóng to)</text><text x="700" y="280" font-size="18" fill="#6b7280" text-anchor="end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">thời gian</text></svg></div>
          <p>Gọi $d$ là tỉ lệ thời gian thức. Dòng trung bình: $I = d \cdot I_{\text{thức}} + (1 - d) \cdot I_{\text{ngủ}}$.</p>
        introduces: [sub]
        focus: [1, 1, 2, 2]
        say: "Hình vẽ dòng điện theo thời gian, thiết bị thức một đoạn ngắn ở dòng cao, rồi ngủ một đoạn dài ở dòng rất thấp. Tỉ lệ trên hình được phóng to cho dễ nhìn. Gọi d là tỉ lệ thời gian thức. Dòng trung bình bằng d nhân dòng lúc thức, cộng 1 trừ d nhân dòng lúc ngủ."
      - show: |
          <p>Thức 1% ở 10 mA, ngủ 10 µA (0,01 mA): $I = 0{,}01 \cdot 10 + 0{,}99 \cdot 0{,}01 = \hl{0{,}1099}$ mA.</p>
          <p>Tuổi thọ: $1000 / 0{,}1099 \approx 9099$ giờ $\approx \hl{379}$ ngày — gấp gần 91 lần thức liên tục.</p>
        focus: [1, 1, 2, 2]
        say: "Làm thử, thức 1 phần trăm thời gian ở 10 mi-li-am-pe, ngủ ở 10 mi-crô-am-pe, tức 0 phẩy 01 mi-li-am-pe. Dòng trung bình bằng 0 phẩy 1099 mi-li-am-pe. Tuổi thọ pin là một nghìn chia 0 phẩy 1099, khoảng 9099 giờ. Tức khoảng 379 ngày, gấp gần 91 lần so với thức liên tục."

  - id: intuition
    kind: intuition
    title: "Thức càng ít, phần ngủ càng nặng"
    checks:
      - "[round(100 * d * 10 / alg.avg_current(d, 10, 0.01)) for d in (0.1, 0.01, 0.001, 0.0001)] == [99, 91, 50, 9]"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g fill="#1f2937" font-size="22"><text x="270" y="80" text-anchor="end">thức 10%</text><rect x="290" y="50" width="753" height="42" fill="#2a78d6"/><rect x="1043" y="50" width="7" height="42" fill="#d97706"/><text x="1070" y="80">thức 99%, ngủ 1%</text><text x="270" y="145" text-anchor="end">thức 1%</text><rect x="290" y="115" width="692" height="42" fill="#2a78d6"/><rect x="982" y="115" width="68" height="42" fill="#d97706"/><text x="1070" y="145">thức 91%, ngủ 9%</text><text x="270" y="210" text-anchor="end">thức 0,1%</text><rect x="290" y="180" width="380" height="42" fill="#2a78d6"/><rect x="670" y="180" width="380" height="42" fill="#d97706"/><text x="1070" y="210">thức 50%, ngủ 50%</text><text x="270" y="275" text-anchor="end">thức 0,01%</text><rect x="290" y="245" width="69" height="42" fill="#2a78d6"/><rect x="359" y="245" width="691" height="42" fill="#d97706"/><text x="1070" y="275">thức 9%, ngủ 91%</text><line x1="670" y1="40" x2="670" y2="297" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 6"/><rect x="290" y="318" width="22" height="16" fill="#2a78d6"/><text x="320" y="333" font-size="20">phần do lúc thức (10 mA)</text><rect x="640" y="318" width="22" height="16" fill="#d97706"/><text x="670" y="333" font-size="20">phần do lúc ngủ (10 µA)</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình chia dòng trung bình thành hai phần, phần xanh do lúc thức ở 10 mi-li-am-pe, phần cam do lúc ngủ ở 10 mi-crô-am-pe. Thức 10 phần trăm thời gian thì phần thức chiếm gần hết, 99 phần trăm. Thức 1 phần trăm thì phần thức còn 91 phần trăm, tới 0 phẩy 1 phần trăm thì hai phần bằng nhau. Thức 0 phẩy 01 phần trăm thì phần ngủ chiếm 91 phần trăm, nên lúc này muốn pin bền phải giảm dòng ngủ."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Phần nào đang quyết định tuổi thọ?"
    checks:
      - "round(0.01 * 10 / 0.1099, 2) == 0.91"
      - "abs(alg.avg_current(0.01, 5, 0.01) - 0.0599) < 1e-12 and round(1000 / 0.0599 / 24) == 696"
      - "abs(alg.avg_current(0.0001, 10, 0.01) - 0.010999) < 1e-12 and round(0.0099990 / 0.010999, 2) == 0.91"
    steps:
      - show: |
          <p><b>Bước 1 — thức 1%, 10 mA:</b></p>
          $$0{,}01 \cdot 10 = 0{,}1 \qquad 0{,}99 \cdot 0{,}01 = 0{,}0099 \qquad \frac{0{,}1}{0{,}1099} \approx \hl{91\%}$$
        focus: [1, 2, 2]
        say: "Bước một, tách hai phần của trường hợp thức 1 phần trăm ở 10 mi-li-am-pe. Phần thức là 0 phẩy 01 nhân 10, bằng 0 phẩy 1 mi-li-am-pe, phần ngủ là 0 phẩy 99 nhân 0 phẩy 01, bằng 0 phẩy 0099. Chia phần thức cho tổng 0 phẩy 1099, phần thức chiếm khoảng 91 phần trăm."
      - show: |
          <p><b>Bước 2 — giảm dòng thức xuống 5 mA:</b></p>
          $$0{,}01 \cdot 5 + 0{,}0099 = 0{,}0599 \text{ mA} \qquad \frac{1000}{0{,}0599} \approx 16\,694 \text{ giờ} \approx \hl{696} \text{ ngày}$$
        focus: [1, 2, 2]
        say: "Bước hai, vì phần thức đang lớn nhất, ta giảm dòng thức xuống 5 mi-li-am-pe. Dòng trung bình còn 0 phẩy 0599 mi-li-am-pe. Pin dùng được khoảng 16694 giờ, tức khoảng 696 ngày, gần gấp đôi 379 ngày."
      - show: |
          <p><b>Bước 3 — chỉ thức 0,01%, 10 mA:</b></p>
          $$0{,}0001 \cdot 10 = 0{,}001 \qquad 0{,}9999 \cdot 0{,}01 = 0{,}009999 \qquad \frac{0{,}009999}{0{,}010999} \approx \hl{91\%}$$
        focus: [1, 2, 2]
        say: "Bước ba, đổi sang thiết bị chỉ thức 0 phẩy 01 phần trăm thời gian. Phần thức chỉ còn 0 phẩy 001, phần ngủ là 0 phẩy 009999 mi-li-am-pe. Lúc này phần ngủ lại chiếm khoảng 91 phần trăm của dòng trung bình."
      - clear: true
        show: |
          <table class="t"><tr><th>trường hợp</th><th>phần thức</th><th>phần ngủ</th><th>trung bình</th></tr>
          <tr><td>thức 1%, 10 mA</td><td>0,1 mA (91%)</td><td>0,0099 mA</td><td>0,1099 mA → 379 ngày</td></tr>
          <tr><td>thức 1%, 5 mA</td><td>0,05 mA</td><td>0,0099 mA</td><td>0,0599 mA → $\hl{696}$ ngày</td></tr>
          <tr><td>thức 0,01%, 10 mA</td><td>0,001 mA</td><td>0,0099990 mA ($\hl{91\%}$)</td><td>0,010999 mA</td></tr></table>
          <div class="box key">Thức nhiều: giảm dòng thức (hay thức ngắn hơn). Thức rất ít: <b>dòng ngủ</b> quyết định — 10 µA lúc này là phần lớn nhất.</div>
        focus: [1, 2, 2]
        say: "Bước bốn, đặt ba trường hợp cạnh nhau để trả lời câu hỏi phần nào đang quyết định tuổi thọ. Khi thức nhiều, hãy giảm dòng thức hay thức ngắn hơn. Khi thức rất ít, dòng ngủ mới là thứ quyết định, và 10 mi-crô-am-pe lúc này là phần lớn nhất."

  - id: check
    kind: check
    title: "Tự kiểm: đếm điện tích trong một phút"
    checks:
      - "round(0.6 * 10 + 59.4 * 0.01, 3) == 6.594 and round(6.594 / 60, 4) == 0.1099"
      - "1000 * 3600 == 3600000 and round(3600000 / 6.594) == 545951 and round(3600000 / 6.594 / 1440) == 379"
      - "round(1000 / 0.0599) == 16694 and round(0.009999 / 0.010999, 2) == 0.91"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác: một chu kỳ 60 giây</th><th>tính</th></tr>
          <tr><td>thức 1% = 0,6 giây ở 10 mA</td><td>$0{,}6 \cdot 10 = 6$ mA nhân giây</td></tr>
          <tr><td>ngủ 59,4 giây ở 0,01 mA</td><td>$59{,}4 \cdot 0{,}01 = 0{,}594$ mA nhân giây</td></tr>
          <tr><td>cả phút</td><td>$6{,}594 / 60 = 0{,}1099$ mA ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, vì công thức có thể nhớ nhầm, nên ta không dùng công thức tỉ lệ mà đếm điện tích tiêu tốn trong một phút. Thức 1 phần trăm của 60 giây là 0 phẩy 6 giây ở 10 mi-li-am-pe, tốn 6 đơn vị mi-li-am-pe nhân giây. Ngủ 59 phẩy 4 giây ở 0 phẩy 01 mi-li-am-pe, tốn 0 phẩy 594 đơn vị. Cộng lại 6 phẩy 594, chia cho 60 giây được 0 phẩy 1099 mi-li-am-pe, khớp công thức."
      - show: |
          <p>Pin: $1000 \cdot 3600 = 3\,600\,000$ mA nhân giây; chia $6{,}594$ mỗi phút $\approx 545\,951$ phút; chia $1440$ phút mỗi ngày $\approx \hl{379}$ ngày ✓</p>
        say: "Tuổi thọ cũng tính lại được theo đường này. Pin một nghìn mi-li-am-pe giờ chứa 3 triệu 600 nghìn đơn vị mi-li-am-pe nhân giây, mỗi phút tốn 6 phẩy 594, nên dùng được khoảng 545951 phút. Một ngày có 1440 phút, chia ra được khoảng 379 ngày, khớp kết quả ban đầu."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "abs(alg.avg_current(0.01, 10, 0.1) - 0.199) < 1e-12 and round(1000 / 0.199 / 24) == 209"
      - "round(1000 / 0.1099 / 24) == 379 and 209 / 379 < 0.56"
      - "round((3.3 - 2.0) / 1000 * 1000, 1) == 1.3 and round(1.3 / 0.01) == 130"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bỏ qua dòng ngủ vì “chỉ vài chục µA” <b class="red">(sai)</b>
          <br><span class="note">Ngủ 100 µA thay vì 10 µA: dòng trung bình 0,199 mA, tuổi thọ tụt từ 379 xuống 209 ngày.</span></div>
          <table class="t"><tr><th>dòng ngủ</th><th>dòng trung bình</th><th>tuổi thọ</th></tr><tr><td>10 µA</td><td>0,1099 mA</td><td>379 ngày</td></tr><tr><td>100 µA</td><td>0,199 mA</td><td>209 ngày</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ nhất, bỏ qua dòng ngủ vì chỉ vài chục mi-crô-am-pe. Ngủ ở 100 mi-crô-am-pe thay vì 10, dòng trung bình thành 0 phẩy 199 mi-li-am-pe, và tuổi thọ tụt từ 379 xuống 209 ngày. Bảng đặt hai con số cạnh nhau, dòng ngủ tăng 10 lần làm mất gần một nửa tuổi thọ pin."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên linh kiện ngoài vi điều khiển <b class="red">(thiếu)</b>
          <br><span class="note">Đèn báo nguồn, bộ ổn áp (mạch giữ điện áp nguồn đều), cảm biến không tắt: mỗi thứ từ vài µA tới vài mA, cộng vào dòng ngủ. Ví dụ một đèn qua điện trở 1 kΩ ở 3,3 V, đèn sụt 2 V (số minh hoạ): $(3{,}3 - 2) / 1000 = 1{,}3$ mA, gấp 130 lần dòng ngủ 10 µA.</span></div>
        say: "Lỗi thứ hai, quên các linh kiện ngoài vi điều khiển. Đèn báo nguồn, bộ ổn áp, cảm biến không được tắt, mỗi thứ tốn từ vài mi-crô-am-pe tới vài mi-li-am-pe, cộng thẳng vào dòng ngủ. Lấy số minh hoạ, một đèn nối qua điện trở 1000 ôm ở 3 phẩy 3 vôn đã tốn khoảng 1 phẩy 3 mi-li-am-pe, gấp 130 lần dòng ngủ 10 mi-crô-am-pe."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tin con số tuổi thọ lý tưởng <b class="red">(lạc quan)</b>
          <br><span class="note">Pin tự xả, giảm dung lượng khi lạnh hay khi dòng đỉnh cao. Tính ra 10 năm thì thực tế thường ngắn hơn nhiều; đo dòng thật trên mạch.</span></div>
        say: "Lỗi thứ ba, tin con số tuổi thọ lý tưởng. Pin tự xả, và giảm dung lượng khi trời lạnh hay khi dòng đỉnh cao, nên tính ra 10 năm thì thực tế thường ngắn hơn nhiều. Hãy đo dòng thật trên mạch."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Để chân vào bỏ lửng khi ngủ <b class="red">(sai)</b>
          <br><span class="note">Chân lửng (không nối vào đâu) trôi giữa 0 và 1, mạch vào tốn dòng. Kéo về một mức cố định trước khi ngủ.</span></div>
        say: "Lỗi thứ tư, để chân vào bỏ lửng khi ngủ. Chân lửng, tức không nối vào đâu, trôi giữa 0 và 1 làm mạch vào tốn dòng, nên phải kéo về một mức cố định trước khi ngủ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(alg.avg_current(0.001, 20, 0.005) - 0.024995) < 1e-12"
      - "round(1000 / 0.024995) == 40008 and round(1000 / 0.024995 / 24) == 1667"
      - "round(0.001 * 20, 6) == 0.02 and round(0.999 * 0.005, 6) == 0.004995 and round(0.02 / 0.024995, 2) == 0.8"
      - "round(1000 / alg.avg_current(0.001, 10, 0.005) / 24) == 2779 and round(1000 / alg.avg_current(0.001, 20, 0.0025) / 24) == 1852"
      - "round(40008 / 24 / 365, 1) == 4.6"
    steps:
      - show: |
          <p>Thức 0,1% ở 20 mA, ngủ 5 µA, pin 1000 mAh.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Dòng trung bình?</td></tr>
          <tr><td>2</td><td>Tuổi thọ lý tưởng (giờ, ngày)?</td></tr>
          <tr><td>3</td><td>Chỉ được sửa một thứ: giảm dòng thức còn 10 mA, hay giảm dòng ngủ còn 2,5 µA? Chọn cái nào?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm, thiết bị thức 0 phẩy 1 phần trăm ở 20 mi-li-am-pe, ngủ ở 5 mi-crô-am-pe, pin một nghìn mi-li-am-pe giờ. Câu một, dòng trung bình là bao nhiêu? Câu hai, tuổi thọ lý tưởng là bao nhiêu giờ, bao nhiêu ngày? Câu ba, nếu chỉ được sửa một thứ, giảm dòng thức còn 10 mi-li-am-pe hay giảm dòng ngủ còn 2 phẩy 5 mi-crô-am-pe, bạn chọn cách nào? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Phần thức $0{,}001 \cdot 20 = 0{,}02$; phần ngủ $0{,}999 \cdot 0{,}005 = 0{,}004995$; cộng: $\hl{0{,}024995}$ mA.</p>
          <p>② $1000 / 0{,}024995 \approx 40\,008$ giờ; chia 24: $\approx \hl{1667}$ ngày (hơn 4,5 năm) — trên giấy; tự xả của pin sẽ cắt bớt.</p>
        focus: [1, 1, 2, 2]
        say: "Câu một làm theo hai phần như ví dụ, phần thức là 0 phẩy 001 nhân 20, bằng 0 phẩy 02, phần ngủ là 0 phẩy 999 nhân 0 phẩy 005, bằng 0 phẩy 004995. Đáp án câu một, dòng trung bình khoảng 0 phẩy 024995 mi-li-am-pe. Câu hai, lấy một nghìn chia cho dòng trung bình, tuổi thọ khoảng 40008 giờ. Chia tiếp cho 24 được 1667 ngày, hơn 4 năm rưỡi trên giấy, còn thực tế tự xả của pin sẽ cắt bớt."
      - clear: true
        show: |
          <p>③ Phần thức $\frac{0{,}02}{0{,}024995} \approx 80\%$ — phần lớn nhất. Thử cả hai cách:</p>
          <table class="t"><tr><th>sửa</th><th>dòng trung bình</th><th>tuổi thọ</th></tr>
          <tr><td>dòng thức 10 mA</td><td>$0{,}01 + 0{,}004995 = 0{,}014995$ mA</td><td>$\hl{2779}$ ngày</td></tr>
          <tr><td>dòng ngủ 2,5 µA</td><td>$0{,}02 + 0{,}0024975 = 0{,}0224975$ mA</td><td>1852 ngày</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Câu ba, trước hết tính tỉ trọng, phần thức chiếm khoảng 80 phần trăm, nên nó là phần lớn nhất. Ta vẫn thử cả hai cách cho chắc. Giảm dòng thức còn 10 mi-li-am-pe thì dòng trung bình còn 0 phẩy 014995, pin dùng được khoảng 2779 ngày. Giảm dòng ngủ còn một nửa thì chỉ được khoảng 1852 ngày, nên ta chọn giảm dòng thức, đúng như tỉ trọng đã báo trước."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$I = d \cdot I_{\text{thức}} + (1 - d) \cdot I_{\text{ngủ}}$</span><span class="a">→</span>
          <span class="n">tuổi thọ = dung lượng / $I$</span><span class="a">→</span>
          <span class="n">tìm phần đang lớn nhất</span><span class="a">→</span>
          <span class="n">đo trên mạch thật</span></div>
        say: "Tổng kết lại, dòng trung bình bằng tỉ lệ thức nhân dòng thức, cộng tỉ lệ ngủ nhân dòng ngủ. Tuổi thọ bằng dung lượng chia dòng trung bình. Hãy tìm phần đang lớn nhất để tối ưu, và đo trên mạch thật."
      - show: |
          <div class="box key"><b>Tư duy:</b> tối ưu phần đang chiếm nhiều nhất. Tính tỉ trọng trước, rồi mới bỏ công sức.</div>
        say: "Điều cần mang theo, hãy tối ưu phần đang chiếm nhiều nhất. Tính tỉ trọng trước, rồi mới bỏ công sức."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 14): <b>cập nhật phần sụn an toàn</b> và khởi động tin cậy.</p>
        forward_ref: true
        say: "Ở bài sau, bài 14, ta học cập nhật phần sụn an toàn và khởi động tin cậy. Hẹn gặp bạn ở bài tiếp theo."
