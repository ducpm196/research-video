id: L01
course: ESY
series: "ESY · Hệ thống nhúng và thời gian thực"
title: "Bài 1 — Thanh ghi ngoại vi và thao tác bit trên chân vào/ra"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/esy.yaml L01; audit/esy/verify_esy.py L01; E. A. Lee, S. A. Seshia, Introduction to Embedded Systems (2017), chương 10"
assumes: [arith]
# Quy ước: thanh ghi 8 bit, bit 0 ở bên phải; giá trị nhị phân viết trong <code> có tiền tố 0b như mã C. Mã C trong
#   <div class="code">; lời đọc mô tả phép toán bằng tiếng Việt (“phép hoặc từng bit”, “dịch trái”…), không đọc ký hiệu C.
#   Mọi giá trị do Python tính trong checks (cùng toán tử với C cho số không âm, che 8 bit bằng & 0xFF).
objectives:
  - "Hiểu thanh ghi ngoại vi: mỗi bit điều khiển một chân"
  - "Bật, tắt, đảo, đọc một bit mà không đụng bit khác"
  - "Tránh lỗi ghi đè cả thanh ghi"
asr_reviewed:
  - {sentence: "Lỗi thứ ba, đếm bit từ trái sang.", reason: "ASR chép “Lội thứ Ba, đếm biết từ trái sang”: lỗi/lội nhầm thanh (cùng mẫu “Lỗi thứ …” ở các bài khác chép đúng), bit → “biết” như probe p1 CSA (không phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bật một đèn, tắt mất ba đèn"
    steps:
      - show: |
          <p>Ba đèn ở chân 0, 4, 7 đang sáng. Bạn muốn bật thêm đèn ở chân 5, nên ghi số 32 vào thanh ghi cổng ra.</p>
          <p>Đèn 5 sáng — nhưng ba đèn kia <b>tắt hết</b>.</p>
          <div class="box key">Hôm nay: <b>thanh ghi ngoại vi</b> và cách thao tác <b>đúng một bit</b> mà không đụng các bit còn lại.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ba đèn ở chân 0, 4 và 7 đang sáng. Bạn muốn bật thêm đèn ở chân 5, nên ghi số 32 vào thanh ghi cổng ra. Đèn 5 sáng thật, nhưng ba đèn kia tắt hết. Hôm nay ta học thanh ghi ngoại vi, và cách thao tác đúng một bit mà không đụng tới các bit còn lại."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: giá trị từng vị trí bit, ba phép logic, phép dịch"
    checks:
      - "[2 ** k for k in range(7, -1, -1)] == [128, 64, 32, 16, 8, 4, 2, 1] and 128 + 16 + 1 == 145 == 0b10010001"
      - "all((x | 0, x | 1, x & 1, x & 0, x ^ 0, x ^ 1) == (x, 1, x, 0, x, 1 - x) for x in (0, 1))"
      - "1 << 3 == 8 == 2 ** 3 and 1 << 5 == 32 == 2 ** 5"
    steps:
      - show: |
          <table class="t"><tr><th>bit</th><td>7</td><td>6</td><td>5</td><td>4</td><td>3</td><td>2</td><td>1</td><td>0</td></tr>
          <tr><th>giá trị</th><td>$2^7 = 128$</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr>
          <tr><th><code>10010001</code></th><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td></tr></table>
          <p>$128 + 16 + 1 = 145$.</p>
        introduces: [power]
        focus: [1, "1.2", "1.3", 2]
        say: "Trước hết, ôn lại số nhị phân đã học ở khoá Hệ thống máy tính. Bit thứ k có giá trị 2 mũ k, nên tám bit từ trái sang có giá trị 128, 64, 32, 16, 8, 4, 2 và 1. Với dãy bit một, không, không, một, không, không, không, một, các bit bằng 1 nằm ở vị trí 7, 4 và 0. Cộng giá trị của chúng, 128 cộng 16 cộng 1, ta được 145."
      - show: |
          <table class="t"><tr><th>phép trên một bit $x$</th><th>với 0</th><th>với 1</th></tr>
          <tr><td>hoặc</td><td>$x$ (giữ nguyên)</td><td>1 (bật)</td></tr>
          <tr><td>và</td><td>0 (tắt)</td><td>$x$ (giữ nguyên)</td></tr>
          <tr><td>hoặc loại trừ</td><td>$x$ (giữ nguyên)</td><td>đảo $x$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Tiếp theo là ba phép logic trên một bit x, xét khi gặp số 0 và khi gặp số 1. Phép hoặc với 0 giữ nguyên x, còn hoặc với 1 thì luôn ra 1, tức là bật. Phép và với 0 luôn ra 0, tức là tắt, còn và với 1 thì giữ nguyên x. Phép hoặc loại trừ với 0 giữ nguyên, còn với 1 thì đảo x, một thành không và không thành một."
      - show: |
          <p><b>Dịch trái</b> $k$ vị trí = nhân 2 đúng $k$ lần: dịch số 1 sang trái 3 vị trí được <code>00001000</code> $= 2^3 = 8$; dịch 5 vị trí được <code>00100000</code> $= 2^5 = 32$.</p>
        say: "Cuối cùng là phép dịch trái, dịch k vị trí nghĩa là nhân với 2 đúng k lần. Dịch số 1 sang trái 3 vị trí, ta được 2 mũ 3, bằng 8. Dịch số 1 sang trái 5 vị trí, ta được 2 mũ 5, bằng 32, chỉ có bit 5 bằng 1."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: thanh ghi, mặt nạ bit"
    checks:
      - "1 << 5 == 32 == 0b00100000 and (~(1 << 5)) & 0xFF == 0b11011111"
      - "0b10010001 == 145 and [i for i in range(8) if (145 >> i) & 1] == [0, 4, 7]"
    steps:
      - show: |
          <p><b>Thanh ghi ngoại vi</b>: một ô nhớ ở địa chỉ cố định mà ghi vào thì phần cứng làm theo. Thanh ghi cổng ra 8 bit: bit $k$ = mức điện ở chân $k$.</p>
          <p>Ba đèn 0, 4, 7 sáng: <code>0b10010001</code> = 145 (bit 0 ở bên phải).</p>
          <p><b>Mặt nạ</b> cho bit 5: <code>1 &lt;&lt; 5</code> = <code>0b00100000</code> (dịch số 1 sang trái 5 vị trí). Phần bù của nó: <code>~(1 &lt;&lt; 5)</code> = <code>0b11011111</code>.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Thanh ghi ngoại vi là một ô nhớ ở địa chỉ cố định, mà ghi giá trị vào thì phần cứng làm theo. Thanh ghi cổng ra 8 bit có bit k ứng với mức điện ở chân k. Ba đèn 0, 4, 7 đang sáng ứng với số nhị phân này, tức 145, bit 0 nằm ở bên phải. Mặt nạ cho bit 5 có được bằng cách dịch số 1 sang trái 5 vị trí, chỉ bit 5 bằng 1. Lật mọi bit của mặt nạ, ta được phần bù, chỉ bit 5 bằng 0."

  - id: intuition
    kind: intuition
    title: "Mỗi bit là một chân, mặt nạ chỉ chạm một cột"
    checks:
      - "145 | 32 == 177 and [k for k in range(8) if (177 >> k) & 1] == [0, 4, 5, 7] and [k for k in range(8) if (32 >> k) & 1] == [5]"
    steps:
      - show: |
          <div><svg width="1500" height="350" viewBox="0 0 1500 350"><g fill="#1f2937"><rect x="615" y="88" width="110" height="222" fill="#fed7aa"/><circle cx="1270" cy="45" r="22" fill="#fde047" stroke="#1f2937" stroke-width="2"/><text x="1270" y="110" text-anchor="middle" font-size="20">bit 0</text><circle cx="1150" cy="45" r="22" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="1150" y="110" text-anchor="middle" font-size="20">bit 1</text><circle cx="1030" cy="45" r="22" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="1030" y="110" text-anchor="middle" font-size="20">bit 2</text><circle cx="910" cy="45" r="22" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="910" y="110" text-anchor="middle" font-size="20">bit 3</text><circle cx="790" cy="45" r="22" fill="#fde047" stroke="#1f2937" stroke-width="2"/><text x="790" y="110" text-anchor="middle" font-size="20">bit 4</text><circle cx="670" cy="45" r="22" fill="#fde047" stroke="#1f2937" stroke-width="2"/><text x="670" y="110" text-anchor="middle" font-size="20">bit 5</text><circle cx="550" cy="45" r="22" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="550" y="110" text-anchor="middle" font-size="20">bit 6</text><circle cx="430" cy="45" r="22" fill="#fde047" stroke="#1f2937" stroke-width="2"/><text x="430" y="110" text-anchor="middle" font-size="20">bit 7</text><text x="30" y="154" font-size="22">thanh ghi cũ</text><rect x="1230" y="120" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1270" y="156" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">1</text><rect x="1110" y="120" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1150" y="156" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="990" y="120" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1030" y="156" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="870" y="120" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="910" y="156" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="750" y="120" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="790" y="156" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">1</text><rect x="630" y="120" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="670" y="156" text-anchor="middle" font-size="28" font-weight="bold" fill="#eb6834">0</text><rect x="510" y="120" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="550" y="156" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="390" y="120" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="430" y="156" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">1</text><text x="1340" y="154" font-size="24">= 145</text><text x="30" y="219" font-size="22">mặt nạ bit 5</text><rect x="1230" y="185" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1270" y="221" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="1110" y="185" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1150" y="221" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="990" y="185" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1030" y="221" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="870" y="185" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="910" y="221" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="750" y="185" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="790" y="221" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="630" y="185" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="670" y="221" text-anchor="middle" font-size="28" font-weight="bold" fill="#eb6834">1</text><rect x="510" y="185" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="550" y="221" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="390" y="185" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="430" y="221" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><text x="1340" y="219" font-size="24">= 32</text><text x="30" y="284" font-size="22">hoặc từng bit</text><rect x="1230" y="250" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1270" y="286" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">1</text><rect x="1110" y="250" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1150" y="286" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="990" y="250" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="1030" y="286" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="870" y="250" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="910" y="286" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="750" y="250" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="790" y="286" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">1</text><rect x="630" y="250" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="670" y="286" text-anchor="middle" font-size="28" font-weight="bold" fill="#eb6834">1</text><rect x="510" y="250" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="550" y="286" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">0</text><rect x="390" y="250" width="80" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="430" y="286" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">1</text><text x="1340" y="284" font-size="24">= 177</text><text x="30" y="53" font-size="22">đèn</text><text x="30" y="340" font-size="22">cột 5 (nền cam): 0 hoặc 1 = 1, bật đèn 5. Bảy cột còn lại: x hoặc 0 = x, giữ nguyên đèn 0, 4, 7.</text></g></svg></div>
        say: "Hình đặt ba hàng bit thẳng cột với nhau, mỗi cột là một chân, và hàng tròn trên cùng là các đèn nối với chân đó. Hàng đầu là thanh ghi cũ, giá trị 145, hàng giữa là mặt nạ bit 5, giá trị 32. Phép hoặc làm việc riêng từng cột, cột 5 nền cam có 0 hoặc 1 ra 1, nên đèn 5 sáng lên. Bảy cột còn lại gặp số 0 của mặt nạ nên giữ nguyên, vì thế đèn 0, 4 và 7 vẫn sáng như cũ."

  # ───────────────────────── 3. BỐN THAO TÁC ─────────────────────────
  - id: ops
    kind: formula
    title: "Bốn thao tác trên một bit"
    checks:
      - "(145 | (1 << 5)) == 177 and ((177 & ~(1 << 5)) & 0xFF) == 145 and (145 ^ (1 << 3)) == 153"
      - "((145 >> 4) & 1, (145 >> 3) & 1) == (1, 0)"
    steps:
      - show: |
          <div class="code"><div>reg |= (1 &lt;&lt; 5);        <span class="cm">// bật bit 5  : 10010001 → 10110001</span></div><div>reg &amp;= ~(1 &lt;&lt; 5);       <span class="cm">// tắt bit 5  : 10110001 → 10010001</span></div><div>reg ^= (1 &lt;&lt; 3);        <span class="cm">// đảo bit 3  : 10010001 → 10011001</span></div><div>bit = (reg &gt;&gt; 4) &amp; 1;   <span class="cm">// đọc bit 4  : 10010001 → 1</span></div></div>
          <div class="box key">Vì sao không đụng bit khác? Hoặc với 0 giữ nguyên, và với 1 giữ nguyên, hoặc loại trừ với 0 giữ nguyên. Mặt nạ chỉ có 1 (hay 0) đúng ở bit cần đổi.</div>
        focus: [1, "1.1", "1.2", "1.3", "1.4", 2, 2]
        say: "Có bốn thao tác. Bật bit 5, lấy thanh ghi hoặc từng bit với mặt nạ, 145 thành 177. Tắt bit 5, lấy thanh ghi và từng bit với phần bù của mặt nạ, trở về 145. Đảo bit 3, lấy hoặc loại trừ với mặt nạ bit 3, được 153. Đọc bit 4, dịch phải 4 vị trí rồi và với 1, được 1. Vì sao các bit khác không bị đụng tới? Vì hoặc với 0, và với 1, hay hoặc loại trừ với 0 đều giữ nguyên bit cũ, mà mặt nạ chỉ khác ở đúng bit cần đổi."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Sửa lỗi mở đầu"
    checks:
      - "32 == 0b00100000 and [i for i in range(8) if (32 >> i) & 1] == [5]"
      - "(145 | (1 << 5)) == 177 and [i for i in range(8) if (177 >> i) & 1] == [0, 4, 5, 7]"
    steps:
      - show: |
          <p><b>Bước 1 — trạng thái đầu:</b> đèn 0, 4, 7 sáng ↔ thanh ghi <code>10010001</code> = 145.</p>
          <p><b>Bước 2 — ghi thẳng</b> <code>reg = 32;</code> → thanh ghi thành <code>00100000</code>: chỉ bit 5 bằng 1 → chỉ đèn 5 sáng, <b>mất 3 đèn</b> 0, 4, 7.</p>
        focus: [1, 2, 2]
        say: "Quay lại lỗi mở đầu và làm từng bước. Bước một, ba đèn 0, 4 và 7 đang sáng, nên thanh ghi đang là 145. Bước hai, nếu ghi thẳng số 32 thì thanh ghi nhận đúng giá trị 32, chỉ có bit 5 bằng 1, nên chỉ đèn 5 sáng và ba đèn 0, 4, 7 tắt mất."
      - show: |
          <table class="t"><tr><th>bit</th><td>7</td><td>6</td><td>5</td><td>4</td><td>3</td><td>2</td><td>1</td><td>0</td></tr>
          <tr><th>145</th><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td></tr>
          <tr><th>mặt nạ 32</th><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
          <tr><th>hoặc</th><td>1</td><td>0</td><td>$\hl{1}$</td><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước ba, dùng phép hoặc với mặt nạ bit 5 và làm từng cột một. Hàng trên là 145, hàng giữa là mặt nạ 32. Ở cột 5, không hoặc một ra một, nên bit 5 được bật. Ở mọi cột khác, mặt nạ bằng 0 nên bit cũ giữ nguyên, kết quả là dãy một, không, một, một, không, không, không, một."
      - show: |
          <p><b>Bước 4 — đọc kết quả:</b> <code>10110001</code> $= 128 + 32 + 16 + 1 = \hl{177}$ → đèn 0, 4, 5, 7 cùng sáng — đúng ý.</p>
          <p class="note">Ghi thẳng một giá trị là ghi <b>cả 8 bit</b>. Phép hoặc chỉ đổi bit có 1 trong mặt nạ.</p>
        focus: [1, 1, 2]
        say: "Bước bốn, đọc kết quả, cộng giá trị các bit bằng 1 là 128, 32, 16 và 1, được 177. Bốn đèn 0, 4, 5, 7 cùng sáng, đúng ý muốn. Ghi thẳng một giá trị là ghi cả 8 bit, còn phép hoặc chỉ đổi những bit có 1 trong mặt nạ."

  - id: check
    kind: check
    title: "Tự kiểm: cộng thẳng và tắt ngược lại"
    checks:
      - "(145 >> 5) & 1 == 0 and 145 + 32 == 177 == (145 | 32)"
      - "(177 & ~32) & 0xFF == 145 == 177 - 32"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>tính</th><th>so với bước trên</th></tr>
          <tr><td>bit 5 của 145 đang là 0, nên bật nó = cộng thêm $2^5$</td><td>$145 + 32 = 177$</td><td>khớp ✓</td></tr>
          <tr><td>tắt bit 5 của 177 bằng và với phần bù</td><td><code>10010001</code> $= 177 - 32 = 145$</td><td>về đúng trạng thái đầu ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, không làm lại từng cột. Vì bit 5 của 145 đang bằng 0, bật nó lên chính là cộng thêm 2 mũ 5, tức 145 cộng 32, bằng 177, khớp kết quả. Đi ngược lại, tắt bit 5 của 177 bằng phép và với phần bù, ta trừ đi 32, về đúng 145, đúng trạng thái ban đầu."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(145 & (1 << 5)) == 0 and (177 & (1 << 5)) == 32"
      - "(177 & 0b11011111) == 145 and [k for k in range(8) if (145 >> k) & 1] == [0, 4, 7]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Gán thẳng giá trị vào thanh ghi <b class="red">(sai)</b>
          <br><span class="note">Xoá mọi bit khác đang được dùng — có khi là bit cấu hình của một ngoại vi khác.</span></div>
        say: "Lỗi thứ nhất, gán thẳng một giá trị vào thanh ghi. Việc đó xoá mọi bit khác đang được dùng, có khi là bit cấu hình của một ngoại vi hoàn toàn khác."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tắt bit bằng <code>&amp;= (1 &lt;&lt; 5)</code> <b class="red">(sai)</b>
          <br><span class="note">Quên dấu phần bù: kết quả xoá mọi bit <b>trừ</b> bit 5. Phải là <code>&amp;= ~(1 &lt;&lt; 5)</code>.</span></div>
          <table class="t"><tr><th>thanh ghi 177 và với</th><th>kết quả</th><th>đèn sáng</th></tr>
          <tr><td><code>00100000</code> (sai)</td><td>32</td><td>chỉ 5</td></tr>
          <tr><td><code>11011111</code> (đúng)</td><td>145</td><td>0, 4, 7</td></tr></table>
        focus: [1, 2]
        say: "Lỗi thứ hai, tắt bit bằng phép và với chính mặt nạ, quên lấy phần bù. Kết quả là xoá mọi bit trừ bit 5, đúng ngược ý muốn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đếm bit từ trái sang <b class="red">(sai)</b>
          <br><span class="note">Bit 0 là bit <b>phải</b> nhất (giá trị 1). Đọc sơ đồ thanh ghi của nhà sản xuất chip để biết bit nào làm gì.</span></div>
        say: "Lỗi thứ ba, đếm bit từ trái sang. Bit 0 là bit bên phải nhất, có giá trị 1. Hãy đọc sơ đồ thanh ghi của nhà sản xuất chip để biết chính xác bit nào làm gì."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quên rằng “đọc–sửa–ghi” không nguyên tử <b class="red">(thiếu)</b>
          <br><span class="note"><code>reg |= …</code> là đọc, sửa, ghi ba bước. Một ngắt chen giữa và cũng sửa thanh ghi đó thì thay đổi của ngắt bị ghi đè.</span></div>
        say: "Lỗi thứ tư, quên rằng đọc, sửa rồi ghi không phải một bước duy nhất. Nếu một ngắt chen vào giữa và cũng sửa thanh ghi đó, thay đổi của ngắt sẽ bị ghi đè."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(0b01010101 | (1 << 1)) == 0b01010111 == 87 and ((0b01010101 & ~(1 << 6)) & 0xFF) == 0b00010101 == 21"
      - "(0b01010101 >> 4) & 1 == 1 and (0b01010101 >> 3) & 1 == 0"
      - "0b01010101 == 85 == 64 + 16 + 4 + 1 and 64 + 16 + 4 + 2 + 1 == 87 and 16 + 4 + 1 == 21 and 85 - 64 == 21 and 85 + 2 == 87"
      - "1 << 1 == 0b00000010 and (~(1 << 6)) & 0xFF == 0b10111111"
    steps:
      - show: |
          <p>Thanh ghi đang là <code>0b01010101</code>.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bật bit 1: kết quả?</td></tr>
          <tr><td>2</td><td>Tắt bit 6 (trên giá trị ban đầu): kết quả?</td></tr>
          <tr><td>3</td><td>Bit 4 và bit 3 đang là mấy?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm, với thanh ghi đang là 0, 1, 0, 1, 0, 1, 0, 1, đọc từ bit 7 xuống bit 0. Câu một, bật bit 1 thì được gì? Câu hai, tắt bit 6 trên giá trị ban đầu thì được gì? Câu ba, bit 4 và bit 3 đang là mấy? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>giá trị đầu</th><th>mặt nạ</th><th>kết quả</th></tr>
          <tr><td>① hoặc</td><td><code>01010101</code> = 85</td><td><code>00000010</code></td><td><code>01010111</code> $= 64 + 16 + 4 + 2 + 1 = \hl{87}$</td></tr>
          <tr><td>② và</td><td><code>01010101</code> = 85</td><td><code>10111111</code></td><td><code>00010101</code> $= 16 + 4 + 1 = \hl{21}$</td></tr></table>
        focus: [1, 1, "1.2", "1.3"]
        say: "Đáp án, trước hết đổi giá trị đầu, 64 cộng 16 cộng 4 cộng 1, bằng 85. Ta làm từng cột như ở ví dụ. Câu một, hoặc với mặt nạ bit 1 chỉ bật bit 1 đang tắt, được dãy kết thúc bằng một, một, một, bằng 87, tức là 85 cộng 2. Câu hai, và với phần bù của mặt nạ bit 6 chỉ tắt bit 6 đang bật, còn 16 cộng 4 cộng 1, bằng 21, tức là 85 trừ 64."
      - show: |
          <p>③ Đếm từ <b>phải</b> sang: bit 0 = 1, bit 1 = 0, bit 2 = 1, bit 3 = $\hl{0}$, bit 4 = $\hl{1}$.</p>
        say: "Câu ba, đếm từ bên phải sang, bit 0 bằng 1, bit 1 bằng 0, bit 2 bằng 1, bit 3 bằng 0, và bit 4 bằng 1. Vậy bit 4 bằng 1 còn bit 3 bằng 0, đếm từ trái sang sẽ ra kết quả ngược lại."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mỗi bit = một chân</span><span class="a">→</span>
          <span class="n">mặt nạ: 1 dịch trái k</span><span class="a">→</span>
          <span class="n">bật: hoặc; tắt: và với phần bù; đảo: hoặc loại trừ</span><span class="a">→</span>
          <span class="n">không gán thẳng</span></div>
        say: "Tổng kết lại, mỗi bit của thanh ghi điều khiển một chân. Mặt nạ là số 1 dịch trái k vị trí. Bật bằng phép hoặc, tắt bằng phép và với phần bù, đảo bằng hoặc loại trừ, và đừng bao giờ gán thẳng cả thanh ghi khi chỉ muốn đổi một bit."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi nhiều phần của chương trình dùng chung một tài nguyên, mỗi phần chỉ được chạm vào đúng phần của mình.</div>
        say: "Điều cần mang theo, khi nhiều phần của chương trình dùng chung một tài nguyên, mỗi phần chỉ được chạm vào đúng phần của mình."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>ngắt</b>, vòng thăm dò và chống dội phím.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học ngắt, vòng thăm dò và cách chống dội phím. Hẹn gặp bạn ở bài tiếp theo."
