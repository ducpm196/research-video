id: L04
course: ESY
series: "ESY · Hệ thống nhúng và thời gian thực"
title: "Bài 4 — Chuyển đổi tương tự–số: độ phân giải và lượng tử hoá"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/esy.yaml L04; audit/esy/verify_esy.py L04; W. R. Bennett (1948); W. Kester, ed., The Data Conversion Handbook (Analog Devices, 2005), mục 2.3 (SNR = 6,02n + 1,76 dB cho sóng sin toàn thang)"
assumes: [arith, cdot, frac, approx, power, ltgt]
# Quy ước: ADC n bit, điện áp tham chiếu V_ref; mã ra = ⌊V · 2^n / V_ref⌋ (quy ước chia 2^n, như ATmega328P; có chip chia 2^n − 1 —
#   lỗi 3); mỗi bậc (LSB) = V_ref / 2^n. SNR lượng tử lý tưởng 6,02n + 1,76 dB nêu như kết quả kinh điển (không chứng minh),
#   chỉ giải thích vì sao mỗi bit thêm khoảng 6 dB (20·log10 2 ≈ 6,02). Mọi số do alg.adc_volts / math trong checks.
objectives:
  - "Đổi mã ADC ra điện áp và ngược lại"
  - "Tính bước lượng tử và tỉ số tín hiệu trên nhiễu lượng tử lý tưởng"
  - "Biết thêm bit không thêm độ chính xác khi nhiễu tương tự lớn"
asr_reviewed:
  - {sentence: "Với một sóng sin dùng hết thang đo, tỉ số tín hiệu trên nhiễu lượng tử xấp xỉ 6 phẩy 02 nhân n, cộng 1 phẩy 76, tính bằng đề-xi-ben.", reason: "ASR chép “Với một sóng sinh dùng hết thang đo, tỷ số tín hiệu trên nhiễu lượng từ sắp xị 6,02n n cộng 1,76 tính bằng deciBand.” (0.758): sin đọc thô, ASR viết “sinh” (gần âm); “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: tử xấp xỉ/từ sắp xị, nhân/n, đề xi ben/deciband — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đề-xi-ben là thang lô-ga-rít, thêm khoảng 6 nghĩa là tỉ số biên độ gấp đôi.", reason: "ASR chép “Deciben là thang logatic … tỷ số biên độ gấp đôi”: đề-xi-ben → “Deciben” đúng từ, lô-ga-rít → “logatic” cùng bốn âm lệch âm cuối, tỉ/tỷ chỉ khác chính tả — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, mỗi bậc bao nhiêu mi li vôn?", reason: "ASR chép “Câu 1. Mỗi bậc bao nhiêu mili vốn?”: “mi li vôn” → “mili vốn” lệch thanh; câu khác có cùng đơn vị (khung 19) chép “mV” — đúng đơn vị"}
  - {sentence: "Với 10 bit, mỗi bậc 3 phẩy 22 mi li vôn, nhiễu bằng khoảng 3 bậc.", reason: "ASR chép “mỗi bật 3,22 mV, nhiễu bằng khoảng 3 bật”: “mi li vôn” → mV đúng đơn vị; bậc/bật lệch âm cuối c/t (ASR đã biết, như “héc/hét”); số 3,22 khớp"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cảm biến cho điện áp, chương trình cần con số"
    steps:
      - show: |
          <p>Cảm biến nhiệt cho ra một điện áp thay đổi liên tục, như 0,73 V. Bộ xử lý không đọc thẳng được điện áp, nó chỉ làm việc với con số.</p>
          <div class="box key">Hôm nay: <b>bộ chuyển đổi tương tự–số</b> (ADC) — biến điện áp thành con số, và cái giá: <b>lượng tử hoá</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một cảm biến nhiệt cho ra điện áp thay đổi liên tục, chẳng hạn 0 phẩy 73 vôn. Nhưng bộ xử lý không đọc thẳng được điện áp, nó chỉ làm việc với con số. Hôm nay ta học bộ chuyển đổi tương tự số, biến điện áp thành con số, và cái giá phải trả là lượng tử hoá."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa của 2, vôn và mi li vôn, làm tròn xuống"
    checks:
      - "2 ** 3 == 8 and 2 ** 10 == 1024 and 2 ** 12 == 4096 and 4096 // 1024 == 4"
      - "[format(k, '03b') for k in range(8)] == ['000', '001', '010', '011', '100', '101', '110', '111']"
      - "round(3.3 / 1024, 5) == 0.00322 and round(3.3 / 1024 * 1000, 2) == 3.22"
      - "math.floor(3.7) == 3 and math.floor(2.42) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>số bit $n$</th><th>số mức $2^n$</th></tr>
          <tr><td>3</td><td>$2^3 = 8$</td></tr>
          <tr><td>10</td><td>$2^{10} = 1024$</td></tr>
          <tr><td>12</td><td>$2^{12} = 4096$ — gấp 4 lần 10 bit</td></tr></table>
          <p class="note">Một bit là một chữ số chỉ nhận 0 hoặc 1; thêm một bit thì số cách ghép nhân đôi. 3 bit: 000, 001, 010, 011, 100, 101, 110, 111 — đúng 8 dãy.</p>
        focus: [1, 2, "1.2", "1.3", "1.4"]
        say: "Trước hết, ta cần biết n bit ghi được bao nhiêu giá trị khác nhau. Mỗi bit là một chữ số chỉ nhận 0 hoặc 1, nên thêm một bit thì số cách ghép nhân đôi, và n bit ghi được 2 mũ n giá trị. Ba bit cho 2 mũ 3 bằng 8 giá trị, đúng bằng tám dãy liệt kê ở dòng ghi chú. Mười bit cho 2 mũ 10 bằng 1024 giá trị. Mười hai bit cho 4096 giá trị, gấp 4 lần mười bit, vì thêm 2 bit là nhân đôi hai lần."
      - show: |
          <p><b>Vôn và mi li vôn:</b> 1 V = 1000 mV. Ví dụ $\frac{3{,}3}{1024} \approx 0{,}00322$ V $= 3{,}22$ mV.</p>
          <p><b>Làm tròn xuống:</b> bỏ phần lẻ, giữ phần nguyên: 3,7 thành 3; 2,42 thành 2.</p>
        focus: [1, 2]
        say: "Tiếp theo, một vôn bằng 1000 mi li vôn, nên một số rất nhỏ như 3 phẩy 3 chia 1024, khoảng 0 phẩy 00322 vôn, viết gọn là 3 phẩy 22 mi li vôn. Cuối cùng là làm tròn xuống, tức bỏ phần lẻ và chỉ giữ phần nguyên, nên 3 phẩy 7 thành 3, và 2 phẩy 42 thành 2."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
