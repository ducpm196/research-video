- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">ngắt: phản ứng nhanh, tốn ít</span><span class="a">→</span>

      <span class="n">hàm ngắt ngắn, biến volatile</span><span class="a">→</span>

      <span class="n">đọc nhiều byte: tắt ngắt</span><span class="a">→</span>

      <span class="n">chống dội: n mẫu liên tiếp</span></div>

      <p class="note"><b>So sánh hai quy mô:</b> Chống dội 1 phím đếm 5 mẫu; hệ nhiều ngắt buộc giữ hàm ngắt siêu ngắn và đọc nhiều byte khi tắt ngắt.</p>

      '
    say: Tổng kết lại, ngắt phản ứng nhanh và tốn ít công sức. Hàm xử lý ngắt phải ngắn, biến dùng chung phải khai báo đặc biệt, đọc biến nhiều byte thì tắt ngắt, và chống dội bằng cách đợi đủ n mẫu liên tiếp. vài xung dội giải bằng đếm mẫu, nhưng hệ nhiều ngắt phải giữ hàm ngắt ngắn và tắt ngắt khi đọc nhiều byte.
    focus:
    - 1
    - 1
    - 2
  - show: '<div class="box key"><b>Tư duy:</b> tín hiệu từ thế giới thật luôn bẩn và đến bất ngờ. Lọc trước khi tin, và nghĩ xem điều gì xảy ra nếu bị cắt ngang giữa chừng.</div>

      '
    say: Điều cần mang theo, tín hiệu từ thế giới thật luôn bẩn và đến bất ngờ. Hãy lọc trước khi tin, và luôn nghĩ xem điều gì xảy ra nếu bị cắt ngang giữa chừng. Luôn bảo vệ dữ liệu nhiều bai dùng chung bằng cách khoá ngắt ngắn hạn lúc đọc để loại bỏ lỗi rách giá trị.
  - clear: true
    show: '<p class="note">Bài sau (bài 3): <b>bộ định thời</b> và điều chế độ rộng xung.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 3, ta học bộ định thời và điều chế độ rộng xung, cách tạo nhịp và điều khiển độ sáng, tốc độ động cơ. Hẹn gặp bạn ở bài tiếp theo.
