  - show: <table class='t'><tr><th>Gợi ý triển khai ESY:L02</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td>Input</td><td><code>k|samples</code></td></tr><tr><td>Output</td><td><code>accepted_at_ms= raw_edges= clean_edges=</code></td></tr></table>
    say: Gợi ý cài đặt bài số 2 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 1 dòng khớp định dạng.
    clear: true
