scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tự khởi động lại trên một hành tinh khác"
    checks:
      - "1 / 8 == 0.125"
      - "33 - 18 == 15"
    steps:
      - show: |
          <p>Năm <b>1997</b>, tàu Pathfinder trên sao Hoả tự khởi động lại máy tính: một tác vụ không xong việc trong chu kỳ <b>0,125 giây</b>.</p>
          <p>Năm <b>2004</b>, xe tự hành Spirit đặt lại liên tục: từ ngày sao Hoả thứ <b>18</b> tới thứ <b>33</b> mới làm khoa học bình thường lại.</p>
          <p>Năm <b>2014</b>, xe Opportunity, thiết kế cho <b>3 tháng</b>, đã chạy hơn <b>10 năm</b> và bộ nhớ flash bắt đầu mòn.</p>
          <div class="box key">Hôm nay: năm chặng — mỗi quy mô nhiệm vụ làm lộ ra điểm nghẽn nào của phần mềm nhúng, và đội kỹ sư đã sửa ra sao từ rất xa Trái Đất.</div>
        focus: [1, 2, 2, 3, 4]
        say: "Chào bạn, năm 1997, tàu Pathfinder trên sao Hoả tự khởi động lại máy tính, vì một tác vụ không xong việc trong chu kỳ 0 phẩy 125 giây. Năm 2004, xe tự hành Spirit đặt lại liên tục. Từ ngày sao Hoả thứ 18 tới ngày thứ 33, xe mới làm khoa học bình thường lại. Năm 2014, xe Opportunity, thiết kế cho 3 tháng, đã chạy hơn 10 năm và bộ nhớ flash bắt đầu mòn. Hôm nay ta đi qua năm chặng, xem mỗi quy mô nhiệm vụ làm lộ ra điểm nghẽn nào, và đội kỹ sư đã sửa ra sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "1 + 4 + 3 == 8 and 1 + 2 + 1 == 4"
      - "100 - 60 == 40"
      - "2 * 400 + 32 == 832 and 832 <= 1024"
      - "1000 / 8 == 125"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 10</td><td><b>đảo ngược ưu tiên</b>: tác vụ cao chờ khoá của tác vụ thấp, tác vụ trung bình chen vào; sửa bằng <b>kế thừa ưu tiên</b></td><td>không kế thừa: tác vụ cao xong ở mốc 8; có kế thừa: xong ở mốc 4</td></tr>
          <tr><td>bài 12</td><td><b>bộ giám sát</b>: không được cho ăn trước hạn thì chip tự khởi động lại; tránh cấp phát động khi đang chạy</td><td>hạn 100 ms, vòng chính 60 ms → dư 40 ms</td></tr>
          <tr><td>bài 14</td><td>luôn còn <b>một đường lui</b>: hai phân vùng, hỏng thì quay về bản cũ</td><td>2 × 400 + 32 = 832 KB, vừa bộ nhớ 1024 KB</td></tr>
          <tr><td>bài 3</td><td>chu kỳ = 1 chia tần số</td><td>8 lần mỗi giây → mỗi chu kỳ 125 ms</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 10, tác vụ cao chờ khoá của tác vụ thấp, tác vụ trung bình chen vào, nên tác vụ cao xong ở mốc 8, có kế thừa ưu tiên thì xong ở mốc 4. Ở bài 12, bộ giám sát không được cho ăn trước hạn 100 mi li giây thì chip tự khởi động lại. Ở bài 14, ta luôn giữ một đường lui, hai phân vùng 400 cộng bộ nạp 32 là 832 ki-lô-byte. Ở bài 3, chu kỳ bằng 1 chia tần số, 8 lần mỗi giây thì mỗi chu kỳ 125 mi li giây."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>phần mềm bay</b></td><td>chương trình chạy trên máy tính của tàu, sửa được từ Trái Đất</td></tr>
          <tr><td><b>ngày sao Hoả</b> (sol)</td><td>một ngày trên sao Hoả, dài 24 giờ 37 phút</td></tr>
          <tr><td><b>bộ nhớ tạm</b> (RAM)</td><td>nhanh, mất hết dữ liệu khi tắt điện</td></tr>
          <tr><td><b>bộ nhớ flash</b></td><td>giữ dữ liệu khi tắt điện; ô nhớ mòn dần sau nhiều lần ghi</td></tr>
          <tr><td><b>phần mềm thương mại có sẵn</b> (COTS)</td><td>mua về dùng, đội bay không tự viết</td></tr>
          <tr><td><b>chế độ hạn chế</b> (crippled mode)</td><td>chạy thiếu một phần (ví dụ không dùng flash) để còn liên lạc được</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài dùng sáu thuật ngữ. Phần mềm bay là chương trình chạy trên máy tính của tàu, và sửa được từ Trái Đất. Một ngày sao Hoả dài 24 giờ 37 phút. Bộ nhớ tạm chạy nhanh nhưng mất hết dữ liệu khi tắt điện. Bộ nhớ flash giữ dữ liệu khi tắt điện, nhưng ô nhớ mòn dần sau nhiều lần ghi. Phần mềm thương mại có sẵn là phần mua về dùng. Chế độ hạn chế là chạy thiếu một phần để máy vẫn còn liên lạc được."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: timeline
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">1997</text><text x="160" y="200">một tàu, một CPU</text><text x="160" y="232">đảo ngược ưu tiên</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">1/2004</text><text x="500" y="200">hai xe, làm trong 3 năm</text><text x="500" y="232">bộ nhớ cạn, đặt lại lặp</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">4/2004</text><text x="850" y="200">bản phần mềm mới</text><text x="850" y="232">giám sát ngưỡng, nén thư mục</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2014 → 2015</text><text x="1200" y="200">3 tháng thành hơn 10 năm</text><text x="1200" y="232">flash mòn, tránh vùng hỏng</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2017 → nay</text><text x="1540" y="200">nhiều nhiệm vụ nhỏ</text><text x="1540" y="232">một khung dùng lại</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → nhân đôi, gấp rút → ổn định → kéo dài vượt thiết kế → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 1997, một tàu với một bộ xử lý gặp lỗi đảo ngược ưu tiên. Năm 2004, hai xe tự hành cạn bộ nhớ và đặt lại liên tục, rồi tháng 4 có bản phần mềm mới. Từ 2014, nhiệm vụ 3 tháng đã thành hơn 10 năm và flash mòn. Từ 2017 tới nay, nhiều nhiệm vụ nhỏ dùng lại một khung phần mềm chung."

