  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "(600 - 100) / 20 == 25"
      - "(600 - 100) / 20 < 90 and 90 * 20 == 1800"
      - "round(1 - 800 / 1024, 2) == 0.22"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống: trạm đo thời tiết trên núi, vi điều khiển có hệ điều hành thời gian thực, đặt dự kiến 3 tháng nhưng có thể ở lại 3 năm (số minh hoạ)</th></tr>
          <tr><td>1</td><td>thư viện ghi thẻ nhớ mua về làm bộ nhớ trống giảm 20 KB mỗi ngày, hiện còn 600 KB. Khởi động lại mỗi đêm, giới hạn cỡ cố định cho thư viện, hay giám sát ngưỡng 100 KB?</td></tr>
          <tr><td>2</td><td>bật kế thừa ưu tiên bằng cờ toàn cục cho mọi khoá ngay trước khi đặt máy, hay để yên?</td></tr></table>
        focus: [1, 1, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định với một trạm đo thời tiết trên núi, dùng vi điều khiển có hệ điều hành thời gian thực. Trạm đặt dự kiến 3 tháng nhưng có thể ở lại 3 năm, đều là số minh hoạ. Câu một, thư viện ghi thẻ nhớ mua về làm bộ nhớ trống giảm 20 ki-lô-byte mỗi ngày, hiện còn 600. Bạn khởi động lại mỗi đêm, giới hạn cỡ cố định cho thư viện, hay giám sát ngưỡng 100 ki-lô-byte? Câu hai, bạn bật kế thừa ưu tiên bằng cờ toàn cục cho mọi khoá ngay trước khi đặt máy, hay để yên? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <p>Câu 1: (600 − 100) chia 20 = $\hl{25}$ ngày là chạm ngưỡng; 3 tháng ≈ 90 ngày cần 90 × 20 = 1800 KB, gấp ba số đang có.</p>
          <table class="t"><tr><th>lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>khởi động lại mỗi đêm</td><td>dễ làm ngay</td><td>chỉ đúng nếu bộ nhớ trở lại đầy sau khởi động; nếu bảng dựng lại từ thẻ nhớ như năm 2004 thì cạn ngay lúc khởi động</td></tr>
          <tr><td>giới hạn cỡ cố định</td><td>không bao giờ ăn sang phần khác — cách “đúng nhất” của năm 2004</td><td>phải thử lại lúc thư viện chạm giới hạn: nó báo lỗi hay treo?</td></tr>
          <tr><td>giám sát ngưỡng 100 KB, dừng ghi, báo về</td><td>dừng trước khi cạn, có số đo xu hướng</td><td>mất dữ liệu sau ngưỡng nếu không ai tới</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án câu một bắt đầu bằng phép tính, 600 trừ 100 chia 20 là 25 ngày thì chạm ngưỡng, còn 90 ngày cần 1800 ki-lô-byte. Khởi động lại mỗi đêm dễ làm, nhưng nếu bảng dựng lại từ thẻ nhớ như năm 2004 thì cạn ngay lúc khởi động. Giới hạn cỡ cố định không bao giờ ăn sang phần khác, nhưng phải thử xem thư viện chạm giới hạn thì báo lỗi hay treo. Giám sát ngưỡng thì dừng trước khi cạn và có số đo xu hướng, đổi lại mất dữ liệu sau ngưỡng nếu không ai tới."
      - clear: true
        show: |
          <p class="note">Nên làm: giới hạn cỡ cố định <b>và</b> giám sát ngưỡng, thử cả lúc chạm giới hạn. Điều kiện đổi: trạm chỉ ở 3 tuần, có người ghé mỗi tuần → khởi động lại mỗi đêm có thể đủ, vì 25 ngày chưa tới.</p>
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>bật cờ toàn cục ngay trước khi đặt máy</td><td>chặn đảo ngược ưu tiên ở mọi khoá</td><td>đổi hành vi của <b>mọi</b> khoá khi không còn thời gian thử lại — đội năm 1997 đã phân tích và thử kỹ trước khi gửi lên</td></tr>
          <tr><td>bật ngay từ đầu, thử cả hệ thống với cờ đó</td><td>an toàn và đã thử</td><td>tốn chút thời gian mỗi lần lấy khoá; nhà cung cấp năm 1997 đánh giá là nhỏ</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Vậy nên làm cả hai, giới hạn cỡ cố định và giám sát ngưỡng, rồi thử cả lúc chạm giới hạn. Nếu trạm chỉ ở 3 tuần và có người ghé mỗi tuần, khởi động lại mỗi đêm có thể đủ, vì chưa tới 25 ngày. Câu hai, bật cờ toàn cục ngay trước khi đặt máy chặn được đảo ngược ưu tiên, nhưng đổi hành vi của mọi khoá khi không còn thời gian thử lại. Tốt hơn là bật từ đầu và thử cả hệ thống với cờ đó, cái giá nhỏ mà nhà cung cấp năm 1997 đã đánh giá."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">1997: đảo ngược ưu tiên, ghi vết có sẵn</span><span class="a">→</span>
          <span class="n">1/2004: thư viện mua về cạn bộ nhớ</span><span class="a">→</span>
          <span class="n">4/2004: chế độ hạn chế, giám sát ngưỡng</span><span class="a">→</span>
          <span class="n">2014–2015: flash mòn, tránh vùng hỏng</span><span class="a">→</span>
          <span class="n">2017 → nay: một khung dùng lại</span></div>
        say: "Tổng kết lại hành trình. Năm 1997, đảo ngược ưu tiên được tìm ra nhờ công cụ ghi vết để sẵn. Tháng 1 năm 2004, một thư viện mua về làm cạn bộ nhớ, và tháng 4 năm đó đội thêm chế độ hạn chế tự động và giám sát ngưỡng. Từ 2014 tới 2015, flash mòn sau hơn 10 năm và đội tránh vùng hỏng, còn từ 2017 tới nay, nhiều nhiệm vụ nhỏ dùng lại một khung phần mềm chung."
      - show: |
          <div class="box key"><b>Tư duy:</b> thứ cứu được nhiệm vụ là thứ đã được <b>thiết kế sẵn</b> trước khi hỏng — công cụ ghi vết, đường lui, số đo tài nguyên. Hãy hỏi: nếu thiết bị của mình kẹt ở xa, mình còn nhìn thấy gì và còn làm được gì?</div>
        say: "Điều cần mang theo, thứ cứu được nhiệm vụ luôn là thứ đã được thiết kế sẵn trước khi hỏng, như công cụ ghi vết, đường lui và số đo tài nguyên. Hãy tự hỏi, nếu thiết bị của mình kẹt ở xa, mình còn nhìn thấy gì và còn làm được gì?"
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá ESY. Từ thanh ghi, ngắt, định thời, cảm biến, giao tiếp, lập lịch và hệ điều hành thời gian thực, tới độ tin cậy, năng lượng và cập nhật an toàn, bạn đã thấy chúng cùng làm việc trên những robot ở rất xa Trái Đất.</p>
        say: "Đây là bài cuối của khoá hệ thống nhúng và thời gian thực. Bạn đã đi từ thanh ghi, ngắt, định thời và giao tiếp, qua lập lịch, tới độ tin cậy, năng lượng và cập nhật an toàn. Giờ bạn thấy chúng cùng làm việc trên những robot ở rất xa Trái Đất. Cảm ơn bạn đã theo học."
