# Quy ước: “tác vụ cao / trung bình / thấp” như bài 10; “khoá” = khoá loại trừ lẫn nhau (mutex); “kế thừa ưu tiên” như bài 10;
#   “bộ giám sát” như bài 12; “ngày sao Hoả” = sol, dài 24 giờ 37 phút [RN05]. Bộ nhớ tạm = RAM (mất khi tắt điện);
#   bộ nhớ flash = bộ nhớ lưu lâu (giữ khi tắt điện, ô nhớ mòn dần). 1 MB = 1024 KB (cách tính trong bài).
#   Mọi sự kiện và con số có nguồn ghi trong audit/esy/sources_L15.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”:
#   mốc 40 ms, 110 ms, 15 ms, 2 ms, tải trung bình 30/60 ms ở chặng 1; 3000/2000/1000 tệp, 100 tệp ở chặng 2; 300 sản phẩm dữ liệu mỗi
#   ngày ở chặng 3; trạm đo 600 KB, 20 KB mỗi ngày ở câu đố — đều là SỐ MINH HOẠ.
#   “Gần 50 lần (49,2) đặt lại mỗi ngày sao Hoả” là phép tính trên mẫu 15–15–60 phút (cận trên nếu lặp suốt ngày), KHÔNG phải số đo.
#   Tránh trùng CAS L04 (khoá CAS sẽ phân tích sự cố Pathfinder): bài này rút thực hành theo quy mô nhiệm vụ, không kể chi tiết điều tra.
#   Lời đọc không nói “VxWorks”, “select()”, “JPL”, “F Prime”, “CubeSat”, “Linux”, “RAM”: nói “hệ điều hành thời gian thực thương mại”,
#   “hàm chờ nhiều nguồn”, “Phòng thí nghiệm Sức đẩy Phản lực”, “khung phần mềm bay”, “vệ tinh siêu nhỏ”, “hệ điều hành mã nguồn mở”,
#   “bộ nhớ tạm”. Tên NASA, Pathfinder, Spirit, Opportunity, flash: lexicon_vi.ESY.yaml (probe p2).
objectives:
  - "Kể lại hành trình phần mềm bay trên robot thăm dò sao Hoả qua năm chặng từ 1997 tới nay, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại hạn chót của chu kỳ 8 Hz khi đảo ngược ưu tiên, số lần cấp thêm bộ nhớ trước khi cạn, nhịp đặt lại trễ và tuổi thọ vượt thiết kế"
  - "Chọn giữa khởi động lại định kỳ, giới hạn vùng nhớ cố định và giám sát ngưỡng cho thiết bị của mình, kèm điều kiện đổi lựa chọn"
