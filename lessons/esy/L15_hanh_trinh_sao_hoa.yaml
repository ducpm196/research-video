          <rect x="1230" y="220" width="340" height="100" rx="10" fill="#fde8e8" stroke="#e11d48" stroke-width="3"/><text x="1400" y="260">nguyên nhân còn</text><text x="1400" y="294">đặt lại mãi, cần đường lui</text>
