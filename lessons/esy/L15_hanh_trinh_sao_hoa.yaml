          <tr><td><b class="red">2.</b> “Bản kể lại nổi tiếng là đủ tin”</td><td>bản tóm tắt bài nói năm 1997 được chuyển cho khoảng 400 người, nhưng trưởng nhóm phần mềm đã sửa hai chi tiết: công cụ gỡ lỗi để lại có chủ đích, và không vá bằng dòng lệnh</td><td>đọc báo cáo của chính đội làm hệ thống</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ một kỹ sư quên bật cờ, lần sau cẩn thận hơn là xong. Đội năm 1997 viết rằng không ai quyết định tắt nó, họ chỉ bỏ sót. Năm 2004 việc dở được biết nhưng không ai được giao theo tới cùng, nên cần người chịu trách nhiệm cho từng việc dở. Bài học sai thứ hai là tin ngay một bản kể lại nổi tiếng. Bản tóm tắt năm 1997 được chuyển cho khoảng 400 người, nhưng trưởng nhóm phần mềm đã sửa hai chi tiết của nó."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Có bộ giám sát, tự khởi động lại là an toàn” (mức hệ thống)</td><td>năm 2004 nguyên nhân nằm ngay lúc khởi động: đặt lại gần 50 lần mỗi ngày mà không khỏi</td><td>đường lui chạy thiếu (chế độ hạn chế), bộ giám sát thứ hai, ghi lý do đặt lại</td></tr>
          <tr><td><b class="red">4.</b> “Chạy thử giống bay mà không lỗi là đủ” (lỗi của người đã đi làm)</td><td>dữ liệu một đợt thử năm 2004 <b>đã</b> cho thấy bộ nhớ trống giảm dần, nhưng không ai phân tích; thử dài hơn 11 ngày không kịp lịch</td><td>gửi về số đo tài nguyên, có công cụ tự phân tích xu hướng</td></tr>
          <tr><td><b class="red">5.</b> “Chép nguyên quy trình của cơ quan vũ trụ cho mọi thiết bị”</td><td>đội bay cũng phải chọn: không đưa sửa đổi “đúng nhất” vào bản tháng 4/2004 vì chưa thử kịp</td><td>chọn theo tuổi thọ, khả năng sửa từ xa, cái giá khi hỏng</td></tr></table>
