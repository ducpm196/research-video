        focus: [1, 1, 1, 1]
        say: "Hình này là cơ chế xuyên suốt cả bài. Một tác vụ trễ hạn hoặc bị treo thì khâu giám sát, năm 1997 là chính tác vụ lập lịch, phát hiện và ra lệnh khởi động lại. Nếu nguyên nhân biến mất sau khi khởi động lại, như năm 1997, máy chạy tiếp bình thường. Nếu nguyên nhân nằm ngay trong bước khởi động, như năm 2004, máy đặt lại mãi, chỉ đường lui thiết kế sẵn mới cứu được."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 1997 — khai sinh: một tàu, một bộ xử lý, chu kỳ 8 Hz"
    stage: {year: "1997", scale: "một CPU điều khiển cả tàu; bus 1553 thừa kế từ Cassini, lập lịch ở 8 Hz (chu kỳ 0,125 s); tác vụ lập lịch bus ưu tiên cao nhất, tác vụ phân phát dữ liệu thứ ba, tác vụ khí tượng thấp hơn; hệ điều hành thời gian thực thương mại", source: "[GR97] [MJ97]", practice: "để sẵn công cụ ghi vết trong phần mềm bay (“test what you fly and fly what you test”); hiểu rõ phần mềm thương mại mình dùng; bật kế thừa ưu tiên cho khoá dùng chung — đúng khi mỗi khoá chỉ có một tác vụ chờ, và đã thử lại toàn hệ thống"}
    checks:
      - "1 / 8 == 0.125"
      - "40 + 60 + 2 + 15 == 117 and 117 > 110"
      - "40 + 30 + 2 + 15 == 87 and 87 <= 110 and 110 - 40 - 2 - 15 == 53"
      - "40 + 2 + 15 == 57 and 57 <= 110"
      - "18 * 3600 * 8 == 518400"
    steps:
      - show: |
          <p><b>Quy mô:</b> “một CPU điều khiển cả tàu”. Phần cứng nối thiết bị thừa kế từ tàu Cassini, buộc phần mềm lập lịch ở <b>8 Hz</b>: mỗi chu kỳ <b>0,125 giây</b>.</p>
          <table class="t"><tr><th>tác vụ (theo đội phần mềm, 1997)</th><th>ưu tiên</th><th>việc</th></tr>
          <tr><td>lập lịch đường truyền</td><td>cao nhất</td><td>chuẩn bị giao dịch cho chu kỳ sau, kiểm tác vụ kia đã xong chưa</td></tr>
          <tr><td>phân phát dữ liệu</td><td>thứ ba</td><td>gom kết quả của chu kỳ, phải xong <b>trước</b> lượt lập lịch kế tiếp</td></tr>
          <tr><td>khí tượng (ASI/MET)</td><td>thấp</td><td>nhận dữ liệu qua ống truyền tin, dùng chung một khoá</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng một, năm 1997, một bộ xử lý điều khiển cả tàu. Phần cứng nối thiết bị thừa kế từ một tàu trước đó, buộc phần mềm lập lịch 8 lần mỗi giây, mỗi chu kỳ 0 phẩy 125 giây. Tác vụ lập lịch đường truyền có ưu tiên cao nhất, chuẩn bị chu kỳ sau và kiểm xem tác vụ kia đã xong chưa. Tác vụ phân phát dữ liệu đứng thứ ba, và phải xong trước lượt lập lịch kế tiếp, một hạn chót cứng. Tác vụ khí tượng có ưu tiên thấp và dùng chung một khoá."
      - clear: true
        show: |
          <p>Tác vụ phân phát thức dậy ở mốc 40 ms, cần 15 ms; lượt lập lịch kế tiếp ở mốc 110 ms; tác vụ khí tượng còn giữ khoá 2 ms (số minh hoạ).</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>phân phát xong ở</th></tr>
          <tr><td>Bước 1. tải trung bình nhẹ, 30 ms, không kế thừa</td><td>40 + 30 + 2 + 15</td><td>$\hlg{87}$ ms, kịp hạn</td></tr>
          <tr><td>Bước 2. tải trung bình nặng, 60 ms, không kế thừa</td><td>40 + 60 + 2 + 15</td><td>$\hl{117}$ ms $\gt$ 110: <b>đặt lại</b></td></tr>
          <tr><td>Bước 3. ngưỡng tải gây lỗi</td><td>110 − 40 − 2 − 15</td><td>trên 53 ms là trễ hạn</td></tr>
          <tr><td>Bước 4. có kế thừa ưu tiên, tải nào cũng vậy</td><td>40 + 2 + 15</td><td>$\hlb{57}$ ms, kịp hạn</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", "2.5", 0]
        say: "Làm thử bằng số minh hoạ, tác vụ phân phát thức dậy ở mốc 40 mi li giây và cần 15, lượt lập lịch kế tiếp ở mốc 110. Tác vụ khí tượng còn giữ khoá 2 mi li giây. Bước một, nếu các tác vụ trung bình chỉ chạy 30, phân phát xong ở mốc 87, vẫn kịp. Bước hai, nếu chúng chạy 60, phân phát xong ở mốc 117, quá 110, và tàu tự khởi động lại. Bước ba, trừ ngược ra, tải trung bình trên 53 là trễ hạn. Bước bốn, có kế thừa ưu tiên thì phân phát xong ở mốc 57 dù tải nặng thế nào. Vì vậy lỗi chỉ lộ ra khi tải nặng."
      - clear: true
        show: |
          <table class="t"><tr><th>đội phần mềm kể lại (1997)</th><th>thực hành rút ra</th></tr>
          <tr><td>thử nghiệm trước khi phóng chỉ ở trường hợp “tốt nhất”; trên sao Hoả dữ liệu nhiều hơn dự kiến</td><td>thử cả tải <b>vượt</b> dự kiến</td></tr>
          <tr><td>công cụ ghi vết vào bộ đệm vòng để lại trong phần mềm bay <b>có chủ đích</b>; tái hiện lỗi trong <b>chưa tới 18 giờ</b></td><td>“thử cái mình bay, bay cái mình thử”</td></tr>
          <tr><td>sửa: bật cờ kế thừa ưu tiên — một biến toàn cục, đổi <b>mọi</b> khoá loại này; phân tích và thử kỹ rồi mới gửi phần sai khác lên tàu</td><td>sửa nhỏ vẫn phải thử lại cả hệ thống</td></tr></table>
          <p class="note">18 giờ ở 8 chu kỳ mỗi giây: 18 × 3600 × 8 = $\hl{518\,400}$ chu kỳ chạy thử mới gặp một lần lỗi.</p>
        focus: ["1.2", "1.3", "1.4", "1.4", 2]
        say: "Đội phần mềm năm 1997 kể rằng trước khi phóng họ chỉ thử trường hợp tốt nhất, còn trên sao Hoả dữ liệu nhiều hơn dự kiến. Công cụ ghi vết được để lại trong phần mềm bay có chủ đích, nhờ vậy họ tái hiện được lỗi trong chưa tới 18 giờ. Cách sửa là bật cờ kế thừa ưu tiên, nhưng cờ đó là biến toàn cục, đổi mọi khoá cùng loại. Họ phân tích, thử kỹ, rồi mới gửi phần sai khác lên tàu. Tính ra, 18 giờ ở 8 chu kỳ mỗi giây là 518 nghìn 400 chu kỳ mới gặp một lần lỗi."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, tháng 1/2004 — nhân đôi, gấp rút: hai xe tự hành và bộ nhớ cạn dần"
    stage: {year: "2004", scale: "hai xe tự hành Spirit và Opportunity hạ cánh 4/1 và 25/1/2004; làm trong 3 năm từ ý tưởng tới phóng; hệ điều hành thương mại kèm thư viện tệp kiểu DOS; flash 224 MB cho dữ liệu khoa học; tối đa 8192 sản phẩm dữ liệu; vùng nhớ riêng 256 KB, nới thêm từng 256 KB không giới hạn từ hơn 4 MB bộ nhớ trống", source: "[RN05]", practice: "áp quy tắc thiết kế (không cấp phát sau khởi động) cả cho phần mềm mua về; đo và gửi về đất số bộ nhớ trống; quản lý chính thức danh sách việc còn dở"}
    checks:
      - "3000 + 2000 + 1000 == 6000 and 6000 / 100 == 60"
      - "4096 // 256 == 16"
      - "15 + 15 + 60 == 90 and 24 * 60 + 37 == 1477 and round(1477 / 90 * 3, 1) == 49.2"
      - "33 - 18 == 15 and round(15 * 1477 / 1440, 1) == 15.4"
      - "2 ** 13 == 8192"
    steps:
      - show: |
          <p><b>Quy mô:</b> hai xe tự hành hạ cánh tháng 1/2004; làm trong <b>3 năm</b> từ ý tưởng tới lúc phóng. Phần mềm bay dùng hệ điều hành thương mại cùng <b>thư viện tệp kiểu DOS</b> đi kèm; bộ nhớ flash <b>224 MB</b> chứa dữ liệu khoa học.</p>
          <table class="t"><tr><th>thư viện tệp làm gì khi…</th><th>trên flash</th><th>trong bộ nhớ tạm</th></tr>
          <tr><td>tạo tệp</td><td>ghi tệp</td><td>thêm một mục vào bảng mô tả thư mục</td></tr>
          <tr><td>xoá tệp</td><td>chỉ đổi chữ đầu tên thành mã E5, giải phóng chỗ</td><td><b>giữ nguyên</b> mục đó, không bao giờ trả lại</td></tr>
          <tr><td>khởi động, gắn ổ flash</td><td>—</td><td>dựng lại bảng cho <b>mọi</b> mục từng có, kể cả đã xoá</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng hai, hai xe tự hành hạ cánh tháng 1 năm 2004, sau chỉ 3 năm từ ý tưởng tới lúc phóng. Phần mềm bay dùng hệ điều hành thương mại cùng thư viện tệp đi kèm, với bộ nhớ flash 224 mê-ga-byte. Khi tạo tệp, thư viện ghi lên flash và thêm một mục vào bảng thư mục trong bộ nhớ tạm. Khi xoá tệp, nó giải phóng chỗ trên flash, nhưng giữ nguyên mục trong bộ nhớ tạm. Mỗi lần khởi động, nó dựng lại bảng cho mọi mục từng có, kể cả tệp đã xoá."
      - clear: true
        show: |
          <p>Bộ nhớ cần <b>không</b> theo số tệp hiện có, mà theo <b>tổng số tệp nhiều nhất từng có</b> ở mỗi thư mục con.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. ba thư mục từng có nhiều nhất 3000, 2000, 1000 tệp; nay còn 100 tệp (số minh hoạ)</td><td>3000 + 2000 + 1000</td><td>bảng cho $\hl{6000}$ mục</td></tr>
          <tr><td>Bước 2. so với số tệp hiện có</td><td>6000 chia 100</td><td>tốn gấp $\hl{60}$ lần</td></tr>
          <tr><td>Bước 3. vùng nhớ riêng hết thì xin thêm từng 256 KB, <b>không giới hạn</b>; bộ nhớ trống thường hơn 4 MB, lấy 4096 KB</td><td>4096 chia 256</td><td>khoảng $\hlb{16}$ lần xin là cạn</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Vì vậy bộ nhớ cần không theo số tệp hiện có, mà theo tổng số tệp nhiều nhất từng có ở mỗi thư mục con. Bước một, lấy số minh hoạ, ba thư mục từng có nhiều nhất 3000, 2000 và 1000 tệp, nay chỉ còn 100 tệp, mà bảng vẫn cần 6000 mục. Bước hai, 6000 chia 100, tức tốn gấp 60 lần so với số tệp hiện có. Bước ba, cấu hình cho phép vùng nhớ riêng xin thêm từng 256 ki-lô-byte mà không giới hạn, lấy bộ nhớ trống khoảng 4096 ki-lô-byte thì chừng 16 lần xin là cạn."
      - clear: true
        show: |
          <p>Hết bộ nhớ, tác vụ ghi tệp bị <b>treo im lặng</b> (cấu hình sai thứ hai); chức năng kiểm sức khoẻ thấy tác vụ treo thì ra lệnh đặt lại. Khởi động lại lại gắn ổ flash, lại cạn: <b>vòng lặp</b>. Đặt lại được hoãn để mặt đất kịp can thiệp: <b>15, 15, rồi 60 phút</b>, lặp lại.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 4. một vòng của mẫu hoãn</td><td>15 + 15 + 60 = 90 phút</td><td>3 lần đặt lại mỗi 90 phút</td></tr>
          <tr><td>Bước 5. nếu lặp suốt một ngày sao Hoả, 1477 phút (cận trên tính trên mẫu)</td><td>1477 chia 90, nhân 3</td><td>$\approx \hl{49{,}2}$, tức <b>gần 50</b> lần đặt lại</td></tr>
          <tr><td>Bước 6. từ ngày thứ 18 tới khi làm khoa học lại ở ngày thứ 33</td><td>15 ngày × 1477 chia 1440</td><td>$\approx \hlb{15{,}4}$ ngày Trái Đất</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Khi hết bộ nhớ, tác vụ ghi tệp bị treo im lặng do một cấu hình sai thứ hai, và chức năng kiểm sức khoẻ ra lệnh đặt lại. Khởi động lại thì lại gắn ổ flash, lại cạn bộ nhớ, và mỗi lần đặt lại được hoãn 15, 15, rồi 60 phút để mặt đất kịp can thiệp. Bước bốn, một vòng của mẫu hoãn là 90 phút, có 3 lần đặt lại. Bước năm, nếu lặp suốt một ngày sao Hoả 1477 phút, ta được 49 phẩy 2, tức gần 50 lần, một cận trên chứ không phải số đo. Bước sáu, từ ngày thứ 18 tới ngày thứ 33 là 15 ngày sao Hoả, khoảng 15 phẩy 4 ngày Trái Đất."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2004 — ổn định lại: chế độ hạn chế, bản sửa tháng 4"
    stage: {year: "2004", scale: "chế độ hạn chế (ý tưởng từ Pathfinder) đưa xe về điều khiển được ở ngày thứ 21; xoá flash từng mảnh nhỏ, kiểm cả hai bản phần mềm sau mỗi mảnh; bản phần mềm tháng 4/2004 cho cả hai xe; quy tắc: dừng mọi hoạt động khi bộ nhớ trống ≤ 800 KB, xoá sản phẩm đã nhận sau 24 thay vì 48 giờ", source: "[RN05]", practice: "thiết kế sẵn đường lui cho cả “điều chưa biết” (chế độ hạn chế, tự vào khi đặt lại nhiều lần); bộ giám sát thứ hai cho việc tắt máy; giám sát ngưỡng tài nguyên; cân nhắc rủi ro của một sửa đổi “đúng” nhưng chưa thử được hết"}
    checks:
      - "round(800 / 256, 3) == 3.125 and 800 // 256 == 3"
      - "300 * 48 / 24 == 600 and 300 * 24 / 24 == 300"
      - "round(600 / 8192 * 100, 1) == 7.3 and round(300 / 8192 * 100, 1) == 3.7"
    steps:
      - show: |
          <table class="t"><tr><th>đội điều tra làm gì (2004)</th><th>vì sao được</th></tr>
          <tr><td>gửi lệnh <b>chế độ hạn chế</b>: phần cứng bật vài bit trong thanh ghi, phần mềm đọc lúc khởi động và <b>không dùng flash</b></td><td>tệp tạm trong bộ nhớ tạm trống trơn, cần ít bộ nhớ → khởi động xong</td></tr>
          <tr><td>bit đó mất khi tắt điện → mỗi sáng gửi lại</td><td>đúng như thanh ghi ngoại vi ở bài 1</td></tr>
          <tr><td>chép phần mềm bay sang bộ nhớ tạm, xoá flash <b>từng mảnh nhỏ</b>, kiểm cả hai bản sau mỗi mảnh</td><td>hỏng giữa chừng vẫn còn một bản tốt, như hai phân vùng ở bài 14</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Ở chặng ba, đội điều tra gửi lệnh chế độ hạn chế, phần cứng bật vài bit trong một thanh ghi để phần mềm không dùng flash. Hệ tệp thay thế trong bộ nhớ tạm trống trơn, nên khởi động xong. Bit đó mất khi tắt điện, nên mỗi sáng phải gửi lại, như thanh ghi ngoại vi ở bài 1. Họ chép phần mềm bay sang bộ nhớ tạm, xoá flash từng mảnh nhỏ, và kiểm cả hai bản phần mềm sau mỗi mảnh. Hỏng giữa chừng vẫn còn một bản tốt, giống hai phân vùng ở bài 14."
      - clear: true
        show: |
          <table class="t"><tr><th>bản phần mềm tháng 4/2004 và quy tắc mới</th><th>sửa điều gì</th></tr>
          <tr><td>lúc khởi động, <b>nén</b> bảng thư mục, bỏ mục của tệp đã xoá</td><td>hết hiệu ứng “nhiều nhất từng có”</td></tr>
          <tr><td>đặt lại nhiều lần thì <b>tự</b> vào chế độ hạn chế</td><td>không cần chờ lệnh từ Trái Đất</td></tr>
          <tr><td>dùng đồng hồ báo thức phần cứng làm <b>bộ giám sát thứ hai</b> cho việc tắt máy</td><td>tắt máy kẹt thì phần cứng tự ngắt điện</td></tr>
          <tr><td>bộ nhớ trống còn <b>800 KB</b> trở xuống thì dừng mọi hoạt động</td><td>dừng trước khi cạn</td></tr>
          <tr><td>xoá sản phẩm dữ liệu đã nhận sau <b>24</b> giờ thay vì 48</td><td>ít tệp sống cùng lúc hơn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bản phần mềm tháng 4 năm 2004 và quy tắc mới sửa năm điều. Lúc khởi động, phần mềm nén bảng thư mục, bỏ mục của tệp đã xoá. Khi đặt lại nhiều lần, xe tự vào chế độ hạn chế. Đồng hồ báo thức phần cứng làm bộ giám sát thứ hai, nếu tắt máy bị kẹt thì phần cứng tự ngắt điện. Khi bộ nhớ trống còn 800 ki-lô-byte trở xuống, xe dừng mọi hoạt động. Sản phẩm dữ liệu đã nhận được xoá sau 24 giờ thay vì 48."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. ngưỡng 800 KB còn chứa mấy lần xin thêm 256 KB</td><td>800 chia 256 = 3,125</td><td>còn $\hlb{3}$ lần xin trước khi cạn</td></tr>
          <tr><td>Bước 2. 300 sản phẩm mỗi ngày (số minh hoạ), giữ 48 giờ</td><td>300 × 48 chia 24</td><td>600 tệp sống, $\approx 7{,}3\%$ của 8192</td></tr>
          <tr><td>Bước 3. giữ 24 giờ</td><td>300 × 24 chia 24</td><td>$\hlg{300}$ tệp, $\approx 3{,}7\%$</td></tr></table>
          <p class="note">Sửa “đúng” nhất là giới hạn vùng nhớ riêng ở một cỡ cố định, nhưng đội <b>không</b> đưa vào bản tháng 4: nó có thể làm lộ hành vi chưa thử, mà xe có tuổi thọ giới hạn, không chờ được một đợt thử dài.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước một, ngưỡng 800 ki-lô-byte chia 256 được 3 phẩy 125, tức còn đủ 3 lần xin thêm trước khi cạn, nên dừng kịp. Bước hai, lấy số minh hoạ 300 sản phẩm mỗi ngày, giữ 48 giờ thì có 600 tệp sống, khoảng 7 phẩy 3 phần trăm giới hạn 8192. Bước ba, giữ 24 giờ thì chỉ còn 300 tệp, khoảng 3 phẩy 7 phần trăm. Sửa đúng nhất là giới hạn vùng nhớ riêng ở một cỡ cố định. Nhưng đội không đưa nó vào bản tháng 4, vì nó có thể làm lộ hành vi chưa thử, mà xe có tuổi thọ giới hạn."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2014 tới 2015 — kéo dài vượt thiết kế: flash mòn sau hơn 10 năm"
    stage: {year: "2014 → 2015", scale: "nhiệm vụ thiết kế 3 tháng; Spirit chạy 6 năm; Opportunity vẫn chạy năm 2014 (hạ cánh 25/1/2004); một tá lần đặt lại trong tháng 8/2014; flash có 7 dãy, lỗi tập trung ở dãy 7; định dạng lại 9/2014 và 20/3/2015", source: "[JPL14a] [JPL14b] [JPL15] [RN05]", practice: "giữ phần mềm bay và chuỗi lệnh quan trọng ở bộ nhớ lưu lâu riêng; có chế độ chạy không cần flash (gửi dữ liệu về trước khi ngủ); khoanh vùng hỏng và tránh nó thay vì bỏ cả thiết bị; nhiệm vụ dài phải thiết kế cho mòn"}
    checks:
      - "round((__import__('datetime').date(2014, 8, 29) - __import__('datetime').date(2004, 1, 25)).days / 365.25, 1) == 10.6"
      - "round(10.6 / 0.25) == 42"
      - "round(6 / 7 * 100, 1) == 85.7"
    steps:
      - show: |
          <p><b>Quy mô:</b> hai xe làm cho nhiệm vụ “chỉ <b>3 tháng</b>”; Spirit chạy <b>6 năm</b>; tháng 8/2014 Opportunity vẫn chạy, và tự đặt lại <b>một tá lần</b> trong tháng. Nghi phạm hàng đầu: <b>ô nhớ flash đã mòn</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. từ hạ cánh 25/1/2004 tới 29/8/2014</td><td>đếm ngày, chia 365,25</td><td>$\approx \hl{10{,}6}$ năm</td></tr>
          <tr><td>Bước 2. so với thiết kế 3 tháng = 0,25 năm</td><td>10,6 chia 0,25</td><td>$\approx \hl{42}$ lần</td></tr></table>
          <p class="note">Năm 2004 đội đã ghi: không dọn mục của tệp đã xoá là “lỗi nền tảng cho nhiệm vụ dài ngày”. Mười năm sau, điểm nghẽn là chính phần cứng lưu trữ.</p>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Ở chặng bốn, hai xe được làm cho nhiệm vụ chỉ 3 tháng, Spirit chạy 6 năm, còn tháng 8 năm 2014 Opportunity vẫn chạy và tự đặt lại một tá lần trong tháng. Nghi phạm hàng đầu là ô nhớ flash đã mòn. Bước một, từ lúc hạ cánh 25 tháng 1 năm 2004 tới 29 tháng 8 năm 2014 là khoảng 10 phẩy 6 năm. Bước hai, so với thiết kế 0 phẩy 25 năm, xe đã chạy khoảng 42 lần tuổi thọ dự kiến. Năm 2004 điểm nghẽn của nhiệm vụ dài ngày là cách quản lý tệp, mười năm sau là chính phần cứng lưu trữ."
      - clear: true
        show: |
          <table class="t"><tr><th>đội vận hành làm gì (2014–2015)</th><th>vì sao được</th></tr>
          <tr><td>định dạng lại flash: xoá, tìm ô hỏng, <b>đánh dấu để tránh</b></td><td>phần mềm bay và chuỗi lệnh quan trọng nằm ở <b>bộ nhớ lưu lâu khác</b></td></tr>
          <tr><td>tạm chạy <b>không dùng flash</b>: dữ liệu mỗi ngày giữ ở bộ nhớ tạm, gửi về Trái Đất <b>trước khi ngủ</b></td><td>bộ nhớ tạm mất hết khi tắt điện</td></tr>
          <tr><td>sửa phần mềm để <b>tránh hẳn dãy 7</b> trong 7 dãy flash; sau lần định dạng 20/3/2015 dùng lại 6 dãy kia</td><td>khoanh vùng hỏng, giữ phần còn tốt</td></tr></table>
          <p>Bước 3. phần flash còn dùng: 6 chia 7 ≈ $\hlg{85{,}7\%}$. Người quản lý dự án: “chỉ thời gian mới trả lời được” việc đã khắc phục xong chưa.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Đội vận hành làm ba việc. Họ định dạng lại flash để tìm ô hỏng và đánh dấu tránh, ít rủi ro vì phần mềm bay nằm ở một bộ nhớ lưu lâu khác. Trong lúc chờ, xe chạy không dùng flash, dữ liệu giữ ở bộ nhớ tạm và phải gửi về trước khi ngủ. Họ sửa phần mềm để tránh hẳn dãy thứ 7 trong 7 dãy flash, và từ ngày 20 tháng 3 năm 2015 xe dùng lại 6 dãy kia. Bước ba, 6 chia 7 là khoảng 85 phẩy 7 phần trăm dung lượng còn dùng được. Người quản lý dự án nói chỉ thời gian mới trả lời được việc đã khắc phục xong chưa."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2017 tới nay — nhiều nhiệm vụ nhỏ, một khung dùng lại"
    stage: {year: "2017 → nay", scale: "khung F´ của JPL, mã nguồn mở, cho vệ tinh siêu nhỏ, thiết bị đo; 8 dự án liệt kê: RapidScat (2014–2018), ASTERIA (2017), trực thăng Ingenuity trên sao Hoả (phóng 2020), Lunar Flashlight và NEA Scout (2022), CADRE (2025), OWLS, COLDArm; hệ điều hành: Linux 3, VxWorks 2, không ghi 3; chạy được cả khi không có hệ điều hành", source: "[FP]", practice: "chia phần mềm bay thành thành phần có giao diện rõ, nối qua cổng; dùng lại thư viện thành phần không sửa; có sẵn công cụ thử đơn vị và thử tích hợp; đúng khi nhiều nhiệm vụ cùng chịu ngân sách chặt và lịch ngắn"}
    checks:
      - "len(['RapidScat', 'ASTERIA', 'Ingenuity', 'LunarFlashlight', 'NEAScout', 'OWLS', 'CADRE', 'COLDArm']) == 8"
      - "[o for o in ['-', 'Linux', 'Linux', 'VxWorks', 'VxWorks', '-', 'Linux', '-']].count('Linux') == 3 and ['-', 'Linux', 'Linux', 'VxWorks', 'VxWorks', '-', 'Linux', '-'].count('VxWorks') == 2 and ['-', 'Linux', 'Linux', 'VxWorks', 'VxWorks', '-', 'Linux', '-'].count('-') == 3"
      - "round((__import__('datetime').date(2018, 11, 18) - __import__('datetime').date(2014, 9, 21)).days / 365.25, 1) == 4.2"
    steps:
      - show: |
          <p><b>Bối cảnh mới</b> (Phòng thí nghiệm Sức đẩy Phản lực viết): phải hỗ trợ “nhiều nhiệm vụ bay hơn bao giờ hết”, nhiều loại bộ xử lý và hệ điều hành, ngân sách chặt hơn, lịch ngắn hơn. Lời đáp: khung phần mềm bay <b>F´</b>, mã nguồn mở.</p>
          <table class="t"><tr><th>khung cung cấp</th><th>nối với bài nào của khoá</th></tr>
          <tr><td>thành phần có giao diện rõ, nối với nhau qua <b>cổng</b></td><td>tác vụ và hàng đợi ở bài 11</td></tr>
          <tr><td>hàng đợi tin nhắn, luồng; chạy được cả khi <b>không có</b> hệ điều hành, trên vi điều khiển yếu</td><td>vi điều khiển ở bài 0</td></tr>
          <tr><td>thư viện thành phần dùng lại <b>không cần sửa</b>; công cụ thử đơn vị và thử tích hợp</td><td>“thử cái mình bay” của chặng 1</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng năm, Phòng thí nghiệm Sức đẩy Phản lực viết rằng họ phải hỗ trợ nhiều nhiệm vụ bay hơn bao giờ hết, trên nhiều loại bộ xử lý và hệ điều hành. Ngân sách chặt hơn, lịch ngắn hơn, và lời đáp là một khung phần mềm bay mã nguồn mở. Khung chia phần mềm thành thành phần có giao diện rõ, nối qua cổng, giống tác vụ và hàng đợi ở bài 11. Nó chạy được cả khi không có hệ điều hành, trên vi điều khiển yếu như ở bài 0. Thư viện thành phần dùng lại không cần sửa, kèm công cụ thử đơn vị và thử tích hợp."
      - clear: true
        show: |
          <table class="t"><tr><th>dự án dùng khung (trang chính thức)</th><th>hệ điều hành</th><th>mốc</th></tr>
          <tr><td>RapidScat (đo gió, trên trạm vũ trụ)</td><td>không ghi</td><td>9/2014 → 11/2018</td></tr>
          <tr><td>ASTERIA (vệ tinh siêu nhỏ)</td><td>Linux</td><td>8/2017</td></tr>
          <tr><td>trực thăng Ingenuity trên sao Hoả</td><td>Linux, chip điện thoại</td><td>7/2020</td></tr>
          <tr><td>Lunar Flashlight, NEA Scout</td><td>VxWorks</td><td>2022</td></tr>
          <tr><td>CADRE (xe tự hành nhỏ); OWLS, COLDArm</td><td>Linux; không ghi</td><td>2025; —</td></tr></table>
          <p>Bước 1. đếm: <b>8</b> dự án — Linux 3, VxWorks 2, không ghi 3. Bước 2. RapidScat chạy từ 21/9/2014 tới 18/11/2018 ≈ $\hl{4{,}2}$ năm.</p>
        focus: ["1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Bảng liệt kê các dự án trên trang chính thức của khung, từ một máy đo gió trên trạm vũ trụ năm 2014. Có vệ tinh siêu nhỏ năm 2017 và năm 2022. Trực thăng trên sao Hoả phóng năm 2020 chạy hệ điều hành mã nguồn mở trên một chip điện thoại. Có cả hai vệ tinh dùng hệ điều hành thời gian thực thương mại. Bước một, đếm được 8 dự án, ba dùng hệ điều hành mã nguồn mở, hai dùng hệ điều hành thương mại, ba không ghi. Bước hai, máy đo gió chạy khoảng 4 phẩy 2 năm."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình bằng đường khác"
    checks:
      - "sorted([t for t in range(0, 200) if t >= 40 + 2 + 60 and t < 40 + 2 + 60 + 15])[-1] + 1 == 117"
      - "len([m for m in range(1477) if m % 90 in (15, 30, 0) and m > 0]) == 50 and round(1477 / 90 * 3, 1) == 49.2"
      - "256 * 16 == 4096"
      - "0.25 * 42 == 10.5 and 10.5 <= 10.6"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>117 ms</td><td>xếp lịch từng đoạn: tới 40 chờ; 40–100 tác vụ trung bình; 100–102 tác vụ khí tượng nhả khoá; 102–117 phân phát ✓</td></tr>
          <tr><td>gần 50 lần</td><td>liệt kê các phút đặt lại 15, 30, 90, 105, 120, 180, … dưới 1477: đếm được 50 ✓ (lần đầu ở phút 15)</td></tr>
          <tr><td>16 lần xin</td><td>nhân ngược: 16 × 256 = 4096 KB ✓</td></tr>
          <tr><td>42 lần thiết kế</td><td>nhân ngược: 42 × 0,25 = 10,5 năm, khớp với 10,6 sau khi làm tròn ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Xếp lịch từng đoạn, từ 40 tới 100 tác vụ trung bình chạy, từ 100 tới 102 tác vụ khí tượng nhả khoá, rồi từ 102 tới 117 phân phát chạy xong. Liệt kê các phút đặt lại 15, 30, 90, 105, 120, 180 và tiếp tục dưới 1477, ta đếm được 50 lần, khớp với gần 50. Nhân ngược, 16 nhân 256 là 4096 ki-lô-byte. Nhân ngược, 42 nhân 0 phẩy 25 là 10 phẩy 5 năm, khớp với 10 phẩy 6 sau khi làm tròn."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
