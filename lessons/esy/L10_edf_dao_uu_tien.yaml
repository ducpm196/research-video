60.0" y2="160" stroke="#e5e7eb" stroke-width="1"/><text x="960" y="182" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">12</text><text x="96" y="62" font-size="19" fill="#1f2937" text-anchor="end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">A (2, 4)</text><line x1="110.0" y1="28" x2="110.0" y2="74" stroke="#1f2937" stroke-width="2"/><line x1="393.3" y1="28" x2="393.3" y2="74" stroke="#1f2937" stroke-width="2"/><line x1="676.7" y1="28" x2="676.7" y2="74" stroke="#1f2937" stroke-width="2"/><line x1="960.0" y1="28" x2="960.0" y2="74" stroke="#1f2937" stroke-width="2"/><rect x="111.0" y="36" width="68.8" height="34" rx="3" fill="#2a78d6"/><rect x="181.8" y="36" width="68.8" height="34" rx="3" fill="#2a78d6"/><rect x="394.3" y="36" width="68.8" height="34" rx="3" fill="#2a78d6"/><rect x="465.2" y="36" width="68.8" height="34" rx="3" fill="#2a78d6"/><rect x="677.7" y="36" width="68.8" height="34" rx="3" fill="#2a78d6"/><rect x="748.5" y="36" width="68.8" height="34" rx="3" fill="#2a78d6"/><text x="96" y="118" font-size="19" fill="#1f2937" text-anchor="end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">B (3, 6)</text><line x1="110.0" y1="84" x2="110.0" y2="130" stroke="#1f2937" stroke-width="2"/><line x1="535.0" y1="84" x2="535.0" y2="130" stroke="#1f2937" stroke-width="2"/><line x1="960.0" y1="84" x2="960.0" y2="130" stroke="#1f2937" stroke-width="2"/><rect x="252.7" y="92" width="68.8" height="34" rx="3" fill="#eb6834"/><rect x="323.5" y="92" width="68.8" height="34" rx="3" fill="#eb6834"/><rect x="536.0" y="92" width="68.8" height="34" rx="3" fill="#eb6834"/><rect x="606.8" y="92" width="68.8" height="34" rx="3" fill="#eb6834"/><rect x="819.3" y="92" width="68.8" height="34" rx="3" fill="#eb6834"/><text x="527.0" y="116" font-size="19" fill="#dc2626" text-anchor="end" font-weight="bold">trễ hạn</text><text x="960" y="222" font-size="17" fill="#6b7280" text-anchor="end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">vạch đen: thời điểm thả việc mới = hạn của việc trước</text></svg></div>
          <p>Ở thời điểm 4, A được thả lại và cắt ngang B; tới hạn 6, B mới chạy được 2 trong 3 đơn vị → trễ hạn.</p>
        focus: [1, 1, 2, 2]
        say: "Bước hai, xem ưu tiên cố định, A luôn ưu tiên hơn B. Ở thời điểm 4, A được thả lại và cắt ngang B. Tới hạn 6, B mới chạy được 2 trong 3 đơn vị, nên trễ hạn, đánh dấu chữ đỏ. Bộ mô phỏng bỏ luôn việc trễ hạn đó."
      - clear: true
        show: |
          <p><b>Bước 3 — hạn sớm nhất, từ 0 tới 6:</b> mỗi lần có việc xong hay việc mới, so hạn các việc đang chờ.</p>
          <table class="t"><tr><th>lúc</th><th>việc đang chờ (hạn)</th><th>chọn</th></tr>
          <tr><td>0</td><td>A hạn 4, B hạn 6</td><td>A, chạy 0–2</td></tr>
          <tr><td>2</td><td>B hạn 6</td><td>B, chạy 2–4</td></tr>
          <tr><td>4</td><td>A mới hạn 8, B hạn 6 còn 1</td><td>$\hl{\text{B}}$, chạy 4–5</td></tr>
          <tr><td>5</td><td>A hạn 8</td><td>A, chạy 5–6</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước ba, chạy tay lập lịch theo hạn sớm nhất, mỗi lần có việc xong hay việc mới thì so hạn các việc đang chờ. Lúc 0, A có hạn 4, gần hơn hạn 6 của B, nên A chạy từ 0 tới 2. Lúc 2, chỉ còn B, nên B chạy từ 2 tới 4. Lúc 4, việc mới của A có hạn 8, còn B hạn 6 và còn 1 đơn vị, nên B chạy tiếp từ 4 tới 5. Lúc 5, B đã xong, nên A được chạy từ 5 tới 6."
      - clear: true
        show: |
          <p><b>Bước 4 — từ 6 tới 12:</b></p>
