end" font-weight="normal" stroke="#fffbeb" stroke-width="6" paint-order="stroke">vạch đen: thời điểm thả việc mới = hạn của việc trước</text></svg></div>
          <p>Ở thời điểm 4, việc mới của A có hạn 8, còn B có hạn 6 — gần hơn, nên B chạy tiếp và xong đúng lúc 5. Cả hai luôn kịp, bộ xử lý bận 100%.</p>
        focus: [1, 1, 2, 2]
        say: "Bước năm, đối chiếu với biểu đồ do máy mô phỏng theo hạn sớm nhất. Ở thời điểm 4, việc mới của A có hạn 8, còn B có hạn 6, gần hơn. Vì thế B chạy tiếp và xong ở thời điểm 5. Cả hai luôn kịp hạn, dù bộ xử lý bận 100 phần trăm."

  - id: check
    kind: check
    title: "Tự kiểm: đếm lại từng cửa sổ của mỗi việc"
    checks:
      - "(lambda tl: [tl[a:b].count(0) for a, b in ((0, 4), (4, 8), (8, 12))] == [2, 2, 2] and [tl[a:b].count(1) for a, b in ((0, 6), (6, 12))] == [3, 3] and tl.count(None) == 0)(alg.schedule_sim([(2, 4), (3, 6)], 12, 'EDF')[0])"
    steps:
      - show: |
          <p>Đường khác: không xem ai chạy lúc nào, chỉ <b>đếm</b> mỗi việc được chạy bao nhiêu đơn vị trong khoảng từ lúc thả tới hạn của nó.</p>
          <table class="t"><tr><th>việc</th><th>khoảng thả → hạn</th><th>được chạy</th><th>cần</th></tr>
          <tr><td>A thứ nhất, thứ hai, thứ ba</td><td>0–4, 4–8, 8–12</td><td>2, 2, 2</td><td>2 ✓</td></tr>
          <tr><td>B thứ nhất, thứ hai</td><td>0–6, 6–12</td><td>3, 3</td><td>3 ✓</td></tr>
          <tr><td>đơn vị bỏ trống</td><td>0–12</td><td>0</td><td>bận kín, khớp $U = 1$ ✓</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Kiểm bằng đường khác, vì đọc bảng quyết định có thể sót một dòng. Ta không xem ai chạy lúc nào, chỉ đếm mỗi việc được chạy bao nhiêu đơn vị trong khoảng từ lúc thả tới hạn. Cả ba việc của A, trong các khoảng 0 tới 4, 4 tới 8, 8 tới 12, đều được chạy đủ 2 đơn vị. Hai việc của B, trong 0 tới 6 và 6 tới 12, đều được đủ 3 đơn vị. Và không có đơn vị nào bỏ trống, đúng với U bằng 1, bộ xử lý bận kín."

  # ───────────────────────── 4. QUÁ TẢI ─────────────────────────
  - id: overload
    kind: concept
    title: "Khi quá tải: ai chịu trễ?"
    checks:
      - "(lambda m: sorted(set(i for i, _ in m)))(alg.schedule_sim([(2, 4), (3, 6), (1, 5)], 60, 'RM')[1]) == [1]"
      - "(lambda m: sorted(set(i for i, _ in m)))(alg.schedule_sim([(2, 4), (3, 6), (1, 5)], 60, 'EDF')[1]) == [0, 1, 2]"
      - "abs(2 / 4 + 3 / 6 + 1 / 5 - 1.2) < 1e-12"
    steps:
      - show: |
          <p>Thêm tác vụ (1, 5): $U = 1{,}2 \gt 1$, chắc chắn có trễ hạn. Mô phỏng 60 đơn vị:</p>
          <table class="t"><tr><th>cách lập lịch</th><th>tác vụ bị trễ</th></tr>
          <tr><td>ưu tiên cố định</td><td>chỉ tác vụ chu kỳ dài nhất (3, 6)</td></tr>
          <tr><td>hạn sớm nhất</td><td>$\hl{\text{cả ba}}$, kể cả tác vụ quan trọng (2, 4)</td></tr></table>
          <div class="box key">Hạn sớm nhất tối ưu khi không quá tải, nhưng khi quá tải, trễ hạn lan sang cả những tác vụ quan trọng. Ưu tiên cố định dễ đoán hơn.</div>
        focus: [1, 2, "2.2", "2.3", 3, 3]
        say: "Thêm một tác vụ chạy 1 mỗi 5, độ sử dụng thành 1 phẩy 2, lớn hơn 1, nên chắc chắn có trễ hạn. Ta mô phỏng 60 đơn vị thời gian. Với ưu tiên cố định, chỉ tác vụ có chu kỳ dài nhất bị trễ. Với hạn sớm nhất, cả ba tác vụ đều bị trễ, kể cả tác vụ quan trọng nhất. Vậy hạn sớm nhất tối ưu khi không quá tải, nhưng khi quá tải thì trễ hạn lan sang cả những tác vụ quan trọng. Ưu tiên cố định dễ đoán hơn."

  # ───────────────────────── 5. ĐẢO NGƯỢC ƯU TIÊN ─────────────────────────
  - id: inversion
    kind: concept
    title: "Đảo ngược ưu tiên và kế thừa ưu tiên"
    checks:
      - "(1 + 1) + 4 + 1 + 1 == 8 and 8 - 1 == 7"
      - "1 + 2 + 1 == 4 and 4 - 1 == 3"
    steps:
      - show: |
          <p>Ba tác vụ ưu tiên Cao, Trung bình, Thấp. Thấp giữ khoá một tài nguyên chung, cần thêm 3 đơn vị mới nhả. Cao tới ở 1 và cần khoá đó; Trung bình tới ở 2, chạy 4 đơn vị, không cần khoá.</p>
          <table class="t"><tr><th>thời điểm</th><th>0–1</th><th>1–2</th><th>2–6</th><th>6–7</th><th>7–8</th></tr>
          <tr><td>không kế thừa</td><td>Thấp</td><td>Thấp (Cao bị chặn)</td><td><b>Trung bình</b></td><td>Thấp nhả khoá</td><td>Cao</td></tr></table>
          <p>Cao chờ từ 1 tới 7, xong ở 8: đáp ứng $\hl{7}$ đơn vị — bị một tác vụ <b>không liên quan</b> chặn 4 đơn vị.</p>
        focus: [1, 1, 1, 2, 3, 3]
        say: "Xét ba tác vụ ưu tiên cao, trung bình và thấp. Tác vụ thấp đang giữ khoá một tài nguyên chung, cần thêm 3 đơn vị nữa mới nhả. Tác vụ cao tới ở thời điểm 1 và cần khoá đó, còn tác vụ trung bình tới ở thời điểm 2, chạy 4 đơn vị mà không cần khoá. Không có biện pháp gì, tác vụ trung bình chen vào chạy từ 2 tới 6, chặn luôn tác vụ thấp đang giữ khoá. Tác vụ cao chờ từ 1 tới 7, xong ở 8, thời gian đáp ứng là 7 đơn vị. Nó bị một tác vụ không liên quan chặn mất 4 đơn vị."
      - show: |
          <p><b>Kế thừa ưu tiên</b>: khi Cao chờ khoá của Thấp, Thấp tạm mang ưu tiên của Cao. Trung bình không chen vào được.</p>
          <table class="t"><tr><th>thời điểm</th><th>0–1</th><th>1–3</th><th>3–4</th><th>4–8</th></tr>
          <tr><td>có kế thừa</td><td>Thấp</td><td>Thấp (mang ưu tiên Cao)</td><td>Cao</td><td>Trung bình</td></tr></table>
          <p>Cao xong ở 4: đáp ứng $\hl{3}$ đơn vị. Pathfinder được sửa từ Trái Đất bằng cách bật đúng tuỳ chọn này.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Cách sửa là kế thừa ưu tiên, khi tác vụ cao chờ khoá của tác vụ thấp, tác vụ thấp tạm mang ưu tiên của tác vụ cao. Nhờ vậy tác vụ trung bình không chen vào được. Tác vụ thấp chạy từ 1 tới 3, nhả khoá, tác vụ cao chạy từ 3 tới 4. Thời gian đáp ứng của tác vụ cao chỉ còn 3 đơn vị. Tàu thăm dò năm đó được sửa từ Trái Đất bằng cách bật đúng tuỳ chọn này."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chọn hạn sớm nhất cho hệ có thể quá tải <b class="red">(rủi ro)</b>
          <br><span class="note">Quá tải ngắn (ví dụ một ngắt dồn dập) có thể làm trễ dây chuyền nhiều tác vụ. Cần cơ chế kiểm soát quá tải.</span></div>
        say: "Lỗi thứ nhất, chọn lập lịch theo hạn sớm nhất cho một hệ có thể bị quá tải. Chỉ một đợt quá tải ngắn, như ngắt dồn dập, cũng có thể làm trễ dây chuyền nhiều tác vụ, nên cần thêm cơ chế kiểm soát quá tải."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng khoá thường thay vì khoá có kế thừa ưu tiên <b class="red">(sai)</b>
          <br><span class="note">Hệ điều hành thời gian thực thường có tuỳ chọn này cho khoá loại trừ lẫn nhau — nhưng có thể mặc định tắt, như trên Pathfinder.</span></div>
        say: "Lỗi thứ hai, dùng khoá thường thay vì khoá có kế thừa ưu tiên. Hệ điều hành thời gian thực thường có tuỳ chọn này cho khoá loại trừ lẫn nhau, nhưng nó có thể mặc định bị tắt, như trên tàu thăm dò năm đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Giữ khoá lâu <b class="red">(sai)</b>
          <br><span class="note">Kế thừa ưu tiên rút ngắn chờ, nhưng Cao vẫn phải chờ hết đoạn giữ khoá. Đoạn giữ khoá phải ngắn và được tính vào thời gian bị chặn (bài 9).</span></div>
        say: "Lỗi thứ ba, giữ khoá lâu. Kế thừa ưu tiên rút ngắn thời gian chờ, nhưng tác vụ cao vẫn phải chờ hết đoạn giữ khoá. Đoạn đó phải ngắn, và phải được cộng vào thời gian bị chặn khi phân tích thời gian đáp ứng như bài trước."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(1 / 3 + 2 / 5 + 1 / 4 - 59 / 60) < 1e-12 and alg.schedule_sim([(1, 3), (2, 5), (1, 4)], 120, 'EDF')[1] == []"
      - "1 + 1 + 5 + 1 + 1 == 9 and 9 - 1 == 8"
      - "(20, 24, 15) == (60 // 3, 60 * 2 // 5, 60 // 4) and 20 + 24 + 15 == 59"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ba tác vụ (1, 3), (2, 5), (1, 4). Hạn sớm nhất có kịp hạn tất cả không?</td></tr>
          <tr><td>2</td><td>Ví dụ đảo ngược ưu tiên, nhưng Trung bình chạy 5 đơn vị. Không kế thừa: Cao xong ở thời điểm nào?</td></tr>
          <tr><td>3</td><td>Hệ có bộ phanh (2, 4) và đôi khi bị quá tải ngắn. Chọn hạn sớm nhất hay ưu tiên cố định?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ba tác vụ chạy 1 mỗi 3, chạy 2 mỗi 5, và chạy 1 mỗi 4, lập lịch theo hạn sớm nhất có kịp hạn tất cả không? Câu hai, trong ví dụ đảo ngược ưu tiên, nếu tác vụ trung bình chạy 5 đơn vị và không có kế thừa ưu tiên, tác vụ cao xong ở thời điểm nào? Câu ba, một hệ có bộ phanh chạy 2 mỗi 4 và đôi khi bị quá tải ngắn, nên chọn hạn sớm nhất hay ưu tiên cố định? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Mẫu chung 60: $U = \frac{20}{60} + \frac{24}{60} + \frac{15}{60} = \frac{59}{60} \le 1$ → $\hl{\text{kịp}}$ (với hạn sớm nhất, $U \le 1$ là đủ).</p>
        say: "Đáp án câu một, quy về mẫu chung 60, một phần ba là 20 phần 60, hai phần năm là 24 phần 60, một phần tư là 15 phần 60. Cộng lại được 59 phần 60, không vượt 1, mà với hạn sớm nhất thì điều đó là đủ, nên mọi tác vụ đều kịp hạn."
      - clear: true
        show: |
