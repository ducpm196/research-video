        focus: [1, 1, 2]
        say: "Câu hai, ta lập bảng theo thời gian, tác vụ thấp chạy từ 0 tới 2, vì tác vụ cao tới lúc 1 bị chặn ở khoá. Tác vụ trung bình chen vào chạy 5 đơn vị, từ 2 tới 7, rồi tác vụ thấp chạy nốt từ 7 tới 8 và nhả khoá. Tác vụ cao chạy từ 8 tới 9, xong ở thời điểm 9, thời gian đáp ứng là 9 trừ 1, bằng 8 đơn vị."
      - show: |
          <p>③ Theo phần quá tải: hạn sớm nhất làm trễ <b>cả ba</b> tác vụ, kể cả (2, 4); ưu tiên cố định chỉ làm trễ tác vụ chu kỳ dài nhất. Chọn $\hl{\text{ưu tiên cố định}}$, bộ phanh có chu kỳ ngắn nhất nên ưu tiên cao nhất.</p>
        say: "Câu ba là một quyết định, ở phần quá tải ta đã thấy hạn sớm nhất làm trễ cả ba tác vụ, kể cả tác vụ chạy 2 mỗi 4. Ngược lại, ưu tiên cố định chỉ làm trễ tác vụ có chu kỳ dài nhất. Vì vậy ta chọn ưu tiên cố định, và bộ phanh có chu kỳ ngắn nhất nên được ưu tiên cao nhất, quá tải do các tác vụ ưu tiên thấp hơn gây ra không chạm tới nó."

