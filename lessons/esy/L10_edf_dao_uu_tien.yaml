          <tr><td>10</td><td>B hạn 12</td><td>B, chạy 10–12, xong đúng hạn</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước bốn, làm tiếp từ 6 tới 12. Lúc 6, A còn 1 đơn vị với hạn 8, gần hơn hạn 12 của việc mới bên B, nên A chạy từ 6 tới 7. Lúc 7 chỉ còn B, B chạy từ 7 tới 8. Lúc 8, việc mới của A và việc dở của B cùng hạn 12, hạn bằng nhau thì bộ mô phỏng quy ước chọn A, nên A chạy từ 8 tới 10. Lúc 10, B chạy nốt 2 đơn vị và xong đúng hạn 12."
