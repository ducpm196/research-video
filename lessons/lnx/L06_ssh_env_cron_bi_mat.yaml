- id: hook
  kind: hook
  title: Vì sao mật khẩu trên dòng lệnh bị người khác xem lén?
  checks:
  - (60 // 5) * 24 == 288
  steps:
  - show: <div class='box key'><p>Khi bạn chạy <code>./db_sync --password=MatKhauVip123</code>, nhân Linux công
      khai nguyên dòng lệnh đó trong <code>/proc/&lt;pid&gt;/cmdline</code> cho mọi người dùng chạy lệnh <code>ps</code>
      nhìn thấy.</p><p>Tệ hơn, tệp lịch sử gõ lệnh tự động lưu lại nguyên văn chuỗi mật khẩu trên ổ đĩa cho tới
      khi tệp lịch sử bị xoá.</p></div>
    say: Chào bạn, nhiều kịch bản tự động trên máy chủ vẫn mắc một lỗ hổng cực kỳ phổ biến là kẹp thẳng mật khẩu
      cơ sở dữ liệu ngay trên tham số dòng lệnh. Bất kỳ tài khoản nào đang đăng nhập chung trên máy đều có thể gõ
      lệnh xem tiến trình để đọc trọn vẹn tham số đó theo thời gian thực. Hôm nay ta học cách quản lý cặp khoá bảo
      mật quyền sáu trăm, truyền bí mật an toàn qua biến môi trường và lập lịch tác vụ định kỳ đúng chuẩn.
    focus:
    - 0
    - '1.1'
    - '1.2'
