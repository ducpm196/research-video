      tiêu. Phân tách tệp cấu hình quyền đọc tối thiểu giúp ngăn chặn lộ bí mật kể cả khi tiến trình ứng dụng bị rò nhật ký.
      Đặt đường dẫn tuyệt đối trong lịch chạy tự động bảo đảm tác vụ tìm đúng trình thông dịch khi biến môi trường rút gọn.
- id: formula
  kind: formula
  title: Tính tần suất lịch cron 5 trường
  checks:
  - (60 // 5) * 24 == 288
  steps:
  - show: '<div class=''box key''><p>Năm trường của một dòng <code>cron</code> theo đúng thứ tự: <b>Phút</b> (0–59) | <b>Giờ</b>
      (0–23) | <b>Ngày</b> (1–31) | <b>Tháng</b> (1–12) | <b>Thứ</b> (0–6).</p><p>Ví dụ <code>*/5 * * * *</code>: 60 / 5 =
      <b>12</b> lần mỗi giờ; 12 × 24 = <b>288</b> lần mỗi ngày.</p></div>'
    say: Tính toán tần suất chạy của biểu thức năm trường rất chính xác theo đơn vị thời gian. Dấu sao chia năm ở cột phút
      đầu tiên nghĩa là cứ sau năm phút trong sáu mươi phút thì kích hoạt một lượt nên tổng mỗi giờ chạy đúng mười hai lần.
      Nhân với hai mươi bốn giờ một ngày ta có tổng cộng hai trăm tám mươi tám lần thực thi mỗi ngày. Đọc đúng năm cột thời
      gian lịch giúp bạn tính nhẩm chính xác số lượt thực thi trong một giờ hay trọn một tháng.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật: nạp tệp môi trường quyền 600 và che log'
  checks:
  - (60 // 5) * 24 == 288
  steps:
  - show: <table class='t'><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>chmod 600 secrets.env</code></td><td>Khoá
      tệp bí mật để chỉ đúng chủ sở hữu mới đọc được</td></tr><tr><td><code>ssh-keygen -t ed25519</code></td><td>Sinh cặp
      khoá mật mã hiện đại gồm tệp bí mật và tệp công khai <code>.pub</code></td></tr><tr><td><code>umask 077</code></td><td>Mặt
      nạ tự động gán quyền <code>600</code> cho tệp mới và <code>700</code> cho thư mục mới</td></tr><tr><td><code>cron</code>
      (<code>*/5 * * * *</code>)</td><td>Bộ lập lịch tác vụ nền chạy định kỳ trên Linux (<code>*/5</code> = mỗi 5 phút một
      lần)</td></tr></table>
    say: Giải mã hai bước thiết lập an toàn khi tạo khoá bí mật và đọc tệp môi trường không để lọt ra nhật ký. Sử dụng mặt
      nạ tạo tệp an toàn từ đầu ngăn khoảng trống thời gian tệp mới lỡ mang quyền mặc định rộng trước khi khoá lại.
    clear: true
  - show: '<p><b>Tạo tệp bí mật quyền 600, nạp vào biến môi trường và che khi in nhật ký</b></p><div class="code"><div>mkdir
      -p test_l06 &amp;&amp; cd test_l06</div><div>umask 077</div><div>printf ''DB_PASS=TopSecret_2026\n'' &gt; secrets.env</div><div>chmod
      600 secrets.env</div><div>set -a; source ./secrets.env; set +a</div><div>masked="***<span>&#36;</span>{DB_PASS: -4}"</div><div>hp=<span>&#36;</span>((
      <span>&#36;</span>{#DB_PASS} &gt; 0 ? 1 : 0 ))</div><div>echo "has_pass=<span>&#36;</span>hp masked=<span>&#36;</span>masked
      perm=<span>&#36;</span>(stat -c %a secrets.env)"</div></div>'
    say: Kịch bản tạo một tệp cấu hình chứa mã bí mật giả lập, đặt ngay quyền sáu trăm từ đầu rồi nạp vào biến môi trường
      nội bộ của tiến trình. Để tránh rò rỉ vào nhật ký, ta chỉ in ra dấu xác nhận có mặt biến cùng bốn ký tự cuối đã che.
      Thử nghiệm thực tế tạo tệp quyền sáu trăm, nạp vào môi trường nội bộ rồi che giấu giá trị nhạy cảm trước lúc xuất nhật
      ký.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>has_pass=1 masked=***2026 perm=600</div></div>
    say: Đầu ra chạy thật chứng minh quyền tệp được khoá đúng sáu trăm. Biến môi trường đã vào tới bộ nhớ tiến trình và thông
      báo in ra hoàn toàn sạch sẽ không lộ chuỗi mật khẩu. Dòng xuất giữ nguyên ba dấu hoa thị kèm bốn ký tự đuôi giúp kỹ
      sư đối chứng đúng khoá mà vẫn giữ bí mật phần ruột.
    clear: true
    focus:
    - 1
    - 1
    - 2
  - show: <div class='code'><div>ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519</div><div><span class='cm'># Sinh id_ed25519
      (quyền 600, giữ kín) &amp; id_ed25519.pub (khoá công khai gửi lên máy chủ)</span></div></div>
    say: Bước sinh cặp khoá dùng lệnh tạo khoá chuẩn xác tách riêng khoá bí mật quyền sáu trăm giữ ở máy mình và tệp đuôi
      chấm pub công khai mới gửi sang máy chủ.
- id: check
  kind: check
  title: Đối chứng số lượt chạy của lịch cron */5 * * * *
  checks:
  - (60 // 5) * 24 == 288
  steps:
  - show: <p><b>Tính độc lập số lần chạy trong 1 giờ và 1 ngày của lịch */5</b></p><div class="code"><div>per_h=<span>&#36;</span>((60
      / 5)); per_d=<span>&#36;</span>((per_h * 24)); echo "per_hour=<span>&#36;</span>per_h per_day=<span>&#36;</span>per_d"</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tính lại số lượt kích hoạt trong một giờ và hai mươi bốn giờ vì chu kỳ năm phút lặp
      đều suốt ngày. Nhờ cấu trúc lịch năm trường rõ ràng, ta kiểm soát tốt chu kỳ chạy và đường dẫn nhật ký của tác vụ nền.
      Phép chia sáu mươi cho chu kỳ phút tính ra tần suất giờ, nhân tiếp hai mươi bốn cho tần suất ngày rõ ràng.
    clear: true
    focus:
    - 1
    - 2
    - 2
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>per_hour=12 per_day=288</div></div>
    say: Đầu ra đối chứng khớp hoàn toàn với kết quả mười hai lần một giờ và hai trăm tám mươi tám lần một ngày vì sáu mươi
      chia năm nhân hai mươi bốn bằng đúng số đó. Phép tính chu kỳ theo phút và giờ đồng nhất với cấu hình lịch năm trường
      giúp bạn ước lượng chính xác tải hệ thống phát sinh từ các tác vụ chạy ngầm hằng ngày. Kết quả mười hai lần một giờ
      và hai trăm tám mươi tám lần một ngày khớp tuyệt đối giữa tính toán tay và dòng lệnh.
    clear: true
    focus:
    - 1
    - 2
    - 2
  - show: <div class='code'><div>*/5 * * * * /usr/local/bin/backup.sh &gt;&gt; /var/log/backup.log 2&gt;&amp;1</div></div>
    say: 'Kiểm tiếp mẫu ghi nhật ký cho tác vụ định kỳ: luôn dùng đường dẫn tuyệt đối kèm nối tiếp hai luồng một và hai vào
      tệp nhật ký riêng để không mất dấu vết lỗi.'
- id: quymo
  kind: example
  title: Dung lượng nhật ký và mức phơi nhiễm bí mật qua ba quy mô vận hành
  checks:
  - 288 * 30 == 8640
  steps:
  - show: <table class='t'><tr><th>chu kỳ cron</th><th>số lần chạy mỗi tháng (30 ngày)</th><th>nguy cơ nếu không chuyển hướng
      & luân chuyển log</th></tr><tr><td>Mỗi giờ (<span style='white-space:nowrap'>0 * * * *</span>)</td><td>720 lần</td><td>Nhỏ,
      dễ kiểm soát nhưng vẫn mất dấu nếu không ghi tệp</td></tr><tr><td>Mỗi 5 phút (<span style='white-space:nowrap'>*/5 *
      * * *</span>)</td><td>8 640 lần</td><td>Nếu lỗi lặp lại, hộp thư hệ thống đầy nghẽn báo lỗi</td></tr><tr><td>Mỗi phút
      (<span style='white-space:nowrap'>* * * * *</span>)</td><td>43 200 lần</td><td>Cả chục nghìn dòng tiến trình dồn nếu
      tác vụ chạy quá 60 giây</td></tr></table>
    say: Bảng quy mô giải thích tầm quan trọng của việc tính đúng nhịp chạy và gom nhật ký cho tác vụ định kỳ. Với chu kỳ
      năm phút một lần, trong ba mươi ngày máy chạy tới tám nghìn sáu trăm bốn mươi lượt. Nếu chuyển sang chạy mỗi phút một
      lần. Tổng số lên tới hơn bốn mươi ba nghìn lượt một tháng nên bắt buộc phải dùng cơ chế khoá chống chồng chéo và xoay
      vòng tệp nhật ký. Tác vụ chạy vài trăm lần mỗi ngày nếu không luân chuyển hay cắt bớt nhật ký sẽ âm thầm làm đầy ổ đĩa
      sau vài tháng.
