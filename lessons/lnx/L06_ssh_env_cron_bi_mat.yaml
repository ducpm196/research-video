  kind: symbol
  title: Giải mã ký hiệu và lệnh mới
  steps:
  - show: '<table class=''t''><tr><th>thành phần</th><th>vai trò bảo mật / lập lịch</th></tr><tr><td><code>id_ed25519</code>
      / <code>.pub</code></td><td>Khoá bí mật (giữ trên máy khách, quyền 600) và khoá công khai (chép lên máy chủ)</td></tr><tr><td><code>set
      -a; source .env</code></td><td>Nạp biến môi trường bí mật từ tệp hạn chế quyền thay vì dòng lệnh</td></tr><tr><td><code>*/5
      * * * * cmd</code></td><td>Biểu thức lịch 5 trường (phút | giờ | ngày | tháng | thứ): chạy mỗi 5 phút</td></tr></table>'
    say: Trên bảng là ba quy ước chuẩn cho đăng nhập không mật khẩu và tác vụ nền tự động. Cặp khoá đăng nhập luôn giữ phần
      bí mật tuyệt đối ở máy nguồn với quyền sáu trăm, còn phần công khai mới gửi sang máy chủ đích. Để truyền mã bí mật vào
      dịch vụ, ta nạp từ tệp môi trường được bảo vệ kỹ. Còn lịch chạy năm trường đọc lần lượt từ phút, giờ, ngày, tháng đến
      thứ trong tuần. Sử dụng cặp khoá mã hoá không đối xứng cho phép máy chủ xác thực danh tính mà khoá bí mật không bao
      giờ rời khỏi máy khách.
