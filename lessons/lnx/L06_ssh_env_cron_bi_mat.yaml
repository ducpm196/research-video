- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - (60 // 5) * 24 == 288
  steps:
  - show: <ol><li>Lịch <code>*/5 * * * *</code> chạy bao nhiêu lần trong trọn 1 ngày (24 giờ)?</li><li>Khi kết nối tự động
      tới cơ sở dữ liệu bằng kịch bản Bash, nên đọc mật khẩu từ tham số dòng lệnh hay từ tệp biến môi trường đặt quyền <code>600</code>?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, biểu thức lịch chạy năm phút một lần thực thi tổng cộng bao nhiêu lần trong suốt
      một ngày hai mươi bốn giờ? Câu hai, nên truyền mật khẩu bằng cờ dòng lệnh hay nạp từ tệp cấu hình có quyền sáu trăm?
      Bấm tạm dừng và trả lời ra giấy.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① 60 / 5 = 12 lần/giờ → 12 × 24 = <b>288 lần/ngày</b>.</p></td></tr></table>
    say: 'Đáp án câu một: mỗi giờ chạy mười hai lần nên nhân hai mươi bốn giờ cho tổng cộng hai trăm tám mươi tám lượt chạy
      mỗi ngày. Thiết lập quyền chặt ngay từ bước tạo tệp ngăn chặn hoàn toàn khả năng tiến trình hoặc tài khoản khác trên
      cùng máy chủ đọc trộm khoá bí mật. Tính trước tổng lượt kích hoạt hằng ngày giúp ước lượng được lượng nhật ký sinh ra
      và tải cơ sở dữ liệu theo định kỳ.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Nạp từ <b>tệp biến môi trường quyền <code>600</code></b>
      (không bao giờ kẹp mật khẩu lên tham số dòng lệnh).</p></td></tr></table>
    say: 'Đáp án câu hai: luôn nạp từ tệp biến môi trường đặt quyền sáu trăm để tuyệt đối không làm lộ mật khẩu ra danh sách
      tiến trình. Nhớ che phần đầu mật khẩu khi ghi nhật ký kiểm toán và đặt đường dẫn chuyển hướng đầy đủ cho mọi tác vụ
      chạy tự động theo lịch. Kết hợp nạp từ tệp quyền sáu trăm với cơ chế che giá trị khi in nhật ký bảo vệ bí mật xuyên
      suốt cả vòng đời tiến trình.'
    clear: true
