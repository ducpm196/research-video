      lệnh khiến mọi tiến trình đều nhìn thấy qua danh sách tiến trình và tệp lịch sử gõ phím. Con đường phía dưới khoá chặt
      dữ liệu trong tệp quyền sáu trăm rồi đọc kín vào bộ nhớ tiến trình đang chạy. Từ nhật ký lịch sử dòng lệnh tới báo cáo
