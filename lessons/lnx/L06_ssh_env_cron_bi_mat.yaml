    say: Nhìn sơ đồ so sánh hai con đường đưa mật khẩu vào chương trình. Con đường phía trên gõ thẳng bí mật lên
      tham số dòng lệnh khiến mọi tiến trình đều nhìn thấy qua danh sách tiến trình và tệp lịch sử gõ phím. Con
      đường phía dưới khoá chặt dữ liệu trong tệp quyền sáu trăm rồi đọc kín vào bộ nhớ tiến trình đang chạy.
