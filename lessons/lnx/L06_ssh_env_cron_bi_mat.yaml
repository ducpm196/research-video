      * * * * cmd</code></td><td>Biểu thức lịch 5 trường (phút | giờ | ngày | tháng | thứ): chạy mỗi 5 phút</td></tr></table>'
    say: Trên bảng là ba quy ước chuẩn cho đăng nhập không mật khẩu và tác vụ nền tự động. Cặp khoá đăng nhập luôn
