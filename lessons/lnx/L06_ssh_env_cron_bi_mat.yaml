- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1:
      Truyền mật khẩu qua cờ dòng lệnh <code>--token=...</code>.</b> Mọi tiến trình dùng lệnh <code>ps</code> hoặc nhật ký
      kiểm toán shell đều ghi nguyên văn mật khẩu.<br><b>Lỗi 2: Đặt lệnh <code>echo "Connecting $DB_PASS"</code> trong kịch
      bản gỡ lỗi rồi quên xoá.</b> Bí mật tràn vào hệ thống thu thập log tập trung.<br><b>Lỗi 3: Chạy tác vụ <code>cron</code>
      dùng đường dẫn tương đối và thiếu chuyển hướng <code>&gt;&gt; log 2&gt;&amp;1</code>.</b> Môi trường chạy lịch định
      kỳ rất tối giản nên lệnh thường thất bại im lặng.</div></td></tr></table>'
    say: Hãy khắc cốt ghi tâm ba sai lầm bảo mật hay gặp nhất khi viết kịch bản vận hành. Một là truyền mật khẩu trực tiếp
      trên tham số dòng lệnh khiến bất kỳ ai gõ lệnh xem tiến trình đều nhìn thấy. Hai là vô tình in giá trị biến bí mật ra
      nhật ký hoặc đưa nhầm tệp môi trường vào kho mã nguồn. Ba là đặt lịch chạy nền mà quên dùng đường dẫn tuyệt đối và chuyển
      hướng đầy đủ cả hai luồng. Lịch chạy định kỳ sử dụng môi trường tối giản khác hẳn môi trường người dùng nên luôn ghi
      đủ đường dẫn tuyệt đối tới tệp thực thi. Không bao giờ đưa tệp chứa khoá hay thông số bí mật vào kho lưu trữ mã nguồn
      dùng chung dù là kho riêng tư nội bộ.
