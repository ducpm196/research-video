- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>127.0.0.1 (nội bộ)</span><span class='a'>≠</span><span class='n'>0.0.0.0 (mọi
      giao diện)</span><span class='a'>|</span><span class='n'>/etc/hosts → DNS</span></div>
