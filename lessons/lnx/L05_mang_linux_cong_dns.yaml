    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L05 khi chạy đúng logic trên chuẩn vào. Ngoài
      kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp
      tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình
      chấm tự động. Xác minh kết quả in ra đủ ba dòng khoá mô tả chính xác vòng lặp nội bộ, giao diện mở rộng và cờ ưu tiên
      phân giải. Nhờ hàm socket của Python, kịch bản kiểm tra cả gắn cổng nội bộ lẫn mọi giao diện.
