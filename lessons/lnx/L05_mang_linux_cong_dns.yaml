    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn
      hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các
