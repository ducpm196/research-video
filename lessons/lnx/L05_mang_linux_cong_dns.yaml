      chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết
      quả tĩnh. Hãy bấm tạm dừng, chạy thử trên Git Bash hoặc dòng lệnh Linux và hoàn thành trước khi đối chiếu đầu ra mẫu.
      Cài đặt kiểm tra ghép nối địa chỉ vòng lặp, toàn bộ giao diện và thứ tự tra cứu ưu tiên dựa trên dữ liệu đầu vào động.
      So sánh trạng thái cổng nghe trên vòng lặp và mọi giao diện làm rõ ranh giới bảo mật khi triển khai. Kịch bản vỏ Bash
      sẽ gọi ngắn Python để mở ổ cắm TCP động và kiểm tra tệp nsswitch.
