  title: Gọi localhost trong container 200 OK, bên ngoài lỗi?
  checks:
  - 127 == 128 - 1
  steps:
  - show: '<div class=''box key''><p>Bạn khởi chạy dịch vụ web trên cổng <code>8080</code> rồi cấu hình chuyển cổng container,
      nhưng trình duyệt ngoài cứ báo <b>connection refused</b>.</p><p>Thủ phạm kinh điển: máy chủ bên trong chỉ lắng nghe
      trên giao diện vòng lặp nội bộ <code>127.0.0.1</code> thay vì <code>0.0.0.0</code>.</p></div>'
    say: Chào bạn, lỗi từ chối kết nối dù máy chủ bên trong vẫn báo chạy xanh mượt là tình huống khiến hàng loạt người mới
      bối rối khi đóng gói ứng dụng. Khi bạn kiểm tra ngay bên trong máy ảo hoặc công-tai-nơ thì phản hồi vẫn đạt hai trăm
      bình thường, nhưng hễ gọi từ bên ngoài qua cổng chuyển tiếp là bị cắt ngay. Hôm nay ta học cách phân biệt hai địa chỉ
      lắng nghe cốt lõi, thứ tự phân giải tên miền và cách dùng công cụ dòng lệnh chẩn đoán mạng Li-núc. Khoảng cách giữa
      chạy được trên máy cá nhân và mở được kết nối trong công-tai-nơ nằm gọn ở ba chữ số không chấm không. Hiểu ranh giới
      các giao diện mạng ảo giúp bạn xử lý lỗi từ chối kết nối chỉ trong vài giây kiểm tra.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
