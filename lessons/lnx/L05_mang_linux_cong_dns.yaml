  steps:
  - show: '<table class=''t''><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>grep -E ''^[^#]*(127\.0\.0\.1)''
      /etc/hosts</code></td><td>Lọc bỏ dòng ghi chú dấu thăng để đọc ánh xạ cục bộ thật</td></tr><tr><td><code>ip -4 -o addr
      show</code></td><td>Liệt kê gọn mỗi giao diện mạng trên một dòng kèm địa chỉ IPv4</td></tr><tr><td><code>curl -f</code>
      / <code>nc -w 2</code></td><td>Kiểm tra nối cổng TCP và thất bại ngay nếu HTTP trả lỗi 4xx/5xx</td></tr><tr><td><code>nsswitch</code></td><td>Thứ
      tự phân giải tên trong <code>/etc/nsswitch.conf</code>: dòng <code>hosts:</code> đặt <code>files</code> trước <code>dns</code></td></tr><tr><td><code>python -c</code>
      + <code>socket</code></td><td>Mở nhanh ổ cắm TCP qua <code>socket.bind((host, 0))</code> để kiểm gắn địa chỉ trên mọi máy (kể cả Windows)</td></tr></table>'
    say: Giải thích hai lệnh chẩn đoán tệp ánh xạ cục bộ và liệt kê địa chỉ từng giao diện mạng dùng trong thử nghiệm thật.
      Lọc sạch các dòng ghi chú khỏi tệp ánh xạ cục bộ giúp quan sát rõ những tên miền nào đang được neo thẳng về địa chỉ
      máy.
    clear: true
  - show: '<p><b>Thử thật trong Docker Alpine: xác nhận địa chỉ loopback, giao diện mạng và /etc/hosts</b></p><div class="code"><div>MSYS_NO_PATHCONV=1
      docker run --rm postgres:17-alpine sh -c ''</div><div>  grep -E "localhost|127\.0\.0\.1" /etc/hosts | head -n 1</div><div>  ip
      -4 -o addr show | awk "{print \<span>&#36;</span>2,\<span>&#36;</span>4}" | tr "\n" " "</div><div>  echo ""</div><div>''</div></div>'
    say: Ta chạy trực tiếp một công-tai-nơ Li-núc thật để lọc dòng ánh xạ cục bộ và liệt kê địa chỉ mạng trên từng giao diện.
      Kiểm nghiệm đồng thời địa chỉ vòng lặp và cầu nối mạng bên trong công-tai-nơ thực giúp hình dung cụ thể cấu trúc mạng
      ảo.
    clear: true
    focus:
    - 1
    - 2
  - show: "<p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class=\"code\"><div>127.0.0.1\tlocalhost</div><div>lo\
      \ 127.0.0.1/8 eth0 172.17.0.4/16 </div></div>"
    say: Đầu ra thật cho thấy tệp ánh xạ cục bộ trỏ tên máy nội bộ về một hai bảy chấm không chấm không chấm một. Đồng thời
      giao diện mạng cầu nối đã sẵn sàng đón kết nối từ bên ngoài. Hai dòng đầu ra tách biệt chỉ số địa chỉ của vòng lặp nội
      bộ và địa chỉ cấp riêng cho giao diện cầu nối kết nối ngoài.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<table class=''t''><tr><th>chỉ định lắng nghe</th><th>phạm vi nhận kết nối</th><th>bản đồ <code>nsswitch</code>
      + <code>hosts</code></th></tr><tr><td><code>127.0.0.1</code> (loopback)</td><td class=''red''>chỉ nội bộ cùng máy/container</td><td
      rowspan=''2''>Kiểm <code>hosts: files dns</code> trong <code>/etc/nsswitch.conf</code> trước tiên rồi mới tra <code>/etc/hosts</code>
      và DNS</td></tr><tr><td><code>0.0.0.0</code> (mọi giao diện)</td><td class=''green''>nhận cả cầu nối từ bên ngoài</td></tr></table>'
    say: 'Đối chiếu hai mốc ngay trong ví dụ: gắn trên một hai bảy chấm không chỉ mở vòng lặp nội bộ nên lưu lượng cầu nối
      ngoài bị từ chối. Còn không chấm không đón mọi giao diện; đồng thời hệ thống tra cấu hình nsswitch theo thứ tự tệp cục
      bộ rồi mới tới DNS.'
- id: check
  kind: check
  title: Đối chứng phản hồi HTTP 200 OK qua ổ cắm TCP thật
  checks:
  - len('HTTP/1.1 200 OK'.split()) == 3
  steps:
  - show: '<p><b>Mở cổng cục bộ thật và kiểm tra bắt tay TCP trả về HTTP 200 OK</b></p><div class="code"><div>MSYS_NO_PATHCONV=1
      docker run --rm postgres:17-alpine sh -c ''</div><div>  (printf "HTTP/1.1 200 OK\r\n\r\nOK" | nc -l -p 18080 &gt;/dev/null
      2&gt;&amp;1) &amp;</div><div>  sleep 0.2; req="GET / HTTP/1.1\r\nHost: localhost\r\n\r\n"</div><div>  resp=<span>&#36;</span>(printf
      "<span>&#36;</span>req" | nc -w 2 127.0.0.1 18080 | head -n 1 | tr -d "\r")</div><div>  echo "local=<span>&#36;</span>resp"</div><div>''</div></div>'
    say: Ở đường kiểm chứng thứ hai, ta tự dựng nhanh một ổ cắm TCP lắng nghe cục bộ rồi nối tới vì cần xác nhận phản hồi
      chuẩn hai trăm thành công. Thử nghiệm mở một ổ cắm lắng nghe thật rồi kiểm bằng máy khách minh chứng chuỗi bắt tay hai
      chiều thông suốt. Dấu và đặt cuối lệnh mở máy chủ lắng nghe tạm ở nền rồi công cụ kiểm nối cổng chờ tối đa hai giây
      đọc dòng phản hồi đầu.
    clear: true
    focus:
    - 1
    - 2
    - 2
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>local=HTTP/1.1 200 OK</div></div>
    say: Đầu ra đối chứng trả về đúng dòng tiêu đề hai trăm thành công vì kênh nội bộ chấp nhận kết nối ngay khi máy khách
      bắt tay đúng cổng đang mở. Kết quả phản hồi thành công qua giao thức chuẩn xác nhận kênh kết nối nội bộ đã thông suốt
      trước khi bạn mở rộng ánh xạ cổng ra bên ngoài. Mã phản hồi hai trăm thành công xác nhận cả lớp truyền vận mạng lẫn
      lớp giao thức ứng dụng đều hoạt động đúng cổng.
    clear: true
    focus:
    - 1
    - 2
    - 2
  - show: '<p><b>Kiểm thử nhanh từ Bash: mở socket gắn địa chỉ và kiểm thứ tự <code>nsswitch</code></b></p><div class="code"><div>python
      -c "import socket; s=socket.socket(); s.bind((''0.0.0.0'', 0)); print(s.getsockname()[0]); s.close()"</div><div>#
      0.0.0.0  (và đọc /etc/nsswitch.conf tìm dòng hosts: có files trước dns)</div></div>'
    say: Từ vỏ Bash ta gọi lệnh Python một dòng tạo ổ cắm TCP gắn địa chỉ với cổng không để nhận cổng rảnh. Sau đó ta đọc
      tệp cấu hình để kiểm tra thứ tự ưu tiên phân giải tên miền cục bộ trước DNS.
    clear: true
    focus:
    - 1
    - 2
- id: quymo
  kind: example
  title: Thời gian tra cứu mạng và chi phí lỗi cấu hình qua ba quy mô cụm
  checks:
  - 1000 * 1 == 1000
  steps:
  - show: <table class='t'><tr><th>tình huống kết nối</th><th>độ trễ tra cứu / phản hồi</th><th>ảnh hưởng trên 1 000 yêu cầu/giây</th></tr><tr><td>Khớp
      qua /etc/hosts cục bộ</td><td>Dưới 0,05 mili-giây (đọc RAM)</td><td>Không tạo tải lên máy chủ DNS</td></tr><tr><td>Hỏi
      máy chủ DNS nội bộ</td><td>~1–3 mili-giây</td><td>Tốn thêm hàng nghìn gói UDP nhỏ mỗi giây</td></tr><tr><td>Nghe nhầm
      127.0.0.1 sau cân bằng tải</td><td>Từ chối ngay 100% yêu cầu</td><td>100% khách hàng báo lỗi sập dịch vụ</td></tr></table>
    say: Bảng quy mô giải thích vì sao sai một địa chỉ lắng nghe có thể làm cả hệ thống đứng hình dù tiến trình vẫn xanh.
      Tra cứu qua tệp ánh xạ cục bộ chỉ mất vài phần trăm mi-li-giây ngay trên bộ nhớ. Ngược lại nếu dịch vụ lỡ nghe trên
      vòng lặp nội bộ, toàn bộ lưu lượng bên ngoài bị từ chối tức thì. Với lưu lượng một nghìn yêu cầu mỗi giây, toàn bộ cảnh
      báo đỏ sẽ bùng phát trong tích tắc. Lệch chỉ vài mi-li-giây độ trễ tra cứu tên miền khi nhân với hàng nghìn lượt gọi
      mỗi giây làm phình lớn độ trễ đáp ứng.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1:
      Khởi chạy máy chủ web nghe trên <code>127.0.0.1</code> bên trong container.</b> Mọi lưu lượng đi qua cổng ánh xạ của
      công-tai-nơ đều bị từ chối.<br><b>Lỗi 2: Dùng công cụ <code>curl</code> thiếu cờ <code>-f</code> trong kịch bản tự động.</b>
      Lệnh vẫn trả mã thoát 0 dù máy chủ trả lỗi 500 hoặc 404.<br><b>Lỗi 3: Chỉnh sửa nhầm hoặc bỏ sót dòng cũ trong
      <code>/etc/hosts</code> làm đè sai tên miền nội bộ.</b> Hệ thống trỏ sang máy cũ mà không hề gọi DNS.</div></td></tr></table>'
    say: Hãy phòng tránh ba lỗi kinh điển khi làm việc với mạng Li-núc. Lỗi đầu tiên là gắn cổng ứng dụng vào địa chỉ vòng
      lặp nội bộ trong công-tai-nơ khiến kết nối từ ngoài vào bị từ chối thẳng. Lỗi thứ hai là quên cờ báo thất bại trên công
      cụ gọi mạng khiến kịch bản tưởng thành công khi nhận lỗi năm trăm. Lỗi thứ ba là để sót dòng ánh xạ cũ trong tệp máy
      chủ cục bộ che khuất phân giải tên miền thật. Cẩn thận phân biệt lỗi từ chối kết nối ngay tức thì vì cổng đóng với lỗi
      treo chờ hết giờ do tường lửa âm thầm vứt gói tin. Kiểm tra danh sách cổng đang nghe ngay bên trong công-tai-nơ để biết
      tiến trình thực sự gắn địa chỉ nào trước khi sửa quy tắc cổng.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - 0
    - 0
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - '''0.0.0.0''.count(''.'') == 3'
  steps:
  - show: <ol><li>Dịch vụ trong công-tai-nơ đang nghe tại <code>127.0.0.1:8080</code>. Khi gọi từ ngoài vào, cần sửa thành
      địa chỉ nào?</li><li>Giữa tệp <code>/etc/hosts</code> và máy chủ DNS từ xa, hệ thống hỏi nguồn nào trước?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, nếu dịch vụ đang lắng nghe trên một hai bảy chấm không chấm không chấm một mà
      bị từ chối từ bên ngoài, bạn phải sửa thành địa chỉ nào? Câu hai, hệ thống ưu tiên hỏi tệp bản đồ máy chủ cục bộ hay
      máy chủ tên miền trước tiên? Bấm tạm dừng và trả lời. Hai câu hỏi thực chiến giúp bạn rà soát nhanh thứ tự phân giải
      tên và phạm vi mở cổng mạng.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Phải sửa thành <b><code>0.0.0.0:8080</code></b> để mở
      lắng nghe trên mọi giao diện mạng của container.</p></td></tr></table>
    say: 'Đáp án câu một: cần đổi sang địa chỉ không chấm không chấm không chấm không để đón kết nối qua giao diện mạng công-tai-nơ.
      Chọn đúng địa chỉ lắng nghe mọi giao diện hay chỉ nội bộ giúp vừa bảo mật cổng quản trị vừa mở đúng lưu lượng cho dịch
      vụ chạy trong container. Mở nghe trên tất cả giao diện mạng kèm kiểm soát tường lửa ở ngoài là cấu hình chuẩn mực cho
      các dịch vụ đóng gói.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Kiểm tra tệp <b><code>/etc/hosts</code></b> trước, không
      thấy tên đó mới hỏi tới máy chủ DNS.</p></td></tr></table>
    say: 'Đáp án câu hai: tệp ánh xạ cục bộ luôn được tra cứu trước, chỉ khi không khớp mới gửi câu hỏi ra máy chủ tên miền.
      Hiểu thứ tự ưu tiên phân giải tên miền giúp bạn chẩn đoán nhanh lỗi gọi nhầm địa chỉ trong mạng nội bộ trước khi hỏi
      máy chủ DNS ngoài. Lợi dụng ưu tiên tra cứu tệp cục bộ cho phép kỹ sư kiểm thử tên miền giả lập an toàn trước khi cập
      nhật bản ghi thật.'
    clear: true
