- id: formula
  kind: formula
  title: Thứ tự phân giải tên miền và luật kiểm tra cổng
  checks:
  - 8080 > 1024
  steps:
  - show: <div class='box key'><p><b>Chuỗi tra cứu chuẩn trên Linux (nsswitch):</b> hệ thống cấu hình thứ tự tra tên tại tệp
      <code>/etc/nsswitch.conf</code> — Bước 1 đọc <code>/etc/hosts</code>; chỉ khi không khớp mới gửi truy vấn tới máy chủ
      DNS ghi trong <code>/etc/resolv.conf</code>.</p><p><b>Công thức tính tổng cổng mở khi kiểm tra:</b> 1 dịch vụ nghe <code>127.0.0.1:8080</code>
      chỉ đạt <b>1/2</b> (nội bộ OK, ngoài lỗi); nghe <code>0.0.0.0:8080</code> đạt <b>2/2</b> (cả trong lẫn ngoài OK).</p></div>
    say: Thứ tự tra cứu tên miền mặc định luôn ưu tiên bảng ánh xạ cục bộ trước rồi mới ra máy chủ tên miền bên ngoài. Nhờ
      quy tắc này mà các dịch vụ cùng cụm có thể tìm thấy nhau ngay trong mạng nội bộ. Đồng thời khi kiểm tra cổng, bạn phải
      xác nhận lắng nghe ở địa chỉ tất cả giao diện vì lắng nghe nội bộ chỉ thông một chiều bên trong. Chú ý thứ tự ưu tiên
      phân giải tên miền giải thích vì sao cấu hình cục bộ luôn có quyền ghi đè kết quả máy chủ tên miền.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
