  checks:
  - 64 * 1024 * 1024 == 67108864
  steps:
  - show: '<table class=''t''><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>--memory=64m</code></td><td>Đặt
      trần bộ nhớ cứng bằng cgroups; vượt ngưỡng sẽ kích hoạt OOMKill (137)</td></tr><tr><td><code>ps -o pid,comm</code></td><td>Xem
      danh sách tiến trình bên trong không gian tên PID riêng của container</td></tr><tr><td><code>OOMKill (137)</code></td><td>Nhân
      ngắt ngay container dùng vượt trần RAM <code>cgroups</code> (128 + SIGKILL 9 = 137)</td></tr><tr><td><code>MB</code>
      vs <code>MiB</code></td><td><code>1 MB = 10⁶ B</code> (ổ đĩa); <code>1 MiB = 2²⁰ B</code> (RAM/cgroups: 64 MiB = 67
      108 864 B)</td></tr></table>'
    say: Giải thích trước hai tuỳ chọn kiểm chứng cơ chế cô lập và thông số giới hạn trên công-tai-nơ Đốc-cơ thật. Thiết lập
      cờ trần bộ nhớ cứng bảo vệ các công-tai-nơ hàng xóm không bị một tiến trình lỗi ăn cạn tài nguyên kéo sập theo.
    clear: true
  - show: <p><b>Chạy thật một container với trần --memory=64m và soi PID 1 bên trong</b></p><div class="code"><div>MSYS_NO_PATHCONV=1
      docker run --rm --memory=64m postgres:17-alpine sh -c '</div><div>  echo "pid_1=<span>&#36;</span>(ps -o pid,comm |
      awk "NR==2{print \<span>&#36;</span>1,\<span>&#36;</span>2}")"</div><div>  cat /sys/fs/cgroup/memory.max 2&gt;/dev/null
      || \</div><div>    cat /sys/fs/cgroup/memory/memory.limit_in_bytes</div><div>'</div></div>
    say: Ta chạy thật một công-tai-nơ Đốc-cơ với mức trần bộ nhớ sáu mươi bốn mê-ga-bai qua nhóm kiểm soát rồi liệt kê bảng
      tiến trình bên trong. Vì không gian tên tiến trình đã cô lập góc nhìn nên lệnh bên trong chỉ nhìn thấy đúng hai tiến
      trình của riêng mình. Kiểm chứng bên trong một công-tai-nơ Đốc-cơ chạy với trần sáu mươi bốn mê-ga-bai xác nhận bảng
      tiến trình độc lập.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>pid_1=1 sh</div><div>67108864</div></div>
    say: Đầu ra chạy thật từ Đốc-cơ xác nhận tiến trình vỏ bên trong tự mang số hiệu một và thông số giới hạn sáu mươi bốn
      mê-ga-bai đã được ghi nhận ngay ở tầng điều khiển nhân. Vỏ lệnh giữ số hiệu tiến trình một chứng tỏ không gian tên đã
      cô lập hoàn toàn khỏi hàng trăm tiến trình trên máy chủ.
    clear: true
    focus:
    - 1
    - 2
- id: check
  kind: check
  title: Đối chứng tính lại dung lượng dùng chung và ngưỡng 64 MiB
  checks:
  - alg.lnx_image_total(120, [5], 10) == 170
  steps:
  - show: <p><b>Đối chiếu số liệu 170 MB tầng dùng chung vs 1 200 MB sao chép toàn phần</b></p><div class="code"><div>base=120;
      n=10; rw=5; echo "shared_mb=<span>&#36;</span>((base + n * rw)) full_copy_mb=<span>&#36;</span>((n * base))"</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tính lại mức tiết kiệm dung lượng trên mười công-tai-nơ dùng chung ảnh một trăm hai
      mươi mê-ga-bai vì cần đối chiếu ngưỡng vừa đo. Khi vượt ngưỡng sáu mươi bốn mê-ga-bai, nhân hệ điều hành kích hoạt ngắt
      hết bộ nhớ với mã thoát một trăm ba mươi bảy. Đối chiếu giữa một trăm bảy mươi mê-ga-bai dùng chung với một nghìn hai
      trăm mê-ga-bai bản sao rời cho thấy hiệu quả vượt trội.
    clear: true
    focus:
    - 1
    - 2
    - 2
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>shared_mb=170 full_copy_mb=1200</div></div>
    say: Kết quả khớp hoàn toàn một trăm bảy mươi mê-ga-bai dùng chung so với một nghìn hai trăm mê-ga-bai bản sao rời vì
      chỉ tầng ghi năm mê-ga-bai nhân lên mười lần. So sánh hai con số dung lượng cho thấy sức mạnh thật sự của mô hình chia
      sẻ lớp ảnh nền trong việc tiết kiệm hàng gi-ga-bai khi chạy đồng thời nhiều dịch vụ. Khoản tiết kiệm gấp bảy lần dung
      lượng đĩa và khởi động dưới một giây tạo nên cuộc cách mạng triển khai phần mềm.
    clear: true
    focus:
    - 1
    - 2
    - 2
  - show: <div class='code'><div><span class='cm'># Vượt trần --memory=64m -&gt; nhân gửi SIGKILL (tín hiệu 9)</span></div><div>echo
      "oom_exit=$((128 + 9))"   <span class='cm'># 137</span></div></div>
    say: 'Kiểm luôn mã thoát khi vượt trần bộ nhớ: nhân Linux gửi tín hiệu giết số chín nên mã thoát chuẩn đúng bằng một trăm
      hai mươi tám cộng chín ra một trăm ba mươi bảy.'
- id: quymo
  kind: example
  title: Chi phí đĩa của Container dùng chung tầng qua 3 quy mô
  checks:
  - 120 + 100 * 5 == 620
  steps:
  - show: <table class='t'><tr><th>số bản chạy từ ảnh gốc 120 MB (ghi riêng 5 MB)</th><th>sao chép tách rời (kiểu máy ảo nhỏ)</th><th>cô
      lập container dùng chung tầng ảnh</th></tr><tr><td>1 bản</td><td>125 MB (120 gốc + 5 ghi)</td><td>125 MB (khởi chạy
      dưới 0,3 giây)</td></tr><tr><td>10 bản</td><td>1 200 MB phần ảnh gốc</td><td>170 MB (tiết kiệm 85,8% đĩa phần gốc)</td></tr><tr><td>100
      bản trên cùng máy</td><td>12 000 MB (12 GB) gốc</td><td>620 MB (tiết kiệm 94,8% đĩa phần gốc)</td></tr></table>
    say: Bảng quy mô giải thích vì sao một máy chủ đơn lẻ dễ dàng chạy hàng trăm công-tai-nơ song song. Khi tăng lên mười
      bản, công-tai-nơ tiết kiệm hơn tám mươi lăm phần trăm dung lượng lưu trữ. Ở quy mô một trăm bản chạy cùng lúc, kiến
      trúc dùng chung tầng ảnh chỉ tốn sáu trăm hai mươi mê-ga-bai thay vì ngốn mười hai gi-ga-bai ổ đĩa. Khi mật độ triển
      khai tăng lên năm mươi hay một trăm bản trên cùng máy chủ, cơ chế tầng dùng chung tỏa sáng rực rỡ nhất.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1:
      Nghĩ container có nhân hệ điều hành riêng biệt hoàn toàn.</b> Mọi container chia sẻ cùng một nhân Linux với máy chủ;
      khác với máy ảo chạy nhân riêng.<br><b>Lỗi 2: Không đặt trần bộ nhớ bằng cgroups cho dịch vụ mới.</b> Một dịch vụ rò
      rỉ bộ nhớ sẽ ăn sạch RAM máy chủ làm sập các dịch vụ hàng xóm.<br><b>Lỗi 3: Thấy mã thoát 137 liền đổ lỗi mạng rồi tăng
      số thử lại.</b> Mã 137 trên container thường báo hiệu vừa bị nhân ngắt vì chạm trần RAM.</div></td></tr></table>'
    say: Hãy nhớ ba ngộ nhận nguy hiểm khi bước vào thế giới công-tai-nơ. Đầu tiên đừng nhầm công-tai-nơ như máy ảo có nhân
      riêng vì chúng dùng chung một nhân Li-núc máy chủ. Thứ hai đừng thả lỏng giới hạn bộ nhớ nhóm kiểm soát kẻo một tiến
      trình lỗi kéo sập toàn máy. Thứ ba mỗi khi thấy mã thoát một ba bảy, hãy kiểm tra ngay biểu đồ bộ nhớ trước tiên. Đặt
      giới hạn bộ nhớ phù hợp giúp một dịch vụ gặp lỗi không làm ảnh hưởng toàn máy chủ. Thiếu cấu hình giới hạn bộ nhớ cho
      công-tai-nơ sản xuất cho phép một lỗi rò rỉ làm treo đơ toàn bộ máy chủ vật lý chung. Cũng đừng quên tệp tạo mới bên
      trong tầng ghi mỏng sẽ bốc hơi ngay khi bạn chạy lệnh xoá công-tai-nơ.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - alg.lnx_image_total(120, [5], 10) == 170
  steps:
  - show: <ol><li>Giữa <code>namespaces</code> và <code>cgroups</code>, cơ chế nào giới hạn một công-tai-nơ tối đa chỉ được
      dùng 512 MB RAM?</li><li>Ảnh gốc rộng 120 MB, chạy 10 công-tai-nơ mỗi bản ghi thêm 5 MB. Tổng dung lượng đĩa thực chiếm
      bằng bao nhiêu?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, cơ chế nào trong hai cơ chế của nhân chịu trách nhiệm đặt trần giới hạn bộ nhớ
      năm trăm mười hai mê-ga-bai? Câu hai, chạy mười công-tai-nơ từ ảnh gốc một trăm hai mươi mê-ga-bai với phần ghi riêng
      năm mê-ga-bai thì tổng tốn bao nhiêu? Bấm tạm dừng và trả lời. Hãy tự tính nhẩm lại phần dung lượng tiết kiệm khi chia
      sẻ tầng ảnh và mã thoát tràn bộ nhớ.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <b><code>cgroups</code></b> (nhóm kiểm soát tài nguyên
      RAM/CPU; còn <code>namespaces</code> chỉ cô lập góc nhìn).</p></td></tr></table>
    say: 'Đáp án câu một: đó là nhóm kiểm soát chuyên trách đóng trần tài nguyên bộ nhớ và bộ xử lý cho nhóm tiến trình. Việc
      dùng chung lớp ảnh gốc chỉ đọc kết hợp tầng ghi mỏng giúp bật hàng chục dịch vụ trên cùng một máy chủ mà vẫn tiết kiệm
      tối đa ổ cứng. Nhóm kiểm soát đóng vai trò người gác cổng tài nguyên phần cứng trong khi không gian tên vẽ ra bức tường
      ngăn tầm nhìn.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <code>120 + 10 × 5 = <b>170 MB</b></code>.</p></td></tr></table>
    say: 'Đáp án câu hai: lấy ảnh gốc một trăm hai mươi cộng mười nhân năm bằng tổng cộng một trăm bảy mươi mê-ga-bai. Phân
      tích mã thoát một trăm ba mươi bảy cho phép phát hiện chính xác lỗi tràn giới hạn bộ nhớ để điều chỉnh trần RAM kịp
      thời. Tính toán chi phí cộng gộp phần nền dùng chung giúp hoạch định dung lượng ổ đĩa chính xác cho cả cụm máy chủ Đốc-cơ.'
    clear: true
