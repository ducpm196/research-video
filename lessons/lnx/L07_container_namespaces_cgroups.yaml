      font-size="15" text-anchor="middle" fill="#475569">Không nhân bản 120 MB hay nhân HĐH riêng cho từng bản</text></svg></div>'
    say: Nhìn sơ đồ xếp tầng trên màn hình để thấy rõ bí mật tiết kiệm bộ nhớ. Tất cả mười công-tai-nơ phía trên đều chia
      sẻ chung một khối ảnh gốc chỉ đọc một trăm hai mươi mê-ga-bai cùng một nhân Li-núc duy nhất ở đáy. Mỗi bản chỉ tiêu
      tốn thêm một lớp ghi riêng mỏng vài mê-ga-bai nằm ở phía trên cùng. Tách biệt góc nhìn tiến trình kết hợp ngưỡng giới
      hạn tạo nền tảng an toàn để chạy hàng chục dịch vụ chung máy. Cả mười công-tai-nơ đều đọc chung một tập hợp các tầng
      nền chỉ đọc nằm bất động trên đĩa cứng của máy chủ.
    clear: true
  - show: ''
    say: Mỗi bản chạy chỉ sinh thêm một lớp mỏng ghi riêng những thay đổi mới phát sinh trong vòng đời ngắn ngủi của nó. Giới
      hạn cứng từ nhóm kiểm soát bảo đảm một dịch vụ rò rỉ bộ nhớ không thể kéo sập toàn bộ máy chủ vật lý. Chia sẻ chung
      các tầng ảnh chỉ đọc phía dưới giúp khởi tạo hàng chục bản sao đồng thời với chi phí đĩa thấp. Giới hạn trần bộ nhớ
      qua nhóm kiểm soát bảo vệ tiến trình chủ lực khỏi bị tắt đột ngột khi một nhánh rò rỉ.
- id: formula
  kind: formula
  title: Công thức tính tổng dung lượng tầng ảnh và nhận diện OOMKill
  checks:
  - alg.lnx_image_total(120, [5], 10) == 170
  steps:
  - show: '<div class=''box key''><p>Gọi $B$ là kích thước ảnh gốc chỉ đọc và $W$ là dữ liệu ghi riêng của mỗi bản trong $N$
      bản cùng chạy:</p><p>$$\text{Tổng dung lượng} = B + N \times W$$</p><p>Với $B = 120\text{ MB}$, $N = 10$, $W = 5\text{
      MB}$: tổng $= 120 + 10 \times 5 = \hl{170\text{ MB}}$ (so với $1\,200\text{ MB}$ sao chép toàn bộ).</p><p>Dung lượng
      tiết kiệm khi dùng chung ảnh gốc: <code>saved = N × B − (B + N × W)</code> = 1 200 − 170 = <b>1 030 MB</b>.</p></div>'
    say: Công thức tính dung lượng đĩa cực kỳ gọn vì tầng ảnh gốc chỉ xuất hiện đúng một lần trên đĩa dù bạn bật bao nhiêu
      bản sao. Ta chỉ lấy kích thước ảnh gốc cộng thêm số lượng công-tai-nơ nhân với phần ghi riêng của từng bản. Nhờ vậy
      mười bản chạy cùng lúc chỉ tốn một trăm bảy mươi mê-ga-bai thay vì một nghìn hai trăm mê-ga-bai. Công thức tính tổng
      dung lượng giải thích tại sao nhân bản thêm hàng chục công-tai-nơ chỉ tốn thêm phần nhỏ dữ liệu ghi riêng. Dung lượng
      đĩa tiết kiệm được bằng tổng bản sao rời trừ đi tổng tầng dùng chung, tức một nghìn không trăm ba mươi mê-ga-bai.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
