    say: Tổng kết công thức kiến trúc bên dưới mọi công-tai-nơ hiện đại. Không gian tên tách biệt bảng tiến trình và mạng,
      nhóm kiểm soát đặt trần tài nguyên, còn tầng ảnh dùng chung giúp bật hàng trăm bản sao trong tích tắc. Nắm bản chất
      cô lập tiến trình và giới hạn bộ nhớ giúp hiểu sâu cách container vận hành. Không gian tên tạo cảm giác máy riêng, nhóm
      kiểm soát giữ kỷ luật tài nguyên và tầng ảnh chung đem lại hiệu suất lưu trữ. Hiểu tầng ghi chỉ sống theo công-tai-nơ
