scenes:
- id: hook
  kind: hook
  title: Chạy 10 container từ ảnh 120 MB có tốn 1 200 MB không?
  checks:
  - alg.lnx_image_total(120, [5], 10) == 170
  steps:
  - show: <div class='box key'><p>Một ảnh gốc <b>120 MB</b>. Nếu là máy ảo truyền thống, chạy 10 máy tốn 10 bản sao = <b>1
      200 MB</b> kèm 10 nhân hệ điều hành tách biệt.</p><p>Nhưng với công-tai-nơ dùng chung một nhân Linux và tầng ảnh chỉ
      đọc, 10 bản chạy song song chỉ tốn vỏn vẹn <b>170 MB</b> ổ đĩa.</p></div>
    say: Chào bạn đến với chặng ba khám phá bản chất thật sự bên dưới công nghệ công-tai-nơ. Nhiều bạn hình dung mỗi công-tai-nơ
      là một máy ảo thu nhỏ phải sao chép trọn bộ một trăm hai mươi mê-ga-bai ổ đĩa cho mỗi bản chạy mới. Thực tế tất cả công-tai-nơ
      chạy chung trên một nhân Li-núc duy nhất và chia sẻ chung tầng ảnh chỉ đọc ở bên dưới. Hôm nay ta tìm hiểu hai trụ cột
      cô lập và điều phối của nhân giúp làm được điều đó. Sự nhẹ nhàng đáng kinh ngạc của công-tai-nơ đến từ việc nó dùng
      chung nhân hệ điều hành chứ không ảo hoá lại cả máy tính. Hai công cụ gốc ngay trong nhân Li-núc phối hợp nhịp nhàng
      biến một tiến trình bình thường thành môi trường chạy độc lập.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>kiến thức bài trước</th><th>vai trò bên trong công-tai-nơ</th></tr><tr><td>Mã thoát 137
      = 128 + 9 do SIGKILL (L02)</td><td>Khi vượt trần RAM cho phép, nhân gửi SIGKILL cắt công-tai-nơ với mã 137</td></tr><tr><td>Thư
      mục ảo tiến trình /proc (L00)</td><td>Bên trong công-tai-nơ vẫn nhìn thấy tiến trình chính là PID 1</td></tr></table>
    say: Công-tai-nơ không phải phép màu bí ẩn nào khác mà là tổng hợp trực tiếp từ bài 0 và bài 2. Nhờ bài 2 bạn hiểu vì
      sao một dịch vụ ngốn tràn giới hạn bộ nhớ bị nhân ngắt với mã thoát một ba bảy. Và nhờ bài 0 bạn thấy góc nhìn tiến
      trình bên trong tự coi mình là tiến trình số một. Khi nắm rõ cơ chế dùng chung nhân từ gốc, bạn dễ dàng giải thích nguyên
      nhân mã thoát một trăm ba bảy lúc thiếu bộ nhớ. Cả thông số giới hạn CPU lẫn trần bộ nhớ RAM đều được thực thi trực
      tiếp bởi chính nhân hệ điều hành chủ.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và lệnh mới
  steps:
  - show: '<table class=''t''><tr><th>cơ chế nhân Linux</th><th>trách nhiệm tách biệt</th></tr><tr><td><code>namespaces</code>
      (không gian tên)</td><td>Cô lập <b>những gì tiến trình nhìn thấy</b>: bảng PID riêng, thẻ mạng riêng, cây thư mục riêng</td></tr><tr><td><code>cgroups</code>
      (nhóm kiểm soát)</td><td>Giới hạn <b>lượng tài nguyên được tiêu thụ</b>: trần bộ nhớ RAM, tỉ lệ CPU</td></tr><tr><td>Tầng
      ảnh chồng lớp (UnionFS)</td><td>Nhiều tầng gốc chỉ đọc dùng chung; mỗi bản chạy thêm duy nhất 1 tầng ghi mỏng trên cùng</td></tr></table>'
    say: Bảng này giải mã ba cơ chế lõi tạo nên một công-tai-nơ hiện đại. Đầu tiên là không gian tên giúp cô lập góc nhìn
      để tiến trình chỉ thấy bảng mã tiến trình và giao diện mạng của riêng nó. Tiếp theo là nhóm kiểm soát dùng để đóng trần
      phần trăm CPU và dung lượng bộ nhớ tối đa. Cuối cùng là hệ thống tệp chồng lớp dùng chung tầng gốc chỉ đọc. Không gian
      tên gói gọn tầm nhìn tiến trình về tệp, mạng, người dùng; còn nhóm kiểm soát áp trần cứng mức ăn tài nguyên.
