  - show: <div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="40" y="25" width="250" height="75" rx="10"
      fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="165.0" y="58" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Container web</text><text x="165.0" y="80" font-size="15" text-anchor="middle"
