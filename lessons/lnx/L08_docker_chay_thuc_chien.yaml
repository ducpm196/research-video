scenes:
- id: hook
  kind: hook
  title: Xoá container DB làm sao không mất sạch toàn bộ dữ liệu?
  checks:
  - 500 - 500 == 0
  steps:
  - show: '<div class=''box key''><p>Một bạn chạy DB mới trong container rồi nhập 500 bản ghi thử nghiệm, hôm sau chạy <code>docker
      rm</code> nâng phiên bản thì dữ liệu về con số 0.</p><p>Nguyên nhân: bạn chưa gắn <b>ổ bền vững (volume)</b> ra ngoài
      tầng ghi tạm thời của công-tai-nơ.</p></div>'
    say: Chào bạn, tai nạn mất trắng dữ liệu khi xoá để cập nhật công-tai-nơ là bài học nhập môn đắt giá nhất khi mới dùng
      Đốc-cơ. Như ở bài 7 ta vừa thấy, mỗi công-tai-nơ chỉ sở hữu một lớp ghi mỏng gắn theo vòng đời của riêng nó nên hễ xoá
      công-tai-nơ là lớp dữ liệu ấy bay theo ngay lập tức. Hôm nay ta thực hành gắn ổ bền vững sống độc lập ngoài công-tai-nơ,
      nối hai dịch vụ qua mạng cầu nối riêng và đọc nhật ký trực tiếp. Mất sạch dữ liệu cơ sở dữ liệu ngay lúc nâng cấp phiên
      bản chỉ vì quên gắn ổ lưu trữ nằm ngoài vòng đời công-tai-nơ. Tách biệt rõ mã thực thi không trạng thái khỏi ổ chứa
      dữ liệu bền vững là nguyên tắc vàng khi đóng gói Đốc-cơ.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
