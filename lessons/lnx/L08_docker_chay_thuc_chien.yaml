      ngoài, rồi gọi thẳng tới cơ sở dữ liệu bằng tên dịch vụ qua mạng cầu nối riêng kín đáo bên trong. Ở phía dưới, ổ gắn
      bền vững nằm ngoài vòng đời công-tai-nơ bảo vệ nguyên vẹn dữ liệu dù bản cũ bị xoá và thay bằng bản mới. Khi giữ được
      dữ liệu bền vững ở ngoài thùng chứa, bạn thoải mái tái tạo dịch vụ mới sạch sẽ không rủi ro.
