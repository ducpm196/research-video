- id: sym
  kind: symbol
  title: Giải mã ký hiệu và lệnh mới
  steps:
  - show: <table class='t'><tr><th>cờ / lệnh Docker</th><th>tác dụng thực tế</th></tr><tr><td><code>-v ten_volume:/var/lib/data</code></td><td>Gắn
      ổ bền vững tồn tại độc lập ngay cả khi công-tai-nơ bị xoá bỏ</td></tr><tr><td><code>-p 8080:80</code></td><td>Ánh
      xạ cổng 8080 trên máy host vào cổng 80 bên trong công-tai-nơ</td></tr><tr><td><code>docker network create</code>
      &amp; <code>docker logs</code></td><td>Tạo mạng cầu nối nội bộ phân giải theo tên và đọc luồng nhật ký chuẩn</td></tr></table>
    say: Trên bảng là bộ ba cờ và lệnh thực chiến bạn dùng hàng ngày với Đốc-cơ. Cờ trừ v gắn một ổ lưu trữ bền
      vững nằm ngoài công-tai-nơ để dữ liệu còn nguyên qua mọi lần nâng cấp. Cờ trừ p nối cổng máy chủ ngoài vào
      cổng lắng nghe bên trong, còn mạng cầu nối riêng cho phép hai công-tai-nơ gọi thẳng bằng tên thay vì nhớ địa
      chỉ I P.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
