    say: Chỉ công bố đúng cổng đầu vào thiết yếu ra ngoài máy chủ trong khi giữ toàn bộ cổng cơ sở dữ liệu kín sau lớp mạng
      riêng. Nhờ vậy ngay cả khi công-tai-nơ ứng dụng khởi động lại với địa chỉ IP nội bộ khác, tên dịch vụ vẫn trỏ trúng
      đích. Việc tách vòng đời lưu trữ ra ổ gắn độc lập cho phép nâng cấp phiên bản mã nguồn nhanh chóng mà không mất dữ liệu.
      Tên dịch vụ trên mạng cầu nối tự động phân giải sang địa chỉ mới mỗi khi công-tai-nơ khởi động lại.
- id: formula
  kind: formula
  title: Quy tắc sống sót dữ liệu và chiều đọc ánh xạ cổng
  checks:
  - int('8080') == 8080
  steps:
  - show: <div class='box key'><p><b>Chiều đọc cố định mọi cờ ánh xạ trong Docker (Trái = Ngoài | Phải = Trong):</b></p><p><code>-p
      HOST_PORT:CONTAINER_PORT</code> và <code>-v HOST_VOLUME:CONTAINER_PATH</code>.</p><p><b>Bất biến bảo toàn dữ liệu:</b>
      Khi ghi $N$ bản ghi vào ổ gắn bền vững rồi xoá công-tai-nơ tạo bản mới gắn lại đúng ổ đó, số bản ghi đọc lại $= N$ (giữ
      nguyên $\hl{100\%}$).</p></div>
    say: Để không bao giờ lắp ngược hướng cờ cấu hình, hãy nhớ một quy tắc ngắn gọn. Vế bên trái dấu hai chấm luôn là của
      máy chủ bên ngoài, còn vế bên phải là đường dẫn hoặc cổng bên trong công-tai-nơ. Khi đã gắn đúng ổ lưu trữ bền vững
      ở bên trái, mọi bản ghi lưu xuống vẫn giữ trọn vẹn một trăm phần trăm sau khi thay mới công-tai-nơ. Nhất quán quy tắc
      trái ngoài phải trong cho mọi cờ gắn cổng và ổ đĩa giúp xoá bỏ hoàn toàn nhầm lẫn chiều cấu hình.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên Docker: giữ dữ liệu qua volume bền vững'
  checks:
  - 500 + 0 == 500
  steps:
  - show: <table class='t'><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>docker volume create lnx_v8</code></td><td>Tạo
      ổ lưu trữ bền vững được Docker quản lý độc lập ngoài container</td></tr><tr><td><code>docker logs &lt;id&gt;</code></td><td>Đọc
      lại toàn bộ luồng chuẩn và luồng lỗi do tiến trình PID 1 in ra</td></tr><tr><td><code>getent hosts &lt;tên&gt;</code></td><td>Truy
      vấn DNS nội bộ trong mạng cầu nối Docker để kiểm tra IP dịch vụ</td></tr><tr><td><code>reverse proxy</code></td><td>Máy
      chủ cổng trước đón <code>80/443</code> từ ngoài rồi chuyển tiếp vào dịch vụ kín bên trong</td></tr></table>
    say: Giải thích các lệnh khởi tạo ổ bền vững và kiểm tra tính liên tục dữ liệu khi thay công-tai-nơ trên Đốc-cơ thật.
      Khởi tạo trước ổ lưu trữ và mạng cầu nối đặt tên rõ ràng giúp việc dọn dẹp hoặc kiểm tra định kỳ trở nên cực kỳ gọn.
    clear: true
  - show: <p><b>Ghi dữ liệu vào volume trong container 1, xoá container 1, đọc lại bằng container 2 + xem logs</b></p><div
      class="code"><div>set -e</div><div>docker volume rm lnx_demo_v8 &gt;/dev/null 2&gt;&amp;1 || true</div><div>docker volume
      create lnx_demo_v8 &gt;/dev/null</div><div>IMG=postgres:17-alpine</div><div>MSYS_NO_PATHCONV=1 docker run --name lnx_c1
      -v lnx_demo_v8:/data \</div><div>  <span>&#36;</span>IMG sh -c 'echo row_1_saved&gt;/data/db.txt; echo log_written_by_c1'
      &gt;/dev/null</div><div>logs_c1=<span>&#36;</span>(docker logs lnx_c1); docker rm lnx_c1 &gt;/dev/null</div><div>val_c2=<span>&#36;</span>(MSYS_NO_PATHCONV=1
      docker run --rm -v lnx_demo_v8:/data <span>&#36;</span>IMG cat /data/db.txt)</div><div>docker volume rm lnx_demo_v8
      &gt;/dev/null</div><div>echo "logs=<span>&#36;</span>logs_c1 restored=<span>&#36;</span>val_c2"</div></div>
    say: Ta thực hiện thí nghiệm sống trên Đốc-cơ qua hai công-tai-nơ nối tiếp nhau. Đầu tiên ta tạo một ổ gắn mới, bật công-tai-nơ
      thứ nhất ghi dữ liệu và nhật ký rồi xoá bỏ hoàn toàn công-tai-nơ này. Sau đó ta bật công-tai-nơ thứ hai gắn lại đúng
      ổ vừa rồi và đọc kiểm chứng toàn bộ. Thí nghiệm sống xoá thẳng công-tai-nơ thứ nhất rồi bật công-tai-nơ thứ hai kiểm
      chứng độ bền tuyệt đối của ổ gắn ngoài.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>logs=log_written_by_c1 restored=row_1_saved</div></div>
    say: Đầu ra thật chứng minh dòng nhật ký đã được thu nhận đầy đủ. Dữ liệu từ công-tai-nơ thứ nhất đã xoá vẫn còn nguyên
      một trăm phần trăm khi công-tai-nơ thứ hai đọc lại từ ổ bền vững. Dòng nhật ký và dòng dữ liệu khôi phục trùng khớp
      nguyên vẹn khẳng định vòng đời dữ liệu hoàn toàn độc lập với mã chạy.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng phân giải tên dịch vụ nội bộ qua mạng cầu nối riêng
  checks:
  - len('lnx_srv8') == 8
  steps:
  - show: '<p><b>Tạo mạng cầu nối lnx_net8 để container khách phân giải tên dịch vụ lnx_srv8</b></p><div class="code"><div>set
      -e</div><div>docker network rm lnx_net8 &gt;/dev/null 2&gt;&amp;1 || true</div><div>docker network create lnx_net8 &gt;/dev/null</div><div>IMG=postgres:17-alpine;
      BR=lnx_net8</div><div>MSYS_NO_PATHCONV=1 docker run -d --rm --name lnx_srv8 --network <span>&#36;</span>BR <span>&#36;</span>IMG
      sleep 15 &gt;/dev/null</div><div>cmd=''getent hosts lnx_srv8 | awk "{print (\<span>&#36;</span>1 ~ /^[0-9]+\./ ? 1 :
      0), \<span>&#36;</span>2}"''</div><div>ans=<span>&#36;</span>(MSYS_NO_PATHCONV=1 docker run --rm --network <span>&#36;</span>BR
      <span>&#36;</span>IMG sh -c "<span>&#36;</span>cmd")</div><div>docker stop lnx_srv8 &gt;/dev/null</div><div>docker network
      rm lnx_net8 &gt;/dev/null</div><div>echo "dns_resolved=<span>&#36;</span>ans"</div></div>'
    say: Ở đường kiểm chứng thứ hai, ta tạo một mạng cầu nối riêng rồi cho hai công-tai-nơ tham gia vào cùng mạng đó vì cần
      kiểm tra phân giải tên nội bộ. Kiểm nghiệm phân giải tên trên mạng cầu nối riêng chứng minh hệ thống không cần gán địa
      chỉ IP cứng dễ gãy.
    clear: true
    focus:
    - 1
    - 2
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>dns_resolved=1 lnx_srv8</div></div>
    say: Đầu ra thật xác nhận công-tai-nơ thứ hai phân giải thành công tên dịch vụ sang địa chỉ IP nội bộ vì mạng cầu nối
      đã bật DNS riêng. Con số bản ghi giữ nguyên vẹn sau chu kỳ xoá thùng chứa khẳng định dữ liệu quan trọng đã tách rời
      hoàn toàn khỏi lớp chứa nhất thời của ứng dụng. Cờ phân giải thành công bằng một xác nhận bộ máy chủ tên nội bộ đã làm
      việc ngay khi hai dịch vụ vào cùng mạng.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: Tại sao không lộ cổng DB ra ngoài qua ba quy mô cụm
  checks:
  - 80 + 443 == 523
  steps:
  - show: <table class='t'><tr><th>quy mô hệ thống</th><th>rủi ro nếu mở thẳng -p 5432:5432 ra internet</th><th>cách cấu hình
      chuẩn qua mạng cầu nối</th></tr><tr><td>Máy thử cá nhân</td><td>Chậm hoặc dễ xung đột cổng cùng máy</td><td>Chỉ giữ
      cổng nội bộ giữa app và DB</td></tr><tr><td>Máy chủ đơn chạy thật</td><td>Hàng nghìn lượt quét dò mật khẩu mỗi giờ</td><td>Chỉ
      mở 80/443 của reverse proxy; DB kín hoàn toàn</td></tr><tr><td>Cụm nhiều dịch vụ</td><td>Lộ dữ liệu nếu thiếu tường
      lửa máy chủ</td><td>Tách mạng riêng theo nhóm dịch vụ liên quan</td></tr></table>
    say: Bảng quy mô nhắc nhở nguyên tắc thiết kế mạng tối giản bề mặt tấn công. Khi mở thẳng cổng cơ sở dữ liệu ra máy chủ
      công cộng, ngay lập tức hàng nghìn lượt quét dò tự động từ mạng ngoài sẽ gõ cửa liên tục. Ngược lại, đưa cơ sở dữ liệu
      vào mạng cầu nối riêng giúp ứng dụng gọi trực tiếp qua tên dịch vụ mà vẫn giấu kín hoàn toàn trước bên ngoài. Trên hệ
      thống sản xuất, khoá chặt cổng cơ sở dữ liệu bên trong mạng riêng loại bỏ ngay hàng nghìn lượt dò quét mật khẩu tự động.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1:
      Lưu dữ liệu cơ sở dữ liệu vào tầng ghi mặc định trong công-tai-nơ.</b> Lệnh xoá công-tai-nơ sẽ làm mất sạch toàn bộ
      dữ liệu.<br><b>Lỗi 2: Dùng mạng mặc định rồi cố gọi nhau bằng tên container.</b> Mạng cầu nối mặc định không hỗ trợ
      DNS theo tên; phải tự tạo mạng cầu nối riêng.<br><b>Lỗi 3: Chạy container in nhật ký ra tệp bên trong ổ đĩa container
      thay vì ra <code>stdout</code>.</b> Lệnh <code>docker logs</code> rỗng không và tệp log phình dần tới đầy đĩa.</div></td></tr></table>'
    say: Hãy tránh ba sai lầm rất hay gặp khi chạy Đốc-cơ thực tế. Sai lầm nặng nhất là quên gắn ổ bền vững khiến lần khởi
      tạo lại tiếp theo xoá trắng toàn bộ cơ sở dữ liệu. Sai lầm thứ hai là dùng mạng cầu nối mặc định vốn không tự phân giải
      tên giữa các công-tai-nơ. Sai lầm thứ ba là ghi nhật ký vào tệp kín bên trong thay vì xuất ra luồng chuẩn. Ghi nhớ rõ
      vị trí gắn ổ ngoài để dữ liệu quan trọng không mất đi khi nâng cấp ảnh. Không để ứng dụng ghi nhật ký ra tệp xoay vòng
      ẩn sâu trong tầng ghi mỏng vì lệnh xem nhật ký mặc định sẽ không thấy gì. Thay vào đó luôn đẩy toàn bộ nhật ký hoạt
      động ra hai luồng chuẩn để Đốc-cơ tự thu thập và xoay vòng kích thước an toàn.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - 0
    - 0
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 8080 > 80
  steps:
  - show: <ol><li>Trong cờ <code>-p 8080:80</code>, cổng nào lắng nghe trên máy chủ host ngoài và cổng nào là cổng bên trong
      container?</li><li>Để giữ lại toàn bộ dữ liệu cơ sở dữ liệu khi nâng cấp công-tai-nơ mới, cần gắn thêm tuỳ chọn gì?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, trong cờ trừ p tám nghìn không trăm tám mươi hai chấm tám mươi, số nào nằm ngoài
      máy chủ và số nào nằm bên trong công-tai-nơ? Câu hai, cần thêm tuỳ chọn gì để bảo toàn dữ liệu khi xoá và tạo lại công-tai-nơ
      mới? Bấm tạm dừng và trả lời. Đối chiếu lại quy ước viết cổng ngoài cổng trong và vòng đời của ổ gắn dữ liệu bền vững.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Bên trái <code>8080</code> là cổng máy chủ <b>host</b>;
      bên phải <code>80</code> là cổng bên trong <b>container</b>.</p></td></tr></table>
    say: 'Đáp án câu một: vế trái tám nghìn không trăm tám mươi là cổng máy chủ bên ngoài, còn vế phải tám mươi là cổng bên
      trong công-tai-nơ. Tách dữ liệu trạng thái ra khỏi vòng đời thùng chứa là nguyên tắc nền tảng giúp nâng cấp phiên bản
      phần mềm an toàn mà không mất bản ghi. Quy ước bên trái của dấu hai chấm luôn là tài nguyên nằm trên máy chủ vật lý
      bên ngoài công-tai-nơ.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Phải gắn <b>ổ bền vững (volume)</b> qua cờ <code>-v
      ten_volume:/duong_dan_du_lieu</code>.</p></td></tr></table>
    say: 'Đáp án câu hai: bắt buộc phải gắn ổ bền vững bằng cờ trừ v để dữ liệu sống độc lập ngoài công-tai-nơ. Tuân thủ quy
      ước bên trái là máy chủ và bên phải là thùng chứa giúp bạn cấu hình ánh xạ cổng mạng lẫn ổ đĩa luôn chuẩn xác. Ổ gắn
      bền vững trở thành nơi trú ẩn an toàn duy nhất cho mọi tệp dữ liệu cần sống sót qua các chu kỳ cập nhật mã nguồn.'
    clear: true
- id: practice
  kind: practice
  title: Thực hành Bash/Linux đọc stdin và chấm tự động (kèm ca ẩn)
  lab: labs/LNX/L08
  steps:
  - show: <div class='box key'><p><b>Thực hành LNX L08 (<code>labs/LNX/L08/de.md</code>):</b> Đọc <code>host_port:container_port
      rows</code>, tách cặp cổng ngoài:trong, kiểm chứng lưu giữ dữ liệu qua chu kỳ tạo lại và in 3 dòng.</p><p><b>Dữ liệu
      mẫu (<code>stdin</code>):</b> <code>9090:8080 1250</code></p><p><b>Chấm tự động:</b> <code>bash labs/cham.sh LNX L08
      duong_dan/bai_cua_ban.sh</code></p></div>
    say: Hãy mở đề bài L08 để tự triển khai lời giải đọc dữ liệu trực tiếp từ luồng chuẩn theo khuôn mẫu quy định. Lưu ý trình
      chấm tự động sẽ chạy thêm các ca ẩn kiểm tra biên và quy mô ngoài tệp mẫu công khai nên tuyệt đối không in cứng kết
      quả tĩnh. Hãy bấm tạm dừng, chạy thử trên Git Bash hoặc dòng lệnh Linux và hoàn thành trước khi đối chiếu đầu ra mẫu.
      Cấu hình phần đọc tham số cổng và mô phỏng vòng đời lưu trữ dữ liệu qua ổ gắn bền vững theo định dạng đầu vào chuẩn.
      Kiểm tra chuẩn quy tắc đặt tên cổng và đường dẫn ánh xạ ngăn lỗi đè dữ liệu trong quá trình khởi chạy.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - 1
    clear: true
    pause: 30
  - show: <p><b>Kết quả mẫu cần khớp trên <code>labs/LNX/L08/du_lieu.txt</code></b></p><div class="code"><div>host_port=9090
      container_port=8080</div><div>volume_persists=1</div><div>retained_rows=1250</div></div>
    say: Màn hình hiển thị đầu ra chính xác ứng với tệp dữ liệu mẫu công khai L08 khi chạy đúng logic trên chuẩn vào. Ngoài
      kết quả khớp mẫu công khai này, trình chấm tự động còn chạy toàn bộ các ca ẩn trong thư mục ca ẩn để xác nhận giải pháp
      tổng quát. Hãy kiểm tra thật kỹ định dạng từng dòng đầu ra gồm khoảng trắng và dấu bằng trước khi đối chiếu với trình
      chấm tự động. Kiểm đối chiếu đầy đủ cổng máy chủ ngoài, cổng bên trong, cờ bền vững và số lượng dòng dữ liệu giữ nguyên
      vẹn.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <div class='box ok'><p><b>Gợi ý nếu kẹt ở bài L08:</b> (1) tách cổng ngoài và cổng trong qua dấu hai chấm; (2) lưu
      và đọc lại số dòng qua tệp tạm mô phỏng volume bền vững; (3) lọc \r khi đọc stdin.</p<p style='margin-top:6px'><b>Mẹo
      cú pháp:</b> Tách cổng quanh dấu <code>:</code> bằng <code>IFS=':' read -r hp cp &lt;&lt;&lt; "$ports"</code> hoặc <code>${ports%%:*}</code>
      và <code>${ports##*:}</code>.</p></div>
    say: Nếu trình chấm báo lệch dòng đầu ra hoặc gãy ở các ca ẩn kiểm tra biên, hãy đối chiếu kỹ lại ba điểm gợi ý trên màn
      hình. Rà soát lại bước đọc chuẩn vào và kiểm tra xử lý trường hợp biên trước khi nộp lại. Sau khi sửa lại mã theo các
      gợi ý trên, hãy chạy lại lệnh chấm một lượt nữa để bảo đảm mọi ca công khai và ca ẩn đều vượt qua hoàn toàn. Chú ý tách
      chính xác hai con số quanh dấu hai chấm và đặt tệp dữ liệu bền vững đúng đường dẫn mô phỏng.
