      text-anchor="middle" fill="#475569">Chỉ nghe mạng cầu nối nội bộ</text><line x1="815" y1="100" x2="815" y2="138" stroke="#475569"
      stroke-width="2"/><polygon points="815,138 810.0,130.0 820.0,130.0" fill="#475569"/><rect x="490" y="138" width="430"
