- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>-v ổ bền vững</span><span class='a'>+</span><span class='n'>Mạng cầu nối tên</span><span
      class='a'>+</span><span class='n'>Nhật ký stdout/docker logs</span></div>
    say: Tổng kết bộ ba kỹ năng chạy công-tai-nơ bền vững chuẩn sản xuất. Gắn ổ bên ngoài giữ an toàn dữ liệu, dùng mạng cầu
      nối riêng để các dịch vụ giao tiếp bằng tên nội bộ, và luôn đẩy nhật ký ra luồng chuẩn. Tách dữ liệu ra ổ gắn ngoài
      giúp nâng cấp dịch vụ tự tin mà không lo mất trạng thái. Ổ gắn bền vững, mạng cầu nối phân giải tên và xuất nhật ký
      ra luồng chuẩn tạo thành bộ ba tiêu chuẩn chạy công-tai-nơ sạch sẽ. Khi đã làm chủ thao tác với từng công-tai-nơ rời,
      bước cuối cùng sẽ hợp nhất chúng thành cụm đa dịch vụ tự động.
    focus:
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
  - show: '<div class=''box ok''><b>Bài sau (bài 9):</b> Tình huống chuyên gia: Dựng và gỡ lỗi cụm nhiều dịch vụ bằng Docker
      Compose</div>'
    say: Bài tiếp theo là bài 9, tìm hiểu chủ đề tiếp nối ngay phần vừa học. Hẹn gặp bạn ở bài sau. Thành thạo ánh xạ cổng
      và ổ đĩa cho từng thùng chứa mở đường trực tiếp cho bài tình huống điều phối cụm dịch vụ ở cuối chặng. Bài tình huống
      chuyên gia cuối khoá triển khai một cụm nhiều dịch vụ kèm kiểm tra sức khoẻ tự động bằng Đốc-cơ Côm-pâu.
