      font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Container DB / cache</text><text x="815.0"
      y="80" font-size="15" text-anchor="middle" fill="#475569">Chỉ nghe mạng cầu nối nội bộ</text><line x1="815"
      y1="100" x2="815" y2="138" stroke="#475569" stroke-width="2"/><polygon points="815,138 810.0,130.0 820.0,130.0"
      fill="#475569"/><rect x="490" y="138" width="430" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text
      x="705.0" y="165" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Ổ bền vững (-v db_data:/data)</text><text
      x="705.0" y="184" font-size="15" text-anchor="middle" fill="#475569">Còn nguyên 100% khi xoá và tạo lại container</text></svg></div>
    say: Nhìn sơ đồ kiến trúc chuẩn khi chạy nhiều công-tai-nơ liên kết. Ứng dụng chính chỉ mở đúng một cổng cần
      thiết ra ngoài, rồi gọi thẳng tới cơ sở dữ liệu bằng tên dịch vụ qua mạng cầu nối riêng kín đáo bên trong.
      Ở phía dưới, ổ gắn bền vững nằm ngoài vòng đời công-tai-nơ bảo vệ nguyên vẹn dữ liệu dù bản cũ bị xoá và thay
      bằng bản mới.
