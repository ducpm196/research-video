      ghi mỏng theo vòng đời công-tai-nơ (L07)</td><td>Dữ liệu lưu trong tầng ghi đó sẽ mất sạch khi xoá công-tai-nơ</td></tr><tr><td>Lắng
      nghe trên 0.0.0.0 và luồng 1/2 (L05, L03)</td><td>Chuyển cổng -p và lệnh đọc log nhận đúng đầu ra bên trong</td></tr></table>
    say: Ta nối tiếp trực tiếp bài 3, bài 5 và bài 7 vào vận hành Đốc-cơ hàng ngày. Bởi vì tầng ghi trên cùng gắn
      chết với công-tai-nơ theo bài 7, dữ liệu lâu dài bắt buộc tách ra ổ gắn riêng. Đồng thời cổng chuyển tiếp
      và nhật ký đều tuân theo cơ chế mạng và hai luồng chuẩn vừa học.
