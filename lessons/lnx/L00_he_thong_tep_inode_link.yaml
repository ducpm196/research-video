      stroke="#16a34a" stroke-width="2"/><text x="160.0" y="52" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">hard.txt
      (Tên A)</text><text x="160.0" y="72" font-size="15" text-anchor="middle" fill="#475569">Trỏ thẳng i-nốt #1001</text><line
      x1="280" y1="56" x2="390" y2="56" stroke="#475569" stroke-width="2"/><polygon points="390,56 382.0,61.0 382.0,51.0"
