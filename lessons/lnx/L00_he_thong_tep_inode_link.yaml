      points="280,158 288.0,153.0 288.0,163.0" fill="#475569"/><text x="455" y="150" font-size="14" font-weight="600" text-anchor="middle"
      fill="#1e293b">trỏ tên → đứt khi xoá orig</text><rect x="630" y="124" width="290" height="68" rx="10" fill="#fee2e2"
      stroke="#dc2626" stroke-width="2"/><text x="775.0" y="154" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">sym.txt
      (Liên kết mềm)</text><text x="775.0" y="174" font-size="15" text-anchor="middle" fill="#475569">Lưu chuỗi tên ''orig.txt''
      (#1002)</text></svg></div>'
    say: Nhìn sơ đồ so sánh hai cơ chế liên kết trên hệ thống tệp. Cả hai tên tệp cứng nằm bên trái đều trỏ trực tiếp vào
      chung khối mô tả i-nốt một nghìn không trăm linh một nên bộ đếm liên kết bằng hai. Trong khi đó liên kết mềm ở bên phải
      là một tệp nhỏ mang mã i-nốt riêng chỉ ghi mỗi dòng chữ tên tệp gốc.
    clear: true
  - show: ''
    say: Vì thế khi xoá tên tệp gốc, dữ liệu vẫn còn nguyên cho liên kết cứng, còn liên kết mềm trở thành đường dẫn đứt đoạn.
      Bộ đếm liên kết cứng hoạt động như một đồng hồ đếm tham chiếu, giữ nguyên khối dữ liệu cho tới khi không còn tên nào
      giữ. Còn sợi dây liên kết mềm chỉ giữ tên đường dẫn nên bị treo lơ lửng ngay lập tức khi tên đích bị di chuyển.
- id: formula
  kind: formula
  title: Quy tắc thu hồi dữ liệu của nhân Linux
  checks:
  - (2 - 1) >= 1
  steps:
  - show: '<div class=''box key''><p><b>Quy tắc giải phóng ổ đĩa chuẩn POSIX:</b></p><p>Dữ liệu trên ổ đĩa chỉ bị thu hồi
      khi <b>cả hai điều kiện</b> cùng đạt 0: bộ đếm tên tệp <code>link_count == 0</code> <b>và</b> không còn tiến trình nào
      mở tệp.</p><p>Ví dụ: ban đầu <code>link_count = 2</code>; sau khi <code>rm orig.txt</code>, <code>link_count = 1 &gt;
      0</code> nên dữ liệu giữ nguyên 100%.</p></div>'
    say: Quy tắc thu hồi dữ liệu rất nhất quán trên mọi máy chủ Li-núc. Nhân hệ điều hành chỉ đánh dấu thu hồi các khối dữ
      liệu khi bộ đếm liên kết giảm về không và không còn tiến trình nào đang mở tệp đó. Vì thế với hai tên tệp cứng ban đầu,
      khi xoá một tên thì bộ đếm vẫn bằng một lớn hơn không nên dữ liệu còn nguyên vẹn. Ngay cả khi bạn đã xoá sạch mọi tên
      tệp trong thư mục, một tiến trình vẫn đang mở đọc tệp sẽ giữ nguyên dữ liệu trên đĩa. Dung lượng trống chỉ thật sự được
      giải phóng khi tiến trình cuối cùng đóng bộ mô tả tệp đang giữ nút chỉ mục đó.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên Alpine Linux: kiểm tra liên kết và /proc'
  checks:
  - (2 - 1) >= 1
  steps:
  - show: '<table class=''t''><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>stat -c ''%i %h''</code></td><td>In
      ra đúng hai con số: mã số i-nốt và số liên kết trỏ tới nó (chuẩn POSIX = bộ quy ước chung Unix/Linux)</td></tr><tr><td><code>ln
      orig.txt hard.txt</code></td><td>Tạo liên kết cứng dùng chung i-nốt với tệp gốc</td></tr><tr><td><code>ln -s orig.txt
      sym.txt</code></td><td>Tạo liên kết mềm trỏ gián tiếp theo tên đường dẫn</td></tr><tr><td><code>MSYS_NO_PATHCONV=1</code></td><td>Biến
      môi trường Git Bash Windows cấm tự đổi đường dẫn Linux <code>/tmp</code></td></tr><tr><td><code>docker run</code> |
      <code>&gt;/dev/null 2&gt;&amp;1</code> | <code>&#36;(cmd)</code></td><td>Chạy trong môi trường Linux sạch; ẩn xuất thừa/lỗi
      khi chỉ cần lấy mã thoát <code>&#36;?</code>; chèn kết quả lệnh con</td></tr></table>'
    say: Trước khi xem kết quả chạy thật trên nhân Li-núc thật, ta giải mã bốn quy ước quan trọng. Hai lệnh đầu tạo hai kiểu
      liên kết, lệnh sau đọc mã i-nốt, và cờ môi trường giữ nguyên đường dẫn trên máy. Đọc hai số i-nốt và số liên kết giúp
      ta kiểm chứng tức thì hai tên tệp có thật sự chia sẻ chung một dữ liệu hay không. Ngoài ra cờ không xuất và phép thế
      lệnh giúp bắt gọn mã thoát lỗi khi đọc liên kết mềm gãy.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
  - show: '<p><b>Kiểm chứng thật trong container Alpine Linux về i-nốt và bộ đếm liên kết</b></p><div class="code"><div>MSYS_NO_PATHCONV=1
      docker run --rm postgres:17-alpine sh -c ''</div><div>  cd /tmp &amp;&amp; printf "hello_linux\n" &gt; orig.txt</div><div>  ln
      orig.txt hard.txt &amp;&amp; ln -s orig.txt sym.txt</div><div>  o=<span>&#36;</span>(stat -c %i:%h orig.txt) h=<span>&#36;</span>(stat
      -c %i:%h hard.txt)</div><div>  s=<span>&#36;</span>(stat -c %i:%h sym.txt); echo "before: <span>&#36;</span>o | <span>&#36;</span>h
      | <span>&#36;</span>s"</div><div>  rm orig.txt</div><div>  echo "hard_cat=<span>&#36;</span>(cat hard.txt) nlinks=<span>&#36;</span>(stat
      -c %h hard.txt)"</div><div>  cat sym.txt &gt;/dev/null 2&gt;&amp;1; echo "sym_rc=<span>&#36;</span>?"</div><div>  ls
      -d /etc /var /tmp /proc | tr "\n" " "</div><div>  echo ""</div><div>''</div></div>'
    say: Ta chạy trực tiếp một công-tai-nơ An-pin Li-núc thật để chứng minh hoạt động của bộ đếm liên kết và thư mục gốc.
      Kịch bản tạo một tệp văn bản, gắn thêm một liên kết cứng và một liên kết mềm, rồi xoá tệp nguồn và đo lại hai liên kết
      đó. Thí nghiệm trong Đốc-cơ An-pin bảo đảm môi trường chuẩn dòng lệnh thống nhất kể cả khi bạn thao tác từ máy Uyn-đâu.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>before: 258026:2 | 258026:2 | 258033:1</div><div>hard_cat=hello_linux
      nlinks=1</div><div>sym_rc=1</div><div>/etc /proc /tmp /var </div></div>'
    say: Đầu ra thật xác nhận liên kết cứng và tệp gốc giữ cùng mã số i-nốt với bộ đếm bằng hai. Sau khi xoá tệp nguồn, liên
      kết cứng vẫn đọc trọn vẹn chuỗi dữ liệu còn liên kết mềm trả mã thoát một báo lỗi không tìm thấy tệp. Mã thoát khác
      không từ liên kết mềm xác nhận đường dẫn đích không còn tồn tại trong khi liên kết cứng đọc hoàn hảo.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <table class='t'><tr><th>thư mục gốc kiểm ở trên</th><th>vai trò khi vận hành máy chủ</th></tr><tr><td><code>/etc</code>
      | <code>/var</code></td><td><code>/etc</code> chứa cấu hình tĩnh; <code>/var</code> giữ nhật ký thay đổi</td></tr><tr><td><code>/tmp</code>
      | <code>/proc</code></td><td><code>/tmp</code> chứa tệp tạm; <code>/proc</code> là cửa sổ ảo xem tiến trình nhân</td></tr></table>
    say: 'Bảng này tổng hợp vai trò bốn thư mục gốc ta vừa liệt kê trên môi trường Linux: etc giữ cấu hình tĩnh. Var giữ nhật
      ký biến động, tmp chứa tệp tạm, và proc phản chiếu tiến trình trực tiếp từ bộ nhớ nhân.'
- id: check
  kind: check
  title: 'Đối chứng cục bộ: tạo liên kết cứng rồi xoá bản đầu'
  checks:
  - (2 - 1) >= 1
  steps:
  - show: '<p><b>Tạo liên kết cứng và kiểm tra cùng i-nốt trước khi xoá tên đầu</b></p><div class="code"><div>mkdir -p test_ln
      &amp;&amp; cd test_ln</div><div>printf ''data_v1\n'' &gt; a.txt</div><div>ln a.txt b.txt</div><div>inode_a=<span>&#36;</span>(stat
      -c ''%i'' a.txt)</div><div>inode_b=<span>&#36;</span>(stat -c ''%i'' b.txt)</div><div>rm a.txt</div><div>echo "same_inode=<span>&#36;</span>((inode_a
      == inode_b ? 1 : 0)) after_rm_read=<span>&#36;</span>(cat b.txt)"</div></div>'
    say: Ở đường kiểm chứng thứ hai, ta chạy thẳng trên tệp cục bộ để đối chiếu mã số i-nốt trước và sau khi xoá tên đầu tiên.
      Vì cả hai tên cùng nắm giữ một nút chỉ mục nên phép so sánh hai mã số bắt buộc bằng nhau. Thử nghiệm cục bộ khẳng định
      hành vi đồng nhất bất biến của hệ thống tệp trước và sau lệnh xoá tên tệp ban đầu. Phép tính ba ngôi dấu hỏi chấm trả
      về một nếu hai mã i-nốt trùng nhau và không nếu khác nhau.
    focus:
    - 1
    - 2
    - 2
    - 2
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>same_inode=1 after_rm_read=data_v1</div></div>
    say: Đầu ra thật trả về cờ cùng i-nốt bằng một và đọc lại nguyên vẹn giá trị dữ liệu, vì việc xoá một tên tệp chỉ giảm
      bộ đếm liên kết từ hai xuống một. Chứng kiến bộ đếm giảm từ hai xuống một cùng dữ liệu giữ nguyên vẹn củng cố niềm tin
      tuyệt đối vào cơ chế i-nốt.
    clear: true
    focus:
    - 1
    - 2
- id: quymo
  kind: example
  title: Ảnh hưởng của liên kết và hệ thống tệp ảo qua ba quy mô dự án
  checks:
  - 100 * 20 == 2000
  steps:
  - show: <table class='t'><tr><th>tình huống</th><th>dữ liệu sao lưu / lưu trữ</th><th>khác biệt khi dùng liên kết cứng</th></tr><tr><td>Dự
      án nhỏ (10 bản sao)</td><td>10 × 10 MB = 100 MB trùng lặp</td><td>Dùng 10 MB thật nhờ trỏ chung i-nốt (tiết kiệm 90%)</td></tr><tr><td>Dịch
      vụ vừa (100 tệp gói)</td><td>100 × 20 MB = 2 000 MB</td><td>Kho gói toàn cầu giữ 1 bản 20 MB (giảm 99% đĩa)</td></tr><tr><td>Lịch
      sử lớn (1 000 ảnh chụp)</td><td>1 000 × 50 MB = 50 GB</td><td>Chỉ tốn dung lượng cho phần tệp mới thay đổi</td></tr></table>
    say: Bảng quy mô giải thích vì sao các trình quản lý gói hiện đại và công cụ sao lưu gia tăng đều tận dụng liên kết cứng.
      Khi mười bản dự án cần cùng bộ thư viện mười mê-ga-bai, liên kết cứng giữ chỉ một bản duy nhất trên đĩa giúp tiết kiệm
      chín mươi phần trăm dung lượng. Lên tới quy mô một trăm đến một nghìn ảnh chụp, cách làm này giảm hàng chục gi-ga-bai
      sao chép thừa thãi. Kỹ thuật chia sẻ chung i-nốt cho những tệp giống hệt nhau giúp tiết kiệm hàng chục gi-ga-bai đĩa
      trên máy chủ xây dựng gói.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1:
      Nhầm liên kết mềm giống hệt liên kết cứng.</b> Khi tệp gốc đổi tên hoặc chuyển thư mục, mọi liên kết mềm trỏ tới nó
      lập tức hỏng.<br><b>Lỗi 2: Tạo liên kết cứng xuyên khác phân vùng đĩa.</b> Mỗi phân vùng đánh số i-nốt riêng nên liên
      kết cứng không vượt ranh giới phân vùng.<br><b>Lỗi 3: Chỉnh sửa cấu hình trong thư mục ảo /proc như tệp đĩa thường.</b>
      Các tệp trong đó là cửa sổ trực tiếp vào bộ nhớ nhân đang chạy.</div></td></tr></table>'
    say: Hãy tránh ba lỗi rất phổ biến khi thao tác cây thư mục Li-núc. Lỗi đầu là nhầm liên kết mềm bền vững như liên kết
      cứng khiến cấu hình đứt gãy ngay khi dời thư mục gốc. Lỗi thứ hai là cố tạo liên kết cứng băng qua hai phân vùng ổ đĩa
      độc lập dù bảng mã i-nốt nằm riêng từng phân vùng. Lỗi thứ ba là tưởng thư mục hệ thống tiến trình ảo giống tệp văn
      bản thông thường. Gặp sự cố ổ đĩa báo đầy nhưng không tìm thấy tệp to nào là dấu hiệu điển hình của tệp đã xoá tên nhưng
      vẫn bị dịch vụ mở khoá. Ngoài ra nhớ hạn chế liên kết cứng không trỏ chéo sang ổ đĩa hoặc phân vùng khác vì mỗi phân
      vùng có bảng mã i-nốt riêng.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - 0
    - 0
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - (2 - 1) >= 1
  steps:
  - show: <ol><li>Ban đầu tệp A có <code>link_count = 2</code> do đã liên kết cứng với B. Nếu chạy <code>rm A</code>, dữ liệu
      có bị mất không?</li><li>Thư mục gốc nào chứa thông tin các tiến trình đang chạy trong bộ nhớ nhân?</li></ol>
    say: Đến lượt bạn tự kiểm tra kiến thức vừa học. Câu một, một tệp có hai tên liên kết cứng với nhau rồi xoá mất một tên
      thì dữ liệu có còn hay không? Câu hai, thư mục gốc nào hiển thị thông tin các tiến trình đang chạy trực tiếp từ nhân
      hệ điều hành? Hãy bấm tạm dừng và trả lời ra giấy.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Không mất, vì sau khi xoá A thì <code>link_count = 1
      &gt; 0</code> nên B vẫn đọc đầy đủ dữ liệu.</p></td></tr></table>
    say: 'Đáp án câu một: dữ liệu không hề bị mất vì bộ đếm liên kết vẫn còn bằng một nên tên thứ hai tiếp tục đọc trọn vẹn.
      Vì liên kết cứng giữ chung một mã chỉ mục gốc nên dữ liệu chỉ thật sự bị thu hồi khi không còn bất kỳ tên tệp hay tiến
      trình nào bám giữ. Nhớ quy luật hai chốt chặn: chỉ khi cả số tên lẫn số tay cầm đang mở cùng tụt về không thì dữ liệu
      mới thực sự bị xoá.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Thư mục ảo <code>/proc</code> (mỗi thư mục con mang
      số PID của một tiến trình đang chạy).</p></td></tr></table>
    say: 'Đáp án câu hai: đó là thư mục ảo hệ thống tiến trình, nơi chứa từng thư mục đánh số theo mã tiến trình đang hoạt
      động. Hiểu đúng đường dẫn tương đối và tuyệt đối khi tạo liên kết mềm sẽ giúp bạn tránh lỗi liên kết đứt khi di chuyển
      thư mục cấu hình. Thư mục hệ thống tiến trình là cửa sổ quan sát trực tiếp vào bộ nhớ nhân mà không tiêu tốn một bai
      nào trên ổ cứng.'
    clear: true
