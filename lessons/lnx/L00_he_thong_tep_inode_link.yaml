  - show: <table class='t'><tr><th>khái niệm / lệnh mới</th><th>vai trò chuẩn trên hệ thống</th></tr><tr><td>inode (nút chỉ
      mục)</td><td>Cấu trúc đánh số duy nhất lưu siêu dữ liệu và vị trí khối của tệp</td></tr><tr><td><code>ln A B</code></td><td>Tạo
      liên kết cứng B dùng chung số nút chỉ mục với A (nlinks tăng +1)</td></tr><tr><td><code>ln -s A C</code></td><td>Tạo
      liên kết mềm C chỉ lưu chuỗi đường dẫn trỏ sang tên tệp A</td></tr><tr><td><code>/etc /var /tmp /proc</code></td><td>Thư
      mục cấu hình tĩnh, nhật ký biến đổi, tệp tạm và thông số nhân đang chạy</td></tr></table>
    say: Bảng này giải mã bốn thành phần trọng tâm giúp bạn đọc hiểu toàn bộ hệ thống tệp Li-núc. Mỗi tệp thực chất được đại
      diện bởi một nút chỉ mục mang mã số duy nhất trên phân vùng đĩa gọi là i-nốt. Liên kết cứng tạo thêm tên mới bám chung
      vào i-nốt đó nên bộ đếm tăng một, còn liên kết mềm chỉ giữ tên đường dẫn. Bên dưới là bốn thư mục gốc quen thuộc gồm
      cấu hình tĩnh, nhật ký thay đổi, tệp tạm và hệ thống tệp ảo của nhân. Một nút chỉ mục có thể có nhiều tên tệp trỏ tới
      ở các thư mục khác nhau miễn là tất cả cùng nằm trên một phân vùng đĩa. Ngược lại liên kết mềm lưu lại đường dẫn dạng
      chuỗi ký tự nên đi xuyên phân vùng được nhưng dễ đứt nếu tệp đích biến mất.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    - '1.5'
    clear: true
    introduces:
    - lnx_inode
