  steps:
  - show: <table class='t'><tr><th>nền tảng từ bài trước</th><th>liên kết với sự cố hết đĩa</th></tr><tr><td>Mỗi tệp và thư
      mục riêng dùng 1 i-nốt (L00)</td><td>Không thể tạo tệp mới nếu bảng i-nốt đã cạn kiệt</td></tr><tr><td>Dùng đường ống
      lọc sắp xếp đếm nhanh (L03)</td><td>Tìm chính xác thư mục nào đang ôm hàng triệu tệp nhỏ</td></tr></table>
    say: Ta ghép bài 0 và bài 3 để xử lý sự cố đĩa ảo. Nhờ bài 0 ta biết mỗi tệp lẫn mỗi thư mục đều tốn đúng một mục trong
      bảng i-nốt cố định của phân vùng. Nhờ đường ống lọc từ bài 3, ta dễ dàng thống kê thư mục nào đang tích trữ lượng tệp
      khổng lồ. Số lượng mục tối đa trong bảng chỉ mục được ấn định cố định ngay từ lúc định dạng phân vùng lần đầu tiên.
      Hết chỗ lưu i-nốt đồng nghĩa với việc không thể sinh thêm bất kỳ tệp hay thư mục con mới nào dù ổ trống hàng trăm gi-ga-bai.
