scenes:
- id: hook
  kind: hook
  title: Báo hết đĩa dù df -h chỉ báo mới dùng 40%?
  checks:
  - 10000 + 1 == 10001
  steps:
  - show: <div class='box key'><p>Một dịch vụ sinh <b>10 triệu tệp phiên (session) rỗng</b> kích thước vài chục
      byte trong thư mục <code>/tmp</code>.</p><p>Dung lượng ổ đĩa mới tốn 40%, nhưng toàn bộ bảng chỉ mục tệp đã
      hết sạch chỗ trống, khiến hệ thống không tạo nổi một tệp 1 byte nào nữa.</p></div>
    say: Chào bạn, đây là một trong những sự cố kinh điển khiến nhiều kỹ sư vận hành lúng túng hàng giờ liền. Ứng
      dụng đột ngột báo lỗi hết dung lượng ổ đĩa nhưng khi chạy lệnh kiểm tra phần trăm đĩa thì thấy mới dùng có
      bốn mươi phần trăm. Thủ phạm nằm ở giới hạn số lượng i-nốt mà phân vùng đĩa hỗ trợ cho các tệp nhỏ xíu. Hôm
      nay ta học cách kiểm tra song song dung lượng khối lẫn số i-nốt và tính đúng mức tiêu thụ trên thư mục.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng từ bài trước</th><th>liên kết với sự cố hết đĩa</th></tr><tr><td>Mỗi
      tệp và thư mục riêng dùng 1 i-nốt (L00)</td><td>Không thể tạo tệp mới nếu bảng i-nốt đã cạn kiệt</td></tr><tr><td>Dùng
      đường ống lọc sắp xếp đếm nhanh (L03)</td><td>Tìm chính xác thư mục nào đang ôm hàng triệu tệp nhỏ</td></tr></table>
    say: Ta ghép bài 0 và bài 3 để xử lý sự cố đĩa ảo. Nhờ bài 0 ta biết mỗi tệp lẫn mỗi thư mục đều tốn đúng một
      mục trong bảng i-nốt cố định của phân vùng. Nhờ đường ống lọc từ bài 3, ta dễ dàng thống kê thư mục nào đang
      tích trữ lượng tệp khổng lồ.
    focus:
    - 0
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và lệnh mới
  steps:
  - show: <table class='t'><tr><th>lệnh kiểm tra đĩa</th><th>những gì nó thực sự đo</th></tr><tr><td><code>df -h</code></td><td>Kiểm
      tra phần trăm dung lượng khối dữ liệu (GB) đang dùng và còn trống</td></tr><tr><td><code>df -i</code></td><td>Kiểm
      tra số lượng i-nốt tối đa, đã dùng và phần trăm i-nốt còn lại</td></tr><tr><td><code>du -sh *</code></td><td>Đo
      dung lượng thật từng thư mục con (khác với đếm số lượng tệp)</td></tr></table>
    say: Trên bảng là ba lệnh đo đạc lưu trữ không thể thiếu khi ứng cứu máy chủ. Lệnh đầu kiểm tra phần trăm dung
      lượng khối dữ liệu tính bằng gi-ga-bai. Lệnh thứ hai kiểm tra số lượng nút chỉ mục i-nốt đã dùng trên mỗi
      phân vùng. Lệnh thứ ba đo tổng kích thước từng thư mục để khoanh vùng chỗ đang phình to.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: 'Hai giới hạn độc lập trên cùng một phân vùng: khối dữ liệu vs khe i-nốt'
  steps:
  - show: '<div><svg width="960" height="200" viewBox="0 0 960 200"><rect x="40" y="45" width="410" height="110"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="245.0" y="93" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Bãi dữ liệu (df -h): 40% đã dùng</text><text x="245.0" y="126" font-size="15"
      text-anchor="middle" fill="#475569">Còn dư 60 GB cho nội dung lớn</text><rect x="510" y="45" width="410" height="110"
      rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="715.0" y="93" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Bảng thẻ i-nốt (df -i): 100% ĐẦY</text><text x="715.0" y="126" font-size="15"
      text-anchor="middle" fill="#475569">Cạn sạch chỗ tạo thêm tệp dù 0 byte</text></svg></div>'
    say: Hãy tưởng tượng phân vùng đĩa giống một thư viện có hai tài nguyên hoàn toàn tách biệt. Bên trái là kệ
      sách rộng lớn chứa dung lượng ghi dữ liệu mới lấp bốn mươi phần trăm. Bên phải là tủ phiếu đánh số i-nốt có
      số ngăn cố định từ lúc định dạng đĩa. Nay tủ phiếu đã đầy kín một trăm phần trăm nên không thể cấp thẻ mới
      cho bất kỳ tệp nào.
    clear: true
- id: formula
  kind: formula
  title: Công thức đếm i-nốt tiêu thụ trong thư mục
  checks:
  - alg.lnx_inode_used(10_000) == 10_001
  steps:
  - show: '<div class=''box key''><p>Mỗi tệp thông thường chiếm $1$ i-nốt <b>và</b> chính thư mục chứa nó cũng chiếm
      $1$ i-nốt.</p><p>Do đó một thư mục chứa $N$ tệp rỗng $0$ byte tốn $N \times 0 = \hl{0\text{ byte}}$ dữ liệu,
      nhưng tiêu thụ đúng $N + 1$ i-nốt.</p><p>Với $N = 10\,000$ tệp rỗng: tổng i-nốt $= 10\,000 + 1 = \hl{10\,001}$
      i-nốt.</p></div>'
    say: Công thức đếm rất chính xác vì cả tệp thường lẫn thư mục chứa đều là một đối tượng trong cây hệ thống tệp.
      Một tệp rỗng không bai không tiêu tốn thêm khối lưu trữ dữ liệu nhưng vẫn bắt buộc phải giữ một mục i-nốt
      riêng. Vì vậy thư mục chứa mười nghìn tệp rỗng tiêu thụ đúng mười nghìn cộng một bằng mười nghìn không trăm
      linh một i-nốt.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên Docker: kiểm df -h, df -i và đếm i-nốt'
  checks:
  - alg.lnx_inode_used(200) == 201
  steps:
  - show: <table class='t'><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>find dir | wc
      -l</code></td><td>Đếm cả thư mục cha lẫn tất cả tệp con (= số i-nốt riêng biệt nếu không có hardlink)</td></tr><tr><td><code>df
      -i /tmp</code></td><td>Đọc số lượng i-nốt tối đa và hiện có của phân vùng chứa <code>/tmp</code></td></tr></table>
    say: Giải thích hai lệnh đếm số lượng đối tượng trên phân vùng trước khi chạy thử nghiệm trên hệ thống tệp Li-núc.
    clear: true
  - show: '<p><b>Chạy thật trên Docker Alpine: đo df -h, df -i và tạo 200 tệp 0 byte đếm i-nốt</b></p><div class="code"><div>MSYS_NO_PATHCONV=1
      docker run --rm postgres:17-alpine sh -c ''</div><div>  mkdir -p /tmp/sess; i=1</div><div>  while [ <span>&#36;</span>i
      -le 200 ]; do : &gt; /tmp/sess/f_<span>&#36;</span>i; i=<span>&#36;</span>((i+1)); done</div><div>  cnt=<span>&#36;</span>(find
      /tmp/sess | wc -l)</div><div>  db=<span>&#36;</span>(cat /tmp/sess/f_* | wc -c)</div><div>  sz=<span>&#36;</span>(du
      -sk /tmp/sess | awk "{print \<span>&#36;</span>1}")</div><div>  df -h /tmp | tail -n 1 | awk "{print \"blocks_pct=\"\<span>&#36;</span>5}"</div><div>  echo
      "objects=<span>&#36;</span>cnt content_bytes=<span>&#36;</span>db dir_meta_kb=<span>&#36;</span>sz"</div><div>''</div></div>'
    say: Ta chạy trực tiếp trong công-tai-nơ Li-núc để quan sát hai báo cáo đĩa rồi tạo một thư mục chứa hai trăm
      tệp không bai. Sau đó dùng lệnh tìm kiếm đếm toàn bộ phần tử và kiểm tra tổng dung lượng nội dung lẫn siêu
      dữ liệu thư mục.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>blocks_pct=6%</div><div>objects=201
      content_bytes=0 dir_meta_kb=4</div></div>
    say: Đầu ra thật xác nhận hai trăm tệp rỗng cùng thư mục cha tạo thành hai trăm linh một đối tượng i-nốt. Tổng
      dữ liệu nội dung bằng không bai và thư mục chỉ tốn bốn ki-lô-bai siêu dữ liệu tên tệp.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chéo mô hình số i-nốt cho 10 000 tệp rỗng
  checks:
  - alg.lnx_inode_used(10000) == 10001
  steps:
  - show: <p><b>Tính ngược dung lượng dữ liệu và số i-nốt khi có 10 000 tệp 0 byte</b></p><div class="code"><div>n=10000;
      d=1; echo "data_bytes=<span>&#36;</span>((n * 0)) inodes=<span>&#36;</span>((n + d))"</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tính lại mức tiêu thụ i-nốt cho mười nghìn tệp rỗng vì cần xác nhận công
      thức cộng một thư mục.
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>data_bytes=0 inodes=10001</div></div>
    say: Kết quả tính toán xác nhận dữ liệu bằng không bai và số i-nốt bằng mười nghìn không trăm linh một vì mỗi
      tệp cộng thêm một thư mục cha đều tốn một i-nốt.
    clear: true
- id: quymo
  kind: example
  title: Khi nào bảng i-nốt chạm trần qua ba quy mô tệp nhỏ
  checks:
  - 100000 * 100 == 10_000_000
  steps:
  - show: <table class='t'><tr><th>quy mô tạo tệp nhỏ (100 byte/tệp)</th><th>dung lượng khối thực chiếm</th><th>số
      i-nốt bị ngốn trên phân vùng</th></tr><tr><td>1 000 tệp phiên</td><td>~100 KB (gần 0%)</td><td>1 001 i-nốt</td></tr><tr><td>100
      000 tệp phiên rác</td><td>~10 MB (0,1% đĩa 10 GB)</td><td>100 001 i-nốt (~15% bảng i-nốt)</td></tr><tr><td>655
      360 tệp trên đĩa 10 GB (~16KB/i-nốt)</td><td>~65 MB (chưa tới 1% đĩa)</td><td>100% i-nốt ĐẦY CỨNG → Sập toàn
      máy</td></tr></table>
    say: Bảng quy mô giải thích vì sao một phân vùng mười gi-ga-bai chỉ mới dùng chưa tới một phần trăm dung lượng
      nhưng đã sập hoàn toàn. Với cấu hình định dạng mặc định, cứ khoảng mười sáu ki-lô-bai ổ đĩa mới sinh ra một
      i-nốt nên tổng phân vùng chứa được hơn sáu trăm năm mươi nghìn tệp. Chỉ cần một dịch vụ rác sinh đủ con số
      tệp đó thì toàn máy không tạo nổi thêm bất kỳ tệp mới nào nữa.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: Chỉ xem <code>df -h</code> rồi kết luận đĩa không hề đầy.</b> Khi ứng dụng báo hết chỗ, luôn chạy thêm
      <code>df -i</code> ngay lập tức.<br><b>Lỗi 2: Dùng <code>rm /tmp/sess/*</code> trên thư mục có 500 000 tệp.</b>
      Lệnh mở rộng ký tự sao sẽ văng lỗi ''Argument list too long''; hãy dùng <code>find ... -delete</code>.<br><b>Lỗi
      3: Xoá nhầm tệp lớn đang có tiến trình giữ mở mà tưởng dung lượng về ngay.</b> Như bài 0 đã dạy, chỗ trống
      chỉ nhả ra khi tiến trình đóng tệp.</div></td></tr></table>'
    say: Có ba cái bẫy rất hay gặp khi xử lý đầy đĩa trên máy chủ thật. Thứ nhất chỉ xem phần trăm dung lượng mà
      bỏ quên kiểm tra số i-nốt còn lại. Thứ hai chạy lệnh xoá kèm dấu sao lên thư mục nửa triệu tệp làm dòng lệnh
      vỡ tràn danh sách đối số thay vì dùng lệnh tìm để xoá từng đợt. Thứ ba xoá nhầm nhật ký đang được tiến trình
      mở nên dung lượng đĩa vẫn không giảm xuống.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - alg.lnx_inode_used(50) == 51
  steps:
  - show: <ol><li>Ổ đĩa báo <code>df -h</code> dùng 35% nhưng <code>df -i</code> dùng 100%. Kết quả khi chạy <code>touch
      new.txt</code> là gì?</li><li>Một thư mục mới tạo chứa 50 tệp 0 byte tiêu thụ tất cả bao nhiêu i-nốt?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, nếu dung lượng khối mới chiếm ba mươi lăm phần trăm nhưng bảng i-nốt
      đã đạt một trăm phần trăm, lệnh tạo tệp mới sẽ thành công hay thất bại? Câu hai, một thư mục chứa đúng năm
      mươi tệp không bai tiêu thụ tất cả bao nhiêu i-nốt? Bấm tạm dừng và trả lời ra giấy.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Thất bại ngay với lỗi hết chỗ (<code>No space
      left on device</code>), vì không còn khe i-nốt trống.</p></td></tr></table>
    say: 'Đáp án câu một: lệnh tạo tệp thất bại ngay lập tức vì hết hoàn toàn khe i-nốt dù dung lượng đĩa vẫn còn
      rất rộng.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② 50 tệp + 1 thư mục chứa = <b>51 i-nốt</b>.</p></td></tr></table>
    say: 'Đáp án câu hai: năm mươi tệp cộng thêm một i-nốt của chính thư mục chứa bằng đúng năm mươi mốt i-nốt.'
    clear: true
