- id: intuition
  kind: intuition
  title: 'Hai giới hạn độc lập trên cùng một phân vùng: khối dữ liệu vs khe i-nốt'
  steps:
  - show: '<div><svg width="960" height="200" viewBox="0 0 960 200"><rect x="40" y="45" width="410" height="110" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="2"/><text x="245.0" y="93" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Bãi
      dữ liệu (df -h): 40% đã dùng</text><text x="245.0" y="126" font-size="15" text-anchor="middle" fill="#475569">Còn dư
      60 GB cho nội dung lớn</text><rect x="510" y="45" width="410" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text
      x="715.0" y="93" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Bảng thẻ i-nốt (df -i): 100% ĐẦY</text><text
      x="715.0" y="126" font-size="15" text-anchor="middle" fill="#475569">Cạn sạch chỗ tạo thêm tệp dù 0 byte</text></svg></div>'
    say: 'Hãy tưởng tượng phân vùng đĩa giống một thư viện có hai tài nguyên hoàn toàn tách biệt. Bên trái là kệ sách rộng
      lớn chứa dung lượng ghi dữ liệu mới lấp bốn mươi phần trăm. Bên phải là tủ phiếu đánh số i-nốt có số ngăn cố định từ
      lúc định dạng đĩa. Nay tủ phiếu đã đầy kín một trăm phần trăm nên không thể cấp thẻ mới cho bất kỳ tệp nào. Hai giới
      hạn khối đĩa và số thẻ i-nốt chạy song song như hai bể chứa độc lập: cạn bất kỳ bể nào hệ thống đều chặn ghi mới.'
    clear: true
  - show: ''
    say: Tệp tin rỗng không tốn không gian chứa nội dung nhưng vẫn tiêu thụ đúng một thẻ ghi tên và thông số quản lý. Nhờ
      chỉ báo chỉ số nút và dung lượng khối tách rời, người quản trị nhanh chóng khoanh vùng nguyên nhân nghẽn đĩa. Theo dõi
      đồng thời cả hai thông số ngăn chặn lỗi không thể tạo tệp mới dù dung lượng trống vẫn còn nhiều. Cảnh báo kịp thời cả
      dung lượng khối lẫn số nút chỉ mục giúp tránh lỗi kẹt ghi bất ngờ giữa giờ cao điểm.
- id: formula
  kind: formula
  title: Công thức đếm i-nốt tiêu thụ trong thư mục
  checks:
  - alg.lnx_inode_used(10_000) == 10_001
  steps:
  - show: '<div class=''box key''><p>Mỗi tệp thông thường chiếm $1$ i-nốt <b>và</b> chính thư mục chứa nó cũng chiếm $1$ i-nốt.</p><p>Do
      đó một thư mục chứa $N$ tệp rỗng $0$ byte tốn $N \times 0 = \hl{0\text{ byte}}$ dữ liệu, nhưng tiêu thụ đúng $N + 1$
      i-nốt.</p><p>Với $N = 10\,000$ tệp rỗng: tổng i-nốt $= 10\,000 + 1 = \hl{10\,001}$ i-nốt.</p></div>'
    say: Công thức đếm rất chính xác vì cả tệp thường lẫn thư mục chứa đều là một đối tượng trong cây hệ thống tệp. Một tệp
      rỗng không bai không tiêu tốn thêm khối lưu trữ dữ liệu nhưng vẫn bắt buộc phải giữ một mục i-nốt riêng. Vì vậy thư
      mục chứa mười nghìn tệp rỗng tiêu thụ đúng mười nghìn cộng một bằng mười nghìn không trăm linh một i-nốt. Việc tách
      rõ báo cáo dung lượng khối từ lệnh đĩa với số lượng i-nốt còn lại giúp xử lý đúng nguyên nhân. Khi đếm kết quả trên
      cây thư mục, nhớ luôn cộng thêm đúng một đơn vị cho chính nút chỉ mục của thư mục mẹ chứa chúng.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên Docker: kiểm df -h, df -i và đếm i-nốt'
  checks:
  - alg.lnx_inode_used(200) == 201
  steps:
  - show: <table class='t'><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>find dir | wc -l</code></td><td>Đếm
      cả thư mục cha lẫn tất cả tệp con (= số i-nốt riêng biệt nếu không có hardlink)</td></tr><tr><td><code>df -i /tmp</code></td><td>Đọc
      số lượng i-nốt tối đa và hiện có của phân vùng chứa <code>/tmp</code></td></tr></table>
    say: Giải thích hai lệnh đếm số lượng đối tượng trên phân vùng trước khi chạy thử nghiệm trên hệ thống tệp Li-núc. Kết
      hợp lệnh liệt kê đối tượng với bộ đếm dòng cho số lượng i-nốt tiêu thụ chính xác tới từng tệp.
    clear: true
  - show: '<p><b>Chạy thật trên Docker Alpine: đo df -h, df -i và tạo 200 tệp 0 byte đếm i-nốt</b></p><div class="code"><div>MSYS_NO_PATHCONV=1
      docker run --rm postgres:17-alpine sh -c ''</div><div>  mkdir -p /tmp/sess; i=1</div><div>  while [ <span>&#36;</span>i
      -le 200 ]; do : &gt; /tmp/sess/f_<span>&#36;</span>i; i=<span>&#36;</span>((i+1)); done</div><div>  cnt=<span>&#36;</span>(find
      /tmp/sess | wc -l)</div><div>  db=<span>&#36;</span>(cat /tmp/sess/f_* | wc -c)</div><div>  sz=<span>&#36;</span>(du
      -sk /tmp/sess | awk "{print \<span>&#36;</span>1}")</div><div>  df -h /tmp | tail -n 1 | awk "{print \"blocks_pct=\"\<span>&#36;</span>5}"</div><div>  echo
      "objects=<span>&#36;</span>cnt content_bytes=<span>&#36;</span>db dir_meta_kb=<span>&#36;</span>sz"</div><div>''</div></div>'
    say: Ta chạy trực tiếp trong công-tai-nơ Li-núc để quan sát hai báo cáo đĩa rồi tạo một thư mục chứa hai trăm tệp không
      bai. Sau đó dùng lệnh tìm kiếm đếm toàn bộ phần tử và kiểm tra tổng dung lượng nội dung lẫn siêu dữ liệu thư mục. Tạo
      hàng loạt hai trăm tệp không bai trong công-tai-nơ tái hiện rõ ràng hiện tượng ăn mòn i-nốt mà không nhích phần trăm
      khối.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>blocks_pct=6%</div><div>objects=201
      content_bytes=0 dir_meta_kb=4</div></div>
    say: Đầu ra thật xác nhận hai trăm tệp rỗng cùng thư mục cha tạo thành hai trăm linh một đối tượng i-nốt. Tổng dữ liệu
      nội dung bằng không bai và thư mục chỉ tốn bốn ki-lô-bai siêu dữ liệu tên tệp. Tổng không bai nội dung nhưng tiêu tốn
      tới hai trăm linh một đối tượng chỉ mục minh hoạ kịch bản cạn kiệt tài nguyên i-nốt.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <table class='t'><tr><th>lệnh kiểm đĩa</th><th>ý nghĩa cột phần trăm</th><th>dấu hiệu đầy bất thường</th></tr><tr><td><code>df
      -h /tmp</code></td><td><code>Use%</code> (tổng khối dữ liệu MB/GB đã chiếm)</td><td>mới 6% hoặc 40% vẫn có thể lỗi hết
      chỗ</td></tr><tr><td><code>df -i /tmp</code></td><td><code>IUse%</code> (số lượng i-nốt <code>IUsed / Inodes</code>
      đã cấp)</td><td class='red'><code>IUse% = 100%</code> là cạn sạch khe tạo tệp mới!</td></tr></table>
    say: Ghi nhớ ghép cặp hai lệnh kiểm đĩa ngay khi ứng dụng báo hết chỗ. Df trừ h đo phần trăm khối dữ liệu còn df trừ i
      đọc cột IUse để xem bảng i-nốt đã chạm một trăm phần trăm hay chưa.
- id: check
  kind: check
  title: Kiểm chéo mô hình số i-nốt cho 10 000 tệp rỗng
  checks:
  - alg.lnx_inode_used(10000) == 10001
  steps:
  - show: <p><b>Tính ngược dung lượng dữ liệu và số i-nốt khi có 10 000 tệp 0 byte</b></p><div class="code"><div>n=10000;
      d=1; echo "data_bytes=<span>&#36;</span>((n * 0)) inodes=<span>&#36;</span>((n + d))"</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tính lại mức tiêu thụ i-nốt cho mười nghìn tệp rỗng vì cần xác nhận công thức cộng
      một thư mục. Nhân quy mô lên mười nghìn tệp rỗng xác nhận kích thước dữ liệu vẫn bằng không trong khi bảng chỉ mục mất
      thêm mười nghìn không trăm linh một ô.
    clear: true
    focus:
    - 1
    - 2
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>data_bytes=0 inodes=10001</div></div>
    say: Kết quả tính toán xác nhận dữ liệu bằng không bai và số i-nốt bằng mười nghìn không trăm linh một vì mỗi tệp cộng
      thêm một thư mục cha đều tốn một i-nốt. Đối chiếu con số từ phép nhân dữ liệu bằng không với tổng đối tượng thư mục
      xác nhận rõ sự tách biệt giữa không gian khối lưu trữ và bảng chỉ mục tệp. Số liệu thực chứng củng cố nguyên lý theo
      dõi đồng thời cả hai thước đo đĩa trong mọi hệ thống cảnh báo máy chủ.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: Khi nào bảng i-nốt chạm trần qua ba quy mô tệp nhỏ
  checks:
  - 100000 * 100 == 10_000_000
  steps:
  - show: <table class='t'><tr><th>quy mô tạo tệp nhỏ (100 byte/tệp)</th><th>dung lượng khối thực chiếm</th><th>số i-nốt bị
      ngốn trên phân vùng</th></tr><tr><td>1 000 tệp phiên</td><td>~100 KB (gần 0%)</td><td>1 001 i-nốt</td></tr><tr><td>100
      000 tệp phiên rác</td><td>~10 MB (0,1% đĩa 10 GB)</td><td>100 001 i-nốt (~15% bảng i-nốt)</td></tr><tr><td>655 360 tệp
      trên đĩa 10 GB (~16KB/i-nốt)</td><td>~65 MB (chưa tới 1% đĩa)</td><td>100% i-nốt ĐẦY CỨNG → Sập toàn máy</td></tr></table>
    say: Bảng quy mô giải thích vì sao một phân vùng mười gi-ga-bai chỉ mới dùng chưa tới một phần trăm dung lượng nhưng đã
      sập hoàn toàn. Với cấu hình định dạng mặc định, cứ khoảng mười sáu ki-lô-bai ổ đĩa mới sinh ra một i-nốt nên tổng phân
      vùng chứa được hơn sáu trăm năm mươi nghìn tệp. Chỉ cần một dịch vụ rác sinh đủ con số tệp đó thì toàn máy không tạo
      nổi thêm bất kỳ tệp mới nào nữa. Các ứng dụng quên dọn thư mục đệm hoặc phiên đăng nhập rất dễ làm tê liệt toàn bộ nút
      mạng do hết i-nốt chỉ sau vài tuần.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1:
      Chỉ xem <code>df -h</code> rồi kết luận đĩa không hề đầy.</b> Khi ứng dụng báo hết chỗ, luôn chạy thêm <code>df -i</code>
      ngay lập tức.<br><b>Lỗi 2: Dùng <code>rm /tmp/sess/*</code> trên thư mục có 500 000 tệp.</b> Lệnh mở rộng ký tự sao
      sẽ văng lỗi ''Argument list too long''; hãy dùng <code>find ... -delete</code>.<br><b>Lỗi 3: Xoá nhầm tệp lớn đang có
      tiến trình giữ mở mà tưởng dung lượng về ngay.</b> Như bài 0 đã dạy, chỗ trống chỉ nhả ra khi tiến trình đóng tệp.</div></td></tr></table>'
    say: Có ba cái bẫy rất hay gặp khi xử lý đầy đĩa trên máy chủ thật. Thứ nhất chỉ xem phần trăm dung lượng mà bỏ quên kiểm
      tra số i-nốt còn lại. Thứ hai chạy lệnh xoá kèm dấu sao lên thư mục nửa triệu tệp làm dòng lệnh vỡ tràn danh sách đối
      số thay vì dùng lệnh tìm để xoá từng đợt. Thứ ba xoá nhầm nhật ký đang được tiến trình mở nên dung lượng đĩa vẫn không
      giảm xuống. Cẩn thận khi gặp tệp bị xoá nhưng vẫn giữ tay cầm từ tiến trình đang chạy vì lệnh kiểm tra thư mục thông
      thường không thấy được. Dùng thêm lệnh quét danh sách tệp đang mở giúp phát hiện tức thì tiến trình nào đang ghim chặt
      dung lượng ảo chưa chịu nhả.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - 0
    - 0
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - alg.lnx_inode_used(50) == 51
  steps:
  - show: <ol><li>Ổ đĩa báo <code>df -h</code> dùng 35% nhưng <code>df -i</code> dùng 100%. Kết quả khi chạy <code>touch new.txt</code>
      là gì?</li><li>Một thư mục mới tạo chứa 50 tệp 0 byte tiêu thụ tất cả bao nhiêu i-nốt?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, nếu dung lượng khối mới chiếm ba mươi lăm phần trăm nhưng bảng i-nốt đã đạt một
      trăm phần trăm, lệnh tạo tệp mới sẽ thành công hay thất bại? Câu hai, một thư mục chứa đúng năm mươi tệp không bai tiêu
      thụ tất cả bao nhiêu i-nốt? Bấm tạm dừng và trả lời ra giấy.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Thất bại ngay với lỗi hết chỗ (<code>No space left on
      device</code>), vì không còn khe i-nốt trống.</p></td></tr></table>
    say: 'Đáp án câu một: lệnh tạo tệp thất bại ngay lập tức vì hết hoàn toàn khe i-nốt dù dung lượng đĩa vẫn còn rất rộng.
      Theo dõi đồng thời phần trăm dung lượng lẫn chỉ mục tệp giúp kỹ sư vận hành tránh được những sự cố dừng dịch vụ khó
      hiểu vì tạo quá nhiều tệp rỗng. Thấy báo lỗi hết dung lượng đĩa, phản xạ chuẩn đầu tiên là chạy song song hai lệnh kiểm
      tra khối đĩa và kiểm tra bảng i-nốt.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② 50 tệp + 1 thư mục chứa = <b>51 i-nốt</b>.</p></td></tr></table>
    say: 'Đáp án câu hai: năm mươi tệp cộng thêm một i-nốt của chính thư mục chứa bằng đúng năm mươi mốt i-nốt. Dọn dẹp định
      kỳ các thư mục chứa tệp phiên nhỏ hoặc gộp dữ liệu vào cơ sở dữ liệu tránh làm cạn kiệt chỉ mục của phân vùng đĩa. Đếm
      đủ cả tệp con lẫn chính thư mục cha rèn tính chính xác khi quy hoạch phân vùng chứa hàng triệu tệp ảnh nhỏ.'
    clear: true
