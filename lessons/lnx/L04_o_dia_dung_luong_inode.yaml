      tra phần trăm dung lượng khối dữ liệu (GB) đang dùng và còn trống</td></tr><tr><td><code>df -i</code></td><td>Kiểm tra
      số lượng i-nốt tối đa, đã dùng và phần trăm i-nốt còn lại</td></tr><tr><td><code>du -sh *</code></td><td>Đo dung lượng
