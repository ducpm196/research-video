- id: hook
  kind: hook
  title: Báo hết đĩa dù df -h chỉ báo mới dùng 40%?
  checks:
  - 10000 + 1 == 10001
  steps:
  - show: <div class='box key'><p>Một dịch vụ sinh <b>10 triệu tệp phiên (session) rỗng</b> kích thước vài chục byte trong
      thư mục <code>/tmp</code>.</p><p>Dung lượng ổ đĩa mới tốn 40%, nhưng toàn bộ bảng chỉ mục tệp đã hết sạch chỗ trống,
      khiến hệ thống không tạo nổi một tệp 1 byte nào nữa.</p></div>
    say: Chào bạn, đây là một trong những sự cố kinh điển khiến nhiều kỹ sư vận hành lúng túng hàng giờ liền. Ứng dụng đột
      ngột báo lỗi hết dung lượng ổ đĩa nhưng khi chạy lệnh kiểm tra phần trăm đĩa thì thấy mới dùng có bốn mươi phần trăm.
      Thủ phạm nằm ở giới hạn số lượng i-nốt mà phân vùng đĩa hỗ trợ cho các tệp nhỏ xíu. Hôm nay ta học cách kiểm tra song
      song dung lượng khối lẫn số i-nốt và tính đúng mức tiêu thụ trên thư mục. Ứng dụng tạo quá nhiều tệp tin nhỏ li ti vắt
      kiệt bảng thẻ mục trước khi dung lượng lưu trữ chạm tới nửa ổ đĩa. Bỏ sót lệnh kiểm tra số lượng i-nốt khiến nhiều kỹ
      sư tốn hàng giờ tìm tệp lớn vô ích trong khi vấn đề nằm ở hàng triệu tệp rỗng.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
