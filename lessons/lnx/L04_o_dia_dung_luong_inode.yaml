- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>df -h (GB)</span><span class='a'>≠</span><span class='n'>df -i (số lượng i-nốt)</span><span
      class='a'>|</span><span class='n'>N tệp + 1 thư mục = N + 1 i-nốt</span></div>
    say: Tổng kết công thức chẩn đoán lưu trữ cần nắm chắc sau bài 4. Luôn kiểm tra đồng thời dung lượng khối và giới hạn
      i-nốt mỗi khi gặp thông báo hết chỗ. Nhớ rằng mỗi thư mục chứa N tệp luôn tiêu thụ tổng cộng N cộng một i-nốt bất kể
      kích thước tệp bằng không. Theo dõi song song khối đĩa và chỉ mục i-nốt giúp phòng ngừa sập hệ thống do nhiều tệp nhỏ.
      Giám sát đồng thời dung lượng khối và giới hạn i-nốt bảo vệ hệ thống trước cả hai kịch bản nghẽn lưu trữ phổ biến nhất.
      Khi hệ thống tệp và tiến trình cục bộ đã ổn định, ta tiến ra tầng kết nối mạng giữa các dịch vụ trong bài năm.
