      dữ liệu tính bằng gi-ga-bai. Lệnh thứ hai kiểm tra số lượng nút chỉ mục i-nốt đã dùng trên mỗi phân vùng. Lệnh thứ ba
      đo tổng kích thước từng thư mục để khoanh vùng chỗ đang phình to. Đặt hai cờ dung lượng và cờ i-nốt cạnh nhau cho bức
