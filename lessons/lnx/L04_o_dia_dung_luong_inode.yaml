      đĩa cục bộ là tiền đề để ta bước sang chẩn đoán kết nối mạng và dịch vụ lắng nghe cổng. Bước kế tiếp giải mã bí ẩn địa
      chỉ vòng lặp, cổng mạng công-tai-nơ và thứ tự phân giải tên miền trên hệ thống.
