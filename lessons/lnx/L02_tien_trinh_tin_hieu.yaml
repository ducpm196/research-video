scenes:
- id: hook
  kind: hook
  title: Vì sao kill -9 hay làm hỏng dữ liệu đang chạy dở?
  checks:
  - 128 + 15 == 143
  - 128 + 9 == 137
  steps:
  - show: <div class='box key'><p>Khi bạn gửi lệnh ép dừng số <b>9</b>, nhân hệ điều hành cắt ngang tiến trình tại
      chỗ mà không cho phép lưu tệp tạm hay đóng kết nối cơ sở dữ liệu.</p><p>Ngược lại, tín hiệu dừng lịch sự số
      <b>15</b> gõ cửa yêu cầu tiến trình dọn dẹp sạch trước khi thoát với mã thoát <b>143</b>.</p></div>
    say: Chào bạn, mỗi khi một dịch vụ bị treo, phản xạ đầu tiên của nhiều người là gõ ngay lệnh ép dừng số chín.
      Nhưng chính cú ép dừng đột ngột đó lại cắt ngang các yêu cầu đang ghi dở xuống cơ sở dữ liệu và để lại tệp
      khoá hỏng. Hôm nay ta phân biệt quy trình tắt dịch vụ lịch sự với lệnh chấm dứt cưỡng bức, đồng thời giải
      mã hai con số mã thoát quen thuộc một bốn ba và một ba bảy.
    focus:
    - 0
    - '1.1'
    - '1.2'
