scenes:
- id: hook
  kind: hook
  title: Vì sao kill -9 hay làm hỏng dữ liệu đang chạy dở?
  checks:
  - 128 + 15 == 143
  - 128 + 9 == 137
  steps:
  - show: <div class='box key'><p>Khi bạn gửi lệnh ép dừng số <b>9</b>, nhân hệ điều hành cắt ngang tiến trình tại chỗ mà
      không cho phép lưu tệp tạm hay đóng kết nối cơ sở dữ liệu.</p><p>Ngược lại, tín hiệu dừng lịch sự số <b>15</b> gõ cửa
      yêu cầu tiến trình dọn dẹp sạch trước khi thoát với mã thoát <b>143</b>.</p></div>
    say: Chào bạn, mỗi khi một dịch vụ bị treo, phản xạ đầu tiên của nhiều người là gõ ngay lệnh ép dừng số chín. Nhưng chính
      cú ép dừng đột ngột đó lại cắt ngang các yêu cầu đang ghi dở xuống cơ sở dữ liệu và để lại tệp khoá hỏng. Hôm nay ta
      phân biệt quy trình tắt dịch vụ lịch sự với lệnh chấm dứt cưỡng bức, đồng thời giải mã hai con số mã thoát quen thuộc
      một bốn ba và một ba bảy. Ép dừng đột ngột bằng tín hiệu chín cướp đi cơ hội cuối cùng để ứng dụng đóng kết nối và giữ
      nguyên vẹn dữ liệu đang ghi. Hiểu rõ cơ chế gửi tín hiệu đúng quy trình biến thao tác khởi động lại máy chủ từ rủi ro
      mất dữ liệu thành hoạt động êm ái.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng đã có</th><th>vai trò ở bài tiến trình</th></tr><tr><td>Mã thoát 0 là thành công,
      khác 0 là lỗi (dòng lệnh)</td><td>Tín hiệu ngắt quy ước mã thoát lớn hơn 128</td></tr><tr><td>Thư mục /proc chứa mã
      PID (L00)</td><td>PID là mã định danh tiến trình; trạng thái lộ rõ tại /proc</td></tr></table>
    say: Bài này nối trực tiếp kiến thức về mã thoát và thư mục tiến trình ở các bài trước. Trong dòng lệnh Li-núc, mọi lệnh
      thành công đều trả về mã thoát bằng không. Khi tiến trình bị hệ thống ngắt bởi tín hiệu, mã thoát được cộng thêm một
      trăm hai mươi tám để phân biệt. Quan sát mã thoát vượt một trăm hai mươi tám lập tức mách cho người vận hành biết tiến
      trình chết do tín hiệu hệ điều hành. Khoảng cách từ một trăm hai mươi tám tới mã thoát chỉ chính xác số hiệu tín hiệu
      ngắt đã kết thúc tiến trình đó.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
