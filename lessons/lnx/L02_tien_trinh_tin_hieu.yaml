    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1:
      Chạy <code>kill -9</code> ngay từ đầu thay vì dùng <code>kill</code> mặc định (SIGTERM).</b> Tín hiệu 9 không cho phép
      đóng kết nối hay lưu trạng thái.<br><b>Lỗi 2: Gửi lại tín hiệu cho tiến trình thây ma (trạng thái Z / zombie) mà thấy
      không chết.</b> Tiến trình đó đã chết sẵn, chỉ chờ tiến trình cha thu hồi mã thoát.<br><b>Lỗi 3: Quên viết hàm đón tín
      hiệu dừng trong ứng dụng container.</b> Khi nhận tín hiệu 15 không có bộ xử lý, dịch vụ phải đợi hết hạn 10 giây mới
      bị cắt bằng mã 137.</div></td></tr></table>'
    say: Hãy tránh ba lỗi rất phổ biến khi quản lý tiến trình Li-núc. Thứ nhất đừng bao giờ gõ vội số chín trước khi thử tín
      hiệu mười lăm. Thứ hai nếu thấy tiến trình mang trạng thái chữ Z thây ma, lệnh giết sẽ vô tác dụng vì nó đã chết rồi
      mà chỉ chờ tiến trình cha thu hồi trạng thái. Thứ ba nhớ luôn viết bộ đón tín hiệu dừng trong ứng dụng công-tai-nơ để
      khởi động lại nhanh chóng. Gõ lệnh tắt máy chủ một trăm ba bảy lặp đi lặp lại rất dễ làm hỏng tệp chỉ mục cơ sở dữ liệu
      khiến lần bật lại tốn hàng giờ. Cũng cần chú ý phân biệt dấu hiệu tiến trình bị giết do hết bộ nhớ với việc tự tắt để
      điều chỉnh đúng giới hạn RAM.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - 0
    - 0
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 137 - 128 == 9
  - 143 - 128 == 15
  steps:
  - show: <ol><li>Nhật ký công-tai-nơ báo vừa thoát với mã thoát <code>137</code>. Đây là hậu quả của tín hiệu số mấy?</li><li>Khi
      triển khai phiên bản mới cho máy chủ web đang phục vụ khách, nên gửi tín hiệu nào trước?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, nếu dịch vụ vừa dừng đột ngột kèm mã thoát một trăm ba mươi bảy, nó vừa nhận tín
      hiệu mang số mấy? Câu hai, khi nâng cấp phiên bản máy chủ đang phục vụ người dùng thật, ta phải gửi tín hiệu nào trước
      tiên? Dừng vi-đê-ô lại và kiểm tra câu trả lời. Hãy phân biệt rõ trường hợp tiến trình tự thoát với tình huống bị hệ
      thống buộc dừng đột ngột.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① Tín hiệu số <code>137 - 128 = 9</code> (<code>SIGKILL</code>
      — ép dừng ngay hoặc hết RAM OOMKill).</p></td></tr></table>
    say: 'Đáp án câu một: lấy một trăm ba mươi bảy trừ đi một trăm hai mươi tám bằng chín, tức là vừa bị ép dừng bằng tín
      hiệu số chín hoặc hết bộ nhớ. Quy ước cộng một trăm hai mươi tám với số tín hiệu cho phép công cụ giám sát phân biệt
      tức thì tiến trình thoát bình thường hay bị giết đột ngột. Biết cách trừ đi một trăm hai mươi tám biến mã thoát thành
      công cụ điều tra sự cố nhanh nhất trên mọi máy chủ.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Luôn gửi <code>SIGTERM</code> (15) trước để ứng dụng
      hoàn tất giao dịch dở rồi tự tắt sạch.</p></td></tr></table>
    say: 'Đáp án câu hai: luôn gửi tín hiệu mười lăm trước để ứng dụng hoàn tất nốt yêu cầu đang xử lý rồi tự đóng sạch sẽ.
      Nhờ cấu hình bẫy tín hiệu dừng êm ái, dịch vụ kịp chốt nốt giao dịch dở dang và đóng sạch kết nối trước khi tiến trình
      thoát hẳn. Thói quen chờ vài giây sau lệnh dừng mặc định cứu rất nhiều dịch vụ tránh khỏi tình trạng mất đồng bộ dữ
      liệu.'
    clear: true
