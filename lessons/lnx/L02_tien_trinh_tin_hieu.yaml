  - show: <div class='box ok'><p><b>Gợi ý nếu kẹt ở bài L02:</b> (1) cài bẫy trap TERM thoát đúng mã đọc từ stdin; (2) tính
      kill_exit = 128 + sig_num; (3) xử lý sạch \r đầu vào khi chạy Git Bash.</p><p style='margin-top:6px'><b>Mẹo cú pháp:</b>
