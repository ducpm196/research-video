      fill="#475569">128 + 9</text></svg></div>
    say: Nhìn hai đường chạy song song trên sơ đồ để thấy sự khác biệt một trời một vực. Ở nhánh trên, tín hiệu mười lăm gõ
      cửa để ứng dụng hoàn tất việc đóng kết nối, ghi hết bộ đệm rồi tự thoát với mã một trăm bốn mươi ba. Ở nhánh dưới, tín
      hiệu chín gạt bỏ mọi bước dọn dẹp và thu hồi tiến trình ngay lập tức kèm mã thoát một trăm ba mươi bảy.
    clear: true
  - show: ''
    say: Hàm bẫy tín hiệu nằm ngay trong kịch bản ứng dụng cho phép ta kiểm soát hoàn toàn quy trình dọn dẹp trước lúc thoát.
      Ngược lại tín hiệu chín không bao giờ đi tới ứng dụng nên không dòng mã thu dọn nào có cơ hội được chạy. Nhờ khoảng
      dừng lịch sự trước khi gửi tín hiệu huỷ cưỡng bức, dịch vụ kịp hoàn tất giao dịch đang mở. Ghi nhận chính xác mã thoát
      trên một trăm hai mươi tám giúp kịch bản giám sát phân biệt lỗi ứng dụng với tín hiệu dừng.
- id: formula
  kind: formula
  title: Công thức quy ước mã thoát từ tín hiệu nhân
  checks:
  - alg.lnx_sig_exit(15) == 143
  - alg.lnx_sig_exit(9) == 137
  steps:
  - show: '<div class=''box key''><p>Theo chuẩn POSIX, khi một tiến trình chấm dứt vì nhận tín hiệu số $S$, tiến trình cha
      nhận về mã thoát:</p><p><code>exit_code = 128 + S</code></p><p>Áp dụng ngay: <code>SIGTERM</code> (S = 15) → 128 + 15
      = <b>143</b>; <code>SIGKILL</code> (S = 9) → 128 + 9 = <b>137</b>.</p></div>'
    say: Công thức chuẩn rất ngắn gọn vì được quy định thống nhất trên toàn bộ thế giới dòng lệnh Li-núc. Khi một tiến trình
      dừng do tín hiệu mang số hiệu S, mã thoát trả về đúng bằng một trăm hai mươi tám cộng thêm số hiệu S đó. Do vậy nếu
      thấy container báo mã một bốn ba tức là nhận tín hiệu dừng bình thường, còn một ba bảy thường báo hiệu vừa bị cắt cưỡng
      bức. Quy luật cộng một trăm hai mươi tám áp dụng đồng bộ cho cả tín hiệu từ bàn phím lẫn tín hiệu tắt cưỡng bức vì thiếu
      RAM.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên Docker: SIGTERM (143) vs SIGKILL (137)'
  checks:
  - alg.lnx_sig_exit(15) == 143
  - alg.lnx_sig_exit(9) == 137
  steps:
  - show: '<table class=''t''><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>kill -TERM &#36;pid</code></td><td>Gửi
      tín hiệu 15 lịch sự cho tiến trình có mã PID vừa chạy nền</td></tr><tr><td><code>wait &#36;pid; rc=&#36;?</code></td><td>Chờ
      tiến trình kết thúc và thu nhận mã thoát thực sự vào biến <code>&#36;?</code></td></tr><tr><td><code>PID</code> / <code>OOMKill</code></td><td><code>PID</code>:
      mã số tiến trình trong nhân; <code>OOMKill</code>: nhân ngắt tiến trình vượt RAM (137)</td></tr><tr><td><code>trap ''...''
      TERM</code></td><td>Đăng ký lệnh dọn dẹp chạy trước khi tiến trình dừng khi nhận tín hiệu <code>SIGTERM</code></td></tr></table>'
    say: Giải mã hai lệnh điều phối tiến trình nền trong thử nghiệm gửi tín hiệu thật. Lệnh chờ tiến trình nền cho phép kịch
      bản thu nhận trọn vẹn mã thoát chính xác sau khi gửi tín hiệu kết thúc. Dấu và đặt cuối lệnh đưa tiến trình ra chạy
      nền còn biến đô-la chấm than lấy ngay mã PID của tiến trình nền vừa bật.
    clear: true
  - show: '<p><b>Thử thật trong Docker Alpine: tiến trình chạy hàm dọn khi gặp TERM và bỏ qua khi gặp KILL</b></p><div class="code"><div>MSYS_NO_PATHCONV=1
      docker run --rm postgres:17-alpine sh -c ''</div><div>  sh -c "trap \"echo cleaned; exit 143\" TERM; sleep 10" &amp;</div><div>  p1=<span>&#36;</span>!;
      sleep 0.2; kill -TERM <span>&#36;</span>p1; wait <span>&#36;</span>p1 2&gt;/dev/null; echo "term_rc=<span>&#36;</span>?"</div><div>  sh
      -c "trap \"echo should_not_print\" TERM; sleep 10" &amp;</div><div>  p2=<span>&#36;</span>!; sleep 0.2; kill -KILL <span>&#36;</span>p2;
      wait <span>&#36;</span>p2 2&gt;/dev/null; echo "kill_rc=<span>&#36;</span>?"</div><div>''</div></div>'
    say: Ta chạy hai tiến trình con ngay trong môi trường Li-núc thật và đều cài đặt hàm bẫy tín hiệu để ghi nhận quá trình
      dọn dẹp. Tiến trình thứ nhất nhận tín hiệu dừng mười lăm, còn tiến trình thứ hai nhận tín hiệu ép dừng chín. So sánh
      trực tiếp hai tiến trình song song trong cùng điều kiện chứng minh sự khác biệt giữa hai tín hiệu dừng.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>cleaned</div><div>term_rc=143</div><div>kill_rc=137</div></div>
    say: Đầu ra chạy thật chứng minh tiến trình nhận tín hiệu mười lăm đã in ra dòng báo dọn dẹp trước khi thoát với mã một
      bốn ba. Tiến trình nhận tín hiệu chín im bặt không kịp chạy hàm dọn dẹp và trả ngay mã thoát một ba bảy. Dòng báo dọn
      dẹp kết hợp mã một bốn ba và một ba bảy là bằng chứng thực nghiệm rõ ràng nhất cho lý thuyết tín hiệu.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Đối chứng quy đổi mã tín hiệu và nhận diện tiến trình thây ma
  checks:
  - 128 + 15 == 143
  - 128 + 9 == 137
  steps:
  - show: <p><b>Kiểm chéo trực tiếp công thức cộng 128 trên hai tín hiệu chính</b></p><div class="code"><div>echo "TERM=<span>&#36;</span>((128
      + 15)) KILL=<span>&#36;</span>((128 + 9))"</div></div>
    say: Ta kiểm chéo lại hai con số cốt lõi bằng công thức số học vì cần đối chiếu trực tiếp với hai mã thoát vừa đo từ nhân
      Li-núc. Tính toán nhanh tổng cộng một trăm hai mươi tám giúp giải mã mọi thông báo thoát bất thường trên nhật ký hệ
      thống.
    clear: true
    focus:
    - 1
    - 2
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>TERM=143 KILL=137</div></div>
    say: Kết quả tính toán trả về một trăm bốn mươi ba và một trăm ba bảy, vì cộng một trăm hai mươi tám với mười lăm và chín
      khớp chính xác hai mã vừa đo. Tín hiệu dừng đúng chuẩn kết hợp mã thoát quy ước cho phép hệ thống điều phối container
      biết chính xác tiến trình vừa tắt êm ái hay bị buộc dừng khẩn cấp. Số liệu cộng tay trùng khớp với thực đo từ bộ vỏ
      công-tai-nơ khẳng định quy tắc chuẩn không thay đổi qua các phiên bản.
    clear: true
    focus:
    - 1
    - 2
    - 2
  - show: <table class='t'><tr><th>trạng thái tiến trình</th><th>nguyên nhân</th><th>cách thu hồi chuẩn</th></tr><tr><td><code>Z
      &lt;defunct&gt;</code> (thây ma)</td><td>tiến trình con đã chết nhưng cha chưa gọi <code>wait</code></td><td>không <code>kill
      -9</code> được; phải để cha gọi <code>wait $pid</code> đọc mã thoát</td></tr></table>
    say: Kiểm tra thêm cách nhận diện tiến trình thây ma chữ Z. Khi con đã kết thúc mà cha chưa gọi wait, tiến trình nằm ở
      trạng thái Z nên lệnh giết số 9 vô dụng, chỉ có tiến trình cha thu hồi qua wait mới dọn sạch.
- id: quymo
  kind: example
  title: Thời gian tắt máy chủ và rủi ro hỏng dữ liệu qua ba quy mô cụm
  checks:
  - 100 * 10 == 1000
  steps:
  - show: <table class='t'><tr><th>quy mô máy chủ</th><th>hậu quả nếu dùng kill -9 thường xuyên</th><th>quy trình chuẩn tắt
      dịch vụ</th></tr><tr><td>1 dịch vụ đơn</td><td>Mất vài kết nối người dùng hiện tại</td><td>Gửi tín hiệu 15, chờ tối
      đa 10 giây</td></tr><tr><td>10 dịch vụ nền hàng đợi</td><td>Công việc xử lý nửa chừng mất dấu vết</td><td>Nhận tín hiệu
      15 để hoàn tất tác vụ đang dở</td></tr><tr><td>100 nút cụm triển khai lại</td><td>Hàng nghìn yêu cầu rớt lỗi 502 hàng
      loạt</td><td>Chờ tắt êm rồi mới rút máy khỏi cân bằng tải</td></tr></table>
    say: Bảng quy mô cho thấy thói quen dùng lệnh ép dừng gây thiệt hại lớn ra sao khi hệ thống mở rộng. Ở cụm một trăm máy
      chủ triển khai liên tục, cắt ngang kết nối thay vì chờ dừng êm rất nguy hiểm. Hành động này làm hàng nghìn yêu cầu khách
      hàng văng lỗi năm trăm linh hai cùng lúc. Do đó mọi trình điều phối chuẩn đều gửi tín hiệu mười lăm trước rồi mới đếm
      ngược thời gian chờ. Trong kiến trúc điều phối hàng trăm dịch vụ, quy trình dừng mềm cho ứng dụng vài chục giây xả nốt
      lưu lượng đang dở.
