- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>SIGTERM (15) → dọn sạch → 143</span><span class='a'>|</span><span class='n'>SIGKILL
      (9) → cắt ngang → 137</span></div>
    say: Tổng kết chuỗi logic về tiến trình và tín hiệu điều khiển. Tín hiệu mười lăm lịch sự trả mã thoát một bốn ba, còn
      tín hiệu chín cưỡng bức trả mã một ba bảy và không chạy dọn dẹp. Luôn ưu tiên tắt êm trước khi buộc phải dùng đến biện
      pháp cuối cùng. Bẫy tín hiệu kết hợp giải mã số thoát tạo nên dịch vụ tắt mở an toàn trên máy chủ. Ưu tiên tín hiệu
      dừng lịch sự, đọc đúng mã thoát trên một trăm hai mươi tám và giữ cửa thoát sạch cho mọi dịch vụ nền. Nắm chắc vòng
      đời tín hiệu giúp bạn tự tin quản trị ứng dụng chạy liên tục và tách luồng xuất nhập sạch sẽ trong vận hành thực tế.
