- id: sym
  kind: symbol
  title: Giải mã ký hiệu và lệnh mới
  steps:
  - show: '<table class=''t''><tr><th>tín hiệu / lệnh</th><th>số hiệu và cơ chế hoạt động</th></tr><tr><td><code>SIGTERM</code>
      (mã 15)</td><td>Tín hiệu dừng chuẩn: ứng dụng bắt được, chạy hàm <code>trap</code> dọn sạch rồi thoát</td></tr><tr><td><code>SIGKILL</code>
      (mã 9)</td><td>Tín hiệu cưỡng bức của nhân: không thể chặn, không thể bắt, cắt ngang tức thì</td></tr><tr><td><code>trap
      ... TERM</code></td><td>Đăng ký hàm dọn dẹp trong Bash hoặc ứng dụng khi nhận tín hiệu dừng</td></tr></table>'
    say: Trên bảng là ba quy ước tín hiệu cốt lõi của hệ điều hành Li-núc. Tín hiệu thứ nhất là tín hiệu dừng lịch sự mang
      số mười lăm viết tắt là xích-tơm, cho phép ứng dụng chạy xong tác vụ hiện tại rồi mới đóng tài nguyên. Tín hiệu thứ
      hai mang số chín gọi là xích-kiu do chính nhân thực thi ngay lập tức mà ứng dụng không tài nào chặn nổi. Tín hiệu mười
      lăm đóng vai trò lời đề nghị lịch sự còn tín hiệu chín là lệnh cưỡng chế tức thì từ thẳng nhân điều hành.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
    introduces:
    - lnx_tin_hieu
