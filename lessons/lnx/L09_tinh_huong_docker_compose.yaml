scenes:
- id: hook
  kind: hook
  title: Dịch vụ chạy lẻ thì ổn, ghép Compose lại báo lỗi nối?
  checks:
  - 2 * 5 == 10
  steps:
  - show: '<div class=''box key''><p>Ba lỗi cấu hình kinh điển khi ghép hai dịch vụ trong cùng tệp <b>Compose</b>:
      ứng dụng gọi nhầm <code>localhost</code> hoặc cổng ngoài <code>16379</code>, hoặc phóng vào DB ngay khi container
      vừa khởi động chưa mở cổng.</p><p>Hôm nay ta dùng <code>healthcheck</code> kèm dịch vụ thật để vận hành trọn
      cụm trơn tru.</p></div>'
    say: Chào bạn đến với bài tình huống chuyên gia tổng kết khoá Li-núc và công-tai-nơ. Khi chạy từng công-tai-nơ
      rời thì ổn nhưng ghép chung vào tệp điều phối nhiều dịch vụ lại thường xuyên sập ngay giây đầu tiên vì ba
      lỗi kết nối kinh điển. Chúng gồm gọi nhầm địa chỉ máy cục bộ, gọi nhầm cổng ánh xạ bên ngoài và vội kết nối
      khi cơ sở dữ liệu chưa sẵn sàng. Hôm nay ta chạy thật một cụm hai dịch vụ có kiểm tra sức khoẻ để giải quyết
      dứt điểm cả ba lỗi đó.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>mảnh ghép từ L00–L08</th><th>ghép vào cụm Compose</th></tr><tr><td>Mạng cầu nối
      riêng phân giải tên dịch vụ (L08)</td><td>Ứng dụng gọi thẳng <code>cache:6379</code> thay vì <code>127.0.0.1</code></td></tr><tr><td>Cổng
      nội bộ vs cổng host (L08, L05)</td><td>Trong mạng nội bộ luôn dùng cổng bên trong của dịch vụ đích</td></tr><tr><td>Tín
      hiệu dừng êm SIGTERM (L02)</td><td>Lệnh dừng cụm chờ các dịch vụ xả dữ liệu rồi tắt theo thứ tự</td></tr></table>
    say: Bài tình huống cuối khoá tổng hợp trực tiếp các mảnh ghép từ bài 2, bài 5 và bài 8. Nhờ mạng cầu nối chung
      do trình điều phối tự tạo, các dịch vụ gọi nhau qua tên dịch vụ và cổng gốc bên trong công-tai-nơ chứ không
      qua cổng chuyển tiếp ra ngoài máy chủ.
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và lệnh mới
  steps:
  - show: '<table class=''t''><tr><th>khoá cấu hình YAML</th><th>tác dụng trong cụm nhiều dịch vụ</th></tr><tr><td><code>healthcheck</code>
      (interval, retries)</td><td>Thăm dò định kỳ tình trạng thật bên trong dịch vụ thay vì chỉ xem tiến trình vừa
      bật</td></tr><tr><td><code>depends_on: condition: service_healthy</code></td><td>Chỉ khởi chạy ứng dụng SAU
      KHI dịch vụ DB/bộ đệm vượt qua kiểm tra sức khoẻ</td></tr><tr><td><code>cache:6379</code> (tên + cổng nội
      bộ)</td><td>Địa chỉ liên dịch vụ chuẩn (KHÔNG dùng <code>127.0.0.1</code> hay cổng ngoài host)</td></tr></table>'
    say: Bảng này giải mã ba khoá quan trọng nhất trong một tệp điều phối nhiều dịch vụ chuẩn mực. Khối kiểm tra
      sức khoẻ định kỳ thăm dò xem dịch vụ đã thực sự nhận kết nối chưa chứ không chỉ kiểm tiến trình có mặt. Khoá
      phụ thuộc điều kiện khoẻ buộc dịch vụ ứng dụng chờ đúng đến khi cơ sở dữ liệu sẵn sàng.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: intuition
  kind: intuition
  title: Sơ đồ chuỗi khởi động an toàn theo trạng thái healthcheck thật
  steps:
  - show: '<div><svg width="960" height="210" viewBox="0 0 960 210"><rect x="20" y="48" width="210" height="95"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="125.0" y="90" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">1. Bật dịch vụ cache</text><text x="125.0" y="118" font-size="15" text-anchor="middle"
      fill="#475569">Cổng nội bộ 6379</text><line x1="230" y1="95" x2="345" y2="95" stroke="#475569" stroke-width="2"/><polygon
      points="345,95 337.0,100.0 337.0,90.0" fill="#475569"/><text x="288" y="87" font-size="14" font-weight="600"
      text-anchor="middle" fill="#1e293b">kiểm mỗi 2s</text><rect x="345" y="48" width="250" height="95" rx="10"
      fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="470.0" y="90" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">2. healthcheck (tối đa 5 lần)</text><text x="470.0" y="118" font-size="15"
      text-anchor="middle" fill="#475569">Đạt ngưỡng: tối đa 2 × 5 = 10s</text><line x1="595" y1="95" x2="685" y2="95"
      stroke="#475569" stroke-width="2"/><polygon points="685,95 677.0,100.0 677.0,90.0" fill="#475569"/><text x="640"
      y="87" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">healthy!</text><rect x="685" y="48"
      width="255" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="812.5" y="90" font-size="18"
      font-weight="700" text-anchor="middle" fill="#1e293b">3. Bật app nối ''cache:6379''</text><text x="812.5"
      y="118" font-size="15" text-anchor="middle" fill="#475569">Thành công ngay lượt thử đầu</text></svg></div>'
    say: Nhìn chuỗi khởi động theo trạng thái thực tế trên sơ đồ. Thay vì phóng hai dịch vụ cùng một giây khiến
      ứng dụng văng lỗi kết nối, bước kiểm tra sức khoẻ đứng gác giữa hai khối. Chỉ khi bộ đệm vượt qua phép thử
      trả lời hợp lệ thì ứng dụng mới khởi chạy và gọi tới tên dịch vụ ở cổng nội bộ.
    clear: true
- id: formula
  kind: formula
  title: Công thức ước lượng thời gian tối đa phát hiện sự cố healthcheck
  checks:
  - 2 * 5 == 10
  steps:
  - show: '<div class=''box key''><p>Với chu kỳ thăm dò <code>interval</code> (giây) và số lần thất bại liên tiếp
      tối đa <code>retries</code>:</p><p><code>max_detect = interval × retries</code></p><p>Áp dụng trực tiếp: kiểm
      mỗi 2 giây, tối đa 5 lần → 2 × 5 = <b>10 giây</b> trước khi đánh dấu <code>unhealthy</code>.</p></div>'
    say: Công thức ước lượng độ trễ rất dễ tính trước khi triển khai cụm thật. Lấy chu kỳ giữa hai lần kiểm tra
      nhân với số lần thử thất bại liên tiếp sẽ ra thời gian tối đa hệ thống xác nhận trạng thái hỏng. Vì thế nếu
      đặt chu kỳ hai giây và năm lần thử, hệ thống cần tối đa mười giây để gắn cờ không khoẻ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật Docker Compose v2: cache + healthcheck'
  checks:
  - 2 * 5 == 10
  steps:
  - show: '<table class=''t''><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>docker compose
      up -d --wait</code></td><td>Khởi chạy cụm nền và chờ mọi dịch vụ đạt trạng thái <code>healthy</code></td></tr><tr><td><code>docker
      compose exec client ...</code></td><td>Chạy lệnh ngay bên trong container ứng dụng gọi sang <code>cache:6379</code></td></tr><tr><td><code>Redis</code>
      / <code>redis-cli</code></td><td>Kho đệm RAM tốc độ cao (cổng <code>6379</code>); <code>redis-cli</code> là
      trình khách dòng lệnh</td></tr><tr><td><code>PING</code> → <code>+PONG</code></td><td>Lệnh kiểm tra sống (giao
      thức RESP): Redis trả về <code>+PONG</code> khi sẵn sàng</td></tr></table>'
    say: Giải thích các lệnh điều phối cụm hai dịch vụ vừa bật vừa thử gọi chéo tên dịch vụ trên Đốc-cơ Côm-pâu
      thật.
    clear: true
  - show: '<p><b>Dựng thật cụm Compose gồm Redis (healthcheck 2s × 5) + Alpine client gọi cache:6379</b></p><div
      class="code"><div>set -e; cat &gt; compose.yaml &lt;&lt;''YAML''</div><div>services:</div><div>  cache:</div><div>    image:
      redis:8.10.3</div><div>    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 2s, retries: 5}</div><div>  client:</div><div>    image:
      postgres:17-alpine</div><div>    depends_on: {cache: {condition: service_healthy}}</div><div>YAML</div><div>P=lnx_l09;
      trap ''docker compose -p <span>&#36;</span>P down -v &gt;/dev/null 2&gt;&amp;1 || true'' EXIT</div><div>docker
      compose -p <span>&#36;</span>P up -d --wait cache &gt;/dev/null 2&gt;&amp;1</div><div>st=<span>&#36;</span>(docker
      inspect --format=''{{.State.Health.Status}}'' <span>&#36;</span>P-cache-1)</div><div>c=''printf "*1\r\n\<span>&#36;</span>4\r\nPING\r\n"
      | nc -w 2 cache 6379 | tr -d "\r\n"''</div><div>pong=<span>&#36;</span>(MSYS_NO_PATHCONV=1 docker compose
      -p <span>&#36;</span>P run --rm --no-deps client sh -c "<span>&#36;</span>c")</div><div>echo "health=<span>&#36;</span>st
      client_reply=<span>&#36;</span>pong"</div></div>'
    say: Ta chạy sống toàn bộ cụm điều phối hai dịch vụ bằng công cụ Đốc-cơ Côm-pâu phiên bản hai ngay trên máy.
      Tệp cấu hình khai báo dịch vụ bộ đệm với kiểm tra sức khoẻ chu kỳ hai giây tối đa năm lần và dịch vụ khách
      nối sang đúng cổng sáu ba bảy chín qua tên dịch vụ.
    focus:
    - 1
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>health=healthy client_reply=+PONG</div></div>
    say: Đầu ra thật chứng minh trình điều phối chờ bộ đệm khoẻ mạnh trước khi bật máy khách. Câu lệnh thử nối qua
      mạng nội bộ nhận ngay phản hồi hợp lệ rồi toàn bộ cụm tự động dọn sạch.
    focus:
    - 1
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chéo thời gian phát hiện sự cố và 3 lỗi kết nối
  checks:
  - 2 * 5 == 10
  steps:
  - show: <p><b>Tính ngược độ trễ phát hiện hỏng tối đa của healthcheck 2 giây × 5 lần</b></p><div class="code"><div>iv=2;
      rt=5; echo "max_detect_s=<span>&#36;</span>((iv * rt))"</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tính lại thời gian phát hiện hỏng tối đa vì chu kỳ hai giây nhân năm lần
      cho đúng ngưỡng mười giây.
    clear: true
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>max_detect_s=10</div></div>
    say: Kết quả tính toán trả về đúng mười giây vì hai nhân năm bằng mười, khớp hoàn toàn ngưỡng thời gian cảnh
      báo sức khoẻ trong tệp cấu hình.
    clear: true
- id: quymo
  kind: example
  title: Đánh đổi tốc độ phát hiện hỏng theo chu kỳ healthcheck qua 3 mức
  checks:
  - 30 * 3 == 90
  steps:
  - show: <table class='t'><tr><th>chu kỳ kiểm (interval × retries)</th><th>thời gian phát hiện hỏng</th><th>phí
      tài nguyên nếu có 20 dịch vụ</th></tr><tr><td>1s × 3 lần</td><td>3 giây (nhanh)</td><td>20 lượt kiểm/giây
      (~nhiều tiếng ồn log nếu nặng)</td></tr><tr><td>2s × 5 lần (cân bằng)</td><td>10 giây (chuẩn sản xuất)</td><td>10
      lượt kiểm/giây (nhẹ nhàng, tránh báo giả)</td></tr><tr><td>30s × 3 lần (quá chậm)</td><td>90 giây (1,5 phút
      chết ngầm)</td><td>Thấp nhất nhưng khách lỗi hàng loạt gần 2 phút</td></tr></table>
    say: Bảng quy mô giải thích vì sao cấu hình hai giây nhân năm lần là điểm cân bằng tốt nhất cho hầu hết dịch
      vụ. Nếu kiểm quá dày một giây một lần trên hai mươi dịch vụ, chi phí thăm dò dồn dập dễ gây nhiễu giả lúc
      tải cao. Ngược lại nếu kéo giãn ba mươi giây ba lần, dịch vụ có thể sập chết ngầm tới chín mươi giây trước
      khi trình điều phối phát hiện.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi
      1: App viết <code>REDIS_HOST=127.0.0.1</code> trong Compose.</b> Mỗi container có không gian tên mạng riêng;
      phải ghi đúng tên dịch vụ <code>cache</code>.<br><b>Lỗi 2: Ánh xạ ra host <code>ports: [''16379:6379'']</code>
      rồi bắt app gọi cổng ngoài <code>cache:16379</code>.</b> Trong mạng nội bộ dịch vụ luôn nghe cổng <code>6379</code>.<br><b>Lỗi
      3: Chỉ viết <code>depends_on: [cache]</code> không có điều kiện khoẻ.</b> App chạy ngay khi tiến trình DB
      mới bật nhưng chưa kịp mở cổng.</div></td></tr></table>'
    say: Ba lỗi kinh điển trong tệp điều phối nhiều dịch vụ đều quay quanh sai lệch ranh giới công-tai-nơ. Lỗi một
      là gọi một hai bảy chấm không thay vì tên dịch vụ bên trong mạng chung. Lỗi hai là truyền nhầm cổng ánh xạ
      máy chủ vào cấu hình gọi nội bộ. Lỗi ba là quên chờ điều kiện sức khoẻ thực sự trước khi khởi động dịch vụ
      phụ thuộc.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 2 * 5 == 10
  steps:
  - show: '<ol><li>Trong tệp Compose, dịch vụ <code>redis</code> mở cổng <code>16379:6379</code> (16379 ngoài, 6379
      trong). Dịch vụ <code>app</code> kết nối nội bộ qua địa chỉ và cổng nào?</li><li>Cấu hình <code>interval:
      2s</code> và <code>retries: 5</code> cần tối đa bao nhiêu giây để kết luận một dịch vụ mất sức khoẻ?</li></ol>'
    say: Đến lượt bạn tự kiểm tra. Câu một, nếu bộ đệm ánh xạ cổng một sáu ba bảy chín ra ngoài máy chủ nhưng bên
      trong chạy cổng sáu ba bảy chín, ứng dụng cùng cụm phải gọi địa chỉ và cổng nào? Câu hai, kiểm tra mỗi hai
      giây tối đa năm lần thì cần bao nhiêu giây để báo hỏng? Bấm tạm dừng và tự kiểm tra.
    pause: 20
  - show: '<table class=''t''><tr><th>đáp án câu 1</th></tr><tr><td><p>① Phải gọi tên dịch vụ và cổng bên trong:
      <b><code>redis:6379</code></b> (không dùng <code>127.0.0.1</code> hay cổng ngoài <code>16379</code>).</p></td></tr></table>'
    say: 'Đáp án câu một: gọi đúng tên dịch vụ kèm cổng nội bộ sáu ba bảy chín, tuyệt đối không dùng cổng ngoài
      hay địa chỉ máy cục bộ.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Tối đa <code>2 × 5 = <b>10 giây</b></code>.</p></td></tr></table>
    say: 'Đáp án câu hai: hai giây nhân năm lần thất bại liên tiếp bằng đúng mười giây phát hiện hỏng.'
