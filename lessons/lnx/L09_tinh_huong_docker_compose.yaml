- id: quymo
  kind: example
  title: Đánh đổi tốc độ phát hiện hỏng theo chu kỳ healthcheck qua 3 mức
  checks:
  - 30 * 3 == 90
  steps:
  - show: <table class='t'><tr><th>chu kỳ kiểm (interval × retries)</th><th>thời gian phát hiện hỏng</th><th>phí tài nguyên
      nếu có 20 dịch vụ</th></tr><tr><td>1s × 3 lần</td><td>3 giây (nhanh)</td><td>20 lượt kiểm/giây (~nhiều tiếng ồn log
      nếu nặng)</td></tr><tr><td>2s × 5 lần (cân bằng)</td><td>10 giây (chuẩn sản xuất)</td><td>10 lượt kiểm/giây (nhẹ nhàng,
      tránh báo giả)</td></tr><tr><td>30s × 3 lần (quá chậm)</td><td>90 giây (1,5 phút chết ngầm)</td><td>Thấp nhất nhưng
      khách lỗi hàng loạt gần 2 phút</td></tr></table>
    say: Bảng quy mô giải thích vì sao cấu hình hai giây nhân năm lần là điểm cân bằng tốt nhất cho hầu hết dịch vụ. Nếu kiểm
      quá dày một giây một lần trên hai mươi dịch vụ, chi phí thăm dò dồn dập dễ gây nhiễu giả lúc tải cao. Ngược lại nếu
      kéo giãn ba mươi giây ba lần, dịch vụ có thể sập chết ngầm tới chín mươi giây trước khi trình điều phối phát hiện. Thăm
      dò mỗi một giây trên hai mươi dịch vụ tạo áp lực kiểm tra thừa thãi lên bộ xử lý trong khi hai giây nhân năm cân bằng
      tốt hơn.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1:
      App viết <code>REDIS_HOST=127.0.0.1</code> trong Compose.</b> Mỗi container có không gian tên mạng riêng; phải ghi đúng
      tên dịch vụ <code>cache</code>.<br><b>Lỗi 2: Ánh xạ ra host <code>ports: [''16379:6379'']</code> rồi bắt app gọi cổng
      ngoài <code>cache:16379</code>.</b> Trong mạng nội bộ dịch vụ luôn nghe cổng <code>6379</code>.<br><b>Lỗi 3: Chỉ viết
      <code>depends_on: [cache]</code> không có điều kiện khoẻ.</b> App chạy ngay khi tiến trình DB mới bật nhưng chưa kịp
      mở cổng.</div></td></tr></table>'
    say: Ba lỗi kinh điển trong tệp điều phối nhiều dịch vụ đều quay quanh sai lệch ranh giới công-tai-nơ. Lỗi một là gọi
      một hai bảy chấm không thay vì tên dịch vụ bên trong mạng chung. Lỗi hai là truyền nhầm cổng ánh xạ máy chủ vào cấu
      hình gọi nội bộ. Lỗi ba là quên chờ điều kiện sức khoẻ thực sự trước khi khởi động dịch vụ phụ thuộc. Tránh viết cứng
      địa chỉ nội bộ tạm thời mà hãy dùng tên dịch vụ ổn định trong mạng cụm. Đừng để ứng dụng dùng cổng ngoài ánh xạ ra máy
      chủ khi gọi sang dịch vụ anh em nằm chung trong mạng nội bộ của tệp điều phối. Luôn gắn thêm tên hoặc khoá phụ thuộc
      điều kiện dịch vụ khoẻ mạnh thay vì chỉ liệt kê tên dịch vụ khởi chạy không điều kiện.
