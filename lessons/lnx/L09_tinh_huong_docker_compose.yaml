  - show: ''
    say: Tiến trình điều phối liên tục gửi gói tin thăm dò ngắn theo chu kỳ vài giây cho tới khi bộ đệm đáp trả trạng thái
      khoẻ mạnh. Nhờ đồng bộ hoá theo trạng thái thật thay vì đợi mù bằng vài giây cứng, cụm dịch vụ khởi động vừa nhanh vừa
      không văng lỗi đầu phiên. Giám sát sức khoẻ định kỳ chặn đứng tình trạng ứng dụng gửi truy vấn vào bộ đệm khi tiến trình
      đó chưa sẵn sàng. Điều chỉnh chuẩn chu kỳ thăm dò và ngưỡng thử lại cân bằng giữa tốc độ phát hiện lỗi và tải hệ thống.
- id: formula
  kind: formula
  title: Công thức ước lượng thời gian tối đa phát hiện sự cố healthcheck
  checks:
  - 2 * 5 == 10
  steps:
  - show: '<div class=''box key''><p>Với chu kỳ thăm dò <code>interval</code> (giây) và số lần thất bại liên tiếp tối đa <code>retries</code>:</p><p><code>max_detect
      = interval × retries</code></p><p>Áp dụng trực tiếp: kiểm mỗi 2 giây, tối đa 5 lần → 2 × 5 = <b>10 giây</b> trước khi
      đánh dấu <code>unhealthy</code>.</p></div>'
    say: Công thức ước lượng độ trễ rất dễ tính trước khi triển khai cụm thật. Lấy chu kỳ giữa hai lần kiểm tra nhân với số
      lần thử thất bại liên tiếp sẽ ra thời gian tối đa hệ thống xác nhận trạng thái hỏng. Vì thế nếu đặt chu kỳ hai giây
      và năm lần thử, hệ thống cần tối đa mười giây để gắn cờ không khoẻ. Nhân chu kỳ thăm dò với số lần thất bại tối đa cho
      phép bạn căn chỉnh độ nhạy phát hiện sự cố phù hợp tải thật.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật Docker Compose v2: cache + healthcheck'
  checks:
  - 2 * 5 == 10
  steps:
  - show: '<table class=''t''><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>docker compose up -d
      --wait</code></td><td>Khởi chạy cụm nền và chờ mọi dịch vụ đạt trạng thái <code>healthy</code></td></tr><tr><td><code>docker
      compose exec client ...</code></td><td>Chạy lệnh ngay bên trong container ứng dụng gọi sang <code>cache:6379</code></td></tr><tr><td><code>Redis</code>
      / <code>redis-cli</code></td><td>Kho đệm RAM tốc độ cao (cổng <code>6379</code>); <code>redis-cli</code> là trình khách
      dòng lệnh</td></tr><tr><td><code>PING</code> → <code>+PONG</code></td><td>Lệnh kiểm tra sống (giao thức RESP): Redis
      trả về <code>+PONG</code> khi sẵn sàng</td></tr></table>'
    say: Giải thích các lệnh điều phối cụm hai dịch vụ vừa bật vừa thử gọi chéo tên dịch vụ trên Đốc-cơ Côm-pâu thật. Cờ chờ
      đợi trạng thái khoẻ mạnh chặn đứng cửa sổ dòng lệnh tới khi toàn bộ các thành phần phụ thuộc báo xanh hoàn toàn.
    clear: true
  - show: '<p><b>Dựng thật cụm Compose gồm Redis (healthcheck 2s × 5) + Alpine client gọi cache:6379</b></p><div class="code"><div>set
      -e; cat &gt; compose.yaml &lt;&lt;''YAML''</div><div>services:</div><div>  cache:</div><div>    image: redis:8.10.3</div><div>    healthcheck:
      {test: ["CMD","redis-cli","ping"], interval: 2s, retries: 5}</div><div>  client:</div><div>    image: postgres:17-alpine</div><div>    depends_on:
      {cache: {condition: service_healthy}}</div><div>YAML</div><div>P=lnx_l09; trap ''docker compose -p <span>&#36;</span>P
      down -v &gt;/dev/null 2&gt;&amp;1 || true'' EXIT</div><div>docker compose -p <span>&#36;</span>P up -d --wait cache
      &gt;/dev/null 2&gt;&amp;1</div><div>st=<span>&#36;</span>(docker inspect --format=''{{.State.Health.Status}}'' <span>&#36;</span>P-cache-1)</div><div>c=''printf
      "*1\r\n\<span>&#36;</span>4\r\nPING\r\n" | nc -w 2 cache 6379 | tr -d "\r\n"''</div><div>pong=<span>&#36;</span>(MSYS_NO_PATHCONV=1
      docker compose -p <span>&#36;</span>P run --rm --no-deps client sh -c "<span>&#36;</span>c")</div><div>echo "health=<span>&#36;</span>st
      client_reply=<span>&#36;</span>pong"</div></div>'
    say: Ta chạy sống toàn bộ cụm điều phối hai dịch vụ bằng công cụ Đốc-cơ Côm-pâu phiên bản hai ngay trên máy. Tệp cấu hình
      khai báo dịch vụ bộ đệm với kiểm tra sức khoẻ chu kỳ hai giây tối đa năm lần và dịch vụ khách nối sang đúng cổng sáu
      ba bảy chín qua tên dịch vụ. Thử nghiệm dựng sống một bộ đệm kèm dịch vụ khách minh chứng giao tiếp nội mạng êm ái qua
      tên dịch vụ và cổng gốc.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: <p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>health=healthy client_reply=+PONG</div></div>
    say: Đầu ra thật chứng minh trình điều phối chờ bộ đệm khoẻ mạnh trước khi bật máy khách. Câu lệnh thử nối qua mạng nội
      bộ nhận ngay phản hồi hợp lệ rồi toàn bộ cụm tự động dọn sạch. Chuỗi phản hồi PONG xác nhận ứng dụng gọi đúng cổng nội
      bộ và đã đợi xong pha khởi động của bộ nhớ đệm.
    focus:
    - 1
    - 2
    - 2
    clear: true
- id: check
  kind: check
  title: Kiểm chéo thời gian phát hiện sự cố và 3 lỗi kết nối
  checks:
  - 2 * 5 == 10
  steps:
  - show: <p><b>Tính ngược độ trễ phát hiện hỏng tối đa của healthcheck 2 giây × 5 lần</b></p><div class="code"><div>iv=2;
      rt=5; echo "max_detect_s=<span>&#36;</span>((iv * rt))"</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tính lại thời gian phát hiện hỏng tối đa vì chu kỳ hai giây nhân năm lần cho đúng
      ngưỡng mười giây. Phép nhân ngược giữa chu kỳ hai giây và năm lần thử khẳng định giới hạn phát hiện sự cố bằng đúng
      mười giây tròn.
    clear: true
    focus:
    - 1
    - 2
