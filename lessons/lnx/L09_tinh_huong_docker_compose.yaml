- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - 2 * 5 == 10
  steps:
  - show: '<ol><li>Trong tệp Compose, dịch vụ <code>redis</code> mở cổng <code>16379:6379</code> (16379 ngoài, 6379 trong).
      Dịch vụ <code>app</code> kết nối nội bộ qua địa chỉ và cổng nào?</li><li>Cấu hình <code>interval: 2s</code> và <code>retries:
      5</code> cần tối đa bao nhiêu giây để kết luận một dịch vụ mất sức khoẻ?</li></ol>'
    say: Đến lượt bạn tự kiểm tra. Câu một, nếu bộ đệm ánh xạ cổng một sáu ba bảy chín ra ngoài máy chủ nhưng bên trong chạy
      cổng sáu ba bảy chín, ứng dụng cùng cụm phải gọi địa chỉ và cổng nào? Câu hai, kiểm tra mỗi hai giây tối đa năm lần
      thì cần bao nhiêu giây để báo hỏng? Bấm tạm dừng và tự kiểm tra. Kiểm tra lại cách tính độ trễ tối đa trước khi dịch
      vụ bị đánh dấu mất khả năng phục vụ.
    pause: 20
  - show: '<table class=''t''><tr><th>đáp án câu 1</th></tr><tr><td><p>① Phải gọi tên dịch vụ và cổng bên trong: <b><code>redis:6379</code></b>
      (không dùng <code>127.0.0.1</code> hay cổng ngoài <code>16379</code>).</p></td></tr></table>'
    say: 'Đáp án câu một: gọi đúng tên dịch vụ kèm cổng nội bộ sáu ba bảy chín, tuyệt đối không dùng cổng ngoài hay địa chỉ
      máy cục bộ. Khai báo rõ điều kiện kiểm tra sức khoẻ giúp chuỗi khởi động chờ đúng lúc cơ sở dữ liệu sẵn sàng thay vì
      gặp lỗi kết nối ở những giây đầu. Giao tiếp nội bộ trong mạng cầu nối luôn đi thẳng qua tên dịch vụ kèm cổng lắng nghe
      gốc bên trong công-tai-nơ.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Tối đa <code>2 × 5 = <b>10 giây</b></code>.</p></td></tr></table>
    say: 'Đáp án câu hai: hai giây nhân năm lần thất bại liên tiếp bằng đúng mười giây phát hiện hỏng. Đặt đúng chu kỳ kiểm
      tra và số lần thử lại tránh đánh dấu nhầm một cơ sở dữ liệu lớn đang khởi động ấm thành dịch vụ hỏng. Nhẩm nhanh độ
      trễ tối đa giúp bạn điều chỉnh độ dài ngưỡng báo hỏng vừa kịp phát hiện lỗi thật vừa tránh báo động giả.'
