- id: sym
  kind: symbol
  title: Giải mã ký hiệu và lệnh mới
  steps:
  - show: '<table class=''t''><tr><th>khoá cấu hình YAML</th><th>tác dụng trong cụm nhiều dịch vụ</th></tr><tr><td><code>healthcheck</code>
      (interval, retries)</td><td>Thăm dò định kỳ tình trạng thật bên trong dịch vụ thay vì chỉ xem tiến trình vừa bật</td></tr><tr><td><code>depends_on:
      condition: service_healthy</code></td><td>Chỉ khởi chạy ứng dụng SAU KHI dịch vụ DB/bộ đệm vượt qua kiểm tra sức khoẻ</td></tr><tr><td><code>cache:6379</code>
      (tên + cổng nội bộ)</td><td>Địa chỉ liên dịch vụ chuẩn (KHÔNG dùng <code>127.0.0.1</code> hay cổng ngoài host)</td></tr></table>'
    say: Bảng này giải mã ba khoá quan trọng nhất trong một tệp điều phối nhiều dịch vụ chuẩn mực. Khối kiểm tra sức khoẻ
      định kỳ thăm dò xem dịch vụ đã thực sự nhận kết nối chưa chứ không chỉ kiểm tiến trình có mặt. Khoá phụ thuộc điều kiện
      khoẻ buộc dịch vụ ứng dụng chờ đúng đến khi cơ sở dữ liệu sẵn sàng. Khối kiểm tra sức khoẻ cộng điều kiện phụ thuộc
      ép ứng dụng phải kiên nhẫn đợi tới lúc dịch vụ nền thực sự sẵn sàng nhận kết nối.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
