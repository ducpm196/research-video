scenes:
- id: hook
  kind: hook
  title: Dịch vụ chạy lẻ thì ổn, ghép Compose lại báo lỗi nối?
  checks:
  - 2 * 5 == 10
  steps:
  - show: '<div class=''box key''><p>Ba lỗi cấu hình kinh điển khi ghép hai dịch vụ trong cùng tệp <b>Compose</b>: ứng dụng
      gọi nhầm <code>localhost</code> hoặc cổng ngoài <code>16379</code>, hoặc phóng vào DB ngay khi container vừa khởi động
      chưa mở cổng.</p><p>Hôm nay ta dùng <code>healthcheck</code> kèm dịch vụ thật để vận hành trọn cụm trơn tru.</p></div>'
    say: Chào bạn đến với bài tình huống chuyên gia tổng kết khoá Li-núc và công-tai-nơ. Khi chạy từng công-tai-nơ rời thì
      ổn nhưng ghép chung vào tệp điều phối nhiều dịch vụ lại thường xuyên sập ngay giây đầu tiên vì ba lỗi kết nối kinh điển.
      Chúng gồm gọi nhầm địa chỉ máy cục bộ, gọi nhầm cổng ánh xạ bên ngoài và vội kết nối khi cơ sở dữ liệu chưa sẵn sàng.
      Hôm nay ta chạy thật một cụm hai dịch vụ có kiểm tra sức khoẻ để giải quyết dứt điểm cả ba lỗi đó. Ba lỗi cấu hình kinh
      điển như nhầm cổng ngoài, gọi địa chỉ cục bộ và chạy trước khi cơ sở dữ liệu sẵn sàng lặp lại ở khắp nơi. Khai báo cụm
      nhiều dịch vụ bằng một tệp cấu hình thống nhất giúp tái tạo toàn bộ môi trường chạy chuẩn chỉ với một câu lệnh.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
