      lỗi kết nối, bước kiểm tra sức khoẻ đứng gác giữa hai khối. Chỉ khi bộ đệm vượt qua phép thử trả lời hợp lệ thì ứng
      dụng mới khởi chạy và gọi tới tên dịch vụ ở cổng nội bộ. Nhờ vòng kiểm sức khoẻ chạy liên tục, dịch vụ phụ thuộc chỉ
      nhận lưu lượng khi đã thật sự sẵn sàng phục vụ.
