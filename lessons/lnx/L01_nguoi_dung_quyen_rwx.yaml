      phân quyền trên tệp, bước tiếp theo ta điều khiển vòng đời tiến trình và tín hiệu dừng an toàn. Giữ vững nguyên tắc
      cấp quyền tối thiểu là lá chắn bảo mật quan trọng cho toàn bộ máy chủ dịch vụ về sau.
