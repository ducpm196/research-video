- id: recap
  kind: recap
  title: Chuỗi logic và tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>r=4, w=2, x=1</span><span class='a'>→</span><span class='n'>Chủ | Nhóm | Khác</span><span
