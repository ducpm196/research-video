  - show: <div class='box ok'><p><b>Gợi ý nếu kẹt ở bài L01:</b> (1) duyệt mọi từ NF trên mỗi dòng bằng awk; (2) quy đổi r=4,
      w=2, x=1 cho từng cụm 3 ký tự; (3) xoá ký tự \r nếu chạy trên Windows.</p<p style='margin-top:6px'><b>Mẹo cú pháp:</b>
      Khối <code>awk 'BEGIN{...}'</code> chạy phần khởi tạo trước, hoặc viết vòng <code>for</code> trên từng từ trường <code>NF</code>
