scenes:
- id: hook
  kind: hook
  title: Vì sao phần mềm từ chối đọc khoá khi quyền là 644?
  checks:
  - 4 + 2 + 1 == 7
  - 4 + 2 == 6
  steps:
  - show: <div class='box key'><p>Khi tệp khoá bí mật mang quyền <code>644</code> (<code>rw-r--r--</code>), mọi người dùng
      khác trên cùng máy chủ đều đọc được khoá riêng của bạn.</p><p>Chương trình chuẩn bảo mật yêu cầu khoá riêng phải thu
      hẹp về <code>600</code> (<code>rw-------</code>) và từ chối khởi động nếu quá lỏng.</p></div>
    say: Chào bạn trở lại với thực chiến Li-núc. Nếu bạn vừa sao chép một tệp khoá bảo mật lên máy chủ mới mà công cụ kết
      nối lập tức từ chối làm việc, nguyên nhân thường gặp nhất là quyền tệp quá rộng. Ở quyền sáu bốn bốn mặc định, mọi tài
      khoản khác trên cùng máy chủ đều có quyền đọc trộm nội dung bí mật đó. Hôm nay ta học cách quy đổi ba chữ số quyền hệ
      tám và chọn đúng mức tối thiểu an toàn cho từng loại tệp. Lỗi mở rộng quyền quá thoáng thường khiến dịch vụ kết nối
      bảo mật chủ động từ chối chạy để bảo vệ người dùng khỏi lộ khoá. Biết cách tính nhẩm nhanh bộ ba chữ số hệ tám giúp
      bạn đặt quyền chính xác ngay từ giây đầu khởi tạo tệp nhạy cảm.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
- id: prereq
  kind: prereq
  title: Ôn nhanh kiến thức nền sẽ dùng
  steps:
  - show: <table class='t'><tr><th>nền tảng từ L00</th><th>liên kết phân quyền</th></tr><tr><td>Mỗi tệp gắn liền với một i-nốt</td><td>Mọi
      thông số chủ sở hữu, nhóm và quyền đều lưu ngay trong i-nốt đó</td></tr><tr><td>Số nhị phân và ba nhóm bít</td><td>Mỗi
      nhóm người dùng dùng đúng ba bít tương ứng đọc, ghi, chạy</td></tr></table>
    say: Từ bài 0 bạn đã biết mọi siêu dữ liệu của tệp đều nằm trong nút chỉ mục i-nốt. Ba bít quyền đại diện cho ba hành
      động cơ bản là đọc, ghi và thực thi, nhân lên cho ba nhóm đối tượng tách biệt. Đặt đúng quyền ngay trên nút chỉ mục
      giúp nhân hệ điều hành chặn mọi truy cập trái phép bất kể tên tệp hay liên kết nào.
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    clear: true
- id: sym
  kind: symbol
  title: Giải mã ký hiệu và lệnh mới
  steps:
  - show: '<table class=''t''><tr><th>ký hiệu / lệnh</th><th>quy đổi chuẩn ba nhóm (Chủ | Nhóm | Khác)</th></tr><tr><td><code>r
      = 4, w = 2, x = 1</code></td><td>Trọng số bít: đọc bằng 4, ghi bằng 2, thực thi (hoặc vào thư mục) bằng 1</td></tr><tr><td><code>chmod
      755 file</code></td><td><code>rwxr-xr-x</code>: Chủ toàn quyền (7), Nhóm &amp; Khác chỉ đọc/chạy (5)</td></tr><tr><td><code>chmod
      640 / 600</code></td><td><code>rw-r-----</code> / <code>rw-------</code>: Chuẩn tệp cấu hình nhóm / tệp khoá riêng</td></tr></table>'
    say: Trên bảng là quy tắc đọc và lệnh đặt quyền bát phân trong Li-núc. Ba ký hiệu r, w, x lần lượt mang trọng số bốn,
      hai và một theo lũy thừa hai. Lệnh phân quyền sẽ áp ba chữ số cộng dồn đó lần lượt cho chủ sở hữu, nhóm cùng dự án và
      toàn bộ tài khoản khác trên máy. Ba giá trị bốn, hai, một đại diện cho ba bít nhị phân riêng rẽ không bao giờ chồng
      lấn kết quả khi cộng lại thành một chữ số.
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
    introduces:
    - lnx_quyen_bat_phan
- id: intuition
  kind: intuition
  title: Cấu trúc 9 bit phân quyền thành 3 chữ số hệ tám
  steps:
  - show: <div><svg width="960" height="195" viewBox="0 0 960 195"><rect x="40" y="45" width="270" height="100" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="2"/><text x="175.0" y="89" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Chủ
      sở hữu (Owner)</text><text x="175.0" y="119" font-size="15" text-anchor="middle" fill="#475569">rwx = 4+2+1 = 7 | rw-
      = 6</text><rect x="345" y="45" width="270" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text
      x="480.0" y="89" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Nhóm (Group)</text><text x="480.0"
      y="119" font-size="15" text-anchor="middle" fill="#475569">r-x = 4+0+1 = 5 | r-- = 4</text><rect x="650" y="45" width="270"
      height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="785.0" y="89" font-size="18" font-weight="700"
      text-anchor="middle" fill="#1e293b">Mọi người (Others)</text><text x="785.0" y="119" font-size="15" text-anchor="middle"
      fill="#475569">r-x = 5 | --- = 0 (khoá kín)</text></svg></div>
    say: Hình dung dãy chín bít quyền luôn chia thành ba ngăn đều đặn từ trái sang phải. Ngăn đầu tiên dành cho chính tài
      khoản tạo ra tệp nên thường mang giá trị sáu hoặc bảy. Ngăn giữa dành cho đồng đội chung nhóm, còn ngăn cuối dành cho
      mọi tài khoản lạ nên các tệp nhạy cảm phải khoá về không. Nhờ mô hình ba chữ số bát phân gọn nhẹ, việc kiểm tra an toàn
      cho cả hàng trăm tệp trở nên nhất quán.
    clear: true
  - show: ''
    say: Mỗi chữ số trong dãy ba số bát phân luôn giữ nguyên vai trò cố định theo thứ tự từ chủ sở hữu ra tới cộng đồng. Chuyển
      đổi một dãy chín ký tự thành bộ ba chữ số nhanh như đếm từ không đến bảy chỉ bằng một phép cộng nhỏ. Cách quy đổi ba
      nhóm quyền đọc ghi thực thi thành bộ ba chữ số giúp kiểm soát nhanh quyền truy cập thư mục. Thiết lập đúng chủ sở hữu
      và nhóm làm việc ngăn tình huống dịch vụ mạng bị từ chối quyền ghi tệp tạm.
- id: formula
  kind: formula
  title: Công thức cộng trọng số bát phân cho từng nhóm
  checks:
  - alg.lnx_octal_mode('rwx', 'r-x', 'r-x') == '755'
  - alg.lnx_octal_mode('rw-', 'r--', '---') == '640'
  - alg.lnx_octal_mode('rw-', '---', '---') == '600'
  steps:
  - show: '<div class=''box key''><p>Với mỗi nhóm 3 bit <code>(r, w, x)</code>: tổng quyền = <code>4×r + 2×w + 1×x</code>
      (từ 0 đến 7).</p><ul><li><code>rwxr-xr-x</code>: 4+2+1=7, 4+0+1=5, 4+0+1=5 → <b>755</b></li><li><code>rw-r-----</code>:
      4+2+0=6, 4+0+0=4, 0+0+0=0 → <b>640</b></li><li><code>rw-------</code>: 6, 0, 0 → <b>600</b></li></ul></div>'
    say: Công thức cộng trọng số rất đơn giản vì mỗi quyền đứng ứng với một bít độc lập của số ba bít. Nhờ ghép bốn cho đọc,
      hai cho ghi và một cho thực thi nên r-w-x cộng ra bảy, r-gạch-x ra năm và r-w-gạch ra sáu. Như vậy chuỗi ký hiệu r-w-x
      dài chín chữ cái được thu gọn hoàn toàn thành ba chữ số từ không đến bảy. Bảng giá trị tám mức độ từ không tới bảy liệt
      kê trọn vẹn mọi tổ hợp có thể của quyền đọc, quyền ghi và quyền thực thi.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.2'
    clear: true
- id: example
  kind: example
  title: 'Chạy thật trên Docker Linux: đặt quyền 755, 640 và 600'
  checks:
  - alg.lnx_octal_mode('rwx', 'r-x', 'r-x') == '755'
  steps:
  - show: <table class='t'><tr><th>lệnh hoặc ký hiệu</th><th>ý nghĩa dễ hiểu</th></tr><tr><td><code>stat -c '%a' file</code></td><td>In
      ra mã quyền bát phân thực tế (ví dụ <code>755</code> hoặc <code>640</code>)</td></tr><tr><td><code>stat -c '%A' file</code></td><td>In
      ra chuỗi 10 ký tự chuẩn như <code>-rw-r-----</code></td></tr><tr><td><code>SSH</code> (khoá 600)</td><td>Giao thức kết
      nối máy chủ từ xa; bắt buộc giữ khoá riêng quyền <code>600</code></td></tr><tr><td><code>MSYS_NO_PATHCONV=1</code></td><td>Giữ
      nguyên đường dẫn Linux (<code>/tmp/...</code>) khi gọi Docker trên Git Bash Windows</td></tr></table>
    say: Giải mã hai định dạng đầu ra của lệnh kiểm tra thuộc tính tệp trước khi chạy trong công-tai-nơ Li-núc thật. Đọc song
      song hai định dạng chữ và số trên cùng một tệp xác minh độ đồng nhất tuyệt đối giữa hai cách viết phân quyền.
    clear: true
  - show: '<p><b>Đặt quyền thật 755 cho kịch bản chạy, 640 cho cấu hình và 600 cho khoá bí mật</b></p><div class="code"><div>MSYS_NO_PATHCONV=1
      docker run --rm postgres:17-alpine sh -c ''</div><div>  touch /tmp/run.sh /tmp/app.env /tmp/id_ed25519</div><div>  chmod
      755 /tmp/run.sh &amp;&amp; chmod 640 /tmp/app.env &amp;&amp; chmod 600 /tmp/id_ed25519</div><div>  for f in /tmp/run.sh
      /tmp/app.env /tmp/id_ed25519; do</div><div>    echo "<span>&#36;</span>(basename <span>&#36;</span>f): <span>&#36;</span>(stat
      -c "%a %A" <span>&#36;</span>f)"</div><div>  done</div><div>''</div></div>'
    say: Ta chạy thật trong công-tai-nơ Li-núc bằng cách tạo ba tệp tượng trưng cho chương trình chạy, tệp cấu hình nhóm và
      tệp khoá riêng tư. Sau khi gọi lệnh đặt quyền cho từng tệp, ta đọc ngược cả chữ số hệ tám lẫn chuỗi r-w-x từ hệ thống
      tệp nhân. Ba mức phân quyền bảy năm năm, sáu bốn không và sáu không không là ba mẫu chuẩn bạn sẽ dùng thường xuyên nhất
      trên máy chủ.
    focus:
    - 1
    - 2
    - 2
    clear: true
  - show: '<p><b>Kết quả chạy thật trên môi trường Linux</b></p><div class="code"><div>run.sh: 755 -rwxr-xr-x</div><div>app.env:
      640 -rw-r-----</div><div>id_ed25519: 600 -rw-------</div></div>'
    say: Đầu ra thật khớp từng chữ số với công thức cộng trọng số vì mã bảy năm năm hiện đủ quyền chạy và mã sáu không không
      xoá sạch mọi quyền của nhóm lẫn người ngoài. Dấu gạch ngang ở cụm cuối mã sáu không không cho thấy toàn bộ tài khoản
      khác bị chặn tuyệt đối ngay cả quyền đọc.
    clear: true
    focus:
    - 1
    - 2
- id: check
  kind: check
  title: Đối chứng quy đổi chuỗi rwx sang mã bát phân
  checks:
  - alg.lnx_octal_mode('rwx', 'r-x', 'r-x') == '755'
  steps:
  - show: <p><b>Tính lại trọng số từng cụm 3 ký tự từ chuỗi ký hiệu quyền</b></p><div class="code"><div>awk 'BEGIN{</div><div>  n=split("rwxr-xr-x
      rw-r----- rw-------", arr, " ");</div><div>  for(k=1;k&lt;=n;k++){ s=arr[k]; out="";</div><div>    for(g=0;g&lt;3;g++){
      v=0;</div><div>      if(substr(s,g*3+1,1)=="r") v+=4;</div><div>      if(substr(s,g*3+2,1)=="w") v+=2;</div><div>      if(substr(s,g*3+3,1)=="x")
      v+=1; out=out v; }</div><div>    printf "%s=%s%s", s, out, (k&lt;n?" ":"\n"); }</div><div>}'</div></div>
    say: Ở đường kiểm chứng thứ hai, ta tính độc lập ba chữ số hệ tám trực tiếp từ chín ký tự r-w-x vì mỗi cụm ba ký tự cộng
      đúng một chữ số. Kịch bản tách từng cụm ba ký tự chứng minh thuật toán cộng bốn hai một hoàn toàn đối xứng với nhân
      Li-núc. Khối BEGIN trong awk chạy một lần ngay từ đầu để tách mảng các chuỗi quyền và quy đổi từng cụm ba ký tự sang
      số tám phân.
    clear: true
    focus:
    - 1
    - 2
    - 2
  - show: <p><b>Đầu ra đối chứng thật</b></p><div class="code"><div>rwxr-xr-x=755 rw-r-----=640 rw-------=600</div></div>
    say: Đầu ra đối chứng khớp tuyệt đối ba kết quả bảy trăm năm mươi lăm, sáu trăm bốn mươi và sáu trăm vì phép tách từng
      cụm ba ký tự cộng đúng trọng số bít. Khi áp dụng đúng bộ quy đổi tám phân cho từng tệp cấu hình và tệp bí mật, bạn loại
      bỏ ngay rủi ro mở thừa quyền đọc cho các tài khoản không liên quan. Ba giá trị tính ra khớp nguyên từng con số cho thấy
      phép quy đổi có thể tự động hoá chỉ trong vài dòng mã đơn giản.
    clear: true
    focus:
    - 1
    - 2
    - 2
- id: quymo
  kind: example
  title: Hệ quả mở nhầm quyền 777 qua ba quy mô hạ tầng
  checks:
  - 7 * 100 + 7 * 10 + 7 == 777
  steps:
  - show: <table class='t'><tr><th>quy mô máy chủ</th><th>số tài khoản/dịch vụ trên máy</th><th>tác động nếu đặt quyền 777
      bừa bãi</th></tr><tr><td>Máy cá nhân (1 người)</td><td>1 tài khoản chính</td><td>Vô tình tạo thói quen xấu trước khi
      lên máy thật</td></tr><tr><td>Máy chủ dùng chung (10 dịch vụ)</td><td>10 tài khoản dịch vụ khác nhau</td><td>Bất kỳ
      dịch vụ nào bị lộ đều sửa được tệp của dịch vụ kia</td></tr><tr><td>Cụm hệ thống (100 máy chủ)</td><td>Hàng trăm khoá
      và cấu hình</td><td>Mất hoàn toàn ranh giới cô lập đặc quyền tối thiểu</td></tr></table>
    say: Bảng quy mô giải thích vì sao nguyên tắc đặc quyền tối thiểu cấm tuyệt đối lệnh đặt quyền bảy bảy bảy để chữa cháy.
      Trên máy cá nhân lỗi này chưa gây hại rõ. Khi lên máy chủ có mười dịch vụ độc lập, chỉ một dịch vụ bị lỗi sẽ đọc và
      chép đè toàn bộ tệp của chín dịch vụ còn lại. Trên cụm một trăm máy chủ, quyền mở rộng toàn phần sẽ phá vỡ mọi lớp bảo
      vệ hệ thống. Trên máy chủ phục vụ nhiều ứng dụng, mở toàn quyền bảy bảy bảy cho phép bất kỳ dịch vụ lỗi nào ghi đè tệp
      hệ thống.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    clear: true
- id: pitfalls
  kind: pitfall
  title: Ba lỗi thường gặp trên máy chủ thực tế
  steps:
  - show: '<table class=''t''><tr><th>bẫy thường gặp và cách phòng tránh</th></tr><tr><td><div class=''box warn''><b>Lỗi 1:
      Dùng <code>chmod -R 777 /var/www</code> để ''sửa nhanh'' lỗi Permission denied.</b> Bạn vừa trao quyền ghi và xoá cho
      mọi tài khoản trên máy.<br><b>Lỗi 2: Đặt quyền <code>644</code> cho tệp <code>.env</code> chứa mật khẩu DB.</b> Tài
      khoản khác dù không sửa được nhưng vẫn đọc hết mật khẩu.<br><b>Lỗi 3: Bỏ thiếu bit thực thi <code>x</code> trên thư
      mục (ví dụ đặt <code>644</code> cho thư mục).</b> Người dùng nhìn thấy tên tệp nhưng không <code>cd</code> vào được.</div></td></tr></table>'
    say: Có ba lỗi kinh điển về phân quyền mà kỹ sư mới rất hay vấp. Lỗi nguy hiểm nhất là gõ vội quyền bảy bảy bảy cho cả
      cây thư mục khiến mọi tài khoản trên máy đều sửa xoá được tệp quan trọng. Lỗi thứ hai là để tệp chứa mật khẩu ở quyền
      sáu bốn bốn làm lộ dữ liệu nhạy cảm. Lỗi thứ ba là bỏ quên quyền x trên thư mục khiến lệnh đi vào thư mục bị từ chối.
      Luôn kiểm tra lại quyền tệp vừa tạo bằng lệnh liệt kê chi tiết thay vì đoán theo thói quen. Thay vì nâng quyền rộng
      bừa bãi khi gặp lỗi từ chối truy cập, hãy kiểm tra tên người dùng và nhóm sở hữu hiện tại của tiến trình. Đừng quên
      với thư mục thì quyền thực thi nghĩa là cho phép đi qua thư mục để vào đọc các tệp nằm bên trong. Luôn kiểm tra đồng
      thời ba nhóm quyền chủ sở hữu, nhóm và người ngoài trước khi đưa dịch vụ lên mạng.
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.2'
    - 0
    clear: true
- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - alg.lnx_octal_mode('rw-', 'r--', '---') == '640'
  - alg.lnx_octal_mode('rw-', '---', '---') == '600'
  steps:
  - show: <ol><li>Quy đổi chuỗi quyền <code>rw-r-----</code> sang mã 3 chữ số bát phân?</li><li>Tệp chứa khoá SSH bí mật của
      riêng bạn nên đặt mã quyền bao nhiêu để vừa bảo mật vừa chạy được?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, chuỗi r-w-gạch r-gạch-gạch và ba gạch cuối đổi sang mã ba chữ số bằng bao nhiêu?
      Câu hai, tệp chứa khoá bí mật của riêng bạn cần đặt mã quyền bao nhiêu để phần mềm kết nối chấp nhận? Hãy bấm tạm dừng
      và tự tính. Hai câu hỏi giúp bạn nối kết ngay ký hiệu chữ cái với ba chữ số quyền hạn hệ thống.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>rw-</code> = 4+2 = <b>6</b>; <code>r--</code>
      = <b>4</b>; <code>---</code> = <b>0</b> → mã quyền là <b>640</b>.</p></td></tr></table>
    say: 'Đáp án câu một: bốn cộng hai bằng sáu, chỉ đọc bằng bốn, và không có quyền bằng không, ghép lại thành mã sáu bốn
      không. Việc cộng ba giá trị bốn, hai, một cho từng nhóm người dùng, nhóm chung và người khác giúp chuyển đổi nhanh mọi
      chuỗi quyền quen thuộc. Thành thạo cách cộng từng cụm ba chữ số giúp bạn cấu hình nhanh mọi tệp dịch vụ mà không cần
      tra bảng tham khảo.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② Đặt <b>600</b> (<code>rw-------</code>) để chỉ duy nhất
      chủ sở hữu có quyền đọc và sửa.</p></td></tr></table>
    say: 'Đáp án câu hai: luôn đặt mã sáu trăm để khoá kín hoàn toàn quyền đọc đối với nhóm lẫn mọi người dùng khác. Nguyên
      tắc cấp quyền tối thiểu luôn đặt mức sáu trăm cho khoá riêng tư và không bao giờ mở quyền ghi cho nhóm người dùng lạ.
      Nguyên tắc đặc quyền tối thiểu luôn khởi đầu bằng việc cấp quyền nhỏ nhất đủ cho công việc hợp lệ hoạt động.'
    clear: true
