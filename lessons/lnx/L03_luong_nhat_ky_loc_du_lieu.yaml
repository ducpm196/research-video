      luôn đặt cụm nối gộp phía sau tên tệp đích, và tận dụng đường ống lọc dữ liệu ngay tại chỗ trên máy chủ. Kỹ năng tách
      luồng và lọc văn bản bằng đường ống là công cụ chẩn đoán sự cố hằng ngày. Ghi nhớ đúng số hiệu ba luồng chuẩn, thứ tự
      trái sang phải khi gộp luồng và sức mạnh của lọc tại chỗ bằng công cụ dòng lệnh. Quản lý sạch tệp nhật ký giúp phòng
      tránh thảm hoạ đầy ổ đĩa vốn hay xảy ra ở những hệ thống không xoay vòng tệp.
