id: L03
course: LNX
series: LNX · Linux và Container thực chiến
title: Bài 3 — Luồng chuẩn, đường ống và lọc nhật ký dịch vụ trên Linux
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
af2: true
covers:
- objective: 1
  scene: formula
- objective: 2
  scene: example
- objective: 3
  scene: quymo
source: curriculum/lnx.yaml L03; audit/lnx/verify_lnx.py L03 (chạy thật trên Git Bash & Docker Engine Linux); tài
  liệu POSIX.1-2017 & Linux man-pages; Docker Engine Docs (bản hiện hành)
