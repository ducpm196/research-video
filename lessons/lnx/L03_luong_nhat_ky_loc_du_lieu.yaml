- id: quiz
  kind: quiz
  title: Đến lượt bạn tự kiểm
  checks:
  - round(150 * 100 / 10000, 1) == 1.5
  steps:
  - show: <ol><li>Muốn ghi CẢ đầu ra chuẩn lẫn thông báo lỗi của <code>./srv</code> vào cuối tệp <code>app.log</code> (không
      xoá cũ), viết thế nào?</li><li>Trên tệp log 10 000 dòng có 150 dòng mã 5xx, tỉ lệ lỗi bằng bao nhiêu phần trăm?</li></ol>
    say: Đến lượt bạn tự kiểm tra. Câu một, viết chính xác lệnh nối tiếp cả luồng chuẩn lẫn luồng lỗi vào cuối tệp nhật ký
      mà không ghi đè dữ liệu cũ? Câu hai, một trăm năm mươi dòng lỗi trên mười nghìn dòng là bao nhiêu phần trăm? Bấm tạm
      dừng và trả lời ra giấy. Kiểm tra khả năng tách luồng xuất chuẩn với luồng lỗi và đọc mẫu đếm dòng trong nhật ký.
    pause: 20
  - show: <table class='t'><tr><th>đáp án câu 1</th></tr><tr><td><p>① <code>./srv &gt;&gt; app.log 2&gt;&amp;1</code> (dùng
      <code>&gt;&gt;</code> trước, đặt <code>2&gt;&amp;1</code> ở cuối).</p></td></tr></table>
    say: 'Đáp án câu một: mở nối tiếp tệp nhật ký bằng dấu nối đôi rồi đặt cụm gộp luồng hai sang luồng một ở vị trí sau cùng.
      Tách biệt hai luồng xuất dữ liệu giúp ta ghi riêng thông báo lỗi hệ thống mà không làm hỏng dữ liệu sạch đang truyền
      qua đường ống. Gắn nối tiếp luồng một kèm nối luồng hai sang một chuẩn mực giúp bạn ghi nhật ký tự động an toàn cho
      mọi tiến trình dài.'
    clear: true
  - show: <table class='t'><tr><th>đáp án câu 2</th></tr><tr><td><p>② <code>150 / 10 000 = 1,5%</code>.</p></td></tr></table>
    say: 'Đáp án câu hai: lấy một trăm năm mươi chia cho mười nghìn ta được tỉ lệ lỗi bằng một phẩy năm phần trăm. Khi nối
      nhiều công cụ lọc văn bản theo đường ống, luồng lỗi tách riêng giúp màn hình giám sát luôn sạch sẽ dễ đọc nhật ký thật.
      Tính nhanh tỉ lệ lỗi ngay trên cửa sổ dòng lệnh là thói quen điều tra trực chiến không thể thiếu khi trực sự cố máy
      chủ.'
    clear: true
