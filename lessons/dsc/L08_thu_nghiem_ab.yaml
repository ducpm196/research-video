id: L08
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 8 — Thiết kế thí nghiệm và thử nghiệm A/B"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L08; audit/dsc/verify_dsc.py L08; R. Kohavi, D. Tang, Y. Xu, Trustworthy Online Controlled Experiments (2020), chương 2 và 17; R. A. Fisher, The Design of Experiments (1935); CS115 bài 44"
assumes: [arith, frac, approx, sqrt, cdot]
# Quy ước: so hai tỉ lệ chuyển đổi, kiểm định hai phía mức α = 0,05, độ mạnh 80%; cỡ mẫu theo công thức xấp xỉ chuẩn (alg.ab_sample_size, dùng
#   statistics.NormalDist). Mô phỏng nhìn trộm: hai nhóm giống hệt nhau p = 10%, 1000 người mỗi nhóm, xem 10 lần, 2000 lần mô phỏng, hạt giống 3
#   (alg.peeking_fpr). Tên “A/B” chỉ trên màn hình; lời đọc nói “thử nghiệm so sánh hai phương án”.
objectives:
  - "Hiểu vì sao phải chia nhóm ngẫu nhiên"
  - "Ước lượng cỡ mẫu cần thiết"
  - "Tránh dừng sớm khi vừa thấy kết quả đẹp"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nút xanh hay nút cam?"
    steps:
      - show: |
          <p>Đổi nút “Mua” từ xanh sang cam. Tuần này tỉ lệ mua tăng từ 10% lên 11%. Nhưng tuần này cũng là tuần lương về. Nút cam thật sự tốt hơn, hay chỉ là trùng hợp?</p>
          <div class="box key">Hôm nay: <b>thí nghiệm có đối chứng</b> — chia ngẫu nhiên, đủ cỡ mẫu, quyết định trước khi nhìn kết quả.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, ta đổi nút mua từ màu xanh sang màu cam. Tuần này tỉ lệ mua tăng từ 10 lên 11 phần trăm. Nhưng tuần này cũng là tuần lương về, vậy nút cam thật sự tốt hơn, hay chỉ là trùng hợp? Hôm nay ta học thí nghiệm có đối chứng, chia ngẫu nhiên, đủ cỡ mẫu, và quyết định trước khi nhìn kết quả."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: sai số chuẩn của một tỉ lệ và ngưỡng 1,96"
    checks:
      - "math.sqrt(0.1 * 0.9 / 900) == 0.01 and round(0.10 - 1.96 * 0.01, 4) == 0.0804 and round(0.10 + 1.96 * 0.01, 4) == 0.1196"
    steps:
      - show: |
          <p>Ở khoá Toán cho khoa học máy tính: tỉ lệ $p$ đo trên $n$ người dao động quanh giá trị thật với <b>sai số chuẩn</b> $\sqrt{\frac{p \cdot (1 - p)}{n}}$.</p>
          $$p = 10\%,\ n = 900:\quad \sqrt{\frac{0{,}1 \cdot 0{,}9}{900}} = \sqrt{0{,}0001} = 0{,}01 = 1\%$$
        focus: [1, 1, 2]
        say: "Ở khoá Toán cho khoa học máy tính, ta đã học rằng một tỉ lệ p đo trên n người sẽ dao động quanh giá trị thật. Độ dao động đó gọi là sai số chuẩn, bằng căn của p nhân 1 trừ p, chia n. Ví dụ p bằng 10 phần trăm và n bằng 900, ta được căn của 0 phẩy 1 nhân 0 phẩy 9 chia 900, tức căn của 0 phẩy 0001, bằng 1 phần trăm."
      - show: |
          <p><b>Ngưỡng 1,96</b>: 95% số lần đo rơi trong khoảng trung bình $\pm 1{,}96$ sai số chuẩn. Ở đây: $10\% \pm 1{,}96\%$, tức từ 8,04% tới 11,96%.</p>
        introduces: [pm]
        say: "Còn ngưỡng 1 phẩy 96 nghĩa là 95 phần trăm số lần đo rơi trong khoảng trung bình cộng trừ 1 phẩy 96 lần sai số chuẩn. Ở ví dụ này là 10 phần trăm cộng trừ 1 phẩy 96 phần trăm, tức từ 8 phẩy 04 tới 11 phẩy 96 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: ba thành phần của thí nghiệm"
    steps:
      - show: |
          <ol><li><b>Chia ngẫu nhiên</b>: tung đồng xu cho mỗi khách — nhóm A thấy nút xanh, nhóm B thấy nút cam, <b>cùng một thời gian</b>. Mọi biến gây nhiễu (lương, thời tiết…) chia đều hai nhóm.</li>
          <li><b>Một chỉ số chính</b> chọn trước: tỉ lệ mua.</li>
          <li><b>Cỡ mẫu</b> và mức ý nghĩa α, độ mạnh chọn trước — không đổi giữa chừng.</li></ol>
          <p class="note">Độ mạnh 80%: nếu khác biệt thật sự có, thí nghiệm phát hiện được 80% số lần.</p>
        focus: [1, "1.1", "1.1", "1.2", "1.3", 2]
        say: "Thí nghiệm có ba thành phần. Một, chia ngẫu nhiên, tung đồng xu cho mỗi khách, nhóm A thấy nút xanh, nhóm B thấy nút cam, trong cùng một thời gian. Nhờ vậy mọi biến gây nhiễu như ngày lương hay thời tiết được chia đều cho hai nhóm. Hai, một chỉ số chính chọn trước, ở đây là tỉ lệ mua. Ba, cỡ mẫu, mức ý nghĩa và độ mạnh được chọn trước, không đổi giữa chừng. Độ mạnh 80 phần trăm nghĩa là nếu khác biệt thật sự có, thí nghiệm phát hiện được 80 phần trăm số lần."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
