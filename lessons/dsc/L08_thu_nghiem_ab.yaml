,312 L 1200,313 L 1205,314 L 1210,314 L 1215,315 L 1220,316 L 1225,316 L 1230,317 L 1235,317 L 1240,317 L 1245,318 L 1250,318 L 1255,318 L 1260,318 L 1265,319 L 1270,319 L 1275,319 L 1280,319 L 1285,319 L 1290,319 L 1295,319 L 1300,319 L 1305,320 L 1310,320 L 1315,320 L 1320,320 L 1325,320 L 1330,320 L 1335,320 L 1340,320 L 1345,320 L 1350,320" fill="none" stroke="#eb6834" stroke-width="4"/><line x1="150" y1="320" x2="1350" y2="320" stroke="#6b7280" stroke-width="2"/><line x1="217" y1="320" x2="217" y2="330" stroke="#6b7280" stroke-width="2"/><text x="217" y="356" text-anchor="middle" font-size="20">−1%</text><line x1="550" y1="320" x2="550" y2="330" stroke="#6b7280" stroke-width="2"/><text x="550" y="356" text-anchor="middle" font-size="20">0%</text><line x1="883" y1="320" x2="883" y2="330" stroke="#6b7280" stroke-width="2"/><text x="883" y="356" text-anchor="middle" font-size="20">1%</text><line x1="1217" y1="320" x2="1217" y2="330" stroke="#6b7280" stroke-width="2"/><text x="1217" y="356" text-anchor="middle" font-size="20">2%</text><line x1="783" y1="60" x2="783" y2="320" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="783" y="45" text-anchor="middle" fill="#b91c1c">ngưỡng 0,70%</text><text x="400" y="120" text-anchor="end" fill="#2a78d6">không có khác biệt</text><text x="1033" y="120" fill="#eb6834">khác biệt thật 1%</text><text x="933" y="290" fill="#059669">80% diện tích</text><text x="1360" y="356" font-size="20">hiệu B trừ A</text></g></svg></div>
        focus: [1, 1, 1, 1, 1, 1]
        say: "Hình vẽ hiệu tỉ lệ mua đo được khi mỗi nhóm có mười bốn nghìn bảy trăm năm mươi mốt khách. Nếu nút cam không có tác dụng, hiệu đo được dao động theo quả chuông xanh quanh 0. Nếu nút cam tăng thật 1 điểm phần trăm, hiệu dao động theo quả chuông cam quanh 1 phần trăm. Vạch đỏ ở 0 phẩy 70 phần trăm là ngưỡng, chỉ 5 phần trăm quả chuông xanh vượt qua nó, tính cả hai phía. Phần tô lục là 80 phần trăm quả chuông cam nằm bên phải ngưỡng, đó chính là độ mạnh 80 phần trăm. Ít khách hơn thì hai quả chuông béo ra, chồng lên nhau, và phần tô lục nhỏ đi."

  - id: example
    kind: example
    title: "Cần bao nhiêu khách để thấy 10% → 11%?"
    checks:
      - "alg.ab_sample_size(0.10, 0.11) == 14751"
      - "round(0.01 / math.sqrt(2 * 0.105 * 0.895 / 14751), 2) == 2.8"
    steps:
      - show: |
          <p><b>Bước 1</b> — muốn phát hiện tăng từ 10% lên 11%, α = 0,05 hai phía, độ mạnh 80%: công thức cỡ mẫu cho $\hl{14\,751}$ khách <b>mỗi nhóm</b>.</p>
        say: "Bước một, ta muốn phát hiện mức tăng từ 10 lên 11 phần trăm, với mức ý nghĩa 0 phẩy 05 hai phía và độ mạnh 80 phần trăm. Công thức cỡ mẫu cho mười bốn nghìn bảy trăm năm mươi mốt khách mỗi nhóm."
      - show: |
          <p><b>Bước 2</b> — vì sao nhiều vậy? Sai số chuẩn của hiệu hai tỉ lệ (tỉ lệ chung khoảng 10,5%):</p>
          $$\sqrt{\frac{2 \cdot 0{,}105 \cdot 0{,}895}{14\,751}} \approx 0{,}36\%$$
        focus: [1, 2, 2]
        say: "Bước hai, vì sao nhiều vậy? Với ngần ấy khách, sai số chuẩn của hiệu hai tỉ lệ khoảng 0 phẩy 36 phần trăm. Có số 2 trong căn vì hiệu của hai nhóm cộng dồn dao động của cả hai."
      - show: |
          <p><b>Bước 3</b> — khác biệt cần thấy là 1%: $\frac{1\%}{0{,}36\%} \approx 2{,}8$ lần sai số chuẩn.</p>
        say: "Bước ba, khác biệt 1 phần trăm gấp khoảng 2 phẩy 8 lần sai số chuẩn."
      - clear: true
        show: |
          <p><b>Bước 4</b> — $2{,}8 = 1{,}96 + 0{,}84$: phần 1,96 để vượt ngưỡng mức ý nghĩa, phần 0,84 là dư địa để 80% số lần vẫn vượt được.</p>
          <div class="box key">Khác biệt càng nhỏ, cỡ mẫu càng lớn: giảm khác biệt một nửa thì cần khoảng <b>gấp bốn</b> số khách.</div>
        focus: [1, 1, 2]
        say: "Bước bốn, 2 phẩy 8 bằng 1 phẩy 96 cộng 0 phẩy 84. Phần 1 phẩy 96 để vượt ngưỡng mức ý nghĩa, phần 0 phẩy 84 là dư địa để 80 phần trăm số lần vẫn vượt được. Khác biệt càng nhỏ thì cỡ mẫu càng lớn, giảm khác biệt một nửa thì cần khoảng gấp bốn số khách."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(2 * 0.105 * 0.895 * (2.8 / 0.01) ** 2) == 14735 and alg.ab_sample_size(0.10, 0.11) - round(2 * 0.105 * 0.895 * (2.8 / 0.01) ** 2) == 16 and round(16 / 14751 * 100, 1) == 0.1"
      - "round(1 - __import__('statistics').NormalDist().cdf(1.96 - 0.01 / math.sqrt(2 * 0.105 * 0.895 / 14751)), 2) == 0.80"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>14 751</td><td>đi ngược: cần $\frac{1\%}{\text{sai số chuẩn}} = 2{,}8$, giải ra $n = 2 \cdot 0{,}105 \cdot 0{,}895 \cdot \left(\frac{2{,}8}{0{,}01}\right)^2$</td><td>14 735, lệch 0,1% ✓</td></tr>
          <tr><td>độ mạnh 80%</td><td>với 14 751 khách, xác suất hiệu đo được vượt ngưỡng khi khác biệt thật là 1%</td><td>0,80 ✓</td></tr></table>
        introduces: [power]
        focus: [0, "1.2", "1.2", "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Đi ngược từ yêu cầu 1 phần trăm chia sai số chuẩn phải bằng 2 phẩy 8. Giải ra, n bằng 2 nhân 0 phẩy 105 nhân 0 phẩy 895 nhân bình phương của 2 phẩy 8 chia 0 phẩy 01. Kết quả là mười bốn nghìn bảy trăm ba mươi lăm, chỉ lệch 0 phẩy 1 phần trăm so với công thức, vì công thức tính phương sai riêng cho từng nhóm. Đi xuôi, với mười bốn nghìn bảy trăm năm mươi mốt khách, xác suất hiệu đo được vượt ngưỡng khi khác biệt thật là 1 phần trăm đúng bằng 0 phẩy 80."

  - id: peeking
    kind: concept
    title: "Nhìn trộm và dừng sớm"
    checks:
      - "alg.peeking_fpr(1000, 10, 2000) == (0.189, 0.0495)"
    steps:
      - show: |
          <p>Mô phỏng: hai nhóm <b>giống hệt nhau</b> (cả hai 10%), mỗi nhóm 1000 khách. Xem kết quả sau mỗi 100 khách, dừng ngay khi thấy “có ý nghĩa”.</p>
          <table class="t"><tr><th>cách làm</th><th>tỉ lệ báo “có khác biệt” (dương tính giả)</th></tr>
          <tr><td>kiểm một lần ở cuối</td><td>4,95% — đúng mức α = 5%</td></tr>
          <tr><td>xem 10 lần, thấy đẹp là dừng</td><td>$\hl{18{,}9\%}$ — gần gấp bốn</td></tr></table>
          <div class="box key">Mỗi lần nhìn là một lần “bốc thăm” thêm. Quyết định cỡ mẫu trước, hoặc dùng phương pháp được thiết kế cho nhìn nhiều lần.</div>
        focus: [1, 2, "2.2", "2.3", 3]
        say: "Mô phỏng hai nhóm giống hệt nhau, cả hai đều 10 phần trăm, mỗi nhóm một nghìn khách. Ta xem kết quả sau mỗi 100 khách, và dừng ngay khi thấy có ý nghĩa. Nếu chỉ kiểm một lần ở cuối, tỉ lệ báo nhầm là có khác biệt là 4 phẩy 95 phần trăm, đúng mức 5 phần trăm. Nếu xem 10 lần, thấy đẹp là dừng, tỉ lệ báo nhầm là 18 phẩy 9 phần trăm, gần gấp bốn. Mỗi lần nhìn là thêm một lần bốc thăm, nên hãy quyết định cỡ mẫu trước, hoặc dùng phương pháp được thiết kế riêng cho việc nhìn nhiều lần."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "19600 / 2 == 9800 and math.sqrt(19600 * 0.25) == 70 and round(200 / 70, 2) == 2.86"
      - "round(2 * (1 - __import__('statistics').NormalDist().cdf(200 / 70)), 3) == 0.004"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> So “trước và sau” thay vì hai nhóm cùng lúc <b class="red">(nhiễu)</b>
          <br><span class="note">Tuần sau khác tuần trước ở rất nhiều thứ (lương, lễ, thời tiết). Hai nhóm phải chạy song song.</span></div>
        say: "Lỗi thứ nhất, so trước và sau thay vì so hai nhóm cùng lúc. Tuần sau khác tuần trước ở rất nhiều thứ, như ngày lương, ngày lễ, thời tiết, nên hai nhóm phải chạy song song."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Thí nghiệm quá nhỏ <b class="red">(vô ích)</b>
          <br><span class="note">500 khách mỗi nhóm không phát hiện nổi 10% → 11%: kết quả “không khác biệt” chỉ có nghĩa là chưa đủ dữ liệu.</span></div>
        say: "Lỗi thứ hai, thí nghiệm quá nhỏ. Với 500 khách mỗi nhóm thì không phát hiện nổi mức tăng từ 10 lên 11 phần trăm, và kết quả không khác biệt chỉ có nghĩa là chưa đủ dữ liệu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Theo dõi hai mươi chỉ số rồi báo chỉ số nào “đẹp” <b class="red">(câu cá)</b>
          <br><span class="note">Chọn một chỉ số chính trước. Nhiều chỉ số thì chắc chắn có chỉ số “đẹp” do ngẫu nhiên.</span></div>
        say: "Lỗi thứ ba, theo dõi hai mươi chỉ số rồi báo chỉ số nào đẹp. Hãy chọn một chỉ số chính từ trước, vì nhiều chỉ số thì gần như chắc chắn có chỉ số đẹp do ngẫu nhiên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Đọc kết quả mà không kiểm tỉ lệ chia nhóm <b class="red">(chia lệch)</b></div>
          <table class="t"><tr><th>số minh hoạ</th><th>giá trị</th></tr>
          <tr><td>thiết kế chia đôi, tổng 19 600 khách → dự kiến mỗi nhóm</td><td>9 800</td></tr>
          <tr><td>thấy thực tế</td><td>A 10 000, B 9 600</td></tr>
          <tr><td>độ lệch so với sai số chuẩn $\sqrt{19\,600 \cdot 0{,}25} = 70$</td><td>$\frac{200}{70} \approx 2{,}86$ → khả năng ngẫu nhiên ≈ 0,4%</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là đọc kết quả mà không kiểm tỉ lệ chia nhóm. Với số minh hoạ, thí nghiệm thiết kế chia đôi 19 nghìn 600 khách, nên mỗi nhóm dự kiến 9 nghìn 800. Thực tế nhóm A có 10 nghìn, nhóm B chỉ 9 nghìn 600. Sai số chuẩn của số khách mỗi nhóm là căn của 19 nghìn 600 nhân 0 phẩy 25, bằng 70. Lệch 200 khách là gấp khoảng 2 phẩy 86 lần, khả năng do ngẫu nhiên chỉ khoảng 0 phẩy 4 phần trăm. Chia lệch như vậy báo hiệu hệ thống chia nhóm hoặc ghi nhận có lỗi, nên người làm nghề kiểm tỉ lệ chia nhóm trước khi nhìn tỉ lệ mua."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.ab_sample_size(0.10, 0.12) == 3841 and alg.ab_sample_size(0.10, 0.105) == 57763 and round(57763 / 14751, 1) == 3.9"
      - "round(14751 / 4) == 3688 and 3841 > 3688"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Phát hiện 10% → 12% (α = 0,05, độ mạnh 80%): cần khoảng bao nhiêu khách mỗi nhóm?</td></tr>
          <tr><td>2</td><td>Phát hiện 10% → 10,5%: khoảng gấp mấy lần so với 10% → 11%?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, muốn phát hiện mức tăng từ 10 lên 12 phần trăm, với cùng mức ý nghĩa và độ mạnh, cần khoảng bao nhiêu khách mỗi nhóm? Câu hai, muốn phát hiện từ 10 lên 10 phẩy 5 phần trăm thì cần gấp mấy lần so với từ 10 lên 11? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Ước lượng nhanh: khác biệt gấp đôi (2% thay vì 1%) → cỡ mẫu khoảng $\frac{14\,751}{4} \approx 3688$.</p>
          <p>Tính đúng bằng công thức: $\hl{3841}$ khách mỗi nhóm — nhỉnh hơn một chút vì ở 12% dao động lớn hơn ở 11%.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, ước lượng nhanh trước. Khác biệt gấp đôi nên cần khoảng một phần tư, mười bốn nghìn bảy trăm năm mươi mốt chia 4 được khoảng ba nghìn sáu trăm tám mươi tám. Tính đúng bằng công thức được ba nghìn tám trăm bốn mươi mốt khách mỗi nhóm, nhỉnh hơn một chút vì ở mức 12 phần trăm, tỉ lệ dao động mạnh hơn ở mức 11 phần trăm."
      - show: |
          <p>② Khác biệt bằng một nửa (0,5%) → khoảng $\hl{4}$ lần. Công thức: 57 763 khách mỗi nhóm, $\frac{57\,763}{14\,751} \approx 3{,}9$ lần.</p>
        say: "Câu hai, khác biệt chỉ bằng một nửa nên cần khoảng gấp 4 lần. Công thức cho năm mươi bảy nghìn bảy trăm sáu mươi ba khách mỗi nhóm, chia cho mười bốn nghìn bảy trăm năm mươi mốt được khoảng 3 phẩy 9 lần."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chia ngẫu nhiên, chạy song song</span><span class="a">→</span>
          <span class="n">một chỉ số chính, chọn trước</span><span class="a">→</span>
          <span class="n">cỡ mẫu tính trước</span><span class="a">→</span>
          <span class="n">không dừng khi vừa thấy đẹp</span></div>
        say: "Tổng kết lại, chia ngẫu nhiên và chạy song song, chọn trước một chỉ số chính, tính trước cỡ mẫu, và không dừng khi vừa thấy kết quả đẹp."
      - show: |
          <div class="box key"><b>Tư duy:</b> ngẫu nhiên hoá là cách duy nhất làm hai nhóm giống nhau ở cả những điều ta không biết để đo.</div>
        say: "Điều cần mang theo, chia ngẫu nhiên là cách duy nhất làm hai nhóm giống nhau ở cả những điều ta không biết để đo."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>kiểm định nhiều lần</b> và câu cá dữ liệu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học về kiểm định nhiều lần và cái bẫy câu cá dữ liệu. Hẹn gặp bạn ở bài tiếp theo."
