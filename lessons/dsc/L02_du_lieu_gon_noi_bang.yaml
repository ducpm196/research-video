id: L02
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 2 — Dữ liệu gọn, nối bảng và khoá trùng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L02; audit/dsc/verify_dsc.py L02; H. Wickham, Tidy Data, Journal of Statistical Software 59(10), 2014; DBS bài 2 (nối bảng)"
assumes: [arith, cdot]
# Quy ước: bảng viết thành danh sách dòng (khoá, giá trị); nối trong = alg.join_rows (mỗi cặp dòng cùng khoá cho một dòng kết quả, như phép nối ở
#   DBS). Số tiền tính bằng nghìn đồng. Mọi số do Python trong checks.
objectives:
  - "Sắp dữ liệu về dạng gọn"
  - "Dự đoán số dòng sau khi nối"
  - "Kiểm tính duy nhất của khoá trước khi nối"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Doanh thu tự nhân ba sau một phép nối"
    checks:
      - "len(alg.join_rows([('k', 100), ('k', 200)], [('k', 'A'), ('k', 'B'), ('k', 'C')])) == 6 and sum(r[1] for r in alg.join_rows([('k', 100), ('k', 200)], [('k', 'A'), ('k', 'B'), ('k', 'C')])) == 900"
    steps:
      - show: |
          <p>Khách hàng K có 2 đơn: 100 và 200 nghìn. Bảng địa chỉ lỡ có 3 dòng cho K (cũ, mới, ghi trùng). Nối hai bảng rồi cộng tiền: $\hl{900}$ nghìn thay vì 300. Không có báo lỗi nào.</p>
          <div class="box key">Hôm nay: <b>dữ liệu gọn</b>, <b>nối bảng</b>, và bẫy <b>khoá trùng</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, khách hàng K có 2 đơn hàng, 100 và 200 nghìn. Bảng địa chỉ lỡ có 3 dòng cho K, gồm địa chỉ cũ, mới, và một dòng ghi trùng. Nối hai bảng rồi cộng tiền thì được 900 nghìn thay vì 300, mà không có báo lỗi nào. Hôm nay ta học dữ liệu gọn, cách nối bảng, và cái bẫy khoá trùng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: khoá, đếm lặp, và quy tắc nhân"
    checks:
      - "2 * 3 == 6 and __import__('collections').Counter(['K', 'K', 'M']) == {'K': 2, 'M': 1} and len({'K', 'M'}) == 2 < 3"
    steps:
      - show: |
          <p><b>Khoá</b> là cột dùng để ghép hai bảng (mã khách, mã sản phẩm). Ở khoá Cơ sở dữ liệu, ta đã gặp phép <b>nối</b>: ghép dòng của hai bảng có cùng khoá.</p>
          <table class="t"><tr><th>cột khoá</th><th>đếm mỗi khoá</th><th>số khoá khác nhau</th><th>số dòng</th></tr>
          <tr><td>K, K, M</td><td>K: 2 lần, M: 1 lần</td><td>2</td><td>3</td></tr></table>
        focus: [1, 1, 2]
        say: "Khoá là cột dùng để ghép hai bảng, như mã khách hay mã sản phẩm. Ở khoá Cơ sở dữ liệu, ta đã gặp phép nối, tức ghép những dòng của hai bảng có cùng khoá. Đếm cột khoá K, K, M thì K xuất hiện 2 lần, M 1 lần, có 2 khoá khác nhau trên 3 dòng, nên chắc chắn có khoá bị lặp."
      - show: |
          <p><b>Quy tắc nhân</b>: 2 áo, 3 quần → mỗi áo đi với mọi quần → $2 \cdot 3 = 6$ bộ đồ.</p>
        say: "Phép đếm thứ hai là quy tắc nhân. Có 2 cái áo và 3 cái quần, mỗi áo đi được với mọi quần, nên có 2 nhân 3 bằng 6 bộ đồ. Phép nối bảng cũng đếm đúng theo cách này."

  - id: sym
    kind: symbol
    title: "Giải mã: dữ liệu gọn"
    steps:
      - show: |
          <p><b>Dữ liệu gọn</b> (Wickham, 2014): mỗi <b>biến</b> một cột, mỗi <b>quan sát</b> một dòng, mỗi loại đối tượng một bảng.</p>
          <table class="t"><tr><th>không gọn</th><th>gọn</th></tr>
          <tr><td>cửa hàng | doanh số T1 | doanh số T2</td><td>cửa hàng | tháng | doanh số</td></tr>
          <tr><td>A | 10 | 12</td><td>A | T1 | 10<br>A | T2 | 12</td></tr></table>
          <p class="note">Dạng gọn để lọc, nhóm, vẽ theo “tháng” dễ dàng — tháng là một biến, không phải tên cột.</p>
        focus: [1, 2, "2.2", "2.3", 3]
        say: "Dữ liệu gọn, theo một bài báo năm 2014, là mỗi biến một cột, mỗi quan sát một dòng, mỗi loại đối tượng một bảng. Bảng không gọn đặt doanh số tháng 1 và tháng 2 thành hai cột. Bảng gọn có ba cột, cửa hàng, tháng, doanh số. Cửa hàng A có hai dòng, tháng 1 là 10, tháng 2 là 12. Ở dạng gọn, việc lọc, nhóm hay vẽ theo tháng rất dễ, vì tháng là một biến chứ không phải tên cột."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi dòng trái nắm tay mọi dòng phải cùng khoá"
    steps:
      - show: |
          <div><svg width="1500" height="370" viewBox="0 0 1500 370"><g fill="#1f2937" font-size="22"><line x1="330" y1="110" x2="560" y2="70" stroke="#6b7280" stroke-width="3"/><line x1="330" y1="110" x2="560" y2="170" stroke="#6b7280" stroke-width="3"/><line x1="330" y1="110" x2="560" y2="270" stroke="#6b7280" stroke-width="3"/><line x1="330" y1="230" x2="560" y2="70" stroke="#6b7280" stroke-width="3"/><line x1="330" y1="230" x2="560" y2="170" stroke="#6b7280" stroke-width="3"/><line x1="330" y1="230" x2="560" y2="270" stroke="#6b7280" stroke-width="3"/><rect x="90" y="80" width="240" height="60" rx="8" fill="#2a78d6"/><text x="210" y="119" text-anchor="middle" fill="#ffffff" font-size="26">K, 100</text><rect x="90" y="200" width="240" height="60" rx="8" fill="#2a78d6"/><text x="210" y="239" text-anchor="middle" fill="#ffffff" font-size="26">K, 200</text><rect x="560" y="40" width="200" height="60" rx="8" fill="#eb6834"/><text x="660" y="79" text-anchor="middle" fill="#ffffff" font-size="26">K, A</text><rect x="560" y="140" width="200" height="60" rx="8" fill="#eb6834"/><text x="660" y="179" text-anchor="middle" fill="#ffffff" font-size="26">K, B</text><rect x="560" y="240" width="200" height="60" rx="8" fill="#eb6834"/><text x="660" y="279" text-anchor="middle" fill="#ffffff" font-size="26">K, C</text><rect x="1050" y="28" width="300" height="44" rx="6" fill="#d1fae5"/><text x="1200" y="58" text-anchor="middle" font-size="24">K, 100, A</text><rect x="1050" y="80" width="300" height="44" rx="6" fill="#d1fae5"/><text x="1200" y="110" text-anchor="middle" font-size="24">K, 100, B</text><rect x="1050" y="132" width="300" height="44" rx="6" fill="#d1fae5"/><text x="1200" y="162" text-anchor="middle" font-size="24">K, 100, C</text><rect x="1050" y="184" width="300" height="44" rx="6" fill="#d1fae5"/><text x="1200" y="214" text-anchor="middle" font-size="24">K, 200, A</text><rect x="1050" y="236" width="300" height="44" rx="6" fill="#d1fae5"/><text x="1200" y="266" text-anchor="middle" font-size="24">K, 200, B</text><rect x="1050" y="288" width="300" height="44" rx="6" fill="#d1fae5"/><text x="1200" y="318" text-anchor="middle" font-size="24">K, 200, C</text><text x="210" y="320" text-anchor="middle">đơn: 2 dòng</text><text x="660" y="340" text-anchor="middle">địa chỉ: 3 dòng</text><text x="900" y="180" text-anchor="middle" font-size="40">→</text><text x="1200" y="362" text-anchor="middle">kết quả: 6 dòng</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ phép nối như những sợi dây. Bên trái là 2 đơn của khách K, màu xanh, bên phải là 3 dòng địa chỉ của K, màu cam. Mỗi đơn nắm tay mọi dòng địa chỉ cùng khoá, nên có 2 nhân 3 bằng 6 sợi dây, và mỗi sợi dây thành một dòng kết quả màu lục. Phép nối không biết dòng địa chỉ nào là thật, nó cứ ghép hết."

  - id: example
    kind: example
    title: "Số dòng sau khi nối"
    checks:
      - "alg.join_rows([('k', 100), ('k', 200)], [('k', 'A'), ('k', 'B'), ('k', 'C')])[:2] == [('k', 100, 'A'), ('k', 100, 'B')]"
      - "2 * 3 == 6 and 3 * (100 + 200) == 900"
    steps:
      - show: |
          <p><b>Bước 1</b> — đếm khoá ở mỗi bảng: bảng đơn có K <b>2</b> lần (100, 200); bảng địa chỉ có K <b>3</b> lần (A, B, C).</p>
        say: "Bước một, đếm khoá ở mỗi bảng. Bảng đơn có khoá K 2 lần, ứng với hai đơn 100 và 200 nghìn. Bảng địa chỉ có khoá K 3 lần, là A, B, và C."
      - show: |
          <p><b>Bước 2</b> — nối trong theo khoá: mỗi dòng bên trái ghép với <b>mọi</b> dòng bên phải cùng khoá. Khoá xuất hiện $a$ lần bên trái và $b$ lần bên phải → $a \cdot b$ dòng.</p>
          <p>Ở đây $2 \cdot 3 = \hl{6}$ dòng: (K, 100, A), (K, 100, B), (K, 100, C), (K, 200, A), (K, 200, B), (K, 200, C).</p>
        focus: [1, 1, 2]
        say: "Bước hai, nối trong theo khoá, mỗi dòng bên trái ghép với mọi dòng bên phải cùng khoá. Khoá xuất hiện a lần bên trái và b lần bên phải cho a nhân b dòng. Ở đây là 2 nhân 3 bằng 6 dòng, đơn 100 đi với A, B, C, rồi đơn 200 cũng đi với A, B, C."
      - show: |
          <p><b>Bước 3</b> — cộng tiền trên bảng đã nối: mỗi đơn bị lặp 3 lần → $3 \cdot 100 + 3 \cdot 200 = 3 \cdot 300 = \hl{900}$ thay vì 300.</p>
        say: "Bước ba, cộng tiền trên bảng đã nối. Mỗi đơn bị lặp 3 lần, nên được 3 nhân 100 cộng 3 nhân 200, tức 3 nhân 300, bằng 900 nghìn thay vì 300."
      - clear: true
        show: |
          <table class="t"><tr><th>kiểm</th><th>dự kiến</th><th>thấy</th></tr>
          <tr><td>trước nối: bảng địa chỉ, số khoá khác nhau so với số dòng</td><td>1 = 1</td><td>1 khoá, 3 dòng: sai</td></tr>
          <tr><td>sau nối: số dòng</td><td>2 (mỗi đơn một dòng)</td><td>6: sai</td></tr></table>
          <p><b>Bước 4</b> — hai phép kiểm rẻ tiền bắt được lỗi trước khi nó vào báo cáo.</p>
        focus: [2, "1.2", "1.3"]
        say: "Bước bốn, hai phép kiểm rẻ tiền bắt được lỗi này trước khi nó vào báo cáo. Trước khi nối, ở bảng đáng lẽ là phía một, tức bảng địa chỉ, số khoá khác nhau phải bằng số dòng, nhưng ở đây 1 khoá mà có 3 dòng. Sau khi nối, ta dự kiến 2 dòng, mỗi đơn một dòng, nhưng lại thấy 6."
      - show: |
          <div class="box key"><b>Bước 5</b> — sửa: giữ đúng <b>một</b> địa chỉ cho K (ví dụ địa chỉ mới nhất) → $2 \cdot 1 = 2$ dòng, tổng 300 ✓</div>
        say: "Bước năm, sửa lỗi bằng cách giữ đúng một địa chỉ cho K, ví dụ địa chỉ mới nhất. Khi đó phép nối cho 2 nhân 1 bằng 2 dòng, và tổng tiền trở lại 300 nghìn."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "sorted(r[1] for r in alg.join_rows([('k', 100), ('k', 200)], [('k', 'A'), ('k', 'B'), ('k', 'C')])) == [100, 100, 100, 200, 200, 200] and 100 + 100 + 100 + 200 + 200 + 200 == 900"
      - "(lambda c: c.executescript(\"CREATE TABLE o(k, v); INSERT INTO o VALUES ('K', 100), ('K', 200); CREATE TABLE a(k, d); INSERT INTO a VALUES ('K', 'A'), ('K', 'B'), ('K', 'C');\").execute('SELECT COUNT(*), SUM(v) FROM o JOIN a USING(k)').fetchone())(__import__('sqlite3').connect(':memory:')) == (6, 900)"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>900</td><td>liệt kê cột tiền của 6 dòng rồi cộng: 100 + 100 + 100 + 200 + 200 + 200</td><td>900 ✓</td></tr>
          <tr><td>6 dòng, 900</td><td>chạy đúng câu lệnh nối trong một cơ sở dữ liệu thật, đếm dòng và cộng tiền</td><td>6 dòng, 900 ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, không dùng công thức a nhân b. Liệt kê cột tiền của 6 dòng rồi cộng thẳng, 100 ba lần và 200 ba lần, được 900. Chạy đúng câu lệnh nối trong một cơ sở dữ liệu thật, rồi đếm dòng và cộng tiền, cũng ra 6 dòng và 900, khớp với cách tính bằng quy tắc nhân."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "(lambda j: (sum(v for k, v, d in j if k == 'K'), sum(v for k, v, d in j if k == 'M')))(alg.join_rows([('K', 100), ('K', 200), ('M', 300)], [('K', 'A'), ('K', 'B'), ('K', 'C'), ('M', 'D')])) == (900, 300)"
      - "900 / (900 + 300) == 0.75 and 300 / 1200 == 0.25 and 300 / 600 == 0.5"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nối mà không kiểm khoá trùng <b class="red">(sai âm thầm)</b>
          <br><span class="note">Như ví dụ: mọi tổng bị nhân lên, không có lỗi nào báo ra.</span></div>
        say: "Lỗi thứ nhất, nối bảng mà không kiểm khoá trùng. Như ví dụ, mọi tổng bị nhân lên mà không có lỗi nào báo ra."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng nối trong khi cần giữ mọi dòng bên trái <b class="red">(mất dòng)</b>
          <br><span class="note">Đơn của khách chưa có địa chỉ biến mất khỏi kết quả. Dùng nối trái, rồi đếm các ô trống.</span></div>
        say: "Lỗi thứ hai, dùng nối trong khi cần giữ mọi dòng bên trái. Đơn của khách chưa có địa chỉ sẽ biến mất khỏi kết quả, nên hãy dùng nối trái rồi đếm các ô trống."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Khoá “gần giống” mà không chuẩn hoá <b class="red">(nối hụt)</b>
          <br><span class="note">“Hà Nội”, “Ha Noi”, “ha nội ” (thừa dấu cách) là ba khoá khác nhau. Chuẩn hoá chữ hoa/thường, dấu, khoảng trắng trước khi nối.</span></div>
        say: "Lỗi thứ ba, khoá gần giống nhau mà không chuẩn hoá. Hà Nội có dấu, không dấu, hay thừa một dấu cách là ba khoá khác nhau, nên hãy chuẩn hoá chữ hoa thường, dấu, và khoảng trắng trước khi nối."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Chỉ nhìn tỉ trọng, không so tổng trước và sau nối <b class="red">(lệch không đều)</b></div>
          <table class="t"><tr><th>khách</th><th>tiền đơn thật</th><th>số địa chỉ</th><th>tiền sau nối</th><th>tỉ trọng sau nối</th></tr>
          <tr><td>K</td><td>300</td><td>3</td><td>900</td><td>75%</td></tr>
          <tr><td>M</td><td>300</td><td>1</td><td>300</td><td>25%</td></tr>
          <tr><td>cộng</td><td>600</td><td></td><td>1200</td><td>thật ra mỗi khách 50%</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là chỉ nhìn tỉ trọng mà không so tổng trước và sau khi nối. Khách K có 3 địa chỉ nên đơn 300 nghìn thành 900, chiếm 75 phần trăm. Khách M chỉ có 1 địa chỉ nên vẫn là 300, chiếm 25 phần trăm. Thật ra hai khách mua bằng nhau, mỗi người 50 phần trăm, và tổng đúng là 600 chứ không phải 1200. Khoá trùng không đều làm lệch cả thứ hạng khách hàng, nên người làm nghề luôn đặt một phép khẳng định, tổng tiền trước và sau khi nối phải bằng nhau."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "len(alg.join_rows([('x', 1), ('x', 2), ('y', 3)], [('x', 'p'), ('x', 'q'), ('y', 'r'), ('y', 's'), ('y', 't')])) == 7 == 2 * 2 + 1 * 3"
      - "len({'x', 'y'}) == 2 and len(['p', 'q', 'r', 's', 't']) == 5"
    steps:
      - show: |
          <p>Bảng trái: khoá x hai lần, y một lần. Bảng phải: x hai lần, y ba lần.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nối trong ra bao nhiêu dòng?</td></tr>
          <tr><td>2</td><td>Bảng nào nên được kiểm khoá trùng nếu mỗi x, y lẽ ra chỉ có một thông tin?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, bảng trái có khoá x hai lần và y một lần, bảng phải có x hai lần và y ba lần. Câu một, phép nối trong cho ra bao nhiêu dòng kết quả? Câu hai, nếu mỗi x và y lẽ ra chỉ có một thông tin, bảng nào nên được kiểm khoá trùng? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>① khoá</th><th>lần bên trái</th><th>lần bên phải</th><th>số dòng</th></tr>
          <tr><td>x</td><td>2</td><td>2</td><td>$2 \cdot 2 = 4$</td></tr>
          <tr><td>y</td><td>1</td><td>3</td><td>$1 \cdot 3 = 3$</td></tr>
          <tr><td>cộng</td><td></td><td></td><td>$4 + 3 = \hl{7}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, tính riêng từng khoá rồi cộng lại. Khoá x có 2 dòng bên trái và 2 dòng bên phải, cho 2 nhân 2 bằng 4 dòng. Khoá y có 1 dòng bên trái và 3 dòng bên phải, cho 1 nhân 3 bằng 3 dòng. Cộng lại được 4 cộng 3 bằng 7 dòng."
      - show: |
          <p>② Bảng phải là phía “một”: mỗi khoá phải xuất hiện đúng một lần. Kiểm: 2 khoá khác nhau nhưng 5 dòng → có trùng (x hai lần, y ba lần).</p>
        say: "Câu hai, bảng phải là phía một, nên mỗi khoá phải xuất hiện đúng một lần. Kiểm bằng cách so số khoá khác nhau với số dòng, ở đây có 2 khoá khác nhau mà 5 dòng, nên đang bị trùng, x hai lần và y ba lần."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">gọn: biến là cột, quan sát là dòng</span><span class="a">→</span>
          <span class="n">nối: $a \cdot b$ dòng mỗi khoá</span><span class="a">→</span>
          <span class="n">kiểm khoá duy nhất trước khi nối</span><span class="a">→</span>
          <span class="n">so số dòng sau khi nối</span></div>
        say: "Tổng kết lại, dữ liệu gọn có biến là cột, quan sát là dòng. Nối bảng cho a nhân b dòng mỗi khoá, nên hãy kiểm khoá duy nhất trước khi nối, và so số dòng sau khi nối."
      - show: |
          <div class="box key"><b>Tư duy:</b> đặt ra một con số dự kiến trước mỗi phép biến đổi (số dòng, tổng tiền). Khác dự kiến là dấu hiệu lỗi sớm nhất.</div>
        say: "Điều cần mang theo, hãy đặt một con số dự kiến trước mỗi phép biến đổi, như số dòng hay tổng tiền. Khác dự kiến là dấu hiệu lỗi sớm nhất."
      - clear: true
