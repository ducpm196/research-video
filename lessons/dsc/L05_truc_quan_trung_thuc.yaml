id: L05
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 5 — Trực quan hoá trung thực"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L05; audit/dsc/verify_dsc.py L05; E. R. Tufte, The Visual Display of Quantitative Information (1983) (hệ số nói dối); W. S. Cleveland, R. McGill, Graphical Perception, JASA 79 (1984)"
assumes: [arith, frac, approx]
# Quy ước: biểu đồ cột vẽ bằng audit/dsc/figs.py (một chuỗi một màu, nhãn số trên cột, theo skill dataviz). “Hệ số nói dối” (Tufte 1983) =
#   tỉ lệ thay đổi trên hình / tỉ lệ thay đổi trong số liệu. Mọi số do Python trong checks.
objectives:
  - "Nhận ra trục cắt làm phóng đại khác biệt"
  - "Biết khi nào trục phải bắt đầu từ 0"
  - "Tránh các mẹo hình làm sai lệch"
asr_reviewed:
  - {sentence: "Bên trái, cột B trông cao gấp đôi cột A.", reason: "ASR chép “Bên trái, cục B trong cao gấp đôi cục A”: cột/cục lệch vần (cùng nhầm ở nhiều bài DSY, DSC), trông/trong lệch thanh; câu 9 từ khớp 0,7, hai cột A, B hiện trên biểu đồ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cột B cao gấp đôi cột A?"
    checks:
      - "(52 - 50) / (51 - 50) == 2.0 and round(52 / 51 - 1, 3) == 0.020"
    steps:
      - show: |
          <div><svg width="900" height="320" viewBox="0 0 900 320"><text x="210" y="26" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">trục bắt đầu từ 50</text><line x1="60" y1="270" x2="400" y2="270" stroke="#e5e7eb" stroke-width="1.5"/><text x="52" y="276" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">50</text><line x1="60" y1="226" x2="400" y2="226" stroke="#e5e7eb" stroke-width="1.5"/><text x="52" y="232" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">50,5</text><line x1="60" y1="182" x2="400" y2="182" stroke="#e5e7eb" stroke-width="1.5"/><text x="52" y="188" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">51</text><line x1="60" y1="138" x2="400" y2="138" stroke="#e5e7eb" stroke-width="1.5"/><text x="52" y="144" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">51,5</text><line x1="60" y1="94" x2="400" y2="94" stroke="#e5e7eb" stroke-width="1.5"/><text x="52" y="100" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">52</text><line x1="60" y1="50" x2="400" y2="50" stroke="#e5e7eb" stroke-width="1.5"/><text x="52" y="56" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">52,5</text><rect x="85" y="182" width="90" height="88" rx="4" fill="#2a78d6"/><text x="130" y="174" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">51</text><text x="130" y="302" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="normal">A</text><rect x="235" y="94" width="90" height="176" rx="4" fill="#2a78d6"/><text x="280" y="86" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">52</text><text x="280" y="302" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="normal">B</text><line x1="60" y1="270" x2="400" y2="270" stroke="#1f2937" stroke-width="2"/><text x="680" y="26" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">trục bắt đầu từ 0</text><line x1="530" y1="270" x2="870" y2="270" stroke="#e5e7eb" stroke-width="1.5"/><text x="522" y="276" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">0</text><line x1="530" y1="215" x2="870" y2="215" stroke="#e5e7eb" stroke-width="1.5"/><text x="522" y="221" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">15</text><line x1="530" y1="160" x2="870" y2="160" stroke="#e5e7eb" stroke-width="1.5"/><text x="522" y="166" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">30</text><line x1="530" y1="105" x2="870" y2="105" stroke="#e5e7eb" stroke-width="1.5"/><text x="522" y="111" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">45</text><line x1="530" y1="50" x2="870" y2="50" stroke="#e5e7eb" stroke-width="1.5"/><text x="522" y="56" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">60</text><rect x="555" y="83" width="90" height="187" rx="4" fill="#2a78d6"/><text x="600" y="75" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">51</text><text x="600" y="302" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="normal">A</text><rect x="705" y="79" width="90" height="191" rx="4" fill="#2a78d6"/><text x="750" y="71" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">52</text><text x="750" y="302" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="normal">B</text><line x1="530" y1="270" x2="870" y2="270" stroke="#1f2937" stroke-width="2"/></svg></div>
          <p>Cùng số liệu A = 51, B = 52. Bên trái: B trông cao <b>gấp đôi</b> A. Bên phải: gần bằng nhau. Thật ra B chỉ hơn A khoảng $\hl{2\%}$.</p>
        focus: [1, 2, 2, 2, 2]
        say: "Chào bạn, hai biểu đồ vẽ cùng một số liệu, A bằng 51 và B bằng 52. Bên trái, cột B trông cao gấp đôi cột A. Bên phải, hai cột gần bằng nhau. Thật ra B chỉ hơn A khoảng 2 phần trăm. Hôm nay ta học trực quan hoá trung thực."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: phần trăm thay đổi và chiều dài cột"
    checks:
      - "(15 - 10) / 10 == 0.5 and round((52 - 51) / 51, 4) == 0.0196"
      - "51 - 50 == 1 and 52 - 50 == 2 and (2 - 1) / 1 == 1.0"
    steps:
      - show: |
          <p><b>Phần trăm thay đổi</b> $= \dfrac{\text{mới} - \text{cũ}}{\text{cũ}}$. Ví dụ 10 → 15: $\frac{15 - 10}{10} = 0{,}5 = 50\%$. Còn 51 → 52: $\frac{1}{51} \approx 0{,}0196 \approx 2\%$.</p>
        focus: [1, 1, 1]
        say: "Bài này dùng hai phép tính. Phần trăm thay đổi bằng giá trị mới trừ giá trị cũ, chia cho giá trị cũ, ví dụ từ 10 lên 15 là 5 chia 10, bằng 50 phần trăm. Còn từ 51 lên 52 là 1 chia 51, xấp xỉ 0 phẩy 0196, tức khoảng 2 phần trăm."
      - show: |
          <p><b>Chiều dài cột</b> trên hình $=$ giá trị $-$ mốc nơi trục bắt đầu. Trục bắt đầu từ 50: cột 51 dài $51 - 50 = 1$ phần, cột 52 dài $52 - 50 = 2$ phần.</p>
        say: "Phép thứ hai là chiều dài cột trên hình, bằng giá trị trừ đi mốc nơi trục bắt đầu. Nếu trục bắt đầu từ 50, cột 51 chỉ dài 51 trừ 50 bằng 1 phần, còn cột 52 dài 2 phần, nên trên hình nó dài gấp đôi."

  - id: sym
    kind: symbol
    title: "Giải mã: mắt đọc gì trên mỗi loại biểu đồ"
    steps:
      - show: |
          <table class="t"><tr><th>loại</th><th>mắt so sánh</th><th>trục</th></tr>
          <tr><td>cột</td><td><b>chiều dài</b> cột</td><td><b>phải</b> bắt đầu từ 0 — cắt trục là sai tỉ lệ chiều dài</td></tr>
          <tr><td>đường</td><td><b>vị trí</b> và độ dốc</td><td>không bắt buộc từ 0 (nhiệt độ 28–32 °C) — nhưng phải ghi rõ</td></tr>
          <tr><td>điểm (phân tán)</td><td>vị trí theo hai trục</td><td>chọn khoảng vừa dữ liệu</td></tr></table>
          <div class="box key"><b>Hệ số nói dối</b> (Tufte, 1983) = thay đổi trên hình ÷ thay đổi trong số liệu. Trung thực: gần 1.</div>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Mỗi loại biểu đồ, mắt đọc một thứ khác nhau. Với biểu đồ cột, mắt so chiều dài cột, nên trục phải bắt đầu từ 0, cắt trục là làm sai tỉ lệ chiều dài. Với biểu đồ đường, mắt đọc vị trí và độ dốc, nên trục không bắt buộc từ 0, như nhiệt độ từ 28 tới 32 độ, nhưng phải ghi rõ. Với biểu đồ phân tán, mắt đọc vị trí theo hai trục, nên chọn khoảng vừa với dữ liệu. Hệ số nói dối, đề xuất năm 1983, bằng mức thay đổi trên hình chia mức thay đổi trong số liệu, biểu đồ trung thực có hệ số gần 1."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cắt trục là cắt bỏ phần chung"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><g fill="#1f2937" font-size="22"><rect x="180" y="70" width="1150" height="50" fill="#d1d5db"/><rect x="1330" y="70" width="23" height="50" fill="#2a78d6"/><text x="150" y="104" text-anchor="end" font-size="26">A</text><text x="1367" y="104">51</text><rect x="180" y="150" width="1150" height="50" fill="#d1d5db"/><rect x="1330" y="150" width="46" height="50" fill="#2a78d6"/><text x="150" y="184" text-anchor="end" font-size="26">B</text><text x="1390" y="184">52</text><rect x="180" y="290" width="200" height="42" fill="#2a78d6"/><text x="150" y="320" text-anchor="end" font-size="26">A</text><text x="394" y="320">dài 1 phần</text><rect x="180" y="350" width="400" height="42" fill="#2a78d6"/><text x="150" y="380" text-anchor="end" font-size="26">B</text><text x="594" y="380">dài 2 phần</text><line x1="1330" y1="50" x2="1330" y2="225" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 6"/><text x="755" y="250" text-anchor="middle">phần chung từ 0 tới 50: bị cắt đi</text><text x="1330" y="40" text-anchor="middle" fill="#b91c1c">mốc 50</text><text x="900" y="345" font-size="24">chỉ còn phần thừa ra: B trông gấp đôi A</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình trên vẽ đủ hai cột từ 0, cột A dài 51 và cột B dài 52, gần như bằng nhau. Trục bắt đầu từ 50 nghĩa là cắt bỏ phần xám, phần chung từ 0 tới 50 mà cả hai cột đều có. Hình dưới là thứ còn lại, A thừa ra 1 phần, B thừa ra 2 phần, nên B trông dài gấp đôi. Mắt so chiều dài cột, nên khi phần chung bị cắt, mắt chỉ còn thấy hiệu và đọc nhầm nó thành cả giá trị."

  - id: example
    kind: example
    title: "Tính hệ số nói dối"
    checks:
      - "round(((52 - 50) / (51 - 50) - 1) / (52 / 51 - 1)) == 51"
      - "round((52 / 51 - 1) / (52 / 51 - 1)) == 1"
    steps:
      - show: |
          <p><b>Bước 1</b> — trục từ 50: chiều dài cột là 1 và 2 → trên hình tăng $\frac{2 - 1}{1} = 100\%$.</p>
        say: "Bước một, với trục từ 50, chiều dài hai cột là 1 và 2, nên trên hình tăng 2 trừ 1 chia 1, bằng 100 phần trăm."
      - show: |
          <p><b>Bước 2</b> — trong số liệu: $\frac{52 - 51}{51} = \frac{1}{51} \approx 1{,}96\%$, khoảng 2%.</p>
        say: "Bước hai, trong số liệu chỉ tăng 52 trừ 51 chia 51, tức 1 phần 51, khoảng 1 phẩy 96 phần trăm, xấp xỉ 2 phần trăm."
      - show: |
          <p><b>Bước 3</b> — hình phóng đại khác biệt bao nhiêu lần?</p>
          $$\text{hệ số nói dối} = \frac{100\%}{1{,}96\%} = \frac{1}{1/51} = \hl{51}$$
        focus: [1, 2]
        say: "Bước ba, hệ số nói dối bằng 100 phần trăm chia 1 phẩy 96 phần trăm. Vì 1 phẩy 96 phần trăm đúng bằng 1 phần 51, nên hệ số bằng đúng 51, hình phóng đại khác biệt 51 lần."
      - clear: true
        show: |
          <p><b>Bước 4</b> — trục từ 0: chiều dài 51 và 52 → trên hình tăng $\frac{1}{51}$, đúng bằng số liệu → hệ số $= 1$.</p>
          <div class="box key">Muốn nhấn mạnh khác biệt nhỏ mà vẫn trung thực: vẽ <b>hiệu</b> (B − A = 1) trên trục riêng, hoặc dùng biểu đồ đường có ghi rõ trục.</div>
        focus: [1, 1, 2]
        say: "Bước bốn, với trục từ 0, chiều dài hai cột là 51 và 52. Trên hình tăng 1 phần 51, đúng bằng số liệu, nên hệ số bằng 1. Muốn nhấn mạnh một khác biệt nhỏ mà vẫn trung thực, hãy vẽ hiệu B trừ A trên một trục riêng, hoặc dùng biểu đồ đường có ghi rõ trục."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "176 / 88 == 2.0 and round(191 / 187 - 1, 2) == 0.02"
      - "round(((176 - 88) / 88) / (52 / 51 - 1)) == 51 and round(((191 - 187) / 187) / (52 / 51 - 1), 1) == 1.1"
    steps:
      - show: |
          <table class="t"><tr><th>đo bằng thước trên hình mở đầu</th><th>cột A</th><th>cột B</th><th>B so với A</th></tr>
          <tr><td>trục từ 50</td><td>88 điểm ảnh</td><td>176 điểm ảnh</td><td>gấp 2, tăng 100% ✓</td></tr>
          <tr><td>trục từ 0</td><td>187 điểm ảnh</td><td>191 điểm ảnh</td><td>tăng khoảng 2% ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, ta không dùng công thức mà đo thẳng chiều dài cột trên hình mở đầu, tính bằng điểm ảnh. Ở hình trục từ 50, cột A cao 88 điểm ảnh, cột B cao 176, đúng gấp 2, tức tăng 100 phần trăm, nên hệ số vẫn ra 51. Ở hình trục từ 0, hai cột cao 187 và 191 điểm ảnh, chỉ hơn nhau khoảng 2 phần trăm, hệ số gần 1, phần lệch nhỏ là do làm tròn điểm ảnh."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "80 / 100 == 16 / 20 == 0.8 and 80 / 16 == 5"
      - "40 / 40 * 100 == 100 and 50 / 40 * 100 == 125 and round(2200 / 2000 * 100, 9) == 110 and 2000 / 2000 * 100 == 100"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Hai trục tung trên cùng một biểu đồ <b class="red">(tạo tương quan giả)</b>
          <br><span class="note">Trục tung là trục đứng. Kéo giãn từng trục tuỳ ý là làm hai đường trùng nhau hay tách xa nhau tuỳ ý. Vẽ hai biểu đồ, hoặc đổi cả hai về cùng mốc 100: chia mỗi giá trị cho giá trị đầu của chuỗi rồi nhân 100. Ví dụ 40 → 50 thành 100 → 125; 2000 → 2200 thành 100 → 110.</span></div>
        say: "Lỗi thứ nhất, đặt hai trục tung, tức hai trục đứng với hai thang khác nhau, trên cùng một biểu đồ. Kéo giãn từng trục tuỳ ý là làm hai đường trùng nhau hay tách xa nhau tuỳ ý, nên hãy vẽ hai biểu đồ, hoặc đổi cả hai về cùng mốc 100. Đổi về mốc 100 là chia mỗi giá trị cho giá trị đầu của chuỗi rồi nhân 100, ví dụ chuỗi 40 lên 50 thành 100 lên 125, chuỗi 2000 lên 2200 thành 100 lên 110. Khi đó hai đường dùng chung một trục, và người xem thấy ngay chuỗi đầu tăng 25 phần trăm, chuỗi sau tăng 10 phần trăm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Hình ba chiều, bóng đổ, biểu tượng phóng to <b class="red">(méo)</b>
          <br><span class="note">Phóng biểu tượng to gấp đôi cả hai chiều thì diện tích gấp bốn: mắt thấy 4 lần thay vì 2.</span></div>
        say: "Lỗi thứ hai, dùng hình ba chiều, bóng đổ, hay biểu tượng phóng to. Phóng biểu tượng to gấp đôi cả hai chiều thì diện tích gấp bốn, mắt thấy 4 lần thay vì 2."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn khoảng thời gian để kể chuyện mình muốn <b class="red">(chọn lọc)</b>
          <br><span class="note">Cắt đúng đoạn đang lên của một chuỗi dao động. Hiện đủ khoảng thời gian liên quan, ghi nguồn và ngày lấy số liệu.</span></div>
        say: "Lỗi thứ ba, chọn khoảng thời gian để kể câu chuyện mình muốn, như cắt đúng đoạn đang lên của một chuỗi dao động. Hãy hiện đủ khoảng thời gian liên quan, ghi nguồn và ngày lấy số liệu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Đặt cạnh nhau hai biểu đồ, mỗi cái tự co giãn trục <b class="red">(so sai)</b></div>
          <table class="t"><tr><th>bảng theo dõi (minh hoạ)</th><th>doanh số</th><th>trục</th><th>cột cao bao nhiêu phần khung</th></tr>
          <tr><td>vùng A</td><td>80</td><td>0 tới 100</td><td>$\frac{80}{100} = 80\%$</td></tr>
          <tr><td>vùng B</td><td>16</td><td>0 tới 20</td><td>$\frac{16}{20} = 80\%$</td></tr></table>
          <p>Hai cột cao bằng nhau, nhưng A gấp $\frac{80}{16} = 5$ lần B.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là đặt cạnh nhau hai biểu đồ mà mỗi cái tự co giãn trục cho vừa dữ liệu của nó. Vùng A bán 80, trục đi từ 0 tới 100, nên cột cao 80 phần trăm khung. Vùng B bán 16, trục tự co lại từ 0 tới 20, nên cột cũng cao 80 phần trăm khung. Người xem thấy hai cột bằng nhau, trong khi A gấp 5 lần B, nên khi đặt các biểu đồ cạnh nhau để so, người làm nghề khoá chung một trục."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(110 - 100) / (105 - 100) == 2.0 and round(110 / 105 - 1, 4) == 0.0476 and round(((110 - 100) / (105 - 100) - 1) / (110 / 105 - 1)) == 21"
      - "__import__('fractions').Fraction(110 - 105, 105) == __import__('fractions').Fraction(1, 21)"
    steps:
      - show: |
          <p>Doanh số hai năm: 105 và 110, biểu đồ cột với trục bắt đầu từ 100.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Trên hình, cột sau dài gấp mấy lần cột trước?</td></tr>
          <tr><td>2</td><td>Thật ra tăng bao nhiêu phần trăm? Hệ số nói dối khoảng bao nhiêu?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, doanh số hai năm là 105 và 110, vẽ biểu đồ cột với trục bắt đầu từ 100. Câu một, trên hình, cột sau dài gấp mấy lần cột trước? Câu hai, thật ra tăng bao nhiêu phần trăm, và hệ số nói dối khoảng bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Chiều dài: $105 - 100 = 5$ và $110 - 100 = 10$ → gấp $\hl{2}$ lần, trên hình tăng 100%.</p>
        say: "Đáp án câu một, trừ mốc 100, chiều dài hai cột là 105 trừ 100 bằng 5, và 110 trừ 100 bằng 10. Vậy cột sau dài gấp 2 lần, trên hình tăng 100 phần trăm."
      - show: |
          <p>② Thật ra tăng $\frac{110 - 105}{105} = \frac{5}{105} = \frac{1}{21} \approx 4{,}8\%$.</p>
          <p>Hệ số nói dối $= \dfrac{100\%}{1/21} = \hl{21}$.</p>
        focus: [1, 2]
        say: "Câu hai, thật ra tăng 5 chia 105, tức 1 phần 21, khoảng 4 phẩy 8 phần trăm. Hệ số nói dối bằng 100 phần trăm chia 1 phần 21, bằng 21, hình phóng đại 21 lần."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cột: so chiều dài, trục từ 0</span><span class="a">→</span>
          <span class="n">đường: trục tuỳ ý, ghi rõ</span><span class="a">→</span>
          <span class="n">không trục kép, không 3D</span><span class="a">→</span>
          <span class="n">hệ số nói dối gần 1</span></div>
        say: "Tổng kết lại, biểu đồ cột so chiều dài nên trục từ 0, biểu đồ đường thì trục tuỳ ý nhưng ghi rõ. Không dùng trục kép, không dùng hình ba chiều, và giữ hệ số nói dối gần 1."
      - show: |
          <div class="box key"><b>Tư duy:</b> một biểu đồ là một lập luận. Hỏi: người xem lướt qua 3 giây sẽ kết luận gì — và kết luận đó có đúng với số liệu không?</div>
        say: "Điều cần mang theo, một biểu đồ là một lập luận. Hãy hỏi người xem lướt qua 3 giây sẽ kết luận gì, và kết luận đó có đúng với số liệu không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>tương quan</b> — cách đo và giới hạn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học về tương quan, cách đo và giới hạn của nó. Hẹn gặp bạn ở bài tiếp theo."
