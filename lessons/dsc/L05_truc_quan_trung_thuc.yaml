    say: Gợi ý cài đặt bài số 5 gồm ba bước rõ ràng. Trước hết hãy đọc dữ liệu đầu vào bằng thư viện chuẩn sys, rồi cài đặt đúng công thức hoặc quy tắc bài toán. Cuối cùng in đủ 1 dòng khớp các khoá real gain, truncated visual.
