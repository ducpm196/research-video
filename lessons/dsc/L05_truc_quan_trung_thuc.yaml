- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">cột: so chiều dài, trục từ 0</span><span class="a">→</span>

      <span class="n">đường: trục tuỳ ý, ghi rõ</span><span class="a">→</span>

      <span class="n">không trục kép, không 3D</span><span class="a">→</span>

      <span class="n">hệ số nói dối gần 1</span></div>

      '
    say: 'Tổng kết lại, biểu đồ cột so chiều dài nên trục từ 0, biểu đồ đường thì trục tuỳ ý nhưng ghi rõ. Không dùng trục kép, không dùng hình ba chiều, và giữ hệ số nói dối gần 1. Biểu đồ không chỉ là hình minh họa đẹp mắt mà là một lập luận bằng hình ảnh cần trung thực tuyệt đối với tỉ lệ định lượng của số liệu gốc. Kiểm tra hai câu hỏi đơn giản trước khi gửi biểu đồ: cột đã đặt từ không chưa và trục đã đồng nhất giữa các hình chưa.'
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
  - show: '<div class="chain"><span class="n">cột: so chiều dài, trục từ 0</span><span class="a">→</span>

      <span class="n">đường: trục tuỳ ý, ghi rõ</span><span class="a">→</span>

      <span class="n">không trục kép, không 3D</span><span class="a">→</span>

      <span class="n">hệ số nói dối gần 1</span></div>

      '
    say: Biểu đồ đường cho phép thu phóng trục tung nhằm quan sát độ dốc xu hướng với điều kiện phải chú thích rõ phạm vi giá trị trên mặt biểu đồ. Tránh dùng biểu đồ ba chiều làm méo góc nhìn hay trục tung kép hai đơn vị khác nhau dễ đánh lạc hướng người đọc ngay trong vài giây lướt qua. Ngoài ra việc kiểm tra hệ số phóng đại giữa diện tích hình vẽ và tỉ số dữ liệu thực tế giúp giữ sự trung thực trong mọi báo cáo trình bày. Một mẫu nhỏ lấy thiên lệch về những người chịu trả lời hay những ca bệnh nhập viện nặng không đại diện cho cả cộng đồng lớn. Mở rộng cỡ mẫu gấp mười lần nhưng giữ nguyên cách chọn thiên lệch chỉ giúp bạn tự tin hơn vào một kết luận sai. Trước khi phân tích, luôn hỏi xem dữ liệu đã chạm tới những người im lặng hoặc những giao dịch thất bại chưa. Khi tổng hợp kết quả khảo sát hay nhật ký ứng dụng, phần người dùng im lặng không để lại phản hồi thường mang tính quyết định đối với bức tranh toàn cảnh.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
  - show: '<div class="box key"><b>Tư duy:</b> một biểu đồ là một lập luận. Hỏi: người xem lướt qua 3 giây sẽ kết luận gì — và kết luận đó có đúng với số liệu không?</div>

      <p class="note"><b>So sánh hai quy mô:</b> Hai cột 51 và 52 cắt đáy trục 50 phóng đại chênh 2% thành gấp 2 lần trên 1 hình; trong báo cáo cho hàng nghìn người ra quyết định, sai lệch trục làm đổi lựa chọn đầu tư chỉ sau 3 giây liếc mắt.</p>

      '
    say: Điều cần mang theo, một biểu đồ là một lập luận. Hãy hỏi người xem lướt qua 3 giây sẽ kết luận gì, và kết luận đó có đúng với số liệu không. Sự trung thực trực quan bảo vệ uy tín lâu dài của người làm dữ liệu hơn bất kỳ hiệu ứng trình bày hào nhoáng nào.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: '<p class="note">Bài sau (bài 6): <b>tương quan</b> — cách đo và giới hạn.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 6, ta học về tương quan, cách đo và giới hạn của nó. Hẹn gặp bạn ở bài tiếp theo.
