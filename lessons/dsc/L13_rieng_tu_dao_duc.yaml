- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">xoá tên chưa đủ</span><span class="a">→</span>

      <span class="n">k-ẩn danh: khái quát định danh gián tiếp</span><span class="a">→</span>

      <span class="n">đa dạng giá trị nhạy cảm</span><span class="a">→</span>

      <span class="n">thu ít, có mục đích, thường cần đồng ý</span></div>

      '
    say: Tổng kết lại, xoá tên chưa đủ. Khái quát các cột định danh gián tiếp để đạt k ẩn danh, đảm bảo đa dạng giá trị nhạy cảm trong mỗi nhóm. Và chỉ thu ít dữ liệu, có mục đích, thường phải có sự đồng ý. Xoá cột họ tên hay số định danh hoàn toàn chưa đủ bảo vệ danh tính. Ẩn danh dữ liệu là cân bằng giữa giá trị phân tích thống kê còn giữ lại và mức rủi ro tái định danh cá nhân.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: '<div class="chain"><span class="n">xoá tên chưa đủ</span><span class="a">→</span>

      <span class="n">k-ẩn danh: khái quát định danh gián tiếp</span><span class="a">→</span>

      <span class="n">đa dạng giá trị nhạy cảm</span><span class="a">→</span>

      <span class="n">thu ít, có mục đích, thường cần đồng ý</span></div>

      '
    say: Khái quát hoá các trường bán định danh sao cho mỗi nhóm tương đồng chứa tối thiểu k người cùng lúc kết hợp đa dạng hoá giá trị nhạy cảm giúp giảm nguy cơ lộ danh tính. Khi bảng chứa quá nhiều cột liên kết đồng thời, giữ đạt chuẩn ẩn danh buộc phải gộp các dải thuộc tính thô hơn hẳn làm giảm độ chi tiết cho mô hình phân tích. Vì vậy nguyên tắc tối thiểu hoá dữ liệu chỉ thu đúng trường thật sự cần cho mục tiêu rõ ràng luôn là hàng rào bảo vệ bền vững nhất cho quyền riêng tư. Trong thực hành bảo vệ quyền riêng tư, bước đánh giá rủi ro nối ghép cần thực hiện trước khi chia sẻ bất kỳ tập dữ liệu mẫu nào ra ngoài. Ngay cả khi cột định danh trực tiếp đã bị xoá, các thuộc tính kết hợp như mã bưu chính, giới tính và năm sinh vẫn có thể chỉ đích danh phần lớn cá nhân. Chỉ giữ lại mức độ chi tiết đúng vừa đủ cho mục tiêu phân tích đặt ra.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
  - show: '<div class="box key"><b>Tư duy:</b> mỗi dòng dữ liệu là một con người. Hỏi “nếu dòng này là của tôi, tôi có muốn nó được dùng như vậy không?”.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Bảng 4 dòng đạt 2-ẩn danh trong chưa đầy 1 ms; trên 10 triệu hồ sơ y tế 20 cột định danh gián tiếp, ẩn danh hoá tốn chi phí sắp xếp tăng nhanh hơn tuyến tính và số cột định danh nhiều buộc phải khái quát thô hơn, giảm mạnh độ chi tiết cho phân tích.</p>

      '
    say: Điều cần mang theo, mỗi dòng dữ liệu là một con người. Hãy hỏi nếu dòng này là của tôi, tôi có muốn nó được dùng như vậy không. Đạo đức dữ liệu bắt đầu từ khâu thiết kế thu thập chứ không đợi tới lúc xảy ra sự cố mới tìm cách che chắn. Quy trình kiểm tra chéo với nguồn công khai giúp phát hiện lỗ hổng lộ thông tin trước ngày phát hành.
    focus:
    - 1
    - 2
    - 2
    - 0
  - clear: true
    show: '<p class="note">Bài sau (bài 14): <b>phân tích tái lập được</b> và truyền đạt kết quả.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 14, ta học cách làm phân tích tái lập được và truyền đạt kết quả. Hẹn gặp bạn ở bài tiếp theo.
