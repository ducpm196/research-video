scenes:
- id: hook
  kind: hook
  title: Đã xoá tên — vẫn nhận ra từng người
  steps:
  - show: '<p>Một bảng bệnh án đã xoá họ tên, chỉ giữ mã bưu chính, ngày sinh, giới tính. Năm 2000, Sweeney ước tính khoảng 87% dân Mỹ được xác định <b>duy nhất</b> chỉ bằng ba cột đó — nối với danh sách cử tri công khai là ra tên.</p>

      <div class="box key">Hôm nay: <b>quyền riêng tư</b> — vì sao xoá tên chưa phải ẩn danh, và cách làm tốt hơn.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Chào bạn, một bảng bệnh án đã xoá họ tên, chỉ giữ mã bưu chính, ngày sinh và giới tính. Năm 2000, một nghiên cứu ước tính khoảng 87 phần trăm dân Mỹ được xác định duy nhất chỉ bằng ba cột đó, nối với danh sách cử tri công khai là ra tên. Hôm nay ta học về quyền riêng tư, vì sao xoá tên chưa phải ẩn danh, và cách làm tốt hơn.
- id: prereq
  kind: prereq
  title: 'Ôn lại: đếm theo nhóm và nối hai bảng'
  checks:
  - sorted(__import__('collections').Counter([('A', 1), ('A', 1), ('B', 2), ('B', 2), ('B', 2)]).values()) == [2, 3]
  - alg.join_rows([('10021', 23, 'cúm')], [('10021', 'An')]) == [('10021', 23, 'cúm', 'An')]
  steps:
  - show: '<p><b>Đếm theo nhóm</b>: gom các dòng giống nhau ở những cột đang xét, rồi đếm mỗi nhóm.</p>

      <table class="t"><tr><th>dòng</th><th>(A, 1), (A, 1), (B, 2), (B, 2), (B, 2)</th></tr>

      <tr><td>nhóm (A, 1)</td><td>2 dòng</td></tr>

      <tr><td>nhóm (B, 2)</td><td>3 dòng — nhóm nhỏ nhất có 2 dòng</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    say: Trước hết, ta cần hai phép làm với bảng dữ liệu. Phép thứ nhất là đếm theo nhóm, gom các dòng giống nhau ở những cột đang xét rồi đếm. Với năm dòng A 1, A 1, B 2, B 2, B 2, nhóm A 1 có 2 dòng. Nhóm B 2 có 3 dòng, nên nhóm nhỏ nhất có 2 dòng. Kỹ thuật nhóm và đếm cho phép kiểm tra ngay tại chỗ xem có cá nhân nào đứng trơ trọi một mình trong nhóm hay không.
  - show: '<p><b>Nối bảng</b> (bài 2): ghép những dòng có cùng <b>khoá</b>, tức cột dùng để ghép, ở đây là mã bưu chính. Bảng bệnh án (10021, 23, cúm) nối với danh sách công khai (10021, An) theo mã bưu chính → (10021, 23, cúm, An): biết luôn An bị cúm.</p>

      '
    say: Phép thứ hai là nối bảng, như ở bài 2, ta ghép những dòng có cùng khoá, tức cột dùng để ghép, ở đây là mã bưu chính. Bảng bệnh án có dòng mã 10021, tuổi 23, bệnh cúm, danh sách công khai có mã 10021 với tên An, một tên minh hoạ. Nối theo mã bưu chính ra một dòng có cả bệnh lẫn tên, tức biết luôn An bị cúm. Khoá nối càng nhỏ lẻ và nhiều chiều như mã bưu chính cộng ngày sinh thì nguy cơ khớp duy nhất một người càng cao.
- id: sym
  kind: symbol
  title: 'Giải mã: định danh gián tiếp, k-ẩn danh'
  steps:
  - show: '<p><b>Định danh gián tiếp</b>: các cột không phải tên nhưng ghép lại nhận ra người (mã bưu chính, tuổi, giới, nghề…).</p>

      <p><b>k-ẩn danh</b>: mọi tổ hợp định danh gián tiếp xuất hiện <b>ít nhất k lần</b>. Kẻ nối bảng chỉ thu hẹp được tới một nhóm k người.</p>

      <p class="note">Cách đạt: <b>khái quát</b> (tuổi 23 → “2*”, mã 10021 → “100**”), hoặc che bớt dòng quá hiếm.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    - 3
    - 3
    say: Định danh gián tiếp là các cột không phải tên nhưng ghép lại nhận ra người, như mã bưu chính, tuổi, giới, nghề. Một bảng đạt k ẩn danh khi mọi tổ hợp định danh gián tiếp xuất hiện ít nhất k lần. Khi đó kẻ nối bảng chỉ thu hẹp được tới một nhóm k người. Cách đạt là khái quát hoá, như tuổi 23 thành hai mươi mấy, mã 10021 thành 100 sao sao, hoặc che bớt những dòng quá hiếm. Càng cần bảo vệ quyền riêng tư cao, ta càng phải chọn ngưỡng k lớn hơn hoặc giảm bớt số cột định danh gián tiếp. Khái niệm đa dạng L bổ sung chốt chặn thứ hai để nhóm có k người nhưng vẫn giữ nhiều giá trị bệnh lý khác nhau. Sự kết hợp giữa k ẩn danh và đa dạng L bảo vệ vững chắc cả danh tính lẫn bí mật bệnh án.
- id: intuition
  kind: intuition
  title: Kẻ nối bảng nhìn thấy gì
  steps:
  - show: '<div><svg width="1500" height="370" viewBox="0 0 1500 370"><g fill="#1f2937" font-size="22"><rect x="60" y="44" width="250" height="44" rx="6" fill="#dbeafe"/><text x="185" y="74" text-anchor="middle" font-size="20">10021, 23, cúm</text><rect x="60" y="114" width="250" height="44" rx="6" fill="#dbeafe"/><text x="185" y="144" text-anchor="middle" font-size="20">10027, 27, sốt</text><rect x="60" y="184" width="250" height="44" rx="6" fill="#dbeafe"/><text x="185" y="214" text-anchor="middle" font-size="20">10132, 35, ho</text><rect x="60" y="254" width="250" height="44" rx="6" fill="#dbeafe"/><text x="185" y="284" text-anchor="middle" font-size="20">10139, 38, cúm</text><rect x="510" y="44" width="210" height="44" rx="6" fill="#fde68a"/><text x="615" y="74" text-anchor="middle" font-size="20">10021, 23: An</text><rect x="510" y="114" width="210" height="44" rx="6" fill="#fde68a"/><text x="615" y="144" text-anchor="middle" font-size="20">10027, 27: Bình</text><rect x="510" y="184" width="210" height="44" rx="6" fill="#fde68a"/><text x="615" y="214" text-anchor="middle" font-size="20">10132, 35: Chi</text><rect x="510" y="254" width="210" height="44" rx="6" fill="#fde68a"/><text x="615" y="284" text-anchor="middle" font-size="20">10139, 38: Dũng</text><line x1="310" y1="70" x2="510" y2="70" stroke="#b91c1c" stroke-width="3"/><line x1="310" y1="140" x2="510" y2="140" stroke="#b91c1c" stroke-width="3"/><line x1="310" y1="210" x2="510" y2="210" stroke="#b91c1c" stroke-width="3"/><line x1="310" y1="280" x2="510" y2="280" stroke="#b91c1c" stroke-width="3"/><rect x="790" y="44" width="250" height="44" rx="6" fill="#dbeafe"/><text x="915" y="74" text-anchor="middle" font-size="20">100**, 2*, cúm</text><rect x="790" y="114" width="250" height="44" rx="6" fill="#dbeafe"/><text x="915" y="144" text-anchor="middle" font-size="20">100**, 2*, sốt</text><rect x="790" y="184" width="250" height="44" rx="6" fill="#dbeafe"/><text x="915" y="214" text-anchor="middle" font-size="20">101**, 3*, ho</text><rect x="790" y="254" width="250" height="44" rx="6" fill="#dbeafe"/><text x="915" y="284" text-anchor="middle" font-size="20">101**, 3*, cúm</text><rect x="1240" y="44" width="210" height="44" rx="6" fill="#fde68a"/><text x="1345" y="74" text-anchor="middle" font-size="20">10021, 23: An</text><rect x="1240" y="114" width="210" height="44" rx="6" fill="#fde68a"/><text x="1345" y="144" text-anchor="middle" font-size="20">10027, 27: Bình</text><rect x="1240" y="184" width="210" height="44" rx="6" fill="#fde68a"/><text x="1345" y="214" text-anchor="middle" font-size="20">10132, 35: Chi</text><rect x="1240" y="254" width="210" height="44" rx="6" fill="#fde68a"/><text x="1345" y="284" text-anchor="middle" font-size="20">10139, 38: Dũng</text><line x1="1040" y1="70" x2="1240" y2="70" stroke="#059669" stroke-width="3"/><line x1="1040" y1="70" x2="1240" y2="140" stroke="#059669" stroke-width="3"/><line x1="1040" y1="140" x2="1240" y2="70" stroke="#059669" stroke-width="3"/><line x1="1040" y1="140" x2="1240" y2="140" stroke="#059669" stroke-width="3"/><line x1="1040" y1="210" x2="1240" y2="210" stroke="#059669" stroke-width="3"/><line x1="1040" y1="210" x2="1240" y2="280" stroke="#059669" stroke-width="3"/><line x1="1040" y1="280" x2="1240" y2="210" stroke="#059669" stroke-width="3"/><line x1="1040" y1="280" x2="1240" y2="280" stroke="#059669" stroke-width="3"/><text x="60" y="30" font-size="22">bảng gốc, đã xoá tên</text><text x="510" y="30" font-size="22">danh sách công khai</text><text x="790" y="30" font-size="22">sau khái quát</text><text x="1240" y="30" font-size="22">danh sách công khai</text><text x="360" y="345" text-anchor="middle" fill="#b91c1c">mỗi dòng nối đúng 1 tên: lộ</text><text x="1090" y="345" text-anchor="middle" fill="#059669">mỗi dòng nối 2 tên: không biết là ai</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ cách một người ngoài nối bảng bệnh án với một danh sách công khai có tên, các tên đều là minh hoạ. Bên trái là bảng gốc đã xoá tên, mỗi dòng khớp đúng một người theo mã bưu chính và tuổi, nên mỗi sợi dây đỏ chỉ thẳng vào một cái tên. Bên phải là bảng sau khi khái quát, mỗi dòng khớp với hai người, nên có hai sợi dây lục và người ngoài chỉ biết đó là một trong hai. Ẩn danh hoá không xoá thông tin về người, nó làm cho mỗi người lẫn vào một nhóm. Kẻ tấn công không cần bẻ khoá dữ liệu mà chỉ việc đối chiếu với danh sách cử tri hay mạng xã hội công khai bên ngoài.
- id: example
  kind: example
  title: Từ 1-ẩn danh lên 2-ẩn danh
  checks:
  - alg.k_anonymity([('10021', 23, 'cúm'), ('10027', 27, 'sốt'), ('10132', 35, 'ho'), ('10139', 38, 'cúm')], [0, 1]) == 1
  - alg.k_anonymity([('100**', '2*', 'cúm'), ('100**', '2*', 'sốt'), ('101**', '3*', 'ho'), ('101**', '3*', 'cúm')], [0, 1]) == 2
  steps:
  - show: '<table class="t"><tr><th>mã bưu chính</th><th>tuổi</th><th>bệnh</th></tr>

      <tr><td>10021</td><td>23</td><td>cúm</td></tr>

      <tr><td>10027</td><td>27</td><td>sốt</td></tr>

      <tr><td>10132</td><td>35</td><td>ho</td></tr>

      <tr><td>10139</td><td>38</td><td>cúm</td></tr></table>

      <p><b>Bước 1</b> — đếm theo nhóm (mã, tuổi): mỗi tổ hợp xuất hiện 1 lần → 1-ẩn danh, ai cũng lộ.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Bảng gốc có bốn dòng với mã bưu chính, tuổi và bệnh. Bước một, đếm theo nhóm mã và tuổi. Mỗi tổ hợp mã và tuổi chỉ xuất hiện một lần, nên bảng là 1 ẩn danh, ai cũng lộ. Chỉ cần nhìn vào tổ hợp mã năm chữ số và tuổi chính xác, từng bệnh nhân trong bảng đều lộ diện một đối một.
  - show: '<p><b>Bước 2</b> — khái quát mã bưu chính: giữ 3 chữ số đầu. 10021, 10027 → 100**; 10132, 10139 → 101**.</p>

      '
    say: Bước hai, khái quát mã bưu chính, chỉ giữ 3 chữ số đầu. Mã 10021 và 10027 cùng thành 100 sao sao, mã 10132 và 10139 cùng thành 101 sao sao. Khái quát hoá đánh đổi một phần độ mịn thống kê theo từng phường để gom dân cư về quy mô quận lớn hơn.
  - show: '<p><b>Bước 3</b> — khái quát tuổi theo chục: 23, 27 → 2*; 35, 38 → 3*.</p>

      '
    say: Bước ba, khái quát tuổi theo chục. Tuổi 23 và 27 thành hai mươi mấy, tuổi 35 và 38 thành ba mươi mấy. Việc chia nhóm tuổi theo từng thập kỷ xóa bớt dấu vết ngày sinh cụ thể mà vẫn giữ được xu hướng bệnh theo độ tuổi.
  - clear: true
    show: '<table class="t"><tr><th>mã bưu chính</th><th>tuổi</th><th>bệnh</th><th>sau khái quát</th></tr>

      <tr><td>10021</td><td>23</td><td>cúm</td><td>100**, 2*</td></tr>

      <tr><td>10027</td><td>27</td><td>sốt</td><td>100**, 2*</td></tr>

      <tr><td>10132</td><td>35</td><td>ho</td><td>101**, 3*</td></tr>

      <tr><td>10139</td><td>38</td><td>cúm</td><td>101**, 3*</td></tr></table>

      <p><b>Bước 4</b> — đếm lại: mỗi tổ hợp 2 lần → $\hl{2\text{-ẩn danh}}$.</p>

      '
    focus:
    - '1.2'
    - '1.4'
    - 2
    - 2
    - 2
    say: Bước bốn, đếm lại. Hai dòng đầu cùng là 100 sao sao và hai mươi mấy. Hai dòng sau cùng là 101 sao sao và ba mươi mấy. Giờ mỗi tổ hợp xuất hiện hai lần, nên bảng đạt 2 ẩn danh. Ngay khi mọi nhóm tương đương đều chứa ít nhất hai dòng, kẻ ngoài nhìn vào chỉ khoanh được cặp người mà không chắc ai mắc bệnh gì.
  - show: <p><b>Bước 5 — dùng Counter đếm lớp tương đương và kiểm tra k-ẩn danh trong Python</b>:</p><div class="code"><div>from collections import Counter</div><div>rows = [&#x27;12*:25-34&#x27;, &#x27;12*:25-34&#x27;, &#x27;45*:35-44&#x27;, &#x27;45*:35-44&#x27;, &#x27;90*:55+&#x27;]</div><div>counts = Counter(rows)</div><div>min_k = min(counts.values())</div><div>print(f&#x27;min_k={min_k} is_2_anon={int(min_k &gt;= 2)}&#x27;)</div></div>
    say: Bước năm, ta giới thiệu lớp Counter trong thư viện chuẩn collections để đếm tần suất từng nhóm bán định danh chỉ bằng một dòng gọi. Nhờ bộ đếm từ điển này, ta lấy ngay cỡ nhóm nhỏ nhất min k trên toàn bảng dữ liệu. Vì có một bản ghi đứng lẻ ở nhóm tuổi 55 trở lên nên min k bằng 1 và bảng chưa đạt 2 ẩn danh.
    clear: true
    focus: null
- id: check
  kind: check
  title: Tự kiểm bằng đường khác
  checks:
  - '(lambda pub, rows: [sum(1 for z2, a2 in pub if (z2[:3], str(a2)[0]) == (z[:3], str(a)[0])) for z, a in rows])([(''10021'', 23), (''10027'', 27), (''10132'', 35), (''10139'', 38)], [(''10021'', 23), (''10027'', 27), (''10132'', 35), (''10139'', 38)]) == [2, 2, 2, 2]'
  - min(len(list(g)) for _, g in __import__('itertools').groupby(sorted([('100**', '2*'), ('100**', '2*'), ('101**', '3*'), ('101**', '3*')]))) == 2
  steps:
  - show: '<table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>2-ẩn danh</td><td>đóng vai kẻ tấn công: với mỗi dòng đã khái quát, đếm số người trong danh sách công khai khớp được</td><td>dòng nào cũng khớp 2 người ✓</td></tr>

      <tr><td>k = 2</td><td>sắp xếp các tổ hợp rồi đếm từng đoạn giống nhau liên tiếp, lấy đoạn ngắn nhất</td><td>2 ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác. Đóng vai kẻ tấn công, với mỗi dòng đã khái quát, đếm xem bao nhiêu người trong danh sách công khai khớp được, dòng nào cũng khớp 2 người, nên đoán bừa chỉ đúng một nửa. Cách thứ hai, sắp xếp các tổ hợp rồi đếm từng đoạn giống nhau liên tiếp, đoạn ngắn nhất dài 2, nên k bằng 2. Đóng vai kẻ tấn công tự kiểm thử là quy trình chuẩn trước mọi đợt công bố tập dữ liệu y tế hay tài chính công cộng.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp, có lỗi cả người đã đi làm
  checks:
  - '{''cúm'', ''sốt''} & {''cúm'', ''ho''} == {''cúm''}'
  - alg.k_anonymity([('70**', '4*', 'tiểu đường')] * 3 + [('71**', '5*', 'cúm'), ('71**', '5*', 'ho'), ('71**', '5*', 'sốt')], [0, 1]) == 3
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Xoá cột tên rồi gọi là ẩn danh <b class="red">(sai)</b>

      <br><span class="note">Các cột còn lại nối được với nguồn khác. Kiểm k-ẩn danh trên mọi cột định danh gián tiếp.</span></div>

      '
    say: Lỗi thứ nhất, xoá cột tên rồi gọi là ẩn danh. Các cột còn lại nối được với nguồn khác, nên hãy kiểm k ẩn danh trên mọi cột định danh gián tiếp. Bất kỳ tập dữ liệu hành vi nào có vết thời gian và địa điểm chi tiết đều rất khó ẩn danh chỉ bằng cách xóa tên.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Tin k-ẩn danh là đủ <b class="red">(chưa đủ)</b>

      <br><span class="note">Nhóm (70**, 4*) có 3 người — 3-ẩn danh — nhưng cả ba đều “tiểu đường”: biết ai đó trong nhóm là biết bệnh. Cần thêm đa dạng giá trị nhạy cảm trong mỗi nhóm.</span></div>

      '
    say: Lỗi thứ hai, tin rằng k ẩn danh là đủ. Một nhóm có 3 người, đạt 3 ẩn danh, nhưng cả ba đều tiểu đường, nên biết ai đó thuộc nhóm là biết bệnh. Cần thêm sự đa dạng của giá trị nhạy cảm trong mỗi nhóm. Lý tưởng nhất, mọi lớp tương đương đều chứa tối thiểu L giá trị nhạy cảm phân bố đều để tránh đoán mò bằng xác suất.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Thu và giữ mọi dữ liệu “phòng khi cần” <b class="red">(rủi ro, trái luật)</b>

      <br><span class="note">Chỉ thu dữ liệu cần cho mục đích đã nêu, thường phải có sự đồng ý của người có dữ liệu (luật có nêu một số trường hợp ngoại lệ), giữ trong thời gian cần thiết (tinh thần của Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15 và Nghị định 356/2025/NĐ-CP hướng dẫn luật, cùng hiệu lực từ 1/1/2026; Nghị định 356 thay Nghị định 13/2023/NĐ-CP). Dữ liệu không thu thì không thể bị lộ.</span></div>

      '
    say: Lỗi thứ ba, thu và giữ mọi dữ liệu phòng khi cần. Hãy chỉ thu dữ liệu cần cho mục đích đã nêu, thường phải có sự đồng ý của người có dữ liệu, và chỉ giữ trong thời gian cần thiết. Đó là tinh thần của luật bảo vệ dữ liệu cá nhân năm 2025 và nghị định hướng dẫn luật, cùng có hiệu lực từ năm 2026. Dữ liệu không thu thì không thể bị lộ. Nguyên tắc tối thiểu dữ liệu còn giúp giảm thiệt hại trực tiếp nếu kho lưu trữ không may gặp sự cố rò rỉ về sau.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Công bố hai bảng từ cùng dữ liệu, mỗi bảng khái quát một kiểu <b class="red">(ghép lại thì lộ)</b></div>

      <table class="t"><tr><th>minh hoạ</th><th>nhóm chứa An</th><th>bệnh trong nhóm</th></tr>

      <tr><td>bảng 1: khái quát theo mã và tuổi (2-ẩn danh)</td><td>An, Bình</td><td>cúm, sốt</td></tr>

      <tr><td>bảng 2: khái quát kiểu khác (2-ẩn danh)</td><td>An, Chi</td><td>cúm, ho</td></tr>

      <tr><td><b>giao hai tập bệnh</b></td><td>An</td><td><b>cúm</b> — lộ</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - 0
    - 2
    say: Lỗi thứ tư, người đã đi làm cũng hay mắc, là công bố hai bảng từ cùng một dữ liệu, mỗi bảng khái quát theo một kiểu. Trong bảng 1, An nằm chung nhóm với Bình, bệnh trong nhóm là cúm và sốt, bảng đạt 2 ẩn danh. Trong bảng 2, An lại nằm chung nhóm với Chi, bệnh trong nhóm là cúm và ho, cũng đạt 2 ẩn danh. Người ngoài lấy giao của hai tập bệnh thì chỉ còn cúm, tức biết chắc An bị cúm. Người làm nghề kiểm rủi ro trên tất cả những gì đã công bố, không chỉ trên từng bảng riêng. Giao cắt tập hợp giữa nhiều bảng báo cáo chéo nhau thường vô hiệu hoá lớp khái quát mà từng bảng riêng lẻ đã xây.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.k_anonymity([('A', 1), ('A', 1), ('B', 2), ('B', 2), ('B', 2)], [0, 1]) == 2
  steps:
  - show: '<p>Bảng có các tổ hợp định danh gián tiếp: (A, 1) hai lần, (B, 2) ba lần.</p>

      <table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Bảng đạt k-ẩn danh với k bằng mấy?</td></tr>

      <tr><td>2</td><td>Nếu cả ba người (B, 2) cùng một bệnh, có lộ thông tin không?</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm, bảng có tổ hợp A và 1 xuất hiện hai lần, tổ hợp B và 2 xuất hiện ba lần. Câu một, bảng đạt k ẩn danh với k bằng mấy? Câu hai, nếu cả ba người trong nhóm B và 2 cùng một bệnh thì có lộ thông tin không? Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Bước 1: đếm theo nhóm: (A, 1) có 2 dòng, (B, 2) có 3 dòng. Bước 2: k = nhóm nhỏ nhất = $\hl{2}$.</p>

      '
    say: Đáp án câu một, bước một, đếm theo nhóm, A 1 có 2 dòng, B 2 có 3 dòng. Bước hai, k bằng cỡ nhóm nhỏ nhất, tức 2, dù nhóm B 2 có tới 3 người. Chỉ số k của toàn bảng luôn bị kéo xuống đúng bằng kích thước của nhóm yếu nhất, tức nhóm nhỏ nhất hiện có.
  - show: '<p>② <b>Có</b>: nhóm (B, 2) đạt ẩn danh về <b>người</b>, nhưng chỉ có <b>một</b> giá trị bệnh. Biết một người thuộc nhóm (B, 2) là biết bệnh — thiếu đa dạng.</p>

      '
    say: 'Câu hai, có lộ. Nhóm B 2 che được người là ai, nhưng chỉ có một giá trị bệnh, nên biết một người thuộc nhóm B và 2 là biết bệnh của họ, nhóm đó thiếu đa dạng. Hai tiêu chuẩn k ẩn danh và L đa dạng giải quyết hai mối đe doạ khác nhau: lộ danh tính người và lộ thuộc tính nhạy cảm.'
