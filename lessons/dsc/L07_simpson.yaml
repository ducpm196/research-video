assumes: [arith, frac, approx, ltgt]
# Quy ước: số liệu sỏi thận theo Charig và cộng sự (1986): A = mổ mở, B = tán sỏi qua da; “thành công” theo định nghĩa của bài báo. Phần trăm làm
#   tròn tới đơn vị. Ví dụ tuyển sinh ở phần tự làm là số liệu MINH HOẠ. Tên nghịch lý chỉ trên màn hình; lời đọc nói “nghịch lý gộp nhóm”.
objectives:
  - "Nhận ra biến gây nhiễu"
  - "Hiểu nghịch lý Simpson"
  - "Biết quyết định tách hay gộp dựa vào nhân quả, không theo quy tắc máy móc"
asr_reviewed:
  - {sentence: "Lỗi thứ ba, chỉ báo tỉ lệ gộp chung của tất cả các nhóm.", reason: "ASR chép “Lội thứ Ba chỉ báo tỷ lệ gục chung của tất cả các nhóm”: lỗi/lội lệch thanh (đã biết), tỉ/tỷ chỉ khác chính tả, gộp/gục lệch vần; câu đã viết dài từ bản 7 từ (0,75) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tốt hơn ở mọi nhóm, kém hơn khi gộp lại"
    checks:
      - "81 / 87 > 234 / 270 and 192 / 263 > 55 / 80 and 273 / 350 < 289 / 350"
    steps:
      - show: |
          <p>Hai cách chữa sỏi thận, A và B. Với sỏi nhỏ, A thành công nhiều hơn. Với sỏi lớn, A cũng thành công nhiều hơn. Gộp hết bệnh nhân lại: <b>B</b> thành công nhiều hơn.</p>
          <div class="box key">Hôm nay: <b>biến gây nhiễu</b> và nghịch lý Simpson — vì sao gộp nhóm có thể đảo ngược kết luận.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, có hai cách chữa sỏi thận, A và B. Với sỏi nhỏ, A thành công nhiều hơn. Với sỏi lớn, A cũng thành công nhiều hơn. Vậy mà gộp hết bệnh nhân lại, B thành công nhiều hơn. Hôm nay ta học biến gây nhiễu, và nghịch lý gộp nhóm, vì sao gộp nhóm có thể đảo ngược kết luận."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tỉ lệ, và gộp hai tỉ lệ"
    checks:
      - "9 / 10 == 0.9 and 10 / 100 == 0.1 and (9 + 10) / (10 + 100) < 0.5 and round((9 + 10) / (10 + 100) * 100) == 17"
      - "round(10 / 110 * 0.9 + 100 / 110 * 0.1, 9) == round(19 / 110, 9)"
    steps:
      - show: |
          <p><b>Tỉ lệ thành công</b> = số ca thành công chia số ca: nhóm 1 có $\frac{9}{10} = 90\%$, nhóm 2 có $\frac{10}{100} = 10\%$.</p>
          <p><b>Gộp</b> hai nhóm: cộng tử với tử, mẫu với mẫu: $\frac{9 + 10}{10 + 100} = \frac{19}{110} \approx 17\%$ — <b>không phải</b> $\frac{90\% + 10\%}{2} = 50\%$.</p>
        focus: [1, 2, 2]
        say: "Bài này dùng tỉ lệ thành công, bằng số ca thành công chia số ca, ví dụ nhóm 1 được 9 trên 10, tức 90 phần trăm, nhóm 2 được 10 trên 100, tức 10 phần trăm. Gộp hai nhóm thì cộng tử với tử, mẫu với mẫu, được 19 trên 110, khoảng 17 phần trăm. Kết quả không phải là 50 phần trăm, trung bình cộng của hai tỉ lệ, vì nhóm 2 đông gấp 10 lần nên kéo tỉ lệ gộp về phía nó."
      - show: |
          <p>Tỉ lệ gộp là <b>trung bình có trọng số</b>: $\frac{10}{110} \cdot 90\% + \frac{100}{110} \cdot 10\% \approx 17\%$. Trọng số là phần của mỗi nhóm trong tổng số ca.</p>
        introduces: [cdot]
        say: "Nói cách khác, tỉ lệ gộp là trung bình có trọng số. Nhóm 1 chiếm 10 trên 110 số ca, nhóm 2 chiếm 100 trên 110, nhân mỗi phần với tỉ lệ của nhóm rồi cộng lại, cũng được khoảng 17 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: biến gây nhiễu"
    steps:
      - show: |
          <p><b>Biến gây nhiễu</b>: một biến ảnh hưởng tới <b>cả</b> việc chọn cách chữa <b>lẫn</b> kết quả.</p>
          <div class="chain"><span class="n">độ khó (cỡ sỏi)</span><span class="a">→</span><span class="n">chọn A hay B</span></div>
          <div class="chain"><span class="n">độ khó (cỡ sỏi)</span><span class="a">→</span><span class="n">thành công hay không</span></div>
          <p class="note">Bác sĩ hay dùng A cho ca khó. Ca khó thì khó thành công dù chữa cách nào — nên A bị “thiệt” khi gộp.</p>
        focus: [1, 2, 3, 4, 4]
        say: "Biến gây nhiễu là một biến ảnh hưởng tới cả việc chọn cách chữa lẫn kết quả. Ở đây cỡ sỏi, tức độ khó, ảnh hưởng tới việc chọn A hay B. Cỡ sỏi cũng ảnh hưởng tới việc thành công hay không. Bác sĩ hay dùng A cho ca khó. Ca khó thì khó thành công dù chữa cách nào, nên A bị thiệt khi gộp lại."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Tỉ lệ gộp trượt về phía nhóm đông"
    checks:
      - "[round(100 * x) for x in (263 / 350, 80 / 350)] == [75, 23]"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><g fill="#1f2937" font-size="22"><line x1="200" y1="330" x2="1400" y2="330" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="322" x2="200" y2="338" stroke="#6b7280" stroke-width="2"/><text x="200" y="365" text-anchor="middle" font-size="20">60%</text><line x1="500" y1="322" x2="500" y2="338" stroke="#6b7280" stroke-width="2"/><text x="500" y="365" text-anchor="middle" font-size="20">70%</text><line x1="800" y1="322" x2="800" y2="338" stroke="#6b7280" stroke-width="2"/><text x="800" y="365" text-anchor="middle" font-size="20">80%</text><line x1="1100" y1="322" x2="1100" y2="338" stroke="#6b7280" stroke-width="2"/><text x="1100" y="365" text-anchor="middle" font-size="20">90%</text><line x1="1400" y1="322" x2="1400" y2="338" stroke="#6b7280" stroke-width="2"/><text x="1400" y="365" text-anchor="middle" font-size="20">100%</text><line x1="590" y1="110" x2="1193" y2="110" stroke="#2a78d6" stroke-width="6"/><circle cx="590" cy="110" r="12" fill="#2a78d6"/><circle cx="1193" cy="110" r="12" fill="#2a78d6"/><text x="590" y="88" text-anchor="middle" font-size="20">sỏi lớn 73%</text><text x="1193" y="88" text-anchor="middle" font-size="20">sỏi nhỏ 93%</text><rect x="727" y="97" width="26" height="26" fill="#059669" transform="rotate(45 740 110)"/><text x="740" y="154" text-anchor="middle" fill="#059669" font-size="20">gộp 78%</text><text x="60" y="119" font-size="30">A</text><text x="1460" y="119" text-anchor="end" font-size="20">sỏi lớn chiếm 75% số ca</text><line x1="462" y1="240" x2="1000" y2="240" stroke="#eb6834" stroke-width="6"/><circle cx="462" cy="240" r="12" fill="#eb6834"/><circle cx="1000" cy="240" r="12" fill="#eb6834"/><text x="462" y="218" text-anchor="middle" font-size="20">sỏi lớn 69%</text><text x="1000" y="218" text-anchor="middle" font-size="20">sỏi nhỏ 87%</text><rect x="864" y="227" width="26" height="26" fill="#059669" transform="rotate(45 877 240)"/><text x="877" y="284" text-anchor="middle" fill="#059669" font-size="20">gộp 83%</text><text x="60" y="249" font-size="30">B</text><text x="1460" y="249" text-anchor="end" font-size="20">sỏi lớn chiếm 23% số ca</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ mỗi cách chữa thành một đoạn thẳng, đầu trái là tỉ lệ ở ca sỏi lớn, đầu phải là tỉ lệ ở ca sỏi nhỏ. Đoạn của A nằm lệch phải hơn đoạn của B ở cả hai đầu, tức A tốt hơn trong từng nhóm. Nhưng tỉ lệ gộp, hình thoi lục, trượt về phía nhóm đông hơn. A có 75 phần trăm số ca là sỏi lớn nên bị kéo sát đầu trái, còn B chỉ 23 phần trăm nên nằm sát đầu phải. Vì vậy hình thoi của B đứng bên phải hình thoi của A, dù đoạn của B kém hơn."

  - id: example
    kind: example
    title: "Số liệu sỏi thận (Charig, 1986)"
    checks:
      - "[round(100 * f) for f in (81 / 87, 234 / 270, 192 / 263, 55 / 80, 273 / 350, 289 / 350)] == [93, 87, 73, 69, 78, 83]"
      - "(81 + 192, 87 + 263, 234 + 55, 270 + 80) == (273, 350, 289, 350)"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>A (mổ mở)</th><th>B (tán sỏi qua da)</th></tr>
          <tr><td>sỏi nhỏ</td><td><b>81/87 = 93%</b></td><td>234/270 = 87%</td></tr></table>
          <p><b>Bước 1</b> — sỏi nhỏ: A thắng.</p>
        focus: [1, "1.2"]
        say: "Đây là số liệu thật từ một nghiên cứu năm 1986. Bước một, với sỏi nhỏ, A thành công 81 trên 87 ca, tức 93 phần trăm, còn B 234 trên 270, tức 87 phần trăm, nên A thắng."
      - show: |
          <table class="t"><tr><th></th><th>A (mổ mở)</th><th>B (tán sỏi qua da)</th></tr>
          <tr><td>sỏi nhỏ</td><td><b>81/87 = 93%</b></td><td>234/270 = 87%</td></tr>
          <tr><td>sỏi lớn</td><td><b>192/263 = 73%</b></td><td>55/80 = 69%</td></tr></table>
          <p><b>Bước 2</b> — sỏi lớn: A cũng thắng.</p>
        focus: ["1.3", 2]
        say: "Bước hai, với sỏi lớn, A thành công 192 trên 263, tức 73 phần trăm, còn B 55 trên 80, tức 69 phần trăm. Vậy với sỏi lớn, cách A cũng thắng."
      - clear: true
        show: |
          <table class="t"><tr><th></th><th>A (mổ mở)</th><th>B (tán sỏi qua da)</th></tr>
          <tr><td>sỏi nhỏ</td><td><b>81/87 = 93%</b></td><td>234/270 = 87%</td></tr>
          <tr><td>sỏi lớn</td><td><b>192/263 = 73%</b></td><td>55/80 = 69%</td></tr>
          <tr><td>gộp</td><td>273/350 = 78%</td><td><b>289/350 = $\hl{83\%}$</b></td></tr></table>
          <p><b>Bước 3</b> — gộp, cộng tử với tử, mẫu với mẫu: B thắng.</p>
        focus: ["1.4", "1.4", 2]
        say: "Bước ba, gộp bằng cách cộng tử với tử, mẫu với mẫu. A được 81 cộng 192 bằng 273 trên 350, tức 78 phần trăm. B được 289 trên 350, tức 83 phần trăm, nên khi gộp thì B thắng."
      - show: |
          <p><b>Bước 4</b> — vì sao: A được dùng cho 263 ca sỏi lớn ($\frac{263}{350} \approx 75\%$ số ca của A), B chỉ 80 ca ($\frac{80}{350} \approx 23\%$). Khi gộp, tỉ lệ của A bị kéo xuống bởi nhiều ca khó.</p>
        say: "Bước bốn, tìm lý do. A được dùng cho 263 ca sỏi lớn, khoảng 75 phần trăm số ca của A, còn B chỉ 80 ca, khoảng 23 phần trăm. Khi gộp, tỉ lệ của A bị kéo xuống bởi nhiều ca khó."
      - show: |
          <div class="box key"><b>Bước 5</b> — cỡ sỏi có <b>trước</b> khi chọn cách chữa và ảnh hưởng cả hai → so trong từng nhóm là đúng: A tốt hơn.</div>
        say: "Bước năm, kết luận. Ở đây cỡ sỏi có trước khi chọn cách chữa và ảnh hưởng cả hai, nên so trong từng nhóm là đúng, và A tốt hơn."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(87 / 350 * 81 / 87 + 263 / 350 * 192 / 263, 2) == 0.78 and round(270 / 350 * 234 / 270 + 80 / 350 * 55 / 80, 2) == 0.83"
      - "(87 + 270, 263 + 80) == (357, 343) and round(100 * (357 * 81 / 87 + 343 * 192 / 263) / 700, 1) == 83.3 and round(100 * (357 * 234 / 270 + 343 * 55 / 80) / 700, 1) == 77.9"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>A</th><th>B</th></tr>
          <tr><td>tỉ lệ gộp</td><td>trung bình có trọng số theo phần sỏi nhỏ, sỏi lớn của chính mỗi cách</td><td>78% ✓</td><td>83% ✓</td></tr>
          <tr><td>so công bằng</td><td>áp cả hai cách lên <b>cùng</b> cơ cấu 357 ca sỏi nhỏ, 343 ca sỏi lớn</td><td><b>83,3%</b></td><td>77,9%</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác. Tính tỉ lệ gộp như trung bình có trọng số, theo phần sỏi nhỏ và sỏi lớn của chính mỗi cách. Kết quả lại ra 78 phần trăm cho A và 83 phần trăm cho B, khớp với cách cộng tử và mẫu. Bây giờ so công bằng, áp cả hai cách lên cùng một cơ cấu bệnh nhân, 357 ca sỏi nhỏ và 343 ca sỏi lớn, tức toàn bộ 700 ca. Khi đó A được 83 phẩy 3 phần trăm, B chỉ 77 phẩy 9 phần trăm, đúng như so trong từng nhóm, A tốt hơn."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "(50 / 500, 5 / 500, 55 / 1000) == (0.1, 0.01, 0.055) and (22 / 200, 16 / 800, 38 / 1000) == (0.11, 0.02, 0.038)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nhớ một quy tắc máy móc “luôn tách nhóm” <b class="red">(sai)</b>
          <br><span class="note">Nếu biến chia nhóm là <b>hệ quả</b> của cách chữa (ví dụ huyết áp đo <b>sau</b> khi uống thuốc), tách theo nó lại che mất tác dụng của thuốc. Quyết định dựa trên sơ đồ nhân quả.</span></div>
        say: "Lỗi thứ nhất, nhớ một quy tắc máy móc là luôn tách nhóm. Nếu biến chia nhóm là hệ quả của cách chữa, như huyết áp đo sau khi uống thuốc, thì tách theo nó lại che mất tác dụng của thuốc. Phải quyết định dựa trên sơ đồ nhân quả."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> So sánh hai nhóm tự chọn <b class="red">(nhiễu)</b>
          <br><span class="note">Người tự chọn tập thể dục khác người không tập ở nhiều mặt khác. Chỉ chia nhóm ngẫu nhiên mới cắt được mọi mũi tên từ biến gây nhiễu.</span></div>
        say: "Lỗi thứ hai, so sánh hai nhóm tự chọn. Người tự chọn tập thể dục khác người không tập ở nhiều mặt khác, và chỉ chia nhóm ngẫu nhiên mới cắt được mọi ảnh hưởng của biến gây nhiễu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ báo tỉ lệ gộp <b class="red">(thiếu)</b>
          <br><span class="note">Luôn xem tỉ lệ theo các nhóm quan trọng, và cỡ của từng nhóm. Đảo chiều như trên chỉ lộ ra khi tách.</span></div>
        say: "Lỗi thứ ba, chỉ báo tỉ lệ gộp chung của tất cả các nhóm. Hãy luôn xem tỉ lệ theo các nhóm quan trọng và cỡ của từng nhóm, vì sự đảo chiều như trên chỉ lộ ra khi tách."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Báo “tỉ lệ mua hàng tụt” khi chỉ có cơ cấu kênh đổi <b class="red">(báo động giả)</b></div>
          <table class="t"><tr><th>số minh hoạ</th><th>kênh tìm kiếm</th><th>kênh mạng xã hội</th><th>gộp</th></tr>
          <tr><td>tháng 1</td><td>50/500 = 10%</td><td>5/500 = 1%</td><td>55/1000 = 5,5%</td></tr>
          <tr><td>tháng 2</td><td>22/200 = 11%</td><td>16/800 = 2%</td><td>38/1000 = 3,8%</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là báo tỉ lệ mua hàng tụt khi chỉ có cơ cấu kênh thay đổi. Với số minh hoạ, tháng 1 kênh tìm kiếm chuyển đổi 10 phần trăm, kênh mạng xã hội 1 phần trăm, gộp lại 5 phẩy 5 phần trăm. Tháng 2 cả hai kênh đều tốt lên, 11 và 2 phần trăm, nhưng vì 800 trên 1000 khách giờ đến từ kênh mạng xã hội, tỉ lệ gộp tụt còn 3 phẩy 8 phần trăm. Người làm nghề tách theo kênh trước khi báo động, vì ở đây không có gì hỏng cả, chỉ là nguồn khách đổi."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(80 / 100, 10 / 50, 18 / 20, 30 / 100) == (0.8, 0.2, 0.9, 0.3) and (90 / 150, 48 / 120) == (0.6, 0.4)"
      - "(80 + 10, 100 + 50, 18 + 30, 20 + 100) == (90, 150, 48, 120) and round(100 * 100 / 120) == 83 and round(100 * 50 / 150) == 33"
    steps:
      - show: |
          <p>Tuyển sinh hai khoa (số liệu minh hoạ). Nam: khoa X đỗ 80/100, khoa Y đỗ 10/50. Nữ: khoa X đỗ 18/20, khoa Y đỗ 30/100.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Trong từng khoa, nhóm nào đỗ tỉ lệ cao hơn?</td></tr>
          <tr><td>2</td><td>Gộp hai khoa thì sao? Biến gây nhiễu là gì?</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm với số liệu tuyển sinh minh hoạ. Nam ở khoa X đỗ 80 trên 100, ở khoa Y đỗ 10 trên 50, nữ ở khoa X đỗ 18 trên 20, ở khoa Y đỗ 30 trên 100. Câu một, trong từng khoa, nhóm nào đỗ tỉ lệ cao hơn? Câu hai, gộp hai khoa thì sao? Biến gây nhiễu là gì? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>①</th><th>nam</th><th>nữ</th></tr>
          <tr><td>khoa X</td><td>80/100 = 80%</td><td><b>18/20 = 90%</b></td></tr>
          <tr><td>khoa Y</td><td>10/50 = 20%</td><td><b>30/100 = 30%</b></td></tr></table>
          <p>Nữ cao hơn ở <b>cả hai</b> khoa.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Đáp án câu một, tính tỉ lệ trong từng khoa. Ở khoa X, nam 80 trên 100 là 80 phần trăm, nữ 18 trên 20 là 90 phần trăm. Ở khoa Y, nam 10 trên 50 là 20 phần trăm, nữ 30 trên 100 là 30 phần trăm. Vậy nữ cao hơn ở cả hai khoa."
      - show: |
          <p>② Gộp: nam $\frac{80 + 10}{100 + 50} = \frac{90}{150} = 60\%$, nữ $\frac{18 + 30}{20 + 100} = \frac{48}{120} = \hl{40\%}$ — đảo chiều.</p>
          <p>Biến gây nhiễu: <b>khoa</b> — nữ nộp vào khoa Y khó đỗ $\frac{100}{120} \approx 83\%$, nam chỉ $\frac{50}{150} \approx 33\%$.</p>
        focus: [1, 1, 2, 2]
        say: "Câu hai, gộp lại bằng cách cộng tử với tử, mẫu với mẫu. Nam được 90 trên 150, tức 60 phần trăm, nữ chỉ 48 trên 120, tức 40 phần trăm, kết luận đảo chiều. Biến gây nhiễu là khoa, vì khoảng 83 phần trăm hồ sơ của nữ nộp vào khoa Y khó đỗ. Còn nam chỉ khoảng 33 phần trăm."

