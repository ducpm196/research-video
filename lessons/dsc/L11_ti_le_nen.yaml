id: L11
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 11 — Lớp mất cân bằng, tỉ lệ nền và chọn chỉ số đánh giá"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L11; audit/dsc/verify_dsc.py L11; D. Kahneman, A. Tversky, On the Psychology of Prediction (1973) (bỏ qua tỉ lệ nền); C. Elkan, The Foundations of Cost-Sensitive Learning, IJCAI 2001; CS115 bài 21 (ma trận nhầm lẫn, độ chính xác, precision, recall)"
assumes: [arith, frac, approx, cdot]
# Quy ước: độ nhạy = P(dương | bệnh), độ đặc hiệu = P(âm | khoẻ), tỉ lệ nền = P(bệnh); giá trị dự đoán dương P(bệnh | dương) theo Bayes (alg.ppv).
#   Đếm trên 10 000 người làm tròn tới người. Chi phí nhầm là số MINH HOẠ để thấy cách chọn ngưỡng. Bài nối tiếp CS115 bài 21, không dạy lại các chỉ số.
objectives:
  - "Tính giá trị dự đoán dương theo tỉ lệ nền"
  - "Biết vì sao đánh giá trên tập cân bằng đánh lừa"
  - "Chọn ngưỡng theo chi phí nhầm"
asr_reviewed:
  - {sentence: "Đảo hai vế là đổi nhóm để đếm, nên kết quả khác nhau.", reason: "ASR chép “Đạo 2 với là đội nhóm để đếm nên kết quả khác nhau.” (0.769): lệch âm/thanh thuần Việt: đảo/đạo, vế/với, đổi/đội — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Xét nghiệm nhạy 99% báo dương tính — bạn có bệnh không?"
    checks:
      - "round(alg.ppv(0.99, 0.95, 0.01), 3) == 0.167"
    steps:
      - show: |
          <p>Bệnh hiếm, 1% dân số mắc. Xét nghiệm nhạy 99%, đặc hiệu 95%. Bạn dương tính. Khả năng bạn thật sự có bệnh: không phải 99%, mà khoảng $\hl{16{,}7\%}$.</p>
          <div class="box key">Hôm nay: <b>tỉ lệ nền</b> — và vì sao cùng một mô hình có thể rất tốt ở nơi này, rất tệ ở nơi khác.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một bệnh hiếm có 1 phần trăm dân số mắc. Xét nghiệm có độ nhạy 99 phần trăm, độ đặc hiệu 95 phần trăm, và bạn có kết quả dương tính. Khả năng bạn thật sự có bệnh không phải 99 phần trăm, mà chỉ khoảng 16 phẩy 7 phần trăm. Hôm nay ta học về tỉ lệ nền, và vì sao cùng một mô hình có thể rất tốt ở nơi này nhưng rất tệ ở nơi khác."

  # ───────────────────────── 2. VÍ DỤ ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: xác suất có điều kiện, độ nhạy, độ đặc hiệu"
    checks:
      - "6 / 8 == 0.75 and 6 / 10 == 0.6"
      - "99 / 100 == 0.99 and 9405 / 9900 == 0.95"
    steps:
      - show: |
          <p>$P(A \mid B)$, đọc là “xác suất A <b>khi biết</b> B”: chỉ đếm trong nhóm B. Lớp 20 học sinh: 10 nữ, 8 người đeo kính, trong đó 6 nữ đeo kính.</p>
          <table class="t"><tr><th>câu hỏi</th><th>đếm trong nhóm</th><th>kết quả</th></tr>
          <tr><td>P(nữ | đeo kính)</td><td>8 người đeo kính</td><td>$\frac{6}{8} = 75\%$</td></tr>
          <tr><td>P(đeo kính | nữ)</td><td>10 bạn nữ</td><td>$\frac{6}{10} = 60\%$</td></tr></table>
        introduces: [prob, given]
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Ký hiệu P của A, vạch đứng, B, đọc là xác suất A khi biết B, nghĩa là chỉ đếm trong nhóm B. Ví dụ một lớp 20 học sinh có 10 nữ, 8 người đeo kính, trong đó 6 bạn nữ đeo kính. Xác suất là nữ khi biết đeo kính thì đếm trong 8 người đeo kính, được 6 phần 8, tức 75 phần trăm. Xác suất đeo kính khi biết là nữ thì đếm trong 10 bạn nữ, được 6 phần 10, tức 60 phần trăm. Đảo hai vế là đổi nhóm để đếm, nên kết quả khác nhau."
      - show: |
          <p><b>Độ nhạy</b> = P(dương | bệnh): 100 người bệnh, 99 dương → 99%. <b>Độ đặc hiệu</b> = P(âm | khoẻ): 9900 người khoẻ, 9405 âm → 95%.</p>
        say: "Ở khoá Toán cho khoa học máy tính, ta đã gặp hai chỉ số của một xét nghiệm. Độ nhạy là xác suất dương tính khi có bệnh, ví dụ 100 người bệnh có 99 người dương, tức 99 phần trăm. Độ đặc hiệu là xác suất âm tính khi khoẻ, ví dụ chín nghìn chín trăm người khoẻ có chín nghìn bốn trăm linh năm người âm, tức 95 phần trăm."

  - id: intuition
    kind: intuition
    title: "Một lát mỏng của nhóm lớn đè bẹp nhóm nhỏ"
    steps:
      - show: |
          <div><svg width="1500" height="350" viewBox="0 0 1500 350"><g fill="#1f2937" font-size="22"><rect x="200" y="70" width="11" height="60" fill="#b91c1c"/><rect x="211" y="70" width="1089" height="60" fill="#2a78d6"/><text x="220" y="55" fill="#b91c1c">bệnh 100</text><text x="1290" y="55" text-anchor="end" fill="#2a78d6">khoẻ 9900</text><rect x="200" y="240" width="183" height="60" fill="#b91c1c"/><rect x="383" y="240" width="917" height="60" fill="#2a78d6"/><text x="292" y="279" text-anchor="middle" fill="#ffffff" font-size="26">99</text><text x="842" y="279" text-anchor="middle" fill="#ffffff" font-size="26">495</text><text x="383" y="335" text-anchor="middle" fill="#b91c1c">99 / 594 ≈ 16,7%</text><line x1="205" y1="135" x2="260" y2="232" stroke="#b91c1c" stroke-width="3"/><line x1="600" y1="135" x2="900" y2="232" stroke="#2a78d6" stroke-width="3"/><text x="310" y="190" font-size="20" fill="#b91c1c">99% của 100</text><text x="930" y="200" font-size="20" fill="#2a78d6">5% của 9900</text><text x="20" y="108" font-size="24">10 000 người</text><text x="20" y="278" font-size="24">594 dương tính</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình trên là mười nghìn người, phần đỏ là 100 người bệnh, chỉ là một lát rất mỏng, phần xanh là chín nghìn chín trăm người khoẻ. Xét nghiệm lấy gần hết lát đỏ, 99 người, nhưng cũng lấy 5 phần trăm của khối xanh khổng lồ, tức 495 người. Hình dưới là 594 người dương tính, phần đỏ chỉ chiếm khoảng 16 phẩy 7 phần trăm. Một tỉ lệ nhỏ của nhóm rất lớn vẫn nhiều hơn gần hết một nhóm rất nhỏ."

  - id: example
    kind: example
    title: "Đếm trên 10 000 người"
    checks:
      - "(round(10000 * 0.01 * 0.99), round(10000 * 0.99 * 0.05)) == (99, 495) and round(99 / (99 + 495), 3) == 0.167"
    steps:
      - show: |
          <p><b>Bước 1</b> — 10 000 người, tỉ lệ nền 1%: $10\,000 \cdot 0{,}01 = 100$ người bệnh, $9900$ người khoẻ.</p>
        introduces: [cdot]
        say: "Bước một, đếm trên mười nghìn người, tỉ lệ nền 1 phần trăm, nên có mười nghìn nhân 0 phẩy 01 bằng 100 người bệnh, và chín nghìn chín trăm người khoẻ."
      - show: |
          <table class="t"><tr><th>10 000 người</th><th>dương tính</th><th>âm tính</th></tr>
          <tr><td>có bệnh: 100</td><td>99</td><td>1</td></tr></table>
          <p><b>Bước 2</b> — người bệnh: nhạy 99% → $100 \cdot 0{,}99 = 99$ dương.</p>
        focus: ["1.2", 2]
        say: "Bước hai, có 100 người bệnh, xét nghiệm báo dương 99 người, âm 1 người. Đó là 100 nhân độ nhạy 0 phẩy 99."
      - show: |
          <table class="t"><tr><th>10 000 người</th><th>dương tính</th><th>âm tính</th></tr>
          <tr><td>có bệnh: 100</td><td>99</td><td>1</td></tr>
          <tr><td>khoẻ: 9900</td><td><b>495</b> (5% báo nhầm)</td><td>9405</td></tr></table>
          <p><b>Bước 3</b> — người khoẻ: $9900 \cdot 0{,}05 = 495$ bị báo nhầm.</p>
        focus: ["1.3", 2]
        say: "Bước ba, có chín nghìn chín trăm người khoẻ, xét nghiệm báo nhầm dương 5 phần trăm, tức 495 người. Đó là chín nghìn chín trăm nhân 0 phẩy 05."
      - clear: true
        show: |
          <p><b>Bước 4</b> — trong $99 + 495 = 594$ người dương tính, chỉ 99 người có bệnh: $\dfrac{99}{594} \approx \hl{16{,}7\%}$.</p>
          <div class="box key">5% của một nhóm rất lớn (người khoẻ) lấn át 99% của một nhóm rất nhỏ (người bệnh). Đó là tỉ lệ nền.</div>
        focus: [1, 2]
        say: "Bước bốn, trong 594 người dương tính, chỉ 99 người có bệnh, tức khoảng 16 phẩy 7 phần trăm. 5 phần trăm của một nhóm rất lớn là người khoẻ lấn át 99 phần trăm của một nhóm rất nhỏ là người bệnh, đó chính là tỉ lệ nền."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(0.99 * 0.01, 4) == 0.0099 and round(0.05 * 0.99, 4) == 0.0495 and round(0.0099 / (0.0099 + 0.0495), 6) == round(1 / 6, 6) == round(alg.ppv(0.99, 0.95, 0.01), 6)"
      - "round(0.99 / 0.05, 1) == 19.8 and round((1 / 99) * 19.8, 2) == 0.2 and round(0.2 / (1 + 0.2), 4) == round(1 / 6, 4)"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>công thức xác suất, không đếm người</td><td>$\frac{0{,}99 \cdot 0{,}01}{0{,}99 \cdot 0{,}01 + 0{,}05 \cdot 0{,}99} = \frac{0{,}0099}{0{,}0594}$</td><td>$= \frac{1}{6} \approx 16{,}7\%$ ✓</td></tr>
          <tr><td>tỉ số cược</td><td>trước xét nghiệm 1 bệnh : 99 khoẻ; dương tính nhân cược với $\frac{0{,}99}{0{,}05} = 19{,}8$ → $19{,}8 : 99 = 1 : 5$</td><td>1 trong 6 người ≈ 16,7% ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Kiểm bằng đường khác. Thay vì đếm người, dùng thẳng xác suất. Tử số là 0 phẩy 99 nhân 0 phẩy 01, bằng 0 phẩy 0099. Mẫu số cộng thêm 0 phẩy 05 nhân 0 phẩy 99, bằng 0 phẩy 0495, nên kết quả ra đúng 1 phần 6, khoảng 16 phẩy 7 phần trăm. Cách thứ ba dùng tỉ số cược, trước xét nghiệm là 1 người bệnh trên 99 người khoẻ. Kết quả dương nhân cược với 0 phẩy 99 chia 0 phẩy 05, bằng 19 phẩy 8. Ta được 19 phẩy 8 trên 99, tức 1 trên 5, nghĩa là 1 trong 6 người, khớp cả ba cách."

  - id: sym
    kind: symbol
    title: "Giải mã: cùng xét nghiệm, khác tỉ lệ nền"
    checks:
      - "round(alg.ppv(0.99, 0.95, 0.01), 3) == 0.167 and round(alg.ppv(0.99, 0.95, 0.10), 4) == 0.6875 and round(alg.ppv(0.99, 0.95, 0.50), 3) == 0.952"
    steps:
      - show: |
          <table class="t"><tr><th>tỉ lệ nền</th><th>P(bệnh | dương tính)</th></tr>
          <tr><td>1% (sàng lọc cả dân số)</td><td>16,7%</td></tr>
          <tr><td>10% (người có triệu chứng)</td><td>68,75%</td></tr>
          <tr><td>50% (tập kiểm tra được cân bằng)</td><td>$\hl{95{,}2\%}$</td></tr></table>
          <p class="note">Nhiều tập dữ liệu được “cân bằng” 50/50 để huấn luyện. Precision đo trên tập đó (95,2%) không nói gì về precision khi dùng thật (16,7%).</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Cùng một xét nghiệm, nhưng áp lên các nhóm người có tỉ lệ nền khác nhau. Sàng lọc cả dân số với tỉ lệ nền 1 phần trăm, khả năng thật sự bệnh khi dương tính là 16 phẩy 7 phần trăm. Với người có triệu chứng, tỉ lệ nền 10 phần trăm, con số là 68 phẩy 75 phần trăm. Với tập kiểm tra được cân bằng 50 50, con số là 95 phẩy 2 phần trăm. Nhiều tập dữ liệu được cân bằng 50 50 để huấn luyện. Độ chính xác của dự đoán dương đo trên tập đó không nói gì về con số khi dùng thật."

  # ───────────────────────── 4. CHI PHÍ ─────────────────────────
  - id: cost
    kind: concept
    title: "Chọn ngưỡng theo chi phí nhầm"
    checks:
      - "(1 * 100 + 495, 10 * 100 + 99) == (595, 1099) and (1 * 10 + 495, 10 * 10 + 99) == (505, 199)"
    steps:
      - show: |
          <p>Hai ngưỡng cho cùng mô hình, 10 000 người, tỉ lệ nền 1%:</p>
          <table class="t"><tr><th>ngưỡng</th><th>bỏ sót bệnh</th><th>báo nhầm</th><th>chi phí nếu bỏ sót = 100</th><th>nếu bỏ sót = 10</th></tr>
          <tr><td>thấp (nhạy 99%, đặc hiệu 95%)</td><td>1</td><td>495</td><td>$\hl{595}$</td><td>505</td></tr>
          <tr><td>cao (nhạy 90%, đặc hiệu 99%)</td><td>10</td><td>99</td><td>1099</td><td>$\hl{199}$</td></tr></table>
          <div class="box key">Không có chỉ số “tốt nhất” chung. Bỏ sót đắt (ung thư) → ưu tiên nhạy; báo nhầm đắt (chặn giao dịch thật) → ưu tiên đặc hiệu.</div>
        focus: [1, 2, "2.2", "2.3", 3]
        say: "Xét hai ngưỡng cho cùng một mô hình, mười nghìn người, tỉ lệ nền 1 phần trăm, mỗi báo nhầm tốn 1 đơn vị. Ngưỡng thấp bỏ sót 1 người bệnh và báo nhầm 495 người, nếu mỗi ca bỏ sót tốn 100 thì tổng chi phí 595, nếu chỉ tốn 10 thì 505. Ngưỡng cao bỏ sót 10 người và báo nhầm 99 người, tổng chi phí 1099 hay 199. Vậy bỏ sót đắt thì chọn ngưỡng thấp, bỏ sót rẻ thì chọn ngưỡng cao. Không có chỉ số tốt nhất chung, bỏ sót đắt như ung thư thì ưu tiên độ nhạy, báo nhầm đắt như chặn giao dịch thật thì ưu tiên độ đặc hiệu."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "(round(100000 * 0.02 * 0.9), round(100000 * 0.98 * 0.01), round(100000 * 0.005 * 0.9), round(100000 * 0.995 * 0.01)) == (1800, 980, 450, 995)"
      - "round(alg.ppv(0.9, 0.99, 0.02) * 100, 1) == 64.7 and round(alg.ppv(0.9, 0.99, 0.005) * 100, 1) == 31.1 and 995 / 450 > 2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đọc “nhạy 99%” thành “dương tính thì 99% có bệnh” <b class="red">(sai)</b>
          <br><span class="note">Nhạy là P(dương | bệnh). Điều ta muốn là P(bệnh | dương) — phụ thuộc mạnh vào tỉ lệ nền.</span></div>
        say: "Lỗi thứ nhất, đọc độ nhạy 99 phần trăm thành dương tính thì 99 phần trăm có bệnh. Độ nhạy là xác suất dương tính khi có bệnh, còn điều ta muốn là xác suất có bệnh khi dương tính, phụ thuộc mạnh vào tỉ lệ nền."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Báo cáo chỉ số trên tập đã cân bằng như số dùng thật <b class="red">(phóng đại)</b>
          <br><span class="note">Đánh giá lại trên dữ liệu có đúng tỉ lệ nền nơi triển khai.</span></div>
        say: "Lỗi thứ hai, báo cáo chỉ số trên tập đã cân bằng như số dùng thật. Hãy đánh giá lại trên dữ liệu có đúng tỉ lệ nền ở nơi triển khai."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Giữ ngưỡng mặc định 0,5 <b class="red">(tuỳ tiện)</b>
          <br><span class="note">0,5 chỉ hợp lý khi hai loại nhầm tốn như nhau và hai lớp cân bằng. Chọn ngưỡng theo chi phí thật.</span></div>
        say: "Lỗi thứ ba, giữ ngưỡng mặc định 0 phẩy 5. Ngưỡng đó chỉ hợp lý khi hai loại nhầm tốn như nhau và hai lớp cân bằng, nên hãy chọn ngưỡng theo chi phí thật."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Đo một lần rồi tin mãi, trong khi tỉ lệ nền trôi <b class="red">(chỉ số tụt âm thầm)</b></div>
          <table class="t"><tr><th>số minh hoạ: 100 000 giao dịch, mô hình nhạy 90%, đặc hiệu 99%</th><th>gian lận thật bị bắt</th><th>báo nhầm</th><th>P(gian lận | báo)</th></tr>
          <tr><td>mùa cao điểm, gian lận 2%</td><td>1800</td><td>980</td><td>64,7%</td></tr>
          <tr><td>mùa thấp điểm, gian lận 0,5%</td><td>450</td><td>995</td><td>31,1%</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là đo mô hình một lần rồi tin mãi, trong khi tỉ lệ nền trôi theo mùa. Với số minh hoạ, mô hình chặn gian lận nhạy 90 phần trăm, đặc hiệu 99 phần trăm, chạy trên 100 nghìn giao dịch. Mùa cao điểm gian lận chiếm 2 phần trăm, bắt đúng 1800 vụ và báo nhầm 980, nên khi mô hình báo thì 64 phẩy 7 phần trăm là gian lận thật. Mùa thấp điểm chỉ 0 phẩy 5 phần trăm, mô hình không đổi gì mà con số đó tụt còn 31 phẩy 1 phần trăm, vì giờ báo nhầm nhiều gấp đôi bắt đúng. Người làm nghề theo dõi tỉ lệ nền và chỉ số này liên tục sau khi triển khai."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.ppv(0.99, 0.95, 0.10), 4) == 0.6875 and (round(1000 * 0.1 * 0.99), round(1000 * 0.9 * 0.05)) == (99, 45)"
    steps:
      - show: |
          <p>Cùng xét nghiệm (nhạy 99%, đặc hiệu 95%), nhưng ở phòng khám, 10% người đến có bệnh. Xét 1000 người.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bao nhiêu người bệnh dương tính? Bao nhiêu người khoẻ bị báo nhầm?</td></tr>
          <tr><td>2</td><td>P(bệnh | dương tính)?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, cùng xét nghiệm đó nhưng ở phòng khám, 10 phần trăm người đến có bệnh, xét một nghìn người. Câu một, bao nhiêu người bệnh dương tính, bao nhiêu người khoẻ bị báo nhầm? Câu hai, xác suất có bệnh khi dương tính là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Bước 1: $1000 \cdot 0{,}1 = 100$ người bệnh, 900 người khoẻ.</p>
          <p>Bước 2: $100 \cdot 0{,}99 = 99$ dương tính; $900 \cdot 0{,}05 = 45$ báo nhầm.</p>
        focus: [1, 2]
        say: "Đáp án câu một, bước một, một nghìn nhân 0 phẩy 1 được 100 người bệnh, còn lại 900 người khoẻ. Bước hai, 100 nhân 0 phẩy 99 được 99 người dương tính, 900 nhân 0 phẩy 05 được 45 người bị báo nhầm."
      - show: |
          <p>② $\dfrac{99}{99 + 45} = \dfrac{99}{144} \approx \hl{68{,}75\%}$ — cùng xét nghiệm, tỉ lệ nền 10% thay vì 1%, con số tăng từ 16,7% lên 68,75%.</p>
        say: "Câu hai, 99 chia 99 cộng 45, tức 99 chia 144, khoảng 68 phẩy 75 phần trăm. Cùng một xét nghiệm, chỉ đổi tỉ lệ nền từ 1 lên 10 phần trăm, con số đã tăng từ 16 phẩy 7 lên 68 phẩy 75 phần trăm."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">P(bệnh | dương) phụ thuộc tỉ lệ nền</span><span class="a">→</span>
          <span class="n">đánh giá với tỉ lệ nền thật</span><span class="a">→</span>
          <span class="n">ngưỡng theo chi phí nhầm</span><span class="a">→</span>
          <span class="n">không có chỉ số tốt nhất chung</span></div>
        say: "Tổng kết lại, xác suất có bệnh khi dương tính phụ thuộc tỉ lệ nền, nên phải đánh giá với tỉ lệ nền thật. Chọn ngưỡng theo chi phí nhầm, vì không có chỉ số nào tốt nhất cho mọi tình huống."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi tin một dự đoán, hỏi “trong dân số này, điều đó vốn hiếm hay phổ biến?”.</div>
        say: "Điều cần mang theo, trước khi tin một dự đoán, hãy hỏi trong dân số này, điều đó vốn hiếm hay phổ biến."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>diễn giải hồi quy</b> — hệ số, đa cộng tuyến, khoảng tin cậy.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học cách diễn giải hồi quy, với hệ số, đa cộng tuyến, và khoảng tin cậy. Hẹn gặp bạn ở bài tiếp theo."
