id: L01
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 1 — Kiểu dữ liệu và thang đo: định danh, thứ bậc, khoảng, tỉ lệ"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L01; audit/dsc/verify_dsc.py L01; S. S. Stevens, On the Theory of Scales of Measurement, Science 103 (1946)"
assumes: [arith, frac, approx]
# Quy ước: bốn thang đo theo Stevens (1946). Nhiệt độ Kelvin = °C + 273,15. Mã thành phố (1 = Hà Nội, 2 = Huế, 3 = TP.HCM) là nhãn, không phải số đo.
#   Mọi số do Python trong checks.
objectives:
  - "Phân loại dữ liệu theo bốn thang đo"
  - "Biết phép tính nào có nghĩa với mỗi thang"
  - "Tránh tính trung bình trên nhãn"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hôm nay 20 °C, hôm qua 10 °C: nóng gấp đôi?"
    checks:
      - "round((20 + 273.15) / (10 + 273.15), 3) == 1.035"
    steps:
      - show: |
          <p>Hôm qua 10 °C, hôm nay 20 °C. “Nóng gấp đôi” nghe hợp lý — nhưng 0 °C không phải “không có nhiệt”. Theo thang Kelvin (có số 0 thật): $\dfrac{293{,}15}{283{,}15} \approx \hl{1{,}035}$ lần.</p>
          <div class="box key">Hôm nay: <b>bốn thang đo</b> — loại dữ liệu quyết định phép tính nào có nghĩa.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, hôm qua 10 độ C, hôm nay 20 độ C, nói nóng gấp đôi nghe có vẻ hợp lý. Nhưng 0 độ C không có nghĩa là không có nhiệt, theo thang nhiệt độ tuyệt đối, có số 0 thật, thì chỉ gấp khoảng 1 phẩy 035 lần. Hôm nay ta học bốn thang đo, loại dữ liệu quyết định phép tính nào có nghĩa."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: trung bình, trung vị, mốt, hiệu và thương"
    checks:
      - "(2 + 4 + 9) / 3 == 5 and sorted([8, 1, 3])[1] == 3 and __import__('statistics').mode(['Hà Nội', 'TP.HCM', 'Hà Nội']) == 'Hà Nội'"
      - "20 - 10 == 10 and 20 / 10 == 2 and round(10 + 273.15, 2) == 283.15 and round(20 + 273.15, 2) == 293.15"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>cách tính</th><th>ví dụ</th></tr>
          <tr><td>trung bình</td><td>cộng hết rồi chia số phần tử</td><td>$\frac{2 + 4 + 9}{3} = 5$</td></tr>
          <tr><td>trung vị</td><td>xếp tăng dần, lấy số đứng giữa</td><td>8, 1, 3 → 1, <b>3</b>, 8 → 3</td></tr>
          <tr><td>mốt</td><td>giá trị gặp nhiều nhất</td><td>Hà Nội, TP.HCM, Hà Nội → <b>Hà Nội</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Bài này dùng ba cách tóm tắt một cột dữ liệu, ta ôn lại từng cách bằng số nhỏ. Trung bình là cộng hết rồi chia cho số phần tử, ví dụ 2 cộng 4 cộng 9 bằng 15, chia 3 được 5. Trung vị là xếp tăng dần rồi lấy số đứng giữa, ví dụ 8, 1, 3 xếp lại thành 1, 3, 8, nên trung vị là 3. Mốt là giá trị gặp nhiều nhất, ví dụ Hà Nội, thành phố Hồ Chí Minh, Hà Nội thì mốt là Hà Nội."
      - show: |
          <p><b>Hiệu</b> trả lời “hơn bao nhiêu”: $20 - 10 = 10$. <b>Thương</b> trả lời “gấp mấy lần”: $\frac{20}{10} = 2$.</p>
          <p>Đổi độ C sang thang nhiệt độ tuyệt đối (Kelvin): cộng 273,15. Ví dụ $10 + 273{,}15 = 283{,}15$ và $20 + 273{,}15 = 293{,}15$.</p>
        focus: [1, 1, 2, 2]
        say: "Hai phép so sánh hai số cũng cần ôn. Hiệu trả lời câu hơn bao nhiêu, 20 trừ 10 bằng 10, còn thương trả lời câu gấp mấy lần, 20 chia 10 bằng 2. Muốn đổi độ C sang thang nhiệt độ tuyệt đối, ta cộng thêm 273 phẩy 15. Ví dụ 10 độ C thành 283 phẩy 15, và 20 độ C thành 293 phẩy 15."

  - id: sym
    kind: symbol
    title: "Giải mã: bốn thang đo"
    steps:
      - show: |
          <table class="t"><tr><th>thang</th><th>ví dụ</th><th>có nghĩa</th></tr>
          <tr><td><b>định danh</b></td><td>thành phố, nhóm máu, mã sản phẩm</td><td>bằng / khác; đếm, mốt</td></tr>
          <tr><td><b>thứ bậc</b></td><td>hạng huy chương, mức hài lòng 1–5</td><td>+ lớn hơn / nhỏ hơn; trung vị</td></tr>
          <tr><td><b>khoảng</b></td><td>°C, năm dương lịch</td><td>+ hiệu (hôm nay ấm hơn 10 độ); trung bình</td></tr>
          <tr><td><b>tỉ lệ</b></td><td>Kelvin, tiền, độ dài, thời gian chạy</td><td>+ thương (gấp đôi), vì có số 0 thật</td></tr></table>
          <p class="note">Mỗi thang có mọi phép của thang phía trên nó, cộng thêm một phép mới.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Có bốn thang đo. Thang định danh như thành phố, nhóm máu, mã sản phẩm, chỉ có nghĩa so bằng hay khác, đếm, và tìm giá trị hay gặp nhất. Thang thứ bậc như hạng huy chương hay mức hài lòng từ 1 tới 5, thêm được so lớn nhỏ và trung vị. Thang khoảng như độ C hay năm dương lịch, thêm được hiệu, hôm nay ấm hơn 10 độ, và trung bình. Thang tỉ lệ như nhiệt độ tuyệt đối, tiền, độ dài, thêm được thương, gấp đôi, vì có số 0 thật. Mỗi thang có mọi phép của thang phía trên nó, cộng thêm một phép mới."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Thương phụ thuộc vào chỗ đặt số 0"
    checks:
      - "round(293.15 / 283.15 - 1, 3) == 0.035 and 20 / 10 == 2"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><g fill="#1f2937" font-size="24"><text x="20" y="40" font-size="26">đo từ 0 °C</text><line x1="330" y1="20" x2="330" y2="170" stroke="#b91c1c" stroke-width="4"/><rect x="330" y="50" width="450" height="38" fill="#2a78d6"/><text x="794" y="78">10 °C</text><rect x="330" y="108" width="900" height="38" fill="#eb6834"/><text x="1244" y="136">20 °C: dài gấp 2</text><text x="20" y="235" font-size="26">đo từ 0 tuyệt đối</text><line x1="330" y1="215" x2="330" y2="365" stroke="#059669" stroke-width="4"/><rect x="330" y="245" width="869" height="38" fill="#2a78d6"/><text x="1213" y="273">283,15</text><rect x="330" y="303" width="900" height="38" fill="#eb6834"/><text x="1244" y="331">293,15</text><text x="20" y="392" font-size="22">chỉ dài hơn khoảng 3,5%</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cùng hai nhiệt độ, 10 độ và 20 độ C, bằng hai cách đo chiều dài thanh. Hàng trên đo từ 0 độ C, vạch đỏ, nên thanh cam dài gấp đôi thanh xanh. Hàng dưới đo từ số 0 tuyệt đối, vạch xanh lá, chỗ thật sự không còn nhiệt, nên hai thanh dài gần bằng nhau, chỉ hơn nhau khoảng 3 phẩy 5 phần trăm. Câu gấp mấy lần chỉ có nghĩa khi số 0 là số 0 thật, đó là thang tỉ lệ."

  - id: example
    kind: example
    title: "Trung bình của mã thành phố"
    checks:
      - "round(sum([1, 1, 3]) / 3, 2) == 1.67 and round(sum([3, 3, 1]) / 3, 2) == 2.33"
    steps:
      - show: |
          <p>Mã hoá thành phố: 1 = Hà Nội, 2 = Huế, 3 = TP.HCM. Ba khách hàng: Hà Nội, Hà Nội, TP.HCM.</p>
          <p><b>Bước 1</b> — mã của ba khách: 1, 1, 3. Trung bình $\frac{1 + 1 + 3}{3} = \frac{5}{3} \approx \hl{1{,}67}$.</p>
        focus: [1, 2, 2]
        say: "Mã hoá thành phố bằng 1 là Hà Nội, 2 là Huế, 3 là thành phố Hồ Chí Minh, và có ba khách hàng ở Hà Nội, Hà Nội, và thành phố Hồ Chí Minh. Bước một, mã của ba khách là 1, 1, 3. Cộng lại được 5, chia 3 được trung bình khoảng 1 phẩy 67."
      - show: |
          <p><b>Bước 2</b> — đọc kết quả: 1,67 nằm giữa 1 (Hà Nội) và 2 (Huế). “Khách hàng trung bình ở giữa Hà Nội và Huế”? Không ai trong ba khách ở đó.</p>
        say: "Bước hai, đọc kết quả. 1 phẩy 67 nằm giữa 1 là Hà Nội và 2 là Huế, vậy khách hàng trung bình ở giữa Hà Nội và Huế sao? Không ai trong ba khách ở gần đó cả."
      - clear: true
        show: |
          <table class="t"><tr><th>cách mã</th><th>mã của 3 khách</th><th>trung bình</th><th>mốt</th></tr>
          <tr><td>1 = Hà Nội, 3 = TP.HCM</td><td>1, 1, 3</td><td>1,67</td><td>Hà Nội</td></tr>
          <tr><td>1 = TP.HCM, 3 = Hà Nội</td><td>3, 3, 1</td><td>$\frac{7}{3} \approx 2{,}33$</td><td>Hà Nội</td></tr></table>
          <p><b>Bước 3</b> — chỉ đổi cách đặt mã, trung bình đổi từ 1,67 sang 2,33; mốt vẫn là Hà Nội.</p>
        focus: [1, "1.3", 2]
        say: "Bước ba, đổi cách mã, cho thành phố Hồ Chí Minh là 1 và Hà Nội là 3. Cùng ba khách đó giờ có mã 3, 3, 1, cộng lại được 7, chia 3 được trung bình khoảng 2 phẩy 33. Chỉ đổi cách đặt mã mà trung bình đổi từ 1 phẩy 67 sang 2 phẩy 33, trong khi mốt vẫn là Hà Nội."
      - show: |
          <div class="box key"><b>Bước 4</b> — kết quả đổi theo cách đặt mã, nên trung bình của mã là <b>vô nghĩa</b>. Với định danh: đếm tần suất (Hà Nội 2, TP.HCM 1) và báo mốt.</div>
        say: "Bước bốn, kết luận. Kết quả đổi theo cách đặt mã, nên trung bình của mã là con số vô nghĩa. Với dữ liệu định danh, hãy đếm tần suất, Hà Nội 2 khách, thành phố Hồ Chí Minh 1 khách, và báo mốt."
      - clear: true
        show: |
          <table class="t"><tr><th>khách</th><th>Hà Nội</th><th>Huế</th><th>TP.HCM</th></tr>
          <tr><td>1</td><td>1</td><td>0</td><td>0</td></tr>
          <tr><td>2</td><td>1</td><td>0</td><td>0</td></tr>
          <tr><td>3</td><td>0</td><td>0</td><td>1</td></tr>
          <tr><td><b>cộng cột</b></td><td><b>2</b></td><td><b>0</b></td><td><b>1</b></td></tr></table>
          <p><b>Bước 5</b> — khi đưa vào mô hình: <b>mã hoá một-nóng</b>, mỗi thành phố một cột 0/1, không phải 1, 2, 3.</p>
        focus: [1, "1.2", "1.5", 2]
        say: "Bước năm, khi đưa vào mô hình, ta dùng mã hoá một nóng, mỗi thành phố một cột chỉ có 0 hoặc 1. Khách thứ nhất ở Hà Nội nên cột Hà Nội bằng 1, hai cột kia bằng 0. Cộng từng cột được 2, 0, 1, đúng bằng bảng tần suất. Cách này không áp đặt thứ tự hay khoảng cách nào giữa các thành phố, nên không có chuyện ở giữa Hà Nội và Huế."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "[__import__('statistics').mode([m[c] for c in ['HN', 'HN', 'HCM']]) for m in ({'HN': 1, 'HCM': 3}, {'HN': 3, 'HCM': 1})] == [1, 3]"
      - "round(1 + 10 / 283.15, 3) == round(293.15 / 283.15, 3) == 1.035 and (20 + 273.15) - (10 + 273.15) == 20 - 10"
      - "[sum(col) for col in zip([1, 0, 0], [1, 0, 0], [0, 0, 1])] == [2, 0, 1]"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>mốt không đổi</td><td>tính mốt ở cả hai cách mã: mã 1 rồi mã 3</td><td>cả hai đều chỉ Hà Nội ✓</td></tr>
          <tr><td>1,035</td><td>thương $= 1 + \frac{\text{hiệu}}{\text{nền}} = 1 + \frac{10}{283{,}15}$</td><td>1,035 ✓</td></tr>
          <tr><td>hiệu không đổi</td><td>$293{,}15 - 283{,}15$ so với $20 - 10$</td><td>đều bằng 10 ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, không đọc lại kết quả cũ. Tính mốt theo cả hai cách mã, cách đầu ra mã 1, cách sau ra mã 3, nhưng cả hai đều chỉ về Hà Nội, nên mốt không phụ thuộc cách đặt mã. Thương có thể viết là 1 cộng hiệu chia nền, tức 1 cộng 10 chia 283 phẩy 15, cũng ra 1 phẩy 035. Còn hiệu thì không đổi khi đổi thang, 293 phẩy 15 trừ 283 phẩy 15 vẫn bằng 10, đó là lý do thang khoảng cho phép lấy hiệu."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "(4 - 2) / 2 == 1.0 and round(((4 + 273.15) / (2 + 273.15) - 1) * 100, 2) == 0.73 and round((4 + 273.15) - (2 + 273.15), 9) == 2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nói “gấp đôi” trên thang khoảng <b class="red">(sai)</b>
          <br><span class="note">20 °C không gấp đôi 10 °C; năm 2000 không “gấp đôi” năm 1000. Chỉ thang tỉ lệ mới cho phép chia.</span></div>
        say: "Lỗi thứ nhất, nói gấp đôi trên thang khoảng. 20 độ C không gấp đôi 10 độ C, năm 2000 không gấp đôi năm 1000, chỉ thang tỉ lệ mới cho phép chia."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Coi khoảng cách giữa các bậc là bằng nhau <b class="red">(chưa chắc)</b>
          <br><span class="note">Mức hài lòng 1–5: từ 4 lên 5 không chắc “bằng” từ 1 lên 2. Báo trung vị và phân bố thay vì chỉ một trung bình.</span></div>
        say: "Lỗi thứ hai, coi khoảng cách giữa các bậc là bằng nhau. Với mức hài lòng từ 1 tới 5, từ 4 lên 5 không chắc bằng từ 1 lên 2, nên hãy báo trung vị và phân bố thay vì chỉ một trung bình."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Để công cụ tự đoán kiểu <b class="red">(rủi ro)</b>
          <br><span class="note">Mã bưu chính, số điện thoại bị đọc thành số: mất số 0 ở đầu, bị cộng trừ vô nghĩa. Khai báo kiểu rõ ràng khi đọc dữ liệu.</span></div>
        say: "Lỗi thứ ba, để công cụ tự đoán kiểu dữ liệu. Mã bưu chính hay số điện thoại bị đọc thành số, mất số 0 ở đầu và bị cộng trừ vô nghĩa, nên hãy khai báo kiểu rõ ràng khi đọc dữ liệu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Báo “tăng bao nhiêu phần trăm” cho biến thang khoảng <b class="red">(con số tuỳ đơn vị)</b></div>
          <table class="t"><tr><th>nhiệt độ kho lạnh</th><th>tuần trước</th><th>tuần này</th><th>“tăng”</th></tr>
          <tr><td>độ C</td><td>2</td><td>4</td><td>100%</td></tr>
          <tr><td>thang tuyệt đối</td><td>275,15</td><td>277,15</td><td>0,73%</td></tr>
          <tr><td>hiệu</td><td colspan="2">4 − 2 = 277,15 − 275,15</td><td><b>2 độ</b> ở cả hai thang</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là báo tăng bao nhiêu phần trăm cho một biến thang khoảng, ví dụ nhiệt độ kho lạnh trên bảng theo dõi. Tuần trước 2 độ C, tuần này 4 độ C, báo cáo ghi tăng 100 phần trăm nghe rất đáng sợ. Đổi sang thang tuyệt đối, từ 275 phẩy 15 lên 277 phẩy 15, chỉ tăng khoảng 0 phẩy 73 phần trăm. Con số duy nhất không đổi theo đơn vị là hiệu, tăng 2 độ ở cả hai thang. Người làm nghề báo hiệu cho thang khoảng, và chỉ dùng phần trăm cho thang tỉ lệ như tiền hay thời gian."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round((30 + 273.15) / (15 + 273.15), 3) == 1.052 and round(30 + 273.15, 2) == 303.15 and round(15 + 273.15, 2) == 288.15"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Xếp thang đo: số điện thoại, hạng trong cuộc thi, năm sinh, thu nhập tháng.</td></tr>
          <tr><td>2</td><td>30 °C so với 15 °C nóng gấp bao nhiêu lần (theo Kelvin)?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, xếp thang đo cho số điện thoại, hạng trong cuộc thi, năm sinh, và thu nhập tháng. Câu hai, 30 độ C so với 15 độ C nóng gấp bao nhiêu lần, tính theo nhiệt độ tuyệt đối? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>① biến</th><th>câu hỏi thử</th><th>thang</th></tr>
          <tr><td>số điện thoại</td><td>cộng hai số điện thoại có nghĩa không? Không</td><td><b>định danh</b></td></tr>
          <tr><td>hạng trong cuộc thi</td><td>có thứ tự, nhưng hạng 1 và 2 chưa chắc cách nhau bằng hạng 2 và 3</td><td><b>thứ bậc</b></td></tr>
          <tr><td>năm sinh</td><td>hiệu có nghĩa (hơn 5 tuổi), nhưng mốc đếm năm chỉ là quy ước, không phải “lúc bắt đầu thời gian”</td><td><b>khoảng</b></td></tr>
          <tr><td>thu nhập tháng</td><td>0 đồng là không có gì, nên “gấp đôi” có nghĩa</td><td><b>tỉ lệ</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, với mỗi biến ta hỏi phép tính nào có nghĩa. Cộng hai số điện thoại không có nghĩa gì, nên số điện thoại là định danh. Hạng có thứ tự, nhưng hạng 1 và hạng 2 chưa chắc cách nhau bằng hạng 2 và hạng 3, nên hạng là thứ bậc. Năm sinh lấy hiệu được, hơn nhau 5 tuổi, nhưng mốc đếm năm chỉ là một quy ước, không phải lúc bắt đầu thời gian, nên năm sinh là khoảng. Thu nhập 0 đồng là không có gì, nên nói gấp đôi có nghĩa, đó là thang tỉ lệ."
      - show: |
          <p>② Bước 1: đổi sang thang tuyệt đối: $30 + 273{,}15 = 303{,}15$ và $15 + 273{,}15 = 288{,}15$.</p>
          <p>Bước 2: chia: $\dfrac{303{,}15}{288{,}15} \approx \hl{1{,}052}$ lần — không phải 2.</p>
        focus: [1, 2, 2]
        say: "Câu hai, bước một, đổi sang thang tuyệt đối, 30 độ C thành 303 phẩy 15, còn 15 độ C thành 288 phẩy 15. Bước hai, chia hai số cho nhau được khoảng 1 phẩy 052 lần. Vậy 30 độ C chỉ nóng hơn 15 độ C khoảng 5 phần trăm, không phải gấp 2."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">định danh: bằng/khác</span><span class="a">→</span>
          <span class="n">thứ bậc: + thứ tự</span><span class="a">→</span>
          <span class="n">khoảng: + hiệu</span><span class="a">→</span>
          <span class="n">tỉ lệ: + thương (có số 0 thật)</span></div>
        say: "Tổng kết lại, thang định danh chỉ so bằng hay khác, thứ bậc thêm thứ tự, khoảng thêm hiệu, và tỉ lệ thêm thương nhờ có số 0 thật."
      - show: |
