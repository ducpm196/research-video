id: L10
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 10 — Rò rỉ dữ liệu và chia tập đúng cách"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L10; audit/dsc/verify_dsc.py L10; S. Kaufman và cộng sự, Leakage in Data Mining, ACM TKDD 6(4), 2012; T. Hastie, R. Tibshirani, J. Friedman, The Elements of Statistical Learning, 2nd ed. (2009), mục 7.10.2 (sai lầm khi kiểm định chéo); CS115 bài 19"
assumes: [arith, frac]
# Quy ước: tập huấn luyện / kiểm tra như CS115 bài 19. Mô phỏng rò rỉ (alg.leak_demo): 60 mẫu, 2000 đặc trưng nhiễu thuần, nhãn ±1 ngẫu nhiên, chọn
#   10 đặc trưng tương quan mạnh nhất, phân loại bằng tổng có dấu, trung bình 50 lần chạy, hạt giống 0. Chuẩn hoá ví dụ: huấn luyện [1, 2, 3], kiểm tra [10].
objectives:
  - "Nhận ra rò rỉ dữ liệu"
  - "Học mọi phép biến đổi chỉ trên tập huấn luyện"
  - "Chia tập theo thời gian, theo nhóm khi cần"
asr_reviewed:
  - {sentence: "Sau chuẩn hoá thành âm 1, 0, 1.", reason: "ASR chép “Sau chuẩn hóa thành âm mụt, không mụt.” (0.75): lệch âm/thanh thuần Việt: một/mụt, một/mụt — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "89% chính xác trên dữ liệu ngẫu nhiên"
    checks:
      - "alg.leak_demo() == (0.889, 0.494)"
    steps:
      - show: |
          <p>Dữ liệu hoàn toàn <b>ngẫu nhiên</b>: 60 người, 2000 đặc trưng (cột thông tin) vô nghĩa, nhãn (đáp án cần đoán) tung đồng xu. Tính trung bình, không mô hình nào có thể đoán đúng hơn 50%.</p>
          <p>Vậy mà một quy trình báo độ chính xác trên tập kiểm tra $\hl{88{,}9\%}$ (trung bình 50 lần chạy). Lỗi nằm ở <b>thứ tự</b> các bước, không ở mô hình.</p>
          <div class="box key">Hôm nay: <b>rò rỉ dữ liệu</b> — khi thông tin của tập kiểm tra lọt vào lúc huấn luyện.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, dữ liệu hoàn toàn ngẫu nhiên, 60 người, 2000 cột thông tin vô nghĩa gọi là đặc trưng, và nhãn cần đoán là tung đồng xu. Tính trung bình, không mô hình nào có thể đoán đúng hơn 50 phần trăm. Vậy mà một quy trình báo độ chính xác trên tập kiểm tra là 88 phẩy 9 phần trăm, trung bình qua 50 lần chạy. Lỗi nằm ở thứ tự các bước, không nằm ở mô hình. Hôm nay ta học về rò rỉ dữ liệu, khi thông tin của tập kiểm tra lọt vào lúc huấn luyện."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Trước hết: đặc trưng, nhãn, tập huấn luyện, tập kiểm tra, chuẩn hoá"
    checks:
      - "sum([1, 2, 3]) / 3 == 2 and [x - 2 for x in [1, 2, 3]] == [-1, 0, 1] and 10 - 2 == 8"
      - "27 / 30 == 0.9 and 15 / 30 == 0.5"
    steps:
      - show: |
          <p>Mỗi <b>mẫu</b> là một người. Mỗi <b>đặc trưng</b> là một cột thông tin về người đó (tuổi, cân nặng…). <b>Nhãn</b> là đáp án cần đoán (có bệnh hay không). <b>Mô hình</b> là một quy tắc đoán nhãn từ các đặc trưng.</p>
        focus: [1, 1, 1, 1]
        say: "Trước hết, ta cần vài từ cơ bản, mỗi mẫu là một người trong dữ liệu. Mỗi đặc trưng là một cột thông tin về người đó, như tuổi hay cân nặng. Nhãn là đáp án cần đoán, ví dụ người đó có bệnh hay không. Mô hình là một quy tắc đoán nhãn từ các đặc trưng."
      - show: |
          <p>Dữ liệu chia hai phần: <b>tập huấn luyện</b> để mô hình học quy tắc, và <b>tập kiểm tra</b> giữ kín để chấm, gồm những mẫu mô hình chưa từng thấy. Giống đề thi: học sinh được xem trước đề thì điểm cao không nói gì về năng lực thật.</p>
          <p><b>Độ chính xác</b> = số đoán đúng chia số mẫu: đúng 27 trên 30 là $\frac{27}{30} = 90\%$; đoán bừa khi nhãn chỉ có hai giá trị thì chỉ khoảng $\frac{15}{30} = 50\%$.</p>
        focus: [1, 1, 2, 2]
        say: "Dữ liệu được chia làm hai phần, tập huấn luyện để mô hình học quy tắc, và tập kiểm tra giữ kín để chấm, gồm những mẫu mô hình chưa từng thấy. Nó giống đề thi, học sinh được xem trước đề thì điểm cao không nói gì về năng lực thật. Độ chính xác bằng số đoán đúng chia số mẫu, đoán đúng 27 trên 30 là 90 phần trăm. Nếu nhãn chỉ có hai giá trị mà đoán bừa thì được khoảng 15 trên 30, tức 50 phần trăm."
      - clear: true
        show: |
          <table class="t"><tr><th>chuẩn hoá: trừ trung bình</th><th>giá trị</th></tr>
          <tr><td>huấn luyện 1, 2, 3 → trung bình</td><td>$\frac{1 + 2 + 3}{3} = 2$</td></tr>
          <tr><td>sau chuẩn hoá</td><td>−1, 0, 1</td></tr>
          <tr><td>điểm kiểm tra 10, dùng <b>cùng</b> số 2</td><td>$10 - 2 = 8$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tiền xử lý là bước biến đổi dữ liệu trước khi đưa vào mô hình, quen thuộc nhất là chuẩn hoá, ở đây đơn giản là trừ trung bình. Tập huấn luyện 1, 2, 3 có trung bình 2. Sau chuẩn hoá thành âm 1, 0, 1. Điểm kiểm tra 10 phải dùng đúng số 2 đã học từ tập huấn luyện, nên thành 8."

  - id: sym
    kind: symbol
    title: "Giải mã: rò rỉ"
    checks:
      - "sum([1, 2, 3]) / 3 == 2.0 and sum([1, 2, 3, 10]) / 4 == 4.0"
    steps:
      - show: |
          <p><b>Rò rỉ</b>: mô hình được dùng thông tin mà lúc dự đoán thật sẽ <b>không</b> có.</p>
          <table class="t"><tr><th>kiểu</th><th>ví dụ</th></tr>
          <tr><td>rò rỉ qua tiền xử lý</td><td>chuẩn hoá bằng trung bình của cả tập (4,0) thay vì chỉ tập huấn luyện (2,0)</td></tr>
          <tr><td>rò rỉ qua chọn đặc trưng</td><td>chọn đặc trưng “tốt nhất” trên cả tập rồi mới chia</td></tr>
          <tr><td>rò rỉ từ tương lai</td><td>dùng “số lần tái khám” để dự đoán bệnh — chỉ biết <b>sau</b> khi đã bệnh</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Rò rỉ là khi mô hình được dùng thông tin mà lúc dự đoán thật sẽ không có. Có ba kiểu thường gặp. Rò rỉ qua tiền xử lý, như chuẩn hoá bằng trung bình của cả tập, bằng 4, thay vì chỉ tập huấn luyện, bằng 2. Rò rỉ qua chọn đặc trưng, như chọn đặc trưng tốt nhất trên cả tập rồi mới chia. Rò rỉ từ tương lai, như dùng số lần tái khám để dự đoán bệnh, thông tin chỉ có sau khi đã bệnh."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Càng nhiều chỗ để câu, càng câu được cá may"
    checks:
      - "[alg.leak_demo(p=q)[0] for q in (10, 100, 500, 2000)] == [0.631, 0.807, 0.862, 0.889] and all(abs(alg.leak_demo(p=q)[1] - 0.5) < 0.03 for q in (10, 100, 500, 2000))"
    steps:
      - show: |
          <div><svg width="1500" height="370" viewBox="0 0 1500 370"><g fill="#1f2937" font-size="22"><line x1="150" y1="320" x2="1250" y2="320" stroke="#6b7280" stroke-width="2"/><line x1="150" y1="180" x2="1250" y2="180" stroke="#059669" stroke-width="3" stroke-dasharray="10 6"/><text x="1260" y="187" fill="#059669">đoán mò 50%</text><rect x="230" y="143" width="80" height="177" fill="#b91c1c"/><text x="270" y="133" text-anchor="middle" font-size="20">63,1%</text><rect x="320" y="179" width="80" height="141" fill="#2a78d6"/><text x="315" y="352" text-anchor="middle" font-size="20">10 đặc trưng</text><rect x="490" y="94" width="80" height="226" fill="#b91c1c"/><text x="530" y="84" text-anchor="middle" font-size="20">80,7%</text><rect x="580" y="187" width="80" height="133" fill="#2a78d6"/><text x="575" y="352" text-anchor="middle" font-size="20">100 đặc trưng</text><rect x="750" y="79" width="80" height="241" fill="#b91c1c"/><text x="790" y="69" text-anchor="middle" font-size="20">86,2%</text><rect x="840" y="181" width="80" height="139" fill="#2a78d6"/><text x="835" y="352" text-anchor="middle" font-size="20">500 đặc trưng</text><rect x="1010" y="71" width="80" height="249" fill="#b91c1c"/><text x="1050" y="61" text-anchor="middle" font-size="20">88,9%</text><rect x="1100" y="182" width="80" height="138" fill="#2a78d6"/><text x="1095" y="352" text-anchor="middle" font-size="20">2000 đặc trưng</text><rect x="1260" y="60" width="26" height="26" fill="#b91c1c"/><text x="1296" y="81">chọn trên cả tập</text><rect x="1260" y="100" width="26" height="26" fill="#2a78d6"/><text x="1296" y="121">chọn trên huấn luyện</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cùng một thí nghiệm trên dữ liệu ngẫu nhiên, chỉ đổi số đặc trưng nhiễu từ 10 lên 2000. Cột xanh là chọn đặc trưng chỉ trên tập huấn luyện, luôn đứng quanh vạch đoán mò 50 phần trăm, đúng như dữ liệu vô nghĩa phải cho. Cột đỏ là chọn trên cả tập, đi từ 63 phẩy 1 lên 88 phẩy 9 phần trăm khi số đặc trưng tăng. Có càng nhiều đặc trưng nhiễu thì càng nhiều cái tình cờ khớp với nhãn kiểm tra, và chọn trên cả tập là nhặt đúng những cái khớp may đó."

  - id: example
    kind: example
    title: "Chọn đặc trưng trước hay sau khi chia?"
    checks:
      - "alg.leak_demo()[0] > 0.85 and abs(alg.leak_demo()[1] - 0.5) < 0.02"
    steps:
      - show: |
          <p><b>Bước 1</b> — dữ liệu: 60 người, 2000 đặc trưng nhiễu, nhãn tung đồng xu. Chia đôi: 30 huấn luyện, 30 kiểm tra. Mức đúng phải mong: khoảng 50%.</p>
          <p class="note">Quy trình: chọn 10 đặc trưng <b>tương quan</b> mạnh nhất với nhãn (lên xuống cùng nhãn rõ nhất), rồi đoán theo tổng của 10 cột đó, mỗi cột đã đổi dấu cho cùng chiều với nhãn.</p>
        focus: [1, 1, 2, 2]
        say: "Bước một, nhắc lại dữ liệu, 60 người, 2000 đặc trưng nhiễu, nhãn là tung đồng xu. Ta chia đôi, 30 người huấn luyện và 30 người kiểm tra, nên mức đúng phải mong là khoảng 50 phần trăm. Quy trình chọn 10 đặc trưng tương quan mạnh nhất với nhãn, tức những cột lên xuống cùng nhãn rõ nhất. Rồi nó đoán theo tổng của 10 cột đó, mỗi cột đã đổi dấu cho cùng chiều với nhãn."
      - show: |
          <table class="t"><tr><th>thứ tự</th><th>độ chính xác trên tập kiểm tra</th></tr>
          <tr><td>chọn 10 đặc trưng tương quan nhất trên <b>cả 60 người</b>, rồi chia đôi</td><td>$\hl{88{,}9\%}$ — ảo</td></tr></table>
          <p><b>Bước 2</b> — thứ tự sai: bước chọn đã nhìn thấy nhãn của 30 người kiểm tra.</p>
        focus: [1, 2]
        say: "Bước hai, thứ tự sai, chọn 10 đặc trưng tương quan nhất trên cả 60 người rồi mới chia đôi, độ chính xác trên tập kiểm tra là 88 phẩy 9 phần trăm, hoàn toàn ảo. Lý do là bước chọn đã nhìn thấy nhãn của 30 người kiểm tra."
      - show: |
          <table class="t"><tr><th>thứ tự</th><th>độ chính xác trên tập kiểm tra</th></tr>
          <tr><td>chọn 10 đặc trưng tương quan nhất trên <b>cả 60 người</b>, rồi chia đôi</td><td>$\hl{88{,}9\%}$ — ảo</td></tr>
          <tr><td>chia đôi trước, chọn trên <b>30 người huấn luyện</b></td><td>49,4% — đúng mức đoán mò</td></tr></table>
          <p><b>Bước 3</b> — thứ tự đúng: chia trước, mọi lựa chọn chỉ dựa trên 30 người huấn luyện.</p>
        focus: ["1.3", 2]
        say: "Bước ba, thứ tự đúng, chia đôi trước rồi chọn trên 30 người huấn luyện, độ chính xác là 49 phẩy 4 phần trăm, đúng mức đoán mò. Mọi lựa chọn chỉ dựa trên 30 người huấn luyện."
      - clear: true
        show: |
          <p><b>Bước 4</b> — vì sao: trong 2000 đặc trưng nhiễu, luôn có vài cái tình cờ khớp với nhãn — kể cả nhãn của tập kiểm tra. Chọn trên cả tập là chọn đúng những cái khớp may với tập kiểm tra.</p>
          <div class="box key">Mọi bước <b>học từ dữ liệu</b> (chuẩn hoá, điền thiếu, chọn đặc trưng, chỉnh tham số) phải nằm <b>bên trong</b> phần huấn luyện.</div>
        focus: [1, 1, 2]
        say: "Bước bốn, tìm lý do. Trong 2000 đặc trưng nhiễu, luôn có vài cái tình cờ khớp với nhãn, kể cả nhãn của tập kiểm tra, và chọn trên cả tập là chọn đúng những cái khớp may với tập kiểm tra. Vì vậy, mọi bước học từ dữ liệu, như chuẩn hoá, điền thiếu, chọn đặc trưng, chỉnh tham số, phải nằm bên trong phần huấn luyện."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "alg.leak_demo(seed=7, reps=30) == (0.911, 0.481)"
      - "sum([1, 2, 3, 10]) / 4 == 4 and 10 - 4 == 6 and 10 - 2 == 8"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>88,9% là ảo, không phải may</td><td>chạy lại với hạt giống ngẫu nhiên khác, 30 lần lặp</td><td>chọn trên cả tập 91,1%; chọn trên huấn luyện 48,1% ✓</td></tr>
          <tr><td>chuẩn hoá cũng rò</td><td>trung bình của cả tập 1, 2, 3, 10 là 4, nên điểm 10 thành 6 thay vì 8</td><td>số 10 của tập kiểm tra đã kéo số dùng để chuẩn hoá ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác. Chạy lại toàn bộ với một hạt giống ngẫu nhiên khác và 30 lần lặp. Chọn trên cả tập vẫn cho 91 phẩy 1 phần trăm, còn chọn trên huấn luyện cho 48 phẩy 1 phần trăm, nên khoảng cách đó không phải do may. Với chuẩn hoá, nếu tính trung bình trên cả tập 1, 2, 3, 10 thì được 4. Khi đó điểm kiểm tra 10 thành 6 thay vì 8, vì chính số 10 của tập kiểm tra đã kéo con số dùng để chuẩn hoá."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "len([m for m in [1, 2, 3] if m <= 1]) == 1 and len([1, 2, 3]) == 3 and len([m for m in [1, 2, 3] if m > 1]) == 2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chia ngẫu nhiên dữ liệu có thứ tự thời gian <b class="red">(rò từ tương lai)</b>
          <br><span class="note">Dự đoán giá ngày mai mà tập huấn luyện có cả giá ngày kia. Chia theo thời gian: huấn luyện trên quá khứ, kiểm tra trên tương lai.</span></div>
        say: "Lỗi thứ nhất, chia ngẫu nhiên dữ liệu có thứ tự thời gian. Khi đó dự đoán giá ngày mai mà tập huấn luyện lại có cả giá ngày kia, nên hãy chia theo thời gian, huấn luyện trên quá khứ, kiểm tra trên tương lai."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cùng một người xuất hiện ở cả hai tập <b class="red">(rò theo nhóm)</b>
          <br><span class="note">Mười ảnh X-quang của cùng một bệnh nhân bị chia ra hai tập: mô hình học nhận ra bệnh nhân, không phải bệnh. Chia theo bệnh nhân.</span></div>
        say: "Lỗi thứ hai, cùng một người xuất hiện ở cả hai tập. Mười ảnh X quang của cùng một bệnh nhân bị chia ra hai tập, mô hình học cách nhận ra bệnh nhân chứ không phải bệnh, nên hãy chia theo bệnh nhân."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng tập kiểm tra nhiều lần để chỉnh mô hình <b class="red">(rò từ từ)</b>
          <br><span class="note">Mỗi lần nhìn kết quả rồi chỉnh là một lần rò. Tách thêm một phần thứ ba từ dữ liệu huấn luyện, gọi là <b>tập xác thực</b>, để chỉnh; tập kiểm tra chỉ mở <b>một lần</b> ở cuối.</span></div>
        say: "Lỗi thứ ba, dùng tập kiểm tra nhiều lần để chỉnh mô hình. Mỗi lần nhìn kết quả rồi chỉnh là một lần rò, nên hãy tách thêm một phần thứ ba từ dữ liệu huấn luyện, gọi là tập xác thực, để chỉnh. Tập kiểm tra chỉ mở một lần ở cuối."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Tính đặc trưng tổng hợp trên cả bảng, không “tính đến thời điểm dự đoán” <b class="red">(rò từ tương lai)</b></div>
          <table class="t"><tr><th>khách K mua vào tháng 1, 2, 3 (minh hoạ)</th><th>“số đơn của khách”</th></tr>
          <tr><td>dự đoán lúc cuối tháng 1: “khách có mua tiếp không?”</td><td></td></tr>
          <tr><td>tính đúng: chỉ đơn đến hết tháng 1</td><td>1</td></tr>
          <tr><td>tính trên cả bảng</td><td>3 — đã chứa 2 đơn tương lai, tức chứa luôn đáp án</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là tính đặc trưng tổng hợp trên cả bảng, thay vì tính đến thời điểm dự đoán. Ví dụ minh hoạ, khách K mua vào tháng 1, 2 và 3, và ta muốn dự đoán lúc cuối tháng 1 xem khách có mua tiếp không. Tính đúng thì số đơn của khách đến hết tháng 1 chỉ là 1. Tính trên cả bảng thì ra 3, đã chứa 2 đơn tương lai, tức là chứa luôn đáp án. Người làm nghề gắn mỗi đặc trưng với một mốc thời gian, và chỉ dùng dữ liệu có trước mốc đó."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "sum([4, 6, 8]) / 3 == 6.0 and sum([4, 6, 8, 2]) / 4 == 5.0"
      - "2 - 6 == -4 and 2 - 5 == -3"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Huấn luyện: 4, 6, 8; kiểm tra: 2. Trung bình dùng để chuẩn hoá phải là bao nhiêu? Nếu tính sai trên cả tập thì ra bao nhiêu?</td></tr>
          <tr><td>2</td><td>Dự đoán khách huỷ dịch vụ, có cột “ngày gửi thư xin huỷ”. Dùng được không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tập huấn luyện là 4, 6, 8, tập kiểm tra là 2. Trung bình dùng để chuẩn hoá phải là bao nhiêu? Nếu tính sai trên cả tập thì ra bao nhiêu? Câu hai, dự đoán khách huỷ dịch vụ, dữ liệu có cột ngày gửi thư xin huỷ. Dùng cột đó được không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>①</th><th>trung bình</th><th>điểm kiểm tra 2 sau chuẩn hoá</th></tr>
          <tr><td>đúng: chỉ tập huấn luyện</td><td>$\frac{4 + 6 + 8}{3} = \hl{6}$</td><td>$2 - 6 = -4$</td></tr>
          <tr><td>sai: cả tập</td><td>$\frac{4 + 6 + 8 + 2}{4} = 5$</td><td>$2 - 5 = -3$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Đáp án câu một, tính hai cách rồi so. Trung bình đúng chỉ tính trên tập huấn luyện, 18 chia 3 bằng 6, nên điểm kiểm tra 2 thành âm 4. Tính sai trên cả tập thì 20 chia 4 bằng 5, điểm kiểm tra thành âm 3, vì số 2 của tập kiểm tra đã lọt vào."
      - show: |
          <p>② <b>Không</b>: cột đó chỉ có giá trị <b>sau</b> khi khách đã quyết định huỷ — rò từ tương lai.</p>
        say: "Câu hai, không được, vì cột đó chỉ có giá trị sau khi khách đã quyết định huỷ, đó là rò rỉ từ tương lai. Lúc cần dự đoán, ta chưa thể có cột này."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chia tập trước tiên</span><span class="a">→</span>
          <span class="n">mọi bước học: chỉ trên huấn luyện</span><span class="a">→</span>
          <span class="n">thời gian, nhóm: chia đúng cách</span><span class="a">→</span>
          <span class="n">tập kiểm tra mở một lần</span></div>
        say: "Tổng kết lại, chia tập trước tiên, mọi bước học từ dữ liệu chỉ làm trên tập huấn luyện. Dữ liệu có thời gian hay có nhóm thì chia đúng cách, và tập kiểm tra chỉ mở một lần."
      - show: |
          <div class="box key"><b>Tư duy:</b> đánh giá phải mô phỏng đúng lúc dùng thật: lúc dự đoán, mình biết gì và chưa biết gì?</div>
        say: "Điều cần mang theo, đánh giá phải mô phỏng đúng lúc dùng thật. Hãy hỏi lúc dự đoán, mình biết gì và chưa biết gì."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>lớp mất cân bằng</b>, tỉ lệ nền và chọn chỉ số đánh giá.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta học về lớp mất cân bằng, tỉ lệ nền, và cách chọn chỉ số đánh giá. Hẹn gặp bạn ở bài tiếp theo."
