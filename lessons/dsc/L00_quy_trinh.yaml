source: "curriculum/dsc.yaml L00; audit/dsc/verify_dsc.py L00; H. Wickham, M. Çetinkaya-Rundel, G. Grolemund, R for Data Science, 2nd ed. (2023), chương 1 (vòng phân tích); ACM Data Science Task Force (2021)"
assumes: [arith]
# Quy ước: bốn cửa hàng (chi quảng cáo triệu đồng, doanh số triệu đồng, cỡ) là số liệu MINH HOẠ để thấy biến gây nhiễu; hệ số tương quan Pearson
#   tính bằng alg.pearson (định nghĩa ở CS115). Bài không dạy lại mô hình học máy.
objectives:
  - "Biết các bước của một phân tích dữ liệu"
  - "Bắt đầu từ câu hỏi rõ ràng"
  - "Phân biệt dữ liệu quan sát và dữ liệu thí nghiệm"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cửa hàng chi nhiều quảng cáo bán được nhiều hơn"
    checks:
      - "round(alg.pearson([2, 3, 9, 11], [20, 20, 100, 100]), 3) == 0.978"
    steps:
      - show: |
          <table class="t"><tr><th>cửa hàng</th><th>chi quảng cáo</th><th>doanh số</th><th>cỡ</th></tr>
          <tr><td>1</td><td>2</td><td>20</td><td>nhỏ</td></tr><tr><td>2</td><td>3</td><td>20</td><td>nhỏ</td></tr>
          <tr><td>3</td><td>9</td><td>100</td><td>lớn</td></tr><tr><td>4</td><td>11</td><td>100</td><td>lớn</td></tr></table>
          <p>Tương quan giữa chi quảng cáo và doanh số: $\hl{0{,}978}$. Kết luận “tăng quảng cáo sẽ tăng doanh số”? Nhìn kỹ: trong cùng cỡ cửa hàng, chi nhiều hơn <b>không</b> bán nhiều hơn. Cửa hàng lớn vừa chi nhiều, vừa bán nhiều.</p>
          <div class="box key">Hôm nay: <b>quy trình</b> khoa học dữ liệu — và vì sao câu hỏi quyết định loại dữ liệu cần thu.</div>
        focus: [1, 2, 2, 2, 3]
        say: "Chào bạn, bảng có bốn cửa hàng với chi quảng cáo, doanh số và cỡ cửa hàng. Tương quan giữa chi quảng cáo và doanh số là 0 phẩy 978. Vậy có kết luận được tăng quảng cáo sẽ tăng doanh số không? Nhìn kỹ thì trong cùng cỡ cửa hàng, chi nhiều hơn không bán nhiều hơn, cửa hàng lớn vừa chi nhiều vừa bán nhiều. Hôm nay ta học quy trình khoa học dữ liệu, và vì sao câu hỏi quyết định loại dữ liệu cần thu."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: hệ số tương quan và trung bình theo nhóm"
    checks:
      - "round(alg.pearson([1, 2, 3], [2, 4, 6]), 9) == 1 and round(alg.pearson([1, 2, 3], [6, 4, 2]), 9) == -1"
      - "(20 + 20) / 2 == 20 and (100 + 100) / 2 == 100 and 100 - 20 == 80"
    steps:
      - show: |
          <table class="t"><tr><th>hệ số tương quan $r$</th><th>nghĩa</th><th>ví dụ</th></tr>
          <tr><td>gần 1</td><td>cột này lớn thì cột kia lớn, theo đường thẳng</td><td>1, 2, 3 với 2, 4, 6 → $r = 1$</td></tr>
          <tr><td>gần −1</td><td>cột này lớn thì cột kia nhỏ</td><td>1, 2, 3 với 6, 4, 2 → $r = -1$</td></tr>
          <tr><td>gần 0</td><td>không có xu hướng đường thẳng</td><td></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Ở khoá Toán cho khoa học máy tính, ta đã gặp hệ số tương quan, ký hiệu r, luôn nằm từ âm 1 tới 1. r gần 1 nghĩa là cột này lớn thì cột kia cũng lớn, theo một đường thẳng, ví dụ 1, 2, 3 đi với 2, 4, 6 cho r đúng bằng 1. r gần âm 1 nghĩa là cột này lớn thì cột kia nhỏ, ví dụ 1, 2, 3 đi với 6, 4, 2 cho r bằng âm 1. r gần 0 nghĩa là không có xu hướng đường thẳng nào."
      - show: |
          <p><b>Trung bình theo nhóm</b>: tách bảng theo một cột (ví dụ cỡ cửa hàng), rồi lấy trung bình trong từng nhóm.</p>
          <p>Nhóm nhỏ: $\frac{20 + 20}{2} = 20$. Nhóm lớn: $\frac{100 + 100}{2} = 100$. Chênh $100 - 20 = 80$.</p>
        focus: [1, 2, 2]
        say: "Phép thứ hai là trung bình theo nhóm, tức tách bảng theo một cột, ví dụ cỡ cửa hàng, rồi lấy trung bình trong từng nhóm. Nhóm cửa hàng nhỏ có doanh số 20 và 20, trung bình 20. Nhóm cửa hàng lớn có 100 và 100, trung bình 100, nên hai nhóm chênh nhau 80."

  - id: sym
    kind: symbol
    title: "Giải mã: năm bước, một vòng lặp"
    steps:
      - show: |
          <div class="chain"><span class="n">1. câu hỏi</span><span class="a">→</span><span class="n">2. thu dữ liệu</span><span class="a">→</span><span class="n">3. làm sạch, khám phá</span><span class="a">→</span><span class="n">4. phân tích, mô hình</span><span class="a">→</span><span class="n">5. truyền đạt, quyết định</span></div>
          <p>Mỗi bước có thể buộc quay lại bước trước: khám phá thấy dữ liệu không trả lời được câu hỏi → thu thêm, hoặc hỏi lại.</p>
          <p class="note">Phần lớn thời gian thực tế nằm ở bước 2 và 3 — đó là trọng tâm của khoá này. Bước 4 (mô hình) đã học ở CS115.</p>
        focus: [1, 2, 3, 3]
        say: "Quy trình có năm bước, câu hỏi, thu dữ liệu, làm sạch và khám phá, phân tích và mô hình, rồi truyền đạt và quyết định. Mỗi bước có thể buộc quay lại bước trước, chẳng hạn khám phá thấy dữ liệu không trả lời được câu hỏi thì phải thu thêm hoặc hỏi lại. Phần lớn thời gian thực tế nằm ở bước thu dữ liệu và làm sạch, đó là trọng tâm của khoá này. Bước mô hình đã học ở khoá Toán cho khoa học máy tính."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một nguyên nhân chung tạo ra hai cột cùng tăng"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><g fill="#1f2937" font-size="22"><line x1="120" y1="360" x2="760" y2="360" stroke="#6b7280" stroke-width="2"/><line x1="120" y1="360" x2="120" y2="30" stroke="#6b7280" stroke-width="2"/><line x1="170" y1="343" x2="720" y2="51" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8"/><line x1="185" y1="308" x2="305" y2="308" stroke="#2a78d6" stroke-width="5"/><line x1="535" y1="100" x2="705" y2="100" stroke="#eb6834" stroke-width="5"/><circle cx="220" cy="308" r="13" fill="#2a78d6"/><circle cx="270" cy="308" r="13" fill="#2a78d6"/><circle cx="570" cy="100" r="13" fill="#eb6834"/><circle cx="670" cy="100" r="13" fill="#eb6834"/><text x="320" y="316" fill="#2a78d6">nhỏ: phẳng</text><text x="520" y="108" text-anchor="end" fill="#eb6834">lớn: phẳng</text><text x="430" y="189" text-anchor="end">gộp: dốc lên</text><text x="440" y="400" text-anchor="middle">chi quảng cáo (triệu đồng)</text><text x="20" y="24">doanh số</text><rect x="1000" y="40" width="300" height="60" rx="10" fill="#fde68a"/><text x="1150" y="80" text-anchor="middle" font-size="26">cỡ cửa hàng</text><rect x="830" y="270" width="250" height="60" rx="10" fill="#dbeafe"/><text x="955" y="310" text-anchor="middle" font-size="24">chi quảng cáo</text><rect x="1220" y="270" width="220" height="60" rx="10" fill="#dbeafe"/><text x="1330" y="310" text-anchor="middle" font-size="24">doanh số</text><line x1="1110" y1="100" x2="975" y2="262" stroke="#059669" stroke-width="5"/><polygon points="968,270 965,250 985,256" fill="#059669"/><line x1="1190" y1="100" x2="1310" y2="262" stroke="#059669" stroke-width="5"/><polygon points="1316,270 1300,256 1320,250" fill="#059669"/><line x1="1085" y1="300" x2="1215" y2="300" stroke="#b91c1c" stroke-width="4" stroke-dasharray="8 8"/><text x="1150" y="372" text-anchor="middle" fill="#b91c1c">có mũi tên này không?</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Bên trái là bốn cửa hàng vẽ đúng theo bảng mở đầu, chấm xanh là cửa hàng nhỏ, chấm cam là cửa hàng lớn. Nhìn gộp cả bốn thì đường nét đứt dốc lên rất rõ, nhưng trong từng nhóm, đoạn xanh và đoạn cam đều nằm ngang. Bên phải là cách giải thích, cỡ cửa hàng đẩy cả chi quảng cáo lẫn doanh số lên, nên hai cột cùng tăng mà không cần mũi tên đỏ nào giữa chúng. Dữ liệu quan sát chỉ cho ta thấy hai cột đi cùng nhau, nó không nói được mũi tên đỏ có tồn tại hay không."

  - id: example
    kind: example
    title: "Câu hỏi quyết định loại dữ liệu"
    checks:
      - "len({20, 20}) == 1 and len({100, 100}) == 1 and round(alg.pearson([2, 3, 9, 11], [20, 20, 100, 100]), 3) == 0.978"
    steps:
      - show: |
          <p><b>Bước 1</b> — nhìn gộp cả bốn cửa hàng: tương quan giữa chi quảng cáo và doanh số $r = \hl{0{,}978}$, rất gần 1.</p>
        say: "Bước một, nhìn gộp cả bốn cửa hàng như bảng mở đầu, tương quan giữa chi quảng cáo và doanh số là 0 phẩy 978, rất gần 1."
      - show: |
          <table class="t"><tr><th>nhóm</th><th>chi quảng cáo</th><th>doanh số</th><th>chi thêm → bán thêm</th></tr>
          <tr><td>nhỏ</td><td>2 → 3</td><td>20 → 20</td><td>+1 triệu → +0</td></tr>
          <tr><td>lớn</td><td>9 → 11</td><td>100 → 100</td><td>+2 triệu → +0</td></tr></table>
          <p><b>Bước 2</b> — tách theo cỡ: trong cùng nhóm, chi thêm không bán thêm.</p>
        focus: [2, "1.2", "1.3"]
        say: "Bước hai, tách theo cỡ cửa hàng. Trong nhóm nhỏ, chi quảng cáo tăng từ 2 lên 3 triệu, thêm 1 triệu, mà doanh số vẫn là 20. Trong nhóm lớn, chi tăng từ 9 lên 11 triệu, thêm 2 triệu, mà doanh số vẫn là 100."
      - show: |
          <p><b>Bước 3</b> — trung bình theo nhóm: nhỏ 20, lớn 100. Toàn bộ chênh lệch 80 đi theo <b>cỡ cửa hàng</b>, không theo quảng cáo.</p>
        say: "Bước ba, lấy trung bình theo nhóm, nhóm nhỏ 20, nhóm lớn 100. Toàn bộ chênh lệch 80 đi theo cỡ cửa hàng chứ không theo quảng cáo, nên tương quan 0 phẩy 978 là do cỡ cửa hàng tạo ra."
      - clear: true
        show: |
          <table class="t"><tr><th>câu hỏi</th><th>loại câu hỏi</th><th>dữ liệu cần</th></tr>
          <tr><td>Tháng trước bán được bao nhiêu?</td><td>mô tả</td><td>sổ sách bán hàng</td></tr>
          <tr><td>Doanh số tháng sau khoảng bao nhiêu?</td><td>dự đoán</td><td>lịch sử, các yếu tố liên quan</td></tr>
          <tr><td><b>Tăng quảng cáo có làm tăng doanh số không?</b></td><td><b>nhân quả</b></td><td><b>thí nghiệm</b>: chọn ngẫu nhiên cửa hàng nào được tăng quảng cáo</td></tr></table>
          <p><b>Bước 4</b> — xác định loại câu hỏi trước khi chọn dữ liệu.</p>
        focus: [2, "1.2", "1.3", "1.4"]
        say: "Bước bốn, trước khi chọn dữ liệu, hãy xác định câu hỏi thuộc loại nào. Tháng trước bán được bao nhiêu là câu hỏi mô tả, chỉ cần sổ sách bán hàng. Doanh số tháng sau khoảng bao nhiêu là câu hỏi dự đoán, cần lịch sử và các yếu tố liên quan. Tăng quảng cáo có làm tăng doanh số không là câu hỏi nhân quả, cần thí nghiệm, tức chọn ngẫu nhiên cửa hàng nào được tăng quảng cáo."
      - show: |
          <div class="box key"><b>Bước 5</b> — dữ liệu quan sát (như bảng mở đầu) trả lời tốt câu hỏi mô tả, dự đoán; câu hỏi nhân quả thường cần thí nghiệm, hoặc lập luận rất cẩn thận về biến gây nhiễu.</div>
        say: "Bước năm, kết luận. Dữ liệu quan sát như bảng mở đầu trả lời tốt câu hỏi mô tả và dự đoán, còn câu hỏi nhân quả thường cần thí nghiệm, hoặc lập luận rất cẩn thận về biến gây nhiễu. Khi chọn ngẫu nhiên, cỡ cửa hàng không còn quyết định ai được tăng quảng cáo, nên nó không tạo ra được tương quan giả nữa."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "(lambda X, Y: (sum(X) / 4, sum(Y) / 4, sum((a - 6.25) * (b - 60) for a, b in zip(X, Y)), sum((a - 6.25) ** 2 for a in X), sum((b - 60) ** 2 for b in Y)))([2, 3, 9, 11], [20, 20, 100, 100]) == (6.25, 60, 600, 58.75, 6400)"
      - "round(600 / math.sqrt(58.75 * 6400), 3) == round(alg.pearson([2, 3, 9, 11], [20, 20, 100, 100]), 3) == 0.978"
      - "sum(dx * dy for dx, dy in zip([-0.5, 0.5, -1, 1], [0, 0, 0, 0])) == 0 and [2 - 2.5, 3 - 2.5, 9 - 10, 11 - 10] == [-0.5, 0.5, -1, 1]"
    steps:
      - show: |
          <p>Tính tay $r$: trung bình chi $= \frac{25}{4} = 6{,}25$, trung bình doanh số $= \frac{240}{4} = 60$.</p>
          $$r = \frac{\text{tổng tích độ lệch}}{\sqrt{\text{tổng bình phương độ lệch chi} \cdot \text{tổng bình phương độ lệch doanh số}}} = \frac{600}{\sqrt{58{,}75 \cdot 6400}} \approx \hl{0{,}978}$$
        introduces: [sqrt, cdot]
        focus: [1, 1, 2, 2, 2]
        say: "Kiểm bằng đường khác, ta tính tay r thay vì tin máy. Trung bình chi quảng cáo là 25 chia 4, bằng 6 phẩy 25, trung bình doanh số là 240 chia 4, bằng 60. Tổng tích độ lệch của hai cột là 600. Tổng bình phương độ lệch của chi là 58 phẩy 75, của doanh số là 6400. Vậy r bằng 600 chia căn của 58 phẩy 75 nhân 6400, khoảng 0 phẩy 978, khớp với máy."
      - show: |
          <table class="t"><tr><th>cửa hàng</th><th>chi trừ trung bình nhóm</th><th>doanh số trừ trung bình nhóm</th><th>tích</th></tr>
          <tr><td>1, 2 (nhỏ, trung bình chi 2,5)</td><td>−0,5; 0,5</td><td>0; 0</td><td>0; 0</td></tr>
          <tr><td>3, 4 (lớn, trung bình chi 10)</td><td>−1; 1</td><td>0; 0</td><td>0; 0</td></tr></table>
          <p>Trong nhóm, tổng tích độ lệch $= 0$: không còn chút liên hệ nào khi đã giữ cỡ cửa hàng cố định ✓</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đường thứ hai là đo độ lệch so với trung bình của chính nhóm mình. Nhóm nhỏ có trung bình chi 2 phẩy 5, nên độ lệch là âm 0 phẩy 5 và 0 phẩy 5, còn doanh số lệch 0. Nhóm lớn có trung bình chi 10, độ lệch là âm 1 và 1, doanh số cũng lệch 0. Mọi tích đều bằng 0, nên khi giữ cỡ cửa hàng cố định thì chi quảng cáo và doanh số không còn chút liên hệ nào."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "(130 - 100) / 100 == 0.30 and (125 - 100) / 100 == 0.25 and 30 - 25 == 5"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bắt đầu từ dữ liệu, không từ câu hỏi <b class="red">(lạc hướng)</b>
          <br><span class="note">Thử đủ kiểu phân tích trên một bảng lớn sẽ luôn tìm được “mẫu” — nhiều mẫu chỉ là ngẫu nhiên.</span></div>
        say: "Lỗi thứ nhất, bắt đầu từ dữ liệu thay vì từ câu hỏi. Thử đủ kiểu phân tích trên một bảng lớn sẽ luôn tìm được một mẫu nào đó, nhưng nhiều mẫu chỉ là ngẫu nhiên."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Trả lời câu hỏi nhân quả bằng tương quan <b class="red">(sai)</b>
          <br><span class="note">Như bảng mở đầu: tương quan 0,978 nhưng quảng cáo không gây ra doanh số; cỡ cửa hàng gây ra cả hai.</span></div>
        say: "Lỗi thứ hai, trả lời câu hỏi nhân quả bằng tương quan. Như bảng mở đầu, tương quan là 0 phẩy 978 nhưng quảng cáo không gây ra doanh số, cỡ cửa hàng mới gây ra cả hai."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dừng ở con số, không truyền đạt được <b class="red">(vô ích)</b>
          <br><span class="note">Người ra quyết định cần biết: trả lời câu hỏi gì, chắc đến đâu, giả định gì. Một phân tích không ai hiểu thì không thay đổi được gì.</span></div>
        say: "Lỗi thứ ba, dừng ở con số mà không truyền đạt được. Người ra quyết định cần biết phân tích trả lời câu hỏi gì, chắc đến đâu, và dựa trên giả định gì, một phân tích không ai hiểu thì không thay đổi được gì."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> So trước và sau, không có nhóm đối chứng <b class="red">(gán nhầm công)</b></div>
          <table class="t"><tr><th>doanh số (số minh hoạ)</th><th>tháng 11</th><th>tháng 12</th><th>tăng</th></tr>
          <tr><td>cửa hàng chạy quảng cáo</td><td>100</td><td>130</td><td>30%</td></tr>
          <tr><td>cửa hàng không chạy (đối chứng)</td><td>100</td><td>125</td><td>25%</td></tr>
          <tr><td><b>phần do quảng cáo</b></td><td colspan="2">30 − 25</td><td><b>5 điểm</b></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là so trước và sau mà không có nhóm đối chứng, nên gán nhầm công cho quảng cáo. Với số minh hoạ trên bảng, cửa hàng chạy quảng cáo tháng 12 tăng từ 100 lên 130, tức 30 phần trăm, và báo cáo ghi quảng cáo mang lại 30 phần trăm. Nhưng cửa hàng không chạy quảng cáo cũng tăng từ 100 lên 125, tức 25 phần trăm, vì tháng 12 là mùa mua sắm. Phần thật sự do quảng cáo chỉ khoảng 30 trừ 25, bằng 5 điểm phần trăm. Người làm nghề luôn hỏi một câu trước mọi con số tăng, so với cái gì."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    steps:
      - show: |
          <p>Xếp mỗi câu hỏi vào loại mô tả, dự đoán, hay nhân quả:</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Năm nay có bao nhiêu sinh viên bỏ học?</td></tr>
          <tr><td>2</td><td>Sinh viên nào có nguy cơ bỏ học kỳ tới?</td></tr>
          <tr><td>3</td><td>Học bổng có làm giảm tỉ lệ bỏ học không?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm, hãy xếp mỗi câu hỏi vào loại mô tả, dự đoán, hay nhân quả. Câu một, năm nay có bao nhiêu sinh viên bỏ học? Câu hai, sinh viên nào có nguy cơ bỏ học kỳ tới? Câu ba, học bổng có làm giảm tỉ lệ bỏ học không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>câu hỏi thử: hỏi về cái gì?</th><th>loại</th></tr>
          <tr><td>①</td><td>đếm điều đã xảy ra trong năm nay</td><td><b>mô tả</b></td></tr>
          <tr><td>②</td><td>đoán điều chưa xảy ra cho từng sinh viên, không cần biết vì sao</td><td><b>dự đoán</b></td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Đáp án, với mỗi câu ta hỏi nó hỏi về cái gì. Câu một đếm điều đã xảy ra trong năm nay, nên là mô tả. Câu hai đoán điều chưa xảy ra cho từng sinh viên, và không cần biết vì sao, nên là dự đoán."
      - show: |
          <p>③ <b>nhân quả</b> — hỏi “nếu <b>cho</b> học bổng thì tỉ lệ bỏ học có đổi không”. Sinh viên được học bổng vốn đã khác sinh viên không được, giống cỡ cửa hàng ở bảng mở đầu; cần thí nghiệm hoặc phân tích biến gây nhiễu.</p>
        focus: [1, 1, 1]
        say: "Câu ba hỏi nếu cho học bổng thì tỉ lệ bỏ học có đổi không, đó là câu hỏi nhân quả. Sinh viên được học bổng vốn đã khác sinh viên không được, giống như cỡ cửa hàng ở bảng mở đầu. Vì vậy cần thí nghiệm hoặc phân tích biến gây nhiễu, chứ không thể chỉ so hai nhóm."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">câu hỏi rõ</span><span class="a">→</span>
          <span class="n">loại câu hỏi quyết định dữ liệu</span><span class="a">→</span>
          <span class="n">làm sạch, khám phá chiếm phần lớn</span><span class="a">→</span>
          <span class="n">truyền đạt: trả lời gì, chắc đến đâu</span></div>
        say: "Tổng kết lại, bắt đầu từ một câu hỏi rõ, loại câu hỏi quyết định loại dữ liệu cần thu. Làm sạch và khám phá chiếm phần lớn công việc, và cuối cùng phải truyền đạt được trả lời gì, chắc đến đâu."
      - show: |
          <div class="box key"><b>Tư duy:</b> dữ liệu không tự nói. Nó chỉ trả lời câu hỏi mà cách thu thập nó cho phép trả lời.</div>
        say: "Điều cần mang theo, dữ liệu không tự nói. Nó chỉ trả lời được câu hỏi mà cách thu thập nó cho phép trả lời."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>kiểu dữ liệu và thang đo</b> — phép tính nào có nghĩa với loại dữ liệu nào.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học kiểu dữ liệu và thang đo, phép tính nào có nghĩa với loại dữ liệu nào. Hẹn gặp bạn ở bài tiếp theo."
