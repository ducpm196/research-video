 y="325" font-size="22">hạt giống 7: trung bình 5 số ngẫu nhiên</text><text x="620" y="325" font-size="24" fill="#b91c1c">−0,2639</text><text x="760" y="275" font-size="21">cùng hạt giống: cùng số đến từng chữ số</text></g></svg></div>
