# Quy ước: kết quả thử nghiệm minh hoạ: hai nhóm 15 000 người, tỉ lệ 10,0% và 11,2%; khoảng 95% cho hiệu hai tỉ lệ = hiệu ± 1,96 · SE với
#   SE = √(p₁(1 − p₁)/n + p₂(1 − p₂)/n) (như CS115 bài 44). Ví dụ hạt giống: trung bình 5 số chuẩn ngẫu nhiên của numpy.random.default_rng.
objectives:
  - "Làm một phân tích người khác chạy lại được và ra cùng kết quả"
  - "Báo cáo kết quả kèm độ lớn, độ không chắc chắn, cỡ mẫu"
  - "Viết kết luận đúng phạm vi bằng chứng"
asr_reviewed:
  - {sentence: "Đo một tỉ lệ p trên n người thì kết quả dao động quanh tỉ lệ thật, vì một nhóm người khác sẽ cho con số hơi khác.", reason: "ASR chép “Đó 1 tỷ lệ T trên n người thì kết quả giao động quanh tỷ lệ thật vì một nhóm người khác sẽ cho con số hơi khác.” (0.857): “tỉ” ASR viết chính tả “tỷ” (cùng âm); chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: đo/đó — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“Trên máy tôi chạy được”"
    checks:
      - "round(float(__import__('numpy').random.default_rng(42).normal(size=5).mean()), 4) == -0.1991 and round(float(__import__('numpy').random.default_rng(7).normal(size=5).mean()), 4) == -0.2639"
    steps:
      - show: |
          <p>Sáu tháng sau, sếp hỏi lại con số trong báo cáo. Bạn chạy lại sổ tay phân tích (tệp chứa mã và kết quả, chạy theo từng ô): ra số khác. Dữ liệu đã bị ai đó cập nhật, thư viện đã lên phiên bản mới, và đoạn chọn mẫu ngẫu nhiên không cố định hạt giống.</p>
          <div class="box key">Hôm nay: <b>phân tích tái lập được</b>, và <b>báo cáo</b> sao cho người đọc hiểu đúng điều bạn biết và chưa biết.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, sáu tháng sau, sếp hỏi lại con số trong báo cáo. Bạn chạy lại sổ tay phân tích, tức tệp chứa mã và kết quả chạy theo từng ô, và ra một số khác. Dữ liệu đã bị ai đó cập nhật, thư viện đã lên phiên bản mới, và đoạn chọn mẫu ngẫu nhiên không cố định hạt giống. Hôm nay ta học cách làm phân tích tái lập được, và cách báo cáo sao cho người đọc hiểu đúng điều bạn biết và điều bạn chưa biết."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: điểm phần trăm, sai số chuẩn, khoảng tin cậy"
    checks:
      - "round(11.2 - 10.0, 1) == 1.2 and round((11.2 - 10.0) / 10.0 * 100) == 12"
      - "round(0.1 * 0.9 / 900, 10) == 0.0001 and round(math.sqrt(0.1 * 0.9 / 900), 10) == 0.01 and round(math.sqrt(0.1 * 0.9 / 3600), 10) == 0.005"
      - "round(math.sqrt(0.01 ** 2 + 0.01 ** 2), 4) == 0.0141"
    steps:
      - show: |
          <table class="t"><tr><th>10,0% → 11,2%</th><th>cách tính</th><th>kết quả</th></tr>
          <tr><td>hiệu, tính bằng <b>điểm phần trăm</b></td><td>$11{,}2 - 10{,}0$</td><td>1,2 điểm</td></tr>
          <tr><td>thay đổi <b>tương đối</b></td><td>$\frac{1{,}2}{10{,}0}$</td><td>12%</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bài này dùng hai phép tính. Từ 10 phẩy 0 lên 11 phẩy 2 phần trăm, hiệu là 1 phẩy 2 điểm phần trăm. Còn thay đổi tương đối là 1 phẩy 2 chia 10, tức 12 phần trăm, hai con số này khác nhau gấp mười lần."
      - clear: true
        show: |
          <p><b>Sai số chuẩn của một tỉ lệ</b>: đo tỉ lệ $p$ trên $n$ người thì kết quả dao động quanh tỉ lệ thật — một nhóm người khác cho số hơi khác. Sai số chuẩn là mức dao động điển hình đó:</p>
          $$\sqrt{\frac{p \cdot (1 - p)}{n}}, \quad \text{ví dụ } p = 0{,}1,\ n = 900:\ \sqrt{\frac{0{,}1 \cdot 0{,}9}{900}} = \sqrt{0{,}0001} = 0{,}01 = 1\%$$
          <p class="note">Số người gấp 4 thì sai số chuẩn chỉ còn một nửa: $n$ nằm dưới dấu căn.</p>
        focus: [1, 1, 1, 2, 3]
        say: "Phép thứ hai là sai số chuẩn, ta nhắc lại từ đầu. Đo một tỉ lệ p trên n người thì kết quả dao động quanh tỉ lệ thật, vì một nhóm người khác sẽ cho con số hơi khác. Sai số chuẩn là mức dao động điển hình đó. Công thức là căn của p nhân 1 trừ p, chia n, ví dụ p bằng 0 phẩy 1 và n bằng 900 thì được căn của 0 phẩy 0001, tức 0 phẩy 01, hay 1 phần trăm. Vì n nằm dưới dấu căn, số người gấp 4 thì sai số chuẩn chỉ còn một nửa."
      - clear: true
        show: |
          <p><b>Sai số chuẩn của hiệu</b> hai tỉ lệ đo trên hai nhóm độc lập: bình phương hai sai số chuẩn cộng lại, rồi lấy căn. Ví dụ mỗi tỉ lệ có sai số chuẩn 1%:</p>
          $$\sqrt{0{,}01^2 + 0{,}01^2} \approx 0{,}0141 = 1{,}41\%$$
          <p class="note">Nhỏ hơn 2% vì hai sai lệch ngẫu nhiên thường không cùng chiều, một phần bù trừ nhau. <b>Khoảng tin cậy 95%</b> = ước lượng ± 1,96 sai số chuẩn: khi mẫu đủ lớn, ước lượng dao động theo hình chuông và khoảng 95% số lần nằm trong 1,96 sai số chuẩn quanh giá trị thật.</p>
        focus: [1, 2, 2, 3, 3]
        say: "Khi so hai nhóm độc lập, hiệu hai tỉ lệ dao động theo cả hai nguồn, nên ta cộng bình phương hai sai số chuẩn rồi lấy căn. Ví dụ mỗi tỉ lệ có sai số chuẩn 1 phần trăm, thì hiệu có sai số chuẩn căn của 0 phẩy 0001 cộng 0 phẩy 0001. Kết quả khoảng 1 phẩy 41 phần trăm, lớn hơn từng cái nhưng nhỏ hơn tổng của chúng, vì hai sai lệch ngẫu nhiên thường không cùng chiều. Cuối cùng, khoảng tin cậy 95 phần trăm là ước lượng cộng trừ 1 phẩy 96 sai số chuẩn. Lý do là khi mẫu đủ lớn, ước lượng dao động theo hình chuông, và khoảng 95 phần trăm số lần nằm trong 1 phẩy 96 sai số chuẩn quanh giá trị thật."

  - id: sym
    kind: symbol
    title: "Giải mã: bốn thứ phải ghim lại"
    steps:
      - show: |
          <table class="t"><tr><th>ghim</th><th>cách làm</th></tr>
          <tr><td>mã</td><td><b>quản lý phiên bản</b> (công cụ như Git lưu mọi lần sửa mã, mỗi lần một mã phiên bản riêng); ghi mã phiên bản vào báo cáo</td></tr>
          <tr><td>dữ liệu</td><td>bản chụp không đổi, kèm <b>mã băm</b> (chuỗi ngắn tính từ nội dung tệp; sửa một chữ là chuỗi đổi) hoặc ngày lấy</td></tr>
          <tr><td>môi trường</td><td>danh sách thư viện kèm <b>phiên bản chính xác</b></td></tr>
          <tr><td>ngẫu nhiên</td><td>cố định <b>hạt giống</b> (số khởi đầu của bộ sinh số ngẫu nhiên): cùng hạt giống 42, cùng phiên bản thư viện → cùng dãy số</td></tr></table>
          <div class="box key">Mục tiêu: <b>một lệnh</b> chạy từ dữ liệu thô tới bảng, hình trong báo cáo — trên máy người khác.</div>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Có bốn thứ phải ghim lại. Mã, bằng một công cụ quản lý phiên bản, tức công cụ lưu lại mọi lần sửa mã và gắn cho mỗi lần một mã phiên bản riêng, rồi ghi mã đó vào báo cáo. Dữ liệu, bằng một bản chụp không đổi kèm mã băm hoặc ngày lấy, mã băm là chuỗi ngắn tính từ nội dung tệp, sửa một chữ là chuỗi đổi. Môi trường, bằng danh sách thư viện kèm phiên bản chính xác. Và tính ngẫu nhiên, bằng cách cố định hạt giống, tức số khởi đầu của bộ sinh số ngẫu nhiên, cùng hạt giống 42 trên cùng phiên bản thư viện thì cho cùng một dãy số. Mục tiêu là một lệnh duy nhất chạy từ dữ liệu thô tới bảng và hình trong báo cáo, trên máy của người khác."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một đường ống, bốn cái chốt"
    checks:
      - "{round(float(__import__('numpy').random.default_rng(s).normal(size=5).mean()), 4) for s in (42, 42)} == {-0.1991} and round(float(__import__('numpy').random.default_rng(7).normal(size=5).mean()), 4) == -0.2639"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><g fill="#1f2937" font-size="22"><rect x="40" y="60" width="210" height="90" rx="10" fill="#dbeafe"/><text x="145" y="98" text-anchor="middle" font-size="24">dữ liệu thô</text><text x="145" y="130" text-anchor="middle" font-size="19" fill="#2a78d6">bản chụp + mã băm</text><line x1="252" y1="105" x2="286" y2="105" stroke="#6b7280" stroke-width="3"/><rect x="290" y="60" width="210" height="90" rx="10" fill="#dbeafe"/><text x="395" y="98" text-anchor="middle" font-size="24">mã</text><text x="395" y="130" text-anchor="middle" font-size="19" fill="#2a78d6">phiên bản</text><line x1="502" y1="105" x2="536" y2="105" stroke="#6b7280" stroke-width="3"/><rect x="540" y="60" width="210" height="90" rx="10" fill="#dbeafe"/><text x="645" y="98" text-anchor="middle" font-size="24">môi trường</text><text x="645" y="130" text-anchor="middle" font-size="19" fill="#2a78d6">phiên bản thư viện</text><line x1="752" y1="105" x2="786" y2="105" stroke="#6b7280" stroke-width="3"/><rect x="790" y="60" width="210" height="90" rx="10" fill="#dbeafe"/><text x="895" y="98" text-anchor="middle" font-size="24">hạt giống</text><text x="895" y="130" text-anchor="middle" font-size="19" fill="#2a78d6">42</text><line x1="1002" y1="105" x2="1060" y2="105" stroke="#059669" stroke-width="4"/><polygon points="1070,105 1056,96 1056,114" fill="#059669"/><rect x="1075" y="60" width="380" height="90" rx="10" fill="#d1fae5"/><text x="1265" y="98" text-anchor="middle" font-size="24">bảng, hình trong báo cáo</text><text x="1265" y="130" text-anchor="middle" font-size="19" fill="#059669">một lệnh, trên máy người khác</text><text x="40" y="225" font-size="22">hạt giống 42, lần chạy 1: trung bình 5 số ngẫu nhiên</text><text x="620" y="225" font-size="24" fill="#059669">−0,1991</text><text x="40" y="275" font-size="22">hạt giống 42, lần chạy 2: trung bình 5 số ngẫu nhiên</text><text x="620" y="275" font-size="24" fill="#059669">−0,1991</text><text x="40" y="325" font-size="22">hạt giống 7: trung bình 5 số ngẫu nhiên</text><text x="620" y="325" font-size="24" fill="#b91c1c">−0,2639</text><text x="760" y="275" font-size="21">cùng hạt giống: cùng số đến từng chữ số</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình trên vẽ phân tích như một đường ống, đi từ dữ liệu thô, qua mã, môi trường, và hạt giống, tới bảng và hình trong báo cáo. Mỗi hộp là một cái chốt phải ghim lại, thiếu một cái là người khác chạy lại sẽ ra số khác. Hình dưới là phép thử thật với thư viện tính toán, lấy trung bình 5 số ngẫu nhiên. Hai lần chạy với hạt giống 42 cho cùng âm 0 phẩy 1991 đến từng chữ số, còn đổi sang hạt giống 7 thì ra âm 0 phẩy 2639."

  - id: example
    kind: example
    title: "Viết một câu kết luận đúng"
    checks:
      - "(lambda p1, p2, n: (lambda se: (round((p2 - p1) * 100, 1), round((p2 - p1 - 1.96 * se) * 100, 1), round((p2 - p1 + 1.96 * se) * 100, 1)))(math.sqrt(p1 * (1 - p1) / n + p2 * (1 - p2) / n)))(0.100, 0.112, 15000) == (1.2, 0.5, 1.9)"
    steps:
      - show: |
          <p><b>Bước 1</b> — thử nghiệm hai nhóm, mỗi nhóm 15 000 người: tỉ lệ mua 10,0% và 11,2%. Hiệu: 1,2 điểm phần trăm.</p>
        say: "Xét thử nghiệm hai nhóm, mỗi nhóm mười lăm nghìn người, tỉ lệ mua là 10 phẩy 0 và 11 phẩy 2 phần trăm. Bước một, hiệu là 1 phẩy 2 điểm phần trăm."
      - show: |
          <p><b>Bước 2</b> — sai số chuẩn của hiệu:</p>
          $$\sqrt{\frac{0{,}1 \cdot 0{,}9}{15\,000} + \frac{0{,}112 \cdot 0{,}888}{15\,000}} \approx 0{,}36 \text{ điểm phần trăm}$$
        introduces: [power]
        focus: [1, 2]
        say: "Bước hai, sai số chuẩn của hiệu là căn của tổng hai phần, mỗi phần là p nhân 1 trừ p chia mười lăm nghìn. Kết quả khoảng 0 phẩy 36 điểm phần trăm."
      - show: |
          <p><b>Bước 3</b> — khoảng 95%: $1{,}2 \pm 1{,}96 \cdot 0{,}36 \approx 1{,}2 \pm 0{,}7 = [\hl{0{,}5};\ \hl{1{,}9}]$.</p>
        say: "Bước ba, khoảng tin cậy 95 phần trăm là 1 phẩy 2 cộng trừ 1 phẩy 96 nhân 0 phẩy 36, tức cộng trừ khoảng 0 phẩy 7. Vậy khoảng đi từ 0 phẩy 5 tới 1 phẩy 9."
      - clear: true
        show: |
          <table class="t"><tr><th>viết kém</th><th>viết tốt</th></tr>
          <tr><td>“Nút mới tăng doanh số <b>đáng kể</b>.”</td><td>“Nút mới tăng tỉ lệ mua thêm <b>1,2 điểm phần trăm</b> (10,0% → 11,2%), khoảng tin cậy 95% $[\hl{0{,}5};\ \hl{1{,}9}]$, $n = 15\,000$ mỗi nhóm, thử nghiệm ngẫu nhiên 2 tuần.”</td></tr></table>
          <p><b>Bước 4</b> — viết câu kết luận từ các số vừa tính.</p>
        focus: [2, "1.2", "1.2", "1.2"]
        say: "Bước bốn, viết câu kết luận từ các số vừa tính. Câu viết kém là nút mới tăng doanh số đáng kể. Câu viết tốt là nút mới tăng tỉ lệ mua thêm 1 phẩy 2 điểm phần trăm, khoảng tin cậy 95 phần trăm từ 0 phẩy 5 tới 1 phẩy 9. Kèm theo là cỡ mẫu mười lăm nghìn người mỗi nhóm, trong thử nghiệm ngẫu nhiên 2 tuần."
      - show: |
          <div class="box key"><b>Bước 5</b> — câu tốt có: độ lớn (đơn vị rõ), độ không chắc chắn, cỡ mẫu, thiết kế — người đọc tự đánh giá được.</div>
        say: "Bước năm, kiểm câu vừa viết. Câu tốt có độ lớn với đơn vị rõ, độ không chắc chắn, cỡ mẫu, và thiết kế, để người đọc tự đánh giá được."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "(lambda rng: [round(float(x), 1) for x in __import__('numpy').percentile((rng.binomial(15000, 0.112, 100000) - rng.binomial(15000, 0.1, 100000)) / 150, [2.5, 97.5])])(__import__('numpy').random.default_rng(1)) == [0.5, 1.9]"
      - "round(1.96 * math.sqrt((0.1 * 0.9 + 0.112 * 0.888) / 15000) * 100, 1) == 0.7"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>khoảng $[0{,}5;\ 1{,}9]$</td><td>máy giả lập 100 000 lần thử nghiệm với tỉ lệ thật 10,0% và 11,2%, mỗi nhóm 15 000 người, lấy khoảng chứa 95% các hiệu ở giữa</td><td>0,5 tới 1,9 ✓</td></tr>
          <tr><td>tái lập được</td><td>phép giả lập trên dùng hạt giống cố định 1: ai chạy lại cũng ra đúng 0,5 và 1,9</td><td>✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3"]
        say: "Kiểm bằng đường khác, không dùng công thức. Cho máy giả lập một trăm nghìn lần thử nghiệm, với tỉ lệ thật 10 phẩy 0 và 11 phẩy 2 phần trăm, mỗi nhóm mười lăm nghìn người. Lấy khoảng chứa 95 phần trăm các hiệu ở giữa, được từ 0 phẩy 5 tới 1 phẩy 9, khớp với công thức. Phép giả lập này dùng hạt giống cố định, nên ai chạy lại cũng ra đúng hai con số đó, chính là điều bài này dạy."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "[round((p + s * 1.96 * math.sqrt(p * (1 - p) / 8000)) * 100, 2) for p in (0.1, 0.112) for s in (-1, 1)] == [9.34, 10.66, 10.51, 11.89]"
      - "[round((0.012 + s * 1.96 * math.sqrt((0.1 * 0.9 + 0.112 * 0.888) / 8000)) * 100, 2) for s in (-1, 1)] == [0.25, 2.15]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Sổ tay chạy ô theo thứ tự tuỳ ý <b class="red">(không tái lập)</b>
          <br><span class="note">Kết quả phụ thuộc thứ tự bạn đã bấm. Trước khi báo cáo: khởi động lại, chạy từ đầu tới cuối một lượt.</span></div>
        say: "Lỗi thứ nhất, chạy các ô của sổ tay theo thứ tự tuỳ ý. Kết quả phụ thuộc thứ tự bạn đã bấm, nên trước khi báo cáo, hãy khởi động lại và chạy từ đầu tới cuối một lượt."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhầm “điểm phần trăm” với “phần trăm” <b class="red">(sai gấp mười)</b>
          <br><span class="note">10% → 11,2% là tăng 1,2 <b>điểm phần trăm</b>, hay tăng 12% <b>tương đối</b>. Viết rõ là loại nào.</span></div>
        say: "Lỗi thứ hai, nhầm điểm phần trăm với phần trăm. Từ 10 lên 11 phẩy 2 phần trăm là tăng 1 phẩy 2 điểm phần trăm, hay tăng 12 phần trăm tương đối, nên phải viết rõ là loại nào."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Kết luận rộng hơn bằng chứng <b class="red">(quá đà)</b>
          <br><span class="note">Thử 2 tuần trên khách ở Hà Nội không nói gì chắc chắn về cả năm, cả nước. Ghi rõ phạm vi và giả định.</span></div>
        say: "Lỗi thứ ba, kết luận rộng hơn bằng chứng. Thử 2 tuần trên khách ở Hà Nội không nói gì chắc chắn về cả năm hay cả nước, nên hãy ghi rõ phạm vi và các giả định."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Nhìn hai khoảng tin cậy chồng nhau rồi kết luận “không khác biệt” <b class="red">(bỏ lỡ kết quả thật)</b></div>
          <table class="t"><tr><th>số minh hoạ: mỗi nhóm 8000 người</th><th>khoảng 95%</th></tr>
          <tr><td>nhóm cũ 10,0%</td><td>9,34% tới 10,66%</td></tr>
          <tr><td>nhóm mới 11,2%</td><td>10,51% tới 11,89% — chồng lên khoảng trên</td></tr>
          <tr><td><b>hiệu</b> 1,2 điểm</td><td><b>0,25 tới 2,15 điểm</b> — không chứa 0</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là nhìn hai khoảng tin cậy chồng lên nhau rồi kết luận không có khác biệt. Với số minh hoạ, mỗi nhóm tám nghìn người, nhóm cũ 10 phần trăm có khoảng từ 9 phẩy 34 tới 10 phẩy 66. Nhóm mới 11 phẩy 2 phần trăm có khoảng từ 10 phẩy 51 tới 11 phẩy 89, chồng lên khoảng trên. Nhưng khoảng của chính hiệu là từ 0 phẩy 25 tới 2 phẩy 15 điểm, không chứa 0, vì sai số của hiệu nhỏ hơn tổng hai sai số. Người làm nghề luôn tính khoảng tin cậy cho đúng đại lượng mình kết luận, ở đây là hiệu."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round((0.055 - 0.050) * 100, 1) == 0.5 and round((0.055 / 0.050 - 1) * 100) == 10 and round(0.5 / 5.0, 2) == 0.1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tỉ lệ nhấp tăng từ 5,0% lên 5,5%: tăng bao nhiêu điểm phần trăm? Bao nhiêu phần trăm tương đối?</td></tr>
          <tr><td>2</td><td>Kể bốn thứ cần ghim để người khác tái lập được phân tích của bạn.</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tỉ lệ nhấp tăng từ 5 phẩy 0 lên 5 phẩy 5 phần trăm, tăng bao nhiêu điểm phần trăm? Bao nhiêu phần trăm tương đối? Câu hai, kể bốn thứ cần ghim để người khác tái lập được phân tích của bạn. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Bước 1: hiệu $5{,}5 - 5{,}0 = \hl{0{,}5}$ điểm phần trăm. Bước 2: tương đối $\frac{0{,}5}{5{,}0} = \hl{10\%}$.</p>
        say: "Đáp án câu một, bước một, hiệu là 5 phẩy 5 trừ 5 phẩy 0, bằng 0 phẩy 5 điểm phần trăm. Bước hai, chia hiệu cho mức cũ, 0 phẩy 5 chia 5, được 10 phần trăm tương đối."
      - show: |
          <table class="t"><tr><th>② ghim</th><th>vì thiếu nó thì</th></tr>
          <tr><td>mã (phiên bản)</td><td>không biết đã chạy đoạn mã nào</td></tr>
          <tr><td>dữ liệu (bản chụp)</td><td>dữ liệu bị cập nhật, số đổi</td></tr>
          <tr><td>môi trường (phiên bản thư viện)</td><td>thư viện mới tính khác</td></tr>
          <tr><td>hạt giống ngẫu nhiên</td><td>mỗi lần chạy ra mẫu khác</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Câu hai, bốn thứ cần ghim, mỗi thứ chặn một nguyên nhân làm số đổi. Phiên bản mã, vì thiếu nó thì không biết đã chạy đoạn mã nào. Bản chụp dữ liệu, vì dữ liệu có thể bị cập nhật. Phiên bản thư viện, vì thư viện mới có thể tính khác. Và hạt giống ngẫu nhiên, vì thiếu nó thì mỗi lần chạy ra một mẫu khác, đúng như câu chuyện mở đầu bài."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
