id: L04
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 4 — Thống kê mô tả bền vững: trung vị, khoảng tứ phân vị, ngoại lai"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L04; audit/dsc/verify_dsc.py L04; J. W. Tukey, Exploratory Data Analysis (1977); P. J. Huber, Robust Statistics (1981); CS115 bài 44"
assumes: [arith, frac, cdot]
# Quy ước: tứ phân vị Q1, Q3 tính theo nội suy tuyến tính (cách mặc định của numpy.percentile, alg.quartiles) — sách khác có thể dùng cách
#   khác, cho số lệch chút ít. Khoảng tứ phân vị IQR = Q3 − Q1; rào Tukey: [Q1 − 1,5·IQR, Q3 + 1,5·IQR] (alg.iqr_outliers).
objectives:
  - "So sánh trung bình và trung vị khi có ngoại lai"
  - "Tính khoảng tứ phân vị và rào Tukey"
  - "Xử lý ngoại lai đúng cách"
asr_reviewed:
  - {sentence: "Rào Tukey đi từ Q1 trừ 1 phẩy 5 lần khoảng tứ phân vị, tới Q3 cộng 1 phẩy 5 lần, tức từ âm 1 tới 7.", reason: "ASR chép “Rào tu kỳ đi từ quy mục trừ 1,5 lần … tới quy 3 cộng 1,5 lần, thức từ âm 1 tới 7”: Tukey đọc theo lexicon và ASR viết “tu kỳ”, Q đọc tên chữ cái “quy”, “một” → “mục”, tức/thức; các số 1,5, âm 1, 7 chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Rào Tukey đánh dấu để xem, và với mỗi ngoại lai, hãy hỏi đó là lỗi hay là một phát hiện.", reason: "ASR chép “Rào Tuki … mỗi ngoại like”: Tukey được viết “Tuki” (đúng âm), “lai” → “like” do ASR chen từ tiếng Anh; câu còn lại đúng (0,905) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, với Q1 bằng 5 phẩy 5 và Q3 bằng 8 phẩy 75, rào Tukey là gì?", reason: "ASR chép “với quy 1 bằng 5,5 và quy 3 bằng 8,75, rào Tu Ky là gì”: Q đọc tên chữ cái “quy”, Tukey viết “Tu Ky” (đúng âm); các số chép đúng — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lương trung bình của phòng tăng gấp mười"
    checks:
      - "sum([1, 2, 3, 4, 100]) / 5 == 22 and alg.median([1, 2, 3, 4, 100]) == 3"
    steps:
      - show: |
          <p>Năm người có thu nhập 1, 2, 3, 4 và 100 (đơn vị nghìn đô). Trung bình: $\hl{22}$ — không ai trong phòng có thu nhập gần 22. Trung vị: $\hl{3}$.</p>
          <div class="box key">Hôm nay: <b>thống kê bền vững</b> — những con số không bị một giá trị cực đoan kéo lệch.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, năm người có thu nhập 1, 2, 3, 4 và 100, đơn vị nghìn đô. Trung bình là 22, mà không ai trong phòng có thu nhập gần 22. Trung vị thì là 3. Hôm nay ta học thống kê bền vững, những con số không bị một giá trị cực đoan kéo lệch."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: trung bình, sắp xếp, và đi một phần quãng đường"
    checks:
      - "sum([1, 2, 3, 4, 100]) == 110 and 110 / 5 == 22 and sorted([4, 100, 1, 3, 2]) == [1, 2, 3, 4, 100]"
      - "0.25 * (6 - 1) == 1.25 and 5 + 0.25 * (7 - 5) == 5.5"
    steps:
      - show: |
          <p><b>Trung bình</b>: $\frac{1 + 2 + 3 + 4 + 100}{5} = \frac{110}{5} = 22$. <b>Sắp tăng</b>: 4, 100, 1, 3, 2 → 1, 2, 3, 4, 100; đánh số vị trí từ 0: vị trí 0 là 1, vị trí 4 là 100.</p>
        focus: [1, 1, 1, 1]
        say: "Bài này cần ba phép quen thuộc. Trung bình của 1, 2, 3, 4, 100 là 110 chia 5, bằng 22. Sắp tăng là xếp lại từ nhỏ tới lớn, 4, 100, 1, 3, 2 thành 1, 2, 3, 4, 100. Ta đánh số vị trí từ 0, nên vị trí 0 là số 1, vị trí 4 là số 100."
      - show: |
          <p><b>Đi một phần quãng đường</b> (nội suy tuyến tính): vị trí 1,25 nằm giữa vị trí 1 và 2. Với dãy 3, 5, 7, 8, 9, 40: vị trí 1 là 5, vị trí 2 là 7.</p>
          $$5 + 0{,}25 \cdot (7 - 5) = 5{,}5$$
        focus: [1, 1, 2]
        say: "Phép thứ ba là đi một phần quãng đường, gọi là nội suy tuyến tính. Với dãy 3, 5, 7, 8, 9, 40, vị trí 1 là số 5, vị trí 2 là số 7, và vị trí 1 phẩy 25 nằm giữa hai chỗ đó. Ta đi từ 5 thêm một phần tư quãng đường tới 7, tức 5 cộng 0 phẩy 25 nhân 2, bằng 5 phẩy 5."

  - id: sym
    kind: symbol
    title: "Giải mã: trung vị, tứ phân vị"
    steps:
      - show: |
          <p><b>Trung vị</b>: giá trị đứng giữa khi sắp tăng (số phần tử chẵn thì lấy trung bình hai giá trị giữa).</p>
          <p><b>Tứ phân vị</b> Q1, Q3: điểm cắt 25% và 75% dữ liệu. <b>Khoảng tứ phân vị</b> IQR = Q3 − Q1: độ trải của nửa giữa.</p>
          <div class="box key">Đổi giá trị lớn nhất từ 100 thành 1000: trung bình nhảy từ 22 lên 202, trung vị vẫn 3. Trung bình hỏng chỉ vì <b>một</b> giá trị; trung vị chịu được tới gần một nửa dữ liệu bị sai.</div>
        focus: [1, 2, 2, 3, 3]
        say: "Trung vị là giá trị đứng giữa khi sắp tăng, nếu số phần tử chẵn thì lấy trung bình hai giá trị giữa. Tứ phân vị Q1 và Q3 là các điểm cắt 25 và 75 phần trăm dữ liệu. Khoảng tứ phân vị là Q3 trừ Q1, đo độ trải của nửa giữa. Đổi giá trị lớn nhất từ 100 thành 1000, trung bình nhảy từ 22 lên 202, còn trung vị vẫn là 3. Trung bình hỏng chỉ vì một giá trị, còn trung vị chịu được tới gần một nửa dữ liệu bị sai."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một điểm xa kéo trung bình, không kéo được trung vị"
    checks:
      - "sum([1, 2, 3, 4, 50]) / 5 == 12 and alg.median([1, 2, 3, 4, 50]) == 3 and alg.iqr_outliers([1, 2, 3, 4, 50])[1] == (-1.0, 7.0)"
    steps:
      - show: |
          <div><svg width="1500" height="350" viewBox="0 0 1500 350"><g fill="#1f2937" font-size="22"><rect x="294" y="60" width="88" height="60" fill="#d1fae5"/><line x1="250" y1="90" x2="1460" y2="90" stroke="#6b7280" stroke-width="2"/><circle cx="316" cy="90" r="10" fill="#2a78d6"/><circle cx="327" cy="90" r="10" fill="#2a78d6"/><circle cx="338" cy="90" r="10" fill="#2a78d6"/><circle cx="349" cy="90" r="10" fill="#2a78d6"/><circle cx="1405" cy="90" r="10" fill="#2a78d6"/><polygon points="547,104 535,128 559,128" fill="#eb6834"/><text x="547" y="156" text-anchor="middle" fill="#eb6834">trung bình 22</text><polygon points="338,76 326,52 350,52" fill="#059669"/><text x="358" y="60" fill="#059669">trung vị 3</text><text x="1405" y="68" text-anchor="middle">100</text><rect x="294" y="220" width="88" height="60" fill="#d1fae5"/><line x1="250" y1="250" x2="1460" y2="250" stroke="#6b7280" stroke-width="2"/><circle cx="316" cy="250" r="10" fill="#2a78d6"/><circle cx="327" cy="250" r="10" fill="#2a78d6"/><circle cx="338" cy="250" r="10" fill="#2a78d6"/><circle cx="349" cy="250" r="10" fill="#2a78d6"/><circle cx="855" cy="250" r="10" fill="#2a78d6"/><polygon points="437,264 425,288 449,288" fill="#eb6834"/><text x="437" y="316" text-anchor="middle" fill="#eb6834">trung bình 12</text><polygon points="338,236 326,212 350,212" fill="#059669"/><text x="358" y="220" fill="#059669">trung vị 3</text><text x="855" y="228" text-anchor="middle">50</text><text x="20" y="98" font-size="20" fill="#059669">rào −1 tới 7</text><text x="20" y="258" font-size="20" fill="#059669">rào −1 tới 7</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ hai dãy trên cùng một trục. Hàng trên là 1, 2, 3, 4 và 100, tam giác cam là trung bình 22, bị điểm xa kéo ra giữa khoảng trống, chỗ không có ai. Hàng dưới chỉ đổi 100 thành 50, trung bình lùi về 12, còn tam giác lục là trung vị thì đứng yên ở 3 trong cả hai hàng. Dải xanh nhạt là rào từ âm 1 tới 7, cũng không nhúc nhích, vì nó chỉ dựa vào nửa giữa của dữ liệu."

  - id: example
    kind: example
    title: "Rào Tukey tìm ngoại lai"
    checks:
      - "alg.quartiles([1, 2, 3, 4, 100]) == (2.0, 4.0) and alg.iqr_outliers([1, 2, 3, 4, 100]) == ([100], (-1.0, 7.0))"
      - "sum([1, 2, 3, 4, 1000]) / 5 == 202 and alg.median([1, 2, 3, 4, 1000]) == 3"
    steps:
      - show: |
          <p>Dữ liệu 1, 2, 3, 4, 100 (đã sắp tăng, 5 số).</p>
          <p><b>Bước 1</b> — trung vị: số đứng giữa, vị trí $0{,}5 \cdot 4 = 2$ → $\hl{3}$.</p>
        focus: [1, 2]
        say: "Lấy dữ liệu 1, 2, 3, 4, 100, đã sắp tăng, gồm 5 số. Bước một, trung vị là số đứng giữa, ở vị trí 0 phẩy 5 nhân 4 bằng 2, tức số 3."
      - show: |
          <p><b>Bước 2</b> — Q1 ở vị trí $0{,}25 \cdot 4 = 1$ → 2; Q3 ở vị trí $0{,}75 \cdot 4 = 3$ → 4. IQR $= 4 - 2 = 2$.</p>
        say: "Bước hai, Q1 ở vị trí 0 phẩy 25 nhân 4 bằng 1, tức số 2. Q3 ở vị trí 0 phẩy 75 nhân 4 bằng 3, tức số 4. Vậy khoảng tứ phân vị bằng 4 trừ 2, bằng 2."
      - show: |
          <p><b>Bước 3</b> — rào Tukey: $[\,Q_1 - 1{,}5 \cdot \text{IQR},\ Q_3 + 1{,}5 \cdot \text{IQR}\,] = [2 - 3;\ 4 + 3] = [-1;\ 7]$.</p>
        introduces: [sub]
        focus: [1, 1]
        say: "Bước ba, 1 phẩy 5 lần khoảng tứ phân vị là 3. Rào Tukey đi từ Q1 trừ 1 phẩy 5 lần khoảng tứ phân vị, tới Q3 cộng 1 phẩy 5 lần, tức từ âm 1 tới 7."
      - clear: true
        show: |
          <table class="t"><tr><th>giá trị</th><th>1</th><th>2</th><th>3</th><th>4</th><th>100</th></tr>
          <tr><td>trong rào $[-1;\ 7]$?</td><td>có</td><td>có</td><td>có</td><td>có</td><td><b class="red">không</b></td></tr></table>
          <p><b>Bước 4</b> — giá trị nằm ngoài rào: $\hl{100}$ — đáng xem lại.</p>
          <p class="note">Rào chỉ <b>đánh dấu để xem</b>, không tự động xoá. Q1, Q3 có vài cách tính; ở đây dùng nội suy tuyến tính.</p>
        focus: [1, 2, 2, 3, 3]
        say: "Bước bốn, so từng giá trị với rào. Bốn số 1, 2, 3, 4 đều nằm trong rào. Giá trị nằm ngoài rào là 100, đáng được xem lại. Rào chỉ đánh dấu để xem, không tự động xoá. Q1 và Q3 có vài cách tính, ở đây dùng nội suy tuyến tính."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "alg.median([1, 2, 3]) == 2 == alg.quartiles([1, 2, 3, 4, 100])[0] and alg.median([3, 4, 100]) == 4 == alg.quartiles([1, 2, 3, 4, 100])[1]"
      - "sum(x < 3 for x in [1, 2, 3, 4, 100]) == 2 == sum(x > 3 for x in [1, 2, 3, 4, 100])"
      - "alg.median([1, 2, 3, 4, 1000000]) == 3 and alg.iqr_outliers([1, 2, 3, 4, 1000000])[1] == (-1.0, 7.0)"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>Q1 = 2, Q3 = 4</td><td>trung vị của nửa dưới 1, 2, 3 và của nửa trên 3, 4, 100</td><td>2 và 4 ✓</td></tr>
          <tr><td>trung vị 3</td><td>đếm: số giá trị nhỏ hơn 3 và lớn hơn 3</td><td>2 và 2, cân nhau ✓</td></tr>
          <tr><td>rào bền vững</td><td>đổi 100 thành 1 000 000 rồi tính lại</td><td>trung vị vẫn 3, rào vẫn −1 tới 7 ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác. Cách thứ nhất, lấy trung vị của nửa dưới 1, 2, 3 được 2, và của nửa trên 3, 4, 100 được 4, khớp với Q1 và Q3 tính bằng nội suy. Cách thứ hai, đếm thẳng, có 2 giá trị nhỏ hơn 3 và 2 giá trị lớn hơn 3, nên 3 đúng là điểm giữa. Cách thứ ba, đổi 100 thành một triệu rồi tính lại, trung vị vẫn là 3 và rào vẫn từ âm 1 tới 7, đúng như tính bền vững đã nói."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "alg.iqr_outliers([1, 2, 2, 3, 9]) == ([9], (0.5, 4.5)) and alg.iqr_outliers([8, 9, 10, 11, 12]) == ([], (6.0, 14.0))"
      - "alg.iqr_outliers([1, 2, 2, 3, 9, 8, 9, 10, 11, 12]) == ([], (-9.0, 21.0))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tự động xoá mọi ngoại lai <b class="red">(mất thông tin)</b>
          <br><span class="note">Ngoại lai có thể là lỗi nhập, cũng có thể là điều quan trọng nhất: một giao dịch gian lận, một máy sắp hỏng. Xem từng trường hợp, ghi lý do.</span></div>
        say: "Lỗi thứ nhất, tự động xoá mọi ngoại lai. Ngoại lai có thể là lỗi nhập, nhưng cũng có thể là điều quan trọng nhất, như một giao dịch gian lận hay một máy sắp hỏng. Hãy xem từng trường hợp và ghi lý do."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Báo trung bình cho dữ liệu lệch <b class="red">(gây hiểu nhầm)</b>
          <br><span class="note">Thu nhập, giá nhà, thời gian phản hồi thường lệch phải: báo trung vị và tứ phân vị (hoặc cả hai).</span></div>
        say: "Lỗi thứ hai, chỉ báo trung bình cho dữ liệu lệch. Thu nhập, giá nhà, thời gian phản hồi thường lệch về phía lớn, nên hãy báo trung vị và tứ phân vị, hoặc báo cả hai."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng độ lệch chuẩn để tìm ngoại lai trên mẫu nhỏ <b class="red">(tự che)</b>
          <br><span class="note">Chính ngoại lai làm độ lệch chuẩn phình to, nên nó trông “không xa lắm”. Rào dựa trên tứ phân vị không bị kéo như vậy.</span></div>
        say: "Lỗi thứ ba, dùng độ lệch chuẩn để tìm ngoại lai trên mẫu nhỏ. Chính ngoại lai làm độ lệch chuẩn phình to, nên nó trông như không xa lắm, còn rào dựa trên tứ phân vị không bị kéo như vậy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Đặt một rào chung cho dữ liệu gộp nhiều nhóm <b class="red">(che mất bất thường)</b></div>
          <table class="t"><tr><th>số ngày giao hàng (minh hoạ)</th><th>dữ liệu</th><th>rào</th><th>ngoài rào</th></tr>
          <tr><td>nội thành</td><td>1, 2, 2, 3, <b>9</b></td><td>0,5 tới 4,5</td><td><b>9</b></td></tr>
          <tr><td>liên tỉnh</td><td>8, 9, 10, 11, 12</td><td>6 tới 14</td><td>không có</td></tr>
          <tr><td>gộp cả hai</td><td>10 số trên</td><td>−9 tới 21</td><td>không có</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là đặt một rào chung cho dữ liệu gộp nhiều nhóm. Với số ngày giao hàng minh hoạ, nhóm nội thành 1, 2, 2, 3, 9 có rào từ 0 phẩy 5 tới 4 phẩy 5, nên đơn 9 ngày bị đánh dấu. Một đơn nội thành mất 9 ngày đúng là đáng được hỏi. Nhóm liên tỉnh 8 tới 12 ngày có rào từ 6 tới 14, không có gì lạ. Gộp cả hai nhóm thì rào phình ra từ âm 9 tới 21, và đơn 9 ngày lẫn vào đám đơn liên tỉnh, không còn ai thấy. Người làm nghề đặt rào trong từng nhóm có ý nghĩa, như loại đơn, khu vực, hay loại máy."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "sum([3, 5, 7, 8, 9, 40]) / 6 == 12 and alg.median([3, 5, 7, 8, 9, 40]) == 7.5"
      - "alg.quartiles([3, 5, 7, 8, 9, 40]) == (5.5, 8.75) and alg.iqr_outliers([3, 5, 7, 8, 9, 40]) == ([40], (0.625, 13.625))"
      - "sum([3, 5, 7, 8, 9, 40]) == 72 and 8.75 - 5.5 == 3.25 and 1.5 * 3.25 == 4.875"
    steps:
      - show: |
          <p>Dữ liệu: 3, 5, 7, 8, 9, 40.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Trung bình và trung vị?</td></tr>
          <tr><td>2</td><td>Với Q1 = 5,5, Q3 = 8,75: rào Tukey là gì? Giá trị nào ngoài rào?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm với dữ liệu 3, 5, 7, 8, 9, 40. Câu một, trung bình và trung vị là bao nhiêu? Câu hai, với Q1 bằng 5 phẩy 5 và Q3 bằng 8 phẩy 75, rào Tukey là gì? Giá trị nào nằm ngoài rào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Trung bình: $\frac{3 + 5 + 7 + 8 + 9 + 40}{6} = \frac{72}{6} = 12$.</p>
          <p>Trung vị: 6 số là số chẵn, lấy trung bình hai số giữa: $\frac{7 + 8}{2} = \hl{7{,}5}$.</p>
        focus: [1, 2]
        say: "Đáp án câu một, cộng sáu số được 72, chia 6 được trung bình 12. Có 6 số, là số chẵn, nên trung vị là trung bình của hai số giữa 7 và 8, bằng 7 phẩy 5."
      - show: |
          <p>② IQR $= 8{,}75 - 5{,}5 = 3{,}25$; $1{,}5 \cdot 3{,}25 = 4{,}875$.</p>
          <p>Rào $[5{,}5 - 4{,}875;\ 8{,}75 + 4{,}875] = [0{,}625;\ 13{,}625]$ → $\hl{40}$ ngoài rào.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Câu hai, khoảng tứ phân vị là 8 phẩy 75 trừ 5 phẩy 5, bằng 3 phẩy 25. Nhân 1 phẩy 5 được 4 phẩy 875. Đầu dưới của rào là 5 phẩy 5 trừ 4 phẩy 875, bằng 0 phẩy 625. Đầu trên là 8 phẩy 75 cộng 4 phẩy 875, bằng 13 phẩy 625. Vậy 40 nằm ngoài rào, và đó cũng là lý do trung bình 12 lớn hơn hẳn trung vị."

