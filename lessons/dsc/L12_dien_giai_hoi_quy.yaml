id: L12
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 12 — Diễn giải hồi quy: hệ số, đa cộng tuyến, khoảng tin cậy"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L12; audit/dsc/verify_dsc.py L12; A. Gelman, J. Hill, A. Vehtari, Regression and Other Stories (2020), chương 10–11; CS115 bài 18 (hồi quy tuyến tính bình phương tối thiểu)"
assumes: [arith, frac, approx, sqrt, power, pm, cdot, sub]
# Quy ước: hồi quy tuyến tính bình phương tối thiểu như CS115 bài 18. VIF của một biến khi chỉ có hai biến giải thích tương quan r: 1/(1 − r²)
#   (alg.vif_two); sai số chuẩn của hệ số phình √VIF lần. Mô phỏng đa cộng tuyến: alg.collinear_demo(seed=2) — 80 điểm, y = x1 + x2 + nhiễu,
#   khớp riêng trên hai nửa 40 điểm. Mọi số trong checks.
objectives:
  - "Đọc đúng một hệ số hồi quy"
  - "Nhận ra đa cộng tuyến và hậu quả của nó"
  - "Không đọc hệ số trên dữ liệu quan sát thành nhân quả"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng một mô hình, hai nửa dữ liệu, hai câu chuyện ngược nhau"
    checks:
      - "alg.collinear_demo(seed=2) == (0.92, (0.9, 1.39), (1.65, 0.38))"
    steps:
      - show: |
          <p>Dữ liệu sinh ra từ $y = x_1 + x_2 + \text{nhiễu}$, hai biến $x_1$, $x_2$ tương quan 0,92. Khớp hồi quy trên nửa đầu: $x_2$ “quan trọng hơn” (1,39 so với 0,90). Trên nửa sau: $x_1$ quan trọng hơn hẳn (1,65 so với 0,38).</p>
          <div class="box key">Hôm nay: <b>diễn giải hệ số hồi quy</b> — và khi nào hệ số không đáng tin.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, dữ liệu được sinh ra từ y bằng x 1 cộng x 2 cộng nhiễu, hai biến x 1 và x 2 tương quan 0 phẩy 92. Khớp hồi quy trên nửa đầu, x 2 có vẻ quan trọng hơn, 1 phẩy 39 so với 0 phẩy 90. Trên nửa sau, x 1 lại quan trọng hơn hẳn, 1 phẩy 65 so với 0 phẩy 38. Hôm nay ta học cách diễn giải hệ số hồi quy, và khi nào hệ số không đáng tin."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Nhắc lại từ đầu: hồi quy tuyến tính, sai số chuẩn, khoảng tin cậy"
    checks:
      - "(lambda X, Y: (sum((a - 2.5) * (b - 2.5) for a, b in zip(X, Y)), sum((a - 2.5) ** 2 for a in X)))([1, 2, 3, 4], [1, 3, 2, 4]) == (4.0, 5.0) and 4 / 5 == 0.8 and 2.5 - 0.8 * 2.5 == 0.5"
      - "[round(float(v), 9) for v in __import__('numpy').polyfit([1, 2, 3, 4], [1, 3, 2, 4], 1)] == [0.8, 0.5]"
      - "(1 + 2 * 4) - (1 + 2 * 3) == 2 and (1 + 2 * 3 + 3 * 1) - (1 + 2 * 2 + 3 * 1) == 2"
      - "round(3 - 1.96 * 1, 2) == 1.04 and round(3 + 1.96 * 1, 2) == 4.96"
    steps:
      - show: |
          <p><b>Hồi quy tuyến tính</b> tìm đường thẳng $y = b_0 + b_1 x$ đi <b>gần các điểm dữ liệu nhất</b>: tổng bình phương khoảng cách theo chiều dọc từ mỗi điểm tới đường là nhỏ nhất. $b_1$ là <b>hệ số</b> (độ dốc), $b_0$ là giá trị của $y$ khi $x = 0$.</p>
          <table class="t"><tr><th>bốn điểm (1, 1), (2, 3), (3, 2), (4, 4)</th><th>phép tính</th></tr>
          <tr><td>Bước 1. trung bình</td><td>trung bình $x$ = 2,5; trung bình $y$ = 2,5</td></tr>
          <tr><td>Bước 2. độ lệch (giá trị trừ trung bình)</td><td>$x$: −1,5; −0,5; 0,5; 1,5 — $y$: −1,5; 0,5; −0,5; 1,5</td></tr>
          <tr><td>Bước 3. $b_1 = \dfrac{\text{tổng tích độ lệch}}{\text{tổng bình phương độ lệch } x}$</td><td>$\dfrac{2{,}25 - 0{,}25 - 0{,}25 + 2{,}25}{5} = \dfrac{4}{5} = 0{,}8$</td></tr>
          <tr><td>Bước 4. $b_0$</td><td>$2{,}5 - 0{,}8 \cdot 2{,}5 = 0{,}5$ → $y = 0{,}5 + 0{,}8x$</td></tr></table>
        focus: [1, 1, 1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Trước hết, ta cần hiểu hồi quy tuyến tính là gì. Đó là cách tìm một đường thẳng, y bằng b 0 cộng b 1 nhân x, đi gần các điểm dữ liệu nhất. Gần nhất nghĩa là tổng bình phương khoảng cách theo chiều dọc từ mỗi điểm tới đường là nhỏ nhất. Ở đây b 1 là hệ số, cũng là độ dốc của đường, còn b 0 là giá trị của y khi x bằng 0. Làm thử với bốn điểm, bước một, trung bình của x là 2 phẩy 5, trung bình của y cũng là 2 phẩy 5. Bước hai, lấy mỗi giá trị trừ trung bình để được độ lệch. Bước ba, b 1 bằng tổng các tích độ lệch, là 4, chia tổng bình phương độ lệch của x, là 5, được 0 phẩy 8. Bước bốn, b 0 bằng 2 phẩy 5 trừ 0 phẩy 8 nhân 2 phẩy 5, bằng 0 phẩy 5, nên đường là y bằng 0 phẩy 5 cộng 0 phẩy 8 x."
      - clear: true
        show: |
          <p><b>Đọc hệ số</b>: ví dụ $y = 1 + 2x$: $x$ từ 3 lên 4 thì $y$ từ 7 lên 9, tăng đúng $b_1 = 2$.</p>
          <p>Hai biến: $y = 1 + 2x_1 + 3x_2$. Giữ $x_2 = 1$, cho $x_1$ từ 2 lên 3: $y$ từ 8 lên 10, vẫn tăng $2$.</p>
          <p class="note">Hệ số tương quan $r$ (bài 6) đo hai biến cùng tăng theo một đường thẳng chặt đến đâu, từ −1 tới 1. Ở mở đầu $r = 0{,}92$: $x_1$ lớn thì $x_2$ gần như luôn lớn.</p>
        focus: [1, 1, 2, 2, 3, 3]
        say: "Hệ số cho biết y đổi bao nhiêu khi x tăng 1. Ví dụ y bằng 1 cộng 2 x, khi x tăng từ 3 lên 4 thì y tăng từ 7 lên 9, đúng bằng b 1 là 2. Với hai biến, y bằng 1 cộng 2 x 1 cộng 3 x 2. Giữ x 2 bằng 1, cho x 1 tăng từ 2 lên 3, y tăng từ 8 lên 10, vẫn tăng 2. Nhắc lại từ bài 6, hệ số tương quan r đo hai biến cùng tăng theo một đường thẳng chặt đến đâu, nằm từ âm 1 tới 1. Ở ví dụ mở đầu, r bằng 0 phẩy 92, nghĩa là x 1 lớn thì x 2 gần như luôn lớn."
      - clear: true
        show: |
          <p><b>Sai số chuẩn</b> (SE): hệ số tính từ <b>một</b> mẫu dữ liệu. Thu một mẫu khác cùng cỡ thì hệ số ra hơi khác; SE là mức chênh điển hình đó. Nhiều dữ liệu, ít nhiễu thì SE nhỏ.</p>
          <p><b>Khoảng tin cậy 95%</b>: khi mẫu đủ lớn, hệ số tính được dao động theo hình chuông quanh giá trị thật, và khoảng 95% số lần nằm trong 1,96 SE. Ví dụ $b = 3$, SE $= 1$:</p>
          $$3 \pm 1{,}96 \cdot 1 = [1{,}04;\ 4{,}96] \quad \text{không chứa 0}$$
        focus: [1, 1, 2, 2, 3, 3]
        say: "Tiếp theo là sai số chuẩn, hệ số được tính từ một mẫu dữ liệu, thu một mẫu khác cùng cỡ thì hệ số sẽ ra hơi khác, và sai số chuẩn là mức chênh điển hình đó. Nhiều dữ liệu và ít nhiễu thì sai số chuẩn nhỏ. Khi mẫu đủ lớn, hệ số tính được dao động theo hình chuông quanh giá trị thật, và khoảng 95 phần trăm số lần nằm trong 1 phẩy 96 sai số chuẩn. Vì vậy khoảng tin cậy 95 phần trăm là hệ số cộng trừ 1 phẩy 96 sai số chuẩn. Ví dụ hệ số bằng 3 với sai số chuẩn bằng 1, khoảng là 3 cộng trừ 1 phẩy 96, tức từ 1 phẩy 04 tới 4 phẩy 96. Khoảng không chứa 0, nên ta khá chắc hệ số dương."

  - id: sym
    kind: symbol
    title: "Giải mã: một hệ số nói gì"
    steps:
      - show: |
          <p>Hệ số $b_1$ của $x_1$: khi $x_1$ tăng 1 và <b>các biến khác giữ nguyên</b>, dự đoán $y$ thay đổi $b_1$.</p>
          <p>Khoảng tin cậy 95% của hệ số: $b_1 \pm 1{,}96 \cdot \text{SE}(b_1)$, với SE là sai số chuẩn vừa nhắc. Khoảng chứa 0 → dữ liệu chưa đủ để nói hướng ảnh hưởng.</p>
          <div class="box key">“Giữ các biến khác nguyên” khó làm khi $x_1$ và $x_2$ luôn đi cùng nhau: dữ liệu gần như không có cặp nào $x_1$ đổi mà $x_2$ đứng yên.</div>
        focus: [1, 2, 2, 3]
        say: "Hệ số b 1 của x 1 nói rằng khi x 1 tăng 1 và các biến khác giữ nguyên, dự đoán y thay đổi b 1. Khoảng tin cậy 95 phần trăm của hệ số là b 1 cộng trừ 1 phẩy 96 lần sai số chuẩn, tức mức chênh điển hình của hệ số giữa các mẫu dữ liệu. Khoảng chứa 0 nghĩa là dữ liệu chưa đủ để nói hướng ảnh hưởng. Nhưng giữ các biến khác nguyên rất khó khi x 1 và x 2 luôn đi cùng nhau, vì dữ liệu gần như không có cặp nào mà x 1 đổi còn x 2 đứng yên."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hệ số trượt dọc một đường"
    checks:
      - "alg.collinear_demo(seed=2)[1:] == ((0.9, 1.39), (1.65, 0.38)) and round(0.9 + 1.39, 2) == 2.29 and round(1.65 + 0.38, 2) == 2.03"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><g fill="#1f2937" font-size="22"><line x1="200" y1="360" x2="830" y2="360" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="360" x2="200" y2="40" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="60" x2="800" y2="360" stroke="#059669" stroke-width="3" stroke-dasharray="10 6"/><text x="200" y="388" text-anchor="middle" font-size="20">0</text><text x="185" y="367" text-anchor="end" font-size="20">0</text><text x="500" y="388" text-anchor="middle" font-size="20">1</text><text x="185" y="217" text-anchor="end" font-size="20">1</text><text x="800" y="388" text-anchor="middle" font-size="20">2</text><text x="185" y="67" text-anchor="end" font-size="20">2</text><circle cx="470" cy="152" r="12" fill="#eb6834"/><text x="490" y="140" fill="#eb6834">nửa đầu: 0,90 và 1,39</text><circle cx="695" cy="303" r="12" fill="#2a78d6"/><text x="715" y="291" fill="#2a78d6">nửa sau: 1,65 và 0,38</text><circle cx="500" cy="210" r="12" fill="#059669"/><text x="480" y="252" text-anchor="end" fill="#059669">thật: 1 và 1</text><text x="840" y="368" font-size="20">hệ số của x1</text><text x="210" y="32" font-size="20">hệ số của x2</text><text x="980" y="140">đường nét đứt: tổng hai hệ số bằng 2</text><text x="980" y="180">hai nửa dữ liệu trượt dọc đường này:</text><text x="980" y="220">tổng gần như giữ nguyên,</text><text x="980" y="260">cách chia cho từng biến thì không</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mỗi lần khớp hồi quy thành một điểm, trục ngang là hệ số của x 1, trục dọc là hệ số của x 2. Điểm lục là giá trị thật, 1 và 1, còn điểm cam và điểm xanh là kết quả trên hai nửa dữ liệu ở ví dụ mở đầu. Cả hai điểm đều nằm gần đường nét đứt, nơi tổng hai hệ số bằng 2, nhưng trượt rất xa nhau dọc theo đường đó. Vì x 1 và x 2 luôn đi cùng nhau, dữ liệu chỉ biết chắc tổng tác động của chúng, còn chia tổng đó cho từng biến thì gần như tuỳ ý."

  - id: example
    kind: example
    title: "Hệ số phóng đại phương sai"
    checks:
      - "round(alg.vif_two(0.9), 2) == 5.26 and round(alg.vif_two(0.9) ** 0.5, 2) == 2.29"
      - "round(alg.vif_two(0.5), 2) == 1.33 and round(alg.vif_two(0.99), 1) == 50.3 and round(alg.vif_two(0.99) ** 0.5, 1) == 7.1 and round(alg.vif_two(0.5) ** 0.5, 2) == 1.15"
    steps:
      - show: |
          <p><b>VIF</b> (hệ số phóng đại phương sai) của một biến khi chỉ có hai biến tương quan $r$: $\dfrac{1}{1 - r^2}$, so với khi hai biến không tương quan. Phương sai của hệ số là bình phương sai số chuẩn, nên sai số chuẩn phình $\sqrt{\text{VIF}}$ lần.</p>
          <table class="t"><tr><th>$r$</th><th>$r^2$</th><th>VIF $= \dfrac{1}{1 - r^2}$</th><th>sai số chuẩn phình $\sqrt{\text{VIF}}$</th></tr>
          <tr><td>0,5</td><td>0,25</td><td>$\frac{1}{0{,}75} \approx 1{,}33$</td><td>1,15 lần</td></tr></table>
          <p><b>Bước 1</b> — $r = 0{,}5$: phình rất ít.</p>
        focus: [1, 1, "2.2", 3]
        say: "Hệ số phóng đại phương sai của một biến, khi chỉ có hai biến tương quan r, bằng 1 chia 1 trừ r bình phương, so với khi hai biến không tương quan. Phương sai của hệ số chính là bình phương sai số chuẩn, nên sai số chuẩn phình lên căn bậc hai của số đó lần. Bước một, với r bằng 0 phẩy 5, r bình phương là 0 phẩy 25, hệ số là 1 chia 0 phẩy 75, khoảng 1 phẩy 33, sai số phình 1 phẩy 15 lần. Mức này phình rất ít."
      - clear: true
        show: |
          <table class="t"><tr><th>$r$</th><th>$r^2$</th><th>VIF $= \dfrac{1}{1 - r^2}$</th><th>sai số chuẩn phình $\sqrt{\text{VIF}}$</th></tr>
          <tr><td>0,5</td><td>0,25</td><td>$\frac{1}{0{,}75} \approx 1{,}33$</td><td>1,15 lần</td></tr>
          <tr><td>0,9</td><td>0,81</td><td>$\frac{1}{0{,}19} \approx \hl{5{,}26}$</td><td>2,29 lần</td></tr></table>
          <p><b>Bước 2</b> — $r = 0{,}9$: sai số chuẩn hơn gấp đôi.</p>
        focus: ["1.3", 2]
        say: "Bước hai, với r bằng 0 phẩy 9, r bình phương là 0 phẩy 81, hệ số là 1 chia 0 phẩy 19, khoảng 5 phẩy 26, sai số phình 2 phẩy 29 lần. Sai số chuẩn đã hơn gấp đôi."
      - clear: true
        show: |
          <table class="t"><tr><th>$r$</th><th>$r^2$</th><th>VIF $= \dfrac{1}{1 - r^2}$</th><th>sai số chuẩn phình $\sqrt{\text{VIF}}$</th></tr>
          <tr><td>0,5</td><td>0,25</td><td>$\frac{1}{0{,}75} \approx 1{,}33$</td><td>1,15 lần</td></tr>
          <tr><td>0,9</td><td>0,81</td><td>$\frac{1}{0{,}19} \approx \hl{5{,}26}$</td><td>2,29 lần</td></tr>
          <tr><td>0,99</td><td>0,9801</td><td>$\frac{1}{0{,}0199} \approx 50{,}3$</td><td>7,1 lần</td></tr></table>
          <p><b>Bước 3</b> — $r = 0{,}99$: mẫu số gần 0, hệ số gần như không đo được.</p>
        focus: ["1.4", 2]
        say: "Bước ba, với r bằng 0 phẩy 99, r bình phương là 0 phẩy 9801, hệ số là 1 chia 0 phẩy 0199, khoảng 50 phẩy 3, sai số phình khoảng 7 lần. Mẫu số gần bằng 0, nên hệ số của từng biến gần như không đo được."
      - show: |
          <div class="box key"><b>Bước 4</b> — tổng $b_1 + b_2$ vẫn ổn định (2,29 và 2,03, thật là 2): mô hình dự đoán tốt, chỉ là <b>không tách được</b> phần của từng biến.</div>
        say: "Bước bốn, lưu ý tổng b 1 cộng b 2 vẫn ổn định, 2 phẩy 29 và 2 phẩy 03, trong khi giá trị thật là 2. Mô hình vẫn dự đoán tốt, chỉ là không tách được phần đóng góp của từng biến."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "(lambda np, rng: (lambda x1: abs(1 / (1 - float(np.corrcoef(x1, 0.9 * x1 + math.sqrt(1 - 0.81) * rng.standard_normal(200000))[0, 1]) ** 2) - 5.26) < 0.05)(rng.standard_normal(200000)))(__import__('numpy'), __import__('numpy').random.default_rng(3))"
      - "round(0.9 - 1.39, 2) == -0.49 and round(1.65 - 0.38, 2) == 1.27"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>VIF 5,26</td><td>máy sinh 200 000 cặp $x_1$, $x_2$ tương quan 0,9, đo lại $r$ rồi tính $\frac{1}{1 - r^2}$</td><td>khoảng 5,25 ✓</td></tr>
          <tr><td>tổng ổn, hiệu không ổn</td><td>hiệu $b_1 - b_2$ ở hai nửa dữ liệu</td><td>−0,49 rồi 1,27: đổi cả dấu ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, không dùng công thức. Cho máy sinh 200 nghìn cặp x 1, x 2 có tương quan 0 phẩy 9, rồi đo lại r từ dữ liệu. Tính 1 chia 1 trừ r bình phương được khoảng 5 phẩy 25, khớp với công thức. Lấy hiệu b 1 trừ b 2 ở hai nửa dữ liệu, nửa đầu là âm 0 phẩy 49, nửa sau là 1 phẩy 27, đổi cả dấu. Trong khi đó tổng chỉ đổi từ 2 phẩy 29 sang 2 phẩy 03, vì các điểm chỉ trượt dọc đường tổng bằng 2 như trong hình."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "round(0.9 + 1.39, 2) == 2.29 and round(1.65 + 0.38, 2) == 2.03"
      - "round(1 - 1.96 * 0.2, 2) == 0.61 and round(1 + 1.96 * 0.2, 2) == 1.39 and round(alg.vif_two(0.99) ** 0.5, 1) == 7.1"
      - "round(0.2 * alg.vif_two(0.99) ** 0.5, 2) == 1.42 and round(1 - 1.96 * 0.2 * alg.vif_two(0.99) ** 0.5, 2) == -1.78 and round(1 + 1.96 * 0.2 * alg.vif_two(0.99) ** 0.5, 2) == 3.78"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đọc hệ số trên dữ liệu quan sát thành nhân quả <b class="red">(sai)</b>
          <br><span class="note">“Hệ số của số giờ ngủ là dương” không có nghĩa ngủ thêm sẽ tăng điểm — có thể có biến gây nhiễu (bài 7), tức một yếu tố thứ ba tác động lên cả hai, ví dụ việc làm thêm buổi tối vừa làm ngủ ít vừa làm điểm thấp. Cần thí nghiệm hoặc thiết kế nhân quả.</span></div>
        say: "Lỗi thứ nhất, đọc hệ số trên dữ liệu quan sát thành nhân quả. Hệ số của số giờ ngủ là dương không có nghĩa ngủ thêm sẽ tăng điểm, vì có thể có biến gây nhiễu như bài 7. Biến gây nhiễu là một yếu tố thứ ba tác động lên cả hai, ví dụ việc làm thêm buổi tối vừa làm ngủ ít vừa làm điểm thấp. Vì vậy cần thí nghiệm hoặc một thiết kế nhân quả."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Xếp hạng “biến quan trọng” khi các biến tương quan mạnh <b class="red">(bất ổn)</b>
          <br><span class="note">Như mở đầu: đổi nửa dữ liệu là đổi hạng. Gộp các biến cùng ý nghĩa, hoặc chỉ báo tác động chung của nhóm.</span></div>
        say: "Lỗi thứ hai, xếp hạng biến quan trọng khi các biến tương quan mạnh. Như ví dụ mở đầu, đổi nửa dữ liệu là đổi hạng, nên hãy gộp các biến cùng ý nghĩa, hoặc chỉ báo tác động chung của nhóm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> So độ lớn hệ số của các biến khác đơn vị <b class="red">(vô nghĩa)</b>
          <br><span class="note">Hệ số của “thu nhập theo đồng” nhỏ xíu, “theo triệu đồng” lớn gấp triệu lần — cùng một ảnh hưởng. Đưa các biến về cùng thang trước khi so, ví dụ đo mỗi biến bằng số lần độ lệch chuẩn (mức tản ra điển hình quanh trung bình) của nó.</span></div>
        say: "Lỗi thứ ba, so độ lớn hệ số của các biến khác đơn vị. Hệ số của thu nhập tính theo đồng thì nhỏ xíu, tính theo triệu đồng thì lớn gấp một triệu lần, mà vẫn cùng một ảnh hưởng, nên hãy đưa các biến về cùng thang trước khi so. Ví dụ đo mỗi biến bằng số lần độ lệch chuẩn của nó, tức mức tản ra điển hình quanh trung bình."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Bỏ từng biến vì khoảng tin cậy chứa 0, khi các biến tương quan mạnh <b class="red">(bỏ nhầm)</b></div>
          <table class="t"><tr><th>số minh hoạ: hệ số mỗi biến 1,0</th><th>sai số chuẩn</th><th>khoảng 95% của $b_1$</th></tr>
          <tr><td>hai biến không tương quan</td><td>0,2</td><td>$[0{,}61;\ 1{,}39]$</td></tr>
          <tr><td>tương quan 0,99 (phình 7,1 lần)</td><td>$0{,}2 \cdot 7{,}1 \approx 1{,}42$</td><td>$[-1{,}78;\ 3{,}78]$ — chứa 0</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là bỏ từng biến một vì khoảng tin cậy của nó chứa 0, trong khi các biến tương quan mạnh. Với số minh hoạ, mỗi biến có hệ số 1, nếu hai biến không tương quan thì sai số chuẩn 0 phẩy 2, khoảng từ 0 phẩy 61 tới 1 phẩy 39. Nếu tương quan 0 phẩy 99 thì sai số phình 7 phẩy 1 lần thành khoảng 1 phẩy 42, và khoảng của mỗi hệ số chứa 0. Bỏ cả hai biến là sai, vì tổng tác động của chúng vẫn đo rất chắc, nên người làm nghề kiểm định cả nhóm biến cùng lúc trước khi bỏ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.vif_two(0.8), 2) == 2.78 and round(alg.vif_two(0.8) ** 0.5, 2) == 1.67"
      - "round(2.0 - 1.96 * 1.5, 2) == -0.94 and round(2.0 + 1.96 * 1.5, 2) == 4.94"
      - "round(0.8 ** 2, 2) == 0.64 and round(1.96 * 1.5, 2) == 2.94"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hai biến tương quan 0,8: VIF bằng bao nhiêu? Sai số chuẩn phình mấy lần?</td></tr>
          <tr><td>2</td><td>Hệ số 2,0 với sai số chuẩn 1,5: khoảng tin cậy 95%? Kết luận được hướng ảnh hưởng không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hai biến tương quan 0 phẩy 8, hệ số phóng đại phương sai bằng bao nhiêu? Sai số chuẩn phình mấy lần? Câu hai, một hệ số bằng 2 phẩy 0 với sai số chuẩn 1 phẩy 5, khoảng tin cậy 95 phần trăm là gì? Có kết luận được hướng ảnh hưởng không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Bước 1: $r^2 = 0{,}8^2 = 0{,}64$. Bước 2: VIF $= \dfrac{1}{1 - 0{,}64} = \dfrac{1}{0{,}36} \approx \hl{2{,}78}$; phình $\sqrt{2{,}78} \approx 1{,}67$ lần.</p>
        say: "Đáp án câu một, bước một, r bình phương bằng 0 phẩy 8 bình phương, tức 0 phẩy 64. Bước hai, hệ số phóng đại là 1 chia 0 phẩy 36, khoảng 2 phẩy 78, nên sai số chuẩn phình căn của 2 phẩy 78, khoảng 1 phẩy 67 lần."
      - show: |
          <p>② Nửa độ rộng $1{,}96 \cdot 1{,}5 = 2{,}94$. Khoảng $2{,}0 \pm 2{,}94 = [-0{,}94;\ 4{,}94]$: chứa 0 → $\hl{\text{chưa kết luận được}}$ hướng.</p>
        focus: [1, 1, 1]
        say: "Câu hai, nửa độ rộng là 1 phẩy 96 nhân 1 phẩy 5, bằng 2 phẩy 94. Khoảng tin cậy đi từ 2 trừ 2 phẩy 94, tức âm 0 phẩy 94, tới 4 phẩy 94. Khoảng chứa 0, nên chưa kết luận được hướng ảnh hưởng."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hệ số: “giữ các biến khác nguyên”</span><span class="a">→</span>
          <span class="n">biến tương quan: hệ số bất ổn, VIF lớn</span><span class="a">→</span>
          <span class="n">khoảng tin cậy chứa 0: chưa biết hướng</span><span class="a">→</span>
          <span class="n">hệ số quan sát chưa phải nhân quả</span></div>
        say: "Tổng kết lại, hệ số nói về thay đổi khi giữ các biến khác nguyên. Khi các biến tương quan, hệ số bất ổn và hệ số phóng đại phương sai lớn. Khoảng tin cậy chứa 0 thì chưa biết hướng, và hệ số trên dữ liệu quan sát không tự nó chứng minh nhân quả."
      - show: |
          <div class="box key"><b>Tư duy:</b> mô hình dự đoán tốt chưa chắc giải thích đúng. Câu hỏi “dự đoán” và câu hỏi “vì sao” cần những bằng chứng khác nhau.</div>
        say: "Điều cần mang theo, một mô hình dự đoán tốt chưa chắc giải thích đúng. Câu hỏi dự đoán và câu hỏi vì sao cần những bằng chứng khác nhau."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): <b>quyền riêng tư</b>, ẩn danh hoá và đạo đức dữ liệu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta học về quyền riêng tư, ẩn danh hoá và đạo đức dữ liệu. Hẹn gặp bạn ở bài tiếp theo."
