id: L09
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 9 — Kiểm định nhiều lần và câu cá dữ liệu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dsc.yaml L09; audit/dsc/verify_dsc.py L09; R. L. Wasserstein, N. A. Lazar, The ASA Statement on p-Values, The American Statistician 70(2), 2016; J. P. A. Ioannidis, Why Most Published Research Findings Are False, PLoS Medicine 2(8), 2005; C. E. Bonferroni (1936); tình huống kẹo dẻo phỏng theo truyện tranh R. Munroe, xkcd 882 “Significant” (2011) — không phải tin báo có thật"
assumes: [arith, frac, approx, power, cdot]
# Quy ước: các kiểm định độc lập, mỗi cái ở mức α = 0,05, khi KHÔNG có hiệu ứng nào thì giá trị p phân phối đều trên [0, 1]. Hiệu chỉnh Bonferroni:
#   dùng α/m cho m kiểm định. Tỉ lệ kết quả giả trong số kết quả “có ý nghĩa” tính theo tỉ lệ nền (Ioannidis 2005). Mọi số do Python trong checks;
#   mô phỏng 20 000 lần trong audit/dsc/verify_dsc.py. Tên Bonferroni chỉ trên màn hình.
objectives:
  - "Tính xác suất có ít nhất một kết quả giả khi kiểm nhiều lần"
  - "Hiệu chỉnh mức ý nghĩa"
  - "Hiểu đúng giá trị p"
asr_reviewed:
  - {sentence: "Hãy hiệu chỉnh mức ý nghĩa, hoặc chọn trước giả thuyết, và luôn nhớ tỉ lệ nền.", reason: "ASR chép “Hãy hiểu chính mức ý nghĩa … luôn nhớ tỷ lệ nên”: hiệu chỉnh → “hiểu chính” lệch thanh, tỉ/tỷ chỉ khác chính tả, nền/nên lệch thanh; câu 16 từ khớp 0,765 — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Kẹo màu xanh lá gây mụn?"
    checks:
      - "round(1 - 0.95 ** 20, 3) == 0.642"
    steps:
      - show: |
          <p>Tình huống minh hoạ: kiểm xem kẹo dẻo có gây mụn không — không thấy gì. Thử riêng từng màu trong 20 màu: màu xanh lá cho $p \lt 0{,}05$, mức thường được gọi là “có ý nghĩa”! Báo chí đưa tin “kẹo xanh lá gây mụn”.</p>
          <p>Nhưng nếu không màu nào gây mụn, xác suất có <b>ít nhất một</b> màu “có ý nghĩa” trong 20 lần kiểm là $1 - 0{,}95^{20} \approx \hl{64\%}$.</p>
          <div class="box key">Hôm nay: <b>kiểm định nhiều lần</b> — thử đủ nhiều thì kiểu gì cũng “tìm thấy” điều gì đó.</div>
        focus: [1, 1, 1, 2, 3]
        say: "Chào bạn, xét một tình huống minh hoạ, kiểm xem kẹo dẻo có gây mụn không, kết quả là không thấy gì. Thử riêng từng màu trong 20 màu, màu xanh lá cho giá trị p nhỏ hơn 0 phẩy 05, mức mà người ta thường gọi là có ý nghĩa. Báo chí liền đưa tin kẹo xanh lá gây mụn. Nhưng nếu không màu nào gây mụn, xác suất có ít nhất một màu có ý nghĩa trong 20 lần kiểm là khoảng 64 phần trăm. Hôm nay ta học về kiểm định nhiều lần, thử đủ nhiều thì kiểu gì cũng tìm thấy điều gì đó."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Trước hết: nhân xác suất, biến cố bù, báo nhầm"
    checks:
      - "0.5 * 0.5 == 0.25 and 1 - 0.25 == 0.75 and round(0.95 ** 2, 4) == 0.9025 and round(1 - 0.95 ** 2, 4) == 0.0975"
      - "round(1 - 0.05, 9) == 0.95 and round(0.0975 / 0.05, 2) == 1.95"
    steps:
      - show: |
          <table class="t"><tr><th>quy tắc</th><th>ví dụ: tung đồng xu 2 lần</th></tr>
          <tr><td>hai lần <b>độc lập</b>: nhân xác suất</td><td>cả hai lần sấp: $0{,}5 \cdot 0{,}5 = 0{,}25$</td></tr>
          <tr><td><b>biến cố bù</b>: “ít nhất một” $= 1 -$ “không lần nào”</td><td>ít nhất một lần ngửa: $1 - 0{,}25 = 0{,}75$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bài này dùng hai quy tắc xác suất, ta làm thử với đồng xu tung hai lần. Hai lần tung độc lập thì nhân xác suất, nên cả hai lần sấp là 0 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 25. Còn ít nhất một lần ngửa là biến cố bù của không lần nào ngửa, nên bằng 1 trừ 0 phẩy 25, tức 0 phẩy 75."
      - show: |
          <p><b>Kiểm định ở mức 0,05</b> là một quy tắc: báo “có hiệu ứng” (“có ý nghĩa”) khi giá trị $p$ dưới 0,05 — giá trị $p$ được giảng kỹ ở cảnh sau. Khi thật ra <b>không</b> có hiệu ứng, quy tắc ấy vẫn <b>báo nhầm</b> 5% số lần.</p>
          <p>Vậy mỗi lần kiểm <b>không</b> báo nhầm với xác suất $1 - 0{,}05 = 0{,}95$. Hai lần đều không báo nhầm: $0{,}95^2 = 0{,}9025$. Ít nhất một lần báo nhầm: $1 - 0{,}9025 = 0{,}0975$.</p>
        focus: [1, 1, 1, 2, 2]
        say: "Áp vào kiểm định, một kiểm định ở mức 0 phẩy 05 là quy tắc báo có hiệu ứng, hay có ý nghĩa, khi giá trị p dưới 0 phẩy 05. Giá trị p sẽ được giảng kỹ ở cảnh ngay sau đây. Khi thật ra không có hiệu ứng nào, quy tắc ấy vẫn báo nhầm 5 phần trăm số lần, nên mỗi lần kiểm không báo nhầm với xác suất 0 phẩy 95. Hai lần đều không báo nhầm là 0 phẩy 95 bình phương, bằng 0 phẩy 9025. Vậy ít nhất một lần báo nhầm là 0 phẩy 0975, gần gấp đôi 5 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: giá trị p, nói đúng"
    steps:
      - show: |
          <p><b>Giá trị p</b>: <b>nếu</b> không có hiệu ứng nào, xác suất thấy dữ liệu lệch ít nhất như đã thấy.</p>
          <table class="t"><tr><th>giá trị p KHÔNG phải</th></tr>
          <tr><td>xác suất giả thuyết “không có hiệu ứng” là đúng</td></tr>
          <tr><td>độ lớn hay tầm quan trọng của hiệu ứng</td></tr>
          <tr><td>xác suất lặp lại được kết quả</td></tr></table>
          <p class="note">Khi không có hiệu ứng, mỗi lần kiểm ở mức 0,05 có 5% cơ hội báo nhầm — nhiều lần kiểm thì cơ hội cộng dồn.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3]
        say: "Giá trị p là, nếu không có hiệu ứng nào, xác suất thấy dữ liệu lệch ít nhất như đã thấy. Giá trị p không phải ba điều sau. Nó không phải xác suất giả thuyết không có hiệu ứng là đúng. Nó không phải độ lớn hay tầm quan trọng của hiệu ứng. Nó cũng không phải xác suất lặp lại được kết quả. Khi không có hiệu ứng, mỗi lần kiểm ở mức 0 phẩy 05 có 5 phần trăm cơ hội báo nhầm, và nhiều lần kiểm thì cơ hội cộng dồn."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi lần kiểm thêm là một vé số nữa"
    checks:
      - "[round(100 * (1 - 0.95 ** m)) for m in (10, 20)] == [40, 64] and round(1 - 0.95 ** 60, 2) == 0.95 and all(1 - (1 - 0.05 / m) ** m <= 0.05 + 1e-12 for m in range(1, 61))"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><g fill="#1f2937" font-size="22"><line x1="160" y1="330" x2="1270" y2="330" stroke="#6b7280" stroke-width="2"/><line x1="160" y1="330" x2="160" y2="40" stroke="#6b7280" stroke-width="2"/><text x="148" y="337" text-anchor="end" font-size="20">0%</text><text x="148" y="197" text-anchor="end" font-size="20">50%</text><text x="148" y="57" text-anchor="end" font-size="20">100%</text><text x="160" y="360" text-anchor="middle" font-size="20">1</text><text x="328" y="360" text-anchor="middle" font-size="20">10</text><text x="514" y="360" text-anchor="middle" font-size="20">20</text><text x="887" y="360" text-anchor="middle" font-size="20">40</text><text x="1260" y="360" text-anchor="middle" font-size="20">60</text><circle cx="328" cy="218" r="9" fill="#eb6834"/><text x="344" y="248" font-size="22" fill="#eb6834">10 lần: 40%</text><circle cx="514" cy="150" r="9" fill="#eb6834"/><text x="530" y="180" font-size="22" fill="#eb6834">20 lần: 64%</text><path d="M 160,316 L 179,303 L 197,290 L 216,278 L 235,267 L 253,256 L 272,246 L 291,236 L 309,226 L 328,218 L 346,209 L 365,201 L 384,194 L 402,187 L 421,180 L 440,173 L 458,167 L 477,161 L 496,156 L 514,150 L 533,145 L 552,141 L 570,136 L 589,132 L 607,128 L 626,124 L 645,120 L 663,117 L 682,113 L 701,110 L 719,107 L 738,104 L 757,102 L 775,99 L 794,97 L 813,94 L 831,92 L 850,90 L 868,88 L 887,86 L 906,84 L 924,82 L 943,81 L 962,79 L 980,78 L 999,76 L 1018,75 L 1036,74 L 1055,73 L 1074,72 L 1092,70 L 1111,69 L 1129,68 L 1148,68 L 1167,67 L 1185,66 L 1204,65 L 1223,64 L 1241,64 L 1260,63" fill="none" stroke="#eb6834" stroke-width="4"/><path d="M 160,316 L 179,316 L 197,316 L 216,316 L 235,316 L 253,316 L 272,316 L 291,316 L 309,316 L 328,316 L 346,316 L 365,316 L 384,316 L 402,316 L 421,316 L 440,316 L 458,316 L 477,316 L 496,316 L 514,316 L 533,316 L 552,316 L 570,316 L 589,316 L 607,316 L 626,316 L 645,316 L 663,316 L 682,316 L 701,316 L 719,316 L 738,316 L 757,316 L 775,316 L 794,316 L 813,316 L 831,316 L 850,316 L 868,316 L 887,316 L 906,316 L 924,316 L 943,316 L 962,316 L 980,316 L 999,316 L 1018,316 L 1036,316 L 1055,316 L 1074,316 L 1092,316 L 1111,316 L 1129,316 L 1148,316 L 1167,316 L 1185,316 L 1204,316 L 1223,316 L 1241,316 L 1260,316" fill="none" stroke="#059669" stroke-width="4"/><text x="1290" y="71" fill="#eb6834">mỗi lần mức 0,05</text><text x="1290" y="310" fill="#059669">chia mức cho số lần</text><text x="715" y="378" text-anchor="middle" font-size="20">số lần kiểm</text><text x="20" y="30" font-size="20">xác suất có ít nhất một báo nhầm</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ xác suất có ít nhất một lần báo nhầm khi không có hiệu ứng nào, theo số lần kiểm. Đường cam là khi mỗi lần đều kiểm ở mức 0 phẩy 05, nó leo rất nhanh, 10 lần đã 40 phần trăm, 20 lần đã 64 phần trăm, và 60 lần đã khoảng 95 phần trăm. Đường lục là khi chia mức ý nghĩa cho số lần kiểm, nó nằm sát đáy và không bao giờ vượt 5 phần trăm. Mỗi lần kiểm thêm giống như mua thêm một vé số, mua đủ nhiều thì kiểu gì cũng trúng."

  - id: example
    kind: example
    title: "20 lần kiểm và cách hiệu chỉnh"
    checks:
      - "round(1 - 0.95 ** 20, 3) == 0.642 and 20 * 0.05 == 1"
      - "0.05 / 20 == 0.0025 and round(1 - (1 - 0.0025) ** 20, 4) == 0.0488"
    steps:
      - show: |
          <p>20 kiểm định độc lập, không có hiệu ứng nào.</p>
          <p><b>Bước 1</b> — số kết quả “có ý nghĩa” giả trung bình: $20 \cdot 0{,}05 = 1$.</p>
        focus: [1, 2]
        say: "Xét 20 kiểm định độc lập khi không có hiệu ứng nào. Bước một, trung bình có 20 nhân 0 phẩy 05, bằng 1 kết quả có ý nghĩa giả."
      - show: |
          <p><b>Bước 2</b> — cả 20 lần đều không báo nhầm (nhân xác suất):</p>
          $$0{,}95^{20} \approx 0{,}358$$
        focus: [1, 2]
        say: "Bước hai, cả 20 lần đều không báo nhầm. Theo quy tắc nhân, xác suất này bằng 0 phẩy 95 mũ 20, khoảng 0 phẩy 358."
      - show: |
          <p><b>Bước 3</b> — biến cố bù: có ít nhất một kết quả giả</p>
          $$1 - 0{,}358 \approx \hl{0{,}642}$$
        focus: [1, 2]
        say: "Bước ba, lấy biến cố bù. Xác suất có ít nhất một kết quả giả là 1 trừ 0 phẩy 358, khoảng 0 phẩy 642."
      - clear: true
        show: |
          <p><b>Bước 4</b> — <b>Bonferroni</b>: kiểm mỗi cái ở mức $0{,}05 / 20 = \hl{0{,}0025}$. Khi đó xác suất có ít nhất một kết quả giả: $1 - 0{,}9975^{20} \approx 4{,}9\%$ — dưới 5%.</p>
          <p class="note">Cái giá: khó phát hiện hiệu ứng thật hơn — <b>độ mạnh</b> (xác suất kiểm định báo “có ý nghĩa” khi hiệu ứng có thật) giảm. Tốt nhất: chọn trước một giả thuyết chính.</p>
        focus: [1, 1, 2, 2]
        say: "Bước bốn, hiệu chỉnh đơn giản nhất là kiểm mỗi cái ở mức 0 phẩy 05 chia 20, tức 0 phẩy 0025. Khi đó xác suất có ít nhất một kết quả giả chỉ còn khoảng 4 phẩy 9 phần trăm, dưới 5 phần trăm. Cái giá là khó phát hiện hiệu ứng thật hơn, tức độ mạnh giảm, với độ mạnh là xác suất kiểm định báo có ý nghĩa khi hiệu ứng có thật. Tốt nhất là chọn trước một giả thuyết chính."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "(lambda r: abs(sum(any(r.random() < 0.05 for _ in range(20)) for _ in range(20000)) / 20000 - 0.642) < 0.01)(__import__('random').Random(5))"
      - "20 * 0.0025 == 0.05 and 1 - 0.9975 ** 20 < 20 * 0.0025"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>0,642</td><td>máy tung 20 000 lần, mỗi lần 20 kiểm định ngẫu nhiên, đếm số lần có ít nhất một kết quả dưới 0,05</td><td>khoảng 64% ✓</td></tr>
          <tr><td>4,9%</td><td>chặn trên bằng phép cộng: xác suất có ít nhất một không vượt tổng các xác suất, $20 \cdot 0{,}0025 = 5\%$</td><td>4,9% dưới 5% ✓</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, không dùng công thức mũ. Cho máy thử 20 nghìn lần, mỗi lần làm 20 kiểm định khi không có hiệu ứng. Đếm số lần có ít nhất một kết quả dưới 0 phẩy 05, được khoảng 64 phần trăm, khớp với 0 phẩy 642. Với mức đã hiệu chỉnh, xác suất có ít nhất một kết quả giả không thể vượt tổng các xác suất, vì các lần báo nhầm có thể trùng nhau. Tổng đó là 20 nhân 0 phẩy 0025, bằng 5 phần trăm, nên 4 phẩy 9 phần trăm nằm dưới chặn là hợp lý."

  - id: base
    kind: concept
    title: "Bao nhiêu kết quả “có ý nghĩa” là thật?"
    checks:
      - "round(0.05 * 0.9 / (0.05 * 0.9 + 0.8 * 0.1), 2) == 0.36"
    steps:
      - show: |
          <p>Giả sử chỉ 10% giả thuyết được thử là đúng, độ mạnh 80% (giả thuyết đúng được phát hiện 80% số lần), mức ý nghĩa α = 5% (α, đọc “an-pha”: tỉ lệ báo nhầm cho phép khi không có hiệu ứng). Trong 1000 giả thuyết: 100 đúng → 80 được phát hiện; 900 sai → 45 báo nhầm.</p>
          $$\text{giả trong số “có ý nghĩa”} = \frac{45}{80 + 45} = \frac{45}{125} = \hl{36\%}$$
          <div class="box key">p &lt; 0,05 không có nghĩa “95% là thật”. Lĩnh vực càng nhiều giả thuyết liều, càng nhiều kết quả giả.</div>
        focus: [1, 1, 1, 2, 3, 3]
        say: "Giả sử chỉ 10 phần trăm giả thuyết được thử là đúng, độ mạnh 80 phần trăm, tức giả thuyết đúng được phát hiện 80 phần trăm số lần. Mức ý nghĩa, ký hiệu an-pha, là 5 phần trăm, tức tỉ lệ báo nhầm cho phép khi không có hiệu ứng. Trong một nghìn giả thuyết, 100 giả thuyết đúng thì 80 được phát hiện, còn 900 giả thuyết sai thì 45 bị báo nhầm. Trong 125 kết quả có ý nghĩa, có 45 là giả, tức 36 phần trăm. Vì vậy p nhỏ hơn 0 phẩy 05 không có nghĩa là 95 phần trăm là thật. Lĩnh vực càng nhiều giả thuyết liều thì càng nhiều kết quả giả."

  # ───────────────────────── 5. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "50 * 0.05 == 2.5 and round(0.95 ** 50 * 100, 1) == 7.7 and 30 * 2.5 == 75"
      - "round(0.001 / math.sqrt(0.1 * 0.9 / 10**6 + 0.101 * 0.899 / 10**6), 2) == 2.35 > 1.96 and round((0.101 - 0.10) * 100, 9) == 0.1"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thử nhiều cách phân tích, chỉ báo cách “đẹp” <b class="red">(câu cá)</b>
          <br><span class="note">Đổi cách lọc dữ liệu, nhóm tuổi, chỉ số… mỗi lựa chọn là một lần kiểm ẩn. Ghi trước kế hoạch phân tích, báo mọi thứ đã thử.</span></div>
        say: "Lỗi thứ nhất, thử nhiều cách phân tích rồi chỉ báo cách đẹp. Đổi cách lọc dữ liệu, nhóm tuổi hay chỉ số, mỗi lựa chọn là một lần kiểm ẩn, nên hãy ghi trước kế hoạch phân tích và báo mọi thứ đã thử."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đọc p là xác suất giả thuyết đúng <b class="red">(sai)</b>
          <br><span class="note">Như vừa tính: tuỳ tỉ lệ nền, một kết quả p &lt; 0,05 có thể có hơn 1/3 cơ hội là giả.</span></div>
        say: "Lỗi thứ hai, đọc p là xác suất giả thuyết đúng. Như vừa tính, tuỳ tỉ lệ nền, một kết quả p nhỏ hơn 0 phẩy 05 có thể có hơn một phần ba cơ hội là giả."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Coi “có ý nghĩa thống kê” là “quan trọng” <b class="red">(lẫn)</b>
          <br><span class="note">Với một triệu khách mỗi nhóm, tỉ lệ mua 10% so với 10,1% đã “có ý nghĩa”, dù chỉ hơn 0,1 điểm phần trăm. Luôn báo kèm độ lớn hiệu ứng và khoảng tin cậy (khoảng các giá trị hiệu ứng còn hợp với dữ liệu).</span></div>
        say: "Lỗi thứ ba, coi có ý nghĩa thống kê là quan trọng. Với một triệu khách mỗi nhóm, tỉ lệ mua 10 phần trăm so với 10 phẩy 1 phần trăm đã có ý nghĩa, dù chỉ hơn 0 phẩy 1 điểm phần trăm. Hãy luôn báo kèm độ lớn hiệu ứng và khoảng tin cậy, tức khoảng các giá trị hiệu ứng còn hợp với dữ liệu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm cũng mắc).</b> Bật cảnh báo tự động cho thật nhiều chỉ số, mỗi cái ở mức 5% <b class="red">(chuông kêu mãi)</b></div>
          <table class="t"><tr><th>số minh hoạ: 50 chỉ số, kiểm mỗi ngày, hệ thống bình thường</th><th>giá trị</th></tr>
          <tr><td>cảnh báo giả trung bình mỗi ngày</td><td>$50 \cdot 0{,}05 = 2{,}5$</td></tr>
          <tr><td>xác suất một ngày không có cảnh báo nào</td><td>$0{,}95^{50} \approx 7{,}7\%$</td></tr>
          <tr><td>cảnh báo giả trong 30 ngày</td><td>$30 \cdot 2{,}5 = 75$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư, người đã đi làm cũng hay mắc, là bật cảnh báo tự động cho thật nhiều chỉ số, mỗi cái ở mức 5 phần trăm. Với số minh hoạ 50 chỉ số kiểm mỗi ngày khi hệ thống hoàn toàn bình thường, trung bình mỗi ngày có 2 phẩy 5 cảnh báo giả. Xác suất có một ngày yên ổn không cảnh báo nào chỉ khoảng 7 phẩy 7 phần trăm. Một tháng 30 ngày có khoảng 75 cảnh báo giả, nên đội trực sẽ quen bỏ qua chuông, kể cả khi có sự cố thật. Người làm nghề chọn ít chỉ số chính và hạ mức cảnh báo theo số chỉ số."

  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(1 - 0.95 ** 10, 3) == 0.401 and 0.05 / 10 == 0.005"
      - "round(0.95 ** 10, 3) == 0.599 and round((1 - 0.995 ** 10) * 100, 1) == 4.9"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>10 kiểm định độc lập ở mức 0,05, không hiệu ứng nào: xác suất có ít nhất một kết quả giả?</td></tr>
          <tr><td>2</td><td>Mức hiệu chỉnh Bonferroni cho mỗi kiểm định?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 10 kiểm định độc lập ở mức 0 phẩy 05, không có hiệu ứng nào, xác suất có ít nhất một kết quả giả là bao nhiêu? Câu hai, mức hiệu chỉnh cho mỗi kiểm định là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Bước 1: cả 10 lần không báo nhầm: $0{,}95^{10} \approx 0{,}599$.</p>
          <p>Bước 2: ít nhất một kết quả giả: $1 - 0{,}599 \approx \hl{40\%}$.</p>
        focus: [1, 2]
        say: "Đáp án câu một, bước một, cả 10 lần đều không báo nhầm có xác suất 0 phẩy 95 mũ 10, khoảng 0 phẩy 599. Bước hai, lấy biến cố bù, 1 trừ 0 phẩy 599, khoảng 40 phần trăm."
      - show: |
          <p>② $0{,}05 / 10 = \hl{0{,}005}$. Thử lại: $1 - 0{,}995^{10} \approx 4{,}9\%$ — dưới 5% ✓</p>
        say: "Câu hai, mức cho mỗi kiểm định là 0 phẩy 05 chia 10, bằng 0 phẩy 005. Thử lại, 1 trừ 0 phẩy 995 mũ 10 khoảng 4 phẩy 9 phần trăm, đúng là dưới 5 phần trăm."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">p: xác suất dữ liệu nếu không có hiệu ứng</span><span class="a">→</span>
          <span class="n">m lần kiểm độc lập: 1 − 0,95ᵐ</span><span class="a">→</span>
          <span class="n">hiệu chỉnh α/m, hoặc chọn trước</span><span class="a">→</span>
          <span class="n">nhớ tỉ lệ nền</span></div>
        say: "Tổng kết lại, giá trị p là xác suất thấy dữ liệu lệch ít nhất như vậy nếu không có hiệu ứng. Kiểm m lần độc lập thì cơ hội có ít nhất một lần báo nhầm là 1 trừ 0 phẩy 95 mũ m. Hãy hiệu chỉnh mức ý nghĩa, hoặc chọn trước giả thuyết, và luôn nhớ tỉ lệ nền."
      - show: |
          <div class="box key"><b>Tư duy:</b> một phát hiện chỉ đáng tin khi bạn biết đã phải thử bao nhiêu lần mới có nó.</div>
        say: "Điều cần mang theo, một phát hiện chỉ đáng tin khi bạn biết đã phải thử bao nhiêu lần mới có được nó."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>rò rỉ dữ liệu</b> và chia tập đúng cách.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học về rò rỉ dữ liệu và cách chia tập đúng. Hẹn gặp bạn ở bài tiếp theo."
