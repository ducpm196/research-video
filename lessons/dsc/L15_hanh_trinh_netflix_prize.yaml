          <tr><td>không công bố: thi nội bộ, hoặc chỉ công bố số liệu gộp theo nhóm đủ lớn</td><td>giữ quyền riêng tư</td><td>ít người thử hơn</td></tr></table>
          <p class="note">Điều kiện đổi lựa chọn: khách đã đồng ý rõ ràng, và dữ liệu đã được chuyên gia quyền riêng tư đánh giá với câu hỏi “người biết vài điều về một khách thì tìm được gì?”.</p>
        focus: ["1.2", "1.2", "1.3", 2]
