id: L15
course: DSC
series: "DSC · Khoa học dữ liệu"
title: "Bài 15 — Tình huống chuyên gia theo dòng thời gian: cuộc thi Netflix Prize 2006–2012"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
case: journey
source: "curriculum/dsc.yaml L15; audit/dsc/sources_L15.md (câu trích nguyên văn, đọc 2026-11-02); audit/dsc/verify_dsc.py L15; J. Bennett, S. Lanning, The Netflix Prize, KDD Cup and Workshop 2007 [BL07]; A. Narayanan, V. Shmatikov, Robust De-anonymization of Large Datasets, arXiv cs/0610105 v2, 2007 (IEEE S&P 2008) [NS07]; Y. Koren, The BellKor Solution to the Netflix Grand Prize, 2009 [KO09]; A. Töscher, M. Jahrer, R. M. Bell, The BigChaos Solution to the Netflix Grand Prize, 2009 [TJ09]; A. Feuerverger, Y. He, S. Khatri, Statistical Significance of the Netflix Challenge, Statistical Science 27(2), 2012 [FH12]; X. Amatriain (Netflix), Mining Large Streams of User Data for Personalized Recommendations, SIGKDD Explorations 14(2), 2012 [AM12]; blog Netflix Technology 2012 không tải được (403/429) — không dạy chi tiết chỉ có ở đó; DSC bài 8 (thí nghiệm chia nhóm ngẫu nhiên), bài 9 (kiểm định nhiều lần), bài 10 (chia tập), bài 13 (ẩn danh hoá)"
assumes: [arith, frac, sqrt, approx, power]
# Quy ước: “sai số căn quân phương” = RMSE (chỉ viết RMSE trên màn hình); “tập công khai” = quiz set (điểm hiện trên bảng xếp hạng);
#   “tập kín” = test set (điểm không công bố, dùng để chọn đội thắng); “tập thăm dò” = probe set (đội thi tự kiểm); “bộ ghép” = blend /
#   ensemble; “dự đoán nền” = baseline predictor (trung bình chung + độ lệch của người + độ lệch của phim). Sai số e của một lượt chấm =
#   dự đoán trừ điểm thật. Phần trăm cải thiện = (RMSE cũ − RMSE mới) / RMSE cũ.
#   Mọi sự kiện và con số có nguồn ghi trong audit/dsc/sources_L15.md. Con số khác là phép tính lại (checks) hoặc “(số minh hoạ)”: bốn sai
#   số 1, −1, 2, 0; trọng số 2 và 1 của điểm xếp hạng; cửa hàng 20 000 khách, RMSE 0,95 / 0,90 / 0,89, 2 và 50 mô hình trong quiz.
#   Lời đọc không nói tên đội thi, Cinematch, RMSE, DVD: nói “đội thắng giải”, “hệ gợi ý cũ của công ty”, “sai số căn quân phương”.
objectives:
  - "Kể lại hành trình của cuộc thi Netflix Prize qua năm chặng từ 2006 tới 2012, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính sai số căn quân phương, phần trăm cải thiện, mức lạc quan khi ghép nhiều mô hình trên một tập công khai"
  - "Chọn mô hình đưa vào chạy thật theo được và mất ở quy mô của chính mình, kèm điều kiện đổi lựa chọn"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Một triệu đô cho 10%, rồi không triển khai bản thắng giải"
    checks:
      - "round(0.9525 * 0.9, 4) in (0.8572, 0.8573) and int(0.9525 * 0.9 * 10000) == 8572"
    steps:
      - show: |
          <p>Tháng 10/2006, Netflix công bố hơn <b>100 triệu</b> lượt chấm điểm phim và treo giải <b>1 triệu đô</b> cho đội làm hệ gợi ý của công ty <b>chính xác hơn 10%</b>.</p>
          <p>Tháng 7/2009, một đội vượt mốc. Năm 2012, Netflix viết: phần chính xác tăng thêm của các cách mới trong bản thắng giải <b>không đáng</b> công kỹ thuật để đưa vào chạy thật.</p>
          <div class="box key">Hôm nay: năm chặng từ 2006 tới 2012 — đo thế nào cho công bằng, dữ liệu công khai thì sao, và vì sao mô hình tốt nhất trên bảng điểm chưa chắc là mô hình nên triển khai.</div>
        focus: [1, 2, 2, 3, 3]
        say: "Chào bạn, tháng 10 năm 2006, Netflix công bố hơn 100 triệu lượt chấm điểm phim, và treo giải 1 triệu đô cho đội làm hệ gợi ý của công ty chính xác hơn 10 phần trăm. Tháng 7 năm 2009, một đội đã vượt mốc đó. Năm 2012, chính Netflix viết rằng phần chính xác tăng thêm của các cách mới trong bản thắng giải không đáng công kỹ thuật để đưa vào chạy thật. Hôm nay ta đi qua năm chặng, để hiểu đo thế nào cho công bằng, và dữ liệu công khai thì sao. Ta cũng sẽ thấy vì sao mô hình tốt nhất trên bảng điểm chưa chắc là mô hình nên triển khai."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "round(1 - 0.95 ** 20, 3) == 0.642"
      - "(100 - 90) / 100 == 0.1"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 8</td><td>chia người dùng <b>ngẫu nhiên</b> thành hai nhóm thì mọi biến gây nhiễu (yếu tố thứ ba tác động lên cả nguyên nhân lẫn kết quả) được chia đều</td><td>nhóm A thấy nút xanh, nhóm B thấy nút cam, cùng một tuần</td></tr>
          <tr><td>bài 9</td><td>thử <b>nhiều lần</b> thì có kết quả “tốt” chỉ do may</td><td>20 kiểm định khi không có hiệu ứng nào, mỗi cái 5% báo nhầm: xác suất có ít nhất một báo nhầm = 1 trừ 0,95 mũ 20 ≈ 0,642</td></tr>
          <tr><td>bài 10</td><td>mô hình chỉ được học trên tập huấn luyện; chấm trên tập <b>chưa từng thấy</b>, chia theo thời gian nếu dữ liệu có ngày</td><td>chuẩn hoá bằng trung bình cả tập (4,0) thay vì tập huấn luyện (2,0) là rò rỉ</td></tr>
          <tr><td>bài 13</td><td>bỏ cột họ tên <b>chưa phải</b> ẩn danh hoá: các cột còn lại có thể nối với nguồn khác</td><td>mỗi tổ hợp mã bưu chính, tuổi phải xuất hiện ít nhất 2 lần</td></tr></table>
          <p>Phần trăm giảm: từ 100 xuống 90 là (100 − 90) / 100 = 10%.</p>
        focus: ["1.2", "1.3", "1.3", "1.4", "1.5", 2]
        say: "Ở bài 8, chia người dùng ngẫu nhiên thành hai nhóm thì mọi biến gây nhiễu, tức yếu tố thứ ba tác động lên cả nguyên nhân lẫn kết quả, được chia đều. Ở bài 9, thử nhiều lần thì có kết quả tốt chỉ do may. Ví dụ 20 kiểm định khi không có hiệu ứng nào, mỗi cái có 5 phần trăm báo nhầm, cho xác suất có ít nhất một báo nhầm khoảng 0 phẩy 642. Ở bài 10, mô hình chỉ học trên tập huấn luyện, và được chấm trên dữ liệu chưa từng thấy. Ở bài 13, bỏ cột họ tên chưa phải ẩn danh hoá, vì các cột còn lại có thể nối với nguồn khác. Cuối cùng, từ 100 xuống 90 là giảm 10 phần trăm."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Sai số căn quân phương và ngôn ngữ của cuộc thi"
    checks:
      - "[e * e for e in (1, -1, 2, 0)] == [1, 1, 4, 0] and sum(e * e for e in (1, -1, 2, 0)) / 4 == 1.5 and round(math.sqrt(1.5), 2) == 1.22"
    steps:
      - show: |
          <p>Mỗi lượt chấm có một <b>sai số</b>: dự đoán trừ điểm thật. Bốn lượt chấm (số minh hoạ) có sai số $e_1 = 1$, $e_2 = -1$, $e_3 = 2$, $e_4 = 0$.</p>
          $$\text{RMSE} = \sqrt{\frac{e_1^2 + e_2^2 + \dots + e_n^2}{n}}$$
        introduces: [sub, dots]
        focus: [1, 1, 2, 2]
        say: "Mỗi lượt chấm có một sai số, bằng dự đoán trừ điểm thật. Ví dụ bốn lượt chấm có sai số 1, âm 1, 2 và 0, chữ e kèm số nhỏ phía dưới là sai số của lượt thứ mấy. Sai số căn quân phương là căn của trung bình các bình phương sai số. Dấu ba chấm nghĩa là cứ thế cộng tiếp tới lượt thứ n, và n là số lượt chấm."
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. bình phương từng sai số</td><td>1, (−1)², 2², 0²</td><td>1, 1, 4, 0</td></tr>
          <tr><td>Bước 2. trung bình</td><td>(1 + 1 + 4 + 0) / 4</td><td>1,5</td></tr>
          <tr><td>Bước 3. lấy căn</td><td>căn của 1,5</td><td>≈ $\hlg{1{,}22}$ sao</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Bước một, bình phương từng sai số được 1, 1, 4 và 0, nên sai số âm cũng bị tính như sai số dương. Bước hai, trung bình là 6 chia 4, bằng 1 phẩy 5. Bước ba, lấy căn được khoảng 1 phẩy 22 sao, cùng đơn vị với điểm chấm."
      - clear: true
        show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>tập công khai</b> (quiz)</td><td>nửa dữ liệu chấm điểm; điểm hiện lên bảng xếp hạng</td></tr>
          <tr><td><b>tập kín</b> (test)</td><td>nửa còn lại; điểm không công bố, dùng để chọn đội thắng</td></tr>
          <tr><td><b>dự đoán nền</b></td><td>trung bình chung, cộng độ lệch của người chấm, cộng độ lệch của phim</td></tr>
          <tr><td><b>bộ ghép</b></td><td>trộn dự đoán của nhiều mô hình thành một dự đoán</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài còn dùng bốn thuật ngữ nữa, ta đọc lần lượt từng dòng. Tập công khai là nửa dữ liệu chấm điểm, điểm của nó hiện lên bảng xếp hạng. Tập kín là nửa còn lại, điểm không công bố và được dùng để chọn đội thắng. Dự đoán nền là trung bình chung, cộng độ lệch của người chấm, cộng độ lệch của phim. Bộ ghép là cách trộn dự đoán của nhiều mô hình thành một dự đoán."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">10/2006</text><text x="160" y="200">mở cuộc thi</text><text x="160" y="232">tập kín để chấm</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2007</text><text x="500" y="200">giải năm đầu: 8,43%</text><text x="500" y="232">chỉ lấy 2 mô hình</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">10/2006 → 11/2007</text><text x="850" y="200">dữ liệu “ẩn danh”</text><text x="850" y="232">vẫn nhận ra được</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">7/2009</text><text x="1200" y="200">hàng trăm mô hình</text><text x="1200" y="232">vượt 10%, hoà điểm</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2012</text><text x="1540" y="200">không triển khai</text><text x="1540" y="232">thử nghiệm thật quyết định</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô lớn → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2006, cuộc thi mở ra với một tập kín để chấm. Năm 2007, giải năm đầu đạt 8 phẩy 43 phần trăm, công ty chỉ lấy hai mô hình. Song song, một nghiên cứu đăng bản đầu tháng 10 năm 2006 và bản sửa tháng 11 năm 2007 cho thấy dữ liệu tưởng ẩn danh vẫn nhận ra được người. Năm 2009, hàng trăm mô hình ghép lại vượt mốc 10 phần trăm. Năm 2012, công ty kể vì sao không triển khai bản thắng giải."

  # ───────────────────────── 5. CƠ CHẾ CHẤM ĐIỂM ─────────────────────────
  - id: split
    kind: concept
    title: "Cơ chế chung: chấm trên dữ liệu đội thi không thấy"
    steps:
      - show: |
          <div><svg width="1600" height="330" viewBox="0 0 1600 330">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="30" y="40" width="760" height="100" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/><text x="410" y="82">tập huấn luyện, có điểm</text><text x="410" y="116">≈ 100 triệu lượt chấm (gồm tập thăm dò ≈ 1,4 triệu)</text>
          <rect x="880" y="40" width="680" height="100" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1220" y="82">lượt chấm mới nhất, giấu điểm</text><text x="1220" y="116">≈ 2,8 triệu</text>
          <rect x="880" y="210" width="320" height="90" rx="10" fill="#fff4e5" stroke="#eb6834" stroke-width="3"/><text x="1040" y="248">tập công khai 50%</text><text x="1040" y="282">→ bảng xếp hạng</text>
          <rect x="1240" y="210" width="320" height="90" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="1400" y="248">tập kín 50%</text><text x="1400" y="282">→ chọn đội thắng</text>
          </g>
          <line x1="1100" y1="140" x2="1040" y2="205" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="1340" y1="140" x2="1400" y2="205" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <text x="410" y="230" font-size="22" fill="#6b7280" text-anchor="middle">đội thi học ở đây, tự kiểm trên tập thăm dò</text>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình này là cơ chế chấm điểm của cả cuộc thi, đội thi có khoảng 100 triệu lượt chấm có điểm để học, trong đó khoảng 1 phẩy 4 triệu lượt là tập thăm dò để tự kiểm. Khoảng 2 phẩy 8 triệu lượt chấm mới nhất bị giấu điểm và chia đôi ngẫu nhiên. Nửa công khai cho điểm lên bảng xếp hạng, còn nửa kín không công bố, chỉ dùng để chọn đội thắng."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2006 — khai sinh: mở dữ liệu và giữ một tập kín"
    stage: {year: "2006", scale: "công ty có hơn 1,9 tỉ lượt chấm của hơn 11,7 triệu người, nhận hơn 2 triệu lượt mỗi ngày; công bố 100 480 507 lượt của 480 189 người cho 17 770 phim", source: "[BL07] [KO09] [TJ09] [FH12]", practice: "đổi mục tiêu kinh doanh thành một con số đo được; chấm trên dữ liệu mới nhất mà đội thi không thấy; giữ điểm của tập kín không công bố"}
    checks:
      - "round(100480507 / (480189 * 17770) * 100, 2) == 1.18"
      - "int(0.9525 * 0.9 * 10000) == 8572 and round(0.9514 * 0.9, 4) == 0.8563"
    steps:
      - show: |
          <p><b>Quy mô</b> (công ty tự ghi, năm 2007): hơn <b>1,9 tỉ</b> lượt chấm của hơn <b>11,7 triệu</b> người, nhận hơn <b>2 triệu</b> lượt mỗi ngày. Hệ gợi ý cũ của công ty (Cinematch) tìm phim “giống nhau” bằng tương quan (hai phim hay được cùng một người chấm cùng cao, cùng thấp), chạy lại <b>mỗi tuần</b>.</p>
          <p><b>Điểm nghẽn:</b> hệ cũ chỉ tốt hơn “đoán bằng điểm trung bình của phim” khoảng 10%, mà “gợi ý tốt” lại khó chấm.</p>
          <p><b>Cách xử lý:</b> đổi câu hỏi thành một con số dễ chấm: <b>sai số căn quân phương</b> của điểm dự đoán. Công bố dữ liệu, giấu điểm của các lượt chấm <b>mới nhất</b>.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Ở chặng một, theo bài viết năm 2007 của chính công ty, họ có hơn 1 phẩy 9 tỉ lượt chấm của hơn 11 phẩy 7 triệu người, và nhận hơn 2 triệu lượt mỗi ngày. Hệ gợi ý cũ của công ty tìm phim giống nhau bằng tương quan, tức xem hai phim có hay được cùng một người chấm cùng cao, cùng thấp không, và chạy lại mỗi tuần. Điểm nghẽn là hệ cũ chỉ tốt hơn cách đoán bằng điểm trung bình của phim khoảng 10 phần trăm, mà gợi ý tốt lại là thứ khó chấm điểm. Cách xử lý là đổi câu hỏi thành một con số dễ chấm, sai số căn quân phương của điểm dự đoán. Công ty công bố dữ liệu, và giấu điểm của các lượt chấm mới nhất."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
