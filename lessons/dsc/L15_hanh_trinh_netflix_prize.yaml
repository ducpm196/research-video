        focus: [1, "1.2", "1.3", 2, 2]
        say: "Đáp án câu một là một đánh đổi. Ứng viên X cải thiện 0 phẩy 05 chia 0 phẩy 95, khoảng 5 phẩy 26 phần trăm, một người duy trì được và dễ cập nhật. Ứng viên Y cải thiện khoảng 6 phẩy 32 phần trăm, hơn X khoảng 1 phẩy 05 điểm, nhưng gấp 25 lần số mô hình phải huấn luyện lại và theo dõi. Nếu bộ ghép được chỉnh trên tập chấm chỉ 2000 lượt, mức lạc quan của Y khoảng 0 phẩy 028, lớn hơn cả phần Y hơn X là 0 phẩy 01. Mức lạc quan của X chỉ khoảng 0 phẩy 001."
