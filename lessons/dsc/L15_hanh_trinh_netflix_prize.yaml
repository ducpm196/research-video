          <tr><td>Y, 50 mô hình</td><td>(0,95 − 0,89) / 0,95 ≈ 6,32%</td><td>sai số thấp nhất ngoài máy</td><td>gấp 25 lần số mô hình phải huấn luyện lại, theo dõi</td></tr></table>
