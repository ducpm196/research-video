      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá DSC. Từ câu hỏi, dữ liệu sạch, thống kê bền vững, trực quan trung thực, nhân quả và thí nghiệm, tới báo cáo tái lập được, và một cuộc thi có thật, từ dữ liệu tới quyết định triển khai.</p>
        say: "Đây là bài cuối của khoá khoa học dữ liệu. Bạn đã đi từ câu hỏi, dữ liệu sạch, thống kê bền vững, trực quan trung thực, nhân quả và thí nghiệm, tới báo cáo tái lập được. Bài cuối đưa bạn qua một cuộc thi có thật, từ dữ liệu tới quyết định triển khai. Cảm ơn bạn đã theo học tới bài cuối cùng."
