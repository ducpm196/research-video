          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Bỏ tên, thêm chút nhiễu là công bố được”</td><td>dữ liệu thưa: 2 lượt chấm có ngày đã đủ tìm ra 68% số hồ sơ</td><td>hỏi “người biết vài điều về ai đó thì tìm được gì?” trước khi công bố</td></tr>
