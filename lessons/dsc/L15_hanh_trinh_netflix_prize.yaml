        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba là nghĩ bỏ tên, thêm chút nhiễu là công bố được, trong khi với dữ liệu thưa, 2 lượt chấm có ngày đã đủ tìm ra 68 phần trăm số hồ sơ. Trước khi công bố, hãy hỏi một người biết vài điều về ai đó thì tìm được gì. Bài học sai thứ tư ở mức hệ thống là nghĩ sai số nhỏ hơn là khách hài lòng hơn, trong khi sai số chỉ là câu hỏi thay thế. Công ty tin giờ xem cùng tỉ lệ ở lại, nên hãy đo ngoài máy để chọn, và thử nghiệm chia nhóm ngẫu nhiên để quyết."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
