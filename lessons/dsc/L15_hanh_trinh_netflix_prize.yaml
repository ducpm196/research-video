          <tr><td>1</td><td>Ứng viên X: ghép 2 mô hình, sai số 0,90. Ứng viên Y: ghép 50 mô hình, sai số 0,89. Đưa cái nào vào chạy thật?</td></tr>
          <tr><td>2</td><td>Sếp muốn công bố lịch sử mua (đã bỏ tên) để mở một cuộc thi nhỏ. Bạn nói gì?</td></tr></table>
