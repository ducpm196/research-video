scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Máy tính chỉ có công tắc bật và tắt"
    checks:
      - "int('101111', 2) == 47 and int('2F', 16) == 47"
    steps:
      - show: |
          <p>Bên trong máy tính chỉ có hàng tỉ công tắc điện tử, mỗi cái <b>bật</b> hoặc <b>tắt</b>.</p>
          <p>Vậy số 47, chữ “A”, một điểm ảnh màu đỏ được lưu thế nào?</p>
        focus: [1, 2]
        say: "Chào bạn, bên trong máy tính chỉ có hàng tỉ công tắc điện tử, mỗi cái hoặc bật hoặc tắt. Vậy số 47, chữ A, hay một điểm ảnh màu đỏ được lưu bằng cách nào?"
      - show: |
          <div class="box key">Câu trả lời: viết mọi thứ bằng hai chữ số 0 và 1. Hôm nay: bit, byte, hệ nhị phân và hệ thập lục phân.</div>
        say: "Câu trả lời là viết mọi thứ chỉ bằng hai chữ số 0 và 1. Hôm nay ta học bit, byte, hệ nhị phân và hệ thập lục phân."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: giá trị theo vị trí, lũy thừa và phép chia có dư"
    checks:
      - "3 * 100 + 4 * 10 + 7 * 1 == 347 and [10 ** k for k in range(3)] == [1, 10, 100]"
      - "[2 ** k for k in range(4)] == [1, 2, 4, 8] and 2 ** 3 == 2 * 2 * 2"
      - "divmod(47, 2) == (23, 1) and 2 * 23 + 1 == 47"
    steps:
      - show: |
          <table class="t"><tr><th>vị trí</th><th>trăm</th><th>chục</th><th>đơn vị</th></tr>
          <tr><td>giá trị</td><td>$10^2 = 100$</td><td>$10^1 = 10$</td><td>$10^0 = 1$</td></tr>
          <tr><td>chữ số của 347</td><td>3</td><td>4</td><td>7</td></tr></table>
          <p>$347 = 3 \times 100 + 4 \times 10 + 7 \times 1$.</p>
        focus: ["1.2", "1.3", 2]
        say: "Trước hết, ôn lại cách ta vẫn viết số hằng ngày. Trong số 347, mỗi vị trí mang một giá trị, hàng trăm là 10 mũ 2, hàng chục là 10 mũ 1, hàng đơn vị là 10 mũ 0 bằng 1. Vậy 347 bằng 3 nhân 100, cộng 4 nhân 10, cộng 7 nhân 1."
      - show: |
          <p>Lũy thừa: $2^3 = 2 \times 2 \times 2 = 8$. Dãy $2^0, 2^1, 2^2, 2^3$ là $1, 2, 4, 8$ — mỗi số gấp đôi số trước.</p>
          <p>Chia có dư: $47 = 2 \times 23 + 1$, tức 47 chia 2 được 23, <b>dư 1</b>.</p>
        focus: [1, 1, 2]
        say: "Lũy thừa 2 mũ 3 nghĩa là nhân 2 với chính nó ba lần, bằng 8. Dãy 2 mũ 0, 2 mũ 1, 2 mũ 2, 2 mũ 3 là 1, 2, 4, 8, mỗi số gấp đôi số đứng trước. Còn phép chia có dư thì như sau, 47 bằng 2 nhân 23 cộng 1, tức 47 chia 2 được 23 và còn dư 1."

  - id: sym
    kind: symbol
    title: "Giải mã: bit, byte, cơ số viết ở chỉ số dưới"
    checks:
      - "2 ** 8 == 256 and int('11111111', 2) == 255"
    steps:
      - show: |
          <p><b>bit</b>: một chữ số nhị phân, 0 hoặc 1 — một công tắc.</p>
          <p><b>byte</b>: 8 bit đi liền nhau, biểu diễn được $2^8 = 256$ giá trị, từ 0 đến 255.</p>
          <p>Cơ số ghi ở chỉ số dưới: $101_2$ là “một không một” hệ hai; $101_{10}$ là một trăm lẻ một.</p>
        introduces: [sub, sub2]
        focus: [1, 2, 2, 3]
        say: "Một bit là một chữ số nhị phân, 0 hoặc 1, giống một công tắc. Một byte là 8 bit đi liền nhau, biểu diễn được 2 mũ 8 bằng 256 giá trị. Các giá trị đó đi từ 0 đến 255. Để khỏi nhầm, ta ghi cơ số ở chỉ số dưới, có thể một hoặc hai chữ số, như 2, 10 hay 16, nên 1 0 1 hệ hai khác hẳn một trăm lẻ một hệ mười."

  # ───────────────────────── 3. NHỊ PHÂN ─────────────────────────
  - id: binary
    kind: concept
    title: "Hệ nhị phân: giá trị theo vị trí"
    checks:
      - "32 + 8 + 4 + 2 + 1 == 47 and int('101111', 2) == 47"
      - "[47 >> k & 1 for k in range(6)] == [1, 1, 1, 1, 0, 1]"
    steps:
      - show: |
          <table class="t"><tr><th>vị trí</th><th>$2^5$</th><th>$2^4$</th><th>$2^3$</th><th>$2^2$</th><th>$2^1$</th><th>$2^0$</th></tr>
          <tr><td>giá trị</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr>
          <tr><td>chữ số của 47</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>
          <p>$101111_2 = 32 + 8 + 4 + 2 + 1 = 47$.</p>
        focus: ["1.2", "1.3", 2]
        say: "Giống hệ mười, mỗi vị trí có một giá trị, nhưng là các lũy thừa của 2, từ phải sang trái 1, 2, 4, 8, 16, 32. Số 47 có chữ số 1 ở mọi vị trí trừ vị trí 16. Cộng các giá trị có chữ số 1, 32 cộng 8 cộng 4 cộng 2 cộng 1, đúng bằng 47."
      - show: |
          <p><b>Đổi thập phân sang nhị phân</b>: chia liên tiếp cho 2, ghi số dư, rồi đọc <b>ngược</b> từ dưới lên.</p>
          <p>$47 \to$ dư 1, $23 \to$ dư 1, $11 \to$ dư 1, $5 \to$ dư 1, $2 \to$ dư 0, $1 \to$ dư 1 &nbsp;⟹&nbsp; đọc ngược: $101111_2$.</p>
        focus: [1, 2, 2]
        say: "Muốn đổi ngược từ hệ mười sang hệ hai, ta chia liên tiếp cho 2 và ghi lại số dư. Với 47, các số dư lần lượt là 1, 1, 1, 1, 0, 1. Số dư đầu tiên là chữ số hàng đơn vị, nên ta đọc ngược từ dưới lên, được 1 0, 1 1 1 1."

  # ───────────────────────── 4. THẬP LỤC PHÂN ─────────────────────────
  - id: hex
    kind: concept
    title: "Hệ thập lục phân: mỗi chữ số là 4 bit"
    checks:
      - "int('0010', 2) == 2 and int('1111', 2) == 15 and 2 * 16 + 15 == 47 and hex(47) == '0x2f'"
    steps:
      - show: |
          <p>Hệ 16 dùng 16 chữ số: 0–9 rồi A, B, C, D, E, F (= 10 đến 15). Một chữ số hệ 16 = đúng <b>4 bit</b>.</p>
          <p>$47 = 0010\;1111_2$ → nhóm 4 bit: $0010 = 2$, $1111 = 15 = F$ → $2F_{16}$. &nbsp; Kiểm: $2 \times 16 + 15 = 47$ ✓</p>
          <div class="code"><div>0x2F == 47 == 0b101111     # tiền tố trong mã: 0x hệ 16, 0b hệ 2</div></div>
        focus: [1, 1, 2, 2, 3]
        say: "Hệ mười sáu dùng 16 chữ số, từ 0 đến 9 rồi A đến F, tức là 10 đến 15. Điều tiện lợi là mỗi chữ số hệ mười sáu ứng với đúng 4 bit. Viết 47 thành 8 bit rồi chia thành hai nhóm 4 bit, nhóm đầu là 2, nhóm sau là 15, tức F, nên được 2F. Kiểm lại, 2 nhân 16 cộng 15 bằng 47. Trong mã nguồn, người ta ghi tiền tố 0x cho hệ mười sáu và 0b cho hệ hai."

  # ───────────────────────── 5. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Tám công tắc, mỗi cái mang một giá trị"
    checks:
      - "128 + 64 + 8 == 200 and int('1100', 2) == 12 and int('1000', 2) == 8"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><rect x="180" y="70" width="120" height="110" rx="14" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="240" y="145" font-size="48" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><text x="240" y="50" font-size="26" text-anchor="middle" fill="#2a78d6">128</text><line x1="240" y1="185" x2="240" y2="232" stroke="#15803d" stroke-width="3"/><rect x="330" y="70" width="120" height="110" rx="14" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="390" y="145" font-size="48" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><text x="390" y="50" font-size="26" text-anchor="middle" fill="#2a78d6">64</text><line x1="390" y1="185" x2="390" y2="232" stroke="#15803d" stroke-width="3"/><rect x="480" y="70" width="120" height="110" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="540" y="145" font-size="48" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><text x="540" y="50" font-size="26" text-anchor="middle" fill="#2a78d6">32</text><rect x="630" y="70" width="120" height="110" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="690" y="145" font-size="48" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><text x="690" y="50" font-size="26" text-anchor="middle" fill="#2a78d6">16</text><rect x="780" y="70" width="120" height="110" rx="14" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="840" y="145" font-size="48" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><text x="840" y="50" font-size="26" text-anchor="middle" fill="#2a78d6">8</text><line x1="840" y1="185" x2="840" y2="232" stroke="#15803d" stroke-width="3"/><rect x="930" y="70" width="120" height="110" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="990" y="145" font-size="48" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><text x="990" y="50" font-size="26" text-anchor="middle" fill="#2a78d6">4</text><rect x="1080" y="70" width="120" height="110" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="1140" y="145" font-size="48" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><text x="1140" y="50" font-size="26" text-anchor="middle" fill="#2a78d6">2</text><rect x="1230" y="70" width="120" height="110" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="1290" y="145" font-size="48" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><text x="1290" y="50" font-size="26" text-anchor="middle" fill="#2a78d6">1</text><line x1="240" y1="232" x2="840" y2="232" stroke="#15803d" stroke-width="3"/><g font-size="26" text-anchor="middle" fill="#1f2937"><text x="540" y="270" fill="#15803d">bật: 128 + 64 + 8 = 200</text><text x="75" y="50" fill="#2a78d6">giá trị</text><text x="75" y="135">bit</text></g><g fill="none" stroke="#eb6834" stroke-width="3"><path d="M180,300 L180,315 L770,315 L770,300"/><path d="M780,300 L780,315 L1370,315 L1370,300"/></g><g font-size="26" text-anchor="middle" fill="#eb6834"><text x="475" y="350">nhóm đầu 1100 = 12 = C</text><text x="1075" y="350">nhóm sau 1000 = 8</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy một byte như một hàng tám công tắc. Mỗi công tắc mang một giá trị ghi phía trên, từ 128 ở bên trái xuống 1 ở bên phải. Công tắc nào bật thì giá trị của nó được cộng vào, ở đây ba công tắc 128, 64 và 8 bật, nên cả hàng biểu diễn 200. Gạch cam bên dưới chia tám công tắc thành hai nhóm 4, mỗi nhóm thành một chữ số hệ mười sáu, nhóm đầu là C, nhóm sau là 8."

  - id: example
    kind: example
    title: "Đổi 200 sang nhị phân và thập lục phân"
    checks:
      - "bin(200) == '0b11001000' and hex(200) == '0xc8'"
      - "128 + 64 + 8 == 200 and 12 * 16 + 8 == 200"
    steps:
      - show: |
          <p><b>Bước 1.</b> Lũy thừa của 2 lớn nhất không vượt 200: $256 \gt 200$ nên lấy $128$. Còn $200 - 128 = 72$.</p>
        say: "Bước một, tìm lũy thừa của 2 lớn nhất không vượt quá 200. Số 256 đã lớn hơn 200, nên ta lấy 128, công tắc 128 bật. Phần còn lại là 200 trừ 128, bằng 72."
      - show: |
          <p><b>Bước 2.</b> $64 \le 72$ nên lấy $64$. Còn $72 - 64 = 8$.</p>
        say: "Bước hai, xét 64, vì 64 không vượt quá 72 nên ta lấy nó, công tắc 64 bật. Phần còn lại là 72 trừ 64, bằng 8."
      - show: |
          <p><b>Bước 3.</b> $32 \gt 8$ và $16 \gt 8$ → bit 0. $8 \le 8$ → lấy $8$, còn $8 - 8 = 0$; ba bit 4, 2, 1 đều là 0.</p>
        say: "Bước ba, 32 và 16 đều lớn hơn 8, nên hai công tắc đó tắt, ghi bit 0. Đến 8 thì lấy được, phần còn lại bằng 0. Vì không còn gì để cộng, ba công tắc 4, 2 và 1 đều tắt."
      - show: |
          <table class="t"><tr><th>giá trị</th><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
          <tr><td>bit</td><td>1</td><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0</td></tr></table>
          <p><b>Bước 4.</b> $200 = 128 + 64 + 8 = 11001000_2$.</p>
        focus: [1, 2]
        say: "Bước bốn, ghi các bit theo thứ tự từ 128 xuống 1, như bảng này. Vậy 200 bằng 128 cộng 64 cộng 8, viết nhị phân là 1 1 0 0, 1 0 0 0."
      - show: |
          <p><b>Bước 5.</b> Nhóm 4 bit: $1100 = 12 = C$, $1000 = 8$ → $\hl{C8_{16}}$. &nbsp; Kiểm: $12 \times 16 + 8 = 200$ ✓</p>
        say: "Bước năm, chia thành nhóm 4 bit, nhóm đầu 1 1 0 0 là 12, tức C, nhóm sau 1 0 0 0 là 8, nên được C8 hệ mười sáu. Kiểm lại, 12 nhân 16 cộng 8 bằng 200."

  - id: units
    kind: concept
    title: "n bit biểu diễn bao nhiêu giá trị, và kB khác KiB"
    checks:
      - "[2 ** n for n in (8, 16, 32)] == [256, 65536, 4294967296]"
      - "2 ** 10 == 1024 and round(500e9 / 2 ** 30, 2) == 465.66"
    steps:
      - show: |
          <table class="t"><tr><th>số bit</th><th>số giá trị $2^n$</th></tr>
          <tr><td>8</td><td>256</td></tr><tr><td>16</td><td>65 536</td></tr><tr><td>32</td><td>4 294 967 296 (khoảng 4,3 tỉ)</td></tr></table>
          <p>Mỗi bit thêm vào <b>nhân đôi</b> số giá trị — giống bảng chân trị có $2^n$ dòng.</p>
        focus: [0, ["1.2", "1.3", "1.4"], 2]
        say: "Với n bit ta có 2 mũ n giá trị khác nhau, vì mỗi bit có hai khả năng. Tám bit cho 256 giá trị, 16 bit cho 65536, còn 32 bit cho khoảng 4 phẩy 3 tỉ. Mỗi bit thêm vào nhân đôi số giá trị, giống bảng chân trị có 2 mũ n dòng."
      - show: |
          <div class="box warn">$1\ \text{kB} = 1000$ byte, còn $1\ \text{KiB} = 2^{10} = 1024$ byte. Ổ đĩa ghi “500 GB” $= 500 \times 10^9$ byte $\approx 465{,}66$ GiB — máy báo thiếu nhưng không mất gì.</div>
        say: "Chú ý hai đơn vị dễ nhầm, ki-lô byte theo hệ mười là 1000 byte, còn đơn vị viết có chữ i ở giữa là 2 mũ 10 bằng 1024 byte. Ổ đĩa ghi 500 gi-ga byte theo hệ mười chỉ bằng khoảng 465 phẩy 66 đơn vị theo lũy thừa của 2. Máy báo thiếu dung lượng nhưng thật ra không mất gì."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: đổi lại bằng phép chia cho 2"
    checks:
      - "int('11001000', 2) == 200"
      - "[divmod(n, 2) for n in (200, 100, 50, 25, 12, 6, 3, 1)] == [(100, 0), (50, 0), (25, 0), (12, 1), (6, 0), (3, 0), (1, 1), (0, 1)]"
      - "''.join(str(r) for r in reversed([0, 0, 0, 1, 0, 0, 1, 1])) == '11001000'"
    steps:
      - show: |
          <table class="t"><tr><th>số</th><th>200</th><th>100</th><th>50</th><th>25</th><th>12</th><th>6</th><th>3</th><th>1</th></tr>
          <tr><td>chia 2, dư</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td></tr></table>
          <p>Đọc số dư từ phải sang trái: $11001000_2$ — khớp kết quả cách lấy lũy thừa ✓</p>
        focus: [1, 1, 2]
        say: "Kiểm bằng đường khác, ta dùng phép chia liên tiếp cho 2 đã học ở phần hệ nhị phân. Lần lượt 200, 100, 50, 25, 12, 6, 3, 1 chia cho 2, các số dư là 0, 0, 0, 1, 0, 0, 1, 1. Vì số dư đầu tiên là chữ số hàng đơn vị, ta đọc ngược từ số dư cuối về số dư đầu, được 1 1 0 0, 1 0 0 0, khớp với kết quả lấy lũy thừa."
      - show: |
          <table class="t"><tr><th>cách tự kiểm</th><th>với 200</th></tr>
          <tr><td>Đổi xong thì đổi ngược lại</td><td>$11001000_2 \to 128 + 64 + 8 = 200$ ✓</td></tr>
          <tr><td>Số bit cần cho số $N$: lũy thừa của 2 đầu tiên vượt $N$</td><td>8 bit, vì $2^7 = 128 \le 200 \lt 256 = 2^8$</td></tr>
          <tr><td>Đổi qua hệ 16: số bit phải chia hết cho 4, thiếu thì thêm 0 ở bên trái</td><td>8 bit = 2 nhóm 4</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, đổi xong thì đổi ngược lại để so. Hai, số bit cần cho một số N là số mũ của lũy thừa 2 đầu tiên vượt quá N, 200 cần 8 bit vì nó nằm giữa 128 và 256. Ba, khi đổi sang hệ mười sáu, số bit phải chia hết cho 4, thiếu thì thêm 0 ở bên trái."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "int('10', 2) == 2 and 2 ** 8 - 1 == 255"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đọc $10_2$ là “mười” <b class="red">(sai)</b>
          <br><span class="note">$10_2 = 2$. Luôn ghi cơ số khi có thể nhầm.</span></div>
        say: "Lỗi thứ nhất, đọc 1 0 hệ hai là mười. Thật ra nó bằng 2, nên luôn ghi rõ cơ số khi có thể nhầm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đọc số dư theo thứ tự chia <b class="red">(sai)</b>
          <br><span class="note">Số dư đầu tiên là chữ số hàng đơn vị — phải đọc ngược từ dưới lên.</span></div>
        say: "Lỗi thứ hai, đọc các số dư theo thứ tự chia. Số dư đầu tiên là chữ số hàng đơn vị, nên phải đọc ngược từ dưới lên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ một byte lưu được số 256 <b class="red">(sai)</b>
          <br><span class="note">8 bit có 256 giá trị nhưng bắt đầu từ 0, nên lớn nhất là $2^8 - 1 = 255$.</span></div>
        say: "Lỗi thứ ba, nghĩ một byte lưu được số 256. Tám bit có 256 giá trị, nhưng vì bắt đầu từ 0 nên số lớn nhất là 255."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Coi kB và KiB là một <b class="red">(sai)</b>
          <br><span class="note">Chênh 2,4% ở mức kilô, nhưng 7,4% ở mức giga:</span>
          $$\frac{2^{30}}{10^9} \approx 1{,}074$$</div>
        say: "Lỗi thứ tư, coi hai loại ki-lô byte là một. Ở mức ki-lô chỉ chênh 2 phẩy 4 phần trăm, nhưng ở mức gi-ga đã chênh khoảng 7 phẩy 4 phần trăm."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "bin(13) == '0b1101' and 0xFF == 255 and 2 ** 10 == 1024"
      - "13 - 8 == 5 and 5 - 4 == 1 and 15 * 16 == 240 and 240 + 15 == 255 and 2 * 256 == 512 and 2 * 512 == 1024"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Đổi 13 sang nhị phân.</td></tr>
          <tr><td>2</td><td>$FF_{16}$ bằng bao nhiêu trong hệ 10?</td></tr>
          <tr><td>3</td><td>10 bit biểu diễn được bao nhiêu giá trị?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, đổi 13 sang nhị phân. Câu hai, số F F hệ mười sáu bằng bao nhiêu trong hệ mười? Câu ba, 10 bit biểu diễn được bao nhiêu giá trị? Dừng video và làm ra giấy."
        pause: 8
      - show: |
          <table class="t"><tr><th>giá trị</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
          <tr><td>còn lại trước khi xét</td><td>13</td><td>5</td><td>1</td><td>1</td></tr>
          <tr><td>bit</td><td>1</td><td>1</td><td>0</td><td>1</td></tr></table>
          <p>① $13 = 8 + 4 + 1 = \hl{1101_2}$.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Đáp án câu một, làm như ví dụ 200. Lũy thừa lớn nhất không vượt 13 là 8, còn lại 5, lấy tiếp 4, còn lại 1. Số 2 lớn hơn 1 nên bit đó là 0, cuối cùng lấy 1. Vậy 13 bằng 8 cộng 4 cộng 1, viết là 1 1 0 1."
      - show: |
          <p>② $F = 15$: $15 \times 16 = 240$, rồi $240 + 15 = \hl{255}$ — byte lớn nhất.</p>
        say: "Câu hai, F bằng 15, nên F F bằng 15 nhân 16 cộng 15, bằng 255, chính là giá trị lớn nhất của một byte. Tính từng bước, 15 nhân 16 bằng 240, cộng thêm 15 được 255."
      - show: |
          <p>③ $2^8 = 256$, $2^9 = 2 \times 256 = 512$, $2^{10} = 2 \times 512 = \hl{1024}$.</p>
        say: "Câu ba, mỗi bit thêm vào nhân đôi số giá trị. Tám bit cho 256, chín bit cho 512, mười bit cho 2 nhân 512, tức 2 mũ 10 bằng 1024 giá trị."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bit: 0 hoặc 1</span><span class="a">→</span>
          <span class="n">vị trí: lũy thừa của 2</span><span class="a">→</span>
          <span class="n">hệ 16: 4 bit một chữ số</span><span class="a">→</span>
          <span class="n">$n$ bit: $2^n$ giá trị</span></div>
        say: "Tổng kết lại, bit là một chữ số 0 hoặc 1. Mỗi vị trí mang giá trị một lũy thừa của 2. Hệ mười sáu gom 4 bit thành một chữ số cho gọn. Với n bit ta có 2 mũ n giá trị."
      - show: |
          <div class="box key"><b>Tư duy:</b> cùng một dãy bit, ý nghĩa do <b>cách đọc</b> quyết định — số, chữ, màu hay lệnh máy.</div>
        say: "Điều cần mang theo, cùng một dãy bit có thể là số, là chữ, là màu hay là lệnh máy, ý nghĩa do cách đọc quyết định."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>số nguyên có dấu, bù 2 và tràn số</b> — máy tính viết số âm thế nào.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học cách máy tính viết số âm bằng phép bù 2, và hiện tượng tràn số. Hẹn gặp bạn ở bài tiếp theo."
