# Quy ước: cơ số ghi bằng chỉ số dưới ($101111_2$, $2F_{16}$); trong khối mã dùng tiền tố 0b, 0x. KiB = 1024 byte, kB = 1000 byte.
objectives:
  - "Đổi qua lại giữa thập phân, nhị phân, thập lục phân"
  - "Biết một byte là 8 bit và n bit biểu diễn được 2 mũ n giá trị"
  - "Phân biệt kB và KiB"
