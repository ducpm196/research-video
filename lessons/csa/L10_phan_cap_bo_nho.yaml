scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng phép cộng, số lần trượt khác 8 lần"
    checks:
      - "(lambda N: 4096 - alg.cache_hits(alg.addr_blocks([(i * N + j) * 8 for i in range(N) for j in range(N)], 64), 32, 1))(64) == 512"
      - "(lambda N: 4096 - alg.cache_hits(alg.addr_blocks([(i * N + j) * 8 for j in range(N) for i in range(N)], 64), 32, 1))(64) == 4096"
    steps:
      - show: |
          <p>Cộng mọi phần tử của một ma trận $64 \times 64$ số thực. Hai cách duyệt cho cùng một tổng:</p>
          <table class="t"><tr><th>cách duyệt</th><th>số lần trượt bộ nhớ đệm (mô phỏng)</th></tr>
          <tr><td>theo hàng</td><td>512</td></tr><tr><td>theo cột</td><td>$\hl{4096}$ — gấp 8 lần</td></tr></table>
        focus: [1, ["2.2", "2.3"], "2.3"]
        say: "Chào bạn, ta cộng mọi phần tử của một ma trận 64 nhân 64 số thực. Duyệt theo hàng hay theo cột thì tổng vẫn như nhau. Nhưng mô phỏng bộ nhớ đệm cho thấy duyệt theo cột trượt 4096 lần, gấp 8 lần duyệt theo hàng."
      - show: |
          <div class="box key">Vì sao? Hôm nay: các tầng bộ nhớ, thời gian truy cập trung bình, và tính cục bộ.</div>
        say: "Vì sao lại như vậy? Hôm nay ta học các tầng bộ nhớ, thời gian truy cập trung bình, và tính cục bộ."

  # ───────────────────────── 2. CÁC TẦNG ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần trăm, byte và vị trí trong ma trận"
    checks:
      - "5 / 100 == 0.05 and 0.05 * 100 == 5 and 1 + 5 == 6"
      - "64 // 8 == 8 and 64 * 64 == 4096"
      - "(1 * 64 + 2) * 8 == 528 and (0 * 64 + 1) * 8 == 8"
    steps:
      - show: |
          <table class="t"><tr><th>viết</th><th>bằng</th></tr>
          <tr><td>5%</td><td>$\frac{5}{100} = 0{,}05$</td></tr>
          <tr><td>5% của 100 chu kỳ</td><td>$0{,}05 \times 100 = 5$ chu kỳ</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước hết, ôn hai phép tính sẽ dùng. Năm phần trăm nghĩa là 5 chia 100, tức 0 phẩy 05. Vì vậy 5 phần trăm của 100 chu kỳ là 0 phẩy 05 nhân 100, bằng 5 chu kỳ."
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>giá trị</th></tr>
          <tr><td>một số thực 64 bit</td><td>8 byte</td></tr>
          <tr><td>ma trận $64 \times 64$</td><td>4096 phần tử</td></tr>
          <tr><td>phần tử hàng $i$, cột $j$, lưu theo hàng</td><td>byte thứ $(i \times 64 + j) \times 8$</td></tr></table>
          <p>Ví dụ hàng 1, cột 2: $(1 \times 64 + 2) \times 8 = 528$.</p>
        focus: ["1.2", "1.3", "1.4", 2]
        say: "Ở bài 0, ta biết một byte là 8 bit, nên một số thực 64 bit chiếm 8 byte. Ma trận 64 nhân 64 có 4096 phần tử. Khi lưu theo hàng, hết hàng 0 mới tới hàng 1, nên phần tử ở hàng i cột j nằm ở byte thứ i nhân 64 cộng j, tất cả nhân 8. Ví dụ hàng 1 cột 2 nằm ở byte thứ 528."

  - id: sym
    kind: symbol
    title: "Giải mã: các tầng bộ nhớ"
    steps:
      - show: |
          <table class="t"><tr><th>tầng</th><th>dung lượng (cỡ)</th><th>độ trễ (cỡ độ lớn)</th></tr>
          <tr><td>thanh ghi</td><td>vài trăm byte</td><td>dưới 1 ns</td></tr>
          <tr><td>bộ nhớ đệm tầng 1, 2, 3 (L1, L2, L3)</td><td>vài chục KiB tới vài chục MiB</td><td>1 – 40 ns</td></tr>
          <tr><td>bộ nhớ chính</td><td>vài GiB tới vài trăm GiB</td><td>khoảng 100 ns</td></tr>
          <tr><td>ổ SSD</td><td>hàng trăm GB tới vài TB</td><td>hàng chục tới hàng trăm µs</td></tr></table>
          <p class="note">Càng xa bộ xử lý càng lớn, càng rẻ, càng chậm. Số liệu là cỡ độ lớn thường gặp, không phải của một máy cụ thể.</p>
        focus: [0, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bộ nhớ được xếp thành nhiều tầng. Thanh ghi chỉ vài trăm byte, truy cập dưới một na-nô giây. Bộ nhớ đệm gồm vài tầng, từ vài chục nghìn đến vài chục triệu byte, mất từ một tới vài chục na-nô giây. Bộ nhớ chính lớn hơn nhiều, nhưng mất khoảng 100 na-nô giây. Ổ thể rắn còn lớn hơn, nhưng chậm hơn bộ nhớ chính hàng trăm tới hàng nghìn lần. Càng xa bộ xử lý càng lớn, càng rẻ và càng chậm, các con số là cỡ độ lớn thường gặp."

  # ───────────────────────── 3. CỤC BỘ ─────────────────────────
  - id: locality
    kind: concept
    title: "Tính cục bộ: vì sao bộ nhớ đệm có ích"
    steps:
      - show: |
          <p><b>Cục bộ thời gian</b>: ô vừa dùng sẽ sớm được dùng lại (biến đếm vòng lặp, tổng tích lũy).</p>
          <p><b>Cục bộ không gian</b>: ô gần ô vừa dùng sẽ sớm được dùng (phần tử kế tiếp của mảng).</p>
          <div class="box key">Bộ nhớ đệm chép nguyên một <b>dòng</b> (thường 64 byte = 8 số thực 64 bit) mỗi lần trượt — tận dụng cục bộ không gian.</div>
        focus: [1, 1, 2, 3]
        say: "Bộ nhớ đệm có ích nhờ tính cục bộ của chương trình. Cục bộ thời gian, ô vừa dùng sẽ sớm được dùng lại, như biến đếm vòng lặp. Cục bộ không gian, ô nằm gần ô vừa dùng sẽ sớm được dùng, như phần tử kế tiếp của mảng. Vì vậy mỗi lần trượt, bộ nhớ đệm chép nguyên một dòng, thường là 64 byte, tức 8 số thực."

  # ───────────────────────── 4. AMAT ─────────────────────────
  - id: amat
    kind: concept
    title: "Thời gian truy cập trung bình"
    checks:
      - "1 + 0.05 * 100 == 6"
      - "1 + 0.05 * (10 + 0.2 * 100) == 2.5"
    steps:
      - show: |
          <div class="box key">Thời gian trung bình = thời gian trúng + tỉ lệ trượt × thời gian phạt khi trượt</div>
          <p>Trúng 1 chu kỳ, trượt 5%, phạt 100 chu kỳ: $1 + 0{,}05 \times 100 = \hl{6}$ chu kỳ.</p>
          <p>Thêm tầng L2 (10 chu kỳ, trượt 20% số lần tới nó): $1 + 0{,}05 \times (10 + 0{,}2 \times 100) = \hl{2{,}5}$ chu kỳ.</p>
        focus: [1, 2, 3]
        say: "Thời gian truy cập trung bình bằng thời gian khi trúng, cộng tỉ lệ trượt nhân thời gian phạt khi trượt. Ví dụ trúng mất 1 chu kỳ, trượt 5 phần trăm, mỗi lần trượt phạt 100 chu kỳ, ta được 1 cộng 0 phẩy 05 nhân 100, bằng 6 chu kỳ. Thêm một tầng thứ hai mất 10 chu kỳ, và chỉ 20 phần trăm số lần tới nó bị trượt tiếp, thời gian trung bình giảm còn 2 phẩy 5 chu kỳ."

  # ───────────────────────── 5. VÍ DỤ: HÀNG VÀ CỘT ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đi dọc một dòng hay nhảy qua các dòng"
    checks:
      - "64 // 8 == 8 and 8 - 1 == 7 and 64 * 8 == 512"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><defs><marker id="arC10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="arG10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><text x="70" y="102" font-size="24" fill="#1f2937">hàng 0</text><rect x="190" y="60" width="90" height="60" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><rect x="280" y="60" width="90" height="60" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><rect x="370" y="60" width="90" height="60" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><rect x="460" y="60" width="90" height="60" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><rect x="550" y="60" width="90" height="60" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><rect x="640" y="60" width="90" height="60" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><rect x="730" y="60" width="90" height="60" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><rect x="820" y="60" width="90" height="60" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><rect x="190" y="60" width="720" height="60" fill="none" stroke="#2a78d6" stroke-width="4"/><text x="930" y="100" font-size="22" fill="#2a78d6">64 byte = một dòng</text><text x="70" y="202" font-size="24" fill="#1f2937">hàng 1</text><rect x="190" y="160" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="280" y="160" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="370" y="160" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="460" y="160" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="550" y="160" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="640" y="160" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="730" y="160" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="820" y="160" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="190" y="160" width="720" height="60" fill="none" stroke="#2a78d6" stroke-width="4"/><text x="930" y="200" font-size="22" fill="#2a78d6">64 byte = một dòng</text><text x="70" y="302" font-size="24" fill="#1f2937">hàng 2</text><rect x="190" y="260" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="280" y="260" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="370" y="260" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="460" y="260" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="550" y="260" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="640" y="260" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="730" y="260" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="820" y="260" width="90" height="60" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><rect x="190" y="260" width="720" height="60" fill="none" stroke="#2a78d6" stroke-width="4"/><text x="930" y="300" font-size="22" fill="#2a78d6">64 byte = một dòng</text><line x1="200" y1="40" x2="890" y2="40" stroke="#15803d" stroke-width="4" marker-end="url(#arG10)"/><text x="545" y="30" font-size="22" text-anchor="middle" fill="#15803d">theo hàng: 1 trượt rồi 7 trúng</text><g stroke="#b91c1c" stroke-width="4" fill="none"><path d="M235,120 L235,155" marker-end="url(#arC10)"/><path d="M235,220 L235,255" marker-end="url(#arC10)"/></g><text x="190" y="370" font-size="22" fill="#b91c1c">theo cột: mỗi bước sang dòng khác, cách 512 byte, trượt</text><text x="1150" y="190" font-size="22" fill="#1f2937">… 64 hàng</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ ba hàng đầu của ma trận, mỗi khung xanh là một dòng của bộ nhớ đệm, dài 64 byte, chứa 8 phần tử liền nhau. Đi theo hàng, mũi tên xanh lá chạy dọc một dòng, lần đầu trượt và nạp cả dòng, 7 phần tử sau đều trúng. Đi theo cột, mũi tên đỏ nhảy thẳng xuống hàng kế tiếp, cách 512 byte, tức sang một dòng khác hẳn, nên lần nào cũng phải nạp dòng mới. Bảy phần tử còn lại của mỗi dòng mới nạp chỉ có ích nếu dòng đó còn nằm trong bộ nhớ đệm khi ta quay lại."

  - id: example
    kind: example
    title: "Duyệt ma trận theo hàng và theo cột"
    checks:
      - "64 // 8 == 8 and 4096 // 8 == 512"
      - "64 * 8 == 512 and 2048 // 64 == 32 and 64 > 32 and 64 * 64 == 4096 and 4096 // 512 == 8"
    steps:
      - show: |
          <p>Ma trận lưu <b>theo hàng</b>: $a[i][0], a[i][1], \dots$ nằm liền nhau.</p>
          <p><b>Bước 1.</b> Một dòng chứa $\frac{64}{8} = 8$ phần tử liền nhau của cùng một hàng.</p>
        focus: [1, 2, 2]
        say: "Ma trận được lưu theo hàng, nghĩa là các phần tử của cùng một hàng nằm liền nhau. Bước một, mỗi phần tử 8 byte, nên một dòng chứa 64 chia 8, bằng 8 phần tử. Mỗi dòng dài 64 byte, chứa 8 phần tử liền nhau của cùng một hàng."
      - show: |
          <p><b>Bước 2.</b> Theo hàng: trượt 1 lần nạp 8 phần tử dùng ngay:</p>
          $$\frac{4096}{8} = 512 \ \text{lần trượt}$$
        focus: [1, 2]
        say: "Bước hai, duyệt theo hàng, mỗi lần trượt nạp 8 phần tử và cả 8 được dùng ngay. Vì vậy 4096 phần tử chỉ gây 4096 chia 8, bằng 512 lần trượt."
      - show: |
          <p><b>Bước 3.</b> Theo cột: hai phần tử kế nhau cách một hàng, tức $64 \times 8 = 512$ byte — luôn ở hai dòng khác nhau.</p>
        say: "Bước ba, ta chuyển sang xét cách duyệt theo cột. Duyệt theo cột, mỗi bước nhảy sang hàng khác, cách nhau 512 byte. Vì 512 lớn hơn 64, hai phần tử kế nhau không bao giờ chung một dòng."
      - show: |
          <p><b>Bước 4.</b> Một cột chạm $64$ dòng khác nhau, nhiều hơn $\frac{2048}{64} = 32$ dòng mà bộ nhớ đệm 2 KiB trong mô phỏng giữ được → khi sang cột kế, dòng cũ đã bị đẩy ra → trượt cả $64 \times 64 = \hl{4096}$ lần.</p>
        say: "Bước bốn, một cột chạm tới 64 dòng khác nhau, trong khi bộ nhớ đệm 2048 byte trong mô phỏng chỉ giữ được 32 dòng. Với bộ nhớ đệm nhỏ trong mô phỏng, dòng cũ bị đẩy ra trước khi kịp dùng lại, nên lần nào cũng trượt. Tổng cộng 64 nhân 64, bằng 4096 lần trượt, gấp 8 lần duyệt theo hàng."

  - id: verify
    kind: check
    title: "Tự kiểm: đếm thẳng và tính trên 1000 lần truy cập"
    checks:
      - "1 + 0.1 * 50 == 6"
      - "sum(1 for i in range(64) for j in range(64) if j % 8 == 0) == 512"
      - "(lambda N: alg.cache_hits(alg.addr_blocks([(i * N + j) * 8 for i in range(N) for j in range(N)], 64), 32, 1))(64) == 3584 and 4096 - 3584 == 512"
      - "1000 * 1 + 50 * 10 + 10 * 100 == 2500 and 2500 / 1000 == 2.5 and round(1000 * 0.05) == 50 and round(50 * 0.2) == 10"
    steps:
      - show: |
          <table class="t"><tr><th>cách đếm khác</th><th>kết quả</th></tr>
          <tr><td>theo hàng: trượt khi cột $j$ là 0, 8, 16, …, 56 — 8 lần mỗi hàng, 64 hàng</td><td>$8 \times 64 = 512$ ✓</td></tr>
          <tr><td>cho máy mô phỏng chạy cả 4096 lần truy cập theo hàng</td><td>3584 trúng, $4096 - 3584 = 512$ trượt ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, ta không chia mà đếm thẳng. Theo hàng, chỉ trượt khi bắt đầu một dòng mới, tức khi cột là 0, 8, 16, cho tới 56, vậy mỗi hàng 8 lần, 64 hàng là 512 lần. Cho máy mô phỏng chạy thật cả 4096 lần truy cập, nó báo 3584 lần trúng, tức đúng 512 lần trượt."
      - show: |
          <table class="t"><tr><th>trong 1000 lần truy cập</th><th>số lần</th><th>chu kỳ</th></tr>
          <tr><td>mọi lần đều hỏi tầng đầu</td><td>1000</td><td>$1000 \times 1 = 1000$</td></tr>
          <tr><td>trượt tầng đầu, hỏi tầng hai: 5%</td><td>50</td><td>$50 \times 10 = 500$</td></tr>
          <tr><td>trượt tiếp, xuống bộ nhớ chính: 20% của 50</td><td>10</td><td>$10 \times 100 = 1000$</td></tr></table>
          <p>Tổng $2500$ chu kỳ, chia 1000 lần: $\hl{2{,}5}$ chu kỳ — khớp công thức ✓</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Với thời gian trung bình hai tầng, ta kiểm bằng cách đếm trên 1000 lần truy cập, vì trung bình chính là tổng chia số lần. Cả 1000 lần đều hỏi tầng đầu, tốn 1000 chu kỳ. Năm phần trăm, tức 50 lần, trượt và hỏi tầng hai, tốn thêm 500 chu kỳ. Hai mươi phần trăm của 50, tức 10 lần, trượt tiếp xuống bộ nhớ chính, tốn thêm 1000 chu kỳ. Tổng 2500 chu kỳ chia 1000 lần, được 2 phẩy 5, khớp với công thức."
      - clear: true
        show: |
          <table class="t"><tr><th>phép thử nhanh</th><th>vì sao</th></tr>
          <tr><td>Thời gian trung bình không thể nhỏ hơn thời gian khi trúng.</td><td>phần trượt chỉ cộng thêm</td></tr>
          <tr><td>Đổi tỉ lệ trượt từ phần trăm sang số thập phân trước khi nhân.</td><td>5% là 0,05</td></tr>
          <tr><td>Hỏi với mỗi vòng lặp lồng: vòng <b>trong cùng</b> có đi qua các ô liền nhau không?</td><td>cục bộ không gian</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, thời gian trung bình không thể nhỏ hơn thời gian khi trúng, vì phần trượt chỉ cộng thêm. Hai, đổi tỉ lệ trượt từ phần trăm sang số thập phân trước khi nhân. Ba, với mỗi vòng lặp lồng nhau, hỏi vòng trong cùng có đi qua các ô liền nhau không."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "64 ** 2 == 4096 and 4096 // 512 == 8"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ độ phức tạp như nhau thì tốc độ như nhau <b class="red">(sai)</b>
          <br><span class="note">Độ phức tạp = số phép tính cơ bản, đếm theo kích thước dữ liệu $n$. Cả hai cách duyệt đều làm $n^2$ phép cộng, nhưng số lần trượt bộ nhớ đệm khác 8 lần:</span>
          $$64^2 = 4096 \ \text{phép cộng}, \quad \frac{4096}{512} = 8$$</div>
        say: "Lỗi thứ nhất, nghĩ hai thuật toán cùng độ phức tạp thì chạy nhanh như nhau. Độ phức tạp ở đây là số phép tính cơ bản, đếm theo kích thước dữ liệu n. Cả hai cách duyệt đều cần n bình phương phép cộng, nhưng số lần trượt bộ nhớ đệm khác nhau 8 lần."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ mọi ngôn ngữ lưu ma trận theo hàng <b class="red">(sai)</b>
          <br><span class="note">C, Python (NumPy mặc định) lưu theo hàng; Fortran, MATLAB lưu theo cột — vòng lặp tối ưu cũng ngược lại.</span></div>
        say: "Lỗi thứ hai, nghĩ mọi ngôn ngữ đều lưu ma trận theo hàng. Một số ngôn ngữ lưu theo hàng, nhưng một số khác lưu theo cột, khi đó cách duyệt tối ưu cũng ngược lại."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ danh sách liên kết nhanh như mảng khi duyệt <b class="red">(sai)</b>
          <br><span class="note">Các nút nằm rải rác trong bộ nhớ, mỗi bước có thể trượt bộ nhớ đệm; mảng được nạp mỗi lần cả một dòng nhiều phần tử.</span></div>
        say: "Lỗi thứ ba, nghĩ duyệt danh sách liên kết nhanh như duyệt mảng. Các nút nằm rải rác trong bộ nhớ, nên mỗi bước có thể trượt, trong khi mảng được nạp mỗi lần cả một dòng nhiều phần tử."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Lấy số độ trễ trên mạng làm số chính xác cho máy mình <b class="red">(sai)</b>
          <br><span class="note">Các con số chỉ là cỡ độ lớn; muốn biết thật phải đo trên máy đó.</span></div>
        say: "Lỗi thứ tư, lấy các con số độ trễ đọc được làm số chính xác cho máy mình. Chúng chỉ là cỡ độ lớn, muốn biết thật thì phải đo trên chính máy đó."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "1 + 0.1 * 50 == 6 and 1 + 0.02 * 50 == 2"
      - "1024 // 16 == 64"
      - "abs(0.1 * 50 - 5) < 1e-12 and abs(0.02 * 50 - 1) < 1e-12 and 6 / 2 == 3 and 64 // 4 == 16 and 16 - 1 == 15"
      - "alg.cache_hits(alg.addr_blocks([4 * k for k in range(1024)], 64), 32, 1) == 1024 - 64"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Trúng 1 chu kỳ, trượt 10%, phạt 50 chu kỳ: thời gian trung bình? Nếu giảm tỉ lệ trượt còn 2%?</td></tr>
          <tr><td>2</td><td>Mỗi dòng dài 64 byte; duyệt tuần tự mảng 1024 số nguyên 4 byte: bao nhiêu lần trượt (bộ nhớ đệm ban đầu rỗng)?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, trúng mất 1 chu kỳ, trượt 10 phần trăm, phạt 50 chu kỳ, thời gian trung bình là bao nhiêu, và nếu tỉ lệ trượt giảm còn 2 phần trăm thì sao? Câu hai, mỗi dòng dài 64 byte, duyệt tuần tự một mảng 1024 số nguyên 4 byte, bộ nhớ đệm ban đầu rỗng, thì trượt bao nhiêu lần? Dừng video và làm ra giấy."
        pause: 10
      - show: |
          <table class="t"><tr><th>tỉ lệ trượt</th><th>phần phạt</th><th>trung bình</th></tr>
          <tr><td>10% = 0,1</td><td>$0{,}1 \times 50 = 5$</td><td>$1 + 5 = \hl{6}$ chu kỳ</td></tr>
          <tr><td>2% = 0,02</td><td>$0{,}02 \times 50 = 1$</td><td>$1 + 1 = \hl{2}$ chu kỳ</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, đổi phần trăm sang số thập phân trước. Với 10 phần trăm, phần phạt là 0 phẩy 1 nhân 50, bằng 5, cộng thời gian trúng 1 được 6 chu kỳ. Với 2 phần trăm, phần phạt chỉ còn 0 phẩy 02 nhân 50, bằng 1, nên trung bình còn 2 chu kỳ, nhanh gấp 3 lần."
      - show: |
          <p>② Mỗi dòng chứa $\frac{64}{4} = 16$ số; lần đầu vào mỗi dòng trượt, 15 lần sau trúng → $\frac{1024}{16} = \hl{64}$ lần trượt.</p>
        say: "Câu hai, mỗi dòng chứa 64 chia 4, bằng 16 số nguyên. Duyệt tuần tự thì lần đầu vào mỗi dòng trượt, 15 lần sau trúng, nên 1024 số gây 1024 chia 16, bằng 64 lần trượt."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tầng: càng xa càng lớn, càng chậm</span><span class="a">→</span>
          <span class="n">cục bộ thời gian và không gian</span><span class="a">→</span>
          <span class="n">trung bình = trúng + trượt × phạt</span><span class="a">→</span>
          <span class="n">vòng trong cùng đi qua ô liền nhau</span></div>
        say: "Tổng kết lại, bộ nhớ chia tầng, càng xa bộ xử lý càng lớn và càng chậm. Bộ nhớ đệm có ích nhờ cục bộ thời gian và không gian. Thời gian trung bình bằng thời gian trúng cộng tỉ lệ trượt nhân thời gian phạt. Và hãy cho vòng lặp trong cùng đi qua các ô liền nhau."
      - show: |
          <div class="box key"><b>Tư duy:</b> với máy tính hiện đại, di chuyển dữ liệu thường đắt hơn tính toán — thiết kế cấu trúc dữ liệu theo cách nó nằm trong bộ nhớ.</div>
        say: "Điều cần mang theo, với máy tính hiện đại, di chuyển dữ liệu thường đắt hơn tính toán, nên hãy thiết kế cấu trúc dữ liệu theo cách nó nằm trong bộ nhớ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>bộ nhớ đệm ánh xạ trực tiếp</b> — tách địa chỉ thành thẻ, chỉ số, độ dời.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta mở bên trong bộ nhớ đệm ánh xạ trực tiếp, và tách một địa chỉ thành thẻ, chỉ số và độ dời. Hẹn gặp bạn ở bài tiếp theo."
