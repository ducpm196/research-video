# Quy ước: “bộ nhớ đệm” = cache (tên tiếng Anh chỉ trên màn hình); AMAT = thời gian truy cập trung bình (tên viết tắt chỉ trên màn hình).
#   Độ trễ các tầng là CỠ ĐỘ LỚN thường gặp, không phải số của một máy cụ thể — ghi rõ trên màn hình.
objectives:
  - "Mô tả các tầng bộ nhớ và độ trễ cỡ độ lớn"
  - "Tính thời gian truy cập trung bình"
  - "Giải thích cục bộ thời gian và không gian, viết mã tận dụng chúng"
