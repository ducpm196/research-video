      y="250" fill="#b45309">1. nhìn đúng một dòng</text><text x="40" y="425" fill="#2a78d6">2. so hai ô thẻ viền xanh: bằng
      nhau và hợp lệ bằng 1 thì trúng</text><text x="1480" y="60" text-anchor="end" fill="#15803d">3. độ dời chọn byte 56
      trong dòng</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình cho thấy một lần tra bộ nhớ đệm. Địa chỉ ở trên được cắt thành ba trường, và trường giữa, chỉ số, trỏ thẳng
      vào đúng một dòng, ở đây là dòng 345, không phải dò qua 512 dòng. Dòng đó lưu một bit hợp lệ, một thẻ và 64 byte dữ
      liệu. Ta so thẻ của địa chỉ với thẻ đang lưu, hai ô viền xanh, nếu bằng nhau và bit hợp lệ bằng 1 thì trúng. Cuối cùng,
      độ dời chọn ra byte 56 trong 64 byte của dòng. Đánh số bến đậu xe cố định theo chữ số cuối biển số giúp tìm xe tức thì
      không cần chạy đi dò khắp bãi rộng.
- id: example
  kind: example
  title: Tách địa chỉ 0x12345678
  checks:
  - 0x12345678 & 63 == 56 and (0x12345678 >> 6) & 511 == 345 and 0x12345678 >> 15 == 0x2468
  - 0x12345678 & 0xFF == 0x78 == 120 and 511 == 2 ** 9 - 1 and 6 + 9 == 15
  steps:
  - show: '<div class="code"><div>do_doi = addr &amp; 63          # 6 bit thấp       → 56</div></div>

      <p><b>Bước 1.</b> $\texttt{0x12345678}$ có byte thấp $\texttt{0x78} = 120$; $120$ và $63 = 56$.</p>

      <p class="note"><b>Tính số dòng bộ nhớ đệm:</b> chia tổng dung lượng cho kích thước mỗi dòng, ví dụ <code>32 KiB / 64
      B = 512</code> dòng (cần 9 bit chỉ số).</p>

      '
    focus:
    - 1
    - 2
    - '2'
    say: Với địa chỉ 12345678 hệ mười sáu, dùng các phép toán bit của bài 2. Bước một, lấy 6 bit thấp bằng phép và với 63,
      được độ dời 56, vì byte thấp nhất là 78 hệ mười sáu, tức 120. Trước khi tách bit, ta lấy dung lượng chia cỡ dòng như
      ba hai ki-bi-bai chia sáu bốn được năm trăm mười hai dòng.
  - show: '<div class="code"><div>chi_so = (addr &gt;&gt; 6) &amp; 511  # 9 bit tiếp theo  → 345</div></div>

      <p><b>Bước 2.</b> Dịch phải 6 để bỏ độ dời, rồi và với $511 = 2^9 - 1$ để giữ 9 bit: chỉ số $345$.</p>

      '
    focus:
    - 1
    - 2
    say: Bước hai, dịch phải 6 để bỏ độ dời, rồi và với 511, tức chín bit 1, để giữ 9 bit tiếp theo. Dịch phải 6 rồi lấy 9
      bit, được chỉ số 345.
  - show: '<div class="code"><div>the    = addr &gt;&gt; 15          # 17 bit cao       → 0x2468</div></div>

      <p><b>Bước 3.</b> Dịch phải $6 + 9 = 15$ bit, phần còn lại là thẻ $\texttt{0x2468}$.</p>

      '
    focus:
    - 1
    - 2
    say: Bước ba, bỏ cả độ dời lẫn chỉ số, tức 6 cộng 9 bằng 15 bit. Dịch phải 15, được thẻ 2468 hệ mười sáu.
  - show: '<table class="t"><tr><th>dòng</th><th>hợp lệ</th><th>thẻ đang lưu</th><th>kết quả</th></tr>

      <tr><td>345</td><td>1</td><td>$\texttt{0x2468}$</td><td><b>trúng</b>: lấy byte 56 của dòng</td></tr>

      <tr><td>345</td><td>0, hoặc thẻ khác</td><td>—</td><td><b>trượt</b>: nạp cả khối 64 byte vào dòng 345</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    say: Bước bốn, tra dòng theo chỉ số vừa tách. Bộ nhớ đệm nhìn vào dòng 345, nếu dòng hợp lệ và có đúng thẻ đó thì trúng,
      ngược lại thì trượt và phải nạp cả khối 64 byte vào dòng đó. Khi trúng, độ dời 56 chọn ra đúng byte cần đọc.
- id: sim
  kind: concept
  title: 'Mô phỏng: trượt bắt buộc và trượt do xung đột'
  checks:
  - '[a // 64 for a in [0, 4, 64, 0, 32768, 0]] == [0, 0, 1, 0, 512, 0]'
  - alg.cache_hits([a // 64 for a in [0, 4, 64, 0, 32768, 0]], 512, 1) == 2
  steps:
  - show: '<table class="t"><tr><th>địa chỉ</th><th>khối</th><th>dòng</th><th>kết quả</th></tr>

      <tr><td>0</td><td>0</td><td>0</td><td>trượt (lần đầu)</td></tr>

      <tr><td>4</td><td>0</td><td>0</td><td>trúng</td></tr>

      <tr><td>64</td><td>1</td><td>1</td><td>trượt (lần đầu)</td></tr>

      <tr><td>0</td><td>0</td><td>0</td><td>trúng</td></tr>

      <tr><td>32 768</td><td>512</td><td>0</td><td>trượt — đẩy khối 0 ra</td></tr>

      <tr><td>0</td><td>0</td><td>0</td><td>$\hl{\text{trượt do xung đột}}$</td></tr></table>

      '
    focus:
    - - '1.2'
      - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Mô phỏng sáu lần truy cập. Hai lần đầu, địa chỉ 0 trượt vì lần đầu gặp, rồi địa chỉ 4 trúng vì cùng một khối 64 byte.
      Địa chỉ 64 thuộc khối mới nên trượt, rồi địa chỉ 0 trúng lại. Địa chỉ 32768 là khối 512, cũng rơi vào dòng 0, nên đẩy
      khối 0 ra ngoài. Lần cuối địa chỉ 0 trượt, dù bộ nhớ đệm còn trống rất nhiều dòng, gọi là trượt do xung đột.
- id: verify
  kind: check
  title: 'Tự kiểm: tách lại bằng phép chia hệ mười'
  checks:
  - 6 + 9 + 17 == 32
  - 0x12345678 == 305419896 and divmod(305419896, 64) == (4772185, 56) and divmod(4772185, 512) == (9320, 345) and 9320 ==
    0x2468
  - 9320 * 32768 + 345 * 64 + 56 == 0x12345678 and 9320 * 32768 == 305397760 and 345 * 64 == 22080
  steps:
  - show: '<table class="t"><tr><th>phép chia hệ mười</th><th>thương</th><th>dư</th></tr>

      <tr><td>$305\,419\,896$ chia 64 (cỡ dòng)</td><td>4 772 185</td><td>$\hl{56}$ = độ dời ✓</td></tr>

      <tr><td>$4\,772\,185$ chia 512 (số dòng)</td><td>$9320 = \texttt{0x2468}$ = thẻ ✓</td><td>$\hl{345}$ = chỉ số ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác, ta không dùng phép toán bit mà chia trong hệ mười, vì dịch phải 6 bit chính là chia lấy phần
      nguyên cho 64. Địa chỉ bằng 305419896, chia cho 64 được thương 4772185, dư 56, đúng độ dời. Lấy thương đó chia tiếp
      cho 512 được thương 9320, dư 345. Số dư 345 là chỉ số, còn 9320 đúng bằng 2468 hệ mười sáu, là thẻ.
  - show: '$$9320 \times 32\,768 + 345 \times 64 + 56 = 305\,397\,760 + 22\,080 + 56 = 305\,419\,896\ ✓$$

      '
    say: Vì mỗi giá trị thẻ ứng với 32768 byte và mỗi dòng ứng với 64 byte, ta ghép ngược lại được. Thẻ nhân 32768 cộng chỉ
      số nhân 64 cộng độ dời, được 305397760 cộng 22080 cộng 56, bằng đúng địa chỉ ban đầu.
  - clear: true
    show: '<table class="t"><tr><th>phép thử nhanh</th></tr>

      <tr><td>Ba trường cộng lại phải đủ độ dài địa chỉ: $6 + 9 + 17 = 32$.</td></tr>

      <tr><td>Hai địa chỉ cách nhau đúng bằng dung lượng bộ nhớ đệm (32 768) luôn rơi vào <b>cùng</b> dòng.</td></tr>

      <tr><td>Đếm trượt: lần đầu gặp một khối luôn trượt, dù bộ nhớ đệm lớn đến đâu.</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Tự kiểm bằng ba cách. Một, ba trường cộng lại phải đủ độ dài địa chỉ, 6 cộng 9 cộng 17 bằng 32. Hai, hai địa chỉ
      cách nhau đúng bằng dung lượng bộ nhớ đệm luôn rơi vào cùng một dòng, vì phần chỉ số giống nhau. Ba, lần đầu gặp một
      khối luôn trượt, dù bộ nhớ đệm lớn đến đâu.
- id: pitfalls
  kind: pitfall
  checks:
  - 32 * 1024 // 64 == 512 and 32 * 1024 != 512
  title: 4 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Tính số dòng = dung lượng chia 1 byte <b class="red">(sai)</b>

      <br><span class="note">Số dòng = dung lượng chia kích thước dòng, không phải 32 768:</span>

      $$\frac{32\,768}{64} = 512$$</div>

      '
    say: Lỗi thứ nhất, tính số dòng bằng dung lượng chia một byte. Số dòng bằng dung lượng chia kích thước mỗi dòng, 32768
      chia 64 bằng 512. Hai mảng dữ liệu có khoảng cách đúng bằng bội số kích thước bộ nhớ đệm sẽ đẩy nhau bay khỏi cùng một
      ô liên tục. Hai biến đọc lặp lại liên tiếp có địa chỉ cách đúng kích thước tầng đệm ánh xạ trực tiếp đánh bật nhau từng
      bước.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Lấy chỉ số từ bit cao của địa chỉ <b class="red">(sai)</b>

      <br><span class="note">Chỉ số ngay trên độ dời: các khối liền nhau rơi vào các dòng liền nhau — đúng điều tính cục bộ
      không gian cần.</span></div>

      '
    say: Lỗi thứ hai, lấy chỉ số từ các bit cao của địa chỉ. Chỉ số nằm ngay trên độ dời, để các khối liền nhau rơi vào các
      dòng liền nhau, đúng điều tính cục bộ không gian cần. Nhầm lẫn thứ tự trích xuất ba phần thẻ, chỉ số và độ dời từ phải
      sang trái làm lệch hoàn toàn ánh xạ. Nhầm vị trí bit thẻ cao nhất với bit chỉ số ngăn đệm làm sai lệch bảng tra trạng
      thái trúng trượt.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nghĩ bộ nhớ đệm còn chỗ trống thì không thể trượt <b class="red">(sai)</b>

      <br><span class="note">Ánh xạ trực tiếp: mỗi khối chỉ được vào <b>một</b> dòng. Hai khối cùng dòng đẩy nhau ra dù các
      dòng khác đang trống.</span></div>

      '
    say: Lỗi thứ ba, nghĩ bộ nhớ đệm còn chỗ trống thì không thể trượt. Với ánh xạ trực tiếp, mỗi khối chỉ được vào đúng một
      dòng, nên hai khối cùng dòng đẩy nhau ra dù các dòng khác đang trống. Quên cờ hiệu hợp lệ lúc máy vừa khởi động dễ đọc
      nhầm giá trị rác nằm sẵn trong bộ nhớ tĩnh làm dữ liệu thật.
  - show: '<div class="box warn"><b>Lỗi 4.</b> Quên bit hợp lệ <b class="red">(thiếu)</b>

      <br><span class="note">Lúc mới khởi động, mọi dòng chứa rác; bit hợp lệ = 0 cho biết thẻ trong dòng không có nghĩa.</span></div>

      '
    say: Lỗi thứ tư, quên bit hợp lệ. Lúc mới khởi động, mọi dòng chứa dữ liệu rác, và bit hợp lệ bằng 0 cho biết thẻ trong
      dòng đó không có nghĩa. Không tính thêm không gian lưu trữ trường thẻ và bit kiểm soát khi đo tổng dung lượng thực của
      mạch đệm. Không thêm phần đệm khoảng nhỏ giữa hai mảng kích thước lũy thừa hai để né va chạm trùng chỉ số.
- id: quiz
  kind: quiz
  checks:
  - 8 * 1024 // 32 == 256 and 2 ** 5 == 32 and 2 ** 8 == 256 and 32 - 5 - 8 == 19
  - (0x1234 >> 5) & 255 == 145 and 0x1234 & 31 == 20
  - 8 * 1024 == 8192 and 0x1234 == 4660 and 145 * 32 + 20 == 4660 and 145 < 256 and 145 & 255 == 145
  title: Đến lượt bạn
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Bộ nhớ đệm 8 KiB, mỗi dòng 32 byte, địa chỉ 32 bit: bao nhiêu dòng? Mỗi trường mấy bit?</td></tr>

      <tr><td>2</td><td>Địa chỉ $\texttt{0x1234}$ rơi vào dòng nào, độ dời bao nhiêu?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, bộ nhớ đệm 8 nhân 1024 byte, mỗi dòng dài 32 byte, địa chỉ 32 bit, có bao nhiêu
      dòng, và mỗi trường có mấy bit? Câu hai, địa chỉ 1234 hệ mười sáu rơi vào dòng nào, độ dời bao nhiêu? Dừng video và
      làm ra giấy.
    pause: 10
  - show: '<table class="t"><tr><th>trường</th><th>vì</th><th>số bit</th></tr>

      <tr><td>số dòng</td><td>$8 \times 1024 = 8192$; $\frac{8192}{32} = 256$</td><td>—</td></tr>

      <tr><td>độ dời</td><td>$32 = 2^5$</td><td>5</td></tr>

      <tr><td>chỉ số</td><td>$256 = 2^8$</td><td>8</td></tr>

      <tr><td>thẻ</td><td>$32 - 5 - 8$</td><td>$\hl{19}$</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - - '1.3'
      - '1.4'
    - '1.5'
    - '1.5'
    say: Đáp án câu một, làm theo thứ tự như phần giải mã. Bộ nhớ đệm có 8 nhân 1024, bằng 8192 byte, chia 32 bằng 256 dòng.
      Vì 32 bằng 2 mũ 5 nên độ dời 5 bit, và vì 256 bằng 2 mũ 8 nên chỉ số 8 bit. Phần còn lại cho thẻ là 32 trừ 5 trừ 8,
      bằng 19 bit. Phân tách địa chỉ nhị phân thành đúng ba trường độ dời, chỉ số và thẻ để tra trúng hay trượt trên từng
      dòng bảng.
  - show: '<p>② $\texttt{0x1234} = 4660 = 145 \times 32 + 20$.</p>

      <p>Độ dời $= \texttt{0x1234} \,\&\, 31 = \hl{20}$; dòng $= (\texttt{0x1234} \gg 5) \,\&\, 255 = \hl{145}$ (vì $145 \lt
      256$, giữ nguyên).</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Câu hai, 1234 hệ mười sáu bằng 4660, và 4660 bằng 145 nhân 32 cộng 20. Lấy 5 bit thấp được độ dời 20. Dịch phải 5
      rồi lấy 8 bit được dòng 145, vì 145 nhỏ hơn 256 nên phép và với 255 giữ nguyên nó.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/CSA/L11
  steps:
  - show: <table class='t'><tr><th>Thực hành CSA:L11</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Mô
      phỏng trúng và trượt, nhận ra trượt do xung đột</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>lines=8 idx_bits=3
      off_bits=4 probe=0x84 seq=0x00,0x04,0x80,0x08</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh
      CSA L11 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 11 với dữ liệu đọc động. Đọc kỹ số dòng, số bit chỉ số, số bit độ dời và chuỗi địa chỉ
      truy cập rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Tách địa chỉ dò thành ba trường là thẻ, chỉ số và độ dời bằng phép
      dịch bit và mặt nạ. Mô phỏng lần lượt chuỗi truy cập trên bộ nhớ đệm ánh xạ trực tiếp để đếm lượt trúng, trượt và ghi
      đè xung đột.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai CSA:L11</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (tách bit)</b></td><td>Dùng <code>(1 &lt;&lt; ob) - 1</code> tách offset, dịch phải tách index và tag</td></tr><tr><td><b>Bước
      2 (kiểm thẻ)</b></td><td>So sánh thẻ ở <code>tags[idx]</code>; nếu khác mà ô không rỗng thì cộng xung đột</td></tr><tr><td><b>Bước
      3 (cập nhật)</b></td><td>Ghi thẻ mới vào đúng ngăn khi trượt cache</td></tr></table>
    say: Gợi ý cài đặt bài số 11 chia thành ba bước rõ ràng. Đầu tiên tách ba trường độ dời, chỉ số và thẻ cho địa chỉ cần
      kiểm từ số bit đề cho. Sau đó duyệt tuần tự chuỗi truy cập, đếm trúng trượt và số lần đẩy thẻ cũ vì xung đột rồi in
      ba dòng.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>split_0x84=tag:1,idx:0,off:4</div><div>hits=1
      misses=3</div><div>conflict_at_0x80=2</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">số dòng = dung lượng ÷ cỡ dòng</span><span class="a">→</span>

      <span class="n">địa chỉ = thẻ | chỉ số | độ dời</span><span class="a">→</span>

      <span class="n">nhìn đúng một dòng, so thẻ</span><span class="a">→</span>

      <span class="n">trượt bắt buộc, trượt xung đột</span></div>

      '
    say: Tổng kết lại, số dòng bằng dung lượng chia kích thước mỗi dòng. Địa chỉ được tách thành thẻ, chỉ số và độ dời. Bộ
      nhớ đệm nhìn đúng một dòng theo chỉ số rồi so thẻ. Có trượt bắt buộc khi gặp khối lần đầu, và trượt do xung đột khi
      hai khối tranh một dòng. Ánh xạ trực tiếp đạt tốc độ tìm kiếm cực cao bằng phần cứng đơn giản nhất có thể tưởng tượng.
      Tách địa chỉ ba trường thẻ, chỉ số và độ dời biến phép tra đệm trực tiếp thành mạch so sánh đơn giản.
  - show: '<div class="box key"><b>Tư duy:</b> chọn bit nào làm chỉ số là một quyết định thiết kế — nó quyết định những mẫu
      truy cập nào chạy nhanh.</div>

      '
    say: Điều cần mang theo, việc chọn bit nào làm chỉ số là một quyết định thiết kế, và nó quyết định những mẫu truy cập
      nào sẽ chạy nhanh. Tuy nhiên điểm yếu va chạm xung đột tại đúng một ngăn dẫn ta tới bộ nhớ đệm kết hợp nhiều ngõ ngay
      sau đó. Hiểu nguyên nhân trượt xung đột dẫn thẳng tới giải pháp mở rộng nhiều ngõ trong mỗi tập chỉ số.
  - clear: true
    show: '<p class="note">Bài sau (bài 12): <b>bộ nhớ đệm kết hợp theo tập và thay thế LRU</b> — giảm trượt do xung đột.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 12, ta học bộ nhớ đệm kết hợp theo tập, và cách thay thế khối ít dùng gần đây nhất, để giảm trượt
      do xung đột. Hẹn gặp bạn ở bài tiếp theo.
