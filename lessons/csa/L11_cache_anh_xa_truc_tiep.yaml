scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tìm một địa chỉ trong 32 nghìn byte, chỉ một lần nhìn"
    steps:
      - show: |
          <p>Bộ xử lý cần ô nhớ ở địa chỉ $\texttt{0x12345678}$. Bộ nhớ đệm có nó không? Phải trả lời trong <b>một vài chu kỳ</b> — không kịp tìm tuần tự.</p>
          <div class="box key">Mẹo: chính các bit của địa chỉ cho biết phải nhìn vào <b>đúng một</b> chỗ. Hôm nay: bộ nhớ đệm ánh xạ trực tiếp.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, bộ xử lý cần ô nhớ ở một địa chỉ cụ thể. Bộ nhớ đệm có ô đó không, và phải trả lời chỉ trong vài chu kỳ, không kịp tìm lần lượt từng dòng. Mẹo là chính các bit của địa chỉ cho biết phải nhìn vào đúng một chỗ, và hôm nay ta học bộ nhớ đệm ánh xạ trực tiếp."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cần mấy bit để đếm, và mặt nạ giữ bit thấp"
    checks:
      - "2 ** 6 == 64 and 2 ** 9 == 512 and 32 * 1024 == 32768 and 32768 // 64 == 512"
      - "63 == int('111111', 2) and 120 & 63 == 56 and 120 - 64 == 56"
    steps:
      - show: |
          <table class="t"><tr><th>muốn đánh số</th><th>vì</th><th>cần</th></tr>
          <tr><td>64 byte trong một dòng</td><td>$64 = 2^6$</td><td>6 bit</td></tr>
          <tr><td>512 dòng</td><td>$512 = 2^9$</td><td>9 bit</td></tr></table>
          <p>32 KiB $= 32 \times 1024 = 32\,768$ byte; $\frac{32\,768}{64} = 512$ dòng.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Trước hết, ôn một điều của bài 0, n bit đánh số được 2 mũ n thứ khác nhau. Muốn đánh số 64 byte trong một dòng, vì 64 bằng 2 mũ 6 nên cần 6 bit. Muốn đánh số 512 dòng, vì 512 bằng 2 mũ 9 nên cần 9 bit. Bộ nhớ đệm có 32 nhân 1024, bằng 32768 byte, chia cho 64 byte mỗi dòng được 512 dòng."
      - show: |
          <p>Ở bài 2: và với $63 = 111111_2$ (sáu bit 1) là <b>giữ đúng 6 bit thấp</b>, xoá mọi bit cao.</p>
          <p>Ví dụ $\texttt{0x78} = 120$: $120$ và $63 = 56$, đúng bằng $120 - 64$.</p>
        focus: [1, 2, 2]
        say: "Ở bài 2, ta đã học phép và với một mặt nạ. Và với 63, tức sáu bit 1, là giữ đúng 6 bit thấp và xoá mọi bit cao hơn. Ví dụ 78 hệ mười sáu bằng 120, và với 63 được 56, đúng bằng 120 trừ đi phần 64 ở bit cao."

  - id: sym
    kind: symbol
    title: "Giải mã: ba trường của địa chỉ"
    checks:
      - "32 * 1024 // 64 == 512 and 2 ** 6 == 64 and 2 ** 9 == 512 and 32 - 6 - 9 == 17"
    steps:
      - show: |
          <table class="t"><tr><th>trường</th><th>số bit</th><th>vai trò</th></tr>
          <tr><td>độ dời</td><td>6 (vì $2^6 = 64$ byte mỗi dòng)</td><td>byte nào trong dòng</td></tr>
          <tr><td>chỉ số</td><td>9 (vì $\frac{32\,768}{64} = 512 = 2^9$ dòng)</td><td>nhìn vào dòng nào</td></tr>
          <tr><td>thẻ</td><td>$32 - 6 - 9 = 17$</td><td>dòng đó đang giữ khối nào</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Một địa chỉ 32 bit được tách thành ba trường, đọc từ phải sang trái. Độ dời gồm 6 bit, vì mỗi dòng có 64 bằng 2 mũ 6 byte, nó chỉ byte nào trong dòng. Chỉ số gồm 9 bit, vì bộ nhớ đệm 32 nghìn byte chia 64 byte được 512 bằng 2 mũ 9 dòng, nó chỉ phải nhìn vào dòng nào. Thẻ là 17 bit còn lại, cho biết dòng đó đang giữ khối nào của bộ nhớ."

  # ───────────────────────── 3. TRA MỘT ĐỊA CHỈ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Chỉ số chọn dòng, thẻ xác nhận"
    steps:
      - show: |
          <div><svg width="1500" height="440" viewBox="0 0 1500 440"><defs><marker id="arD11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect x="40" y="20" width="340" height="60" fill="#bfdbfe" stroke="#2a78d6" stroke-width="4"/><text x="210" y="59" font-size="26" text-anchor="middle" fill="#1f2937">thẻ 17 bit: 0x2468</text><rect x="380" y="20" width="240" height="60" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="500" y="59" font-size="26" text-anchor="middle" fill="#1f2937">chỉ số 9 bit: 345</text><rect x="620" y="20" width="220" height="60" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="730" y="59" font-size="26" text-anchor="middle" fill="#1f2937">độ dời 6 bit: 56</text><g font-size="22" fill="#1f2937" text-anchor="middle"><text x="995" y="140">hợp lệ</text><text x="1135" y="140">thẻ</text><text x="1350" y="140">dữ liệu</text></g><text x="925" y="181" font-size="22" text-anchor="end" fill="#1f2937">dòng 0</text><rect x="940" y="150" width="110" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="995" y="181" font-size="22" text-anchor="middle" fill="#1f2937"></text><rect x="1050" y="150" width="170" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1135" y="181" font-size="22" text-anchor="middle" fill="#1f2937"></text><rect x="1220" y="150" width="260" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1350" y="181" font-size="22" text-anchor="middle" fill="#1f2937"></text><text x="925" y="227" font-size="22" text-anchor="end" fill="#1f2937">…</text><rect x="940" y="196" width="110" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="995" y="227" font-size="22" text-anchor="middle" fill="#1f2937"></text><rect x="1050" y="196" width="170" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1135" y="227" font-size="22" text-anchor="middle" fill="#1f2937"></text><rect x="1220" y="196" width="260" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1350" y="227" font-size="22" text-anchor="middle" fill="#1f2937"></text><text x="925" y="273" font-size="22" text-anchor="end" fill="#1f2937">dòng 345</text><rect x="940" y="242" width="110" height="46" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="995" y="273" font-size="22" text-anchor="middle" fill="#1f2937">1</text><rect x="1050" y="242" width="170" height="46" fill="#bfdbfe" stroke="#2a78d6" stroke-width="4"/><text x="1135" y="273" font-size="22" text-anchor="middle" fill="#1f2937">0x2468</text><rect x="1220" y="242" width="260" height="46" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="1350" y="273" font-size="22" text-anchor="middle" fill="#1f2937">64 byte dữ liệu</text><text x="925" y="319" font-size="22" text-anchor="end" fill="#1f2937">…</text><rect x="940" y="288" width="110" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="995" y="319" font-size="22" text-anchor="middle" fill="#1f2937"></text><rect x="1050" y="288" width="170" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1135" y="319" font-size="22" text-anchor="middle" fill="#1f2937"></text><rect x="1220" y="288" width="260" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1350" y="319" font-size="22" text-anchor="middle" fill="#1f2937"></text><text x="925" y="365" font-size="22" text-anchor="end" fill="#1f2937">dòng 511</text><rect x="940" y="334" width="110" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="995" y="365" font-size="22" text-anchor="middle" fill="#1f2937"></text><rect x="1050" y="334" width="170" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1135" y="365" font-size="22" text-anchor="middle" fill="#1f2937"></text><rect x="1220" y="334" width="260" height="46" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1350" y="365" font-size="22" text-anchor="middle" fill="#1f2937"></text><path d="M500,80 L500,265 L800,265" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arD11)"/><g font-size="22"><text x="515" y="250" fill="#b45309">1. nhìn đúng một dòng</text><text x="40" y="425" fill="#2a78d6">2. so hai ô thẻ viền xanh: bằng nhau và hợp lệ bằng 1 thì trúng</text><text x="1480" y="60" text-anchor="end" fill="#15803d">3. độ dời chọn byte 56 trong dòng</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình cho thấy một lần tra bộ nhớ đệm. Địa chỉ ở trên được cắt thành ba trường, và trường giữa, chỉ số, trỏ thẳng vào đúng một dòng, ở đây là dòng 345, không phải dò qua 512 dòng. Dòng đó lưu một bit hợp lệ, một thẻ và 64 byte dữ liệu. Ta so thẻ của địa chỉ với thẻ đang lưu, hai ô viền xanh, nếu bằng nhau và bit hợp lệ bằng 1 thì trúng. Cuối cùng, độ dời chọn ra byte 56 trong 64 byte của dòng."

  - id: example
    kind: example
    title: "Tách địa chỉ 0x12345678"
    checks:
      - "0x12345678 & 63 == 56 and (0x12345678 >> 6) & 511 == 345 and 0x12345678 >> 15 == 0x2468"
      - "0x12345678 & 0xFF == 0x78 == 120 and 511 == 2 ** 9 - 1 and 6 + 9 == 15"
    steps:
      - show: |
          <div class="code"><div>do_doi = addr &amp; 63          # 6 bit thấp       → 56</div></div>
          <p><b>Bước 1.</b> $\texttt{0x12345678}$ có byte thấp $\texttt{0x78} = 120$; $120$ và $63 = 56$.</p>
        focus: [1, 2]
        say: "Với địa chỉ 12345678 hệ mười sáu, dùng các phép toán bit của bài 2. Bước một, lấy 6 bit thấp bằng phép và với 63, được độ dời 56, vì byte thấp nhất là 78 hệ mười sáu, tức 120."
      - show: |
          <div class="code"><div>chi_so = (addr &gt;&gt; 6) &amp; 511  # 9 bit tiếp theo  → 345</div></div>
          <p><b>Bước 2.</b> Dịch phải 6 để bỏ độ dời, rồi và với $511 = 2^9 - 1$ để giữ 9 bit: chỉ số $345$.</p>
        focus: [1, 2]
        say: "Bước hai, dịch phải 6 để bỏ độ dời, rồi và với 511, tức chín bit 1, để giữ 9 bit tiếp theo. Dịch phải 6 rồi lấy 9 bit, được chỉ số 345."
      - show: |
          <div class="code"><div>the    = addr &gt;&gt; 15          # 17 bit cao       → 0x2468</div></div>
          <p><b>Bước 3.</b> Dịch phải $6 + 9 = 15$ bit, phần còn lại là thẻ $\texttt{0x2468}$.</p>
        focus: [1, 2]
        say: "Bước ba, bỏ cả độ dời lẫn chỉ số, tức 6 cộng 9 bằng 15 bit. Dịch phải 15, được thẻ 2468 hệ mười sáu."
      - show: |
          <table class="t"><tr><th>dòng</th><th>hợp lệ</th><th>thẻ đang lưu</th><th>kết quả</th></tr>
          <tr><td>345</td><td>1</td><td>$\texttt{0x2468}$</td><td><b>trúng</b>: lấy byte 56 của dòng</td></tr>
          <tr><td>345</td><td>0, hoặc thẻ khác</td><td>—</td><td><b>trượt</b>: nạp cả khối 64 byte vào dòng 345</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bước bốn, tra dòng theo chỉ số vừa tách. Bộ nhớ đệm nhìn vào dòng 345, nếu dòng hợp lệ và có đúng thẻ đó thì trúng, ngược lại thì trượt và phải nạp cả khối 64 byte vào dòng đó. Khi trúng, độ dời 56 chọn ra đúng byte cần đọc."

  - id: sim
    kind: concept
    title: "Mô phỏng: trượt bắt buộc và trượt do xung đột"
    checks:
      - "[a // 64 for a in [0, 4, 64, 0, 32768, 0]] == [0, 0, 1, 0, 512, 0]"
      - "alg.cache_hits([a // 64 for a in [0, 4, 64, 0, 32768, 0]], 512, 1) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>địa chỉ</th><th>khối</th><th>dòng</th><th>kết quả</th></tr>
          <tr><td>0</td><td>0</td><td>0</td><td>trượt (lần đầu)</td></tr>
          <tr><td>4</td><td>0</td><td>0</td><td>trúng</td></tr>
          <tr><td>64</td><td>1</td><td>1</td><td>trượt (lần đầu)</td></tr>
          <tr><td>0</td><td>0</td><td>0</td><td>trúng</td></tr>
          <tr><td>32 768</td><td>512</td><td>0</td><td>trượt — đẩy khối 0 ra</td></tr>
          <tr><td>0</td><td>0</td><td>0</td><td>$\hl{\text{trượt do xung đột}}$</td></tr></table>
        focus: [["1.2", "1.3"], "1.4", "1.5", "1.6", "1.7"]
        say: "Mô phỏng sáu lần truy cập. Hai lần đầu, địa chỉ 0 trượt vì lần đầu gặp, rồi địa chỉ 4 trúng vì cùng một khối 64 byte. Địa chỉ 64 thuộc khối mới nên trượt, rồi địa chỉ 0 trúng lại. Địa chỉ 32768 là khối 512, cũng rơi vào dòng 0, nên đẩy khối 0 ra ngoài. Lần cuối địa chỉ 0 trượt, dù bộ nhớ đệm còn trống rất nhiều dòng, gọi là trượt do xung đột."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: tách lại bằng phép chia hệ mười"
    checks:
      - "6 + 9 + 17 == 32"
      - "0x12345678 == 305419896 and divmod(305419896, 64) == (4772185, 56) and divmod(4772185, 512) == (9320, 345) and 9320 == 0x2468"
      - "9320 * 32768 + 345 * 64 + 56 == 0x12345678 and 9320 * 32768 == 305397760 and 345 * 64 == 22080"
    steps:
      - show: |
          <table class="t"><tr><th>phép chia hệ mười</th><th>thương</th><th>dư</th></tr>
          <tr><td>$305\,419\,896$ chia 64 (cỡ dòng)</td><td>4 772 185</td><td>$\hl{56}$ = độ dời ✓</td></tr>
          <tr><td>$4\,772\,185$ chia 512 (số dòng)</td><td>$9320 = \texttt{0x2468}$ = thẻ ✓</td><td>$\hl{345}$ = chỉ số ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, ta không dùng phép toán bit mà chia trong hệ mười, vì dịch phải 6 bit chính là chia lấy phần nguyên cho 64. Địa chỉ bằng 305419896, chia cho 64 được thương 4772185, dư 56, đúng độ dời. Lấy thương đó chia tiếp cho 512 được thương 9320, dư 345. Số dư 345 là chỉ số, còn 9320 đúng bằng 2468 hệ mười sáu, là thẻ."
      - show: |
          $$9320 \times 32\,768 + 345 \times 64 + 56 = 305\,397\,760 + 22\,080 + 56 = 305\,419\,896\ ✓$$
        say: "Vì mỗi giá trị thẻ ứng với 32768 byte và mỗi dòng ứng với 64 byte, ta ghép ngược lại được. Thẻ nhân 32768 cộng chỉ số nhân 64 cộng độ dời, được 305397760 cộng 22080 cộng 56, bằng đúng địa chỉ ban đầu."
      - clear: true
        show: |
          <table class="t"><tr><th>phép thử nhanh</th></tr>
          <tr><td>Ba trường cộng lại phải đủ độ dài địa chỉ: $6 + 9 + 17 = 32$.</td></tr>
          <tr><td>Hai địa chỉ cách nhau đúng bằng dung lượng bộ nhớ đệm (32 768) luôn rơi vào <b>cùng</b> dòng.</td></tr>
          <tr><td>Đếm trượt: lần đầu gặp một khối luôn trượt, dù bộ nhớ đệm lớn đến đâu.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, ba trường cộng lại phải đủ độ dài địa chỉ, 6 cộng 9 cộng 17 bằng 32. Hai, hai địa chỉ cách nhau đúng bằng dung lượng bộ nhớ đệm luôn rơi vào cùng một dòng, vì phần chỉ số giống nhau. Ba, lần đầu gặp một khối luôn trượt, dù bộ nhớ đệm lớn đến đâu."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "32 * 1024 // 64 == 512 and 32 * 1024 != 512"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tính số dòng = dung lượng chia 1 byte <b class="red">(sai)</b>
          <br><span class="note">Số dòng = dung lượng chia kích thước dòng, không phải 32 768:</span>
          $$\frac{32\,768}{64} = 512$$</div>
        say: "Lỗi thứ nhất, tính số dòng bằng dung lượng chia một byte. Số dòng bằng dung lượng chia kích thước mỗi dòng, 32768 chia 64 bằng 512."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lấy chỉ số từ bit cao của địa chỉ <b class="red">(sai)</b>
          <br><span class="note">Chỉ số ngay trên độ dời: các khối liền nhau rơi vào các dòng liền nhau — đúng điều tính cục bộ không gian cần.</span></div>
        say: "Lỗi thứ hai, lấy chỉ số từ các bit cao của địa chỉ. Chỉ số nằm ngay trên độ dời, để các khối liền nhau rơi vào các dòng liền nhau, đúng điều tính cục bộ không gian cần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ bộ nhớ đệm còn chỗ trống thì không thể trượt <b class="red">(sai)</b>
          <br><span class="note">Ánh xạ trực tiếp: mỗi khối chỉ được vào <b>một</b> dòng. Hai khối cùng dòng đẩy nhau ra dù các dòng khác đang trống.</span></div>
        say: "Lỗi thứ ba, nghĩ bộ nhớ đệm còn chỗ trống thì không thể trượt. Với ánh xạ trực tiếp, mỗi khối chỉ được vào đúng một dòng, nên hai khối cùng dòng đẩy nhau ra dù các dòng khác đang trống."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Quên bit hợp lệ <b class="red">(thiếu)</b>
          <br><span class="note">Lúc mới khởi động, mọi dòng chứa rác; bit hợp lệ = 0 cho biết thẻ trong dòng không có nghĩa.</span></div>
        say: "Lỗi thứ tư, quên bit hợp lệ. Lúc mới khởi động, mọi dòng chứa dữ liệu rác, và bit hợp lệ bằng 0 cho biết thẻ trong dòng đó không có nghĩa."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    checks:
      - "8 * 1024 // 32 == 256 and 2 ** 5 == 32 and 2 ** 8 == 256 and 32 - 5 - 8 == 19"
      - "(0x1234 >> 5) & 255 == 145 and 0x1234 & 31 == 20"
      - "8 * 1024 == 8192 and 0x1234 == 4660 and 145 * 32 + 20 == 4660 and 145 < 256 and 145 & 255 == 145"
    title: "Đến lượt bạn"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bộ nhớ đệm 8 KiB, mỗi dòng 32 byte, địa chỉ 32 bit: bao nhiêu dòng? Mỗi trường mấy bit?</td></tr>
          <tr><td>2</td><td>Địa chỉ $\texttt{0x1234}$ rơi vào dòng nào, độ dời bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bộ nhớ đệm 8 nghìn byte, mỗi dòng dài 32 byte, địa chỉ 32 bit, có bao nhiêu dòng, và mỗi trường có mấy bit? Câu hai, địa chỉ 1234 hệ mười sáu rơi vào dòng nào, độ dời bao nhiêu? Dừng video và làm ra giấy."
        pause: 10
      - show: |
          <table class="t"><tr><th>trường</th><th>vì</th><th>số bit</th></tr>
          <tr><td>số dòng</td><td>$8 \times 1024 = 8192$; $\frac{8192}{32} = 256$</td><td>—</td></tr>
          <tr><td>độ dời</td><td>$32 = 2^5$</td><td>5</td></tr>
          <tr><td>chỉ số</td><td>$256 = 2^8$</td><td>8</td></tr>
          <tr><td>thẻ</td><td>$32 - 5 - 8$</td><td>$\hl{19}$</td></tr></table>
        focus: [0, "1.2", ["1.3", "1.4"], "1.5"]
        say: "Đáp án câu một, làm theo thứ tự như phần giải mã. Bộ nhớ đệm có 8 nhân 1024, bằng 8192 byte, chia 32 bằng 256 dòng. Vì 32 bằng 2 mũ 5 nên độ dời 5 bit, và vì 256 bằng 2 mũ 8 nên chỉ số 8 bit. Phần còn lại cho thẻ là 32 trừ 5 trừ 8, bằng 19 bit."
      - show: |
          <p>② $\texttt{0x1234} = 4660 = 145 \times 32 + 20$.</p>
          <p>Độ dời $= \texttt{0x1234} \,\&\, 31 = \hl{20}$; dòng $= (\texttt{0x1234} \gg 5) \,\&\, 255 = \hl{145}$ (vì $145 \lt 256$, giữ nguyên).</p>
        focus: [1, 2, 2]
        say: "Câu hai, 1234 hệ mười sáu bằng 4660, và 4660 bằng 145 nhân 32 cộng 20. Lấy 5 bit thấp được độ dời 20. Dịch phải 5 rồi lấy 8 bit được dòng 145, vì 145 nhỏ hơn 256 nên phép và với 255 giữ nguyên nó."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">số dòng = dung lượng ÷ cỡ dòng</span><span class="a">→</span>
          <span class="n">địa chỉ = thẻ | chỉ số | độ dời</span><span class="a">→</span>
          <span class="n">nhìn đúng một dòng, so thẻ</span><span class="a">→</span>
          <span class="n">trượt bắt buộc, trượt xung đột</span></div>
        say: "Tổng kết lại, số dòng bằng dung lượng chia kích thước mỗi dòng. Địa chỉ được tách thành thẻ, chỉ số và độ dời. Bộ nhớ đệm nhìn đúng một dòng theo chỉ số rồi so thẻ. Có trượt bắt buộc khi gặp khối lần đầu, và trượt do xung đột khi hai khối tranh một dòng."
      - show: |
          <div class="box key"><b>Tư duy:</b> chọn bit nào làm chỉ số là một quyết định thiết kế — nó quyết định những mẫu truy cập nào chạy nhanh.</div>
        say: "Điều cần mang theo, việc chọn bit nào làm chỉ số là một quyết định thiết kế, và nó quyết định những mẫu truy cập nào sẽ chạy nhanh."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>bộ nhớ đệm kết hợp theo tập và thay thế LRU</b> — giảm trượt do xung đột.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học bộ nhớ đệm kết hợp theo tập, và cách thay thế khối ít dùng gần đây nhất, để giảm trượt do xung đột. Hẹn gặp bạn ở bài tiếp theo."
