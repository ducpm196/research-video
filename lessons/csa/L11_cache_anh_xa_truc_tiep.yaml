  - {sentence: "Dòng đó lưu một bit hợp lệ, một thẻ và 64 byte dữ liệu.", reason: "ASR chép “Dòng đó lưu 1 bích hợp lệ, 1 thẻ và 64 bai giữ liệu.” (0.875): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: bit/bích — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cuối cùng, độ dời chọn ra byte 56 trong 64 byte của dòng.", reason: "ASR chép “Cuối cùng, độ dời chọn ra bay 56 trong 64 bay của dòng.” (0.882): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
