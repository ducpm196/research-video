id: L11
course: CSA
series: "CSA · Hệ thống máy tính"
title: "Bài 11 — Bộ nhớ đệm ánh xạ trực tiếp: thẻ, chỉ số, độ dời"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/csa.yaml L11; audit/verify_plan_curricula.py CSA:L11; mô phỏng tools/checklib.cache_hits; R. Bryant, D. O'Hallaron, CS:APP mục 6.4"
assumes: [arith, power, sub, sub2, dots, shl]
domain_terms: [dòng]   # “dòng N” = dòng số N của bộ nhớ đệm (thuật ngữ), không phải trích tài liệu
# Quy ước: địa chỉ 32 bit, đánh địa chỉ theo byte; bộ nhớ đệm 32 KiB, mỗi dòng 64 byte. “Thẻ”, “chỉ số”, “độ dời” là ba trường của địa chỉ.
#   log₂ nói bằng lời “số bit cần để đếm tới” — không dùng ký hiệu log ở bài này.
objectives:
  - "Tính số dòng của bộ nhớ đệm"
  - "Tách địa chỉ thành thẻ, chỉ số, độ dời"
  - "Mô phỏng trúng và trượt, nhận ra trượt do xung đột"
