scenes:
- id: hook
  kind: hook
  title: Tìm một địa chỉ trong 32 nghìn byte, chỉ một lần nhìn
  steps:
  - show: '<p>Bộ xử lý cần ô nhớ ở địa chỉ $\texttt{0x12345678}$. Bộ nhớ đệm có nó không? Phải trả lời trong <b>một vài chu
      kỳ</b> — không kịp tìm tuần tự.</p>

      <div class="box key">Mẹo: chính các bit của địa chỉ cho biết phải nhìn vào <b>đúng một</b> chỗ. Hôm nay: bộ nhớ đệm
      ánh xạ trực tiếp.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Chào bạn, bộ xử lý cần ô nhớ ở một địa chỉ cụ thể. Bộ nhớ đệm có ô đó không, và phải trả lời chỉ trong vài chu kỳ,
      không kịp tìm lần lượt từng dòng. Mẹo là chính các bit của địa chỉ cho biết phải nhìn vào đúng một chỗ, và hôm nay ta
      học bộ nhớ đệm ánh xạ trực tiếp. Bộ nhớ đệm chỉ có vài trăm ô chứa làm sao biết tức thì một địa chỉ nằm trong hàng tỉ
      ô nhớ có đang ở sẵn bên trong hay không? Cấu trúc ánh xạ trực tiếp băm địa chỉ thành ba phần thẻ, chỉ số và độ dời định
      vị ô nhớ trong duy nhất một nhịp. Hiểu cấu trúc ba trường thẻ, chỉ số và độ dời giúp tối ưu vị trí mảng tránh rớt tỉ
      lệ trúng đệm thê thảm.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: cần mấy bit để đếm, và mặt nạ giữ bit thấp'
  checks:
  - 2 ** 6 == 64 and 2 ** 9 == 512 and 32 * 1024 == 32768 and 32768 // 64 == 512
  - 63 == int('111111', 2) and 120 & 63 == 56 and 120 - 64 == 56
  steps:
  - show: '<table class="t"><tr><th>muốn đánh số</th><th>vì</th><th>cần</th></tr>

      <tr><td>64 byte trong một dòng</td><td>$64 = 2^6$</td><td>6 bit</td></tr>

      <tr><td>512 dòng</td><td>$512 = 2^9$</td><td>9 bit</td></tr></table>

      <p>32 KiB $= 32 \times 1024 = 32\,768$ byte; $\frac{32\,768}{64} = 512$ dòng.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 2
    - 2
    - 2
    say: Trước hết, ôn một điều của bài 0, n bit đánh số được 2 mũ n thứ khác nhau. Muốn đánh số 64 byte trong một dòng, vì
      64 bằng 2 mũ 6 nên cần 6 bit. Muốn đánh số 512 dòng, vì 512 bằng 2 mũ 9 nên cần 9 bit. Bộ nhớ đệm có 32 nhân 1024, bằng
      32768 byte, chia cho 64 byte mỗi dòng được 512 dòng. Số bit độ dời phụ thuộc vào kích thước mỗi dòng đệm giúp lấy đúng
      bai cần thiết bên trong khối vừa nạp. Mỗi lần trượt đệm ánh xạ trực tiếp buộc bộ xử lý dừng chờ nạp cả dòng đệm từ bộ
      nhớ chính.
  - show: '<p>Ở bài 2: và với $63 = 111111_2$ (sáu bit 1) là <b>giữ đúng 6 bit thấp</b>, xoá mọi bit cao.</p>

      <p>Ví dụ $\texttt{0x78} = 120$: $120$ và $63 = 56$, đúng bằng $120 - 64$.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Ở bài 2, ta đã học phép và với một mặt nạ. Và với 63, tức sáu bit 1, là giữ đúng 6 bit thấp và xoá mọi bit cao hơn.
      Ví dụ 78 hệ mười sáu bằng 120, và với 63 được 56, đúng bằng 120 trừ đi phần 64 ở bit cao. Số bit chỉ số chính là số
      mũ của lũy thừa hai ứng với số dòng trong bộ nhớ đệm. Chọn kích thước dòng đệm lớn hơn tận dụng tốt tính cục bộ không
      gian nhưng tốn thêm chu kỳ truyền.
- id: sym
  kind: symbol
  title: 'Giải mã: ba trường của địa chỉ'
  checks:
  - 32 * 1024 // 64 == 512 and 2 ** 6 == 64 and 2 ** 9 == 512 and 32 - 6 - 9 == 17
  - 200 // 64 == 3 and 3 * 64 <= 200 < 4 * 64
  steps:
  - show: '<table class="t"><tr><th>trường</th><th>số bit</th><th>vai trò</th></tr>

      <tr><td>độ dời</td><td>6 (vì $2^6 = 64$ byte mỗi dòng)</td><td>byte nào trong dòng</td></tr>

      <tr><td>chỉ số</td><td>9 (vì $\frac{32\,768}{64} = 512 = 2^9$ dòng)</td><td>nhìn vào dòng nào</td></tr>

      <tr><td>thẻ</td><td>$32 - 6 - 9 = 17$</td><td>dòng đó đang giữ khối nào</td></tr></table>

      <p class="note"><b>Khối</b>: một đoạn 64 byte liền nhau của bộ nhớ, bắt đầu ở địa chỉ chia hết cho 64; số khối $=$ địa
      chỉ chia 64, ví dụ địa chỉ 200 thuộc khối 3. Mỗi lần trượt, cả khối được chép vào một dòng.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    - 2
    say: Một địa chỉ 32 bit được tách thành ba trường, đọc từ phải sang trái. Độ dời gồm 6 bit, vì mỗi dòng có 64 bằng 2 mũ
      6 byte, nó chỉ byte nào trong dòng. Chỉ số gồm 9 bit, vì bộ nhớ đệm 32768 byte chia 64 byte được 512 bằng 2 mũ 9 dòng,
      nó chỉ phải nhìn vào dòng nào. Thẻ là 17 bit còn lại, cho biết dòng đó đang giữ khối nào của bộ nhớ. Một khối là một
      đoạn 64 byte liền nhau của bộ nhớ, số khối bằng địa chỉ chia lấy phần nguyên cho 64, ví dụ địa chỉ 200 thuộc khối 3.
      Mỗi lần trượt, cả khối được chép vào một dòng. Phần bit thẻ cao nhất lưu kèm từng ngăn để phân biệt các khối bộ nhớ
      chính khác nhau cùng dùng chung một chỉ số.
