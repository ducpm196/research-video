id: L13
course: CSA
series: "CSA · Hệ thống máy tính"
title: "Bài 13 — Định luật Amdahl và giới hạn của song song"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/csa.yaml L13; audit/verify_plan_curricula.py CSA:L13; G. Amdahl (1967), “Validity of the single processor approach to achieving large scale computing capabilities”"
assumes: [arith, power, sub, dots, approx]
# Quy ước: p = tỉ lệ thời gian chạy song song được (0 ≤ p ≤ 1), n = số lõi, S(n) = tăng tốc. Amdahl đọc “Am-đan” (lexicon CSA, probe 8/8).
objectives:
  - "Phát biểu và dùng định luật Amdahl"
  - "Tính tăng tốc tối đa khi số lõi tiến tới vô cùng"
  - "Giải thích vì sao phần tuần tự quyết định giới hạn"
asr_reviewed:
  - {sentence: "Hôm nay ta học định luật Amdahl, công thức cho giới hạn này, và hệ quả của nó với cách ta đầu tư vào song song.", reason: "Amdahl đọc “Am-đan” (lexicon CSA, probe p1 8/8); câu này ASR chép “âm đang” — lẫn âm cuối n/ng, cùng loại nhầm đã biết; các câu khác của L13 chép “Am-đan/Amdahl”"}
  - {sentence: "Lỗi thứ ba, ước lượng p bằng cách đếm dòng mã.", reason: "chữ cái “p” đọc thô — probe audit/dms/probes/p2_chu_p.md: thô 7/8, đối chứng “tê” 0/8; ASR lẫn p/t, không phải TTS đọc sai; chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "64 lõi mà chưa nhanh nổi 9 lần"
    checks:
      - "round(1 / (0.1 + 0.9 / 64), 2) == 8.77"
    steps:
      - show: |
          <p>Một chương trình 90% chạy song song được. Đưa lên máy 64 lõi, kỳ vọng nhanh gấp 64 lần.</p>
          <p>Thực tế: chỉ khoảng <b>8,77 lần</b>. 10% còn lại đang giữ cả hệ thống lại.</p>
        focus: [1, 2, 2]
        say: "Chào bạn, một chương trình có 90 phần trăm chạy song song được. Đưa lên máy 64 lõi, ta kỳ vọng nhanh gấp 64 lần. Thực tế chỉ nhanh khoảng 8 phẩy 77 lần, vì 10 phần trăm còn lại đang giữ cả hệ thống lại."
      - show: |
          <div class="box key">Hôm nay: định luật Amdahl — công thức cho giới hạn này, và hệ quả cho cách đầu tư vào song song.</div>
        say: "Hôm nay ta học định luật Amdahl, công thức cho giới hạn này, và hệ quả của nó với cách ta đầu tư vào song song."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần trăm, phép chia và “nhanh gấp mấy lần”"
    checks:
      - "abs(90 / 100 - 0.9) < 1e-12 and abs(1 - 0.9 - 0.1) < 1e-12 and 0.9 / 8 == 0.1125"
      - "100 / 20 == 5 and 1 / 0.2 == 5"
    steps:
      - show: |
          <table class="t"><tr><th>viết</th><th>bằng</th><th>vì sao</th></tr>
          <tr><td>90%</td><td>0,9</td><td>90 chia 100</td></tr>
          <tr><td>phần còn lại</td><td>$1 - 0{,}9 = 0{,}1$</td><td>cả chương trình là 1</td></tr>
          <tr><td>$\frac{0{,}9}{8}$</td><td>0,1125</td><td>chia đều 0,9 cho 8 người</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Trước hết, ôn ba phép tính sẽ dùng. Chín mươi phần trăm nghĩa là 90 chia 100, tức 0 phẩy 9. Nếu cả chương trình là 1 thì phần còn lại là 1 trừ 0 phẩy 9, bằng 0 phẩy 1. Chia đều 0 phẩy 9 cho 8 người làm thì mỗi người làm 0 phẩy 1125."
      - show: |
          <p><b>Nhanh gấp mấy lần</b> = thời gian cũ chia thời gian mới.</p>
          $$\frac{100\ \text{giây}}{20\ \text{giây}} = 5 \qquad \frac{1}{0{,}2} = 5$$
        focus: [1, 2, 2]
        say: "Còn nhanh gấp mấy lần thì luôn tính bằng thời gian cũ chia thời gian mới. Việc trước tốn 100 giây, nay còn 20 giây, thì nhanh gấp 100 chia 20, bằng 5 lần. Nếu lấy thời gian cũ bằng 1 và thời gian mới bằng 0 phẩy 2, ta cũng được 1 chia 0 phẩy 2, bằng 5 lần."

  - id: sym
    kind: symbol
    title: "Giải mã: p, n và tăng tốc S(n)"
    steps:
      - show: |
          <p>Chia thời gian chạy trên 1 lõi (lấy bằng 1) thành hai phần: phần <b>tuần tự</b> $1 - p$ và phần <b>song song được</b> $p$.</p>
          <p>Trên $n$ lõi: phần tuần tự vẫn tốn $1 - p$; phần song song chỉ tốn $\frac{p}{n}$.</p>
          <div class="box key">$S(n) = \frac{1}{(1 - p) + \frac{p}{n}}$</div>
        focus: [1, 2, 3]
        say: "Lấy thời gian chạy trên một lõi bằng 1, rồi chia làm hai phần, phần tuần tự chiếm 1 trừ p và phần song song được chiếm p. Trên n lõi, phần tuần tự vẫn tốn nguyên 1 trừ p, còn phần song song chỉ tốn p chia n. Vì vậy tăng tốc S của n bằng 1 chia cho tổng hai phần đó."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Phần xám không co lại khi thêm lõi"
    checks:
      - "round(0.1 + 0.9 / 8, 10) == 0.2125 and 0.1 + 0.9 / 1 == 1.0"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><text x="310" y="72" font-size="26" text-anchor="end" fill="#1f2937">1 lõi</text><rect x="330" y="30" width="100" height="64" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="430" y="30" width="900.0" height="64" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/><text x="1350" y="72" font-size="26" fill="#15803d">tổng 1</text><text x="310" y="172" font-size="26" text-anchor="end" fill="#1f2937">8 lõi</text><rect x="330" y="130" width="100" height="64" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="430" y="130" width="112.5" height="64" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/><text x="562" y="172" font-size="26" fill="#15803d">tổng 0,2125</text><text x="310" y="272" font-size="26" text-anchor="end" fill="#1f2937">rất nhiều lõi</text><rect x="330" y="230" width="100" height="64" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="430" y="230" width="4.0" height="64" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/><text x="454" y="272" font-size="26" fill="#15803d">tổng gần 0,1</text><g font-size="24" text-anchor="middle"><text x="380" y="72" fill="#1f2937">tuần tự</text><text x="880" y="72" fill="#1f2937">song song được: chia cho số lõi</text></g><line x1="430" y1="20" x2="430" y2="310" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/><text x="440" y="350" font-size="24" fill="#b91c1c">phần xám không co lại: tổng không bao giờ dưới 0,1</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ thời gian chạy theo đúng tỉ lệ, với chương trình 90 phần trăm song song được. Trên một lõi, thanh dài 1, gồm phần xám tuần tự 0 phẩy 1 và phần xanh 0 phẩy 9. Trên 8 lõi, phần xanh được chia cho 8 nên chỉ còn 0 phẩy 1125, còn phần xám vẫn nguyên 0 phẩy 1. Thêm bao nhiêu lõi thì phần xanh cũng chỉ teo dần về gần 0, nhưng thanh không bao giờ ngắn hơn vạch đỏ, tức 0 phẩy 1."

  - id: example
    kind: example
    title: "90% song song được, 8 lõi"
    checks:
      - "round(1 / (0.1 + 0.9 / 8), 2) == 4.71"
      - "round(1 / 0.1) == 10"
    steps:
      - show: |
          <p><b>Bước 1.</b> Phần tuần tự: $1 - p = 1 - 0{,}9 = 0{,}1$.</p>
          $$S(n) = \frac{1}{(1 - p) + \frac{p}{n}}$$
        focus: [2, 1]
        say: "Ta tính tăng tốc khi p bằng 0 phẩy 9 và có 8 lõi. Bước một, phần tuần tự bằng 1 trừ p, tức 1 trừ 0 phẩy 9, bằng 0 phẩy 1."
      - show: |
          <p><b>Bước 2.</b> Phần song song chia cho 8 lõi: $\frac{p}{n} = \frac{0{,}9}{8} = 0{,}1125$.</p>
        say: "Bước hai, phần song song được chia đều cho 8 lõi, nên chỉ tốn 0 phẩy 9 chia 8, bằng 0 phẩy 1125."
      - show: |
          <p><b>Bước 3.</b> Cộng hai phần: $0{,}1 + 0{,}1125 = 0{,}2125$ — thời gian trên 8 lõi.</p>
        say: "Bước ba, cộng hai phần lại, 0 phẩy 1 cộng 0 phẩy 1125 bằng 0 phẩy 2125. Đó là thời gian chạy trên 8 lõi, so với 1 khi chạy trên một lõi."
      - show: |
          <p><b>Bước 4.</b> Thời gian cũ chia thời gian mới:</p>
          $$S(8) = \frac{1}{0{,}2125} \approx \hl{4{,}71}$$
        say: "Bước bốn, vì tăng tốc bằng thời gian cũ chia thời gian mới, ta lấy 1 chia 0 phẩy 2125, khoảng 4 phẩy 71 lần, chưa tới 5 dù có 8 lõi."
      - show: |
          <p><b>Bước 5.</b> Cho $n$ lớn mãi: $\frac{p}{n}$ tiến về 0, nên $S$ tiến tới $\frac{1}{1 - p} = \frac{1}{0{,}1} = \hl{10}$ — dù có bao nhiêu lõi.</p>
        say: "Bước năm, khi số lõi tăng mãi, phần p chia n tiến về 0. Vì vậy tăng tốc tiến tới 1 chia 0 phẩy 1, bằng 10, dù có bao nhiêu lõi đi nữa."

  - id: lesson
    kind: concept
    title: "Hệ quả: tấn công phần tuần tự"
    checks:
      - "round(1 / (0.01 + 0.99 / 64), 2) == 39.26 and round(1 / (0.1 + 0.9 / 64), 2) == 8.77"
    steps:
      - show: |
          <table class="t"><tr><th>phần song song $p$</th><th>64 lõi</th><th>tối đa</th></tr>
          <tr><td>90%</td><td>8,77</td><td>10</td></tr>
          <tr><td>99%</td><td>$\hl{39{,}26}$</td><td>100</td></tr></table>
          <p>Giảm phần tuần tự từ 10% xuống 1% làm 64 lõi nhanh hơn <b>4,5 lần</b> — lợi hơn nhiều so với mua thêm lõi.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Bảng cho thấy hệ quả quan trọng nhất. Với 90 phần trăm song song, 64 lõi chỉ cho 8 phẩy 77 lần. Với 99 phần trăm, cùng 64 lõi cho tới 39 phẩy 26 lần. Giảm phần tuần tự từ 10 xuống 1 phần trăm làm máy 64 lõi nhanh hơn khoảng 4 phẩy 5 lần, lợi hơn nhiều so với mua thêm lõi."

  # ───────────────────────── 5. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: tính lại bằng giây"
    checks:
      - "1 / (0.1 + 0.9 / 1) == 1.0"
      - "100 * 0.1 == 10 and 100 * 0.9 == 90 and 90 / 8 == 11.25 and 10 + 11.25 == 21.25"
      - "round(100 / 21.25, 2) == 4.71 and round(1 / (0.1 + 0.9 / 8), 2) == 4.71"
    steps:
      - show: |
          <table class="t"><tr><th>chương trình 100 giây trên 1 lõi</th><th>1 lõi</th><th>8 lõi</th></tr>
          <tr><td>phần tuần tự, 10%</td><td>10 giây</td><td>10 giây</td></tr>
          <tr><td>phần song song, 90%</td><td>90 giây</td><td>$\frac{90}{8} = 11{,}25$ giây</td></tr>
          <tr><td>tổng</td><td>100 giây</td><td>21,25 giây</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không dùng công thức mà tính bằng giây thật, vì tăng tốc chỉ là tỉ số hai thời gian. Giả sử chương trình chạy 100 giây trên một lõi, phần tuần tự 10 phần trăm là 10 giây, và trên 8 lõi nó vẫn tốn 10 giây. Phần song song 90 giây chia cho 8 lõi còn 11 phẩy 25 giây. Cộng lại, trên 8 lõi chương trình chạy 21 phẩy 25 giây."
      - show: |
          $$\frac{100}{21{,}25} \approx 4{,}71$$
          <p>Khớp kết quả công thức ✓ — đơn vị giây biến mất khi chia, nên chọn 100 giây hay 1 đơn vị đều ra cùng tăng tốc.</p>
        focus: [1, 2]
        say: "Tăng tốc bằng 100 chia 21 phẩy 25, khoảng 4 phẩy 71, khớp với kết quả tính bằng công thức. Đơn vị giây biến mất khi chia, nên lấy thời gian gốc là 100 giây hay là 1 thì đều ra cùng một tăng tốc."
      - clear: true
        show: |
          <table class="t"><tr><th>phép thử nhanh</th><th>vì sao</th></tr>
          <tr><td>Thử $n = 1$: công thức phải cho $S = 1$.</td><td>$(1 - p) + p = 1$</td></tr>
          <tr><td>Tăng tốc không bao giờ vượt $\frac{1}{1 - p}$, cũng không vượt $n$.</td><td>phần tuần tự không co lại</td></tr>
          <tr><td>$p$ là tỉ lệ <b>thời gian</b>, đo trên 1 lõi — không phải tỉ lệ số dòng mã.</td><td>vòng lặp ngắn có thể chạy lâu</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, thử với một lõi, công thức phải cho tăng tốc bằng 1, vì khi đó hai phần cộng lại đúng bằng 1. Hai, tăng tốc không bao giờ vượt quá 1 chia 1 trừ p, cũng không vượt quá số lõi n. Ba, nhớ p là tỉ lệ thời gian đo trên một lõi, không phải tỉ lệ số dòng mã."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "round(1 / (0.5 + 0.5 / 1000), 3) == 1.998"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ gấp đôi lõi là gấp đôi tốc độ <b class="red">(sai)</b>
          <br><span class="note">Chỉ phần song song nhanh lên; với $p = 0{,}5$, 1000 lõi chỉ nhanh khoảng 2 lần:</span>
          $$\frac{1}{0{,}5 + \frac{0{,}5}{1000}} \approx 1{,}998$$</div>
        say: "Lỗi thứ nhất, nghĩ gấp đôi số lõi là gấp đôi tốc độ. Chỉ phần song song nhanh lên, với một nửa song song được thì 1000 lõi cũng chỉ nhanh khoảng 2 lần."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên chi phí phối hợp <b class="red">(lạc quan)</b>
          <br><span class="note">Chia việc, đồng bộ, gom kết quả tốn thêm thời gian tăng theo số lõi — tăng tốc thật còn thấp hơn công thức.</span></div>
        say: "Lỗi thứ hai, quên chi phí phối hợp. Chia việc, đồng bộ và gom kết quả tốn thêm thời gian tăng theo số lõi, nên tăng tốc thật còn thấp hơn công thức."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Ước lượng $p$ bằng cách đếm dòng mã <b class="red">(sai)</b>
          <br><span class="note">Một vòng lặp 3 dòng có thể chiếm 95% thời gian. Phải đo thời gian bằng công cụ đo hiệu năng.</span></div>
        say: "Lỗi thứ ba, ước lượng p bằng cách đếm dòng mã. Một vòng lặp ba dòng có thể chiếm 95 phần trăm thời gian chạy, nên phải đo thời gian bằng công cụ đo hiệu năng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Kết luận “song song vô ích” <b class="red">(quá đà)</b>
          <br><span class="note">Amdahl giả định bài toán cố định. Khi bài toán lớn lên theo số lõi, phần song song thường chiếm tỉ lệ lớn hơn.</span></div>
        say: "Lỗi thứ tư, kết luận rằng song song là vô ích. Định luật giả định kích thước bài toán cố định, còn khi bài toán lớn lên theo số lõi thì phần song song thường chiếm tỉ lệ lớn hơn."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(1 / (0.05 + 0.95 / 16), 2) == 9.14 and round(1 / 0.05) == 20"
      - "round(1 - 0.95, 10) == 0.05 and 0.95 / 16 == 0.059375 and round(0.05 + 0.059375, 10) == 0.109375"
      - "round(0.01 + 0.99 / 16, 10) == 0.071875 and round(1 / 0.071875, 2) == 13.91"
      - "round(0.05 + 0.95 / 32, 10) == 0.0796875 and round(1 / 0.0796875, 2) == 12.55 and round(1 / 0.01) == 100"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>$p = 0{,}95$, 16 lõi: tăng tốc bao nhiêu?</td></tr>
          <tr><td>2</td><td>Tăng tốc tối đa của chương trình đó là bao nhiêu?</td></tr>
          <tr><td>3</td><td>Cùng chi phí, chọn A: sửa mã để phần tuần tự còn 1%, giữ 16 lõi; hay B: giữ $p = 0{,}95$, lên 32 lõi?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với 95 phần trăm song song được và 16 lõi, tăng tốc là bao nhiêu? Câu hai, tăng tốc tối đa của chương trình đó là bao nhiêu? Câu ba, với cùng chi phí, nên sửa mã để phần tuần tự chỉ còn 1 phần trăm và giữ 16 lõi, hay giữ nguyên mã và lên 32 lõi? Dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① Phần tuần tự $1 - 0{,}95 = 0{,}05$; phần song song $\frac{0{,}95}{16} = 0{,}059375$; tổng $0{,}109375$.</p>
          $$S(16) = \frac{1}{0{,}109375} \approx \hl{9{,}14}$$
        focus: [1, 1, 2]
        say: "Đáp án câu một, làm từng bước như ví dụ. Phần tuần tự là 1 trừ 0 phẩy 95, bằng 0 phẩy 05, phần song song là 0 phẩy 95 chia 16, bằng 0 phẩy 059375, cộng lại được 0 phẩy 109375. Tăng tốc bằng 1 chia 0 phẩy 109375, khoảng 9 phẩy 14 lần."
      - show: |
          <p>② Cho $n$ lớn mãi, chỉ còn phần tuần tự: $\frac{1}{0{,}05} = \hl{20}$ lần.</p>
        say: "Câu hai, khi số lõi tăng mãi thì chỉ còn lại phần tuần tự, nên tăng tốc tối đa là 1 chia 0 phẩy 05, bằng 20 lần."
      - clear: true
        show: |
          <table class="t"><tr><th>phương án</th><th>mẫu số</th><th>tăng tốc</th></tr>
          <tr><td>A: $p = 0{,}99$, 16 lõi</td><td>$0{,}01 + \frac{0{,}99}{16} = 0{,}071875$</td><td>$\approx \hl{13{,}91}$</td></tr>
          <tr><td>B: $p = 0{,}95$, 32 lõi</td><td>$0{,}05 + \frac{0{,}95}{32} = 0{,}0796875$</td><td>$\approx 12{,}55$</td></tr></table>
          <p>Chọn <b>A</b>: giảm phần tuần tự lợi hơn gấp đôi số lõi; và A còn có trần 100 lần, B chỉ có trần 20 lần.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Câu ba là một quyết định, ta tính cả hai phương án. Phương án A có mẫu số 0 phẩy 01 cộng 0 phẩy 99 chia 16, bằng 0 phẩy 071875, nên tăng tốc khoảng 13 phẩy 91 lần. Phương án B có mẫu số 0 phẩy 05 cộng 0 phẩy 95 chia 32, bằng 0 phẩy 0796875, nên tăng tốc khoảng 12 phẩy 55 lần. Vậy chọn A, vì nó vừa nhanh hơn ngay bây giờ, vừa có trần tăng tốc 100 lần thay vì chỉ 20 lần."

