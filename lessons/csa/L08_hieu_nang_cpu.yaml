title: "Bài 8 — Hiệu năng CPU: số lệnh, CPI, tần số"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/csa.yaml L08; audit/verify_plan_curricula.py CSA:L08; D. Patterson, J. Hennessy, Computer Organization and Design, mục 1.6"
assumes: [arith, power, sub, dots, approx]
# Quy ước: thời gian chạy T (giây), số lệnh N, số chu kỳ trung bình mỗi lệnh CPI, tần số xung nhịp f (nhịp mỗi giây).
#   “GHz” hiện trên màn hình; lời đọc nói “tỉ nhịp mỗi giây”. Tên “CPI” hiện trên màn hình; lời đọc nói “số chu kỳ mỗi lệnh”.
objectives:
  - "Dùng công thức thời gian = số lệnh × CPI / tần số"
  - "Tính CPI trung bình từ tỉ lệ các loại lệnh"
  - "So sánh hai thiết kế không bị đánh lừa bởi tần số"
asr_reviewed:
  - {sentence: "Một na-nô giây là một phần tỉ giây.", reason: "ASR chép “Một nano dây là một phần tỉ dây.” (0.706): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hai nhân 10 mũ 9 là 2 tỉ.", reason: "ASR chép “2 nhân 10 mũ chính là 2 tỷ” (0.75): “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: chín/chính — NOT_VERIFIED bằng tai người"}
  - {sentence: "Trong 3 na-nô giây, máy A làm xong 4 lệnh, còn máy B chưa xong lệnh thứ tư.", reason: "ASR chép “Trong 3 nano dây, mẫy A làm xong 4 lệnh, còn mẫy B chưa xong lệnh thứ 4.” (0.757): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: máy (trong “na nô giây máy” → “nano dây mẫy”), máy/mẫy — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chữ f là tần số xung nhịp, 2 tỉ nhịp mỗi giây nghĩa là mỗi nhịp dài nửa na-nô giây.", reason: "xung/xuân, giây/dây (gi/d), tỉ/tỷ (chính tả), “na-nô” → “nano” (cùng âm): nhầm của ASR; con số khớp"}
  - {sentence: "Máy B có tần số cao hơn một nửa mà lại chậm hơn, vì mỗi lệnh tốn nhiều chu kỳ hơn.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Máy 3 GHz có nhanh hơn máy 2 GHz?"
    checks:
      - "1e9 * 1.5 / 2e9 == 0.75 and round(1e9 * 2.5 / 3e9, 3) == 0.833"
    steps:
      - show: |
          <p>Máy A: 2 GHz. Máy B: 3 GHz. Cùng một chương trình 1 tỉ lệnh. Máy nào xong trước?</p>
          <p>Câu trả lời phụ thuộc vào một con số ít ai quảng cáo: <b>mỗi lệnh tốn bao nhiêu chu kỳ</b>.</p>
        focus: [1, 1, 2]
        say: "Chào bạn, máy A chạy 2 tỉ nhịp mỗi giây, máy B chạy 3 tỉ nhịp mỗi giây. Cùng một chương trình 1 tỉ lệnh, máy nào xong trước? Câu trả lời phụ thuộc vào một con số ít ai quảng cáo, mỗi lệnh tốn bao nhiêu chu kỳ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa của 10 và “mỗi giây bao nhiêu nhịp”"
    checks:
      - "10 ** 9 == 1000000000 and 2 * 10 ** 9 == 2000000000"
      - "abs(1.5e9 / 2e9 - 0.75) < 1e-12 and 10 ** 9 // 10 ** 9 == 1"
      - "1 / 2e9 == 0.5e-9 and abs(1 / 3e9 - 0.333e-9) < 0.001e-9"
    steps:
      - show: |
          <table class="t"><tr><th>viết gọn</th><th>viết đủ</th><th>đọc</th></tr>
          <tr><td>$10^9$</td><td>1 000 000 000</td><td>1 tỉ</td></tr>
          <tr><td>$2 \times 10^9$</td><td>2 000 000 000</td><td>2 tỉ</td></tr></table>
          <p>Chia: $\frac{1{,}5 \times 10^9}{2 \times 10^9} = \frac{1{,}5}{2} = 0{,}75$ — hai thừa số $10^9$ triệt tiêu nhau.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Trước hết, ôn cách viết số lớn. Mười mũ 9 là số 1 có 9 chữ số 0 theo sau, tức 1 tỉ. Hai nhân 10 mũ 9 là 2 tỉ. Khi chia 1 phẩy 5 nhân 10 mũ 9 cho 2 nhân 10 mũ 9, hai thừa số 10 mũ 9 triệt tiêu nhau, chỉ còn 1 phẩy 5 chia 2, bằng 0 phẩy 75."
      - show: |
          <table class="t"><tr><th>tần số</th><th>một nhịp dài</th></tr>
          <tr><td>2 tỉ nhịp mỗi giây</td><td>$\frac{1}{2 \times 10^9}$ s $= 0{,}5$ ns</td></tr>
          <tr><td>3 tỉ nhịp mỗi giây</td><td>$\frac{1}{3 \times 10^9}$ s $\approx 0{,}333$ ns</td></tr></table>
          <p>1 ns (na-nô giây) $= 10^{-9}$ s, một phần tỉ giây.</p>
        focus: ["1.2", "1.3", 2]
        say: "Nếu một đồng hồ đập 2 tỉ nhịp mỗi giây, thì mỗi nhịp dài 1 chia 2 tỉ giây, tức nửa na-nô giây. Đồng hồ 3 tỉ nhịp mỗi giây thì mỗi nhịp chỉ khoảng 0 phẩy 333 na-nô giây. Một na-nô giây là một phần tỉ giây."

  - id: sym
    kind: symbol
    title: "Giải mã: N, CPI, f và công thức thời gian"
    checks:
      - "1 / 2e9 == 0.5e-9"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$N$</td><td>số lệnh máy chương trình chạy</td></tr>
          <tr><td>CPI</td><td>số chu kỳ xung nhịp trung bình mỗi lệnh</td></tr>
          <tr><td>$f$</td><td>tần số xung nhịp: 2 GHz = $2 \times 10^9$ nhịp mỗi giây, mỗi nhịp 0,5 ns</td></tr></table>
          <div class="box key">$T = \frac{N \times \text{CPI}}{f}$ &nbsp; (giây = lệnh × chu kỳ/lệnh ÷ chu kỳ/giây)</div>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Ba đại lượng quyết định thời gian chạy. Chữ N là số lệnh máy mà chương trình chạy. Số chu kỳ mỗi lệnh là trung bình mỗi lệnh tốn bao nhiêu nhịp xung. Chữ f là tần số xung nhịp, 2 tỉ nhịp mỗi giây nghĩa là mỗi nhịp dài nửa na-nô giây. Thời gian bằng N nhân số chu kỳ mỗi lệnh, chia f, và đơn vị khớp đúng thành giây."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Nhịp ngắn hơn, nhưng lệnh dài hơn"
    checks:
      - "1.5 * 0.5 == 0.75 and round(2.5 / 3, 3) == 0.833 and 4 * 0.75 == 3.0"
    steps:
      - show: |
          <div><svg width="1500" height="370" viewBox="0 0 1500 370"><g font-size="26" fill="#1f2937"><text x="40" y="80">máy A</text><text x="40" y="220">máy B</text></g><rect x="300.0" y="40" width="172.5" height="60" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="386.2" y="80" font-size="24" text-anchor="middle" fill="#1f2937">lệnh 1</text><rect x="472.5" y="40" width="172.5" height="60" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="558.8" y="80" font-size="24" text-anchor="middle" fill="#1f2937">lệnh 2</text><rect x="645.0" y="40" width="172.5" height="60" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="731.2" y="80" font-size="24" text-anchor="middle" fill="#1f2937">lệnh 3</text><rect x="817.5" y="40" width="172.5" height="60" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="903.8" y="80" font-size="24" text-anchor="middle" fill="#1f2937">lệnh 4</text><line x1="300.0" y1="105" x2="300.0" y2="125" stroke="#2a78d6" stroke-width="3"/><line x1="415.0" y1="105" x2="415.0" y2="125" stroke="#2a78d6" stroke-width="3"/><line x1="530.0" y1="105" x2="530.0" y2="125" stroke="#2a78d6" stroke-width="3"/><line x1="645.0" y1="105" x2="645.0" y2="125" stroke="#2a78d6" stroke-width="3"/><line x1="760.0" y1="105" x2="760.0" y2="125" stroke="#2a78d6" stroke-width="3"/><line x1="875.0" y1="105" x2="875.0" y2="125" stroke="#2a78d6" stroke-width="3"/><line x1="990.0" y1="105" x2="990.0" y2="125" stroke="#2a78d6" stroke-width="3"/><rect x="300.0" y="180" width="191.7" height="60" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="395.8" y="220" font-size="24" text-anchor="middle" fill="#1f2937">lệnh 1</text><rect x="491.7" y="180" width="191.7" height="60" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="587.5" y="220" font-size="24" text-anchor="middle" fill="#1f2937">lệnh 2</text><rect x="683.3" y="180" width="191.7" height="60" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="779.2" y="220" font-size="24" text-anchor="middle" fill="#1f2937">lệnh 3</text><line x1="300.0" y1="245" x2="300.0" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="376.7" y1="245" x2="376.7" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="453.3" y1="245" x2="453.3" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="530.0" y1="245" x2="530.0" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="606.7" y1="245" x2="606.7" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="683.3" y1="245" x2="683.3" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="760.0" y1="245" x2="760.0" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="836.7" y1="245" x2="836.7" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="913.3" y1="245" x2="913.3" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="990.0" y1="245" x2="990.0" y2="265" stroke="#b91c1c" stroke-width="3"/><line x1="300" y1="300" x2="990" y2="300" stroke="#6b7280" stroke-width="2"/><line x1="300" y1="295" x2="300" y2="305" stroke="#6b7280" stroke-width="2"/><text x="300" y="330" font-size="22" text-anchor="middle" fill="#6b7280">0 ns</text><line x1="530" y1="295" x2="530" y2="305" stroke="#6b7280" stroke-width="2"/><text x="530" y="330" font-size="22" text-anchor="middle" fill="#6b7280">1 ns</text><line x1="760" y1="295" x2="760" y2="305" stroke="#6b7280" stroke-width="2"/><text x="760" y="330" font-size="22" text-anchor="middle" fill="#6b7280">2 ns</text><line x1="990" y1="295" x2="990" y2="305" stroke="#6b7280" stroke-width="2"/><text x="990" y="330" font-size="22" text-anchor="middle" fill="#6b7280">3 ns</text><g font-size="22"><text x="1060" y="80" fill="#2a78d6">vạch xanh: nhịp 0,5 ns</text><text x="1060" y="110" fill="#2a78d6">1,5 nhịp mỗi lệnh = 0,75 ns</text><text x="1060" y="220" fill="#b91c1c">vạch đỏ: nhịp 0,333 ns</text><text x="1060" y="250" fill="#b91c1c">2,5 nhịp mỗi lệnh = 0,833 ns</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đặt hai máy trên cùng một trục thời gian, mỗi ô là một lệnh, mỗi vạch nhỏ bên dưới là một nhịp đồng hồ. Máy A có vạch thưa hơn, mỗi nhịp nửa na-nô giây, nhưng mỗi lệnh chỉ tốn 1 phẩy 5 nhịp, nên một lệnh dài 0 phẩy 75 na-nô giây. Máy B có vạch dày hơn, nhưng mỗi lệnh tốn 2 phẩy 5 nhịp, nên một lệnh dài khoảng 0 phẩy 833 na-nô giây. Trong 3 na-nô giây, máy A làm xong 4 lệnh, còn máy B chưa xong lệnh thứ tư."

  - id: example
    kind: example
    title: "So sánh hai máy"
    checks:
      - "1e9 * 1.5 / 2e9 == 0.75"
      - "round(1e9 * 2.5 / 3e9, 3) == 0.833 and 0.75 < 0.833"
    steps:
      - show: |
          <p><b>Bước 1.</b> Máy A, tổng số chu kỳ: $N \times \text{CPI} = 10^9 \times 1{,}5 = 1{,}5 \times 10^9$ chu kỳ.</p>
          $$T = \frac{N \times \text{CPI}}{f}$$
        focus: [1, 2]
        say: "Bước một, với máy A, ta tính tổng số chu kỳ trước, bằng số lệnh nhân số chu kỳ mỗi lệnh, tức 1 tỉ nhân 1 phẩy 5, bằng 1 phẩy 5 tỉ chu kỳ. Theo công thức, đây chính là tử số."
      - show: |
          <p><b>Bước 2.</b> $T_A = \frac{1{,}5 \times 10^9}{2 \times 10^9} = \hl{0{,}75}$ s.</p>
        say: "Bước hai, chia cho tần số 2 tỉ nhịp mỗi giây, vì mỗi giây máy chỉ đi được chừng ấy chu kỳ. Ta được 0 phẩy 75 giây."
      - show: |
          <p><b>Bước 3.</b> Máy B, tổng số chu kỳ: $10^9 \times 2{,}5 = 2{,}5 \times 10^9$ chu kỳ.</p>
        say: "Bước ba, với máy B, cùng 1 tỉ lệnh nhưng mỗi lệnh 2 phẩy 5 chu kỳ, nên tổng là 2 phẩy 5 tỉ chu kỳ."
      - show: |
          <p><b>Bước 4.</b> $T_B = \frac{2{,}5 \times 10^9}{3 \times 10^9} \approx \hl{0{,}833}$ s.</p>
          <div class="box warn">Máy B có tần số cao hơn 50% nhưng chậm hơn, vì mỗi lệnh tốn nhiều chu kỳ hơn.</div>
        focus: [1, 2]
        say: "Bước bốn, chia cho 3 tỉ nhịp mỗi giây, được khoảng 0 phẩy 833 giây. Máy B có tần số cao hơn một nửa mà lại chậm hơn, vì mỗi lệnh tốn nhiều chu kỳ hơn."

  - id: mix
    kind: concept
    title: "CPI trung bình theo tỉ lệ loại lệnh"
    checks:
      - "abs(0.5 * 1 + 0.3 * 2 + 0.2 * 3 - 1.7) < 1e-12 and round(1e9 * 1.7 / 2e9, 3) == 0.85"
    steps:
      - show: |
          <table class="t"><tr><th>loại lệnh</th><th>tỉ lệ</th><th>CPI</th></tr>
          <tr><td>tính toán</td><td>50%</td><td>1</td></tr><tr><td>nạp/lưu</td><td>30%</td><td>2</td></tr><tr><td>nhảy</td><td>20%</td><td>3</td></tr></table>
          <p>CPI trung bình $= 0{,}5 \times 1 + 0{,}3 \times 2 + 0{,}2 \times 3 = \hl{1{,}7}$ — trung bình có trọng số theo tỉ lệ.</p>
        focus: [["1.2", "1.3", "1.4"], 2]
        say: "Mỗi loại lệnh có số chu kỳ riêng, ví dụ lệnh tính toán 1 chu kỳ, lệnh nạp lưu 2, lệnh nhảy 3, với tỉ lệ 50, 30 và 20 phần trăm. Số chu kỳ mỗi lệnh trung bình là trung bình có trọng số, 0 phẩy 5 nhân 1 cộng 0 phẩy 3 nhân 2 cộng 0 phẩy 2 nhân 3, bằng 1 phẩy 7."

  # ───────────────────────── 5. TĂNG TỐC ─────────────────────────
  - id: speedup
    kind: concept
    title: "Tăng tốc: so tỉ số thời gian"
    checks:
      - "round(0.75 / 0.6, 2) == 1.25 and 1e9 * 1.2 / 2e9 == 0.6"
    steps:
      - show: |
          <p>Tăng tốc $= \frac{T_{\text{cũ}}}{T_{\text{mới}}}$. Máy A tối ưu trình biên dịch, CPI giảm từ 1,5 xuống 1,2: $T = 0{,}6$ s.</p>
          <p>Tăng tốc $= \frac{0{,}75}{0{,}6} = \hl{1{,}25}$ lần — không cần đổi phần cứng.</p>
        focus: [1, 1, 2]
        say: "Tăng tốc là tỉ số giữa thời gian cũ và thời gian mới. Nếu máy A nhờ trình biên dịch tốt hơn mà số chu kỳ mỗi lệnh giảm từ 1 phẩy 5 xuống 1 phẩy 2, thời gian còn 0 phẩy 6 giây. Tăng tốc bằng 0 phẩy 75 chia 0 phẩy 6, bằng 1 phẩy 25 lần, mà không cần đổi phần cứng."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: tính theo thời gian mỗi lệnh"
    checks:
      - "1e9 * 1.5 / 2e9 == 0.75"
      - "1.5 * 0.5 == 0.75 and 1e9 * 0.75e-9 == 0.75"
      - "round(2.5 * (1 / 3), 3) == 0.833 and round(1e9 * 2.5 / 3e9, 3) == 0.833"
    steps:
      - show: |
          <table class="t"><tr><th>máy</th><th>một lệnh dài = CPI × một nhịp</th><th>× $10^9$ lệnh</th></tr>
          <tr><td>A</td><td>$1{,}5 \times 0{,}5 = 0{,}75$ ns</td><td>0,75 s ✓</td></tr>
          <tr><td>B</td><td>$2{,}5 \times 0{,}333 \approx 0{,}833$ ns</td><td>0,833 s ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, ta không chia cho tần số mà nhân với độ dài một nhịp, vì chia cho tần số cũng chính là nhân với độ dài nhịp. Máy A, một lệnh dài 1 phẩy 5 nhân 0 phẩy 5, bằng 0 phẩy 75 na-nô giây, nhân 1 tỉ lệnh ra 0 phẩy 75 giây. Máy B, một lệnh dài 2 phẩy 5 nhân 0 phẩy 333, khoảng 0 phẩy 833 na-nô giây, nhân 1 tỉ lệnh ra 0 phẩy 833 giây, khớp cả hai."
      - show: |
          <table class="t"><tr><th>phép thử nhanh</th></tr>
          <tr><td>Kiểm đơn vị: lệnh × (chu kỳ/lệnh) ÷ (chu kỳ/giây) = giây.</td></tr>
          <tr><td>Ba yếu tố nhân với nhau: giảm một yếu tố 2 lần mà hai yếu tố kia không đổi thì thời gian giảm 2 lần.</td></tr>
          <tr><td>So máy bằng thời gian chạy chương trình <b>thật</b>, không bằng một yếu tố riêng lẻ.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, kiểm đơn vị, lệnh nhân chu kỳ mỗi lệnh chia chu kỳ mỗi giây phải ra giây. Hai, ba yếu tố nhân với nhau, nên giảm một yếu tố đi 2 lần mà giữ nguyên hai yếu tố kia thì thời gian giảm 2 lần. Ba, so sánh hai máy bằng thời gian chạy chương trình thật, không bằng một yếu tố riêng lẻ."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> So sánh máy chỉ bằng tần số <b class="red">(sai)</b>
          <br><span class="note">Ví dụ trên: máy 3 GHz chậm hơn máy 2 GHz vì CPI cao hơn.</span></div>
        say: "Lỗi thứ nhất, so sánh hai máy chỉ bằng tần số. Như ví dụ vừa rồi, máy tần số cao hơn lại chậm hơn vì mỗi lệnh tốn nhiều chu kỳ hơn."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lấy trung bình cộng CPI không theo tỉ lệ <b class="red">(sai)</b>
          <br><span class="note">Khác CPI thật 1,7 — phải nhân với tỉ lệ từng loại lệnh:</span>
          $$\frac{1 + 2 + 3}{3} = 2 \ne 1{,}7$$</div>
        say: "Lỗi thứ hai, lấy trung bình cộng các số chu kỳ mà không theo tỉ lệ. Một cộng hai cộng ba chia ba bằng 2, khác giá trị thật 1 phẩy 7, vì phải nhân với tỉ lệ từng loại lệnh."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ giảm số lệnh luôn làm chương trình nhanh hơn <b class="red">(chưa chắc)</b>
          <br><span class="note">Thay nhiều lệnh đơn giản bằng ít lệnh phức tạp có thể làm CPI tăng nhiều hơn.</span></div>
        say: "Lỗi thứ ba, nghĩ giảm số lệnh luôn làm chương trình nhanh hơn. Thay nhiều lệnh đơn giản bằng ít lệnh phức tạp có thể làm số chu kỳ mỗi lệnh tăng nhiều hơn."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin con số “MIPS” (triệu lệnh mỗi giây) để so hai tập lệnh khác nhau <b class="red">(sai)</b>
          <br><span class="note">Cùng một chương trình, hai tập lệnh cần số lệnh khác nhau — chỉ thời gian chạy mới so sánh được.</span></div>
        say: "Lỗi thứ tư, tin con số triệu lệnh mỗi giây để so hai tập lệnh khác nhau. Cùng một chương trình, hai tập lệnh cần số lệnh khác nhau, nên chỉ thời gian chạy mới so sánh được."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(2e8 * 2 / 4e9 - 0.1) < 1e-12"
      - "abs(0.6 * 1 + 0.4 * 4 - 2.2) < 1e-12"
      - "2e8 * 2 == 4e8 and abs(4e8 / 4e9 - 0.1) < 1e-12 and abs(0.4 * 4 - 1.6) < 1e-12"
      - "abs(2e8 * 2.2 - 4.4e8) < 1 and abs(4.4e8 / 4e9 - 0.11) < 1e-12 and abs(2e8 * 1.7 - 3.4e8) < 1 and round(3.4e8 / 3e9, 3) == 0.113"
      - "round((3.4e8 / 3e9) / (4.4e8 / 4e9) - 1, 2) == 0.03"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chương trình $2 \times 10^8$ lệnh, CPI 2, máy 4 GHz: chạy bao lâu?</td></tr>
          <tr><td>2</td><td>60% lệnh có CPI 1, 40% có CPI 4: CPI trung bình là bao nhiêu?</td></tr>
          <tr><td>3</td><td>Cùng $2 \times 10^8$ lệnh: chọn máy 4 GHz với CPI 2,2 hay máy 3 GHz với CPI 1,7?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chương trình 2 nhân 10 mũ 8 lệnh, mỗi lệnh 2 chu kỳ, máy 4 tỉ nhịp mỗi giây, chạy bao lâu? Câu hai, 60 phần trăm lệnh tốn 1 chu kỳ, 40 phần trăm tốn 4 chu kỳ, số chu kỳ mỗi lệnh trung bình là bao nhiêu? Câu ba, cùng số lệnh đó, nên chọn máy 4 tỉ nhịp với 2 phẩy 2 chu kỳ mỗi lệnh, hay máy 3 tỉ nhịp với 1 phẩy 7 chu kỳ mỗi lệnh? Dừng video và làm ra giấy."
        pause: 8
      - show: |
          <p>① Tổng chu kỳ: $2 \times 10^8 \times 2 = 4 \times 10^8$.</p>
          $$T = \frac{4 \times 10^8}{4 \times 10^9} = \hl{0{,}1}\ \text{s}$$
        focus: [1, 2]
        say: "Đáp án câu một, tổng số chu kỳ là 2 nhân 10 mũ 8 nhân 2, bằng 4 nhân 10 mũ 8. Chia cho 4 nhân 10 mũ 9 nhịp mỗi giây, được 0 phẩy 1 giây, tức một phần mười giây."
      - show: |
          <p>② $0{,}6 \times 1 = 0{,}6$; $0{,}4 \times 4 = 1{,}6$; CPI $= 0{,}6 + 1{,}6 = \hl{2{,}2}$.</p>
        say: "Câu hai, nhân từng loại với tỉ lệ của nó, 0 phẩy 6 nhân 1 bằng 0 phẩy 6, 0 phẩy 4 nhân 4 bằng 1 phẩy 6. Cộng lại được 2 phẩy 2 chu kỳ mỗi lệnh."
      - clear: true
        show: |
          <table class="t"><tr><th>máy</th><th>tổng chu kỳ</th><th>thời gian</th></tr>
          <tr><td>4 GHz, CPI 2,2</td><td>$2 \times 10^8 \times 2{,}2 = 4{,}4 \times 10^8$</td><td>$\frac{4{,}4 \times 10^8}{4 \times 10^9} = \hl{0{,}11}$ s</td></tr>
          <tr><td>3 GHz, CPI 1,7</td><td>$2 \times 10^8 \times 1{,}7 = 3{,}4 \times 10^8$</td><td>$\frac{3{,}4 \times 10^8}{3 \times 10^9} \approx 0{,}113$ s</td></tr></table>
          <p>Chọn máy 4 GHz — nhưng chỉ nhanh hơn khoảng 3%, vì CPI thấp của máy kia bù gần hết.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Câu ba là một quyết định, ta tính thời gian thật của cả hai. Máy 4 tỉ nhịp cần 4 phẩy 4 nhân 10 mũ 8 chu kỳ, mất 0 phẩy 11 giây. Máy 3 tỉ nhịp cần 3 phẩy 4 nhân 10 mũ 8 chu kỳ, mất khoảng 0 phẩy 113 giây. Vậy chọn máy 4 tỉ nhịp, nhưng nó chỉ nhanh hơn khoảng 3 phần trăm, vì số chu kỳ mỗi lệnh thấp của máy kia đã bù gần hết."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">$T = N \times \text{CPI} / f$</span><span class="a">→</span>
          <span class="n">CPI: trung bình theo tỉ lệ lệnh</span><span class="a">→</span>
          <span class="n">tăng tốc = thời gian cũ / mới</span><span class="a">→</span>
          <span class="n">so bằng thời gian thật</span></div>
        say: "Tổng kết lại, thời gian bằng số lệnh nhân số chu kỳ mỗi lệnh chia tần số. Số chu kỳ mỗi lệnh là trung bình theo tỉ lệ các loại lệnh. Tăng tốc là thời gian cũ chia thời gian mới. Và luôn so sánh bằng thời gian chạy thật."
      - show: |
          <div class="box key"><b>Tư duy:</b> một con số quảng cáo chỉ là một thừa số — hiệu năng thật là tích của cả ba.</div>
        say: "Điều cần mang theo, một con số quảng cáo chỉ là một thừa số, còn hiệu năng thật là tích của cả ba."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>đường ống lệnh</b> — làm nhiều lệnh chồng lên nhau để giảm CPI.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học đường ống lệnh, cách làm nhiều lệnh chồng lên nhau để giảm số chu kỳ mỗi lệnh. Hẹn gặp bạn ở bài tiếp theo."
