scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai chương trình cùng dùng địa chỉ 0x400000"
    steps:
      - show: |
          <p>Hai chương trình chạy cùng lúc, cả hai đều tin biến của mình ở địa chỉ $\texttt{0x400000}$. Tại sao chúng không ghi đè lên nhau?</p>
          <div class="box key">Vì địa chỉ chương trình thấy là địa chỉ <b>ảo</b>; phần cứng và hệ điều hành dịch nó sang địa chỉ <b>vật lý</b> riêng cho từng chương trình. Hôm nay: bộ nhớ ảo.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, hai chương trình chạy cùng lúc, và cả hai đều tin biến của mình nằm ở cùng một địa chỉ. Tại sao chúng không ghi đè lên nhau? Vì địa chỉ mà chương trình thấy là địa chỉ ảo, phần cứng và hệ điều hành dịch nó sang địa chỉ vật lý riêng cho từng chương trình, và hôm nay ta học bộ nhớ ảo."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chữ số hệ 16, dịch phải và mặt nạ"
    checks:
      - "3 * 4 == 12 and 0xABC == int('101010111100', 2)"
      - "0x12345 >> 12 == 0x12 and 0x12345 & 0xFFF == 0x345 and 0xFFF == 2 ** 12 - 1"
    steps:
      - show: |
          <table class="t"><tr><th>chữ số hệ 16</th><th>A</th><th>B</th><th>C</th></tr>
          <tr><td>4 bit</td><td>1010</td><td>1011</td><td>1100</td></tr></table>
          <p>3 chữ số hệ 16 = $3 \times 4 = 12$ bit: $\texttt{0xABC}$ là đúng 12 bit.</p>
        focus: [1, 1, 2]
        say: "Trước hết, ôn hai điều đã học. Ở bài 0, ta thấy mỗi chữ số hệ mười sáu ứng với đúng 4 bit, như A là 1 0 1 0, B là 1 0 1 1, C là 1 1 0 0. Vì vậy 3 chữ số hệ mười sáu là 3 nhân 4, bằng 12 bit, và A B C chiếm đúng 12 bit."
      - show: |
          <table class="t"><tr><th>phép</th><th>với $\texttt{0x12345}$</th><th>tác dụng</th></tr>
          <tr><td>dịch phải 12 bit, $\gg 12$</td><td>$\texttt{0x12}$</td><td>bỏ 3 chữ số hệ 16 thấp</td></tr>
          <tr><td>và với mặt nạ $\texttt{0xFFF}$</td><td>$\texttt{0x345}$</td><td>giữ đúng 3 chữ số hệ 16 thấp</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Ở bài 2, ta đã học dịch phải k bit là bỏ k bit thấp, và và với một mặt nạ toàn bit 1 là giữ lại đúng các bit đó. Lấy 12345 hệ mười sáu dịch phải 12 bit, tức bỏ 3 chữ số thấp, còn lại 12. Còn và với mặt nạ F F F, gồm 12 bit 1, thì giữ đúng 3 chữ số thấp là 345."

  - id: sym
    kind: symbol
    title: "Giải mã: trang, khung, bảng trang"
    checks:
      - "2 ** 32 // 4096 == 2 ** 20 and 2 ** 12 == 4096"
    steps:
      - show: |
          <p>Bộ nhớ ảo chia thành <b>trang</b> 4 KiB; bộ nhớ vật lý chia thành <b>khung</b> cùng cỡ.</p>
          <p>Địa chỉ ảo 32 bit = <b>số trang</b> (20 bit cao) + <b>độ dời</b> (12 bit thấp, vì $2^{12} = 4096$).</p>
          <p><b>Bảng trang</b> của mỗi tiến trình (một chương trình đang chạy): với mỗi số trang, ghi khung vật lý chứa nó và vài bit quyền (đọc, ghi, có mặt).</p>
        focus: [1, 2, 3]
        say: "Bộ nhớ ảo được chia thành các trang 4 nghìn byte, bộ nhớ vật lý chia thành các khung cùng kích thước. Một địa chỉ ảo 32 bit gồm số trang ở 20 bit cao, và độ dời ở 12 bit thấp, vì 2 mũ 12 bằng 4096. Mỗi chương trình có một bảng trang riêng, với mỗi số trang thì ghi khung vật lý đang chứa nó, cùng vài bit quyền như đọc, ghi, có mặt."

  # ───────────────────────── 3. VÍ DỤ: DỊCH ĐỊA CHỈ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đổi phần trên, giữ phần dưới"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><defs><marker id="arV14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="24" fill="#1f2937"><text x="40" y="60">địa chỉ ảo</text><text x="40" y="350">địa chỉ vật lý</text></g><rect x="250" y="20" width="300" height="70" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="400" y="66" font-size="30" text-anchor="middle" fill="#1f2937">trang 0x403</text><rect x="550" y="20" width="300" height="70" rx="8" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><text x="700" y="66" font-size="30" text-anchor="middle" fill="#1f2937">độ dời 0xABC</text><rect x="250" y="310" width="300" height="70" rx="8" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="400" y="356" font-size="30" text-anchor="middle" fill="#1f2937">khung 0x1F</text><rect x="550" y="310" width="300" height="70" rx="8" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><text x="700" y="356" font-size="30" text-anchor="middle" fill="#1f2937">độ dời 0xABC</text><text x="1150" y="135" font-size="24" text-anchor="middle" fill="#1f2937">bảng trang</text><rect x="1000" y="150" width="150" height="50" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1075" y="183" font-size="22" text-anchor="middle" fill="#1f2937">trang</text><rect x="1150" y="150" width="150" height="50" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1225" y="183" font-size="22" text-anchor="middle" fill="#1f2937">khung</text><rect x="1000" y="200" width="150" height="50" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="1075" y="233" font-size="24" text-anchor="middle" fill="#1f2937">0x403</text><rect x="1150" y="200" width="150" height="50" rx="8" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="1225" y="233" font-size="24" text-anchor="middle" fill="#1f2937">0x1F</text><g fill="none" stroke="#1f2937" stroke-width="3"><path d="M400,90 L400,120 L960,120 L960,225 L995,225" marker-end="url(#arV14)"/><path d="M1225,250 L1225,280 L400,280 L400,305" marker-end="url(#arV14)"/><line x1="700" y1="90" x2="700" y2="305" stroke="#15803d" stroke-dasharray="10 8" marker-end="url(#arV14)"/></g><g font-size="22"><text x="420" y="160" fill="#1f2937">1. tra bảng</text><text x="420" y="268" fill="#1f2937">2. lấy số khung</text><text x="715" y="200" fill="#15803d">3. chép nguyên</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy cơ chế dịch địa chỉ. Địa chỉ ảo ở trên được cắt làm hai, phần xanh dương là số trang, phần xanh lá là độ dời trong trang. Số trang được đem đi tra bảng trang ở bên phải, bảng cho biết trang 403 đang nằm ở khung 1F. Số khung thay vào chỗ số trang, còn độ dời đi thẳng xuống theo đường đứt nét, được chép nguyên, không qua bảng nào."

  - id: example
    kind: example
    title: "Dịch địa chỉ 0x00403ABC"
    checks:
      - "0x00403ABC >> 12 == 0x403 and 0x00403ABC & 0xFFF == 0xABC"
      - "(0x1F << 12) | 0xABC == 0x1FABC"
    steps:
      - show: |
          <p><b>Bước 1.</b> Số trang $= \texttt{0x00403ABC} \gg 12 = \texttt{0x403}$ — bỏ 3 chữ số hệ 16 thấp.</p>
        say: "Bước một, vì độ dời chiếm 12 bit thấp, ta dịch địa chỉ sang phải 12 bit, tức bỏ 3 chữ số hệ mười sáu thấp, được số trang 403 hệ mười sáu."
      - show: |
          <p><b>Bước 2.</b> Độ dời $= \texttt{0x00403ABC}$ và $\texttt{0xFFF} = \texttt{0xABC}$ — giữ 3 chữ số hệ 16 thấp.</p>
        say: "Bước hai, và địa chỉ với mặt nạ F F F để giữ 12 bit thấp, được độ dời A B C."
      - show: |
          <table class="t"><tr><th>trang</th><th>khung</th><th>bit có mặt</th></tr>
          <tr><td>$\texttt{0x403}$</td><td>$\texttt{0x1F}$</td><td>1</td></tr></table>
          <p><b>Bước 3.</b> Tra bảng trang: trang $\texttt{0x403}$ → khung $\texttt{0x1F}$ (bit có mặt = 1).</p>
        focus: [1, 2]
        say: "Bước ba, tra bảng trang của tiến trình ở mục ứng với trang 403. Mục đó ghi khung 1F, bit có mặt bằng 1, nghĩa là trang đang nằm trong bộ nhớ."
      - show: |
          <p><b>Bước 4.</b> Ghép: địa chỉ vật lý = <code>(0x1F &lt;&lt; 12) | 0xABC</code> $= \hl{\texttt{0x1FABC}}$. Độ dời <b>giữ nguyên</b>.</p>
        say: "Bước bốn, dịch số khung sang trái 12 bit để chừa chỗ cho độ dời, rồi hoặc với độ dời giữ nguyên. Ta được địa chỉ vật lý 1 F A B C hệ mười sáu."
      - show: |
          <div class="box warn">Nếu bit có mặt = 0 → <b>lỗi trang</b>: hệ điều hành nạp trang từ đĩa vào một khung trống (hoặc báo lỗi nếu truy cập trái phép), rồi chạy lại lệnh.</div>
        say: "Nếu bit có mặt bằng 0, xảy ra lỗi trang. Hệ điều hành nạp trang đó từ đĩa vào một khung trống, hoặc dừng chương trình nếu truy cập trái phép, rồi cho chạy lại lệnh."

  - id: tlb
    kind: concept
    title: "Bộ đệm dịch địa chỉ (TLB)"
    checks:
      - "round(0.98 * (1 + 100) + 0.02 * (1 + 100 + 100), 2) == 103.0"
      - "100 + 100 == 200"
    steps:
      - show: |
          <p>Tra bảng trang nằm trong bộ nhớ thì <b>mỗi</b> lần đọc dữ liệu tốn thêm một lần đọc bộ nhớ. TLB là bộ nhớ đệm nhỏ giữ các cặp trang → khung vừa dùng.</p>
          <p>TLB 1 ns, bộ nhớ 100 ns, TLB trúng 98%, bảng trang một tầng:</p>
          <p>$0{,}98 \times (1 + 100) + 0{,}02 \times (1 + 100 + 100) = \hl{103}$ ns — gần bằng 100 ns, so với 200 ns nếu không có TLB (100 ns tra bảng trang + 100 ns đọc dữ liệu).</p>
        focus: [1, 1, 2, 3, 3, 3]
        say: "Nếu bảng trang nằm trong bộ nhớ, mỗi lần đọc dữ liệu tốn thêm một lần đọc bộ nhớ để tra bảng. Bộ đệm dịch địa chỉ là một bộ nhớ đệm nhỏ giữ các cặp trang và khung vừa dùng. Giả sử nó mất 1 na-nô giây, bộ nhớ mất 100, nó trúng 98 phần trăm số lần, và bảng trang chỉ có một tầng. Khi trúng, tốn 1 cộng 100. Khi trượt, tốn thêm 100 để đọc bảng trang, nên trung bình là 103 na-nô giây, gần bằng 100. Nếu không có bộ đệm này, lần nào cũng tốn 100 để tra bảng trang cộng 100 để đọc dữ liệu, tức 200 na-nô giây."

  # ───────────────────────── 5. VÌ SAO CẦN ─────────────────────────
  - id: why
    kind: concept
    title: "Bộ nhớ ảo mang lại gì"
    checks:
      - "2 ** 20 * 4 == 4 * 2 ** 20 == 4194304 and round(4194304 / 1e6) == 4"
    steps:
      - show: |
          <table class="t"><tr><th>lợi ích</th><th>nghĩa là</th></tr>
          <tr><td><b>Cô lập</b></td><td>tiến trình không chạm được vào khung của tiến trình khác.</td></tr>
          <tr><td><b>Đơn giản</b></td><td>mỗi chương trình thấy một dải địa chỉ liền mạch từ 0.</td></tr>
          <tr><td><b>Dùng chung</b></td><td>nhiều tiến trình ánh xạ cùng một khung (thư viện) mà chỉ tốn một bản.</td></tr></table>
          <p class="note">Giá phải trả: bảng trang phẳng có $2^{20}$ mục × 4 byte = 4 MiB mỗi tiến trình — nên máy thật dùng bảng trang nhiều tầng.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Bộ nhớ ảo mang lại ba điều. Một, cô lập, tiến trình này không chạm được vào khung của tiến trình khác. Hai, đơn giản, mỗi chương trình thấy một dải địa chỉ liền mạch bắt đầu từ 0. Ba, dùng chung, nhiều tiến trình ánh xạ cùng một khung như thư viện chung mà chỉ tốn một bản. Giá phải trả là bảng trang phẳng có 2 mũ 20 mục, mỗi mục 4 byte, tức khoảng 4 triệu byte cho mỗi tiến trình, nên máy thật dùng bảng trang nhiều tầng."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: tính lại bằng phép chia hệ mười"
    checks:
      - "12 + 20 == 32"
      - "0x00403ABC == 4209340 and divmod(4209340, 4096) == (1027, 2748) and 1027 == 0x403 and 2748 == 0xABC"
      - "0x1F == 31 and 31 * 4096 == 126976 and 126976 + 2748 == 129724 and 129724 == 0x1FABC"
      - "round(101 + 0.02 * 100, 6) == 103 and round(0.98 * 101 + 0.02 * 201, 6) == 103 and 101 <= 103 <= 201"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>hệ mười</th><th>hệ 16</th></tr>
          <tr><td>địa chỉ ảo</td><td>4209340</td><td>$\texttt{0x403ABC}$</td></tr>
          <tr><td>chia cho 4096: thương = số trang</td><td>1027</td><td>$\texttt{0x403}$ ✓</td></tr>
          <tr><td>số dư = độ dời</td><td>2748</td><td>$\texttt{0xABC}$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không dịch bit mà chia trong hệ mười, vì trang dài 4096 byte nên số trang chính là thương của phép chia cho 4096. Đổi sang hệ mười, địa chỉ ảo này bằng 4209340. Chia cho 4096 được thương 1027, đúng bằng 403 hệ mười sáu. Số dư 2748 đúng bằng A B C hệ mười sáu, tức độ dời."
      - show: |
          $$31 \times 4096 + 2748 = 126976 + 2748 = 129724 = \texttt{0x1FABC}\ ✓$$
        say: "Ghép lại theo hệ mười, khung 1F là 31, nhân 4096 được 126976, cộng độ dời 2748 được 129724. Đổi sang hệ mười sáu đúng bằng 1 F A B C, khớp kết quả dịch bit."
      - show: |
          <p>Thời gian hiệu dụng, cách khác: thời gian khi trúng + tỉ lệ trượt × phần phạt thêm:</p>
          $$101 + 0{,}02 \times 100 = 103\ \text{ns}\ ✓$$
        focus: [1, 2]
        say: "Với thời gian hiệu dụng của bộ đệm dịch địa chỉ, ở bài 10 ta đã có công thức thời gian trung bình bằng thời gian khi trúng cộng tỉ lệ trượt nhân phần phạt. Khi trúng tốn 101, mỗi lần trượt phạt thêm 100 để đọc bảng trang, nên được 101 cộng 0 phẩy 02 nhân 100, bằng 103, khớp kết quả cũ."
      - clear: true
        show: |
          <table class="t"><tr><th>phép thử nhanh</th><th>ở ví dụ</th></tr>
          <tr><td>Số bit độ dời = số mũ của cỡ trang; số bit trang + độ dời = độ dài địa chỉ.</td><td>$12 + 20 = 32$</td></tr>
          <tr><td>Sau khi dịch, 12 bit thấp của địa chỉ vật lý phải giống hệt địa chỉ ảo.</td><td>$\texttt{ABC}$ ở cả hai</td></tr>
          <tr><td>Thời gian hiệu dụng phải nằm giữa thời gian khi TLB trúng và khi trượt.</td><td>$101 \le 103 \le 201$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, số bit độ dời bằng số mũ của kích thước trang, và số bit trang cộng số bit độ dời bằng độ dài địa chỉ. Hai, sau khi dịch, 12 bit thấp của địa chỉ vật lý phải giống hệt địa chỉ ảo, vì độ dời giữ nguyên. Ba, thời gian hiệu dụng phải nằm giữa thời gian khi trúng và khi trượt."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "1 + 100 != round(0.98 * (1 + 100) + 0.02 * (1 + 100 + 100), 2)"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tính thời gian hiệu dụng mà quên lần đọc bảng trang khi TLB trượt <b class="red">(sai)</b>
          <br><span class="note">Trượt tốn 1 + 100 + 100, không phải 1 + 100 — kết quả 103 ns chứ không phải 101:</span>
          $$0{,}98 \times 101 + 0{,}02 \times 201 = 103$$</div>
        say: "Lỗi thứ nhất, tính thời gian hiệu dụng mà quên lần đọc bảng trang khi bộ đệm dịch địa chỉ trượt. Khi trượt tốn 1 cộng 100 cộng 100, nên kết quả là 103 chứ không phải 101."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dịch cả độ dời <b class="red">(sai)</b>
          <br><span class="note">Chỉ số trang được thay bằng số khung; độ dời trong trang giữ nguyên.</span></div>
        say: "Lỗi thứ hai, dịch luôn cả độ dời. Chỉ số trang được thay bằng số khung, còn độ dời trong trang giữ nguyên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ lỗi trang là lỗi của chương trình <b class="red">(chưa đúng)</b>
          <br><span class="note">Phần lớn lỗi trang là bình thường (trang chưa nạp); chỉ truy cập trái phép mới làm chương trình bị dừng.</span></div>
        say: "Lỗi thứ ba, nghĩ lỗi trang là lỗi của chương trình. Phần lớn lỗi trang là bình thường, khi trang chưa được nạp, chỉ truy cập trái phép mới làm chương trình bị dừng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ bộ nhớ ảo là “có thêm RAM miễn phí” <b class="red">(sai)</b>
          <br><span class="note">Trang phải đổi ra đĩa liên tục khi dữ liệu dùng vượt bộ nhớ thật: có thể chậm hàng nghìn lần.</span></div>
        say: "Lỗi thứ tư, nghĩ bộ nhớ ảo là có thêm bộ nhớ miễn phí. Khi dữ liệu đang dùng vượt quá bộ nhớ thật, trang phải đổi ra đĩa liên tục và máy có thể chậm đi hàng nghìn lần."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "0x00012345 >> 12 == 0x12 and 0x00012345 & 0xFFF == 0x345 and (0x7 << 12) | 0x345 == 0x7345"
      - "round(0.9 * (1 + 100) + 0.1 * (1 + 200), 2) == 111.0"
      - "round(0.9 * 101, 6) == 90.9 and round(0.1 * 201, 6) == 20.1 and round(90.9 + 20.1, 6) == 111"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Trang 4 KiB, trang $\texttt{0x12}$ nằm ở khung $\texttt{0x7}$. Dịch địa chỉ $\texttt{0x00012345}$.</td></tr>
          <tr><td>2</td><td>TLB 1 ns trúng 90%, bộ nhớ 100 ns: thời gian hiệu dụng?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, trang 4 nghìn byte, trang 12 hệ mười sáu nằm ở khung 7, hãy dịch địa chỉ 12345 hệ mười sáu. Câu hai, bộ đệm dịch địa chỉ mất 1 na-nô giây và trúng 90 phần trăm, bộ nhớ mất 100, thời gian hiệu dụng là bao nhiêu? Dừng video và làm ra giấy."
        pause: 10
      - show: |
          <table class="t"><tr><th>bước</th><th>phép</th><th>kết quả</th></tr>
          <tr><td>số trang</td><td>$\texttt{0x00012345} \gg 12$</td><td>$\texttt{0x12}$</td></tr>
          <tr><td>độ dời</td><td>và với $\texttt{0xFFF}$</td><td>$\texttt{0x345}$</td></tr>
          <tr><td>ghép khung 7</td><td><code>(0x7 &lt;&lt; 12) | 0x345</code></td><td>$\hl{\texttt{0x7345}}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, làm đúng bốn bước như ví dụ. Dịch phải 12 bit, tức bỏ 3 chữ số thấp, được số trang 12. Giữ 3 chữ số thấp được độ dời 345. Thay trang bằng khung 7 rồi ghép với độ dời, được địa chỉ vật lý 7345 hệ mười sáu."
      - show: |
          <p>② Trúng: $1 + 100 = 101$ ns. Trượt: $1 + 100 + 100 = 201$ ns.</p>
          $$0{,}9 \times 101 + 0{,}1 \times 201 = 90{,}9 + 20{,}1 = \hl{111}\ \text{ns}$$
        focus: [1, 1, 2]
        say: "Câu hai, khi trúng tốn 1 cộng 100, bằng 101 na-nô giây, khi trượt tốn thêm một lần đọc bảng trang, thành 201. Lấy trung bình theo tỉ lệ, 0 phẩy 9 nhân 101 được 90 phẩy 9, 0 phẩy 1 nhân 201 được 20 phẩy 1. Cộng hai phần, 90 phẩy 9 cộng 20 phẩy 1, thời gian hiệu dụng bằng 111 na-nô giây."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">địa chỉ = số trang + độ dời</span><span class="a">→</span>
          <span class="n">bảng trang: trang → khung</span><span class="a">→</span>
          <span class="n">TLB giữ phép dịch vừa dùng</span><span class="a">→</span>
          <span class="n">cô lập, liền mạch, dùng chung</span></div>
        say: "Tổng kết lại, địa chỉ ảo gồm số trang và độ dời. Bảng trang dịch trang sang khung, độ dời giữ nguyên. Bộ đệm dịch địa chỉ giữ các phép dịch vừa dùng để khỏi tra bảng mỗi lần. Bộ nhớ ảo cho cô lập, dải địa chỉ liền mạch, và dùng chung bộ nhớ."
      - show: |
          <div class="box key"><b>Tư duy:</b> một tầng gián tiếp (dịch địa chỉ) mua được cô lập và linh hoạt; bộ nhớ đệm (TLB) trả lại phần tốc độ đã mất.</div>
        say: "Điều cần mang theo, thêm một tầng gián tiếp như dịch địa chỉ mua được sự cô lập và linh hoạt, còn bộ nhớ đệm trả lại phần tốc độ đã mất."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 15): <b>vào/ra</b> — thăm dò, ngắt và truy cập bộ nhớ trực tiếp.</p>
        forward_ref: true
        say: "Ở bài sau, bài 15, bài khép lại phần kiến thức của khoá, ta học vào ra với thiết bị, gồm thăm dò, ngắt và truy cập bộ nhớ trực tiếp. Hẹn gặp bạn ở bài tiếp theo."
