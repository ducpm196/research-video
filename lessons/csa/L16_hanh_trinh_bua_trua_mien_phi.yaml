scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chương trình cũ, máy mới, mà không nhanh hơn"
    checks:
      - "10 / 2 == 5 and 3.73 < 4 < 10"
    steps:
      - show: |
          <p>Tháng 8/2001, chip Intel đạt <b>2 GHz</b>. Theo xu hướng trước 2003, đầu năm 2005 lẽ ra đã có chip <b>10 GHz</b>.</p>
          <p>Thực tế, kế hoạch cho đầu 2005 chỉ là <b>3,73 GHz</b>; kế hoạch 4 GHz bị huỷ hẳn từ mùa thu 2004.</p>
          <p>Năm 2018: chính cách CPU “đoán trước để chạy nhanh” lại thành <b>lỗ hổng</b> trong các bộ xử lý của Intel, AMD, ARM, dùng trong <b>hàng tỉ thiết bị</b>.</p>
          <div class="box key">Hôm nay: năm chặng từ 2001 tới sau 2019 — tốc độ máy tính đến từ đâu, khi nào hết “miễn phí”, và cái giá của mỗi lần tăng tốc.</div>
        focus: [1, 1, 2, 3, 4]
        say: "Chào bạn, tháng 8 năm 2001, chip Intel đạt 2 tỉ nhịp mỗi giây. Theo xu hướng trước năm 2003, đầu năm 2005 lẽ ra đã có chip 10 tỉ nhịp mỗi giây. Thực tế, kế hoạch cho đầu năm 2005 chỉ là 3 phẩy 73, và kế hoạch 4 tỉ nhịp đã bị huỷ hẳn từ mùa thu 2004. Năm 2018, chính cách bộ xử lý đoán trước để chạy nhanh lại thành lỗ hổng trong chip của Intel, AMD và nhiều chip điện thoại, dùng trong hàng tỉ thiết bị. Hôm nay ta đi qua năm chặng, để biết tốc độ máy tính đến từ đâu, khi nào nó hết miễn phí, và cái giá của mỗi lần tăng tốc."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "1e9 * 1.5 / 2e9 == 0.75"
      - "100 + 5 - 1 == 104"
      - "1 + 0.05 * 100 == 6"
      - "round(1 / (0.1 + 0.9 / 8), 2) == 4.71"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 8</td><td>thời gian chạy = số lệnh nhân số chu kỳ mỗi lệnh, chia tần số</td><td>$10^9$ lệnh, 1,5 chu kỳ mỗi lệnh, 2 tỉ nhịp mỗi giây → $\hlg{0{,}75}$ giây</td></tr>
          <tr><td>bài 9</td><td><b>đường ống</b>: nhiều lệnh đi cùng lúc qua các tầng</td><td>5 tầng, 100 lệnh: 100 + 5 − 1 = 104 chu kỳ</td></tr>
          <tr><td>bài 10</td><td>thời gian truy cập trung bình = thời gian trúng + tỉ lệ trượt nhân chi phí trượt</td><td>1 + 0,05 nhân 100 = 6 chu kỳ</td></tr>
          <tr><td>bài 13</td><td><b>Amdahl</b>: phần tuần tự quyết định giới hạn của song song</td><td>90% song song được, 8 lõi → ≈ 4,71 lần</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 8, thời gian chạy bằng số lệnh nhân số chu kỳ mỗi lệnh, chia tần số. Vì vậy một tỉ lệnh, 1 phẩy 5 chu kỳ mỗi lệnh, ở 2 tỉ nhịp mỗi giây mất 0 phẩy 75 giây. Ở bài 9, đường ống cho nhiều lệnh đi cùng lúc qua các tầng, 5 tầng và 100 lệnh chỉ mất 104 chu kỳ. Ở bài 10, thời gian truy cập trung bình bằng thời gian trúng cộng tỉ lệ trượt nhân chi phí trượt, ví dụ 1 cộng 0 phẩy 05 nhân 100 bằng 6 chu kỳ. Ở bài 13, định luật Amdahl nói phần tuần tự quyết định giới hạn, 90% song song được thì 8 lõi chỉ nhanh khoảng 4 phẩy 71 lần."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>xung nhịp</b></td><td>số nhịp mỗi giây của bộ xử lý; 1 GHz là một tỉ nhịp mỗi giây</td></tr>
          <tr><td><b>đa nhân</b> (multicore)</td><td>hai hay nhiều bộ xử lý thật trên cùng một chip</td></tr>
          <tr><td><b>luồng</b></td><td>một dòng lệnh chạy riêng; một chương trình đang chạy (tiến trình) có thể có nhiều luồng</td></tr>
          <tr><td><b>siêu phân luồng</b> (hyperthreading)</td><td>hai luồng chạy chung một lõi, chung bộ nhớ đệm và bộ tính toán</td></tr>
          <tr><td><b>thực thi suy đoán</b></td><td>đoán hướng rẽ nhánh (lệnh nhảy có điều kiện) rồi chạy trước, sai thì bỏ kết quả</td></tr>
          <tr><td><b>kênh phụ</b></td><td>dấu vết ngoài kết quả chính, ví dụ cái gì đang nằm trong bộ nhớ đệm</td></tr>
          <tr><td><b>giảm thiểu</b></td><td>biện pháp làm lỗ hổng khó dùng hơn, thường đổi bằng tốc độ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8"]
        say: "Bài dùng bảy thuật ngữ. Xung nhịp là số nhịp mỗi giây của bộ xử lý, và một gi-ga-héc là một tỉ nhịp mỗi giây. Đa nhân là hai hay nhiều bộ xử lý thật nằm trên cùng một chip. Luồng là một dòng lệnh chạy riêng, và một chương trình đang chạy, gọi là tiến trình, có thể có nhiều luồng. Siêu phân luồng là hai luồng chạy chung một lõi, dùng chung bộ nhớ đệm và bộ tính toán. Thực thi suy đoán là đoán hướng rẽ nhánh, tức lệnh nhảy có điều kiện, rồi chạy trước, nếu đoán sai thì bỏ kết quả. Kênh phụ là dấu vết nằm ngoài kết quả chính, ví dụ cái gì đang nằm trong bộ nhớ đệm. Giảm thiểu là biện pháp làm lỗ hổng khó dùng hơn, thường phải đổi bằng tốc độ."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: timeline
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2001</text><text x="160" y="200">2 GHz</text><text x="160" y="232">nhanh lên miễn phí</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2003 → 2005</text><text x="500" y="200">bức tường xung nhịp</text><text x="500" y="232">3,73 GHz, không phải 10</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2005 → 2009</text><text x="850" y="200">đa nhân</text><text x="850" y="232">2 lõi chưa bằng gấp đôi</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2018</text><text x="1200" y="200">Spectre</text><text x="1200" y="232">đoán trước để lại dấu vết</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2019 → nay</text><text x="1540" y="200">giảm thiểu nhiều lớp</text><text x="1540" y="232">chọn theo mức tin cậy</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">tăng trưởng miễn phí → chạm giới hạn → đổi hướng → quy mô hàng tỉ thiết bị → ổn định và tiếp tục</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2001, chip đạt 2 tỉ nhịp mỗi giây, và phần mềm nhanh lên miễn phí. Từ 2003 tới 2005, xung nhịp chạm tường, dừng ở 3 phẩy 73 thay vì 10. Từ 2005, các hãng chuyển sang đa nhân, nhưng hai lõi chưa bằng gấp đôi. Năm 2018, lỗ hổng Spectre cho thấy việc đoán trước để lại dấu vết, rồi từ 2019 tới nay là giảm thiểu nhiều lớp, chọn theo mức tin cậy."

  # ───────────────────────── 5. CƠ CHẾ ĐOÁN TRƯỚC ─────────────────────────
  - id: spec_mech
    kind: concept
    title: "Cơ chế chung: đoán trước, chạy trước, sai thì quay lại"
    steps:
      - show: |
          <div><svg width="1600" height="350" viewBox="0 0 1600 350">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="30" y="120" width="300" height="100" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/><text x="180" y="160">lệnh rẽ nhánh</text><text x="180" y="194">chờ vài trăm chu kỳ</text>
          <rect x="520" y="30" width="440" height="100" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="740" y="70">đoán đúng: giữ kết quả</text><text x="740" y="104">không mất chu kỳ nào</text>
          <rect x="520" y="210" width="440" height="100" rx="10" fill="#fde8e8" stroke="#e11d48" stroke-width="3"/><text x="740" y="250">đoán sai: thanh ghi quay lại</text><text x="740" y="284">mất xấp xỉ như ngồi chờ</text>
          <rect x="1180" y="210" width="390" height="100" rx="10" fill="#fff7e6" stroke="#eb6834" stroke-width="3"/><text x="1375" y="250">bộ nhớ đệm KHÔNG quay lại</text><text x="1375" y="284">dấu vết còn đó</text>
          </g>
          <line x1="330" y1="150" x2="515" y2="85" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="330" y1="190" x2="515" y2="255" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="960" y1="260" x2="1175" y2="260" stroke="#eb6834" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#ah)"/>
          <text x="1070" y="340" font-size="22" fill="#eb6834" text-anchor="middle">năm 2018: kênh phụ</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là cơ chế xuyên suốt cả bài. Khi một lệnh rẽ nhánh phải chờ dữ liệu chưa có trong bộ nhớ đệm, thường mất vài trăm chu kỳ, nên bộ xử lý đoán hướng đi và chạy trước. Đoán đúng thì giữ kết quả và không mất chu kỳ nào, đoán sai thì thanh ghi quay về điểm đã lưu, mất xấp xỉ như ngồi chờ. Năm 2018 người ta chỉ ra rằng bộ nhớ đệm không quay lại, nên dấu vết của phần chạy sai vẫn còn đó."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2001 — tăng trưởng: phần mềm nhanh lên miễn phí"
    stage: {year: "2001", scale: "chip Intel đạt 2 GHz (8/2001); 500 MHz → 1 GHz → 2 GHz; ba nguồn tăng tốc: xung nhịp, tối ưu thực thi, bộ nhớ đệm", source: "[HS05]", practice: "chương trình tuần tự cũ tự nhanh lên khi thay chip, không cần viết lại — đúng khi xung nhịp còn tăng và chương trình bị giới hạn bởi CPU"}
    checks:
      - "1e9 * 1.5 / 2e9 == 0.75 and round(1e9 * 1.5 / 3.4e9, 2) == 0.44 and 1e9 * 1.5 / 1e10 == 0.15"
      - "round(0.75 / 0.15) == 5"
    steps:
      - show: |
          <p><b>Quy mô:</b> “500 MHz nhường chỗ cho 1 GHz, rồi 2 GHz”; tháng 8/2001 chip Intel đạt <b>2 GHz</b>. Hầu hết ứng dụng được tăng tốc đều đặn suốt nhiều thập kỷ mà <b>không cần ra bản mới</b>.</p>
          <table class="t"><tr><th>nguồn tăng tốc (30 năm trước 2005)</th><th>làm gì</th></tr>
          <tr><td>xung nhịp</td><td>nhiều chu kỳ hơn mỗi giây</td></tr>
          <tr><td>tối ưu thực thi</td><td>đường ống, đoán nhánh, nhiều lệnh mỗi chu kỳ, chạy lệnh không theo thứ tự</td></tr>
          <tr><td>bộ nhớ đệm</td><td>giữ dữ liệu gần bộ xử lý, tránh đi ra bộ nhớ chính</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng một, người ta quen thấy chip nửa tỉ nhịp nhường chỗ cho một tỉ, rồi hai tỉ nhịp mỗi giây, và tháng 8 năm 2001 chip Intel đạt 2 tỉ. Hầu hết ứng dụng được tăng tốc đều đặn suốt nhiều thập kỷ mà không cần ra bản mới. Nguồn thứ nhất là xung nhịp, tức nhiều chu kỳ hơn mỗi giây. Nguồn thứ hai là tối ưu thực thi, gồm đường ống, đoán nhánh, nhiều lệnh mỗi chu kỳ và chạy lệnh không theo thứ tự. Nguồn thứ ba là bộ nhớ đệm, giữ dữ liệu gần bộ xử lý."
      - clear: true
        show: |
          <p>Cùng chương trình của bài 8: $10^9$ lệnh, 1,5 chu kỳ mỗi lệnh, <b>không sửa một dòng mã</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>thời gian chạy</th></tr>
          <tr><td>Bước 1. 2 GHz (8/2001)</td><td>$\frac{1{,}5 \times 10^9}{2 \times 10^9}$</td><td>$\hlb{0{,}75}$ giây</td></tr>
          <tr><td>Bước 2. 3,4 GHz (đã có trước 2005)</td><td>$\frac{1{,}5 \times 10^9}{3{,}4 \times 10^9}$</td><td>$\approx 0{,}44$ giây</td></tr>
          <tr><td>Bước 3. 10 GHz nếu xu hướng tiếp tục</td><td>$\frac{1{,}5 \times 10^9}{10 \times 10^9}$</td><td>$\hlg{0{,}15}$ giây, nhanh gấp 5</td></tr></table>
          <p class="note">Thực hành của thời này: chờ chip mới là đủ. Điều kiện: xung nhịp còn tăng, và chương trình bị giới hạn bởi bộ xử lý.</p>
        focus: [1, "2.2", "2.3", "2.4", 3, 3]
        say: "Làm thử với chương trình của bài 8, một tỉ lệnh, 1 phẩy 5 chu kỳ mỗi lệnh, không sửa một dòng mã nào. Bước một, ở 2 tỉ nhịp mỗi giây, 1 phẩy 5 tỉ chu kỳ chia 2 tỉ được 0 phẩy 75 giây. Bước hai, ở 3 phẩy 4 tỉ nhịp, đã có trước năm 2005, chỉ còn khoảng 0 phẩy 44 giây. Bước ba, nếu xu hướng tiếp tục tới 10 tỉ nhịp, chỉ còn 0 phẩy 15 giây, nhanh gấp 5 lần. Thực hành của thời này là cứ chờ chip mới. Điều kiện là xung nhịp còn tăng, và chương trình bị giới hạn bởi bộ xử lý."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2003 tới 2005 — chạm giới hạn: bức tường xung nhịp"
    stage: {year: "2003 → 2005", scale: "xu hướng xung nhịp gãy từ đầu 2003; Intel bỏ hẳn kế hoạch 4 GHz (thu 2004), dừng ở 3,73 GHz (đầu 2005); số bóng bán dẫn vẫn tăng", source: "[HS05]", practice: "đừng chờ phần cứng: đo xem chương trình bị giới hạn ở đâu, tối ưu hiệu quả vì nó quan trọng hơn chứ không kém đi"}
    checks:
      # Đợt C: 2,67 cũ tính từ số đã làm tròn 0,40; tỉ số thật 10 / 3,73 = 2,681 → hiện 2,68.
      - "round(3.73 / 10, 3) == 0.373 and round(1.5 / 3.73, 2) == 0.40 and round(1.5 / 3.73, 3) == 0.402 and round(10 / 3.73, 2) == round((1.5 / 3.73) / 0.15, 2) == 2.68"
      - "round(3.73 / 3.4 - 1, 3) == 0.097"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> “quanh đầu năm 2003” xu hướng xung nhịp <b>gãy hẳn</b>. Lý do vật lý: <b>nhiệt</b> quá nhiều và khó toả, <b>điện năng</b> quá cao, và <b>dòng rò</b>.</p>
          <table class="t"><tr><th>mốc</th><th>xung nhịp</th></tr>
          <tr><td>trước 2005</td><td>3,4 GHz đã có</td></tr>
          <tr><td>mùa thu 2004</td><td>Intel huỷ hẳn kế hoạch 4 GHz</td></tr>
          <tr><td>đầu 2005</td><td>dự định 3,73 GHz — “cuộc đua xung nhịp thật sự đã kết thúc, ít nhất là lúc này”</td></tr></table>
          <p>Nhưng số <b>bóng bán dẫn</b> trên chip vẫn tăng: định luật Moore chưa dừng, chỉ có xung nhịp dừng.</p>
        focus: [1, 1, "2.2", "2.3", "2.4", 3]
        say: "Ở chặng hai, quanh đầu năm 2003, xu hướng xung nhịp gãy hẳn. Lý do vật lý là nhiệt quá nhiều và khó toả ra, điện năng quá cao, cộng với dòng rò. Trước năm 2005 đã có chip 3 phẩy 4 tỉ nhịp mỗi giây. Mùa thu năm 2004, Intel huỷ hẳn kế hoạch chip 4 tỉ nhịp. Đầu năm 2005, họ chỉ định nhích lên 3 phẩy 73, và cuộc đua xung nhịp coi như kết thúc, ít nhất là lúc đó. Nhưng số bóng bán dẫn trên chip vẫn tăng, chỉ có xung nhịp là dừng lại."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. đạt được bao nhiêu phần xu hướng</td><td>3,73 chia 10</td><td>$\hl{37{,}3\%}$</td></tr>
          <tr><td>Bước 2. thời gian thật ở 3,73 GHz</td><td>1,5 chia 3,73</td><td>$\approx \hlb{0{,}40}$ giây</td></tr>
          <tr><td>Bước 3. chậm hơn xu hướng</td><td>10 chia 3,73 (cũng là 0,402 chia 0,15)</td><td>$\approx 2{,}68$ lần</td></tr>
          <tr><td>Bước 4. từ 3,4 lên 3,73 GHz</td><td>3,73 chia 3,4, trừ 1</td><td>chỉ thêm $\approx 9{,}7\%$</td></tr></table>
          <p class="note">Thực hành: “hiệu quả và tối ưu sẽ quan trọng hơn, không kém đi”. Đo xem chương trình nghẽn ở bộ xử lý hay ở chỗ khác trước khi sửa.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Tính lại cái giá của bức tường bằng công thức bài 8. Bước một, 3 phẩy 73 chia 10 là 37 phẩy 3 phần trăm, chỉ hơn một phần ba so với xu hướng. Bước hai, 1 phẩy 5 chia 3 phẩy 73 được khoảng 0 phẩy 40 giây. Bước ba, so với xu hướng 10 tỉ nhịp, máy thật chậm hơn 10 chia 3 phẩy 73, khoảng 2 phẩy 68 lần. Bước bốn, từ 3 phẩy 4 lên 3 phẩy 73 chỉ thêm chừng 9 phẩy 7 phần trăm. Bài báo năm 2005 rút ra rằng hiệu quả và tối ưu sẽ quan trọng hơn, nên hãy đo xem chương trình nghẽn ở đâu trước khi sửa."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2005 tới 2009 — đổi hướng: đa nhân, nhưng 2 × 3 GHz < 6 GHz"
    stage: {year: "2005 → 2009", scale: "chip hai lõi đầu tiên của Intel và AMD hẹn ra năm 2005 (“both due in 2005”); siêu phân luồng thêm 5–15%, tối đa 40%; Intel nói tới chip 100 lõi; đồ thị cập nhật 8/2009: xu hướng vẫn đúng", source: "[HS05]", practice: "viết chương trình song song cho phần việc độc lập; biết mục tiêu thật trước khi kết luận “không song song được”; giữ tập làm việc vừa bộ nhớ đệm; thử trên máy nhiều lõi thật"}
    checks:
      - "round(1 / (0.1 + 0.9 / 2), 2) == 1.82 and round(1 / (0.1 + 0.9 / 100), 2) == 9.17"
      - "1 / 100 == 0.01 and 1.05 <= 1.15 < 2"
      - "1 + 0.05 * 10 == 1.5 and 1 + 0.05 * 50 == 3.5"
    steps:
      - show: |
          <p><b>Cách xử lý của các hãng:</b> dùng số bóng bán dẫn tăng thêm để đặt <b>hai lõi</b> lên một chip; bài báo viết cuối 2004 cho biết chip hai lõi đầu tiên của Intel và AMD đều hẹn ra trong năm <b>2005</b>.</p>
          <table class="t"><tr><th>điều bài báo năm 2005 ghi</th><th>vì sao</th></tr>
          <tr><td>“2 × 3 GHz &lt; 6 GHz”: chương trình nhiều luồng không nhanh gấp đôi</td><td>các lõi phải phối hợp để giữ bộ nhớ đệm nhất quán</td></tr>
          <tr><td>chương trình một luồng chỉ dùng được <b>một lõi</b></td><td>lõi kia gần như ngồi không</td></tr>
          <tr><td>siêu phân luồng: thêm 5% tới 15%, lý tưởng 40%</td><td>vẫn chung một bộ nhớ đệm, một bộ tính số thực</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.4"]
        say: "Ở chặng ba, các hãng dùng số bóng bán dẫn tăng thêm để đặt hai lõi lên một chip, và chip hai lõi đầu tiên của Intel cùng AMD đều hẹn ra trong năm 2005. Bài báo năm 2005 viết hai lõi 3 tỉ nhịp không bằng một lõi 6 tỉ nhịp. Lý do là các lõi phải phối hợp để giữ bộ nhớ đệm nhất quán. Chương trình chỉ có một luồng thì chỉ dùng được một lõi, lõi kia gần như ngồi không. Siêu phân luồng chỉ thêm từ 5 tới 15 phần trăm, lý tưởng là 40, vì hai luồng vẫn chung một bộ nhớ đệm."
      - clear: true
        show: |
          <p>Theo bài 13, với $p$ là phần song song được và $n$ là số lõi; lấy $p = 0{,}9$ (số minh hoạ):</p>
          $$S(n) = \dfrac{1}{(1 - p) + \dfrac{p}{n}}$$
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>tăng tốc</th></tr>
          <tr><td>Bước 1. hai lõi</td><td>$\frac{1}{0{,}1 + 0{,}45}$</td><td>$\approx \hlb{1{,}82}$ lần, không phải 2</td></tr>
          <tr><td>Bước 2. chip 100 lõi</td><td>$\frac{1}{0{,}1 + 0{,}009}$</td><td>$\approx 9{,}17$ lần, không phải 100</td></tr>
          <tr><td>Bước 3. chương trình một luồng trên 100 lõi</td><td>dùng 1 lõi trên 100</td><td>$\hl{1\%}$ sức của chip</td></tr></table>
        focus: [2, "3.2", "3.3", "3.4"]
        say: "Theo định luật Amdahl ở bài 13, tăng tốc bằng 1 chia cho phần tuần tự cộng phần song song chia số lõi, ta lấy 90% song song được, một số minh hoạ. Bước một, hai lõi cho 1 chia 0 phẩy 55, khoảng 1 phẩy 82 lần, không phải 2. Bước hai, với chip 100 lõi mà hãng đã nói tới, tăng tốc chỉ khoảng 9 phẩy 17 lần. Bước ba, chương trình một luồng trên chip 100 lõi chỉ dùng được 1 phần trăm sức của chip."
      - clear: true
        show: |
          <p>Nguồn tăng tốc cũ duy nhất còn lại là <b>bộ nhớ đệm lớn hơn</b>: một lần trượt ra bộ nhớ chính thường tốn <b>gấp 10 tới 50 lần</b> lấy từ bộ nhớ đệm.</p>
          <table class="t"><tr><th>bước (bài 10; trúng mất 1 chu kỳ, trượt 5%, số minh hoạ)</th><th>phép tính</th><th>trung bình</th></tr>
          <tr><td>Bước 4. trượt tốn 10 chu kỳ</td><td>1 + 0,05 nhân 10</td><td>1,5 chu kỳ</td></tr>
          <tr><td>Bước 5. trượt tốn 50 chu kỳ</td><td>1 + 0,05 nhân 50</td><td>$\hl{3{,}5}$ chu kỳ</td></tr></table>
          <p class="note">Thực hành: tách việc độc lập ra nhiều luồng; giữ tập dữ liệu đang dùng vừa bộ nhớ đệm; thử trên máy nhiều lõi thật. Điều kiện: các luồng ít chờ nhau, ít dùng chung dữ liệu.</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Nguồn tăng tốc cũ duy nhất còn lại là bộ nhớ đệm lớn hơn, vì một lần trượt ra bộ nhớ chính thường tốn gấp 10 tới 50 lần. Bước bốn, theo công thức bài 10, trúng mất 1 chu kỳ, trượt 5 phần trăm, trượt tốn 10 chu kỳ thì trung bình 1 phẩy 5 chu kỳ. Bước năm, trượt tốn 50 chu kỳ thì trung bình lên 3 phẩy 5 chu kỳ. Thực hành là tách việc độc lập ra nhiều luồng, giữ dữ liệu đang dùng vừa bộ nhớ đệm, và thử trên máy nhiều lõi thật. Điều kiện là các luồng ít chờ nhau, ít dùng chung dữ liệu."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2018 — quy mô hàng tỉ thiết bị: Spectre"
    stage: {year: "2018", scale: "thực thi suy đoán trong chip Intel, AMD, ARM dùng ở hàng tỉ thiết bị; chạy trước được vài trăm lệnh, giới hạn bởi bộ đệm sắp xếp lại (192 vi lệnh ở Haswell); CVE-2017-5753, CVE-2017-5715", source: "[KO19] [LK]", practice: "không đặt bí mật chung không gian địa chỉ với mã không tin cậy (mỗi trang web một tiến trình); coi phép kiểm biên có thể bị chạy vượt khi suy đoán; tối ưu nào cũng phải hỏi nó để lại dấu vết gì"}
    checks:
      - "0.05 * 200 == 10 and 200 / 10 == 20"
      - "min(200 * 4, 192) == 192 and 188 < 192 and 192 - 188 == 4"
    steps:
      - show: |
          <p><b>Quy mô:</b> thực thi suy đoán có trong chip của <b>Intel, AMD, ARM</b>, dùng ở <b>hàng tỉ thiết bị</b>. Vì sao ai cũng làm? Bộ nhớ chậm hơn bộ xử lý rất nhiều: chờ một giá trị thường mất <b>vài trăm chu kỳ</b>.</p>
          <table class="t"><tr><th>bước (chờ 200 chu kỳ, đoán đúng 95% — số minh hoạ)</th><th>phép tính</th><th>chu kỳ mất mỗi lần rẽ nhánh</th></tr>
          <tr><td>Bước 1. ngồi chờ, không đoán</td><td>luôn chờ</td><td>200</td></tr>
          <tr><td>Bước 2. đoán: sai thì mất như ngồi chờ</td><td>0,05 nhân 200</td><td>$\hlg{10}$</td></tr>
          <tr><td>Bước 3. lợi bao nhiêu</td><td>200 chia 10</td><td>ít chờ hơn $\hl{20}$ lần</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng bốn, năm 2018, thực thi suy đoán có trong chip của Intel, AMD và nhiều chip điện thoại, dùng ở hàng tỉ thiết bị. Ai cũng làm vì bộ nhớ chậm hơn bộ xử lý rất nhiều, chờ một giá trị thường mất vài trăm chu kỳ. Bước một, lấy 200 chu kỳ và đoán đúng 95 phần trăm, một số minh hoạ, nếu không đoán thì mỗi lần rẽ nhánh chờ 200 chu kỳ. Bước hai, nếu đoán thì chỉ 5 phần trăm số lần đoán sai mới mất 200, trung bình 10 chu kỳ. Bước ba, 200 chia 10 là ít chờ hơn 20 lần."
      - clear: true
        show: |
          <p>Chạy trước được bao xa? “Vài trăm lệnh”, giới hạn bởi <b>bộ đệm sắp xếp lại</b>: ở dòng chip Haswell của Intel, đủ chỗ cho <b>192 vi lệnh</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 4. muốn chạy trong 200 chu kỳ, 4 vi lệnh mỗi chu kỳ (số minh hoạ)</td><td>200 nhân 4 = 800, nhưng chỉ có 192 chỗ</td><td>chạy trước tối đa $\hlb{192}$ vi lệnh</td></tr>
          <tr><td>Bước 5. thí nghiệm năm 2018</td><td>chèn tới 188 lệnh đơn giản vẫn chạy trước được</td><td>188 &lt; 192, kém đúng 4</td></tr></table>
          <p class="note"><b>Vi lệnh</b>: thao tác nhỏ bên trong chip, mỗi lệnh máy được tách thành một hay vài vi lệnh. <b>Bộ đệm sắp xếp lại</b>: nơi giữ các vi lệnh đã chạy trước, chờ được xác nhận theo đúng thứ tự của chương trình.</p>
        focus: [1, 3, 3, "2.2", "2.2", "2.3"]
        say: "Bộ xử lý chạy trước được vài trăm lệnh, giới hạn bởi bộ đệm sắp xếp lại, và ở một dòng chip của Intel nó đủ chỗ cho 192 vi lệnh. Vi lệnh là thao tác nhỏ bên trong chip, mỗi lệnh máy được tách thành một hay vài vi lệnh. Còn bộ đệm sắp xếp lại giữ các vi lệnh đã chạy trước, cho tới khi chúng được xác nhận theo đúng thứ tự. Bước bốn, nếu chờ 200 chu kỳ với 4 vi lệnh mỗi chu kỳ, một số minh hoạ, bộ xử lý muốn chạy 800 vi lệnh. Nhưng chỉ có 192 chỗ, nên nó chạy trước tối đa 192 vi lệnh. Bước năm, nhóm nghiên cứu đo được rằng chèn tới 188 lệnh đơn giản vẫn chạy trước được, kém đúng 4 so với 192."
      - clear: true
        show: |
          <p><b>Điểm nghẽn mới:</b> người thiết kế tin rằng đoán sai là <b>an toàn</b>, vì thanh ghi được quay lại. Nhóm nghiên cứu chỉ ra: thay đổi trong <b>bộ nhớ đệm</b> không được quay lại, nên phần chạy sai để lại dấu vết đo được.</p>
          <table class="t"><tr><th>giả định cũ bị phá</th><th>cách phòng thủ (mức khái niệm)</th></tr>
          <tr><td>phép kiểm biên mảng luôn chặn được truy cập sai</td><td>nhân hệ điều hành cắt chỉ số về trong biên, không chỉ dựa vào câu lệnh rẽ nhánh</td></tr>
          <tr><td>tiến trình, hộp cát trình duyệt (vùng cách ly cho mã của trang web) tách nhau là đủ</td><td>bí mật để ở tiến trình khác: một trình duyệt lớn chạy mỗi trang web trong một tiến trình riêng</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Điểm nghẽn mới nằm ở một giả định cũ, rằng đoán sai là an toàn vì thanh ghi được quay lại. Nhóm nghiên cứu chỉ ra rằng thay đổi trong bộ nhớ đệm không được quay lại, nên phần chạy sai để lại dấu vết đo được. Phép kiểm biên mảng có thể bị chạy vượt khi suy đoán, nên nhân hệ điều hành cắt chỉ số về trong biên thay vì chỉ dựa vào câu lệnh rẽ nhánh. Bí mật nên nằm ở tiến trình khác với mã không tin cậy, nên một trình duyệt lớn chạy mỗi trang mạng trong một tiến trình riêng."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2019 tới nay — ổn định và tiếp tục: giảm thiểu nhiều lớp"
    stage: {year: "2019 → nay", scale: "biến thể mới vẫn được ghi nhận (CVE-2019-1125, tấn công qua bộ nhớ lịch sử nhánh); nhân hệ điều hành bật giảm thiểu mặc định trên CPU bị ảnh hưởng và báo trạng thái qua tệp hệ thống", source: "[LK] [KO19]", practice: "đọc tệp trạng thái, giữ giảm thiểu mặc định, chọn mức theo độ tin cậy của mã đang chạy; cập nhật nhân và vi mã; hiểu rằng giải pháp lâu dài cần đổi thiết kế chip và tập lệnh"}
    checks:
      - "200 / 10 == 20"
      - "0.75 * 4 == 3.0 and 3.0 / 0.75 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>lớp giảm thiểu</th><th>cái giá (theo nhóm nghiên cứu, năm 2018)</th></tr>
          <tr><td>lệnh chặn suy đoán ở <b>mọi</b> nhánh</td><td>bằng tắt đoán nhánh: “giảm hiệu năng rất mạnh”</td></tr>
          <tr><td>phân tích tĩnh, chỉ chặn ở chỗ có thể rò rỉ</td><td>ít chặn hơn, nhưng phải dịch lại mọi phần mềm</td></tr>
          <tr><td>cơ chế hạn chế đoán nhánh trong phần cứng, nhờ vi mã</td><td>từ vài phần trăm tới gấp 4 lần hoặc hơn</td></tr>
          <tr><td>bàn nhún trả về (thay nhánh gián tiếp trong mã)</td><td>sửa ở trình biên dịch, không cần chờ chip mới</td></tr></table>
          <p class="note"><b>Vi mã</b>: phần mềm nhỏ nằm trong chip, cập nhật được. <b>Nhánh gián tiếp</b>: lệnh nhảy tới địa chỉ lấy từ thanh ghi; bàn nhún trả về viết lại nó bằng lệnh trả về, để chương trình không dùng phải mục đoán nhánh đã bị cài sai.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Ở chặng năm, từ năm 2019 tới nay, giảm thiểu được xếp thành nhiều lớp. Đặt lệnh chặn suy đoán ở mọi nhánh thì bằng tắt đoán nhánh, và nhóm nghiên cứu ghi là giảm hiệu năng rất mạnh. Phân tích tĩnh chỉ chặn ở chỗ có thể rò rỉ, đổi lại phải dịch lại mọi phần mềm. Cơ chế hạn chế đoán nhánh trong phần cứng, bật nhờ vi mã, tốn từ vài phần trăm tới gấp 4 lần hoặc hơn. Bàn nhún trả về thay nhánh gián tiếp ngay trong mã, sửa ở trình biên dịch mà không cần chờ chip mới. Vi mã là phần mềm nhỏ nằm trong chip và cập nhật được, còn nhánh gián tiếp là lệnh nhảy tới một địa chỉ lấy từ thanh ghi. Bàn nhún trả về viết lại lệnh đó bằng lệnh trả về, để chương trình không dùng phải mục đoán nhánh đã bị cài sai."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. chặn mọi nhánh, dùng số của chặng 4</td><td>mỗi nhánh lại chờ 200 thay vì trung bình 10</td><td>chờ nhiều gấp $\hl{20}$ lần</td></tr>
          <tr><td>Bước 2. chương trình 0,75 giây, chậm gấp 4 (mức xấu trong khoảng đã ghi)</td><td>0,75 nhân 4</td><td>$\hl{3}$ giây</td></tr></table>
          <p>Trên nhân hệ điều hành Linux, mỗi máy tự báo trạng thái (dòng thứ hai là một ví dụ kết quả):</p>
          <div class="code"><div>cat /sys/devices/system/cpu/vulnerabilities/spectre_v2</div><div>Mitigation: Enhanced IBRS</div></div>
        focus: ["1.2", "1.3", 2, 3, 3]
        say: "Tính cái giá bằng số của chặng bốn. Bước một, chặn mọi nhánh nghĩa là mỗi nhánh lại chờ 200 chu kỳ thay vì trung bình 10, tức chờ nhiều gấp 20 lần. Bước hai, chương trình 0 phẩy 75 giây mà chậm gấp 4, mức xấu trong khoảng đã ghi, sẽ mất 3 giây. Vì vậy nhân hệ điều hành mã nguồn mở bật mặc định một mức vừa phải, và mỗi máy tự báo trạng thái qua một tệp hệ thống. Tệp này cho biết máy có bị ảnh hưởng không, và biện pháp nào đang bật."
      - clear: true
        show: |
          <table class="t"><tr><th>hướng dẫn chọn mức của đội phát triển nhân</th><th>khi nào</th></tr>
          <tr><td>có thể tắt giảm thiểu</td><td>mọi chương trình đều từ nguồn tin cậy, không chạy mã từ bên ngoài</td></tr>
          <tr><td>bảo vệ riêng chương trình có bí mật</td><td>ví dụ chương trình giữ khoá mã hoá</td></tr>
          <tr><td>khoanh vùng chương trình không tin cậy</td><td>chương trình có thể là nguồn tấn công</td></tr>
          <tr><td>bật hết lúc khởi động</td><td>an ninh cao, chấp nhận chạy chậm hơn</td></tr></table>
          <p class="note">Ổn định không có nghĩa là xong: biến thể mới vẫn được ghi nhận từ 2019 trở đi, và nhóm nghiên cứu viết rằng giải pháp lâu dài cần đổi thiết kế chip và tập lệnh.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Đội phát triển nhân hệ điều hành mã nguồn mở đưa ra một hướng dẫn chọn mức. Nếu mọi chương trình đều từ nguồn tin cậy và không chạy mã từ bên ngoài, có thể tắt giảm thiểu. Chương trình có bí mật, ví dụ giữ khoá mã hoá, thì được bảo vệ riêng. Chương trình không tin cậy thì bị khoanh vùng. Máy cần an ninh cao thì bật hết lúc khởi động và chấp nhận chạy chậm hơn. Ổn định không có nghĩa là xong, vì biến thể mới vẫn được ghi nhận từ 2019 trở đi, và giải pháp lâu dài cần đổi thiết kế chip."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "1.5e9 / 2e9 == 0.75 and 2e9 * 0.75 == 1.5e9"
      - "10 + 45 == 55 and round(100 / 55, 2) == 1.82"
      - "(95 * 0 + 5 * 200) / 100 == 10"
      - "3 / 0.75 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>0,75 giây</td><td>đếm chu kỳ: $1{,}5 \times 10^9$ chu kỳ; 2 tỉ nhịp mỗi giây chạy 0,75 giây đúng bằng $1{,}5 \times 10^9$ nhịp ✓</td></tr>
          <tr><td>1,82 lần</td><td>chương trình 100 giây: 10 giây tuần tự + 90 chia 2 = 45 giây; 100 chia 55 ≈ 1,82 ✓</td></tr>
          <tr><td>10 chu kỳ</td><td>đếm 100 lần rẽ nhánh: 95 lần đúng mất 0, 5 lần sai mất 200; tổng 1000 chia 100 = 10 ✓</td></tr>
          <tr><td>gấp 4 lần</td><td>chia ngược: 3 giây chia 0,75 giây = 4 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Đếm chu kỳ, chương trình cần 1 phẩy 5 tỉ chu kỳ, và 2 tỉ nhịp mỗi giây chạy trong 0 phẩy 75 giây đúng bằng 1 phẩy 5 tỉ nhịp. Lấy chương trình 100 giây, 10 giây tuần tự cộng 90 chia 2 là 45 giây, tổng 55 giây, và 100 chia 55 khoảng 1 phẩy 82. Đếm 100 lần rẽ nhánh, 95 lần đúng mất 0, 5 lần sai mất 200, tổng 1000 chia 100 bằng 10. Chia ngược, 3 giây chia 0 phẩy 75 giây đúng bằng 4."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Máy năm sau nhanh hơn, khỏi tối ưu”</td><td>bài báo năm 2005 gọi đó là câu ngây thơ, và “gần như luôn sai”; chặng 2: 0,40 giây chứ không phải 0,15</td><td>đo chỗ nghẽn, tối ưu chỗ nóng</td></tr>
          <tr><td><b class="red">2.</b> “Gấp đôi số lõi là nhanh gấp đôi”</td><td>2 × 3 GHz &lt; 6 GHz; với 90% song song, hai lõi chỉ 1,82 lần</td><td>tính Amdahl trước khi mua lõi</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ máy năm sau nhanh hơn nên khỏi tối ưu, trong khi bài báo năm 2005 gọi đó là câu ngây thơ và gần như luôn sai. Ở chặng hai, chương trình mất 0 phẩy 40 giây chứ không phải 0 phẩy 15, nên hãy đo chỗ nghẽn và tối ưu chỗ nóng. Bài học sai thứ hai là nghĩ gấp đôi số lõi là nhanh gấp đôi, trong khi với 90% song song, hai lõi chỉ cho 1 phẩy 82 lần. Hãy tính theo Amdahl trước khi mua thêm lõi."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Chạy ổn khi thử nghiệm là chương trình song song đã đúng” (lỗi của người đã đi làm)</td><td>lỗi tranh chấp có thể chỉ lộ ra trên máy nhiều bộ xử lý thật, sau khi đã chạy tốt ở nhiều khách hàng</td><td>thử trên máy nhiều lõi thật, thử tải nặng</td></tr>
          <tr><td><b class="red">4.</b> “Kết quả đúng thì tối ưu là vô hại; vá một lần là xong”</td><td>thanh ghi quay lại nhưng bộ nhớ đệm thì không; biến thể mới vẫn xuất hiện từ 2019 trở đi</td><td>đọc tệp trạng thái, cập nhật nhân và vi mã, chọn mức theo độ tin cậy</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba hay gặp ở người đã đi làm, là nghĩ chương trình song song chạy ổn khi thử nghiệm là đã đúng. Bài báo năm 2005 kể nhiều đội có chương trình chạy tốt ở nhiều khách hàng, tới khi một khách hàng dùng máy nhiều bộ xử lý thật thì lỗi tranh chấp mới lộ ra. Bài học sai thứ tư là nghĩ kết quả đúng thì tối ưu là vô hại, hoặc vá một lần là xong. Thanh ghi quay lại nhưng bộ nhớ đệm thì không, và biến thể mới vẫn xuất hiện từ năm 2019 trở đi. Hãy đọc tệp trạng thái, cập nhật nhân và vi mã, và chọn mức theo độ tin cậy."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "round(10 / 60, 2) == 0.17 and 60 / 1.2 == 50 and round(1 / (0.2 + 0.8 / 8), 2) == 3.33 and round(60 / (1 / (0.2 + 0.8 / 8)), 1) == 18.0"
      - "round(60 / (1 / (0.8 + 0.2 / 8)), 1) == 49.5"
      - "round(18 * 0.10, 1) == 1.8"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống: chương trình xử lý ảnh chạy 60 giây trên một lõi; máy chủ 8 lõi chỉ chạy mã của đội bạn (số minh hoạ)</th></tr>
          <tr><td>1</td><td>mua chip nhịp cao hơn 20%, hay viết lại song song, biết 80% thời gian song song được?</td></tr>
          <tr><td>2</td><td>giảm thiểu Spectre làm chậm 10% (số minh hoạ). Tắt đi cho nhanh, hay giữ?</td></tr></table>
        focus: [1, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với chương trình xử lý ảnh chạy 60 giây trên một lõi, và máy chủ 8 lõi chỉ chạy mã của đội bạn, đều là số minh hoạ. Câu một, bạn mua chip nhịp cao hơn 20 phần trăm, hay viết lại song song, biết 80 phần trăm thời gian song song được? Câu hai, giảm thiểu Spectre làm chậm 10 phần trăm, vậy tắt đi cho nhanh hay giữ lại? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>chip nhịp cao hơn 20%</td><td>không sửa mã: 60 chia 1,2 = $\hlb{50}$ giây</td><td>tiền phần cứng; chỉ bớt 10 trên 60, khoảng 17% thời gian</td></tr>
          <tr><td>viết lại song song, 8 lõi</td><td>$\frac{1}{0{,}2 + 0{,}1} \approx 3{,}33$ lần: 60 chia 3,33 = $\hlg{18}$ giây</td><td>công viết lại, lỗi tranh chấp, phải thử trên máy nhiều lõi</td></tr></table>
          <p class="note">Điều kiện đổi: nếu chỉ 20% song song được, 8 lõi cho $\frac{1}{0{,}8 + 0{,}025}$, còn khoảng 49,5 giây — ngang chip mới, khi đó viết lại không đáng công.</p>
        focus: [1, "1.2", "1.3", "1.3", 2]
        say: "Đáp án câu một có hai lựa chọn. Chip nhịp cao hơn 20 phần trăm không cần sửa mã, 60 chia 1 phẩy 2 còn 50 giây. Viết lại song song trên 8 lõi cho 1 chia 0 phẩy 3, khoảng 3 phẩy 33 lần, tức còn 18 giây. Cái giá là công viết lại, nguy cơ lỗi tranh chấp, và phải thử trên máy nhiều lõi thật. Nhưng nếu chỉ 20 phần trăm song song được thì 8 lõi chỉ còn khoảng 49 phẩy 5 giây, ngang chip mới, khi đó viết lại không đáng công."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>giữ giảm thiểu mặc định</td><td>an toàn cả khi sau này máy chạy mã từ bên ngoài</td><td>18 giây nhân 10% = 1,8 giây mỗi lần chạy</td></tr>
          <tr><td>tắt giảm thiểu</td><td>nhanh hơn 1,8 giây</td><td>đúng chỉ khi <b>mọi</b> chương trình đều tin cậy; một trình cắm của khách, một máy ảo dùng chung là hở</td></tr></table>
          <p class="note">Theo hướng dẫn của đội phát triển nhân, chỉ tắt khi không chạy mã từ bên ngoài, và đo trước xem 10% có thật không. Máy dùng chung, trình duyệt, đám mây: giữ mặc định.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Đáp án câu hai cũng là một đánh đổi. Giữ giảm thiểu mặc định thì an toàn cả khi sau này máy chạy mã từ bên ngoài, đổi lại mất 18 giây nhân 10 phần trăm, tức 1 phẩy 8 giây mỗi lần chạy. Tắt giảm thiểu nhanh hơn 1 phẩy 8 giây, nhưng chỉ đúng khi mọi chương trình đều tin cậy, vì một trình cắm của khách hay một máy ảo dùng chung là hở ngay. Theo hướng dẫn của đội phát triển nhân, chỉ tắt khi không chạy mã từ bên ngoài, và đo trước xem 10 phần trăm có thật không. Máy dùng chung, trình duyệt và đám mây thì giữ mặc định."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">2001: nhanh lên miễn phí</span><span class="a">→</span>
          <span class="n">2003–2005: tường xung nhịp</span><span class="a">→</span>
          <span class="n">2005: đa nhân, Amdahl</span><span class="a">→</span>
          <span class="n">2018: suy đoán để lại dấu vết</span><span class="a">→</span>
          <span class="n">2019 → nay: giảm thiểu theo mức tin cậy</span></div>
        say: "Tổng kết lại hành trình. Năm 2001, phần mềm nhanh lên miễn phí nhờ xung nhịp. Từ 2003 tới 2005, xung nhịp chạm tường vì nhiệt và điện năng. Từ 2005, tốc độ đến từ đa nhân, và định luật Amdahl quyết định ta được bao nhiêu. Năm 2018, việc đoán trước để chạy nhanh hoá ra để lại dấu vết, và từ 2019 tới nay ta giảm thiểu theo mức tin cậy."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi lần tăng tốc đều có <b>điều kiện</b> và có <b>giá</b>. Trước khi mua thêm lõi, viết lại mã hay tắt một lớp bảo vệ, hãy tính thử bằng số của chính mình.</div>
        say: "Điều cần mang theo, mỗi lần tăng tốc đều có điều kiện và có giá. Trước khi mua thêm lõi, viết lại mã, hay tắt một lớp bảo vệ, hãy tính thử bằng số của chính chương trình mình."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá CSA. Từ bit và số nguyên, qua mạch, tập lệnh, hiệu năng, đường ống, bộ nhớ đệm, bộ nhớ ảo và vào ra, bạn đã đi tới cách các chuyên gia đánh đổi tốc độ, song song và an toàn trong bộ xử lý thật.</p>
        say: "Đây là bài cuối của khoá Hệ thống máy tính. Bạn đã đi từ bit và số nguyên, qua mạch lô-gích, tập lệnh, hiệu năng và đường ống. Rồi tới bộ nhớ đệm, bộ nhớ ảo, vào ra, và cuối cùng là cách các chuyên gia đánh đổi tốc độ, song song và an toàn trong bộ xử lý thật. Cảm ơn bạn đã theo học."
