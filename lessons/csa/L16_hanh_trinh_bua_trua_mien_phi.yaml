#   Lời đọc không nói “GHz” (nói “tỉ nhịp mỗi giây” như bài 8), “Linux”, “Chrome”, “lfence”, “retpoline”, “IBRS”: nói “nhân hệ điều hành
#   mã nguồn mở”, “một trình duyệt lớn”, “lệnh chặn suy đoán”, “bàn nhún trả về”, “cơ chế hạn chế đoán nhánh trong phần cứng”.
#   Tên Spectre, Intel, AMD, ARM: lexicon_vi.CSA.yaml (probe p2).
