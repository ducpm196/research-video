" width="100" height="70" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="590" y="330" font-size="40" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="670" y="280" width="100" height="70" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="720" y="330" font-size="40" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="800" y="280" width="100" height="70" rx="10" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="850" y="330" font-size="40" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="930" y="280" width="100" height="70" rx="10" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="980" y="330" font-size="40" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="1060" y="280" width="100" height="70" rx="10" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="1110" y="330" font-size="40" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="1190" y="280" width="100" height="70" rx="10" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="1240" y="330" font-size="40" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><g stroke-width="3" fill="none"><line x1="330" y1="92" x2="330" y2="146" stroke="#9ca3af"/><line x1="460" y1="92" x2="460" y2="146" stroke="#9ca3af"/><line x1="590" y1="92" x2="590" y2="146" stroke="#9ca3af"/><line x1="720" y1="92" x2="720" y2="146" stroke="#9ca3af"/><line x1="850" y1="92" x2="850" y2="146" stroke="#9ca3af"/><line x1="980" y1="92" x2="980" y2="146" stroke="#9ca3af"/><line x1="1110" y1="92" x2="1110" y2="146" stroke="#9ca3af"/><line x1="1240" y1="92" x2="1240" y2="146" stroke="#9ca3af"/></g><g font-size="24" fill="#1f2937"><text x="1045" y="392" text-anchor="middle" fill="#15803d">mặt nạ 1: bit đi qua</text><text x="525" y="392" text-anchor="middle" fill="#b91c1c">mặt nạ 0: bị xoá</text></g><rect x="270" y="10" width="510" height="350" rx="12" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/><rect x="790" y="10" width="510" height="350" rx="12" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="10 8"/></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này cho thấy phép và với mặt nạ diễn ra trên từng cột, không cột nào ảnh hưởng tới cột khác. Hàng trên là byte cấu hình 1 0 1 1, 0 1 1 1, hàng giữa là mặt nạ 0F, bốn bit 0 rồi bốn bit 1. Ở bốn cột bên phải, khung xanh lá, mặt nạ là 1 nên bit của x đi qua nguyên vẹn. Ở bốn cột bên trái, khung đỏ, mặt nạ là 0 nên kết quả luôn là 0, và ta còn lại đúng độ sáng 0 1 1 1."

  - id: example
    kind: example
    title: "Mẹo: xoá bit 1 thấp nhất và kiểm lũy thừa của 2"
    checks:
      - "12 & 11 == 8 and format(12, '04b') == '1100' and format(11, '04b') == '1011'"
      - "16 & 15 == 0 and format(16, '05b') == '10000' and format(15, '05b') == '01111'"
      - "[x for x in range(1, 70) if x & (x - 1) == 0] == [1, 2, 4, 8, 16, 32, 64]"
    steps:
      - show: |
          <p><b>Bước 1.</b> Mẹo <code>x &amp; (x - 1)</code> với $x = 12$: viết $12 = 1100_2$.</p>
        say: "Ta xét một mẹo hay dùng, x và x trừ 1, với x bằng 12. Bước một, viết 12 thành bit, được 1 1 0 0, bit 1 thấp nhất nằm ở cột 4."
      - show: |
          <p><b>Bước 2.</b> $x - 1 = 11 = 1011_2$: bit 1 thấp nhất (cột 4) thành 0, hai bit 0 bên phải nó thành 1.</p>
        say: "Bước hai, trừ 1 được 11, viết là 1 0 1 1. Nhìn từng cột, bit 1 thấp nhất ở cột 4 đã thành 0, còn hai bit 0 bên phải nó thành 1, giống như mượn khi trừ."
      - show: |
          <table class="t"><tr><th></th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
          <tr><td>$x = 12$</td><td>1</td><td>1</td><td>0</td><td>0</td></tr>
          <tr><td>$x - 1 = 11$</td><td>1</td><td>0</td><td>1</td><td>1</td></tr>
          <tr><td>và</td><td>1</td><td>0</td><td>0</td><td>0</td></tr></table>
          <p><b>Bước 3.</b> $1100 \,\&\, 1011 = 1000 = \hl{8}$ — bit 1 thấp nhất đã bị xoá.</p>
        focus: ["1.4", 2, 2]
        say: "Bước ba, và từng cột, chỉ cột 8 có cả hai bit là 1. Ví dụ 12 là 1 1 0 0, 11 là 1 0 1 1, và với nhau ra 1 0 0 0 bằng 8. Lý do là phép trừ 1 biến bit 1 thấp nhất thành 0 và mọi bit 0 bên phải nó thành 1, nên phép và xoá đúng phần đó."
      - clear: true
        show: |
          <p><b>Bước 4.</b> $x = 16 = 10000_2$, $x - 1 = 15 = 01111_2$ → $10000 \,\&\, 01111 = \hl{0}$.</p>
          <div class="box key">$x \gt 0$ là lũy thừa của 2 khi và chỉ khi <code>x &amp; (x - 1) == 0</code> — vì nó chỉ có đúng một bit 1. Máy kiểm từ 1 đến 69: ra 1, 2, 4, 8, 16, 32, 64.</div>
        focus: [1, 2, 2, 2]
        say: "Bước bốn, thử với 16, viết là 1 0 0 0 0, trừ 1 được 15, là 0 1 1 1 1, và với nhau thì không cột nào có hai bit 1, kết quả bằng 0. Từ đó, một số dương là lũy thừa của 2 khi và chỉ khi kết quả bằng 0, vì nó chỉ có đúng một bit 1. Xoá bit 1 duy nhất đó thì không còn gì. Máy kiểm các số từ 1 đến 69, chỉ có 1, 2, 4, 8, 16, 32 và 64 thoả."

  - id: verify
    kind: check
    title: "Tự kiểm: tính lại bằng số học thường"
    checks:
      - "13 << 3 == 13 * 8"
      - "12 % 8 == 4 and 12 - 4 == 8 == 12 & 11"
      - "[16 // 2 ** k for k in range(5)] == [16, 8, 4, 2, 1] and all(16 // 2 ** k % 2 == 0 for k in range(4))"
      - "[96 // 2 ** k for k in range(6)] == [96, 48, 24, 12, 6, 3] and 3 % 2 == 1 and 96 & 95 != 0"
    steps:
      - show: |
          <p>Kết quả của mẹo = $x$ trừ đi giá trị của bit 1 thấp nhất. Với $12 = 8 + 4$, bit 1 thấp nhất mang giá trị 4:</p>
          $$12 - 4 = 8 \quad ✓\ \text{khớp}\ 12 \,\&\, 11 = 8$$
        focus: [1, 1, 2]
        say: "Kiểm bằng đường khác, không dùng phép và. Vì mẹo chỉ xoá bit 1 thấp nhất, kết quả phải bằng x trừ đi giá trị của bit đó. Với 12 bằng 8 cộng 4, bit 1 thấp nhất mang giá trị 4, và 12 trừ 4 bằng 8, khớp kết quả phép và."
      - show: |
          <table class="t"><tr><th>chia đôi liên tiếp</th><th>dãy</th><th>kết luận</th></tr>
          <tr><td>16</td><td>16 → 8 → 4 → 2 → 1, luôn chẵn</td><td>lũy thừa của 2 ✓</td></tr>
          <tr><td>96</td><td>96 → 48 → 24 → 12 → 6 → 3, gặp số lẻ 3</td><td>không phải ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Với phép thử lũy thừa của 2, ta kiểm bằng cách chia đôi liên tiếp, vì lũy thừa của 2 chia đôi mãi vẫn chẵn cho tới khi còn 1. Mười sáu đi 8, 4, 2, 1, luôn chẵn, nên đúng là lũy thừa của 2. Chín mươi sáu đi 48, 24, 12, 6 rồi gặp số lẻ 3, nên không phải, khớp với mẹo x và x trừ 1."
      - clear: true
        show: |
          <table class="t"><tr><th>phép thử nhanh</th><th>ví dụ</th></tr>
          <tr><td>Viết hai toán hạng thẳng hàng theo cột bit, tính từng cột riêng.</td><td>bảng 12 và 11</td></tr>
          <tr><td>Dịch trái $k$: so với phép nhân $2^k$.</td><td>$13 \ll 3$ phải bằng $13 \times 8$</td></tr>
          <tr><td>Mặt nạ: kiểm các bit <b>ngoài</b> mặt nạ vẫn giữ nguyên.</td><td>âm lượng $1011$ không đổi</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, viết hai toán hạng thẳng hàng theo cột bit rồi tính từng cột riêng. Hai, với phép dịch trái, so với phép nhân 2 mũ k, vì hai cách phải ra cùng kết quả khi không tràn. Ba, sau khi dùng mặt nạ, kiểm các bit ngoài mặt nạ vẫn giữ nguyên."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "(1 << 3) == 8 and (3 & 2) == 2 and bool(3 and 2) is True"
      - "-7 >> 1 == -4 and int(-7 / 2) == -3"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nhầm <code>&amp;</code> với <code>&amp;&amp;</code> <b class="red">(sai)</b>
          <br><span class="note"><code>3 &amp; 2</code> là 2 (và từng bit); <code>3 &amp;&amp; 2</code> là đúng (và lôgic của hai giá trị).</span></div>
        say: "Lỗi thứ nhất, nhầm một dấu và với hai dấu và. Một dấu là phép và trên từng bit, 3 và 2 ra 2. Hai dấu là phép và lô-gích của hai giá trị, cho kết quả đúng hoặc sai."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Viết <code>2 ^ 3</code> mong ra 8 <b class="red">(sai)</b>
          <br><span class="note">Trong C, Python, Java, <code>^</code> là hoặc loại trừ: <code>2 ^ 3</code> $= 1$. Lũy thừa 2 thì dùng <code>1 &lt;&lt; 3</code>.</span></div>
        say: "Lỗi thứ hai, viết 2 dấu mũ 3 với mong muốn ra 8. Trong nhiều ngôn ngữ lập trình, dấu mũ là hoặc loại trừ, nên kết quả là 1. Muốn 2 mũ 3 thì dịch 1 sang trái 3 bit."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dịch số lần bằng hoặc lớn hơn độ rộng kiểu <b class="red">(không xác định)</b>
          <br><span class="note">Với số 32 bit trong C, <code>x &lt;&lt; 32</code> là hành vi không xác định — không phải luôn ra 0.</span></div>
        say: "Lỗi thứ ba, dịch một số lần bằng hoặc lớn hơn độ rộng của kiểu. Với số 32 bit trong C, dịch trái 32 lần là hành vi không xác định, không phải lúc nào cũng ra 0."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng dịch phải thay phép chia cho số âm <b class="red">(lệch)</b>
          <br><span class="note">Dịch làm tròn xuống, còn phép chia trong C làm tròn về 0:</span>
          $$-7 \gg 1 = -4 \qquad -7 / 2 = -3$$</div>
        say: "Lỗi thứ tư, dùng dịch phải thay cho phép chia với số âm. Âm 7 dịch phải 1 ra âm 4 vì làm tròn xuống, nhưng âm 7 chia 2 trong C ra âm 3 vì làm tròn về 0."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "0b10110111 | (1 << 6) == 0b11110111 and (0b10110111 & ~(1 << 0)) & 0xFF == 0b10110110"
      - "6 & 5 == 4 and (96 & 95) == 64"
      - "1 << 6 == 0b01000000 and ~(1 << 0) & 0xFF == 0b11111110 and 64 + 32 == 96 and format(96, '07b') == '1100000' and format(95, '07b') == '1011111'"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Bật bit 6 (đếm từ 0 bên phải) của $10110111$, rồi tắt bit 0.</td></tr>
          <tr><td>2</td><td>Tính <code>96 &amp; 95</code>. 96 có phải lũy thừa của 2 không?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bật bit thứ 6, đếm từ 0 bên phải, của dãy 1 0 1 1, 0 1 1 1, rồi tắt bit 0. Câu hai, tính 96 và 95, và cho biết 96 có phải lũy thừa của 2 không? Dừng video và làm ra giấy."
        pause: 8
      - show: |
          <table class="t"><tr><th>bước</th><th>dãy bit</th></tr>
          <tr><td>$x$</td><td>$10110111$</td></tr>
          <tr><td>hoặc với $1 \ll 6 = 01000000$</td><td>$\hl{11110111}$</td></tr>
          <tr><td>và với đảo của $1 \ll 0$, tức $11111110$</td><td>$\hl{11110110}$</td></tr></table>
        focus: ["1.3", "1.3", "1.4", "1.4"]
        say: "Đáp án câu một, hoặc với 1 dịch trái 6 ta được 1 1 1 1, 0 1 1 1. Mặt nạ 1 dịch trái 6 chỉ có một bit 1 ở vị trí 6, và phép hoặc dùng để bật bit nên chỉ bit đó đổi. Sau đó và với phần đảo của 1 để tắt bit 0, ta được 1 1 1 1, 0 1 1 0. Mặt nạ đảo đó có bit 1 ở mọi chỗ trừ bit 0, nên các bit khác giữ nguyên."
      - clear: true
        show: |
          <table class="t"><tr><th></th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
          <tr><td>96</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
          <tr><td>95</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr>
          <tr><td>và</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr></table>
          <p>② $96 \,\&\, 95 = 1000000_2 = 64 \neq 0$ → 96 <b>không</b> là lũy thừa của 2.</p>
        focus: [2, 1, 1, 2]
        say: "Câu hai, 96 và 95 ra 64, khác 0. Để thấy vì sao, viết 96 bằng 64 cộng 32, tức 1 1 0 0 0 0 0, còn 95 là 1 0 1 1 1 1 1. Và từng cột thì chỉ cột 64 có hai bit 1, nên kết quả là 64. Vậy 96 không phải lũy thừa của 2, vì nó có hai bit 1."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">và, hoặc, hoặc loại trừ, đảo: từng bit</span><span class="a">→</span>
          <span class="n">dịch: nhân, chia cho $2^k$</span><span class="a">→</span>
          <span class="n">mặt nạ: chọn nhóm bit</span><span class="a">→</span>
          <span class="n">$x \,\&\, (x - 1)$: xoá bit 1 thấp nhất</span></div>
        say: "Tổng kết lại, các phép và, hoặc, hoặc loại trừ, đảo làm việc trên từng bit. Phép dịch tương đương nhân hay chia cho 2 mũ k. Mặt nạ chọn ra đúng nhóm bit cần làm việc. Và x và x trừ 1 xoá bit 1 thấp nhất."
      - show: |
