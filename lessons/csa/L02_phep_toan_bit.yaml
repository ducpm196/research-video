  - show: '<div class="chain"><span class="n">và, hoặc, hoặc loại trừ, đảo: từng bit</span><span class="a">→</span>

      <span class="n">dịch: nhân, chia cho $2^k$</span><span class="a">→</span>

      <span class="n">mặt nạ: chọn nhóm bit</span><span class="a">→</span>

      <span class="n">$x \,\&\, (x - 1)$: xoá bit 1 thấp nhất</span></div>

      '
    say: Tổng kết lại, các phép và, hoặc, hoặc loại trừ, đảo làm việc trên từng bit. Phép dịch tương đương nhân hay chia cho
      2 mũ k. Mặt nạ chọn ra đúng nhóm bit cần làm việc. Và x và x trừ 1 xoá bit 1 thấp nhất. Phép toán bit biến thanh ghi
      duy nhất thành bảng công tắc gọn nhẹ thao tác trực tiếp trên phần cứng. Bộ ba mặt nạ và, hoặc, loại trừ thao tác từng
      bit đơn lẻ trong một nhịp đồng hồ với chi phí bộ nhớ tối thiểu.
  - show: '<div class="box key"><b>Tư duy:</b> trình điều khiển thiết bị, giao thức mạng, mã nén đều đọc và ghi từng nhóm
      bit — mặt nạ là công cụ hằng ngày của lập trình hệ thống.</div>

      '
    say: Điều cần mang theo, trình điều khiển thiết bị, giao thức mạng và mã nén đều đọc ghi từng nhóm bit, nên mặt nạ là
      công cụ hằng ngày của lập trình hệ thống. Luôn chú ý độ ưu tiên ngoặc đơn và dấu khi dịch phải để tránh hỏng toàn bộ
      bộ giải mã giao thức.
