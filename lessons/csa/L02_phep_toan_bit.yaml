# Quy ước: phép bit viết bằng toán tử của C trong khối mã (&, |, ^, ~, <<, >>); trong chữ nói bằng lời “và bit”, “hoặc bit”,
#   “hoặc loại trừ”. Số 8 bit viết đủ 8 chữ số. Dịch phải số âm: dịch số học (giữ bit dấu).
objectives:
  - "Dùng và, hoặc, hoặc loại trừ, đảo bit, dịch trái, dịch phải"
  - "Dùng mặt nạ để lấy, bật, tắt một nhóm bit"
  - "Viết mẹo kiểm lũy thừa của 2"
