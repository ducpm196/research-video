scenes:
- id: hook
  kind: hook
  title: Tám công tắc trong một byte
  checks:
  - (0b10110111 >> 4) & 0xF == 11 and 0b10110111 & 0xF == 7
  steps:
  - show: '<p>Một byte cấu hình thiết bị: 4 bit cao là <b>âm lượng</b>, 4 bit thấp là <b>độ sáng</b>: $10110111_2$.</p>

      <p>Làm sao đọc riêng âm lượng, hay chỉ đổi độ sáng mà không đụng âm lượng?</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Chào bạn, một byte cấu hình thiết bị gồm 4 bit cao là âm lượng, 4 bit thấp là độ sáng. Làm sao đọc riêng âm lượng,
      hay chỉ đổi độ sáng mà không đụng tới âm lượng? Thao tác từng bit bằng phép dịch trái phải mở đường tối ưu nén cờ trạng
      thái chạy trong duy nhất một chu kỳ.
  - show: '<div class="box key">Hôm nay: các phép toán làm việc trên <b>từng bit</b>, và mặt nạ để chọn đúng các bit cần sửa.</div>

      '
    say: Hôm nay ta học các phép toán làm việc trên từng bit, và cách dùng mặt nạ để chọn đúng những bit cần sửa. Kết hợp
      các mặt nạ bit giúp kiểm tra, bật, tắt hoặc đảo riêng một quyền hạn gọn nhẹ không động tới phần còn lại.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: viết số thành bit, và hai công tắc'
  checks:
  - 8 + 4 == 12 and format(12, '04b') == '1100' and 8 + 2 == 10 and format(10, '04b') == '1010'
  - '[(a, b, a & b, a | b) for a in (0, 1) for b in (0, 1)] == [(0, 0, 0, 0), (0, 1, 0, 1), (1, 0, 0, 1), (1, 1, 1, 1)]'
  steps:
  - show: '<p>Như ở bài 0: $12 = 8 + 4 = 1100_2$, &nbsp; $10 = 8 + 2 = 1010_2$. Viết thẳng hàng, mỗi cột là một vị trí bit:</p>

      <table class="t"><tr><th></th><th>8</th><th>4</th><th>2</th><th>1</th></tr>

      <tr><td>12</td><td>1</td><td>1</td><td>0</td><td>0</td></tr>

      <tr><td>10</td><td>1</td><td>0</td><td>1</td><td>0</td></tr></table>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Trước hết, ôn cách viết số thành bit ở bài 0. Mười hai bằng 8 cộng 4, nên viết là 1 1 0 0, còn 10 bằng 8 cộng 2,
      viết là 1 0 1 0. Viết hai số thẳng hàng như bảng này, mỗi cột là một vị trí bit, và các phép toán hôm nay làm riêng
      trên từng cột. Hiểu bản chất từng phép toán logic hai ngôi và, hoặc, loại trừ trên từng cặp bit tương ứng.
  - show: '<table class="t"><tr><th>công tắc a</th><th>công tắc b</th><th>nối tiếp: đèn sáng khi cả hai bật</th><th>song song:
      đèn sáng khi ít nhất một bật</th></tr>

      <tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td><td>1</td></tr>

      <tr><td>1</td><td>0</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>

      '
    focus:
    - 0
    - - '1.2'
      - '1.3'
      - '1.4'
      - '1.5'
    - - '1.2'
      - '1.3'
      - '1.4'
      - '1.5'
    say: Với một bit, hãy nghĩ tới hai công tắc và một bóng đèn, 1 là bật, 0 là tắt. Mắc nối tiếp thì đèn chỉ sáng khi cả
      hai công tắc bật, đó là phép và. Mắc song song thì đèn sáng khi ít nhất một công tắc bật, đó là phép hoặc.
- id: sym
  kind: symbol
  title: 'Giải mã: bốn phép toán trên từng bit'
  checks:
  - (0b1100 & 0b1010) == 0b1000 and (0b1100 | 0b1010) == 0b1110 and (0b1100 ^ 0b1010) == 0b0110 and (~0b1100 & 0xF) == 0b0011
  steps:
  - show: '<table class="t"><tr><th>toán tử</th><th>tên</th><th>$1100 \;\text{op}\; 1010$</th></tr>

      <tr><td><code>&amp;</code></td><td>và bit: 1 khi cả hai là 1</td><td>$1000$</td></tr>

      <tr><td><code>|</code></td><td>hoặc bit: 1 khi ít nhất một là 1</td><td>$1110$</td></tr>

      <tr><td><code>^</code></td><td>hoặc loại trừ: 1 khi hai bit khác nhau</td><td>$0110$</td></tr>

      <tr><td><code>~</code></td><td>đảo mọi bit (một toán hạng): <code>~1100</code> $= 0011$</td><td></td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Có bốn phép toán trên từng bit, làm riêng ở mỗi vị trí, giống bảng hai công tắc vừa xem. Dấu và cho 1 khi cả hai
      bit là 1. Dấu gạch đứng là hoặc, cho 1 khi ít nhất một bit là 1. Dấu mũ là hoặc loại trừ, cho 1 khi hai bit khác nhau.
      Dấu sóng đảo mọi bit, 1 1 0 0 thành 0 0 1 1.
- id: shift
  kind: concept
  title: Dịch trái, dịch phải
  checks:
  - 13 << 3 == 104 == 13 * 2 ** 3 and 104 >> 2 == 26 == 104 // 4
  - -8 >> 1 == -4 and (0b11111000 >> 1) == 124
  steps:
  - show: '<p><code>x &lt;&lt; k</code>: dịch trái $k$ bit, thêm $k$ số 0 bên phải $= x \times 2^k$ (nếu không tràn). &nbsp;
      $13 \ll 3 = 104$.</p>

      <p><code>x &gt;&gt; k</code>: dịch phải $k$ bit, bỏ $k$ bit thấp $=$ chia lấy phần nguyên cho $2^k$ (với số không âm).
      &nbsp; $104 \gg 2 = 26$.</p>

      '
    introduces:
    - shl
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Dịch trái k bit là thêm k số 0 vào bên phải, tương đương nhân với 2 mũ k nếu không tràn. Ví dụ 13 dịch trái 3 bằng
      13 nhân 8, bằng 104. Dịch phải k bit là bỏ k bit thấp, tương đương chia lấy phần nguyên cho 2 mũ k với số không âm.
      Ví dụ 104 dịch phải 2 bằng 26.
  - show: '<div class="box warn">Dịch phải số <b>âm</b> có hai kiểu: <b>số học</b> chép bit dấu vào bên trái ($-8 \gg 1 =
      -4$); <b>lôgic</b> điền 0 ($11111000 \to 01111100 = 124$).</div>

      '
    say: Chú ý, dịch phải một số âm có hai kiểu. Dịch số học chép bit dấu vào bên trái, nên âm 8 dịch phải 1 ra âm 4. Dịch
      lô-gích luôn điền 0, nên cùng dãy bit đó ra 124.
- id: mask
  kind: concept
  title: 'Mặt nạ: lấy, bật, tắt, đảo một nhóm bit'
  checks:
  - 0b10110111 & 0x0F == 0b0111 and (0b10110111 >> 4) & 0x0F == 0b1011
  - (0b10110111 & 0xF0) | 0b1010 == 0b10111010
  steps:
  - show: '<table class="t"><tr><th>việc cần làm</th><th>công thức</th><th>với $x = 10110111$</th></tr>

      <tr><td>lấy 4 bit thấp (độ sáng)</td><td><code>x &amp; 0x0F</code></td><td>$0111 = 7$</td></tr>

      <tr><td>lấy 4 bit cao (âm lượng)</td><td><code>(x &gt;&gt; 4) &amp; 0x0F</code></td><td>$1011 = 11$</td></tr>

      <tr><td>đặt độ sáng thành 10</td><td><code>(x &amp; 0xF0) | 10</code></td><td>$1011\,1010$</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Mặt nạ là một dãy bit chọn ra những vị trí cần làm việc. Lấy 4 bit thấp, ta và với 0F, tức bốn bit 1 ở thấp, được
      0 1 1 1 bằng 7. Lấy 4 bit cao, ta dịch phải 4 rồi và với 0F, được 1 0 1 1 bằng 11. Muốn đặt độ sáng thành 10, ta xoá
      4 bit thấp bằng cách và với F0, rồi hoặc với 10.
  - show: '<p class="note">Quy tắc nhớ: <b>và</b> để xoá hoặc lấy, <b>hoặc</b> để bật, <b>hoặc loại trừ</b> để đảo.</p>

      '
    say: Quy tắc dễ nhớ, phép và dùng để xoá hoặc lấy bit, phép hoặc dùng để bật bit, phép hoặc loại trừ dùng để đảo bit.
