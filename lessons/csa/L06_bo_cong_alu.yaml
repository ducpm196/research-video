# Quy ước: số 4 bit cho ví dụ; bit đánh số 0 (phải) tới 3 (trái). Cờ: C = nhớ ra khỏi bit cao nhất, V = tràn có dấu.
#   Tên “ALU” chỉ trên màn hình; lời đọc nói “khối tính toán số học và lô-gích”.
objectives:
  - "Nối các bộ cộng toàn phần thành bộ cộng nhiều bit"
  - "Thực hiện phép trừ bằng chính bộ cộng"
  - "Phát hiện tràn có dấu và không dấu bằng phần cứng"
