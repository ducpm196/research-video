id: L04
course: CSA
series: "CSA · Hệ thống máy tính"
title: "Bài 4 — Sai số làm tròn, epsilon máy và triệt tiêu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/csa.yaml L04; audit/verify_plan_curricula.py CSA:L04; N. Higham, Accuracy and Stability of Numerical Algorithms (2002), chương 1–2; mọi con số chạy lại bằng số thực 64 bit của Python"
assumes: [arith, power, sub, sub2, dots, approx]
# Quy ước: “số thực 64 bit” = double; ε (epsilon máy) = khoảng cách từ 1 tới số thực lớn hơn kế tiếp = 2⁻⁵² với double.
#   Phần thập phân viết dấu phẩy trong chữ, dấu chấm trong mã.
objectives:
  - "Giải thích epsilon máy và sai số tương đối của một phép tính"
  - "Nhận ra phép cộng số thực không kết hợp"
  - "Nhận ra và tránh triệt tiêu khi trừ hai số gần nhau"
asr_reviewed:
  - {sentence: "Epsilon là khoảng cách quanh số 1.", reason: "ASR chép “FC Long là khoảng cách quanh số 1.” (0.8): “epsilon” đọc theo luật lexicon (lexicon_vi.yaml: “ép-xi-lôn”), ASR viết “fc long” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, khai triển 1 cộng h bình phương trừ 1 thành 2h cộng h bình phương.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cộng 1 vào 10 mũ 16 rồi trừ đi"
    checks:
      - "(1e16 + 1) - 1e16 == 0.0"
    steps:
      - show: |
          <div class="code"><div>&gt;&gt;&gt; (1e16 + 1) - 1e16</div><div>0.0</div></div>
          <p>Số 1 vừa cộng vào biến mất. Trong một mô hình hay một mô phỏng, những mất mát nhỏ như vậy có thể <b>tích lũy</b> thành sai lệch lớn.</p>
        focus: ["1.2", "1.2", 2]
        say: "Chào bạn, cộng 1 vào 10 mũ 16 rồi trừ lại 10 mũ 16, máy cho kết quả 0. Số 1 vừa cộng vào đã biến mất. Trong một mô hình hay một mô phỏng, những mất mát nhỏ như vậy có thể tích lũy thành sai lệch lớn."
      - show: |
          <div class="box key">Hôm nay: mỗi phép tính số thực sai tối đa bao nhiêu (epsilon máy), vì sao thứ tự phép cộng quan trọng, và khi nào phép trừ làm mất hết chữ số có nghĩa.</div>
        say: "Hôm nay ta học mỗi phép tính số thực sai tối đa bao nhiêu, vì sao thứ tự phép cộng quan trọng, và khi nào phép trừ làm mất hết chữ số có nghĩa."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: sai số tương đối và chữ số có nghĩa"
    checks:
      - "abs(abs(0.333 - 1 / 3) - 1 / 3000) < 1e-15 and abs((1 / 3000) / (1 / 3) - 0.001) < 1e-15"
      - "round(1.2345 - 1.2344, 10) == 0.0001"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>với $\frac{1}{3}$ viết thành 0,333</th></tr>
          <tr><td>sai số tuyệt đối $= |\,\text{gần đúng} - \text{đúng}\,|$</td><td>$|0{,}333 - \frac{1}{3}| = \frac{1}{3000} \approx 0{,}00033$</td></tr>
          <tr><td>sai số tương đối = sai số tuyệt đối chia độ lớn</td><td>$\frac{1}{3000} : \frac{1}{3} = 0{,}001 = 0{,}1\%$</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3"]
        say: "Trước hết, ôn hai cách đo sai số. Viết một phần ba thành 0 phẩy 333 thì sai số tuyệt đối là trị tuyệt đối của hiệu, hai vạch đứng hai bên nghĩa là bỏ dấu âm. Hiệu đó bằng 1 phần 3000, khoảng 0 phẩy 00033. Sai số tương đối là sai số tuyệt đối chia cho độ lớn của số, ở đây bằng 0 phẩy 001, tức 0 phẩy 1 phần trăm."
      - show: |
          <p>Hai số đều có 5 chữ số có nghĩa: $1{,}2345$ và $1{,}2344$. Trừ nhau:</p>
          $$1{,}2345 - 1{,}2344 = 0{,}0001$$
          <p>Bốn chữ số đầu chung nhau bị trừ mất — kết quả chỉ còn <b>1</b> chữ số có nghĩa.</p>
        focus: [1, 2, 3]
        say: "Chữ số có nghĩa là các chữ số đáng tin của một số. Hai số 1 phẩy 2345 và 1 phẩy 2344 đều có năm chữ số có nghĩa, trừ nhau được 0 phẩy 0001. Bốn chữ số đầu chung nhau đã bị trừ mất, nên kết quả chỉ còn một chữ số có nghĩa, và nếu chữ số cuối của mỗi số vốn đã sai thì kết quả sai hoàn toàn."

  - id: sym
    kind: symbol
    title: "Giải mã: epsilon máy ε"
    checks:
      - "__import__('sys').float_info.epsilon == 2 ** -52 and 1 + 2 ** -52 != 1 and 1 + 2 ** -53 == 1"
      - "2 ** -23 == 1.1920928955078125e-07"
    steps:
      - show: |
          <p>$\varepsilon$ (epsilon máy): khoảng cách từ 1 tới số thực <b>kế tiếp</b> lớn hơn 1.</p>
          <p>Số thực 64 bit có 52 bit phần định trị nên $\varepsilon = 2^{-52} \approx 2{,}22 \times 10^{-16}$; số 32 bit: $2^{-23} \approx 1{,}19 \times 10^{-7}$.</p>
          <div class="box key">Mỗi phép cộng, trừ, nhân, chia làm tròn về số gần nhất, nên sai số tương đối của <b>một</b> phép tính không quá $\frac{\varepsilon}{2}$ (khi kết quả không tràn và không quá gần 0).</div>
        introduces: [epsilon]
        focus: [1, 2, 2, 3]
        say: "Chữ ép-xi-lôn ở đây là epsilon máy, khoảng cách từ 1 tới số thực kế tiếp lớn hơn 1. Số thực 64 bit có 52 bit phần định trị, nên epsilon bằng 2 mũ âm 52, khoảng 2 phẩy 22 nhân 10 mũ âm 16. Với số 32 bit, epsilon khoảng 1 phẩy 19 nhân 10 mũ âm 7. Vì mỗi phép tính làm tròn về số gần nhất, sai số tương đối của một phép tính không quá một nửa epsilon, miễn là kết quả không tràn và không quá gần 0."

  # ───────────────────────── 3. KHÔNG KẾT HỢP ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Các số lưu được thưa dần khi số lớn lên"
    checks:
      - "__import__('math').nextafter(1e16, 2e16) - 1e16 == 2.0 and 1e16 + 1 == 1e16 and 1e16 + 2 != 1e16"
      - "__import__('math').nextafter(1.0, 2.0) - 1.0 == 2 ** -52"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><defs><marker id="arR4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><g stroke="#1f2937" stroke-width="3"><line x1="100" y1="100" x2="1400" y2="100"/><line x1="100" y1="280" x2="1400" y2="280"/></g><circle cx="160" cy="100" r="9" fill="#2a78d6"/><circle cx="220" cy="100" r="9" fill="#2a78d6"/><circle cx="280" cy="100" r="9" fill="#2a78d6"/><circle cx="340" cy="100" r="9" fill="#2a78d6"/><circle cx="400" cy="100" r="9" fill="#2a78d6"/><circle cx="460" cy="100" r="9" fill="#2a78d6"/><circle cx="520" cy="100" r="9" fill="#2a78d6"/><circle cx="580" cy="100" r="9" fill="#2a78d6"/><circle cx="640" cy="100" r="9" fill="#2a78d6"/><circle cx="700" cy="100" r="9" fill="#2a78d6"/><circle cx="760" cy="100" r="9" fill="#2a78d6"/><circle cx="820" cy="100" r="9" fill="#2a78d6"/><circle cx="880" cy="100" r="9" fill="#2a78d6"/><circle cx="940" cy="100" r="9" fill="#2a78d6"/><circle cx="1000" cy="100" r="9" fill="#2a78d6"/><circle cx="1060" cy="100" r="9" fill="#2a78d6"/><circle cx="1120" cy="100" r="9" fill="#2a78d6"/><circle cx="1180" cy="100" r="9" fill="#2a78d6"/><circle cx="1240" cy="100" r="9" fill="#2a78d6"/><circle cx="1300" cy="100" r="9" fill="#2a78d6"/><circle cx="1360" cy="100" r="9" fill="#2a78d6"/><circle cx="250" cy="280" r="12" fill="#2a78d6"/><circle cx="750" cy="280" r="12" fill="#2a78d6"/><circle cx="1250" cy="280" r="12" fill="#2a78d6"/><g font-size="26" fill="#1f2937"><text x="100" y="50">quanh 1: các số lưu được cách nhau epsilon, khoảng 2,22 nhân 10 mũ -16</text><text x="100" y="200">quanh 10 mũ 16: các số lưu được cách nhau 2</text><text x="250" y="330" text-anchor="middle">10 mũ 16</text><text x="750" y="330" text-anchor="middle">10 mũ 16 + 2</text><text x="1250" y="330" text-anchor="middle">10 mũ 16 + 4</text></g><circle cx="500" cy="280" r="12" fill="#ffffff" stroke="#b91c1c" stroke-width="4"/><path d="M490,262 C440,225 320,225 268,262" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR4)"/><text x="500" y="380" font-size="24" text-anchor="middle" fill="#b91c1c">10 mũ 16 + 1: không có chỗ, làm tròn về 10 mũ 16</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ các số mà máy lưu được, thành những chấm xanh trên trục số. Quanh số 1 các chấm rất dày, cách nhau đúng epsilon. Quanh 10 mũ 16 các chấm đã thưa ra, hai chấm liền nhau cách nhau 2, nên số 10 mũ 16 cộng 1 rơi đúng vào khoảng trống, vòng tròn đỏ rỗng. Máy không có chỗ cho nó, nên làm tròn về 10 mũ 16, và số 1 vừa cộng vào biến mất như ở đầu bài."

  - id: assoc
    kind: concept
    title: "Phép cộng số thực không kết hợp"
    checks:
      - "(0.1 + 0.2) + 0.3 == 0.6000000000000001 and 0.1 + (0.2 + 0.3) == 0.6"
      - "(1e16 + 1.0) + 1.0 == 1e16 and 1e16 + (1.0 + 1.0) == 1e16 + 2"
    steps:
      - show: |
          <p>$(0{,}1 + 0{,}2) + 0{,}3 = 0{,}6000000000000001$, nhưng $0{,}1 + (0{,}2 + 0{,}3) = 0{,}6$.</p>
          <p>$(10^{16} + 1) + 1 = 10^{16}$ (mỗi số 1 bị làm tròn mất), nhưng $10^{16} + (1 + 1) = 10^{16} + 2$.</p>
          <div class="box warn">Cộng nhiều số: cộng các số <b>nhỏ</b> với nhau trước, rồi mới cộng vào số lớn.</div>
        focus: [1, 2, 2, 3]
        say: "Với số thực, thứ tự phép cộng làm đổi kết quả. Cộng 0 phẩy 1 với 0 phẩy 2 trước rồi cộng 0 phẩy 3 ra 0 phẩy 6 kèm đuôi, nhưng nhóm cách khác thì ra đúng 0 phẩy 6. Cộng 1 vào 10 mũ 16 hai lần, mỗi lần số 1 đều bị làm tròn mất, nhưng cộng 1 với 1 trước rồi mới cộng vào thì giữ được số 2. Vì vậy khi cộng nhiều số, hãy cộng các số nhỏ với nhau trước."

  # ───────────────────────── 4. TRIỆT TIÊU ─────────────────────────
  - id: example
    kind: example
    title: "Triệt tiêu: (1 − cos x)/x² với x rất nhỏ"
    checks:
      - "(1 - __import__('math').cos(1e-8)) / 1e-16 == 0.0"
      - "abs(2 * __import__('math').sin(0.5e-8) ** 2 / 1e-16 - 0.5) < 1e-12"
      # Ngay dưới 1, số 64 bit cách nhau ε/2 = 2^-53 (nextafter); làm tròn gần nhất nên chỉ phần thiếu < ε/4 = 2^-54 ≈ 5,55e-17 mới về đúng 1 (IEEE 754-2019 §4.3.1; Goldberg 1991 §1.1).
      - "1.0 - __import__('math').nextafter(1.0, 0.0) == 2 ** -53 and 1.0 - 5e-17 == 1.0 and 1.0 - 8e-17 != 1.0 and round(2 ** -54 * 1e17, 2) == 5.55"
    steps:
      - show: |
          <p>Hàm lượng giác quen thuộc $\cos x$, $\sin x$. Khi $x$ nhỏ, $\frac{1 - \cos x}{x^2} \approx \frac{1}{2}$. Tính với $x = 10^{-8}$.</p>
          <p><b>Bước 1.</b> Đúng ra $\cos(10^{-8}) \approx 1 - 5 \times 10^{-17}$. Ngay dưới 1 các số lưu được cách nhau $\frac{\varepsilon}{2}$, nên phần thiếu nhỏ hơn $\frac{\varepsilon}{4} \approx 5{,}55 \times 10^{-17}$ bị bỏ → máy làm tròn thành đúng $1$.</p>
        introduces: [cos, sin]
        focus: [1, 2, 2, 2]
        say: "Khi x rất nhỏ, biểu thức 1 trừ cô-sin x, chia x bình phương, xấp xỉ một phần hai. Bước một, tính thẳng với x bằng 10 mũ âm 8, cô-sin x đúng ra bằng 1 trừ khoảng 5 nhân 10 mũ âm 17. Ngay dưới số 1, các số lưu được cách nhau một nửa epsilon. Vì vậy phần thiếu nhỏ hơn một phần tư epsilon, khoảng 5 phẩy 55 nhân 10 mũ âm 17, bị bỏ đi, và máy làm tròn cô-sin x thành đúng 1."
      - show: |
          <p><b>Bước 2.</b> $1 - 1 = 0$, rồi $\frac{0}{10^{-16}} = \hl{0}$ — sai hoàn toàn.</p>
        say: "Bước hai, vì cô-sin x đã thành 1, phép trừ ra 0, chia cho 10 mũ âm 16 vẫn là 0. Kết quả cuối là 0, sai hoàn toàn so với một phần hai."
      - show: |
          <p><b>Bước 3.</b> Viết lại bằng $1 - \cos x = 2 \sin^2\!\frac{x}{2}$ (không còn phép trừ): $\sin(5 \times 10^{-9}) \approx 5 \times 10^{-9}$.</p>
          $$\frac{2 \times (5 \times 10^{-9})^2}{10^{-16}} = \frac{5 \times 10^{-17}}{10^{-16}} = \hl{0{,}5}\ ✓$$
        focus: [1, 1, 2]
        say: "Bước ba, viết lại bằng hằng đẳng thức, 1 trừ cô-sin x bằng 2 lần sin bình phương của x chia 2, không còn phép trừ hai số gần nhau. Sin của 5 nhân 10 mũ âm 9 xấp xỉ chính nó, bình phương rồi nhân 2 được 5 nhân 10 mũ âm 17. Chia cho 10 mũ âm 16, máy cho đúng 0 phẩy 5."
      - show: |
          <div class="box key">Triệt tiêu: trừ hai số <b>gần bằng nhau</b> làm mất các chữ số có nghĩa chung, chỉ còn lại phần sai số làm tròn. Cách chữa: biến đổi đại số để tránh phép trừ đó.</div>
        say: "Hiện tượng này gọi là triệt tiêu. Trừ hai số gần bằng nhau làm mất các chữ số có nghĩa chung, chỉ còn lại phần sai số làm tròn. Cách chữa là biến đổi đại số để tránh phép trừ đó."

  - id: verify2
    kind: check
    title: "Tự kiểm: tính bằng chuỗi lũy thừa, không dùng hàm cô-sin"
    checks:
      # Ngưỡng cũ 2^-53 (ε/2) là khoảng cách phía TRÊN 1; phía dưới 1 ngưỡng làm tròn là 2^-54 (ε/4) — xem bước 1 của ví dụ.
      - "__import__('math').cos(1e-8) == 1.0 and 5e-17 < 2 ** -54"
      - "abs((1 / 2 - 1e-16 / 24) - 0.5) < 1e-17 and round(1e-16 / 24, 20) == 4.17e-18"
      # Thử công thức xấp xỉ ở x = 0,1 (ví dụ số mới, đợt C).
      - "round(1 - 0.1 ** 2 / 2 + 0.1 ** 4 / 24, 6) == round(__import__('math').cos(0.1), 6) == 0.995004 and round(0.1 ** 4 / 24, 7) == 4.2e-6"
    steps:
      - show: |
          <p>Gần $x = 0$, cô-sin viết được thành tổng các lũy thừa của $x$: $\cos x \approx 1 - \frac{x^2}{2} + \frac{x^4}{24}$.</p>
          <p>Thử $x = 0{,}1$: $1 - 0{,}005 + 0{,}0000042 \approx 0{,}995004$, đúng bằng $\cos 0{,}1$ tới 6 chữ số ✓. Nên</p>
          $$\frac{1 - \cos x}{x^2} \approx \frac{1}{2} - \frac{x^2}{24}$$
        focus: [1, 1, 2, 3]
        say: "Kiểm bằng đường khác, ta không gọi hàm cô-sin. Gần 0, cô-sin viết được thành tổng các lũy thừa của x, cô-sin x xấp xỉ 1 trừ x bình phương chia 2, cộng x mũ 4 chia 24. Thử với x bằng 0 phẩy 1, công thức cho 0 phẩy 995004, đúng bằng cô-sin của 0 phẩy 1 tới sáu chữ số sau dấu phẩy. Thay vào và chia cho x bình phương, biểu thức xấp xỉ một phần hai trừ x bình phương chia 24."
      - show: |
          $$\frac{1}{2} - \frac{(10^{-8})^2}{24} = 0{,}5 - 4{,}17 \times 10^{-18} \approx 0{,}5\ ✓$$
          <p>Khớp cách viết lại; cách tính thẳng ra 0 là sai.</p>
        focus: [1, 2]
        say: "Với x bằng 10 mũ âm 8, phần trừ đi chỉ khoảng 4 phẩy 17 nhân 10 mũ âm 18, nên đáp số đúng là 0 phẩy 5. Kết quả này khớp với cách viết lại, và khẳng định cách tính thẳng ra 0 là sai."

  - id: verify
    kind: check
    title: "Tự kiểm: ba câu hỏi"
    checks:
      - "1e16 + 1 == 1e16"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi tự kiểm</th></tr>
          <tr><td>Có phép trừ hai đại lượng gần nhau không? Nếu có, tìm cách viết lại.</td></tr>
          <tr><td>Có cộng số rất nhỏ vào số rất lớn không? Tỉ số cỡ $\frac{\varepsilon}{2}$ trở xuống thì số nhỏ có thể biến mất.</td></tr>
          <tr><td>Tính lại bằng độ chính xác cao hơn (hoặc phân số chính xác) rồi so — chênh nhiều là có vấn đề.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba câu hỏi. Một, có phép trừ hai đại lượng gần nhau không, nếu có thì tìm cách viết lại. Hai, có cộng một số rất nhỏ vào một số rất lớn không, vì khi tỉ số cỡ một nửa epsilon trở xuống thì số nhỏ có thể biến mất. Ba, tính lại bằng độ chính xác cao hơn hoặc bằng phân số chính xác rồi so, nếu chênh nhiều thì có vấn đề."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "__import__('sys').float_info.epsilon * 1e16 > 1"
      - "__import__('sys').float_info.min == 2 ** -1022 and 1e-308 < 2 ** -1022 < 1e-307"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ epsilon là số dương nhỏ nhất máy lưu được <b class="red">(sai)</b>
          <br><span class="note">$\varepsilon$ là khoảng cách quanh số 1. Số dương chuẩn hoá (dạng có số 1 ẩn trước phần định trị) nhỏ nhất của số thực 64 bit nhỏ hơn rất nhiều (cỡ $10^{-308}$).</span></div>
        say: "Lỗi thứ nhất, nghĩ epsilon là số dương nhỏ nhất máy lưu được. Epsilon là khoảng cách quanh số 1. Còn số dương nhỏ nhất ở dạng chuẩn hoá, tức dạng có số 1 ẩn trước phần định trị, của số thực 64 bit thì nhỏ hơn rất nhiều, cỡ 10 mũ âm 308."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ khoảng cách giữa các số thực đều nhau <b class="red">(sai)</b>
          <br><span class="note">Khoảng cách tỉ lệ với độ lớn: quanh $10^{16}$ khoảng cách đã lớn hơn 1, nên cộng 1 không đổi gì:</span>
          $$10^{16} + 1 = 10^{16}$$</div>
        say: "Lỗi thứ hai, nghĩ các số thực cách đều nhau trên trục số. Khoảng cách tỉ lệ với độ lớn, quanh 10 mũ 16 khoảng cách đã lớn hơn 1, nên cộng 1 không đổi gì."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Song song hoá phép cộng rồi ngạc nhiên vì kết quả lệch ở chữ số cuối <b class="red">(hiểu sai)</b>
          <br><span class="note">Chia mảng cho nhiều luồng đổi thứ tự cộng, nên kết quả có thể khác ở vài chữ số cuối — không phải lỗi luồng.</span></div>
        say: "Lỗi thứ ba, song song hoá một phép cộng lớn rồi ngạc nhiên vì kết quả lệch ở chữ số cuối. Chia mảng cho nhiều luồng làm đổi thứ tự cộng, nên kết quả có thể khác ở vài chữ số cuối, đó không phải lỗi luồng."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Dùng số thực 32 bit cho phép cộng tích lũy dài <b class="red">(rủi ro)</b>
          <br><span class="note">Với $\varepsilon \approx 10^{-7}$, cộng triệu số nhỏ vào một tổng đã lớn sẽ mất dần các số hạng; dùng 64 bit hoặc cộng bù sai số.</span></div>
        say: "Lỗi thứ tư, dùng số thực 32 bit cho một phép cộng tích lũy rất dài. Với epsilon khoảng 10 mũ âm 7, cộng hàng triệu số nhỏ vào một tổng đã lớn sẽ làm mất dần các số hạng, nên hãy dùng 64 bit hoặc phép cộng có bù sai số."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "1.0 + 1e-17 == 1.0 and 1.0 + 1e-15 != 1.0"
      - "abs(((1 + 1e-10) ** 2 - 1) / 1e-10 - 2) > 1e-7 and abs((2 + 1e-10) - 2) < 1e-9"
      - "str(((1 + 1e-10) ** 2 - 1) / 1e-10).startswith('2.000000165') and 2 + 1e-10 == 2.0000000001 and 2 ** -53 < 1e-15"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Với số thực 64 bit, $1 + 10^{-17}$ có khác 1 không? Còn $1 + 10^{-15}$?</td></tr>
          <tr><td>2</td><td>Tính $\frac{(1 + h)^2 - 1}{h}$ với $h = 10^{-10}$ thì nên viết lại thế nào cho chính xác?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với số thực 64 bit, 1 cộng 10 mũ âm 17 có khác 1 không, còn 1 cộng 10 mũ âm 15 thì sao? Câu hai, tính 1 cộng h, bình phương, trừ 1, chia h, với h bằng 10 mũ âm 10, thì nên viết lại thế nào cho chính xác? Dừng video và làm ra giấy."
        pause: 10
      - show: |
          <table class="t"><tr><th>số cộng vào 1</th><th>so với $\frac{\varepsilon}{2} \approx 1{,}11 \times 10^{-16}$</th><th>kết quả</th></tr>
          <tr><td>$10^{-17}$</td><td>nhỏ hơn</td><td>$1 + 10^{-17} = \hl{1}$</td></tr>
          <tr><td>$10^{-15}$</td><td>lớn hơn, lớn hơn cả $\varepsilon$</td><td>$\hl{\text{khác } 1}$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Đáp án câu một, ta so mỗi số với một nửa epsilon, khoảng 1 phẩy 11 nhân 10 mũ âm 16. Mười mũ âm 17 nhỏ hơn một nửa epsilon nên bị làm tròn mất, 1 cộng nó vẫn bằng 1. Còn 10 mũ âm 15 lớn hơn epsilon nên kết quả khác 1."
      - clear: true
        show: |
          <p>② Khai triển: $(1 + h)^2 - 1 = 2h + h^2$, nên biểu thức $= 2 + h$ — không còn phép trừ hai số gần nhau.</p>
          <table class="t"><tr><th>cách tính, $h = 10^{-10}$</th><th>máy cho</th></tr>
          <tr><td>thẳng: $\frac{(1 + h)^2 - 1}{h}$</td><td>2,000000165… (sai từ chữ số thứ 7)</td></tr>
          <tr><td>viết lại: $2 + h$</td><td>$\hl{2{,}0000000001}$</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Câu hai, khai triển 1 cộng h bình phương trừ 1 thành 2h cộng h bình phương. Chia cho h được 2 cộng h, không còn phép trừ hai số gần nhau. Tính thẳng, máy cho 2 phẩy 000000165, sai từ chữ số thứ bảy sau dấu phẩy. Viết lại thì máy cho đúng 2 phẩy 0000000001."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mỗi phép tính làm tròn, sai tối đa $\frac{\varepsilon}{2}$</span><span class="a">→</span>
          <span class="n">thứ tự cộng làm đổi kết quả</span><span class="a">→</span>
          <span class="n">trừ hai số gần nhau: triệt tiêu</span><span class="a">→</span>
          <span class="n">biến đổi đại số để tránh</span></div>
        say: "Tổng kết lại, mỗi phép tính số thực làm tròn với sai số tương đối tối đa một nửa epsilon. Thứ tự phép cộng làm đổi kết quả. Trừ hai số gần nhau gây triệt tiêu, mất chữ số có nghĩa. Cách chữa là biến đổi đại số để tránh phép trừ đó."
      - show: |
          <div class="box key"><b>Tư duy:</b> công thức đúng trên giấy chưa chắc đúng trên máy — luôn hỏi “phép tính này có mất chữ số không?”.</div>
        say: "Điều cần mang theo, một công thức đúng trên giấy chưa chắc đúng trên máy, hãy luôn hỏi phép tính này có làm mất chữ số không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>mạch lôgic và đại số Boole</b> — từ bảng chân trị tới mạch cộng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta chuyển xuống phần cứng, với mạch lô-gích, từ bảng chân trị tới mạch cộng hai số. Hẹn gặp bạn ở bài tiếp theo."
