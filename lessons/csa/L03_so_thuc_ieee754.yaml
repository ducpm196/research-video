id: L03
course: CSA
series: "CSA · Hệ thống máy tính"
title: "Bài 3 — Số thực dấu phẩy động IEEE 754"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/csa.yaml L03; audit/verify_plan_curricula.py CSA:L03; chuẩn IEEE 754 (định dạng nhị phân 32 và 64 bit); R. Bryant, D. O'Hallaron, CS:APP mục 2.4"
assumes: [arith, power, sub, sub2, dots]
# Quy ước: tên chuẩn “IEEE 754” chỉ hiện trên màn hình; lời đọc nói “chuẩn số thực dấu phẩy động”. float32 = 32 bit: 1 bit dấu,
#   8 bit mũ (độ lệch 127), 23 bit phần định trị. Dấu nhân: × (cả bài). Phần thập phân viết dấu phẩy (0,1) trong chữ; trong mã dùng dấu chấm.
objectives:
  - "Đọc ba trường dấu, mũ, phần định trị của một số float32"
  - "Giải thích vì sao 0,1 không biểu diễn chính xác"
  - "So sánh hai số thực đúng cách"
asr_reviewed:
  - {sentence: "Từ đó dãy chữ số 0 0 1 1 lặp lại mãi, phần lẻ không bao giờ về đúng 0.", reason: "ASR chép “Từ đó dạy chữ số 0011 lặp lại mãi, phần lẽ không bao giờ về đúng không.” (0.789): lệch âm/thanh thuần Việt: dãy/dạy, không không một/mười, linh/lẽ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Giải mã dãy bit 3 E 2 0 0 0 0 0 hệ mười sáu.", reason: "đọc tách từng ký tự (E36); ASR chép “3-E-2000-0016”: đủ 3, E, 2 và năm chữ số 0, rồi “16” (hệ mười sáu) — dãy ký tự khớp (audit/asr_digits.py lệch chỉ vì công cụ đổi “sáu” thành 6 mà không ghép “mười sáu”); dải/giải, dậy/dãy là nhầm gi/d của ASR"}
  - {sentence: "Câu một, giải mã dãy bit C 0 2 0 0 0 0 0 hệ mười sáu, gợi ý C 0 là 1 1 0 0, 0 0 0 0.", reason: "ASR chép “C0200000”, “C0” đúng từng ký tự; nhóm “1 1 0 0, 0 0 0 0” chép “1100000” (thiếu một chữ số 0 khi tám chữ số liền) — cùng loại lệch của ASR với dãy “không” lặp ở L04 — NOT_VERIFIED bằng tai người"}
  - {sentence: "Một, giải mã xong thì mã hoá ngược lại phải ra đúng dãy bit ban đầu, máy kiểm được bằng cách đóng gói số thành 4 byte.", reason: "“byte” đọc thô /bai/ — probe audit/csa/probes/p1_thuat_ngu.md: ASR chép “bay” 8/8 (cùng âm), đối chứng 0/8; lexicon foreign_ok; “bit” ASR chép “bích/biết” (probe p1 CSA: không cách viết nào phân định âm cuối t/ch) — NOT_VERIFIED bằng tai người; “byte” → “bay” cùng âm"}
  - {sentence: "Giá trị bằng âm 1 mũ s nhân 1 phẩy f nhân 2 mũ e trừ 127.", reason: "tên chữ cái đọc kiểu Việt, ASR chép nhầm chữ (q→quy, x→ích, k→ca) — nhóm đã biết (SKILL Bước 5); chữ hiện trên màn hình"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "0,1 + 0,2 có bằng 0,3?"
    checks:
      - "0.1 + 0.2 != 0.3 and repr(0.1 + 0.2) == '0.30000000000000004'"
    steps:
      - show: |
          <div class="code"><div>&gt;&gt;&gt; 0.1 + 0.2</div><div>0.30000000000000004</div><div>&gt;&gt;&gt; 0.1 + 0.2 == 0.3</div><div>False</div></div>
          <p>Máy tính không “tính sai”. Nó tính <b>đúng</b> trên những số khác với số bạn nghĩ.</p>
        focus: ["1.2", "1.4", 2]
        say: "Chào bạn, gõ 0 phẩy 1 cộng 0 phẩy 2 vào máy, ta được 0 phẩy 3 kèm một đuôi rất nhỏ ở chữ số thứ mười bảy. Vì thế phép so sánh với 0 phẩy 3 cho kết quả sai. Máy tính không tính sai, nó tính đúng trên những con số khác với con số bạn nghĩ."
      - show: |
          <div class="box key">Hôm nay: máy lưu số thực thế nào (dấu, mũ, phần định trị), vì sao 0,1 không lưu chính xác được, và cách so sánh số thực.</div>
        say: "Hôm nay ta học cách máy lưu số thực gồm dấu, mũ và phần định trị, vì sao 0 phẩy 1 không lưu chính xác được, và cách so sánh số thực cho đúng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chữ số sau dấu phẩy trong hệ 2, và dạng khoa học"
    checks:
      - "1530 == 1.53 * 10 ** 3 and 2 ** -3 == 1 / 8 == 0.125"
      - "[1 / 2, 1 / 4, 1 / 8] == [0.5, 0.25, 0.125] and 1 / 2 + 1 / 8 == 0.625"
      - "0.625 * 2 == 1.25 and 0.25 * 2 == 0.5 and 0.5 * 2 == 1.0"
    steps:
      - show: |
          <p>Dạng khoa học hệ 10: $1530 = 1{,}53 \times 10^3$ — một chữ số trước dấu phẩy, phần còn lại do số mũ lo.</p>
          <p>Mũ âm là chia: $2^{-3} = \frac{1}{2^3} = \frac{1}{8} = 0{,}125$.</p>
        focus: [1, 1, 2]
        say: "Trước hết, ôn dạng khoa học trong hệ mười. Số 1530 viết được là 1 phẩy 53 nhân 10 mũ 3, chỉ một chữ số trước dấu phẩy, phần còn lại do số mũ lo. Mũ âm nghĩa là chia, 2 mũ âm 3 bằng 1 chia 2 mũ 3, tức 1 phần 8, bằng 0 phẩy 125."
      - show: |
          <table class="t"><tr><th>vị trí sau dấu phẩy, hệ 2</th><th>thứ nhất</th><th>thứ hai</th><th>thứ ba</th></tr>
          <tr><td>giá trị</td><td>$\frac{1}{2} = 0{,}5$</td><td>$\frac{1}{4} = 0{,}25$</td><td>$\frac{1}{8} = 0{,}125$</td></tr></table>
          <p>$0{,}101_2 = \frac{1}{2} + \frac{1}{8} = 0{,}625$.</p>
        focus: [1, 2]
        say: "Trong hệ hai, các chữ số sau dấu phẩy mang giá trị một phần 2, một phần 4, một phần 8, mỗi vị trí bằng nửa vị trí trước. Vì vậy 0 phẩy 1 0 1 hệ hai bằng một phần 2 cộng một phần 8, tức 0 phẩy 625."
      - show: |
          <table class="t"><tr><th>nhân đôi phần lẻ</th><th>kết quả</th><th>chữ số lấy ra</th></tr>
          <tr><td>$0{,}625 \times 2$</td><td>1,25</td><td>1</td></tr>
          <tr><td>$0{,}25 \times 2$</td><td>0,5</td><td>0</td></tr>
          <tr><td>$0{,}5 \times 2$</td><td>1,0</td><td>1 — hết</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Muốn đổi ngược một phân số sang hệ hai, ta nhân đôi phần lẻ, phần nguyên nhảy ra chính là chữ số tiếp theo. Không phẩy 625 nhân 2 được 1 phẩy 25, lấy ra chữ số 1. Phần lẻ 0 phẩy 25 nhân 2 được 0 phẩy 5, lấy ra 0. Không phẩy 5 nhân 2 được đúng 1, lấy ra 1, phần lẻ hết, nên ta được 0 phẩy 1 0 1."

  - id: sym
    kind: symbol
    title: "Giải mã: ba trường của một số float32"
    checks:
      - "1 + 8 + 23 == 32"
    steps:
      - show: |
          <table class="t"><tr><th>trường</th><th>số bit</th><th>ý nghĩa</th></tr>
          <tr><td>dấu $s$</td><td>1</td><td>0 dương, 1 âm</td></tr>
          <tr><td>mũ $e$</td><td>8</td><td>số mũ cộng thêm độ lệch 127</td></tr>
          <tr><td>phần định trị $f$</td><td>23</td><td>các chữ số nhị phân sau dấu phẩy</td></tr></table>
          <div class="box key">Giá trị $= (-1)^s \times 1{,}f_2 \times 2^{\,e - 127}$ &nbsp; (với $e$ không phải 0 hay 255)</div>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Một số thực 32 bit chia thành ba trường. Một bit dấu, 0 là dương, 1 là âm. Tám bit mũ, lưu số mũ cộng thêm một độ lệch bằng 127, để mũ âm cũng lưu được bằng số không âm. Hai mươi ba bit phần định trị, là các chữ số nhị phân sau dấu phẩy. Giá trị bằng âm 1 mũ s, nhân 1 phẩy f hệ hai, nhân 2 mũ e trừ 127."

  # ───────────────────────── 3. VÍ DỤ: GIẢI MÃ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "32 ô, ba vùng màu"
    checks:
      - "format(0x3E200000, '032b') == '0' + '01111100' + '01' + '0' * 21"
    steps:
      - show: |
          <div><svg width="1500" height="360" viewBox="0 0 1500 360"><rect x="100" y="40" width="36" height="60" rx="5" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="118" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="140" y="40" width="36" height="60" rx="5" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="158" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="180" y="40" width="36" height="60" rx="5" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="198" y="82" font-size="28" text-anchor="middle" fill="#1f2937">1</text><rect x="220" y="40" width="36" height="60" rx="5" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="238" y="82" font-size="28" text-anchor="middle" fill="#1f2937">1</text><rect x="260" y="40" width="36" height="60" rx="5" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="278" y="82" font-size="28" text-anchor="middle" fill="#1f2937">1</text><rect x="300" y="40" width="36" height="60" rx="5" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="318" y="82" font-size="28" text-anchor="middle" fill="#1f2937">1</text><rect x="340" y="40" width="36" height="60" rx="5" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="358" y="82" font-size="28" text-anchor="middle" fill="#1f2937">1</text><rect x="380" y="40" width="36" height="60" rx="5" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="398" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="420" y="40" width="36" height="60" rx="5" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="438" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="460" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="478" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="500" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="518" y="82" font-size="28" text-anchor="middle" fill="#1f2937">1</text><rect x="540" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="558" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="580" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="598" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="620" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="638" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="660" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="678" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="700" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="718" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="740" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="758" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="780" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="798" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="820" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="838" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="860" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="878" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="900" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="918" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="940" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="958" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="980" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="998" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="1020" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1038" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="1060" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1078" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="1100" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1118" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="1140" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1158" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="1180" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1198" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="1220" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1238" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="1260" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1278" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="1300" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1318" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><rect x="1340" y="40" width="36" height="60" rx="5" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="1358" y="82" font-size="28" text-anchor="middle" fill="#1f2937">0</text><g fill="none" stroke-width="3"><path d="M100,115 L100,130 L136,130 L136,115" stroke="#b91c1c"/><path d="M140,115 L140,130 L456,130 L456,115" stroke="#2a78d6"/><path d="M460,115 L460,130 L1376,130 L1376,115" stroke="#15803d"/></g><g font-size="26" fill="#1f2937"><text x="60" y="180" fill="#b91c1c">dấu: 0</text><text x="60" y="215" fill="#b91c1c">dương</text><text x="300" y="180" text-anchor="middle" fill="#2a78d6">mũ: 01111100 = 124</text><text x="300" y="215" text-anchor="middle" fill="#2a78d6">124 - 127 = -3</text><text x="918" y="180" text-anchor="middle" fill="#15803d">phần định trị: 01 rồi toàn 0</text><text x="918" y="215" text-anchor="middle" fill="#15803d">1 ghép trước: 1,01 hệ 2 = 1,25</text></g><text x="750" y="300" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">giá trị = + 1,25 × 2 mũ -3 = 0,15625</text></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ 32 bit của một số thực, chia thành ba vùng màu. Ô đỏ đầu tiên là dấu, bằng 0 nên số dương. Tám ô xanh dương là mũ, đọc như số nguyên được 124, trừ độ lệch 127 còn âm 3. Hai mươi ba ô xanh lá là phần định trị, máy tự ghép thêm số 1 phía trước, được 1 phẩy 0 1 hệ hai, bằng 1 phẩy 25. Ba vùng hợp lại cho giá trị 0 phẩy 15625."

  - id: example
    kind: example
    title: "Giải mã 0x3E200000 và mã hoá 1,0"
    checks:
      - "__import__('struct').unpack('>I', __import__('struct').pack('>f', 0.15625))[0] == 0x3E200000"
      - "(0x3E200000 >> 23) & 0xFF == 124 and 0x3E200000 & 0x7FFFFF == 2 ** 21 and (1 + 0.25) * 2 ** (124 - 127) == 0.15625"
      - "__import__('struct').unpack('>I', __import__('struct').pack('>f', 1.0))[0] == 0x3F800000 and 0x3F800000 >> 23 == 127"
    steps:
      - show: |
          <p>$\texttt{0x3E200000} = 0\;\;01111100\;\;01000000000000000000000$</p>
          <p><b>Bước 1.</b> Dấu $s = 0$: dương.</p>
        focus: [1, 1, 2]
        say: "Giải mã dãy bit 3 E 2 0 0 0 0 0 hệ mười sáu. Ta đổi mỗi chữ số hệ mười sáu thành 4 bit rồi cắt thành ba trường như hình. Bước một, bit dấu bằng 0 nên số dương."
      - show: |
          <p><b>Bước 2.</b> Mũ $e = 01111100_2 = 64 + 32 + 16 + 8 + 4 = 124$ → $124 - 127 = -3$.</p>
        say: "Bước hai, 8 bit mũ là 0 1 1 1, 1 1 0 0, cộng các giá trị 64, 32, 16, 8 và 4 được 124. Vì mũ được lưu cộng thêm độ lệch, ta trừ 127 và được âm 3."
      - show: |
          <p><b>Bước 3.</b> Phần định trị $f = 01_2$ (còn lại toàn 0) → $1{,}01_2 = 1 + \frac{1}{4} = 1{,}25$.</p>
        say: "Bước ba, phần định trị bắt đầu bằng 0 1, nên 1 phẩy 0 1 hệ hai bằng 1 cộng một phần tư, bằng 1 phẩy 25."
      - show: |
          <p><b>Bước 4.</b> Giá trị:</p>
          $$1{,}25 \times 2^{-3} = \frac{1{,}25}{8} = \hl{0{,}15625}\ ✓$$
        focus: [1, 2]
        say: "Bước bốn, giá trị là 1 phẩy 25 nhân 2 mũ âm 3, tức 1 phẩy 25 chia 8. Kết quả bằng 0 phẩy 15625, máy kiểm đúng."
      - show: |
          <p><b>Bước 5.</b> Ngược lại, $1{,}0 = 1{,}0_2 \times 2^0$: dấu 0, mũ $0 + 127 = 127 = 01111111_2$, phần định trị toàn 0 → $\texttt{0x3F800000}$.</p>
        say: "Bước năm, làm ngược lại với số 1 phẩy 0, ta có 1 nhân 2 mũ 0. Bit dấu 0, mũ là 0 cộng 127 bằng 127, phần định trị toàn 0, ghép lại được 3 F 8 0 0 0 0 0 hệ mười sáu."

  - id: verify2
    kind: check
    title: "Tự kiểm: đổi 0,15625 sang hệ 2 bằng cách nhân đôi"
    checks:
      - "[0.15625 * 2, 0.3125 * 2, 0.625 * 2, 0.25 * 2, 0.5 * 2] == [0.3125, 0.625, 1.25, 0.5, 1.0]"
      - "1 / 8 + 1 / 32 == 0.15625 and 1.25 * 2 ** -3 == 0.15625"
    steps:
      - show: |
          <table class="t"><tr><th>nhân đôi phần lẻ</th><th>kết quả</th><th>chữ số</th></tr>
          <tr><td>$0{,}15625 \times 2$</td><td>0,3125</td><td>0</td></tr>
          <tr><td>$0{,}3125 \times 2$</td><td>0,625</td><td>0</td></tr>
          <tr><td>$0{,}625 \times 2$</td><td>1,25</td><td>1</td></tr>
          <tr><td>$0{,}25 \times 2$</td><td>0,5</td><td>0</td></tr>
          <tr><td>$0{,}5 \times 2$</td><td>1,0</td><td>1 — hết</td></tr></table>
        focus: [0, ["1.2", "1.3"], "1.4", ["1.5", "1.6"]]
        say: "Kiểm bằng đường khác, ta đi từ số 0 phẩy 15625 sang hệ hai bằng cách nhân đôi phần lẻ, không cần đọc dãy bit. Hai lần nhân đầu được 0 phẩy 3125 rồi 0 phẩy 625, chưa tới 1 nên lấy ra hai chữ số 0. Lần thứ ba được 1 phẩy 25, lấy ra 1. Hai lần cuối lấy ra 0 rồi 1, phần lẻ hết."
      - show: |
          $$0{,}15625 = 0{,}00101_2 = 1{,}01_2 \times 2^{-3}$$
          <p>Dời dấu phẩy sang phải 3 chỗ → mũ $-3$, phần định trị $01$: khớp đúng ba trường đã giải mã ✓</p>
        focus: [1, 2, 2]
        say: "Vậy 0 phẩy 15625 bằng 0 phẩy 0 0 1 0 1 hệ hai. Dời dấu phẩy sang phải 3 chỗ để có một chữ số 1 đứng trước, nên phải nhân với 2 mũ âm 3 để giữ nguyên giá trị. Ta được 1 phẩy 0 1 nhân 2 mũ âm 3, khớp mũ và phần định trị khi giải mã."

  - id: why
    kind: concept
    title: "Vì sao 0,1 không lưu chính xác được"
    checks:
      - "__import__('struct').unpack('>f', __import__('struct').pack('>f', 0.1))[0] == 0.10000000149011612"
      - "__import__('fractions').Fraction(0.1) != __import__('fractions').Fraction(1, 10)"
      - "round((__import__('struct').unpack('>f', __import__('struct').pack('>f', 0.1))[0] - 0.1) * 1e9, 2) == 1.49"
      - "[round(x % 1, 10) for x in (0.2, 0.4, 0.8, 1.6, 1.2)] == [0.2, 0.4, 0.8, 0.6, 0.2]"
    steps:
      - show: |
          <p>Trong hệ 10, $\frac{1}{3} = 0{,}333\dots$ không bao giờ hết. Trong hệ 2, $\frac{1}{10} = 0{,}0001100110011\dots_2$ cũng lặp mãi.</p>
          <p>Chỉ giữ được 23 (hoặc 52) bit, nên máy lưu số <b>gần nhất</b>: float32 của 0,1 là $0{,}10000000149011612\dots$</p>
          <div class="box warn">Chỉ các phân số có mẫu là lũy thừa của 2 (như $\frac{1}{2}, \frac{3}{8}, 0{,}15625$) mới lưu chính xác.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Trong hệ mười, một phần ba bằng 0 phẩy 333 và không bao giờ hết. Trong hệ hai, một phần mười cũng là một số lặp mãi. Máy chỉ giữ được 23 bit, hoặc 52 bit với số 64 bit, nên nó lưu con số gần nhất. Với số 32 bit, 0 phẩy 1 thật ra được lưu là 0 phẩy 1 kèm một đuôi khoảng 1 phẩy 5 phần tỉ. Chỉ những phân số có mẫu là lũy thừa của 2 mới lưu chính xác."
      - show: |
          <table class="t"><tr><th>nhân đôi phần lẻ của 0,1</th><th>0,2</th><th>0,4</th><th>0,8</th><th>1,6</th><th>1,2</th><th>0,4</th><th>…</th></tr>
          <tr><td>chữ số</td><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>…</td></tr></table>
          <p>Phần lẻ quay lại 0,2 → dãy $0011$ lặp mãi, không bao giờ ra đúng 1.</p>
        focus: [1, 1, 2]
        say: "Dùng phép nhân đôi phần lẻ, ta thấy tận mắt vì sao 0 phẩy 1 lặp mãi. Nhân đôi lần lượt được 0 phẩy 2, 0 phẩy 4, 0 phẩy 8, rồi 1 phẩy 6 và 1 phẩy 2, phần lẻ quay lại 0 phẩy 2. Từ đó dãy chữ số 0 0 1 1 lặp lại mãi, phần lẻ không bao giờ về đúng 0."

  # ───────────────────────── 5. SO SÁNH SỐ THỰC ─────────────────────────
  - id: compare
    kind: concept
    title: "So sánh số thực đúng cách"
    checks:
      - "abs((0.1 + 0.2) - 0.3) <= 1e-9 * max(abs(0.1 + 0.2), abs(0.3)) and __import__('math').isclose(0.1 + 0.2, 0.3)"
    steps:
      - show: |
          <div class="code"><div>abs(a - b) &lt;= 1e-9 * max(abs(a), abs(b))   # sai số tương đối</div>
          <div>math.isclose(0.1 + 0.2, 0.3)               # True</div></div>
          <p>Dùng sai số <b>tương đối</b>: một ngưỡng cố định như $10^{-9}$ quá chặt với số cỡ $10^{20}$ và quá lỏng với số cỡ $10^{-20}$.</p>
        focus: ["1.1", "1.2", 2]
        say: "Muốn so sánh hai số thực, ta kiểm hiệu của chúng có nhỏ so với độ lớn của chính chúng không, gọi là sai số tương đối. Nhiều ngôn ngữ có sẵn hàm làm việc này, và 0 phẩy 1 cộng 0 phẩy 2 khi đó được coi là bằng 0 phẩy 3. Không nên dùng một ngưỡng cố định, vì nó quá chặt với số rất lớn và quá lỏng với số rất nhỏ."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: verify
    kind: check
    title: "Tự kiểm: ba phép thử nhanh"
    checks:
      - "2 ** -126 == 1.1754943508222875e-38 and (2 - 2 ** -23) * 2 ** 127 == 3.4028234663852886e+38"
      # Điều kiện “đủ 24 bit”: IEEE 754-2019 §3.3, binary32 có p = 24; 2^24 − 1 (24 chữ số) lưu đúng, 2^24 + 1 (25 chữ số) thì không — khớp lỗi 3.
      - "__import__('struct').unpack('>f', __import__('struct').pack('>f', 2 ** 24 - 1))[0] == 2 ** 24 - 1 and __import__('struct').unpack('>f', __import__('struct').pack('>f', 2 ** 24 + 1))[0] != 2 ** 24 + 1"
    steps:
      - show: |
          <table class="t"><tr><th>phép thử</th></tr>
          <tr><td>Giải mã xong, mã hoá ngược lại phải ra đúng dãy bit — máy có thể kiểm bằng cách đóng gói số thành 4 byte.</td></tr>
          <tr><td>Khoảng của float32 (số chuẩn hoá): từ khoảng $1{,}18 \times 10^{-38}$ đến khoảng $3{,}4 \times 10^{38}$.</td></tr>
          <tr><td>Số có mẫu là lũy thừa của 2, viết hệ 2 <b>không quá 24</b> chữ số có nghĩa, phải giải mã ra <b>đúng</b>, không có đuôi lẻ.</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, giải mã xong thì mã hoá ngược lại phải ra đúng dãy bit ban đầu, máy kiểm được bằng cách đóng gói số thành 4 byte. Hai, nhớ khoảng của số 32 bit, nhỏ nhất cỡ 10 mũ âm 38, lớn nhất cỡ 3 phẩy 4 nhân 10 mũ 38. Ba, số có mẫu là lũy thừa của 2 và viết hệ hai không quá 24 chữ số có nghĩa phải giải mã ra đúng, không có đuôi lẻ. Lý do là nó chỉ có hữu hạn chữ số, và vừa đủ chỗ trong 24 bit độ chính xác."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "float(2 ** 24 + 1) == float(2 ** 24) or __import__('struct').unpack('>f', __import__('struct').pack('>f', 2 ** 24 + 1))[0] == 2 ** 24"
      - "__import__('functools').reduce(lambda a, b: a + b, [0.1] * 10) == 0.9999999999999999"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> So sánh số thực bằng <code>==</code> <b class="red">(sai)</b>
          <br><span class="note">Cộng lần lượt 0,1 mười lần trong vòng lặp ra $0{,}9999999999999999$, không phải 1,0. Dùng sai số tương đối.</span></div>
        say: "Lỗi thứ nhất, so sánh hai số thực bằng dấu bằng. Cộng lần lượt 0 phẩy 1 mười lần trong một vòng lặp ra 0 phẩy chín chín chín, không phải đúng 1, nên phải dùng sai số tương đối."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng số thực cho tiền <b class="red">(sai)</b>
          <br><span class="note">Tiền phải chính xác đến đồng: lưu bằng số nguyên (đơn vị nhỏ nhất) hoặc kiểu thập phân.</span></div>
        say: "Lỗi thứ hai, dùng số thực dấu phẩy động để lưu tiền. Tiền phải chính xác đến từng đồng, nên lưu bằng số nguyên theo đơn vị nhỏ nhất, hoặc dùng kiểu số thập phân."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ float32 lưu chính xác mọi số nguyên <b class="red">(sai)</b>
          <br><span class="note">Chỉ có 24 bit độ chính xác:</span>
          $$2^{24} + 1 = 16\,777\,217 \to 16\,777\,216$$</div>
        say: "Lỗi thứ ba, nghĩ số thực 32 bit lưu chính xác mọi số nguyên. Nó chỉ có 24 bit độ chính xác, nên 2 mũ 24 cộng 1 bị lưu thành 2 mũ 24."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Nghĩ thêm chữ số thập phân khi in là thêm độ chính xác <b class="red">(sai)</b>
          <br><span class="note">In 20 chữ số của một float32 chỉ hiện đuôi sai số; số chữ số đáng tin của float32 chỉ khoảng 7.</span></div>
        say: "Lỗi thứ tư, nghĩ in thêm chữ số là có thêm độ chính xác. In 20 chữ số của một số 32 bit chỉ làm lộ đuôi sai số, vì số chữ số đáng tin chỉ khoảng 7."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "__import__('struct').unpack('>I', __import__('struct').pack('>f', -2.5))[0] == 0xC0200000"
      - "(0xC0200000 >> 31, (0xC0200000 >> 23) & 0xFF) == (1, 128) and -(1 + 0.25) * 2 ** (128 - 127) == -2.5"
      - "format(0xC0200000, '032b') == '1' + '10000000' + '01' + '0' * 21 and 0.75 * 2 == 1.5 and 0.5 * 2 == 1.0 and 3 / 4 == 0.75"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Giải mã $\texttt{0xC0200000}$ (gợi ý: $\texttt{C0} = 11000000_2$).</td></tr>
          <tr><td>2</td><td>Số 0,75 có lưu chính xác trong float32 không? Vì sao?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, giải mã dãy bit C 0 2 0 0 0 0 0 hệ mười sáu, gợi ý C 0 là 1 1 0 0, 0 0 0 0. Câu hai, số 0 phẩy 75 có lưu chính xác được không, vì sao? Dừng video và làm ra giấy."
        pause: 10
      - show: |
          <p>$\texttt{0xC0200000} = 1\;\;10000000\;\;01000000000000000000000$</p>
          <table class="t"><tr><th>trường</th><th>bit</th><th>nghĩa</th></tr>
          <tr><td>dấu</td><td>1</td><td>âm</td></tr>
          <tr><td>mũ</td><td>10000000 = 128</td><td>$128 - 127 = 1$</td></tr>
          <tr><td>phần định trị</td><td>01, còn lại 0</td><td>$1{,}01_2 = 1{,}25$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Đáp án câu một, đổi C 0 2 0 thành bit rồi cắt ba trường như ví dụ. Bit dấu bằng 1 nên số âm. Tám bit mũ là 1 rồi bảy số 0, bằng 128, trừ 127 còn 1. Phần định trị bắt đầu bằng 0 1, nên 1 phẩy 0 1 hệ hai bằng 1 phẩy 25."
      - show: |
          $$-1{,}25 \times 2^{1} = \hl{-2{,}5}$$
        say: "Ghép lại, giá trị bằng âm 1 phẩy 25 nhân 2 mũ 1, tức âm 1 phẩy 25 nhân 2, bằng âm 2 phẩy 5."
      - clear: true
        show: |
          <table class="t"><tr><th>nhân đôi phần lẻ</th><th>kết quả</th><th>chữ số</th></tr>
          <tr><td>$0{,}75 \times 2$</td><td>1,5</td><td>1</td></tr>
          <tr><td>$0{,}5 \times 2$</td><td>1,0</td><td>1 — hết</td></tr></table>
          <p>② Có: $0{,}75 = \frac{3}{4} = 0{,}11_2$, mẫu là lũy thừa của 2.</p>
        focus: [0, ["1.2", "1.3"], 2]
        say: "Câu hai, ta nhân đôi phần lẻ như phần chuẩn bị. Không phẩy 75 nhân 2 được 1 phẩy 5, lấy ra 1, rồi 0 phẩy 5 nhân 2 được đúng 1, lấy ra 1 và phần lẻ hết. Vậy câu trả lời là có, vì 0 phẩy 75 bằng ba phần tư, viết hệ hai là 0 phẩy 1 1, mẫu là lũy thừa của 2."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">dấu, mũ (lệch 127), phần định trị</span><span class="a">→</span>
          <span class="n">$(-1)^s \times 1{,}f \times 2^{e - 127}$</span><span class="a">→</span>
          <span class="n">0,1 lặp mãi trong hệ 2</span><span class="a">→</span>
          <span class="n">so sánh bằng sai số tương đối</span></div>
        say: "Tổng kết lại, số thực 32 bit gồm dấu, mũ có độ lệch 127, và phần định trị. Giá trị bằng âm 1 mũ s nhân 1 phẩy f nhân 2 mũ e trừ 127. Số 0 phẩy 1 lặp mãi trong hệ hai nên chỉ được lưu gần đúng. Vì vậy phải so sánh số thực bằng sai số tương đối."
      - show: |
          <div class="box key"><b>Tư duy:</b> số thực trong máy là một tập hữu hạn các điểm trên trục số — mỗi phép tính đều làm tròn về điểm gần nhất.</div>
        say: "Điều cần mang theo, số thực trong máy chỉ là một tập hữu hạn các điểm trên trục số, và mỗi phép tính đều làm tròn về điểm gần nhất."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>sai số làm tròn, epsilon máy và triệt tiêu</b> — sai số tích lũy thế nào qua nhiều phép tính.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học sai số làm tròn, epsilon máy, và hiện tượng triệt tiêu khi trừ hai số gần nhau. Hẹn gặp bạn ở bài tiếp theo."
