      học cơ số hai giữ số một ẩn đầu tiên nhằm tiết kiệm thêm trọn một bit độ chính xác.
- id: example
  kind: example
  title: Giải mã 0x3E200000 và mã hoá 1,0
  checks:
  - __import__('struct').unpack('>I', __import__('struct').pack('>f', 0.15625))[0] == 0x3E200000
  - (0x3E200000 >> 23) & 0xFF == 124 and 0x3E200000 & 0x7FFFFF == 2 ** 21 and (1 + 0.25) * 2 ** (124 - 127) == 0.15625
  - __import__('struct').unpack('>I', __import__('struct').pack('>f', 1.0))[0] == 0x3F800000 and 0x3F800000 >> 23 == 127
  steps:
  - show: '<p>$\texttt{0x3E200000} = 0\;\;01111100\;\;01000000000000000000000$</p>

      <p><b>Bước 1.</b> Dấu $s = 0$: dương.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Giải mã dãy bit 3 E 2 0 0 0 0 0 hệ mười sáu. Ta đổi mỗi chữ số hệ mười sáu thành 4 bit rồi cắt thành ba trường như
      hình. Bước một, bit dấu bằng 0 nên số dương.
  - show: '<p><b>Bước 2.</b> Mũ $e = 01111100_2 = 64 + 32 + 16 + 8 + 4 = 124$ → $124 - 127 = -3$.</p>

      '
    say: Bước hai, 8 bit mũ là 0 1 1 1, 1 1 0 0, cộng các giá trị 64, 32, 16, 8 và 4 được 124. Vì mũ được lưu cộng thêm độ
      lệch, ta trừ 127 và được âm 3.
  - show: '<p><b>Bước 3.</b> Phần định trị $f = 01_2$ (còn lại toàn 0) → $1{,}01_2 = 1 + \frac{1}{4} = 1{,}25$.</p>

      '
    say: Bước ba, phần định trị bắt đầu bằng 0 1, nên 1 phẩy 0 1 hệ hai bằng 1 cộng một phần tư, bằng 1 phẩy 25.
  - show: '<p><b>Bước 4.</b> Giá trị:</p>

      $$1{,}25 \times 2^{-3} = \frac{1{,}25}{8} = \hl{0{,}15625}\ ✓$$

      '
    focus:
    - 1
    - 2
    say: Bước bốn, giá trị là 1 phẩy 25 nhân 2 mũ âm 3, tức 1 phẩy 25 chia 8. Kết quả bằng 0 phẩy 15625, máy kiểm đúng.
  - show: '<p><b>Bước 5.</b> Ngược lại, $1{,}0 = 1{,}0_2 \times 2^0$: dấu 0, mũ $0 + 127 = 127 = 01111111_2$, phần định trị
      toàn 0 → $\texttt{0x3F800000}$.</p>

      '
    say: Bước năm, làm ngược lại với số 1 phẩy 0, ta có 1 nhân 2 mũ 0. Bit dấu 0, mũ là 0 cộng 127 bằng 127, phần định trị
      toàn 0, ghép lại được 3 F 8 0 0 0 0 0 hệ mười sáu.
