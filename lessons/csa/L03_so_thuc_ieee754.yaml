id: L03
course: CSA
series: CSA · Hệ thống máy tính
title: Bài 3 — Số thực dấu phẩy động IEEE 754
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/csa.yaml L03; audit/verify_plan_curricula.py CSA:L03; chuẩn IEEE 754 (định dạng nhị phân 32 và 64 bit);
  R. Bryant, D. O'Hallaron, CS:APP mục 2.4
assumes:
- arith
- power
- sub
- sub2
- dots
objectives:
- Đọc ba trường dấu, mũ, phần định trị của một số float32
- Giải thích vì sao 0,1 không biểu diễn chính xác
- So sánh hai số thực đúng cách
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: 0,1 + 0,2 có bằng 0,3?
  checks:
  - 0.1 + 0.2 != 0.3 and repr(0.1 + 0.2) == '0.30000000000000004'
  steps:
  - show: '<div class="code"><div>&gt;&gt;&gt; 0.1 + 0.2</div><div>0.30000000000000004</div><div>&gt;&gt;&gt; 0.1 + 0.2 ==
      0.3</div><div>False</div></div>

      <p>Máy tính không “tính sai”. Nó tính <b>đúng</b> trên những số khác với số bạn nghĩ.</p>

      '
    focus:
    - '1.2'
    - '1.4'
    - 2
    - 2
    say: Chào bạn, gõ 0 phẩy 1 cộng 0 phẩy 2 vào máy, ta được 0 phẩy 3 kèm một đuôi rất nhỏ ở chữ số thứ mười bảy. Vì thế
      phép so sánh với 0 phẩy 3 cho kết quả sai. Máy tính không tính sai, nó tính đúng trên những con số khác với con số bạn
      nghĩ. Tại sao lấy không phẩy một cộng không phẩy hai trên máy tính lại không bằng đúng không phẩy ba?
  - show: '<div class="box key">Hôm nay: máy lưu số thực thế nào (dấu, mũ, phần định trị), vì sao 0,1 không lưu chính xác
      được, và cách so sánh số thực.</div>

      '
    say: Hôm nay ta học cách máy lưu số thực gồm dấu, mũ và phần định trị, vì sao 0 phẩy 1 không lưu chính xác được, và cách
      so sánh số thực cho đúng. Chuẩn số thực dấu phẩy động phân tách ba phần dấu, mũ lệch và phần trị giải đáp câu hỏi kinh
      điển ấy.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: chữ số sau dấu phẩy trong hệ 2, và dạng khoa học'
  checks:
  - 1530 == 1.53 * 10 ** 3 and 2 ** -3 == 1 / 8 == 0.125
  - '[1 / 2, 1 / 4, 1 / 8] == [0.5, 0.25, 0.125] and 1 / 2 + 1 / 8 == 0.625'
  - 0.625 * 2 == 1.25 and 0.25 * 2 == 0.5 and 0.5 * 2 == 1.0
  steps:
  - show: '<p>Dạng khoa học hệ 10: $1530 = 1{,}53 \times 10^3$ — một chữ số trước dấu phẩy, phần còn lại do số mũ lo.</p>

      <p>Mũ âm là chia: $2^{-3} = \frac{1}{2^3} = \frac{1}{8} = 0{,}125$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Trước hết, ôn dạng khoa học trong hệ mười. Số 1530 viết được là 1 phẩy 53 nhân 10 mũ 3, chỉ một chữ số trước dấu
      phẩy, phần còn lại do số mũ lo. Mũ âm nghĩa là chia, 2 mũ âm 3 bằng 1 chia 2 mũ 3, tức 1 phần 8, bằng 0 phẩy 125. Mỗi
      bit thập phân sau dấu phẩy đại diện cho lũy thừa âm cơ số hai thay vì phần mười quen thuộc.
  - show: '<table class="t"><tr><th>vị trí sau dấu phẩy, hệ 2</th><th>thứ nhất</th><th>thứ hai</th><th>thứ ba</th></tr>

      <tr><td>giá trị</td><td>$\frac{1}{2} = 0{,}5$</td><td>$\frac{1}{4} = 0{,}25$</td><td>$\frac{1}{8} = 0{,}125$</td></tr></table>

      <p>$0{,}101_2 = \frac{1}{2} + \frac{1}{8} = 0{,}625$.</p>

      '
    focus:
    - 1
    - 2
    say: Trong hệ hai, các chữ số sau dấu phẩy mang giá trị một phần 2, một phần 4, một phần 8, mỗi vị trí bằng nửa vị trí
      trước. Vì vậy 0 phẩy 1 0 1 hệ hai bằng một phần 2 cộng một phần 8, tức 0 phẩy 625.
  - show: '<table class="t"><tr><th>nhân đôi phần lẻ</th><th>kết quả</th><th>chữ số lấy ra</th></tr>

      <tr><td>$0{,}625 \times 2$</td><td>1,25</td><td>1</td></tr>

      <tr><td>$0{,}25 \times 2$</td><td>0,5</td><td>0</td></tr>

      <tr><td>$0{,}5 \times 2$</td><td>1,0</td><td>1 — hết</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Muốn đổi ngược một phân số sang hệ hai, ta nhân đôi phần lẻ, phần nguyên nhảy ra chính là chữ số tiếp theo. Không
      phẩy 625 nhân 2 được 1 phẩy 25, lấy ra chữ số 1. Phần lẻ 0 phẩy 25 nhân 2 được 0 phẩy 5, lấy ra 0. Không phẩy 5 nhân
      2 được đúng 1, lấy ra 1, phần lẻ hết, nên ta được 0 phẩy 1 0 1.
- id: sym
  kind: symbol
  title: 'Giải mã: ba trường của một số float32'
  checks:
  - 1 + 8 + 23 == 32
  - '[(__import__(''struct'').unpack(''>I'', __import__(''struct'').pack(''>f'', v))[0] >> 23) & 0xFF for v in (0.0, 1e-40,
    float(''inf''), float(''nan''))] == [0, 0, 255, 255]'
  steps:
  - show: '<table class="t"><tr><th>trường</th><th>số bit</th><th>ý nghĩa</th></tr>

      <tr><td>dấu $s$</td><td>1</td><td>0 dương, 1 âm</td></tr>

      <tr><td>mũ $e$</td><td>8</td><td>số mũ cộng thêm độ lệch 127</td></tr>

      <tr><td>phần định trị $f$</td><td>23</td><td>các chữ số nhị phân sau dấu phẩy</td></tr></table>

      <div class="box key">Giá trị $= (-1)^s \times 1{,}f_2 \times 2^{\,e - 127}$ &nbsp; (với $e$ không phải 0 hay 255)</div>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    - 2
    say: Một số thực 32 bit chia thành ba trường. Một bit dấu, 0 là dương, 1 là âm. Tám bit mũ, lưu số mũ cộng thêm một độ
      lệch bằng 127, để mũ âm cũng lưu được bằng số không âm. Hai mươi ba bit phần định trị, là các chữ số nhị phân sau dấu
      phẩy. Giá trị bằng âm 1 mũ s, nhân 1 phẩy f hệ hai, nhân 2 mũ e trừ 127. Hai giá trị mũ 0 và 255 được dành riêng cho
      số 0, các số rất sát 0, vô cùng và giá trị không phải số, nên công thức này chỉ dùng cho mũ từ 1 đến 254. Chuẩn ba mươi
      hai bit chia một bit dấu, tám bit mũ cộng lệch và hai ba bit phần trị chuẩn hoá.
