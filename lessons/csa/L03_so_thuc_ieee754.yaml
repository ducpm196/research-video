      - '1.6'
    say: Kiểm bằng đường khác, ta đi từ số 0 phẩy 15625 sang hệ hai bằng cách nhân đôi phần lẻ, không cần đọc dãy bit. Hai
      lần nhân đầu được 0 phẩy 3125 rồi 0 phẩy 625, chưa tới 1 nên lấy ra hai chữ số 0. Lần thứ ba được 1 phẩy 25, lấy ra
      1. Hai lần cuối lấy ra 0 rồi 1, phần lẻ hết.
  - show: '$$0{,}15625 = 0{,}00101_2 = 1{,}01_2 \times 2^{-3}$$

      <p>Dời dấu phẩy sang phải 3 chỗ → mũ $-3$, phần định trị $01$: khớp đúng ba trường đã giải mã ✓</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Vậy 0 phẩy 15625 bằng 0 phẩy 0 0 1 0 1 hệ hai. Dời dấu phẩy sang phải 3 chỗ để có một chữ số 1 đứng trước, nên phải
      nhân với 2 mũ âm 3 để giữ nguyên giá trị. Ta được 1 phẩy 0 1 nhân 2 mũ âm 3, khớp mũ và phần định trị khi giải mã.
- id: why
  kind: concept
  title: Vì sao 0,1 không lưu chính xác được
  checks:
  - __import__('struct').unpack('>f', __import__('struct').pack('>f', 0.1))[0] == 0.10000000149011612
  - __import__('fractions').Fraction(0.1) != __import__('fractions').Fraction(1, 10)
  - round((__import__('struct').unpack('>f', __import__('struct').pack('>f', 0.1))[0] - 0.1) * 1e9, 2) == 1.49
  - '[round(x % 1, 10) for x in (0.2, 0.4, 0.8, 1.6, 1.2)] == [0.2, 0.4, 0.8, 0.6, 0.2]'
  steps:
  - show: '<p>Trong hệ 10, $\frac{1}{3} = 0{,}333\dots$ không bao giờ hết. Trong hệ 2, $\frac{1}{10} = 0{,}0001100110011\dots_2$
      cũng lặp mãi.</p>

      <p>Chỉ giữ được 23 (hoặc 52) bit, nên máy lưu số <b>gần nhất</b>: float32 của 0,1 là $0{,}10000000149011612\dots$</p>

      <div class="box warn">Chỉ các phân số có mẫu là lũy thừa của 2 (như $\frac{1}{2}, \frac{3}{8}, 0{,}15625$) mới lưu chính
      xác.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    say: Trong hệ mười, một phần ba bằng 0 phẩy 333 và không bao giờ hết. Trong hệ hai, một phần mười cũng là một số lặp mãi.
      Máy chỉ giữ được 23 bit, hoặc 52 bit với số 64 bit, nên nó lưu con số gần nhất. Với số 32 bit, 0 phẩy 1 thật ra được
      lưu là 0 phẩy 1 kèm một đuôi khoảng 1 phẩy 5 phần tỉ. Chỉ những phân số có mẫu là lũy thừa của 2 mới lưu chính xác.
  - show: '<table class="t"><tr><th>nhân đôi phần lẻ của 0,1</th><th>0,2</th><th>0,4</th><th>0,8</th><th>1,6</th><th>1,2</th><th>0,4</th><th>…</th></tr>

      <tr><td>chữ số</td><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>…</td></tr></table>

      <p>Phần lẻ quay lại 0,2 → dãy $0011$ lặp mãi, không bao giờ ra đúng 1.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Dùng phép nhân đôi phần lẻ, ta thấy tận mắt vì sao 0 phẩy 1 lặp mãi. Nhân đôi lần lượt được 0 phẩy 2, 0 phẩy 4, 0
      phẩy 8, rồi 1 phẩy 6 và 1 phẩy 2, phần lẻ quay lại 0 phẩy 2. Từ đó dãy chữ số 0 0 1 1 lặp lại mãi, phần lẻ không bao
      giờ về đúng 0.
- id: compare
  kind: concept
  title: So sánh số thực đúng cách
  checks:
  - abs((0.1 + 0.2) - 0.3) <= 1e-9 * max(abs(0.1 + 0.2), abs(0.3)) and __import__('math').isclose(0.1 + 0.2, 0.3)
  steps:
  - show: '<div class="code"><div>abs(a - b) &lt;= 1e-9 * max(abs(a), abs(b))   # sai số tương đối</div>

      <div>math.isclose(0.1 + 0.2, 0.3)               # True</div></div>

      <p>Dùng sai số <b>tương đối</b>: một ngưỡng cố định như $10^{-9}$ quá chặt với số cỡ $10^{20}$ và quá lỏng với số cỡ
      $10^{-20}$. Riêng khi so với 0 phải thêm một ngưỡng tuyệt đối nhỏ.</p>

      '
    focus:
    - '1.1'
    - '1.2'
    - 2
    say: Muốn so sánh hai số thực, ta kiểm hiệu của chúng có nhỏ so với độ lớn của chính chúng không, gọi là sai số tương
      đối. Nhiều ngôn ngữ có sẵn hàm làm việc này, và 0 phẩy 1 cộng 0 phẩy 2 khi đó được coi là bằng 0 phẩy 3. Không nên chỉ
      dùng một ngưỡng cố định, vì nó quá chặt với số rất lớn và quá lỏng với số rất nhỏ, riêng khi so với số 0 thì phải thêm
      một ngưỡng tuyệt đối nhỏ.
- id: verify
  kind: check
  title: 'Tự kiểm: ba phép thử nhanh'
  checks:
  - 2 ** -126 == 1.1754943508222875e-38 and (2 - 2 ** -23) * 2 ** 127 == 3.4028234663852886e+38
  - __import__('struct').unpack('>f', __import__('struct').pack('>f', 2 ** 24 - 1))[0] == 2 ** 24 - 1 and __import__('struct').unpack('>f',
    __import__('struct').pack('>f', 2 ** 24 + 1))[0] != 2 ** 24 + 1
  steps:
  - show: '<table class="t"><tr><th>phép thử</th></tr>

      <tr><td>Giải mã xong, mã hoá ngược lại phải ra đúng dãy bit — máy có thể kiểm bằng cách đóng gói số thành 4 byte.</td></tr>

      <tr><td>Khoảng của float32 (số chuẩn hoá, tức dạng $1{,}f$ với $e$ từ 1 đến 254): số dương từ khoảng $1{,}18 \times
      10^{-38}$ đến khoảng $3{,}4 \times 10^{38}$.</td></tr>

      <tr><td>Số có mẫu là lũy thừa của 2, viết hệ 2 <b>không quá 24</b> chữ số có nghĩa (số 1 ghép trước + 23 bit phần định
      trị), phải giải mã ra <b>đúng</b>, không có đuôi lẻ.</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Tự kiểm bằng ba cách. Một, giải mã xong thì mã hoá ngược lại phải ra đúng dãy bit ban đầu, máy kiểm được bằng cách
      đóng gói số thành 4 byte. Hai, nhớ khoảng của số 32 bit ở dạng chuẩn hoá, tức dạng có số 1 ghép phía trước, số dương
      nhỏ nhất cỡ 10 mũ âm 38, lớn nhất cỡ 3 phẩy 4 nhân 10 mũ 38. Ba, số có mẫu là lũy thừa của 2 và viết hệ hai không quá
      24 chữ số có nghĩa phải giải mã ra đúng, không có đuôi lẻ. Lý do là nó chỉ có hữu hạn chữ số, và vừa đủ chỗ trong 24
      bit độ chính xác, gồm số 1 ghép phía trước và 23 bit phần định trị.
- id: pitfalls
  kind: pitfall
  checks:
  - float(2 ** 24 + 1) == float(2 ** 24) or __import__('struct').unpack('>f', __import__('struct').pack('>f', 2 ** 24 + 1))[0]
    == 2 ** 24
  title: 4 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> So sánh số thực bằng <code>==</code> <b class="red">(sai)</b>

      <br><span class="note">Cộng lần lượt 0,1 mười lần trong vòng lặp ra $0{,}9999999999999999$, không phải 1,0. Dùng sai
      số tương đối.</span></div>

      '
    say: Lỗi thứ nhất, so sánh hai số thực bằng dấu bằng. Cộng lần lượt 0 phẩy 1 mười lần trong một vòng lặp ra 0 phẩy chín
      chín chín, không phải đúng 1, nên phải dùng sai số tương đối. So sánh bằng trực tiếp hai số thực dấu phẩy động trong
      lệnh điều kiện dẫn tới kết quả sai bất ngờ.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng số thực cho tiền <b class="red">(sai)</b>

      <br><span class="note">Tiền phải chính xác đến đồng: lưu bằng số nguyên (đơn vị nhỏ nhất) hoặc kiểu thập phân.</span></div>

      '
    say: Lỗi thứ hai, dùng số thực dấu phẩy động để lưu tiền. Tiền phải chính xác đến từng đồng, nên lưu bằng số nguyên theo
      đơn vị nhỏ nhất, hoặc dùng kiểu số thập phân. Tồn tại hai đại diện không âm không dương cùng giá trị đặc biệt vô cực
      và không phải số cần xử lý cẩn thận.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nghĩ float32 lưu chính xác mọi số nguyên <b class="red">(sai)</b>

      <br><span class="note">Chỉ có 24 bit độ chính xác:</span>

      $$2^{24} + 1 = 16\,777\,217 \to 16\,777\,216$$</div>

      '
    say: Lỗi thứ ba, nghĩ số thực 32 bit lưu chính xác mọi số nguyên. Nó chỉ có 24 bit độ chính xác, nên 2 mũ 24 cộng 1 bị
      lưu thành 2 mũ 24. Phân số đẹp ở hệ thập phân như một phần mười lại trở thành chuỗi vô hạn tuần hoàn dưới dạng nhị phân.
  - show: '<div class="box warn"><b>Lỗi 4.</b> Nghĩ thêm chữ số thập phân khi in là thêm độ chính xác <b class="red">(sai)</b>

      <br><span class="note">In 20 chữ số của một float32 chỉ hiện đuôi sai số; số chữ số đáng tin của float32 chỉ khoảng
      7.</span></div>

      '
    say: Lỗi thứ tư, nghĩ in thêm chữ số là có thêm độ chính xác. In 20 chữ số của một số 32 bit chỉ làm lộ đuôi sai số, vì
      số chữ số đáng tin chỉ khoảng 7.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - __import__('struct').unpack('>I', __import__('struct').pack('>f', -2.5))[0] == 0xC0200000
  - (0xC0200000 >> 31, (0xC0200000 >> 23) & 0xFF) == (1, 128) and -(1 + 0.25) * 2 ** (128 - 127) == -2.5
  - format(0xC0200000, '032b') == '1' + '10000000' + '01' + '0' * 21 and 0.75 * 2 == 1.5 and 0.5 * 2 == 1.0 and 3 / 4 == 0.75
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Giải mã $\texttt{0xC0200000}$ (gợi ý: $\texttt{C0} = 11000000_2$).</td></tr>

      <tr><td>2</td><td>Số 0,75 có lưu chính xác trong float32 không? Vì sao?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, giải mã dãy bit C 0 2 0 0 0 0 0 hệ mười sáu, gợi ý C 0 là 1 1 0 0, 0 0 0 0.
      Câu hai, số 0 phẩy 75 có lưu chính xác được không, vì sao? Dừng video và làm ra giấy.
    pause: 10
  - show: '<p>$\texttt{0xC0200000} = 1\;\;10000000\;\;01000000000000000000000$</p>

      <table class="t"><tr><th>trường</th><th>bit</th><th>nghĩa</th></tr>

      <tr><td>dấu</td><td>1</td><td>âm</td></tr>

      <tr><td>mũ</td><td>10000000 = 128</td><td>$128 - 127 = 1$</td></tr>

      <tr><td>phần định trị</td><td>01, còn lại 0</td><td>$1{,}01_2 = 1{,}25$</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.4'
    say: Đáp án câu một, đổi C 0 2 0 thành bit rồi cắt ba trường như ví dụ. Bit dấu bằng 1 nên số âm. Tám bit mũ là 1 rồi
      bảy số 0, bằng 128, trừ 127 còn 1. Phần định trị bắt đầu bằng 0 1, nên 1 phẩy 0 1 hệ hai bằng 1 phẩy 25. Chuyển đổi
      lần lượt từ dấu, giá trị mũ trừ độ lệch tới phần trị cộng một khôi phục ngay giá trị thực chuẩn.
  - show: '$$-1{,}25 \times 2^{1} = \hl{-2{,}5}$$

      '
    say: Ghép lại, giá trị bằng âm 1 phẩy 25 nhân 2 mũ 1, tức âm 1 phẩy 25 nhân 2, bằng âm 2 phẩy 5.
  - clear: true
    show: '<table class="t"><tr><th>nhân đôi phần lẻ</th><th>kết quả</th><th>chữ số</th></tr>

      <tr><td>$0{,}75 \times 2$</td><td>1,5</td><td>1</td></tr>

      <tr><td>$0{,}5 \times 2$</td><td>1,0</td><td>1 — hết</td></tr></table>

      <p>② Có: $0{,}75 = \frac{3}{4} = 0{,}11_2$, mẫu là lũy thừa của 2.</p>

      '
    focus:
    - 0
    - - '1.2'
      - '1.3'
    - 2
    say: Câu hai, ta nhân đôi phần lẻ như phần chuẩn bị. Không phẩy 75 nhân 2 được 1 phẩy 5, lấy ra 1, rồi 0 phẩy 5 nhân 2
      được đúng 1, lấy ra 1 và phần lẻ hết. Vậy câu trả lời là có, vì 0 phẩy 75 bằng ba phần tư, viết hệ hai là 0 phẩy 1 1,
      mẫu là lũy thừa của 2.
- id: code_read
  kind: symbol
  title: Đọc nhanh các ký hiệu bit trong mã thực hành C
  steps:
  - show: <table class='t'><tr><th>ký hiệu C</th><th>đọc là và ý nghĩa</th></tr><tr><td><code>uint8_t / int8_t</code></td><td>Số
      nguyên 8 bit không dấu (0..255) và có dấu (-128..127)</td></tr><tr><td><code>(x &gt;&gt; k) &amp; 1U</code></td><td>Dịch
      phải k vị trí rồi giữ 1 bit thấp nhất bằng mặt nạ</td></tr><tr><td><code>memcpy(&amp;u, &amp;f, 4)</code></td><td>Chép
      đúng 4 byte biểu diễn bit IEEE 754 của float sang uint32_t</td></tr></table>
    say: Trước khi sang phần thực hành bằng mã C, bạn lướt nhanh bảng đọc ba ký hiệu thao tác bít hay gặp. Kiểu tám bít phân
      biệt rạch ròi không dấu và có dấu, phép dịch kết hợp mặt nạ tách từng bít, còn hàm chép vùng nhớ đọc nguyên dạng bít
      số thực.
    focus:
    - '1.2'
    - '1.3'
    clear: true
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/CSA/L03
  steps:
  - show: <table class='t'><tr><th>Thực hành CSA:L03</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>So
      sánh hai số thực đúng cách</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>f=-6.5 tol=1e-9</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh CSA L03 duong_dan/bai_cua_ban.c</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 3 với dữ liệu đọc động. Đọc kỹ số thực đơn và ngưỡng sai số từ đầu vào chuẩn rồi chạy
      lệnh tự chấm cùng hai ca kiểm ẩn. Sao chép bốn byte số thực sang kiểu nguyên ba hai bit để tách bit dấu, số mũ đã trừ
      lệch và phần trị. Kiểm tra sai khác giữa tổng không phẩy một cộng không phẩy hai với không phẩy ba dưới ngưỡng cho trước.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai CSA:L03</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (bit float32)</b></td><td>Chép 4 byte sang <code>uint32_t</code> rồi tách bit 31 và trường 8 bit [30..23] trừ 127</td></tr><tr><td><b>Bước
      2 (phần trị)</b></td><td>Mặt nạ <code>u &amp; 0x7FFFFFU</code> rút đúng 23 bit phần định trị</td></tr><tr><td><b>Bước
      3 (sai số)</b></td><td>So sánh <code>fabs((0.1 + 0.2) - 0.3) &lt; tol</code> thay cho phép <code>==</code></td></tr></table>
    say: Gợi ý cài đặt bài số 3 chia thành ba bước rõ ràng. Đầu tiên sao chép vùng nhớ số thực ba hai bit sang số nguyên rồi
      tách ba trường theo vị trí bit. Cuối cùng kiểm sai số cộng số thực dưới ngưỡng và xuất đủ ba dòng kèm mã thập lục phân.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>sign=1 exp_unbiased=2 mant_hex=0x500000</div><div>close_03=1</div><div>hex32=0xC0D00000</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">dấu, mũ (lệch 127), phần định trị</span><span class="a">→</span>

      <span class="n">$(-1)^s \times 1{,}f \times 2^{e - 127}$</span><span class="a">→</span>

      <span class="n">0,1 lặp mãi trong hệ 2</span><span class="a">→</span>

      <span class="n">so sánh bằng sai số tương đối</span></div>

      '
    say: Tổng kết lại, số thực 32 bit gồm dấu, mũ có độ lệch 127, và phần định trị. Giá trị bằng âm 1 mũ s nhân 1 phẩy f nhân
      2 mũ e trừ 127. Số 0 phẩy 1 lặp mãi trong hệ hai nên chỉ được lưu gần đúng. Vì vậy phải so sánh số thực bằng sai số
      tương đối. Mọi số thực hữu hạn trên máy tính chỉ xấp xỉ tập liên tục trên lưới bước nhảy dãn thưa dần theo độ lớn.
