# Quy ước: “DMA” = truy cập bộ nhớ trực tiếp (tên viết tắt chỉ trên màn hình). Thời gian xử lý một ngắt lấy 2 µs làm giả định minh hoạ.
#   Tốc độ thiết bị 100 MB/s = 10⁸ byte mỗi giây (hệ 10).
objectives:
  - "So sánh thăm dò, ngắt, truy cập bộ nhớ trực tiếp"
  - "Tính phần thời gian CPU dành cho vào/ra"
  - "Chọn cách vào/ra theo tốc độ thiết bị"
