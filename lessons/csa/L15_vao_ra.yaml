scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bộ xử lý chờ bàn phím"
    steps:
      - show: |
          <p>Bộ xử lý chạy hàng tỉ lệnh mỗi giây; người gõ phím được vài phím mỗi giây; ổ đĩa đọc cả trăm triệu byte mỗi giây.</p>
          <div class="box key">Làm sao để bộ xử lý không phí thời gian chờ thiết bị chậm, mà cũng theo kịp thiết bị nhanh? Hôm nay: ba cách làm vào/ra.</div>
        focus: [1, 2]
        say: "Chào bạn, bộ xử lý chạy hàng tỉ lệnh mỗi giây, người gõ phím chỉ được vài phím mỗi giây, còn ổ đĩa đọc cả trăm triệu byte mỗi giây. Làm sao để bộ xử lý không phí thời gian chờ thiết bị chậm, mà vẫn theo kịp thiết bị nhanh, hôm nay ta học ba cách làm vào ra."

  # ───────────────────────── 2. BA CÁCH ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần triệu giây, phần trăm của một giây, bit và byte"
    checks:
      - "abs(1000 * 2e-6 - 0.002) < 1e-15 and abs(0.002 / 1 * 100 - 0.2) < 1e-12"
      - "1e9 / 8 == 125e6"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>đổi ra giây</th></tr>
          <tr><td>1 µs (một phần triệu giây)</td><td>$10^{-6}$ s</td></tr>
          <tr><td>2 µs</td><td>$2 \times 10^{-6}$ s</td></tr>
          <tr><td>1000 lần × 2 µs</td><td>$0{,}002$ s</td></tr></table>
          <p>Trong mỗi giây, bận 0,002 s nghĩa là bận $\frac{0{,}002}{1} = 0{,}2\%$ thời gian.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Trước hết, ôn cách đổi đơn vị thời gian sẽ dùng. Một phần triệu giây là 10 mũ âm 6 giây, nên 2 phần triệu giây là 2 nhân 10 mũ âm 6 giây. Làm một việc như thế 1000 lần thì tốn 0 phẩy 002 giây. Nếu việc đó lặp lại trong mỗi giây, bộ xử lý bận 0 phẩy 002 chia 1, tức 0 phẩy 2 phần trăm thời gian. Cách tính này dùng suốt bài hôm nay."
      - show: |
          $$1\ \text{Gbit/s} = \frac{10^9\ \text{bit}}{8} = 125 \times 10^6\ \text{byte mỗi giây}$$
        say: "Ở bài 0, ta đã biết một byte gồm 8 bit. Vì vậy mạng 1 tỉ bit mỗi giây chở được 10 mũ 9 chia 8, bằng 125 triệu byte mỗi giây."

  - id: sym
    kind: symbol
    title: "Giải mã: thăm dò, ngắt, DMA"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>bộ xử lý làm gì</th><th>hợp với</th></tr>
          <tr><td><b>thăm dò</b></td><td>liên tục hỏi “xong chưa?”</td><td>thiết bị rất nhanh hoặc hệ rất đơn giản</td></tr>
          <tr><td><b>ngắt</b></td><td>làm việc khác; thiết bị báo khi xong, bộ xử lý tạm dừng để xử lý</td><td>sự kiện thưa (phím, gói mạng)</td></tr>
          <tr><td><b>DMA</b> (truy cập bộ nhớ trực tiếp)</td><td>giao việc chép cả khối cho bộ điều khiển; chỉ nhận một ngắt khi xong khối</td><td>khối dữ liệu lớn (đĩa, mạng nhanh)</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Có ba cách. Thăm dò là bộ xử lý liên tục hỏi thiết bị xong chưa, hợp với thiết bị rất nhanh hoặc hệ rất đơn giản. Ngắt là bộ xử lý làm việc khác, khi thiết bị xong thì gửi tín hiệu, bộ xử lý tạm dừng để xử lý, hợp với sự kiện thưa như phím bấm. Truy cập bộ nhớ trực tiếp là giao việc chép cả một khối cho bộ điều khiển riêng, bộ xử lý chỉ nhận một ngắt khi xong khối, hợp với dữ liệu lớn như đĩa."

  # ───────────────────────── 3. CHI PHÍ NGẮT ─────────────────────────
  - id: interrupt
    kind: concept
    title: "Chi phí của ngắt"
    checks:
      - "abs(1000 * 2e-6 - 0.002) < 1e-15"
    steps:
      - show: |
          <p>Mỗi ngắt: lưu trạng thái, chạy hàm xử lý, khôi phục — giả sử tốn <b>2 µs</b>.</p>
          <p>Bàn phím, mạng chậm: 1000 ngắt mỗi giây × 2 µs = 0,002 s mỗi giây = $\hl{0{,}2\%}$ thời gian bộ xử lý — rất rẻ.</p>
        focus: [1, 2]
        say: "Mỗi ngắt tốn công lưu trạng thái, chạy hàm xử lý, rồi khôi phục, giả sử hết 2 phần triệu giây. Với thiết bị chậm, 1000 ngắt mỗi giây nhân 2 phần triệu giây chỉ tốn 0 phẩy 2 phần trăm thời gian bộ xử lý, rất rẻ."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bộ xử lý tiêu thời gian vào đâu"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><text x="310" y="58" font-size="24" text-anchor="end" fill="#1f2937">thăm dò</text><rect x="330" y="20" width="1100" height="56" fill="#d1d5db" stroke="#1f2937" stroke-width="1.5"/><text x="880" y="58" font-size="24" text-anchor="middle" fill="#1f2937">bộ xử lý chỉ hỏi: xong chưa? xong chưa?</text><text x="310" y="148" font-size="24" text-anchor="end" fill="#1f2937">ngắt</text><rect x="330" y="110" width="120" height="56" fill="#93c5fd" stroke="#1f2937" stroke-width="1.5"/><rect x="450" y="110" width="17" height="56" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><rect x="467.5" y="110" width="120.0" height="56" fill="#93c5fd" stroke="#1f2937" stroke-width="1.5"/><rect x="587.5" y="110" width="17.0" height="56" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><rect x="605.0" y="110" width="120.0" height="56" fill="#93c5fd" stroke="#1f2937" stroke-width="1.5"/><rect x="725.0" y="110" width="17.0" height="56" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><rect x="742.5" y="110" width="120.0" height="56" fill="#93c5fd" stroke="#1f2937" stroke-width="1.5"/><rect x="862.5" y="110" width="17.0" height="56" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><rect x="880.0" y="110" width="120.0" height="56" fill="#93c5fd" stroke="#1f2937" stroke-width="1.5"/><rect x="1000.0" y="110" width="17.0" height="56" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><rect x="1017.5" y="110" width="120.0" height="56" fill="#93c5fd" stroke="#1f2937" stroke-width="1.5"/><rect x="1137.5" y="110" width="17.0" height="56" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><rect x="1155.0" y="110" width="120.0" height="56" fill="#93c5fd" stroke="#1f2937" stroke-width="1.5"/><rect x="1275.0" y="110" width="17.0" height="56" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><rect x="1292.5" y="110" width="120.0" height="56" fill="#93c5fd" stroke="#1f2937" stroke-width="1.5"/><rect x="1412.5" y="110" width="17.0" height="56" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="310" y="238" font-size="24" text-anchor="end" fill="#1f2937">DMA</text><rect x="330" y="200" width="1080" height="56" fill="#93c5fd" stroke="#1f2937" stroke-width="1.5"/><rect x="1410" y="200" width="20" height="56" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><rect x="330" y="270" width="1080" height="36" fill="#bbf7d0" stroke="#1f2937" stroke-width="1.5"/><text x="870" y="296" font-size="22" text-anchor="middle" fill="#1f2937">bộ điều khiển riêng chép cả khối vào bộ nhớ</text><g font-size="22"><rect x="330" y="345" width="30" height="24" fill="#93c5fd" stroke="#1f2937"/><text x="370" y="364" fill="#1f2937">bộ xử lý làm việc có ích</text><rect x="710" y="345" width="30" height="24" fill="#ef4444" stroke="#1f2937"/><text x="750" y="364" fill="#1f2937">xử lý một ngắt, khoảng 2 µs</text><rect x="1090" y="345" width="30" height="24" fill="#d1d5db" stroke="#1f2937"/><text x="1130" y="364" fill="#1f2937">chờ, phí thời gian</text><text x="330" y="410" fill="#1f2937">cùng một đoạn thời gian, trục ngang chạy từ trái sang phải</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cùng một đoạn thời gian của bộ xử lý theo ba cách. Với thăm dò, cả thanh màu xám, vì bộ xử lý chỉ đứng hỏi thiết bị xong chưa. Với ngắt, bộ xử lý làm việc có ích ở phần xanh, mỗi khi thiết bị báo thì chen vào một vạch đỏ để xử lý ngắt, càng nhiều sự kiện thì càng nhiều vạch đỏ. Với truy cập bộ nhớ trực tiếp, một bộ điều khiển riêng ở thanh xanh lá chép cả khối, bộ xử lý chỉ trả một vạch đỏ khi cả khối xong."

  - id: example
    kind: example
    title: "Ổ đĩa 100 MB/s: ngắt từng mẩu hay DMA?"
    checks:
      - "100e6 / 16 == 6250000.0 and 100e6 / 16 * 2e-6 == 12.5"
      - "round(100e6 / 4096) == 24414 and round(100e6 / 4096 * 2e-6 * 100, 2) == 4.88"
    steps:
      - show: |
          <p><b>Bước 1.</b> Ngắt mỗi 16 byte: $\frac{10^8}{16} = 6{,}25 \times 10^6$ ngắt mỗi giây.</p>
        say: "Thử ổ đĩa 100 triệu byte mỗi giây. Bước một, giả sử thiết bị báo ngắt sau từng mẩu nhỏ. Nếu cứ 16 byte lại ngắt một lần, ta có 6 phẩy 25 triệu ngắt mỗi giây."
      - show: |
          <p><b>Bước 2.</b> Nhân với thời gian một ngắt:</p>
          $$6{,}25 \times 10^6 \times 2 \times 10^{-6} = 12{,}5\ \text{s mỗi giây}$$
          <p><b>Không thể</b>: cần hơn 12 bộ xử lý chỉ để xử lý ngắt.</p>
        focus: [2, 3]
        say: "Bước hai, nhân số ngắt với 2 phần triệu giây, ra 12 phẩy 5 giây công việc cho mỗi giây. Nghĩa là không thể, vì cần hơn 12 bộ xử lý chỉ để xử lý ngắt."
      - show: |
          <p><b>Bước 3.</b> DMA, ngắt mỗi khối 4096 byte: $\frac{10^8}{4096} \approx 24\,414$ ngắt mỗi giây.</p>
        say: "Bước ba, chuyển sang truy cập bộ nhớ trực tiếp, bộ điều khiển chép xong cả khối mới báo. Mỗi khối 4096 byte, nên số ngắt là 100 triệu chia 4096, khoảng 24414 ngắt mỗi giây."
      - show: |
          <p><b>Bước 4.</b> $24\,414 \times 2 \times 10^{-6} \approx 0{,}0488$ s mỗi giây $\approx \hl{4{,}88\%}$ thời gian bộ xử lý.</p>
        say: "Bước bốn, nhân với 2 phần triệu giây, được khoảng 0 phẩy 0488 giây trong mỗi giây. Với truy cập bộ nhớ trực tiếp, mỗi khối 4096 byte mới ngắt một lần, chỉ khoảng 24 nghìn ngắt mỗi giây, tốn khoảng 4 phẩy 88 phần trăm thời gian bộ xử lý."

  - id: verify
    kind: check
    title: "Tự kiểm: đếm số byte tới trong lúc xử lý một ngắt"
    checks:
      - "round(100e6 / 4096 * 2e-6, 4) == 0.0488"
      - "round(1e8 * 2e-6) == 200 and 200 / 16 == 12.5 and 4096 / 200 == 20.48 and round(1 / 20.48 * 100, 2) == 4.88"
    steps:
      - show: |
          <p>Trong 2 µs xử lý một ngắt, ổ đĩa đã đưa tới $10^8 \times 2 \times 10^{-6} = 200$ byte.</p>
          <table class="t"><tr><th>cách</th><th>byte mỗi ngắt</th><th>so với 200 byte</th></tr>
          <tr><td>ngắt mỗi 16 byte</td><td>16</td><td>$\frac{200}{16} = 12{,}5$ ngắt dồn tới trong lúc xử lý một ngắt <b class="red">(không được)</b></td></tr>
          <tr><td>DMA</td><td>4096</td><td>$\frac{4096}{200} = 20{,}48$, nên bận $\frac{1}{20{,}48} \approx 4{,}88\%$ ✓</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.3"]
        say: "Kiểm bằng đường khác, ta đếm số byte tới trong lúc xử lý một ngắt, thay vì đếm ngắt mỗi giây. Trong 2 phần triệu giây, ổ đĩa đã đưa tới 10 mũ 8 nhân 2 nhân 10 mũ âm 6, bằng 200 byte. Ngắt mỗi 16 byte thì trong lúc xử lý một ngắt đã có 200 chia 16, bằng 12 phẩy 5 ngắt mới dồn tới, nên cần 12 phẩy 5 bộ xử lý, khớp bước hai. Với khối 4096 byte, một ngắt đến sau 4096 chia 200, bằng 20 phẩy 48 lần thời gian xử lý. Vậy bộ xử lý bận 1 chia 20 phẩy 48, khoảng 4 phẩy 88 phần trăm, khớp bước bốn."
      - clear: true
        show: |
          <table class="t"><tr><th>phép thử nhanh</th><th>ở ví dụ</th></tr>
          <tr><td>Phần thời gian bộ xử lý = số sự kiện mỗi giây × thời gian xử lý một sự kiện.</td><td>$24\,414 \times 2\ \text{µs}$</td></tr>
          <tr><td>Kết quả lớn hơn 100% nghĩa là cách đó không dùng được.</td><td>12,5 s mỗi giây <b class="red">(không được)</b></td></tr>
          <tr><td>Đổi đơn vị trước khi nhân: 1 µs $= 10^{-6}$ s.</td><td>2 µs $= 2 \times 10^{-6}$ s</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Tự kiểm bằng ba cách. Một, phần thời gian bộ xử lý bằng số sự kiện mỗi giây nhân thời gian xử lý một sự kiện. Hai, kết quả lớn hơn 100 phần trăm nghĩa là cách đó không dùng được, vì một giây không chứa nổi hơn một giây công việc. Ba, đổi đơn vị trước khi nhân, một phần triệu giây bằng 10 mũ âm 6 giây."

  # ───────────────────────── 6. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ ngắt là miễn phí <b class="red">(sai)</b>
          <br><span class="note">Tốc độ ngắt rất cao làm bộ xử lý chỉ còn lo xử lý ngắt — máy “treo” dù không có lỗi:</span>
          $$6{,}25 \times 10^6 \times 2 \times 10^{-6} = 12{,}5\ \text{s mỗi giây}$$</div>
        say: "Lỗi thứ nhất, nghĩ ngắt là miễn phí. Khi tốc độ ngắt rất cao, bộ xử lý chỉ còn lo xử lý ngắt, và máy như bị treo dù không có lỗi nào."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ thăm dò luôn tệ <b class="red">(chưa đúng)</b>
          <br><span class="note">Với thiết bị cực nhanh (mạng hàng chục Gbit/s, ổ thể rắn NVMe rất nhanh), thăm dò có thể nhanh hơn ngắt vì bỏ được chi phí lưu và khôi phục.</span></div>
        say: "Lỗi thứ hai, nghĩ thăm dò luôn tệ. Với thiết bị cực nhanh như mạng tốc độ rất cao, thăm dò có thể nhanh hơn ngắt, vì bỏ được chi phí lưu và khôi phục trạng thái."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đọc dữ liệu DMA trước khi nhận ngắt báo xong <b class="red">(sai)</b>
          <br><span class="note">Bộ điều khiển đang ghi dở vào bộ nhớ — chỉ dùng khối sau khi có tín hiệu hoàn tất.</span></div>
        say: "Lỗi thứ ba, đọc dữ liệu trước khi nhận ngắt báo đã chép xong. Bộ điều khiển có thể đang ghi dở vào bộ nhớ, nên chỉ dùng khối sau khi có tín hiệu hoàn tất."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Làm việc nặng ngay trong hàm xử lý ngắt <b class="red">(sai)</b>
          <br><span class="note">Trong lúc đó các ngắt khác bị trễ; hàm xử lý chỉ nên ghi nhận rồi giao phần còn lại cho chương trình thường.</span></div>
        say: "Lỗi thứ tư, làm việc nặng ngay trong hàm xử lý ngắt. Trong lúc đó các ngắt khác bị trễ, nên hàm xử lý chỉ nên ghi nhận sự kiện, rồi giao phần còn lại cho chương trình thường."

  # ───────────────────────── 7. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(5000 * 4e-6 - 0.02) < 1e-12"
      - "round(1e9 / 8 / 1500) == 83333 and round(1e9 / 8 / 1500 * 4e-6 * 100, 1) == 33.3"
      - "1e9 / 8 == 125e6 and round(125e6 / 1500) == 83333"
      - "(lambda f: round(f / 6 * 100, 2) == 5.56 and round(f / 7 * 100, 2) == 4.76 and f / 6 > 0.05 > f / 7)(1e9 / 8 / 1500 * 4e-6)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>5000 ngắt mỗi giây, mỗi ngắt 4 µs: tốn bao nhiêu phần trăm thời gian bộ xử lý?</td></tr>
          <tr><td>2</td><td>Mạng 1 Gbit/s, mỗi gói 1500 byte gây một ngắt 4 µs: bao nhiêu phần trăm?</td></tr>
          <tr><td>3</td><td>Ở câu 2, phải gộp ít nhất bao nhiêu gói vào một ngắt để tốn dưới 5%?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 5000 ngắt mỗi giây, mỗi ngắt 4 phần triệu giây, tốn bao nhiêu phần trăm thời gian bộ xử lý? Câu hai, mạng 1 tỉ bit mỗi giây, mỗi gói 1500 byte gây một ngắt 4 phần triệu giây, tốn bao nhiêu phần trăm? Câu ba, cũng với mạng đó, phải gộp ít nhất bao nhiêu gói vào một ngắt để chỉ tốn dưới 5 phần trăm? Dừng video và làm ra giấy."
        pause: 10
      - show: |
          <p>① $5000 \times 4 \times 10^{-6} = 0{,}02$ s mỗi giây → $\hl{2\%}$.</p>
        say: "Đáp án câu một, 5000 nhân 4 phần triệu giây bằng 0 phẩy 02 giây, tức 2 phần trăm. Kết quả nhỏ, nên ngắt là cách hợp lý cho thiết bị này."
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>byte mỗi giây</td><td>$\frac{10^9}{8}$</td><td>$125 \times 10^6$</td></tr>
          <tr><td>gói mỗi giây</td><td>$\frac{125 \times 10^6}{1500}$</td><td>$\approx 83\,333$</td></tr>
          <tr><td>phần thời gian</td><td>$83\,333 \times 4 \times 10^{-6}$</td><td>$\approx \hl{33{,}3\%}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Câu hai, làm từng bước như ví dụ. Một tỉ bit chia 8 được 125 triệu byte mỗi giây. Chia cho 1500 byte mỗi gói được khoảng 83 nghìn gói mỗi giây. Nhân với 4 phần triệu giây ra khoảng 33 phẩy 3 phần trăm thời gian bộ xử lý."
      - clear: true
        show: |
          <table class="t"><tr><th>gộp $k$ gói mỗi ngắt</th><th>phần thời gian $\frac{33{,}3\%}{k}$</th><th>dưới 5%?</th></tr>
          <tr><td>6</td><td>$\approx 5{,}56\%$</td><td>chưa</td></tr>
          <tr><td>7</td><td>$\approx \hl{4{,}76\%}$</td><td>đạt</td></tr></table>
          <p>Chọn gộp ít nhất <b>7 gói</b> — vì vậy bộ điều khiển mạng thật gộp nhiều gói vào một ngắt.</p>
        focus: [0, 0, "1.2", "1.3", 2]
        say: "Câu ba là một quyết định, ta thử từng số gói. Gộp k gói vào một ngắt thì số ngắt giảm k lần, nên phần thời gian cũng chia cho k. Gộp 6 gói còn khoảng 5 phẩy 56 phần trăm, chưa đạt. Gộp 7 gói còn khoảng 4 phẩy 76 phần trăm, dưới 5 phần trăm. Vì vậy bộ điều khiển mạng thật gộp nhiều gói vào một ngắt."

  # ───────────────────────── 8. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">thăm dò: hỏi liên tục</span><span class="a">→</span>
          <span class="n">ngắt: thiết bị báo khi xong</span><span class="a">→</span>
          <span class="n">DMA: chép cả khối, một ngắt</span><span class="a">→</span>
          <span class="n">chi phí = số sự kiện × thời gian mỗi sự kiện</span></div>
        say: "Tổng kết lại, thăm dò là hỏi liên tục, ngắt là để thiết bị báo khi xong, còn truy cập bộ nhớ trực tiếp chép cả khối và chỉ ngắt một lần. Chi phí bằng số sự kiện mỗi giây nhân thời gian xử lý mỗi sự kiện."
      - show: |
          <div class="box key"><b>Tư duy:</b> gộp nhiều việc nhỏ thành một việc lớn để chia sẻ chi phí cố định — cùng ý với lô dữ liệu, bộ nhớ đệm, gói mạng.</div>
        say: "Điều cần mang theo, gộp nhiều việc nhỏ thành một việc lớn để chia sẻ chi phí cố định, cùng một ý với xử lý theo lô, bộ nhớ đệm và gói mạng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 16): <b>tình huống chuyên gia theo dòng thời gian</b> — hết bữa trưa miễn phí: từ chip 2 GHz năm 2001, qua bức tường xung nhịp và chip đa nhân, tới lỗ hổng Spectre năm 2018.</p>
        forward_ref: true
        say: "Bài sau, bài 16, là bài cuối của khoá, một tình huống chuyên gia theo dòng thời gian về hết bữa trưa miễn phí. Ta sẽ đi từ chip 2 tỉ nhịp mỗi giây năm 2001, qua lúc xung nhịp chạm tường và chip có nhiều lõi. Cuối cùng là một lỗ hổng năm 2018 sinh ra từ chính việc bộ xử lý đoán trước để chạy nhanh."
