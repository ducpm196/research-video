id: L01
course: CSA
series: "CSA · Hệ thống máy tính"
title: "Bài 1 — Số nguyên không dấu, bù 2 và tràn số"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/csa.yaml L01; audit/verify_plan_curricula.py CSA:L01; R. Bryant, D. O'Hallaron, Computer Systems: A Programmer's Perspective, mục 2.2–2.3"
assumes: [arith, power, sub, sub2]
# Quy ước: cơ số ở chỉ số dưới như bài 0; số 8 bit viết đủ 8 chữ số. “Không dấu” = mọi bit là giá trị; “có dấu” = bù 2.
objectives:
  - "Viết số âm bằng bù 2"
  - "Đọc cùng một dãy bit theo kiểu không dấu và có dấu"
  - "Nhận ra tràn số có dấu và không dấu"
asr_reviewed:
  - {sentence: "Bước năm, cùng một dãy bit 1 1 0 0, 1 0 0 0 lại cho ra hai cách đọc khác nhau.", reason: "medium chép “… 1100, 1100 …” (0.636), nhưng probe 2026-11-02 (scratchpad probe_csa2.py, cùng câu, NamMinh −5%): small chép đúng “1 1 0 0, 1 0 0 0” ở cả bản gốc lẫn bản “rồi 1 0 0 0” (3/4), còn medium chép nhóm hai thành “1100” ở 4/4 — medium lặp lại nhóm vừa nghe, TTS đọc đúng; dãy/giải, bit/bít, đọc/đầu lệch âm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đảo mọi bit, ta được nhóm 1 1 1 1, rồi tới nhóm 0 0 1 1.", reason: "ASR chép “Đảo mọi biết ta được nhóm 1111 rồi tới nhóm 0011.” (0.706): ASR gộp chữ số đọc rời thành “1111”, “0011” — đúng từng chữ số và thứ tự; bit/biết lệch âm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Thử ngay, 0 1 0 1 cộng 0 0 1 1 ra 1 0 0 0, đúng là 5 cộng 3 bằng 8.", reason: "ASR chép “Thử ngay, 0101 cộng 001-1000, đúng là 5 cộng 3 bằng 8.” (0.7): lệch âm/thanh thuần Việt: không/∅, không/trăm linh, không không/∅, ra một không không không/nghìn — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ba, cộng thêm 1, ta được 1 1 1 1, 1 0 1 1.", reason: "dãy chữ số: audit/asr_digits.py — dãy chữ số bản chép trùng hoàn toàn kỳ vọng (3111111011); độ khớp thấp chỉ vì ASR gộp chữ số thành “1111, 1011”"}
  - {sentence: "Câu hai, 200 vượt quá 127, dãy bit 1 1 0 0, 1 0 0 0 đọc có dấu là âm 56.", reason: "dãy chữ số: audit/asr_digits.py — nhóm “1 0 0 0”: small chép “10000”, medium chép “1100” — hai mô hình lệch theo hai cách khác nhau (lỗi ASR với dãy “không” lặp); nhóm đầu và các số khác khớp — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "127 cộng 1 bằng âm 128?"
    checks:
      - "((127 + 1) & 0xFF) - 256 == -128"
    steps:
      - show: |
          <div class="code"><div>int8_t x = 127;   // số nguyên 8 bit có dấu</div>
          <div>x = x + 1;        // x bây giờ bằng bao nhiêu?</div></div>
          <p>Trên hầu hết máy tính, kết quả là <b>âm 128</b>.</p>
        focus: ["1.1", "1.2", 2]
        say: "Chào bạn, ta có một biến số nguyên 8 bit có dấu, bằng 127. Cộng thêm 1, biến bằng bao nhiêu? Trên hầu hết máy tính, kết quả lại là âm 128."
      - show: |
          <div class="box key">Hôm nay: máy tính viết số âm thế nào (bù 2), và vì sao phép cộng có thể “quay vòng” — tràn số.</div>
        say: "Hôm nay ta học cách máy tính viết số âm bằng phép bù 2, và vì sao phép cộng có thể quay vòng, gọi là tràn số."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đọc 8 bit và cộng nhị phân có nhớ"
    checks:
      - "int('00000101', 2) == 5 and int('01111111', 2) == 127 and 64 + 32 + 16 + 8 + 4 + 2 + 1 == 127"
      - "0b0101 + 0b0011 == 0b1000 and 5 + 3 == 8 and 1 + 1 == 0b10"
    steps:
      - show: |
          <table class="t"><tr><th>giá trị</th><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
          <tr><td>$00000101_2$</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td></tr>
          <tr><td>$01111111_2$</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>
          <p>$00000101_2 = 4 + 1 = 5$; &nbsp; $01111111_2 = 64 + 32 + 16 + 8 + 4 + 2 + 1 = 127$.</p>
        focus: [0, "1.2", "1.3"]
        say: "Trước hết, ôn lại cách đọc 8 bit ở bài 0, mỗi vị trí mang một lũy thừa của 2, từ 128 ở bên trái xuống 1 ở bên phải. Dãy 0 0 0 0, 0 1 0 1 có bit 4 và bit 1 bật, nên bằng 4 cộng 1, bằng 5. Dãy 0 1 1 1, 1 1 1 1 bật mọi bit trừ bit 128, cộng lại được 127."
      - show: |
          <table class="t"><tr><th>cộng một cột</th><th>viết</th><th>nhớ sang cột trái</th></tr>
          <tr><td>$0 + 1$</td><td>1</td><td>0</td></tr>
          <tr><td>$1 + 1 = 10_2$</td><td>0</td><td>1</td></tr>
          <tr><td>$1 + 1 + 1$ (có nhớ) $= 11_2$</td><td>1</td><td>1</td></tr></table>
          <p>Ví dụ: $0101_2 + 0011_2 = 1000_2$, tức $5 + 3 = 8$ ✓</p>
        focus: [1, "1.3", "1.4", 2]
        say: "Cộng nhị phân làm từng cột từ phải sang trái, giống cộng hệ mười, chỉ khác là 1 cộng 1 bằng 2, viết là 1 0 hệ hai. Vì vậy 1 cộng 1 thì viết 0 và nhớ 1 sang cột bên trái. Nếu cột đó lại có thêm số nhớ, 1 cộng 1 cộng 1 bằng 3, viết 1 và nhớ 1. Thử ngay, 0 1 0 1 cộng 0 0 1 1 ra 1 0 0 0, đúng là 5 cộng 3 bằng 8."

  - id: sym
    kind: symbol
    title: "Giải mã: không dấu, có dấu, bit dấu"
    checks:
      - "2 ** 8 - 1 == 255 and -2 ** 7 == -128 and 2 ** 7 - 1 == 127"
    steps:
      - show: |
          <table class="t"><tr><th>kiểu 8 bit</th><th>khoảng giá trị</th></tr>
          <tr><td>không dấu</td><td>$0 \dots 255$</td></tr>
          <tr><td>có dấu (bù 2)</td><td>$-128 \dots 127$</td></tr></table>
          <p>Ở kiểu có dấu, bit trái nhất là <b>bit dấu</b>: 0 là không âm, 1 là âm. Cùng 256 dãy bit, chỉ khác cách đọc.</p>
        introduces: [dots]
        focus: [0, "1.2", "1.3", 2, 2]
        say: "Với 8 bit có hai cách đọc. Kiểu không dấu đọc mọi bit là giá trị, từ 0 đến 255, dấu ba chấm nghĩa là cứ thế tiếp tục. Kiểu có dấu theo bù 2 đi từ âm 128 đến 127. Ở kiểu có dấu, bit trái nhất gọi là bit dấu, 0 là số không âm, 1 là số âm. Vẫn là 256 dãy bit đó, chỉ khác cách đọc."

  # ───────────────────────── 3. BÙ 2 ─────────────────────────
  - id: twos
    kind: concept
    title: "Bù 2: đảo bit rồi cộng 1"
    checks:
      - "format(5, '08b') == '00000101' and format(~5 & 0xFF, '08b') == '11111010' and format(-5 & 0xFF, '08b') == '11111011'"
      - "all(((x & 0xFF) + (-x & 0xFF)) & 0xFF == 0 for x in range(-128, 128))"
    steps:
      - show: |
          <p>Viết $-5$ trên 8 bit:</p>
          <p>① $5 = 00000101$ &nbsp; ② đảo mọi bit: $11111010$ &nbsp; ③ cộng 1: $\hl{11111011}$</p>
          <p class="note">Kiểm: $00000101 + 11111011 = 1\,00000000$ — bỏ bit thứ 9 tràn ra, còn $00000000$ ✓ Vậy $x$ cộng số bù 2 của nó bằng 0.</p>
        focus: [1, 2, 2, 3, 3]
        say: "Viết âm 5 trên 8 bit theo ba bước. Một, viết 5 là 0 0 0 0, 0 1 0 1. Hai, đảo mọi bit, 0 thành 1, 1 thành 0. Ba, cộng thêm 1, ta được 1 1 1 1, 1 0 1 1. Kiểm lại, cộng hai dãy bit này ra 1 và tám số 0, bỏ bit thứ chín tràn ra ngoài thì còn đúng 0, nên đó đúng là âm 5."
      - show: |
          <div class="box key">Đọc số có dấu: bit dấu mang giá trị $-2^{7} = -128$, các bit còn lại cộng như thường. &nbsp; $11111011 = -128 + 64 + 32 + 16 + 8 + 2 + 1 = -5$.</div>
        say: "Cách đọc nhanh một số có dấu, bit dấu mang giá trị âm 128, các bit còn lại cộng như thường. Với 1 1 1 1, 1 0 1 1, ta có âm 128 cộng 64, 32, 16, 8, 2 và 1, ra đúng âm 5."

  # ───────────────────────── 4. VÌ SAO BÙ 2 ─────────────────────────
  - id: why
    kind: concept
    title: "Vì sao máy dùng bù 2"
    checks:
      - "((-5 & 0xFF) + 3) & 0xFF == (-2 & 0xFF)"
    steps:
      - show: |
          <p>Lý do lớn nhất: <b>cùng một mạch cộng</b> dùng được cho cả số không dấu và có dấu.</p>
          <p>$-5 + 3$: $\; 11111011 + 00000011 = 11111110$, chính là $-2$ ✓ — không cần mạch trừ riêng.</p>
          <p class="note">Bù 2 cũng chỉ có <b>một</b> số 0; cách “bit dấu + độ lớn” có cả $+0$ và $-0$.</p>
        focus: [1, 1, 2, 3]
        say: "Vì sao máy dùng bù 2? Lý do lớn nhất là cùng một mạch cộng dùng được cho cả số không dấu lẫn có dấu. Ví dụ âm 5 cộng 3, cộng thẳng hai dãy bit ra 1 1 1 1, 1 1 1 0, chính là âm 2, không cần mạch trừ riêng. Bù 2 cũng chỉ có một số 0, trong khi cách dùng bit dấu cộng độ lớn có cả cộng 0 lẫn trừ 0."

  # ───────────────────────── 5. VÍ DỤ: TRÀN SỐ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Vòng số 8 bit: cộng 1 là đi một nấc"
    checks:
      - "[(u - 256 if u >= 128 else u) for u in (0, 1, 64, 127, 128, 192, 255)] == [0, 1, 64, 127, -128, -64, -1]"
      - "[format(u, '08b') for u in (0, 1, 64, 127, 128, 192, 255)] == ['00000000', '00000001', '01000000', '01111111', '10000000', '11000000', '11111111']"
    steps:
      - show: |
          <div><svg width="1500" height="440" viewBox="0 0 1500 440"><defs><marker id="arW1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><circle cx="750" cy="215" r="135" fill="none" stroke="#1f2937" stroke-width="3"/><line x1="750" y1="50" x2="750" y2="380" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/><circle cx="750" cy="80" r="9" fill="#2a78d6"/><text x="750" y="130" font-size="20" text-anchor="middle" fill="#6b7280">0</text><text x="750" y="58" font-size="24" text-anchor="middle" fill="#2a78d6"><tspan font-weight="bold">0</tspan> = 00000000</text><circle cx="827" cy="104" r="9" fill="#2a78d6"/><text x="803" y="147" font-size="20" text-anchor="middle" fill="#6b7280">1</text><text x="840" y="94" font-size="24" text-anchor="start" fill="#2a78d6"><tspan font-weight="bold">1</tspan> = 00000001</text><circle cx="885" cy="215" r="9" fill="#2a78d6"/><text x="843" y="223" font-size="20" text-anchor="middle" fill="#6b7280">64</text><text x="907" y="223" font-size="24" text-anchor="start" fill="#2a78d6"><tspan font-weight="bold">64</tspan> = 01000000</text><circle cx="813" cy="334" r="9" fill="#2a78d6"/><text x="794" y="305" font-size="20" text-anchor="middle" fill="#6b7280">127</text><text x="824" y="362" font-size="24" text-anchor="start" fill="#2a78d6"><tspan font-weight="bold">127</tspan> = 01111111</text><circle cx="687" cy="334" r="9" fill="#b91c1c"/><text x="706" y="305" font-size="20" text-anchor="middle" fill="#6b7280">128</text><text x="676" y="362" font-size="24" text-anchor="end" fill="#b91c1c"><tspan font-weight="bold">-128</tspan> = 10000000</text><circle cx="615" cy="215" r="9" fill="#b91c1c"/><text x="657" y="223" font-size="20" text-anchor="middle" fill="#6b7280">192</text><text x="593" y="223" font-size="24" text-anchor="end" fill="#b91c1c"><tspan font-weight="bold">-64</tspan> = 11000000</text><circle cx="673" cy="104" r="9" fill="#b91c1c"/><text x="697" y="147" font-size="20" text-anchor="middle" fill="#6b7280">255</text><text x="660" y="94" font-size="24" text-anchor="end" fill="#b91c1c"><tspan font-weight="bold">-1</tspan> = 11111111</text><path d="M811,351 A149,149 0 0 1 689,351" fill="none" stroke="#eb6834" stroke-width="5" marker-end="url(#arW1)"/><text x="750" y="425" font-size="24" text-anchor="middle" fill="#eb6834">127 + 1: đi một nấc qua đáy, sang -128 (tràn)</text><g font-size="24"><text x="1110" y="70" fill="#2a78d6">nửa phải: bit dấu 0</text><text x="1110" y="102" fill="#2a78d6">có dấu: 0 đến 127</text><text x="390" y="70" text-anchor="end" fill="#b91c1c">nửa trái: bit dấu 1</text><text x="390" y="102" text-anchor="end" fill="#b91c1c">có dấu: -128 đến -1</text><text x="1110" y="150" fill="#6b7280">số xám bên trong: không dấu</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này xếp 256 dãy bit thành một vòng tròn, như mặt đồng hồ, cộng 1 là đi một nấc theo chiều kim đồng hồ. Số xám bên trong là cách đọc không dấu, chạy từ 0 ở đỉnh vòng tới 255 ngay bên trái đỉnh. Chữ màu bên ngoài là cách đọc có dấu, nửa phải có bit dấu 0 nên là 0 đến 127, nửa trái có bit dấu 1 nên là âm 128 đến âm 1. Vì vậy từ 127 đi thêm một nấc qua đáy vòng sẽ sang âm 128, đó chính là tràn số."

  - id: example
    kind: example
    title: "Tràn số: kết quả vượt khỏi khoảng biểu diễn"
    checks:
      - "((127 + 1) & 0xFF) == 0b10000000 and ((127 + 1) & 0xFF) - 256 == -128"
      - "(250 + 10) & 0xFF == 4"
      - "format(200, '08b') == '11001000' and 200 - 256 == -56"
      - "int('01111111', 2) + int('00000001', 2) == int('10000000', 2) and -128 + 0 == -128"
      - "250 + 10 == 260 and format(260, 'b') == '100000100' and 260 - 256 == 4"
      - "128 + 64 + 8 == 200 and -128 + 64 + 8 == -56"
    steps:
      - show: |
          <table class="t"><tr><th></th><th colspan="8">cột (trái → phải)</th></tr>
          <tr><td>số nhớ</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td></td></tr>
          <tr><td>$127$</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr>
          <tr><td>$+1$</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td></tr>
          <tr><td>tổng</td><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr></table>
          <p><b>Bước 1.</b> $01111111 + 00000001 = 10000000$.</p>
        focus: [1, 2]
        say: "Bước một, cộng có dấu 127 với 1 theo từng cột. Cột phải nhất 1 cộng 1 viết 0 nhớ 1, số nhớ đó lan qua cả bảy số 1, nên ta được 1 và bảy số 0."
      - show: |
          <p><b>Bước 2.</b> Đọc có dấu: bit dấu mang $-128$, các bit còn lại đều 0 → $10000000 = -128 + 0 = \hl{-128}$.</p>
        say: "Bước hai, đọc kết quả theo kiểu có dấu. Bit dấu bật lên mang giá trị âm 128, các bit còn lại đều bằng 0, nên máy đọc ra âm 128."
      - clear: true
        show: |
          <p><b>Bước 3.</b> Không dấu: $250 + 10 = 260$, mà $256 \le 260$ nên cần 9 bit:</p>
          $$260 = 256 + 4 = 100000100_2$$
        focus: [1, 2]
        say: "Bước ba, sang kiểu không dấu, 250 cộng 10 bằng 260. Vì 260 không nhỏ hơn 256, nó cần tới 9 bit, viết là 1, rồi 0 0 0 0, 0 1 0 0."
      - show: |
          <p><b>Bước 4.</b> Thanh ghi chỉ giữ 8 bit thấp, bit thứ 9 (giá trị 256) bị bỏ: $260 - 256 = \hl{4}$.</p>
        say: "Bước bốn, thanh ghi chỉ có 8 bit, nên bit thứ chín mang giá trị 256 bị bỏ đi. Kết quả còn 260 trừ 256, bằng 4."
      - show: |
          <table class="t"><tr><th>Bước 5: dãy $11001000$</th><th>128</th><th>64</th><th>8</th><th>tổng</th></tr>
          <tr><td>không dấu</td><td>$+128$</td><td>$+64$</td><td>$+8$</td><td>200</td></tr>
          <tr><td>có dấu</td><td>$-128$</td><td>$+64$</td><td>$+8$</td><td>$\hl{-56}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước năm, cùng một dãy bit 1 1 0 0, 1 0 0 0 lại cho ra hai cách đọc khác nhau. Đọc không dấu, 128 cộng 64 cộng 8 bằng 200. Đọc có dấu, bit trái nhất mang âm 128, nên âm 128 cộng 64 cộng 8 bằng âm 56."
      - show: |
          <div class="box warn">Dấu hiệu tràn có dấu: cộng hai số <b>cùng dấu</b> mà kết quả <b>khác dấu</b>. Cộng hai số khác dấu thì không bao giờ tràn.</div>
        say: "Dấu hiệu nhận ra tràn có dấu, cộng hai số cùng dấu mà kết quả lại khác dấu. Còn cộng hai số khác dấu thì không bao giờ tràn, vì kết quả nằm giữa hai số đó."

  - id: verify
    kind: check
    title: "Tự kiểm: trừ 256 thay cho đọc bit dấu"
    checks:
      - "-2 ** 31 == -2147483648 and 2 ** 31 - 1 == 2147483647"
      - "128 - 256 == -128 and 200 - 256 == -56 and all((u - 256 if u >= 128 else u) == (-128 * (u >> 7) + (u & 127)) for u in range(256))"
    steps:
      - show: |
          <p>Đường khác: dãy có bit dấu 1 thì giá trị có dấu $=$ giá trị không dấu $- 256$.</p>
          <table class="t"><tr><th>dãy</th><th>không dấu</th><th>trừ 256</th><th>khớp bước 2 và 5?</th></tr>
          <tr><td>$10000000$</td><td>128</td><td>$128 - 256 = -128$</td><td>✓</td></tr>
          <tr><td>$11001000$</td><td>200</td><td>$200 - 256 = -56$</td><td>✓</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Kiểm bằng đường khác, không cộng từng bit nữa. Vì bit dấu mang âm 128 thay cho cộng 128, với mọi dãy có bit dấu bằng 1, giá trị có dấu bằng giá trị không dấu trừ đi 2 lần 128, tức trừ 256. Dãy 1 và bảy số 0 đọc không dấu là 128, trừ 256 được âm 128, khớp bước hai. Dãy của 200 trừ 256 được âm 56, khớp bước năm."
      - show: |
          <table class="t"><tr><th>cách tự kiểm</th><th>ví dụ</th></tr>
          <tr><td>Số bù 2 vừa tìm cộng với số gốc phải ra 0 (bỏ bit tràn)</td><td>$00000101 + 11111011 \to 00000000$</td></tr>
          <tr><td>Khoảng của $n$ bit có dấu: $-2^{n-1} \dots 2^{n-1} - 1$</td><td>32 bit: $-2\,147\,483\,648 \dots 2\,147\,483\,647$</td></tr>
          <tr><td>Thấy bit trái nhất là 1: hỏi ngay “đang đọc kiểu có dấu hay không dấu?”</td><td>$11001000$: 200 hay $-56$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ngoài ra còn ba cách tự kiểm, vì lỗi bù 2 thường nằm ở một trong ba chỗ này. Một, số bù 2 vừa tìm cộng với số gốc phải ra 0, sau khi bỏ bit tràn. Hai, nhớ khoảng của n bit có dấu là từ âm 2 mũ n trừ 1 đến 2 mũ n trừ 1, trừ 1, với 32 bit là khoảng âm 2 tỉ đến 2 tỉ. Ba, thấy bit trái nhất là 1 thì hỏi ngay, mình đang đọc kiểu có dấu hay không dấu."

  # ───────────────────────── 7. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    checks:
      - "-(-128) == 128 and ((-(-128 & 0xFF)) & 0xFF) == 128 and 128 - 256 == -128"
      - "-128 + 4 + 1 == -123 and int('10000101', 2) - 256 == -123"
    title: "4 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đổi dấu bằng cách chỉ lật bit dấu <b class="red">(sai)</b>
          <br><span class="note">Lật bit dấu của $00000101$ ra một số khác hẳn, không phải $-5$. Phải đảo hết rồi cộng 1.</span>
          $$10000101_2 = -128 + 4 + 1 = -123$$</div>
        say: "Lỗi thứ nhất, đổi dấu bằng cách chỉ lật bit dấu. Lật bit dấu của 5 ra âm 123 chứ không phải âm 5, phải đảo hết các bit rồi cộng 1."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tin rằng tràn số có dấu luôn “quay vòng” <b class="red">(sai)</b>
          <br><span class="note">Trong C và C++, phép tính trên số nguyên <b>có dấu</b> (như kiểu <code>int</code>) mà vượt khoảng là hành vi không xác định: trình biên dịch được phép giả định nó không xảy ra. Ví dụ <code>int8_t</code> đầu bài thật ra được tính trên <code>int</code> rồi mới cắt về 8 bit — cách cắt do trình biên dịch quy định.</span></div>
        say: "Lỗi thứ hai, tin rằng tràn số có dấu luôn quay vòng. Trong C và C++, khi một phép tính trên số nguyên có dấu vượt khỏi khoảng biểu diễn, đó là hành vi không xác định. Khi đó trình biên dịch được phép giả định nó không bao giờ xảy ra. Biến 8 bit ở đầu bài thật ra được cộng trên kiểu số nguyên thường rồi mới cắt về 8 bit, và cách cắt do từng trình biên dịch quy định."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ $-x$ luôn dương khi $x$ âm <b class="red">(sai)</b>
          <br><span class="note">Với 8 bit, $-(-128)$ không biểu diễn được: bù 2 của $10000000$ lại là $10000000 = -128$.</span></div>
        say: "Lỗi thứ ba, nghĩ đổi dấu một số âm luôn ra số dương. Với 8 bit, đổi dấu âm 128 phải ra 128, nhưng 128 không biểu diễn được, và bù 2 của nó lại chính là âm 128."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> So sánh số có dấu với số không dấu <b class="red">(bẫy)</b>
          <br><span class="note">Trong C, so $-1$ với một số kiểu <code>unsigned int</code>: $-1$ bị đổi sang không dấu thành số rất lớn, nên “$-1 \gt$ 10 không dấu” là đúng.</span></div>
        say: "Lỗi thứ tư, so sánh số có dấu với số không dấu. Trong C, âm 1 bị đổi sang kiểu không dấu thành một số rất lớn, nên phép so sánh âm 1 lớn hơn 10 lại cho kết quả đúng."

  # ───────────────────────── 8. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "format(-12 & 0xFF, '08b') == '11110100'"
      - "((100 + 100) & 0xFF) - 256 == -56"
      - "format(12, '08b') == '00001100' and format(~12 & 0xFF, '08b') == '11110011' and -128 + 64 + 32 + 16 + 4 == -12 and 200 - 256 == -56"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Viết $-12$ trên 8 bit bù 2.</td></tr>
          <tr><td>2</td><td>$100 + 100$ với số có dấu 8 bit cho kết quả gì? Có tràn không?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, viết âm 12 trên 8 bit bù 2. Câu hai, 100 cộng 100 với số có dấu 8 bit cho kết quả gì, có tràn không? Dừng video và làm ra giấy."
        pause: 8
      - show: |
          <table class="t"><tr><th>bước</th><th>dãy bit</th></tr>
          <tr><td>$12 = 8 + 4$</td><td>$00001100$</td></tr>
          <tr><td>đảo mọi bit</td><td>$11110011$</td></tr>
          <tr><td>cộng 1</td><td>$\hl{11110100}$</td></tr></table>
          <p>Kiểm: $-128 + 64 + 32 + 16 + 4 = -12$ ✓</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Đáp án câu một, làm đúng ba bước như với âm 5. Vì 12 bằng 8 cộng 4, ta viết 0 0 0 0, 1 1 0 0. Đảo mọi bit, ta được nhóm 1 1 1 1, rồi tới nhóm 0 0 1 1. Cộng thêm 1 được 1 1 1 1, 0 1 0 0. Kiểm bằng cách đọc bit dấu, âm 128 cộng 64, 32, 16 và 4 ra đúng âm 12."
      - show: |
          <p>② $100 + 100 = 200$, mà $200 \gt 127$, số lớn nhất của 8 bit có dấu.</p>
          <p>Dãy bit $11001000$ đọc có dấu: $200 - 256 = \hl{-56}$ — <b>tràn</b> (hai số dương cho kết quả âm).</p>
        focus: [2, 1, 2, 2]
        say: "Câu hai, 200 vượt quá 127, dãy bit 1 1 0 0, 1 0 0 0 đọc có dấu là âm 56. Ở đây 200 là tổng 100 cộng 100, còn 127 là số lớn nhất của 8 bit có dấu. Đọc có dấu tức là lấy giá trị không dấu 200 trừ đi 256, ra âm 56. Đây là tràn, vì cộng hai số dương mà ra số âm."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cùng dãy bit, hai cách đọc</span><span class="a">→</span>
          <span class="n">bù 2: đảo bit, cộng 1</span><span class="a">→</span>
          <span class="n">một mạch cộng cho mọi dấu</span><span class="a">→</span>
          <span class="n">tràn: vượt khoảng thì mạch cộng quay vòng</span></div>
        say: "Tổng kết lại, cùng một dãy bit có hai cách đọc, không dấu và có dấu. Số âm viết bằng bù 2, đảo bit rồi cộng 1. Nhờ đó một mạch cộng dùng được cho mọi dấu. Khi kết quả vượt khoảng biểu diễn, mạch cộng quay vòng, gọi là tràn số."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi biến số nguyên có một khoảng giới hạn — hãy hỏi “giá trị lớn nhất có thể là bao nhiêu?” trước khi chọn kiểu.</div>
        say: "Điều cần mang theo, mỗi biến số nguyên có một khoảng giới hạn, hãy hỏi giá trị lớn nhất có thể là bao nhiêu trước khi chọn kiểu dữ liệu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>phép toán bit và phép dịch</b> — và, hoặc, hoặc loại trừ trên từng bit.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học các phép toán trên từng bit và phép dịch bit. Hẹn gặp bạn ở bài tiếp theo."
