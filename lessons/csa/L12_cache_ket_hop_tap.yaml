      stroke="#1f2937" stroke-width="2"/><text x="1020" y="200" font-size="24" text-anchor="middle" fill="#6b7280">trống</text><rect
      x="1100" y="167" width="160" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1180" y="200" font-size="24"
      text-anchor="middle" fill="#6b7280">trống</text><path d="M1380,275 L1380,75 L1020,75 L1020,92" fill="none" stroke="#b91c1c"
      stroke-width="3" marker-end="url(#arE12)"/><text x="1440" y="300" font-size="22" text-anchor="end" fill="#b91c1c">khối
      8 tới: đẩy khối cũ hơn, là 4</text><text x="940" y="340" font-size="22" fill="#15803d">0 và 4 ở chung được: lần gặp
      lại thì trúng</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình đặt cùng 4 dòng theo hai cách xếp. Bên trái là ánh xạ trực tiếp, 4 tập mỗi tập một chỗ, nên các khối 0, 4 và
      8 tranh nhau đúng một chỗ ở tập 0, còn ba tập kia bỏ trống. Bên phải là 2 tập, mỗi tập 2 chỗ, nên khối 0 và khối 4 ở
      chung được trong tập 0, gặp lại thì trúng. Hai khối trong tập được xếp theo thứ tự cũ tới mới, ở đây 0 vừa được dùng
      nên là mới nhất. Khi khối 8 tới và tập đã đầy, ta đẩy ra khối lâu nhất chưa dùng, là khối 4. Mở rộng mỗi bến đậu thành
      hai đến bốn chuồng nhỏ cạnh nhau giúp nhiều xe mang cùng biển đuôi đứng chung bình yên.
- id: example
  kind: example
  title: Mô phỏng 2 tập × 2 đường, LRU
  checks:
  - alg.cache_hits([0, 4, 0, 4, 8, 0, 4], 2, 2) == 2
  steps:
  - show: '<p><b>Bước 1.</b> 2 tập: tập $= b \bmod 2$. Khối 0, 4, 8 đều chẵn → đều vào <b>tập 0</b>, mỗi tập có 2 chỗ.</p>

      $$0 \bmod 2 = 4 \bmod 2 = 8 \bmod 2 = 0$$

      '
    focus:
    - 1
    - 2
    say: Mô phỏng với 2 tập, mỗi tập 2 đường. Bước một, vì số tập là 2, tập của khối là số dư khi chia cho 2, mà 0, 4, 8 đều
      chẵn, nên mọi khối đều vào tập 0.
  - show: '<table class="t"><tr><th>khối</th><th>kết quả</th><th>tập 0 sau đó (cũ → mới)</th></tr>

      <tr><td>0</td><td>trượt</td><td>0</td></tr>

      <tr><td>4</td><td>trượt</td><td>0, 4</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    say: Bước hai, hai lần đầu trượt vì lần đầu gặp. Khối 0 vào chỗ thứ nhất. Khối 4 vào chỗ thứ hai, lúc này tập 0 đã đầy.
  - show: '<table class="t"><tr><th>khối</th><th>kết quả</th><th>tập 0 sau đó (cũ → mới)</th></tr>

      <tr><td>0</td><td>$\hl{\text{trúng}}$</td><td>4, 0</td></tr>

      <tr><td>4</td><td>$\hl{\text{trúng}}$</td><td>0, 4</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    say: Bước ba, giờ 0 và 4 cùng ở lại được, nên hai lần sau đều trúng. Khối 0 trúng thì được chuyển về cuối, thành mới nhất.
      Rồi khối 4 trúng, lại thành mới nhất.
  - clear: true
    show: '<table class="t"><tr><th>khối</th><th>kết quả</th><th>tập 0 sau đó (cũ → mới)</th></tr>

      <tr><td>8</td><td>trượt, đẩy 0</td><td>4, 8</td></tr>

      <tr><td>0</td><td>trượt, đẩy 4</td><td>8, 0</td></tr>

      <tr><td>4</td><td>trượt, đẩy 8</td><td>0, 4</td></tr></table>

      <p>Tổng: $\hl{2}$ lần trúng, so với 0 của ánh xạ trực tiếp.</p>

      '
    focus:
    - 0
    - '1.2'
    - - '1.3'
      - '1.4'
    - 2
    say: Bước bốn, khối 8 tới, tập đầy, nên đẩy khối lâu nhất chưa dùng. Khối lâu nhất chưa dùng lúc đó là 0, vì 4 vừa được
      dùng. Sau đó 0 và 4 lại lần lượt bị đẩy nhau ra, mỗi lần đều đẩy đúng khối sắp cần. Vậy tổng cộng 2 lần trúng, so với
      0 lần của ánh xạ trực tiếp.
- id: misses
  kind: concept
  title: Ba loại trượt
  checks:
  - alg.cache_hits([0, 4, 0, 4, 8, 0, 4], 1, 4) == 4
  steps:
  - show: '<table class="t"><tr><th>loại</th><th>nguyên nhân</th><th>giảm bằng</th></tr>

      <tr><td>bắt buộc</td><td>lần đầu gặp khối</td><td>dòng lớn hơn, nạp trước</td></tr>

      <tr><td>dung lượng</td><td>dữ liệu dùng nhiều hơn sức chứa</td><td>bộ nhớ đệm lớn hơn</td></tr>

      <tr><td>xung đột</td><td>nhiều khối tranh một tập dù còn chỗ</td><td>thêm đường</td></tr></table>

      <p class="note">Cùng dãy trên, kết hợp hoàn toàn 4 dòng: 4 lần trúng — chỉ còn 3 trượt bắt buộc (khối 0, 4, 8 lần đầu).</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    say: Có ba loại trượt khi tìm trong bộ nhớ đệm. Trượt bắt buộc xảy ra lần đầu gặp một khối, giảm được bằng dòng lớn hơn
      hoặc nạp trước. Trượt do dung lượng xảy ra khi dữ liệu đang dùng nhiều hơn sức chứa, giảm được bằng bộ nhớ đệm lớn hơn.
      Trượt do xung đột xảy ra khi nhiều khối tranh một tập dù còn chỗ, giảm được bằng cách thêm đường. Với cùng dãy truy
      cập, bộ nhớ đệm kết hợp hoàn toàn 4 dòng trúng 4 lần, chỉ còn 3 lần trượt bắt buộc.
- id: tradeoff
  kind: concept
  title: Vì sao không luôn kết hợp hoàn toàn?
  steps:
  - show: '<p>Kết hợp $k$ đường phải so thẻ ở <b>$k$ dòng cùng lúc</b>: nhiều bộ so sánh hơn, tốn điện hơn, chậm hơn một chút.</p>

      <p>Bộ nhớ đệm thật thường dùng 4 đến 16 đường — đủ giảm phần lớn trượt do xung đột với chi phí vừa phải.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Vì sao không luôn dùng kết hợp hoàn toàn? Vì bộ nhớ đệm k đường phải so thẻ ở k dòng cùng một lúc, cần nhiều bộ so
      sánh hơn, tốn điện hơn và chậm hơn một chút. Bộ nhớ đệm thật thường dùng từ 4 đến 16 đường, đủ giảm phần lớn trượt do
      xung đột với chi phí vừa phải.
- id: verify
  kind: check
  title: 'Tự kiểm: so sánh ánh xạ trực tiếp, kết hợp theo tập, kết hợp hoàn toàn'
  checks:
  - alg.cache_hits([0, 4, 0, 4, 8, 0, 4], 2, 2) <= alg.cache_hits([0, 4, 0, 4, 8, 0, 4], 1, 4)
  - len(set([0, 4, 0, 4, 8, 0, 4])) == 3 and 3 + 2 == 5 and 7 - 5 == 2
  - '[alg.cache_hits([0, 4, 0, 4, 8, 0, 4], s, w) for s, w in ((4, 1), (2, 2), (1, 4))] == [0, 2, 4]'
  steps:
  - show: '<table class="t"><tr><th>đếm trượt ở 2 tập × 2 đường</th><th>số lần</th></tr>

      <tr><td>bắt buộc: số khối khác nhau là 0, 4, 8</td><td>3</td></tr>

      <tr><td>do xung đột: 3 lần cuối, khối từng có rồi bị đẩy</td><td>2</td></tr>

      <tr><td>tổng trượt; trúng $= 7 - 5$</td><td>5; $\hl{2}$ ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Kiểm bằng đường khác, ta không lần lại bảng mà đếm theo loại trượt. Trượt bắt buộc bằng số khối khác nhau trong dãy,
      là 0, 4 và 8, tức 3 lần. Trong ba lần trượt cuối, khối 8 là lần đầu gặp nên đã nằm trong 3 lần kia, còn khối 0 và 4
      từng có rồi bị đẩy, đó là 2 lần trượt do xung đột. Tổng 5 lần trượt, nên trúng là 7 trừ 5, bằng 2, khớp mô phỏng.
  - show: '<table class="t"><tr><th>cho máy mô phỏng cùng dãy</th><th>4 tập × 1 đường</th><th>2 tập × 2 đường</th><th>1 tập
      × 4 đường</th></tr>

      <tr><td>số lần trúng</td><td>0</td><td>2 ✓</td><td>4</td></tr></table>

      '
    focus:
    - 1
    - 1
    say: Cho máy mô phỏng chạy cùng dãy với cả ba cách xếp 4 dòng, ta được 0, 2 và 4 lần trúng. Số ở giữa khớp kết quả tính
      tay, và càng nhiều đường thì càng ít trượt do xung đột.
  - clear: true
    show: '<table class="t"><tr><th>phép thử nhanh</th></tr>

      <tr><td>Ghi trạng thái từng tập theo thứ tự cũ → mới sau mỗi truy cập; trúng thì chuyển khối về cuối.</td></tr>

      <tr><td>Số lần trượt bắt buộc = số khối <b>khác nhau</b> trong dãy.</td></tr>

      <tr><td>Thêm đường không làm giảm trượt bắt buộc.</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Tự kiểm bằng ba cách. Một, ghi trạng thái từng tập theo thứ tự cũ tới mới sau mỗi lần truy cập, và khi trúng thì
      chuyển khối đó về cuối. Hai, số lần trượt bắt buộc bằng số khối khác nhau trong dãy, ở đây là 3. Ba, thêm đường không
      làm giảm trượt bắt buộc, vì lần đầu gặp thì khối chưa có trong bộ nhớ đệm.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi người mới hay mắc
  checks:
  - 320 // 64 == 5 and 5 % 2 == 1 and 320 % 2 == 0
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Quên cập nhật thứ tự khi <b>trúng</b> <b class="red">(sai)</b>

      <br><span class="note">LRU tính theo lần <b>dùng</b> gần nhất, không phải lần nạp — khối vừa trúng trở thành mới nhất.</span></div>

      '
    say: Lỗi thứ nhất, quên cập nhật thứ tự khi trúng. Chính sách này tính theo lần dùng gần nhất, không phải lần nạp vào,
      nên khối vừa trúng trở thành mới nhất. Tăng số lượng ngõ quá lớn khiến phần cứng so sánh song song toàn phần tốn điện
      và chậm hẳn đi. Tăng số ngõ lên quá tám khiến tiêu hao năng lượng so sánh thẻ song song triệt tiêu lợi ích giảm trượt.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Tính tập bằng số địa chỉ thay vì số khối <b class="red">(sai)</b>

      <br><span class="note">Phải chia địa chỉ cho cỡ dòng trước, rồi mới chia lấy dư cho số tập, ví dụ dòng 64 byte, 2 tập:</span>

      $$\frac{320}{64} = 5, \quad 5 \bmod 2 = 1$$</div>

      '
    say: Lỗi thứ hai, tính tập bằng số địa chỉ thay vì số khối. Phải chia địa chỉ cho kích thước dòng trước, rồi mới chia
      lấy dư cho số tập. Dùng chiến lược vào trước ra trước thay cho lâu nhất chưa dùng đôi khi vô tình đuổi nhầm khối dữ
      liệu nóng vừa đọc. Dùng chính sách đẩy đơn giản vào trước ra trước đuổi nhầm khối dữ liệu nóng vừa mới đọc lặp đi lặp
      lại.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Nghĩ thêm đường luôn tăng tỉ lệ trúng rõ rệt <b class="red">(chưa chắc)</b>

      <br><span class="note">Khi trượt chủ yếu do dung lượng, thêm đường gần như không giúp — phải tăng dung lượng hoặc đổi
      mẫu truy cập.</span></div>

      '
    say: Lỗi thứ ba, nghĩ thêm đường luôn tăng tỉ lệ trúng rõ rệt. Khi trượt chủ yếu do dung lượng, thêm đường gần như không
      giúp, phải tăng dung lượng hoặc đổi cách truy cập dữ liệu. Quên cập nhật mốc thời gian truy cập ngay cả ở các lượt trúng
      đệm làm bảng thứ tự lâu chưa dùng bị sai lệch. Quên cập nhật dấu thời gian truy cập tại ngay các lượt trúng đệm làm
      bảng thứ tự sử dụng sai lệch.
  - show: '<div class="box warn"><b>Lỗi 4.</b> Nghĩ LRU luôn tối ưu <b class="red">(sai)</b>

      <br><span class="note">Duyệt vòng một mảng lớn hơn bộ nhớ đệm một chút: LRU luôn đẩy ra đúng khối sắp cần — trượt mọi
      lần.</span></div>

      '
    say: Lỗi thứ tư, nghĩ chính sách này luôn tối ưu. Khi duyệt vòng một mảng lớn hơn bộ nhớ đệm một chút, nó luôn đẩy ra
      đúng khối sắp cần đến, nên trượt mọi lần. Không cân bằng giữa chi phí tăng ngõ kết hợp và tăng trực tiếp kích thước
      tổng thể bộ nhớ đệm cấp thấp hơn. Không đo tách biệt ba dạng trượt nguội, trượt dung lượng và trượt xung đột trước khi
      tăng ngõ kết hợp.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.cache_hits([0, 2, 4, 0, 2, 4], 2, 2) == 0 and alg.cache_hits([0, 2, 4, 0, 2, 4], 1, 3) == 3
  - '[b % 2 for b in (0, 2, 4)] == [0, 0, 0] and len(set([0, 2, 4, 0, 2, 4])) == 3 and 6 - 3 == 3'
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Bộ nhớ đệm 2 tập × 2 đường, LRU, dãy khối $0, 2, 4, 0, 2, 4$: bao nhiêu lần trúng?</td></tr>

      <tr><td>2</td><td>Nếu là kết hợp hoàn toàn 3 dòng thì sao?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, bộ nhớ đệm 2 tập 2 đường, thay khối lâu nhất chưa dùng, với dãy khối 0, 2,
      4, 0, 2, 4, có bao nhiêu lần trúng? Câu hai, nếu là kết hợp hoàn toàn 3 dòng thì sao? Dừng video và làm ra giấy.
    pause: 10
  - show: '<table class="t"><tr><th>khối</th><th>0</th><th>2</th><th>4</th><th>0</th><th>2</th><th>4</th></tr>

      <tr><td>kết quả</td><td>trượt</td><td>trượt</td><td>trượt, đẩy 0</td><td>trượt, đẩy 2</td><td>trượt, đẩy 4</td><td>trượt,
      đẩy 0</td></tr>

      <tr><td>tập 0 (cũ → mới)</td><td>0</td><td>0, 2</td><td>2, 4</td><td>4, 0</td><td>0, 2</td><td>2, 4</td></tr></table>

      <p>① $\hl{0}$ lần trúng.</p>

      '
    focus:
    - 0
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một, cả ba khối đều chẵn nên vào cùng tập 0, mà tập chỉ có 2 chỗ. Lần theo bảng, khối 4 tới thì đẩy 0,
      khối 0 quay lại thì đẩy 2, cứ thế mãi. Mỗi lần đều đẩy ra đúng khối sắp cần, nên 0 lần trúng. Đây chính là kiểu duyệt
      vòng làm chính sách này thua, như lỗi thứ tư. Theo dõi bảng trạng thái hai ngõ trong từng tập sau mỗi lệnh truy cập
      xác định đúng số lượt trúng trượt cuối cùng.
  - show: '<table class="t"><tr><th>kết hợp hoàn toàn 3 dòng</th><th>số lần</th></tr>

      <tr><td>trượt bắt buộc: 0, 2, 4 lần đầu</td><td>3</td></tr>

      <tr><td>3 lần sau: cả ba khối vẫn còn</td><td>$\hl{3}$ trúng</td></tr></table>

      '
    focus:
    - '1.2'
    - '1.3'
    say: Câu hai, ba lần đầu là trượt bắt buộc, không cách xếp nào tránh được. Sau đó 3 dòng giữ được cả ba khối, nên 3 lần
      truy cập sau đều trúng.
