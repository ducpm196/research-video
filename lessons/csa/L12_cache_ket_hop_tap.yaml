    say: Gợi ý cài đặt bài số 12 chia thành ba bước rõ ràng. Đầu tiên mô phỏng ánh xạ trực tiếp một ngăn rồi mô phỏng kết
      hợp hai đường đẩy khối lâu chưa dùng. Cuối cùng xuất lượt trúng trượt cả hai cấu hình cùng thứ tự thẻ cuối trong tập
