scenes:
- id: hook
  kind: hook
  title: Còn chỗ trống mà vẫn trượt
  checks:
  - alg.cache_hits([0, 4, 0, 4, 8, 0, 4], 4, 1) == 0
  steps:
  - show: '<p>Bộ nhớ đệm ánh xạ trực tiếp 4 dòng, dãy khối $0, 4, 0, 4, 8, 0, 4$. Khối nào cũng rơi vào dòng 0 (vì chia 4
      dư 0).</p>

      <p>Kết quả: <b>0 lần trúng</b> trong 7 lần truy cập — trong khi 3 dòng kia bỏ trống.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, một bộ nhớ đệm ánh xạ trực tiếp có 4 dòng, và chương trình truy cập dãy khối 0, 4, 0, 4, 8, 0, 4. Khối
      nào chia 4 cũng dư 0, nên tất cả tranh nhau dòng 0. Kết quả là 0 lần trúng trong 7 lần truy cập, trong khi ba dòng kia
      bỏ trống. Cho phép mỗi tập chỉ số chứa nhiều ngõ song song lập tức xoá sạch lỗi hai biến đẩy nhau qua lại ở ánh xạ trực
      tiếp.
  - show: '<div class="box key">Cách chữa: cho mỗi khối được chọn <b>vài</b> chỗ. Hôm nay: bộ nhớ đệm kết hợp theo tập và
      cách chọn khối để thay.</div>

      '
    say: Cách chữa là cho mỗi khối được chọn vài chỗ thay vì một. Hôm nay ta học bộ nhớ đệm kết hợp theo tập, và cách chọn
      khối nào để thay ra. Kết hợp tổ chức tập kết hợp với chính sách đuổi dữ liệu ít dùng nhất gần đây tối đa hoá độ trúng
      bộ nhớ đệm.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: chia lấy dư, và khối rơi vào dòng nào'
  checks:
  - divmod(8, 4) == (2, 0) and divmod(5, 2) == (2, 1) and divmod(6, 4) == (1, 2)
  - '[b % 4 for b in (0, 4, 8)] == [0, 0, 0] and 320 // 64 == 5'
  steps:
  - show: '<table class="t"><tr><th>phép chia</th><th>thương</th><th>dư</th></tr>

      <tr><td>8 chia 4</td><td>2</td><td>0</td></tr>

      <tr><td>5 chia 2</td><td>2</td><td>1</td></tr>

      <tr><td>6 chia 4</td><td>1</td><td>2</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Trước hết, ôn phép chia lấy dư, phép tính dùng suốt bài này. Tám chia 4 được 2, dư 0. Năm chia 2 được 2, dư 1. Sáu
      chia 4 được 1, dư 2. Mỗi tập gồm hai đến tám ngõ giữ số lượng mạch so sánh thẻ đồng thời nhỏ gọn mà linh hoạt cực cao.
  - show: '<table class="t"><tr><th>khối</th><th>0</th><th>4</th><th>8</th></tr>

      <tr><td>dư khi chia 4 = dòng</td><td>0</td><td>0</td><td>0</td></tr></table>

      <p>Khối = địa chỉ chia cỡ dòng, ví dụ địa chỉ 320 với dòng 64 byte là khối $\frac{320}{64} = 5$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Ở bài 11, bộ nhớ đệm ánh xạ trực tiếp đặt mỗi khối vào đúng một dòng, theo phần chỉ số của địa chỉ. Với 4 dòng, điều
      đó đúng bằng số dư khi chia số khối cho 4, nên các khối 0, 4 và 8 đều rơi vào dòng 0. Nhắc lại, số khối là địa chỉ chia
      cho kích thước dòng, ví dụ địa chỉ 320 với dòng 64 byte là khối 5. Khi tập đầy ngõ, chính sách thay thế chọn đẩy khối
      nằm im lâu nhất mà không có truy cập nào chạm tới.
- id: sym
  kind: symbol
  title: 'Giải mã: tập, đường, LRU'
  checks:
  - 4 // 2 == 2
  steps:
  - show: '<p><b>Kết hợp $k$ đường</b>: các dòng gom thành <b>tập</b>, mỗi tập $k$ dòng. Khối $b$ vào tập số $b \bmod (\text{số
      tập})$, ở <b>bất kỳ</b> dòng nào trong tập.</p>

      <p>4 dòng có thể xếp: 4 tập × 1 đường (ánh xạ trực tiếp), 2 tập × 2 đường, hoặc 1 tập × 4 đường (kết hợp hoàn toàn).</p>

      <p><b>LRU</b> (viết tắt tiếng Anh “least recently used”, ít được dùng gần đây nhất): khi tập đầy, đẩy ra khối <b>lâu
      nhất chưa được dùng</b>.</p>

      '
    introduces:
    - mod
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    say: 'Với kết hợp k đường, các dòng được gom thành các tập, mỗi tập có k dòng. Khối b vào tập có số bằng b chia lấy dư
      cho số tập, và được ở bất kỳ dòng nào trong tập đó. Bốn dòng có thể xếp thành 4 tập 1 đường, tức ánh xạ trực tiếp, hoặc
      2 tập 2 đường, hoặc 1 tập 4 đường, gọi là kết hợp hoàn toàn. Khi tập đầy, chính sách thay thế khối lâu nhất chưa dùng
      sẽ đẩy ra khối đã lâu nhất không được truy cập. Phân biệt rạch ròi ba nguyên nhân trượt đệm: nạp nguội lần đầu, vượt
      dung lượng đệm và va chạm trùng tập.'
