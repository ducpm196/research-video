- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">tập: khối được chọn $k$ chỗ</span><span class="a">→</span>

      <span class="n">LRU: đẩy khối lâu nhất chưa dùng</span><span class="a">→</span>

      <span class="n">bắt buộc, dung lượng, xung đột</span><span class="a">→</span>

      <span class="n">thêm đường chỉ chữa xung đột</span></div>

      '
    say: Tổng kết lại, bộ nhớ đệm kết hợp theo tập cho mỗi khối được chọn k chỗ trong tập của nó. Khi đầy, đẩy ra khối lâu
      nhất chưa dùng. Có ba loại trượt, bắt buộc, dung lượng và xung đột, và thêm đường chỉ chữa được trượt do xung đột. Bộ
      nhớ đệm kết hợp theo tập kết hợp lâu nhất chưa dùng đạt điểm ngọt tuyệt vời về hiệu năng và chi phí. Bộ đệm tập hợp
      nhiều ngõ kết hợp thay thế ít dùng nhất gần đây cân bằng tuyệt vời giữa tốc độ và tỉ lệ trúng.
  - show: '<div class="box key"><b>Tư duy:</b> cùng một ý “chọn cái gì để bỏ khi đầy” quay lại ở thay trang của hệ điều hành
      (chọn vùng nhớ nào đẩy ra đĩa khi bộ nhớ chính đầy) và bộ nhớ đệm của trình duyệt, cơ sở dữ liệu.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Điều cần mang theo, câu hỏi chọn cái gì để bỏ khi đầy sẽ quay lại nhiều lần. Ta gặp nó ở việc thay trang của hệ điều
      hành, tức chọn vùng nhớ nào đẩy ra đĩa khi bộ nhớ chính đầy, và ở bộ nhớ đệm của trình duyệt hay cơ sở dữ liệu. Hiểu
      rành mạch ba loại trượt đệm giúp chẩn đoán đúng liệu ứng dụng thiếu dung lượng hay chỉ đụng địa chỉ. Nâng từ ánh xạ
      trực tiếp lên bốn ngõ theo tập xoá bỏ gần hết xung đột trên dữ liệu mảng song song.
  - clear: true
    show: '<p class="note">Bài sau (bài 13): <b>định luật Amdahl</b> — giới hạn của việc chạy song song.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 13, ta học giới hạn của việc chạy song song trên nhiều lõi. Hẹn gặp bạn ở bài tiếp theo.
