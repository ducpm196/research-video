      (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 12 với dữ liệu đọc động. Đọc kỹ số bit dịch và chuỗi địa chỉ từ đầu vào chuẩn rồi chạy
      lệnh tự chấm cùng hai ca kiểm ẩn. Chạy mô phỏng ánh xạ trực tiếp một ngăn và kết hợp hai đường đẩy khối lâu nhất chưa
      dùng trên cùng một tập. In lượt trúng trượt của cả hai phương án cùng thứ tự hai thẻ cuối cùng nằm trong bộ nhớ đệm.
