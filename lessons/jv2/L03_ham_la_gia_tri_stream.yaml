- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>hàm là giá trị: x -> …</span><span
      class=''a''>→</span><span class=''n''>tham chiếu hàm: Lop::ham</span><span class=''a''>→</span><span
      class=''n''>đường ống: nguồn → bước giữa → bước cuối</span><span class=''a''>→</span><span
      class=''n''>bước cuối mới chạy</span><span class=''a''>→</span><span class=''n''>mỗi
      phần tử đi hết các trạm</span><span class=''a''>→</span><span class=''n''>nguồn
      lười thì đường ống lười</span></div>'
    say: Tổng kết chuỗi logic. Hàm là một giá trị, viết gọn bằng mũi tên. Tham chiếu
      hàm là cách viết tắt. Đường ống gồm nguồn, các bước giữa và bước cuối. Chỉ bước
      cuối mới làm đường ống chạy. Mỗi phần tử đi hết các trạm rồi mới tới phần tử
      sau. Và đường ống chỉ lười khi nguồn của nó lười.
  - show: '<div class=''box key''><b>Tư duy:</b> khi viết đường ống, hỏi: <b>nguồn</b>
      nằm hết trong bộ nhớ không, <b>khoá</b> có thể trùng không, đường ống có <b>bước
      cuối</b> không,

      và hàm ngắn có đang <b>sửa biến bên ngoài</b> không. Vòng lặp vẫn tốt khi cần
      kiểm soát từng bước.</div>

      '
    say: Điều cần mang theo. Khi viết đường ống, hãy hỏi bốn câu. Nguồn có nằm hết
      trong bộ nhớ không. Khoá có thể trùng không. Đường ống có bước cuối không. Và
      hàm ngắn có đang sửa biến bên ngoài không. Vòng lặp vẫn tốt khi cần kiểm soát
      từng bước.
