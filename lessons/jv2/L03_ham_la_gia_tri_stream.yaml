scenes:
- id: hook
  kind: hook
  title: Mười dòng vòng lặp, hay một dòng nói điều mình muốn?
  steps:
  - show: '<div class="code"><div><span class="kw">long</span> lon = 0;</div><div>Map&lt;String,
      Long&gt; tong = <span class="kw">new</span> TreeMap&lt;&gt;();</div><div><span
      class="kw">for</span> (GiaoDich g : ds) {</div><div>    <span class="kw">if</span>
      (g.soTien() &gt;= 1000000) {</div><div>        lon += g.soTien();</div><div>    }</div><div>    tong.put(g.loai(),
      tong.getOrDefault(g.loai(), 0L) + g.soTien());</div><div>}</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>4700000</div><div>{chuyen=1550000, nap=4400000,
      rut=1500000}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ở bài trước, ta thống kê giao dịch bằng vòng lặp. Vòng lặp nói máy phải làm
      thế nào, mở một biến tổng, duyệt từng phần tử, kiểm điều kiện, cộng dồn. Mười
      dòng, ba chỗ dễ lỗi, và đọc xong vẫn phải đoán mục đích. Kết quả là tổng các
      giao dịch từ một triệu trở lên, và tổng theo từng loại.
  - show: <div class="code"><div><span class="kw">long</span> lon = ds.stream().filter(g
      -&gt; g.soTien() &gt;= 1000000).mapToLong(GiaoDich::soTien).sum();</div><div>Map&lt;String,
      Long&gt; tong = ds.stream().collect(</div><div>        Collectors.groupingBy(GiaoDich::loai,
      TreeMap::<span class="kw">new</span>, Collectors.summingLong(GiaoDich::soTien)));</div></div>
    clear: true
    say: Cùng việc đó, cách kể mục đích gọn hơn nhiều. Lọc ra giao dịch từ một triệu,
      đổi sang số tiền, cộng lại. Gom các giao dịch theo loại rồi cộng tiền của từng
      loại. Dòng nào nói đúng điều mình muốn, và đây là đường ống, kiểu viết thống
      trị trong mã Java hiện đại.
  - show: '<div class="box key">Hôm nay: <b>hàm là một giá trị</b> có thể truyền đi
      (hàm ngắn không tên, tham chiếu hàm), và <b>đường ống Stream</b> lọc, biến đổi,
      gom nhóm.

      Kèm câu hỏi của người làm nghề: đường ống chạy <b>khi nào</b>, và với tệp lớn
      gấp một nghìn lần thì còn chạy nổi không?</div>

      '
    clear: true
    say: Hôm nay ta học hàm là một giá trị có thể truyền đi, và đường ống để lọc,
      biến đổi, gom nhóm. Kèm câu hỏi của người làm nghề, đường ống chạy khi nào,
      và với tệp lớn gấp một nghìn lần thì còn chạy nổi không.
- id: prereq
  kind: prereq
  title: 'Ôn lại: giao diện, bộ so sánh và bản đồ'
  steps:
  - show: <table class='t'><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      giao diện</td><td>một giao diện đòi các hàm; lớp cài hết thì dùng được, ví dụ
      bộ so sánh có <code>compare(a, b)</code></td></tr><tr><td>② bản ghi</td><td><code>record
      GiaoDich(int ma, String loai, long soTien)</code> có sẵn <code>loai()</code>,
      <code>soTien()</code></td></tr><tr><td>③ bản đồ</td><td><code>TreeMap</code>
      giữ khoá theo thứ tự; <code>getOrDefault</code> cộng dồn theo khoá</td></tr><tr><td>④
      đọc từng dòng</td><td>mở tệp trong khối có tài nguyên và chỉ giữ một dòng mỗi
      lúc</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Giao diện đòi một số hàm, lớp cài đủ thì dùng được, như
      bộ so sánh đòi hàm so sánh. Bản ghi tự có các hàm đọc theo tên trường. Bản đồ
      có thứ tự giữ khoá theo thứ tự chữ cái, và hàm lấy mặc định giúp cộng dồn. Cuối
      cùng, tệp lớn phải đọc từng dòng trong khối có tài nguyên, mỗi lúc chỉ giữ một
      dòng.
- id: sym
  kind: symbol
  title: Giải mã tám ký hiệu của hàm ngắn và đường ống
  checks:
  - 2500000 > 1000000
  - not (800000 > 1000000)
  - 2500000 // 1000 == 2500
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>so
      -&gt; so &gt; 1000000</code></td><td><b>hàm ngắn không tên</b>: bên trái mũi
      tên là tham số, bên phải là kết quả trả về</td></tr><tr><td><code>Predicate&lt;Long&gt;</code></td><td>giao
      diện của hàm nhận một giá trị, trả <b>đúng/sai</b>; gọi bằng <code>.test(x)</code></td></tr><tr><td><code>Function&lt;A,
      B&gt;</code></td><td>giao diện của hàm nhận <code>A</code>, trả <code>B</code>;
      gọi bằng <code>.apply(x)</code></td></tr><tr><td><code>GiaoDich::soTien</code></td><td><b>tham
      chiếu hàm</b>: cách viết tắt của <code>g -&gt; g.soTien()</code></td></tr><tr><td><code>ds.stream()</code></td><td>mở
      một <b>đường ống</b> (Stream) đi qua từng phần tử của danh sách</td></tr><tr><td><code>filter</code>
      / <code>map</code></td><td>bước giữa: giữ phần tử thoả điều kiện / đổi mỗi phần
      tử thành giá trị khác</td></tr><tr><td><code>sum</code> / <code>collect</code>
      / <code>toList</code></td><td>bước <b>cuối</b>: lấy kết quả ra; không có bước
      cuối thì đường ống <b>không chạy</b></td></tr><tr><td><code>groupingBy(khoá,
      …)</code></td><td>gom các phần tử cùng khoá vào một nhóm, rồi tính tiếp trong
      từng nhóm</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    say: Bảng này có tám thứ. Hàm ngắn không tên có tham số bên trái mũi tên và kết
      quả bên phải. Hai giao diện hay dùng nhất là hàm trả đúng sai, và hàm biến đổi
      từ kiểu này sang kiểu kia. Tham chiếu hàm là cách viết tắt của hàm ngắn chỉ
      gọi một hàm có sẵn. Mở đường ống từ danh sách. Bước giữa như lọc và biến đổi
      chỉ khai báo việc cần làm. Bước cuối mới lấy kết quả, và nếu không có bước cuối
      thì đường ống không chạy. Cuối cùng là gom nhóm theo khoá.
  - show: <div class="code"><div>Predicate&lt;Long&gt; lon = so -&gt; so &gt; 1000000;      <span
      class="cm">// nhận một số, trả đúng hoặc sai</span></div><div>Function&lt;Long,
      Long&gt; phi = so -&gt; so / 1000;    <span class="cm">// nhận số tiền, trả
      phí</span></div><div>System.out.println(lon.test(2500000L));</div><div>System.out.println(lon.test(800000L));</div><div>System.out.println(phi.apply(2500000L));</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>true</div><div>false</div><div>2500</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Ta thử ngay. Hàm thứ nhất nhận một số, trả đúng nếu lớn hơn một triệu. Hàm
      thứ hai nhận số tiền, chia một nghìn để ra phí. Hai triệu rưỡi thì đúng, tám
      trăm nghìn thì sai, và phí của hai triệu rưỡi là hai nghìn năm trăm. Cả hai
      hàm đều là giá trị nằm trong một biến, ta có thể truyền chúng cho hàm khác.
- id: intuition
  kind: intuition
  title: 'Hình dung: băng chuyền, mỗi phần tử đi hết các trạm'
  steps:
  - show: <div><svg width="1500" height="330" viewBox="0 0 1500 330" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="120" width="220" height="90" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3"/><text x="130.0" y="157" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">danh sách</text><text x="130.0" y="189" font-size="24"
      text-anchor="middle" fill="#1f2937">8 giao dịch</text><line x1="245" y1="165"
      x2="330" y2="165" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="335" y="120" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6"
