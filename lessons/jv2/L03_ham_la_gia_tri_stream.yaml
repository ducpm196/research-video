      x2="665" y2="165" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="670" y="120" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="790.0" y="157" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">mapToLong</text><text x="790.0" y="189" font-size="24"
      text-anchor="middle" fill="#1f2937">lấy số tiền</text><line x1="915" y1="165"
      x2="1000" y2="165" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="1005" y="120" width="220" height="90" rx="10" fill="#dcfce7" stroke="#16a34a"
      stroke-width="3"/><text x="1115.0" y="157" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">sum</text><text x="1115.0" y="189" font-size="24"
      text-anchor="middle" fill="#1f2937">BƯỚC CUỐI</text><line x1="1230" y1="165"
      x2="1300" y2="165" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="1305" y="120" width="180" height="90" rx="10" fill="#fef3c7" stroke="#d97706"
      stroke-width="3"/><text x="1395.0" y="157" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">4 700 000</text><text x="1395.0" y="189" font-size="24"
      text-anchor="middle" fill="#1f2937">kết quả</text><text x="750" y="60" font-size="28"
      text-anchor="middle" fill="#1f2937" font-weight="bold">mỗi phần tử đi hết các
      trạm rồi mới tới phần tử sau</text><text x="750" y="290" font-size="26" text-anchor="middle"
      fill="#dc2626" font-weight="bold">không có trạm cuối thì băng chuyền không chạy</text></svg></div>
    clear: true
    say: Hình dung đường ống như một băng chuyền. Phần tử đi qua trạm lọc, rồi trạm
      biến đổi, rồi tới trạm cuối để lấy kết quả. Điều quan trọng là mỗi phần tử đi
      hết các trạm rồi mới tới phần tử sau, chứ không phải trạm một xử lý hết rồi
      mới sang trạm hai. Và nếu không có trạm cuối thì băng chuyền không bao giờ chạy.
  - show: <div class="code"><div>Stream&lt;Integer&gt; s = List.of(1, 2, 3, 4).stream()</div><div>        .filter(x
      -&gt; { System.out.println("loc " + x); <span class="kw">return</span> x % 2
      == 0; })</div><div>        .map(x -&gt; { System.out.println("nhan " + x); <span
      class="kw">return</span> x * 10; });</div><div>System.out.println("chua chay
      gi");</div><div>System.out.println(s.toList());</div></div>
    clear: true
    say: Ta kiểm tra bằng cách cho mỗi trạm in một dòng. Danh sách một, hai, ba, bốn.
      Trạm lọc giữ số chẵn, trạm biến đổi nhân mười. Ta in ra dòng chưa chạy gì trước
      khi gọi bước cuối, để xem đường ống thực sự bắt đầu lúc nào.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>chua chay gi</div><div>loc
      1</div><div>loc 2</div><div>nhan 2</div><div>loc 3</div><div>loc 4</div><div>nhan
      4</div><div>[20, 40]</div></div><p class=''note''>Dòng "chua chay gi" in <b>trước</b>
      mọi dòng "loc"; rồi từng phần tử đi hết các trạm: 1 bị loại ngay, 2 đi tiếp
      tới "nhan".</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Kết quả thật. Dòng chưa chạy gì xuất hiện trước tiên, nghĩa là hai trạm đầu
      chỉ khai báo. Khi gọi bước cuối, phần tử một vào trạm lọc và bị loại, phần tử
      hai qua lọc rồi qua trạm biến đổi, rồi mới tới phần tử ba. Kết quả cuối là hai
      mươi và bốn mươi.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ vòng lặp sang đường ống'
  checks:
  - 2000000 + 1500000 + 900000 == 4400000
  steps:
  - show: '<div class="code"><div><span class="kw">long</span> lon = 0;</div><div>Map&lt;String,
      Long&gt; tong = <span class="kw">new</span> TreeMap&lt;&gt;();</div><div><span
      class="kw">for</span> (GiaoDich g : ds) {</div><div>    <span class="kw">if</span>
      (g.soTien() &gt;= 1000000) {</div><div>        lon += g.soTien();</div><div>    }</div><div>    tong.put(g.loai(),
      tong.getOrDefault(g.loai(), 0L) + g.soTien());</div><div>}</div></div><p><b>Bước
      1.</b> Tách vòng lặp thành các <b>việc rời nhau</b>: lọc (<code>if</code>),
      lấy tiền, cộng (<code>lon +=</code>).</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, nhìn vào vòng lặp và tách thành những việc rời nhau. Lệnh rẽ nhánh
      là việc lọc, lấy số tiền là việc biến đổi, phép cộng dồn là việc gom lại thành
      một số. Ba việc lẫn trong một khối nên ta khó thấy từng việc.
  - show: '<p><b>Bước 2.</b> Mỗi việc thành một trạm, nối bằng dấu chấm:</p>

      <p><code>if (g.soTien() &gt;= 1000000)</code> &rarr; <code>.filter(g -&gt; g.soTien()
      &gt;= 1000000)</code></p>

      <p><code>lon += g.soTien()</code> &rarr; <code>.mapToLong(GiaoDich::soTien).sum()</code></p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước hai, mỗi việc thành một trạm. Điều kiện của lệnh rẽ nhánh trở thành
      hàm ngắn đưa cho trạm lọc. Phép cộng dồn trở thành trạm lấy số tiền rồi trạm
      cộng. Biến tổng và vòng lặp biến mất, vì đường ống tự lo.
  - show: '<p><b>Bước 3.</b> Gom nhóm: <code>groupingBy(khoá, bộ-gom-trong-nhóm)</code>.
      Với khoá = loại, bộ gom = <code>summingLong(soTien)</code>:</p>

      <p><code>tong.put(loai, tong.getOrDefault(loai, 0L) + soTien)</code> &harr;
      <code>groupingBy(GiaoDich::loai, …, summingLong(GiaoDich::soTien))</code></p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước ba, gom nhóm. Dòng cộng dồn theo khoá bằng bản đồ chính là việc mà hàm
      gom nhóm làm thay. Khoá là loại giao dịch, còn cách gom trong nhóm là cộng số
      tiền. Hai cách viết cho cùng một kết quả.
  - show: '<p><b>Bước 4.</b> Thử bằng số với <b>nap</b>: ba dòng <code>2 000 000</code>,
      <code>1 500 000</code>, <code>900 000</code>:</p>

      $$\text{nap} = 2\,000\,000 + 1\,500\,000 + 900\,000 = \hl{4\,400\,000}$$

      <p>Đúng bằng giá trị <code>nap=4400000</code> trong kết quả ✓</p>

      '
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn, thử bằng số với loại nạp. Có ba giao dịch nạp, hai triệu, một triệu
      rưỡi và chín trăm nghìn. Cộng lại được bốn triệu bốn trăm nghìn, nên đúng bằng
      giá trị mà đường ống sẽ in ra cho loại nạp.
- id: example
