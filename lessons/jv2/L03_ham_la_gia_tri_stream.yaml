- id: scale
  kind: concept
  title: 'Khi dữ liệu lớn gấp một nghìn lần: đường ống lười cứu bộ nhớ'
  checks:
  - 1000 * 64 == 64000
  - 1000000 * 64 == 64000000
  - 1000000000 // 1000 == 1000000
  - sum((i % 7 + 1) * 1000 for i in range(1, 1000001)) == 3999998000
  steps:
  - show: '<div class="code"><div><span class="kw">long</span>[] dem = {0};                                  <span
      class="cm">// mảng một ô: đếm số phần tử đã duyệt</span></div><div>IntStream.rangeClosed(1,
      1000000)</div><div>        .peek(i -&gt; dem[0]++)</div><div>        .filter(i
      -&gt; i % 10 == 0)</div><div>        .findFirst();                              <span
      class="cm">// dừng ngay khi thấy phần tử đầu</span></div><div>System.out.println("da
      duyet " + dem[0] + " phan tu");</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>da
      duyet 10 phan tu</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Điều đầu tiên là đường ống lười. Ta tìm phần tử đầu tiên chia hết cho mười
      trong một triệu số. Ta đếm số phần tử thực sự được duyệt bằng cách chèn một
      trạm đếm. Kết quả là chỉ mười phần tử, vì đường ống dừng ngay khi tìm được.
      Vòng lặp viết vụng có thể duyệt cả một triệu.
  - show: <p><b>Cùng một tệp một triệu dòng, bộ nhớ chỉ 32 megabyte</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>java TaoFile 1000000</div><div>da ghi 1000000
      dong</div><div><span class="cm"><span>&#36;</span> </span>java -Xmx32m DocHet</div><div>het
      bo nho</div><div><span class="cm"><span>&#36;</span> </span>java -Xmx32m ThongKeLon</div><div>{chuyen=1333332000,
      nap=1333334000, rut=1333332000}</div></div>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Điều thứ hai là kết hợp với đọc từng dòng. Ta tạo tệp một triệu dòng. Cách
      đọc hết rồi mới tạo đường ống thì hết bộ nhớ, như bài trước. Còn cách tạo đường
      ống trực tiếp từ tệp, mỗi lúc chỉ giữ một dòng, thì chạy xong, gom được ba nhóm.
      Tổng của ba nhóm vẫn đúng bằng tổng cả tệp, và không tốn thêm bộ nhớ vì số nhóm
      chỉ là ba.
  - show: '<table class=''t''><tr><th>số dòng</th><th>1 000</th><th>1 000 000</th><th>1
      000 000 000</th></tr><tr><td>bộ nhớ khi giữ mọi dòng rồi mới tạo đường ống</td><td>≈
      64 nghìn byte</td><td>≈ 64 triệu byte</td><td><b>≈ 64 tỉ byte</b></td></tr><tr><td>bộ
      nhớ khi đường ống đọc lười từ tệp</td><td>≈ một dòng</td><td>≈ một dòng</td><td>≈
      một dòng</td></tr><tr><td>thời gian đọc (tỉ lệ)</td><td>×1</td><td>×1 000</td><td><b>×1
      000 000</b></td></tr></table><p class=''note''>Đánh đổi: đường ống lười chỉ
      đi <b>một chiều, một lần</b>; cần duyệt lại thì phải đọc lại tệp. Thời gian
      vẫn tăng theo số dòng; chỉ bộ nhớ là không đổi.</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Tóm lại theo quy mô. Giữ mọi dòng thì bộ nhớ tăng theo số dòng và gãy ở khoảng
      một triệu với giới hạn nhỏ. Đọc lười thì bộ nhớ gần như không đổi. Nhưng thời
      gian vẫn tăng đều theo số dòng, một tỉ dòng vẫn tốn gấp một triệu lần một nghìn
      dòng. Đánh đổi là đường ống lười chỉ đi một chiều, một lần.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Hàm ngắn muốn sửa biến
      bên ngoài.</div><div class="code"><div><span class="kw">long</span> tong = 0;</div><div><span
      class="kw">for</span> (<span class="kw">int</span> x : List.of(1, 2, 3)) {</div><div>    Runnable
      r = () -&gt; System.out.println(tong + x);</div><div>    tong += x;</div><div>}</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div><span class="cm">error: local variables
      referenced from a lambda expression must be final or effectively final</span></div><div><span
      class="cm">            Runnable r = () -&gt; System.out.println(tong + x);…</span></div><div><span
      class="cm">                                                  ^</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất là hàm ngắn muốn sửa biến bên ngoài. Hàm ngắn chỉ được đọc biến
      cục bộ mà không đổi sau khi gán, vì hàm có thể chạy muộn, ở luồng khác, khi
      biến đã không còn. Biến tổng ở đây bị cộng thêm sau đó, nên trình biên dịch
      từ chối. Muốn gom kết quả thì dùng bước cuối của đường ống, đừng cộng vào biến
      ngoài.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Dùng lại một đường ống
      đã chạy.</div><div class="code"><div>Stream&lt;Integer&gt; s = List.of(1, 2,
      3).stream();</div><div>System.out.println(s.count());</div><div>System.out.println(s.count());                     <span
      class="cm">// dùng lại đường ống đã chạy</span></div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>3</div><div><span class="cm">Exception in thread "main" java.lang.IllegalStateException:
      stream has already been …</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai là dùng lại một đường ống đã chạy. Mỗi đường ống chỉ chạy một
      lần. Lần đếm đầu cho ra ba, lần thứ hai nổ ngoại lệ báo đường ống đã dùng. Cách
      sửa là mở đường ống mới từ danh sách mỗi lần cần.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Gom thành bản đồ
      khi khoá có thể trùng.</div><div class="code"><div>List&lt;GiaoDich&gt; ds =
      List.of(<span class="kw">new</span> GiaoDich(1, "nap", 2000000),</div><div>        <span
      class="kw">new</span> GiaoDich(2, "rut", 500000), <span class="kw">new</span>
      GiaoDich(3, "nap", 1500000));</div><div>Map&lt;String, Long&gt; m = ds.stream().collect(</div><div>        Collectors.toMap(GiaoDich::loai,
      GiaoDich::soTien));       <span class="cm">// hai dòng cùng loại nap</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div><span class="cm">Exception in thread
      "main" java.lang.IllegalStateException: Duplicate key nap (…)</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba hay gặp ở người đã đi làm. Gom danh sách thành bản đồ với khoá
      là loại giao dịch. Khi dữ liệu thử chỉ có khoá khác nhau thì chạy ngon. Đến
      ngày dữ liệu thật có hai dòng cùng loại, ngoại lệ khoá trùng làm cả đường ống
      nổ.
  - show: <div class="box key"><b>Cách sửa:</b> đưa thêm hàm hợp nhất hai giá trị
      cùng khoá (ở đây <code>Long::sum</code>).</div><div class="code"><div>Map&lt;String,
      Long&gt; m = ds.stream().collect(</div><div>        Collectors.toMap(GiaoDich::loai,
      GiaoDich::soTien, Long::sum, TreeMap::<span class="kw">new</span>));</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>{nap=3500000, rut=500000}</div></div>
    focus:
    - 1
    - 3
    clear: true
    say: Cách sửa là thêm hàm hợp nhất cho hai giá trị cùng khoá, ở đây là phép cộng.
      Hai dòng nạp được cộng lại thành ba triệu năm trăm nghìn, và không còn nổ khi
      dữ liệu có khoá trùng.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 1500000 + 3000000 + 900000 == 5400000
  - sum(x for x in [400000, 1500000, 250000, 3000000, 900000] if x >= 900000) == 5400000
  steps:
  - show: '<p><b>Đề.</b> Danh sách các số tiền: <code>[400000, 1500000, 250000, 3000000,
      900000]</code>.</p>

      <ol><li>Giá trị của <code>.stream().filter(x -&gt; x &gt;= 900000).mapToLong(x
      -&gt; x).sum()</code>?</li>

      <li>Đoạn <code>ds.stream().filter(...).map(...);</code> (không có bước cuối)
      in gì, làm gì?</li></ol>

      <p><b>Chọn A hay B?</b> Cần tổng tiền từ một tệp 30 GB. A: <code>Files.readAllLines(p).stream()…</code>.
      B: <code>Files.lines(p)…</code> trong khối có tài nguyên. Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 25
    say: Bây giờ tới phần bạn tự làm. Có năm số tiền. Hãy tính tổng các số từ chín
      trăm nghìn trở lên. Rồi nói đoạn đường ống không có bước cuối thì in ra gì và
      làm gì. Cuối cùng chọn giữa đọc hết tệp ba mươi gigabyte vào bộ nhớ rồi mới
      tạo đường ống, và tạo đường ống trực tiếp từ tệp, và nói vì sao. Hãy dừng video
      và tự làm.
  - show: <table class='t'><tr><th>câu</th><th>đáp án</th><th>vì sao</th></tr><tr><td>1</td><td><code>1500000
      + 3000000 + 900000 = 5400000</code></td><td>chỉ giữ các số ≥ 900000; 400000
      và 250000 bị loại</td></tr><tr><td>2</td><td>không in gì, không làm gì</td><td>thiếu
      bước cuối nên đường ống <b>không chạy</b></td></tr><tr><td>3</td><td><b>B</b></td><td>A
      giữ mọi dòng (≈ 64 byte × số dòng ≫ bộ nhớ); B đọc lười, mỗi lúc một dòng</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án câu một, giữ các số từ chín trăm nghìn trở lên là một triệu rưỡi,
      ba triệu và chín trăm nghìn, cộng lại được năm triệu bốn trăm nghìn. Câu hai,
      không có bước cuối thì đường ống không chạy, nên không in gì và không làm gì.
      Câu ba chọn phương án B, vì phương án A giữ mọi dòng trong bộ nhớ, còn B đọc
      lười từng dòng.
    clear: true
  - show: <div class="box key"><b>Quy tắc:</b> đường ống tiện và dễ đọc, nhưng chỉ
      <b>lười</b> khi nguồn lười. Nguồn đã nằm hết trong bộ nhớ thì đường ống không
      cứu được bộ nhớ.</div>
    say: Quy tắc rút ra. Đường ống tiện và dễ đọc, nhưng chỉ lười khi nguồn của nó
      lười. Nếu nguồn đã nằm hết trong bộ nhớ thì đường ống không cứu được bộ nhớ.
- id: practice
  kind: practice
