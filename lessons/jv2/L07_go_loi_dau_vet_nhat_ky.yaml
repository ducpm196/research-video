scenes:
- id: hook
  kind: hook
  title: 'Hai giờ sáng: chương trình dừng, màn hình chỉ có một đống dòng chữ'
  steps:
  - show: "<div class=\"code\"><div>baoCao(<span class=\"kw\">new</span> <span class=\"\
      kw\">long</span>[]{});                                 <span class=\"cm\">//\
      \ danh sách rỗng</span></div></div><p><b>Kết quả chạy</b></p><div class=\"code\"\
      ><div>Trung binh: 600000</div><div><span class=\"cm\">Exception in thread \"\
      main\" java.lang.ArithmeticException: / by zero\n\tat DauVet.chia(DauVet.java:3)\n\
      \tat DauVet.trungBinh(DauVet.java:11)\n\tat DauVet.baoCao(DauVet.java:15)\n\t\
      at DauVet.main(DauVet.java:20)</span></div></div>\n"
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Hai giờ sáng, chương trình báo cáo dừng giữa chừng và màn hình đầy những
      dòng chữ lạ. Người mới thường nhìn lướt rồi hoảng, hoặc đoán mò và sửa bừa.
      Nhưng đống chữ đó là lời khai của chương trình, chỉ ra đúng dòng nào nổ và ai
      đã gọi tới đó. Học cách đọc nó, kèm vài dụng cụ, thì phần lớn lỗi tìm ra trong
      vài phút.
  - show: '<div class="box key">Hôm nay: <b>gỡ lỗi</b>. Đọc <b>dấu vết ngăn xếp</b>
      nhiều tầng, kể cả phần <b>nguyên nhân gốc</b>; ghi <b>nhật ký</b> có mức độ;
      <b>khoanh vùng bằng chia đôi</b>;

      và dừng chương trình giữa chừng bằng <b>trình gỡ lỗi</b>. Kèm hai câu hỏi quy
      mô: nhật ký phình bao nhiêu mỗi ngày, và tìm lỗi trong một triệu bước mất mấy
      lần kiểm?</div>

      '
    clear: true
    say: Hôm nay ta học gỡ lỗi. Đọc dấu vết ngăn xếp nhiều tầng, kể cả phần nguyên
      nhân gốc. Ghi nhật ký có mức độ. Khoanh vùng bằng chia đôi. Và dừng chương trình
      giữa chừng bằng trình gỡ lỗi. Kèm hai câu hỏi quy mô, nhật ký phình bao nhiêu
      mỗi ngày, và tìm lỗi trong một triệu bước mất mấy lần kiểm.
- id: prereq
  kind: prereq
  title: 'Ôn lại: hàm gọi hàm, ngoại lệ và dòng lệnh'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      hàm gọi hàm</td><td><code>main</code> gọi <code>baoCao</code>, nó gọi <code>trungBinh</code>,
      nó gọi <code>chia</code>: mỗi lần gọi là một <b>tầng</b> mới chồng lên</td></tr><tr><td>②
      ngoại lệ</td><td><code>throw</code> làm chương trình thoát ra khỏi từng tầng
      cho tới khi có <code>catch</code> bắt; không ai bắt thì chương trình dừng</td></tr><tr><td>③
      chia nguyên</td><td><code>tong / 0</code> với số nguyên ném <code>ArithmeticException</code></td></tr><tr><td>④
      dòng lệnh</td><td><code>javac</code> biên dịch, <code>java</code> chạy, <code>|</code>
      nối đầu ra, <code>grep</code> lọc dòng có mẫu</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Hàm gọi hàm thì mỗi lần gọi là một tầng mới chồng lên
      tầng trước. Ngoại lệ làm chương trình thoát khỏi từng tầng cho tới khi có nơi
      bắt, và nếu không ai bắt thì chương trình dừng. Chia số nguyên cho không ném
      ngoại lệ số học. Và trên dòng lệnh, ta biên dịch, chạy, nối đầu ra và lọc dòng
      bằng mẫu.
- id: sym
  kind: symbol
  title: Giải mã sáu thứ của gỡ lỗi
  steps:
  - show: '<table class=''t''><tr><th>thấy</th><th>nghĩa</th></tr><tr><td><code>at
      DauVet.chia(DauVet.java:3)</code></td><td><b>một tầng</b> của ngăn xếp: hàm
      <code>chia</code> trong tệp <code>DauVet.java</code>, <b>dòng số 3</b></td></tr><tr><td>dòng
      <code>at</code> đầu tiên</td><td>nơi lỗi <b>xảy ra</b>; các dòng dưới là <b>ai
      đã gọi</b> tới đó, từ gần tới xa</td></tr><tr><td><code>Caused by: …</code></td><td><b>nguyên
      nhân gốc</b>: lỗi ban đầu bị một lỗi khác bọc lại; gốc thường nằm ở <b>cuối</b>
      dấu vết</td></tr><tr><td>mức nhật ký</td><td><code>FINE</code> &lt; <code>INFO</code>
      &lt; <code>WARNING</code> &lt; <code>SEVERE</code>: đặt ngưỡng thì mức thấp
      hơn ngưỡng bị bỏ</td></tr><tr><td>điểm dừng (breakpoint)</td><td>dòng mã mà
      trình gỡ lỗi <b>dừng chương trình</b> để bạn xem biến; <code>jdb</code> là trình
      gỡ lỗi có sẵn trong JDK</td></tr><tr><td>chia đôi (bisect)</td><td>khoanh vùng
      lỗi bằng cách <b>kiểm điểm giữa</b>, loại một nửa vùng nghi ngờ mỗi lần</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Bảng này có sáu thứ. Mỗi dòng chữ có từ at là một tầng của ngăn xếp, cho
      biết hàm, tệp và số dòng. Dòng đầu tiên là nơi lỗi xảy ra, các dòng dưới là
      những ai đã gọi tới đó. Dòng nguyên nhân gốc cho biết lỗi ban đầu bị lỗi khác
      bọc lại. Mức nhật ký có thứ tự, đặt ngưỡng thì mức thấp hơn bị bỏ. Điểm dừng
      là dòng mã nơi trình gỡ lỗi dừng chương trình để xem biến. Và chia đôi là khoanh
      vùng lỗi bằng cách kiểm điểm giữa, loại một nửa mỗi lần.
- id: intuition
  kind: intuition
  title: 'Hình dung: tháp các lần gọi, và lỗi leo từ đáy lên'
  steps:
  - show: <div><svg width="1500" height="400" viewBox="0 0 1500 400" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="40" y="20" width="520" height="62" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3"/><text x="300.0" y="60" font-size="26" text-anchor="middle"
      fill="#1f2937">main  (dòng số 20)</text><rect x="40" y="98" width="520" height="62"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="300.0" y="138"
      font-size="26" text-anchor="middle" fill="#1f2937">baoCao  (dòng số 15)</text><rect
      x="40" y="176" width="520" height="62" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="300.0" y="216" font-size="26" text-anchor="middle"
      fill="#1f2937">trungBinh  (dòng số 11)</text><rect x="40" y="254" width="520"
      height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text
      x="300.0" y="294" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">chia  (dòng
      số 3)  NỔ Ở ĐÂY</text><line x1="600" y1="285" x2="600" y2="60" stroke="#dc2626"
      stroke-width="3.5" marker-end="url(#ah)"/><text x="780" y="175" font-size="26"
      text-anchor="start" fill="#dc2626" font-weight="bold">lỗi leo ngược lên qua</text><text
      x="780" y="215" font-size="26" text-anchor="start" fill="#dc2626" font-weight="bold">từng
      tầng, tới khi có catch</text><text x="780" y="255" font-size="26" text-anchor="start"
      fill="#dc2626" font-weight="bold">(không có → chương trình dừng)</text><text
      x="300" y="370" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">dấu
      vết in từ tầng NỔ xuống tầng main</text></svg></div>
    clear: true
    say: Hình dung các lần gọi hàm như một chồng khay. Hàm chính gọi báo cáo, báo
      cáo gọi trung bình, trung bình gọi chia. Khay trên cùng, tức hàm chia, là nơi
      lỗi xảy ra. Lỗi leo ngược lên qua từng khay, và nếu không có chỗ bắt thì chương
      trình dừng. Dấu vết được in từ khay nổ xuống tới khay đáy, nên dòng đầu là hiện
      trường, các dòng sau là đường đi tới hiện trường.
  - show: '<div class="code"><div><span class="kw">if</span> (tien &gt; soDu) {</div><div>    <span
      class="kw">throw</span> <span class="kw">new</span> IllegalStateException("so
      du am: " + (soDu - tien));</div><div>}</div></div><div class="code"><div><span
      class="kw">try</span> {</div><div>    rut(soDu, tien);</div><div>} <span class="kw">catch</span>
      (IllegalStateException e) {</div><div>    <span class="kw">throw</span> <span
      class="kw">new</span> RuntimeException("chuyen tien that bai", e);     <span
      class="cm">// bọc lỗi gốc làm nguyên nhân</span></div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Phức tạp hơn là lỗi bị bọc. Hàm rút ném ngoại lệ trạng thái sai khi số dư
      không đủ. Hàm chuyển tiền bắt nó, rồi ném một lỗi khác, có thông báo thân thiện,
      và truyền lỗi gốc làm tham số thứ hai. Cách này giữ lại nguyên nhân gốc.
  - show: "<p><b>Kết quả chạy</b></p><div class=\"code\"><div><span class=\"cm\">Exception\
      \ in thread \"main\" java.lang.RuntimeException: chuyen tien that bai\n\tat\
      \ BocLoi.chuyen(BocLoi.java:12)\n\tat BocLoi.main(BocLoi.java:17)\nCaused by:\
      \ java.lang.IllegalStateException: so du am: -50\n\tat BocLoi.rut(BocLoi.java:4)\n\
      \tat BocLoi.chuyen(BocLoi.java:10)\n\t... 1 more</span></div></div><p class='note'>Dòng\
      \ trên cùng nói <b>cái gì</b> hỏng (chuyển tiền); phần <code>Caused by</code>\
      \ nói <b>vì sao</b> (số dư âm 50). Số dòng <code>10</code> và <code>4</code>\
      \ là nơi lỗi gốc thực sự bắt đầu.</p>\n"
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Kết quả thật. Dòng trên cùng nói cái gì hỏng, là việc chuyển tiền. Phần nguyên
      nhân gốc nói vì sao, là số dư sẽ âm năm mươi. Số dòng của lỗi gốc nằm trong
      phần đó, nên phải kéo xuống đọc tới hết, đừng dừng ở dòng đầu.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: đọc một dấu vết để tìm thủ phạm'
  steps:
  - show: '<p><b>Bước 1.</b> Đọc <b>dòng đầu</b>: loại lỗi và thông báo. <code>ArithmeticException:
      / by zero</code> &rarr; có <b>phép chia cho 0</b>.</p>'
    clear: true
    say: Bước một, đọc dòng đầu. Loại lỗi là ngoại lệ số học, thông báo nói chia cho
      không. Vậy ta biết có một phép chia mà mẫu số bằng không, chưa biết ở đâu.
  - show: '<p><b>Bước 2.</b> Dòng <code>at</code> <b>đầu tiên</b> chỉ <b>hàm và dòng</b>
      nổ: <code>DauVet.chia(DauVet.java:3)</code> &rarr; mở tệp, dòng số 3: <code>return
      tong / soLuong;</code>.</p><p>Vì sao đủ để biết <i>nơi nổ</i> nhưng chưa đủ
      để biết <i>nơi sai</i>: <code>chia</code> chỉ làm đúng việc của nó.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước hai, dòng đầu tiên chỉ ra hàm và số dòng nổ. Mở tệp tại dòng đó, ta
      thấy phép chia. Vì hàm chia chỉ làm đúng việc của nó, nên đây mới là nơi nổ,
      chưa chắc là nơi sai.
  - show: '<p><b>Bước 3.</b> Đi <b>xuống các dòng dưới</b> tới hàm do <b>mình viết
      và quyết định giá trị truyền vào</b>: <code>trungBinh</code> (dòng số 11) truyền
      <code>ds.length</code> làm mẫu số.</p><p>Câu hỏi: khi nào <code>ds.length =
      0</code>? &rarr; <code>baoCao</code> (dòng số 15) được gọi với <b>danh sách
      rỗng</b> từ <code>main</code> (dòng số 20).</p><table class=''t''><tr><th>tầng</th><th>quyết
      định gì</th></tr><tr><td><code>chia</code></td><td>chỉ làm phép chia</td></tr><tr><td><code>trungBinh</code></td><td><b>chọn
      mẫu số</b> = số phần tử</td></tr><tr><td><code>baoCao</code>, <code>main</code></td><td><b>chọn
      danh sách</b> đưa vào</td></tr></table>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, đi xuống các dòng dưới, tới hàm quyết định giá trị truyền vào. Hàm
      trung bình truyền độ dài danh sách làm mẫu số. Vì phép chia cho không chỉ xảy
      ra khi độ dài bằng không, nên ta hỏi khi nào điều đó xảy ra, và thấy hàm chính
      gọi báo cáo với danh sách rỗng.
  - show: '<p><b>Bước 4.</b> Sửa đúng chỗ: <b>quyết định</b> trung bình của danh sách
      rỗng là gì (ví dụ 0, hoặc báo không có dữ liệu), rồi kiểm <code>if (ds.length
      == 0)</code> ở <code>trungBinh</code>, không sửa trong <code>chia</code>.</p><p>Thử:
      danh sách rỗng &rarr; không còn chia cho 0.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước bốn, sửa đúng chỗ. Quyết định trung bình của danh sách rỗng là gì, rồi
      kiểm điều kiện đó ở hàm trung bình, không sửa trong hàm chia. Vì sao, vì quy
      tắc nghiệp vụ thuộc về hàm biết ý nghĩa của danh sách, chứ không thuộc về phép
      chia thuần.
- id: example
  kind: example
  title: 'Ví dụ: bốn tầng, hai lần gọi, một lỗi'
  checks:
  - (500000 + 700000) // 2 == 600000
  - 500000 + 700000 == 1200000
  steps:
  - show: '<div class="code"><div><span class="kw">static</span> <span class="kw">long</span>
      chia(<span class="kw">long</span> tong, <span class="kw">long</span> soLuong)
      {</div><div>    <span class="kw">return</span> tong / soLuong;                                <span
      class="cm">// nổ ở đây khi soLuong = 0</span></div><div>}</div><div> </div><div><span
      class="kw">static</span> <span class="kw">long</span> trungBinh(<span class="kw">long</span>[]
      ds) {</div><div>    <span class="kw">long</span> tong = 0;</div><div>    <span
      class="kw">for</span> (<span class="kw">long</span> x : ds) {</div><div>        tong
      += x;</div><div>    }</div><div>    <span class="kw">return</span> chia(tong,
      ds.length);</div><div>}</div></div>'
    clear: true
    say: Đây là chương trình có bốn tầng. Hàm chia thực hiện phép chia. Hàm trung
      bình cộng các số rồi gọi hàm chia với độ dài danh sách. Ta sẽ chạy hai lần,
      một lần với hai số, một lần với danh sách rỗng.
  - show: '$$① \; (500\,000 + 700\,000) / 2 = \hl{600\,000}$$<p>Lần đầu: tổng 1 200
      000, hai phần tử, trung bình 600 000.</p>$$② \; \text{danh sách rỗng}: 0 / 0
      \;\Rightarrow\; \text{không xác định}$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép làm thứ nhất, lần gọi đầu tiên có hai số, tổng một triệu hai trăm nghìn,
      trung bình sáu trăm nghìn. Phép thứ hai, danh sách rỗng thì tổng bằng không
      và độ dài bằng không, phép chia không xác định.
    introduces:
    - implies
  - show: '<div class="code"><div><span class="kw">static</span> <span class="kw">void</span>
      baoCao(<span class="kw">long</span>[] ds) {</div><div>    System.out.println("Trung
      binh: " + trungBinh(ds));</div><div>}</div><div> </div><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>    baoCao(<span class="kw">new</span> <span class="kw">long</span>[]{500000,
      700000});</div><div>    baoCao(<span class="kw">new</span> <span class="kw">long</span>[]{});                                 <span
      class="cm">// danh sách rỗng</span></div><div>}</div></div>'
    clear: true
    say: Phép thứ ba, chạy thật hai lần gọi trong hàm chính, một lần với hai số và
      một lần với danh sách rỗng.
  - show: "<p><b>Kết quả chạy</b></p><div class=\"code\"><div>Trung binh: 600000</div><div><span\
      \ class=\"cm\">Exception in thread \"main\" java.lang.ArithmeticException: /\
      \ by zero\n\tat DauVet.chia(DauVet.java:3)\n\tat DauVet.trungBinh(DauVet.java:11)\n\
      \tat DauVet.baoCao(DauVet.java:15)\n\tat DauVet.main(DauVet.java:20)</span></div></div>\n"
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Dòng đầu in sáu trăm nghìn như tính tay. Lần gọi thứ hai nổ với dấu vết bốn
      tầng. Tầng đầu là hàm chia ở dòng ba. Rồi hàm trung bình ở dòng mười một, hàm
      báo cáo ở dòng mười lăm, và hàm chính ở dòng hai mươi.
  - show: <p><b>④ Đọc ngược:</b> dòng số 20 cho thấy <b>lần gọi thứ hai</b> là lần
      nổ; <code>new long[]{}</code> là đầu vào <b>rỗng</b>.</p><p><b>⑤ Kết luận:</b>
      lỗi không nằm ở phép chia mà ở chỗ <b>chưa quyết định</b> điều gì xảy ra với
      danh sách rỗng. Dấu vết đã chỉ đường trong <b>bốn dòng</b>.</p>
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Phép thứ tư, đọc ngược. Dòng hai mươi cho thấy lần gọi thứ hai là lần nổ,
      với đầu vào rỗng. Phép thứ năm, kết luận là lỗi không nằm ở phép chia mà ở chỗ
      chưa quyết định điều gì xảy ra với danh sách rỗng. Dấu vết đã chỉ đường trong
      bốn dòng.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: dừng chương trình giữa chừng bằng trình gỡ lỗi'
  checks:
  - 100000 // 1000 == 100
  - 100000 - 100 == 99900
  steps:
  - show: '<p>Cách khác: không đoán, mà <b>dừng chương trình ở dòng số 10</b> và hỏi
      giá trị biến. Các lệnh gõ ở dấu nhắc của <code>jdb</code>:</p><table class=''t''><tr><th>lệnh</th><th>việc
      làm</th></tr><tr><td><code>stop at Loi:10</code></td><td>đặt điểm dừng ở dòng
      số 10</td></tr><tr><td><code>run</code></td><td>chạy tới điểm dừng</td></tr><tr><td><code>print
      soDu</code></td><td>in giá trị biến <code>soDu</code></td></tr><tr><td><code>next</code></td><td>chạy
      <b>đúng một dòng</b> rồi dừng lại</td></tr></table><p class=''note''>Biên dịch
      bằng <code>javac -g</code> để jdb thấy tên biến.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Cách kiểm khác là không đoán mà dừng chương trình giữa chừng. Trình gỡ lỗi
      có sẵn trong bộ công cụ cho phép đặt điểm dừng ở một dòng, chạy tới đó, rồi
      in giá trị biến. Lệnh tiếp theo chạy đúng một dòng rồi dừng lại. Ta biên dịch
      với cờ g để nó thấy tên biến.
  - show: '<p><b>Một phiên jdb (các lệnh gõ sẵn trong phien.sh; chỉ lọc ra các dòng
      chính)</b></p><div class="code"><div><span class="cm"><span>&#36;</span> </span>javac
      -g Loi.java</div><div><span class="cm"><span>&#36;</span> </span>bash phien.sh
      | tr -d ''\r'' | grep -E ''Breakpoint hit|\] +[a-zA-Z]+ = ''</div><div>Breakpoint
      hit: "thread=main", Loi.main(), line=10 bci=9</div><div>main[1]  phiThu = 100</div><div>main[1]  soDu
      = 100000</div><div>main[1]  soDu = 99900</div></div><p>Kiểm tay: phí = 100 000
      / 1 000 = <b>100</b>; số dư sau trừ phí = 100 000 − 100 = <b>99 900</b> ✓ khớp
      phiên jdb.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Phiên chạy thật cho thấy chương trình dừng ở dòng mười. Phí là một trăm,
      số dư trước dòng đó là một trăm nghìn. Sau lệnh chạy một dòng, số dư thành chín
      mươi chín nghìn chín trăm. Tính tay một trăm nghìn trừ một trăm cũng ra đúng
      chín mươi chín nghìn chín trăm. Hai cách độc lập cho cùng kết quả, nên ta tin
      vào con số.
- id: nhatky
  kind: concept
  title: 'Nhật ký: người quan sát khi bạn không có mặt'
  steps:
  - show: <div class="code"><div><span class="kw">static</span> <span class="kw">class</span>
      DinhDang <span class="kw">extends</span> Formatter {</div><div>    <span class="kw">public</span>
      String format(LogRecord r) {</div><div>        <span class="kw">return</span>
      "[" + r.getLevel() + "] " + r.getMessage() + "\n";</div><div>    }</div><div>}</div></div>
    clear: true
    say: Trên máy chủ không ai đứng gỡ lỗi, nên ta ghi nhật ký. Khác với lệnh in thường,
      nhật ký có mức độ. Ta tự định dạng mỗi dòng gồm mức và thông điệp để kết quả
      luôn giống nhau, thay vì in kèm giờ như mặc định.
  - show: '<div class="code"><div>log.setLevel(Level.INFO);                             <span
      class="cm">// chỉ INFO trở lên</span></div><div>log.fine("chi tiet: so du truoc
      = 100");</div><div>log.info("bat dau chuyen 50");</div><div>log.warning("so
      du thap: 50");</div><div>log.severe("chuyen that bai");</div><div>log.setLevel(Level.ALL);                              <span
      class="cm">// bật mọi mức</span></div><div>log.fine("chi tiet: so du sau = 50");</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>[INFO] bat dau chuyen 50</div><div>[WARNING]
      so du thap: 50</div><div>[SEVERE] chuyen that bai</div><div>[FINE] chi tiet:
      so du sau = 50</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Ta đặt ngưỡng ở mức thông tin. Dòng chi tiết bị bỏ, vì mức chi tiết thấp
      hơn ngưỡng. Ba dòng còn lại được in. Rồi ta hạ ngưỡng xuống, bật mọi mức, và
      dòng chi tiết thứ hai xuất hiện. Ở môi trường thật, ta bật mức thấp khi cần
      điều tra mà không phải sửa mã.
- id: scale
  kind: concept
  title: 'Khi hệ thống lớn dần: nhật ký phình, và lỗi nằm trong cả triệu bước'
  checks:
  - 3 * 200 * 100 * 86400 == 5184000000
  - 3 * 200 * 10000 * 86400 == 518400000000
  - 3 * 200 * 1000000 * 86400 == 51840000000000
  - 100 * 3 * 86400 == 25920000
  - 10000 * 3 * 86400 == 2592000000
  - 1000000 * 3 * 86400 == 259200000000
  - __import__('math').ceil(__import__('math').log2(16)) == 4
  - __import__('math').ceil(__import__('math').log2(1000000)) == 20
  - __import__('math').ceil(__import__('math').log2(1000000000)) == 30
  steps:
  - show: <table class='t'><tr><th>giao dịch mỗi giây</th><th>100</th><th>10 000</th><th>1
      000 000</th></tr><tr><td>nhật ký mỗi ngày (3 dòng × 200 byte mỗi giao dịch,
      số minh hoạ)</td><td>≈ 5,2 GB</td><td><b>≈ 518 GB</b></td><td><b>≈ 51,8 TB</b></td></tr><tr><td>số
      dòng mỗi ngày</td><td>≈ 26 triệu</td><td>≈ 2,6 tỉ</td><td>≈ 259 tỉ</td></tr></table><p
      class='note'>Vì thế ngưỡng mặc định là <code>INFO</code>, mức chi tiết bật khi
      cần, và không bao giờ ghi dữ liệu nhạy cảm.</p>
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Về quy mô. Giả sử mỗi giao dịch ghi ba dòng, mỗi dòng hai trăm byte, số minh
      hoạ. Một trăm giao dịch mỗi giây là hơn năm gigabyte mỗi ngày. Mười nghìn giao
      dịch mỗi giây là hơn năm trăm gigabyte. Một triệu giao dịch mỗi giây là hơn
      năm mươi nghìn gigabyte mỗi ngày. Vì thế ngưỡng mặc định là mức thông tin, mức
      chi tiết chỉ bật khi cần.
  - show: '<div class="code"><div><span class="kw">for</span> (<span class="kw">int</span>
      i = 0; i &lt; 1000000; i++) {</div><div>    log.fine("gia tri " + tinhDat());                 <span
      class="cm">// nối chuỗi chạy trước khi biết có ghi hay không</span></div><div>}</div><div>System.out.println("noi
      chuoi: " + dem + " lan tinh");</div><div>dem = 0;</div><div><span class="kw">for</span>
      (<span class="kw">int</span> i = 0; i &lt; 1000000; i++) {</div><div>    log.fine(()
      -&gt; "gia tri " + tinhDat());           <span class="cm">// hàm ngắn: chỉ chạy
      khi mức FINE bật</span></div><div>}</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>noi chuoi: 1000000 lan tinh</div><div>ham ngan: 0 lan tinh</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Còn chi phí ẩn. Dòng ghi mức chi tiết bị tắt, nhưng nếu ta nối chuỗi ngay
      trong lời gọi thì phép tính tốn kém vẫn chạy một triệu lần, vì nối chuỗi chạy
      trước khi biết có ghi hay không. Dùng hàm ngắn thì phép tính chỉ chạy khi mức
      đó bật, nên là không lần nào.
  - show: '<div class="code"><div><span class="kw">static</span> <span class="kw">boolean</span>
      ok(<span class="kw">int</span> k, <span class="kw">int</span> buocLoi) {</div><div>    soLanKiem++;</div><div>    <span
      class="kw">long</span> acc = 0;</div><div>    <span class="kw">for</span> (<span
      class="kw">int</span> i = 1; i &lt;= k; i++) {</div><div>        acc += (i ==
      buocLoi) ? 7 : 1;                    <span class="cm">// bước lỗi cộng 7 thay
      vì 1</span></div><div>    }</div><div>    <span class="kw">return</span> acc
      == k;                                      <span class="cm">// bất biến: sau
      k bước acc = k</span></div></div>'
    clear: true
    say: Câu hỏi quy mô thứ hai, lỗi nằm trong một triệu bước thì tìm thế nào. Ta
      giả lập một chuỗi bước, mỗi bước lẽ ra cộng một, nhưng có một bước lỗi cộng
      bảy. Bất biến là sau k bước thì tổng đúng bằng k.
  - show: <div class="code"><div><span class="kw">while</span> (cao - thap &gt; 1)
      {</div><div>    <span class="kw">int</span> giua = (thap + cao) / 2;</div><div>    <span
      class="kw">if</span> (ok(giua, buocLoi)) {</div><div>        thap = giua;</div><div>    }
      <span class="kw">else</span> {</div><div>        cao = giua;</div><div>    }</div><div>}</div></div>
    clear: true
    say: Ta kiểm bất biến ở điểm giữa. Đúng thì lỗi nằm sau điểm giữa, sai thì lỗi
      nằm trước hoặc ngay tại đó. Mỗi lần kiểm điểm giữa, vùng nghi ngờ giảm một nửa.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>n=16: buoc loi 11, kiem
      4 lan</div><div>n=1000000: buoc loi 711111, kiem 20 lan</div></div><table class=''t''><tr><th>số
      bước n</th><th>16</th><th>1 000 000</th><th>1 000 000 000</th></tr><tr><td>số
      lần kiểm khi chia đôi ≈ log₂ n</td><td>4</td><td>20</td><td><b>30</b></td></tr><tr><td>số
      lần kiểm khi duyệt từ đầu</td><td>tới 16</td><td>tới 1 000 000</td><td>tới 1
      000 000 000</td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Kết quả thật. Mười sáu bước cần bốn lần kiểm. Một triệu bước chỉ cần hai
      mươi lần. Một tỉ bước chỉ cần ba mươi lần, trong khi duyệt từ đầu có thể phải
      tới một tỉ lần. Lệnh chia đôi của hệ quản lý phiên bản dùng đúng ý này để tìm
      lần chốt gây lỗi, với điều kiện bất biến phải kiểm được và đơn điệu.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Nuốt lỗi: <code>catch</code>
      rồi trả giá trị mặc định.</div><div class="code"><div><span class="kw">static</span>
      <span class="kw">long</span> doc(String s) {</div><div>    <span class="kw">try</span>
      {</div><div>        <span class="kw">return</span> Long.parseLong(s);</div><div>    }
      <span class="kw">catch</span> (Exception e) {</div><div>        <span class="kw">return</span>
      0;                                         <span class="cm">// nuốt lỗi: trả
      0 như không có gì</span></div><div>    }</div><div>}</div></div><div class="code"><div><span
      class="kw">long</span> tong = doc("500000") + doc("2tr") + doc("300000");</div><div>System.out.println("Tong:
      " + tong);</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Tong:
      800000</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất là nuốt lỗi. Hàm đọc số bắt mọi ngoại lệ và trả không như chưa
      có gì xảy ra. Chuỗi hai chữ t r lẫn vào số không phải số, nhưng chương trình
      vẫn in tổng tám trăm nghìn, thiếu hai triệu mà không ai biết. Tệ hơn cả lỗi
      nổ, vì không có dấu vết nào để đọc.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Ghi dữ liệu nhạy
      cảm vào nhật ký.</div><div class="code"><div><span class="kw">static</span>
      String che(String pan) {</div><div>    <span class="kw">return</span> pan.substring(0,
      6) + "******" + pan.substring(pan.length() - 4);</div><div>}</div><div> </div><div><span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) {</div><div>    String pan = "4111111111111111";                      <span
      class="cm">// số thẻ thử nghiệm công khai</span></div><div>    System.out.println("SAI
      : thanh toan the " + pan);</div><div>    System.out.println("DUNG: thanh toan
      the " + che(pan));</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>SAI
      : thanh toan the 4111111111111111</div><div>DUNG: thanh toan the 411111******1111</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai hay gặp ở người đã đi làm. Nhật ký thường được nhiều người đọc
      và lưu rất lâu, nên ghi nguyên số thẻ là rò rỉ dữ liệu. Chuẩn bảo mật thẻ thanh
      toán chỉ cho hiển thị tối đa sáu số đầu và bốn số cuối. Hãy che phần giữa trước
      khi ghi.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Nối chuỗi trong lời
      gọi nhật ký dù mức đã tắt: phép tính vẫn chạy.</div><p><b>Kết quả chạy</b></p><div
      class="code"><div>noi chuoi: 1000000 lan tinh</div><div>ham ngan: 0 lan tinh</div></div><p
      class=''note''>Quy tắc: thông điệp tốn kém phải nằm trong <b>hàm ngắn</b> để
      chỉ tính khi mức bật.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba cũng của người đã đi làm, đã thấy ở trên. Nối chuỗi ngay trong
      lời gọi nhật ký, thì dù mức đã tắt phép tính vẫn chạy. Một triệu lần phép tính
      tốn kém cho một dòng không bao giờ được ghi. Quy tắc là đặt thông điệp tốn kém
      trong hàm ngắn.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  steps:
  - show: "<div class=\"code\"><div>Exception in thread \"main\" java.lang.IllegalStateException:\
      \ khong the huy lenh</div><div>\tat Lenh.huy(Lenh.java:30)</div><div>\tat Dich.xuLy(Dich.java:12)</div><div>\t\
      at App.main(App.java:5)</div><div>Caused by: java.lang.NullPointerException:\
      \ lenh la null</div><div>\tat Kho.tim(Kho.java:8)</div><div>\tat Lenh.huy(Lenh.java:28)</div><div>\t\
