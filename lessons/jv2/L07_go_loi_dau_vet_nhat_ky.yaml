    say: Tổng kết chuỗi logic. Dòng đầu cho biết loại lỗi. Dòng đầu tiên có chữ at
      là nơi nổ. Các dòng dưới cho biết ai đã gọi. Phần nguyên nhân gốc mới là gốc
      của lỗi. Nhật ký có mức độ và không ghi dữ liệu nhạy cảm. Và khoanh vùng bằng
      chia đôi chỉ cần chừng lôgarit cơ số hai của n lần kiểm.
