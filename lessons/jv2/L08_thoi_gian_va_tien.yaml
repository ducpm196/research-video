- id: scale
  kind: concept
  title: 'Khi số giao dịch tăng một nghìn lần: sai lệch làm tròn cộng dồn'
  checks:
  - 1000 // 2 == 500
  - 1000000 // 2 == 500000
  - 1000000000 // 2 == 500000000
  steps:
  - show: '<div class="code"><div><span class="kw">static</span> <span class="kw">void</span>
      lech(<span class="kw">int</span> n) {</div><div>    BigDecimal dung = BigDecimal.ZERO,
      len = BigDecimal.ZERO, chan = BigDecimal.ZERO;</div><div>    <span class="kw">for</span>
      (<span class="kw">int</span> i = 0; i &lt; n; i++) {</div><div>        BigDecimal
      v = <span class="kw">new</span> BigDecimal(i).add(<span class="kw">new</span>
      BigDecimal("0.5"));   <span class="cm">// phần lẻ luôn 0,5</span></div><div>        dung
      = dung.add(v);</div><div>        len = len.add(v.setScale(0, RoundingMode.HALF_UP));</div><div>        chan
      = chan.add(v.setScale(0, RoundingMode.HALF_EVEN));</div><div>    }</div><div>    System.out.println(n
      + " giao dich: lech HALF_UP " + len.subtract(dung)</div><div>            + ",
      lech HALF_EVEN " + chan.subtract(dung));</div><div>}</div></div>'
    clear: true
    say: Ta đo sai lệch cộng dồn. Mỗi giao dịch có phần lẻ đúng nửa đồng, ta so tổng
      đúng với tổng sau khi làm tròn bằng hai cách, nửa lên và nửa về số chẵn. Đây
      là trường hợp xấu nhất, nhưng nó có thật, ví dụ khi chia đôi một số lẻ.
