    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> <code>goc.multiply(…)</code> với lãi
      suất, rồi <code>.multiply(…)</code> với số ngày, rồi <code>.divide(365, 0, HALF_UP)</code>
      (chia cho <code>BigDecimal.valueOf(365)</code>).

      Thứ trong tuần: <code>den.getDayOfWeek()</code>. Lời giải: <code>labs/JV2/L08/loi_giai.java</code>
      — chỉ mở sau khi đã thử.</div>

      '
    say: Nếu kẹt, nhân gốc với lãi suất rồi với số ngày, rồi chia cho ba trăm sáu
      mươi lăm với không chữ số thập phân và kiểu làm tròn nửa lên. Thứ trong tuần
      lấy từ ngày đáo hạn. Lời giải đầy đủ nằm trong thư mục thực hành của bài, chỉ
      mở sau khi bạn đã tự thử.
