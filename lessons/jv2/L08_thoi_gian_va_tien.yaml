  steps:
  - show: '<p><b>Đề.</b> Gửi <b>50 000 000</b> đồng, lãi <b>4,8%</b> một năm, <b>40</b>
      ngày, chia cho <b>365</b> (số minh hoạ).</p>

      <ol><li>Tính lãi chính xác: <code>50 000 000 × 0,048 × 40 / 365</code>; làm
      tròn <b>HALF_UP</b> về đồng.</li>

      <li>Nếu làm tròn <b>sau mỗi bước</b> (<code>50 000 000 × 0,048</code> rồi <code>×
      40</code> rồi <code>/ 365</code>) thì có thể khác không? Vì sao tính một lần
      cuối vẫn tốt hơn?</li></ol>

      <p><b>Chọn A hay B?</b> Lưu thời điểm giao dịch cho hệ thống có khách ở nhiều
      nước. A: <code>LocalDateTime</code> (giờ địa phương không kèm múi giờ). B: <code>Instant</code>.
      Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 30
    say: Bây giờ tới phần bạn tự làm. Gửi năm mươi triệu đồng, lãi bốn phẩy tám phần
      trăm một năm, bốn mươi ngày. Hãy tính lãi chính xác rồi làm tròn nửa lên về
      đồng. Rồi nói nếu làm tròn sau mỗi bước thì có thể khác không, và vì sao làm
      tròn một lần ở cuối vẫn tốt hơn. Cuối cùng chọn giữa ngày giờ địa phương không
      múi giờ và điểm thời gian để lưu thời điểm giao dịch cho khách ở nhiều nước,
      và giải thích. Hãy dừng video và tự làm.
  - show: <table class='t'><tr><th>câu</th><th>đáp án</th><th>vì sao</th></tr><tr><td>1</td><td>50
      000 000 × 0,048 = 2 400 000; × 40 = 96 000 000; / 365 = 263 013,69… → <b>263
