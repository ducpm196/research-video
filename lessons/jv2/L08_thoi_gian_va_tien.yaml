scenes:
- id: hook
  kind: hook
  title: 'Ba triệu giao dịch nửa đồng: cuối ngày lệch một triệu rưỡi đồng'
  steps:
  - show: '<div><svg width="1500" height="300" viewBox="0 0 1500 300" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="90" width="340" height="110" rx="10" fill="#fef3c7" stroke="#d97706"
      stroke-width="3"/><text x="190.0" y="137" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">phí 2,5 đồng</text><text x="190.0" y="171"
      font-size="26" text-anchor="middle" fill="#1f2937">làm tròn → 3 đồng</text><line
      x1="365" y1="145" x2="470" y2="145" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="475" y="90" width="340" height="110" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="645.0" y="137" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">lặp 1 000 000 lần</text><text x="645.0" y="171"
      font-size="26" text-anchor="middle" fill="#1f2937">mỗi lần thừa 0,5</text><line
      x1="820" y1="145" x2="925" y2="145" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="930" y="60" width="550" height="170" rx="10" fill="#fee2e2" stroke="#dc2626"
      stroke-width="3"/><text x="1205.0" y="120" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">cuối ngày lệch 500 000 đồng</text><text x="1205.0"
      y="154" font-size="26" text-anchor="middle" fill="#1f2937">so với tổng đúng</text><text
      x="1205.0" y="188" font-size="26" text-anchor="middle" fill="#1f2937">kiểm toán
      sẽ hỏi</text><text x="750" y="275" font-size="26" text-anchor="middle" fill="#1f2937"
      font-weight="bold">tiền và thời gian: hai thứ trông đơn giản nhất, sai nhiều
      nhất</text></svg></div>'
    clear: true
    say: Một khoản phí hai đồng rưỡi, làm tròn thành ba đồng. Nửa đồng thừa, nghe
      không đáng gì. Nhưng nếu một triệu giao dịch đều có phần lẻ đúng nửa đồng và
      luôn làm tròn lên, thì cuối ngày tổng lệch năm trăm nghìn đồng so với tổng đúng.
      Kiểm toán sẽ hỏi. Tiền và thời gian là hai thứ trông đơn giản nhất mà lại sai
      nhiều nhất.
  - show: '<div class="box key">Hôm nay: <b>ngày giờ</b> (ngày, điểm thời gian, múi
      giờ, vì sao một ngày có khi chỉ 23 giờ) và <b>tiền</b> (<code>BigDecimal</code>,
      các kiểu làm tròn, định dạng theo vùng).

      Rồi bài toán lãi theo ngày, và câu hỏi quy mô: sai lệch làm tròn lớn thế nào
      khi số giao dịch tăng một nghìn lần?</div>

      '
    clear: true
    say: Hôm nay ta học ngày giờ và tiền. Ngày, điểm thời gian, múi giờ, và vì sao
      một ngày có khi chỉ hai mươi ba giờ. Rồi số thập phân chính xác, các kiểu làm
      tròn, và định dạng theo vùng. Cuối cùng là bài toán lãi theo ngày, và câu hỏi
      quy mô, sai lệch làm tròn lớn thế nào khi số giao dịch tăng một nghìn lần.
- id: prereq
  kind: prereq
  title: 'Ôn lại: số thực lệch, tiền dùng số nguyên, tên đầy đủ'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      số thực lệch</td><td><code>0.1 + 0.2</code> ra <code>0.30000000000000004</code>:
      số thực lưu <b>gần đúng</b> nhị phân</td></tr><tr><td>② tiền bằng số nguyên</td><td>tiền
      tính bằng <code>long</code> theo đồng để tránh sai số; chia nguyên <b>bỏ phần
      lẻ</b></td></tr><tr><td>③ nạp tên</td><td><code>import java.time.LocalDate;</code>
      để viết <code>LocalDate</code> thay cho tên đầy đủ</td></tr><tr><td>④ ngoại
      lệ</td><td>chuỗi sai định dạng thì <code>parse…</code> ném <code>NumberFormatException</code></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 1
    say: Ta ôn lại bốn điều. Số thực lưu gần đúng theo nhị phân, nên không phẩy một
      cộng không phẩy hai lệch một chút. Tiền nên tính bằng số nguyên theo đồng, và
      chia nguyên bỏ phần lẻ. Muốn viết tên ngắn thì nạp tên từ gói. Và chuỗi sai
      định dạng thì hàm đổi số ném ngoại lệ. Bài này đưa ra lời giải đầy đủ hơn cho
      hai điều đầu.
- id: sym
  kind: symbol
  title: Giải mã bảy thứ của ngày giờ và tiền
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>LocalDate</code></td><td><b>ngày
      lịch</b> (năm-tháng-ngày), không có giờ, không có múi giờ</td></tr><tr><td><code>Instant</code></td><td><b>một
      điểm duy nhất</b> trên trục thời gian, tính theo UTC; mọi nơi trên thế giới
      cùng đồng ý đó là lúc nào</td></tr><tr><td><code>ZonedDateTime</code></td><td><b>cách
      một nơi cụ thể đọc</b> một điểm thời gian: ngày, giờ và độ lệch múi giờ</td></tr><tr><td><code>Duration</code>
      / <code>Period</code></td><td>khoảng thời gian <b>theo giờ-giây</b> / <b>theo
      ngày-tháng-năm lịch</b></td></tr><tr><td><code>BigDecimal</code></td><td>số
      thập phân <b>chính xác</b>, dùng cho tiền; tạo từ <b>chuỗi</b>, không tạo từ
      số thực</td></tr><tr><td><code>RoundingMode</code></td><td>quy tắc làm tròn:
      <code>HALF_UP</code> (5 thì lên), <code>HALF_EVEN</code> (5 thì về số chẵn),
      <code>DOWN</code> (bỏ phần lẻ)</td></tr><tr><td><code>Locale</code></td><td>vùng
      ngôn ngữ: quy định dấu ngăn nghìn, dấu thập phân khi <b>in và đọc số</b></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    say: Bảng này có bảy thứ. Ngày lịch chỉ có năm, tháng, ngày. Điểm thời gian là
      một điểm duy nhất trên trục thời gian, mọi nơi cùng đồng ý đó là lúc nào. Ngày
      giờ có múi giờ là cách một nơi cụ thể đọc điểm đó. Khoảng thời gian có hai loại,
      theo giờ và giây, hoặc theo ngày, tháng, năm lịch. Số thập phân chính xác dùng
      cho tiền, và phải tạo từ chuỗi. Kiểu làm tròn quy định năm thì làm gì. Cuối
      cùng vùng ngôn ngữ quy định dấu ngăn nghìn và dấu thập phân khi in và đọc số.
- id: intuition
  kind: intuition
  title: 'Hình dung: một điểm thời gian, nhiều cách đọc'
  steps:
  - show: <div><svg width="1500" height="380" viewBox="0 0 1500 380" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><line
      x1="40" y1="190" x2="1460" y2="190" stroke="#475569" stroke-width="4"/><circle
      cx="740" cy="190" r="14" fill="#dc2626"/><rect x="540" y="20" width="400" height="80"
      rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="740.0" y="52"
      font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">Instant</text><text
      x="740.0" y="86" font-size="26" text-anchor="middle" fill="#1f2937">2026-03-08T07:30:00Z</text><line
      x1="740" y1="105" x2="740" y2="170" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="60" y="260" width="560" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="340.0" y="297" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">TP. Hồ Chí Minh</text><text x="340.0" y="331"
      font-size="26" text-anchor="middle" fill="#1f2937">14:30 ngày 8 tháng 3 (UTC+7)</text><rect
      x="880" y="260" width="580" height="90" rx="10" fill="#dcfce7" stroke="#16a34a"
      stroke-width="3"/><text x="1170.0" y="297" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">New York</text><text x="1170.0" y="331" font-size="26"
      text-anchor="middle" fill="#1f2937">03:30 ngày 8 tháng 3 (giờ mùa hè UTC−4)</text><line
      x1="700" y1="205" x2="340" y2="255" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><line
      x1="780" y1="205" x2="1170" y2="255" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/></svg></div>
    clear: true
    say: Hình dung một điểm thời gian là một khoảnh khắc duy nhất, chấm đỏ trên trục.
      Thành phố Hồ Chí Minh đọc nó là mười bốn giờ ba mươi. Một thành phố bên Bắc
      Mỹ đọc cùng khoảnh khắc đó là ba giờ ba mươi sáng, trong múi giờ mùa hè. Khoảnh
      khắc không đổi, chỉ cách đọc khác nhau. Vì thế hệ thống nên lưu điểm thời gian,
      và chỉ đổi sang giờ địa phương khi hiển thị.
  - show: <div class="code"><div>Instant t = Instant.parse("2026-03-08T07:30:00Z");               <span
      class="cm">// một điểm trên trục thời gian</span></div><div>System.out.println(t.atZone(ZoneId.of("Asia/Ho_Chi_Minh")));</div><div>System.out.println(t.atZone(ZoneId.of("America/New_York")));</div></div>
    clear: true
    say: Đây là đoạn mã thật. Ta tạo một điểm thời gian từ chuỗi, rồi hỏi hai múi
      giờ đọc nó thế nào.
  - show: <div class="code"><div>ZoneId ny = ZoneId.of("America/New_York");</div><div>ZonedDateTime
      a = ZonedDateTime.of(2026, 3, 8, 0, 0, 0, 0, ny);</div><div>System.out.println(Duration.between(a,
      a.plusDays(1)));          <span class="cm">// ngày chuyển sang giờ mùa hè</span></div><div>ZonedDateTime
      b = ZonedDateTime.of(2026, 11, 1, 0, 0, 0, 0, ny);</div><div>System.out.println(Duration.between(b,
      b.plusDays(1)));          <span class="cm">// ngày lùi về giờ chuẩn</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>PT23H</div><div>PT25H</div></div>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Một chi tiết nữa. Thành phố bên Bắc Mỹ này chuyển sang giờ mùa hè vào đúng
      ngày tám tháng ba, nên ngày đó chỉ có hai mươi ba giờ. Ngày một tháng mười một
      lùi giờ nên có hai mươi lăm giờ. Hãy nhớ, một ngày không phải lúc nào cũng dài
      hai mươi bốn giờ.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: công thức lãi theo ngày và vì sao dùng số thập phân chính
    xác'
  checks:
  - 100000000 * 72 * 89 == 640800000000
  - 1000 * 365 == 365000
  - round(640800000000 / 365000) == 1755616
  - int(640800000000 / 365000 * 100) == 175561643
  steps:
  - show: '<p><b>Bước 1.</b> Lãi đơn theo ngày: <b>lãi = gốc × lãi suất năm × số ngày
      / 365</b>.</p><p>Vì lãi suất là <b>mỗi năm</b>, nên phần của năm là <code>số
      ngày / 365</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, công thức lãi đơn theo ngày. Vì lãi suất tính cho cả năm, nên phần
      của năm mà khoản gửi tồn tại là số ngày chia ba trăm sáu mươi lăm. Nhân phần
      đó với gốc và lãi suất ta được lãi.
  - show: '<p><b>Bước 2.</b> Số ngày <b>do máy đếm</b>: <code>ChronoUnit.DAYS.between(gui,
      den)</code>.</p><p>Vì sao không tự cộng: tháng dài ngắn khác nhau, năm nhuận
      thêm một ngày; máy biết lịch, ta dễ sai.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước hai, số ngày để máy đếm. Vì tháng dài ngắn khác nhau và năm nhuận có
      thêm một ngày, nên tự cộng tay rất dễ sai, còn máy biết lịch.
  - show: '<p><b>Bước 3.</b> Tính bằng <b>số thập phân chính xác</b>, nhân hết rồi
      <b>chia sau cùng một lần</b>:</p><p><code>gốc × lãi suất × ngày</code> (chính
      xác) rồi <code>÷ 365</code>, làm tròn <b>một lần</b>.</p><p>Vì sao chia cuối:
      mỗi lần làm tròn ở giữa chừng đều thêm sai số.</p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bước ba, nhân hết rồi chia ở cuối cùng, làm tròn đúng một lần. Vì mỗi lần
      làm tròn ở giữa chừng đều thêm một chút sai số, nên làm tròn càng muộn càng
      tốt.
  - show: '<p><b>Bước 4.</b> Thử bằng số nguyên làm đường khác: nhân lãi suất <code>0,072</code>
      thành <code>72 / 1000</code>:</p>$$\frac{100\,000\,000 \times 72 \times 89}{1\,000
      \times 365} = \frac{640\,800\,000\,000}{365\,000} \approx 1\,755\,616{,}43 \to
      \hl{1\,755\,616}$$'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, thử bằng số nguyên. Vì lãi suất bảy phẩy hai phần trăm là bảy mươi
      hai phần nghìn, nên ta nhân tử số với bảy mươi hai và mẫu số với một nghìn.
      Tử số là sáu trăm bốn mươi tỉ tám trăm triệu, mẫu số là ba trăm sáu mươi lăm
      nghìn. Kết quả một triệu bảy trăm năm mươi lăm nghìn sáu trăm mười sáu phẩy
      bốn ba, làm tròn về một triệu bảy trăm năm mươi lăm nghìn sáu trăm mười sáu.
- id: example
  kind: example
  title: 'Ví dụ: lãi 89 ngày, từng bước, chạy thật'
  checks:
  - 28 + 31 + 30 == 89
  - 100000000 * 72 // 1000 * 89 == 640800000
  - round(640800000 / 365) == 1755616
  - 100000000 + 1755616 == 101755616
  steps:
  - show: <div class="code"><div>LocalDate tu = LocalDate.of(2026, 2, 10);</div><div>LocalDate
      den = LocalDate.of(2026, 5, 10);</div><div>System.out.println(ChronoUnit.DAYS.between(tu,
      den));</div><div>System.out.println(Period.between(tu, den));</div><div>System.out.println(LocalDate.of(2026,
      1, 31).plusMonths(1));</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>89</div><div>P3M</div></div>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ nhất, đếm ngày. Từ mười tháng hai tới mười tháng năm có tám
      mươi chín ngày. Cùng khoảng đó theo lịch là ba tháng. Hai cách đo khác nhau,
      và ta cần cách đếm ngày cho lãi.
  - show: '$$① \; 28 + 31 + 30 = \hl{89} \text{ ngày}$$<p>(10/2 → 10/3: 28 ngày; →
      10/4: 31 ngày; → 10/5: 30 ngày.)</p>'
    focus:
