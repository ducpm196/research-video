- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>lưu Instant, hiển thị theo múi giờ</span><span
      class=''a''>→</span><span class=''n''>ngày không luôn 24 giờ</span><span class=''a''>→</span><span
      class=''n''>tiền: BigDecimal từ chuỗi</span><span class=''a''>→</span><span
      class=''n''>nhân hết, chia và làm tròn một lần cuối</span><span class=''a''>→</span><span
      class=''n''>chọn một kiểu làm tròn cho cả hệ thống</span><span class=''a''>→</span><span
      class=''n''>chỉ rõ Locale</span></div>'
    say: Tổng kết chuỗi logic. Lưu điểm thời gian và hiển thị theo múi giờ. Một ngày
      không luôn dài hai mươi bốn giờ. Tiền dùng số thập phân chính xác tạo từ chuỗi.
      Nhân hết rồi chia và làm tròn một lần ở cuối. Chọn một kiểu làm tròn cho cả
      hệ thống. Và luôn chỉ rõ vùng ngôn ngữ.
  - show: '<div class=''box key''><b>Tư duy:</b> với mọi con số tiền hay mốc thời
      gian, hỏi bốn câu: nó <b>thuộc múi giờ nào</b>, <b>ai quyết định</b> kiểu làm
      tròn, sai lệch nhỏ này <b>nhân với số giao dịch</b> thành bao nhiêu,

      và máy khác có <b>vùng ngôn ngữ khác</b> thì còn đúng không.</div>

      '
    say: Điều cần mang theo. Với mọi con số tiền hay mốc thời gian, hãy hỏi bốn câu.
      Nó thuộc múi giờ nào. Ai quyết định kiểu làm tròn. Sai lệch nhỏ này nhân với
      số giao dịch thành bao nhiêu. Và máy khác có vùng ngôn ngữ khác thì còn đúng
      không.
