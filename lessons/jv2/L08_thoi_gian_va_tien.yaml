    - 2
    clear: true
    say: Kết quả thật. Một nghìn giao dịch thì lệch năm trăm đồng. Một triệu giao
      dịch thì lệch năm trăm nghìn đồng. Một tỉ giao dịch thì lệch năm trăm triệu
      đồng, đây là con số tính từ quy luật. Làm tròn nửa về số chẵn thì phần thừa
