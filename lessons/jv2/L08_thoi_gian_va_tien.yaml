      000</b></td><td><b>500 000 000</b> (tính)</td></tr><tr><td>lệch khi làm tròn
      nửa về số chẵn (đo thật)</td><td>0</td><td>0</td><td>0</td></tr></table><p class='note'>Mỗi
      giao dịch thừa 0,5 đồng, nên lệch = 0,5 × số giao dịch. Với phần lẻ ngẫu nhiên,
      nửa lên lệch ít hơn; ngưỡng thật do quy định kế toán của đơn vị, không phải
      do ngôn ngữ lập trình.</p>
    focus:
