source: 'curriculum/jv2.yaml L08; audit/jv2/verify_jv2.py L08 (javac/java chạy thật,
  JDK 21; dữ liệu múi giờ của JDK); java.time (Java SE 21 API: Instant, ZonedDateTime,
  Duration, Period, ChronoUnit.DAYS.between); java.math.BigDecimal và RoundingMode
  (Java SE 21 API: HALF_UP, HALF_EVEN; BigDecimal(double) lấy nguyên giá trị nhị phân);
  java.util.Locale và String.format (dữ liệu vùng CLDR); IEEE 754-2019 mục làm tròn
  về số chẵn gần nhất; IANA Time Zone Database (America/New_York: giờ mùa hè bắt đầu
  2026-03-08, kết thúc 2026-11-01); dev.java/learn'
assumes: []
objectives:
- Phân biệt ngày lịch, điểm thời gian và ngày giờ theo múi giờ, và nhớ rằng một ngày
  có thể dài 23 hay 25 giờ
- Tính lãi theo ngày bằng số thập phân chính xác và kiểm lại bằng số nguyên
- Nêu sai lệch cộng dồn của các kiểu làm tròn khi số giao dịch tăng một nghìn lần
- Nhận ra bẫy cộng ngày với cộng tháng, tạo số chính xác từ số thực, và vùng ngôn
  ngữ
- Viết chương trình lãi theo ngày cho khoản gửi 120 triệu và chạy thử
