    say: Hình dung dự án như một cây thư mục và một dòng chảy. Một gói, bảy tệp, mỗi
      tệp một việc. Bản ghi bất biến biết cách phân tích một dòng. Bộ đọc đọc từng
      dòng và gọi bản ghi. Nhật ký in cảnh báo có mức. Lớp báo cáo dùng đường ống
      để gom nhóm. Bộ gom dành cho đọc theo dòng. Lớp chính ghép các phần lại. Và
      lớp kiểm thử canh các ca biên. Mỗi mảnh nhỏ nên dễ kiểm và dễ thay.
  - show: '<p><b>GiaoDich.java: phanTich (đoạn đầu)</b></p><div class="code"><div><span
      class="kw">public</span> <span class="kw">static</span> GiaoDich phanTich(String
      dong) {</div><div>    String[] f = dong.split(",", -1);</div><div>    <span
      class="kw">if</span> (f.length != 5) {</div><div>        <span class="kw">throw</span>
      <span class="kw">new</span> IllegalArgumentException("so cot khong dung");</div><div>    }</div><div>    <span
      class="kw">long</span> tien;</div><div>    <span class="kw">try</span> {</div><div>        tien
      = Long.parseLong(f[4].trim());</div><div>    } <span class="kw">catch</span>
      (NumberFormatException e) {</div><div>        <span class="kw">throw</span>
      <span class="kw">new</span> IllegalArgumentException("so tien khong hop le:
      " + f[4]);</div></div>'
    focus:
