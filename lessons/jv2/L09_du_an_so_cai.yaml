  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>Bo qua dong 5: so
      tien khong hop le</div><div>Bo qua dong 7: loai khong hop le</div><div>B01 3100000</div><div>B02
      1800000</div><div>B03 1500000</div><div>Tong 6400000 khop true</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh JV2 L09 SoCaiNho.java</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
