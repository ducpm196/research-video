    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Ta thử quy mô thật. Tạo sổ cái một triệu dòng. Bản dự án chạy tốt trên tám
      dòng, giữ mọi giao dịch trong một danh sách, thì hết bộ nhớ với giới hạn ba
      mươi hai megabyte. Mỗi bản ghi cùng ba chuỗi và một ngày tốn hàng trăm byte,
      nên một triệu dòng vượt xa giới hạn.
  - show: '<p><b>Bản đọc theo dòng (32 MB) và bản song song (64 MB rồi 128 MB)</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>java -Xmx32m -cp
      out soc.AppDong lon.csv</div><div>So tai khoan: 100, dong loi: 0</div><div>Tong
      so du: 1333334000 (khop)</div><div><span class="cm"><span>&#36;</span> </span>java
      -Xmx64m -cp out soc.AppSong lon.csv 2&gt;&amp;1 | grep -m1 -o OutOfMemoryError</div><div>OutOfMemoryError</div><div><span
      class="cm"><span>&#36;</span> </span>java -Xmx128m -cp out soc.AppSong lon.csv</div><div>song
      song khop tuan tu: true</div></div><p class=''note''>Tổng số dư khớp bất biến.
      Song song giữ nhiều dòng cùng lúc nên cần nhiều bộ nhớ hơn đọc theo dòng.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bản đọc theo dòng chỉ giữ một dòng và một bản đồ một trăm tài khoản, nên
      chạy xong và vẫn thoả bất biến. Bản song song chia các dòng cho nhiều luồng,
      dùng bộ gom an toàn cho nhiều luồng, và cho kết quả đúng bằng bản tuần tự. Nhưng
      nó giữ nhiều dòng cùng lúc, nên với sáu mươi bốn megabyte vẫn hết bộ nhớ, và
      phải có một trăm hai mươi tám megabyte mới chạy. Nếu thay bộ gom bằng bản đồ
      thường thì đây chính là lỗi tranh chấp của bài về luồng.
  - show: '<table class=''t''><tr><th>số dòng</th><th>1 000</th><th>1 000 000</th><th>1
      000 000 000</th></tr><tr><td>bộ nhớ khi giữ danh sách giao dịch (≥ 200 byte
      mỗi dòng, ước lượng)</td><td>≥ 200 KB</td><td><b>≥ 200 MB</b></td><td><b>≥ 200
      GB</b></td></tr><tr><td>bộ nhớ khi đọc theo dòng (một dòng + bản đồ tài khoản)</td><td>gần
      như nhau</td><td>gần như nhau</td><td>gần như nhau</td></tr><tr><td>thời gian
      đọc (tỉ lệ so với 1 000 dòng)</td><td>×1</td><td>×1 000</td><td><b>×1 000 000</b></td></tr></table><p
      class=''note''>Đánh đổi: đọc theo dòng cho báo cáo <b>một lượt</b>; cần truy
      vấn nhiều kiểu thì phải đọc lại, hoặc đưa dữ liệu vào cơ sở dữ liệu có chỉ mục.
      Song song giúp việc <b>tính toán</b>; việc <b>đọc đĩa</b> bị giới hạn bởi tốc
      độ đĩa.</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Tóm lại theo quy mô. Giữ danh sách thì bộ nhớ tăng theo số dòng, hai trăm
      megabyte cho một triệu dòng và hai trăm gigabyte cho một tỉ dòng. Đọc theo dòng
      thì bộ nhớ gần như không đổi, nhưng thời gian vẫn tăng đều theo số dòng. Đánh
      đổi là báo cáo chỉ một lượt, cần truy vấn nhiều kiểu thì phải dùng cơ sở dữ
      liệu có chỉ mục. Và song song chỉ giúp phần tính toán, còn đọc đĩa bị giới hạn
      bởi tốc độ đĩa.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Quên bỏ dòng tiêu đề: nó
      bị coi là một giao dịch.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>java -cp out soc.ThuTieuDe</div><div>so tien khong hop le: so_tien</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Lỗi thứ nhất là quên bỏ dòng tiêu đề. Dòng chữ tên các cột bị đưa vào hàm
      phân tích như một giao dịch, và cột tiền chứa chữ so tiền gạch dưới. Nó báo
      lỗi rõ ràng, nhưng nếu ta nuốt lỗi thì mất một dòng và không ai để ý.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Bỏ dòng lỗi lặng
      lẽ: bất biến vẫn khớp, báo cáo vẫn trông đúng.</div><p>Báo cáo trên tệp lỗi
      vẫn in <b>(khop)</b> dù mất 2 dòng. Chỉ có <b>đối chiếu số dòng</b> (8 = 6 +
      2) và <b>nhật ký cảnh báo</b> mới phát hiện được.</p><p>Quy tắc: mỗi dòng bị
      loại phải để lại <b>dấu vết</b> (nhật ký) và <b>con số</b> (đếm), và con số
      đó phải đối chiếu được với nguồn.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai hay gặp ở người đã đi làm. Bỏ dòng lỗi một cách lặng lẽ, và bất
      biến vẫn khớp, báo cáo vẫn trông đúng. Báo cáo trên tệp lỗi vẫn báo khớp dù
      mất hai dòng. Chỉ đối chiếu số dòng và nhật ký cảnh báo mới phát hiện được.
      Mỗi dòng bị loại phải để lại dấu vết và một con số có thể đối chiếu với nguồn.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Thiếu một ca kiểm:
      dòng giao dịch số tiền âm lọt vào sổ cái.</div><p><b>Gỡ kiểm tra tiền dương
      rồi chạy lại bộ kiểm thử</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>sed -i ''s/tien &lt;= 0/false/'' src/soc/GiaoDich.java</div><div><span
      class="cm"><span>&#36;</span> </span>javac -d out src/soc/*.java &amp;&amp;
      java -cp out soc.KiemTra | grep -v DAT</div><div>HONG so tien am</div><div>dat
      6, hong 1</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba cũng của người đã đi làm. Một kiểm tra nghiệp vụ, số tiền phải
      dương, nằm lặng lẽ trong hàm phân tích. Ta thử gỡ nó đi rồi chạy lại bộ kiểm
      thử. Đúng một ca báo hỏng, là ca số tiền âm. Nếu ta chưa từng viết ca đó thì
      kiểm tra có thể bị xoá mà mọi cổng vẫn xanh, và nạp âm sẽ lẳng lặng thành rút.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 900 - 250 + 100 == 750
  - 750 + 400 == 1150
  - (900 + 400 + 100) - 250 == 1150
  - 5 == 4 + 1
  steps:
  - show: '<p><b>Đề.</b> Sổ cái 5 dòng (<code>tai_khoan,loai,so_tien</code>): <code>X,nap,900</code>;
      <code>Y,nap,400</code>; <code>X,rut,250</code>; <code>Y,rut,xx</code>; <code>X,nap,100</code>.</p>

      <ol><li>Số dư X, Y sau khi bỏ dòng lỗi? Tổng số dư? Bất biến <code>nap − rut</code>
      có khớp không?</li>

      <li>Đối chiếu số dòng: đọc = hợp lệ + lỗi = ?</li></ol>

      <p><b>Chọn A hay B?</b> Báo cáo cho tệp 50 GB trên máy 8 GB. A: <code>List</code>
      rồi <code>stream()</code>. B: bộ gom cộng dồn khi đọc từng dòng. Muốn thêm <code>parallel()</code>
      thì bộ gom cần điều kiện gì?</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 30
    say: Bây giờ tới phần bạn tự làm. Sổ cái năm dòng, một dòng lỗi. Hãy tính số dư
      hai tài khoản sau khi bỏ dòng lỗi, tổng số dư, và bất biến có khớp không. Rồi
      đối chiếu số dòng. Cuối cùng chọn giữa danh sách rồi đường ống, và bộ gom cộng
      dồn khi đọc từng dòng, cho tệp năm mươi gigabyte trên máy tám gigabyte. Và muốn
      thêm song song thì bộ gom cần điều kiện gì. Hãy dừng video và tự làm.
  - show: <table class='t'><tr><th>câu</th><th>đáp án</th><th>vì sao</th></tr><tr><td>1</td><td>X
      = 900 − 250 + 100 = <b>750</b>; Y = <b>400</b>; tổng <b>1 150</b>; nạp 1 400
      − rút 250 = <b>1 150</b> ✓</td><td>dòng <code>Y,rut,xx</code> bị loại; bất biến
      thoả</td></tr><tr><td>2</td><td><b>5 = 4 hợp lệ + 1 lỗi</b></td><td>bất biến
      không thấy dòng bị loại; đối chiếu số dòng mới thấy</td></tr><tr><td>3</td><td><b>B</b>;
      bộ gom phải <b>an toàn cho nhiều luồng</b></td><td>A cần ≥ 200 byte × số dòng
      ≫ 8 GB; B giữ bộ nhớ không đổi; song song cần bản đồ/bộ cộng an toàn</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    say: Đáp án câu một, số dư của X là chín trăm trừ hai trăm năm mươi cộng một trăm,
      bằng bảy trăm năm mươi. Y là bốn trăm. Tổng một nghìn một trăm năm mươi, bằng
      nạp một nghìn bốn trăm trừ rút hai trăm năm mươi. Câu hai, năm dòng bằng bốn
      hợp lệ cộng một lỗi. Câu ba chọn phương án B, vì danh sách cần nhiều hơn tám
      gigabyte, còn bộ gom giữ bộ nhớ không đổi. Muốn song song thì bộ gom phải an
      toàn cho nhiều luồng.
    clear: true
  - show: <div class="box key"><b>Quy tắc:</b> mỗi dòng bị loại phải <b>có dấu vết
      và có số đếm</b>; hai cách đếm độc lập phải <b>khớp</b>; tệp lớn thì <b>đọc
      theo dòng</b>; song song chỉ khi <b>bộ gom an toàn</b>.</div>
    say: Quy tắc rút ra. Mỗi dòng bị loại phải có dấu vết và có số đếm. Hai cách đếm
      độc lập phải khớp. Tệp lớn thì đọc theo dòng. Và song song chỉ khi bộ gom an
      toàn cho nhiều luồng.
- id: practice
  kind: practice
  title: 'Tự làm: sổ cái nhỏ có dòng lỗi'
  steps:
  - show: '<p><b>Đề</b>: tệp sổ cái 7 dòng (trong <code>de.md</code>), hai dòng lỗi
      (số tiền <code>abc</code>, loại <code>gui</code>).</p>

      <ol><li>Đọc từng dòng, bỏ tiêu đề, đếm số dòng của tệp; <code>phanTich</code>
      ném <code>IllegalArgumentException</code> khi sai.</li>

      <li>Dòng lỗi: in <code>Bo qua dong …: …</code> rồi đọc tiếp; dòng đúng: cộng
      vào <code>TreeMap</code>.</li>

      <li>In số dư từng tài khoản và <code>Tong … khop true</code> (bất biến: tổng
      số dư = nạp − rút).</li></ol>

      <p class="note">Tệp <code>SoCaiNho.java</code>; mọi dữ liệu đã ghi trong <code>labs/JV2/L09/de.md</code>.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 300
    say: Bây giờ tới phần bạn tự làm trên máy. Đề bài cho một sổ cái bảy dòng, hai
      dòng bị lỗi. Hãy đọc từng dòng, bỏ tiêu đề, đếm số dòng của tệp, và viết hàm
      phân tích dòng, ném ngoại lệ khi số tiền không phải số hoặc loại sai. Dòng lỗi
      thì in ra và đọc tiếp, không dừng. Dòng đúng thì cộng vào bản đồ có thứ tự.
      Cuối cùng in số dư từng tài khoản, và dòng tổng kèm kết quả kiểm bất biến. Hãy
