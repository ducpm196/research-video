- id: formula
  kind: formula
  title: 'Suy ra từng bước: vì sao thiết kế như vậy'
  checks:
  - 100 - 30 == 70
  - 70 + 50 == 120
  - (100 + 50) - 30 == 120
  - 3 == 3 + 0
  steps:
  - show: '<p><b>Bước 1.</b> Tiền là <b>số nguyên đồng</b> (<code>long</code>), <code>nap</code>
      mang dấu <b>+</b>, <code>rut</code> mang dấu <b>−</b>:</p><p><code>số dư = tổng
      của (dấu × số tiền)</code></p><p>Vì sao: cộng số nguyên <b>giao hoán và kết
      hợp</b>, nên thứ tự dòng hay cách gom nhóm không đổi kết quả.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, tiền là số nguyên đồng, nạp mang dấu cộng, rút mang dấu trừ. Số
      dư là tổng các số có dấu. Vì phép cộng số nguyên giao hoán và kết hợp, nên thứ
      tự các dòng hay cách gom nhóm không làm đổi kết quả.
  - show: '<p><b>Bước 2.</b> Bất biến: <b>tổng các số dư = tổng nạp − tổng rút</b>.</p><p>Vì
      sao: mỗi dòng hợp lệ đóng góp <b>đúng một lần</b> vào một số dư và vào một trong
      hai tổng; nếu phần gom nhóm tính một dòng <b>hai lần</b> hoặc làm <b>rơi</b>
      một dòng ở một vế mà không ở vế kia, hai vế <b>lệch nhau</b>.</p><p class=''note''>Bất
      biến kiểm <b>phần gom và cộng dồn</b>, không kiểm dữ liệu đầu vào.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: 'Bước hai, bất biến: tổng các số dư phải bằng tổng nạp trừ tổng rút. Mỗi
      dòng hợp lệ đóng góp đúng một lần vào một số dư và một trong hai tổng. Nên nếu
      phần gom tính một dòng hai lần, hoặc làm rơi nó ở một vế, thì hai vế lệch nhau.
      Bất biến kiểm phần gom, không kiểm dữ liệu đầu vào.'
  - show: <p><b>Bước 3.</b> Bất biến <b>không bắt được</b> dòng bị loại <b>trước khi</b>
      vào cả hai vế (bỏ dòng nào ở đầu vào, hai vế vẫn khớp). Cần <b>đối chiếu số
      dòng</b>:</p><p><code>đọc = hợp lệ + lỗi</code> và <code>đọc = số dòng của tệp
      − 1</code> (trừ tiêu đề).</p>
    focus:
    - 1
    - 2
    clear: true
    say: Bước ba, bất biến không bắt được dòng bị loại trước khi vào cả hai vế, vì
      bỏ dòng nào ở đầu vào thì hai vế cũng vẫn khớp. Vì vậy cần đối chiếu số dòng,
      đọc bằng hợp lệ cộng lỗi, và bằng số dòng của tệp trừ tiêu đề.
  - show: '<p><b>Bước 4.</b> Thử bằng số với 3 dòng: nạp A 100; rút A 30; nạp B 50:</p><table
      class=''t''><tr><th>tính</th><th>giá trị</th></tr><tr><td>số dư A</td><td>100
      − 30 = <b>70</b></td></tr><tr><td>số dư B</td><td><b>50</b></td></tr><tr><td>tổng
      số dư</td><td>70 + 50 = <b>120</b></td></tr><tr><td>nạp − rút</td><td>(100 +
      50) − 30 = <b>120</b> ✓</td></tr><tr><td>đọc = hợp lệ + lỗi</td><td>3 = 3 +
      0 ✓</td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, thử bằng số với ba dòng. Số dư của A là một trăm trừ ba mươi bằng
      bảy mươi, số dư của B là năm mươi, nên tổng số dư là một trăm hai mươi. Nạp
      trừ rút là một trăm năm mươi trừ ba mươi, cũng một trăm hai mươi. Số dòng đọc
      là ba, bằng ba hợp lệ cộng không lỗi.
