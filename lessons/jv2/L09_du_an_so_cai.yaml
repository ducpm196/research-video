      kèm bằng chứng. Kiểm thử đã chạy, dòng lỗi đã đếm, bất biến đã thoả, và biết
      rõ ở quy mô nào thiết kế này sẽ gãy. Để chạy như vậy nhiều tháng, bước tiếp
      theo là hiểu bộ nhớ và bộ thu gom rác của máy ảo.
