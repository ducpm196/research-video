- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>gói nhỏ, mỗi tệp một việc</span><span
      class=''a''>→</span><span class=''n''>phân tích + kiểm từng dòng</span><span
      class=''a''>→</span><span class=''n''>dòng lỗi: nhật ký + đếm</span><span class=''a''>→</span><span
      class=''n''>bất biến: tổng số dư = nạp − rút</span><span class=''a''>→</span><span
      class=''n''>đối chiếu số dòng</span><span class=''a''>→</span><span class=''n''>tệp
      lớn: đọc theo dòng</span><span class=''a''>→</span><span class=''n''>song song
      cần bộ gom an toàn</span></div>'
    say: Tổng kết chuỗi logic. Chia gói nhỏ, mỗi tệp một việc. Phân tích và kiểm từng
      dòng. Dòng lỗi thì ghi nhật ký và đếm. Kiểm bất biến tổng số dư bằng nạp trừ
      rút. Đối chiếu số dòng bằng một cách đếm độc lập. Tệp lớn thì đọc theo dòng.
      Và song song cần bộ gom an toàn cho nhiều luồng.
  - show: '<div class=''box key''><b>Tư duy:</b> một báo cáo đúng không chỉ là <b>số
      đúng</b>, mà là số đúng <b>kèm bằng chứng</b>: kiểm thử đã chạy, dòng lỗi đã
      đếm, bất biến đã thoả,

      và biết rõ <b>ở quy mô nào</b> thiết kế này sẽ gãy.</div>

      '
    forward_ref: true
    say: Điều cần mang theo. Một báo cáo đúng không chỉ là số đúng, mà là số đúng
      kèm bằng chứng. Kiểm thử đã chạy, dòng lỗi đã đếm, bất biến đã thoả, và biết
      rõ ở quy mô nào thiết kế này sẽ gãy. Để chạy một chương trình như vậy nhiều
      tháng, bước tiếp theo là hiểu bộ nhớ và bộ thu gom rác của máy ảo.
