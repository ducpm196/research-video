      nhóm luồng, bản đồ an toàn</td><td>bài 5</td><td>gom song song</td></tr><tr><td>ca
      kiểm ở biên</td><td>bài 6</td><td><code>KiemTra</code></td></tr><tr><td>nhật
      ký có mức, dấu vết</td><td>bài 7</td><td><code>NhatKy</code>, cảnh báo dòng
      lỗi</td></tr><tr><td>tiền là số nguyên đồng</td><td>bài 8</td><td><code>long</code>
      cho mọi số tiền</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    - '1.9'
    - '1.10'
    say: Ta ôn lại các mảnh sẽ ghép. Gói và lệnh biên dịch từ bài không. Đọc từng
      dòng trong khối có tài nguyên từ bài một. Bản đồ có thứ tự từ bài hai. Đường
      ống và gom nhóm từ bài ba. Nhãn và phản chiếu từ bài bốn. Bản đồ an toàn cho
      nhiều luồng từ bài năm. Ca kiểm ở biên từ bài sáu. Nhật ký có mức độ từ bài
      bảy. Và tiền là số nguyên theo đồng từ các bài trước.
- id: sym
  kind: symbol
  title: Giải mã sáu thuật ngữ của bài toán sổ cái
  steps:
  - show: '<table class=''t''><tr><th>thuật ngữ</th><th>nghĩa</th></tr><tr><td>sổ
      cái (ledger)</td><td>danh sách <b>mọi giao dịch</b> theo thứ tự; số dư là kết
      quả <b>cộng dồn</b> từ sổ cái</td></tr><tr><td>bất biến (invariant)</td><td>điều
      <b>luôn đúng</b> sau mỗi thao tác; ở đây: <b>tổng số dư = tổng nạp − tổng rút</b></td></tr><tr><td>đối
      chiếu (reconcile)</td><td>so <b>hai cách đếm độc lập</b> cùng một thứ: số dòng
      đọc = hợp lệ + lỗi = số dòng của tệp</td></tr><tr><td>dòng lỗi</td><td>dòng
      không qua kiểm tra; <b>ghi lại và đếm</b>, không bỏ lặng lẽ, không làm dừng
      cả chương trình</td></tr><tr><td>đọc theo dòng (streaming)</td><td>xử lý từng
      dòng rồi quên nó: bộ nhớ <b>không đổi</b> theo kích thước tệp</td></tr><tr><td>bộ
      gom (accumulator)</td><td>đối tượng cộng dồn kết quả khi từng dòng đi qua (<code>TongHop</code>)</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Bảng này giải mã sáu thuật ngữ của bài toán sổ cái. Sổ cái là danh sách mọi
      giao dịch theo thứ tự, số dư chỉ là kết quả cộng dồn. Bất biến là điều luôn
      đúng sau mỗi thao tác, ở đây là tổng số dư bằng tổng nạp trừ tổng rút. Đối chiếu
      là so hai cách đếm độc lập cùng một thứ. Dòng lỗi phải được ghi lại và đếm,
      không bỏ lặng lẽ. Đọc theo dòng là xử lý từng dòng rồi quên, nên bộ nhớ không
      đổi. Và bộ gom là đối tượng cộng dồn kết quả khi từng dòng đi qua.
