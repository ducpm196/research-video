    clear: true
    say: Cuối ngày, ngân hàng có một tệp sổ cái cả triệu dòng. Cần một báo cáo số
      dư theo tài khoản và theo tháng. Báo cáo phải đúng, dòng lỗi phải được ghi lại
      chứ không làm hỏng cả báo cáo, và chương trình phải chạy được dù tệp lớn. Đây
      là lúc ghép mọi thứ đã học thành một dự án nhiều tệp có thật.
  - show: '<div class="box key">Hôm nay: <b>dự án tình huống</b>. Dự án nhiều gói;
      đọc tệp từng dòng; bản ghi và đường ống; kiểm thử; nhật ký cảnh báo; <b>bất
      biến tổng số dư = tổng nạp − tổng rút</b>;

      và câu hỏi cuối: <b>khi tệp lớn gấp một nghìn lần</b>, thiết kế nào còn sống?</div>

      '
    clear: true
    say: Hôm nay ta làm một dự án tình huống. Dự án nhiều gói, đọc tệp từng dòng,
      bản ghi và đường ống, kiểm thử, nhật ký cảnh báo, và một bất biến, tổng số dư
      bằng tổng nạp trừ tổng rút. Câu hỏi cuối cùng là khi tệp lớn gấp một nghìn lần
      thì thiết kế nào còn sống.
- id: prereq
  kind: prereq
  title: 'Ôn lại: chín bài trước, mỗi bài một mảnh'
  steps:
  - show: <table class='t'><tr><th>mảnh</th><th>bài</th><th>dùng ở đâu trong dự án</th></tr><tr><td>gói,
      <code>javac -d</code>, <code>-cp</code></td><td>bài 0</td><td>ba thư mục, một
      lệnh biên dịch</td></tr><tr><td>đọc từng dòng, <code>try (…)</code></td><td>bài
