- id: formula
  kind: formula
  title: 'Suy ra từng bước: vì sao thiết kế như vậy'
  checks:
  - 100 - 30 == 70
  - 70 + 50 == 120
  - (100 + 50) - 30 == 120
  - 3 == 3 + 0
  steps:
  - show: '<p><b>Bước 1.</b> Tiền là <b>số nguyên đồng</b> (<code>long</code>), <code>nap</code>
      mang dấu <b>+</b>, <code>rut</code> mang dấu <b>−</b>:</p><p><code>số dư = tổng
      của (dấu × số tiền)</code></p><p>Vì sao: cộng số nguyên <b>giao hoán và kết
      hợp</b>, nên thứ tự dòng hay cách gom nhóm không đổi kết quả.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước một, tiền là số nguyên đồng, nạp mang dấu cộng, rút mang dấu trừ. Số
      dư là tổng các số có dấu. Vì phép cộng số nguyên giao hoán và kết hợp, nên thứ
      tự các dòng hay cách gom nhóm không làm đổi kết quả.
  - show: '<p><b>Bước 2.</b> Bất biến: <b>tổng các số dư = tổng nạp − tổng rút</b>.</p><p>Vì
      sao: mỗi dòng hợp lệ đóng góp <b>đúng một lần</b> vào một số dư và vào một trong
      hai tổng; nếu một dòng bị tính hai lần hay bị rơi, hai vế <b>lệch nhau</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước hai, bất biến. Tổng các số dư phải bằng tổng nạp trừ tổng rút. Vì mỗi
      dòng hợp lệ đóng góp đúng một lần vào một số dư và vào một trong hai tổng, nên
      nếu có dòng bị tính hai lần hoặc bị rơi thì hai vế lệch nhau.
  - show: <p><b>Bước 3.</b> Bất biến <b>không bắt được</b> dòng bị bỏ đi (bỏ dòng
      nào cũng khớp). Cần <b>đối chiếu số dòng</b>:</p><p><code>đọc = hợp lệ + lỗi</code>
      và <code>đọc = số dòng của tệp − 1</code> (trừ tiêu đề).</p>
    focus:
    - 1
    - 2
    clear: true
    say: Bước ba, bất biến không bắt được dòng bị bỏ đi, vì bỏ dòng nào hai vế cũng
      vẫn khớp. Vì vậy cần đối chiếu số dòng, đọc bằng hợp lệ cộng lỗi, và bằng số
      dòng của tệp trừ tiêu đề.
  - show: '<p><b>Bước 4.</b> Thử bằng số với 3 dòng: nạp A 100; rút A 30; nạp B 50:</p><table
      class=''t''><tr><th>tính</th><th>giá trị</th></tr><tr><td>số dư A</td><td>100
      − 30 = <b>70</b></td></tr><tr><td>số dư B</td><td><b>50</b></td></tr><tr><td>tổng
      số dư</td><td>70 + 50 = <b>120</b></td></tr><tr><td>nạp − rút</td><td>(100 +
      50) − 30 = <b>120</b> ✓</td></tr><tr><td>đọc = hợp lệ + lỗi</td><td>3 = 3 +
      0 ✓</td></tr></table>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    clear: true
    say: Bước bốn, thử bằng số với ba dòng, vì ví dụ nhỏ cho phép kiểm bằng mắt. Số
      dư của A là một trăm trừ ba mươi bằng bảy mươi. Số dư của B là năm mươi. Tổng
      số dư một trăm hai mươi. Nạp trừ rút là một trăm năm mươi trừ ba mươi, cũng
      một trăm hai mươi. Và số dòng đọc là ba, bằng ba hợp lệ cộng không lỗi.
- id: example
  kind: example
  title: 'Ví dụ: biên dịch, kiểm thử, chạy trên tệp sạch rồi tệp có hai dòng lỗi'
  checks:
  - 5000000 - 1200000 + 2500000 == 6300000
  - 3000000 - 500000 + 1000000 == 3500000
  - 800000 - 300000 == 500000
  - 6300000 + 3500000 + 500000 == 10300000
  - 5000000 + 3000000 + 800000 + 2500000 + 1000000 == 12300000
  - 1200000 + 500000 + 300000 == 2000000
  - 12300000 - 2000000 == 10300000
  steps:
  - show: <p><b>Biên dịch cả dự án; chạy kiểm thử</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>javac -d out src/soc/*.java TaoSoCai.java</div><div><span
      class="cm"><span>&#36;</span> </span>java -cp out soc.KiemTra</div><div>DAT  doc
      dong hop le</div><div>DAT  rut co dau am</div><div>DAT  so tien khong phai so</div><div>DAT  loai
      la</div><div>DAT  thieu cot</div><div>DAT  so tien am</div><div>DAT  so du A01</div><div>dat
      7, hong 0</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Phép làm thứ nhất, biên dịch cả gói bằng một lệnh, rồi chạy bộ kiểm thử trước
      khi tin bất kỳ con số nào. Bảy ca đều đạt, gồm ca số tiền âm và ca thiếu cột.
  - show: '$$① \; \text{A01}: 5\,000\,000 - 1\,200\,000 + 2\,500\,000 = \hl{6\,300\,000}$$$$②
      \; \text{A02}: 3\,000\,000 - 500\,000 + 1\,000\,000 = \hl{3\,500\,000}$$$$③
      \; \text{A03}: 800\,000 - 300\,000 = \hl{500\,000}$$'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ nhất tới thứ ba, ta tự cộng số dư từng tài khoản trước. Tài
      khoản A không một là năm triệu trừ một triệu hai cộng hai triệu rưỡi, bằng sáu
      triệu ba trăm nghìn. A không hai là ba triệu, trừ năm trăm nghìn, cộng một triệu,
      bằng ba triệu rưỡi. A không ba là tám trăm nghìn trừ ba trăm nghìn, bằng năm
      trăm nghìn.
  - show: $$④ \; 6\,300\,000 + 3\,500\,000 + 500\,000 = \hl{10\,300\,000}$$$$⑤ \;
      \text{nạp} = 12\,300\,000, \; \text{rút} = 2\,000\,000 \Rightarrow 12\,300\,000
      - 2\,000\,000 = \hl{10\,300\,000}$$
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép thứ tư, tổng số dư là mười triệu ba trăm nghìn. Phép thứ năm, tổng nạp
      là mười hai triệu ba trăm nghìn, tổng rút là hai triệu, hiệu cũng là mười triệu
      ba trăm nghìn. Bất biến thoả, ta kỳ vọng chương trình in đúng như vậy.
    introduces:
    - implies
  - show: '<p><b>Chạy trên tệp sạch</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>java -cp out soc.App so_cai.csv</div><div>Doc 8 dong: 8 hop le, 0 loi</div><div>Tai
      khoan A01: 6300000</div><div>Tai khoan A02: 3500000</div><div>Tai khoan A03:
      500000</div><div>Tong so du: 10300000</div><div>Kiem tra: nap 12300000 - rut
      2000000 = 10300000 (khop)</div><div>Theo thang: {2026-01=7600000, 2026-02=1700000,
      2026-03=1000000}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật, tám dòng đều hợp lệ, số dư từng tài khoản khớp với phép tính tay,
      và dòng kiểm tra báo khớp. Dòng cuối là số ròng theo tháng, tổng ba tháng cũng
      là mười triệu ba trăm nghìn.
  - show: '<p><b>Tệp có hai dòng lỗi (số tiền abc, loại doi)</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>java -cp out soc.App so_cai_loi.csv</div><div>[WARNING]
      dong 4: so tien khong hop le: abc</div><div>[WARNING] dong 6: loai khong hop
      le: doi</div><div>Doc 8 dong: 6 hop le, 2 loi</div><div>Tai khoan A01: 7500000</div><div>Tai
      khoan A02: 4000000</div><div>Tai khoan A03: 500000</div><div>Tong so du: 12000000</div><div>Kiem
      tra: nap 12300000 - rut 300000 = 12000000 (khop)</div><div>Theo thang: {2026-01=8800000,
      2026-02=2200000, 2026-03=1000000}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Giờ chạy trên tệp có hai dòng lỗi. Nhật ký cảnh báo nói rõ dòng nào, vì lý
      do gì. Báo cáo vẫn chạy trên sáu dòng còn lại, và dòng đầu của báo cáo nói đã
      đọc tám dòng, sáu hợp lệ, hai lỗi. Báo cáo không bị hỏng chỉ vì vài dòng xấu,
      nhưng cũng không giấu chuyện đó.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm dòng bằng lệnh của hệ điều hành'
  checks:
  - 6 + 2 == 8
  - 7500000 + 4000000 + 500000 == 12000000
  - 12300000 - 300000 == 12000000
  steps:
  - show: '<p><b>Đếm số dòng dữ liệu của tệp có lỗi, không tính tiêu đề</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>tail -n +2 so_cai_loi.csv
      | wc -l</div><div>8</div></div><p>Đối chiếu: <b>8</b> dòng dữ liệu = <b>6</b>
      hợp lệ + <b>2</b> lỗi (đúng như dòng đầu của báo cáo) ✓</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Cách kiểm khác là một công cụ hoàn toàn khác. Lệnh đếm dòng cho biết tệp
      có tám dòng dữ liệu không tính tiêu đề. Chương trình báo đọc tám dòng, gồm sáu
      hợp lệ và hai lỗi. Hai cách đếm độc lập khớp nhau, nên không dòng nào bị rơi
      mà không ai biết.
  - show: '<p>Kiểm bất biến cho tệp lỗi: sáu dòng hợp lệ, nạp 12 300 000 và rút 300
      000 (dòng rút <code>abc</code> bị loại, dòng <code>doi</code> bị loại).</p>$$7\,500\,000
      + 4\,000\,000 + 500\,000 = 12\,000\,000 = 12\,300\,000 - 300\,000 \; ✓$$'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Kiểm thêm bất biến cho tệp có lỗi. Chỉ sáu dòng hợp lệ được tính, nạp mười
      hai triệu ba trăm nghìn và rút ba trăm nghìn. Tổng số dư mười hai triệu đúng
      bằng hiệu đó. Bất biến thoả, nhưng nhớ rằng nó thoả với mọi tập dòng hợp lệ,
      nên vẫn cần đếm dòng.
- id: scale
