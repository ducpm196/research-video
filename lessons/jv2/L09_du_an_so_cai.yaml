source: 'curriculum/jv2.yaml L09; audit/jv2/verify_jv2.py L09 (javac/java chạy thật,
  JDK 21; dự án nhiều gói, -Xmx32m cho phép đo bộ nhớ); java.util.stream.Collectors.groupingByConcurrent
  (Java SE 21 API: gom song song an toàn); java.util.logging; java.nio.file.Files.lines
  (đọc lười); RFC 4180 (CSV); Pacioli, L. (1494), Summa de arithmetica (nguyên lý
  bút toán kép: tổng ghi nợ bằng tổng ghi có); dev.java/learn'
assumes: []
objectives:
- Dựng dự án nhiều gói gồm bản ghi, bộ đọc, báo cáo, nhật ký và kiểm thử, rồi biên
  dịch và chạy bằng lệnh
- Tính số dư theo tài khoản và kiểm bất biến tổng số dư bằng tổng nạp trừ tổng rút
- Nêu cách đối chiếu số dòng và nhật ký để không bỏ lặng lẽ dòng lỗi
- Nhận ra bản giữ danh sách gãy ở một triệu dòng, bản đọc theo dòng sống, song song
  cần bộ gom an toàn
- Viết chương trình sổ cái nhỏ bỏ qua dòng lỗi, in số dư và kiểm bất biến
