      ở cuối. Nếu số cột không đủ thì ném lỗi rõ ràng. Số tiền đổi sang số nguyên
      dài, hỏng thì bọc lại thành một thông báo dễ hiểu.
  - show: '<p><b>GiaoDich.java: phanTich (đoạn sau)</b></p><div class="code"><div><span
      class="kw">if</span> (tien &lt;= 0) {</div><div>    <span class="kw">throw</span>
      <span class="kw">new</span> IllegalArgumentException("so tien phai duong: "
