  steps:
  - show: '<p><b>KiemTra.java: hàm khẳng định đếm ca đạt, ca hỏng</b></p><div class="code"><div><span
      class="kw">static</span> <span class="kw">int</span> dat, hong;</div><div> </div><div><span
      class="kw">static</span> <span class="kw">void</span> kiem(String ten, <span
      class="kw">boolean</span> ok) {</div><div>    <span class="kw">if</span> (ok)
      {</div><div>        dat++;</div><div>        System.out.println("DAT  " + ten);</div><div>    }
      <span class="kw">else</span> {</div><div>        hong++;</div><div>        System.out.println("HONG
      " + ten);</div><div>    }</div><div>}</div></div><p class=''note''>Đầu tệp:
      <code>import java.util.List;</code> — Khung: <code>public class KiemTra {</code>
      … <code>public static void main(String[] args) {</code></p>'
    clear: true
    say: Bộ kiểm thử có hai biến đếm số ca đạt và hỏng, và một hàm khẳng định in từng
      ca.
  - show: '<p><b>KiemTra.java: dòng xấu phải bị chặn</b></p><div class="code"><div><span
      class="kw">static</span> <span class="kw">boolean</span> nemLoi(String dong)
      {</div><div>    <span class="kw">try</span> {</div><div>        GiaoDich.phanTich(dong);</div><div>        <span
      class="kw">return</span> <span class="kw">false</span>;</div><div>    } <span
      class="kw">catch</span> (IllegalArgumentException e) {</div><div>        <span
      class="kw">return</span> <span class="kw">true</span>;</div><div>    }</div><div>}</div></div>'
    clear: true
    say: Hàm thứ hai trả đúng khi dòng xấu bị chặn, tức là việc phân tích ném đúng
      loại ngoại lệ.
  - show: '<p><b>KiemTra.java: bảy ca kiểm</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      {</div><div>    GiaoDich g = GiaoDich.phanTich("1,2026-01-05,A01,nap,5000000");</div><div>    GiaoDich
      r = GiaoDich.phanTich("2,2026-01-06,A01,rut,300");</div><div>    kiem("doc dong
      hop le", g.soTien() == 5000000 &amp;&amp; g.taiKhoan().equals("A01"));</div><div>    kiem("rut
      co dau am", r.dau() == -300);</div><div>    kiem("so tien khong phai so", nemLoi("3,2026-01-07,A01,nap,abc"));</div><div>    kiem("loai
      la", nemLoi("4,2026-01-08,A01,gui,100"));</div><div>    kiem("thieu cot", nemLoi("5,2026-01-09,A01,nap"));</div><div>    kiem("so
      tien am", nemLoi("6,2026-01-10,A01,nap,-500"));</div><div>    kiem("so du A01",
      BaoCao.soDu(List.of(g, r)).get("A01") == 4999700L);</div><div>    System.out.println("dat
      " + dat + ", hong " + hong);</div><div>}</div></div>'
    clear: true
    say: Hàm chính phân tích hai dòng tốt rồi đưa bảy ca vào kiểm, gồm dòng tốt, dòng
      xấu, số tiền âm và số dư của tài khoản A không một.
  - show: <p><b>Biên dịch cả dự án; chạy kiểm thử</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>javac -d out src/soc/*.java TaoSoCai.java</div><div><span
      class="cm"><span>&#36;</span> </span>java -cp out soc.KiemTra</div><div>DAT  doc
      dong hop le</div><div>DAT  rut co dau am</div><div>DAT  so tien khong phai so</div><div>DAT  loai
      la</div><div>DAT  thieu cot</div><div>DAT  so tien am</div><div>DAT  so du A01</div><div>dat
      7, hong 0</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Phép làm thứ nhất, biên dịch cả gói bằng một lệnh, rồi chạy bộ kiểm thử trước
      khi tin bất kỳ con số nào. Bảy ca đều đạt, gồm ca số tiền âm và ca thiếu cột.
  - show: '$$① \; \text{A01}: 5\,000\,000 - 1\,200\,000 + 2\,500\,000 = \hl{6\,300\,000}$$$$②
      \; \text{A02}: 3\,000\,000 - 500\,000 + 1\,000\,000 = \hl{3\,500\,000}$$$$③
      \; \text{A03}: 800\,000 - 300\,000 = \hl{500\,000}$$'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phép thứ nhất tới thứ ba, ta tự cộng số dư từng tài khoản. Tài khoản A không
      một là năm triệu trừ một triệu hai cộng hai triệu rưỡi, bằng sáu triệu ba trăm
      nghìn. A không hai là ba triệu, trừ năm trăm nghìn, cộng một triệu, bằng ba
      triệu rưỡi. A không ba là tám trăm nghìn trừ ba trăm nghìn, bằng năm trăm nghìn.
  - show: $$④ \; 6\,300\,000 + 3\,500\,000 + 500\,000 = \hl{10\,300\,000}$$$$⑤ \;
      \text{nạp} = 12\,300\,000, \; \text{rút} = 2\,000\,000 \Rightarrow 12\,300\,000
      - 2\,000\,000 = \hl{10\,300\,000}$$
    focus:
    - 1
    - 2
    clear: true
    say: Phép thứ tư, tổng số dư là mười triệu ba trăm nghìn. Phép thứ năm, tổng nạp
      là mười hai triệu ba trăm nghìn, tổng rút là hai triệu, hiệu cũng là mười triệu
      ba trăm nghìn.
    introduces:
    - implies
  - show: '<p><b>Chạy trên tệp sạch</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>java -cp out soc.App so_cai.csv</div><div>Doc 8 dong: 8 hop le, 0 loi</div><div>Tai
      khoan A01: 6300000</div><div>Tai khoan A02: 3500000</div><div>Tai khoan A03:
      500000</div><div>Tong so du: 10300000</div><div>Kiem tra: nap 12300000 - rut
      2000000 = 10300000 (khop)</div><div>Theo thang: {2026-01=7600000, 2026-02=1700000,
      2026-03=1000000}</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật, tám dòng đều hợp lệ, số dư từng tài khoản khớp với phép tính tay,
      và dòng kiểm tra báo khớp. Dòng cuối là số ròng theo tháng, tổng ba tháng cũng
      là mười triệu ba trăm nghìn.
  - show: '<p><b>Tệp có hai dòng lỗi (số tiền abc, loại doi)</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>java -cp out soc.App so_cai_loi.csv</div><div>[WARNING]
      dong 4: so tien khong hop le: abc</div><div>[WARNING] dong 6: loai khong hop
      le: doi</div><div>Doc 8 dong: 6 hop le, 2 loi</div><div>Tai khoan A01: 7500000</div><div>Tai
      khoan A02: 4000000</div><div>Tai khoan A03: 500000</div><div>Tong so du: 12000000</div><div>Kiem
      tra: nap 12300000 - rut 300000 = 12000000 (khop)</div><div>Theo thang: {2026-01=8800000,
      2026-02=2200000, 2026-03=1000000}</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Giờ chạy trên tệp có hai dòng lỗi. Nhật ký cảnh báo nói rõ dòng nào, vì
      lý do gì. Báo cáo vẫn chạy trên sáu dòng còn lại, và dòng đầu nói đã đọc tám
      dòng, sáu hợp lệ, hai lỗi: không hỏng, cũng không giấu lỗi.'
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm dòng bằng lệnh của hệ điều hành'
  checks:
  - 6 + 2 == 8
  - 7500000 + 4000000 + 500000 == 12000000
  - 12300000 - 300000 == 12000000
  steps:
  - show: '<p><b>Đếm số dòng dữ liệu của tệp có lỗi, không tính tiêu đề</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>tail -n +2 so_cai_loi.csv
      | wc -l</div><div>8</div></div><p class=''note''><code>tail -n +2</code>: in
      từ <b>dòng thứ 2</b> trở đi, tức bỏ tiêu đề; <code>|</code> nối sang <code>wc
      -l</code> để đếm số dòng.</p><p>Đối chiếu: <b>8</b> dòng dữ liệu = <b>6</b>
      hợp lệ + <b>2</b> lỗi (đúng như dòng đầu của báo cáo) ✓</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    introduces:
    - jv2_tail
    clear: true
    say: Cách kiểm khác dùng công cụ khác hẳn. Một lệnh in từ dòng thứ hai trở đi
      để bỏ tiêu đề, rồi lệnh đếm dòng đếm phần còn lại, ra tám dòng dữ liệu. Chương
      trình báo đọc tám dòng, gồm sáu hợp lệ và hai lỗi. Hai cách đếm độc lập khớp
      nhau, nên không dòng nào bị rơi mà không ai biết.
  - show: '<p>Kiểm bất biến cho tệp lỗi: sáu dòng hợp lệ, nạp 12 300 000 và rút 300
      000 (dòng rút <code>abc</code> bị loại, dòng <code>doi</code> bị loại).</p>$$7\,500\,000
      + 4\,000\,000 + 500\,000 = 12\,000\,000 = 12\,300\,000 - 300\,000 \; ✓$$'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Kiểm thêm bất biến cho tệp có lỗi. Chỉ sáu dòng hợp lệ được tính, nạp mười
      hai triệu ba trăm nghìn và rút ba trăm nghìn. Tổng số dư mười hai triệu đúng
      bằng hiệu đó. Bất biến thoả với mọi tập dòng hợp lệ, nên vẫn cần đếm dòng.
- id: scale
  kind: concept
  title: 'Khi sổ cái lớn gấp một nghìn lần: bản nào còn sống?'
  checks:
  - 1000 * 200 == 200000
  - 1000000 * 200 == 200000000
  - 1000000000 * 200 == 200000000000
  - sum((-1 if i % 3 == 0 else 1) * (i % 7 + 1) * 1000 for i in range(1, 1000001))
    == 1333334000
  steps:
  - show: '<p><b>Tệp TaoSoCai.java</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      <span class="kw">throws</span> IOException {</div><div>    <span class="kw">int</span>
      n = Integer.parseInt(args[0]);</div><div>    <span class="kw">try</span> (BufferedWriter
      w = Files.newBufferedWriter(Path.of("lon.csv"))) {</div><div>        w.write("ma,ngay,tai_khoan,loai,so_tien\n");</div><div>        <span
      class="kw">for</span> (<span class="kw">int</span> i = 1; i &lt;= n; i++) {</div><div>            w.write(i
      + ",2026-01-05,A" + String.format("%02d", i % 100) + ","</div><div>                    +
      (i % 3 == 0 ? "rut" : "nap") + "," + (i % 7 + 1) * 1000 + "\n");</div><div>        }</div><div>    }</div><div>    System.out.println("da
      ghi " + n + " dong");</div><div>}</div></div><p class=''note''>Đầu tệp: <code>import
      java.io.BufferedWriter;</code> <code>import java.io.IOException;</code> <code>import
      java.nio.file.Files;</code> <code>import java.nio.file.Path;</code> — Khung:
      <code>public class TaoSoCai {</code></p><p class="note"><code>String.format("%02d",
      7)</code> ra <code>07</code>: số nguyên <b>rộng 2 chữ số</b>, thiếu thì thêm
      số <b>0</b> ở đầu. Nên tài khoản là <code>A07</code>, <code>A42</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    introduces:
    - jv2_fmt02d
    clear: true
    say: Để thử quy mô, ta cần một sổ cái lớn. Chương trình này nhận số dòng ở tham
      số, với một trăm tài khoản, cứ ba dòng có một dòng rút. Mẫu định dạng ở tên
      tài khoản đệm số không vào đầu cho đủ hai chữ số, nên bảy thành không bảy.
  - show: '<p><b>Một triệu dòng, bộ nhớ tối đa 32 megabyte: bản giữ danh sách</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>java -cp out TaoSoCai
      1000000</div><div>da ghi 1000000 dong</div><div><span class="cm"><span>&#36;</span>
      </span>java -Xmx32m -cp out soc.App lon.csv 2&gt;&amp;1 | grep -m1 -o OutOfMemoryError</div><div>OutOfMemoryError</div></div><p
      class=''note''><code>App</code> giữ mọi <code>GiaoDich</code> trong một danh
      sách rồi mới tạo đường ống. <code>OutOfMemoryError</code>: lỗi khi máy ảo hết
      bộ nhớ.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Ta thử quy mô thật với sổ cái một triệu dòng. Bản giữ mọi giao dịch trong
      một danh sách chạy tốt trên tám dòng. Nhưng với giới hạn ba mươi hai megabyte
      thì hết bộ nhớ, vì mỗi bản ghi cùng ba chuỗi và một ngày tốn hàng trăm byte.
  - show: '<p><b>Tệp src/soc/AppSong.java</b></p><div class="code"><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      <span class="kw">throws</span> Exception {</div><div>    Path p = Path.of(args[0]);</div><div>    Map&lt;String,
      Long&gt; song;</div><div>    <span class="kw">try</span> (Stream&lt;String&gt;
      dong = Files.lines(p)) {</div><div>        song = dong.skip(1).parallel().map(d
      -&gt; d.split(","))</div><div>                .collect(Collectors.groupingByConcurrent(f
      -&gt; f[2],</div><div>                        Collectors.summingLong(f -&gt;
      f[3].equals("nap")</div><div>                                ? Long.parseLong(f[4])
      : -Long.parseLong(f[4]))));</div><div>    }</div><div>    TongHop t = <span
      class="kw">new</span> TongHop();</div><div>    DocSoCai.duyet(p, t::them);</div><div>    System.out.println("song
      song khop tuan tu: " + song.equals(t.soDu));</div></div><p class=''note''>Đầu
      tệp: <code>import java.nio.file.Files;</code> <code>import java.nio.file.Path;</code>
      <code>import java.util.Map;</code> <code>import java.util.stream.Collectors;</code>
      <code>import java.util.stream.Stream;</code> — Khung: <code>public class AppSong
      {</code></p>'
    focus:
    - 1
    - 2
    clear: true
    say: Bản song song gọi chia dòng cho nhiều luồng cùng xử lý, và gom bằng bộ gom
      an toàn cho nhiều luồng. Rồi nó đọc lại bằng bản tuần tự và so hai bản đồ có
      bằng nhau không.
  - show: '<p><b>Bản đọc theo dòng (32 MB) và bản song song (64 MB rồi 128 MB)</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>java -Xmx32m -cp
      out soc.AppDong lon.csv</div><div>So tai khoan: 100, dong loi: 0</div><div>Tong
      so du: 1333334000 (khop)</div><div><span class="cm"><span>&#36;</span> </span>java
      -Xmx64m -cp out soc.AppSong lon.csv 2&gt;&amp;1 | grep -m1 -o OutOfMemoryError</div><div>OutOfMemoryError</div><div><span
      class="cm"><span>&#36;</span> </span>java -Xmx128m -cp out soc.AppSong lon.csv</div><div>song
      song khop tuan tu: true</div></div><p class=''note''>Tổng số dư khớp bất biến.
      Song song giữ nhiều dòng cùng lúc nên cần nhiều bộ nhớ hơn đọc theo dòng.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bản đọc theo dòng chỉ giữ một dòng và một bản đồ một trăm tài khoản, nên
      chạy xong và thoả bất biến. Bản song song cho kết quả đúng bằng bản tuần tự
      nhờ bộ gom an toàn. Nhưng nó giữ nhiều dòng cùng lúc, nên với sáu mươi bốn megabyte
      vẫn hết bộ nhớ và cần một trăm hai mươi tám mới chạy. Thay bộ gom bằng bản đồ
      thường thì đó là lỗi tranh chấp của bài về luồng.
  - show: '<table class=''t''><tr><th>số dòng</th><th>1 000</th><th>1 000 000</th><th>1
      000 000 000</th></tr><tr><td>bộ nhớ khi giữ danh sách giao dịch (≥ 200 byte
      mỗi dòng, ước lượng)</td><td>≥ 200 KB</td><td><b>≥ 200 MB</b></td><td><b>≥ 200
      GB</b></td></tr><tr><td>bộ nhớ khi đọc theo dòng (một dòng + bản đồ tài khoản)</td><td>gần
      như nhau</td><td>gần như nhau</td><td>gần như nhau</td></tr><tr><td>thời gian
      đọc (tỉ lệ so với 1 000 dòng)</td><td>×1</td><td>×1 000</td><td><b>×1 000 000</b></td></tr></table><p
      class=''note''>Đánh đổi: đọc theo dòng cho báo cáo <b>một lượt</b>; cần truy
      vấn nhiều kiểu thì phải đọc lại, hoặc đưa dữ liệu vào cơ sở dữ liệu có chỉ mục.
      Song song giúp việc <b>tính toán</b>; việc <b>đọc đĩa</b> bị giới hạn bởi tốc
      độ đĩa.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Giữ danh sách thì bộ nhớ tăng theo số dòng, hai trăm megabyte cho một triệu
      dòng. Đọc theo dòng thì bộ nhớ gần như không đổi, nhưng thời gian vẫn tăng đều.
      Đánh đổi là báo cáo chỉ một lượt, cần truy vấn nhiều kiểu thì dùng cơ sở dữ
      liệu có chỉ mục, và song song chỉ giúp phần tính toán, không giúp đọc đĩa.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Quên bỏ dòng tiêu đề: nó
      bị coi là một giao dịch.</div><p><b>Tệp src/soc/ThuTieuDe.java</b></p><div class="code"><div><span
      class="kw">public</span> <span class="kw">class</span> ThuTieuDe {</div><div>    <span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) {</div><div>        <span class="kw">try</span> {</div><div>            GiaoDich.phanTich("ma,ngay,tai_khoan,loai,so_tien");   <span
      class="cm">// quên bỏ dòng tiêu đề</span></div><div>        } <span class="kw">catch</span>
      (IllegalArgumentException e) {</div><div>            System.out.println(e.getMessage());</div><div>        }</div><div>    }</div><div>}</div></div><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>java -cp out soc.ThuTieuDe</div><div>so
      tien khong hop le: so_tien</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất là quên bỏ dòng tiêu đề. Dòng chữ tên các cột bị đưa vào hàm
      phân tích như một giao dịch, và cột tiền chứa chữ so tiền gạch dưới. Nó báo
      lỗi rõ ràng, nhưng nếu ta nuốt lỗi thì mất một dòng và không ai để ý.
  - show: '<div class="box warn"><b>Lỗi 2 (người đã đi làm).</b> Bỏ dòng lỗi lặng
      lẽ: bất biến vẫn khớp, báo cáo vẫn trông đúng.</div><p>Báo cáo trên tệp lỗi
      vẫn in <b>(khop)</b> dù mất 2 dòng. Chỉ có <b>đối chiếu số dòng</b> (8 = 6 +
      2) và <b>nhật ký cảnh báo</b> mới phát hiện được.</p><p>Quy tắc: mỗi dòng bị
      loại phải để lại <b>dấu vết</b> (nhật ký) và <b>con số</b> (đếm), và con số
      đó phải đối chiếu được với nguồn.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai hay gặp ở người đã đi làm. Bỏ dòng lỗi lặng lẽ, bất biến vẫn
      khớp và báo cáo vẫn trông đúng, dù mất hai dòng. Chỉ đối chiếu số dòng và nhật
      ký cảnh báo mới phát hiện được. Mỗi dòng bị loại phải để lại dấu vết và một
      con số đối chiếu được với nguồn.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Thiếu một ca kiểm:
      dòng giao dịch số tiền âm lọt vào sổ cái.</div><p><b>Gỡ kiểm tra tiền dương
      rồi chạy lại bộ kiểm thử</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>sed -i ''s/tien &lt;= 0/false/'' src/soc/GiaoDich.java</div><div><span
      class="cm"><span>&#36;</span> </span>javac -d out src/soc/*.java &amp;&amp;
      java -cp out soc.KiemTra | grep -v DAT</div><div>HONG so tien am</div><div>dat
      6, hong 1</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba cũng của người đã đi làm. Kiểm tra số tiền phải dương nằm lặng
      lẽ trong hàm phân tích. Ta gỡ nó đi rồi chạy lại bộ kiểm thử, và đúng một ca
      báo hỏng, là ca số tiền âm. Nếu chưa từng viết ca đó thì kiểm tra có thể bị
      xoá mà mọi cổng vẫn xanh, và nạp âm sẽ lẳng lặng thành rút.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 900 - 250 + 100 == 750
  - 750 + 400 == 1150
  - (900 + 400 + 100) - 250 == 1150
  - 5 == 4 + 1
  steps:
  - show: '<p><b>Đề.</b> Sổ cái 5 dòng (<code>tai_khoan,loai,so_tien</code>): <code>X,nap,900</code>;
      <code>Y,nap,400</code>; <code>X,rut,250</code>; <code>Y,rut,xx</code>; <code>X,nap,100</code>.</p>

      <ol><li>Số dư X, Y sau khi bỏ dòng lỗi? Tổng số dư? Bất biến <code>nap − rut</code>
      có khớp không?</li>

      <li>Đối chiếu số dòng: đọc = hợp lệ + lỗi = ?</li></ol>

      <p><b>Chọn A hay B?</b> Báo cáo cho tệp 50 GB trên máy 8 GB. A: <code>List</code>
      rồi <code>stream()</code>. B: bộ gom cộng dồn khi đọc từng dòng. Muốn thêm <code>parallel()</code>
      thì bộ gom cần điều kiện gì?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 30
    say: Bây giờ tới phần bạn tự làm. Sổ cái năm dòng, một dòng lỗi. Hãy tính số dư
      hai tài khoản sau khi bỏ dòng lỗi, tổng số dư, bất biến có khớp không, và đối
      chiếu số dòng. Rồi chọn giữa danh sách với đường ống, hoặc bộ gom cộng dồn khi
      đọc từng dòng, cho tệp năm mươi gigabyte trên máy tám gigabyte. Và nói bộ gom
      cần điều kiện gì để chạy song song. Hãy dừng video và tự làm.
  - show: <table class='t'><tr><th>câu</th><th>đáp án</th><th>vì sao</th></tr><tr><td>1</td><td>X
      = 900 − 250 + 100 = <b>750</b>; Y = <b>400</b>; tổng <b>1 150</b>; nạp 1 400
      − rút 250 = <b>1 150</b> ✓</td><td>dòng <code>Y,rut,xx</code> bị loại; bất biến
      thoả</td></tr><tr><td>2</td><td><b>5 = 4 hợp lệ + 1 lỗi</b></td><td>bất biến
      không thấy dòng bị loại; đối chiếu số dòng mới thấy</td></tr><tr><td>3</td><td><b>B</b>;
      bộ gom phải <b>an toàn cho nhiều luồng</b></td><td>A cần ≥ 200 byte × số dòng
      ≫ 8 GB; B giữ bộ nhớ không đổi; song song cần bản đồ/bộ cộng an toàn</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    say: Đáp án câu một, số dư của X là chín trăm trừ hai trăm năm mươi cộng một trăm,
      bằng bảy trăm năm mươi. Y là bốn trăm. Tổng một nghìn một trăm năm mươi, bằng
      nạp một nghìn bốn trăm trừ rút hai trăm năm mươi. Câu hai, năm dòng bằng bốn
      hợp lệ cộng một lỗi. Câu ba chọn phương án B, vì danh sách cần nhiều hơn tám
      gigabyte, còn bộ gom giữ bộ nhớ không đổi. Muốn song song thì bộ gom phải an
      toàn cho nhiều luồng.
    clear: true
  - show: <div class="box key"><b>Quy tắc:</b> mỗi dòng bị loại phải <b>có dấu vết
      và có số đếm</b>; hai cách đếm độc lập phải <b>khớp</b>; tệp lớn thì <b>đọc
      theo dòng</b>; song song chỉ khi <b>bộ gom an toàn</b>.</div>
    say: Quy tắc rút ra. Mỗi dòng bị loại phải có dấu vết và số đếm. Hai cách đếm
      độc lập phải khớp. Tệp lớn thì đọc theo dòng, và song song chỉ khi bộ gom an
      toàn.
