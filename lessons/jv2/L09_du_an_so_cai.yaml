  title: 'Khi sổ cái lớn gấp một nghìn lần: bản nào còn sống?'
  checks:
  - 1000 * 200 == 200000
  - 1000000 * 200 == 200000000
  - 1000000000 * 200 == 200000000000
  - sum((-1 if i % 3 == 0 else 1) * (i % 7 + 1) * 1000 for i in range(1, 1000001))
    == 1333334000
  steps:
  - show: '<p><b>Một triệu dòng, bộ nhớ tối đa 32 megabyte: bản giữ danh sách</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>java -cp out TaoSoCai
      1000000</div><div>da ghi 1000000 dong</div><div><span class="cm"><span>&#36;</span>
      </span>java -Xmx32m -cp out soc.App lon.csv 2&gt;&amp;1 | grep -m1 -o OutOfMemoryError</div><div>OutOfMemoryError</div></div><p
      class=''note''><code>App</code> giữ mọi <code>GiaoDich</code> trong một danh
