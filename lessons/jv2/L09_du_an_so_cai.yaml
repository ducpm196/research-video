- {sentence: "Nhưng với giới hạn ba mươi hai megabyte thì hết bộ nhớ, vì mỗi bản ghi cùng ba chuỗi và một ngày tốn hàng trăm byte.", reason: "ASR chép “Nhưng với giới hạn 32 MB thì hết bộ nhớ, vì mỗi bản ghi cùng 3 chuỗi và 1 ngày tốn hàng trăm bai.” (0.926): “mê-ga-…” đọc tách âm tiết (đã dựng ở NET), ASR viết dạng gộp; “megabyte” đọc theo luật lexicon (lexicon_vi.JV2.yaml: “mê-ga-bai”), ASR viết “mb” — NOT_VERIFIED bằng tai người"}
