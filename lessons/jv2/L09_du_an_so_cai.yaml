    clear: true
    say: Cuối ngày, ngân hàng có một tệp sổ cái cả triệu dòng, cần báo cáo số dư theo
      tài khoản và theo tháng. Báo cáo phải đúng, dòng lỗi phải được ghi lại chứ không
      làm hỏng báo cáo, và chương trình phải chạy được dù tệp lớn. Đây là lúc ghép
      mọi thứ đã học thành một dự án thật.
  - show: '<div class="box key">Hôm nay: <b>dự án tình huống</b>. Dự án nhiều tệp
      trong một gói; đọc tệp từng dòng; bản ghi và đường ống; kiểm thử; nhật ký cảnh
      báo; <b>bất biến tổng số dư = tổng nạp − tổng rút</b>;

      và câu hỏi cuối: <b>khi tệp lớn gấp một nghìn lần</b>, thiết kế nào còn sống?</div>

      '
    clear: true
    say: Hôm nay ta làm dự án tình huống, ghép nhiều tệp trong một gói. Có thêm một
      bất biến, tổng số dư bằng tổng nạp trừ tổng rút. Câu hỏi cuối là khi tệp lớn
      gấp một nghìn lần thì thiết kế nào còn sống.
- id: prereq
  kind: prereq
  title: 'Ôn lại: chín bài trước, mỗi bài một mảnh'
  steps:
  - show: <table class='t'><tr><th>mảnh</th><th>bài</th><th>dùng ở đâu trong dự án</th></tr><tr><td>gói,
