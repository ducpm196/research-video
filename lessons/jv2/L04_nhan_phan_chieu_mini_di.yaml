  - show: '$$④ \; \text{phí} = 5\,000\,000 / 1\,000 = \hl{5\,000}$$<p>Hàm <code>chuyen(5
      000 000)</code> in: <code>so du 1000000, phi 5000</code> ✓ (số dư 1 000 000
      là số minh hoạ của kho).</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Phép làm thứ tư, gọi hàm chuyển với năm triệu. Phí là năm triệu chia một
      nghìn, bằng năm nghìn. Số dư một triệu là số minh hoạ mà kho trả về. Kết quả
      ta kỳ vọng in ra là số dư một triệu và phí năm nghìn.
  - show: $$⑤ \; \text{xin } \texttt{KhoDuLieu} \text{ lần nữa} \Rightarrow \text{trả
      đúng đối tượng cũ, hộp vẫn } \hl{3}$$<div class="code"><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      <span class="kw">throws</span> Exception {</div><div>    ChuyenTien c = (ChuyenTien)
      lay(ChuyenTien.<span class="kw">class</span>);</div><div>    System.out.println(c.chuyen(5000000));</div><div>    System.out.println(c.kho
      == lay(KhoDuLieu.<span class="kw">class</span>));</div><div>    System.out.println(hop.size());</div><div>    System.out.println(ChuyenTien.<span
      class="kw">class</span>.isAnnotationPresent(KhongGiu.<span class="kw">class</span>));</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>so du 1000000, phi 5000</div><div>true</div><div>3</div><div>false</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ năm, xin kho dữ liệu lần nữa thì nhận lại đúng đối tượng cũ,
      hộp vẫn là ba. Chạy thật, bốn dòng in ra khớp. Số dư và phí như tính tay, hai
