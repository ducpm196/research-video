- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: nhìn vào tệp lớp bằng công cụ javap'
  checks:
  - 1 + 2 == 3
  steps:
  - show: '<p><b>Lệnh javap in nội dung tệp lớp; lọc các dòng nhãn mức lớp</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>javap -v -p ''MiniDi<span>&#36;</span>ChuyenTien''
      | grep -E ''^Runtime|^ {4}MiniDi''</div><div>RuntimeVisibleAnnotations:</div><div>    MiniDi<span>&#36;</span>ThanhPhan</div><div>RuntimeInvisibleAnnotations:</div><div>    MiniDi<span>&#36;</span>KhongGiu</div></div><p
      class=''note''><code>javap -v -p</code>: in nội dung tệp lớp (<code>-v</code>
      chi tiết, <code>-p</code> cả phần riêng tư). Mẫu lọc: dòng bắt đầu bằng <code>Runtime</code>,
      hoặc bắt đầu bằng đúng <b>bốn dấu cách</b> rồi <code>MiniDi</code> (<code>{4}</code>
      là bốn lần).</p><p class=''note''>Nhãn có <code>RUNTIME</code> nằm ở mục <b>Visible</b>
      (đọc được lúc chạy); nhãn không khai thời hạn nằm ở mục <b>Invisible</b> (có
      trong tệp, nhưng phản chiếu không thấy).</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Cách kiểm khác là không tin chương trình, mà nhìn thẳng vào tệp lớp bằng
      công cụ in nội dung tệp lớp của bộ công cụ. Mẫu lọc giữ các dòng tên mục, và
      các dòng tên nhãn thụt vào bốn dấu cách. Ta thấy nhãn thành phần nằm ở mục nhìn
      thấy được lúc chạy, còn nhãn không giữ nằm ở mục không nhìn thấy. Điều đó khớp
      với dòng cuối cùng của chương trình, vì dòng ấy in ra sai cho nhãn không giữ.
    introduces:
    - jv2_javap
  - show: '<p>Kiểm đếm: hộp có <b>3</b> đối tượng = số lớp có <code>@ThanhPhan</code>
      ta đã xin (<code>ChuyenTien</code>) + số trường <code>@Tiem</code> của nó (2)
      = 1 + 2.</p>'
    clear: true
    say: Ta kiểm thêm bằng cách đếm. Ba đối tượng trong hộp bằng số lớp ta xin trực
      tiếp là một, cộng số trường có nhãn tiêm của nó là hai, nên con số này khớp.
- id: scale
  kind: concept
  title: 'Khi một triệu yêu cầu đi qua: dùng chung hay tạo mới mỗi lần?'
  checks:
  - 3 * 1000 == 3000
  - 3 * 1000000 == 3000000
  steps:
  - show: '<div class="code"><div><span class="kw">@Retention</span>(RetentionPolicy.RUNTIME)
      <span class="kw">@interface</span> Tiem {}</div><div><span class="kw">static</span>
      <span class="kw">int</span> soDoiTuong = 0;                                <span
      class="cm">// đếm số lần gọi hàm tạo</span></div><div> </div><div><span class="kw">static</span>
      <span class="kw">class</span> Kho { Kho() { soDoiTuong++; } }</div><div><span
      class="kw">static</span> <span class="kw">class</span> Phi { Phi() { soDoiTuong++;
      } }</div><div><span class="kw">static</span> <span class="kw">class</span> Chuyen
      {</div><div>    <span class="kw">@Tiem</span> Kho kho;</div><div>    <span class="kw">@Tiem</span>
      Phi phi;</div><div>    Chuyen() { soDoiTuong++; }</div><div>}</div><div> </div><div><span
      class="kw">static</span> Map&lt;Class&lt;?&gt;, Object&gt; hop = <span class="kw">new</span>
      HashMap&lt;&gt;();</div></div><p class=''note''>Đầu tệp: <code>import java.lang.reflect.Field;</code>
      <code>import java.lang.annotation.Retention;</code> <code>import java.lang.annotation.RetentionPolicy;</code>
      <code>import java.util.HashMap;</code> <code>import java.util.Map;</code> —
      Khung: <code>public class QuyMo {</code> … <code>public static void main(String[]
      args) throws Exception {</code></p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bây giờ là chuyện quy mô. Mỗi lớp có hàm tạo tăng một biến đếm, nên biến
      đếm cho biết đã tạo bao nhiêu đối tượng. Lớp chuyển tiền cần kho và dịch vụ
      phí, nên mỗi yêu cầu cần ba đối tượng.
  - show: '<div class="code"><div><span class="kw">static</span> Object lay(Class&lt;?&gt;
      loai, <span class="kw">boolean</span> chung) <span class="kw">throws</span>
      Exception {</div><div>    <span class="kw">if</span> (chung &amp;&amp; hop.containsKey(loai))
      {</div><div>        <span class="kw">return</span> hop.get(loai);                             <span
      class="cm">// dùng lại: một bản cho mọi yêu cầu</span></div><div>    }</div><div>    Object
      o = loai.getDeclaredConstructor().newInstance();</div><div>    hop.put(loai,
      o);</div><div>    <span class="kw">for</span> (Field f : loai.getDeclaredFields())
      {</div><div>        <span class="kw">if</span> (f.isAnnotationPresent(Tiem.<span
      class="kw">class</span>)) {</div><div>            f.setAccessible(<span class="kw">true</span>);</div><div>            f.set(o,
      lay(f.getType(), chung));</div><div>        }</div><div>    }</div><div>    <span
      class="kw">return</span> o;</div></div>'
    clear: true
    say: Ta thêm một công tắc vào bộ chứa. Bật dùng chung thì lần sau lấy lại đối
      tượng cũ trong hộp. Tắt thì tạo mới cho mỗi yêu cầu, và vẫn tiêm các trường
      như trước.
  - show: '<div class="code"><div>    <span class="kw">public</span> <span class="kw">static</span>
      <span class="kw">void</span> main(String[] args) <span class="kw">throws</span>
      Exception {</div><div>        <span class="kw">int</span>[] soYeuCau = {1000,
      1000000};</div><div>        <span class="kw">for</span> (<span class="kw">int</span>
      n : soYeuCau) {</div><div>            <span class="kw">for</span> (<span class="kw">boolean</span>
      chung : <span class="kw">new</span> <span class="kw">boolean</span>[]{<span
      class="kw">true</span>, <span class="kw">false</span>}) {</div><div>                soDoiTuong
      = 0;</div><div>                hop.clear();</div><div>                <span
      class="kw">for</span> (<span class="kw">int</span> i = 0; i &lt; n; i++) {</div><div>                    lay(Chuyen.<span
      class="kw">class</span>, chung);</div><div>                }</div><div>                String
      cach = chung ? " dung chung: " : " moi lan: ";</div><div>                System.out.println("yeu
      cau " + n + cach + soDoiTuong + " doi tuong");</div><div>            }</div><div>        }</div><div>    }</div><div>}</div></div>'
    clear: true
    say: Hàm chính chạy hai cỡ, một nghìn rồi một triệu yêu cầu, mỗi cỡ thử cả hai
      cách. Cuối mỗi lượt nó in số lần hàm tạo đã được gọi.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>yeu cau 1000 dung chung:
      3 doi tuong</div><div>yeu cau 1000 moi lan: 3000 doi tuong</div><div>yeu cau
      1000000 dung chung: 3 doi tuong</div><div>yeu cau 1000000 moi lan: 3000000 doi
      tuong</div></div><table class=''t''><tr><th>số yêu cầu</th><th>dùng chung</th><th>tạo
      mới mỗi lần</th></tr><tr><td>1 000</td><td>3</td><td>3 000</td></tr><tr><td>1
      000 000</td><td>3</td><td><b>3 000 000</b></td></tr></table>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Kết quả thật. Dùng chung thì lúc nào cũng chỉ có ba đối tượng, dù một nghìn
      hay một triệu yêu cầu. Tạo mới mỗi lần thì ba nghìn, rồi ba triệu đối tượng,
      tăng đúng theo số yêu cầu, mỗi đối tượng lại cần bộ thu gom rác dọn. Đây là
      lý do Spring mặc định dùng chung một bản cho mỗi thành phần.
  - show: '<div class="box warn"><b>Đánh đổi:</b> một bản dùng chung cho mọi yêu cầu
      nghĩa là mọi yêu cầu cùng <b>sửa chung</b> các trường của nó.

      Ở máy chủ, các yêu cầu chạy <b>đồng thời</b>, nên thành phần dùng chung phải
      <b>không có trạng thái thay đổi</b>, hoặc phải khoá. Ta sẽ thấy lỗi này ở bài
      về luồng.</div>

      '
    forward_ref: true
    say: Nhưng có đánh đổi. Một bản dùng chung cho mọi yêu cầu nghĩa là mọi yêu cầu
      cùng sửa chung các trường của nó. Ở máy chủ, các yêu cầu chạy đồng thời, nên
      thành phần dùng chung phải không có trạng thái thay đổi, hoặc phải có khoá.
      Ta sẽ thấy lỗi này ở bài về luồng.
  - show: '<div class="box key"><b>Nửa còn lại của câu hỏi mở đầu:</b> <code>@Transactional</code>
      không do bộ chứa tiêm trường làm. Spring bọc đối tượng trong một <b>đối tượng
      đại diện</b> (proxy, kỹ thuật AOP) chặn mỗi lời gọi hàm: mở giao dịch trước,
      chốt hoặc hoàn tác sau. Đó là cơ chế khác, ngoài phạm vi bài này.</div>'
    clear: true
    say: Giờ trả lời nốt nửa còn lại của câu hỏi mở đầu. Nhãn giao dịch không do bộ
      chứa tiêm trường làm. Spring bọc đối tượng trong một đối tượng đại diện, chặn
      mỗi lời gọi hàm, mở giao dịch trước và chốt hoặc hoàn tác sau. Đó là một cơ
      chế khác, nằm ngoài bài này.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Gõ sai tên hàm mà không
      có <code>@Override</code> thì im lặng; có thì được báo ngay.</div><div class="code"><div><span
      class="kw">interface</span> Phi {</div><div>    <span class="kw">long</span>
      tinh(<span class="kw">long</span> soTien);</div><div>}</div><div> </div><div><span
      class="kw">static</span> <span class="kw">class</span> PhiThuong <span class="kw">implements</span>
      Phi {</div><div>    <span class="kw">@Override</span></div><div>    <span class="kw">public</span>
      <span class="kw">long</span> tinhh(<span class="kw">long</span> soTien) {                      <span
      class="cm">// gõ thừa chữ h</span></div><div>        <span class="kw">return</span>
      soTien / 1000;</div><div>    }</div><div>}</div><div> </div></div><p class=''note''>Khung:
      <code>public class SaiTen {</code> … <code>public static void main(String[]
      args) {</code></p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ nhất là gõ thừa một chữ trong tên hàm. Giao diện đòi một hàm tên
      tinh, lớp cài giao diện đó gõ thừa chữ h. Nhãn ghi đè là một nhãn mà trình biên
      dịch đọc ngay lúc biên dịch. Nó nói tôi chắc chắn hàm này ghi đè một hàm cha,
      và trình biên dịch kiểm lời hứa đó.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div><span class="cm">error:
      PhiThuong is not abstract and does not override abstract method tinh(long) in
      Phi</span></div><div><span class="cm">    static class PhiThuong implements
      Phi {</span></div><div><span class="cm">           ^</span></div><div><span
      class="cm">error: method does not override or implement a method from a supertype</span></div><div><span
      class="cm">        @Override</span></div><div><span class="cm">        ^</span></div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Hứa sai thì báo lỗi ngay. Không có nhãn này, ta sẽ có một hàm mới tinh, hàm
      cũ vẫn trống, và chương trình chạy sai mà không báo gì.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Quên khai thời hạn giữ
      nhãn.</div><div class="code"><div><span class="kw">@Retention</span>(RetentionPolicy.RUNTIME)</div><div><span
      class="kw">@interface</span> Giu {}</div><div> </div><div><span class="kw">@interface</span>
      KhongGiu {}                                    <span class="cm">// quên thời
      hạn giữ</span></div><div> </div><div><span class="kw">@Giu</span> <span class="kw">@KhongGiu</span></div><div><span
      class="kw">static</span> <span class="kw">class</span> A {}</div><div> </div><div><span
      class="kw">public</span> <span class="kw">static</span> <span class="kw">void</span>
      main(String[] args) {</div><div>    System.out.println("giu: " + A.<span class="kw">class</span>.isAnnotationPresent(Giu.<span
      class="kw">class</span>));</div><div>    System.out.println("khong giu: " +
      A.<span class="kw">class</span>.isAnnotationPresent(KhongGiu.<span class="kw">class</span>));</div></div><p
      class=''note''>Đầu tệp: <code>import java.lang.annotation.Retention;</code>
      <code>import java.lang.annotation.RetentionPolicy;</code> — Khung: <code>public
      class QuenGiu {</code></p>'
    focus:
    - 1
    - 2
    clear: true
    say: Lỗi thứ hai là quên khai thời hạn giữ nhãn. Nhãn không khai thì có trong
      tệp lớp nhưng bị bỏ khi nạp, nên phản chiếu hỏi thì nhận câu trả lời là không
      có.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>giu: true</div><div>khong
      giu: false</div></div>'
    clear: true
    say: Bộ chứa của ta sẽ lặng lẽ bỏ qua mọi thành phần, nên không có lỗi nào, chỉ
      là không có gì xảy ra.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Hai lớp cần nhau
      khi tạo qua hàm tạo: vòng phụ thuộc.</div><div class="code"><div><span class="kw">import</span>
      java.lang.reflect.Constructor;</div><div><span class="kw">import</span> java.util.HashSet;</div><div><span
      class="kw">import</span> java.util.Set;</div><div> </div><div><span class="kw">public</span>
      <span class="kw">class</span> VongTron {</div><div>    <span class="kw">static</span>
      Set&lt;Class&lt;?&gt;&gt; dangTao = <span class="kw">new</span> HashSet&lt;&gt;();</div><div>
      </div><div>    <span class="kw">static</span> <span class="kw">class</span>
      A { A(B b) {} }</div><div>    <span class="kw">static</span> <span class="kw">class</span>
      B { B(A a) {} }                              <span class="cm">// A cần B, B
      cần A</span></div></div><p class=''note''>Khung: <code>public static void main(String[]
      args) throws Exception {</code></p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ ba hay gặp ở người đã đi làm là vòng phụ thuộc. Lớp A cần B ngay
      trong hàm tạo, lớp B cần A. Muốn tạo A thì phải có B, muốn tạo B thì phải có
      A, và không có đối tượng nào để dở dang cất vào hộp, vì hàm tạo chưa chạy xong.
  - show: '<div class="code"><div><span class="kw">static</span> Object tao(Class&lt;?&gt;
      loai) <span class="kw">throws</span> Exception {</div><div>    <span class="kw">if</span>
      (!dangTao.add(loai)) {</div><div>        <span class="kw">throw</span> <span
      class="kw">new</span> IllegalStateException("vong phu thuoc tai " + loai.getSimpleName());</div><div>    }</div><div>    Constructor&lt;?&gt;
      ham = loai.getDeclaredConstructors()[0];</div><div>    Object[] doiSo = <span
      class="kw">new</span> Object[ham.getParameterCount()];</div><div>    <span class="kw">for</span>
      (<span class="kw">int</span> i = 0; i &lt; doiSo.length; i++) {</div><div>        doiSo[i]
      = tao(ham.getParameterTypes()[i]);</div><div>    }</div><div>    dangTao.remove(loai);</div><div>    <span
      class="kw">return</span> ham.newInstance(doiSo);</div><div>}</div></div><p class=''note''><code>Constructor</code>:
      đối tượng mô tả <b>một hàm tạo</b>; <code>getParameterTypes()</code> cho kiểu
      các tham số của nó.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bộ chứa cần một tập ghi những lớp đang tạo. Vào hàm tạo lớp nào thì thêm
      lớp đó vào tập, nếu đã có sẵn nghĩa là ta đang đi vòng, thì ném lỗi. Tạo xong
      các tham số thì mới bỏ lớp ra khỏi tập. Mỗi hàm tạo cũng được mô tả bằng một
      đối tượng, cho ta kiểu của từng tham số.
  - show: <div class="code"><div>    <span class="kw">public</span> <span class="kw">static</span>
      <span class="kw">void</span> main(String[] args) <span class="kw">throws</span>
      Exception {</div><div>        <span class="kw">try</span> {</div><div>            tao(A.<span
      class="kw">class</span>);</div><div>        } <span class="kw">catch</span>
      (IllegalStateException e) {</div><div>            System.out.println(e.getMessage());</div><div>        }</div><div>    }</div><div>}</div></div>
    clear: true
    say: Hàm chính thử tạo A và bắt lỗi vòng để in thông báo ra màn hình.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>vong phu thuoc tai A</div></div><p
      class=''note''>Cách giải tốt nhất: <b>tách một lớp thứ ba</b> để xoá vòng. Bộ
      chứa tự viết của ta chịu được vòng nếu tiêm vào trường (đối tượng dở dang đã
      nằm trong hộp), nhưng Spring Boot từ bản 2.6 cấm vòng theo mặc định, kể cả tiêm
      vào trường. Dự án thật nên tiêm qua hàm tạo: trường bắt buộc hiện rõ, đối tượng
      dựng xong là dùng được.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Kết quả thật, bộ chứa phát hiện vòng và dừng, thay vì chạy mãi. Cách giải
      tốt nhất là tách ra một lớp thứ ba để xoá vòng, vì vòng phụ thuộc thường là
      dấu hiệu thiết kế lẫn lộn trách nhiệm. Bộ chứa tự viết chịu được vòng khi tiêm
      vào trường, nhưng Spring Boot từ bản hai chấm sáu cấm vòng theo mặc định. Dự
      án thật nên tiêm qua hàm tạo.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 1 + 2 == 3
  - len({'A', 'B', 'C'}) == 3
  steps:
  - show: '<p><b>Đề.</b> Bộ chứa trong bài với ba lớp <code>A</code>, <code>B</code>,
      <code>C</code> đều có <code>@ThanhPhan</code>. <code>A</code> có hai trường
      <code>@Tiem B b</code>, <code>@Tiem C c</code> (khai báo theo thứ tự đó); <code>B</code>
      có một trường <code>@Tiem C c</code>; <code>C</code> không có trường nào. Giả
      sử máy duyệt trường theo thứ tự khai báo (thường như vậy, nhưng đặc tả không
      bảo đảm).</p>

      <ol><li>Sau <code>lay(A.class)</code>, <code>hop</code> có mấy đối tượng? Thứ
      tự các lớp được <b>tạo</b>?</li>

      <li>Nếu <code>@Tiem</code> bị quên <code>@Retention(RUNTIME)</code> thì <code>hop.size()</code>
      bằng mấy?</li></ol>

      <p><b>Chọn A hay B?</b> Thành phần giữ <b>số dư tạm</b> của từng khách. A: một
      bản dùng chung. B: một bản cho mỗi yêu cầu. Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 3
    - 3
    pause: 30
    say: Bây giờ tới phần bạn tự làm. Ba lớp A, B, C đều có nhãn thành phần. A cần
      B và C, khai báo theo thứ tự đó, B cần C, C không cần gì. Giả sử máy duyệt trường
      theo thứ tự khai báo. Hãy tính sau khi lấy A thì hộp có mấy đối tượng, và thứ
      tự tạo. Rồi nếu nhãn tiêm bị quên khai thời hạn giữ thì hộp có mấy đối tượng.
      Cuối cùng chọn giữa một bản dùng chung và một bản cho mỗi yêu cầu cho thành
      phần giữ số dư tạm của từng khách, và giải thích. Hãy dừng video và tự làm.
  - show: '<table class=''t''><tr><th>câu</th><th>đáp án</th><th>vì sao</th></tr><tr><td>1</td><td><b>3</b>;
      thứ tự tạo: A, rồi B, rồi C</td><td>A vào hộp trước; tiêm <code>b</code> &rarr;
      tạo B; B tiêm <code>c</code> &rarr; tạo C; sau đó tiêm <code>c</code> của A:
      C đã có, dùng lại. Nếu máy duyệt <code>c</code> trước thì thứ tự là A, C, B;
      số đối tượng vẫn là 3</td></tr><tr><td>2</td><td><b>1</b></td><td>nhãn tiêm
      không được giữ nên không trường nào được tiêm; chỉ có A</td></tr><tr><td>3</td><td><b>B</b>:
      mỗi yêu cầu một bản</td><td>bản dùng chung bị mọi yêu cầu đồng thời ghi đè số
      dư tạm lẫn nhau</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án câu một, hộp có ba đối tượng, và thứ tự tạo là A, rồi B, rồi C. A
      vào hộp trước, tiêm trường b thì tạo B, B tiêm trường c thì tạo C. Khi tiêm
      trường c của A thì C đã có sẵn nên dùng lại. Nếu máy duyệt trường c trước thì
      thứ tự đổi thành A, C, B, nhưng số đối tượng vẫn là ba. Câu hai, nhãn tiêm không
      được giữ thì không trường nào được tiêm, hộp chỉ có A, tức là một. Câu ba chọn
      phương án B, vì bản dùng chung bị mọi yêu cầu đồng thời ghi đè số dư tạm lên
      nhau.
    clear: true
  - show: <div class="box key"><b>Quy tắc:</b> thành phần dùng chung phải <b>không
      giữ trạng thái riêng của từng yêu cầu</b>. Cần trạng thái riêng thì truyền qua
      tham số, hoặc tạo bản riêng cho mỗi yêu cầu.</div>
    say: Quy tắc rút ra. Thành phần dùng chung không được giữ trạng thái riêng của
      từng yêu cầu. Cần trạng thái riêng thì truyền qua tham số, hoặc tạo bản riêng
      cho mỗi yêu cầu.
- id: practice
  kind: practice
  title: 'Tự làm: bộ chứa tiêm phụ thuộc cho kho hàng'
  steps:
  - show: '<p><b>Đề</b>: tự viết <b>bộ chứa</b> cỡ nhỏ, ba lớp có sẵn trong <code>de.md</code>.</p>

      <ol><li>Hai nhãn <code>@ThanhPhan</code>, <code>@Tiem</code> với <code>@Retention(RUNTIME)</code>.</li>

      <li><code>lay(Class)</code>: có trong <code>hop</code> thì trả; chưa thì tạo,
      <b>bỏ vào hop trước</b>, rồi tiêm các trường <code>@Tiem</code>.</li>

      <li><code>main</code>: lấy <code>DonHang</code>, in ba dòng.</li></ol>

      <p class="note">Tệp <code>MiniDiKho.java</code>; mã ba lớp có sẵn ở <code>labs/JV2/L04/de.md</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 240
    say: Bây giờ tới phần bạn tự làm trên máy. Hãy tự viết một bộ chứa tiêm phụ thuộc
      nhỏ cho ba lớp có sẵn trong đề bài. Viết hai nhãn giữ đến lúc chạy. Viết hàm
      lấy đối tượng, nếu đã có thì trả lại, nếu chưa thì tạo, bỏ vào hộp trước, rồi
      tiêm các trường có nhãn. Cuối cùng lấy đơn hàng và in ba dòng. Hãy dừng video
      và tự viết, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>Tong gia tri kho:
      540000</div><div>Cung mot BangGia: true</div><div>So thanh phan: 3</div></div><p
      class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh JV2 L04 MiniDiKho.java</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> <code>for (Field f : loai.getDeclaredFields())
      if (f.isAnnotationPresent(Tiem.class)) { f.setAccessible(true); f.set(o, lay(f.getType()));
      }</code>.

      Nhớ <code>hop.put(loai, o)</code> <b>trước</b> vòng lặp trường. Lời giải: <code>labs/JV2/L04/loi_giai.java</code>
      — chỉ mở sau khi đã thử.</div>

      '
    say: Nếu kẹt, duyệt các trường khai báo của lớp. Trường nào có nhãn tiêm thì mở
      quyền truy cập rồi gán bằng cách lấy đối tượng của kiểu trường. Nhớ bỏ đối tượng
      vào hộp trước khi duyệt trường. Lời giải đầy đủ nằm trong thư mục thực hành
      của bài, chỉ mở sau khi bạn đã tự thử.
  lab: labs/JV2/L04
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>nhãn = dữ liệu gắn vào mã</span><span
      class=''a''>→</span><span class=''n''>RUNTIME: giữ đến lúc chạy</span><span
      class=''a''>→</span><span class=''n''>phản chiếu đọc nhãn, tạo, gán</span><span
      class=''a''>→</span><span class=''n''>hộp: một bản mỗi lớp</span><span class=''a''>→</span><span
      class=''n''>bỏ vào hộp trước khi tiêm</span><span class=''a''>→</span><span
      class=''n''>dùng chung thì không giữ trạng thái riêng</span></div>'
    say: Tổng kết chuỗi logic. Nhãn là dữ liệu gắn vào mã, tự nó không làm gì. Muốn
      đọc được lúc chạy phải khai thời hạn giữ. Phản chiếu đọc nhãn, tạo đối tượng
      và gán trường. Hộp giữ một bản cho mỗi lớp. Bỏ vào hộp trước khi tiêm để tránh
      tạo mãi. Và thành phần dùng chung thì không được giữ trạng thái riêng của từng
      yêu cầu.
  - show: '<div class=''box key''><b>Tư duy:</b> khi thấy một nhãn như <code>@Service</code>
      hay <code>@Transactional</code>, hỏi ba câu: <b>ai đọc</b> nhãn này (lúc biên
      dịch hay lúc chạy),

      nó <b>quản lý bao nhiêu bản</b> của đối tượng, và có <b>vòng phụ thuộc</b> hay
      trạng thái chung nào bị giấu sau nhãn không.</div>

      '
    say: Điều cần mang theo. Khi thấy một nhãn như nhãn dịch vụ hay nhãn giao dịch,
      hãy hỏi ba câu. Ai đọc nhãn này, lúc biên dịch hay lúc chạy. Nó quản lý bao
      nhiêu bản của đối tượng. Và có vòng phụ thuộc hay trạng thái chung nào bị giấu
      sau nhãn không.
