  - show: <p><b>② Trường thứ nhất</b> <code>kho</code> có <code>@Tiem</code> &rarr;
      <code>lay(KhoDuLieu)</code> &rarr; tạo, bỏ vào hộp, gán.</p><p><b>③ Trường thứ
