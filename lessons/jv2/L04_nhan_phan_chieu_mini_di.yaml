      | grep -E '^Runtime|^    MiniDi'</div><div>RuntimeVisibleAnnotations:</div><div>    MiniDi<span>&#36;</span>ThanhPhan</div><div>RuntimeInvisibleAnnotations:</div><div>    MiniDi<span>&#36;</span>KhongGiu</div></div><p
      class='note'>Nhãn có <code>RUNTIME</code> nằm ở mục <b>Visible</b> (đọc được
