scenes:
- id: hook
  kind: hook
  title: Chỉ một dòng nhãn, vì sao chương trình tự đổi hành vi?
  steps:
  - show: '<div class="box key"><p>Bạn sẽ gặp mã như thế này trong mọi dự án Java
      ở ngân hàng:</p>

      <div class="code"><div><span class="kw">@Service</span></div><div><span class="kw">public</span>
      <span class="kw">class</span> ChuyenTien {</div>

      <div>    <span class="kw">@Autowired</span> KhoDuLieu kho;</div><div>    <span
      class="kw">@Transactional</span></div><div>    <span class="kw">public</span>
      <span class="kw">void</span> chuyen(...) { ... }</div><div>}</div></div>

      <p>Không có dòng nào tạo <code>KhoDuLieu</code>, không có dòng nào mở giao dịch.
      Ai làm?</p></div>

      '
    clear: true
    say: Trong mọi dự án Java ở ngân hàng, bạn sẽ gặp mã như thế này. Một lớp dịch
      vụ, một trường kho dữ liệu, một hàm chuyển tiền, và vài dòng nhãn có dấu a còng.
      Không dòng nào tạo ra kho dữ liệu, không dòng nào mở giao dịch. Vậy ai làm những
      việc đó. Câu trả lời là một chương trình khác đọc các nhãn đó lúc chạy.
  - show: '<div class="box key">Hôm nay: <b>nhãn (annotation)</b> là dữ liệu gắn vào
      mã; <b>phản chiếu</b> là cách chương trình đọc chính mã của nó lúc chạy.

      Ta tự viết một <b>bộ chứa tiêm phụ thuộc</b> cỡ nhỏ: cùng cơ chế với Spring,
      chưa tới năm mươi dòng. Rồi hỏi quy mô: một triệu yêu cầu thì tạo bao nhiêu
      đối tượng?</div>

      '
    clear: true
    say: Hôm nay ta học nhãn, là dữ liệu gắn vào mã, và phản chiếu, là cách chương
      trình đọc chính mã của nó lúc chạy. Ta tự viết một bộ chứa tiêm phụ thuộc cỡ
      nhỏ, cùng cơ chế với Spring, chưa tới năm mươi dòng. Rồi hỏi quy mô, một triệu
      yêu cầu thì tạo ra bao nhiêu đối tượng.
- id: prereq
  kind: prereq
  title: 'Ôn lại: lớp lồng nhau, giao diện, bản đồ, ngoại lệ'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      lớp lồng</td><td><code>static class A {}</code> viết ngay trong lớp khác; <code>A.class</code>
      là đối tượng mô tả lớp <code>A</code></td></tr><tr><td>② <code>@Override</code></td><td>nhãn
      đã gặp: báo rằng hàm này ghi đè hàm của giao diện hay lớp cha</td></tr><tr><td>③
      bản đồ</td><td><code>Map&lt;K, V&gt;</code> với <code>containsKey</code>, <code>get</code>,
      <code>put</code></td></tr><tr><td>④ ngoại lệ</td><td>ném bằng <code>throw new
      …</code>; hàm có thể khai <code>throws Exception</code></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 1
    say: Ta ôn lại bốn điều. Lớp có thể viết lồng trong lớp khác, và mỗi lớp có một
      đối tượng mô tả riêng, viết bằng tên lớp rồi chấm thêm một chữ. Nhãn ghi đè
      mà ta đã gặp báo rằng hàm này ghi đè hàm của giao diện. Bản đồ có hàm kiểm khoá,
      lấy và bỏ vào. Và ngoại lệ ném bằng một lệnh, hàm có thể khai báo ném ngoại
      lệ. Bài này dùng cả bốn.
- id: sym
  kind: symbol
  title: Giải mã tám từ của nhãn và phản chiếu
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>@Tên</code></td><td><b>nhãn</b>
      (annotation): ghi chú có cấu trúc gắn lên lớp, hàm, trường; <b>tự nó không làm
      gì</b></td></tr><tr><td><code>@interface NghiepVu { … }</code></td><td>cách
      <b>tự định nghĩa</b> một nhãn; <code>String ten();</code> là một tham số của
      nhãn</td></tr><tr><td><code>@Retention(RetentionPolicy.RUNTIME)</code></td><td>nhãn
      của nhãn: <b>giữ đến lúc chạy</b>; không ghi thì nhãn bị bỏ khi nạp lớp</td></tr><tr><td><code>X.class</code></td><td>đối
      tượng <b>mô tả</b> lớp <code>X</code>: tên, trường, hàm, nhãn</td></tr><tr><td><code>getDeclaredFields()</code></td><td>phản
      chiếu: lấy mảng các <b>trường</b> khai báo trong lớp</td></tr><tr><td><code>f.isAnnotationPresent(X.class)</code></td><td>trường
      (hay lớp, hàm) <code>f</code> có gắn nhãn <code>X</code> không?</td></tr><tr><td><code>newInstance()</code>,
      <code>f.set(o, v)</code></td><td>tạo đối tượng và gán giá trị cho trường <b>bằng
      tên lúc chạy</b>, không viết <code>new</code> hay dấu chấm</td></tr><tr><td>tiêm
      phụ thuộc</td><td>đối tượng <b>không tự tạo</b> thứ nó cần; thứ khác tạo và
      <b>trao</b> cho nó</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Bảng này có tám thứ. Nhãn là ghi chú có cấu trúc gắn lên lớp, hàm hay trường,
      và tự nó không làm gì cả. Ta có thể tự định nghĩa nhãn, với các tham số. Nhãn
      của nhãn quy định thời hạn giữ, nếu không ghi thì nhãn bị bỏ khi nạp lớp. Đối
      tượng mô tả lớp cho ta tên, trường, hàm và nhãn. Phản chiếu cho phép lấy danh
      sách trường, hỏi một trường có nhãn nào không, tạo đối tượng và gán giá trị
      cho trường bằng tên lúc chạy. Cuối cùng, tiêm phụ thuộc nghĩa là đối tượng không
      tự tạo thứ nó cần, mà được trao cho.
  - show: <div class="code"><div><span class="kw">@Retention</span>(RetentionPolicy.RUNTIME)</div><div><span
      class="kw">@interface</span> NghiepVu {</div><div>    String ten();</div><div>    <span
      class="kw">int</span> uuTien() <span class="kw">default</span> 5;</div><div>}</div></div><div
      class="code"><div><span class="kw">static</span> <span class="kw">class</span>
      DichVu {</div><div>    <span class="kw">@NghiepVu</span>(ten = "chuyen tien",
      uuTien = 1)</div><div>    <span class="kw">public</span> <span class="kw">void</span>
      chuyen() {}</div><div> </div><div>    <span class="kw">@NghiepVu</span>(ten
      = "tra cuu")</div><div>    <span class="kw">public</span> <span class="kw">void</span>
      tra() {}</div><div> </div><div>    <span class="kw">public</span> <span class="kw">void</span>
      khac() {}</div><div>}</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Ta thử nhãn tự định nghĩa. Nhãn nghiệp vụ có tên và độ ưu tiên, độ ưu tiên
      mặc định là năm. Hai hàm được gắn nhãn, một hàm không gắn. Nhãn chỉ là dữ liệu
      nằm cạnh mã, hàm vẫn chạy như bình thường.
  - show: '<div class="code"><div>    Method[] ds = DichVu.<span class="kw">class</span>.getDeclaredMethods();</div><div>    Arrays.sort(ds,
      Comparator.comparing(Method::getName));       <span class="cm">// thứ tự gốc
      không xác định</span></div><div>    <span class="kw">for</span> (Method m :
      ds) {</div><div>        NghiepVu nv = m.getAnnotation(NghiepVu.<span class="kw">class</span>);</div><div>        String
      t = (nv == <span class="kw">null</span>) ? "khong co nhan"</div><div>                :
      nv.ten() + " (uu tien " + nv.uuTien() + ")";</div><div>        System.out.println(m.getName()
      + ": " + t);</div><div>    }</div><div>}</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>chuyen: chuyen tien (uu tien 1)</div><div>khac: khong co nhan</div><div>tra:
      tra cuu (uu tien 5)</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Phản chiếu cho ta danh sách các hàm của lớp dịch vụ. Với mỗi hàm, ta hỏi
      có nhãn nghiệp vụ không. Có thì in tên và độ ưu tiên, không thì in là không
      có nhãn. Độ ưu tiên của hàm tra cứu là năm, lấy từ giá trị mặc định.
- id: intuition
  kind: intuition
  title: 'Hình dung: thợ đọc nhãn và hai thời điểm'
  steps:
  - show: <div><svg width="1500" height="330" viewBox="0 0 1500 330" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="80" width="330" height="170" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="185.0" y="140" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">mã nguồn</text><text x="185.0" y="174" font-size="26"
      text-anchor="middle" fill="#1f2937">@ThanhPhan</text><text x="185.0" y="208"
      font-size="26" text-anchor="middle" fill="#1f2937">class KhoDuLieu</text><line
      x1="355" y1="165" x2="450" y2="165" stroke="#2a78d6" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="402" y="155" font-size="22" text-anchor="middle" fill="#2a78d6">biên dịch</text><rect
      x="455" y="80" width="330" height="170" rx="10" fill="#e5e7eb" stroke="#6b7280"
      stroke-width="3"/><text x="620.0" y="140" font-size="26" text-anchor="middle"
      fill="#1f2937">.class (còn nhãn</text><text x="620.0" y="174" font-size="26"
      text-anchor="middle" fill="#1f2937">nếu RUNTIME)</text><text x="620.0" y="208"
      font-size="26" text-anchor="middle" fill="#1f2937"></text><line x1="790" y1="165"
      x2="885" y2="165" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="837" y="155" font-size="22" text-anchor="middle" fill="#16a34a">nạp lúc chạy</text><rect
      x="890" y="50" width="590" height="230" rx="10" fill="#dcfce7" stroke="#16a34a"
      stroke-width="3"/><text x="1185.0" y="124" font-size="25" text-anchor="middle"
      fill="#1f2937" font-weight="bold">bộ chứa (chương trình khác)</text><text x="1185.0"
      y="157" font-size="25" text-anchor="middle" fill="#1f2937">đọc nhãn bằng phản
      chiếu:</text><text x="1185.0" y="190" font-size="25" text-anchor="middle" fill="#1f2937">thấy
      @ThanhPhan → tạo đối tượng</text><text x="1185.0" y="223" font-size="25" text-anchor="middle"
      fill="#1f2937">thấy @Tiem → trao đối tượng vào trường</text></svg></div>
    clear: true
    say: Hình dung nhãn như tờ giấy dán trên hộp hàng, còn bộ chứa là người thợ đọc
      giấy rồi mới xử lý. Mã nguồn có nhãn được biên dịch ra tệp lớp. Nếu nhãn được
      giữ đến lúc chạy, thì khi nạp lớp, một chương trình khác, chính là bộ chứa,
      đọc nhãn bằng phản chiếu. Thấy nhãn thành phần thì tạo đối tượng, thấy nhãn
      tiêm thì trao đối tượng vào trường. Cả Spring cũng làm đúng như vậy.
  - show: <div class="code"><div><span class="kw">@Retention</span>(RetentionPolicy.RUNTIME)
      <span class="kw">@interface</span> ThanhPhan {}</div><div><span class="kw">@Retention</span>(RetentionPolicy.RUNTIME)
      <span class="kw">@interface</span> Tiem {}</div><div><span class="kw">@interface</span>
      KhongGiu {}</div><div> </div><div><span class="kw">@ThanhPhan</span> <span class="kw">static</span>
      <span class="kw">class</span> KhoDuLieu { <span class="kw">long</span> soDu(String
      tk) { <span class="kw">return</span> 1000000; } }</div><div><span class="kw">@ThanhPhan</span>
      <span class="kw">static</span> <span class="kw">class</span> DichVuPhi { <span
      class="kw">long</span> phi(<span class="kw">long</span> t) { <span class="kw">return</span>
      t / 1000; } }</div><div><span class="kw">@ThanhPhan</span> <span class="kw">@KhongGiu</span>
      <span class="kw">static</span> <span class="kw">class</span> ChuyenTien {</div><div>    <span
      class="kw">@Tiem</span> KhoDuLieu kho;</div><div>    <span class="kw">@Tiem</span>
      DichVuPhi dvPhi;</div><div>    String chuyen(<span class="kw">long</span> t)
      { <span class="kw">return</span> "so du " + kho.soDu("A") + ", phi " + dvPhi.phi(t);
      }</div><div>}</div></div>
    clear: true
    say: Đây là bộ chứa của ta, phần đầu. Hai nhãn giữ đến lúc chạy. Ba lớp, ghi nhãn
      thành phần. Lớp chuyển tiền cần hai thứ, kho dữ liệu và dịch vụ phí, mỗi thứ
      có nhãn tiêm. Lớp chuyển tiền không tự tạo hai thứ này, và cũng không có dòng
      tạo mới nào cho chúng.
  - show: '<div class="code"><div><span class="kw">static</span> Object lay(Class&lt;?&gt;
      loai) <span class="kw">throws</span> Exception {</div><div>    <span class="kw">if</span>
      (hop.containsKey(loai)) {</div><div>        <span class="kw">return</span> hop.get(loai);</div><div>    }</div><div>    <span
      class="kw">if</span> (!loai.isAnnotationPresent(ThanhPhan.<span class="kw">class</span>))
      {</div><div>        <span class="kw">throw</span> <span class="kw">new</span>
      IllegalArgumentException("khong phai thanh phan: " + loai.getSimpleName());</div><div>    }</div></div>'
    clear: true
    say: Đây là phần chính, hàm lấy đối tượng. Nếu trong hộp đã có thì trả lại ngay.
      Nếu lớp không có nhãn thành phần thì từ chối.
  - show: '<div class="code"><div>    Object o = loai.getDeclaredConstructor().newInstance();</div><div>    hop.put(loai,
      o);</div><div>    <span class="kw">for</span> (Field f : loai.getDeclaredFields())
      {</div><div>        <span class="kw">if</span> (f.isAnnotationPresent(Tiem.<span
      class="kw">class</span>)) {</div><div>            f.setAccessible(<span class="kw">true</span>);</div><div>            f.set(o,
      lay(f.getType()));</div><div>        }</div><div>    }</div><div>    <span class="kw">return</span>
      o;</div><div>}</div></div>'
    clear: true
    say: Còn lại thì tạo đối tượng bằng phản chiếu, bỏ vào hộp, rồi duyệt các trường.
      Trường nào có nhãn tiêm thì lấy đối tượng của kiểu trường đó, lại bằng chính
      hàm này, mở quyền truy cập rồi gán vào.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: bộ chứa lấy một đối tượng thế nào'
  checks:
  - 1 + 2 == 3
  steps:
  - show: '<p><b>Bước 1.</b> <b>Hỏi hộp trước.</b> <code>hop.containsKey(loai)</code>
      đúng &rarr; trả đối tượng cũ.</p><p>Vì sao: để <b>mỗi lớp chỉ có một bản</b>
      (singleton); lần sau lấy lại đúng đối tượng đó.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, hỏi hộp trước. Nếu lớp đã có đối tượng trong hộp thì trả lại luôn.
      Vì làm vậy mỗi lớp chỉ có một bản, và những lần sau ai xin cũng nhận đúng đối
      tượng ấy.
  - show: '<p><b>Bước 2.</b> <b>Kiểm nhãn.</b> Không có <code>@ThanhPhan</code> &rarr;
      từ chối.</p><p>Vì sao: bộ chứa chỉ quản lý thứ được <b>đánh dấu</b>; lấy nhầm
      lớp lạ phải báo lỗi to rõ.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước hai, kiểm nhãn. Lớp không có nhãn thành phần thì bị từ chối. Vì bộ chứa
      chỉ quản lý những gì được đánh dấu, và lấy nhầm một lớp lạ thì phải báo lỗi
      rõ ràng.
  - show: '<p><b>Bước 3.</b> <b>Tạo rồi bỏ vào hộp TRƯỚC khi tiêm.</b></p><p><code>Object
      o = …newInstance();</code> <code>hop.put(loai, o);</code></p><p>Vì sao thứ tự
      này: nếu hai lớp cần nhau, lúc tiêm lần ngược lại sẽ <b>thấy đối tượng đang
      dở</b> trong hộp thay vì tạo mãi.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước ba, tạo rồi bỏ vào hộp trước khi tiêm. Thứ tự này quan trọng. Nếu hai
      lớp cần nhau, lúc tiêm lần ngược lại sẽ thấy đối tượng đang dựng dở trong hộp,
      thay vì tạo mãi không dừng.
  - show: '<p><b>Bước 4.</b> <b>Tiêm.</b> Mỗi trường có <code>@Tiem</code>: lấy đối
      tượng của kiểu trường bằng <b>chính hàm này</b>, rồi <code>f.set(o, …)</code>.</p><p>Thử
      với <code>ChuyenTien</code>: 2 trường &rarr; 2 lần gọi lại &rarr; hộp có 1 +
      2 = <b>3</b> đối tượng ✓</p><table class=''t''><tr><th>lần gọi</th><th>thêm
      vào hộp</th><th>hộp có</th></tr><tr><td>lay(ChuyenTien)</td><td>ChuyenTien</td><td>1</td></tr><tr><td>  lay(KhoDuLieu)</td><td>KhoDuLieu</td><td>2</td></tr><tr><td>  lay(DichVuPhi)</td><td>DichVuPhi</td><td><b>3</b></td></tr></table>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn là bước tiêm đối tượng vào các trường. Với mỗi trường có nhãn tiêm,
      ta lấy đối tượng của kiểu trường bằng chính hàm này, rồi gán vào. Thử với lớp
      chuyển tiền, có hai trường, nên hai lần gọi lại, và hộp có một cộng hai bằng
      ba đối tượng.
- id: example
