scenes:
- id: hook
  kind: hook
  title: Một dấu nhỏ hơn thay cho nhỏ hơn hoặc bằng, và đúng một đồng tiền bị tính
    sai
  steps:
  - show: '<div><svg width="1500" height="300" viewBox="0 0 1500 300" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="90" width="340" height="100" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="190.0" y="132" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">đặc tả</text><text x="190.0" y="166" font-size="26"
      text-anchor="middle" fill="#1f2937">đến 1 triệu: phí 1 000</text><line x1="365"
      y1="140" x2="470" y2="140" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="475" y="90" width="340" height="100" rx="10" fill="#fef3c7" stroke="#d97706"
      stroke-width="3"/><text x="645.0" y="132" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">mã viết</text><text x="645.0" y="166" font-size="26"
      text-anchor="middle" fill="#1f2937">if (t < 1000000)</text><line x1="820" y1="140"
      x2="925" y2="140" stroke="#475569" stroke-width="3.5" marker-end="url(#ah)"/><rect
      x="930" y="60" width="550" height="160" rx="10" fill="#fee2e2" stroke="#dc2626"
      stroke-width="3"/><text x="1205.0" y="115" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">giao dịch ĐÚNG 1 000 000</text><text x="1205.0"
      y="149" font-size="26" text-anchor="middle" fill="#1f2937">bị tính 5 000 thay
      vì 1 000</text><text x="1205.0" y="183" font-size="26" text-anchor="middle"
      fill="#1f2937">mọi bài kiểm bằng mắt đều bỏ sót</text><text x="750" y="270"
      font-size="26" text-anchor="middle" fill="#16a34a" font-weight="bold">một ca
      kiểm đặt đúng ở biên bắt được lỗi này trong một giây</text></svg></div>'
    clear: true
    say: Đặc tả nói giao dịch đến một triệu đồng thì phí một nghìn. Người viết gõ
      dấu nhỏ hơn thay vì nhỏ hơn hoặc bằng. Với mọi giao dịch khác thì chương trình
      chạy đúng, nên không ai nhận ra. Chỉ giao dịch đúng một triệu bị tính năm nghìn.
      Một ca kiểm đặt đúng ở biên bắt được lỗi này trong một giây, còn mắt người thì
      rất dễ bỏ qua.
  - show: '<div class="box key">Hôm nay: <b>kiểm thử đơn vị</b>. Biến một câu của
      đặc tả thành một ca kiểm chạy được, chọn đúng <b>giá trị ở biên</b>, tự viết
      khẳng định,

      rồi dùng <b>JUnit 5</b> đúng như dự án thật. Kèm câu hỏi của người làm nghề:
      kiểm hết mọi đầu vào được không?</div>

      '
    clear: true
    say: Hôm nay ta học kiểm thử đơn vị. Biến một câu của đặc tả thành một ca kiểm
      chạy được, chọn đúng giá trị ở biên, tự viết khẳng định, rồi dùng bộ kiểm thử
      chuẩn như trong dự án thật. Kèm câu hỏi của người làm nghề, kiểm hết mọi đầu
      vào được không.
- id: prereq
  kind: prereq
  title: 'Ôn lại: hàm tĩnh, rẽ nhánh, ngoại lệ, hàm ngắn'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      hàm tĩnh</td><td><code>static long phi(long soTien)</code> nhận số, trả số;
      gọi bằng <code>phi(5)</code></td></tr><tr><td>② rẽ nhánh theo bậc</td><td><code>if
      (t &lt;= 1000000) …</code>: dấu <code>&lt;=</code> hay <code>&lt;</code> quyết
      định giá trị đúng biên rơi vào bậc nào</td></tr><tr><td>③ ngoại lệ</td><td><code>throw
      new IllegalArgumentException("…")</code> báo đầu vào sai; <code>catch</code>
      bắt đúng loại ngoại lệ đó</td></tr><tr><td>④ hàm ngắn</td><td><code>() -&gt;
      phi(5)</code> là một việc chưa chạy, đưa cho nơi khác gọi sau</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 1
    say: Ta ôn lại bốn điều. Hàm tĩnh nhận số và trả số. Rẽ nhánh theo bậc, trong
      đó dấu so sánh quyết định giá trị đúng ở biên rơi vào bậc nào. Ngoại lệ báo
      đầu vào sai, và có thể bắt đúng loại. Hàm ngắn là một việc chưa chạy, đưa cho
      nơi khác gọi sau. Tất cả đều dùng trong bài này.
- id: sym
  kind: symbol
  title: Giải mã tám từ của kiểm thử
  steps:
  - show: '<table class=''t''><tr><th>từ</th><th>nghĩa</th></tr><tr><td>ca kiểm (test
      case)</td><td>một đầu vào cụ thể và <b>đầu ra mong đợi</b> lấy từ đặc tả, không
      lấy từ mã</td></tr><tr><td>khẳng định (assertion)</td><td>câu lệnh so <b>mong
      đợi</b> với <b>thực tế</b>; khác thì ca kiểm hỏng</td></tr><tr><td>giá trị biên</td><td>giá
      trị đúng ở chỗ hành vi đổi: <code>1 000 000</code> và hai bên của nó, <code>1
      000 001</code></td></tr><tr><td>lớp tương đương</td><td>nhóm đầu vào được hàm
      xử lý như nhau (mọi số từ 1 tới 1 000 000): kiểm <b>một đại diện</b> là đủ</td></tr><tr><td><code>@Test</code></td><td>nhãn
      của JUnit 5 báo hàm này là một ca kiểm; JUnit tự tìm và chạy</td></tr><tr><td><code>assertEquals(mong,
      thuc)</code></td><td>khẳng định hai giá trị bằng nhau; <b>mong đợi viết trước</b></td></tr><tr><td><code>assertThrows(X.class,
      việc)</code></td><td>khẳng định <b>việc</b> phải ném ngoại lệ loại <code>X</code>;
      không ném thì hỏng</td></tr><tr><td><code>import static</code></td><td>nạp tên
      một hàm tĩnh để viết gọn <code>assertEquals</code> thay cho tên dài đủ</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    say: Bảng này có tám từ. Ca kiểm là một đầu vào cụ thể cùng đầu ra mong đợi lấy
      từ đặc tả, không lấy từ mã. Khẳng định là lệnh so mong đợi với thực tế. Giá
      trị biên là giá trị đúng ở chỗ hành vi đổi, cùng hai bên của nó. Lớp tương đương
      là nhóm đầu vào được xử lý như nhau, nên kiểm một đại diện là đủ. Nhãn kiểm
      thử báo cho bộ kiểm thử biết hàm nào là ca kiểm. Có khẳng định bằng nhau và
      khẳng định phải ném ngoại lệ. Và nạp tên tĩnh giúp viết gọn.
- id: intuition
  kind: intuition
  title: 'Hình dung: trục số, ba bậc, và chỗ lỗi ẩn nấp'
  steps:
  - show: '<div><svg width="1500" height="380" viewBox="0 0 1500 380" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><line
      x1="40" y1="190" x2="1460" y2="190" stroke="#475569" stroke-width="4"/><rect
      x="40" y="60" width="330" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"
      stroke-width="3"/><text x="205.0" y="87" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">không hợp lệ</text><text x="205.0" y="119"
      font-size="24" text-anchor="middle" fill="#1f2937">số ≤ 0 → ngoại lệ</text><rect
      x="430" y="60" width="330" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="595.0" y="87" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">bậc 1: phí 1 000</text><text x="595.0" y="119"
      font-size="24" text-anchor="middle" fill="#1f2937">1 … 1 000 000</text><rect
      x="800" y="60" width="330" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"
      stroke-width="3"/><text x="965.0" y="87" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">bậc 2: phí 5 000</text><text x="965.0" y="119"
      font-size="24" text-anchor="middle" fill="#1f2937">… 10 000 000</text><rect
      x="1150" y="60" width="310" height="70" rx="10" fill="#fef3c7" stroke="#d97706"
      stroke-width="3"/><text x="1305.0" y="87" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">bậc 3: phí 10 000</text><text x="1305.0" y="119"
      font-size="24" text-anchor="middle" fill="#1f2937">trên 10 000 000</text><circle
      cx="400" cy="190" r="11" fill="#dc2626"/><circle cx="780" cy="190" r="11" fill="#dc2626"/><circle
      cx="1140" cy="190" r="11" fill="#dc2626"/><text x="560" y="245" font-size="22"
      text-anchor="middle" fill="#dc2626" font-weight="bold">biên 1: 1 000 000 / 1
      000 001</text><text x="780" y="285" font-size="22" text-anchor="middle" fill="#dc2626"
      font-weight="bold">biên 2: 10 000 000 / 10 000 001</text><text x="240" y="245"
      font-size="22" text-anchor="middle" fill="#dc2626" font-weight="bold">0 và −5</text><text
      x="750" y="345" font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">lỗi
      hay ẩn ở điểm đỏ: nơi dấu < hay <= quyết định</text></svg></div>'
    clear: true
    say: Hình dung hàm phí như một trục số chia thành các bậc. Bên trái là vùng không
      hợp lệ, rồi ba bậc phí. Giữa các bậc là những điểm đỏ, các giá trị biên. Lỗi
      lệch dấu so sánh luôn ẩn ở điểm đỏ, vì nó chỉ làm sai đúng một giá trị ở đó.
      Vì vậy ca kiểm tốt nhất đặt đúng ở các điểm đỏ và hai bên của nó.
  - show: <div class="code"><div><span class="kw">static</span> <span class="kw">long</span>
      phi(<span class="kw">long</span> soTien) {</div><div>    <span class="kw">if</span>
      (soTien &lt;= 0) {</div><div>        <span class="kw">throw</span> <span class="kw">new</span>
      IllegalArgumentException("so tien phai duong");</div><div>    }</div><div>    <span
      class="kw">if</span> (soTien &lt;= 1000000) {</div><div>        <span class="kw">return</span>
      1000;</div><div>    }</div><div>    <span class="kw">if</span> (soTien &lt;=
      10000000) {</div><div>        <span class="kw">return</span> 5000;</div><div>    }</div><div>    <span
      class="kw">return</span> 10000;</div><div>}</div></div>
    clear: true
    say: Ta xem hàm cần kiểm. Số không hoặc số âm thì ném ngoại lệ. Đến một triệu
      thì phí một nghìn. Đến mười triệu thì phí năm nghìn. Trên đó là mười nghìn.
      Các số này là số minh hoạ.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ đặc tả tới bảy ca kiểm'
  checks:
  - 2 * 2 + 1 + 2 == 7
  - 4 - 1 == 3
  steps:
  - show: '<p><b>Bước 1.</b> Đếm các <b>vùng</b> của đặc tả: không hợp lệ, bậc 1,
      bậc 2, bậc 3 &rarr; <b>4 vùng</b>, có <b>3 biên</b> giữa chúng (0/1, 1 000 000,
      10 000 000).</p>'
    clear: true
    say: Bước một, đếm các vùng của đặc tả. Có bốn vùng, gồm không hợp lệ và ba bậc
      phí. Giữa bốn vùng có ba biên, là không, một triệu và mười triệu.
  - show: '<p><b>Bước 2.</b> Mỗi biên giữa hai bậc cần <b>hai ca</b>: giá trị <b>đúng
      biên</b> và giá trị <b>ngay sau biên</b>.</p><p>Vì sao: lỗi dấu <code>&lt;</code>
      / <code>&lt;=</code> chỉ làm sai <b>đúng giá trị biên</b>; ca ngay sau biên
      chứng tỏ bậc mới bắt đầu đúng chỗ.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước hai, mỗi biên giữa hai bậc cần hai ca. Một ca đúng giá trị biên và một
      ca ngay sau biên. Vì lỗi lệch dấu chỉ làm sai đúng giá trị biên, còn ca ngay
      sau biên chứng tỏ bậc mới bắt đầu đúng chỗ.
  - show: '<p><b>Bước 3.</b> Vùng không hợp lệ cần <b>mỗi dạng một ca</b>: số không
      và một số âm. Thêm một ca ở bậc thấp nhất (giá trị 1).</p><p>Tổng: hai biên
      giữa bậc × 2 ca + ca bậc đầu + hai ca không hợp lệ = 2 × 2 + 1 + 2 = <b>7</b>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước ba, vùng không hợp lệ cần mỗi dạng một ca, số không và một số âm. Thêm
      một ca ở bậc thấp nhất. Vì mỗi dạng hỏng có thể bị xử lý khác nhau nên mỗi dạng
      cần một ca riêng. Cộng lại là hai biên nhân hai ca, cộng một, cộng hai, bằng
      bảy ca.
  - show: <p><b>Bước 4.</b> Viết <b>mong đợi trước</b>, từ đặc tả chứ không từ mã:</p><table
      class='t'><tr><th>ca</th><th>đầu vào</th><th>mong đợi</th></tr><tr><td>bậc đầu</td><td>1</td><td>1
      000</td></tr><tr><td>biên 1</td><td>1 000 000</td><td>1 000</td></tr><tr><td>sau
      biên 1</td><td>1 000 001</td><td>5 000</td></tr><tr><td>biên 2</td><td>10 000
      000</td><td>5 000</td></tr><tr><td>sau biên 2</td><td>10 000 001</td><td>10
      000</td></tr><tr><td>số không / số âm</td><td>0, −5</td><td>ngoại lệ</td></tr></table>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước bốn, viết giá trị mong đợi trước, và lấy từ đặc tả chứ không lấy từ
      mã. Nếu lấy từ mã thì ca kiểm chỉ lặp lại lỗi của mã. Bảng này có đủ bảy ca,
      hai ca cuối cùng chung một dòng vì cùng mong đợi ngoại lệ.
- id: example
  kind: example
  title: 'Ví dụ: bảy ca kiểm tự viết, chạy thật'
  checks:
  - 7 + 0 == 7
  steps:
  - show: '<div class="code"><div><span class="kw">static</span> <span class="kw">void</span>
      kiem(String ten, <span class="kw">long</span> mong, <span class="kw">long</span>
      thuc) {</div><div>    <span class="kw">if</span> (mong == thuc) {</div><div>        dat++;</div><div>        System.out.println("DAT  "
      + ten);</div><div>    } <span class="kw">else</span> {</div><div>        hong++;</div><div>        System.out.println("HONG
      " + ten + ": mong " + mong + ", thuc " + thuc);</div><div>    }</div><div>}</div></div>'
    clear: true
    say: Phép làm thứ nhất, hàm khẳng định đầu tiên. Nó nhận tên ca, giá trị mong
      đợi và giá trị thực, so hai số, rồi in đạt hay hỏng, kèm hai giá trị nếu hỏng.
      Nó cũng đếm số ca đạt và hỏng.
  - show: '<div class="code"><div><span class="kw">static</span> <span class="kw">void</span>
      kiemNgoaiLe(String ten, <span class="kw">long</span> soTien) {</div><div>    <span
      class="kw">try</span> {</div><div>        phi(soTien);</div><div>        hong++;</div><div>        System.out.println("HONG
      " + ten + ": khong nem ngoai le");</div><div>    } <span class="kw">catch</span>
      (IllegalArgumentException e) {</div><div>        dat++;</div><div>        System.out.println("DAT  "
      + ten);</div><div>    }</div><div>}</div></div>'
    clear: true
    say: Phép làm thứ hai, hàm khẳng định ném ngoại lệ. Nó gọi hàm phí bên trong khối
      bắt lỗi. Nếu hàm phí chạy bình thường thì ca hỏng, vì lẽ ra phải ném. Chỉ khi
      bắt được đúng loại ngoại lệ thì ca mới đạt.
  - show: <div class="code"><div><span class="kw">public</span> <span class="kw">static</span>
      <span class="kw">void</span> main(String[] args) {</div><div>    kiem("bac dau",
      1000, phi(1));</div><div>    kiem("bien 1 trieu", 1000, phi(1000000));</div><div>    kiem("sau
      bien 1 trieu", 5000, phi(1000001));</div><div>    kiem("bien 10 trieu", 5000,
      phi(10000000));</div><div>    kiem("sau bien 10 trieu", 10000, phi(10000001));</div><div>    kiemNgoaiLe("so
      khong", 0);</div><div>    kiemNgoaiLe("so am", -5);</div><div>    System.out.println("dat
      " + dat + ", hong " + hong);</div><div>}</div></div>
    clear: true
    say: Phép làm thứ ba, bảy ca kiểm lấy thẳng từ bảng đã suy ra. Mỗi ca ghi giá
      trị mong đợi trước, rồi mới gọi hàm.
  - show: '$$④ \; \text{dự đoán}: 7 \text{ ca đạt}, \; 0 \text{ hỏng} \quad (7 + 0
      = 7)$$<p><b>Kết quả chạy</b></p><div class="code"><div>DAT  bac dau</div><div>DAT  bien
      1 trieu</div><div>DAT  sau bien 1 trieu</div><div>DAT  bien 10 trieu</div><div>DAT  sau
      bien 10 trieu</div><div>DAT  so khong</div><div>DAT  so am</div><div>dat 7,
      hong 0</div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ tư, ta dự đoán trước là bảy ca đạt, không ca hỏng. Chạy thật,
      bảy dòng đạt và dòng tổng kết khớp với dự đoán. Hàm này đúng với đặc tả ở mọi
      biên.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: cố tình gây lỗi, ca kiểm phải đỏ'
  checks:
  - 5 + 2 == 7
  steps:
  - show: '<p><b>Đối chứng âm.</b> Ca kiểm xanh chưa chứng minh gì nếu nó <b>không
      thể đỏ</b>. Ta đổi hai dấu <code>&lt;=</code> thành <code>&lt;</code> trong
      hàm phí rồi chạy lại đúng bảy ca:</p><p><b>Kết quả chạy</b></p><div class="code"><div>DAT  bac
      dau</div><div>HONG bien 1 trieu: mong 1000, thuc 5000</div><div>DAT  sau bien
      1 trieu</div><div>HONG bien 10 trieu: mong 5000, thuc 10000</div><div>DAT  sau
      bien 10 trieu</div><div>DAT  so khong</div><div>DAT  so am</div><div>dat 5,
      hong 2</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Cách kiểm khác là cố tình gây lỗi. Ca kiểm xanh chưa chứng minh gì nếu nó
      không thể đỏ. Ta đổi hai dấu nhỏ hơn hoặc bằng thành nhỏ hơn rồi chạy lại đúng
      bảy ca. Hai ca ở đúng biên báo hỏng, và nói rõ mong đợi bao nhiêu, thực tế bao
      nhiêu. Năm ca còn lại vẫn đạt, nên ta biết lỗi nằm ở biên chứ không ở chỗ khác.
  - show: '<p>Đếm: 7 ca = <b>5</b> đạt + <b>2</b> hỏng; hai ca hỏng là <b>đúng hai
      ca ở biên</b>, khớp với phép suy luận ở bước hai.</p><p>Bỏ hai ca biên khỏi
      bảng thì chỉ còn <b>5</b> ca, <b>tất cả đều xanh</b>, và lỗi lọt qua mà không
      ai biết.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta đếm lại, bảy ca gồm năm đạt và hai hỏng. Vì hai ca hỏng chính là hai ca
      biên, nên phép suy luận ở bước hai là đúng. Nếu bỏ hai ca biên khỏi bảng thì
      chỉ còn năm ca, tất cả đều xanh, và lỗi lọt qua mà không ai biết.
- id: junit
  kind: concept
  title: Cùng ca kiểm, viết bằng JUnit 5 như dự án thật
  steps:
  - show: <p><b>Tệp PhiChuyenTest.java (đầu tệp)</b></p><div class="code"><div><span
      class="kw">import</span> org.junit.jupiter.api.Test;</div><div> </div><div><span
      class="kw">class</span> PhiChuyenTest {</div><div>    <span class="kw">@Test</span></div><div>    <span
      class="kw">void</span> bacDau() {</div><div>        assertEquals(1000, PhiChuyen.phi(1));</div><div>    }</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Trong dự án thật, người ta không tự viết hàm khẳng định mà dùng một bộ kiểm
      thử chuẩn có sẵn. Mỗi ca kiểm là một hàm có nhãn kiểm thử. Khẳng định bằng nhau
      nhận giá trị mong đợi trước, giá trị thực sau. Ta chỉ cần bốn ca để giữ ngắn.
  - show: <p>Công cụ tải về một tệp, đặt vào thư mục <code>lib</code>; kiểm băm để
      chắc không bị thay (băm đầy đủ ở <code>labs/ENV.md</code>):</p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>sha256sum lib/junit-platform-console-standalone-1.10.2.jar
      | cut -c1-16</div><div>a1de557821293ce9</div></div><p class='note'>Lệnh tải
      bằng <code>curl -L -o</code> và địa chỉ chính thức nằm ở <code>labs/ENV.md</code>,
      mục tệp tải thêm.</p>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Công cụ chỉ là một tệp đóng gói, tải về bỏ vào thư mục thư viện. Ta kiểm
      băm của nó để chắc tệp không bị thay đổi. Địa chỉ tải và băm đầy đủ nằm trong
      tệp môi trường của khoá học.
  - show: <p><b>Biên dịch kèm tệp đóng gói; chạy; chỉ xem hai dòng tổng kết</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>J=lib/junit-platform-console-standalone-1.10.2.jar</div><div><span
      class="cm"><span>&#36;</span> </span>javac -cp <span>&#36;</span>J -d out PhiChuyen.java
      PhiChuyenTest.java</div><div><span class="cm"><span>&#36;</span> </span>kiem()
      { java -jar <span>&#36;</span>J execute -cp out -c PhiChuyenTest --details=summary
      2&gt;/dev/null; }</div><div><span class="cm"><span>&#36;</span> </span>kiem
      | grep -E 'tests (successful|failed)'</div><div>[         4 tests successful      ]</div><div>[         0
      tests failed          ]</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta đặt tên tệp đóng gói vào một biến cho ngắn, biên dịch với đường dẫn tìm
      lớp có thêm tệp đó, rồi định nghĩa một hàm chạy bộ kiểm thử trên thư mục đích.
      Ta lọc lấy hai dòng tổng kết. Bốn ca thành công, không ca hỏng.
  - show: '<p><b>Gây lỗi biên rồi chạy lại: bộ kiểm thử nói rõ mong đợi và thực tế</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>sed -i ''s/soTien
      &lt;= 1000000/soTien &lt; 1000000/'' PhiChuyen.java</div><div><span class="cm"><span>&#36;</span>
      </span>javac -cp <span>&#36;</span>J -d out PhiChuyen.java PhiChuyenTest.java</div><div><span
      class="cm"><span>&#36;</span> </span>kiem | grep -E ''=&gt; |tests (successful|failed)''</div><div>    =&gt;
      org.opentest4j.AssertionFailedError: expected: &lt;1000&gt; but was: &lt;5000&gt;</div><div>[         3
      tests successful      ]</div><div>[         1 tests failed          ]</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta cố tình gây lỗi, đổi dấu ở biên, biên dịch lại và chạy. Bộ kiểm thử báo
      ba ca thành công, một ca hỏng, và nói rõ mong đợi một nghìn nhưng thực tế là
      năm nghìn. Đúng như bộ khẳng định tự viết, chỉ khác là có sẵn, chạy được cả
      trăm ca cùng lúc.
- id: scale
  kind: concept
  title: 'Khi đầu vào nhiều lên: không kiểm hết được, phải chọn'
  checks:
  - 2**64 == 18446744073709551616
  - round(2**64 / 1e9 / 3600 / 24 / 365.25) == 585 or round(2**64 / 1e9 / 3600 / 24
    / 365.25) == 584
  - 5**3 == 125
  - 5**6 == 15625
  - 5**10 == 9765625
  - 2 * 5 * 3 == 30
  - 2 * 5 * 6 == 60
  - 2 * 5 * 10 == 100
  steps:
  - show: <table class='t'><tr><th>số đầu vào của hàm</th><th>1 (kiểu long)</th><th>2
      đầu vào</th><th>3 đầu vào</th></tr><tr><td>tổng số giá trị có thể</td><td>2<sup>64</sup>
      ≈ 1,8 × 10<sup>19</sup></td><td>2<sup>128</sup></td><td>2<sup>192</sup></td></tr><tr><td>thời
      gian kiểm hết, mỗi ca 1 nano giây</td><td><b>≈ 584 năm</b></td><td>vô hạn trong
      thực tế</td><td>vô hạn trong thực tế</td></tr></table>
    clear: true
    say: Bây giờ là chuyện quy mô. Một số nguyên dài có hai mũ sáu mươi bốn giá trị,
      cỡ mười tám tỉ tỉ. Nếu mỗi ca kiểm tốn một nano giây, kiểm hết một đầu vào cần
      khoảng năm trăm tám mươi bốn năm. Hai đầu vào thì bình phương con số đó. Kiểm
      hết là không thể, nên ta buộc phải chọn.
  - show: '<table class=''t''><tr><th>số đầu vào độc lập, mỗi đầu vào 5 lớp</th><th>3</th><th>6</th><th>10</th></tr><tr><td>mọi
      tổ hợp</td><td>125</td><td>15 625</td><td><b>9 765 625</b></td></tr><tr><td>chỉ
      kiểm biên từng đầu vào (≈ 2 × 5 mỗi đầu vào)</td><td>30</td><td>60</td><td><b>100</b></td></tr></table><p
      class=''note''>Đánh đổi: kiểm từng đầu vào cho ta lòng tin về <b>từng biên</b>,
      không bắt được lỗi chỉ xuất hiện ở một <b>tổ hợp</b> riêng. Người làm nghề thêm
      vài tổ hợp rủi ro cao (tiền lớn × khác ngân hàng) thay vì mọi tổ hợp.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Với nhiều đầu vào độc lập, mỗi đầu vào năm lớp, số tổ hợp tăng theo lũy thừa.
      Ba đầu vào là một trăm hai mươi lăm tổ hợp, mười đầu vào là gần mười triệu tổ
      hợp. Còn kiểm biên từng đầu vào chỉ tăng đều, mười đầu vào là một trăm ca. Đánh
      đổi là cách này không bắt được lỗi chỉ xuất hiện ở một tổ hợp riêng, nên người
      làm nghề thêm vài tổ hợp rủi ro cao thay vì mọi tổ hợp.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: <div class="box warn"><b>Lỗi 1 (người mới).</b> So sánh số thực bằng <code>==</code>
      trong khẳng định.</div><div class="code"><div><span class="kw">double</span>
      tong = 0.1 + 0.2;</div><div>System.out.println(tong == 0.3);                      <span
      class="cm">// so sánh bằng nhau tuyệt đối</span></div><div>System.out.println(Math.abs(tong
      - 0.3) &lt; 1e-9);      <span class="cm">// so sánh với sai số cho phép</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div>false</div><div>true</div></div>
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất là so sánh số thực bằng dấu bằng. Không phẩy một cộng không
      phẩy hai không đúng bằng không phẩy ba, vì số thực lưu gần đúng. Ca kiểm như
      vậy hỏng dù hàm đúng. Cách làm đúng là so với một sai số cho phép. Với tiền,
      hãy dùng số nguyên theo đồng để tránh hẳn chuyện này.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Ca kiểm xanh giả: nuốt
      ngoại lệ nên không bao giờ hỏng.</div><div class="code"><div><span class="kw">try</span>
      {                                         <span class="cm">// ca kiểm viết sai:
      nuốt mọi ngoại lệ</span></div><div>    phiLoi(0);</div><div>    System.out.println("ca
      kiem A: DAT");</div><div>} <span class="kw">catch</span> (Exception e) {</div><div>    System.out.println("ca
      kiem A: DAT");</div><div>}</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>ca
      kiem A: DAT</div><div>ca kiem B: HONG, khong nem ngoai le</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai là ca kiểm xanh giả. Ca A bắt mọi ngoại lệ và coi cả hai nhánh
      là đạt, nên dù hàm quên kiểm số không, ca vẫn đạt. Ca B đúng, chỉ đạt khi có
      ném đúng loại ngoại lệ, và nó báo hỏng. Một ca kiểm không thể hỏng thì không
      có giá trị gì.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Các ca kiểm dùng
      chung trạng thái, nên kết quả phụ thuộc thứ tự chạy.</div><div class="code"><div><span
      class="kw">static</span> <span class="kw">long</span> soDu = 0;                                     <span
      class="cm">// trạng thái DÙNG CHUNG giữa các ca kiểm</span></div><div> </div><div><span
      class="kw">static</span> <span class="kw">void</span> caA() {</div><div>    soDu
      += 100;</div><div>    System.out.println("A " + (soDu == 100 ? "DAT" : "HONG"));</div><div>}</div><div>
      </div><div><span class="kw">static</span> <span class="kw">void</span> caB()
      {</div><div>    <span class="kw">if</span> (soDu &gt;= 50) {</div><div>        soDu
      -= 50;</div><div>    }</div><div>    System.out.println("B " + (soDu == 50 ?
      "DAT" : "HONG"));</div><div>}</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Lỗi thứ ba hay gặp ở người đã đi làm. Hai ca kiểm cùng dùng một biến số dư
      dùng chung. Ca A nạp một trăm, ca B rút năm mươi và tin rằng số dư đang là một
      trăm. Ca B chỉ đạt nếu ca A đã chạy trước.
  - show: <div class="code"><div><span class="kw">public</span> <span class="kw">static</span>
      <span class="kw">void</span> main(String[] args) {</div><div>    System.out.println("thu
      tu A, B:");</div><div>    caA();</div><div>    caB();</div><div>    soDu = 0;</div><div>    System.out.println("thu
      tu B, A:");</div><div>    caB();</div><div>    caA();</div></div><p><b>Kết quả
      chạy</b></p><div class="code"><div>thu tu A, B:</div><div>A DAT</div><div>B
      DAT</div><div>thu tu B, A:</div><div>B HONG</div><div>A DAT</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Chạy theo thứ tự A rồi B thì cả hai đạt. Đổi thành B rồi A thì ca B hỏng,
      dù mã không đổi một chữ. Bộ kiểm thử thật có thể chạy theo thứ tự bất kỳ, nên
      mỗi ca kiểm phải tự dựng dữ liệu của chính nó và không dựa vào ca khác.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 3000000 * 1 // 1000 == 3000
  - 6**4 == 1296
  - 4 * 12 == 48
  - 2 * 6 == 12
  steps:
  - show: '<p><b>Đề.</b> Đặc tả: phí rút tiền ATM là <b>0</b> nếu số tiền <b>dưới
      3 000 000</b>, <b>0,1%</b> nếu từ 3 000 000 trở lên (số minh hoạ).</p>

      <ol><li>Chọn các ca ở <b>biên</b> (đúng biên và ngay sau biên); ghi giá trị
      đầu vào và <b>mong đợi</b>.</li>

      <li>Hàm viết <code>if (t &lt;= 3000000)</code> (sai dấu): ca nào trong bảng
      của bạn <b>hỏng</b>?</li></ol>

      <p><b>Chọn A hay B?</b> Cần kiểm hàm có 4 đầu vào, mỗi đầu vào 6 lớp. A: mọi
      tổ hợp. B: biên từng đầu vào cộng vài tổ hợp rủi ro. Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 30
    say: Bây giờ tới phần bạn tự làm. Đặc tả nói phí rút tiền là không đồng nếu số
      tiền dưới ba triệu, và không phẩy một phần trăm nếu từ ba triệu trở lên. Hãy
      chọn các ca ở biên, ghi đầu vào và mong đợi. Rồi nếu hàm viết sai dấu thì ca
      nào hỏng. Cuối cùng chọn giữa mọi tổ hợp và biên từng đầu vào cho hàm bốn đầu
      vào, mỗi đầu vào sáu lớp, và giải thích vì sao. Hãy dừng video và tự làm.
  - show: <table class='t'><tr><th>câu</th><th>đáp án</th><th>vì sao</th></tr><tr><td>1</td><td>2
      999 999 → 0; <b>3 000 000 → 3 000</b>; 3 000 001 → 3 000</td><td>đúng biên là
      3 000 000 (từ đó trở lên), 0,1% × 3 000 000 = 3 000; số ngay trước biên cũng
      cần</td></tr><tr><td>2</td><td>ca <b>3 000 000</b> hỏng (hàm cho 0, mong 3 000)</td><td>dấu
      <code>&lt;=</code> đẩy đúng biên sang bậc miễn phí</td></tr><tr><td>3</td><td><b>B</b></td><td>6<sup>4</sup>
      = 1 296 tổ hợp so với 4 × 12 = 48 ca biên; chọn thêm vài tổ hợp rủi ro</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án câu một, ca ngay trước biên cho phí không, ca đúng ba triệu và ca
      ngay sau biên đều cho phí ba nghìn. Biên đúng là ba triệu, vì từ ba triệu trở
      lên mới tính phí, và không phẩy một phần trăm của ba triệu là ba nghìn. Câu
      hai, ca đúng ba triệu hỏng, vì dấu nhỏ hơn hoặc bằng đẩy đúng biên sang bậc
      miễn phí. Câu ba chọn phương án B, vì sáu mũ bốn là một nghìn hai trăm chín
      mươi sáu tổ hợp, so với bốn mươi tám ca biên.
    clear: true
  - show: <div class="box key"><b>Quy tắc:</b> mong đợi lấy từ <b>đặc tả</b>; đặt
      ca ở <b>biên</b> và ngay sau biên; mỗi ca <b>tự dựng dữ liệu</b>; và luôn thử
      <b>gây lỗi cố ý</b> để chắc ca kiểm có thể đỏ.</div>
    say: Quy tắc rút ra. Giá trị mong đợi lấy từ đặc tả. Đặt ca ở biên và ngay sau
      biên. Mỗi ca tự dựng dữ liệu của nó. Và luôn thử gây lỗi cố ý để chắc ca kiểm
      có thể đỏ.
- id: practice
  kind: practice
  title: 'Tự làm: năm ca kiểm và một lỗi biên'
  steps:
  - show: '<p><b>Đề</b>: hàm <code>phiChuyenKhoan</code> (trong <code>de.md</code>)
      có một lỗi biên.</p>

      <ol><li>Tự viết <code>kiem(ten, mong, thuc)</code> và <code>kiemNgoaiLe(ten,
      soTien)</code> in <code>DAT  …</code> hoặc <code>HONG …</code>.</li>

      <li>Viết <b>5 ca kiểm</b> theo bảng đặc tả: cùng ngân hàng, biên 500 000, sau
      biên, biên 5 000 000, số không.</li>

      <li>In <code>dat …, hong …</code>. Chấm bản <b>chưa sửa</b> (ra đúng 1 ca HONG);
      rồi sửa hàm.</li></ol>

      <p class="note">Tệp <code>KiemPhiChuyenKhoan.java</code>; bảng ca kiểm và định
      dạng dòng in ở <code>labs/JV2/L06/de.md</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 240
    say: Bây giờ tới phần bạn tự làm trên máy. Đề bài cho một hàm tính phí chuyển
      khoản có một lỗi biên, kèm bảng đặc tả. Hãy tự viết hai hàm trợ giúp để khẳng
      định, rồi viết năm ca kiểm theo bảng, gồm cùng ngân hàng, hai biên, một ca sau
      biên và số không. Chạy trên bản chưa sửa, bạn phải thấy đúng một ca báo hỏng.
      Rồi tự sửa lỗi và chạy lại. Hãy dừng video và tự viết, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>DAT  cung ngan hang</div><div>HONG
      bien 500000: mong 2000, thuc 7000</div><div>DAT  sau bien 500001</div><div>DAT  bien
      5000000</div><div>DAT  so khong</div><div>dat 4, hong 1</div></div><p class="note">Chấm
      bằng Git Bash: <code>bash labs/cham.sh JV2 L06 KiemPhiChuyenKhoan.java</code>
      — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> <code>kiem</code> nhận <code>LongSupplier</code>
      để gọi hàm bên trong nó: <code>kiem("bien 500000", 2000, () -&gt; phiChuyenKhoan(500000,
      false));</code>.

      Lỗi nằm ở dấu so sánh quanh 500 000. Lời giải: <code>labs/JV2/L06/loi_giai.java</code>
      — chỉ mở sau khi đã thử.</div>

      '
    say: Nếu kẹt, hàm trợ giúp nhận một hàm ngắn để gọi hàm cần kiểm bên trong nó,
      nhờ đó bắt được cả lúc ném ngoại lệ. Lỗi nằm ở dấu so sánh quanh năm trăm nghìn.
      Lời giải đầy đủ nằm trong thư mục thực hành của bài, chỉ mở sau khi bạn đã tự
      thử.
  lab: labs/JV2/L06
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>đặc tả → vùng và biên</span><span
      class=''a''>→</span><span class=''n''>mỗi biên hai ca</span><span class=''a''>→</span><span
      class=''n''>mong đợi lấy từ đặc tả</span><span class=''a''>→</span><span class=''n''>khẳng
      định: mong đợi vs thực tế</span><span class=''a''>→</span><span class=''n''>gây
      lỗi cố ý: ca phải đỏ</span><span class=''a''>→</span><span class=''n''>không
      kiểm hết: chọn theo rủi ro</span></div>'
    say: Tổng kết chuỗi logic. Từ đặc tả, tìm các vùng và các biên. Mỗi biên hai ca,
      đúng biên và ngay sau biên. Mong đợi lấy từ đặc tả. Khẳng định so mong đợi với
      thực tế. Gây lỗi cố ý để chắc ca kiểm có thể đỏ. Và vì không thể kiểm hết, ta
      chọn ca theo rủi ro.
  - show: '<div class=''box key''><b>Tư duy:</b> trước khi tin một ca kiểm xanh, hỏi
      ba câu: nếu mã sai thì <b>nó có đỏ không</b>, mong đợi của nó lấy từ <b>đặc
      tả hay từ mã</b>,

      và nó có <b>chạy độc lập</b> khi đổi thứ tự không.</div>

      '
    say: Điều cần mang theo. Trước khi tin một ca kiểm xanh, hãy hỏi ba câu. Nếu mã
      sai thì nó có đỏ không. Mong đợi của nó lấy từ đặc tả hay từ mã. Và nó có chạy
      độc lập khi đổi thứ tự không.
