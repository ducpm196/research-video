      khoản, nhưng ở hai gói khác nhau. Dùng tên đầy đủ thì chúng sống chung được,
      chạy ra hai dòng khác nhau. Với ba trăm lớp, số cặp có thể trùng tên ngắn là
      ba trăm nhân hai trăm chín mươi chín chia hai, gần bốn mươi lăm nghìn cặp, mà
      gói chia nhỏ chuyện đó.
  - show: '<table class=''t''><tr><th>số thư viện ngoài</th><th>3</th><th>30</th><th>300</th></tr><tr><td>độ
      dài đường dẫn tìm lớp (số minh hoạ: mỗi tệp 40 ký tự)</td><td>120</td><td>1
      200</td><td><b>12 000</b></td></tr><tr><td>so với giới hạn 8 191 ký tự của dòng
      lệnh <code>cmd.exe</code></td><td>vừa</td><td>vừa</td><td><b>vượt</b></td></tr></table><p
      class=''note''>Cách rút gọn: <code>java -cp "lib/*" bank.App</code> — dấu <code>*</code>
      lấy mọi tệp <code>.jar</code> trong <code>lib</code>.</p>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Thứ hai là đường dẫn tìm lớp dài ra. Mỗi thư viện ngoài là một tệp đóng gói
      phải liệt kê trong đường dẫn. Giả sử mỗi tệp chiếm bốn mươi ký tự, ba thư viện
      cần một trăm hai mươi ký tự, nhưng ba trăm thư viện cần mười hai nghìn. Quá
      giới hạn tám nghìn một trăm chín mươi mốt ký tự của dòng lệnh. Giải pháp là
      dùng dấu sao, và về lâu dài là công cụ xây dựng tự quản lý danh sách, điều bạn
      sẽ gặp ở dự án thật.
  - show: '<p><b>Dấu sao lấy mọi tệp đóng gói trong thư mục lib</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>mkdir lib</div><div><span class="cm"><span>&#36;</span>
      </span>jar --create --file lib/bank.jar -C out .</div><div><span class="cm"><span>&#36;</span>
      </span>java -cp "lib/*" bank.App</div><div>Phi: 6000</div><div>So du con: 4994000</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: 'Ta thử dấu sao thật. Bỏ tệp đóng gói vào thư mục thư viện rồi chạy chỉ với
      đường dẫn thư viện gạch chéo sao, chương trình vẫn chạy đúng. Đánh đổi của người
      làm nghề: gói và thư mục giúp quy mô lớn, nhưng đòi kỷ luật đặt tên và công
      cụ quản lý thư viện.'
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Chạy sai: thiếu <code>-cp</code>,
      hoặc gõ tên ngắn.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>java bank.App</div><div>Error: Could not find or load main class bank.App</div><div>Caused
      by: java.lang.ClassNotFoundException: bank.App</div><div><span class="cm"><span>&#36;</span>
      </span>java -cp out App</div><div>Error: Could not find or load main class App</div><div>Caused
      by: java.lang.ClassNotFoundException: App</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: 'Lỗi thứ nhất là chạy sai chỗ. Quên cờ cờ-pê thì máy tìm lớp trong thư mục
      hiện tại và không thấy gì. Có cờ nhưng gõ tên ngắn thì cũng không thấy, như
      ta vừa suy ra. Hai thông báo đều nói không tìm thấy lớp chính. Cách xử lý là
      kiểm ba thứ: đứng đúng thư mục, có cờ, và tên đầy đủ.'
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Chạm vào trường riêng tư
      hay hàm mặc định từ gói khác.</div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>javac -d out src/bank/model/TaiKhoan.java src/bank/Sai.java</div><div>src/bank/Sai.java:8:
      error: soDu has private access in TaiKhoan</div><div>        tk.soDu = 5000;</div><div>          ^</div><div>src/bank/Sai.java:9:
      error: moTa() is not public in TaiKhoan; cannot be accessed from outside package</div><div>        System.out.println(tk.moTa());</div><div>                             ^</div><div>2
      errors</div></div>'
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Lỗi thứ hai là xâm phạm truy cập. Lớp ở gói khác sửa thẳng trường riêng tư
      thì bị từ chối. Gọi hàm mặc định từ gói khác cũng bị từ chối, vì hàm không công
      khai. Trình biên dịch báo ngay hai lỗi, nên đây là lỗi lúc biên dịch chứ không
      phải lúc chạy. Muốn cho phép thì phải chủ động mở bằng từ công khai.
  - show: '<div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Nạp tên bằng dấu
      sao từ hai gói có lớp cùng tên.</div><p><b>Đầu tệp NhapSao.java</b></p><div
      class="code"><div><span class="kw">import</span> nganhang.*;</div><div><span
      class="kw">import</span> thetindung.*;</div><div> </div></div><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>javac -d out src/nganhang/TaiKhoan.java
      src/thetindung/TaiKhoan.java src/NhapSao.java</div><div>src/NhapSao.java:6:
      error: reference to TaiKhoan is ambiguous</div><div>        TaiKhoan a = null;</div><div>        ^</div><div>  both
      class thetindung.TaiKhoan in thetindung and class nganhang.TaiKhoan in nganhang
      match</div><div>1 error</div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba hay gặp ở người đã đi làm. Nạp tên bằng dấu sao từ hai gói, và
      cả hai gói có lớp cùng tên. Đến chỗ dùng tên ngắn, trình biên dịch không biết
      chọn lớp nào và báo mơ hồ. Cách tránh là nạp tên từng lớp cụ thể, hoặc viết
      tên đầy đủ ở đúng chỗ cần.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  steps:
  - show: '<p><b>Đề.</b> Tệp <code>src/shop/ban/DonHang.java</code> có lớp công khai
      <code>DonHang</code> với hàm công khai <code>tong()</code>. Lớp <code>Main</code>
      nằm ở <code>src/shop/Main.java</code>.</p>

      <ol><li>Viết dòng đầu của <code>DonHang.java</code> và dòng nạp tên trong <code>Main.java</code>.</li>

      <li>Lệnh biên dịch ra <code>out</code> và lệnh chạy <code>Main</code>?</li>

      <li>Tệp lớp của <code>DonHang</code> nằm ở đâu?</li></ol>

      <p><b>Chọn A hay B?</b> Hàm <code>kiemTra()</code> chỉ cần cho các lớp cùng
      gói. A: <code>public</code>. B: không ghi mức truy cập. Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    pause: 25
    say: Bây giờ tới phần bạn tự làm. Tệp đơn hàng nằm trong thư mục cửa hàng chấm
      bán, còn lớp chính nằm ở thư mục cửa hàng. Hãy viết dòng khai báo gói, dòng
      nạp tên, lệnh biên dịch, lệnh chạy, và nói tệp lớp nằm ở đâu. Rồi chọn giữa
      công khai và mặc định cho hàm chỉ cần trong gói, và giải thích vì sao. Hãy dừng
      video và tự làm.
  - show: <table class='t'><tr><th>câu</th><th>đáp án</th><th>vì sao</th></tr><tr><td>1</td><td><code>package
      shop.ban;</code> và <code>import shop.ban.DonHang;</code></td><td>gói khớp thư
      mục <code>shop/ban</code></td></tr><tr><td>2</td><td><code>javac -d out src/shop/ban/DonHang.java
      src/shop/Main.java</code>; <code>java -cp out shop.Main</code></td><td>tên đầy
      đủ <code>shop.Main</code></td></tr><tr><td>3</td><td><code>out/shop/ban/DonHang.class</code></td><td>thư
      mục đích + gói đổi chấm thành gạch chéo</td></tr></table>
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án, gói của đơn hàng là cửa hàng chấm bán, vì thư mục là cửa hàng gạch
      chéo bán, và lớp chính nạp tên đúng như vậy. Biên dịch đưa cả hai tệp và cờ
      d, chạy dùng tên đầy đủ của lớp chính. Tệp lớp của đơn hàng nằm trong thư mục
      đích, rồi cửa hàng, rồi bán, đúng bằng thư mục đích cộng với gói đổi dấu chấm
      thành gạch chéo.
    clear: true
  - show: '<div class="box key"><b>Chọn B</b> (không ghi). Vì hàm chỉ để các lớp trong
      gói dùng, nên giấu khỏi mọi nơi khác: <b>mở càng ít càng tốt</b>.

      Sau này đổi cách làm bên trong, chỉ cần sửa trong gói; còn <code>public</code>
      là lời hứa với cả thế giới.</div>

      '
    say: Chọn phương án B, không ghi mức truy cập. Hàm chỉ cần trong gói thì nên giấu
      khỏi nơi khác, vì mở càng ít càng dễ thay đổi về sau. Từ công khai là lời hứa
      với mọi người dùng bên ngoài, một khi đã hứa thì khó rút lại.
- id: practice
  kind: practice
  title: 'Tự làm: cửa hàng hai tệp, hai gói'
  steps:
  - show: '<p><b>Đề</b>: dựng dự án <b>hai gói</b>, chạy bằng hai cách.</p>

      <ol><li><code>src/shop/kho/Hang.java</code>: <code>private int soLuong</code>,
      hàm tạo, <code>boolean ban(int n)</code>, <code>int con()</code>.</li>

      <li><code>src/shop/Main.java</code>: tạo <code>Hang</code> 12 cái, bán 5 rồi
      bán 9, in kết quả.</li>

      <li><code>javac -d out …</code>, <code>java -cp out shop.Main</code>, rồi <code>jar</code>
      và <code>java -jar cuahang.jar</code>.</li></ol>

      <p class="note">Gom mọi lệnh vào tệp <code>lenh.sh</code> (hai tệp Java tạo
      bằng <code>cat &gt; … &lt;&lt;''EOF''</code>). Thư mục lab: <code>labs/JV2/L00</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 120
    say: Bây giờ tới phần bạn tự làm trên máy. Dựng dự án hai gói. Lớp hàng nằm trong
      gói cửa hàng chấm kho, giữ số lượng ở trường riêng tư, có hàm bán và hàm đọc
      số còn. Lớp chính ở gói cửa hàng tạo mười hai cái, bán năm, rồi thử bán chín.
      Biên dịch ra thư mục đích, chạy bằng đường dẫn tìm lớp, rồi đóng gói và chạy
      từ tệp đóng gói. Hãy dừng video, mở trình soạn mã và tự viết, đừng chép lại
      ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>ban 5 cai, con 7</div><div>ban
      9 cai: tu choi, con 7</div><div>ban 5 cai, con 7</div><div>ban 9 cai: tu choi,
      con 7</div></div><p class="note">Chấm bằng Git Bash: <code>bash labs/cham.sh
      JV2 L00 lenh.sh</code> — in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> hàm bán trả <code>false</code> khi
      <code>n &gt; soLuong</code>, ngược lại trừ rồi trả <code>true</code>. Lớp <code>Main</code>
      cần <code>import shop.kho.Hang;</code>.

      Chạy từ thư mục chứa <code>src</code>. Lời giải: <code>labs/JV2/L00/loi_giai.sh</code>
      — chỉ mở sau khi đã thử.</div>

      '
    say: Nếu kẹt, hàm bán trả sai khi số cần bán lớn hơn số còn, ngược lại trừ đi
      rồi trả đúng. Lớp chính phải nạp tên lớp hàng. Hãy chạy các lệnh từ thư mục
      chứa thư mục nguồn. Lời giải đầy đủ nằm trong thư mục thực hành của bài, chỉ
      mở sau khi bạn đã tự thử.
  lab: labs/JV2/L00
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: <div class='chain'><span class='n'>lớp có tên đầy đủ = gói + lớp</span><span
      class='a'>→</span><span class='n'>thư mục nguồn khớp tên gói</span><span class='a'>→</span><span
      class='n'>javac -d out</span><span class='a'>→</span><span class='n'>java -cp
      out tên-đầy-đủ</span><span class='a'>→</span><span class='n'>jar gom thành một
      tệp</span><span class='a'>→</span><span class='n'>mở càng ít càng tốt</span></div>
    say: Tổng kết chuỗi logic. Lớp có tên đầy đủ gồm gói và tên lớp. Thư mục nguồn
      phải khớp tên gói. Biên dịch với cờ d để ra thư mục đích có cùng cấu trúc. Chạy
      với cờ cờ-pê và tên đầy đủ. Đóng gói để gom thành một tệp. Và mức truy cập nên
      mở càng ít càng tốt.
  - show: '<div class=''box key''><b>Tư duy:</b> khi một chương trình không chạy,
      hỏi ba câu: tên đầy đủ của lớp là gì, tệp lớp có nằm đúng thư mục

      trong đường dẫn tìm lớp không, và lớp đứng đó có được phép nhìn thấy thứ nó
      đang gọi không.</div>

      '
    say: Điều cần mang theo. Khi chương trình không chạy, hãy hỏi ba câu. Tên đầy
      đủ của lớp là gì. Tệp lớp có nằm đúng thư mục trong đường dẫn tìm lớp không.
      Và lớp đứng đó có được phép nhìn thấy thứ nó đang gọi hay không.
