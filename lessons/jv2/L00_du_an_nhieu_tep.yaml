      text-anchor="middle" fill="#1f2937" font-weight="bold">Tên đầy đủ gồm gói +
      lớp</text><text x="1130" y="100" font-size="28" text-anchor="middle" fill="#1f2937"
      font-weight="bold">nganhang.TaiKhoan</text><text x="1130" y="150" font-size="28"
      text-anchor="middle" fill="#1f2937" font-weight="bold">thetindung.TaiKhoan</text><text
      x="1130" y="210" font-size="24" text-anchor="middle" fill="#16a34a" font-weight="bold">Hai
      lớp cùng tên, không đụng nhau</text></svg></div>
    clear: true
    say: Một chương trình thật không nằm trong một tệp. Ngân hàng nhỏ cũng có hàng
      trăm tệp, và hai nhóm khác nhau rất có thể cùng đặt một lớp tên là tài khoản.
      Nhét hết vào một thư mục thì tên trùng nhau và không ai tìm ra gì. Lời giải
      là gói, nghĩa là cho mỗi lớp một địa chỉ đầy đủ gồm tên gói và tên lớp.
  - show: '<div class="box key">Hôm nay: <b>dự án nhiều tệp</b>. Ba việc: đặt lớp
      vào <b>gói</b>, biên dịch ra một thư mục riêng và chạy bằng

      <b>đường dẫn tìm lớp</b>, rồi đóng gói thành <b>một tệp</b> chạy được. Thêm
      ba mức truy cập quyết định lớp nào được nhìn thấy lớp nào.</div>

      '
    say: Hôm nay ta học dự án nhiều tệp. Ta đặt lớp vào gói, biên dịch ra một thư
      mục riêng, chạy bằng đường dẫn tìm lớp, rồi đóng gói thành một tệp duy nhất.
      Ta cũng học ba mức truy cập, quyết định lớp nào được nhìn thấy lớp nào.
- id: prereq
  kind: prereq
  title: 'Ôn lại: lớp, hàm chính và dòng lệnh'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      tệp và lớp</td><td>một lớp công khai nằm trong tệp có <b>cùng tên</b>: lớp <code>Chao</code>
      ở tệp <code>Chao.java</code></td></tr><tr><td>② biên dịch và chạy</td><td><code>javac
      Chao.java</code> tạo <code>Chao.class</code>; <code>java Chao</code> chạy nó</td></tr><tr><td>③
      dòng lệnh</td><td><code>cd</code> đổi thư mục, <code>find</code> liệt kê tệp,
      <code>|</code> nối đầu ra sang lệnh sau</td></tr><tr><td>④ trường riêng tư</td><td><code>private</code>
      trên trường: chỉ mã trong cùng lớp được chạm vào</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 1
    say: Ta ôn lại bốn điều. Lớp công khai nằm trong tệp cùng tên. Lệnh biên dịch
      biến tệp mã nguồn thành tệp lớp, lệnh chạy khởi động nó. Trong cửa sổ lệnh,
      lệnh liệt kê tìm tệp và dấu gạch đứng nối kết quả sang lệnh sau. Và trường riêng
      tư thì chỉ mã trong cùng lớp được chạm vào. Bài này dùng đúng bốn điều đó, nhưng
      với nhiều tệp.
- id: sym
  kind: symbol
  title: Giải mã sáu từ của dự án nhiều tệp
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>package
      bank.model;</code></td><td>dòng <b>đầu tiên</b> của tệp: lớp này thuộc <b>gói</b>
      tên <code>bank.model</code></td></tr><tr><td><code>import bank.model.TaiKhoan;</code></td><td><b>nạp
      tên</b>: từ nay viết <code>TaiKhoan</code> thay cho tên đầy đủ</td></tr><tr><td><code>javac
      -d out …</code></td><td>cờ <code>-d</code>: đặt các tệp <code>.class</code>
      vào thư mục đích <code>out</code></td></tr><tr><td><code>java -cp out bank.App</code></td><td>cờ
      <code>-cp</code>: <b>đường dẫn tìm lớp</b> là thư mục <code>out</code>; rồi
      tên đầy đủ của lớp</td></tr><tr><td><code>jar</code></td><td>lệnh gom nhiều
      tệp <code>.class</code> thành <b>một tệp</b> đuôi <code>.jar</code></td></tr><tr><td><code>public</code>
      / không ghi / <code>private</code></td><td>ba mức truy cập: ai cũng thấy / chỉ
      cùng gói / chỉ cùng lớp</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Bảng này có sáu thứ. Dòng khai báo gói luôn đứng đầu tệp và nói lớp thuộc
      gói nào. Lệnh nạp tên cho phép viết tên ngắn thay cho tên đầy đủ. Cờ d của lệnh
      biên dịch đặt các tệp lớp vào thư mục đích. Cờ cờ-pê của lệnh chạy cho biết
      thư mục để tìm lớp, kèm tên đầy đủ của lớp cần chạy. Lệnh đóng gói gom nhiều
      tệp lớp thành một tệp. Cuối cùng là ba mức truy cập, ai cũng thấy, chỉ cùng
      gói thấy, hoặc chỉ cùng lớp thấy.
  - show: <p><b>Tệp src/bank/App.java (đoạn đầu)</b></p><div class="code"><div><span
      class="kw">package</span> bank;</div><div> </div><div><span class="kw">import</span>
      bank.model.TaiKhoan;</div><div><span class="kw">import</span> bank.service.PhiChuyen;</div><div>
