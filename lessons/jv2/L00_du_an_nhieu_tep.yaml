- id: formula
  kind: formula
  title: 'Suy ra từng bước: từ tên gói tới đường dẫn tệp'
  steps:
  - show: <p><b>Bước 1.</b> Tên đầy đủ nối gói và lớp bằng dấu chấm:</p><p><code>bank.model</code>
      + <code>.</code> + <code>TaiKhoan</code> = <code>bank.model.TaiKhoan</code></p>
    focus:
    - 1
    - 1
    - 2
    say: Bước một, ghép tên đầy đủ. Gói là ngân hàng chấm mô hình, lớp là tài khoản,
      nối bằng một dấu chấm ta được tên đầy đủ. Máy ảo luôn dùng tên đầy đủ này, nên
      hai lớp trùng tên ngắn vẫn là hai lớp khác nhau.
  - show: <p><b>Bước 2.</b> Đổi mỗi dấu chấm của gói thành dấu gạch chéo, thêm thư
      mục gốc và đuôi tệp:</p><p><code>src/</code> + <code>bank/model</code> + <code>/TaiKhoan</code>
      + <code>.java</code> = <code>src/bank/model/TaiKhoan.java</code></p>
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, tìm đường dẫn tệp nguồn. Vì dấu chấm của gói tương ứng với dấu
      gạch chéo của thư mục, nên ta đổi chúng rồi đặt thư mục gốc phía trước và đuôi
      tệp phía sau. Kết quả là đường dẫn của tệp nguồn mà ta đã viết.
  - show: <p><b>Bước 3.</b> Cờ <code>-d out</code> chỉ đổi thư mục gốc và đuôi tệp;
      phần giữa giữ nguyên:</p><table class='t'><tr><th>thành phần</th><th>tệp nguồn</th><th>tệp
      lớp</th></tr><tr><td>thư mục gốc</td><td><code>src/</code></td><td><code>out/</code></td></tr><tr><td>gói
      đổi chấm thành gạch chéo</td><td><code>bank/model</code></td><td><code>bank/model</code></td></tr><tr><td>tên
      lớp</td><td><code>/TaiKhoan</code></td><td><code>/TaiKhoan</code></td></tr><tr><td>đuôi
      tệp</td><td><code>.java</code></td><td><code>.class</code></td></tr></table>
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, tệp lớp sau khi biên dịch. Cờ d đổi thư mục gốc thành out, còn đuôi
      tệp thành lớp, phần giữa giữ nguyên. Nên chỉ cần biết tên đầy đủ là suy ra được
      cả hai đường dẫn.
  - show: '<p><b>Bước 4.</b> <code>-cp out</code> nghĩa là: <b>bắt đầu tìm từ thư
      mục <code>out</code></b>. Máy ghép <code>out/</code> + tên đầy đủ đã đổi chấm
      thành gạch chéo + <code>.class</code>:</p><p><code>java -cp out bank.App</code>
      &rarr; mở <code>out/bank/App.class</code> <b class=''green''>(đúng)</b></p><p><code>java
      -cp out App</code> &rarr; mở <code>out/App.class</code> <b class=''red''>(sai)</b>
      không có</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Bước bốn, vì sao chạy phải kèm tên đầy đủ. Đường dẫn tìm lớp là điểm xuất
      phát, và máy ghép điểm đó với tên đầy đủ để ra tệp cần mở. Gõ đúng tên đầy đủ
      thì mở được tệp lớp của ứng dụng. Chỉ gõ tên ngắn thì máy tìm một tệp không
      tồn tại.
- id: example
  kind: example
  title: 'Ví dụ: dựng, biên dịch, chạy và đóng gói dự án ba tệp'
  checks:
  - 3000 + (5000000 - 2000000) // 1000 == 6000
  - 10000000 - (5000000 + 6000) == 4994000
  - 5000000 - 2000000 == 3000000
  steps:
  - show: '<p><b>① Ba tệp nguồn đã viết xong</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>find src -name "*.java" | sort</div><div>src/bank/App.java</div><div>src/bank/model/TaiKhoan.java</div><div>src/bank/service/PhiChuyen.java</div></div><p
      class=''note''>Ba tệp ở ba thư mục: <code>bank</code>, <code>bank/model</code>,
      <code>bank/service</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Phép làm thứ nhất, liệt kê ba tệp nguồn. Ta dùng lệnh liệt kê kèm sắp xếp
      để thứ tự luôn giống nhau trên mọi máy. Thấy đúng ba tệp, mỗi tệp nằm ở thư
      mục khớp với dòng khai báo gói của nó.
  - show: <p><b>② Biên dịch ra out, rồi xem thư mục out</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>javac -d out src/bank/model/TaiKhoan.java
      src/bank/service/PhiChuyen.java src/bank/App.java</div><div><span class="cm"><span>&#36;</span>
      </span>find out -name "*.class" | sort</div><div>out/bank/App.class</div><div>out/bank/model/TaiKhoan.class</div><div>out/bank/service/PhiChuyen.class</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Phép làm thứ hai, biên dịch. Ta đưa cho trình biên dịch cả ba tệp và cờ d.
      Lệnh không in gì, nghĩa là không có lỗi. Nhìn vào thư mục đích thấy ba tệp lớp
      nằm đúng cấu trúc thư mục như cây nguồn.
  - show: $$③ \; 3\,000 + (5\,000\,000 - 2\,000\,000) / 1\,000 = \hl{6\,000}$$$$④
      \; 10\,000\,000 - (5\,000\,000 + 6\,000) = \hl{4\,994\,000}$$
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép làm thứ ba, tính tay phí chuyển năm triệu đồng. Phần vượt hai triệu
      là ba triệu, chia một nghìn được ba nghìn, cộng ba nghìn cố định thành sáu nghìn
      đồng. Phép làm thứ tư, tài khoản có mười triệu bị rút năm triệu cộng sáu nghìn
      phí, còn bốn triệu chín trăm chín mươi tư nghìn đồng.
  - show: '<p><b>⑤ Chạy bằng đường dẫn tìm lớp</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>java -cp out bank.App</div><div>Phi: 6000</div><div>So
      du con: 4994000</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: 'Phép làm thứ năm, chạy chương trình với cờ cờ-pê trỏ vào thư mục đích. Hai
      dòng in ra khớp đúng với hai phép tính tay: phí là sáu nghìn, số dư còn bốn
      triệu chín trăm chín mươi tư nghìn.'
  - show: '<p><b>⑥ Đóng gói và chạy từ một tệp</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>jar --create --file bank.jar --main-class
      bank.App -C out .</div><div><span class="cm"><span>&#36;</span> </span>jar tf
      bank.jar | sort</div><div>META-INF/</div><div>META-INF/MANIFEST.MF</div><div>bank/</div><div>bank/App.class</div><div>bank/model/</div><div>bank/model/TaiKhoan.class</div><div>bank/service/</div><div>bank/service/PhiChuyen.class</div><div><span
      class="cm"><span>&#36;</span> </span>java -jar bank.jar</div><div>Phi: 6000</div><div>So
      du con: 4994000</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Cuối cùng là đóng gói. Lệnh đóng gói gom thư mục đích thành một tệp, và ghi
      sẵn tên lớp chạy đầu tiên. Danh sách bên trong có thêm thư mục mô tả, còn lại
      giống hệt thư mục đích. Khi chạy chỉ cần một lệnh, đưa tên tệp đóng gói, và
      ra cùng hai dòng kết quả.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm lớp và so hai cách chạy'
  checks:
  - 3000 + 3000000 * 0.001 == 6000
  - len(['App', 'TaiKhoan', 'PhiChuyen']) == 3
  steps:
  - show: '<p>Đếm: ba tệp <code>.java</code> &rarr; ba tệp <code>.class</code> &rarr;
      ba lớp trong tệp đóng gói (ngoài thư mục và tệp mô tả).</p>

      <p>Hai cách chạy, <code>java -cp out bank.App</code> và <code>java -jar bank.jar</code>,
      in <b>cùng</b> hai dòng: <code>Phi: 6000</code> và <code>So du con: 4994000</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Cách kiểm thứ nhất là đếm. Ba tệp nguồn cho ra ba tệp lớp, và ba tệp lớp
      đó đều có mặt trong tệp đóng gói. Cách kiểm thứ hai là so hai cách chạy khác
      nhau. Chạy từ thư mục đích và chạy từ tệp đóng gói cho đúng hai dòng giống nhau,
      nên việc đóng gói không làm đổi hành vi.
  - show: '<p>Kiểm phí bằng đường khác: phần vượt hai triệu tính 1 phần nghìn nghĩa
      là $0{,}1\%$:</p>

      $$3\,000 + 3\,000\,000 \times 0{,}001 = \hl{6\,000}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Kiểm phí theo cách khác. Phần vượt hai triệu là ba triệu, tính một phần nghìn
      tức không phẩy một phần trăm. Ba triệu nhân không phẩy không không một bằng
      ba nghìn, cộng ba nghìn cố định là sáu nghìn. Trùng với kết quả của chương trình,
      vậy cả công thức và mã đều đúng.
- id: scale
  kind: concept
  title: 'Khi dự án lớn gấp một trăm lần: tên trùng và đường dẫn dài'
  checks:
  - 300 * 299 // 2 == 44850
  - 3 * 40 == 120
  - 30 * 40 == 1200
  - 300 * 40 == 12000
  - 12000 > 8191
  - 1200 < 8191
  steps:
  - show: '<p><b>nganhang/TaiKhoan.java</b></p><div class="code"><div><span class="kw">package</span>
      nganhang;</div><div> </div><div><span class="kw">public</span> <span class="kw">class</span>
      TaiKhoan {</div><div>    <span class="kw">public</span> String loai() {</div><div>        <span
      class="kw">return</span> "thanh toan";</div><div>    }</div></div><p><b>Hai
      lớp cùng tên, hai gói</b></p><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>javac -d out src/nganhang/TaiKhoan.java src/thetindung/TaiKhoan.java
      src/TrungTen.java</div><div><span class="cm"><span>&#36;</span> </span>java
      -cp out TrungTen</div><div>Loai A: thanh toan</div><div>Loai B: tin dung</div></div>'
