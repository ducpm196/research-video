      <span class="kw">void</span> main(String[] args) {</div><div>        TaiKhoan
      tk = <span class="kw">new</span> TaiKhoan(10000000);</div></div>
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Đây là đầu tệp thật của ví dụ hôm nay. Dòng một khai báo gói ngân hàng. Hai
      dòng nạp tên lấy lớp tài khoản từ gói con mô hình, và lớp tính phí từ gói con
      dịch vụ. Dấu chấm trong tên gói tách các tầng, giống dấu gạch chéo tách thư
      mục.
