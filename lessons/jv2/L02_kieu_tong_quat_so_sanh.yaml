      fill="#1f2937">hộp</text><text x="515.0" y="151" font-size="26" text-anchor="middle"
      fill="#1f2937">(Object)</text><line x1="405" y1="240" x2="330" y2="240" stroke="#dc2626"
      stroke-width="3.5" marker-end="url(#ah)"/><text x="367" y="230" font-size="22"
      text-anchor="middle" fill="#dc2626">ép thành Long</text><text x="240" y="275"
      font-size="30" text-anchor="middle" fill="#dc2626" font-weight="bold">NỔ lúc
      chạy</text><rect x="780" y="10" width="700" height="310" rx="12" fill="#dcfce7"
      stroke="#16a34a" stroke-width="3"/><text x="1130.0" y="48" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">Hộp có nhãn: Hop&lt;Long&gt;</text><rect x="820"
      y="90" width="260" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text
      x="950.0" y="134" font-size="26" text-anchor="middle" fill="#1f2937">"500000"</text><line
      x1="1085" y1="125" x2="1160" y2="125" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ah)"/><text
      x="1122" y="115" font-size="22" text-anchor="middle" fill="#16a34a">bỏ vào</text><rect
      x="1165" y="70" width="270" height="110" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="1300.0" y="117" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">hộp</text><text x="1300.0" y="151" font-size="26"
      text-anchor="middle" fill="#1f2937">Hop&lt;Long&gt;</text><text x="1130" y="250"
      font-size="30" text-anchor="middle" fill="#16a34a" font-weight="bold">TỪ CHỐI
      lúc biên dịch</text><text x="1130" y="290" font-size="24" text-anchor="middle"
      fill="#1f2937">lỗi tới sớm, trước khi phát hành</text></svg></div>'
    clear: true
    say: Hình dung hộp không nhãn như một cái thùng nhận mọi thứ. Bỏ gì vào cũng được,
      nhưng lúc lấy ra phải đoán kiểu, và đoán sai thì nổ ở lúc chạy. Hộp có nhãn
      kiểu thì khác. Trình biên dịch nhìn nhãn và từ chối món sai ngay lúc ta bấm
      biên dịch, tức là trước khi chương trình tới tay người dùng.
  - show: '<div class="code"><div><span class="kw">static</span> <span class="kw">class</span>
      Hop&lt;T&gt; {</div><div>    <span class="kw">private</span> <span class="kw">final</span>
      T giaTri;                      <span class="cm">// T: kiểu do người dùng chọn</span></div><div>    Hop(T
      giaTri) { <span class="kw">this</span>.giaTri = giaTri; }</div><div>    T lay()
      { <span class="kw">return</span> giaTri; }</div><div>}</div></div><div class="code"><div>Hop&lt;Long&gt;
      tien = <span class="kw">new</span> Hop&lt;Long&gt;("500000");    <span class="cm">//
      hộp của Long mà bỏ chuỗi vào</span></div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div><span class="cm">error: incompatible types: String cannot
      be converted to Long</span></div><div><span class="cm">        Hop&lt;Long&gt;
      tien = new Hop&lt;Long&gt;("500000");…</span></div><div><span class="cm">                                       ^</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là chiếc hộp có tham số kiểu. Chữ T là chỗ trống, hộp cất giá trị kiểu
      T và trả giá trị kiểu T. Khi ta khai hộp của số nguyên dài mà bỏ chuỗi vào,
      trình biên dịch từ chối ngay, kèm dòng chỉ đúng chỗ sai.
  - show: <div class="code"><div>    Hop&lt;Long&gt; tien = <span class="kw">new</span>
      Hop&lt;&gt;(500000L);</div><div>    Hop&lt;String&gt; ten = <span class="kw">new</span>
      Hop&lt;&gt;("An");</div><div>    <span class="kw">long</span> gapDoi = tien.lay()
      * 2;                <span class="cm">// không cần ép kiểu</span></div><div>    System.out.println(ten.lay()
      + " " + gapDoi);</div><div>}</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>An
      1000000</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Dùng đúng thì gọn hơn nữa. Hai hộp, một hộp số nguyên dài, một hộp chuỗi,
      dùng chung một lớp. Lấy số ra nhân đôi không cần ép kiểu, vì trình biên dịch
      đã biết đó là số nguyên dài.
  - show: '<div><svg width="1500" height="300" viewBox="0 0 1500 300" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="70" width="330" height="90" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="185.0" y="91" font-size="24" text-anchor="middle"
      fill="#1f2937" font-weight="bold">① Comparable</text><text x="185.0" y="123"
      font-size="24" text-anchor="middle" fill="#1f2937">thứ tự TỰ NHIÊN</text><text
      x="185.0" y="155" font-size="24" text-anchor="middle" fill="#1f2937">một cách,
      nằm trong lớp</text><rect x="20" y="180" width="330" height="90" rx="10" fill="#e5e7eb"
      stroke="#6b7280" stroke-width="3"/><text x="185.0" y="217" font-size="24" text-anchor="middle"
      fill="#1f2937">a.compareTo(b)</text><text x="185.0" y="249" font-size="24" text-anchor="middle"
      fill="#1f2937">chuỗi, số: có sẵn</text><rect x="560" y="70" width="330" height="90"
      rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="725.0" y="91"
      font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">② Comparator</text><text
      x="725.0" y="123" font-size="24" text-anchor="middle" fill="#1f2937">thứ tự
      DO NGƯỜI GỌI chọn</text><text x="725.0" y="155" font-size="24" text-anchor="middle"
      fill="#1f2937">nhiều cách, đặt ngoài lớp</text><rect x="560" y="180" width="330"
      height="90" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><text
      x="725.0" y="217" font-size="24" text-anchor="middle" fill="#1f2937">compare(a,
      b)</text><text x="725.0" y="249" font-size="24" text-anchor="middle" fill="#1f2937">loại
      rồi tiền…</text><text x="1180" y="120" font-size="30" text-anchor="middle" fill="#1f2937"
      font-weight="bold">dùng cái nào?</text><text x="1180" y="170" font-size="24"
      text-anchor="middle" fill="#1f2937">một thứ tự mặc định hiển nhiên</text><text
      x="1180" y="205" font-size="28" text-anchor="middle" fill="#2a78d6" font-weight="bold">→
      ①</text><text x="1180" y="245" font-size="24" text-anchor="middle" fill="#16a34a"
      font-weight="bold">nhiều cách xếp tuỳ ngữ cảnh → ②</text></svg></div>'
    clear: true
    say: Còn hai cách sắp xếp. Thứ tự tự nhiên nằm ngay trong lớp, mỗi lớp chỉ có
      một. Chuỗi và số đã có sẵn. Bộ so sánh thì nằm ngoài lớp và do người gọi chọn,
      nên cùng một danh sách có thể xếp theo nhiều cách. Giao dịch có thể xếp theo
      loại, theo tiền, theo ngày, nên ta dùng bộ so sánh.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: bộ so sánh hai khoá'
  checks:
  - (1500000 > 2000000) - (1500000 < 2000000) == -1
  - ord('c') - ord('n') == -11
  - ord('r') - ord('n') == 4
  - ((3000000000 - 1 + 2**31) % 2**32) - 2**31 == -1294967297
  steps:
  - show: '<div class="code"><div><span class="kw">static</span> &lt;T <span class="kw">extends</span>
      Comparable&lt;T&gt;&gt; T lon(T a, T b) {</div><div>    <span class="kw">return</span>
      a.compareTo(b) &gt;= 0 ? a : b;          <span class="cm">// compareTo: âm,
      không, hay dương</span></div><div>}</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>7</div><div>abd</div><div>-11 0 4</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    clear: true
    say: Bước một, hiểu hàm so sánh. Hai số cho ra bảy là lớn hơn. Hai chuỗi so theo
      thứ tự từ điển, nên chuỗi a b c đứng trước a b d. Với chuyển và nạp, chữ c đứng
      trước chữ n, nên kết quả là số âm, và chính xác là âm mười một. Chỉ dấu của
      kết quả mới quan trọng, không phải độ lớn.
  - show: '<p><b>Bước 2.</b> Muốn xếp theo <b>hai khoá</b>: so khoá 1; nếu <b>khác
      0</b> thì có đáp án ngay; nếu <b>bằng 0</b> mới so khoá 2.</p>

      <p><code>c = a.loai().compareTo(b.loai());</code></p><p><code>if (c != 0) return
      c;</code></p><p><code>return …khoá 2…;</code></p>

      '
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước hai, ghép hai khoá. Vì khoá thứ hai chỉ có ý nghĩa khi hai phần tử ngang
      nhau ở khoá thứ nhất, nên ta so khoá một trước. Nếu khác không thì có đáp án
      ngay. Chỉ khi bằng không mới sang khoá hai.
  - show: '<p><b>Bước 3.</b> Muốn <b>giảm dần</b>, đảo hai đối số:</p>

      <p><code>Long.compare(a.soTien(), b.soTien())</code> &rarr; tăng dần</p><p><code>Long.compare(b.soTien(),
      a.soTien())</code> &rarr; <b>giảm dần</b></p>

      <p>Thử: a = 2 000 000, b = 1 500 000. <code>Long.compare(b, a)</code> = <code>compare(1
      500 000, 2 000 000)</code> = <b>−1</b> &rarr; a đứng <b>trước</b> b ✓</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Bước ba, đảo chiều. Muốn giảm dần thì đảo hai đối số, và ta thử bằng số.
      Giao dịch a hai triệu, giao dịch b một triệu rưỡi. So b với a, một triệu rưỡi
      nhỏ hơn hai triệu, nên kết quả là âm một, nghĩa là a đứng trước b. Đúng ý, số
      lớn đứng trước.
  - show: '<p><b>Bước 4.</b> Vì sao dùng <code>Long.compare</code> chứ không viết
      <code>a - b</code>? Phép trừ có thể <b>tràn</b>:</p>

      <p><code>(int) (3 000 000 000 − 1)</code> = <code>−1 294 967 297</code>: dấu
      <b>sai</b> &rarr; máy tưởng 3 tỉ đứng <b>trước</b> 1.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, vì sao không dùng phép trừ. Ba tỉ trừ một là gần ba tỉ, nhưng khi
      ép về số nguyên thường thì bị tràn và thành âm một tỉ hai trăm chín mươi bốn
      triệu. Dấu sai, nên máy tin ba tỉ đứng trước một. Ta sẽ thấy nó làm hỏng cả
      bản sắp xếp ở phần lỗi hay gặp.
- id: example
  kind: example
  title: 'Ví dụ: sáu giao dịch xếp theo loại rồi tiền giảm dần'
  checks:
  - ord('c') < ord('n') < ord('r')
  - 2000000 > 1500000
  - 700000 > 500000 > 300000
  - '[g[0] for g in sorted([(1,''rut'',500000),(2,''nap'',2000000),(3,''rut'',300000),(4,''chuyen'',1200000),(5,''nap'',1500000),(6,''rut'',700000)],
    key=lambda g: (g[1], -g[2]))] == [4, 2, 5, 6, 1, 3]'
  steps:
  - show: '<div class="code"><div><span class="kw">static</span> <span class="kw">class</span>
      TheoLoaiRoiTien <span class="kw">implements</span> Comparator&lt;GiaoDich&gt;
      {</div><div>    <span class="kw">public</span> <span class="kw">int</span> compare(GiaoDich
      a, GiaoDich b) {</div><div>        <span class="kw">int</span> c = a.loai().compareTo(b.loai());        <span
      class="cm">// khoá 1: loại, tăng dần</span></div><div>        <span class="kw">if</span>
      (c != 0) {</div><div>            <span class="kw">return</span> c;</div><div>        }</div><div>        <span
      class="kw">return</span> Long.compare(b.soTien(), a.soTien()); <span class="cm">//
      khoá 2: tiền, GIẢM dần</span></div><div>    }</div><div>}</div></div>'
    clear: true
    say: Đây là bộ so sánh hai khoá của ta, nằm trong một lớp cài giao diện bộ so
      sánh cho kiểu giao dịch. Khoá một là loại, tăng dần theo từ điển. Nếu hai loại
      giống nhau thì khoá hai là số tiền, đảo hai đối số để giảm dần.
  - show: '<div class="code"><div><span class="kw">public</span> <span class="kw">static</span>
      <span class="kw">void</span> main(String[] args) {</div><div>    List&lt;GiaoDich&gt;
      ds = <span class="kw">new</span> ArrayList&lt;&gt;(List.of(</div><div>            <span
      class="kw">new</span> GiaoDich(1, "rut", 500000), <span class="kw">new</span>
      GiaoDich(2, "nap", 2000000),</div><div>            <span class="kw">new</span>
      GiaoDich(3, "rut", 300000), <span class="kw">new</span> GiaoDich(4, "chuyen",
      1200000),</div><div>            <span class="kw">new</span> GiaoDich(5, "nap",
      1500000), <span class="kw">new</span> GiaoDich(6, "rut", 700000)));</div><div>    ds.sort(<span
      class="kw">new</span> TheoLoaiRoiTien());</div><div>    <span class="kw">for</span>
      (GiaoDich g : ds) {</div><div>        System.out.println(g.ma() + " " + g.loai()
      + " " + g.soTien());</div><div>    }</div></div>'
    clear: true
    say: Chương trình tạo sáu giao dịch, gọi hàm sắp xếp của danh sách với bộ so sánh
      của ta, rồi in từng dòng. Ta sẽ tự xếp bằng tay trước, rồi so với kết quả.
  - show: '$$① \; \text{chuyen} \;<\; \text{nap} \;<\; \text{rut} \quad (\text{c}
      < \text{n} < \text{r}) \Rightarrow \text{ba nhóm}$$$$② \; \text{chuyen}: 1\,200\,000
      \quad (\text{chỉ có 1 dòng, mã 4})$$'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Phép làm thứ nhất, xếp theo loại. Chữ c đứng trước n, n đứng trước r, nên
      có ba nhóm theo thứ tự chuyển, nạp, rút. Phép thứ hai, nhóm chuyển chỉ có một
      dòng, là giao dịch bốn, một triệu hai trăm nghìn.
    introduces:
    - implies
  - show: '$$③ \; \text{nap}: 2\,000\,000 > 1\,500\,000 \Rightarrow \text{mã 2 rồi
      mã 5}$$$$④ \; \text{rut}: 700\,000 > 500\,000 > 300\,000 \Rightarrow \text{mã
      6, mã 1, mã 3}$$'
    focus:
    - 1
    - 2
    say: Phép thứ ba, nhóm nạp có hai dòng, hai triệu lớn hơn một triệu rưỡi, nên
      mã hai đứng trước mã năm. Phép thứ tư, nhóm rút có ba dòng, bảy trăm nghìn lớn
      hơn năm trăm nghìn lớn hơn ba trăm nghìn, nên thứ tự là mã sáu, mã một, mã ba.
  - show: $$⑤ \; \text{thứ tự mã} = \hl{4,\; 2,\; 5,\; 6,\; 1,\; 3}$$<p><b>Kết quả
      chạy</b></p><div class="code"><div>4 chuyen 1200000</div><div>2 nap 2000000</div><div>5
      nap 1500000</div><div>6 rut 700000</div><div>1 rut 500000</div><div>3 rut 300000</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Phép thứ năm, nối các nhóm lại, thứ tự mã là bốn, hai, năm, sáu, một, ba.
      Chạy thật, sáu dòng in ra đúng thứ tự đó.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: sắp xếp bằng công cụ dòng lệnh'
  checks:
  - 6 - 1 == 5
  steps:
  - show: '<p>Cùng dữ liệu, xếp bằng lệnh <code>sort</code> của hệ điều hành: khoá
      1 là cột 2 (chữ), khoá 2 là cột 3 (số, giảm dần):</p>

      <p><code>sort -t, -k2,2 -k3,3nr</code> cho thứ tự mã: <b>4, 2, 5, 6, 1, 3</b>
      ✓ trùng với chương trình Java.</p>

      <p>Kiểm thêm tính chất: sau khi xếp, mỗi cặp liền nhau <code>(x, y)</code> thoả
      <code>compare(x, y) ≤ 0</code>; có 6 phần tử nên có <b>5</b> cặp liền nhau.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    say: Cách kiểm khác là dùng lệnh sắp xếp của hệ điều hành trên cùng dữ liệu, khoá
      một là cột chữ, khoá hai là cột số giảm dần. Nó cho thứ tự mã bốn, hai, năm,
      sáu, một, ba, trùng với chương trình Java. Ta cũng kiểm tính chất, sau khi xếp
      thì mỗi cặp liền nhau phải thoả so sánh nhỏ hơn hoặc bằng không. Sáu phần tử
      có đúng năm cặp liền nhau.
- id: scale
  kind: concept
  title: 'Khi danh sách lớn gấp một nghìn: số lần so sánh tăng thế nào?'
  checks:
  - round(1000 * __import__('math').log2(1000)) == 9966
  - round(100000 * __import__('math').log2(100000)) == 1660964
  - round(1000000 * __import__('math').log2(1000000)) == 19931569
  - 18640873 / 8683 > 2000
  - 1000 - 1 == 999
  steps:
  - show: <table class='t'><tr><th>số phần tử n</th><th>1 000</th><th>100 000</th><th>1
      000 000</th></tr><tr><td>so sánh khi dữ liệu xáo trộn (đo thật)</td><td>8 683</td><td>1
      534 624</td><td><b>18 640 873</b></td></tr><tr><td>xấp xỉ n × log₂ n</td><td>9
      966</td><td>1 660 964</td><td>19 931 569</td></tr><tr><td>xếp lại danh sách
      đã xếp sẵn (đo thật)</td><td>999</td><td>99 999</td><td><b>999 999</b></td></tr></table>
    say: Bây giờ là chuyện quy mô. Ta đếm số lần gọi hàm so sánh khi xếp danh sách
      số ngẫu nhiên. Với một nghìn phần tử là gần chín nghìn lần. Với một triệu phần
      tử, lớn gấp một nghìn lần, là mười tám triệu sáu trăm nghìn lần. Tăng một nghìn
      lần số phần tử mà số lần so sánh tăng hơn hai nghìn lần, vì nó theo n nhân lôgarit
      của n. Con số đo được sát với công thức.
  - show: '<div class="code"><div><span class="kw">for</span> (<span class="kw">int</span>
      n : cac) {</div><div>    Random r = <span class="kw">new</span> Random(42);</div><div>    List&lt;Integer&gt;
      ds = <span class="kw">new</span> ArrayList&lt;&gt;();</div><div>    <span class="kw">for</span>
      (<span class="kw">int</span> i = 0; i &lt; n; i++) {</div><div>        ds.add(r.nextInt(1000000));</div><div>    }</div><div>    Dem
      a = <span class="kw">new</span> Dem();</div><div>    ds.sort(a);</div><div>    Dem
      b = <span class="kw">new</span> Dem();</div><div>    ds.sort(b);                              <span
      class="cm">// lần hai: danh sách đã xếp sẵn</span></div><div>    <span class="kw">long</span>
      nlogn = Math.round(n * (Math.log(n) / Math.log(2)));</div></div>'
    clear: true
    say: Mã đo là chương trình này, ta đếm bằng cách cho bộ so sánh tăng một biến
      mỗi lần được gọi. Hạt giống số ngẫu nhiên cố định, nên ai chạy cũng ra đúng
      những con số trên bảng.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>n=1000: ngau nhien 8683,
      da xep san 999, n*log2(n)=9966</div><div>n=100000: ngau nhien 1534624, da xep
      san 99999, n*log2(n)=1660964</div><div>n=1000000: ngau nhien 18640873, da xep
      san 999999, n*log2(n)=19931569</div></div><p class=''note''>Đánh đổi: bộ so
      sánh càng đắt (so nhiều khoá, so chuỗi dài) thì nhân với 18 triệu lần càng đau;
      danh sách đã gần xếp sẵn thì rẻ hơn rất nhiều.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Điều thú vị là hàng cuối. Xếp lại một danh sách đã xếp sẵn chỉ tốn gần đúng
      n lần so sánh, vì thuật toán nhận ra các đoạn đã đúng thứ tự. Người làm nghề
      dùng điều này, ví dụ giữ dữ liệu luôn đã xếp để lần sau gần như miễn phí. Còn
      bộ so sánh nhân với hàng chục triệu lần gọi, nên nó phải rẻ và phải nhất quán.
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Tin rằng danh sách các
      Long cũng là danh sách các Object.</div><div class="code"><div>List&lt;Long&gt;
      tien = <span class="kw">new</span> ArrayList&lt;&gt;();</div><div>List&lt;Object&gt;
      chung = tien;                   <span class="cm">// có vẻ hợp lý?</span></div><div>chung.add("abc");                            <span
      class="cm">// nếu được phép, danh sách tiền chứa chuỗi</span></div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div><span class="cm">error: incompatible
      types: List&lt;Long&gt; cannot be converted to List&lt;Object&gt;</span></div><div><span
      class="cm">        List&lt;Object&gt; chung = tien;…</span></div><div><span
      class="cm">                             ^</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ nhất là nghĩ rằng danh sách số nguyên dài cũng là danh sách mọi thứ.
      Nghe hợp lý, vì số nguyên dài là một thứ. Nhưng nếu được phép, ta bỏ chuỗi vào
      qua tên mới và danh sách tiền chứa chuỗi. Trình biên dịch chặn ngay, vì hộp
      chứa kiểu A và hộp chứa kiểu B là hai kiểu khác nhau dù A và B có quan hệ.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Quên rằng hộp tổng quát
      chỉ ép kiểu đúng khi biên dịch, không thay được việc kiểm dữ liệu.</div><p>Hộp
      <code>Hop&lt;Long&gt;</code> đảm bảo <b>kiểu</b>, không đảm bảo <b>giá trị hợp
      lệ</b>: số tiền âm, mã rỗng vẫn lọt qua.</p><p>Kiểu tổng quát bắt lỗi <b>loại</b>
      dữ liệu; kiểm <b>giá trị</b> vẫn là việc của bạn.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Lỗi thứ hai là tưởng kiểu tổng quát kiểm hết mọi thứ. Hộp số nguyên dài đảm
      bảo kiểu, nhưng số tiền âm hay giá trị vô lý vẫn lọt qua. Kiểu tổng quát chỉ
      bắt lỗi về loại dữ liệu, còn kiểm giá trị là việc của người viết.
  - show: <div class="box warn"><b>Lỗi 3 (người đã đi làm).</b> Viết bộ so sánh bằng
      phép trừ.</div><div class="code"><div><span class="kw">static</span> <span class="kw">class</span>
      Sai <span class="kw">implements</span> Comparator&lt;Long&gt; {</div><div>    <span
      class="kw">public</span> <span class="kw">int</span> compare(Long a, Long b)
      {</div><div>        <span class="kw">return</span> (<span class="kw">int</span>)
      (a - b);                    <span class="cm">// "a - b" tưởng gọn mà SAI</span></div><div>    }</div><div>}</div></div>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Lỗi thứ ba hay gặp ở người đã đi làm. Viết bộ so sánh bằng phép trừ rồi ép
      kiểu, nhìn rất gọn. Với số nhỏ thì chạy đúng nên qua được kiểm thử.
  - show: <div class="code"><div>System.out.println((<span class="kw">int</span>)
      (3000000000L - 1L));</div><div>List&lt;Long&gt; ds = <span class="kw">new</span>
      ArrayList&lt;&gt;(List.of(3000000000L, 1L, 2L));</div><div>ds.sort(<span class="kw">new</span>
      Sai());</div><div>System.out.println(ds);</div></div><p><b>Kết quả chạy</b></p><div
      class="code"><div>-1294967297</div><div>[3000000000, 1, 2]</div></div>
    focus:
    - 1
    - 2
    clear: true
    say: Nhưng khi gặp số lớn, phép trừ tràn và dấu sai, danh sách ba tỉ, một, hai
      không được xếp đúng. Hãy luôn dùng hàm so sánh có sẵn của kiểu số.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 'sorted([(''rut'',400000),(''nap'',900000),(''rut'',900000)], key=lambda g: (-g[1],
    g[0])) == [(''nap'',900000),(''rut'',900000),(''rut'',400000)]'
  - 'sorted([(''rut'',400000),(''nap'',900000),(''rut'',900000)], key=lambda g: (g[1],
    g[0])) == [(''rut'',400000),(''nap'',900000),(''rut'',900000)]'
  steps:
  - show: '<p><b>Đề.</b> Danh sách ba giao dịch (<code>loai</code>, <code>soTien</code>):
      <code>(rut, 400000)</code>, <code>(nap, 900000)</code>, <code>(rut, 900000)</code>.

      Bộ so sánh: khoá 1 <code>soTien</code> <b>giảm dần</b>; khoá 2 <code>loai</code>
      <b>tăng dần</b>.</p>

      <ol><li>Viết thứ tự sau khi xếp.</li><li>Nếu đổi <code>Long.compare(b, a)</code>
      thành <code>Long.compare(a, b)</code> ở khoá 1 thì thứ tự là gì?</li></ol>

      <p><b>Chọn A hay B?</b> Cần xếp giao dịch theo ngày ở một chỗ và theo tiền ở
      chỗ khác. A: lớp <code>GiaoDich implements Comparable</code>. B: hai bộ so sánh
      riêng. Vì sao?</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 25
    say: Bây giờ tới phần bạn tự làm. Có ba giao dịch, rút bốn trăm nghìn, nạp chín
      trăm nghìn, rút chín trăm nghìn. Khoá một là tiền giảm dần, khoá hai là loại
      tăng dần. Hãy viết thứ tự sau khi xếp, rồi thứ tự nếu đảo chiều khoá một. Rồi
      chọn giữa một thứ tự tự nhiên và hai bộ so sánh riêng, và giải thích vì sao.
      Hãy dừng video và tự làm.
  - show: '<table class=''t''><tr><th>câu</th><th>đáp án</th><th>vì sao</th></tr><tr><td>1</td><td>(nap,
      900000), (rut, 900000), (rut, 400000)</td><td>tiền giảm: 900000, 900000, 400000;
      hai dòng cùng 900000 thì loại: <code>nap</code> &lt; <code>rut</code></td></tr><tr><td>2</td><td>(rut,
      400000), (nap, 900000), (rut, 900000)</td><td>tiền tăng dần; 900000 vẫn xếp
      <code>nap</code> trước <code>rut</code></td></tr><tr><td>3</td><td><b>B</b></td><td><code>Comparable</code>
      chỉ cho một thứ tự; hai ngữ cảnh cần hai thứ tự</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Đáp án câu một, tiền giảm dần nên hai dòng chín trăm nghìn lên trước. Hai
      dòng ấy bằng nhau về tiền, nên xét khoá hai, nạp đứng trước rút theo thứ tự
      từ điển. Dòng bốn trăm nghìn xuống cuối. Câu hai, đảo chiều thì tiền tăng dần,
      bốn trăm nghìn lên đầu, hai dòng chín trăm nghìn vẫn xếp nạp trước rút. Câu
      ba chọn phương án B, vì thứ tự tự nhiên chỉ có một cách, mà ta cần hai cách.
    clear: true
  - show: '<div class="box key"><b>Quy tắc chọn:</b> một thứ tự <b>hiển nhiên, duy
      nhất</b> (số, chuỗi, mã) &rarr; <code>Comparable</code>.

      Nhiều thứ tự tuỳ ngữ cảnh, hay lớp không thuộc quyền bạn sửa &rarr; <code>Comparator</code>.</div>

      '
    say: Quy tắc chọn. Khi có một thứ tự hiển nhiên và duy nhất, như số hay mã, thì
      dùng thứ tự tự nhiên. Khi có nhiều thứ tự tuỳ ngữ cảnh, hoặc lớp không thuộc
      quyền bạn sửa, thì dùng bộ so sánh.
- id: practice
  kind: practice
  title: 'Tự làm: sắp xếp giao dịch theo hai khoá'
  steps:
  - show: '<p><b>Đề</b>: sắp xếp bảy giao dịch theo <b>loại tăng dần</b>, rồi <b>tiền
      giảm dần</b>.</p>

      <ol><li><code>record GiaoDich(int ma, String loai, long soTien)</code>; bảy
      giao dịch theo đề trong <code>de.md</code>.</li>

      <li>Lớp <code>TheoLoaiRoiTien implements Comparator&lt;GiaoDich&gt;</code>;
      so tiền bằng <code>Long.compare</code>.</li>

      <li><code>ds.sort(…)</code> rồi in <code>ma loai soTien</code> mỗi dòng.</li></ol>

      <p class="note">Hai giao dịch 1 và 7 trùng cả loại lẫn tiền: sắp xếp <b>ổn định</b>
      giữ nguyên thứ tự cũ. Tệp <code>SapXepGiaoDich.java</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 150
    say: Bây giờ tới phần bạn tự làm trên máy. Có bảy giao dịch cho trong đề bài.
      Hãy viết một bộ so sánh với hai khoá, khoá một là loại tăng dần, khoá hai là
      số tiền giảm dần, và dùng hàm so sánh số nguyên dài chứ không dùng phép trừ.
      Sắp xếp danh sách rồi in từng giao dịch. Chú ý hai giao dịch trùng cả loại lẫn
      tiền sẽ giữ nguyên thứ tự ban đầu, vì sắp xếp này ổn định. Hãy dừng video và
      tự viết, đừng chép lại ví dụ.
  - show: '<p><b>Kết quả mong đợi</b></p><div class="code"><div>1 chuyen 900000</div><div>7
      chuyen 900000</div><div>3 chuyen 150000</div><div>5 nap 4000000</div><div>2
      nap 250000</div><div>6 rut 900000</div><div>4 rut 600000</div></div><p class="note">Chấm
      bằng Git Bash: <code>bash labs/cham.sh JV2 L02 SapXepGiaoDich.java</code> —
      in <b>ĐÚNG</b> khi trùng.</p>'
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Đây là kết quả mong đợi. Bạn chạy chương trình của mình rồi so từng dòng.
      Nếu muốn chấm bằng máy, dùng lệnh ở dưới màn hình; lệnh in chữ ĐÚNG khi đầu
      ra trùng, hoặc chỉ ra dòng nào khác.
  - show: '<div class="box key"><b>Nếu kẹt:</b> trong <code>compare(a, b)</code>:
      so <code>a.loai().compareTo(b.loai())</code>; nếu khác 0 thì trả luôn; nếu bằng
      thì trả <code>Long.compare(b.soTien(), a.soTien())</code> (đảo a và b để giảm
      dần).

      Lời giải: <code>labs/JV2/L02/loi_giai.java</code> — chỉ mở sau khi đã thử.</div>

      '
    say: Nếu kẹt, trong hàm so sánh, trước hết so hai loại với nhau. Nếu khác nhau
      thì trả kết quả ngay. Nếu bằng nhau thì so số tiền, nhưng đảo thứ tự hai số
      để được giảm dần. Lời giải đầy đủ nằm trong thư mục thực hành của bài, chỉ mở
      sau khi bạn đã tự thử.
  lab: labs/JV2/L02
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>hộp Object nổ lúc chạy</span><span
      class=''a''>→</span><span class=''n''>Hop<T> bắt lỗi lúc biên dịch</span><span
      class=''a''>→</span><span class=''n''>compareTo: âm, 0, dương</span><span class=''a''>→</span><span
      class=''n''>bộ so sánh: khoá 1 rồi khoá 2</span><span class=''a''>→</span><span
      class=''n''>không dùng phép trừ</span><span class=''a''>→</span><span class=''n''>n
      × log n so sánh</span></div>'
    say: Tổng kết chuỗi logic. Hộp nhận mọi thứ thì lỗi nổ lúc chạy. Hộp có tham số
      kiểu bắt lỗi lúc biên dịch. So sánh trả âm, không hoặc dương. Bộ so sánh xét
      khoá một rồi mới tới khoá hai. Không dùng phép trừ để so sánh, vì có thể tràn.
      Và sắp xếp tốn cỡ n nhân lôgarit của n lần so sánh.
  - show: '<div class=''box key''><b>Tư duy:</b> chuyển lỗi về <b>sớm nhất có thể</b>:
      lúc gõ hơn lúc biên dịch, lúc biên dịch hơn lúc kiểm thử, lúc kiểm thử hơn lúc
      chạy thật.

      Với mọi bộ so sánh, hỏi: <b>có nhất quán</b> không (a trước b thì b không trước
      a), <b>có tràn</b> không, và nó sẽ bị gọi <b>bao nhiêu triệu lần</b>.</div>

      '
    say: Điều cần mang theo. Hãy đưa lỗi về càng sớm càng tốt, lúc biên dịch hơn lúc
      chạy thật. Với mọi bộ so sánh, hỏi ba câu. Nó có nhất quán không, có bị tràn
      không, và sẽ bị gọi bao nhiêu triệu lần.
