scenes:
- id: hook
  kind: hook
  title: Hộp nhận mọi thứ, và lỗi chỉ lộ ra lúc đã chạy
  steps:
  - show: '<div class="code"><div>    Hop h = <span class="kw">new</span> Hop("500000");                   <span
      class="cm">// lỡ bỏ vào một CHUỖI</span></div><div>    <span class="kw">long</span>
      tien = (Long) h.lay();                  <span class="cm">// cố ép thành số nguyên
      dài</span></div><div>    System.out.println(tien);</div><div>}</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div><span class="cm">Exception in thread
      "main" java.lang.ClassCastException: class java.lang.String cannot be cast to
      class …</span></div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Hãy tưởng tượng một chiếc hộp cho phép bỏ vào bất cứ thứ gì. Ta lỡ bỏ chuỗi
      chữ năm trăm nghìn vào, rồi lấy ra và ép thành số nguyên dài. Trình biên dịch
      im lặng, chương trình chạy, và nó nổ ở đúng dòng đó, có thể là ở máy chủ đang
      phục vụ khách. Lỗi sai kiểu mà chỉ lộ ra khi chạy là loại lỗi đắt nhất.
  - show: '<div class="box key">Hôm nay: <b>kiểu tổng quát</b>, cho phép một hộp ghi
      rõ <b>nó chứa kiểu gì</b> để trình biên dịch bắt lỗi sớm.

      Rồi hai cách <b>sắp xếp</b> một danh sách: thứ tự tự nhiên của lớp, và bộ so
      sánh do người gọi chọn; kèm câu hỏi quy mô: sắp xếp một triệu phần tử tốn bao
      nhiêu lần so sánh.</div>

      '
    clear: true
    say: Hôm nay ta học kiểu tổng quát, cách để một chiếc hộp ghi rõ nó chứa kiểu
      gì, nhờ đó trình biên dịch bắt lỗi sớm. Rồi hai cách sắp xếp một danh sách,
      và câu hỏi quy mô là sắp xếp một triệu phần tử tốn bao nhiêu lần so sánh.
- id: prereq
  kind: prereq
  title: 'Ôn lại: danh sách, bản ghi, hàm tĩnh'
  steps:
  - show: '<table class=''t''><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      danh sách có kiểu</td><td><code>List&lt;Long&gt;</code>: trong ngoặc nhọn là
      kiểu phần tử; <code>add</code> thêm, <code>get</code> lấy</td></tr><tr><td>②
      bản ghi</td><td><code>record GiaoDich(int ma, String loai, long soTien) {}</code>
      tự có <code>ma()</code>, <code>loai()</code>, <code>soTien()</code></td></tr><tr><td>③
      giao diện</td><td>lớp <code>implements</code> một giao diện thì phải viết đủ
      các hàm giao diện đòi</td></tr><tr><td>④ so sánh số</td><td><code>3000000000L</code>
      là <code>long</code>; <code>(int)</code> ép kiểu có thể cắt mất phần lớn</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 1
    say: Ta ôn lại bốn điều. Danh sách có kiểu, trong ngoặc nhọn là kiểu của phần
      tử. Bản ghi tự có các hàm đọc theo tên trường. Lớp cài một giao diện thì phải
      viết đủ các hàm mà giao diện đòi. Và ép kiểu từ số nguyên dài sang số nguyên
      thường có thể cắt mất phần lớn giá trị. Bài này dùng cả bốn.
- id: sym
  kind: symbol
  title: Giải mã sáu ký hiệu của kiểu tổng quát và so sánh
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>Hop&lt;T&gt;</code></td><td>lớp
      <b>có tham số kiểu</b> <code>T</code>: một chỗ trống cho kiểu, điền khi dùng</td></tr><tr><td><code>Hop&lt;Long&gt;</code></td><td>điền
      <code>T = Long</code>: hộp chỉ nhận và trả <code>Long</code></td></tr><tr><td><code>new
      Hop&lt;&gt;(x)</code></td><td>dấu <code>&lt;&gt;</code> trống: để trình biên
      dịch tự suy ra kiểu từ <code>x</code></td></tr><tr><td><code>&lt;T extends Comparable&lt;T&gt;&gt;</code></td><td><code>T</code>
      phải <b>so sánh được</b> với chính nó</td></tr><tr><td><code>a.compareTo(b)</code></td><td>trả
      số <b>âm</b> nếu a đứng trước, <b>0</b> nếu bằng, <b>dương</b> nếu a đứng sau</td></tr><tr><td><code>Comparator&lt;X&gt;</code></td><td><b>bộ
      so sánh</b>: một đối tượng có hàm <code>compare(a, b)</code> với cùng quy ước
      âm, 0, dương</td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    say: Bảng này có sáu ký hiệu. Chữ T trong ngoặc nhọn là chỗ trống cho một kiểu,
      điền khi dùng. Điền kiểu số nguyên dài thì hộp chỉ nhận và trả số nguyên dài.
      Cặp ngoặc nhọn trống để trình biên dịch tự suy ra kiểu. Ràng buộc nói rằng kiểu
      phải so sánh được với chính nó. Hàm so sánh trả số âm khi a đứng trước, không
      khi bằng nhau, dương khi a đứng sau. Còn bộ so sánh là một đối tượng có hàm
      so sánh hai phần tử theo cùng quy ước đó.
- id: intuition
  kind: intuition
  title: 'Hình dung: hộp dán nhãn kiểu và hai cách xếp hàng'
  steps:
  - show: '<div><svg width="1500" height="330" viewBox="0 0 1500 330" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
