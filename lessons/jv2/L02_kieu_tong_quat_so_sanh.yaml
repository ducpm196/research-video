      x="20" y="10" width="700" height="310" rx="12" fill="#fee2e2" stroke="#dc2626"
      stroke-width="3"/><text x="370.0" y="48" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">Hộp không nhãn: Object</text><rect x="60"
      y="90" width="260" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text
      x="190.0" y="134" font-size="26" text-anchor="middle" fill="#1f2937">"500000"</text><line
