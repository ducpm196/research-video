      đề + 7 dòng như trong <code>de.md</code>).</li>

      <li>Đọc lại bằng <code>try (BufferedReader …)</code>, bỏ dòng tiêu đề, cộng
      và đếm theo loại.</li>

      <li>In theo thứ tự <code>nap</code>, <code>rut</code>, <code>chuyen</code>,
      rồi <code>Tong tat ca: …</code></li></ol>

      <p class="note">Tiền dùng <code>long</code>. Tệp tên <code>TongTheoLoai.java</code>;
      dữ liệu 7 dòng ở <code>labs/JV2/L01/de.md</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    pause: 150
    say: Bây giờ tới phần bạn tự làm trên máy. Chương trình tự ghi ra một tệp bảng
      bảy dòng, lấy dữ liệu từ đề bài, rồi đọc lại bằng khối thử có tài nguyên. Bỏ
      dòng tiêu đề, cộng tiền và đếm số giao dịch theo từng loại. In ba loại theo
      đúng thứ tự nạp, rút, chuyển, rồi in tổng tất cả. Tiền dùng kiểu số nguyên dài.
