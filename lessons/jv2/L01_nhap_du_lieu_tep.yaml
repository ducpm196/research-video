scenes:
- id: hook
  kind: hook
  title: 'Số cứng trong mã không đủ: dữ liệu thật nằm ở ngoài'
  steps:
  - show: <div><svg width="1500" height="330" viewBox="0 0 1500 330" font-family="sans-serif"><defs><marker
      id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10"
      refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#475569"/></marker></defs><rect
      x="20" y="10" width="450" height="300" rx="12" fill="#fee2e2" stroke="#dc2626"
      stroke-width="3"/><text x="245.0" y="48" font-size="26" text-anchor="middle"
      fill="#1f2937" font-weight="bold">Số viết sẵn trong mã</text><text x="245" y="130"
      font-size="24" text-anchor="middle" fill="#1f2937" font-weight="bold">long soTien
      = 500000;</text><text x="245" y="180" font-size="24" text-anchor="middle" fill="#1f2937">đổi
      số = sửa mã</text><text x="245" y="220" font-size="24" text-anchor="middle"
      fill="#1f2937">= biên dịch lại</text><rect x="520" y="10" width="960" height="300"
      rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1000.0" y="48"
      font-size="26" text-anchor="middle" fill="#1f2937" font-weight="bold">Dữ liệu
      từ bên ngoài</text><rect x="555" y="80" width="270" height="80" rx="10" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="3"/><text x="690.0" y="112" font-size="24" text-anchor="middle"
      fill="#1f2937">tham số</text><text x="690.0" y="144" font-size="24" text-anchor="middle"
      fill="#1f2937">dòng lệnh</text><rect x="850" y="80" width="270" height="80"
      rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="985.0" y="112"
      font-size="24" text-anchor="middle" fill="#1f2937">bàn phím</text><text x="985.0"
      y="144" font-size="24" text-anchor="middle" fill="#1f2937">hoặc ống</text><rect
      x="1145" y="80" width="300" height="80" rx="10" fill="#dbeafe" stroke="#2a78d6"
      stroke-width="3"/><text x="1295.0" y="112" font-size="24" text-anchor="middle"
      fill="#1f2937">tệp trên đĩa</text><text x="1295.0" y="144" font-size="24" text-anchor="middle"
      fill="#1f2937">một triệu dòng</text><text x="1000" y="230" font-size="26" text-anchor="middle"
      fill="#16a34a" font-weight="bold">ba cửa vào, một chương trình không phải sửa</text></svg></div>
    clear: true
    say: Ở bài trước, số tiền nằm cứng trong mã, muốn đổi phải sửa và biên dịch lại.
      Chương trình thật nhận dữ liệu từ bên ngoài, qua ba cửa. Tham số khi gõ lệnh,
      bàn phím hoặc đầu ra của lệnh khác, và tệp trên đĩa. Một ngân hàng nhận cả triệu
      giao dịch mỗi ngày thì chỉ có thể đi qua cửa thứ ba.
  - show: '<div class="box key">Hôm nay: <b>nhập dữ liệu</b>. Đọc <b>tham số</b> và
      <b>bàn phím</b>, ghi và đọc <b>tệp văn bản</b> chuẩn mã hoá tiếng Việt,

      tự động <b>đóng tài nguyên</b>, và câu hỏi của người làm nghề: đọc một tệp lớn
      gấp một nghìn lần thì còn chạy được không?</div>

      '
    say: 'Hôm nay ta học nhập dữ liệu. Đọc tham số và bàn phím, ghi và đọc tệp văn
      bản, tự động đóng tài nguyên sau khi dùng. Rồi câu hỏi của người làm nghề: đọc
      một tệp lớn gấp một nghìn lần thì chương trình còn chạy nổi không.'
- id: prereq
  kind: prereq
  title: 'Ôn lại: chuỗi, bản đồ, ngoại lệ và nhiều tệp'
  steps:
  - show: <table class='t'><tr><th>điều đã biết</th><th>nhắc lại</th></tr><tr><td>①
      cắt chuỗi</td><td><code>"1,rut,500".split(",")</code> cho mảng ba chuỗi; <code>f[2]</code>
      là phần tử thứ ba (đếm từ 0)</td></tr><tr><td>② bản đồ đếm</td><td><code>m.put(k,
      m.getOrDefault(k, 0) + 1)</code> cộng dồn theo khoá</td></tr><tr><td>③ ngoại
      lệ</td><td>lỗi lúc chạy dừng chương trình và in dòng đầu <code>Exception in
      thread "main" …</code>; ngoại lệ có kiểm tra phải khai <code>throws</code></td></tr><tr><td>④
      biên dịch, chạy</td><td><code>javac Tên.java</code> rồi <code>java Tên</code>;
      tiền tính bằng <code>long</code> theo đồng</td></tr></table>
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Ta ôn lại bốn điều. Cắt chuỗi bằng dấu phẩy cho ra một mảng, đếm vị trí từ
      không. Bản đồ cộng dồn theo khoá bằng hàm lấy giá trị mặc định. Lỗi lúc chạy
      làm chương trình dừng và in dòng báo lỗi, còn ngoại lệ có kiểm tra phải khai
      báo ở đầu hàm. Cuối cùng là biên dịch rồi chạy, và tiền tính bằng số nguyên
      dài theo đồng.
- id: sym
  kind: symbol
  title: Giải mã tám thứ của việc nhập dữ liệu
  steps:
  - show: '<table class=''t''><tr><th>viết</th><th>nghĩa</th></tr><tr><td><code>String[]
      args</code></td><td>mảng chứa các <b>tham số gõ sau tên lớp</b> khi chạy: <code>java
      ThamSo rut 250000</code></td></tr><tr><td><code>Long.parseLong(s)</code></td><td>đổi
      chuỗi chữ số thành <code>long</code>; sai định dạng thì ném <code>NumberFormatException</code></td></tr><tr><td><code>System.in</code></td><td><b>đầu
      vào chuẩn</b>: bàn phím, hoặc kết quả lệnh đứng trước dấu <code>|</code></td></tr><tr><td><code>new
      Scanner(System.in)</code></td><td>bộ đọc: <code>nextInt()</code>, <code>nextLong()</code>
      đọc từng số, <code>nextLine()</code> đọc cả dòng</td></tr><tr><td><code>Path.of("gd.csv")</code></td><td><b>đường
      dẫn</b>; tên không có thư mục là đường dẫn tương đối, tính từ nơi chạy lệnh</td></tr><tr><td><code>Files.writeString(p,
      s)</code></td><td>ghi cả chuỗi ra tệp; <code>Files.newBufferedReader(p)</code>
      mở tệp để đọc từng dòng</td></tr><tr><td><code>try (… ) { … }</code></td><td><b>khối
      có tài nguyên</b>: thoát khối, kể cả khi lỗi, máy tự gọi <code>close()</code></td></tr><tr><td>CSV</td><td>tệp
      văn bản, mỗi dòng một bản ghi, các ô <b>ngăn bằng dấu phẩy</b></td></tr></table>'
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.8'
    - '1.9'
    say: Bảng này có tám thứ. Mảng tham số chứa các chữ gõ sau tên lớp khi chạy. Hàm
      đổi chuỗi thành số nguyên dài, sai định dạng thì ném ngoại lệ. Đầu vào chuẩn
      là bàn phím, hoặc kết quả của lệnh đứng trước dấu gạch đứng. Bộ đọc lấy từng
      số hoặc cả dòng. Đường dẫn không có thư mục là đường dẫn tương đối, tính từ
      nơi chạy lệnh. Có hàm ghi cả chuỗi ra tệp và hàm mở tệp để đọc từng dòng. Khối
      có tài nguyên tự đóng tài nguyên khi thoát. Và tệp bảng ngăn bằng dấu phẩy,
      mỗi dòng là một bản ghi.
  - show: '<div class="code"><div>String loai = args[0];                       <span
      class="cm">// tham số thứ nhất</span></div><div><span class="kw">long</span>
      soTien = Long.parseLong(args[1]);       <span class="cm">// đổi chữ thành số</span></div><div>System.out.println("Loai:
      " + loai + ", so tien: " + soTien);</div><div>System.out.println("Gap doi: "
      + soTien * 2);</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>Loai:
      rut, so tien: 250000</div><div>Gap doi: 500000</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Đây là cửa thứ nhất. Tham số thứ nhất là loại giao dịch, đếm từ không. Tham
      số thứ hai là chữ số, đổi sang số nguyên dài rồi nhân đôi. Chạy với hai tham
      số, rút và hai trăm năm mươi nghìn, ta thấy ngay kết quả.
