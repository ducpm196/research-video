- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class=''chain''><span class=''n''>ba cửa vào: tham số, đầu vào chuẩn,
      tệp</span><span class=''a''>→</span><span class=''n''>đổi chữ thành số: parseLong</span><span
      class=''a''>→</span><span class=''n''>mở – dùng – đóng</span><span class=''a''>→</span><span
      class=''n''>cắt dòng, cộng dồn theo loại</span><span class=''a''>→</span><span
      class=''n''>bộ nhớ ≈ số dòng × 64 byte</span><span class=''a''>→</span><span
      class=''n''>tệp lớn thì đọc từng dòng</span></div>'
    say: Tổng kết chuỗi logic. Dữ liệu vào qua ba cửa là tham số, đầu vào chuẩn và
      tệp. Chữ phải được đổi thành số trước khi tính. Tài nguyên luôn đi theo bộ ba
      mở, dùng, đóng. Cắt dòng rồi cộng dồn theo loại. Giữ mọi dòng thì bộ nhớ tăng
      theo số dòng. Vì thế tệp lớn thì đọc từng dòng.
  - show: '<div class=''box key''><b>Tư duy:</b> trước khi đọc dữ liệu từ bên ngoài,
      hỏi bốn câu: dữ liệu <b>lớn đến đâu</b> và có cần giữ hết trong bộ nhớ không,

      ô nào có thể <b>rỗng hay sai định dạng</b>, ai <b>đóng</b> tài nguyên, và đường
      dẫn tính từ <b>thư mục nào</b>.</div>

      '
    say: Điều cần mang theo. Trước khi đọc dữ liệu từ bên ngoài, hãy hỏi bốn câu.
      Dữ liệu lớn đến đâu, và có cần giữ hết trong bộ nhớ không. Ô nào có thể rỗng
      hay sai định dạng. Ai chịu trách nhiệm đóng tài nguyên. Và đường dẫn được tính
      từ thư mục nào.
