      class="kw">void</span> close() { System.out.println("dong " + ten); }</div><div>}</div></div>
    clear: true
    say: Ta xem thật. Lớp cửa chỉ in ra khi mở, dùng và đóng. Muốn dùng được trong
      khối có tài nguyên, lớp phải cam kết có hàm đóng, nên nó khai là đóng được tự
      động.
  - show: '<div class="code"><div><span class="kw">public</span> <span class="kw">static</span>
      <span class="kw">void</span> main(String[] args) {</div><div>    <span class="kw">try</span>
      (Cua a = <span class="kw">new</span> Cua("A"); Cua b = <span class="kw">new</span>
      Cua("B")) {</div><div>        a.dung();</div><div>        b.dung();</div><div>        <span
      class="kw">throw</span> <span class="kw">new</span> IllegalStateException("loi
      giua chung");</div><div>    } <span class="kw">catch</span> (IllegalStateException
      e) {</div><div>        System.out.println("bat: " + e.getMessage());</div><div>    }</div><div>}</div></div>'
    clear: true
    say: Khối có tài nguyên mở hai cửa, a rồi b, dùng cả hai, rồi cố tình ném lỗi
      giữa chừng. Ta sẽ xem thứ tự đóng.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>mo A</div><div>mo B</div><div>dung
      A</div><div>dung B</div><div>dong B</div><div>dong A</div><div>bat: loi giua
      chung</div></div><p class=''note''>Đóng theo thứ tự <b>ngược lại</b> với lúc
      mở, và xong hết trước khi khối bắt lỗi chạy.</p>'
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Kết quả thật. Hai cửa mở theo thứ tự a rồi b. Khi lỗi xảy ra, cả hai đều
      được đóng, b trước rồi a, giống tháo đồ ngược chiều lúc xếp. Chỉ sau đó khối
      bắt lỗi mới in ra thông báo.
- id: formula
  kind: formula
  title: 'Suy ra từng bước: đọc một tệp bảng thành tổng theo loại'
  checks:
  - 0 + 500000 == 500000
  - 0 + 2000000 == 2000000
  steps:
  - show: <div class="code"><div><span class="kw">try</span> (BufferedReader br =
      Files.newBufferedReader(p)) {</div><div>    br.readLine();                               <span
      class="cm">// bỏ dòng tiêu đề</span></div><div>    String dong;</div><div>    <span
      class="kw">while</span> ((dong = br.readLine()) != <span class="kw">null</span>)
      {</div></div><p><b>Bước 1.</b> Mở tệp, <b>bỏ dòng tiêu đề</b> bằng một lần đọc,
      rồi đọc tới hết.</p>
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước một, mở tệp và bỏ dòng tiêu đề, vì dòng đầu là chữ, không phải số liệu.
      Ta lặp lại việc đọc, mỗi lần lấy một dòng tiếp theo. Mỗi lần đọc trả về một
      chuỗi, và khi hết tệp thì trả về giá trị rỗng, nên điều kiện lặp là khác rỗng.
  - show: '<div class="code"><div>String[] f = dong.split(",");            <span class="cm">//
      f[0]=ma, f[1]=loai, f[2]=so_tien</span></div><div><span class="kw">long</span>
      tien = Long.parseLong(f[2]);</div></div><p><b>Bước 2.</b> Cắt dòng bằng dấu
      phẩy: <code>"2,nap,2000000"</code> thành <code>f[0]="2"</code>, <code>f[1]="nap"</code>,
      <code>f[2]="2000000"</code>.</p>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước hai, cắt dòng. Vì các ô ngăn bằng dấu phẩy, nên cắt tại dấu phẩy cho
      ra một mảng ba chuỗi. Ô thứ hai là loại, ô thứ ba là số tiền, nhưng vẫn còn
      là chữ. Ta đổi chữ thành số nguyên dài để cộng được.
  - show: '<div class="code"><div>tong.put(f[1], tong.getOrDefault(f[1], 0L) + tien);</div><div>dem.put(f[1],
      dem.getOrDefault(f[1], 0) + 1);</div></div><p><b>Bước 3.</b> Cộng dồn theo loại:
      tổng mới = tổng cũ của loại đó (mặc định 0) + số tiền.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Bước ba, cộng dồn theo loại. Tổng mới của một loại bằng tổng cũ của loại
      đó cộng số tiền, và nếu loại này chưa gặp thì tổng cũ là không. Ta làm tương
      tự với bản đồ đếm, tăng số giao dịch của loại lên một.
  - show: '<p><b>Bước 4.</b> Thử bằng số với hai dòng đầu: <code>1,rut,500000</code>
      và <code>2,nap,2000000</code>:</p>

      $$\text{rut} = 0 + 500\,000 = 500\,000 ,\quad \text{nap} = 0 + 2\,000\,000 =
      2\,000\,000$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Bước bốn, thử bằng số. Dòng một là rút năm trăm nghìn, loại rút chưa có nên
      tổng cũ bằng không, tổng mới là năm trăm nghìn. Dòng hai là nạp hai triệu, loại
      nạp cũng mới, tổng mới là hai triệu. Mỗi loại có một tổng riêng, không lẫn vào
      nhau.
- id: example
  kind: example
  title: 'Ví dụ: sáu giao dịch, ba loại, từng phép cộng'
  checks:
  - 500000 + 300000 + 700000 == 1500000
  - 2000000 + 1500000 == 3500000
  - 3 + 2 + 1 == 6
  - 1500000 + 3500000 + 1200000 == 6200000
  - 500000 + 2000000 + 300000 + 1200000 + 1500000 + 700000 == 6200000
  - 10000 + 20000 + 30000 == 60000
  steps:
  - show: '<div class="code"><div>Path p = Path.of("gd.csv");</div><div>Files.writeString(p,
      "ma,loai,so_tien\n1,rut,500000\n2,nap,2000000\n3,rut,300000\n"</div><div>        +
      "4,chuyen,1200000\n5,nap,1500000\n6,rut,700000\n");</div></div><p class=''note''>Dữ
      liệu ghi ra <code>gd.csv</code>: tiêu đề và sáu dòng; chương trình đầy đủ ở
      các khung sau.</p>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta làm trọn vẹn một ví dụ. Chương trình tự ghi ra sáu giao dịch gồm rút,
      nạp, rút, chuyển, nạp, rút, rồi đọc lại và cộng theo loại. Ta sẽ tự cộng bằng
      tay rồi so với chương trình.
  - show: '$$① \; \text{rut}: 500\,000 + 300\,000 + 700\,000 = \hl{1\,500\,000} \;(3
      \text{ dòng})$$$$② \; \text{nap}: 2\,000\,000 + 1\,500\,000 = \hl{3\,500\,000}
      \;(2 \text{ dòng})$$'
    focus:
    - 1
    - 2
    clear: true
    say: Phép cộng thứ nhất, loại rút có ba dòng, năm trăm nghìn cộng ba trăm nghìn
      cộng bảy trăm nghìn, bằng một triệu năm trăm nghìn. Phép cộng thứ hai, loại
      nạp có hai dòng, hai triệu cộng một triệu rưỡi, bằng ba triệu năm trăm nghìn.
  - show: '$$③ \; \text{chuyen}: \hl{1\,200\,000} \;(1 \text{ dòng})$$$$④ \; \text{tổng
      số dòng} = 3 + 2 + 1 = \hl{6}$$$$⑤ \; \text{tổng tiền} = 1\,500\,000 + 3\,500\,000
      + 1\,200\,000 = \hl{6\,200\,000}$$'
    focus:
    - 1
    - 2
    - 3
    say: Phép thứ ba, loại chuyển chỉ có một dòng, một triệu hai trăm nghìn. Phép
      thứ tư, tổng số dòng là ba cộng hai cộng một bằng sáu, đúng bằng số giao dịch.
      Phép thứ năm, cộng ba tổng lại được sáu triệu hai trăm nghìn, và cũng bằng cộng
      cả sáu số tiền gốc.
  - show: '<p><b>Kết quả chạy</b></p><div class="code"><div>nap: 2 giao dich, tong
      3500000</div><div>rut: 3 giao dich, tong 1500000</div><div>chuyen: 1 giao dich,
      tong 1200000</div></div>'
    focus:
    - 1
    - 2
    clear: true
    say: Chạy thật, ba dòng in ra khớp với các phép cộng tay. Loại nạp hai giao dịch
      ba triệu năm trăm nghìn, loại rút ba giao dịch một triệu năm trăm nghìn, loại
      chuyển một giao dịch một triệu hai trăm nghìn.
  - show: '<div class="code"><div>Scanner in = <span class="kw">new</span> Scanner(System.in);</div><div><span
      class="kw">int</span> n = in.nextInt();                  <span class="cm">//
      đọc một số nguyên: số giao dịch</span></div><div><span class="kw">long</span>
      tong = 0;</div><div><span class="kw">for</span> (<span class="kw">int</span>
      i = 0; i &lt; n; i++) {</div><div>    tong += in.nextLong();             <span
      class="cm">// đọc từng số tiền</span></div><div>}</div><div>System.out.println("Tong
      " + n + " giao dich: " + tong);</div></div><div class="code"><div><span class="cm"><span>&#36;</span>
      </span>printf ''3\n10000 20000 30000\n'' | java BanPhim</div><div>Tong 3 giao
      dich: 60000</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Cuối cùng là cửa bàn phím. Chương trình đọc số giao dịch, rồi đọc đúng chừng
      ấy số tiền. Ta không gõ tay mà dùng lệnh in rồi nối bằng dấu gạch đứng, ba số
      cộng lại được sáu mươi nghìn.
- id: check
  kind: check
  title: 'Tự kiểm bằng đường khác: đếm bằng lệnh của hệ điều hành'
  checks:
  - 500000 + 2000000 + 300000 + 1200000 + 1500000 + 700000 == 6200000
  steps:
  - show: <p><b>Đếm số dòng mỗi loại bằng công cụ khác</b></p><div class="code"><div><span
      class="cm"><span>&#36;</span> </span>grep -c ",rut," gd.csv</div><div>3</div><div><span
      class="cm"><span>&#36;</span> </span>grep -c ",nap," gd.csv</div><div>2</div></div><p
      class='note'><code>grep -c</code> đếm số dòng có chứa mẫu; chương trình Java
      ghi ra tệp, công cụ khác đọc lại.</p>
    focus:
    - 1
    - 1
    - 2
    - 3
    clear: true
    say: Cách kiểm khác là dùng một công cụ hoàn toàn khác. Chương trình vừa ghi ra
      tệp, ta cho lệnh đếm dòng đọc lại tệp đó. Có ba dòng chứa chữ rút và hai dòng
      chứa chữ nạp. Trùng khít với số giao dịch mà chương trình Java đếm, nên đường
      đọc tệp của ta không bỏ sót dòng nào.
  - show: '<p>Kiểm tổng bằng cách khác: cộng sáu số tiền gốc, không nhóm theo loại:</p>

      $$500\,000 + 2\,000\,000 + 300\,000 + 1\,200\,000 + 1\,500\,000 + 700\,000 =
      \hl{6\,200\,000}$$

      '
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Kiểm tổng theo cách khác. Cộng thẳng sáu số tiền gốc mà không nhóm theo loại,
      ta được sáu triệu hai trăm nghìn. Đúng bằng tổng của ba nhóm, vậy việc nhóm
      theo loại không làm mất hay nhân đôi dòng nào.
- id: scale
  kind: concept
  title: Khi tệp lớn gấp một nghìn, rồi một nghìn lần nữa
  checks:
  - 1000 * 64 == 64000
  - 1000000 * 64 == 64000000
  - 1000000000 * 64 == 64000000000
  - sum((i % 7 + 1) * 1000 for i in range(1, 1000001)) == 3999998000
  - 3999998000 > 2**31 - 1
  - sum((i % 7 + 1) * 1000 for i in range(1, 1001)) == 4003000
  steps:
  - show: <table class='t'><tr><th>số dòng</th><th>1 000</th><th>1 000 000</th><th>1
      000 000 000</th></tr><tr><td>bộ nhớ nếu giữ mọi dòng (ước lượng ≈ 64 byte một
      dòng)</td><td>64 nghìn byte</td><td>64 triệu byte</td><td><b>64 tỉ byte</b></td></tr><tr><td>bộ
      nhớ nếu chỉ giữ một dòng</td><td>vài trăm byte</td><td>vài trăm byte</td><td>vài
      trăm byte</td></tr></table><p class='note'>Con số 64 byte là ước lượng cho dòng
      ~15 ký tự (đối tượng chuỗi, mảng ký tự, ô tham chiếu); đo thật ở khung sau.</p>
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Bây giờ là chuyện quy mô. Nếu đọc cả tệp rồi giữ mọi dòng trong bộ nhớ, thì
      bộ nhớ tăng theo số dòng. Mỗi dòng ngắn chiếm chừng sáu mươi bốn byte, con số
      này là ước lượng. Một nghìn dòng là sáu mươi bốn nghìn byte, chẳng đáng kể.
      Một triệu dòng là sáu mươi bốn triệu byte. Một tỉ dòng là sáu mươi bốn tỉ byte,
      không máy nào chứa nổi. Còn nếu chỉ giữ một dòng mỗi lúc thì bộ nhớ gần như
      không đổi.
  - show: '<p><b>Một nghìn dòng: đọc hết vẫn ổn, dù chỉ cho 32 megabyte</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>java TaoFile 1000</div><div>da
      ghi 1000 dong</div><div><span class="cm"><span>&#36;</span> </span>java -Xmx32m
      DocHet</div><div>doc xong 1001 dong</div></div>'
    focus:
    - 1
    - 1
    - 2
    clear: true
    say: Ta đo thật. Tạo tệp một nghìn dòng, rồi chạy chương trình đọc hết với bộ
      nhớ tối đa ba mươi hai megabyte. Chạy trơn tru, đọc xong một nghìn không trăm
      linh một dòng, kể cả dòng tiêu đề.
  - show: '<p><b>Một triệu dòng: đọc hết thì hết bộ nhớ, đọc từng dòng thì xong</b></p><div
      class="code"><div><span class="cm"><span>&#36;</span> </span>java TaoFile 1000000</div><div>da
      ghi 1000000 dong</div><div><span class="cm"><span>&#36;</span> </span>java -Xmx32m
      DocHet</div><div>het bo nho</div><div><span class="cm"><span>&#36;</span> </span>java
      -Xmx32m TongDong</div><div>Tong: 3999998000</div></div>'
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: 'Giờ ta tạo một tệp có tới một triệu dòng để thử sức. Đọc hết vào bộ nhớ
      với cùng giới hạn ba mươi hai megabyte thì chương trình báo hết bộ nhớ. Đọc
      từng dòng, mỗi lúc chỉ giữ một dòng, thì xong và cho tổng gần bốn tỉ, lớn hơn
      cả phạm vi của số nguyên thường, nên bắt buộc dùng số nguyên dài. Đánh đổi:
      đọc từng dòng không cho phép nhảy tới dòng bất kỳ hay đọc lại, nhưng trả bằng
      bộ nhớ không đổi.'
- id: pitfalls
  kind: pitfall
  title: Lỗi hay gặp, có lỗi của người đã đi làm
  steps:
  - show: '<div class="box warn"><b>Lỗi 1 (người mới).</b> Đọc số bằng bộ đọc rồi
      đọc cả dòng: dòng trống bí ẩn.</div><div class="code"><div>Scanner in = <span
      class="kw">new</span> Scanner(System.in);</div><div><span class="kw">int</span>
      n = in.nextInt();</div><div>String ten = in.nextLine();</div><div>System.out.println("n="
      + n + " ten=[" + ten + "]");</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>n=5
      ten=[]</div></div><p class=''note''>Đầu vào: <code>5</code>, xuống dòng, <code>an</code>.</p>'
    focus:
    - 1
    - 2
    - 3
    - 4
    - 5
    clear: true
    say: Lỗi thứ nhất của người mới. Đọc số nguyên rồi ngay sau đó đọc cả dòng. Hàm
      đọc số chỉ lấy chữ số năm, dấu xuống dòng ngay sau vẫn còn nằm lại. Lệnh đọc
      dòng tiếp theo nhặt đúng cái đuôi đó và trả về chuỗi rỗng, còn chữ an chưa được
      đọc. Chạy thật cho ra tên rỗng.
  - show: <div class="box key"><b>Cách sửa:</b> luôn đọc cả dòng rồi mới đổi sang
      số.</div><div class="code"><div>Scanner in = <span class="kw">new</span> Scanner(System.in);</div><div><span
      class="kw">int</span> n = Integer.parseInt(in.nextLine().trim());     <span
      class="cm">// đọc cả dòng rồi mới đổi</span></div><div>String ten = in.nextLine();</div><div>System.out.println("n="
      + n + " ten=[" + ten + "]");</div></div><p><b>Kết quả chạy</b></p><div class="code"><div>n=5
      ten=[an]</div></div>
    focus:
    - 1
    - 2
    - 3
    clear: true
    say: Cách sửa là luôn đọc cả dòng rồi mới đổi sang số. Dấu xuống dòng được tiêu
      thụ cùng với dòng chứa số. Lần đọc sau ra đúng chữ an.
  - show: '<div class="box warn"><b>Lỗi 2 (người mới).</b> Đường dẫn tương đối: tệp
      "không tồn tại" dù nó nằm trên đĩa.</div><div class="code"><div><span class="kw">public</span>
      <span class="kw">static</span> <span class="kw">void</span> main(String[] args)
      <span class="kw">throws</span> IOException {</div><div>    Path p = Path.of("khong_co.csv");        <span
      class="cm">// đường dẫn tương đối: tính từ thư mục đang chạy</span></div><div>    System.out.println(Files.readAllLines(p).size());</div><div>}</div></div><p><b>Kết
      quả chạy</b></p><div class="code"><div><span class="cm">Exception in thread
      "main" java.nio.file.NoSuchFileException: khong_co.csv</span></div></div>'
    focus:
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ hai là đường dẫn tương đối. Tên tệp không có thư mục được tính từ
      thư mục đang đứng khi chạy lệnh, chứ không phải từ nơi đặt mã nguồn. Đứng nhầm
      thư mục thì báo không có tệp, dù tệp nằm đâu đó trên đĩa. Trước khi nghi ngờ
      mã, hãy hỏi mình đang đứng ở thư mục nào.
  - show: "<div class=\"box warn\"><b>Lỗi 3 (người đã đi làm).</b> Tệp xuất từ Excel\
      \ và ô cuối rỗng.</div><div class=\"code\"><div>    String dong = \"7,rut,\"\
      ;                                   <span class=\"cm\">// thiếu số tiền ở cuối</span></div><div>\
      \    System.out.println(dong.split(\",\").length);               <span class=\"\
      cm\">// mặc định bỏ ô rỗng cuối</span></div><div>    System.out.println(dong.split(\"\
      ,\", -1).length);           <span class=\"cm\">// -1: giữ mọi ô</span></div><div>\
      \    String tieuDe = \"\uFEFFma\";                               <span class=\"\
      cm\">// dấu BOM của Excel</span></div><div>    System.out.println(tieuDe.equals(\"\
      ma\") + \" \" + tieuDe.length());</div><div>}</div></div><p><b>Kết quả chạy</b></p><div\
      \ class=\"code\"><div>2</div><div>3</div><div>false 3</div></div>"
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    clear: true
    say: Lỗi thứ ba hay gặp ở người đã đi làm. Cắt chuỗi mặc định bỏ ô rỗng ở cuối,
      nên dòng thiếu số tiền cho ra hai ô thay vì ba, và truy cập ô thứ ba sẽ nổ vào
      lúc chạy ở máy chủ. Truyền thêm số âm một để giữ mọi ô. Tệp lưu từ bảng tính
      còn có thể mở đầu bằng một ký tự vô hình gọi là BOM. Nó làm tên cột đầu dài
      ba thay vì hai ký tự, nên so sánh với chữ ma cho ra sai.
- id: quiz
  kind: quiz
  title: Bây giờ tới phần bạn tự làm
  checks:
  - 2 * 10**9 // 20 == 10**8
  - 10**8 * 64 == 6400000000
  - 10**8 * 64 > 4 * 10**9
  steps:
  - show: '<p><b>Đề.</b> Tệp <code>sao_ke.csv</code> có 2 GB, mỗi dòng <code>ngay,tien</code>.
      Cần tính <b>tổng</b> cột <code>tien</code>. Máy có 4 GB bộ nhớ cho chương trình.</p>

      <ol><li><b>Chọn A hay B?</b> A: <code>Files.readAllLines</code> rồi cộng. B:
      <code>BufferedReader</code>, đọc từng dòng và cộng dồn. Vì sao?</li>

      <li>Biến cộng dồn nên có kiểu gì?</li>

      <li>Nếu tên cột đầu là <code>ngay</code> mà <code>equals("ngay")</code> ra <code>false</code>,
      nghi ngờ điều gì?</li></ol>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    pause: 25
    say: Bây giờ tới phần bạn tự làm. Một tệp sao kê hai gigabyte, mỗi dòng có ngày
      và tiền, cần tính tổng cột tiền, máy có bốn gigabyte bộ nhớ. Hãy chọn giữa đọc
      hết vào bộ nhớ và đọc từng dòng, và giải thích vì sao. Biến cộng dồn nên có
      kiểu gì. Và nếu so sánh tên cột đầu ra sai thì nghi ngờ điều gì. Hãy dừng video
      và tự làm.
  - show: '<table class=''t''><tr><th>câu</th><th>đáp án</th><th>vì sao</th></tr><tr><td>1</td><td><b>B</b>:
      đọc từng dòng</td><td>A giữ ≈ 64 byte × số dòng ≫ 2 GB nên nhiều khả năng hết
      bộ nhớ; B chỉ giữ một dòng</td></tr><tr><td>2</td><td><code>long</code></td><td>tổng
      có thể vượt 2 147 483 647</td></tr><tr><td>3</td><td>dấu BOM hoặc khoảng trắng
      đầu ô</td><td>ký tự vô hình làm chuỗi dài hơn; thử <code>length()</code></td></tr></table>'
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án, chọn phương án B, đọc từng dòng, vì phương án A giữ nhiều bộ nhớ
      hơn cả kích thước tệp. Biến cộng dồn dùng kiểu số nguyên dài, vì tổng có thể
      vượt phạm vi của số nguyên thường. Còn so sánh sai tên cột thì nghi ký tự vô
      hình ở đầu, hãy in độ dài của chuỗi để thấy.
    clear: true
  - show: '<p>Tính số: giả sử mỗi bản ghi dài 20 byte, tệp 2 GB có $2\,000\,000\,000
      / 20 = 10^8$ dòng. Giữ hết:</p>

      $$10^8 \times 64 = \hl{6{,}4 \times 10^9} \text{ byte} \approx 6{,}4 \text{
      GB} > 4 \text{ GB}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    clear: true
    say: Ta tính cho chắc. Giả sử mỗi dòng hai mươi byte, tệp hai gigabyte có một
      trăm triệu dòng. Giữ hết thì cần một trăm triệu nhân sáu mươi bốn, bằng sáu
      phẩy bốn gigabyte, lớn hơn bốn gigabyte mà máy có. Vậy phương án A chắc chắn
      hết bộ nhớ, còn phương án B thì không.
