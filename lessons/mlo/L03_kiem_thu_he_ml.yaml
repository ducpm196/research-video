scenes:
- id: hook
  kind: hook
  title: Cùng một lời khen, khác tên, khác nhãn
  checks:
  - alg.toy_sentiment('An nói dịch vụ này rất tốt', True) == 'tích cực' and alg.toy_sentiment('Hùng nói dịch vụ này rất tốt', True) == 'tiêu cực'
  steps:
  - show: '<p>“An nói dịch vụ này rất tốt” → <b class="green">tích cực</b>. “Hùng nói dịch vụ này rất tốt” → <b class="red">tiêu cực</b>. Mô hình đạt điểm cao trên tập kiểm tra, nhưng đã học nhầm một tên riêng từ dữ liệu thiên lệch.</p>

      <div class="box key">Hôm nay: <b>kiểm thử cho hệ học máy</b> — kiểm dữ liệu, kiểm mô hình, và kiểm <b>hành vi</b> chứ không chỉ điểm tổng.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    say: Chào bạn, câu An nói dịch vụ này rất tốt được mô hình gắn nhãn tích cực. Câu Hùng nói dịch vụ này rất tốt lại bị gắn nhãn tiêu cực. Mô hình đạt điểm cao trên tập kiểm tra, nhưng đã học nhầm một tên riêng từ dữ liệu thiên lệch. Hôm nay ta học kiểm thử cho hệ học máy, kiểm dữ liệu, kiểm mô hình, và kiểm hành vi chứ không chỉ điểm tổng.
- id: prereq
  kind: prereq
  title: 'Ôn lại: kiểm thử, tập hợp, trung vị'
  checks:
  - 2 + 3 == 5 and len({'tích cực', 'tích cực', 'tích cực'}) == 1 and len({'tích cực', 'tiêu cực', 'tích cực'}) == 2
  - __import__('statistics').median([20, 25, 31, 40, 70]) == 31 and 3 / 300 == 0.01
  steps:
  - show: '<p><b>Kiểm thử</b>: một đoạn mã chạy tự động, gọi phần mã cần kiểm với một đầu vào rồi so kết quả với điều kỳ vọng → <b class="green">đạt</b> hoặc <b class="red">trượt</b>. Ví dụ: hàm cộng nhận 2 và 3 phải trả 5; trả số khác là trượt.</p>

      <table class="t"><tr><th>tập hợp các nhãn</th><th>số phần tử</th></tr>

      <tr><td>{tích cực, tích cực, tích cực}</td><td>1 (phần tử trùng chỉ tính một lần)</td></tr>

      <tr><td>{tích cực, tiêu cực, tích cực}</td><td>2</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    say: Trước hết ta cần hiểu hai điều. Một kiểm thử là một đoạn mã chạy tự động, gọi phần mã cần kiểm với một đầu vào rồi so kết quả với điều kỳ vọng, và kết quả là đạt hoặc trượt. Ví dụ hàm cộng nhận 2 và 3 phải trả về 5, trả về số khác là trượt. Điều thứ hai là tập hợp, nơi phần tử trùng chỉ tính một lần. Tập gồm ba nhãn tích cực chỉ có 1 phần tử. Tập gồm tích cực, tiêu cực, tích cực có 2 phần tử.
  - show: '<table class="t"><tr><th>đại lượng</th><th>ví dụ</th></tr>

      <tr><td>trung vị (số đứng giữa khi xếp tăng dần)</td><td>tuổi 20, 25, <b>31</b>, 40, 70 → trung vị 31</td></tr>

      <tr><td>tỉ lệ thiếu</td><td>3 ô trống trong 300 dòng → $\frac{3}{300} = 1\%$</td></tr></table>

      '
    introduces:
    - frac
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Kiểm dữ liệu dùng hai đại lượng. Trung vị là số đứng giữa khi xếp tăng dần, với năm tuổi 20, 25, 31, 40, 70 thì trung vị là 31. Tỉ lệ thiếu là số ô trống chia số dòng, 3 ô trống trong 300 dòng là 1 phần trăm.
  - clear: true
    show: '<table class="t"><tr><th>ký hiệu Python</th><th>đọc và hiểu là</th></tr>

      <tr><td><code>def kiem(mo_hinh):</code></td><td>Đặt tên một hàm kiểm thử nhận vào biến <code>mo_hinh</code></td></tr>

      <tr><td><code>mau.format(t)</code></td><td>Thay tên <code>t</code> vào vị trí cặp ngoặc nhọn <code>{}</code> trong chuỗi mẫu</td></tr>

      <tr><td><code>{f(t) for t in [...]}</code></td><td>Tạo tập hợp nhãn không trùng nhau bằng cách thử từng tên trong danh sách</td></tr>

      <tr><td><code>assert len(nhan) == 1, f"..."</code></td><td>Khẳng định chỉ có 1 nhãn duy nhất; nếu sai sẽ dừng và in câu báo lỗi</td></tr></table>

      '
    say: Bảng giải mã trước bốn dòng lệnh sẽ dùng ở ví dụ kế tiếp. Dòng đầu đặt tên hàm kiểm, dòng sau thay tên vào chuỗi, gom tập hợp và khẳng định kết quả.
- id: sym
  kind: symbol
  title: 'Giải mã: ba lớp kiểm thử'
  steps:
  - show: '<table class="t"><tr><th>lớp</th><th>ví dụ kiểm</th></tr>

      <tr><td><b>dữ liệu</b></td><td>lược đồ (đủ cột, đúng kiểu), giá trị hợp lệ (tuổi từ 0 đến 120), tỉ lệ thiếu, phân bố không lệch quá xa tuần trước</td></tr>

      <tr><td><b>mô hình</b></td><td>điểm trên tập kiểm tra cố định không thấp hơn bản đang chạy; điểm <b>theo từng nhóm</b> không tụt</td></tr>

      <tr><td><b>hành vi</b></td><td><b>bất biến</b>: đổi tên riêng không đổi nhãn; <b>có hướng</b>: thêm “rất tệ” không được làm câu tích cực hơn</td></tr></table>

      <p class="note"><b>Tích hợp liên tục (CI):</b> quy trình tự động chạy toàn bộ kiểm thử dữ liệu và mô hình mỗi khi gộp mã mới gọi là <b>CI</b> (Continuous Integration).</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    say: Bảng giới thiệu ba lớp kiểm thử. Kiểm dữ liệu gồm lược đồ đủ cột đúng kiểu, giá trị hợp lệ như tuổi từ 0 đến 120, tỉ lệ thiếu, và phân bố không lệch quá xa tuần trước. Kiểm mô hình gồm điểm trên tập kiểm tra cố định không thấp hơn bản đang chạy, và điểm theo từng nhóm không tụt. Kiểm hành vi gồm kiểm bất biến, như đổi tên riêng không đổi nhãn, và kiểm có hướng, như thêm chữ rất tệ không được làm câu tích cực hơn. Quy trình chạy kiểm thử tự động mỗi lần gộp mã mới thường được viết tắt là C I.
