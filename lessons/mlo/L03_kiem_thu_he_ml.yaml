    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác, ta chạy lại kiểm thử với câu mẫu khác. Với câu khen thứ hai, tên thích món này, vẫn chỉ có Hùng làm đổi nhãn, nên lỗi nằm ở tên, không ở câu. Mô hình đúng vẫn đạt với câu này. Nhưng với câu chê, điểm là âm 1, và câu có tên Hùng là âm 1 trừ 2, bằng âm 3, cùng tiêu cực, nên kiểm thử đạt và không bắt được lỗi. Vậy một kiểm thử bất biến cần nhiều câu mẫu, cả khen lẫn chê. Bộ kiểm thử hành vi mô hình cần đa dạng cả chiều tích cực lẫn tiêu cực để tránh lọt lỗi định kiến ẩn.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp
  checks:
  - '[round(100 * (1 - math.comb(48, k) / math.comb(50, k)), 1) for k in (3, 20, 50)] == [11.8, 64.5, 100.0]'
  - round(48 / 50 * 47 / 49 * 46 / 48, 3) == 0.882 and round(100 * (1 - 48 / 50 * 47 / 49 * 46 / 48), 1) == 11.8
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Chỉ kiểm điểm tổng <b class="red">(bỏ sót nhóm nhỏ)</b>

      <br><span class="note">Ví dụ (số minh hoạ): điểm chung tăng 0,5% nhưng điểm trên khách vùng núi tụt 10% — điểm tổng giấu mất. Kiểm theo từng nhóm quan trọng.</span></div>

      '
    say: Lỗi thứ nhất, chỉ kiểm điểm tổng. Với số minh hoạ, điểm chung tăng 0 phẩy 5 phần trăm nhưng điểm trên khách vùng núi tụt 10 phần trăm. Điểm tổng giấu mất điều đó, nên hãy kiểm theo từng nhóm quan trọng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Không kiểm dữ liệu đầu vào <b class="red">(rác vào, rác ra)</b>

      <br><span class="note">Nguồn dữ liệu đổi đơn vị từ mét sang xăng-ti-mét: mô hình vẫn chạy, chỉ là dự đoán sai hết. Kiểm khoảng giá trị và phân bố trước khi huấn luyện và trước khi dự đoán.</span></div>

      '
    say: Lỗi thứ hai, không kiểm dữ liệu đầu vào. Nguồn dữ liệu đổi đơn vị từ mét sang xăng-ti-mét, mô hình vẫn chạy, chỉ là dự đoán sai hết. Hãy kiểm khoảng giá trị và phân bố trước khi huấn luyện và trước khi dự đoán.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Đòi mô hình đúng từng dự đoán như kiểm thử phần mềm <b class="red">(quá cứng)</b>

      <br><span class="note">Mô hình mới có thể đổi vài dự đoán mà vẫn tốt hơn. Kiểm <b>tính chất</b> (bất biến, có hướng, ngưỡng điểm) thay vì so từng đầu ra.</span></div>

      '
    say: Lỗi thứ ba, đòi mô hình đúng từng dự đoán như kiểm thử phần mềm. Mô hình mới có thể đổi vài dự đoán mà vẫn tốt hơn, nên hãy kiểm tính chất như bất biến, có hướng, ngưỡng điểm, thay vì so từng đầu ra.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Bộ kiểm thử bất biến <b>quá ít tên</b>, đạt rồi tưởng an toàn <b class="red">(phủ mỏng)</b></div>

      <table class="t"><tr><th>mô hình học nhầm 2 trong 50 tên; rút ngẫu nhiên</th><th>khả năng bắt được</th></tr>

      <tr><td>3 tên</td><td class="red">11,8%</td></tr>

      <tr><td>20 tên</td><td>64,5%</td></tr>

      <tr><td>cả 50 tên</td><td>100%</td></tr></table>

      <p class="note">Rút 3 tên mà bỏ sót nghĩa là cả 3 đều “lành”: $\frac{48}{50} \cdot \frac{47}{49} \cdot \frac{46}{48} \approx 0{,}882$, nên chỉ bắt được $1 - 0{,}882 \approx 11{,}8\%$. Người làm nghề sinh câu kiểm từ <b>danh sách đủ lớn</b> (tên, vùng, giới) và ghi rõ độ phủ.</p>

      '
    introduces:
    - cdot
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - 3
    - 3
    - 3
    say: Lỗi thứ tư hay gặp ở người đã đi làm, bộ kiểm thử bất biến có quá ít tên, đạt rồi tưởng là an toàn. Giả sử mô hình học nhầm 2 trong 50 tên, và ta rút tên ngẫu nhiên để kiểm. Rút 3 tên thì chỉ bắt được với khả năng 11 phẩy 8 phần trăm. Rút 20 tên thì được 64 phẩy 5 phần trăm. Kiểm cả 50 tên thì chắc chắn bắt được. Rút 3 tên mà bỏ sót nghĩa là cả 3 đều là tên lành, với khả năng 48 phần 50, nhân 47 phần 49, nhân 46 phần 48. Tích đó khoảng 0 phẩy 882, nên khả năng bắt được chỉ khoảng 11 phẩy 8 phần trăm. Người làm nghề sinh câu kiểm từ một danh sách đủ lớn về tên, vùng, giới, và ghi rõ độ phủ.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.toy_sentiment('Lan nói dịch vụ này rất tốt nhưng hơi chậm') == 'trung tính' and alg.toy_sentiment('Lan nói dịch vụ này rất tốt') == 'tích cực'
  - 1 - 1 == 0
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Thêm “nhưng hơi chậm” vào cuối câu khen, mô hình đồ chơi đổi từ tích cực sang trung tính. Đây là kiểm thử loại nào? Kết quả có hợp lý không?</td></tr>

      <tr><td>2</td><td>Viết một kiểm thử dữ liệu cho cột “tuổi”.</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, thêm cụm nhưng hơi chậm vào cuối câu khen, mô hình đồ chơi đổi từ tích cực sang trung tính. Đây là kiểm thử loại nào, và kết quả có hợp lý không? Câu hai, hãy viết một kiểm thử dữ liệu cho cột tuổi. Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Chấm lại: “tốt” $+1$, “chậm” $-1$ → điểm $1 - 1 = 0$ → trung tính.</p>

      <p>Kiểm thử <b>có hướng</b>: thêm ý tiêu cực thì nhãn chỉ được giữ hoặc giảm → tích cực xuống trung tính là <b>hợp lý</b>.</p>

      '
    focus:
    - 0
    - 1
    - 2
    say: Đáp án câu một, làm từng bước. Chấm lại câu mới, chữ tốt cộng 1, chữ chậm trừ 1, điểm bằng 0, nên nhãn là trung tính. Đó là kiểm thử có hướng, thêm ý tiêu cực thì nhãn chỉ được giữ hoặc giảm, nên tích cực xuống trung tính là hợp lý.
  - show: '<table class="t"><tr><th>kiểm cột tuổi</th><th>ngưỡng</th></tr>

      <tr><td>tỉ lệ thiếu</td><td>không quá 1%</td></tr>

      <tr><td>khoảng giá trị</td><td>mọi giá trị từ 0 đến 120</td></tr>

      <tr><td>phân bố</td><td>trung vị không lệch quá 5 tuổi so với tuần trước</td></tr></table>

      '
    focus:
    - 1
    - 1
    say: Câu hai, một kiểm thử dữ liệu tốt kiểm cả ba mặt, thiếu, khoảng, và phân bố. Chẳng hạn không thiếu quá 1 phần trăm, mọi giá trị từ 0 đến 120, và trung vị không lệch quá 5 tuổi so với tuần trước.
