- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">kiểm dữ liệu: lược đồ, khoảng, phân bố</span><span class="a">→</span>

      <span class="n">kiểm mô hình: theo từng nhóm</span><span class="a">→</span>

      <span class="n">kiểm hành vi: bất biến, có hướng</span><span class="a">→</span>

      <span class="n">tính chất thay cho từng đầu ra</span></div>

      '
    say: Tổng kết lại, kiểm dữ liệu với lược đồ, khoảng giá trị và phân bố. Kiểm mô hình theo từng nhóm, kiểm hành vi bất biến và có hướng, và kiểm tính chất thay cho từng đầu ra. Hệ học máy cần được kiểm thử ở ba lớp gồm lược đồ giá trị dữ liệu đầu vào, hiệu năng tách riêng theo từng phân khúc khách hàng và hành vi bất biến của dự đoán.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
  - show: '<div class="chain"><span class="n">kiểm dữ liệu: lược đồ, khoảng, phân bố</span><span class="a">→</span>

      <span class="n">kiểm mô hình: theo từng nhóm</span><span class="a">→</span>

      <span class="n">kiểm hành vi: bất biến, có hướng</span><span class="a">→</span>

      <span class="n">tính chất thay cho từng đầu ra</span></div>

      '
    say: Thử nghiệm bất biến thay đổi một thông tin không liên quan như tên gọi nhưng giữ nguyên ngữ cảnh nhằm bảo đảm điểm số dự đoán không thay đổi vô lý theo thuộc tính nhiễu. Thử nghiệm định hướng kiểm tra quy luật tăng giảm đơn giản của bài toán. Trong khi đó kiểm tra theo lát chặn mô hình điểm tổng cao nhưng bỏ rơi nhóm nhỏ. Nhờ chạy bộ kiểm thử tự động trong vài giây trước mỗi đợt đóng gói, đội kỹ thuật ngăn được nhiều lỗi suy giảm âm thầm trước khi chạm người dùng thật. Kiểm thử hệ học máy hiệu quả giống như xây lưới an toàn nhiều lớp trước khi đưa mô hình mới lên phục vụ người dùng. Khi một thay đổi nhỏ khiến hiệu năng tổng giữ nguyên nhưng nhóm người dùng mới giảm mạnh độ chính xác, kiểm tra theo lát sẽ chặn ngay ở cổng phát hành. Thử nghiệm định hướng và bất biến kiểm tra logic nền tảng mà các điểm số trung bình hay che giấu. Kiểm tra theo lát cắt và phép thử logic định hướng cần chạy tự động trong cổng phát hành trước khi đẩy bất kỳ trọng số mới nào tới người dùng thật. Nhờ lưới kiểm thử này, những lỗi lệch nhóm thiểu số không bị che khuất bởi điểm trung bình toàn cục.
    focus:
    - 0
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.7'
    - '1.7'
    clear: true
  - show: '<div class="box key"><b>Tư duy:</b> điểm số cao cho biết mô hình đúng <b>thường xuyên</b>; kiểm thử hành vi giúp kiểm xem nó có đúng <b>vì lý do đúng</b> không — đạt kiểm thử chưa chứng minh được điều đó, còn trượt thì chỉ ra một chỗ cụ thể mô hình làm trái điều ta mong.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Thử bất biến với 3 tên mất &lt; 1 ms nhưng chỉ bắt ~11,8% lỗi nếu nhầm 2/50 tên; trong kiểm thử CI tự động chạy trên 500–5 000 câu tổng hợp mất vài giây nhưng chặn được tụt chất lượng âm thầm ở các nhóm thiểu số.</p>

      '
    say: Điều cần mang theo, điểm số cao cho biết mô hình đúng thường xuyên, còn kiểm thử hành vi giúp kiểm xem nó có đúng vì lý do đúng không. Thử bất biến với 3 tên chạy rất nhanh nhưng chỉ bắt phần nhỏ lỗi. Kiểm thử tự động trong cổng phát hành chạy hàng nghìn câu giúp chặn tụt chất lượng nhóm thiểu số.
    focus:
    - 1
    - 1
    - 1
  - clear: true
    show: '<p class="note">Bài sau (bài 4): <b>theo dõi thí nghiệm</b> và chọn mô hình không quá khớp tập kiểm định.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 4, ta học theo dõi thí nghiệm, và chọn mô hình mà không quá khớp tập kiểm định. Hẹn gặp bạn ở bài tiếp theo.
