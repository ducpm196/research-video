id: L03
course: MLO
series: "MLO · MLOps: đưa mô hình học máy vào vận hành"
title: "Bài 3 — Kiểm thử cho hệ ML: dữ liệu, mô hình, hành vi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/mlo.yaml L03; audit/mlo/verify_mlo.py L03; M. T. Ribeiro, T. Wu, C. Guestrin, S. Singh, Beyond Accuracy: Behavioral Testing of NLP Models with CheckList, ACL (2020); E. Breck và cộng sự, The ML Test Score, IEEE Big Data (2017); DVO bài 3"
assumes: [arith]
# Quy ước: alg.toy_sentiment = mô hình cảm xúc đồ chơi (đếm từ tích cực trừ tiêu cực); bản lỗi (buggy=True) “học” nhầm tên “Hùng” là tiêu cực,
#   như mô hình thật học từ dữ liệu thiên lệch. alg.invariance_failures thay tên riêng vào câu mẫu và liệt kê tên làm đổi nhãn.
objectives:
  - "Viết kiểm thử lược đồ và phân bố dữ liệu"
  - "Viết kiểm thử hành vi bất biến của mô hình"
  - "Kiểm theo từng nhóm, không chỉ điểm tổng"
asr_reviewed:
  - {sentence: "Ở khoá DevOps, một kiểm thử chạy mã với một đầu vào rồi so với điều kỳ vọng, kết quả là đạt hoặc trượt, ví dụ hàm cộng nhận 2 và 3 phải trả về 5.", reason: "ASR chép “Ở khóa Devoop, một kiểm thử chạy mã với một đầu vào rồi so với điều kỳ vọng, kết quả là đạt hoặc trượt, ví dụ hàm cộng nhận 2 và 3 phải trả về 5.” (0.972): DevOps đọc thô (probe DVO p1: 6/8, NOT_VERIFIED) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng một lời khen, khác tên, khác nhãn"
    checks:
      - "alg.toy_sentiment('An nói dịch vụ này rất tốt', True) == 'tích cực' and alg.toy_sentiment('Hùng nói dịch vụ này rất tốt', True) == 'tiêu cực'"
    steps:
      - show: |
          <p>“An nói dịch vụ này rất tốt” → <b class="green">tích cực</b>. “Hùng nói dịch vụ này rất tốt” → <b class="red">tiêu cực</b>. Mô hình đạt điểm cao trên tập kiểm tra, nhưng đã học nhầm một tên riêng từ dữ liệu thiên lệch.</p>
          <div class="box key">Hôm nay: <b>kiểm thử cho hệ học máy</b> — kiểm dữ liệu, kiểm mô hình, và kiểm <b>hành vi</b> chứ không chỉ điểm tổng.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, câu An nói dịch vụ này rất tốt được mô hình gắn nhãn tích cực. Câu Hùng nói dịch vụ này rất tốt lại bị gắn nhãn tiêu cực. Mô hình đạt điểm cao trên tập kiểm tra, nhưng đã học nhầm một tên riêng từ dữ liệu thiên lệch. Hôm nay ta học kiểm thử cho hệ học máy, kiểm dữ liệu, kiểm mô hình, và kiểm hành vi chứ không chỉ điểm tổng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: kiểm thử, tập hợp, trung vị"
    checks:
      - "2 + 3 == 5 and len({'tích cực', 'tích cực', 'tích cực'}) == 1 and len({'tích cực', 'tiêu cực', 'tích cực'}) == 2"
      - "__import__('statistics').median([20, 25, 31, 40, 70]) == 31 and 3 / 300 == 0.01"
    steps:
      - show: |
          <p><b>Kiểm thử</b> (khoá DevOps): chạy mã với một đầu vào, so với điều kỳ vọng → <b class="green">đạt</b> hoặc <b class="red">trượt</b>. Ví dụ: hàm cộng nhận 2 và 3 phải trả 5.</p>
          <table class="t"><tr><th>tập hợp các nhãn</th><th>số phần tử</th></tr>
          <tr><td>{tích cực, tích cực, tích cực}</td><td>1 (phần tử trùng chỉ tính một lần)</td></tr>
          <tr><td>{tích cực, tiêu cực, tích cực}</td><td>2</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Trước hết ta ôn hai điều. Ở khoá DevOps, một kiểm thử chạy mã với một đầu vào rồi so với điều kỳ vọng, kết quả là đạt hoặc trượt, ví dụ hàm cộng nhận 2 và 3 phải trả về 5. Điều thứ hai là tập hợp, nơi phần tử trùng chỉ tính một lần. Tập gồm ba nhãn tích cực chỉ có 1 phần tử. Tập gồm tích cực, tiêu cực, tích cực có 2 phần tử."
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>ví dụ</th></tr>
          <tr><td>trung vị (số đứng giữa khi xếp tăng dần)</td><td>tuổi 20, 25, <b>31</b>, 40, 70 → trung vị 31</td></tr>
          <tr><td>tỉ lệ thiếu</td><td>3 ô trống trong 300 dòng → $\frac{3}{300} = 1\%$</td></tr></table>
        introduces: [frac]
        focus: [1, "1.2", "1.3"]
        say: "Kiểm dữ liệu dùng hai đại lượng. Trung vị là số đứng giữa khi xếp tăng dần, với năm tuổi 20, 25, 31, 40, 70 thì trung vị là 31. Tỉ lệ thiếu là số ô trống chia số dòng, 3 ô trống trong 300 dòng là 1 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: ba lớp kiểm thử"
    steps:
      - show: |
          <table class="t"><tr><th>lớp</th><th>ví dụ kiểm</th></tr>
          <tr><td><b>dữ liệu</b></td><td>lược đồ (đủ cột, đúng kiểu), giá trị hợp lệ (tuổi từ 0 đến 120), tỉ lệ thiếu, phân bố không lệch quá xa tuần trước</td></tr>
          <tr><td><b>mô hình</b></td><td>điểm trên tập kiểm tra cố định không thấp hơn bản đang chạy; điểm <b>theo từng nhóm</b> không tụt</td></tr>
          <tr><td><b>hành vi</b></td><td><b>bất biến</b>: đổi tên riêng không đổi nhãn; <b>có hướng</b>: thêm “rất tệ” không được làm câu tích cực hơn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng giới thiệu ba lớp kiểm thử. Kiểm dữ liệu gồm lược đồ đủ cột đúng kiểu, giá trị hợp lệ như tuổi từ 0 đến 120, tỉ lệ thiếu, và phân bố không lệch quá xa tuần trước. Kiểm mô hình gồm điểm trên tập kiểm tra cố định không thấp hơn bản đang chạy, và điểm theo từng nhóm không tụt. Kiểm hành vi gồm kiểm bất biến, như đổi tên riêng không đổi nhãn, và kiểm có hướng, như thêm chữ rất tệ không được làm câu tích cực hơn."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đổi một tên, xem nhãn có đứng yên không"
    checks:
      - "[alg.toy_sentiment(n + ' nói dịch vụ này rất tốt', True) for n in ('An', 'Hùng', 'Lan')] == ['tích cực', 'tiêu cực', 'tích cực'] and 1 - 2 == -1"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><g fill="#1f2937"><rect x="20" y="32" width="470" height="56" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="40" y="70" font-size="24">An nói dịch vụ này rất tốt</text><line x1="490" y1="60" x2="560" y2="60" stroke="#6b7280" stroke-width="3"/><text x="575" y="70" font-size="24">tốt +1</text><text x="800" y="70" font-size="24">điểm 1</text><line x1="920" y1="60" x2="980" y2="60" stroke="#6b7280" stroke-width="3"/><text x="995" y="70" font-size="24" fill="#059669">tích cực</text><rect x="20" y="117" width="470" height="56" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="40" y="155" font-size="24">Hùng nói dịch vụ này rất tốt</text><line x1="490" y1="145" x2="560" y2="145" stroke="#6b7280" stroke-width="3"/><text x="575" y="155" font-size="24">tốt +1, Hùng −2</text><text x="800" y="155" font-size="24">điểm −1</text><line x1="920" y1="145" x2="980" y2="145" stroke="#6b7280" stroke-width="3"/><text x="995" y="155" font-size="24" fill="#b91c1c">tiêu cực</text><rect x="20" y="202" width="470" height="56" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="40" y="240" font-size="24">Lan nói dịch vụ này rất tốt</text><line x1="490" y1="230" x2="560" y2="230" stroke="#6b7280" stroke-width="3"/><text x="575" y="240" font-size="24">tốt +1</text><text x="800" y="240" font-size="24">điểm 1</text><line x1="920" y1="230" x2="980" y2="230" stroke="#6b7280" stroke-width="3"/><text x="995" y="240" font-size="24" fill="#059669">tích cực</text><rect x="1170" y="90" width="310" height="130" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1325" y="135" text-anchor="middle" font-size="22">tập nhãn có</text><text x="1325" y="170" text-anchor="middle" font-size="22">2 phần tử</text><text x="1325" y="205" text-anchor="middle" font-size="22" fill="#b91c1c">kiểm thử trượt</text><text x="20" y="320" font-size="22">mô hình học nhầm: cùng câu khen, chỉ đổi tên, mà điểm đổi dấu</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cách kiểm thử bất biến làm việc trên mô hình học nhầm. Cùng một câu khen, chỉ thay tên, mỗi câu được chấm điểm, chữ tốt cộng 1. Riêng câu có tên Hùng bị trừ thêm 2, điểm thành âm 1, nên nhãn là tiêu cực. Tập nhãn thu được có 2 phần tử, nên kiểm thử trượt."

  - id: example
    kind: example
    title: "Kiểm thử bất biến bắt được lỗi"
    checks:
      - "alg.invariance_failures(alg.toy_sentiment, '{} nói dịch vụ này rất tốt', ['An', 'Hùng', 'Lan']) == []"
      - "alg.invariance_failures(lambda t: alg.toy_sentiment(t, True), '{} nói dịch vụ này rất tốt', ['An', 'Hùng', 'Lan']) == ['Hùng']"
      - "alg.toy_sentiment('An nói dịch vụ này rất tốt') == alg.toy_sentiment('Hùng nói dịch vụ này rất tốt') == alg.toy_sentiment('Lan nói dịch vụ này rất tốt') == 'tích cực'"
    steps:
      - show: |
          <div class="code"><div>def kiem_bat_bien(mo_hinh):</div><div>    mau = "{} nói dịch vụ này rất tốt"</div><div>    nhan = {mo_hinh(mau.format(t)) for t in ["An", "Hùng", "Lan"]}</div><div>    assert len(nhan) == 1, f"nhãn đổi theo tên: {nhan}"</div></div>
        focus: [1, 1, 1]
        say: "Bước một, viết hàm kiểm bất biến. Hàm kiểm bất biến lấy một câu mẫu, thay lần lượt ba tên An, Hùng, Lan vào, rồi thu các nhãn. Nếu có nhiều hơn một nhãn thì kiểm thử trượt và báo nhãn đổi theo tên."
      - show: |
          <table class="t"><tr><th>mô hình</th><th>điểm của ba câu</th><th>tập nhãn</th><th>tên làm đổi nhãn</th><th>kiểm thử</th></tr>
          <tr><td>đúng</td><td>1, 1, 1</td><td>{tích cực}</td><td>không có</td><td class="green">đạt</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Bảng ghi kết quả trên hai mô hình. Bước hai, mô hình đúng chấm cả ba câu được điểm 1, vì chỉ có chữ tốt, nên tập nhãn chỉ có tích cực. Mô hình đúng không có tên nào làm đổi nhãn, nên đạt."
      - show: |
          <table class="t"><tr><th>mô hình</th><th>điểm của ba câu</th><th>tập nhãn</th><th>tên làm đổi nhãn</th><th>kiểm thử</th></tr>
          <tr><td>đúng</td><td>1, 1, 1</td><td>{tích cực}</td><td>không có</td><td class="green">đạt</td></tr>
          <tr><td>học nhầm</td><td>1, $-1$, 1</td><td>{tích cực, tiêu cực}</td><td>$\hl{\text{Hùng}}$</td><td class="red">trượt</td></tr></table>
        focus: ["1.3", "1.3"]
        say: "Bước ba, mô hình học nhầm trừ thêm 2 khi gặp tên Hùng, nên câu đó được 1 trừ 2, bằng âm 1, và tập nhãn có 2 phần tử. Mô hình học nhầm đổi nhãn khi gặp tên Hùng, nên trượt."
      - show: |
          <p class="note"><b>Bước 4</b> — điểm tổng trên tập kiểm tra không thấy lỗi này, vì tập kiểm tra hiếm khi có cùng một câu với nhiều tên.</p>
        say: "Bước bốn, rút ra bài học. Điểm tổng trên tập kiểm tra không thấy lỗi này, vì tập kiểm tra hiếm khi có cùng một câu với nhiều tên."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "alg.invariance_failures(lambda t: alg.toy_sentiment(t, True), '{} thích món này', ['An', 'Hùng', 'Lan']) == ['Hùng'] and alg.invariance_failures(alg.toy_sentiment, '{} thích món này', ['An', 'Hùng', 'Lan']) == []"
      - "alg.invariance_failures(lambda t: alg.toy_sentiment(t, True), '{} nói dịch vụ này rất tệ', ['An', 'Hùng', 'Lan']) == [] and -1 - 2 == -3"
    steps:
      - clear: true
        show: |
          <table class="t"><tr><th>kiểm</th><th>câu mẫu khác</th><th>kết quả trên mô hình học nhầm</th></tr>
          <tr><td>đổi câu khen</td><td>“{tên} thích món này”</td><td>vẫn chỉ “Hùng” làm đổi nhãn ✓ — lỗi nằm ở <b>tên</b>, không ở câu</td></tr>
          <tr><td>đổi sang câu chê</td><td>“{tên} nói dịch vụ này rất tệ”</td><td>điểm $-1$ và $-1 - 2 = -3$: cùng tiêu cực → <b>đạt</b>, không bắt được</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", 1]
        say: "Kiểm bằng đường khác, ta chạy lại kiểm thử với câu mẫu khác. Với câu khen thứ hai, tên thích món này, vẫn chỉ có Hùng làm đổi nhãn, nên lỗi nằm ở tên, không ở câu. Mô hình đúng vẫn đạt với câu này. Nhưng với câu chê, điểm là âm 1, và câu có tên Hùng là âm 1 trừ 2, bằng âm 3, cùng tiêu cực, nên kiểm thử đạt và không bắt được lỗi. Vậy một kiểm thử bất biến cần nhiều câu mẫu, cả khen lẫn chê."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "[round(100 * (1 - math.comb(48, k) / math.comb(50, k)), 1) for k in (3, 20, 50)] == [11.8, 64.5, 100.0]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ kiểm điểm tổng <b class="red">(bỏ sót nhóm nhỏ)</b>
          <br><span class="note">Điểm chung tăng 0,5% nhưng điểm trên khách vùng núi tụt 10% — điểm tổng giấu mất. Kiểm theo từng nhóm quan trọng.</span></div>
        say: "Lỗi thứ nhất, chỉ kiểm điểm tổng. Điểm chung tăng 0 phẩy 5 phần trăm nhưng điểm trên khách vùng núi tụt 10 phần trăm, và điểm tổng giấu mất điều đó, nên hãy kiểm theo từng nhóm quan trọng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Không kiểm dữ liệu đầu vào <b class="red">(rác vào, rác ra)</b>
          <br><span class="note">Nguồn dữ liệu đổi đơn vị từ mét sang xăng-ti-mét: mô hình vẫn chạy, chỉ là dự đoán sai hết. Kiểm khoảng giá trị và phân bố trước khi huấn luyện và trước khi dự đoán.</span></div>
        say: "Lỗi thứ hai, không kiểm dữ liệu đầu vào. Nguồn dữ liệu đổi đơn vị từ mét sang xăng-ti-mét, mô hình vẫn chạy, chỉ là dự đoán sai hết. Hãy kiểm khoảng giá trị và phân bố trước khi huấn luyện và trước khi dự đoán."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đòi mô hình đúng từng dự đoán như kiểm thử phần mềm <b class="red">(quá cứng)</b>
          <br><span class="note">Mô hình mới có thể đổi vài dự đoán mà vẫn tốt hơn. Kiểm <b>tính chất</b> (bất biến, có hướng, ngưỡng điểm) thay vì so từng đầu ra.</span></div>
        say: "Lỗi thứ ba, đòi mô hình đúng từng dự đoán như kiểm thử phần mềm. Mô hình mới có thể đổi vài dự đoán mà vẫn tốt hơn, nên hãy kiểm tính chất như bất biến, có hướng, ngưỡng điểm, thay vì so từng đầu ra."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Bộ kiểm thử bất biến <b>quá ít tên</b>, đạt rồi tưởng an toàn <b class="red">(phủ mỏng)</b></div>
          <table class="t"><tr><th>mô hình học nhầm 2 trong 50 tên; rút ngẫu nhiên</th><th>khả năng bắt được</th></tr>
          <tr><td>3 tên</td><td class="red">11,8%</td></tr>
          <tr><td>20 tên</td><td>64,5%</td></tr>
          <tr><td>cả 50 tên</td><td>100%</td></tr></table>
          <p class="note">Khả năng bỏ sót = số cách chọn toàn tên “lành” chia số cách chọn. Người làm nghề sinh câu kiểm từ <b>danh sách đủ lớn</b> (tên, vùng, giới) và ghi rõ độ phủ.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, bộ kiểm thử bất biến có quá ít tên, đạt rồi tưởng là an toàn. Giả sử mô hình học nhầm 2 trong 50 tên, và ta rút tên ngẫu nhiên để kiểm. Rút 3 tên thì chỉ bắt được với khả năng 11 phẩy 8 phần trăm. Rút 20 tên thì được 64 phẩy 5 phần trăm. Kiểm cả 50 tên thì chắc chắn bắt được. Khả năng bỏ sót bằng số cách chọn toàn tên lành chia cho số cách chọn. Người làm nghề sinh câu kiểm từ một danh sách đủ lớn về tên, vùng, giới, và ghi rõ độ phủ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.toy_sentiment('Lan nói dịch vụ này rất tốt nhưng hơi chậm') == 'trung tính' and alg.toy_sentiment('Lan nói dịch vụ này rất tốt') == 'tích cực'"
      - "1 - 1 == 0"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Thêm “nhưng hơi chậm” vào cuối câu khen, mô hình đồ chơi đổi từ tích cực sang trung tính. Đây là kiểm thử loại nào? Kết quả có hợp lý không?</td></tr>
          <tr><td>2</td><td>Viết một kiểm thử dữ liệu cho cột “tuổi”.</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, thêm cụm nhưng hơi chậm vào cuối câu khen, mô hình đồ chơi đổi từ tích cực sang trung tính. Đây là kiểm thử loại nào, và kết quả có hợp lý không? Câu hai, hãy viết một kiểm thử dữ liệu cho cột tuổi. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Chấm lại: “tốt” $+1$, “chậm” $-1$ → điểm $1 - 1 = 0$ → trung tính.</p>
          <p>Kiểm thử <b>có hướng</b>: thêm ý tiêu cực thì nhãn chỉ được giữ hoặc giảm → tích cực xuống trung tính là <b>hợp lý</b>.</p>
        focus: [0, 1, 2]
        say: "Đáp án câu một, làm từng bước. Chấm lại câu mới, chữ tốt cộng 1, chữ chậm trừ 1, điểm bằng 0, nên nhãn là trung tính. Đó là kiểm thử có hướng, thêm ý tiêu cực thì nhãn chỉ được giữ hoặc giảm, nên tích cực xuống trung tính là hợp lý."
      - show: |
          <table class="t"><tr><th>kiểm cột tuổi</th><th>ngưỡng</th></tr>
          <tr><td>tỉ lệ thiếu</td><td>không quá 1%</td></tr>
          <tr><td>khoảng giá trị</td><td>mọi giá trị từ 0 đến 120</td></tr>
          <tr><td>phân bố</td><td>trung vị không lệch quá 5 tuổi so với tuần trước</td></tr></table>
        focus: [1, 1]
        say: "Câu hai, một kiểm thử dữ liệu tốt kiểm cả ba mặt, thiếu, khoảng, và phân bố. Chẳng hạn không thiếu quá 1 phần trăm, mọi giá trị từ 0 đến 120, và trung vị không lệch quá 5 tuổi so với tuần trước."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">kiểm dữ liệu: lược đồ, khoảng, phân bố</span><span class="a">→</span>
          <span class="n">kiểm mô hình: theo từng nhóm</span><span class="a">→</span>
          <span class="n">kiểm hành vi: bất biến, có hướng</span><span class="a">→</span>
          <span class="n">tính chất thay cho từng đầu ra</span></div>
        say: "Tổng kết lại, kiểm dữ liệu với lược đồ, khoảng giá trị và phân bố. Kiểm mô hình theo từng nhóm, kiểm hành vi bất biến và có hướng, và kiểm tính chất thay cho từng đầu ra."
      - show: |
          <div class="box key"><b>Tư duy:</b> điểm số cao cho biết mô hình đúng <b>thường xuyên</b>; kiểm thử hành vi cho biết nó đúng <b>vì lý do đúng</b>.</div>
        say: "Điều cần mang theo, điểm số cao cho biết mô hình đúng thường xuyên, còn kiểm thử hành vi cho biết nó đúng vì lý do đúng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>theo dõi thí nghiệm</b> và chọn mô hình không quá khớp tập kiểm định.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học theo dõi thí nghiệm, và chọn mô hình mà không quá khớp tập kiểm định. Hẹn gặp bạn ở bài tiếp theo."
