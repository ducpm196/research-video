    say: Gợi ý cài đặt bài số 3 áp dụng nền tảng lập trình đọc dữ liệu từ luồng chuẩn. Hãy tách đúng tham số đầu vào, tính theo công thức bài toán rồi in đủ 1 dòng khớp định dạng.
