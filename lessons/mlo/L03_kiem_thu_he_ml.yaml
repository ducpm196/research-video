      <p class="note"><b>Kiểm thử lược đồ và phân bố dữ liệu:</b> luôn khẳng định đủ cột đúng kiểu, giá trị hợp lệ (như tuổi trong khoảng cho phép) và độ lệch phân bố chưa vượt ngưỡng trước khi chấm điểm hành vi.</p>

