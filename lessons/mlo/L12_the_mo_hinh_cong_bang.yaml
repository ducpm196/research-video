id: L12
course: MLO
series: "MLO · MLOps: đưa mô hình học máy vào vận hành"
title: "Bài 12 — Thẻ mô hình, công bằng và khả năng giải thích"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/mlo.yaml L12; audit/mlo/verify_mlo.py L12; M. Mitchell và cộng sự, Model Cards for Model Reporting, FAT* (2019); M. Hardt, E. Price, N. Srebro, Equality of Opportunity in Supervised Learning, NeurIPS (2016); DSC bài 13 (ẩn danh hoá, thuộc tính thay thế)"
assumes: [arith, frac]
# Quy ước: alg.group_accuracy({nhóm: (đúng, tổng)}) trả (độ chính xác chung, theo nhóm). Tỉ lệ dương tính thật (TPR) = số ca dương được bắt / số ca
#   dương thật của nhóm. Số liệu là tập ví dụ dựng sẵn (không phải khảo sát thật).
objectives:
  - "Viết thẻ mô hình"
  - "Đo chỉ số theo từng nhóm người dùng"
  - "Biết bỏ cột nhạy cảm không làm mô hình công bằng"
asr_reviewed:
  - {sentence: "Người nói giọng đó gặp lỗi gấp bốn lần.", reason: "ASR chép “Người nói dòng đó gặp lụi gấp 4 lần.” (0.778): lệch âm/thanh thuần Việt: giọng/dòng, lỗi/lụi — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "92% chung, 75% với một nhóm"
    checks:
      - "alg.group_accuracy({'đa số': (846, 900), 'thiểu số': (75, 100)}) == (0.921, {'đa số': 0.94, 'thiểu số': 0.75})"
    steps:
      - show: |
          <p>Mô hình nhận dạng giọng nói đạt 92,1% trên tập kiểm tra 1000 câu — báo cáo rất đẹp. Tách theo vùng miền: 900 câu của nhóm đa số đúng 94%, 100 câu của nhóm thiểu số chỉ đúng $\hl{75\%}$. Người nói giọng đó gặp lỗi gấp bốn lần.</p>
          <div class="box key">Hôm nay: <b>thẻ mô hình</b>, <b>công bằng</b> và khả năng giải thích — đo theo từng nhóm, và viết rõ mô hình dùng được cho ai.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một mô hình nhận dạng giọng nói đạt 92 phẩy 1 phần trăm trên tập kiểm tra 1000 câu, báo cáo rất đẹp. Tách theo vùng miền, 900 câu của nhóm đa số đúng 94 phần trăm, còn 100 câu của nhóm thiểu số chỉ đúng 75 phần trăm. Người nói giọng đó gặp lỗi gấp bốn lần. Hôm nay ta học về thẻ mô hình, công bằng, và khả năng giải thích, đo theo từng nhóm, và viết rõ mô hình dùng được cho ai."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: phân số thành phần trăm, gộp hai nhóm"
    checks:
      - "Fraction(18, 20) == Fraction(9, 10) and 100 - 90 == 10 and Fraction(18 + 6, 20 + 10) == Fraction(4, 5) and (Fraction(9, 10) + Fraction(6, 10)) / 2 == Fraction(3, 4)"
    steps:
      - show: |
          <table class="t"><tr><th>phép tính</th><th>ví dụ</th></tr>
          <tr><td>phân số thành phần trăm</td><td>đúng 18 trên 20: $\frac{18}{20} = 0{,}9 = 90\%$</td></tr>
          <tr><td>tỉ lệ lỗi</td><td>$100\% - 90\% = 10\%$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết ta ôn cách đổi phân số. Đúng 18 trên 20 câu là 18 chia 20, bằng 0 phẩy 9, tức 90 phần trăm. Tỉ lệ lỗi là phần còn lại, 100 trừ 90, bằng 10 phần trăm."
      - show: |
          <p><b>Gộp hai nhóm</b> khác cỡ: cộng số đúng, chia cho tổng số câu — <b>không</b> lấy trung bình hai phần trăm.</p>
          <table class="t"><tr><th>nhóm</th><th>đúng / tổng</th></tr>
          <tr><td>X</td><td>18 / 20 = 90%</td></tr>
          <tr><td>Y</td><td>6 / 10 = 60%</td></tr>
          <tr><td>gộp</td><td>$\frac{18 + 6}{20 + 10} = \frac{24}{30} = 80\%$ (trung bình hai phần trăm cho 75%: sai)</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.4"]
        say: "Khi gộp hai nhóm khác cỡ, ta cộng số câu đúng rồi chia cho tổng số câu, không lấy trung bình hai phần trăm. Nhóm X đúng 18 trên 20, tức 90 phần trăm. Nhóm Y đúng 6 trên 10, tức 60 phần trăm. Gộp lại được 24 trên 30, tức 80 phần trăm. Nếu lấy trung bình 90 và 60 thì ra 75, sai, vì nhóm X đông gấp đôi."

  - id: sym
    kind: symbol
    title: "Giải mã: thẻ mô hình, chỉ số theo nhóm"
    steps:
      - show: |
          <table class="t"><tr><th>mục trong thẻ mô hình (Mitchell và cộng sự, 2019)</th><th>ví dụ</th></tr>
          <tr><td>mục đích, người dùng dự kiến</td><td>phụ đề tự động cho video tiếng Việt</td></tr>
          <tr><td>không nên dùng cho</td><td>biên bản pháp lý, chẩn đoán y khoa</td></tr>
          <tr><td>dữ liệu huấn luyện và đánh giá</td><td>nguồn, thời gian, tỉ lệ các vùng miền</td></tr>
          <tr><td>chỉ số <b>theo từng nhóm</b></td><td>độ chính xác, tỉ lệ dương tính thật của mỗi nhóm</td></tr>
          <tr><td>hạn chế đã biết</td><td>kém với giọng địa phương ít dữ liệu</td></tr></table>
          <div class="box key"><b>Khả năng giải thích</b>: với từng dự đoán, cho biết đặc trưng nào đẩy kết quả lên hay xuống bao nhiêu — để người bị ảnh hưởng hiểu, và để người xây hệ thống phát hiện mô hình dựa vào thứ không nên dựa.</div>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", 2]
        say: "Bảng liệt kê các mục của một thẻ mô hình, theo đề xuất năm 2019. Mục đích và người dùng dự kiến, chẳng hạn phụ đề tự động cho video tiếng Việt. Những việc không nên dùng, như biên bản pháp lý hay chẩn đoán y khoa. Dữ liệu huấn luyện và đánh giá, gồm nguồn, thời gian, và tỉ lệ các vùng miền. Chỉ số theo từng nhóm, như độ chính xác và tỉ lệ dương tính thật của mỗi nhóm. Và các hạn chế đã biết, như kém với giọng địa phương ít dữ liệu. Khả năng giải thích là cho biết, với từng dự đoán, đặc trưng nào đẩy kết quả lên hay xuống, để phát hiện mô hình dựa vào thứ không nên dựa."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Phần đỏ của nhóm nhỏ bị pha loãng khi gộp"
    checks:
      - "(900 - 846, 100 - 75, 1000 - 921) == (54, 25, 79)"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><g fill="#1f2937" font-size="22"><text x="20" y="90">đa số: 900 câu</text><rect x="330" y="60" width="804" height="44" fill="#2a78d6"/><rect x="1134" y="60" width="51" height="44" fill="#b91c1c"/><text x="1199" y="90">sai 54</text><text x="20" y="185">thiểu số: 100 câu</text><rect x="330" y="155" width="71" height="44" fill="#2a78d6"/><rect x="401" y="155" width="24" height="44" fill="#b91c1c"/><text x="439" y="185">sai 25</text><text x="20" y="280">gộp chung: 1000 câu</text><rect x="330" y="250" width="875" height="44" fill="#2a78d6"/><rect x="1205" y="250" width="75" height="44" fill="#b91c1c"/><text x="1294" y="280">sai 79</text><rect x="330" y="320" width="22" height="18" fill="#2a78d6"/><text x="360" y="337">đúng</text><rect x="470" y="320" width="22" height="18" fill="#b91c1c"/><text x="500" y="337">sai</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mỗi nhóm thành một thanh, phần xanh là câu đúng, phần đỏ là câu sai. Thanh của nhóm thiểu số ngắn, nhưng một phần tư của nó là màu đỏ. Khi gộp chung, 25 câu sai của nhóm nhỏ hoà vào 1000 câu, nên phần đỏ trông mỏng. Muốn thấy nhóm bị đối xử tệ, phải nhìn từng thanh, không chỉ thanh gộp."

  - id: example
    kind: example
    title: "Trung bình che nhóm nhỏ"
    checks:
      - "Fraction(846 + 75, 1000) == Fraction(921, 1000) and Fraction(846, 900) == Fraction(47, 50) and (1 - 0.75) / (1 - 0.94) > 4"
    steps:
      - show: |
          <table class="t"><tr><th>nhóm</th><th>số câu</th><th>đúng</th><th>độ chính xác</th><th>tỉ lệ lỗi</th></tr>
          <tr><td>đa số</td><td>900</td><td>846</td><td>$\frac{846}{900} = 94\%$</td><td>6%</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước một, bảng tách độ chính xác theo nhóm. Nhóm đa số có 900 câu, đúng 846, tức 94 phần trăm, tỉ lệ lỗi 6 phần trăm."
      - show: |
          <table class="t"><tr><th>nhóm</th><th>số câu</th><th>đúng</th><th>độ chính xác</th><th>tỉ lệ lỗi</th></tr>
          <tr><td>đa số</td><td>900</td><td>846</td><td>94%</td><td>6%</td></tr>
          <tr><td>thiểu số</td><td>100</td><td>75</td><td>$\hl{75\%}$</td><td>$\hl{25\%}$</td></tr></table>
        focus: ["1.3"]
        say: "Bước hai, nhóm thiểu số có 100 câu, đúng 75, tức 75 phần trăm, tỉ lệ lỗi 25 phần trăm."
      - show: |
          <table class="t"><tr><th>nhóm</th><th>số câu</th><th>đúng</th><th>độ chính xác</th><th>tỉ lệ lỗi</th></tr>
          <tr><td>đa số</td><td>900</td><td>846</td><td>94%</td><td>6%</td></tr>
          <tr><td>thiểu số</td><td>100</td><td>75</td><td>75%</td><td>25%</td></tr>
          <tr><td><b>chung</b></td><td>1000</td><td>$846 + 75 = 921$</td><td>92,1%</td><td>7,9%</td></tr></table>
        focus: ["1.4", 1]
        say: "Bước ba, gộp chung 1000 câu, đúng 921, tức 92 phẩy 1 phần trăm. Con số chung gần với nhóm đa số vì nhóm đó chiếm 90 phần trăm dữ liệu."
      - clear: true
        show: |
          <p><b>Bước 4</b> — so tỉ lệ lỗi: $\frac{25\%}{6\%} \approx 4{,}2$, hơn 4 lần.</p>
          <div class="box key">Công bằng bắt đầu bằng việc <b>đo</b>: không tách theo nhóm thì không thấy được chênh lệch.</div>
        focus: [1, 2]
        say: "Bước bốn, tỉ lệ lỗi của nhóm thiểu số là 25 chia 6, hơn 4 lần. Công bằng bắt đầu bằng việc đo, không tách theo nhóm thì không thấy được chênh lệch."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(0.9 * 94 + 0.1 * 75, 1) == 92.1 and round(0.9 * 94, 1) == 84.6 and 0.1 * 75 == 7.5"
      - "(54 + 25) / 1000 == 0.079 and 100 - 7.9 == 92.1 and round(25 / 6, 1) == 4.2"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>92,1%</td><td>trung bình có trọng số theo cỡ nhóm: $0{,}9 \cdot 94\% + 0{,}1 \cdot 75\% = 84{,}6\% + 7{,}5\%$</td><td>92,1% ✓</td></tr>
          <tr><td>7,9%</td><td>đếm thẳng câu sai: $54 + 25 = 79$ trên 1000</td><td>7,9%, và $100\% - 7{,}9\% = 92{,}1\%$ ✓</td></tr></table>
        introduces: [cdot]
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác. Cách thứ nhất, vì nhóm đa số chiếm 0 phẩy 9 số câu, nhóm thiểu số chiếm 0 phẩy 1. Lấy 0 phẩy 9 nhân 94 cộng 0 phẩy 1 nhân 75, được 84 phẩy 6 cộng 7 phẩy 5, bằng 92 phẩy 1 phần trăm. Cách thứ hai, đếm thẳng câu sai, 54 câu của nhóm đa số cộng 25 câu của nhóm thiểu số là 79 câu trên 1000, tức 7 phẩy 9 phần trăm. Lấy 100 trừ 7 phẩy 9 lại ra 92 phẩy 1."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda h: [round(h(100), 1), round(h(20), 1)] == [8.5, 19.0] and round(75 - h(100), 1) == 66.5 and round(75 + h(100), 1) == 83.5 and round(75 - h(20), 1) == 56.0 and round(75 + h(20), 1) == 94.0)(lambda n: 100 * 1.96 * math.sqrt(0.75 * 0.25 / n))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bỏ cột giới tính, vùng miền rồi nghĩ mô hình đã công bằng <b class="red">(thuộc tính thay thế)</b>
          <br><span class="note">Mã bưu chính, tên trường, thói quen mua sắm có thể “nói hộ” cột đã bỏ. Mô hình vẫn đối xử khác nhau; chỉ là ta không còn đo được.</span></div>
        say: "Lỗi thứ nhất, bỏ cột giới tính hay vùng miền rồi nghĩ mô hình đã công bằng. Mã bưu chính, tên trường, thói quen mua sắm có thể nói hộ cột đã bỏ, nên mô hình vẫn đối xử khác nhau, chỉ là ta không còn đo được."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhóm nhỏ quá nên “không đáng kể” <b class="red">(bỏ rơi)</b>
          <br><span class="note">Nhóm 100 người có thể là hàng triệu người khi triển khai toàn quốc. Báo khoảng tin cậy cho nhóm nhỏ thay vì bỏ qua; thu thêm dữ liệu cho nhóm đó.</span></div>
        say: "Lỗi thứ hai, coi nhóm nhỏ là không đáng kể. Nhóm 100 người trong tập kiểm tra có thể là hàng triệu người khi triển khai toàn quốc. Hãy báo khoảng tin cậy cho nhóm nhỏ thay vì bỏ qua, và thu thêm dữ liệu cho nhóm đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Viết thẻ mô hình một lần rồi để đó <b class="red">(lỗi thời)</b>
          <br><span class="note">Mỗi lần huấn luyện lại, dữ liệu và chỉ số theo nhóm đổi. Sinh thẻ mô hình tự động trong đường ống, đi kèm mỗi phiên bản.</span></div>
        say: "Lỗi thứ ba, viết thẻ mô hình một lần rồi để đó. Mỗi lần huấn luyện lại, dữ liệu và chỉ số theo nhóm đều đổi, nên hãy sinh thẻ mô hình tự động trong đường ống, đi kèm mỗi phiên bản."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Kết luận từ chênh lệch theo nhóm mà <b>không xem cỡ nhóm</b> <b class="red">(nhiễu)</b></div>
          <table class="t"><tr><th>cỡ nhóm</th><th>độ chính xác</th><th>khoảng 95%: $p \pm 1{,}96 \sqrt{\frac{p \cdot (1 - p)}{n}}$</th><th>so với 94% của đa số</th></tr>
          <tr><td>100 câu</td><td>75%</td><td>$75\% \pm 8{,}5$ điểm $= [66{,}5\%;\ 83{,}5\%]$</td><td>nằm hẳn dưới: chênh lệch là thật</td></tr>
          <tr><td>20 câu</td><td>75%</td><td class="red">$75\% \pm 19{,}0$ điểm $= [56{,}0\%;\ 94{,}0\%]$</td><td>chạm tới 94%: chưa kết luận được</td></tr></table>
          <p class="note">Người làm nghề ghi trong thẻ mô hình cả cỡ nhóm và khoảng; nhóm quá nhỏ thì thu thêm dữ liệu trước khi kết luận.</p>
        introduces: [pm, sqrt]
        focus: [1, 2, "2.2", "2.3", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, kết luận từ chênh lệch theo nhóm mà không xem cỡ nhóm. Ở khoá Khoa học dữ liệu, ta đã có khoảng tin cậy 95 phần trăm, bằng p cộng trừ 1 phẩy 96 nhân căn của p nhân 1 trừ p, chia n. Với nhóm 100 câu đúng 75 phần trăm, khoảng là cộng trừ 8 phẩy 5 điểm, từ 66 phẩy 5 tới 83 phẩy 5, nằm hẳn dưới 94, nên chênh lệch là thật. Nếu nhóm chỉ có 20 câu, khoảng rộng tới cộng trừ 19 điểm, từ 56 tới 94, chạm tới con số của nhóm đa số. Lúc đó chưa kết luận được gì. Người làm nghề ghi trong thẻ mô hình cả cỡ nhóm và khoảng, và thu thêm dữ liệu khi nhóm quá nhỏ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(Fraction(90, 100), Fraction(30, 50)) == (Fraction(9, 10), Fraction(3, 5)) and Fraction(90 + 30, 150) == Fraction(4, 5)"
      - "100 + 50 == 150 and 90 + 30 == 120 and 50 - 30 == 20 and Fraction(20, 50) == Fraction(2, 5)"
    steps:
      - show: |
          <p>Mô hình sàng lọc bệnh. Nhóm A có 100 người thật sự mắc bệnh, mô hình bắt được 90. Nhóm B có 50 người mắc bệnh, mô hình bắt được 30.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Tỉ lệ dương tính thật của mỗi nhóm? Của chung?</td></tr><tr><td>2</td><td>Thẻ mô hình nên ghi gì về điều này?</td></tr></table>
        focus: [0, 1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm với một mô hình sàng lọc bệnh. Nhóm A có 100 người thật sự mắc bệnh, mô hình bắt được 90. Nhóm B có 50 người mắc bệnh, mô hình bắt được 30. Câu một, tỉ lệ dương tính thật của mỗi nhóm và của chung là bao nhiêu? Câu hai, thẻ mô hình nên ghi gì về điều này? Dừng video và làm ra giấy."
