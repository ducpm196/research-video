        focus: [1, 1, 1, 1]
        say: "Hình vẽ điểm rác của hai loại thư. Đường xanh là thư thường, tụ quanh âm 1, đường cam là thư rác lúc huấn luyện, tụ quanh 1, và vạch lục ở 0 là ngưỡng mô hình học được. Ba tháng sau, thư rác dời sang đường đỏ đứt, tụ quanh 0, nên một nửa số thư rác lọt về phía thư thường. Mã và ngưỡng không đổi, chỉ có dữ liệu dời đi."

  - id: example
    kind: example
    title: "Ngưỡng cũ, dữ liệu mới"
    checks:
      - "round((alg.norm_cdf(1) + alg.norm_cdf(1 - 1)) / 2, 3) == 0.671 and abs(alg.drift_accuracy(1) - 0.671) < 0.01 and abs(alg.drift_accuracy(0) - 0.841) < 0.01"
    steps:
      - show: |
          <p>Điểm rác $x$ (con số mô hình tính từ nội dung thư, càng lớn càng giống rác): thư thường quanh $-1$, thư rác quanh $+1$. Mô hình học ngưỡng: $x \gt 0$ là rác.</p>
          <p><b>Bước 1</b> — thư thường đúng khi $x \lt 0$. Ngưỡng 0 cách tâm $-1$ đúng 1 độ rộng, nên thư thường đúng $\hl{84{,}1\%}$.</p>
        introduces: [ltgt]
        focus: [1, 1, 2, 2]
        say: "Mỗi thư có một điểm rác x, là con số mô hình tính từ nội dung thư, càng lớn càng giống rác, và thư thường nằm quanh âm 1, thư rác nằm quanh 1. Mô hình học được ngưỡng, x lớn hơn 0 là rác. Bước một, thư thường được xếp đúng khi x nhỏ hơn 0. Ngưỡng 0 cách tâm âm 1 đúng một độ rộng, nên thư thường đúng 84 phẩy 1 phần trăm."
      - show: |
          <table class="t"><tr><th>lúc</th><th>thư thường đúng</th><th>thư rác đúng</th><th>chung</th></tr>
          <tr><td>huấn luyện</td><td>84,1%</td><td>84,1% (tâm $+1$, đối xứng)</td><td>$\frac{84{,}1\% + 84{,}1\%}{2} = 84{,}1\%$</td></tr></table>
        focus: ["1.2", "1.2"]
        say: "Bước hai, lúc huấn luyện, thư rác tụ quanh 1, cách ngưỡng cũng đúng một độ rộng nhưng ở phía bên kia, nên thư rác cũng đúng 84 phẩy 1 phần trăm. Trung bình hai nhóm, độ chính xác 84 phẩy 1 phần trăm."
      - show: |
          <table class="t"><tr><th>lúc</th><th>thư thường đúng</th><th>thư rác đúng</th><th>chung</th></tr>
          <tr><td>huấn luyện</td><td>84,1%</td><td>84,1%</td><td>84,1%</td></tr>
          <tr><td>3 tháng sau</td><td>84,1%</td><td class="red">50% (tâm dời về 0)</td><td>?</td></tr></table>
        focus: ["1.3", "1.3"]
        say: "Bước ba, ba tháng sau, thư rác viết khéo hơn và nằm quanh 0. Ngưỡng nằm ngay tại tâm của thư rác, nên chỉ đúng một nửa số thư rác, 50 phần trăm, còn thư thường vẫn đúng 84 phẩy 1 phần trăm."
      - clear: true
        show: |
          $$\frac{84{,}1\% + 50\%}{2} \approx \hl{67{,}1\%}$$
          <div class="box key">Không có lỗi nào trong mã. Chỉ <b>giám sát</b> và <b>huấn luyện lại</b> mới bắt được loại hỏng này — vì thế chúng là một phần của hệ thống, không phải việc làm thêm.</div>
        focus: [1, 1, 1, 2, 2]
        say: "Bước bốn, lấy trung bình hai nhóm. Lúc huấn luyện, thư rác nằm quanh 1, độ chính xác 84 phẩy 1 phần trăm. Ba tháng sau, thư rác viết khéo hơn và nằm quanh 0, độ chính xác tụt còn 67 phẩy 1 phần trăm. Không có lỗi nào trong mã. Chỉ giám sát và huấn luyện lại mới bắt được loại hỏng này, nên chúng là một phần của hệ thống, không phải việc làm thêm."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "alg.drift_accuracy(1) == 0.671 and alg.drift_accuracy(0) == 0.844"
      - "round(1 - alg.norm_cdf(1), 3) == 0.159 and round((1 - alg.norm_cdf(1) + 0.5) / 2, 3) == 0.329 and round(1 - (1 - alg.norm_cdf(1) + 0.5) / 2, 3) == 0.671"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>đếm thẳng</td><td>máy rút 2000 thư giả lập (một nửa thường, một nửa rác quanh 0), đếm số thư xếp đúng</td><td>67,1% ✓ (lúc học: 84,4%, gần 84,1%)</td></tr>
          <tr><td>đếm lỗi</td><td>thư thường sai 15,9%, thư rác sai 50%: lỗi chung $\frac{15{,}9\% + 50\%}{2} \approx 32{,}9\%$</td><td>$100\% - 32{,}9\% = 67{,}1\%$ ✓</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác. Cách thứ nhất, cho máy rút 2000 thư giả lập, một nửa thư thường, một nửa thư rác nằm quanh 0, rồi đếm thẳng số thư xếp đúng. Kết quả 67 phẩy 1 phần trăm, khớp với công thức. Với dữ liệu lúc học, máy đếm được 84 phẩy 4 phần trăm, gần 84 phẩy 1, sai khác chỉ do rút ngẫu nhiên. Cách thứ hai, đếm lỗi, thư thường sai 15 phẩy 9 phần trăm, thư rác sai 50 phần trăm, lỗi chung khoảng 32 phẩy 9 phần trăm. Lấy 100 trừ đi, còn 67 phẩy 1 phần trăm."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda w: [round(x, 3) for x in w] == [0.841, 0.841, 0.766, 0.671] and round(sum(w) / 4, 3) == 0.78 and round(84.1 - 67.1) == 17)([(alg.norm_cdf(1) + alg.norm_cdf(1 - s)) / 2 for s in (0, 0, 0.5, 1)])"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi điểm trên tập kiểm tra là bảo đảm khi chạy thật <b class="red">(lạc quan)</b>
          <br><span class="note">Tập kiểm tra là ảnh chụp quá khứ. Dữ liệu thật sẽ khác dần; cần đo lại liên tục trên dữ liệu mới.</span></div>
        say: "Lỗi thứ nhất, coi điểm trên tập kiểm tra là bảo đảm khi chạy thật. Tập kiểm tra chỉ là ảnh chụp quá khứ, dữ liệu thật sẽ khác dần, nên cần đo lại liên tục trên dữ liệu mới."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Huấn luyện trong sổ ghi chép (nơi chạy mã từng ô bằng tay) rồi chép tay lên máy chủ <b class="red">(không lặp lại được)</b>
          <br><span class="note">Không ai dựng lại được đúng mô hình đó: dữ liệu nào, mã nào, hạt giống nào (con số khởi đầu của bộ sinh số ngẫu nhiên)? Mọi bước phải là mã trong <b>đường ống</b> — chuỗi bước chạy tự động từ dữ liệu tới mô hình — như phần mềm thường.</span></div>
        say: "Lỗi thứ hai, huấn luyện trong sổ ghi chép, nơi chạy mã từng ô bằng tay, rồi chép tay lên máy chủ. Không ai dựng lại được đúng mô hình đó, vì không biết dữ liệu nào, mã nào, và hạt giống nào, tức con số khởi đầu của bộ sinh số ngẫu nhiên. Mọi bước phải là mã trong đường ống, tức chuỗi bước chạy tự động từ dữ liệu tới mô hình, như phần mềm thường."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ đầu tư vào mô hình, bỏ qua dữ liệu <b class="red">(sai chỗ)</b>
          <br><span class="note">Nhãn sai, cột thiếu, đơn vị đổi âm thầm có thể làm hỏng mô hình nhiều hơn cả việc chọn sai thuật toán. Kiểm dữ liệu trước khi huấn luyện, giống một chương trình cẩn thận kiểm mọi thứ nhận từ bên ngoài trước khi dùng.</span></div>
        say: "Lỗi thứ ba, chỉ đầu tư vào mô hình mà bỏ qua dữ liệu. Nhãn sai, cột thiếu, đơn vị đổi âm thầm có thể làm hỏng mô hình nhiều hơn cả việc chọn sai thuật toán. Hãy kiểm dữ liệu trước khi huấn luyện, giống một chương trình cẩn thận kiểm mọi thứ nhận từ bên ngoài trước khi dùng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Báo động theo độ chính xác <b>trung bình cả tháng</b> <b class="red">(báo muộn)</b></div>
          <table class="t"><tr><th>tuần</th><th>1</th><th>2</th><th>3</th><th>4</th><th>trung bình tháng</th></tr>
          <tr><td>thư rác nằm quanh</td><td>$+1$</td><td>$+1$</td><td>$+0{,}5$</td><td>$0$</td><td></td></tr>
          <tr><td>độ chính xác</td><td>84,1%</td><td>84,1%</td><td>76,6%</td><td class="red">67,1%</td><td>78,0%</td></tr></table>
          <p class="note">Ngưỡng báo động 75%: trung bình tháng 78,0% vẫn “xanh” trong khi tuần 4 đã tụt 17 điểm. Người làm nghề đặt báo động theo <b>từng cửa sổ ngắn</b> (ngày, tuần) và xem xu hướng.</p>
        focus: [1, 2, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đặt báo động theo độ chính xác trung bình cả tháng, nên báo muộn. Bảng theo dõi bốn tuần, khi thư rác dời dần từ 1 về 0. Độ chính xác lần lượt là 84 phẩy 1, 84 phẩy 1, 76 phẩy 6, rồi 67 phẩy 1 phần trăm. Trung bình tháng là 78 phần trăm. Với ngưỡng báo động 75 phần trăm, trung bình tháng vẫn xanh, trong khi tuần cuối đã tụt 17 điểm. Người làm nghề đặt báo động theo từng cửa sổ ngắn, như ngày hay tuần, và xem xu hướng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round((alg.norm_cdf(1) + alg.norm_cdf(1 - 0.5)) / 2, 3) == 0.766 and round((alg.norm_cdf(1) + alg.norm_cdf(1 - 2)) / 2, 3) == 0.5"
      - "round(100 - 84.1, 1) == 15.9 and round((84.1 + 15.9) / 2, 1) == 50.0 and round(1 - alg.norm_cdf(1), 3) == 0.159"
    steps:
      - show: |
          <p>Vẫn ngưỡng 0, thư thường quanh $-1$. Biết độ chính xác bằng 76,6% khi thư rác dời về quanh $0{,}5$.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nếu thư rác dời hẳn về quanh $-1$ (giống hệt thư thường), độ chính xác là bao nhiêu? Vì sao?</td></tr>
          <tr><td>2</td><td>Kể hai bước trong vòng đời giúp phát hiện và sửa chuyện này.</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, vẫn ngưỡng 0, thư thường nằm quanh âm 1. Biết độ chính xác là 76 phẩy 6 phần trăm khi thư rác dời về quanh 0 phẩy 5. Câu một, nếu thư rác dời hẳn về quanh âm 1, giống hệt thư thường, thì độ chính xác là bao nhiêu, và vì sao? Câu hai, hãy kể hai bước trong vòng đời giúp phát hiện và sửa chuyện này. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Thư thường vẫn đúng 84,1%. Thư rác giờ quanh $-1$, chỉ phần nằm sau ngưỡng 0 mới bị bắt: $100\% - 84{,}1\% = 15{,}9\%$.</p>
          <p>Chung: $\frac{84{,}1\% + 15{,}9\%}{2} = \hl{50\%}$ — hai loại thư giống hệt nhau, ngưỡng nào cũng chỉ như đoán bừa.</p>
        focus: [1, 1, 2, 2]
        say: "Đáp án câu một, làm từng bước. Thư thường vẫn đúng 84 phẩy 1 phần trăm. Thư rác giờ nằm quanh âm 1, chỉ phần nằm sau ngưỡng 0 mới bị bắt, tức 100 trừ 84 phẩy 1, bằng 15 phẩy 9 phần trăm. Trung bình hai nhóm được đúng 50 phần trăm, vì hai loại thư giống hệt nhau, ngưỡng nào cũng chỉ như đoán bừa."
      - show: |
          <p>② <b>Giám sát</b> (độ chính xác, phân bố điểm) để phát hiện; <b>gán nhãn lại và huấn luyện lại</b> để sửa.</p>
        say: "Câu hai, giám sát độ chính xác và phân bố điểm để phát hiện, rồi gán nhãn lại và huấn luyện lại để sửa."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">vòng đời: dữ liệu → mô hình → phục vụ → giám sát</span><span class="a">→</span>
          <span class="n">dữ liệu đổi thì mô hình kém dần</span><span class="a">→</span>
          <span class="n">mã mô hình chỉ là phần nhỏ</span><span class="a">→</span>
          <span class="n">mọi bước là mã, lặp lại được</span></div>
        say: "Tổng kết lại, vòng đời đi từ dữ liệu tới mô hình, phục vụ và giám sát. Dữ liệu đổi thì mô hình kém dần, mã mô hình chỉ là phần nhỏ, và mọi bước phải là mã lặp lại được."
      - show: |
          <div class="box key"><b>Tư duy:</b> một mô hình là một lời hứa về dữ liệu tương lai, dựa trên dữ liệu quá khứ. Hệ thống phải liên tục kiểm xem lời hứa đó còn đúng không.</div>
        say: "Điều cần mang theo, một mô hình là một lời hứa về dữ liệu tương lai dựa trên dữ liệu quá khứ, nên hệ thống phải liên tục kiểm xem lời hứa đó còn đúng không."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>tái lập</b> — hạt giống, mã, dữ liệu, môi trường.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học cách tái lập một lần huấn luyện, với hạt giống, mã, dữ liệu, và môi trường. Hẹn gặp bạn ở bài tiếp theo."
