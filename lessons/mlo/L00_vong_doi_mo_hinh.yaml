id: L00
course: MLO
series: "MLO · MLOps: đưa mô hình học máy vào vận hành"
title: "Bài 0 — Vòng đời mô hình trong sản xuất và nợ kỹ thuật của hệ học máy"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/mlo.yaml L00; audit/mlo/verify_mlo.py L00; D. Sculley và cộng sự, Hidden Technical Debt in Machine Learning Systems, NeurIPS (2015); C. Huyen, Designing Machine Learning Systems (O'Reilly, 2022), chương 1 và 8; DVO bài 0 (vòng phản hồi)"
assumes: [arith, frac, approx]
# Quy ước: ví dụ bộ lọc thư rác 1 chiều — điểm rác x của thư thường ~ N(−1, 1), thư rác ~ N(1, 1); ngưỡng học được x = 0. Khi kẻ gửi rác đổi cách
#   viết, thư rác ~ N(1 − s, 1). Độ chính xác của ngưỡng cũ = (Φ(1) + Φ(1 − s)) / 2 với Φ là hàm phân phối chuẩn (statistics.NormalDist);
#   alg.drift_accuracy mô phỏng lại. Lời đọc không nói “ML”, nói “học máy”.
objectives:
  - "Mô tả vòng dữ liệu – huấn luyện – đánh giá – triển khai – giám sát"
  - "Nhận ra phần mã mô hình chỉ là phần nhỏ của hệ thống"
  - "Hiểu vì sao mô hình tốt lúc huấn luyện có thể kém dần khi chạy thật"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mô hình 84% xuống còn 67% mà không ai sửa gì"
    checks:
      - "round((alg.norm_cdf(1) + alg.norm_cdf(1)) / 2, 2) == 0.84 and round((alg.norm_cdf(1) + alg.norm_cdf(0)) / 2, 2) == 0.67"
    steps:
      - show: |
          <p>Bộ lọc thư rác đạt 84% trên tập kiểm tra và được đưa vào chạy. Ba tháng sau, kẻ gửi rác đổi cách viết. Mã không đổi một dòng, mô hình không đổi một tham số — nhưng độ chính xác chỉ còn $\hl{67\%}$.</p>
          <div class="box key">Hôm nay: <b>vòng đời mô hình</b> trong vận hành — vì sao một mô hình học máy là một <b>hệ thống</b>, không chỉ là một tệp trọng số.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một bộ lọc thư rác đạt 84 phần trăm trên tập kiểm tra và được đưa vào chạy. Ba tháng sau, kẻ gửi rác đổi cách viết. Mã không đổi một dòng, mô hình không đổi một tham số, nhưng độ chính xác chỉ còn 67 phần trăm. Hôm nay ta học vòng đời của mô hình trong vận hành, và vì sao một mô hình học máy là một hệ thống, không chỉ là một tệp trọng số."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: độ chính xác, trung bình hai nhóm, đường chuông"
    checks:
      - "round(84 / 100, 2) == 0.84 and (90 + 70) / 2 == 80 and (45 + 35) / (50 + 50) == 0.8"
      - "round(alg.norm_cdf(0, -1, 1), 3) == 0.841 and alg.norm_cdf(0, 0, 1) == 0.5"
      - "round(alg.norm_cdf(1) - alg.norm_cdf(-1), 3) == 0.683 and round((alg.norm_cdf(1) - alg.norm_cdf(-1)) / 2, 3) == 0.341 and round(0.5 + 0.341, 3) == 0.841"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>ví dụ</th><th>nghĩa</th></tr>
          <tr><td>tập huấn luyện / tập kiểm tra</td><td>thư đã biết nhãn “thường” hay “rác”</td><td>mô hình học từ tập huấn luyện; tập kiểm tra giữ riêng, như đề thi chưa thấy</td></tr>
          <tr><td>độ chính xác</td><td>$\frac{84}{100} = 84\%$</td><td>tỉ lệ thư được xếp đúng</td></tr>
          <tr><td>hai nhóm bằng nhau</td><td>$\frac{90\% + 70\%}{2} = 80\%$</td><td>độ chính xác chung là trung bình cộng</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Trước hết ta ôn một khái niệm và hai phép tính. Mô hình học từ những thư đã biết nhãn, gọi là tập huấn luyện. Còn tập kiểm tra là những thư đã biết nhãn được giữ riêng, không cho mô hình học, giống một đề thi nó chưa thấy. Độ chính xác là tỉ lệ thư được xếp đúng, ví dụ đúng 84 thư trong 100 thư của tập kiểm tra là 84 phần trăm. Khi thư thường và thư rác nhiều bằng nhau, độ chính xác chung là trung bình cộng của hai nhóm. Nhóm này đúng 90 phần trăm, nhóm kia đúng 70 phần trăm, thì chung là 80 phần trăm."
      - show: |
          <p><b>Đường chuông</b> (phân phối chuẩn): nhiều số đo tụ quanh một <b>tâm</b>, càng xa tâm càng hiếm. <b>Độ rộng</b> (độ lệch chuẩn) là khoảng cách điển hình từ một số tới tâm; ở đây độ rộng bằng 1.</p>
          <table class="t"><tr><th>vị trí ngưỡng so với tâm</th><th>phần nằm phía trước ngưỡng</th><th>vì sao</th></tr>
          <tr><td>ngay tại tâm</td><td>50%</td><td>đường chuông đối xứng, mỗi bên một nửa</td></tr>
          <tr><td>cách tâm đúng 1 độ rộng</td><td>$50\% + 34{,}1\% = 84{,}1\%$</td><td>khoảng 68,3% số nằm trong 1 độ rộng quanh tâm, mỗi bên 34,1%</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.3"]
        say: "Tiếp theo, ta cần hiểu đường chuông, tức phân phối chuẩn, nơi nhiều số đo tụ quanh một tâm, càng xa tâm càng hiếm. Độ rộng, hay độ lệch chuẩn, là khoảng cách điển hình từ một số tới tâm, và ở đây độ rộng bằng 1. Nếu đặt ngưỡng ngay tại tâm, đường chuông đối xứng nên đúng một nửa, 50 phần trăm, nằm phía trước ngưỡng. Với đường chuông, khoảng 68 phẩy 3 phần trăm số nằm trong vòng một độ rộng quanh tâm, tức mỗi bên 34 phẩy 1 phần trăm. Vậy nếu ngưỡng cách tâm đúng một độ rộng, phần nằm phía trước là 50 cộng 34 phẩy 1, bằng 84 phẩy 1 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: vòng đời và nợ kỹ thuật"
    steps:
      - show: |
          <div class="chain"><span class="n">thu dữ liệu</span><span class="a">→</span><span class="n">gán nhãn</span><span class="a">→</span><span class="n">đặc trưng</span><span class="a">→</span><span class="n">huấn luyện</span><span class="a">→</span><span class="n">đánh giá</span><span class="a">→</span><span class="n">phục vụ</span><span class="a">→</span><span class="n">giám sát</span><span class="a">↺</span></div>
          <p>Phần mềm thường hỏng khi <b>mã</b> đổi. Hệ học máy còn hỏng khi <b>dữ liệu</b> đổi — mà dữ liệu đổi liên tục, không ai báo trước.</p>
          <div class="box key"><b>Nợ kỹ thuật</b> của hệ học máy (Sculley và cộng sự, 2015): mã mô hình chỉ là ô nhỏ ở giữa; quanh nó là thu dữ liệu, kiểm dữ liệu, đặc trưng, phục vụ, giám sát — phần hạ tầng “rộng lớn và phức tạp”, nơi tích tụ phần lớn công sức duy trì.</div>
        focus: [1, 2, 2, 3, 3]
        say: "Vòng đời gồm thu dữ liệu, gán nhãn, tính đặc trưng, huấn luyện, đánh giá, phục vụ, giám sát, rồi quay lại thu dữ liệu. Phần mềm thường hỏng khi mã đổi. Hệ học máy còn hỏng khi dữ liệu đổi, mà dữ liệu đổi liên tục, không ai báo trước. Một nghiên cứu năm 2015 về nợ kỹ thuật cho thấy mã mô hình chỉ là ô nhỏ ở giữa. Quanh nó là thu dữ liệu, kiểm dữ liệu, đặc trưng, phục vụ và giám sát, một phần hạ tầng rộng lớn và phức tạp, nơi tích tụ phần lớn công sức duy trì."

