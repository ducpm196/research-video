id: L01
course: MLO
series: "MLO · MLOps: đưa mô hình học máy vào vận hành"
title: "Bài 1 — Tái lập: hạt giống, mã, dữ liệu, môi trường"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/mlo.yaml L01; audit/mlo/verify_mlo.py L01; PyTorch docs, Reproducibility (pytorch.org/docs/stable/notes/randomness.html, đọc 2026-10-28); D. Goldberg, What Every Computer Scientist Should Know About Floating-Point Arithmetic, ACM Computing Surveys 23(1), 1991; DSC bài 14"
assumes: [arith]
# Quy ước: alg.split_ids(seed) xáo 10 mẫu (đánh số 0–9) bằng random.Random(seed), lấy 7 mẫu đầu làm tập huấn luyện. Thứ tự cộng số thực:
#   (0,1 + 0,2) + 0,3 và 0,1 + (0,2 + 0,3) tính bằng số thực 64 bit chuẩn IEEE 754.
objectives:
  - "Liệt kê mọi thứ cần ghi lại để tái lập một lần huấn luyện"
  - "Dùng hạt giống ngẫu nhiên đúng cách"
  - "Giải thích vì sao tính song song có thể cho kết quả không tất định"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hôm qua 93,3%, hôm nay 86,7%, cùng một mã"
    checks:
      - "alg.split_score(5) == 28 / 30 and alg.split_score(7) == 26 / 30"
    steps:
      - show: |
          <p>Bạn chạy lại đúng sổ ghi chép hôm qua để lấy số cho báo cáo. Hôm qua mô hình đạt 93,3%, hôm nay 86,7%. Không ai sửa mã. Con số nào mới đúng — và lần sau chạy sẽ ra bao nhiêu?</p>
          <div class="box key">Hôm nay: <b>tái lập</b> — ghi đủ mọi thứ để chạy lại ra đúng kết quả.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, bạn chạy lại đúng sổ ghi chép hôm qua để lấy số cho báo cáo. Hôm qua mô hình đạt 93 phẩy 3 phần trăm, hôm nay chỉ 86 phẩy 7. Không ai sửa mã. Con số nào mới đúng, và lần sau chạy sẽ ra bao nhiêu? Hôm nay ta học cách tái lập, ghi đủ mọi thứ để chạy lại ra đúng kết quả."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tỉ lệ đúng trên 30 mẫu, và số giả ngẫu nhiên"
    checks:
      - "round(28 / 30 * 100, 1) == 93.3 and round(26 / 30 * 100, 1) == 86.7 and round(100 / 30, 1) == 3.3"
      - "(lambda f: [f(1, 4), f(1, 4), f(2, 3)])(lambda s, n: [x for x in __import__('itertools').accumulate(range(n), lambda a, _: (5 * a + 3) % 16, initial=s)][1:]) == [[8, 11, 10, 5], [8, 11, 10, 5], [13, 4, 7]]"
    steps:
      - show: |
          <table class="t"><tr><th>mẫu đúng trên 30</th><th>phép tính</th><th>độ chính xác</th></tr>
          <tr><td>28</td><td>$\frac{28}{30}$</td><td>93,3%</td></tr>
          <tr><td>26</td><td>$\frac{26}{30}$</td><td>86,7%</td></tr></table>
          <p>Mỗi mẫu sai thêm làm tụt $\frac{100\%}{30} \approx 3{,}3$ điểm.</p>
        introduces: [frac, approx]
        focus: [1, "1.2", "1.3", 2]
        say: "Trước hết ta ôn cách tính độ chính xác trên một tập kiểm tra nhỏ. Đúng 28 mẫu trong 30 mẫu là 28 chia 30, bằng 93 phẩy 3 phần trăm. Đúng 26 mẫu là 86 phẩy 7 phần trăm. Vậy với 30 mẫu, mỗi mẫu sai thêm làm tụt khoảng 3 phẩy 3 điểm."
      - show: |
          <p><b>Số giả ngẫu nhiên</b>: máy tính sinh dãy số “trông như ngẫu nhiên” bằng một <b>công thức</b>, bắt đầu từ <b>hạt giống</b>. Ví dụ đồ chơi: số sau = phần dư của (5 nhân số trước, cộng 3) khi chia cho 16.</p>
          <table class="t"><tr><th>hạt giống</th><th>dãy sinh ra</th></tr>
          <tr><td>1</td><td>8, 11, 10, 5</td></tr>
          <tr><td>1 (chạy lại)</td><td>8, 11, 10, 5 — <b>giống hệt</b></td></tr>
          <tr><td>2</td><td>13, 4, 7 — <b class="red">khác</b></td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Tiếp theo là số giả ngẫu nhiên. Máy tính sinh một dãy số trông như ngẫu nhiên bằng một công thức, bắt đầu từ một số gọi là hạt giống. Ví dụ đồ chơi, số sau bằng phần dư của 5 nhân số trước cộng 3, khi chia cho 16. Bắt đầu từ hạt giống 1, ta được 5 cộng 3 bằng 8, rồi 43 chia 16 dư 11, rồi 10, rồi 5. Chạy lại từ hạt giống 1 thì ra đúng dãy đó, giống hệt. Đổi sang hạt giống 2 thì ra 13, 4, 7, một dãy khác."

  - id: sym
    kind: symbol
    title: "Giải mã: bốn thứ phải ghi lại"
    steps:
      - show: |
          <table class="t"><tr><th>thứ</th><th>vì sao</th><th>ghi bằng</th></tr>
          <tr><td><b>hạt giống</b></td><td>chia dữ liệu, khởi tạo trọng số, xáo lô đều ngẫu nhiên</td><td>một số nguyên cho mỗi nguồn ngẫu nhiên</td></tr>
          <tr><td><b>mã</b></td><td>một dòng sửa đổi kết quả</td><td>mã băm lần ghi trong kho mã</td></tr>
          <tr><td><b>dữ liệu</b></td><td>thêm, bớt, sửa nhãn đổi kết quả</td><td>mã băm nội dung</td></tr>
          <tr><td><b>môi trường</b></td><td>phiên bản thư viện, phần cứng</td><td>tệp khoá phiên bản, ảnh container</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng liệt kê bốn thứ phải ghi lại. Hạt giống, vì chia dữ liệu, khởi tạo trọng số và xáo lô đều ngẫu nhiên, ghi bằng một số nguyên cho mỗi nguồn ngẫu nhiên. Mã, vì một dòng sửa là đổi kết quả, ghi bằng mã băm của lần ghi trong kho mã. Dữ liệu, vì thêm, bớt hay sửa nhãn đều đổi kết quả, ghi bằng mã băm nội dung của tệp dữ liệu. Môi trường, gồm phiên bản thư viện và phần cứng, ghi bằng tệp khoá phiên bản hoặc ảnh container."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một mô hình, mười bốn con số"
    checks:
      - "sorted(round(alg.split_score(s) * 100, 1) for s in range(1, 15)) == [76.7, 80.0, 83.3, 83.3, 86.7, 86.7, 86.7, 86.7, 90.0, 90.0, 93.3, 93.3, 96.7, 96.7]"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><line x1="180" y1="290" x2="1220" y2="290" stroke="#6b7280" stroke-width="2"/><line x1="800" y1="40" x2="800" y2="290" stroke="#059669" stroke-width="4" stroke-dasharray="12 8"/><circle cx="800" cy="262" r="17" fill="#2a78d6"/><circle cx="532" cy="262" r="17" fill="#2a78d6"/><circle cx="268" cy="262" r="17" fill="#2a78d6"/><circle cx="800" cy="216" r="17" fill="#2a78d6"/><circle cx="932" cy="262" r="17" fill="#eb6834"/><circle cx="532" cy="216" r="17" fill="#2a78d6"/><circle cx="668" cy="262" r="17" fill="#eb6834"/><circle cx="932" cy="216" r="17" fill="#2a78d6"/><circle cx="400" cy="262" r="17" fill="#2a78d6"/><circle cx="1068" cy="262" r="17" fill="#2a78d6"/><circle cx="668" cy="216" r="17" fill="#2a78d6"/><circle cx="668" cy="170" r="17" fill="#2a78d6"/><circle cx="1068" cy="216" r="17" fill="#2a78d6"/><circle cx="668" cy="124" r="17" fill="#2a78d6"/><g fill="#1f2937" font-size="22"><line x1="200" y1="290" x2="200" y2="300" stroke="#6b7280" stroke-width="2"/><text x="200" y="328" text-anchor="middle">75%</text><line x1="400" y1="290" x2="400" y2="300" stroke="#6b7280" stroke-width="2"/><text x="400" y="328" text-anchor="middle">80%</text><line x1="600" y1="290" x2="600" y2="300" stroke="#6b7280" stroke-width="2"/><text x="600" y="328" text-anchor="middle">85%</text><line x1="800" y1="290" x2="800" y2="300" stroke="#6b7280" stroke-width="2"/><text x="800" y="328" text-anchor="middle">90%</text><line x1="1000" y1="290" x2="1000" y2="300" stroke="#6b7280" stroke-width="2"/><text x="1000" y="328" text-anchor="middle">95%</text><line x1="1200" y1="290" x2="1200" y2="300" stroke="#6b7280" stroke-width="2"/><text x="1200" y="328" text-anchor="middle">100%</text><text x="1250" y="70" fill="#2a78d6">mỗi chấm: một hạt giống</text><text x="1250" y="115" fill="#eb6834">cam: hạt giống 5 và 7</text><text x="1250" y="160" fill="#059669">lục: điểm thật 90%</text><text x="1250" y="215" font-size="20">cùng một mô hình,</text><text x="1250" y="245" font-size="20">chỉ đổi cách rút 30 mẫu</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cùng một mô hình đúng thật 90 phần trăm, chấm trên 30 mẫu kiểm tra rút bằng 14 hạt giống khác nhau, mỗi chấm là một hạt giống. Các chấm trải từ 76 phẩy 7 tới 96 phẩy 7 phần trăm, quanh vạch lục 90 phần trăm. Hai chấm cam là hạt giống 5 và 7, chính là 93 phẩy 3 hôm qua và 86 phẩy 7 hôm nay. Mô hình không đổi, chỉ có cách rút mẫu đổi."

  - id: example
    kind: example
    title: "Cùng hạt giống, cùng cách chia"
    checks:
      - "[alg.split_ids(42) for _ in range(2)] == [([2, 3, 5, 6, 7, 8, 9], [0, 1, 4])] * 2 and alg.split_ids(43) == ([1, 3, 5, 6, 7, 8, 9], [0, 2, 4])"
      - "(lambda g: (g.shuffle(x := list(range(10))), x)[1])(__import__('random').Random(42)) == [7, 3, 2, 8, 5, 6, 9, 4, 0, 1]"
      - "(lambda g: (g.shuffle(x := list(range(10))), x)[1])(__import__('random').Random(43))[7:] == [2, 4, 0]"
      - "alg.split_score(5) == 28 / 30 and alg.split_score(7) == 26 / 30"
    steps:
      - show: |
          <p>Chia 10 mẫu (đánh số 0 đến 9) thành 7 mẫu huấn luyện, 3 mẫu kiểm tra:</p>
          <table class="t"><tr><th>hạt giống</th><th>máy xáo 0–9 thành</th><th>tập kiểm tra (3 số cuối)</th></tr>
          <tr><td>42 (lần 1)</td><td>7, 3, 2, 8, 5, 6, 9, <b>4, 0, 1</b></td><td>0, 1, 4</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Ta chia 10 mẫu, đánh số 0 đến 9, thành 7 mẫu huấn luyện và 3 mẫu kiểm tra. Bước một, máy xáo 10 số bằng hạt giống 42 thành 7, 3, 2, 8, 5, 6, 9, 4, 0, 1. Bảy số đầu vào tập huấn luyện, ba số cuối 4, 0, 1 thành tập kiểm tra, viết theo thứ tự là 0, 1, 4."
      - show: |
          <table class="t"><tr><th>hạt giống</th><th>máy xáo 0–9 thành</th><th>tập kiểm tra (3 số cuối)</th></tr>
          <tr><td>42 (lần 1)</td><td>7, 3, 2, 8, 5, 6, 9, 4, 0, 1</td><td>0, 1, 4</td></tr>
          <tr><td>42 (lần 2)</td><td>7, 3, 2, 8, 5, 6, 9, 4, 0, 1</td><td>0, 1, 4 — <b>giống hệt</b></td></tr></table>
        focus: ["1.3", "1.3"]
        say: "Bước hai, chạy lại với hạt giống 42. Cùng hạt giống thì cùng dãy số ngẫu nhiên, nên cùng thứ tự xáo, và tập kiểm tra lại là 0, 1, 4, giống hệt."
      - show: |
          <table class="t"><tr><th>hạt giống</th><th>máy xáo 0–9 thành</th><th>tập kiểm tra (3 số cuối)</th></tr>
          <tr><td>42</td><td>…, 4, 0, 1</td><td>0, 1, 4</td></tr>
          <tr><td>43</td><td>…, 2, 4, 0</td><td>0, 2, 4 — <b class="red">khác</b></td></tr></table>
        focus: ["1.3", "1.3"]
        say: "Bước ba, đổi sang hạt giống 43. Ba số cuối lúc này là 2, 4, 0, nên tập kiểm tra là 0, 2, 4, đã khác."
      - clear: true
        show: |
          <p><b>Bước 4</b> — mô hình đúng 90%: sai đúng các mẫu có số thứ tự chia hết cho 10, trong 100 mẫu. Chấm trên 30 mẫu rút ngẫu nhiên:</p>
          <table class="t"><tr><th>hạt giống</th><th>số mẫu đúng</th><th>độ chính xác</th></tr>
          <tr><td>5</td><td>28 / 30</td><td>93,3%</td></tr>
          <tr><td>7</td><td>26 / 30</td><td class="red">86,7%</td></tr></table>
          <div class="box key">Đổi hạt giống là đổi tập kiểm tra — và đổi điểm số. Chênh 93,3% với 86,7% có thể chỉ do hai cách chia khác nhau, không phải do mô hình tốt hơn.</div>
        focus: [1, 2, "2.2", "2.3", 3, 3]
        say: "Bước bốn, xét một mô hình đúng 90 phần trăm, nó sai đúng các mẫu có số thứ tự chia hết cho 10, trong 100 mẫu. Rút 30 mẫu kiểm tra bằng hạt giống khác nhau rồi chấm. Hạt giống 5 cho 28 mẫu đúng trên 30, tức 93 phẩy 3 phần trăm. Hạt giống 7 cho 26 mẫu đúng, tức 86 phẩy 7 phần trăm. Đổi hạt giống là đổi tập kiểm tra, và đổi cả điểm số. Vì thế chênh lệch 93 phẩy 3 với 86 phẩy 7 có thể chỉ do hai cách chia khác nhau, không phải do mô hình tốt hơn."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "sorted(i for i in __import__('random').Random(5).sample(range(100), 30) if i % 10 == 0) == [20, 60] and sorted(i for i in __import__('random').Random(7).sample(range(100), 30) if i % 10 == 0) == [30, 50, 70, 90]"
      - "(30 - 2) / 30 == alg.split_score(5) and (30 - 4) / 30 == alg.split_score(7) and 30 * 10 / 100 == 3 and (30 - 3) / 30 == 0.9"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác: liệt kê mẫu “khó” (chia hết cho 10) trong tập kiểm tra</th><th>kết quả</th></tr>
          <tr><td>hạt giống 5</td><td>có 20 và 60 → sai 2 mẫu, đúng $30 - 2 = 28$</td><td>93,3% ✓</td></tr>
          <tr><td>hạt giống 7</td><td>có 30, 50, 70, 90 → sai 4 mẫu, đúng $30 - 4 = 26$</td><td>86,7% ✓</td></tr>
          <tr><td>kỳ vọng</td><td>30 mẫu, 10% là mẫu khó → trung bình 3 mẫu sai, đúng 27</td><td>90% nằm giữa ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta liệt kê thẳng các mẫu khó, tức có số thứ tự chia hết cho 10, nằm trong tập kiểm tra. Hạt giống 5 rút trúng 20 và 60, nên sai 2 mẫu, đúng 28, khớp 93 phẩy 3 phần trăm. Hạt giống 7 rút trúng 30, 50, 70, 90, nên sai 4 mẫu, đúng 26, khớp 86 phẩy 7 phần trăm. Trung bình, 30 mẫu có 10 phần trăm là mẫu khó, tức 3 mẫu sai và 27 mẫu đúng, đúng 90 phần trăm nằm giữa hai con số."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda s: round(max(s) * 100, 1) == 96.7 and round(sum(s) / 14 * 100, 1) == 87.9 and round(96.7 - 87.9, 1) == 8.8)([alg.split_score(k) for k in range(1, 15)])"
      - "(0.1 + 0.2) + 0.3 != 0.1 + (0.2 + 0.3) and 0.1 + (0.2 + 0.3) == 0.6"
      - "(min(alg.split_score(s) for s in range(1, 15)), max(alg.split_score(s) for s in range(1, 15))) == (23 / 30, 29 / 30)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Ghi hạt giống là đủ <b class="red">(thiếu)</b>
          <br><span class="note">Cùng hạt giống nhưng thư viện lên bản mới (thuật toán xáo đổi), hoặc dữ liệu có thêm dòng: kết quả vẫn khác. Phải ghi cả bốn thứ.</span></div>
        say: "Lỗi thứ nhất, nghĩ ghi hạt giống là đủ. Cùng hạt giống nhưng thư viện lên bản mới làm thuật toán xáo thay đổi, hoặc dữ liệu có thêm dòng, thì kết quả vẫn khác, nên phải ghi cả bốn thứ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Mong tính song song cho kết quả giống từng bit <b class="red">(thứ tự cộng)</b>
          <br><span class="note">Cộng số thực phụ thuộc thứ tự: $(0{,}1 + 0{,}2) + 0{,}3 = 0{,}6000000000000001$ nhưng $0{,}1 + (0{,}2 + 0{,}3) = 0{,}6$. Bộ xử lý đồ hoạ cộng song song theo thứ tự thay đổi mỗi lần → sai khác nhỏ, cộng dồn qua huấn luyện. Bật chế độ tất định (chậm hơn) nếu cần, và báo kết quả bằng nhiều lần chạy.</span></div>
        say: "Lỗi thứ hai, mong tính song song cho kết quả giống từng bit. Cộng số thực phụ thuộc thứ tự, cộng 0 phẩy 1 với 0 phẩy 2 trước rồi cộng 0 phẩy 3 không ra đúng 0 phẩy 6, còn cộng theo thứ tự kia thì ra đúng. Bộ xử lý đồ hoạ cộng song song theo thứ tự thay đổi mỗi lần, nên sai khác nhỏ cộng dồn qua huấn luyện. Hãy bật chế độ tất định nếu cần, dù chậm hơn, và báo kết quả bằng nhiều lần chạy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Báo một con số từ một lần chạy <b class="red">(may rủi)</b>
          <br><span class="note">Cùng một mô hình đúng 90%, chấm trên 30 mẫu kiểm tra rút bằng 14 hạt giống khác nhau: điểm đo được từ 76,7% đến 96,7%. Chạy với nhiều hạt giống, báo trung bình và khoảng dao động — như khoảng tin cậy ở DSC.</span></div>
        say: "Lỗi thứ ba, báo một con số từ một lần chạy. Cùng một mô hình đúng 90 phần trăm, chấm trên 30 mẫu kiểm tra rút bằng 14 hạt giống khác nhau, cho điểm từ 76 phẩy 7 đến 96 phẩy 7. Hãy chạy với nhiều hạt giống, báo trung bình và khoảng dao động, như khoảng tin cậy ở khoá Khoa học dữ liệu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Thử nhiều hạt giống rồi chỉ báo hạt <b>tốt nhất</b> <b class="red">(lạc quan giả)</b></div>
          <table class="t"><tr><th>cách báo</th><th>con số</th></tr>
          <tr><td>hạt giống tốt nhất trong 14</td><td class="red">96,7%</td></tr>
          <tr><td>trung bình 14 hạt giống</td><td>87,9%</td></tr>
          <tr><td>chênh do chọn lọc</td><td>8,8 điểm</td></tr></table>
          <p class="note">Hạt giống không phải siêu tham số để tinh chỉnh. Người làm nghề cố định trước danh sách hạt giống, báo trung bình và độ dao động của <b>tất cả</b>.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, thử nhiều hạt giống rồi chỉ báo hạt tốt nhất, một kiểu lạc quan giả. Bảng so hai cách báo cho cùng một mô hình. Hạt giống tốt nhất trong 14 hạt cho 96 phẩy 7 phần trăm. Trung bình cả 14 hạt chỉ 87 phẩy 9 phần trăm. Chọn lọc đã thổi phồng 8 phẩy 8 điểm. Hạt giống không phải siêu tham số để tinh chỉnh. Người làm nghề cố định trước danh sách hạt giống, rồi báo trung bình và độ dao động của tất cả."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[alg.split_ids(7)[1] for _ in range(3)] == [[2, 5, 6]] * 3"
      - "alg.split_ids(7)[0] == [0, 1, 3, 4, 7, 8, 9]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Với cùng cách chia ở trên, hạt giống 7 cho tập kiểm tra 2, 5, 6. Chạy lại hạt giống 7 trên <b>cùng</b> phiên bản thư viện và dữ liệu thì được gì?</td></tr>
          <tr><td>2</td><td>Đồng nghiệp chỉ gửi bạn tệp trọng số mô hình. Để tái lập lần huấn luyện, còn thiếu những gì?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với cùng cách chia ở trên, hạt giống 7 cho tập kiểm tra 2, 5, 6. Chạy lại hạt giống 7 trên cùng phiên bản thư viện và dữ liệu thì được gì? Câu hai, đồng nghiệp chỉ gửi bạn tệp trọng số mô hình. Để tái lập lần huấn luyện, bạn còn thiếu những gì? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Cùng hạt giống 7 → cùng dãy số ngẫu nhiên → cùng thứ tự xáo.</p>
          <p>Tập kiểm tra đúng <b>2, 5, 6</b> lần nữa; tập huấn luyện là 7 số còn lại: 0, 1, 3, 4, 7, 8, 9.</p>
        focus: [0, 1, 2, 2]
        say: "Đáp án câu một, làm từng bước. Cùng hạt giống 7 thì cùng dãy số ngẫu nhiên, nên cùng thứ tự xáo. Vì vậy được đúng 2, 5, 6 lần nữa. Tập huấn luyện là 7 số còn lại, 0, 1, 3, 4, 7, 8, 9."
      - show: |
          <table class="t"><tr><th>còn thiếu</th><th>ghi bằng</th></tr>
          <tr><td>hạt giống</td><td>số nguyên cho mỗi nguồn ngẫu nhiên</td></tr>
          <tr><td>mã</td><td>mã băm lần ghi mã</td></tr>
          <tr><td>dữ liệu</td><td>mã băm dữ liệu</td></tr>
          <tr><td>môi trường</td><td>phiên bản thư viện, phần cứng</td></tr></table>
        focus: [1, 1]
        say: "Câu hai, tệp trọng số chỉ là kết quả, không cho biết nó được làm ra thế nào. Còn thiếu hạt giống, mã băm lần ghi mã, mã băm dữ liệu, và môi trường gồm phiên bản thư viện và phần cứng."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hạt giống</span><span class="a">+</span>
          <span class="n">mã</span><span class="a">+</span>
          <span class="n">dữ liệu</span><span class="a">+</span>
          <span class="n">môi trường</span><span class="a">→</span>
          <span class="n">chạy lại ra đúng kết quả; báo nhiều lần chạy</span></div>
        say: "Tổng kết lại, hạt giống, mã, dữ liệu và môi trường, đủ cả bốn thì chạy lại mới ra đúng kết quả. Và hãy báo kết quả bằng nhiều lần chạy."
      - show: |
          <div class="box key"><b>Tư duy:</b> một kết quả không tái lập được thì không kiểm lại được, và không kiểm lại được thì chưa phải bằng chứng.</div>
        say: "Điều cần mang theo, một kết quả không tái lập được thì không kiểm lại được, và không kiểm lại được thì chưa phải là bằng chứng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>phiên bản hoá dữ liệu</b> và dòng dõi.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học phiên bản hoá dữ liệu và truy dòng dõi. Hẹn gặp bạn ở bài tiếp theo."
