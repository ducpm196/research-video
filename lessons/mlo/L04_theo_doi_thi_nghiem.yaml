        say: "Điều cần mang theo, mỗi lần bạn nhìn vào dữ liệu để ra quyết định, dữ liệu đó mất bớt khả năng làm bằng chứng khách quan."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>kho đặc trưng</b> và lệch huấn luyện–phục vụ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học kho đặc trưng và hiện tượng lệch giữa huấn luyện và phục vụ. Hẹn gặp bạn ở bài tiếp theo."
