id: L04
course: MLO
series: "MLO · MLOps: đưa mô hình học máy vào vận hành"
title: "Bài 4 — Theo dõi thí nghiệm và chọn mô hình không quá khớp tập kiểm định"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/mlo.yaml L04; audit/mlo/verify_mlo.py L04; C. Dwork và cộng sự, The Reusable Holdout: Preserving Validity in Adaptive Data Analysis, Science 349(6248), 2015; G. C. Cawley, N. L. C. Talbot, On Over-fitting in Model Selection, JMLR 11 (2010); DSC bài 9 (kiểm định nhiều lần)"
assumes: [arith]
# Quy ước: alg.best_of_random(models, n, seed) — mỗi “mô hình” đoán bừa, đúng với xác suất 0,5 độc lập trên từng mẫu của CÙNG một tập kiểm định
#   n mẫu; trả điểm cao nhất. Tập kiểm định dùng để chọn; tập kiểm tra giữ riêng, chỉ dùng một lần ở cuối.
objectives:
  - "Ghi lại mọi lần chạy và siêu tham số"
  - "Giải thích quá khớp tập kiểm định khi chọn nhiều lần"
  - "Giữ một tập kiểm tra chỉ dùng một lần"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mô hình tốt nhất trong 200 lần thử"
    checks:
      - "alg.best_of_random(200, 100, 0) == 0.61"
    steps:
      - show: |
          <p>Nhóm thử 200 cấu hình, chọn cái có điểm kiểm định cao nhất: $\hl{61\%}$. Đưa vào chạy thật: 50% — đúng bằng tung đồng xu. Thực ra cả 200 cấu hình đều chỉ đoán bừa.</p>
          <div class="box key">Hôm nay: <b>theo dõi thí nghiệm</b> — và vì sao chọn “cái tốt nhất” trên cùng một tập là tự lừa mình.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, nhóm thử 200 cấu hình và chọn cái có điểm kiểm định cao nhất, 61 phần trăm. Đưa vào chạy thật thì chỉ 50 phần trăm, đúng bằng tung đồng xu. Thực ra cả 200 cấu hình đều chỉ đoán bừa. Hôm nay ta học theo dõi thí nghiệm, và vì sao chọn cái tốt nhất trên cùng một tập dữ liệu là tự lừa mình."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: điểm đo được dao động, và xác suất “ít nhất một lần”"
    checks:
      - "math.sqrt(0.5 * 0.5 / 100) == 0.05 and round(math.sqrt(0.5 * 0.5 / 1000), 4) == 0.0158"
      - "round(1 - (1 - 0.1) ** 2, 2) == 0.19 and round((1 - 0.1) ** 2, 2) == 0.81"
    steps:
      - show: |
          <p>Một bộ đoán bừa, đúng 50% mỗi mẫu. Chấm trên $n$ mẫu, điểm đo được <b>dao động</b> quanh 50% với độ lệch chuẩn (khoá Toán cho khoa học máy tính):</p>
          $$\sqrt{\frac{0{,}5 \cdot 0{,}5}{n}}:\quad n = 100 \Rightarrow \sqrt{0{,}0025} = 0{,}05 = \hl{5 \text{ điểm}};\quad n = 1000 \Rightarrow \approx 1{,}58 \text{ điểm}$$
        introduces: [sqrt, cdot, implies]
        focus: [1, 1, 2, 2]
        say: "Trước hết ta ôn hai điều. Một bộ đoán bừa đúng 50 phần trăm mỗi mẫu, nhưng chấm trên n mẫu thì điểm đo được dao động quanh 50 phần trăm. Ở khoá Toán cho khoa học máy tính, độ lệch chuẩn của tỉ lệ này bằng căn của 0 phẩy 5 nhân 0 phẩy 5, chia n. Với 100 mẫu là căn của 0 phẩy 0025, bằng 0 phẩy 05, tức 5 điểm phần trăm, còn với 1000 mẫu chỉ khoảng 1 phẩy 58 điểm."
      - show: |
          <p>Mỗi lần thử có khả năng $q$ “gặp may”. Thử $k$ lần độc lập thì khả năng <b>ít nhất một lần</b> gặp may là $1 - (1 - q)^k$.</p>
          <p>Ví dụ $q = 0{,}1$, $k = 2$: $1 - 0{,}9^2 = 1 - 0{,}81 = \hl{0{,}19}$.</p>
        introduces: [power]
        focus: [1, 1, 2]
        say: "Điều thứ hai, nếu mỗi lần thử có khả năng q gặp may, thì thử k lần độc lập, khả năng ít nhất một lần gặp may bằng 1 trừ 1 trừ q, mũ k. Lý do là 1 trừ q mũ k là khả năng cả k lần đều không may. Ví dụ q bằng 0 phẩy 1, thử 2 lần, được 1 trừ 0 phẩy 81, bằng 0 phẩy 19."

  - id: sym
    kind: symbol
    title: "Giải mã: ba tập dữ liệu, sổ thí nghiệm"
    steps:
      - show: |
          <table class="t"><tr><th>tập</th><th>dùng để</th><th>được xem bao nhiêu lần</th></tr>
          <tr><td><b>huấn luyện</b></td><td>học tham số</td><td>thoải mái</td></tr>
          <tr><td><b>kiểm định</b></td><td>chọn cấu hình, siêu tham số</td><td>nhiều lần — nên <b>bị quá khớp dần</b></td></tr>
          <tr><td><b>kiểm tra</b></td><td>báo điểm cuối cùng</td><td><b>một lần</b>, sau khi đã chọn xong</td></tr></table>
          <p><b>Sổ thí nghiệm</b>: mỗi lần chạy ghi mã băm mã và dữ liệu, siêu tham số, hạt giống, điểm — kể cả lần thất bại.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng phân biệt ba tập dữ liệu. Tập huấn luyện dùng để học tham số, xem thoải mái. Tập kiểm định dùng để chọn cấu hình và siêu tham số, được xem nhiều lần nên bị quá khớp dần. Tập kiểm tra dùng để báo điểm cuối cùng, chỉ xem một lần sau khi đã chọn xong. Sổ thí nghiệm ghi cho mỗi lần chạy mã băm của mã và dữ liệu, siêu tham số, hạt giống và điểm, kể cả những lần thất bại."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "200 điểm ngẫu nhiên, ta chỉ nhìn cái cao nhất"
    checks:
      - "(lambda g: (lambda S: max(S) == 0.61 and min(S) == 0.36 and sum(x == 0.61 for x in S) == 3)([sum(g.random() < 0.5 for _ in range(100)) / 100 for _ in range(200)]))(__import__('random').Random(0))"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><line x1="160" y1="290" x2="1100" y2="290" stroke="#6b7280" stroke-width="2"/><rect x="200" y="277" width="28" height="13" fill="#2a78d6"/><rect x="234" y="264" width="28" height="26" fill="#2a78d6"/><rect x="268" y="277" width="28" height="13" fill="#2a78d6"/><rect x="336" y="264" width="28" height="26" fill="#2a78d6"/><rect x="370" y="212" width="28" height="78" fill="#2a78d6"/><rect x="404" y="212" width="28" height="78" fill="#2a78d6"/><rect x="438" y="199" width="28" height="91" fill="#2a78d6"/><rect x="472" y="186" width="28" height="104" fill="#2a78d6"/><rect x="506" y="160" width="28" height="130" fill="#2a78d6"/><rect x="540" y="160" width="28" height="130" fill="#2a78d6"/><rect x="574" y="121" width="28" height="169" fill="#2a78d6"/><rect x="608" y="82" width="28" height="208" fill="#2a78d6"/><rect x="642" y="69" width="28" height="221" fill="#2a78d6"/><rect x="676" y="108" width="28" height="182" fill="#2a78d6"/><rect x="710" y="108" width="28" height="182" fill="#2a78d6"/><rect x="744" y="69" width="28" height="221" fill="#2a78d6"/><rect x="778" y="160" width="28" height="130" fill="#2a78d6"/><rect x="812" y="199" width="28" height="91" fill="#2a78d6"/><rect x="846" y="95" width="28" height="195" fill="#2a78d6"/><rect x="880" y="225" width="28" height="65" fill="#2a78d6"/><rect x="914" y="199" width="28" height="91" fill="#2a78d6"/><rect x="948" y="225" width="28" height="65" fill="#2a78d6"/><rect x="982" y="251" width="28" height="39" fill="#2a78d6"/><rect x="1016" y="277" width="28" height="13" fill="#2a78d6"/><rect x="1050" y="251" width="28" height="39" fill="#eb6834"/><line x1="690" y1="40" x2="690" y2="290" stroke="#059669" stroke-width="4" stroke-dasharray="10 8"/><g fill="#1f2937" font-size="22"><text x="350" y="322" text-anchor="middle">40%</text><text x="520" y="322" text-anchor="middle">45%</text><text x="690" y="322" text-anchor="middle">50%</text><text x="860" y="322" text-anchor="middle">55%</text><text x="1030" y="322" text-anchor="middle">60%</text><text x="1130" y="70" fill="#2a78d6">cột xanh: số bộ</text><text x="1130" y="100" fill="#2a78d6">đạt mỗi mức điểm</text><text x="1130" y="150" fill="#059669">vạch lục: điểm thật 50%</text><text x="1130" y="200" fill="#eb6834">cột cam: cao nhất 61%,</text><text x="1130" y="230" fill="#eb6834">cái được chọn</text><text x="1130" y="280" font-size="20">200 bộ, cùng 100 mẫu</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đếm điểm kiểm định của 200 bộ đoán bừa trên cùng 100 mẫu. Các cột xanh tụ quanh vạch lục 50 phần trăm, là điểm thật của mọi bộ, và rải từ 36 tới 61 phần trăm chỉ vì may rủi. Quy trình chọn mô hình chỉ nhìn cột cam ở mép phải, cao nhất 61 phần trăm. Cái được chọn luôn nằm ở đuôi may mắn của phân bố, không phải ở giữa."

  - id: example
    kind: example
    title: "Chọn cái tốt nhất trong 200 bộ đoán bừa"
    checks:
      - "alg.best_of_random(200, 100, 0) == 0.61 and alg.best_of_random(200, 1000, 0) == 0.546"
      - "(61 - 50) / 5 == 2.2 and round(math.sqrt(0.25 / 1000) * 100, 2) == 1.58 and math.sqrt(0.25 / 100) * 100 == 5"
    steps:
      - show: |
          <p>200 “mô hình”, mỗi cái đoán bừa (đúng 50%), chấm trên <b>cùng</b> một tập kiểm định.</p>
          <p><b>Bước 1</b> — một bộ, 100 mẫu: điểm quanh 50%, độ lệch chuẩn $\sqrt{\frac{0{,}5 \cdot 0{,}5}{100}} = 5$ điểm.</p>
        focus: [1, 2, 2]
        say: "Có 200 mô hình, mỗi cái đoán bừa, đúng 50 phần trăm, cùng chấm trên một tập kiểm định. Bước một, xét một bộ trên 100 mẫu. Điểm của nó dao động quanh 50 phần trăm, với độ lệch chuẩn 5 điểm, như phần ôn."
      - show: |
          <table class="t"><tr><th>cỡ tập kiểm định</th><th>độ lệch chuẩn của một bộ</th><th>điểm cao nhất được chọn</th><th>điểm thật</th></tr>
          <tr><td>100 mẫu</td><td>5 điểm</td><td>$\hl{61\%} = 50\% + 2{,}2 \cdot 5$ điểm</td><td>50%</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Bước hai, chọn bộ cao nhất trong 200 bộ. Với 100 mẫu, điểm được chọn là 61 phần trăm trong khi điểm thật chỉ 50. Con số 61 cao hơn 50 tới 11 điểm, tức 2 phẩy 2 lần độ lệch chuẩn, một mức mà một bộ lẻ hiếm khi đạt, nhưng 200 bộ thì gần như chắc có."
      - show: |
          <table class="t"><tr><th>cỡ tập kiểm định</th><th>độ lệch chuẩn của một bộ</th><th>điểm cao nhất được chọn</th><th>điểm thật</th></tr>
          <tr><td>100 mẫu</td><td>5 điểm</td><td>61%</td><td>50%</td></tr>
          <tr><td>1000 mẫu</td><td>1,58 điểm</td><td>$\hl{54{,}6\%}$</td><td>50%</td></tr></table>
        focus: [1, "1.3", "1.3"]
        say: "Bước ba, tăng tập kiểm định lên 1000 mẫu. Độ lệch chuẩn của một bộ chỉ còn 1 phẩy 58 điểm, nên điểm được chọn hạ xuống 54 phẩy 6 phần trăm. Với 1000 mẫu, điểm được chọn là 54 phẩy 6 phần trăm, vẫn cao hơn thật."
      - clear: true
        show: |
          <p><b>Bước 4</b> — kết luận.</p>
          <div class="box key">Chọn cái lớn nhất trong nhiều con số ngẫu nhiên thì gần như chắc chắn được một con số <b>lớn hơn thật</b>. Tập càng nhỏ, thử càng nhiều, càng lệch — giống kiểm định nhiều lần ở DSC.</div>
        focus: [1, 2, 2]
        say: "Bước bốn, rút ra kết luận. Chọn cái lớn nhất trong nhiều con số ngẫu nhiên thì gần như chắc chắn được một con số lớn hơn thật. Tập càng nhỏ và thử càng nhiều thì càng lệch, giống kiểm định nhiều lần ở khoá Khoa học dữ liệu."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(sum(math.comb(100, k) for k in range(61, 101)) / 2 ** 100, 4) == 0.0176"
      - "round(1 - (1 - sum(math.comb(100, k) for k in range(61, 101)) / 2 ** 100) ** 200, 2) == 0.97 and round(1 - (1 - 0.0176) ** 200, 2) == 0.97"
    steps:
      - show: |
          <p>Không mô phỏng, tính thẳng bằng đếm tổ hợp: một bộ đoán bừa đạt từ 61 trên 100 câu trở lên với khả năng $q \approx 0{,}0176$ — chưa tới 2%.</p>
          $$1 - (1 - 0{,}0176)^{200} \approx \hl{0{,}97}$$
          <p>Với 200 bộ, gần như chắc chắn (97%) có ít nhất một bộ đạt 61% trở lên ✓ — con số 61% không phải tình cờ hiếm.</p>
        focus: [1, 1, 2, 3]
        say: "Kiểm bằng đường khác, không mô phỏng mà tính thẳng bằng cách đếm tổ hợp. Một bộ đoán bừa đạt từ 61 câu đúng trên 100 trở lên với khả năng chỉ khoảng 0 phẩy 0176, chưa tới 2 phần trăm. Nhưng theo công thức ít nhất một lần, với 200 bộ, khả năng có ít nhất một bộ đạt 61 phần trăm trở lên là khoảng 97 phần trăm. Vậy con số 61 mà máy mô phỏng ra không phải tình cờ hiếm, mà là điều gần như chắc chắn xảy ra."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "[round(math.sqrt(0.8 * 0.2 / n) * 100, 1) for n in (500, 2000, 10000)] == [1.8, 0.9, 0.4] and 1 / 0.4 == 2.5"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Báo điểm kiểm định của cấu hình được chọn làm điểm cuối <b class="red">(lạc quan giả)</b>
          <br><span class="note">Điểm đó đã được dùng để chọn nên bị kéo lên. Báo điểm trên tập kiểm tra chưa từng chạm vào.</span></div>
        say: "Lỗi thứ nhất, báo điểm kiểm định của cấu hình được chọn làm điểm cuối cùng. Điểm đó đã được dùng để chọn nên bị kéo lên, hãy báo điểm trên tập kiểm tra chưa từng chạm vào."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Xem tập kiểm tra “chỉ một chút” rồi chỉnh tiếp <b class="red">(tập kiểm tra thành tập kiểm định)</b>
          <br><span class="note">Mỗi lần nhìn điểm kiểm tra rồi quay lại sửa là thêm một lần chọn. Muốn chỉnh tiếp thì phải có tập kiểm tra mới.</span></div>
        say: "Lỗi thứ hai, xem tập kiểm tra một chút rồi chỉnh tiếp. Mỗi lần nhìn điểm kiểm tra rồi quay lại sửa là thêm một lần chọn, nên muốn chỉnh tiếp thì phải có tập kiểm tra mới."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ ghi lại lần chạy tốt nhất <b class="red">(mất bối cảnh)</b>
          <br><span class="note">Không biết đã thử bao nhiêu cấu hình thì không biết điểm “tốt nhất” bị thổi phồng bao nhiêu. Ghi mọi lần chạy.</span></div>
        say: "Lỗi thứ ba, chỉ ghi lại lần chạy tốt nhất. Không biết đã thử bao nhiêu cấu hình thì không biết điểm tốt nhất bị thổi phồng bao nhiêu, nên hãy ghi lại mọi lần chạy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Báo “mô hình mới hơn 1 điểm” trên tập kiểm định 500 mẫu <b class="red">(chênh nằm trong nhiễu)</b></div>
          <table class="t"><tr><th>cỡ tập (độ chính xác quanh 80%)</th><th>độ lệch chuẩn của điểm</th><th>chênh 1 điểm là</th></tr>
          <tr><td>500 mẫu</td><td>1,8 điểm</td><td class="red">nhỏ hơn nhiễu</td></tr>
          <tr><td>2000 mẫu</td><td>0,9 điểm</td><td>ngang nhiễu</td></tr>
          <tr><td>10 000 mẫu</td><td>0,4 điểm</td><td>gấp 2,5 lần nhiễu</td></tr></table>
          <p class="note">Người làm nghề tính độ lệch chuẩn $\sqrt{\frac{0{,}8 \cdot 0{,}2}{n}}$ <b>trước</b> khi tin một mức cải thiện, và so hai mô hình trên cùng từng mẫu.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, báo rằng mô hình mới hơn 1 điểm trên tập kiểm định 500 mẫu, trong khi chênh lệch đó nằm trong nhiễu. Bảng tính độ lệch chuẩn của điểm khi độ chính xác quanh 80 phần trăm. Với 500 mẫu, độ lệch chuẩn là 1 phẩy 8 điểm, nên chênh 1 điểm còn nhỏ hơn nhiễu. Với 2000 mẫu, độ lệch chuẩn 0 phẩy 9 điểm, chênh 1 điểm chỉ ngang nhiễu. Với 10 nghìn mẫu, độ lệch chuẩn 0 phẩy 4 điểm, chênh 1 điểm mới gấp 2 phẩy 5 lần nhiễu. Người làm nghề tính độ lệch chuẩn này trước khi tin một mức cải thiện, và so hai mô hình trên cùng từng mẫu."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.best_of_random(20, 100, 0) == 0.59"
      - "(59 - 50, 61 - 50) == (9, 11) and (9 / 5, 11 / 5) == (1.8, 2.2)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Chỉ thử 20 bộ đoán bừa trên tập 100 mẫu, điểm cao nhất là 59%. So với 200 bộ (61%), nhận xét gì?</td></tr>
          <tr><td>2</td><td>Đồng nghiệp báo: “thử 500 cấu hình, cái tốt nhất được 0,83 trên tập kiểm định”. Bạn hỏi thêm gì?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, chỉ thử 20 bộ đoán bừa trên tập 100 mẫu, điểm cao nhất là 59 phần trăm. So với 200 bộ được 61 phần trăm, bạn nhận xét gì? Câu hai, đồng nghiệp báo thử 500 cấu hình, cái tốt nhất được 0 phẩy 83 trên tập kiểm định. Bạn hỏi thêm gì? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>số bộ thử</th><th>điểm cao nhất</th><th>cao hơn 50% bao nhiêu</th><th>tính theo độ lệch chuẩn 5 điểm</th></tr>
          <tr><td>20</td><td>59%</td><td>9 điểm</td><td>1,8 lần</td></tr>
          <tr><td>200</td><td>61%</td><td>11 điểm</td><td>2,2 lần</td></tr></table>
          <p>① Thử ít hơn thì độ lệch nhỏ hơn (59% so với 61%), nhưng vẫn cao hơn điểm thật 50%.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu một, làm từng bước. Với 20 bộ, điểm cao nhất 59 phần trăm, cao hơn 50 là 9 điểm, tức 1 phẩy 8 lần độ lệch chuẩn. Với 200 bộ, cao hơn 11 điểm, tức 2 phẩy 2 lần. Vậy thử ít hơn thì độ lệch nhỏ hơn, 59 so với 61, nhưng vẫn cao hơn điểm thật 50."
      - show: |
          <p>② Điểm trên <b>tập kiểm tra riêng</b> là bao nhiêu? Tập kiểm định có bao nhiêu mẫu? Các cấu hình khác được bao nhiêu?</p>
          <p class="note">Vì sao: 500 lần chọn kéo điểm lên càng nhiều; tập nhỏ thì nhiễu lớn; điểm các cấu hình khác cho biết 0,83 nổi bật thật hay chỉ là đuôi may mắn.</p>
        focus: [1, 2]
        say: "Câu hai, hãy hỏi điểm trên tập kiểm tra riêng là bao nhiêu, tập kiểm định có bao nhiêu mẫu, và các cấu hình khác được bao nhiêu. Vì 500 lần chọn kéo điểm lên càng nhiều, tập nhỏ thì nhiễu lớn, còn điểm các cấu hình khác cho biết 0 phẩy 83 nổi bật thật hay chỉ là đuôi may mắn."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
