          <div class="chain"><span class="n">ghi mọi lần chạy</span><span class="a">→</span>
          <span class="n">chọn trên kiểm định: điểm bị kéo lên</span><span class="a">→</span>
          <span class="n">báo điểm trên tập kiểm tra, một lần</span><span class="a">→</span>
          <span class="n">chỉnh tiếp thì cần tập kiểm tra mới</span></div>
        say: "Tổng kết lại, ghi lại mọi lần chạy. Chọn trên tập kiểm định thì điểm bị kéo lên, nên chỉ báo điểm trên tập kiểm tra, xem một lần, và muốn chỉnh tiếp thì cần tập kiểm tra mới."
      - show: |
