        focus: [1, 1, 1, 1]
        say: "Hình vẽ hai tệp, mỗi ô là một byte, ô xám là dấu xuống dòng. Tệp A và tệp B dài 20 byte và chỉ khác nhau đúng một byte, ô viền đỏ, nơi nhãn 1 đổi thành 0. Nhưng mã băm của hai tệp, viết ở dưới mỗi tệp, khác nhau ở 11 trên 12 ký tự. Tên tệp không nằm trong dãy ô, nên đổi tên không làm đổi mã."

  - id: example
    kind: example
    title: "Đổi một nhãn, đổi cả mã băm"
    checks:
      - "alg.data_hash(b'id,nhan\\n1,0\\n2,1\\n3,1\\n') == '2e4f5668f65e' and alg.data_hash(b'id,nhan\\n1,0\\n2,0\\n3,1\\n') == '6def19a1c342'"
      - "sum(x != y for x, y in zip('2e4f5668f65e', '6def19a1c342')) == 11"
      - "len(b'id,nhan\\n1,0\\n2,1\\n3,1\\n') == 20"
    steps:
      - show: |
          <table class="t"><tr><th>tệp</th><th>nội dung (id, nhãn)</th><th>mã băm</th></tr>
          <tr><td>A</td><td>(1, 0); (2, <b>1</b>); (3, 1)</td><td><code>2e4f5668f65e</code></td></tr></table>
          <p><b>Bước 1</b> — đưa đủ 20 byte của tệp A vào hàm băm, lấy 12 ký tự đầu.</p>
        focus: [1, 2]
        say: "Bảng so các tệp dữ liệu nhỏ. Bước một, tệp A có ba dòng, mẫu thứ hai mang nhãn 1, ta đưa đủ 20 byte của nó vào hàm băm và lấy 12 ký tự đầu."
      - show: |
          <table class="t"><tr><th>tệp</th><th>nội dung (id, nhãn)</th><th>mã băm</th></tr>
          <tr><td>A</td><td>(1, 0); (2, <b>1</b>); (3, 1)</td><td><code>2e4f5668f65e</code></td></tr>
          <tr><td>B (sửa 1 nhãn)</td><td>(1, 0); (2, <b class="red">0</b>); (3, 1)</td><td><code>6def19a1c342</code></td></tr></table>
          <p><b>Bước 2</b> — sửa nhãn của mẫu thứ hai: đúng một byte đổi, từ 49 thành 48.</p>
        focus: ["1.3", 2]
        say: "Bước hai, tệp B chỉ sửa nhãn của mẫu thứ hai thành 0, mã băm khác hẳn. Thực ra chỉ đúng một byte đổi, từ 49 thành 48."
      - clear: true
        show: |
          <table class="t"><tr><th>vị trí</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th></tr>
          <tr><td>A</td><td>2</td><td>e</td><td>4</td><td>f</td><td>5</td><td>6</td><td>6</td><td>8</td><td>f</td><td>6</td><td>5</td><td>e</td></tr>
          <tr><td>B</td><td class="red">6</td><td class="red">d</td><td class="red">e</td><td>f</td><td class="red">1</td><td class="red">9</td><td class="red">a</td><td class="red">1</td><td class="red">c</td><td class="red">3</td><td class="red">4</td><td class="red">2</td></tr></table>
          <p><b>Bước 3</b> — chỉ vị trí 4 trùng (chữ f): $\hl{11}$ trên 12 ký tự đổi.</p>
        focus: [1, 2]
        say: "Bước ba, đặt hai mã băm cạnh nhau, từng vị trí một. Chỉ vị trí thứ tư trùng nhau, cùng là chữ f, nên sửa đúng một nhãn làm 11 trên 12 ký tự đầu của mã băm thay đổi."
      - clear: true
        show: |
          <table class="t"><tr><th>tệp</th><th>nội dung (id, nhãn)</th><th>mã băm</th></tr>
          <tr><td>A</td><td>(1, 0); (2, <b>1</b>); (3, 1)</td><td><code>2e4f5668f65e</code></td></tr>
          <tr><td>A đổi tên thành <code>moi.csv</code></td><td>y nguyên A</td><td><code>2e4f5668f65e</code></td></tr></table>
          <p><b>Bước 4</b> — đổi tên tệp: mã băm không đổi — vì nội dung không đổi.</p>
        focus: ["1.3", 2]
        say: "Bước bốn, tệp A đổi tên nhưng giữ y nguyên nội dung thì mã băm vẫn như A. Đổi tên tệp thì mã băm không đổi, vì nội dung không đổi."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "sum(x == y for x, y in zip('2e4f5668f65e', '6def19a1c342')) == 1 and 12 / 16 == 0.75 and 12 - 0.75 == 11.25"
      - "__import__('hashlib').sha256(b'id,nhan\\n1,0\\n2,1\\n3,1\\n').hexdigest()[:12] == '2e4f5668f65e' and len(b'id,nhan\\r\\n1,0\\r\\n2,1\\r\\n3,1\\r\\n') == 24"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>11 ký tự khác</td><td>nếu hai mã như rút ngẫu nhiên, mỗi vị trí trùng với khả năng $\frac{1}{16}$: trung bình trùng $\frac{12}{16} = 0{,}75$ vị trí</td><td>khác ≈ 11,25 ký tự — khớp 11 ✓</td></tr>
          <tr><td>mã băm của A</td><td>băm lại bằng một công cụ khác trên chính 20 byte đó</td><td>vẫn <code>2e4f5668f65e</code> ✓</td></tr>
          <tr><td>xuống dòng kiểu khác</td><td>thêm 1 byte trước mỗi dấu xuống dòng: $20 + 4 = 24$ byte</td><td>mã khác ✓</td></tr></table>
        introduces: [frac]
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác. Một hàm băm tốt làm hai mã trông như rút ngẫu nhiên, nên mỗi vị trí chỉ trùng với khả năng 1 phần 16. Trung bình, 12 vị trí trùng 0 phẩy 75 vị trí, tức khác khoảng 11 phẩy 25 ký tự, khớp với 11 ta đếm được. Băm lại 20 byte của A bằng một công cụ khác vẫn ra đúng mã cũ. Còn nếu lưu với kiểu xuống dòng khác, mỗi dòng thêm 1 byte, tệp thành 24 byte, và mã băm khác."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "100 * 50 == 5000 and 10 * 5 == 50 and round(5 + 9 * 0.05, 2) == 5.45 and round(50 / 5.45) == 9"
      - "alg.data_hash(b'id,nhan\\r\\n1,0\\r\\n2,1\\r\\n3,1\\r\\n') != alg.data_hash(b'id,nhan\\n1,0\\n2,1\\n3,1\\n')"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Phiên bản hoá bằng tên tệp <b class="red">(không đáng tin)</b>
          <br><span class="note">Tên không bắt buộc đổi khi nội dung đổi. Chỉ mã băm nội dung mới nói chắc hai tệp có giống nhau không.</span></div>
        say: "Lỗi thứ nhất, phiên bản hoá bằng tên tệp. Tên không bắt buộc đổi khi nội dung đổi, chỉ mã băm nội dung mới nói chắc hai tệp có giống nhau không."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ngạc nhiên khi “cùng dữ liệu” mà khác mã băm <b class="red">(khác byte)</b>
          <br><span class="note">Mở rồi lưu lại bằng trình soạn thảo khác có thể đổi kiểu xuống dòng hay mã hoá ký tự (quy tắc đổi chữ thành byte: chữ “ã” có thể thành 1 hay 2 byte tuỳ quy tắc): cùng bảng số nhưng khác byte → khác mã băm. Chuẩn hoá cách ghi tệp trong đường ống.</span></div>
        say: "Lỗi thứ hai, ngạc nhiên khi cùng dữ liệu mà khác mã băm. Mở rồi lưu lại bằng trình soạn thảo khác có thể đổi kiểu xuống dòng hay mã hoá ký tự, cùng bảng số nhưng khác byte nên khác mã băm. Mã hoá ký tự là quy tắc đổi chữ thành byte, chữ ã có thể thành 1 hay 2 byte tuỳ quy tắc. Hãy chuẩn hoá cách ghi tệp trong đường ống."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lưu dữ liệu lớn thẳng vào kho mã <b class="red">(kho phình)</b>
          <br><span class="note">Kho mã (nơi lưu mọi phiên bản của mã) giữ mọi phiên bản mãi mãi: tệp 5 GB có 10 phiên bản có thể chiếm tới 50 GB (tệp dữ liệu lớn thường nén kém). Lưu dữ liệu ở <b>kho đối tượng</b> (dịch vụ lưu tệp lớn, rẻ); kho mã chỉ giữ <b>mã băm</b> và đường dẫn.</span></div>
        say: "Lỗi thứ ba, lưu dữ liệu lớn thẳng vào kho mã, nơi lưu mọi phiên bản của mã. Kho mã giữ mọi phiên bản mãi mãi, một tệp 5 GB có 10 phiên bản có thể chiếm tới 50 GB, vì tệp dữ liệu lớn thường nén kém. Hãy lưu dữ liệu ở kho đối tượng, một dịch vụ lưu tệp lớn giá rẻ, còn kho mã chỉ giữ mã băm và đường dẫn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Ở kho đối tượng vẫn chép <b>nguyên bộ</b> dữ liệu cho mỗi phiên bản <b class="red">(tốn gấp 9 lần)</b></div>
          <table class="t"><tr><th>bộ 5 GB = 100 tệp × 50 MB; mỗi phiên bản sửa 1 tệp</th><th>10 phiên bản tốn</th></tr>
          <tr><td>chép nguyên bộ mỗi lần</td><td class="red">$10 \cdot 5 = 50$ GB</td></tr>
          <tr><td>lưu theo mã băm từng tệp (tệp trùng mã chỉ lưu một lần)</td><td>$5 + 9 \cdot 0{,}05 = 5{,}45$ GB</td></tr></table>
          <p class="note">Mã băm nội dung cho phép <b>khử trùng lặp</b>: tệp nào không đổi thì có cùng mã, chỉ cần lưu một lần.</p>
        focus: [1, 2, "2.2", "2.3", 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đã dùng kho đối tượng nhưng vẫn chép nguyên bộ dữ liệu cho mỗi phiên bản. Giả sử bộ dữ liệu 5 GB gồm 100 tệp, mỗi tệp 50 MB, và mỗi phiên bản chỉ sửa 1 tệp. Chép nguyên bộ thì 10 phiên bản tốn 10 nhân 5, bằng 50 GB. Lưu theo mã băm từng tệp thì chỉ tốn 5 GB ban đầu cộng 9 tệp sửa, mỗi tệp 0 phẩy 05 GB, tổng 5 phẩy 45 GB, ít hơn khoảng 9 lần. Mã băm nội dung cho phép khử trùng lặp, tệp nào không đổi thì có cùng mã, chỉ cần lưu một lần."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[alg.data_hash(b'id,nhan\\n1,0\\n2,1\\n3,1\\n') for _ in range(2)] == ['2e4f5668f65e'] * 2"
      - "2 ** 48 == 281474976710656 and round(2 ** 48 / 1e14, 1) == 2.8"
      - "round(math.comb(10 ** 6, 2) / 1e11, 1) == 5.0 and round(math.comb(10 ** 6, 2) / 2 ** 48 * 100, 2) == 0.18"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hai đồng nghiệp mỗi người giữ một tệp tên khác nhau, nhưng mã băm đều là <code>2e4f5668f65e</code>. Hai tệp có cùng dữ liệu không?</td></tr>
          <tr><td>2</td><td>Mô hình đang chạy cho kết quả lạ. Dòng dõi cần ghi những gì để bạn dựng lại đúng mô hình đó?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hai đồng nghiệp mỗi người giữ một tệp tên khác nhau, nhưng mã băm đều giống nhau. Hai tệp có cùng dữ liệu không? Câu hai, mô hình đang chạy cho kết quả lạ. Dòng dõi cần ghi những gì để bạn dựng lại đúng mô hình đó? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Tên không nằm trong byte nội dung, nên tên khác không nói gì.</p>
          <p>Cùng mã băm → cùng nội dung: <b>có</b> (thực tế chắc chắn). Hai tệp khác nhau mà trùng mã 48 bit chỉ có khả năng cỡ 1 trên $2^{48} \approx 2{,}8 \cdot 10^{14}$ — đó là cho <b>một cặp</b> tệp. Kho 1 triệu tệp có khoảng $5 \cdot 10^{11}$ cặp, nên khả năng có một cặp trùng 48 bit lên khoảng 0,18% — vì vậy hệ thật giữ đủ 256 bit.</p>
        introduces: [power]
        focus: [0, 1, 2, 2, 2, 2]
        say: "Đáp án câu một, làm từng bước. Tên tệp không nằm trong byte nội dung, nên tên khác nhau không nói lên điều gì. Có, trên thực tế là chắc chắn, vì cùng mã băm nghĩa là cùng nội dung, tên không quan trọng. Hai tệp khác nhau mà trùng mã 48 bit chỉ có khả năng cỡ 1 trên 2 mũ 48, tức khoảng 2 phẩy 8 nhân 10 mũ 14. Đó là cho một cặp tệp. Kho 1 triệu tệp có khoảng 5 nhân 10 mũ 11 cặp, nên khả năng có một cặp trùng 48 bit lên khoảng 0 phẩy 18 phần trăm, vì vậy hệ thật giữ đủ 256 bit."
      - show: |
          <table class="t"><tr><th>dòng dõi ghi</th><th>để dựng lại</th></tr>
          <tr><td>mã băm dữ liệu huấn luyện và kiểm tra</td><td>đúng dữ liệu</td></tr>
          <tr><td>mã băm lần ghi mã</td><td>đúng mã</td></tr>
          <tr><td>hạt giống, môi trường, siêu tham số</td><td>đúng cách chạy</td></tr></table>
        focus: [1, 1]
        say: "Câu hai, dòng dõi phải đủ để dựng lại cả dữ liệu, mã, lẫn cách chạy. Cần mã băm của dữ liệu huấn luyện và kiểm tra, mã băm lần ghi mã, hạt giống, môi trường, và các siêu tham số."

