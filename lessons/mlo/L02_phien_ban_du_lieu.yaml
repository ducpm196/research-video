source: "curriculum/mlo.yaml L02; audit/mlo/verify_mlo.py L02; FIPS 180-4 (SHA-256); W3C PROV-DM (2013) (mô hình dòng dõi: thực thể, hoạt động, tác nhân); DVC docs, Data versioning (dvc.org, đọc 2026-10-28); DBS bài 0"
assumes: [arith]
# Quy ước: tệp dữ liệu CSV nhỏ 3 dòng (id, nhan); alg.data_hash = 12 ký tự đầu SHA-256 của NỘI DUNG byte. Dòng dõi = bản ghi
#   (mô hình ← mã băm dữ liệu, mã băm lần ghi mã, hạt giống, môi trường).
objectives:
  - "Nhận diện phiên bản dữ liệu bằng mã băm nội dung"
  - "Truy ngược mô hình về dữ liệu và mã đã dùng"
  - "Phân biệt tên tệp với phiên bản"
asr_reviewed:
  - {sentence: "Mã hoá ký tự là quy tắc đổi chữ thành byte, chữ ã có thể thành 1 hay 2 byte tuỳ quy tắc.", reason: "ASR chép “Mã hóa ký tự là quy tắc đổi chữ thành bay, chữ à có thể thành 1 hay 2 bay tuy quy tắc.” (0.826): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: ã/à, tuỳ (trong “byte tuỳ” → “bay tuy”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Kho mã giữ mọi phiên bản mãi mãi, một tệp 5 GB có 10 phiên bản có thể chiếm tới 50 GB, vì tệp dữ liệu lớn thường nén kém.", reason: "ASR chép “Khó mã giữ mọi phiên bản mãi mãi, một tệp 5GB có 10 phiên bản có thể chiếm tới 50GB vì tệp dữ liệu lớn thường nán kém.” (0.935): lệch âm/thanh thuần Việt: kho/khó, nén/nán — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàm băm là một quy tắc cố định biến mọi dãy byte thành 256 bit, tức 64 ký tự mười sáu, và bài này chỉ hiện 12 ký tự đầu cho gọn.", reason: "ASR chép “Hàm Bâm là một quy tắc cố định biến mọi dãy bay thành 256 bit, tức 64 ký tự 16, và bài này chỉ hiện 12 ký tự đầu cho gọn.” (0.949): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: băm/bâm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Trước hết ta ôn một điều về tệp.", reason: "ASR chép “Trước hết ta ôm một điều về tệ.” (0.75): lệch âm/thanh thuần Việt: ôn/ôm, tệp/tệ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Một tệp dữ liệu chỉ là một dãy byte, mỗi ký tự thường là 1 byte, mang một con số.", reason: "ASR chép “Một tệp dữ liệu chỉ là một giải bay, mỗi ký từ thường là một bay, mang một con số.” (0.8): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: dãy (trong “dãy byte” → “giải bay”), tự/từ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tệp A và tệp B dài 20 byte và chỉ khác nhau đúng một byte, ô viền đỏ, nơi nhãn 1 đổi thành 0.", reason: "ASR chép “Tẹp A và tẹp B dài hai mươi bay và chỉ khác nhau đúng một bay, ồ viền đỏ, nơi nhãn một đổi thành không.” (0.8): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: tệp/tẹp, tệp/tẹp — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tên tệp không nằm trong byte nội dung, nên tên khác nhau không nói lên điều gì.", reason: "ASR chép “Tên Tật không nằm trong bài nội dung, nền tên khác nhau không nói lên điều gì.” (0.824): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: tệp/tật, nên/nền — NOT_VERIFIED bằng tai người"}
  - {sentence: "Thực ra chỉ đúng một byte đổi, từ 49 thành 48.", reason: "ASR chép “Thực tra chỉ đúng một bay đổi từ 49 thành 48.” (0.867): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: ra/tra — NOT_VERIFIED bằng tai người"}
  - {sentence: "Còn nếu lưu với kiểu xuống dòng khác, mỗi dòng thêm 1 byte, tệp thành 24 byte, và mã băm khác.", reason: "ASR chép “Còn nếu lưu với kiểu xuống dòng khác, mỗi dòng thêm một bay, tẹp thành 24 bay và mã băm khác.” (0.87): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: tệp (trong “byte tệp” → “bay tẹp”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Băm lại 20 byte của A bằng một công cụ khác vẫn ra đúng mã cũ.", reason: "ASR chép “Băm lại 20 bai của A bằng một công cụ khác vẫn ra đúng mạ cũ.” (0.882): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: mã/mạ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lưu theo mã băm từng tệp thì chỉ tốn 5 GB ban đầu cộng 9 tệp sửa, mỗi tệp 0 phẩy 05 GB, tổng 5 phẩy 45 GB, ít hơn khoảng 9 lần.", reason: "ASR chép “Lưu theo mả 3 từng tệp thì chỉ tốn 5GB ban đầu cộng 9 tệp sửa, mỗi tệp không phải 0.5GB, tổng 5.45GB, ít hơn khoảng 9 lần.” (0.886): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; lệch âm/thanh thuần Việt: mã băm/mả ba — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chữ số 1 là byte 49, dấu phẩy là 44, chữ số 0 là 48, và dấu xuống dòng là byte 10.", reason: "ASR chép “Chữ số 1 là bai 49, giấu phải là 44, chữ số 0 là 48 và giấu xuống dòng là bai 10.” (0.893): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước một, tệp A có ba dòng, mẫu thứ hai mang nhãn 1, ta đưa đủ 20 byte của nó vào hàm băm và lấy 12 ký tự đầu.", reason: "ASR chép “Bước một, tạp A có ba dòng, mẫu thứ hai mang nhãn một. Ta đưa đủ hai mi bay của nó vào hàm băm và lấy mười hai ký tự đầu.” (0.903): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: tệp/tạp, mươi (trong “mươi byte” → “mi bay”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hình vẽ hai tệp, mỗi ô là một byte, ô xám là dấu xuống dòng.", reason: "ASR chép “Hình vẽ 2 tệp, mỗi ô là một bay, ô xám là giấu xuống dòng.” (0.933): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mã băm nội dung được tính từ từng byte của tệp, cùng nội dung thì cùng mã, đổi một byte thì mã khác hẳn, và tên tệp không ảnh hưởng.", reason: "ASR chép “Mả băm nội dung được tính từ từng bay của tệp, cùng nội dung thì cùng mả, đổi một bay thì mả khác hẳn và tên tệp không ảnh hưởng.” (0.833): byte đọc thô, ASR viết “bay” (probe CSA p1 8/8); lệch âm/thanh thuần Việt: mã/mả, mã/mả, mã/mả — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mở rồi lưu lại bằng trình soạn thảo khác có thể đổi kiểu xuống dòng hay mã hoá ký tự, cùng bảng số nhưng khác byte nên khác mã băm.", reason: "ASR chép “Mở rồi lưu lại bằng trình soạn thảo khác có thể đổi kiểu xuống dòng hay mã hóa ký tự, cùng bản số nhưng khác bai nên khác mã băm.” (0.933): byte đọc thô, ASR viết “bay” (probe CSA p1 8/8); lệch âm/thanh thuần Việt: bảng/bản — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tệp “cuối cùng bản 2 mới thật”"
    steps:
      - show: |
          <p>Thư mục dự án có <code>data.csv</code>, <code>data_final.csv</code>, <code>data_final_v2.csv</code>, <code>data_final_v2_moi_that.csv</code>. Mô hình đang chạy được huấn luyện từ tệp nào? Không ai chắc. Và ai đó đã sửa tay vài nhãn trong một tệp mà không đổi tên.</p>
          <div class="box key">Hôm nay: <b>phiên bản hoá dữ liệu</b> bằng nội dung, và <b>dòng dõi</b> — truy từ mô hình về đúng dữ liệu đã tạo ra nó.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, thư mục dự án có bốn tệp dữ liệu với tên kiểu cuối cùng, cuối cùng bản hai, cuối cùng bản hai mới thật. Mô hình đang chạy được huấn luyện từ tệp nào? Không ai chắc. Và ai đó đã sửa tay vài nhãn trong một tệp mà không đổi tên. Hôm nay ta học phiên bản hoá dữ liệu bằng nội dung, và dòng dõi, truy từ mô hình về đúng dữ liệu đã tạo ra nó."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tệp là dãy byte, và hệ mười sáu"
    checks:
      - "list(b'1,0') == [49, 44, 48] and ord('\\n') == 10 and len(b'id,nhan\\n1,0\\n2,1\\n3,1\\n') == 20 and len(b'1,0\\n') == 4"
      - "int('2e', 16) == 2 * 16 + 14 == 46 and int('f', 16) == 15 and 12 * 4 == 48 and 2 * 2 * 2 * 2 == 16 == int('10', 16)"
    steps:
      - show: |
          <p>Một tệp CSV (tệp bảng, các ô cách nhau bằng dấu phẩy) chỉ là một <b>dãy byte</b>; mỗi byte là một ô nhớ mang một số từ 0 tới 255, mỗi ký tự thường là 1 byte:</p>
          <table class="t"><tr><th>ký tự</th><th>1</th><th>,</th><th>0</th><th>xuống dòng</th></tr>
          <tr><td>byte</td><td>49</td><td>44</td><td>48</td><td>10</td></tr></table>
          <p>Một dòng như “1,0” cùng dấu xuống dòng là 4 byte; cả tệp nhỏ của bài là 20 byte.</p>
        focus: [1, 2, 2, 3]
        say: "Trước hết ta ôn một điều về tệp. Một tệp dữ liệu chỉ là một dãy byte, mỗi ký tự thường là 1 byte, mang một con số. Chữ số 1 là byte 49, dấu phẩy là 44, chữ số 0 là 48, và dấu xuống dòng là byte 10. Vậy một dòng như 1 phẩy 0, cùng dấu xuống dòng, là 4 byte, và cả tệp nhỏ của bài này là 20 byte."
      - show: |
          <p><b>Hệ mười sáu</b>: viết số bằng 16 chữ số thay vì 10 — 0–9 rồi a, b, c, d, e, f (a = 10, …, f = 15). Mỗi vị trí đáng giá gấp 16 lần vị trí bên phải nó, như hệ mười thì gấp 10.</p>
          $$2\text{e} = 2 \cdot 16 + 14 = 46$$
          <p>Một <b>bit</b> là một chữ số chỉ 0 hoặc 1. 4 bit có $2 \cdot 2 \cdot 2 \cdot 2 = 16$ cách viết, vừa đủ cho 16 chữ số, nên mỗi chữ số mười sáu mang 4 bit; 12 ký tự mang $12 \cdot 4 = 48$ bit.</p>
        introduces: [cdot]
        focus: [1, 1, 2, 3, 3]
        say: "Tiếp theo, ta cần hiểu hệ mười sáu, là cách viết số bằng 16 chữ số thay vì 10, từ 0 tới 9 rồi các chữ a tới f, với a bằng 10 và f bằng 15. Mỗi vị trí đáng giá gấp 16 lần vị trí bên phải nó, giống hệ mười thì gấp 10. Ví dụ, 2 e bằng 2 nhân 16 cộng 14, bằng 46. Một bit là một chữ số chỉ 0 hoặc 1, và 4 bit có 2 nhân 2 nhân 2 nhân 2, bằng 16 cách viết, vừa đủ cho 16 chữ số. Vì thế mỗi chữ số mười sáu mang 4 bit, và 12 ký tự của mã băm mang 12 nhân 4, bằng 48 bit."

  - id: sym
    kind: symbol
    title: "Giải mã: mã băm nội dung, dòng dõi"
    checks:
      - "len(__import__('hashlib').sha256(b'id,nhan\\n1,0\\n2,1\\n3,1\\n').hexdigest()) == 64 and 64 * 4 == 256"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>hàm băm</b> SHA-256</td><td>một quy tắc cố định biến mọi dãy byte thành 256 bit, tức 64 ký tự mười sáu; bài chỉ hiện 12 ký tự đầu cho gọn</td></tr>
          <tr><td><b>mã băm nội dung</b></td><td>tính từ từng byte của tệp: cùng nội dung → cùng mã; đổi một byte → mã khác hẳn. Tên tệp không ảnh hưởng.</td></tr>
          <tr><td><b>phiên bản dữ liệu</b></td><td>được nhận diện bằng mã băm, không bằng tên hay ngày sửa</td></tr>
          <tr><td><b>dòng dõi</b></td><td>bản ghi “mô hình này được tạo từ dữ liệu có mã băm X, mã ở lần ghi Y (bản chụp mã trong kho mã), hạt giống Z”</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng giới thiệu bốn khái niệm. Hàm băm là một quy tắc cố định biến mọi dãy byte thành 256 bit, tức 64 ký tự mười sáu, và bài này chỉ hiện 12 ký tự đầu cho gọn. Mã băm nội dung được tính từ từng byte của tệp, cùng nội dung thì cùng mã, đổi một byte thì mã khác hẳn, và tên tệp không ảnh hưởng. Phiên bản dữ liệu được nhận diện bằng mã băm, không bằng tên hay ngày sửa. Dòng dõi là bản ghi cho biết mô hình này được tạo từ dữ liệu có mã băm nào, mã ở lần ghi nào, và hạt giống nào."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một byte khác, cả mã băm khác"
    checks:
      - "(lambda a, b: len(a) == len(b) == 20 and [i for i in range(20) if a[i] != b[i]] == [14] and (a[14], b[14]) == (49, 48))(b'id,nhan\\n1,0\\n2,1\\n3,1\\n', b'id,nhan\\n1,0\\n2,0\\n3,1\\n')"
    steps:
      - show: |
