# Quy ước: lượng tử hoá ĐỐI XỨNG theo tensor, khoảng [−2, 2], 8 bit: bước = 2 / 127; q = làm tròn(x / bước) ∈ [−127, 127]; giá trị khôi phục = q · bước
#   (alg.quantize_sym). Bộ nhớ = số tham số × số byte mỗi tham số, GB = 10^9 byte (alg.model_memory_gb). int8, float16, float32 chỉ trên màn hình.
objectives:
  - "Tính bộ nhớ theo kiểu số"
  - "Ước lượng sai số lượng tử hoá"
  - "Biết vì sao phải đánh giá lại sau khi tối ưu"
