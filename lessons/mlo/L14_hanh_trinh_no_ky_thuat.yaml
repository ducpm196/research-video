          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>một kịch bản cộng ba cửa kiểm: lược đồ dữ liệu, so bản đang chạy, phát hành thử</td><td>làm trong vài ngày; bắt được lệch và mô hình kém; 2 mô hình nhân 2 bước (huấn luyện, phục vụ) nhân 1 nơi chạy = 4 đường cần kiểm</td><td>dòng dõi ghi tay; thêm mô hình thì dễ thành rừng đường ống</td></tr>
          <tr><td>cả một nền tảng</td><td>dòng dõi, huấn luyện liên tục, chạy bù</td><td>nuôi nhiều phụ thuộc; như chặng 4, 3 nhân 3 nhân 2 = 18 cấu hình</td></tr></table>
          <p class="note">Điều kiện đổi: số mô hình lên hàng chục, nhiều đội viết mã keo trùng nhau, hay phải có mô hình mới mỗi ngày — khi đó nền tảng chung trả được nợ.</p>
        focus: [1, "1.2", "1.2", "1.3", 2]
        say: "Đáp án câu hai cũng là một đánh đổi. Một kịch bản cộng ba cửa kiểm làm được trong vài ngày, gồm kiểm lược đồ dữ liệu, so với bản đang chạy, và phát hành thử. Với 2 mô hình, mỗi mô hình 2 bước là huấn luyện và phục vụ, chạy ở 1 nơi, chỉ có 4 đường cần kiểm. Cả một nền tảng cho dòng dõi và huấn luyện liên tục, nhưng phải nuôi nhiều phụ thuộc, như 18 cấu hình ở chặng bốn. Khi số mô hình lên hàng chục, nhiều đội viết mã keo trùng nhau, hay phải có mô hình mới mỗi ngày, thì nền tảng chung mới trả được nợ."

