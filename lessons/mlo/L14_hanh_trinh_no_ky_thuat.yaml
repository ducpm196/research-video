          <p class="note">Ô vàng là hai cửa chặn: dữ liệu lạ hay mô hình kém thì <b>không đi tiếp</b>. Phép biến đổi được xuất <b>cùng mô hình</b>, nên lúc phục vụ biến đổi y như lúc huấn luyện.</p>
        focus: [1, 1, 2, 2]
        say: "Hình là đường ống của nền tảng, từ dữ liệu vào tới phục vụ và nhật ký. Mũi tên cam vòng lại cho thấy thống kê của nhật ký phục vụ được so với dữ liệu huấn luyện cùng ngày. Hai ô vàng là hai cửa chặn, dữ liệu lạ hay mô hình kém thì không đi tiếp. Phép biến đổi đặc trưng được xuất cùng mô hình, nên lúc phục vụ biến đổi y như lúc huấn luyện, tránh đúng lỗi của bài 5."
      - clear: true
        show: |
          <p><b>Lệch tìm thấy nhờ so thống kê:</b> vài đặc trưng <b>luôn thiếu</b> trong nhật ký phục vụ nhưng <b>luôn có</b> trong dữ liệu huấn luyện. Bỏ lệch này, thử nghiệm hai nhóm (chia người dùng thật làm hai nhóm, một nhóm dùng bản cũ, một nhóm dùng bản mới, rồi so) cho thấy lượt cài ứng dụng ở trang chính <b>tăng 2%</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. 1&nbsp;000&nbsp;000 lượt cài mỗi ngày (số minh hoạ)</td><td>1&nbsp;000&nbsp;000 nhân 2, chia 100</td><td>thêm $\hlg{20\,000}$ lượt</td></tr>
          <tr><td>Bước 2. huấn luyện từ đầu mất vài ngày, ví dụ 3 ngày (số minh hoạ)</td><td>3 nhân 24 = 72 giờ, lớn hơn 24 giờ</td><td>không kịp mô hình <b>mỗi ngày</b></td></tr></table>
          <p class="note">Khởi động ấm: lấy lại một phần tham số, ví dụ các vector nhúng (dãy số mô hình học được để biểu diễn mỗi giá trị của một đặc trưng, như mỗi ứng dụng), từ bản hôm qua rồi tinh chỉnh — cùng chất lượng, ít tài nguyên hơn. Điều kiện: chỉ chuyển các phần đủ <b>chung</b>.</p>
        focus: [1, 1, 1, "2.2", "2.3", 3, 3]
        say: "Nhờ so thống kê, đội phát hiện vài đặc trưng luôn thiếu trong nhật ký phục vụ nhưng luôn có trong dữ liệu huấn luyện. Bỏ lệch này, thử nghiệm hai nhóm cho thấy lượt cài ứng dụng ở trang chính tăng 2%. Thử nghiệm hai nhóm là chia người dùng thật làm hai nhóm, một nhóm dùng bản cũ, một nhóm dùng bản mới, rồi so kết quả. Bước một, nếu mỗi ngày có 1 triệu lượt cài, một số minh hoạ, thì 2% là thêm 20 nghìn lượt. Bước hai, huấn luyện từ đầu mất vài ngày, ví dụ 3 ngày là 72 giờ, không kịp ra mô hình mỗi ngày. Khởi động ấm lấy lại một phần tham số từ bản hôm qua rồi tinh chỉnh, với điều kiện phần được chuyển đủ chung. Phần đó thường là các vector nhúng, tức dãy số mô hình học được để biểu diễn mỗi giá trị của một đặc trưng, như mỗi ứng dụng."
      - clear: true
        show: |
