    steps:
      - show: |
          <p><b>Quy mô:</b> cửa hàng ứng dụng Google Play có <b>hơn một tỉ</b> người dùng hoạt động, <b>hơn một triệu</b> ứng dụng. Một tập huấn luyện điển hình có <b>hàng trăm tỉ</b> mẫu; mô hình được huấn luyện mới <b>mỗi ngày</b>, phục vụ <b>hàng nghìn</b> truy vấn mỗi giây trong <b>vài chục mili giây</b>.</p>
          <p><b>Điểm nghẽn:</b> mỗi đội tự viết mã keo và kịch bản riêng → công sức trùng lặp, hệ dễ vỡ, nợ kỹ thuật cao; đưa một mô hình ra sản xuất mất <b>cỡ vài tháng</b>.</p>
          <p><b>Cách xử lý:</b> nền tảng TFX (2017) nối các bước vào <b>một nền tảng</b>, dùng chung một cấu hình; thời gian ra sản xuất còn <b>cỡ vài tuần</b>.</p>
        focus: [1, 1, 2, 3]
        say: "Ở chặng ba, năm 2017, cửa hàng ứng dụng của Google có hơn một tỉ người dùng hoạt động và hơn một triệu ứng dụng. Một tập huấn luyện điển hình có hàng trăm tỉ mẫu, mô hình được huấn luyện mới mỗi ngày, phục vụ hàng nghìn truy vấn mỗi giây trong vài chục mi li giây. Điểm nghẽn là mỗi đội tự viết mã keo riêng, công sức trùng lặp, hệ dễ vỡ, và đưa một mô hình ra sản xuất mất cỡ vài tháng. Nền tảng TFX năm 2017 nối các bước vào một nền tảng dùng chung một cấu hình, và thời gian đó còn cỡ vài tuần."
