          <tr><td>cho dùng <b>từng phần</b>: thư viện riêng lẻ, cả đường ống, hay dịch vụ dựng sẵn; chạy một lần cũng được, không bắt buộc liên tục</td><td>không ai phải nhận cả khối</td></tr>
          <tr><td>tự sinh <b>thẻ mô hình</b> (bản mô tả mô hình dùng cho ai, không dùng cho gì, chỉ số theo từng nhóm), dò hành vi lạ trên nhiều lát, dò lệch huấn luyện–phục vụ tốt hơn</td><td>tự động là xương sống của hệ tin cậy</td></tr>
          <tr><td>tách rõ phần <b>đã kiểm chứng</b> khỏi phần <b>thử nghiệm</b></td><td>người dùng biết mình đang dựa vào cái gì</td></tr></table>
          <p class="note">Ổn định không có nghĩa là hết việc: mỗi tầng, mỗi môi trường, mỗi phụ thuộc mới đều thêm phần phải nuôi.</p>
        focus: [1, "1.2", "1.3", "1.3", "1.4", 2]
        say: "Năm 2020, đội viết về hướng tiếp tục phát triển. Nền tảng đã cho dùng từng phần, từ thư viện riêng lẻ, cả đường ống, tới dịch vụ dựng sẵn, và chạy một lần cũng được. Họ dự định tự sinh thẻ mô hình như bài 12, tức bản mô tả mô hình dùng cho ai và chỉ số theo từng nhóm. Họ cũng định dò hành vi lạ trên nhiều lát, và dò lệch huấn luyện, phục vụ tốt hơn. Ngoài ra, họ tách rõ phần đã kiểm chứng khỏi phần thử nghiệm, để người dùng biết mình đang dựa vào cái gì. Ổn định không có nghĩa là hết việc, vì mỗi phụ thuộc mới đều thêm phần phải nuôi."

  # ───────────────────────── 9. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "5000 / 100000 == 0.05 and 19 * 5000 == 95000"
      - "round(10.3 * 45) == 464 and 10 * 45 < 465 < 11 * 45"
      - "150 * 10 == 1500 and 75 * 6 < 500 < 75 * 7"
      - "len([(a, b, c) for a in range(3) for b in range(3) for c in range(2)]) == 18"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>5000 và 95 000 dòng</td><td>chia ngược: 5000 chia 100 000 = 0,05 = 5%; và 19 nhân 5000 = 95 000 ✓</td></tr>
          <tr><td>10,3 triệu mỗi phút</td><td>nhân ngược: 10,3 nhân 45 ≈ 464, sát 465; 10 nhân 45 = 450 &lt; 465 &lt; 11 nhân 45 = 495 ✓</td></tr>
          <tr><td>gấp 10 và 6,7 lần</td><td>150 nhân 10 = 1500 ✓; 75 nhân 6 = 450 &lt; 500 &lt; 75 nhân 7 = 525 ✓</td></tr>
          <tr><td>18 cấu hình</td><td>đếm thẳng: liệt kê mọi bộ ba (điều phối, nơi chạy, siêu dữ liệu) được đúng 18 dòng ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Chia ngược, 5 nghìn chia 100 nghìn là 5%, và 19 nhân 5 nghìn đúng bằng 95 nghìn. Nhân ngược, 10 phẩy 3 nhân 45 được khoảng 464, sát 465, và 465 nằm giữa 450 với 495. Tiếp theo, 150 nhân 10 đúng bằng 1500, còn 500 nằm giữa 75 nhân 6 và 75 nhân 7, nên khoảng 6 phẩy 7 lần là hợp lý. Đếm thẳng, liệt kê mọi bộ ba gồm bộ điều phối, nơi chạy và cơ sở siêu dữ liệu, ta được đúng 18 dòng."

  # ───────────────────────── 10. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
