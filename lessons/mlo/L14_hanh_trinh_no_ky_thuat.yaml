        say: "Với tín hiệu không ổn định, hãy dùng một bản sao có phiên bản, và chỉ đổi khi bản mới đã được kiểm kỹ. Cái giá là dữ liệu có thể cũ, và phải nuôi nhiều phiên bản, giống mã băm ở bài 2. Định kỳ bỏ thử từng đặc trưng, nếu bỏ mà không thiệt thì gỡ, với 20 đặc trưng mỗi lần 2 giờ là 40 giờ máy, một số minh hoạ. Bọc gói học máy sau một giao diện chung, để đổi gói không phải viết lại mã keo. Cuối cùng, cấu hình phải qua duyệt mã, vì số dòng cấu hình có thể vượt xa số dòng mã."

  # ───────────────────────── 7. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2017 — quy mô rất lớn: một nền tảng chung"
    stage: {year: "2017", scale: "cửa hàng ứng dụng hơn một tỉ người dùng hoạt động, hơn một triệu ứng dụng; hàng trăm tỉ mẫu huấn luyện; hàng nghìn truy vấn mỗi giây trong vài chục mili giây; mô hình mới mỗi ngày", source: "[TX17]", practice: "các bước dùng chung một cấu hình; kiểm dữ liệu bằng lược đồ có phiên bản; xuất phép biến đổi cùng mô hình; khởi động ấm; chặn mô hình theo ngưỡng cố định và so với bản đang chạy; tách luồng nạp mô hình"}
