        focus: [1, 1, 1, "2.2", "2.3", "2.4", "2.5"]
        say: "Khi phục vụ, đội thấy độ trễ vọt lên đúng lúc máy chủ nạp một mô hình mới. Cách xử lý là cho việc nạp mô hình một nhóm luồng riêng, chỉ 1 hoặc 2 luồng. Luồng là một dòng lệnh chạy song song bên trong máy chủ, nên việc nạp không còn tranh luồng với các yêu cầu. Trước đó, phân vị 99 phẩy 9 lúc nạp nằm từ 500 tới 1500 mi li giây. Sau đó chỉ còn từ 75 tới 150 mi li giây. Bước ba, ở đầu trên, 1500 chia 150 là nhanh gấp 10 lần. Bước bốn, ở đầu dưới, 500 chia 75 là nhanh gấp khoảng 6 phẩy 7 lần, đổi lại việc nạp mô hình chậm hơn."
      - clear: true
        show: |
