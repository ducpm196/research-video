          <tr><td>cảnh báo ít mà dễ hiểu</td><td>quá nhiều cảnh báo, hay cảnh báo khó hiểu, người dùng thường tắt kiểm</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Mô hình mới bị chặn khi thua một ngưỡng cố định, hoặc thua bản đang chạy, và độ an toàn được kiểm bằng phát hành thử. Ngưỡng lỏng bắt được đa số lỗi lớn, nhưng lỗi tinh vi có thể lọt. Hãy đo trên từng lát dữ liệu, vì chỉ số toàn bộ có thể che một lát nhỏ. Kiểm dữ liệu bằng lược đồ có phiên bản, còn khi dữ liệu đổi tự nhiên thì sửa lược đồ chứ không sửa dữ liệu. Cảnh báo phải ít mà dễ hiểu, vì quá nhiều cảnh báo thì người dùng thường tắt luôn phần kiểm."

  # ───────────────────────── 8. CHẶNG 4 ─────────────────────────
  - id: stage4
