    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Dựng xong nền tảng là hết nợ”</td><td>bài viết năm 2017 kể: khi cửa kiểm mô hình mới làm xong, không đội sản phẩm nào chủ động xin dùng, được giải thích rồi cũng ít đội bật lên — tới khi gặp sự cố thật</td><td>bật kiểm <b>mặc định</b>; thưởng cho việc gỡ đặc trưng, giảm phức tạp ngang với tăng độ đúng</td></tr>
          <tr><td><b class="red">2.</b> “Chép nguyên kiến trúc của Google”</td><td>hàng nghìn đường ống, hàng chục nghìn mô hình là quy mô của họ; mỗi phụ thuộc thêm công sức tăng nhanh hơn số phụ thuộc</td><td>bắt đầu bằng luật và mô hình đơn giản; chỉ lấy phần mình cần</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ dựng xong nền tảng là hết nợ. Bài viết năm 2017 kể rằng khi cửa kiểm mô hình mới làm xong, không đội sản phẩm nào chủ động xin dùng. Được giải thích rồi cũng ít đội bật lên, cho tới khi gặp sự cố thật. Hãy bật kiểm mặc định, và thưởng cho việc gỡ đặc trưng hay giảm phức tạp ngang với tăng độ đúng. Bài học sai thứ hai là chép nguyên kiến trúc của Google, trong khi hàng nghìn đường ống là quy mô của họ, và mỗi phụ thuộc đều có giá. Hãy bắt đầu bằng luật và mô hình đơn giản, chỉ lấy phần mình cần."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Mô hình qua kiểm định là dùng được”</td><td>dữ liệu huấn luyện lỡ chứa cả nhãn: mô hình rất tốt, qua kiểm định, rồi hỏng khi chạy thật vì lúc đó không có nhãn</td><td>kiểm <b>dữ liệu</b> đi kèm kiểm mô hình; so nhật ký phục vụ với dữ liệu huấn luyện</td></tr>
          <tr><td><b class="red">4.</b> “Thêm một đặc trưng tốt hơn 0,1 điểm là lời”</td><td>mỗi phụ thuộc dữ liệu thêm vào có thể làm chậm mọi bước sau; đổi một thứ là đổi mọi thứ</td><td>tính cả giá nuôi: ai sở hữu tín hiệu, có phiên bản chưa, bỏ thử có thiệt không</td></tr></table>
        focus: ["1.2", "1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba là nghĩ mô hình qua kiểm định là dùng được. Nếu dữ liệu huấn luyện lỡ chứa cả nhãn, mô hình trông rất tốt và qua kiểm định, nhưng hỏng khi chạy thật vì lúc đó không có nhãn. Vì thế kiểm dữ liệu phải đi kèm kiểm mô hình, và nhật ký phục vụ phải được so với dữ liệu huấn luyện. Bài học sai thứ tư, hay gặp ở người đã đi làm, là nghĩ thêm một đặc trưng tốt hơn 0 phẩy 1 điểm là lời. Mỗi phụ thuộc dữ liệu thêm vào có thể làm chậm mọi bước sau, nên hãy tính cả giá nuôi, như ai sở hữu tín hiệu và đã có phiên bản chưa."

