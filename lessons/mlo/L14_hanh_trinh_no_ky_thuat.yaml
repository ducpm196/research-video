          <tr><td>Bước 2. nơi chạy xử lý dữ liệu</td><td>Flink, Spark, Dataflow: 3</td><td>3 nhân 3 = 9</td></tr>
          <tr><td>Bước 3. cơ sở dữ liệu siêu dữ liệu (nơi ghi mỗi lần chạy dùng dữ liệu nào, sinh mô hình nào)</td><td>SQLite, MySQL: 2</td><td>9 nhân 2 = $\hl{18}$</td></tr>
          <tr><td>Bước 4. thêm một nơi chạy nữa</td><td>4 thay cho 3</td><td>3 nhân 4 nhân 2 = $\hlb{24}$, thêm 6</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", "2.4", "2.4", "2.5"]
        say: "Bài học thứ hai là phụ thuộc có giá, công sức nuôi phụ thuộc tăng nhanh hơn số phụ thuộc, và số cấu hình triển khai bùng nổ. Ta đếm từ đúng các lựa chọn đội kể ra, bước một là 3 bộ điều phối. Bộ điều phối là phần mềm cho các bước của đường ống chạy đúng thứ tự và đúng lúc. Bước hai, có 3 nơi chạy xử lý dữ liệu, nên 3 nhân 3 là 9 tổ hợp. Cơ sở dữ liệu siêu dữ liệu là nơi ghi mỗi lần chạy đã dùng dữ liệu nào và sinh ra mô hình nào. Bước ba, có 2 cơ sở dữ liệu siêu dữ liệu, nên 9 nhân 2 là 18 tổ hợp. Bước bốn, chỉ thêm một nơi chạy nữa là thành 3 nhân 4 nhân 2 bằng 24, thêm 6 cấu hình phải kiểm."
      - clear: true
        show: |
