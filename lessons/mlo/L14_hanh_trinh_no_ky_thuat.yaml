        focus: [1, "2.2", "2.3", 3]
        say: "Một loại nợ nữa là nhánh mã thử nghiệm chết, mỗi lần thử một cách mới bằng một nhánh điều kiện thì rẻ, nhưng tích lại thì không ai thử được hết các tổ hợp. Ví dụ nêu năm 2015 là 465 triệu đô la Mỹ mất trong 45 phút, có vẻ do nhánh mã thử nghiệm cũ. Bước bốn, 465 chia 45 được khoảng 10 phẩy 3 triệu đô la mỗi phút. Thực hành rút ra là định kỳ xem lại từng nhánh thử nghiệm, và gỡ nhánh không còn dùng."
