#   Tên chỉ trên màn hình; bằng chứng dò: audit/mlo/probes/p2_hanh_trinh.md.
objectives:
  - "Kể lại hành trình đưa học máy vào sản phẩm ở Google qua bốn chặng từ 2007 tới 2020, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại tỉ lệ mã học máy so với mã keo, mức giảm độ trễ khi tách luồng nạp mô hình và số cấu hình triển khai khi thêm phụ thuộc"
  - "Chọn mức đầu tư hạ tầng hợp với quy mô đội của chính mình, kèm điều kiện đổi lựa chọn"
asr_reviewed:
  - {sentence: "Nợ ẩn nguy hiểm vì nó lãi chồng lãi trong im lặng.", reason: "ASR chép “Nờ ẩn nguy hiểm vì nó lại chồng lại trong im lặng.” (0.75): lệch âm/thanh thuần Việt: nợ/nờ, lãi/lại, lãi/lại — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Làm ra mô hình thì nhanh, giữ nó chạy mới đắt"
    checks:
      - "round(465 / 45, 1) == 10.3"
    steps:
      - show: |
          <p>Năm 2015, một nhóm kỹ sư Google viết: làm ra và triển khai hệ học máy <b>tương đối nhanh và rẻ</b>, nhưng <b>duy trì</b> nó theo thời gian thì <b>khó và đắt</b>.</p>
          <p>Họ gọi đó là <b>nợ kỹ thuật</b>: “không phải món nợ nào cũng xấu, nhưng món nợ nào cũng phải trả”. Nợ ẩn nguy hiểm vì nó <b>lãi chồng lãi trong im lặng</b>.</p>
          <p>Ví dụ họ nêu: một công ty chứng khoán (Knight Capital) mất <b>465 triệu USD trong 45 phút</b>, có vẻ do nhánh mã thử nghiệm cũ còn sót lại.</p>
          <div class="box key">Hôm nay: bốn chặng từ 2007 tới 2020 — đội học máy của Google đã trả món nợ này thế nào, ở từng quy mô.</div>
        focus: [1, 2, 2, 3, 4]
        say: "Chào bạn, năm 2015, một nhóm kỹ sư Google viết rằng làm ra và triển khai hệ học máy thì tương đối nhanh và rẻ, nhưng duy trì nó theo thời gian thì khó và đắt. Họ gọi đó là nợ kỹ thuật, không phải món nợ nào cũng xấu, nhưng món nợ nào cũng phải trả. Nợ ẩn nguy hiểm vì nó lãi chồng lãi trong im lặng. Ví dụ họ nêu là một công ty giao dịch chứng khoán mất 465 triệu đô la Mỹ trong 45 phút, có vẻ do nhánh mã thử nghiệm cũ còn sót lại. Hôm nay ta đi qua bốn chặng từ 2007 tới 2020, xem đội học máy của Google trả món nợ này ở từng quy mô."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "(70 - 50) / 10 == 2.0 and (70 - 60) / 10 == 1.0"
      - "999 / 1000 == 0.999"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 2</td><td><b>phiên bản dữ liệu</b>: mỗi bản dữ liệu có một mã băm nội dung (chuỗi ngắn tính ra từ toàn bộ nội dung)</td><td>đổi đúng một nhãn → mã băm đổi hẳn</td></tr>
          <tr><td>bài 5</td><td><b>lệch huấn luyện–phục vụ</b>: lúc phục vụ biến đổi đặc trưng khác lúc huấn luyện</td><td>huấn luyện trừ trung bình 50, phục vụ trừ 60, cùng chia 10: giá trị 70 thành 2,0 và 1,0</td></tr>
          <tr><td>bài 6</td><td><b>độ trễ</b> đo bằng phân vị, không bằng trung bình</td><td>phân vị 99: 99 trên 100 yêu cầu nhanh hơn mức này</td></tr>
          <tr><td>bài 7</td><td><b>phát hành an toàn</b>: chạy bóng, phát hành thử cho một phần nhỏ người dùng, rồi mới mở rộng</td><td>mô hình mới ghi dự đoán một tuần, vẫn trả kết quả mô hình cũ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4", "1.5"]
        say: "Ta nhắc lại bốn điều. Ở bài 2, mỗi bản dữ liệu có một mã băm nội dung, tức một chuỗi ngắn tính ra từ toàn bộ nội dung, đổi đúng một nhãn là mã băm đổi hẳn. Ở bài 5, lệch huấn luyện và phục vụ là khi lúc phục vụ ta biến đổi đặc trưng khác lúc huấn luyện. Ví dụ huấn luyện trừ trung bình 50, phục vụ lại trừ 60, cùng chia 10, thì giá trị 70 thành 2 và 1. Ở bài 6, độ trễ đo bằng phân vị, phân vị 99 là mức mà 99 trên 100 yêu cầu nhanh hơn. Ở bài 7, ta phát hành an toàn bằng chạy bóng, rồi phát hành thử cho một phần nhỏ người dùng."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>nợ kỹ thuật</b></td><td>chi phí sau này phải trả vì hôm nay làm nhanh</td></tr>
          <tr><td><b>mã keo</b> (glue code)</td><td>mã chỉ để đưa dữ liệu vào và ra một gói học máy có sẵn</td></tr>
          <tr><td><b>lược đồ dữ liệu</b> (schema)</td><td>bản mô tả có phiên bản: dữ liệu có những đặc trưng nào, kiểu gì, giá trị trong khoảng nào</td></tr>
          <tr><td><b>khởi động ấm</b></td><td>mô hình mới bắt đầu từ một phần tham số của bản trước, thay vì từ đầu</td></tr>
          <tr><td><b>dòng dõi</b></td><td>ghi lại mô hình nào được làm từ dữ liệu nào, mã nào, phiên bản thư viện nào</td></tr>
          <tr><td><b>phân vị 99,9</b></td><td>mức độ trễ mà 999 trên 1000 yêu cầu nhanh hơn</td></tr></table>
        focus: ["1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Nợ kỹ thuật là chi phí sau này phải trả vì hôm nay làm nhanh. Mã keo là mã chỉ để đưa dữ liệu vào và ra một gói học máy có sẵn. Lược đồ dữ liệu là bản mô tả có phiên bản, cho biết dữ liệu có những đặc trưng nào, kiểu gì, giá trị trong khoảng nào. Khởi động ấm là cho mô hình mới bắt đầu từ một phần tham số của bản trước, thay vì từ đầu. Dòng dõi là ghi lại mô hình nào được làm từ dữ liệu nào, mã nào, và phiên bản thư viện nào. Phân vị 99 phẩy 9 là mức độ trễ mà 999 trên 1000 yêu cầu nhanh hơn."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bốn chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="200" cy="150" r="15" fill="#9ca3af"/><text x="200" y="108" font-weight="bold">2007</text><text x="200" y="200">nền tảng đầu tiên</text><text x="200" y="232">thuật toán thôi chưa đủ</text>
          <circle cx="630" cy="150" r="15" fill="#2a78d6"/><text x="630" y="108" font-weight="bold">2014 → 2015</text><text x="630" y="200">gọi tên nợ kỹ thuật</text><text x="630" y="232">5% mã học máy</text>
          <circle cx="1060" cy="150" r="15" fill="#eb6834"/><text x="1060" y="108" font-weight="bold">2017</text><text x="1060" y="200">một nền tảng chung</text><text x="1060" y="232">kiểm dữ liệu, kiểm mô hình</text>
          <circle cx="1490" cy="150" r="15" fill="#059669"/><text x="1490" y="108" font-weight="bold">2019 → 2020</text><text x="1490" y="200">mở mã, hàng nghìn đường ống</text><text x="1490" y="232">dòng dõi, phụ thuộc có giá</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô rất lớn → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với bốn chặng. Năm 2007, nền tảng học máy đầu tiên ra đời, với bài học rằng thuật toán thôi chưa đủ. Năm 2014 và 2015, nhóm kỹ sư gọi tên nợ kỹ thuật, khi mã học máy có thể chỉ chiếm nhiều nhất 5%. Năm 2017 có một nền tảng chung kiểm cả dữ liệu lẫn mô hình, rồi 2019 và 2020 nó mở mã, chạy hàng nghìn đường ống mỗi ngày."

  # ───────────────────────── 5. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2007 — khai sinh: thuật toán thôi chưa đủ"
    stage: {year: "2007", scale: "nền tảng học máy quy mô rất lớn cho sản phẩm thật; mô hình tuyến tính “rộng”; gói sẵn công cụ lấy dữ liệu, kiểm dữ liệu, huấn luyện, phân tích mô hình, dò lệch huấn luyện–phục vụ", source: "[TH20]", practice: "đi từ luật đơn giản → mô hình đơn giản → thêm đặc trưng → mô hình hiện đại; đo lợi ích trên công bỏ ra, dừng khi lợi ích giảm dần"}
    checks:
      - "78 - 70 == 8 and 81 - 78 == 3 and 81.5 - 81 == 0.5"
      - "8 / 2 == 4 and 3 / 4 == 0.75 and round(0.5 / 12, 2) == 0.04"
    steps:
      - show: |
          <p><b>Quy mô:</b> năm 2007, Google lập Sibyl, một nền tảng cho học máy <b>quy mô rất lớn</b>, phục vụ sản phẩm thật, chủ yếu với mô hình tuyến tính.</p>
          <p><b>Điểm nghẽn:</b> đội nhận ra từ sớm rằng thuật toán quan trọng, nhưng <b>thường không đủ</b> để học máy thành công trong một sản phẩm.</p>
          <p><b>Cách xử lý:</b> gói thành <b>một sản phẩm</b> các công cụ quanh thuật toán: lấy dữ liệu, phân tích và kiểm dữ liệu, huấn luyện, phân tích mô hình, <b>dò lệch huấn luyện–phục vụ</b>.</p>
        focus: [1, 2, 3]
        say: "Ở chặng một, năm 2007, Google lập một nền tảng cho học máy quy mô rất lớn, phục vụ sản phẩm thật, chủ yếu với mô hình tuyến tính. Đội nhận ra từ sớm rằng thuật toán quan trọng, nhưng thường không đủ để học máy thành công trong một sản phẩm. Vì vậy họ gói các công cụ quanh thuật toán thành một sản phẩm, từ lấy dữ liệu, kiểm dữ liệu, huấn luyện, tới dò lệch huấn luyện và phục vụ như ở bài 5."
      - clear: true
        show: |
          <p>Bài học đội tổng kết lại năm 2020 — chặng tiến hoá thường gặp khi đưa học máy vào một sản phẩm:</p>
          <table class="t"><tr><th>giai đoạn</th><th>nguồn ghi</th><th>độ đúng (số minh hoạ)</th><th>công</th><th>lợi ích mỗi tuần</th></tr>
          <tr><td>luật đơn giản, thu dữ liệu</td><td>bắt đầu từ phía phục vụ</td><td>70%</td><td>—</td><td>—</td></tr>
          <tr><td>Bước 1. mô hình đơn giản</td><td>lợi ích <b>lớn</b>; lúc đường ống ra đời</td><td>78%: tăng 8</td><td>2 tuần</td><td>8 chia 2 = $\hlg{4}$ điểm</td></tr>
          <tr><td>Bước 2. thêm đặc trưng</td><td>lợi ích <b>khá</b></td><td>81%: tăng 3</td><td>4 tuần</td><td>3 chia 4 = $\hlb{0{,}75}$ điểm</td></tr>
          <tr><td>Bước 3. mô hình hiện đại nhất</td><td>lợi ích <b>nhỏ</b>, độ phức tạp cao</td><td>81,5%: tăng 0,5</td><td>12 tuần</td><td>≈ $\hl{0{,}04}$ điểm</td></tr></table>
          <p class="note">Thực hành: đi từng bậc, mỗi bậc đo lợi ích trên công bỏ ra. Điều kiện: chỉ lên bậc cao nhất cho bài toán <b>đáng</b> như vậy.</p>
        focus: [1, "2.2", "2.3", "2.4", "2.5", 3]
        say: "Năm 2020, đội tổng kết một chặng tiến hoá thường gặp khi đưa học máy vào sản phẩm. Đầu tiên là luật đơn giản để thu dữ liệu, ví dụ đạt 70%, một số minh hoạ. Bước một, mô hình đơn giản cho lợi ích lớn, lên 78% trong 2 tuần, tức 4 điểm mỗi tuần. Bước hai, thêm đặc trưng cho lợi ích khá, lên 81% trong 4 tuần, chỉ 0 phẩy 75 điểm mỗi tuần. Bước ba, mô hình hiện đại nhất thêm 0 phẩy 5 điểm trong 12 tuần, khoảng 0 phẩy 04 điểm mỗi tuần. Thực hành rút ra là đi từng bậc, và chỉ lên bậc cao nhất cho bài toán đáng như vậy."

  # ───────────────────────── 6. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2014 tới 2015 — tăng trưởng: gọi tên nợ kỹ thuật"
    stage: {year: "2014 → 2015", scale: "hệ trưởng thành có hàng chục tới hàng trăm mô hình chạy cùng lúc; nhiều nhất 5% là mã học máy, ít nhất 95% là mã keo", source: "[SC15]", practice: "bản sao có phiên bản cho tín hiệu không ổn định; định kỳ bỏ thử từng đặc trưng; bọc gói học máy sau một giao diện chung; cấu hình qua duyệt mã; định kỳ gỡ nhánh thử nghiệm"}
    checks:
      - "100000 * 5 // 100 == 5000 and 100000 - 5000 == 95000 and 95000 // 5000 == 19"
      - "round(465 / 45, 1) == 10.3 and 20 - 1 == 19"
      - "20 * 2 == 40"
    steps:
      - show: |
          <p><b>Quy mô:</b> hệ trưởng thành có thể có <b>hàng chục, hàng trăm</b> mô hình chạy cùng lúc. Bản ngắn của bài viết trình bày năm 2014, bản đầy đủ năm 2015.</p>
          <table class="t"><tr><th>điểm nghẽn</th><th>nghĩa là</th></tr>
          <tr><td><b>đổi một thứ là đổi mọi thứ</b></td><td>đổi phân bố của đặc trưng thứ nhất, trọng số của mọi đặc trưng còn lại đều có thể đổi</td></tr>
          <tr><td><b>người dùng không khai báo</b></td><td>hệ khác lặng lẽ lấy dự đoán của mô hình làm đầu vào; sửa mô hình là làm hỏng họ</td></tr>
          <tr><td><b>phụ thuộc dữ liệu không ổn định</b></td><td>đội khác lặng lẽ “sửa đúng” một tín hiệu, mô hình đã quen với cái sai liền lệch theo</td></tr>
          <tr><td><b>rừng đường ống</b></td><td>chuỗi cào, nối, lấy mẫu chồng chéo, nhiều tệp trung gian</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Ở chặng hai, một hệ trưởng thành có thể có hàng chục, hàng trăm mô hình chạy cùng lúc, và nhóm kỹ sư gọi tên bốn điểm nghẽn. Thứ nhất, đổi một thứ là đổi mọi thứ, đổi phân bố của một đặc trưng thì trọng số của các đặc trưng còn lại đều có thể đổi. Thứ hai, hệ khác lặng lẽ lấy dự đoán của mô hình làm đầu vào, nên sửa mô hình là làm hỏng họ. Thứ ba, đội khác lặng lẽ sửa đúng một tín hiệu, mà mô hình đã quen với cái sai nên lệch theo. Thứ tư là rừng đường ống, với chuỗi cào, nối, lấy mẫu chồng chéo."
