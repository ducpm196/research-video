        focus: [1, 1, 2, "3.2", "3.4"]
        say: "Ở chặng bốn, TFX ra mắt trong Google năm 2017, gần một thập kỷ sau nền tảng 2007, và bản công khai ra đầu 2019. Năm 2020, mỗi ngày có hàng nghìn đường ống chạy, sinh ra hàng chục nghìn mô hình, phục vụ hàng trăm triệu lần suy luận mỗi giây. Nền tảng 2007 chạy khoảng 14 năm rồi ngừng, phần lớn việc của nó chuyển sang nền tảng mới. Bài học đầu tiên là coi dữ liệu, thống kê, mô hình là sản phẩm trung gian có kiểm, có phiên bản, và ghi dòng dõi của chúng như vết ngăn xếp khi gỡ lỗi. Mô hình được huấn luyện liên tục khi có dữ liệu mới, và chạy bù khi sửa dữ liệu."
