" y="296" text-anchor="middle" font-size="20" fill="#1f2937">-2</text><line x1="590" y1="252" x2="590" y2="268" stroke="#6b7280" stroke-width="2"/><text x="590" y="296" text-anchor="middle" font-size="20" fill="#1f2937">-1</text><line x1="720" y1="252" x2="720" y2="268" stroke="#6b7280" stroke-width="2"/><text x="720" y="296" text-anchor="middle" font-size="20" fill="#1f2937">0</text><line x1="850" y1="252" x2="850" y2="268" stroke="#6b7280" stroke-width="2"/><text x="850" y="296" text-anchor="middle" font-size="20" fill="#1f2937">1</text><line x1="980" y1="252" x2="980" y2="268" stroke="#6b7280" stroke-width="2"/><text x="980" y="296" text-anchor="middle" font-size="20" fill="#1f2937">2</text><line x1="1110" y1="252" x2="1110" y2="268" stroke="#6b7280" stroke-width="2"/><text x="1110" y="296" text-anchor="middle" font-size="20" fill="#1f2937">3</text><circle cx="460" cy="260" r="12" fill="#b91c1c"/><circle cx="590" cy="260" r="12" fill="#b91c1c"/><circle cx="720" cy="260" r="12" fill="#b91c1c"/><circle cx="850" cy="260" r="12" fill="#b91c1c"/><circle cx="980" cy="260" r="12" fill="#b91c1c"/><line x1="980" y1="168" x2="850" y2="238" stroke="#eb6834" stroke-width="4"/><text x="1000" y="200" font-size="22" fill="#eb6834">khách 70 đơn: 2 thành 1</text><line x1="915.0" y1="60" x2="915.0" y2="300" stroke="#059669" stroke-width="3" stroke-dasharray="10 8"/><text x="915.0" y="50" text-anchor="middle" font-size="20" fill="#059669">ngưỡng minh hoạ 1,5</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình đặt năm khách có 40, 50, 60, 70 và 80 đơn lên hai thước đo. Thước trên dùng trung bình 50 của lúc huấn luyện, thước dưới là bản phục vụ lỡ dùng trung bình 60. Cả năm chấm đều trượt sang trái đúng 1 đơn vị, và khách 70 đơn đi từ 2 xuống 1. Nếu mô hình đặt ngưỡng ở 1 phẩy 5, một con số minh hoạ, khách này vượt ngưỡng lúc học nhưng không vượt lúc chạy thật.
- id: example
  kind: example
  title: Hai bản mã, hai con số
  checks:
  - alg.zscore(70, 50, 10) == 2.0 and alg.zscore(70, 60, 10) == 1.0 and alg.zscore(40, 50, 10) == -1.0 and alg.zscore(40, 60, 10) == -2.0
  steps:
  - show: '<p><b>Bước 1</b> — lúc huấn luyện, tham số đã lưu: trung bình 50, độ lệch chuẩn 10. Khách 70 đơn: $\frac{70 - 50}{10} = \frac{20}{10} = \hl{2{,}0}$.</p>

      '
    say: Bước một, lúc huấn luyện, tham số đã lưu là trung bình 50, độ lệch chuẩn 10. Khách 70 đơn được 70 trừ 50 bằng 20, chia 10, ra 2 phẩy 0.
  - show: '<p><b>Bước 2</b> — bản phục vụ tự tính lại trung bình trên dữ liệu tuần này: 60. Cùng khách đó: $\frac{70 - 60}{10} = \frac{10}{10} = \hl{1{,}0}$.</p>

      '
    say: Bước hai, bản phục vụ tự tính lại trung bình trên dữ liệu tuần này, được 60. Cùng khách đó chỉ còn 70 trừ 60 bằng 10, chia 10, ra 1 phẩy 0. Sự chênh lệch tham số thống kê khiến hệ thống đánh giá sai toàn bộ hồ sơ khách hàng dù mô hình không báo bất kỳ lỗi nào.
  - show: '<table class="t"><tr><th>khách</th><th>huấn luyện: $\frac{x - 50}{10}$</th><th>phục vụ (lệch): $\frac{x - 60}{10}$</th></tr>

      <tr><td>70 đơn</td><td>2,0</td><td>$\hl{1{,}0}$</td></tr>

      <tr><td>40 đơn</td><td>$-1{,}0$</td><td>$\hl{-2{,}0}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Bước ba, bảng tính đặc trưng cho hai khách theo hai bản mã. Khách 70 đơn được 2 phẩy 0 lúc huấn luyện, nhưng chỉ 1 phẩy 0 lúc phục vụ. Khách 40 đơn được âm 1 lúc huấn luyện, nhưng âm 2 lúc phục vụ. Khách bốn mươi đơn đột nhiên nhận giá trị âm hai thay vì âm một, làm thay đổi hoàn toàn ngưỡng phân loại rủi ro.
  - clear: true
    show: '<p><b>Bước 4</b> — độ dời $= \frac{60 - 50}{10} = 1$ cho <b>mọi</b> khách. Mọi khách đều bị dời đi 1 đơn vị: mô hình “thấy” mỗi khách mua ít hơn thật, và mọi quyết định dựa trên ngưỡng đều lệch theo.</p>

      <div class="box key">Sửa: một hàm tính đặc trưng, một bộ tham số đã lưu, dùng cho <b>cả</b> huấn luyện lẫn phục vụ. Ghi lại giá trị đặc trưng lúc phục vụ để so với lúc huấn luyện.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Bước bốn, độ dời bằng 60 trừ 50, chia 10, bằng 1, cho mọi khách. Mọi khách đều bị dời đi 1 đơn vị, mô hình thấy mỗi khách mua ít hơn thật, và mọi quyết định dựa trên ngưỡng đều lệch theo. Cách sửa là dùng một hàm tính đặc trưng với một bộ tham số đã lưu cho cả huấn luyện lẫn phục vụ. Hãy ghi lại giá trị đặc trưng lúc phục vụ để so với lúc huấn luyện. Độ dời đồng loạt một đơn vị lệch chuẩn kéo toàn bộ phân bố đầu vào trượt khỏi miền học cũ một cách lặng lẽ.
  - show: '<p><b>Bước 5 — chạy thử bằng Python</b> cùng một công thức chuẩn hoá với thông số huấn luyện:</p><div class="code"><div>def z_chuan(x, mean_tr=50.0, std_tr=10.0):</div><div>    return round((x - mean_tr) / std_tr, 2)</div><div>print(&#x27;chung:&#x27;, z_chuan(70), &#x27;lech:&#x27;, z_chuan(70, 60.0, 10.0))</div></div>

      <p class="note">Đầu ra khi chạy: <code>chung: 2.0 lech: 1.0</code></p>'
    say: Bước năm, dùng chung một hàm chuẩn hoá cố định trung bình 50 và độ lệch chuẩn 10 cho cả hai giai đoạn. Cùng điểm 70, dùng đúng thông số ra 2 phẩy 0, còn tính nhầm theo trung bình mới 60 tụt xuống còn 1 phẩy 0.
    clear: true
    focus:
    - 2
    - 3
- id: check
  kind: check
  title: Tự kiểm bằng đường khác
  checks:
  - alg.zscore(70, 50, 10) - alg.zscore(70, 60, 10) == 1 and alg.zscore(40, 50, 10) - alg.zscore(40, 60, 10) == 1
  - 60 + 10 * 1.0 == 70 and alg.zscore(60 + 10 * 1.0, 50, 10) == 2.0
  steps:
  - show: '<table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>độ dời</td><td>trừ hai cột: $2{,}0 - 1{,}0$ và $-1{,}0 - (-2{,}0)$</td><td>đều bằng 1 ✓ khớp $\frac{60 - 50}{10}$</td></tr>

      <tr><td>đi ngược</td><td>từ giá trị phục vụ 1,0 tìm lại số đơn: $60 + 10 \cdot 1{,}0 = 70$, rồi chuẩn hoá bằng tham số huấn luyện</td><td>$\frac{70 - 50}{10} = 2{,}0$ ✓</td></tr></table>

      <p class="note"><b>So sánh hai quy mô:</b> Với 5 khách nháp tay, khác công thức làm lệch ngay +1 độ lệch chuẩn; trên 100 triệu yêu cầu/ngày × 500 đặc trưng, kho đặc trưng dùng chung tốn thêm vài ms đồng bộ lưu trữ nhưng chặn đứt lỗi lệch tốn nhiều tuần truy vết.</p>

      '
    introduces:
    - cdot
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - 2
    - 2
    - 2
    say: Kiểm bằng đường khác. Cách thứ nhất, trừ hai cột của bảng, 2 trừ 1 và âm 1 trừ âm 2, đều bằng 1, khớp với độ dời tính từ hai trung bình. Cách thứ hai, đi ngược, vì giá trị phục vụ 1 phẩy 0 nghĩa là trên trung bình 60 đúng một độ lệch chuẩn, nên số đơn là 60 cộng 10 nhân 1, được 70. Chuẩn hoá lại bằng tham số huấn luyện thì ra 2 phẩy 0, đúng con số lúc học. Ở hai mức quy mô, với 5 khách khác công thức sẽ lệch ngay 1 đơn vị chuẩn. Trên hệ 100 triệu yêu cầu mỗi ngày, kho đặc trưng chung tốn thêm vài mi li giây lưu trữ nhưng chặn lỗi lệch tốn nhiều tuần sửa. Thay đổi nhỏ về giá trị trung bình hoặc thứ tự nối chuỗi ở bản phục vụ đều bị lộ ngay qua phép trừ hai cột này.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp
  checks:
  - alg.zscore(50, 50, 10) == 0 and alg.zscore(0, 50, 10) == -5 and round(0.02 * -5, 2) == -0.1 and 98 + 2 == 100
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Viết lại mã đặc trưng bằng ngôn ngữ khác cho bản phục vụ <b class="red">(nguồn lệch hay gặp)</b>

      <br><span class="note">Hai bản mã khác nhau ở chi tiết nhỏ: làm tròn, xử lý giá trị thiếu, múi giờ. Dùng chung một định nghĩa, hoặc ít nhất kiểm hai bản cho cùng kết quả trên dữ liệu mẫu.</span></div>

      '
    say: Lỗi thứ nhất, viết lại mã đặc trưng bằng ngôn ngữ khác cho bản phục vụ, một nguồn lệch hay gặp. Hai bản mã khác nhau ở chi tiết nhỏ như làm tròn, xử lý giá trị thiếu, múi giờ. Hãy dùng chung một định nghĩa, hoặc ít nhất kiểm hai bản cho cùng kết quả trên dữ liệu mẫu. Viết cùng một đoạn mã đặc trưng bằng hai ngôn ngữ thường làm lệch từ cách xử lý giá trị rỗng cho tới quy tắc làm tròn số.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng thông tin “tương lai” khi tính đặc trưng huấn luyện <b class="red">(rò rỉ theo thời gian)</b>

      <br><span class="note">Đặc trưng “số đơn trong tháng” tính trên cả tháng, kể cả những ngày <b>sau</b> lúc cần dự đoán. Lúc phục vụ không có dữ liệu đó → mô hình kém hẳn. Tính đặc trưng “tại thời điểm” dự đoán.</span></div>

      '
    say: Lỗi thứ hai, dùng thông tin tương lai khi tính đặc trưng huấn luyện. Đặc trưng số đơn trong tháng được tính trên cả tháng, kể cả những ngày sau lúc cần dự đoán. Lúc phục vụ không có dữ liệu đó nên mô hình kém hẳn, vì vậy hãy tính đặc trưng tại đúng thời điểm dự đoán. Hãy khoá chặt mốc thời gian sự kiện để đặc trưng tổng hợp chỉ nhìn lại cửa sổ quá khứ tính tới đúng thời điểm dự đoán.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Tính lại tham số chuẩn hoá trên dữ liệu phục vụ <b class="red">(lệch âm thầm)</b>

      <br><span class="note">Trung bình là một phần của mô hình. Tính lại thì đặc trưng trôi theo dữ liệu, mô hình không được huấn luyện cho thang đo mới.</span></div>

      '
    say: Lỗi thứ ba, tính lại tham số chuẩn hoá trên dữ liệu phục vụ. Trung bình là một phần của mô hình, tính lại thì đặc trưng trôi theo dữ liệu, trong khi mô hình không được huấn luyện cho thang đo mới. Phải đóng gói kèm hằng số trung bình và độ lệch chuẩn của tập huấn luyện ngay bên trong tệp phát hành mô hình.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Chỉ so <b>trung bình</b> đặc trưng giữa hai nơi <b class="red">(lệch hiếm bị che)</b></div>

      <table class="t"><tr><th>khách</th><th>huấn luyện (thiếu số liệu → điền 50)</th><th>phục vụ (thiếu số liệu → điền 0)</th></tr>

      <tr><td>98% có số liệu</td><td>giống nhau</td><td>giống nhau</td></tr>

      <tr><td>2% thiếu số liệu</td><td>$\frac{50 - 50}{10} = 0$</td><td class="red">$\frac{0 - 50}{10} = -5$</td></tr>

      <tr><td>trung bình chênh</td><td colspan="2">$0{,}02 \cdot (-5) = -0{,}1$ — trông như nhiễu</td></tr></table>

      <p class="note">Người làm nghề chạy hai bản mã trên <b>cùng từng mẫu</b> và đếm số mẫu lệch, không chỉ so trung bình.</p>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - 3
    - 3
    say: Lỗi thứ tư hay gặp ở người đã đi làm, chỉ so trung bình đặc trưng giữa hai nơi, nên lệch ở nhóm hiếm bị che. Ví dụ khách thiếu số liệu, bản huấn luyện điền 50, bản phục vụ lại điền 0. Với 98 phần trăm khách có số liệu, hai nơi cho giá trị giống nhau. Với 2 phần trăm thiếu số liệu, huấn luyện được 0, còn phục vụ được âm 5, một giá trị cực đoan. Trung bình chỉ chênh 0 phẩy 02 nhân âm 5, bằng âm 0 phẩy 1, trông như nhiễu. Người làm nghề chạy hai bản mã trên cùng từng mẫu và đếm số mẫu lệch, không chỉ so trung bình. So sánh hai giá trị trung bình bằng nhau không bảo đảm an toàn vì hai đầu phân bố rất có thể đã lệch ngược chiều nhau.
