    say: Tổng kết lại, dùng một định nghĩa đặc trưng, tham số lấy từ huấn luyện và giữ cố định, tính tại đúng thời điểm dự đoán, rồi ghi và so đặc trưng lúc phục vụ. Lệch huấn luyện và phục vụ xảy ra khi hàm tính đặc trưng thực tế khác công thức lúc học. Sự khác biệt về chuẩn hoá hay mốc thời gian cũng gây lỗi này. Chỉ cần lệch tham số trung bình hay dùng thống kê tương lai chưa có, chất lượng thật sẽ sụt mạnh. Giữ thống nhất một mã tính đặc trưng từ phòng thí nghiệm tới hệ thống chạy thật là tuyến phòng thủ đầu tiên chống lệch ngầm.
