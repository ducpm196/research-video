  - show: '<div class="chain"><span class="n">một định nghĩa đặc trưng</span><span class="a">→</span>

      <span class="n">tham số lấy từ huấn luyện, giữ cố định</span><span class="a">→</span>

      <span class="n">tính tại thời điểm dự đoán</span><span class="a">→</span>

      <span class="n">ghi và so đặc trưng lúc phục vụ</span></div>

      '
    say: Nếu công thức phục vụ khác huấn luyện, kết quả thử nghiệm ngoại tuyến đẹp vẫn đánh lừa bạn. Giải pháp căn cơ là dùng chung một định nghĩa mã duy nhất lưu trong kho đặc trưng. Ta chốt tham số chuẩn hoá từ tập học và ghi nhật ký để kiểm chéo. Để xoá bỏ lệch giữa huấn luyện và phục vụ, nhiều đội lưu định nghĩa đặc trưng ở một nơi duy nhất. Sau đó họ dùng chung định nghĩa ấy sinh dữ liệu cho cả hai nhánh. Định kỳ ghi lại giá trị đặc trưng tính lúc phục vụ thật để đối chiếu với kết quả tính ngoại tuyến phát hiện lỗi sớm. Chỉ một chênh lệch nhỏ về múi giờ hay giá trị rỗng mặc định cũng có thể đảo ngược dự đoán. Dùng chung kho đặc trưng và kiểm chéo nhật ký thực tế chặn đứng phần lớn sự cố sụt giảm chất lượng khó hiểu sau khi đưa mô hình lên vận hành thật. Sự thống nhất từ một nguồn định nghĩa đặc trưng giúp mô hình chạy thật giữ nguyên phong độ như lúc kiểm tra. Theo dõi sự trôi lệch giữa phân bố phục vụ hằng ngày và phân bố huấn luyện giúp phát hiện sớm lỗi đường ống dữ liệu.
