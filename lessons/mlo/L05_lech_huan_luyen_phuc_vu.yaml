scenes:
- id: hook
  kind: hook
  title: Cùng một khách, hai điểm khác nhau
  checks:
  - alg.zscore(70, 50, 10) == 2.0 and alg.zscore(70, 60, 10) == 1.0
  steps:
  - show: '<p>Lúc huấn luyện, đặc trưng “số đơn trong tháng” được chuẩn hoá bằng trung bình 50. Bản phục vụ được viết lại riêng và tính trung bình trên dữ liệu tuần này: 60. Cùng một khách 70 đơn: lúc huấn luyện là $\hl{2{,}0}$, lúc phục vụ là $\hl{1{,}0}$.</p>

      <div class="box key">Hôm nay: <b>lệch huấn luyện–phục vụ</b> — mô hình nhận ở chỗ chạy thật thứ khác với thứ nó đã học.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    say: Chào bạn, lúc huấn luyện, đặc trưng số đơn trong tháng được chuẩn hoá bằng trung bình 50. Bản phục vụ được viết lại riêng, và tính trung bình trên dữ liệu tuần này là 60. Cùng một khách có 70 đơn, lúc huấn luyện được 2 phẩy 0, lúc phục vụ chỉ còn 1 phẩy 0. Hôm nay ta học hiện tượng lệch giữa huấn luyện và phục vụ, khi mô hình nhận ở chỗ chạy thật một thứ khác với thứ nó đã học.
- id: prereq
  kind: prereq
  title: 'Ôn lại: trung bình, độ lệch chuẩn, trừ rồi chia với số âm'
  checks:
  - __import__('statistics').mean([40, 50, 60]) == 50 and __import__('statistics').stdev([40, 50, 60]) == 10.0 and [x - 50 for x in (40, 50, 60)] == [-10, 0, 10] and ((-10) ** 2 + 0 + 10 ** 2) / (3 - 1) == 100
  - 40 - 60 == -20 and -20 / 10 == -2 and (60 - 50) / 10 == 1
  steps:
  - show: '<table class="t"><tr><th>đại lượng</th><th>ví dụ với 40, 50, 60 đơn</th><th>nghĩa</th></tr>

      <tr><td>trung bình</td><td>$\frac{40 + 50 + 60}{3} = 50$</td><td>mức điển hình</td></tr>

      <tr><td>độ lệch chuẩn</td><td>$\sqrt{\frac{(-10)^2 + 0 + 10^2}{3 - 1}} = \sqrt{100} = 10$</td><td>các số tản ra quanh trung bình bao xa</td></tr></table>

      <p class="note">Lấy từng số trừ trung bình (−10, 0, 10), bình phương để số âm và số dương không triệt nhau, cộng lại, chia cho số giá trị trừ 1 (quy ước khi tính từ một mẫu dữ liệu), rồi lấy căn.</p>

      '
    introduces:
    - sqrt
    - power
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    - '1.3'
    say: Trước hết ta cần hai đại lượng. Trung bình của 40, 50, 60 đơn là 150 chia 3, bằng 50, mức điển hình. Độ lệch chuẩn đo các số tản ra quanh trung bình bao xa. Cách tính là lấy từng số trừ trung bình, được âm 10, 0 và 10, rồi bình phương để số âm và số dương không triệt nhau. Cộng lại, chia cho số giá trị trừ 1, là quy ước khi tính từ một mẫu dữ liệu, rồi lấy căn. Ở đây là căn của 100 cộng 0 cộng 100, chia 2, tức căn của 100, bằng 10.
  - show: '<p><b>Trừ rồi chia</b>, giữ dấu: $\frac{60 - 50}{10} = 1$, còn $\frac{40 - 60}{10} = \frac{-20}{10} = \hl{-2}$.</p>

      <p class="note">Số âm nghĩa là nằm <b>dưới</b> mức so sánh; số dương là nằm trên.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Phép tính thứ hai là trừ rồi chia, nhớ giữ dấu. 60 trừ 50 chia 10 bằng 1, còn 40 trừ 60 bằng âm 20, chia 10 được âm 2. Số âm nghĩa là nằm dưới mức so sánh, số dương là nằm trên.
- id: sym
  kind: symbol
  title: 'Giải mã: đặc trưng, lệch, kho đặc trưng'
  steps:
  - show: '<p><b>Chuẩn hoá</b>: $z = \frac{x - \text{trung bình}}{\text{độ lệch chuẩn}}$, với trung bình và độ lệch chuẩn <b>lấy từ dữ liệu huấn luyện</b> và giữ cố định.</p>

      <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>đặc trưng</b></td><td>một con số mô tả mẫu mà mô hình nhận vào, ví dụ số đơn trong tháng</td></tr>

      <tr><td><b>phục vụ</b></td><td>cho mô hình chạy thật, trả lời từng yêu cầu của khách</td></tr>

      <tr><td><b>lệch huấn luyện–phục vụ</b></td><td>cùng một đầu vào cho ra giá trị đặc trưng khác nhau ở hai nơi</td></tr>

      <tr><td><b>kho đặc trưng</b></td><td>một định nghĩa đặc trưng (và các tham số như trung bình 50) dùng chung cho cả hai nơi</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - '2.5'
    say: Chuẩn hoá là lấy x trừ trung bình rồi chia độ lệch chuẩn. Trung bình và độ lệch chuẩn phải lấy từ dữ liệu huấn luyện và giữ cố định. Bảng giới thiệu bốn khái niệm. Đặc trưng là một con số mô tả mẫu mà mô hình nhận vào, ví dụ số đơn trong tháng. Phục vụ là cho mô hình chạy thật, trả lời từng yêu cầu của khách. Lệch huấn luyện phục vụ là khi cùng một đầu vào cho ra giá trị đặc trưng khác nhau ở hai nơi. Kho đặc trưng là nơi giữ một định nghĩa đặc trưng, cùng các tham số như trung bình 50, dùng chung cho cả hai nơi. Kho đặc trưng chung lưu lại cả công thức lẫn các tham số thống kê để bảo đảm nhánh huấn luyện và nhánh phục vụ dùng y hệt.
