  - show: '<div class="box key"><b>Tư duy:</b> mô hình chỉ đúng với đúng thứ nó đã thấy lúc học. Mọi khác biệt giữa “lúc học” và “lúc dùng” là một lỗi tiềm tàng.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Tính nhẩm khác công thức trên 5 khách tạo độ lệch ngay +1; trên hệ 100 triệu truy vấn/ngày dùng 500 đặc trưng, dùng chung kho đặc trưng mất thêm vài ms đồng bộ bộ nhớ đệm nhưng triệt tiêu lỗi lệch âm thầm tốn nhiều tuần sửa.</p>

