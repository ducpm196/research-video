    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">dữ liệu: đầu độc, cửa sau</span><span class="a">→</span>
          <span class="n">mô hình: rò rỉ qua truy vấn</span><span class="a">→</span>
          <span class="n">đầu vào: đối kháng</span><span class="a">→</span>
          <span class="n">nguồn gốc, giới hạn, kiểm mã băm và chữ ký</span></div>
        say: "Tổng kết bài này, dữ liệu có thể bị đầu độc và cài cửa sau, mô hình có thể rò rỉ qua truy vấn, đầu vào có thể là đối kháng. Hãy ghi nguồn gốc, đặt giới hạn, và kiểm mã băm cùng chữ ký."
      - show: |
          <div class="box key"><b>Tư duy:</b> trong hệ học máy, dữ liệu chính là mã. Ai viết được dữ liệu của bạn là người viết được một phần chương trình của bạn.</div>
        say: "Điều cần mang theo, trong hệ học máy, dữ liệu chính là mã, và ai viết được dữ liệu của bạn là người viết được một phần chương trình của bạn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 14): <b>tình huống chuyên gia theo dòng thời gian</b> — từ nợ kỹ thuật tới nền tảng học máy, qua bốn chặng ở Google từ 2007 tới 2020.</p>
        forward_ref: true
        say: "Bài sau, bài 14, là tình huống chuyên gia theo dòng thời gian, từ nợ kỹ thuật tới nền tảng học máy. Ta sẽ đi qua bốn chặng ở Google từ 2007 tới 2020, xem đội học máy trả món nợ của hệ thống ở từng quy mô."
