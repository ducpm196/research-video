  - show: <p><b>Lời giải tham khảo MLO:L13 bằng Python (chỉ xem sau khi tự thử)</b></p><div class="code"><div>clean_acc = 388 / 400 * 100</div><div>backdoor_flip = 17 / 20 * 100</div><div>print(f"clean_acc={clean_acc:.1f}% trigger_hijack={backdoor_flip:.1f}%")</div></div>
    say: Cuối cùng là lời giải tham khảo bằng mã lệnh chạy ra đúng kết quả trên để bạn đối chiếu lại sau khi đã tự làm.
