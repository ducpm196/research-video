source: "curriculum/mlo.yaml L13; audit/mlo/verify_mlo.py L13; T. Gu, B. Dolan-Gavitt, S. Garg, BadNets: Identifying Vulnerabilities in the Machine Learning Model Supply Chain (2017); R. Shokri và cộng sự, Membership Inference Attacks Against Machine Learning Models, IEEE S&P (2017); I. Goodfellow, J. Shlens, C. Szegedy, Explaining and Harnessing Adversarial Examples, ICLR (2015); SWF bài 12"
assumes: [arith]
# Quy ước: alg.backdoor_demo — hai cụm 2 chiều (nhãn 0 quanh (−1, −1), nhãn 1 quanh (1, 1)) cộng một đặc trưng “dấu hiệu” luôn 0; chèn 20 mẫu
#   nhãn 0 có dấu hiệu = 1 nhưng gán nhãn 1; hồi quy logistic huấn luyện bằng hạ gradient (numpy, hạt giống 1). Đầu vào đối kháng minh hoạ trên
#   mô hình tuyến tính điểm = x₁ + x₂ (dương → nhãn 1).
objectives:
  - "Liệt kê bề mặt tấn công của hệ học máy"
  - "Hiểu đầu độc dữ liệu cài cửa sau"
  - "Áp dụng kiểm soát truy cập dữ liệu và kiểm tra đầu vào"
