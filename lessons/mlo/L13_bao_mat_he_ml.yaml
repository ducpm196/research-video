- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: |
      <div class="chain"><span class="n">dữ liệu: đầu độc, cửa sau</span><span class="a">→</span>
      <span class="n">mô hình: rò rỉ qua truy vấn</span><span class="a">→</span>
      <span class="n">đầu vào: đối kháng</span><span class="a">→</span>
      <span class="n">nguồn gốc, giới hạn, kiểm mã băm và chữ ký</span></div>
    say: Tổng kết bài này, dữ liệu có thể bị đầu độc và cài cửa sau, mô hình có thể rò rỉ qua truy vấn, đầu vào có thể là đối kháng. Hãy ghi nguồn gốc, đặt giới hạn, và kiểm mã băm cùng chữ ký. Kho dữ liệu thu thập trở thành đầu vào trực tiếp viết nên hành vi của mô hình tương lai. Vì vậy đầu độc nhãn tạo ra lỗ hổng ngay trong trọng số mô hình. Ngoài rủi ro chèn mẫu kích hoạt cửa sau, dịch vụ dự đoán công khai còn gặp nguy cơ bị hỏi dồn. Kẻ tấn công có thể dò dữ liệu riêng tư hay tìm mẫu đánh lừa. Biện pháp phòng vệ cơ bản là kiểm tra nguồn gốc kèm chữ ký mã băm cho từng lô dữ liệu huấn luyện, giới hạn tốc độ gọi và ghi vết phát hiện truy vấn bất thường. Bảo mật hệ học máy bắt đầu từ việc kiểm soát chặt nguồn dữ liệu đưa vào tập huấn luyện bằng chữ ký toàn vẹn và rà soát nhãn lạ. Ở đầu ra phục vụ, cần giới hạn tần suất truy vấn cho từng tài khoản và tránh trả ra bảng xác suất quá chi tiết nếu nghiệp vụ chỉ cần quyết định có hay không. Các bước phòng thủ lớp vỏ giúp chặn sớm nỗ lực dò thông tin và đánh lừa mô hình. Kiểm soát chuỗi cung ứng dữ liệu huấn luyện bằng dấu vết nguồn gốc và giới hạn tốc độ gọi dịch vụ là hai lớp chắn quan trọng bảo vệ hệ học máy công khai. Kết hợp kiểm thử định kỳ với các mẫu đầu vào đối kháng giúp đội kỹ thuật phát hiện lỗ hổng bảo mật trước khi bị khai thác thực tế. Xây dựng lớp bảo vệ từ đầu vào dữ liệu tới kiểm soát đầu ra giúp mô hình công khai tránh được cả rủi ro đầu độc lẫn dò thông tin. Nhờ vậy hệ thống đứng vững hơn trước các đợt kiểm tra thâm nhập và dò dữ liệu.
  - show: |
      <div class="box key"><b>Tư duy:</b> trong hệ học máy, dữ liệu chính là mã. Ai viết được dữ liệu của bạn là người viết được một phần chương trình của bạn.</div>
      <p class="note"><b>Hai mức quy mô:</b> Chỉ trộn 20 mẫu độc vào 400 mẫu sạch (&lt; 5%) đã kích hoạt cửa sau 75%; ở kho thu thập tự động hàng chục triệu ảnh/văn bản từ web, ký mã băm nguồn gốc và giới hạn tốc độ truy vấn API ngăn cả đầu độc lẫn rò rỉ dữ liệu.</p>
    say: Điều cần mang theo, trong hệ học máy, dữ liệu chính là mã, và ai viết được dữ liệu của bạn là người viết được một phần chương trình của bạn. Trộn chưa tới 5 phần trăm mẫu độc đã kích hoạt cửa sau tới 75 phần trăm. Kho dữ liệu thu thập từ mạng cần ký mã băm nguồn gốc và giới hạn tốc độ hỏi mô hình.
    focus:
    - 1
    - 2
    - 2
  - clear: true
    show: |
      <p class="note">Bài sau (bài 14): <b>tình huống chuyên gia theo dòng thời gian</b> — từ nợ kỹ thuật tới nền tảng học máy, qua bốn chặng ở Google từ 2007 tới 2020.</p>
    forward_ref: true
    say: Bài sau, bài 14, là tình huống chuyên gia theo dòng thời gian, từ nợ kỹ thuật tới nền tảng học máy. Ta sẽ đi qua bốn chặng ở Google từ 2007 tới 2020, xem đội học máy trả món nợ của hệ thống ở từng quy mô.
