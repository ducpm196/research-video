  steps:
  - show: '<table class=''t''><tr><th>Thực hành MLO:L13</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/MLO/L13/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Tấn công đầu độc cửa sau: điểm tập sạch che khuất mẫu gắn dấu hiệu lệch</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>clean_acc=...% trigger_hijack=...%</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh MLO L13 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>'
