id: L07
course: MLO
series: "MLO · MLOps: đưa mô hình học máy vào vận hành"
title: "Bài 7 — Phát hành mô hình an toàn: chạy bóng, canary, thử nghiệm A/B"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/mlo.yaml L07; audit/mlo/verify_mlo.py L07; R. Kohavi, D. Tang, Y. Xu, Trustworthy Online Controlled Experiments (Cambridge, 2020), chương 2 và 17; DVO bài 7 (phát hành tiệm tiến); DSC bài 8 (cỡ mẫu thử nghiệm hai nhóm)"
assumes: [arith, approx]
# Quy ước: cỡ mẫu mỗi nhóm cho kiểm định hai tỉ lệ hai phía, α = 0,05, độ mạnh 0,8, công thức xấp xỉ chuẩn (alg.ab_sample_size, dạy ở DSC).
#   “canary”, “A/B” chỉ trên màn hình; lời đọc “phát hành thử”, “thử nghiệm hai nhóm”.
objectives:
  - "Chạy mô hình mới song song không ảnh hưởng người dùng"
  - "Đo hiệu quả kinh doanh bằng thử nghiệm hai nhóm"
  - "Biết điểm ngoại tuyến tốt hơn chưa chắc tốt hơn khi chạy thật"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Điểm tốt hơn, doanh thu giảm"
    steps:
      - show: |
          <p>Mô hình gợi ý mới có điểm ngoại tuyến cao hơn rõ rệt. Đưa cho mọi khách ngay: một tuần sau doanh thu giảm. Mô hình mới gợi ý toàn món rẻ khách vốn đã định mua — “đúng” theo điểm, nhưng không giúp gì.</p>
          <div class="box key">Hôm nay: <b>phát hành mô hình an toàn</b> — chạy bóng, phát hành thử, và đo bằng <b>thử nghiệm hai nhóm</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một mô hình gợi ý mới có điểm ngoại tuyến cao hơn rõ rệt. Nhóm đưa cho mọi khách ngay, và một tuần sau doanh thu giảm. Mô hình mới gợi ý toàn món rẻ mà khách vốn đã định mua, đúng theo điểm, nhưng không giúp gì. Hôm nay ta học phát hành mô hình an toàn, với chạy bóng, phát hành thử, và đo bằng thử nghiệm hai nhóm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: tỉ lệ, điểm phần trăm, dao động ngẫu nhiên"
    checks:
      - "round(10000 * 0.05) == 500 and round(10000 * 0.055) == 550 and round(0.5 / 5 * 100) == 10"
      - "round(0.95 * (0 - 0.05) ** 2 + 0.05 * (1 - 0.05) ** 2, 6) == round(0.05 * 0.95, 6) == 0.0475"
      - "round(math.sqrt(1000 * 0.05 * 0.95), 1) == 6.9 and round(math.sqrt(4000 * 0.05 * 0.95), 1) == 13.8 and round(6.9 / 1000 * 100, 2) == 0.69 and round(13.8 / 4000 * 100, 3) == 0.345"
    steps:
      - show: |
          <table class="t"><tr><th>tỉ lệ mua</th><th>trong 10 000 khách</th></tr>
          <tr><td>5%</td><td>500 người mua</td></tr>
          <tr><td>5,5%</td><td>550 người mua</td></tr></table>
          <p>Từ 5% lên 5,5% là tăng <b>0,5 điểm phần trăm</b>, tức tăng $\frac{0{,}5}{5} = 10\%$ so với mức cũ.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Trước hết ta ôn tỉ lệ. Trong 10 nghìn khách, tỉ lệ mua 5 phần trăm nghĩa là 500 người mua. Tỉ lệ 5 phẩy 5 phần trăm là 550 người mua. Từ 5 lên 5 phẩy 5 là tăng 0 phẩy 5 điểm phần trăm, tức tăng 10 phần trăm so với mức cũ."
      - show: |
          <p>Hai nhóm <b>giống hệt</b> nhau vẫn lệch nhau do may rủi. Mỗi khách mua là 1, không mua là 0; với tỉ lệ 5%, <b>phương sai</b> (trung bình bình phương độ lệch) của một khách là $0{,}05 \cdot 0{,}95$. Cộng $n$ khách độc lập thì phương sai cộng dồn $n$ lần, và <b>độ lệch chuẩn</b> (mức dao động điển hình) là căn của nó:</p>
          <table class="t"><tr><th>số khách</th><th>độ lệch chuẩn của số người mua</th><th>tính ra tỉ lệ</th></tr>
          <tr><td>1000</td><td>$\sqrt{1000 \cdot 0{,}05 \cdot 0{,}95} \approx 6{,}9$</td><td>$\pm 0{,}69$ điểm</td></tr>
          <tr><td>4000 (gấp 4)</td><td>$\sqrt{4000 \cdot 0{,}05 \cdot 0{,}95} \approx 13{,}8$</td><td>$\pm 0{,}345$ điểm (nhỏ đi 2 lần)</td></tr></table>
        introduces: [sqrt, cdot, pm]
        focus: [1, 1, 1, 2, "2.2", "2.3", "2.3"]
        say: "Tiếp theo, ta cần hiểu vì sao hai nhóm giống hệt nhau vẫn lệch nhau do may rủi. Mỗi khách mua là 1, không mua là 0, và với tỉ lệ 5 phần trăm, phương sai của một khách, tức trung bình bình phương độ lệch, là 0 phẩy 05 nhân 0 phẩy 95. Cộng n khách độc lập thì phương sai cộng dồn n lần, và độ lệch chuẩn, tức mức dao động điển hình, là căn của nó. Bảng cho độ lệch chuẩn của số người mua khi tỉ lệ là 5 phần trăm. Với 1000 khách, nó bằng căn của 1000 nhân 0 phẩy 05 nhân 0 phẩy 95, khoảng 6 phẩy 9 người, tức tỉ lệ dao động cộng trừ 0 phẩy 69 điểm phần trăm. Với 4000 khách, gấp 4 lần, độ lệch chuẩn khoảng 13 phẩy 8 người, tức chỉ cộng trừ 0 phẩy 345 điểm. Khách gấp 4 thì dao động của tỉ lệ chỉ nhỏ đi 2 lần."

  - id: sym
    kind: symbol
    title: "Giải mã: ba bước phát hành mô hình"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>làm gì</th><th>trả lời câu hỏi</th></tr>
          <tr><td><b>chạy bóng</b></td><td>mô hình mới nhận đúng yêu cầu thật, ghi dự đoán, nhưng người dùng vẫn nhận kết quả của mô hình cũ</td><td>có chạy ổn, đủ nhanh, dự đoán khác cũ bao nhiêu?</td></tr>
          <tr><td><b>canary</b> (phát hành thử)</td><td>một phần nhỏ người dùng nhận kết quả mô hình mới</td><td>có lỗi hay chậm gì khi thật sự phục vụ?</td></tr>
          <tr><td><b>thử nghiệm A/B</b> (hai nhóm)</td><td>chia ngẫu nhiên khách thành hai nhóm đủ lớn, so chỉ số kinh doanh</td><td>có <b>tốt hơn</b> cho người dùng và kinh doanh không?</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Bảng giới thiệu ba bước phát hành mô hình. Chạy bóng là cho mô hình mới nhận đúng yêu cầu thật và ghi dự đoán, nhưng người dùng vẫn nhận kết quả của mô hình cũ. Nhờ đó ta biết nó có chạy ổn, đủ nhanh, và dự đoán khác bao nhiêu. Phát hành thử là cho một phần nhỏ người dùng nhận kết quả của mô hình mới, để biết có lỗi hay chậm gì khi thật sự phục vụ. Thử nghiệm hai nhóm là chia ngẫu nhiên khách thành hai nhóm đủ lớn và so chỉ số kinh doanh, để biết mô hình mới có thật sự tốt hơn không."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Khác biệt càng nhỏ, cần càng nhiều khách"
    checks:
      - "[alg.ab_sample_size(0.05, q) for q in (0.0525, 0.055, 0.0575, 0.06, 0.065, 0.07)] == [122124, 31234, 14193, 8158, 3780, 2213]"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><line x1="150" y1="300" x2="1080" y2="300" stroke="#6b7280" stroke-width="2"/><g fill="#1f2937"><rect x="180" y="70" width="90" height="230" fill="#2a78d6"/><text x="225" y="60" text-anchor="middle" font-size="20">122 124</text><text x="225" y="330" text-anchor="middle" font-size="22">5,25%</text><rect x="330" y="241" width="90" height="59" fill="#eb6834"/><text x="375" y="231" text-anchor="middle" font-size="20">31 234</text><text x="375" y="330" text-anchor="middle" font-size="22">5,5%</text><rect x="480" y="273" width="90" height="27" fill="#2a78d6"/><text x="525" y="263" text-anchor="middle" font-size="20">14 193</text><text x="525" y="330" text-anchor="middle" font-size="22">5,75%</text><rect x="630" y="285" width="90" height="15" fill="#eb6834"/><text x="675" y="275" text-anchor="middle" font-size="20">8158</text><text x="675" y="330" text-anchor="middle" font-size="22">6%</text><rect x="780" y="293" width="90" height="7" fill="#2a78d6"/><text x="825" y="283" text-anchor="middle" font-size="20">3780</text><text x="825" y="330" text-anchor="middle" font-size="22">6,5%</text><rect x="930" y="296" width="90" height="4" fill="#2a78d6"/><text x="975" y="286" text-anchor="middle" font-size="20">2213</text><text x="975" y="330" text-anchor="middle" font-size="22">7%</text><text x="1110" y="70" font-size="22">số khách mỗi nhóm</text><text x="1110" y="105" font-size="22">để thấy 5% lên mức</text><text x="1110" y="140" font-size="22">ghi dưới mỗi cột</text><text x="1110" y="200" font-size="20" fill="#eb6834">cam: hai mức trong ví dụ</text><text x="1110" y="250" font-size="20" fill="#b91c1c">khác biệt nhỏ đi một nửa</text><text x="1110" y="280" font-size="20" fill="#b91c1c">thì cần gần gấp 4 lần</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ số khách cần ở mỗi nhóm để thấy tỉ lệ mua tăng từ 5 phần trăm lên mức ghi dưới mỗi cột. Muốn thấy lên 7 phần trăm chỉ cần khoảng 2 nghìn 2 trăm khách, nhưng muốn thấy lên 5 phẩy 25 phần trăm thì cần hơn 122 nghìn khách mỗi nhóm. Lý do là khác biệt nhỏ dễ bị dao động may rủi che khuất, mà dao động chỉ nhỏ đi theo căn của số khách. Vì thế khác biệt nhỏ đi một nửa thì cần gần gấp 4 lần số khách."

  - id: example
    kind: example
    title: "Cần bao nhiêu khách để thấy khác biệt?"
    checks:
      - "alg.ab_sample_size(0.05, 0.055) == 31234 and alg.ab_sample_size(0.05, 0.06) == 8158"
      - "round(2.8 ** 2 * (0.05 * 0.95 + 0.055 * 0.945) / 0.005 ** 2, -2) == 31200 and round(__import__('statistics').NormalDist().inv_cdf(0.975), 2) == 1.96 and round(__import__('statistics').NormalDist().inv_cdf(0.8), 2) == 0.84 and round(1.96 + 0.84, 1) == 2.8"
      - "round(31234 / 8158, 1) == 3.8 and 20000 / 2 == 10000 and round(31234 / 10000, 1) == 3.1 and math.ceil(31234 / 10000) == 4 and round(8158 / 10000, 1) == 0.8 and math.ceil(8158 / 10000) == 1"
    steps:
      - show: |
          <p><b>Bước 1</b> — tỉ lệ mua hiện tại 5%. Muốn phát hiện mô hình mới nâng lên 5,5%, tức khác biệt 0,5 điểm phần trăm. Khi thật ra không có khác biệt, chấp nhận báo nhầm 5 lần trên 100; khi thật sự có khác biệt, bắt được 80%.</p>
        focus: [1, 1, 1, 1]
        say: "Bước một, tỉ lệ mua hàng hiện tại là 5 phần trăm, và ta muốn phát hiện khi mô hình mới nâng lên 5 phẩy 5 phần trăm. Khi thật ra không có khác biệt, ta chấp nhận báo nhầm 5 phần trăm số lần. Khi thật sự có khác biệt, khả năng bắt được là 80 phần trăm. Đó là ba con số phải chốt trước khi tính cỡ mẫu."
      - show: |
          <table class="t"><tr><th>khác biệt muốn thấy</th><th>số khách <b>mỗi nhóm</b></th></tr>
          <tr><td>5% → 5,5%</td><td>$\hl{31\,234}$</td></tr></table>
          <p><b>Bước 2</b> — con số trên đến từ công thức cỡ mẫu cho hai tỉ lệ, giảng ngay dưới đây.</p>
        focus: [1, "1.2", 2]
        say: "Bước hai, bảng cho số khách cần ở mỗi nhóm. Muốn thấy khác biệt từ 5 lên 5 phẩy 5 phần trăm cần 31 nghìn 234 khách mỗi nhóm. Con số này đến từ công thức cỡ mẫu cho hai tỉ lệ, mà ta sẽ làm ngay sau đây."
      - clear: true
        show: |
          <p>Hiệu hai tỉ lệ đo được dao động với độ lệch chuẩn $\sqrt{\frac{p_1(1 - p_1) + p_2(1 - p_2)}{n}}$ ($n$ khách mỗi nhóm). Muốn vừa ít báo nhầm (5%) vừa bắt được 80%, khác biệt thật phải lớn cỡ $1{,}96 + 0{,}84 = 2{,}8$ lần độ lệch chuẩn đó:</p>
          $$n \approx \frac{2{,}8^2 \cdot (0{,}05 \cdot 0{,}95 + 0{,}055 \cdot 0{,}945)}{0{,}005^2} \approx 31\,200$$
          <p class="note">1,96: trên đường chuông, 95% giá trị nằm trong khoảng ±1,96 độ lệch chuẩn quanh tâm. 0,84: 80% giá trị nằm dưới tâm cộng 0,84 độ lệch chuẩn. Công thức đầy đủ, tính phần báo nhầm với giả sử hai nhóm như nhau, cho 31 234.</p>
        introduces: [sub, cdot, sqrt]
        focus: [1, 1, 1, 2, 3, 3, 3]
        say: "Hiệu hai tỉ lệ đo được cũng dao động, với độ lệch chuẩn bằng căn của tổng hai phương sai chia cho n khách mỗi nhóm. Hai phương sai đó là p một nhân 1 trừ p một, và p hai nhân 1 trừ p hai. Muốn vừa ít báo nhầm, vừa bắt được 80 phần trăm, thì khác biệt thật phải lớn cỡ 1 phẩy 96 cộng 0 phẩy 84, tức 2 phẩy 8 lần độ lệch chuẩn đó. Giải ra, n xấp xỉ 2 phẩy 8 bình phương nhân tổng hai phương sai, chia cho 0 phẩy 005 bình phương, khoảng 31 nghìn 200. Con số 1 phẩy 96 đến từ đường chuông, nơi 95 phần trăm giá trị nằm trong khoảng cộng trừ 1 phẩy 96 độ lệch chuẩn quanh tâm. Con số 0 phẩy 84 là vì 80 phần trăm giá trị nằm dưới tâm cộng 0 phẩy 84 độ lệch chuẩn. Công thức đầy đủ, tính phần báo nhầm với giả sử hai nhóm như nhau, cho 31 nghìn 234."
      - clear: true
        show: |
          <table class="t"><tr><th>khác biệt muốn thấy</th><th>số khách <b>mỗi nhóm</b></th></tr>
          <tr><td>5% → 5,5%</td><td>31 234</td></tr>
          <tr><td>5% → 6%</td><td>$\hl{8158}$</td></tr></table>
          <p><b>Bước 3</b> — khác biệt gấp đôi: $\frac{31\,234}{8158} \approx 3{,}8$, cần ít khách hơn gần 4 lần.</p>
        introduces: [frac]
        focus: [1, "1.3", 2]
        say: "Bước ba, muốn thấy từ 5 lên 6 phần trăm chỉ cần 8158 khách mỗi nhóm. Khác biệt gấp đôi, nên số khách cần ít hơn gần 4 lần, cụ thể 31 nghìn 234 chia 8158 khoảng 3 phẩy 8. Khác biệt nhỏ cần rất nhiều khách."
      - clear: true
        show: |
          <p><b>Bước 4</b> — đổi ra số ngày. Trang có 20 000 khách mỗi ngày, chia đều: mỗi nhóm 10 000 khách mỗi ngày.</p>
          <table class="t"><tr><th>mục tiêu</th><th>số ngày</th></tr>
          <tr><td>5% → 5,5%</td><td>$\frac{31\,234}{10\,000} \approx 3{,}1$ → <b>4 ngày</b></td></tr>
          <tr><td>5% → 6%</td><td>$\frac{8158}{10\,000} \approx 0{,}8$ → <b>1 ngày</b></td></tr></table>
          <div class="box key">Định trước cỡ mẫu và thời gian chạy; không dừng sớm khi “trông đã tốt” (<b>nhìn trộm</b>: xem kết quả giữa chừng rồi dừng khi thấy đẹp).</div>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Bước bốn, đổi ra số ngày. Giả sử trang có 20 nghìn khách mỗi ngày, chia đều thì mỗi nhóm có 10 nghìn khách mỗi ngày. Mục tiêu 5 phẩy 5 phần trăm cần 31 nghìn 234 chia 10 nghìn, khoảng 3 phẩy 1, nên phải chạy 4 ngày. Mục tiêu 6 phần trăm chỉ cần khoảng 0 phẩy 8, tức 1 ngày. Hãy định trước cỡ mẫu và thời gian chạy, và đừng dừng sớm khi trông đã tốt, vì đó là nhìn trộm, tức xem kết quả giữa chừng rồi dừng khi thấy đẹp."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "round(16 * 0.05 * 0.95 / 0.01 ** 2) == 7600 and round(16 * 0.05 * 0.95 / 0.005 ** 2) == 30400"
      - "(lambda g, n: round(float((lambda x1, x2: (abs(x2 - x1) / __import__('numpy').sqrt((x1 + x2) * (1 - (x1 + x2) / 2) / n) > 1.96).mean())(g.binomial(n, 0.05, 2000) / n, g.binomial(n, 0.06, 2000) / n)), 2) == 0.8)(__import__('numpy').random.default_rng(7), 8158)"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>ước nhanh</td><td>$\frac{16 \cdot p \cdot (1 - p)}{\text{khác biệt}^2}$: $\frac{16 \cdot 0{,}05 \cdot 0{,}95}{0{,}01^2} = 7600$; với 0,005: 30 400</td><td>gần 8158 và 31 234 ✓</td></tr>
          <tr><td>giả lập</td><td>máy chạy 2000 thử nghiệm, mỗi nhóm 8158 khách, tỉ lệ thật 5% và 6%, đếm số lần phát hiện được</td><td>≈ 80% ✓</td></tr></table>
        introduces: [power]
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác. Cách thứ nhất là quy tắc ước nhanh, 16 nhân p nhân 1 trừ p, chia bình phương của khác biệt. Với khác biệt 0 phẩy 01 được 7600, với 0 phẩy 005 được 30 nghìn 400, gần với 8158 và 31 nghìn 234. Cách thứ hai, cho máy giả lập 2000 thử nghiệm, mỗi nhóm 8158 khách, tỉ lệ thật là 5 và 6 phần trăm, rồi đếm số lần phát hiện được khác biệt. Kết quả khoảng 80 phần trăm, đúng khả năng bắt được đã đặt."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "alg.peeking_fpr() == (0.191, 0.0505) and round(0.191 / 0.0505, 1) == 3.8"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin điểm ngoại tuyến thay cho thử nghiệm thật <b class="red">(đo sai thứ)</b>
          <br><span class="note">Điểm ngoại tuyến đo “đoán đúng điều đã xảy ra”; kinh doanh cần “làm thay đổi điều sẽ xảy ra”. Thử nghiệm hai nhóm chia ngẫu nhiên là cách đáng tin nhất để trả lời câu sau.</span></div>
        say: "Lỗi thứ nhất, tin điểm ngoại tuyến thay cho thử nghiệm thật. Điểm ngoại tuyến đo việc đoán đúng điều đã xảy ra, còn kinh doanh cần làm thay đổi điều sẽ xảy ra. Thử nghiệm hai nhóm chia ngẫu nhiên là cách đáng tin nhất để trả lời câu sau."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chia nhóm không ngẫu nhiên <b class="red">(nhóm khác nhau sẵn)</b>
          <br><span class="note">Cho khách mới dùng mô hình mới, khách cũ dùng mô hình cũ: hai nhóm khác nhau từ trước, không biết khác biệt do mô hình hay do khách. Chia ngẫu nhiên theo mã khách.</span></div>
        say: "Lỗi thứ hai, chia nhóm không ngẫu nhiên. Cho khách mới dùng mô hình mới, khách cũ dùng mô hình cũ, thì hai nhóm đã khác nhau từ trước, không biết khác biệt do mô hình hay do khách. Hãy chia ngẫu nhiên theo mã khách."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Bỏ qua bước chạy bóng <b class="red">(lỗi kỹ thuật lộ trước mặt khách)</b>
          <br><span class="note">Mô hình mới chậm gấp ba hoặc hỏng với một kiểu đầu vào hiếm: chạy bóng phát hiện được mà không khách nào bị ảnh hưởng.</span></div>
        say: "Lỗi thứ ba, bỏ qua bước chạy bóng. Mô hình mới chậm gấp ba hoặc hỏng với một kiểu đầu vào hiếm thì chạy bóng phát hiện được, mà không khách nào bị ảnh hưởng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Mở bảng theo dõi mỗi ngày, thấy “có ý nghĩa” (phép kiểm báo khác biệt khó là do may rủi) là dừng <b class="red">(nhìn trộm)</b></div>
          <table class="t"><tr><th>hai nhóm giống hệt (10%), 1000 khách mỗi nhóm</th><th>báo nhầm “mô hình mới tốt hơn”</th></tr>
          <tr><td>chỉ kiểm một lần, ở cuối</td><td>5,05% (đúng mức đã đặt)</td></tr>
          <tr><td>kiểm 10 lần dọc đường, dừng ngay khi đạt</td><td class="red">19,1%</td></tr></table>
          <p class="note">Mỗi lần nhìn là thêm một cơ hội gặp may rủi. Người làm nghề chốt cỡ mẫu từ đầu, hoặc dùng phương pháp được thiết kế cho việc xem nhiều lần.</p>
        focus: [1, 1, 2, "2.2", "2.3", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, mở bảng theo dõi mỗi ngày, thấy có ý nghĩa là dừng, tức nhìn trộm. Có ý nghĩa ở đây là phép kiểm báo khác biệt khó là do may rủi. Máy giả lập hai nhóm giống hệt nhau, tỉ lệ 10 phần trăm, mỗi nhóm 1000 khách. Nếu chỉ kiểm một lần ở cuối, tỉ lệ báo nhầm là 5 phẩy 05 phần trăm, đúng mức đã đặt. Nếu kiểm 10 lần dọc đường và dừng ngay khi đạt, tỉ lệ báo nhầm lên 19 phẩy 1 phần trăm, gần gấp 4. Mỗi lần nhìn là thêm một cơ hội gặp may rủi. Người làm nghề chốt cỡ mẫu từ đầu, hoặc dùng phương pháp được thiết kế cho việc xem nhiều lần."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.ab_sample_size(0.10, 0.11) == 14751 and 2 * 14751 // 5000 == 5"
      - "round(16 * 0.1 * 0.9 / 0.01 ** 2) == 14400 and 2 * 14751 == 29502 and round(29502 / 5000, 1) == 5.9 and math.ceil(29502 / 5000) == 6"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tỉ lệ nhấp hiện tại 10%, muốn phát hiện nâng lên 11%: cần bao nhiêu khách mỗi nhóm?</td></tr>
          <tr><td>2</td><td>Trang có 5000 khách mỗi ngày, chia đều hai nhóm. Cần chạy ít nhất mấy ngày?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, tỉ lệ nhấp hiện tại là 10 phần trăm, muốn phát hiện khi nâng lên 11 phần trăm, cần bao nhiêu khách mỗi nhóm? Câu hai, trang có 5000 khách mỗi ngày, chia đều hai nhóm, cần chạy ít nhất mấy ngày? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Ước nhanh: khác biệt 0,01, $\frac{16 \cdot 0{,}1 \cdot 0{,}9}{0{,}01^2} = 14\,400$. Công thức đầy đủ: $\hl{14\,751}$ khách mỗi nhóm.</p>
          <p>Hai nhóm: $2 \cdot 14\,751 = 29\,502$ khách.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, làm từng bước. Ước nhanh trước, khác biệt là 0 phẩy 01, nên 16 nhân 0 phẩy 1 nhân 0 phẩy 9 chia 0 phẩy 01 bình phương, được 14 nghìn 400. Công thức đầy đủ cho 14 nghìn 751 khách mỗi nhóm, tổng cộng 29 nghìn 502."
      - show: |
          <p>② $29\,502 : 5000 \approx 5{,}9$ → ít nhất $\hl{6}$ ngày (thường chạy đủ tuần để tính cả ngày thường và cuối tuần).</p>
        say: "Câu hai, 29 nghìn 502 chia 5000 khoảng 5 phẩy 9, nên ít nhất 6 ngày, và thường chạy đủ một tuần để tính cả ngày thường lẫn cuối tuần."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chạy bóng: an toàn kỹ thuật</span><span class="a">→</span>
          <span class="n">phát hành thử: lỗi chạm ít người</span><span class="a">→</span>
          <span class="n">thử nghiệm hai nhóm: tốt hơn thật không</span><span class="a">→</span>
          <span class="n">cỡ mẫu định trước, chia ngẫu nhiên</span></div>
        say: "Tổng kết lại, chạy bóng để an toàn về kỹ thuật, phát hành thử để lỗi chỉ chạm ít người. Thử nghiệm hai nhóm cho biết có tốt hơn thật không, với cỡ mẫu định trước và chia ngẫu nhiên."
      - show: |
          <div class="box key"><b>Tư duy:</b> một mô hình “tốt hơn” chỉ thật sự tốt hơn khi nó làm thay đổi điều ta quan tâm — và thử nghiệm có đối chứng là cách đáng tin nhất để đo điều đó.</div>
        say: "Điều cần mang theo, một mô hình tốt hơn chỉ thật sự tốt hơn khi nó làm thay đổi điều ta quan tâm, và thử nghiệm có đối chứng là cách đáng tin nhất để đo điều đó."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): <b>giám sát trôi dữ liệu</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta học cách giám sát trôi dữ liệu. Hẹn gặp bạn ở bài tiếp theo."
