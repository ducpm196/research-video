title: "Bài 0 — Vì sao song song: định luật Amdahl và phần tuần tự"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/par.yaml L00; audit/par/verify_par.py (verify_parts/L00.py); audit/par/sources_L00.md (câu trích nguyên văn, đọc 2026-11-02); G. M. Amdahl, Validity of the Single Processor Approach to Achieving Large Scale Computing Capabilities, AFIPS Conf. Proc. 30 (1967) 483–485, bản in lại trong IEEE SSCS News, mùa hè 2007 [AM67]; CSA bài 13 (định luật Amdahl)"
assumes: [arith, frac, approx]
# Quy ước ký hiệu (giữ nguyên cả khoá PAR, cùng kiểu CSA bài 13): p = tỉ lệ thời gian chạy trên MỘT lõi mà song song được (0 ≤ p ≤ 1);
#   1 − p = phần tuần tự; n = số lõi; S(n) = tăng tốc = thời gian 1 lõi chia thời gian n lõi; E(n) = S(n)/n = hiệu suất.
#   Amdahl đọc “Am-đan” (lexicon_vi.PAR.yaml, mượn probe CSA p1 8/8). Mọi chương trình, thời gian, giá thuê trong bài là SỐ MINH HOẠ;
#   sự kiện có thật duy nhất: bài báo năm 1967 [AM67] (40% lệnh là việc quản lý dữ liệu; bài báo không có phương trình nào).
#   Cách đo ngược p từ một lần đo (p = (1 − 1/S)/(1 − 1/n)) suy ra tại chỗ bằng chuyển vế, không gọi tên.
objectives:
  - "Tính tăng tốc S(n) và hiệu suất E(n) khi biết phần song song được p và số lõi n"
  - "Suy ra p từ hai lần đo thời gian (1 lõi và n lõi), rồi dự đoán cho số lõi khác"
  - "Quyết định giữa mua thêm lõi và giảm phần tuần tự bằng cách tính cả hai phương án"
