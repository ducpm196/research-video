scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Máy 16 lõi mà chỉ nhanh 6,4 lần"
    checks:
      - "round(alg.par_amdahl(0.9, 16), 2) == 6.4 and round(100 / alg.par_amdahl(0.9, 16), 3) == 15.625"
    steps:
      - show: |
          <p>Một đội xử lý ảnh vệ tinh chạy một chương trình mất <b>100 giây</b> trên một lõi. Họ thuê máy <b>16 lõi</b>, mong còn khoảng 6 giây.</p>
          <p>Đo thật: <b>15,6 giây</b> — chỉ nhanh gấp <b>6,4 lần</b>. Không lõi nào hỏng, không dòng mã nào sai. <span class="note">(số minh hoạ)</span></p>
          <div class="box key">Hôm nay: ① vì sao chỉ 6,4 lần? ② từ hai lần đo, biết được bao nhiêu phần chương trình song song được? ③ nên mua thêm lõi hay sửa phần chạy một mình?</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, một đội xử lý ảnh vệ tinh có chương trình chạy 100 giây trên một lõi. Họ thuê máy 16 lõi và mong chỉ còn khoảng 6 giây. Đo thật thì mất 15 phẩy 6 giây, tức chỉ nhanh gấp 6 phẩy 4 lần. Không lõi nào hỏng, không dòng mã nào sai. Hôm nay ta trả lời ba câu hỏi, vì sao chỉ 6 phẩy 4 lần, từ hai lần đo biết được bao nhiêu phần song song được, và nên mua thêm lõi hay sửa phần chạy một mình."
      - show: |
          <p>Câu hỏi này cũ hơn chiếc điện thoại của bạn rất nhiều: năm <b>1967</b>, Gene Amdahl viết rằng trong các lần chạy thật, khoảng <b>40%</b> số lệnh là việc quản lý dữ liệu, có vẻ tuần tự, nên khó song song hoá.</p>
          <p class="note">Bài báo ngắn ấy không có một phương trình nào; công thức mang tên ông được viết ra về sau.</p>
        focus: [1, 1, 1, 2]
        say: "Câu hỏi này đã cũ. Năm 1967, trong một bài báo ngắn, Amdahl viết rằng trong các lần chạy thật, khoảng 40 phần trăm số lệnh là việc quản lý dữ liệu. Phần này có vẻ tuần tự, nên khó chia cho nhiều bộ xử lý. Điều thú vị là bài báo ấy không có một phương trình nào, công thức mang tên ông được người khác viết ra về sau."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "100 / 20 == 5 and 1 / 0.2 == 5"
      - "round(1 / (0.1 + 0.9 / 8), 2) == 4.71 and round(0.1 + 0.9 / 8, 10) == 0.2125 and 0.9 / 8 == 0.1125"
      - "1 / 4 == 0.25 and 1 - 0.25 == 0.75 and 0.75 / 0.75 == 1"
    steps:
      - show: |
          <p><b>① Nhanh gấp mấy lần</b> = thời gian cũ chia thời gian mới: $\frac{100 \text{ giây}}{20 \text{ giây}} = 5$ lần.</p>
        say: "Điều thứ nhất, nhanh gấp mấy lần luôn tính bằng thời gian cũ chia thời gian mới. Việc trước tốn 100 giây, nay còn 20 giây, thì nhanh gấp 100 chia 20, bằng 5 lần."
      - show: |
          <p><b>② Định luật Amdahl</b> — trước hết, ta cần hiểu ý chính: chương trình nào cũng có một phần chỉ chạy được trên <b>một</b> lõi (đọc tệp đầu vào, gom kết quả cuối) và một phần chia được cho nhiều lõi. Lấy thời gian trên một lõi bằng 1, phần song song được là $p$, phần tuần tự là $1 - p$. Trên $n$ lõi, phần tuần tự giữ nguyên, phần song song chỉ còn $\frac{p}{n}$:</p>
          $$S(n) = \frac{1}{(1 - p) + \frac{p}{n}}$$
          <p class="note">Làm thử: $p = 0{,}9$, $n = 8$ → $\frac{0{,}9}{8} = 0{,}1125$, mẫu số $0{,}1 + 0{,}1125 = 0{,}2125$, nên $S(8) = \frac{1}{0{,}2125} \approx 4{,}71$. Cảnh “suy ra” ở dưới chứng minh công thức từng bước.</p>
        focus: [1, 1, 1, 1, 2, 3]
        say: "Điều thứ hai là định luật Amdahl, và trước hết ta cần hiểu ý chính của nó. Chương trình nào cũng có một phần chỉ chạy được trên một lõi, như đọc tệp đầu vào hay gom kết quả cuối, và một phần chia được cho nhiều lõi. Lấy thời gian trên một lõi bằng 1, phần song song được là p, phần tuần tự là 1 trừ p. Trên n lõi phần tuần tự giữ nguyên, còn phần song song chỉ còn p chia n. Tăng tốc là 1 chia cho tổng hai phần đó. Làm thử với p bằng 0 phẩy 9 và 8 lõi, 0 phẩy 9 chia 8 bằng 0 phẩy 1125, cộng 0 phẩy 1 được mẫu số 0 phẩy 2125, nên tăng tốc khoảng 4 phẩy 71 lần."
      - show: |
          <p><b>③ Chuyển vế</b>: nếu $\frac{1}{4} = 1 - x$ thì $x = 1 - \frac{1}{4} = 0{,}75$. Thử lại: $1 - 0{,}75 = 0{,}25 = \frac{1}{4}$ ✓.</p>
        say: "Điều thứ ba là chuyển vế, ta sẽ cần nó để đo ngược. Nếu một phần tư bằng 1 trừ x, thì x bằng 1 trừ một phần tư, tức 0 phẩy 75. Thử lại, 1 trừ 0 phẩy 75 đúng bằng 0 phẩy 25."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: p, n, S(n) và hiệu suất E(n)"
    checks:
      - "round(alg.par_amdahl(0.9, 16) / 16, 2) == 0.4"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc là</th><th>nghĩa</th><th>ví dụ của bài</th></tr>
          <tr><td>$p$</td><td>p</td><td>tỉ lệ thời gian trên <b>một</b> lõi mà song song được</td><td>0,9</td></tr>
          <tr><td>$n$</td><td>n</td><td>số lõi chạy cùng lúc</td><td>16</td></tr>
          <tr><td>$S(n)$</td><td>S của n</td><td>tăng tốc: thời gian 1 lõi chia thời gian $n$ lõi</td><td>6,4</td></tr>
          <tr><td>$E(n) = \frac{S(n)}{n}$</td><td>E của n</td><td><b>hiệu suất</b>: mỗi lõi làm được bao nhiêu phần việc của nó</td><td>$\frac{6{,}4}{16} = 40\%$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Bài dùng bốn ký hiệu. Chữ p là tỉ lệ thời gian trên một lõi mà song song được, ở ví dụ là 0 phẩy 9. Chữ n là số lõi chạy cùng lúc, ở đây là 16. S của n là tăng tốc, bằng thời gian một lõi chia thời gian n lõi, ở đây là 6 phẩy 4. Ký hiệu mới của bài này là E của n, đọc là hiệu suất, bằng tăng tốc chia số lõi. Với 6 phẩy 4 chia 16, hiệu suất là 40 phần trăm, tức mỗi lõi chỉ làm được 40 phần trăm sức của nó."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Phần xám không co lại khi thêm lõi"
    checks:
      - "[round(10 + 90 / n, 3) for n in (1, 4, 16)] == [100, 32.5, 15.625]"
      - "[round(alg.par_amdahl(0.9, 2 ** k), 2) for k in range(7)] == [1.0, 1.82, 3.08, 4.71, 6.4, 7.8, 8.77]"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420">
          <g font-size="26" fill="#1f2937" text-anchor="end"><text x="310" y="78">1 lõi</text><text x="310" y="168">4 lõi</text><text x="310" y="258">16 lõi</text><text x="310" y="348">rất nhiều lõi</text></g>
          <rect x="330" y="40" width="100" height="60" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="430" y="40" width="900" height="60" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
          <rect x="330" y="130" width="100" height="60" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="430" y="130" width="225" height="60" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
          <rect x="330" y="220" width="100" height="60" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="430" y="220" width="56" height="60" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
          <rect x="330" y="310" width="100" height="60" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="430" y="310" width="3" height="60" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
          <g font-size="24" fill="#1f2937" text-anchor="middle"><text x="380" y="78">10 s</text><text x="880" y="78">90 s song song được</text></g>
          <g font-size="26" fill="#059669" font-weight="bold"><text x="1350" y="80">100 s</text><text x="680" y="170">32,5 s</text><text x="510" y="260">15,6 s</text><text x="455" y="350">gần 10 s</text></g>
          <line x1="430" y1="22" x2="430" y2="385" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/>
          <text x="440" y="410" font-size="24" fill="#b91c1c">phần xám tuần tự: 10 giây, thêm bao nhiêu lõi cũng không ngắn hơn</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ thời gian chạy đúng tỉ lệ cho chương trình 100 giây của đội ảnh vệ tinh, với 90 phần trăm song song được. Trên một lõi, phần xám tuần tự mất 10 giây, phần xanh mất 90 giây. Trên 4 lõi, phần xanh chia 4 còn 22 phẩy 5 giây, tổng 32 phẩy 5 giây, còn trên 16 lõi tổng chỉ còn 15 phẩy 6 giây. Thêm bao nhiêu lõi đi nữa, phần xanh teo dần, nhưng thanh không bao giờ ngắn hơn vạch đỏ 10 giây."
      - clear: true
        show: |
          <div><svg width="1400" height="430" viewBox="0 0 1400 430">
          <line x1="120" y1="380" x2="1300" y2="380" stroke="#1f2937" stroke-width="2"/><line x1="120" y1="380" x2="120" y2="50" stroke="#1f2937" stroke-width="2"/>
          <line x1="120" y1="80" x2="1300" y2="80" stroke="#b91c1c" stroke-width="3" stroke-dasharray="12 8"/>
          <text x="1300" y="66" font-size="24" fill="#b91c1c" text-anchor="end">trần: 1 chia 0,1 = 10 lần</text>
          <g font-size="22" fill="#6b7280" text-anchor="end"><text x="108" y="388">0</text><text x="108" y="238">5</text><text x="108" y="88">10</text></g>
          <polyline points="180,350 365,325 550,288 735,239 920,188 1105,146 1290,117" fill="none" stroke="#2a78d6" stroke-width="4"/>
          <g fill="#2a78d6"><circle cx="180" cy="350" r="8"/><circle cx="365" cy="325" r="8"/><circle cx="550" cy="288" r="8"/><circle cx="735" cy="239" r="8"/><circle cx="920" cy="188" r="8"/><circle cx="1105" cy="146" r="8"/><circle cx="1290" cy="117" r="8"/></g>
          <g font-size="23" fill="#1f2937" text-anchor="middle"><text x="180" y="322">1</text><text x="365" y="297">1,82</text><text x="550" y="260">3,08</text><text x="735" y="211">4,71</text><text x="920" y="160">6,40</text><text x="1105" y="118">7,80</text><text x="1290" y="154">8,77</text></g>
          <g font-size="24" fill="#1f2937" text-anchor="middle"><text x="180" y="412">1</text><text x="365" y="412">2</text><text x="550" y="412">4</text><text x="735" y="412">8</text><text x="920" y="412">16</text><text x="1105" y="412">32</text><text x="1290" y="412">64</text></g>
          <text x="135" y="40" font-size="24" fill="#2a78d6">tăng tốc S(n), với p = 0,9</text>
          <text x="1340" y="412" font-size="24" fill="#6b7280" text-anchor="middle">lõi</text>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình thứ hai vẽ tăng tốc khi số lõi gấp đôi liên tục, từ 1 tới 64. Đường xanh đi lên nhưng cong dần, từ 4 phẩy 71 ở 8 lõi lên 6 phẩy 4 ở 16 lõi, rồi chỉ 8 phẩy 77 ở 64 lõi. Nó tiến sát vạch đỏ 10 lần mà không bao giờ vượt qua, vì 10 là 1 chia phần tuần tự 0 phẩy 1."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra công thức, và cách đo ngược p"
    checks:
      - "10 + 90 / 16 == 15.625 and 100 / 15.625 == 6.4"
      - "round(1 / 6.4, 5) == 0.15625 and 1 - 1 / 6.4 == 0.84375 and 1 - 1 / 16 == 0.9375 and round(0.84375 / 0.9375, 10) == 0.9"
    steps:
      - show: |
          <p><b>Bước 1 — tách thời gian.</b> Vì phần tuần tự chỉ một lõi làm được, còn phần song song chia đều cho $n$ lõi, nên thời gian trên $n$ lõi là</p>
          $$(1 - p) + \frac{p}{n}$$
          <p class="note">Làm thử bằng giây: $10 + \frac{90}{16} = 10 + 5{,}625 = 15{,}625$ giây.</p>
        focus: [1, 2, 3]
        say: "Bước một, tách thời gian làm hai phần. Vì phần tuần tự chỉ một lõi làm được, còn phần song song chia đều cho n lõi, nên thời gian trên n lõi là 1 trừ p, cộng p chia n. Làm thử bằng giây, 10 cộng 90 chia 16, tức 10 cộng 5 phẩy 625, bằng 15 phẩy 625 giây."
      - show: |
          <p><b>Bước 2 — chia.</b> Theo định nghĩa, tăng tốc là thời gian cũ chia thời gian mới, mà thời gian cũ lấy bằng 1:</p>
          $$S(n) = \frac{1}{(1 - p) + \frac{p}{n}}$$
          <p class="note">Làm thử: $\frac{100}{15{,}625} = 6{,}4$ ✓ — đúng con số đội ảnh vệ tinh đo được.</p>
        focus: [1, 2, 3]
        say: "Bước hai, theo định nghĩa, tăng tốc là thời gian cũ chia thời gian mới, mà thời gian cũ lấy bằng 1. Vì vậy S của n bằng 1 chia cho tổng hai phần vừa tìm. Làm thử, 100 chia 15 phẩy 625 bằng đúng 6 phẩy 4, con số đội ảnh vệ tinh đo được."
      - clear: true
        show: |
          <p><b>Bước 3 — lật ngược.</b> Lấy 1 chia hai vế: $\frac{1}{S} = (1 - p) + \frac{p}{n} = 1 - p\left(1 - \frac{1}{n}\right)$. Chuyển vế:</p>
          $$p = \frac{1 - \frac{1}{S}}{1 - \frac{1}{n}}$$
          <p class="note">Làm thử với số đo vừa rồi: $\frac{1 - 0{,}15625}{1 - 0{,}0625} = \frac{0{,}84375}{0{,}9375} = 0{,}9$ ✓ — ra lại đúng $p$.</p>
        focus: [1, 1, 2, 3]
        say: "Bước ba là lật ngược để đo p. Lấy 1 chia hai vế, ta có 1 chia S bằng 1 trừ p nhân với 1 trừ 1 chia n, vì 1 trừ p cộng p chia n gom lại như vậy. Chuyển vế, p bằng 1 trừ 1 chia S, chia cho 1 trừ 1 chia n. Làm thử với số đo vừa rồi, 0 phẩy 84375 chia 0 phẩy 9375 ra lại đúng 0 phẩy 9."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chương trình 90% song song được, 16 lõi, từng phép tính"
    checks:
      - "round(1 - 0.9, 10) == 0.1 and 0.9 / 16 == 0.05625"
      - "round(0.1 + 0.05625, 10) == 0.15625 and round(alg.par_amdahl(0.9, 16), 10) == 6.4"
      - "round(6.4 / 16, 10) == 0.4 and round(1 / (1 - 0.9), 10) == 10"
      - "round(alg.par_amdahl(0.9, 32), 2) == 7.8 and round(alg.par_amdahl(0.9, 32) / alg.par_amdahl(0.9, 16), 2) == 1.22"
    steps:
      - show: |
          <p><b>Bước 1.</b> Phần tuần tự: $1 - p = 1 - 0{,}9 = \hlb{0{,}1}$.</p>
          <p><b>Bước 2.</b> Phần song song trên 16 lõi: $\frac{p}{n} = \frac{0{,}9}{16} = \hlb{0{,}05625}$.</p>
        focus: [0, 1, 2]
        say: "Ta làm lại từng phép tính với p bằng 0 phẩy 9 và 16 lõi. Bước một, phần tuần tự bằng 1 trừ 0 phẩy 9, tức 0 phẩy 1. Bước hai, phần song song chia cho 16 lõi, 0 phẩy 9 chia 16 bằng 0 phẩy 05625."
      - show: |
          <p><b>Bước 3.</b> Cộng hai phần: $0{,}1 + 0{,}05625 = 0{,}15625$ — thời gian trên 16 lõi, so với 1.</p>
          <p><b>Bước 4.</b> Tăng tốc:</p>
          $$S(16) = \frac{1}{0{,}15625} = \hl{6{,}4}$$
        focus: [1, 3]
        say: "Bước ba, cộng hai phần được 0 phẩy 15625, đó là thời gian trên 16 lõi khi thời gian một lõi là 1. Bước bốn, tăng tốc bằng 1 chia 0 phẩy 15625, đúng 6 phẩy 4 lần."
      - show: |
          <p><b>Bước 5.</b> Hiệu suất: $E(16) = \frac{6{,}4}{16} = \hl{40\%}$ — mỗi lõi nghỉ hơn một nửa thời gian.</p>
          <p><b>Bước 6.</b> Rất nhiều lõi: $\frac{p}{n}$ về gần 0, nên $S$ tiến tới $\frac{1}{0{,}1} = \hlg{10}$ lần, không bao giờ hơn.</p>
        focus: [1, 2]
        say: "Bước năm, hiệu suất bằng 6 phẩy 4 chia 16, chỉ 40 phần trăm, nghĩa là mỗi lõi nghỉ hơn một nửa thời gian. Bước sáu, khi có rất nhiều lõi, p chia n về gần 0, nên tăng tốc tiến tới 1 chia 0 phẩy 1, bằng 10 lần, không bao giờ hơn."
      - show: |
          <p><b>Bước 7.</b> Gấp đôi lên 32 lõi: $S(32) \approx 7{,}80$. Trả tiền gấp đôi số lõi, chỉ nhanh thêm $\frac{7{,}80}{6{,}4} \approx \hl{1{,}22}$ lần.</p>
        say: "Bước bảy, nếu đội gấp đôi lên 32 lõi, tăng tốc chỉ khoảng 7 phẩy 8. Trả tiền cho gấp đôi số lõi mà chỉ nhanh thêm 7 phẩy 8 chia 6 phẩy 4, khoảng 1 phẩy 22 lần."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: đếm giây của từng lõi, và hai giới hạn"
    checks:
      - "16 * 15.625 == 250 and 10 + 90 == 100 and round(100 / 250, 10) == 0.4"
      - "alg.par_amdahl(0.9, 1) == 1 and all(alg.par_amdahl(0.9, n) <= min(n, 10) for n in range(1, 200))"
    steps:
      - show: |
          <table class="t"><tr><th>đếm giây của cả 16 lõi trong 15,625 giây</th><th>giây</th></tr>
          <tr><td>lõi được thuê: $16 \cdot 15{,}625$</td><td>250</td></tr>
          <tr><td>việc có ích: 10 giây tuần tự + 90 giây song song</td><td>100</td></tr>
          <tr><td>tỉ lệ có ích: $\frac{100}{250}$</td><td>$\hlg{40\%}$ = $E(16)$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        introduces: [cdot]
        say: "Kiểm bằng đường khác, vì hiệu suất là phần việc có ích, ta không dùng công thức mà đếm giây của từng lõi. Mười sáu lõi được thuê trong 15 phẩy 625 giây, dấu chấm giữa là phép nhân, tổng cộng 250 giây lõi. Việc có ích chỉ là 10 giây tuần tự cộng 90 giây song song, tổng 100 giây. Một trăm chia 250 bằng 40 phần trăm, khớp với hiệu suất tính bằng công thức."
      - show: |
          <table class="t"><tr><th>phép thử giới hạn</th><th>công thức cho</th><th>phải đúng vì</th></tr>
          <tr><td>một lõi, $n = 1$</td><td>$S(1) = \frac{1}{0{,}1 + 0{,}9} = 1$</td><td>không có lõi phụ thì không nhanh hơn</td></tr>
          <tr><td>mọi $n$</td><td>$S(n) \le n$ và $S(n) \le 10$</td><td>không lõi nào làm hơn 100% sức; phần xám luôn còn</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Hai phép thử giới hạn bắt được phần lớn lỗi tính. Với một lõi, công thức phải cho đúng 1, vì không có lõi phụ thì không nhanh hơn được. Với mọi số lõi, tăng tốc không được vượt số lõi, và không được vượt 10, vì không lõi nào làm hơn 100 phần trăm sức và phần xám luôn còn đó."

  # ───────────────────────── 8. ĐO NGƯỢC ─────────────────────────
  - id: measure
    kind: concept
    title: "Từ hai lần đo đến dự đoán: đo ngược p"
    checks:
      - "120 / 30 == 4 and round((1 - 1 / 4) / (1 - 1 / 8), 3) == 0.857"
      - "round(alg.par_amdahl(6 / 7, 32), 2) == 5.89 and round(120 / alg.par_amdahl(6 / 7, 32), 1) == 20.4"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. đo: 1 lõi 120 s, 8 lõi 30 s</td><td>$\dfrac{120}{30}$</td><td>$S(8) = 4$</td></tr>
          <tr><td>Bước 2. đo ngược</td><td>$\dfrac{1 - \frac{1}{4}}{1 - \frac{1}{8}} = \dfrac{0{,}75}{0{,}875}$</td><td>$p \approx \hlb{0{,}857}$</td></tr>
          <tr><td>Bước 3. dự đoán 32 lõi</td><td>$\dfrac{1}{0{,}143 + \frac{0{,}857}{32}}$</td><td>$S(32) \approx \hlo{5{,}89}$, khoảng 20,4 s</td></tr></table>
          <p class="note">(số minh hoạ) Chỉ cần hai lần đo, không cần đọc mã để đoán phần nào tuần tự.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Công thức đo ngược cho ta cách làm của người đi làm. Bước một, đo một chương trình khác, 120 giây trên một lõi và 30 giây trên 8 lõi, tăng tốc là 4. Bước hai, 1 trừ một phần tư là 0 phẩy 75, chia 1 trừ một phần tám là 0 phẩy 875, được p khoảng 0 phẩy 857. Bước ba, thay vào công thức, 32 lõi chỉ cho khoảng 5 phẩy 89 lần, tức còn khoảng 20 phẩy 4 giây. Chỉ cần hai lần đo, không cần đọc mã để đoán phần nào tuần tự."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "round(alg.par_amdahl(0.9, 16), 2) == 6.4 < 16"
      - "130 / 20 == 6.5 and 100 / 20 == 5"
      - "(f := lambda n: 1 / (0.1 + 0.9 / n + 0.005 * n)) and round(f(16), 2) == 4.23 and round(f(64), 2) == 2.30 and max(range(1, 201), key=f) == 13"
      - "round((1 - 1 / 6) / (1 - 1 / 8), 3) == 0.952 and round((1 - 1 / 4) / (1 - 1 / 8), 3) == 0.857"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> “16 lõi thì nhanh 16 lần” <b class="red">(thật: 6,4 lần)</b>
          <br><span class="note">Phép thử: $S(n) \le \frac{1}{1 - p}$. Hỏi “phần nào chạy một mình?” trước khi hứa với ai một con số.</span></div>
        say: "Lỗi thứ nhất của người mới, nghĩ 16 lõi thì nhanh 16 lần, trong khi thật chỉ 6 phẩy 4. Phép thử là tăng tốc không vượt quá 1 chia phần tuần tự. Hãy hỏi phần nào chạy một mình trước khi hứa với ai một con số."
      - show: |
          <div class="box warn"><b>Lỗi 2 — người đã đi làm.</b> So với nền sai <b class="red">(báo 6,5 lần, thật 5 lần)</b>
          <br><span class="note">Bản song song chạy trên 1 lõi mất 130 s vì tốn công chia việc; bản tuần tự tốt nhất chỉ 100 s; 16 lõi mất 20 s (số minh hoạ). $\frac{130}{20} = 6{,}5$ nhưng $\frac{100}{20} = 5$. Luôn ghi rõ “so với cái gì”.</span></div>
        say: "Lỗi thứ hai hay gặp ở người đã đi làm, là so với nền sai. Bản song song chạy trên một lõi mất 130 giây vì tốn công chia việc, còn bản tuần tự tốt nhất chỉ mất 100 giây. Trên 16 lõi mất 20 giây, báo cáo ghi nhanh 6 phẩy 5 lần, nhưng so với bản tốt nhất chỉ là 5 lần. Luôn ghi rõ so với cái gì."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3 — người đã đi làm.</b> Mua thêm lõi khi có chi phí phối hợp <b class="red">(64 lõi chậm hơn 16 lõi)</b>
          <br><span class="note">Giả sử mỗi lõi thêm tốn 0,005 thời gian để chia việc và gom kết quả (số minh hoạ): thời gian $0{,}1 + \frac{0{,}9}{n} + 0{,}005 \cdot n$.</span></div>
          <table class="t"><tr><th>số lõi</th><th>16</th><th>64</th><th>tốt nhất (thử từ 1 tới 200)</th></tr>
          <tr><td>tăng tốc</td><td>4,23</td><td class="red">2,30</td><td>13 lõi, 4,27</td></tr></table>
        focus: [1, 1, "2.2", 2]
        say: "Lỗi thứ ba cũng của người đã đi làm, là mua thêm lõi khi có chi phí phối hợp. Giả sử mỗi lõi thêm tốn 0 phẩy 005 thời gian để chia việc và gom kết quả. Khi đó 16 lõi cho 4 phẩy 23 lần, còn 64 lõi chỉ 2 phẩy 3 lần, chậm hơn hẳn. Thử hết từ 1 tới 200 lõi, chỗ tốt nhất là 13 lõi, vì vậy hãy đo ở vài số lõi trước khi mua."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Đo $p$ ở cỡ dữ liệu nhỏ rồi dùng cho cỡ thật <b class="red">(0,857 so với 0,952)</b>
          <br><span class="note">Cùng chương trình, 8 lõi: dữ liệu nhỏ nhanh 4 lần → $p \approx 0{,}857$; dữ liệu thật nhanh 6 lần → $p \approx 0{,}952$ (số minh hoạ). Phần tuần tự đổi theo cỡ bài toán — đo lại ở cỡ thật.</span></div>
        say: "Lỗi thứ tư là đo p ở cỡ dữ liệu nhỏ rồi dùng cho cỡ thật. Cùng chương trình trên 8 lõi, dữ liệu nhỏ nhanh 4 lần cho p khoảng 0 phẩy 857, còn dữ liệu thật nhanh 6 lần cho p khoảng 0 phẩy 952. Phần tuần tự đổi theo cỡ bài toán, nên phải đo lại ở cỡ thật."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: thuê 32 lõi hay sửa phần tuần tự?"
    checks:
      - "round((1 - 30 / 120) / (1 - 1 / 8), 3) == 0.857 and round(1 - 6 / 7, 3) == 0.143"
      - "round(120 / alg.par_amdahl(6 / 7, 32), 1) == 20.4"
      - "round(alg.par_amdahl(13 / 14, 8), 2) == 5.33 and round(120 / alg.par_amdahl(13 / 14, 8), 1) == 22.5"
      - "round(120 / alg.par_amdahl(13 / 14, 32), 1) == 12.1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>chương trình của bài: 1 lõi 120 s, 8 lõi 30 s; máy 32 lõi giá thuê gấp 4 máy 8 lõi (số minh hoạ)</th></tr>
          <tr><td>1</td><td>Phần tuần tự $1 - p$ là bao nhiêu?</td></tr>
          <tr><td>2</td><td>Phương án A: thuê 32 lõi. Chạy mất bao lâu?</td></tr>
          <tr><td>3</td><td>Phương án B: giữ 8 lõi, sửa mã cho phần tuần tự còn một nửa. Chạy mất bao lâu? Bạn chọn gì?</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với chương trình vừa đo, 120 giây trên một lõi và 30 giây trên 8 lõi, còn máy 32 lõi có giá thuê gấp 4 máy 8 lõi. Câu một, phần tuần tự là bao nhiêu? Câu hai, phương án A là thuê 32 lõi, chạy mất bao lâu? Câu ba, phương án B là giữ 8 lõi và sửa mã cho phần tuần tự còn một nửa, chạy mất bao lâu, và bạn chọn gì? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p class="note">Đã đo: 1 lõi 120 s, 8 lõi 30 s.</p>
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1</td><td>$p = \dfrac{1 - \frac{1}{4}}{1 - \frac{1}{8}} \approx 0{,}857$</td><td>$1 - p \approx \hlb{0{,}143}$, tức một phần bảy</td></tr>
          <tr><td>2 (A)</td><td>$S(32) \approx 5{,}89$; $\frac{120}{5{,}89}$</td><td>$\approx \hlo{20{,}4}$ giây</td></tr></table>
        focus: ["2.2", "2.3"]
        say: "Đáp án câu một, đo ngược được p khoảng 0 phẩy 857, nên phần tuần tự khoảng 0 phẩy 143, tức một phần bảy. Câu hai, như đã tính, 32 lõi cho khoảng 5 phẩy 89 lần, nên chạy mất khoảng 20 phẩy 4 giây."
      - clear: true
        show: |
          <table class="t"><tr><th>phương án</th><th>tính</th><th>thời gian</th><th>giá</th></tr>
          <tr><td>A: thuê 32 lõi</td><td>$1 - p = \frac{1}{7}$, $n = 32$</td><td>20,4 s</td><td>gấp 4</td></tr>
          <tr><td>B: sửa mã, giữ 8 lõi</td><td>$1 - p = \frac{1}{14}$: $S(8) \approx 5{,}33$</td><td>$\hlg{22{,}5}$ s</td><td>công sửa mã một lần</td></tr>
          <tr><td>B rồi mới A</td><td>$\frac{1}{14}$, $n = 32$</td><td>12,1 s</td><td>cả hai</td></tr></table>
          <p class="note">Chọn B trước: gần bằng A mà không trả gấp 4 mỗi giờ. Đổi lựa chọn khi: phần tuần tự không sửa được (đọc tệp từ một ổ đĩa chậm), hoặc cần kết quả ngay hôm nay.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Câu ba là một quyết định, ta tính cả hai phương án. Phương án A thuê 32 lõi, chạy 20 phẩy 4 giây với giá gấp 4. Phương án B sửa mã cho phần tuần tự còn một phần mười bốn, 8 lõi cho khoảng 5 phẩy 33 lần, tức 22 phẩy 5 giây, chỉ tốn công sửa mã một lần. Làm B rồi mới thuê 32 lõi thì còn khoảng 12 phẩy 1 giây. Vì vậy nên làm B trước, và chỉ đổi lựa chọn khi phần tuần tự không sửa được, hoặc cần kết quả ngay hôm nay."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic, tư duy và bản đồ khoá học"
    steps:
      - show: |
          <div class="chain"><span class="n">thời gian = tuần tự + song song chia n</span><span class="a">→</span>
          <span class="n">S(n) = 1 chia tổng đó</span><span class="a">→</span>
          <span class="n">trần 1 chia (1 − p); hiệu suất S chia n</span><span class="a">→</span>
          <span class="n">hai lần đo → p → dự đoán</span><span class="a">→</span>
          <span class="n">sửa phần tuần tự trước, mua lõi sau</span></div>
        say: "Tổng kết lại, thời gian trên n lõi bằng phần tuần tự cộng phần song song chia n, và tăng tốc là 1 chia tổng đó. Tăng tốc không vượt quá 1 chia phần tuần tự, còn hiệu suất là tăng tốc chia số lõi. Từ hai lần đo, ta tính ngược được p rồi dự đoán cho máy khác. Vì vậy hãy sửa phần tuần tự trước, rồi mới mua lõi."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi mua phần cứng, <b>đo hai lần</b> và tính ngược phần tuần tự. Con số “nhanh gấp mấy lần” luôn đi kèm câu hỏi “so với cái gì, ở cỡ dữ liệu nào”.</div>
        say: "Điều cần mang theo, trước khi mua phần cứng, hãy đo hai lần và tính ngược phần tuần tự. Con số nhanh gấp mấy lần luôn phải đi kèm câu hỏi so với cái gì, và ở cỡ dữ liệu nào."
      - clear: true
        show: |
          <table class="t"><tr><th>bài</th><th>khoá học đi qua</th></tr>
          <tr><td>1–2</td><td>mở rộng theo cỡ bài toán; công việc, đường găng và lịch chia việc</td></tr>
          <tr><td>3–4</td><td>tranh chấp dữ liệu, phép toán nguyên tử, rút gọn; cân bằng tải</td></tr>
