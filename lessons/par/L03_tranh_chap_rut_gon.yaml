id: L03
course: PAR
series: "PAR · Tính toán song song và GPU"
title: "Bài 3 — Tranh chấp dữ liệu, phép toán nguyên tử và phép rút gọn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/par.yaml L03; audit/par/verify_par.py L03; audit/par/sources_L03.md (câu trích nguyên văn, đọc 2026-11-02); OSY bài 4 (tranh chấp x++, 924 cách xen kẽ, kết quả 2, 3, 4); CSA bài 4 (phép cộng số thực không kết hợp); PyTorch, Reproducibility (docs.pytorch.org, bản 2.15) — phép nguyên tử không tất định, phép cộng số thực không kết hợp, thuật toán tất định thường chậm hơn; J. Nickolls và cộng sự, Scalable Parallel Programming with CUDA (ACM Queue 2008) — lệnh đọc–sửa–ghi nguyên tử giúp phép rút gọn song song"
assumes: [arith, approx]
# Quy ước: x = biến dùng chung, ban đầu 0; “x++” = 3 bước đọc, cộng, ghi (như khoá Hệ điều hành bài 4); n = số luồng (cả khoá gọi là
#   số lõi); k = số lần tăng mỗi luồng. “Phép toán nguyên tử” = đọc–cộng–ghi gộp thành MỘT bước không ai chen vào được
#   (alg.par_atomic_counts). “Phép rút gọn” = mỗi luồng cộng vào biến riêng, cuối cùng gộp theo cây cặp đôi (alg.par_reduce_tree).
#   Mô hình đếm bước của bài: mỗi lần tăng 1 bước; các phép nguyên tử trên CÙNG một biến phải lần lượt (alg.par_shared_steps).
#   Số thực: số 64 bit của Python (CSA bài 4); cộng dồn = alg.par_reduce_seq. Số minh hoạ: 8 luồng × 1000 lần, 16 luồng × 10 000 sự kiện.
#   Tên PyTorch, CUDA chỉ trên màn hình; lời đọc nói “một thư viện học sâu lớn”, “mô hình lập trình bộ xử lý đồ hoạ”.
objectives:
  - "Liệt kê kết quả có thể của biến đếm dùng chung không khoá, và so với phép tăng nguyên tử"
  - "Tính số bước của cách dùng phép nguyên tử và cách rút gọn bằng tổng riêng rồi gộp theo cây"
  - "Giải thích vì sao rút gọn song song số thực cho kết quả khác thứ tự tuần tự, và chọn cách để kết quả tái lập được"
asr_reviewed:
  - {sentence: "Vì vậy 0 phẩy 1 cộng 0 phẩy 2 ra 0 phẩy 3 với một đuôi số 4 rất nhỏ.", reason: "ASR chép “Vì vậy, không phải 1 cộng, không phải 2 tra, không phải 3 với 1 đôi số 4 rất nhỏ.” (0.75): “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; lệch âm/thanh thuần Việt: ra/tra, đuôi/đôi — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bộ đếm thiếu, tổng tiền lệch ở chữ số cuối"
    checks:
      - "alg.race_finals(2) == {2, 3, 4}"
      - "alg.par_reduce_seq([0.1] * 8) == 0.7999999999999999 and alg.par_reduce_tree([0.1] * 8) == 0.8"
    steps:
      - show: |
          <p>Hai luồng cùng tăng một bộ đếm, mỗi luồng 2 lần. Đúng phải là 4, nhưng máy có thể ra <b>2, 3 hoặc 4</b>.</p>
          <p>Sửa xong bộ đếm, nhóm cộng 8 khoản 0,1 đồng: chạy một luồng ra <b>0,7999999999999999</b>, chạy song song ra <b>0,8</b>. Không ai viết sai cả.</p>
          <div class="box key">Hôm nay: vì sao bộ đếm thiếu, phép toán nguyên tử sửa nó với giá nào, và vì sao cộng song song đổi chữ số cuối.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, hai luồng cùng tăng một bộ đếm, mỗi luồng 2 lần, đúng phải là 4, nhưng máy có thể ra 2, 3 hoặc 4. Sửa xong bộ đếm, nhóm cộng 8 khoản 0 phẩy 1 đồng, chạy một luồng ra 0 phẩy 7999 cùng nhiều chữ số 9, còn chạy song song ra đúng 0 phẩy 8. Không ai viết sai cả. Hôm nay ta tìm hiểu vì sao bộ đếm thiếu, phép toán nguyên tử sửa nó với giá nào, và vì sao cộng song song làm đổi chữ số cuối."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ các khoá và bài trước"
    checks:
      - "alg.race_finals(1) == {1, 2} and alg.par_race_counts(1) == {1: 18, 2: 2}"
      - "0.1 + 0.2 == 0.30000000000000004"
      - "alg.par_tree_sum(8)[:2] == (7, 3)"
    steps:
      - show: |
          <table class="t"><tr><th>đã học ở</th><th>điều sẽ dùng</th><th>ví dụ số</th></tr>
          <tr><td>khoá Hệ điều hành, phần tranh chấp</td><td>x++ là ba bước: <b>đọc</b> x vào thanh ghi, <b>cộng</b> 1, <b>ghi</b> về x; luồng khác chen vào giữa được</td><td>hai luồng mỗi luồng tăng 1 lần: 20 cách xen kẽ, 18 cách ra 1, chỉ 2 cách ra 2</td></tr>
          <tr><td>khoá Hệ thống máy tính, phần sai số làm tròn</td><td>số thực bị làm tròn sau mỗi phép tính</td><td>0,1 + 0,2 = 0,30000000000000004</td></tr>
          <tr><td>bài 2</td><td>cộng theo cặp: cây</td><td>8 số: 7 phép cộng, đường găng 3 tầng</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.4"]
        say: "Ta ôn ba điều sẽ dùng. Ở khoá Hệ điều hành, phần tranh chấp, lệnh tăng x là ba bước, đọc x vào thanh ghi, cộng 1, rồi ghi về x, và luồng khác có thể chen vào giữa. Hai luồng mỗi luồng tăng một lần có 20 cách xen kẽ, 18 cách ra 1, chỉ 2 cách ra 2. Ở khoá Hệ thống máy tính, phần sai số làm tròn, số thực bị làm tròn sau mỗi phép tính. Vì vậy 0 phẩy 1 cộng 0 phẩy 2 ra 0 phẩy 3 với một đuôi số 4 rất nhỏ. Ở bài 2, cộng 8 số theo cặp cần 7 phép cộng và đường găng 3 tầng."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: tranh chấp, nguyên tử, rút gọn, kết hợp"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>tranh chấp dữ liệu</b></td><td>hai luồng cùng chạm một biến, ít nhất một luồng ghi, không có gì xếp thứ tự</td></tr>
          <tr><td><b>phép toán nguyên tử</b></td><td>đọc–cộng–ghi gộp thành <b>một</b> bước phần cứng, không ai chen vào giữa được</td></tr>
          <tr><td><b>phép rút gọn</b></td><td>gộp nhiều giá trị thành một (tổng, lớn nhất…): mỗi luồng có <b>tổng riêng</b>, cuối cùng gộp lại</td></tr>
          <tr><td><b>tính kết hợp</b></td><td>$(a + b) + c = a + (b + c)$: đổi cách nhóm không đổi kết quả</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Tranh chấp dữ liệu là khi hai luồng cùng chạm một biến, ít nhất một luồng ghi, và không có gì xếp thứ tự cho chúng. Phép toán nguyên tử gộp đọc, cộng, ghi thành một bước của phần cứng, không ai chen vào giữa được. Phép rút gọn gộp nhiều giá trị thành một, mỗi luồng giữ một tổng riêng rồi cuối cùng gộp lại. Tính kết hợp nghĩa là đổi cách nhóm, a cộng b trước hay b cộng c trước, không đổi kết quả. Số nguyên có tính chất này, số thực máy thì không."

