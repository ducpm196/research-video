id: L05
course: PAR
series: "PAR · Tính toán song song và GPU"
title: "Bài 5 — Bộ nhớ đệm khi song song: tính cục bộ và chia sẻ giả"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
domain_terms: [dòng]   # “dòng” = dòng của bộ nhớ đệm (thuật ngữ), không phải trích tài liệu
source: "curriculum/par.yaml L05; audit/par/verify_par.py L05; audit/par/sources_L05.md (câu trích nguyên văn, đọc 2026-11-03); University of Cambridge, Computer Architecture course notes 2005, MESI — ghi vào dòng đang chia sẻ thì mọi bản sao khác phải bị huỷ trước; cppreference, std::hardware_destructive_interference_size — khoảng cách tối thiểu giữa hai đối tượng để tránh chia sẻ giả, giá trị do cài đặt quyết định (64 trên x86-64 trong ví dụ); H. Sutter, The Free Lunch Is Over (2005) — chi phí phối hợp giữa các lõi để giữ bộ nhớ đệm nhất quán (trích ở audit/csa/sources_L16.md); CSA bài 10, 11 (dòng 64 byte, tách địa chỉ); PAR bài 3 (tổng riêng)"
assumes: [arith, frac, approx]
# Quy ước: địa chỉ đánh theo byte; mỗi dòng bộ nhớ đệm 64 byte (như khoá Hệ thống máy tính); bộ đếm 8 byte (số nguyên 64 bit) trừ quiz
#   (4 byte). Dòng chứa địa chỉ a là ⌊a / 64⌋ (alg.par_cache_lines). Mô hình huỷ bản sao: một lần ghi phải “kéo dòng về” khi người ghi
#   trước đó trên dòng là lõi khác hoặc chưa ai (alg.par_line_transfers); các luồng ghi xoay vòng — mô hình của bài, KHÔNG phải số đo
#   thời gian. “Chia sẻ thật” = hai luồng dùng CÙNG một biến; “chia sẻ giả” = hai biến KHÁC nhau chung một dòng.
#   Tên C++, hằng số hardware_destructive_interference_size chỉ trên màn hình; lời đọc nói “hằng số của thư viện chuẩn”.
#   Số minh hoạ: 8 luồng × 1000 lần ghi; 16 luồng × 1000 lần ghi; 1 triệu bộ đếm.
objectives:
  - "Tính một biến nằm ở dòng nào của bộ nhớ đệm, và các biến nào chung một dòng"
  - "Giải thích chia sẻ giả bằng số lần dòng bị kéo qua lại khi các luồng ghi các biến khác nhau trong cùng một dòng"
  - "Chọn giữa đệm mỗi biến ra một dòng và giữ biến cục bộ rồi ghi một lần, kèm cái giá bộ nhớ"
asr_reviewed:
  - {sentence: "Một dòng 64 byte chứa được 8 số loại 8 byte, nên đọc 8 số liền nhau chỉ tốn một lần chép dòng thay vì 8 lần.", reason: "ASR chép “Một dòng 64 bay chứa được 8 số loại 8 bay, nền đọc 8 số liền nhau chỉ tốn một lần chép dòng thay vị 8 lần.” (0.862): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: nên (trong “byte nên” → “bay nền”), vì/vị — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vì chương trình hay dùng lại dữ liệu vừa dùng và dữ liệu nằm ngay cạnh nó, gọi là tính cục bộ, bộ nhớ đệm chép cả một dòng 64 byte liền nhau, không chép từng byte.", reason: "ASR chép “Vì chương trình hay dùng lại giữ liệu vừa dùng và giữ liệu nằm ngay cạnh nó, gọi là tính cuộc bộ, bộ nhớ đem chép cả 1 dòng 64 bai liền nhau, không chép từng bay.” (0.897): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: cục/cuộc, đệm/đem — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ghép sát tốn 8 nhân 8 bằng 64 byte và kéo 8000 lần.", reason: "ASR chép “Gép sát tốn 8 x 8 bằng 64 by và kéo 8.000 lần.” (0.812): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: ghép/gép, nhân/x — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hình trên là cách ghép sát, 8 bộ đếm 8 byte nằm vừa khít một dòng 64 byte, mỗi lõi chỉ ghi vào ô của mình.", reason: "ASR chép “Hình trên là cách ghép sát, 8 bộ đếm 8 bay nằm vừa khuyết một dòng 64 bay, mỗi loại chỉ ghi vào ô của mình.” (0.857): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: khít/khuyết, lõi/loại — NOT_VERIFIED bằng tai người"}
  - {sentence: "Địa chỉ 130 chia 64 được 2 dư 2, nên nằm ở dòng số 2, byte thứ 2 trong dòng.", reason: "ASR chép “Địa chỉ 134 được 2 dư 2, nên nằm ở dòng số 2, bài thứ 2 trong dòng.” (0.894): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: mươi chia sáu/∅ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bây giờ đến lượt bạn, 16 luồng, mỗi luồng tăng bộ đếm riêng 1000 lần, bộ đếm 4 byte, dòng 64 byte, đều là số minh hoạ.", reason: "ASR chép “Bây giờ đến lược bạn, 16 luồng, mỗi luồng tăng bộ đếm riêng 1000 lần, bộ đếm 4 bay, dòng 64 bay đều là số minh họa.” (0.903): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: lượt/lược — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ hai, đệm nửa dòng, 32 byte vẫn để 2 luồng chung một dòng, vẫn 8000 lần kéo.", reason: "ASR chép “Lỗi thứ hai, đềm nửa dòng, 32 by vẫn để hai luồng chung một dòng, vẫn 8.000 lần kéo.” (0.909): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: đệm/đềm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cuối cùng, đếm cặp luồng chung dòng, ghép sát có 8 nhân 7 chia 2, bằng 28 cặp giẫm chân nhau, còn đệm 64 byte thì không có cặp nào.", reason: "ASR chép “Cuối cùng, đếm cặp luồng chung dòng, ghép sát có 8 nhân 7 chi 2, bằng 28 cặp dẫm chân nhau, còn đềm 64 bay thì không có cặp nào.” (0.912): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: chia/chi, đệm/đềm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lý do là 8 bộ đếm, mỗi bộ 8 byte, nằm sát nhau trong cùng một dòng 64 byte của bộ nhớ đệm.", reason: "ASR chép “Lý do là 8 bộ đếm, mỗi bộ 8 bai nằm sát nhau trong cùng 1 dòng 64 bai của bộ nhớ đệm.” (0.92): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đệm cũng chỉ 16 lần kéo và đọc được giữa chừng, nhưng tốn 1024 byte, gấp 16 lần.", reason: "ASR chép “Đệm cũng chỉ 16 lần kéo và đọc được giữa chân, nhưng tốn 1024 bay, gấp 16 lần.” (0.923): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: chừng/chân — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, đệm tốn 16 nhân 64, bằng 1024 byte, so với 64 byte khi ghép sát.", reason: "ASR chép “Câu 2 Đệm tốn 16 nhân 64 bằng 1024 bai so với 64 bai khi ghép sát” (0.929): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, đệm mỗi bộ đếm ra một dòng thì tốn bao nhiêu byte và kéo bao nhiêu lần?", reason: "ASR chép “Câu 2. Đệm mỗi bộ đếm ra một dòng thì tốn bao nhiêu bai và kéo bao nhiêu lần?” (0.947): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nếu đệm mỗi bộ đếm ra 32 byte, các địa chỉ 0, 32, 64 cứ thế tới 224 rơi vào dòng 0, 0, 1, 1, 2, 2, 3, 3.", reason: "ASR chép “Nếu đệm mỗi bộ đếm ra 32 bai, các địa chỉ 0, 32, 64 cứ thể tới 224 rơi vào dòng 0, 0, 1, 1, 2, 2, 3, 3.” (0.949): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: thế/thể — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đệm tốn 8 nhân 64 bằng 512 byte, gấp 8 lần bộ nhớ, nhưng chỉ kéo 8 lần.", reason: "ASR chép “Đệm tốn 8 nhân 64 bằng 512 bai, gấp 8 lần bộ nhớ, nhưng chỉ kéo 8 lần.” (0.957): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tổng kết lại, bộ nhớ đệm làm việc theo dòng 64 byte, và dòng của một địa chỉ là địa chỉ chia 64 làm tròn xuống.", reason: "ASR chép “Tổng kết lại, bộ nhớ đệm làm việc theo dòng 64 bay, và dòng của một địa chỉ là địa chỉ chia 64 làm tròn xuống.” (0.967): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mỗi luồng một bộ đếm riêng mà vẫn chậm"
    checks:
      - "alg.par_cache_lines([8 * i for i in range(8)]) == [0]"
      - "alg.par_line_transfers([8 * i for i in range(8)], 1000) == (8000, 8000) and alg.par_line_transfers([64 * i for i in range(8)], 1000) == (8, 8000)"
    steps:
      - show: |
          <p>Rút kinh nghiệm bài 3, một nhóm cho <b>8 luồng</b>, mỗi luồng tăng <b>bộ đếm riêng</b> của mình: không tranh chấp, kết quả luôn đúng. Nhưng thêm luồng mà gần như không nhanh hơn.</p>
          <p>Lý do: 8 bộ đếm 8 byte nằm sát nhau, chung <b>một dòng 64 byte</b>. Trong mô hình của bài, 8000 lần ghi kéo dòng qua lại <b>8000 lần</b>; tách mỗi bộ đếm ra một dòng thì chỉ <b>8 lần</b>.</p>
          <div class="box key">Hôm nay: biến nằm ở dòng nào, vì sao hai biến khác nhau lại “giẫm chân” nhau, và sửa bằng cách nào với giá nào.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, rút kinh nghiệm từ bài 3, một nhóm cho 8 luồng, mỗi luồng tăng bộ đếm riêng của mình, nên không tranh chấp và kết quả luôn đúng. Nhưng thêm luồng mà chương trình gần như không nhanh hơn. Lý do là 8 bộ đếm, mỗi bộ 8 byte, nằm sát nhau trong cùng một dòng 64 byte của bộ nhớ đệm. Trong mô hình của bài, 8000 lần ghi kéo dòng đó qua lại 8000 lần, còn tách mỗi bộ đếm ra một dòng thì chỉ 8 lần. Hôm nay ta tìm hiểu biến nằm ở dòng nào, vì sao hai biến khác nhau lại giẫm chân nhau, và cách sửa với cái giá của nó."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "130 // 64 == 2 and 130 % 64 == 2 and 64 * 2 + 2 == 130"
      - "64 // 8 == 8 and len({(8 * i) // 64 for i in range(8)}) == 1"
      - "alg.par_shared_steps(8, 1000, 'reduce') == 1003"
    steps:
      - show: |
          <table class="t"><tr><th>điều sẽ dùng</th><th>nghĩa</th><th>ví dụ số</th></tr>
          <tr><td>① <b>bộ nhớ đệm</b> và <b>tính cục bộ</b></td><td>bộ nhớ nhỏ, nhanh, nằm sát lõi, giữ bản sao phần bộ nhớ chính vừa dùng. Vì chương trình hay dùng lại dữ liệu vừa dùng và dữ liệu nằm cạnh nó (tính cục bộ), nó chép cả một <b>dòng</b> 64 byte liền nhau, không chép từng byte</td><td>địa chỉ 130: chia 64 được 2 dư 2 — dòng số 2, byte thứ 2 trong dòng</td></tr>
          <tr><td>② một dòng chứa bao nhiêu số</td><td>cỡ dòng chia cỡ một số</td><td>số 8 byte: $\frac{64}{8} = 8$ số một dòng — đọc 8 số liền nhau chỉ tốn 1 lần chép dòng thay vì 8</td></tr>
          <tr><td>③ bài 3: luồng và rút gọn</td><td>luồng là một dòng lệnh chạy độc lập, dùng chung bộ nhớ với luồng khác; rút gọn: mỗi luồng tổng riêng, gộp một lần ở cuối</td><td>8 luồng × 1000 lần: 1003 bước</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Ta ôn ba điều sẽ dùng, bắt đầu từ bộ nhớ đệm. Bộ nhớ đệm là một bộ nhớ nhỏ và nhanh nằm sát lõi, giữ bản sao của phần bộ nhớ chính vừa dùng. Vì chương trình hay dùng lại dữ liệu vừa dùng và dữ liệu nằm ngay cạnh nó, gọi là tính cục bộ, bộ nhớ đệm chép cả một dòng 64 byte liền nhau, không chép từng byte. Địa chỉ 130 chia 64 được 2 dư 2, nên nằm ở dòng số 2, byte thứ 2 trong dòng. Một dòng 64 byte chứa được 8 số loại 8 byte, nên đọc 8 số liền nhau chỉ tốn một lần chép dòng thay vì 8 lần. Ở bài 3, luồng là một dòng lệnh chạy độc lập dùng chung bộ nhớ với các luồng khác. Phép rút gọn của bài đó cho mỗi luồng một tổng riêng rồi gộp một lần ở cuối, 8 luồng mỗi luồng 1000 lần chỉ mất 1003 bước."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: dòng của một địa chỉ, chia sẻ thật và chia sẻ giả"
    steps:
      - show: |
          $$\text{dòng của địa chỉ } a = \left\lfloor \frac{a}{64} \right\rfloor$$
          <p>Làm thử: $\left\lfloor \frac{130}{64} \right\rfloor = 2$; $\left\lfloor \frac{56}{64} \right\rfloor = 0$; $\left\lfloor \frac{64}{64} \right\rfloor = 1$.</p>
        introduces: [floor]
        focus: [1, 1, 2]
        say: "Ký hiệu móc vuông có hai chân ở dưới là làm tròn xuống, tức chia rồi bỏ phần dư. Dòng của địa chỉ a bằng a chia 64, làm tròn xuống. Làm thử, 130 chia 64 làm tròn xuống được 2, địa chỉ 56 thuộc dòng 0, còn địa chỉ 64 đã sang dòng 1."
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>nhất quán bộ nhớ đệm</b></td><td>mỗi lõi có bộ nhớ đệm riêng; khi một lõi <b>ghi</b> vào một dòng, bản sao dòng đó ở các lõi khác phải bị <b>huỷ</b> trước</td></tr>
          <tr><td><b>chia sẻ thật</b></td><td>hai luồng dùng <b>cùng một biến</b> — phải đồng bộ (bài 3)</td></tr>
          <tr><td><b>chia sẻ giả</b></td><td>hai luồng dùng hai biến <b>khác nhau</b> nhưng <b>chung một dòng</b> — đúng kết quả, nhưng dòng bị kéo qua lại</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", "1.4"]
        say: "Bài dùng ba thuật ngữ. Nhất quán bộ nhớ đệm nghĩa là mỗi lõi có bộ nhớ đệm riêng, và khi một lõi ghi vào một dòng, bản sao dòng đó ở các lõi khác phải bị huỷ trước. Nhờ vậy không lõi nào đọc phải số cũ. Chia sẻ thật là hai luồng dùng cùng một biến, phải đồng bộ như bài 3. Chia sẻ giả là hai luồng dùng hai biến khác nhau nhưng chung một dòng. Kết quả vẫn đúng, nhưng dòng bị kéo qua lại giữa các lõi."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Tám bộ đếm trong một dòng, và tám dòng riêng"
    checks:
      - "alg.par_cache_lines([8 * i for i in range(8)]) == [0] and alg.par_cache_lines([64 * i for i in range(8)]) == list(range(8))"
    steps:
      - show: |
          <div><svg width="1200" height="400" viewBox="0 0 1200 400"><defs><marker id="ar5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
          <text x="100" y="34" font-size="22" font-weight="bold" fill="#b91c1c">ghép sát: 8 bộ đếm, mỗi bộ 8 byte, nằm trong MỘT dòng 64 byte</text>
          <rect x="100" y="56" width="1000" height="56" fill="none" stroke="#b91c1c" stroke-width="3"/>
          <rect x="100" y="56" width="125" height="56" fill="#fde8e8" stroke="#e11d48" stroke-width="1.5"/><text x="162" y="92" font-size="20" text-anchor="middle" fill="#1f2937">đếm 0</text>
          <rect x="117" y="150" width="90" height="40" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="162" y="177" font-size="20" text-anchor="middle" fill="#1f2937">lõi 0</text>
          <line x1="162" y1="148" x2="162" y2="116" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar5f)"/>
