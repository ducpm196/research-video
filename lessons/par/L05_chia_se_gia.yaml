  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra số lần kéo dòng khi các luồng ghi xoay vòng"
    checks:
      - "alg.par_line_transfers([0, 8], 3) == (6, 6) and alg.par_line_transfers([0, 64], 3) == (2, 6)"
    steps:
      - show: |
          <p><b>Bước 1 — luật.</b> Một lần ghi phải kéo dòng về khi lõi đó <b>chưa giữ</b> dòng ở trạng thái được ghi, tức người ghi trước đó trên dòng này là <b>lõi khác</b> (hoặc chưa ai). Vì ghi của lõi kia đã huỷ bản sao của mình.</p>
          <p><b>Bước 2 — cùng dòng.</b> Nếu các luồng ghi xoay vòng 0, 1, 0, 1… vào cùng một dòng, người ghi trước <b>luôn</b> là lõi khác: mọi lần ghi đều kéo dòng.</p>
          <p><b>Bước 3 — dòng riêng.</b> Nếu mỗi lõi có dòng riêng, chỉ lần ghi <b>đầu tiên</b> của mỗi lõi phải kéo: số lần kéo = số luồng.</p>
        focus: [1, 1, 1, 2, 3]
        say: "Bước một là luật của mô hình. Một lần ghi phải kéo dòng về khi lõi đó chưa giữ dòng ở trạng thái được ghi. Tức là người ghi trước đó trên dòng này là lõi khác hoặc chưa có ai, vì lần ghi của lõi kia đã huỷ bản sao của mình. Bước hai, nếu các luồng ghi xoay vòng vào cùng một dòng thì người ghi trước luôn là lõi khác, nên mọi lần ghi đều kéo dòng. Bước ba, nếu mỗi lõi có dòng riêng thì chỉ lần ghi đầu tiên của mỗi lõi phải kéo, nên số lần kéo bằng số luồng."
      - clear: true
        show: |
          <p><b>Làm thử ngay:</b> 2 luồng, mỗi luồng ghi 3 lần, xoay vòng A, B, A, B, A, B.</p>
          <table class="t"><tr><th>bố trí</th><th>địa chỉ</th><th>dòng</th><th>số lần kéo</th></tr>
          <tr><td>sát nhau</td><td>0 và 8</td><td>0 và 0</td><td>6 trên 6 lần ghi</td></tr>
          <tr><td>đệm</td><td>0 và 64</td><td>0 và 1</td><td>$\hlg{2}$ trên 6 lần ghi</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Làm thử ngay với 2 luồng, mỗi luồng ghi 3 lần, xoay vòng A, B, A, B. Hai biến ở địa chỉ 0 và 8 cùng thuộc dòng 0, nên cả 6 lần ghi đều kéo dòng. Đệm biến thứ hai ra địa chỉ 64 thì hai biến ở hai dòng, chỉ 2 lần ghi đầu phải kéo."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tám luồng, mỗi luồng ghi 1000 lần: từng bố trí"
    checks:
      - "[a // 64 for a in range(0, 64, 8)] == [0] * 8"
      - "alg.par_line_transfers([8 * i for i in range(8)], 1000) == (8000, 8000)"
      - "alg.par_cache_lines([64 * i for i in range(8)]) == [0, 1, 2, 3, 4, 5, 6, 7] and alg.par_line_transfers([64 * i for i in range(8)], 1000) == (8, 8000)"
      - "8 * 8 == 64 and 8 * 64 == 512 and 512 // 64 == 8"
      - "alg.par_cache_lines([32 * i for i in range(8)]) == [0, 1, 2, 3] and alg.par_line_transfers([32 * i for i in range(8)], 1000) == (8000, 8000)"
    steps:
      - show: |
          <p><b>Bước 1 — ghép sát.</b> Bộ đếm $i$ ở địa chỉ $8 \cdot i$: 0, 8, 16, …, 56. Mọi số này chia 64 đều được 0: <b>cả 8 chung dòng 0</b>.</p>
        introduces: [cdot, dots]
        say: "Bước một, ghép sát. Bộ đếm thứ i nằm ở địa chỉ 8 nhân i, tức 0, 8, 16, cứ thế tới 56. Mọi số này chia 64 làm tròn xuống đều được 0, nên cả 8 bộ đếm chung dòng 0."
      - show: |
          <p><b>Bước 2 — đếm lần kéo.</b> Ghi xoay vòng, mỗi luồng 1000 lần: người ghi trước luôn là lõi khác, nên $\hl{8000}$ lần kéo trên 8000 lần ghi.</p>
        say: "Bước hai, đếm lần kéo dòng. Các luồng ghi xoay vòng, mỗi luồng 1000 lần, người ghi trước luôn là lõi khác, nên có 8000 lần kéo dòng trên 8000 lần ghi."
      - clear: true
        show: |
          <p><b>Bước 3 — đệm.</b> Bộ đếm $i$ ở địa chỉ $64 \cdot i$: dòng $i$. Mỗi lõi chỉ kéo dòng của mình một lần: $\hlg{8}$ lần kéo trên 8000 lần ghi.</p>
          <table class="t"><tr><th>bố trí</th><th>bộ nhớ</th><th>số lần kéo</th></tr>
          <tr><td>ghép sát</td><td>$8 \cdot 8 = 64$ byte</td><td>8000</td></tr>
          <tr><td>đệm mỗi bộ một dòng</td><td>$8 \cdot 64 = 512$ byte, gấp 8</td><td>8</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Bước ba, đệm. Bộ đếm thứ i nằm ở địa chỉ 64 nhân i, tức ở dòng i, nên mỗi lõi chỉ kéo dòng của mình một lần, tổng cộng 8 lần kéo trên 8000 lần ghi. Ghép sát tốn 8 nhân 8 bằng 64 byte và kéo 8000 lần. Đệm tốn 8 nhân 64 bằng 512 byte, gấp 8 lần bộ nhớ, nhưng chỉ kéo 8 lần."
      - clear: true
        show: |
          <p><b>Bước 4 — đệm nửa vời.</b> Đệm mỗi bộ đếm ra 32 byte: địa chỉ 0, 32, 64, … , 224 rơi vào dòng 0, 0, 1, 1, 2, 2, 3, 3.</p>
          <table class="t"><tr><th>đệm</th><th>số dòng dùng</th><th>số luồng mỗi dòng</th><th>số lần kéo</th></tr>
          <tr><td>32 byte</td><td>4</td><td>2</td><td>$\hl{8000}$ — không đỡ chút nào</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước bốn, đệm nửa vời. Nếu đệm mỗi bộ đếm ra 32 byte, các địa chỉ 0, 32, 64 cứ thế tới 224 rơi vào dòng 0, 0, 1, 1, 2, 2, 3, 3. Mỗi dòng vẫn có 2 luồng thay nhau ghi, nên vẫn 8000 lần kéo, không đỡ chút nào."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "[a >> 6 for a in (0, 56, 64, 130, 448)] == [0, 0, 1, 2, 7]"
      - "8 * 1000 - 0 == 8000 and 8 * 1 == 8"
      - "sum(1 for i in range(8) for j in range(i + 1, 8) if (8 * i) // 64 == (8 * j) // 64) == 28"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>dòng của địa chỉ</td><td>64 là 2 mũ 6, nên bỏ 6 bit thấp: 130 → 2, 448 → 7, 56 → 0 ✓</td></tr>
          <tr><td>8000 và 8</td><td>đếm theo luật: ghép sát, mỗi lần ghi có người ghi trước khác mình trừ khi chỉ có một luồng → 8000; đệm: mỗi lõi chỉ lần đầu → 8 ✓</td></tr>
          <tr><td>ai giẫm chân ai</td><td>đếm cặp luồng chung dòng: ghép sát có $\frac{8 \cdot 7}{2} = 28$ cặp; đệm 64 byte: 0 cặp ✓</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ta kiểm theo đường khác. Vì 64 là 2 mũ 6, tìm dòng chỉ cần bỏ 6 bit thấp của địa chỉ, 130 ra 2, 448 ra 7, 56 ra 0, khớp phép chia. Đếm thẳng theo luật, ghép sát thì mỗi lần ghi đều có người ghi trước khác mình, nên 8000, còn đệm thì mỗi lõi chỉ kéo lần đầu, nên 8. Cuối cùng, đếm cặp luồng chung dòng, ghép sát có 8 nhân 7 chia 2, bằng 28 cặp giẫm chân nhau, còn đệm 64 byte thì không có cặp nào."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "alg.par_line_transfers([32 * i for i in range(8)], 1000)[0] == 8000"
      - "10 ** 6 * 64 == 64 * 10 ** 6 and 10 ** 6 * 8 == 8 * 10 ** 6 and 64 // 8 == 8"
      - "alg.par_line_transfers([64 * i for i in range(8)], 1)[0] == 8"
    steps:
      - show: |
          <table class="t"><tr><th>lỗi</th><th>vì sao sai</th><th>phép thử bắt được</th></tr>
          <tr><td><b class="red">1.</b> Tin kiểm thử: “kết quả đúng là xong”</td><td>chia sẻ giả không làm sai kết quả, chỉ làm chậm — không kiểm thử đúng/sai nào bắt được</td><td>đo thời gian khi tăng số luồng; công cụ đếm lần trượt bộ nhớ đệm</td></tr>
          <tr><td><b class="red">2.</b> Đệm nửa dòng</td><td>32 byte: vẫn 2 luồng mỗi dòng, vẫn 8000 lần kéo</td><td>tính dòng của từng biến</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3"]
        say: "Bảng có hai lỗi đầu. Lỗi thứ nhất, tin kiểm thử, kết quả đúng là xong. Chia sẻ giả không làm sai kết quả mà chỉ làm chậm, nên không bài kiểm thử đúng sai nào bắt được, phải đo thời gian khi tăng số luồng. Lỗi thứ hai, đệm nửa dòng, 32 byte vẫn để 2 luồng chung một dòng, vẫn 8000 lần kéo."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3</b> (người đã đi làm). Gõ cứng số 64 vào mã
          <br><span class="note">Cỡ dòng do phần cứng quyết định. Thư viện chuẩn C++ có hằng số <code>std::hardware_destructive_interference_size</code>: “khoảng cách tối thiểu giữa hai đối tượng để tránh chia sẻ giả”, giá trị do bản cài đặt quyết định (ví dụ của trang tham khảo in ra 64 trên x86-64).</span></div>
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là gõ cứng số 64 vào mã. Cỡ dòng do phần cứng quyết định. Thư viện chuẩn của một ngôn ngữ lập trình phổ biến có sẵn một hằng số, là khoảng cách tối thiểu giữa hai đối tượng để tránh chia sẻ giả. Giá trị của nó do bản cài đặt quyết định. Hãy dùng hằng số đó thay vì tự đoán."
      - show: |
          <div class="box warn"><b>Lỗi 4</b> (người đã đi làm). Đệm mọi thứ
          <br><span class="note">1 triệu bộ đếm (số minh hoạ): ghép sát 8 MB, đệm 64 MB — gấp 8, đẩy dữ liệu khác ra khỏi bộ nhớ đệm. Thường tốt hơn: biến <b>cục bộ</b> trong luồng, ghi vào mảng chung <b>một lần</b> ở cuối (như rút gọn ở bài 3): 8 lần kéo, không tốn thêm bộ nhớ.</span></div>
        say: "Lỗi thứ tư cũng của người đã đi làm, là đệm mọi thứ. Một triệu bộ đếm, một số minh hoạ, ghép sát tốn 8 MB, đệm thì tốn 64 MB, gấp 8 lần, và đẩy dữ liệu khác ra khỏi bộ nhớ đệm. Thường tốt hơn là giữ biến cục bộ trong luồng, rồi ghi vào mảng chung đúng một lần ở cuối như phép rút gọn ở bài 3."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: 16 luồng, bộ đếm 4 byte"
    checks:
      - "64 // 4 == 16 and alg.par_cache_lines([4 * i for i in range(16)]) == [0]"
      - "alg.par_line_transfers([4 * i for i in range(16)], 1000) == (16000, 16000)"
      - "alg.par_line_transfers([64 * i for i in range(16)], 1000) == (16, 16000) and 16 * 64 == 1024 and 16 * 4 == 64"
      - "alg.par_line_transfers([4 * i for i in range(16)], 1) == (16, 16)"
    steps:
