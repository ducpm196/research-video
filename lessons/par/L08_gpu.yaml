scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hàng nghìn lõi, mà thêm một câu điều kiện là chậm gấp đôi"
    checks:
      - "alg.par_warp_passes([t % 2 for t in range(32)])[0] == 2 and alg.par_transactions(32, seg=32) // alg.par_transactions(1, seg=32) == 8"
    steps:
      - show: |
          <p>Đội bạn chuyển hàm xử lý ảnh lên một thẻ đồ hoạ quảng cáo “hàng nghìn lõi” (số đo dưới đây là số minh hoạ).</p>
          <table class="t"><tr><th>phiên bản</th><th>thay đổi</th><th>thời gian</th></tr>
          <tr><td>A</td><td>mỗi luồng xử lý một điểm ảnh</td><td>1 ms</td></tr>
          <tr><td>B</td><td>thêm: luồng chẵn làm việc này, luồng lẻ làm việc kia</td><td><b>2 ms</b></td></tr>
          <tr><td>C</td><td>đọc ảnh theo cột thay vì theo hàng</td><td><b>8 ms</b></td></tr></table>
          <div class="box key">Hôm nay ta trả lời: vì sao một câu điều kiện làm chậm gấp đôi? Vì sao đổi hàng sang cột làm chậm gấp 8? Và giao việc cho luồng thế nào cho đúng?</div>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Chào bạn, đội bạn chuyển hàm xử lý ảnh lên một thẻ đồ hoạ quảng cáo hàng nghìn lõi, các số đo ở đây là số minh hoạ. Phiên bản A cho mỗi luồng xử lý một điểm ảnh, mất 1 mi li giây. Phiên bản B chỉ thêm một điều kiện, luồng chẵn làm việc này, luồng lẻ làm việc kia, và mất 2 mi li giây. Phiên bản C đọc ảnh theo cột thay vì theo hàng, mất tới 8 mi li giây. Hôm nay ta trả lời vì sao, và giao việc cho luồng thế nào cho đúng."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "4 * 5 == 20 and 100 // 32 == 3 and 100 % 32 == 4"
      - "round(32 / 64 * 100) == 50"
    steps:
      - show: |
          <p><b>① Bài 6, một lệnh nhiều dữ liệu:</b> một lệnh vector làm cùng một phép trên 8 số cùng lúc. Bộ xử lý đồ hoạ đẩy ý này lên <b>32 luồng</b>.</p>
          <p><b>② Bài 7, mái nhà:</b> nhân có cường độ thấp bị chặn bởi <b>băng thông</b> — mỗi byte đọc phí đi là tốc độ mất đi.</p>
        focus: [1, 1, 2]
        say: "Điều thứ nhất, ở bài 6, một lệnh vector làm cùng một phép trên 8 số cùng lúc. Bộ xử lý đồ hoạ đẩy ý này lên 32 luồng. Điều thứ hai, ở bài 7, ta thấy nhân có cường độ thấp bị chặn bởi băng thông, nên mỗi byte đọc phí là tốc độ mất đi."
      - show: |
          <p><b>③ Địa chỉ và đoạn.</b> Dấu chấm giữa dòng là phép nhân. Số thực 32 bit chiếm 4 byte, nên phần tử thứ 5 nằm ở địa chỉ $4 \cdot 5 = 20$. Bộ nhớ chia thành <b>đoạn 32 byte</b>; địa chỉ 100 chia 32 được 3, dư 4, nên nằm ở <b>đoạn số 3</b>.</p>
          <p>Hiệu suất = phần có ích chia phần đã chạy: chạy 64 phần mà chỉ 32 phần có ích là 50%.</p>
        introduces: [cdot]
        focus: [1, 1, 1, 2]
        say: "Điều thứ ba, dấu chấm giữa dòng là phép nhân. Số thực 32 bit chiếm 4 byte, nên phần tử thứ 5 nằm ở địa chỉ 4 nhân 5 bằng 20. Bộ nhớ được chia thành các đoạn 32 byte, và địa chỉ 100 chia 32 được 3 dư 4, nên nằm ở đoạn số 3. Cuối cùng, hiệu suất bằng phần có ích chia phần đã chạy, chạy 64 phần mà chỉ 32 phần có ích là 50 phần trăm."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: lưới, khối, nhóm 32 luồng, luồng"
    steps:
      - show: |
          <table class="t"><tr><th>tên trên màn hình</th><th>lời đọc</th><th>nghĩa</th></tr>
          <tr><td>thread</td><td><b>luồng</b></td><td>một dòng lệnh nhỏ, thường lo một phần tử dữ liệu</td></tr>
          <tr><td>warp</td><td><b>nhóm 32 luồng</b> chạy chung lệnh</td><td>32 luồng liền nhau, mỗi lúc cùng chạy MỘT lệnh</td></tr>
          <tr><td>block</td><td><b>khối</b></td><td>nhiều nhóm luồng chạy trên cùng một cụm xử lý, dùng chung bộ nhớ nhanh</td></tr>
          <tr><td>grid</td><td><b>lưới</b></td><td>mọi khối của một lần gọi; số khối theo cỡ dữ liệu</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn tên, tên gốc tiếng Anh chỉ ghi trên màn hình. Luồng là một dòng lệnh nhỏ, thường lo một phần tử dữ liệu. Nhóm 32 luồng là 32 luồng liền nhau, và mỗi lúc chúng cùng chạy một lệnh. Khối gồm nhiều nhóm luồng chạy trên cùng một cụm xử lý, dùng chung một bộ nhớ nhanh. Lưới là mọi khối của một lần gọi, và số khối đi theo cỡ dữ liệu."
      - show: |
          <p>Bài báo năm 2008 của nhóm thiết kế mô hình lập trình: “chạy các <b>nhóm 32 luồng song song gọi là warp</b>” — cái tên mượn từ nghề dệt, “công nghệ luồng song song đầu tiên”.</p>
          <p>Các khối phải <b>độc lập</b>: “phải chạy được theo <b>thứ tự bất kỳ</b>, song song hay nối tiếp”. Nhờ vậy cùng một chương trình chạy trên thẻ ít hay nhiều cụm xử lý.</p>
        focus: [1, 2, 2]
        say: "Bài báo năm 2008 của nhóm thiết kế mô hình lập trình này viết rằng luồng chạy theo các nhóm 32 luồng song song, cái tên tiếng Anh mượn từ sợi dọc trong nghề dệt. Các khối phải độc lập, chạy được theo thứ tự bất kỳ, song song hay nối tiếp. Nhờ vậy cùng một chương trình chạy được trên thẻ có ít hay nhiều cụm xử lý."

