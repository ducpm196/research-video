source: "curriculum/par.yaml L08; audit/par/verify_par.py L08; audit/par/sources_L08.md (câu trích nguyên văn, đọc 2026-11-02); NVIDIA, CUDA C++ Best Practices Guide (docs.nvidia.com, bản hiện hành) — mục Coalesced Access to Global Memory, Strided Accesses, Branching and Divergence [BPG]; J. Nickolls, I. Buck, M. Garland, K. Skadron, Scalable Parallel Programming with CUDA, ACM Queue 6(2), 2008 (bản chép tại grothoff.org) [NI08]; PAR bài 6 (một lệnh nhiều dữ liệu), bài 7 (mái nhà)"
assumes: [arith, frac, approx, power]
# Quy ước: “GPU” = bộ xử lý đồ hoạ (lời đọc nói “bộ xử lý đồ hoạ” hoặc “thẻ đồ hoạ”); “warp” = nhóm 32 luồng chạy chung lệnh (tên gốc chỉ
#   trên màn hình); “khối” = thread block; “cụm xử lý” = SM. Luồng được đánh số t = 0, 1, …, 31 trong một nhóm.
#   Truy cập bộ nhớ chính: theo [BPG], các lượt đọc của một nhóm 32 luồng gộp thành số GIAO DỊCH 32 byte đủ phục vụ mọi luồng; một
#   giao dịch = một đoạn 32 byte thẳng hàng (địa chỉ chia 32 lấy phần nguyên = số thứ tự đoạn). Số thực 32 bit = 4 byte, phần tử i ở
#   địa chỉ 4 · i (tính từ đầu mảng, mảng bắt đầu ở đầu một đoạn). Hiệu suất đọc = byte cần dùng / byte đã chuyển.
#   Mọi thời gian, số lệnh trong ví dụ là SỐ MINH HOẠ, ghi rõ.
objectives:
  - "Đọc được cấu trúc lưới, khối, nhóm 32 luồng và vì sao các khối phải chạy được theo thứ tự bất kỳ"
  - "Tính số lượt chạy và hiệu suất khi một nhóm 32 luồng rẽ nhiều nhánh"
  - "Đếm số giao dịch 32 byte khi 32 luồng đọc liền nhau, theo bước nhảy, hay lệch đầu đoạn"
  - "Chọn cách giao việc cho luồng để đọc gộp và tránh phân kỳ"
