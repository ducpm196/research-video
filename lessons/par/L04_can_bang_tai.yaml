id: L04
course: PAR
series: "PAR · Tính toán song song và GPU"
title: "Bài 4 — Phân rã và cân bằng tải: chia tĩnh, chia động, việc dài trước"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/par.yaml L04; audit/par/verify_par.py L04; audit/par/sources_L04.md (câu trích nguyên văn, đọc 2026-11-02); OpenMP API Specification 5.0 (11/2018), mục 2.9.2 Worksharing-Loop Construct, bảng 2.5 (static: khúc chia xoay vòng theo thứ tự luồng; dynamic: mỗi luồng làm xong một khúc thì xin khúc khác, mặc định khúc 1 lượt lặp; guided); PAR bài 2 (cận dưới T₁/n và đường găng)"
assumes: [arith, frac, approx, geq]
# Quy ước: n = số lõi; việc j có độ dài t_j (giây, số minh hoạ); T₁ = tổng độ dài mọi việc (bài 2); “thời gian hoàn thành” C = lúc lõi
#   xong cuối cùng làm xong. Chia khối = alg.par_static_blocks; chia vòng = alg.par_static_cyclic; chia động = alg.par_list_schedule /
#   alg.par_dynamic_trace (lõi rảnh sớm nhất nhận việc kế tiếp, hoà thì lõi A); việc dài trước = alg.par_lpt; tối ưu = alg.par_best_makespan
#   (thử mọi cách gán, chỉ cho ví dụ nhỏ). Dấu nhân: · (\cdot).
#   Tên OpenMP chỉ trên màn hình (chưa dò phát âm): lời đọc nói “chuẩn lập trình song song bộ nhớ chung phổ biến”.
#   Số minh hoạ: 8 ảnh dài 8, 7, …, 1 giây; 1000 việc 1 mi li giây, lấy việc 0,1 mi li giây; 1 việc 30 giây giữa 100 việc 1 giây.
objectives:
  - "Tính thời gian hoàn thành của chia khối, chia vòng, chia động và việc dài trước cho một danh sách việc"
  - "Dùng cận dưới max(T₁/n, việc dài nhất) để biết một lịch đã tối ưu chưa"
  - "Chọn cách chia và cỡ khúc việc khi biết hay không biết trước độ dài việc"
asr_reviewed:
  - {sentence: "Chuẩn lập trình song song bộ nhớ chung phổ biến có sẵn cả lịch tĩnh lẫn lịch động có cỡ khúc.", reason: "ASR chép “Chưởng lập trình xong xong bộ nhớ chung phộ biến có sẵn cả lịch tỉnh lẫn lịch đồng có cớ khúc.” (0.762): lệch âm/thanh thuần Việt: chuẩn/chưởng, phổ/phộ, tĩnh/tỉnh, động/đồng, cỡ/cớ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai lõi, tám ảnh: một lõi ngồi chơi 16 giây"
    checks:
      - "alg.par_static_blocks([8, 7, 6, 5, 4, 3, 2, 1], 2) == [26, 10] and 26 - 10 == 16"
      - "alg.par_lpt([8, 7, 6, 5, 4, 3, 2, 1], 2) == [18, 18]"
    steps:
      - show: |
          <p>Tám ảnh cần xử lý, dài 8, 7, 6, 5, 4, 3, 2, 1 giây (số minh hoạ), trên máy <b>2 lõi</b>. Chia đôi danh sách: lõi A làm 4 ảnh đầu, lõi B 4 ảnh sau.</p>
          <p>Kết quả: A mất <b>26 giây</b>, B xong sau 10 giây rồi <b>ngồi chơi 16 giây</b>. Đổi cách chia, không đổi máy: cả hai xong sau <b>18 giây</b>.</p>
          <div class="box key">Hôm nay: chia việc thế nào để không lõi nào ngồi chờ, làm sao biết một cách chia đã tốt nhất, và khi nào nên chia động.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, tám ảnh cần xử lý, dài 8, 7, 6, 5, 4, 3, 2 và 1 giây, một số minh hoạ, trên máy 2 lõi. Ta chia đôi danh sách, lõi A làm 4 ảnh đầu, lõi B làm 4 ảnh sau. Kết quả lõi A mất 26 giây, còn lõi B xong sau 10 giây rồi ngồi chơi 16 giây. Chỉ đổi cách chia, không đổi máy, cả hai lõi cùng xong sau 18 giây. Hôm nay ta học cách chia việc để không lõi nào ngồi chờ, cách biết một lịch đã tốt nhất, và khi nào nên chia động."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "sum([8, 7, 6, 5, 4, 3, 2, 1]) == 36 == 8 * 9 // 2"
      - "36 / 2 == 18 and max(36 / 2, 8) == 18"
      - "max([26, 10]) == 26"
    steps:
      - show: |
          <table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ số</th></tr>
          <tr><td>① Tổng các số từ 1 đến 8</td><td>$8 + 7 + \dots + 1 = \frac{8 \cdot 9}{2} = 36$</td></tr>
          <tr><td>② Ở bài 2: $n$ lõi mỗi giây làm nhiều nhất $n$ giây việc, nên thời gian ít nhất bằng $\frac{T_1}{n}$; và không ngắn hơn chuỗi phải làm nối tiếp</td><td>$T_1 = 36$, 2 lõi: ít nhất $\frac{36}{2} = 18$ giây</td></tr>
          <tr><td>③ Lấy số lớn nhất: $\max$</td><td>$\max(26, 10) = 26$: phải chờ lõi chậm nhất</td></tr></table>
        introduces: [dots, cdot, sub, max_fn]
        focus: [0, "1.2", "1.3", "1.3", "1.4"]
        say: "Ta ôn ba điều sẽ dùng. Thứ nhất, tổng các số từ 1 đến 8 bằng 8 nhân 9 chia 2, tức 36, dấu ba chấm là cứ thế tiếp tục và dấu chấm giữa dòng là phép nhân. Thứ hai, ở bài 2, n lõi mỗi giây làm nhiều nhất n giây việc, nên thời gian ít nhất bằng T một, tức tổng công việc, chia n. Với tổng 36 giây trên 2 lõi, ít nhất phải 18 giây. Thứ ba, ký hiệu lấy số lớn nhất, số lớn nhất của 26 và 10 là 26, vì cả nhóm phải chờ lõi chậm nhất."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: thời gian hoàn thành và bốn cách chia"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td>$C$ — <b>thời gian hoàn thành</b></td><td>lúc lõi xong <b>cuối cùng</b> làm xong; $C = \max$ của tổng thời gian các lõi</td></tr>
          <tr><td><b>chia khối</b> (tĩnh)</td><td>chia trước, mỗi lõi một đoạn liền nhau, cùng số việc</td></tr>
          <tr><td><b>chia vòng</b> (tĩnh)</td><td>chia trước, việc 1 cho A, việc 2 cho B, việc 3 cho A…</td></tr>
          <tr><td><b>chia động</b></td><td>việc xếp hàng; lõi nào rảnh thì lấy việc kế tiếp</td></tr>
          <tr><td><b>việc dài trước</b></td><td>chia động, nhưng sắp hàng việc từ dài tới ngắn</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng một chữ và bốn cách chia. Chữ C hoa là thời gian hoàn thành, tức lúc lõi xong cuối cùng làm xong, bằng số lớn nhất trong tổng thời gian của các lõi. Chia khối là chia trước, mỗi lõi một đoạn liền nhau, cùng số việc. Chia vòng cũng chia trước, việc một cho A, việc hai cho B, việc ba lại cho A, cứ thế xoay vòng. Chia động thì việc xếp hàng, lõi nào rảnh thì lấy việc kế tiếp. Việc dài trước là chia động, nhưng sắp hàng việc từ dài tới ngắn."

