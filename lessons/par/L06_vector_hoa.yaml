id: L06
course: PAR
series: "PAR · Tính toán song song và GPU"
title: "Bài 6 — Vector hoá: một lệnh, nhiều dữ liệu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/par.yaml L06; audit/par/verify_par.py L06; audit/par/sources_L06.md (câu trích nguyên văn, đọc 2026-11-03); Rust core::arch x86, __m256 (doc.rust-lang.org) — tập 256 bit gồm 8 số f32, ứng với tính năng avx; _mm256_add_ps — cộng các số thực 32 bit đóng gói; GCC, Auto-vectorization in GCC (gcc.gnu.org/projects/tree-ssa/vectorization.html) — ví dụ a[i] = b[i] + c[i], vòng phần dư khi số lượt không chia hết hệ số vector hoá, không vector hoá khi có thể phụ thuộc giữa các truy cập; CSA bài 7 (lệnh, thanh ghi); PAR bài 2 (đường găng), bài 3 (số thực không kết hợp)"
assumes: [arith, frac, approx]
# Quy ước: w = số làn = số bit của thanh ghi vector chia số bit của một phần tử (256 / 32 = 8); N = số phần tử của vòng lặp.
#   Vòng vector hoá: ⌊N / w⌋ lệnh vector, rồi N − w · ⌊N / w⌋ lượt vô hướng ở cuối (vòng phần dư) — alg.par_vector_split, alg.par_vector_add.
#   Chỉ đếm LỆNH CỘNG (bỏ qua lệnh nạp, lưu, nhảy) — mô hình của bài, ghi trên màn hình. a[i] = a[i − 1] + b[i]: alg.par_recurrence
#   (width = w là vector hoá ngây thơ, mỗi khúc đọc giá trị cũ). Tổng theo làn: alg.par_lane_sum.
#   Tên AVX, SIMD, GCC, C, Rust chỉ trên màn hình; lời đọc nói “một lệnh, nhiều dữ liệu”, “thanh ghi vector 256 bit”, “trình biên dịch”.
#   Số minh hoạ: băng thông 20 GB/s, lõi 2 tỉ phép cộng mỗi giây (Lỗi 3).
objectives:
  - "Tính số làn của thanh ghi vector và số lệnh vector, số lượt phần dư cho một vòng lặp"
  - "Nhận ra điều kiện để vector hoá: các lượt lặp không phụ thuộc nhau"
  - "Giải thích vì sao vector hoá một phép tổng số thực đổi chữ số cuối, và vì sao ít lệnh hơn chưa chắc nhanh hơn ngần ấy lần"
asr_reviewed:
  - {sentence: "Nhưng bộ nhớ chỉ đưa được 20 tỉ byte mỗi giây, mỗi phần tử cần đọc 8 byte và ghi 4 byte, tức chỉ khoảng 1 phẩy 67 tỉ phần tử mỗi giây.", reason: "ASR chép “Nhưng bộ nhớ chỉ đưa được 20 tỷ bai mỗi giây, mỗi phần tử cần đọc 8 bai và ghi 4 bai, tức chỉ khoảng 1,67 tỷ phần tử mỗi giây.” (0.861): “tỉ” ASR viết chính tả “tỷ” (cùng âm); byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ hai, ép vector hoá vòng có phụ thuộc, làn sau dùng giá trị cũ nên ra 1, 1, 1 thay vì 1, 2, 3.", reason: "ASR chép “Lỗi thứ 2, F vét tờ hóa vòng có phụ thuộc là sau dùng giá trị cũ nên ra 1, 1, 1 thay vì 1, 2, 3.” (0.889): lệch âm/thanh thuần Việt: ép/f, tơ/tờ, làn/là — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở bài sau, bài 7, ta học cách biết một chương trình bị chặn bởi phép tính hay bởi bộ nhớ, bằng mô hình mái nhà, đếm số phép tính trên mỗi byte phải đọc.", reason: "ASR chép “Ở bài sau, bài 7, ta học cách biết một chương trình bị chặn bởi phép tính hay bởi bộ nhớ bằng mô hình máy nhà, đếm số phép tính trên mỗi bài phải đọc.” (0.943): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: mái/máy — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đáp án vòng A, số làn w bằng 512 chia 64, tức 8, và 1000 chia hết cho 8 được 125, không có phần dư.", reason: "ASR chép “Đáp án vòng A, số lạng V kết bằng 512 chia 64, tức 8 và 1000 chia hết cho 8 được 125, không có phần dư.” (0.944): chữ w đọc “vê kép” (luật chung), ASR viết tách chữ; lệch âm/thanh thuần Việt: làn/lạng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vòng B, s i bằng s i trừ 1 chia 2 cộng x i, có vector hoá trực tiếp được không?", reason: "ASR chép “Vòng B, S y bằng S y trừ 1 chia 2 cộng x y, có vét tờ hóa trực tiếp được không?” (0.955): lệch âm/thanh thuần Việt: tơ/tờ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng một vòng lặp, ít lệnh hơn gần 8 lần"
    checks:
      - "alg.par_vector_split(1003, 8) == (125, 3) and 125 + 3 == 128 and round(1003 / 128, 2) == 7.84"
      - "alg.par_recurrence([1] * 8, width=8) != alg.par_recurrence([1] * 8)"
    steps:
      - show: |
          <p>Vòng lặp cộng hai mảng 1003 số thực: <b>1003 lệnh cộng</b>. Trình biên dịch đổi sang thanh ghi vector 256 bit: chỉ còn <b>128 lệnh cộng</b>, ít hơn khoảng <b>7,84 lần</b> — cùng một lõi.</p>
          <p>Vòng lặp kế bên, mỗi phần tử cộng dồn phần tử trước nó, thì trình biên dịch <b>không chịu đổi</b>. Ép đổi bằng tay thì ra kết quả sai.</p>
          <div class="box key">Hôm nay: một lệnh làm được mấy phép, đếm lệnh cho một vòng lặp, và khi nào vòng lặp không vector hoá được.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, một vòng lặp cộng hai mảng 1003 số thực cần 1003 lệnh cộng. Trình biên dịch đổi sang dùng thanh ghi vector 256 bit, chỉ còn 128 lệnh cộng, ít hơn khoảng 7 phẩy 84 lần, trên cùng một lõi. Vòng lặp kế bên, mỗi phần tử cộng dồn phần tử đứng trước nó, thì trình biên dịch không chịu đổi. Ép đổi bằng tay thì ra kết quả sai. Hôm nay ta học một lệnh làm được mấy phép, cách đếm lệnh cho một vòng lặp, và khi nào vòng lặp không vector hoá được."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "32 // 8 == 4 and 256 // 8 == 32"
      - "divmod(1003, 8) == (125, 3) and 8 * 125 + 3 == 1003"
      - "alg.par_tree_sum(8)[:2] == (7, 3)"
    steps:
      - show: |
          <table class="t"><tr><th>điều sẽ dùng</th><th>ví dụ số</th></tr>
          <tr><td>① 8 bit là 1 byte</td><td>số thực 32 bit chiếm $\frac{32}{8} = 4$ byte; thanh ghi 256 bit chứa $\frac{256}{8} = 32$ byte</td></tr>
          <tr><td>② Chia có dư</td><td>1003 chia 8 được 125, dư 3: $8 \cdot 125 + 3 = 1003$</td></tr>
          <tr><td>③ Ở khoá Hệ thống máy tính: lệnh làm việc trên <b>thanh ghi</b>; ở bài 2: phép phải chờ phép trước thì nối thành đường găng</td><td>cộng dồn 8 số: đường găng 7; cộng theo cặp: 3</td></tr></table>
        introduces: [cdot]
        focus: [0, "1.2", "1.3", "1.4", "1.4"]
        say: "Ta ôn ba điều sẽ dùng. Thứ nhất, 8 bit là 1 byte, nên số thực 32 bit chiếm 4 byte, và thanh ghi 256 bit chứa 32 byte. Thứ hai, chia có dư, 1003 chia 8 được 125 dư 3, vì 8 nhân 125 cộng 3 bằng 1003, dấu chấm giữa dòng là phép nhân. Thứ ba, ở khoá Hệ thống máy tính, lệnh của bộ xử lý làm việc trên thanh ghi. Còn ở bài 2, phép nào phải chờ phép trước thì nối thành đường găng, cộng dồn 8 số có đường găng 7, cộng theo cặp chỉ 3."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: thanh ghi vector, làn, w và vòng phần dư"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>thanh ghi vector</b></td><td>thanh ghi rộng (ví dụ 256 bit) chứa nhiều số đứng cạnh nhau</td></tr>
          <tr><td><b>làn</b>, số làn $w$</td><td>mỗi ô của thanh ghi; $w = \frac{\text{bit thanh ghi}}{\text{bit một số}}$</td></tr>
          <tr><td><b>một lệnh, nhiều dữ liệu</b></td><td>một lệnh cộng cả $w$ làn cùng lúc</td></tr>
          <tr><td><b>vòng phần dư</b></td><td>vài lượt cuối không đủ $w$ phần tử, làm từng số như cũ</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Thanh ghi vector là thanh ghi rộng, ví dụ 256 bit, chứa nhiều số đứng cạnh nhau. Mỗi ô của nó gọi là một làn, số làn w bằng số bit của thanh ghi chia số bit của một số. Một lệnh, nhiều dữ liệu, nghĩa là một lệnh cộng cả w làn cùng lúc. Vòng phần dư là vài lượt cuối không đủ w phần tử, phải làm từng số như cũ."

