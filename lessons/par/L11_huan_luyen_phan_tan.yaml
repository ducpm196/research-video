id: L11
course: PAR
series: "PAR · Tính toán song song và GPU"
title: "Bài 11 — Huấn luyện phân tán: song song dữ liệu, chồng tính toán với truyền thông"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/par.yaml L11; audit/par/verify_par.py L11; audit/par/sources_L11.md (câu trích nguyên văn, đọc 2026-11-02); P. Goyal và cộng sự, Accurate, Large Minibatch SGD: Training ImageNet in 1 Hour, arXiv 1706.02677 (2017) [GO17] — quy tắc nhân tốc độ học, khởi động dần, gộp gradient song song với lan truyền ngược, chuẩn hoá mất mát theo lô toàn cục; CS115 bài 9 (SGD); PAR bài 1 (Gustafson), bài 10 (gộp toàn phần theo vòng)"
assumes: [arith, frac, approx, power]
# Quy ước: n = số thẻ; lô mỗi thẻ b (giữ cố định, như mở rộng yếu của bài 1), lô toàn cục n · b. Mỗi bước: C = thời gian tính (lan truyền
#   xuôi + ngược) trên một thẻ, G = thời gian gộp gradient bằng vòng (bài 10), O = phần G chạy chồng lên lúc đang tính.
#   Hiệu suất mở rộng E = C / (C + G − O); tốc độ tăng so với một thẻ = n · E (đếm theo số ví dụ mỗi giây).
#   η (đọc “ê-ta”) = tốc độ học; quy tắc nhân của [GO17]: lô nhân k thì η nhân k. Mốc của [GO17]: 8 thẻ × 32 = lô 256, η = 0,1.
#   Thời gian 100 ms, 30 ms, 20 ms, mô hình 150 triệu tham số, đường 35 GB/s là SỐ MINH HOẠ. GB = 10⁹ byte, số thực 32 bit = 4 byte.
objectives:
  - "Tính hiệu suất mở rộng C chia (C + G − O) khi truyền thông chồng hay không chồng với tính toán"
  - "Tính thời gian gộp gradient của một bước từ số tham số, số thẻ và băng thông"
  - "Giải thích vì sao lô toàn cục lớn cần nhân tốc độ học và khởi động dần"
  - "Quyết định thêm thẻ, tăng lô hay nâng mạng từ số đo một bước"
