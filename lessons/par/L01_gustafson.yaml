scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "1024 bộ xử lý, nhanh gấp 1021 lần — Amdahl có sai không?"
    checks:
      - "[round(1 / (s + (1 - s) / 1024)) for s in (0.008, 0.004)] == [111, 201]"
      - "round(1020 / (1 / (0.004 + 0.996 / 1024)), 1) == 5.1 and round(1021 / (1 / (0.008 + 0.992 / 1024)), 1) == 9.2"
    steps:
      - show: |
          <p>Năm 1988, một nhóm nghiên cứu ở phòng thí nghiệm quốc gia Sandia (Mỹ) báo cáo trên máy <b>1024 bộ xử lý</b>: ba ứng dụng thật nhanh gấp <b>1021</b>, <b>1020</b> và <b>1016</b> lần, phần tuần tự chỉ <b>0,4–0,8%</b>.</p>
          <p>Theo định luật Amdahl của bài 0, phần tuần tự 0,4–0,8% chỉ cho khoảng <b>111 tới 201</b> lần.</p>
          <div class="box key">Hôm nay: ① hai con số lệch nhau 5 tới 9 lần vì đâu? ② “mở rộng theo cỡ bài toán” tính thế nào? ③ báo cáo tốc độ cho đúng: mở rộng mạnh hay mở rộng yếu?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, năm 1988, một nhóm nghiên cứu ở một phòng thí nghiệm quốc gia của Mỹ báo cáo kết quả trên máy 1024 bộ xử lý. Ba ứng dụng thật nhanh gấp 1021, 1020 và 1016 lần, với phần tuần tự chỉ 0 phẩy 4 tới 0 phẩy 8 phần trăm. Nhưng theo định luật Amdahl ở bài 0, phần tuần tự như vậy chỉ cho khoảng 111 tới 201 lần. Hôm nay ta tìm xem hai con số lệch nhau 5 tới 9 lần vì đâu, tính tăng tốc theo cỡ bài toán, và học cách báo cáo tốc độ cho đúng."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại từ bài 0"
    checks:
      - "round(1 / (0.1 + 0.9 / 16), 2) == 6.4 and round(6.4 / 16, 2) == 0.4"
      - "0.9 * 16 == 14.4 and 0.4 / 100 == 0.004"
    steps:
      - show: |
          <table class="t"><tr><th>điều đã học ở bài 0</th><th>ví dụ số</th></tr>
          <tr><td>tăng tốc $S(n) = \frac{1}{(1 - p) + \frac{p}{n}}$, với $p$ đo trên <b>một</b> lõi</td><td>$p = 0{,}9$, 16 lõi: $S = 6{,}4$</td></tr>
          <tr><td>hiệu suất $E(n) = \frac{S(n)}{n}$</td><td>$\frac{6{,}4}{16} = 40\%$</td></tr>
          <tr><td>phần trăm sang số thập phân: chia 100</td><td>0,4% = 0,004</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Ta ôn ba điều đã học ở bài 0, về tăng tốc, hiệu suất và cách đổi phần trăm. Tăng tốc theo Amdahl bằng 1 chia cho phần tuần tự cộng p chia n, với p đo trên một lõi, nên p bằng 0 phẩy 9 và 16 lõi cho 6 phẩy 4 lần. Hiệu suất là tăng tốc chia số lõi, ở đây 6 phẩy 4 chia 16 bằng 40 phần trăm. Đổi phần trăm sang số thập phân thì chia cho 100, nên 0 phẩy 4 phần trăm là 0 phẩy 004."
      - show: |
          <p><b>Nhân một tổng với một số:</b> $0{,}9 \cdot 16 = 14{,}4$, rồi cộng $0{,}1$ được $14{,}5$. Dấu chấm giữa là phép nhân, như bài 0.</p>
        say: "Điều thứ tư là phép nhân rồi cộng, 0 phẩy 9 nhân 16 bằng 14 phẩy 4, cộng thêm 0 phẩy 1 được 14 phẩy 5. Dấu chấm giữa vẫn là phép nhân như ở bài 0."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: mở rộng mạnh, mở rộng yếu, q và G(n)"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>mở rộng mạnh</b></td><td>giữ nguyên bài toán, thêm lõi để xong <b>sớm hơn</b> (câu hỏi của Amdahl)</td></tr>
          <tr><td><b>mở rộng yếu</b></td><td>mỗi lõi giữ phần việc như cũ, thêm lõi để làm bài toán <b>lớn hơn</b> trong cùng thời gian</td></tr>
          <tr><td>$q$ (đọc “q”)</td><td>tỉ lệ thời gian tuần tự, đo trong lần chạy <b>trên máy $n$ lõi</b></td></tr>
          <tr><td>$G(n)$ (đọc “G của n”)</td><td><b>tăng tốc theo cỡ</b>: máy một lõi cần bao nhiêu lần thời gian để làm cùng bài toán lớn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.4"]
        say: "Bài dùng hai khái niệm và hai ký hiệu. Mở rộng mạnh là giữ nguyên bài toán và thêm lõi để xong sớm hơn, đây là câu hỏi của Amdahl. Mở rộng yếu là mỗi lõi giữ phần việc như cũ, thêm lõi để làm bài toán lớn hơn trong cùng thời gian. Chữ q là tỉ lệ thời gian tuần tự, nhưng đo trong lần chạy trên máy n lõi, khác với p của bài 0 đo trên một lõi. G của n là tăng tốc theo cỡ, tức máy một lõi phải mất bao nhiêu lần thời gian để làm cùng bài toán lớn đó. Hãy để ý chữ đo trên máy nào, vì toàn bộ bài xoay quanh chi tiết này."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai câu hỏi, hai bức hình"
    checks:
      - "10 + 90 / 16 == 15.625 and 10 + 90 * 16 == 1450 and 1450 / 100 == 14.5"
    steps:
      - show: |
          <div><svg width="1600" height="470" viewBox="0 0 1600 470">
          <text x="20" y="38" font-size="26" fill="#2a78d6" font-weight="bold">Mở rộng mạnh: cùng bài toán, thêm lõi</text>
          <g font-size="24" fill="#1f2937" text-anchor="end"><text x="200" y="98">1 lõi</text><text x="200" y="168">16 lõi</text></g>
          <rect x="220" y="64" width="40" height="50" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="260" y="64" width="360" height="50" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
          <rect x="220" y="134" width="40" height="50" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="260" y="134" width="22.5" height="50" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
          <g font-size="24" font-weight="bold" fill="#059669"><text x="636" y="98">100 s</text><text x="300" y="168">15,6 s → nhanh 6,4 lần</text></g>
          <text x="20" y="250" font-size="26" fill="#eb6834" font-weight="bold">Mở rộng yếu: bài toán lớn gấp 16 cùng số lõi</text>
          <g font-size="24" fill="#1f2937" text-anchor="end"><text x="200" y="310">16 lõi</text><text x="200" y="400">1 lõi (giả định)</text></g>
          <rect x="220" y="276" width="40" height="50" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="260" y="276" width="360" height="50" fill="#fed7aa" stroke="#1f2937" stroke-width="2"/>
          <text x="636" y="310" font-size="24" font-weight="bold" fill="#059669">100 s</text>
          <rect x="220" y="366" width="40" height="50" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="260" y="366" width="1300" height="50" fill="#fed7aa" stroke="#1f2937" stroke-width="2" stroke-dasharray="10 6"/>
          <text x="900" y="400" font-size="24" fill="#1f2937" text-anchor="middle">90 nhân 16 = 1440 s việc song song (vẽ thu nhỏ)</text>
          <text x="220" y="455" font-size="24" fill="#059669" font-weight="bold">1 lõi cần 10 + 1440 = 1450 s → tăng tốc theo cỡ 14,5 lần</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình trên là câu hỏi của bài 0, cùng một bài toán 100 giây, thêm lõi để xong sớm hơn, và 16 lõi chỉ nhanh 6 phẩy 4 lần. Hình dưới đặt câu hỏi ngược lại. Ta giữ 16 lõi chạy 100 giây, nhưng cho mỗi lõi một phần dữ liệu riêng, nên bài toán lớn gấp 16. Phần xám tuần tự vẫn 10 giây, còn phần cam song song là 90 giây trên mỗi lõi. Nếu chỉ có một lõi, nó phải làm 90 nhân 16 bằng 1440 giây việc song song, cộng 10 giây, tổng 1450 giây, tức 14 phẩy 5 lần lâu hơn."

  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra tăng tốc theo cỡ, rồi đổi sang cách đo của Amdahl"
    checks:
      - "0.1 + 0.9 * 16 == 14.5 and (0.1 + 0.9 * 16) / (0.1 + 0.9) == 14.5"
      - "round(0.1 / 14.5, 4) == 0.0069 and round(1 / (0.1 / 14.5 + (1 - 0.1 / 14.5) / 16), 10) == 14.5"
    steps:
      - show: |
          <p><b>Bước 1 — lần chạy trên máy $n$ lõi.</b> Lấy thời gian chạy bằng 1: phần tuần tự $q$, phần song song $1 - q$.</p>
          <p><b>Bước 2 — một lõi làm cùng bài toán.</b> Phần tuần tự vẫn $q$. Phần song song do $n$ lõi cùng làm, nên một lõi phải làm $n$ lần:</p>
          $$G(n) = \frac{q + (1 - q) \cdot n}{q + (1 - q)} = q + (1 - q) \cdot n$$
          <p class="note">Làm thử: $q = 0{,}1$, $n = 16$: $0{,}1 + 0{,}9 \cdot 16 = 14{,}5$ ✓, đúng bằng 1450 s chia 100 s ở hình.</p>
        focus: [1, 2, 2, 3, 4]
        say: "Bước một, xét lần chạy trên máy n lõi và lấy thời gian của nó bằng 1, gồm phần tuần tự q và phần song song 1 trừ q. Bước hai, cho một lõi làm cùng bài toán đó. Phần tuần tự vẫn là q, nhưng phần song song vốn do n lõi cùng làm, nên một lõi phải làm gấp n lần. Chia hai thời gian, mẫu số bằng 1, nên G của n bằng q cộng 1 trừ q nhân n. Làm thử với q bằng 0 phẩy 1 và 16 lõi, ta được 14 phẩy 5, đúng bằng 1450 chia 100 ở hình."
      - clear: true
        show: |
          <p><b>Bước 3 — đổi cách đo.</b> Với bài toán đã phóng to, phần tuần tự đo trên <b>một</b> lõi là thời gian tuần tự chia thời gian một lõi:</p>
          $$1 - p = \frac{q}{q + (1 - q) \cdot n} = \frac{0{,}1}{14{,}5} \approx \hlb{0{,}69\%}$$
          <p><b>Bước 4 — thay vào Amdahl:</b> $S(16) = \frac{1}{0{,}0069 + \frac{0{,}9931}{16}} = \hlg{14{,}5}$ — cùng một con số.</p>
          <p class="note">Hai định luật không mâu thuẫn: chúng đo phần tuần tự ở hai máy khác nhau, cho hai bài toán khác cỡ.</p>
        focus: [1, 2, 3, 4]
        say: "Bước ba là đổi cách đo. Với bài toán đã phóng to, phần tuần tự đo trên một lõi bằng thời gian tuần tự chia thời gian một lõi, tức 0 phẩy 1 chia 14 phẩy 5, chỉ khoảng 0 phẩy 69 phần trăm. Bước bốn, thay con số này vào công thức Amdahl với 16 lõi, ta được đúng 14 phẩy 5. Vì vậy hai định luật không mâu thuẫn, chúng chỉ đo phần tuần tự ở hai máy khác nhau, cho hai bài toán khác cỡ."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Phần tuần tự 10% đo trên máy 16 lõi, từng phép tính"
    checks:
      - "round(1 - 0.1, 10) == 0.9 and 0.9 * 16 == 14.4 and 0.1 + 14.4 == 14.5"
      - "round(14.5 / 16 * 100, 1) == 90.6 and round(alg.par_amdahl(0.9, 16) / 16 * 100) == 40"
      - "round(alg.par_gustafson(0.1, 1024), 1) == 921.7 and round(alg.par_gustafson(0.1, 1024) / 1024 * 100) == 90"
    steps:
      - show: |
          <p><b>Bước 1.</b> Phần song song trên máy 16 lõi: $1 - q = 1 - 0{,}1 = 0{,}9$.</p>
          <p><b>Bước 2.</b> Một lõi phải làm gấp 16: $0{,}9 \cdot 16 = 14{,}4$.</p>
          <p><b>Bước 3.</b> Cộng phần tuần tự: $G(16) = 0{,}1 + 14{,}4 = \hlg{14{,}5}$ lần.</p>
        focus: [0, 1, 2, 3]
        say: "Ta làm lại từng phép tính. Bước một, phần song song trên máy 16 lõi là 1 trừ 0 phẩy 1, bằng 0 phẩy 9. Bước hai, một lõi phải làm gấp 16, nên 0 phẩy 9 nhân 16 bằng 14 phẩy 4. Bước ba, cộng phần tuần tự được tăng tốc theo cỡ 14 phẩy 5 lần."
      - show: |
          <table class="t"><tr><th>bước</th><th>mở rộng yếu (theo cỡ)</th><th>mở rộng mạnh (cỡ cố định, 10% đo trên một lõi)</th></tr>
          <tr><td>Bước 4. tăng tốc 16 lõi</td><td>14,5</td><td>6,4</td></tr>
          <tr><td>Bước 5. hiệu suất</td><td>$\frac{14{,}5}{16} \approx \hlg{90{,}6\%}$</td><td>$\frac{6{,}4}{16} = \hl{40\%}$</td></tr>
          <tr><td>Bước 6. 1024 lõi</td><td>$0{,}1 + 0{,}9 \cdot 1024 = 921{,}7$, hiệu suất ≈ 90%</td><td>dưới 10, hiệu suất dưới 1%</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đặt hai câu hỏi cạnh nhau. Bước bốn, với 16 lõi, mở rộng yếu cho 14 phẩy 5 lần, còn mở rộng mạnh với 10 phần trăm đo trên một lõi chỉ cho 6 phẩy 4. Bước năm, hiệu suất của mở rộng yếu khoảng 90 phẩy 6 phần trăm, của mở rộng mạnh là 40 phần trăm. Bước sáu, ở 1024 lõi, mở rộng yếu cho 921 phẩy 7 lần, hiệu suất vẫn khoảng 90 phần trăm, còn mở rộng mạnh không vượt nổi 10."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: tính lại con số năm 1988 bằng hai đường"
    checks:
      - "[round(1024 - 1023 * s, 1) for s in (0.008, 0.004)] == [1015.8, 1019.9]"
      - "[round(alg.par_gustafson(s, 1024), 1) for s in (0.008, 0.004)] == [1015.8, 1019.9]"
      - "round(1 / (0.008 / 1015.816 + (1 - 0.008 / 1015.816) / 1024), 1) == 1015.8"
      - "round(0.008 / alg.par_gustafson(0.008, 1024) * 100, 4) == 0.0008"
    steps:
      - show: |
          <p>Nếu hiểu 0,4–0,8% là phần tuần tự <b>đo trên chính máy 1024 bộ xử lý</b> (đây là phép tính lại của bài, không phải câu trong báo cáo):</p>
          <table class="t"><tr><th>đường</th><th>$q = 0{,}8\%$</th><th>$q = 0{,}4\%$</th></tr>
          <tr><td>① $G = q + (1 - q) \cdot 1024$</td><td>1015,8</td><td>1019,9</td></tr>
          <tr><td>② gom lại: $1024 - 1023 \cdot q$</td><td>1015,8</td><td>1019,9</td></tr>
          <tr><td>đã đo, theo báo cáo năm 1988</td><td>1016</td><td>1020</td></tr></table>
        focus: [1, 1, "2.2", 2]
        say: "Bây giờ ta tính lại con số năm 1988, với giả thiết 0 phẩy 4 tới 0 phẩy 8 phần trăm là phần tuần tự đo trên chính máy 1024 bộ xử lý. Đây là phép tính lại của bài, không phải câu trong báo cáo. Đường thứ nhất dùng công thức tăng tốc theo cỡ, được 1015 phẩy 8 và 1019 phẩy 9. Đường thứ hai gom lại thành 1024 trừ 1023 nhân q, cũng ra đúng hai số đó, khớp với 1016 và 1020 đã đo."
      - show: |
          <p>Đường ③, đổi sang cách đo của Amdahl: phần tuần tự trên một lõi chỉ còn $\frac{0{,}008}{1015{,}8} \approx 0{,}0008\%$, và công thức của bài 0 cũng cho <b>1015,8</b> ✓.</p>
          <p class="note">Bài báo năm 1988 tự hỏi: “Sao lại thế được, khi lập luận của Amdahl dự đoán khác?” Câu trả lời là hai cách đo phần tuần tự.</p>
        focus: [1, 1, 2]
        say: "Đường thứ ba đổi sang cách đo của Amdahl. Vì phần tuần tự giờ chia cho cả thời gian một lõi, nó chỉ còn khoảng 0 phẩy 0008 phần trăm, và công thức của bài 0 cũng cho 1015 phẩy 8. Chính bài báo năm 1988 đã tự hỏi sao lại thế được, khi lập luận của Amdahl dự đoán khác, và câu trả lời nằm ở hai cách đo phần tuần tự."

  # ───────────────────────── 8. ĐO ─────────────────────────
  - id: measure
    kind: concept
    title: "Đo hai kiểu mở rộng trên máy thật"
    checks:
      - "[round(100 / t * 100, 1) for t in (100, 102, 105, 111)] == [100.0, 98.0, 95.2, 90.1]"
      - "[round(100 / (10 + 90 / n), 2) for n in (4, 16, 64)] == [3.08, 6.4, 8.77]"
    steps:
      - show: |
          <table class="t"><tr><th>số lõi</th><th>1</th><th>4</th><th>16</th><th>64</th></tr>
          <tr><td>mở rộng yếu: thời gian, dữ liệu gấp $n$</td><td>100 s</td><td>102 s</td><td>105 s</td><td>111 s</td></tr>
          <tr><td>hiệu suất yếu $= \frac{100}{\text{thời gian}}$</td><td>100%</td><td>98,0%</td><td>95,2%</td><td>$\hlg{90{,}1\%}$</td></tr>
          <tr><td>mở rộng mạnh: tăng tốc cùng dữ liệu</td><td>1</td><td>3,08</td><td>6,40</td><td>$\hl{8{,}77}$</td></tr></table>
          <p class="note">(số minh hoạ) Mở rộng yếu lý tưởng: thời gian không đổi. Mở rộng mạnh lý tưởng: tăng tốc bằng số lõi.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Trên máy thật, người ta đo hai bảng riêng. Hàng đầu là mở rộng yếu, dữ liệu gấp n theo số lõi, thời gian nhích từ 100 lên 111 giây ở 64 lõi. Hiệu suất yếu bằng 100 chia thời gian, còn khoảng 90 phẩy 1 phần trăm ở 64 lõi. Hàng cuối là mở rộng mạnh, cùng dữ liệu, 64 lõi chỉ nhanh 8 phẩy 77 lần. Lý tưởng của mở rộng yếu là thời gian không đổi, còn của mở rộng mạnh là tăng tốc bằng số lõi."

  # ───────────────────────── 9. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi của người đã đi làm"
    checks:
      - "round(alg.par_gustafson(0.1, 16), 1) == 14.5 and round(alg.par_amdahl(0.9, 16), 1) == 6.4"
      - "round(1 / (0.05 + 0.95 / 64), 2) == 15.42 and round(alg.par_gustafson(0.05, 64), 2) == 60.85"
      - "(85 + 90 * 16) / 175 == 1525 / 175 and round(1525 / 175, 2) == 8.71"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1 — người đã đi làm.</b> Đặt “14,5 lần” cạnh “6,4 lần” và nói định luật mới tốt hơn <b class="red">(so hai bài toán khác cỡ)</b>
          <br><span class="note">Hai số 10% đo trên hai máy khác nhau. Báo cáo phải ghi: cỡ dữ liệu, phần tuần tự đo ở đâu, so với cái gì.</span></div>
        say: "Lỗi thứ nhất hay gặp ở người đã đi làm, là đặt 14 phẩy 5 lần cạnh 6 phẩy 4 lần rồi nói định luật mới tốt hơn. Thật ra đó là hai bài toán khác cỡ, và hai số 10 phần trăm đo trên hai máy khác nhau. Báo cáo phải ghi rõ cỡ dữ liệu, phần tuần tự đo ở đâu, và so với cái gì."
      - show: |
          <div class="box warn"><b>Lỗi 2 — người đã đi làm.</b> Hứa mở rộng mạnh bằng số đo mở rộng yếu <b class="red">(60,85 lần hoá ra 15,42)</b>
          <br><span class="note">Máy 64 lõi, việc lớn: đo được $q = 5\%$ → $G(64) \approx 60{,}85$. Việc nhỏ hơn 64 lần, có hạn giờ: phần tuần tự trên một lõi là 5% → $S(64) \approx 15{,}42$ (số minh hoạ).</span></div>
        say: "Lỗi thứ hai cũng của người đã đi làm, là hứa mở rộng mạnh bằng số đo mở rộng yếu. Trên máy 64 lõi, việc lớn có q bằng 5 phần trăm, nên tăng tốc theo cỡ khoảng 60 phẩy 85. Nhưng một việc nhỏ hơn 64 lần, cần xong trước hạn giờ, có phần tuần tự 5 phần trăm đo trên một lõi, nên chỉ nhanh khoảng 15 phẩy 42 lần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tin rằng phần tuần tự không lớn theo cỡ <b class="red">(14,5 tụt còn 8,71)</b>
          <br><span class="note">Giả sử 5 s trong 10 s tuần tự là đọc tệp, lớn theo dữ liệu (số minh hoạ).</span></div>
          <table class="t"><tr><th>16 lõi, dữ liệu gấp 16</th><th>tuần tự</th><th>song song</th><th>tăng tốc theo cỡ</th></tr>
          <tr><td>đọc tệp không lớn theo</td><td>10 s</td><td>90 s</td><td>$\frac{10 + 1440}{100} = 14{,}5$</td></tr>
          <tr><td>đọc tệp lớn theo dữ liệu</td><td>$5 + 5 \cdot 16 = 85$ s</td><td>90 s</td><td>$\frac{85 + 1440}{175} \approx \hl{8{,}71}$</td></tr></table>
        focus: [1, 1, "2.3", "2.3"]
        say: "Lỗi thứ ba là tin rằng phần tuần tự không lớn theo cỡ dữ liệu. Giả sử 5 trong 10 giây tuần tự là đọc tệp, và việc đọc lớn theo dữ liệu. Khi đó trên 16 lõi phần tuần tự thành 5 cộng 5 nhân 16, bằng 85 giây. Một lõi cần 85 cộng 1440 bằng 1525 giây, chia cho 175 giây chỉ còn khoảng 8 phẩy 71 lần thay vì 14 phẩy 5."
      - show: |
          <div class="box warn"><b>Lỗi 4.</b> Phóng to bài toán mà quên bộ nhớ <b class="red">(dữ liệu gấp 16 phải vừa mỗi máy)</b>
          <br><span class="note">Mở rộng yếu giả định mỗi lõi giữ phần dữ liệu cũ. Nếu dữ liệu phóng to không chia được mà phải chép đủ cho mọi lõi, bộ nhớ cần gấp 16 trên MỖI máy.</span></div>
        say: "Lỗi thứ tư là phóng to bài toán mà quên bộ nhớ. Mở rộng yếu giả định mỗi lõi chỉ giữ phần dữ liệu cũ của nó. Nếu dữ liệu phóng to không chia được mà phải chép đủ cho mọi lõi, bộ nhớ cần gấp 16 trên mỗi máy, và kế hoạch đổ vỡ trước khi chạy."

  # ───────────────────────── 10. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: hứa con số nào với hai nhóm người dùng?"
    checks:
      - "round(alg.par_gustafson(0.05, 64), 2) == 60.85 and round(60.85 / 64 * 100, 1) == 95.1"
      - "round(0.05 / alg.par_gustafson(0.05, 64) * 100, 3) == 0.082"
      - "round(alg.par_amdahl(0.95, 64), 2) == 15.42 and round(15.42 / 64 * 100, 1) == 24.1"
      - "round(alg.par_gustafson(0.05, 64) / alg.par_amdahl(0.95, 64), 2) == 3.95"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>máy 64 lõi; lần chạy việc lớn đo được phần tuần tự $q = 5\%$ (số minh hoạ)</th></tr>
          <tr><td>1</td><td>Nhóm phân tích dữ liệu, dữ liệu lớn theo máy: tăng tốc theo cỡ và hiệu suất?</td></tr>
          <tr><td>2</td><td>Đổi sang cách đo của Amdahl: việc lớn ấy có bao nhiêu phần trăm tuần tự trên một lõi?</td></tr>
          <tr><td>3</td><td>Nhóm dự báo, việc nhỏ hơn 64 lần, phần tuần tự 5% trên một lõi, phải xong trước hạn: hứa nhanh bao nhiêu lần?</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn, với máy 64 lõi, và lần chạy việc lớn đo được phần tuần tự q bằng 5 phần trăm. Câu một, với nhóm phân tích dữ liệu có dữ liệu lớn theo máy, tăng tốc theo cỡ và hiệu suất là bao nhiêu? Câu hai, đổi sang cách đo của Amdahl, việc lớn ấy có bao nhiêu phần trăm tuần tự trên một lõi? Câu ba, nhóm dự báo có việc nhỏ hơn 64 lần, phần tuần tự 5 phần trăm trên một lõi, phải xong trước hạn, bạn hứa nhanh bao nhiêu lần? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1</td><td>$0{,}05 + 0{,}95 \cdot 64$</td><td>$G(64) \approx \hlg{60{,}85}$, hiệu suất ≈ 95,1%</td></tr>
          <tr><td>2</td><td>$\frac{0{,}05}{60{,}85}$</td><td>chỉ ≈ $\hlb{0{,}082\%}$</td></tr></table>
        focus: ["1.2", "1.2", "1.3"]
        say: "Đáp án câu một, 0 phẩy 05 cộng 0 phẩy 95 nhân 64 được khoảng 60 phẩy 85 lần. Hiệu suất khoảng 95 phẩy 1 phần trăm. Câu hai, chia 0 phẩy 05 cho 60 phẩy 85, việc lớn ấy chỉ có khoảng 0 phẩy 082 phần trăm tuần tự khi đo trên một lõi."
      - clear: true
        show: |
          <table class="t"><tr><th>nhóm</th><th>hứa</th><th>vì sao / khi nào đổi</th></tr>
          <tr><td>phân tích dữ liệu (mở rộng yếu)</td><td>≈ 60 lần, hiệu suất 95%</td><td>đúng khi phần tuần tự không lớn theo dữ liệu (lỗi 3)</td></tr>
          <tr><td>dự báo có hạn giờ (mở rộng mạnh)</td><td>$\approx \hl{15{,}42}$ lần, hiệu suất ≈ 24%</td><td>muốn hơn: giảm 5% tuần tự, không phải thêm lõi</td></tr></table>
          <p class="note">Cùng một máy, cùng 5%, hai lời hứa khác nhau gần 4 lần. Ghi rõ loại mở rộng trong mọi báo cáo.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu ba là một quyết định, hai nhóm nhận hai lời hứa khác nhau. Nhóm phân tích dữ liệu được hứa khoảng 60 lần, với điều kiện phần tuần tự không lớn theo dữ liệu. Nhóm dự báo có hạn giờ chỉ được khoảng 15 phẩy 42 lần, hiệu suất khoảng 24 phần trăm, và muốn hơn thì phải giảm 5 phần trăm tuần tự chứ không phải thêm lõi. Cùng một máy, cùng 5 phần trăm, hai lời hứa khác nhau gần 4 lần, nên mọi báo cáo phải ghi rõ loại mở rộng."

  # ───────────────────────── 11. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cỡ cố định: Amdahl, p đo trên 1 lõi</span><span class="a">→</span>
          <span class="n">cỡ lớn theo lõi: G = q + (1 − q) n, q đo trên n lõi</span><span class="a">→</span>
          <span class="n">đổi cách đo → hai định luật cho cùng số</span><span class="a">→</span>
          <span class="n">báo cáo: mạnh hay yếu, cỡ nào, so với gì</span></div>
        say: "Tổng kết lại, khi cỡ bài toán cố định, ta dùng Amdahl với p đo trên một lõi. Khi bài toán lớn theo số lõi, tăng tốc theo cỡ bằng q cộng 1 trừ q nhân n, với q đo trên máy n lõi. Đổi cách đo phần tuần tự thì hai định luật cho cùng một con số. Vì vậy mọi báo cáo phải nói mở rộng mạnh hay yếu, ở cỡ nào, và so với cái gì."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi tin một con số “nhanh gấp”, hỏi <b>phần tuần tự được đo trên máy nào</b> và <b>người dùng cần xong sớm hơn hay làm được nhiều hơn</b>.</div>
        say: "Điều cần mang theo, trước khi tin một con số nhanh gấp mấy lần, hãy hỏi phần tuần tự được đo trên máy nào, và người dùng cần xong sớm hơn hay cần làm được nhiều hơn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>công việc và độ dài đường găng</b> — đếm tổng số phép tính và chuỗi phép tính phải chờ nhau, để biết một thuật toán song song được tới đâu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học công việc và độ dài đường găng, tức đếm tổng số phép tính và chuỗi phép tính phải chờ nhau, để biết một thuật toán song song được tới đâu. Hẹn gặp bạn ở bài tiếp theo."
