  - {sentence: "Nhưng theo định luật Amdahl ở bài 0, phần tuần tự như vậy chỉ cho khoảng 111 tới 201 lần.", reason: "ASR chép “nhưng theo định luật am đang ở bài không, phần tuần tử như vậy chỉ cho khoảng 111 tới 200 linh một lần.” (0.926): lệch âm/thanh thuần Việt: tự/tử; “Amdahl” đọc “Am-đan” theo lexicon_vi.CSA.yaml (probe p1 8/8), ASR chép “am đang/amdang/âm đăng” — cùng âm — NOT_VERIFIED bằng tai người"}
