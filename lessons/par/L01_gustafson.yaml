  - {sentence: "Đường thứ ba đổi sang cách đo của Amdahl.", reason: "ASR chép “Đường thứ 3 đổi sang cách đo của Amdang” (0.889): “Amdahl” đọc “Am-đan” theo lexicon_vi.CSA.yaml (probe p1 8/8), ASR chép “am đang/amdang/âm đăng” — cùng âm — NOT_VERIFIED bằng tai người"}
