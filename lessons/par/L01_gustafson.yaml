source: "curriculum/par.yaml L01; audit/par/verify_par.py (verify_parts/L01.py); audit/par/sources_L01.md (câu trích nguyên văn, đọc 2026-11-02); J. L. Gustafson, Reevaluating Amdahl's Law, Communications of the ACM 31(5), 5/1988, tr. 532–533 [GU88]; PAR bài 0 (Amdahl, hiệu suất, đo ngược p)"
assumes: [arith, frac, approx, cdot]
# Quy ước ký hiệu (cùng bài 0): p = tỉ lệ song song được ĐO TRÊN MỘT LÕI (Amdahl); n = số lõi; S(n) = tăng tốc; E(n) = S(n)/n.
#   Ký hiệu mới: q = tỉ lệ tuần tự ĐO TRÊN MÁY n LÕI (thời gian chạy song song lấy bằng 1) — bài báo năm 1988 viết s′; bài dùng q để
#   khỏi lẫn với dấu phẩy trên (đạo hàm) và với p. G(n) = tăng tốc theo cỡ = q + (1 − q)·n.
#   “Mở rộng mạnh” = strong scaling (cỡ bài toán cố định); “mở rộng yếu” = weak scaling (mỗi lõi giữ phần việc cố định).
#   Tên Gustafson, Sandia chỉ trên màn hình cho tới khi probe p1 đạt ≥ 7/8 (lexicon_vi.PAR.yaml); lời đọc nói “định luật mở rộng theo cỡ”.
#   Sự kiện có thật: [GU88] — máy 1024 bộ xử lý, ba ứng dụng tăng tốc 1021, 1020, 1016, phần tuần tự 0,4–0,8%. Việc hiểu 0,4–0,8% là
#   đo trên máy song song là SUY RA (khớp công thức mới: 1015,8 và 1019,9), ghi rõ trên màn hình. Số khác là SỐ MINH HOẠ.
objectives:
  - "Phân biệt mở rộng mạnh (bài toán cố định) và mở rộng yếu (bài toán lớn theo số lõi)"
  - "Tính tăng tốc theo cỡ G(n) = q + (1 − q)·n và hiệu suất mở rộng"
  - "Đổi phần tuần tự giữa hai cách đo để thấy hai định luật cho cùng một con số"
