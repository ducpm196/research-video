# Quy ước: F = đỉnh tính toán (phép tính mỗi giây), B = băng thông bộ nhớ chính (byte mỗi giây), I = cường độ số học = số phép tính chia
#   số byte đi giữa bộ nhớ chính và chip (đếm SAU bộ nhớ đệm, như [WWP08] gọi “operational intensity”). Hiệu năng tối đa = min(F, B · I).
#   Máy ví dụ F = 10 nghìn tỉ phép/s, B = 1 nghìn tỉ byte/s là SỐ MINH HOẠ (bậc độ lớn một thẻ tính toán), ghi rõ trên màn hình.
#   Số thực 32 bit = 4 byte. Một phép nhân–cộng tính là 2 phép. “Roofline” đọc là “mô hình mái nhà” (tên gốc chỉ trên màn hình).
#   Số thật duy nhất của nguồn: máy Opteron X2 17,6 tỉ phép/s, 15 tỉ byte/s; nhân mẫu lưới 8 phép cho 24 byte [WWP08].
objectives:
  - "Tính cường độ số học = số phép tính chia số byte đọc ghi bộ nhớ chính"
  - "Suy ra và dùng hiệu năng tối đa = min(đỉnh tính toán, băng thông nhân cường độ)"
  - "Đọc điểm gãy F chia B để biết một nhân bị chặn bởi tính toán hay bởi băng thông"
  - "Chọn phần cứng hoặc hướng tối ưu theo vị trí của nhân trên hình mái nhà"
