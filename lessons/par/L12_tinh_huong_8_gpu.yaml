source: "curriculum/par.yaml L12; audit/par/verify_par.py L12; audit/par/sources_L12.md; tình huống QUYẾT ĐỊNH NGHỀ NGHIỆP dựng từ cơ chế đã học (case-lessons.md mục 1) — mọi số đo là SỐ MINH HOẠ; G. Amdahl (AFIPS 1967) — phần “quản lý dữ liệu” tuần tự chiếm 40% lệnh, bản in lại IEEE SSCS News 2007 [AM67]; PAR bài 0 (Amdahl), bài 7 (mái nhà), bài 11 (hiệu suất mở rộng)"
assumes: [arith, frac, approx, power]
# Quy ước (giữ như bài 0 và khoá Hệ thống máy tính, bài 13): p = tỉ lệ thời gian trên MỘT thẻ chạy song song được, n = số thẻ,
#   S(n) = 1 / ((1 − p) + p/n). Amdahl đọc “Am-đan” (lexicon). “GPU” chỉ trên màn hình; lời đọc nói “thẻ đồ hoạ”, “thẻ”.
#   Tình huống: đội huấn luyện một mô hình nhận dạng ảnh; một lượt dữ liệu trên 1 thẻ mất 100 phút: nạp và giải mã ảnh bằng MỘT tiến trình
#   trên bộ xử lý trung tâm 25 phút, tính trên thẻ 75 phút; gộp gradient đã chồng hết với tính toán (bài 11) — mọi số là SỐ MINH HOẠ.
#   “Ngân sách thời gian” = bảng chia thời gian một lượt theo từng phần, đo bằng công cụ đo thời gian (profiler), không đoán.
objectives:
  - "Lập ngân sách thời gian một lượt huấn luyện từ số đo của một thẻ"
  - "Tính lại con số “chỉ nhanh gấp 3” bằng định luật Amdahl và tìm phần tuần tự"
  - "So sánh mua thêm thẻ với sửa phần tuần tự bằng số"
  - "Ra quyết định theo hạn thời gian, kèm điều kiện đổi lựa chọn"
