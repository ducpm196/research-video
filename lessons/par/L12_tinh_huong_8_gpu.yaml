  - {sentence: "Ở bài 0, định luật Amdahl nói tăng tốc bằng 1 chia cho phần tuần tự cộng phần song song chia số lõi.", reason: "ASR chép “Ở bài không, định luật âm đang nói tăng tốc bằng một chia cho phần tuần từ cộng phần xong xong chia số lõi.” (0.894): lệch âm/thanh thuần Việt: tự/từ; “Amdahl” đọc “Am-đan” theo lexicon_vi.CSA.yaml (probe p1 8/8), ASR chép “am đang/amdang/âm đăng” — cùng âm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bài báo năm 1967 của Amdahl đã ghi rằng phần quản lý dữ liệu chiếm khoảng 40 phần trăm số lệnh của các chương trình sản xuất thời đó.", reason: "ASR chép “Bài báo năm 1967 của Amdang đã ghi rằng phần quản lý dữ liệu chiếm khoảng 40% số lệnh của các chương trình sản xuất thời đó.” (0.972): “Amdahl” đọc “Am-đan” theo lexicon_vi.CSA.yaml (probe p1 8/8), ASR chép “am đang/amdang/âm đăng” — cùng âm — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tổng kết lại, ta đo ngân sách trên một thẻ, tìm ra phần tuần tự 25 phần trăm, và định luật Amdahl tái hiện đúng con số 2 phẩy 91 cùng trần 4.", reason: "ASR chép “Tổng kết lại, ta đo ngân sách trên một thẻ, tìm ra phần tuần tự 25% và định luật am đang tái hiện đúng con số 2,91 cùng trần 4.” (0.974): “Amdahl” đọc “Am-đan” theo lexicon_vi.CSA.yaml (probe p1 8/8), ASR chép “am đang/amdang/âm đăng” — cùng âm — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Máy 8 thẻ mới về, mà chỉ nhanh gấp 3"
    checks:
      - "round(alg.par_amdahl(0.75, 8), 2) == 2.91 and round(100 / alg.par_amdahl(0.75, 8), 1) == 34.4"
    steps:
      - show: |
          <p>Một đội huấn luyện mô hình nhận dạng ảnh. Một lượt dữ liệu trên <b>1 thẻ</b> mất <b>100 phút</b>. Họ mua máy <b>8 thẻ</b> đồ hoạ (GPU), chờ đợi khoảng 12,5 phút.</p>
          <p>Đo thật: <b>34,4 phút</b> — nhanh gấp khoảng <b>2,91</b>, chưa tới 3. Có người đề xuất mua tiếp máy 16 thẻ. (Mọi số đo là số minh hoạ.)</p>
          <div class="box key">Hôm nay ta trả lời: thời gian đi đâu? Mua 16 thẻ được bao nhiêu? Và nên sửa chỗ nào trước?</div>
        focus: [1, 1, 1, 2, 2, 3]
        say: "Chào bạn, một đội huấn luyện mô hình nhận dạng ảnh. Một lượt dữ liệu trên 1 thẻ mất 100 phút. Họ mua máy 8 thẻ đồ hoạ và chờ đợi khoảng 12 phẩy 5 phút. Đo thật thì mất 34 phẩy 4 phút, chỉ nhanh gấp khoảng 2 phẩy 91, chưa tới 3. Có người đề xuất mua tiếp máy 16 thẻ, mọi số đo ở đây là số minh hoạ. Hôm nay ta trả lời thời gian đi đâu, mua 16 thẻ được bao nhiêu, và nên sửa chỗ nào trước."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba công cụ từ các bài trước"
    checks:
      - "round(alg.par_amdahl(0.9, 16), 2) == 6.4"
      - "round(alg.par_roofline(10e12, 1e12, 1 / 12) / 1e9, 1) == 83.3"
      - "round(alg.par_step_efficiency(100, 30, 20) * 100, 1) == 90.9"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>công cụ</th><th>ví dụ đã làm</th></tr>
          <tr><td>bài 0</td><td><b>Amdahl</b>: $S(n) = \frac{1}{(1 - p) + \frac{p}{n}}$; phần tuần tự $1 - p$ không co lại khi thêm lõi</td><td>90% song song, 16 lõi: 6,4 lần</td></tr>
          <tr><td>bài 7</td><td><b>mái nhà</b>: so con số đo được với trần của chính nó</td><td>cộng vector: trần 83,3 tỉ phép mỗi giây</td></tr>
          <tr><td>bài 11</td><td><b>hiệu suất</b> $E = \frac{C}{C + G - O}$, tốc độ tăng $n \cdot E$</td><td>chồng 20 ms: 90,9%</td></tr></table>
        introduces: [cdot]
        focus: [0, "1.2", "1.2", "1.3", "1.4"]
        say: "Bài này dùng ba công cụ đã học ở các bài trước. Ở bài 0, định luật Amdahl nói tăng tốc bằng 1 chia cho phần tuần tự cộng phần song song chia số lõi. Phần tuần tự không co lại khi thêm lõi, nên 90 phần trăm song song trên 16 lõi chỉ được 6 phẩy 4 lần. Ở bài 7, mô hình mái nhà dạy ta so con số đo được với trần của chính nó, như phép cộng vector có trần 83 phẩy 3 tỉ phép mỗi giây. Ở bài 11, hiệu suất bằng thời gian tính chia tổng thời gian một bước, và chồng được 20 mi li giây thì đạt 90 phẩy 9 phần trăm."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của người đo hiệu năng"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>ngân sách thời gian</b></td><td>bảng chia thời gian của một lượt (hay một bước) thành từng phần, mỗi phần một số đo</td></tr>
          <tr><td><b>công cụ đo thời gian</b> (profiler)</td><td>ghi lúc bắt đầu, lúc kết thúc của từng việc trên bộ xử lý trung tâm và trên thẻ</td></tr>
          <tr><td><b>thẻ đói dữ liệu</b></td><td>thẻ ngồi chờ vì dữ liệu chưa tới, dù chỉ số bận của nó thấp</td></tr>
          <tr><td><b>phần tuần tự</b></td><td>việc chỉ một nơi làm được, ví dụ một <b>tiến trình</b> (một chương trình đang chạy, làm từng việc một) nạp ảnh cho mọi thẻ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Người đo hiệu năng dùng bốn thuật ngữ. Ngân sách thời gian là bảng chia thời gian của một lượt thành từng phần, mỗi phần một số đo. Công cụ đo thời gian ghi lúc bắt đầu và lúc kết thúc của từng việc, trên bộ xử lý trung tâm và trên thẻ. Thẻ đói dữ liệu là thẻ ngồi chờ vì dữ liệu chưa tới. Phần tuần tự là việc chỉ một nơi làm được, ví dụ một tiến trình, tức một chương trình đang chạy làm từng việc một, nạp ảnh cho mọi thẻ."
      - show: |
          <p>Chuyện này không mới. Bài báo năm 1967 của Gene Amdahl ghi rằng phần “quản lý dữ liệu” chiếm khoảng <b>40%</b> số lệnh của các chương trình sản xuất thời đó, và phần này có vẻ <b>tuần tự</b>, khó song song hoá.</p>
        say: "Chuyện này không mới. Bài báo năm 1967 của Amdahl đã ghi rằng phần quản lý dữ liệu chiếm khoảng 40 phần trăm số lệnh của các chương trình sản xuất thời đó. Phần này có vẻ tuần tự, khó song song hoá."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ngân sách một lượt: phần xám không co lại"
    steps:
      - show: |
          <div><svg width="1600" height="330" viewBox="0 0 1600 330">
          <g font-size="23" fill="#1f2937" text-anchor="end"><text x="230" y="78">1 thẻ</text><text x="230" y="168">8 thẻ</text><text x="230" y="258">vô số thẻ</text></g>
          <rect x="250" y="45" width="300" height="50" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="550" y="45" width="900" height="50" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
          <rect x="250" y="135" width="300" height="50" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="550" y="135" width="112.5" height="50" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
          <rect x="250" y="225" width="300" height="50" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/><rect x="550" y="225" width="3" height="50" fill="#93c5fd" stroke="#1f2937" stroke-width="1"/>
          <g font-size="22" fill="#1f2937" text-anchor="middle"><text x="400" y="78">nạp ảnh 25</text><text x="1000" y="78">tính trên thẻ 75</text><text x="400" y="168">nạp ảnh 25</text><text x="400" y="258">nạp ảnh 25</text></g>
          <g font-size="22" fill="#059669"><text x="1470" y="78">100 phút</text><text x="680" y="168">9,4 → tổng 34,4 phút</text><text x="575" y="258">→ ít nhất 25 phút</text></g>
          <line x1="550" y1="30" x2="550" y2="290" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/>
          <text x="800" y="318" font-size="22" fill="#b91c1c" text-anchor="middle">một tiến trình nạp ảnh cho mọi thẻ: phần xám không co lại, tối đa nhanh gấp 4</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ ngân sách một lượt theo đúng tỉ lệ. Trên 1 thẻ, phần xám nạp và giải mã ảnh bằng một tiến trình mất 25 phút, phần xanh tính trên thẻ mất 75 phút. Trên 8 thẻ, phần xanh chia 8 chỉ còn khoảng 9 phẩy 4 phút, nhưng phần xám vẫn nguyên 25, vì vẫn một tiến trình nạp ảnh cho cả 8 thẻ. Dù có vô số thẻ, thanh không bao giờ ngắn hơn vạch đỏ, nên tối đa chỉ nhanh gấp 4."

  # ───────────────────────── 5. TÁI HIỆN BẰNG SỐ ─────────────────────────
  - id: example
    kind: example
    title: "Tái hiện “gấp 3” bằng Amdahl, từng phép tính"
    checks:
      - "25 / 100 == 0.25 and 75 / 100 == 0.75"
      - "round(alg.par_amdahl(0.75, 8), 2) == 2.91 and round(0.25 + 0.75 / 8, 5) == 0.34375"
      - "round(alg.par_amdahl(0.75, 16), 2) == 3.37 and round(alg.par_amdahl(0.75, 16) / alg.par_amdahl(0.75, 8) - 1, 2) == 0.16 and round(1 / 0.25) == 4"
      - "round(alg.par_amdahl(0.98, 8), 2) == 7.02 and round(alg.par_amdahl(0.98, 16), 2) == 12.31"
    steps:
      - show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. ngân sách 1 thẻ</td><td>nạp 25 phút, tính 75 phút trên 100</td><td>$1 - p = 0{,}25$; $p = 0{,}75$</td></tr>
          <tr><td>Bước 2. Amdahl, 8 thẻ</td><td>$\frac{1}{0{,}25 + \frac{0{,}75}{8}} = \frac{1}{0{,}34375}$</td><td>$\hl{2{,}91}$ — đúng con số đo được</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Ta tái hiện con số bằng định luật Amdahl. Bước một, công cụ đo thời gian cho ngân sách trên một thẻ, nạp 25 phút và tính 75 phút trên tổng 100, nên phần tuần tự là 0 phẩy 25 và p bằng 0 phẩy 75. Bước hai, với 8 thẻ, tăng tốc bằng 1 chia cho 0 phẩy 25 cộng 0 phẩy 75 chia 8, tức 1 chia 0 phẩy 34375, khoảng 2 phẩy 91, đúng con số đội đo được."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>lựa chọn</th><th>phép tính</th><th>tăng tốc</th></tr>
          <tr><td>Bước 3</td><td>mua 16 thẻ, không sửa gì</td><td>$\frac{1}{0{,}25 + \frac{0{,}75}{16}}$</td><td>3,37 — chỉ hơn 8 thẻ 16%; trần là $\frac{1}{0{,}25} = 4$</td></tr>
          <tr><td>Bước 4</td><td>giữ 8 thẻ, nạp ảnh song song (mỗi thẻ một bộ nạp, đọc trước) → phần tuần tự còn 2%</td><td>$\frac{1}{0{,}02 + \frac{0{,}98}{8}}$</td><td>$\hlg{7{,}02}$</td></tr>
          <tr><td>Bước 5</td><td>đã sửa, rồi mới lên 16 thẻ</td><td>$\frac{1}{0{,}02 + \frac{0{,}98}{16}}$</td><td>12,31</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Giờ so ba lựa chọn. Bước ba, mua 16 thẻ mà không sửa gì chỉ được 3 phẩy 37 lần, hơn 8 thẻ có 16 phần trăm, vì trần là 1 chia 0 phẩy 25, bằng 4. Bước bốn, giữ 8 thẻ nhưng nạp ảnh song song, mỗi thẻ một bộ nạp và đọc trước, giả sử phần tuần tự còn 2 phần trăm, thì được khoảng 7 phẩy 02 lần. Bước năm, đã sửa rồi mới lên 16 thẻ thì được khoảng 12 phẩy 31 lần."

  # ───────────────────────── 6. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: cộng phút thật, và đổi sang hiệu suất"
    checks:
      - "25 + 75 / 8 == 34.375 and round(100 / 34.375, 2) == 2.91"
      - "2 + 98 / 8 == 14.25 and round(100 / 14.25, 2) == 7.02"
      - "round(alg.par_amdahl(0.75, 8) / 8 * 100, 1) == 36.4 and round(alg.par_amdahl(0.98, 8) / 8 * 100, 1) == 87.7"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác: cộng phút</th><th>nạp</th><th>tính</th><th>tổng</th><th>100 chia tổng</th></tr>
          <tr><td>8 thẻ, chưa sửa</td><td>25</td><td>75 : 8 = 9,375</td><td>34,375</td><td>≈ 2,91 ✓</td></tr>
          <tr><td>8 thẻ, nạp song song</td><td>2</td><td>98 : 8 = 12,25</td><td>14,25</td><td>≈ 7,02 ✓</td></tr></table>
          <p class="note">Bước 4 giả định việc tính không đổi: 98 phút là 75 phút tính cộng 23 phút nạp đã chuyển sang chạy song song trên nhiều tiến trình.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Kiểm tra thứ nhất đi đường khác, cộng phút thật thay vì dùng công thức. Tám thẻ chưa sửa, nạp 25 phút, tính 75 chia 8 bằng 9 phẩy 375, tổng 34 phẩy 375, và 100 chia số đó khoảng 2 phẩy 91, khớp. Tám thẻ nạp song song, phần tuần tự còn 2 phút, 98 phút còn lại chia 8 được 12 phẩy 25, tổng 14 phẩy 25, và 100 chia 14 phẩy 25 khoảng 7 phẩy 02, khớp. Ở đây 98 phút gồm 75 phút tính và 23 phút nạp đã chuyển sang chạy song song."
      - show: |
          <p><b>Đường thứ hai, hiệu suất của bài 11</b>: tăng tốc chia số thẻ.</p>
          $$E = \frac{2{,}91}{8} \approx \hl{36{,}4\%} \qquad\text{sau khi sửa: } \frac{7{,}02}{8} \approx \hlg{87{,}7\%}$$
          <p class="note">Chỉ số bận của thẻ quanh 36% là dấu hiệu <b>thẻ đói dữ liệu</b>, không phải thẻ yếu.</p>
        focus: [1, 2, 3]
        say: "Kiểm tra thứ hai đổi sang hiệu suất của bài 11, bằng tăng tốc chia số thẻ. Chưa sửa, E bằng 2 phẩy 91 chia 8, khoảng 36 phẩy 4 phần trăm, sau khi sửa khoảng 87 phẩy 7 phần trăm. Vì vậy chỉ số bận của thẻ quanh 36 phần trăm là dấu hiệu thẻ đói dữ liệu, không phải thẻ yếu."

  # ───────────────────────── 7. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi gặp “8 thẻ chỉ nhanh gấp 3”"
    checks:
      - "round(alg.par_amdahl(0.75, 16), 2) == 3.37 and round(alg.par_amdahl(0.75, 10 ** 9), 3) == 4.0"
      - "25 + 50 / 8 == 31.25 and round(100 / 31.25, 1) == 3.2"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Mua thêm thẻ”</td><td>16 thẻ: 3,37; vô số thẻ: tối đa 4</td><td>đo ngân sách trước khi mua</td></tr>
          <tr><td><b class="red">2.</b> “Thẻ chậm, tối ưu nhân tính”</td><td>tính nhanh gấp 1,5 (75 còn 50 phút): 8 thẻ $25 + \frac{50}{8} = 31{,}25$ phút, chỉ gấp 3,2</td><td>sửa phần lớn nhất <b>sau khi chia</b> — ở đây là nạp ảnh</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là mua thêm thẻ, trong khi 16 thẻ chỉ cho 3 phẩy 37, và vô số thẻ cũng không vượt 4. Hãy đo ngân sách trước khi mua. Bài học sai thứ hai là cho rằng thẻ chậm nên tối ưu nhân tính. Giả sử tính nhanh gấp 1 phẩy 5, 75 phút còn 50. Khi đó 8 thẻ mất 25 cộng 50 chia 8, bằng 31 phẩy 25 phút, chỉ gấp 3 phẩy 2, vì phần lớn nhất sau khi chia là nạp ảnh."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Chỉ số bận 36%, thẻ có vấn đề” (lỗi của người đã đi làm)</td><td>thẻ ngồi chờ dữ liệu; số đó đúng bằng $\frac{2{,}91}{8}$</td><td>xem dòng thời gian từng bước: thẻ chờ gì, chờ bao lâu</td></tr>
          <tr><td><b class="red">4.</b> “Lần sau cẩn thận hơn”, hay tìm người có lỗi</td><td>không ai làm sai; thiếu một phép đo trong quy trình</td><td>mỗi lần đổi phần cứng: chạy lại ngân sách, đặt ngưỡng hiệu suất trong kiểm thử hiệu năng</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba hay gặp ở người đã đi làm, là thấy chỉ số bận của thẻ 36 phần trăm rồi kết luận thẻ có vấn đề. Thật ra thẻ ngồi chờ dữ liệu, và con số đó đúng bằng 2 phẩy 91 chia 8. Bài học sai thứ tư là nói lần sau cẩn thận hơn, hay đi tìm người có lỗi. Không ai làm sai cả, chỉ là quy trình thiếu một phép đo. Mỗi lần đổi phần cứng, hãy chạy lại ngân sách và đặt ngưỡng hiệu suất trong kiểm thử hiệu năng."

  # ───────────────────────── 8. BẠN SẼ LÀM GÌ ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì: hạn 20 phút mỗi lượt"
    checks:
      - "100 / 20 == 5 and alg.par_amdahl(0.75, 16) < 5 < alg.par_amdahl(0.98, 8) and round(100 / alg.par_amdahl(0.98, 8), 2) == 14.25"
      - "round(alg.par_amdahl(0.9, 8), 2) == 4.71 and round(100 / alg.par_amdahl(0.9, 8), 2) == 21.25 and round(100 / alg.par_amdahl(0.9, 16), 3) == 15.625"
    steps:
      - show: |
          <p>Sếp cần mỗi lượt dữ liệu xong trong <b>20 phút</b> (1 thẻ: 100 phút, phần tuần tự 25%). Hai lựa chọn (số minh hoạ):</p>
          <table class="t"><tr><th>lựa chọn</th><th>chi phí</th></tr>
          <tr><td>A. mua máy 16 thẻ, không sửa mã</td><td>tiền phần cứng, giao sau 1 tháng</td></tr>
          <tr><td>B. giữ 8 thẻ, viết lại phần nạp ảnh (như bước 4: phần tuần tự còn 2%)</td><td>2 tuần công của một kỹ sư</td></tr></table>
          <p>Câu 1: lựa chọn nào đạt hạn? Câu 2: nếu viết lại chỉ đưa phần tuần tự về <b>10%</b> thì sao?</p>
        focus: [0, 1, "2.2", "2.3", 3, 0]
        say: "Bây giờ bạn sẽ làm gì. Sếp cần mỗi lượt dữ liệu xong trong 20 phút, trong khi 1 thẻ mất 100 phút và phần tuần tự là 25 phần trăm. Lựa chọn A là mua máy 16 thẻ, không sửa mã, tốn tiền phần cứng và giao sau một tháng. Lựa chọn B là giữ 8 thẻ, viết lại phần nạp ảnh để phần tuần tự còn 2 phần trăm như bước bốn, tốn 2 tuần công của một kỹ sư. Câu một, lựa chọn nào đạt hạn, câu hai, nếu viết lại chỉ đưa phần tuần tự về 10 phần trăm thì sao? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: cần nhanh gấp $\frac{100}{20} = 5$</th><th>tăng tốc</th><th>một lượt</th><th>đạt hạn?</th></tr>
          <tr><td>A. 16 thẻ, phần tuần tự 25%</td><td>3,37</td><td>≈ 29,7 phút</td><td class="red">không — trần là 4</td></tr>
          <tr><td>B. 8 thẻ, phần tuần tự 2%</td><td>7,02</td><td>14,25 phút</td><td>$\hlg{\text{đạt}}$</td></tr></table>
          <p class="note">Chọn B: rẻ hơn, nhanh hơn. Mua thêm thẻ không bao giờ vượt được trần 4 của phần tuần tự 25%.</p>
        focus: [0, "1.2", "1.3", 2]
        say: "Đáp án câu một, cần nhanh gấp 100 chia 20, bằng 5. Lựa chọn A chỉ được 3 phẩy 37, khoảng 29 phẩy 7 phút mỗi lượt, không đạt hạn vì trần là 4. Lựa chọn B được 7 phẩy 02, 14 phẩy 25 phút, đạt hạn. Ta chọn B, rẻ hơn và nhanh hơn, vì mua thêm thẻ không bao giờ vượt được trần 4 của phần tuần tự 25 phần trăm."
      - show: |
          <table class="t"><tr><th>câu 2: phần tuần tự còn 10%</th><th>tăng tốc</th><th>một lượt</th><th>đạt hạn?</th></tr>
          <tr><td>8 thẻ</td><td>$\frac{1}{0{,}1 + \frac{0{,}9}{8}} \approx 4{,}71$</td><td>21,25 phút</td><td class="red">chưa</td></tr>
          <tr><td>16 thẻ</td><td>6,4</td><td>≈ 15,6 phút</td><td>$\hlg{\text{đạt}}$</td></tr></table>
          <p class="note">Điều kiện đổi lựa chọn: khi phần tuần tự đã nhỏ, thêm thẻ mới bắt đầu đáng tiền. Trình tự của chuyên gia: <b>đo → sửa phần tuần tự → đo lại → rồi mới mua</b>.</p>
        focus: [0, "1.2", "1.3", 2, 2]
        say: "Câu hai cho thấy điều kiện đổi lựa chọn. Nếu viết lại chỉ đưa phần tuần tự về 10 phần trăm, 8 thẻ được khoảng 4 phẩy 71 lần, 21 phẩy 25 phút, chưa đạt hạn. Khi đó lên 16 thẻ được 6 phẩy 4 lần, khoảng 15 phẩy 6 phút, đạt hạn. Vậy khi phần tuần tự đã nhỏ, thêm thẻ mới bắt đầu đáng tiền. Trình tự của chuyên gia là đo, sửa phần tuần tự, đo lại, rồi mới mua."

  # ───────────────────────── 9. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Thay đổi hệ thống & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">đo ngân sách một thẻ</span><span class="a">→</span>
          <span class="n">tìm phần tuần tự: 25%</span><span class="a">→</span>
          <span class="n">Amdahl: 8 thẻ ≈ 2,91, trần 4</span><span class="a">→</span>
          <span class="n">sửa phần tuần tự: 7,02</span><span class="a">→</span>
          <span class="n">đo lại, rồi mới mua thêm</span></div>
        say: "Tổng kết lại, ta đo ngân sách trên một thẻ, tìm ra phần tuần tự 25 phần trăm, và định luật Amdahl tái hiện đúng con số 2 phẩy 91 cùng trần 4. Sửa phần tuần tự đưa 8 thẻ lên 7 phẩy 02 lần, rồi đo lại trước khi mua thêm."
      - show: |
          <div class="box key"><b>Thay đổi hệ thống:</b> ngân sách thời gian là một bước bắt buộc khi đổi phần cứng; kiểm thử hiệu năng có ngưỡng hiệu suất. <b>Tư duy:</b> đo trước khi mua thêm phần cứng — phần tuần tự quyết định trần.</div>
        say: "Thay đổi ở mức hệ thống là đưa ngân sách thời gian thành bước bắt buộc khi đổi phần cứng, và đặt ngưỡng hiệu suất trong kiểm thử hiệu năng. Điều cần mang theo, hãy đo trước khi mua thêm phần cứng, vì phần tuần tự quyết định trần."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): hành trình của bộ xử lý đồ hoạ — từ thẻ chỉ để vẽ hình, tới mô hình lập trình riêng, rồi huấn luyện trên hàng trăm thẻ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta đi theo hành trình có thật của bộ xử lý đồ hoạ. Từ thẻ chỉ để vẽ hình, tới một mô hình lập trình riêng, rồi tới huấn luyện trên hàng trăm thẻ. Hẹn gặp bạn ở bài tiếp theo."
