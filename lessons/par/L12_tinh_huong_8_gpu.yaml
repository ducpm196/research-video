id: L12
course: PAR
series: "PAR · Tính toán song song và GPU"
title: "Bài 12 — Tình huống chuyên gia: 8 GPU mà chỉ nhanh gấp 3 — tìm phần tuần tự"
voice: vi-VN-NamMinhNeural
rate: "-5%"
