source: "curriculum/par.yaml L09; audit/par/verify_par.py L09; audit/par/sources_L09.md (câu trích nguyên văn, đọc 2026-11-02); NVIDIA, CUDA C++ Best Practices Guide, mục Shared Memory in Matrix Multiplication (C=AB), bảng Performance Improvements Optimizing C = AB Matrix Multiply [BPG]; J. Nickolls và cộng sự, Scalable Parallel Programming with CUDA, ACM Queue 2008 — bộ nhớ chia sẻ 16 KB mỗi cụm [NI08]; CS115 bài 2 (nhân ma trận); CSA bài 10 (phân cấp bộ nhớ); PAR bài 3 (cộng số thực không kết hợp), bài 7, bài 8"
assumes: [arith, frac, approx, power]
# Quy ước: ma trận vuông n hàng n cột, số thực 32 bit (4 byte); A_{ik} = số ở hàng i, cột k. “Bộ nhớ chậm” = bộ nhớ chính của thẻ;
#   “bộ nhớ nhanh” = bộ nhớ chia sẻ của một cụm xử lý (shared memory), dung lượng M byte. Khối cỡ b: ma trận con b hàng b cột,
#   b chia hết n. “Số phần tử đọc” = số lần một số được chuyển từ bộ nhớ chậm lên (không tính ghi C, n² lần, nhỏ so với 2n³/b).
#   16 KB mỗi cụm là con số của thế hệ năm 2008 [NI08]; thẻ hiện nay lớn hơn — ghi rõ trên màn hình. 48 KB trong quiz là SỐ MINH HOẠ.
#   Băng thông 119,9 / 144,4 / 195,5 GB/s đo trên một thẻ V100 là số của hãng [BPG]. 1 KB = 1024 byte ở bài này (đúng cách đếm 16 KB).
objectives:
  - "Đếm số phần tử đọc từ bộ nhớ chậm của nhân ma trận ngây thơ: 2n³"
  - "Suy ra số đọc của nhân chia khối b: 2n³ chia b, vì mỗi số nạp lên được dùng b lần"
  - "Chọn cỡ khối lớn nhất mà ba khối vừa bộ nhớ nhanh"
  - "Nối số đọc với cường độ của bài 7 để biết chia khối có đưa nhân lên mái phẳng không"
