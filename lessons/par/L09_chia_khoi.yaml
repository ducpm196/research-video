scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng một phép nhân, ba cách đọc dữ liệu"
    checks:
      - "round(195.5 / 119.9, 2) == 1.63 and 2 * 1024 ** 3 == 2147483648 and 2 * 1024 ** 3 // 32 == 67108864"
    steps:
      - show: |
          <p>Hướng dẫn tối ưu chính thức của hãng làm thẻ đồ hoạ đo cùng một phép nhân ma trận trên một thẻ V100:</p>
          <table class="t"><tr><th>phiên bản</th><th>băng thông hiệu dụng</th></tr>
          <tr><td>không tối ưu</td><td>119,9 GB/s</td></tr>
          <tr><td>chép một khối của A vào bộ nhớ chia sẻ</td><td>144,4 GB/s</td></tr>
          <tr><td>chép cả khối của B để bỏ các lần đọc thừa</td><td><b>195,5 GB/s</b>, gấp ≈ 1,63 lần</td></tr></table>
          <div class="box key">Hôm nay ta trả lời: đọc thừa ở đâu ra? Chia khối bớt được bao nhiêu lần đọc? Và khối lớn tới đâu thì phải dừng?</div>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Chào bạn, hướng dẫn tối ưu chính thức của hãng làm thẻ đồ hoạ đo cùng một phép nhân ma trận trên một thẻ cụ thể. Phiên bản không tối ưu đạt băng thông hiệu dụng 119 phẩy 9 tỉ byte mỗi giây. Chép một khối của ma trận A vào bộ nhớ chia sẻ thì lên 144 phẩy 4. Chép thêm khối của B để bỏ các lần đọc thừa thì lên 195 phẩy 5, gấp khoảng 1 phẩy 63 lần. Hôm nay ta trả lời đọc thừa ở đâu ra, chia khối bớt được bao nhiêu lần đọc, và khối lớn tới đâu thì phải dừng."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều sẽ dùng"
    checks:
      - "[[1 * 5 + 2 * 7, 1 * 6 + 2 * 8], [3 * 5 + 4 * 7, 3 * 6 + 4 * 8]] == [[19, 22], [43, 50]]"
      - "2 / 8 == 0.25 and 16 * 1024 == 16384"
    steps:
      - show: |
          <p><b>① Nhân ma trận</b> (khoá toán cho khoa học máy tính, bài 2): ô hàng i, cột j của kết quả = hàng i của A nhân lần lượt với cột j của B rồi cộng lại. Dấu chấm giữa dòng là phép nhân.</p>
          $$\begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix} \begin{bmatrix} 5 & 6 \\ 7 & 8 \end{bmatrix} = \begin{bmatrix} 1 \cdot 5 + 2 \cdot 7 & 1 \cdot 6 + 2 \cdot 8 \\ 3 \cdot 5 + 4 \cdot 7 & 3 \cdot 6 + 4 \cdot 8 \end{bmatrix} = \begin{bmatrix} 19 & 22 \\ 43 & 50 \end{bmatrix}$$
        introduces: [cdot, mat]
        focus: [1, 1, 2, 2]
        say: "Điều thứ nhất, ở khoá toán cho khoa học máy tính, bài 2, ta đã học nhân ma trận. Ô hàng i, cột j của kết quả bằng hàng i của A nhân lần lượt với cột j của B rồi cộng lại, và dấu chấm giữa dòng là phép nhân. Ví dụ ô góc trên trái là 1 nhân 5 cộng 2 nhân 7, bằng 19. Bốn ô cho kết quả 19, 22, 43 và 50."
      - show: |
          <table class="t"><tr><th>điều</th><th>đã học ở</th><th>nhắc lại</th></tr>
          <tr><td>② phân cấp bộ nhớ</td><td>khoá Hệ thống máy tính</td><td>bộ nhớ nhanh thì nhỏ, bộ nhớ lớn thì chậm; dùng lại dữ liệu đang ở gần là cách tăng tốc</td></tr>
          <tr><td>③ cường độ</td><td>bài 7</td><td>phép tính chia byte; nhân ngây thơ: 2 phép cho 8 byte = 0,25</td></tr>
          <tr><td>④ khối luồng</td><td>bài 8</td><td>các luồng của một khối chạy trên một cụm, dùng chung <b>bộ nhớ chia sẻ</b> — năm 2008 mỗi cụm có 16 KB = 16 384 byte</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ba điều còn lại. Ở khoá Hệ thống máy tính, ta đã thấy bộ nhớ nhanh thì nhỏ, bộ nhớ lớn thì chậm, và dùng lại dữ liệu đang ở gần là cách tăng tốc. Ở bài 7, cường độ là phép tính chia byte, và nhân ma trận ngây thơ chỉ có 2 phép cho 8 byte, tức 0 phẩy 25. Ở bài 8, các luồng của một khối chạy trên một cụm và dùng chung bộ nhớ chia sẻ, năm 2008 mỗi cụm có 16 KB, tức 16 nghìn 384 byte."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: n, b, M và dấu tổng"
    checks:
      - "sum(k for k in range(1, 4)) == 6"
    steps:
      - show: |
          $$C_{ij} = \sum_{k=1}^{n} A_{ik} \cdot B_{kj}$$
          <p>$A_{ik}$: số ở hàng $i$, cột $k$ của $A$. Chữ Sigma hoa là <b>máy cộng dồn</b>: cho $k$ chạy từ 1 tới $n$, cộng mọi tích lại. Làm thử: $\sum_{k=1}^{3} k = 1 + 2 + 3 = 6$.</p>
        introduces: [sum, sub2, sub]
        focus: [1, 2, 2, 2]
        say: "Công thức nhân ma trận viết gọn như sau. A i k là số ở hàng i, cột k của A, hai chữ nhỏ dưới chân là số hàng và số cột. Chữ Sigma hoa là một máy cộng dồn, cho k chạy từ 1 tới n rồi cộng mọi tích lại. Làm thử, tổng khi k chạy từ 1 tới 3 của k là 1 cộng 2 cộng 3, bằng 6."
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th><th>ví dụ của bài</th></tr>
          <tr><td>$n$</td><td>cỡ ma trận vuông</td><td>1024</td></tr>
          <tr><td>$b$</td><td>cỡ khối: ma trận con $b$ hàng $b$ cột</td><td>32</td></tr>
          <tr><td>$M$</td><td>dung lượng bộ nhớ nhanh, byte</td><td>16 384</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bài dùng thêm ba chữ cái. n là cỡ ma trận vuông, ví dụ của bài là 1024. b là cỡ khối, một ma trận con b hàng b cột, ví dụ 32. M là dung lượng bộ nhớ nhanh tính bằng byte, ví dụ 16 nghìn 384."

