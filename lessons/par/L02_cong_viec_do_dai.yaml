  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra cận dưới và cận trên của thời gian trên n lõi"
    checks:
      - "max(7 / 2, 3) == 3.5 and alg.par_greedy_tree_steps(8, 2) == 4"
      - "-(-4 // 2) + -(-2 // 2) + -(-1 // 2) == 4 and 3 + (7 - 3) / 2 == 5 and 7 / 2 + 3 == 6.5"
      - "all(-(-w // n) <= (w - 1) / n + 1 for w in range(1, 200) for n in range(1, 40))"
    steps:
      - show: |
          <p><b>Bước 1 — cận dưới thứ nhất.</b> Mỗi bước, $n$ lõi làm nhiều nhất $n$ phép. Vì có $T_1$ phép phải làm: $T_n \geq \dfrac{T_1}{n}$.</p>
          <p><b>Bước 2 — cận dưới thứ hai.</b> Vì phép sau trên đường găng phải chờ phép trước, thêm lõi không rút ngắn được chuỗi đó: $T_n \geq T_\infty$.</p>
        focus: [1, 1, 2]
        say: "Bước một, cận dưới thứ nhất. Mỗi bước, n lõi làm nhiều nhất n phép, mà có T một phép phải làm, nên T n ít nhất bằng T một chia n. Bước hai, cận dưới thứ hai, vì phép sau trên đường găng phải chờ phép trước, thêm lõi không rút ngắn được chuỗi đó, nên T n ít nhất bằng T vô cùng."
      - show: |
          <p><b>Bước 3 — cận trên.</b> Lịch tham lam làm từng tầng: tầng có $w$ phép mất $\left\lceil \frac{w}{n} \right\rceil$ bước, mà $\left\lceil \frac{w}{n} \right\rceil \leq \frac{w - 1}{n} + 1$.</p>
          <p>Cộng qua $T_\infty$ tầng, tổng các $w$ là $T_1$, nên:</p>
          $$T_n \leq T_\infty + \frac{T_1 - T_\infty}{n} \leq \frac{T_1}{n} + T_\infty$$
          <p class="note">Dạng ở giữa là Lemma 2 của Brent (1974); dạng bên phải gọn hơn, lớn hơn một chút.</p>
        introduces: [ceil]
        focus: [1, 1, 3, 4]
        say: "Bước ba là cận trên, đạt được bằng lịch tham lam làm từng tầng. Ký hiệu móc vuông có hai chân là làm tròn lên, tầng có w phép mất w chia n làm tròn lên số bước, và số đó không quá w trừ 1, chia n, cộng 1. Vì có T vô cùng tầng và tổng số phép là T một, cộng lại ta được T n không quá T vô cùng cộng T một trừ T vô cùng, chia n. Đây là cận trong bài báo năm 1974 về tính biểu thức song song, còn dạng bên phải gọn hơn và lớn hơn một chút."
      - clear: true
        show: |
          <p><b>Làm thử ngay</b> với cây 8 số ở hình, $n = 2$ lõi: $T_1 = 7$, $T_\infty = 3$.</p>
          <table class="t"><tr><th>tính</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>lịch tham lam thật</td><td>tầng 4 phép: 2 bước; tầng 2 phép: 1; tầng 1 phép: 1</td><td>$\hlg{4}$ bước</td></tr>
          <tr><td>cận dưới</td><td>$\max\left(\frac{7}{2}, 3\right) = 3{,}5$</td><td>ít nhất 4 bước</td></tr>
          <tr><td>cận trên của Brent</td><td>$3 + \frac{7 - 3}{2}$</td><td>5 bước</td></tr>
          <tr><td>dạng gọn</td><td>$\frac{7}{2} + 3$</td><td>6,5 bước</td></tr></table>
        introduces: [max_fn]
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Làm thử ngay với cây tám số ở hình, trên 2 lõi, T một bằng 7, T vô cùng bằng 3. Lịch tham lam thật mất 2 bước cho tầng 4 phép, 1 bước cho tầng 2 phép, 1 bước cho tầng cuối, tổng 4 bước. Cận dưới lấy số lớn hơn giữa 7 chia 2 và 3, là 3 phẩy 5, nên ít nhất phải 4 bước. Cận trên của bài báo năm 1974 cho 3 cộng 4 chia 2, bằng 5, còn dạng gọn cho 6 phẩy 5, và 4 nằm đúng giữa hai cận."

  # ───────────────────────── 6. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Cộng 1024 số trên 32 lõi, từng phép tính"
    checks:
      - "alg.par_tree_sum(1024)[0] == 1023 == 1024 - 1"
      - "alg.par_tree_sum(1024)[1] == 10"
      - "[-(-w // 32) for w in (512, 256, 128, 64, 32, 16, 8, 4, 2, 1)] == [16, 8, 4, 2, 1, 1, 1, 1, 1, 1] and 16 + 8 + 4 + 2 + 1 + 5 == 36 == alg.par_greedy_tree_steps(1024, 32)"
      - "round(1023 / 32, 2) == 31.97 and round(10 + (1023 - 10) / 32, 2) == 41.66 and round(1023 / 32 + 10, 2) == 41.97"
      - "round(1023 / 10, 1) == 102.3"
    steps:
      - show: |
          <p><b>Bước 1 — công việc.</b> Mỗi phép cộng gộp hai số thành một, nên từ 1024 số còn 1 số cần đúng $1024 - 1$ phép: $T_1 = \hlb{1023}$.</p>
        say: "Bước một, tính công việc. Mỗi phép cộng gộp hai số thành một, nên đi từ 1024 số về còn 1 số cần đúng 1024 trừ 1 phép, tức T một bằng 1023."
      - show: |
          <p><b>Bước 2 — đường găng.</b> Mỗi tầng chia đôi số giá trị: 1024 → 512 → … → 1 là 10 lần, nên $T_\infty = \hlo{10}$.</p>
        say: "Bước hai, tính đường găng. Mỗi tầng chia đôi số giá trị còn lại, từ 1024 xuống 1 là 10 lần chia đôi, nên T vô cùng bằng 10."
      - clear: true
        show: |
          <p><b>Bước 3 — lịch tham lam từng tầng</b>, 32 lõi:</p>
          <table class="t"><tr><th>tầng</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6–10</th></tr>
          <tr><td>số phép</td><td>512</td><td>256</td><td>128</td><td>64</td><td>32</td><td>16, 8, 4, 2, 1</td></tr>
          <tr><td>số bước</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td><td>1 mỗi tầng</td></tr></table>
          <p>Tổng: $16 + 8 + 4 + 2 + 1 + 5 = \hlg{36}$ bước.</p>
        focus: [1, "2.3", "2.3", 3]
        say: "Bước ba, xếp lịch tham lam từng tầng cho 32 lõi. Tầng một có 512 phép nên mất 16 bước, tầng hai mất 8, tầng ba mất 4, tầng bốn mất 2, tầng năm có đúng 32 phép nên mất 1 bước. Năm tầng cuối có ít phép hơn số lõi, nhưng mỗi tầng vẫn tốn trọn 1 bước. Cộng lại được 36 bước."
      - clear: true
        show: |
          <p><b>Bước 4 — so với hai cận.</b> $T_1 = 1023$, $T_\infty = 10$, $n = 32$:</p>
          <table class="t"><tr><th>cận</th><th>phép tính</th><th>bước</th></tr>
          <tr><td>dưới</td><td>$\max\left(\frac{1023}{32}, 10\right) \approx 31{,}97$</td><td>ít nhất 32</td></tr>
          <tr><td>trên, của Brent</td><td>$10 + \frac{1023 - 10}{32}$</td><td>$\approx 41{,}66$</td></tr>
          <tr><td>trên, dạng gọn</td><td>$\frac{1023}{32} + 10$</td><td>$\approx 41{,}97$</td></tr></table>
          <p>Lịch thật 36 bước nằm giữa 32 và 41,66 ✓</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước bốn, so với hai cận, với T một bằng 1023, T vô cùng bằng 10 và 32 lõi. Cận dưới là 1023 chia 32, khoảng 31 phẩy 97, nên ít nhất 32 bước. Cận trên của bài báo năm 1974 là 10 cộng 1013 chia 32, khoảng 41 phẩy 66, còn dạng gọn khoảng 41 phẩy 97. Lịch thật 36 bước nằm đúng giữa hai cận."
      - show: |
          <p><b>Bước 5 — độ song song.</b> $\dfrac{T_1}{T_\infty} = \dfrac{1023}{10} \approx \hl{102{,}3}$: quá khoảng 100 lõi, lõi thêm gần như ngồi chờ.</p>
        say: "Bước năm, độ song song bằng 1023 chia 10, khoảng 102 phẩy 3. Vượt quá khoảng 100 lõi, lõi thêm vào gần như chỉ ngồi chờ."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm: đếm lại theo đường khác"
    checks:
      - "alg.par_tree_sum(1024)[2] == 1024 * 1025 // 2 == 524800"
      - "sum(1024 // 2 ** k for k in range(1, 11)) == 1023"
      - "round(1023 / 36, 1) == 28.4 and round(1023 / 36 / 32 * 100) == 89"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>$T_1 = 1023$</td><td>cộng số phép từng tầng: $512 + 256 + … + 1 = 1023$ ✓</td></tr>
          <tr><td>tổng đúng</td><td>máy cộng thật theo cây ra 524 800; công thức $\frac{1024 \cdot 1025}{2} = 524\,800$ ✓</td></tr>
          <tr><td>36 bước</td><td>nhanh gấp $\frac{1023}{36} \approx 28{,}4$; chia 32 lõi: mỗi lõi bận khoảng 89% số bước ✓</td></tr></table>
        introduces: [dots, cdot]
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ta kiểm ba con số theo đường khác. Cộng số phép của từng tầng, 512 cộng 256 cộng cứ thế tới 1, đúng bằng 1023. Dấu chấm giữa dòng là phép nhân, máy cộng thật theo cây ra 524 nghìn 800, khớp công thức 1024 nhân 1025 chia 2. Cuối cùng, 1023 chia 36 khoảng 28 phẩy 4 lần, chia cho 32 lõi thì mỗi lõi bận khoảng 89 phần trăm số bước."

  # ───────────────────────── 8. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp, có lỗi cả người đã đi làm"
    checks:
      - "alg.par_tree_sum(1024)[0] == 1023 and max(1023 / 32, 1023) == 1023"
      - "alg.par_greedy_tree_steps(1024, 1024) == 10 and round(36 / 10, 1) == 3.6 and round(1023 / (10 * 1024) * 100) == 10"
      - "36 + 10 == 46 and round(1023 / 46, 1) == 22.2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Giữ vòng cộng dồn rồi thêm lõi <b class="red">(đường găng 1023)</b>
          <br><span class="note">Cộng dồn: $T_\infty = T_1 = 1023$, nên $T_n \geq 1023$ với mọi $n$. Phải đổi thuật toán, không phải đổi máy.</span></div>
        say: "Lỗi thứ nhất, giữ vòng lặp cộng dồn rồi thêm lõi. Cộng dồn có đường găng bằng cả công việc, 1023 bước, nên bao nhiêu lõi cũng không dưới 1023 bước. Phải đổi thuật toán, không phải đổi máy."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ 32 lõi là nhanh gấp 32 <b class="red">(thật: 28,4)</b>
          <br><span class="note">Năm tầng cuối có ít phép hơn số lõi; cận dưới $T_\infty$ luôn còn đó.</span></div>
        say: "Lỗi thứ hai, nghĩ 32 lõi là nhanh gấp 32. Thật ra chỉ khoảng 28 phẩy 4 lần, vì năm tầng cuối có ít phép hơn số lõi, và đường găng 10 bước luôn còn đó."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3</b> (người đã đi làm). Mua máy nhiều lõi hơn độ song song <b class="red">(lõi ngồi chờ)</b></div>
          <table class="t"><tr><th>số lõi</th><th>bước</th><th>lõi bận</th></tr>
          <tr><td>32</td><td>36</td><td>khoảng 89%</td></tr>
          <tr><td>1024 (gấp 32 lần)</td><td>10 — chỉ nhanh hơn 3,6 lần</td><td>$\frac{1023}{10 \cdot 1024} \approx \hl{10\%}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Lỗi thứ ba hay gặp ở người đã đi làm, là mua máy có nhiều lõi hơn độ song song. Từ 32 lên 1024 lõi, gấp 32 lần, mà chỉ từ 36 xuống 10 bước, nhanh hơn 3 phẩy 6 lần, vì đã chạm đường găng. Lúc đó mỗi lõi chỉ bận khoảng 10 phần trăm thời gian."
      - show: |
          <div class="box warn"><b>Lỗi 4</b> (người đã đi làm). Tin cận như số đo <b class="red">(mô hình bỏ qua giao tiếp)</b>
          <br><span class="note">Mô hình của Brent bỏ qua thời gian đọc dữ liệu và trao đổi giữa các lõi. Nếu mỗi tầng tốn thêm 1 bước đồng bộ (số minh hoạ): $36 + 10 = 46$ bước, chỉ còn nhanh $\approx 22{,}2$ lần. Đo thật rồi mới hứa.</span></div>
        say: "Lỗi thứ tư cũng của người đã đi làm, là tin cận như số đo thật. Bài báo năm 1974 ghi rõ mô hình bỏ qua thời gian đọc dữ liệu và trao đổi giữa các bộ xử lý. Nếu mỗi tầng tốn thêm 1 bước đồng bộ, một số minh hoạ, ta có 46 bước, chỉ còn nhanh khoảng 22 phẩy 2 lần, nên hãy đo thật rồi mới hứa."

  # ───────────────────────── 9. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn: 16 lõi hay 64 lõi?"
    checks:
      - "alg.par_tree_sum(4096)[:2] == (4095, 12)"
      - "alg.par_greedy_tree_steps(4096, 16) == 259 == 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 + 4"
      - "alg.par_greedy_tree_steps(4096, 64) == 69 == 32 + 16 + 8 + 4 + 2 + 1 + 6"
      - "round(4095 / 259, 1) == 15.8 and round(4095 / 69, 1) == 59.3 and round(259 / 69, 2) == 3.75 and round(4095 / 69 / 64 * 100) == 93"
      - "round(12 + 4083 / 16, 1) == 267.2 and round(12 + 4083 / 64, 1) == 75.8 and round(4095 / 12, 1) == 341.2"
    steps:
      - show: |
          <p>Cộng 4096 số theo cặp. Hai máy: <b>16 lõi</b>, và <b>64 lõi</b> giá gấp 4 (số minh hoạ).</p>
          <table class="t"><tr><th>câu</th><th>hỏi</th></tr>
          <tr><td>1</td><td>$T_1$, $T_\infty$ và độ song song?</td></tr>
          <tr><td>2</td><td>lịch tham lam từng tầng mất bao nhiêu bước trên mỗi máy?</td></tr>
          <tr><td>3</td><td>máy 64 lõi có đáng giá gấp 4 không?</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn, cộng 4096 số theo cặp, có hai máy, máy 16 lõi, và máy 64 lõi giá gấp 4, đều là số minh hoạ. Câu một, T một, T vô cùng và độ song song là bao nhiêu? Câu hai, lịch tham lam từng tầng mất bao nhiêu bước trên mỗi máy? Câu ba, máy 64 lõi có đáng giá gấp 4 không? Dừng video và làm ra giấy."
        pause: 20
      - clear: true
        show: |
          <p>Câu 1: $T_1 = 4096 - 1 = \hlb{4095}$; $2^{12} = 4096$ nên $T_\infty = \hlo{12}$; độ song song $\frac{4095}{12} \approx 341{,}2$.</p>
          <table class="t"><tr><th>câu 2</th><th>số bước từng tầng</th><th>tổng</th><th>cận Brent</th></tr>
          <tr><td>16 lõi</td><td>128, 64, 32, 16, 8, 4, 2, 1, rồi 4 tầng 1 bước</td><td>$\hlg{259}$</td><td>$\approx 267{,}2$</td></tr>
          <tr><td>64 lõi</td><td>32, 16, 8, 4, 2, 1, rồi 6 tầng 1 bước</td><td>$\hlg{69}$</td><td>$\approx 75{,}8$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Đáp án câu một, T một bằng 4096 trừ 1, là 4095, và vì 2 mũ 12 bằng 4096 nên T vô cùng bằng 12, độ song song khoảng 341. Câu hai, máy 16 lõi mất 128 bước ở tầng đầu, rồi 64, 32, cứ thế giảm, cộng thêm 4 tầng cuối mỗi tầng một bước, tổng 259 bước, dưới cận 267 phẩy 2. Máy 64 lõi mất 69 bước, dưới cận 75 phẩy 8."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 3</th><th>16 lõi</th><th>64 lõi</th></tr>
          <tr><td>nhanh gấp</td><td>$\frac{4095}{259} \approx 15{,}8$</td><td>$\frac{4095}{69} \approx 59{,}3$</td></tr>
          <tr><td>so với nhau</td><td colspan="2">$\frac{259}{69} \approx \hl{3{,}75}$ lần, với giá gấp 4</td></tr>
          <tr><td>lõi bận</td><td>gần 99%</td><td>khoảng 93%</td></tr></table>
          <p class="note">Đáng, nếu việc cộng là phần chính và chạy thường xuyên: 64 nhỏ hơn nhiều so với độ song song 341. Đổi ý khi số lõi tiến gần 341, hoặc khi mỗi tầng tốn thêm đồng bộ.</p>
        focus: ["1.2", "1.3", 2, 2]
        say: "Câu ba, máy 16 lõi nhanh khoảng 15 phẩy 8 lần, máy 64 lõi nhanh khoảng 59 phẩy 3 lần. So với nhau, máy 64 lõi nhanh hơn khoảng 3 phẩy 75 lần với giá gấp 4, mỗi lõi vẫn bận khoảng 93 phần trăm. Vậy là đáng nếu việc này chạy thường xuyên, vì 64 còn nhỏ hơn nhiều so với độ song song 341. Hãy đổi ý khi số lõi tiến gần 341, hoặc khi mỗi tầng tốn thêm thời gian đồng bộ."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">vẽ phép tính và phép phải chờ</span><span class="a">→</span>
          <span class="n">$T_1$ = số phép, $T_\infty$ = đường găng</span><span class="a">→</span>
          <span class="n">$\max\left(\frac{T_1}{n}, T_\infty\right) \leq T_n \leq T_\infty + \frac{T_1 - T_\infty}{n}$</span><span class="a">→</span>
          <span class="n">độ song song $\frac{T_1}{T_\infty}$ = số lõi còn có ích</span></div>
        say: "Tổng kết lại, ta vẽ các phép tính và phép nào phải chờ phép nào. Từ đó đếm T một là số phép, và T vô cùng là đường găng. Thời gian trên n lõi nằm giữa cận dưới và cận trên của bài báo năm 1974. Còn độ song song T một chia T vô cùng cho biết số lõi còn dùng có ích."
      - show: |
          <div class="box key"><b>Tư duy:</b> trước khi thêm lõi, đếm đường găng. Đường găng dài thì đổi thuật toán; số lõi đã gần độ song song thì thêm lõi chỉ thêm tiền.</div>
        say: "Điều cần mang theo, trước khi thêm lõi, hãy đếm đường găng. Đường găng dài thì phải đổi thuật toán, còn số lõi đã gần độ song song thì thêm lõi chỉ tốn thêm tiền."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): khi nhiều luồng cùng cộng vào <b>một</b> biến chung — tranh chấp dữ liệu, phép toán nguyên tử và phép rút gọn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta xem chuyện gì xảy ra khi nhiều luồng cùng cộng vào một biến chung, với tranh chấp dữ liệu, phép toán nguyên tử và phép rút gọn. Hẹn gặp bạn ở bài tiếp theo."
