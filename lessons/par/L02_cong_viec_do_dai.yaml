id: L02
course: PAR
series: "PAR · Tính toán song song và GPU"
title: "Bài 2 — Mô hình công việc–độ dài đường găng và cận lịch tham lam"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/par.yaml L02; audit/par/verify_par.py L02; audit/par/sources_L02.md (câu trích nguyên văn, đọc 2026-11-02); R. P. Brent, The Parallel Evaluation of General Arithmetic Expressions, JACM 21(2), 1974 — Lemma 2 (thời gian t + (q − t)/p với p bộ xử lý), mô hình bỏ qua thời gian truy cập dữ liệu và giao tiếp, cận dưới log2 n và (n − 1)/p cho phép cộng n số; J. Owens và cộng sự, A Survey of General-Purpose Computation on Graphics Hardware (Eurographics 2005) — rút gọn trên bộ xử lý đồ hoạ trong O(log n) lượt, mỗi lượt giảm một nửa; PAR bài 0 (Amdahl)"
assumes: [arith, frac, approx, geq]
# Quy ước: n = số lõi (cả khoá); T₁ = công việc = tổng số phép tính = thời gian trên MỘT lõi; T∞ = độ dài đường găng = thời gian khi có
#   vô số lõi; T_n = thời gian trên n lõi; mỗi phép cộng mất 1 bước (mô hình của Brent 1974: bỏ qua đọc dữ liệu, giao tiếp).
#   “Lịch tham lam theo tầng” = mỗi bước, mỗi lõi rảnh làm một phép đã sẵn sàng, hết tầng này mới sang tầng sau (alg.par_greedy_tree_steps).
#   Cận của Brent: T_n ≤ T∞ + (T₁ − T∞)/n; dạng gọn hay gặp T_n ≤ T₁/n + T∞ (lớn hơn một chút). Dấu nhân: · (\cdot).
#   Tên Brent chỉ trên màn hình (chưa dò phát âm): lời đọc nói “cận của bài báo năm 1974”.
#   Số minh hoạ: máy 16 lõi và 64 lõi giá gấp 4 ở quiz; 1 bước đồng bộ thêm mỗi tầng ở lỗi 4.
objectives:
  - "Tính công việc T₁ và độ dài đường găng T∞ của phép cộng n số theo cây và theo chuỗi"
  - "Dùng cận dưới max(T₁/n, T∞) và cận trên T∞ + (T₁ − T∞)/n để dự đoán thời gian trên n lõi"
  - "Nhận ra khi nào thêm lõi vô ích: số lõi vượt xa độ song song T₁/T∞"
asr_reviewed:
  - {sentence: "Thứ nhất, ở bài 0, định luật Amdahl nói phần tuần tự giới hạn tăng tốc, 90 phần trăm song song được thì 16 lõi chỉ nhanh 6 phẩy 4 lần.", reason: "ASR chép “Thứ nhất, ở bài 0, định luật am đang nói phần tuần tự giới hạn tăng tốc. 90% song song được thì 16 loại chỉ nhanh 6,4 lần.” (0.941): lệch âm/thanh thuần Việt: lõi/loại; “Amdahl” đọc “Am-đan” theo lexicon_vi.CSA.yaml (probe p1 8/8), ASR chép “am đang/amdang/âm đăng” — cùng âm — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "32 lõi cộng 1024 số: nhanh gấp mấy?"
    checks:
      - "alg.par_tree_sum(1024)[:2] == (1023, 10) and alg.par_greedy_tree_steps(1024, 32) == 36"
      - "round(1023 / 36, 1) == 28.4"
    steps:
      - show: |
          <p>Một bạn viết vòng lặp cộng 1024 số, mỗi lần cộng thêm một số vào tổng, rồi chạy trên máy <b>32 lõi</b>: <b>không nhanh hơn chút nào</b>.</p>
          <p>Đổi cách cộng thành cộng theo cặp: cùng 1023 phép cộng, 32 lõi xong sau <b>36 bước</b> thay vì 1023 — nhanh khoảng <b>28,4 lần</b>, chưa tới 32.</p>
          <div class="box key">Hôm nay: đếm “việc” và “đường găng” của một thuật toán, đoán trước thời gian trên n lõi, và biết lúc nào thêm lõi là vô ích.</div>
        focus: [1, 2, 3]
        say: "Chào bạn, một bạn viết vòng lặp cộng 1024 số, mỗi lần cộng thêm một số vào tổng, rồi chạy trên máy 32 lõi, và không nhanh hơn chút nào. Đổi sang cộng theo cặp, vẫn đúng 1023 phép cộng, thì 32 lõi xong sau 36 bước, nhanh khoảng 28 phẩy 4 lần. Hôm nay ta học cách đếm việc và đường găng của một thuật toán, đoán trước thời gian trên nhiều lõi, và biết lúc nào thêm lõi là vô ích."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "round(1 / (0.1 + 0.9 / 16), 1) == 6.4"
      - "(lambda h: (h(1024), h(8)))(lambda m: next(k for k in range(64) if m >> k == 1)) == (10, 3) and 2 ** 10 == 1024"
      - "-(-16 // 32) == 1 and -(-512 // 32) == 16 and -(-33 // 32) == 2"
    steps:
      - show: |
          <table class="t"><tr><th>điều đã biết</th><th>ví dụ số</th></tr>
          <tr><td>① Ở bài 0: phần tuần tự giới hạn tăng tốc (Amdahl)</td><td>90% song song được, 16 lõi → $\frac{1}{0{,}1 + 0{,}9/16} = 6{,}4$ lần</td></tr>
          <tr><td>② Chia đôi liên tiếp tới khi còn 1</td><td>1024 → 512 → 256 → … → 1: đúng 10 lần, vì $2^{10} = 1024$</td></tr>
          <tr><td>③ Chia việc cho lõi, phần lẻ vẫn tốn một bước</td><td>512 việc, 32 lõi: 16 bước; 33 việc: 2 bước; 16 việc: 1 bước</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Ta ôn ba điều sẽ dùng. Thứ nhất, ở bài 0, định luật Amdahl nói phần tuần tự giới hạn tăng tốc, 90 phần trăm song song được thì 16 lõi chỉ nhanh 6 phẩy 4 lần. Thứ hai, chia đôi 1024 liên tiếp tới khi còn 1 thì cần đúng 10 lần, vì 2 mũ 10 bằng 1024. Thứ ba, chia việc cho lõi thì phần lẻ vẫn tốn trọn một bước, 512 việc trên 32 lõi mất 16 bước, nhưng 33 việc mất 2 bước."

  # ───────────────────────── 3. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: công việc, đường găng, thời gian trên n lõi"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>đọc</th><th>nghĩa</th></tr>
          <tr><td>$T_1$</td><td>tê một</td><td><b>công việc</b>: tổng số phép tính, cũng là thời gian trên <b>một</b> lõi</td></tr>
          <tr><td>$T_\infty$</td><td>tê vô cùng</td><td><b>độ dài đường găng</b>: chuỗi phép tính dài nhất mà phép sau phải chờ phép trước; thời gian khi có vô số lõi</td></tr>
          <tr><td>$T_n$</td><td>tê n</td><td>thời gian trên $n$ lõi</td></tr></table>
        introduces: [sub, infty]
        focus: [0, "1.2", "1.3", "1.3", "1.4"]
        say: "Bài dùng ba ký hiệu, chữ T với một chỉ số nhỏ ở chân. T một, đọc là tê một, là công việc, tức tổng số phép tính, cũng là thời gian khi chỉ có một lõi. T vô cùng là độ dài đường găng, tức chuỗi phép tính dài nhất mà phép sau phải chờ phép trước. Có vô số lõi thì vẫn phải đi hết chuỗi đó, nên T vô cùng là thời gian ngắn nhất có thể. T n là thời gian trên n lõi."
      - show: |
          <p>Hai con số này đi cùng một tỉ số: $\dfrac{T_1}{T_\infty}$ = <b>độ song song</b> — số lõi tối đa còn dùng có ích.</p>
          <p>Làm thử: 8 phép cộng xếp thành 2 tầng mỗi tầng 4 phép: $T_1 = 8$, $T_\infty = 2$, độ song song $\frac{8}{2} = 4$.</p>
        focus: [1, 2]
        say: "Hai con số này đi cùng một tỉ số, T một chia T vô cùng, gọi là độ song song, tức số lõi tối đa còn dùng có ích. Làm thử với 8 phép cộng xếp thành 2 tầng, mỗi tầng 4 phép, thì T một bằng 8, T vô cùng bằng 2, nên độ song song bằng 4."

