  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2005 — khai sinh: mượn ống vẽ hình để tính"
    stage: {year: "2005", scale: "thẻ đồ hoạ có 6 bộ xử lý đỉnh và 16 bộ xử lý điểm ảnh; trên 63 tỉ phép tính mỗi giây so với đỉnh 14,8 của một bộ xử lý trung tâm 3,7 GHz; băng thông 35,2 GB/s", source: "[OW05]", practice: "chia ứng dụng thành các đoạn song song dữ liệu độc lập (hạt nhân chạy trên từng phần tử); rút gọn theo lượt giảm một nửa — đúng khi việc đều, không cần ghi vào chỗ tuỳ ý"}
    checks:
      - "round(63 / 14.8, 2) == 4.26 and 6 + 16 == 22"
      - "alg.par_tree_sum(8)[:2] == (7, 3) and alg.par_tree_sum(2 ** 20)[1] == 20 and alg.par_tree_sum(2 ** 20)[0] == 2 ** 20 - 1"
      - "(l1 := [a + b for a, b in zip([3, 1, 4, 1], [5, 9, 2, 6])]) == [8, 10, 6, 7] and (l2 := [a + b for a, b in zip(l1[:2], l1[2:])]) == [14, 17] and l2[0] + l2[1] == sum([3, 1, 4, 1, 5, 9, 2, 6]) == 31"
    steps:
      - show: |
          <p><b>Quy mô:</b> thẻ đồ hoạ có <b>6</b> bộ xử lý đỉnh và <b>16</b> bộ xử lý điểm ảnh. Một thẻ tính được <b>hơn 63 tỉ phép mỗi giây</b>, so với đỉnh <b>14,8 tỉ</b> của một bộ xử lý trung tâm 3,7 GHz; một thẻ khác đọc bộ nhớ <b>35,2 GB mỗi giây</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. đỉnh tính so với bộ xử lý trung tâm</td><td>$\frac{63}{14{,}8}$</td><td>$\approx \hlg{4{,}26}$ lần</td></tr>
          <tr><td>Bước 2. cộng $2^{20}$ = 1 048 576 số theo lượt giảm nửa</td><td>số lượt = số tầng của cây</td><td>$\hlb{20}$ lượt, vẫn 1 048 575 phép cộng</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3"]
        say: "Ở chặng một, năm 2005, một thẻ đồ hoạ có 6 bộ xử lý đỉnh và 16 bộ xử lý điểm ảnh. Một thẻ tính được hơn 63 tỉ phép mỗi giây, trong khi đỉnh của bộ xử lý trung tâm 3 phẩy 7 tỉ nhịp chỉ 14 phẩy 8 tỉ. Một thẻ khác đọc bộ nhớ 35 phẩy 2 GB mỗi giây. Bước một, 63 chia 14 phẩy 8 là khoảng 4 phẩy 26 lần. Bước hai, cộng hơn một triệu số, tức 2 mũ 20, theo lượt giảm một nửa cần 20 lượt, đúng số tầng của cây, nhưng công việc vẫn là 1 triệu 48 nghìn 575 phép cộng."
      - clear: true
        show: |
          <p><b>Điểm nghẽn:</b> mọi thứ phải nói bằng ngôn ngữ vẽ hình — khởi động một phép tính là <b>vẽ một hình</b>, đọc dữ liệu là <b>đọc một điểm trong ảnh</b>; chương trình tô điểm ảnh <b>không ghi được vào chỗ tuỳ ý</b>.</p>
          <table class="t"><tr><th>việc</th><th>bài khảo sát năm 2005 ghi</th></tr>
          <tr><td>nhân ma trận</td><td>bị <b>băng thông bộ nhớ</b> chặn mạnh</td></tr>
          <tr><td>biến đổi tần số nhanh</td><td>chỉ <b>ngang</b> bộ xử lý trung tâm đã tối ưu, khi chạy hai phép một lúc</td></tr></table>
          <p class="note">Thực hành: chia việc thành các đoạn song song dữ liệu độc lập, mỗi đoạn chạy trên từng phần tử. Điều kiện: việc đều nhau, mỗi kết quả ghi vào chỗ định sẵn.</p>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Điểm nghẽn của chặng này là mọi thứ phải nói bằng ngôn ngữ vẽ hình. Khởi động một phép tính là vẽ một hình, đọc dữ liệu là đọc một điểm trong ảnh, và chương trình tô điểm ảnh không ghi được vào chỗ tuỳ ý. Bài khảo sát năm 2005 ghi rằng nhân ma trận trên thẻ bị băng thông bộ nhớ chặn mạnh, đúng điều mô hình mái nhà ở bài 7 dự đoán. Phép biến đổi tần số nhanh chỉ ngang bộ xử lý trung tâm đã tối ưu, khi chạy hai phép một lúc. Thực hành rút ra là chia việc thành các đoạn song song dữ liệu độc lập, với điều kiện việc đều nhau và mỗi kết quả ghi vào chỗ định sẵn."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2006 tới 2008 — công cụ riêng: nhóm 32 luồng, khối chạy độc lập"
    stage: {year: "2006 → 2008", scale: "kiến trúc thống nhất đồ hoạ và tính toán (11/2006), mô hình lập trình riêng ra năm 2007; thẻ chạy từ 768 tới 12 288 luồng cùng lúc; hình mẫu 14 cụm, 112 lõi; sau chưa tới một năm đã có hàng chục nghìn người lập trình", source: "[NI08]", practice: "viết hạt nhân thành rất nhiều khối độc lập (chạy được theo mọi thứ tự) để cùng chương trình mở rộng trên thẻ ít hay nhiều lõi; tránh rẽ nhánh trong nhóm 32 luồng; chép dữ liệu dùng lại vào bộ nhớ chia sẻ 16 KB"}
    checks:
      - "24 * 32 == 768 and 12288 // 768 == 16 and 14 * 8 == 112 and 768 // 8 == 96"
      - "alg.par_warp_passes(['A'] * 16 + ['B'] * 16) == (2, 0.5) and alg.par_warp_passes(['A'] * 32) == (1, 1)"
    steps:
      - show: |
          <p><b>Cách xử lý của hãng:</b> tháng 11/2006, một kiến trúc thống nhất cho cả đồ hoạ và tính toán; năm 2007, một <b>mô hình lập trình riêng</b> (CUDA) — viết thẳng bằng ngôn ngữ C, không cần giả vờ vẽ.</p>
          <table class="t"><tr><th>bước</th><th>bài báo năm 2008 ghi</th><th>tính lại</th></tr>
          <tr><td>Bước 1. một cụm xử lý</td><td>8 lõi nhỏ; 24 nhóm, mỗi nhóm 32 luồng</td><td>$24 \cdot 32 = \hlb{768}$ luồng; $\frac{768}{8} = 96$ luồng mỗi lõi</td></tr>
          <tr><td>Bước 2. cả thẻ</td><td>từ 768 tới 12 288 luồng; hình mẫu 14 cụm</td><td>$\frac{12\,288}{768} = 16$ cụm; $14 \cdot 8 = 112$ lõi</td></tr>
          <tr><td>Bước 3. rẽ nhánh trong nhóm</td><td>nhóm chạy lần lượt từng nhánh</td><td>nửa nọ nửa kia: 2 lượt, $\hl{50\%}$</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng hai, tháng 11 năm 2006, hãng làm thẻ đưa ra một kiến trúc thống nhất cho cả đồ hoạ và tính toán. Năm 2007, họ phát hành một mô hình lập trình riêng, viết thẳng bằng ngôn ngữ C mà không cần giả vờ vẽ. Bước một, một cụm xử lý có 8 lõi nhỏ và 24 nhóm 32 luồng, tức 768 luồng, khoảng 96 luồng cho mỗi lõi để che thời gian chờ bộ nhớ. Bước hai, cả thẻ chạy từ 768 tới 12 nghìn 288 luồng, tức tới 16 cụm, còn hình mẫu trong bài báo có 14 cụm với 112 lõi. Bước ba, nếu nhóm 32 luồng rẽ hai nhánh nửa nọ nửa kia thì nhóm chạy lần lượt từng nhánh, hiệu suất còn 50 phần trăm."
      - clear: true
        show: |
          <p><b>Điểm nghẽn mới:</b> thẻ có số lõi rất khác nhau, từ máy tính xách tay tới máy chủ. Làm sao <b>một chương trình</b> chạy tốt trên mọi thẻ?</p>
          <div class="box key">Luật của mô hình: các khối luồng phải <b>chạy được theo mọi thứ tự</b>, song song hay lần lượt. Nhờ vậy khối được xếp lên bao nhiêu cụm cũng được — chỉ hệ thống chạy cần biết thẻ có mấy cụm.</div>
          <p class="note">Thực hành: chia thành rất nhiều khối độc lập; tránh rẽ nhánh trong nhóm 32 luồng; chép dữ liệu dùng lại vào bộ nhớ chia sẻ 16 KB của cụm. Sau chưa tới một năm đã có <b>hàng chục nghìn</b> người lập trình theo mô hình này.</p>
        focus: [1, 2, 2, 3, 3]
        say: "Điểm nghẽn mới là các thẻ có số lõi rất khác nhau, từ máy tính xách tay tới máy chủ, vậy làm sao một chương trình chạy tốt trên mọi thẻ. Luật của mô hình là các khối luồng phải chạy được theo mọi thứ tự, song song hay lần lượt. Nhờ vậy khối được xếp lên bao nhiêu cụm cũng được, và chỉ hệ thống chạy cần biết thẻ có mấy cụm. Thực hành rút ra là chia việc thành rất nhiều khối độc lập, tránh rẽ nhánh trong nhóm 32 luồng, và chép dữ liệu dùng lại vào bộ nhớ chia sẻ 16 KB. Sau chưa tới một năm, đã có hàng chục nghìn người lập trình theo mô hình này."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2012 — bài toán thật: hai thẻ cho một mạng nơ-ron"
    stage: {year: "2012", scale: "mạng 60 triệu tham số, 650 nghìn nơ-ron; 1,2 triệu ảnh huấn luyện, khoảng 90 lượt; 5–6 ngày trên hai thẻ 3 GB", source: "[KR12]", practice: "khi mô hình không vừa một thẻ thì chia mô hình (mỗi thẻ nửa số nhân chập) và chỉ trao đổi ở một số tầng; chỉnh lượng trao đổi tới khi nó là một phần chấp nhận được của thời gian tính"}
    checks:
      - "90 * 1.2e6 == 1.08e8 and [round(1.08e8 / (d * 86400)) for d in (6, 5)] == [208, 250]"
      - "60e6 / 2 == 30e6"
    steps:
      - show: |
          <p><b>Quy mô:</b> mạng có <b>60 triệu tham số</b>, 650 nghìn nơ-ron; học trên <b>1,2 triệu ảnh</b>, khoảng <b>90 lượt</b>; mất <b>5–6 ngày trên hai thẻ 3 GB</b>.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tổng số ảnh đã xử lý</td><td>$90 \cdot 1{,}2$ triệu</td><td>108 triệu lượt ảnh</td></tr>
          <tr><td>Bước 2. nếu mất 6 ngày</td><td>$\frac{108\ \text{triệu}}{6 \cdot 86\,400\ \text{s}}$</td><td>$\approx \hlb{208}$ ảnh mỗi giây</td></tr>
          <tr><td>Bước 3. nếu mất 5 ngày</td><td>$\frac{108\ \text{triệu}}{5 \cdot 86\,400\ \text{s}}$</td><td>$\approx \hlb{250}$ ảnh mỗi giây</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng ba, năm 2012, một mạng nhận dạng ảnh có 60 triệu tham số và 650 nghìn nơ-ron. Nó học trên 1 phẩy 2 triệu ảnh, khoảng 90 lượt, mất 5 tới 6 ngày trên hai thẻ 3 GB. Bước một, 90 nhân 1 phẩy 2 triệu là 108 triệu lượt ảnh. Bước hai, nếu mất 6 ngày, tức 6 nhân 86 nghìn 400 giây, thì hai thẻ xử lý khoảng 208 ảnh mỗi giây. Bước ba, nếu mất 5 ngày thì khoảng 250 ảnh mỗi giây."
      - clear: true
        show: |
          <p><b>Điểm nghẽn:</b> “kích thước mạng bị giới hạn chủ yếu bởi bộ nhớ của thẻ và thời gian huấn luyện ta chịu được”. Một thẻ chỉ có 3 GB — mạng quá lớn cho một thẻ.</p>
          <table class="t"><tr><th>cách xử lý</th><th>vì sao</th></tr>
          <tr><td><b>chia mô hình</b>: mỗi thẻ giữ nửa số nhân chập</td><td>mỗi thẻ chỉ cần chỗ cho nửa mạng</td></tr>
          <tr><td>hai thẻ chỉ trao đổi ở <b>một số tầng</b></td><td>chỉnh lượng trao đổi tới khi nó là “một phần chấp nhận được của thời gian tính”</td></tr></table>
          <p class="note">Thực hành: chia mô hình khi không vừa một thẻ; đo tỉ lệ truyền trên tính như bài 11. Điều kiện: chỉ hai thẻ đọc ghi thẳng bộ nhớ của nhau, không qua máy chủ.</p>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Điểm nghẽn được chính bài báo ghi rõ, kích thước mạng bị giới hạn chủ yếu bởi bộ nhớ của thẻ và thời gian huấn luyện người ta chịu được. Mỗi thẻ đồ hoạ khi ấy chỉ có 3 GB bộ nhớ, nên cả mạng không vừa trong một thẻ. Cách xử lý là chia mô hình, mỗi thẻ giữ nửa số nhân chập, nên mỗi thẻ chỉ cần chỗ cho nửa mạng. Hai thẻ chỉ trao đổi ở một số tầng, và nhóm tác giả chỉnh lượng trao đổi tới khi nó là một phần chấp nhận được của thời gian tính. Đây chính là tỉ lệ truyền trên tính của bài 11, ở thời đại mới có hai thẻ đọc ghi thẳng bộ nhớ của nhau."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2017 — quy mô hàng trăm thẻ: 256 thẻ trong một giờ"
    stage: {year: "2017", scale: "mạng nhận dạng ảnh: 29 giờ trên 8 thẻ với lô 256; lô 8192 trên 256 thẻ trong 1 giờ, giữ nguyên độ chính xác; hiệu suất mở rộng 90% khi đi từ 8 lên 256 thẻ", source: "[GO17]", practice: "giữ cố định số mẫu mỗi thẻ (32) — mở rộng yếu; lô nhân k thì tốc độ học nhân k; khởi động dần tốc độ học trong 5 lượt đầu; đúng tới lô khoảng 8 nghìn"}
    checks:
      - "8192 // 256 == 32 and 256 // 8 == 32 and 256 * 32 == 8192"
      - "round(29 * 8 / 256, 3) == 0.906 and round(29 * 8 / 256 * 60, 1) == 54.4 and round(29 * 8 / 256 / 0.9 * 60, 1) == 60.4"
      - "round(0.1 * 8192 / 256, 6) == 3.2"
    steps:
      - show: |
          <p><b>Quy mô:</b> trước đó mạng này học trong <b>29 giờ trên 8 thẻ</b>, lô 256 ảnh. Năm 2017: lô <b>8192</b> trên <b>256 thẻ</b> trong <b>1 giờ</b>, độ chính xác như cũ; hiệu suất mở rộng <b>90%</b> khi đi từ 8 lên 256 thẻ.</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. mẫu mỗi thẻ</td><td>$\frac{256}{8}$ và $\frac{8192}{256}$</td><td>đều $\hlb{32}$ — mở rộng yếu như bài 1</td></tr>
          <tr><td>Bước 2. thời gian lý tưởng</td><td>$29 \cdot \frac{8}{256}$</td><td>$\approx 0{,}906$ giờ = 54,4 phút</td></tr>
          <tr><td>Bước 3. chia hiệu suất 90%</td><td>$\frac{0{,}906}{0{,}9}$</td><td>$\approx \hlg{1{,}007}$ giờ ≈ 1 giờ ✓</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng bốn, trước đó mạng nhận dạng ảnh này học trong 29 giờ trên 8 thẻ, với lô 256 ảnh. Năm 2017, một nhóm nghiên cứu dùng lô 8192 ảnh trên 256 thẻ, học xong trong 1 giờ mà độ chính xác như cũ. Hiệu suất mở rộng đạt 90 phần trăm khi đi từ 8 lên 256 thẻ. Bước một, 256 chia 8 và 8192 chia 256 đều bằng 32 ảnh mỗi thẻ, nên đây là mở rộng yếu như bài 1. Bước hai, nếu hoàn hảo thì 29 giờ nhân 8 chia 256 còn khoảng 0 phẩy 906 giờ, tức 54 phẩy 4 phút. Bước ba, chia cho hiệu suất 0 phẩy 9 được khoảng 1 phẩy 007 giờ, khớp với một giờ đã báo."
      - clear: true
        show: |
          <p><b>Điểm nghẽn:</b> lô lớn gấp 32 làm việc học <b>khó hội tụ</b>, nhất là lúc đầu. Không khởi động dần thì sai số trên tập kiểm tra cao hơn <b>1,2%</b>.</p>
          <table class="t"><tr><th>cách xử lý</th><th>tính lại</th></tr>
          <tr><td><b>quy tắc nhân tuyến tính</b>: lô nhân $k$ thì tốc độ học nhân $k$</td><td>$k = \frac{8192}{256} = 32$; $0{,}1 \cdot 32 = \hl{3{,}2}$</td></tr>
          <tr><td><b>khởi động dần</b>: tăng tốc độ học từ 0,1 lên 3,2 trong 5 lượt đầu</td><td>tránh sai số vọt lên lúc đổi tốc độ đột ngột</td></tr></table>
          <p class="note">Thực hành: giữ số mẫu mỗi thẻ cố định, chỉnh tốc độ học theo lô toàn cục, khởi động dần. Điều kiện: nhóm tác giả chỉ kiểm tới lô khoảng 8 nghìn trên bài toán này.</p>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Điểm nghẽn mới không còn là phần cứng. Lô lớn gấp 32 làm việc học khó hội tụ, nhất là lúc đầu, và nếu không khởi động dần thì sai số trên tập kiểm tra cao hơn 1 phẩy 2 phần trăm. Cách xử lý thứ nhất là quy tắc nhân tuyến tính, lô nhân k thì tốc độ học nhân k, với k bằng 32 nên 0 phẩy 1 thành 3 phẩy 2. Cách thứ hai là khởi động dần, tăng tốc độ học từ 0 phẩy 1 lên 3 phẩy 2 trong 5 lượt đầu. Điều kiện cần nhớ là nhóm tác giả chỉ kiểm tới lô khoảng 8 nghìn trên bài toán này."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2017 tới 2018 — ổn định và tiếp tục: thư viện mở dùng chung"
    stage: {year: "2017 → 2018", scale: "một công ty gọi xe: việc huấn luyện có khi mất một tuần; cách chuẩn với máy chủ tham số mất khoảng nửa tài nguyên ở 128 thẻ; thư viện dùng gộp toàn phần theo vòng đạt 88%, có mạng truyền nhanh thì trên 90%", source: "[HO18]", practice: "dùng thuật toán gộp đã chứng minh (vòng, 2009) và thư viện truyền thông của hãng thay vì tự viết; đóng gói thành gói riêng chạy được với nhiều phiên bản nền tảng; gộp nhiều khối gradient nhỏ trước khi gửi; đo dòng thời gian để thấy chỗ nghẽn"}
    checks:
