scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ giả vờ vẽ hình tới 256 thẻ trong một giờ"
    checks:
      - "round(63 / 14.8, 2) == 4.26 and 5 * 24 == 120 and 256 // 2 == 128"
    steps:
      - show: |
          <p>Năm <b>2005</b>, muốn dùng thẻ đồ hoạ để tính, người ta phải <b>giả vờ vẽ một hình</b>: dữ liệu cất trong ảnh, phép tính viết thành chương trình tô màu từng điểm ảnh.</p>
          <p>Năm <b>2012</b>, một mạng nhận dạng ảnh được huấn luyện <b>5–6 ngày trên 2 thẻ</b>. Năm <b>2017</b>, một mạng nhận dạng ảnh khác được huấn luyện trong <b>1 giờ trên 256 thẻ</b>.</p>
          <div class="box key">Hôm nay: năm chặng từ 2005 tới 2018 — mỗi quy mô làm lộ ra điểm nghẽn nào, người làm nghề xử lý ra sao, và ta tính lại con số của họ bằng kiến thức cả khoá.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, năm 2005, muốn dùng thẻ đồ hoạ để tính toán, người ta phải giả vờ vẽ một hình. Dữ liệu được cất trong ảnh, còn phép tính được viết thành chương trình tô màu cho từng điểm ảnh. Năm 2012, một mạng nhận dạng ảnh được huấn luyện 5 tới 6 ngày trên 2 thẻ. Năm 2017, một mạng nhận dạng ảnh khác được huấn luyện chỉ trong 1 giờ trên 256 thẻ. Hôm nay ta đi qua năm chặng, xem mỗi quy mô làm lộ ra điểm nghẽn nào, và tính lại con số của họ bằng kiến thức cả khoá."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại năm điều từ các bài trước"
    checks:
      - "alg.par_tree_sum(1024)[:2] == (1023, 10)"
      - "alg.par_warp_passes(['A'] * 16 + ['B'] * 16)[0] == 2 and alg.par_warp_passes(['A'] * 16 + ['B'] * 16)[1] == 0.5"
      - "alg.par_ring_allreduce([[1] * 8 for _ in range(8)])[1][0] * 8 == 2 * 7 * 8 and 2 * 7 / 8 == 1.75"
      - "round(alg.par_step_efficiency(100, 30) * 100, 1) == 76.9 and round(alg.par_gustafson(0.1, 16), 1) == 14.5"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 1</td><td><b>mở rộng yếu</b>: mỗi lõi giữ phần việc cũ, bài toán lớn theo số lõi</td><td>10% tuần tự trên máy 16 lõi → 14,5 lần</td></tr>
          <tr><td>bài 2</td><td>cộng theo cây: <b>công việc</b> và <b>đường găng</b></td><td>1024 số: 1023 phép cộng, 10 tầng</td></tr>
          <tr><td>bài 8</td><td>nhóm <b>32 luồng chạy chung lệnh</b>; rẽ hai nhánh thì chạy hai lượt</td><td>nửa A, nửa B → hiệu suất 50%</td></tr>
          <tr><td>bài 10</td><td><b>gộp toàn phần theo vòng</b>: mỗi máy gửi $\frac{2(n - 1)}{n} \cdot D$</td><td>8 máy, 1 GB → 1,75 GB</td></tr>
          <tr><td>bài 11</td><td>hiệu suất một bước = thời gian tính chia (tính + truyền không chồng được)</td><td>100 ms tính, 30 ms truyền → 76,9%</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng nhắc lại năm điều từ các bài trước. Ở bài 1, mở rộng yếu là mỗi lõi giữ phần việc cũ và bài toán lớn theo số lõi, nên 10 phần trăm tuần tự trên máy 16 lõi cho 14 phẩy 5 lần. Ở bài 2, cộng 1024 số theo cây cần 1023 phép cộng nhưng đường găng chỉ 10 tầng. Ở bài 8, nhóm 32 luồng chạy chung một lệnh, nên rẽ hai nhánh nửa nọ nửa kia thì chạy hai lượt, hiệu suất 50 phần trăm. Ở bài 10, gộp toàn phần theo vòng cho mỗi máy gửi 2 nhân n trừ 1, chia n, nhân dung lượng D, nên 8 máy với 1 GB gửi 1 phẩy 75 GB. Ở bài 11, hiệu suất một bước bằng thời gian tính chia cho thời gian tính cộng phần truyền không chồng được, 100 và 30 mi li giây cho 76 phẩy 9 phần trăm."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>chương trình tô điểm ảnh</b></td><td>đoạn mã thẻ đồ hoạ chạy cho từng điểm ảnh khi vẽ — năm 2005 được mượn để tính</td></tr>
          <tr><td><b>cụm xử lý</b> (SM)</td><td>một khối trên thẻ gồm vài lõi nhỏ, chạy nhiều nhóm 32 luồng</td></tr>
          <tr><td><b>song song dữ liệu</b></td><td>mỗi thẻ giữ đủ mô hình, học trên một phần dữ liệu, rồi gộp gradient</td></tr>
          <tr><td><b>chia mô hình</b></td><td>mỗi thẻ giữ một phần mô hình, các thẻ trao đổi kết quả giữa chừng</td></tr>
          <tr><td><b>lô toàn cục</b></td><td>tổng số mẫu của mọi thẻ trong một bước = số thẻ nhân số mẫu mỗi thẻ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Chương trình tô điểm ảnh là đoạn mã thẻ đồ hoạ chạy cho từng điểm ảnh khi vẽ, và năm 2005 người ta mượn nó để tính. Cụm xử lý là một khối trên thẻ gồm vài lõi nhỏ, chạy nhiều nhóm 32 luồng. Song song dữ liệu là mỗi thẻ giữ đủ mô hình, học trên một phần dữ liệu, rồi gộp gradient. Chia mô hình là mỗi thẻ chỉ giữ một phần mô hình, và các thẻ trao đổi kết quả giữa chừng. Lô toàn cục là tổng số mẫu của mọi thẻ trong một bước, bằng số thẻ nhân số mẫu mỗi thẻ."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
