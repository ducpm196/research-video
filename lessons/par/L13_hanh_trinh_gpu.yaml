          <circle cx="1530" cy="150" r="15" fill="#059669"/><text x="1530" y="108" font-weight="bold">2017 → 2018</text><text x="1530" y="200">thư viện mở dùng chung</text><text x="1530" y="232">88% ở 128 thẻ</text>
          </g>
          <text x="850" y="305" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → công cụ riêng → quy mô bài toán thật → quy mô hàng trăm thẻ → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2005, người ta mượn ống vẽ hình của thẻ, vốn đã tính nhanh hơn bộ xử lý trung tâm vài lần. Từ 2006 tới 2008, hãng làm thẻ đưa ra một mô hình lập trình riêng, với nhóm 32 luồng và các khối chạy độc lập. Năm 2012, một mạng nơ-ron lớn tới mức phải chia đôi trên hai thẻ. Năm 2017, một nhóm nghiên cứu huấn luyện trên 256 thẻ trong một giờ, rồi tới 2018 việc này thành một thư viện mã nguồn mở mà nhiều đội dùng chung."

