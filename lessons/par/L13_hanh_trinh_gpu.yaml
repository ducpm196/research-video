          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2006 → 2008</text><text x="500" y="200">mô hình lập trình riêng</text><text x="500" y="232">nhóm 32 luồng, khối độc lập</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2012</text><text x="850" y="200">hai thẻ cho một mạng</text><text x="850" y="232">5–6 ngày, thẻ 3 GB</text>
