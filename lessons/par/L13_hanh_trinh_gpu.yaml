          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. 128 thẻ, mất một nửa</td><td>$0{,}5 \cdot 128$</td><td>chỉ bằng 64 thẻ</td></tr>
          <tr><td>Bước 2. thư viện mới, hiệu suất 88%</td><td>$0{,}88 \cdot 128$</td><td>bằng ≈ 112,6 thẻ</td></tr>
          <tr><td>Bước 3. so hai cách</td><td>$\frac{0{,}88}{0{,}5}$</td><td>$\hlg{1{,}76}$ — “nhanh gấp khoảng hai lần”</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng năm, tại một công ty gọi xe, việc huấn luyện có khi mất một tuần. Cách chuẩn của nền tảng, dùng máy chủ tham số, mất khoảng một nửa tài nguyên vì truyền thông khi chạy 128 thẻ. Bước một, mất một nửa nghĩa là 128 thẻ chỉ làm được việc của 64 thẻ. Bước hai, thư viện mới đạt hiệu suất 88 phần trăm, tức bằng khoảng 112 phẩy 6 thẻ. Bước ba, 0 phẩy 88 chia 0 phẩy 5 bằng 1 phẩy 76, khớp với câu nhanh gấp khoảng hai lần của bài báo."
      - clear: true
        show: |
          <table class="t"><tr><th>cách xử lý</th><th>tính lại bằng bài 10</th></tr>
          <tr><td>dùng <b>gộp toàn phần theo vòng</b>, thuật toán công bố năm 2009, qua thư viện truyền thông của hãng (NCCL)</td><td>128 thẻ: mỗi thẻ gửi $\frac{2 \cdot 127}{128} \cdot D \approx \hlb{1{,}98}\,D$, qua $2 \cdot 127 = 254$ bước</td></tr>
          <tr><td><b>gộp các khối nhỏ</b> trước khi gửi (Tensor Fusion): tới 65% nhanh hơn ở mạng có nhiều khối nhỏ</td><td>100 khối nhỏ (số minh hoạ): $100 \cdot 254 = 25\,400$ bước, gộp lại chỉ 254</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Cách xử lý thứ nhất là gộp toàn phần theo vòng, thuật toán đã công bố từ năm 2009, chạy qua thư viện truyền thông của hãng làm thẻ. Theo bài 10, với 128 thẻ mỗi thẻ gửi 2 nhân 127 chia 128, khoảng 1 phẩy 98 lần dung lượng gradient, qua 254 bước nối tiếp. Cách thứ hai sinh ra từ chính số bước ấy, vì mạng có rất nhiều khối gradient nhỏ thì mỗi khối lại tốn 254 bước. Với 100 khối nhỏ, một số minh hoạ, ta có 25 nghìn 400 bước, còn gộp lại trước khi gửi chỉ cần 254. Nhóm tác giả đo được nhanh hơn tới 65 phần trăm."
      - clear: true
        show: |
