          <table class="t"><tr><th>thời điểm</th><th>máy 0</th><th>máy 1</th><th>máy 2</th></tr>
          <tr><td>ban đầu</td><td>1, 2, 3</td><td>10, 20, 30</td><td>100, 200, 300</td></tr>
