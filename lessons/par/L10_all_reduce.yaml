      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>cách</th><th>đường bận nhất chở</th><th>thời gian</th></tr>
          <tr><td>Bước 4</td><td>máy chủ tham số, 8 máy</td><td>nhận 8 GB rồi gửi lại 8 GB</td><td>0,8 + 0,8 = $\hl{1{,}6}$ giây</td></tr>
          <tr><td>Bước 5</td><td>vòng, 64 máy</td><td>$2 \cdot \frac{63}{64} \approx 1{,}97$ GB</td><td>≈ 0,197 giây</td></tr>
          <tr><td>Bước 6</td><td>máy chủ tham số, 64 máy</td><td>nhận 64 GB rồi gửi lại 64 GB</td><td>12,8 giây</td></tr></table>
          <p class="note">Với 8 máy, máy chủ chậm hơn vòng khoảng 9,1 lần; nếu đường của nó chạy hai chiều cùng lúc thì còn 0,8 giây, vẫn chậm hơn khoảng 4,57 lần. Thêm máy: vòng gần như đứng yên, máy chủ tăng theo số máy.</p>
        focus: [0, "1.2", "1.3", "1.4", 2, 2]
        say: "Bây giờ so với máy chủ tham số. Bước bốn, với 8 máy, máy chủ nhận 8 GB rồi gửi lại 8 GB, mất 0 phẩy 8 cộng 0 phẩy 8 bằng 1 phẩy 6 giây. Bước năm, vòng 64 máy chỉ gửi khoảng 1 phẩy 97 GB mỗi máy, mất khoảng 0 phẩy 197 giây. Bước sáu, máy chủ với 64 máy phải nhận 64 GB rồi gửi lại 64 GB, mất 12 phẩy 8 giây. Với 8 máy, máy chủ chậm hơn vòng khoảng 9 lần, và kể cả khi đường chạy hai chiều cùng lúc vẫn chậm hơn khoảng 4 phẩy 57 lần. Thêm máy thì vòng gần như đứng yên, còn máy chủ tăng theo số máy."

  # ───────────────────────── 7. TỰ KIỂM ─────────────────────────
  - id: check
