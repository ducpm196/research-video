          <tr><td>hai máy chủ chia đôi</td><td>mỗi máy chủ 16 GB vào, 16 GB ra</td><td>1,28 giây</td></tr></table>
          <p class="note">Gói lớn: chọn vòng. Thêm máy chủ chỉ chia nhỏ cổ chai, chưa đuổi kịp vòng.</p>
        focus: [0, "1.2", "1.3", "1.4", 2]
        say: "Đáp án câu một. Vòng gửi 2 nhân 15 phần 16 nhân 2, bằng 3 phẩy 75 GB mỗi máy, chia 25 được 0 phẩy 15 giây. Một máy chủ nhận 32 GB rồi gửi 32 GB, mất 2 phẩy 56 giây. Hai máy chủ chia đôi, mỗi máy chủ 16 GB vào và 16 GB ra, mất 1 phẩy 28 giây. Với gói lớn ta chọn vòng, vì thêm máy chủ chỉ chia nhỏ cổ chai chứ chưa đuổi kịp vòng."
      - show: |
          <table class="t"><tr><th>câu 2: 2 MB</th><th>phép tính</th><th>thời gian</th></tr>
          <tr><td>vòng</td><td>30 bước nhân 5 ms trễ, cộng 0,15 ms dữ liệu</td><td>≈ 150,15 ms</td></tr>
          <tr><td>một máy chủ</td><td>2 lần trễ = 10 ms, cộng 64 MB chia 25 GB/s = 2,56 ms</td><td>$\hlg{12{,}56}$ ms</td></tr></table>
          <p class="note">Gói nhỏ trên mạng trễ cao: máy chủ (hay một cách gộp ít lượt) thắng. Cách hay hơn: <b>gom nhiều gói nhỏ thành gói lớn</b> rồi mới gộp bằng vòng. Điều kiện đổi lựa chọn là tỉ số giữa trễ và cỡ gói.</p>
        focus: [0, "1.2", "1.3", 2, 2]
        say: "Câu hai đảo ngược kết quả. Vòng phải đi 30 bước, mỗi bước 5 mi li giây trễ, cộng 0 phẩy 15 mi li giây dữ liệu, khoảng 150 mi li giây. Máy chủ chỉ có 2 lần trễ, 10 mi li giây, cộng 2 phẩy 56 mi li giây dữ liệu, tổng 12 phẩy 56 mi li giây. Gói nhỏ trên mạng trễ cao thì máy chủ, hay một cách gộp ít lượt, thắng. Cách hay hơn là gom nhiều gói nhỏ thành gói lớn rồi mới gộp theo vòng, và điều kiện đổi lựa chọn là tỉ số giữa trễ và cỡ gói."

  # ───────────────────────── 10. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">cắt n mảnh</span><span class="a">→</span>
          <span class="n">rút gọn phân tán: n − 1 bước</span><span class="a">→</span>
          <span class="n">gom lại: n − 1 bước</span><span class="a">→</span>
          <span class="n">mỗi máy gửi $2 \cdot \frac{n - 1}{n} \cdot D$, chưa tới 2D</span><span class="a">→</span>
          <span class="n">gói nhỏ: trễ của 2(n − 1) bước</span></div>
        say: "Tổng kết lại, ta cắt vector thành n mảnh, rút gọn phân tán trong n trừ 1 bước, rồi gom lại trong n trừ 1 bước nữa. Mỗi máy gửi 2 nhân n trừ 1 chia n nhân D, chưa tới 2 lần D dù có bao nhiêu máy. Cái giá là 2 nhân n trừ 1 bước nối tiếp, nên gói nhỏ thì độ trễ quyết định."
      - show: |
