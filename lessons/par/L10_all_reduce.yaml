id: L10
course: PAR
series: "PAR · Tính toán song song và GPU"
title: "Bài 10 — Truyền thông tập thể: all-reduce vòng và máy chủ tham số"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/par.yaml L10; audit/par/verify_par.py L10; audit/par/sources_L10.md (câu trích nguyên văn, đọc 2026-11-02); P. Patarasuk, X. Yuan, Bandwidth Optimal All-reduce Algorithms for Clusters of Workstations, JPDC 2009 (bản tác giả tại cs.fsu.edu) [PY09]; A. Sergeev, M. Del Balso, Horovod: fast and easy distributed deep learning in TensorFlow, arXiv 1802.05799 (2018) [HO18]; PAR bài 2 (cộng theo cây); NET bài 2 (thông lượng); CS115 bài 9 (gradient)"
assumes: [arith, frac, approx, power]
# Quy ước: n = số máy (mỗi máy một thẻ), D = dung lượng gradient của MỖI máy, B = băng thông mỗi đường nối (byte mỗi giây, như bài 7).
#   Vòng: máy i gửi cho máy i + 1 (máy cuối gửi cho máy 0); mọi đường chạy cùng lúc, mỗi đường một chiều mỗi bước.
#   “all-reduce” = gộp toàn phần (mọi máy nhận tổng của mọi máy); “reduce-scatter” = rút gọn phân tán; “all-gather” = gom lại.
#   Máy chủ tham số: nhận rồi gửi NỐI TIẾP qua một đường (nếu đường chạy hai chiều cùng lúc thì chỉ còn một nửa — ghi trên màn hình).
#   GB = 10⁹ byte. Mọi băng thông, độ trễ (10 GB/s, 25 GB/s, 0,05 ms, 5 ms) là SỐ MINH HOẠ.
objectives:
  - "Mô phỏng tay gộp toàn phần theo vòng: rút gọn phân tán rồi gom lại, mỗi pha n − 1 bước"
  - "Suy ra lượng mỗi máy gửi 2(n − 1)/n · D và biết nó không vượt 2D"
  - "So sánh thời gian với một máy chủ tham số nhận n · D qua một đường"
  - "Chọn cách gộp theo cỡ gói: gói lớn thì vòng, gói nhỏ thì độ trễ quyết định"
