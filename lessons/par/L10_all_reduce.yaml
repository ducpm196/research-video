  # ───────────────────────── 5. SUY RA ─────────────────────────
  - id: formula
    kind: formula
    title: "Suy ra: mỗi máy gửi 2(n − 1)/n · D"
    checks:
      - "alg.par_ring_allreduce([[1, 2, 3], [10, 20, 30], [100, 200, 300]])[2] == 4 == 2 * (3 - 1)"
      - "alg.par_ring_allreduce([[1] * 8 for _ in range(4)])[1] == [12] * 4 and alg.Fraction(2 * 3, 4) * 8 == 12"
      - "[float(2 * alg.Fraction(n - 1, n)) for n in (2, 8, 64, 1024)] == [1.0, 1.75, 1.96875, 1.998046875]"
    steps:
      - show: |
          <p><b>Bước 1 — cắt mảnh.</b> Cắt vector của mỗi máy thành $n$ mảnh, mỗi mảnh $\frac{D}{n}$, vì ta muốn $n$ máy cùng làm việc trên $n$ phần khác nhau.</p>
          <p><b>Bước 2 — rút gọn phân tán, $n - 1$ bước.</b> Mỗi bước, mỗi máy gửi một mảnh cho máy bên phải; máy nhận <b>cộng</b> vào mảnh cùng số của mình. Sau $n - 1$ bước, mỗi mảnh đã đi qua đủ $n$ máy, nên mỗi máy giữ tổng đầy đủ của đúng một mảnh. Đã gửi: $(n - 1) \cdot \frac{D}{n}$.</p>
        focus: [1, 2, 2, 2, 2]
        say: "Bước một là cắt mảnh. Ta cắt vector của mỗi máy thành n mảnh, mỗi mảnh D chia n, vì muốn n máy cùng làm việc trên n phần khác nhau. Bước hai là rút gọn phân tán, gồm n trừ 1 bước. Mỗi bước, mỗi máy gửi một mảnh cho máy bên phải, và máy nhận cộng vào mảnh cùng số của mình. Sau n trừ 1 bước, mỗi mảnh đã đi qua đủ n máy, nên mỗi máy giữ tổng đầy đủ của đúng một mảnh, và mỗi máy đã gửi n trừ 1 nhân D chia n."
      - show: |
          <p><b>Bước 3 — gom lại, thêm $n - 1$ bước.</b> Mỗi máy chuyền mảnh đầy đủ vòng quanh; máy nhận <b>thay</b> mảnh cũ bằng mảnh mới. Lại gửi $(n - 1) \cdot \frac{D}{n}$.</p>
          <p><b>Bước 4 — cộng hai pha.</b></p>
          $$\text{mỗi máy gửi} = \hlg{2 \cdot \frac{n - 1}{n} \cdot D}, \text{ qua } 2(n - 1) \text{ bước}$$
          <p class="note">Làm thử $n = 4$, $D = 8$ số: $2 \cdot \frac{3}{4} \cdot 8 = 12$ số — máy chạy thử đếm đúng 12 cho mỗi máy ✓.</p>
        focus: [1, 1, 2, 3, 4]
        say: "Bước ba là gom lại, thêm n trừ 1 bước. Mỗi máy chuyền mảnh đầy đủ vòng quanh, và máy nhận thay mảnh cũ bằng mảnh mới, nên lại gửi n trừ 1 nhân D chia n. Bước bốn, cộng hai pha lại. Mỗi máy gửi 2 nhân n trừ 1 chia n nhân D, qua 2 nhân n trừ 1 bước. Làm thử với 4 máy, mỗi máy 8 số, ta được 2 nhân 3 phần 4 nhân 8 bằng 12 số, và máy chạy thử đếm đúng 12 cho mỗi máy."
      - clear: true
        show: |
          <table class="t"><tr><th>số máy $n$</th><th>2</th><th>8</th><th>64</th><th>1024</th></tr>
          <tr><td>$2 \cdot \frac{n - 1}{n}$</td><td>1</td><td>1,75</td><td>1,969</td><td>1,998</td></tr></table>
          <div class="box key">Phân số $\frac{n - 1}{n}$ luôn nhỏ hơn 1, nên mỗi máy gửi <b>chưa tới 2D</b> dù có bao nhiêu máy. Bài báo năm 2009 của hai tác giả Patarasuk và Yuan chứng minh đây là mức <b>ít nhất có thể</b>: vòng là cách gộp <b>tối ưu băng thông</b>.</div>
        focus: [1, "1.2", 2, 2]
        say: "Bảng cho thấy hệ số 2 nhân n trừ 1 chia n. Với 2 máy là 1, 8 máy là 1 phẩy 75, 64 máy khoảng 1 phẩy 969, nghìn máy gần 2. Vì phân số n trừ 1 chia n luôn nhỏ hơn 1, mỗi máy gửi chưa tới 2 lần D, dù có bao nhiêu máy. Bài báo năm 2009 của hai tác giả chứng minh đây là mức ít nhất có thể, nên vòng là cách gộp tối ưu băng thông."

