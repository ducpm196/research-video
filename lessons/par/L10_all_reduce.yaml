          <br><span class="note">64 máy, gói 1 MB, trễ 0,05 ms mỗi bước (minh hoạ): 126 bước nhân 0,05 ms = 6,3 ms trễ, so với 0,197 ms chuyển dữ liệu. Bài báo năm 2009 ghi: vòng chỉ tối ưu về băng thông, không về số lượt.</span></div>
        focus: [1, 1, 2, 2, 2, 2]
        say: "Lỗi thứ nhất là nghĩ thêm máy thì vòng chậm theo. Từ 8 lên 64 máy, lượng gửi mỗi máy chỉ tăng từ 1 phẩy 75 lên khoảng 1 phẩy 97 GB, cái tăng là số bước, từ 14 lên 126. Lỗi thứ hai là gộp từng gói nhỏ một. Lấy 64 máy, gói 1 MB và độ trễ 0 phẩy 05 mi li giây mỗi bước. Khi đó 126 bước tốn 6 phẩy 3 mi li giây chỉ cho trễ, trong khi chuyển dữ liệu chỉ mất 0 phẩy 197. Bài báo năm 2009 ghi rõ vòng chỉ tối ưu về băng thông, không tối ưu về số lượt."
      - clear: true
        show: |
