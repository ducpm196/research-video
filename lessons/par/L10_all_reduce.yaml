    title: "Tự kiểm: chạy tay vòng 3 máy, từng bước"
    checks:
      - "[[m[0][0], m[1][0], m[2][0]] for m in alg.par_ring_trace([[1, 2, 3], [10, 20, 30], [100, 200, 300]])[1]] == [[1, 222, 303], [11, 20, 333], [111, 220, 300]]"
      - "all(m == [[111], [222], [333]] for m in alg.par_ring_trace([[1, 2, 3], [10, 20, 30], [100, 200, 300]])[3]) and [1 + 10 + 100, 2 + 20 + 200, 3 + 30 + 300] == [111, 222, 333]"
