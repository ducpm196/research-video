scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Thêm thẻ, mà nửa thời gian chỉ để chờ cộng gradient"
    checks:
      - "alg.par_ps_time(8, 1, 10) == 1.6 and round(alg.par_ring_time(8, 1, 10), 3) == 0.175"
    steps:
      - show: |
          <p>Huấn luyện trên 8 thẻ, mỗi bước mỗi thẻ có <b>1 GB gradient</b> phải cộng với 7 thẻ kia (số minh hoạ). Gửi hết về một máy trung tâm qua đường 10 GB/s: riêng việc nhận rồi gửi lại đã mất <b>1,6 giây</b> mỗi bước.</p>
          <p>Năm 2018, một đội lớn ghi lại: với cách gom về máy chủ tham số chuẩn, ở 128 thẻ họ “mất khoảng một nửa tài nguyên” vì truyền thông.</p>
          <div class="box key">Hôm nay ta trả lời: làm sao mọi máy cùng có tổng mà không dồn vào một chỗ? Mỗi máy phải gửi bao nhiêu? Và khi nào cách đó lại thua?</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, ta huấn luyện trên 8 thẻ, và mỗi bước mỗi thẻ có 1 GB gradient phải cộng với 7 thẻ kia, đây là số minh hoạ. Nếu gửi hết về một máy trung tâm qua đường 10 GB mỗi giây, riêng việc nhận rồi gửi lại đã mất 1 phẩy 6 giây mỗi bước. Năm 2018, một đội lớn ghi lại rằng với cách gom về máy chủ tham số chuẩn, ở 128 thẻ họ mất khoảng một nửa tài nguyên vì truyền thông. Hôm nay ta trả lời ba câu hỏi, làm sao mọi máy cùng có tổng mà không dồn vào một chỗ, mỗi máy phải gửi bao nhiêu, và khi nào cách đó lại thua."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều sẽ dùng"
    checks:
      - "1 / 10 == 0.1 and 0.1 + 0.001 == 0.101"
      - "round((1.01 - 3) ** 2, 4) == 3.9601 and (1 - 3) ** 2 == 4 and round((3.9601 - 4) / 0.01, 2) == -3.99"
      - "(1 + 3 + 5 + 7) / 4 == 4"
      - "alg.Fraction(7, 8) * 2 == alg.Fraction(7, 4)"
    steps:
      - show: |
          <p><b>① Thời gian gửi.</b> Gửi dữ liệu qua mạng tốn hai phần: <b>độ trễ</b> — thời gian chờ để gói đầu tiên tới nơi, dù gói nhỏ đến đâu — và thời gian đẩy dữ liệu = dung lượng chia <b>thông lượng</b> (số byte đường truyền chở được mỗi giây).</p>
          $$\text{thời gian gửi} = \text{độ trễ} + \frac{\text{dung lượng}}{\text{thông lượng}}$$
          <p class="note">Làm thử: gửi 1 GB qua đường 10 GB mỗi giây, độ trễ 1 mi li giây: $\frac{1}{10} + 0{,}001 = 0{,}101$ giây.</p>
        focus: [1, 1, 2, 3]
        say: "Điều thứ nhất, trước hết ta cần hiểu gửi dữ liệu qua mạng tốn hai phần thời gian. Phần thứ nhất là độ trễ, tức thời gian chờ để gói đầu tiên tới nơi, dù gói nhỏ đến đâu. Phần thứ hai là dung lượng chia thông lượng, với thông lượng là số byte đường truyền chở được mỗi giây. Gửi 1 GB qua đường 10 GB mỗi giây với độ trễ 1 mi li giây mất 0 phẩy 1 cộng 0 phẩy 001, bằng 0 phẩy 101 giây."
      - clear: true
        show: |
          <p><b>② Gradient.</b> Một mô hình học máy chứa rất nhiều con số gọi là <b>trọng số</b>; <b>mất mát</b> là một con số đo mô hình đoán sai bao nhiêu. <b>Gradient</b> là vector ghi, cho từng trọng số, mất mát đổi nhanh thế nào khi trọng số tăng một chút; huấn luyện sửa trọng số theo chiều ngược lại.</p>
          <p class="note">Làm thử, một trọng số, mất mát $(w - 3)^2$: tăng $w$ từ 1 lên 1,01 thì mất mát đi từ 4 xuống 3,9601; độ dốc $\frac{3{,}9601 - 4}{0{,}01} \approx -4$ — âm, nên phải <b>tăng</b> $w$.</p>
          <p>Huấn luyện <b>song song dữ liệu</b>: mỗi thẻ tính gradient trên phần dữ liệu riêng, rồi lấy trung bình. Bốn thẻ có 1, 3, 5, 7: trung bình $\frac{1 + 3 + 5 + 7}{4} = 4$.</p>
        focus: [1, 1, 1, 2, 2, 3, 3]
        say: "Điều thứ hai là gradient, và ta cần hiểu ba từ trước đã. Một mô hình học máy chứa rất nhiều con số gọi là trọng số, còn mất mát là một con số đo mô hình đoán sai bao nhiêu. Gradient là vector ghi, cho từng trọng số, mất mát đổi nhanh thế nào khi trọng số tăng một chút, và huấn luyện sửa trọng số theo chiều ngược lại. Làm thử với một trọng số và mất mát bằng w trừ 3 bình phương, tăng w từ 1 lên 1 phẩy 01 thì mất mát đi từ 4 xuống 3 phẩy 9601. Độ dốc khoảng âm 4, mất mát giảm khi w tăng, nên phải tăng w. Khi huấn luyện song song dữ liệu, mỗi thẻ tính gradient trên phần dữ liệu riêng, rồi lấy trung bình. Bốn thẻ có 1, 3, 5, 7 thì trung bình bằng 16 chia 4, bằng 4."
      - show: |
          <p><b>③ Bài 2, cộng theo cây:</b> cộng nhiều số thì có thể cộng từng cặp song song, mỗi tầng số giá trị giảm một nửa. Ở đây phép cộng là cộng <b>từng phần tử</b> của các vector gradient.</p>
          <p>Dấu chấm giữa dòng là phép nhân: $2 \cdot \frac{7}{8} = \frac{7}{4} = 1{,}75$.</p>
        introduces: [cdot]
        focus: [1, 1, 2]
        say: "Điều thứ ba, ở bài 2, ta cộng nhiều số theo cây, cộng từng cặp song song, mỗi tầng số giá trị giảm một nửa. Ở bài này phép cộng là cộng từng phần tử của các vector gradient. Và dấu chấm giữa dòng là phép nhân, 2 nhân 7 phần 8 bằng 7 phần 4, tức 1 phẩy 75."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: n, D, mảnh, và ba phép tập thể"
    steps:
      - show: |
          <table class="t"><tr><th>tên</th><th>lời đọc</th><th>nghĩa</th></tr>
          <tr><td>$n$, $D$</td><td>số máy, dung lượng</td><td>$n$ máy, mỗi máy giữ một vector gradient $D$ byte</td></tr>
          <tr><td>mảnh</td><td>mảnh</td><td>cắt vector thành $n$ phần bằng nhau, mỗi phần $\frac{D}{n}$</td></tr>
          <tr><td>all-reduce</td><td><b>gộp toàn phần</b></td><td>xong thì MỌI máy có tổng của mọi máy</td></tr>
          <tr><td>reduce-scatter</td><td><b>rút gọn phân tán</b></td><td>xong thì mỗi máy có tổng đầy đủ của MỘT mảnh</td></tr>
          <tr><td>all-gather</td><td><b>gom lại</b></td><td>mỗi máy chuyền mảnh đầy đủ của mình cho mọi máy khác</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng các tên sau, tên tiếng Anh chỉ ghi trên màn hình. Có n máy, mỗi máy giữ một vector gradient D byte. Ta cắt vector thành n mảnh bằng nhau, mỗi mảnh D chia n. Gộp toàn phần nghĩa là xong việc thì mọi máy có tổng của mọi máy. Rút gọn phân tán nghĩa là xong việc thì mỗi máy có tổng đầy đủ của một mảnh. Gom lại nghĩa là mỗi máy chuyền mảnh đầy đủ của mình cho mọi máy khác."

  # ───────────────────────── 4. HÌNH DUNG ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một ngôi sao với một cổ chai, và một vòng tròn không có cổ chai"
    steps:
      - show: |
          <div><svg width="1600" height="380" viewBox="0 0 1600 380"><defs><marker id="ar10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
          <g font-size="22" text-anchor="middle" fill="#1f2937">
          <rect x="290" y="150" width="170" height="70" rx="10" fill="#fde8e8" stroke="#e11d48" stroke-width="3"/><text x="375" y="180" font-weight="bold">máy chủ</text><text x="375" y="208">tham số</text>
