scenes:
- id: hook
  kind: hook
  title: Bấm “Đặt hàng” một lần, có hai đơn
  checks:
  - alg.api_retry_sim(10000, 0.02) == 10233
  steps:
  - show: '<p>Mạng điện thoại chập chờn. Khách bấm “Đặt hàng”, máy chủ tạo đơn xong nhưng phản hồi <b>bị mất</b> trên đường
      về. Ứng dụng thấy hết giờ, tự gửi lại — và máy chủ tạo đơn <b>thứ hai</b>. Mô phỏng 10 000 lần đặt với 2% phản hồi bị
      mất: 10 233 đơn.</p>

      <div class="box key">Hôm nay: <b>thiết kế API</b> — tài nguyên, phương thức, mã trạng thái, và <b>lũy đẳng</b> để gửi
      lại không gây hại.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, mạng điện thoại chập chờn. Khách bấm đặt hàng, máy chủ tạo đơn xong nhưng phản hồi bị mất trên đường về.
      Ứng dụng thấy hết giờ và tự gửi lại, và máy chủ tạo đơn thứ hai. Mô phỏng 10 nghìn lần đặt với 2 phần trăm phản hồi
      bị mất cho 10233 đơn. Hôm nay ta học thiết kế API, với tài nguyên, phương thức, mã trạng thái, và lũy đẳng để gửi lại
      không gây hại. Gửi lại yêu cầu trừ tiền do mạng chập chờn lại làm khách hàng bị trừ tiền hai lần chỉ vì thiết kế giao
      diện lập trình bỏ qua tính lũy đẳng.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: yêu cầu có thể mất, và thế nào là lũy đẳng'
  checks:
  - 100 * 0.02 == 2
  - '(lambda f: f(f(f(50))) == 70)(lambda x: 70) and (lambda g: g(g(g(50))) == 80)(lambda x: x + 10)'
  steps:
  - show: '<p>Ở bài 0: mỗi lần gọi API là một <b>vòng khứ hồi</b> — yêu cầu đi tới máy chủ, phản hồi quay về. Trên mạng chập
      chờn, <b>phản hồi có thể mất</b> dù máy chủ đã làm xong việc.</p>

      <p>Mất 2% phản hồi: trong 100 lần gọi, khoảng $100 \cdot 0{,}02 = \hl{2}$ lần ứng dụng không biết kết quả.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Trước hết, nhắc lại bài 0, mỗi lần gọi API là một vòng khứ hồi, yêu cầu đi tới máy chủ rồi phản hồi quay về. Trên
      mạng chập chờn, phản hồi có thể mất dù máy chủ đã làm xong việc. Nếu 2 phần trăm phản hồi bị mất, thì trong 100 lần
      gọi có khoảng 2 lần ứng dụng không biết kết quả, và nó chỉ còn cách gửi lại. Thiết kế hướng tài nguyên tổ chức đường
      dẫn theo danh từ thực thể và phân tách ngữ nghĩa qua phương thức đọc, tạo, thay thế, xoá chuẩn mực.
  - show: '<p><b>Lũy đẳng</b>: làm 1 lần hay nhiều lần cho cùng kết quả. Độ sáng màn hình đang 50:</p>

      <table class="t"><tr><th>thao tác, làm 3 lần</th><th>kết quả</th><th>lũy đẳng?</th></tr>

      <tr><td>“đặt độ sáng = 70”</td><td>70, 70, 70 → 70</td><td>có</td></tr>

      <tr><td>“tăng độ sáng thêm 10”</td><td>60, 70, 80 → $\hl{80}$</td><td>không</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    say: Điều thứ hai là khái niệm lũy đẳng, làm một lần hay nhiều lần đều cho cùng kết quả. Bảng xét độ sáng màn hình đang
      ở mức 50, và mỗi thao tác được làm 3 lần. Thao tác đặt độ sáng bằng 70 cho 70, 70, 70, cuối cùng vẫn là 70, nên nó lũy
      đẳng. Thao tác tăng độ sáng thêm 10 cho 60, 70, rồi 80, khác hẳn làm một lần, nên nó không lũy đẳng. Mã trạng thái phản
      hồi chuẩn phân rạch rõ ba nhóm hai trăm thành công, bốn trăm lỗi từ phía gọi và năm trăm sự cố nội bộ máy chủ.
- id: sym
  kind: symbol
  title: 'Giải mã: phương thức và mã trạng thái'
  checks:
  - '[m for m in (''GET'', ''PUT'', ''DELETE'', ''POST'') if alg.HTTP_METHODS[m][0]] == [''GET''] and [m for m in (''GET'',
    ''PUT'', ''DELETE'', ''POST'') if alg.HTTP_METHODS[m][1]] == [''GET'', ''PUT'', ''DELETE'']'
  steps:
  - show: '<p><b>Tài nguyên</b>: thứ mà API cho đọc và sửa, gọi tên bằng một đường dẫn — <code>/don/42</code> là đơn hàng
      số 42, <code>/don</code> là tập mọi đơn.</p>

      <table class="t"><tr><th>phương thức</th><th>ý nghĩa</th><th>an toàn</th><th>lũy đẳng</th></tr>

      <tr><td><code>GET /don/42</code></td><td>đọc</td><td>có</td><td>có</td></tr>

      <tr><td><code>PUT /don/42</code></td><td>đặt toàn bộ trạng thái</td><td>không</td><td>có</td></tr>

      <tr><td><code>DELETE /don/42</code></td><td>xoá</td><td>không</td><td>có</td></tr>

      <tr><td><code>POST /don</code></td><td>tạo mới</td><td>không</td><td><b>không</b></td></tr></table>

      <p>Mã trạng thái: <b>2xx</b> thành công (200, 201 đã tạo, 204 không có thân); <b>4xx</b> lỗi phía khách (400 sai dữ
      liệu, 401 chưa xác thực, 403 không có quyền, 404 không có, 409 xung đột, 429 quá nhiều); <b>5xx</b> lỗi phía máy chủ.</p>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - 3
    - 3
    - 3
    say: Tài nguyên là thứ mà API cho đọc và sửa, được gọi tên bằng một đường dẫn, ví dụ đơn hàng số 42, hay tập mọi đơn hàng.
      Bảng có bốn phương thức trên tài nguyên đơn hàng. GET đọc đơn 42, an toàn và lũy đẳng. Phương thức đặt, đặt toàn bộ
      trạng thái của đơn 42, không an toàn nhưng lũy đẳng. Phương thức xoá, xoá đơn 42, không an toàn nhưng lũy đẳng. POST
      tạo một đơn mới, không an toàn và không lũy đẳng. Mã trạng thái nhóm 200 là thành công, còn nhóm 500 là lỗi phía máy
      chủ. Nhóm 400 là lỗi phía khách, như sai dữ liệu, chưa xác thực, không có quyền, không có, xung đột, hay gửi quá nhiều.
      Thao tác lũy đẳng cho phép phía gọi mạnh dạn thử lại khi rớt mạng mà trạng thái hệ thống cuối cùng vẫn chỉ ghi nhận
      đúng một tác động.
