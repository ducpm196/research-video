      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình bên trái là chuyện ở đầu bài, ứng dụng gửi lần một, máy chủ tạo đơn 1, nhưng phản hồi bị mất trên đường về.
      Ứng dụng không biết đơn đã được tạo, nên gửi lại, và máy chủ ngây thơ tạo thêm đơn 2. Hình bên phải thêm một khoá K
      đi kèm yêu cầu, máy chủ tạo đơn 1 và ghi nhớ khoá K. Lần gửi lại mang cùng khoá K, máy chủ nhận ra và trả lại đơn 1,
      nên chỉ có một đơn. Bấm nút gọi thang máy tầng năm mười lần chỉ tạo ra một lần dừng ở tầng năm là lũy đẳng, còn bấm
      gửi tin nhắn trừ tiền hai lần thành hai giao dịch là không lũy đẳng.
- id: example
  kind: example
  title: Gửi lại có và không có khoá lũy đẳng
  checks:
  - alg.api_retry_sim(10000, 0.02) == 10233 and alg.api_retry_sim(10000, 0.02, True) == 10000 and round(10000 / 0.98) == 10204
  steps:
  - show: '<p><b>Bước một — một lần đặt, không khoá</b>: đếm số lần gửi.</p>

      <table class="t"><tr><th>lượt</th><th>máy chủ</th><th>phản hồi</th></tr>

      <tr><td>gửi lần 1</td><td>tạo đơn 1</td><td>mất (xác suất 2%)</td></tr>

      <tr><td>gửi lần 2</td><td>tạo đơn 2</td><td>tới nơi</td></tr></table>

      <p>Không khoá thì <b>mỗi lần gửi = một đơn</b>.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 3
    say: Bước một, xét một lần đặt không có khoá, và đếm số lần gửi. Gửi lần một, máy chủ tạo đơn 1, nhưng phản hồi bị mất
      với xác suất 2 phần trăm. Gửi lần hai, máy chủ tạo đơn 2, lần này phản hồi tới nơi. Vậy khi không có khoá, mỗi lần gửi
      là một đơn.
  - show: '<p><b>Bước 2 — kỳ vọng số lần gửi</b>: mỗi lần gửi thành công với xác suất 0,98, trung bình cần $\frac{1}{0{,}98}
      \approx 1{,}0204$ lần.</p>

      <p>10 000 lần đặt → khoảng $\frac{10\,000}{0{,}98} \approx 10\,204$ đơn; mô phỏng ra 10 233.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước hai, tính kỳ vọng số lần gửi. Mỗi lần gửi nhận được phản hồi với xác suất 0 phẩy 98, nên trung bình cần 1 chia
      0 phẩy 98, khoảng 1 phẩy 0204 lần gửi cho mỗi lần đặt. Với 10 nghìn lần đặt, kỳ vọng khoảng 10 nghìn chia 0 phẩy 98,
      tức khoảng 10204 đơn, còn mô phỏng cho 10233 đơn, lệch một chút vì ngẫu nhiên.
  - clear: true
    show: '<p><b>Bước 3 — thêm khoá lũy đẳng</b>: ứng dụng tạo khoá <b>một lần</b> lúc bấm, gửi kèm mọi lần gửi lại.</p>

      <div class="code"><div>POST /don</div><div>Idempotency-Key: "7f3c…"   (mã ngẫu nhiên do ứng dụng tạo cho MỖI lần đặt)</div><div>{
      "san_pham": 9, "so_luong": 2 }</div></div>

      <table class="t"><tr><th>máy chủ nhận</th><th>tra bảng khoá</th><th>làm gì</th></tr>

      <tr><td>lần 1, khoá 7f3c</td><td>chưa có</td><td>tạo đơn 1, lưu khoá → đơn 1</td></tr>

      <tr><td>lần 2, khoá 7f3c</td><td>đã có</td><td>trả lại đơn 1, không tạo mới</td></tr></table>

      '
    focus:
    - 1
    - 2
    - 3
    - '3.2'
    - '3.3'
    say: Bước ba, thêm khoá lũy đẳng, ứng dụng tạo khoá một lần ngay lúc khách bấm, rồi gửi kèm mọi lần gửi lại. Yêu cầu tạo
      đơn kèm một khoá lũy đẳng, là mã ngẫu nhiên do ứng dụng tạo cho mỗi lần đặt. Máy chủ có một bảng khoá đã gặp. Lần một,
      khoá chưa có trong bảng, nên máy chủ tạo đơn 1 và lưu khoá trỏ tới đơn 1. Lần hai mang cùng khoá, tra thấy đã có, nên
      máy chủ trả lại đơn 1 mà không tạo mới.
  - clear: true
    show: '<table class="t"><tr><th>10 000 lần đặt, 2% phản hồi mất, tự gửi lại</th><th>số đơn tạo ra</th></tr>

      <tr><td>không có khoá</td><td>10 233 (kỳ vọng $\frac{10\,000}{0{,}98} \approx 10\,204$)</td></tr>

      <tr><td>có khoá: máy chủ nhớ khoá, trả lại kết quả cũ</td><td>$\hl{10\,000}$</td></tr></table>

      <p><b>Bước 4</b>: bớt được $10\,233 - 10\,000 = 233$ đơn thừa. Khoá biến một thao tác <b>không lũy đẳng</b> thành lũy
      đẳng: gửi lại bao nhiêu lần cũng chỉ một đơn.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    say: Bước bốn, chạy lại mô phỏng cho cả 10 nghìn lần đặt. Không có khoá thì tạo ra 10233 đơn, gần với kỳ vọng 10 nghìn
      chia 0 phẩy 98, khoảng 10204. Có khoá, máy chủ nhớ khoá và trả lại kết quả cũ, nên chỉ có đúng 10 nghìn đơn. Như vậy
      ta bớt được 10233 trừ 10 nghìn, bằng 233 đơn thừa. Khoá biến một thao tác không lũy đẳng thành lũy đẳng, gửi lại bao
      nhiêu lần cũng chỉ một đơn.
- id: check
  kind: check
  title: 'Tự kiểm: đếm lần gửi, và để cơ sở dữ liệu chặn trùng'
  checks:
  - '(lambda r: sum(1 + next(k for k in __import__(''itertools'').count() if r.random() >= 0.02) for i in range(10000)))(__import__(''random'').Random(1))
    == 10233 == alg.api_retry_sim(10000, 0.02)'
  - '(lambda cn: (cn.execute(''CREATE TABLE don(khoa TEXT UNIQUE)''), [cn.execute(''INSERT OR IGNORE INTO don VALUES (?)'',
    (''k%d'' % i,)) for i in range(10000) for _ in range(2)], cn.execute(''SELECT COUNT(*) FROM don'').fetchone()[0])[2])(__import__(''sqlite3'').connect('':memory:''))
    == 10000 and 2 * 10000 == 20000'
  steps:
  - show: '<table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>đếm thẳng tổng số lần gửi (cùng dãy ngẫu nhiên)</td><td>10 233 lần gửi = 10 233 đơn khi không khoá ✓</td></tr>

      <tr><td>cơ sở dữ liệu thật, cột khoá không cho trùng; gửi <b>mỗi</b> khoá 2 lần: 20 000 lần ghi</td><td>còn đúng $\hl{10\,000}$
      dòng ✓</td></tr></table>

      <p class="note"><b>Chọn mã trạng thái đúng:</b> tạo mới thành công trả <code>201</code>, dữ liệu sai trả <code>400</code>
      hoặc <code>422</code>, trùng khoá trả lại kết quả cũ, khác nội dung cùng khoá trả <code>409</code>, quá giới hạn trả
      <code>429</code>.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    - '2'
    say: Kiểm bằng đường khác, ta không dùng hàm mô phỏng mà đếm thẳng. Với cùng dãy số ngẫu nhiên, tổng số lần gửi là 10233,
      đúng bằng số đơn khi không có khoá, vì mỗi lần gửi là một đơn. Rồi ta dùng một cơ sở dữ liệu thật, có cột khoá được
      khai báo không cho trùng. Ta cố tình gửi mỗi khoá hai lần, tổng 20 nghìn lần ghi, nhưng bảng vẫn chỉ còn đúng 10 nghìn
      dòng. Dùng đúng mã trạng thái chuẩn giúp phía gọi phân biệt chính xác lỗi dữ liệu với lỗi hệ thống. Về mã trạng thái,
      tạo mới thành công trả hai trăm linh một, khác nội dung cùng khoá trả bốn trăm linh chín và quá giới hạn trả bốn trăm
      hai chín.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi thường gặp
  checks:
  - alg.api_retry_sim(10000, 0.02, True) == 10000 and alg.api_retry_sim(10000, 0.02) == 10233
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Trả 200 kèm “lỗi” trong thân <b class="red">(bộ nhớ đệm, thử lại, giám sát
      đều hiểu sai)</b>

      <br><span class="note">Bộ nhớ đệm lưu phản hồi lỗi như phản hồi đúng; bộ thử lại không biết phải thử; biểu đồ tỉ lệ
      lỗi báo 0%. Dùng đúng mã 4xx, 5xx.</span></div>

      '
    say: Lỗi thứ nhất, trả mã 200 kèm chữ lỗi trong thân, nên bộ nhớ đệm, bộ thử lại và hệ giám sát đều hiểu sai. Bộ nhớ đệm
      lưu phản hồi lỗi như phản hồi đúng, bộ thử lại không biết phải thử, và biểu đồ tỉ lệ lỗi báo 0 phần trăm. Hãy dùng đúng
      mã nhóm 400 và nhóm 500. Dùng phương thức đọc dữ liệu an toàn để thực hiện thao tác thay đổi trạng thái như xoá hoặc
      duyệt đơn hàng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng GET để thay đổi dữ liệu <b class="red">(máy đi trước tự bấm)</b>

      <br><span class="note"><code>GET /xoa?id=42</code>: trình duyệt tải trước liên kết, công cụ quét tự đi theo liên kết,
      và máy trung gian (đứng giữa trình duyệt và máy chủ) được phép tự gửi lại GET bất cứ lúc nào. Thay đổi phải dùng phương
      thức không an toàn.</span></div>

      '
    say: Lỗi thứ hai, dùng GET để thay đổi dữ liệu, nên máy đi trước tự bấm thay người. Trình duyệt tải trước liên kết, công
      cụ quét tự đi theo liên kết, và máy trung gian đứng giữa trình duyệt với máy chủ được phép tự gửi lại GET bất cứ lúc
      nào. Thay đổi phải dùng một phương thức không an toàn. Trả luôn mã hai trăm thành công cho mọi phản hồi kể cả khi dữ
      liệu đầu vào lỗi rồi nhét chữ lỗi vào thân dữ liệu.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Lẫn 401 với 403 <b class="red">(ứng dụng xử lý sai)</b>

      <br><span class="note">401: chưa biết bạn là ai — đăng nhập lại. 403: biết bạn là ai nhưng không có quyền — đăng nhập
      lại bằng cùng tài khoản cũng vô ích.</span></div>

      '
    say: Lỗi thứ ba, lẫn mã 401 với mã 403, nên ứng dụng xử lý sai. Mã 401 nghĩa là chưa biết bạn là ai, cần đăng nhập lại.
      Mã 403 nghĩa là biết bạn là ai nhưng không có quyền, nên đăng nhập lại bằng cùng tài khoản cũng vô ích. Quên gắn khoá
      chống lặp do phía khách sinh cho yêu cầu tạo giao dịch thanh toán khiến thử lại mạng tạo trùng đơn.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Tạo khoá lũy đẳng mới cho mỗi lần <b>gửi lại</b> <b class="red">(người đã đi
      làm hay mắc)</b>

      <br><span class="note">Đã có khoá, nhưng mã tạo khoá nằm trong vòng lặp gửi lại: mỗi lần gửi mang một khoá khác, máy
      chủ coi là đơn mới. Khoá phải gắn với <b>ý định đặt hàng</b>, tạo một lần lúc bấm.</span></div>

      <table class="t"><tr><th>khoá tạo ở đâu (10 000 lần đặt)</th><th>số đơn</th></tr>

      <tr><td>một lần lúc bấm, dùng lại khi gửi lại</td><td>10 000</td></tr>

      <tr><td>mới cho mỗi lần gửi</td><td>$\hl{10\,233}$ — như không có khoá</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, tạo khoá lũy đẳng mới cho mỗi lần gửi lại. Hệ thống đã có khoá, nhưng đoạn
      mã tạo khoá lại nằm trong vòng lặp gửi lại, nên mỗi lần gửi mang một khoá khác và máy chủ coi là một đơn mới. Khoá phải
      gắn với ý định đặt hàng, được tạo đúng một lần lúc khách bấm. Bảng so hai cách đặt chỗ tạo khoá, với 10 nghìn lần đặt.
      Tạo một lần lúc bấm thì có đúng 10 nghìn đơn. Tạo mới cho mỗi lần gửi thì ra 10233 đơn, y như không có khoá. Trộn lẫn
      các tham số truy vấn tuỳ tiện gây rò rỉ thông tin nhạy cảm vào lịch sử đường dẫn và nhật ký trung gian.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.HTTP_METHODS['PUT'][1] and not alg.HTTP_METHODS['POST'][1]
  - round(50000 / 0.98) == 51020 and 51020 - 50000 == 1020
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Huỷ đơn bằng <code>PUT /don/42/trang_thai</code> với thân <code>"da_huy"</code>, gửi hai lần. Kết
      quả có khác gửi một lần không? Còn <code>POST /thanh_toan</code> gửi hai lần?</td></tr>

      <tr><td>2</td><td>Người dùng đã đăng nhập xem đơn của <b>người khác</b>. Máy chủ trả mã nào?</td></tr>

      <tr><td>3</td><td>Quyết định (số minh hoạ): 50 000 lần thanh toán mỗi ngày, 2% phản hồi mất, tự gửi lại, chưa có khoá.
      Khoảng bao nhiêu lần trừ tiền thừa mỗi ngày? Có cần khoá không?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, huỷ đơn bằng phương thức đặt trạng thái của đơn 42 thành đã huỷ, gửi hai lần,
      kết quả có khác gửi một lần không? Còn POST thanh toán gửi hai lần thì sao? Câu hai, người dùng đã đăng nhập xem đơn
      của người khác, máy chủ trả mã nào? Câu ba là một quyết định với số minh hoạ, mỗi ngày có 50 nghìn lần thanh toán, 2
      phần trăm phản hồi bị mất, ứng dụng tự gửi lại và chưa có khoá. Khoảng bao nhiêu lần trừ tiền thừa mỗi ngày, và có cần
      khoá không? Dừng video và làm ra giấy. Chọn cặp phương thức và mã trạng thái đúng cho tình huống tạo mới tài nguyên,
      xung đột phiên bản và thiếu quyền.
    pause: 15
  - clear: true
    show: '<table class="t"><tr><th>gửi hai lần</th><th>trạng thái sau lần 1</th><th>sau lần 2</th></tr>

      <tr><td>đặt trạng thái = đã huỷ</td><td>đã huỷ</td><td>đã huỷ — <b>không khác</b></td></tr>

      <tr><td>POST thanh toán</td><td>trừ tiền 1 lần</td><td>trừ tiền <b>2 lần</b></td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    say: Đáp án câu một, so trạng thái sau từng lần gửi. Phương thức đặt cho kết quả không khác, vì lần hai đặt lại đúng trạng
      thái đó, tức lũy đẳng. Còn POST thanh toán có thể trừ tiền hai lần, nên cần khoá lũy đẳng. Đây giống thao tác tăng độ
      sáng thêm 10 ở phần chuẩn bị, mỗi lần làm lại cộng thêm một lần. Giải thích cơ chế lưu trữ khoá lũy đẳng kết hợp giao
      dịch cơ sở dữ liệu ngăn trừ tiền kép.
  - show: '<p>② <b>403</b> (đã biết là ai, không có quyền) — hoặc 404 nếu không muốn lộ đơn đó có tồn tại.</p>

      <p>③ $\frac{50\,000}{0{,}98} \approx 51\,020$ lần gửi → khoảng $51\,020 - 50\,000 = \hl{1020}$ lần trừ tiền thừa mỗi
      ngày → <b>cần khoá</b>.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Câu hai, trả mã 403 vì đã biết là ai mà không có quyền, hoặc 404 nếu không muốn lộ rằng đơn đó có tồn tại. Câu ba,
      số lần gửi khoảng 50 nghìn chia 0 phẩy 98, tức khoảng 51020 lần, nên có khoảng 51020 trừ 50 nghìn, bằng 1020 lần trừ
      tiền thừa mỗi ngày. Khoảng một nghìn khách bị trừ tiền thừa mỗi ngày là quá nhiều, nên chắc chắn cần khoá lũy đẳng.
      Nhận diện phương thức nào vốn dĩ an toàn, phương thức nào lũy đẳng và phương thức nào đòi hỏi khoá bảo vệ.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/WEB/L06
  steps:
  - show: <table class='t'><tr><th>Thực hành WEB:L06</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Dùng
      khoá lũy đẳng cho thao tác tạo mới</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>bal=250 keys=k1:100,k1:100</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh WEB L06 duong_dan/bai_cua_ban.js</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 6 với dữ liệu đọc động. Đọc kỹ số dư ban đầu và chuỗi cặp khoá lũy đẳng kèm số tiền rồi
      chạy lệnh tự chấm cùng hai ca kiểm ẩn. Xuất đặc tính an toàn và lũy đẳng của hai phương thức đọc và ghi đè theo chuẩn
      giao thức web. Lưu tập hợp các khoá tạo mới đã xử lý để bảo đảm yêu cầu lặp lại cùng khoá không trừ tiền lần thứ hai.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai WEB:L06</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (bảng RFC HTTP)</b></td><td>Đọc tính chất an toàn và lũy đẳng chuẩn của GET và PUT</td></tr><tr><td><b>Bước 2 (lưu tập
      khoá đã chạy)</b></td><td>Dùng Set lưu khoá Idempotency đã xử lý từ đầu vào</td></tr><tr><td><b>Bước 3 (chỉ trừ một
      lần)</b></td><td>Bỏ qua giao dịch lặp khoá rồi in số dư cuối cùng</td></tr></table>
    say: Gợi ý cài đặt bài số 6 chia thành ba bước rõ ràng. Đầu tiên ghi nhận đặc tính an toàn và lũy đẳng chuẩn của hai phương
      thức đọc và đặt lại. Cuối cùng dùng tập hợp lọc trùng khoá chống lặp khi trừ tiền và in đủ ba dòng khớp mẫu.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>get_safe_idem=1,1</div><div>put_safe_idem=0,1</div><div>post_with_idem_key_bal=150</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">tài nguyên là danh từ, phương thức là động từ</span><span class="a">→</span>

      <span class="n">an toàn: chỉ đọc; lũy đẳng: lặp lại vô hại</span><span class="a">→</span>

      <span class="n">tạo mới: khoá lũy đẳng</span><span class="a">→</span>

      <span class="n">mã trạng thái đúng cho máy hiểu</span></div>

      '
    say: Tổng kết lại, tài nguyên là danh từ, phương thức là động từ. An toàn nghĩa là chỉ đọc, lũy đẳng nghĩa là lặp lại
      vô hại, thao tác tạo mới cần khoá lũy đẳng, và mã trạng thái phải đúng để máy hiểu. Danh từ tài nguyên, phương thức
      đúng nghĩa và mã trạng thái trung thực biến giao diện lập trình thành bản quy ước sống dễ tích hợp.
  - show: '<div class="box key"><b>Tư duy:</b> trên mạng, mọi yêu cầu đều <b>có thể đến hai lần</b> — thiết kế sao cho lần
      thứ hai vô hại.</div>

      '
    say: Điều cần mang theo, trên mạng mọi yêu cầu đều có thể đến hai lần, nên hãy thiết kế sao cho lần thứ hai vô hại. Bảo
      đảm tính lũy đẳng bằng khoá định danh giao dịch biến thao tác thử lại khi mạng yếu thành cơ chế an toàn.
  - clear: true
    show: '<p class="note">Bài sau (bài 7): <b>phân trang</b> — độ lệch hay con trỏ.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 7, ta học phân trang, dùng độ lệch hay con trỏ. Hẹn gặp bạn ở bài tiếp theo. Khi tập tài nguyên trả
      về hàng triệu bản ghi, giao diện lập trình phải cắt lát bằng kỹ thuật phân trang hiệu quả.
af2: true
