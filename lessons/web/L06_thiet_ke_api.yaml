  - {sentence: "Lỗi thứ hai, dùng GET để thay đổi dữ liệu, nên máy đi trước tự bấm thay người.", reason: "ASR chép “Lội thứ 2 dùng ghét để thay đổi giữ liệu nên máy đi trước tự bấm thay người.” (0.889): GET đọc “gét” theo lexicon WEB, ASR viết “ghét”; lệch âm/thanh thuần Việt: lỗi/lội — NOT_VERIFIED bằng tai người"}
  - {sentence: "Còn POST thanh toán gửi hai lần thì sao?", reason: "ASR chép “Còn poster thanh toán gửi 2 lần thì sao?” (0.889): POST đọc “pâu-xt” theo lexicon WEB, ASR viết “poster” — NOT_VERIFIED bằng tai người"}
