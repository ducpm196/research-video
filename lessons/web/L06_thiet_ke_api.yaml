id: L06
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 6 — Thiết kế API: tài nguyên, phương thức, mã trạng thái, lũy đẳng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L06; audit/web/verify_web.py L06; RFC 9110 (HTTP Semantics), mục 9.2.1 (an toàn), 9.2.2 (lũy đẳng), 15 (mã trạng thái); bản thảo IETF “The Idempotency-Key HTTP Header Field” (httpapi, bản hiện hành); bài 0"
assumes: [arith, frac, cdot, approx]
# Quy ước: “an toàn” = chỉ đọc, không đổi trạng thái máy chủ; “lũy đẳng” = gửi n lần có cùng tác động như gửi 1 lần (alg.HTTP_METHODS, RFC 9110).
#   Mô phỏng gửi lại khi mất phản hồi: alg.api_retry_sim (phản hồi mất 2% là SỐ MINH HOẠ). Đường dẫn và mã trong <code>.
objectives:
  - "Chọn phương thức theo ngữ nghĩa an toàn và lũy đẳng"
  - "Chọn mã trạng thái đúng"
  - "Dùng khoá lũy đẳng cho thao tác tạo mới"
