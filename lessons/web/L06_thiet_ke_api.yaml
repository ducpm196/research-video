  - {sentence: "POST tạo một đơn mới, không an toàn và không lũy đẳng.", reason: "ASR chép “Poster tạo một đơn mới, không an toàn và không lũy đẳng.” (0.917): POST đọc “pâu-xt” theo lexicon WEB, ASR viết “poster” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Còn POST thanh toán có thể trừ tiền hai lần, nên cần khoá lũy đẳng.", reason: "ASR chép “Còn poster thanh toán có thể trừ tiền hai lần nên cần khóa lũy đẳng.” (0.933): POST đọc “pâu-xt” theo lexicon WEB, ASR viết “poster” — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bấm “Đặt hàng” một lần, có hai đơn"
    checks:
      - "alg.api_retry_sim(10000, 0.02) == 10233"
    steps:
      - show: |
          <p>Mạng điện thoại chập chờn. Khách bấm “Đặt hàng”, máy chủ tạo đơn xong nhưng phản hồi <b>bị mất</b> trên đường về. Ứng dụng thấy hết giờ, tự gửi lại — và máy chủ tạo đơn <b>thứ hai</b>. Mô phỏng 10 000 lần đặt với 2% phản hồi bị mất: 10 233 đơn.</p>
          <div class="box key">Hôm nay: <b>thiết kế API</b> — tài nguyên, phương thức, mã trạng thái, và <b>lũy đẳng</b> để gửi lại không gây hại.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, mạng điện thoại chập chờn. Khách bấm đặt hàng, máy chủ tạo đơn xong nhưng phản hồi bị mất trên đường về. Ứng dụng thấy hết giờ và tự gửi lại, và máy chủ tạo đơn thứ hai. Mô phỏng 10 nghìn lần đặt với 2 phần trăm phản hồi bị mất cho 10233 đơn. Hôm nay ta học thiết kế API, với tài nguyên, phương thức, mã trạng thái, và lũy đẳng để gửi lại không gây hại."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: yêu cầu có thể mất, và thế nào là lũy đẳng"
    checks:
      - "100 * 0.02 == 2"
      - "(lambda f: f(f(f(50))) == 70)(lambda x: 70) and (lambda g: g(g(g(50))) == 80)(lambda x: x + 10)"
    steps:
      - show: |
          <p>Ở bài 0: mỗi lần gọi API là một <b>vòng khứ hồi</b> — yêu cầu đi tới máy chủ, phản hồi quay về. Trên mạng chập chờn, <b>phản hồi có thể mất</b> dù máy chủ đã làm xong việc.</p>
          <p>Mất 2% phản hồi: trong 100 lần gọi, khoảng $100 \cdot 0{,}02 = \hl{2}$ lần ứng dụng không biết kết quả.</p>
        focus: [1, 1, 2]
        say: "Trước hết, nhắc lại bài 0, mỗi lần gọi API là một vòng khứ hồi, yêu cầu đi tới máy chủ rồi phản hồi quay về. Trên mạng chập chờn, phản hồi có thể mất dù máy chủ đã làm xong việc. Nếu 2 phần trăm phản hồi bị mất, thì trong 100 lần gọi có khoảng 2 lần ứng dụng không biết kết quả, và nó chỉ còn cách gửi lại."
      - show: |
          <p><b>Lũy đẳng</b>: làm 1 lần hay nhiều lần cho cùng kết quả. Độ sáng màn hình đang 50:</p>
          <table class="t"><tr><th>thao tác, làm 3 lần</th><th>kết quả</th><th>lũy đẳng?</th></tr>
          <tr><td>“đặt độ sáng = 70”</td><td>70, 70, 70 → 70</td><td>có</td></tr>
          <tr><td>“tăng độ sáng thêm 10”</td><td>60, 70, 80 → $\hl{80}$</td><td>không</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Điều thứ hai là khái niệm lũy đẳng, làm một lần hay nhiều lần đều cho cùng kết quả. Bảng xét độ sáng màn hình đang ở mức 50, và mỗi thao tác được làm 3 lần. Thao tác đặt độ sáng bằng 70 cho 70, 70, 70, cuối cùng vẫn là 70, nên nó lũy đẳng. Thao tác tăng độ sáng thêm 10 cho 60, 70, rồi 80, khác hẳn làm một lần, nên nó không lũy đẳng."

  - id: sym
    kind: symbol
    title: "Giải mã: phương thức và mã trạng thái"
    checks:
      - "[m for m in ('GET', 'PUT', 'DELETE', 'POST') if alg.HTTP_METHODS[m][0]] == ['GET'] and [m for m in ('GET', 'PUT', 'DELETE', 'POST') if alg.HTTP_METHODS[m][1]] == ['GET', 'PUT', 'DELETE']"
    steps:
      - show: |
          <table class="t"><tr><th>phương thức</th><th>ý nghĩa</th><th>an toàn</th><th>lũy đẳng</th></tr>
          <tr><td><code>GET /don/42</code></td><td>đọc</td><td>có</td><td>có</td></tr>
          <tr><td><code>PUT /don/42</code></td><td>đặt toàn bộ trạng thái</td><td>không</td><td>có</td></tr>
          <tr><td><code>DELETE /don/42</code></td><td>xoá</td><td>không</td><td>có</td></tr>
          <tr><td><code>POST /don</code></td><td>tạo mới</td><td>không</td><td><b>không</b></td></tr></table>
          <p>Mã trạng thái: <b>2xx</b> thành công (200, 201 đã tạo, 204 không có thân); <b>4xx</b> lỗi phía khách (400 sai dữ liệu, 401 chưa xác thực, 403 không có quyền, 404 không có, 409 xung đột, 429 quá nhiều); <b>5xx</b> lỗi phía máy chủ.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Bảng có bốn phương thức trên tài nguyên đơn hàng. GET đọc đơn 42, an toàn và lũy đẳng. Phương thức đặt, đặt toàn bộ trạng thái của đơn 42, không an toàn nhưng lũy đẳng. Phương thức xoá, xoá đơn 42, không an toàn nhưng lũy đẳng. POST tạo một đơn mới, không an toàn và không lũy đẳng. Mã trạng thái nhóm 200 là thành công, còn nhóm 500 là lỗi phía máy chủ. Nhóm 400 là lỗi phía khách, như sai dữ liệu, chưa xác thực, không có quyền, không có, xung đột, hay gửi quá nhiều."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Phản hồi mất, ứng dụng gửi lại: máy chủ có nhận ra không?"
    steps:
      - show: |
          <div><svg width="1500" height="490" viewBox="0 0 1500 490"><defs><marker id="arW6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="345" y="38" font-size="26" font-weight="bold" text-anchor="middle" fill="#b91c1c">không có khoá</text><text x="110" y="78" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">ứng dụng</text><line x1="110" y1="92" x2="110" y2="430" stroke="#1f2937" stroke-width="3"/><text x="580" y="78" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">máy chủ</text><line x1="580" y1="92" x2="580" y2="430" stroke="#1f2937" stroke-width="3"/><line x1="110" y1="110" x2="576" y2="160" stroke="#2a78d6" stroke-width="4" marker-end="url(#arW6)"/><text x="325" y="118" font-size="20" text-anchor="middle" fill="#2a78d6">gửi lần 1</text><text x="568" y="196" font-size="20" text-anchor="end" fill="#1f2937">tạo đơn 1</text><line x1="580" y1="210" x2="345" y2="240" stroke="#1f2937" stroke-width="3" stroke-dasharray="10 8"/><g stroke="#b91c1c" stroke-width="5"><line x1="329" y1="224" x2="361" y2="256"/><line x1="329" y1="256" x2="361" y2="224"/></g><text x="315" y="246" font-size="20" text-anchor="end" fill="#b91c1c">phản hồi mất</text><line x1="110" y1="290" x2="576" y2="340" stroke="#d97706" stroke-width="4" marker-end="url(#arW6)"/><text x="325" y="298" font-size="20" text-anchor="middle" fill="#d97706">gửi lại</text><text x="568" y="376" font-size="20" font-weight="bold" text-anchor="end" fill="#b91c1c">tạo đơn 2 (thừa)</text><line x1="580" y1="390" x2="114" y2="425" stroke="#1f2937" stroke-width="3" marker-end="url(#arW6)"/><text x="345" y="468" font-size="22" font-weight="bold" text-anchor="middle" fill="#b91c1c">kết quả: 2 đơn</text><line x1="750" y1="20" x2="750" y2="480" stroke="#d1d5db" stroke-width="2"/><text x="1095" y="38" font-size="26" font-weight="bold" text-anchor="middle" fill="#059669">có khoá K</text><text x="860" y="78" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">ứng dụng</text><line x1="860" y1="92" x2="860" y2="430" stroke="#1f2937" stroke-width="3"/><text x="1330" y="78" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">máy chủ</text><line x1="1330" y1="92" x2="1330" y2="430" stroke="#1f2937" stroke-width="3"/><line x1="860" y1="110" x2="1326" y2="160" stroke="#2a78d6" stroke-width="4" marker-end="url(#arW6)"/><text x="1075" y="118" font-size="20" text-anchor="middle" fill="#2a78d6">gửi lần 1</text><text x="1318" y="196" font-size="20" text-anchor="end" fill="#1f2937">tạo đơn 1, nhớ K</text><line x1="1330" y1="210" x2="1095" y2="240" stroke="#1f2937" stroke-width="3" stroke-dasharray="10 8"/><g stroke="#b91c1c" stroke-width="5"><line x1="1079" y1="224" x2="1111" y2="256"/><line x1="1079" y1="256" x2="1111" y2="224"/></g><text x="1065" y="246" font-size="20" text-anchor="end" fill="#b91c1c">phản hồi mất</text><line x1="860" y1="290" x2="1326" y2="340" stroke="#d97706" stroke-width="4" marker-end="url(#arW6)"/><text x="1075" y="298" font-size="20" text-anchor="middle" fill="#d97706">gửi lại (cùng K)</text><text x="1318" y="376" font-size="20" font-weight="bold" text-anchor="end" fill="#059669">thấy K: trả lại đơn 1</text><line x1="1330" y1="390" x2="864" y2="425" stroke="#1f2937" stroke-width="3" marker-end="url(#arW6)"/><text x="1095" y="468" font-size="22" font-weight="bold" text-anchor="middle" fill="#059669">kết quả: 1 đơn</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình bên trái là chuyện ở đầu bài, ứng dụng gửi lần một, máy chủ tạo đơn 1, nhưng phản hồi bị mất trên đường về. Ứng dụng không biết đơn đã được tạo, nên gửi lại, và máy chủ ngây thơ tạo thêm đơn 2. Hình bên phải thêm một khoá K đi kèm yêu cầu, máy chủ tạo đơn 1 và ghi nhớ khoá K. Lần gửi lại mang cùng khoá K, máy chủ nhận ra và trả lại đơn 1, nên chỉ có một đơn."

  - id: example
    kind: example
    title: "Gửi lại có và không có khoá lũy đẳng"
    checks:
      - "alg.api_retry_sim(10000, 0.02) == 10233 and alg.api_retry_sim(10000, 0.02, True) == 10000 and round(10000 / 0.98) == 10204"
    steps:
      - show: |
          <p><b>Bước một — một lần đặt, không khoá</b>: đếm số lần gửi.</p>
          <table class="t"><tr><th>lượt</th><th>máy chủ</th><th>phản hồi</th></tr>
          <tr><td>gửi lần 1</td><td>tạo đơn 1</td><td>mất (xác suất 2%)</td></tr>
          <tr><td>gửi lần 2</td><td>tạo đơn 2</td><td>tới nơi</td></tr></table>
          <p>Không khoá thì <b>mỗi lần gửi = một đơn</b>.</p>
        focus: [1, "2.2", "2.3", 3]
        say: "Bước một, xét một lần đặt không có khoá, và đếm số lần gửi. Gửi lần một, máy chủ tạo đơn 1, nhưng phản hồi bị mất với xác suất 2 phần trăm. Gửi lần hai, máy chủ tạo đơn 2, lần này phản hồi tới nơi. Vậy khi không có khoá, mỗi lần gửi là một đơn."
      - show: |
          <p><b>Bước 2 — kỳ vọng số lần gửi</b>: mỗi lần gửi thành công với xác suất 0,98, trung bình cần $\frac{1}{0{,}98} \approx 1{,}0204$ lần.</p>
          <p>10 000 lần đặt → khoảng $\frac{10\,000}{0{,}98} \approx 10\,204$ đơn; mô phỏng ra 10 233.</p>
        focus: [1, 1, 2]
        say: "Bước hai, tính kỳ vọng số lần gửi. Mỗi lần gửi nhận được phản hồi với xác suất 0 phẩy 98, nên trung bình cần 1 chia 0 phẩy 98, khoảng 1 phẩy 0204 lần gửi cho mỗi lần đặt. Với 10 nghìn lần đặt, kỳ vọng khoảng 10 nghìn chia 0 phẩy 98, tức khoảng 10204 đơn, còn mô phỏng cho 10233 đơn, lệch một chút vì ngẫu nhiên."
      - clear: true
        show: |
          <p><b>Bước 3 — thêm khoá lũy đẳng</b>: ứng dụng tạo khoá <b>một lần</b> lúc bấm, gửi kèm mọi lần gửi lại.</p>
          <div class="code"><div>POST /don</div><div>Idempotency-Key: 7f3c…   (mã ngẫu nhiên do ứng dụng tạo cho MỖI lần đặt)</div><div>{ "san_pham": 9, "so_luong": 2 }</div></div>
          <table class="t"><tr><th>máy chủ nhận</th><th>tra bảng khoá</th><th>làm gì</th></tr>
          <tr><td>lần 1, khoá 7f3c</td><td>chưa có</td><td>tạo đơn 1, lưu khoá → đơn 1</td></tr>
          <tr><td>lần 2, khoá 7f3c</td><td>đã có</td><td>trả lại đơn 1, không tạo mới</td></tr></table>
        focus: [1, 2, 3, "3.2", "3.3"]
        say: "Bước ba, thêm khoá lũy đẳng, ứng dụng tạo khoá một lần ngay lúc khách bấm, rồi gửi kèm mọi lần gửi lại. Yêu cầu tạo đơn kèm một khoá lũy đẳng, là mã ngẫu nhiên do ứng dụng tạo cho mỗi lần đặt. Máy chủ có một bảng khoá đã gặp. Lần một, khoá chưa có trong bảng, nên máy chủ tạo đơn 1 và lưu khoá trỏ tới đơn 1. Lần hai mang cùng khoá, tra thấy đã có, nên máy chủ trả lại đơn 1 mà không tạo mới."
      - clear: true
        show: |
          <table class="t"><tr><th>10 000 lần đặt, 2% phản hồi mất, tự gửi lại</th><th>số đơn tạo ra</th></tr>
          <tr><td>không có khoá</td><td>10 233 (kỳ vọng $\frac{10\,000}{0{,}98} \approx 10\,204$)</td></tr>
          <tr><td>có khoá: máy chủ nhớ khoá, trả lại kết quả cũ</td><td>$\hl{10\,000}$</td></tr></table>
          <p><b>Bước 4</b>: bớt được $10\,233 - 10\,000 = 233$ đơn thừa. Khoá biến một thao tác <b>không lũy đẳng</b> thành lũy đẳng: gửi lại bao nhiêu lần cũng chỉ một đơn.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Bước bốn, chạy lại mô phỏng cho cả 10 nghìn lần đặt. Không có khoá thì tạo ra 10233 đơn, gần với kỳ vọng 10 nghìn chia 0 phẩy 98, khoảng 10204. Có khoá, máy chủ nhớ khoá và trả lại kết quả cũ, nên chỉ có đúng 10 nghìn đơn. Như vậy ta bớt được 10233 trừ 10 nghìn, bằng 233 đơn thừa. Khoá biến một thao tác không lũy đẳng thành lũy đẳng, gửi lại bao nhiêu lần cũng chỉ một đơn."

  - id: check
    kind: check
    title: "Tự kiểm: đếm lần gửi, và để cơ sở dữ liệu chặn trùng"
    checks:
      - "(lambda r: sum(1 + next(k for k in __import__('itertools').count() if r.random() >= 0.02) for i in range(10000)))(__import__('random').Random(1)) == 10233 == alg.api_retry_sim(10000, 0.02)"
      - "(lambda cn: (cn.execute('CREATE TABLE don(khoa TEXT UNIQUE)'), [cn.execute('INSERT OR IGNORE INTO don VALUES (?)', ('k%d' % i,)) for i in range(10000) for _ in range(2)], cn.execute('SELECT COUNT(*) FROM don').fetchone()[0])[2])(__import__('sqlite3').connect(':memory:')) == 10000 and 2 * 10000 == 20000"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>đếm thẳng tổng số lần gửi (cùng dãy ngẫu nhiên)</td><td>10 233 lần gửi = 10 233 đơn khi không khoá ✓</td></tr>
          <tr><td>cơ sở dữ liệu thật, cột khoá không cho trùng; gửi <b>mỗi</b> khoá 2 lần: 20 000 lần ghi</td><td>còn đúng $\hl{10\,000}$ dòng ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Kiểm bằng đường khác, ta không dùng hàm mô phỏng mà đếm thẳng. Với cùng dãy số ngẫu nhiên, tổng số lần gửi là 10233, đúng bằng số đơn khi không có khoá, vì mỗi lần gửi là một đơn. Rồi ta dùng một cơ sở dữ liệu thật, có cột khoá được khai báo không cho trùng. Ta cố tình gửi mỗi khoá hai lần, tổng 20 nghìn lần ghi, nhưng bảng vẫn chỉ còn đúng 10 nghìn dòng."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thường gặp"
    checks:
      - "alg.api_retry_sim(10000, 0.02, True) == 10000 and alg.api_retry_sim(10000, 0.02) == 10233"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Trả 200 kèm “lỗi” trong thân <b class="red">(bộ nhớ đệm, thử lại, giám sát đều hiểu sai)</b>
          <br><span class="note">Bộ nhớ đệm lưu phản hồi lỗi như phản hồi đúng; bộ thử lại không biết phải thử; biểu đồ tỉ lệ lỗi báo 0%. Dùng đúng mã 4xx, 5xx.</span></div>
        say: "Lỗi thứ nhất, trả mã 200 kèm chữ lỗi trong thân, nên bộ nhớ đệm, bộ thử lại và hệ giám sát đều hiểu sai. Bộ nhớ đệm lưu phản hồi lỗi như phản hồi đúng, bộ thử lại không biết phải thử, và biểu đồ tỉ lệ lỗi báo 0 phần trăm. Hãy dùng đúng mã nhóm 400 và nhóm 500."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng GET để thay đổi dữ liệu <b class="red">(máy đi trước tự bấm)</b>
          <br><span class="note"><code>GET /xoa?id=42</code>: trình duyệt tải trước liên kết, công cụ quét, bộ nhớ đệm đều có quyền gọi GET bất cứ lúc nào. Thay đổi phải dùng phương thức không an toàn.</span></div>
        say: "Lỗi thứ hai, dùng GET để thay đổi dữ liệu, nên máy đi trước tự bấm thay người. Trình duyệt tải trước liên kết, công cụ quét, và bộ nhớ đệm đều có quyền gọi GET bất cứ lúc nào. Thay đổi phải dùng một phương thức không an toàn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lẫn 401 với 403 <b class="red">(ứng dụng xử lý sai)</b>
          <br><span class="note">401: chưa biết bạn là ai — đăng nhập lại. 403: biết bạn là ai nhưng không có quyền — đăng nhập lại cũng vô ích.</span></div>
        say: "Lỗi thứ ba, lẫn mã 401 với mã 403, nên ứng dụng xử lý sai. Mã 401 nghĩa là chưa biết bạn là ai, cần đăng nhập lại. Mã 403 nghĩa là biết bạn là ai nhưng không có quyền, nên đăng nhập lại cũng vô ích."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tạo khoá lũy đẳng mới cho mỗi lần <b>gửi lại</b> <b class="red">(người đã đi làm hay mắc)</b>
          <br><span class="note">Đã có khoá, nhưng mã tạo khoá nằm trong vòng lặp gửi lại: mỗi lần gửi mang một khoá khác, máy chủ coi là đơn mới. Khoá phải gắn với <b>ý định đặt hàng</b>, tạo một lần lúc bấm.</span></div>
          <table class="t"><tr><th>khoá tạo ở đâu (10 000 lần đặt)</th><th>số đơn</th></tr>
          <tr><td>một lần lúc bấm, dùng lại khi gửi lại</td><td>10 000</td></tr>
          <tr><td>mới cho mỗi lần gửi</td><td>$\hl{10\,233}$ — như không có khoá</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tạo khoá lũy đẳng mới cho mỗi lần gửi lại. Hệ thống đã có khoá, nhưng đoạn mã tạo khoá lại nằm trong vòng lặp gửi lại, nên mỗi lần gửi mang một khoá khác và máy chủ coi là một đơn mới. Khoá phải gắn với ý định đặt hàng, được tạo đúng một lần lúc khách bấm. Bảng so hai cách đặt chỗ tạo khoá, với 10 nghìn lần đặt. Tạo một lần lúc bấm thì có đúng 10 nghìn đơn. Tạo mới cho mỗi lần gửi thì ra 10233 đơn, y như không có khoá."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.HTTP_METHODS['PUT'][1] and not alg.HTTP_METHODS['POST'][1]"
      - "round(50000 / 0.98) == 51020 and 51020 - 50000 == 1020"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Huỷ đơn bằng <code>PUT /don/42/trang_thai</code> với thân <code>"da_huy"</code>, gửi hai lần. Kết quả có khác gửi một lần không? Còn <code>POST /thanh_toan</code> gửi hai lần?</td></tr>
          <tr><td>2</td><td>Người dùng đã đăng nhập xem đơn của <b>người khác</b>. Máy chủ trả mã nào?</td></tr>
          <tr><td>3</td><td>Quyết định (số minh hoạ): 50 000 lần thanh toán mỗi ngày, 2% phản hồi mất, tự gửi lại, chưa có khoá. Khoảng bao nhiêu lần trừ tiền thừa mỗi ngày? Có cần khoá không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, huỷ đơn bằng phương thức đặt trạng thái của đơn 42 thành đã huỷ, gửi hai lần, kết quả có khác gửi một lần không? Còn POST thanh toán gửi hai lần thì sao? Câu hai, người dùng đã đăng nhập xem đơn của người khác, máy chủ trả mã nào? Câu ba là một quyết định với số minh hoạ, mỗi ngày có 50 nghìn lần thanh toán, 2 phần trăm phản hồi bị mất, ứng dụng tự gửi lại và chưa có khoá. Khoảng bao nhiêu lần trừ tiền thừa mỗi ngày, và có cần khoá không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>gửi hai lần</th><th>trạng thái sau lần 1</th><th>sau lần 2</th></tr>
          <tr><td>đặt trạng thái = đã huỷ</td><td>đã huỷ</td><td>đã huỷ — <b>không khác</b></td></tr>
          <tr><td>POST thanh toán</td><td>trừ tiền 1 lần</td><td>trừ tiền <b>2 lần</b></td></tr></table>
        focus: [1, "1.2", "1.3", "1.3"]
        say: "Đáp án câu một, so trạng thái sau từng lần gửi. Phương thức đặt cho kết quả không khác, vì lần hai đặt lại đúng trạng thái đó, tức lũy đẳng. Còn POST thanh toán có thể trừ tiền hai lần, nên cần khoá lũy đẳng. Đây giống thao tác tăng độ sáng thêm 10 ở phần chuẩn bị, mỗi lần làm lại cộng thêm một lần."
      - show: |
          <p>② <b>403</b> (đã biết là ai, không có quyền) — hoặc 404 nếu không muốn lộ đơn đó có tồn tại.</p>
          <p>③ $\frac{50\,000}{0{,}98} \approx 51\,020$ lần gửi → khoảng $51\,020 - 50\,000 = \hl{1020}$ lần trừ tiền thừa mỗi ngày → <b>cần khoá</b>.</p>
        focus: [1, 2, 2]
        say: "Câu hai, trả mã 403 vì đã biết là ai mà không có quyền, hoặc 404 nếu không muốn lộ rằng đơn đó có tồn tại. Câu ba, số lần gửi khoảng 50 nghìn chia 0 phẩy 98, tức khoảng 51020 lần, nên có khoảng 51020 trừ 50 nghìn, bằng 1020 lần trừ tiền thừa mỗi ngày. Hơn một nghìn khách bị trừ tiền hai lần mỗi ngày là quá nhiều, nên chắc chắn cần khoá lũy đẳng."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tài nguyên là danh từ, phương thức là động từ</span><span class="a">→</span>
          <span class="n">an toàn: chỉ đọc; lũy đẳng: lặp lại vô hại</span><span class="a">→</span>
          <span class="n">tạo mới: khoá lũy đẳng</span><span class="a">→</span>
          <span class="n">mã trạng thái đúng cho máy hiểu</span></div>
        say: "Tổng kết lại, tài nguyên là danh từ, phương thức là động từ. An toàn nghĩa là chỉ đọc, lũy đẳng nghĩa là lặp lại vô hại, thao tác tạo mới cần khoá lũy đẳng, và mã trạng thái phải đúng để máy hiểu."
      - show: |
          <div class="box key"><b>Tư duy:</b> trên mạng, mọi yêu cầu đều <b>có thể đến hai lần</b> — thiết kế sao cho lần thứ hai vô hại.</div>
        say: "Điều cần mang theo, trên mạng mọi yêu cầu đều có thể đến hai lần, nên hãy thiết kế sao cho lần thứ hai vô hại."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>phân trang</b> — độ lệch hay con trỏ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học phân trang, dùng độ lệch hay con trỏ. Hẹn gặp bạn ở bài tiếp theo."
