    - 3
    say: Bước bốn, thử một màu tối hơn đúng một đơn vị, mã 7 6 7 6 7 6, có cặp 7 6 bằng 118. Màu 7 6 7 6 7 6 có độ chói khoảng
      0 phẩy 181, tỉ số khoảng 4 phẩy 54, đạt. Mắt thường gần như không phân biệt được hai màu này, nên phải tính, không được
      đoán. Kiểm tra độ tương phản chữ và nền ngay từ bước chọn bảng màu giữ cho văn bản luôn rõ nét dưới mọi ánh sáng.
- id: check
  kind: check
  title: 'Tự kiểm: tính ngược độ chói tối đa cho phép'
  checks:
  - round(1.05 / 4.5 - 0.05, 4) == 0.1833 and alg.wcag_luminance('777777') > 1.05 / 4.5 - 0.05 > alg.wcag_luminance('767676')
  steps:
  - show: '<table class="t"><tr><th>cách khác: chữ được sáng tối đa bao nhiêu?</th><th>kết quả</th></tr>

      <tr><td>cần $\frac{1{,}05}{L + 0{,}05} \geq 4{,}5$, tức $L + 0{,}05 \leq \frac{1{,}05}{4{,}5}$</td><td>$L \leq 0{,}2333
      - 0{,}05 = \hl{0{,}1833}$</td></tr>

      <tr><td><code>#777777</code>: 0,1845</td><td>lớn hơn 0,1833 → trượt ✓</td></tr>

      <tr><td><code>#767676</code>: 0,1812</td><td>nhỏ hơn 0,1833 → đạt ✓</td></tr></table>

      <p class="note"><b>Kiểm tra bàn phím:</b> nhấn phím <code>Tab</code> qua mọi điều khiển, kích hoạt bằng <code>Enter</code>
      hoặc phím cách và luôn giữ viền tiêu điểm rõ ràng.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '2'
    say: Kiểm bằng đường khác, thay vì tính tỉ số cho từng màu, ta tính ngược xem chữ được sáng tối đa bao nhiêu trên nền
      trắng. Muốn tỉ số ít nhất 4 phẩy 5 thì L cộng 0 phẩy 05 không được vượt 1 phẩy 05 chia 4 phẩy 5, tức L không quá 0 phẩy
      1833. Màu 7 7 7 7 7 7 có L bằng 0 phẩy 1845, lớn hơn mức đó nên trượt, khớp kết quả trên. Màu 7 6 7 6 7 6 có L bằng
      0 phẩy 1812, nhỏ hơn mức đó nên đạt, cũng khớp. Bảo đảm mọi nút điều khiển và biểu mẫu đều thao tác trọn vẹn chỉ bằng
      bàn phím. Khi kiểm tra bằng bàn phím, hãy đi qua mọi nút bằng phím chuyển tiếp và nhấn phím nhập để mở nút.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi thường gặp
  checks:
  - round(alg.wcag_contrast('767676', '121212'), 2) == 4.12 and round(alg.wcag_contrast('999999', '121212'), 2) == 6.58
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Chỉ dùng màu để báo lỗi <b class="red">(người mù màu không thấy)</b>

      <br><span class="note">Ô nhập sai chỉ đổi viền đỏ: khoảng 4 – 8% nam giới (khoảng 8% ở người gốc châu Âu, 4 – 6,5% ở
      người Trung Quốc, Nhật Bản) có rối loạn sắc giác đỏ – lục. Thêm chữ “Số điện thoại phải có 10 chữ số” và biểu tượng.</span></div>

      '
    say: Lỗi thứ nhất, chỉ dùng màu để báo lỗi, nên người mù màu không thấy. Ô nhập sai chỉ đổi viền đỏ, trong khi khoảng
      4 tới 8 phần trăm nam giới, tuỳ nhóm dân, có rối loạn sắc giác đỏ lục. Hãy thêm chữ, như số điện thoại phải có 10 chữ
      số, và thêm một biểu tượng. Chỉ dùng đường viền đỏ đổi màu để báo ô nhập sai mà không kèm chữ mô tả lỗi hay biểu tượng
      rõ ràng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Xoá viền tiêu điểm cho “đẹp” <b class="red">(người dùng bàn phím lạc)</b>

      <br><span class="note">Bỏ viền tiêu điểm thì bấm Tab không biết đang ở đâu. Giữ viền rõ (tương phản ≥ 3 : 1), và thử
      đi hết trang chỉ bằng Tab, Enter, phím cách.</span></div>

      '
    say: Lỗi thứ hai, xoá viền tiêu điểm cho đẹp, nên người dùng bàn phím bị lạc. Bỏ viền tiêu điểm thì bấm phím chuyển tiêu
      điểm không biết mình đang ở đâu. Hãy giữ viền rõ với tương phản ít nhất 3, và thử đi hết trang chỉ bằng phím chuyển
      tiêu điểm, Enter và phím cách. Xoá bỏ đường viền tiêu điểm mặc định khi di chuyển bàn phím khiến người dùng không biết
      mình đang đứng ở nút nào.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Ô nhập không có nhãn gắn với nó <b class="red">(trình đọc màn hình đọc “ô nhập,
      trống”)</b>

      <br><span class="note">Chữ mờ bên trong ô biến mất khi gõ và không phải nhãn. Dùng <code>&lt;label for="sdt"&gt;</code>
      gắn với <code>id="sdt"</code>.</span></div>

      '
    say: Lỗi thứ ba, ô nhập không có nhãn gắn với nó, nên trình đọc màn hình chỉ đọc là ô nhập, trống. Chữ mờ bên trong ô
      biến mất khi gõ, và không phải là nhãn. Hãy dùng thẻ nhãn gắn với mã của ô nhập. Quên giữ vòng lặp tiêu điểm bên trong
      hộp thoại đang mở làm người dùng bấm phím nhảy tuột xuống nền trang bị che mờ phía sau.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Kiểm màu ở giao diện sáng, rồi dùng lại nguyên màu cho giao diện tối <b class="red">(người
      đã đi làm hay mắc)</b>

      <br><span class="note">Tỉ số phụ thuộc <b>cả hai</b> màu. Mỗi cặp chữ–nền của mỗi giao diện phải tính riêng, tốt nhất
      là kiểm tự động.</span></div>

      <table class="t"><tr><th>chữ</th><th>nền</th><th>tỉ số</th><th>chữ thường AA</th></tr>

      <tr><td><code>#767676</code></td><td>trắng <code>#ffffff</code></td><td>4,54</td><td>đạt</td></tr>

      <tr><td><code>#767676</code></td><td>tối <code>#121212</code></td><td>4,12</td><td class="red">trượt</td></tr>

      <tr><td><code>#999999</code></td><td>tối <code>#121212</code></td><td>$\hl{6{,}58}$</td><td>đạt</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - '2.3'
    - '2.4'
    - '2.4'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, kiểm màu ở giao diện sáng rồi dùng lại nguyên màu đó cho giao diện tối. Tỉ
      số tương phản phụ thuộc cả màu chữ lẫn màu nền, nên đổi nền là phải tính lại. Mỗi cặp chữ và nền của mỗi giao diện phải
      được tính riêng, tốt nhất là kiểm tự động mỗi lần dựng. Bảng cho thấy màu xám 7 6 7 6 7 6 đạt 4 phẩy 54 trên nền trắng.
      Nhưng cũng màu đó trên nền tối 1 2 1 2 1 2 chỉ còn 4 phẩy 12, trượt mức AA. Đổi sang xám sáng hơn, mã 9 9 9 9 9 9, thì
      trên nền tối đạt 6 phẩy 58. Lạm dụng thuộc tính hỗ trợ phức tạp thay thế trong khi chỉ cần dùng một thẻ nút hay liên
      kết chuẩn có sẵn hành vi gốc.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(alg.wcag_contrast('ffffff', 'ff9900'), 2) == 2.14 and round(alg.wcag_contrast('0066cc', 'ffffff'), 2) == 5.57
  - round(alg.wcag_contrast('000000', 'ff9900'), 2) == 9.81
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Nút chữ trắng trên nền cam <code>#ff9900</code>: tỉ số ≈ 2,14. Đạt cho chữ thường không? Cho chữ lớn
      không?</td></tr>

      <tr><td>2</td><td>Liên kết xanh <code>#0066cc</code> trên nền trắng: tỉ số ≈ 5,57. Đạt không? Vì sao vẫn nên gạch chân
      liên kết trong đoạn văn?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, nút chữ trắng trên nền cam mã f f 9 9 0 0 có tỉ số khoảng 2 phẩy 14. Đạt cho
      chữ thường không, và cho chữ lớn không? Câu hai, liên kết xanh mã 0 0 6 6 c c trên nền trắng có tỉ số khoảng 5 phẩy
      57. Có đạt không, và vì sao vẫn nên gạch chân liên kết trong đoạn văn? Dừng video và làm ra giấy. Nhận diện các cặp
      màu vi phạm chuẩn tương phản chữ thường bốn phẩy năm và chữ lớn ba lần.
    pause: 15
  - clear: true
    show: '<table class="t"><tr><th>câu 1: so 2,14 với từng ngưỡng</th><th>kết quả</th></tr>

      <tr><td>chữ lớn cần ≥ 3</td><td>$2{,}14 \lt 3$ → trượt</td></tr>

      <tr><td>chữ thường cần ≥ 4,5</td><td>$2{,}14 \lt 3 \lt 4{,}5$ → trượt</td></tr>

      <tr><td>sửa: chữ đen trên cùng nền cam</td><td>$\approx \hl{9{,}81}$ → đạt cả hai</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    say: Đáp án câu một, ta so 2 phẩy 14 với từng ngưỡng trong bảng. Chữ lớn cần ít nhất 3, mà 2 phẩy 14 nhỏ hơn 3, nên trượt.
      Chữ thường cần ít nhất 4 phẩy 5, ngưỡng còn cao hơn nữa, nên cũng trượt, và nút này trượt cả hai. Vậy hãy đổi sang nền
      cam đậm hơn, hoặc dùng chữ đen. Tính thử chữ đen trên cùng nền cam được khoảng 9 phẩy 81, đạt cả cho chữ thường lẫn
      chữ lớn. Xác định lỗi khiến trình đọc màn hình đọc im lặng khi cập nhật số lượng giỏ hàng động không gắn vùng thông
      báo.
  - show: '<p>② <b>Đạt</b> ($5{,}57 \geq 4{,}5$). Nhưng nếu chỉ khác màu với chữ đen xung quanh, người mù màu không nhận ra
      đó là liên kết — gạch chân là tín hiệu không dựa vào màu.</p>

      '
    focus:
    - 1
    - 1
    - 1
    say: Câu hai, đạt, vì 5 phẩy 57 không nhỏ hơn 4 phẩy 5. Nhưng nếu liên kết chỉ khác màu với chữ đen xung quanh, người
      mù màu không nhận ra đó là liên kết, nên gạch chân là tín hiệu không dựa vào màu. Thiết kế luồng quản lý tiêu điểm chuẩn
      mực khi mở rồi đóng một hộp thoại xác nhận xoá.
