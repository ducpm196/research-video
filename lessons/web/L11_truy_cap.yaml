scenes:
- id: hook
  kind: hook
  title: Chữ xám nhạt “cho tinh tế”
  checks:
  - round(alg.wcag_contrast('777777', 'ffffff'), 2) == 4.48
  steps:
  - show: '<p>Nhóm thiết kế chọn chữ xám <code>#777777</code> trên nền trắng cho “tinh tế”. Người lớn tuổi, người dùng ngoài
      nắng, người có thị lực kém đọc rất khó. Và theo chuẩn truy cập nội dung web (WCAG 2.2), màu đó <b>vừa trượt</b> — thiếu
      khoảng 0,02.</p>

      <div class="box key">Hôm nay: <b>truy cập cho mọi người</b> — tính độ tương phản bằng công thức, dùng được bằng bàn
      phím, và không chỉ dựa vào màu.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, nhóm thiết kế chọn chữ xám mã 7 7 7 7 7 7 trên nền trắng cho tinh tế. Người lớn tuổi, người dùng ngoài
      nắng, người có thị lực kém đọc rất khó. Và theo chuẩn truy cập nội dung web, màu đó vừa trượt, thiếu khoảng 0 phẩy 02.
      Hôm nay ta học truy cập cho mọi người, tính độ tương phản bằng công thức, dùng được bằng bàn phím, và không chỉ dựa
      vào màu. Nút bấm đẹp mắt nhưng dùng thẻ giả mạo không bấm được bằng bàn phím và màu chữ nhạt mờ trên nền trắng tự động
      khoá cửa với hàng triệu người dùng.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: mã màu hệ mười sáu và phép chia tỉ số'
  checks:
  - int('77', 16) == 7 * 16 + 7 == 119 and int('ff', 16) == 255 and int('76', 16) == 118 and round(119 / 255, 4) == 0.4667
  - '[int(c, 16) for c in ''abcdef''] == [10, 11, 12, 13, 14, 15] and 16 * 16 == 256 and 4.5 - alg.wcag_contrast(''777777'',
    ''ffffff'') > 0.02'
  - (1 + 0.05) / (0 + 0.05) == 21 and round(alg.wcag_contrast('000000', 'ffffff'), 2) == 21
  steps:
  - show: '<p>Trước hết, <b>hệ mười sáu</b> đếm bằng 16 chữ số: 0 tới 9, rồi a = 10, b = 11, …, f = 15. Một cặp chữ số có
      giá trị (chữ đầu) × 16 + (chữ sau). Mã màu trên web như <code>#777777</code> gồm 3 cặp — đỏ, xanh lá, xanh dương — mỗi
      cặp từ 00 tới ff, tức 0 tới 255.</p>

      <table class="t"><tr><th>cặp</th><th>đổi ra số</th><th>chia 255</th></tr>

      <tr><td>77</td><td>$7 \cdot 16 + 7 = 119$</td><td>$\frac{119}{255} \approx 0{,}4667$</td></tr>

      <tr><td>ff</td><td>$15 \cdot 16 + 15 = 255$</td><td>1 (sáng nhất)</td></tr></table>

      '
    introduces:
    - cdot
    focus:
    - 1
    - 1
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    say: Trước hết, ta cần hiểu hệ mười sáu, đếm bằng 16 chữ số, từ 0 tới 9, rồi a là 10, b là 11, cứ thế tới f là 15. Một
      cặp chữ số có giá trị bằng chữ đầu nhân 16, cộng chữ sau. Mã màu trên web như 7 7 7 7 7 7 gồm ba cặp như vậy, lần lượt
      cho đỏ, xanh lá và xanh dương. Mỗi cặp đi từ 0 0 tới f f, tức từ 0 tới 255. Cặp 7 7 đổi ra là 7 nhân 16 cộng 7, bằng
      119, chia 255 được khoảng 0 phẩy 4667. Cặp f f là 15 nhân 16 cộng 15, bằng 255, chia 255 được 1, là mức sáng nhất. Tỉ
      lệ tương phản độ sáng tính giữa màu chữ và màu nền bắt buộc đạt tối thiểu bốn phẩy năm với chữ thường để dễ đọc dưới
      nhiều điều kiện ánh sáng.
  - show: '<p><b>Tỉ số</b> cho biết “sáng gấp mấy lần”. Cộng 0,05 vào cả trên và dưới để không bao giờ chia cho 0 khi gặp
      màu đen:</p>

      <p>đen trên trắng: $\frac{1 + 0{,}05}{0 + 0{,}05} = \frac{1{,}05}{0{,}05} = \hl{21}$ — tỉ số lớn nhất có thể.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Thứ hai, tỉ số cho biết màu này sáng gấp mấy lần màu kia. Ta cộng 0 phẩy 05 vào cả trên và dưới, để không bao giờ
      phải chia cho 0 khi gặp màu đen có độ chói bằng 0. Đen trên trắng cho 1 phẩy 05 chia 0 phẩy 05, bằng 21, và đó là tỉ
      số lớn nhất có thể. Mọi chức năng tương tác từ trình đơn thả xuống, hộp thoại tới nút đóng mở đều phải điều khiển trọn
      vẹn chỉ với bàn phím.
- id: sym
  kind: symbol
  title: 'Giải mã: độ chói và tỉ số tương phản'
  steps:
  - show: '<p><b>Độ chói tương đối</b> $L$ (0 là đen, 1 là trắng): đổi mỗi kênh màu về $[0, 1]$, bỏ hiệu chỉnh gamma, rồi
      $L = 0{,}2126 R + 0{,}7152 G + 0{,}0722 B$ — mắt nhạy với xanh lá nhất.</p>

      <p><b>Tỉ số tương phản</b> $= \frac{L_{\text{sáng}} + 0{,}05}{L_{\text{tối}} + 0{,}05}$, từ 1 : 1 (cùng màu) tới 21
      : 1 (đen trên trắng).</p>

      <p class="note">Chuẩn có ba mức đạt: A (tối thiểu), <b>AA</b> (mức thường được yêu cầu), AAA (cao nhất).</p>

      <table class="t"><tr><th>mức AA</th><th>ngưỡng</th></tr>

      <tr><td>chữ thường</td><td>≥ 4,5 : 1</td></tr>

      <tr><td>chữ lớn (≥ 24 px, hoặc ≥ 18,66 px đậm), biểu tượng, viền ô nhập</td><td>≥ 3 : 1</td></tr></table>

      '
    introduces:
    - geq
    focus:
    - 1
    - 2
    - 3
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    say: Độ chói tương đối L đi từ 0 là đen tới 1 là trắng. Ta đổi mỗi kênh màu về khoảng từ 0 tới 1, và bỏ phần hiệu chỉnh
      độ sáng của màn hình. Rồi lấy 0 phẩy 2126 nhân đỏ, cộng 0 phẩy 7152 nhân xanh lá, cộng 0 phẩy 0722 nhân xanh dương,
      vì mắt nhạy với xanh lá nhất. Tỉ số tương phản bằng độ chói màu sáng cộng 0 phẩy 05, chia độ chói màu tối cộng 0 phẩy
      05, đi từ 1 khi cùng màu tới 21 khi đen trên trắng. Chuẩn có ba mức đạt, mức A là tối thiểu, mức AA là mức thường được
      yêu cầu, còn mức thứ ba là cao nhất. Bảng cho ngưỡng mức AA. Chữ thường cần ít nhất 4 phẩy 5. Chữ lớn, biểu tượng và
      viền ô nhập cần ít nhất 3. Tuyệt đối không dùng riêng màu sắc làm kênh duy nhất để báo lỗi hay truyền thông tin quan
      trọng. Trình đọc màn hình không nhìn thấy hình dáng mắt thường mà dựa vào cây ngữ nghĩa, nhãn gắn kết và thông báo vùng
      động để dẫn đường.
