id: L11
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 11 — Truy cập cho mọi người: độ tương phản, bàn phím, trình đọc màn hình"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L11; audit/web/verify_web.py L11; W3C, Web Content Accessibility Guidelines (WCAG) 2.2 (2023), tiêu chí 1.4.1 (dùng màu), 1.4.3 (tương phản tối thiểu), 2.1.1 (bàn phím), 2.4.7 (thấy được tiêu điểm); định nghĩa độ chói tương đối và tỉ số tương phản của WCAG; bài 1, 2"
assumes: [arith, frac, approx, ltgt]
# Quy ước: tỉ số tương phản = (L sáng + 0,05) / (L tối + 0,05), L = độ chói tương đối sRGB theo WCAG (alg.wcag_contrast). Mức AA: chữ thường ≥ 4,5 : 1,
#   chữ lớn (≥ 24 px, hoặc ≥ 18,66 px đậm) ≥ 3 : 1. Mã màu viết trên màn hình; lời đọc đọc từng chữ số. Tên WCAG chỉ trên màn hình.
objectives:
  - "Tính độ tương phản theo chuẩn"
  - "Kiểm tra dùng được bằng bàn phím"
  - "Không truyền thông tin chỉ bằng màu"
asr_reviewed:
  - {sentence: "Ô nhập sai chỉ đổi viền đỏ, trong khi khoảng 8 phần trăm nam giới có rối loạn sắc giác đỏ lục.", reason: "ASR chép “Ôn nhập sai chỉ đổi viền đỏ, trong khi khoảng 8% nam giới có trối loạn sắc giác đỏ lụt.” (0.864): “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: rối/trối, lục/lụt — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Chữ xám nhạt “cho tinh tế”"
    checks:
      - "round(alg.wcag_contrast('777777', 'ffffff'), 2) == 4.48"
    steps:
      - show: |
          <p>Nhóm thiết kế chọn chữ xám <code>#777777</code> trên nền trắng cho “tinh tế”. Người lớn tuổi, người dùng ngoài nắng, người có thị lực kém đọc rất khó. Và theo chuẩn truy cập nội dung web, màu đó <b>vừa trượt</b> — thiếu đúng 0,02.</p>
          <div class="box key">Hôm nay: <b>truy cập cho mọi người</b> — tính độ tương phản bằng công thức, dùng được bằng bàn phím, và không chỉ dựa vào màu.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, nhóm thiết kế chọn chữ xám mã 7 7 7 7 7 7 trên nền trắng cho tinh tế. Người lớn tuổi, người dùng ngoài nắng, người có thị lực kém đọc rất khó. Và theo chuẩn truy cập nội dung web, màu đó vừa trượt, thiếu đúng 0 phẩy 02. Hôm nay ta học truy cập cho mọi người, tính độ tương phản bằng công thức, dùng được bằng bàn phím, và không chỉ dựa vào màu."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: mã màu hệ mười sáu và phép chia tỉ số"
    checks:
      - "int('77', 16) == 7 * 16 + 7 == 119 and int('ff', 16) == 255 and int('76', 16) == 118 and round(119 / 255, 4) == 0.4667"
      - "(1 + 0.05) / (0 + 0.05) == 21 and round(alg.wcag_contrast('000000', 'ffffff'), 2) == 21"
    steps:
      - show: |
          <p>Như bài 2 về phần kiểu dáng: mã màu <code>#777777</code> gồm 3 cặp chữ số hệ mười sáu — đỏ, xanh lá, xanh dương — mỗi cặp từ 00 tới ff, tức 0 tới 255.</p>
          <table class="t"><tr><th>cặp</th><th>đổi ra số</th><th>chia 255</th></tr>
          <tr><td>77</td><td>$7 \cdot 16 + 7 = 119$</td><td>$\frac{119}{255} \approx 0{,}4667$</td></tr>
          <tr><td>ff</td><td>$15 \cdot 16 + 15 = 255$</td><td>1 (sáng nhất)</td></tr></table>
        introduces: [cdot]
        focus: [1, 1, 1, "2.2", "2.3"]
        say: "Trước hết, nhắc lại điều đã gặp ở bài 2 về phần kiểu dáng. Mã màu 7 7 7 7 7 7 gồm ba cặp chữ số hệ mười sáu, lần lượt cho đỏ, xanh lá và xanh dương. Mỗi cặp đi từ 0 0 tới f f, tức từ 0 tới 255. Cặp 7 7 đổi ra là 7 nhân 16 cộng 7, bằng 119, chia 255 được khoảng 0 phẩy 4667. Cặp f f là 15 nhân 16 cộng 15, bằng 255, chia 255 được 1, là mức sáng nhất."
      - show: |
          <p><b>Tỉ số</b> cho biết “sáng gấp mấy lần”. Cộng 0,05 vào cả trên và dưới để không bao giờ chia cho 0 khi gặp màu đen:</p>
          <p>đen trên trắng: $\frac{1 + 0{,}05}{0 + 0{,}05} = \frac{1{,}05}{0{,}05} = \hl{21}$ — tỉ số lớn nhất có thể.</p>
        focus: [1, 1, 2]
        say: "Thứ hai, tỉ số cho biết màu này sáng gấp mấy lần màu kia. Ta cộng 0 phẩy 05 vào cả trên và dưới, để không bao giờ phải chia cho 0 khi gặp màu đen có độ chói bằng 0. Đen trên trắng cho 1 phẩy 05 chia 0 phẩy 05, bằng 21, và đó là tỉ số lớn nhất có thể."

  - id: sym
    kind: symbol
    title: "Giải mã: độ chói và tỉ số tương phản"
    steps:
      - show: |
          <p><b>Độ chói tương đối</b> $L$ (0 là đen, 1 là trắng): đổi mỗi kênh màu về $[0, 1]$, bỏ hiệu chỉnh gamma, rồi $L = 0{,}2126 R + 0{,}7152 G + 0{,}0722 B$ — mắt nhạy với xanh lá nhất.</p>
          <p><b>Tỉ số tương phản</b> $= \frac{L_{\text{sáng}} + 0{,}05}{L_{\text{tối}} + 0{,}05}$, từ 1 : 1 (cùng màu) tới 21 : 1 (đen trên trắng).</p>
          <table class="t"><tr><th>mức AA</th><th>ngưỡng</th></tr>
          <tr><td>chữ thường</td><td>≥ 4,5 : 1</td></tr>
          <tr><td>chữ lớn (≥ 24 px, hoặc ≥ 18,66 px đậm), biểu tượng, viền ô nhập</td><td>≥ 3 : 1</td></tr></table>
        introduces: [geq]
        focus: [1, 1, 1, 2, 3, "3.2", "3.3"]
        say: "Độ chói tương đối L đi từ 0 là đen tới 1 là trắng. Ta đổi mỗi kênh màu về khoảng từ 0 tới 1, và bỏ phần hiệu chỉnh độ sáng của màn hình. Rồi lấy 0 phẩy 2126 nhân đỏ, cộng 0 phẩy 7152 nhân xanh lá, cộng 0 phẩy 0722 nhân xanh dương, vì mắt nhạy với xanh lá nhất. Tỉ số tương phản bằng độ chói màu sáng cộng 0 phẩy 05, chia độ chói màu tối cộng 0 phẩy 05, đi từ 1 khi cùng màu tới 21 khi đen trên trắng. Bảng cho ngưỡng mức AA. Chữ thường cần ít nhất 4 phẩy 5. Chữ lớn, biểu tượng và viền ô nhập cần ít nhất 3."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai màu xám nằm hai bên vạch 4,5"
    checks:
      - "[round(alg.wcag_contrast(a, b), 2) for a, b in (('777777', 'ffffff'), ('767676', 'ffffff'), ('ffffff', 'ff9900'), ('0066cc', 'ffffff'))] == [4.48, 4.54, 2.14, 5.57]"
    steps:
      - show: |
          <div><svg width="1500" height="390" viewBox="0 0 1500 390"><defs><marker id="arW11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="40" y="20" width="330" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="205" y="62" font-size="26" text-anchor="middle" fill="#777777">chữ mẫu #777777</text><text x="205" y="96" font-size="20" text-anchor="middle" fill="#777777">trên nền #ffffff</text><text x="205" y="140" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">4,48</text><rect x="400" y="20" width="330" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="565" y="62" font-size="26" text-anchor="middle" fill="#767676">chữ mẫu #767676</text><text x="565" y="96" font-size="20" text-anchor="middle" fill="#767676">trên nền #ffffff</text><text x="565" y="140" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">4,54</text><rect x="760" y="20" width="330" height="90" rx="10" fill="#ff9900" stroke="#1f2937" stroke-width="2"/><text x="925" y="62" font-size="26" text-anchor="middle" fill="#ffffff">chữ mẫu #ffffff</text><text x="925" y="96" font-size="20" text-anchor="middle" fill="#ffffff">trên nền #ff9900</text><text x="925" y="140" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">2,14</text><rect x="1120" y="20" width="330" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1285" y="62" font-size="26" text-anchor="middle" fill="#0066cc">chữ mẫu #0066cc</text><text x="1285" y="96" font-size="20" text-anchor="middle" fill="#0066cc">trên nền #ffffff</text><text x="1285" y="140" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">5,57</text><line x1="120" y1="270" x2="1420" y2="270" stroke="#1f2937" stroke-width="3"/><line x1="120" y1="262" x2="120" y2="278" stroke="#1f2937" stroke-width="2"/><text x="120" y="306" font-size="20" text-anchor="middle" fill="#1f2937">1</text><line x1="337" y1="262" x2="337" y2="278" stroke="#1f2937" stroke-width="2"/><text x="337" y="306" font-size="20" text-anchor="middle" fill="#1f2937">2</text><line x1="553" y1="262" x2="553" y2="278" stroke="#1f2937" stroke-width="2"/><text x="553" y="306" font-size="20" text-anchor="middle" fill="#1f2937">3</text><line x1="770" y1="262" x2="770" y2="278" stroke="#1f2937" stroke-width="2"/><text x="770" y="306" font-size="20" text-anchor="middle" fill="#1f2937">4</text><line x1="987" y1="262" x2="987" y2="278" stroke="#1f2937" stroke-width="2"/><text x="987" y="306" font-size="20" text-anchor="middle" fill="#1f2937">5</text><line x1="1203" y1="262" x2="1203" y2="278" stroke="#1f2937" stroke-width="2"/><text x="1203" y="306" font-size="20" text-anchor="middle" fill="#1f2937">6</text><line x1="1420" y1="262" x2="1420" y2="278" stroke="#1f2937" stroke-width="2"/><text x="1420" y="306" font-size="20" text-anchor="middle" fill="#1f2937">7</text><rect x="120" y="200" width="433" height="12" fill="#b91c1c"/><rect x="553" y="200" width="325" height="12" fill="#d97706"/><rect x="878" y="200" width="542" height="12" fill="#059669"/><text x="337" y="188" font-size="20" text-anchor="middle" fill="#b91c1c">trượt mọi loại chữ</text><text x="716" y="188" font-size="20" text-anchor="middle" fill="#d97706">chỉ đạt chữ lớn</text><text x="1149" y="188" font-size="20" text-anchor="middle" fill="#059669">đạt chữ thường (tới 21)</text><circle cx="367" cy="270" r="9" fill="#2a78d6"/><line x1="367" y1="280" x2="367" y2="322" stroke="#2a78d6" stroke-width="2"/><text x="375" y="340" font-size="20" text-anchor="start" fill="#2a78d6">cam</text><circle cx="874" cy="270" r="9" fill="#2a78d6"/><line x1="874" y1="280" x2="874" y2="322" stroke="#2a78d6" stroke-width="2"/><text x="866" y="340" font-size="20" text-anchor="end" fill="#2a78d6">777777</text><circle cx="887" cy="270" r="9" fill="#2a78d6"/><line x1="887" y1="280" x2="887" y2="352" stroke="#2a78d6" stroke-width="2"/><text x="895" y="370" font-size="20" text-anchor="start" fill="#2a78d6">767676</text><circle cx="1109" cy="270" r="9" fill="#2a78d6"/><line x1="1109" y1="280" x2="1109" y2="322" stroke="#2a78d6" stroke-width="2"/><text x="1117" y="340" font-size="20" text-anchor="start" fill="#2a78d6">liên kết</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hàng trên của hình là bốn mẫu chữ vẽ bằng đúng màu thật, kèm tỉ số tương phản tính theo công thức. Hai mẫu xám đầu tiên trông gần như giống hệt nhau, nhưng trên trục số ở dưới, chúng nằm ở hai bên vạch 4 phẩy 5. Dải đỏ dưới 3 là trượt mọi loại chữ, dải cam từ 3 tới 4 phẩy 5 chỉ đạt cho chữ lớn, và dải xanh từ 4 phẩy 5 trở lên mới đạt cho chữ thường. Nút chữ trắng trên nền cam rơi vào dải đỏ, còn liên kết màu xanh dương rơi vào dải xanh."

  - id: example
    kind: example
    title: "Hai màu xám gần như giống nhau"
    checks:
      - "round(alg.wcag_luminance('777777'), 4) == 0.1845 and round(1.05 / (alg.wcag_luminance('777777') + 0.05), 2) == 4.48"
      - "round(alg.wcag_contrast('767676', 'ffffff'), 2) == 4.54 and alg.wcag_contrast('767676', 'ffffff') >= 4.5 > alg.wcag_contrast('777777', 'ffffff')"
    steps:
      - show: |
          <p><b>Bước một — đổi kênh màu</b> của <code>#777777</code> về khoảng 0 tới 1: $\frac{119}{255} \approx 0{,}4667$ (cả 3 kênh như nhau vì là màu xám).</p>
        say: "Bước một, đổi kênh màu của màu xám 7 7 7 7 7 7 về khoảng từ 0 tới 1. Như phần chuẩn bị, cặp 7 7 là 119, chia 255 được khoảng 0 phẩy 4667, và cả ba kênh đều như nhau vì đây là màu xám."
      - show: |
          <p><b>Bước 2 — bỏ hiệu chỉnh độ sáng</b>: vì $0{,}4667 \gt 0{,}04045$, dùng $\left(\frac{0{,}4667 + 0{,}055}{1{,}055}\right)^{2{,}4} \approx 0{,}1845$.</p>
          <p>Ba trọng số cộng lại $0{,}2126 + 0{,}7152 + 0{,}0722 = 1$, nên với màu xám $L = 0{,}1845$.</p>
        introduces: [power]
        focus: [1, 1, 2]
        say: "Bước hai, bỏ phần hiệu chỉnh độ sáng của màn hình. Vì 0 phẩy 4667 lớn hơn ngưỡng 0 phẩy 04045, ta cộng 0 phẩy 055, chia 1 phẩy 055, rồi lấy mũ 2 phẩy 4, được khoảng 0 phẩy 1845. Ba trọng số đỏ, xanh lá, xanh dương cộng lại đúng bằng 1, nên với màu xám, độ chói L chính là 0 phẩy 1845."
      - clear: true
        show: |
          <p><b>Bước 3 — tỉ số với nền trắng</b> ($L = 1$):</p>
          <table class="t"><tr><th>chữ trên nền trắng</th><th>$L$ chữ</th><th>tỉ số</th><th>chữ thường AA</th></tr>
          <tr><td><code>#777777</code></td><td>0,1845</td><td>$\frac{1 + 0{,}05}{0{,}1845 + 0{,}05} \approx 4{,}48$</td><td>trượt</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước ba, tính tỉ số với nền trắng, có độ chói bằng 1. Bảng so hai màu chữ trên nền trắng. Màu 7 7 7 7 7 7 có độ chói 0 phẩy 1845, nên tỉ số bằng 1 cộng 0 phẩy 05, chia 0 phẩy 1845 cộng 0 phẩy 05, khoảng 4 phẩy 48, trượt mức AA."
      - clear: true
        show: |
          <p><b>Bước 4 — thử màu tối hơn một chút</b>: <code>#767676</code>, cặp 76 = 118.</p>
          <table class="t"><tr><th>chữ trên nền trắng</th><th>$L$ chữ</th><th>tỉ số</th><th>chữ thường AA</th></tr>
          <tr><td><code>#777777</code></td><td>0,1845</td><td>$\approx 4{,}48$</td><td>trượt</td></tr>
          <tr><td><code>#767676</code></td><td>≈ 0,181</td><td>$\approx \hl{4{,}54}$</td><td>đạt</td></tr></table>
          <p>Mắt thường gần như không phân biệt được hai màu này — nên phải <b>tính</b>, không đoán.</p>
        focus: [1, "2.3", 3]
        say: "Bước bốn, thử một màu tối hơn đúng một đơn vị, mã 7 6 7 6 7 6, có cặp 7 6 bằng 118. Màu 7 6 7 6 7 6 có độ chói khoảng 0 phẩy 181, tỉ số khoảng 4 phẩy 54, đạt. Mắt thường gần như không phân biệt được hai màu này, nên phải tính, không được đoán."

  - id: check
    kind: check
    title: "Tự kiểm: tính ngược độ chói tối đa cho phép"
    checks:
      - "round(1.05 / 4.5 - 0.05, 4) == 0.1833 and alg.wcag_luminance('777777') > 1.05 / 4.5 - 0.05 > alg.wcag_luminance('767676')"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác: chữ được sáng tối đa bao nhiêu?</th><th>kết quả</th></tr>
          <tr><td>cần $\frac{1{,}05}{L + 0{,}05} \geq 4{,}5$, tức $L + 0{,}05 \leq \frac{1{,}05}{4{,}5}$</td><td>$L \leq 0{,}2333 - 0{,}05 = \hl{0{,}1833}$</td></tr>
          <tr><td><code>#777777</code>: 0,1845</td><td>lớn hơn 0,1833 → trượt ✓</td></tr>
          <tr><td><code>#767676</code>: 0,1812</td><td>nhỏ hơn 0,1833 → đạt ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, thay vì tính tỉ số cho từng màu, ta tính ngược xem chữ được sáng tối đa bao nhiêu trên nền trắng. Muốn tỉ số ít nhất 4 phẩy 5 thì L cộng 0 phẩy 05 không được vượt 1 phẩy 05 chia 4 phẩy 5, tức L không quá 0 phẩy 1833. Màu 7 7 7 7 7 7 có L bằng 0 phẩy 1845, lớn hơn mức đó nên trượt, khớp kết quả trên. Màu 7 6 7 6 7 6 có L bằng 0 phẩy 1812, nhỏ hơn mức đó nên đạt, cũng khớp."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thường gặp"
    checks:
      - "round(alg.wcag_contrast('767676', '121212'), 2) == 4.12 and round(alg.wcag_contrast('999999', '121212'), 2) == 6.58"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ dùng màu để báo lỗi <b class="red">(người mù màu không thấy)</b>
          <br><span class="note">Ô nhập sai chỉ đổi viền đỏ: khoảng 8% nam giới có rối loạn sắc giác đỏ – lục. Thêm chữ “Số điện thoại phải có 10 chữ số” và biểu tượng.</span></div>
        say: "Lỗi thứ nhất, chỉ dùng màu để báo lỗi, nên người mù màu không thấy. Ô nhập sai chỉ đổi viền đỏ, trong khi khoảng 8 phần trăm nam giới có rối loạn sắc giác đỏ lục. Hãy thêm chữ, như số điện thoại phải có 10 chữ số, và thêm một biểu tượng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Xoá viền tiêu điểm cho “đẹp” <b class="red">(người dùng bàn phím lạc)</b>
          <br><span class="note">Bỏ viền tiêu điểm thì bấm Tab không biết đang ở đâu. Giữ viền rõ (tương phản ≥ 3 : 1), và thử đi hết trang chỉ bằng Tab, Enter, phím cách.</span></div>
        say: "Lỗi thứ hai, xoá viền tiêu điểm cho đẹp, nên người dùng bàn phím bị lạc. Bỏ viền tiêu điểm thì bấm phím chuyển tiêu điểm không biết mình đang ở đâu. Hãy giữ viền rõ với tương phản ít nhất 3, và thử đi hết trang chỉ bằng phím chuyển tiêu điểm, Enter và phím cách."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Ô nhập không có nhãn gắn với nó <b class="red">(trình đọc màn hình đọc “ô nhập, trống”)</b>
          <br><span class="note">Chữ mờ bên trong ô biến mất khi gõ và không phải nhãn. Dùng <code>&lt;label for="sdt"&gt;</code> gắn với <code>id="sdt"</code>.</span></div>
        say: "Lỗi thứ ba, ô nhập không có nhãn gắn với nó, nên trình đọc màn hình chỉ đọc là ô nhập, trống. Chữ mờ bên trong ô biến mất khi gõ, và không phải là nhãn. Hãy dùng thẻ nhãn gắn với mã của ô nhập."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Kiểm màu ở giao diện sáng, rồi dùng lại nguyên màu cho giao diện tối <b class="red">(người đã đi làm hay mắc)</b>
          <br><span class="note">Tỉ số phụ thuộc <b>cả hai</b> màu. Mỗi cặp chữ–nền của mỗi giao diện phải tính riêng, tốt nhất là kiểm tự động.</span></div>
          <table class="t"><tr><th>chữ</th><th>nền</th><th>tỉ số</th><th>chữ thường AA</th></tr>
          <tr><td><code>#767676</code></td><td>trắng <code>#ffffff</code></td><td>4,54</td><td>đạt</td></tr>
          <tr><td><code>#767676</code></td><td>tối <code>#121212</code></td><td>4,12</td><td class="red">trượt</td></tr>
          <tr><td><code>#999999</code></td><td>tối <code>#121212</code></td><td>$\hl{6{,}58}$</td><td>đạt</td></tr></table>
        focus: [1, 1, 1, 2, "2.3", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, kiểm màu ở giao diện sáng rồi dùng lại nguyên màu đó cho giao diện tối. Tỉ số tương phản phụ thuộc cả màu chữ lẫn màu nền, nên đổi nền là phải tính lại. Mỗi cặp chữ và nền của mỗi giao diện phải được tính riêng, tốt nhất là kiểm tự động mỗi lần dựng. Bảng cho thấy màu xám 7 6 7 6 7 6 đạt 4 phẩy 54 trên nền trắng. Nhưng cũng màu đó trên nền tối 1 2 1 2 1 2 chỉ còn 4 phẩy 12, trượt mức AA. Đổi sang xám sáng hơn, mã 9 9 9 9 9 9, thì trên nền tối đạt 6 phẩy 58."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.wcag_contrast('ffffff', 'ff9900'), 2) == 2.14 and round(alg.wcag_contrast('0066cc', 'ffffff'), 2) == 5.57"
      - "round(alg.wcag_contrast('000000', 'ff9900'), 2) == 9.81"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nút chữ trắng trên nền cam <code>#ff9900</code>: tỉ số ≈ 2,14. Đạt cho chữ thường không? Cho chữ lớn không?</td></tr>
          <tr><td>2</td><td>Liên kết xanh <code>#0066cc</code> trên nền trắng: tỉ số ≈ 5,57. Đạt không? Vì sao vẫn nên gạch chân liên kết trong đoạn văn?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, nút chữ trắng trên nền cam mã f f 9 9 0 0 có tỉ số khoảng 2 phẩy 14. Đạt cho chữ thường không, và cho chữ lớn không? Câu hai, liên kết xanh mã 0 0 6 6 c c trên nền trắng có tỉ số khoảng 5 phẩy 57. Có đạt không, và vì sao vẫn nên gạch chân liên kết trong đoạn văn? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: so 2,14 với từng ngưỡng</th><th>kết quả</th></tr>
          <tr><td>chữ lớn cần ≥ 3</td><td>$2{,}14 \lt 3$ → trượt</td></tr>
          <tr><td>chữ thường cần ≥ 4,5</td><td>$2{,}14 \lt 3 \lt 4{,}5$ → trượt</td></tr>
          <tr><td>sửa: chữ đen trên cùng nền cam</td><td>$\approx \hl{9{,}81}$ → đạt cả hai</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.4"]
        say: "Đáp án câu một, ta so 2 phẩy 14 với từng ngưỡng trong bảng. Chữ lớn cần ít nhất 3, mà 2 phẩy 14 nhỏ hơn 3, nên trượt. Chữ thường cần ít nhất 4 phẩy 5, ngưỡng còn cao hơn nữa, nên cũng trượt, và nút này trượt cả hai. Vậy hãy đổi sang nền cam đậm hơn, hoặc dùng chữ đen. Tính thử chữ đen trên cùng nền cam được khoảng 9 phẩy 81, đạt cả cho chữ thường lẫn chữ lớn."
      - show: |
          <p>② <b>Đạt</b> ($5{,}57 \geq 4{,}5$). Nhưng nếu chỉ khác màu với chữ đen xung quanh, người mù màu không nhận ra đó là liên kết — gạch chân là tín hiệu không dựa vào màu.</p>
        focus: [1, 1]
        say: "Câu hai, đạt, vì 5 phẩy 57 không nhỏ hơn 4 phẩy 5. Nhưng nếu liên kết chỉ khác màu với chữ đen xung quanh, người mù màu không nhận ra đó là liên kết, nên gạch chân là tín hiệu không dựa vào màu."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tương phản: tính, không đoán (4,5 và 3)</span><span class="a">→</span>
          <span class="n">không chỉ dùng màu</span><span class="a">→</span>
          <span class="n">đi hết trang bằng bàn phím, thấy tiêu điểm</span><span class="a">→</span>
          <span class="n">nhãn, ngữ nghĩa, văn bản thay thế</span></div>
        say: "Tổng kết lại, độ tương phản phải tính, không đoán, với ngưỡng 4 phẩy 5 và 3. Đừng chỉ dùng màu, phải đi hết trang được bằng bàn phím và thấy tiêu điểm, và có nhãn, ngữ nghĩa, văn bản thay thế."
      - show: |
          <div class="box key"><b>Tư duy:</b> truy cập không phải tính năng cho “một nhóm nhỏ” — ai cũng có lúc dùng điện thoại ngoài nắng, một tay, hay khi mỏi mắt.</div>
        say: "Điều cần mang theo, truy cập không phải tính năng cho một nhóm nhỏ, vì ai cũng có lúc dùng điện thoại ngoài nắng, dùng một tay, hay khi mỏi mắt."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>ứng dụng di động</b> — vòng đời, luồng giao diện, ngân sách khung hình.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học ứng dụng di động, với vòng đời, luồng giao diện, và ngân sách khung hình. Hẹn gặp bạn ở bài tiếp theo."
