- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">tương phản: tính, không đoán (4,5 và 3)</span><span class="a">→</span>

      <span class="n">không chỉ dùng màu</span><span class="a">→</span>

      <span class="n">đi hết trang bằng bàn phím, thấy tiêu điểm</span><span class="a">→</span>

      <span class="n">nhãn, ngữ nghĩa, văn bản thay thế</span></div>

      '
    say: Tổng kết lại, độ tương phản phải tính, không đoán, với ngưỡng 4 phẩy 5 và 3. Đừng chỉ dùng màu, phải đi hết trang
      được bằng bàn phím và thấy tiêu điểm, và có nhãn, ngữ nghĩa, văn bản thay thế. Khả năng truy cập không phải tính năng
      phụ thêm mà là tiêu chuẩn kỹ thuật cơ bản nâng chất lượng mã cho tất cả mọi người.
  - show: '<div class="box key"><b>Tư duy:</b> truy cập không phải tính năng cho “một nhóm nhỏ” — ai cũng có lúc dùng điện
      thoại ngoài nắng, một tay, hay khi mỏi mắt.</div>

      '
    say: Điều cần mang theo, truy cập không phải tính năng cho một nhóm nhỏ, vì ai cũng có lúc dùng điện thoại ngoài nắng,
      dùng một tay, hay khi mỏi mắt. Thẻ ngữ nghĩa chuẩn, tương phản rõ, tiêu điểm bàn phím đầy đủ và nhãn đọc rõ là bốn cột
      trụ dễ áp dụng ngay.
  - clear: true
    show: '<p class="note">Bài sau (bài 12): <b>ứng dụng di động</b> — vòng đời, luồng giao diện, ngân sách khung hình.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 12, ta học ứng dụng di động, với vòng đời, luồng giao diện, và ngân sách khung hình. Hẹn gặp bạn ở
      bài tiếp theo. Mang tư duy hiệu năng khung hình mượt mà sang thiết bị cầm tay đòi hỏi thấu hiểu vòng đời và hạn chế
      pin mạng di động.
