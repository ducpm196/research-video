- id: example
  kind: example
  title: Hai màu xám gần như giống nhau
  checks:
  - round(alg.wcag_luminance('777777'), 4) == 0.1845 and round(1.05 / (alg.wcag_luminance('777777') + 0.05), 2) == 4.48
  - round(alg.wcag_contrast('767676', 'ffffff'), 2) == 4.54 and alg.wcag_contrast('767676', 'ffffff') >= 4.5 > alg.wcag_contrast('777777',
    'ffffff')
  steps:
  - show: '<p><b>Bước một — đổi kênh màu</b> của <code>#777777</code> về khoảng 0 tới 1: $\frac{119}{255} \approx 0{,}4667$
      (cả 3 kênh như nhau vì là màu xám).</p>

      '
    say: Bước một, đổi kênh màu của màu xám 7 7 7 7 7 7 về khoảng từ 0 tới 1. Như phần chuẩn bị, cặp 7 7 là 119, chia 255
      được khoảng 0 phẩy 4667, và cả ba kênh đều như nhau vì đây là màu xám.
  - show: '<p><b>Bước 2 — bỏ hiệu chỉnh độ sáng</b>: vì $0{,}4667 \gt 0{,}04045$, dùng $\left(\frac{0{,}4667 + 0{,}055}{1{,}055}\right)^{2{,}4}
      \approx 0{,}1845$.</p>

      <p>Ba trọng số cộng lại $0{,}2126 + 0{,}7152 + 0{,}0722 = 1$, nên với màu xám $L = 0{,}1845$.</p>

      <p class="note">Nếu kênh màu rất tối (<code>c &lt;= 0,04045</code>, như <code>#000000</code>), dùng nhánh tuyến tính
      <code>c / 12,92</code> thay cho hàm mũ.</p>

      '
    introduces:
    - power
    focus:
    - 1
    - 1
    - 2
    - '2'
    say: Bước hai, bỏ phần hiệu chỉnh độ sáng của màn hình. Vì 0 phẩy 4667 lớn hơn ngưỡng 0 phẩy 04045, ta cộng 0 phẩy 055,
      chia 1 phẩy 055, rồi lấy mũ 2 phẩy 4, được khoảng 0 phẩy 1845. Ba trọng số đỏ, xanh lá, xanh dương cộng lại đúng bằng
      1, nên với màu xám, độ chói L chính là 0 phẩy 1845. Nếu kênh màu rất tối không vượt quá không phẩy không bốn không bốn
      lăm, ta chia thẳng cho mười hai phẩy chín hai.
  - clear: true
    show: '<p><b>Bước 3 — tỉ số với nền trắng</b> ($L = 1$):</p>

      <table class="t"><tr><th>chữ trên nền trắng</th><th>$L$ chữ</th><th>tỉ số</th><th>chữ thường AA</th></tr>

      <tr><td><code>#777777</code></td><td>0,1845</td><td>$\frac{1 + 0{,}05}{0{,}1845 + 0{,}05} \approx 4{,}48$</td><td>trượt</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.2'
    say: Bước ba, tính tỉ số với nền trắng, có độ chói bằng 1. Bảng so hai màu chữ trên nền trắng. Màu 7 7 7 7 7 7 có độ chói
      0 phẩy 1845, nên tỉ số bằng 1 cộng 0 phẩy 05, chia 0 phẩy 1845 cộng 0 phẩy 05, khoảng 4 phẩy 48, trượt mức AA.
  - clear: true
    show: '<p><b>Bước 4 — thử màu tối hơn một chút</b>: <code>#767676</code>, cặp 76 = 118.</p>

      <table class="t"><tr><th>chữ trên nền trắng</th><th>$L$ chữ</th><th>tỉ số</th><th>chữ thường AA</th></tr>

