      x="1080" y="335" font-size="22" text-anchor="middle" fill="#059669">gửi thao tác, hợp hai tập</text><text x="1080" y="380"
      font-size="26" font-weight="bold" text-anchor="middle" fill="#059669">{mua sữa, gọi mẹ}: đủ 2 việc</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: 'Hình cho thấy dữ liệu đi đâu. Trong thang máy không có mạng, mỗi máy ghi thao tác thêm việc vào hàng đợi của riêng
      nó, máy vợ thêm mua sữa, máy chồng thêm gọi mẹ. Khi có mạng, cả hai gửi lên máy chủ, và kết quả phụ thuộc vào cách máy
      chủ gộp. Ghi sau thắng ở ô đỏ chỉ còn một việc, còn hợp hai tập ở ô xanh giữ đủ cả hai việc. Giống cuốn sổ tay bỏ túi
      khi đi thực địa vùng núi: bạn ghi chép chỉnh sửa thoải mái vào sổ riêng, về tới văn phòng mới đối chiếu ghép trang vào
      sổ chung của nhóm.'
- id: example
  kind: example
  title: Hai cách đồng bộ danh sách việc
  checks:
  - alg.lww_merge((1004, {'mua sữa'}), (1002, {'gọi mẹ'})) == (1004, {'mua sữa'}) and {'mua sữa'} | {'gọi mẹ'} == {'mua sữa',
    'gọi mẹ'}
  steps:
  - show: '<p><b>Bước một — ngoại tuyến</b>: mỗi máy ghi vào kho riêng và hàng đợi riêng.</p>

      <table class="t"><tr><th>máy</th><th>kho trên máy</th><th>hàng đợi chờ gửi</th></tr>

      <tr><td>vợ (10:04)</td><td>{mua sữa}</td><td>thêm “mua sữa”, mã 7f3c</td></tr>

      <tr><td>chồng (10:02)</td><td>{gọi mẹ}</td><td>thêm “gọi mẹ”, mã 2b9e</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    say: Bước một, lúc ngoại tuyến, mỗi máy ghi vào kho riêng trên máy và xếp thao tác vào hàng đợi riêng, nên giao diện cập
      nhật ngay. Máy vợ lúc 10 giờ 4 phút có danh sách mua sữa, và hàng đợi chứa thao tác thêm mua sữa với mã riêng. Máy chồng
      lúc 10 giờ 2 phút có danh sách gọi mẹ, và hàng đợi chứa thao tác thêm gọi mẹ với mã riêng.
  - clear: true
    show: '<p><b>Bước 2 — cách 1: gửi cả danh sách, ghi sau thắng</b>.</p>

      <table class="t"><tr><th>bản gửi lên</th><th>dấu thời gian</th><th>kết quả</th></tr>

      <tr><td>{mua sữa}</td><td>10:04 — lớn hơn</td><td>giữ</td></tr>

      <tr><td>{gọi mẹ}</td><td>10:02</td><td><b class="red">bỏ</b> — mất “gọi mẹ”</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    say: Bước hai, cách thứ nhất gửi cả danh sách, và máy chủ để ghi sau thắng. Bản của vợ lúc 10 giờ 4 phút có dấu thời gian
      lớn hơn nên được giữ. Bản của chồng lúc 10 giờ 2 phút bị bỏ, và việc gọi mẹ mất luôn.
  - show: '<p><b>Bước 3 — cách 2: gửi thao tác “thêm”, máy chủ lấy hợp</b>.</p>

      <p>{ } hợp {mua sữa} $=$ {mua sữa}; rồi {mua sữa} hợp {gọi mẹ} $=$ <b>{mua sữa, gọi mẹ}</b> — giữ cả hai.</p>

      '
    focus:
    - 1
    - 2
    say: Bước ba, cách thứ hai gửi thao tác thêm, và máy chủ lấy hợp. Bắt đầu từ tập rỗng, hợp với mua sữa được mua sữa, rồi
      hợp tiếp với gọi mẹ được cả mua sữa lẫn gọi mẹ, nên giữ được cả hai việc.
  - clear: true
    show: '<p><b>Bước 4 — mạng chập chờn</b>: thao tác 7f3c đến <b>hai lần</b>, và đến sau 2b9e.</p>

      <table class="t"><tr><th>thứ tự nhận</th><th>sau mỗi lần hợp</th></tr>

      <tr><td>gọi mẹ</td><td>{gọi mẹ}</td></tr>

      <tr><td>mua sữa</td><td>{gọi mẹ, mua sữa}</td></tr>

      <tr><td>mua sữa (lần hai)</td><td>{gọi mẹ, mua sữa} — không đổi</td></tr></table>

      <p>Hợp hai tập không phụ thuộc thứ tự đến, và nhận trùng một thao tác cũng không sao — hai máy luôn <b>hội tụ</b> về
      cùng kết quả.</p>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - 3
    say: Bước bốn, mạng chập chờn làm thao tác mua sữa đến hai lần, và đến sau thao tác gọi mẹ. Nhận gọi mẹ trước, tập là
      gọi mẹ. Nhận mua sữa, tập thành gọi mẹ và mua sữa. Nhận mua sữa lần hai, tập không đổi gì. Hợp hai tập không phụ thuộc
      thứ tự đến, và nhận trùng một thao tác cũng không sao, nên hai máy luôn hội tụ về cùng một kết quả.
- id: check
  kind: check
  title: 'Tự kiểm: thử mọi thứ tự đến'
  checks:
  - '(lambda ps: len(ps) == 6 and len({frozenset(p) for p in ps}) == 1 and set(ps[0]) == {''mua sữa'', ''gọi mẹ''})(list(__import__(''itertools'').permutations([''mua
    sữa'', ''gọi mẹ'', ''mua sữa''])))'
  - all(__import__('functools').reduce(alg.lww_merge, p)[1] == {'mua sữa'} for p in __import__('itertools').permutations([(1004,
    {'mua sữa'}), (1002, {'gọi mẹ'}), (1004, {'mua sữa'})]))
  steps:
  - show: '<table class="t"><tr><th>cách khác: liệt kê mọi thứ tự nhận 3 gói (mua sữa, gọi mẹ, mua sữa lần hai)</th><th>kết
      quả</th></tr>

      <tr><td>số thứ tự có thể: 3 nhân 2 nhân 1</td><td>6 thứ tự</td></tr>

      <tr><td>hợp tập, cả 6 thứ tự</td><td>đều ra {mua sữa, gọi mẹ} ✓</td></tr>

      <tr><td>ghi sau thắng, cả 6 thứ tự</td><td>đều chỉ còn {mua sữa} — luôn mất 1 việc</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Kiểm bằng đường khác, ta không lập luận nữa mà liệt kê mọi thứ tự máy chủ có thể nhận ba gói, gồm mua sữa, gọi mẹ,
      và mua sữa lần hai. Ba gói có 3 nhân 2 nhân 1, bằng 6 thứ tự. Lấy hợp tập theo cả 6 thứ tự đều ra mua sữa và gọi mẹ,
      khớp kết quả ở bước bốn. Còn ghi sau thắng thì cả 6 thứ tự đều chỉ còn mua sữa, nghĩa là lần nào cũng mất một việc.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi thường gặp
  checks:
  - alg.lww_merge((959, 'tên mới'), (1002, 'tên cũ')) == (1002, 'tên cũ')
  - 5000 * 200 == 1000000 and 3 * 200 == 600 and round(1000000 / 600) == 1667
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Tin đồng hồ máy khách <b class="red">(bản mới hơn bị mất)</b>

      <br><span class="note">Máy chồng sửa tên lúc 10:02 thật. Máy vợ đồng hồ chậm 5 phút, sửa lúc 10:04 thật nhưng ghi dấu
      <b>9:59</b>. Ghi sau thắng giữ bản của chồng — bản <b>cũ hơn</b>. Dùng dấu thời gian của máy chủ, <b>đồng hồ logic</b>
      (một bộ đếm tăng dần theo mỗi lần sửa, không dựa vào giờ thật). Hai cách đó vẫn bỏ một bản, nên tốt nhất là <b>hợp nhất
      theo nghĩa</b>.</span></div>

      '
    say: Lỗi thứ nhất, tin đồng hồ máy khách, nên bản mới hơn bị mất. Máy chồng sửa tên lúc 10 giờ 2 phút thật. Máy vợ có
      đồng hồ chậm 5 phút, sửa lúc 10 giờ 4 phút thật nhưng ghi dấu 9 giờ 59 phút. Ghi sau thắng giữ bản của chồng, là bản
      cũ hơn.
  - show: ''
    say: Hãy dùng dấu thời gian của máy chủ, đồng hồ logic, tức một bộ đếm tăng dần theo mỗi lần sửa chứ không dựa vào giờ
      thật. Nhưng hai cách đó vẫn bỏ một bản, nên tốt nhất là hợp nhất theo nghĩa. Tin vào cờ mạng báo còn sóng từ hệ điều
      hành trong khi đường truyền thực tế đang kẹt cứng gói tin mất liên lạc.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Xoá bằng cách bỏ khỏi tập <b class="red">(việc đã xoá sống lại)</b>

      <br><span class="note">Máy A xoá “mua sữa”, máy B chưa biết vẫn còn “mua sữa”: hợp hai tập đưa nó trở lại. Ghi lại <b>dấu
      đã xoá</b> cho từng mục, và đồng bộ cả dấu đó.</span></div>

      '
    say: Lỗi thứ hai, xoá bằng cách bỏ mục khỏi tập, nên việc đã xoá sống lại. Máy A xoá mua sữa, máy B chưa biết nên vẫn
      còn mua sữa, và hợp hai tập đưa nó trở lại. Hãy ghi lại một dấu đã xoá cho từng mục, và đồng bộ cả dấu đó. Gửi lại các
      thao tác trong hàng đợi không kèm khoá lũy đẳng gây nhân đôi ghi chú hoặc trừ hai lần lúc kết nối chập chờn.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Hàng đợi không có mã thao tác <b class="red">(gửi lại là nhân đôi)</b>

      <br><span class="note">Mạng chập chờn, thao tác “thêm việc” gửi hai lần thành hai việc. Mỗi thao tác mang một mã duy
      nhất; máy chủ bỏ qua mã đã thấy (lũy đẳng, như bài 6).</span></div>

      '
    say: Lỗi thứ ba, hàng đợi không có mã thao tác, nên gửi lại là nhân đôi. Mạng chập chờn làm thao tác thêm việc gửi hai
      lần thành hai việc. Mỗi thao tác phải mang một mã duy nhất, và máy chủ bỏ qua mã đã thấy, tức lũy đẳng như ở bài 6.
      Áp dụng mù quáng quy tắc bản ghi sau cùng thắng mọi nơi dựa trên đồng hồ máy khách vốn có thể chỉnh sai giờ.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Mỗi lần có mạng lại tải lên <b>toàn bộ</b> dữ liệu <b class="red">(người đã
      đi làm hay mắc)</b>

      <br><span class="note">Cách này dễ viết và “chắc ăn” trên mạng văn phòng, nhưng trên di động nó tốn dữ liệu, tốn pin,
      và còn quay về ghi sau thắng cho cả danh sách. Chỉ gửi các thao tác trong hàng đợi.</span></div>

      <table class="t"><tr><th>mỗi lần đồng bộ (số minh hoạ, mỗi mục 200 byte)</th><th>dữ liệu gửi</th></tr>

      <tr><td>toàn bộ 5000 mục</td><td>1 000 000 byte</td></tr>

      <tr><td>3 thao tác trong hàng đợi</td><td>600 byte — ít hơn khoảng $\hl{1667}$ lần</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, mỗi lần có mạng lại tải lên toàn bộ dữ liệu. Cách này dễ viết và có vẻ chắc
      ăn khi thử trên mạng văn phòng, nhưng trên di động nó tốn dữ liệu, tốn pin, và còn quay về ghi sau thắng cho cả danh
      sách. Hãy chỉ gửi các thao tác đang nằm trong hàng đợi. Bảng dùng số minh hoạ, mỗi mục 200 byte. Gửi toàn bộ 5000 mục
      là 1 triệu byte mỗi lần đồng bộ. Gửi 3 thao tác trong hàng đợi chỉ 600 byte, ít hơn khoảng 1667 lần. Không hiển thị
      rõ trạng thái đang chờ đồng bộ hay lỗi xung đột khiến người dùng nhầm lẫn giữa dữ liệu đã lên máy chủ và bản tạm.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - ({'a', 'b'} | {'b', 'c'}) | {'d'} == {'d'} | ({'b', 'c'} | {'a', 'b'}) == {'a', 'b', 'c', 'd'}
  - '{''a'', ''b''} | {''b'', ''c''} == {''a'', ''b'', ''c''} and {''d''} | {''b'', ''c''} == {''b'', ''c'', ''d''} and {''b'',
    ''c'', ''d''} | {''a'', ''b''} == {''a'', ''b'', ''c'', ''d''}'
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Ba máy ngoại tuyến lần lượt thêm {a, b}, {b, c}, {d}. Đồng bộ theo thứ tự bất kỳ bằng hợp tập: kết
      quả là gì? Thứ tự có ảnh hưởng không?</td></tr>

      <tr><td>2</td><td>Trường “tiêu đề ghi chú” là một chuỗi, hai người cùng sửa khác nhau. Hợp tập có dùng được không? Nên
      làm gì?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, ba máy ngoại tuyến lần lượt thêm a và b, b và c, và d. Đồng bộ theo thứ tự
      bất kỳ bằng hợp tập thì kết quả là gì? Thứ tự có ảnh hưởng không? Câu hai, trường tiêu đề ghi chú là một chuỗi, và hai
      người cùng sửa khác nhau. Hợp tập có dùng được không? Nên làm gì? Dừng video và làm ra giấy. Phân biệt dữ liệu cho phép
      hợp nhất tự động với dữ liệu nhạy cảm bắt buộc phát hiện xung đột theo phiên bản.
    pause: 15
  - clear: true
    show: '<table class="t"><tr><th>thứ tự</th><th>bước 1</th><th>bước 2</th></tr>

      <tr><td>xuôi</td><td>{a, b} hợp {b, c} = {a, b, c}</td><td>hợp {d} = <b>{a, b, c, d}</b></td></tr>

      <tr><td>ngược</td><td>{d} hợp {b, c} = {b, c, d}</td><td>hợp {a, b} = <b>{a, b, c, d}</b></td></tr></table>

      <p>① <b>{a, b, c, d}</b>; thứ tự <b>không</b> ảnh hưởng — hợp tập <b>giao hoán</b> (đổi chỗ hai tập không đổi kết quả),
      <b>kết hợp</b> (gộp cặp nào trước cũng được), và lặp lại vô hại.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    - 2
    say: Đáp án câu một, ta làm từng bước theo hai thứ tự để thấy rõ. Theo thứ tự xuôi, a, b hợp b, c được a, b, c, rồi hợp
      với d được a, b, c, d. Theo thứ tự ngược, d hợp b, c được b, c, d, rồi hợp với a, b cũng được a, b, c, d. Kết quả là
      a, b, c, d, và thứ tự không ảnh hưởng, vì ba tính chất của phép hợp. Hợp tập có tính giao hoán, tức đổi chỗ hai tập
      không đổi kết quả, có tính kết hợp, tức gộp cặp nào trước cũng được, và lặp lại vô hại. Theo dõi hàng đợi hai thiết
      bị sửa chéo lúc ngoại tuyến rồi kết nối lại với chiến lược số phiên bản tăng dần.
  - show: '<p>② Không: một chuỗi không phải tập — hợp hai chuỗi không có nghĩa, ghi sau thắng thì mất một bản. Giữ cả hai
      bản và cho người dùng chọn, hoặc dùng cấu trúc hợp nhất văn bản theo từng ký tự.</p>

      '
    say: Câu hai, không dùng được, vì một chuỗi không phải tập, nên hãy giữ cả hai bản và cho người dùng chọn, hoặc dùng cấu
      trúc hợp nhất văn bản theo từng ký tự. Đây là lúc ta phải chọn cách hợp nhất theo ý nghĩa của từng loại dữ liệu, không
      có một cách chung cho mọi trường. Chỉ ra lý do đồng hồ máy người dùng không đáng tin cậy để phán xét ai sửa sau trong
      hệ phân tán.
