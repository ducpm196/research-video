scenes:
- id: hook
  kind: hook
  title: Hai người cùng thêm việc, một việc biến mất
  steps:
  - show: '<p>Hai vợ chồng dùng chung danh sách việc nhà. Trong thang máy, không có mạng, vợ thêm “mua sữa”, chồng thêm “gọi
      mẹ”. Ra khỏi thang máy, hai máy đồng bộ — và danh sách chỉ còn <b>một</b> việc. Máy chủ đã giữ bản ghi sau, ghi đè bản
      kia.</p>

      <div class="box key">Hôm nay: <b>ngoại tuyến trước</b> — làm việc không cần mạng, rồi đồng bộ mà không mất dữ liệu.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, hai vợ chồng dùng chung một danh sách việc nhà. Trong thang máy, không có mạng, vợ thêm mua sữa, còn chồng
      thêm gọi mẹ. Ra khỏi thang máy, hai máy đồng bộ, và danh sách chỉ còn một việc. Máy chủ đã giữ bản ghi sau, và ghi đè
      bản kia. Hôm nay ta học ngoại tuyến trước, làm việc không cần mạng, rồi đồng bộ mà không mất dữ liệu. Người dùng đi
      vào thang máy mất sóng đúng lúc nhấn nút lưu ghi chú rồi mất trắng bài viết vì ứng dụng đòi hỏi kết nối trực tuyến liên
      tục.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: phép hợp hai tập, và làm lại không đổi kết quả'
  checks:
  - '{''a'', ''b''} | {''b'', ''c''} == {''a'', ''b'', ''c''} == {''b'', ''c''} | {''a'', ''b''}'
  - '{''a'', ''b''} | {''a'', ''b''} == {''a'', ''b''}'
  steps:
  - show: '<p><b>Hợp</b> hai tập: gom mọi phần tử của cả hai, phần tử chung chỉ giữ <b>một lần</b>.</p>

      <table class="t"><tr><th>phép</th><th>kết quả</th></tr>

      <tr><td>{a, b} hợp {b, c}</td><td>{a, b, c} — “b” chỉ một lần</td></tr>

      <tr><td>{b, c} hợp {a, b} (đổi thứ tự)</td><td>{a, b, c} — như cũ</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    say: Trước hết, ôn phép hợp hai tập, gom mọi phần tử của cả hai tập, và phần tử chung chỉ giữ một lần. Bảng làm thử hai
      phép hợp với các chữ cái. Tập a, b hợp với tập b, c cho tập a, b, c, và chữ b chỉ xuất hiện một lần. Đổi thứ tự, lấy
      b, c hợp với a, b, kết quả vẫn là a, b, c như cũ. Kiến trúc ngoại tuyến trước xem lưu trữ cục bộ ngay trên thiết bị
      là nguồn đọc ghi chính thức đầu tiên để phản hồi giao diện tức thì.
  - show: '<p>Ở bài 6 ta gọi một thao tác là <b>lũy đẳng</b> khi làm hai lần cũng như làm một lần. Phép hợp có tính chất đó:</p>

      <p>{a, b} hợp {a, b} $=$ {a, b} — nhận trùng một gói tin cũng vô hại.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Ở bài 6 ta gọi một thao tác là lũy đẳng khi làm hai lần cũng cho kết quả như làm một lần, ví dụ gửi lại một yêu cầu
      có mã không tạo thêm đơn mới. Phép hợp có đúng tính chất đó, tập a, b hợp với chính nó vẫn là a, b, nên nhận trùng một
      gói tin cũng vô hại. Hàng đợi thao tác ghi nhớ các thay đổi phát sinh lúc mất mạng theo thứ tự thời gian kèm khoá chống
      lặp để tự động đồng bộ khi có sóng.
- id: sym
  kind: symbol
  title: 'Giải mã: hàng đợi thao tác và hai cách hợp nhất'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>ngoại tuyến trước</b></td><td>ghi vào kho trên máy trước, giao diện cập nhật ngay; mạng chỉ để đồng bộ</td></tr>

      <tr><td><b>hàng đợi thao tác</b></td><td>lưu từng <b>thao tác</b> (“thêm việc X, mã 7f3c”), không lưu cả danh sách;
      có mạng thì gửi lần lượt, kèm mã để gửi lại vô hại</td></tr>

      <tr><td><b>ghi sau thắng</b></td><td>giữ bản có dấu thời gian lớn hơn, bỏ bản kia</td></tr>

      <tr><td><b>hợp nhất theo nghĩa</b></td><td>kết hợp hai thay đổi theo ý nghĩa dữ liệu: danh sách chỉ thêm thì lấy <b>hợp</b>
      hai tập</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    say: Bảng có bốn khái niệm. Ngoại tuyến trước nghĩa là ghi vào kho trên máy trước, giao diện cập nhật ngay, còn mạng chỉ
      để đồng bộ. Hàng đợi thao tác lưu từng thao tác, như thêm việc X với một mã riêng, chứ không lưu cả danh sách. Khi có
      mạng thì gửi lần lượt, kèm mã để gửi lại vô hại. Ghi sau thắng giữ bản có dấu thời gian lớn hơn, và bỏ bản kia. Hợp
      nhất theo nghĩa kết hợp hai thay đổi theo ý nghĩa của dữ liệu, ví dụ danh sách chỉ thêm thì lấy hợp của hai tập. Khi
      hai thiết bị cùng chỉnh sửa một tài nguyên trong lúc chia cắt mạng, chính sách hợp nhất hoặc giải quyết xung đột theo
      phiên bản quyết định tính nhất quán cuối cùng.
