- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">ghi trên máy trước, đồng bộ sau</span><span class="a">→</span>

      <span class="n">hàng đợi thao tác có mã</span><span class="a">→</span>

      <span class="n">hợp nhất theo nghĩa thay cho ghi sau thắng</span><span class="a">→</span>

      <span class="n">không tin đồng hồ máy khách; xoá bằng dấu đã xoá</span></div>

      '
    say: Tổng kết lại, ghi trên máy trước và đồng bộ sau, với hàng đợi thao tác có mã. Hợp nhất theo nghĩa thay cho ghi sau
      thắng, không tin đồng hồ máy khách, và xoá bằng dấu đã xoá. Ngoại tuyến trước biến ứng dụng thành công cụ phản hồi tức
      thời bất chấp hầm xe, thang máy hay mạng di động chập chờn.
  - show: '<div class="box key"><b>Tư duy:</b> khi hai người cùng đúng, đừng chọn người thắng — hãy thiết kế dữ liệu để <b>giữ
      được cả hai</b>.</div>

      '
    say: Điều cần mang theo, khi hai người cùng đúng, đừng chọn người thắng, hãy thiết kế dữ liệu để giữ được cả hai. Hàng
      đợi lũy đẳng cục bộ kết hợp kiểm soát phiên bản xung đột bảo vệ an toàn mọi thay đổi của người dùng.
  - clear: true
    show: '<p class="note">Bài sau (bài 14): <b>phát hành và tiến hoá API</b> — tương thích ngược, cờ tính năng, phiên bản
      ứng dụng cũ.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 14, ta học phát hành và tiến hoá API, với tương thích ngược, cờ tính năng, và phiên bản ứng dụng cũ.
      Hẹn gặp bạn ở bài tiếp theo. Một ứng dụng di động tồn tại nhiều phiên bản cũ trên máy người dùng đồng thời đòi hỏi nghệ
      thuật tiến hoá giao diện lập trình không gãy vỡ.
