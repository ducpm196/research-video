id: L03
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 3 — JavaScript và vòng lặp sự kiện: tác vụ và tác vụ vi mô"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L03; audit/web/verify_web.py L03; WHATWG HTML Living Standard, mục 8.1.7 (vòng lặp sự kiện, hàng đợi tác vụ vi mô; bản hiện hành); ECMAScript 2024, mục 9.5 (Jobs); chạy thật bằng Node v25"
assumes: [arith]
# Quy ước: “tác vụ” = việc trong hàng đợi tác vụ (hẹn giờ, sự kiện người dùng, mạng); “tác vụ vi mô” = việc nối sau lời hứa (then), queueMicrotask.
#   Mỗi vòng: chạy hết mã đồng bộ đang chạy → chạy HẾT hàng đợi tác vụ vi mô → lấy MỘT tác vụ. Thứ tự in lấy từ Node thật (alg.node_output).
#   Mã JavaScript trong <code>; lời đọc mô tả “hẹn giờ 0 mi li giây”, “lời hứa đã xong”.
objectives:
  - "Dự đoán thứ tự chạy của mã đồng bộ, tác vụ vi mô, tác vụ hẹn giờ"
  - "Giải thích vì sao vòng lặp dài làm đơ giao diện"
  - "Chia việc nặng để giao diện còn phản hồi"
asr_reviewed:
  - {sentence: "Thêm một phép thử nữa, đổi chỗ dòng hẹn giờ và dòng lời hứa rồi chạy thật, thứ tự in vẫn y nguyên.", reason: "ASR chép “Thêm một phép thử nữa, đổ chỗ dòng hẹn giờ và dòng lời hứa trôi chạy thật, thứ tự in vẫn yên nguyên.” (0.87): lệch âm/thanh thuần Việt: đổi/đổ, rồi/trôi, i/yên — NOT_VERIFIED bằng tai người"}
  - {sentence: "A và F là mã đồng bộ, B là hẹn giờ nên vào hàng tác vụ, C và E vào hàng vi mô.", reason: "ASR chép “A và S là mã đồng bộ, B là hẹn giờ nên vào hàng tác vụ, C và E vào hàng vi mô.” (0.957): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vòng lặp 200 mi li giây chặn mọi thứ, hẹn giờ 0 mi li giây phải chạy sau khoảng 200 mi li giây, bấm nút không phản hồi, và màn hình không vẽ lại.", reason: "ASR chép “Vòng lập 200 mili dây chặn mọi thứ, hẹn giờ 0 mili dây phải chạy sau khoảng 200 mili dây, bấm nút không phản hồi và màn hình không vẽ lại.” (0.754): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: lặp/lập — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chào bạn, bạn hẹn giờ một việc sau 0 mi li giây, rồi chạy một vòng lặp tính toán 200 mi li giây.", reason: "ASR chép “Chào bạn, bạn hẹn giờ một việc sau không mê ly giây, rồi chạy một vòng lập tính toán 200 mê ly giây.” (0.792): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: lặp/lập — NOT_VERIFIED bằng tai người"}
  - {sentence: "Thứ tự in ra là gì, biết rằng D chỉ được xếp hàng sau khi C chạy xong?", reason: "ASR chép “Thứ tự in ra là gì? Biết rằng ve chỉ được xếp hàng sau khi xe chạy sống.” (0.889): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: xong/sống — NOT_VERIFIED bằng tai người"}
  - {sentence: "Kết quả là A, F, C, E, D, B, đúng như khi chạy thật.", reason: "ASR chép “Kết quả là A, F, C, E, G, B, đúng như khi chạy thật.” (0.929): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đoạn mã in A, hẹn giờ in B, nối hai bước sau lời hứa để in C rồi D, xếp thẳng một tác vụ vi mô in E, rồi in F.", reason: "ASR chép “Đoạn mã in A, hẹn giờ in B, nối hai bước sau lời hứa để in C rồi G, xếp thẳng một tác vụ vi mô in E, rồi in F.” (0.968): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hẹn giờ 0 mi li giây chạy sau 200 mi li giây"
    checks:
      - "(lambda o: o is not None and int(o[0]) >= 195)(alg.node_output('const t=Date.now();setTimeout(()=>console.log(Date.now()-t),0);const e=Date.now()+200;while(Date.now()<e){}'))"
    steps:
      - show: |
          <p>Bạn hẹn giờ một việc sau <b>0 mi li giây</b>, rồi chạy một vòng lặp tính toán 200 mi li giây. Việc hẹn giờ chạy sau… khoảng <b>200 mi li giây</b> (đo thật bằng Node, một chương trình chạy JavaScript ngoài trình duyệt; JavaScript là ngôn ngữ lập trình mà trình duyệt chạy). Trong lúc đó, nút bấm trên trang cũng không phản hồi.</p>
          <div class="box key">Hôm nay: <b>vòng lặp sự kiện</b> — một luồng duy nhất, hai hàng đợi, và luật quyết định cái gì chạy trước.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, bạn hẹn giờ một việc sau 0 mi li giây, rồi chạy một vòng lặp tính toán 200 mi li giây. Việc hẹn giờ chạy sau khoảng 200 mi li giây, đo thật bằng một chương trình chạy JavaScript ngoài trình duyệt, mà JavaScript là ngôn ngữ lập trình trình duyệt chạy. Trong lúc đó, nút bấm trên trang cũng không phản hồi. Hôm nay ta học vòng lặp sự kiện, một luồng duy nhất, hai hàng đợi, và luật quyết định cái gì chạy trước."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hàng đợi và một luồng chạy lần lượt"
    checks:
      - "(lambda q: [q.popleft() for _ in range(3)])(__import__('collections').deque(['An', 'Bình', 'Chi'])) == ['An', 'Bình', 'Chi']"
      - "200 + 5 == 205"
    steps:
      - show: |
          <p>Trước hết, <b>hàng đợi</b> là một danh sách chờ theo luật ai vào trước ra trước. Quầy thu ngân nhận An, rồi Bình, rồi Chi:</p>
          <table class="t"><tr><th></th><th>lượt 1</th><th>lượt 2</th><th>lượt 3</th></tr>
          <tr><td>vào hàng</td><td>An</td><td>Bình</td><td>Chi</td></tr>
          <tr><td>được phục vụ</td><td>An</td><td>Bình</td><td>Chi</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Trước hết, ta cần hiểu hàng đợi, là một danh sách chờ theo luật ai vào trước thì ra trước. Quầy thu ngân nhận An, rồi Bình, rồi Chi vào hàng. Họ được phục vụ đúng theo thứ tự đó, An, Bình, rồi Chi, không ai chen ngang."
      - show: |
          <p>Điều thứ hai: một <b>luồng</b> là một dòng chạy lệnh của chương trình — như một người làm việc. Nó chạy lần lượt từng lệnh, không làm hai việc cùng lúc.</p>
          <table class="t"><tr><th>trên một luồng</th><th>bắt đầu</th><th>xong lúc</th></tr>
          <tr><td>việc dài 200 ms</td><td>0</td><td>200 ms</td></tr>
          <tr><td>việc ngắn 5 ms đến sau</td><td>200</td><td>$\hl{205}$ ms</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ hai, một luồng là một dòng chạy lệnh của chương trình, giống như một người làm việc, nó chạy lần lượt từng lệnh và không làm hai việc cùng lúc. Một việc dài 200 mi li giây bắt đầu ở mốc 0 và xong ở mốc 200. Một việc ngắn chỉ 5 mi li giây đến sau phải chờ, bắt đầu ở mốc 200 và xong ở mốc 205, dù bản thân nó rất ngắn."

  - id: sym
    kind: symbol
    title: "Giải mã: một luồng, hai hàng đợi"
    steps:
      - show: |
          <table class="t"><tr><th>thành phần</th><th>chứa gì</th></tr>
          <tr><td><b>mã đồng bộ</b></td><td>đoạn mã đang chạy, từ đầu tới cuối, không ai chen vào</td></tr>
          <tr><td><b>hàng đợi tác vụ vi mô</b></td><td>việc nối sau lời hứa đã xong (<code>then</code>, <code>await</code>), <code>queueMicrotask</code></td></tr>
          <tr><td><b>hàng đợi tác vụ</b></td><td>hẹn giờ (<code>setTimeout</code>), sự kiện bấm, phản hồi mạng</td></tr></table>
          <p><b>Lời hứa</b> (Promise): một vật giữ chỗ cho kết quả sẽ có sau, ví dụ kết quả tải mạng. Khi nó <b>xong</b>, các việc đã nối sau nó bằng <code>then</code> được xếp vào hàng vi mô.</p>
          <p><b>Luật mỗi vòng</b>: chạy xong mã đồng bộ → chạy <b>hết</b> tác vụ vi mô (kể cả cái mới sinh ra) → lấy <b>một</b> tác vụ → vẽ lại màn hình nếu cần → lặp lại.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 3]
        say: "Bảng có ba thành phần. Mã đồng bộ là đoạn mã đang chạy, từ đầu tới cuối, không ai chen vào được. Hàng đợi tác vụ vi mô chứa việc nối sau một lời hứa đã xong, như sau từ khoá chờ, hoặc việc được xếp thẳng vào hàng vi mô. Hàng đợi tác vụ chứa việc hẹn giờ, sự kiện bấm, và phản hồi mạng. Lời hứa là một vật giữ chỗ cho kết quả sẽ có sau, ví dụ kết quả tải mạng, và khi nó xong thì các việc đã nối sau nó được xếp vào hàng vi mô. Luật mỗi vòng là chạy xong mã đồng bộ, chạy hết tác vụ vi mô kể cả cái mới sinh ra, lấy một tác vụ, vẽ lại màn hình nếu cần, rồi lặp lại."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một người làm, hai hàng chờ"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arW3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="560" y="40" width="380" height="150" rx="14" fill="#e0ecfb" stroke="#2a78d6" stroke-width="4"/><text x="750" y="95" font-size="28" text-anchor="middle" fill="#1f2937" font-weight="bold">luồng chính</text><text x="750" y="140" font-size="24" text-anchor="middle" fill="#1f2937">đã in: 1, 4</text><rect x="90" y="290" width="520" height="120" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="4"/><text x="350" y="335" font-size="26" text-anchor="middle" fill="#059669" font-weight="bold">hàng tác vụ vi mô</text><text x="350" y="380" font-size="24" text-anchor="middle" fill="#1f2937">chờ: in 3</text><rect x="890" y="290" width="520" height="120" rx="14" fill="#fff7ed" stroke="#eb6834" stroke-width="4"/><text x="1150" y="335" font-size="26" text-anchor="middle" fill="#eb6834" font-weight="bold">hàng tác vụ</text><text x="1150" y="380" font-size="24" text-anchor="middle" fill="#1f2937">chờ: in 2 (hẹn giờ)</text><line x1="350" y1="288" x2="600" y2="196" stroke="#059669" stroke-width="4" marker-end="url(#arW3)"/><line x1="1150" y1="288" x2="900" y2="196" stroke="#eb6834" stroke-width="4" marker-end="url(#arW3)"/><text x="330" y="240" font-size="22" text-anchor="middle" fill="#059669">ưu tiên 1: chạy hết</text><text x="1180" y="240" font-size="22" text-anchor="middle" fill="#eb6834">ưu tiên 2: lấy một việc</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình chụp lại trạng thái của ví dụ sắp làm, ngay khi mã đồng bộ vừa chạy xong và luồng chính đã in 1 và 4. Hàng tác vụ vi mô màu xanh đang có việc in 3, còn hàng tác vụ màu cam đang có việc hẹn giờ in 2. Luồng chính chỉ có một, nên nó luôn rút hết hàng xanh trước, rồi mới lấy đúng một việc ở hàng cam. Vì vậy việc in 3 chạy trước việc in 2, dù dòng hẹn giờ được viết trước."

  - id: example
    kind: example
    title: "In 1, 2, 3, 4 theo thứ tự nào?"
    checks:
      - "alg.node_output('console.log(1);setTimeout(()=>console.log(2),0);Promise.resolve().then(()=>console.log(3));console.log(4)') == ['1', '4', '3', '2']"
    steps:
      - show: |
          <div class="code"><div>console.log(1);</div><div>setTimeout(() => console.log(2), 0);</div><div>Promise.resolve().then(() => console.log(3));</div><div>console.log(4);</div></div>
          <p><b>Bước một</b> — dòng đầu là mã đồng bộ: in ngay <b>1</b>.</p>
        focus: [1, 2]
        say: "Đoạn mã in 1, hẹn giờ 0 mi li giây để in 2, nối sau một lời hứa đã xong để in 3, rồi in 4. Bước một, dòng đầu là mã đồng bộ, nên in ngay số 1."
      - show: |
          <table class="t"><tr><th>bước</th><th>dòng</th><th>xếp vào</th></tr>
          <tr><td>2</td><td>hẹn giờ 0 ms</td><td>hàng tác vụ: in 2</td></tr>
          <tr><td>3</td><td>lời hứa đã xong</td><td>hàng vi mô: in 3</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Bước hai, dòng hẹn giờ không in gì cả, nó chỉ xếp việc in 2 vào hàng tác vụ. Bước ba, dòng lời hứa đã xong cũng chưa in, nó xếp việc in 3 vào hàng tác vụ vi mô."
      - clear: true
        show: |
          <p><b>Bước 4</b> — dòng cuối in <b>4</b>; hết mã đồng bộ. Đã in: 1, 4.</p>
          <table class="t"><tr><th>giai đoạn</th><th>in ra</th></tr>
          <tr><td>mã đồng bộ</td><td>1, 4</td></tr>
          <tr><td>hết tác vụ vi mô</td><td>3</td></tr>
          <tr><td>một tác vụ (hẹn giờ)</td><td>2</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Bước bốn, dòng cuối in 4, và mã đồng bộ đã chạy hết. Bảng chia theo giai đoạn. Mã đồng bộ in 1 và 4. Sau đó chạy hết tác vụ vi mô, in 3. Cuối cùng lấy một tác vụ là việc hẹn giờ, in 2."
      - show: |
          <p><b>Bước 5</b> — ghép lại: $\hl{1, 4, 3, 2}$ — đúng như Node in ra khi chạy thật.</p>
        say: "Bước năm, ghép ba giai đoạn theo thứ tự ưu tiên của vòng lặp sự kiện. Thứ tự là 1, 4, 3, 2, đúng như khi chạy thật."

  - id: check
    kind: check
    title: "Tự kiểm: gán nhãn giai đoạn rồi sắp xếp, và đổi chỗ hai dòng"
    checks:
      - "[v for _, _, v in sorted([(0, 1, '1'), (2, 2, '2'), (1, 3, '3'), (0, 4, '4')])] == ['1', '4', '3', '2']"
      - "alg.node_output('console.log(1);Promise.resolve().then(()=>console.log(3));setTimeout(()=>console.log(2),0);console.log(4)') == ['1', '4', '3', '2']"
    steps:
      - show: |
          <table class="t"><tr><th>việc</th><th>nhãn giai đoạn</th><th>thứ tự viết</th></tr>
          <tr><td>in 1</td><td>0 (đồng bộ)</td><td>1</td></tr>
          <tr><td>in 2</td><td>2 (tác vụ)</td><td>2</td></tr>
          <tr><td>in 3</td><td>1 (vi mô)</td><td>3</td></tr>
          <tr><td>in 4</td><td>0 (đồng bộ)</td><td>4</td></tr></table>
          <p>Sắp theo (nhãn, thứ tự viết): 1, 4, 3, 2 ✓. Đổi chỗ dòng hẹn giờ và dòng lời hứa rồi chạy thật: vẫn 1, 4, 3, 2 ✓.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Kiểm bằng đường khác, ta không mô phỏng từng bước mà gán cho mỗi việc một nhãn giai đoạn, đồng bộ là 0, vi mô là 1, tác vụ là 2. Sau đó sắp xếp theo nhãn trước, theo thứ tự viết sau. Kết quả vẫn là 1, 4, 3, 2. Thêm một phép thử nữa, đổi chỗ dòng hẹn giờ và dòng lời hứa rồi chạy thật, thứ tự in vẫn y nguyên. Nghĩa là thứ tự do loại hàng đợi quyết định chứ không do vị trí dòng."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thường gặp"
    checks:
      - "alg.node_output('let n=0;setTimeout(()=>console.log(n),0);(async()=>{for(let i=0;i<100000;i++){await null;n++}})()') == ['100000']"
      - "alg.node_output('let n=0;setTimeout(()=>console.log(n),0);(async()=>{for(let i=0;i<100000;i++){if(i%1000===999)await new Promise(r=>setTimeout(r,0));n++}})()') == ['999']"
      - "(lambda o: o is not None and int(o[0]) >= 195)(alg.node_output('const t=Date.now();setTimeout(()=>console.log(Date.now()-t),0);const e=Date.now()+200;while(Date.now()<e){}'))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tính toán nặng trên luồng chính <b class="red">(trang đơ)</b>
          <br><span class="note">Vòng lặp 200 ms chặn mọi thứ: hẹn giờ 0 ms chạy sau ≈ 200 ms, bấm nút không phản hồi, màn hình không vẽ lại. Chia nhỏ việc, hoặc chuyển sang luồng nền (web worker).</span></div>
        say: "Lỗi thứ nhất, tính toán nặng trên luồng chính, nên trang bị đơ. Vòng lặp 200 mi li giây chặn mọi thứ, hẹn giờ 0 mi li giây phải chạy sau khoảng 200 mi li giây, bấm nút không phản hồi, và màn hình không vẽ lại. Hãy chia nhỏ việc, hoặc chuyển sang một luồng nền."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tác vụ vi mô tự sinh mãi <b class="red">(treo không lối ra)</b>
          <br><span class="note">Mỗi tác vụ vi mô lại xếp thêm một tác vụ vi mô: hàng đợi vi mô không bao giờ rỗng, nên không tác vụ nào và không lần vẽ nào được chạy.</span></div>
        say: "Lỗi thứ hai, tác vụ vi mô tự sinh ra mãi, nên trang treo không lối ra. Mỗi tác vụ vi mô lại xếp thêm một tác vụ vi mô, nên hàng đợi vi mô không bao giờ rỗng, và không tác vụ nào, không lần vẽ nào được chạy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tin hẹn giờ là đúng giờ <b class="red">(chỉ là “không sớm hơn”)</b>
          <br><span class="note">Hẹn 1000 ms nghĩa là “ít nhất 1000 ms”. Trình duyệt còn giãn hẹn giờ của các trang đang mở ở nền (không được xem). Đo thời gian thật bằng đồng hồ, đừng đếm số lần hẹn giờ.</span></div>
        say: "Lỗi thứ ba, tin hẹn giờ là đúng giờ, trong khi nó chỉ là không sớm hơn. Hẹn 1000 mi li giây nghĩa là ít nhất 1000 mi li giây, và trình duyệt còn giãn hẹn giờ của các trang đang mở ở nền, tức trang người dùng không xem. Hãy đo thời gian thật bằng đồng hồ, đừng đếm số lần hẹn giờ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tưởng hàm bất đồng bộ tự “nhường luồng” <b class="red">(người đã đi làm hay mắc)</b>
          <br><span class="note">Chờ một lời hứa <b>đã xong</b> chỉ xếp một tác vụ vi mô, nên vòng lặp chạy tiếp mà không nhường cho hẹn giờ hay cú bấm. Muốn nhường thật, thỉnh thoảng phải chờ một <b>tác vụ</b>. Đo bằng Node, đếm n lúc hẹn giờ 0 ms chạy:</span></div>
          <table class="t"><tr><th>vòng lặp 100 000 lần</th><th>hẹn giờ 0 ms chạy khi n =</th></tr>
          <tr><td>mỗi lần chờ một lời hứa đã xong</td><td>100 000 (sau cả vòng lặp)</td></tr>
          <tr><td>cứ 1000 lần chờ một hẹn giờ</td><td>$\hl{999}$ (gần như ngay)</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tưởng rằng cứ viết hàm bất đồng bộ là luồng chính tự được nhường cho việc khác. Thật ra chờ một lời hứa đã xong chỉ xếp một tác vụ vi mô, nên vòng lặp chạy tiếp ngay mà không nhường cho hẹn giờ hay cú bấm. Ta đo bằng một vòng lặp 100 nghìn lần, và đếm biến n lúc việc hẹn giờ 0 mi li giây được chạy. Nếu mỗi lần chỉ chờ một lời hứa đã xong, hẹn giờ chỉ chạy khi n đã lên 100 nghìn, tức sau cả vòng lặp. Nếu cứ 1000 lần lại chờ một hẹn giờ, việc hẹn giờ chạy ngay khi n bằng 999, vì lúc đó luồng chính thật sự được nhường."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.node_output(\"console.log('A');setTimeout(()=>console.log('B'),0);Promise.resolve().then(()=>console.log('C')).then(()=>console.log('D'));queueMicrotask(()=>console.log('E'));console.log('F')\") == ['A', 'F', 'C', 'E', 'D', 'B']"
    steps:
      - show: |
          <div class="code"><div>console.log('A');</div><div>setTimeout(() => console.log('B'), 0);</div><div>Promise.resolve().then(() => console.log('C')).then(() => console.log('D'));</div><div>queueMicrotask(() => console.log('E'));</div><div>console.log('F');</div></div>
          <p>Thứ tự in ra là gì? Gợi ý: <code>D</code> chỉ được xếp hàng <b>sau khi</b> <code>C</code> chạy xong.</p>
        focus: [1, 1, 2, 2]
        say: "Bây giờ đến lượt bạn tự làm. Đoạn mã in A, hẹn giờ in B, nối hai bước sau lời hứa để in C rồi D, xếp thẳng một tác vụ vi mô in E, rồi in F. Thứ tự in ra là gì, biết rằng D chỉ được xếp hàng sau khi C chạy xong? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>việc</th><th>A</th><th>B</th><th>C</th><th>E</th><th>F</th></tr>
          <tr><td>loại</td><td>đồng bộ</td><td>tác vụ</td><td>vi mô</td><td>vi mô</td><td>đồng bộ</td></tr></table>
          <p>Hàng vi mô sau mã đồng bộ: C, E. D <b>chưa có</b> trong hàng, vì nó chỉ được xếp khi C chạy xong.</p>
        focus: [1, "1.2", 2]
        say: "Đáp án, bước một, phân loại từng việc trước khi chạy. A và F là mã đồng bộ, B là hẹn giờ nên vào hàng tác vụ, C và E vào hàng vi mô. Việc D chưa có trong hàng, vì nó chỉ được xếp khi C chạy xong."
      - show: |
          <p>Đồng bộ: A, F. Tác vụ vi mô theo thứ tự xếp: C, E; C xong mới xếp D → D. Tác vụ: B.</p>
          <p>Kết quả: $\hl{A, F, C, E, D, B}$ — Node in đúng như vậy.</p>
        focus: [1, 1, 2]
        say: "Bước hai, mã đồng bộ in A và F, rồi tác vụ vi mô chạy theo thứ tự xếp là C và E. C xong mới xếp D nên in D, cuối cùng tác vụ hẹn giờ in B. Kết quả là A, F, C, E, D, B, đúng như khi chạy thật."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mã đồng bộ chạy liền một mạch</span><span class="a">→</span>
          <span class="n">hết tác vụ vi mô</span><span class="a">→</span>
          <span class="n">một tác vụ, rồi vẽ</span><span class="a">→</span>
          <span class="n">việc nặng: chia nhỏ hoặc luồng nền</span></div>
        say: "Tổng kết lại, mã đồng bộ chạy liền một mạch, sau đó chạy hết tác vụ vi mô, rồi một tác vụ và vẽ lại. Việc nặng phải chia nhỏ hoặc đưa sang luồng nền."
      - show: |
          <div class="box key"><b>Tư duy:</b> một luồng nghĩa là <b>mọi việc đều xếp hàng</b> — ai chiếm luồng lâu là bắt tất cả người khác chờ.</div>
        say: "Điều cần mang theo, một luồng nghĩa là mọi việc đều xếp hàng, và ai chiếm luồng lâu là bắt tất cả người khác chờ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 4): <b>lập trình bất đồng bộ</b> — chờ tuần tự hay chạy đồng thời.</p>
        forward_ref: true
        say: "Ở bài sau, bài 4, ta học lập trình bất đồng bộ, chờ tuần tự hay chạy đồng thời. Hẹn gặp bạn ở bài tiếp theo."
