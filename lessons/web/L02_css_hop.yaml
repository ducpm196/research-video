id: L02
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 2 — CSS: mô hình hộp, độ ưu tiên của bộ chọn, bố cục linh hoạt"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L02; audit/web/verify_web.py L02; W3C CSS Box Model Module Level 3; W3C Selectors Level 4, mục 17 (tính độ ưu tiên); W3C CSS Flexible Box Layout Module Level 1 (bản hiện hành); bài 1"
assumes: [arith, cdot]
# Quy ước: px = điểm ảnh CSS. box-sizing mặc định content-box: bề rộng chiếm = rộng nội dung + 2·đệm + 2·viền (chưa kể lề ngoài);
#   border-box: bề rộng đã gồm đệm và viền (alg.box_width). Độ ưu tiên = bộ ba (mã, lớp, thẻ), so TỪNG CỘT từ trái sang (alg.specificity).
#   Mã CSS trong <code>.
objectives:
  - "Tính kích thước hộp"
  - "So độ ưu tiên của hai bộ chọn"
  - "Dùng bố cục linh hoạt chia chỗ trống"
asr_reviewed:
  - {sentence: "Mô hình hộp đi từ trong ra ngoài, gồm nội dung, đệm, viền, và lề ngoài.", reason: "ASR chép “Mua hình hộp đi tự trong trang ngoại, gồm nội dung, đệm, viên và lề ngoài” (0.688): lệch âm/thanh thuần Việt: mô/mua, từ/tự, ra ngoài/trang ngoại, viền/viên — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bộ chọn theo tên thẻ đếm vào cột 3.", reason: "ASR chép “Bộ chọn theo tinh thẻ đếm vào cục 3.” (0.778): lệch âm/thanh thuần Việt: tên/tinh, cột/cục — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai cột 50% không nằm vừa một hàng"
    checks:
      - "alg.box_width(200, 20, 5) == 250"
    steps:
      - show: |
          <p>Bạn đặt hai cột, mỗi cột rộng 50%, thêm một chút đệm cho đẹp — và cột thứ hai rơi xuống hàng dưới. Bạn đổi màu chữ trong một tệp kiểu dáng, nhưng chữ vẫn giữ màu cũ. Cả hai đều có lý do chính xác, tính được bằng số.</p>
          <div class="box key">Hôm nay: CSS (ngôn ngữ viết phần kiểu dáng của trang: màu, cỡ, vị trí) — <b>mô hình hộp</b> (mỗi phần tử chiếm bao nhiêu chỗ) và <b>độ ưu tiên</b> (luật nào thắng khi hai luật đụng nhau).</div>
        focus: [1, 1, 1, 2, 2]
        say: "Chào bạn, bạn đặt hai cột, mỗi cột rộng 50 phần trăm, thêm một chút đệm cho đẹp, và cột thứ hai rơi xuống hàng dưới. Bạn đổi màu chữ trong một tệp kiểu dáng, nhưng chữ vẫn giữ màu cũ. Cả hai đều có lý do chính xác, tính được bằng số. Hôm nay ta học ngôn ngữ viết phần kiểu dáng của trang, tức màu, cỡ và vị trí. Ta học mô hình hộp, tức mỗi phần tử chiếm bao nhiêu chỗ, và độ ưu tiên, tức luật nào thắng khi hai luật đụng nhau."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lớp bọc cộng hai bên, và so từng cột"
    checks:
      - "20 + 2 * 3 == 26 and 26 + 2 * 1 == 28"
      - "(1, 0, 0) > (0, 5, 9) and (2, 1, 0) > (2, 0, 7)"
    steps:
      - show: |
          <p>Lồng một bức ảnh vào khung: ảnh rộng 20 cm, bìa lót 3 cm, nẹp gỗ 1 cm. Mỗi lớp bọc thêm vào <b>cả hai bên</b>, trái và phải:</p>
          <table class="t"><tr><th>lớp</th><th>bề rộng cộng dồn</th></tr>
          <tr><td>ảnh</td><td>20 cm</td></tr>
          <tr><td>+ bìa lót hai bên</td><td>$20 + 2 \cdot 3 = 26$ cm</td></tr>
          <tr><td>+ nẹp gỗ hai bên</td><td>$26 + 2 \cdot 1 = \hl{28}$ cm</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Trước hết, một việc đời thường, lồng một bức ảnh vào khung, mỗi lớp bọc thêm vào cả hai bên, bên trái và bên phải. Ảnh rộng 20 xăng ti mét. Thêm bìa lót 3 xăng ti mét mỗi bên, bề rộng thành 20 cộng 2 nhân 3, bằng 26 xăng ti mét. Thêm nẹp gỗ 1 xăng ti mét mỗi bên, thành 26 cộng 2 nhân 1, bằng 28 xăng ti mét, và chữ 2 nhân ấy chính là chỗ người mới hay quên."
      - show: |
          <p>Bảng huy chương xếp hạng bằng cách <b>so từng cột</b>: vàng trước, bằng nhau mới xét bạc, rồi đồng.</p>
          <table class="t"><tr><th>đội</th><th>(vàng, bạc, đồng)</th><th>tổng</th></tr>
          <tr><td>A</td><td>(1, 0, 0) — <b>xếp trên</b></td><td>1</td></tr>
          <tr><td>B</td><td>(0, 5, 9)</td><td>14</td></tr></table>
        focus: [1, "2.2", "2.3", 2]
        say: "Điều thứ hai là so từng cột, giống cách xếp hạng trên bảng huy chương, so số huy chương vàng trước, bằng nhau mới xét bạc, rồi mới xét đồng. Đội A có 1 vàng, không bạc, không đồng. Đội B không có vàng, nhưng có 5 bạc và 9 đồng. Đội A xếp trên vì thắng ngay ở cột vàng, dù tổng số huy chương chỉ là 1 so với 14 của đội B."

  - id: sym
    kind: symbol
    title: "Giải mã: hộp và độ ưu tiên"
    steps:
      - show: |
          <p><b>Mô hình hộp</b>: từ trong ra ngoài — nội dung, <b>đệm</b> (padding), <b>viền</b> (border), <b>lề ngoài</b> (margin). Mặc định, <code>width</code> chỉ là bề rộng <b>nội dung</b>.</p>
          <table class="t"><tr><th>bộ chọn</th><th>đếm vào cột</th></tr>
          <tr><td><code>#menu</code> (mã)</td><td>cột 1</td></tr>
          <tr><td><code>.muc</code>, <code>[type=text]</code>, <code>:hover</code> (lớp, thuộc tính, lớp giả)</td><td>cột 2</td></tr>
          <tr><td><code>a</code>, <code>li</code> (tên thẻ)</td><td>cột 3</td></tr></table>
          <p>So hai bộ chọn: so cột 1 trước; bằng nhau mới so cột 2, rồi cột 3. Bằng hết thì luật viết <b>sau</b> thắng.</p>
        focus: [1, 1, 2, "2.2", "2.3", "2.4", 3, 3]
        say: "Mô hình hộp đi từ trong ra ngoài, gồm nội dung, đệm, viền, và lề ngoài. Mặc định, thuộc tính bề rộng chỉ là bề rộng của phần nội dung. Bảng cho biết mỗi bộ chọn đếm vào cột nào. Bộ chọn theo mã, viết bằng dấu thăng, đếm vào cột 1. Bộ chọn theo lớp, thuộc tính, hay lớp giả như khi rê chuột, đếm vào cột 2. Bộ chọn theo tên thẻ đếm vào cột 3. Khi so hai bộ chọn, ta so cột 1 trước, bằng nhau mới so cột 2, rồi cột 3. Nếu bằng hết thì luật viết sau thắng."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một hộp vẽ đúng tỉ lệ: nội dung, đệm, viền"
    checks:
      - "5 + 20 + 200 + 20 + 5 == 250 == alg.box_width(200, 20, 5)"
    steps:
      - show: |
          <div><svg width="1500" height="470" viewBox="0 0 1500 470"><rect x="190" y="30" width="1120" height="340" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="10 8"/><text x="200" y="58" font-size="20" fill="#6b7280">lề ngoài (không tính vào 250)</text><rect x="250" y="70" width="1000" height="260" fill="#1f2937"/><rect x="270" y="90" width="960" height="220" fill="#fde68a"/><rect x="350" y="170" width="800" height="60" fill="#bfdbfe" stroke="#2a78d6" stroke-width="3"/><text x="750" y="210" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">nội dung 200</text><text x="310" y="208" font-size="22" text-anchor="middle" fill="#92400e">đệm</text><text x="1190" y="208" font-size="22" text-anchor="middle" fill="#92400e">đệm</text><line x1="250" y1="400" x2="1250" y2="400" stroke="#1f2937" stroke-width="3"/><line x1="250" y1="388" x2="250" y2="412" stroke="#1f2937" stroke-width="3"/><line x1="270" y1="388" x2="270" y2="412" stroke="#1f2937" stroke-width="3"/><line x1="350" y1="388" x2="350" y2="412" stroke="#1f2937" stroke-width="3"/><line x1="1150" y1="388" x2="1150" y2="412" stroke="#1f2937" stroke-width="3"/><line x1="1230" y1="388" x2="1230" y2="412" stroke="#1f2937" stroke-width="3"/><line x1="1250" y1="388" x2="1250" y2="412" stroke="#1f2937" stroke-width="3"/><text x="260" y="440" font-size="22" text-anchor="middle" fill="#1f2937">5</text><text x="310" y="440" font-size="22" text-anchor="middle" fill="#d97706">20</text><text x="750" y="440" font-size="22" text-anchor="middle" fill="#2a78d6">200</text><text x="1190" y="440" font-size="22" text-anchor="middle" fill="#d97706">20</text><text x="1240" y="440" font-size="22" text-anchor="middle" fill="#1f2937">5</text><text x="1280" y="408" font-size="26" font-weight="bold" fill="#b91c1c">= 250</text><text x="1330" y="100" font-size="22" fill="#1f2937">viền đen 5</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ đúng tỉ lệ một hộp rộng 200, đệm 20, viền 5 điểm ảnh. Phần xanh ở giữa là nội dung, đúng 200 điểm ảnh mà ta khai báo. Quanh nó là lớp đệm màu vàng, rồi lớp viền màu đen, và mỗi lớp xuất hiện ở cả bên trái lẫn bên phải. Đọc thước bên dưới từ trái sang, 5, 20, 200, 20, 5, cộng lại 250 điểm ảnh, còn lề ngoài nét đứt chỉ đẩy các hộp khác ra xa chứ không tính vào con số này."

  - id: example
    kind: example
    title: "Tính bề rộng và so độ ưu tiên"
    checks:
      - "alg.box_width(200, 20, 5) == 250 and alg.box_width(200, 20, 5, sizing='border-box') == 200"
      - "alg.specificity('#menu .muc') == (1, 1, 0) and alg.specificity('nav .muc .con') == (0, 2, 1) and (1, 1, 0) > (0, 2, 1)"
    steps:
      - show: |
          <p><code>width: 200px; padding: 20px; border: 5px solid</code>, kiểu tính mặc định. (Viền phải có kiểu nét như <code>solid</code>; thiếu kiểu nét thì viền rộng 0.)</p>
          <p><b>Bước một</b> — nội dung cộng đệm hai bên: $200 + 2 \cdot 20 = 240$ px.</p>
        focus: [1, 1, 2]
        say: "Bề rộng 200, đệm 20, viền nét liền 5 điểm ảnh, với kiểu tính mặc định, tức bề rộng chỉ là phần nội dung. Lưu ý viền phải có kiểu nét, thiếu kiểu nét thì viền rộng 0. Bước một, cộng nội dung với đệm ở hai bên, được 200 cộng 2 nhân 20, bằng 240 điểm ảnh."
      - show: |
          <p><b>Bước 2</b> — cộng viền hai bên: $240 + 2 \cdot 5 = \hl{250}$ px, tức $200 + 2 \cdot 20 + 2 \cdot 5$.</p>
        say: "Bước hai, cộng thêm viền ở hai bên, 240 cộng 2 nhân 5, bằng 250 điểm ảnh. Vậy bề rộng 200, đệm 20, viền 5 điểm ảnh thì hộp chiếm 200 cộng 2 nhân 20 cộng 2 nhân 5, bằng 250 điểm ảnh."
      - show: |
          <p><b>Bước 3</b> — thêm <code>box-sizing: border-box</code>: hộp chiếm đúng 200 px, nội dung co lại $200 - 2 \cdot 20 - 2 \cdot 5 = 150$ px.</p>
        say: "Bước ba, thêm cách tính hộp theo viền thì hộp chiếm đúng 200, và phần nội dung co lại còn 150. Đó là 200 trừ 2 nhân 20 trừ 2 nhân 5, tức đệm và viền giờ ăn vào bên trong thay vì cộng ra ngoài."
      - clear: true
        show: |
          <p><b>Bước 4</b> — đếm bộ ba (mã, lớp, thẻ) cho từng bộ chọn:</p>
          <table class="t"><tr><th>bộ chọn</th><th>mã</th><th>lớp</th><th>thẻ</th><th>(mã, lớp, thẻ)</th></tr>
          <tr><td><code>#menu .muc</code></td><td>1</td><td>1</td><td>0</td><td>(1, 1, 0)</td></tr>
          <tr><td><code>nav .muc .con</code></td><td>0</td><td>2</td><td>1</td><td>(0, 2, 1)</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước bốn, đếm bộ ba mã, lớp, thẻ cho hai bộ chọn cùng nhắm vào một phần tử. Bộ chọn có một mã và một lớp được 1, 1, 0. Bộ chọn có hai lớp và một thẻ được 0, 2, 1."
      - show: |
          <p><b>Bước 5</b> — so từng cột như bảng huy chương: cột 1, 1 &gt; 0 → <code>#menu .muc</code> <b>thắng</b>, không xét tiếp. Cộng thành một số (2 so với 3) sẽ cho kết luận <b>sai</b>.</p>
        focus: [1, 1, 1]
        say: "Bước năm, so từng cột giống bảng huy chương, và bộ chọn có một mã thắng. Ở cột 1, 1 lớn hơn 0 là xong, không xét tiếp. Nếu cộng thành một số, 2 so với 3, ta sẽ kết luận sai."

  - id: check
    kind: check
    title: "Tự kiểm: đi theo toạ độ, đếm từng ký hiệu"
    checks:
      - "(lambda xs: xs == [5, 25, 225, 245, 250])(list(__import__('itertools').accumulate([5, 20, 200, 20, 5])))"
      - "(lambda s: (s.count('#'), s.count('.'), sum(1 for w in s.split() if w[0].isalpha())))('#menu .muc') == (1, 1, 0) and (lambda s: (s.count('#'), s.count('.'), sum(1 for w in s.split() if w[0].isalpha())))('nav .muc .con') == (0, 2, 1)"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác: đi từ mép trái sang phải</th><th>toạ độ</th></tr>
          <tr><td>hết viền trái / hết đệm trái</td><td>5 / 25</td></tr>
          <tr><td>hết nội dung / hết đệm phải</td><td>225 / 245</td></tr>
          <tr><td>hết viền phải</td><td>$\hl{250}$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, vì công thức nhớ sai thì cộng lại vẫn sai, nên ta không dùng công thức mà đi từ mép trái sang phải và ghi toạ độ từng mép. Hết viền trái ở 5, hết đệm trái ở 25. Hết nội dung ở 225, hết đệm phải ở 245. Hết viền phải ở 250, khớp con số tính bằng công thức."
      - show: |
          <table class="t"><tr><th>đếm thẳng ký hiệu</th><th>dấu thăng</th><th>dấu chấm</th><th>từ bắt đầu bằng chữ</th></tr>
          <tr><td><code>#menu .muc</code></td><td>1</td><td>1</td><td>0</td></tr>
          <tr><td><code>nav .muc .con</code></td><td>0</td><td>2</td><td>1 ✓</td></tr></table>
        focus: [1, 1, "1.3"]
        say: "Với độ ưu tiên, ta đếm thẳng các ký hiệu trong chuỗi, vì mỗi loại bộ chọn có một ký hiệu riêng. Dấu thăng là mã, dấu chấm là lớp, còn chữ đứng đầu một từ là tên thẻ. Đếm như vậy vẫn ra 1, 1, 0 và 0, 2, 1, khớp với bảng ở bước bốn."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thường gặp"
    checks:
      - "2 * alg.box_width(50, 10, 0) > 100 and 2 * alg.box_width(50, 10, 0, sizing='border-box') == 100"
      - "alg.specificity('.nav .item a') == (0, 2, 1) and alg.specificity('.moi') == (0, 1, 0) and (0, 2, 1) > (0, 1, 0) and alg.specificity('.nav .item a.moi') == (0, 3, 1)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên đệm và viền khi chia cột <b class="red">(rơi xuống hàng)</b>
          <br><span class="note">Hai cột 50% cộng đệm 10 px mỗi bên: tổng vượt 100%. Đặt <code>box-sizing: border-box</code> cho mọi phần tử ngay từ đầu.</span></div>
        say: "Lỗi thứ nhất, quên đệm và viền khi chia cột, nên cột rơi xuống hàng dưới. Hai cột 50 phần trăm cộng đệm 10 điểm ảnh mỗi bên thì tổng vượt 100 phần trăm. Hãy đặt cách tính hộp theo viền cho mọi phần tử ngay từ đầu."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Thắng bằng <code>!important</code> <b class="red">(cuộc chạy đua không lối ra)</b>
          <br><span class="note">Cờ <code>!important</code> ép một luật thắng trước cả việc so bộ ba; luật khác muốn thắng lại cũng phải có cờ đó. Mỗi lần ép thắng là lần sau phải ép mạnh hơn. Giữ bộ chọn nông (một lớp là đủ), tránh bộ chọn theo mã cho kiểu dáng.</span></div>
        say: "Lỗi thứ hai, ép thắng bằng cờ quan trọng, nên rơi vào cuộc chạy đua không lối ra. Cờ quan trọng ép một luật thắng trước cả việc so bộ ba, nên luật khác muốn thắng lại cũng phải gắn cờ đó. Mỗi lần ép thắng là lần sau phải ép mạnh hơn. Hãy giữ bộ chọn nông, một lớp là đủ, và tránh bộ chọn theo mã cho kiểu dáng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Căn bố cục bằng số cố định <b class="red">(vỡ trên điện thoại)</b>
          <br><span class="note">Ba thẻ rộng 400 px không vừa màn hình 360 px. Dùng bố cục linh hoạt: <code>display: flex; flex: 1</code> chia chỗ trống, <code>flex-wrap: wrap</code> cho xuống hàng.</span></div>
        say: "Lỗi thứ ba, căn bố cục bằng số cố định, nên vỡ trên điện thoại. Ba thẻ rộng 400 điểm ảnh không vừa màn hình 360 điểm ảnh. Hãy dùng bố cục linh hoạt, cho các phần tử chia nhau chỗ trống, và cho phép xuống hàng khi hết chỗ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tưởng “luật của mình viết sau nên thắng” thư viện kiểu dáng có sẵn <b class="red">(người đã đi làm hay mắc)</b>
          <br><span class="note">“Viết sau thắng” chỉ phân xử khi bộ ba <b>bằng hết</b>. Đọc bộ ba của thư viện trước, rồi viết bộ chọn đủ mạnh.</span></div>
          <table class="t"><tr><th>bộ chọn</th><th>(mã, lớp, thẻ)</th><th>kết quả</th></tr>
          <tr><td>thư viện: <code>.nav .item a</code></td><td>(0, 2, 1)</td><td><b>thắng</b>, dù viết trước</td></tr>
          <tr><td>của mình: <code>.moi</code> (lớp gắn trên chính liên kết)</td><td>(0, 1, 0)</td><td>thua ở cột 2</td></tr>
          <tr><td>sửa: <code>.nav .item a.moi</code></td><td>(0, 3, 1)</td><td>$\hl{\text{thắng}}$ ở cột 2</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, dùng một thư viện kiểu dáng có sẵn, rồi tưởng luật của mình viết sau nên sẽ thắng. Thật ra viết sau thắng chỉ phân xử khi bộ ba bằng nhau hết, nên phải đọc bộ ba của thư viện trước. Bảng so ba bộ chọn cùng nhắm vào một liên kết. Bộ chọn của thư viện được 0, 2, 1 và thắng, dù nó được viết trước. Bộ chọn một lớp của mình chỉ được 0, 1, 0, nên thua ngay ở cột 2. Cách sửa là thêm một lớp riêng vào bộ chọn của thư viện, được 0, 3, 1, và thắng ở cột 2 mà không cần cờ quan trọng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "2 * 16 == 32 and 2 * 2 == 4 and alg.box_width(500, 10, 0) == 520 and 2 * 520 == 1040 > 1000 and 2 * alg.box_width(500, 10, 0, sizing='border-box') == 1000"
      - "alg.box_width(300, 16, 2) == 336 and alg.specificity('ul li:hover') == (0, 1, 2) and alg.specificity('.x.y.z') == (0, 3, 0) and (0, 3, 0) > (0, 1, 2)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td><code>width: 300px; padding: 16px; border: 2px solid</code>, kiểu mặc định: hộp chiếm bao nhiêu?</td></tr>
          <tr><td>2</td><td><code>ul li:hover</code> và <code>.x.y.z</code>: độ ưu tiên mỗi cái? Cái nào thắng?</td></tr>
          <tr><td>3</td><td>Quyết định: khung rộng 1000 px, hai cột <code>width: 500px; padding: 10px</code>, kiểu mặc định. Vừa một hàng không? Sửa thế nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, bề rộng 300, đệm 16, viền nét liền 2 điểm ảnh, kiểu tính mặc định, hộp chiếm bao nhiêu? Câu hai, bộ chọn hai thẻ kèm lớp giả rê chuột, và bộ chọn ba lớp, độ ưu tiên mỗi cái là bao nhiêu? Cái nào thắng? Câu ba là một quyết định, khung rộng 1000 điểm ảnh chứa hai cột, mỗi cột rộng 500 với đệm 10 điểm ảnh, hai cột có vừa một hàng không, và sửa thế nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Đệm hai bên $2 \cdot 16 = 32$, viền hai bên $2 \cdot 2 = 4$ → $300 + 2 \cdot 16 + 2 \cdot 2 = \hl{336}$ px.</p>
        say: "Đáp án câu một, đệm hai bên là 2 nhân 16 bằng 32, viền hai bên là 2 nhân 2 bằng 4. Cộng lại, 300 cộng 2 nhân 16 cộng 2 nhân 2, bằng 336 điểm ảnh."
      - show: |
          <table class="t"><tr><th>bộ chọn</th><th>mã</th><th>lớp</th><th>thẻ</th></tr>
          <tr><td><code>ul li:hover</code></td><td>0</td><td>1 (lớp giả)</td><td>2</td></tr>
          <tr><td><code>.x.y.z</code></td><td>0</td><td>$\hl{3}$</td><td>0</td></tr></table>
          <p>② Cột 1 hoà; cột 2: 3 &gt; 1 → <b><code>.x.y.z</code> thắng</b>, dù có ít thẻ hơn.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, đếm từng bộ chọn theo ba cột. Bộ chọn có hai thẻ và lớp giả được 0, 1, 2, vì lớp giả đếm vào cột lớp. Bộ chọn ba lớp được 0, 3, 0. Bộ chọn ba lớp thắng ở cột 2, vì 3 lớn hơn 1, dù nó không có thẻ nào."
      - clear: true
        show: |
          <p>③ Mỗi cột chiếm $500 + 2 \cdot 10 = 520$ px; hai cột $2 \cdot 520 = 1040$ px, lớn hơn 1000 → <b>rơi xuống hàng</b>. Sửa: <code>box-sizing: border-box</code> → mỗi cột đúng 500, hai cột $= \hl{1000}$ px, vừa khít.</p>
        say: "Câu ba, mỗi cột chiếm 500 cộng 2 nhân 10, bằng 520 điểm ảnh, hai cột là 1040, lớn hơn 1000, nên cột thứ hai rơi xuống hàng dưới. Quyết định đúng là đặt cách tính hộp theo viền, khi đó mỗi cột chiếm đúng 500, hai cột vừa khít 1000 điểm ảnh."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">nội dung + đệm + viền + lề ngoài</span><span class="a">→</span>
          <span class="n">tính hộp theo viền cho dễ chia</span><span class="a">→</span>
          <span class="n">độ ưu tiên: so từng cột (mã, lớp, thẻ)</span><span class="a">→</span>
          <span class="n">bộ chọn nông, bố cục linh hoạt</span></div>
        say: "Tổng kết lại, mỗi hộp gồm nội dung, đệm, viền và lề ngoài, và tính hộp theo viền giúp chia cột dễ hơn. Độ ưu tiên so từng cột mã, lớp, thẻ, nên hãy giữ bộ chọn nông và dùng bố cục linh hoạt."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi kết quả “kỳ lạ”, đừng thử bừa — tìm <b>luật chính xác</b> mà máy đang áp dụng, rồi tính lại bằng tay.</div>
        say: "Điều cần mang theo, khi kết quả trông kỳ lạ, đừng thử bừa, hãy tìm luật chính xác mà máy đang áp dụng, rồi tính lại bằng tay."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>vòng lặp sự kiện</b> — tác vụ và tác vụ vi mô.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học vòng lặp sự kiện, với tác vụ và tác vụ vi mô. Hẹn gặp bạn ở bài tiếp theo."
