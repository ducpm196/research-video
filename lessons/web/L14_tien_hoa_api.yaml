id: L14
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 14 — Phát hành và tiến hoá API: tương thích ngược, cờ tính năng, phiên bản ứng dụng cũ"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L14; audit/web/verify_web.py L14; T. Preston-Werner, Semantic Versioning 2.0.0; P. Hodgson, Feature Toggles (martinfowler.com, 2017); D. Sato, Parallel Change (martinfowler.com, 2014); bài 6, 13"
assumes: [arith, power, log, approx]
# Quy ước: mỗi tuần một tỉ lệ p cố định của những người CÒN dùng bản cũ cập nhật lên bản mới (mô hình hình học, SỐ MINH HOẠ, alg.old_version_share).
#   Thay đổi “an toàn” = ứng dụng cũ vẫn chạy đúng; “phá vỡ” = ứng dụng cũ hỏng. Đổi tên trường theo “mở rộng rồi thu hẹp” (parallel change).
objectives:
  - "Thay đổi API không làm hỏng ứng dụng cũ"
  - "Ước lượng thời gian phải hỗ trợ phiên bản cũ"
  - "Dùng cờ tính năng để tách triển khai khỏi phát hành"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Web cập nhật trong một giây, ứng dụng thì không"
    checks:
      - "round(alg.old_version_share(0.3, 4), 2) == 0.24"
    steps:
      - show: |
          <p>Trang web phát hành bản mới: lần tải sau mọi người đều có. Ứng dụng di động thì khác — người dùng cập nhật khi họ muốn. Nhóm đổi tên một trường trong phản hồi API và phát hành ứng dụng mới cùng lúc. Bốn tuần sau, <b>khoảng một phần tư</b> người dùng vẫn chạy bản cũ — và màn hình thanh toán của họ trắng trơn.</p>
          <div class="box key">Hôm nay: <b>tiến hoá API</b> khi máy khách cũ còn sống rất lâu — thay đổi an toàn, mở rộng rồi thu hẹp, cờ tính năng.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, trang web phát hành bản mới thì lần tải sau mọi người đều có. Ứng dụng di động thì khác, người dùng cập nhật khi họ muốn. Nhóm đổi tên một trường trong phản hồi API và phát hành ứng dụng mới cùng lúc. Bốn tuần sau, khoảng một phần tư người dùng vẫn chạy bản cũ, và màn hình thanh toán của họ trắng trơn. Hôm nay ta học tiến hoá API khi máy khách cũ còn sống rất lâu, với thay đổi an toàn, mở rộng rồi thu hẹp, và cờ tính năng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: giảm theo phần trăm của phần còn lại, và trường trong phản hồi API"
    checks:
      - "round(100 * 0.7) == 70 and round(70 * 0.7) == 49 and 100 - 2 * 30 == 40"
      - "2 ** 3 == 8 and round(0.7 ** 2, 2) == 0.49"
    steps:
      - show: |
          <p>Mỗi tuần 30% <b>của những người còn lại</b> rời đi, tức còn lại 70% của phần còn lại:</p>
          <table class="t"><tr><th>tuần</th><th>còn lại (từ 100 người)</th></tr>
          <tr><td>0</td><td>100</td></tr>
          <tr><td>1</td><td>$100 \times 0{,}7 = 70$</td></tr>
          <tr><td>2</td><td>$70 \times 0{,}7 = \hl{49}$ — không phải $100 - 30 - 30 = 40$</td></tr></table>
        focus: [1, 2, "2.3", "2.4"]
        say: "Trước hết, ôn cách giảm theo phần trăm của phần còn lại. Mỗi tuần 30 phần trăm của những người còn lại rời đi, tức là còn lại 70 phần trăm của phần còn lại, như bảng bắt đầu từ 100 người. Sau tuần đầu còn 100 nhân 0 phẩy 7, bằng 70 người. Sau tuần thứ hai còn 70 nhân 0 phẩy 7, bằng 49 người, chứ không phải 100 trừ 30 trừ 30 bằng 40, vì tuần thứ hai chỉ tính 30 phần trăm của 70 người."
      - show: |
          <p>Nhân lặp lại cùng một số là <b>lũy thừa</b>: sau $n$ tuần còn $0{,}7^n$. Muốn biết <b>số mũ</b> $n$ thì dùng lôgarit; với số nhỏ có thể đếm: $2^3 = 8$ nên $2^n = 8$ cho $n = 3$, và $0{,}7^2 = 0{,}49$.</p>
        say: "Nhân lặp lại cùng một số chính là lũy thừa, nên sau n tuần còn lại 0 phẩy 7 mũ n. Khi biết kết quả mà muốn tìm số mũ n, ta dùng lôgarit, còn với số nhỏ thì có thể đếm. Ví dụ 2 mũ 3 bằng 8, nên 2 mũ n bằng 8 cho n bằng 3, và 0 phẩy 7 mũ 2 bằng 0 phẩy 49."
      - clear: true
        show: |
          <p>Ở bài 6: phản hồi API là dữ liệu gồm các <b>trường có tên</b>, ví dụ <code>{"gia": 50000}</code>. Ứng dụng đọc giá trị <b>theo tên trường</b> — đổi tên thành <code>gia_tien</code> thì ứng dụng cũ tìm “gia” và không thấy gì.</p>
        say: "Ở bài 6 ta đã thiết kế API, và phản hồi API là dữ liệu gồm các trường có tên, ví dụ trường giá bằng 50 nghìn. Ứng dụng đọc giá trị theo tên trường, nên nếu máy chủ đổi tên trường thành giá tiền, ứng dụng cũ vẫn tìm trường giá và không thấy gì."

  - id: sym
    kind: symbol
    title: "Giải mã: thay đổi an toàn và phá vỡ"
    steps:
      - show: |
          <table class="t"><tr><th>thay đổi phản hồi API</th><th>ứng dụng cũ</th></tr>
          <tr><td>thêm trường mới</td><td><b>an toàn</b> (nếu ứng dụng bỏ qua trường lạ)</td></tr>
          <tr><td>xoá trường, đổi tên trường, đổi kiểu (số → chuỗi)</td><td><b>phá vỡ</b></td></tr>
          <tr><td>thêm giá trị mới cho trường liệt kê (trạng thái “đang_giao_lại”)</td><td>phá vỡ, nếu ứng dụng không có nhánh “giá trị lạ”</td></tr></table>
          <p><b>Mở rộng rồi thu hẹp</b>: ① thêm trường mới, máy chủ trả <b>cả hai</b> ② phát hành ứng dụng đọc trường mới ③ chờ số người dùng bản cũ đủ nhỏ ④ mới bỏ trường cũ.</p>
          <p><b>Cờ tính năng</b>: mã mới đã triển khai nhưng tắt; bật dần theo nhóm người dùng, tắt ngay nếu lỗi — không cần phát hành lại.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2, 2, 3]
        say: "Bảng phân loại thay đổi trong phản hồi API. Thêm trường mới là an toàn, nếu ứng dụng bỏ qua trường lạ. Xoá trường, đổi tên trường, hay đổi kiểu từ số sang chuỗi là phá vỡ. Thêm giá trị mới cho một trường liệt kê, như trạng thái đang giao lại, cũng phá vỡ nếu ứng dụng không có nhánh cho giá trị lạ. Cách mở rộng rồi thu hẹp gồm bốn bước. Thêm trường mới và máy chủ trả cả hai trường, phát hành ứng dụng đọc trường mới, chờ số người dùng bản cũ đủ nhỏ, rồi mới bỏ trường cũ. Đây là cách an toàn để đổi tên trường mà không làm hỏng ai. Cờ tính năng là mã mới đã triển khai nhưng còn tắt, được bật dần theo nhóm người dùng, và tắt ngay nếu lỗi, không cần phát hành lại."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bản cũ tắt dần, không tắt ngay"
    checks:
      - "[round(0.7 ** w * 100, 1) for w in range(10)] == [100.0, 70.0, 49.0, 34.3, 24.0, 16.8, 11.8, 8.2, 5.8, 4.0]"
    steps:
      - show: |
          <div><svg width="1500" height="440" viewBox="0 0 1500 440"><rect x="230" y="80" width="90" height="250" fill="#b91c1c" opacity="0.8"/><text x="275" y="70" font-size="20" text-anchor="middle" fill="#1f2937">100%</text><text x="275" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 0</text><rect x="350" y="155" width="90" height="175" fill="#b91c1c" opacity="0.8"/><text x="395" y="145" font-size="20" text-anchor="middle" fill="#1f2937">70%</text><text x="395" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 1</text><rect x="470" y="208" width="90" height="122" fill="#b91c1c" opacity="0.8"/><text x="515" y="198" font-size="20" text-anchor="middle" fill="#1f2937">49%</text><text x="515" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 2</text><rect x="590" y="244" width="90" height="86" fill="#b91c1c" opacity="0.8"/><text x="635" y="234" font-size="20" text-anchor="middle" fill="#1f2937">34,3%</text><text x="635" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 3</text><rect x="710" y="270" width="90" height="60" fill="#b91c1c" opacity="0.8"/><text x="755" y="260" font-size="20" text-anchor="middle" fill="#1f2937">24%</text><text x="755" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 4</text><rect x="830" y="288" width="90" height="42" fill="#b91c1c" opacity="0.8"/><text x="875" y="278" font-size="20" text-anchor="middle" fill="#1f2937">16,8%</text><text x="875" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 5</text><rect x="950" y="301" width="90" height="29" fill="#b91c1c" opacity="0.8"/><text x="995" y="291" font-size="20" text-anchor="middle" fill="#1f2937">11,8%</text><text x="995" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 6</text><rect x="1070" y="309" width="90" height="21" fill="#b91c1c" opacity="0.8"/><text x="1115" y="299" font-size="20" text-anchor="middle" fill="#1f2937">8,2%</text><text x="1115" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 7</text><rect x="1190" y="316" width="90" height="14" fill="#b91c1c" opacity="0.8"/><text x="1235" y="306" font-size="20" text-anchor="middle" fill="#1f2937">5,8%</text><text x="1235" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 8</text><rect x="1310" y="320" width="90" height="10" fill="#059669" opacity="0.8"/><text x="1355" y="310" font-size="20" text-anchor="middle" fill="#1f2937">4%</text><text x="1355" y="360" font-size="20" text-anchor="middle" fill="#1f2937">tuần 9</text><line x1="210" y1="317.5" x2="1430" y2="317.5" stroke="#d97706" stroke-width="3" stroke-dasharray="10 8"/><text x="200" y="324" font-size="20" text-anchor="end" fill="#d97706">ngưỡng 5%</text><line x1="210" y1="330" x2="1430" y2="330" stroke="#1f2937" stroke-width="2"/><rect x="230" y="380" width="1070" height="44" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="770" y="410" font-size="21" text-anchor="middle" fill="#2a78d6">máy chủ trả cả trường cũ lẫn trường mới</text><rect x="1310" y="380" width="90" height="44" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="1355" y="410" font-size="19" text-anchor="middle" fill="#059669">bỏ cũ</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ tỉ lệ người còn dùng bản cũ qua từng tuần, khi mỗi tuần 30 phần trăm số người còn lại cập nhật. Cột tụt nhanh lúc đầu rồi chậm dần, vì mỗi tuần chỉ bớt 30 phần trăm của phần còn lại, nên đường cong không bao giờ chạm 0. Cột đỏ còn trên ngưỡng 5 phần trăm tới hết tuần 8, chỉ tuần 9 mới xuống dưới ngưỡng. Dải xanh ở dưới là thời gian máy chủ phải trả cả trường cũ lẫn trường mới, và chỉ sau đó mới bỏ được trường cũ."

  - id: example
    kind: example
    title: "Bao lâu thì bản cũ đủ ít?"
    checks:
      - "[round(alg.old_version_share(0.3, w), 3) for w in (1, 2, 4, 8)] == [0.7, 0.49, 0.24, 0.058]"
      - "round(1 - 0.3, 1) == 0.7 and math.isclose(0.7 ** 4, 0.49 ** 2) and math.isclose(0.7 ** 8, (0.7 ** 4) ** 2) and round(10**6 * alg.old_version_share(0.3, 8)) == 57648"
    steps:
      - show: |
          <p><b>Bước một — sau 1 tuần</b>: 30% người dùng cập nhật, còn $1 - 0{,}3 = 0{,}7$ = <b>70%</b> dùng bản cũ.</p>
        say: "Bước một, bảng giả định mỗi tuần 30 phần trăm số người còn lại cập nhật, một số minh hoạ. Sau 1 tuần còn 1 trừ 0 phẩy 3, bằng 0 phẩy 7, tức 70 phần trăm dùng bản cũ."
      - show: |
          <p><b>Bước 2 — sau 2 tuần</b>: lấy 70% của 70%: $0{,}7^2 = 0{,}49$ = <b>49%</b>.</p>
        say: "Bước hai, tuần thứ hai lại lấy 70 phần trăm của phần còn lại. Sau 2 tuần còn 0 phẩy 7 bình phương, bằng 49 phần trăm."
      - clear: true
        show: |
          <p><b>Bước 3 — nhân đôi số tuần thì bình phương</b>: $0{,}7^4 = 0{,}49^2$, $0{,}7^8 = (0{,}7^4)^2$.</p>
          <table class="t"><tr><th>số tuần (mỗi tuần 30% người còn lại cập nhật — số minh hoạ)</th><th>còn dùng bản cũ</th></tr>
          <tr><td>1</td><td>$0{,}7$ = 70%</td></tr>
          <tr><td>2</td><td>$0{,}7^2 = 49\%$</td></tr>
          <tr><td>4</td><td>$0{,}7^4 \approx \hl{24\%}$</td></tr>
          <tr><td>8</td><td>$0{,}7^8 \approx 5{,}8\%$</td></tr></table>
        focus: [1, 2, "2.4", "2.5"]
        say: "Bước ba, nhân đôi số tuần thì chỉ cần bình phương kết quả cũ, nên 0 phẩy 7 mũ 4 bằng 0 phẩy 49 bình phương. Bảng gom các kết quả theo số tuần. Sau 4 tuần còn 0 phẩy 7 mũ 4, khoảng 24 phần trăm. Sau 8 tuần vẫn còn khoảng 5 phẩy 8 phần trăm."
      - show: |
          <p><b>Bước 4 — quyết định</b>: sau hai tháng vẫn còn gần 6% — với một triệu người dùng là $1\,000\,000 \times 0{,}0576 \approx \hl{57\,648}$, gần 58 nghìn người. Máy chủ phải trả trường cũ ít nhất chừng đó, hoặc buộc cập nhật bằng một phiên bản tối thiểu.</p>
        say: "Bước bốn là một quyết định. Sau hai tháng vẫn còn gần 6 phần trăm, với một triệu người dùng là gần 58 nghìn người. Máy chủ phải trả trường cũ ít nhất chừng đó, hoặc buộc cập nhật bằng một phiên bản tối thiểu."

  - id: check
    kind: check
    title: "Tự kiểm: mô phỏng từng người dùng"
    checks:
      - "(lambda r: __import__('functools').reduce(lambda a, _: a + [sum(1 for _ in range(a[-1]) if r.random() >= 0.3)], range(9), [100000]))(__import__('random').Random(14))[1:] == [69787, 48905, 34388, 24000, 16888, 11837, 8293, 5863, 4099]"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác: máy tung xúc xắc cho 100 000 người, mỗi tuần mỗi người còn lại có 30% cơ hội cập nhật</th><th>còn bản cũ</th><th>công thức</th></tr>
          <tr><td>sau 4 tuần</td><td>24 000 người = 24,0%</td><td>24% ✓</td></tr>
          <tr><td>sau 8 tuần</td><td>5863 người ≈ 5,9%</td><td>5,8% ✓</td></tr>
          <tr><td>sau 9 tuần</td><td>4099 người ≈ 4,1%</td><td>dưới 5% ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không dùng công thức mà cho máy tung xúc xắc cho 100 nghìn người, mỗi tuần mỗi người còn dùng bản cũ có 30 phần trăm cơ hội cập nhật. Sau 4 tuần máy đếm được 24 nghìn người còn bản cũ, nghĩa là đúng 24 phần trăm như công thức. Sau 8 tuần còn 5863 người, khoảng 5 phẩy 9 phần trăm, sát với 5 phẩy 8 phần trăm của công thức. Sau 9 tuần còn 4099 người, khoảng 4 phẩy 1 phần trăm, đã xuống dưới 5 phần trăm."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thường gặp"
    checks:
      - "[10**6 * p // 100 for p in (1, 10, 50, 100)] == [10000, 100000, 500000, 1000000] and 1000000 // 10000 == 100"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đổi API và ứng dụng “cùng lúc” <b class="red">(không có cùng lúc với di động)</b>
          <br><span class="note">Máy chủ đổi xong trong vài phút; ứng dụng mới cần duyệt cửa hàng và người dùng tự cập nhật. Luôn để máy chủ hỗ trợ cả bản cũ lẫn bản mới trong một khoảng.</span></div>
        say: "Lỗi thứ nhất, đổi API và ứng dụng cùng lúc, trong khi với di động không có cùng lúc. Máy chủ đổi xong trong vài phút, còn ứng dụng mới cần được cửa hàng duyệt và người dùng tự cập nhật. Hãy luôn để máy chủ hỗ trợ cả bản cũ lẫn bản mới trong một khoảng thời gian."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Ứng dụng hỏng khi gặp giá trị lạ <b class="red">(máy chủ không thêm được gì)</b>
          <br><span class="note">Viết ứng dụng “khoan dung”: bỏ qua trường lạ, có nhánh mặc định cho giá trị liệt kê lạ. Đó là điều kiện để mọi thay đổi “thêm” được an toàn.</span></div>
        say: "Lỗi thứ hai, ứng dụng hỏng khi gặp giá trị lạ, nên máy chủ không thêm được gì. Hãy viết ứng dụng khoan dung, bỏ qua trường lạ, và có nhánh mặc định cho giá trị liệt kê lạ. Đó là điều kiện để mọi thay đổi kiểu thêm được an toàn."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Cờ tính năng không bao giờ được dọn <b class="red">(mã rẽ nhánh khắp nơi)</b>
          <br><span class="note">Mỗi cờ là một nhánh phải kiểm thử. Ghi ngày hết hạn cho mỗi cờ; bật hẳn xong thì xoá cờ và nhánh cũ.</span></div>
        say: "Lỗi thứ ba, cờ tính năng không bao giờ được dọn, nên mã rẽ nhánh khắp nơi. Mỗi cờ là một nhánh phải kiểm thử. Hãy ghi ngày hết hạn cho mỗi cờ, và khi đã bật hẳn thì xoá cờ cùng nhánh cũ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Có cờ tính năng nhưng bật cho <b>mọi người</b> ngay lần đầu <b class="red">(người đã đi làm hay mắc)</b>
          <br><span class="note">Kiểm thử đã qua nên tự tin bật 100%. Nếu tính năng có lỗi, cả triệu người gặp lỗi trước khi kịp tắt. Bật dần từng nấc, theo dõi lỗi ở mỗi nấc rồi mới lên nấc sau.</span></div>
          <table class="t"><tr><th>nấc bật (một triệu người dùng)</th><th>số người gặp lỗi nếu có lỗi</th></tr>
          <tr><td>1%</td><td>10 000</td></tr><tr><td>10%</td><td>100 000</td></tr><tr><td>50%</td><td>500 000</td></tr>
          <tr><td>100% ngay lần đầu</td><td>$\hl{1\,000\,000}$ — gấp 100 lần nấc 1%</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.5"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, có cờ tính năng nhưng lại bật cho mọi người ngay lần đầu. Kiểm thử đã qua nên nhóm tự tin bật một trăm phần trăm, và nếu tính năng có lỗi thì cả triệu người gặp lỗi trước khi kịp tắt. Bảng tính với một triệu người dùng, số người gặp lỗi ở từng nấc bật. Bật 1 phần trăm thì lỗi chỉ chạm 10 nghìn người, và ta tắt cờ trước khi lên nấc sau. Bật một trăm phần trăm ngay lần đầu thì cả 1 triệu người gặp lỗi, gấp 100 lần nấc đầu, nên hãy bật dần và theo dõi lỗi ở mỗi nấc."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "math.ceil(math.log(0.05) / math.log(0.7)) == 9 and alg.old_version_share(0.3, 9) < 0.05 <= alg.old_version_share(0.3, 8)"
      - "round(0.7 ** 8 * 100, 2) == 5.76 and round(0.7 ** 9 * 100, 2) == 4.04 and round(math.log(0.05) / math.log(0.7), 1) == 8.4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cùng giả định 30% mỗi tuần: sau ít nhất bao nhiêu tuần thì người dùng bản cũ xuống dưới 5%?</td></tr>
          <tr><td>2</td><td>Cần đổi trường <code>gia</code> (số nguyên đồng) thành <code>gia_tien</code> {so, don_vi}. Viết các bước an toàn.</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cùng giả định 30 phần trăm mỗi tuần, sau ít nhất bao nhiêu tuần thì người dùng bản cũ xuống dưới 5 phần trăm? Câu hai, cần đổi trường giá là số nguyên đồng thành trường giá tiền gồm số và đơn vị, hãy viết các bước an toàn. Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $0{,}7^n \lt 0{,}05 \Rightarrow n \gt \frac{\ln 0{,}05}{\ln 0{,}7} \approx 8{,}4$ → <b>$\hl{9}$ tuần</b>.</p>
          <table class="t"><tr><th>thử hai tuần sát ngưỡng</th><th>còn bản cũ</th><th>dưới 5%?</th></tr>
          <tr><td>8 tuần</td><td>$0{,}7^8 \approx 5{,}76\%$</td><td>chưa</td></tr>
          <tr><td>9 tuần</td><td>$0{,}7^9 \approx 4{,}04\%$</td><td>rồi</td></tr></table>
        introduces: [ltgt, implies]
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Đáp án câu một, cần 0 phẩy 7 mũ n nhỏ hơn 0 phẩy 05. Suy ra n lớn hơn lôgarit của 0 phẩy 05 chia lôgarit của 0 phẩy 7, khoảng 8 phẩy 4, nên cần 9 tuần. Thử lại hai tuần sát ngưỡng cho chắc chắn. Sau 8 tuần còn khoảng 5 phẩy 76 phần trăm, chưa xuống dưới 5 phần trăm. Sau 9 tuần còn khoảng 4 phẩy 04 phần trăm, đã xuống dưới ngưỡng."
      - show: |
          <p>② Máy chủ trả <b>cả</b> <code>gia</code> lẫn <code>gia_tien</code> → phát hành ứng dụng đọc <code>gia_tien</code> → chờ bản cũ dưới ngưỡng (hoặc đặt phiên bản tối thiểu) → bỏ <code>gia</code>.</p>
        say: "Câu hai, máy chủ trả cả trường cũ lẫn trường mới, phát hành ứng dụng đọc trường mới, chờ bản cũ xuống dưới ngưỡng hoặc đặt phiên bản tối thiểu, rồi mới bỏ trường cũ. Với giả định 30 phần trăm mỗi tuần ở câu một, khoảng chờ đó là ít nhất 9 tuần."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">máy khách cũ sống rất lâu</span><span class="a">→</span>
          <span class="n">chỉ thêm; ứng dụng khoan dung với cái lạ</span><span class="a">→</span>
          <span class="n">đổi tên: mở rộng rồi thu hẹp</span><span class="a">→</span>
          <span class="n">cờ tính năng tách triển khai khỏi phát hành, có hạn dọn</span></div>
        say: "Tổng kết lại, máy khách cũ sống rất lâu, nên chỉ thêm, và ứng dụng phải khoan dung với cái lạ. Đổi tên thì mở rộng rồi thu hẹp, và cờ tính năng tách triển khai khỏi phát hành, có hạn dọn."
      - show: |
          <div class="box key"><b>Tư duy:</b> một API đã phát hành là một <b>lời hứa</b> với những người bạn không kiểm soát — thay đổi nó như sửa một hợp đồng.</div>
        say: "Điều cần mang theo, một API đã phát hành là một lời hứa với những người bạn không kiểm soát, nên hãy thay đổi nó như sửa một hợp đồng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 15): <b>tình huống chuyên gia theo dòng thời gian</b> — HTTP từ phiên bản 1.0 tới 3, mỗi phiên bản sửa điểm nghẽn mà web lớn hơn làm lộ ra.</p>
        forward_ref: true
        say: "Ở bài sau, bài 15, ta đi lại hành trình của HTTP từ phiên bản 1 chấm 0 tới phiên bản 3, theo từng chặng. Mỗi lần web lớn hơn, một điểm nghẽn mới lộ ra, và ta sẽ xem chuyên gia đã sửa nó ra sao. Hẹn gặp bạn ở bài tiếp theo."
