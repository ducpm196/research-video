id: L09
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 9 — Xác thực cho web và di động: phiên, mã truy cập, ủy quyền có PKCE"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L09; audit/web/verify_web.py L09; RFC 6749 (OAuth 2.0), mục 4.1 (luồng mã ủy quyền); RFC 7636 (PKCE), mục 4 và phụ lục B (vector thử); RFC 8252 (OAuth cho ứng dụng gốc); RFC 9700 (thực hành an toàn tốt nhất cho OAuth 2.0, 2025); bài 6"
assumes: [arith]
# Quy ước: “phiên cookie” = máy chủ giữ trạng thái phiên, trình duyệt giữ mã phiên trong cookie HttpOnly. “Mã truy cập” = chuỗi có hạn, gửi kèm mỗi
#   yêu cầu API. PKCE phương thức S256: mã thách thức = base64url(SHA-256(chuỗi bí mật)) bỏ dấu “=” (alg.pkce_challenge); vector lấy nguyên từ
#   RFC 7636 phụ lục B. Nội dung phòng thủ: không hướng dẫn tấn công. Tên OAuth, PKCE chỉ trên màn hình.
objectives:
  - "So sánh phiên cookie với mã truy cập"
  - "Giải thích luồng mã ủy quyền và vì sao cần PKCE"
  - "Biết ứng dụng di động không giữ được bí mật"
