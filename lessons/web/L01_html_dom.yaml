id: L01
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 1 — HTML và cây DOM: cấu trúc và ngữ nghĩa"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L01; audit/web/verify_web.py L01; WHATWG HTML Living Standard (mục phần tử, vai trò ngữ nghĩa; bản hiện hành); W3C WAI-ARIA Authoring Practices — nút bấm (bản hiện hành); bài 0"
assumes: [arith]
# Quy ước: “phần tử” = một thẻ mở cùng nội dung tới thẻ đóng; độ sâu tính số phần tử trên đường từ gốc tới lá, gốc có độ sâu 1.
#   Đếm bằng html.parser của thư viện chuẩn Python (alg.html_tree_stats). Mã HTML viết trong <code>. DOM: mô hình đối tượng của tài liệu.
objectives:
  - "Đọc cây phần tử từ mã HTML"
  - "Chọn thẻ có ngữ nghĩa thay cho thẻ chung chung"
  - "Biết vì sao ngữ nghĩa quan trọng cho bàn phím và trình đọc màn hình"
asr_reviewed:
  - {sentence: "Thẻ HTML lồng nhau y hệt như ngoặc, thẻ mở là ngoặc mở, thẻ đóng là ngoặc đóng.", reason: "ASR chép “Thẻ HT-ML lồng nhau y hệt như ngọc, thẻ mở là ngọc mở, thẻ đóng là ngọc đóng.” (0.757): HTML đọc “hát tê em eo” theo lexicon WEB, ASR viết “html/HT ML”; lệch âm/thanh thuần Việt: ngoặc/ngọc, ngoặc/ngọc, ngoặc/ngọc — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cỡ chữ là việc của phần kiểu dáng.", reason: "ASR chép “Cở chữ là việc của phần kiểu dán.” (0.75): lệch âm/thanh thuần Việt: cỡ/cở, dáng/dán — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cây có 4 phần tử và độ sâu 3, đếm bằng một bộ đọc HTML có sẵn.", reason: "ASR chép “Cây có 4 phần tử và độ sâu 3, đếm bằng một bộ độc HT ML có sẵn.” (0.857): HTML đọc “hát tê em eo” theo lexicon WEB, ASR viết “html/HT ML”; lệch âm/thanh thuần Việt: đọc (trong “đọc html” → “độc ht ml”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khác nhau nằm ở thẻ HTML viết bên dưới.", reason: "ASR chép “Khác nhau nằm ở thẻ html viết bên dưới.” (1.0): HTML đọc “hát tê em eo” theo lexicon WEB, ASR viết “html/HT ML” — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nút bấm không bấm được bằng bàn phím"
    steps:
      - show: |
          <p>Hai nút “Thanh toán” trông giống hệt nhau trên màn hình. Người dùng chuột bấm cả hai được. Người dùng chỉ có bàn phím, hay người khiếm thị dùng trình đọc màn hình, chỉ dùng được <b>một</b> nút. Khác nhau nằm ở thẻ HTML viết bên dưới.</p>
          <div class="box key">Hôm nay: <b>HTML và cây DOM</b> — trang web là một <b>cây</b> phần tử, và mỗi thẻ mang <b>ngữ nghĩa</b> mà trình duyệt dùng để giúp người dùng.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, hai nút thanh toán trông giống hệt nhau trên màn hình. Người dùng chuột bấm cả hai được. Người dùng chỉ có bàn phím, hay người khiếm thị dùng trình đọc màn hình, chỉ dùng được một nút. Khác nhau nằm ở thẻ HTML viết bên dưới. Hôm nay ta học HTML và cây phần tử của trang, trang web là một cây phần tử, và mỗi thẻ mang ngữ nghĩa mà trình duyệt dùng để giúp người dùng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cây có gốc và ngoặc lồng nhau"
    checks:
      - "len(['D', 'Ảnh', 'Nhạc', 'a.jpg']) == 4 and len(['D', 'Ảnh', 'a.jpg']) == 3"
      - "max(__import__('itertools').accumulate(1 if c in '([' else -1 for c in '([]())')) == 2 and '([]())'.count('(') + '([]())'.count('[') == 3"
    steps:
      - show: |
          <p>Ở khoá Phân tích và thiết kế thuật toán ta đã gặp <b>cây có gốc</b>: mỗi nút có đúng một <b>cha</b>, trừ gốc. Bài này tính <b>độ sâu</b> của một nút là số nút trên đường từ gốc tới nó, gốc có độ sâu 1.</p>
          <table class="t"><tr><th>thư mục trên ổ đĩa</th><th>độ sâu</th></tr>
          <tr><td>ổ D (gốc)</td><td>1</td></tr>
          <tr><td>thư mục Ảnh, thư mục Nhạc (con của D)</td><td>2</td></tr>
          <tr><td>tệp a.jpg (con của Ảnh)</td><td>$\hl{3}$</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Trước hết, ôn lại cây có gốc, mà ta đã gặp ở khoá Phân tích và thiết kế thuật toán. Mỗi nút có đúng một cha, trừ nút gốc, và bài này tính độ sâu của một nút là số nút trên đường từ gốc tới nó, gốc có độ sâu 1. Ví dụ quen thuộc nhất là thư mục trên ổ đĩa. Ổ D là gốc của cây, nên có độ sâu bằng 1. Thư mục Ảnh và thư mục Nhạc nằm trong ổ D, nên có độ sâu 2. Tệp ảnh tên a nằm trong thư mục Ảnh, đường từ gốc là ổ D, Ảnh, rồi tệp, nên có độ sâu 3, và cả cây có 4 nút."
      - show: |
          <p>Ở khoá Lý thuyết tính toán: ngoặc <b>lồng đúng</b> thì mở sau phải đóng trước. Đọc <code>( [ ] ( ) )</code> từ trái sang, đếm số ngoặc đang mở:</p>
          <table class="t"><tr><th>đọc</th><th>(</th><th>[</th><th>]</th><th>(</th><th>)</th><th>)</th></tr>
          <tr><td>đang mở</td><td>1</td><td>$\hl{2}$</td><td>1</td><td>$\hl{2}$</td><td>1</td><td>0</td></tr></table>
          <p>Có 3 cặp ngoặc, lồng sâu nhất 2 tầng. Thẻ HTML lồng nhau y hệt ngoặc.</p>
        focus: [1, 2, "2.2", 3, 3]
        say: "Điều thứ hai, ở khoá Lý thuyết tính toán ta đã thấy ngoặc lồng đúng, tức ngoặc mở sau phải đóng trước. Đọc dãy ngoặc trên màn hình từ trái sang, và đếm số ngoặc đang mở sau mỗi ký tự. Số đếm đi 1, 2, 1, 2, 1, rồi về 0 khi đọc hết. Vậy dãy có 3 cặp ngoặc, lồng sâu nhất 2 tầng. Thẻ HTML lồng nhau y hệt như ngoặc, thẻ mở là ngoặc mở, thẻ đóng là ngoặc đóng."

  - id: sym
    kind: symbol
    title: "Giải mã: thẻ, phần tử, cây"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>ví dụ</th></tr>
          <tr><td><b>thẻ mở / thẻ đóng</b></td><td><code>&lt;li&gt;</code> … <code>&lt;/li&gt;</code></td></tr>
          <tr><td><b>phần tử</b>: thẻ mở + nội dung + thẻ đóng</td><td><code>&lt;li&gt;A&lt;/li&gt;</code></td></tr>
          <tr><td><b>cây DOM</b>: trình duyệt đọc mã thành cây; phần tử nằm trong là <b>con</b></td><td><code>ul</code> là cha của các <code>li</code></td></tr>
          <tr><td><b>ngữ nghĩa</b>: thẻ nói phần tử <b>là gì</b></td><td><code>button</code> là nút, <code>nav</code> là vùng điều hướng, <code>div</code> không nói gì</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng có bốn khái niệm. Thẻ mở và thẻ đóng bao quanh nội dung, ví dụ thẻ mở và thẻ đóng của một mục danh sách. Phần tử gồm thẻ mở, nội dung và thẻ đóng, ví dụ một mục danh sách chứa chữ A. Cây phần tử là cách trình duyệt đọc mã thành một cây, phần tử nằm bên trong là con, ví dụ thẻ danh sách là cha của các mục trong nó. Ngữ nghĩa là thẻ cho biết phần tử là gì, thẻ nút bấm là nút, thẻ điều hướng là vùng điều hướng, còn thẻ khối chung chung không nói gì cả."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Trình duyệt thấy một cây, không thấy một dòng chữ"
    steps:
      - show: |
          <div><svg width="1500" height="440" viewBox="0 0 1500 440"><text x="60" y="88" font-size="22" fill="#2a78d6" font-weight="bold">độ sâu 1</text><line x1="200" y1="80" x2="1440" y2="80" stroke="#2a78d6" stroke-width="1" stroke-dasharray="6 8"/><text x="60" y="218" font-size="22" fill="#d97706" font-weight="bold">độ sâu 2</text><line x1="200" y1="210" x2="1440" y2="210" stroke="#d97706" stroke-width="1" stroke-dasharray="6 8"/><text x="60" y="348" font-size="22" fill="#059669" font-weight="bold">độ sâu 3</text><line x1="200" y1="340" x2="1440" y2="340" stroke="#059669" stroke-width="1" stroke-dasharray="6 8"/><line x1="800" y1="112" x2="550" y2="178" stroke="#1f2937" stroke-width="3"/><line x1="800" y1="112" x2="1050" y2="178" stroke="#1f2937" stroke-width="3"/><line x1="1050" y1="242" x2="1050" y2="308" stroke="#1f2937" stroke-width="3"/><rect x="710" y="48" width="180" height="64" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="4"/><text x="800" y="89" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">ul</text><rect x="460" y="178" width="180" height="64" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="4"/><text x="550" y="219" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">li “A”</text><rect x="960" y="178" width="180" height="64" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="4"/><text x="1050" y="219" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">li “B”</text><rect x="960" y="308" width="180" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="4"/><text x="1050" y="349" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">b “!”</text><text x="1440" y="420" font-size="22" text-anchor="end" fill="#b91c1c">4 phần tử, nhánh dài nhất có 3 tầng</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cây mà trình duyệt dựng từ một dòng mã danh sách, mỗi phần tử là một ô, mỗi đường nối đi từ cha xuống con. Danh sách nằm ở tầng trên cùng, hai mục danh sách là hai con của nó ở tầng thứ hai. Phần tử in đậm nằm trong mục thứ hai, nên nó ở tầng thứ ba. Mọi việc sau này, từ tô kiểu dáng tới trình đọc màn hình, đều đi theo cây này chứ không đọc dòng chữ gốc."

  - id: example
    kind: example
    title: "Đọc cây từ một dòng mã"
    checks:
      - "alg.html_tree_stats('<ul><li>A</li><li>B<b>!</b></li></ul>') == (4, 3)"
      - "alg.html_tree_stats('<ul><li>A</li>') == (2, 2) and alg.html_tree_stats('<ul><li>A</li><li>B') == (3, 2)"
    steps:
      - show: |
          <p>Mã: <code>&lt;ul&gt;&lt;li&gt;A&lt;/li&gt;&lt;li&gt;B&lt;b&gt;!&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;</code></p>
          <p><b>Bước một</b> — đọc từ trái sang, giữ một ngăn xếp các thẻ đang mở:</p>
          <table class="t"><tr><th>đọc</th><th>đang mở</th><th>đã đếm</th><th>độ sâu</th></tr>
          <tr><td><code>&lt;ul&gt;</code></td><td>ul</td><td>1</td><td>1</td></tr></table>
        focus: [1, 2, "3.2"]
        say: "Mã gồm một danh sách có hai mục, mục thứ hai chứa một phần tử in đậm. Bước một, ta đọc mã từ trái sang và giữ một ngăn xếp các thẻ đang mở, giống hệt cách đếm ngoặc. Gặp thẻ mở danh sách, ngăn xếp có một thẻ, ta đếm được 1 phần tử ở độ sâu 1."
      - show: |
          <p><b>Bước 2</b> — mục thứ nhất mở rồi đóng ngay:</p>
          <table class="t"><tr><th>đọc</th><th>đang mở</th><th>đã đếm</th><th>độ sâu</th></tr>
          <tr><td><code>&lt;li&gt;A&lt;/li&gt;</code></td><td>ul li → còn ul</td><td>2</td><td>2</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước hai, gặp mục danh sách thứ nhất chứa chữ A, nó mở rồi đóng ngay. Lúc mở, ngăn xếp có hai thẻ, nên mục này ở độ sâu 2 và số đếm lên 2. Đọc thẻ đóng thì mục này rời ngăn xếp, chỉ còn lại thẻ danh sách."
      - clear: true
        show: |
          <p><b>Bước 3</b> — mục thứ hai, bên trong có phần tử in đậm:</p>
          <table class="t"><tr><th>đọc</th><th>đang mở</th><th>đã đếm</th><th>độ sâu</th></tr>
          <tr><td><code>&lt;li&gt;B</code></td><td>ul li</td><td>3</td><td>2</td></tr>
          <tr><td><code>&lt;b&gt;!&lt;/b&gt;</code></td><td>ul li b → còn ul li</td><td>4</td><td>$\hl{3}$</td></tr></table>
        focus: ["2.2", "2.3"]
        say: "Bước ba, gặp mục danh sách thứ hai chứa chữ B, ngăn xếp lại có hai thẻ, số đếm lên 3, độ sâu 2. Mục này chưa đóng thì đã gặp thẻ in đậm, ngăn xếp có ba thẻ, số đếm lên 4, và độ sâu lên 3, sâu nhất từ đầu tới giờ."
      - clear: true
        show: |
          <p><b>Bước 4</b> — đọc <code>&lt;/li&gt;&lt;/ul&gt;</code>: ngăn xếp rỗng, mã lồng đúng.</p>
          <div class="code"><div>ul                 độ sâu 1</div><div>├── li  "A"        độ sâu 2</div><div>└── li  "B"        độ sâu 2</div><div>    └── b  "!"     độ sâu 3</div></div>
          <p>Cây có $\hl{4}$ phần tử, độ sâu 3 (đếm bằng bộ đọc HTML của thư viện chuẩn). Trình duyệt dựng đúng cây này, rồi mới tính kiểu dáng và vẽ.</p>
        focus: [1, 2, 3, 3]
        say: "Bước bốn, đọc nốt hai thẻ đóng, ngăn xếp rỗng, nghĩa là mã lồng đúng. Sơ đồ cây cho thấy danh sách ở độ sâu 1, hai mục ở độ sâu 2, và phần tử in đậm ở độ sâu 3. Cây có 4 phần tử và độ sâu 3, đếm bằng một bộ đọc HTML có sẵn. Trình duyệt dựng đúng cây này, rồi mới tính kiểu dáng và vẽ."

  - id: check
    kind: check
    title: "Tự kiểm: đếm thẻ mở và đếm theo tầng"
    checks:
      - "(lambda s: (s.count('<'), s.count('</'), s.count('<') - s.count('</')))('<ul><li>A</li><li>B<b>!</b></li></ul>') == (8, 4, 4)"
      - "(lambda r: (sum(1 for _ in r.iter()), 1 + max(1 + max((1 for _ in c), default=0) for c in r)))(__import__('xml.etree.ElementTree').etree.ElementTree.fromstring('<ul><li>A</li><li>B<b>!</b></li></ul>')) == (4, 3)"
      - "1 + 2 + 1 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>đếm dấu mở thẻ trừ dấu đóng thẻ: 8 dấu, 4 dấu là thẻ đóng</td><td>$8 - 4 = \hl{4}$ phần tử ✓</td></tr>
          <tr><td>đếm theo tầng trong hình: 1 + 2 + 1</td><td>4 phần tử, 3 tầng ✓</td></tr>
          <tr><td>bộ đọc thứ hai (thư viện cây của Python)</td><td>4 phần tử, độ sâu 3 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không dùng ngăn xếp nữa. Cách thứ nhất, đếm dấu mở thẻ trong dòng mã, có 8 dấu, trong đó 4 dấu thuộc thẻ đóng, nên còn 8 trừ 4 bằng 4 phần tử. Cách thứ hai, đếm theo tầng trong hình, tầng một có 1, tầng hai có 2, tầng ba có 1, cộng lại 4 phần tử trên 3 tầng. Cách thứ ba, đưa cùng dòng mã cho một bộ đọc cây khác có sẵn trong thư viện chuẩn, cũng ra 4 phần tử và độ sâu 3, khớp cả ba cách."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thường gặp"
    checks:
      - "(lambda f: [sum(f[k]) for k in ('div', 'div có vai trò nút', 'button')])({'div': (0, 0, 0), 'div có vai trò nút': (0, 0, 1), 'button': (1, 1, 1)}) == [0, 1, 3]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Làm nút bằng <code>div</code> có sự kiện bấm chuột <b class="red">(bàn phím và trình đọc màn hình bỏ qua)</b>
          <br><span class="note"><code>div</code> không nhận phím Tab, không bấm được bằng Enter hay phím cách, và trình đọc màn hình không biết đó là nút. Dùng <code>&lt;button&gt;</code>: có sẵn cả ba.</span></div>
        say: "Lỗi thứ nhất, làm nút bằng thẻ khối chung chung có sự kiện bấm chuột, nên bàn phím và trình đọc màn hình bỏ qua. Thẻ đó không nhận phím chuyển tiêu điểm, không bấm được bằng Enter hay phím cách, và trình đọc màn hình không biết đó là nút. Hãy dùng thẻ nút bấm, vì nó có sẵn cả ba."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chọn tiêu đề theo cỡ chữ <b class="red">(mục lục sai)</b>
          <br><span class="note"><code>h1</code> … <code>h6</code> là cấp đề mục, không phải cỡ chữ. Người dùng trình đọc màn hình nhảy theo đề mục; bỏ cấp (từ h1 xuống h4) làm họ lạc. Cỡ chữ để cho CSS.</span></div>
        say: "Lỗi thứ hai, chọn thẻ tiêu đề theo cỡ chữ, nên mục lục sai. Sáu thẻ đề mục, từ cấp 1 tới cấp 6, là cấp đề mục, không phải cỡ chữ. Người dùng trình đọc màn hình nhảy theo đề mục, và bỏ cấp, như từ cấp 1 xuống thẳng cấp 4, làm họ lạc. Cỡ chữ là việc của phần kiểu dáng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên văn bản thay thế cho ảnh <b class="red">(ảnh câm)</b>
          <br><span class="note">Ảnh biểu đồ doanh thu không có thuộc tính <code>alt</code>: trình đọc màn hình chỉ đọc tên tệp. Viết <code>alt</code> nói điều ảnh truyền đạt; ảnh trang trí thì <code>alt=""</code>.</span></div>
        say: "Lỗi thứ ba, quên văn bản thay thế cho ảnh, nên ảnh bị câm. Ảnh biểu đồ doanh thu không có thuộc tính văn bản thay thế thì trình đọc màn hình chỉ đọc tên tệp. Hãy viết văn bản thay thế nói điều ảnh truyền đạt, còn ảnh trang trí thì để trống."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Gắn vai trò “nút” cho <code>div</code> rồi tưởng là xong <b class="red">(người đã đi làm hay mắc)</b>
          <br><span class="note">Vai trò chỉ <b>báo</b> cho trình đọc màn hình; nó không thêm phím Tab hay phím Enter. Muốn đủ thì phải tự viết thêm, nên dùng thẳng <code>&lt;button&gt;</code>.</span></div>
          <table class="t"><tr><th>viết bằng</th><th>nhận phím Tab</th><th>bấm bằng Enter, phím cách</th><th>trình đọc báo “nút”</th><th>đủ</th></tr>
          <tr><td><code>div</code></td><td>không</td><td>không</td><td>không</td><td>0 / 3</td></tr>
          <tr><td><code>div</code> có vai trò nút</td><td>không</td><td>không</td><td>có</td><td>1 / 3</td></tr>
          <tr><td><code>button</code></td><td>có</td><td>có</td><td>có</td><td>$\hl{3 / 3}$</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, sửa nút làm bằng thẻ khối chung chung bằng cách gắn thêm vai trò nút, rồi tưởng là xong. Vai trò chỉ báo cho trình đọc màn hình biết đây là nút, nó không tự thêm phím chuyển tiêu điểm hay phím Enter. Bảng so ba cách viết theo ba khả năng. Thẻ khối chung chung đạt 0 trên 3. Thêm vai trò nút chỉ đạt 1 trên 3, vì trình đọc báo đúng là nút nhưng bàn phím vẫn không dùng được. Thẻ nút bấm đạt đủ 3 trên 3 mà không phải viết thêm dòng nào."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "1 + 1 + 2 + 2 == 6"
      - "alg.html_tree_stats('<article><h1>T</h1><p>a<em>b</em> c</p></article>') == (4, 3) and alg.html_tree_stats('<nav><ul><li><a>A</a></li><li><a>B</a></li></ul></nav>') == (6, 4)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>mã — bao nhiêu phần tử, độ sâu bao nhiêu?</th></tr>
          <tr><td>1</td><td><code>&lt;article&gt;&lt;h1&gt;T&lt;/h1&gt;&lt;p&gt;a&lt;em&gt;b&lt;/em&gt; c&lt;/p&gt;&lt;/article&gt;</code></td></tr>
          <tr><td>2</td><td><code>&lt;nav&gt;&lt;ul&gt;&lt;li&gt;&lt;a&gt;A&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a&gt;B&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/nav&gt;</code></td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, một bài viết gồm một đề mục cấp 1 và một đoạn văn có chữ nhấn mạnh, có bao nhiêu phần tử và độ sâu bao nhiêu? Câu hai, một vùng điều hướng chứa danh sách hai mục, mỗi mục một liên kết, có bao nhiêu phần tử và độ sâu bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: phần tử</th><th>article</th><th>h1</th><th>p</th><th>em</th></tr>
          <tr><td>độ sâu</td><td>1</td><td>2</td><td>2</td><td>3</td></tr></table>
          <p>① Đếm: $\hl{4}$ phần tử; độ sâu 3 (article → p → em).</p>
        focus: [1, "1.2", 2]
        say: "Đáp án câu một, ta liệt kê từng phần tử cùng độ sâu của nó. Bài viết là gốc ở độ sâu 1, đề mục và đoạn văn là con ở độ sâu 2, chữ nhấn mạnh nằm trong đoạn văn nên ở độ sâu 3. Bài viết, đề mục, đoạn văn và chữ nhấn mạnh là 4 phần tử, độ sâu 3, theo đường bài viết tới đoạn văn tới chữ nhấn mạnh."
      - show: |
          <table class="t"><tr><th>câu 2: phần tử</th><th>nav</th><th>ul</th><th>li, li</th><th>a, a</th></tr>
          <tr><td>độ sâu</td><td>1</td><td>2</td><td>3</td><td>4</td></tr></table>
          <p>② Đếm: $1 + 1 + 2 + 2 = \hl{6}$ phần tử; độ sâu 4 (nav → ul → li → a).</p>
        focus: [1, "1.2", 2]
        say: "Câu hai, cũng liệt kê theo tầng. Vùng điều hướng ở độ sâu 1, danh sách ở độ sâu 2, hai mục ở độ sâu 3, và hai liên kết ở độ sâu 4. Vùng điều hướng, danh sách, hai mục và hai liên kết là 6 phần tử, độ sâu 4, theo đường vùng điều hướng tới danh sách tới mục tới liên kết."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mã HTML → cây phần tử</span><span class="a">→</span>
          <span class="n">thẻ nói phần tử là gì</span><span class="a">→</span>
          <span class="n">ngữ nghĩa cho bàn phím, trình đọc màn hình, máy tìm kiếm</span><span class="a">→</span>
          <span class="n">dùng button, đề mục đúng cấp, văn bản thay thế</span></div>
        say: "Tổng kết lại, mã HTML được đọc thành một cây phần tử, và mỗi thẻ nói phần tử là gì. Ngữ nghĩa giúp bàn phím, trình đọc màn hình và máy tìm kiếm, nên hãy dùng thẻ nút bấm, đề mục đúng cấp, và văn bản thay thế cho ảnh."
      - show: |
          <div class="box key"><b>Tư duy:</b> viết mã cho cả <b>người không nhìn thấy màn hình</b> — cái trông đúng chưa chắc là cái đúng.</div>
        say: "Điều cần mang theo, hãy viết mã cho cả người không nhìn thấy màn hình, vì cái trông đúng chưa chắc là cái đúng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>kiểu dáng</b> — mô hình hộp, độ ưu tiên của bộ chọn, bố cục linh hoạt.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học phần kiểu dáng, với mô hình hộp, độ ưu tiên của bộ chọn, và bố cục linh hoạt. Hẹn gặp bạn ở bài tiếp theo."
