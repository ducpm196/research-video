      x="380" y="260" width="250" height="40" fill="#059669"/><text x="642" y="288" font-size="22" fill="#059669">2,5 s</text><line
      x1="630" y1="170" x2="630" y2="320" stroke="#1f2937" stroke-width="3" stroke-dasharray="10 8"/><text x="640" y="350"
      font-size="20" fill="#1f2937">ngưỡng tốt 2,5 s</text><text x="380" y="350" font-size="20" text-anchor="middle" fill="#1f2937">0</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hàng trên của hình là đường kết xuất quan trọng, từ HTML tới phần kiểu dáng và mã đồng bộ, rồi dựng cây, tính bố
      cục, và vẽ. Ô đỏ là chỗ chặn, vì phần kiểu dáng và mã đồng bộ chưa tải xong thì trình duyệt chưa vẽ được gì, người dùng
      chỉ thấy màn hình trắng. Hai thanh ở dưới vẽ đúng tỉ lệ thời gian tải trên mạng 200 KB mỗi giây, thanh cam 10 giây,
      thanh xanh 2 phẩy 5 giây, ngắn hơn đúng 4 lần. Đường đứt nét là ngưỡng tốt 2 phẩy 5 giây, chỉ thanh xanh nằm trong ngưỡng
      đó. Dọn bàn ăn cho khách cần bưng ngay món khai vị lên trước thay vì bắt khách ngồi nhìn bàn trống chờ nấu xong toàn
      bộ bảy món tiệc cuối cùng.
- id: example
  kind: example
  title: Từ 10 giây xuống 2,5 giây
  checks:
  - alg.load_seconds(2e6, 200e3) == 10 and alg.load_seconds(500e3, 200e3) == 2.5
  steps:
  - show: '<p><b>Bước một — đổi về cùng đơn vị</b>: mạng tính theo KB mỗi giây, nên đổi $2$ MB $= 2 \cdot 1000 = 2\,000$ KB.</p>

      '
    say: Bước một, đổi về cùng đơn vị, vì băng thông tính theo KB mỗi giây nên kích thước cũng phải tính theo KB. Ta có 2
      MB bằng 2 nhân 1000, tức 2000 KB.
  - show: '<table class="t"><tr><th>mã kịch bản (mạng 200 KB/s)</th><th>kích thước</th><th>thời gian tải</th></tr>

      <tr><td>ban đầu: một tệp chứa mọi thứ</td><td>2 MB</td><td>$\frac{2\,000}{200} = 10$ s</td></tr></table>

      '
    focus:
    - 0
    - 1
    - '1.2'
    say: Bước hai, tính thời gian tải của bản ban đầu bằng cách chia kích thước cho băng thông. Bảng so hai bản mã kịch bản
      trên mạng 200 KB mỗi giây. Bản ban đầu là một tệp chứa mọi thứ, 2 MB, tải mất 2000 chia 200, bằng 10 giây.
  - clear: true
    show: '<p><b>Bước 3 — cắt bớt</b>:</p>

      <table class="t"><tr><th>mã kịch bản (mạng 200 KB/s)</th><th>kích thước</th><th>thời gian tải</th></tr>

      <tr><td>ban đầu: một tệp chứa mọi thứ</td><td>2 MB</td><td>10 s</td></tr>

      <tr><td>nén, bỏ mã không dùng, tách theo trang, tải phần còn lại sau</td><td>500 KB</td><td>$\frac{500}{200} = \hl{2{,}5}$
      s</td></tr></table>

      '
    focus:
    - 1
    - '2.3'
    - '2.3'
    say: Bước ba, cắt bớt những gì không cần cho lần vẽ đầu. Sau khi nén, bỏ mã không dùng, tách theo trang, và tải phần còn
      lại sau, chỉ còn 500 KB, tải mất 2 phẩy 5 giây. Kích thước giảm từ 2000 xuống 500, tức 4 lần, nên thời gian cũng giảm
      đúng 4 lần.
  - clear: true
    show: '<p><b>Bước 4 — ngân sách cho cả trang</b>: 2,5 s vừa chạm ngưỡng “tốt”, nhưng trang còn ảnh chính (giả sử 300 KB,
      số minh hoạ).</p>

      <table class="t"><tr><th>phải tải trước khi phần chính hiện ra</th><th>tổng KB</th><th>thời gian tải</th></tr>

      <tr><td>chỉ mã kịch bản</td><td>500</td><td>2,5 s</td></tr>

      <tr><td>mã + ảnh chính 300 KB</td><td>$500 + 300 = 800$</td><td>$\frac{800}{200} = \hl{4}$ s — vượt ngưỡng</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Bước bốn, con số 2 phẩy 5 giây vừa chạm ngưỡng tốt, và đó mới là thời gian tải mã, còn ảnh chính, phông chữ, và thời
      gian chạy. Giả sử ảnh chính nặng 300 KB, đây là số minh hoạ. Ảnh không chặn lần vẽ đầu, nhưng phần chính chỉ hiện ra
      khi ảnh tải xong, nên tổng phải tải là 500 cộng 300, bằng 800 KB. Thời gian tải thành 800 chia 200, bằng 4 giây, vượt
      ngưỡng tốt. Ngân sách phải chia cho cả trang, nên mã kịch bản còn phải cắt tiếp, hoặc ảnh phải nhỏ lại.
- id: check
  kind: check
  title: 'Tự kiểm: nhân ngược băng thông với thời gian'
  checks:
  - 10 * 200 == 2000 and 2.5 * 200 == 500 and 4 * 200 == 800
  - 2000 / 500 == 10 / 2.5 == 4
  steps:
  - show: '<table class="t"><tr><th>cách khác: trong t giây tải được bao nhiêu?</th><th>kết quả</th></tr>

      <tr><td>10 s × 200 KB/s</td><td>2 000 KB = 2 MB ✓</td></tr>

      <tr><td>2,5 s × 200 KB/s</td><td>500 KB ✓</td></tr>

      <tr><td>4 s × 200 KB/s</td><td>800 KB ✓</td></tr>

      <tr><td>tỉ lệ kích thước so với tỉ lệ thời gian</td><td>$\frac{2\,000}{500} = \frac{10}{2{,}5} = 4$ ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Kiểm bằng đường khác, thay vì chia, ta nhân ngược xem trong số giây đó mạng tải được bao nhiêu. Mười giây nhân 200
      KB mỗi giây được 2000 KB, đúng 2 MB. Hai phẩy 5 giây nhân 200 được 500 KB, khớp bản đã cắt. Bốn giây nhân 200 được 800
      KB, khớp tổng có ảnh chính. Cuối cùng, tỉ lệ kích thước 2000 chia 500 bằng tỉ lệ thời gian 10 chia 2 phẩy 5, đều bằng
      4, vì thời gian tỉ lệ thuận với kích thước.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi thường gặp
  checks:
  - 3 * 100 == 300
  - alg.load_seconds(2000e3, 200e3) == 10 and alg.load_seconds(100e3, 200e3) == 0.5 and 10 / 0.5 == 20
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Chuỗi tài nguyên phát hiện muộn <b class="red">(nhiều vòng khứ hồi nối tiếp)</b>

      <br><span class="note">HTML trỏ tới tệp kiểu dáng, tệp kiểu dáng mới trỏ tới phông chữ: 3 lần tải nối tiếp × 100 ms
      khứ hồi = 300 ms trước khi chữ hiện. Báo trước tài nguyên quan trọng ngay trong HTML (tải sẵn).</span></div>

      '
    say: Lỗi thứ nhất, chuỗi tài nguyên được phát hiện muộn, tạo nhiều vòng khứ hồi nối tiếp. HTML trỏ tới tệp kiểu dáng,
      tệp kiểu dáng mới trỏ tới phông chữ, nên 3 lần tải nối tiếp nhân 100 mi li giây khứ hồi là 300 mi li giây trước khi
      chữ hiện. Hãy báo trước tài nguyên quan trọng ngay trong HTML để trình duyệt tải sẵn. Đặt tệp thực thi lớn không gắn
      cờ trì hoãn ở đầu văn bản đóng băng toàn bộ quá trình phân tích nội dung chính. Nhét bộ phông chữ khổng lồ chặn hiển
      thị văn bản làm người dùng nhìn màn hình trắng suốt hai giây đầu tiên.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Ảnh không khai báo kích thước <b class="red">(nội dung nhảy chỗ)</b>

      <br><span class="note">Ảnh tải xong mới biết cao bao nhiêu, đẩy chữ xuống khi người dùng đang đọc hoặc sắp bấm. Khai
      báo tỉ lệ khung ảnh trước để trình duyệt giữ chỗ.</span></div>

      '
    say: Lỗi thứ hai, ảnh không khai báo kích thước, nên nội dung nhảy chỗ. Ảnh tải xong mới biết cao bao nhiêu, và đẩy chữ
      xuống khi người dùng đang đọc hoặc sắp bấm. Hãy khai báo tỉ lệ khung ảnh trước để trình duyệt giữ chỗ. Nhồi hình ảnh
      ảnh chụp độ phân giải khổng lồ thẳng lên thẻ khung nhỏ mà không nén và không gắn kích thước đặt chỗ sẵn.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Đo trên máy mạnh, mạng nhanh <b class="red">(không đại diện người dùng)</b>

      <br><span class="note">Thu số liệu từ người dùng thật, xem phân vị 75 và 95, tách theo loại thiết bị và mạng. Đặt <b>ngân
      sách</b> kích thước cho mỗi trang và kiểm tự động khi dựng.</span></div>

      '
    say: Lỗi thứ ba, đo trên máy mạnh và mạng nhanh, nên không đại diện người dùng. Hãy thu số liệu từ người dùng thật, xem
      phân vị 75 và 95, tách theo loại thiết bị và mạng. Đặt ngân sách kích thước cho mỗi trang, và kiểm tự động mỗi lần dựng.
      Tải cả bộ thư viện vẽ biểu đồ khổng lồ cho trang đăng nhập vốn chỉ chứa đúng hai ô chữ nhật đơn giản.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Gộp mọi mã vào một tệp lớn “cho ít yêu cầu” <b class="red">(người đã đi làm
      hay mắc)</b>

      <br><span class="note">Trình duyệt giữ bản lưu theo từng tệp. Sửa một dòng là cả tệp lớn đổi, người dùng cũ phải tải
      lại hết. Tách phần ít đổi (thư viện) khỏi phần hay đổi.</span></div>

      <table class="t"><tr><th>sửa 1 dòng, mạng 200 KB/s</th><th>phải tải lại</th><th>thời gian</th></tr>

      <tr><td>một tệp 2 MB</td><td>2 000 KB</td><td>10 s</td></tr>

      <tr><td>tách: phần hay đổi 100 KB</td><td>100 KB</td><td>$\hl{0{,}5}$ s, nhanh gấp 20</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, gộp mọi mã vào một tệp lớn cho ít yêu cầu, theo một thói quen cũ. Trình duyệt
      giữ bản lưu theo từng tệp, nên sửa một dòng là cả tệp lớn đổi. Khi đó mọi người dùng cũ phải tải lại toàn bộ tệp, dù
      họ đã có gần hết nội dung. Bảng so hai cách khi sửa một dòng trên mạng 200 KB mỗi giây. Một tệp 2 MB thì phải tải lại
      2000 KB, mất 10 giây. Nếu tách riêng phần hay đổi chỉ 100 KB thì chỉ tải lại 100 KB, mất 0 phẩy 5 giây, nhanh gấp 20
      lần. Quên dành sẵn khung chiều cao cho ảnh và khung quảng cáo khiến chữ đang đọc bị nhảy xô lệch đột ngột lúc ảnh tải
      xong.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.load_seconds(1.2e6, 150e3) == 8 and 2.5 * 150e3 / 1e3 == 375
  - 1200 - 375 == 825 and 825 / 1200 > 2 / 3 and 8 / 2.5 > 3
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Trang có 1,2 MB tài nguyên chặn hiển thị, mạng 150 KB/s. Mất bao lâu chỉ để tải?</td></tr>

      <tr><td>2</td><td>Muốn tải xong trong 2,5 s trên mạng đó, tổng tài nguyên chặn hiển thị tối đa bao nhiêu KB?</td></tr>

      <tr><td>3</td><td>Quyết định: phải cắt bớt bao nhiêu KB khỏi trang ở câu 1?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, trang có 1 phẩy 2 MB tài nguyên chặn hiển thị, mạng 150 KB mỗi giây. Mất bao
      lâu chỉ để tải? Câu hai, muốn tải xong trong 2 phẩy 5 giây trên mạng đó, tổng tài nguyên chặn hiển thị tối đa bao nhiêu
      KB? Câu ba là một quyết định, phải cắt bớt bao nhiêu KB khỏi trang ở câu một để đạt ngân sách đó? Dừng video và làm
      ra giấy. Liệt kê đúng thứ tự năm mắt xích từ cây văn bản, cây kiểu, cây kết xuất tới bố cục và vẽ điểm ảnh.
    pause: 15
  - clear: true
    show: '<p>① Đổi 1,2 MB $= 1\,200$ KB, rồi chia băng thông: $\frac{1\,200}{150} = \hl{8}$ s.</p>

      '
    say: Đáp án câu một, trước hết đổi 1 phẩy 2 MB thành 1200 KB cho cùng đơn vị với băng thông. Rồi 1200 chia 150, bằng 8
      giây, gấp hơn ba lần ngưỡng tốt. Tính mức cải thiện thời gian hiển thị phần nội dung chính khi chuyển tài nguyên phụ
      sang trì hoãn.
  - show: '<p>② Nhân ngược thời gian với băng thông: $2{,}5 \cdot 150 = \hl{375}$ KB — đó là ngân sách cho mọi thứ trên đường
      kết xuất quan trọng.</p>

      <p>③ Phải cắt $1\,200 - 375 = \hl{825}$ KB, tức hơn hai phần ba trang.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Với ngân sách thời gian, ta nhân ngược, vì trong 2 phẩy 5 giây mạng chỉ tải được số giây nhân băng thông. Câu hai,
      2 phẩy 5 nhân 150, bằng 375 KB, đó là ngân sách cho mọi thứ trên đường kết xuất quan trọng. Câu ba, phải cắt 1200 trừ
      375, bằng 825 KB, tức hơn hai phần ba trang, nên cần tách và tải sau phần lớn tài nguyên. Nhận diện hai nguyên nhân
      phổ biến nhất gây hiện tượng nhảy bố cục đột ngột và cách chặn đứng triệt để.
