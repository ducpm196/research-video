scenes:
- id: hook
  kind: hook
  title: Nhanh trên máy bạn, chậm trên điện thoại khách
  checks:
  - alg.load_seconds(2e6, 200e3) == 10
  steps:
  - show: '<p>Trên máy phát triển với mạng văn phòng, trang mở trong nửa giây. Khách hàng dùng điện thoại tầm trung, mạng
      di động yếu khoảng 200 KB mỗi giây (số minh hoạ): chỉ riêng 2 MB mã kịch bản đã mất <b>10 giây</b> để tải — chưa kể
      thời gian máy yếu chạy nó.</p>

      <div class="box key">Hôm nay: <b>hiệu năng web</b> — byte nào chặn màn hình hiện ra, và cách cắt bớt.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, trên máy phát triển với mạng văn phòng, trang mở trong nửa giây. Khách hàng dùng điện thoại tầm trung,
      mạng di động yếu khoảng 200 KB mỗi giây, một số minh hoạ. Khi đó chỉ riêng 2 MB mã kịch bản đã mất 10 giây để tải, chưa
      kể thời gian máy yếu chạy nó. Hôm nay ta học hiệu năng web, byte nào chặn màn hình hiện ra, và cách cắt bớt. Một tệp
      mã lệnh nặng nề đặt ở đầu trang chặn đứng quá trình dựng hình trong ba giây đủ khiến quá nửa người dùng rời bỏ trang
      tức thì.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: kích thước chia băng thông, và vòng khứ hồi'
  checks:
  - 2e6 / 1e3 == 2000 and alg.load_seconds(600e3, 200e3) == 3
  - 3 * 100 == 300 and 1 * 100 == 100
  steps:
  - show: '<p>Trong bài này 1 KB = 1000 byte, 1 MB = 1000 KB. Thời gian tải ≈ <b>kích thước chia băng thông</b>:</p>

      <table class="t"><tr><th>tệp</th><th>mạng</th><th>thời gian tải</th></tr>

      <tr><td>600 KB</td><td>200 KB mỗi giây</td><td>$\frac{600}{200} = \hl{3}$ s</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.2'
    - '2.2'
    say: Trước hết, ta quy ước trong bài này 1 KB là 1000 byte, và 1 MB là 1000 KB. Thời gian tải xấp xỉ bằng kích thước chia
      cho băng thông, giống như đổ nước qua một cái ống. Ví dụ tệp 600 KB trên mạng 200 KB mỗi giây thì tải mất 600 chia 200,
      bằng 3 giây. Đường kết xuất quan trọng gồm các bước tối thiểu để chuyển văn bản, kiểu dáng và bố cục thành các điểm
      ảnh đầu tiên lên màn hình.
  - show: '<p>Như bài 0 đã tính: mỗi lần tải <b>nối tiếp</b> tốn thêm ít nhất <b>một vòng khứ hồi</b> — thời gian gói đi tới
      máy chủ và quay về.</p>

      <table class="t"><tr><th>3 tài nguyên, khứ hồi 100 ms</th><th>chờ mạng</th></tr>

      <tr><td>phát hiện nối tiếp, cái này mới biết cái kia</td><td>$3 \cdot 100 = 300$ ms</td></tr>

      <tr><td>báo trước, tải cùng lúc</td><td>$\hl{100}$ ms</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    say: Thứ hai, như bài 0 đã tính, mỗi lần tải nối tiếp tốn thêm ít nhất một vòng khứ hồi. Vòng khứ hồi là thời gian một
      gói đi tới máy chủ và quay về, không phụ thuộc băng thông. Ba tài nguyên phát hiện nối tiếp, cái này tải xong mới biết
      cái kia, với khứ hồi 100 mi li giây thì chờ 3 nhân 100, bằng 300 mi li giây. Nếu báo trước để tải cùng lúc thì chỉ chờ
      khoảng một vòng, 100 mi li giây. Tài nguyên tạo kiểu mặc định chặn bước vẽ hình đầu tiên trong khi tài nguyên thực thi
      mặc định chặn luôn bước phân tích cây văn bản phía dưới.
- id: sym
  kind: symbol
  title: 'Giải mã: đường kết xuất và chỉ số trải nghiệm'
  steps:
  - show: '<p><b>Đường kết xuất quan trọng</b>: HTML → (CSS tức phần kiểu dáng, mã kịch bản đồng bộ trong phần đầu) → dựng
      cây → tính bố cục → vẽ. Mọi tài nguyên trên đường này <b>chặn</b> lần vẽ đầu.</p>

      <table class="t"><tr><th>chỉ số</th><th>đo gì</th><th>ngưỡng “tốt”</th></tr>

      <tr><td><b>nội dung lớn nhất hiện ra</b> (LCP)</td><td>khi phần chính của trang thấy được</td><td>≤ 2,5 s</td></tr>

      <tr><td><b>độ trễ phản hồi tương tác</b> (INP)</td><td>từ lúc bấm tới lúc màn hình đổi</td><td>≤ 200 ms</td></tr>

      <tr><td><b>độ xê dịch bố cục</b> (CLS)</td><td>nội dung nhảy chỗ khi đang đọc</td><td>≤ 0,1</td></tr></table>

      <p>Đo ở <b>phân vị 75</b> của người dùng <b>thật</b> — con số mà 75% lượt tải trang bằng hoặc tốt hơn nó — không phải
      trên máy phát triển.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - 3
    - 3
    - 3
    say: Đường kết xuất quan trọng đi từ HTML, qua phần kiểu dáng và mã kịch bản đồng bộ ở phần đầu, tới dựng cây, tính bố
      cục, và vẽ. Mọi tài nguyên trên đường này chặn lần vẽ đầu tiên. Bảng có ba chỉ số trải nghiệm. Nội dung lớn nhất hiện
      ra đo lúc phần chính của trang thấy được, tốt khi không quá 2 phẩy 5 giây. Độ trễ phản hồi tương tác đo từ lúc bấm tới
      lúc màn hình đổi, tốt khi không quá 200 mi li giây. Độ xê dịch bố cục đo việc nội dung nhảy chỗ khi đang đọc, tốt khi
      không quá 0 phẩy 1. Hãy đo ở phân vị 75 của người dùng thật, không phải trên máy phát triển. Phân vị 75 là con số mà
      75 phần trăm lượt tải trang bằng hoặc tốt hơn nó, nên một phần tư người dùng chậm nhất vẫn được tính tới. Gắn cờ trì
      hoãn tải bất đồng bộ, chia nhỏ gói mã theo tuyến trang và nén ảnh hiện đại kéo phần lớn thời gian chờ về mức không cảm
      nhận thấy.
- id: intuition
  kind: intuition
  title: Màn hình trắng chờ hết phần bị chặn
  checks:
  - alg.load_seconds(2e6, 200e3) == 10 and alg.load_seconds(500e3, 200e3) == 2.5 and 10 / 2.5 == 4
  steps:
  - show: '<div><svg width="1500" height="370" viewBox="0 0 1500 370"><defs><marker id="arW10" viewBox="0 0 10 10" refX="9"
      refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z"
      fill="#1f2937"/></marker></defs><rect x="40" y="30" width="170" height="64" rx="10" fill="#ffffff" stroke="#2a78d6"
      stroke-width="3"/><text x="125" y="70" font-size="22" text-anchor="middle" fill="#2a78d6">HTML</text><rect x="250" y="30"
      width="350" height="64" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/><text x="425" y="70" font-size="22"
