  - {sentence: "Hai phẩy 5 giây nhân 200 được 500 KB, khớp bản đã cắt.", reason: "ASR chép “2,5 dây nhân 200 được 500kg, khớp bạn đã cắt.” (0.867): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; lệch âm/thanh thuần Việt: bản/bạn — NOT_VERIFIED bằng tai người"}
