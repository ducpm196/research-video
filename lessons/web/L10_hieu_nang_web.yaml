  - {sentence: "Ví dụ tệp 600 KB trên mạng 200 KB mỗi giây thì tải mất 600 chia 200, bằng 3 giây.", reason: "ASR chép “Ví dụ tệp 600 kilobyte trên mạng 200 kilobyte mỗi dây thì tại mất 600 chi 200, bằng 3 dây.” (0.833): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; lệch âm/thanh thuần Việt: tải/tại, chia/chi — NOT_VERIFIED bằng tai người"}
