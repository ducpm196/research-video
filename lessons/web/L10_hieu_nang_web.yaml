      2 (đo hai gói)</b></td><td>Tính riêng thời gian tải gói gốc lớn và gói đã thu gọn</td></tr><tr><td><b>Bước 3 (tính bội
      cải thiện)</b></td><td>Lấy thời gian cũ chia thời gian mới làm tròn một chữ số</td></tr></table>
    say: Gợi ý cài đặt bài số 10 chia thành ba bước rõ ràng. Đầu tiên chia dung lượng gói tính bằng ki-lô-bai cho tốc độ đường
      truyền ở cả hai mức nặng và gọn. Cuối cùng chia thời gian cũ cho thời gian mới làm tròn một chữ số thập phân và in đủ
