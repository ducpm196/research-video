    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">thời gian ≈ kích thước / băng thông + số vòng khứ hồi × độ dài một vòng</span><span
      class="a">→</span>

      <span class="n">cắt byte trên đường kết xuất quan trọng</span><span class="a">→</span>

      <span class="n">báo trước tài nguyên, giữ chỗ cho ảnh</span><span class="a">→</span>

      <span class="n">đo người dùng thật, đặt ngân sách</span></div>

      '
    say: Tổng kết lại, thời gian xấp xỉ kích thước chia băng thông, cộng số vòng khứ hồi nhân độ dài một vòng. Hãy cắt byte
      trên đường kết xuất quan trọng, báo trước tài nguyên, giữ chỗ cho ảnh, đo người dùng thật, và đặt ngân sách. Hiểu đường
      kết xuất quan trọng giúp cắt bỏ mọi tài nguyên chặn không cần thiết ra khỏi đường dẫn đầu trang.
  - show: '<div class="box key"><b>Tư duy:</b> người dùng của bạn <b>không có máy của bạn</b> — tối ưu cho thiết bị và mạng
      của họ.</div>

      '
    say: Điều cần mang theo, người dùng của bạn không có máy của bạn, nên hãy tối ưu cho thiết bị và mạng của họ. Đặt kích
      thước chỗ sẵn cho ảnh, nén tài nguyên theo màn hình và chia nhỏ gói mã giúp trang tải nhanh trên mọi kết nối.
  - clear: true
    show: '<p class="note">Bài sau (bài 11): <b>truy cập cho mọi người</b> — độ tương phản, bàn phím, trình đọc màn hình.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 11, ta học truy cập cho mọi người, với độ tương phản, bàn phím, và trình đọc màn hình. Hẹn gặp bạn
      ở bài tiếp theo. Trang chạy nhanh vẫn chưa trọn vẹn nếu bỏ rơi người dùng khiếm thị, người khuyết tật vận động hay người
      dùng bàn phím thuần.
