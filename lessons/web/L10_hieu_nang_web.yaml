# Quy ước: KB = 1000 byte, MB = 10^6 byte; thời gian tải ≈ kích thước / băng thông (alg.load_seconds), bỏ qua vòng khứ hồi và giải nén.
#   Mạng 200 KB/s là SỐ MINH HOẠ cho mạng di động yếu. Chỉ số “nội dung lớn nhất hiện ra” (LCP) chỉ nêu ngưỡng; tên LCP chỉ trên màn hình.
objectives:
  - "Ước lượng thời gian tải theo kích thước và băng thông"
  - "Nhận ra tài nguyên chặn hiển thị"
  - "Nêu các chỉ số trải nghiệm chính"
asr_reviewed:
