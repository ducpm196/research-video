id: L05
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 5 — Giao diện theo trạng thái: thành phần, dữ liệu một chiều, so khớp danh sách"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L05; audit/web/verify_web.py L05; tài liệu React — Reconciliation, “Preserving and Resetting State” (bản hiện hành, tên chỉ trên màn hình); D. Knuth, TAOCP tập 3 (dãy con tăng dài nhất); bài 1, 4"
assumes: [arith, sub]
# Quy ước: giao diện = hàm(trạng thái). So khớp danh sách có khoá: phần tử giữ chỗ nếu vị trí cũ của nó thuộc một dãy con tăng dài nhất; số phần tử phải
#   di chuyển = độ dài − độ dài dãy đó (alg.keyed_moves). Đây là cận dưới số lần di chuyển; thư viện thật có thể làm nhiều hơn.
objectives:
  - "Mô tả giao diện là hàm của trạng thái"
  - "Giải thích vai trò của khoá khi so khớp danh sách"
  - "Giữ dữ liệu đi một chiều"
asr_reviewed:
  - {sentence: "Dãy vị trí cũ là gì, và cần di chuyển mấy dòng?", reason: "ASR chép “giải vị trí củ là gì và cần di chuyển máy dòng.” (0.75): lệch âm/thanh thuần Việt: dãy/giải, cũ/củ, mấy/máy — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chào bạn, trong danh sách việc cần làm, bạn tích ô mua sữa ở dòng đầu.", reason: "ASR chép “Chào bạn! Trong danh sách việc cần làm, bạn tích ôm mua sữa ở dòng đâu?” (0.875): “ô” (ô lưới) ASR viết chữ “O”; lệch âm/thanh thuần Việt: đầu/đâu — NOT_VERIFIED bằng tai người"}
  - {sentence: "Viết vị trí cũ theo thứ tự mới, C ở 2, A ở 0, B ở 1, D ở 3, E ở 4.", reason: "ASR chép “Viết vị trí của theo thứ tự mới C ở 2, A ở 0, B ở 1, G ở 3, E ở 4.” (0.913): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: cũ/của — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ô đánh dấu nhảy sang dòng khác"
    steps:
      - show: |
          <p>Danh sách việc cần làm: bạn tích ô “mua sữa” ở dòng đầu. Rồi thêm việc mới “gọi mẹ” lên <b>đầu</b> danh sách — và dấu tích nhảy sang “gọi mẹ”. Không ai bấm vào nó. Lỗi nằm ở cách giao diện <b>nhận ra</b> dòng nào là dòng nào.</p>
          <div class="box key">Hôm nay: <b>giao diện theo trạng thái</b> — viết giao diện như một hàm của dữ liệu, và dùng <b>khoá</b> để so khớp danh sách đúng.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, trong danh sách việc cần làm, bạn tích ô mua sữa ở dòng đầu. Rồi bạn thêm việc mới gọi mẹ lên đầu danh sách, và dấu tích nhảy sang gọi mẹ. Không ai bấm vào nó cả. Lỗi nằm ở cách giao diện nhận ra dòng nào là dòng nào. Hôm nay ta học giao diện theo trạng thái, viết giao diện như một hàm của dữ liệu, và dùng khoá để so khớp danh sách cho đúng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cây phần tử và dãy con tăng"
    checks:
      - "alg.html_tree_stats('<ul><li>a</li><li>b</li><li>c</li><li>d</li><li>e</li></ul>') == (6, 2)"
      - "max(k for k in range(1, 5) for c in __import__('itertools').combinations([3, 1, 2, 5], k) if all(c[i] < c[i + 1] for i in range(k - 1))) == 3"
    steps:
      - show: |
          <p>Ở bài 1 ta đã thấy: trang là một <b>cây phần tử</b>. Danh sách 5 việc là 1 nút danh sách và 5 nút dòng con — 6 phần tử. Sửa chữ của <b>một</b> dòng thì chỉ cần đụng 1 nút trên trang thật, không phải vẽ lại cả 6.</p>
        say: "Trước hết, nhắc lại điều ở bài 1, trang web là một cây phần tử, mỗi thẻ là một nút. Danh sách 5 việc gồm 1 nút danh sách và 5 nút dòng con, tổng cộng 6 phần tử. Sửa chữ của một dòng thì chỉ cần đụng 1 nút trên trang thật, không phải vẽ lại cả 6, và tìm ra đúng nút cần sửa chính là việc của so khớp."
      - show: |
          <p><b>Dãy con tăng</b>: chọn vài số trong dãy, <b>giữ nguyên thứ tự</b>, sao cho số sau lớn hơn số trước.</p>
          <table class="t"><tr><th>dãy 3, 1, 2, 5</th><th>tăng?</th></tr>
          <tr><td>3, 5</td><td>có, dài 2</td></tr>
          <tr><td>1, 2, 5</td><td>có, dài $\hl{3}$ — dài nhất</td></tr>
          <tr><td>3, 1, 2</td><td>không (3 lớn hơn 1)</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Điều thứ hai ta cần là dãy con tăng, tức là chọn vài số trong dãy, giữ nguyên thứ tự, sao cho số sau lớn hơn số trước. Bảng xét dãy 3, 1, 2, 5. Chọn 3 và 5 thì được một dãy con tăng dài 2. Chọn 1, 2, 5 thì được dãy con tăng dài 3, và đây là dài nhất. Còn 3, 1, 2 thì không tăng, vì 3 lớn hơn 1."

  - id: sym
    kind: symbol
    title: "Giải mã: thành phần, trạng thái, khoá"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>giao diện = hàm(trạng thái)</b></td><td>không sửa giao diện trực tiếp; đổi trạng thái rồi để thư viện vẽ lại</td></tr>
          <tr><td><b>thành phần</b></td><td>một hàm nhỏ: nhận dữ liệu vào từ cha, trả về một mảnh giao diện</td></tr>
          <tr><td><b>dữ liệu một chiều</b></td><td>dữ liệu đi từ cha xuống con; con muốn đổi thì <b>báo lên</b> để cha đổi trạng thái</td></tr>
          <tr><td><b>so khớp</b></td><td>so cây cũ với cây mới, chỉ sửa phần khác trên trang thật</td></tr>
          <tr><td><b>khoá</b></td><td>mã ổn định của mỗi dòng (mã việc), để biết dòng nào là dòng nào khi danh sách đổi</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bảng có năm khái niệm. Giao diện bằng hàm của trạng thái, nghĩa là không sửa giao diện trực tiếp, mà đổi trạng thái rồi để thư viện vẽ lại. Thành phần là một hàm nhỏ, nhận dữ liệu vào từ cha, và trả về một mảnh giao diện. Dữ liệu một chiều nghĩa là dữ liệu đi từ cha xuống con, và con muốn đổi thì báo lên để cha đổi trạng thái. So khớp là so cây cũ với cây mới, rồi chỉ sửa phần khác trên trang thật. Khoá là mã ổn định của mỗi dòng, như mã việc, để biết dòng nào là dòng nào khi danh sách đổi."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Khoá nối mỗi dòng cũ với chính nó trong danh sách mới"
    steps:
      - show: |
          <div><svg width="1500" height="525" viewBox="0 0 1500 525"><text x="420" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">danh sách cũ</text><text x="1080" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">danh sách mới</text><line x1="480" y1="239" x2="1020" y2="95" stroke="#eb6834" stroke-width="6"/><line x1="480" y1="95" x2="1020" y2="167" stroke="#059669" stroke-width="4"/><line x1="480" y1="167" x2="1020" y2="239" stroke="#059669" stroke-width="4"/><line x1="480" y1="311" x2="1020" y2="311" stroke="#059669" stroke-width="4"/><line x1="480" y1="383" x2="1020" y2="383" stroke="#059669" stroke-width="4"/><rect x="360" y="69" width="120" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="420" y="104" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">A</text><text x="330" y="103" font-size="22" text-anchor="end" fill="#1f2937">vị trí 0</text><rect x="360" y="141" width="120" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="420" y="176" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">B</text><text x="330" y="175" font-size="22" text-anchor="end" fill="#1f2937">vị trí 1</text><rect x="360" y="213" width="120" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="420" y="248" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">C</text><text x="330" y="247" font-size="22" text-anchor="end" fill="#1f2937">vị trí 2</text><rect x="360" y="285" width="120" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="420" y="320" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">D</text><text x="330" y="319" font-size="22" text-anchor="end" fill="#1f2937">vị trí 3</text><rect x="360" y="357" width="120" height="52" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="420" y="392" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">E</text><text x="330" y="391" font-size="22" text-anchor="end" fill="#1f2937">vị trí 4</text><rect x="1020" y="69" width="120" height="52" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="3"/><text x="1080" y="104" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">C</text><text x="1170" y="103" font-size="22" fill="#eb6834">từ vị trí 2</text><rect x="1020" y="141" width="120" height="52" rx="8" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="1080" y="176" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">A</text><text x="1170" y="175" font-size="22" fill="#059669">từ vị trí 0</text><rect x="1020" y="213" width="120" height="52" rx="8" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="1080" y="248" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">B</text><text x="1170" y="247" font-size="22" fill="#059669">từ vị trí 1</text><rect x="1020" y="285" width="120" height="52" rx="8" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="1080" y="320" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">D</text><text x="1170" y="319" font-size="22" fill="#059669">từ vị trí 3</text><rect x="1020" y="357" width="120" height="52" rx="8" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="1080" y="392" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">E</text><text x="1170" y="391" font-size="22" fill="#059669">từ vị trí 4</text><text x="750" y="465" font-size="22" text-anchor="middle" fill="#059669">xanh: A, B, D, E giữ thứ tự với nhau</text><text x="750" y="499" font-size="22" text-anchor="middle" fill="#eb6834">cam: chỉ C phải chuyển chỗ</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đặt danh sách cũ bên trái và danh sách mới bên phải, mỗi đường nối một khoá với chính nó ở hai bên. Nhờ khoá, thư viện biết ô có chữ A bên phải chính là dòng A cũ, chứ không phải một dòng lạ. Bốn đường xanh của A, B, D, E không cắt nhau, nghĩa là bốn dòng đó vẫn giữ thứ tự với nhau và có thể đứng yên. Chỉ đường cam của C cắt qua các đường khác, nên chỉ C cần chuyển chỗ."

  - id: example
    kind: example
    title: "Đổi thứ tự năm dòng có khoá"
    checks:
      - "alg.keyed_moves(list('ABCDE'), list('CABDE')) == 1"
    steps:
      - show: |
          <p><b>Bước một — ghi vị trí cũ theo khoá</b>: cũ [A B C D E].</p>
          <table class="t"><tr><th>khoá</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>
          <tr><td>vị trí cũ</td><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr></table>
        focus: [1, "2.2"]
        say: "Bước một, danh sách cũ là A, B, C, D, E, ta ghi vị trí cũ của từng khoá, đếm từ 0. Bảng cho A ở 0, B ở 1, C ở 2, D ở 3, và E ở 4."
      - show: |
          <p><b>Bước 2 — đọc danh sách mới</b> [C A B D E], thay mỗi khoá bằng vị trí cũ của nó:</p>
          <table class="t"><tr><th>thứ tự mới</th><th>C</th><th>A</th><th>B</th><th>D</th><th>E</th></tr>
          <tr><td>vị trí cũ</td><td>2</td><td>0</td><td>1</td><td>3</td><td>4</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước hai, danh sách mới là C, A, B, D, E, ta thay mỗi khoá bằng vị trí cũ của nó. Viết vị trí cũ theo thứ tự mới, C ở 2, A ở 0, B ở 1, D ở 3, E ở 4. Ta được dãy vị trí cũ là 2, 0, 1, 3, 4."
      - clear: true
        show: |
          <p><b>Bước 3 — tìm dãy con tăng dài nhất</b> của 2, 0, 1, 3, 4:</p>
          <table class="t"><tr><th>thử</th><th>tăng?</th><th>dài</th></tr>
          <tr><td>2, 3, 4 (C, D, E)</td><td>có</td><td>3</td></tr>
          <tr><td>0, 1, 3, 4 (A, B, D, E)</td><td>có</td><td>$\hl{4}$</td></tr>
          <tr><td>cả 5 số</td><td>không (2 lớn hơn 0)</td><td>—</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, tìm dãy con tăng dài nhất của 2, 0, 1, 3, 4. Chọn 2, 3, 4, tức C, D, E, thì tăng nhưng chỉ dài 3. Dãy con tăng dài nhất là 0, 1, 3, 4, ứng với A, B, D, E, giữ nguyên chỗ. Lấy cả 5 số thì không tăng, vì 2 đứng trước mà lớn hơn 0."
      - show: |
          <p><b>Bước 4 — số dòng phải di chuyển</b> = độ dài − dãy giữ chỗ: $5 - 4 = \hl{1}$ dòng, chỉ C.</p>
          <p>Nhờ khoá, trạng thái của mỗi dòng (ô tích, chữ đang gõ) đi theo đúng dòng đó.</p>
        focus: [1, 2]
        say: "Bước bốn, số dòng phải di chuyển bằng độ dài trừ dãy giữ chỗ, 5 trừ 4, bằng 1, chỉ có C. Nhờ khoá, trạng thái của mỗi dòng như ô tích hay chữ đang gõ đi theo đúng dòng đó."

  - id: check
    kind: check
    title: "Tự kiểm: thử thẳng bằng tay và bằng máy"
    checks:
      - "['C'] + [k for k in 'ABCDE' if k != 'C'] == list('CABDE') and list('ABCDE') != list('CABDE')"
      - "max(k for k in range(1, 6) for c in __import__('itertools').combinations([2, 0, 1, 3, 4], k) if all(c[i] < c[i + 1] for i in range(k - 1))) == 4 and len(list(__import__('itertools').combinations(range(5), 5))) == 1 and 2 ** 5 == 32"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>nhấc C ra, đặt lên đầu: [A B D E] → [C A B D E]</td><td>đúng danh sách mới với 1 lần chuyển ✓</td></tr>
          <tr><td>0 lần chuyển?</td><td>không được: hai danh sách khác nhau</td></tr>
          <tr><td>máy thử cả $2^5 = 32$ cách chọn tập dòng đứng yên</td><td>tập lớn nhất giữ thứ tự có 4 dòng ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        introduces: [power]
        say: "Kiểm bằng đường khác, ta làm thẳng bằng tay thay vì tìm dãy con. Nhấc C ra khỏi danh sách, còn lại A, B, D, E, rồi đặt C lên đầu thì được đúng danh sách mới, chỉ với 1 lần chuyển. Không thể làm với 0 lần chuyển, vì hai danh sách khác nhau. Máy thử cả 2 mũ 5 bằng 32 cách chọn tập dòng đứng yên, và tập lớn nhất còn giữ thứ tự có 4 dòng, khớp kết quả 5 trừ 4 bằng 1."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thường gặp"
    checks:
      - "len(set('ABCDE') & set('CABDE')) == 5 and alg.keyed_moves(list('ABCDE'), list('CABDE')) == 1 and len(set('ABCDE') & set('VWXYZ')) == 0 and 5 - len(set('ABCDE') & set('VWXYZ')) == 5"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng chỉ số mảng làm khoá <b class="red">(trạng thái dính sai dòng)</b>
          <br><span class="note">Chèn “gọi mẹ” lên đầu: “gọi mẹ” nhận khoá 0 — đúng khoá cũ của “mua sữa”, nên nhận luôn dấu tích. Dùng mã ổn định của dữ liệu, không dùng vị trí.</span></div>
        say: "Lỗi thứ nhất, dùng chỉ số mảng làm khoá, nên trạng thái dính sai dòng. Chèn gọi mẹ lên đầu thì gọi mẹ nhận khoá 0, đúng khoá cũ của mua sữa, nên nhận luôn dấu tích. Hãy dùng mã ổn định của dữ liệu, không dùng vị trí."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Sửa trạng thái tại chỗ <b class="red">(giao diện không vẽ lại)</b>
          <br><span class="note">Thêm phần tử vào chính mảng cũ: thư viện so tham chiếu, thấy “vẫn mảng đó”, không vẽ lại. Tạo mảng <b>mới</b> chứa phần tử thêm vào.</span></div>
        say: "Lỗi thứ hai, sửa trạng thái tại chỗ, nên giao diện không vẽ lại. Thêm phần tử vào chính mảng cũ thì thư viện so tham chiếu, thấy vẫn là mảng đó, và không vẽ lại. Hãy tạo một mảng mới chứa phần tử thêm vào."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Giữ một dữ liệu ở hai nơi <b class="red">(lệch nhau)</b>
          <br><span class="note">Tổng tiền giỏ hàng lưu riêng một biến: thêm hàng mà quên cập nhật là sai. Chỉ lưu danh sách hàng; tổng <b>tính ra</b> từ danh sách mỗi lần vẽ.</span></div>
        say: "Lỗi thứ ba, giữ một dữ liệu ở hai nơi, nên chúng lệch nhau. Tổng tiền giỏ hàng lưu riêng một biến thì thêm hàng mà quên cập nhật là sai. Hãy chỉ lưu danh sách hàng, còn tổng thì tính ra từ danh sách mỗi lần vẽ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tạo khoá ngẫu nhiên mới mỗi lần vẽ <b class="red">(người đã đi làm hay mắc)</b>
          <br><span class="note">Để tắt cảnh báo “thiếu khoá”, có người sinh số ngẫu nhiên làm khoá ngay lúc vẽ. Lần vẽ sau mọi khoá đều mới, nên không dòng nào khớp dòng cũ: thư viện xoá hết rồi tạo lại.</span></div>
          <table class="t"><tr><th>loại khoá (5 dòng, đổi thứ tự)</th><th>dòng khớp lại</th><th>dòng xoá rồi tạo lại</th></tr>
          <tr><td>mã ổn định của dữ liệu</td><td>5</td><td>0 (chỉ chuyển 1)</td></tr>
          <tr><td>số ngẫu nhiên mỗi lần vẽ</td><td>0</td><td>$\hl{5}$ — mất ô tích, chữ đang gõ</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tạo khoá ngẫu nhiên mới mỗi lần vẽ. Để tắt cảnh báo thiếu khoá, có người sinh một số ngẫu nhiên làm khoá ngay lúc vẽ. Lần vẽ sau mọi khoá đều mới, nên không dòng nào khớp dòng cũ, và thư viện xoá hết rồi tạo lại. Bảng so hai loại khoá khi năm dòng đổi thứ tự. Khoá là mã ổn định thì cả 5 dòng khớp lại, chỉ cần chuyển 1 dòng. Khoá ngẫu nhiên thì 0 dòng khớp, cả 5 dòng bị xoá rồi tạo lại, mất luôn ô tích và chữ đang gõ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.keyed_moves(list('ABCD'), list('BCDA')) == 1 and alg.keyed_moves(list('ABCDE'), list('EDCBA')) == 4"
      - "(lambda old, new: sum(1 for i in range(100) if new[i] != old[i]) == 100 and len(set(new) - set(old)) == 1 and alg.keyed_moves(old, new) == 0)(list(range(100)), [-1] + list(range(100)))"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>[A B C D] → [B C D A]: dãy vị trí cũ, và cần di chuyển mấy dòng?</td></tr>
          <tr><td>2</td><td>[A B C D E] → đảo ngược [E D C B A]: cần di chuyển mấy dòng?</td></tr>
          <tr><td>3</td><td>Quyết định: danh sách 100 dòng, chèn 1 dòng lên đầu. Khoá theo chỉ số thì bao nhiêu khoá cũ giờ trỏ vào dòng khác? Khoá theo mã thì sao? Chọn khoá nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", "1.4", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, A, B, C, D đổi thành B, C, D, A. Dãy vị trí cũ là gì, và cần di chuyển mấy dòng? Câu hai, A, B, C, D, E đảo ngược thành E, D, C, B, A, cần di chuyển mấy dòng? Câu ba là một quyết định, danh sách có 100 dòng và bạn chèn 1 dòng lên đầu. Nếu khoá là chỉ số, bao nhiêu khoá cũ giờ trỏ vào một dòng khác? Nếu khoá là mã của dữ liệu thì sao, và bạn chọn loại khoá nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Thứ tự mới B, C, D, A có vị trí cũ 1, 2, 3, 0; dãy con tăng dài nhất 1, 2, 3 → di chuyển $4 - 3 = \hl{1}$ (chỉ A).</p>
          <p>② Dãy 4, 3, 2, 1, 0 giảm hẳn; dãy con tăng dài nhất dài 1 → di chuyển $5 - 1 = \hl{4}$.</p>
        focus: [1, 1, 2, 2]
        say: "Đáp án câu một, thay B, C, D, A bằng vị trí cũ của chúng. Dãy vị trí cũ là 1, 2, 3, 0, dãy con tăng dài nhất là 1, 2, 3, nên di chuyển 4 trừ 3, bằng 1 dòng, chỉ có A. Câu hai, dãy vị trí cũ là 4, 3, 2, 1, 0, giảm hẳn từ đầu tới cuối. Dãy 4, 3, 2, 1, 0 giảm hẳn, dãy con tăng dài nhất chỉ dài 1, nên di chuyển 5 trừ 1, bằng 4 dòng."
      - show: |
          <p>③ Khoá theo chỉ số: dòng cũ ở chỉ số $i$ bị đẩy xuống $i + 1$, nên cả $\hl{100}$ khoá 0 tới 99 giờ trỏ vào dòng khác, mang nhầm trạng thái. Khoá theo mã: 0 khoá nhầm, chỉ tạo thêm 1 dòng → <b>chọn khoá theo mã</b>.</p>
        say: "Câu ba, với khoá theo chỉ số, dòng cũ đứng ở chỉ số i bị đẩy xuống chỉ số i cộng 1. Vì vậy cả 100 khoá từ 0 tới 99 giờ trỏ vào một dòng khác, và mang nhầm trạng thái, đúng như lỗi dấu tích ở đầu bài. Với khoá theo mã thì không khoá nào nhầm, thư viện chỉ tạo thêm đúng 1 dòng mới, nên ta chọn khoá theo mã."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">giao diện = hàm(trạng thái)</span><span class="a">→</span>
          <span class="n">dữ liệu xuống, sự kiện lên</span><span class="a">→</span>
          <span class="n">khoá ổn định để so khớp danh sách</span><span class="a">→</span>
          <span class="n">trạng thái mới thay vì sửa tại chỗ; một nguồn sự thật</span></div>
        say: "Tổng kết lại, giao diện là hàm của trạng thái, dữ liệu đi xuống và sự kiện đi lên. Dùng khoá ổn định để so khớp danh sách, tạo trạng thái mới thay vì sửa tại chỗ, và giữ một nguồn sự thật."
      - show: |
          <div class="box key"><b>Tư duy:</b> mô tả <b>cái cần có</b>, để máy lo <b>cách đi tới đó</b> — nhưng phải cho máy đủ thông tin (khoá) để đi đúng.</div>
        say: "Điều cần mang theo, hãy mô tả cái cần có, để máy lo cách đi tới đó, nhưng phải cho máy đủ thông tin, như khoá, để đi đúng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>thiết kế API</b> — tài nguyên, phương thức, mã trạng thái, lũy đẳng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học thiết kế API, với tài nguyên, phương thức, mã trạng thái, và lũy đẳng. Hẹn gặp bạn ở bài tiếp theo."
