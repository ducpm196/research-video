scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Câu trả lời nhanh nhất là câu không phải hỏi"
    steps:
      - show: |
          <p>Mỗi lần mở ứng dụng, trình duyệt tải lại biểu trưng, phông chữ, tệp kịch bản — hàng trăm KB không đổi từ tuần trước. Ngược lại, sau khi bạn phát hành bản sửa lỗi, một nửa người dùng vẫn chạy bản <b>cũ</b> vì trình duyệt cứ dùng bản đã lưu. Cả hai là chuyện cấu hình bộ nhớ đệm.</p>
          <div class="box key">Hôm nay: <b>bộ nhớ đệm HTTP</b> — khi nào bản lưu còn dùng được, và cách hỏi “có gì mới không” mà không tải lại.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, mỗi lần mở ứng dụng, trình duyệt tải lại biểu trưng, phông chữ và tệp kịch bản, hàng trăm KB không đổi từ tuần trước. Ngược lại, sau khi bạn phát hành bản sửa lỗi, một nửa người dùng vẫn chạy bản cũ vì trình duyệt cứ dùng bản đã lưu. Cả hai là chuyện cấu hình bộ nhớ đệm. Hôm nay ta học bộ nhớ đệm HTTP, khi nào bản lưu còn dùng được, và cách hỏi có gì mới không mà không phải tải lại."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: tuổi của bản lưu, và giá của một lần ra mạng"
    checks:
      - "11 * 60 + 40 == 700"
      - "50 * 1000 * 8 == 400000 and 400000 / 10**7 * 1000 == 40 and 50 + 40 == 90"
    steps:
      - show: |
          <p><b>Tuổi</b> của bản lưu = bây giờ − lúc nhận. Nhận trang lúc 10:00:00, bây giờ là 10:11:40:</p>
          <p>tuổi $= 11 \cdot 60 + 40 = \hl{700}$ giây.</p>
        focus: [1, 2]
        say: "Trước hết, tuổi của một bản lưu bằng thời điểm bây giờ trừ thời điểm nhận về, ví dụ nhận trang lúc 10 giờ đúng, và bây giờ là 10 giờ 11 phút 40 giây. Tuổi là 11 nhân 60 cộng 40, bằng 700 giây, con số ta sẽ dùng lại trong ví dụ."
      - show: |
          <p>Ở bài 0 và bài 6: mỗi yêu cầu GET tốn ít nhất một <b>vòng khứ hồi</b>; tải thân trang thì thêm thời gian truyền. Với vòng khứ hồi 50 ms, đường 10 triệu bit mỗi giây:</p>
          <table class="t"><tr><th>cách lấy trang 50 KB</th><th>thời gian chờ</th></tr>
          <tr><td>dùng bản lưu, không ra mạng</td><td>0 ms</td></tr>
          <tr><td>hỏi, máy chủ đáp “không đổi”</td><td>1 vòng = 50 ms</td></tr>
          <tr><td>tải lại cả thân: 400 000 bit</td><td>$50 + 40 = \hl{90}$ ms</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Điều thứ hai, nhắc lại bài 0 và bài 6, mỗi yêu cầu GET tốn ít nhất một vòng khứ hồi, và tải thân trang thì thêm thời gian truyền. Bảng dùng vòng khứ hồi 50 mi li giây và đường 10 triệu bit mỗi giây để so ba cách lấy trang 50 KB. Dùng bản lưu, không ra mạng, thì chờ 0 mi li giây. Hỏi máy chủ và được đáp là không đổi thì tốn 1 vòng, tức 50 mi li giây. Tải lại cả thân 400 nghìn bit thì thêm 40 mi li giây truyền, tổng 90 mi li giây."

  - id: sym
    kind: symbol
    title: "Giải mã: độ tươi và xác thực lại"
    steps:
      - show: |
          <table class="t"><tr><th>tiêu đề</th><th>nghĩa</th></tr>
          <tr><td><code>Cache-Control: max-age=600</code></td><td>bản này <b>tươi</b> trong 600 giây: dùng thẳng, không hỏi máy chủ</td></tr>
          <tr><td><code>ETag: "v7"</code></td><td><b>thẻ phiên bản</b> của nội dung, máy chủ gửi kèm</td></tr>
          <tr><td><code>If-None-Match: "v7"</code></td><td>khi bản lưu đã cũ: “tôi đang có v7, có gì mới không?”</td></tr>
          <tr><td><b>304 Not Modified</b></td><td>“v7 vẫn đúng” — không gửi lại thân, chỉ gia hạn độ tươi</td></tr></table>
          <p>Hai câu hỏi tách bạch: <b>còn tươi không</b> (không cần mạng) và <b>còn đúng không</b> (một vòng khứ hồi, gần như không tốn băng thông).</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng có bốn thành phần. Tiêu đề thời gian tươi bằng 600 nói bản này còn tươi trong 600 giây, được dùng thẳng mà không hỏi máy chủ. Thẻ phiên bản là nhãn của nội dung mà máy chủ gửi kèm, ví dụ v 7. Khi bản lưu đã cũ, trình duyệt gửi yêu cầu có điều kiện, nói tôi đang có v 7, có gì mới không. Mã 304 nghĩa là v 7 vẫn đúng, máy chủ không gửi lại thân, chỉ gia hạn độ tươi. Có hai câu hỏi tách bạch, còn tươi không thì không cần mạng, còn đúng không thì tốn một vòng khứ hồi nhưng gần như không tốn băng thông."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Trục tuổi: vùng tươi, vùng cũ, và lần gia hạn"
    checks:
      - "alg.cache_fresh(500, 600) and not alg.cache_fresh(700, 600) and 700 + 600 == 1300"
    steps:
      - show: |
          <div><svg width="1500" height="300" viewBox="0 0 1500 300"><defs><marker id="arW8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="120" y="120" width="504" height="60" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><rect x="624" y="120" width="84" height="60" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="708" y="120" width="504" height="60" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><rect x="1212" y="120" width="168" height="60" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><text x="372" y="158" font-size="22" text-anchor="middle" fill="#1f2937">tươi: dùng thẳng</text><text x="960" y="158" font-size="22" text-anchor="middle" fill="#1f2937">tươi lại sau 304</text><line x1="120" y1="200" x2="1400" y2="200" stroke="#1f2937" stroke-width="2" marker-end="url(#arW8)"/><line x1="120" y1="195" x2="120" y2="205" stroke="#1f2937" stroke-width="2"/><text x="120" y="232" font-size="20" text-anchor="middle" fill="#1f2937">0 s</text><line x1="372" y1="195" x2="372" y2="205" stroke="#1f2937" stroke-width="2"/><text x="372" y="232" font-size="20" text-anchor="middle" fill="#1f2937">300 s</text><line x1="624" y1="195" x2="624" y2="205" stroke="#1f2937" stroke-width="2"/><text x="624" y="232" font-size="20" text-anchor="middle" fill="#1f2937">600 s</text><line x1="876" y1="195" x2="876" y2="205" stroke="#1f2937" stroke-width="2"/><text x="876" y="232" font-size="20" text-anchor="middle" fill="#1f2937">900 s</text><line x1="1128" y1="195" x2="1128" y2="205" stroke="#1f2937" stroke-width="2"/><text x="1128" y="232" font-size="20" text-anchor="middle" fill="#1f2937">1200 s</text><line x1="1380" y1="195" x2="1380" y2="205" stroke="#1f2937" stroke-width="2"/><text x="1380" y="232" font-size="20" text-anchor="middle" fill="#1f2937">1500 s</text><line x1="540" y1="88" x2="540" y2="118" stroke="#059669" stroke-width="3" marker-end="url(#arW8)"/><text x="530" y="80" font-size="22" font-weight="bold" text-anchor="end" fill="#059669">tuổi 500: tươi, 0 ms</text><line x1="708" y1="53" x2="708" y2="118" stroke="#eb6834" stroke-width="3" marker-end="url(#arW8)"/><text x="718" y="45" font-size="22" font-weight="bold" text-anchor="start" fill="#eb6834">tuổi 700: đã cũ, hỏi kèm thẻ v7</text><text x="718" y="282" font-size="22" fill="#2a78d6">máy chủ đáp 304 lúc 700 s: tuổi về 0, tươi tới mốc 1300 s</text><line x1="708" y1="262" x2="708" y2="186" stroke="#2a78d6" stroke-width="3" stroke-dasharray="8 6"/></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục tuổi của bản lưu, tính bằng giây, với thời gian tươi 600 giây. Dải xanh từ 0 tới 600 là vùng tươi, ở tuổi 500 trình duyệt dùng thẳng bản lưu, chờ 0 mi li giây. Qua mốc 600, dải cam là vùng đã cũ, nên ở tuổi 700 trình duyệt phải hỏi máy chủ, kèm thẻ phiên bản v 7 mà nó đang giữ. Máy chủ đáp 304 lúc 700 giây thì tuổi đếm lại từ 0, và bản lưu lại tươi tới mốc 1300 giây."

  - id: example
    kind: example
    title: "Bản lưu 700 giây tuổi"
    checks:
      - "alg.http_cache_decision(700, 600, 'v7', 'v7') == 304 and alg.http_cache_decision(700, 600, 'v7', 'v8') == 200 and alg.http_cache_decision(500, 600, 'v7', 'v8') == 'fresh'"
    steps:
      - show: |
          <p><b>Bước một — tuổi 500 s</b>, max-age 600 s: $500 \lt 600$ → còn <b>tươi</b>.</p>
          <p>Dùng bản lưu, không ra mạng: tải về 0 byte, chờ 0 ms.</p>
        focus: [1, 2]
        say: "Bước một, bản lưu 500 giây tuổi, so với thời gian tươi 600 giây, vì 500 nhỏ hơn 600 nên còn tươi. Trình duyệt dùng thẳng bản lưu, không ra mạng, tải về 0 byte và chờ 0 mi li giây."
      - show: |
          <p><b>Bước 2 — tuổi 700 s</b>: $700 \ge 600$ → đã cũ → gửi <code>If-None-Match: "v7"</code>. Máy chủ vẫn là v7 → <b>304</b>.</p>
          <p>Tải về chỉ vài trăm byte tiêu đề, chờ 1 vòng = 50 ms; tuổi đếm lại từ 0.</p>
        introduces: [geq]
        focus: [1, 1, 2]
        say: "Bước hai, bản lưu 700 giây tuổi, vì 700 lớn hơn hoặc bằng 600 nên đã cũ, và trình duyệt gửi yêu cầu có điều kiện kèm thẻ. Bản lưu 700 giây tuổi đã cũ, trình duyệt hỏi kèm thẻ v 7, máy chủ vẫn là v 7 nên trả 304, chỉ vài trăm byte tiêu đề. Việc này tốn 1 vòng, tức 50 mi li giây, và tuổi của bản lưu đếm lại từ 0."
      - clear: true
        show: |
          <p><b>Bước 3 — tuổi 700 s, nhưng máy chủ đã là v8</b>: thẻ v7 không khớp → <b>200</b> kèm thân mới.</p>
          <p>Tải về 50 KB, chờ $50 + 40 = 90$ ms; trình duyệt lưu bản v8 thay bản v7.</p>
        focus: [1, 1, 2]
        say: "Bước ba, vẫn tuổi 700 giây, nhưng nội dung trên máy chủ đã đổi. Nếu máy chủ đã là v 8 thì trả 200 kèm thân mới, 50 KB. Trình duyệt chờ 50 cộng 40, bằng 90 mi li giây, rồi lưu bản v 8 thay cho bản v 7."
      - clear: true
        show: |
          <table class="t"><tr><th>tình huống (trang 50 KB, max-age 600 s)</th><th>trình duyệt làm gì</th><th>tải về</th><th>chờ</th></tr>
          <tr><td>tuổi 500 s</td><td>còn tươi → dùng bản lưu</td><td>0, không ra mạng</td><td>0 ms</td></tr>
          <tr><td>tuổi 700 s, máy chủ vẫn là v7</td><td>cũ → hỏi kèm thẻ v7 → $\hl{304}$</td><td>chỉ vài trăm byte tiêu đề</td><td>50 ms</td></tr>
          <tr><td>tuổi 700 s, máy chủ đã là v8</td><td>cũ → hỏi kèm thẻ v7 → 200 + thân mới</td><td>50 KB</td><td>90 ms</td></tr></table>
          <p><b>Bước 4</b>: ngay cả khi đã cũ, cũng không gửi lại 50 KB nếu nội dung chưa đổi.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước bốn, gom cả ba lại thành một bảng. Bảng có ba tình huống, với trang 50 KB và thời gian tươi 600 giây. Còn tươi thì chờ 0 mi li giây, đã cũ mà không đổi thì chờ 50 mi li giây với mã 304. Đã cũ và đã đổi thì mới phải chờ 90 mi li giây để tải lại 50 KB. Như vậy ngay cả khi đã cũ, trình duyệt cũng không tải lại 50 KB nếu nội dung chưa đổi."

  - id: check
    kind: check
    title: "Tự kiểm: viết lại luật, cho chạy một giờ"
    checks:
      - "(lambda rule: [rule(500, 600, 'v7', 'v8'), rule(700, 600, 'v7', 'v7'), rule(700, 600, 'v7', 'v8')] == ['fresh', 304, 200] == [alg.http_cache_decision(500, 600, 'v7', 'v8'), alg.http_cache_decision(700, 600, 'v7', 'v7'), alg.http_cache_decision(700, 600, 'v7', 'v8')])(lambda age, ma, e1, e2: 'fresh' if age < ma else (304 if e1 == e2 else 200))"
      - "(lambda out: (out.count(200), out.count(304), out.count('fresh'), len(out)) == (1, 5, 6, 12))((lambda rule: (lambda f: f(f, 0, None, []))(lambda f, t, got, out: out if t >= 3600 else (f(f, t + 300, t, out + [200]) if got is None else (lambda r: f(f, t + 300, t if r == 304 else got, out + [r]))(rule(t - got, 600, 'v7', 'v7')))))(lambda age, ma, e1, e2: 'fresh' if age < ma else (304 if e1 == e2 else 200)))"
      - "3600 // 300 == 12 and 12 * 50 == 600"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>viết lại luật thành một dòng: tuổi &lt; max-age → tươi; không thì thẻ khớp → 304, khác → 200</td><td>tươi, 304, 200 — khớp ba tình huống ✓</td></tr>
          <tr><td>mở trang mỗi 5 phút trong 1 giờ (12 lần), nội dung không đổi</td><td>1 lần 200, 5 lần 304, 6 lần dùng thẳng</td></tr>
          <tr><td>byte thân phải tải</td><td>50 KB thay vì $12 \cdot 50 = 600$ KB ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta viết lại luật thành một dòng riêng, tuổi nhỏ hơn thời gian tươi thì dùng thẳng, không thì thẻ khớp trả 304, khác trả 200. Chạy luật đó cho ba tình huống ra tươi, 304, và 200, khớp với bảng. Rồi cho người dùng mở trang mỗi 5 phút trong 1 giờ, tức 12 lần, khi nội dung không đổi. Máy đếm được 1 lần tải đầy đủ, 5 lần nhận 304, và 6 lần dùng thẳng bản lưu. Thân trang chỉ phải tải đúng 50 KB, thay vì 12 nhân 50 bằng 600 KB."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thường gặp"
    checks:
      - "2000 * 5 * 500 == 5000000 and 5000000 / 10**6 == 5 and 2000 * 500 / 10**6 == 1"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Cho trang HTML tươi rất lâu <b class="red">(người dùng kẹt ở bản cũ)</b>
          <br><span class="note">HTML là điểm vào, trỏ tới mọi tệp khác. Cho HTML <code>no-cache</code> (luôn xác thực lại); tệp tĩnh có <b>mã băm nội dung trong tên</b> (<code>app.3f9a1c.js</code>) thì cho tươi một năm — đổi nội dung là đổi tên.</span></div>
        say: "Lỗi thứ nhất, cho trang HTML tươi rất lâu, nên người dùng kẹt ở bản cũ. Trang HTML là điểm vào, trỏ tới mọi tệp khác. Hãy bắt trang HTML luôn xác thực lại, còn tệp tĩnh có mã băm nội dung trong tên thì cho tươi một năm, vì đổi nội dung là đổi tên."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Để bộ nhớ đệm dùng chung lưu dữ liệu riêng <b class="red">(người này thấy dữ liệu người kia)</b>
          <br><span class="note">Trang “tài khoản của tôi” qua mạng phân phối nội dung mà không có <code>Cache-Control: private</code>: người sau có thể nhận bản lưu của người trước.</span></div>
        say: "Lỗi thứ hai, để bộ nhớ đệm dùng chung lưu dữ liệu riêng, nên người này thấy dữ liệu của người kia. Trang tài khoản của tôi đi qua mạng phân phối nội dung mà không đánh dấu riêng tư thì người sau có thể nhận bản lưu của người trước."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Thẻ phiên bản đổi mỗi lần dựng lại <b class="red">(304 không bao giờ xảy ra)</b>
          <br><span class="note">Thẻ tính từ thời điểm tạo tệp hay từ máy chủ nào phục vụ: cùng nội dung mà khác thẻ. Tính thẻ từ <b>nội dung</b> (mã băm).</span></div>
        say: "Lỗi thứ ba, thẻ phiên bản đổi mỗi lần dựng lại, nên mã 304 không bao giờ xảy ra. Thẻ tính từ thời điểm tạo tệp, hay từ máy chủ nào phục vụ, thì cùng nội dung mà khác thẻ. Hãy tính thẻ từ nội dung, bằng mã băm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Sợ người dùng kẹt bản cũ, tắt hẳn bộ nhớ đệm cho mọi tệp <b class="red">(người đã đi làm hay mắc)</b>
          <br><span class="note">Sau một lần phát hành lỗi, đội đặt <code>no-store</code> cho cả tệp tĩnh “cho chắc”. Mỗi lần mở lại tải lại toàn bộ. Cách đúng là lỗi 1: HTML xác thực lại, tệp tĩnh đổi tên theo mã băm.</span></div>
          <table class="t"><tr><th>số minh hoạ: 2000 người, mỗi người mở 5 lần, tệp tĩnh 500 KB</th><th>tải mỗi ngày</th></tr>
          <tr><td>tắt bộ nhớ đệm: $2000 \cdot 5 \cdot 500$ KB</td><td>$\hl{5}$ GB</td></tr>
          <tr><td>mã băm trong tên, lưu lâu: chỉ lần mở đầu</td><td>$2000 \cdot 500$ KB = 1 GB</td></tr></table>
        focus: [1, 1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, vì sợ người dùng kẹt ở bản cũ nên tắt hẳn bộ nhớ đệm cho mọi tệp. Sau một lần phát hành lỗi, cả đội cấm lưu luôn các tệp tĩnh cho chắc ăn, và mỗi lần mở lại phải tải lại toàn bộ. Cách đúng chính là lỗi thứ nhất, trang HTML luôn xác thực lại, còn tệp tĩnh đổi tên theo mã băm. Bảng dùng số minh hoạ, 2000 người, mỗi người mở 5 lần một ngày, tệp tĩnh 500 KB. Tắt bộ nhớ đệm thì mỗi ngày tải 2000 nhân 5 nhân 500 KB, bằng 5 GB. Dùng mã băm trong tên và lưu lâu thì chỉ lần mở đầu phải tải, tổng 1 GB, ít hơn 5 lần."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.http_cache_decision(1800, 3600, 'a', 'b') == 'fresh' and alg.http_cache_decision(3700, 3600, 'a', 'a') == 304"
      - "3600 / 60 == 60 and 5 * 60 == 300 and not alg.cache_fresh(300, 300) and alg.cache_fresh(299, 300)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ảnh có max-age 3600 s, bản lưu 1800 s tuổi, máy chủ <b>đã</b> có ảnh mới. Người dùng thấy ảnh nào? Có ra mạng không?</td></tr>
          <tr><td>2</td><td>Bản lưu 3700 s tuổi, thẻ vẫn khớp. Máy chủ trả gì?</td></tr>
          <tr><td>3</td><td>Quyết định: trang tin đặt max-age 3600 s. Người đọc có thể thấy tin cũ tới bao nhiêu phút? Muốn không quá 5 phút thì đặt max-age tối đa bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", "1.4", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ảnh có thời gian tươi 3600 giây, bản lưu 1800 giây tuổi, và máy chủ đã có ảnh mới. Người dùng thấy ảnh nào? Có ra mạng không? Câu hai, bản lưu 3700 giây tuổi, và thẻ vẫn khớp. Máy chủ trả gì? Câu ba là một quyết định, trang tin đặt thời gian tươi 3600 giây, vậy người đọc có thể thấy tin cũ tới bao nhiêu phút? Muốn không quá 5 phút thì đặt thời gian tươi tối đa bao nhiêu giây? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $1800 \lt 3600$ → còn tươi → ảnh <b>cũ</b>, không ra mạng — trình duyệt không hề biết máy chủ đã đổi. Đó là cái giá của độ tươi.</p>
          <p>② $3700 \ge 3600$ → đã cũ → hỏi kèm thẻ, thẻ khớp → <b>$\hl{304}$</b> — không gửi lại thân, tuổi đếm lại từ 0, tươi thêm 3600 s.</p>
        introduces: [geq]
        focus: [1, 1, 2, 2]
        say: "Đáp án câu một, so tuổi 1800 với thời gian tươi 3600, vì 1800 nhỏ hơn nên bản lưu còn tươi. Người dùng thấy ảnh cũ và không ra mạng, vì bản lưu còn tươi và trình duyệt không hề biết máy chủ đã đổi, đó là cái giá của độ tươi. Câu hai, tuổi 3700 lớn hơn 3600 nên đã cũ, trình duyệt hỏi kèm thẻ, và thẻ khớp. Máy chủ trả 304, không gửi lại thân, và bản lưu được gia hạn, tuổi đếm lại từ 0 nên tươi thêm 3600 giây."
      - show: |
          <p>③ Tệ nhất: tin đổi ngay sau khi người đọc vừa lưu → thấy tin cũ suốt $\frac{3600}{60} = \hl{60}$ phút. Muốn không quá 5 phút: max-age tối đa $5 \cdot 60 = 300$ s.</p>
        say: "Câu ba, trường hợp tệ nhất là tin đổi ngay sau khi người đọc vừa lưu bản mới, nên họ thấy tin cũ suốt 3600 chia 60, bằng 60 phút. Muốn không quá 5 phút thì thời gian tươi tối đa là 5 nhân 60, bằng 300 giây."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">còn tươi: dùng bản lưu, không ra mạng</span><span class="a">→</span>
          <span class="n">đã cũ: hỏi kèm thẻ phiên bản</span><span class="a">→</span>
          <span class="n">khớp: 304; khác: 200 + thân mới</span><span class="a">→</span>
          <span class="n">HTML luôn xác thực lại; tệp có mã băm trong tên: lưu lâu</span></div>
        say: "Tổng kết lại, bản lưu còn tươi thì dùng thẳng, đã cũ thì hỏi kèm thẻ phiên bản. Thẻ khớp thì nhận 304, khác thì nhận 200 kèm thân mới. Trang HTML luôn xác thực lại, còn tệp có mã băm trong tên thì lưu lâu."
      - show: |
          <div class="box key"><b>Tư duy:</b> mọi bộ nhớ đệm là một lời cược rằng dữ liệu <b>chưa đổi</b> — biết rõ mình cược bao lâu, và cách huỷ cược.</div>
        say: "Điều cần mang theo, mọi bộ nhớ đệm là một lời cược rằng dữ liệu chưa đổi, nên hãy biết rõ mình cược bao lâu, và cách huỷ cược."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>xác thực cho web và di động</b> — phiên, mã truy cập, ủy quyền có PKCE.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học xác thực cho web và di động, với phiên, mã truy cập, và luồng ủy quyền. Hẹn gặp bạn ở bài tiếp theo."
