id: L08
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 8 — Bộ nhớ đệm HTTP: độ tươi, thẻ phiên bản, xác thực lại"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L08; audit/web/verify_web.py L08; RFC 9111 (HTTP Caching), mục 4.2 (độ tươi), 4.3 (xác thực lại), 5.2 (Cache-Control); RFC 9110 mục 8.8.3 (ETag), 13.1.2 (If-None-Match), 15.4.5 (304); bài 6"
assumes: [arith, frac, cdot]
# Quy ước: bản lưu còn TƯƠI khi tuổi < max-age (alg.cache_fresh). Đã cũ thì gửi yêu cầu có điều kiện kèm thẻ phiên bản (ETag) đã lưu: khớp → 304,
#   không gửi lại thân; khác → 200 kèm thân mới (alg.http_cache_decision). Tên tiêu đề HTTP trong <code>; lời đọc mô tả bằng tiếng Việt.
#   Kích thước trang 50 KB là SỐ MINH HOẠ.
objectives:
  - "Tính bản lưu còn tươi hay đã cũ"
  - "Dùng thẻ phiên bản để trả 304"
  - "Chọn chính sách lưu cho từng loại tài nguyên"
