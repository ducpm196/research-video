title: "Bài 15 — Tình huống chuyên gia theo dòng thời gian: HTTP từ 1.0 tới 3"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
case: journey
source: "curriculum/web.yaml L15; audit/web/sources_L15.md (câu trích nguyên văn, đọc 2026-11-02); audit/web/verify_web.py L15; T. Berners-Lee, R. Fielding, H. Frystyk, RFC 1945 HTTP/1.0, 5/1996 [R96]; R. Fielding và cộng sự, RFC 2616 HTTP/1.1, 6/1999 [R99]; R. Fielding và cộng sự, RFC 2068 HTTP/1.1 (bản 1.1 đầu tiên), 1/1997 [R97]; M. Belshe, R. Peon, M. Thomson, RFC 7540 HTTP/2 và R. Peon, H. Ruellan, RFC 7541 HPACK, 5/2015 [R15]; R. Fielding, M. Nottingham, J. Reschke, RFC 9112 HTTP/1.1, 6/2022 [R22a]; M. Bishop, RFC 9114 HTTP/3, M. Thomson, C. Benfield, RFC 9113 HTTP/2, R. Fielding và cộng sự, RFC 9110 HTTP Semantics, 6/2022 [R22b]; RFC 9293 §3.5 (bắt tay ba bước của TCP); RFC 5681 §3.1 (khởi động chậm: cửa sổ tăng theo mỗi xác nhận, gấp đôi mỗi vòng); RFC 6928 (cửa sổ đầu 10 gói); WEB bài 0 (vòng khứ hồi), bài 4 (chờ tuần tự hay đồng thời), bài 10 (hiệu năng web)"
assumes: [arith, frac, approx]
# Quy ước: “vòng” = một thời gian khứ hồi, lấy 50 ms như bài 0. Đếm vòng bỏ qua thời gian truyền và bỏ qua bắt tay mã hoá (để so các
#   phiên bản HTTP cho công bằng; các RFC đã đọc không đếm vòng của phần mã hoá). Trang mẫu: 1 tệp trang + 10 ảnh (số minh hoạ).
#   Mọi sự kiện có nguồn ghi trong audit/web/sources_L15.md; con số khác là phép tính lại (checks) hoặc ghi “số minh hoạ”.
#   Lời đọc không nói RFC, HPACK, SPDY, DEFLATE, CRIME, Alt-Svc, TLS: nói “bộ chuẩn năm …”, “cách nén tiêu đề riêng”, “thuật toán nén
#   chung”, “một kiểu tấn công đoán dữ liệu qua độ dài bản nén”, “một trường tiêu đề quảng bá”. Probe WEB p3 (audit/web/probes/p3_hanh_trinh.md): TCP, UDP thô 8/8 → đọc thô; QUIC mọi cách ≤ 1/8 →
#   KHÔNG đọc, chữ QUIC chỉ trên màn hình; lời đọc nói “giao thức giao vận mới dựa trên UDP”, “giao thức mới”.
objectives:
  - "Kể lại hành trình của HTTP qua năm chặng 1996, 1999, 2015, 2022, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Đếm lại số vòng khứ hồi để tải một trang ở từng phiên bản, và thời gian chờ khi một gói bị mất"
  - "Chọn phiên bản và cách tải phù hợp với trang và người dùng của chính mình, kèm điều kiện đổi lựa chọn"
asr_reviewed:
  - {sentence: "Làm thử với số minh hoạ, 100 yêu cầu, mỗi tiêu đề 500 byte, và cửa sổ đầu 10 gói, mỗi gói 1460 byte, nhân đôi mỗi vòng theo cách khởi động chậm.", reason: "ASR chép “Làm thử với số minh họa, 100 yêu cầu, mỗi tiêu đề 500 by và cửa sổ đầu 10 gói, mỗi gói 1460 by, nhận đôi mỗi vòng theo cách khởi động chậm.” (0.925): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: nhân (trong “byte nhân” → “by nhận”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cửa sổ của TCP là lượng byte được gửi đi trước khi phải chờ xác nhận, lúc đầu nhỏ, và mỗi vòng suôn sẻ thì gấp đôi, gọi là khởi động chậm.", reason: "ASR chép “Cửa sổ của TCP là lượng bay được gửi đi trước khi phải chờ xác nhận, lúc đầu nhỏ và mỗi vòng xung sẻ thì gấp đôi, gọi là khởi động chậm.” (0.938): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: suôn/xung — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mỗi kết nối tốn tài nguyên máy chủ, và TCP không chia kiểm soát tắc nghẽn giữa các kết nối, nên 6 kết nối mỗi cái 10 gói đầu là 60 gói ồ ạt, một số minh hoạ.", reason: "ASR chép “Mỗi kết nối tốn tại nguyên máy chủ và TCP không chia kiểm soát tắt ngạn giữa các kết nối nên 6 kết nối mỗi cái 10 gói đầu là 60 gói oạt, một số minh họa.” (0.883): lệch âm/thanh thuần Việt: tài/tại, tắc nghẽn/tắt ngạn, ồ ạt/oạt — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước một, tiêu đề không nén tổng cộng 50 nghìn byte.", reason: "ASR chép “Bước 1, tiêu đề không nén tổng cộng 50.000 bay.” (0.917): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước hai, cửa sổ đầu là 14 nghìn 600 byte.", reason: "ASR chép “Bước 2, cửa sổ đầu là 14.600 bay.” (0.917): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước bốn, nếu nén để mỗi tiêu đề lặp lại chỉ còn 20 byte, tổng là 2480 byte, gửi trong 1 vòng.", reason: "ASR chép “Bước 4, nếu nén để mỗi tiêu đề lập lại chỉ còn 20 byte, tổng là 2.483, gửi trong 1 vòng.” (0.929): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: lặp/lập — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với tiêu đề, sau 2 vòng mới gửi được 43 nghìn 800 byte, chưa đủ 50 nghìn, nên phải tới vòng 3.", reason: "ASR chép “Với tiêu đề, sau 2 vòng mới gửi được 43.800 bai, chưa đủ 50.000 nên phải tới vòng 3.” (0.962): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở bài 10, thời gian tải bằng kích thước chia tốc độ, 2000 KB ở 200 KB mỗi giây mất 10 giây.", reason: "ASR chép “Ở bài 10, thời gian tải bằng kích thước chia tốc độ 2.000 kB ở 200 kB mỗi giây mất 10 giây.” (1.0): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “KB/kilobyte” — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cùng một trang 11 tệp: 22 vòng năm 1996, 3 vòng năm 1999"
    checks:
      - "11 * 2 == 22 and 22 * 50 == 1100"
      - "1 + 1 + 1 == 3 and 3 * 50 == 150"
    steps:
      - show: |
          <p>Một trang gồm <b>1 tệp trang + 10 ảnh</b> (số minh hoạ), mỗi vòng khứ hồi 50 ms:</p>
          <table class="t"><tr><th>năm</th><th>cách tải</th><th>số vòng</th><th>thời gian chờ</th></tr>
          <tr><td>1996</td><td>mỗi yêu cầu một kết nối mới</td><td>22</td><td>1100 ms</td></tr>
          <tr><td>1999</td><td>giữ kết nối, gửi liền nhiều yêu cầu</td><td>3</td><td>$\hlg{150}$ ms</td></tr></table>
          <div class="box key">Hôm nay: đi lại hành trình của HTTP qua năm chặng. Mỗi lần web lớn hơn, một điểm nghẽn mới lộ ra — và chuyên gia đã xử lý ra sao.</div>
        focus: [1, "2.2", "2.3", 3]
        say: "Chào bạn, lấy một trang gồm 1 tệp trang và 10 ảnh, một số minh hoạ, với mỗi vòng khứ hồi 50 mi li giây. Năm 1996, mỗi yêu cầu mở một kết nối mới, nên cần 22 vòng, tức 1100 mi li giây chỉ để chờ. Năm 1999, giữ kết nối và gửi liền nhiều yêu cầu, chỉ còn 3 vòng, tức 150 mi li giây. Hôm nay ta đi lại hành trình của HTTP qua năm chặng, xem mỗi lần web lớn hơn thì điểm nghẽn nào lộ ra, và chuyên gia đã xử lý ra sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ các bài trước"
    checks:
      - "50 + 50 == 100"
      - "100 + 200 + 300 == 600 and max(100, 200, 300) == 300"
      - "2000 / 200 == 10"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 0</td><td><b>vòng</b> khứ hồi = thời gian gói đi tới máy chủ rồi phản hồi quay về; bắt tay giao vận tốn <b>1 vòng</b>, rồi mỗi yêu cầu và phản hồi thêm 1 vòng</td><td>vòng 50 ms: kết nối + 1 yêu cầu = 100 ms</td></tr>
          <tr><td>bài 4</td><td>chờ lần lượt thì cộng dồn; chạy đồng thời thì chờ việc lâu nhất</td><td>100, 200, 300 ms: lần lượt 600, đồng thời 300</td></tr>
          <tr><td>bài 10</td><td>thời gian tải = kích thước chia tốc độ</td><td>2000 KB ở 200 KB/s = 10 s</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3", "1.4"]
        say: "Bảng nhắc lại ba điều từ các bài trước. Ở bài 0, một vòng khứ hồi là thời gian gói đi tới máy chủ rồi phản hồi quay về. Bắt tay giao vận tốn 1 vòng khứ hồi, rồi mỗi yêu cầu và phản hồi thêm 1 vòng. Với vòng 50 mi li giây, kết nối cộng một yêu cầu là 100 mi li giây. Ở bài 4, chờ lần lượt thì thời gian cộng dồn, chạy đồng thời thì chỉ chờ việc lâu nhất, ba việc 100, 200, 300 cho 600 và 300. Ở bài 10, thời gian tải bằng kích thước chia tốc độ, 2000 KB ở 200 KB mỗi giây mất 10 giây."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>kết nối bền</b></td><td>giữ một kết nối giao vận cho nhiều yêu cầu, không đóng sau mỗi phản hồi</td></tr>
          <tr><td><b>gửi liền</b></td><td>gửi nhiều yêu cầu mà không chờ từng phản hồi; phản hồi phải về <b>đúng thứ tự</b></td></tr>
          <tr><td><b>chặn đầu hàng</b></td><td>một phần chậm hay bị mất ở đầu hàng làm mọi phần phía sau phải chờ</td></tr>
          <tr><td><b>luồng</b></td><td>một cặp yêu cầu–phản hồi chạy xen với các cặp khác trên cùng một kết nối</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bài dùng bốn thuật ngữ. Kết nối bền là giữ một kết nối giao vận cho nhiều yêu cầu, không đóng sau mỗi phản hồi. Gửi liền là gửi nhiều yêu cầu mà không chờ từng phản hồi, nhưng phản hồi phải về đúng thứ tự. Chặn đầu hàng là khi một phần chậm hay bị mất ở đầu hàng làm mọi phần phía sau phải chờ. Luồng là một cặp yêu cầu và phản hồi chạy xen với các cặp khác trên cùng một kết nối."
      - clear: true
        show: |
          <table class="t"><tr><th>tầng giao vận (phần chở dữ liệu bên dưới HTTP)</th><th>nghĩa</th></tr>
          <tr><td><b>TCP</b></td><td>chở dữ liệu đủ và đúng thứ tự: gói nào mất thì gửi lại, phần phía sau phải chờ</td></tr>
          <tr><td><b>UDP</b></td><td>gửi từng gói đơn giản, không tự gửi lại, không giữ thứ tự</td></tr>
          <tr><td><b>QUIC</b></td><td>giao thức giao vận mới chạy trên UDP, tự lo việc gửi lại cho <b>từng luồng</b></td></tr>
          <tr><td><b>cửa sổ</b> của TCP</td><td>lượng byte được gửi đi trước khi phải chờ xác nhận; lúc đầu nhỏ, mỗi vòng suôn sẻ thì gấp đôi (<b>khởi động chậm</b>)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng thứ hai nói về tầng giao vận, là phần chở dữ liệu bên dưới HTTP. TCP chở dữ liệu đủ và đúng thứ tự, gói nào mất thì gửi lại, và phần phía sau phải chờ. UDP gửi từng gói một cách đơn giản, không tự gửi lại và không giữ thứ tự. Dòng thứ ba là một giao thức giao vận mới chạy trên UDP, tự lo việc gửi lại cho từng luồng. Cửa sổ của TCP là lượng byte được gửi đi trước khi phải chờ xác nhận, lúc đầu nhỏ, và mỗi vòng suôn sẻ thì gấp đôi, gọi là khởi động chậm."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="170" cy="150" r="15" fill="#9ca3af"/><text x="170" y="108" font-weight="bold">1996: bản 1.0</text><text x="170" y="200">mỗi yêu cầu</text><text x="170" y="232">một kết nối</text>
          <circle cx="510" cy="150" r="15" fill="#2a78d6"/><text x="510" y="108" font-weight="bold">1997–1999: bản 1.1</text><text x="510" y="200">kết nối bền, gửi liền</text><text x="510" y="232">phản hồi đúng thứ tự</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2015: bản 2</text><text x="850" y="200">nhiều luồng, một kết nối</text><text x="850" y="232">nén tiêu đề</text>
          <circle cx="1190" cy="150" r="15" fill="#eb6834"/><text x="1190" y="108" font-weight="bold">2022: bản 3</text><text x="1190" y="200">trên QUIC</text><text x="1190" y="232">luồng độc lập khi mất gói</text>
          <circle cx="1530" cy="150" r="15" fill="#059669"/><text x="1530" y="108" font-weight="bold">2022</text><text x="1530" y="200">một ngữ nghĩa chung</text><text x="1530" y="232">có đường lùi</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">bản ghi chuẩn đầu tiên → trang nhiều tệp → hàng trăm yêu cầu → mạng di động mất gói → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 1996, phiên bản 1 chấm 0 mở mỗi yêu cầu một kết nối. Phiên bản 1 chấm 1 ra năm 1997, và bản sửa năm 1999 giữ kết nối và gửi liền nhiều yêu cầu. Năm 2015, phiên bản 2 chạy nhiều luồng trên một kết nối và nén tiêu đề. Năm 2022, phiên bản 3 chạy trên một giao thức giao vận mới dựa trên UDP, và cũng năm đó cả ba phiên bản được viết lại quanh một ngữ nghĩa chung."

  # ───────────────────────── 5. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 1996 — bản ghi chuẩn đầu tiên: mỗi yêu cầu một kết nối"
    stage: {year: "1996", scale: "trang có ảnh nhúng: nhiều yêu cầu tới cùng một máy chủ trong thời gian ngắn", source: "[R96] §1.3; [R99] §8.1.1", practice: "giữ kết nối bền cho nhiều yêu cầu; đo chi phí của mỗi lần mở kết nối"}
    checks:
      - "1 + 1 == 2 and 11 * 2 == 22 and 22 * 50 == 1100"
      - "11 * 3 == 33"
    steps:
      - show: |
          <p><b>Quy mô:</b> bộ chuẩn năm 1996 ghi: kết nối được máy khách mở <b>trước mỗi yêu cầu</b> và máy chủ đóng <b>sau khi gửi phản hồi</b>.</p>
          <p><b>Điểm nghẽn</b> (bộ chuẩn năm 1999 nhìn lại): trang dùng ảnh nhúng nên máy khách gửi nhiều yêu cầu liền nhau; mỗi tệp một kết nối riêng “làm tăng tải máy chủ và gây tắc nghẽn trên Internet”.</p>
        focus: [1, 2, 2]
        say: "Ở chặng một, bộ chuẩn năm 1996 ghi rằng máy khách mở kết nối trước mỗi yêu cầu, và máy chủ đóng nó sau khi gửi phản hồi. Bộ chuẩn năm 1999 nhìn lại và chỉ ra điểm nghẽn, trang dùng ảnh nhúng nên máy khách gửi nhiều yêu cầu liền nhau. Mỗi tệp một kết nối riêng làm tăng tải máy chủ và gây tắc nghẽn trên Internet."
      - clear: true
        show: |
          <p><b>Đếm vòng, làm thử</b> (trang 1 tệp + 10 ảnh, tải lần lượt, vòng 50 ms; chưa tính bắt tay mã hoá, để so các phiên bản cho công bằng):</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. một tệp: bắt tay giao vận + yêu cầu</td><td>$1 + 1$</td><td>2 vòng</td></tr>
          <tr><td>2. cả trang: 11 tệp</td><td>$11 \times 2$</td><td>22 vòng</td></tr>
          <tr><td>3. đổi ra thời gian</td><td>$22 \times 50$</td><td>$\hl{1100}$ ms chỉ để chờ</td></tr>
          <tr><td>4. gói mở kết nối: bắt tay ba bước (xin mở → đồng ý → xác nhận)</td><td>$11 \times 3$</td><td>33 gói chỉ để mở, đóng chưa tính</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5", "2.5"]
        say: "Đếm vòng với trang 1 tệp và 10 ảnh, tải lần lượt, mỗi vòng 50 mi li giây, và chưa tính bắt tay mã hoá để so các phiên bản cho công bằng. Bước một, mỗi tệp cần 1 vòng bắt tay giao vận cộng 1 vòng yêu cầu, là 2 vòng. Bước hai, cả trang có 11 tệp, nhân 2 được 22 vòng. Bước ba, 22 nhân 50 là 1100 mi li giây chỉ để chờ. Bước bốn, mỗi lần mở kết nối là một cuộc bắt tay ba bước, máy khách xin mở, máy chủ đồng ý, máy khách xác nhận. Vậy mỗi lần có 3 gói, và 11 lần là 33 gói chỉ để mở kết nối."

  # ───────────────────────── 6. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 1999 — tăng trưởng: kết nối bền và gửi liền"
    stage: {year: "1999", scale: "trang nhiều tệp nhúng; mỗi người dùng không quá 2 kết nối tới một máy chủ", source: "[R99] §8.1.1, §8.1.2.2, §8.1.4; [R15] §1; [R22a] §9.4", practice: "kết nối bền là mặc định; gửi liền khi máy chủ hỗ trợ; nhớ rằng phản hồi về đúng thứ tự nên một phản hồi chậm chặn cả hàng"}
    checks:
      - "1 + 11 == 12 and 12 * 50 == 600"
      - "1 + 1 + 1 == 3 and 3 * 50 == 150 and round(1100 / 150, 1) == 7.3"
      - "(lambda t: [max(t[:k + 1]) for k in range(len(t))])([300, 10, 10]) == [300, 300, 300]"
    steps:
      - show: |
          <p><b>Cách xử lý của bộ chuẩn năm 1999</b> (bản sửa; bản 1.1 đầu tiên, tháng 1/1997, đã có cùng các luật này): <b>kết nối bền</b> (“nên cài đặt”), và cho phép <b>gửi liền</b> nhiều yêu cầu không chờ phản hồi — nhưng máy chủ phải trả phản hồi <b>đúng thứ tự</b> đã nhận.</p>
          <table class="t"><tr><th>cách tải trang 11 tệp</th><th>đếm vòng</th><th>thời gian</th></tr>
          <tr><td>kết nối bền, chờ từng phản hồi</td><td>1 bắt tay + 11 yêu cầu = 12</td><td>$12 \times 50 = 600$ ms</td></tr>
          <tr><td>kết nối bền, gửi liền 10 ảnh sau khi có trang</td><td>1 bắt tay + 1 trang + 1 cho cả 10 ảnh = 3</td><td>$3 \times 50 = \hlg{150}$ ms</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Cách xử lý của bộ chuẩn năm 1999, bản sửa của bản 1 chấm 1 đầu tiên ra tháng 1 năm 1997, là kết nối bền, ghi rõ các bản cài đặt nên có. Nó cũng cho phép gửi liền nhiều yêu cầu không chờ phản hồi, nhưng máy chủ phải trả phản hồi đúng thứ tự đã nhận. Giữ kết nối mà vẫn chờ từng phản hồi thì cần 1 vòng bắt tay cộng 11 vòng yêu cầu, tức 12 vòng, 600 mi li giây. Gửi liền 10 ảnh sau khi có trang thì chỉ còn 3 vòng, 150 mi li giây, nhanh hơn khoảng 7 phẩy 3 lần so với năm 1996."
      - clear: true
        show: |
          <p><b>Điểm nghẽn mới — chặn đầu hàng, làm thử</b> (số minh hoạ): gửi liền 3 yêu cầu; máy chủ xử lý yêu cầu đầu mất 300 ms, hai yêu cầu sau mỗi cái 10 ms.</p>
          <table class="t"><tr><th>yêu cầu</th><th>tự nó cần</th><th>phải chờ tới khi phản hồi được gửi</th></tr>
          <tr><td>1</td><td>300 ms</td><td>300 ms</td></tr>
          <tr><td>2</td><td>10 ms</td><td>$\hl{300}$ ms: chờ phản hồi 1 đi trước</td></tr>
          <tr><td>3</td><td>10 ms</td><td>$\hl{300}$ ms</td></tr></table>
          <p class="note">Vì vậy máy khách mở <b>nhiều kết nối</b> song song (bộ chuẩn HTTP/2 năm 2015 ghi lại). Năm 1999 khuyên mỗi người dùng không quá 2 kết nối tới mỗi máy chủ; năm 2022 bỏ con số cố định vì “không thực tế”, chỉ khuyên dè dặt.</p>
        focus: [1, "2.2", "2.3", "2.4", 3, 3]
        say: "Điểm nghẽn mới là chặn đầu hàng, làm thử với số minh hoạ. Gửi liền 3 yêu cầu, máy chủ xử lý yêu cầu đầu mất 300 mi li giây, còn hai yêu cầu sau mỗi cái chỉ 10 mi li giây. Yêu cầu đầu xong lúc 300. Yêu cầu hai và ba tự nó chỉ cần 10, nhưng phải chờ phản hồi đầu đi trước, nên cũng tới lúc 300. Vì vậy máy khách mở nhiều kết nối song song. Năm 1999 khuyên mỗi người dùng không quá 2 kết nối tới mỗi máy chủ, còn năm 2022 bỏ con số cố định vì không thực tế, chỉ khuyên dè dặt."

  # ───────────────────────── 7. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2015 — quy mô lớn: nhiều luồng trên một kết nối, nén tiêu đề"
    stage: {year: "2015", scale: "trang cần “hàng chục tới hàng trăm yêu cầu”; tiêu đề lặp lại làm đầy cửa sổ đầu của TCP", source: "[R15] RFC 7540 §1, RFC 7541 §1", practice: "chạy xen nhiều luồng trên một kết nối thay vì mở nhiều kết nối; nén tiêu đề bằng cách nén riêng, đơn giản, không dùng thuật toán nén chung"}
    checks:
      - "100 * 500 == 50000 and 10 * 1460 == 14600"
      - "(lambda n, w: (lambda f: f(f, n, w, 0))(lambda f, n, w, r: r if n <= 0 else f(f, n - w, 2 * w, r + 1)))(50000, 14600) == 3"
      - "500 + 99 * 20 == 2480 and 2480 < 14600"
    steps:
      - show: |
          <p><b>Điểm nghẽn</b> (bộ chuẩn HTTP/2, năm 2015): phiên bản 1.1 chỉ giải quyết <b>một phần</b> việc chạy đồng thời và vẫn bị chặn đầu hàng; tiêu đề thì “lặp lại và dài dòng”, làm đầy nhanh cửa sổ đầu của TCP.</p>
          <p><b>Cách xử lý:</b> chạy <b>xen kẽ</b> yêu cầu và phản hồi của nhiều luồng trên <b>một</b> kết nối; mã hoá tiêu đề gọn hơn. Kết quả “thân thiện hơn với mạng vì dùng ít kết nối TCP hơn”.</p>
        focus: [1, 1, 2, 2]
        say: "Ở chặng ba, bộ chuẩn HTTP phiên bản 2 năm 2015 ghi rằng phiên bản 1 chấm 1 chỉ giải quyết một phần việc chạy đồng thời, và vẫn bị chặn đầu hàng. Tiêu đề thì lặp lại và dài dòng, làm đầy nhanh cửa sổ đầu của TCP. Cách xử lý là chạy xen kẽ yêu cầu và phản hồi của nhiều luồng trên một kết nối, và mã hoá tiêu đề gọn hơn. Bộ chuẩn ghi rằng kết quả thân thiện hơn với mạng vì dùng ít kết nối TCP hơn."
      - clear: true
        show: |
          <p><b>Tiêu đề lặp lại, làm thử</b> (số minh hoạ: 100 yêu cầu, mỗi tiêu đề 500 byte; cửa sổ đầu 10 gói × 1460 byte, nhân đôi mỗi vòng theo khởi động chậm).</p>
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>1. tổng tiêu đề không nén</td><td>$100 \times 500$</td><td>50 000 byte</td></tr>
          <tr><td>2. cửa sổ đầu</td><td>$10 \times 1460$</td><td>14 600 byte</td></tr>
          <tr><td>3. số vòng chỉ để gửi tiêu đề</td><td>14 600, rồi 29 200, rồi 58 400: cộng dồn vượt 50 000 ở vòng 3</td><td>$\hl{3}$ vòng</td></tr>
          <tr><td>4. nén: tiêu đề đầu 500 byte, 99 tiêu đề sau chỉ còn 20 byte</td><td>$500 + 99 \times 20$</td><td>2480 byte &lt; 14 600 → $\hlg{1}$ vòng</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Làm thử với số minh hoạ, 100 yêu cầu, mỗi tiêu đề 500 byte, và cửa sổ đầu 10 gói, mỗi gói 1460 byte, nhân đôi mỗi vòng theo cách khởi động chậm. Bước một, tiêu đề không nén tổng cộng 50 nghìn byte. Bước hai, cửa sổ đầu là 14 nghìn 600 byte. Bước ba, các vòng gửi 14 nghìn 600, rồi 29 nghìn 200, rồi 58 nghìn 400, nên tới vòng 3 mới gửi hết tiêu đề. Bước bốn, nếu nén để mỗi tiêu đề lặp lại chỉ còn 20 byte, tổng là 2480 byte, gửi trong 1 vòng."
      - clear: true
        show: |
          <div class="box warn"><b>Bài học an ninh của nén:</b> bản thử nghiệm trước đó dùng một thuật toán nén chung cho tiêu đề, và một kiểu tấn công <b>đoán dữ liệu qua độ dài bản nén</b> đã chứng minh nó rủi ro.</div>
          <p>Cách nén tiêu đề của năm 2015 được làm <b>đơn giản và cứng nhắc có chủ ý</b>, không có cơ chế mở rộng — để giảm lỗi cài đặt và lỗ hổng.</p>
        focus: [1, 1, 2]
        say: "Còn một bài học an ninh. Bản thử nghiệm trước đó nén tiêu đề bằng một thuật toán nén chung, và một kiểu tấn công đoán dữ liệu qua độ dài bản nén đã chứng minh cách đó rủi ro. Vì vậy cách nén tiêu đề của năm 2015 được làm đơn giản và cứng nhắc có chủ ý, không có cơ chế mở rộng, để giảm lỗi cài đặt và lỗ hổng."

  # ───────────────────────── 8. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2022 — mạng mất gói: HTTP/3 trên QUIC"
    stage: {year: "2022", scale: "mọi luồng HTTP/2 dùng chung một kết nối TCP; một gói mất làm mọi luồng dừng", source: "[R22b] RFC 9114 §1.1, §1.2, §2, §3.1", practice: "đưa luồng xuống tầng giao vận để gói mất chỉ chặn luồng của nó; luôn giữ đường lùi về TCP khi UDP bị chặn"}
    checks:
      - "4 * 50 == 200 and 1 * 50 == 50 and 200 // 50 == 4"
    steps:
      - show: |
          <p><b>Điểm nghẽn</b> (bộ chuẩn HTTP/3, năm 2022): luồng của phiên bản 2 nằm trên TCP, mà TCP <b>không nhìn thấy</b> các luồng — một gói mất hay đến sai thứ tự làm <b>mọi</b> giao dịch dừng, dù giao dịch đó không bị ảnh hưởng trực tiếp.</p>
          <p><b>Cách xử lý:</b> chạy trên QUIC, nơi luồng là của tầng giao vận: “luồng độc lập với nhau, một luồng bị chặn hay mất gói không cản các luồng khác”.</p>
        focus: [1, 1, 2]
        say: "Ở chặng bốn, bộ chuẩn HTTP phiên bản 3 năm 2022 ghi rằng luồng của phiên bản 2 nằm trên TCP, mà TCP không nhìn thấy các luồng. Một gói mất hay đến sai thứ tự làm mọi giao dịch dừng, dù giao dịch đó không bị ảnh hưởng trực tiếp. Cách xử lý là chạy trên một giao thức giao vận mới dựa trên UDP, nơi luồng thuộc tầng giao vận, nên một luồng mất gói không cản các luồng khác."
      - clear: true
        show: |
          <p><b>Mất một gói, làm thử</b> (số minh hoạ): 4 luồng đang tải, một gói của luồng A mất, gửi lại tốn 1 vòng = 50 ms.</p>
          <table class="t"><tr><th></th><th>HTTP/2 trên TCP</th><th>HTTP/3 trên QUIC</th></tr>
          <tr><td>luồng phải dừng</td><td>cả 4 luồng</td><td>chỉ luồng A</td></tr>
          <tr><td>tổng thời gian dừng của các luồng</td><td>$4 \times 50 = \hl{200}$ ms</td><td>$1 \times 50 = \hlg{50}$ ms</td></tr></table>
          <p class="note">Nếu mạng chặn UDP và QUIC không mở được, máy khách <b>nên</b> quay về phiên bản chạy trên TCP. Máy chủ báo có phiên bản 3 bằng một trường tiêu đề quảng bá.</p>
        focus: [1, "2.2", "2.3", 3, 3]
        say: "Làm thử với số minh hoạ, 4 luồng đang tải, một gói của luồng A mất, và gửi lại tốn 1 vòng, 50 mi li giây. Với phiên bản 2 trên TCP, cả 4 luồng dừng, tổng thời gian dừng là 4 nhân 50, bằng 200 mi li giây. Trên giao thức mới, chỉ luồng A dừng, tổng là 50 mi li giây. Nếu mạng chặn UDP và giao thức mới không mở được, máy khách nên quay về phiên bản chạy trên TCP. Máy chủ báo mình có phiên bản 3 bằng một trường tiêu đề quảng bá."

  # ───────────────────────── 9. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2022 — ổn định và tiếp tục phát triển: ngữ nghĩa chung"
    stage: {year: "2022", scale: "ba phiên bản cùng chạy trên web; HTTP/1.1 đã dùng 18 năm (1997–2015) trước khi có HTTP/2", source: "[R22b] RFC 9110 tóm tắt, RFC 9113 §5.3.2, RFC 9114 §1; [R22a] §9.4; [R97] RFC 2068 (1/1997)", practice: "tách ngữ nghĩa khỏi cách truyền để thay cách truyền mà không đổi ứng dụng; gỡ cơ chế ít người dùng nhưng vẫn giữ tương thích; bỏ con số cứng không thực tế"}
    checks:
      - "(1997 - 1996) * 12 + 1 - 5 == 8 and 2015 - 1997 == 18 and 2022 - 2015 == 7"
    steps:
      - show: |
          <table class="t"><tr><th>bộ chuẩn tháng 6/2022</th><th>bài học khi rất nhiều người dùng</th></tr>
          <tr><td>một văn bản <b>ngữ nghĩa chung</b> cho mọi phiên bản; phiên bản 3 “cùng ngữ nghĩa trên một tầng giao vận mới”</td><td>đổi cách truyền mà ứng dụng không phải viết lại</td></tr>
          <tr><td>HTTP/2 mới bỏ cơ chế báo ưu tiên của bản 2015 vì “không được dùng rộng rãi”, vẫn giữ trường để tương thích</td><td>gỡ thứ ít người dùng, nhưng không làm hỏng bản cài đặt cũ</td></tr>
          <tr><td>HTTP/1.1 bỏ giới hạn cứng “không quá 2 kết nối”</td><td>con số cứng hết đúng khi quy mô đổi</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Chặng năm là ổn định và tiếp tục phát triển. Tháng 6 năm 2022, một văn bản ngữ nghĩa chung được viết cho mọi phiên bản, và phiên bản 3 giữ cùng ngữ nghĩa trên một tầng giao vận mới, nên ứng dụng không phải viết lại. Bản mới của phiên bản 2 bỏ cơ chế báo ưu tiên của năm 2015 vì không được dùng rộng rãi, nhưng vẫn giữ trường để tương thích. Phiên bản 1 chấm 1 bỏ giới hạn cứng không quá 2 kết nối."
      - clear: true
        show: |
          <table class="t"><tr><th>khoảng giữa bộ chuẩn đầu tiên của hai phiên bản</th><th>phép tính</th><th>khoảng cách</th></tr>
          <tr><td>1.0 (5/1996) → 1.1 (1/1997)</td><td>từ tháng 5 tới tháng 1 năm sau</td><td>8 tháng</td></tr>
          <tr><td>1.1 (1997) → 2 (2015)</td><td>$2015 - 1997$</td><td>$\hlg{18}$ năm</td></tr>
          <tr><td>2 (2015) → 3 (2022)</td><td>$2022 - 2015$</td><td>7 năm</td></tr></table>
          <p class="note">Khi một giao thức được rất nhiều thiết bị dùng, mỗi lần đổi là việc của nhiều năm — nên đổi ở chỗ hẹp nhất (cách truyền), giữ nguyên chỗ rộng nhất (ngữ nghĩa).</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Tính lại khoảng cách giữa bộ chuẩn đầu tiên của các phiên bản. Bản 1 chấm 1 đầu tiên ra tháng 1 năm 1997, chỉ 8 tháng sau bản 1 chấm 0. Từ 1 chấm 1 lên 2 mất 2015 trừ 1997, bằng 18 năm, và từ 2 lên 3 mất 7 năm. Khi một giao thức được rất nhiều thiết bị dùng, mỗi lần đổi là việc của nhiều năm. Vì thế người ta đổi ở chỗ hẹp nhất là cách truyền, và giữ nguyên chỗ rộng nhất là ngữ nghĩa."

  # ───────────────────────── 10. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm số vòng bằng đường khác"
    checks:
      - "2 * 11 == 22 and 11 + 11 == 22"
      - "1 + 1 + 1 == 3 and 22 - 3 == 19"
      - "14600 + 29200 == 43800 and 43800 < 50000 and 43800 + 58400 >= 50000"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>22 vòng năm 1996</td><td>đếm theo loại: 11 vòng bắt tay + 11 vòng yêu cầu = 22 ✓</td></tr>
          <tr><td>3 vòng năm 1999</td><td>đếm mũi tên đi về: bắt tay, xin trang, xin 10 ảnh cùng lúc → 3; tiết kiệm $22 - 3 = 19$ vòng ✓</td></tr>
          <tr><td>3 vòng cho 50 000 byte tiêu đề</td><td>cộng dồn: sau 2 vòng mới được 43 800 &lt; 50 000; vòng 3 vượt → đúng 3 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Ta kiểm lại ba con số theo đường khác. Với 22 vòng, đếm theo loại, 11 vòng bắt tay cộng 11 vòng yêu cầu, ra 22. Với 3 vòng, đếm từng lượt đi về, bắt tay, xin trang, rồi xin 10 ảnh cùng lúc, là 3, tiết kiệm 19 vòng. Với tiêu đề, sau 2 vòng mới gửi được 43 nghìn 800 byte, chưa đủ 50 nghìn, nên phải tới vòng 3."

  # ───────────────────────── 11. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    checks:
      - "6 * 10 == 60 and 60 // 10 == 6"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> Mở thật nhiều kết nối cho nhanh (thói quen từ thời 1.1)</td><td>mỗi kết nối tốn tài nguyên máy chủ; TCP không chia kiểm soát tắc nghẽn giữa các kết nối; 6 kết nối mỗi cái 10 gói đầu là 60 gói ồ ạt (số minh hoạ)</td><td>một kết nối nhiều luồng; đo trước khi mở thêm</td></tr>
          <tr><td><b class="red">2.</b> “Lên phiên bản 3 là trang nào cũng nhanh hơn”</td><td>lợi ích chính là khi <b>mất gói</b>; mạng chặn UDP thì phải quay về TCP</td><td>đo trên mạng thật của người dùng; giữ đường lùi</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là thói quen từ thời 1 chấm 1, mở thật nhiều kết nối cho nhanh. Mỗi kết nối tốn tài nguyên máy chủ, và TCP không chia kiểm soát tắc nghẽn giữa các kết nối, nên 6 kết nối mỗi cái 10 gói đầu là 60 gói ồ ạt, một số minh hoạ. Bài học sai thứ hai là nghĩ lên phiên bản 3 thì trang nào cũng nhanh hơn. Lợi ích chính là khi mất gói, và mạng chặn UDP thì vẫn phải quay về TCP."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> Tự nén mọi thứ bằng thuật toán nén chung “cho tiết kiệm”</td><td>nén dữ liệu bí mật chung với dữ liệu người khác điều khiển đã từng làm lộ dữ liệu</td><td>dùng cách nén đã được thiết kế cho chỗ đó</td></tr>
          <tr><td><b class="red">4.</b> Đội giữ nguyên mẹo tối ưu cũ khi đã lên phiên bản mới</td><td>mẹo của thời 1.1 (gộp tệp, nhiều kết nối) sinh ra vì chặn đầu hàng — điểm nghẽn đã đổi</td><td>đo lại sau mỗi lần đổi phiên bản, gỡ mẹo không còn lý do</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3"]
        say: "Bài học sai thứ ba là tự nén mọi thứ bằng thuật toán nén chung cho tiết kiệm. Nén dữ liệu bí mật chung với dữ liệu người khác điều khiển đã từng làm lộ dữ liệu, nên hãy dùng cách nén được thiết kế cho đúng chỗ đó. Bài học sai thứ tư là đội giữ nguyên mẹo tối ưu cũ khi đã lên phiên bản mới. Mẹo của thời 1 chấm 1, như gộp tệp hay mở nhiều kết nối, sinh ra vì chặn đầu hàng, mà điểm nghẽn đã đổi."

  # ───────────────────────── 12. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "31 * 2 == 62 and 62 * 80 == 4960 and 1 + 1 + 1 == 3 and 3 * 80 == 240 and round((4960 - 240) / 1000, 1) == 4.7"
      - "4 * 80 == 320 and 1 * 80 == 80"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ, vòng 80 ms)</th></tr>
          <tr><td>1</td><td>Trang của bạn có 1 tệp trang + 30 tệp nhỏ. Một máy chủ cũ chỉ có phiên bản 1.0, đóng kết nối sau mỗi phản hồi. Nâng lên giữ kết nối và chạy nhiều luồng thì được bao nhiêu?</td></tr>
          <tr><td>2</td><td>Người dùng chủ yếu đi tàu, mạng di động hay mất gói; trang đã chạy phiên bản 2. Có nên bật phiên bản 3?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với số minh hoạ và mỗi vòng 80 mi li giây. Câu một, trang của bạn có 1 tệp trang và 30 tệp nhỏ, máy chủ cũ đóng kết nối sau mỗi phản hồi. Nâng lên giữ kết nối và chạy nhiều luồng thì được bao nhiêu? Câu hai, người dùng chủ yếu đi tàu, mạng di động hay mất gói, và trang đã chạy phiên bản 2. Có nên bật phiên bản 3? Dừng video và viết ra giấy."
        pause: 20
      - show: |
          <table class="t"><tr><th>câu 1</th><th>đếm vòng</th><th>thời gian</th></tr>
          <tr><td>mỗi tệp một kết nối, tải lần lượt</td><td>$31 \times 2 = 62$ vòng</td><td>$62 \times 80 = 4960$ ms</td></tr>
          <tr><td>một kết nối, nhiều luồng</td><td>bắt tay + trang + cả 30 tệp cùng lúc = 3 vòng</td><td>$3 \times 80 = \hlg{240}$ ms</td></tr></table>
          <p class="note">Được: bớt khoảng 4,7 giây chờ. Mất: phải nâng máy chủ và kiểm lại cấu hình. Điều kiện đổi lựa chọn: nếu 30 tệp đã nằm sẵn trong bộ nhớ đệm trình duyệt (bài 8) thì lợi ích nhỏ hơn nhiều.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Đáp án câu một, đếm vòng. Mỗi tệp một kết nối và tải lần lượt thì 31 tệp nhân 2 là 62 vòng, nhân 80 được 4960 mi li giây. Một kết nối nhiều luồng chỉ cần bắt tay, xin trang, rồi xin cả 30 tệp cùng lúc, là 3 vòng, 240 mi li giây. Được là bớt khoảng 4 phẩy 7 giây chờ, mất là phải nâng máy chủ và kiểm lại cấu hình. Nếu 30 tệp đã nằm sẵn trong bộ nhớ đệm của trình duyệt như ở bài 8, lợi ích nhỏ hơn nhiều."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>bật phiên bản 3, giữ phiên bản 2 làm đường lùi</td><td>mất 1 gói chỉ dừng 1 luồng: 4 luồng dừng $1 \times 80 = 80$ ms thay vì $4 \times 80 = 320$ ms</td><td>phải mở UDP ở hạ tầng, theo dõi thêm một đường</td></tr>
          <tr><td>giữ phiên bản 2</td><td>không đổi gì</td><td>mỗi gói mất làm mọi luồng dừng</td></tr></table>
          <p class="note">Điều kiện đổi lựa chọn: người dùng ở mạng ổn định, gần như không mất gói → lợi ích nhỏ, có thể chưa cần. Luôn đo trước và sau.</p>
        focus: [1, "1.2", "1.2", "1.3", 2]
        say: "Đáp án câu hai là một đánh đổi. Bật phiên bản 3 và giữ phiên bản 2 làm đường lùi thì mất 1 gói chỉ dừng 1 luồng, 80 mi li giây thay vì 320 cho 4 luồng. Đổi lại, bạn phải mở UDP ở hạ tầng và theo dõi thêm một đường. Giữ phiên bản 2 thì không đổi gì, nhưng mỗi gói mất làm mọi luồng dừng. Nếu người dùng ở mạng ổn định, gần như không mất gói, lợi ích nhỏ và có thể chưa cần bật."

  # ───────────────────────── 13. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">1996: mỗi tệp một kết nối, 22 vòng</span><span class="a">→</span>
          <span class="n">1999: kết nối bền, gửi liền, 3 vòng</span><span class="a">→</span>
          <span class="n">2015: nhiều luồng, nén tiêu đề</span><span class="a">→</span>
          <span class="n">2022: QUIC, mất gói chỉ chặn một luồng</span><span class="a">→</span>
          <span class="n">ngữ nghĩa chung, có đường lùi</span></div>
        say: "Tổng kết lại hành trình. Năm 1996, mỗi tệp một kết nối, trang 11 tệp mất 22 vòng. Năm 1999, kết nối bền và gửi liền đưa xuống 3 vòng, nhưng sinh ra chặn đầu hàng. Năm 2015, nhiều luồng trên một kết nối cùng tiêu đề nén gỡ chặn ở tầng HTTP. Năm 2022, giao thức giao vận mới để gói mất chỉ chặn một luồng, và mọi phiên bản dùng chung một ngữ nghĩa, luôn có đường lùi."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi phiên bản sửa đúng điểm nghẽn mà <b>quy mô của nó</b> làm lộ ra, và để lại điểm nghẽn tiếp theo. Trước khi chọn, hãy đếm vòng và đo mất gói trên mạng của chính người dùng mình.</div>
        say: "Điều cần mang theo, mỗi phiên bản sửa đúng điểm nghẽn mà quy mô của nó làm lộ ra, và để lại điểm nghẽn tiếp theo. Trước khi chọn, hãy đếm vòng khứ hồi và đo tỉ lệ mất gói trên mạng của chính người dùng mình."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của chuỗi bài về ứng dụng web và di động. Bạn đã đi từ một trang tĩnh tới cách cả web chuyển phiên bản mà không làm hỏng các ứng dụng đang chạy.</p>
        say: "Đây là bài cuối của chuỗi bài về ứng dụng web và di động. Bạn đã đi từ một trang tĩnh tới cách cả web chuyển phiên bản mà không làm hỏng các ứng dụng đang chạy. Cảm ơn bạn đã theo học."
