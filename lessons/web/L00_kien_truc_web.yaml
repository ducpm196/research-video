id: L00
course: WEB
series: "WEB · Ứng dụng web và di động"
title: "Bài 0 — Kiến trúc ứng dụng web: trình duyệt, máy chủ, API, cơ sở dữ liệu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/web.yaml L00; audit/web/verify_web.py L00; RFC 9110 (ngữ nghĩa HTTP), RFC 8446 (TLS 1.3: bắt tay một vòng khứ hồi); I. Grigorik, High Performance Browser Networking (2013), chương 1–4"
assumes: [arith, cdot]
# Quy ước: một vòng khứ hồi (RTT) = thời gian gói đi tới máy chủ và phản hồi quay về. Kết nối mới qua TCP + TLS 1.3 tốn: bắt tay giao vận 1 vòng,
#   bắt tay mã hoá 1 vòng, rồi yêu cầu HTTP đầu tiên 1 vòng (alg.rtt_before_first_byte). Bỏ qua tra tên miền và thời gian xử lý của máy chủ.
#   RTT 50 ms là SỐ MINH HOẠ. Tên TCP, TLS chỉ trên màn hình (TLS: probe NET không đọc được).
objectives:
  - "Lần theo một yêu cầu từ lúc bấm tới lúc hiện"
  - "Ước lượng thời gian thiết lập kết nối"
  - "Phân biệt việc của trình duyệt, máy chủ, cơ sở dữ liệu"
asr_reviewed:
  - {sentence: "Đo cạnh máy chủ với vòng khứ hồi 1 mi li giây, trang chỉ tốn 3 mi li giây.", reason: "ASR chép “Đo cạnh máy chủ với vòng khứ hồi 1 mili dây, trang chỉ tốn 3 mili dây.” (0.722): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Người dùng ở xa với vòng khứ hồi 200 mi li giây phải chờ 600 mi li giây, gấp 200 lần, nên hãy đo với vòng khứ hồi của người dùng thật.", reason: "ASR chép “Người dùng ở xa với vòng khứ hội 200 mili dây phải chờ 600 mili dây gấp 200 lần nên hãy đo với vòng khứ hội của người dùng thật.” (0.794): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: hồi/hội, hồi/hội — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng cộng dồn các bước với vòng khứ hồi 50 mi li giây, tới đây là 150 mi li giây thì byte đầu tiên mới tới.", reason: "ASR chép “Bảng cộng dồn các bước với vòng khứ hồi 50mS, tới đây là 150mS thì bay đầu tiên mới tới.” (0.821): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Vì vậy byte đầu tiên chỉ tới ở mốc 150 mi li giây, dù đường truyền rộng tới đâu.", reason: "ASR chép “Vì vậy bay đầu tiên chỉ tới ở mốc 150 mili dây, dù đường truyền rộng tới đâu.” (0.837): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đồng hồ cộng dồn đi từ 0 lên 50 mi li giây, mà chưa có byte dữ liệu nào.", reason: "ASR chép “Đồng hồ cộng dồn đi từ không lên 50 ms mà chưa có 3 dữ liệu nào.” (0.842): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng so hai nơi đo, cùng 3 vòng khứ hồi trước byte đầu tiên.", reason: "ASR chép “Bảng so hai nơi đo cùng ba vòng khứ hội trước bay đầu tiên.” (0.857): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: hồi/hội — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đồng hồ cộng dồn lên 50 cộng 50, bằng 100 mi li giây, và vẫn chưa có byte dữ liệu nào.", reason: "ASR chép “Đồng hồ cộng dồn lên 50 cộng 50 bằng 100ml và vẫn chưa có bai giữ liệu nào.” (0.87): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tải 100 KB, tức 800 nghìn bit, qua đường 10 triệu bit mỗi giây mất 80 mi li giây.", reason: "ASR chép “Tải 100 kilobytes, tức 800.000 bit, qua đường 10 triệu bit mỗi giây mất 80 mili giây.” (0.884): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, người dùng ở xa, vòng khứ hồi 200 mi li giây.", reason: "ASR chép “Câu 1. Người dùng ở xa vòng khứ hội 200 mê lý dây.” (0.786): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: hồi/hội — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đáp án câu một, 3 nhân 200, bằng 600 mi li giây.", reason: "ASR chép “Đáp án câu 1, 3 nhìn 200 bằng 600 mê lý dây.” (0.786): tiền tố đơn vị mi-li/mi-crô/na-nô đọc tách âm tiết, ASR viết gộp “mili/micro/nano” hoặc lệch thanh; lệch âm/thanh thuần Việt: nhân/nhìn — NOT_VERIFIED bằng tai người"}
  - {sentence: "Kết nối mới tốn bao lâu trước byte đầu tiên?", reason: "ASR chép “Kết nối mới tốn bao lâu trước bay đầu tiên.” (0.9): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Phần lớn thời gian chờ không phải để tải byte, mà để đi và về nhiều lượt trước khi byte đầu tiên tới.", reason: "ASR chép “Phần lớn thời gian chờ không phải để tải bay, mà để đi và về nhiều lượt trước khi bay đầu tiên tới.” (0.913): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mạng 100 lần nhanh hơn, trang không nhanh hơn"
    checks:
      - "alg.rtt_before_first_byte(50) == 150"
    steps:
      - show: |
          <p>Bạn nâng gói mạng lên nhanh gấp 100 lần. Trang đặt hàng vẫn mất gần như cùng thời gian để hiện chữ đầu tiên — vì sao? Phần lớn thời gian chờ không phải để <b>tải byte</b>, mà để <b>đi và về</b> nhiều lượt trước khi byte đầu tiên tới.</p>
          <div class="box key">Hôm nay: <b>kiến trúc ứng dụng web</b> — trình duyệt, máy chủ, API, cơ sở dữ liệu — và vì sao <b>số vòng khứ hồi</b> quyết định tốc độ cảm nhận.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, bạn nâng gói mạng lên nhanh gấp 100 lần. Trang đặt hàng vẫn mất gần như cùng thời gian để hiện chữ đầu tiên, vậy vì sao lại như thế? Phần lớn thời gian chờ không phải để tải byte, mà để đi và về nhiều lượt trước khi byte đầu tiên tới. Hôm nay ta học kiến trúc ứng dụng web, gồm trình duyệt, máy chủ, API và cơ sở dữ liệu, và vì sao số vòng khứ hồi quyết định tốc độ cảm nhận."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: độ trễ do khoảng cách, thời gian truyền do băng thông"
    checks:
      - "2 * 5000 / 200000 * 1000 == 50"
      - "100 * 1000 * 8 == 800000 and 800000 / 10**7 * 1000 == 80 and math.isclose(800000 / 10**9 * 1000, 0.8)"
    steps:
      - show: |
          <p>Ở khoá Mạng máy tính: tín hiệu trong cáp quang đi khoảng <b>200 000 km mỗi giây</b>. Máy chủ cách 5000 km thì gói đi rồi về là 10 000 km:</p>
          <p>$\frac{10\,000}{200\,000} = 0{,}05$ giây $= \hl{50}$ ms — đó là một <b>vòng khứ hồi</b>.</p>
        focus: [1, 2, 2]
        say: "Trước hết, ôn lại điều đã học ở khoá Mạng máy tính, tín hiệu trong cáp quang đi khoảng 200 nghìn ki-lô-mét mỗi giây. Máy chủ cách 5000 ki-lô-mét thì gói đi rồi về là 10 nghìn ki-lô-mét, chia cho 200 nghìn được 0 phẩy 05 giây, tức 50 mi li giây. Thời gian đi rồi về đó gọi là một vòng khứ hồi, và nó chỉ phụ thuộc khoảng cách."
      - show: |
          <table class="t"><tr><th>tải 100 KB = 800 000 bit</th><th>thời gian truyền</th></tr>
          <tr><td>đường 10 triệu bit mỗi giây</td><td>80 ms</td></tr>
          <tr><td>đường nhanh gấp 100: 1 tỉ bit mỗi giây</td><td>$\hl{0{,}8}$ ms</td></tr></table>
          <p class="note">Băng thông chỉ rút ngắn phần <b>truyền</b>; phần <b>đi và về</b> 50 ms vẫn giữ nguyên.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Thời gian truyền thì khác, nó bằng kích thước chia cho băng thông. Tải 100 KB, tức 800 nghìn bit, qua đường 10 triệu bit mỗi giây mất 80 mi li giây. Qua đường nhanh gấp 100 lần, 1 tỉ bit mỗi giây, chỉ còn 0 phẩy 8 mi li giây. Nhưng băng thông chỉ rút ngắn phần truyền, còn phần đi và về 50 mi li giây vẫn giữ nguyên như cũ."

  - id: sym
    kind: symbol
    title: "Giải mã: bốn tầng của một ứng dụng web"
    steps:
      - show: |
          <table class="t"><tr><th>tầng</th><th>làm gì</th></tr>
          <tr><td><b>trình duyệt</b> (hoặc ứng dụng di động)</td><td>hiện giao diện, nhận thao tác, gửi yêu cầu HTTP</td></tr>
          <tr><td><b>máy chủ ứng dụng</b></td><td>nhận yêu cầu, kiểm quyền, chạy logic nghiệp vụ</td></tr>
          <tr><td><b>API</b></td><td>hợp đồng giữa hai bên: địa chỉ, phương thức, dữ liệu vào ra</td></tr>
          <tr><td><b>cơ sở dữ liệu</b></td><td>lưu trạng thái bền vững; máy chủ ứng dụng nên không giữ trạng thái</td></tr></table>
          <p><b>Vòng khứ hồi</b>: thời gian một gói đi tới máy chủ và phản hồi quay về — bị giới hạn bởi tốc độ ánh sáng và khoảng cách, không phải băng thông.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng có bốn tầng. Trình duyệt, hoặc ứng dụng di động, hiện giao diện, nhận thao tác, và gửi yêu cầu HTTP. Máy chủ ứng dụng nhận yêu cầu, kiểm quyền, và chạy logic nghiệp vụ. API là hợp đồng giữa hai bên, gồm địa chỉ, phương thức, và dữ liệu vào ra. Cơ sở dữ liệu lưu trạng thái bền vững, và máy chủ ứng dụng nên không giữ trạng thái. Vòng khứ hồi là thời gian một gói đi tới máy chủ và phản hồi quay về, bị giới hạn bởi tốc độ ánh sáng và khoảng cách, không phải bởi băng thông."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ba lượt đi và về trước khi thấy chữ đầu tiên"
    checks:
      - "3 * 50 == 150 and 50 / 2 == 25"
    steps:
      - show: |
          <div><svg width="1500" height="460" viewBox="0 0 1500 460"><defs><marker id="arW0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><line x1="330" y1="70" x2="330" y2="420.0" stroke="#1f2937" stroke-width="3"/><line x1="1100" y1="70" x2="1100" y2="420.0" stroke="#1f2937" stroke-width="3"/><text x="330" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">trình duyệt</text><text x="1100" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">máy chủ</text><line x1="330" y1="70" x2="1096" y2="125" stroke="#2a78d6" stroke-width="4" marker-end="url(#arW0)"/><line x1="1100" y1="125" x2="334" y2="180" stroke="#2a78d6" stroke-width="4" marker-end="url(#arW0)"/><text x="1130" y="133" font-size="22" fill="#2a78d6">vòng 1: bắt tay giao vận</text><line x1="330" y1="180" x2="1096" y2="235" stroke="#d97706" stroke-width="4" marker-end="url(#arW0)"/><line x1="1100" y1="235" x2="334" y2="290" stroke="#d97706" stroke-width="4" marker-end="url(#arW0)"/><text x="1130" y="243" font-size="22" fill="#d97706">vòng 2: bắt tay mã hoá</text><line x1="330" y1="290" x2="1096" y2="345" stroke="#059669" stroke-width="4" marker-end="url(#arW0)"/><line x1="1100" y1="345" x2="334" y2="400" stroke="#059669" stroke-width="4" marker-end="url(#arW0)"/><text x="1130" y="353" font-size="22" fill="#059669">vòng 3: yêu cầu HTTP</text><text x="300" y="78" font-size="22" text-anchor="end" fill="#1f2937">0 ms</text><text x="300" y="188" font-size="22" text-anchor="end" fill="#1f2937">50 ms</text><text x="300" y="298" font-size="22" text-anchor="end" fill="#1f2937">100 ms</text><text x="300" y="408" font-size="22" text-anchor="end" fill="#1f2937">150 ms</text><text x="300" y="440" font-size="22" text-anchor="end" font-weight="bold" fill="#b91c1c">byte đầu tới</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ thời gian chạy từ trên xuống, cột trái là trình duyệt, cột phải là máy chủ. Mỗi mũi tên chéo là một lượt đi một chiều, mất 25 mi li giây, nên một cặp mũi tên đi và về là một vòng khứ hồi 50 mi li giây. Trình duyệt phải chờ đủ ba cặp, bắt tay giao vận, bắt tay mã hoá, rồi mới gửi yêu cầu HTTP. Vì vậy byte đầu tiên chỉ tới ở mốc 150 mi li giây, dù đường truyền rộng tới đâu."

  - id: example
    kind: example
    title: "150 ms trước byte đầu tiên"
    checks:
      - "alg.rtt_before_first_byte(50) == 150 and alg.rtt_before_first_byte(50, 2) == 100"
    steps:
      - show: |
          <p><b>Bước một — bắt tay giao vận (TCP)</b>: trình duyệt hỏi “mở kết nối nhé?”, máy chủ đáp “đồng ý”.</p>
          <table class="t"><tr><th>bước (vòng khứ hồi 50 ms)</th><th>cộng dồn</th></tr>
          <tr><td>bắt tay giao vận: 1 vòng</td><td>$0 + 50 = 50$ ms</td></tr></table>
        focus: [1, "2.2", "2.2"]
        say: "Bước một, bắt tay giao vận, trình duyệt hỏi máy chủ có mở kết nối không, và máy chủ đáp đồng ý. Việc hỏi rồi đáp này tốn đúng 1 vòng khứ hồi, với vòng khứ hồi 50 mi li giây. Đồng hồ cộng dồn đi từ 0 lên 50 mi li giây, mà chưa có byte dữ liệu nào."
      - show: |
          <p><b>Bước 2 — bắt tay mã hoá (TLS 1.3)</b>: hai bên thoả thuận khoá mã hoá, thêm 1 vòng.</p>
          <table class="t"><tr><th>bước</th><th>cộng dồn</th></tr>
          <tr><td>bắt tay giao vận: 1 vòng</td><td>50 ms</td></tr>
          <tr><td>bắt tay mã hoá: 1 vòng</td><td>$50 + 50 = 100$ ms</td></tr></table>
        focus: [1, "2.3"]
        say: "Bước hai, bắt tay mã hoá, hai bên thoả thuận khoá mã hoá để không ai nghe lén được, việc này thêm 1 vòng nữa. Đồng hồ cộng dồn lên 50 cộng 50, bằng 100 mi li giây, và vẫn chưa có byte dữ liệu nào."
      - clear: true
        show: |
          <p><b>Bước 3 — yêu cầu HTTP đầu tiên</b>: gửi yêu cầu, chờ phản hồi, thêm 1 vòng.</p>
          <table class="t"><tr><th>bước (vòng khứ hồi 50 ms)</th><th>cộng dồn</th></tr>
          <tr><td>bắt tay giao vận: 1 vòng</td><td>50 ms</td></tr>
          <tr><td>bắt tay mã hoá (TLS 1.3): 1 vòng</td><td>100 ms</td></tr>
          <tr><td>yêu cầu HTTP đầu tiên: 1 vòng</td><td>$\hl{150}$ ms</td></tr></table>
          <p>Băng thông không đổi được con số này.</p>
        focus: [1, "2.4", 3]
        say: "Bước ba, trình duyệt gửi yêu cầu HTTP đầu tiên rồi chờ phản hồi, thêm 1 vòng nữa. Bảng cộng dồn các bước với vòng khứ hồi 50 mi li giây, tới đây là 150 mi li giây thì byte đầu tiên mới tới. Băng thông không đổi được con số này."
      - clear: true
        show: |
          <p><b>Bước 4 — yêu cầu thứ hai</b>: giữ kết nối mở hay mở kết nối mới?</p>
          <table class="t"><tr><th>cách</th><th>yêu cầu thứ hai tốn</th><th>tổng sau 2 yêu cầu</th></tr>
          <tr><td>giữ kết nối mở</td><td>1 vòng = 50 ms</td><td>$150 + 50 = \hl{200}$ ms</td></tr>
          <tr><td>mở kết nối mới</td><td>3 vòng = 150 ms</td><td>$150 + 150 = 300$ ms</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bước bốn, quyết định cho yêu cầu thứ hai, giữ kết nối mở hay mở một kết nối mới. Nếu giữ kết nối mở cho các yêu cầu sau, mỗi yêu cầu chỉ còn 1 vòng, tức 50 mi li giây, tổng sau hai yêu cầu là 200 mi li giây. Nếu mở kết nối mới thì lại tốn đủ 3 vòng, tổng lên tới 300 mi li giây. Vậy giữ kết nối mở là cách rẻ nhất để giảm số vòng khứ hồi."

  - id: check
    kind: check
    title: "Tự kiểm: đếm mũi tên một chiều"
    checks:
      - "6 * 25 == 150 == alg.rtt_before_first_byte(50) and 2 * 3 == 6"
      - "alg.rtt_before_first_byte(50, 4) == 200 and alg.rtt_before_first_byte(50, 6) == 300"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác: đếm lượt một chiều</th><th>kết quả</th></tr>
          <tr><td>mỗi vòng = 2 mũi tên, 3 vòng</td><td>$2 \cdot 3 = 6$ mũi tên</td></tr>
          <tr><td>mỗi mũi tên = nửa vòng = 25 ms</td><td>$6 \cdot 25 = \hl{150}$ ms ✓</td></tr>
          <tr><td>giữ kết nối: thêm 2 mũi tên</td><td>8 mũi tên = 200 ms ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không cộng vòng nữa mà đếm từng mũi tên một chiều trong hình. Mỗi vòng có 2 mũi tên, ba vòng là 2 nhân 3, bằng 6 mũi tên. Mỗi mũi tên là nửa vòng, tức 25 mi li giây, nên 6 nhân 25 bằng 150 mi li giây, khớp kết quả cộng dồn. Giữ kết nối mở thì yêu cầu thứ hai thêm đúng 2 mũi tên, 8 mũi tên là 200 mi li giây, cũng khớp."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi thường gặp"
    checks:
      - "10 * 50 == 500"
      - "alg.rtt_before_first_byte(1) == 3 and alg.rtt_before_first_byte(200) == 600 and 600 / 3 == 200"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Gọi API nối tiếp nhau từ trình duyệt <b class="red">(cộng dồn vòng khứ hồi)</b>
          <br><span class="note">Trang cần 10 lần gọi, lần sau chờ lần trước: 10 vòng × 50 ms = 500 ms chỉ để chờ mạng. Gộp thành một lần gọi, hoặc gọi đồng thời những lần độc lập.</span></div>
        say: "Lỗi thứ nhất, gọi API nối tiếp nhau từ trình duyệt, nên vòng khứ hồi cộng dồn. Trang cần 10 lần gọi, lần sau chờ lần trước, thì 10 vòng nhân 50 mi li giây là 500 mi li giây chỉ để chờ mạng. Hãy gộp thành một lần gọi, hoặc gọi đồng thời những lần độc lập."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Giữ trạng thái người dùng trong bộ nhớ máy chủ <b class="red">(không mở rộng được)</b>
          <br><span class="note">Yêu cầu sau rơi vào máy chủ khác là mất giỏ hàng. Đưa trạng thái vào cơ sở dữ liệu hoặc kho dùng chung; máy chủ ứng dụng nào cũng phục vụ được mọi yêu cầu.</span></div>
        say: "Lỗi thứ hai, giữ trạng thái người dùng trong bộ nhớ máy chủ, nên không mở rộng được. Yêu cầu sau rơi vào máy chủ khác là mất giỏ hàng. Hãy đưa trạng thái vào cơ sở dữ liệu hoặc kho dùng chung, để máy chủ ứng dụng nào cũng phục vụ được mọi yêu cầu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tin dữ liệu từ trình duyệt <b class="red">(trình duyệt là của người dùng)</b>
          <br><span class="note">Giá tiền, quyền hạn, mã người dùng gửi lên đều sửa được. Máy chủ phải tự kiểm lại mọi thứ, kể cả khi giao diện đã kiểm.</span></div>
        say: "Lỗi thứ ba, tin dữ liệu gửi từ trình duyệt, trong khi trình duyệt là của người dùng. Giá tiền, quyền hạn, mã người dùng gửi lên đều sửa được. Máy chủ phải tự kiểm lại mọi thứ, kể cả khi giao diện đã kiểm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Đo tốc độ từ máy đặt cạnh máy chủ <b class="red">(người đã đi làm hay mắc)</b>
          <br><span class="note">Kỹ sư đo trong cùng trung tâm dữ liệu thấy trang “nhanh”, nhưng người dùng ở xa chờ gấp nhiều lần. Hãy đo với vòng khứ hồi của người dùng thật.</span></div>
          <table class="t"><tr><th>nơi đo</th><th>vòng khứ hồi</th><th>trước byte đầu (3 vòng)</th></tr>
          <tr><td>cạnh máy chủ</td><td>1 ms</td><td>3 ms</td></tr>
          <tr><td>người dùng ở xa</td><td>200 ms</td><td>$\hl{600}$ ms, gấp 200 lần</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đo tốc độ từ một máy đặt ngay cạnh máy chủ. Kỹ sư đo trong cùng trung tâm dữ liệu thấy trang rất nhanh, nhưng người dùng ở xa phải chờ gấp nhiều lần. Bảng so hai nơi đo, cùng 3 vòng khứ hồi trước byte đầu tiên. Đo cạnh máy chủ với vòng khứ hồi 1 mi li giây, trang chỉ tốn 3 mi li giây. Người dùng ở xa với vòng khứ hồi 200 mi li giây phải chờ 600 mi li giây, gấp 200 lần, nên hãy đo với vòng khứ hồi của người dùng thật."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.rtt_before_first_byte(200) == 600 and alg.rtt_before_first_byte(200) + 4 * 200 == 1400"
      - "4 * 200 == 800 and 600 + 200 == 800 and 1400 - 800 == 600"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Người dùng ở xa, vòng khứ hồi 200 ms. Kết nối mới tốn bao lâu trước byte đầu tiên?</td></tr>
          <tr><td>2</td><td>Sau đó trang còn 4 lần gọi API nối tiếp trên cùng kết nối. Tổng thời gian chờ mạng kể từ lúc bắt đầu kết nối?</td></tr>
          <tr><td>3</td><td>Quyết định: gộp 4 lần gọi đó thành 1 lần gọi thì tiết kiệm bao nhiêu? Có nên gộp không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, người dùng ở xa, vòng khứ hồi 200 mi li giây. Kết nối mới tốn bao lâu trước byte đầu tiên? Câu hai, sau đó trang còn 4 lần gọi API nối tiếp trên cùng kết nối, tổng thời gian chờ mạng kể từ lúc bắt đầu kết nối là bao nhiêu? Câu ba là một quyết định, gộp 4 lần gọi đó thành 1 lần gọi thì tiết kiệm được bao nhiêu, và có nên gộp không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Kết nối mới cần 3 vòng: giao vận, mã hoá, yêu cầu → $3 \cdot 200 = \hl{600}$ ms.</p>
        say: "Đáp án câu một, 3 nhân 200, bằng 600 mi li giây. Đó là ba vòng khứ hồi, cho bắt tay giao vận, bắt tay mã hoá và yêu cầu đầu tiên, mỗi vòng 200 mi li giây."
      - show: |
          <p>② Kết nối đã mở, mỗi lần gọi 1 vòng: $4 \cdot 200 = 800$ ms; cộng phần mở kết nối: $600 + 800 = \hl{1400}$ ms — hơn một giây chỉ để chờ đi và về.</p>
        say: "Câu hai, kết nối đã mở nên mỗi lần gọi chỉ tốn 1 vòng, 4 lần là 4 nhân 200 bằng 800 mi li giây. Cộng phần mở kết nối, 600 cộng 4 nhân 200, bằng 1400 mi li giây, hơn một giây chỉ để chờ đi và về."
      - show: |
          <p>③ Gộp lại: $600 + 200 = 800$ ms, tiết kiệm $1400 - 800 = \hl{600}$ ms → <b>nên gộp</b>, nếu 4 lần gọi không phụ thuộc kết quả của nhau.</p>
        say: "Câu ba, gộp thành 1 lần gọi thì tổng còn 600 cộng 200, bằng 800 mi li giây, tiết kiệm 1400 trừ 800, bằng 600 mi li giây. Vậy nên gộp, với điều kiện 4 lần gọi đó không phải chờ kết quả của nhau."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">trình duyệt → API → máy chủ → cơ sở dữ liệu</span><span class="a">→</span>
          <span class="n">mỗi bước mạng: ít nhất một vòng khứ hồi</span><span class="a">→</span>
          <span class="n">giảm số vòng: giữ kết nối, gộp, gọi đồng thời</span><span class="a">→</span>
          <span class="n">máy chủ không giữ trạng thái, không tin trình duyệt</span></div>
        say: "Tổng kết lại, yêu cầu đi từ trình duyệt qua API tới máy chủ và cơ sở dữ liệu, và mỗi bước mạng tốn ít nhất một vòng khứ hồi. Hãy giảm số vòng bằng giữ kết nối, gộp, và gọi đồng thời, và máy chủ không giữ trạng thái, không tin trình duyệt."
      - show: |
          <div class="box key"><b>Tư duy:</b> trên mạng, <b>độ trễ</b> là thứ không mua thêm được — thiết kế để đi và về ít lần nhất.</div>
        say: "Điều cần mang theo, trên mạng, độ trễ là thứ không mua thêm được, nên hãy thiết kế để đi và về ít lần nhất."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>HTML và cây DOM</b> — cấu trúc và ngữ nghĩa.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học HTML và cây phần tử của trang, với cấu trúc và ngữ nghĩa. Hẹn gặp bạn ở bài tiếp theo."
