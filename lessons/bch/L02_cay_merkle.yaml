scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Điện thoại không tải nổi cả khối"
    checks:
      - "len(alg.merkle_proof(alg.merkle_levels([f'gd{i}'.encode() for i in range(1024)]), 357)) * 32 == 320"
    steps:
      - show: |
          <p>Ví trên điện thoại muốn biết: giao dịch trả tiền của tôi đã nằm trong khối chưa? Khối có 1024 giao dịch. Tải cả khối là tốn dữ liệu, tốn pin. Với cây Merkle, ví chỉ cần <b>10 mã băm — 320 byte</b> — cộng gốc của khối là kiểm được.</p>
          <div class="box key">Hôm nay: <b>cây Merkle</b> — tóm tắt n giao dịch bằng một gốc, và chứng minh một giao dịch thuộc về bằng log₂ n mã băm.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, ví trên điện thoại muốn biết giao dịch trả tiền của tôi đã nằm trong khối chưa. Khối có 1024 giao dịch. Tải cả khối thì tốn dữ liệu và tốn pin. Với cây Merkle, ví chỉ cần 10 mã băm, tức 320 byte, cộng với gốc của khối, là kiểm được. Hôm nay ta học cây Merkle, cách tóm tắt n giao dịch bằng một gốc, và chứng minh một giao dịch thuộc về bằng lôgarit cơ số 2 của n mã băm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chia đôi, cây nhị phân, mã 32 byte"
    checks:
      - "2 ** 10 == 1024 and math.log2(1024) == 10 and (lambda f: f(f, 1024))(lambda f, n: 0 if n == 1 else 1 + f(f, n // 2)) == 10"
      - "4 + 2 + 1 == 7 and math.log2(8) == 3 and 256 // 8 == 32 and len(__import__('hashlib').sha256(b'gd1').digest()) == 32"
    steps:
      - show: |
          <p>Chia đôi liên tục cho tới khi còn 1:</p>
          <div class="code"><div>1024 → 512 → 256 → 128 → 64 → 32 → 16 → 8 → 4 → 2 → 1</div></div>
          <p>Mười lần chia đôi, vì $2^{10} = 1024$. Ta viết $\log_2 1024 = 10$, đọc là lôgarit cơ số 2 của 1024: <b>số lần chia đôi</b> để về 1.</p>
        focus: [1, 2, 3, 3]
        say: "Trước hết, ôn phép chia đôi liên tục. Bắt đầu từ 1024, chia đôi mãi, ta được 512, 256, và cứ thế tới 1. Đếm lại thì có mười lần chia đôi, vì 2 mũ 10 bằng 1024. Ta viết lôgarit cơ số 2 của 1024 bằng 10, nghĩa là số lần chia đôi để về 1."
      - show: |
          <table class="t"><tr><th>ôn lại</th><th>ví dụ số</th></tr>
          <tr><td><b>cây nhị phân</b>: các ô (nút) nối từ trên xuống, mỗi nút có tối đa hai con; nút dưới cùng không có con là <b>lá</b>, nút trên cùng là <b>gốc</b></td><td>cây đầy đủ 8 lá: $4 + 2 + 1 = 7$ nút ở trên lá, xếp thành $\log_2 8 = 3$ tầng</td></tr>
          <tr><td>mã băm ở bài 1: 256 bit, đổi một ký tự là mã đổi hoàn toàn</td><td>256 bit chia 8 = 32 byte mỗi mã</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3"]
        say: "Bảng này ôn thêm hai điều mà ta sẽ dùng ngay trong bài. Cây nhị phân gồm các ô gọi là nút, nối từ trên xuống, mỗi nút có tối đa hai con, nút dưới cùng không có con gọi là lá, còn nút trên cùng gọi là gốc. Cây đầy đủ có 8 lá thì phía trên có 4 cộng 2 cộng 1, bằng 7 nút, xếp thành lôgarit cơ số 2 của 8, bằng 3 tầng. Ở bài 1, mã băm dài 256 bit, đổi một ký tự là mã đổi hoàn toàn, và 256 bit chia 8 là 32 byte mỗi mã."

  - id: sym
    kind: symbol
    title: "Giải mã: lá, nút cha, gốc, bằng chứng"
    steps:
      - show: |
          <div class="code"><div>                gốc = băm(h12 | h34)</div><div>               /                \</div><div>     h12 = băm(h1 | h2)    h34 = băm(h3 | h4)</div><div>        /      \              /      \</div><div>  h1=băm(gd1) h2=băm(gd2) h3=băm(gd3) h4=băm(gd4)</div></div>
          <p><b>Bằng chứng</b> cho gd3: anh em <code>h4</code>, rồi anh em của cha là <code>h12</code>. Người kiểm tính băm(gd3) → ghép với h4 → ghép với h12 → so với gốc. Mỗi tầng một mã: $\log_2 n$ mã.</p>
          <p>Đổi một giao dịch bất kỳ là gốc đổi — gốc nằm trong tiêu đề khối, nên được liên kết băm bảo vệ (bài 1).</p>
        focus: [1, 1, 2, 2, 3]
        say: "Sơ đồ là một cây bốn lá. Mỗi lá là băm của một giao dịch, hai lá ghép lại và băm thành nút cha, và hai nút cha ghép lại và băm thành gốc. Bằng chứng cho giao dịch 3 gồm anh em của nó là h 4, rồi anh em của cha nó là h 1 2. Người kiểm tính băm của giao dịch 3, ghép với h 4, ghép tiếp với h 1 2, rồi so với gốc, mỗi tầng một mã, tổng cộng lôgarit cơ số 2 của n mã. Đổi một giao dịch bất kỳ là gốc đổi, mà gốc nằm trong tiêu đề khối, nên được liên kết băm bảo vệ như ở bài 1."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Con đường từ một lá lên gốc"
    checks:
      - "(lambda L: len(alg.merkle_proof(L, 5)) == 3 and [(5 >> k) ^ 1 for k in range(3)] == [4, 3, 0] and 8 - 2 == 6 and 15 - 3 - 3 - 1 == 6 + 2 and alg.merkle_verify(b'gd6', 5, alg.merkle_proof(L, 5), L[-1][0]))(alg.merkle_levels([f'gd{i}'.encode() for i in range(1, 9)]))"
    steps:
      - show: |
          <div><svg width="1500" height="410" viewBox="0 0 1500 410"><g font-size="22" fill="#1f2937"><g stroke="#6b7280" stroke-width="3"><line x1="120" y1="305" x2="210" y2="260"/><line x1="300" y1="305" x2="210" y2="260"/><line x1="480" y1="305" x2="570" y2="260"/><line x1="660" y1="305" x2="570" y2="260"/><line x1="840" y1="305" x2="930" y2="260"/><line x1="1020" y1="305" x2="930" y2="260"/><line x1="1200" y1="305" x2="1290" y2="260"/><line x1="1380" y1="305" x2="1290" y2="260"/><line x1="210" y1="210" x2="390" y2="165"/><line x1="570" y1="210" x2="390" y2="165"/><line x1="930" y1="210" x2="1110" y2="165"/><line x1="1290" y1="210" x2="1110" y2="165"/><line x1="390" y1="115" x2="750" y2="70"/><line x1="1110" y1="115" x2="750" y2="70"/></g><rect x="60" y="305" width="120" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="120" y="338" text-anchor="middle" font-weight="bold">h1</text><rect x="240" y="305" width="120" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="300" y="338" text-anchor="middle" font-weight="bold">h2</text><rect x="420" y="305" width="120" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="480" y="338" text-anchor="middle" font-weight="bold">h3</text><rect x="600" y="305" width="120" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="660" y="338" text-anchor="middle" font-weight="bold">h4</text><rect x="780" y="305" width="120" height="50" rx="10" fill="#fed7aa" stroke="#eb6834" stroke-width="3"/><text x="840" y="338" text-anchor="middle" font-weight="bold">h5</text><rect x="960" y="305" width="120" height="50" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1020" y="338" text-anchor="middle" font-weight="bold">h6</text><rect x="1140" y="305" width="120" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="1200" y="338" text-anchor="middle" font-weight="bold">h7</text><rect x="1320" y="305" width="120" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="1380" y="338" text-anchor="middle" font-weight="bold">h8</text><rect x="140" y="210" width="140" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="210" y="243" text-anchor="middle" font-weight="bold">h12</text><rect x="500" y="210" width="140" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="570" y="243" text-anchor="middle" font-weight="bold">h34</text><rect x="860" y="210" width="140" height="50" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="930" y="243" text-anchor="middle" font-weight="bold">h56</text><rect x="1220" y="210" width="140" height="50" rx="10" fill="#fed7aa" stroke="#eb6834" stroke-width="3"/><text x="1290" y="243" text-anchor="middle" font-weight="bold">h78</text><rect x="310" y="115" width="160" height="50" rx="10" fill="#fed7aa" stroke="#eb6834" stroke-width="3"/><text x="390" y="148" text-anchor="middle" font-weight="bold">h1234</text><rect x="1030" y="115" width="160" height="50" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1110" y="148" text-anchor="middle" font-weight="bold">h5678</text><rect x="670" y="20" width="160" height="50" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="750" y="53" text-anchor="middle" font-weight="bold">gốc</text><text x="120" y="390" text-anchor="middle" fill="#6b7280">gd1</text><text x="300" y="390" text-anchor="middle" fill="#6b7280">gd2</text><text x="480" y="390" text-anchor="middle" fill="#6b7280">gd3</text><text x="660" y="390" text-anchor="middle" fill="#6b7280">gd4</text><text x="840" y="390" text-anchor="middle" fill="#6b7280">gd5</text><text x="1020" y="390" text-anchor="middle" fill="#2a78d6">gd6</text><text x="1200" y="390" text-anchor="middle" fill="#6b7280">gd7</text><text x="1380" y="390" text-anchor="middle" fill="#6b7280">gd8</text><text x="20" y="40" fill="#eb6834">cam: bằng chứng, 3 mã</text><text x="20" y="75" fill="#2a78d6">xanh: người kiểm tự tính</text><text x="1480" y="40" text-anchor="end" fill="#059669">lục: gốc trong tiêu đề khối</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình vẽ một cây 8 lá, và ta muốn chứng minh giao dịch 6 nằm trong cây. Người kiểm tự băm giao dịch 6 thành h 6, rồi cần mã anh em h 5 để tính h 5 6. Sau đó người kiểm cần h 7 8 để tính nút trên nữa, và cần h 1 2 3 4 để tính ra gốc. Ba ô màu cam là toàn bộ bằng chứng, đúng bằng lôgarit cơ số 2 của 8, bằng 3 mã. Các ô màu xám, gồm sáu lá và hai nút h 1 2, h 3 4, không cần gửi, vì thông tin của chúng đã được gói sẵn trong ba ô cam."

  - id: example
    kind: example
    title: "1024 giao dịch, kiểm giao dịch số 357"
    checks:
      - "(lambda L: (len(L) - 1, len(alg.merkle_proof(L, 357)), alg.merkle_verify(b'gd357', 357, alg.merkle_proof(L, 357), L[-1][0]), alg.merkle_verify(b'gd357x', 357, alg.merkle_proof(L, 357), L[-1][0])))(alg.merkle_levels([f'gd{i}'.encode() for i in range(1024)])) == (10, 10, True, False)"
      - "[(357 >> k) ^ 1 for k in range(10)] == [356, 179, 88, 45, 23, 10, 4, 3, 0, 1] and 357 // 2 == 178 and [357 >> k for k in range(10)] == [357, 178, 89, 44, 22, 11, 5, 2, 1, 0] and (lambda L: [L[k].index(alg.merkle_proof(L, 357)[k]) for k in range(10)])(alg.merkle_levels([f'gd{i}'.encode() for i in range(1024)])) == [356, 179, 88, 45, 23, 10, 4, 3, 0, 1]"
      - "10 * 32 == 320 and 1024 * 32 == 32768 and 32768 / 320 == 102.4"
    steps:
      - show: |
          <p>Khối có 1024 giao dịch, đánh số từ 0 tới 1023; ví cần kiểm giao dịch số 357 (chạy với hàm băm thật).</p>
          <p><b>Bước 1 — số tầng:</b> $\log_2 1024 = \hl{10}$ tầng trên lá, nên bằng chứng có 10 mã.</p>
        focus: [1, 2, 2]
        say: "Khối có 1024 giao dịch, đánh số từ 0 tới 1023, và ví cần kiểm giao dịch số 357, chạy với một hàm băm thật. Bước một, ta đếm xem cây có bao nhiêu tầng phía trên các lá. Số tầng trên lá là lôgarit cơ số 2 của 1024, bằng 10."
      - show: |
          <p><b>Bước 2 — mã anh em ở mỗi tầng:</b> vị trí lẻ thì anh em đứng ngay trước, vị trí chẵn thì anh em đứng ngay sau; lên một tầng thì vị trí chia 2, bỏ phần dư.</p>
          <table class="t"><tr><th>tầng</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr>
          <tr><td>vị trí của ta</td><td>357</td><td>178</td><td>89</td><td>44</td><td>22</td><td>11</td><td>5</td><td>2</td><td>1</td><td>0</td></tr>
          <tr><td>vị trí anh em</td><td>356</td><td>179</td><td>88</td><td>45</td><td>23</td><td>10</td><td>4</td><td>3</td><td>0</td><td>1</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3"]
        say: "Bước hai, tìm mã anh em ở mỗi tầng, theo luật vị trí lẻ thì anh em đứng ngay trước, vị trí chẵn thì anh em đứng ngay sau. Ở tầng lá, 357 là số lẻ, nên anh em là 356. Lên một tầng, vị trí thành 357 chia 2 bỏ phần dư, bằng 178, số chẵn, nên anh em là 179. Làm tiếp tới gốc, ta được đủ mười vị trí anh em như hàng cuối của bảng."
      - clear: true
        show: |
          <p><b>Bước 3 — kích thước:</b> 10 mã nhân 32 byte = $\hl{320}$ byte.</p>
          <p>Chỉ riêng 1024 mã lá đã là 1024 nhân 32 = 32768 byte, gấp 102,4 lần bằng chứng.</p>
        focus: [1, 1, 2]
        say: "Bước ba, tính kích thước của bằng chứng. Bằng chứng cho giao dịch 357 gồm 10 mã, mỗi mã 32 byte, tổng 320 byte. Còn nếu tải chỉ riêng 1024 mã lá thôi, chưa kể giao dịch, đã là 1024 nhân 32, bằng 32768 byte, gấp 102 phẩy 4 lần bằng chứng."
      - show: |
          <table class="t"><tr><th>Bước 4 — kiểm với gốc</th><th>kết quả</th></tr>
          <tr><td>giao dịch 357 đúng nguyên văn</td><td>khớp <b>(đúng)</b></td></tr>
          <tr><td>đổi một ký tự của giao dịch rồi kiểm lại</td><td>không khớp <b class="red">(sai)</b></td></tr></table>
          <p>So với tải cả 1024 giao dịch: bằng chứng tăng theo <b>log</b> n, không theo n.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước bốn, ghép lần lượt mười mã anh em rồi so với gốc. Kiểm bằng chứng này với gốc của cây thì thấy khớp. Đổi một ký tự của giao dịch rồi kiểm lại thì không khớp. So với tải cả 1024 giao dịch, bằng chứng chỉ tăng theo lôgarit của n, không theo n."

  - id: check
    kind: check
    title: "Tự kiểm: dựng gốc bằng cách khác, đếm số lần băm"
    checks:
      - "(lambda leaves, sha: (lambda f: f(f, leaves))(lambda f, x: sha(x[0]) if len(x) == 1 else sha(f(f, x[:len(x) // 2]) + f(f, x[len(x) // 2:]))) == alg.merkle_levels(leaves)[-1][0])([f'gd{i}'.encode() for i in range(1024)], lambda b: __import__('hashlib').sha256(b).digest())"
      - "sum(len(l) for l in alg.merkle_levels([f'gd{i}'.encode() for i in range(1024)])) == 2047 == 1024 + 1023 and 1 + 10 == 11"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác</th><th>kết quả</th></tr>
          <tr><td>dựng gốc kiểu khác: chia danh sách làm hai nửa, băm gốc của từng nửa rồi ghép</td><td>cùng một gốc ✓</td></tr>
          <tr><td>số lần băm để dựng cả cây: 1024 lá + 1023 nút trên</td><td>2047</td></tr>
          <tr><td>số lần băm để kiểm bằng chứng: 1 cho lá + 10 lần ghép</td><td>$\hl{11}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không dựng cây từ dưới lên nữa. Ta chia danh sách 1024 giao dịch làm hai nửa, tìm gốc của từng nửa theo cùng cách, rồi ghép và băm, và được đúng cùng một gốc. Đếm số lần băm thì dựng cả cây cần 1024 lần cho lá cộng 1023 lần cho các nút trên, tổng 2047 lần. Còn kiểm bằng chứng chỉ cần 1 lần cho lá cộng 10 lần ghép, tức 11 lần, khớp với 10 mã của bằng chứng."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin bằng chứng mà không tin gốc <b class="red">(chứng minh thuộc về một cây giả)</b>
          <br><span class="note">Kẻ xấu dựng cây riêng có giao dịch giả và đưa gốc của cây đó. Bằng chứng chỉ có nghĩa khi gốc lấy từ tiêu đề khối của <b>chuỗi đúng</b>, đã được nhiều khối xác nhận.</span></div>
        say: "Lỗi thứ nhất, tin bằng chứng mà không tin gốc, nên chứng minh thuộc về một cây giả. Kẻ xấu có thể dựng cây riêng chứa giao dịch giả và đưa ra gốc của cây đó. Bằng chứng chỉ có nghĩa khi gốc được lấy từ tiêu đề khối của chuỗi đúng, đã được nhiều khối xác nhận."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Băm lá và nút trong như nhau <b class="red">(giả một nút trong làm lá)</b>
          <br><span class="note">Nếu lá và nút cha băm cùng một kiểu, một nút trong có thể được trình ra như một “giao dịch”. Thêm tiền tố khác nhau: <code>0x00</code> cho lá, <code>0x01</code> cho nút trong (như RFC 6962).</span></div>
        say: "Lỗi thứ hai, băm lá và nút trong theo cùng một kiểu, nên có thể giả một nút trong làm lá. Khi đó một nút trong có thể được trình ra như một giao dịch. Hãy thêm tiền tố khác nhau trước khi băm, một byte 0 cho lá và một byte 1 cho nút trong, như tiêu chuẩn minh bạch chứng chỉ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lẫn “chứng minh có” với “chứng minh không có” <b class="red">(cây thường không chứng minh vắng mặt)</b>
          <br><span class="note">Cây Merkle thường chỉ chứng minh một phần tử <b>có</b> trong cây. Chứng minh <b>không có</b> cần cây đã sắp thứ tự, đưa ra hai lá kề nhau bao quanh vị trí đáng lẽ của phần tử.</span></div>
        say: "Lỗi thứ ba, lẫn chứng minh có với chứng minh không có, trong khi cây thường không chứng minh được sự vắng mặt. Cây Merkle thường chỉ chứng minh một phần tử có trong cây. Chứng minh không có cần một cây đã sắp thứ tự, và đưa ra hai lá kề nhau bao quanh vị trí đáng lẽ của phần tử."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "math.ceil(math.log2(10 ** 6)) == 20 and 20 * 32 == 640 and 2 ** 20 >= 10 ** 6 > 2 ** 19"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Khối có một triệu giao dịch (làm tròn lên lũy thừa của 2). Bằng chứng cần bao nhiêu mã băm, bao nhiêu byte?</td></tr>
          <tr><td>2</td><td>Trong cây 4 lá: gốc = băm(h12 | h34), h12 = băm(h1 | h2), h34 = băm(h3 | h4). Bằng chứng cho giao dịch 1 gồm những mã nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, khối có một triệu giao dịch, làm tròn lên lũy thừa của 2. Bằng chứng cần bao nhiêu mã băm, và bao nhiêu byte? Câu hai, trong cây bốn lá ở trên, bằng chứng cho giao dịch 1 gồm những mã nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Tính hai lũy thừa quanh một triệu: $2^{19} = 524\,288$, $2^{20} = 1\,048\,576$.</p>
          <p>$2^{19} \lt 10^6 \leq 2^{20}$ → $\hl{20}$ mã, nhân 32 byte thành 640 byte.</p>
        introduces: [ltgt, geq]
        focus: [1, 2]
        say: "Với câu một, trước hết tính hai lũy thừa của 2 nằm quanh một triệu, 2 mũ 19 bằng 524 nghìn 288, còn 2 mũ 20 bằng 1 triệu 48 nghìn 576. Đáp án câu một, 2 mũ 19 nhỏ hơn một triệu, còn 2 mũ 20 thì không nhỏ hơn, nên cần 20 mã, nhân 32, bằng 640 byte."
      - show: |
          <table class="t"><tr><th>đi từ lá lên gốc</th><th>cần mã anh em</th></tr>
          <tr><td>h1 → h12</td><td>h2</td></tr><tr><td>h12 → gốc</td><td>h34</td></tr></table>
          <p>② <code>h2</code> (anh em của h1) và <code>h34</code> (anh em của h12).</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Với câu hai, đi từ lá của giao dịch 1 lên gốc. Muốn tính h 1 2 từ h 1, người kiểm cần thêm h 2. Muốn tính gốc từ h 1 2, người kiểm cần thêm h 3 4. Câu hai, bằng chứng gồm h 2 là anh em của h 1, và h 3 4 là anh em của h 1 2."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">lá = băm giao dịch, cha = băm hai con</span><span class="a">→</span>
          <span class="n">gốc tóm tắt cả khối</span><span class="a">→</span>
          <span class="n">bằng chứng: log₂ n mã anh em</span><span class="a">→</span>
          <span class="n">chỉ có nghĩa khi gốc đáng tin; tách tiền tố lá và nút</span></div>
        say: "Tổng kết lại, mỗi lá là băm của giao dịch, mỗi nút cha là băm của hai con, và gốc tóm tắt cả khối. Bằng chứng gồm lôgarit cơ số 2 của n mã anh em, chỉ có nghĩa khi gốc đáng tin, và nên tách tiền tố cho lá và nút."
      - show: |
          <div class="box key"><b>Tư duy:</b> không cần xem hết để tin một phần — chỉ cần <b>con đường</b> từ phần đó tới một thứ ta đã tin.</div>
        say: "Điều cần mang theo, không cần xem hết để tin một phần, chỉ cần con đường từ phần đó tới một thứ ta đã tin."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>chữ ký số, khoá và địa chỉ</b> — ai được tiêu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học chữ ký số, khoá và địa chỉ, tức ai được tiêu. Hẹn gặp bạn ở bài tiếp theo."
