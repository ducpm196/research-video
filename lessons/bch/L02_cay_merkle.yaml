  steps:
  - show: <table class='t'><tr><th>Thực hành BCH:L02</th><th>Hướng dẫn tự làm và tự chấm trên máy</th></tr><tr><td><b>Đề bài</b></td><td>Mở tệp <code>labs/BCH/L02/de.md</code>, tự viết chương trình <b>Python</b></td></tr><tr><td><b>Nhiệm vụ</b></td><td>Tính độ dài và dung lượng bằng chứng Merkle cho khối 4096 giao dịch</td></tr><tr><td><b>Khuôn đầu ra cần in</b></td><td><code>merkle_hashes=... proof_bytes=...</code></td></tr><tr><td><b>Lệnh tự chấm</b></td><td><code>bash labs/cham.sh BCH L02 duong_dan/bai_cua_ban.py</code><br/><i>(chạy trình dòng lệnh <code>bash</code> gọi công cụ so khớp từng dòng đầu ra với đáp án)</i></td></tr></table>
