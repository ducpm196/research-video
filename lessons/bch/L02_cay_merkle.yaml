      gốc duy nhất tóm tắt trọn vẹn cả khối dữ liệu. Bằng chứng thuộc về chỉ cần lôgarit cơ số 2 của n mã anh em dọc từ lá
      lên đỉnh. Nhưng bằng chứng chỉ có nghĩa khi gốc đáng tin và nút lá tách tiền tố với nút trong. Hai mức quy mô thể hiện
      rõ hiệu quả. Khối ít giao dịch không chênh nhiều. Khối nghìn giao dịch rút bằng chứng cho ví nhẹ xuống còn vài trăm
      byte. Nhờ phân tầng nhị phân, độ dài bằng chứng chỉ tăng thêm đúng một mã băm mỗi khi quy mô khối giao dịch tăng gấp
