    say: 'Tổng kết lại, mỗi lá là băm giao dịch, còn mỗi nút cha là băm của hai con bên dưới. Nhờ cấu trúc phân tầng, một mã gốc duy nhất tóm tắt trọn vẹn cả khối dữ liệu. Bằng chứng thuộc về chỉ cần lôgarit cơ số 2 của n mã anh em dọc từ lá lên đỉnh. Nhưng bằng chứng chỉ có nghĩa khi gốc đáng tin và nút lá tách tiền tố với nút trong. Hai mức quy mô thể hiện rõ hiệu quả. Khối ít giao dịch không chênh nhiều. Khối nghìn giao dịch rút bằng chứng cho ví nhẹ xuống còn vài trăm byte.'
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
  - show: |
      <div class="box key"><b>Tư duy:</b> không cần xem hết để tin một phần — chỉ cần <b>con đường</b> từ phần đó tới một thứ ta đã tin.</div>
    say: Tư duy cần mang theo là không cần tải hết cả tập dữ liệu mới tin được một phần nhỏ. Ta chỉ cần đúng con đường ngắn kiểm chứng được nối từ phần đó tới một gốc tin cậy đã biết.
  - clear: true
