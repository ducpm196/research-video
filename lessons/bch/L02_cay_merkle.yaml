- id: hook
  kind: hook
  title: Điện thoại không tải nổi cả khối
  checks:
  - len(alg.merkle_proof(alg.merkle_levels([f'gd{i}'.encode() for i in range(1024)]), 357)) * 32 == 320
  steps:
  - show: '<p>Ví trên điện thoại muốn biết: giao dịch trả tiền của tôi đã nằm trong khối chưa? Khối có 1024 giao dịch. Tải
      cả khối là tốn dữ liệu, tốn pin. Với cây Merkle, ví chỉ cần <b>10 mã băm — 320 byte</b> — cộng gốc của khối là kiểm
      được.</p>

      <div class="box key">Hôm nay: <b>cây Merkle</b> — tóm tắt n giao dịch bằng một gốc, và chứng minh một giao dịch thuộc
      về bằng log₂ n mã băm.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, ví trên điện thoại muốn biết giao dịch trả tiền của tôi đã nằm trong khối chưa. Khối có 1024 giao dịch.
      Tải cả khối thì tốn dữ liệu và tốn pin. Với cây Merkle, ví chỉ cần 10 mã băm, tức 320 byte, cộng với gốc của khối, là
      kiểm được. Hôm nay ta học cây Merkle, cách tóm tắt n giao dịch bằng một gốc, và chứng minh một giao dịch thuộc về bằng
      lôgarit cơ số 2 của n mã băm. Nếu không có cấu trúc cây tóm tắt giao dịch, ví di động thiếu dung lượng khó lòng tự kiểm
      chứng khoản thanh toán của mình một cách độc lập.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: chia đôi, cây nhị phân, mã 32 byte'
  checks:
  - '2 ** 10 == 1024 and math.log2(1024) == 10 and (lambda f: f(f, 1024))(lambda f, n: 0 if n == 1 else 1 + f(f, n // 2))
    == 10'
  - 4 + 2 + 1 == 7 and math.log2(8) == 3 and 256 // 8 == 32 and len(__import__('hashlib').sha256(b'gd1').digest()) == 32
  steps:
  - show: '<p>Chia đôi liên tục cho tới khi còn 1:</p>

      <div class="code"><div>1024 → 512 → 256 → 128 → 64 → 32 → 16 → 8 → 4 → 2 → 1</div></div>

      <p>Mười lần chia đôi, vì $2^{10} = 1024$. Ta viết $\log_2 1024 = 10$, đọc là lôgarit cơ số 2 của 1024: <b>số lần chia
      đôi</b> để về 1.</p>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    - 3
    say: Trước hết, ôn phép chia đôi liên tục. Bắt đầu từ 1024, chia đôi mãi, ta được 512, 256, và cứ thế tới 1. Đếm lại thì
      có mười lần chia đôi, vì 2 mũ 10 bằng 1024. Ta viết lôgarit cơ số 2 của 1024 bằng 10, nghĩa là số lần chia đôi để về
      1. Mỗi lần chia đôi thu hẹp không gian tìm kiếm xuống một nửa khiến một nghìn hai mươi bốn giao dịch chỉ cần đúng mười
      bước leo cây.
  - show: '<table class="t"><tr><th>ôn lại</th><th>ví dụ số</th></tr>

      <tr><td><b>cây nhị phân</b>: các ô (nút) nối từ trên xuống, mỗi nút có tối đa hai con; nút dưới cùng không có con là
      <b>lá</b>, nút trên cùng là <b>gốc</b></td><td>cây đầy đủ 8 lá: $4 + 2 + 1 = 7$ nút ở trên lá, xếp thành $\log_2 8 =
      3$ tầng</td></tr>

      <tr><td>mã băm ở bài 1: 256 bit, đổi một ký tự là mã đổi hoàn toàn</td><td>256 bit chia 8 = 32 byte mỗi mã</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    say: Bảng này ôn thêm hai điều mà ta sẽ dùng ngay trong bài. Cây nhị phân gồm các ô gọi là nút, nối từ trên xuống, mỗi
      nút có tối đa hai con, nút dưới cùng không có con gọi là lá, còn nút trên cùng gọi là gốc. Cây đầy đủ có 8 lá thì phía
      trên có 4 cộng 2 cộng 1, bằng 7 nút, xếp thành lôgarit cơ số 2 của 8, bằng 3 tầng. Ở bài 1, mã băm dài 256 bit, đổi
      một ký tự là mã đổi hoàn toàn, và 256 bit chia 8 là 32 byte mỗi mã. Sơ đồ nhị phân gom từng cặp lá lên cha và lặp lại
      tới đỉnh giúp độ sâu cây tăng rất chậm theo lô-ga-rít cơ số hai.
- id: sym
  kind: symbol
  title: 'Giải mã: lá, nút cha, gốc, bằng chứng'
  steps:
  - show: '<div class="code"><div>                gốc = băm(h12 | h34)</div><div>               /                \</div><div>     h12
      = băm(h1 | h2)    h34 = băm(h3 | h4)</div><div>        /      \              /      \</div><div>  h1=băm(gd1) h2=băm(gd2)
      h3=băm(gd3) h4=băm(gd4)</div></div>

      <p><b>Bằng chứng</b> cho gd3: anh em <code>h4</code>, rồi anh em của cha là <code>h12</code>. Người kiểm tính băm(gd3)
      → ghép với h4 → ghép với h12 → so với gốc. Mỗi tầng một mã: $\log_2 n$ mã.</p>

      <p>Đổi một giao dịch bất kỳ là gốc đổi — gốc nằm trong tiêu đề khối (phần đầu khối, băm cùng mã khối trước), nên được
      liên kết băm bảo vệ (bài 1).</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Sơ đồ là một cây bốn lá. Mỗi lá là băm của một giao dịch, hai lá ghép lại và băm thành nút cha, và hai nút cha ghép
      lại và băm thành gốc. Bằng chứng cho giao dịch 3 gồm anh em của nó là h 4, rồi anh em của cha nó là h 1 2. Người kiểm
      tính băm của giao dịch 3, ghép với h 4, ghép tiếp với h 1 2, rồi so với gốc, mỗi tầng một mã, tổng cộng lôgarit cơ số
      2 của n mã. Đổi một giao dịch bất kỳ là gốc đổi, mà gốc nằm trong tiêu đề khối, tức phần đầu khối băm cùng mã khối trước,
      nên được liên kết băm bảo vệ như ở bài 1. Chỉ giữ mỗi mã gốc ba mươi hai bai trong tiêu đề khối cho phép xác thực cả
      khối khổng lồ chứa hàng nghìn giao dịch con.
