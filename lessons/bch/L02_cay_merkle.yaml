    clear: true
  - show: <table class='t'><tr><th>viết trong mã</th><th>đọc và hiểu là</th></tr><tr><td><code>math (log2)</code></td><td>Nạp hàm toán học chuẩn (lượng giác, hàm ngược góc, đổi radian ra độ, lôgarit, lũy thừa)</td></tr><tr><td><code>int(x)</code></td><td>Hàm/phương thức dựng sẵn thường dùng (sắp xếp, cực trị, ghép đôi, đánh chỉ số, làm tròn, lấy/thêm phần tử)</td></tr><tr><td><code>= / + / - / * / /</code></td><td>Phép gán <code>=</code> đặt giá trị vào biến; <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> là cộng, trừ, nhân, chia</td></tr><tr><td><code>f&quot;...{ten_bien}...&quot;</code></td><td>Chuỗi định dạng chèn giá trị biến vào văn bản (<code>:.2f</code> làm tròn 2 chữ số; <code>!r</code> giữ nguyên dấu nháy)</td></tr><tr><td><code>print(...)</code></td><td>In từng dòng kết quả ra màn hình để kiểm khớp đáp án</td></tr></table>
