      stroke="#2a78d6" stroke-width="3"/><text x="1110" y="148" text-anchor="middle" font-weight="bold">h5678</text><rect
      x="670" y="20" width="160" height="50" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="750" y="53"
      text-anchor="middle" font-weight="bold">gốc</text><text x="120" y="390" text-anchor="middle" fill="#6b7280">gd1</text><text
      x="300" y="390" text-anchor="middle" fill="#6b7280">gd2</text><text x="480" y="390" text-anchor="middle" fill="#6b7280">gd3</text><text
      x="660" y="390" text-anchor="middle" fill="#6b7280">gd4</text><text x="840" y="390" text-anchor="middle" fill="#6b7280">gd5</text><text
      x="1020" y="390" text-anchor="middle" fill="#2a78d6">gd6</text><text x="1200" y="390" text-anchor="middle" fill="#6b7280">gd7</text><text
      x="1380" y="390" text-anchor="middle" fill="#6b7280">gd8</text><text x="20" y="40" fill="#eb6834">cam: bằng chứng, 3
      mã</text><text x="20" y="75" fill="#2a78d6">xanh: người kiểm tự tính</text><text x="1480" y="40" text-anchor="end" fill="#059669">lục:
      gốc trong tiêu đề khối</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ một cây 8 lá, và ta muốn chứng minh giao dịch 6 nằm trong cây. Người kiểm tự băm giao dịch 6 thành h 6, rồi
      cần mã anh em h 5 để tính h 5 6. Sau đó người kiểm cần h 7 8 để tính nút trên nữa, và cần h 1 2 3 4 để tính ra gốc.
      Ba ô màu cam là toàn bộ bằng chứng, đúng bằng lôgarit cơ số 2 của 8, bằng 3 mã. Các ô màu xám, gồm sáu lá và hai nút
      h 1 2, h 3 4, không cần gửi, vì thông tin của chúng đã được gói sẵn trong ba ô cam. Thay vì tải toàn bộ các nhánh còn
      lại của khối, người kiểm chứng chỉ cần đúng những mã anh em nằm dọc đường đi lên gốc.
- id: example
  kind: example
  title: 1024 giao dịch, kiểm giao dịch số 357
  checks:
  - '(lambda L: (len(L) - 1, len(alg.merkle_proof(L, 357)), alg.merkle_verify(b''gd357'', 357, alg.merkle_proof(L, 357), L[-1][0]),
    alg.merkle_verify(b''gd357x'', 357, alg.merkle_proof(L, 357), L[-1][0])))(alg.merkle_levels([f''gd{i}''.encode() for i
    in range(1024)])) == (10, 10, True, False)'
  - '[(357 >> k) ^ 1 for k in range(10)] == [356, 179, 88, 45, 23, 10, 4, 3, 0, 1] and 357 // 2 == 178 and [357 >> k for k
    in range(10)] == [357, 178, 89, 44, 22, 11, 5, 2, 1, 0] and (lambda L: [L[k].index(alg.merkle_proof(L, 357)[k]) for k
    in range(10)])(alg.merkle_levels([f''gd{i}''.encode() for i in range(1024)])) == [356, 179, 88, 45, 23, 10, 4, 3, 0, 1]'
  - 10 * 32 == 320 and 1024 * 32 == 32768 and 32768 / 320 == 102.4
  steps:
  - show: '<p>Khối có 1024 giao dịch, đánh số từ 0 tới 1023; ví cần kiểm giao dịch số 357 (chạy với hàm băm thật).</p>

      <p><b>Bước 1 — số tầng:</b> $\log_2 1024 = \hl{10}$ tầng trên lá, nên bằng chứng có 10 mã.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Khối có 1024 giao dịch, đánh số từ 0 tới 1023, và ví cần kiểm giao dịch số 357, chạy với một hàm băm thật. Bước một,
      ta đếm xem cây có bao nhiêu tầng phía trên các lá. Số tầng trên lá là lôgarit cơ số 2 của 1024, bằng 10.
  - show: '<p><b>Bước 2 — mã anh em ở mỗi tầng:</b> vị trí lẻ thì anh em đứng ngay trước, vị trí chẵn thì anh em đứng ngay
      sau; lên một tầng thì vị trí chia 2, bỏ phần dư.</p>

      <table class="t"><tr><th>tầng</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr>

      <tr><td>vị trí của ta</td><td>357</td><td>178</td><td>89</td><td>44</td><td>22</td><td>11</td><td>5</td><td>2</td><td>1</td><td>0</td></tr>

      <tr><td>vị trí anh em</td><td>356</td><td>179</td><td>88</td><td>45</td><td>23</td><td>10</td><td>4</td><td>3</td><td>0</td><td>1</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.2'
    - '2.3'
    - '2.3'
    say: Bước hai, tìm mã anh em ở mỗi tầng, theo luật vị trí lẻ thì anh em đứng ngay trước, vị trí chẵn thì anh em đứng ngay
      sau. Ở tầng lá, 357 là số lẻ, nên anh em là 356. Lên một tầng, vị trí thành 357 chia 2 bỏ phần dư, bằng 178, số chẵn,
      nên anh em là 179. Làm tiếp tới gốc, ta được đủ mười vị trí anh em như hàng cuối của bảng. Ở mỗi tầng leo lên cha, vị
      trí chỉ số được chia nguyên cho hai để xác định đúng cặp trái phải ghép lại khi băm tiếp.
  - clear: true
    show: '<p><b>Bước 3 — kích thước:</b> 10 mã nhân 32 byte = $\hl{320}$ byte.</p>

      <p>Chỉ riêng 1024 mã lá đã là 1024 nhân 32 = 32768 byte, gấp 102,4 lần bằng chứng.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước ba, tính kích thước của bằng chứng. Bằng chứng cho giao dịch 357 gồm 10 mã, mỗi mã 32 byte, tổng 320 byte. Còn
      nếu tải chỉ riêng 1024 mã lá thôi, chưa kể giao dịch, đã là 1024 nhân 32, bằng 32768 byte, gấp 102 phẩy 4 lần bằng chứng.
  - show: '<table class="t"><tr><th>Bước 4 — kiểm với gốc</th><th>kết quả</th></tr>

      <tr><td>giao dịch 357 đúng nguyên văn</td><td>khớp <b>(đúng)</b></td></tr>

      <tr><td>đổi một ký tự của giao dịch rồi kiểm lại</td><td>không khớp <b class="red">(sai)</b></td></tr></table>

      <p>So với tải cả 1024 giao dịch: bằng chứng tăng theo <b>log</b> n, không theo n.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    say: Bước bốn, ghép lần lượt mười mã anh em rồi so với gốc. Kiểm bằng chứng này với gốc của cây thì thấy khớp. Đổi một
      ký tự của giao dịch rồi kiểm lại thì không khớp. So với tải cả 1024 giao dịch, bằng chứng chỉ tăng theo lôgarit của
      n, không theo n. Một thay đổi nhỏ một bít trong giao dịch gốc khiến giá trị băm tính leo tới đỉnh lệch hẳn so với mã
      gốc ghi sẵn trên tiêu đề khối.
- id: check
  kind: check
  title: 'Tự kiểm: dựng gốc bằng cách khác, đếm số lần băm'
  checks:
  - '(lambda leaves, sha: (lambda f: f(f, leaves))(lambda f, x: sha(x[0]) if len(x) == 1 else sha(f(f, x[:len(x) // 2]) +
    f(f, x[len(x) // 2:]))) == alg.merkle_levels(leaves)[-1][0])([f''gd{i}''.encode() for i in range(1024)], lambda b: __import__(''hashlib'').sha256(b).digest())'
  - sum(len(l) for l in alg.merkle_levels([f'gd{i}'.encode() for i in range(1024)])) == 2047 == 1024 + 1023 and 1 + 10 ==
    11
  steps:
  - show: '<table class="t"><tr><th>đường khác</th><th>kết quả</th></tr>

      <tr><td>dựng gốc kiểu khác: chia danh sách làm hai nửa, băm gốc của từng nửa rồi ghép</td><td>cùng một gốc ✓</td></tr>

      <tr><td>số lần băm để dựng cả cây: 1024 lá + 1023 nút trên</td><td>2047</td></tr>

      <tr><td>số lần băm để kiểm bằng chứng: 1 cho lá + 10 lần ghép</td><td>$\hl{11}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Kiểm bằng đường khác, ta không dựng cây từ dưới lên nữa. Ta chia danh sách 1024 giao dịch làm hai nửa, tìm gốc của
      từng nửa theo cùng cách, rồi ghép và băm, và được đúng cùng một gốc. Đếm số lần băm thì dựng cả cây cần 1024 lần cho
      lá cộng 1023 lần cho các nút trên, tổng 2047 lần. Còn kiểm bằng chứng chỉ cần 1 lần cho lá cộng 10 lần ghép, tức 11
      lần, khớp với 10 mã của bằng chứng. Cách chia đôi đệ quy cho cùng kết quả gốc tuyệt đối và tổng chi phí đường truyền
      vẫn vỏn vẹn mười mã ba mươi hai bai.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Tin bằng chứng mà không tin gốc <b class="red">(chứng minh thuộc về một cây
      giả)</b>

      <br><span class="note">Kẻ xấu dựng cây riêng có giao dịch giả và đưa gốc của cây đó. Bằng chứng chỉ có nghĩa khi gốc
      lấy từ tiêu đề khối của <b>chuỗi đúng</b>, đã được nhiều khối xác nhận.</span></div>

      '
    say: Lỗi thứ nhất, tin bằng chứng mà không tin gốc, nên chứng minh thuộc về một cây giả. Kẻ xấu có thể dựng cây riêng
      chứa giao dịch giả và đưa ra gốc của cây đó. Bằng chứng chỉ có nghĩa khi gốc được lấy từ tiêu đề khối của chuỗi đúng,
      đã được nhiều khối xác nhận. Một bằng chứng hợp lệ chỉ có ý nghĩa an toàn khi mã gốc dùng để đối chiếu đã lấy từ một
      tiêu đề khối thuộc chuỗi dài nhất hợp lệ.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Băm lá và nút trong như nhau <b class="red">(giả một nút trong làm lá)</b>

      <br><span class="note">Nếu lá và nút cha băm cùng một kiểu, một nút trong có thể được trình ra như một “giao dịch”.
      Thêm tiền tố khác nhau: <code>0x00</code> cho lá, <code>0x01</code> cho nút trong (như RFC 6962).</span></div>

      '
    say: Lỗi thứ hai, băm lá và nút trong theo cùng một kiểu, nên có thể giả một nút trong làm lá. Khi đó một nút trong có
      thể được trình ra như một giao dịch. Hãy thêm tiền tố khác nhau trước khi băm, tiền tố hệ mười sáu một byte 0 cho lá
      và một byte 1 cho nút trong theo quy tắc minh bạch chứng chỉ. Gắn thêm tiền tố một bai phân biệt lá với nút trung gian
      ngăn kẻ gian đánh lừa bộ kiểm bằng cách ghép hai mã trong cây như giao dịch giả.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Lẫn “chứng minh có” với “chứng minh không có” <b class="red">(cây thường không
      chứng minh vắng mặt)</b>

      <br><span class="note">Cây Merkle thường chỉ chứng minh một phần tử <b>có</b> trong cây. Chứng minh <b>không có</b>
      cần cây đã sắp thứ tự, đưa ra hai lá kề nhau bao quanh vị trí đáng lẽ của phần tử.</span></div>

      '
    say: Lỗi thứ ba, lẫn chứng minh có với chứng minh không có, trong khi cây thường không chứng minh được sự vắng mặt. Cây
      Merkle thường chỉ chứng minh một phần tử có trong cây. Chứng minh không có cần một cây đã sắp thứ tự, và đưa ra hai
      lá kề nhau bao quanh vị trí đáng lẽ của phần tử. Muốn chứng minh một phần tử vắng mặt, hệ thống buộc phải dùng cây sắp
      thứ tự theo khoá hoặc công bố trọn cặp kẹp hai bên phần tử đó.
  - show: '<table class="t"><tr><th>quy mô cây Merkle</th><th>tỉ lệ bằng chứng</th><th>lợi ích thực tế</th></tr><tr><td>Khối
      tí hon 8 giao dịch</td><td>3 mã (96 B) vs 8 mã (256 B)</td><td>nhẹ hơn chưa tới 3 lần</td></tr><tr><td>Khối 1024–4096
      giao dịch</td><td>10–12 mã (320–384 B)</td><td>ví điện thoại kiểm cực nhẹ không cần tải cả khối</td></tr></table>

      '
    say: Nhìn hai mức quy mô của cây Merkle để thấy giá trị thực chiến của nó trong ví nhẹ. Với khối tí hon 8 giao dịch, đường
      bằng chứng 3 mã anh em cũng mới chỉ giảm từ 8 mã xuống 3 mã. Do đó mức tiết kiệm trên khối nhỏ chưa đáng kể. Khi khối
      chứa 1024 hay 4096 giao dịch, đường bằng chứng chỉ còn 10 tới 12 mã. Dung lượng cần truyền vì vậy chỉ nằm quanh mức
      320 tới 384 byte rất nhỏ gọn.
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: '<table class="t"><tr><th>quy mô cây Merkle</th><th>tỉ lệ bằng chứng</th><th>lợi ích thực tế</th></tr><tr><td>Khối
      tí hon 8 giao dịch</td><td>3 mã (96 B) vs 8 mã (256 B)</td><td>nhẹ hơn chưa tới 3 lần</td></tr><tr><td>Khối 1024–4096
      giao dịch</td><td>10–12 mã (320–384 B)</td><td>ví điện thoại kiểm cực nhẹ không cần tải cả khối</td></tr></table>

      '
    say: Ví điện thoại kiểm chứng chính xác một giao dịch mà nhẹ hơn hàng trăm lần. Điều kiện duy nhất là phải tin đúng gốc
      cây và luôn tách tiền tố lá với nút trong.
    focus:
    - '1.2'
    - '1.3'
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - math.ceil(math.log2(10 ** 6)) == 20 and 20 * 32 == 640 and 2 ** 20 >= 10 ** 6 > 2 ** 19
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Khối có một triệu giao dịch (làm tròn lên lũy thừa của 2). Bằng chứng cần bao nhiêu mã băm, bao nhiêu
      byte?</td></tr>

      <tr><td>2</td><td>Trong cây 4 lá: gốc = băm(h12 | h34), h12 = băm(h1 | h2), h34 = băm(h3 | h4). Bằng chứng cho giao
      dịch 1 gồm những mã nào?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, khối có một triệu giao dịch, làm tròn lên lũy thừa của 2. Bằng chứng cần bao
      nhiêu mã băm, và bao nhiêu byte? Câu hai, trong cây bốn lá ở trên, bằng chứng cho giao dịch 1 gồm những mã nào? Dừng
      video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Tính hai lũy thừa quanh một triệu: $2^{19} = 524\,288$, $2^{20} = 1\,048\,576$.</p>

      <p>$2^{19} \lt 10^6 \leq 2^{20}$ → $\hl{20}$ mã, nhân 32 byte thành 640 byte.</p>

      '
    introduces:
    - ltgt
    - geq
    focus:
    - 1
    - 2
    say: Với câu một, trước hết tính hai lũy thừa của 2 nằm quanh một triệu, 2 mũ 19 bằng 524 nghìn 288, còn 2 mũ 20 bằng
      1 triệu 48 nghìn 576. Đáp án câu một, 2 mũ 19 nhỏ hơn một triệu, còn 2 mũ 20 thì không nhỏ hơn, nên cần 20 mã, nhân
      32, bằng 640 byte.
  - show: '<table class="t"><tr><th>đi từ lá lên gốc</th><th>cần mã anh em</th></tr>

      <tr><td>h1 → h12</td><td>h2</td></tr><tr><td>h12 → gốc</td><td>h34</td></tr></table>

      <p>② <code>h2</code> (anh em của h1) và <code>h34</code> (anh em của h12).</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    say: Với câu hai, đi từ lá của giao dịch 1 lên gốc. Muốn tính h 1 2 từ h 1, người kiểm cần thêm h 2. Muốn tính gốc từ
      h 1 2, người kiểm cần thêm h 3 4. Câu hai, bằng chứng gồm h 2 là anh em của h 1, và h 3 4 là anh em của h 1 2.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/BCH/L02
  steps:
  - show: <table class='t'><tr><th>Thực hành BCH:L02</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Biết
      bằng chứng chỉ có giá trị khi gốc đáng tin</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>4096 32</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh BCH L02 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 2 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Tính chính xác số tầng lô-ga-rít cơ số hai và tổng
