id: L02
course: BCH
series: "BCH · Blockchain và sổ cái phân tán"
title: "Bài 2 — Cây Merkle và bằng chứng thuộc về"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/bch.yaml L02; audit/bch/verify_bch.py L02; R. Merkle, A Digital Signature Based on a Conventional Encryption Function (CRYPTO 1987); S. Nakamoto (2008), mục 7–8 (kiểm tra thanh toán rút gọn); RFC 6962 (Certificate Transparency, cây Merkle); bài 1"
assumes: [arith, power, log, cdot, sub]
# Quy ước: cây nhị phân, số lá là lũy thừa của 2; lá = SHA-256(giao dịch), nút cha = SHA-256(con trái | con phải), mỗi mã 32 byte (alg.merkle_levels).
#   Bằng chứng thuộc về của một lá = các mã anh em trên đường lên gốc (alg.merkle_proof, alg.merkle_verify). Số mã trong bằng chứng = log₂ n.
objectives:
  - "Dựng cây Merkle"
  - "Kiểm một giao dịch thuộc khối bằng log₂ n mã băm"
  - "Biết bằng chứng chỉ có giá trị khi gốc đáng tin"
