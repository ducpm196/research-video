id: L11
course: BCH
series: "BCH · Blockchain và sổ cái phân tán"
title: "Bài 11 — Nguồn dữ liệu ngoài, quyền riêng tư và giới hạn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/bch.yaml L11; audit/bch/verify_bch.py L11; S. Meiklejohn và cộng sự, A Fistful of Bitcoins: Characterizing Payments Among Men with No Names (IMC 2013); tài liệu về nguồn dữ liệu phi tập trung (oracle) — gộp theo trung vị (bản hiện hành); bài 0, 7, 9"
assumes: [arith, frac, floor]
# Quy ước: nguồn dữ liệu ngoài (oracle) = bên đưa dữ liệu thế giới thật (giá, kết quả trận đấu) lên chuỗi. Gộp n nguồn độc lập bằng TRUNG VỊ (alg.median_oracle):
#   với n lẻ, trung vị vẫn nằm giữa hai giá trị đúng khi số nguồn sai ≤ ⌊(n − 1)/2⌋. Giá là SỐ MINH HOẠ. Nội dung phòng thủ.
objectives:
  - "Giải thích bài toán nguồn dữ liệu ngoài chuỗi"
  - "Tính số nguồn sai chịu được khi gộp bằng trung vị"
  - "Nêu hệ quả quyền riêng tư của sổ cái công khai"
asr_reviewed:
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hợp đồng không nhìn thấy thế giới"
    checks:
      - "alg.median_oracle([100, 101, 99, 100, 0, 0, 10 ** 6]) == 100"
    steps:
      - show: |
          <p>Hợp đồng bảo hiểm chuyến bay tự trả tiền nếu máy bay trễ quá 3 giờ. Nhưng hợp đồng chỉ đọc được dữ liệu <b>trên chuỗi</b> — nó không biết chuyến bay trễ hay không. Ai đó phải đưa thông tin vào. Nếu người đó nói dối, mọi tính toán an toàn phía sau đều vô nghĩa.</p>
          <div class="box key">Hôm nay: <b>nguồn dữ liệu ngoài</b>, <b>quyền riêng tư</b> trên sổ cái công khai, và những giới hạn mà chuỗi khối không vượt qua được.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, một hợp đồng bảo hiểm chuyến bay tự trả tiền nếu máy bay trễ quá 3 giờ. Nhưng hợp đồng chỉ đọc được dữ liệu trên chuỗi, nó không biết chuyến bay trễ hay không. Ai đó phải đưa thông tin vào. Nếu người đó nói dối, mọi tính toán an toàn phía sau đều vô nghĩa. Hôm nay ta học nguồn dữ liệu ngoài, quyền riêng tư trên sổ cái công khai, và những giới hạn mà chuỗi khối không vượt qua được."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: trung vị, phần nguyên, ngưỡng chịu lỗi"
    checks:
      - "alg.median_oracle([5, 1, 9]) == 5 and sorted([5, 1, 9]) == [1, 5, 9]"
      - "round(sum([100, 101, 10 ** 6]) / 3) == 333400 and alg.median_oracle([100, 101, 10 ** 6]) == 101"
      - "math.floor(2.5) == 2 and math.floor(3) == 3 and alg.bft_tolerance(100) == (33, 67)"
    steps:
      - show: |
          <p>Ở khoá Khoa học dữ liệu: <b>trung vị</b> là số đứng giữa sau khi sắp xếp. Dãy 5, 1, 9 → sắp xếp 1, <b>5</b>, 9 → trung vị $\hl{5}$.</p>
          <table class="t"><tr><th>ba số</th><th>trung bình</th><th>trung vị</th></tr>
          <tr><td>100, 101, 1 000 000</td><td>≈ 333 400</td><td>101</td></tr></table>
        focus: [1, 1, 2, "2.2"]
        say: "Trước hết, ôn lại trung vị ở khoá Khoa học dữ liệu, là số đứng giữa sau khi đã sắp xếp. Dãy 5, 1, 9 sắp xếp lại thành 1, 5, 9, nên trung vị là 5. Bảng cho thấy sự khác nhau với trung bình. Ba số 100, 101 và 1 triệu có trung bình khoảng 333400, bị một số khổng lồ kéo đi, còn trung vị vẫn là 101."
      - show: |
          <p><b>Phần nguyên</b> $\lfloor x \rfloor$: số nguyên lớn nhất không vượt quá $x$. $\lfloor 2{,}5 \rfloor = 2$, $\lfloor 3 \rfloor = 3$.</p>
        say: "Điều thứ hai, phần nguyên của x, viết bằng cặp ngoặc vuông chỉ có nửa dưới, là số nguyên lớn nhất không vượt quá x. Ví dụ phần nguyên của 2 phẩy 5 bằng 2, còn phần nguyên của 3 vẫn là 3."
      - clear: true
        show: |
          <table class="t"><tr><th>ở bài 7</th><th>100 bên xác thực</th></tr>
          <tr><td>chịu được tối đa</td><td>33 bên gian lận (dưới một phần ba)</td></tr>
          <tr><td>phiếu cần để chốt</td><td>$100 - 33 = 67$</td></tr></table>
          <p>Hôm nay: gộp nguồn bằng trung vị chịu được <b>dưới một nửa</b> số nguồn sai — một ngưỡng khác, vì bài toán khác.</p>
        focus: ["1.2", "1.3", 2]
        say: "Điều thứ ba, nhắc lại bài 7 về bằng chứng cổ phần, với 100 bên xác thực có cùng quyền biểu quyết, hệ chịu được tối đa 33 bên gian lận, dưới một phần ba. Số phiếu cần để chốt khối là 100 trừ 33, bằng 67 phiếu. Hôm nay, gộp nguồn bằng trung vị chịu được dưới một nửa số nguồn sai, một ngưỡng khác, vì đây là một bài toán khác."

  - id: sym
    kind: symbol
    title: "Giải mã: nguồn dữ liệu ngoài và trung vị"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>nguồn dữ liệu ngoài</b> (oracle)</td><td>bên đưa dữ kiện thế giới thật lên chuỗi, có chữ ký</td></tr>
          <tr><td><b>gộp nhiều nguồn</b></td><td>n nguồn độc lập, lấy <b>trung vị</b> thay vì trung bình</td></tr>
          <tr><td><b>chịu được</b></td><td>với n lẻ, tối đa $\lfloor \frac{n - 1}{2} \rfloor$ nguồn sai mà trung vị vẫn nằm giữa hai giá trị đúng</td></tr></table>
          <p>Trung bình thì <b>một</b> nguồn sai cực lớn là đủ kéo lệch; trung vị cần quá nửa số nguồn cùng sai.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bảng có ba khái niệm. Nguồn dữ liệu ngoài là bên đưa dữ kiện thế giới thật lên chuỗi, kèm chữ ký. Gộp nhiều nguồn là lấy n nguồn độc lập, và dùng trung vị thay vì trung bình. Với n lẻ, cách này chịu được tối đa phần nguyên của n trừ 1 chia 2 nguồn sai, mà trung vị vẫn nằm giữa hai giá trị đúng. Với trung bình, chỉ một nguồn sai cực lớn là đủ kéo lệch, còn trung vị cần quá nửa số nguồn cùng sai."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Ô giữa thuộc về ai?"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><text x="40" y="108" font-size="22" fill="#1f2937">7 nguồn, 3 sai</text><text x="365" y="58" font-size="20" text-anchor="middle" fill="#6b7280">1</text><rect x="300" y="70" width="130" height="60" rx="8" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="365" y="108" font-size="22" text-anchor="middle" fill="#1f2937">0</text><text x="515" y="58" font-size="20" text-anchor="middle" fill="#6b7280">2</text><rect x="450" y="70" width="130" height="60" rx="8" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="515" y="108" font-size="22" text-anchor="middle" fill="#1f2937">0</text><text x="665" y="58" font-size="20" text-anchor="middle" fill="#6b7280">3</text><rect x="600" y="70" width="130" height="60" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="665" y="108" font-size="22" text-anchor="middle" fill="#1f2937">99</text><text x="815" y="58" font-size="20" text-anchor="middle" fill="#6b7280">4</text><rect x="750" y="70" width="130" height="60" rx="8" fill="#bfdbfe" stroke="#059669" stroke-width="6"/><text x="815" y="108" font-size="22" text-anchor="middle" fill="#1f2937">100</text><text x="965" y="58" font-size="20" text-anchor="middle" fill="#6b7280">5</text><rect x="900" y="70" width="130" height="60" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="965" y="108" font-size="22" text-anchor="middle" fill="#1f2937">100</text><text x="1115" y="58" font-size="20" text-anchor="middle" fill="#6b7280">6</text><rect x="1050" y="70" width="130" height="60" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="1115" y="108" font-size="22" text-anchor="middle" fill="#1f2937">101</text><text x="1265" y="58" font-size="20" text-anchor="middle" fill="#6b7280">7</text><rect x="1200" y="70" width="130" height="60" rx="8" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="1265" y="108" font-size="22" text-anchor="middle" fill="#1f2937">1 000 000</text><text x="815" y="168" font-size="22" text-anchor="middle" fill="#059669">ô giữa (thứ 4) là nguồn đúng → trung vị 100</text><text x="40" y="258" font-size="22" fill="#1f2937">5 nguồn, 3 sai</text><text x="365" y="208" font-size="20" text-anchor="middle" fill="#6b7280">1</text><rect x="300" y="220" width="130" height="60" rx="8" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="365" y="258" font-size="22" text-anchor="middle" fill="#1f2937">0</text><text x="515" y="208" font-size="20" text-anchor="middle" fill="#6b7280">2</text><rect x="450" y="220" width="130" height="60" rx="8" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="515" y="258" font-size="22" text-anchor="middle" fill="#1f2937">0</text><text x="665" y="208" font-size="20" text-anchor="middle" fill="#6b7280">3</text><rect x="600" y="220" width="130" height="60" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="6"/><text x="665" y="258" font-size="22" text-anchor="middle" fill="#1f2937">0</text><text x="815" y="208" font-size="20" text-anchor="middle" fill="#6b7280">4</text><rect x="750" y="220" width="130" height="60" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="815" y="258" font-size="22" text-anchor="middle" fill="#1f2937">100</text><text x="965" y="208" font-size="20" text-anchor="middle" fill="#6b7280">5</text><rect x="900" y="220" width="130" height="60" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="965" y="258" font-size="22" text-anchor="middle" fill="#1f2937">101</text><text x="665" y="318" font-size="22" text-anchor="middle" fill="#b91c1c">ô giữa (thứ 3) là nguồn sai → trung vị 0</text><text x="1460" y="258" font-size="20" text-anchor="end" fill="#2a78d6">xanh: nguồn đúng</text><text x="1460" y="288" font-size="20" text-anchor="end" fill="#b91c1c">đỏ: nguồn sai</text></svg></div>
        focus: [1, 1, 1]
        say: "Hình xếp các giá báo theo thứ tự từ nhỏ tới lớn, ô xanh là nguồn đúng, ô đỏ là nguồn sai. Hàng trên có 7 nguồn với 3 nguồn sai, dù dồn về hai đầu thế nào, ba ô đỏ cũng không chiếm được ô giữa thứ 4, nên trung vị vẫn là giá đúng. Hàng dưới có 5 nguồn mà 3 nguồn sai, quá nửa, nên ô giữa thứ 3 rơi vào nguồn sai và trung vị bằng 0."

  - id: example
    kind: example
    title: "7 nguồn giá, 3 nguồn sai"
    checks:
      - "alg.median_oracle([100, 101, 99, 100, 0, 0, 10 ** 6]) == 100 and round(sum([100, 101, 99, 100, 0, 0, 10 ** 6]) / 7) == 142914 and (7 - 1) // 2 == 3"
      - "sorted([100, 101, 99, 100, 0, 0, 10 ** 6]) == [0, 0, 99, 100, 100, 101, 10 ** 6] and (7 + 1) // 2 == 4 and sum([100, 101, 99, 100, 0, 0, 10 ** 6]) == 1000400"
      - "sorted([99, 100, 101, 0, 0, 0, 0]) == [0, 0, 0, 0, 99, 100, 101] and alg.median_oracle([99, 100, 101, 0, 0, 0, 0]) == 0"
    steps:
      - show: |
          <table class="t"><tr><th>nguồn</th><th>giá báo</th></tr>
          <tr><td>4 nguồn đúng</td><td>100, 101, 99, 100</td></tr>
          <tr><td>3 nguồn sai (hỏng hoặc gian)</td><td>0, 0, 1 000 000</td></tr></table>
          <p><b>Bước 1 — sắp xếp:</b> 0, 0, 99, 100, 100, 101, 1 000 000.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bảng có 7 nguồn giá, với số minh hoạ. Bốn nguồn đúng báo 100, 101, 99 và 100. Ba nguồn sai, do hỏng hoặc gian lận, báo 0, 0 và 1 triệu. Bước một, sắp xếp cả bảy giá từ nhỏ tới lớn, được 0, 0, 99, 100, 100, 101, rồi 1 triệu."
      - show: |
          <p><b>Bước 2 — lấy ô giữa:</b> 7 số thì ô giữa là ô thứ $\frac{7 + 1}{2} = 4$ → trung vị $\hl{100}$, nằm giữa các giá trị đúng 99 và 101.</p>
        say: "Bước hai, lấy ô giữa của dãy đã sắp xếp, với 7 số thì ô giữa là ô thứ 7 cộng 1 chia 2, bằng ô thứ 4. Vậy trung vị bằng 100, nằm giữa hai giá trị đúng 99 và 101."
      - show: |
          <p><b>Bước 3 — so với trung bình:</b> tổng $= 1000400$, chia 7 ≈ $\hl{142914}$ — vô nghĩa, chỉ vì <b>một</b> nguồn báo 1 000 000.</p>
        say: "Bước ba, so với trung bình, tổng của bảy giá là 1000400, chia cho 7 được khoảng 142914, hoàn toàn vô nghĩa, chỉ vì một nguồn báo giá 1 triệu."
      - clear: true
        show: |
          <p><b>Bước 4 — giới hạn:</b> với 7 nguồn, chịu được $\lfloor \frac{6}{2} \rfloor = \hl{3}$ nguồn sai.</p>
          <table class="t"><tr><th>4 nguồn sai cùng báo 0</th><th>sắp xếp</th><th>trung vị</th></tr>
          <tr><td>đúng còn 99, 100, 101</td><td>0, 0, 0, <b>0</b>, 99, 100, 101</td><td>0 <b class="red">(sai)</b></td></tr></table>
        focus: [1, "2.2"]
        say: "Bước bốn, tìm giới hạn, với 7 nguồn thì cách này chịu được phần nguyên của 6 chia 2, bằng 3 nguồn sai. Thêm nguồn sai thứ tư thì trung vị có thể bị kéo đi, ví dụ bốn nguồn sai cùng báo 0, thì ô thứ 4 là 0, và trung vị bằng 0."

  - id: check
    kind: check
    title: "Tự kiểm: để máy đóng vai kẻ gian"
    checks:
      - "5 ** 3 == 125 and all(99 <= alg.median_oracle([100, 101, 99, 100] + list(b)) <= 101 for b in __import__('itertools').product([0, 50, 99.5, 10 ** 6, -10 ** 6], repeat=3))"
      - "5 ** 4 == 625 and min(alg.median_oracle([100, 101, 99] + list(b)) for b in __import__('itertools').product([0, 50, 99.5, 10 ** 6, -10 ** 6], repeat=4)) == -10 ** 6"
    steps:
      - show: |
          <p>Đường khác: không tin lập luận, cho máy <b>thử mọi cách gian</b>. Mỗi nguồn sai chọn một trong 5 giá: âm 1 000 000; 0; 50; 99,5; 1 000 000.</p>
          <table class="t"><tr><th>số nguồn sai</th><th>số cách thử</th><th>trung vị</th></tr>
          <tr><td>3 (cùng 4 nguồn đúng 99, 100, 100, 101)</td><td>$5^3 = 125$</td><td>luôn trong khoảng 99 tới 101 ✓</td></tr>
          <tr><td>4 (cùng 3 nguồn đúng 99, 100, 101)</td><td>$5^4 = 625$</td><td>kéo được tới âm 1 000 000 <b class="red">(sai)</b></td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.3"]
        say: "Kiểm bằng đường khác, ta không tin lập luận mà cho máy thử mọi cách gian lận. Mỗi nguồn sai được chọn một trong 5 giá, từ âm 1 triệu, 0, 50, 99 phẩy 5, tới 1 triệu. Bảng ghi kết quả của hai trường hợp. Với 3 nguồn sai, có 5 mũ 3 bằng 125 cách, và cách nào trung vị cũng nằm trong khoảng 99 tới 101. Với 4 nguồn sai, có 5 mũ 4 bằng 625 cách, và kẻ gian kéo được trung vị tới tận âm 1 triệu. Vậy ngưỡng thật là 3 nguồn sai, khớp với công thức, vì ô giữa chỉ bị chiếm khi có từ 4 nguồn sai trở lên."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Một nguồn dữ liệu duy nhất <b class="red">(điểm hỏng duy nhất)</b>
          <br><span class="note">Chuỗi phi tập trung mà giá lấy từ một máy chủ: ai chiếm được máy đó là điều khiển được hợp đồng. Nhiều nguồn độc lập, gộp bằng trung vị, có đặt cọc và phạt.</span></div>
        say: "Lỗi thứ nhất, chỉ dùng một nguồn dữ liệu, tức một điểm hỏng duy nhất. Chuỗi phi tập trung mà giá lại lấy từ một máy chủ, thì ai chiếm được máy đó là điều khiển được hợp đồng. Hãy dùng nhiều nguồn độc lập, gộp bằng trung vị, có đặt cọc và phạt."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nghĩ địa chỉ là ẩn danh <b class="red">(phân tích liên kết lộ danh tính)</b>
          <br><span class="note">Mọi giao dịch công khai vĩnh viễn. Gộp nhiều đầu vào (bài 4), tiền thừa, một lần nạp ở sàn có xác minh danh tính — đủ để nối địa chỉ với người thật. Dùng địa chỉ mới cho mỗi lần nhận; dữ liệu cá nhân thì <b>không</b> đưa lên chuỗi.</span></div>
        say: "Lỗi thứ hai, nghĩ địa chỉ là ẩn danh, trong khi phân tích liên kết có thể lộ danh tính. Mọi giao dịch công khai vĩnh viễn. Việc gộp nhiều đầu vào, tiền thừa, hay một lần nạp ở sàn có xác minh danh tính, là đủ để nối địa chỉ với người thật. Hãy dùng địa chỉ mới cho mỗi lần nhận, và không đưa dữ liệu cá nhân lên chuỗi."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Ghi dữ liệu cá nhân lên chuỗi rồi muốn xoá <b class="red">(không xoá được)</b>
          <br><span class="note">Luật bảo vệ dữ liệu cho người dân quyền yêu cầu xoá; chuỗi khối thì bất biến. Chỉ lưu mã băm hay cam kết lên chuỗi, dữ liệu thật để ngoài chuỗi nơi xoá được.</span></div>
        say: "Lỗi thứ ba, ghi dữ liệu cá nhân lên chuỗi rồi muốn xoá, trong khi không xoá được. Luật bảo vệ dữ liệu cho người dân quyền yêu cầu xoá, còn chuỗi khối thì bất biến. Hãy chỉ lưu mã băm hay cam kết lên chuỗi, còn dữ liệu thật thì để ngoài chuỗi, nơi xoá được."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(5 - 1) // 2 == 2 and alg.median_oracle([100, 101, 0, 0, 0]) == 0 and alg.median_oracle([100, 101, 99, 0, 0]) == 99"
      - "(7 - 1) // 2 == 3 and (9 - 1) // 2 == 4 and min(n for n in range(1, 30, 2) if (n - 1) // 2 >= 4) == 9 == 2 * 4 + 1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Dùng 5 nguồn, gộp bằng trung vị. Chịu được tối đa bao nhiêu nguồn sai?</td></tr>
          <tr><td>2</td><td>5 nguồn báo 100, 101, 0, 0, 0. Trung vị là gì, vì sao hỏng?</td></tr>
          <tr><td>3</td><td>Hợp đồng bảo hiểm muốn chịu được 4 nguồn sai. Cần ít nhất bao nhiêu nguồn (số lẻ)?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", "1.4", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, dùng 5 nguồn, gộp bằng trung vị, chịu được tối đa bao nhiêu nguồn sai? Câu hai, 5 nguồn báo 100, 101, 0, 0 và 0. Trung vị là gì, và vì sao hỏng? Câu ba, hợp đồng bảo hiểm muốn chịu được 4 nguồn sai, vậy cần ít nhất bao nhiêu nguồn, với số nguồn là số lẻ? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $n = 5$: $\lfloor \frac{5 - 1}{2} \rfloor = \lfloor 2 \rfloor = \hl{2}$ nguồn sai.</p>
          <p>② Sắp xếp 0, 0, <b>0</b>, 100, 101 → ô giữa thứ 3 → trung vị $\hl{0}$: có <b>3</b> nguồn sai, vượt giới hạn 2 — quá nửa số nguồn cùng sai thì trung vị cũng sai.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, với 5 nguồn, lấy phần nguyên của 5 trừ 1 chia 2, bằng 2 nguồn sai. Câu hai, sắp xếp lại được 0, 0, 0, 100, 101, và ô giữa là ô thứ 3, nên trung vị bằng 0. Lý do là có 3 nguồn sai, vượt giới hạn 2, và khi quá nửa số nguồn cùng sai thì trung vị cũng sai."
      - show: |
          <table class="t"><tr><th>③ số nguồn n</th><th>chịu được $\lfloor \frac{n - 1}{2} \rfloor$</th><th>đủ 4?</th></tr>
          <tr><td>7</td><td>3</td><td>chưa</td></tr>
          <tr><td>9</td><td>4</td><td>đủ → $n = \hl{9}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu ba, thử dần các số lẻ, vì công thức chịu được phần nguyên của n trừ 1 chia 2. Với 7 nguồn chỉ chịu được 3 nguồn sai, nên chưa đủ. Với 9 nguồn chịu được đúng 4 nguồn sai, nên cần ít nhất 9 nguồn, tức gấp đôi số nguồn sai rồi cộng thêm 1."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hợp đồng chỉ thấy dữ liệu trên chuỗi</span><span class="a">→</span>
          <span class="n">nhiều nguồn, gộp bằng trung vị</span><span class="a">→</span>
          <span class="n">công khai vĩnh viễn: không phải ẩn danh</span><span class="a">→</span>
          <span class="n">dữ liệu cá nhân ngoài chuỗi, chỉ lưu mã băm</span></div>
        say: "Tổng kết lại, hợp đồng chỉ thấy dữ liệu trên chuỗi, nên cần nhiều nguồn và gộp bằng trung vị. Sổ cái công khai vĩnh viễn không phải là ẩn danh, nên dữ liệu cá nhân để ngoài chuỗi, chỉ lưu mã băm."
      - show: |
          <div class="box key"><b>Tư duy:</b> một hệ chỉ an toàn bằng <b>mắt xích yếu nhất</b> — chuỗi khối mạnh tới đâu cũng không mạnh hơn dữ liệu đưa vào nó.</div>
        say: "Điều cần mang theo, một hệ chỉ an toàn bằng mắt xích yếu nhất, và chuỗi khối mạnh tới đâu cũng không mạnh hơn dữ liệu đưa vào nó."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>tình huống chuyên gia theo dòng thời gian</b> — nâng cấp một chuỗi khối đang chạy, từ sách trắng năm 2008 tới lúc một chuỗi lớn đổi hẳn cách đồng thuận năm 2022.</p>
        forward_ref: true
        say: "Bài sau, bài 12, là một tình huống chuyên gia theo dòng thời gian. Ta xem cách nâng cấp một chuỗi khối đang chạy, từ sách trắng năm 2008 tới lúc một chuỗi lớn đổi hẳn cách đồng thuận năm 2022, mà không dừng mạng. Hẹn gặp bạn ở bài tiếp theo."
