ect x="1060" y="100" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1090" y="100" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1120" y="100" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1150" y="100" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1180" y="100" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1210" y="100" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1240" y="100" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1270" y="100" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="820" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="850" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="880" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="910" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="940" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="970" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1000" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1030" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1060" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1090" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1120" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1150" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1180" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1210" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1240" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><rect x="1270" y="130" width="22" height="22" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><text x="1050" y="45" font-size="22" text-anchor="middle" fill="#eb6834">hàng nghìn giao dịch chạy ngoài chuỗi</text><line x1="1050" y1="160" x2="1050" y2="244" stroke="#1f2937" stroke-width="3" marker-end="url(#arB10)"/><rect x="860" y="250" width="110" height="60" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><rect x="1000" y="250" width="110" height="60" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><rect x="1008" y="258" width="8" height="44" fill="#eb6834"/><rect x="1020" y="258" width="8" height="44" fill="#eb6834"/><rect x="1032" y="258" width="8" height="44" fill="#eb6834"/><rect x="1044" y="258" width="8" height="44" fill="#eb6834"/><rect x="1056" y="258" width="8" height="44" fill="#eb6834"/><rect x="1068" y="258" width="8" height="44" fill="#eb6834"/><rect x="1080" y="258" width="8" height="44" fill="#eb6834"/><rect x="1092" y="258" width="8" height="44" fill="#eb6834"/><rect x="1140" y="250" width="110" height="60" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="1055" y="350" font-size="22" text-anchor="middle" fill="#eb6834">gộp: vài byte mỗi giao dịch, cả lô trong một khối</text><text x="1460" y="240" font-size="20" text-anchor="end" fill="#6b7280">chuỗi gốc</text><text x="1460" y="200" font-size="20" text-anchor="end" fill="#6b7280">ngoài chuỗi</text></svg></div>
        focus: [1, 1, 1]
        say: "Hình chia làm hai tầng, phía trên đường đứt nét là việc làm ngoài chuỗi, phía dưới là các khối của chuỗi gốc. Bên trái, A và B trao tay nhau 1000 bản cân đối có chữ ký, nhưng chuỗi gốc chỉ thấy hai giao dịch, mở kênh và đóng kênh. Bên phải, hàng nghìn giao dịch chạy ngoài chuỗi được nén lại, mỗi giao dịch chỉ còn vài byte, và cả lô nằm gọn trong một khối."

  - id: example
    kind: example
    title: "Ba con số thông lượng"
    checks:
      - "round(alg.chain_tps(1e6, 250, 600), 1) == 6.7 and 1000 / 2 == 500 and round(250 / 12, 1) == 20.8 and round(alg.chain_tps(1e6, 12, 600), 1) == 138.9"
      - "10 ** 6 / 250 == 4000 and round(4000 / 600, 1) == 6.7 and 10 ** 6 // 12 == 83333 and round(83333 / 600, 1) == 138.9"
    steps:
      - show: |
          <p><b>Bước 1 — mỗi khối chứa bao nhiêu giao dịch:</b> $\frac{10^6 \text{ byte}}{250 \text{ byte}} = \hl{4000}$ giao dịch.</p>
        say: "Bước một, với số minh hoạ, tính xem mỗi khối chứa được bao nhiêu giao dịch. Một khối có một triệu byte, mỗi giao dịch 250 byte, nên một khối chứa 10 mũ 6 chia 250, bằng 4000 giao dịch."
      - show: |
          <p><b>Bước 2 — chia cho thời gian giữa hai khối:</b> $\frac{4000}{600} \approx \hl{6{,}7}$ giao dịch mỗi giây.</p>
        say: "Bước hai, cứ 600 giây mới có một khối, nên chia 4000 cho 600, được khoảng 6 phẩy 7 giao dịch mỗi giây. Giống xe buýt, sức chứa mỗi chuyến chia thời gian giữa hai chuyến."
      - show: |
          <p><b>Bước 3 — kênh thanh toán</b>, 1000 lần trả giữa hai bên:</p>
          <table class="t"><tr><th></th><th>giao dịch trên chuỗi</th></tr><tr><td>không có kênh</td><td>1000</td></tr><tr><td>có kênh (mở, đóng)</td><td>2</td></tr></table>
          <p>$\frac{1000}{2} = \hl{500}$ lần ít hơn.</p>
        focus: [2, 3]
        say: "Bước ba, với kênh thanh toán, hai bên trả cho nhau 1000 lần nhưng chuỗi gốc chỉ thấy 2 giao dịch, mở kênh và đóng kênh. Vậy số giao dịch trên chuỗi ít hơn 1000 chia 2, bằng 500 lần."
      - show: |
          <p><b>Bước 4 — gộp giao dịch:</b> mỗi giao dịch còn 12 byte trên chuỗi → một khối chứa $\frac{10^6}{12} \approx 83333$ giao dịch → $\frac{83333}{600} \approx \hl{138{,}9}$ giao dịch mỗi giây.</p>
        say: "Bước bốn, với gộp giao dịch, mỗi giao dịch chỉ còn 12 byte trên chuỗi. Khi đó một khối chứa 10 mũ 6 chia 12, khoảng 83333 giao dịch, nên thông lượng là 83333 chia 600, khoảng 138 phẩy 9 giao dịch mỗi giây."
      - clear: true
        show: |
          <p><b>Bước 5 — đặt cạnh nhau:</b></p>
          <table class="t"><tr><th>cách (số minh hoạ)</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>chuỗi gốc: khối 1 MB / 600 s, giao dịch 250 byte</td><td>$\frac{10^6}{250 \cdot 600}$</td><td>≈ $\hl{6{,}7}$ giao dịch mỗi giây</td></tr>
          <tr><td>kênh: 1000 lần trả giữa hai bên</td><td>$\frac{1000}{2}$</td><td>ít hơn 500 lần số giao dịch trên chuỗi</td></tr>
          <tr><td>gộp: mỗi giao dịch còn 12 byte trên chuỗi</td><td>$\frac{10^6}{12 \cdot 600}$</td><td>≈ 138,9 giao dịch mỗi giây (gấp ≈ 20,8 lần)</td></tr></table>
        focus: [2, "2.2", "2.3", "2.4"]
        say: "Bước năm, đặt ba con số cạnh nhau với số minh hoạ. Chuỗi gốc có khối 1 MB mỗi 600 giây, giao dịch 250 byte, nên thông lượng bằng 10 mũ 6 chia 250 nhân 600, khoảng 6 phẩy 7 giao dịch mỗi giây. Kênh thanh toán với 1000 lần trả giữa hai bên chỉ cần 2 giao dịch trên chuỗi, ít hơn 500 lần. Gộp giao dịch để mỗi giao dịch chỉ còn 12 byte trên chuỗi, thì thông lượng khoảng 138 phẩy 9 giao dịch mỗi giây, gấp khoảng 20 phẩy 8 lần."


  - id: check
    kind: check
    title: "Tự kiểm: đếm theo ngày, và so tỉ lệ"
    checks:
      - "24 * 3600 == 86400 and 86400 // 600 == 144 and 4000 * 144 == 576000 and round(alg.chain_tps(1e6, 250, 600) * 86400) == 576000"
      - "round(alg.chain_tps(1e6, 12, 600) / alg.chain_tps(1e6, 250, 600), 1) == 20.8 == round(250 / 12, 1)"
    steps:
      - show: |
          <table class="t"><tr><th>đường</th><th>phép tính</th><th>giao dịch mỗi ngày</th></tr>
          <tr><td>đếm khối</td><td>một ngày $\frac{86400}{600} = 144$ khối, mỗi khối 4000</td><td>$144 \cdot 4000 = \hl{576000}$</td></tr>
          <tr><td>từ thông lượng</td><td>$\frac{10^6}{250 \cdot 600}$ nhân 86400 giây</td><td>576000 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, ta đếm theo ngày thay vì theo giây. Một ngày có 86400 giây, chia 600 được 144 khối, mỗi khối 4000 giao dịch, nên một ngày có 144 nhân 4000, bằng 576000 giao dịch. Lấy thông lượng nhân với 86400 giây cũng ra đúng 576000, nên hai đường khớp nhau."
      - show: |
          <table class="t"><tr><th></th><th>cỡ giao dịch trên chuỗi</th><th>thông lượng</th></tr>
          <tr><td>chuỗi gốc</td><td>250 byte</td><td>6,7</td></tr>
          <tr><td>gộp giao dịch</td><td>12 byte</td><td>138,9</td></tr>
          <tr><td>tỉ lệ</td><td>$\frac{250}{12} \approx 20{,}8$</td><td>tính lại bằng máy: 20,8 ✓</td></tr></table>
        focus: [1, "1.4"]
        say: "Kiểm thêm tỉ lệ, vì kích thước khối và thời gian giữa hai khối không đổi, chỉ cỡ giao dịch đổi từ 250 xuống 12 byte. Nên thông lượng phải tăng đúng 250 chia 12, khoảng 20 phẩy 8 lần, và tính lại bằng máy cũng ra 20 phẩy 8."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chỉ tăng kích thước khối <b class="red">(đánh đổi phi tập trung)</b>
          <br><span class="note">Khối lớn hơn cần băng thông, ổ đĩa, sức tính lớn hơn để chạy một nút đầy đủ — ít người chạy được, mạng tập trung về vài bên lớn. Đó chính là điều chuỗi khối muốn tránh.</span></div>
        say: "Lỗi thứ nhất, chỉ tăng kích thước khối, đổi lấy việc mất phi tập trung. Khối lớn hơn cần băng thông, ổ đĩa và sức tính lớn hơn để chạy một nút đầy đủ, nên ít người chạy được, và mạng tập trung về vài bên lớn. Đó chính là điều mà chuỗi khối muốn tránh."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên điều kiện an toàn của kênh <b class="red">(phải theo dõi chuỗi)</b>
          <br><span class="note">Bên kia có thể đưa lên một bản cân đối <b>cũ</b> có lợi cho họ. Mỗi bên (hoặc dịch vụ canh thay) phải theo dõi chuỗi và phản đối kịp trong thời hạn quy định.</span></div>
        say: "Lỗi thứ hai, quên điều kiện an toàn của kênh, vì mỗi bên phải theo dõi chuỗi. Bên kia có thể đưa lên một bản cân đối cũ có lợi cho họ. Mỗi bên, hoặc một dịch vụ canh thay, phải theo dõi chuỗi và phản đối kịp trong thời hạn quy định."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tin bên gom giao dịch như ngân hàng <b class="red">(kiểm cơ chế thoát)</b>
          <br><span class="note">Nếu bên gom ngừng hoạt động hay kiểm duyệt, người dùng có tự rút tiền về chuỗi gốc được không, mất bao lâu? Đó là câu hỏi an toàn quan trọng nhất của một hệ gộp giao dịch.</span></div>
        say: "Lỗi thứ ba, tin bên gom giao dịch như tin một ngân hàng, mà quên kiểm cơ chế thoát. Nếu bên gom ngừng hoạt động hay kiểm duyệt, người dùng có tự rút tiền về chuỗi gốc được không, và mất bao lâu? Đó là câu hỏi an toàn quan trọng nhất của một hệ gộp giao dịch."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.chain_tps(4e6, 400, 600), 1) == 16.7 and 50 / 2 == 25"
      - "4 * 10 ** 6 / 400 == 10000 and round(10000 / 600, 1) == 16.7"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Khối 4 MB mỗi 600 s, giao dịch trung bình 400 byte. Thông lượng bao nhiêu?</td></tr>
          <tr><td>2</td><td>Hai cửa hàng trao nhau 50 lần thanh toán mỗi ngày qua một kênh. Số giao dịch trên chuỗi giảm bao nhiêu lần (mỗi ngày mở và đóng kênh một lần)?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, khối 4 MB mỗi 600 giây, giao dịch trung bình 400 byte. Thông lượng là bao nhiêu? Câu hai, hai cửa hàng trao nhau 50 lần thanh toán mỗi ngày qua một kênh. Số giao dịch trên chuỗi giảm bao nhiêu lần, biết mỗi ngày mở và đóng kênh một lần? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Mỗi khối: $\frac{4 \cdot 10^6}{400} = 10000$ giao dịch.</p>
          <p>Mỗi giây: $\frac{10000}{600} \approx \hl{16{,}7}$ giao dịch.</p>
        focus: [1, 2]
        say: "Đáp án câu một, làm hai bước như ví dụ. Mỗi khối chứa 4 nhân 10 mũ 6 chia 400, bằng 10000 giao dịch, rồi chia cho 600 giây, được khoảng 16 phẩy 7 giao dịch mỗi giây."
      - show: |
          <p>② Không có kênh: 50 giao dịch trên chuỗi mỗi ngày. Có kênh: chỉ 2 (mở, đóng).</p>
          <p>$\frac{50}{2} = \hl{25}$ lần ít hơn. Giữ kênh mở lâu hơn thì giảm nhiều hơn nữa.</p>
        focus: [1, 2, 2]
        say: "Câu hai, không có kênh thì mỗi ngày có 50 giao dịch trên chuỗi, còn có kênh thì chỉ 2 giao dịch mở và đóng. Vậy số giao dịch trên chuỗi giảm 50 chia 2, bằng 25 lần. Giữ kênh mở lâu hơn thì còn giảm nhiều hơn nữa."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">thông lượng = khối chia (giao dịch nhân thời gian)</span><span class="a">→</span>
          <span class="n">khối to hơn: ít người chạy nút</span><span class="a">→</span>
          <span class="n">kênh, gộp giao dịch: xử lý ngoài, chốt trên chuỗi</span><span class="a">→</span>
          <span class="n">an toàn nhờ chuỗi gốc; kiểm cơ chế thoát</span></div>
        say: "Tổng kết lại, thông lượng bằng kích thước khối chia kích thước giao dịch nhân thời gian. Khối to hơn thì ít người chạy nút, nên kênh và gộp giao dịch xử lý ngoài chuỗi rồi chốt trên chuỗi. An toàn đến từ chuỗi gốc, và hãy kiểm cơ chế thoát."
      - show: |
          <div class="box key"><b>Tư duy:</b> đừng bắt tầng an toàn nhất làm <b>mọi việc</b> — để nó làm trọng tài, và cho việc hằng ngày chạy ở tầng nhanh hơn.</div>
        say: "Điều cần mang theo, đừng bắt tầng an toàn nhất làm mọi việc, hãy để nó làm trọng tài, và cho việc hằng ngày chạy ở tầng nhanh hơn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): <b>nguồn dữ liệu ngoài</b>, quyền riêng tư và giới hạn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta học nguồn dữ liệu ngoài, quyền riêng tư, và các giới hạn. Hẹn gặp bạn ở bài tiếp theo."
