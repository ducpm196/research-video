scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bảy giao dịch mỗi giây"
    checks:
      - "round(alg.chain_tps(1e6, 250, 600), 1) == 6.7"
    steps:
      - show: |
          <p>Một mạng thanh toán thẻ xử lý hàng nghìn giao dịch mỗi giây. Một chuỗi khối với khối 1 MB mỗi 10 phút, giao dịch trung bình 250 byte, chỉ được khoảng <b>6,7 giao dịch mỗi giây</b> — cho cả thế giới. Tăng kích thước khối là xong? Không đơn giản vậy.</p>
          <div class="box key">Hôm nay: <b>mở rộng</b> — giới hạn thông lượng của chuỗi gốc (chuỗi khối chính mà mọi người dùng), và hai cách xử lý ngoài chuỗi rồi chốt trên chuỗi.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, một mạng thanh toán thẻ xử lý hàng nghìn giao dịch mỗi giây. Một chuỗi khối với khối 1 MB mỗi 10 phút, giao dịch trung bình 250 byte, chỉ được khoảng 6 phẩy 7 giao dịch mỗi giây, cho cả thế giới. Tăng kích thước khối là xong? Không đơn giản vậy. Hôm nay ta học cách mở rộng, giới hạn thông lượng của chuỗi gốc, tức chuỗi khối chính mà mọi người dùng, và hai cách xử lý ngoài chuỗi rồi chốt trên chuỗi."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: sức chứa chia thời gian, đổi đơn vị"
    checks:
      - "60 // 15 == 4 and 40 * 4 == 160 and 10 * 60 == 600 and 10 ** 6 == 1000000"
      - "8 * 10 ** 6 / 10 ** 7 == 0.8 and round(32 * 8 * 10 ** 6 / 10 ** 7, 1) == 25.6"
    steps:
      - show: |
          <p>Xe buýt 40 chỗ, 15 phút một chuyến: một giờ có $\frac{60}{15} = 4$ chuyến, chở tối đa $40 \cdot 4 = \hl{160}$ người mỗi giờ.</p>
          <div class="box key"><b>Thông lượng</b> = sức chứa mỗi chuyến chia thời gian giữa hai chuyến. Muốn chở nhiều hơn: xe to hơn, hoặc chạy dày hơn.</div>
        focus: [1, 1, 2]
        say: "Trước hết, ta xét một ví dụ đời thường về những chuyến xe buýt chở khách. Xe buýt 40 chỗ, cứ 15 phút một chuyến, nên một giờ có 60 chia 15, bằng 4 chuyến, chở tối đa 40 nhân 4, bằng 160 người mỗi giờ. Thông lượng chính là sức chứa mỗi chuyến chia cho thời gian giữa hai chuyến, nên muốn chở nhiều hơn thì phải dùng xe to hơn, hoặc cho xe chạy dày hơn."
      - show: |
          <table class="t"><tr><th>đơn vị</th><th>đổi ra</th></tr>
          <tr><td>1 MB (quy ước trong bài)</td><td>$10^6 = 1000000$ byte</td></tr>
          <tr><td>10 phút</td><td>$10 \cdot 60 = 600$ giây</td></tr>
          <tr><td>1 byte</td><td>8 bit</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Điều thứ hai, đổi đơn vị cho đúng trước khi chia. Trong bài này, 1 MB là 10 mũ 6, tức một triệu byte. Mười phút là 10 nhân 60, bằng 600 giây. Và mỗi byte gồm 8 bit, điều này dùng khi tính thời gian truyền qua mạng."
      - clear: true
        show: |
          <p><b>Thời gian truyền</b> = số bit chia tốc độ đường truyền, vì mỗi giây đường truyền chỉ đẩy đi được một số bit cố định. Đường 10 triệu bit mỗi giây:</p>
          <table class="t"><tr><th>khối</th><th>số bit</th><th>thời gian truyền</th></tr>
          <tr><td>1 MB</td><td>$8 \cdot 10^6$</td><td>0,8 giây</td></tr>
          <tr><td>32 MB</td><td>$32 \cdot 8 \cdot 10^6$</td><td>$\hl{25{,}6}$ giây</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Điều thứ ba, thời gian truyền bằng số bit chia cho tốc độ đường truyền, vì mỗi giây đường truyền chỉ đẩy đi được một số bit cố định. Với đường truyền 10 triệu bit mỗi giây, khối 1 MB có 8 triệu bit, truyền mất 0 phẩy 8 giây. Khối 32 MB thì mất tới 25 phẩy 6 giây, và truyền càng lâu thì càng dễ có hai khối ra cùng lúc, tạo nhánh như ở bài 6."
      - show: |
          <p>Ở bài 6: <b>nút</b> là một máy tham gia mạng, giữ một bản sao chuỗi và tự kiểm mọi khối. <b>Công</b> của một khối là số lần thử trung bình phải bỏ ra để tìm được khối đó; <b>tổng công</b> của một chuỗi là công của mọi khối cộng lại.</p>
          <p>Mỗi nút theo chuỗi có <b>tổng công lớn nhất</b>; giao dịch đã có nhiều khối xác nhận phía sau thì rất khó bị đảo. Hôm nay, chuỗi gốc sẽ đóng vai <b>trọng tài</b> cho những việc làm ở ngoài.</p>
        focus: [1, 1, 2, 2]
        say: "Điều cuối, nhắc lại bài 6, nút là một máy tham gia mạng, giữ một bản sao chuỗi và tự kiểm mọi khối. Công của một khối là số lần thử trung bình phải bỏ ra để tìm được khối đó, còn tổng công của một chuỗi là công của mọi khối cộng lại. Mỗi nút theo chuỗi có tổng công lớn nhất, và một giao dịch đã có nhiều khối xác nhận phía sau thì rất khó bị đảo ngược. Hôm nay, chuỗi gốc an toàn đó sẽ đóng vai trọng tài cho những việc được làm ở ngoài chuỗi."

  - id: sym
    kind: symbol
    title: "Giải mã: thông lượng và hai cách ra ngoài chuỗi"
    steps:
      - show: |
          <p><b>Thông lượng</b> = $\frac{\text{kích thước khối}}{\text{kích thước giao dịch} \cdot \text{thời gian giữa hai khối}}$.</p>
          <table class="t"><tr><th>cách</th><th>ý tưởng</th><th>trên chuỗi còn gì</th></tr>
          <tr><td><b>kênh thanh toán</b></td><td>hai bên khoá tiền vào một hợp đồng, rồi trao nhau các bản cân đối mới có chữ ký, ngoài chuỗi</td><td>2 giao dịch: mở và đóng kênh</td></tr>
          <tr><td><b>gộp giao dịch</b> (rollup)</td><td>một bên gom hàng nghìn giao dịch, chạy ngoài chuỗi, đưa lên dữ liệu nén cùng bằng chứng tính đúng — hoặc chờ một thời hạn để ai cũng nộp được bằng chứng gian lận</td><td>vài byte mỗi giao dịch + bằng chứng (hoặc thời hạn phản đối) cho cả lô</td></tr></table>
          <p>Cả hai giữ an toàn nhờ chuỗi gốc: ai gian lận thì bằng chứng được đưa lên chuỗi để phân xử.</p>
        focus: [1, 2, "2.2", "2.3", "2.3", "2.3", 3]
        say: "Thông lượng bằng kích thước khối chia cho kích thước giao dịch nhân thời gian giữa hai khối. Bảng so hai cách ra ngoài chuỗi. Kênh thanh toán cho hai bên khoá tiền vào một hợp đồng, rồi trao nhau các bản cân đối mới có chữ ký ở ngoài chuỗi, trên chuỗi chỉ còn 2 giao dịch mở và đóng kênh. Gộp giao dịch cho một bên gom hàng nghìn giao dịch, chạy ngoài chuỗi, rồi đưa lên dữ liệu nén cùng bằng chứng tính đúng. Cũng có cách chờ một thời hạn để ai cũng nộp được bằng chứng gian lận. Trên chuỗi chỉ còn vài byte mỗi giao dịch, cộng bằng chứng hay thời hạn phản đối cho cả lô. Cả hai giữ an toàn nhờ chuỗi gốc, ai gian lận thì bằng chứng được đưa lên chuỗi để phân xử."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Làm ở ngoài, chốt ở trong"
    steps:
      - show: |
