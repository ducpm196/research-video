id: L10
course: BCH
series: "BCH · Blockchain và sổ cái phân tán"
title: "Bài 10 — Mở rộng: giới hạn thông lượng, kênh thanh toán, gộp giao dịch"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/bch.yaml L10; audit/bch/verify_bch.py L10; J. Poon, T. Dryja, The Bitcoin Lightning Network (2016) — kênh thanh toán; V. Buterin, An Incomplete Guide to Rollups (2021); K. Croman và cộng sự, On Scaling Decentralized Blockchains (FC 2016); bài 6"
assumes: [arith, frac, cdot, approx]
# Quy ước: thông lượng = kích thước khối / kích thước giao dịch trung bình / thời gian giữa hai khối (alg.chain_tps); MB = 10^6 byte. Kênh thanh toán: 2 giao
#   dịch trên chuỗi (mở, đóng) cho mọi lần trả bên trong kênh. Gộp giao dịch: mỗi giao dịch chỉ để lại vài byte dữ liệu trên chuỗi. Số đo là SỐ MINH HOẠ.
objectives:
  - "Tính thông lượng giao dịch của chuỗi gốc"
  - "Giải thích ý tưởng xử lý ngoài chuỗi rồi chốt trên chuỗi"
  - "Thấy đánh đổi giữa thông lượng và phi tập trung"
