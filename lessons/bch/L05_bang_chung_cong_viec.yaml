id: L05
course: BCH
series: "BCH · Blockchain và sổ cái phân tán"
title: "Bài 5 — Bằng chứng công việc: độ khó và số lần thử kỳ vọng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/bch.yaml L05; audit/bch/verify_bch.py L05; A. Back, Hashcash (2002); S. Nakamoto (2008), mục 4; DMS (phân phối hình học: kỳ vọng 1/p); bài 1"
assumes: [arith, power, frac, approx, exp]
# Quy ước: “trúng” = SHA-256(tiêu đề | nonce) có k bit đầu bằng 0, xác suất mỗi lần thử p = 2^(−k), các lần thử độc lập; số lần thử có phân phối hình học,
#   kỳ vọng 1/p (alg.pow_mine chạy SHA-256 thật với tiêu đề “khoi-1”). P(chưa trúng sau m lần) = (1 − p)^m ≈ e^(−m p). Lời đọc nói “số dùng một lần” cho nonce.
objectives:
  - "Liên hệ độ khó với xác suất mỗi lần thử"
  - "Tính số lần thử kỳ vọng"
  - "Hiểu tính ngẫu nhiên của thời gian tìm khối"
asr_reviewed:
  - {sentence: "Mỗi bit đầu bằng 0 với xác suất một phần hai, 16 bit liền nhau thì nhân 16 lần, nên p bằng 2 mũ âm 16, tức 1 phần 65536.", reason: "ASR chép “Mỗi biết đầu bằng không với xác suốt 1 phần 2, 16 biết liền nhau thì nhân 16 lần, nên tề bằng 2 mũ âm 16, tức 1 phần 65.536.” (0.902): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: bit/biết, suất/suốt, bit/biết — NOT_VERIFIED bằng tai người"}
  - {sentence: "Xác suất chưa trúng sau đúng 2 mũ 16 lần là 1 trừ 2 mũ âm 16, mũ 65536, xấp xỉ 1 chia e, khoảng 0 phẩy 368.", reason: "ASR chép “Xác suất chưa trúng sau đúng 2 mũ 16 lần là 1 trừ 2 mũ âm 16, mũ 65536, sắp xỉ 1 GE, khoảng 0,368.” (0.914): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; “phẩy” của số thập phân, ASR viết dấu phẩy hoặc “phải”; lệch âm/thanh thuần Việt: xấp/sắp, chia (trong “chia e” → “ge”), không (trong “không phẩy” → “”) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Làm cho việc viết lại trở nên đắt"
    checks:
      - "alg.pow_mine(b'khoi-1', 16) == 50845 and 2 ** 16 == 65536"
    steps:
      - show: |
          <p>Ở bài 1, kẻ sửa chỉ cần vài mi li giây để tính lại mã cho cả chuỗi. Bây giờ thêm một luật: mỗi khối chỉ hợp lệ khi mã băm của nó bắt đầu bằng 16 bit 0. Không có cách nào ngoài <b>thử</b>: đổi một số trong tiêu đề, băm lại, kiểm. Trung bình 65 536 lần thử cho mỗi khối — và viết lại 10 khối là gấp 10 lần.</p>
          <div class="box key">Hôm nay: <b>bằng chứng công việc</b> — biến việc tạo khối thành việc tốn công đo được, và tính đúng số lần thử.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, ở bài 1, kẻ sửa chỉ cần vài mi li giây để tính lại mã cho cả chuỗi. Bây giờ thêm một luật, mỗi khối chỉ hợp lệ khi mã băm của nó bắt đầu bằng 16 bit 0. Không có cách nào ngoài thử, đổi một số trong tiêu đề, băm lại, rồi kiểm. Trung bình cần 65536 lần thử cho mỗi khối, và viết lại 10 khối là gấp 10 lần. Hôm nay ta học bằng chứng công việc, biến việc tạo khối thành một việc tốn công đo được, và tính đúng số lần thử."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa của 2, số lần thử trung bình, mã băm"
    checks:
      - "2 ** 4 == 16 and 2 ** 10 == 1024 and 2 ** 16 == 65536 and 2 ** -4 == 1 / 16 and 2 ** 17 == 2 * 2 ** 16"
      - "1 / (1 / 2) == 2 and round(1 / (1 / 6), 9) == 6"
      - "[__import__('hashlib').sha256(b'khoi-1|' + str(n).encode()).hexdigest()[:12] for n in (0, 1)] == ['e05d5ae3c605', 'c6253bdc494c']"
    steps:
      - show: |
          <table class="t"><tr><th>lũy thừa</th><th>giá trị</th></tr>
          <tr><td>$2^4$</td><td>16</td></tr>
          <tr><td>$2^{10}$</td><td>1024</td></tr>
          <tr><td>$2^{16}$</td><td>65 536</td></tr>
          <tr><td>$2^{-4} = \frac{1}{2^4}$</td><td>$\frac{1}{16}$</td></tr></table>
        focus: [0, "1.2", "1.4", "1.5"]
        say: "Trước hết, ôn lũy thừa của 2, vì độ khó được đo bằng số bit. Mỗi lần số mũ tăng thêm 1 thì giá trị gấp đôi, 2 mũ 4 bằng 16, 2 mũ 10 bằng 1024. Cứ thế lên tới 2 mũ 16, bằng 65536. Số mũ âm nghĩa là lấy 1 chia, 2 mũ âm 4 bằng 1 chia 2 mũ 4, tức là 1 phần 16."
      - show: |
          <table class="t"><tr><th>thử tới khi thành công</th><th>xác suất mỗi lần</th><th>trung bình số lần</th></tr>
          <tr><td>tung đồng xu tới khi ra mặt ngửa</td><td>$\frac{1}{2}$</td><td>2</td></tr>
          <tr><td>gieo xúc xắc tới khi ra mặt 6</td><td>$\frac{1}{6}$</td><td>6</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Ở khoá Toán rời rạc, phần xác suất, ta đã gặp quy tắc này, cứ thử tới khi thành công, mỗi lần thành công với xác suất p, thì trung bình cần 1 chia p lần. Tung đồng xu tới khi ra mặt ngửa, xác suất một phần hai, nên trung bình 2 lần. Gieo xúc xắc tới khi ra mặt 6, xác suất một phần sáu, nên trung bình 6 lần."
      - clear: true
        show: |
          <table class="t"><tr><th>đầu vào</th><th>12 chữ số đầu của mã băm (hệ 16)</th></tr>
          <tr><td>khoi-1 | 0</td><td>e05d5ae3c605</td></tr>
          <tr><td>khoi-1 | 1</td><td>c6253bdc494c</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Ở bài 1, ta đã thấy mã băm đổi hẳn khi đầu vào đổi một chút, và kẻ sửa chỉ mất vài mi li giây để tính lại mã cho cả chuỗi. Bảng này băm tiêu đề khoi 1 ghép với số 0, mã bắt đầu bằng chữ e. Đổi số 0 thành số 1, mã đổi hẳn, không cách nào đoán trước được."

  - id: sym
    kind: symbol
    title: "Giải mã: số dùng một lần, độ khó, xác suất"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>số dùng một lần</b> (nonce)</td><td>một số trong tiêu đề khối, đổi mỗi lần thử</td></tr>
          <tr><td><b>độ khó</b> k bit</td><td>mã băm phải bắt đầu bằng k bit 0</td></tr>
          <tr><td>xác suất mỗi lần thử</td><td>$p = 2^{-k}$ — hàm băm cho kết quả như ngẫu nhiên đều</td></tr>
          <tr><td><b>số lần thử kỳ vọng</b></td><td>$\frac{1}{p} = 2^k$ (phân phối hình học)</td></tr></table>
          <p>Kiểm thì rẻ: <b>một</b> lần băm là biết khối hợp lệ. Tạo thì đắt: trung bình $2^k$ lần băm. Mạng điều chỉnh k để thời gian giữa hai khối gần một mục tiêu.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Bảng có bốn khái niệm. Số dùng một lần là một số trong tiêu đề khối, đổi mỗi lần thử. Độ khó k bit nghĩa là mã băm phải bắt đầu bằng k bit 0. Xác suất mỗi lần thử trúng là 2 mũ âm k, vì hàm băm cho kết quả như ngẫu nhiên đều. Số lần thử kỳ vọng là 1 chia p, bằng 2 mũ k, theo phân phối hình học. Kiểm thì rẻ, chỉ một lần băm là biết khối hợp lệ. Tạo thì đắt, trung bình 2 mũ k lần băm, và mạng điều chỉnh k để thời gian giữa hai khối gần một mục tiêu."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi lần thử là một lần gieo vào 16 ô"
    checks:
      - "alg.pow_mine(b'khoi-1', 4) == 11 and ''.join(__import__('hashlib').sha256(b'khoi-1|' + str(n).encode()).hexdigest()[0] for n in range(11)) == 'ec96d96a5e0'"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><rect x="110" y="250" width="80" height="60" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="150" y="290" font-size="24" text-anchor="middle" fill="#1f2937">0</text><rect x="190" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="230" y="290" font-size="24" text-anchor="middle" fill="#1f2937">1</text><rect x="270" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="310" y="290" font-size="24" text-anchor="middle" fill="#1f2937">2</text><rect x="350" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="390" y="290" font-size="24" text-anchor="middle" fill="#1f2937">3</text><rect x="430" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="470" y="290" font-size="24" text-anchor="middle" fill="#1f2937">4</text><rect x="510" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="550" y="290" font-size="24" text-anchor="middle" fill="#1f2937">5</text><rect x="590" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="630" y="290" font-size="24" text-anchor="middle" fill="#1f2937">6</text><rect x="670" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="710" y="290" font-size="24" text-anchor="middle" fill="#1f2937">7</text><rect x="750" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="790" y="290" font-size="24" text-anchor="middle" fill="#1f2937">8</text><rect x="830" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="870" y="290" font-size="24" text-anchor="middle" fill="#1f2937">9</text><rect x="910" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="950" y="290" font-size="24" text-anchor="middle" fill="#1f2937">a</text><rect x="990" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="1030" y="290" font-size="24" text-anchor="middle" fill="#1f2937">b</text><rect x="1070" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="1110" y="290" font-size="24" text-anchor="middle" fill="#1f2937">c</text><rect x="1150" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="1190" y="290" font-size="24" text-anchor="middle" fill="#1f2937">d</text><rect x="1230" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="1270" y="290" font-size="24" text-anchor="middle" fill="#1f2937">e</text><rect x="1310" y="250" width="80" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="1350" y="290" font-size="24" text-anchor="middle" fill="#1f2937">f</text><circle cx="1270" cy="215" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="1270" y="223" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">1</text><circle cx="1110" cy="215" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="1110" y="223" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">2</text><circle cx="870" cy="215" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="870" y="223" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">3</text><circle cx="630" cy="215" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="630" y="223" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">4</text><circle cx="1190" cy="215" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="1190" y="223" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">5</text><circle cx="870" cy="163" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="870" y="171" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">6</text><circle cx="630" cy="163" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="630" y="171" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">7</text><circle cx="950" cy="215" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="950" y="223" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">8</text><circle cx="550" cy="215" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="550" y="223" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">9</text><circle cx="1270" cy="163" r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="1270" y="171" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a78d6">10</text><circle cx="150" cy="215" r="22" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="150" y="223" font-size="20" font-weight="bold" text-anchor="middle" fill="#059669">11</text><g font-size="22" fill="#1f2937"><text x="110" y="40">số trong vòng tròn = lần thử thứ mấy (tiêu đề khoi-1, độ khó 4 bit)</text><text x="150" y="345" text-anchor="middle" fill="#059669" font-weight="bold">trúng</text><text x="750" y="345" text-anchor="middle">16 ô = chữ số hệ 16 đầu tiên của mã băm = 4 bit đầu</text><text x="750" y="385" text-anchor="middle" fill="#059669">chỉ ô 0 là trúng: xác suất 1/16 mỗi lần thử</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình minh hoạ với độ khó nhỏ là 4 bit 0, tức chữ số hệ 16 đầu tiên của mã băm phải bằng 0. Mỗi lần thử, mã băm rơi như ngẫu nhiên vào một trong 16 ô, và chỉ ô đầu màu xanh lá là trúng, nên xác suất mỗi lần là 1 phần 16. Với tiêu đề khoi 1, mười lần thử đầu rơi vào các ô khác, có ô bị rơi vào hai lần, và phải tới lần thử thứ 11 mới rơi vào ô 0. Không có cách nào nhắm thẳng vào ô xanh, chỉ có cách thử tiếp, vì thế ta gọi đây là bằng chứng công việc."

  - id: example
    kind: example
    title: "Đào thật một khối 16 bit"
    checks:
      - "alg.pow_mine(b'khoi-1', 16) == 50845 and round((1 - 2 ** -16) ** 65536, 4) == 0.3679 and round(math.exp(-1), 4) == 0.3679"
      - "[alg.pow_mine(f'khoi-{k}'.encode(), 12) for k in range(1, 9)] == [2179, 3761, 7526, 570, 10349, 2386, 3372, 2053]"
      - "2 ** -16 == 1 / 65536 and 1 / 2 ** -16 == 65536 and 2 ** 12 == 4096 and round(10349 / 570, 1) == 18.2 and round(50845 / 65536, 2) == 0.78"
    steps:
      - show: |
          <p><b>Bước 1 — xác suất mỗi lần thử</b> với độ khó 16 bit:</p>
          $$p = 2^{-16} = \frac{1}{65\,536}$$
        focus: [1, 2]
        say: "Bước một, tính xác suất mỗi lần thử với độ khó 16 bit. Mỗi bit đầu bằng 0 với xác suất một phần hai, 16 bit liền nhau thì nhân 16 lần, nên p bằng 2 mũ âm 16, tức 1 phần 65536."
      - show: |
          <p><b>Bước 2 — số lần thử kỳ vọng</b>, theo quy tắc “trung bình 1 chia p”:</p>
          $$\frac{1}{p} = 2^{16} = \hl{65\,536}$$
        focus: [1, 2]
        say: "Bước hai, theo quy tắc thử tới khi thành công ở phần chuẩn bị, số lần thử kỳ vọng bằng 1 chia p. Vậy trung bình cần 2 mũ 16, bằng 65536 lần thử cho một khối."
      - show: |
          <table class="t"><tr><th>bước 3 — chạy thật (hàm băm 256 bit)</th><th>kết quả</th></tr>
          <tr><td>tiêu đề “khoi-1”, 16 bit 0, kỳ vọng 65 536</td><td>trúng ở lần thứ $\hl{50\,845}$</td></tr>
          <tr><td>so với kỳ vọng: $\frac{50\,845}{65\,536}$</td><td>≈ 0,78 lần kỳ vọng</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bước ba, chạy thật với hàm băm hai trăm năm mươi sáu bit. Với tiêu đề khoi 1 và 16 bit 0, máy trúng ở lần thử thứ 50845. Con số này bằng khoảng 0 phẩy 78 lần kỳ vọng, sớm hơn trung bình một chút, và điều đó hoàn toàn bình thường."
      - clear: true
        show: |
          <table class="t"><tr><th>bước 4 — 12 bit 0, kỳ vọng $2^{12} = 4096$</th><th>số lần thử</th></tr>
          <tr><td>8 tiêu đề khác nhau</td><td>2179, 3761, 7526, 570, 10 349, 2386, 3372, 2053</td></tr>
          <tr><td>lâu nhất chia nhanh nhất: $\frac{10\,349}{570}$</td><td>≈ 18 lần</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bước bốn, hạ độ khó xuống 12 bit, kỳ vọng là 2 mũ 12, bằng 4096 lần, rồi đào tám tiêu đề khác nhau. Số lần thử chạy từ 570 tới 10349. Lấy lâu nhất chia nhanh nhất, 10349 chia 570, được khoảng 18 lần, nên cùng độ khó mà thời gian chênh nhau rất xa, đúng tính chất của phân phối hình học."
      - show: |
          <p><b>Bước 5 — xác suất chưa trúng sau đúng $2^{16}$ lần</b>, mỗi lần trượt với xác suất $1 - 2^{-16}$:</p>
          $$(1 - 2^{-16})^{65\,536} \approx \frac{1}{e} \approx \hl{0{,}368}$$
        focus: [1, 2]
        say: "Bước năm, mỗi lần thử trượt với xác suất 1 trừ 2 mũ âm 16, và các lần thử độc lập, nên ta nhân xác suất trượt 65536 lần với nhau. Xác suất chưa trúng sau đúng 2 mũ 16 lần là 1 trừ 2 mũ âm 16, mũ 65536, xấp xỉ 1 chia e, khoảng 0 phẩy 368."

  - id: check
    kind: check
    title: "Tự kiểm: đào thật 300 khối và đếm"
    checks:
      - "round(sum([2179, 3761, 7526, 570, 10349, 2386, 3372, 2053]) / 8) == 4024 and sum([2179, 3761, 7526, 570, 10349, 2386, 3372, 2053]) == 32196"
      - "(lambda tr: round(sum(tr) / 300) == 1064 and sum(1 for x in tr if x > 1024) == 114 and sum(1 for x in tr if x > 2048) == 39)([alg.pow_mine(f'mc-{k}'.encode(), 10) for k in range(300)])"
      - "round(114 / 300, 2) == 0.38 and round(39 / 300, 2) == 0.13 and round(math.exp(-1), 3) == 0.368 and round(math.exp(-2), 3) == 0.135 and 2 ** 10 == 1024 and 2 * 1024 == 2048"
    steps:
      - show: |
          <table class="t"><tr><th>đếm lại bằng thí nghiệm</th><th>đo được</th><th>lý thuyết</th></tr>
          <tr><td>trung bình 8 tiêu đề ở bước 4: $\frac{32\,196}{8}$</td><td>≈ 4024</td><td>4096</td></tr>
          <tr><td>300 khối, 10 bit 0: trung bình số lần thử</td><td>≈ 1064</td><td>$2^{10} = 1024$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, ta không tin công thức mà đào thật rồi đếm. Tám tiêu đề ở bước bốn có tổng 32196 lần thử, chia 8 được khoảng 4024, nên trung bình đo được gần với kỳ vọng 4096. Đào thêm 300 khối với 10 bit 0, trung bình mỗi khối mất khoảng 1064 lần thử, gần với 2 mũ 10 bằng 1024."
      - show: |
          <table class="t"><tr><th>300 khối, 10 bit 0</th><th>tỉ lệ đo được</th><th>công thức</th></tr>
          <tr><td>chưa trúng sau 1024 lần</td><td>$\frac{114}{300} \approx 0{,}38$</td><td>$\frac{1}{e} \approx 0{,}368$</td></tr>
          <tr><td>chưa trúng sau 2048 lần</td><td>$\frac{39}{300} \approx 0{,}13$</td><td>$e^{-2} \approx 0{,}135$</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Đếm tiếp trong 300 khối đó, có 114 khối chưa trúng sau 1024 lần, tỉ lệ khoảng 0 phẩy 38, gần với 1 chia e, khoảng 0 phẩy 368 như bước năm. Có 39 khối chưa trúng sau 2048 lần, tỉ lệ khoảng 0 phẩy 13, gần với e mũ âm 2, khoảng 0 phẩy 135. Thí nghiệm và công thức khớp nhau, chỉ lệch vài phần trăm do số khối có hạn."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đoán độ khó từ một lần trúng <b class="red">(một mẫu hình học rất nhiễu)</b>
          <br><span class="note">Trúng ở lần 570 không có nghĩa độ khó thấp. Ước lượng sức tính hay độ khó phải lấy trung bình trên nhiều khối.</span></div>
        say: "Lỗi thứ nhất, đoán độ khó từ một lần trúng, trong khi một mẫu hình học rất nhiễu. Trúng ở lần 570 không có nghĩa là độ khó thấp. Ước lượng sức tính hay độ khó phải lấy trung bình trên nhiều khối."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tưởng “thử lâu rồi thì sắp trúng” <b class="red">(không có trí nhớ)</b>
          <br><span class="note">Mỗi lần thử độc lập: đã thử 60 000 lần mà chưa trúng thì số lần còn phải thử vẫn kỳ vọng 65 536. Phân phối hình học không có trí nhớ.</span></div>
        say: "Lỗi thứ hai, tưởng thử lâu rồi thì sắp trúng, trong khi quá trình không có trí nhớ. Mỗi lần thử độc lập, đã thử 60 nghìn lần mà chưa trúng thì số lần còn phải thử vẫn kỳ vọng 65536. Phân phối hình học không có trí nhớ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên cái giá của an toàn <b class="red">(điện năng là có thật)</b>
          <br><span class="note">An toàn của bằng chứng công việc <b>chính là</b> lượng tính toán bỏ ra — tức điện năng. Đó là lý do nhiều chuỗi mới chọn cơ chế khác, dựa trên cổ phần thay vì tính toán.</span></div>
        say: "Lỗi thứ ba, quên cái giá của an toàn, vì điện năng là có thật. An toàn của bằng chứng công việc chính là lượng tính toán bỏ ra, tức điện năng. Đó là lý do nhiều chuỗi mới chọn cơ chế khác, dựa trên cổ phần thay vì tính toán."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "2 ** 20 == 1048576 and round(2 ** 20 / 1e6, 2) == 1.05 and round(1 - math.exp(-2), 3) == 0.865"
      - "2 ** 20 // 2 ** 16 == 16 and round(math.exp(-2), 3) == 0.135 and round(math.exp(-2) * 100, 1) == 13.5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Độ khó tăng lên 20 bit. Số lần thử kỳ vọng? Máy băm một triệu lần mỗi giây thì mất trung bình bao lâu?</td></tr>
          <tr><td>2</td><td>Xác suất trúng trong vòng gấp đôi số lần kỳ vọng là bao nhiêu (dùng $e^{-x}$)?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, độ khó tăng lên 20 bit. Số lần thử kỳ vọng là bao nhiêu, và máy băm một triệu lần mỗi giây thì mất trung bình bao lâu? Câu hai, xác suất trúng trong vòng gấp đôi số lần kỳ vọng là bao nhiêu, dùng e mũ âm x? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Bước một, số lần thử kỳ vọng: $2^{20} = 1\,048\,576$ lần (thêm 1 bit là gấp đôi).</p>
          <p>Bước hai, chia cho tốc độ: $\frac{1\,048\,576}{1\,000\,000} \approx \hl{1{,}05}$ giây.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, bước một, số lần thử kỳ vọng là 2 mũ 20, bằng 1 triệu 48 nghìn 576 lần. Thêm 1 bit độ khó là gấp đôi số lần, nên 20 bit gấp 16 lần so với 16 bit. Bước hai, chia cho tốc độ một triệu lần mỗi giây, mất khoảng 1 phẩy 05 giây."
      - show: |
          <p>② Bước một, chưa trúng sau gấp đôi kỳ vọng: $e^{-2} \approx 0{,}135$.</p>
          <p>Bước hai, đã trúng: $1 - e^{-2} \approx \hl{0{,}865}$ — vẫn còn khoảng 13,5% khả năng phải thử lâu hơn nữa.</p>
        focus: [1, 2, 2]
        say: "Câu hai, bước một, theo cùng cách tính với bước năm của ví dụ, xác suất chưa trúng sau gấp đôi số lần kỳ vọng là e mũ âm 2, khoảng 0 phẩy 135. Bước hai, xác suất đã trúng là phần còn lại, 1 trừ e mũ âm 2, khoảng 0 phẩy 865. Vậy vẫn còn khoảng 13 phẩy 5 phần trăm khả năng phải thử lâu hơn nữa."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">k bit 0: mỗi lần trúng với xác suất $2^{-k}$</span><span class="a">→</span>
          <span class="n">kỳ vọng $2^k$ lần thử, phân phối hình học</span><span class="a">→</span>
          <span class="n">kiểm rẻ, tạo đắt</span><span class="a">→</span>
          <span class="n">viết lại n khối tốn n lần công</span></div>
        say: "Tổng kết lại, với k bit 0, mỗi lần thử trúng với xác suất 2 mũ âm k, nên kỳ vọng 2 mũ k lần thử, theo phân phối hình học. Kiểm thì rẻ, tạo thì đắt, và viết lại n khối tốn n lần công."
      - show: |
          <div class="box key"><b>Tư duy:</b> an toàn ở đây được <b>mua bằng chi phí</b> — kẻ tấn công phải bỏ ra nhiều hơn cái họ có thể lấy được.</div>
        say: "Điều cần mang theo, an toàn ở đây được mua bằng chi phí, kẻ tấn công phải bỏ ra nhiều hơn cái họ có thể lấy được."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>đồng thuận theo chuỗi nhiều công nhất</b> và số xác nhận.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học đồng thuận theo chuỗi nhiều công nhất, và số xác nhận cần chờ. Hẹn gặp bạn ở bài tiếp theo."
