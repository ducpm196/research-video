      kiểm biến mỗi nút tham gia thành trọng tài công bằng mà không hề làm lộ bí mật của người gửi tiền.
- id: example
  kind: example
  title: Ký “A trả B 5” bằng khoá đồ chơi
  checks:
  - alg.toy_rsa_sign('A trả B 5') == 2164 and pow(2164, 17, 3233) == 3010 and alg.toy_rsa_verify('A trả B 5', 2164) and not
    alg.toy_rsa_verify('A trả B 50', 2164)
  - 61 * 53 == 3233 and (17 * 2753) % (60 * 52) == 1 and (61 - 1) * (53 - 1) == 3120
  - 17 * 2753 == 46801 == 15 * 3120 + 1 and 60 * 52 == 3120 and pow(3010, 2753, 3233) == 2164
  steps:
  - show: '<p><b>Bước 1 — dựng khoá đồ chơi</b> (chỉ để thấy cơ chế; khoá thật của kiểu ký này dài hàng nghìn bit, còn chuỗi
      khối thật dùng chữ ký tính trên điểm đường cong toán học gọi là đường cong elip, khoá 256 bit):</p>

      $$n = 61 \cdot 53 = 3233, \quad e = 17, \quad d = 2753$$

      <p>Vì sao là 2753: $17 \cdot 2753 = 46\,801 = 15 \cdot 3120 + 1$, với $3120 = (61 - 1) \cdot (53 - 1) = 60 \cdot 52$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    say: Bước một, dựng một khoá đồ chơi chỉ để thấy cơ chế, vì khoá thật dài hàng nghìn bit. Chuỗi khối thật dùng chữ ký
      trên đường cong toán học gọi là đường cong elip 256 bit. Ta lấy n bằng 61 nhân 53, bằng 3233, khoá công khai e bằng
      17, và khoá bí mật d bằng 2753. Số d được chọn sao cho 17 nhân d bằng 46801, đúng bằng 15 lần 3120 cộng 1. Ở đây 3120
      là 61 trừ 1 nhân với 53 trừ 1, tức 60 nhân 52, và chính điều kiện dư 1 này làm phép kiểm đảo ngược được phép ký.
  - show: '<p><b>Bước 2 — băm giao dịch rồi lấy dư:</b></p>

      $$h = \text{băm}(\text{A trả B 5}) \bmod 3233 = \hl{3010}$$

      '
    focus:
    - 2
    - 2
    - 2
    say: Bước hai, băm dòng A trả B 5 bằng hàm băm hai trăm năm mươi sáu bit, rồi chia lấy dư cho 3233, được h bằng 3010.
      Chữ ký sẽ đặt lên con số 3010 này, chứ không đặt lên từng chữ của giao dịch. Sau khi băm văn bản giao dịch, hệ thống
      quy về đồng hồ số học của khoá đồ chơi để chuẩn bị thực hiện phép lũy thừa bí mật.
  - show: '<p><b>Bước 3 — An ký bằng khoá bí mật:</b></p>

      $$s = 3010^{2753} \bmod 3233 = \hl{2164}$$

      '
    focus:
    - 2
    - 2
    say: Bước ba, An dùng khoá bí mật để ký, tính 3010 mũ 2753 rồi chia lấy dư cho 3233, được chữ ký s bằng 2164. Với khoá
      thật, chỉ người giữ khoá bí mật mới tính được con số này.
  - show: '<p><b>Bước 4 — ai cũng kiểm được bằng khoá công khai:</b></p>

      $$2164^{17} \bmod 3233 = 3010 = h \quad \text{→ đúng}$$

      '
    focus:
    - 2
    - 2
    say: Bước bốn, bất kỳ ai cũng kiểm được bằng khoá công khai, tính 2164 mũ 17 rồi chia lấy dư cho 3233, ra 3010. Con số
      này đúng bằng h của bước hai, nên chữ ký hợp lệ.
  - clear: true
    show: '<table class="t"><tr><th>bước 5 — kẻ sửa giao dịch</th><th>giá trị</th></tr>

      <tr><td>băm “A trả B 50”, lấy dư cho 3233</td><td>2441</td></tr>

      <tr><td>chữ ký cũ cho ra</td><td>3010</td></tr>

      <tr><td>so sánh</td><td>2441 ≠ 3010 → chữ ký <b class="red">sai</b></td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Bước năm, kẻ gian sửa giao dịch thành A trả B 50 nhưng giữ chữ ký cũ. Nút băm dòng mới rồi lấy dư, ra 2441. Chữ ký
      cũ mũ 17 lấy dư vẫn cho 3010. Hai số khác nhau, nên giao dịch bị sửa bị từ chối ngay. Mạng từ chối ngay khi phát hiện
      giá trị giải mã từ chữ ký cũ không trùng với dấu vân tay của giao dịch vừa bị sửa số tiền.
- id: check
  kind: check
  title: 'Tự kiểm: tính tay bằng bình phương dần'
  checks:
  - '[pow(2164, 2 ** i, 3233) for i in range(5)] == [2164, 1512, 413, 2453, 596] and 2164 * 2164 % 3233 == 1512 and 1512 *
    1512 % 3233 == 413 and 413 * 413 % 3233 == 2453 and 2453 * 2453 % 3233 == 596 and 596 * 2164 % 3233 == 3010 and 16 + 1
    == 17'
  - pow(2165, 17, 3233) == 79 and sum(1 for m in range(3233) if pow(pow(m, 2753, 3233), 17, 3233) == m) == 3233
  steps:
  - show: '<table class="t"><tr><th>lũy thừa</th><th>cách tính</th><th>chia lấy dư cho 3233</th></tr>

      <tr><td>$2164^2$</td><td>$2164 \cdot 2164$</td><td>1512</td></tr>

      <tr><td>$2164^4$</td><td>$1512 \cdot 1512$</td><td>413</td></tr>

      <tr><td>$2164^8$</td><td>$413 \cdot 413$</td><td>2453</td></tr>

      <tr><td>$2164^{16}$</td><td>$2453 \cdot 2453$</td><td>596</td></tr>

      <tr><td>$2164^{17} = 2164^{16} \cdot 2164$</td><td>$596 \cdot 2164$</td><td>$\hl{3010}$ ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.5'
    - '1.6'
    - '1.6'
    say: Kiểm bằng đường khác, ta tự tính 2164 mũ 17 bằng mẹo bình phương dần ở phần chuẩn bị, mỗi lần lấy dư cho 3233. Bình
      phương 2164 rồi lấy dư, được 1512. Bình phương 1512 rồi lấy dư, được 413. Bình phương 413, được 2453, và bình phương
      2453, được 596, tức là 2164 mũ 16. Vì 17 bằng 16 cộng 1, ta nhân thêm 2164 một lần, 596 nhân 2164 lấy dư được 3010,
      khớp kết quả của máy. Bốn bước bình phương dần giữ cho từng phép nhân luôn nhỏ gọn và có thể kiểm tra từng bước
      bằng tay không cần số lớn.
  - show: '<table class="t"><tr><th>phép thử của máy</th><th>kết quả</th></tr>

      <tr><td>chữ ký lệch 1 đơn vị: $2165^{17} \bmod 3233$</td><td>79 ≠ 3010 → <b class="red">sai</b></td></tr>

      <tr><td>ký rồi kiểm với mọi h từ 0 tới 3232</td><td>3233 / 3233 lần trả lại đúng h ✓</td></tr>

      <tr><td>băm khoá công khai $e, n$ thành địa chỉ</td><td>đổi 1 ký tự khoá là địa chỉ đổi khác hoàn toàn ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Ta thêm ba phép thử nữa, lần này để máy tính làm. Chữ ký lệch chỉ một đơn vị, 2165 mũ 17 lấy dư cho 3233, ra 79,
      khác hẳn 3010, nên đoán bừa chữ ký không qua được. Máy ký rồi kiểm với mọi giá trị h từ 0 tới 3232, và cả 3233 lần đều
      trả lại đúng h, nên phép kiểm luôn đảo ngược được phép ký. Khi băm khoá công khai để ra địa chỉ nhận tiền, đổi một ký
      tự của khoá là địa chỉ đổi khác hoàn toàn, giúp người kiểm đối chiếu đúng chủ.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Mất khoá bí mật <b class="red">(không có “quên mật khẩu”)</b>

      <br><span class="note">Không có bên nào cấp lại khoá. Mất khoá là mất quyền tiêu vĩnh viễn; lộ khoá là ai cũng tiêu
      được. Sao lưu khoá ngoại tuyến, nhiều bản, ở nhiều nơi; với số tiền lớn dùng thiết bị ký riêng hoặc ký nhiều bên.</span></div>

      '
    say: Lỗi thứ nhất, mất khoá bí mật, trong khi không có chức năng quên mật khẩu. Không có bên nào cấp lại khoá. Mất khoá
      là mất quyền tiêu vĩnh viễn, còn lộ khoá là ai cũng tiêu được. Hãy sao lưu khoá ngoại tuyến, nhiều bản, ở nhiều nơi,
      và với số tiền lớn thì dùng thiết bị ký riêng hoặc ký nhiều bên. Không có cơ quan quản trị hay nút mạng nào có thể khôi
      phục hộ khoá bí mật đã đánh mất, nên sao lưu khoá là sống còn.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Ký mà không ràng buộc ngữ cảnh <b class="red">(chữ ký bị phát lại)</b>

      <br><span class="note">Chữ ký trên “A trả B 5” có thể bị gửi lại lần nữa, hay sang một chuỗi khác. Giao dịch phải gắn
      đồng cụ thể đang tiêu, hoặc số thứ tự và mã chuỗi, để mỗi chữ ký chỉ dùng được một lần.</span></div>

      '
    say: Lỗi thứ hai, ký mà không ràng buộc ngữ cảnh, nên chữ ký bị phát lại. Chữ ký trên dòng A trả B 5 có thể bị gửi lại
      lần nữa, hay sang một chuỗi khác. Giao dịch phải gắn với đồng cụ thể đang tiêu, hoặc số thứ tự và mã chuỗi, để mỗi chữ
      ký chỉ dùng được một lần. Luôn kẹp số thứ tự giao dịch và mã nhận diện chuỗi vào nội dung trước khi băm để chữ ký không
      thể bị dùng lại sang giao dịch khác.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Tự viết thuật toán ký <b class="red">(một lỗi nhỏ lộ cả khoá)</b>

      <br><span class="note">Khoá đồ chơi ở đây phá được trong tích tắc. Với chữ ký đường cong elip, dùng lại số ngẫu nhiên
      khi ký là đủ để tính ra khoá bí mật. Luôn dùng thư viện đã được kiểm định.</span></div>

      '
    say: Lỗi thứ ba, tự viết thuật toán ký, nên một lỗi nhỏ làm lộ cả khoá. Khoá đồ chơi ở đây bị phá trong tích tắc. Với
      chữ ký đường cong elip, chỉ cần dùng lại số ngẫu nhiên khi ký là đủ để tính ra khoá bí mật. Hãy luôn dùng thư viện đã
      được kiểm định. Chỉ dùng các thư viện mật mã đường cong chuẩn đã được cộng đồng kiểm chứng rộng rãi thay vì tự cài đặt
      phép toán chia dư cấp thấp.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - pow(pow(1234, 2753, 3233), 17, 3233) == 1234
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Một giao dịch có $h = 1234$ (đã lấy dư). An ký được $s$. Người kiểm tính $s^{17} \bmod 3233$ thì ra
      bao nhiêu nếu chữ ký đúng?</td></tr>

      <tr><td>2</td><td>Bình biết địa chỉ của An nhưng chưa thấy khoá công khai. Bình kiểm được chữ ký của An khi nào?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, một giao dịch có h bằng 1234, đã lấy dư, và An ký được s. Người kiểm tính s
      mũ 17 chia lấy dư cho 3233 thì ra bao nhiêu nếu chữ ký đúng? Câu hai, Bình biết địa chỉ của An nhưng chưa thấy khoá
      công khai. Bình kiểm được chữ ký của An khi nào? Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① Bước một, An ký: $s = 1234^{2753} \bmod 3233$.</p>

      <p>Bước hai, người kiểm tính $s^{17} \bmod 3233$. Kiểm là đảo ngược phép ký, $(h^d)^e \equiv h \pmod{n}$, nên ra đúng
      $\hl{1234}$.</p>

      '
    introduces:
    - equiv_mod
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Đáp án câu một, bước một, An ký bằng cách tính 1234 mũ 2753 rồi chia lấy dư cho 3233. Bước hai, người kiểm tính s
      mũ 17 chia lấy dư cho 3233. Vì kiểm là đảo ngược phép ký, h mũ d rồi mũ e đồng dư với h khi chia cho n, viết dấu ba
      gạch. Kết quả ra đúng 1234, như máy đã thử với mọi h nhỏ hơn 3233.
  - show: '<table class="t"><tr><th>②</th><th>Bình làm gì</th></tr>

      <tr><td>1</td><td>nhận khoá công khai An gửi kèm giao dịch</td></tr>

      <tr><td>2</td><td>băm khoá đó, so với địa chỉ của An: phải khớp</td></tr>

      <tr><td>3</td><td>dùng khoá đó kiểm chữ ký như bước 4 của ví dụ</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Câu hai, Bình chỉ kiểm được khi An đưa khoá công khai kèm theo giao dịch. Đầu tiên, Bình nhận khoá công khai đó.
      Tiếp theo, Bình băm khoá đó và so với địa chỉ của An, hai bên phải khớp nhau. Cuối cùng, Bình dùng khoá đó để kiểm chữ
      ký, giống hệt bước bốn của ví dụ.
