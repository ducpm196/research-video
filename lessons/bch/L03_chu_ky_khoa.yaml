scenes:
- id: hook
  kind: hook
  title: Không có ngân hàng, ai xác nhận đúng là An?
  steps:
  - show: '<p>Ở ngân hàng, An đăng nhập bằng mật khẩu, ngân hàng kiểm rồi chuyển tiền. Trên sổ cái phân tán không có ai giữ
      mật khẩu của An. Vậy làm sao mọi nút trên mạng — những người An không quen — đều kiểm được “giao dịch này đúng là An
      cho phép”, và không ai sửa được số tiền?</p>

      <div class="box key">Hôm nay: <b>chữ ký số</b> — khoá bí mật để ký, khoá công khai để kiểm, và địa chỉ là băm của khoá
      công khai.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, ở ngân hàng, An đăng nhập bằng mật khẩu, ngân hàng kiểm rồi chuyển tiền. Trên sổ cái phân tán không có
      ai giữ mật khẩu của An. Vậy làm sao mọi nút trên mạng, những người An không quen, đều kiểm được giao dịch này đúng là
      An cho phép, và không ai sửa được số tiền? Hôm nay ta học chữ ký số, khoá bí mật để ký, khoá công khai để kiểm, và địa
      chỉ là băm của khoá công khai. Trên mạng mở không có máy chủ giữ mật khẩu, người sở hữu tài sản phải tự chứng minh quyền
      chi tiêu bằng phép toán mật mã công khai.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: chia lấy dư, lũy thừa lấy dư, mã băm'
  checks:
  - 17 % 5 == 2 and 17 == 3 * 5 + 2 and 3 ** 4 == 81 == 11 * 7 + 4 and 81 % 7 == 4
  - 3 ** 2 == 9 and 9 % 7 == 2 and (2 * 2) % 7 == pow(3, 4, 7) == 4
  - __import__('hashlib').sha256('A trả B 5'.encode()).hexdigest()[:16] == '4f6b2038b6af9984' and __import__('hashlib').sha256('A
    trả B 50'.encode()).hexdigest()[:16] == 'cd3959ce01c8e7d6'
  steps:
  - show: '<p><b>Chia lấy dư</b>: $17 = 3 \cdot 5 + 2$, nên $17 \bmod 5 = 2$.</p>

      <p><b>Lũy thừa rồi lấy dư</b>: $3^4 = 81 = 11 \cdot 7 + 4$, nên $3^4 \bmod 7 = 4$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Trước hết, ta cần hiểu phép chia lấy dư, tức là chia rồi chỉ giữ lại phần dư. 17 chia lấy dư cho 5 bằng 2, vì 17
      bằng 3 nhân 5 cộng 2. Lũy thừa rồi lấy dư cũng vậy, 3 mũ 4 bằng 81, mà 81 bằng 11 nhân 7 cộng 4, nên 3 mũ 4 chia lấy
      dư cho 7 bằng 4. Phép chia lấy dư giữ giá trị luôn nằm trong một đồng hồ hữu hạn, tạo nền tảng số học trực tiếp cho
      ký và kiểm chữ ký.
  - show: '<table class="t"><tr><th>bình phương dần</th><th>giá trị</th><th>chia lấy dư cho 7</th></tr>

      <tr><td>$3^2$</td><td>9</td><td>2</td></tr>

      <tr><td>$3^4 = (3^2)^2$</td><td>dùng số dư: $2 \cdot 2 = 4$</td><td>$\hl{4}$ — khớp cách tính thẳng</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Khi số mũ lớn, ta không cần tính cả con số khổng lồ, mà bình phương dần và lấy dư sau mỗi bước. 3 mũ 2 bằng 9, chia
      lấy dư cho 7 còn 2. Bình phương tiếp số dư đó, 2 nhân 2 bằng 4, khớp với cách tính thẳng ở trên. Lát nữa ta sẽ dùng
      chính mẹo này để tự kiểm một chữ ký bằng tay.
  - show: '<table class="t"><tr><th>dữ liệu</th><th>16 chữ số đầu của mã băm (hệ 16)</th></tr>

      <tr><td>A trả B 5</td><td>4f6b2038b6af9984</td></tr>

      <tr><td>A trả B 50</td><td>cd3959ce01c8e7d6</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    say: Ở bài 1, ta đã thấy mã băm giống dấu vân tay của dữ liệu, cùng dữ liệu luôn cho cùng một mã, còn thêm một ký tự là
      mã đổi hẳn. Bảng này băm dòng A trả B 5 bằng hàm băm hai trăm năm mươi sáu bit. Dòng A trả B 50 chỉ thêm một chữ số
      0, mà mã đã khác ngay từ chữ số đầu tiên. Băm trước giao dịch thành con số ngắn cố định giúp tốc độ ký luôn nhanh đồng
      đều bất kể nội dung giao dịch dài hay ngắn.
- id: sym
  kind: symbol
  title: 'Giải mã: cặp khoá, ký, kiểm, địa chỉ'
  steps:
  - show: '<table class="t"><tr><th>thứ</th><th>ai có</th><th>dùng để</th></tr>

      <tr><td><b>khoá bí mật</b> $d$ (hệ mật mã RSA)</td><td>chỉ An</td><td>ký: $s = h^d \bmod n$, với $h$ là băm của giao
      dịch</td></tr>

      <tr><td><b>khoá công khai</b> $(e, n)$</td><td>mọi người</td><td>kiểm: $s^e \bmod n$ có bằng $h$ không</td></tr>

      <tr><td><b>địa chỉ</b></td><td>mọi người</td><td>băm của khoá công khai (kiểu địa chỉ phổ biến) — “số tài khoản” để
      nhận tiền</td></tr></table>

      <p>Ký trên <b>băm</b> của cả giao dịch: đổi một ký tự (số tiền, người nhận) là băm đổi, chữ ký cũ không còn khớp.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    say: Bảng có ba thứ. Khoá bí mật d chỉ An có, dùng để ký, chữ ký s bằng h mũ d chia lấy dư cho n, với h là băm của giao
      dịch. Khoá công khai gồm e và n, ai cũng có, dùng để kiểm xem s mũ e chia lấy dư cho n có bằng h không. Địa chỉ ai cũng
      biết, với kiểu địa chỉ phổ biến là băm của khoá công khai, đóng vai số tài khoản để nhận tiền. Chữ ký được tính trên
      băm của cả giao dịch, nên đổi một ký tự như số tiền hay người nhận là băm đổi, và chữ ký cũ không còn khớp. Khoá bí
      mật nằm tuyệt đối trong ví chủ sở hữu, còn cặp khoá công khai được phát tán kèm chữ ký để mọi nút mạng tự xác minh độc
      lập.
