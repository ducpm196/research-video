- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">khoá bí mật ký băm giao dịch</span><span class="a">→</span>

      <span class="n">khoá công khai kiểm, ai cũng làm được</span><span class="a">→</span>

      <span class="n">địa chỉ = băm khoá công khai</span><span class="a">→</span>

      <span class="n">giữ khoá an toàn; chống phát lại; dùng thư viện chuẩn</span></div>

      <p class="note"><b>So sánh hai quy mô:</b> Khoá đồ chơi 4 chữ số phá trong tích tắc; khoá elip 256 bit an toàn nhưng
      sập ngay nếu lặp số ngẫu nhiên.</p>

      '
    say: Tổng kết lại, khoá bí mật ký lên băm của giao dịch, khoá công khai kiểm và ai cũng làm được, còn địa chỉ là băm của
      khoá công khai. Hãy giữ khoá an toàn, chống phát lại, và dùng thư viện chuẩn. Khoá đồ chơi giúp hiểu phép mũ mô-đun,
      còn khoá 256 bit thật bắt buộc dùng thư viện chuẩn và số ngẫu nhiên mới mỗi lần ký. Cặp khoá bất đối xứng giữa
      ký bằng bí mật và kiểm bằng công khai định nghĩa trọn vẹn quyền sở hữu phi tập trung.
