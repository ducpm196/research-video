rate: "-5%"
depth: full
source: "curriculum/bch.yaml L03; audit/bch/verify_bch.py L03; R. Rivest, A. Shamir, L. Adleman (1978); SEC 2 (secp256k1) và cách lập địa chỉ từ băm khoá công khai — A. Narayanan và cộng sự (2016), chương 1, 3; bài 1"
assumes: [arith, power, mod, cdot]
# Quy ước: RSA ĐỒ CHƠI n = 61 · 53 = 3233, e = 17, d = 2753 (17 · 2753 ≡ 1 theo mô-đun 60 · 52) — chỉ để thấy cơ chế, khoá thật dài hàng nghìn bit
#   và chuỗi khối thật dùng chữ ký đường cong elip. Ký: s = h^d mod n với h = SHA-256(thông điệp) mod n; kiểm: s^e mod n = h (alg.toy_rsa_sign, alg.toy_rsa_verify).
#   Địa chỉ = băm của khoá công khai (rút gọn, hiện 40 chữ số hex đầu).
objectives:
  - "Giải thích giao dịch được ký bằng khoá bí mật"
  - "Kiểm chữ ký bằng khoá công khai"
  - "Giải thích địa chỉ là băm của khoá công khai"
