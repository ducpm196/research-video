id: L06
course: BCH
series: "BCH · Blockchain và sổ cái phân tán"
title: "Bài 6 — Đồng thuận Nakamoto: chuỗi nhiều công nhất và số xác nhận"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/bch.yaml L06; audit/bch/verify_bch.py L06; S. Nakamoto, Bitcoin: A Peer-to-Peer Electronic Cash System (2008), mục 5 và 11 — bảng q = 0,1 và q = 0,3 tính lại khớp 7 chữ số; C. Grunspan, R. Pérez-Marco, Double spend races (Int. J. Theor. Appl. Finance, 2018) — công thức chính xác, kiểm bằng mô phỏng; bài 5"
assumes: [arith, frac, power, exp, sum, factorial, approx, sub, cdot]
# Quy ước: q = tỉ lệ sức tính của kẻ tấn công, p = 1 − q; z = số khối xác nhận đã có sau giao dịch. Xác suất kẻ tấn công rốt cuộc đuổi kịp
#   (công thức mục 11 của bài báo): P = 1 − Σ_{k=0}^{z} (λ^k e^{−λ} / k!) · (1 − (q/p)^{z−k}), λ = z · q / p; q ≥ p thì P = 1 (alg.nakamoto_catch_up).
#   Công thức chính xác (số khối kẻ tấn công theo nhị thức âm): P = 1 − Σ_{k=0}^{z−1} C(k + z − 1, k)(p^z q^k − q^z p^k) (alg.exact_double_spend) — CAO HƠN
#   công thức Nakamoto; mô phỏng cuộc đua khối trong verify_bch.py khớp công thức chính xác. Mô hình giả định kẻ tấn công bắt đầu cùng lúc với giao dịch, không tính độ trễ mạng.
objectives:
  - "Giải thích chọn chuỗi có tổng công lớn nhất"
  - "Tính xác suất kẻ tấn công đuổi kịp sau z khối"
  - "Chọn số xác nhận theo giá trị giao dịch"
