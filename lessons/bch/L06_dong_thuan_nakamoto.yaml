      - "min(z for z in range(200) if alg.exact_double_spend(0.3, z) < 0.001) == 32 and min(z for z in range(100) if alg.nakamoto_catch_up(0.3, z) < 0.001) == 24"
      - "round(alg.exact_double_spend(0.3, 31), 5) == 0.00106 and round(alg.exact_double_spend(0.3, 32), 5) == 0.00088 and round(alg.exact_double_spend(0.3, 10) / 0.001) == 65"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Muốn xác suất đuổi kịp dưới 0,1% khi kẻ tấn công có 10% sức tính, dùng cột <b>chính xác</b> của bảng: cần ít nhất bao nhiêu khối?</td></tr>
          <tr><td>2</td><td>Nếu kẻ tấn công có 30% sức tính, đoán xem cần nhiều hơn hay ít hơn 10 khối?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, muốn xác suất đuổi kịp dưới 0 phẩy 1 phần trăm khi kẻ tấn công có 10 phần trăm sức tính, dùng cột chính xác của bảng, cần ít nhất bao nhiêu khối? Câu hai, nếu kẻ tấn công có 30 phần trăm sức tính, hãy đoán xem cần nhiều hơn hay ít hơn 10 khối? Dừng video và làm ra giấy."
