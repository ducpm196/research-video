      - clear: true
        show: |
          <table class="t"><tr><th>① q = 0,1</th><th>chính xác</th><th>dưới 0,001?</th></tr>
          <tr><td>z = 5</td><td>0,0017818</td><td>chưa</td></tr>
          <tr><td>z = 6</td><td>0,0005914</td><td>có → $z = \hl{6}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, dò cột chính xác từ trên xuống. Với 5 khối, xác suất là 0 phẩy 0017818, vẫn lớn hơn 0 phẩy 001, nên chưa đủ, dù bảng năm 2008 nói 5 khối là đủ. Với 6 khối, xác suất là 0 phẩy 0005914, nhỏ hơn 0 phẩy 001, nên cần ít nhất 6 khối."
      - show: |
          <table class="t"><tr><th>② q = 0,3</th><th>chính xác</th><th>dưới 0,001?</th></tr>
          <tr><td>z = 10</td><td>0,0651</td><td>còn xa</td></tr>
          <tr><td>z = 31</td><td>0,00106</td><td>chưa</td></tr>
