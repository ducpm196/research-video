scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nâng cấp một hệ không ai làm chủ"
    checks:
      - "80 * 6 * 24 * 365 == 4204800 and round(4204800 / 10**6, 1) == 4.2"
    steps:
      - show: |
          <p>Năm 2008, sách trắng của Nakamoto tính: mỗi khối chỉ thêm một tiêu đề khoảng <b>80 byte</b>, cứ 10 phút một khối, nên mỗi năm chỉ thêm <b>4,2 MB</b>.</p>
          <p>Năm 2015, có một khối mất <b>25 giây</b> chỉ để kiểm chữ ký; mỗi khối bị giới hạn <b>1&nbsp;000&nbsp;000 byte</b>.</p>
          <p>Năm 2022, chuỗi hợp đồng thông minh của bài 8 bỏ hẳn bằng chứng công việc, chuyển sang bằng chứng cổ phần; năng lượng được ước tính giảm <b>khoảng 99,95%</b>.</p>
          <div class="box key">Hôm nay: năm chặng từ 2008 tới sau 2022 — nâng cấp một hệ không ai làm chủ mà không dừng mạng, không mất lịch sử.</div>
        focus: [1, 2, 3, 3, 4]
        say: "Chào bạn, năm 2008, sách trắng của Nakamoto tính rằng mỗi khối chỉ thêm một tiêu đề 80 byte, 10 phút một khối, nên mỗi năm chỉ thêm 4 phẩy 2 MB. Năm 2015, có một khối mất tới 25 giây chỉ để kiểm chữ ký, trong khi mỗi khối bị giới hạn một triệu byte. Năm 2022, chuỗi hợp đồng thông minh của bài 8 bỏ bằng chứng công việc, chuyển sang bằng chứng cổ phần. Năng lượng của chuỗi ấy được ước tính giảm khoảng 99 phẩy 95 phần trăm. Hôm nay ta xem cách nâng cấp một hệ không ai làm chủ mà không dừng mạng, không mất lịch sử."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "len(alg.merkle_proof(alg.merkle_levels([str(i).encode() for i in range(1024)]), 357)) == 10 and 10 * 32 == 320"
      - "round(alg.nakamoto_catch_up(0.1, 6), 7) == 0.0002428 and round(alg.exact_double_spend(0.1, 6), 7) == 0.0005914 and round(alg.exact_double_spend(0.1, 6), 4) == 0.0006"
      - "(100 - 1) // 3 == 33 and 100 - 33 == 67"
      - "10**6 // 250 == 4000 and round(4000 / 600, 1) == 6.7"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 2</td><td><b>cây Merkle</b>: chứng minh một giao dịch thuộc khối mà không tải cả khối</td><td>1024 giao dịch → 10 mã băm = 320 byte</td></tr>
          <tr><td>bài 6</td><td>mỗi nút theo <b>chuỗi có tổng công lớn nhất</b>; đảo một giao dịch khó dần theo số khối xác nhận</td><td>kẻ nắm 10% sức tính, sau 6 khối: ≈ 0,0002428 theo bảng xấp xỉ Nakamoto 2008; tính chính xác ≈ 0,0005914</td></tr>
          <tr><td>bài 7</td><td>bỏ phiếu theo <b>hai phần ba</b>: chịu được tối đa một phần ba gian lận</td><td>100 bên: chịu 33 bên gian lận, cần 67 phiếu</td></tr>
          <tr><td>bài 10</td><td><b>thông lượng</b> = cỡ khối chia cỡ giao dịch, chia thời gian giữa hai khối</td><td>1&nbsp;000&nbsp;000 byte, 250 byte, 600 giây → 4000 giao dịch mỗi khối, ≈ 6,7 mỗi giây</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4", "1.5", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 2, cây Merkle chứng minh một giao dịch thuộc khối 1024 giao dịch bằng 10 mã băm, 320 byte. Ở bài 6, mỗi nút theo chuỗi có tổng công lớn nhất. Kẻ nắm 10 phần trăm sức tính đuổi kịp sau 6 khối với xác suất chưa tới 3 phần mười nghìn theo bảng xấp xỉ năm 2008, còn tính chính xác là khoảng 6 phần mười nghìn. Ở bài 7, bỏ phiếu hai phần ba với 100 bên thì chịu được 33 bên gian lận, và cần 67 phiếu để chốt. Ở bài 10, khối một triệu byte, giao dịch 250 byte, chứa được 4000 giao dịch. Chia cho 600 giây, ta được khoảng 6 phẩy 7 giao dịch mỗi giây."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>nâng cấp mềm</b> (soft fork)</td><td>luật mới <b>chặt hơn</b>; nút chưa nâng cấp vẫn chấp nhận khối theo luật mới</td></tr>
          <tr><td><b>nâng cấp cứng</b> (hard fork)</td><td>nút chưa nâng cấp coi khối theo luật mới là sai, nên mạng có thể tách đôi</td></tr>
          <tr><td><b>nhân chứng</b> (witness)</td><td>phần dữ liệu chứng minh giao dịch hợp lệ, chủ yếu là chữ ký</td></tr>
          <tr><td><b>tín hiệu sẵn sàng</b></td><td>một bit trong tiêu đề khối, bật lên để báo người tạo khối đã sẵn sàng áp luật mới</td></tr>
          <tr><td><b>người xác thực</b> (validator)</td><td>bên đặt cọc để được đề xuất khối và bỏ phiếu</td></tr>
          <tr><td><b>tính cuối cùng</b> (finality)</td><td>khối đã chốt chỉ đảo được nếu chịu mất một lượng cọc rất lớn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài dùng sáu thuật ngữ, ta đọc từng dòng. Nâng cấp mềm là luật mới chặt hơn, nút chưa nâng cấp vẫn nhận khối mới. Nâng cấp cứng là khi nút chưa nâng cấp coi khối mới là sai, nên mạng có thể tách đôi. Nhân chứng là phần dữ liệu chứng minh giao dịch hợp lệ, chủ yếu là chữ ký. Tín hiệu sẵn sàng là một bit trong tiêu đề khối, bật lên khi người tạo khối sẵn sàng. Người xác thực là bên đặt cọc để được đề xuất khối và bỏ phiếu. Tính cuối cùng nghĩa là khối đã chốt chỉ đảo được nếu chịu mất rất nhiều cọc."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2008</text><text x="160" y="200">sách trắng</text><text x="160" y="232">4,2 MB mỗi năm</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2015 → 2016</text><text x="500" y="200">tách chữ ký</text><text x="500" y="232">trọng lượng khối</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2016 → 2017</text><text x="850" y="200">tín hiệu sẵn sàng</text><text x="850" y="232">kích hoạt ở khối 481&#160;824</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2020 → 2022</text><text x="1200" y="200">chạy song song</text><text x="1200" y="232">rồi Hợp nhất</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">sau 2022</text><text x="1540" y="200">khe 12 giây</text><text x="1540" y="232">chốt bằng hai phần ba</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô lớn → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng, đi từ trái sang phải. Năm 2008, tiêu đề khối chỉ tăng 4 phẩy 2 MB mỗi năm. Từ 2015 tới 2017, đồng tiền số đầu tiên tách chữ ký, rồi kích hoạt nâng cấp ở khối 481 nghìn 824. Từ 2020, chuỗi hợp đồng thông minh chạy một chuỗi đồng thuận mới song song, Hợp nhất năm 2022, rồi chốt khối bằng hai phần ba cổ phần."

