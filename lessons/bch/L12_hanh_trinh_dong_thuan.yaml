# Quy ước: “nâng cấp mềm” = soft fork; “nâng cấp cứng” = hard fork; “nhân chứng” = witness (phần dữ liệu chứng minh giao dịch hợp lệ, chủ
#   yếu là chữ ký); “tín hiệu sẵn sàng” = version bit; “trọng lượng khối” = block weight; “người xác thực” = validator; “khe” = slot;
#   “kỷ nguyên” = epoch; “tính cuối cùng” = finality; “Hợp nhất” = The Merge; “chuỗi đồng thuận mới” = Beacon Chain.
#   Mọi sự kiện và con số có nguồn ghi trong audit/bch/sources_L12.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”:
#   giao dịch 250 byte có 100 byte chữ ký, mạng 5 công ty 200 nút, 90 ngày song song, 100 phần cổ phần đều là SỐ MINH HOẠ.
#   Lời đọc không nói “Bitcoin”, “Ethereum”, “SegWit”, “BIP”, “Merge”, “ETH”, “TWh”: nói “đồng tiền số đầu tiên”, “chuỗi hợp đồng thông
#   minh”, “nhân chứng tách riêng”, “đề xuất cải tiến số 141”, “Hợp nhất”, “đồng tiền gốc của chuỗi”, “tỉ số điện” (1 số điện = 1 kWh).
#   Probe: audit/bch/probes/p1_thuat_ngu.md, p2_hanh_trinh.md; luật ở lexicon_vi.BCH.yaml. Nội dung an ninh chỉ mức khái niệm phòng thủ;
#   không nói giá, không lời khuyên đầu tư.
objectives:
  - "Kể lại hành trình nâng cấp chuỗi khối qua năm chặng từ 2008 tới sau 2022, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại dung lượng tiêu đề mỗi năm, trọng lượng khối, ngưỡng tín hiệu, số ngày chạy song song và độ dài một kỷ nguyên"
  - "Chọn cách nâng cấp hợp với quy mô mạng của chính mình, kèm điều kiện đổi lựa chọn"
