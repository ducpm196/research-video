  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2008 — khai sinh: sổ cái không cần bên tin cậy"
    stage: {year: "2008", scale: "mạng ngang hàng mới; tiêu đề khối khoảng 80 byte, 10 phút một khối, 4,2 MB mỗi năm; máy tính năm 2008 thường có 2 GB RAM", source: "[N08]", practice: "nút nhẹ chỉ giữ tiêu đề và nhánh Merkle; độ khó theo trung bình động để giữ số khối mỗi giờ; bên nhận nhiều thanh toán tự chạy nút đầy đủ"}
    checks:
      - "60 // 10 == 6 and 6 * 24 * 365 == 52560 and 52560 * 80 == 4204800"
      - "2 * 10**9 // 4204800 == 475"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> chữ ký số đã có, nhưng vẫn cần một <b>bên tin cậy chung</b> để chống chi tiêu hai lần.</p>
          <p><b>Cách xử lý:</b> một mạng ngang hàng đóng dấu thời gian bằng chuỗi <b>bằng chứng công việc</b>; an toàn khi đa số sức tính không cấu kết tấn công. Độ khó đặt theo <b>trung bình động</b> để giữ số khối mỗi giờ.</p>
          <p><b>Nút nhẹ:</b> chỉ giữ tiêu đề của chuỗi dài nhất và nhánh Merkle nối giao dịch với khối của nó, không cần chạy nút đầy đủ.</p>
        focus: [1, 2, 2, 3]
        say: "Ở chặng một, năm 2008, chữ ký số đã có, nhưng vẫn cần một bên tin cậy chung để chống chi tiêu hai lần. Sách trắng đề xuất một mạng ngang hàng đóng dấu thời gian bằng chuỗi bằng chứng công việc, an toàn khi đa số sức tính không cấu kết. Độ khó được đặt theo trung bình động, khối ra nhanh quá thì độ khó tăng. Nút nhẹ chỉ giữ tiêu đề và nhánh Merkle nối giao dịch với khối, nên không cần chạy nút đầy đủ."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. khối mỗi giờ</td><td>60 phút chia 10 phút</td><td>6 khối</td></tr>
          <tr><td>Bước 2. khối mỗi năm</td><td>6 nhân 24 nhân 365</td><td>$\hlb{52\,560}$ khối</td></tr>
          <tr><td>Bước 3. tiêu đề mỗi năm</td><td>52&nbsp;560 nhân 80 byte</td><td>$\hlg{4\,204\,800}$ byte ≈ 4,2 MB</td></tr>
          <tr><td>Bước 4. so với RAM 2 GB năm 2008</td><td>2&nbsp;000&nbsp;000&nbsp;000 chia 4&nbsp;204&nbsp;800</td><td>$\hl{475}$ năm tiêu đề trọn vẹn (475,6 bỏ phần lẻ)</td></tr></table>
          <p class="note">Thực hành: nút nhẹ kiểm thanh toán bằng tiêu đề và nhánh Merkle. Điều kiện: chỉ tin được khi nút trung thực nắm mạng; bị áp đảo thì nút nhẹ có thể bị lừa — bên nhận thanh toán thường xuyên nên tự chạy nút đầy đủ.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Làm lại phép tính của sách trắng. Bước một, 60 phút chia 10 phút là 6 khối mỗi giờ. Bước hai, 6 nhân 24 nhân 365 được 52 nghìn 560 khối mỗi năm. Bước ba, nhân với 80 byte được 4 triệu 204 nghìn 800 byte, khoảng 4 phẩy 2 MB. Bước bốn, bộ nhớ 2 tỉ byte của máy năm 2008 chứa được khoảng 475 năm tiêu đề. Thực hành rút ra là nút nhẹ kiểm thanh toán bằng tiêu đề và nhánh Merkle. Điều kiện là nút trung thực nắm mạng, nên bên nhận nhiều thanh toán vẫn nên tự chạy nút đầy đủ."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, 2015 tới 2016 — tăng trưởng: khối một triệu byte và chữ ký tách riêng"
    stage: {year: "2015 → 2016", scale: "khối giới hạn 1 000 000 byte; một khối năm 2015 mất 25 giây để kiểm; giao dịch ác ý có thể quá 3 phút", source: "[B141] [BC16]", practice: "tách chữ ký khỏi mã giao dịch; đổi cách đo bằng trọng lượng thay vì nâng thẳng giới hạn; nâng cấp mềm tương thích ngược; ví cũ cảnh giác với đầu ra ai cũng tiêu được"}
    checks:
      - "3 * 10**6 + 10**6 == 4 * 10**6"
      - "3 * 150 + 250 == 700 and 4 * 10**6 // 700 == 5714 and round(5714 / 4000 - 1, 2) == 0.43"
    steps:
      - show: |
          <table class="t"><tr><th>điểm nghẽn khi mạng đông lên</th><th>nối về bài nền</th></tr>
          <tr><td>mỗi khối giới hạn <b>1&nbsp;000&nbsp;000 byte</b></td><td>bài 10: ≈ 6,7 giao dịch mỗi giây</td></tr>
          <tr><td>với một số giao dịch, khối lượng băm khi kiểm chữ ký tăng theo <b>bình phương</b> cỡ giao dịch: một khối năm 2015 mất <b>25 giây</b> để kiểm, giao dịch ác ý có thể quá <b>3 phút</b></td><td>nâng thẳng cỡ khối là nâng cả thời gian kiểm</td></tr>
          <tr><td>mã giao dịch băm cả chữ ký: <b>đổi cách ký là đổi mã</b>, dù nội dung giữ nguyên</td><td>ví khó theo dõi; kênh thanh toán của bài 10 khó dựng</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Ở chặng hai, từ 2015 tới 2016, mạng đông lên và lộ ra ba điểm nghẽn. Thứ nhất, khối giới hạn một triệu byte, khoảng 6 phẩy 7 giao dịch mỗi giây như bài 10. Thứ hai, với một số giao dịch, khối lượng băm khi kiểm chữ ký tăng theo bình phương cỡ giao dịch. Một khối năm 2015 mất 25 giây để kiểm, và giao dịch được dựng ác ý có thể quá 3 phút. Thứ ba, mã giao dịch băm cả chữ ký, nên đổi cách ký là đổi mã, làm ví khó theo dõi."
      - show: |
          <div class="box key"><b>Đề xuất cải tiến số 141</b> (giao ngày 21/12/2015): chữ ký chuyển sang <b>nhân chứng</b>, cam kết vào khối riêng với cây giao dịch.
          <br>Trọng lượng khối = 3 nhân cỡ cơ sở + cỡ toàn phần, không quá <b>4&nbsp;000&nbsp;000</b>. Nói cách khác, mỗi byte nhân chứng nặng 1, mỗi byte khác nặng 4.</div>
        focus: [1, 1, 1]
        say: "Cách xử lý là đề xuất cải tiến số 141, giao cuối năm 2015, chuyển chữ ký sang phần nhân chứng. Khối được đo bằng trọng lượng, bằng 3 nhân cỡ cơ sở cộng cỡ toàn phần, và không được quá 4 triệu. Nói cách khác, mỗi byte nhân chứng nặng 1, còn mỗi byte khác nặng 4."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. khối cũ, không có nhân chứng</td><td>3 nhân 1&nbsp;000&nbsp;000 + 1&nbsp;000&nbsp;000</td><td>$\hlb{4\,000\,000}$: vừa đúng giới hạn mới</td></tr>
          <tr><td>Bước 2. giao dịch 250 byte, trong đó 100 byte chữ ký (số minh hoạ)</td><td>3 nhân 150 + 250</td><td>trọng lượng $\hl{700}$</td></tr>
          <tr><td>Bước 3. số giao dịch mỗi khối</td><td>4&nbsp;000&nbsp;000 chia 700</td><td>≈ $\hlg{5714}$, so với 4000: nhiều hơn ≈ 43%</td></tr></table>
          <p class="note">Nhóm phát triển năm 2016 ước “khoảng 70%” nếu mọi ví đều chuyển: tỉ lệ thật phụ thuộc phần chữ ký trong giao dịch. Điều kiện: nút cũ không thấy nhân chứng, coi đầu ra kiểu mới là “ai cũng tiêu được” — chỉ an toàn khi đa số người tạo khối áp luật mới; ví cũ phải cảnh giác.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Làm thử bằng số. Bước một, khối cũ không có nhân chứng có trọng lượng 3 nhân một triệu cộng một triệu, bằng 4 triệu, vừa đúng giới hạn mới. Bước hai, giao dịch 250 byte có 100 byte chữ ký, một số minh hoạ, thì trọng lượng là 3 nhân 150 cộng 250, bằng 700. Bước ba, 4 triệu chia 700 được khoảng 5714 giao dịch mỗi khối, nhiều hơn 4000 khoảng 43 phần trăm. Nhóm phát triển năm 2016 ước khoảng 70 phần trăm nếu mọi ví đều chuyển, tuỳ phần chữ ký. Điều kiện là nút cũ coi đầu ra kiểu mới là ai cũng tiêu được, nên chỉ an toàn khi đa số người tạo khối áp luật mới."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, 2016 tới 2017 — quy mô lớn: kích hoạt khi không ai ra lệnh được"
    stage: {year: "2016 → 2017", scale: "luật mới chỉ chạy khi người tạo khối khắp nơi cùng áp; cửa sổ 15/11/2016 → 15/11/2017; ngưỡng 1916 trên 2016 khối, rồi 269 trên 336", source: "[B9] [B91] [BC16] [BC17]", practice: "thử trên mạng thử nghiệm nhiều tháng; đo sự sẵn sàng bằng tín hiệu; khoá rồi chờ thêm một chu kỳ; đặt thời hạn thất bại; ngưỡng quá cao thì một nhóm nhỏ chặn được"}
    checks:
      - "round(1916 / 2016 * 100, 2) == 95.04 and 2016 * 10 == 20160 and 20160 // (24 * 60) == 14"
      - "round(269 / 336 * 100, 2) == 80.06 and round(336 * 10 / (24 * 60), 2) == 2.33"
      - "481824 % 2016 == 0 and 481824 // 2016 == 239 and 2016 - 1916 + 1 == 101"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> không có máy chủ trung tâm để cập nhật. Theo bài 6, nếu chỉ một phần nhỏ sức tính áp luật mới, chuỗi dài nhất vẫn có thể chứa khối sai theo luật mới.</p>
          <table class="t"><tr><th>cách xử lý</th><th>nguồn</th></tr>
          <tr><td>bật trên <b>mạng thử nghiệm</b> từ tháng 5/2016; tới bản phát hành 27/10/2016 đã chạy hơn sáu tháng, không lỗi đồng thuận nào được biết</td><td>nhóm phát triển, 2016</td></tr>
          <tr><td><b>tín hiệu sẵn sàng</b> đếm theo từng chu kỳ 2016 khối: đủ 1916 khối báo tín hiệu thì <b>khoá</b>, thêm một chu kỳ nữa mới <b>kích hoạt</b>; quá 15/11/2017 thì thất bại</td><td>đề xuất số 9 và số 141</td></tr>
          <tr><td>năm 2017: ngưỡng hạ còn <b>80%</b>, 269 trên 336 khối, từ 1/6/2017; khi đề xuất này có hiệu lực, khối không báo tín hiệu bị từ chối</td><td>đề xuất số 91</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.3", "2.4", "2.4"]
        say: "Ở chặng ba, từ 2016 tới 2017, không có máy chủ trung tâm nào để cập nhật. Theo bài 6, nếu chỉ một phần nhỏ sức tính áp luật mới, chuỗi dài nhất vẫn có thể chứa khối sai theo luật mới. Trước hết, nâng cấp chạy trên mạng thử nghiệm từ tháng 5 năm 2016, hơn sáu tháng không có lỗi đồng thuận nào được biết. Tín hiệu sẵn sàng được đếm theo từng chu kỳ 2016 khối, đủ 1916 khối báo tín hiệu thì khoá. Thêm một chu kỳ nữa mới kích hoạt, còn quá ngày 15 tháng 11 năm 2017 là thất bại. Năm 2017, một đề xuất khác hạ ngưỡng còn 80 phần trăm, tức 269 trên 336 khối. Khi đề xuất đó có hiệu lực, khối không báo tín hiệu bị từ chối."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. ngưỡng ban đầu</td><td>1916 chia 2016</td><td>≈ $\hlb{95{,}04}$%</td></tr>
          <tr><td>Bước 2. một chu kỳ dài bao lâu</td><td>2016 khối nhân 10 phút = 20&nbsp;160 phút</td><td>14 ngày — “khoảng hai tuần”</td></tr>
          <tr><td>Bước 3. ai chặn được</td><td>2016 − 1916 + 1</td><td>chỉ $\hl{101}$ khối không báo là không khoá được</td></tr>
          <tr><td>Bước 4. ngưỡng năm 2017</td><td>269 chia 336; 336 nhân 10 phút</td><td>≈ 80,06%; ≈ 2,33 ngày</td></tr>
          <tr><td>Bước 5. khối kích hoạt 481&nbsp;824</td><td>481&nbsp;824 chia 2016</td><td>đúng $\hlg{239}$: đầu một chu kỳ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Làm thử bằng số, bảng có năm bước. Bước một, 1916 chia 2016 được khoảng 95 phẩy 04 phần trăm. Bước hai, 2016 khối nhân 10 phút là 20 nghìn 160 phút, tức 14 ngày, khoảng hai tuần. Bước ba, 2016 trừ 1916 cộng 1 là 101, nên chỉ 101 khối không báo là không khoá được. Bước bốn, 269 chia 336 khoảng 80 phẩy 06 phần trăm, và 336 khối chỉ mất khoảng 2 phẩy 33 ngày. Bước năm, khối 481 nghìn 824 chia 2016 được đúng 239, tức đầu một chu kỳ."
      - show: |
          <div class="box key">Năm 2017, nâng cấp được kích hoạt ở khối 481&nbsp;824. Thực hành: thử trên mạng thử nhiều tháng; đo sự sẵn sàng bằng tín hiệu thay vì đoán; khoá rồi chờ một chu kỳ để người còn lại kịp nâng cấp; có thời hạn thất bại rõ ràng. Điều kiện: ngưỡng quá cao thì một nhóm nhỏ chặn được, ngưỡng quá thấp thì nút chưa sẵn sàng có thể đi theo chuỗi sai.</div>
        say: "Năm 2017, nâng cấp được kích hoạt ở khối 481 nghìn 824. Thực hành rút ra là thử trên mạng thử nhiều tháng, và đo sự sẵn sàng bằng tín hiệu thay vì đoán. Khoá rồi chờ một chu kỳ cho người còn lại, và đặt thời hạn thất bại. Điều kiện là ngưỡng quá cao thì nhóm nhỏ chặn được, quá thấp thì nút chưa sẵn sàng có thể theo chuỗi sai."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, 2020 tới 2022 — ổn định: thay động cơ giữa chuyến bay"
    stage: {year: "2020 → 2022", scale: "chuỗi chạy từ 7/2015 bằng bằng chứng công việc, ước 21 TWh mỗi năm; chuỗi đồng thuận mới song song từ 1/12/2020; Hợp nhất ngày 15/9/2022", source: "[E22] [E22e]", practice: "chạy hệ mới song song, chưa giữ giao dịch thật, rồi mới chuyển; giữ nguyên lịch sử và cách dùng; báo rõ người dùng không phải làm gì; nút cần cả phần thực thi lẫn phần đồng thuận"}
    checks:
      - "(__import__('datetime').date(2022, 9, 15) - __import__('datetime').date(2020, 12, 1)).days == 653"
      - "round(21 / 0.0026) == 8077 and round((1 - 0.0026 / 21) * 100, 3) == 99.988"
    steps:
      - show: |
          <p><b>Điểm nghẽn:</b> chuỗi hợp đồng thông minh chạy từ tháng 7/2015 bằng bằng chứng công việc, tốn năng lượng lớn. Ngay từ đầu dự án đã định chuyển sang bằng chứng cổ phần, nhưng làm mà <b>không đánh đổi an ninh và tính phi tập trung</b> mất nhiều năm nghiên cứu.</p>
          <p><b>Cách xử lý:</b> ngày 1/12/2020, một <b>chuỗi đồng thuận mới</b> chạy <b>song song</b>, chỉ đồng thuận về danh sách người xác thực và số dư của họ, chưa xử lý giao dịch thật.</p>
          <p>Ngày <b>15/9/2022</b>, hai hệ <b>Hợp nhất</b>: chuỗi mới thành bộ máy đồng thuận cho mọi giao dịch. Không mất lịch sử; người dùng không phải làm gì với tiền hay ví của mình.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Ở chặng bốn, chuỗi hợp đồng thông minh chạy từ tháng 7 năm 2015 bằng bằng chứng công việc, tốn rất nhiều năng lượng. Dự án định chuyển sang bằng chứng cổ phần từ đầu, nhưng làm mà không đánh đổi an ninh thì mất nhiều năm. Ngày 1 tháng 12 năm 2020, một chuỗi đồng thuận mới chạy song song, chỉ lo danh sách người xác thực, chưa xử lý giao dịch thật. Ngày 15 tháng 9 năm 2022, hai hệ Hợp nhất, và chuỗi mới thành bộ máy đồng thuận cho mọi giao dịch. Không lịch sử nào bị mất, và người dùng không phải làm gì với ví."
      - clear: true
        show: |
          <div><svg width="1500" height="300" viewBox="0 0 1500 300">
          <defs><marker id="ah4" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <line x1="60" y1="90" x2="1010" y2="90" stroke="#eb6834" stroke-width="10"/>
          <line x1="400" y1="210" x2="1010" y2="150" stroke="#2a78d6" stroke-width="10"/>
