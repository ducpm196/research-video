id: L00
course: BCH
series: "BCH · Blockchain và sổ cái phân tán"
title: "Bài 0 — Sổ cái phân tán: chi tiêu hai lần và khi nào cần blockchain"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/bch.yaml L00; audit/bch/verify_bch.py L00; S. Nakamoto, Bitcoin: A Peer-to-Peer Electronic Cash System (2008), mục 1–2; K. Wüst, A. Gervais, Do you need a Blockchain? (CVCBT 2018) — sơ đồ quyết định; A. Narayanan và cộng sự, Bitcoin and Cryptocurrency Technologies (2016), chương 1"
assumes: [arith]
# Quy ước: “sổ cái” = danh sách giao dịch có thứ tự; “bên tin cậy chung” = một tổ chức mọi bên chấp nhận giữ sổ (ngân hàng, cơ quan đăng ký).
#   Sơ đồ quyết định rút gọn theo Wüst & Gervais (2018). Lời đọc dùng “chuỗi khối” cho blockchain.
objectives:
  - "Phát biểu bài toán chi tiêu hai lần khi không có bên tin cậy chung"
  - "Dùng câu hỏi quyết định: có cần chuỗi khối không"
  - "Biết chuỗi khối không làm dữ liệu đúng"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Tiền số chép được như tệp"
    steps:
      - show: |
          <p>Một tấm ảnh số gửi cho hai người thì cả hai đều có. Nếu “tiền số” chỉ là một tệp, An có thể gửi cùng 5 đồng cho Bình <b>và</b> cho Chi — <b>chi tiêu hai lần</b>. Ngân hàng giải bài này bằng một sổ cái duy nhất mà mọi người tin. Nếu không có ai để mọi người cùng tin thì sao?</p>
          <div class="box key">Hôm nay: <b>sổ cái phân tán</b> — bài toán chi tiêu hai lần, và câu hỏi quan trọng hơn: <b>khi nào thật sự cần</b> chuỗi khối.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, một tấm ảnh số gửi cho hai người thì cả hai đều có. Nếu tiền số chỉ là một tệp, An có thể gửi cùng 5 đồng cho Bình và cho Chi, gọi là chi tiêu hai lần. Ngân hàng giải bài này bằng một sổ cái duy nhất mà mọi người tin. Nếu không có ai để mọi người cùng tin thì sao? Hôm nay ta học sổ cái phân tán, bài toán chi tiêu hai lần, và câu hỏi quan trọng hơn, khi nào thật sự cần chuỗi khối."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: số dư, thứ tự, và tin nhắn tới không cùng lúc"
    checks:
      - "5 - 5 == 0 and 0 - 5 == -5"
      - "0 + 20 == 20 and 10 + 50 == 60 and 20 < 60 and 0 + 90 == 90 and 10 + 30 == 40 and 40 < 90"
    steps:
      - show: |
          <p>An có <b>5 đồng</b> và tạo hai giao dịch: trả Bình 5, trả Chi 5. Người giữ sổ xét lần lượt, giao dịch nào làm số dư âm thì từ chối:</p>
          <table class="t"><tr><th>thứ tự</th><th>giao dịch</th><th>số dư An</th><th>kết quả</th></tr>
          <tr><td>1</td><td>An trả Bình 5</td><td>5 − 5 = 0</td><td>nhận</td></tr>
          <tr><td>2</td><td>An trả Chi 5</td><td>0 − 5 = −5</td><td class="red">từ chối</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Trước hết, ôn cách giữ một sổ cái bằng một ví dụ số nhỏ. An có 5 đồng, và tạo hai giao dịch, trả Bình 5 đồng và trả Chi 5 đồng. Xét giao dịch thứ nhất, số dư của An còn 5 trừ 5, bằng 0, nên giao dịch được nhận. Xét giao dịch thứ hai, số dư sẽ là 0 trừ 5, bằng âm 5, nên người giữ sổ từ chối."
      - show: |
          <p>Đảo thứ tự thì Chi được nhận, còn Bình bị từ chối: <b>kết quả phụ thuộc thứ tự</b>, và ai quyết thứ tự thì người đó quyết ai được tiền.</p>
        focus: [1, 1]
        say: "Nếu đảo thứ tự, giao dịch trả Chi được xét trước, thì Chi được nhận tiền còn Bình bị từ chối. Vậy kết quả phụ thuộc vào thứ tự, và ai quyết thứ tự thì người đó quyết ai được tiền."
      - clear: true
        show: |
          <p><b>Độ trễ</b>: tin nhắn trên mạng đi mất một khoảng thời gian, và mỗi đường đi mất một khoảng khác nhau. An gửi “trả Bình” lúc 0 ms, “trả Chi” lúc 10 ms (số minh hoạ):</p>
          <table class="t"><tr><th>máy giữ sổ</th><th>“trả Bình” tới lúc</th><th>“trả Chi” tới lúc</th><th>thấy trước</th></tr>
          <tr><td>X</td><td>0 + 20 = 20 ms</td><td>10 + 50 = 60 ms</td><td>Bình</td></tr>
          <tr><td>Y</td><td>0 + 90 = 90 ms</td><td>10 + 30 = 40 ms</td><td>Chi</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Nhắc lại từ đầu về độ trễ, tin nhắn trên mạng đi mất một khoảng thời gian, và mỗi đường đi mất một khoảng khác nhau. Lấy số minh hoạ, An gửi giao dịch trả Bình lúc 0 mi li giây, và gửi giao dịch trả Chi lúc 10 mi li giây. Tới máy X, giao dịch trả Bình tới lúc 0 cộng 20, bằng 20, còn trả Chi tới lúc 10 cộng 50, bằng 60, nên X thấy Bình trước. Tới máy Y, trả Bình tới lúc 0 cộng 90, bằng 90, còn trả Chi tới lúc 10 cộng 30, bằng 40, nên Y lại thấy Chi trước."

  - id: sym
    kind: symbol
    title: "Giải mã: sổ cái, chi tiêu hai lần, chuỗi khối"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>sổ cái</b></td><td>danh sách giao dịch có <b>thứ tự</b>: ai trả ai bao nhiêu, cái nào trước</td></tr>
          <tr><td><b>chi tiêu hai lần</b></td><td>hai giao dịch cùng tiêu một khoản; chỉ giải được khi mọi bên <b>đồng ý một thứ tự</b></td></tr>
          <tr><td><b>sổ cái phân tán</b></td><td>nhiều bên cùng giữ bản sao, cùng đồng thuận thêm giao dịch</td></tr>
          <tr><td><b>chuỗi khối</b> (blockchain)</td><td>sổ cái phân tán mà giao dịch gom thành khối, khối nối bằng mã băm, thứ tự chốt bằng một cơ chế đồng thuận</td></tr></table>
          <p class="note"><b>Mã băm</b>: một “dấu vân tay” ngắn tính từ dữ liệu — sửa dữ liệu dù một ký tự là mã đổi hẳn. <b>Cơ chế đồng thuận</b>: luật để mọi bản sao chọn cùng một thứ tự.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Bảng có bốn khái niệm. Sổ cái là danh sách giao dịch có thứ tự, ai trả ai bao nhiêu, cái nào trước. Chi tiêu hai lần là hai giao dịch cùng tiêu một khoản, và chỉ giải được khi mọi bên đồng ý một thứ tự. Sổ cái phân tán là sổ cái mà nhiều bên cùng giữ bản sao, và cùng đồng thuận để thêm giao dịch. Chuỗi khối là một sổ cái phân tán mà giao dịch được gom thành khối, các khối nối với nhau bằng mã băm, và thứ tự được chốt bằng một cơ chế đồng thuận. Mã băm là một dấu vân tay ngắn tính từ dữ liệu, sửa dữ liệu dù chỉ một ký tự thì mã đổi hẳn. Còn cơ chế đồng thuận là luật giúp mọi bản sao chọn cùng một thứ tự."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai bản sổ nhận tin theo hai thứ tự"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><defs><marker id="arB0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="40" y="140" width="280" height="100" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="180" y="200" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">An: 5 đồng</text><rect x="900" y="20" width="560" height="150" rx="12" fill="#f9fafb" stroke="#1f2937" stroke-width="3"/><rect x="900" y="210" width="560" height="150" rx="12" fill="#f9fafb" stroke="#1f2937" stroke-width="3"/><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="320" y1="170" x2="895" y2="95" marker-end="url(#arB0)"/><line x1="320" y1="210" x2="895" y2="285" marker-end="url(#arB0)"/></g><g font-size="24" fill="#1f2937"><text x="1180" y="58" text-anchor="middle" font-weight="bold">Bản sổ X</text><text x="930" y="102" fill="#059669">1) An trả Bình 5: nhận</text><text x="930" y="148" fill="#b91c1c">2) An trả Chi 5: từ chối</text><text x="1180" y="248" text-anchor="middle" font-weight="bold">Bản sổ Y</text><text x="930" y="292" fill="#059669">1) An trả Chi 5: nhận</text><text x="930" y="338" fill="#b91c1c">2) An trả Bình 5: từ chối</text></g><g font-size="22"><text x="380" y="100" fill="#2a78d6">tới X trước: An trả Bình 5</text><text x="380" y="310" fill="#eb6834">tới Y trước: An trả Chi 5</text><text x="40" y="40" fill="#b91c1c" font-size="24">hai bản sổ không khớp</text><text x="40" y="72" fill="#b91c1c" font-size="24">cần đồng thuận một thứ tự</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ điều xảy ra khi không có một người giữ sổ duy nhất. An gửi cả hai giao dịch ra mạng, nhưng bản sổ X nhận giao dịch trả Bình trước, còn bản sổ Y nhận giao dịch trả Chi trước. Mỗi bản sổ đều làm đúng luật số dư, nhận giao dịch đầu và từ chối giao dịch sau. Kết quả là hai bản sổ không khớp nhau, nên các bên cần một cách đồng thuận về một thứ tự chung."

  - id: example
    kind: example
    title: "Có cần chuỗi khối không? Bốn câu hỏi"
    checks:
      - "len(['cần lưu trạng thái', 'nhiều bên cùng ghi', 'không có bên tin cậy chung', 'các bên không tin nhau']) == 4"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>nếu “không”</th></tr>
          <tr><td>① Có cần lưu trạng thái chung không?</td><td>không cần cơ sở dữ liệu nào cả</td></tr>
          <tr><td>② Có <b>nhiều bên</b> cùng ghi không?</td><td>một cơ sở dữ liệu thường là đủ</td></tr>
          <tr><td>③ Có một bên mà <b>mọi người cùng tin</b> không?</td><td>nếu <b>có</b>: để bên đó giữ sổ, kèm nhật ký và chữ ký — rẻ, nhanh hơn nhiều</td></tr>
          <tr><td>④ Các bên ghi có <b>không tin nhau</b> không?</td><td>nếu tin nhau: cơ sở dữ liệu phân tán thường</td></tr></table>
          <p>Chỉ khi ① có, ② có, ③ <b>không</b>, ④ có — chuỗi khối mới đáng cái giá của nó.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng có bốn câu hỏi quyết định. Một, có cần lưu trạng thái chung không, nếu không thì chẳng cần cơ sở dữ liệu nào cả. Hai, có nhiều bên cùng ghi không, nếu không thì một cơ sở dữ liệu thường là đủ. Ba, có một bên mà mọi người cùng tin không, nếu có thì để bên đó giữ sổ, kèm nhật ký và chữ ký, rẻ và nhanh hơn nhiều. Bốn, các bên ghi có không tin nhau không, nếu tin nhau thì dùng cơ sở dữ liệu phân tán thường. Chỉ khi câu một có, câu hai có, câu ba không, và câu bốn có, thì chuỗi khối mới đáng cái giá của nó."
      - clear: true
        show: |
          <p>Áp dụng cho tiền số giữa những người lạ trên mạng, như An, Bình, Chi ở phần mở đầu:</p>
          <table class="t"><tr><th>bước</th><th>câu hỏi</th><th>trả lời</th></tr>
          <tr><td>Bước 1</td><td>① trạng thái chung?</td><td><b>có</b> — mọi bên phải đồng ý số dư của An là 5 đồng</td></tr></table>
        focus: [1, 2]
        say: "Bây giờ áp dụng bốn câu hỏi cho tiền số giữa những người lạ trên mạng, như An, Bình và Chi ở phần mở đầu. Bước một, có trạng thái chung, vì mọi bên phải đồng ý rằng số dư của An đang là 5 đồng."
      - show: |
          <table class="t"><tr><td>Bước 2</td><td>② nhiều bên cùng ghi?</td><td><b>có</b> — An, Bình, Chi và bất kỳ ai cũng tạo giao dịch</td></tr></table>
        say: "Bước hai, có nhiều bên cùng ghi, vì An, Bình, Chi và bất kỳ ai trên mạng cũng có thể tạo giao dịch mới."
      - show: |
          <table class="t"><tr><td>Bước 3</td><td>③ có bên mọi người cùng tin?</td><td><b>không</b> — người lạ ở nhiều nơi, không chung một ngân hàng</td></tr></table>
          <p class="note">Nếu ở đây là “có” thì dừng: để ngân hàng đó giữ sổ là đủ.</p>
        focus: [1, 2]
        say: "Bước ba, không có bên nào mà mọi người cùng tin, vì đây là người lạ ở nhiều nơi, không chung một ngân hàng. Nếu câu này trả lời có, ta dừng ngay ở đây, để ngân hàng đó giữ sổ là đủ."
      - show: |
          <table class="t"><tr><td>Bước 4</td><td>④ các bên không tin nhau?</td><td><b>có</b> — chính An có thể tiêu 5 đồng hai lần</td></tr></table>
          <div class="box key">Có, có, không, có → $\hl{\text{đúng vùng của chuỗi khối}}$.</div>
        focus: [1, 2]
        say: "Bước bốn, các bên không tin nhau, vì chính An có thể gửi cùng 5 đồng cho cả Bình và Chi. Bốn câu trả lời là có, có, không, có, nên tình huống này đúng là vùng mà chuỗi khối đáng dùng."

  - id: check
    kind: check
    title: "Tự kiểm: đếm mọi tổ hợp câu trả lời"
    checks:
      - "2 ** 4 == 16 and sum(1 for a in __import__('itertools').product([True, False], repeat=4) if a[0] and a[1] and not a[2] and a[3]) == 1 and 16 - 1 == 15"
    steps:
      - show: |
          <table class="t"><tr><th>đếm lại bằng cách khác</th><th>kết quả</th></tr>
          <tr><td>4 câu, mỗi câu có hoặc không: $2^4$ tổ hợp</td><td>16</td></tr>
          <tr><td>tổ hợp dẫn tới chuỗi khối: (có, có, không, có)</td><td>1 — đúng tổ hợp vừa tìm ✓</td></tr>
          <tr><td>tổ hợp dừng ở cơ sở dữ liệu, hoặc không cần gì</td><td>15</td></tr></table>
        introduces: [power]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, ta không đi theo từng câu nữa mà đếm mọi tổ hợp câu trả lời. Bốn câu, mỗi câu có hoặc không, nên có 2 mũ 4, bằng 16 tổ hợp. Chỉ đúng một tổ hợp dẫn tới chuỗi khối, là có, có, không, có, trùng với kết luận vừa tìm. 15 tổ hợp còn lại đều dừng ở một cơ sở dữ liệu thường, hoặc không cần lưu gì cả."


  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin chuỗi khối làm dữ liệu đúng <b class="red">(rác vào, rác vĩnh viễn)</b>
          <br><span class="note">Chuỗi khối chỉ làm dữ liệu <b>đã ghi</b> khó sửa. Ai đó ghi “lô thịt này sạch” khi không sạch thì dòng sai đó được lưu vĩnh viễn, rất đáng tin về mặt kỹ thuật.</span></div>
        say: "Lỗi thứ nhất, tin chuỗi khối làm dữ liệu đúng, trong khi rác vào là rác vĩnh viễn. Chuỗi khối chỉ làm dữ liệu đã ghi khó sửa. Ai đó ghi lô thịt này sạch khi không sạch, thì dòng sai đó được lưu vĩnh viễn, và trông rất đáng tin về mặt kỹ thuật."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng chuỗi khối khi đã có bên tin cậy chung <b class="red">(chậm, đắt, không thêm gì)</b>
          <br><span class="note">Một công ty tự chạy “chuỗi khối riêng” với mọi nút do chính mình giữ: không có bên nào cần thuyết phục, chỉ thêm chi phí đồng thuận.</span></div>
        say: "Lỗi thứ hai, dùng chuỗi khối khi đã có bên tin cậy chung, nên chậm, đắt, và không thêm được gì. Một công ty tự chạy chuỗi khối riêng với mọi nút do chính mình giữ thì không có bên nào cần thuyết phục, chỉ thêm chi phí đồng thuận."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Lẫn “phi tập trung” với “ẩn danh” <b class="red">(mọi giao dịch công khai mãi mãi)</b>
          <br><span class="note">Trên chuỗi công khai, ai cũng đọc được mọi giao dịch. Địa chỉ không phải tên thật, nhưng liên kết nhiều giao dịch có thể lộ danh tính.</span></div>
        say: "Lỗi thứ ba, lẫn phi tập trung với ẩn danh, trong khi mọi giao dịch công khai mãi mãi. Trên chuỗi công khai, ai cũng đọc được mọi giao dịch. Địa chỉ không phải tên thật, nhưng liên kết nhiều giao dịch có thể làm lộ danh tính."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Trường đại học muốn cấp bằng tốt nghiệp “không thể giả mạo”. Trường là bên mọi người tin. Có cần chuỗi khối không?</td></tr>
          <tr><td>2</td><td>Năm công ty vận tải đối thủ muốn chung một sổ ghi hàng giao nhận, không ai chịu để đối thủ giữ sổ. Có đáng dùng không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, một trường đại học muốn cấp bằng tốt nghiệp không thể giả mạo. Trường là bên mọi người tin. Có cần chuỗi khối không? Câu hai, năm công ty vận tải đối thủ muốn chung một sổ ghi hàng giao nhận, và không ai chịu để đối thủ giữ sổ. Có đáng dùng không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1</th><th>trả lời</th></tr>
          <tr><td>② nhiều bên cùng ghi?</td><td>không — chỉ trường cấp bằng</td></tr>
          <tr><td>③ có bên mọi người tin?</td><td>có — chính trường</td></tr></table>
          <p><b>Kết luận câu 1: không cần chuỗi khối</b> — trường ký số văn bằng và công bố khoá công khai; ai cũng kiểm được, không cần đồng thuận.</p>
          <p class="note"><b>Chữ ký số</b>: một con số chỉ người giữ <b>khoá bí mật</b> tạo được; ai có <b>khoá công khai</b> tương ứng (được công bố) cũng kiểm được chữ ký có đúng không.</p>
        focus: [1, "1.2", "1.3", 2, 3]
        say: "Đáp án câu một, đi theo bốn câu hỏi. Ở câu hỏi hai, chỉ có trường cấp bằng, nên không có nhiều bên cùng ghi. Ở câu hỏi ba, chính trường là bên mà mọi người tin. Vậy không cần, vì trường ký số văn bằng và công bố khoá công khai, ai cũng kiểm được mà không cần đồng thuận. Ở đây chữ ký số là một con số chỉ người giữ khoá bí mật mới tạo được, còn ai có khoá công khai được công bố cũng kiểm được chữ ký đó có đúng hay không."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2</th><th>①</th><th>②</th><th>③</th><th>④</th></tr>
          <tr><td>năm công ty vận tải</td><td>có</td><td>có</td><td>không</td><td>có</td></tr></table>
          <p><b>Kết luận câu 2: có thể đáng dùng</b> — nhiều bên cùng ghi, không có bên tin cậy chung, không tin nhau — đúng vùng của sổ cái phân tán (thường là chuỗi có cấp phép, tức chỉ những bên đã đăng ký mới được ghi, giữa năm bên).</p>
        focus: [1, 2, 2]
        say: "Câu hai, bốn câu trả lời là có, có, không, có, đúng tổ hợp duy nhất mà ta vừa đếm. Vậy có thể đáng dùng, vì có nhiều bên cùng ghi, không có bên tin cậy chung, và không tin nhau. Đó đúng là vùng của sổ cái phân tán, thường là một chuỗi có cấp phép, tức chỉ những bên đã đăng ký mới được ghi, giữa năm bên."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tiền số chép được → chi tiêu hai lần</span><span class="a">→</span>
          <span class="n">cần một thứ tự mọi bên đồng ý</span><span class="a">→</span>
          <span class="n">có bên tin cậy chung: cơ sở dữ liệu + chữ ký</span><span class="a">→</span>
          <span class="n">không có, nhiều bên không tin nhau: chuỗi khối</span></div>
        say: "Tổng kết lại, tiền số chép được nên có bài toán chi tiêu hai lần, cần một thứ tự mà mọi bên đồng ý. Có bên tin cậy chung thì dùng cơ sở dữ liệu cùng chữ ký, còn không có, và nhiều bên không tin nhau, thì mới dùng chuỗi khối."
      - show: |
          <div class="box key"><b>Tư duy:</b> chuỗi khối thay <b>niềm tin vào một tổ chức</b> bằng <b>niềm tin vào toán học và động cơ kinh tế</b> — chỉ đáng khi cái trước không có.</div>
        say: "Điều cần mang theo, chuỗi khối thay niềm tin vào một tổ chức bằng niềm tin vào toán học và động cơ kinh tế, và chỉ đáng dùng khi cái trước không có."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>chuỗi liên kết bằng băm</b> — sửa một khối làm hỏng mọi khối sau.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học chuỗi liên kết bằng băm, vì sao sửa một khối làm hỏng mọi khối sau. Hẹn gặp bạn ở bài tiếp theo."
