id: L07
course: BCH
series: "BCH · Blockchain và sổ cái phân tán"
title: "Bài 7 — Bằng chứng cổ phần và tính cuối cùng theo đa số hai phần ba"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/bch.yaml L07; audit/bch/verify_bch.py L07; M. Castro, B. Liskov, Practical Byzantine Fault Tolerance (OSDI 1999) — n ≥ 3f + 1; V. Buterin, V. Griffith, Casper the Friendly Finality Gadget (2017); L. Lamport, R. Shostak, M. Pease, The Byzantine Generals Problem (1982); bài 6"
assumes: [arith, frac, floor, cdot]
# Quy ước: n bên xác thực cùng quyền biểu quyết, tối đa f bên gian lận tuỳ ý (lỗi Byzantine). Chịu được khi n ≥ 3f + 1; khối được CHỐT khi có ít nhất
#   n − f phiếu, bằng 2f + 1 khi n = 3f + 1 (alg.bft_tolerance). Với cổ phần không đều, “số bên” thay bằng TỈ LỆ cổ phần: chốt cần trên hai phần ba cổ phần.
objectives:
  - "Giải thích điều kiện n ≥ 3f + 1"
  - "Tính số phiếu chốt"
  - "So sánh tính cuối cùng xác suất và tính cuối cùng tất định"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Không đào, mà đặt cọc"
    checks:
      - "alg.bft_tolerance(100) == (33, 67)"
    steps:
      - show: |
          <p>Bằng chứng công việc giữ an toàn bằng điện năng. Một cách khác: mỗi bên xác thực <b>đặt cọc</b> tài sản; ai ký hai khối mâu thuẫn bị tịch thu cọc. Thay vì “chuỗi dài nhất thắng”, các bên <b>bỏ phiếu</b>, và khi đủ hai phần ba thì khối được chốt — <b>không thể đảo ngược</b> mà không có người mất cọc.</p>
          <div class="box key">Hôm nay: <b>bằng chứng cổ phần</b> và điều kiện chịu lỗi n ≥ 3f + 1 của đồng thuận kiểu bỏ phiếu.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, bằng chứng công việc giữ an toàn bằng điện năng. Một cách khác là mỗi bên xác thực đặt cọc tài sản, và ai ký hai khối mâu thuẫn bị tịch thu cọc. Thay vì chuỗi dài nhất thắng, các bên bỏ phiếu, và khi đủ hai phần ba thì khối được chốt, không thể đảo ngược mà không có người mất cọc. Hôm nay ta học bằng chứng cổ phần, và điều kiện chịu lỗi n không nhỏ hơn 3 f cộng 1 của đồng thuận kiểu bỏ phiếu."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hai nhóm trong một lớp luôn chung nhau bao nhiêu người"
    checks:
      - "len(set(range(1, 7)) & set(range(5, 11))) == 2 and 6 + 6 - 10 == 2 and 6 + 6 == 12"
      - "min(len(set(a) & set(b)) for a in __import__('itertools').combinations(range(10), 6) for b in __import__('itertools').combinations(range(10), 6)) == 2"
      - "7 // 3 == 2 and 3 * 2 == 6 and 3 * 3 == 9 and 99 // 3 == 33"
    steps:
      - show: |
          <p>Ở bài 6: mỗi nút theo chuỗi có <b>tổng công lớn nhất</b>; xác suất kẻ tấn công đảo được giao dịch giảm dần theo số khối xác nhận, nhưng <b>không bao giờ về 0</b>.</p>
          <p>Hôm nay ta tìm một cách chốt mà khi đã chốt thì <b>chắc chắn</b> không đảo được, nếu số bên gian lận không quá một giới hạn.</p>
        focus: [1, 1, 2]
        say: "Trước hết, nhắc lại điều đã học ở bài 6. Mỗi nút theo chuỗi có tổng công lớn nhất, và xác suất kẻ tấn công đảo được giao dịch giảm dần theo số khối xác nhận, nhưng không bao giờ về 0. Hôm nay ta tìm một cách chốt mà khi đã chốt thì chắc chắn không đảo được, miễn là số bên gian lận không vượt quá một giới hạn."
      - show: |
          <p>Lớp có 10 bạn. Nhóm A: 6 bạn, nhóm B: 6 bạn. Cộng lại $6 + 6 = 12$, nhiều hơn 10 người có thật, nên ít nhất $12 - 10 = \hl{2}$ bạn bị đếm hai lần — tức thuộc <b>cả hai</b> nhóm.</p>
          <table class="t"><tr><th>xếp thử</th><th>nhóm A</th><th>nhóm B</th><th>chung</th></tr>
          <tr><td>tách xa nhất có thể</td><td>bạn 1 tới 6</td><td>bạn 5 tới 10</td><td>bạn 5 và 6</td></tr></table>
        focus: [1, 1, 2, "2.2"]
        say: "Bây giờ là một phép đếm đời thường. Lớp có 10 bạn, nhóm A có 6 bạn, nhóm B cũng có 6 bạn. Cộng lại được 12, nhiều hơn 10 người có thật, nên ít nhất 12 trừ 10, bằng 2 bạn bị đếm hai lần, tức là thuộc cả hai nhóm. Thử xếp hai nhóm xa nhau nhất có thể, nhóm A là bạn 1 tới 6, nhóm B là bạn 5 tới 10, thì vẫn chung nhau bạn 5 và bạn 6."
      - clear: true
        show: |
          <p>Quy tắc: hai nhóm cỡ $a$ và $b$ trong $n$ người chung nhau ít nhất $a + b - n$ người.</p>
          <p><b>Phần nguyên</b> $\lfloor x \rfloor$: số nguyên lớn nhất không vượt $x$. Ví dụ $\lfloor \frac{7}{3} \rfloor = 2$, vì $3 \cdot 2 = 6$ chưa vượt 7, còn $3 \cdot 3 = 9$ đã vượt; $\lfloor \frac{99}{3} \rfloor = 33$.</p>
        focus: [1, 2, 2]
        say: "Quy tắc rút ra là hai nhóm cỡ a và b trong n người luôn chung nhau ít nhất a cộng b trừ n người. Thứ hai, ta sẽ dùng phần nguyên, là số nguyên lớn nhất không vượt quá một số cho trước. Ví dụ phần nguyên của 7 chia 3 bằng 2, vì 3 nhân 2 bằng 6 chưa vượt 7, còn 3 nhân 3 bằng 9 đã vượt, và phần nguyên của 99 chia 3 bằng 33."

  - id: sym
    kind: symbol
    title: "Giải mã: vì sao cần hai phần ba"
    steps:
      - show: |
          <table class="t"><tr><th>ký hiệu</th><th>nghĩa</th></tr>
          <tr><td>$n$</td><td>số bên xác thực (cùng quyền biểu quyết)</td></tr>
          <tr><td>$f$</td><td>số bên gian lận tối đa: có thể nói dối, ký hai phía, im lặng</td></tr>
          <tr><td>điều kiện</td><td>$n \geq 3f + 1$; chốt cần $n - f$ phiếu (bằng $2f + 1$ khi $n = 3f + 1$)</td></tr></table>
          <p><b>Vì sao</b>: đợi tới khi có $n - f$ phiếu (f bên có thể im lặng). Hai nhóm $n - f$ phiếu bất kỳ chung nhau ít nhất $n - 2f$ bên; muốn phần chung có ít nhất <b>một bên trung thực</b> thì $n - 2f \geq f + 1$, tức $n \geq 3f + 1$. Nên không thể chốt hai khối mâu thuẫn.</p>
        introduces: [geq]
        focus: [1, "1.2", "1.3", "1.4", 2, 2, 2, 2]
        say: "Bảng có ba ký hiệu. n là số bên xác thực, cùng quyền biểu quyết. f là số bên gian lận tối đa, có thể nói dối, ký cho cả hai phía, hay im lặng. Điều kiện là n không nhỏ hơn 3 f cộng 1, và chốt cần n trừ f phiếu, đúng bằng 2 f cộng 1 khi n bằng 3 f cộng 1. Lý do là ta chỉ đợi được tới khi có n trừ f phiếu, vì f bên có thể im lặng. Hai nhóm n trừ f phiếu bất kỳ chung nhau ít nhất n trừ 2 f bên. Muốn phần chung có ít nhất một bên trung thực thì n trừ 2 f phải không nhỏ hơn f cộng 1, tức n không nhỏ hơn 3 f cộng 1. Khi đó không thể chốt hai khối mâu thuẫn."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bốn bên, hai nhóm chốt, một bên chung trung thực"
    checks:
      - "alg.bft_tolerance(4) == (1, 3) and 3 + 3 - 4 == 2 and 2 - 1 == 1"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><text x="600" y="38" font-size="24" text-anchor="middle" fill="#2a78d6">nhóm chốt A: 3 phiếu</text><line x1="235" y1="58" x2="965" y2="58" stroke="#2a78d6" stroke-width="8"/><rect x="515" y="92" width="470" height="156" rx="24" fill="none" stroke="#059669" stroke-width="4" stroke-dasharray="14 10"/><circle cx="300" cy="170" r="62" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="300" y="166" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">bên 1</text><text x="300" y="196" font-size="19" text-anchor="middle" fill="#1f2937">trung thực</text><circle cx="600" cy="170" r="62" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><text x="600" y="166" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">bên 2</text><text x="600" y="196" font-size="19" text-anchor="middle" fill="#b91c1c">gian lận</text><circle cx="900" cy="170" r="62" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="900" y="166" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">bên 3</text><text x="900" y="196" font-size="19" text-anchor="middle" fill="#1f2937">trung thực</text><circle cx="1200" cy="170" r="62" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="1200" y="166" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">bên 4</text><text x="1200" y="196" font-size="19" text-anchor="middle" fill="#1f2937">trung thực</text><line x1="535" y1="282" x2="1265" y2="282" stroke="#eb6834" stroke-width="8"/><text x="900" y="318" font-size="24" text-anchor="middle" fill="#eb6834">nhóm chốt B: 3 phiếu</text><text x="750" y="362" font-size="24" text-anchor="middle" fill="#059669">phần chung 2 bên, gian lận tối đa 1 bên: luôn còn 1 bên trung thực</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ 4 bên xác thực, trong đó tối đa 1 bên gian lận, ở đây là bên 2 tô đỏ. Muốn chốt cần 3 phiếu, nên nhóm chốt A có thể là bên 1, 2 và 3, còn nhóm chốt B có thể là bên 2, 3 và 4. Hai nhóm luôn chung nhau ít nhất 3 cộng 3 trừ 4, bằng 2 bên, khung xanh lục đứt nét. Vì chỉ có 1 bên gian lận, trong phần chung luôn còn ít nhất 1 bên trung thực, và bên đó không bao giờ ký cho hai khối mâu thuẫn."

  - id: example
    kind: example
    title: "100 bên xác thực"
    checks:
      - "alg.bft_tolerance(100) == (33, 67) and 3 * 33 + 1 <= 100 < 3 * 34 + 1 and 2 * (100 - 33) - 100 == 34"
      - "99 // 3 == 33 and 3 * 34 + 1 == 103 and 3 * 33 + 1 == 100 and 2 * 33 + 1 == 67 and 67 + 67 - 100 == 34 and 34 - 33 == 1"
    steps:
      - show: |
          <p><b>Bước 1 — số bên gian lận chịu được:</b> $f = \lfloor \frac{100 - 1}{3} \rfloor = \lfloor \frac{99}{3} \rfloor = \hl{33}$.</p>
          <p>Thử $f = 34$: cần $3 \cdot 34 + 1 = 103 \gt 100$ bên — không đủ.</p>
        introduces: [ltgt]
        focus: [1, 1, 2]
        say: "Bước một, tìm số bên gian lận chịu được với 100 bên xác thực. f bằng phần nguyên của 100 trừ 1 chia 3, tức 99 chia 3, bằng 33. Thử f bằng 34 thì cần 3 nhân 34 cộng 1, bằng 103 bên, đã vượt 100 bên đang có."
      - show: |
          <p><b>Bước 2 — phiếu cần để chốt:</b> $n - f = 100 - 33 = \hl{67}$.</p>
          <p>Vì $100 = 3 \cdot 33 + 1$ nên con số này cũng đúng bằng $2 \cdot 33 + 1 = 67$.</p>
        focus: [1, 2]
        say: "Bước hai, số phiếu cần để chốt là n trừ f, bằng 100 trừ 33, bằng 67 phiếu. Vì 100 đúng bằng 3 nhân 33 cộng 1, nên con số này cũng bằng 2 nhân 33 cộng 1, vẫn là 67."
      - show: |
          <p><b>Bước 3 — phần chung của hai nhóm chốt:</b> theo phép đếm hai nhóm trong lớp, hai nhóm 67 phiếu trong 100 bên chung nhau ít nhất</p>
          $$67 + 67 - 100 = \hl{34} 	ext{ bên}$$
        focus: [1, 2]
        say: "Bước ba, dùng phép đếm hai nhóm trong lớp ở phần chuẩn bị. Hai nhóm 67 phiếu trong 100 bên luôn chung nhau ít nhất 67 cộng 67 trừ 100, bằng 34 bên."
      - show: |
          <p><b>Bước 4 — kết luận:</b> $34 \gt 33$: dù cả 33 bên gian lận cùng nằm trong phần chung, vẫn còn ít nhất $34 - 33 = 1$ bên trung thực.</p>
          <p>Bên trung thực đó không ký hai khối mâu thuẫn, nên hai khối mâu thuẫn <b>không thể cùng có 67 phiếu</b>.</p>
        focus: [1, 2]
        say: "Bước bốn, 34 lớn hơn 33, nên dù cả 33 bên gian lận cùng nằm trong phần chung, vẫn còn ít nhất 34 trừ 33, bằng 1 bên trung thực. Bên trung thực đó không ký hai khối mâu thuẫn, nên hai khối mâu thuẫn không thể cùng có 67 phiếu."

  - id: check
    kind: check
    title: "Tự kiểm: cho máy liệt kê mọi nhóm chốt"
    checks:
      - "(lambda it: [(len(list(it.combinations(range(n), q))), min(len(set(a) & set(b)) for a in it.combinations(range(n), q) for b in it.combinations(range(n), q))) for n, q in ((4, 3), (7, 5), (3, 2))])(__import__('itertools')) == [(4, 2), (21, 3), (3, 1)]"
      - "alg.bft_tolerance(4) == (1, 3) and alg.bft_tolerance(7) == (2, 5) and alg.bft_tolerance(3) == (0, 3)"
    steps:
      - show: |
          <table class="t"><tr><th>n bên, f gian lận</th><th>phiếu chốt</th><th>số nhóm chốt có thể</th><th>phần chung nhỏ nhất</th><th>kết luận</th></tr>
          <tr><td>4, 1</td><td>3</td><td>4</td><td>2</td><td>$2 \gt 1$: an toàn</td></tr>
          <tr><td>7, 2</td><td>5</td><td>21</td><td>3</td><td>$3 \gt 2$: an toàn</td></tr>
          <tr><td>3, muốn chịu 1</td><td>chỉ đợi được 2</td><td>3</td><td>1</td><td>phần chung có thể toàn gian lận</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, không dùng công thức mà cho máy liệt kê mọi nhóm chốt có thể, rồi đo phần chung nhỏ nhất của từng cặp. Với 4 bên, có 4 nhóm 3 phiếu, phần chung nhỏ nhất là 2, lớn hơn 1 bên gian lận, nên an toàn. Với 7 bên chịu 2 gian lận, có 21 nhóm 5 phiếu, phần chung nhỏ nhất là 3, vẫn an toàn. Còn 3 bên mà muốn chịu 1 bên gian lận thì chỉ đợi được 2 phiếu, phần chung có thể chỉ 1 bên, và đó có thể chính là bên gian lận, nên 3 bên là không đủ."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay mắc, từ người mới tới người đã đi làm"
    checks:
      - "100 - 40 == 60 and 60 < 200 / 3 and 100 - 30 == 70 and 70 > 200 / 3 and 40 + 35 + 25 == 100 and 30 + 30 + 20 + 20 == 100 and round(200 / 3, 1) == 66.7"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đếm theo số người thay vì cổ phần <b class="red">(một bên lớn có nhiều phiếu)</b>
          <br><span class="note">Trong bằng chứng cổ phần, phiếu tính theo cổ phần. Một bên nắm 34% cổ phần đủ để <b>chặn</b> mọi lần chốt, dù chỉ là một “người”.</span></div>
        say: "Lỗi thứ nhất, đếm theo số người thay vì theo cổ phần, trong khi một bên lớn có nhiều phiếu. Trong bằng chứng cổ phần, phiếu tính theo cổ phần. Một bên nắm 34 phần trăm cổ phần đủ để chặn mọi lần chốt, dù chỉ là một người."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lẫn an toàn với sống còn <b class="red">(quá một phần ba ngoại tuyến là dừng)</b>
          <br><span class="note">Khi hơn một phần ba cổ phần mất kết nối, chuỗi <b>không chốt được</b> khối mới — an toàn vẫn giữ, nhưng hệ đứng lại. Chuỗi theo công nhiều nhất thì ngược lại: luôn chạy tiếp, nhưng chỉ cuối cùng theo xác suất.</span></div>
        say: "Lỗi thứ hai, lẫn an toàn với sống còn, vì khi quá một phần ba ngoại tuyến thì hệ dừng. Khi hơn một phần ba cổ phần mất kết nối, chuỗi không chốt được khối mới, an toàn vẫn giữ nhưng hệ đứng lại. Chuỗi theo công nhiều nhất thì ngược lại, luôn chạy tiếp, nhưng chỉ cuối cùng theo xác suất."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Một bên xác thực chạy trên hai máy cùng khoá <b class="red">(tự ký hai lần, mất cọc)</b>
          <br><span class="note">Chạy dự phòng “cho chắc” bằng hai máy cùng khoá: cả hai cùng ký, thành ký hai khối mâu thuẫn, bị phạt. Dự phòng phải có cơ chế bảo đảm chỉ một máy ký.</span></div>
        say: "Lỗi thứ ba, một bên xác thực chạy trên hai máy cùng khoá, nên tự ký hai lần và mất cọc. Chạy dự phòng cho chắc bằng hai máy cùng khoá thì cả hai cùng ký, thành ký hai khối mâu thuẫn, và bị phạt. Dự phòng phải có cơ chế bảo đảm chỉ một máy ký."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đếm số bên mà quên chỗ đặt máy <b class="red">(một sự cố, mất quá một phần ba)</b></div>
          <table class="t"><tr><th>cổ phần theo nhà cung cấp máy chủ (số minh hoạ)</th><th>nơi lớn nhất gặp sự cố</th><th>còn trực tuyến</th><th>chốt được?</th></tr>
          <tr><td>40%, 35%, 25%</td><td>mất 40%</td><td>$60\% \lt 66{,}7\%$</td><td>không, hệ đứng</td></tr>
          <tr><td>30%, 30%, 20%, 20%</td><td>mất 30%</td><td>$70\% \gt 66{,}7\%$</td><td>vẫn chốt</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 0]
        say: "Lỗi thứ tư thường gặp ở người đã đi làm, đếm đủ số bên xác thực, nhưng quên rằng nhiều bên đặt máy ở cùng một nơi. Với số minh hoạ, cổ phần nằm ở ba nhà cung cấp máy chủ, 40, 35 và 25 phần trăm. Nơi lớn nhất gặp sự cố thì chỉ còn 60 phần trăm trực tuyến, chưa tới hai phần ba, nên hệ không chốt được khối mới. Chia thành bốn nơi, lớn nhất 30 phần trăm, thì mất nơi đó vẫn còn 70 phần trăm, vẫn chốt được. Người vận hành có kinh nghiệm cộng cổ phần theo từng thứ có thể hỏng cùng lúc, như nhà cung cấp, vùng, phần mềm, và giữ mỗi nhóm dưới một phần ba."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.bft_tolerance(4) == (1, 3) and alg.bft_tolerance(10) == (3, 7)"
      - "(4 - 1) // 3 == 1 and 3 + 3 - 4 == 2 and 3 * 1 + 1 == 4 and (10 - 1) // 3 == 3 and 3 * 4 + 1 == 13 and 7 + 7 - 10 == 4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>4 bên xác thực: chịu được mấy bên gian lận, cần mấy phiếu để chốt?</td></tr>
          <tr><td>2</td><td>10 bên xác thực: f và số phiếu chốt?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, có 4 bên xác thực, chịu được mấy bên gian lận, và cần mấy phiếu để chốt? Câu hai, có 10 bên xác thực, f và số phiếu chốt là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① $f = \lfloor \frac{4 - 1}{3} \rfloor = 1$; chốt cần $4 - 1 = \hl{3}$ phiếu.</p>
          <p>Thử lại: hai nhóm 3 phiếu chung ít nhất $3 + 3 - 4 = 2 \gt 1$. Và $3 \cdot 1 + 1 = 4$: 4 là số bên nhỏ nhất chịu được 1 bên gian lận.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, f bằng phần nguyên của 4 trừ 1 chia 3, bằng 1, và chốt cần 4 trừ 1, bằng 3 phiếu. Thử lại, hai nhóm 3 phiếu chung nhau ít nhất 3 cộng 3 trừ 4, bằng 2 bên, lớn hơn 1. Vì 3 nhân 1 cộng 1 bằng 4, nên 4 là số bên nhỏ nhất chịu được 1 bên gian lận."
      - show: |
          <p>② $f = \lfloor \frac{10 - 1}{3} \rfloor = \lfloor \frac{9}{3} \rfloor = 3$ (thử $f = 4$: $3 \cdot 4 + 1 = 13 \gt 10$); chốt cần $10 - 3 = \hl{7}$ phiếu.</p>
          <p>Thử lại: $7 + 7 - 10 = 4 \gt 3$ — phần chung luôn có bên trung thực.</p>
        focus: [1, 1, 2]
        say: "Câu hai, f bằng phần nguyên của 9 chia 3, bằng 3, vì thử f bằng 4 thì cần 13 bên, vượt 10 bên đang có. Chốt cần 10 trừ 3, bằng 7 phiếu. Thử lại, hai nhóm 7 phiếu chung nhau ít nhất 7 cộng 7 trừ 10, bằng 4 bên, lớn hơn 3, nên phần chung luôn có bên trung thực."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đặt cọc, ký sai bị tịch thu</span><span class="a">→</span>
          <span class="n">$n \geq 3f + 1$, chốt với $n - f$ phiếu</span><span class="a">→</span>
          <span class="n">hai nhóm chốt luôn chung một bên trung thực</span><span class="a">→</span>
          <span class="n">tính theo cổ phần; quá một phần ba ngoại tuyến là dừng</span></div>
        say: "Tổng kết lại, các bên đặt cọc, và ký sai bị tịch thu. Điều kiện là n không nhỏ hơn 3 f cộng 1, chốt với n trừ f phiếu, nên hai nhóm chốt luôn chung một bên trung thực. Phiếu tính theo cổ phần, và quá một phần ba ngoại tuyến thì hệ dừng."
      - show: |
          <div class="box key"><b>Tư duy:</b> an toàn đến từ <b>giao nhau</b> — hai quyết định mâu thuẫn không thể cùng được một đa số đủ lớn chấp nhận.</div>
        say: "Điều cần mang theo, an toàn đến từ sự giao nhau, vì hai quyết định mâu thuẫn không thể cùng được một đa số đủ lớn chấp nhận."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 8): <b>hợp đồng thông minh</b> — máy trạng thái tất định và phí thực thi.</p>
        forward_ref: true
        say: "Ở bài sau, bài 8, ta học hợp đồng thông minh, máy trạng thái tất định, và phí thực thi. Hẹn gặp bạn ở bài tiếp theo."
