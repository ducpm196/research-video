      stroke="#1f2937" stroke-width="3" marker-end="url(#arB4)"/><circle cx="1060" cy="90" r="44" fill="#f3f4f6" stroke="#1f2937"
      stroke-width="3"/><text x="1060" y="100" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">6</text><circle
      cx="1060" cy="200" r="44" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="1060" y="210" font-size="28" font-weight="bold"
      text-anchor="middle" fill="#059669">1,9</text><text x="1120" y="98">người nhận</text><text x="1120" y="208" fill="#059669">tiền
