id: L04
course: BCH
series: "BCH · Blockchain và sổ cái phân tán"
title: "Bài 4 — Mô hình đồng chưa tiêu và mô hình tài khoản"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/bch.yaml L04; audit/bch/verify_bch.py L04; S. Nakamoto (2008), mục 2 và 9 (giao dịch, gộp và tách giá trị); G. Wood, Ethereum Yellow Paper (mô hình tài khoản, bản hiện hành); A. Narayanan và cộng sự (2016), chương 3; bài 3"
assumes: [arith]
# Quy ước: mỗi “đồng chưa tiêu” là một đầu ra của giao dịch trước, phải tiêu TRỌN; giao dịch = đầu vào (đồng tiêu) + đầu ra (người nhận, tiền thừa);
#   phí = tổng vào − tổng ra. Chọn đồng từ lớn tới nhỏ (alg.utxo_select) — chỉ là một cách chọn đơn giản. Số tiền tính theo đơn vị tuỳ ý (SỐ MINH HOẠ).
objectives:
  - "Lập giao dịch từ các đồng chưa tiêu"
  - "Tính tiền thừa và phí"
  - "So sánh với mô hình số dư tài khoản"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Trả 6 đồng bằng tờ 5 và tờ 3"
    checks:
      - "alg.utxo_select([5, 3, 2], 6, 0.1) == ([5, 3], 6, 1.9)"
    steps:
      - show: |
          <p>Trong ví có ba “tờ tiền”: 5, 3 và 2. Bạn cần trả 6, phí 0,1. Không xé được tờ 5 ra làm đôi — phải đưa <b>trọn</b> vài tờ cộng lại đủ 6,1, chẳng hạn tờ 5 và tờ 3, rồi nhận lại tiền thừa. Chuỗi khối đầu tiên giữ tiền đúng theo cách đó: không có “số dư”, chỉ có những <b>đồng chưa tiêu</b>.</p>
          <div class="box key">Hôm nay: <b>mô hình đồng chưa tiêu</b> — giao dịch tiêu trọn các đồng cũ và tạo đồng mới — so với <b>mô hình tài khoản</b> có số dư.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, trong ví có ba tờ tiền là 5, 3 và 2. Bạn cần trả 6, với phí 0 phẩy 1. Không xé được tờ 5 ra làm đôi, nên phải đưa trọn vài tờ cộng lại đủ 6 phẩy 1, chẳng hạn tờ 5 và tờ 3, rồi nhận lại tiền thừa. Chuỗi khối đầu tiên giữ tiền đúng theo cách đó, không có số dư, chỉ có những đồng chưa tiêu. Hôm nay ta học mô hình đồng chưa tiêu, nơi giao dịch tiêu trọn các đồng cũ và tạo đồng mới, so với mô hình tài khoản có số dư."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: trừ số thập phân và chữ ký của chủ đồng"
    checks:
      - "8 - 6 == 2 and round(2 - 0.1, 6) == 1.9 and round(6 + 1.9, 6) == 7.9 and round(8 - 7.9, 6) == 0.1"
      - "pow(3010, 2753, 3233) == 2164 and pow(2164, 17, 3233) == 3010"
    steps:
      - show: |
          <table class="t"><tr><th>phép tính</th><th>làm từng bước</th><th>kết quả</th></tr>
          <tr><td>$8 - 6 - 0{,}1$</td><td>$8 - 6 = 2$, rồi $2 - 0{,}1$</td><td>$1{,}9$</td></tr>
          <tr><td>thử lại bằng phép cộng</td><td>$6 + 0{,}1 + 1{,}9$</td><td>$8$ ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Trước hết, ôn phép trừ số thập phân, vì cả bài tính tiền thừa bằng nó. 8 trừ 6 trừ 0 phẩy 1, ta làm từng bước, 8 trừ 6 bằng 2, rồi 2 trừ 0 phẩy 1 bằng 1 phẩy 9. Thử lại bằng phép cộng, 6 cộng 0 phẩy 1 cộng 1 phẩy 9 bằng đúng 8, nên phép trừ đúng."
      - show: |
          <table class="t"><tr><th>ở bài 3, chữ ký số</th><th>ví dụ khoá đồ chơi</th></tr>
          <tr><td>chủ ký băm giao dịch bằng khoá bí mật</td><td>băm 3010 → chữ ký 2164</td></tr>
          <tr><td>ai cũng kiểm bằng khoá công khai</td><td>2164 mũ 17, lấy dư 3233 → 3010 ✓</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Tiếp theo, nhắc lại chữ ký số ở bài 3, vì mỗi lần tiêu một đồng đều phải có chữ ký của chủ. Chủ ký lên băm của giao dịch bằng khoá bí mật, với khoá đồ chơi thì băm 3010 cho ra chữ ký 2164. Ai cũng kiểm được bằng khoá công khai, 2164 mũ 17 chia lấy dư cho 3233 ra lại 3010, khớp với băm."

  - id: sym
    kind: symbol
    title: "Giải mã: đầu vào, đầu ra, tiền thừa, phí"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>đồng chưa tiêu</b></td><td>một đầu ra của giao dịch trước, gắn với một địa chỉ, chưa ai tiêu</td></tr>
          <tr><td><b>đầu vào</b></td><td>chỉ tới các đồng chưa tiêu, kèm chữ ký của chủ (bài 3); mỗi đồng tiêu <b>trọn</b> và chỉ một lần</td></tr>
          <tr><td><b>đầu ra</b></td><td>đồng mới: cho người nhận, và <b>tiền thừa</b> trả về chính mình</td></tr>
          <tr><td><b>phí</b></td><td>tổng vào − tổng ra, người tạo khối (bên gom giao dịch vào khối mới) giữ</td></tr></table>
          <p><b>Mô hình tài khoản</b>: mỗi địa chỉ có một số dư; giao dịch trừ bên này, cộng bên kia, kèm số thứ tự để chống phát lại; số dư lưu sẵn, còn đồng chưa tiêu thì số dư phải cộng ra.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng có bốn khái niệm. Đồng chưa tiêu là một đầu ra của giao dịch trước, gắn với một địa chỉ, và chưa ai tiêu. Đầu vào chỉ tới các đồng chưa tiêu, kèm chữ ký của chủ như ở bài 3, và mỗi đồng phải tiêu trọn, chỉ một lần. Đầu ra là các đồng mới, cho người nhận, và tiền thừa trả về chính mình. Phí bằng tổng vào trừ tổng ra, người tạo khối, tức bên gom giao dịch vào khối mới, giữ phần này. Ngược lại, mô hình tài khoản lưu sẵn số dư mỗi địa chỉ, giao dịch trừ bên này cộng bên kia kèm số thứ tự chống phát lại, còn đồng chưa tiêu thì số dư phải cộng ra."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đồng cũ vào, đồng mới ra"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arB4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="22" fill="#1f2937"><text x="160" y="30" text-anchor="middle" font-weight="bold">ví trước</text><text x="1130" y="30" text-anchor="middle" font-weight="bold">sau giao dịch</text><circle cx="160" cy="90" r="44" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/><text x="160" y="100" font-size="28" font-weight="bold" text-anchor="middle" fill="#2a78d6">5</text><circle cx="160" cy="200" r="44" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/><text x="160" y="210" font-size="28" font-weight="bold" text-anchor="middle" fill="#2a78d6">3</text><circle cx="160" cy="360" r="44" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/><text x="160" y="370" font-size="28" font-weight="bold" text-anchor="middle" fill="#2a78d6">2</text><text x="215" y="140" fill="#b91c1c">đã tiêu</text><rect x="470" y="50" width="360" height="200" rx="14" fill="#fff7ed" stroke="#eb6834" stroke-width="3"/><text x="650" y="95" text-anchor="middle" font-size="26" font-weight="bold" fill="#eb6834">giao dịch</text><text x="650" y="145" text-anchor="middle">vào: 5 + 3 = 8</text><text x="650" y="185" text-anchor="middle">ra: 6 + 1,9 = 7,9</text><text x="650" y="225" text-anchor="middle" fill="#b91c1c">phí = 8 − 7,9 = 0,1</text><line x1="204" y1="90" x2="466" y2="110" stroke="#1f2937" stroke-width="3" marker-end="url(#arB4)"/><line x1="204" y1="200" x2="466" y2="190" stroke="#1f2937" stroke-width="3" marker-end="url(#arB4)"/><line x1="830" y1="110" x2="1010" y2="90" stroke="#1f2937" stroke-width="3" marker-end="url(#arB4)"/><line x1="830" y1="190" x2="1010" y2="200" stroke="#1f2937" stroke-width="3" marker-end="url(#arB4)"/><circle cx="1060" cy="90" r="44" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1060" y="100" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">6</text><circle cx="1060" cy="200" r="44" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="1060" y="210" font-size="28" font-weight="bold" text-anchor="middle" fill="#059669">1,9</text><text x="1120" y="98">người nhận</text><text x="1120" y="208" fill="#059669">tiền thừa, về ví</text><line x1="204" y1="360" x2="1012" y2="360" stroke="#6b7280" stroke-width="3" stroke-dasharray="12 10"/><circle cx="1060" cy="360" r="44" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="1060" y="370" font-size="28" font-weight="bold" text-anchor="middle" fill="#059669">2</text><text x="1120" y="368" fill="#059669">chưa dùng tới</text><text x="610" y="345" text-anchor="middle" fill="#6b7280">đồng 2 không vào giao dịch</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ một giao dịch như một cái máy đổi tiền. Bên trái, đồng 5 và đồng 3 đi vào và bị tiêu trọn, tổng vào là 8. Bên phải, máy tạo ra hai đồng mới, đồng 6 cho người nhận và đồng 1 phẩy 9 là tiền thừa quay về ví, còn phần chênh 0 phẩy 1 là phí. Đồng 2 không vào giao dịch nên vẫn nằm nguyên trong ví, và sau giao dịch ví có hai đồng chưa tiêu là 2 và 1 phẩy 9."

  - id: example
    kind: example
    title: "Lập giao dịch trả 6"
    checks:
      - "alg.utxo_select([5, 3, 2], 6, 0.1) == ([5, 3], 6, 1.9) and round(5 + 3 - 6 - 1.9, 6) == 0.1 and 5 + 2 >= 6.1 and round(5 + 2 - 6 - 0.1, 6) == 0.9"
      - "round(6 + 0.1, 6) == 6.1 and 5 < 6.1 and 5 + 3 == 8 and 8 >= 6.1 and round(2 + 1.9, 6) == 3.9 and round(5 + 3 + 2 - 6 - 0.1, 6) == 3.9"
    steps:
      - show: |
          <p><b>Bước 1 — cần gom bao nhiêu:</b> trả 6, phí 0,1.</p>
          $$6 + 0{,}1 = \hl{6{,}1}$$
        focus: [1, 2]
        say: "Bước một, tính tổng số tiền mà đầu vào cần gom cho đủ. Người nhận cần 6 và phí là 0 phẩy 1, nên đầu vào phải có ít nhất 6 cộng 0 phẩy 1, bằng 6 phẩy 1."
      - show: |
          <table class="t"><tr><th>bước 2 — chọn từ lớn tới nhỏ</th><th>đã gom</th><th>đủ 6,1 chưa?</th></tr>
          <tr><td>lấy đồng 5</td><td>5</td><td>chưa</td></tr>
          <tr><td>lấy thêm đồng 3</td><td>8</td><td>đủ → dừng</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước hai, ví chọn đồng từ lớn tới nhỏ. Lấy đồng 5 trước, mới gom được 5, chưa đủ 6 phẩy 1. Lấy thêm đồng 3, gom được 8, đã đủ, nên dừng lại và không cần đồng 2."
      - show: |
          <p><b>Bước 3 — lập đầu ra:</b> người nhận 6; phần còn lại trả về ví.</p>
          $$\text{tiền thừa} = 8 - 6 - 0{,}1 = \hl{1{,}9}$$
        focus: [1, 1, 2]
        say: "Bước ba, lập danh sách các đầu ra của giao dịch. Đầu ra thứ nhất cho người nhận đúng 6. Đầu ra thứ hai là tiền thừa về ví mình, 8 trừ 6 trừ 0 phẩy 1, bằng 1 phẩy 9."
      - show: |
          <p><b>Bước 4 — phí là phần không ai ghi nhận:</b></p>
          $$\text{phí} = \text{vào} - \text{ra} = 8 - (6 + 1{,}9) = 8 - 7{,}9 = 0{,}1$$
        focus: [1, 2]
        say: "Bước bốn, tính phí theo đúng định nghĩa, vào trừ ra. Tổng ra là 6 cộng 1 phẩy 9, bằng 7 phẩy 9, nên phí bằng 8 trừ 7 phẩy 9, bằng 0 phẩy 1, đúng mức ta muốn trả."
      - clear: true
        show: |
          <table class="t"><tr><th>bước 5 — ví sau giao dịch</th><th>giá trị</th></tr>
          <tr><td>đồng chưa tiêu còn lại</td><td><b>2</b> (không dùng tới) và <b>1,9</b> (tiền thừa mới)</td></tr>
          <tr><td>số dư tính ra</td><td>$2 + 1{,}9 = 3{,}9$</td></tr></table>
          <p class="note">Ví ở đây chọn đồng từ lớn tới nhỏ. Chọn 5 + 2 = 7 cũng đủ, tiền thừa chỉ 0,9 — mỗi ví có cách chọn riêng: ít đồng, ít tiền thừa, hay riêng tư hơn.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước năm, xem lại ví sau giao dịch. Ví còn hai đồng chưa tiêu, đồng 2 không dùng tới và đồng 1 phẩy 9 là tiền thừa mới. Số dư không được lưu ở đâu cả, mà tính ra bằng 2 cộng 1 phẩy 9, bằng 3 phẩy 9. Ở đây ví chọn đồng từ lớn tới nhỏ, còn chọn 5 cộng 2 bằng 7 cũng đủ, với tiền thừa chỉ 0 phẩy 9, nên mỗi ví có cách chọn riêng."

  - id: check
    kind: check
    title: "Tự kiểm: thử mọi cách chọn và đếm lại tổng tiền"
    checks:
      - "[(c, sum(c)) for r in (1, 2, 3) for c in __import__('itertools').combinations([5, 3, 2], r) if sum(c) >= 6.1] == [((5, 3), 8), ((5, 2), 7), ((5, 3, 2), 10)] and len([c for r in (1, 2, 3) for c in __import__('itertools').combinations([5, 3, 2], r)]) == 7"
      - "[round(s - 6.1, 6) for s in (8, 7, 10)] == [1.9, 0.9, 3.9] and 5 + 3 + 2 == 10 and round(3.9 + 6 + 0.1, 6) == 10"
    steps:
      - show: |
          <table class="t"><tr><th>cách chọn (7 cách)</th><th>tổng</th><th>đủ 6,1?</th><th>tiền thừa</th></tr>
          <tr><td>chỉ một đồng: 5, 3 hoặc 2</td><td>5, 3, 2</td><td>không</td><td>—</td></tr>
          <tr><td>3 + 2</td><td>5</td><td>không</td><td>—</td></tr>
          <tr><td>5 + 3 (ví đã chọn)</td><td>8</td><td>có</td><td>$\hl{1{,}9}$</td></tr>
          <tr><td>5 + 2</td><td>7</td><td>có</td><td>0,9</td></tr>
          <tr><td>5 + 3 + 2</td><td>10</td><td>có</td><td>3,9</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Kiểm bằng đường khác, ta liệt kê cả 7 cách chọn đồng từ ví 5, 3 và 2. Chọn một đồng thì nhiều nhất là 5, nên không đủ 6 phẩy 1. Cặp 3 và 2 chỉ được 5, nên cũng không đủ. Cặp 5 và 3 được 8, đủ tiền, nên tiền thừa bằng 8 trừ 6 phẩy 1, là 1 phẩy 9, khớp với cách ví đã chọn. Cặp 5 và 2 được 7, tiền thừa 0 phẩy 9, ít nhất trong các cách đủ tiền. Dùng cả ba đồng được 10, tiền thừa 3 phẩy 9, tốn thêm một đầu vào mà không được gì."
      - show: |
          <table class="t"><tr><th>đếm lại tổng tiền</th><th>giá trị</th></tr>
          <tr><td>ví trước: $5 + 3 + 2$</td><td>10</td></tr>
          <tr><td>ví sau 3,9 + người nhận 6 + phí 0,1</td><td>$\hl{10}$ ✓ không mất, không thêm</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Một phép thử nữa là đếm lại tổng tiền trước và sau. Ví trước có 5 cộng 3 cộng 2, bằng 10. Sau giao dịch, ví còn 3 phẩy 9, người nhận có 6, người tạo khối giữ phí 0 phẩy 1, cộng lại vẫn đúng 10, nên không có đồng nào mất đi hay tự sinh ra."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "round(5 + 3 - 6, 6) == 2"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Quên đầu ra tiền thừa <b class="red">(tiền thừa thành phí)</b>
          <br><span class="note">Đầu vào 8, chỉ ghi đầu ra 6: phần chênh <b>2</b> trở thành phí, người tạo khối giữ hết. Luôn để phần mềm ví tạo đầu ra tiền thừa và hiện phí trước khi ký.</span></div>
        say: "Lỗi thứ nhất, quên đầu ra tiền thừa, nên tiền thừa thành phí. Đầu vào 8 mà chỉ ghi đầu ra 6 thì phần chênh 2 trở thành phí, và người tạo khối giữ hết. Hãy luôn để phần mềm ví tạo đầu ra tiền thừa, và hiện phí trước khi ký."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tưởng “số dư” là một con số được lưu <b class="red">(trong mô hình này nó được tính ra)</b>
          <br><span class="note">Số dư của ví = tổng các đồng chưa tiêu thuộc các địa chỉ của ví. Muốn biết phải quét hoặc giữ chỉ mục các đồng chưa tiêu.</span></div>
        say: "Lỗi thứ hai, tưởng số dư là một con số được lưu, trong khi ở mô hình này nó được tính ra. Số dư của ví bằng tổng các đồng chưa tiêu thuộc các địa chỉ của ví. Muốn biết thì phải quét, hoặc giữ một chỉ mục các đồng chưa tiêu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Gộp mọi đồng của nhiều nguồn vào một giao dịch <b class="red">(lộ các địa chỉ cùng chủ)</b>
          <br><span class="note">Nhiều đầu vào trong một giao dịch thường nghĩa là cùng một người ký — người phân tích nối các địa chỉ đó lại với nhau. Chỉ gộp khi cần.</span></div>
        say: "Lỗi thứ ba, gộp mọi đồng từ nhiều nguồn vào một giao dịch, nên lộ các địa chỉ cùng chủ. Nhiều đầu vào trong một giao dịch thường nghĩa là cùng một người ký, và người phân tích nối các địa chỉ đó lại với nhau. Vì vậy chỉ gộp các đồng lại khi thật sự cần."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.utxo_select([4, 4, 1], 7.5, 0.2) == ([4, 4], 7.5, 0.3)"
      - "round(7.5 + 0.2, 6) == 7.7 and 4 < 7.7 <= 8 and round(1 + 0.3, 6) == 1.3 and 4 + 4 + 1 == 9 and round(9 - 7.5 - 0.2, 6) == 1.3"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Ví có các đồng 4, 4, 1. Cần trả 7,5, phí 0,2. Dùng những đồng nào, tiền thừa bao nhiêu?</td></tr>
          <tr><td>2</td><td>Sau đó ví còn những đồng chưa tiêu nào, tổng bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, ví có các đồng 4, 4 và 1. Cần trả 7 phẩy 5, phí 0 phẩy 2. Dùng những đồng nào, và tiền thừa bao nhiêu? Câu hai, sau đó ví còn những đồng chưa tiêu nào, tổng bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>① làm từng bước</th><th>giá trị</th></tr>
          <tr><td>cần gom: $7{,}5 + 0{,}2$</td><td>7,7</td></tr>
          <tr><td>lấy đồng 4, rồi thêm đồng 4</td><td>4 chưa đủ, 8 đủ → dừng</td></tr>
          <tr><td>tiền thừa: $8 - 7{,}5 - 0{,}2$</td><td>$\hl{0{,}3}$</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, làm từng bước như ví dụ. Cần gom 7 phẩy 5 cộng 0 phẩy 2, bằng 7 phẩy 7. Lấy một đồng 4 thì chưa đủ, thêm đồng 4 thứ hai được 8 thì đủ, và đồng 1 không cần dùng. Tiền thừa bằng 8 trừ 7 phẩy 5 trừ 0 phẩy 2, bằng 0 phẩy 3."
      - show: |
          <p>② Còn đồng <b>1</b> và đồng <b>0,3</b>: tổng $1 + 0{,}3 = 1{,}3$.</p>
          <p>Đếm lại: ví trước $4 + 4 + 1 = 9$, và $9 - 7{,}5 - 0{,}2 = 1{,}3$ ✓.</p>
        focus: [1, 2]
        say: "Câu hai, ví còn đồng 1 không dùng tới và đồng 0 phẩy 3 là tiền thừa, tổng 1 phẩy 3. Đếm lại bằng đường khác, ví trước có 4 cộng 4 cộng 1, bằng 9, trừ đi 7 phẩy 5 cho người nhận và 0 phẩy 2 phí, còn đúng 1 phẩy 3."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đồng chưa tiêu: tiêu trọn, một lần</span><span class="a">→</span>
          <span class="n">đầu ra: người nhận + tiền thừa</span><span class="a">→</span>
          <span class="n">phí = vào − ra</span><span class="a">→</span>
          <span class="n">tài khoản: số dư + số thứ tự</span></div>
        say: "Tổng kết lại, đồng chưa tiêu phải tiêu trọn và chỉ một lần, đầu ra gồm người nhận và tiền thừa, và phí bằng vào trừ ra. Mô hình tài khoản thì dùng số dư cùng số thứ tự."
      - show: |
          <div class="box key"><b>Tư duy:</b> chống chi tiêu hai lần trở nên đơn giản khi mỗi đồng chỉ có <b>hai trạng thái</b>: chưa tiêu, hoặc đã tiêu.</div>
        say: "Điều cần mang theo, chống chi tiêu hai lần trở nên đơn giản khi mỗi đồng chỉ có hai trạng thái, chưa tiêu, hoặc đã tiêu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>bằng chứng công việc</b> — độ khó và số lần thử kỳ vọng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học bằng chứng công việc, với độ khó và số lần thử kỳ vọng. Hẹn gặp bạn ở bài tiếp theo."
