id: L04
course: BCH
series: BCH · Blockchain và sổ cái phân tán
title: Bài 4 — Mô hình đồng chưa tiêu và mô hình tài khoản
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/bch.yaml L04; audit/bch/verify_bch.py L04; S. Nakamoto (2008), mục 2 và 9 (giao dịch, gộp và tách giá trị);
  G. Wood, Ethereum Yellow Paper (mô hình tài khoản, bản hiện hành); A. Narayanan và cộng sự (2016), chương 3; bài 3
assumes:
- arith
objectives:
- Lập giao dịch từ các đồng chưa tiêu
- Tính tiền thừa và phí
- So sánh với mô hình số dư tài khoản
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: Trả 6 đồng bằng tờ 5 và tờ 3
  checks:
  - alg.utxo_select([5, 3, 2], 6, 0.1) == ([5, 3], 6, 1.9)
  steps:
  - show: '<p>Trong ví có ba “tờ tiền”: 5, 3 và 2. Bạn cần trả 6, phí 0,1. Không xé được tờ 5 ra làm đôi — phải đưa <b>trọn</b>
      vài tờ cộng lại đủ 6,1, chẳng hạn tờ 5 và tờ 3, rồi nhận lại tiền thừa. Chuỗi khối đầu tiên giữ tiền đúng theo cách
      đó: không có “số dư”, chỉ có những <b>đồng chưa tiêu</b>.</p>

      <div class="box key">Hôm nay: <b>mô hình đồng chưa tiêu</b> — giao dịch tiêu trọn các đồng cũ và tạo đồng mới — so với
      <b>mô hình tài khoản</b> có số dư.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, trong ví có ba tờ tiền là 5, 3 và 2. Bạn cần trả 6, với phí 0 phẩy 1. Không xé được tờ 5 ra làm đôi, nên
      phải đưa trọn vài tờ cộng lại đủ 6 phẩy 1, chẳng hạn tờ 5 và tờ 3, rồi nhận lại tiền thừa. Chuỗi khối đầu tiên giữ tiền
      đúng theo cách đó, không có số dư, chỉ có những đồng chưa tiêu. Hôm nay ta học mô hình đồng chưa tiêu, nơi giao dịch
      tiêu trọn các đồng cũ và tạo đồng mới, so với mô hình tài khoản có số dư. Bắt buộc tiêu trọn từng đồng xu cũ rồi tạo
      đồng tiền thừa mới loại bỏ hoàn toàn bài toán cộng trừ số dư đồng thời phức tạp.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: trừ số thập phân và chữ ký của chủ đồng'
  checks:
  - 8 - 6 == 2 and round(2 - 0.1, 6) == 1.9 and round(6 + 1.9, 6) == 7.9 and round(8 - 7.9, 6) == 0.1
  - pow(3010, 2753, 3233) == 2164 and pow(2164, 17, 3233) == 3010
  steps:
  - show: '<table class="t"><tr><th>phép tính</th><th>làm từng bước</th><th>kết quả</th></tr>

      <tr><td>$8 - 6 - 0{,}1$</td><td>$8 - 6 = 2$, rồi $2 - 0{,}1$</td><td>$1{,}9$</td></tr>

      <tr><td>thử lại bằng phép cộng</td><td>$6 + 0{,}1 + 1{,}9$</td><td>$8$ ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    say: Trước hết, ôn phép trừ số thập phân, vì cả bài tính tiền thừa bằng nó. 8 trừ 6 trừ 0 phẩy 1, ta làm từng bước, 8
      trừ 6 bằng 2, rồi 2 trừ 0 phẩy 1 bằng 1 phẩy 9. Thử lại bằng phép cộng, 6 cộng 0 phẩy 1 cộng 1 phẩy 9 bằng đúng 8, nên
      phép trừ đúng. Quy luật bảo toàn tổng vào bằng tổng đầu ra cộng tiền phí trở thành chốt kiểm tra hợp lệ nhanh nhất cho
      mọi giao dịch mới.
  - show: '<table class="t"><tr><th>ở bài 3, chữ ký số</th><th>ví dụ khoá đồ chơi</th></tr>

      <tr><td>chủ ký băm giao dịch bằng khoá bí mật</td><td>băm 3010 → chữ ký 2164</td></tr>

      <tr><td>ai cũng kiểm bằng khoá công khai</td><td>2164 mũ 17, lấy dư 3233 → 3010 ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    say: Tiếp theo, nhắc lại chữ ký số ở bài 3, vì mỗi lần tiêu một đồng đều phải có chữ ký của chủ. Chủ ký lên băm của giao
      dịch bằng khoá bí mật, với khoá đồ chơi thì băm 3010 cho ra chữ ký 2164. Ai cũng kiểm được bằng khoá công khai, 2164
      mũ 17 chia lấy dư cho 3233 ra lại 3010, khớp với băm.
- id: sym
  kind: symbol
  title: 'Giải mã: đầu vào, đầu ra, tiền thừa, phí'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>đồng chưa tiêu</b></td><td>một đầu ra của giao dịch trước, gắn với một địa chỉ, chưa ai tiêu</td></tr>

      <tr><td><b>đầu vào</b></td><td>chỉ tới các đồng chưa tiêu, kèm chữ ký của chủ (bài 3); mỗi đồng tiêu <b>trọn</b> và
      chỉ một lần</td></tr>

      <tr><td><b>đầu ra</b></td><td>đồng mới: cho người nhận, và <b>tiền thừa</b> trả về chính mình</td></tr>

      <tr><td><b>phí</b></td><td>tổng vào − tổng ra, người tạo khối (bên gom giao dịch vào khối mới) giữ</td></tr></table>

      <p><b>Mô hình tài khoản</b>: mỗi địa chỉ có một số dư; giao dịch trừ bên này, cộng bên kia, kèm số thứ tự để chống phát
      lại; số dư lưu sẵn, còn đồng chưa tiêu thì số dư phải cộng ra.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    say: Bảng có bốn khái niệm. Đồng chưa tiêu là một đầu ra của giao dịch trước, gắn với một địa chỉ, và chưa ai tiêu. Đầu
      vào chỉ tới các đồng chưa tiêu, kèm chữ ký của chủ như ở bài 3, và mỗi đồng phải tiêu trọn, chỉ một lần. Đầu ra là các
      đồng mới, cho người nhận, và tiền thừa trả về chính mình. Phí bằng tổng vào trừ tổng ra, người tạo khối, tức bên gom
      giao dịch vào khối mới, giữ phần này. Ngược lại, mô hình tài khoản lưu sẵn số dư mỗi địa chỉ, giao dịch trừ bên này
      cộng bên kia kèm số thứ tự chống phát lại, còn đồng chưa tiêu thì số dư phải cộng ra. Do mỗi đồng chưa tiêu chỉ có duy
      nhất hai trạng thái chưa tiêu hoặc đã tiêu, mạng lưới dễ dàng kiểm tra song song không lo tranh chấp khoá hàng.
- id: intuition
  kind: intuition
  title: Đồng cũ vào, đồng mới ra
  steps:
  - show: '<div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arB4" viewBox="0 0 10 10" refX="9"
      refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z"
      fill="#1f2937"/></marker></defs><g font-size="22" fill="#1f2937"><text x="160" y="30" text-anchor="middle" font-weight="bold">ví
      trước</text><text x="1130" y="30" text-anchor="middle" font-weight="bold">sau giao dịch</text><circle cx="160" cy="90"
      r="44" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/><text x="160" y="100" font-size="28" font-weight="bold" text-anchor="middle"
      fill="#2a78d6">5</text><circle cx="160" cy="200" r="44" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/><text x="160"
      y="210" font-size="28" font-weight="bold" text-anchor="middle" fill="#2a78d6">3</text><circle cx="160" cy="360" r="44"
