      10"/><circle cx="1060" cy="360" r="44" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="1060" y="370" font-size="28"
      font-weight="bold" text-anchor="middle" fill="#059669">2</text><text x="1120" y="368" fill="#059669">chưa dùng tới</text><text
      x="610" y="345" text-anchor="middle" fill="#6b7280">đồng 2 không vào giao dịch</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ một giao dịch như một cái máy đổi tiền. Bên trái, đồng 5 và đồng 3 đi vào và bị tiêu trọn, tổng vào là 8.
      Bên phải, máy tạo ra hai đồng mới, đồng 6 cho người nhận và đồng 1 phẩy 9 là tiền thừa quay về ví, còn phần chênh 0
      phẩy 1 là phí. Đồng 2 không vào giao dịch nên vẫn nằm nguyên trong ví, và sau giao dịch ví có hai đồng chưa tiêu là
      2 và 1 phẩy 9. Mô hình đồng chưa tiêu hoạt động giống hệt thao tác đưa tờ tiền mệnh giá chẵn rồi nhận lại tờ tiền lẻ
      thối về ví riêng.
- id: example
  kind: example
  title: Lập giao dịch trả 6
  checks:
  - alg.utxo_select([5, 3, 2], 6, 0.1) == ([5, 3], 6, 1.9) and round(5 + 3 - 6 - 1.9, 6) == 0.1 and 5 + 2 >= 6.1 and round(5
    + 2 - 6 - 0.1, 6) == 0.9
  - round(6 + 0.1, 6) == 6.1 and 5 < 6.1 and 5 + 3 == 8 and 8 >= 6.1 and round(2 + 1.9, 6) == 3.9 and round(5 + 3 + 2 - 6
    - 0.1, 6) == 3.9
  steps:
  - show: '<p><b>Bước 1 — cần gom bao nhiêu:</b> trả 6, phí 0,1.</p>

      $$6 + 0{,}1 = \hl{6{,}1}$$

      '
    focus:
    - 1
    - 2
    say: Bước một, tính tổng số tiền mà đầu vào cần gom cho đủ. Người nhận cần 6 và phí là 0 phẩy 1, nên đầu vào phải có ít
      nhất 6 cộng 0 phẩy 1, bằng 6 phẩy 1.
  - show: '<table class="t"><tr><th>bước 2 — chọn từ lớn tới nhỏ</th><th>đã gom</th><th>đủ 6,1 chưa?</th></tr>

      <tr><td>lấy đồng 5</td><td>5</td><td>chưa</td></tr>

      <tr><td>lấy thêm đồng 3</td><td>8</td><td>đủ → dừng</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Bước hai, ví chọn đồng từ lớn tới nhỏ. Lấy đồng 5 trước, mới gom được 5, chưa đủ 6 phẩy 1. Lấy thêm đồng 3, gom được
      8, đã đủ, nên dừng lại và không cần đồng 2.
  - show: '<p><b>Bước 3 — lập đầu ra:</b> người nhận 6; phần còn lại trả về ví.</p>

      $$\text{tiền thừa} = 8 - 6 - 0{,}1 = \hl{1{,}9}$$

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Bước ba, lập danh sách các đầu ra của giao dịch. Đầu ra thứ nhất cho người nhận đúng 6. Đầu ra thứ hai là tiền thừa
      về ví mình, 8 trừ 6 trừ 0 phẩy 1, bằng 1 phẩy 9. Nếu quên khai báo đầu ra tiền thừa một phẩy chín về địa chỉ ví của
      chính mình, phần chênh lệch đó tự động chảy hết vào tay người tạo khối.
  - clear: true
    show: '<p><b>Bước 4 — phí là phần không ai ghi nhận:</b></p>

      $$\text{phí} = \text{vào} - \text{ra} = 8 - (6 + 1{,}9) = 8 - 7{,}9 = 0{,}1$$

      '
    focus:
    - 1
    - 2
    say: Bước bốn, tính phí theo đúng định nghĩa, vào trừ ra. Tổng ra là 6 cộng 1 phẩy 9, bằng 7 phẩy 9, nên phí bằng 8 trừ
      7 phẩy 9, bằng 0 phẩy 1, đúng mức ta muốn trả.
  - show: '<table class="t"><tr><th>bước 5 — ví sau giao dịch</th><th>giá trị</th></tr>

      <tr><td>đồng chưa tiêu còn lại</td><td><b>2</b> (không dùng tới) và <b>1,9</b> (tiền thừa mới)</td></tr>

      <tr><td>số dư tính ra</td><td>$2 + 1{,}9 = 3{,}9$</td></tr></table>

      <p class="note">Ví ở đây chọn đồng từ lớn tới nhỏ. Chọn 5 + 2 = 7 cũng đủ, tiền thừa chỉ 0,9 — mỗi ví có cách chọn riêng:
      ít đồng, ít tiền thừa, hay riêng tư hơn.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    say: Bước năm, xem lại ví sau giao dịch. Ví còn hai đồng chưa tiêu, đồng 2 không dùng tới và đồng 1 phẩy 9 là tiền thừa
      mới. Số dư không được lưu ở đâu cả, mà tính ra bằng 2 cộng 1 phẩy 9, bằng 3 phẩy 9. Ở đây ví chọn đồng từ lớn tới nhỏ,
      còn chọn 5 cộng 2 bằng 7 cũng đủ, với tiền thừa chỉ 0 phẩy 9, nên mỗi ví có cách chọn riêng. Thay vì lưu sẵn một con
      số số dư tĩnh, phần mềm ví phải quét mọi đồng chưa tiêu thuộc quyền sở hữu rồi cộng tổng lại.
- id: check
  kind: check
  title: 'Tự kiểm: thử mọi cách chọn và đếm lại tổng tiền'
  checks:
  - '[(c, sum(c)) for r in (1, 2, 3) for c in __import__(''itertools'').combinations([5, 3, 2], r) if sum(c) >= 6.1] == [((5,
    3), 8), ((5, 2), 7), ((5, 3, 2), 10)] and len([c for r in (1, 2, 3) for c in __import__(''itertools'').combinations([5,
    3, 2], r)]) == 7'
  - '[round(s - 6.1, 6) for s in (8, 7, 10)] == [1.9, 0.9, 3.9] and 5 + 3 + 2 == 10 and round(3.9 + 6 + 0.1, 6) == 10'
  steps:
  - show: '<table class="t"><tr><th>cách chọn (7 cách)</th><th>tổng</th><th>đủ 6,1?</th><th>tiền thừa</th></tr>

      <tr><td>chỉ một đồng: 5, 3 hoặc 2</td><td>5, 3, 2</td><td>không</td><td>—</td></tr>

      <tr><td>3 + 2</td><td>5</td><td>không</td><td>—</td></tr>

      <tr><td>5 + 3 (ví đã chọn)</td><td>8</td><td>có</td><td>$\hl{1{,}9}$</td></tr>

      <tr><td>5 + 2</td><td>7</td><td>có</td><td>0,9</td></tr>

      <tr><td>5 + 3 + 2</td><td>10</td><td>có</td><td>3,9</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.6'
    - '1.6'
    say: Kiểm bằng đường khác, ta liệt kê cả 7 cách chọn đồng từ ví 5, 3 và 2. Chọn một đồng thì nhiều nhất là 5, nên không
      đủ 6 phẩy 1. Cặp 3 và 2 chỉ được 5, nên cũng không đủ. Cặp 5 và 3 được 8, đủ tiền, nên tiền thừa bằng 8 trừ 6 phẩy 1,
      là 1 phẩy 9, khớp với cách ví đã chọn. Cặp 5 và 2 được 7, tiền thừa 0 phẩy 9, ít nhất trong các cách đủ tiền. Dùng cả
      ba đồng được 10, tiền thừa 3 phẩy 9, tốn thêm một đầu vào mà không được gì. Trong cả bảy tập con, việc gom đồng luôn
      tuân thủ điều kiện tổng vào không nhỏ hơn tiền trả cộng phí rồi chọn phương án khớp vừa nhất.
  - clear: true
    show: '<table class="t"><tr><th>đếm lại tổng tiền</th><th>giá trị</th></tr>

      <tr><td>ví trước: $5 + 3 + 2$</td><td>10</td></tr>

      <tr><td>ví sau 3,9 + người nhận 6 + phí 0,1</td><td>$\hl{10}$ ✓ không mất, không thêm</td></tr>

      <tr><td>so với mô hình tài khoản (lưu 1 số dư)</td><td>tài khoản chỉ cập nhật 10 → 3,9 gọn nhẹ hơn giữ 2 đồng xu (5;
      3), nhưng đồng chưa tiêu (UTXO) kiểm song song tốt hơn</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    say: Một phép thử nữa là đếm lại tổng tiền trước và sau. Ví trước có 5 cộng 3 cộng 2, bằng 10. Sau giao dịch, ví còn 3
      phẩy 9, người nhận có 6, người tạo khối giữ phí 0 phẩy 1, cộng lại vẫn đúng 10, nên không có đồng nào mất đi hay tự
      sinh ra. So với mô hình tài khoản chỉ lưu một con số dư duy nhất 3 phẩy 9, mô hình đồng chưa tiêu tốn nhiều bản ghi
      hơn nhưng cho phép kiểm nhiều giao dịch song song độc lập.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - round(5 + 3 - 6, 6) == 2
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Quên đầu ra tiền thừa <b class="red">(tiền thừa thành phí)</b>

      <br><span class="note">Đầu vào 8, chỉ ghi đầu ra 6: phần chênh <b>2</b> trở thành phí, người tạo khối giữ hết. Luôn
      để phần mềm ví tạo đầu ra tiền thừa và hiện phí trước khi ký.</span></div>

      '
    say: Lỗi thứ nhất, quên đầu ra tiền thừa, nên tiền thừa thành phí. Đầu vào 8 mà chỉ ghi đầu ra 6 thì phần chênh 2 trở
      thành phí, và người tạo khối giữ hết. Hãy luôn để phần mềm ví tạo đầu ra tiền thừa, và hiện phí trước khi ký. Thiếu
      khai báo đầu ra tiền thừa là sai sót đắt giá nhất vì chuỗi khối mặc nhiên coi toàn bộ phần dôi dư là tiền thưởng cho
      thợ đào.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Tưởng “số dư” là một con số được lưu <b class="red">(trong mô hình này nó được
      tính ra)</b>

      <br><span class="note">Số dư của ví = tổng các đồng chưa tiêu thuộc các địa chỉ của ví. Muốn biết phải quét hoặc giữ
      chỉ mục các đồng chưa tiêu.</span></div>

      '
    say: Lỗi thứ hai, tưởng số dư là một con số được lưu, trong khi ở mô hình này nó được tính ra. Số dư của ví bằng tổng
      các đồng chưa tiêu thuộc các địa chỉ của ví. Muốn biết thì phải quét, hoặc giữ một chỉ mục các đồng chưa tiêu. Đếm lại
      số lượng đồng chưa tiêu rời rạc giúp phần mềm tối ưu chiến lược gom đồng tránh phình to kích thước giao dịch về sau.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Gộp mọi đồng của nhiều nguồn vào một giao dịch <b class="red">(lộ các địa chỉ
      cùng chủ)</b>

      <br><span class="note">Nhiều đầu vào trong một giao dịch thường nghĩa là cùng một người ký — người phân tích nối các
      địa chỉ đó lại với nhau. Chỉ gộp khi cần.</span></div>

      '
    say: Lỗi thứ ba, gộp mọi đồng từ nhiều nguồn vào một giao dịch, nên lộ các địa chỉ cùng chủ. Nhiều đầu vào trong một giao
      dịch thường nghĩa là cùng một người ký, và người phân tích nối các địa chỉ đó lại với nhau. Vì vậy chỉ gộp các đồng
      lại khi thật sự cần. Tạo địa chỉ tiền thừa mới mỗi lần chi tiêu giảm thiểu dấu vết liên kết nhiều đồng xu cũ của cùng
      một chủ sở hữu.
  - clear: true
    show: '<table class="t"><tr><th>quy mô đầu ra chưa tiêu (UTXO) vs tài khoản</th><th>xử lý giao dịch</th><th>đánh đổi bộ
      nhớ</th></tr><tr><td>1 giao dịch 2 vào – 2 ra</td><td>kiểm đồng xu độc lập, chạy song song tốt</td><td>mỗi đồng xu là
      1 đầu ra riêng</td></tr><tr><td>Mạng hàng tỉ đồng xu lẻ</td><td>tập UTXO phình lớn trong bộ nhớ làm việc (RAM) nút</td><td>mô
      hình tài khoản lưu 1 số dư gọn hơn nhiều</td></tr></table>

      '
    say: Ở quy mô từng giao dịch lẻ, mô hình đồng chưa tiêu tách rạch ròi từng đồng xu vào ra. Nhờ các đồng độc lập hoàn toàn
      với nhau, nhiều giao dịch được kiểm tra chữ ký và số dư song song rất nhanh. Nhưng trên mạng có hàng tỉ đồng xu nhỏ
      lẻ chưa tiêu, giữ toàn bộ danh sách đó trong bộ nhớ làm việc tốn kém hơn hẳn một bảng số dư theo địa chỉ tài khoản.
    focus:
    - 0
    - '1.2'
    - '1.3'
  - show: '<table class="t"><tr><th>quy mô đầu ra chưa tiêu (UTXO) vs tài khoản</th><th>xử lý giao dịch</th><th>đánh đổi bộ
      nhớ</th></tr><tr><td>1 giao dịch 2 vào – 2 ra</td><td>kiểm đồng xu độc lập, chạy song song tốt</td><td>mỗi đồng xu là
      1 đầu ra riêng</td></tr><tr><td>Mạng hàng tỉ đồng xu lẻ</td><td>tập UTXO phình lớn trong bộ nhớ làm việc (RAM) nút</td><td>mô
      hình tài khoản lưu 1 số dư gọn hơn nhiều</td></tr></table>

      '
    say: Chọn mô hình nào thực chất là đánh đổi giữa khả năng song song hoá cao và chi phí lưu trữ trạng thái gọn nhẹ. Thực
      tế cho thấy mỗi kiến trúc phục vụ một ưu tiên vận hành khác nhau.
    focus:
    - '1.2'
    - '1.3'
