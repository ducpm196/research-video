- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">đồng chưa tiêu: tiêu trọn, một lần</span><span class="a">→</span>

      <span class="n">đầu ra: người nhận + tiền thừa</span><span class="a">→</span>

      <span class="n">phí = vào − ra</span><span class="a">→</span>

      <span class="n">tài khoản: số dư + số thứ tự</span></div>

      <p class="note"><b>So sánh hai quy mô:</b> Giao dịch lẻ UTXO kiểm song song rất nhanh; mạng hàng tỉ đồng xu lẻ làm bảng
      tài khoản gọn RAM hơn.</p>

      '
    say: Tổng kết lại, mỗi đồng chưa tiêu phải tiêu trọn vẹn và chỉ đúng một lần. Đầu ra mới chia làm tiền gửi cho người nhận
      và tiền thừa trả về ví mình. Phí giao dịch chính là phần chênh giữa tổng vào trừ tổng ra. Ngược lại, mô hình tài khoản
      lưu trực tiếp số dư kèm bộ đếm số thứ tự. Hai mức quy mô bộc lộ đánh đổi rõ ràng. Giao dịch lẻ dùng đồng chưa tiêu kiểm
      song song rất tốt. Nhưng ở hàng tỉ đồng xu lẻ thì bảng tài khoản gọn bộ nhớ làm việc hơn. Kiến trúc đồng chưa tiêu đơn
      giản hoá khâu kiểm song song nhiều giao dịch, trong khi kiến trúc tài khoản lại thuận tiện hơn cho logic hợp đồng.
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
  - show: '<div class="box key"><b>Tư duy:</b> chống chi tiêu hai lần trở nên đơn giản khi mỗi đồng chỉ có <b>hai trạng thái</b>:
      chưa tiêu, hoặc đã tiêu.</div>

      '
    say: Điều cần mang theo là việc chống chi tiêu hai lần trở nên đơn giản và dễ kiểm song song khi mỗi đồng chỉ có hai trạng
      thái. Hoặc đồng đó còn nguyên chưa từng tiêu, hoặc đã tiêu hết hoàn toàn. Nhận diện rõ cách biểu diễn trạng thái giúp
      bạn hiểu vì sao một mạng ưu tiên song song còn mạng kia ưu tiên lưu trạng thái tổng hợp.
  - show: '<p class="note">Bài sau (bài 5): <b>bằng chứng công việc</b> — độ khó và số lần thử kỳ vọng.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 5, ta học bằng chứng công việc, với độ khó và số lần thử kỳ vọng. Hẹn gặp bạn ở bài tiếp theo.
