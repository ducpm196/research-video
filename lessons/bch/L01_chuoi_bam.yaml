scenes:
- id: hook
  kind: hook
  title: Sửa một dòng trong sổ, ai biết?
  steps:
  - show: '<p>Sổ cái điện tử lưu “B trả C 2”. Ai đó có quyền ghi đĩa sửa thành “B trả C 20”. Nếu sổ chỉ là một bảng, không
      có gì báo động. Ta muốn một cấu trúc mà sửa <b>bất kỳ</b> dòng cũ nào cũng lộ ngay — và muốn che giấu thì phải viết
      lại cả phần sau.</p>

      <div class="box key">Hôm nay: <b>chuỗi liên kết bằng băm</b> — mỗi khối mang mã băm của khối trước.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, một sổ cái điện tử lưu dòng B trả C 2. Ai đó có quyền ghi đĩa sửa thành B trả C 20. Nếu sổ chỉ là một bảng
      thì không có gì báo động. Ta muốn một cấu trúc mà sửa bất kỳ dòng cũ nào cũng lộ ngay, và muốn che giấu thì phải viết
      lại cả phần sau. Hôm nay ta học chuỗi liên kết bằng băm, mỗi khối mang mã băm của khối trước. Nếu sổ cái không móc nối
      các dòng bằng mã băm, kẻ chỉnh sửa âm thầm đổi số tiền cũ mà chẳng hệ thống nào phát hiện ra ngay.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: hàm băm và chữ số thập lục phân'
  checks:
  - '[__import__(''hashlib'').sha256(s.encode()).hexdigest()[:8] for s in (''B trả C 2'', ''B trả C 20'')] == [''0ece1d22'',
    ''e55a544a''] and all(a != b for a, b in zip(''0ece1d22'', ''e55a544a''))'
  - len(__import__('hashlib').sha256(b'x').hexdigest()) == 64 and 64 * 4 == 256 and 2 ** 4 == 16
  steps:
  - show: '<p><b>Hàm băm</b>: biến dữ liệu bất kỳ thành một mã có độ dài cố định, như một dấu vân tay của dữ liệu. Thêm một
      chữ số 0:</p>

      <table class="t"><tr><th>dữ liệu</th><th>8 chữ số đầu của mã băm</th></tr>

      <tr><td>B trả C 2</td><td><code>0ece1d22…</code></td></tr>

      <tr><td>B trả C 20</td><td><code>e55a544a…</code></td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - 0
    - '2.3'
    say: Trước hết, ta cần hiểu hàm băm là gì. Hàm băm biến dữ liệu bất kỳ thành một mã có độ dài cố định, giống như một dấu
      vân tay của dữ liệu. Dòng B trả C 2 cho mã bắt đầu bằng 0 e c e. Chỉ thêm một chữ số 0 thành B trả C 20, mã đổi hoàn
      toàn, tám chữ số đầu không còn chữ số nào trùng chỗ. Vì vậy chỉ cần so mã là biết dữ liệu có bị sửa hay không. Chỉ thay
      đổi một ký tự nhỏ trong văn bản đầu vào làm xáo trộn hoàn toàn chuỗi đầu ra cố định hai trăm năm mươi sáu bít.
  - show: '<p>Mã viết bằng <b>chữ số thập lục phân</b>: 16 ký hiệu 0–9 và a–f, mỗi ký hiệu mang 4 bit. Mã đủ dài 64 ký hiệu,
      tức 64 × 4 = 256 bit; màn hình chỉ hiện 8 ký hiệu đầu.</p>

      <p>Dấu gạch đứng <code>|</code> nghĩa là <b>nối</b> hai chuỗi, có vạch ngăn ở giữa: <code>"ab" | "cd"</code> thành <code>"ab|cd"</code>.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Mã băm được viết bằng chữ số thập lục phân, gồm 16 ký hiệu, từ 0 tới 9 và từ a tới f. Mỗi chữ số nhị phân 0 hay 1
      là một bit, nên mỗi ký hiệu mang 4 bit. Mã đủ dài có 64 ký hiệu, tức 64 nhân 4, bằng 256 bit. Trên màn hình ta chỉ hiện
      8 ký hiệu đầu cho gọn. Còn dấu gạch đứng nghĩa là ghép hai chuỗi với một dấu gạch đứng ngăn ở giữa, ví dụ ghép chuỗi
      a b với chuỗi c d. Sáu mươi bốn ký tự thập lục phân nối nhau biểu diễn gọn gàng hai trăm năm mươi sáu bít mà máy tính
      so sánh trực tiếp trong tích tắc.
- id: sym
  kind: symbol
  title: 'Giải mã: mã băm và liên kết'
  steps:
  - show: '<p><b>Hàm băm mật mã</b> SHA-256 (thuật toán băm an toàn 256 bit): nhận dữ liệu bất kỳ, trả 256 bit; đổi một ký
      tự là mã đổi hoàn toàn; không tìm được hai dữ liệu khác nhau cùng mã (trong thực tế).</p>

      <div class="code"><div>mã[1] = băm( "000…0" | dữ liệu[1] )</div><div>mã[i] = băm( mã[i − 1] | dữ liệu[i] )</div></div>

      <p><b>Kiểm chuỗi</b>: từ đầu tới cuối, tính lại <code>băm(mã đã lưu của khối trước | dữ liệu)</code> và so với mã đã
      lưu của khối này. Khối đầu tiên không khớp là nơi bị sửa (hoặc nơi kẻ sửa dừng lại).</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    - 3
    say: Hàm băm hai trăm năm mươi sáu bit nhận dữ liệu bất kỳ và trả về 256 bit, đổi một ký tự là mã đổi hoàn toàn. Trong
      thực tế, không tìm được hai dữ liệu khác nhau có cùng mã. Mã của khối đầu là băm của chuỗi toàn số 0 nối với dữ liệu,
      còn mã thứ i, viết mã[i], là băm của mã khối trước nối với dữ liệu khối i. Kiểm chuỗi là đi từ đầu tới cuối, tính lại
      băm của mã đã lưu của khối trước nối với dữ liệu, rồi so với mã đã lưu của khối này. Khối đầu tiên không khớp là nơi
      bị sửa, hoặc nơi kẻ sửa dừng lại. Tính chất một chiều khiến không thể suy ngược dữ liệu gốc từ mã băm, còn tính kháng
      va chạm ngăn tạo hai văn bản trùng dấu vân tay.
