      sau</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ bốn khối nối với nhau thành một chuỗi, từ khối 1 tới khối 4. Mỗi khối ghi mã trước, dữ liệu, và mã của chính
      nó, còn mũi tên cho thấy mã của khối này được chép vào ô mã trước của khối sau. Ô đỏ đứt nét là chỗ kẻ sửa đổi khối
      3 thành B trả C 20 và tính lại mã, được một mã hoàn toàn khác. Nhưng khối 4 vẫn ghi mã cũ của khối 3, nên hai con số
      không khớp và việc sửa bị lộ. Sợi dây móc nối từ mã khối trước vào ruột khối sau buộc mọi chỉnh sửa quá khứ phải kéo
      đổ toàn bộ dây chuyền phía sau.
