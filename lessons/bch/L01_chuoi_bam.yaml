      <div class="code"><div>mã[1] = băm( "000…0" | "khối 0" ) = 7532f7b2…</div></div>

      '
    focus:
    - 1
    - 2
    - 2
    say: Bước một, ta tính mã băm của khối 1, khối đầu tiên của chuỗi. Khối này chưa có khối trước, nên ta dùng chuỗi 64 chữ
      số 0, nối với dữ liệu khối 0, rồi băm, được mã bắt đầu bằng 7 5 3 2. Khối khởi thủy luôn đặt trường mã trước bằng toàn
      số không để mọi nút cùng có điểm tựa cố định tính dây chuyền nối tiếp.
  - show: '<p><b>Bước 2 — khối 2:</b> mã khối 1 đi vào đầu vào của khối 2.</p>

      <div class="code"><div>mã[2] = băm( "7532f7b2…" | "A trả B 5" ) = fb7c50f3…</div></div>

