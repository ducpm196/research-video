  - show: '<table class="t"><tr><th>muốn che hoàn toàn</th><th>mã phải tính lại</th></tr>

      <tr><td>sửa khối 3 trong chuỗi 4 khối</td><td>khối 3 và khối 4: 2 mã</td></tr></table>

      <p>Muốn che hoàn toàn, kẻ sửa phải tính lại <b>mọi khối sau</b> — và mọi bản sao của các bên khác vẫn giữ mã cũ.</p>

      '
    focus:
    - 1
    - 2
    say: Bước sáu, muốn che hoàn toàn trong chuỗi 4 khối, kẻ sửa phải tính lại 2 mã, của khối 3 và khối 4. Tổng quát, kẻ sửa
      phải tính lại mọi khối sau, mà mọi bản sao của các bên khác vẫn giữ mã cũ.
- id: check
  kind: check
  title: 'Tự kiểm: so mã mới nhất với bản sao của bên khác'
  checks:
  - '(lambda H, H2: H2[-1][:8] == ''4aa11acc'' and H[-1] != H2[-1] and sum(a != b for a, b in zip(H, H2)) == 2 and alg.first_bad_block([''khối
    0'', ''A trả B 5'', ''B trả C 20'', ''C trả A 1''], H2) is None)(alg.build_chain([''khối 0'', ''A trả B 5'', ''B trả C
    2'', ''C trả A 1'']), alg.build_chain([''khối 0'', ''A trả B 5'', ''B trả C 20'', ''C trả A 1'']))'
  - alg.block_hash(alg.build_chain(['khối 0', 'A trả B 5'])[-1], 'B trả C 20')[:8] == '91a89d99'
  steps:
  - show: '<table class="t"><tr><th>khối</th><th>bản sao của bên khác</th><th>chuỗi đã viết lại hết</th><th>giống?</th></tr>

      <tr><td>1</td><td><code>7532f7b2</code></td><td><code>7532f7b2</code></td><td>giống</td></tr>

      <tr><td>2</td><td><code>fb7c50f3</code></td><td><code>fb7c50f3</code></td><td>giống</td></tr>

      <tr><td>3</td><td><code>adc720a0</code></td><td><code>91a89d99</code></td><td class="red">khác</td></tr>

      <tr><td>4 (mới nhất)</td><td><code>febb5dfe</code></td><td><code>4aa11acc</code></td><td class="red">khác</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.4'
    - '1.5'
    - 0
    - '1.5'
    say: Kiểm bằng đường khác, giả sử kẻ sửa đã tính lại hết, nên tự kiểm từng khối trên máy của họ không còn báo sai. Hai
      khối đầu vẫn giống bản sao của bên khác. Khối 3 thì khác, và đó đúng là chỗ đã bị kẻ sửa thay đổi. Khối 4, khối mới
      nhất, cũng khác, đúng 2 mã như ta đã đếm ở bước sáu. Vậy chỉ cần so một mã mới nhất với bản sao của bên khác là phát
      hiện, không cần tính lại cả chuỗi. So sánh với bản sao của các nút khác cho thấy dù kẻ sửa tính lại trọn vẹn nhánh riêng,
      mã khối ba đã lệch hẳn mạng lưới chung.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Tưởng liên kết băm ngăn được sửa <b class="red">(nó chỉ phát hiện)</b>

      <br><span class="note">Tính lại mã cho cả chuỗi chỉ tốn vài mi li giây. Muốn <b>ngăn</b> phải thêm: việc viết lại rất
      tốn kém, hoặc cần nhiều bên đồng ý, hoặc công bố mã mới nhất ra nơi kẻ sửa không chạm được.</span></div>

      '
    say: Lỗi thứ nhất, tưởng liên kết băm ngăn được việc sửa, trong khi nó chỉ phát hiện. Tính lại mã cho cả chuỗi chỉ tốn
      vài mi li giây. Muốn ngăn thì phải thêm một trong ba thứ, làm việc viết lại rất tốn kém, cần nhiều bên đồng ý, hoặc
      công bố mã mới nhất ra nơi kẻ sửa không chạm được. Tính hàng nghìn mã băm trên một máy tính cá nhân chỉ tốn vài mi li
      giây nên chỉ liên kết băm thôi vẫn chưa đủ răn đe viết lại lịch sử.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Băm dữ liệu không có ranh giới rõ <b class="red">(hai dữ liệu khác, cùng chuỗi
      ghép)</b>

      <br><span class="note">Ghép “AB” + “C” và “A” + “BC” ra cùng “ABC”, nên cùng mã. Dùng dấu phân cách hoặc ghi độ dài
      từng trường trước khi băm.</span></div>

      '
    say: Lỗi thứ hai, băm dữ liệu không có ranh giới rõ, nên hai dữ liệu khác nhau cho cùng chuỗi ghép. Ghép A B với C, và
      ghép A với B C, đều ra A B C, nên cùng mã. Hãy dùng dấu phân cách, hoặc ghi độ dài từng trường trước khi băm. Chèn độ
      dài hoặc ký tự phân cách rõ ràng giữa từng trường dữ liệu trước khi băm loại bỏ hoàn toàn nguy cơ đụng ghép chuỗi.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Chỉ kiểm khối mới nhất <b class="red">(sửa giữa chuỗi lọt qua)</b>

      <br><span class="note">Phải tính lại từ đầu, hoặc so mã mới nhất với một bản đáng tin đã lưu ở nơi khác — mã mới nhất
      “tóm tắt” cả lịch sử.</span></div>

      '
    say: Lỗi thứ ba, chỉ kiểm khối mới nhất, nên sửa lén ở giữa chuỗi vẫn lọt qua dễ dàng. Phải tính lại từ đầu, hoặc so mã
      mới nhất với một bản đáng tin đã lưu ở nơi khác, vì mã mới nhất tóm tắt cả lịch sử. Nếu bỏ qua việc kiểm tra các mắt
      xích trung gian, kẻ tấn công có thể tráo dữ liệu cũ mà không để lại dấu vết ở khối cuối. Kiểm tra toàn chuỗi bắt buộc
      phải lần từng liên kết từ gốc hoặc neo mã đỉnh hiện tại vào một điểm mốc đã được xác nhận.
  - clear: true
    show: '<table class="t"><tr><th>quy mô chuỗi băm SHA-256</th><th>chi phí giả mạo</th><th>đánh đổi</th></tr><tr><td>Chuỗi
      thử 4 khối</td><td>sửa khối 2 chỉ cần tính lại 2 khối</td><td>lộ hỏng nhanh nhưng tính lại rẻ</td></tr><tr><td>Sổ cái
      dài 800 000+ khối</td><td>sửa 1 chữ làm sai cả phần đuôi ở vạn nút</td><td>cần thêm đồng thuận để khoá viết lại phần
      đuôi</td></tr></table>

      '
    say: Hãy so hai mức quy mô chuỗi băm để hiểu vì sao độ dài chuỗi và mạng lưới đồng thuận lại quan trọng. Trên chuỗi thử
      4 khối, sửa khối 2 làm hỏng hai khối sau nhưng một máy tính cá nhân có thể tính lại toàn bộ chuỗi trong chớp mắt. Trên
      chuỗi thật dài hàng trăm nghìn khối với hàng vạn bản sao phân tán, chỉ một dấu phẩy sai ở khối cũ làm hỏng mã băm của
      cả phần đuôi phía sau.
    focus:
    - 0
    - '1.2'
    - '1.3'
  - clear: true
    show: '<table class="t"><tr><th>quy mô chuỗi băm SHA-256</th><th>chi phí giả mạo</th><th>đánh đổi</th></tr><tr><td>Chuỗi
      thử 4 khối</td><td>sửa khối 2 chỉ cần tính lại 2 khối</td><td>lộ hỏng nhanh nhưng tính lại rẻ</td></tr><tr><td>Sổ cái
      dài 800 000+ khối</td><td>sửa 1 chữ làm sai cả phần đuôi ở vạn nút</td><td>cần thêm đồng thuận để khoá viết lại phần
      đuôi</td></tr></table>

      '
    say: Liên kết 32 byte rất nhẹ và cực nhanh để phát hiện gian lận, nhưng vẫn cần đồng thuận hoặc công sức tạo khối để chặn
      hẳn việc viết lại phần đuôi.
