- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">mã khối = băm(mã trước | dữ liệu)</span><span class="a">→</span>

      <span class="n">sửa một khối: mã đổi</span><span class="a">→</span>

      <span class="n">khối sau không khớp: lộ</span><span class="a">→</span>

      <span class="n">phát hiện, chưa ngăn: cần thêm chi phí hay đồng thuận</span></div>

      <p class="note"><b>So sánh hai quy mô:</b> Sửa 1 khối trong chuỗi 4 khối dễ tính lại; trên chuỗi dài hàng trăm nghìn
      khối bị mọi nút lật tẩy ngay.</p>

      '
    say: Tổng kết lại, mã khối bằng băm của mã trước nối với dữ liệu, nên sửa một khối là mã đổi ngay. Khối sau không khớp
      liên kết khiến việc sửa bị phát hiện tức thì. Tuy vậy liên kết băm chỉ phát hiện chứ chưa tự ngăn kẻ xấu viết lại. Vì
      thế hệ thống cần thêm chi phí viết lại hoặc sự đồng thuận của số đông. Hai mức quy mô cho thấy sức mạnh thật. Chuỗi
      thử 4 khối rất dễ sửa lại trên một máy. Nhưng chuỗi hàng trăm nghìn khối có mã đỉnh công khai thì sửa 1 chữ bị lật tẩy
      ngay. Cấu trúc liên kết băm biến toàn bộ lịch sử thành một dây chuyền nhạy bén, nơi bất kỳ vết sửa nhỏ nào ở giữa cũng
      làm gãy mọi liên kết sau.
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
  - show: '<div class="box key"><b>Tư duy:</b> một mã băm nhỏ có thể <b>đại diện cho cả lịch sử</b> — giữ được mã đó an toàn
      là giữ được lịch sử.</div>

      '
    say: Tư duy cần mang theo là một mã băm nhỏ vẫn đủ đại diện cho cả lịch sử đứng trước nó. Nhờ tính chất một chiều, giữ
      được mã đỉnh đó an toàn chính là giữ được toàn bộ lịch sử không bị sửa lén. Chỉ cần tin tưởng một dấu vân tay ở đầu
      chuỗi hiện tại là đủ kiểm chứng tính nguyên vẹn của hàng trăm nghìn khối trước đó.
  - clear: true
    show: '<p class="note">Bài sau (bài 2): <b>cây Merkle</b> và bằng chứng thuộc về.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 2, ta học cây Merkle và bằng chứng thuộc về. Hẹn gặp bạn ở bài tiếp theo.
