    0'', ''A trả B 5'', ''B trả C 20'', ''C trả A 1''], H[:2] + [alg.block_hash(H[1], ''B trả C 20'')] + H[3:]) == 3)(alg.build_chain([''khối
    0'', ''A trả B 5'', ''B trả C 2'', ''C trả A 1'']))'
