- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">giao diện nhỏ theo người dùng</span><span class="a">→</span>

      <span class="n">nghiệp vụ phụ thuộc trừu tượng</span><span class="a">→</span>

      <span class="n">tiêm qua tham số</span><span class="a">→</span>

      <span class="n">kiểm thử bằng đối tượng giả</span></div>

      '
    say: Tổng kết lại, tách giao diện nhỏ theo người dùng, cho mã nghiệp vụ phụ thuộc vào trừu tượng, tiêm phụ thuộc qua tham
      số, và kiểm thử bằng đối tượng giả. Tách giao diện giữ hợp đồng gọn gàng đúng vai trò còn đảo phụ thuộc giúp lõi nghiệp
      vụ đứng vững trước sóng gió đổi công nghệ hạ tầng. Giao diện nhỏ đúng vai trò kết hợp đảo phụ thuộc giữ lõi nghiệp vụ
      đứng độc lập khỏi thay đổi hạ tầng.
  - show: '<div class="box key"><b>Tư duy:</b> mã khó kiểm thử thường là mã tự đi lấy thứ nó cần. Hãy để nó <b>nhận</b> thay
      vì <b>lấy</b>.</div>

      '
    say: Điều cần mang theo, mã khó kiểm thử thường là mã tự đi lấy thứ nó cần. Hãy để nó nhận thay vì lấy. Cả năm nguyên
      tắc gắn kết tạo thành khung tư duy kiến trúc phần mềm bền vững từ một lớp tới nhiều dịch vụ.
  - clear: true
    show: '<p class="note">Bài sau (bài 8): <b>mẫu khởi tạo</b> — nhà máy, xây dựng từng bước, đối tượng duy nhất.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 8, ta học các mẫu khởi tạo, gồm mẫu nhà máy, mẫu xây dựng từng bước, và mẫu đối tượng duy nhất. Hẹn
      gặp bạn ở bài tiếp theo. Từ những nguyên tắc trừu tượng này, cộng đồng kỹ sư đã đúc kết các mẫu thiết kế cụ thể mở đầu
      bằng nhóm mẫu khởi tạo đối tượng.
