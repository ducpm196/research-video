      fill="#1f2937">đồng hồ hệ thống</text><line x1="330" y1="180" x2="330" y2="287" stroke="#b91c1c" stroke-width="3" marker-end="url(#arD7)"/><text
      x="345" y="242" font-size="22" fill="#b91c1c">tự gọi, không thay được</text><line x1="750" y1="70" x2="750" y2="400"
      stroke="#d1d5db" stroke-width="3"/><rect x="930" y="110" width="300" height="70" rx="12" fill="#dbeafe" stroke="#2a78d6"
