      x="830" y="290" width="240" height="70" rx="12" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="950" y="334"
      font-size="24" text-anchor="middle" fill="#1f2937">đồng hồ thật</text><rect x="1110" y="290" width="280" height="70"
      rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3" stroke-dasharray="10 6"/><text x="1250" y="334" font-size="24"
      text-anchor="middle" fill="#1f2937">ngày giả 1/1/2025</text><line x1="950" y1="287" x2="1010" y2="183" stroke="#1f2937"
      stroke-width="3" marker-end="url(#arD7)"/><line x1="1250" y1="287" x2="1160" y2="183" stroke="#059669" stroke-width="3"
      marker-end="url(#arD7)"/><text x="950" y="395" font-size="22" text-anchor="middle" fill="#1f2937">chương trình thật</text><text
      x="1250" y="395" font-size="22" text-anchor="middle" fill="#059669">kiểm thử</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình so hai cách nối hàm lời chào với ngày. Bên trái, hàm tự gọi đồng hồ hệ thống, mũi tên đỏ đi từ hàm xuống đồng
      hồ, và không ai chen vào thay được. Bên phải, ngày được đưa vào hàm qua tham số, mũi tên đổi chiều, đi từ ngoài vào
      hàm. Chương trình thật đưa vào đồng hồ thật, còn kiểm thử đưa vào một ngày giả 1 tháng 1, nên kiểm được nhánh chúc mừng
      vào bất kỳ ngày nào. Đèn ngủ cắm vào ổ chuẩn hai chấu chứ không hàn dây đồng thẳng vào trụ điện nhà máy thuỷ điện. Đổi
      nguồn điện mặt trời hay máy phát dự phòng không hề cần sửa chiếc đèn.
- id: example
  kind: example
  title: Tiêm ngày giả để kiểm thử
  checks:
  - alg.greeting(__import__('datetime').date(2025, 1, 1)) == 'Chúc mừng năm mới' and alg.greeting(__import__('datetime').date(2025,
    6, 15)) == 'Xin chào'
  steps:
  - show: '<div class="code"><div>def loi_chao(hom_nay):                <span class="cm"># ngày được truyền vào</span></div><div>    if
      (hom_nay.month, hom_nay.day) == (1, 1): return "Chúc mừng năm mới"</div><div>    return "Xin chào"</div></div>

      <p><b>Bước 1</b> — hàm không còn gọi đồng hồ: ngày là <b>tham số</b>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Bước một, bây giờ hàm lời chào nhận ngày hôm nay làm tham số. Nó vẫn kiểm ngày 1 tháng 1 như trước. Điểm khác duy
      nhất là hàm không còn tự gọi đồng hồ nữa.
  - show: '<p><b>Bước 2</b> — kiểm thử thứ nhất:</p>

      <table class="t"><tr><th>truyền vào</th><th>(tháng, ngày)</th><th>bằng (1, 1)?</th><th>kết quả</th></tr>

      <tr><td><code>date(2025, 1, 1)</code></td><td>(1, 1)</td><td>đúng</td><td>“Chúc mừng năm mới”</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    say: Bước hai, kiểm thử thứ nhất truyền ngày 1 tháng 1 năm 2025. Cặp tháng ngày là 1, 1, bằng cặp cần so, nên hàm trả
      lời chúc mừng năm mới, đúng điều kiểm thử mong.
  - show: '<p><b>Bước 3</b> — kiểm thử thứ hai:</p>

      <table class="t"><tr><th>truyền vào</th><th>(tháng, ngày)</th><th>bằng (1, 1)?</th><th>kết quả</th></tr>

      <tr><td><code>date(2025, 6, 15)</code></td><td>(6, 15)</td><td>sai</td><td>“Xin chào”</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    say: Bước ba, kiểm thử thứ hai truyền ngày 15 tháng 6. Cặp tháng ngày là 6, 15, khác cặp 1, 1, nên hàm trả lời xin chào.
  - clear: true
    show: '<div class="code"><div>from datetime import date</div><div>loi_chao(date.today())               <span class="cm">#
      chương trình thật</span></div></div>

      <p><b>Bước 4</b> — hai kiểm thử chạy được <b>bất kỳ ngày nào</b>, cho kết quả xác định. Chỉ chỗ gọi ngoài cùng mới chạm
      đồng hồ thật.</p>

      <div class="box key">Không cần thư viện hay khung tiêm phụ thuộc nào: <b>một tham số</b> đã là tiêm phụ thuộc — hàm
      hết phụ thuộc vào đồng hồ cụ thể.</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    say: Bước bốn, trong chương trình thật, chỗ gọi ngoài cùng mới lấy ngày từ đồng hồ hệ thống rồi truyền vào. Hai kiểm thử
      kia chạy được vào bất kỳ ngày nào và cho kết quả xác định. Chỉ chỗ gọi ngoài cùng của chương trình thật mới chạm vào
      đồng hồ hệ thống. Không cần thư viện hay khung tiêm phụ thuộc nào, chỉ một tham số đã là tiêm phụ thuộc, và hàm hết
      phụ thuộc vào đồng hồ cụ thể.
  - show: '<div class="code"><div>class DongHo:        <span class="cm"># giao diện nhỏ gọn 1 thao tác cho loi_chao</span></div><div>    def
      hom_nay(self): raise NotImplementedError</div></div>

      <p><b>Bước 5 — tách giao diện theo người dùng:</b> <code>loi_chao</code> chỉ cần ngày tháng, không phải gánh cả phương
      thức đặt giờ hay cấu hình múi giờ của đồng hồ lớn.</p>

      '
    say: Bước năm, minh hoạ chữ I tách giao diện ngay tại chỗ dùng. Thay vì nhận cả đối tượng hệ thống cồng kềnh có hàng chục
      phép chỉnh giờ và múi giờ, hàm lời chào chỉ cần một giao diện nhỏ trả về đúng ngày hôm nay. Nhờ giao diện một hàm gọn
      nhẹ, cả đồng hồ thật lẫn đồng hồ giả khi kiểm thử đều cắm vào dễ dàng.
- id: check
  kind: check
  title: 'Tự kiểm: cho hàm chạy qua mọi ngày trong năm'
  checks:
  - '(lambda D: [(len(ds), sum(alg.greeting(d) == ''Chúc mừng năm mới'' for d in ds)) for ds in ([D.date(y, 1, 1) + D.timedelta(days=i)
    for i in range((D.date(y + 1, 1, 1) - D.date(y, 1, 1)).days)] for y in (2024, 2025))])(__import__(''datetime'')) == [(366,
    1), (365, 1)]'
  steps:
  - show: '<table class="t"><tr><th>năm</th><th>số ngày truyền vào</th><th>số lần “Chúc mừng năm mới”</th></tr>

      <tr><td>2024</td><td>366</td><td>1</td></tr>

      <tr><td>2025</td><td>365</td><td>1</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Kiểm bằng đường khác, vì ngày là tham số nên ta có thể cho hàm chạy qua mọi ngày trong năm, chỉ mất một phần giây.
      Năm 2024 có 366 ngày, đúng một ngày cho lời chúc mừng. Năm 2025 có 365 ngày, cũng đúng một ngày.
  - show: '<table class="t"><tr><th>bản</th><th>muốn thử đủ mọi ngày trong năm</th></tr>

      <tr><td>tự gọi đồng hồ (<b>lấy</b>)</td><td>chờ trọn một năm</td></tr>

      <tr><td>nhận tham số (<b>nhận</b>)</td><td>một lần chạy kiểm thử</td></tr></table>

      <div class="box key">Kiểm được mọi ngày → biết chắc chỉ ngày 1/1 rẽ vào nhánh chúc mừng.</div>

      '
    focus:
    - 1
    - 1
    - 2
    say: Với bản cũ tự gọi đồng hồ, muốn có bảng này ta phải chờ trọn một năm. Đó là cái giá của việc lấy thay vì nhận. Kiểm
      được mọi ngày, ta biết chắc chỉ ngày 1 tháng 1 mới rẽ vào nhánh chúc mừng.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp
  checks:
  - '(lambda d: exec(''import itertools\nc = itertools.count()\ndef f(x=next(c)):\n    return x\n'', d) or [d[''f''](), d[''f''](),
    d[''f''](7)] == [0, 0, 7])({}) and alg.greeting(__import__(''datetime'').date(2024, 12, 31)) == ''Xin chào'''
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ đảo phụ thuộc bắt buộc phải có khung tiêm phụ thuộc <b class="red">(quá
      nặng)</b>

      <br><span class="note">Khung chỉ tự động hoá việc nối các đối tượng. Với chương trình nhỏ, truyền tham số và hàm tạo
      là đủ, dễ đọc hơn.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ đảo phụ thuộc bắt buộc phải có một khung tiêm phụ thuộc. Khung chỉ tự động hoá việc nối các đối
      tượng với nhau, với chương trình nhỏ thì truyền tham số và hàm tạo là đủ, lại dễ đọc hơn.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Giao diện “béo” với hai mươi phương thức <b class="red">(phụ thuộc thừa)</b>

      <br><span class="note">Lớp chỉ cần đọc dữ liệu vẫn phải phụ thuộc vào giao diện có cả ghi, xoá, sao lưu. Đổi phần ghi
