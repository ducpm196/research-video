id: L07
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 7 — SOLID 3: tách giao diện và đảo phụ thuộc"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L07; audit/sdp/verify_sdp.py L07; R. C. Martin, The Dependency Inversion Principle, C++ Report (1996); R. C. Martin, Agile Software Development (2002), chương 11–12; M. Fowler, Inversion of Control Containers and the Dependency Injection pattern (2004)"
assumes: [arith]
# Quy ước: mã minh hoạ Python; alg.greeting(today) nhận ngày làm tham số thay vì tự gọi đồng hồ hệ thống. Ngày giả tạo bằng datetime.date.
#   Tên viết tắt SOLID chỉ trên màn hình; lời đọc nói “hai nguyên lý còn lại”.
objectives:
  - "Tách giao diện lớn thành các giao diện nhỏ theo người dùng"
  - "Tiêm phụ thuộc qua tham số"
  - "Kiểm thử bằng đối tượng giả"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Kiểm thử chỉ đúng một ngày mỗi năm"
    steps:
      - show: |
          <div class="code"><div>def loi_chao():</div><div>    hom_nay = date.today()           <span class="cm"># tự gọi đồng hồ hệ thống</span></div><div>    if (hom_nay.month, hom_nay.day) == (1, 1): return "Chúc mừng năm mới"</div><div>    return "Xin chào"</div></div>
          <p>Muốn kiểm nhánh “Chúc mừng năm mới”, phải chạy kiểm thử đúng ngày 1/1 — hoặc chỉnh đồng hồ máy.</p>
          <div class="box key">Hôm nay: <b>đảo phụ thuộc</b> — đưa thứ hàm cần vào từ ngoài, để kiểm thử được mọi ngày.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, hàm lời chào tự gọi đồng hồ hệ thống để lấy ngày hôm nay. Nếu là ngày 1 tháng 1 thì chúc mừng năm mới, còn lại thì xin chào. Muốn kiểm nhánh chúc mừng năm mới, ta phải chạy kiểm thử đúng ngày 1 tháng 1, hoặc chỉnh đồng hồ máy. Hôm nay ta học đảo phụ thuộc, đưa thứ hàm cần vào từ bên ngoài, để kiểm thử được vào mọi ngày."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hàm cho kết quả xác định, và so sánh một cặp số"
    checks:
      - "(lambda f: [f(2), f(2), f(2)])(lambda x: x + 1) == [3, 3, 3]"
      - "[((d.month, d.day) == (1, 1)) for d in (__import__('datetime').date(2025, 1, 1), __import__('datetime').date(2025, 6, 15))] == [True, False]"
    steps:
      - show: |
          <table class="t"><tr><th>hàm</th><th>gọi lần 1</th><th>gọi lần 2</th><th>xác định?</th></tr>
          <tr><td><code>cong_mot(2)</code></td><td>3</td><td>3</td><td>có: chỉ phụ thuộc tham số</td></tr>
          <tr><td><code>date.today()</code></td><td>hôm nay</td><td>ngày mai sẽ khác</td><td>không: phụ thuộc đồng hồ</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn ý xác định. Hàm cộng một nhận 2 thì lần nào cũng trả 3, vì nó chỉ phụ thuộc tham số. Hàm lấy ngày hôm nay của đồng hồ hệ thống trả kết quả khác nhau theo ngày chạy, nên kiểm thử dựa vào nó không lặp lại được."
      - show: |
          <table class="t"><tr><th>ngày</th><th>cặp (tháng, ngày)</th><th>bằng (1, 1)?</th></tr>
          <tr><td>1/1/2025</td><td>(1, 1)</td><td>đúng</td></tr>
          <tr><td>15/6/2025</td><td>(6, 15)</td><td>sai</td></tr></table>
        focus: [1, 1, "1.2", "1.3"]
        say: "Thứ hai, so sánh một cặp số. Mã so cặp tháng và ngày với cặp 1, 1, hai cặp bằng nhau khi từng số bằng nhau. Ngày 1 tháng 1 cho cặp 1, 1, nên đúng. Ngày 15 tháng 6 cho cặp 6, 15, nên sai."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hai nguyên lý còn lại"
    steps:
      - show: |
          <p><b>Tách giao diện</b> (chữ I): đừng bắt người dùng phụ thuộc vào thao tác họ không dùng. Máy in chỉ cần “in” thì đừng bắt cài cả “quét” và “sao chụp”.</p>
          <p><b>Đảo phụ thuộc</b> (chữ D): mã nghiệp vụ phụ thuộc vào <b>giao diện trừu tượng</b>, không phụ thuộc vào chi tiết cụ thể (đồng hồ hệ thống, cơ sở dữ liệu, mạng).</p>
          <div class="box key"><b>Tiêm phụ thuộc</b>: cách đơn giản nhất để đảo phụ thuộc — truyền thứ cần dùng vào qua tham số hoặc hàm tạo.</div>
        focus: [1, 1, 2, 3]
        say: "Nguyên lý tách giao diện nói đừng bắt người dùng phụ thuộc vào những thao tác họ không dùng. Một máy in chỉ cần in thì đừng bắt nó cài cả quét và sao chụp. Nguyên lý đảo phụ thuộc nói mã nghiệp vụ nên phụ thuộc vào giao diện trừu tượng, không phụ thuộc vào chi tiết cụ thể như đồng hồ hệ thống, cơ sở dữ liệu hay mạng. Tiêm phụ thuộc là cách đơn giản nhất để đảo phụ thuộc, truyền thứ cần dùng vào qua tham số hoặc hàm tạo."

  - id: intuition
    kind: intuition
    title: "Đảo chiều mũi tên: lấy thành nhận"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arD7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="330" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#b91c1c">Trước: hàm tự đi lấy</text><text x="1080" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#059669">Sau: hàm nhận từ ngoài</text><rect x="200" y="110" width="260" height="70" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="330" y="154" font-size="24" text-anchor="middle" fill="#1f2937">loi_chao()</text><rect x="170" y="290" width="320" height="70" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="330" y="334" font-size="24" text-anchor="middle" fill="#1f2937">đồng hồ hệ thống</text><line x1="330" y1="180" x2="330" y2="287" stroke="#b91c1c" stroke-width="3" marker-end="url(#arD7)"/><text x="345" y="242" font-size="22" fill="#b91c1c">tự gọi, không thay được</text><line x1="750" y1="70" x2="750" y2="400" stroke="#d1d5db" stroke-width="3"/><rect x="930" y="110" width="300" height="70" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1080" y="154" font-size="24" text-anchor="middle" fill="#1f2937">loi_chao(hom_nay)</text><rect x="830" y="290" width="240" height="70" rx="12" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="950" y="334" font-size="24" text-anchor="middle" fill="#1f2937">đồng hồ thật</text><rect x="1110" y="290" width="280" height="70" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3" stroke-dasharray="10 6"/><text x="1250" y="334" font-size="24" text-anchor="middle" fill="#1f2937">ngày giả 1/1/2025</text><line x1="950" y1="287" x2="1010" y2="183" stroke="#1f2937" stroke-width="3" marker-end="url(#arD7)"/><line x1="1250" y1="287" x2="1160" y2="183" stroke="#059669" stroke-width="3" marker-end="url(#arD7)"/><text x="950" y="395" font-size="22" text-anchor="middle" fill="#1f2937">chương trình thật</text><text x="1250" y="395" font-size="22" text-anchor="middle" fill="#059669">kiểm thử</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình so hai cách nối hàm lời chào với ngày. Bên trái, hàm tự gọi đồng hồ hệ thống, mũi tên đỏ đi từ hàm xuống đồng hồ, và không ai chen vào thay được. Bên phải, ngày được đưa vào hàm qua tham số, mũi tên đổi chiều, đi từ ngoài vào hàm. Chương trình thật đưa vào đồng hồ thật, còn kiểm thử đưa vào một ngày giả 1 tháng 1, nên kiểm được nhánh chúc mừng vào bất kỳ ngày nào."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tiêm ngày giả để kiểm thử"
    checks:
      - "alg.greeting(__import__('datetime').date(2025, 1, 1)) == 'Chúc mừng năm mới' and alg.greeting(__import__('datetime').date(2025, 6, 15)) == 'Xin chào'"
    steps:
      - show: |
          <div class="code"><div>def loi_chao(hom_nay):                <span class="cm"># ngày được truyền vào</span></div><div>    if (hom_nay.month, hom_nay.day) == (1, 1): return "Chúc mừng năm mới"</div><div>    return "Xin chào"</div></div>
          <p><b>Bước 1</b> — hàm không còn gọi đồng hồ: ngày là <b>tham số</b>.</p>
        focus: [1, 1, 2]
        say: "Bước một, bây giờ hàm lời chào nhận ngày hôm nay làm tham số. Nó vẫn kiểm ngày 1 tháng 1 như trước. Điểm khác duy nhất là hàm không còn tự gọi đồng hồ nữa."
      - show: |
          <p><b>Bước 2</b> — kiểm thử thứ nhất:</p>
          <table class="t"><tr><th>truyền vào</th><th>(tháng, ngày)</th><th>bằng (1, 1)?</th><th>kết quả</th></tr>
          <tr><td><code>date(2025, 1, 1)</code></td><td>(1, 1)</td><td>đúng</td><td>“Chúc mừng năm mới”</td></tr></table>
        focus: [1, "2.2"]
        say: "Bước hai, kiểm thử thứ nhất truyền ngày 1 tháng 1 năm 2025. Cặp tháng ngày là 1, 1, bằng cặp cần so, nên hàm trả lời chúc mừng năm mới, đúng điều kiểm thử mong."
      - show: |
          <p><b>Bước 3</b> — kiểm thử thứ hai:</p>
          <table class="t"><tr><th>truyền vào</th><th>(tháng, ngày)</th><th>bằng (1, 1)?</th><th>kết quả</th></tr>
          <tr><td><code>date(2025, 6, 15)</code></td><td>(6, 15)</td><td>sai</td><td>“Xin chào”</td></tr></table>
        focus: [1, "2.2"]
        say: "Bước ba, kiểm thử thứ hai truyền ngày 15 tháng 6. Cặp tháng ngày là 6, 15, khác cặp 1, 1, nên hàm trả lời xin chào."
      - clear: true
        show: |
          <div class="code"><div>loi_chao(date.today())               <span class="cm"># chương trình thật</span></div></div>
          <p><b>Bước 4</b> — hai kiểm thử chạy được <b>bất kỳ ngày nào</b>, cho kết quả xác định. Chỉ chỗ gọi ngoài cùng mới chạm đồng hồ thật.</p>
          <div class="box key">Không cần thư viện hay khung tiêm phụ thuộc nào: <b>một tham số</b> đã là đảo phụ thuộc.</div>
        focus: [1, 2, 2, 3]
        say: "Bước bốn, trong chương trình thật, chỗ gọi ngoài cùng mới lấy ngày từ đồng hồ hệ thống rồi truyền vào. Hai kiểm thử kia chạy được vào bất kỳ ngày nào và cho kết quả xác định. Chỉ chỗ gọi ngoài cùng của chương trình thật mới chạm vào đồng hồ hệ thống. Không cần thư viện hay khung tiêm phụ thuộc nào, chỉ một tham số đã là đảo phụ thuộc."

  - id: check
    kind: check
    title: "Tự kiểm: cho hàm chạy qua mọi ngày trong năm"
    checks:
      - "(lambda D: [(len(ds), sum(alg.greeting(d) == 'Chúc mừng năm mới' for d in ds)) for ds in ([D.date(y, 1, 1) + D.timedelta(days=i) for i in range((D.date(y + 1, 1, 1) - D.date(y, 1, 1)).days)] for y in (2024, 2025))])(__import__('datetime')) == [(366, 1), (365, 1)]"
    steps:
      - show: |
          <table class="t"><tr><th>năm</th><th>số ngày truyền vào</th><th>số lần “Chúc mừng năm mới”</th></tr>
          <tr><td>2024</td><td>366</td><td>1</td></tr>
          <tr><td>2025</td><td>365</td><td>1</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, vì ngày là tham số nên ta có thể cho hàm chạy qua mọi ngày trong năm, chỉ mất một phần giây. Năm 2024 có 366 ngày, đúng một ngày cho lời chúc mừng. Năm 2025 có 365 ngày, cũng đúng một ngày."
      - show: |
          <table class="t"><tr><th>bản</th><th>muốn thử đủ mọi ngày trong năm</th></tr>
          <tr><td>tự gọi đồng hồ (<b>lấy</b>)</td><td>chờ trọn một năm</td></tr>
          <tr><td>nhận tham số (<b>nhận</b>)</td><td>một lần chạy kiểm thử</td></tr></table>
          <div class="box key">Kiểm được mọi ngày → biết chắc chỉ ngày 1/1 rẽ vào nhánh chúc mừng.</div>
        focus: [1, 1, 2]
        say: "Với bản cũ tự gọi đồng hồ, muốn có bảng này ta phải chờ trọn một năm. Đó là cái giá của việc lấy thay vì nhận. Kiểm được mọi ngày, ta biết chắc chỉ ngày 1 tháng 1 mới rẽ vào nhánh chúc mừng."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda d: exec('import itertools\\nc = itertools.count()\\ndef f(x=next(c)):\\n    return x\\n', d) or [d['f'](), d['f'](), d['f'](7)] == [0, 0, 7])({}) and alg.greeting(__import__('datetime').date(2024, 12, 31)) == 'Xin chào'"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ đảo phụ thuộc bắt buộc phải có khung tiêm phụ thuộc <b class="red">(quá nặng)</b>
          <br><span class="note">Khung chỉ tự động hoá việc nối các đối tượng. Với chương trình nhỏ, truyền tham số và hàm tạo là đủ, dễ đọc hơn.</span></div>
        say: "Lỗi thứ nhất, nghĩ đảo phụ thuộc bắt buộc phải có một khung tiêm phụ thuộc. Khung chỉ tự động hoá việc nối các đối tượng với nhau, với chương trình nhỏ thì truyền tham số và hàm tạo là đủ, lại dễ đọc hơn."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Giao diện “béo” với hai mươi phương thức <b class="red">(phụ thuộc thừa)</b>
          <br><span class="note">Lớp chỉ cần đọc dữ liệu vẫn phải phụ thuộc vào giao diện có cả ghi, xoá, sao lưu. Đổi phần ghi là phải kiểm lại cả phần chỉ đọc.</span></div>
        say: "Lỗi thứ hai, giao diện béo với hai mươi phương thức. Lớp chỉ cần đọc dữ liệu vẫn phải phụ thuộc vào giao diện có cả ghi, xoá và sao lưu, nên đổi phần ghi là phải kiểm lại cả phần chỉ đọc."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đối tượng giả quá thông minh <b class="red">(kiểm sai thứ)</b>
          <br><span class="note">Đối tượng giả có logic riêng phức tạp thì kiểm thử đang kiểm đối tượng giả. Giữ đối tượng giả đơn giản: trả giá trị cố định.</span></div>
        say: "Lỗi thứ ba, đối tượng giả quá thông minh. Nếu đối tượng giả có logic riêng phức tạp thì kiểm thử đang kiểm chính đối tượng giả, nên hãy giữ nó đơn giản, chỉ trả về giá trị cố định."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Đặt đồng hồ làm <b>giá trị mặc định</b> của tham số: <code>def loi_chao(hom_nay=date.today())</code> <b class="red">(ngày đóng băng)</b></div>
          <table class="t"><tr><th>máy chủ bật lúc</th><th>gọi <code>loi_chao()</code> vào</th><th><code>hom_nay</code> thực nhận</th><th>kết quả</th></tr>
          <tr><td>31/12/2024</td><td>1/1/2025</td><td class="red">31/12/2024</td><td>“Xin chào” (sai)</td></tr></table>
          <p class="note">Giá trị mặc định được tính <b>một lần</b>, lúc định nghĩa hàm. Cách đúng: mặc định <code>None</code>, rồi trong thân hàm mới lấy ngày.</p>
        focus: [1, "2.2", 3, 3]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, muốn tiện nên đặt ngày hôm nay làm giá trị mặc định của tham số. Máy chủ bật lúc ngày 31 tháng 12, đến ngày 1 tháng 1 gọi hàm không truyền ngày, hàm vẫn nhận ngày 31 tháng 12 và trả lời xin chào. Lý do là giá trị mặc định chỉ được tính một lần, lúc định nghĩa hàm, rồi dùng lại mãi. Người làm nghề để mặc định là rỗng, rồi trong thân hàm mới lấy ngày, nên vừa kiểm thử được vừa không bị đóng băng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda d: exec('def gui_thong_bao(nguoi_gui, noi_dung):\\n    nguoi_gui.gui(noi_dung)\\nclass GuiGia:\\n    def __init__(self): self.da_gui = []\\n    def gui(self, thu): self.da_gui.append(thu)\\ng = GuiGia()\\ngui_thong_bao(g, \"Đơn 42 đã giao\")\\n', d) or d['g'].da_gui == ['Đơn 42 đã giao'])({})"
      - "alg.greeting(__import__('datetime').date(2024, 12, 31)) == 'Xin chào' and alg.greeting(__import__('datetime').date(2030, 1, 1)) == 'Chúc mừng năm mới'"
    steps:
      - show: |
