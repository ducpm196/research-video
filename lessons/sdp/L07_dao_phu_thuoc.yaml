id: L07
course: SDP
series: SDP · Kỹ thuật lập trình và mẫu thiết kế
title: 'Bài 7 — SOLID 3: tách giao diện và đảo phụ thuộc'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/sdp.yaml L07; audit/sdp/verify_sdp.py L07; R. C. Martin, The Dependency Inversion Principle, C++ Report
  (1996); R. C. Martin, Agile Software Development (2002), chương 11–12; M. Fowler, Inversion of Control Containers and the
  Dependency Injection pattern (2004)
