- arith
objectives:
- Tách giao diện lớn thành các giao diện nhỏ theo người dùng
- Tiêm phụ thuộc qua tham số
- Kiểm thử bằng đối tượng giả
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: Kiểm thử chỉ đúng một ngày mỗi năm
  steps:
  - show: '<div class="code"><div>from datetime import date</div><div>def loi_chao():</div><div>    hom_nay = date.today()           <span
      class="cm"># tự gọi đồng hồ hệ thống</span></div><div>    if (hom_nay.month, hom_nay.day) == (1, 1): return "Chúc mừng
      năm mới"</div><div>    return "Xin chào"</div></div>

      <p>Muốn kiểm nhánh “Chúc mừng năm mới”, phải chạy kiểm thử đúng ngày 1/1 — hoặc chỉnh đồng hồ máy.</p>

      <div class="box key">Hôm nay: <b>đảo phụ thuộc</b> — đưa thứ hàm cần vào từ ngoài, để kiểm thử được mọi ngày.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 3
    - 3
    say: Chào bạn, hàm lời chào tự gọi đồng hồ hệ thống để lấy ngày hôm nay. Nếu là ngày 1 tháng 1 thì chúc mừng năm mới,
      còn lại thì xin chào. Muốn kiểm nhánh chúc mừng năm mới, ta phải chạy kiểm thử đúng ngày 1 tháng 1, hoặc chỉnh đồng
      hồ máy. Hôm nay ta học đảo phụ thuộc, đưa thứ hàm cần vào từ bên ngoài, để kiểm thử được vào mọi ngày. Gắn thêm một
      phương thức in ấn vào giao diện chung làm mười lăm lớp thiết bị chỉ quét văn bản bỗng dưng gãy biên dịch không lý do.
      Tách nhỏ giao diện và đảo chiều phụ thuộc hướng mọi khối nghiệp vụ về phụ thuộc vào bản trừu tượng gọn nhẹ thay vì chi
      tiết hạ tầng cụ thể.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: hàm cho kết quả xác định, và so sánh một cặp số'
  checks:
  - '(lambda f: [f(2), f(2), f(2)])(lambda x: x + 1) == [3, 3, 3]'
  - '[((d.month, d.day) == (1, 1)) for d in (__import__(''datetime'').date(2025, 1, 1), __import__(''datetime'').date(2025,
    6, 15))] == [True, False]'
  steps:
  - show: '<table class="t"><tr><th>hàm</th><th>gọi lần 1</th><th>gọi lần 2</th><th>xác định?</th></tr>

      <tr><td><code>cong_mot(2)</code></td><td>3</td><td>3</td><td>có: chỉ phụ thuộc tham số</td></tr>

      <tr><td><code>date.today()</code></td><td>hôm nay</td><td>ngày mai sẽ khác</td><td>không: phụ thuộc đồng hồ</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    say: Trước hết, ôn ý xác định. Hàm cộng một nhận 2 thì lần nào cũng trả 3, vì nó chỉ phụ thuộc tham số. Hàm lấy ngày hôm
      nay của đồng hồ hệ thống trả kết quả khác nhau theo ngày chạy, nên kiểm thử dựa vào nó không lặp lại được. Nguyên lý
      tách giao diện cấm ép bên gọi phải phụ thuộc vào những phương thức khổng lồ mà nó không hề sử dụng tới. Thay vào đó
      hãy chia thành các giao diện vai trò nhỏ gọn đúng tầm từng nhóm khách hàng gọi tới.
  - show: '<table class="t"><tr><th>ngày</th><th>cặp (tháng, ngày)</th><th>bằng (1, 1)?</th></tr>

      <tr><td>1/1/2025</td><td>(1, 1)</td><td>đúng</td></tr>

      <tr><td>15/6/2025</td><td>(6, 15)</td><td>sai</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Thứ hai, so sánh một cặp số. Mã so cặp tháng và ngày với cặp 1, 1, hai cặp bằng nhau khi từng số bằng nhau. Ngày
      1 tháng 1 cho cặp 1, 1, nên đúng. Ngày 15 tháng 6 cho cặp 6, 15, nên sai. Nguyên lý đảo phụ thuộc phát biểu mô-đun nghiệp
      vụ tầng cao không được gắn trực tiếp vào mô-đun chi tiết hạ tầng tầng thấp mà cả hai cùng trỏ về giao diện trừu tượng.
- id: sym
  kind: symbol
  title: 'Giải mã: hai nguyên lý còn lại'
  steps:
  - show: '<p><b>Tách giao diện</b> (chữ I): đừng bắt người dùng phụ thuộc vào thao tác họ không dùng. Máy in chỉ cần “in”
      thì đừng bắt cài cả “quét” và “sao chụp”.</p>

      <p><b>Đảo phụ thuộc</b> (chữ D): mã nghiệp vụ phụ thuộc vào <b>giao diện trừu tượng</b>, không phụ thuộc vào chi tiết
      cụ thể (đồng hồ hệ thống, cơ sở dữ liệu, mạng).</p>

      <div class="box key"><b>Tiêm phụ thuộc</b>: cách đơn giản nhất để đảo phụ thuộc — truyền thứ cần dùng vào qua tham số
      hoặc hàm tạo.</div>

      <p class="note"><b>Đối tượng giả</b>: vật thay thế đơn giản cho phụ thuộc thật, chỉ dùng khi kiểm thử — ví dụ ngày cố
      định 1/1/2025 thay cho đồng hồ.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    - 4
    say: Nguyên lý tách giao diện nói đừng bắt người dùng phụ thuộc vào những thao tác họ không dùng. Một máy in chỉ cần in
      thì đừng bắt nó cài cả quét và sao chụp. Nguyên lý đảo phụ thuộc nói mã nghiệp vụ nên phụ thuộc vào giao diện trừu tượng,
      không phụ thuộc vào chi tiết cụ thể như đồng hồ hệ thống, cơ sở dữ liệu hay mạng. Tiêm phụ thuộc là cách đơn giản nhất
      để đảo phụ thuộc, truyền thứ cần dùng vào qua tham số hoặc hàm tạo. Khi kiểm thử, ta truyền vào một đối tượng giả, tức
      một vật thay thế đơn giản cho thứ thật, chẳng hạn một ngày cố định 1 tháng 1 năm 2025 thay cho đồng hồ. Điều quan trọng
      là giao diện trừu tượng đó phải do tầng nghiệp vụ định nghĩa theo ngôn ngữ của nó chứ không sao chép tên hàm của thư
      viện hạ tầng.
