id: L14
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 14 — Thiết kế API và phiên bản ngữ nghĩa"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L14; audit/sdp/verify_sdp.py L14; T. Preston-Werner, Semantic Versioning 2.0.0 (semver.org); J. Bloch, How to Design a Good API and Why it Matters, OOPSLA Companion (2006); H. Wright, Hyrum's Law (hyrumslaw.com); SWF bài 11 (hợp đồng giữa dịch vụ)"
assumes: [arith]
# Quy ước: phiên bản dạng MAJOR.MINOR.PATCH (Semantic Versioning 2.0.0). alg.semver_bump(v, loại): “sửa lỗi” tăng PATCH; “thêm tương thích”
#   tăng MINOR và đặt PATCH = 0; “phá vỡ” tăng MAJOR và đặt hai số sau = 0. Lời đọc: API = “giao diện lập trình”; MAJOR/MINOR/PATCH = “số chính,
#   số phụ, số vá”.
objectives:
  - "Giữ tương thích ngược"
  - "Chọn tăng số chính, số phụ hay số vá"
  - "Nhận ra thay đổi phá vỡ ẩn"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cập nhật nhỏ, ứng dụng sập"
    steps:
      - show: |
          <p>Thư viện thanh toán lên từ 1.4.2 lên 1.4.3, ghi chú “sửa lỗi nhỏ”. Trong đó trường <code>so_tien</code> được đổi từ đồng sang nghìn đồng. Các ứng dụng cho phép tự lên bản sửa lỗi đều nhận ngay bản này — và thu tiền khách ít đi một nghìn lần.</p>
          <div class="box key">Hôm nay: <b>thiết kế API</b> và <b>phiên bản ngữ nghĩa</b> — con số phiên bản là một lời hứa về tương thích.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một thư viện thanh toán lên từ bản 1 chấm 4 chấm 2 lên 1 chấm 4 chấm 3, ghi chú là sửa lỗi nhỏ. Nhưng trong đó, trường số tiền được đổi từ đồng sang nghìn đồng. Các ứng dụng cho phép tự lên bản sửa lỗi đều nhận ngay bản này, và thu tiền khách ít đi một nghìn lần. Hôm nay ta học thiết kế giao diện lập trình và phiên bản ngữ nghĩa, con số phiên bản là một lời hứa về tương thích."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: tham số mặc định, so từng phần, danh sách và bộ"
    checks:
      - "(lambda d: exec('def tinh(x, tien_te=\"VND\"):\\n    return (x, tien_te)\\n', d) or (d['tinh'](5) == (5, 'VND') and d['tinh'](5, 'USD') == (5, 'USD')))({})"
      - "(1, 4, 3) < (1, 5, 0) and (1, 10, 0) > (1, 9, 0)"
      - "hasattr([1, 2], 'append') and not hasattr((1, 2), 'append')"
    steps:
      - show: |
          <div class="code"><div>def tinh(x, tien_te="VND"):</div><div>    return (x, tien_te)</div></div>
          <table class="t"><tr><th>lời gọi</th><th>kết quả</th></tr>
          <tr><td><code>tinh(5)</code></td><td><code>(5, "VND")</code> — dùng giá trị mặc định</td></tr>
          <tr><td><code>tinh(5, "USD")</code></td><td><code>(5, "USD")</code></td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Trước hết, ôn tham số có giá trị mặc định. Hàm tính nhận x và một tham số đơn vị tiền tệ, mặc định là đồng Việt Nam. Gọi chỉ với số 5 thì hàm tự dùng giá trị mặc định. Gọi kèm đô la thì hàm dùng giá trị được truyền vào."
      - show: |
          <table class="t"><tr><th>so</th><th>phần đầu</th><th>phần hai</th><th>kết luận</th></tr>
          <tr><td>1.4.3 với 1.5.0</td><td>1 = 1</td><td>4 &lt; 5</td><td>1.4.3 cũ hơn</td></tr>
          <tr><td>1.10.0 với 1.9.0</td><td>1 = 1</td><td>10 &gt; 9</td><td>1.10.0 mới hơn</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Tiếp theo, so hai phiên bản bằng cách so từng phần từ trái sang, mỗi phần là một số nguyên. So 1 chấm 4 chấm 3 với 1 chấm 5 chấm 0, phần đầu bằng nhau, phần hai 4 nhỏ hơn 5, nên bản đầu cũ hơn. So 1 chấm 10 chấm 0 với 1 chấm 9 chấm 0, phần hai 10 lớn hơn 9, nên bản đầu mới hơn."
      - clear: true
        show: |
          <table class="t"><tr><th>kiểu</th><th>viết</th><th>thêm phần tử bằng <code>append</code>?</th></tr>
          <tr><td>danh sách</td><td><code>[1, 2]</code></td><td>được</td></tr>
          <tr><td>bộ giá trị</td><td><code>(1, 2)</code></td><td class="red">không có, báo lỗi</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Cuối cùng, phân biệt danh sách và bộ giá trị. Danh sách viết trong ngoặc vuông, thêm phần tử được. Bộ giá trị viết trong ngoặc tròn, không thêm phần tử được, gọi lệnh thêm sẽ báo lỗi."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: MAJOR.MINOR.PATCH"
    steps:
      - show: |
          <table class="t"><tr><th>tăng</th><th>khi nào</th><th>người dùng</th></tr>
          <tr><td><b>PATCH</b> (số vá)</td><td>sửa lỗi, hành vi đã hứa không đổi</td><td>cập nhật an toàn</td></tr>
          <tr><td><b>MINOR</b> (số phụ)</td><td>thêm tính năng tương thích ngược; số vá về 0</td><td>cập nhật an toàn</td></tr>
          <tr><td><b>MAJOR</b> (số chính)</td><td>thay đổi phá vỡ; hai số sau về 0</td><td>phải đọc và sửa mã</td></tr></table>
          <div class="box key"><b>Tương thích ngược</b>: mọi chương trình viết đúng cho bản cũ vẫn chạy đúng với bản mới.</div>
          <p class="note"><b>API</b> (giao diện lập trình): các hàm, kiểu, trường mà thư viện mở cho chương trình khác dùng, kèm ý nghĩa của chúng. <b>Chữ ký hàm</b>: tên hàm, các tham số và kiểu của chúng.</p>
        focus: [3, 3, 1, "1.2", "1.3", "1.4", 2]
        say: "Trước hết, giao diện lập trình của một thư viện là các hàm, kiểu, trường mà nó mở cho chương trình khác dùng, kèm ý nghĩa của chúng. Chữ ký của một hàm là tên hàm cùng các tham số và kiểu của chúng. Phiên bản ngữ nghĩa gồm ba số, số chính, số phụ và số vá. Tăng số vá khi sửa lỗi mà hành vi đã hứa không đổi, người dùng cập nhật an toàn. Tăng số phụ khi thêm tính năng tương thích ngược, số vá về 0, người dùng vẫn cập nhật an toàn. Tăng số chính khi có thay đổi phá vỡ, hai số sau về 0, người dùng phải đọc và sửa mã. Tương thích ngược nghĩa là mọi chương trình viết đúng cho bản cũ vẫn chạy đúng với bản mới."

  - id: intuition
    kind: intuition
    title: "Vùng tự cập nhật trên trục phiên bản"
    steps:
      - show: |
          <div><svg width="1500" height="320" viewBox="0 0 1500 320"><rect x="200" y="125" width="900" height="50" fill="#d1fae5" stroke="#059669" stroke-width="3"/><rect x="1100" y="125" width="320" height="50" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><line x1="80" y1="150" x2="1440" y2="150" stroke="#1f2937" stroke-width="3"/><g stroke="#1f2937" stroke-width="4"><line x1="200" y1="110" x2="200" y2="190"/><line x1="400" y1="110" x2="400" y2="190"/><line x1="650" y1="110" x2="650" y2="190"/><line x1="1100" y1="110" x2="1100" y2="190"/></g><g font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937"><text x="200" y="222">1.4.2</text><text x="400" y="222">1.4.3</text><text x="650" y="222">1.5.0</text><text x="1100" y="222">2.0.0</text></g><g font-size="24" text-anchor="middle"><text x="650" y="92" fill="#059669">tự cập nhật: từ 1.4.2 tới trước 2.0.0</text><text x="1265" y="92" fill="#b91c1c">không tự lên</text></g><g font-size="22" fill="#1f2937" text-anchor="middle"><text x="400" y="262">sửa lỗi: số vá</text><text x="650" y="262">thêm: số phụ</text><text x="1100" y="262">phá vỡ: số chính</text><text x="400" y="300" fill="#eb6834">1.4.3 lén đổi đơn vị tiền vẫn lọt vào vùng xanh</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đặt các phiên bản lên một trục. Người dùng thường khai báo chấp nhận mọi bản từ 1 chấm 4 chấm 2 tới trước 2 chấm 0 chấm 0, đó là vùng xanh, công cụ tự cập nhật trong vùng này mà không hỏi ai. Sửa lỗi và thêm tương thích chỉ đẩy phiên bản đi trong vùng xanh, còn phá vỡ thì nhảy sang vùng đỏ, nơi người dùng phải tự đọc và sửa mã. Vì thế bản 1 chấm 4 chấm 3 lén đổi đơn vị tiền vẫn lọt vào vùng xanh, và đi thẳng vào mọi ứng dụng."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ba thay đổi từ 1.4.2"
    checks:
      - "alg.semver_bump('1.4.2', 'sửa lỗi') == '1.4.3' and alg.semver_bump('1.4.2', 'thêm tương thích') == '1.5.0' and alg.semver_bump('1.4.2', 'phá vỡ') == '2.0.0'"
    steps:
      - show: |
          <table class="t"><tr><th>thay đổi</th><th>loại</th><th>bản mới</th></tr>
          <tr><td>sửa làm tròn sai ở hàm tính thuế</td><td>sửa lỗi</td><td>$\hl{1.4.3}$</td></tr></table>
          <p><b>Bước 1</b> — hành vi đã hứa không đổi, chỉ hết sai → tăng số vá: 2 lên 3.</p>
        focus: [1, 2]
        say: "Bước một, cả ba thay đổi cùng bắt đầu từ bản 1 chấm 4 chấm 2. Sửa làm tròn sai ở hàm tính thuế là sửa lỗi, hành vi đã hứa không đổi, nên tăng số vá từ 2 lên 3, được 1 chấm 4 chấm 3."
      - show: |
          <div class="code"><div>def tinh_thue(so_tien, tien_te="VND"):   <span class="cm"># tham số mới, có mặc định</span></div></div>
          <p><b>Bước 2</b> — lời gọi cũ <code>tinh_thue(100)</code> không truyền tham số mới vẫn chạy như trước → thêm, tương thích → số phụ 4 lên 5, số vá về 0: $\hl{1.5.0}$.</p>
        focus: [1, 2]
        say: "Bước hai, thêm một tham số tuỳ chọn cho đơn vị tiền tệ, có giá trị mặc định. Lời gọi cũ không truyền tham số mới vẫn chạy như trước, nên đây là thêm tương thích, số phụ từ 4 lên 5, số vá về 0, được 1 chấm 5 chấm 0."
      - show: |
          <div class="code"><div>kq = tinh_thue(100)</div><div>print(kq["ma_cu"])        <span class="cm"># bản mới không còn trường này → KeyError</span></div></div>
          <p><b>Bước 3</b> — bỏ trường <code>ma_cu</code> khỏi kết quả: mã cũ đọc trường đó sẽ lỗi → phá vỡ → số chính 1 lên 2, hai số sau về 0: $\hl{2.0.0}$.</p>
        focus: [1, 2]
        say: "Bước ba, bỏ một trường khỏi kết quả. Mã cũ đọc trường đó sẽ lỗi, nên đây là phá vỡ, số chính từ 1 lên 2, hai số sau về 0, được 2 chấm 0 chấm 0."
      - clear: true
        show: |
          <p><b>Bước 4</b> — người dùng chấp nhận từ 1.4.2 tới trước 2.0.0 sẽ nhận gì?</p>
          <table class="t"><tr><th>bản</th><th>trong vùng tự cập nhật?</th><th>mã cũ</th></tr>
          <tr><td>1.4.3</td><td>có</td><td>chạy đúng</td></tr>
          <tr><td>1.5.0</td><td>có</td><td>chạy đúng</td></tr>
          <tr><td>2.0.0</td><td>không</td><td>chỉ lên khi người dùng chủ động sửa</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước bốn, xét người dùng chấp nhận mọi bản từ 1 chấm 4 chấm 2 tới trước 2 chấm 0 chấm 0. Bản 1 chấm 4 chấm 3 nằm trong vùng, tự cập nhật, mã cũ chạy đúng. Bản 1 chấm 5 chấm 0 cũng vậy. Bản 2 chấm 0 chấm 0 nằm ngoài vùng, chỉ lên khi người dùng chủ động đọc và sửa mã."

  - id: check
    kind: check
    title: "Tự kiểm: chạy thật mã cũ trên từng bản"
    checks:
      - "(lambda d: exec('def v143(so_tien):\\n    return {\"thue\": round(so_tien * 0.1), \"ma_cu\": 7}\\ndef v150(so_tien, tien_te=\"VND\"):\\n    return {\"thue\": round(so_tien * 0.1), \"ma_cu\": 7}\\ndef v200(so_tien, tien_te=\"VND\"):\\n    return {\"thue\": round(so_tien * 0.1)}\\ndef cu(f):\\n    try:\\n        return f(100)[\"ma_cu\"]\\n    except Exception as e:\\n        return type(e).__name__\\n', d) or [d['cu'](d['v143']), d['cu'](d['v150']), d['cu'](d['v200'])] == [7, 7, 'KeyError'])({})"
      - "[(1, 4, 2) <= v < (2, 0, 0) for v in [(1, 4, 3), (1, 5, 0), (2, 0, 0)]] == [True, True, False]"
    steps:
      - show: |
          <table class="t"><tr><th>bản (mô phỏng)</th><th>chạy mã cũ <code>tinh_thue(100)["ma_cu"]</code></th><th>khớp phân loại?</th></tr>
          <tr><td>1.4.3</td><td>7</td><td>✓ an toàn</td></tr>
          <tr><td>1.5.0</td><td>7</td><td>✓ an toàn</td></tr>
          <tr><td>2.0.0</td><td class="red">KeyError</td><td>✓ phá vỡ</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, không dùng quy tắc mà chạy thật mã cũ trên ba bản mô phỏng. Bản 1 chấm 4 chấm 3 trả về trường mã cũ bằng 7, chạy bình thường. Bản 1 chấm 5 chấm 0 cũng trả 7, vì lời gọi cũ dùng giá trị mặc định. Bản 2 chấm 0 chấm 0 báo lỗi thiếu khoá, nên khớp đúng phân loại phá vỡ."
      - show: |
          $$(1, 4, 2) \leq (1, 5, 0) \lt (2, 0, 0)$$
          <p>So từng phần với hai đầu vùng: 1.5.0 trong vùng; 2.0.0 không nhỏ hơn chính nó → ngoài vùng.</p>
        introduces: [geq]
        focus: [1, 1, 2]
        say: "So từng phần với hai đầu vùng cũng cho cùng kết luận. Bản 1 chấm 5 chấm 0 lớn hơn hoặc bằng đầu dưới và nhỏ hơn 2 chấm 0 chấm 0, nên nằm trong vùng. Bản 2 chấm 0 chấm 0 không nhỏ hơn chính nó, nên nằm ngoài vùng."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "max(['1.9.0', '1.10.0', '1.2.0']) == '1.9.0' and max(['1.9.0', '1.10.0', '1.2.0'], key=lambda v: tuple(int(x) for x in v.split('.'))) == '1.10.0'"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đổi hành vi mà giữ chữ ký hàm, rồi gọi là sửa lỗi <b class="red">(phá vỡ ẩn)</b>
          <br><span class="note">Như ví dụ mở đầu: tên và kiểu tham số giữ nguyên, nhưng đơn vị đổi. Hợp đồng gồm cả <b>ý nghĩa</b>, không chỉ chữ ký → phải tăng số chính.</span></div>
        say: "Lỗi thứ nhất, đổi hành vi mà giữ nguyên chữ ký hàm, rồi gọi đó là sửa lỗi. Như ví dụ mở đầu, tên và kiểu tham số giữ nguyên nhưng đơn vị đã đổi. Hợp đồng gồm cả ý nghĩa, không chỉ chữ ký, nên phải tăng số chính."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Mở quá nhiều thứ ra ngoài <b class="red">(khó đổi)</b>
          <br><span class="note">Khi đủ nhiều người dùng, mọi hành vi quan sát được đều sẽ có người dựa vào, kể cả thứ tự phần tử hay nội dung thông báo lỗi. Mở ít nhất có thể; thêm sau dễ hơn bỏ.</span></div>
        say: "Lỗi thứ hai, mở quá nhiều thứ ra ngoài. Khi đủ nhiều người dùng, mọi hành vi quan sát được đều sẽ có người dựa vào, kể cả thứ tự phần tử hay nội dung thông báo lỗi. Hãy mở ít nhất có thể, vì thêm sau dễ hơn bỏ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Bỏ tính năng không báo trước <b class="red">(bất ngờ)</b>
          <br><span class="note">Đánh dấu “sắp bỏ” ở một bản số phụ, kèm cảnh báo và cách thay thế; chỉ thật sự bỏ ở bản số chính kế tiếp.</span></div>
        say: "Lỗi thứ ba, bỏ tính năng mà không báo trước. Hãy đánh dấu sắp bỏ ở một bản số phụ, kèm cảnh báo và cách thay thế, và chỉ thật sự bỏ ở bản số chính kế tiếp."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Kịch bản phát hành so phiên bản như so chữ <b class="red">(chọn nhầm bản)</b></div>
          <table class="t"><tr><th>ba bản: 1.9.0, 1.10.0, 1.2.0</th><th>bản “mới nhất”</th></tr>
          <tr><td>so như chữ, từng kí tự</td><td class="red">1.9.0 (sai)</td></tr>
          <tr><td>so từng phần như số nguyên</td><td>1.10.0 ✓</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, viết kịch bản phát hành tự chọn bản mới nhất, nhưng so phiên bản như so chữ. Với ba bản 1 chấm 9 chấm 0, 1 chấm 10 chấm 0, và 1 chấm 2 chấm 0, bảng so sánh hai cách. So như chữ thì kí tự 9 đứng sau kí tự 1, nên chọn nhầm 1 chấm 9 chấm 0 là mới nhất. So từng phần như số nguyên thì 10 lớn hơn 9, nên đúng là 1 chấm 10 chấm 0, và người làm nghề luôn tách ba số ra trước khi so."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.semver_bump('3.9.7', 'thêm tương thích') == '3.10.0' and alg.semver_bump('3.10.0', 'phá vỡ') == '4.0.0' and alg.semver_bump('0.2.5', 'sửa lỗi') == '0.2.6'"
      - "(lambda d: exec('def chay(kq):\\n    try:\\n        kq.append(4)\\n        return kq\\n    except AttributeError as e:\\n        return type(e).__name__\\n', d) or (d['chay']([1, 2, 3]) == [1, 2, 3, 4] and d['chay']((1, 2, 3)) == 'AttributeError'))({})"
    steps:
      - show: |
          <p>Đang ở 3.9.7.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Thêm một hàm mới, không đổi hàm cũ: bản mới?</td></tr>
          <tr><td>2</td><td>Sau đó đổi kiểu trả về của một hàm từ danh sách sang bộ giá trị: bản mới?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, đang ở bản 3 chấm 9 chấm 7. Câu một, thêm một hàm mới, không đổi hàm cũ, bản mới là gì? Câu hai, sau đó đổi kiểu trả về của một hàm từ danh sách sang bộ giá trị, bản mới là gì? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>câu 1</th><th>số chính</th><th>số phụ</th><th>số vá</th></tr>
          <tr><td>trước</td><td>3</td><td>9</td><td>7</td></tr>
          <tr><td>thêm tương thích</td><td>3</td><td>9 + 1 = 10</td><td>về 0</td></tr></table>
          <p>→ $\hl{3.10.0}$ (số phụ là số nguyên, 9 lên 10, không phải 4.0).</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu một, tách ba số ra. Trước là 3, 9, 7. Thêm tương thích thì số chính giữ 3, số phụ 9 cộng 1 bằng 10, số vá về 0. Vậy lên 3 chấm 10 chấm 0, vì số phụ là số nguyên, 9 lên 10, chứ không nhảy sang 4."
      - clear: true
        show: |
          <div class="code"><div>kq = ham_cu()        <span class="cm"># bản cũ trả [1, 2, 3], bản mới trả (1, 2, 3)</span></div><div>kq.append(4)         <span class="cm"># bộ giá trị không có append → AttributeError</span></div></div>
          <p>② Mã cũ thêm phần tử vào kết quả sẽ lỗi → phá vỡ → số chính 3 lên 4, hai số sau về 0: $\hl{4.0.0}$.</p>
        focus: [1, 2]
        say: "Câu hai, mã cũ có thể thêm phần tử vào kết quả, việc làm được với danh sách. Với bộ giá trị thì lệnh thêm báo lỗi, đó là phá vỡ, nên số chính lên 4, hai số sau về 0, được 4 chấm 0 chấm 0."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hợp đồng = chữ ký + ý nghĩa</span><span class="a">→</span>
          <span class="n">sửa lỗi: số vá; thêm: số phụ; phá vỡ: số chính</span><span class="a">→</span>
          <span class="n">mở ít, báo trước khi bỏ</span></div>
        say: "Tổng kết lại, hợp đồng gồm chữ ký và ý nghĩa. Sửa lỗi tăng số vá, thêm tương thích tăng số phụ, phá vỡ tăng số chính. Hãy mở ít, và báo trước khi bỏ."
      - show: |
          <div class="box key"><b>Tư duy:</b> giao diện lập trình là lời hứa với người bạn không gặp mặt. Số phiên bản giúp họ biết khi nào lời hứa thay đổi.</div>
        say: "Điều cần mang theo, giao diện lập trình là lời hứa với những người bạn không gặp mặt. Số phiên bản giúp họ biết khi nào lời hứa thay đổi."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 15): <b>đo chất lượng thiết kế</b> — liên kết, gắn kết, độ bất ổn.</p>
        forward_ref: true
        say: "Ở bài sau, bài 15, ta học cách đo chất lượng thiết kế, với liên kết, gắn kết, và độ bất ổn. Hẹn gặp bạn ở bài tiếp theo."
