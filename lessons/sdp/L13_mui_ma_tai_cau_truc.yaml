id: L13
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 13 — Mùi mã và tái cấu trúc an toàn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L13; audit/sdp/verify_sdp.py L13; M. Fowler, Refactoring: Improving the Design of Existing Code, 2nd ed. (2018), chương 2–3; M. Feathers, Working Effectively with Legacy Code (2004), chương 13 (kiểm thử đặc trưng); SWF bài 6 (kiểm thử theo tính chất)"
assumes: [arith, cdot]
# Quy ước: alg.fee_old (một hàm dài) và alg.fee_new (đã tách tax/shipping): tổng = tiền hàng + thuế 10% + phí giao (15 000 cho 5 km đầu,
#   +4 000 mỗi km sau; miễn phí từ 500 000). alg.refactor_check so hai bản trên 10 000 cặp (tiền hàng, km) ngẫu nhiên, hạt giống 1.
#   Bản lỗi minh hoạ quên max(0, km − 5); máy đếm 817/10 000 cặp lệch (cùng hạt giống).
objectives:
  - "Nhận ra mùi mã thường gặp"
  - "Tái cấu trúc từng bước nhỏ, giữ hành vi"
  - "Dùng kiểm thử so sánh bản cũ và bản mới"
asr_reviewed:
  - {sentence: "Đơn dưới 500 nghìn và 3 ki-lô-mét không vượt 5, nên phí giao là 15 nghìn.", reason: "ASR chép “đơn giới 500.000 và 3 km không vực năm nên phí giao là 15.000.” (0.789): “ki-lô-mét” ASR viết ký hiệu “km” (đúng); mọi con số khớp; dưới/giới, vượt/vực lệch phụ âm đầu và thanh — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Dọn mã xong, phí giao âm"
    checks:
      - "alg.fee_old(300000, 2) == 345000 and round(300000 * 1.1 + 15000 + (2 - 5) * 4000) == 333000"
    steps:
      - show: |
          <p>Một bạn “dọn dẹp” hàm tính tiền cho gọn, viết lại phí giao thành <code>15000 + (km - 5) * 4000</code>. Đơn 300 000 giao 2 km: bản cũ thu 345 000, bản mới thu $\hl{333\,000}$ — phí giao bị trừ 12 000.</p>
          <div class="box key">Hôm nay: <b>mùi mã</b> và <b>tái cấu trúc an toàn</b> — đổi cấu trúc mà chứng minh được hành vi giữ nguyên.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một bạn dọn dẹp hàm tính tiền cho gọn, và viết lại phí giao thành 15 nghìn cộng số ki-lô-mét trừ 5 nhân 4 nghìn. Đơn 300 nghìn giao 2 ki-lô-mét, bản cũ thu 345 nghìn, bản mới thu 333 nghìn, phí giao bị trừ mất 12 nghìn. Hôm nay ta học mùi mã và tái cấu trúc an toàn, đổi cấu trúc mà chứng minh được hành vi giữ nguyên."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần trăm, chặn dưới bằng 0, và kiểm thử"
    checks:
      - "round(300000 * 0.1) == 30000 and round(300000 + 300000 * 0.1) == 330000"
      - "[max(0, km - 5) for km in (8, 5, 2)] == [3, 0, 0]"
      - "alg.fee_old(300000, 8) == 357000"
    steps:
      - show: |
          <table class="t"><tr><th>tiền hàng</th><th>thuế 10% = tiền nhân 0,1</th><th>tiền + thuế</th></tr>
          <tr><td>300 000</td><td>30 000</td><td>330 000</td></tr></table>
        focus: [1, "1.2"]
        say: "Trước hết, ôn phần trăm. Thuế 10 phần trăm nghĩa là nhân tiền hàng với 0 phẩy 1, nên đơn 300 nghìn có thuế 30 nghìn, cộng lại là 330 nghìn."
      - show: |
          <table class="t"><tr><th>km</th><th>km − 5</th><th><code>max(0, km - 5)</code></th></tr>
          <tr><td>8</td><td>3</td><td>3</td></tr>
          <tr><td>5</td><td>0</td><td>0</td></tr>
          <tr><td>2</td><td class="red">−3</td><td>0</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Tiếp theo, hàm lấy số lớn hơn giữa 0 và một số khác, dùng để chặn dưới bằng 0. Đi 8 ki-lô-mét thì vượt 5 là 3, giữ nguyên 3. Đi đúng 5 thì vượt 0. Đi 2 thì phép trừ ra âm 3, nhưng hàm chặn về 0, vì không thể vượt một số ki-lô-mét âm."
      - show: |
          <table class="t"><tr><th>kiểm thử</th><th>gọi</th><th>mong đợi</th></tr>
          <tr><td>một ca</td><td><code>tong(300000, 8)</code></td><td>357 000</td></tr>
          <tr><td>theo tính chất</td><td>sinh nhiều đầu vào ngẫu nhiên</td><td>một điều luôn đúng</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Cuối cùng, ôn kiểm thử. Một ca kiểm gọi hàm với một đầu vào rồi so với kết quả mong đợi, chẳng hạn 300 nghìn đi 8 ki-lô-mét phải ra 357 nghìn. Ở khoá Phần mềm đúng đắn, kiểm thử theo tính chất sinh rất nhiều đầu vào ngẫu nhiên, và kiểm một điều phải luôn đúng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: mùi mã, tái cấu trúc"
    steps:
      - show: |
          <p><b>Mùi mã</b>: dấu hiệu bề mặt gợi ý thiết kế có vấn đề (Fowler, 2018) — không phải lỗi, mà là chỗ nên xem lại.</p>
          <table class="t"><tr><th>mùi</th><th>dấu hiệu</th></tr>
          <tr><td>hàm dài</td><td>phải cuộn mới đọc hết; độ phức tạp vòng cao</td></tr>
          <tr><td>mã lặp</td><td>cùng đoạn logic ở hai, ba chỗ</td></tr>
          <tr><td>số ma thuật</td><td><code>15000</code>, <code>0.1</code> không có tên</td></tr></table>
          <p><b>Tái cấu trúc</b>: đổi cấu trúc bên trong, <b>giữ nguyên hành vi</b> bên ngoài — từng bước nhỏ, chạy kiểm thử sau mỗi bước.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3]
        say: "Mùi mã là dấu hiệu bề mặt gợi ý thiết kế có vấn đề, không phải lỗi, mà là chỗ nên xem lại. Bảng liệt kê ba mùi thường gặp. Hàm dài là hàm phải cuộn mới đọc hết, độ phức tạp vòng cao. Mã lặp là cùng một đoạn logic xuất hiện ở hai, ba chỗ. Số ma thuật là những hằng số như 15 nghìn hay 0 phẩy 1 không có tên. Tái cấu trúc là đổi cấu trúc bên trong mà giữ nguyên hành vi bên ngoài, đi từng bước nhỏ và chạy kiểm thử sau mỗi bước."

  - id: intuition
    kind: intuition
    title: "Lưới an toàn: cùng đầu vào, so đầu ra"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><defs><marker id="arD13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="30" y="140" width="300" height="90" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="180.0" y="178.0" font-size="24" text-anchor="middle" fill="#1f2937">10 000 cặp</text><text x="180.0" y="208.0" font-size="24" text-anchor="middle" fill="#1f2937">(tiền, km) ngẫu nhiên</text><rect x="470" y="50" width="250" height="70" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="595.0" y="93.0" font-size="24" text-anchor="middle" fill="#1f2937">bản cũ</text><rect x="470" y="250" width="250" height="70" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="595.0" y="293.0" font-size="24" text-anchor="middle" fill="#1f2937">bản mới</text><polygon points="830,185 960,115 1090,185 960,255" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="960" y="193" font-size="24" text-anchor="middle" fill="#1f2937">giống nhau?</text><rect x="1170" y="60" width="310" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1325.0" y="98.0" font-size="24" text-anchor="middle" fill="#1f2937">trùng hết:</text><text x="1325.0" y="128.0" font-size="24" text-anchor="middle" fill="#1f2937">bước nhỏ tiếp theo</text><rect x="1170" y="220" width="310" height="90" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1325.0" y="258.0" font-size="24" text-anchor="middle" fill="#1f2937">có cặp lệch:</text><text x="1325.0" y="288.0" font-size="24" text-anchor="middle" fill="#1f2937">dừng, xem cặp đó</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="330" y1="170" x2="468" y2="90" marker-end="url(#arD13)"/><line x1="330" y1="200" x2="468" y2="282" marker-end="url(#arD13)"/><line x1="720" y1="85" x2="880" y2="155" marker-end="url(#arD13)"/><line x1="720" y1="285" x2="880" y2="215" marker-end="url(#arD13)"/><line x1="1060" y1="168" x2="1168" y2="110" marker-end="url(#arD13)"/><line x1="1060" y1="202" x2="1168" y2="262" marker-end="url(#arD13)"/></g><g font-size="22" fill="#1f2937" text-anchor="middle"><text x="790" y="95" text-anchor="start">đầu ra cũ</text><text x="790" y="292" text-anchor="start">đầu ra mới</text><text x="590" y="365">cùng một đầu vào đi vào cả hai bản</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ lưới an toàn của tái cấu trúc. Mười nghìn cặp tiền hàng và quãng đường ngẫu nhiên đi vào cả bản cũ lẫn bản mới. Hai đầu ra được so với nhau, nếu trùng hết thì ta yên tâm đi bước nhỏ tiếp theo. Nếu có dù chỉ một cặp lệch, ta dừng lại và xem đúng cặp đó, vì nó chỉ thẳng vào chỗ hành vi đã bị đổi."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tách hàm thuế và phí giao, có bằng chứng"
    checks:
      - "alg.refactor_check(10000, 1) is True"
      - "alg.fee_new(300000, 8) == alg.fee_old(300000, 8) == 357000 and alg.fee_new(600000, 12) == 660000"
      - "(lambda r: sum(1 for t, k in ((r.randrange(0, 1000001, 1000), r.randrange(0, 31)) for _ in range(10000)) if alg.fee_old(t, k) != round(t + t * 0.1 + (0 if t >= 500000 else 15000 + (k - 5) * 4000))))(__import__('random').Random(1)) == 817"
    steps:
      - show: |
          <div class="code"><div>def thue(tien): return tien * 0.1</div><div>def phi_giao(tien, km):</div><div>    if tien &gt;= 500000: return 0</div><div>    return 15000 + max(0, km - 5) * 4000</div><div>def tong(tien, km): return round(tien + thue(tien) + phi_giao(tien, km))</div></div>
          <p><b>Bước 1</b> — tách hàm dài thành ba hàm, mỗi hàm một việc có tên.</p>
        focus: [1, 1, 1, 2]
        say: "Bước một, tách hàm dài thành ba hàm. Hàm tính thuế nhân tiền hàng với 0 phẩy 1. Hàm phí giao miễn phí từ 500 nghìn, còn lại là 15 nghìn cộng thêm 4 nghìn cho mỗi ki-lô-mét vượt quá 5. Hàm tổng chỉ cộng ba phần lại rồi làm tròn."
      - show: |
          <p><b>Bước 2</b> — chạy tay đơn 300 000, giao 8 km:</p>
          <table class="t"><tr><th>phần</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>thuế</td><td>300 000 nhân 0,1</td><td>30 000</td></tr>
          <tr><td>phí giao</td><td>$15\,000 + 3 \cdot 4\,000$</td><td>27 000</td></tr>
          <tr><td>tổng</td><td>300 000 + 30 000 + 27 000</td><td>$\hl{357\,000}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước hai, chạy tay đơn 300 nghìn giao 8 ki-lô-mét. Thuế là 30 nghìn. Phí giao là 15 nghìn cộng 3 nhân 4 nghìn, bằng 27 nghìn. Tổng là 357 nghìn, và bản cũ cũng cho đúng 357 nghìn."
      - clear: true
        show: |
          <p><b>Bước 3</b> — đơn 600 000, giao 12 km: thuế 60 000; tiền hàng từ 500 000 trở lên nên phí giao 0 → tổng $\hl{660\,000}$ ở cả hai bản.</p>
        say: "Bước ba, đơn 600 nghìn giao 12 ki-lô-mét. Thuế là 60 nghìn, và vì tiền hàng từ 500 nghìn trở lên nên phí giao bằng 0. Tổng là 660 nghìn ở cả hai bản."
      - clear: true
        show: |
          <p><b>Bước 4</b> — kiểm thử so sánh trên $\hl{10\,000}$ cặp (tiền, km) ngẫu nhiên:</p>
          <table class="t"><tr><th>so với bản cũ</th><th>số cặp lệch</th></tr>
          <tr><td>bản đã tách (có <code>max(0, …)</code>)</td><td>0 → trùng hết</td></tr>
          <tr><td>bản “dọn dẹp” quên <code>max(0, …)</code></td><td class="red">817 trên 10 000</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước bốn, kiểm thử so sánh chạy bản cũ và bản mới trên 10 nghìn cặp tiền hàng và quãng đường ngẫu nhiên. Bản đã tách trùng hết, không lệch cặp nào. Còn bản dọn dẹp quên chặn số âm thì lệch ở 817 trên 10 nghìn cặp, và kiểm thử bắt được ngay."

  - id: check
    kind: check
    title: "Tự kiểm: lệch đúng ở đâu, bao nhiêu"
    checks:
      - "(lambda r: (lambda ps: all((alg.fee_old(t, k) != round(t + t * 0.1 + (0 if t >= 500000 else 15000 + (k - 5) * 4000))) == (t < 500000 and k < 5) for t, k in ps) and sum(1 for t, k in ps if t < 500000 and k < 5) == 817)([(r.randrange(0, 1000001, 1000), r.randrange(0, 31)) for _ in range(10000)]))(__import__('random').Random(1))"
      - "round(10000 * 500 / 1001 * 5 / 31) == 806 and len(range(0, 1000001, 1000)) == 1001 and len(range(0, 500000, 1000)) == 500"
      - "sum(alg.fee_old(t, k) != round(t + t * 0.1 + (0 if t >= 500000 else 15000 + (k - 5) * 4000)) for t in range(0, 1000001, 1000) for k in range(31)) == 2500 == 500 * 5 and all(alg.fee_old(t, k) == alg.fee_new(t, k) for t in range(0, 1000001, 1000) for k in range(31))"
    steps:
      - show: |
          <table class="t"><tr><th>khi nào bản quên chặn bị lệch?</th><th>vì sao</th></tr>
          <tr><td>tiền dưới 500 000</td><td>mới phải trả phí giao</td></tr>
          <tr><td>và km dưới 5</td><td>km − 5 âm, phí bị trừ bớt</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, suy luận xem bản quên chặn lệch ở đâu. Chỉ đơn dưới 500 nghìn mới phải trả phí giao. Và chỉ khi đi dưới 5 ki-lô-mét thì phép trừ mới ra số âm, nên phí bị trừ bớt."
      - show: |
          <table class="t"><tr><th>cách đếm</th><th>kết quả</th></tr>
          <tr><td>đếm trong 10 000 cặp: tiền &lt; 500 000 và km &lt; 5</td><td>817 ✓ khớp đúng từng cặp</td></tr>
          <tr><td>ước lượng: $10\,000 \cdot \frac{500}{1001} \cdot \frac{5}{31}$</td><td>≈ 806, gần 817</td></tr>
          <tr><td>thử hết 1001 mức tiền nhân 31 mức km</td><td>lệch đúng $500 \cdot 5 = 2500$ ô; bản đã tách lệch 0</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Giờ đếm lại theo điều kiện đó. Trong 10 nghìn cặp, đúng 817 cặp có tiền dưới 500 nghìn và quãng đường dưới 5, khớp từng cặp với những cặp bị lệch. Ước lượng bằng xác suất cũng ra khoảng 806, gần 817, vì khoảng một nửa số đơn dưới 500 nghìn và 5 trên 31 mức quãng đường dưới 5. Thử hết mọi mức tiền và mọi mức ki-lô-mét thì bản quên chặn lệch đúng 500 nhân 5, bằng 2500 ô, còn bản đã tách không lệch ô nào."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda r: sum(1 for t, k in [(r.randrange(0, 1000001, 1000), r.randrange(0, 31)) for _ in range(10000)] if t == 500000))(__import__('random').Random(1)) == 9"
      - "(lambda r: sum(1 for _ in range(10000) if r.randrange(0, 1000001) == 500000))(__import__('random').Random(1)) == 0"
      - "alg.fee_new(500000, 3) == 550000 and round(500000 + 500000 * 0.1 + (0 if 500000 > 500000 else 15000 + max(0, 3 - 5) * 4000)) == 565000"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tái cấu trúc khi chưa có kiểm thử <b class="red">(viết lại mù)</b>
          <br><span class="note">Không có kiểm thử thì không còn bằng chứng hành vi được giữ — đó là viết lại. Viết <b>kiểm thử đặc trưng</b> trước: ghi lại đầu ra hiện tại, dù có thể chưa “đúng”.</span></div>
        say: "Lỗi thứ nhất, tái cấu trúc khi chưa có kiểm thử. Không có kiểm thử thì không còn bằng chứng hành vi được giữ, đó là viết lại. Hãy viết kiểm thử đặc trưng trước, ghi lại đầu ra hiện tại, dù có thể nó chưa đúng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Vừa tái cấu trúc vừa sửa lỗi, thêm tính năng <b class="red">(lẫn lộn)</b>
          <br><span class="note">Kiểm thử đổi kết quả thì không biết do sửa lỗi hay do làm hỏng. Tách thành các lần thay đổi riêng: lần này chỉ đổi cấu trúc.</span></div>
        say: "Lỗi thứ hai, vừa tái cấu trúc vừa sửa lỗi hay thêm tính năng. Kiểm thử đổi kết quả thì không biết là do sửa lỗi hay do làm hỏng, nên hãy tách thành các lần thay đổi riêng, lần này chỉ đổi cấu trúc."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Bước quá lớn <b class="red">(khó lần lỗi)</b>
          <br><span class="note">Đổi 500 dòng rồi mới chạy kiểm thử: hỏng ở đâu không biết. Mỗi bước một thay đổi nhỏ (đổi tên, tách một hàm), chạy kiểm thử, rồi mới bước tiếp.</span></div>
        say: "Lỗi thứ ba, đi bước quá lớn. Đổi 500 dòng rồi mới chạy kiểm thử thì hỏng ở đâu không biết, nên mỗi bước chỉ một thay đổi nhỏ như đổi tên hay tách một hàm, chạy kiểm thử, rồi mới bước tiếp."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin 10 000 cặp ngẫu nhiên mà quên ca biên <b class="red">(lọt lưới)</b>
          <br><span class="note">Bản mới lỡ viết <code>tien &gt; 500000</code> thay vì <code>&gt;=</code>: chỉ lệch đúng ở mức 500 000.</span></div>
          <table class="t"><tr><th>cách sinh tiền hàng</th><th>số lần trúng đúng 500 000 trong 10 000 cặp</th></tr>
          <tr><td>bội số của 1 000</td><td>9</td></tr>
          <tr><td>mọi số nguyên tới 1 000 000</td><td class="red">0 → lỗi lọt qua</td></tr>
          <tr><td>thêm tay ca biên 500 000, 3 km</td><td>bản đúng 550 000, bản lỗi 565 000 → bắt ngay</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tin vào 10 nghìn cặp ngẫu nhiên mà quên ca biên. Giả sử bản mới lỡ viết lớn hơn thay vì lớn hơn hoặc bằng 500 nghìn, thì chỉ lệch đúng ở mức 500 nghìn. Nếu sinh tiền hàng là bội số của một nghìn, 10 nghìn cặp chỉ trúng mức đó 9 lần. Nếu sinh mọi số nguyên tới một triệu, không lần nào trúng, và lỗi lọt qua. Người làm nghề luôn thêm tay các ca biên, như 500 nghìn đi 3 ki-lô-mét, bản đúng ra 550 nghìn, bản lỗi ra 565 nghìn, bắt được ngay."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.fee_new(200000, 3) == 235000 and alg.fee_new(450000, 10) == 530000"
      - "round(450000 * 0.1) == 45000 and 15000 + 5 * 4000 == 35000 and round(200000 * 0.1) == 20000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Theo hàm đã tách: đơn 200 000 giao 3 km, và đơn 450 000 giao 10 km — mỗi đơn trả bao nhiêu?</td></tr>
          <tr><td>2</td><td>Giả sử số <code>0.1</code> được gõ thẳng ở ba chỗ trong mã. Đó là mùi gì? Tái cấu trúc thế nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, theo hàm đã tách, đơn 200 nghìn giao 3 ki-lô-mét, và đơn 450 nghìn giao 10 ki-lô-mét, mỗi đơn trả bao nhiêu? Câu hai, giả sử số 0 phẩy 1 được gõ thẳng ở ba chỗ trong mã. Đó là mùi gì, và tái cấu trúc thế nào? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>đơn 200 000, 3 km</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>thuế</td><td>200 000 nhân 0,1</td><td>20 000</td></tr>
          <tr><td>phí giao</td><td>dưới 500 000; 3 km không vượt 5</td><td>15 000</td></tr>
          <tr><td>tổng</td><td>$200\,000 + 20\,000 + 15\,000$</td><td>$\hl{235\,000}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, đơn thứ nhất. Thuế là 20 nghìn. Đơn dưới 500 nghìn và 3 ki-lô-mét không vượt 5, nên phí giao là 15 nghìn. Tổng là 200 nghìn cộng 20 nghìn cộng 15 nghìn, bằng 235 nghìn."
      - clear: true
        show: |
          <table class="t"><tr><th>đơn 450 000, 10 km</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>thuế</td><td>450 000 nhân 0,1</td><td>45 000</td></tr>
          <tr><td>phí giao</td><td>$15\,000 + 5 \cdot 4\,000$</td><td>35 000</td></tr>
          <tr><td>tổng</td><td>$450\,000 + 45\,000 + 35\,000$</td><td>$\hl{530\,000}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đơn thứ hai. Thuế là 45 nghìn. Đơn vẫn dưới 500 nghìn, đi 10 ki-lô-mét là vượt 5, nên phí giao là 15 nghìn cộng 5 nhân 4 nghìn, bằng 35 nghìn. Tổng là 530 nghìn."
      - show: |
          <p>② Số ma thuật lặp lại → đặt hằng có tên <code>THUE_SUAT = 0.1</code>, thay ba chỗ, chạy lại kiểm thử so sánh.</p>
        say: "Câu hai, đó là số ma thuật lặp lại, hãy đặt một hằng có tên thuế suất, thay ở ba chỗ, rồi chạy lại kiểm thử so sánh."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
