          <span class="n">kiểm thử đặc trưng trước</span><span class="a">→</span>
          <span class="n">bước nhỏ, chạy kiểm thử mỗi bước</span><span class="a">→</span>
          <span class="n">so bản cũ và mới</span></div>
        say: "Tổng kết lại, nhận ra mùi như hàm dài, mã lặp, số ma thuật. Viết kiểm thử đặc trưng trước, đi từng bước nhỏ và chạy kiểm thử mỗi bước, rồi so bản cũ với bản mới."
      - show: |
          <div class="box key"><b>Tư duy:</b> tái cấu trúc an toàn là một chuỗi bước nhỏ, mỗi bước đều có bằng chứng. Không có bằng chứng thì chưa xong.</div>
        say: "Điều cần mang theo, tái cấu trúc an toàn là một chuỗi bước nhỏ, mỗi bước đều có bằng chứng. Không có bằng chứng thì chưa xong."
      - clear: true
        show: |
