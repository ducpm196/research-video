id: L05
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 5 — SOLID 1: trách nhiệm đơn và đóng–mở"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L05; audit/sdp/verify_sdp.py L05; R. C. Martin, Agile Software Development: Principles, Patterns, and Practices (2002), chương 8 (trách nhiệm đơn: “một lý do để thay đổi”) và chương 9 (đóng–mở); R. C. Martin, Clean Architecture (2017), chương 7 (mô-đun chịu trách nhiệm trước một nhóm người dùng); R. C. Martin, Design Principles and Design Patterns (2000) (đóng–mở); B. Meyer, Object-Oriented Software Construction (1988) (nguyên lý đóng–mở)"
assumes: [arith, cdot]
# Quy ước: mã minh hoạ Python; hoá đơn áp lần lượt các quy tắc (alg.invoice với alg.Tax, alg.Discount), làm tròn tới đồng. SOLID là tên viết tắt
#   năm nguyên lý (Martin); bài này hai nguyên lý đầu. Tên viết tắt chỉ trên màn hình; lời đọc nói “nguyên lý thiết kế”.
objectives:
  - "Hiểu “một trách nhiệm” là “một lý do thay đổi”"
  - "Mở rộng hành vi bằng thêm mã mới, không sửa mã cũ"
  - "Tránh tách quá vụn"
asr_reviewed:
  - {sentence: "Lớp tính thuế thì không phải sửa dòng nào.", reason: "ASR chép “lật tính thuế thì không phải sử dòng nào.” (0.778): lệch âm/thanh thuần Việt: lớp/lật, sửa/sử — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ ba, dựng sẵn điểm mở rộng cho mọi thứ phòng khi cần.", reason: "ASR chép “Lội thứ Ba, dựng sản điểm mở rộng cho mọi thứ phòng khí cân”: lỗi/lội lệch thanh (đã biết ở DSC L07), sẵn/sản và khi cần/khí cân lệch thanh; câu 12 từ, phần còn lại khớp — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sửa thuế làm hỏng in hoá đơn"
    steps:
      - show: |
          <p>Lớp <code>HoaDon</code> vừa tính thuế, vừa định dạng bản in, vừa lưu cơ sở dữ liệu. Phòng kế toán đổi cách làm tròn thuế — và bản in bị lệch cột. Ba nhóm người, ba lý do sửa, cùng đụng một lớp.</p>
          <div class="box key">Hôm nay: hai nguyên lý thiết kế đầu tiên — <b>trách nhiệm đơn</b> và <b>đóng–mở</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, lớp hoá đơn vừa tính thuế, vừa định dạng bản in, vừa lưu vào cơ sở dữ liệu. Phòng kế toán đổi cách làm tròn thuế, và bản in bị lệch cột. Ba nhóm người, ba lý do sửa, cùng đụng vào một lớp. Hôm nay ta học hai nguyên lý thiết kế đầu tiên, trách nhiệm đơn và đóng mở."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phần trăm thành phép nhân, và lớp con tự làm theo cách riêng"
    checks:
      - "round(200000 * 1.1) == 220000 and round(220000 * 0.95) == 209000 and round(200000 * 0.1) == 20000"
      - "[r.apply(100) for r in (alg.Rule(), alg.Tax(0.1), alg.Discount(0.05))] == [100, 100 * 1.1, 100 * 0.95] and round(100 * 1.1) == 110 and round(100 * 0.95) == 95"
    steps:
      - show: |
          <table class="t"><tr><th>việc</th><th>nhân với</th><th>ví dụ với 200 000</th></tr>
          <tr><td>cộng thuế 10%</td><td>$1 + 0{,}1 = 1{,}1$</td><td>$200\,000 \cdot 1{,}1 = 220\,000$</td></tr>
          <tr><td>giảm 5%</td><td>$1 - 0{,}05 = 0{,}95$</td><td>$220\,000 \cdot 0{,}95 = 209\,000$</td></tr></table>
        introduces: [cdot]
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn cách đổi phần trăm thành phép nhân, dấu chấm giữa ở đây đọc là nhân. Cộng thuế 10 phần trăm nghĩa là nhân với 1 phẩy 1, nên 200 nghìn thành 220 nghìn. Giảm 5 phần trăm nghĩa là nhân với 0 phẩy 95, nên 220 nghìn thành 209 nghìn."
      - show: |
          <table class="t"><tr><th>đối tượng</th><th>phép <code>ap(100)</code> của riêng nó</th><th>kết quả</th></tr>
          <tr><td><code>QuyTac(0)</code></td><td>trả nguyên</td><td>100</td></tr>
          <tr><td><code>Thue(0.1)</code></td><td>nhân 1,1</td><td>110 (máy in 110.00000000000001 vì số thực; hàm <code>tinh</code> sẽ làm tròn)</td></tr>
          <tr><td><code>GiamGia(0.05)</code></td><td>nhân 0,95</td><td>95</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Thứ hai, ôn đa hình ở bài 3, cùng một lời gọi nhưng mỗi lớp con tự làm theo cách riêng của nó. Gọi áp dụng với 100 trên quy tắc gốc thì trả nguyên 100. Trên lớp thuế thì nhân 1 phẩy 1, được 110. Trên lớp giảm giá thì nhân 0 phẩy 95, được 95."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hai nguyên lý"
    steps:
      - show: |
          <p><b>Trách nhiệm đơn</b> (chữ S): mỗi mô-đun chỉ có <b>một lý do để thay đổi</b> — một nhóm người yêu cầu nó đổi. Tính thuế, in, lưu là ba lý do → ba lớp.</p>
          <p><b>Đóng–mở</b> (chữ O): mở để <b>mở rộng</b>, đóng với <b>sửa đổi</b>. Thêm hành vi mới bằng cách thêm mã mới, không sửa mã đã chạy ổn.</p>
          <p class="note"><b>SOLID</b> = chữ cái đầu tên tiếng Anh của năm nguyên lý thiết kế mà R. C. Martin gom lại: S, O, L, I, D. Bài này học hai chữ đầu.</p>
        focus: [3, 1, 1, 2, 2]
        say: "Tên viết tắt năm chữ cái trên màn hình ghép từ chữ cái đầu tên tiếng Anh của năm nguyên lý thiết kế, và bài này học hai chữ đầu tiên. Nguyên lý trách nhiệm đơn nói mỗi mô-đun chỉ có một lý do để thay đổi, tức chỉ một nhóm người yêu cầu nó đổi. Tính thuế, in và lưu là ba lý do, nên nên là ba lớp. Nguyên lý đóng mở nói mô-đun mở để mở rộng nhưng đóng với sửa đổi. Thêm hành vi mới bằng cách thêm mã mới, không sửa mã đã chạy ổn."

  - id: intuition
    kind: intuition
    title: "Hoá đơn chạy qua một dải quy tắc"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><defs><marker id="arD5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="325" y="40" width="850" height="230" rx="18" fill="none" stroke="#2a78d6" stroke-width="3" stroke-dasharray="12 8"/><text x="750" y="90" font-size="24" text-anchor="middle" fill="#2a78d6" font-weight="bold">hàm tinh: áp lần lượt từng quy tắc (đóng, không sửa)</text><rect x="115" y="150" width="170" height="90" rx="12" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="200" y="205" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">200 000</text><rect x="345" y="150" width="260" height="90" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="475" y="190" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">Thue</text><text x="475" y="224" font-size="22" text-anchor="middle" fill="#1f2937">nhân 1,1</text><rect x="665" y="150" width="170" height="90" rx="12" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="750" y="205" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">220 000</text><rect x="895" y="150" width="260" height="90" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3" stroke-dasharray="10 6"/><text x="1025" y="190" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">GiamGia</text><text x="1025" y="224" font-size="22" text-anchor="middle" fill="#1f2937">nhân 0,95</text><rect x="1215" y="150" width="170" height="90" rx="12" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1300" y="205" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">209 000</text><g stroke="#1f2937" stroke-width="3"><line x1="285" y1="195" x2="343" y2="195" marker-end="url(#arD5)"/><line x1="605" y1="195" x2="663" y2="195" marker-end="url(#arD5)"/><line x1="835" y1="195" x2="893" y2="195" marker-end="url(#arD5)"/><line x1="1155" y1="195" x2="1213" y2="195" marker-end="url(#arD5)"/></g><text x="1025" y="310" font-size="24" text-anchor="middle" fill="#059669" font-weight="bold">lớp mới cắm vào (mở)</text><text x="750" y="370" font-size="24" text-anchor="middle" fill="#1f2937">in hoá đơn, lưu hoá đơn: lớp khác, không đụng tới dải này (trách nhiệm đơn)</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ hàm tính như một dải băng chuyền, số tiền đi vào bên trái và lần lượt chạy qua từng quy tắc. Khung xanh đứt nét là hàm tính, viết một lần, kiểm thử một lần, rồi đóng lại không sửa nữa. Quy tắc giảm giá viền xanh lá là lớp mới, chỉ việc cắm thêm vào dải, đó là phần mở. Việc in và lưu hoá đơn nằm ở lớp khác, nên đổi cách làm tròn thuế không thể làm lệch bản in."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Thêm quy tắc giảm giá không sửa hàm cũ"
    checks:
      - "alg.invoice(200000, [alg.Tax(0.1)]) == 220000 and alg.invoice(200000, [alg.Tax(0.1), alg.Discount(0.05)]) == 209000"
    steps:
      - show: |
          <div class="code"><div>class QuyTac:</div><div>    def __init__(self, ti_le): self.ti_le = ti_le</div><div>    def ap(self, x): return x</div><div>class Thue(QuyTac):</div><div>    def ap(self, x): return x * (1 + self.ti_le)</div><div>class GiamGia(QuyTac):</div><div>    def ap(self, x): return x * (1 - self.ti_le)</div><div></div><div>def tinh(so_tien, quy_tac):</div><div>    for q in quy_tac: so_tien = q.ap(so_tien)</div><div>    return round(so_tien)</div></div>
          <p><b>Bước 1</b> — chỉ có thuế 10%: <code>tinh(200000, [Thue(0.1)])</code> = $\hl{220\,000}$.</p>
        focus: [1, 1, 1, 1, 2]
        say: "Bước một, đọc mã. Lớp quy tắc nhận một tỉ lệ khi tạo đối tượng, cất vào thuộc tính tỉ lệ, và có một phép áp dụng. Hai lớp con, tức hai lớp viết dựa trên lớp quy tắc, thừa hưởng phần đó. Lớp thuế áp dụng bằng cách nhân thêm tỉ lệ thuế, lớp giảm giá nhân với 1 trừ tỉ lệ giảm. Hàm tính chỉ việc áp lần lượt mọi quy tắc rồi làm tròn, nên hoá đơn 200 nghìn với thuế 10 phần trăm là 220 nghìn."
      - show: |
          <p><b>Bước 2</b> — yêu cầu mới: giảm 5%. Ta chỉ <b>thêm</b> một phần tử vào danh sách quy tắc:</p>
          <div class="code"><div>tinh(200000, [Thue(0.1), GiamGia(0.05)])</div></div>
        focus: [1, 2]
        say: "Bước hai, có yêu cầu mới là giảm 5 phần trăm. Ta chỉ thêm một đối tượng giảm giá vào danh sách quy tắc, không sửa dòng nào của hàm tính."
      - clear: true
        show: |
          <p><b>Bước 3</b> — hàm tính chạy qua hai quy tắc:</p>
          <table class="t"><tr><th>quy tắc</th><th>vào</th><th>ra</th></tr>
          <tr><td>Thue(0.1)</td><td>200 000</td><td>220 000</td></tr>
          <tr><td>GiamGia(0.05)</td><td>220 000</td><td>$\hl{209\,000}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, theo dõi hàm tính chạy qua hai quy tắc. Quy tắc thuế nhận 200 nghìn, trả 220 nghìn. Quy tắc giảm giá nhận 220 nghìn, trả 209 nghìn."
      - show: |
          <p><b>Bước 4</b> — đếm phần mã bị đụng tới:</p>
          <table class="t"><tr><th>phần mã</th><th>có sửa?</th></tr>
          <tr><td>hàm <code>tinh</code></td><td>không</td></tr><tr><td>lớp <code>Thue</code></td><td>không</td></tr>
          <tr><td>lớp <code>GiamGia</code></td><td>mới thêm</td></tr></table>
          <div class="box key">Hàm <code>tinh</code> đã kiểm thử kỹ vẫn y nguyên. Rủi ro chỉ nằm ở lớp mới.</div>
        focus: [1, "2.2", "2.3", "2.4", 3]
        say: "Bước bốn, đếm phần mã bị đụng tới. Hàm tính không sửa. Lớp tính thuế thì không phải sửa dòng nào. Chỉ có lớp giảm giá là mới thêm vào. Hàm tính đã kiểm thử kỹ vẫn giữ nguyên, rủi ro chỉ nằm ở lớp mới."

  - id: check
    kind: check
    title: "Tự kiểm: tính tay theo thứ tự ngược"
    checks:
      - "round(200000 * 0.95) == 190000 and round(190000 * 1.1) == 209000 == alg.invoice(200000, [alg.Discount(0.05), alg.Tax(0.1)]) == alg.invoice(200000, [alg.Tax(0.1), alg.Discount(0.05)])"
    steps:
      - show: |
          <table class="t"><tr><th>đường khác: giảm trước, thuế sau</th><th>kết quả</th></tr>
          <tr><td>$200\,000 \cdot 0{,}95$</td><td>190 000</td></tr>
          <tr><td>$190\,000 \cdot 1{,}1$</td><td>$\hl{209\,000}$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, tính tay theo thứ tự ngược, giảm giá trước rồi mới cộng thuế. 200 nghìn nhân 0 phẩy 95 được 190 nghìn. 190 nghìn nhân 1 phẩy 1 được 209 nghìn, khớp kết quả của hàm tính."
      - show: |
          <p>Khớp vì cả hai quy tắc đều là <b>phép nhân</b>, đổi thứ tự nhân không đổi tích:</p>
          $$1{,}1 \cdot 0{,}95 = 0{,}95 \cdot 1{,}1$$
        say: "Hai đường khớp nhau vì cả hai quy tắc đều là phép nhân, mà đổi thứ tự các thừa số thì tích không đổi."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda G: (alg.invoice(200000, [alg.Tax(0.1), G]), alg.invoice(200000, [G, alg.Tax(0.1)])))(type('Giam50k', (alg.Rule,), {'apply': lambda self, x: x - 50000})()) == (170000, 165000) and 200000 - 50000 == 150000 and 170000 - 165000 == 5000"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Hiểu “một trách nhiệm” là “một hàm” <b class="red">(quá vụn)</b>
          <br><span class="note">Tách mọi thứ thành lớp một phương thức làm mã khó theo dõi. Thước đo là <b>lý do thay đổi</b>, không phải số dòng.</span></div>
        say: "Lỗi thứ nhất, hiểu một trách nhiệm là một hàm. Tách mọi thứ thành các lớp một phương thức làm mã khó theo dõi, vì thước đo là lý do thay đổi, không phải số dòng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Mở rộng bằng cách thêm <code>elif</code> vào hàm cũ <b class="red">(phá đóng–mở)</b>
          <br><span class="note">Mỗi quy tắc mới là một lần sửa hàm đã chạy ổn, kèm nguy cơ làm hỏng quy tắc cũ.</span></div>
        say: "Lỗi thứ hai, mở rộng bằng cách thêm một nhánh điều kiện vào hàm cũ. Mỗi quy tắc mới là một lần sửa hàm đã chạy ổn, kèm nguy cơ làm hỏng quy tắc cũ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dựng sẵn điểm mở rộng cho mọi thứ “phòng khi” <b class="red">(thừa)</b>
          <br><span class="note">Chỉ tạo điểm mở rộng ở chỗ <b>đã thấy</b> thay đổi lặp lại. Đoán sai chỗ sẽ đổi là thêm phức tạp vô ích.</span></div>
        say: "Lỗi thứ ba, dựng sẵn điểm mở rộng cho mọi thứ phòng khi cần. Chỉ tạo điểm mở rộng ở chỗ đã thấy thay đổi lặp lại, đoán sai chỗ sẽ đổi là thêm phức tạp vô ích."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin rằng “cắm thêm lớp” thì không cần nghĩ tới <b>thứ tự</b> quy tắc <b class="red">(lệch tiền)</b></div>
          <table class="t"><tr><th>200 000 với thuế 10% và giảm thẳng 50 000</th><th>kết quả</th></tr>
          <tr><td>thuế trước, giảm sau: $220\,000 - 50\,000$</td><td>170 000</td></tr>
          <tr><td>giảm trước, thuế sau: $150\,000 \cdot 1{,}1$</td><td>165 000</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 1]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tin rằng cứ cắm thêm lớp là xong, không cần nghĩ tới thứ tự các quy tắc. Với quy tắc giảm thẳng 50 nghìn, thứ tự bắt đầu có ý nghĩa. Cộng thuế trước rồi giảm thì được 170 nghìn. Giảm trước rồi cộng thuế thì được 165 nghìn, lệch 5 nghìn trên mỗi hoá đơn. Người làm nghề ghi thứ tự áp quy tắc thành một quyết định nghiệp vụ có kiểm thử riêng, không để nó phụ thuộc vào việc ai thêm lớp trước."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(300000 * 1.1) == 330000 and round(330000 * 0.8) == 264000"
      - "alg.invoice(300000, [alg.Tax(0.1), alg.Discount(0.2)]) == 264000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hoá đơn 300 000, thuế 10% rồi giảm 20%: kết quả?</td></tr>
          <tr><td>2</td><td>Lớp “Báo cáo” vừa lấy số liệu từ cơ sở dữ liệu, vừa vẽ biểu đồ. Có mấy lý do thay đổi? Nên tách thế nào?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hoá đơn 300 nghìn, áp thuế 10 phần trăm rồi giảm 20 phần trăm, kết quả là bao nhiêu? Câu hai, lớp báo cáo vừa lấy số liệu từ cơ sở dữ liệu, vừa vẽ biểu đồ. Có mấy lý do thay đổi, và nên tách thế nào? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>quy tắc</th><th>vào</th><th>ra</th></tr>
          <tr><td>thuế 10%: nhân 1,1</td><td>300 000</td><td>330 000</td></tr>
          <tr><td>giảm 20%: nhân 0,8</td><td>330 000</td><td>$\hl{264\,000}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, áp từng quy tắc. Thuế 10 phần trăm nhân 1 phẩy 1, 300 nghìn thành 330 nghìn. Giảm 20 phần trăm nhân 0 phẩy 8, 330 nghìn thành 264 nghìn."
      - show: |
          <table class="t"><tr><th>ai yêu cầu đổi</th><th>đổi cái gì</th><th>lớp riêng</th></tr>
          <tr><td>người quản trị dữ liệu</td><td>nguồn số liệu, câu truy vấn</td><td>lớp lấy số liệu</td></tr>
          <tr><td>người đọc báo cáo</td><td>kiểu biểu đồ, màu, nhãn</td><td>lớp vẽ</td></tr></table>
        focus: [1, "1.2", "1.3", 1]
        say: "Câu hai, hỏi ai sẽ yêu cầu lớp này đổi. Người quản trị dữ liệu đổi nguồn số liệu và câu truy vấn. Người đọc báo cáo đổi kiểu biểu đồ, màu và nhãn. Có hai lý do thay đổi, nguồn dữ liệu đổi và cách trình bày đổi, nên tách thành hai lớp, một lớp lấy số liệu, một lớp vẽ."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">trách nhiệm đơn: một lý do thay đổi</span><span class="a">→</span>
          <span class="n">đóng–mở: thêm mã mới, không sửa mã cũ</span><span class="a">→</span>
          <span class="n">điểm mở rộng ở chỗ đã thay đổi</span></div>
        say: "Tổng kết lại, trách nhiệm đơn là một lý do thay đổi, đóng mở là thêm mã mới chứ không sửa mã cũ, và chỉ tạo điểm mở rộng ở chỗ đã thấy thay đổi."
      - show: |
          <div class="box key"><b>Tư duy:</b> thiết kế tốt làm cho thay đổi thường gặp trở nên rẻ và an toàn. Hãy hỏi “điều gì hay thay đổi ở đây?” trước khi chia lớp.</div>
        say: "Điều cần mang theo, thiết kế tốt làm cho những thay đổi thường gặp trở nên rẻ và an toàn. Hãy hỏi điều gì hay thay đổi ở đây trước khi chia lớp."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): nguyên lý <b>thay thế</b> — khi nào lớp con thay được lớp cha.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học nguyên lý thay thế, khi nào lớp con thật sự thay được lớp cha. Hẹn gặp bạn ở bài tiếp theo."
