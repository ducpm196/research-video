id: L00
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 0 — Hàm nhỏ, tên rõ, độ phức tạp vòng McCabe"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L00; audit/sdp/verify_sdp.py L00; T. J. McCabe, A Complexity Measure, IEEE TSE 2(4), 1976; R. C. Martin, Clean Code (2008), chương 2–3; SWF bài 5 (độ phủ)"
assumes: [arith]
# Quy ước: mã minh hoạ bằng Python. Độ phức tạp vòng M của một hàm = số điểm rẽ + 1; điểm rẽ: if/elif, for, while, except, biểu thức if, mỗi and/or
#   thêm (số vế − 1). Máy đếm trên cây cú pháp (alg.mccabe dùng module ast). Tên McCabe chỉ trên màn hình; lời đọc nói “độ phức tạp vòng”.
objectives:
  - "Viết hàm nhỏ làm một việc, đặt tên nói đúng việc đó"
  - "Đếm độ phức tạp vòng"
  - "Hiểu ý nghĩa và giới hạn của con số đó"
asr_reviewed:
  - {sentence: "Câu kiểm danh sách rỗng là điểm rẽ thứ nhất, vòng lặp là điểm rẽ thứ hai.", reason: "ASR chép “Câu kiểm danh sách rộng là điểm rẻ thứ nhất, vòng lập là điểm rẻ thứ 2”: rỗng/rộng, rẽ/rẻ, lặp/lập đều là cặp lệch thanh ngã–nặng/hỏi–ngã mà ASR hay lẫn (lặp/lập đã gặp ở các khoá trước); khung chữ, số và cấu trúc câu khớp đủ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hàm 300 dòng tên là “xử lý”"
    steps:
      - show: |
          <p>Một hàm dài 300 dòng, tên <code>xu_ly(d)</code>, chứa 40 câu điều kiện lồng nhau. Sửa một dòng thì hỏng ba chỗ khác; không ai dám đụng vào.</p>
          <div class="box key">Hôm nay: <b>hàm nhỏ</b>, <b>tên rõ</b>, và một con số đo độ rẽ nhánh — <b>độ phức tạp vòng</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một hàm dài 300 dòng, tên chỉ là xử lý, chứa 40 câu điều kiện lồng nhau. Sửa một dòng thì hỏng ba chỗ khác, và không ai dám đụng vào nó nữa. Hôm nay ta học cách viết hàm nhỏ, đặt tên rõ, và một con số đo mức rẽ nhánh, gọi là độ phức tạp vòng."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: câu điều kiện, toán tử và, vòng lặp"
    checks:
      - "(3 > 0, -1 > 0) == (True, False)"
      - "[(x > 2, x < 8, x > 2 and x < 8) for x in (5, 9, 1)] == [(True, True, True), (True, False, False), (False, True, False)]"
      - "[len(xs) for xs in ([], [4, 7])] == [0, 2]"
    steps:
      - show: |
          <table class="t"><tr><th>mã</th><th>x</th><th>x &gt; 0?</th><th>đi lối nào</th></tr>
          <tr><td rowspan="2"><code>if x &gt; 0:</code></td><td>3</td><td>đúng</td><td>vào thân <code>if</code></td></tr>
          <tr><td>−1</td><td>sai</td><td>bỏ qua thân <code>if</code></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn câu điều kiện. Với x bằng 3, điều kiện x lớn hơn 0 đúng, nên chương trình đi vào thân câu điều kiện. Với x bằng âm 1, điều kiện sai, nên chương trình bỏ qua thân, nghĩa là mỗi câu điều kiện mở ra hai lối đi."
      - show: |
          <table class="t"><tr><th>x</th><th>x &gt; 2?</th><th>x &lt; 8?</th><th><code>x &gt; 2 and x &lt; 8</code></th></tr>
          <tr><td>5</td><td>đúng</td><td>đúng</td><td>đúng</td></tr>
          <tr><td>9</td><td>đúng</td><td>sai</td><td>sai</td></tr>
          <tr><td>1</td><td>sai</td><td class="note">không cần xét</td><td>sai</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Toán tử và chỉ cho đúng khi cả hai vế đều đúng. Với x bằng 5, cả hai vế đúng, nên kết quả đúng. Với x bằng 9, vế sau sai, nên kết quả sai. Với x bằng 1, vế đầu đã sai, máy dừng luôn mà không xét vế sau, vì vậy toán tử và giấu bên trong một lần rẽ nữa."
      - clear: true
        show: |
          <table class="t"><tr><th>danh sách</th><th>số lần chạy thân vòng lặp</th></tr>
          <tr><td><code>[]</code></td><td>0</td></tr><tr><td><code>[4, 7]</code></td><td>2</td></tr></table>
          <p class="note">Mỗi lần quay lại đầu vòng, máy hỏi “còn phần tử không?” — đó cũng là một lần rẽ.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Cuối cùng là vòng lặp. Khi danh sách không có phần tử nào, thân vòng lặp không chạy lần nào. Danh sách 4, 7 thì thân chạy 2 lần. Mỗi lần quay lại đầu vòng, máy hỏi còn phần tử nữa không, và đó cũng là một lần rẽ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: độ phức tạp vòng"
    checks:
      - "alg.mccabe('def h(a, b):\\n    return a + b\\n') == 1"
    steps:
      - show: |
          <p><b>Độ phức tạp vòng</b> $M$ của một hàm (McCabe, 1976) = số <b>điểm rẽ</b> + 1.</p>
          <table class="t"><tr><th>tính là một điểm rẽ</th></tr>
          <tr><td><code>if</code>, <code>elif</code>, <code>for</code>, <code>while</code>, <code>except</code>, biểu thức <code>a if c else b</code></td></tr>
          <tr><td>mỗi <code>and</code> / <code>or</code> trong điều kiện (vì nó cũng tạo một nhánh)</td></tr></table>
          <p class="note">Hàm không rẽ nhánh nào: $M = 1$ (một đường duy nhất). $M$ bằng số đường <b>độc lập</b> qua hàm — cận dưới số ca kiểm cần để phủ một bộ đường cơ sở (như độ phủ ở SWF).</p>
        focus: [1, 2, "2.2", "2.3", 3, 3]
        say: "Độ phức tạp vòng M của một hàm, đề xuất năm 1976, bằng số điểm rẽ cộng 1. Bảng liệt kê những gì được tính là một điểm rẽ. Đó là các câu điều kiện, các vòng lặp, nhánh bắt lỗi, và biểu thức điều kiện. Mỗi toán tử và hay hoặc trong điều kiện cũng tính, vì nó cũng tạo thêm một nhánh. Hàm không rẽ nhánh nào có M bằng 1, chỉ một đường duy nhất. M bằng số đường độc lập qua hàm, tức cận dưới của số ca kiểm cần để phủ một bộ đường cơ sở, như khoá Phần mềm đúng đắn."

  - id: intuition
    kind: intuition
    title: "Hàm là một bản đồ lối đi"
    steps:
      - show: |
          <div><svg width="1500" height="470" viewBox="0 0 1500 470"><defs><marker id="arD0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="25" y="80" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="110" y="118" font-size="22" text-anchor="middle" fill="#1f2937">n = 0</text><polygon points="245,110 340,60 435,110 340,160" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="340" y="118" font-size="22" text-anchor="middle" fill="#1f2937">rỗng?</text><polygon points="525,110 620,60 715,110 620,160" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="620" y="118" font-size="22" text-anchor="middle" fill="#1f2937">còn x?</text><polygon points="785,110 880,60 975,110 880,160" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="880" y="118" font-size="22" text-anchor="middle" fill="#1f2937">x &gt; lo?</text><polygon points="1045,110 1140,60 1235,110 1140,160" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1140" y="118" font-size="22" text-anchor="middle" fill="#1f2937">x &lt; hi?</text><rect x="1300" y="80" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1385" y="118" font-size="22" text-anchor="middle" fill="#1f2937">n += 1</text><rect x="255" y="270" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="340" y="308" font-size="22" text-anchor="middle" fill="#1f2937">trả 0</text><rect x="535" y="270" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="620" y="308" font-size="22" text-anchor="middle" fill="#1f2937">trả n</text><rect x="405" y="375" width="150" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="480" y="413" font-size="22" text-anchor="middle" fill="#1f2937">kết thúc</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="195" y1="110" x2="243" y2="110" marker-end="url(#arD0)"/><line x1="340" y1="160" x2="340" y2="268" marker-end="url(#arD0)"/><line x1="435" y1="110" x2="523" y2="110" marker-end="url(#arD0)"/><line x1="370" y1="330" x2="430" y2="373" marker-end="url(#arD0)"/><line x1="590" y1="330" x2="530" y2="373" marker-end="url(#arD0)"/><line x1="715" y1="110" x2="783" y2="110" marker-end="url(#arD0)"/><line x1="620" y1="160" x2="620" y2="268" marker-end="url(#arD0)"/><line x1="975" y1="110" x2="1043" y2="110" marker-end="url(#arD0)"/><line x1="1235" y1="110" x2="1298" y2="110" marker-end="url(#arD0)"/><path d="M1385,80 C1385,5 620,5 620,58" marker-end="url(#arD0)"/><path d="M880,160 C880,225 720,215 682,129" marker-end="url(#arD0)"/><path d="M1140,160 C1140,275 680,270 646,149" marker-end="url(#arD0)"/></g><g font-size="20" fill="#1f2937"><text x="352" y="220">rỗng</text><text x="479" y="98" text-anchor="middle">không</text><text x="749" y="98" text-anchor="middle">còn</text><text x="632" y="220">hết</text><text x="1009" y="98" text-anchor="middle">đúng</text><text x="1266" y="98" text-anchor="middle">đúng</text><text x="1010" y="56" text-anchor="middle">quay lại đầu vòng</text><text x="800" y="228" text-anchor="middle" fill="#b91c1c">sai</text><text x="1000" y="262" text-anchor="middle" fill="#b91c1c">sai</text></g><g font-size="24" fill="#1f2937"><text x="800" y="360"><tspan fill="#eb6834" font-weight="bold">hình thoi cam</tspan> = điểm rẽ: 4 cái, mỗi cái 2 lối ra</text><text x="800" y="405"><tspan fill="#2a78d6" font-weight="bold">ô xanh</tspan> = câu lệnh chạy thẳng</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ hàm đếm trong khoảng như một bản đồ lối đi, mỗi ô xanh là câu lệnh chạy thẳng, mỗi hình thoi cam là một chỗ phải chọn. Hình thoi thứ nhất hỏi danh sách có rỗng không, hình thoi thứ hai hỏi còn phần tử nào không. Hai hình thoi sau hỏi x lớn hơn lo, rồi x nhỏ hơn hi, đúng là hai vế của toán tử và. Có 4 hình thoi, mỗi cái có hai lối ra, và độ phức tạp vòng đếm chính những chỗ chọn này."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Đếm M cho một hàm đếm trong khoảng"
    checks:
      - "alg.mccabe('def f(xs, lo, hi):\\n    n = 0\\n    if not xs:\\n        return 0\\n    for x in xs:\\n        if x > lo and x < hi:\\n            n += 1\\n    return n\\n') == 5"
    steps:
      - show: |
          <div class="code"><div>def dem_trong_khoang(xs, lo, hi):</div><div>    n = 0</div><div>    if not xs:</div><div>        return 0</div><div>    for x in xs:</div><div>        if x &gt; lo and x &lt; hi:</div><div>            n += 1</div><div>    return n</div></div>
          <p><b>Bước 1</b> — chạy thử: <code>dem_trong_khoang([1, 5, 9], 2, 8)</code>. Chỉ 5 nằm giữa 2 và 8 → trả $\hl{1}$.</p>
        focus: [1, 2, 2]
        say: "Bước một, chạy thử hàm đếm trong khoảng, hàm nhận một danh sách và hai cận. Với danh sách 1, 5, 9, cận dưới 2, cận trên 8, chỉ có số 5 nằm giữa hai cận. Vì vậy hàm trả về 1."
      - clear: true
        show: |
          <p><b>Bước 2</b> — tìm từng điểm rẽ:</p>
          <table class="t"><tr><th>chỗ trong mã</th><th>loại</th><th>điểm rẽ</th></tr>
          <tr><td><code>if not xs:</code></td><td>câu điều kiện</td><td>1</td></tr>
          <tr><td><code>for x in xs:</code></td><td>vòng lặp</td><td>2</td></tr>
          <tr><td><code>if x &gt; lo ...</code></td><td>câu điều kiện</td><td>3</td></tr>
          <tr><td><code>... and x &lt; hi</code></td><td>toán tử và</td><td>4</td></tr></table>
        focus: [1, "2.2", "2.4", "2.5"]
        say: "Bước hai, tìm từng điểm rẽ. Câu kiểm danh sách rỗng là điểm rẽ thứ nhất, vòng lặp là điểm rẽ thứ hai. Câu điều kiện bên trong là điểm rẽ thứ ba. Toán tử và trong điều kiện là điểm rẽ thứ tư."
      - show: |
          <p><b>Bước 3</b> — cộng 1: $M = 4 + 1 = \hl{5}$. Máy đếm trên cây cú pháp cho cùng kết quả.</p>
        say: "Bước ba, bốn điểm rẽ cộng 1 cho M bằng 5, và máy đếm trên cây cú pháp cũng cho cùng kết quả."
      - clear: true
        show: |
          <table class="t"><tr><th>câu hỏi</th><th>trả lời</th></tr>
          <tr><td>$M = 5$ so với ngưỡng 10?</td><td>5 &lt; 10 → chưa cần tách</td></tr>
          <tr><td>tên có nói đúng việc?</td><td><code>dem_trong_khoang</code> có; <code>xu_ly</code> thì không</td></tr></table>
          <div class="box key">M từ 10 trở lên thường là dấu hiệu nên tách hàm.</div>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước bốn, ra quyết định. M bằng 5 vẫn nhỏ hơn ngưỡng 10, nên hàm này chưa cần tách. Tên đếm trong khoảng nói rõ hàm làm gì, tên xử lý thì không. M từ 10 trở lên thường là dấu hiệu nên tách hàm."

  - id: check
    kind: check
    title: "Tự kiểm: đếm ô và mũi tên trên bản đồ"
    checks:
      - "(lambda E, N: len(E) - N + 2)([(1, 2), (2, 3), (2, 4), (3, 9), (4, 5), (4, 8), (5, 6), (5, 4), (6, 7), (6, 4), (7, 4), (8, 9)], 9) == 5 == alg.mccabe('def f(xs, lo, hi):\\n    n = 0\\n    if not xs:\\n        return 0\\n    for x in xs:\\n        if x > lo and x < hi:\\n            n += 1\\n    return n\\n')"
      - "(lambda d: exec('def f(xs, lo, hi):\\n    n = 0\\n    if not xs:\\n        return 0\\n    for x in xs:\\n        if x > lo and x < hi:\\n            n += 1\\n    return n\\n', d) or (d['f']([1, 5, 9], 2, 8) == 1 and d['f']([], 2, 8) == 0))({})"
    steps:
      - show: |
          <table class="t"><tr><th>đếm trên bản đồ lối đi</th><th>số</th></tr>
          <tr><td>ô và hình thoi (gọi là N)</td><td>9</td></tr>
          <tr><td>mũi tên (gọi là E)</td><td>12</td></tr>
          <tr><td>$M = E - N + 2$</td><td>$12 - 9 + 2 = \hl{5}$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, đếm thẳng trên bản đồ lối đi. Có 9 ô chữ nhật và hình thoi, ta gọi số này là N. Có 12 mũi tên, gọi là E. Công thức gốc của độ phức tạp vòng là E trừ N cộng 2, bằng 12 trừ 9 cộng 2, bằng 5, nên khớp với cách đếm điểm rẽ."
      - show: |
          <table class="t"><tr><th></th><th>hàm chạy thẳng</th><th><code>dem_trong_khoang</code></th></tr>
          <tr><td>hình thoi (mỗi cái thêm 1 mũi tên)</td><td>0</td><td>4</td></tr>
          <tr><td>M</td><td>1</td><td>1 + 4 = 5</td></tr></table>
        say: "Vì sao hai cách khớp nhau? Mỗi hình thoi có hai lối ra thay vì một, nên thêm đúng một mũi tên. Bốn hình thoi thêm bốn mũi tên, nên M lớn hơn 4 so với hàm chạy thẳng có M bằng 1."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "alg.mccabe('def h(a, b):\\n    if a:\\n        if b:\\n            return 1\\n    return 0\\n') == 3 == alg.mccabe('def h(a, b):\\n    if a and b:\\n        return 1\\n    return 0\\n')"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi M thấp là “mã đẹp” <b class="red">(sai)</b>
          <br><span class="note">M đếm nhánh, không đo tên, cấu trúc dữ liệu hay sự rõ ràng. Một hàm M = 1 dài 200 dòng vẫn khó đọc. M là tín hiệu để xem lại, không phải điểm số.</span></div>
        say: "Lỗi thứ nhất, coi M thấp là mã đẹp. M đếm nhánh, không đo tên, cấu trúc dữ liệu hay sự rõ ràng, một hàm M bằng 1 mà dài 200 dòng vẫn khó đọc. M là tín hiệu để xem lại, không phải điểm số."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tên mơ hồ: <code>data</code>, <code>tmp</code>, <code>xu_ly</code>, <code>flag</code> <b class="red">(khó đọc)</b>
          <br><span class="note">Đặt tên theo <b>ý nghĩa</b>: <code>so_don_qua_han</code>, <code>da_thanh_toan</code>. Tên hàm là động từ nói đúng việc nó làm — nếu khó đặt tên, hàm đang làm quá nhiều việc.</span></div>
        say: "Lỗi thứ hai, đặt tên mơ hồ như dữ liệu, tạm, xử lý, cờ. Hãy đặt tên theo ý nghĩa, như số đơn quá hạn hay đã thanh toán. Tên hàm là một động từ nói đúng việc nó làm, nếu khó đặt tên thì hàm đang làm quá nhiều việc."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tách hàm chỉ để giảm M mà không có ý nghĩa <b class="red">(rời rạc)</b>
          <br><span class="note">Cắt một hàm thành <code>phan1()</code>, <code>phan2()</code> theo số dòng làm người đọc phải nhảy qua lại. Tách theo <b>khái niệm</b>: mỗi hàm một việc có tên.</span></div>
        say: "Lỗi thứ ba, tách hàm chỉ để giảm M mà không có ý nghĩa. Cắt một hàm thành phần một, phần hai theo số dòng làm người đọc phải nhảy qua lại, nên hãy tách theo khái niệm, mỗi hàm một việc có tên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Gộp hai <code>if</code> lồng nhau thành một <code>and</code> để “giảm M” trước khi qua cổng kiểm tự động <b class="red">(không giảm)</b></div>
          <table class="t"><tr><th>cách viết</th><th>điểm rẽ</th><th>M</th></tr>
          <tr><td><code>if a:</code> rồi bên trong <code>if b:</code></td><td>2 câu điều kiện</td><td>3</td></tr>
          <tr><td><code>if a and b:</code></td><td>1 câu điều kiện + 1 toán tử và</td><td>3</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 2]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, khi nhóm đặt cổng kiểm tự động chặn hàm có M quá cao. Có người gộp hai câu điều kiện lồng nhau thành một điều kiện nối bằng toán tử và, mong qua cổng. Bản lồng nhau có hai câu điều kiện, M bằng 3. Bản gộp có một câu điều kiện và một toán tử và, M vẫn bằng 3. Số ca phải kiểm không đổi, nên người làm nghề giảm M bằng cách tách khái niệm, không phải bằng cách viết gọn điều kiện."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda d: exec('def g(x):\\n    while x > 0:\\n        x -= 1\\n    if x == 0:\\n        return \"a\"\\n    elif x < 0:\\n        return \"b\"\\n    return \"c\"\\n', d) or ([d['g'](2), d['g'](0), d['g'](-1)] == ['a', 'a', 'b'] and all(d['g'](x) != 'c' for x in range(-50, 51))))({})"
      - "alg.mccabe('def g(x):\\n    while x > 0:\\n        x -= 1\\n    if x == 0:\\n        return \"a\"\\n    elif x < 0:\\n        return \"b\"\\n    return \"c\"\\n') == 4"
    steps:
      - show: |
          <div class="code"><div>def g(x):</div><div>    while x &gt; 0:</div><div>        x -= 1</div><div>    if x == 0:</div><div>        return "a"</div><div>    elif x &lt; 0:</div><div>        return "b"</div><div>    return "c"</div></div>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hàm có mấy điểm rẽ? M bằng bao nhiêu?</td></tr>
          <tr><td>2</td><td>Cần ít nhất mấy ca kiểm để phủ một bộ đường cơ sở? Mọi đường có chạy tới được không?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm với hàm g có một vòng lặp, một câu điều kiện, và một nhánh điều kiện phụ. Hàm có mấy điểm rẽ, và M bằng bao nhiêu? Cần ít nhất mấy ca kiểm để phủ một bộ đường cơ sở, và mọi đường có chạy tới được không? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>chỗ trong mã</th><th>loại</th><th>điểm rẽ</th></tr>
          <tr><td><code>while x &gt; 0:</code></td><td>vòng lặp</td><td>1</td></tr>
          <tr><td><code>if x == 0:</code></td><td>câu điều kiện</td><td>2</td></tr>
          <tr><td><code>elif x &lt; 0:</code></td><td>nhánh điều kiện phụ</td><td>3</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, đếm từng điểm rẽ. Vòng lặp chính là điểm rẽ nhánh thứ nhất trong hàm. Câu điều kiện là điểm rẽ thứ hai. Nhánh điều kiện phụ là điểm rẽ thứ ba."
      - show: |
          <p>3 điểm rẽ → $M = 3 + 1 = \hl{4}$ → một bộ đường cơ sở có 4 đường, nên cần ít nhất 4 ca kiểm.</p>
        say: "Có 3 điểm rẽ, cộng 1 được M bằng 4, nên một bộ đường cơ sở có 4 đường, và cần ít nhất 4 ca kiểm."
      - show: |
          <table class="t"><tr><th>x</th><th>vòng lặp</th><th>kết quả</th></tr>
          <tr><td>2</td><td>chạy 2 lần, x về 0</td><td>"a"</td></tr>
          <tr><td>0</td><td>không chạy</td><td>"a"</td></tr>
          <tr><td>−1</td><td>không chạy</td><td>"b"</td></tr>
          <tr><td>mọi số nguyên từ −50 tới 50</td><td></td><td>không lần nào ra "c"</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Câu hai, thử từng ca để thấy điều M không nói ra. Với x bằng 2, vòng lặp chạy hai lần đưa x về 0, kết quả là a. Với x bằng 0, vòng không chạy, kết quả vẫn là a. Với x bằng âm 1, kết quả là b. Máy thử mọi số nguyên từ âm 50 tới 50, không lần nào ra c, vì sau vòng lặp x luôn bằng 0 hoặc âm, nên nhánh cuối là mã chết, nên xoá đi."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hàm nhỏ, một việc</span><span class="a">→</span>
          <span class="n">tên nói đúng việc</span><span class="a">→</span>
          <span class="n">M = điểm rẽ + 1</span><span class="a">→</span>
          <span class="n">M cao: tín hiệu tách theo khái niệm</span></div>
        say: "Tổng kết lại, viết hàm nhỏ làm một việc, đặt tên nói đúng việc đó. Độ phức tạp vòng bằng số điểm rẽ cộng 1, và M cao là tín hiệu nên tách hàm theo khái niệm."
      - show: |
          <div class="box key"><b>Tư duy:</b> mã được đọc nhiều hơn được viết. Viết cho người đọc tiếp theo — có thể chính là bạn sáu tháng sau.</div>
        say: "Điều cần mang theo, mã được đọc nhiều hơn được viết. Hãy viết cho người đọc tiếp theo, có thể chính là bạn sáu tháng sau."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>xử lý lỗi</b> — mã lỗi, ngoại lệ, thất bại sớm.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học cách xử lý lỗi, với mã lỗi, ngoại lệ, và nguyên tắc thất bại sớm. Hẹn gặp bạn ở bài tiếp theo."
