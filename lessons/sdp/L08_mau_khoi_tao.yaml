id: L08
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 8 — Mẫu khởi tạo: Factory, Builder, Singleton"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L08; audit/sdp/verify_sdp.py L08; E. Gamma, R. Helm, R. Johnson, J. Vlissides, Design Patterns (1994), chương 3 (Factory Method, Builder, Singleton); M. Feathers, Working Effectively with Legacy Code (2004), chương 9"
assumes: [arith]
# Quy ước: tên mẫu tiếng Anh chỉ trên màn hình; lời đọc: Factory = “mẫu nhà máy”, Builder = “mẫu xây dựng từng bước”, Singleton = “mẫu đối tượng
#   duy nhất”. alg.singleton_order(first) chạy hai kiểm thử dùng chung một bộ đếm duy nhất, trả kết quả kiểm thử A.
objectives:
  - "Dùng mẫu nhà máy để ẩn lớp cụ thể"
  - "Dùng mẫu xây dựng từng bước cho đối tượng nhiều tham số"
  - "Giải thích vì sao đối tượng duy nhất làm kiểm thử phụ thuộc thứ tự"
asr_reviewed:
  - {sentence: "B tăng thêm 2 thành 3, nhưng A đã kiểm xong rồi.", reason: "ASR chép “V tăng thêm 2 thành 3, nhưng A đã kiểm xong rồi.” (0.917): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đáp án câu một, A thấy 2 cộng 1 bằng 3.", reason: "ASR chép “Đáp án câu 1 à thấy 2 cộng 1 bằng 3”: chữ cái A (tên kiểm thử) đọc “a”, ASR viết thành thán từ “à”; phép tính khớp đủ (0,909) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Kiểm thử đúng hay sai tuỳ thứ tự chạy"
    checks:
      - "alg.singleton_order('A') is True and alg.singleton_order('B') is False"
    steps:
      - show: |
          <p>Hai kiểm thử dùng chung một bộ đếm toàn chương trình. A tăng 1 rồi mong giá trị bằng 1; B tăng 2.</p>
          <table class="t"><tr><th>thứ tự chạy</th><th>A thấy</th><th>A</th></tr>
          <tr><td>A rồi B</td><td>1</td><td class="green">đạt</td></tr>
          <tr><td>B rồi A</td><td>3</td><td class="red">trượt</td></tr></table>
          <div class="box key">Hôm nay: ba <b>mẫu khởi tạo</b> — và vì sao mẫu “đối tượng duy nhất” gây ra chuyện trên.</div>
        focus: [1, 1, "2.2", "2.3", 3]
        say: "Chào bạn, hai kiểm thử dùng chung một bộ đếm cho toàn chương trình. Kiểm thử A tăng 1 rồi mong giá trị bằng 1, kiểm thử B tăng 2. Chạy A trước B thì A thấy 1 và đạt. Chạy B trước A thì A thấy 3 và trượt. Hôm nay ta học ba mẫu khởi tạo, và vì sao mẫu đối tượng duy nhất gây ra chuyện trên."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: mỗi lần tạo là một đối tượng mới, và hai tên cho một đối tượng"
    checks:
      - "(lambda d: exec('class Dem:\\n    def __init__(self): self.n = 0\\na = Dem()\\nb = Dem()\\na.n += 1\\n', d) or (d['a'].n, d['b'].n) == (1, 0))({})"
      - "(lambda d: exec('x = [0]\\ny = x\\ny[0] += 2\\n', d) or d['x'][0] == 2)({})"
    steps:
      - show: |
          <div class="code"><div>a = Dem()</div><div>b = Dem()</div><div>a.n += 1</div></div>
          <table class="t"><tr><th>đối tượng</th><th>n sau đó</th></tr><tr><td><code>a</code></td><td>1</td></tr><tr><td><code>b</code></td><td>0</td></tr></table>
        focus: [1, 1, 2]
        say: "Trước hết, ôn lớp và đối tượng. Mỗi lần gọi hàm tạo của lớp bộ đếm là có một đối tượng mới, với số đếm riêng bắt đầu từ 0. Tăng a lên 1 thì a có 1, còn b vẫn là 0, vì a và b là hai đối tượng khác nhau."
      - show: |
          <div class="code"><div>x = [0]</div><div>y = x          <span class="cm"># y và x cùng chỉ MỘT danh sách</span></div><div>y[0] += 2</div></div>
          <table class="t"><tr><th>đọc</th><th>giá trị</th></tr><tr><td><code>x[0]</code></td><td>2</td></tr></table>
        focus: [1, 1, 2]
        say: "Thứ hai, hai cái tên có thể cùng chỉ vào một đối tượng. Gán y bằng x không sao chép gì, nên cả hai cùng chỉ một danh sách. Tăng phần tử đầu qua tên y thêm 2, đọc qua tên x cũng thấy 2."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: ba mẫu khởi tạo"
    steps:
      - show: |
          <table class="t"><tr><th>mẫu</th><th>giải quyết</th></tr>
          <tr><td><b>Factory</b> (nhà máy)</td><td>nơi dùng không cần biết lớp cụ thể: <code>tao_hinh("tron")</code> trả về một <code>Hinh</code> <span class="note">(dạng gọn; sách gốc có hai biến thể đầy đủ: Factory Method, Abstract Factory)</span></td></tr>
          <tr><td><b>Builder</b> (xây từng bước)</td><td>đối tượng nhiều tham số tuỳ chọn: đặt từng phần có tên rồi <code>build()</code></td></tr>
          <tr><td><b>Singleton</b> (đối tượng duy nhất)</td><td>cả chương trình chỉ có một thể hiện, ai cũng lấy được</td></tr></table>
          <p class="note">Mẫu thiết kế = lời giải đã đặt tên cho một vấn đề lặp lại (Gamma và cộng sự, 1994). Biết tên giúp nói chuyện nhanh, không phải để dùng ở mọi chỗ.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Bảng liệt kê ba mẫu khởi tạo. Mẫu nhà máy giúp nơi dùng không cần biết lớp cụ thể, chỉ xin một hình tròn và nhận về một hình, đây là dạng gọn, sách gốc còn có hai biến thể đầy đủ hơn. Mẫu xây dựng từng bước dành cho đối tượng nhiều tham số tuỳ chọn, ta đặt từng phần có tên rồi mới tạo. Mẫu đối tượng duy nhất bảo đảm cả chương trình chỉ có một thể hiện, và ai cũng lấy được nó. Mẫu thiết kế là lời giải đã được đặt tên cho một vấn đề lặp lại, theo cuốn sách kinh điển năm 1994 của bốn tác giả. Biết tên giúp trao đổi nhanh, không phải để dùng ở mọi chỗ."

  - id: intuition
    kind: intuition
    title: "Bộ đếm riêng và bộ đếm dùng chung"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="330" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#059669">Mỗi kiểm thử một bộ đếm riêng</text><text x="1100" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#b91c1c">Đối tượng duy nhất: dùng chung</text><rect x="90" y="100" width="200" height="64" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="190" y="140" font-size="24" text-anchor="middle" fill="#1f2937">kiểm thử A</text><rect x="370" y="100" width="200" height="64" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="470" y="140" font-size="24" text-anchor="middle" fill="#1f2937">kiểm thử B</text><rect x="90" y="260" width="200" height="64" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="190" y="300" font-size="24" text-anchor="middle" fill="#1f2937">n: 0 → 1</text><rect x="370" y="260" width="200" height="64" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="470" y="300" font-size="24" text-anchor="middle" fill="#1f2937">n: 0 → 2</text><g stroke="#1f2937" stroke-width="3"><line x1="190" y1="164" x2="190" y2="257" marker-end="url(#arD8)"/><line x1="470" y1="164" x2="470" y2="257" marker-end="url(#arD8)"/></g><text x="330" y="370" font-size="22" text-anchor="middle" fill="#059669">thứ tự nào A cũng thấy 1</text><line x1="750" y1="70" x2="750" y2="390" stroke="#d1d5db" stroke-width="3"/><rect x="860" y="100" width="200" height="64" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="960" y="140" font-size="24" text-anchor="middle" fill="#1f2937">kiểm thử B</text><rect x="1140" y="100" width="200" height="64" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1240" y="140" font-size="24" text-anchor="middle" fill="#1f2937">kiểm thử A</text><rect x="950" y="260" width="300" height="64" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1100" y="300" font-size="24" text-anchor="middle" fill="#1f2937">n: 0 → 2 → 3</text><g stroke="#1f2937" stroke-width="3"><line x1="960" y1="164" x2="1040" y2="257" marker-end="url(#arD8)"/><line x1="1240" y1="164" x2="1160" y2="257" marker-end="url(#arD8)"/></g><text x="935" y="210" font-size="22" text-anchor="end" fill="#1f2937">chạy trước: +2</text><text x="1265" y="210" font-size="22" fill="#1f2937">chạy sau: +1</text><text x="1100" y="370" font-size="22" text-anchor="middle" fill="#b91c1c">A thấy 3, mong 1 → trượt</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình so hai cách cho kiểm thử dùng bộ đếm. Bên trái, mỗi kiểm thử có một bộ đếm riêng bắt đầu từ 0, nên A luôn thấy 1 dù chạy trước hay sau. Bên phải, mẫu đối tượng duy nhất cho cả hai cùng chỉ vào một bộ đếm, giống hai tên x và y vừa rồi. B chạy trước đưa số đếm lên 2, A chạy sau cộng thêm 1 thành 3, trong khi A mong 1, nên A trượt."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Nhà máy, xây từng bước, và cái giá của đối tượng duy nhất"
    checks:
      - "alg.singleton_order('A') and not alg.singleton_order('B')"
    steps:
      - show: |
          <div class="code"><div>def tao_hinh(loai, *ts):                 <span class="cm"># nhà máy</span></div><div>    return {"tron": Tron, "vuong": Vuong}[loai](*ts)</div></div>
          <p><b>Bước 1</b> — <code>tao_hinh("tron", 1)</code> tra bảng, gặp lớp <code>Tron</code>, trả một hình tròn. Thêm loại hình: chỉ sửa <b>một</b> bảng trong nhà máy.</p>
        focus: [1, 2, 2]
        say: "Bước một, hàm nhà máy nhận tên loại hình và trả về đúng lớp cụ thể. Xin hình tròn bán kính 1, nhà máy tra bảng, gặp lớp hình tròn và trả về một hình tròn. Thêm một loại hình chỉ cần sửa một bảng trong nhà máy."
      - show: |
          <div class="code"><div>yc = (YeuCau.builder().url("/don").phuong_thuc("POST")</div><div>        .thoi_gian_cho(5).build())       <span class="cm"># xây từng bước</span></div></div>
          <p><b>Bước 2</b> — mỗi phần có tên, nên không nhầm “5 là số giây hay số lần thử lại”; <code>build()</code> chạy cuối cùng.</p>
        focus: [1, 2, 2]
        say: "Bước hai, một yêu cầu được xây từng bước, đặt địa chỉ, đặt phương thức, đặt thời gian chờ rồi mới tạo. Tham số có tên nên không nhầm số 5 là số giây hay số lần thử lại. Bước tạo chạy cuối cùng, khi mọi phần đã đặt xong."
      - clear: true
        show: |
          <p><b>Bước 3</b> — đối tượng duy nhất, chạy A rồi B:</p>
          <table class="t"><tr><th>bước</th><th>n</th><th>A kiểm n == 1?</th></tr>
          <tr><td>bắt đầu</td><td>0</td><td></td></tr><tr><td>A: n += 1</td><td>1</td><td class="green">đạt</td></tr>
          <tr><td>B: n += 2</td><td>3</td><td></td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, theo dõi đối tượng duy nhất khi chạy A rồi B. Bộ đếm bắt đầu từ 0. A tăng 1 thành 1, kiểm bằng 1, đạt. B tăng thêm 2 thành 3, nhưng A đã kiểm xong rồi."
      - show: |
          <p><b>Bước 4</b> — cùng hai kiểm thử, chạy B rồi A:</p>
          <table class="t"><tr><th>bước</th><th>n</th><th>A kiểm n == 1?</th></tr>
          <tr><td>bắt đầu</td><td>0</td><td></td></tr><tr><td>B: n += 2</td><td>2</td><td></td></tr>
          <tr><td>A: n += 1</td><td>3</td><td class="red">trượt</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước bốn, cùng hai kiểm thử nhưng chạy B rồi A. Bộ đếm bắt đầu từ 0. Kiểm thử B tăng thêm 2, nên bộ đếm thành 2. A tăng 1 thành 3, kiểm bằng 1 thì trượt."
      - clear: true
        show: |
          <div class="box warn">Đối tượng duy nhất = <b>biến toàn cục</b> có tên đẹp: trạng thái sống qua các kiểm thử, nên kết quả phụ thuộc thứ tự chạy. Chỉ dùng khi tài nguyên thật sự là duy nhất (một cổng phần cứng), và vẫn nên <b>tiêm</b> nó vào như bài 7.</div>
        say: "Đối tượng duy nhất thực chất là một biến toàn cục có tên đẹp, trạng thái sống qua các kiểm thử nên kết quả phụ thuộc thứ tự chạy. Chỉ dùng khi tài nguyên thật sự là duy nhất như một cổng phần cứng, và vẫn nên tiêm nó vào như bài 7, tức là truyền vào qua tham số."

  - id: check
    kind: check
    title: "Tự kiểm: thử mọi thứ tự chạy"
    checks:
      - "(lambda P, inc: (sum((lambda o: (lambda s: s[o.index('A')] == 1)([sum(inc[t] for t in o[:i + 1]) for i in range(3)]))(o) for o in P), sum(inc['A'] == 1 for o in P), len(P)))(list(__import__('itertools').permutations('ABC')), {'A': 1, 'B': 2, 'C': 1}) == (2, 6, 6)"
    steps:
      - show: |
          <p>Đường khác: thêm kiểm thử C (tăng 1, không kiểm gì), rồi thử <b>mọi</b> thứ tự của A, B, C: có $3 \cdot 2 \cdot 1 = 6$ thứ tự.</p>
          <table class="t"><tr><th>cách giữ bộ đếm</th><th>số thứ tự A đạt</th></tr>
          <tr><td>đối tượng duy nhất</td><td class="red">2 / 6 (chỉ khi A chạy đầu)</td></tr>
          <tr><td>mỗi kiểm thử một bộ đếm tiêm vào</td><td>6 / 6</td></tr></table>
        introduces: [cdot]
        focus: [1, 1, "2.2", "2.3"]
        say: "Kiểm bằng đường khác, ta thêm kiểm thử C cũng tăng 1 nhưng không kiểm gì, rồi thử mọi thứ tự của A, B, C. Có 3 nhân 2 nhân 1 bằng 6 thứ tự. Với đối tượng duy nhất, A chỉ đạt 2 trong 6 thứ tự, đúng là những thứ tự A chạy đầu tiên. Với bộ đếm riêng tiêm vào từng kiểm thử, A đạt cả 6, nên lỗi nằm ở chỗ dùng chung, không ở mã của A."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda run: (run([('T1', 'kiểm'), ('T2', 'kiểm'), ('T1', 'tạo'), ('T2', 'tạo')]), run([('T1', 'kiểm'), ('T1', 'tạo'), ('T2', 'kiểm'), ('T2', 'tạo')])))(lambda sched: (lambda st: [st.update({t: st['inst'] is None}) if op == 'kiểm' else (st.update({'inst': object(), 'made': st['made'] + 1}) if st[t] else None) for t, op in sched] and st['made'])({'inst': None, 'made': 0})) == (2, 1)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dùng đối tượng duy nhất cho cấu hình, nhật ký, kết nối… <b class="red">(toàn cục trá hình)</b>
          <br><span class="note">Mọi lớp ngầm phụ thuộc vào nó; không thay được bằng đối tượng giả; kiểm thử ảnh hưởng lẫn nhau.</span></div>
        say: "Lỗi thứ nhất, dùng đối tượng duy nhất cho cấu hình, nhật ký, kết nối và đủ thứ khác. Mọi lớp ngầm phụ thuộc vào nó, không thay được bằng đối tượng giả, và các kiểm thử ảnh hưởng lẫn nhau."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Làm nhà máy cho lớp chỉ có một cài đặt <b class="red">(thừa)</b>
          <br><span class="note">Nhà máy có ích khi có nhiều lớp cụ thể hoặc cách tạo phức tạp. Một lớp, một hàm tạo thì gọi thẳng.</span></div>
        say: "Lỗi thứ hai, làm nhà máy cho một lớp chỉ có một cài đặt. Nhà máy có ích khi có nhiều lớp cụ thể hoặc cách tạo phức tạp, còn một lớp với một hàm tạo thì cứ gọi thẳng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Xây từng bước mà không kiểm đủ phần bắt buộc <b class="red">(đối tượng dở dang)</b>
          <br><span class="note">Bước <code>build()</code> phải kiểm bất biến (thiếu địa chỉ thì báo lỗi) — thất bại sớm như bài 1.</span></div>
        say: "Lỗi thứ ba, xây từng bước mà không kiểm đủ phần bắt buộc. Bước tạo cuối cùng phải kiểm bất biến, thiếu địa chỉ thì báo lỗi, thất bại sớm như bài 1."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Đối tượng duy nhất “tạo khi cần lần đầu” trong chương trình nhiều luồng <b class="red">(ra hai bản)</b></div>
          <table class="t"><tr><th>thứ tự</th><th>luồng 1</th><th>luồng 2</th><th>số đối tượng tạo ra</th></tr>
          <tr><td>xen kẽ</td><td>thấy chưa có → tạo</td><td>cũng thấy chưa có → tạo</td><td class="red">2</td></tr>
          <tr><td>lần lượt</td><td>thấy chưa có → tạo</td><td>thấy đã có → dùng lại</td><td>1</td></tr></table>
        focus: [1, "2.2", "2.3", 1]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, cài đối tượng duy nhất theo kiểu tạo khi cần lần đầu, rồi chạy trong chương trình nhiều luồng. Nếu hai luồng chạy xen kẽ, cả hai cùng kiểm thấy chưa có đối tượng, rồi cả hai cùng tạo, thành 2 bản. Chạy lần lượt thì luồng sau thấy đã có và dùng lại, chỉ 1 bản. Lỗi này thường chỉ lộ ra khi tải cao, khó bắt khi chạy thử, nên người làm nghề tạo sẵn đối tượng lúc khởi động rồi tiêm vào, hoặc đặt khoá quanh bước kiểm và tạo."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.singleton_order('B') is False and 2 + 1 == 3"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nếu B chạy trước, A thấy giá trị bao nhiêu? Sửa thế nào để A đạt ở mọi thứ tự?</td></tr>
          <tr><td>2</td><td>Hàm tạo <code>KetNoi(host, port, ssl, timeout, retry, pool)</code> có 6 tham số, 4 cái tuỳ chọn. Mẫu nào hợp?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, nếu B chạy trước thì A thấy giá trị bao nhiêu? Sửa thế nào để A đạt ở mọi thứ tự? Câu hai, hàm tạo kết nối có 6 tham số, trong đó 4 cái tuỳ chọn. Mẫu nào hợp? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>bước</th><th>bộ đếm dùng chung</th><th>A với bộ đếm riêng</th></tr>
          <tr><td>B: n += 2</td><td>2</td><td>0 (không đụng tới)</td></tr>
          <tr><td>A: n += 1</td><td>$2 + 1 = \hl{3}$ → trượt</td><td>$0 + 1 = 1$ → đạt</td></tr></table>
        focus: ["1.3", "1.2", "1.3"]
        say: "Đáp án câu một, A thấy 2 cộng 1 bằng 3. Bảng cho thấy vì sao, B chạy trước đã đưa bộ đếm dùng chung lên 2, còn bộ đếm riêng của A vẫn là 0. Cách sửa là cho mỗi kiểm thử tạo bộ đếm riêng và tiêm vào, không dùng chung trạng thái, khi đó A thấy 0 cộng 1 bằng 1 và đạt."
      - show: |
          <table class="t"><tr><th>tham số</th><th>loại</th></tr>
          <tr><td><code>host</code>, <code>port</code></td><td>bắt buộc (2)</td></tr>
          <tr><td><code>ssl</code>, <code>timeout</code>, <code>retry</code>, <code>pool</code></td><td>tuỳ chọn (4)</td></tr></table>
          <p>② Mẫu <b>xây từng bước</b>: đặt các phần tuỳ chọn có tên, <code>build()</code> kiểm phần bắt buộc.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, phân loại tham số trước. Địa chỉ máy và cổng là 2 tham số bắt buộc. Bốn tham số còn lại là tuỳ chọn, xếp theo vị trí rất dễ nhầm thứ tự. Vì vậy dùng mẫu xây dựng từng bước, đặt các phần tuỳ chọn có tên, và bước tạo kiểm phần bắt buộc."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">nhà máy: ẩn lớp cụ thể</span><span class="a">→</span>
          <span class="n">xây từng bước: nhiều tham số có tên</span><span class="a">→</span>
          <span class="n">đối tượng duy nhất: toàn cục, dùng rất ít</span></div>
        say: "Tổng kết lại, mẫu nhà máy ẩn lớp cụ thể, mẫu xây dựng từng bước xử lý nhiều tham số có tên, còn mẫu đối tượng duy nhất là biến toàn cục, nên dùng rất ít."
      - show: |
          <div class="box key"><b>Tư duy:</b> tách “tạo đối tượng” khỏi “dùng đối tượng”. Nơi dùng chỉ nên nhận đối tượng đã sẵn sàng.</div>
        say: "Điều cần mang theo, hãy tách việc tạo đối tượng khỏi việc dùng đối tượng. Nơi dùng chỉ nên nhận một đối tượng đã sẵn sàng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 9): <b>mẫu cấu trúc</b> — bộ chuyển đổi, bọc thêm, cây hợp thành.</p>
        forward_ref: true
        say: "Ở bài sau, bài 9, ta học các mẫu cấu trúc, gồm mẫu bộ chuyển đổi, mẫu bọc thêm, và mẫu cây hợp thành. Hẹn gặp bạn ở bài tiếp theo."
