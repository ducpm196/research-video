- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">giao diện: hợp đồng</span><span class="a">→</span>

      <span class="n">mỗi lớp tự cài hành vi</span><span class="a">→</span>

      <span class="n">nơi gọi không kiểm loại</span><span class="a">→</span>

      <span class="n">thêm loại = thêm lớp</span></div>

      '
    say: Tổng kết lại, giao diện là một hợp đồng, mỗi lớp tự cài hành vi, nơi gọi không cần kiểm loại, và thêm một loại chỉ là thêm một lớp. Giao diện trừu tượng và đa hình xoá sạch cấu trúc rẽ nhánh lặp lại theo loại đối tượng. Lập trình hướng tới giao diện gọn sạch thay cho kế thừa cứng giúp hệ thống dễ dàng bổ sung biến thể mới.
  - show: '<div class="box key"><b>Tư duy:</b> đặt quyết định “làm thế nào” vào chính đối tượng biết rõ nhất. Nơi gọi chỉ nên nói “làm việc này đi”.</div>

      <p class="note"><b>So sánh hai quy mô:</b> với 3 hình, rẽ nhánh chỉ tốn 3 câu điều kiện; khi hệ thống có 50 loại hình hay hàng chục cổng thanh toán, hàm rẽ nhánh phình khắp mã nguồn, còn đa hình chỉ thêm lớp mới.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Điều cần mang theo, hãy đặt quyết định làm thế nào vào chính đối tượng biết rõ nhất. Nơi gọi chỉ nên nói làm việc này đi. Ưu tiên hợp đồng giao diện gọn nhẹ thay vì tầng lớp kế thừa sâu cứng nhắc dễ đứt gãy. Ở bài toán nhỏ ba hình, rẽ nhánh bằng câu điều kiện chỉ tốn ba nhánh. Nhưng khi mở rộng lên năm mươi loại hình hay hàng chục cổng thanh toán, hàm rẽ nhánh sẽ phình khắp mã nguồn. Ngược lại, đa hình giữ nguyên vòng lặp gọi phép tính chung và chỉ cần thêm một lớp mới.
