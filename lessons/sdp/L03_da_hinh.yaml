objectives:
- Dùng đa hình thay cho chuỗi kiểm kiểu
- Hiểu giao diện là hợp đồng
- Biết khi nào kế thừa là đúng
asr_reviewed:
- sentence: Giao diện trừu tượng và đa hình xoá sạch cấu trúc rẽ nhánh lặp lại theo loại đối tượng.
  reason: 'ASR chép “Giao diện trừ tượng và đa hình xóa sạch cấu trúc để nhắn lập lại theo loại đối tượng.” (0.789): khác
    biệt [“trừu” → nghe thành “trừ”; “rẽ nhánh lặp” → nghe thành “để nhắn lập”]; lệch âm/thanh thuần Việt hoặc cách đọc từ
    chuyên ngành/số chữ — NOT_VERIFIED bằng tai người'
scenes:
- id: hook
  kind: hook
  title: 'Thêm hình lục giác: sửa mọi chuỗi điều kiện'
  steps:
  - show: '<div class="code"><div>def dien_tich(h):</div><div>    if h.loai == "chu_nhat": return h.w * h.h</div><div>    elif h.loai == "tron":   return 3.14159 * h.r ** 2</div><div>    elif h.loai == "tam_giac": return h.b * h.h / 2</div></div>

      <p>Cùng chuỗi <code>if … elif</code> này lặp lại ở hàm chu vi, hàm vẽ, hàm lưu tệp… Thêm hình lục giác: phải tìm và sửa mọi chuỗi đó.</p>

      <div class="box key">Hôm nay: <b>đa hình</b> — mỗi loại tự biết cách làm, nơi dùng chỉ gọi.</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    say: Chào bạn, hàm tính diện tích kiểm loại hình bằng một chuỗi câu điều kiện, chữ nhật thì nhân hai cạnh, tròn thì pi r bình phương, tam giác thì nửa đáy nhân cao. Cùng chuỗi điều kiện này lặp lại ở hàm chu vi, hàm vẽ, hàm lưu tệp. Thêm một hình lục giác là phải tìm và sửa mọi chuỗi đó. Hôm nay ta học đa hình, mỗi loại tự biết cách làm, nơi dùng chỉ việc gọi. Viết câu lệnh rẽ nhánh kiểm tra loại hình thức thanh toán rải rác ở mười lăm tệp khiến mỗi lần thêm cổng mới phải sửa nát cả dự án.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: diện tích ba hình, và lời gọi phương thức'
  checks:
  - (3 * 4, round(math.pi * 1 ** 2, 2), 6 * 2 / 2) == (12, 3.14, 6)
  - alg.Rect(3, 4).area() == 12 and (alg.Rect(3, 4).w, alg.Rect(3, 4).h) == (3, 4)
  steps:
  - show: '<table class="t"><tr><th>hình</th><th>công thức</th><th>thử số</th></tr>

      <tr><td>chữ nhật rộng $w$, cao $h$</td><td>$w \times h$</td><td>$3 \times 4 = 12$</td></tr>

      <tr><td>tròn bán kính $r$</td><td>$\pi r^2$</td><td>$\pi \times 1^2 \approx 3{,}14$</td></tr>

      <tr><td>tam giác đáy $b$, cao $h$</td><td>$b \times h / 2$</td><td>$6 \times 2 / 2 = 6$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Trước hết, ôn diện tích ba hình. Chữ nhật rộng w cao h có diện tích w nhân h, với 3 và 4 được 12. Hình tròn bán kính r có diện tích pi nhân r bình phương, với r bằng 1 được khoảng 3 phẩy 14. Tam giác đáy b cao h có diện tích b nhân h chia 2, với đáy 6 cao 2 được 6. Giao diện trừu tượng định nghĩa hợp đồng thuần tuý về những hành vi cần có mà không ràng buộc chi tiết cài đặt hay cấu trúc thừa kế huyết thống.
  - show: '<div class="code"><div>r = ChuNhat(3, 4)     <span class="cm"># self.w = 3, self.h = 4</span></div><div>r.area()             <span class="cm"># chạy area với self là r: 3 * 4 = 12</span></div></div>

      <p>Dấu chấm trong <code>r.area()</code> nghĩa là “gọi phương thức <code>area</code> <b>của</b> đối tượng <code>r</code>”; bên trong, <code>self</code> chính là <code>r</code>.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Tiếp theo, ôn lời gọi phương thức. Tạo đối tượng chữ nhật r với hai cạnh 3 và 4, rồi gọi phép tính diện tích của r, máy chạy hàm với đối tượng đang xét chính là r, nên được 3 nhân 4, bằng 12. Dấu chấm nghĩa là gọi phương thức của chính đối tượng đứng trước nó. Đa hình cho phép đoạn mã điều phối làm việc đồng nhất trên giao diện chung trong khi từng cài đặt cụ thể tự thực hiện đúng hành vi riêng của mình.
- id: sym
  kind: symbol
  title: 'Giải mã: giao diện, kế thừa, đa hình'
  checks:
  - alg.Rect(3, 4).area() == 12 and alg.Rect(3, 4).area() >= 0 and min(3, 4) >= 0
  steps:
  - show: '<p><b>Giao diện</b>: tập các thao tác hứa cung cấp — “mọi hình đều có <code>area()</code>”. Là một <b>hợp đồng</b>: <b>tiền điều kiện</b> (người gọi bảo đảm trước khi gọi) và <b>hậu điều kiện</b> (hàm hứa đúng sau khi chạy).</p>

      <table class="t"><tr><th><code>area()</code></th><th>tiền điều kiện</th><th>hậu điều kiện</th><th>chữ nhật 3 × 4</th></tr>

      <tr><td>mọi hình</td><td>cạnh, bán kính ≥ 0</td><td>trả một số ≥ 0</td><td>3, 4 ≥ 0 → trả 12 ≥ 0 ✓</td></tr></table>

      <p><b>Kế thừa</b>: lớp con nhận giao diện (và có thể cả cài đặt) của lớp cha.</p>

      <p><b>Đa hình</b>: cùng một lời gọi <code>h.area()</code>, mỗi đối tượng chạy cài đặt <b>của chính nó</b>; nơi gọi không cần biết loại.</p>


      <p class="note"><b>Khi nào kế thừa đúng:</b> lớp con thật sự “là một” lớp cha và giữ nguyên mọi hợp đồng tiền, hậu điều kiện ở mọi nơi gọi.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 3
    - 4
    - 4
    - 4
    say: 'Giao diện là tập các thao tác mà một loại hứa cung cấp, như mọi hình đều có phép tính diện tích. Đó là một hợp đồng gồm hai phần, tiền điều kiện là điều người gọi phải bảo đảm trước khi gọi, còn hậu điều kiện là điều hàm hứa đúng sau khi chạy xong. Với phép tính diện tích, tiền điều kiện là các cạnh và bán kính không âm, hậu điều kiện là kết quả không âm, chẳng hạn chữ nhật 3 nhân 4 trả 12, đúng lời hứa. Kế thừa là khi lớp con nhận giao diện, và có thể cả cài đặt, của lớp cha. Đa hình là cùng một lời gọi tính diện tích, mỗi đối tượng chạy cài đặt của chính nó, và nơi gọi không cần biết đối tượng thuộc loại nào. Điều phối đa hình biến rừng câu điều kiện theo chuỗi nhãn loại thành một lời gọi phương thức gọn sạch tự động mở rộng khi thêm cài đặt mới. Và lưu ý điều kiện để kế thừa đúng: lớp con phải thật sự là một loại của lớp cha và giữ trọn hợp đồng tiền điều kiện, hậu điều kiện ở mọi nơi được gọi.'
- id: intuition
  kind: intuition
  title: Một lời gọi, ba cách làm
  steps:
  - show: '<div><svg width="1500" height="440" viewBox="0 0 1500 440"><defs><marker id="arD3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="40" y="170" width="300" height="100" rx="12" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="190" y="212" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">vòng lặp</text><text x="190" y="248" font-size="22" text-anchor="middle" fill="#1f2937">gọi h.area()</text><rect x="555" y="42" width="330" height="96" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="720" y="80" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">ChuNhat(3, 4)</text><text x="720" y="118" font-size="22" text-anchor="middle" fill="#1f2937">chạy w × h = 12</text><rect x="555" y="172" width="330" height="96" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="720" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Tron(1)</text><text x="720" y="248" font-size="22" text-anchor="middle" fill="#1f2937">chạy π × 1 × 1 ≈ 3,14</text><rect x="555" y="302" width="330" height="96" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="720" y="340" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">TamGiac(6, 2)</text><text x="720" y="378" font-size="22" text-anchor="middle" fill="#1f2937">chạy 6 × 2 / 2 = 6</text><rect x="1150" y="170" width="300" height="100" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1300" y="212" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">cộng lại</text><text x="1300" y="248" font-size="22" text-anchor="middle" fill="#1f2937">18 + π ≈ 21,14</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="340" y1="205" x2="553" y2="100" marker-end="url(#arD3)"/><line x1="340" y1="220" x2="553" y2="220" marker-end="url(#arD3)"/><line x1="340" y1="235" x2="553" y2="340" marker-end="url(#arD3)"/><line x1="887" y1="100" x2="1148" y2="205" marker-end="url(#arD3)"/><line x1="887" y1="220" x2="1148" y2="220" marker-end="url(#arD3)"/><line x1="887" y1="340" x2="1148" y2="235" marker-end="url(#arD3)"/></g><g font-size="21" text-anchor="middle" fill="#eb6834"><text x="420" y="135">area()</text><text x="450" y="210">area()</text><text x="420" y="320">area()</text></g><g font-size="21" text-anchor="middle" fill="#059669"><text x="1010" y="135">12</text><text x="1010" y="210">3,14</text><text x="1010" y="320">6</text></g><text x="750" y="428" font-size="24" text-anchor="middle" fill="#1f2937">cùng một lời gọi, mỗi đối tượng tự chạy cách tính <tspan font-weight="bold">của chính nó</tspan>; vòng lặp không hỏi loại</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: 'Hình cho thấy vòng lặp gửi cùng một lời gọi tính diện tích tới ba đối tượng khác nhau. Chữ nhật tự nhân hai cạnh được 12, hình tròn tự tính pi nhân 1 nhân 1, tam giác tự lấy đáy nhân cao chia 2 được 6. Vòng lặp không hề hỏi đối tượng thuộc loại nào, nó chỉ cộng các kết quả lại, được 18 cộng pi. Ổ cắm điện hai chấu là giao diện chung: đèn bàn, quạt điện hay máy sấy khác hẳn ruột bên trong nhưng cùng cắm vừa khít vào ổ tường không cần thợ điện chỉnh ổ.'
- id: example
  kind: example
  title: Một vòng lặp cho mọi hình
  checks:
  - round(alg.total_area([alg.Rect(3, 4), alg.Circle(1), alg.Triangle(6, 2)]), 2) == 21.14 and abs(alg.total_area([alg.Rect(3, 4), alg.Circle(1), alg.Triangle(6, 2)]) - (18 + math.pi)) < 1e-12
  - '(lambda d: exec(''import math\nclass Hinh:\n    def area(self): raise NotImplementedError\nclass ChuNhat(Hinh):\n    def __init__(self, w, h): self.w, self.h = w, h\n    def area(self): return self.w * self.h\nclass Tron(Hinh):\n    def __init__(self, r): self.r = r\n    def area(self): return math.pi * self.r ** 2\nclass TamGiac(Hinh):\n    def __init__(self, b, h): self.b, self.h = b, h\n    def area(self): return self.b * self.h / 2\ncac_hinh = [ChuNhat(3, 4), Tron(1), TamGiac(6, 2)]\ntong = sum(h.area() for h in cac_hinh)\nr = ChuNhat(3, 4)\n'', d) or ([round(h.area(), 2) for h in d[''cac_hinh'']] == [12, 3.14, 6] and round(d[''tong''], 2) == 21.14 and d[''r''].area() == 12))({})'
  steps:
  - show: '<div class="code"><div>import math</div><div>class Hinh:</div><div>    def area(self): raise NotImplementedError</div><div>class ChuNhat(Hinh):</div><div>    def __init__(self, w, h): self.w, self.h = w, h</div><div>    def area(self): return self.w * self.h</div><div>class Tron(Hinh):</div><div>    def __init__(self, r): self.r = r</div><div>    def area(self): return math.pi * self.r ** 2</div><div>class TamGiac(Hinh):</div><div>    def __init__(self, b, h): self.b, self.h = b, h</div><div>    def area(self): return self.b * self.h / 2</div><div></div><div>cac_hinh = [ChuNhat(3, 4), Tron(1), TamGiac(6, 2)]</div><div>tong = sum(h.area() for h in cac_hinh)</div></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Bước một, đọc mã. Lớp hình cha khai báo phép tính diện tích mà chưa cài đặt. Mỗi lớp con nhận số đo của nó khi tạo, rồi cài phép tính diện tích, chữ nhật bằng tích hai cạnh, tròn bằng pi nhân r bình phương, tam giác bằng đáy nhân cao chia 2. Danh sách chứa ba hình đó, và tổng diện tích chỉ là một vòng lặp gọi phép tính diện tích của từng hình.
  - clear: true
    show: '<table class="t"><tr><th>bước</th><th>đối tượng</th><th>cài đặt được chạy</th><th>kết quả</th></tr>

      <tr><td>2</td><td>chữ nhật 3 × 4</td><td><code>self.w * self.h</code></td><td>12</td></tr>

      <tr><td>3</td><td>tròn bán kính 1</td><td><code>math.pi * self.r ** 2</code></td><td>$\pi \approx 3{,}14$</td></tr>

      <tr><td>3</td><td>tam giác đáy 6 cao 2</td><td><code>self.b * self.h / 2</code></td><td>6</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Bảng dưới đây chạy vòng lặp qua từng hình một. Bước hai, với chữ nhật 3 nhân 4, máy chạy cài đặt của chữ nhật, được 12. Bước ba, với hình tròn bán kính 1, máy chạy cài đặt của hình tròn, được pi, khoảng 3 phẩy 14. Với tam giác đáy 6 cao 2, máy chạy cài đặt của tam giác, được 6.
  - clear: true
    show: '<p><b>Bước 4</b> — cộng:</p>

      $$12 + \pi + 6 = 18 + \pi \approx \hl{21{,}14}$$

      '
    say: Bước bốn, cộng ba kết quả, 12 cộng pi cộng 6, bằng 18 cộng pi, khoảng 21 phẩy 14.
  - show: '<div class="box key"><b>Bước 5</b> — thêm lục giác = viết <b>một</b> lớp mới có <code>area()</code>. Vòng lặp tính tổng không đổi một chữ.</div>

      '
    say: Bước năm, quyết định khi có hình mới. Thêm hình lục giác chỉ cần viết một lớp mới có phép tính diện tích, vòng lặp tính tổng không đổi một chữ.
- id: check
  kind: check
  title: 'Tự kiểm: chạy lại bằng chuỗi câu điều kiện cũ'
  checks:
  - '(lambda d: exec(''def dien_tich(h):\n    if h.loai == "chu_nhat": return h.w * h.h\n    elif h.loai == "tron":   return 3.14159 * h.r ** 2\n    elif h.loai == "tam_giac": return h.b * h.h / 2\n'', d) or (lambda N: (lambda old: round(old, 2) == 21.14 == round(alg.total_area([alg.Rect(3, 4), alg.Circle(1), alg.Triangle(6, 2)]), 2) and abs(old - alg.total_area([alg.Rect(3, 4), alg.Circle(1), alg.Triangle(6, 2)])) < 0.00001)(sum(d[''dien_tich''](x) for x in [N(loai=''chu_nhat'', w=3, h=4), N(loai=''tron'', r=1), N(loai=''tam_giac'', b=6, h=2)])))(__import__(''types'').SimpleNamespace))({})'
  steps:
  - show: '<table class="t"><tr><th>cách tính</th><th>tổng</th></tr>

      <tr><td>chuỗi câu điều kiện ở đầu bài (dùng 3,14159)</td><td>≈ 21,14</td></tr>

      <tr><td>đa hình, một vòng lặp (dùng π của thư viện)</td><td>≈ 21,14 ✓</td></tr>

      <tr><td>chênh lệch</td><td>chưa tới 0,00001, do 3,14159 chỉ gần bằng π</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Kiểm bằng đường khác, chạy lại cùng ba hình bằng chuỗi câu điều kiện cũ ở đầu bài. Chuỗi cũ cho khoảng 21 phẩy 14. Bản đa hình cũng cho khoảng 21 phẩy 14. Hai bản chênh nhau chưa tới một phần trăm nghìn, chỉ vì bản cũ viết tay 3 phẩy 14159 thay cho pi, nên đa hình không đổi kết quả, chỉ đổi nơi đặt cách tính.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp
  checks:
  - '(lambda d: exec(''import abc\nclass Hinh0:\n    def area(self):\n        return 0\nclass LucGiac0(Hinh0):\n    pass\nclass Hinh1:\n    def area(self):\n        raise NotImplementedError\nclass LucGiac1(Hinh1):\n    pass\nclass Hinh2(abc.ABC):\n    @abc.abstractmethod\n    def area(self):\n        pass\nclass LucGiac2(Hinh2):\n    pass\ndef thu(f):\n    try:\n        return f()\n    except Exception as e:\n        return type(e).__name__\n'', d) or (alg.Rect(3, 4).area() + d[''LucGiac0'']().area() == 12 and d[''thu''](lambda: d[''LucGiac1'']().area()) == ''NotImplementedError'' and d[''thu''](lambda: d[''LucGiac2'']()) == ''TypeError''))({})'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Kiểm kiểu bằng chuỗi <code>if isinstance …</code> <b class="red">(thiếu đa hình)</b>

      <br><span class="note">Mỗi chuỗi như vậy là một nơi phải sửa khi thêm loại mới. Chuyển hành vi vào trong lớp.</span></div>

      '
    say: Lỗi thứ nhất, kiểm kiểu bằng một chuỗi câu điều kiện hỏi đối tượng thuộc loại nào. Mỗi chuỗi như vậy là một nơi phải sửa khi thêm loại mới, nên hãy chuyển hành vi vào trong lớp.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Kế thừa chỉ để dùng lại mã <b class="red">(sai quan hệ)</b>

      <br><span class="note">“Ngăn xếp kế thừa danh sách” để dùng lại phép thêm — nhưng ngăn xếp không được cho chèn giữa. Kế thừa chỉ khi lớp con thật sự <b>là một</b> loại của lớp cha, và thay được lớp cha ở mọi chỗ.</span></div>

      '
    say: Lỗi thứ hai, kế thừa chỉ để dùng lại mã, như cho ngăn xếp kế thừa danh sách để dùng lại phép thêm, trong khi ngăn xếp không được phép chèn vào giữa. Chỉ kế thừa khi lớp con thật sự là một loại của lớp cha, và thay được lớp cha ở mọi chỗ.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Cây kế thừa quá sâu <b class="red">(khó hiểu)</b>

      <br><span class="note">Năm, sáu tầng lớp cha: muốn biết một phương thức làm gì phải lần qua cả chuỗi. Giữ cây nông.</span></div>

      '
    say: Lỗi thứ ba, cây kế thừa quá sâu. Có năm, sáu tầng lớp cha thì muốn biết một phương thức làm gì phải lần qua cả chuỗi, nên hãy giữ cây kế thừa nông.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Cho lớp cha một <code>area()</code> mặc định trả 0 “để chạy được trước đã” <b class="red">(sai im lặng)</b></div>

      <table class="t"><tr><th>lớp cha viết</th><th>lục giác quên cài <code>area()</code></th></tr>

      <tr><td><code>return 0</code></td><td class="red">chữ nhật 3 × 4 cộng lục giác = 12, không ai biết thiếu</td></tr>

      <tr><td><code>raise NotImplementedError</code></td><td>báo lỗi khi gọi <code>area()</code> của lục giác</td></tr>

      <tr><td>phương thức trừu tượng (<code>abc.abstractmethod</code>)</td><td>báo lỗi ngay khi tạo đối tượng lục giác</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, cho lớp cha một phép tính diện tích mặc định trả 0, để chương trình chạy được trước đã. Bảng so ba cách viết lớp cha khi lớp lục giác quên cài phép tính diện tích. Trả 0 thì tổng của chữ nhật 3 nhân 4 và lục giác là 12, sai mà không ai biết. Báo lỗi chưa cài đặt thì lỗi lộ ra khi gọi. Khai báo phương thức trừu tượng thì lỗi lộ ra sớm nhất, ngay khi tạo đối tượng, đúng tinh thần thất bại sớm, tức lỗi lộ ra càng gần chỗ gây ra càng tốt.
