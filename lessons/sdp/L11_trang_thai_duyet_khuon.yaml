id: L11
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 11 — Mẫu trạng thái, duyệt và khuôn thuật toán (State, Iterator, Template Method)"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L11; audit/sdp/verify_sdp.py L11; E. Gamma, R. Helm, R. Johnson, J. Vlissides, Design Patterns (1994), chương 5 (Iterator, State, Template Method); Python Language Reference, mục 8.3 (câu lệnh for, sửa dãy khi đang duyệt); SWF bài 8 (máy trạng thái)"
assumes: [arith, cdot]
# Quy ước: tên mẫu tiếng Anh chỉ trên màn hình; lời đọc: State = “mẫu trạng thái”, Iterator = “mẫu duyệt”, Template Method = “mẫu khuôn thuật toán”.
#   alg.ORDER_FLOW: bảng chuyển MỚI –trả tiền→ ĐÃ TRẢ –giao→ ĐÃ GIAO, MỚI/ĐÃ TRẢ –huỷ→ ĐÃ HUỶ; alg.order_state từ chối sự kiện không có trong bảng.
objectives:
  - "Thay chuỗi điều kiện theo trạng thái bằng bảng hoặc lớp trạng thái"
  - "Duyệt tập hợp không lộ cấu trúc bên trong"
  - "Giữ khung thuật toán cố định, cho lớp con điền các bước"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Huỷ đơn đã giao"
    checks:
      - "alg.order_state(['trả tiền', 'giao', 'huỷ']) == ('ĐÃ GIAO', [('ĐÃ GIAO', 'huỷ')])"
    steps:
      - show: |
          <p>Hàm xử lý đơn hàng có 30 câu <code>if trang_thai == …</code> rải khắp nơi. Một nhánh quên kiểm: khách bấm “huỷ” sau khi hàng <b>đã giao</b> — hệ thống hoàn tiền mà không thu hồi hàng.</p>
          <div class="box key">Hôm nay: <b>mẫu trạng thái</b> — gom mọi quy tắc chuyển vào một chỗ; cùng hai mẫu hành vi nữa.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, hàm xử lý đơn hàng có 30 câu điều kiện kiểm trạng thái rải khắp nơi. Một nhánh quên kiểm, khách bấm huỷ sau khi hàng đã giao, và hệ thống hoàn tiền mà không thu hồi hàng. Hôm nay ta học mẫu trạng thái, gom mọi quy tắc chuyển vào một chỗ, cùng hai mẫu hành vi nữa."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: máy trạng thái, tra bảng theo cặp, xoá làm dịch chỉ số"
    checks:
      - "alg.fsm_run({('TẮT', 'nhấn'): 'BẬT', ('BẬT', 'nhấn'): 'TẮT'}, 'TẮT', ['nhấn', 'nhấn', 'nhấn']) == ['TẮT', 'BẬT', 'TẮT', 'BẬT']"
      - "alg.ORDER_FLOW[('MỚI', 'trả tiền')] == 'ĐÃ TRẢ' and ('ĐÃ GIAO', 'huỷ') not in alg.ORDER_FLOW"
      - "(lambda xs: (xs.pop(1), xs, xs[1])[1:])([1, 2, 2, 3]) == ([1, 2, 3], 2) and (lambda xs: (xs.pop(1), xs[2])[1])([1, 2, 2, 3]) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>đang ở</th><th>sự kiện “nhấn”</th></tr><tr><td>TẮT</td><td>BẬT</td></tr><tr><td>BẬT</td><td>TẮT</td></tr></table>
          <p>Bắt đầu TẮT, nhấn 3 lần: TẮT → BẬT → TẮT → $\hl{\text{BẬT}}$.</p>
        focus: [1, "1.2", 2]
        say: "Trước hết, ôn máy trạng thái ở khoá Phần mềm đúng đắn, với ví dụ công tắc đèn. Mỗi lúc đèn ở đúng một trạng thái, và mỗi lần nhấn chuyển nó sang trạng thái kia, như bảng chỉ ra. Bắt đầu từ tắt, nhấn 3 lần thì đèn đi tắt, bật, tắt, bật."
      - show: |
          <div class="code"><div>bang = {("MỚI", "trả tiền"): "ĐÃ TRẢ", ...}</div><div>bang[("MỚI", "trả tiền")]        <span class="cm"># → "ĐÃ TRẢ"</span></div><div>("ĐÃ GIAO", "huỷ") in bang       <span class="cm"># → False: không có ô này</span></div></div>
        focus: [1, 1, 1]
        say: "Thứ hai, trong mã, bảng chuyển là một từ điển mà khoá là một cặp, gồm trạng thái và sự kiện. Tra cặp mới và trả tiền thì được đã trả. Hỏi cặp đã giao và huỷ có trong bảng không thì được sai, vì bảng không có ô đó."
      - show: |
          <table class="t"><tr><th></th><th>chỉ số 0</th><th>chỉ số 1</th><th>chỉ số 2</th><th>chỉ số 3</th></tr>
          <tr><td>trước</td><td>1</td><td>2</td><td>2</td><td>3</td></tr>
          <tr><td>xoá phần tử ở chỉ số 1</td><td>1</td><td>2</td><td>$\hl{3}$</td><td></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Thứ ba, xoá một phần tử làm các phần tử phía sau dịch lên một chỗ. Danh sách 1, 2, 2, 3 ban đầu có số 2 ở chỉ số 2. Xoá phần tử ở chỉ số 1 thì số 2 thứ hai dịch về chỉ số 1, và chỉ số 2 bây giờ là số 3."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: ba mẫu"
    steps:
      - show: |
          <table class="t"><tr><th>mẫu</th><th>làm gì</th></tr>
          <tr><td><b>State</b> (trạng thái)</td><td>mỗi trạng thái là một lớp (hoặc một dòng trong bảng) tự biết sự kiện nào hợp lệ và chuyển sang đâu</td></tr>
          <tr><td><b>Iterator</b> (duyệt)</td><td>đi qua các phần tử bằng <code>for x in tap</code>, không cần biết bên trong là mảng, cây hay tệp</td></tr>
          <tr><td><b>Template Method</b> (khuôn thuật toán)</td><td>lớp cha cố định thứ tự các bước; lớp con chỉ điền từng bước</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng so ba mẫu. Mẫu trạng thái coi mỗi trạng thái là một lớp, hoặc một dòng trong bảng, tự biết sự kiện nào hợp lệ và chuyển sang đâu. Mẫu duyệt cho phép đi qua các phần tử bằng một vòng lặp, không cần biết bên trong là mảng, cây hay tệp. Mẫu khuôn thuật toán để lớp cha cố định thứ tự các bước, lớp con chỉ điền từng bước."

  - id: intuition
    kind: intuition
    title: "Đơn hàng là bốn vòng tròn và các mũi tên"
    steps:
      - show: |
          <div><svg width="1500" height="440" viewBox="0 0 1500 440"><defs><marker id="arD11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><circle cx="230" cy="130" r="78" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="230" y="139" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">MỚI</text><circle cx="750" cy="130" r="78" fill="#fef08a" stroke="#1f2937" stroke-width="3"/><text x="750" y="139" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">ĐÃ TRẢ</text><circle cx="1270" cy="130" r="78" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><text x="1270" y="139" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">ĐÃ GIAO</text><circle cx="490" cy="320" r="78" fill="#fecaca" stroke="#1f2937" stroke-width="3"/><text x="490" y="329" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">ĐÃ HUỶ</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="310" y1="130" x2="668" y2="130" marker-end="url(#arD11)"/><line x1="830" y1="130" x2="1188" y2="130" marker-end="url(#arD11)"/><line x1="285" y1="187" x2="420" y2="280" marker-end="url(#arD11)"/><line x1="695" y1="187" x2="560" y2="280" marker-end="url(#arD11)"/></g><g font-size="22" text-anchor="middle" fill="#1f2937"><text x="490" y="115">trả tiền</text><text x="1010" y="115">giao</text><text x="320" y="255">huỷ</text><text x="660" y="255">huỷ</text></g><path d="M1270,210 C1270,330 900,360 580,335" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="12 10"/><text x="1060" y="392" font-size="22" text-anchor="middle" fill="#b91c1c">không có mũi tên “huỷ” từ ĐÃ GIAO</text><text x="1060" y="424" font-size="22" text-anchor="middle" fill="#b91c1c">→ sự kiện bị từ chối, đơn giữ nguyên</text></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ bảng chuyển của đơn hàng, mỗi trạng thái là một vòng tròn, mỗi quy tắc là một mũi tên có tên sự kiện. Từ mới có hai lối ra, trả tiền và huỷ, từ đã trả cũng có hai, giao và huỷ. Đường đỏ đứt nét nhắc rằng từ đã giao không hề có mũi tên huỷ, nên sự kiện huỷ ở đó bị từ chối và đơn giữ nguyên."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Bảng chuyển trạng thái đơn hàng"
    checks:
      - "sum(1 for f in ['MỚI', 'ĐÃ TRẢ', 'ĐÃ GIAO'] for t in ['MỚI', 'ĐÃ TRẢ', 'ĐÃ GIAO'] if any(s == f and v == t for (s, e), v in alg.ORDER_FLOW.items())) == 2"
      - "alg.order_state(['trả tiền', 'huỷ', 'giao']) == ('ĐÃ HUỶ', [('ĐÃ HUỶ', 'giao')])"
    steps:
      - show: |
          <table class="t"><tr><th>từ ↓ / đến →</th><th>MỚI</th><th>ĐÃ TRẢ</th><th>ĐÃ GIAO</th></tr>
          <tr><td><b>MỚI</b></td><td>—</td><td class="green">trả tiền</td><td>—</td></tr>
          <tr><td><b>ĐÃ TRẢ</b></td><td>—</td><td>—</td><td class="green">giao</td></tr>
          <tr><td><b>ĐÃ GIAO</b></td><td>—</td><td>—</td><td>—</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước một, bảng ghi các chuyển tiếp hợp lệ giữa ba trạng thái chính. Từ mới, sự kiện trả tiền chuyển sang đã trả. Từ đã trả, sự kiện giao chuyển sang đã giao. Từ đã giao thì không chuyển tiến đi đâu nữa."
      - show: |
          <p><b>Bước 2</b> — đếm: $3 \cdot 3 = 9$ cặp (từ, đến), chỉ $\hl{2}$ ô xanh là chuyển tiến hợp lệ. Thêm: MỚI và ĐÃ TRẢ được “huỷ” → ĐÃ HUỶ; ĐÃ GIAO thì <b>không</b>.</p>
        say: "Bước hai, trong 3 nhân 3 bằng 9 cặp trạng thái, chỉ có 2 chuyển tiến hợp lệ. Ngoài ra, đơn mới và đơn đã trả được huỷ, đơn đã giao thì không."
      - clear: true
        show: |
          <p><b>Bước 3</b> — chạy đơn ở đầu bài: trả tiền, giao, huỷ.</p>
          <table class="t"><tr><th>đang ở</th><th>sự kiện</th><th>có trong bảng?</th><th>sau đó</th></tr>
          <tr><td>MỚI</td><td>trả tiền</td><td>có</td><td>ĐÃ TRẢ</td></tr>
          <tr><td>ĐÃ TRẢ</td><td>giao</td><td>có</td><td>ĐÃ GIAO</td></tr>
          <tr><td>ĐÃ GIAO</td><td>huỷ</td><td class="red">không → từ chối</td><td>$\hl{\text{ĐÃ GIAO}}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, chạy lại đơn hàng ở đầu bài với ba sự kiện trả tiền, giao, huỷ. Mới gặp trả tiền, có trong bảng, sang đã trả. Đã trả gặp giao, có trong bảng, sang đã giao. Đã giao gặp huỷ, không có trong bảng, nên bị từ chối, đơn giữ nguyên đã giao và không ai được hoàn tiền nhầm."
      - show: |
          <p><b>Bước 4</b> — đổi thứ tự: trả tiền, huỷ, giao → ĐÃ TRẢ → ĐÃ HUỶ → “giao” bị từ chối, đơn ở $\hl{\text{ĐÃ HUỶ}}$.</p>
          <div class="box key">Sự kiện không có trong bảng ở trạng thái hiện tại → <b>từ chối</b>, giữ nguyên. Một chỗ duy nhất quyết định, không còn nhánh nào “quên kiểm”.</div>
        focus: [1, 1, 2, 2]
        say: "Bước bốn, đổi thứ tự thành trả tiền, huỷ, giao. Đơn sang đã trả, rồi đã huỷ, và sự kiện giao bị từ chối, đơn ở lại đã huỷ. Sự kiện không có trong bảng ở trạng thái hiện tại sẽ bị từ chối và giữ nguyên trạng thái. Chỉ một chỗ duy nhất quyết định, nên không còn nhánh nào quên kiểm."

  - id: check
    kind: check
    title: "Tự kiểm: cho máy chạy mọi dãy ba sự kiện"
    checks:
      - "(lambda seqs: len(seqs) == 27 and sum(any(a == 'ĐÃ GIAO' and b == 'ĐÃ HUỶ' for a, b in zip(st, st[1:])) for st in [[alg.order_state(list(s[:i]))[0] for i in range(4)] for s in seqs]) == 0)(list(__import__('itertools').product(['trả tiền', 'giao', 'huỷ'], repeat=3)))"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>mọi dãy 3 sự kiện từ 3 loại: $3 \cdot 3 \cdot 3$</td><td>27 lần chạy</td></tr>
          <tr><td>số lần thấy ĐÃ GIAO đi ngay sang ĐÃ HUỶ</td><td>0 ✓ — khớp kết luận đọc bảng</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, cho máy chạy mọi dãy ba sự kiện, mỗi sự kiện chọn trong ba loại, tức 3 nhân 3 nhân 3 bằng 27 lần chạy. Không lần nào đơn đi từ đã giao sang đã huỷ, khớp kết luận đọc bảng. Chạy thử chỉ phủ dãy ngắn, còn đọc bảng thì phủ mọi dãy, nên hai cách bổ sung cho nhau."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda xs: ([xs.remove(x) for x in xs if x % 2 == 0], xs)[1])([1, 2, 2, 3]) == [1, 2, 3]"
      - "2 ** 3 == 8"
      - "(lambda d: exec('def run(cond):\\n    import itertools\\n    bad = 0\\n    for seq in sorted(set(itertools.permutations(\"AABB\"))):\\n        st, seen, ok = \"ĐÃ TRẢ\", {}, {}\\n        for p in seq:\\n            if p not in seen:\\n                seen[p] = st\\n            else:\\n                ev, new = {\"A\": (\"giao\", \"ĐÃ GIAO\"), \"B\": (\"huỷ\", \"ĐÃ HUỶ\")}[p]\\n                if ((st if cond else seen[p]), ev) in FLOW:\\n                    st, ok[p] = new, True\\n        bad += bool(ok.get(\"A\") and ok.get(\"B\"))\\n    return bad\\n', d) or (d['run'](False), d['run'](True)) == (4, 0) and len(set(__import__('itertools').permutations('AABB'))) == 6)({'FLOW': alg.ORDER_FLOW})"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Sửa tập hợp trong lúc đang duyệt <b class="red">(bỏ sót)</b>
          <br><span class="note">Xoá số chẵn khỏi <code>[1, 2, 2, 3]</code> trong lúc duyệt chính nó còn lại <code>[1, 2, 3]</code>: xoá một phần tử làm phần tử sau dịch lên, vòng lặp bước qua nó. Duyệt trên bản sao, hoặc tạo danh sách mới.</span></div>
        say: "Lỗi thứ nhất, sửa tập hợp trong lúc đang duyệt. Xoá số chẵn khỏi danh sách 1, 2, 2, 3 trong lúc duyệt chính nó thì còn lại 1, 2, 3. Lý do là xoá một phần tử làm phần tử sau dịch lên, và vòng lặp bước qua nó. Hãy duyệt trên một bản sao, hoặc tạo danh sách mới."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Trạng thái lưu bằng nhiều cờ rời <b class="red">(tổ hợp vô nghĩa)</b>
          <br><span class="note"><code>da_tra</code>, <code>da_giao</code>, <code>da_huy</code> là ba cờ → 8 tổ hợp, nhiều tổ hợp vô nghĩa (đã huỷ và đã giao). Một biến trạng thái chỉ cho phép đúng các giá trị hợp lệ.</span></div>
        say: "Lỗi thứ hai, lưu trạng thái bằng nhiều cờ rời nhau. Ba cờ đã trả, đã giao, đã huỷ cho 8 tổ hợp, nhiều tổ hợp vô nghĩa như vừa đã huỷ vừa đã giao. Một biến trạng thái duy nhất chỉ cho phép đúng các giá trị hợp lệ."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Khuôn thuật toán cho lớp con đổi cả thứ tự bước <b class="red">(vỡ khung)</b>
          <br><span class="note">Lớp con chỉ được điền bước; nếu lớp con ghi đè cả hàm khung, bất biến “kiểm quyền trước khi ghi” có thể mất.</span></div>
        say: "Lỗi thứ ba, khuôn thuật toán mà cho lớp con đổi cả thứ tự các bước. Lớp con chỉ được điền từng bước, nếu nó ghi đè cả hàm khung thì bất biến như kiểm quyền trước khi ghi có thể bị mất."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Hai yêu cầu cùng lúc: “đọc trạng thái, tra bảng, rồi ghi” <b class="red">(bảng đúng mà vẫn sai)</b></div>
          <table class="t"><tr><th>đơn ĐÃ TRẢ; A gửi “giao”, B gửi “huỷ”</th><th>số thứ tự xen kẽ</th><th>cả hai cùng được chấp nhận</th></tr>
          <tr><td>mỗi bên tra bảng theo trạng thái <b>mình đã đọc</b></td><td>6</td><td class="red">4</td></tr>
          <tr><td>ghi có điều kiện: chỉ ghi nếu trạng thái <b>lúc ghi</b> vẫn hợp lệ</td><td>6</td><td>0</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 2]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, bảng chuyển đúng nhưng hai yêu cầu tới cùng lúc. Đơn đang ở đã trả, yêu cầu A gửi giao, yêu cầu B gửi huỷ, mỗi bên đọc trạng thái, tra bảng, rồi mới ghi. Nếu mỗi bên tra theo trạng thái mình đã đọc, thì trong 6 thứ tự xen kẽ có 4 thứ tự cả hai cùng được chấp nhận, hàng vừa giao vừa hoàn tiền. Nếu chỉ ghi khi trạng thái lúc ghi vẫn hợp lệ, số đó về 0. Người làm nghề gộp bước tra và bước ghi thành một thao tác không thể chen ngang."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.order_state(['giao', 'trả tiền', 'huỷ']) == ('ĐÃ HUỶ', [('MỚI', 'giao')])"
      - "(lambda ys: ([ys.remove(y) for y in ys if y % 2 == 0], ys)[1])([2, 4, 6, 7]) == [4, 7]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Đơn mới nhận lần lượt: giao, trả tiền, huỷ. Sự kiện nào bị từ chối? Trạng thái cuối?</td></tr>
          <tr><td>2</td><td>Xoá số chẵn khỏi <code>[2, 4, 6, 7]</code> trong lúc duyệt chính nó: còn lại gì?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, đơn mới nhận lần lượt các sự kiện giao, trả tiền, huỷ. Sự kiện nào bị từ chối, và trạng thái cuối là gì? Câu hai, xoá số chẵn khỏi danh sách 2, 4, 6, 7 trong lúc duyệt chính nó thì còn lại gì? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>đang ở</th><th>sự kiện</th><th>có trong bảng?</th><th>sau đó</th></tr>
          <tr><td>MỚI</td><td>giao</td><td class="red">không → từ chối</td><td>MỚI</td></tr>
          <tr><td>MỚI</td><td>trả tiền</td><td>có</td><td>ĐÃ TRẢ</td></tr>
          <tr><td>ĐÃ TRẢ</td><td>huỷ</td><td>có</td><td>$\hl{\text{ĐÃ HUỶ}}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, tra bảng từng sự kiện. Sự kiện giao khi đơn còn mới không có trong bảng, nên bị từ chối, đơn vẫn mới. Trả tiền chuyển sang đã trả. Rồi huỷ chuyển sang đã huỷ."
      - clear: true
        show: |
          <table class="t"><tr><th>vòng</th><th>chỉ số</th><th>danh sách lúc đó</th><th>thấy</th><th>làm gì</th></tr>
          <tr><td>1</td><td>0</td><td>[2, 4, 6, 7]</td><td>2</td><td>xoá → [4, 6, 7]; số 4 dịch về chỉ số 0</td></tr>
          <tr><td>2</td><td>1</td><td>[4, 6, 7]</td><td>6</td><td>xoá → [4, 7]; số 7 dịch về chỉ số 1</td></tr>
          <tr><td>3</td><td>2</td><td>[4, 7]</td><td colspan="2">hết danh sách → dừng, còn $\hl{[4, 7]}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, chạy vòng lặp bằng tay, ghi chỉ số từng vòng. Vòng một ở chỉ số 0 thấy số 2, xoá đi, số 4 dịch về chỉ số 0 nên bị bỏ qua. Vòng hai ở chỉ số 1 thấy số 6, xoá đi, số 7 dịch về chỉ số 1 nên cũng bị bỏ qua. Vòng ba ở chỉ số 2 đã hết danh sách, nên dừng, còn lại 4 và 7, trong đó số chẵn 4 vẫn sót."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">trạng thái: một bảng chuyển, từ chối sự kiện lạ</span><span class="a">→</span>
          <span class="n">duyệt: không lộ cấu trúc, không sửa khi đang duyệt</span><span class="a">→</span>
          <span class="n">khuôn: cố định thứ tự, điền từng bước</span></div>
        say: "Tổng kết lại, mẫu trạng thái gom quy tắc vào một bảng chuyển và từ chối sự kiện lạ. Mẫu duyệt không lộ cấu trúc bên trong, và đừng sửa tập hợp khi đang duyệt. Mẫu khuôn thuật toán cố định thứ tự, chỉ điền từng bước."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi quy tắc rải ở nhiều nơi, lỗi nằm ở nơi bị quên. Hãy gom quy tắc về <b>một chỗ</b> mà máy có thể kiểm hết.</div>
        say: "Điều cần mang theo, khi quy tắc rải ở nhiều nơi thì lỗi nằm ở nơi bị quên. Hãy gom quy tắc về một chỗ mà máy có thể kiểm hết."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>kỹ thuật hàm</b> — hàm thuần, bất biến, ghi nhớ.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học các kỹ thuật hàm, gồm hàm thuần, dữ liệu bất biến, và ghi nhớ kết quả. Hẹn gặp bạn ở bài tiếp theo."
