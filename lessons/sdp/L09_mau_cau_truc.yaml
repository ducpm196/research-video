- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">bộ chuyển đổi: giao diện khác → giao diện cần</span><span class="a">→</span>

      <span class="n">bọc thêm: cùng giao diện, thêm hành vi</span><span class="a">→</span>

      <span class="n">cây hợp thành: lá và nhóm cùng giao diện</span></div>

      '
    say: Tổng kết lại, bộ chuyển đổi biến giao diện khác thành giao diện cần dùng. Bọc thêm giữ cùng giao diện và thêm hành
      vi, còn cây hợp thành cho lá và nhóm cùng một giao diện. Bộ chuyển đổi cách ly khác biệt hãng ngoài, lớp trang trí xếp
      chồng hành vi động và thành phần cây thống nhất đệ quy. Bộ chuyển đổi làm cầu nối hãng ngoài, lớp trang trí xếp chồng
      tính năng mới còn thành phần cây xử lý đệ quy.
  - show: '<div class="box key"><b>Tư duy:</b> cả ba mẫu đều dựa trên một ý — <b>bọc</b> đối tượng sau một giao diện, để nơi
      dùng không cần biết bên trong có gì.</div>

      '
    say: Điều cần mang theo, cả ba mẫu đều dựa trên một ý, bọc đối tượng sau một giao diện, để nơi dùng không cần biết bên
      trong có gì. Giữ lớp trang trí đúng thứ tự thực thi và giữ bộ chuyển đổi mỏng gọn bảo đảm cấu trúc dự án luôn thông
      thoáng.
  - clear: true
    show: '<p class="note">Bài sau (bài 10): <b>mẫu hành vi</b> — chiến lược, người quan sát, lệnh.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 10, ta học các mẫu hành vi, gồm mẫu chiến lược, mẫu người quan sát, và mẫu lệnh. Hẹn gặp bạn ở bài
      tiếp theo. Khi bài toán chuyển sang điều phối thuật toán, thông báo sự kiện và lịch sử thao tác, nhóm mẫu hành vi phát
      huy toàn bộ sức mạnh.
