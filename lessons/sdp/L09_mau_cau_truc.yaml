id: L09
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 9 — Mẫu cấu trúc: Adapter, Decorator, Composite"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L09; audit/sdp/verify_sdp.py L09; E. Gamma, R. Helm, R. Johnson, J. Vlissides, Design Patterns (1994), chương 4 (Adapter, Composite, Decorator)"
assumes: [arith, cdot, frac]
# Quy ước: tên mẫu tiếng Anh chỉ trên màn hình; lời đọc: Adapter = “mẫu bộ chuyển đổi”, Decorator = “mẫu bọc thêm”, Composite = “mẫu cây hợp thành”.
#   alg.CelsiusAdapter bọc alg.FahrenheitSensor (98,6 °F), làm tròn 1 chữ số; alg.AddOn bọc alg.Coffee; alg.Folder/alg.File cho kích thước (MB).
objectives:
  - "Bọc giao diện cũ bằng mẫu bộ chuyển đổi"
  - "Xếp chồng hành vi bằng mẫu bọc thêm"
  - "Xử lý cây bằng mẫu cây hợp thành"
asr_reviewed:
  - {sentence: "Lớp đổi sang độ C nhận cảm biến cũ và giữ nó bên trong.", reason: "ASR chép “Lớp đổi sang độ sẽ nhận…”: chữ C đọc tên chữ cái “xê”, ASR viết thành “sẽ” (tên chữ cái kiểu Việt, như x → “ích”); phần còn lại khớp (0,929) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cảm biến nói độ F, chương trình cần độ C"
    checks:
      - "alg.FahrenheitSensor().read_f() == 98.6 and alg.CelsiusAdapter(alg.FahrenheitSensor()).read_c() == 37.0"
    steps:
      - show: |
          <p>Thư viện cảm biến mua ngoài chỉ có <code>read_f()</code> trả 98,6 (độ F). Toàn bộ chương trình của bạn gọi <code>read_c()</code> và hiểu là độ C. Không sửa được thư viện; không muốn sửa hàng trăm chỗ gọi.</p>
          <div class="box key">Hôm nay: ba <b>mẫu cấu trúc</b> — cách ghép các đối tượng lại với nhau mà không sửa chúng.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, thư viện cảm biến mua ngoài chỉ có hàm đọc độ F, trả về 98 phẩy 6. Toàn bộ chương trình của bạn lại gọi hàm đọc độ C. Bạn không sửa được thư viện, và không muốn sửa hàng trăm chỗ gọi. Hôm nay ta học ba mẫu cấu trúc, cách ghép các đối tượng lại với nhau mà không phải sửa chúng."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đối tượng giữ đối tượng, đổi độ, đệ quy"
    checks:
      - "(lambda d: exec('class Hop:\\n    def __init__(self, ben_trong):\\n        self.bt = ben_trong\\n    def gia(self):\\n        return self.bt.gia() + 4\\nclass Banh:\\n    def gia(self):\\n        return 10\\n', d) or d['Hop'](d['Banh']()).gia() == 14)({})"
      - "(50 - 32) * 5 / 9 == 10 and 50 - 32 == 18 and 18 * 5 == 90"
      - "(lambda f: f(f, [1, [2, 3]]) == 6)(lambda f, x: sum(f(f, y) for y in x) if isinstance(x, list) else x)"
    steps:
      - show: |
          <div class="code"><div>class Banh:</div><div>    def gia(self): return 10</div><div>class Hop:</div><div>    def __init__(self, ben_trong): self.bt = ben_trong</div><div>    def gia(self): return self.bt.gia() + 4</div></div>
          <p><code>Hop(Banh()).gia()</code> → hộp hỏi bánh: $10$, rồi cộng 4 → $\hl{14}$.</p>
        focus: [1, 1, 2]
        say: "Trước hết, ôn một ý dùng suốt bài, một đối tượng có thể giữ một đối tượng khác bên trong. Lớp hộp nhận cái bánh khi tạo ra, và khi hỏi giá, hộp hỏi giá cái bánh rồi cộng thêm 4. Bánh giá 10, nên hộp có bánh giá 14, việc hỏi tiếp vào trong như vậy gọi là uỷ thác."
      - show: |
          <table class="t"><tr><th>độ F</th><th>trừ 32</th><th>nhân 5 rồi chia 9</th><th>độ C</th></tr>
          <tr><td>50</td><td>18</td><td>90 : 9</td><td>$\hl{10}$</td></tr></table>
        focus: [1, "1.2"]
        say: "Thứ hai, công thức đổi độ F sang độ C là lấy độ F trừ 32, rồi nhân 5 chia 9. Ví dụ 50 độ F trừ 32 còn 18, nhân 5 được 90, chia 9 được 10 độ C."
      - show: |
          <table class="t"><tr><th>danh sách lồng</th><th>tính</th><th>tổng</th></tr>
          <tr><td><code>[1, [2, 3]]</code></td><td>$1 + (2 + 3)$</td><td>$\hl{6}$</td></tr></table>
          <p class="note">Gặp một số thì lấy số; gặp một danh sách thì gọi lại chính hàm đó cho từng phần tử — đó là <b>đệ quy</b>.</p>
        focus: [1, "1.2", 2]
        say: "Thứ ba, ôn đệ quy. Danh sách 1 và một danh sách con 2, 3 có tổng là 1 cộng với 2 cộng 3, bằng 6. Gặp một số thì lấy số, gặp một danh sách thì gọi lại chính hàm đó cho từng phần tử, đó là đệ quy."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: ba mẫu cấu trúc"
    steps:
      - show: |
          <table class="t"><tr><th>mẫu</th><th>làm gì</th></tr>
          <tr><td><b>Adapter</b> (bộ chuyển đổi)</td><td>bọc một đối tượng có giao diện <b>khác</b>, đưa ra giao diện mình cần</td></tr>
          <tr><td><b>Decorator</b> (bọc thêm)</td><td>bọc một đối tượng có giao diện <b>giống</b>, thêm hành vi trước hoặc sau</td></tr>
          <tr><td><b>Composite</b> (cây hợp thành)</td><td>nút lá và nút nhóm có <b>cùng</b> giao diện; nhóm gọi xuống các con</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng so ba mẫu cấu trúc. Mẫu bộ chuyển đổi bọc một đối tượng có giao diện khác, và đưa ra giao diện mà mình cần. Mẫu bọc thêm bọc một đối tượng có giao diện giống hệt, rồi thêm hành vi trước hoặc sau. Mẫu cây hợp thành cho nút lá và nút nhóm cùng một giao diện, nút nhóm chỉ việc gọi xuống các con."

  - id: intuition
    kind: intuition
    title: "Ba cách bọc, nhìn bằng hình"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arD9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937"><text x="230" y="36">bộ chuyển đổi</text><text x="730" y="36">bọc thêm</text><text x="1210" y="36">cây hợp thành</text></g><rect x="110" y="70" width="240" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="230" y="108" font-size="22" text-anchor="middle" fill="#1f2937">chương trình</text><rect x="90" y="190" width="280" height="70" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="230" y="233" font-size="22" text-anchor="middle" fill="#1f2937">DoiSangC: read_c()</text><rect x="110" y="320" width="240" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="230" y="358" font-size="22" text-anchor="middle" fill="#1f2937">cảm biến: read_f()</text><g stroke="#1f2937" stroke-width="3"><line x1="230" y1="130" x2="230" y2="186" marker-end="url(#arD9)"/><line x1="230" y1="260" x2="230" y2="316" marker-end="url(#arD9)"/></g><g font-size="20" fill="#1f2937"><text x="245" y="165">gọi read_c</text><text x="245" y="295">gọi read_f: 98,6</text></g><rect x="520" y="70" width="420" height="300" rx="14" fill="#fef3c7" stroke="#eb6834" stroke-width="3"/><rect x="560" y="130" width="340" height="200" rx="14" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><rect x="610" y="200" width="240" height="80" rx="14" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><g font-size="22" text-anchor="middle" fill="#1f2937"><text x="730" y="105">đường: +2</text><text x="730" y="165">sữa: +5</text><text x="730" y="248">cà phê: 30</text></g><text x="730" y="410" font-size="22" text-anchor="middle" fill="#059669">giá() đi vào trong, cộng dần ra ngoài: 37</text><rect x="1130" y="70" width="160" height="56" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1210" y="106" font-size="22" text-anchor="middle" fill="#1f2937">gốc: 220</text><rect x="1000" y="200" width="110" height="56" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1055" y="236" font-size="22" text-anchor="middle" fill="#1f2937">120</text><rect x="1130" y="200" width="110" height="56" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1185" y="236" font-size="22" text-anchor="middle" fill="#1f2937">30</text><rect x="1260" y="200" width="160" height="56" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1340" y="236" font-size="22" text-anchor="middle" fill="#1f2937">con: 70</text><rect x="1230" y="330" width="100" height="56" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1280" y="366" font-size="22" text-anchor="middle" fill="#1f2937">50</text><rect x="1350" y="330" width="100" height="56" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1400" y="366" font-size="22" text-anchor="middle" fill="#1f2937">20</text><g stroke="#1f2937" stroke-width="3"><line x1="1180" y1="126" x2="1060" y2="196" marker-end="url(#arD9)"/><line x1="1200" y1="126" x2="1190" y2="196" marker-end="url(#arD9)"/><line x1="1230" y1="126" x2="1330" y2="196" marker-end="url(#arD9)"/><line x1="1320" y1="256" x2="1285" y2="326" marker-end="url(#arD9)"/><line x1="1350" y1="256" x2="1390" y2="326" marker-end="url(#arD9)"/></g><text x="1210" y="420" font-size="22" text-anchor="middle" fill="#059669">ô cam là nhóm, ô xanh là lá</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đặt ba mẫu cạnh nhau. Bên trái, chương trình gọi bộ chuyển đổi, bộ chuyển đổi gọi tiếp cảm biến cũ, tức là một lớp đứng giữa để dịch giao diện. Ở giữa, các hộp lồng nhau, lời gọi tính giá đi vào tận cà phê rồi cộng dần ra ngoài, nên ra 37. Bên phải là cây, ô cam là nhóm, ô xanh là lá, và mỗi nhóm cộng kích thước của các con nó."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Ba mẫu, ba con số"
    checks:
      - "alg.CelsiusAdapter(alg.FahrenheitSensor()).read_c() == 37.0 and abs((98.6 - 32) * 5 / 9 - 37.0) < 1e-9"
      - "alg.AddOn(alg.AddOn(alg.Coffee(), 5), 2).cost() == 37"
      - "alg.Folder(alg.File(120), alg.File(30), alg.Folder(alg.File(50), alg.File(20))).size() == 220"
    steps:
      - show: |
          <div class="code"><div>class DoiSangC:                              <span class="cm"># bộ chuyển đổi</span></div><div>    def __init__(self, cam_bien): self.cb = cam_bien</div><div>    def read_c(self): return round((self.cb.read_f() - 32) * 5 / 9, 1)</div></div>
          <p><b>Bước 1</b> — hỏi cảm biến cũ: $98{,}6$; trừ 32: $98{,}6 - 32 = \hl{66{,}6}$.</p>
        focus: [1, 1, 2]
        say: "Lớp đổi sang độ C nhận cảm biến cũ và giữ nó bên trong. Bước một, hàm đọc độ C gọi hàm đọc độ F rồi đổi đơn vị và làm tròn. Đầu tiên nó hỏi cảm biến cũ được 98 phẩy 6, trừ 32 còn 66 phẩy 6."
      - show: |
          <p><b>Bước 2</b> — $66{,}6 \cdot \frac{5}{9} = \hl{37{,}0}$ °C. Hàng trăm chỗ gọi <code>read_c()</code> giữ nguyên.</p>
        introduces: [frac]
        say: "Bước hai, lấy 66 phẩy 6 nhân 5 phần 9, được 37 phẩy 0 độ C. Hàng trăm chỗ gọi hàm đọc độ C giữ nguyên không đổi."
      - show: |
          <p><b>Bước 3</b> — bọc thêm: <code>Duong(Sua(CaPhe()))</code>, mọi lớp đều có <code>gia()</code>.</p>
          <table class="t"><tr><th>lớp</th><th>làm gì</th><th>giá trả ra</th></tr>
          <tr><td>cà phê (trong cùng)</td><td>giá gốc</td><td>30</td></tr>
          <tr><td>sữa</td><td>hỏi bên trong rồi +5</td><td>35</td></tr>
          <tr><td>đường (ngoài cùng)</td><td>hỏi bên trong rồi +2</td><td>$\hl{37}$ nghìn</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, mẫu bọc thêm, đường bọc sữa, sữa bọc cà phê, và lớp nào cũng có cùng phép tính giá. Cà phê trong cùng trả giá gốc 30. Sữa hỏi bên trong được 30, cộng 5 thành 35. Đường hỏi bên trong được 35, cộng 2 thành 37 nghìn."
      - clear: true
        show: |
          <p><b>Bước 4</b> — cây hợp thành: thư mục chứa tệp 120 MB, tệp 30 MB và một thư mục con (50 MB + 20 MB).</p>
          <table class="t"><tr><th>nút</th><th>gọi <code>size()</code> xuống</th><th>kết quả</th></tr>
          <tr><td>thư mục con</td><td>$50 + 20$</td><td>70</td></tr>
          <tr><td>gốc</td><td>$120 + 30 + 70$</td><td>$\hl{220}$ MB</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước bốn, mẫu cây hợp thành, một thư mục chứa tệp 120 MB, tệp 30 MB, và một thư mục con gồm 50 và 20 MB. Thư mục con cộng hai tệp của nó được 70. Gốc cộng 120, 30 và 70, được 220 MB, chỉ cần một lời gọi tính kích thước ở gốc, nó tự đi xuống mọi nút."

  - id: check
    kind: check
    title: "Tự kiểm: đi ngược và liệt kê"
    checks:
      - "abs(37.0 * 9 / 5 + 32 - 98.6) < 1e-9"
      - "alg.AddOn(alg.AddOn(alg.Coffee(), 2), 5).cost() == 37 == alg.AddOn(alg.AddOn(alg.Coffee(), 5), 2).cost()"
      - "sum([120, 30, 50, 20]) == 220"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác</th><th>kết quả</th></tr>
          <tr><td>37,0 °C</td><td>đổi ngược: $37 \cdot \frac{9}{5} + 32$</td><td>98,6 °F ✓</td></tr>
          <tr><td>37 nghìn</td><td>đổi thứ tự bọc: sữa ngoài, đường trong</td><td>vẫn 37 ✓ (chỉ có phép cộng)</td></tr>
          <tr><td>220 MB</td><td>liệt kê mọi lá: 120, 30, 50, 20</td><td>cộng thẳng 220 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác cho cả ba con số. Đổi ngược 37 độ C, nhân 9 phần 5 rồi cộng 32, được đúng 98 phẩy 6 độ F. Đổi thứ tự bọc, sữa ngoài đường trong, vẫn ra 37, vì hai lớp chỉ cộng thêm. Liệt kê mọi lá của cây, 120, 30, 50, 20, cộng thẳng cũng được 220."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda d: exec('class F:\\n    def __init__(self, *k):\\n        self.k = k\\n    def size(self):\\n        V[0] += 1\\n        return sum(c.size() for c in self.k)\\nclass T:\\n    def size(self):\\n        V[0] += 1\\n        return 1\\ndef run():\\n    f4 = F(T())\\n    f3 = F(T(), f4)\\n    f2 = F(T(), f3)\\n    f1 = F(T(), f2)\\n    tot = 0\\n    for f in (f1, f2, f3, f4):\\n        V[0] = 0\\n        f.size()\\n        tot += V[0]\\n    V[0] = 0\\n    f1.size()\\n    return tot, V[0]\\n', d) or d['run']() == (20, 8) and 2 + 4 + 6 + 8 == 20)({'V': [0]})"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bọc thêm lồng quá sâu <b class="red">(khó gỡ lỗi)</b>
          <br><span class="note">Năm, sáu lớp bọc: lỗi nằm ở tầng nào phải lần qua từng lớp. Và <b>thứ tự bọc</b> có thể đổi kết quả: giảm 10% rồi cộng phí 5 khác cộng phí 5 rồi giảm 10%.</span></div>
        say: "Lỗi thứ nhất, bọc thêm lồng quá sâu. Có năm, sáu lớp bọc thì lỗi nằm ở tầng nào phải lần qua từng lớp. Thứ tự bọc cũng có thể đổi kết quả, giảm 10 phần trăm rồi cộng phí 5 khác với cộng phí 5 rồi mới giảm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Bộ chuyển đổi làm luôn nghiệp vụ <b class="red">(lấn việc)</b>
          <br><span class="note">Bộ chuyển đổi chỉ <b>dịch</b> giao diện (đổi đơn vị, đổi tên hàm). Thêm logic cảnh báo sốt vào đó là trộn hai trách nhiệm.</span></div>
        say: "Lỗi thứ hai, để bộ chuyển đổi làm luôn nghiệp vụ. Bộ chuyển đổi chỉ dịch giao diện, như đổi đơn vị hay đổi tên hàm, thêm logic cảnh báo sốt vào đó là trộn hai trách nhiệm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Cây hợp thành có chu trình <b class="red">(lặp vô hạn)</b>
          <br><span class="note">Thư mục A chứa B, B chứa lại A: <code>size()</code> đệ quy không dừng. Kiểm không có chu trình khi thêm con.</span></div>
        say: "Lỗi thứ ba, cây hợp thành có chu trình. Thư mục A chứa B, B lại chứa A, thì phép tính kích thước đệ quy mãi không dừng, nên phải kiểm không có chu trình khi thêm con."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Màn hình hiện kích thước <b>từng</b> thư mục bằng cách gọi <code>size()</code> ở mỗi thư mục <b class="red">(đếm lại cây con nhiều lần)</b></div>
          <table class="t"><tr><th>4 thư mục lồng nhau, mỗi cái 1 tệp</th><th>số nút phải ghé</th></tr>
          <tr><td>gọi <code>size()</code> riêng ở từng thư mục</td><td>$2 + 4 + 6 + 8 = 20$</td></tr>
          <tr><td>một lượt từ dưới lên, nhớ kết quả từng thư mục</td><td>8</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 2]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, màn hình cần hiện kích thước của từng thư mục, và ai đó gọi phép tính kích thước ở mỗi thư mục một lần. Mỗi lời gọi lại đi hết cây con bên dưới, nên cây con bị đếm đi đếm lại. Với 4 thư mục lồng nhau, mỗi cái có một tệp, cách đó ghé 2 cộng 4 cộng 6 cộng 8, bằng 20 nút. Một lượt duy nhất từ dưới lên, nhớ kết quả từng thư mục, chỉ ghé 8 nút. Cây càng sâu, khoảng cách càng lớn, nên người làm nghề tính một lượt rồi lưu lại."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.Folder(alg.File(10), alg.Folder(alg.File(5), alg.Folder(alg.File(3), alg.File(2)))).size() == 20"
      - "round((212 - 32) * 5 / 9, 1) == 100.0 and 212 - 32 == 180"
      - "3 + 2 == 5 and 5 + 5 == 10 and 10 + 10 == 20"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cảm biến trả 212 độ F: bộ chuyển đổi cho bao nhiêu độ C?</td></tr>
          <tr><td>2</td><td>Thư mục gốc: tệp 10, và thư mục con gồm tệp 5 cùng một thư mục cháu (tệp 3, tệp 2). Kích thước gốc?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cảm biến trả 212 độ F, bộ chuyển đổi cho bao nhiêu độ C? Câu hai, thư mục gốc có tệp 10, và một thư mục con gồm tệp 5 cùng một thư mục cháu có tệp 3 và tệp 2, kích thước gốc là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>bước</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>trừ 32</td><td>$212 - 32$</td><td>180</td></tr>
          <tr><td>nhân 5 phần 9</td><td>$180 \cdot \frac{5}{9}$</td><td>$\hl{100{,}0}$ °C</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, làm theo đúng hai bước của bộ chuyển đổi. 212 trừ 32 được 180. 180 nhân 5 phần 9 được 100 độ C, đúng điểm sôi của nước."
      - show: |
          <table class="t"><tr><th>nút (từ dưới lên)</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>thư mục cháu</td><td>$3 + 2$</td><td>5</td></tr>
          <tr><td>thư mục con</td><td>$5 + 5$</td><td>10</td></tr>
          <tr><td>gốc</td><td>$10 + 10$</td><td>$\hl{20}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, tính từ dưới lên như lời gọi đệ quy trả về. Thư mục cháu có 3 cộng 2 bằng 5. Thư mục con có tệp 5 cộng thư mục cháu 5, bằng 10. Gốc có tệp 10 cộng thư mục con 10, bằng 20."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bộ chuyển đổi: giao diện khác → giao diện cần</span><span class="a">→</span>
          <span class="n">bọc thêm: cùng giao diện, thêm hành vi</span><span class="a">→</span>
          <span class="n">cây hợp thành: lá và nhóm cùng giao diện</span></div>
        say: "Tổng kết lại, bộ chuyển đổi biến giao diện khác thành giao diện cần dùng. Bọc thêm giữ cùng giao diện và thêm hành vi, còn cây hợp thành cho lá và nhóm cùng một giao diện."
      - show: |
          <div class="box key"><b>Tư duy:</b> cả ba mẫu đều dựa trên một ý — <b>bọc</b> đối tượng sau một giao diện, để nơi dùng không cần biết bên trong có gì.</div>
        say: "Điều cần mang theo, cả ba mẫu đều dựa trên một ý, bọc đối tượng sau một giao diện, để nơi dùng không cần biết bên trong có gì."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>mẫu hành vi</b> — chiến lược, người quan sát, lệnh.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học các mẫu hành vi, gồm mẫu chiến lược, mẫu người quan sát, và mẫu lệnh. Hẹn gặp bạn ở bài tiếp theo."
