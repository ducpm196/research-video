scenes:
- id: hook
  kind: hook
  title: Cảm biến nói độ F, chương trình cần độ C
  checks:
  - alg.FahrenheitSensor().read_f() == 98.6 and alg.CelsiusAdapter(alg.FahrenheitSensor()).read_c() == 37.0
  steps:
  - show: '<p>Thư viện cảm biến mua ngoài chỉ có <code>read_f()</code> trả 98,6 (độ F). Toàn bộ chương trình của bạn gọi <code>read_c()</code>
      và hiểu là độ C. Không sửa được thư viện; không muốn sửa hàng trăm chỗ gọi.</p>

      <div class="box key">Hôm nay: ba <b>mẫu cấu trúc</b> — cách ghép các đối tượng lại với nhau mà không sửa chúng.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, thư viện cảm biến mua ngoài chỉ có hàm đọc độ F, trả về 98 phẩy 6. Toàn bộ chương trình của bạn lại gọi
      hàm đọc độ C. Bạn không sửa được thư viện, và không muốn sửa hàng trăm chỗ gọi. Hôm nay ta học ba mẫu cấu trúc, cách
      ghép các đối tượng lại với nhau mà không phải sửa chúng. Cần tích hợp cổng vận chuyển bên thứ ba mang giao diện hoàn
      toàn khác chuẩn nội bộ hoặc gắn thêm lớp bộ đệm lẫn nén dữ liệu mà không sửa lớp lõi.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: đối tượng giữ đối tượng, đổi độ, đệ quy'
  checks:
  - '(lambda d: exec(''class Hop:\n    def __init__(self, ben_trong):\n        self.bt = ben_trong\n    def gia(self):\n        return
    self.bt.gia() + 4\nclass Banh:\n    def gia(self):\n        return 10\n'', d) or d[''Hop''](d[''Banh'']()).gia() == 14)({})'
  - (50 - 32) * 5 / 9 == 10 and 50 - 32 == 18 and 18 * 5 == 90
  - '(lambda f: f(f, [1, [2, 3]]) == 6)(lambda f, x: sum(f(f, y) for y in x) if isinstance(x, list) else x)'
  steps:
  - show: '<div class="code"><div>class Banh:</div><div>    def gia(self): return 10</div><div>class Hop:</div><div>    def
      __init__(self, ben_trong): self.bt = ben_trong</div><div>    def gia(self): return self.bt.gia() + 4</div></div>

      <p><code>Hop(Banh()).gia()</code> → hộp hỏi bánh: $10$, rồi cộng 4 → $\hl{14}$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Trước hết, ôn một ý dùng suốt bài, một đối tượng có thể giữ một đối tượng khác bên trong. Lớp hộp nhận cái bánh khi
      tạo ra, và khi hỏi giá, hộp hỏi giá cái bánh rồi cộng thêm 4. Bánh giá 10, nên hộp có bánh giá 14, việc hỏi tiếp vào
      trong như vậy gọi là uỷ thác. Mẫu bộ chuyển đổi dịch chuẩn lời gọi từ giao diện kỳ vọng nội bộ sang định dạng của thư
      viện ngoài giữ lõi nghiệp vụ miễn nhiễm thay đổi hãng cung cấp.
  - show: '<table class="t"><tr><th>độ F</th><th>trừ 32</th><th>nhân 5 rồi chia 9</th><th>độ C</th></tr>

      <tr><td>50</td><td>18</td><td>90 : 9</td><td>$\hl{10}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    say: Thứ hai, công thức đổi độ F sang độ C là lấy độ F trừ 32, rồi nhân 5 chia 9. Ví dụ 50 độ F trừ 32 còn 18, nhân 5
      được 90, chia 9 được 10 độ C. Mẫu lớp trang trí bọc quanh một thành phần qua đúng giao diện chung để cộng thêm hành
      vi mới như đệm, thử lại hay đo thời gian theo từng lớp xếp chồng.
  - show: '<table class="t"><tr><th>danh sách lồng</th><th>tính</th><th>tổng</th></tr>

      <tr><td><code>[1, [2, 3]]</code></td><td>$1 + (2 + 3)$</td><td>$\hl{6}$</td></tr></table>

      <p class="note">Gặp một số thì lấy số; gặp một danh sách thì gọi lại chính hàm đó cho từng phần tử — đó là <b>đệ quy</b>.</p>

      '
    focus:
    - 1
    - '1.2'
    - 2
    - 2
    say: Thứ ba, ôn đệ quy. Danh sách 1 và một danh sách con 2, 3 có tổng là 1 cộng với 2 cộng 3, bằng 6. Gặp một số thì lấy
      số, gặp một danh sách thì gọi lại chính hàm đó cho từng phần tử, đó là đệ quy. Mẫu thành phần hợp nhất đối xử đồng nhất
      với cả lá đơn lẻ lẫn nhánh chứa tập con tạo nên cấu trúc cây đệ quy siêu gọn gàng.
- id: sym
  kind: symbol
  title: 'Giải mã: ba mẫu cấu trúc'
  steps:
  - show: '<table class="t"><tr><th>mẫu</th><th>làm gì</th></tr>

      <tr><td><b>Adapter</b> (bộ chuyển đổi)</td><td>bọc một đối tượng có giao diện <b>khác</b>, đưa ra giao diện mình cần</td></tr>

      <tr><td><b>Decorator</b> (bọc thêm)</td><td>bọc một đối tượng có giao diện <b>giống</b>, thêm hành vi trước hoặc sau</td></tr>

      <tr><td><b>Composite</b> (cây hợp thành)</td><td>nút lá và nút nhóm có <b>cùng</b> giao diện; nhóm gọi xuống các con</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Bảng so ba mẫu cấu trúc. Mẫu bộ chuyển đổi bọc một đối tượng có giao diện khác, và đưa ra giao diện mà mình cần.
      Mẫu bọc thêm bọc một đối tượng có giao diện giống hệt, rồi thêm hành vi trước hoặc sau. Mẫu cây hợp thành cho nút lá
      và nút nhóm cùng một giao diện, nút nhóm chỉ việc gọi xuống các con. Điểm phân biệt sắc nét giữa bộ chuyển đổi và lớp
      trang trí nằm ở chỗ chuyển đổi thay đổi hình dạng giao diện còn trang trí giữ nguyên giao diện để nâng cấp hành vi.
