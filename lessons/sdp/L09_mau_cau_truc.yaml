      x1="1320" y1="256" x2="1285" y2="326" marker-end="url(#arD9)"/><line x1="1350" y1="256" x2="1390" y2="326" marker-end="url(#arD9)"/></g><text
      x="1210" y="420" font-size="22" text-anchor="middle" fill="#059669">ô cam là nhóm, ô xanh là lá</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình đặt ba mẫu cạnh nhau. Bên trái, chương trình gọi bộ chuyển đổi, bộ chuyển đổi gọi tiếp cảm biến cũ, tức là một
      lớp đứng giữa để dịch giao diện. Ở giữa, các hộp lồng nhau, lời gọi tính giá đi vào tận cà phê rồi cộng dần ra ngoài,
      nên ra 37. Bên phải là cây, ô cam là nhóm, ô xanh là lá, và mỗi nhóm cộng kích thước của các con nó. Ổ cắm du lịch đổi
      chân dẹt sang tròn chính là bộ chuyển đổi. Vỏ chống nước bọc máy ảnh giữ nguyên nút bấm là lớp trang trí. Thư mục chứa
      cả tệp lẫn thư mục con là thành phần cây.
- id: example
  kind: example
  title: Ba mẫu, ba con số
  checks:
  - alg.CelsiusAdapter(alg.FahrenheitSensor()).read_c() == 37.0 and abs((98.6 - 32) * 5 / 9 - 37.0) < 1e-9
  - alg.AddOn(alg.AddOn(alg.Coffee(), 5), 2).cost() == 37
  - alg.Folder(alg.File(120), alg.File(30), alg.Folder(alg.File(50), alg.File(20))).size() == 220
  steps:
  - show: '<div class="code"><div>class DoiSangC:                              <span class="cm"># bộ chuyển đổi</span></div><div>    def
      __init__(self, cam_bien): self.cb = cam_bien</div><div>    def read_c(self): return round((self.cb.read_f() - 32) *
      5 / 9, 1)</div></div>

      <p><b>Bước 1</b> — hỏi cảm biến cũ: $98{,}6$; trừ 32: $98{,}6 - 32 = \hl{66{,}6}$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    say: Lớp đổi sang độ C nhận cảm biến cũ và giữ nó bên trong. Bước một, hàm đọc độ C gọi hàm đọc độ F rồi đổi đơn vị và
      làm tròn. Đầu tiên nó hỏi cảm biến cũ được 98 phẩy 6, trừ 32 còn 66 phẩy 6.
  - show: '<p><b>Bước 2</b> — $66{,}6 \cdot \frac{5}{9} = \hl{37{,}0}$ °C. Hàng trăm chỗ gọi <code>read_c()</code> giữ nguyên.</p>

      '
    introduces:
    - frac
    say: Bước hai, lấy 66 phẩy 6 nhân 5 phần 9, được 37 phẩy 0 độ C. Hàng trăm chỗ gọi hàm đọc độ C giữ nguyên không đổi.
  - show: '<p><b>Bước 3</b> — bọc thêm: <code>Duong(Sua(CaPhe()))</code>, mọi lớp đều có <code>gia()</code>.</p>

      <table class="t"><tr><th>lớp</th><th>làm gì</th><th>giá trả ra</th></tr>

      <tr><td>cà phê (trong cùng)</td><td>giá gốc</td><td>30</td></tr>

      <tr><td>sữa</td><td>hỏi bên trong rồi +5</td><td>35</td></tr>

      <tr><td>đường (ngoài cùng)</td><td>hỏi bên trong rồi +2</td><td>$\hl{37}$ nghìn</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    say: Bước ba, mẫu bọc thêm, đường bọc sữa, sữa bọc cà phê, và lớp nào cũng có cùng phép tính giá. Cà phê trong cùng trả
      giá gốc 30. Sữa hỏi bên trong được 30, cộng 5 thành 35. Đường hỏi bên trong được 35, cộng 2 thành 37 nghìn.
  - clear: true
    show: '<p><b>Bước 4</b> — cây hợp thành: thư mục chứa tệp 120 MB, tệp 30 MB và một thư mục con (50 MB + 20 MB).</p>

      <table class="t"><tr><th>nút</th><th>gọi <code>size()</code> xuống</th><th>kết quả</th></tr>

      <tr><td>thư mục con</td><td>$50 + 20$</td><td>70</td></tr>

      <tr><td>gốc</td><td>$120 + 30 + 70$</td><td>$\hl{220}$ MB</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    say: Bước bốn, mẫu cây hợp thành, một thư mục chứa tệp 120 MB, tệp 30 MB, và một thư mục con gồm 50 và 20 MB. Thư mục
      con cộng hai tệp của nó được 70. Gốc cộng 120, 30 và 70, được 220 MB, chỉ cần một lời gọi tính kích thước ở gốc, nó
      tự đi xuống mọi nút.
- id: check
  kind: check
  title: 'Tự kiểm: đi ngược và liệt kê'
  checks:
  - abs(37.0 * 9 / 5 + 32 - 98.6) < 1e-9
  - alg.AddOn(alg.AddOn(alg.Coffee(), 2), 5).cost() == 37 == alg.AddOn(alg.AddOn(alg.Coffee(), 5), 2).cost()
  - sum([120, 30, 50, 20]) == 220
  steps:
  - show: '<table class="t"><tr><th>con số</th><th>đường khác</th><th>kết quả</th></tr>

      <tr><td>37,0 °C</td><td>đổi ngược: $37 \cdot \frac{9}{5} + 32$</td><td>98,6 °F ✓</td></tr>

      <tr><td>37 nghìn</td><td>đổi thứ tự bọc: sữa ngoài, đường trong</td><td>vẫn 37 ✓ (chỉ có phép cộng)</td></tr>

      <tr><td>220 MB</td><td>liệt kê mọi lá: 120, 30, 50, 20</td><td>cộng thẳng 220 ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Kiểm bằng đường khác cho cả ba con số. Đổi ngược 37 độ C, nhân 9 phần 5 rồi cộng 32, được đúng 98 phẩy 6 độ F. Đổi
      thứ tự bọc, sữa ngoài đường trong, vẫn ra 37, vì hai lớp chỉ cộng thêm. Liệt kê mọi lá của cây, 120, 30, 50, 20, cộng
      thẳng cũng được 220. Cả ba mẫu cấu trúc đều giữ nguyên đối tượng bên trong và chỉ đặt thêm lớp vỏ bọc phù hợp với cách
      nơi gọi đang sử dụng.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp
  checks:
  - '(lambda d: exec(''class F:\n    def __init__(self, *k):\n        self.k = k\n    def size(self):\n        V[0] += 1\n        return
