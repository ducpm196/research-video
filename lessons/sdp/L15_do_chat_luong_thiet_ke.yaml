id: L15
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 15 — Đo chất lượng thiết kế: liên kết, gắn kết, độ bất ổn"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L15; audit/sdp/verify_sdp.py L15; W. P. Stevens, G. J. Myers, L. L. Constantine, Structured Design, IBM Systems Journal 13(2), 1974 (liên kết, gắn kết); R. C. Martin, Agile Software Development (2002), chương 20 (độ bất ổn, nguyên lý phụ thuộc ổn định); C. Goodhart (1975) (định luật Goodhart)"
assumes: [arith, frac, approx]
# Quy ước: C_a = số mô-đun bên ngoài phụ thuộc VÀO mô-đun đang xét (afferent); C_e = số mô-đun mà mô-đun đang xét phụ thuộc (efferent).
#   Độ bất ổn I = C_e / (C_a + C_e) ∈ [0, 1] (alg.instability). Lời đọc không đọc ký hiệu: “số mô-đun dựa vào nó”, “số mô-đun nó dựa vào”.
objectives:
  - "Phân biệt liên kết và gắn kết"
  - "Tính độ bất ổn"
  - "Áp nguyên lý phụ thuộc ổn định"
asr_reviewed:
  - {sentence: "Trước hết, ôn phân số ra số thập phân.", reason: "ASR chép “Trước hết, ông phần số ra số thập phân.” (0.778): lệch âm/thanh thuần Việt: ôn phân/ông phần — NOT_VERIFIED bằng tai người"}
  - {sentence: "Z chỉ sang W, nên có 1 mũi tên đi ra, tức Z dựa vào một mô-đun.", reason: "ASR chép “Giác chỉ sang về đúc nên có một mũi tên đi ra tức giác dựa vào một mô đun.” (0.919): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Sửa một mô-đun, 20 mô-đun phải biên dịch lại"
    steps:
      - show: |
          <p>Mô-đun “tiện ích” được 20 mô-đun khác dùng, và chính nó lại phụ thuộc vào cơ sở dữ liệu, mạng, giao diện. Đổi một dòng trong mô-đun giao diện → tiện ích đổi → cả 20 mô-đun phải kiểm lại.</p>
          <div class="box key">Hôm nay: <b>đo</b> thiết kế bằng con số — liên kết, gắn kết, và <b>độ bất ổn</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, mô-đun tiện ích được 20 mô-đun khác dùng, và chính nó lại phụ thuộc vào cơ sở dữ liệu, mạng và giao diện. Đổi một dòng trong mô-đun giao diện thì tiện ích đổi theo, và cả 20 mô-đun phải kiểm lại. Hôm nay ta học cách đo thiết kế bằng con số, với liên kết, gắn kết, và độ bất ổn."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phân số ra số thập phân, đếm mũi tên"
    checks:
      - "Fraction(1, 4) == Fraction(25, 100) and Fraction(3, 4) == Fraction(75, 100) and Fraction(2, 4) == Fraction(1, 2)"
      - "(lambda E: (sum(v == 'Z' for u, v in E), sum(u == 'Z' for u, v in E)))([('X', 'Z'), ('Y', 'Z'), ('Z', 'W')]) == (2, 1)"
    steps:
      - show: |
          <table class="t"><tr><th>phân số</th><th>số thập phân</th></tr>
          <tr><td>$\frac{1}{4}$</td><td>0,25</td></tr>
          <tr><td>$\frac{2}{4} = \frac{1}{2}$</td><td>0,5</td></tr>
          <tr><td>$\frac{3}{4}$</td><td>0,75</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Trước hết, ôn phân số ra số thập phân. Một phần tư bằng 0 phẩy 25. Hai phần tư rút gọn thành một phần hai, bằng 0 phẩy 5. Ba phần tư bằng 0 phẩy 75."
      - show: |
          <table class="t"><tr><th>mũi tên “A → B” nghĩa là A dùng B</th><th>đếm cho Z</th></tr>
          <tr><td>X → Z, Y → Z</td><td>2 mũi tên <b>đi vào</b> Z: hai mô-đun dựa vào Z</td></tr>
          <tr><td>Z → W</td><td>1 mũi tên <b>đi ra</b> từ Z: Z dựa vào một mô-đun</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Tiếp theo, ta vẽ phụ thuộc bằng mũi tên, A chỉ sang B nghĩa là A dùng B. X và Y cùng chỉ vào Z, nên có 2 mũi tên đi vào Z, tức hai mô-đun dựa vào Z. Z chỉ sang W, nên có 1 mũi tên đi ra, tức Z dựa vào một mô-đun."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: liên kết, gắn kết, độ bất ổn"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th><th>mong muốn</th></tr>
          <tr><td><b>liên kết</b></td><td>mức các mô-đun phụ thuộc <b>lẫn nhau</b></td><td>thấp</td></tr>
          <tr><td><b>gắn kết</b></td><td>mức các phần <b>bên trong</b> một mô-đun cùng phục vụ một mục đích</td><td>cao</td></tr></table>
          <p>$C_a$: số mô-đun <b>dựa vào</b> nó. $C_e$: số mô-đun nó <b>dựa vào</b>. Độ bất ổn $I = \frac{C_e}{C_a + C_e}$, từ 0 (rất ổn định) đến 1 (rất bất ổn).</p>
        introduces: [sub]
        focus: [1, "1.2", "1.3", 2, 2, 2]
        say: "Bảng so hai khái niệm. Liên kết là mức các mô-đun phụ thuộc lẫn nhau, ta muốn nó thấp. Gắn kết là mức các phần bên trong một mô-đun cùng phục vụ một mục đích, ta muốn nó cao. Ký hiệu C với chỉ số a là số mô-đun dựa vào nó, C với chỉ số e là số mô-đun mà nó dựa vào. Độ bất ổn I bằng số mô-đun nó dựa vào chia cho tổng hai số đó. I chạy từ 0, rất ổn định, đến 1, rất bất ổn."

  - id: intuition
    kind: intuition
    title: "Mũi tên vào và mũi tên ra"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arD15b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><defs><marker id="arD15o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="85" y="38" width="230" height="64" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="200" y="79" font-size="26" text-anchor="middle" fill="#1f2937">đơn hàng</text><rect x="85" y="158" width="230" height="64" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="200" y="199" font-size="26" text-anchor="middle" fill="#1f2937">hoá đơn</text><rect x="85" y="278" width="230" height="64" rx="12" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="200" y="319" font-size="26" text-anchor="middle" fill="#1f2937">báo cáo</text><rect x="625" y="150" width="250" height="80" rx="12" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="750" y="199" font-size="26" text-anchor="middle" fill="#1f2937">tính thuế</text><rect x="1140" y="158" width="260" height="64" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1270" y="199" font-size="26" text-anchor="middle" fill="#1f2937">lõi nghiệp vụ</text><g fill="none" stroke="#2a78d6" stroke-width="4"><line x1="315" y1="80" x2="622" y2="170" marker-end="url(#arD15b)"/><line x1="315" y1="190" x2="622" y2="190" marker-end="url(#arD15b)"/><line x1="315" y1="300" x2="622" y2="210" marker-end="url(#arD15b)"/></g><line x1="875" y1="190" x2="1137" y2="190" stroke="#eb6834" stroke-width="4" marker-end="url(#arD15o)"/><g font-size="24" text-anchor="middle"><text x="470" y="370" fill="#2a78d6">3 mũi tên đi vào: 3 mô-đun dựa vào nó</text><text x="1005" y="165" fill="#eb6834">1 mũi tên đi ra</text><text x="750" y="415" fill="#1f2937" font-weight="bold">độ bất ổn I = 1 / (3 + 1) = 0,25</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ mô-đun tính thuế cùng các mũi tên phụ thuộc quanh nó. Ba mũi tên xanh đi vào, từ đơn hàng, hoá đơn và báo cáo, nghĩa là ba mô-đun dựa vào tính thuế. Một mũi tên cam đi ra, tới lõi nghiệp vụ, nghĩa là tính thuế dựa vào một mô-đun. Độ bất ổn chỉ hỏi trong các mũi tên chạm vào nó, bao nhiêu phần là mũi tên đi ra, ở đây là 1 trên 4."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Tính độ bất ổn"
    checks:
      - "alg.instability(3, 1) == 0.25 and Fraction(1, 3 + 1) == Fraction(1, 4)"
      - "alg.instability(0, 4) == 1.0 and alg.instability(5, 0) == 0.0"
    steps:
      - show: |
          <p><b>Bước 1</b> — đếm mũi tên đi vào “tính thuế”: đơn hàng, hoá đơn, báo cáo → $C_a = \hl{3}$.</p>
          <p><b>Bước 2</b> — đếm mũi tên đi ra: chỉ tới lõi nghiệp vụ → $C_e = \hl{1}$.</p>
        focus: [1, 1, 2]
        say: "Bước một, đếm mũi tên đi vào mô-đun tính thuế. Có đơn hàng, hoá đơn và báo cáo, nên số mô-đun dựa vào nó bằng 3. Bước hai, đếm mũi tên đi ra, chỉ có một mũi tên tới lõi nghiệp vụ, nên số mô-đun nó dựa vào bằng 1."
      - show: |
          $$I = \frac{C_e}{C_a + C_e} = \frac{1}{3 + 1} = \hl{0{,}25}$$
          <p><b>Bước 3</b> — khá ổn định: nhiều nơi dựa vào, nên đổi nó tốn kém, và nó ít lý do bị đổi theo người khác.</p>
        focus: [1, 2, 2]
        say: "Bước ba, thay vào công thức, I bằng 1 chia 3 cộng 1, tức 0 phẩy 25, khá ổn định. Nhiều nơi dựa vào nên đổi nó tốn kém. Ngược lại, nó chỉ dựa vào một mô-đun, nên ít lý do bị đổi theo người khác."
      - show: |
          <p><b>Bước 4</b> — hai trường hợp biên:</p>
          <table class="t"><tr><th>mô-đun</th><th>$C_a$</th><th>$C_e$</th><th>$I$</th></tr>
          <tr><td>giao diện người dùng</td><td>0</td><td>4</td><td>$\frac{4}{0 + 4} = 1$</td></tr>
          <tr><td>quy tắc nghiệp vụ lõi</td><td>5</td><td>0</td><td>$\frac{0}{5 + 0} = 0$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước bốn, xét hai trường hợp biên. Giao diện người dùng không ai dựa vào và dựa vào 4 mô-đun, nên I bằng 4 chia 4, bằng 1, rất bất ổn. Quy tắc nghiệp vụ lõi được 5 mô-đun dựa vào và không dựa vào ai, nên I bằng 0, rất ổn định."
      - clear: true
        show: |
          <table class="t"><tr><th>quyết định</th><th>vì sao</th></tr>
          <tr><td>giao diện (I = 1) được phép dựa vào tính thuế (I = 0,25)</td><td>mũi tên đi từ I lớn sang I nhỏ</td></tr>
          <tr><td>tính thuế (0,25) dựa vào lõi (0)</td><td>vẫn đi xuống</td></tr>
          <tr><td>lõi (0) <b>không</b> được dựa vào giao diện (1)</td><td>mũi tên sẽ đi lên</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Từ ba con số, ta ra quyết định về chiều mũi tên. Giao diện có I bằng 1 được phép dựa vào tính thuế có I bằng 0 phẩy 25, vì mũi tên đi từ I lớn sang I nhỏ. Tính thuế dựa vào lõi cũng đi xuống, nên đúng. Còn lõi không được dựa vào giao diện, vì mũi tên khi đó sẽ đi lên."

  - id: check
    kind: check
    title: "Tự kiểm: đếm lại trên cả hệ thống"
    checks:
      - "(lambda E: {m: (sum(v == m for u, v in E), sum(u == m for u, v in E)) for m in ('GD', 'DH', 'HD', 'BC', 'TT', 'LOI')})([('GD', 'DH'), ('GD', 'HD'), ('GD', 'BC'), ('GD', 'LOI'), ('DH', 'TT'), ('HD', 'TT'), ('BC', 'TT'), ('TT', 'LOI'), ('DH', 'LOI'), ('HD', 'LOI'), ('BC', 'LOI')]) == {'GD': (0, 4), 'DH': (1, 2), 'HD': (1, 2), 'BC': (1, 2), 'TT': (3, 1), 'LOI': (5, 0)} and len([('GD', 'DH'), ('GD', 'HD'), ('GD', 'BC'), ('GD', 'LOI'), ('DH', 'TT'), ('HD', 'TT'), ('BC', 'TT'), ('TT', 'LOI'), ('DH', 'LOI'), ('HD', 'LOI'), ('BC', 'LOI')]) == 11"
      - "(lambda m: [alg.instability(*m[k]) for k in ('GD', 'DH', 'TT', 'LOI')] == [1.0, 2 / 3, 0.25, 0.0])((lambda E: {m: (sum(v == m for u, v in E), sum(u == m for u, v in E)) for m in ('GD', 'DH', 'HD', 'BC', 'TT', 'LOI')})([('GD', 'DH'), ('GD', 'HD'), ('GD', 'BC'), ('GD', 'LOI'), ('DH', 'TT'), ('HD', 'TT'), ('BC', 'TT'), ('TT', 'LOI'), ('DH', 'LOI'), ('HD', 'LOI'), ('BC', 'LOI')]))"
      - "(lambda m, E: all(alg.instability(*m[u]) >= alg.instability(*m[v]) for u, v in E))((lambda E: {m: (sum(v == m for u, v in E), sum(u == m for u, v in E)) for m in ('GD', 'DH', 'HD', 'BC', 'TT', 'LOI')})([('GD', 'DH'), ('GD', 'HD'), ('GD', 'BC'), ('GD', 'LOI'), ('DH', 'TT'), ('HD', 'TT'), ('BC', 'TT'), ('TT', 'LOI'), ('DH', 'LOI'), ('HD', 'LOI'), ('BC', 'LOI')]), [('GD', 'DH'), ('GD', 'HD'), ('GD', 'BC'), ('GD', 'LOI'), ('DH', 'TT'), ('HD', 'TT'), ('BC', 'TT'), ('TT', 'LOI'), ('DH', 'LOI'), ('HD', 'LOI'), ('BC', 'LOI')])"
    steps:
      - show: |
          <p>Cả hệ thống có 11 mũi tên. Đếm thẳng từ danh sách mũi tên, mỗi mô-đun một dòng:</p>
          <table class="t"><tr><th>mô-đun</th><th>mũi tên vào</th><th>mũi tên ra</th><th>$I$</th></tr>
          <tr><td>giao diện</td><td>0</td><td>4</td><td>1</td></tr>
          <tr><td>đơn hàng, hoá đơn, báo cáo (mỗi cái)</td><td>1</td><td>2</td><td>$\frac{2}{3} \approx 0{,}67$</td></tr>
          <tr><td>tính thuế</td><td>3</td><td>1</td><td>0,25 ✓</td></tr>
          <tr><td>lõi nghiệp vụ</td><td>5</td><td>0</td><td>0 ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Kiểm bằng đường khác, ta dựng cả hệ thống 6 mô-đun với 11 mũi tên, rồi đếm thẳng từ danh sách mũi tên. Giao diện có 0 mũi tên vào, 4 mũi tên ra, I bằng 1. Đơn hàng, hoá đơn, báo cáo mỗi cái có 1 vào, 2 ra, I bằng hai phần ba, xấp xỉ 0 phẩy 67. Tính thuế có 3 vào, 1 ra, đúng 0 phẩy 25. Lõi có 5 vào, 0 ra, đúng bằng 0, nên khớp với các bước trước."
      - show: |
          <table class="t"><tr><th>chiều mũi tên</th><th>I đi từ → tới</th></tr>
          <tr><td>giao diện → đơn hàng</td><td>1 → 0,67</td></tr>
          <tr><td>đơn hàng → tính thuế</td><td>0,67 → 0,25</td></tr>
          <tr><td>tính thuế → lõi</td><td>0,25 → 0</td></tr>
          <tr><td>cả 11 mũi tên</td><td>đều đi từ I lớn hơn hoặc bằng sang I nhỏ hơn ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Rồi dò từng mũi tên theo nguyên lý phụ thuộc ổn định. Giao diện sang đơn hàng, I giảm từ 1 xuống 0 phẩy 67. Đơn hàng sang tính thuế, giảm xuống 0 phẩy 25. Tính thuế sang lõi, giảm xuống 0. Máy dò cả 11 mũi tên, không mũi tên nào đi lên, nên hệ thống này đúng chiều."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda E: (lambda m: round(sum(alg.instability(*m[k]) for k in m) / 6, 2) == 0.54 and round(alg.instability(*m['LOI']), 2) == 0.17 and alg.instability(*m['GD']) == 0.8 and [(u, v) for u, v in E if alg.instability(*m[u]) < alg.instability(*m[v])] == [('LOI', 'GD')])((lambda E: {m: (sum(v == m for u, v in E), sum(u == m for u, v in E)) for m in ('GD', 'DH', 'HD', 'BC', 'TT', 'LOI')})(E)))([('GD', 'DH'), ('GD', 'HD'), ('GD', 'BC'), ('GD', 'LOI'), ('DH', 'TT'), ('HD', 'TT'), ('BC', 'TT'), ('TT', 'LOI'), ('DH', 'LOI'), ('HD', 'LOI'), ('BC', 'LOI')] + [('LOI', 'GD')])"
      - "(lambda m: round(sum(alg.instability(*m[k]) for k in m) / 6, 2) == 0.54)((lambda E: {m: (sum(v == m for u, v in E), sum(u == m for u, v in E)) for m in ('GD', 'DH', 'HD', 'BC', 'TT', 'LOI')})([('GD', 'DH'), ('GD', 'HD'), ('GD', 'BC'), ('GD', 'LOI'), ('DH', 'TT'), ('HD', 'TT'), ('BC', 'TT'), ('TT', 'LOI'), ('DH', 'LOI'), ('HD', 'LOI'), ('BC', 'LOI')]))"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Mô-đun ổn định phụ thuộc vào mô-đun bất ổn <b class="red">(ngược chiều)</b>
          <br><span class="note"><b>Nguyên lý phụ thuộc ổn định</b>: phụ thuộc theo chiều $I$ <b>giảm</b>. Lõi nghiệp vụ ($I = 0$) dựa vào giao diện ($I = 1$) thì mỗi lần đổi giao diện lõi cũng phải đổi. Đảo phụ thuộc bằng giao diện trừu tượng (bài 7).</span></div>
        say: "Lỗi thứ nhất, để mô-đun ổn định phụ thuộc vào mô-đun bất ổn. Nguyên lý phụ thuộc ổn định nói nên phụ thuộc theo chiều I giảm dần. Lõi nghiệp vụ có I bằng 0 mà dựa vào giao diện có I bằng 1, thì mỗi lần đổi giao diện lõi cũng phải đổi. Hãy đảo phụ thuộc bằng giao diện trừu tượng như bài 7."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tối ưu con số thay vì thiết kế <b class="red">(định luật Goodhart)</b>
          <br><span class="note">“Khi một độ đo trở thành mục tiêu, nó không còn là độ đo tốt.” Gộp mọi thứ vào một mô-đun khổng lồ làm $C_e$ về 0 mà gắn kết sụp đổ. Độ đo là tín hiệu để xem xét.</span></div>
        say: "Lỗi thứ hai, tối ưu con số thay vì tối ưu thiết kế. Khi một độ đo trở thành mục tiêu, nó không còn là độ đo tốt. Gộp mọi thứ vào một mô-đun khổng lồ làm số phụ thuộc ra ngoài về 0, nhưng gắn kết sụp đổ, nên độ đo chỉ là tín hiệu để xem xét."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Mô-đun “tiện ích” chứa mọi thứ <b class="red">(gắn kết thấp)</b>
          <br><span class="note">Định dạng ngày, gửi thư, tính thuế chung một mô-đun: chúng không phục vụ cùng mục đích, và mọi nơi đều phải dựa vào cả khối. Tách theo mục đích.</span></div>
        say: "Lỗi thứ ba, một mô-đun tiện ích chứa mọi thứ. Định dạng ngày, gửi thư, tính thuế chung một mô-đun thì không phục vụ cùng mục đích, và mọi nơi đều phải dựa vào cả khối, nên hãy tách theo mục đích."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Theo dõi I trung bình của cả hệ thống trên bảng báo cáo <b class="red">(che mất mũi tên ngược)</b>
          <br><span class="note">Thêm một mũi tên lõi → giao diện vào hệ thống 6 mô-đun ở trên.</span></div>
          <table class="t"><tr><th></th><th>trước</th><th>sau</th></tr>
          <tr><td>I trung bình 6 mô-đun</td><td>0,54</td><td>0,54</td></tr>
          <tr><td>số mũi tên đi lên</td><td>0</td><td class="red">1: lõi (0,17) → giao diện (0,8)</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 2]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đưa độ bất ổn trung bình của cả hệ thống lên bảng báo cáo rồi chỉ nhìn con số đó. Thử thêm một mũi tên từ lõi sang giao diện vào hệ thống 6 mô-đun ở trên. I trung bình vẫn xấp xỉ 0 phẩy 54, gần như không đổi. Nhưng giờ có một mũi tên đi lên, từ lõi có I khoảng 0 phẩy 17 sang giao diện có I bằng 0 phẩy 8. Người làm nghề kiểm chiều của từng mũi tên một cách tự động, vì con số trung bình không chỉ ra được mũi tên sai nằm ở đâu."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.instability(1, 3) == 0.75 and alg.instability(2, 2) == 0.5"
      - "alg.instability(1, 3) > alg.instability(3, 1)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Mô-đun A: 1 mô-đun dựa vào nó, nó dựa vào 3. Mô-đun B: 2 và 2. Tính $I$ của A và B.</td></tr>
          <tr><td>2</td><td>A phụ thuộc vào mô-đun tính thuế ($I = 0{,}25$). Có đúng chiều không?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, mô-đun A có 1 mô-đun dựa vào nó, và nó dựa vào 3 mô-đun. Mô-đun B có 2 và 2, hãy tính I của A và B. Câu hai, A phụ thuộc vào mô-đun tính thuế có I bằng 0 phẩy 25, có đúng chiều không? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>mô-đun</th><th>$C_a$</th><th>$C_e$</th><th>$I = \frac{C_e}{C_a + C_e}$</th></tr>
          <tr><td>A</td><td>1</td><td>3</td><td>$\frac{3}{1 + 3} = \hl{0{,}75}$</td></tr>
          <tr><td>B</td><td>2</td><td>2</td><td>$\frac{2}{2 + 2} = \hl{0{,}5}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, thay từng mô-đun vào công thức. A dựa vào 3, tổng phụ thuộc là 4, nên I của A bằng 3 chia 4, tức 0 phẩy 75. B dựa vào 2, tổng là 4, nên I của B bằng 2 chia 4, tức 0 phẩy 5."
      - show: |
          <table class="t"><tr><th>mũi tên</th><th>I đi từ → tới</th><th>kết luận</th></tr>
          <tr><td>A → tính thuế</td><td>0,75 → 0,25</td><td><b>đúng chiều</b>: đi xuống</td></tr></table>
        focus: [1, "1.2"]
        say: "Câu hai, xét mũi tên từ A sang tính thuế. I đi từ 0 phẩy 75 xuống 0 phẩy 25, nên đúng chiều, vì A bất ổn hơn đang dựa vào mô-đun ổn định hơn."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">liên kết thấp, gắn kết cao</span><span class="a">→</span>
          <span class="n">$I = \frac{C_e}{C_a + C_e}$</span><span class="a">→</span>
          <span class="n">phụ thuộc theo chiều $I$ giảm</span><span class="a">→</span>
          <span class="n">độ đo là tín hiệu, không phải mục tiêu</span></div>
        say: "Tổng kết lại, ta muốn liên kết thấp và gắn kết cao. Độ bất ổn bằng số mô-đun nó dựa vào chia cho tổng hai loại phụ thuộc. Hãy phụ thuộc theo chiều độ bất ổn giảm, và nhớ độ đo là tín hiệu, không phải mục tiêu."
      - show: |
          <div class="box key"><b>Tư duy:</b> đặt những gì hay đổi ở rìa, những gì ổn định ở lõi — và cho mũi tên phụ thuộc luôn chỉ vào lõi.</div>
        say: "Điều cần mang theo, hãy đặt những gì hay đổi ở rìa, những gì ổn định ở lõi, và cho mũi tên phụ thuộc luôn chỉ vào lõi."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 16): <b>tổng hợp</b> — thiết kế lại giỏ hàng.</p>
        forward_ref: true
        say: "Ở bài sau, bài 16, ta tổng hợp mọi thứ bằng cách thiết kế lại một giỏ hàng. Hẹn gặp bạn ở bài tiếp theo."
