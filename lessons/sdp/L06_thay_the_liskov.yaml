id: L06
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 6 — SOLID 2: nguyên lý thay thế Liskov"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L06; audit/sdp/verify_sdp.py L06; B. Liskov, J. Wing, A Behavioral Notion of Subtyping, ACM TOPLAS 16(6), 1994; R. C. Martin, The Liskov Substitution Principle, C++ Report (1996); SWF bài 0 (tiền, hậu điều kiện)"
assumes: [arith]
# Quy ước: mã minh hoạ Python; lớp chữ nhật đổi được (alg.Rectangle) và hình vuông kế thừa nó (alg.Square); alg.lsp_demo đặt rộng 5 rồi cao 4 và
#   trả diện tích. Tên Liskov chỉ trên màn hình; lời đọc nói “nguyên lý thay thế” (đề xuất năm 1987, chính thức hoá năm 1994).
objectives:
  - "Phát biểu nguyên lý thay thế bằng hợp đồng"
  - "Nhận ra lớp con phá hợp đồng của lớp cha"
  - "Sửa bằng cách đổi thiết kế, không vá bằng kiểm kiểu"
asr_reviewed:
  - {sentence: "Đưa vào một hình vuông thì ra 16.", reason: "ASR chép “đưa vào một hình vuông thị tra 16”: “thì ra” bị nối âm thành “thị tra”, mọi từ nội dung (hình vuông, 16) khớp; độ khớp 0,778 — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hình vuông là hình chữ nhật — vậy mà chương trình sai"
    checks:
      - "alg.lsp_demo(alg.Rectangle) == 20 and alg.lsp_demo(alg.Square) == 16"
    steps:
      - show: |
          <p>Trong toán, hình vuông là một hình chữ nhật. Vậy cho lớp <code>Vuong</code> kế thừa <code>ChuNhat</code>. Một hàm nhận chữ nhật: đặt rộng 5, đặt cao 4, mong diện tích 20. Đưa vào một hình vuông: ra $\hl{16}$.</p>
          <div class="box key">Hôm nay: <b>nguyên lý thay thế</b> — lớp con phải dùng được ở <b>mọi</b> chỗ lớp cha được dùng.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, trong toán học, hình vuông là một hình chữ nhật, vậy ta cho lớp hình vuông kế thừa lớp hình chữ nhật. Một hàm nhận hình chữ nhật, đặt chiều rộng 5, đặt chiều cao 4, và mong diện tích 20. Đưa vào một hình vuông thì ra 16. Hôm nay ta học nguyên lý thay thế, lớp con phải dùng được ở mọi chỗ mà lớp cha được dùng."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hợp đồng của một hàm, và lớp con ghi đè"
    checks:
      - "(lambda a: (a.rut(30), a.balance)[1])(alg.Account(100)) == 70 and 100 - 30 == 70"
      - "(lambda s: (s.set_w(5), (s.w, s.h))[1])(alg.Square()) == (5, 5) and (lambda r: (r.set_w(5), (r.w, r.h))[1])(alg.Rectangle()) == (5, 0)"
    steps:
      - show: |
          <table class="t"><tr><th>hợp đồng của <code>rut(x)</code></th><th>nghĩa</th><th>ví dụ: số dư 100, rút 30</th></tr>
          <tr><td><b>tiền điều kiện</b></td><td>người gọi phải bảo đảm trước khi gọi</td><td>30 dương và không quá 100: thoả</td></tr>
          <tr><td><b>hậu điều kiện</b></td><td>hàm hứa đúng sau khi chạy xong</td><td>số dư giảm đúng 30: $100 - 30 = 70$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ta cần hiểu hợp đồng của một hàm, gồm hai phần, lấy ví dụ phép rút tiền. Tiền điều kiện là điều người gọi phải bảo đảm trước khi gọi, ở đây số tiền rút dương và không quá số dư, rút 30 từ 100 là thoả. Hậu điều kiện là điều hàm hứa đúng sau khi chạy xong, ở đây số dư giảm đúng 30, còn 70."
      - show: |
          <table class="t"><tr><th>đối tượng</th><th>gọi <code>dat_rong(5)</code></th><th>rộng, cao sau đó</th></tr>
          <tr><td><code>ChuNhat()</code></td><td>bản của lớp cha</td><td>5, 0</td></tr>
          <tr><td><code>Vuong()</code></td><td>bản <b>ghi đè</b> của lớp con</td><td>5, 5</td></tr></table>
        focus: [1, 1, "1.2", "1.3"]
        say: "Thứ hai, ta ôn lại cách lớp con ghi đè phương thức. Lớp con có thể viết lại một phương thức của lớp cha, và khi gọi, máy chạy bản của chính đối tượng đó, như phép đa hình ở bài 3. Gọi đặt rộng 5 trên một hình chữ nhật mới thì rộng 5, cao vẫn 0. Gọi cùng lời đó trên một hình vuông thì chạy bản ghi đè, rộng và cao đều thành 5."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: thay thế theo hợp đồng"
    steps:
      - show: |
          <p><b>Nguyên lý thay thế</b> (Liskov và Wing, 1994): mọi tính chất <b>chứng minh được</b> từ đặc tả của lớp cha thì phải đúng với đối tượng lớp con.</p>
          <table class="t"><tr><th>lớp con được</th><th>lớp con KHÔNG được</th></tr>
          <tr><td>nhận đầu vào rộng hơn</td><td>đòi tiền điều kiện chặt hơn</td></tr>
          <tr><td>hứa nhiều hơn</td><td>hứa hậu điều kiện yếu hơn</td></tr>
          <tr><td>thêm thao tác mới</td><td>phá bất biến của lớp cha</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Nguyên lý thay thế, chính thức hoá năm 1994, nói mọi tính chất chứng minh được từ bản mô tả hành vi của lớp cha thì phải đúng với đối tượng của lớp con. Bảng so điều lớp con được làm và không được làm. Lớp con được nhận đầu vào rộng hơn, nhưng không được đòi tiền điều kiện chặt hơn. Lớp con được hứa nhiều hơn, nhưng không được hứa hậu điều kiện yếu hơn. Lớp con được thêm thao tác mới, nhưng không được phá bất biến của lớp cha."

  - id: intuition
    kind: intuition
    title: "Cùng hai lời gọi, hai hình khác nhau"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><text x="330" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#2a78d6">ChuNhat: đặt rộng 5, rồi cao 4</text><text x="1080" y="45" font-size="26" font-weight="bold" text-anchor="middle" fill="#eb6834">Vuong: đặt rộng 5, rồi cao 4</text><rect x="230" y="110" width="200" height="160" fill="#dbeafe" stroke="#2a78d6" stroke-width="4"/><text x="330" y="100" font-size="22" text-anchor="middle" fill="#1f2937">rộng 5</text><text x="440" y="195" font-size="22" fill="#1f2937">cao 4</text><text x="330" y="200" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">20</text><rect x="980" y="110" width="200" height="200" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 8"/><rect x="980" y="150" width="160" height="160" fill="#ffedd5" stroke="#eb6834" stroke-width="4"/><text x="1080" y="100" font-size="22" text-anchor="middle" fill="#6b7280">sau đặt rộng 5: 5 x 5 (nét đứt)</text><text x="1060" y="240" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">16</text><text x="1190" y="235" font-size="22" fill="#1f2937">cao 4</text><text x="1060" y="345" font-size="22" text-anchor="middle" fill="#b91c1c">rộng cũng bị đổi thành 4</text><line x1="750" y1="70" x2="750" y2="330" stroke="#d1d5db" stroke-width="3"/><text x="750" y="395" font-size="25" text-anchor="middle" fill="#1f2937">Cùng hai lời gọi, cùng lời hứa “đặt cao không đổi rộng”: lớp cha giữ, lớp con phá.</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đặt hai đối tượng cạnh nhau và gửi cho chúng cùng hai lời gọi, đặt rộng 5 rồi đặt cao 4. Bên trái, hình chữ nhật giữ rộng 5 và nhận cao 4, diện tích 20. Bên phải, hình vuông đặt rộng 5 thành một hình 5 nhân 5, nét đứt, rồi đặt cao 4 kéo luôn chiều rộng xuống 4, diện tích chỉ còn 16. Người gọi chỉ nhìn thấy kiểu hình chữ nhật, nên không có cách nào biết chiều rộng đã bị đổi ngầm."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Chữ nhật và vuông: hậu điều kiện bị phá"
    checks:
      - "alg.lsp_demo(alg.Rectangle) == 5 * 4 and alg.lsp_demo(alg.Square) == 4 * 4"
    steps:
      - show: |
          <div class="code"><div>class ChuNhat:</div><div>    def dat_rong(self, w): self.w = w     <span class="cm"># hậu điều kiện: rộng = w, cao giữ nguyên</span></div><div>    def dat_cao(self, h):  self.h = h</div><div>class Vuong(ChuNhat):</div><div>    def dat_rong(self, w): self.w = self.h = w   <span class="cm"># đổi cả cao!</span></div><div>    def dat_cao(self, h):  self.w = self.h = h</div></div>
          <p><b>Bước 1</b> — đọc hợp đồng của <code>dat_cao</code> trong chữ nhật: đổi cao, <b>giữ nguyên rộng</b>.</p>
        focus: [1, 1, 1, 2]
        say: "Bước một, đọc mã. Trong lớp chữ nhật, đặt chiều rộng chỉ đổi rộng, chiều cao giữ nguyên. Đặt chiều cao cũng chỉ đổi cao. Trong lớp vuông, đặt một cạnh thì đổi cả hai cạnh, nên hợp đồng của phép đặt chiều cao trong chữ nhật là đổi cao và giữ nguyên rộng."
      - clear: true
        show: |
          <p><b>Bước 2</b> — chạy trên <code>ChuNhat</code>:</p>
          <table class="t"><tr><th>lời gọi</th><th>rộng</th><th>cao</th></tr>
          <tr><td><code>dat_rong(5)</code></td><td>5</td><td>0</td></tr>
          <tr><td><code>dat_cao(4)</code></td><td>5</td><td>4</td></tr>
          <tr><td>diện tích</td><td colspan="2">$5 \cdot 4 = \hl{20}$</td></tr></table>
        introduces: [cdot]
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước hai, chạy trên hình chữ nhật. Đặt chiều rộng bằng 5, ta được chiều rộng 5 và chiều cao 0. Đặt cao 4, rộng vẫn 5, cao thành 4. Diện tích là 5 nhân 4, bằng 20."
      - show: |
          <p><b>Bước 3</b> — cùng hai lời gọi trên <code>Vuong</code>:</p>
          <table class="t"><tr><th>lời gọi</th><th>rộng</th><th>cao</th></tr>
          <tr><td><code>dat_rong(5)</code></td><td>5</td><td>5</td></tr>
          <tr><td><code>dat_cao(4)</code></td><td class="red">4</td><td>4</td></tr>
          <tr><td>diện tích</td><td colspan="2">$4 \cdot 4 = \hl{16}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước ba, cùng hai lời gọi trên hình vuông. Đặt rộng 5, cả rộng và cao đều thành 5. Đặt cao 4, cả hai thành 4, rộng bị đổi ngầm. Diện tích là 4 nhân 4, bằng 16 thay vì 20."
      - clear: true
        show: |
          <table class="t"><tr><th>hậu điều kiện “đặt cao không đổi rộng”</th><th>rộng trước</th><th>rộng sau</th><th>giữ?</th></tr>
          <tr><td>ChuNhat</td><td>5</td><td>5</td><td>giữ</td></tr>
          <tr><td>Vuong</td><td>5</td><td>4</td><td class="red">phá</td></tr></table>
          <div class="box key">“Là một” trong toán ≠ “thay được” trong chương trình khi đối tượng <b>đổi được</b>. Nếu hình là bất biến (không có <code>dat_rong</code>), vuông lại thay được chữ nhật.</div>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Bước bốn, đối chiếu với hợp đồng. Với hình chữ nhật, chiều rộng trước và sau đều là 5, hậu điều kiện được giữ. Với hình vuông, chiều rộng từ 5 thành 4, hậu điều kiện bị phá. Là một trong toán học không có nghĩa là thay được trong chương trình khi đối tượng thay đổi được. Nếu hình là bất biến, không có phép đặt cạnh, thì hình vuông lại thay được hình chữ nhật."

  - id: check
    kind: check
    title: "Tự kiểm: chạy bộ kiểm thử của lớp cha trên cả hai lớp"
    checks:
      - "(lambda run: (run(alg.Rectangle), run(alg.Square)))(lambda C: sum(1 for w in range(1, 6) for h in range(1, 6) if (lambda r: (r.set_w(w), r.set_h(h), r.w == w and r.area() == w * h)[2])(C()))) == (25, 5)"
    steps:
      - show: |
          <p>Đường khác: không tin một ví dụ, chạy <b>bộ kiểm thử của lớp cha</b> — đặt rộng $w$, đặt cao $h$, mong rộng vẫn là $w$ và diện tích là $w \cdot h$ — với mọi $w, h$ từ 1 tới 5:</p>
          <table class="t"><tr><th>lớp</th><th>số ca</th><th>số ca đạt</th></tr>
          <tr><td>ChuNhat</td><td>25</td><td>25</td></tr>
          <tr><td>Vuong</td><td>25</td><td class="red">5</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Kiểm bằng đường khác, không tin một ví dụ mà chạy bộ kiểm thử của lớp cha. Đặt rộng w, đặt cao h, mong rộng vẫn là w và diện tích là w nhân h, với mọi w và h từ 1 tới 5. Hình chữ nhật đạt cả 25 ca. Hình vuông chỉ đạt 5 ca, nên hình vuông không giữ được hợp đồng của lớp cha."
      - show: |
          <table class="t"><tr><th>ca hình vuông đạt</th><th>w</th><th>h</th></tr>
          <tr><td>chỉ khi rộng bằng cao</td><td>1, 2, 3, 4, 5</td><td>1, 2, 3, 4, 5</td></tr></table>
          <p>Chỉ cần <b>một</b> ca trượt là đủ kết luận lớp con không thay được lớp cha.</p>
        focus: [1, 2]
        say: "Năm ca hình vuông đạt chính là năm ca rộng bằng cao, từ 1 với 1 tới 5 với 5. Chỉ cần một ca trượt là đủ kết luận lớp con không thay được lớp cha, nên bộ kiểm thử của lớp cha là phép thử nguyên lý thay thế rẻ nhất."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda cha, con: [cha(5000), con(5000), cha(20000), con(20000)])(lambda x: x > 0, lambda x: x >= 10000) == [True, False, True, True]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Vá bằng kiểm kiểu: <code>if isinstance(h, Vuong): …</code> <b class="red">(sai)</b>
          <br><span class="note">Mỗi nơi dùng lại phải biết về lớp con — đúng thứ đa hình muốn tránh. Đổi thiết kế: cho hai lớp cùng một giao diện chỉ đọc <code>dien_tich()</code>, không kế thừa nhau.</span></div>
        say: "Lỗi thứ nhất, vá bằng cách kiểm kiểu ở nơi dùng. Mỗi nơi dùng lại phải biết về lớp con, đúng điều mà đa hình muốn tránh. Hãy đổi thiết kế, cho hai lớp cùng một giao diện chỉ đọc diện tích, và không kế thừa nhau."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Lớp con ném lỗi ở thao tác lớp cha hứa làm được <b class="red">(phá hợp đồng)</b>
          <br><span class="note">Lớp “danh sách chỉ đọc” kế thừa danh sách rồi báo lỗi khi thêm phần tử: mọi hàm nhận danh sách và thêm vào đều hỏng.</span></div>
        say: "Lỗi thứ hai, lớp con báo lỗi ở một thao tác mà lớp cha hứa làm được. Một lớp danh sách chỉ đọc kế thừa danh sách rồi báo lỗi khi thêm phần tử, thì mọi hàm nhận danh sách và thêm vào đều hỏng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ kiểm lớp con bằng ca kiểm riêng của nó <b class="red">(thiếu)</b>
          <br><span class="note">Chạy cả bộ kiểm thử của lớp cha trên lớp con: bộ đó chính là hợp đồng.</span></div>
        say: "Lỗi thứ ba, chỉ kiểm lớp con bằng ca kiểm riêng của nó. Hãy chạy cả bộ kiểm thử của lớp cha trên lớp con, vì bộ đó chính là hợp đồng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Lớp con “siết” tiền điều kiện khi thêm quy định mới <b class="red">(phá người gọi cũ)</b></div>
          <table class="t"><tr><th>lời gọi <code>nap(x)</code></th><th>lớp cha: chỉ cần x dương</th><th>lớp con: đòi $x$ từ 10 000</th></tr>
          <tr><td>nạp 5 000</td><td>nhận</td><td class="red">báo lỗi</td></tr>
          <tr><td>nạp 20 000</td><td>nhận</td><td>nhận</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 1]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, khi có quy định mới thì viết một lớp con siết chặt tiền điều kiện. Lớp cha chỉ cần số tiền nạp dương, lớp con đòi từ 10 nghìn trở lên. Lời gọi nạp 5 nghìn, vốn chạy tốt với lớp cha, giờ báo lỗi. Lời gọi nạp 20 nghìn thì vẫn chạy. Người làm nghề đặt quy định mới ở biên, nơi dữ liệu từ ngoài vào, hoặc đổi hợp đồng của lớp cha một cách công khai, chứ không giấu nó trong một lớp con."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda r: (r.set_w(7), r.set_h(3), r.area())[2])(alg.Rectangle()) == 21 and (lambda r: (r.set_w(7), r.set_h(3), r.area())[2])(alg.Square()) == 9"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Đặt rộng 7 rồi cao 3: chữ nhật cho diện tích bao nhiêu? Vuông (kế thừa như trên) cho bao nhiêu?</td></tr>
          <tr><td>2</td><td>Lớp “Chim” có <code>bay()</code>. Lớp “Chim cánh cụt” kế thừa và báo lỗi khi bay. Có phá nguyên lý không? Sửa thế nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, đặt rộng 7 rồi cao 3, hình chữ nhật cho diện tích bao nhiêu? Hình vuông kế thừa như trên cho bao nhiêu? Câu hai, lớp chim có phép bay. Lớp chim cánh cụt kế thừa và báo lỗi khi bay. Có phá nguyên lý không, và sửa thế nào? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>lời gọi</th><th>ChuNhat: rộng, cao</th><th>Vuong: rộng, cao</th></tr>
          <tr><td><code>dat_rong(7)</code></td><td>7, 0</td><td>7, 7</td></tr>
          <tr><td><code>dat_cao(3)</code></td><td>7, 3</td><td>3, 3</td></tr>
          <tr><td>diện tích</td><td>$7 \cdot 3 = \hl{21}$</td><td>$3 \cdot 3 = \hl{9}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, lập bảng cho hai lớp. Đặt rộng 7, chữ nhật có rộng 7 cao 0, hình vuông có cả hai cạnh 7. Đặt cao 3, chữ nhật có rộng 7 cao 3, còn hình vuông có cả hai cạnh thành 3. Vậy chữ nhật cho 21, hình vuông cho 9, vì đặt cao 3 đổi luôn cả rộng."
      - clear: true
        show: |
          <table class="t"><tr><th>câu hỏi</th><th>trả lời</th></tr>
          <tr><td>lớp cha hứa gì?</td><td>mọi chim gọi <code>bay()</code> được</td></tr>
          <tr><td>chim cánh cụt làm gì?</td><td>báo lỗi → <b>có phá</b></td></tr>
          <tr><td>sửa thế nào?</td><td>tách giao diện “biết bay”; chim cánh cụt là chim nhưng không có giao diện đó</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Câu hai, đi từng bước. Lớp cha hứa mọi con chim đều gọi phép bay được. Chim cánh cụt lại báo lỗi, nên có phá nguyên lý, vì nơi gọi phép bay trên mọi con chim sẽ hỏng. Cách sửa là tách một giao diện biết bay riêng, chim cánh cụt vẫn là chim nhưng không có giao diện đó."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">lớp con thay được lớp cha ở mọi chỗ</span><span class="a">→</span>
          <span class="n">không chặt tiền điều kiện, không yếu hậu điều kiện</span><span class="a">→</span>
          <span class="n">giữ bất biến</span><span class="a">→</span>
          <span class="n">phá thì đổi thiết kế</span></div>
        say: "Tổng kết lại, lớp con phải thay được lớp cha ở mọi chỗ, không chặt hơn tiền điều kiện, không yếu hơn hậu điều kiện, và giữ bất biến. Nếu bị phá thì đổi thiết kế, đừng vá."
      - show: |
          <div class="box key"><b>Tư duy:</b> kế thừa là một lời hứa về <b>hành vi</b>, không chỉ về tên gọi. Trước khi viết “là một”, hãy kiểm “làm được mọi việc như”.</div>
        say: "Điều cần mang theo, kế thừa là một lời hứa về hành vi, không chỉ về tên gọi. Trước khi viết là một, hãy kiểm làm được mọi việc như."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>tách giao diện</b> và <b>đảo phụ thuộc</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học hai nguyên lý còn lại, tách giao diện và đảo phụ thuộc. Hẹn gặp bạn ở bài tiếp theo."
