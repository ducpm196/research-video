- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">“là một”: kế thừa</span><span class="a">→</span>

      <span class="n">“có một”: hợp thành</span><span class="a">→</span>

      <span class="n">số lớp theo tổng, không theo tích</span><span class="a">→</span>

      <span class="n">ghép, đổi lúc chạy</span></div>

      '
    say: Tổng kết lại, quan hệ là một thì kế thừa, quan hệ có một thì hợp thành. Hợp thành làm số lớp tăng theo tổng chứ không
      theo tích, và cho phép ghép, đổi thành phần lúc chạy. Hợp thành thay vì kế thừa giữ mỗi thành phần nhỏ gọn, hoán đổi
      dễ dàng lúc chạy và cực kỳ dễ kiểm thử cô lập. Lắp ghép các thành phần qua giao diện giúp hoán đổi linh hoạt cả khi
      chạy lẫn khi kiểm thử cô lập.
  - show: '<div class="box key"><b>Tư duy:</b> khi thấy số trường hợp nhân lên, hãy tìm các chiều độc lập và tách chúng ra
      để ghép lại.</div>

      '
    say: Điều cần mang theo, khi thấy số trường hợp nhân lên, hãy tìm các chiều độc lập, tách chúng ra, rồi ghép lại. Chỉ
      dùng kế thừa khi mối quan hệ thực sự mang tính thay thế trọn vẹn cùng bản chất lâu dài không thay đổi.
  - clear: true
    show: '<p class="note">Bài sau (bài 5): nguyên lý thiết kế — <b>trách nhiệm đơn</b> và <b>đóng–mở</b>.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 5, ta học hai nguyên lý thiết kế đầu tiên, trách nhiệm đơn và đóng mở. Hẹn gặp bạn ở bài tiếp theo.
      Từ nguyên tắc ghép khối đó, năm nguyên tắc thiết kế hướng đối tượng kinh điển sẽ hệ thống hoá toàn bộ nghệ thuật giữ
      mã dẻo dai.
