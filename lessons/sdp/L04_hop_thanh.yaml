        say: "Tổng kết lại, quan hệ là một thì kế thừa, quan hệ có một thì hợp thành. Hợp thành làm số lớp tăng theo tổng chứ không theo tích, và cho phép ghép, đổi thành phần lúc chạy."
      - show: |
