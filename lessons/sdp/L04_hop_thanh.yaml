id: L04
course: SDP
series: SDP · Kỹ thuật lập trình và mẫu thiết kế
title: Bài 4 — Hợp thành thay vì kế thừa
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/sdp.yaml L04; audit/sdp/verify_sdp.py L04; E. Gamma và cộng sự, Design Patterns (1994), mục 1.6 (“ưu tiên
  hợp thành đối tượng hơn kế thừa lớp”); J. Bloch, Effective Java, 3rd ed. (2018), mục 18
assumes:
- arith
- power
- cdot
objectives:
- Thấy bùng nổ số lớp khi kế thừa theo mọi tổ hợp
- Ghép hành vi bằng hợp thành
- Biết khi nào kế thừa vẫn đúng
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: 48 lớp cho một quán cà phê
  checks:
  - alg.coffee_classes(3, 4) == (48, 7) and 3 * 2 ** 4 == 48
  steps:
  - show: '<p>Quán có 3 loại cà phê và 4 thứ thêm (sữa, đường, kem, quế), mỗi thứ có hoặc không. Làm mỗi tổ hợp một lớp con:
      $3 \cdot 2^4 = \hl{48}$ lớp — <code>CaPheSuaDuongKem</code>, <code>CaPheSuaQue</code>…</p>

      <div class="box key">Hôm nay: <b>hợp thành</b> — ghép đối tượng nhỏ lại thay vì đẻ ra lớp con cho mọi tổ hợp.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, quán có 3 loại cà phê và 4 thứ thêm là sữa, đường, kem, quế, mỗi thứ có hoặc không. Nếu làm mỗi tổ hợp
      một lớp con, ta cần 3 nhân 2 mũ 4, tức 48 lớp. Hôm nay ta học hợp thành, ghép các đối tượng nhỏ lại thay vì đẻ ra lớp
      con cho mọi tổ hợp. Cần một lớp vừa nén dữ liệu vừa mã hoá rồi ghi nhật ký nhưng kế thừa dọc buộc bạn phải tạo ra tổ
      hợp lớp con bùng nổ theo cấp số nhân.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: đếm tổ hợp có–không, và lớp con'
  checks:
  - len(list(__import__('itertools').product(['không', 'có'], repeat=2))) == 4 == 2 ** 2 and 2 ** 4 == 16 and 3 * 16 == 48
  - '(lambda d: exec(''class CaPhe:\n    def gia(self):\n        return 30\nclass CaPheSua(CaPhe):\n    def gia(self):\n        return
    30 + 5\n'', d) or (d[''CaPhe'']().gia(), d[''CaPheSua'']().gia()) == (30, 35))({})'
  steps:
  - show: '<table class="t"><tr><th>sữa</th><th>đường</th></tr>

      <tr><td>không</td><td>không</td></tr><tr><td>có</td><td>không</td></tr><tr><td>không</td><td>có</td></tr><tr><td>có</td><td>có</td></tr></table>

      <p>2 thứ, mỗi thứ có hoặc không: $2 \cdot 2 = 2^2 = 4$ tổ hợp. 4 thứ: $2^4 = 16$. Ghép với 3 loại nền: $3 \cdot 16 =
      48$.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Trước hết, đếm tổ hợp có hoặc không. Với 2 thứ là sữa và đường, bảng liệt kê đủ 4 tổ hợp, đúng bằng 2 nhân 2, tức
      2 mũ 2. Với 4 thứ thì có 2 mũ 4, bằng 16 tổ hợp. Ghép với 3 loại cà phê nền, ta được 3 nhân 16, bằng 48. Kế thừa thiết
      lập mối quan hệ tĩnh cứng ngay từ lúc biên dịch và ép lớp con thừa hưởng mọi chi tiết ruột của lớp cha suốt đời.
  - show: '<div class="code"><div>class CaPhe:</div><div>    def gia(self): return 30</div><div>class CaPheSua(CaPhe):          <span
      class="cm"># lớp con: "là một" cà phê</span></div><div>    def gia(self): return 30 + 5    <span class="cm"># cài lại:
      35</span></div></div>

      <p>Ở bài 3: <b>lớp con</b> nhận mọi thứ của lớp cha và có thể cài lại phương thức; mỗi tổ hợp cố định phải là <b>một
      lớp</b> viết sẵn.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Tiếp theo, ôn điều đã học ở bài 3, lớp con kế thừa lớp cha và có thể cài lại phương thức. Lớp cà phê sữa kế thừa
      lớp cà phê, nên nó là một cà phê, và nó cài lại phép tính giá thành 30 cộng 5, bằng 35. Lớp con nhận mọi thứ của lớp
      cha và có thể cài lại phương thức, nhưng mỗi tổ hợp cố định phải là một lớp viết sẵn. Hợp thành giữ các thành phần phụ
      thuộc dưới dạng giao diện bên trong đối tượng và ủy thác hành vi linh hoạt lúc chạy chương trình.
- id: sym
  kind: symbol
  title: 'Giải mã: “là một” và “có một”'
  steps:
  - show: '<table class="t"><tr><th>quan hệ</th><th>nghĩa</th><th>cách cài</th></tr>

      <tr><td><b>là một</b></td><td>chó <b>là một</b> động vật</td><td>kế thừa</td></tr>

      <tr><td><b>có một</b></td><td>ly cà phê <b>có</b> sữa, <b>có</b> đường</td><td>hợp thành: đối tượng giữ các đối tượng
      khác</td></tr></table>

      <div class="box key">Hợp thành: ghép lúc chạy, đổi được thành phần, số lớp tăng theo <b>tổng</b> chứ không theo <b>tích</b>.</div>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    say: Có hai loại quan hệ. Quan hệ là một, như chó là một động vật, cài bằng kế thừa. Quan hệ có một, như ly cà phê có
      sữa, có đường, cài bằng hợp thành, tức một đối tượng giữ các đối tượng khác. Hợp thành ghép lúc chạy, đổi được thành
      phần, và số lớp tăng theo tổng chứ không theo tích. Thay vì tạo tám lớp con kết hợp ba tính năng, hợp thành cho phép
      lắp ghép ba khối độc lập thành tám cấu hình tuỳ ý ngay lúc khởi tạo.
- id: intuition
  kind: intuition
  title: Ly cà phê như những lớp vỏ lồng nhau
  steps:
  - show: '<div><svg width="1500" height="420" viewBox="0 0 1500 420"><rect x="30" y="40" width="620" height="350" rx="18"
      fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><rect x="80" y="115" width="520" height="240" rx="16" fill="#dbeafe"
      stroke="#2a78d6" stroke-width="3"/><rect x="140" y="200" width="400" height="110" rx="14" fill="#d1fae5" stroke="#059669"
      stroke-width="3"/><g font-size="24" text-anchor="middle" fill="#1f2937"><text x="340" y="85"><tspan font-weight="bold">thêm
      đường</tspan>: bên trong + 2 = <tspan fill="#eb6834" font-weight="bold">37</tspan></text><text x="340" y="160"><tspan
      font-weight="bold">thêm sữa</tspan>: bên trong + 5 = <tspan fill="#2a78d6" font-weight="bold">35</tspan></text><text
      x="340" y="245" font-weight="bold">cà phê</text><text x="340" y="285">giá <tspan fill="#059669" font-weight="bold">30</tspan></text></g><text
      x="1060" y="80" font-size="27" font-weight="bold" text-anchor="middle" fill="#1f2937">số lớp phải viết (3 nền, 4 thứ
      thêm)</text><text x="710" y="160" font-size="23" fill="#1f2937">kế thừa, mỗi tổ hợp một lớp</text><rect x="710" y="175"
      width="672" height="54" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="1395" y="212" font-size="26" font-weight="bold"
      fill="#b91c1c">48</text><text x="710" y="290" font-size="23" fill="#1f2937">hợp thành: 3 lớp nền + 4 lớp thêm</text><rect
      x="710" y="305" width="98" height="54" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="822" y="342" font-size="26"
      font-weight="bold" fill="#059669">7</text></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Bên trái, ly cà phê sữa đường được vẽ như những lớp vỏ lồng nhau. Trong cùng là cà phê giá 30, lớp vỏ sữa hỏi giá
      bên trong rồi cộng 5 được 35, lớp vỏ đường ngoài cùng cộng tiếp 2 được 37. Bên phải, thanh đỏ là 48 lớp phải viết nếu
      mỗi tổ hợp là một lớp con. Thanh xanh chỉ có 7 lớp, vì mọi tổ hợp đều được ghép lúc chạy từ các mảnh nhỏ. Kế thừa giống
      đúc nguyên khối một chiếc xe gắn máy hàn cứng khung cốp bánh xe; hợp thành giống bộ lắp ghép nơi bạn thay động cơ hay
      lốp trong ba phút.
- id: example
  kind: example
  title: 7 lớp thay cho 48
  checks:
  - alg.AddOn(alg.AddOn(alg.Coffee(), 5), 2).cost() == 37 and 3 + 4 == 7
  - alg.Coffee().cost() == 30 and alg.AddOn(alg.Coffee(), 5).cost() == 35
  - alg.coffee_classes(3, 5) == (96, 8) and alg.coffee_classes(3, 5)[0] - alg.coffee_classes(3, 4)[0] == 48
  - '(lambda d: exec(''class CaPhe:\n    def gia(self): return 30\nclass Them:\n    def __init__(self, ben_trong, gia): self.trong,
    self.g = ben_trong, gia\n    def gia(self): return self.trong.gia() + self.g\n\nly = Them(Them(CaPhe(), 5), 2)\n'', d)
    or d[''ly''].gia() == 37)({})'
  steps:
  - show: '<div class="code"><div>class CaPhe:</div><div>    def gia(self): return 30</div><div>class Them:</div><div>    def
      __init__(self, ben_trong, gia): self.trong, self.g = ben_trong, gia</div><div>    def gia(self): return self.trong.gia()
      + self.g</div><div></div><div>ly = Them(Them(CaPhe(), 5), 2)      <span class="cm"># cà phê + sữa + đường</span></div></div>

      <p><b>Bước 1</b> — đọc mã: lớp <code>Them</code> giữ một đối tượng bên trong và một mức giá. Vì giá là tham số, một
      lớp này dùng chung cho cả 4 thứ thêm; nếu mỗi thứ có cách tính riêng thì cần 4 lớp — vẫn tăng theo <b>tổng</b>.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Bước một, đọc mã. Lớp cà phê có giá 30. Lớp thêm nhận một đối tượng bên trong và một mức giá. Giá của nó bằng giá
      bên trong cộng phần thêm. Vì giá là tham số, một lớp này dùng chung được cho cả 4 thứ thêm, còn nếu mỗi thứ có cách
      tính riêng thì cần 4 lớp, số lớp vẫn tăng theo tổng.
  - show: '<table class="t"><tr><th>bước</th><th>lời gọi <code>gia()</code></th><th>tính</th><th>trả</th></tr>

      <tr><td>2</td><td>cà phê (trong cùng)</td><td>30</td><td>30</td></tr>

      <tr><td>3</td><td>thêm sữa</td><td>30 + 5</td><td>35</td></tr>

      <tr><td>4</td><td>thêm đường (ngoài cùng)</td><td>35 + 2</td><td>$\hl{37}$ nghìn</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Ly cà phê có sữa và đường là cà phê bọc trong lớp thêm sữa, rồi bọc tiếp trong lớp thêm đường, và bảng lần theo lời
      gọi giá từ trong ra ngoài. Bước hai, cà phê trong cùng trả 30. Bước ba, lớp sữa lấy 30 cộng 5, trả 35. Bước bốn, lớp
      đường lấy 35 cộng 2, trả 37 nghìn.
  - clear: true
    show: '<table class="t"><tr><th>bước 5: đếm lớp</th><th>kế thừa mọi tổ hợp</th><th>hợp thành</th></tr>

      <tr><td>3 nền, 4 thứ thêm</td><td>$3 \cdot 2^4 = 48$</td><td>$3 + 4 = 7$</td></tr>

      <tr><td>thêm “bọt sữa” (5 thứ)</td><td>$3 \cdot 2^5 = 96$: thêm $\hl{48}$ lớp</td><td>$3 + 5 = 8$: thêm 1 lớp</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Bước năm, đếm số lớp. Với 3 loại nền và 4 thứ thêm, kế thừa mọi tổ hợp cần 48 lớp, còn mọi tổ hợp đều ghép được từ
      3 lớp nền và 4 lớp thêm, tổng 7 lớp. Thêm loại bọt sữa thì kế thừa phải lên 3 nhân 2 mũ 5, bằng 96 lớp, tức sinh thêm
      48 lớp con, còn hợp thành chỉ cần một lớp mới.
- id: check
  kind: check
  title: 'Tự kiểm: máy ghép đủ mọi tổ hợp và đếm'
  checks:
  - '(lambda T: (len(T), len(set(T)), min(T), max(T)))([(b, s) for b in range(3) for s in __import__(''itertools'').product([0,
    1], repeat=4)]) == (48, 48, (0, (0, 0, 0, 0)), (2, (1, 1, 1, 1)))'
  - '(lambda P: (len(P), min(P), max(P)))([sum(x * g for x, g in zip(s, (5, 2, 8, 3))) + 30 for s in __import__(''itertools'').product([0,
    1], repeat=4)]) == (16, 30, 48)'
  steps:
  - show: '<table class="t"><tr><th>máy liệt kê mọi ly ghép được</th><th>kết quả</th></tr>

      <tr><td>(loại nền, có/không từng thứ thêm)</td><td>48 ly khác nhau ✓ — đúng số lớp kế thừa phải viết</td></tr>

      <tr><td>số lớp hợp thành dùng để ghép cả 48 ly</td><td>vẫn chỉ 7</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Kiểm bằng đường khác, cho máy liệt kê từng ly ghép được, thay vì dùng công thức. Mỗi ly là một loại nền cùng lựa
      chọn có hoặc không cho từng thứ thêm, và máy đếm được đúng 48 ly khác nhau, khớp với 48 lớp kế thừa. Nhưng cả 48 ly
      ấy đều ghép được từ đúng 7 lớp hợp thành.
  - show: '<table class="t"><tr><th>giá thêm (nghìn)</th><th>sữa 5, đường 2, kem 8, quế 3</th></tr>

      <tr><td>16 tổ hợp thêm trên cà phê 30</td><td>rẻ nhất 30, đắt nhất $30 + 5 + 2 + 8 + 3 = 48$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    say: Máy cũng tính giá cho cả 16 tổ hợp thêm trên ly cà phê 30, với giá thêm là sữa 5, đường 2, kem 8, quế 3. Ly rẻ nhất
      là 30 khi không thêm gì, ly đắt nhất là 30 cộng 5 cộng 2 cộng 8 cộng 3, bằng 48, nên mọi giá đều do lớp thêm cộng dần,
      không cần lớp riêng nào.
  - show: '<div class="box key"><b>Khi nào kế thừa vẫn đúng:</b> khi quan hệ thật sự là “là một” suốt vòng đời (như <code>ChuNhat</code>
      và <code>Hinh</code> cùng giữ hợp đồng <code>area()</code>), không nhân theo nhiều chiều lựa chọn độc lập.</div>

      '
    say: 'Bảng kiểm này cũng làm rõ ranh giới với bài trước: hợp thành tránh bùng nổ số lớp cho các tuỳ chọn ghép thêm. Còn
      kế thừa vẫn đúng chỗ khi quan hệ thật sự là một loại duy nhất và giữ trọn hợp đồng của lớp cha như các hình ở bài 3.'
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp
  checks:
  - 'alg.AddOn(alg.Coffee(), 5).cost() == 35 and __import__(''functools'').reduce(lambda c, _: alg.AddOn(c, 1), range(50),
    alg.Coffee()).cost() == 80'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Kế thừa để “có” một tính năng <b class="red">(sai quan hệ)</b>

      <br><span class="note">Lớp <code>Xe</code> kế thừa <code>DongCo</code> vì “xe có động cơ”: xe không <b>là một</b> động
      cơ. Cho xe giữ một đối tượng động cơ.</span></div>

      '
    say: Lỗi thứ nhất, kế thừa để có một tính năng, như cho lớp xe kế thừa lớp động cơ vì xe có động cơ. Xe không phải là
      một động cơ, nên hãy cho xe giữ một đối tượng động cơ.
    focus:
    - '1.1'
    - '1.2'
  - show: '<div class="box warn"><b>Lỗi 2.</b> Nghĩ kế thừa luôn xấu <b class="red">(quá đà)</b>

      <br><span class="note">Kế thừa vẫn đúng khi quan hệ thật sự là “là một” và lớp con thay được lớp cha ở mọi chỗ. Hợp
      thành không phải luật cấm kế thừa.</span></div>

      '
    say: Lỗi thứ hai, nghĩ kế thừa luôn xấu. Kế thừa vẫn đúng khi quan hệ thật sự là là một, và lớp con thay được lớp cha
      ở mọi chỗ. Hợp thành không phải luật cấm kế thừa.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Hợp thành mà để lộ các thành phần bên trong <b class="red">(rò)</b>

      <br><span class="note">Người dùng phải viết <code>xe.dong_co.bom.ap_suat</code> là đang phụ thuộc vào cấu trúc bên trong.
      Mở thao tác ở lớp ngoài: <code>xe.khoi_dong()</code>.</span></div>

      '
    say: Lỗi thứ ba, hợp thành mà để lộ các thành phần bên trong. Người dùng phải đi sâu qua xe, động cơ, bơm, áp suất là
      đang phụ thuộc vào cấu trúc bên trong, nên hãy mở thao tác ở lớp ngoài, như khởi động xe.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Để khách bọc lớp thêm bao nhiêu lần cũng được, không kiểm ở biên <b class="red">(hở)</b></div>

      <table class="t"><tr><th>đơn từ ứng dụng</th><th>số lớp vỏ</th><th>giá</th></tr>

      <tr><td>cà phê + sữa</td><td>1</td><td>35</td></tr>

      <tr><td>cà phê + 50 lần “thêm đá 1 nghìn”</td><td>50</td><td class="red">80 — đơn vô lý vẫn lọt qua</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - 1
