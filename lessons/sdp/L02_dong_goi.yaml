id: L02
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 2 — Đóng gói và bất biến lớp"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L02; audit/sdp/verify_sdp.py L02; D. L. Parnas, On the Criteria To Be Used in Decomposing Systems into Modules, CACM 15(12), 1972; B. Meyer, Object-Oriented Software Construction, 2nd ed. (1997), chương 11; SWF bài 7 (bất biến cấu trúc dữ liệu)"
assumes: [arith, ltgt]
# Quy ước: mã minh hoạ Python; lớp tài khoản alg.Account giữ số dư trong trường “ẩn” _balance, chỉ đổi qua nap/rut; bất biến số dư ≥ 0.
#   alg.account_demo so với một lớp lộ trường. Python không cấm truy cập _balance — dấu gạch dưới là quy ước; bài nói rõ điều này.
objectives:
  - "Hiểu đóng gói là bảo vệ bất biến"
  - "Chỉ cho đổi trạng thái qua thao tác giữ bất biến"
  - "Phân biệt đóng gói thật với getter/setter máy móc"
asr_reviewed:
  - {sentence: "Bảng dưới đây ghi lại một thứ tự xen kẽ của hai luồng.", reason: "ASR chép “Bạn dưới đây ghi lại 1 thứ tự sen kẻ của 2 luôn.” (0.769): lệch âm/thanh thuần Việt: bảng/bạn, kẽ/kẻ, luồng/luôn — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Số dư âm 50 nghìn"
    checks:
      - "alg.account_demo() == ('ValueError', -50)"
    steps:
      - show: |
          <p>Lớp tài khoản lộ trường <code>so_du</code> cho mọi nơi gán. Một đoạn mã ở xa viết <code>tk.so_du -= 150</code> khi tài khoản chỉ có 100. Số dư thành $\hl{-50}$, không có lỗi nào.</p>
          <div class="box key">Hôm nay: <b>đóng gói</b> — giấu dữ liệu bên trong, chỉ cho đổi qua các thao tác <b>giữ bất biến</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một lớp tài khoản để lộ trường số dư cho mọi nơi gán. Một đoạn mã ở xa trừ 150 khi tài khoản chỉ có 100. Số dư thành âm 50, mà không có lỗi nào. Hôm nay ta học đóng gói, giấu dữ liệu bên trong, và chỉ cho đổi qua các thao tác giữ được bất biến."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lớp và đối tượng, điều luôn đúng"
    checks:
      - "(lambda a, b: (a.rut(30), a.balance, b.balance)[1:])(alg.Account(100), alg.Account(40)) == (70, 40)"
      - "(lambda a: (a.rut(30), a.balance, a.rut(70), a.balance)[1::2])(alg.Account(100)) == (70, 0)"
    steps:
      - show: |
          <p><b>Lớp</b> là cái khuôn; <b>đối tượng</b> là một cái cụ thể đúc từ khuôn, mỗi cái giữ dữ liệu riêng.</p>
          <table class="t"><tr><th>đối tượng</th><th>số dư lúc tạo</th><th>rút 30 ở tài khoản thứ nhất</th></tr>
          <tr><td>tài khoản thứ nhất</td><td>100</td><td>$\hl{70}$</td></tr>
          <tr><td>tài khoản thứ hai</td><td>40</td><td>vẫn 40</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Trước hết, ôn lớp và đối tượng. Lớp là cái khuôn, còn đối tượng là một cái cụ thể đúc từ khuôn, mỗi cái giữ dữ liệu riêng. Tạo tài khoản thứ nhất với 100 và tài khoản thứ hai với 40, rút 30 ở tài khoản thứ nhất thì nó còn 70. Tài khoản thứ hai vẫn là 40, vì hai đối tượng không dùng chung số dư."
      - show: |
          <p>Tiếp theo, ta cần hiểu <b>bất biến</b>: một điều phải đúng sau <b>mỗi</b> bước, dù chương trình chạy theo thứ tự nào. Thử “số dư ≥ 0” trên tài khoản thứ nhất:</p>
          <table class="t"><tr><th>thao tác</th><th>số dư</th><th>số dư ≥ 0?</th></tr>
          <tr><td>tạo với 100</td><td>100</td><td>đúng</td></tr>
          <tr><td>rút 30</td><td>70</td><td>đúng</td></tr>
          <tr><td>rút 70 (đúng bằng số dư)</td><td>0</td><td>đúng — 0 vẫn hợp lệ</td></tr></table>
          <p class="note">Ích lợi: ở bất kỳ chỗ nào trong chương trình, ta biết chắc số dư không âm mà không phải kiểm lại.</p>
        focus: [1, 2, "2.2", "2.3", "2.4", 3]
        say: "Tiếp theo, ta cần hiểu bất biến, tức một điều phải đúng sau mỗi bước, dù chương trình chạy theo thứ tự nào. Thử điều số dư không âm trên tài khoản thứ nhất. Lúc tạo với 100, điều đó đúng. Rút 30 còn 70, vẫn đúng. Rút tiếp 70, đúng bằng số dư, còn 0, vẫn đúng, vì số dư bằng 0 vẫn hợp lệ. Ích lợi của bất biến là ở bất kỳ chỗ nào trong chương trình, ta biết chắc số dư không âm mà không phải kiểm lại."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: bất biến lớp, đóng gói"
    steps:
      - show: |
          <p><b>Bất biến lớp</b>: điều luôn đúng với mọi đối tượng của lớp sau mỗi thao tác công khai (thao tác mà mã bên ngoài lớp được gọi). Ở đây: <b>số dư ≥ 0</b>.</p>
          <p><b>Đóng gói</b>: giấu trạng thái, chỉ mở các thao tác có ý nghĩa nghiệp vụ (<code>nap</code>, <code>rut</code>), mỗi thao tác kiểm bất biến.</p>
          <div class="box key">Nếu ai cũng sửa được trường, bất biến phụ thuộc vào <b>mọi</b> dòng mã trong chương trình. Đóng gói thu hẹp xuống <b>một</b> lớp.</div>
        focus: [1, 1, 2, 3, 3]
        say: "Bất biến lớp là điều luôn đúng với mọi đối tượng của lớp sau mỗi thao tác công khai, tức thao tác mà mã bên ngoài lớp được phép gọi. Ở đây bất biến là số dư không âm. Đóng gói là giấu trạng thái, chỉ mở các thao tác có ý nghĩa nghiệp vụ như nạp và rút, mỗi thao tác đều kiểm bất biến. Nếu ai cũng sửa được trường, bất biến phụ thuộc vào mọi dòng mã trong chương trình. Đóng gói thu hẹp trách nhiệm đó xuống một lớp duy nhất."

  - id: intuition
    kind: intuition
    title: "Bức tường quanh số dư"
    steps:
      - show: |
          <div><svg width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arD2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><line x1="750" y1="20" x2="750" y2="410" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 8"/><g font-size="26" font-weight="bold" text-anchor="middle"><text x="375" y="45" fill="#b91c1c">lộ trường: ai cũng gán được</text><text x="1125" y="45" fill="#059669">đóng gói: chỉ 2 cửa, cửa nào cũng kiểm</text></g><rect x="35" y="100" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="120" y="138" font-size="22" text-anchor="middle" fill="#1f2937">hàm A</text><rect x="35" y="210" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="120" y="248" font-size="22" text-anchor="middle" fill="#1f2937">hàm B</text><rect x="35" y="320" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="120" y="358" font-size="22" text-anchor="middle" fill="#1f2937">hàm C</text><rect x="400" y="205" width="240" height="70" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><text x="520" y="248" font-size="24" text-anchor="middle" fill="#1f2937">so_du = −50</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="205" y1="140" x2="398" y2="220" marker-end="url(#arD2)"/><line x1="205" y1="240" x2="398" y2="240" marker-end="url(#arD2)"/><line x1="205" y1="340" x2="398" y2="260" marker-end="url(#arD2)"/></g><text x="520" y="330" font-size="22" text-anchor="middle" fill="#b91c1c">trừ 150 thẳng vào trường</text><rect x="1010" y="90" width="440" height="300" rx="16" fill="#f0fdf4" stroke="#1f2937" stroke-width="8"/><rect x="1190" y="205" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1300" y="248" font-size="24" text-anchor="middle" fill="#1f2937">_so_du = 100</text><rect x="1000" y="132" width="140" height="56" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1070" y="168" font-size="22" text-anchor="middle" fill="#1f2937">nap(x)</text><rect x="1000" y="292" width="140" height="56" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1070" y="328" font-size="22" text-anchor="middle" fill="#1f2937">rut(x)</text><rect x="795" y="130" width="130" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="860" y="168" font-size="22" text-anchor="middle" fill="#1f2937">hàm A</text><rect x="795" y="290" width="130" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="860" y="328" font-size="22" text-anchor="middle" fill="#1f2937">hàm B</text><rect x="795" y="210" width="130" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="860" y="248" font-size="22" text-anchor="middle" fill="#1f2937">hàm C</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="925" y1="160" x2="998" y2="160" marker-end="url(#arD2)"/><line x1="925" y1="320" x2="998" y2="320" marker-end="url(#arD2)"/><line x1="1140" y1="170" x2="1188" y2="222" marker-end="url(#arD2)"/><line x1="1140" y1="310" x2="1188" y2="258" marker-end="url(#arD2)"/></g><line x1="925" y1="240" x2="1000" y2="240" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><g font-size="21" text-anchor="middle"><text x="1070" y="215" fill="#1f2937">kiểm x</text><text x="1070" y="280" fill="#1f2937">kiểm x</text><text x="1125" y="418" fill="#b91c1c">hàm C gán thẳng: trái quy ước, không ai được làm</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đặt hai thiết kế cạnh nhau. Bên trái, trường số dư để lộ, nên hàm nào cũng gán thẳng được, và chỉ cần một hàm trừ sai là số dư thành âm 50. Bên phải, số dư nằm sau một bức tường, chỉ có hai cửa là nạp và rút, cửa nào cũng kiểm số tiền trước khi cho vào. Muốn biết số dư có thể âm không, bên trái phải đọc mọi hàm, còn bên phải chỉ cần đọc hai cửa."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Lớp tài khoản đóng gói"
    checks:
      - "(lambda d: exec('a = alg.Account(100)\\ntry:\\n    a.rut(150)\\nexcept ValueError:\\n    pass\\nr = a.balance\\n', d) or d['r'] == 100)({'alg': alg}) and alg.account_demo()[0] == 'ValueError'"
      - "(lambda a: (a.nap(50), a.balance)[1])(alg.Account(200)) == 250"
      - "(lambda a: (a.nap(50), a.rut(100), a.balance)[2])(alg.Account(200)) == 150"
      - "(lambda d: exec('class TaiKhoan:\\n    def __init__(self, so_du=0):\\n        if so_du < 0: raise ValueError(\"am\")\\n        self._so_du = so_du\\n    @property\\n    def so_du(self): return self._so_du\\n    def nap(self, x):\\n        if x <= 0: raise ValueError(\"am\")\\n        self._so_du += x\\n    def rut(self, x):\\n        if x <= 0 or x > self._so_du: raise ValueError(\"thieu\")\\n        self._so_du -= x\\na = TaiKhoan(200)\\na.nap(50)\\nb = a.so_du\\na.rut(100)\\nr = a.so_du\\nc = TaiKhoan(100)\\ntry:\\n    c.rut(150)\\nexcept ValueError:\\n    pass\\n', d) or (d['b'], d['r'], d['c'].so_du) == (250, 150, 100))({})"
    steps:
      - show: |
          <div class="code"><div>class TaiKhoan:</div><div>    def __init__(self, so_du=0):</div><div>        if so_du &lt; 0: raise ValueError("số dư âm")</div><div>        self._so_du = so_du</div><div>    @property</div><div>    def so_du(self): return self._so_du        <span class="cm"># chỉ đọc</span></div><div>    def nap(self, x):</div><div>        if x &lt;= 0: raise ValueError("số tiền phải dương")</div><div>        self._so_du += x</div><div>    def rut(self, x):</div><div>        if x &lt;= 0 or x &gt; self._so_du: raise ValueError("không đủ số dư")</div><div>        self._so_du -= x</div></div>
          <p><b>Bước 1</b> — đọc cấu trúc: hàm tạo kiểm, trường ẩn, thuộc tính chỉ đọc; nạp kiểm số tiền dương, rút kiểm thêm số dư trước khi trừ.</p>
        focus: [1, 1, 2]
        say: "Bước một, đọc cấu trúc. Lớp tài khoản kiểm số dư ban đầu không âm, cất số dư vào một trường ẩn, và chỉ cho đọc qua một thuộc tính. Thao tác nạp chỉ nhận số tiền dương rồi cộng, còn thao tác rút kiểm số tiền dương và không vượt số dư, rồi mới trừ."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>thao tác</th><th>x ≤ 0?</th><th>x &gt; số dư?</th><th>kết quả</th><th>số dư</th></tr>
          <tr><td>2</td><td>tạo 100, rút 150</td><td>không</td><td class="red">150 &gt; 100: có</td><td>báo lỗi</td><td>giữ $\hl{100}$</td></tr>
          <tr><td>3</td><td>tạo 200, nạp 50</td><td>không</td><td>(nạp không kiểm điều này)</td><td>cộng</td><td>250</td></tr>
          <tr><td>4</td><td>rút 100</td><td>không</td><td>100 &gt; 250: không</td><td>trừ</td><td>$\hl{150}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng chạy ba bước tiếp theo. Bước hai, rút 150 từ 100, số tiền dương nhưng lớn hơn số dư, nên báo lỗi và số dư giữ nguyên 100. Bước ba, tài khoản 200 nạp 50 thành 250. Bước bốn, rút 100, không vượt 250, nên trừ và còn 150."
      - show: |
          <p class="note"><b>Bước 5</b> — Python không cấm sửa <code>_so_du</code> — gạch dưới là <b>quy ước</b> “đừng đụng”. Ngôn ngữ khác dùng <code>private</code> để trình biên dịch chặn.</p>
        say: "Bước năm, một lưu ý, ngôn ngữ dùng ở đây không cấm sửa trường có gạch dưới, đó chỉ là quy ước đừng đụng vào, còn ngôn ngữ khác có từ khoá để trình biên dịch chặn hẳn."

  - id: check
    kind: check
    title: "Tự kiểm: máy thử mọi dãy thao tác ngắn"
    checks:
      - "(lambda d: exec('import itertools\\nops = [(\"nap\", 50), (\"rut\", 30), (\"rut\", 80)]\\nlow_safe, low_open, neg = [], [], 0\\nfor seq in itertools.product(ops, repeat=4):\\n    a = alg.Account(40)\\n    b = 40\\n    lo = [40]\\n    lb = 40\\n    for o, x in seq:\\n        try:\\n            getattr(a, o)(x)\\n        except ValueError:\\n            pass\\n        lo.append(a.balance)\\n        b = b + x if o == \"nap\" else b - x\\n        lb = min(lb, b)\\n    low_safe.append(min(lo))\\n    neg += lb < 0\\nn = len(low_safe)\\n', d) or (d['n'], min(d['low_safe']), d['neg']) == (81, 0, 61))({'alg': alg})"
    steps:
      - show: |
          <table class="t"><tr><th>máy thử mọi dãy 4 thao tác, mỗi thao tác là nạp 50, rút 30 hoặc rút 80, từ số dư 40</th><th>kết quả</th></tr>
          <tr><td>số dãy</td><td>$3^4 = 81$</td></tr>
          <tr><td>lớp đóng gói: số dư nhỏ nhất từng thấy</td><td>0 — không bao giờ âm ✓</td></tr>
          <tr><td>lớp lộ trường, trừ thẳng: số dãy từng có số dư âm</td><td class="red">61 trên 81</td></tr></table>
        introduces: [power]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, không đọc mã nữa mà cho máy thử hết. Mỗi dãy có 4 thao tác, mỗi thao tác là nạp 50, rút 30 hoặc rút 80, nên có 3 mũ 4, bằng 81 dãy. Với lớp đóng gói, số dư nhỏ nhất từng thấy là 0, không bao giờ âm. Với lớp lộ trường trừ thẳng, có tới 61 trên 81 dãy từng làm số dư âm."
      - show: |
          <p>Vì sao chắc chắn: mỗi thao tác của lớp đóng gói <b>giữ</b> “số dư ≥ 0”, và lúc tạo nó đúng → đúng sau <b>mọi</b> dãy, dài bao nhiêu cũng vậy. Máy thử chỉ phủ dãy ngắn; lập luận phủ tất cả.</p>
          <div class="chain"><span class="n">lúc tạo: số dư ≥ 0</span><span class="a">→</span><span class="n">mỗi thao tác giữ số dư ≥ 0</span><span class="a">→</span><span class="n">đúng sau mọi dãy</span></div>
        focus: [1, 1, 2]
        say: "Vì sao ta chắc chắn với mọi dãy? Vì lúc tạo, số dư không âm đã đúng, và mỗi thao tác của lớp đóng gói đều giữ điều đó, nên nó đúng sau mọi dãy, dài bao nhiêu cũng vậy. Đây chính là lập luận bất biến, đúng lúc đầu, mỗi bước giữ được, thì đúng mãi."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "(lambda b: (lambda ok1, ok2: (ok1, ok2, b - 80, b - 80 - 80))(80 <= b, 80 <= b))(100) == (True, True, 20, -60)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thêm getter và setter cho mọi trường rồi gọi là đóng gói <b class="red">(sai)</b>
          <br><span class="note"><code>set_so_du(x)</code> không kiểm gì thì vẫn gán được −50, chỉ dài dòng hơn. Đóng gói là mở <b>thao tác nghiệp vụ</b> giữ bất biến, không phải mở từng trường.</span></div>
        say: "Lỗi thứ nhất, thêm hàm đọc và hàm gán cho mọi trường rồi gọi là đóng gói. Hàm gán số dư không kiểm gì thì vẫn gán được âm 50, chỉ dài dòng hơn. Đóng gói là mở các thao tác nghiệp vụ giữ bất biến, không phải mở từng trường."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Trả ra chính danh sách bên trong <b class="red">(rò)</b>
          <br><span class="note">Hàm trả về danh sách giao dịch nội bộ: người gọi thêm, xoá được, phá bất biến. Trả bản sao hoặc dạng chỉ đọc.</span></div>
        say: "Lỗi thứ hai, trả ra chính danh sách bên trong. Hàm trả về danh sách giao dịch nội bộ thì người gọi thêm, xoá được, và phá bất biến, nên hãy trả bản sao hoặc một dạng chỉ đọc."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Bất biến kiểm ở hàm tạo mà quên ở thao tác <b class="red">(hở)</b>
          <br><span class="note">Tạo đúng nhưng sửa sai. Mỗi thao tác công khai đổi trạng thái đều phải giữ bất biến — lập luận ở phần tự kiểm cần <b>cả hai</b>: đúng lúc tạo, và mỗi thao tác giữ được.</span></div>
        say: "Lỗi thứ ba, kiểm bất biến ở hàm tạo mà quên ở các thao tác. Đối tượng tạo ra đúng nhưng bị sửa sai, nên mọi thao tác công khai đổi trạng thái đều phải giữ bất biến. Lập luận ở phần tự kiểm cần cả hai điều, đúng lúc tạo, và mỗi thao tác đều giữ được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Tin rằng “kiểm rồi mới trừ” là đủ khi hai luồng cùng rút <b class="red">(vỡ bất biến)</b></div>
          <table class="t"><tr><th>thứ tự</th><th>luồng thứ nhất</th><th>luồng thứ hai</th><th>số dư</th></tr>
          <tr><td>1</td><td>kiểm 80 ≤ 100: được</td><td></td><td>100</td></tr>
          <tr><td>2</td><td></td><td>kiểm 80 ≤ 100: được</td><td>100</td></tr>
          <tr><td>3</td><td>trừ 80</td><td></td><td>20</td></tr>
          <tr><td>4</td><td></td><td>trừ 80</td><td class="red">−60</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4", "2.5", 1]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, tin rằng kiểm rồi mới trừ là đủ, trong khi máy chủ có hai luồng cùng rút một tài khoản. Bảng dưới đây ghi lại một thứ tự xen kẽ của hai luồng. Luồng thứ nhất kiểm 80 không vượt 100, được. Luồng thứ hai cũng kiểm 80 không vượt 100, cũng được. Luồng thứ nhất trừ, còn 20. Luồng thứ hai trừ tiếp, còn âm 60. Người làm nghề gộp bước kiểm và bước trừ thành một thao tác không bị chen ngang, chẳng hạn bằng khoá, vì đóng gói chỉ bảo vệ bất biến khi mỗi thao tác chạy trọn vẹn."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda a: (a.nap(30), a.rut(50), a.balance)[2])(alg.Account(40)) == 20"
      - "(lambda a: (a.nap(30), a.balance)[1])(alg.Account(40)) == 70 and 40 + 30 - 80 == -10 and -10 - 50 == -60"
    steps:
      - show: |
          <p>Tài khoản mở với 40. Nạp 30, rút 80, rút 50.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Thao tác nào bị từ chối?</td></tr>
          <tr><td>2</td><td>Số dư cuối? Nếu trường bị lộ và trừ thẳng thì số dư cuối là bao nhiêu?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, một tài khoản mở với 40, rồi nạp 30, rút 80, rút 50. Câu một, thao tác nào bị từ chối? Câu hai, số dư cuối là bao nhiêu, và nếu trường bị lộ, trừ thẳng không kiểm, thì số dư cuối là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>thao tác</th><th>kiểm</th><th>số dư</th></tr>
          <tr><td>mở</td><td></td><td>40</td></tr>
          <tr><td>nạp 30</td><td>30 &gt; 0</td><td>70</td></tr>
          <tr><td>rút 80</td><td class="red">80 &gt; 70 → từ chối</td><td>giữ 70</td></tr>
          <tr><td>rút 50</td><td>50 ≤ 70</td><td>$\hl{20}$</td></tr></table>
        focus: [1, "1.3", "1.4", "1.5"]
        say: "Đáp án câu một, lập bảng từng thao tác. Mở với 40, nạp 30 thì thành 70. Rút 80 lớn hơn 70 nên bị từ chối, và số dư giữ nguyên 70. Rút 50 không vượt 70, nên còn 20, đó là đáp án câu hai."
      - clear: true
        show: |
          <p>② Nếu lộ trường, trừ thẳng không kiểm: $40 + 30 - 80 = -10$, rồi $-10 - 50 = \hl{-60}$ — bất biến vỡ ngay ở lần rút đầu.</p>
        say: "Nếu trường bị lộ và trừ thẳng không kiểm, ta có 40 cộng 30 trừ 80, bằng âm 10, rồi trừ tiếp 50, bằng âm 60. Bất biến đã vỡ ngay ở lần rút đầu tiên, và không có lỗi nào báo ra."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bất biến lớp</span><span class="a">→</span>
          <span class="n">giấu trạng thái</span><span class="a">→</span>
          <span class="n">mở thao tác nghiệp vụ, mỗi thao tác giữ bất biến</span><span class="a">→</span>
          <span class="n">không rò dữ liệu bên trong</span></div>
        say: "Tổng kết lại, xác định bất biến của lớp, giấu trạng thái, chỉ mở các thao tác nghiệp vụ và mỗi thao tác giữ bất biến, và không để rò dữ liệu bên trong."
      - show: |
          <div class="box key"><b>Tư duy:</b> đóng gói là trả lời câu hỏi “ai chịu trách nhiệm cho điều này luôn đúng?” — và câu trả lời tốt nhất là “chỉ một chỗ”.</div>
        say: "Điều cần mang theo, đóng gói là trả lời câu hỏi ai chịu trách nhiệm cho điều này luôn đúng, và câu trả lời tốt nhất là chỉ một chỗ."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>kế thừa, đa hình</b> và giao diện.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học kế thừa, đa hình và giao diện. Hẹn gặp bạn ở bài tiếp theo."
