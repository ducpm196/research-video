id: L10
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 10 — Mẫu hành vi: Strategy, Observer, Command"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L10; audit/sdp/verify_sdp.py L10; E. Gamma, R. Helm, R. Johnson, J. Vlissides, Design Patterns (1994), chương 5 (Command, Observer, Strategy)"
assumes: [arith, cdot]
# Quy ước: tên mẫu tiếng Anh chỉ trên màn hình; lời đọc: Strategy = “mẫu chiến lược”, Observer = “mẫu người quan sát”, Command = “mẫu lệnh”.
#   alg.observer_calls(n, k) đếm lời gọi; alg.command_demo() chạy 10 → +5 → ×2 → −3 rồi hoàn tác hai lần.
objectives:
  - "Thay thuật toán lúc chạy bằng mẫu chiến lược"
  - "Đếm số lần thông báo của mẫu người quan sát"
  - "Hoàn tác bằng mẫu lệnh"
asr_reviewed:
  - {sentence: "Xét một đơn nặng 2 ki-lô-gam đi 8 ki-lô-mét, với giá là số minh hoạ.", reason: "ASR chép “Xét 1 đơn nặng 2 kg đi 8 km, với giá là số minh họa.” (0.765): “ki-lô-byte” đọc tách âm tiết, ASR viết “kg” rồi chép “byte” thành “bay/ba”; gam-ma (γ) ASR viết “gamma”; đơn vị mét, ASR viết ký hiệu “m” — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Nút hoàn tác"
    checks:
      - "alg.command_demo() == (27, 30, 15)"
    steps:
      - show: |
          <p>Máy tính bỏ túi bắt đầu từ 10: cộng 5, nhân 2, trừ 3 → 27. Người dùng bấm “hoàn tác” hai lần, mong về 30 rồi 15. Chương trình chỉ lưu con số hiện tại — không biết đã làm gì để mà quay lại.</p>
          <div class="box key">Hôm nay: ba <b>mẫu hành vi</b> — biến hành động thành đối tượng để chọn, phát, và hoàn tác.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một máy tính bỏ túi bắt đầu từ 10, cộng 5, nhân 2, trừ 3, được 27. Người dùng bấm hoàn tác hai lần, mong về 30 rồi về 15. Nhưng chương trình chỉ lưu con số hiện tại, không biết đã làm gì để mà quay lại. Hôm nay ta học ba mẫu hành vi, biến hành động thành đối tượng để chọn, để phát, và để hoàn tác."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ngăn xếp, hàm là giá trị, hai vòng lặp lồng"
    checks:
      - "(lambda s: (s.append(1), s.append(2), s.append(3), s.pop(), s)[3:])([]) == (3, [1, 2])"
      - "(lambda fs: __import__('functools').reduce(lambda x, f: f(x), fs, 10))([lambda x: x + 5, lambda x: x * 2]) == 30 and 10 + 5 == 15"
      - "sum(1 for e in range(4) for n in range(3)) == 12"
    steps:
      - show: |
          <table class="t"><tr><th>thao tác</th><th>ngăn xếp (đỉnh bên phải)</th></tr>
          <tr><td>đặt 1, đặt 2, đặt 3</td><td>[1, 2, 3]</td></tr>
          <tr><td>lấy ra một lần</td><td>được <b>3</b>, còn [1, 2]</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn ngăn xếp, giống một chồng đĩa. Ta đặt lần lượt 1, 2, 3 lên chồng. Lấy ra một lần thì được 3, cái đặt vào sau cùng, và chồng còn 1, 2."
      - show: |
          <div class="code"><div>cac_buoc = [lambda x: x + 5, lambda x: x * 2]</div><div>x = 10</div><div>for f in cac_buoc: x = f(x)      <span class="cm"># 10 → 15 → 30</span></div></div>
        focus: [1, 1]
        say: "Thứ hai, trong ngôn ngữ ta dùng, một hàm cũng là một giá trị, cất được vào danh sách như một con số. Danh sách này có hai hàm, cộng 5 và nhân 2, chạy lần lượt từ 10 được 15, rồi 30."
      - show: |
          <table class="t"><tr><th>vòng ngoài</th><th>vòng trong</th><th>số lần chạy thân</th></tr>
          <tr><td>4 sự kiện</td><td>3 người nghe</td><td>$4 \cdot 3 = \hl{12}$</td></tr></table>
        introduces: [cdot]
        focus: [1, "1.2"]
        say: "Thứ ba, hai vòng lặp lồng nhau. Vòng ngoài chạy qua 4 sự kiện, mỗi lần vòng trong chạy qua 3 người nghe, nên thân vòng trong chạy 4 nhân 3 bằng 12 lần."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: ba mẫu hành vi"
    steps:
      - show: |
          <table class="t"><tr><th>mẫu</th><th>làm gì</th></tr>
          <tr><td><b>Strategy</b> (chiến lược)</td><td>thuật toán là một đối tượng truyền vào; đổi được lúc chạy (cách tính phí giao hàng, cách sắp xếp)</td></tr>
          <tr><td><b>Observer</b> (người quan sát)</td><td>đối tượng phát sự kiện giữ danh sách người nghe; mỗi sự kiện gọi <b>mọi</b> người nghe</td></tr>
          <tr><td><b>Command</b> (lệnh)</td><td>mỗi hành động là một đối tượng có <code>lam()</code> và <code>hoan_tac()</code>; lưu lại thành lịch sử</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng so ba mẫu hành vi. Mẫu chiến lược coi thuật toán là một đối tượng được truyền vào, đổi được lúc chạy, như cách tính phí giao hàng hay cách sắp xếp. Mẫu người quan sát cho đối tượng phát sự kiện giữ một danh sách người nghe, mỗi sự kiện gọi tới mọi người nghe. Mẫu lệnh biến mỗi hành động thành một đối tượng có phép làm và phép hoàn tác, rồi lưu lại thành lịch sử."

  - id: intuition
    kind: intuition
    title: "Ba mẫu, ba đường đi của lời gọi"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><defs><marker id="arD10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937"><text x="240" y="36">chiến lược</text><text x="740" y="36">người quan sát</text><text x="1240" y="36">lệnh</text></g><rect x="110" y="270" width="260" height="70" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="240" y="313" font-size="22" text-anchor="middle" fill="#1f2937">tính phí giao(cách)</text><rect x="40" y="90" width="190" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8"/><text x="135" y="128" font-size="20" text-anchor="middle" fill="#1f2937">theo cân nặng</text><rect x="260" y="90" width="190" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8"/><text x="355" y="128" font-size="20" text-anchor="middle" fill="#1f2937">theo khoảng cách</text><g stroke="#1f2937" stroke-width="3" stroke-dasharray="10 8"><line x1="135" y1="150" x2="200" y2="266" marker-end="url(#arD10)"/><line x1="355" y1="150" x2="290" y2="266" marker-end="url(#arD10)"/></g><text x="240" y="390" font-size="21" text-anchor="middle" fill="#059669">cắm cách nào vào cũng chạy</text><rect x="640" y="90" width="200" height="60" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="740" y="128" font-size="22" text-anchor="middle" fill="#1f2937">nơi phát</text><rect x="560" y="270" width="120" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="620" y="308" font-size="22" text-anchor="middle" fill="#1f2937">nghe 1</text><rect x="690" y="270" width="120" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="750" y="308" font-size="22" text-anchor="middle" fill="#1f2937">nghe 2</text><rect x="820" y="270" width="120" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="880" y="308" font-size="22" text-anchor="middle" fill="#1f2937">nghe 3</text><g stroke="#1f2937" stroke-width="3"><line x1="700" y1="150" x2="625" y2="266" marker-end="url(#arD10)"/><line x1="740" y1="150" x2="750" y2="266" marker-end="url(#arD10)"/><line x1="780" y1="150" x2="875" y2="266" marker-end="url(#arD10)"/></g><text x="750" y="390" font-size="21" text-anchor="middle" fill="#059669">1 sự kiện → 3 lời gọi</text><rect x="1100" y="110" width="230" height="60" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="1215" y="148" font-size="22" text-anchor="middle" fill="#1f2937">trừ 3 (đỉnh)</text><rect x="1100" y="180" width="230" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1215" y="218" font-size="22" text-anchor="middle" fill="#1f2937">nhân 2</text><rect x="1100" y="250" width="230" height="60" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1215" y="288" font-size="22" text-anchor="middle" fill="#1f2937">cộng 5</text><line x1="1080" y1="310" x2="1350" y2="310" stroke="#1f2937" stroke-width="4"/><path d="M1340,140 C1420,140 1420,90 1400,70" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arD10)"/><text x="1395" y="60" font-size="20" text-anchor="middle" fill="#b91c1c">hoàn tác: lấy ở đỉnh</text><text x="1215" y="350" font-size="21" text-anchor="middle" fill="#1f2937">lịch sử lệnh</text><text x="1215" y="390" font-size="21" text-anchor="middle" fill="#059669">27 → 30 → 15</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đặt ba mẫu cạnh nhau. Bên trái, phép tính phí giao có một chỗ cắm, cắm cách theo cân nặng hay theo khoảng cách vào đều chạy được. Ở giữa, nơi phát nối tới ba người nghe, nên mỗi sự kiện sinh ra ba lời gọi. Bên phải, các lệnh đã làm xếp thành một chồng, và hoàn tác luôn lấy lệnh ở đỉnh chồng ra trước."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Lệnh có hoàn tác, người nghe đếm được, chiến lược đổi được"
    checks:
      - "alg.command_demo() == (27, 30, 15) and ((10 + 5) * 2 - 3) == 27"
      - "alg.observer_calls(3, 4) == 12"
      - "(lambda phi, d: (phi(d, lambda d: d['kg'] * 10000), phi(d, lambda d: d['km'] * 3000)))(lambda don, cach: cach(don), {'kg': 2, 'km': 8}) == (20000, 24000)"
    steps:
      - show: |
          <p><b>Bước 1</b> — chạy ba lệnh, mỗi lệnh xong thì đặt lên lịch sử:</p>
          <table class="t"><tr><th>lệnh</th><th>làm</th><th>hoàn tác</th><th>giá trị</th></tr>
          <tr><td>khởi đầu</td><td></td><td></td><td>10</td></tr>
          <tr><td>cộng 5</td><td>$x + 5$</td><td>$x - 5$</td><td>15</td></tr>
          <tr><td>nhân 2</td><td>$x \cdot 2$</td><td>$x : 2$</td><td>30</td></tr>
          <tr><td>trừ 3</td><td>$x - 3$</td><td>$x + 3$</td><td>$\hl{27}$</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Bước một, bảng ghi từng lệnh cùng phép làm và phép hoàn tác của nó, mỗi lệnh xong thì được đặt lên lịch sử. Bắt đầu từ 10. Lệnh cộng 5 đưa lên 15, hoàn tác của nó là trừ 5. Lệnh nhân 2 đưa lên 30, hoàn tác là chia 2. Lệnh trừ 3 đưa về 27, hoàn tác là cộng 3."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>lấy ở đỉnh lịch sử</th><th>làm phép ngược</th><th>giá trị</th></tr>
          <tr><td><b>Bước 2</b> — hoàn tác lần 1</td><td>trừ 3</td><td>$27 + 3$</td><td>$\hl{30}$</td></tr>
          <tr><td><b>Bước 3</b> — hoàn tác lần 2</td><td>nhân 2</td><td>$30 : 2$</td><td>$\hl{15}$</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Hoàn tác lấy lệnh cuối cùng trong lịch sử ra như một ngăn xếp. Bước hai, hoàn tác lần đầu lấy ra lệnh trừ 3, làm phép ngược là cộng 3, từ 27 về 30. Bước ba, hoàn tác lần hai lấy ra lệnh nhân 2, làm phép ngược là chia 2, từ 30 về 15."
      - show: |
          <p><b>Bước 4</b> — người quan sát: 3 người nghe đăng ký, phát 4 sự kiện.</p>
          <table class="t"><tr><th>sự kiện</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>lời gọi cộng dồn</td><td>3</td><td>6</td><td>9</td><td>$\hl{12}$</td></tr></table>
          <p class="note">Nơi phát không biết ai nghe; thêm người nghe thứ tư không sửa nơi phát.</p>
        focus: [1, 2, 3]
        say: "Bước bốn, với mẫu người quan sát, 3 người nghe đã đăng ký và nơi phát phát ra 4 sự kiện. Mỗi sự kiện thêm 3 lời gọi, cộng dồn 3, 6, 9, rồi 12. Nơi phát không cần biết ai đang nghe, thêm người nghe thứ tư cũng không phải sửa nơi phát."
      - clear: true
        show: |
          <div class="code"><div>def phi_giao(don, cach): return cach(don)        <span class="cm"># chiến lược là tham số</span></div><div>theo_can = lambda d: d["kg"] * 10000</div><div>theo_km  = lambda d: d["km"] * 3000</div></div>
          <p><b>Bước 5</b> — mẫu chiến lược, đơn 2 kg đi 8 km (giá là số minh hoạ):</p>
          <table class="t"><tr><th>chiến lược truyền vào</th><th>tính</th><th>phí giao</th></tr>
          <tr><td><code>theo_can</code></td><td>$2 \cdot 10\,000$</td><td>20 000</td></tr>
          <tr><td><code>theo_km</code></td><td>$8 \cdot 3\,000$</td><td>$\hl{24\,000}$</td></tr></table>
        focus: [1, 2, "3.2", "3.3", 1]
        say: "Bước năm, mẫu chiến lược, hàm tính phí giao nhận cách tính làm tham số rồi chỉ việc gọi nó. Xét một đơn nặng 2 ki-lô-gam đi 8 ki-lô-mét, với giá là số minh hoạ. Truyền cách tính theo cân nặng thì được 2 nhân 10 nghìn, bằng 20 nghìn. Đổi sang cách tính theo khoảng cách lúc chạy thì được 8 nhân 3 nghìn, bằng 24 nghìn. Hàm tính phí giao không đổi một chữ, chỉ thứ truyền vào là khác."

  - id: check
    kind: check
    title: "Tự kiểm: chạy lại từ đầu, đếm theo từng người nghe"
    checks:
      - "(10 + 5) * 2 == alg.command_demo()[1] and 10 + 5 == alg.command_demo()[2]"
      - "sum(4 for n in range(3)) == 4 + 4 + 4 == alg.observer_calls(3, 4)"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác</th><th>kết quả</th></tr>
          <tr><td>30 sau hoàn tác 1</td><td>chạy lại từ 10, chỉ hai lệnh đầu: $(10 + 5) \cdot 2$</td><td>30 ✓</td></tr>
          <tr><td>15 sau hoàn tác 2</td><td>chạy lại từ 10, chỉ lệnh đầu: $10 + 5$</td><td>15 ✓</td></tr>
          <tr><td>12 lời gọi</td><td>đếm theo người nghe: mỗi người nhận 4 sự kiện, $4 + 4 + 4$</td><td>12 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, không dùng phép hoàn tác. Chạy lại từ 10 chỉ với hai lệnh đầu, 10 cộng 5 rồi nhân 2, được 30, khớp kết quả hoàn tác lần đầu. Chạy lại chỉ với lệnh đầu được 15, khớp lần hai. Đếm lời gọi theo từng người nghe, mỗi người nhận 4 sự kiện, 4 cộng 4 cộng 4 vẫn là 12."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "7 // 2 == 3 and 3 * 2 == 6"
      - "(lambda a, b: (sum(a), 4 * sum(a), sum(b), 4 * sum(b)))([5, 5, 200], [5, 5, 1]) == (210, 840, 11, 44)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Người nghe quên huỷ đăng ký <b class="red">(rò bộ nhớ)</b>
          <br><span class="note">Nơi phát vẫn giữ tham chiếu tới người nghe đã đóng: bộ nhớ không được thu hồi, và sự kiện gọi tới đối tượng “đã chết”. Đăng ký ở đâu thì huỷ ở chỗ đối xứng.</span></div>
        say: "Lỗi thứ nhất, người nghe quên huỷ đăng ký. Nơi phát vẫn giữ tham chiếu tới người nghe đã đóng, nên bộ nhớ không được thu hồi, và sự kiện vẫn gọi tới một đối tượng đã chết. Đăng ký ở đâu thì phải huỷ ở chỗ đối xứng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Hoàn tác không thật sự ngược <b class="red">(mất dữ liệu)</b>
          <br><span class="note">Lệnh “chia nguyên cho 2” trên số lẻ: 7 → 3, nhân 2 → 6 ≠ 7. Lệnh mất thông tin phải lưu giá trị cũ để hoàn tác.</span></div>
        say: "Lỗi thứ hai, phép hoàn tác không thật sự ngược. Lệnh chia nguyên cho 2 trên số lẻ, 7 thành 3, nhân lại 2 chỉ được 6, khác 7. Lệnh làm mất thông tin phải lưu giá trị cũ để hoàn tác."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chuỗi người quan sát gọi vòng <b class="red">(lặp vô hạn)</b>
          <br><span class="note">A đổi → báo B → B đổi → báo A → … Thiết kế luồng sự kiện một chiều, hoặc bỏ qua khi giá trị không đổi.</span></div>
        say: "Lỗi thứ ba, chuỗi người quan sát gọi vòng. A đổi thì báo B, B đổi thì lại báo A, mãi không dừng, nên hãy thiết kế luồng sự kiện một chiều, hoặc bỏ qua khi giá trị không đổi."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Người nghe chậm làm chậm cả nơi phát <b class="red">(gọi lần lượt, chờ nhau)</b></div>
          <table class="t"><tr><th>giả sử 3 người nghe</th><th>mỗi sự kiện chờ</th><th>4 sự kiện</th></tr>
          <tr><td>ghi sổ 5 ms, cập nhật màn hình 5 ms, gửi thư 200 ms</td><td>$5 + 5 + 200 = 210$ ms</td><td>840 ms</td></tr>
          <tr><td>gửi thư chỉ đặt vào hàng đợi, 1 ms</td><td>$5 + 5 + 1 = 11$ ms</td><td>44 ms</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, nơi phát gọi người nghe lần lượt, và phải chờ người trước xong mới gọi người sau. Giả sử ghi sổ mất 5 mi li giây, cập nhật màn hình 5, gửi thư 200, thì mỗi sự kiện phải chờ 210, và 4 sự kiện là 840 mi li giây. Nếu người nghe gửi thư chỉ đặt việc vào hàng đợi trong 1 mi li giây, mỗi sự kiện còn 11, và 4 sự kiện chỉ 44. Người làm nghề đo thời gian từng người nghe, và đẩy việc chậm ra hàng đợi để nơi phát không bị kéo theo."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[5 * k for k in range(1, 7)] == [5, 10, 15, 20, 25, 30] and 6 * 3 == 18"
      - "alg.observer_calls(5, 6) == 30 and (lambda x: (x * 3 + 4, (x * 3 + 4) - 4))(6) == (22, 18)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>5 người nghe, 6 sự kiện: bao nhiêu lời gọi?</td></tr>
          <tr><td>2</td><td>Từ 6: nhân 3, cộng 4. Hoàn tác một lần được bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 5 người nghe và 6 sự kiện thì có bao nhiêu lời gọi? Câu hai, từ 6, nhân 3 rồi cộng 4. Hoàn tác một lần thì được bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Mỗi sự kiện gọi cả 5 người nghe; có 6 sự kiện → $5 \cdot 6 = \hl{30}$ lời gọi.</p>
          <table class="t"><tr><th>sự kiện</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
          <tr><td>cộng dồn</td><td>5</td><td>10</td><td>15</td><td>20</td><td>25</td><td>30</td></tr></table>
        focus: [1, 2]
        say: "Đáp án câu một, mỗi sự kiện gọi cả 5 người nghe, có 6 sự kiện nên 5 nhân 6 bằng 30 lời gọi. Bảng cộng dồn 5, 10, 15, 20, 25, rồi 30."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>giá trị</th><th>lịch sử</th></tr>
          <tr><td>khởi đầu</td><td>6</td><td>[ ]</td></tr>
          <tr><td>nhân 3</td><td>18</td><td>[nhân 3]</td></tr>
          <tr><td>cộng 4</td><td>22</td><td>[nhân 3, cộng 4]</td></tr>
          <tr><td>hoàn tác: lấy “cộng 4”, làm $22 - 4$</td><td>$\hl{18}$</td><td>[nhân 3]</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Câu hai, theo dõi cả giá trị lẫn lịch sử. Khởi đầu là 6, lịch sử trống. Nhân 3 được 18. Cộng 4 được 22, lịch sử có hai lệnh. Hoàn tác lấy lệnh cuối là cộng 4 ra, làm phép ngược 22 trừ 4, về 18."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chiến lược: thuật toán là tham số</span><span class="a">→</span>
          <span class="n">người quan sát: phát cho mọi người nghe</span><span class="a">→</span>
          <span class="n">lệnh: hành động có hoàn tác, lưu lịch sử</span></div>
        say: "Tổng kết lại, mẫu chiến lược coi thuật toán là tham số, mẫu người quan sát phát sự kiện cho mọi người nghe, và mẫu lệnh biến hành động thành đối tượng có hoàn tác."
      - show: |
          <div class="box key"><b>Tư duy:</b> khi hành động cần được chọn, lưu, gửi đi hay quay lại — hãy biến nó thành <b>dữ liệu</b>.</div>
        say: "Điều cần mang theo, khi một hành động cần được chọn, lưu, gửi đi hay quay lại, hãy biến nó thành dữ liệu."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 11): mẫu <b>trạng thái</b>, mẫu <b>duyệt</b> và mẫu <b>khuôn thuật toán</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 11, ta học mẫu trạng thái, mẫu duyệt, và mẫu khuôn thuật toán. Hẹn gặp bạn ở bài tiếp theo."
