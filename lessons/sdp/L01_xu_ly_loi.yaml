id: L01
course: SDP
series: "SDP · Kỹ thuật lập trình và mẫu thiết kế"
title: "Bài 1 — Xử lý lỗi: mã lỗi, ngoại lệ, thất bại sớm"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/sdp.yaml L01; audit/sdp/verify_sdp.py L01; J. Shore, Fail Fast, IEEE Software 21(5), 2004; Python Language Reference, mục 8.4 (câu lệnh try); ISO/IEC 9899:2018 (C17) mục 7.22.1.2 (atoi không báo lỗi); SWF bài 0 (tiền điều kiện)"
assumes: [arith]
# Quy ước: mã minh hoạ Python. alg.parse_prefix mô phỏng kiểu atoi của C (đọc chữ số ở đầu, dừng âm thầm ở kí tự lạ, chuỗi không có chữ số → 0);
#   alg.int_or_error gọi int() của Python và trả tên ngoại lệ. Lời đọc mô tả bằng tiếng Việt, không đọc từ khoá.
objectives:
  - "Phân biệt mã lỗi và ngoại lệ"
  - "Áp dụng nguyên tắc thất bại sớm"
  - "Không nuốt lỗi"
asr_reviewed:
  - {sentence: "Chuỗi x gặp kí tự lạ ngay, nên trả 0 mà không báo gì.", reason: "ASR chép “Chủy ít gặp ký từ lạ ngay nên trả không mà không báo gì.” (0.786): lệch âm/thanh thuần Việt: chuỗi/chuỷ, kí tự/ký từ — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“12a” thành 12, không ai biết"
    checks:
      - "alg.parse_prefix('12a') == 12 and alg.int_or_error('12a') == 'ValueError'"
    steps:
      - show: |
          <p>Khách gõ nhầm số lượng “12a”. Hàm đọc số kiểu cũ dừng ở chữ “a”, trả về $\hl{12}$ — đơn hàng đi tiếp với con số khách không hề nhập. Hàm <code>int("12a")</code> của Python thì báo lỗi ngay.</p>
          <div class="box key">Hôm nay: <b>xử lý lỗi</b> — báo lỗi thế nào, ở đâu, và vì sao <b>thất bại sớm</b> tốt hơn chạy tiếp với dữ liệu sai.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, khách gõ nhầm số lượng thành 12a. Một hàm đọc số kiểu cũ dừng ở chữ a và trả về 12, đơn hàng đi tiếp với con số khách không hề nhập. Còn hàm chuyển chuỗi thành số nguyên có sẵn của ngôn ngữ thì báo lỗi ngay. Hôm nay ta học xử lý lỗi, báo lỗi thế nào, ở đâu, và vì sao thất bại sớm tốt hơn chạy tiếp với dữ liệu sai."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chuỗi thành số, và khối thử–bắt lỗi"
    checks:
      - "(lambda n1: (n1, n1 * 10 + 2))(0 * 10 + 1) == (1, 12) == (alg.parse_prefix('1'), alg.parse_prefix('12'))"
      - "alg.int_or_error('7') == 7 and alg.int_or_error('a') == 'ValueError'"
    steps:
      - show: |
          <p>Chuỗi <code>"12"</code> là hai <b>kí tự</b> <code>'1'</code>, <code>'2'</code>, chưa phải số. Đổi thành số: đọc từng chữ số, nhân số cũ với 10 rồi cộng.</p>
          <table class="t"><tr><th>đọc kí tự</th><th>số đang có</th></tr>
          <tr><td>(bắt đầu)</td><td>0</td></tr>
          <tr><td><code>'1'</code></td><td>0 × 10 + 1 = 1</td></tr>
          <tr><td><code>'2'</code></td><td>1 × 10 + 2 = $\hl{12}$</td></tr></table>
        focus: [1, 2, "2.3", "2.4"]
        say: "Trước hết, chuỗi 12 là hai kí tự một và hai, chưa phải là số. Để đổi thành số, máy đọc từng chữ số, nhân số đang có với 10 rồi cộng chữ số mới. Đọc kí tự một, được 0 nhân 10 cộng 1, bằng 1. Đọc kí tự hai, được 1 nhân 10 cộng 2, bằng 12."
      - clear: true
        show: |
          <div class="code"><div>try:</div><div>    n = int(s)</div><div>except ValueError:</div><div>    n = None</div></div>
          <table class="t"><tr><th>s</th><th>lệnh trong khối thử</th><th>đi tiếp tới đâu</th></tr>
          <tr><td><code>"7"</code></td><td>chạy xong, n = 7</td><td>bỏ qua khối bắt lỗi</td></tr>
          <tr><td><code>"a"</code></td><td>báo ValueError</td><td>nhảy ngay xuống khối bắt lỗi</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Tiếp theo là khối thử và bắt lỗi. Máy chạy lệnh trong khối thử, nếu có lỗi thì nhảy ngay xuống khối bắt lỗi. Với chuỗi 7, lệnh chạy xong, n bằng 7, và khối bắt lỗi bị bỏ qua. Với chuỗi a, lệnh báo lỗi giá trị, nên máy bỏ dở và nhảy ngay xuống khối bắt lỗi."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: mã lỗi và ngoại lệ"
    checks:
      - "alg.parse_prefix('abc') == 0 == alg.parse_prefix('0')"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>làm gì</th><th>rủi ro</th></tr>
          <tr><td><b>mã lỗi</b></td><td>trả về một giá trị đặc biệt (−1, 0, null)</td><td>người gọi quên kiểm; giá trị đặc biệt trùng giá trị hợp lệ (đọc “abc” ra 0, đọc “0” cũng ra 0)</td></tr>
          <tr><td><b>ngoại lệ</b></td><td>dừng luồng bình thường, nhảy tới chỗ bắt lỗi</td><td>không ai bắt thì chương trình dừng — nhưng <b>không âm thầm sai</b></td></tr></table>
          <div class="box key"><b>Thất bại sớm</b>: phát hiện dữ liệu sai ở chỗ gần nguồn nhất và dừng ngay, với thông báo rõ — thay vì để sai lan đi xa rồi mới lộ.</div>
        focus: [1, "1.2", "1.2", "1.3", 2]
        say: "Có hai cách báo lỗi. Mã lỗi là trả về một giá trị đặc biệt như âm 1, 0, hay rỗng. Rủi ro là người gọi quên kiểm, và giá trị đặc biệt trùng giá trị hợp lệ, chẳng hạn đọc chuỗi a b c ra 0, mà đọc chuỗi 0 cũng ra 0. Ngoại lệ là dừng luồng bình thường và nhảy tới chỗ bắt lỗi, không ai bắt thì chương trình dừng, nhưng không âm thầm sai. Thất bại sớm nghĩa là phát hiện dữ liệu sai ở chỗ gần nguồn nhất và dừng ngay với thông báo rõ, thay vì để cái sai lan đi xa rồi mới lộ."

  - id: intuition
    kind: intuition
    title: "Lỗi đi đâu sau khi xảy ra"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><defs><marker id="arD1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="40" y="155" width="220" height="70" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="150" y="199" font-size="24" text-anchor="middle" fill="#1f2937">ô nhập “12a”</text><rect x="350" y="55" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="460" y="99" font-size="24" text-anchor="middle" fill="#1f2937">đọc số kiểu cũ</text><rect x="690" y="55" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="800" y="99" font-size="24" text-anchor="middle" fill="#1f2937">tạo đơn 12 cái</text><rect x="1000" y="55" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="1110" y="99" font-size="24" text-anchor="middle" fill="#1f2937">kho, giao hàng</text><rect x="1270" y="55" width="200" height="70" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><text x="1370" y="99" font-size="24" text-anchor="middle" fill="#1f2937">khách nhận sai</text><rect x="350" y="255" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="460" y="299" font-size="24" text-anchor="middle" fill="#1f2937">int()</text><rect x="620" y="255" width="200" height="70" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="720" y="299" font-size="24" text-anchor="middle" fill="#1f2937">ValueError</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="260" y1="170" x2="348" y2="102" marker-end="url(#arD1)"/><line x1="570" y1="90" x2="688" y2="90" marker-end="url(#arD1)"/><line x1="910" y1="90" x2="998" y2="90" marker-end="url(#arD1)"/><line x1="1220" y1="90" x2="1268" y2="90" marker-end="url(#arD1)"/><line x1="260" y1="210" x2="348" y2="278" marker-end="url(#arD1)"/><line x1="570" y1="290" x2="618" y2="290" marker-end="url(#arD1)"/></g><path d="M720,325 C720,395 150,395 150,227" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arD1)"/><g font-size="24"><text x="629" y="76" text-anchor="middle" fill="#1f2937">12</text><text x="900" y="160" text-anchor="middle" fill="#b91c1c">chạy tiếp với số sai: lỗi lộ ra ở cuối chuỗi</text><text x="860" y="282" fill="#059669">dừng ngay ở biên,</text><text x="860" y="316" fill="#059669">khách được báo nhập lại</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình đặt hai đường đi của cùng chuỗi 12a cạnh nhau. Đường trên, hàm đọc số kiểu cũ lặng lẽ trả 12, đơn 12 cái được tạo, kho xuất hàng, và cái sai chỉ lộ ra khi khách nhận nhầm. Đường dưới, hàm chuyển số nguyên báo lỗi ngay, lỗi quay về ô nhập, nên khách được báo nhập lại khi cái sai còn ở gần nguồn."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Kiểm ở biên, tin ở trong"
    checks:
      - "(lambda d: exec('def doc_so_luong(chuoi):\\n    n = int(chuoi)\\n    if n <= 0:\\n        raise ValueError(f\"số lượng phải dương, nhận {n}\")\\n    return n\\ndef thu(s):\\n    try:\\n        return doc_so_luong(s)\\n    except ValueError as e:\\n        return str(e)\\n', d) or ([d['thu']('12'), d['thu']('0'), d['thu'](' 7 ')] == [12, 'số lượng phải dương, nhận 0', 7] and d['thu']('12a').startswith('invalid literal') and d['thu']('').startswith('invalid literal')))({})"
      - "alg.int_or_error('12') == 12 and alg.int_or_error(' 7 ') == 7 and alg.int_or_error('') == 'ValueError'"
      - "alg.int_or_error('12') > 0 and alg.int_or_error('12') * 5000 == 60000"
    steps:
      - show: |
          <div class="code"><div>def doc_so_luong(chuoi):</div><div>    n = int(chuoi)</div><div>    if n &lt;= 0:</div><div>        raise ValueError(f"số lượng phải dương, nhận {n}")</div><div>    return n</div></div>
          <p><b>Bước 1</b> — <code>doc_so_luong("12")</code>: <code>int</code> cho 12; 12 &gt; 0 nên không báo lỗi → trả $\hl{12}$.</p>
        focus: [1, 1, 2, 2]
        say: "Hàm đọc số lượng chuyển chuỗi thành số nguyên. Tiếp theo nó kiểm số lượng phải dương, và nếu không dương, nó báo lỗi kèm giá trị đã nhận. Bước một, chạy với chuỗi 12, hàm chuyển cho số 12. Vì 12 lớn hơn 0, hàm trả về 12."
      - show: |
          <table class="t"><tr><th>bước</th><th>vào</th><th>dòng <code>int</code></th><th>kiểm dương</th><th>kết quả</th></tr>
          <tr><td>2</td><td><code>"12a"</code></td><td class="red">ValueError</td><td>không tới</td><td>báo lỗi ngay</td></tr>
          <tr><td>3</td><td><code>"0"</code></td><td>0</td><td class="red">0 ≤ 0</td><td>“số lượng phải dương, nhận 0”</td></tr>
          <tr><td>4</td><td><code>" 7 "</code></td><td>7</td><td>7 &gt; 0</td><td>trả 7</td></tr>
          <tr><td>5</td><td><code>""</code></td><td class="red">ValueError</td><td>không tới</td><td>báo lỗi ngay</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng chạy tiếp bốn bước, mỗi dòng một đầu vào. Bước hai, chuỗi 12a báo lỗi giá trị ngay tại dòng chuyển số, chưa tới dòng kiểm dương. Bước ba, chuỗi 0 chuyển được thành số 0, nhưng 0 không dương, nên hàm báo lỗi kèm giá trị 0. Bước bốn, chuỗi 7 có dấu cách hai đầu vẫn cho 7, vì hàm chuyển số bỏ qua dấu cách ở hai đầu. Bước năm, chuỗi rỗng thì báo lỗi ngay."
      - clear: true
        show: |
          <p><b>Bước 6</b> — đặt việc kiểm ở đâu: một lần ở <b>biên</b> (nơi dữ liệu từ ngoài vào: ô nhập, tệp, mạng). Bên trong, mỗi hàm ghi rõ <b>tiền điều kiện</b> — điều người gọi phải bảo đảm trước khi gọi — và được phép tin nó.</p>
          <table class="t"><tr><th>hàm bên trong</th><th>tiền điều kiện</th><th>biên đã kiểm</th><th>hàm chỉ việc tính</th></tr>
          <tr><td><code>tinh_tien(so_luong, gia)</code></td><td><code>so_luong &gt; 0</code></td><td>12 &gt; 0 ✓</td><td>$12 \times 5\,000 = 60\,000$</td></tr></table>
          <div class="box key">Thông báo lỗi tốt nói: giá trị nào, sai ở đâu, mong đợi gì. “Có lỗi xảy ra” thì không giúp ai sửa.</div>
        focus: [1, 1, 1, "2.2", 3]
        say: "Bước sáu, quyết định đặt việc kiểm ở đâu. Ta kiểm một lần ở biên, nơi dữ liệu từ ngoài vào như ô nhập, tệp, mạng. Bên trong, mỗi hàm ghi rõ tiền điều kiện của nó, tức điều người gọi phải bảo đảm trước khi gọi, và hàm được phép tin điều đó. Chẳng hạn hàm tính tiền có tiền điều kiện là số lượng dương, biên đã kiểm số 12 rồi, nên hàm chỉ việc lấy 12 nhân 5 nghìn, bằng 60 nghìn, mà không kiểm lại. Thông báo lỗi tốt nói rõ giá trị nào, sai ở đâu, mong đợi gì, còn câu có lỗi xảy ra thì không giúp ai sửa."

  - id: check
    kind: check
    title: "Tự kiểm: chạy tay và thử hết các chuỗi ngắn"
    checks:
      - "alg.parse_prefix('12a') == 12 and alg.parse_prefix('3x5') == 3"
      - "(lambda S: (len(S), sum(alg.int_or_error(s) == 'ValueError' for s in S), sum(isinstance(alg.parse_prefix(s), int) for s in S if alg.int_or_error(s) == 'ValueError')))([a + b for a in '0123456789a' for b in '0123456789a']) == (121, 21, 21)"
    steps:
      - show: |
          <table class="t"><tr><th>hàm kiểu cũ đọc <code>"12a"</code></th><th>số đang có</th></tr>
          <tr><td><code>'1'</code> là chữ số</td><td>1</td></tr>
          <tr><td><code>'2'</code> là chữ số</td><td>12</td></tr>
          <tr><td><code>'a'</code> không phải chữ số</td><td class="red">dừng, trả 12, không báo gì</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, chạy tay hàm kiểu cũ trên chuỗi 12a, theo đúng cách đổi chuỗi thành số đã ôn. Kí tự một cho số 1. Kí tự hai cho số 12. Kí tự a không phải chữ số, nên hàm dừng và trả 12 mà không báo gì, khớp với điều ta thấy ở đầu bài."
      - show: |
          <table class="t"><tr><th>máy thử mọi chuỗi 2 kí tự từ 0 … 9 và a</th><th>số chuỗi</th></tr>
          <tr><td>tất cả</td><td>$11 \times 11 = 121$</td></tr>
          <tr><td><code>int</code> báo lỗi (có chữ a)</td><td>$121 - 100 = 21$</td></tr>
          <tr><td>trong 21 chuỗi đó, hàm kiểu cũ vẫn trả một con số</td><td class="red">21, không báo lỗi lần nào</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Rồi cho máy thử hết các chuỗi hai kí tự, mỗi kí tự là một chữ số hoặc chữ a. Có 11 nhân 11, bằng 121 chuỗi. Hàm chuyển số nguyên báo lỗi ở 121 trừ 100, bằng 21 chuỗi có chữ a. Trong cả 21 chuỗi đó, hàm kiểu cũ vẫn trả về một con số mà không báo lỗi lần nào, nên lỗi của nó không phải chuyện hiếm."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "4 lỗi hay gặp"
    checks:
      - "[alg.int_or_error('12a') for _ in range(1 + 3)] == ['ValueError'] * 4 and sum(alg.backoff(1000, 60000, 3)) == 7000 and alg.backoff(1000, 60000, 3) == [1000, 2000, 4000]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nuốt ngoại lệ: <code>except: pass</code> <b class="red">(nguy hiểm)</b>
          <br><span class="note">Lỗi rõ ràng biến thành dữ liệu sai lặng lẽ, lộ ra rất xa nơi gây lỗi. Chỉ bắt loại lỗi mình xử lý được, và xử lý thật (ghi nhật ký, thử lại, báo người dùng).</span></div>
        say: "Lỗi thứ nhất, nuốt ngoại lệ, bắt mọi lỗi rồi bỏ qua. Lỗi rõ ràng biến thành dữ liệu sai lặng lẽ, lộ ra rất xa nơi gây lỗi. Hãy chỉ bắt loại lỗi mình xử lý được, và xử lý thật, như ghi nhật ký, thử lại, hay báo người dùng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Mã lỗi trùng giá trị hợp lệ <b class="red">(mơ hồ)</b>
          <br><span class="note">Hàm đọc nhiệt độ trả −1 khi lỗi, nhưng −1 °C là nhiệt độ thật. Dùng ngoại lệ, hoặc trả cặp (kết quả, lỗi) tách bạch.</span></div>
        say: "Lỗi thứ hai, mã lỗi trùng giá trị hợp lệ. Hàm đọc nhiệt độ trả âm 1 khi lỗi, nhưng âm 1 độ là một nhiệt độ thật, nên hãy dùng ngoại lệ, hoặc trả về một cặp kết quả và lỗi tách bạch."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Kiểm cùng một điều ở mọi tầng <b class="red">(rối)</b>
          <br><span class="note">Mười hàm đều tự kiểm “số lượng dương” với mười thông báo khác nhau. Kiểm ở biên một lần; bên trong dùng khẳng định khi chạy thử để bắt lỗi lập trình.</span></div>
        say: "Lỗi thứ ba, kiểm cùng một điều ở mọi tầng. Mười hàm đều tự kiểm số lượng dương với mười thông báo khác nhau, nên hãy kiểm ở biên một lần, còn bên trong dùng lệnh khẳng định khi chạy thử để bắt lỗi lập trình."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Bọc mọi lời gọi trong “thử lại 3 lần”, kể cả lỗi của người gọi <b class="red">(vô ích)</b></div>
          <table class="t"><tr><th>loại lỗi</th><th>ví dụ</th><th>gọi lần đầu, rồi thử lại 3 lần, chờ 1, 2, 4 giây trước mỗi lần</th></tr>
          <tr><td>lỗi của người gọi</td><td><code>int("12a")</code></td><td class="red">cả 4 lần đều ValueError, mất thêm 7 giây chờ</td></tr>
          <tr><td>lỗi môi trường</td><td>mạng chập chờn, hết thời gian chờ</td><td>có thể thành công ở lần sau</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, bọc mọi lời gọi trong một vòng thử lại 3 lần, kể cả khi lỗi là do người gọi. Bảng so hai loại lỗi. Chuỗi 12a sai thì lần gọi đầu và cả 3 lần thử lại đều sai, tổng cộng 4 lần, lại mất 1 cộng 2 cộng 4, bằng 7 giây chờ. Chỉ lỗi môi trường như mạng chập chờn mới đáng thử lại, nên người làm nghề phân loại lỗi trước, rồi mới quyết định thử lại hay báo ngay."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.parse_prefix('3x5') == 3 and alg.int_or_error('3x5') == 'ValueError' and alg.parse_prefix('x') == 0"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hàm đọc số kiểu cũ nhận “3x5” và “x”: trả gì? Vì sao nguy hiểm?</td></tr>
          <tr><td>2</td><td>Hàm <code>int</code> nhận “3x5”: chuyện gì xảy ra?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hàm đọc số kiểu cũ nhận chuỗi 3x5 và chuỗi x, trả về gì? Vì sao nguy hiểm? Câu hai, hàm chuyển thành số nguyên nhận chuỗi 3x5 thì chuyện gì xảy ra? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>vào</th><th>đọc từng kí tự</th><th>trả</th></tr>
          <tr><td><code>"3x5"</code></td><td><code>'3'</code> → 3; <code>'x'</code> lạ → dừng (chữ 5 bị bỏ)</td><td>$\hl{3}$</td></tr>
          <tr><td><code>"x"</code></td><td><code>'x'</code> lạ ngay → dừng</td><td>$\hl{0}$</td></tr>
          <tr><td><code>"0"</code> (hợp lệ)</td><td><code>'0'</code> → 0</td><td>0</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, chạy tay từng kí tự. Chuỗi 3x5 cho 3, gặp chữ x thì dừng, chữ số 5 bị bỏ. Chuỗi x gặp kí tự lạ ngay, nên trả 0 mà không báo gì. Nguy hiểm ở chỗ chuỗi 0 hợp lệ cũng cho 0, nên người gọi không phân biệt được hai trường hợp."
      - show: |
          <p>② <code>int("3x5")</code> báo $\hl{\text{ValueError}}$ ngay ở dòng đầu — thất bại sớm, đúng chỗ, không có con số sai nào đi tiếp.</p>
        say: "Câu hai, hàm chuyển số nguyên báo lỗi giá trị ngay ở dòng đầu tiên. Đó là thất bại sớm và đúng chỗ, vì không có con số sai nào đi tiếp vào chương trình."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">mã lỗi: dễ bị quên, dễ trùng</span><span class="a">→</span>
          <span class="n">ngoại lệ: không âm thầm sai, nếu không bị nuốt</span><span class="a">→</span>
          <span class="n">kiểm ở biên, thất bại sớm</span><span class="a">→</span>
          <span class="n">không nuốt lỗi</span></div>
        say: "Tổng kết lại, mã lỗi dễ bị quên và dễ trùng giá trị hợp lệ, còn ngoại lệ thì không âm thầm sai, miễn là không ai nuốt nó. Hãy kiểm ở biên, thất bại sớm, và không bao giờ nuốt lỗi."
      - show: |
          <div class="box key"><b>Tư duy:</b> một chương trình dừng với thông báo rõ thì sửa được trong vài phút; một chương trình chạy tiếp với dữ liệu sai có thể tốn vài tuần.</div>
        say: "Điều cần mang theo, một chương trình dừng với thông báo rõ thì sửa được trong vài phút, còn một chương trình chạy tiếp với dữ liệu sai có thể tốn vài tuần."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>đóng gói</b> và bất biến lớp.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học đóng gói và bất biến của lớp. Hẹn gặp bạn ở bài tiếp theo."
