scenes:
- id: hook
  kind: hook
  title: “12a” thành 12, không ai biết
  checks:
  - alg.parse_prefix('12a') == 12 and alg.int_or_error('12a') == 'ValueError'
  steps:
  - show: '<p>Khách gõ nhầm số lượng “12a”. Hàm đọc số kiểu cũ dừng ở chữ “a”, trả về $\hl{12}$ — đơn hàng đi tiếp với con
      số khách không hề nhập. Hàm <code>int("12a")</code> của Python thì báo lỗi ngay.</p>

      <div class="box key">Hôm nay: <b>xử lý lỗi</b> — báo lỗi thế nào, ở đâu, và vì sao <b>thất bại sớm</b> tốt hơn chạy
      tiếp với dữ liệu sai.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    say: Chào bạn, khách gõ nhầm số lượng thành 12a. Một hàm đọc số kiểu cũ dừng ở chữ a và trả về 12, đơn hàng đi tiếp với
      con số khách không hề nhập. Còn hàm chuyển chuỗi thành số nguyên có sẵn của ngôn ngữ thì báo lỗi ngay. Hôm nay ta học
      xử lý lỗi, báo lỗi thế nào, ở đâu, và vì sao thất bại sớm tốt hơn chạy tiếp với dữ liệu sai. Nuốt im ngoại lệ trong
      khối rỗng giống tắt chuông báo cháy khi nhà kho đang bốc khói khiến lỗi bùng phát lúc hậu quả đã không thể cứu vãn.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: chuỗi thành số, và khối thử–bắt lỗi'
  checks:
  - '(lambda n1: (n1, n1 * 10 + 2))(0 * 10 + 1) == (1, 12) == (alg.parse_prefix(''1''), alg.parse_prefix(''12''))'
  - alg.int_or_error('7') == 7 and alg.int_or_error('a') == 'ValueError'
  steps:
  - show: '<p>Chuỗi <code>"12"</code> là hai <b>kí tự</b> <code>''1''</code>, <code>''2''</code>, chưa phải số. Đổi thành
      số: đọc từng chữ số, nhân số cũ với 10 rồi cộng.</p>

      <table class="t"><tr><th>đọc kí tự</th><th>số đang có</th></tr>

      <tr><td>(bắt đầu)</td><td>0</td></tr>

      <tr><td><code>''1''</code></td><td>0 × 10 + 1 = 1</td></tr>

      <tr><td><code>''2''</code></td><td>1 × 10 + 2 = $\hl{12}$</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.3'
    - '2.4'
    - '2.4'
    - '2.4'
    say: Trước hết, chuỗi 12 là hai kí tự một và hai, chưa phải là số. Để đổi thành số, máy đọc từng chữ số, nhân số đang
      có với 10 rồi cộng chữ số mới. Đọc kí tự một, được 0 nhân 10 cộng 1, bằng 1. Đọc kí tự hai, được 1 nhân 10 cộng 2, bằng
      12. Mã lỗi tường minh phù hợp những thất bại nghiệp vụ dự đoán được thường xuyên còn ngoại lệ dành cho tình huống bất
      thường không thể tiếp tục luồng chuẩn. Tuyệt đối không trộn lẫn giá trị đặc biệt như âm một hay rỗng vào cùng kiểu dữ
      liệu kết quả hợp lệ làm người gọi dễ quên kiểm tra.
  - clear: true
    show: '<div class="code"><div>try:</div><div>    n = int(s)</div><div>except ValueError:</div><div>    n = None</div></div>

      <table class="t"><tr><th>s</th><th>lệnh trong khối thử</th><th>đi tiếp tới đâu</th></tr>

      <tr><td><code>"7"</code></td><td>chạy xong, n = 7</td><td>bỏ qua khối bắt lỗi</td></tr>

      <tr><td><code>"a"</code></td><td>báo ValueError</td><td>nhảy ngay xuống khối bắt lỗi</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    say: Tiếp theo là khối thử và bắt lỗi. Máy chạy lệnh trong khối thử, nếu có lỗi thì nhảy ngay xuống khối bắt lỗi. Với
      chuỗi 7, lệnh chạy xong, n bằng 7, và khối bắt lỗi bị bỏ qua. Với chuỗi a, lệnh báo lỗi giá trị, nên máy bỏ dở và nhảy
      ngay xuống khối bắt lỗi. Nguyên tắc thất bại sớm yêu cầu kiểm định ngay đầu vào tại cửa hàm thay vì nhận giá trị sai
      rồi gây nổ cách đó năm lớp gọi.
- id: sym
  kind: symbol
  title: 'Giải mã: mã lỗi và ngoại lệ'
  checks:
  - alg.parse_prefix('abc') == 0 == alg.parse_prefix('0')
  steps:
  - show: '<table class="t"><tr><th>cách</th><th>làm gì</th><th>rủi ro</th></tr>

      <tr><td><b>mã lỗi</b></td><td>trả về một giá trị đặc biệt (−1, 0, null)</td><td>người gọi quên kiểm; giá trị đặc biệt
      trùng giá trị hợp lệ (đọc “abc” ra 0, đọc “0” cũng ra 0)</td></tr>

      <tr><td><b>ngoại lệ</b></td><td>dừng luồng bình thường, nhảy tới chỗ bắt lỗi</td><td>không ai bắt thì chương trình dừng
      — nhưng <b>không âm thầm sai</b></td></tr></table>

      <div class="box key"><b>Thất bại sớm</b>: phát hiện dữ liệu sai ở chỗ gần nguồn nhất và dừng ngay, với thông báo rõ
      — thay vì để sai lan đi xa rồi mới lộ.</div>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    - '1.3'
    - 2
    - 2
    say: Có hai cách báo lỗi. Mã lỗi là trả về một giá trị đặc biệt như âm 1, 0, hay rỗng. Rủi ro là người gọi quên kiểm,
      và giá trị đặc biệt trùng giá trị hợp lệ, chẳng hạn đọc chuỗi a b c ra 0, mà đọc chuỗi 0 cũng ra 0. Ngoại lệ là dừng
      luồng bình thường và nhảy tới chỗ bắt lỗi, không ai bắt thì chương trình dừng, nhưng không âm thầm sai. Thất bại sớm
      nghĩa là phát hiện dữ liệu sai ở chỗ gần nguồn nhất và dừng ngay với thông báo rõ, thay vì để cái sai lan đi xa rồi
      mới lộ. Phân định rõ lỗi lập trình phải sửa ngay trong mã nguồn với lỗi môi trường tạm thời có thể thử lại hoặc báo
      rõ cho người dùng.
