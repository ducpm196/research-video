      bốn, chuỗi 7 có dấu cách hai đầu vẫn cho 7, vì hàm chuyển số bỏ qua dấu cách ở hai đầu. Bước năm, chuỗi rỗng thì báo
      lỗi ngay.
  - clear: true
    show: '<p><b>Bước 6</b> — đặt việc kiểm ở đâu: một lần ở <b>biên</b> (nơi dữ liệu từ ngoài vào: ô nhập, tệp, mạng). Bên
      trong, mỗi hàm ghi rõ <b>tiền điều kiện</b> — điều người gọi phải bảo đảm trước khi gọi — và được phép tin nó.</p>

      <table class="t"><tr><th>hàm bên trong</th><th>tiền điều kiện</th><th>biên đã kiểm</th><th>hàm chỉ việc tính</th></tr>

      <tr><td><code>tinh_tien(so_luong, gia)</code></td><td><code>so_luong &gt; 0</code></td><td>12 &gt; 0 ✓</td><td>$12 \times
      5\,000 = 60\,000$</td></tr></table>

      <div class="box key">Thông báo lỗi tốt nói: giá trị nào, sai ở đâu, mong đợi gì. “Có lỗi xảy ra” thì không giúp ai sửa.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - '2.2'
    - 3
    say: Bước sáu, quyết định đặt việc kiểm ở đâu. Ta kiểm một lần ở biên, nơi dữ liệu từ ngoài vào như ô nhập, tệp, mạng.
      Bên trong, mỗi hàm ghi rõ tiền điều kiện của nó, tức điều người gọi phải bảo đảm trước khi gọi, và hàm được phép tin
      điều đó. Chẳng hạn hàm tính tiền có tiền điều kiện là số lượng dương, biên đã kiểm số 12 rồi, nên hàm chỉ việc lấy 12
      nhân 5 nghìn, bằng 60 nghìn, mà không kiểm lại. Thông báo lỗi tốt nói rõ giá trị nào, sai ở đâu, mong đợi gì, còn câu
      có lỗi xảy ra thì không giúp ai sửa.
  - show: '<table class="t"><tr><th>cách viết</th><th>nhận <code>"12a"</code></th><th>hệ quả</th></tr>

      <tr><td><code>try: n = int(s)</code><br><code>except: pass</code> (nuốt lỗi)</td><td class="red">không báo gì</td><td>dữ
      liệu thiếu/cũ lọt tiếp, khó tìm nguyên nhân</td></tr>

      <tr><td>không nuốt: kiểm ở biên và báo <code>ValueError</code></td><td>dừng ngay</td><td>lộ đúng chỗ sai, giữ đường
      xử lý trong sạch</td></tr></table>

      '
    say: Bước bảy, đối chiếu việc không nuốt lỗi với nguyên tắc thất bại sớm. Nếu bạn bọc lệnh chuyển đổi rồi viết câu lệnh
      bắt mọi lỗi và bỏ qua không làm gì cả, lỗi giá trị bị che khuất và dữ liệu sai hoặc giá trị cũ lại âm thầm đi tiếp.
      Ngược lại, khi không nuốt lỗi mà báo rõ ngoại lệ ngay tại biên, chương trình dừng đúng chỗ hỏng và bảo vệ sạch phần
      nghiệp vụ phía trong.
- id: check
  kind: check
  title: 'Tự kiểm: chạy tay và thử hết các chuỗi ngắn'
  checks:
  - alg.parse_prefix('12a') == 12 and alg.parse_prefix('3x5') == 3
  - '(lambda S: (len(S), sum(alg.int_or_error(s) == ''ValueError'' for s in S), sum(isinstance(alg.parse_prefix(s), int) for
    s in S if alg.int_or_error(s) == ''ValueError'')))([a + b for a in ''0123456789a'' for b in ''0123456789a'']) == (121,
    21, 21)'
  steps:
  - show: '<table class="t"><tr><th>hàm kiểu cũ đọc <code>"12a"</code></th><th>số đang có</th></tr>

      <tr><td><code>''1''</code> là chữ số</td><td>1</td></tr>

      <tr><td><code>''2''</code> là chữ số</td><td>12</td></tr>

      <tr><td><code>''a''</code> không phải chữ số</td><td class="red">dừng, trả 12, không báo gì</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Kiểm bằng đường khác, chạy tay hàm kiểu cũ trên chuỗi 12a, theo đúng cách đổi chuỗi thành số đã ôn. Kí tự một cho
      số 1. Kí tự hai cho số 12. Kí tự a không phải chữ số, nên hàm dừng và trả 12 mà không báo gì, khớp với điều ta thấy
      ở đầu bài.
  - show: '<table class="t"><tr><th>máy thử mọi chuỗi 2 kí tự từ 0 … 9 và a</th><th>số chuỗi</th></tr>

      <tr><td>tất cả</td><td>$11 \times 11 = 121$</td></tr>

      <tr><td><code>int</code> báo lỗi (có chữ a)</td><td>$121 - 100 = 21$</td></tr>

      <tr><td>trong 21 chuỗi đó, hàm kiểu cũ vẫn trả một con số</td><td class="red">21, không báo lỗi lần nào</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Rồi cho máy thử hết các chuỗi hai kí tự, mỗi kí tự là một chữ số hoặc chữ a. Có 11 nhân 11, bằng 121 chuỗi. Hàm chuyển
      số nguyên báo lỗi ở 121 trừ 100, bằng 21 chuỗi có chữ a. Trong cả 21 chuỗi đó, hàm kiểu cũ vẫn trả về một con số mà
      không báo lỗi lần nào, nên lỗi của nó không phải chuyện hiếm. Áp dụng nguyên tắc thất bại sớm dừng ngay ở ranh giới
      đầu vào thay vì để dữ liệu hỏng lan sâu.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi hay gặp
  checks:
  - '[alg.int_or_error(''12a'') for _ in range(1 + 3)] == [''ValueError''] * 4 and sum(alg.backoff(1000, 60000, 3)) == 7000
    and alg.backoff(1000, 60000, 3) == [1000, 2000, 4000]'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nuốt ngoại lệ: <code>except: pass</code> <b class="red">(nguy hiểm)</b>

      <br><span class="note">Lỗi rõ ràng biến thành dữ liệu sai lặng lẽ, lộ ra rất xa nơi gây lỗi. Chỉ bắt loại lỗi mình xử
      lý được, và xử lý thật (ghi nhật ký, thử lại, báo người dùng).</span></div>

      '
    say: Lỗi thứ nhất, nuốt ngoại lệ, bắt mọi lỗi rồi bỏ qua. Lỗi rõ ràng biến thành dữ liệu sai lặng lẽ, lộ ra rất xa nơi
      gây lỗi. Hãy chỉ bắt loại lỗi mình xử lý được, và xử lý thật, như ghi nhật ký, thử lại, hay báo người dùng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Mã lỗi trùng giá trị hợp lệ <b class="red">(mơ hồ)</b>

      <br><span class="note">Hàm đọc nhiệt độ trả −1 khi lỗi, nhưng −1 °C là nhiệt độ thật. Dùng ngoại lệ, hoặc trả cặp (kết
      quả, lỗi) tách bạch.</span></div>

      '
    say: Lỗi thứ hai, mã lỗi trùng giá trị hợp lệ. Hàm đọc nhiệt độ trả âm 1 khi lỗi, nhưng âm 1 độ là một nhiệt độ thật,
      nên hãy dùng ngoại lệ, hoặc trả về một cặp kết quả và lỗi tách bạch.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Kiểm cùng một điều ở mọi tầng <b class="red">(rối)</b>

      <br><span class="note">Mười hàm đều tự kiểm “số lượng dương” với mười thông báo khác nhau. Kiểm ở biên một lần; bên
      trong dùng khẳng định khi chạy thử để bắt lỗi lập trình.</span></div>

      '
    say: Lỗi thứ ba, kiểm cùng một điều ở mọi tầng. Mười hàm đều tự kiểm số lượng dương với mười thông báo khác nhau, nên
      hãy kiểm ở biên một lần, còn bên trong dùng lệnh khẳng định khi chạy thử để bắt lỗi lập trình.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Bọc mọi lời gọi trong “thử lại 3 lần”, kể cả lỗi của người gọi <b class="red">(vô
      ích)</b></div>

      <table class="t"><tr><th>loại lỗi</th><th>ví dụ</th><th>gọi lần đầu, rồi thử lại 3 lần, chờ 1, 2, 4 giây trước mỗi lần</th></tr>

      <tr><td>lỗi của người gọi</td><td><code>int("12a")</code></td><td class="red">cả 4 lần đều ValueError, mất thêm 7 giây
      chờ</td></tr>

      <tr><td>lỗi môi trường</td><td>mạng chập chờn, hết thời gian chờ</td><td>có thể thành công ở lần sau</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    say: Lỗi thứ tư hay gặp ở người đã đi làm, bọc mọi lời gọi trong một vòng thử lại 3 lần, kể cả khi lỗi là do người gọi.
      Bảng so hai loại lỗi. Chuỗi 12a sai thì lần gọi đầu và cả 3 lần thử lại đều sai, tổng cộng 4 lần, lại mất 1 cộng 2 cộng
      4, bằng 7 giây chờ. Chỉ lỗi môi trường như mạng chập chờn mới đáng thử lại, nên người làm nghề phân loại lỗi trước,
      rồi mới quyết định thử lại hay báo ngay.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.parse_prefix('3x5') == 3 and alg.int_or_error('3x5') == 'ValueError' and alg.parse_prefix('x') == 0
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Hàm đọc số kiểu cũ nhận “3x5” và “x”: trả gì? Vì sao nguy hiểm?</td></tr>

      <tr><td>2</td><td>Hàm <code>int</code> nhận “3x5”: chuyện gì xảy ra?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, hàm đọc số kiểu cũ nhận chuỗi 3x5 và chuỗi x, trả về gì? Vì sao nguy hiểm?
      Câu hai, hàm chuyển thành số nguyên nhận chuỗi 3x5 thì chuyện gì xảy ra? Dừng video và làm ra giấy. Phân biệt tình huống
      nào nên trả kiểu kết quả lỗi tường minh và tình huống nào cần ném ngoại lệ dừng luồng.
    pause: 15
  - show: '<table class="t"><tr><th>vào</th><th>đọc từng kí tự</th><th>trả</th></tr>

      <tr><td><code>"3x5"</code></td><td><code>''3''</code> → 3; <code>''x''</code> lạ → dừng (chữ 5 bị bỏ)</td><td>$\hl{3}$</td></tr>

      <tr><td><code>"x"</code></td><td><code>''x''</code> lạ ngay → dừng</td><td>$\hl{0}$</td></tr>

      <tr><td><code>"0"</code> (hợp lệ)</td><td><code>''0''</code> → 0</td><td>0</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án câu một, chạy tay từng kí tự. Chuỗi 3x5 cho 3, gặp chữ x thì dừng, chữ số 5 bị bỏ. Chuỗi x gặp kí tự lạ ngay,
      nên trả 0 mà không báo gì. Nguy hiểm ở chỗ chuỗi 0 hợp lệ cũng cho 0, nên người gọi không phân biệt được hai trường
      hợp.
  - show: '<p>② <code>int("3x5")</code> báo $\hl{\text{ValueError}}$ ngay ở dòng đầu — thất bại sớm, đúng chỗ, không có con
      số sai nào đi tiếp.</p>

      '
    say: Câu hai, hàm chuyển số nguyên báo lỗi giá trị ngay ở dòng đầu tiên. Đó là thất bại sớm và đúng chỗ, vì không có con
      số sai nào đi tiếp vào chương trình.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/SDP/L01
  steps:
  - show: <table class='t'><tr><th>Thực hành SDP:L01</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Không
      nuốt lỗi</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>bad=12a good=42</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash
      labs/cham.sh SDP L01 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 1 với hai chuỗi kiểm thử đọc từ luồng chuẩn theo dạng khoá bằng giá trị. Đề bài cho hai
      tham số là chuỗi lỗi và chuỗi hợp lệ, nhiệm vụ của bạn là đối chiếu cách đọc số dừng ở kí tự lạ đầu tiên với hàm int
      chặt chẽ của ngôn ngữ. Hãy cài hàm đọc từng kí tự từ trái sang phải, hễ gặp chữ số thì ghép vào kết quả. Hễ gặp kí tự
      không phải chữ số thì dừng ngay và trả về giá trị đọc được tới lúc đó, hoặc trả về 0 nếu ngay đầu đã là chữ. Đồng thời
      dùng khối thử bắt lỗi ValueError quanh lời gọi int với chuỗi xấu để chứng minh cách thất bại sớm chặn đứng dữ liệu sai
      ngay tại cửa vào.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai SDP:L01</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (hàm dừng kí tự lạ)</b></td><td>Duyệt từ trái sang phải từng kí tự số; gặp kí tự không phải số thì <code>break</code>
      ngay</td></tr><tr><td><b>Bước 2 (bộ đọc chặt chẽ)</b></td><td>Gọi <code>int(s)</code> để ném <code>ValueError</code>
      ngay khi chuỗi lẫn chữ</td></tr><tr><td><b>Bước 3 (bắt ngoại lệ)</b></td><td>Bọc <code>try/except ValueError</code>
      quanh <code>bad</code> để ghi nhận cờ từ chối</td></tr></table>
    say: 'Gợi ý cài đặt bài số 1 gồm ba bước nối trực tiếp lý thuyết vừa học. Bước một, viết vòng lặp đọc từng kí tự của chuỗi
      lỗi từ trái sang phải: dùng hàm kiểm tra chữ số. Nhân kết quả tạm với 10 rồi cộng chữ số mới, và thoát vòng lặp ngay
      khi gặp kí tự không phải chữ số để chuỗi 3x5 chỉ cho ra 3. Bước hai, gọi hàm int cho chuỗi hợp lệ để lấy giá trị nguyên
      đúng. Bước ba, bọc lệnh int cho chuỗi xấu bên trong khối try except ValueError. Nếu ngoại lệ bật ra thì đặt cờ bị chặn
      bằng 1, còn nếu chuỗi hợp lệ không có lỗi thì đặt cờ bằng 0.'
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>naive_12a=12</div><div>strict_42=42</div><div>strict_12a_raised=1</div></div>
    say: 'Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu: hàm cũ cho 12, hàm chặt cho 42, và cờ báo lỗi bằng 1.
      Hãy kiểm tra chương trình của bạn trên cả dữ liệu mẫu lẫn hai bộ ca ẩn.'
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">mã lỗi: dễ bị quên, dễ trùng</span><span class="a">→</span>

      <span class="n">ngoại lệ: không âm thầm sai, nếu không bị nuốt</span><span class="a">→</span>

      <span class="n">kiểm ở biên, thất bại sớm</span><span class="a">→</span>

      <span class="n">không nuốt lỗi</span></div>

      '
    say: Tổng kết lại, mã lỗi dễ bị quên và dễ trùng giá trị hợp lệ, còn ngoại lệ thì không âm thầm sai, miễn là không ai
      nuốt nó. Hãy kiểm ở biên, thất bại sớm, và không bao giờ nuốt lỗi. Thất bại sớm và không bao giờ nuốt lỗi im lặng là
      hai quy tắc vàng bảo vệ tính trung thực của toàn bộ hệ thống. Chặn ngay đầu vào sai tại cửa hàm và tách rạch ròi lỗi
      nghiệp vụ dự đoán được khỏi ngoại lệ hệ thống.
  - show: '<div class="box key"><b>Tư duy:</b> một chương trình dừng với thông báo rõ thì sửa được trong vài phút; một chương
      trình chạy tiếp với dữ liệu sai có thể tốn vài tuần.</div>

      '
    say: Điều cần mang theo, một chương trình dừng với thông báo rõ thì sửa được trong vài phút, còn một chương trình chạy
      tiếp với dữ liệu sai có thể tốn vài tuần. Phân tách lỗi nghiệp vụ dự đoán được khỏi sự cố bất thường giúp phần gọi xử
      lý gọn gàng không lồng ghép khối bắt lỗi khắp nơi.
  - clear: true
    show: '<p class="note">Bài sau (bài 2): <b>đóng gói</b> và bất biến lớp.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 2, ta học đóng gói và bất biến của lớp. Hẹn gặp bạn ở bài tiếp theo. Khi hàm và lỗi đã rành mạch,
      bước tổ chức tiếp theo gom dữ liệu liên quan cùng các bất biến bảo vệ nó vào trong từng lớp đóng gói kín.
