- id: example
  kind: example
  title: Kiểm ở biên, tin ở trong
  checks:
  - '(lambda d: exec(''def doc_so_luong(chuoi):\n    n = int(chuoi)\n    if n <= 0:\n        raise ValueError(f"số lượng phải
    dương, nhận {n}")\n    return n\ndef thu(s):\n    try:\n        return doc_so_luong(s)\n    except ValueError as e:\n        return
    str(e)\n'', d) or ([d[''thu''](''12''), d[''thu''](''0''), d[''thu'']('' 7 '')] == [12, ''số lượng phải dương, nhận 0'',
    7] and d[''thu''](''12a'').startswith(''invalid literal'') and d[''thu'']('''').startswith(''invalid literal'')))({})'
  - alg.int_or_error('12') == 12 and alg.int_or_error(' 7 ') == 7 and alg.int_or_error('') == 'ValueError'
  - alg.int_or_error('12') > 0 and alg.int_or_error('12') * 5000 == 60000
  steps:
  - show: '<div class="code"><div>def doc_so_luong(chuoi):</div><div>    n = int(chuoi)</div><div>    if n &lt;= 0:</div><div>        raise
      ValueError(f"số lượng phải dương, nhận {n}")</div><div>    return n</div></div>

      <p><b>Bước 1</b> — <code>doc_so_luong("12")</code>: <code>int</code> cho 12; 12 &gt; 0 nên không báo lỗi → trả $\hl{12}$.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Hàm đọc số lượng chuyển chuỗi thành số nguyên. Tiếp theo nó kiểm số lượng phải dương, và nếu không dương, nó báo
      lỗi kèm giá trị đã nhận. Bước một, chạy với chuỗi 12, hàm chuyển cho số 12. Vì 12 lớn hơn 0, hàm trả về 12.
  - show: '<table class="t"><tr><th>bước</th><th>vào</th><th>dòng <code>int</code></th><th>kiểm dương</th><th>kết quả</th></tr>

      <tr><td>2</td><td><code>"12a"</code></td><td class="red">ValueError</td><td>không tới</td><td>báo lỗi ngay</td></tr>

      <tr><td>3</td><td><code>"0"</code></td><td>0</td><td class="red">0 ≤ 0</td><td>“số lượng phải dương, nhận 0”</td></tr>

      <tr><td>4</td><td><code>" 7 "</code></td><td>7</td><td>7 &gt; 0</td><td>trả 7</td></tr>

      <tr><td>5</td><td><code>""</code></td><td class="red">ValueError</td><td>không tới</td><td>báo lỗi ngay</td></tr></table>

