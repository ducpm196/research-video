case: journey
source: "curriculum/sdp.yaml L17; audit/sdp/sources_L17.md (câu trích nguyên văn, đọc 2026-11-02); audit/sdp/verify_sdp.py L17; K. Westeinde, Deconstructing the Monolith: Designing Software that Maximizes Developer Productivity, Shopify Engineering, 2019-02-21 [DM19]; P. Müller, Under Deconstruction: The State of Shopify's Monolith, Shopify Engineering, 2020-09-16 [UD20]; M. Ong, Enforcing Modularity in Rails Apps with Packwerk, Shopify Engineering, 2020-09 [PW20]; C. Salzberg và cộng sự, A Packwerk Retrospective, Rails at Scale 2024-01-26, đăng lại Shopify Engineering 2024-02-07 [PR24]; SDP bài 7 (đảo phụ thuộc), bài 10 (người quan sát), bài 13 (tái cấu trúc giữ hành vi), bài 14 (tương thích API), bài 15 (độ bất ổn)"
assumes: [arith, frac, approx]
# Quy ước: “nguyên khối” = mọi chức năng trong một mã nguồn, triển khai một chỗ (monolith); “thành phần” = component, một thư mục theo
#   một miền nghiệp vụ; “nguyên khối mô-đun hoá” = modular monolith; “vi dịch vụ” = microservices; “vi phạm” = lời gọi / tham chiếu vượt
#   ranh giới ngoài giao diện công khai hoặc ngoài phụ thuộc đã khai; “danh sách việc cần làm” = deprecated references / package_todo.yml.
#   Độ bất ổn I = Ce / (Ca + Ce) như bài 15 (alg.instability); lời đọc nói “số thành phần dựa vào nó”, “số thành phần nó dựa vào”.
#   Mọi sự kiện và con số có nguồn ghi trong audit/sdp/sources_L17.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”:
#   10 miền, 1 phút mỗi lớp, 5 phút mỗi lần quét, ngày 8 giờ, Ca = 36 của lớp cửa hàng, ứng dụng 6 người / 8 miền / 15 phút kiểm thử
#   đều là SỐ MINH HOẠ. 703 là CẬN DƯỚI tính từ 37 (UD20) và “hơn nửa” (UD20), không phải số đếm của Shopify.
#   Lời đọc không nói “Rails”, “Wedge”, “Packwerk”, “CI”, “commit”: nói “khung lập trình web viết bằng Ruby”, “công cụ ghi đồ thị lời
#   gọi”, “công cụ phân tích tĩnh”, “máy kiểm thử tự động”, “lần ghi nhận”. Phát âm: lexicon_vi.SDP.yaml (probe p2).
objectives:
  - "Kể lại hành trình của nguyên khối Shopify qua bốn chặng từ 2006 tới 2024, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại số chiều gọi có thể có, công dán nhãn 6000 lớp, cận dưới số mũi tên của đồ thị dày, số lần kiểm mỗi ngày và độ bất ổn để chọn chiều phụ thuộc"
  - "Chọn giữa nguyên khối mô-đun hoá và tách dịch vụ ở quy mô của chính mình, kèm điều kiện đổi lựa chọn"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "2,8 triệu dòng mã trong một khối"
    checks:
      - "2.8e6 > 2_000_000 and 500_000 > 100_000"
    steps:
      - show: |
          <p>Năm 2020, mã nguồn lõi của Shopify có <b>hơn 2,8 triệu dòng</b> Ruby và <b>500&nbsp;000 lần ghi nhận</b> (mỗi lần lưu một thay đổi vào lịch sử mã); hàng trăm lập trình viên thêm tính năng mỗi ngày.</p>
          <p>Vậy mà họ <b>không</b> chặt nó thành vi dịch vụ. Họ giữ <b>một khối</b>, nhưng dựng <b>tường</b> giữa các phần.</p>
          <div class="box key">Hôm nay: bốn chặng từ 2006 tới 2024 — mỗi quy mô làm lộ ra điểm nghẽn nào, và đội Shopify đã xử lý ra sao.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, năm 2020, mã nguồn lõi của Shopify có hơn 2 phẩy 8 triệu dòng Ruby và 500 nghìn lần ghi nhận, mỗi lần là một lần lưu thay đổi vào lịch sử mã. Hàng trăm lập trình viên vẫn thêm tính năng vào đó mỗi ngày. Vậy mà họ không chặt nó thành nhiều dịch vụ nhỏ. Họ giữ một khối, nhưng dựng tường giữa các phần. Hôm nay ta đi qua bốn chặng từ 2006 tới 2024, xem mỗi quy mô làm lộ ra điểm nghẽn nào và đội này đã xử lý ra sao."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều từ các bài trước"
    checks:
      - "alg.instability(3, 1) == 0.25"
      - "3 * 4 == 12"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 7</td><td><b>đảo phụ thuộc</b>: mã cấp cao không gọi thẳng thứ cụ thể, mà nhận nó từ ngoài vào</td><td>tiêm đồng hồ giả ngày 1/1 → lời chào luôn là “Chúc mừng năm mới”</td></tr>
          <tr><td>bài 10</td><td><b>người quan sát</b>: bên phát sự kiện không cần biết ai đang nghe</td><td>3 người nghe, 4 sự kiện → 12 lần gọi</td></tr>
          <tr><td>bài 13</td><td><b>tái cấu trúc</b> chỉ an toàn khi kiểm thử chứng minh hành vi không đổi</td><td>bản cũ và bản mới cùng kết quả trên 10&nbsp;000 đầu vào</td></tr>
          <tr><td>bài 15</td><td><b>độ bất ổn</b> I = số nó dựa vào chia tổng số mũi tên chạm vào nó; mũi tên nên đi về phía I nhỏ</td><td>3 dựa vào nó, nó dựa vào 1 → I = 1 / (3 + 1) = 0,25</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Bảng nhắc lại bốn điều từ các bài trước. Ở bài 7, đảo phụ thuộc là mã cấp cao không gọi thẳng thứ cụ thể, mà nhận nó từ ngoài vào, như tiêm một đồng hồ giả ngày 1 tháng 1. Ở bài 10, mẫu người quan sát cho bên phát sự kiện không cần biết ai đang nghe, 3 người nghe với 4 sự kiện là 12 lần gọi. Ở bài 13, tái cấu trúc chỉ an toàn khi kiểm thử chứng minh hành vi không đổi, ví dụ trên 10 nghìn đầu vào. Ở bài 15, độ bất ổn bằng số mô-đun nó dựa vào, chia tổng số mũi tên chạm vào nó. Ba mô-đun dựa vào nó, nó dựa vào một, thì độ bất ổn là 0 phẩy 25, và mũi tên nên đi về phía độ bất ổn nhỏ."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>nguyên khối</b></td><td>mọi chức năng nằm trong một mã nguồn, triển khai ở một chỗ</td></tr>
          <tr><td><b>thành phần</b></td><td>một thư mục gom mã của một miền nghiệp vụ, như đơn hàng, giao hàng, thuế</td></tr>
          <tr><td><b>giao diện công khai</b></td><td>phần duy nhất thành phần khác được phép gọi</td></tr>
          <tr><td><b>nguyên khối mô-đun hoá</b></td><td>vẫn một mã nguồn, một lần triển khai, nhưng ranh giới giữa các thành phần được <b>kiểm bằng máy</b></td></tr>
          <tr><td><b>vi dịch vụ</b></td><td>nhiều chương trình nhỏ triển khai riêng, gọi nhau qua mạng</td></tr>
          <tr><td><b>vi phạm</b></td><td>một chỗ dùng mã của thành phần khác ngoài giao diện công khai, hoặc ngoài các phụ thuộc đã khai</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài dùng sáu thuật ngữ. Nguyên khối là mọi chức năng nằm trong một mã nguồn, triển khai ở một chỗ. Thành phần là một thư mục gom mã của một miền nghiệp vụ, như đơn hàng, giao hàng, hay thuế. Giao diện công khai là phần duy nhất mà thành phần khác được phép gọi. Nguyên khối mô-đun hoá vẫn là một mã nguồn và một lần triển khai, nhưng ranh giới được kiểm bằng máy. Vi dịch vụ là nhiều chương trình nhỏ triển khai riêng, gọi nhau qua mạng. Vi phạm là một chỗ dùng mã của thành phần khác ngoài giao diện công khai, hoặc ngoài các phụ thuộc đã khai."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bốn chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="210" cy="150" r="15" fill="#9ca3af"/><text x="210" y="108" font-weight="bold">2006 → 2016</text><text x="210" y="200">một khối, không ranh giới</text><text x="210" y="232">lớn tới mức chậm lại</text>
          <circle cx="640" cy="150" r="15" fill="#2a78d6"/><text x="640" y="108" font-weight="bold">2017 → 2019</text><text x="640" y="200">xếp 6000 lớp theo nghiệp vụ</text><text x="640" y="232">đo vi phạm khi chạy kiểm thử</text>
          <circle cx="1070" cy="150" r="15" fill="#eb6834"/><text x="1070" y="108" font-weight="bold">2020</text><text x="1070" y="200">37 thành phần, đồ thị dày</text><text x="1070" y="232">phân tích tĩnh chặn vi phạm mới</text>
          <circle cx="1490" cy="150" r="15" fill="#059669"/><text x="1490" y="108" font-weight="bold">2024</text><text x="1490" y="200">0 vi phạm chưa đủ</text><text x="1490" y="232">chạy được riêng mới là tách</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh, tăng trưởng → mô-đun hoá → quy mô rất lớn → ổn định và tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với bốn chặng. Từ 2006 tới 2016, mã nguồn là một khối không ranh giới, lớn tới mức mọi việc chậm lại. Từ 2017 tới 2019, đội xếp khoảng 6000 lớp theo nghiệp vụ, rồi đo vi phạm khi chạy kiểm thử. Năm 2020 có 37 thành phần với đồ thị phụ thuộc dày, và một công cụ phân tích tĩnh chặn vi phạm mới, còn năm 2024, đội rút ra rằng không còn vi phạm vẫn chưa đủ."

  # ───────────────────────── 5. BA KIẾN TRÚC ─────────────────────────
