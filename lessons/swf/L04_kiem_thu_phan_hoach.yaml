id: L04
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 4 — Kiểm thử: phân hoạch tương đương và giá trị biên"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L04; audit/swf/verify_swf.py L04; G. J. Myers, The Art of Software Testing (1979), chương 4 (bài tam giác); E. W. Dijkstra, Notes on Structured Programming, EWD249 (1970) (“kiểm thử chỉ ra có lỗi…”)"
assumes: [arith, ltgt]
# Quy ước: hàm phân loại tam giác theo ba cạnh nguyên (alg.triangle); bản lỗi lệch một ở biên (alg.triangle_buggy dùng x + y < z thay
#   cho x + y ≤ z với x ≤ y ≤ z). Mọi kết quả phân loại chạy thật trong checks.
objectives:
  - "Chia đầu vào thành các lớp tương đương"
  - "Chọn ca kiểm ở biên giữa các lớp"
  - "Hiểu giới hạn của kiểm thử"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bốn ca kiểm đều qua — vẫn có lỗi"
    checks:
      - "all(alg.triangle(*t) == alg.triangle_buggy(*t) for t in [(3, 3, 3), (3, 3, 5), (3, 4, 5), (1, 2, 4)])"
      - "alg.triangle(1, 2, 3) == 'không phải' and alg.triangle_buggy(1, 2, 3) == 'thường'"
    steps:
      - show: |
          <p>Hàm phân loại tam giác qua cả bốn ca: (3, 3, 3) đều, (3, 3, 5) cân, (3, 4, 5) thường, (1, 2, 4) không phải tam giác. Vậy mà với (1, 2, 3) nó trả “thường” — ba cạnh đó nằm thẳng hàng, không phải tam giác.</p>
          <div class="box key">Hôm nay: chọn ca kiểm có hệ thống — <b>phân hoạch tương đương</b> và <b>giá trị biên</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một hàm phân loại tam giác qua cả bốn ca kiểm, tam giác đều, cân, thường, và một bộ không phải tam giác. Vậy mà với ba cạnh 1, 2, 3 nó trả về tam giác thường, trong khi ba đoạn đó nằm thẳng hàng, không tạo thành tam giác. Hôm nay ta học cách chọn ca kiểm có hệ thống, với phân hoạch tương đương và giá trị biên."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: khi nào ba đoạn thẳng ghép được tam giác"
    checks:
      - "sorted([5, 3, 3]) == [3, 3, 5] and 3 + 4 > 5 and 1 + 2 == 3 and not 1 + 2 > 4"
    steps:
      - show: |
          <p>Ba đoạn thẳng ghép được tam giác khi <b>hai đoạn ngắn cộng lại dài hơn đoạn dài nhất</b>. Nếu chỉ <b>bằng</b>, ba đoạn nằm sát thành một đường thẳng.</p>
          <table class="t"><tr><th>ba đoạn</th><th>hai đoạn ngắn</th><th>so với đoạn dài</th><th>tam giác?</th></tr>
          <tr><td>3, 4, 5</td><td>3 + 4 = 7</td><td>7 &gt; 5</td><td>có</td></tr>
          <tr><td>1, 2, 3</td><td>1 + 2 = 3</td><td>3 = 3</td><td>không (thẳng hàng)</td></tr>
          <tr><td>1, 2, 4</td><td>1 + 2 = 3</td><td>3 &lt; 4</td><td>không (không chạm tới)</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Trước hết, ôn hình học. Ba đoạn thẳng ghép được tam giác khi hai đoạn ngắn cộng lại dài hơn đoạn dài nhất, còn nếu chỉ bằng thì ba đoạn nằm sát thành một đường thẳng. Bảng có ba ví dụ. 3 cộng 4 bằng 7, lớn hơn 5, nên là tam giác. 1 cộng 2 bằng 3, đúng bằng 3, nên thẳng hàng. 1 cộng 2 bằng 3, nhỏ hơn 4, nên hai đoạn ngắn không chạm tới nhau."
      - show: |
          <p>Muốn so “hai đoạn ngắn” với “đoạn dài”, trước hết <b>sắp</b> ba số tăng dần: (5, 3, 3) → (3, 3, 5).</p>
        say: "Muốn so hai đoạn ngắn với đoạn dài, trước hết hãy sắp ba số tăng dần, ví dụ 5, 3, 3 thành 3, 3, 5."

  - id: sym
    kind: symbol
    title: "Giải mã: lớp tương đương và biên"
    steps:
      - show: |
          <p><b>Phân hoạch tương đương</b>: chia mọi đầu vào thành các <b>lớp</b> mà chương trình (theo đặc tả) xử lý giống nhau. Mỗi lớp lấy ít nhất một ca.</p>
          <p><b>Giá trị biên</b>: lỗi hay nằm ở <b>ranh giới</b> giữa hai lớp (lỗi lệch một ở bài 3: đếm thừa hay thiếu đúng một, như viết &lt; thay cho ≤). Lấy thêm ca nằm đúng trên biên và sát hai bên biên.</p>
        focus: [1, 1, 2, 2, 2]
        say: "Phân hoạch tương đương là chia mọi đầu vào thành các lớp mà chương trình, theo đặc tả, xử lý giống nhau. Mỗi lớp lấy ít nhất một ca kiểm. Giá trị biên dựa trên nhận xét rằng lỗi hay nằm ở ranh giới giữa hai lớp, như lỗi lệch một ở bài 3. Lỗi lệch một là đếm thừa hay thiếu đúng một, chẳng hạn viết nhỏ hơn thay cho nhỏ hơn hoặc bằng. Vì vậy ta lấy thêm ca nằm đúng trên biên và sát hai bên biên."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Lỗi nằm trên vạch ranh giới"
    steps:
      - show: |
          <div><svg width="1500" height="300" viewBox="0 0 1500 300"><rect x="150" y="125" width="600" height="50" fill="#f3f4f6"/><rect x="750" y="125" width="600" height="50" fill="#dbeafe"/><line x1="750" y1="60" x2="750" y2="240" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 8"/><g font-size="23" fill="#1f2937"><circle cx="550" cy="150" r="13" fill="#6b7280"/><text x="550" y="105" text-anchor="middle">1, 2, 4</text><circle cx="750" cy="150" r="13" fill="#b91c1c"/><text x="750" y="95" text-anchor="middle">1, 2, 3</text><circle cx="950" cy="150" r="13" fill="#2a78d6"/><text x="950" y="105" text-anchor="middle">2, 2, 3</text><circle cx="1150" cy="150" r="13" fill="#2a78d6"/><text x="1150" y="105" text-anchor="middle">3, 4, 5</text><text x="300" y="230">lớp “không phải”</text><text x="1050" y="230">lớp “tam giác”</text><text x="750" y="280" text-anchor="middle" fill="#b91c1c">biên: x + y = z</text><text x="350" y="200" text-anchor="middle" font-size="20">-2</text><text x="550" y="200" text-anchor="middle" font-size="20">-1</text><text x="750" y="200" text-anchor="middle" font-size="20">0</text><text x="950" y="200" text-anchor="middle" font-size="20">1</text><text x="1150" y="200" text-anchor="middle" font-size="20">2</text><text x="160" y="200" font-size="20">x + y − z:</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình đặt mỗi bộ ba cạnh lên trục theo hiệu x cộng y trừ z. Bên trái vạch đỏ là lớp không phải tam giác, bên phải là lớp tam giác. Ca 1, 2, 3 nằm đúng trên vạch, và đó là chỗ một dấu nhỏ hơn viết nhầm sẽ cho kết quả sai."

  - id: example
    kind: example
    title: "Lớp và biên của bài tam giác"
    checks:
      - "[alg.triangle(*t) for t in [(3, 3, 3), (3, 3, 5), (3, 4, 5), (1, 2, 4), (0, 1, 1)]] == ['đều', 'cân', 'thường', 'không phải', 'không phải']"
      - "[alg.triangle(*t) for t in [(1, 2, 3), (2, 2, 3), (1, 1, 2)]] == ['không phải', 'cân', 'không phải'] and [alg.triangle_buggy(*t) for t in [(1, 2, 3), (1, 1, 2)]] == ['thường', 'cân']"
    steps:
      - show: |
          <p><b>Bước 1</b> — sắp ba cạnh $x \le y \le z$. Là tam giác khi $x \gt 0$ và $x + y \gt z$.</p>
        say: "Bước một, sắp ba cạnh theo thứ tự x, y, z tăng dần. Ba cạnh tạo thành tam giác khi x dương và x cộng y lớn hơn z."
      - show: |
          <table class="t"><tr><th>lớp</th><th>ca đại diện</th></tr>
          <tr><td>đều</td><td>(3, 3, 3)</td></tr><tr><td>cân</td><td>(3, 3, 5)</td></tr><tr><td>thường</td><td>(3, 4, 5)</td></tr>
          <tr><td>không phải: $x + y \lt z$</td><td>(1, 2, 4)</td></tr><tr><td>không phải: cạnh ≤ 0</td><td>(0, 1, 1)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bước hai, chia thành năm lớp, mỗi lớp lấy một ca. Lớp tam giác đều lấy 3, 3, 3. Lớp cân lấy 3, 3, 5. Lớp thường lấy 3, 4, 5. Lớp không phải tam giác vì x cộng y nhỏ hơn z lấy 1, 2, 4. Lớp cuối có một cạnh không dương, ví dụ bộ ba cạnh 0, 1, 1."
      - clear: true
        show: |
          <p><b>Bước 3 — biên</b> giữa “tam giác” và “không phải” là $x + y = z$:</p>
          <table class="t"><tr><th>ca biên</th><th>đúng</th><th>bản lỗi (<code>x + y &lt; z</code>)</th></tr>
          <tr><td>(1, 2, 3)</td><td>không phải</td><td><b class="red">thường</b></td></tr>
          <tr><td>(1, 1, 2)</td><td>không phải</td><td><b class="red">cân</b></td></tr>
          <tr><td>(2, 2, 3) sát biên</td><td>cân</td><td>cân</td></tr></table>
        focus: [1, 2, "2.2", "2.3", "2.4"]
        say: "Bước ba, biên giữa tam giác và không phải tam giác là x cộng y đúng bằng z. Bây giờ thử các ca nằm đúng trên biên với bản có lỗi. Với 1, 2, 3, đáp án đúng là không phải tam giác, nhưng bản lỗi trả về tam giác thường. Với 1, 1, 2, bản lỗi trả về tam giác cân. Ca sát biên 2, 2, 3 thì cả hai đều đúng."
      - show: |
          <div class="box key">Bản lỗi viết <code>x + y &lt; z</code> thay vì <code>x + y &lt;= z</code> cho “không phải tam giác”. Năm ca ở giữa lớp không bắt được; ca <b>trên biên</b> bắt ngay.</div>
        say: "Bước bốn, rút ra kết luận. Bản lỗi viết nhỏ hơn thay vì nhỏ hơn hoặc bằng ở điều kiện không phải tam giác, nên năm ca ở giữa các lớp không bắt được lỗi, còn ca trên biên bắt ngay."

  - id: check
    kind: check
    title: "Tự kiểm: thử hết mọi bộ cạnh nhỏ"
    checks:
      - "(lambda d: len(d) == 9 and all(a + b == c for a, b, c in d))([(a, b, c) for a in range(1, 7) for b in range(a, 7) for c in range(b, 7) if alg.triangle(a, b, c) != alg.triangle_buggy(a, b, c)])"
      - "len([1 for a in range(1, 7) for b in range(a, 7) for c in range(b, 7)]) == 56"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>máy chạy cả hai bản trên mọi bộ cạnh sắp tăng từ 1 tới 6</td><td>56 bộ</td></tr>
          <tr><td>số bộ hai bản cho kết quả khác nhau</td><td>9 bộ</td></tr>
          <tr><td>9 bộ đó có $x + y = z$ không?</td><td>có, cả 9 — lỗi chỉ nằm trên biên ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, cho máy thử hết, vì với cạnh nhỏ số bộ cạnh là hữu hạn. Chạy cả hai bản trên mọi bộ cạnh sắp tăng từ 1 tới 6, tổng cộng 56 bộ. Chỉ 9 bộ cho kết quả khác nhau. Cả 9 bộ đều có x cộng y bằng z, xác nhận lỗi chỉ nằm trên biên."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin “qua hết ca kiểm là không có lỗi” <b class="red">(sai)</b>
          <br><span class="note">Dijkstra (1970): kiểm thử chỉ ra được <b>có</b> lỗi, không bao giờ chứng minh được <b>không có</b> lỗi. Muốn chắc chắn cần lập luận chứng minh, như bất biến vòng lặp và hàm biến thiên (bài 1–2).</span></div>
        say: "Lỗi thứ nhất, tin rằng qua hết ca kiểm là không có lỗi. Như một nhận xét nổi tiếng năm 1970, kiểm thử chỉ ra được có lỗi, không bao giờ chứng minh được không có lỗi. Muốn chắc chắn thì cần lập luận chứng minh, như bất biến vòng lặp và hàm biến thiên ở bài 1 và bài 2."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Nhiều ca trong cùng một lớp <b class="red">(lãng phí)</b>
          <br><span class="note">(3, 4, 5), (5, 6, 7), (6, 7, 8) đều “thường”: thêm ca không thêm thông tin. Dồn công vào lớp chưa có ca và vào biên.</span></div>
        say: "Lỗi thứ hai, viết nhiều ca trong cùng một lớp. Ba bộ cạnh khác nhau đều là tam giác thường thì thêm ca cũng không thêm thông tin, nên hãy dồn công vào lớp chưa có ca và vào biên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên lớp “đầu vào không hợp lệ” và đầu vào lạ <b class="red">(thiếu)</b>
          <br><span class="note">Cạnh 0, cạnh âm (không hợp lệ); cạnh đưa vào không theo thứ tự như (5, 3, 3) (hợp lệ nhưng dễ quên). Đặc tả — hợp đồng tiền, hậu điều kiện (bài 0) — nói gì thì kiểm đúng điều đó.</span></div>
        say: "Lỗi thứ ba, quên lớp đầu vào không hợp lệ, như cạnh bằng 0 hay cạnh âm, và quên đầu vào hợp lệ nhưng lạ, như cạnh đưa vào không theo thứ tự. Đặc tả, tức hợp đồng tiền điều kiện và hậu điều kiện ở bài 0, nói gì thì kiểm đúng điều đó."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[alg.triangle(*t) for t in [(5, 3, 3), (2, 2, 4), (2, 3, 4)]] == ['cân', 'không phải', 'thường']"
      - "alg.triangle_buggy(2, 2, 4) == 'cân'"
    steps:
      - show: |
          <p>Hàm phân loại tam giác. Kết quả đúng của mỗi ca? Ca nào bắt được bản lỗi?</p>
          <table class="t"><tr><th>ca</th><th>ba cạnh</th></tr><tr><td>1</td><td>(5, 3, 3)</td></tr><tr><td>2</td><td>(2, 2, 4)</td></tr><tr><td>3</td><td>(2, 3, 4)</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Bây giờ đến lượt bạn tự làm, với hàm phân loại tam giác, hãy cho biết kết quả đúng của mỗi ca, và ca nào bắt được bản lỗi. Ca một là 5, 3, 3. Ca hai là 2, 2, 4. Ca ba là 2, 3, 4. Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>ca</th><th>sắp lại</th><th>so</th><th>đúng</th></tr>
          <tr><td>1</td><td>(3, 3, 5)</td><td>3 + 3 = 6 &gt; 5</td><td>cân</td></tr>
          <tr><td>3</td><td>(2, 3, 4)</td><td>2 + 3 = 5 &gt; 4</td><td>thường</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án, trước hết sắp lại và so. Ca một sắp thành 3, 3, 5, có 3 cộng 3 lớn hơn 5 và hai cạnh bằng nhau, nên là tam giác cân. Ca ba có 2 cộng 3 lớn hơn 4 và ba cạnh khác nhau, nên là tam giác thường."
      - show: |
          <p>② (2, 2, 4): $2 + 2 = 4$ nằm <b>trên biên</b> → <b>không phải</b>; bản lỗi trả “cân” → $\hl{\text{bắt được lỗi}}$.</p>
        say: "Ca hai, 2 cộng 2 bằng 4, nằm đúng trên biên nên không phải tam giác, còn bản lỗi trả về cân. Vậy chỉ ca hai bắt được lỗi, đúng như nguyên tắc chọn ca trên biên."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đặc tả</span><span class="a">→</span>
          <span class="n">lớp tương đương: mỗi lớp một ca</span><span class="a">→</span>
          <span class="n">biên: trên biên và sát biên</span><span class="a">→</span>
          <span class="n">qua hết ≠ không có lỗi</span></div>
        say: "Tổng kết lại, từ đặc tả, ta chia đầu vào thành các lớp tương đương, mỗi lớp một ca. Lấy thêm ca trên biên và sát biên, và nhớ rằng qua hết ca kiểm không có nghĩa là không có lỗi."
      - show: |
          <div class="box key"><b>Tư duy:</b> một ca kiểm tốt là ca có khả năng làm chương trình sai cao nhất. Hãy nghĩ như người muốn phá, không như người muốn thấy nó chạy.</div>
        say: "Điều cần mang theo, một ca kiểm tốt là ca có khả năng làm chương trình sai cao nhất. Hãy nghĩ như người muốn phá, không như người muốn thấy nó chạy."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): đo xem bộ ca kiểm đã chạy qua bao nhiêu phần của mã — <b>độ phủ</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta đo xem bộ ca kiểm đã chạy qua bao nhiêu phần của mã, gọi là độ phủ. Hẹn gặp bạn ở bài tiếp theo."
