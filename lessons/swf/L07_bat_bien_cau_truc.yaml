      là cách giữ lời hứa đó.</div>

      '
    say: Điều cần mang theo, một cấu trúc dữ liệu là một lời hứa. Bất biến là nội dung lời hứa, còn đóng gói là cách giữ lời
      hứa đó. Viết sẵn hàm kiểm định tính toàn vẹn cấu trúc cho phép phát hiện hỏng hóc ngay khoảnh khắc thao tác gây lỗi
