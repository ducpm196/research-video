    say: Tổng kết lại, bất biến đúng trước và sau mỗi thao tác. Với cây tìm kiếm, bất biến nói về cả cây con, kiểm bằng duyệt
      giữa hoặc truyền khoảng, và dữ liệu bên trong phải được giấu đi. Bất biến cấu trúc dữ liệu là linh hồn bảo đảm mọi lời
      hứa về độ phức tạp thời gian và tính chính xác phép tra cứu.
