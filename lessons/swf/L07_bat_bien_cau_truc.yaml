scenes:
- id: hook
  kind: hook
  title: Cây trông đúng ở từng nút, tìm vẫn hụt
  checks:
  - alg.bst_local_ok((10, (5, None, (12, None, None)), (15, None, None))) and not alg.bst_ok((10, (5, None, (12, None, None)),
    (15, None, None)))
  steps:
  - show: '<p>Một cây tìm kiếm nhị phân: mỗi nút đều “con trái nhỏ hơn, con phải lớn hơn”. Vậy mà tìm số 12 thì hụt: đi từ
      gốc 10 sang <b>phải</b> (vì 12 &gt; 10), nhưng 12 lại nằm bên <b>trái</b>.</p>

      <div class="box key">Hôm nay: <b>bất biến của cấu trúc dữ liệu</b> — điều phải đúng mọi lúc để các thao tác cho kết
      quả đúng.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, một cây tìm kiếm nhị phân có mỗi nút đều thoả con trái nhỏ hơn, con phải lớn hơn. Vậy mà tìm số 12 thì
      hụt, vì đi từ gốc 10 sang phải do 12 lớn hơn 10, nhưng 12 lại nằm bên trái. Hôm nay ta học bất biến của cấu trúc dữ
      liệu, điều phải đúng mọi lúc để các thao tác cho kết quả đúng. Cấu trúc dữ liệu chỉ nhanh như quảng cáo khi từng nút
      bên trong luôn giữ trọn quy tắc sắp xếp hay cân bằng đặc thù sau mỗi thao tác. Mất bất biến cấu trúc dù chỉ ở một nút
      ngầm có thể khiến tìm kiếm âm thầm trả về sai kết quả mà không hề ném ra bất kỳ ngoại lệ nào.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: cây, duyệt giữa, và đống trong mảng'
  checks:
  - alg.inorder((4, (2, None, None), (6, None, None))) == [2, 4, 6] and [(i - 1) // 2 for i in range(1, 6)] == [0, 0, 1, 1,
    2]
  - all((c - 1) // 2 == i for i in range(50) for c in (2 * i + 1, 2 * i + 2))
  steps:
  - show: '<div><svg width="700" height="230" viewBox="0 0 700 230"><line x1="350" y1="50" x2="180" y2="160" stroke="#6b7280"
      stroke-width="2.5"/><line x1="350" y1="50" x2="520" y2="160" stroke="#6b7280" stroke-width="2.5"/><circle cx="350" cy="50"
      r="32" fill="#2a78d6"/><text x="350" y="59" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><circle
      cx="180" cy="160" r="32" fill="#2a78d6"/><text x="180" y="169" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><circle
      cx="520" cy="160" r="32" fill="#2a78d6"/><text x="520" y="169" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><g
      font-size="22" fill="#1f2937"><text x="400" y="45">gốc</text><text x="60" y="215">con trái</text><text x="560" y="215">con
      phải</text></g></svg></div>

      <p><b>Cây nhị phân</b>: mỗi nút có tối đa một <b>con trái</b> và một <b>con phải</b>; nút trên cùng là <b>gốc</b>. Mỗi
      nút giữ một giá trị gọi là <b>khoá</b> — con số dùng để so khi tìm. <b>Duyệt giữa</b>: thăm cây con trái, rồi chính
      nút, rồi cây con phải — ở đây ra 2, 4, 6.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    - 2
    say: Trước hết, ta cần hiểu cây nhị phân. Mỗi nút có tối đa một con trái và một con phải, nút trên cùng là gốc. Mỗi nút
      giữ một giá trị gọi là khoá, là con số dùng để so sánh khi tìm. Duyệt giữa là thăm cây con trái, rồi chính nút, rồi
      cây con phải, nên cây này cho 2, 4, 6. Bất biến biểu diễn là cam kết nội bộ mà mọi phương thức công khai phải giữ gìn
      khi bước vào và trước lúc trả về. Với cây tìm kiếm nhị phân, mọi khoá bên cây con trái tuyệt đối nhỏ hơn khoá nút cha
      và toàn bộ cây con phải tuyệt đối lớn hơn.
  - show: '<table class="t"><tr><th>vị trí <code>i</code> trong mảng</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>

      <tr><th>vị trí cha <code>(i − 1) // 2</code></th><td>0</td><td>0</td><td>1</td><td>1</td><td>2</td></tr></table>

      <p><b>Đống</b> là cây nhị phân xếp kín từng tầng từ trái sang phải, nên lưu gọn trong mảng: gốc ở vị trí 0, hai con
      của vị trí <code>i</code> ở <code>2i + 1</code> và <code>2i + 2</code>, nên cha của vị trí <code>i</code> ở <code>(i
      − 1) // 2</code> (chia lấy phần nguyên).</p>

      '
    focus:
    - 2
    - 2
    - '1.2'
    - 2
    - 2
    say: Đống là một cây nhị phân xếp kín từng tầng từ trái sang phải, nên lưu được gọn trong một mảng. Gốc ở vị trí 0, còn
      hai con của vị trí i ở 2 i cộng 1 và 2 i cộng 2. Bảng cho vị trí cha của từng vị trí, ví dụ vị trí 3 và 4 có cha ở vị
      trí 1, còn vị trí 5 có cha ở vị trí 2. Công thức là i trừ 1, chia lấy phần nguyên cho 2, tức bỏ phần lẻ. Với đống nhị
      phân cực tiểu, khoá mỗi nút cha không được phép lớn hơn bất kỳ nút con trực tiếp nào bên dưới.
- id: sym
  kind: symbol
  title: 'Giải mã: bất biến biểu diễn'
  steps:
  - show: '<p><b>Bất biến biểu diễn</b>: điều kiện trên dữ liệu bên trong mà mọi thao tác <b>giả định</b> là đúng khi bắt
      đầu, và phải <b>giữ</b> đúng khi kết thúc — như bất biến vòng lặp ở bài 1 (mệnh đề đúng trước mỗi vòng và vẫn đúng sau
      vòng đó), với “một vòng” là một thao tác.</p>

      <table class="t"><tr><th>cấu trúc</th><th>bất biến</th></tr>

      <tr><td>cây tìm kiếm nhị phân</td><td>mọi khoá trong cây con <b>trái</b> &lt; khoá nút &lt; mọi khoá trong cây con <b>phải</b></td></tr>

      <tr><td>đống nhỏ nhất (mảng)</td><td><code>a[(i − 1) // 2] ≤ a[i]</code> với mọi <code>i ≥ 1</code>: cha không lớn hơn
      con</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    - '2.3'
    say: Bất biến biểu diễn là điều kiện trên dữ liệu bên trong mà mọi thao tác giả định là đúng khi bắt đầu, và phải giữ
      đúng khi kết thúc. Nó giống bất biến vòng lặp ở bài 1, mệnh đề đúng trước mỗi vòng và vẫn đúng sau vòng đó, chỉ là một
      vòng ở đây là một thao tác. Ta xét hai cấu trúc. Với cây tìm kiếm nhị phân, mọi khoá trong cây con trái nhỏ hơn khoá
      của nút, và khoá của nút nhỏ hơn mọi khoá trong cây con phải. Với đống nhỏ nhất lưu trong mảng, phần tử cha không lớn
      hơn phần tử con, ở mọi vị trí. Hàm kiểm tra tính hợp lệ cấu trúc đóng vai trò chiếc kính hiển vi tự động rà soát toàn
      bộ liên kết con trỏ và bất biến giá trị. Khi kết hợp hàm này với kịch bản chuỗi thao tác thêm xoá ngẫu nhiên, ta vạch
      trần lỗi đứt liên kết chỉ trong vài giây chạy thử.
- id: intuition
  kind: intuition
  title: Mỗi nút được giao một khoảng
  steps:
  - show: '<div><svg width="1500" height="330" viewBox="0 0 1500 330"><line x1="750" y1="55" x2="420" y2="160" stroke="#6b7280"
      stroke-width="2.5"/><line x1="420" y1="160" x2="640" y2="265" stroke="#6b7280" stroke-width="2.5"/><line x1="750" y1="55"
      x2="1080" y2="160" stroke="#6b7280" stroke-width="2.5"/><circle cx="750" cy="55" r="32" fill="#2a78d6"/><text x="750"
      y="64" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text><circle cx="420" cy="160" r="32"
      fill="#2a78d6"/><text x="420" y="169" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><circle
      cx="1080" cy="160" r="32" fill="#2a78d6"/><text x="1080" y="169" font-size="26" fill="#ffffff" text-anchor="middle"
      font-weight="bold">15</text><circle cx="640" cy="265" r="32" fill="#b91c1c"/><text x="640" y="274" font-size="26" fill="#ffffff"
      text-anchor="middle" font-weight="bold">12</text><g font-size="23" fill="#1f2937"><text x="800" y="50">khoảng: mọi số</text><text
      x="160" y="150">khoảng: dưới 10</text><text x="1130" y="155">khoảng: trên 10</text><text x="690" y="275" fill="#b91c1c">khoảng:
      trên 5 và dưới 10 — 12 nằm ngoài</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: 'Hình gắn cho mỗi vị trí trong cây một khoảng giá trị cho phép. Gốc 10 nhận mọi số, cây con trái chỉ nhận số dưới
      10, cây con phải chỉ nhận số trên 10. Vị trí con phải của 5 nằm trong cây con trái của 10, nên chỉ nhận số từ trên 5
      tới dưới 10, và 12 nằm ngoài khoảng đó. Hãy hình dung tủ hồ sơ xếp theo bảng chữ cái: chỉ cần một người nhét nhầm tập
      hồ sơ chữ M sang ngăn chữ A thì mọi lượt tra cứu về sau đều tuyên bố không có. Thao tác tìm kiếm hoàn toàn không hỏng,
      thứ hỏng âm thầm là trật tự bất biến nội bộ lúc cất vào ngăn kéo.'
- id: example
  kind: example
  title: Kiểm sai cách và kiểm đúng cách
  checks:
  - alg.inorder((10, (5, None, (12, None, None)), (15, None, None))) == [5, 12, 10, 15]
  steps:
  - show: '<div><svg width="820" height="380" viewBox="0 0 820 380"><line x1="523" y1="55" x2="70" y2="160" stroke="#6b7280" stroke-width="2.5"/><line x1="70" y1="160" x2="297" y2="265" stroke="#6b7280" stroke-width="2.5"/><line x1="523" y1="55" x2="750" y2="160" stroke="#6b7280" stroke-width="2.5"/><circle cx="70" cy="160" r="34" fill="#2a78d6"/><text x="70" y="170" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><circle cx="297" cy="265" r="34" fill="#ffffff" stroke="#eb6834" stroke-width="3.5" stroke-dasharray="7 5"/><text x="297" y="275" font-size="28" fill="#eb6834" text-anchor="middle" font-weight="bold">12</text><circle cx="523" cy="55" r="34" fill="#2a78d6"/><text x="523" y="65" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text><circle cx="750" cy="160" r="34" fill="#2a78d6"/><text x="750" y="170" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">15</text><text x="410" y="366" font-size="24" fill="#6b7280" text-anchor="middle" font-weight="normal">duyệt giữa: 5, 12, 10, 15 — không tăng</text></svg></div>

      <p><b>Bước 1 — kiểm sai</b>: chỉ so mỗi nút với con trực tiếp — 5 &lt; 10, 15 &gt; 10, 12 &gt; 5: qua hết.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Đây là cây có vấn đề, nút 12 tô cam. Bước một, kiểm sai cách là chỉ so mỗi nút với con trực tiếp. 5 nhỏ hơn 10, 15
      lớn hơn 10, 12 lớn hơn 5, nên qua hết.
  - clear: true
    show: '<table class="t"><tr><th>nút</th><th>khoảng truyền xuống</th><th>nằm trong?</th></tr>

      <tr><td>10 (gốc)</td><td>mọi số</td><td>✓</td></tr>

      <tr><td>5 (trái của 10)</td><td>dưới 10</td><td>✓</td></tr>

      <tr><td>15 (phải của 10)</td><td>trên 10</td><td>✓</td></tr>

      <tr><td>12 (phải của 5)</td><td>trên 5 <b>và</b> dưới 10</td><td class="red">không — vi phạm</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bước hai, kiểm đúng cách bằng cách truyền khoảng xuống từng nút. Gốc 10 nhận mọi số. Nút 5 là con trái nên phải dưới
      10, đúng. Nút 15 là con phải nên phải trên 10, đúng. Nút 12 là con phải của 5 trong cây con trái của 10, nên phải trên
      5 và dưới 10, và 12 vi phạm.
  - show: '<p><b>Bước 3 — cách tương đương</b>: duyệt giữa phải ra dãy <b>tăng</b>. Ở đây ra $5, 12, 10, 15$ — 12 đứng trước
      10, không tăng.</p>

      '
    say: Bước ba, một cách tương đương là duyệt giữa, phải cho dãy tăng. Ở đây duyệt giữa cho 5, 12, 10, 15, số 12 đứng trước
      10, nên không tăng. Mỗi thao tác biến đổi đều phải giữ nguyên bất biến tìm kiếm nhị phân từ gốc tới mọi nút con.
    focus:
    - 0
    - '1.1'
    - '1.3'
- id: check
  kind: check
  title: 'Tự kiểm: sửa cây rồi kiểm lại bằng hai cách'
  checks:
  - alg.inorder((10, (5, None, (7, None, None)), (15, None, None))) == [5, 7, 10, 15] and alg.bst_ok((10, (5, None, (7, None,
    None)), (15, None, None)))
  steps:
  - show: '<table class="t"><tr><th>cây sau khi thay 12 bằng 7</th><th>cách</th><th>kết quả</th></tr>

      <tr><td rowspan="2">gốc 10; trái 5 (phải 7); phải 15</td><td>truyền khoảng: 7 có trên 5 và dưới 10?</td><td>có ✓</td></tr>

      <tr><td>duyệt giữa</td><td>5, 7, 10, 15 — tăng ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    say: Kiểm bằng đường khác, thay 12 bằng 7 rồi dùng cả hai cách. Truyền khoảng thì 7 vừa trên 5 vừa dưới 10, nên đúng.
      Duyệt giữa cho 5, 7, 10, 15, dãy tăng, nên hai cách cùng kết luận cây đã hợp lệ.
  - show: <table class='t'><tr><th>cấu trúc</th><th>kiểm chứng trước và sau thao tác</th><th>kết quả</th></tr><tr><td>Đống
      <code>[1, 4, 3, 7, 8]</code></td><td>mọi con <code>i</code> đều thoả <code>h[(i-1)//2] &lt;= h[i]</code></td><td class='green'>giữ
      nguyên bất biến</td></tr><tr><td>Đống lỗi <code>[1, 5, 3, 2, 8]</code></td><td>vị trí <code>3</code> (giá trị <code>2</code>)
      có cha <code>5 &gt; 2</code></td><td class='red'>vi phạm khi sửa thẳng mảng</td></tr></table>
    say: Kiểm tiếp bất biến của đống nhỏ nhất và vai trò bảo toàn sau mỗi thao tác. Mảng 1, 4, 3, 7, 8 thoả cha không lớn
      hơn con tại mọi vị trí, nhưng khi cho sửa mảng từ ngoài thành 2 ở vị trí 3 có cha là 5, bất biến lập tức gãy. Vì vậy
      mọi thao tác thay đổi đều phải đi qua phương thức đóng gói và giữ trọn bất biến biểu diễn.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi người mới hay mắc
  checks:
  - alg.heap_ok([1, 3, 2, 7]) and not alg.heap_ok([1, 3, 2, 0]) and (3 - 1) // 2 == 1
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Kiểm bất biến cây chỉ ở con trực tiếp <b class="red">(sai)</b>

      <br><span class="note">Như ví dụ: mọi cặp cha–con đúng mà cả cây sai. Bất biến nói về <b>cả cây con</b>.</span></div>

      '
    say: Lỗi thứ nhất, kiểm bất biến cây chỉ ở con trực tiếp. Như ví dụ vừa rồi, mọi cặp cha con đều đúng mà cả cây vẫn sai,
      vì bất biến nói về cả cây con. Chỉ kiểm tra quan hệ cục bộ giữa cha và con trực tiếp khi kiểm định cây tìm kiếm nhị
      phân mà quên kiểm tra cận trên cận dưới kế thừa từ tổ tiên. Sai lầm kinh điển đó bỏ lọt những nút cháu chắt nằm bên
      trái nhưng lại chứa giá trị lớn hơn hẳn nút gốc ban đầu.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
  - show: '<div class="box warn"><b>Lỗi 2.</b> Cho phép sửa dữ liệu bên trong từ bên ngoài <b class="red">(phá bất biến)</b>

      <br><span class="note">Trả ra chính mảng của đống <code>[1, 3, 2, 7]</code> để người dùng sửa <code>a[3] = 0</code>
      → <code>[1, 3, 2, 0]</code>: 0 nằm ngay dưới 3 (cha của vị trí 3 là vị trí 1), đống hỏng. Chỉ cho sửa qua các thao tác
      giữ bất biến.</span></div>

      '
