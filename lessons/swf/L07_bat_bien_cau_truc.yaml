id: L07
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 7 — Bất biến của cấu trúc dữ liệu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L07; audit/swf/verify_swf.py L07; B. Liskov, J. Guttag, Program Development in Java (2001), chương 5 (bất biến biểu diễn); T. H. Cormen và cộng sự, Introduction to Algorithms, 4th ed. (2022), mục 6.1 và 12.1; CS112 bài 5–6"
assumes: [arith, ltgt, frac]
# Quy ước: cây viết (khoá, trái, phải); đống nhỏ nhất lưu trong mảng, cha của vị trí i là ⌊(i − 1)/2⌋ (viết (i − 1) // 2 trong <code>).
#   Kiểm cây sai cách (chỉ con trực tiếp) = alg.bst_local_ok; đúng cách (truyền khoảng) = alg.bst_ok; duyệt giữa = alg.inorder; đống = alg.heap_ok.
objectives:
  - "Phát biểu bất biến biểu diễn của một cấu trúc dữ liệu"
  - "Kiểm đúng bất biến cây tìm kiếm nhị phân và đống"
  - "Biết mọi thao tác phải giữ bất biến"
asr_reviewed:
  - {sentence: "Vậy mảng không phải đống nhỏ nhất, vi phạm ở hai chỗ.", reason: "ASR chép “Vậy mạng không phải đóng nhỏ nhất vì phạm ở hai chỗ.” (0.75): lệch âm/thanh thuần Việt: mảng/mạng, đống/đóng, vi/vì — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Cây trông đúng ở từng nút, tìm vẫn hụt"
    checks:
      - "alg.bst_local_ok((10, (5, None, (12, None, None)), (15, None, None))) and not alg.bst_ok((10, (5, None, (12, None, None)), (15, None, None)))"
    steps:
      - show: |
          <p>Một cây tìm kiếm nhị phân: mỗi nút đều “con trái nhỏ hơn, con phải lớn hơn”. Vậy mà tìm số 12 thì hụt: đi từ gốc 10 sang <b>phải</b> (vì 12 &gt; 10), nhưng 12 lại nằm bên <b>trái</b>.</p>
          <div class="box key">Hôm nay: <b>bất biến của cấu trúc dữ liệu</b> — điều phải đúng mọi lúc để các thao tác cho kết quả đúng.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một cây tìm kiếm nhị phân có mỗi nút đều thoả con trái nhỏ hơn, con phải lớn hơn. Vậy mà tìm số 12 thì hụt, vì đi từ gốc 10 sang phải do 12 lớn hơn 10, nhưng 12 lại nằm bên trái. Hôm nay ta học bất biến của cấu trúc dữ liệu, điều phải đúng mọi lúc để các thao tác cho kết quả đúng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: cây, duyệt giữa, và đống trong mảng"
    checks:
      - "alg.inorder((4, (2, None, None), (6, None, None))) == [2, 4, 6] and [(i - 1) // 2 for i in range(1, 6)] == [0, 0, 1, 1, 2]"
      - "all((c - 1) // 2 == i for i in range(50) for c in (2 * i + 1, 2 * i + 2))"
    steps:
      - show: |
          <div><svg width="700" height="230" viewBox="0 0 700 230"><line x1="350" y1="50" x2="180" y2="160" stroke="#6b7280" stroke-width="2.5"/><line x1="350" y1="50" x2="520" y2="160" stroke="#6b7280" stroke-width="2.5"/><circle cx="350" cy="50" r="32" fill="#2a78d6"/><text x="350" y="59" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><circle cx="180" cy="160" r="32" fill="#2a78d6"/><text x="180" y="169" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><circle cx="520" cy="160" r="32" fill="#2a78d6"/><text x="520" y="169" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><g font-size="22" fill="#1f2937"><text x="400" y="45">gốc</text><text x="60" y="215">con trái</text><text x="560" y="215">con phải</text></g></svg></div>
          <p><b>Cây nhị phân</b>: mỗi nút có tối đa một <b>con trái</b> và một <b>con phải</b>; nút trên cùng là <b>gốc</b>. Mỗi nút giữ một giá trị gọi là <b>khoá</b> — con số dùng để so khi tìm. <b>Duyệt giữa</b>: thăm cây con trái, rồi chính nút, rồi cây con phải — ở đây ra 2, 4, 6.</p>
        focus: [1, 2, 2, 2]
        say: "Trước hết, ta cần hiểu cây nhị phân. Mỗi nút có tối đa một con trái và một con phải, nút trên cùng là gốc. Mỗi nút giữ một giá trị gọi là khoá, là con số dùng để so sánh khi tìm. Duyệt giữa là thăm cây con trái, rồi chính nút, rồi cây con phải, nên cây này cho 2, 4, 6."
      - show: |
          <table class="t"><tr><th>vị trí <code>i</code> trong mảng</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
          <tr><th>vị trí cha <code>(i − 1) // 2</code></th><td>0</td><td>0</td><td>1</td><td>1</td><td>2</td></tr></table>
          <p><b>Đống</b> là cây nhị phân xếp kín từng tầng từ trái sang phải, nên lưu gọn trong mảng: gốc ở vị trí 0, hai con của vị trí <code>i</code> ở <code>2i + 1</code> và <code>2i + 2</code>, nên cha của vị trí <code>i</code> ở <code>(i − 1) // 2</code> (chia lấy phần nguyên).</p>
        focus: [2, 2, "1.2", 2]
        say: "Đống là một cây nhị phân xếp kín từng tầng từ trái sang phải, nên lưu được gọn trong một mảng. Gốc ở vị trí 0, còn hai con của vị trí i ở 2 i cộng 1 và 2 i cộng 2. Bảng cho vị trí cha của từng vị trí, ví dụ vị trí 3 và 4 có cha ở vị trí 1, còn vị trí 5 có cha ở vị trí 2. Công thức là i trừ 1, chia lấy phần nguyên cho 2, tức bỏ phần lẻ."

  - id: sym
    kind: symbol
    title: "Giải mã: bất biến biểu diễn"
    steps:
      - show: |
          <p><b>Bất biến biểu diễn</b>: điều kiện trên dữ liệu bên trong mà mọi thao tác <b>giả định</b> là đúng khi bắt đầu, và phải <b>giữ</b> đúng khi kết thúc — như bất biến vòng lặp ở bài 1 (mệnh đề đúng trước mỗi vòng và vẫn đúng sau vòng đó), với “một vòng” là một thao tác.</p>
          <table class="t"><tr><th>cấu trúc</th><th>bất biến</th></tr>
          <tr><td>cây tìm kiếm nhị phân</td><td>mọi khoá trong cây con <b>trái</b> &lt; khoá nút &lt; mọi khoá trong cây con <b>phải</b></td></tr>
          <tr><td>đống nhỏ nhất (mảng)</td><td><code>a[(i − 1) // 2] ≤ a[i]</code> với mọi <code>i ≥ 1</code>: cha không lớn hơn con</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Bất biến biểu diễn là điều kiện trên dữ liệu bên trong mà mọi thao tác giả định là đúng khi bắt đầu, và phải giữ đúng khi kết thúc. Nó giống bất biến vòng lặp ở bài 1, mệnh đề đúng trước mỗi vòng và vẫn đúng sau vòng đó, chỉ là một vòng ở đây là một thao tác. Ta xét hai cấu trúc. Với cây tìm kiếm nhị phân, mọi khoá trong cây con trái nhỏ hơn khoá của nút, và nhỏ hơn mọi khoá trong cây con phải. Với đống nhỏ nhất lưu trong mảng, phần tử cha không lớn hơn phần tử con, ở mọi vị trí."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi nút được giao một khoảng"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><line x1="750" y1="55" x2="420" y2="160" stroke="#6b7280" stroke-width="2.5"/><line x1="420" y1="160" x2="640" y2="265" stroke="#6b7280" stroke-width="2.5"/><line x1="750" y1="55" x2="1080" y2="160" stroke="#6b7280" stroke-width="2.5"/><circle cx="750" cy="55" r="32" fill="#2a78d6"/><text x="750" y="64" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text><circle cx="420" cy="160" r="32" fill="#2a78d6"/><text x="420" y="169" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><circle cx="1080" cy="160" r="32" fill="#2a78d6"/><text x="1080" y="169" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">15</text><circle cx="640" cy="265" r="32" fill="#b91c1c"/><text x="640" y="274" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">12</text><g font-size="23" fill="#1f2937"><text x="800" y="50">khoảng: mọi số</text><text x="160" y="150">khoảng: dưới 10</text><text x="1130" y="155">khoảng: trên 10</text><text x="690" y="275" fill="#b91c1c">khoảng: trên 5 và dưới 10 — 12 nằm ngoài</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình gắn cho mỗi vị trí trong cây một khoảng giá trị cho phép. Gốc 10 nhận mọi số, cây con trái chỉ nhận số dưới 10, cây con phải chỉ nhận số trên 10. Vị trí con phải của 5 nằm trong cây con trái của 10, nên chỉ nhận số từ trên 5 tới dưới 10, và 12 nằm ngoài khoảng đó."

  - id: example
    kind: example
    title: "Kiểm sai cách và kiểm đúng cách"
    checks:
      - "alg.inorder((10, (5, None, (12, None, None)), (15, None, None))) == [5, 12, 10, 15]"
    steps:
      - show: |
          <div><svg width="820" height="380" viewBox="0 0 820 380"><line x1="523" y1="55" x2="70" y2="160" stroke="#6b7280" stroke-width="2.5"/><line x1="70" y1="160" x2="297" y2="265" stroke="#6b7280" stroke-width="2.5"/><line x1="523" y1="55" x2="750" y2="160" stroke="#6b7280" stroke-width="2.5"/><circle cx="70" cy="160" r="34" fill="#2a78d6"/><text x="70" y="170" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><circle cx="297" cy="265" r="34" fill="#ffffff" stroke="#eb6834" stroke-width="3.5" stroke-dasharray="7 5"/><text x="297" y="275" font-size="28" fill="#eb6834" text-anchor="middle" font-weight="bold">12</text><circle cx="523" cy="55" r="34" fill="#2a78d6"/><text x="523" y="65" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text><circle cx="750" cy="160" r="34" fill="#2a78d6"/><text x="750" y="170" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">15</text><text x="410" y="366" font-size="24" fill="#6b7280" text-anchor="middle" font-weight="normal">duyệt giữa: 5, 12, 10, 15 — không tăng</text></svg></div>
          <p><b>Bước 1 — kiểm sai</b>: chỉ so mỗi nút với con trực tiếp — 5 &lt; 10, 15 &gt; 10, 12 &gt; 5: qua hết.</p>
        focus: [1, 2, 2]
        say: "Đây là cây có vấn đề, nút 12 tô cam. Bước một, kiểm sai cách là chỉ so mỗi nút với con trực tiếp. 5 nhỏ hơn 10, 15 lớn hơn 10, 12 lớn hơn 5, nên qua hết."
      - clear: true
        show: |
          <table class="t"><tr><th>nút</th><th>khoảng truyền xuống</th><th>nằm trong?</th></tr>
          <tr><td>10 (gốc)</td><td>mọi số</td><td>✓</td></tr>
          <tr><td>5 (trái của 10)</td><td>dưới 10</td><td>✓</td></tr>
          <tr><td>15 (phải của 10)</td><td>trên 10</td><td>✓</td></tr>
          <tr><td>12 (phải của 5)</td><td>trên 5 <b>và</b> dưới 10</td><td class="red">không — vi phạm</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bước hai, kiểm đúng cách bằng cách truyền khoảng xuống từng nút. Gốc 10 nhận mọi số. Nút 5 là con trái nên phải dưới 10, đúng. Nút 15 là con phải nên phải trên 10, đúng. Nút 12 là con phải của 5 trong cây con trái của 10, nên phải trên 5 và dưới 10, và 12 vi phạm."
      - show: |
          <p><b>Bước 3 — cách tương đương</b>: duyệt giữa phải ra dãy <b>tăng</b>. Ở đây ra $5, 12, 10, 15$ — 12 đứng trước 10, không tăng.</p>
        say: "Bước ba, một cách tương đương là duyệt giữa, phải cho dãy tăng. Ở đây duyệt giữa cho 5, 12, 10, 15, số 12 đứng trước 10, nên không tăng."

  - id: check
    kind: check
    title: "Tự kiểm: sửa cây rồi kiểm lại bằng hai cách"
    checks:
      - "alg.inorder((10, (5, None, (7, None, None)), (15, None, None))) == [5, 7, 10, 15] and alg.bst_ok((10, (5, None, (7, None, None)), (15, None, None)))"
    steps:
      - show: |
          <table class="t"><tr><th>cây sau khi thay 12 bằng 7</th><th>cách</th><th>kết quả</th></tr>
          <tr><td rowspan="2">gốc 10; trái 5 (phải 7); phải 15</td><td>truyền khoảng: 7 có trên 5 và dưới 10?</td><td>có ✓</td></tr>
          <tr><td>duyệt giữa</td><td>5, 7, 10, 15 — tăng ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, thay 12 bằng 7 rồi dùng cả hai cách. Truyền khoảng thì 7 vừa trên 5 vừa dưới 10, nên đúng. Duyệt giữa cho 5, 7, 10, 15, dãy tăng, nên hai cách cùng kết luận cây đã hợp lệ."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.heap_ok([1, 3, 2, 7]) and not alg.heap_ok([1, 3, 2, 0]) and (3 - 1) // 2 == 1"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Kiểm bất biến cây chỉ ở con trực tiếp <b class="red">(sai)</b>
          <br><span class="note">Như ví dụ: mọi cặp cha–con đúng mà cả cây sai. Bất biến nói về <b>cả cây con</b>.</span></div>
        say: "Lỗi thứ nhất, kiểm bất biến cây chỉ ở con trực tiếp. Như ví dụ vừa rồi, mọi cặp cha con đều đúng mà cả cây vẫn sai, vì bất biến nói về cả cây con."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cho phép sửa dữ liệu bên trong từ bên ngoài <b class="red">(phá bất biến)</b>
          <br><span class="note">Trả ra chính mảng của đống <code>[1, 3, 2, 7]</code> để người dùng sửa <code>a[3] = 0</code> → <code>[1, 3, 2, 0]</code>: 0 nằm ngay dưới 3 (cha của vị trí 3 là vị trí 1), đống hỏng. Chỉ cho sửa qua các thao tác giữ bất biến.</span></div>
        say: "Lỗi thứ hai, cho phép sửa dữ liệu bên trong từ bên ngoài. Trả ra chính mảng của đống 1, 3, 2, 7 để người dùng gán phần tử ở vị trí 3 bằng 0, thì 0 nằm ngay dưới 3 và đống hỏng. Vì vậy chỉ cho sửa qua các thao tác giữ được bất biến."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Không ghi bất biến ra <b class="red">(thiếu)</b>
          <br><span class="note">Người sửa mã sau không biết điều gì phải giữ. Ghi bất biến ở đầu lớp, và kiểm nó sau mỗi thao tác khi chạy thử.</span></div>
        say: "Lỗi thứ ba, không ghi bất biến ra. Người sửa mã sau không biết điều gì phải giữ, nên hãy ghi bất biến ở đầu lớp, và kiểm nó sau mỗi thao tác khi chạy thử."

      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Kiểm toàn bộ bất biến sau mọi thao tác trong bản chạy thật <b class="red">(quá chậm)</b>
          <br><span class="note">Người làm nghề bật kiểm đầy đủ trong bản thử và khi chạy kiểm thử, còn bản chạy thật chỉ kiểm các điều rẻ.</span></div>
          <table class="t"><tr><th>cây cân bằng 1 triệu nút</th><th>số bước, cỡ</th></tr>
          <tr><td>một lần tìm hay chèn</td><td>khoảng 20</td></tr>
          <tr><td>kiểm toàn bộ bất biến</td><td>khoảng 1 triệu</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư, kiểm toàn bộ bất biến sau mọi thao tác ngay trong bản chạy thật, làm chương trình chậm hẳn. Người làm nghề bật kiểm đầy đủ trong bản thử và khi chạy kiểm thử, còn bản chạy thật chỉ kiểm những điều rẻ. Bảng so với cây cân bằng một triệu nút. Một lần tìm hay chèn chỉ khoảng 20 bước. Kiểm toàn bộ bất biến phải thăm mọi nút, khoảng một triệu bước."
  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.inorder((8, (4, (2, None, None), (9, None, None)), (12, None, None))) == [2, 4, 9, 8, 12] and not alg.bst_ok((8, (4, (2, None, None), (9, None, None)), (12, None, None)))"
      - "not alg.heap_ok([2, 5, 3, 6, 4, 1]) and (5 - 1) // 2 == 2"
      - "(lambda a: [i for i in range(1, len(a)) if a[(i - 1) // 2] > a[i]])([2, 5, 3, 6, 4, 1]) == [4, 5]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cây: gốc 8; con trái 4 (con trái 2, con phải 9); con phải 12. Có phải cây tìm kiếm nhị phân không? Duyệt giữa ra gì?</td></tr>
          <tr><td>2</td><td>Mảng <code>[2, 5, 3, 6, 4, 1]</code> có phải đống nhỏ nhất không? Vi phạm ở đâu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cây có gốc 8, con trái 4 với hai con 2 và 9, con phải 12. Đây có phải cây tìm kiếm nhị phân không, duyệt giữa ra gì? Câu hai, mảng 2, 5, 3, 6, 4, 1 có phải đống nhỏ nhất không? Vi phạm ở đâu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① <b>Không</b>: duyệt giữa $2, 4, 9, 8, 12$ không tăng — 9 nằm trong cây con trái của 8 (khoảng “dưới 8”) mà lớn hơn 8.</p>
        say: "Đáp án câu một, không phải, duyệt giữa cho 2, 4, 9, 8, 12, không tăng. Số 9 nằm trong cây con trái của 8, tức khoảng dưới 8, mà lại lớn hơn 8."
      - show: |
          <table class="t"><tr><th>vị trí con</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
          <tr><th>giá trị cha ≤ con?</th><td>2 ≤ 5 ✓</td><td>2 ≤ 3 ✓</td><td>5 ≤ 6 ✓</td><td>5 ≤ 4 <b class="red">sai</b></td><td>3 ≤ 1 <b class="red">sai</b></td></tr></table>
          <p>② <b>Không</b> — vi phạm ở vị trí 4 và vị trí 5.</p>
        focus: [1, "1.2", 2]
        say: "Câu hai, so từng cặp cha và con. Ba vị trí đầu đều đúng, nhưng vị trí 4 có cha là 5 lớn hơn 4, và vị trí 5 có cha là 3 lớn hơn 1. Vậy mảng không phải đống nhỏ nhất, vi phạm ở hai chỗ."

