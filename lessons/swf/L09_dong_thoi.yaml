        say: "Đáp án câu một, có 6 bước, chọn 3 vị trí cho luồng 1, được tổ hợp chập 3 của 6, bằng 20 cách. Kết quả là 1, như hình trực giác, hoặc 2, khi hai lần tăng không chen vào nhau."
