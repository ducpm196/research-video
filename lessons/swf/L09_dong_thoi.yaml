id: L09
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 9 — Đồng thời trong mã: tranh chấp, khoá, bế tắc"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L09; audit/swf/verify_swf.py L09; E. G. Coffman, M. Elphick, A. Shoshani, System Deadlocks, ACM Computing Surveys 3(2), 1971; B. Goetz và cộng sự, Java Concurrency in Practice (2006), chương 10; OSY bài 4 và 6"
assumes: [arith]
# Quy ước: x++ = ba bước đọc, cộng, ghi (như OSY bài 4). Tập kết quả cuối qua MỌI cách xen kẽ = alg.race_finals; số cách xen kẽ = tổ hợp
#   C(12, 6). Bế tắc: kiểm mô hình mọi trạng thái của hai luồng lấy khoá theo thứ tự cho trước (alg.deadlock_states).
objectives:
  - "Nhận ra tranh chấp trên biến dùng chung"
  - "Dùng khoá đúng phạm vi"
  - "Tránh bế tắc bằng một thứ tự lấy khoá chung"
asr_reviewed:
  - {sentence: "Bước hai, xét một cách xen kẽ cụ thể.", reason: "ASR chép “Bước 2, xét 1 cách xem kẻ cụ thể.” (0.778): lệch âm/thanh thuần Việt: xen kẽ/xem kẻ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nếu luồng 2 lấy A, C, B thì sao?", reason: "ASR chép “Nếu lùng 2 lấy A, C, B thì 6”: luồng/lùng lệch vần, “sao” cuối câu hỏi bị nghe thành số “sáu”; thứ tự A, C, B chép đúng — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Kiểm thử qua 1000 lần, lỗi ở lần 1001"
    checks:
      - "math.comb(12, 6) == 924 and alg.race_finals(2) == {2, 3, 4}"
    steps:
      - show: |
          <p>Hai luồng, mỗi luồng chạy <code>x += 1</code> hai lần, <code>x</code> bắt đầu bằng 0. Mong đợi 4. Mỗi lần tăng là 3 bước (đọc, cộng, ghi), nên có $\hl{924}$ cách xen kẽ hai luồng — kết quả có thể là 2, 3 hoặc 4.</p>
          <div class="box key">Hôm nay: đưa kiến thức OSY vào mã hằng ngày — <b>tranh chấp</b>, <b>khoá</b>, <b>bế tắc</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, hai luồng, mỗi luồng tăng x thêm 1 hai lần, x bắt đầu bằng 0, ta mong đợi 4. Nhưng mỗi lần tăng gồm ba bước đọc, cộng, ghi, nên có tới 924 cách xen kẽ hai luồng. Kết quả cuối có thể là 2, 3 hoặc 4. Hôm nay ta đưa kiến thức của khoá Hệ điều hành vào mã hằng ngày, với tranh chấp, khoá và bế tắc."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: luồng, ba bước của x += 1, và đếm cách xen kẽ"
    checks:
      - "math.comb(4, 2) == 6 and math.comb(12, 6) == 924"
    steps:
      - show: |
          <p><b>Luồng</b> (khoá Hệ điều hành): một dòng chạy lệnh riêng trong cùng chương trình; nhiều luồng chạy xen kẽ, và bộ lập lịch quyết định ai chạy bước kế tiếp.</p>
          <table class="t"><tr><th><code>x += 1</code> thật ra là</th><th>bước</th></tr><tr><td>1</td><td>đọc <code>x</code> vào thanh ghi</td></tr><tr><td>2</td><td>cộng 1 trong thanh ghi</td></tr><tr><td>3</td><td>ghi thanh ghi về <code>x</code></td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4"]
        say: "Ở khoá Hệ điều hành, luồng là một dòng chạy lệnh riêng trong cùng chương trình. Nhiều luồng chạy xen kẽ, và bộ lập lịch quyết định ai chạy bước kế tiếp. Lệnh tăng x thêm 1 thật ra gồm ba bước. Một, đọc x vào thanh ghi. Hai, cộng 1 trong thanh ghi. Ba, ghi thanh ghi về x."
      - show: |
          <p><b>Đếm cách xen kẽ</b> (khoá Toán rời rạc): hai luồng, mỗi luồng $k$ bước giữ thứ tự riêng → chọn $k$ trong $2k$ vị trí cho luồng 1. Mỗi luồng 2 bước: $C(4, 2) = 6$ cách; mỗi luồng 6 bước: $C(12, 6) = 924$ cách.</p>
        say: "Ở khoá Toán rời rạc, ta đếm cách xen kẽ bằng tổ hợp. Hai luồng, mỗi luồng k bước giữ thứ tự riêng, ta chỉ cần chọn k trong 2 k vị trí cho luồng 1. Mỗi luồng 2 bước thì có tổ hợp chập 2 của 4, bằng 6 cách, mỗi luồng 6 bước thì có 924 cách."

  - id: sym
    kind: symbol
    title: "Giải mã: tranh chấp, đoạn găng, khoá"
    steps:
      - show: |
          <p><b>Tranh chấp</b>: kết quả phụ thuộc thứ tự xen kẽ của các luồng, khi chúng dùng chung dữ liệu và ít nhất một luồng ghi.</p>
          <p><b>Đoạn găng</b>: đoạn mã đọc–sửa–ghi dữ liệu chung, phải chạy trọn mà không bị luồng khác chen vào.</p>
          <p><b>Khoá</b>: chỉ một luồng giữ được tại một lúc; bọc đoạn găng bằng lấy khoá … nhả khoá.</p>
        focus: [1, 2, 3]
        say: "Tranh chấp xảy ra khi kết quả phụ thuộc thứ tự xen kẽ của các luồng, lúc chúng dùng chung dữ liệu và ít nhất một luồng ghi. Đoạn găng là đoạn mã đọc, sửa, ghi dữ liệu chung, phải chạy trọn mà không bị luồng khác chen vào. Khoá thì chỉ một luồng giữ được tại một lúc, và ta bọc đoạn găng bằng lấy khoá rồi nhả khoá."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một lần tăng bị ghi đè mất"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><g font-size="23" fill="#1f2937"><text x="20" y="92">luồng 1</text><text x="20" y="222">luồng 2</text><rect x="170" y="50" width="230" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="285" y="91" text-anchor="middle">đọc x = 0</text><rect x="690" y="50" width="230" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="805" y="91" text-anchor="middle">ghi x = 1</text><rect x="430" y="180" width="230" height="64" rx="8" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="545" y="221" text-anchor="middle">đọc x = 0</text><rect x="950" y="180" width="230" height="64" rx="8" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/><text x="1065" y="221" text-anchor="middle">ghi x = 1</text><line x1="170" y1="275" x2="1300" y2="275" stroke="#6b7280" stroke-width="2"/><text x="1310" y="282">thời gian</text><text x="1200" y="140" fill="#b91c1c" font-weight="bold">x cuối = 1, không phải 2</text><text x="610" y="315" fill="#b91c1c">luồng 2 đọc giá trị cũ, nên lần tăng của luồng 1 bị ghi đè mất</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ một cách xen kẽ xấu, mỗi luồng tăng x một lần. Luồng 1 đọc x bằng 0, rồi trước khi nó kịp ghi, luồng 2 cũng đọc x bằng 0. Hai luồng lần lượt ghi 1, nên x cuối bằng 1 chứ không phải 2, một lần tăng đã bị ghi đè mất."

  - id: example
    kind: example
    title: "Bế tắc vì hai thứ tự lấy khoá"
    checks:
      - "alg.deadlock_states('AB', 'BA') == 1 and alg.deadlock_states('AB', 'AB') == 0"
    steps:
      - show: |
          <div class="code"><div><span class="cm"># luồng 1: chuyển tiền tài khoản A → B</span></div><div>lay(A); lay(B); ...; nha(B); nha(A)</div><div><span class="cm"># luồng 2: chuyển tiền tài khoản B → A</span></div><div>lay(B); lay(A); ...; nha(A); nha(B)</div></div>
        say: "Bước một, luồng 1 chuyển tiền từ tài khoản A sang B, nên lấy khoá A rồi khoá B. Luồng 2 chuyển từ B sang A, nên lấy khoá B rồi khoá A."
      - show: |
          <table class="t"><tr><th>thời điểm</th><th>luồng 1</th><th>luồng 2</th></tr>
          <tr><td>1</td><td>lấy được A</td><td>—</td></tr>
          <tr><td>2</td><td>—</td><td>lấy được B</td></tr>
          <tr><td>3</td><td>chờ B (luồng 2 giữ)</td><td>chờ A (luồng 1 giữ)</td></tr></table>
          <p><b>Bước 2</b> — hai bên chờ nhau mãi: <b>bế tắc</b>.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Bước hai, xét một cách xen kẽ cụ thể. Thời điểm 1, luồng 1 lấy được khoá A. Thời điểm 2, luồng 2 lấy được khoá B. Thời điểm 3, luồng 1 chờ B mà luồng 2 đang giữ, còn luồng 2 chờ A mà luồng 1 đang giữ. Hai bên chờ nhau mãi, đó là bế tắc."
      - clear: true
        show: |
          <p><b>Bước 3</b> — kiểm mọi trạng thái của hai luồng: có đúng $\hl{1}$ trạng thái bế tắc — hiếm, nên kiểm thử dễ bỏ sót.</p>
        say: "Bước ba, kiểm mọi trạng thái có thể của hai luồng, chỉ có đúng 1 trạng thái bế tắc. Vì nó hiếm, kiểm thử chạy nhiều lần vẫn dễ bỏ sót."
      - show: |
          <div class="box key"><b>Bước 4 — sửa</b>: mọi luồng lấy khoá theo <b>cùng một thứ tự</b> (ví dụ theo số tài khoản tăng dần). Khi cả hai cùng lấy A trước rồi B: $\hl{0}$ trạng thái bế tắc.</div>
        say: "Bước bốn, cách sửa là mọi luồng lấy khoá theo cùng một thứ tự, ví dụ theo số tài khoản tăng dần. Khi cả hai cùng lấy A trước rồi B, không còn trạng thái bế tắc nào, vì ai lấy được A thì sẽ lấy được B."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "alg.deadlock_states('BA', 'BA') == 0 and alg.deadlock_states('AB', 'BA') == 1"
      - "math.factorial(12) // (math.factorial(6) * math.factorial(6)) == 924 and alg.race_finals(1) == {1, 2}"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>thứ tự chung nào cũng được?</td><td>cả hai lấy B trước rồi A</td><td>0 bế tắc ✓ — quan trọng là <b>chung</b>, không phải A hay B</td></tr>
          <tr><td>924 cách xen kẽ</td><td>$\frac{12!}{6! \cdot 6!}$</td><td>924 ✓</td></tr>
          <tr><td>mất cập nhật có thật?</td><td>máy thử mọi cách xen kẽ, mỗi luồng tăng 1 lần</td><td>x cuối là 1 hoặc 2 ✓</td></tr></table>
        introduces: [frac, cdot]
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác. Nếu cả hai luồng cùng lấy B trước rồi A, cũng không có bế tắc, vì điều quan trọng là thứ tự chung, không phải A hay B đi trước. Đếm cách xen kẽ bằng 12 giai thừa chia 6 giai thừa nhân 6 giai thừa cũng ra 924. Máy thử mọi cách xen kẽ khi mỗi luồng tăng một lần cho x cuối là 1 hoặc 2, xác nhận hình mất cập nhật."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Thêm lệnh ngủ cho “hết lỗi” <b class="red">(che lỗi)</b>
          <br><span class="note">Ngủ đổi xác suất của các cách xen kẽ, không loại bỏ cách xen kẽ xấu. Máy chậm hơn hay tải cao là lỗi quay lại.</span></div>
        say: "Lỗi thứ nhất, thêm lệnh ngủ để hết lỗi. Ngủ chỉ đổi xác suất của các cách xen kẽ, không loại bỏ cách xen kẽ xấu, nên khi máy chậm hơn hay tải cao thì lỗi quay lại."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Khoá chỉ khi ghi, không khoá khi đọc <b class="red">(sai)</b>
          <br><span class="note"><code>x += 1</code> gồm cả đọc lẫn ghi: phải khoá trọn đọc–sửa–ghi. Đọc không khoá có thể thấy giá trị cũ hoặc nửa vời.</span></div>
        say: "Lỗi thứ hai, chỉ khoá khi ghi mà không khoá khi đọc. Phép tăng gồm cả đọc lẫn ghi, nên phải khoá trọn cả đọc, sửa, ghi. Đọc mà không khoá có thể thấy giá trị cũ hoặc nửa vời."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên nhả khoá khi gặp lỗi <b class="red">(treo)</b>
          <br><span class="note">Ngoại lệ bật ra giữa đoạn găng → khoá không bao giờ được nhả, mọi luồng khác chờ mãi. Dùng khối tự nhả (<code>with lock:</code>, <code>try … finally</code>).</span></div>
        say: "Lỗi thứ ba, quên nhả khoá khi gặp lỗi. Một ngoại lệ bật ra giữa đoạn găng làm khoá không bao giờ được nhả, và mọi luồng khác chờ mãi. Hãy dùng khối lệnh tự nhả khoá."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.race_finals(1) == {1, 2} and math.comb(6, 3) == 20"
      - "alg.deadlock_states('ABC', 'CAB') == 1 and alg.deadlock_states('ABC', 'ACB') == 0"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hai luồng, mỗi luồng <code>x += 1</code> <b>một</b> lần, không khoá. Bao nhiêu cách xen kẽ? Kết quả có thể là gì?</td></tr>
          <tr><td>2</td><td>Luồng 1 lấy khoá A, B, C; luồng 2 lấy C, A, B. Có thể bế tắc không? Nếu luồng 2 lấy A, C, B thì sao?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hai luồng, mỗi luồng tăng x một lần, không khoá, có bao nhiêu cách xen kẽ, và kết quả có thể là gì? Câu hai, luồng 1 lấy khoá A, B, C, luồng 2 lấy C, A, B, có thể bế tắc không? Nếu luồng 2 lấy A, C, B thì sao? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① 6 bước, chọn 3 vị trí cho luồng 1: $C(6, 3) = \hl{20}$ cách; kết quả $\hl{1}$ (như hình trực giác) hoặc $\hl{2}$ (khi hai lần tăng không chen nhau).</p>
        say: "Đáp án câu một, có 6 bước, chọn 3 vị trí cho luồng 1, được tổ hợp chập 3 của 6, bằng 20 cách. Kết quả là 1, như hình trực giác, hoặc 2, khi hai lần tăng không chen vào nhau."
      - show: |
          <table class="t"><tr><th>luồng 2</th><th>tình huống xấu</th><th>bế tắc?</th></tr>
          <tr><td>C, A, B</td><td>luồng 2 giữ C chờ A; luồng 1 giữ A, B chờ C</td><td><b>có</b></td></tr>
          <tr><td>A, C, B</td><td>cả hai lấy A trước, ai lấy được A thì đi hết</td><td><b>không</b></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Câu hai, ta so sánh hai thứ tự lấy khoá của luồng 2. Với C, A, B thì có thể bế tắc, luồng 2 giữ C chờ A, trong khi luồng 1 giữ A và B chờ C. Với A, C, B thì không, vì cả hai lấy A trước, ai lấy được A thì đi hết."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">dữ liệu chung + có ghi = tranh chấp</span><span class="a">→</span>
          <span class="n">khoá trọn đọc–sửa–ghi</span><span class="a">→</span>
          <span class="n">một thứ tự lấy khoá chung</span><span class="a">→</span>
          <span class="n">nhả khoá cả khi lỗi</span></div>
        say: "Tổng kết lại, dữ liệu chung có ghi là tranh chấp. Khoá trọn cả đọc, sửa, ghi, lấy khoá theo một thứ tự chung, và nhả khoá cả khi có lỗi."
      - show: |
          <div class="box key"><b>Tư duy:</b> với mã đồng thời, kiểm thử chỉ thấy vài cách xen kẽ trong hàng trăm, hàng nghìn. Hãy lập luận về <b>mọi</b> cách xen kẽ, hoặc thiết kế để không cần lập luận (bất biến, hàng đợi).</div>
        say: "Điều cần mang theo, với mã đồng thời, kiểm thử chỉ thấy vài cách xen kẽ trong hàng trăm hàng nghìn cách. Hãy lập luận về mọi cách xen kẽ, hoặc thiết kế để không cần lập luận, bằng dữ liệu bất biến hay hàng đợi."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 10): <b>đo hiệu năng</b> sao cho kết luận đáng tin — có thống kê.</p>
        forward_ref: true
        say: "Ở bài sau, bài 10, ta học đo hiệu năng sao cho kết luận đáng tin, có dùng thống kê. Hẹn gặp bạn ở bài tiếp theo."
