scenes:
- id: hook
  kind: hook
  title: Đăng nhập không cần mật khẩu
  checks:
  - alg.sql_concat_vs_param("' OR '1'='1")[1:] == (2, 0)
  steps:
  - show: '<p>Ô tên đăng nhập, gõ: <code>'' OR ''1''=''1</code>. Chương trình ghép thẳng vào câu truy vấn, điều kiện thành
      “tên rỗng <b>hoặc</b> 1 = 1” — luôn đúng → trả về <b>mọi</b> người dùng.</p>

      <div class="box key">Hôm nay: hai lỗi bảo mật kinh điển đến từ cùng một gốc — <b>dữ liệu bị hiểu nhầm thành mã</b>:
      chèn mã và tràn bộ đệm.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, ở ô tên đăng nhập, kẻ tấn công gõ chuỗi như trên màn hình. Chương trình ghép thẳng chuỗi đó vào câu truy
      vấn, và điều kiện thành tên rỗng hoặc 1 bằng 1, luôn đúng, nên trả về mọi người dùng. Hôm nay ta học hai lỗi bảo mật
      kinh điển đến từ cùng một gốc, dữ liệu bị hiểu nhầm thành mã, đó là chèn mã và tràn bộ đệm. Chỉ một dòng nối chuỗi truy
      vấn cơ sở dữ liệu hay một vùng đệm không kiểm độ dài đủ mở toang toàn bộ dữ liệu mật của doanh nghiệp ra bên ngoài.
      Bảo mật phần mềm bắt đầu ngay từ nguyên tắc vàng không bao giờ tin đầu vào ngoài ranh giới và không ghép chuỗi dữ liệu
      với câu lệnh.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: chuỗi, dấu nháy, và mỗi ký tự là một byte'
  checks:
  - '''xin'' + ''chao'' == ''xinchao'' and ord(''A'') == 65 and ord(''B'') == 66 and len(''AAAAAAAAB''.encode() + bytes([0]))
    == 10'
  - 2 ** 8 - 1 == 255 and alg.sql_concat_vs_param('alice')[1:] == (1, 1)
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>ví dụ</th></tr>

      <tr><td>chuỗi nằm giữa hai dấu nháy</td><td><code>''alice''</code> — dấu nháy cho biết chuỗi bắt đầu và kết thúc ở đâu</td></tr>

      <tr><td>ghép chuỗi bằng dấu cộng</td><td><code>''xin'' + ''chao''</code> → <code>''xinchao''</code></td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    say: Trước hết, ta ôn lại hai ý quan trọng về chuỗi ký tự. Trong mã, chuỗi nằm giữa hai dấu nháy, và dấu nháy cho biết
      chuỗi bắt đầu và kết thúc ở đâu. Dấu cộng ghép hai chuỗi, xin cộng chào thành xin chào viết liền. Lỗ hổng tràn bộ đệm
      xuất hiện khi dữ liệu ghi vào vượt sức chứa cấp phát, tràn sang đè lên các biến bên cạnh hoặc địa chỉ điều khiển. Ngoài
      việc làm sập ngay tiến trình, kẻ tấn công tinh vi có thể lái con trỏ trả về tới đoạn mã độc cấy sẵn.
  - show: '<p><b>Byte</b>: một ô nhớ nhỏ chứa một số từ 0 tới 255. Máy lưu chữ bằng cách gán cho mỗi chữ một mã số: mỗi chữ
      cái tiếng Anh nằm trong <b>một byte</b>, A có mã 65, B có mã 66. Trong ngôn ngữ C, chuỗi kết thúc bằng một byte 0 để
      máy biết chỗ dừng, nên chuỗi 9 chữ cần <b>10 byte</b>.</p>

      '
    say: Tiếp theo, byte là một ô nhớ nhỏ chứa một số từ 0 tới 255. Máy lưu chữ bằng cách gán cho mỗi chữ một mã số, mỗi chữ
      cái tiếng Anh nằm trong một byte, chữ A có mã 65, chữ B có mã 66. Trong ngôn ngữ C, chuỗi kết thúc bằng một byte 0 để
      máy biết chỗ dừng, nên chuỗi 9 chữ cần 10 byte.
  - show: ''
    say: Lỗ hổng chèn mã xảy ra khi dữ liệu người dùng gõ vào bị máy tính hiểu nhầm và thực thi như mã lệnh trong truy vấn
      cơ sở dữ liệu hay trình duyệt. Khi gộp trực tiếp chuỗi nhập thô vào mẫu truy vấn, một dấu nháy đơn khéo léo lập tức
      bẻ cong cấu trúc điều kiện sang lấy toàn bộ bảng.
  - clear: true
    show: '<p><b>Cơ sở dữ liệu</b> lưu dữ liệu thành các bảng; chương trình hỏi nó bằng một <b>câu truy vấn</b>:</p>

      <div class="code"><div>SELECT name FROM users WHERE name = ''alice''</div></div>

      <p>nghĩa là: lấy cột <code>name</code> (tên) trong bảng <code>users</code> (người dùng), ở những dòng mà điều kiện <code>name
      = ''alice''</code> đúng. Trong điều kiện, <code>OR</code> nghĩa là “hoặc”: chỉ cần một vế đúng là cả điều kiện đúng.</p>

      '
    focus:
    - 1
    - 3
    - 3
    - 3
    - 3
    say: Cuối cùng, cơ sở dữ liệu lưu dữ liệu thành các bảng, và chương trình hỏi nó bằng một câu truy vấn. Câu trên màn hình
      nghĩa là lấy cột tên trong bảng người dùng, ở những dòng mà tên bằng giá trị trong dấu nháy. Trong điều kiện, chữ hoặc
      nghĩa là chỉ cần một trong hai vế đúng thì cả điều kiện đúng. Biện pháp phòng ngự chuẩn xác là dùng truy vấn tham số
      hoá tách biệt hoàn toàn khuôn mẫu câu lệnh cố định với phần giá trị người dùng gửi vào. Dữ liệu lúc này chỉ mãi mãi
      được đối xử như hằng giá trị thụ động không bao giờ có quyền biến thành từ khoá cú pháp.
- id: sym
  kind: symbol
  title: 'Giải mã: ghép chuỗi và tham số hoá'
  checks:
  - alg.sql_concat_vs_param("' OR '1'='1")[0] == "SELECT name FROM users WHERE name = '' OR '1'='1'"
  steps:
  - show: '<div class="code"><div><span class="cm"># ghép chuỗi: đầu vào trở thành một phần của câu lệnh</span></div><div>q
      = "SELECT name FROM users WHERE name = ''" + ten + "''"</div><div><span class="cm"># → SELECT name FROM users WHERE
      name = '''' OR ''1''=''1''</span></div><div></div><div><span class="cm"># tham số hoá: câu lệnh cố định, đầu vào chỉ
      là dữ liệu</span></div><div>db.execute("SELECT name FROM users WHERE name = ?", (ten,))</div></div>

      <div class="box key">Tham số hoá gửi câu lệnh và dữ liệu <b>riêng</b>. Cơ sở dữ liệu chỉ <b>phân tích cú pháp</b> câu
      lệnh cố định — đọc câu, tách thành từng từ, dựng lại cấu trúc để biết đâu là lệnh, đâu là giá trị; phần dữ liệu không
      bao giờ được phân tích như mã.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Cách thứ nhất là ghép chuỗi, đầu vào trở thành một phần của câu lệnh. Dấu nháy trong đầu vào đóng chuỗi sớm, và phần
      còn lại được hiểu là điều kiện mới. Cách thứ hai là tham số hoá, câu lệnh cố định với một chỗ trống, đầu vào chỉ là
      dữ liệu điền vào chỗ trống. Hai thứ được gửi riêng, nên cơ sở dữ liệu chỉ phân tích cú pháp câu lệnh cố định. Phân tích
      cú pháp là đọc câu, tách thành từng từ, rồi dựng lại cấu trúc để biết đâu là lệnh, đâu là giá trị. Phần dữ liệu không
      bao giờ được phân tích như mã. Còn ở tầng bộ nhớ, luôn gắn giới hạn kích thước rõ ràng khi sao chép chuỗi và ưu tiên
      kiểu cấu trúc tự kiểm soát độ dài.
