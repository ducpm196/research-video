id: L12
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 12 — Bảo mật phần mềm: tràn bộ đệm và chèn mã"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L12; audit/swf/verify_swf.py L12; A. One, Smashing the Stack for Fun and Profit, Phrack 49 (1996); OWASP Top 10 (2021), A03 Injection; MITRE CWE-89 (SQL injection), CWE-121 (tràn bộ đệm trên ngăn xếp); CSA bài 1"
assumes: [arith]
# Quy ước: tràn bộ đệm minh hoạ bằng MÔ HÌNH bộ nhớ (alg.overflow_sim: mảng 8 byte nằm ngay trước một byte cờ) — bố cục thật do trình biên
#   dịch quyết định, có thể khác; ý chính là chép không kiểm độ dài ghi đè vùng kề bên. Chèn mã chạy thật trên sqlite3 (alg.sql_concat_vs_param).
#   Từ khoá SQL chỉ ở trên màn hình; lời đọc mô tả “câu truy vấn”, “điều kiện”.
objectives:
  - "Hiểu tràn bộ đệm ghi đè dữ liệu kề bên"
  - "Hiểu chèn mã khi ghép chuỗi đầu vào vào câu lệnh"
  - "Dùng truy vấn tham số hoá và hàm chép có kiểm độ dài"
asr_reviewed:
  - {sentence: "Trong kiểu tấn công kinh điển được mô tả từ năm 1996, phần tràn ghi đè địa chỉ mà hàm sẽ quay về khi xong, nên máy nhảy tới các byte do kẻ tấn công đưa vào.", reason: "ASR chép “Trong kiểu tấn công kinh điển được mô tả từ năm 1996, phần trang ghi đại địa chỉ Mà Hàm sẽ quay về khi xong, nên máy nhảy tới các bài do kẻ tấn công đưa vào.” (0.93): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: tràn/trang, đè/đại — NOT_VERIFIED bằng tai người"}
  - {sentence: "Trong ngôn ngữ C, chuỗi kết thúc bằng một byte 0 để máy biết chỗ dừng, nên chuỗi 9 chữ cần 10 byte.", reason: "ASR chép “Trong ngôn ngữ C, chủ kết thúc bằng một bay không để máy biết chỗ dừng, nền chủ 9 chữ cần 10 bay.” (0.783): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: chuỗi/chủ, nên chuỗi/nền chủ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Máy lưu chữ bằng cách gán cho mỗi chữ một mã số, mỗi chữ cái tiếng Anh nằm trong một byte, chữ A có mã 65, chữ B có mã 66.", reason: "ASR chép “Máy lưu chữ bằng cách gán cho mỗi chữ một mạ số, mỗi chữ cái tiếng Anh nằm trong một bay, chữ A có mạ 65, chữ B có mạ 66.” (0.886): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: mã/mạ, mã/mạ, mã/mạ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tiếp theo, byte là một ô nhớ nhỏ chứa một số từ 0 tới 255.", reason: "ASR chép “Tiếp theo, bay là một ô nhớ nhỏ chứa một số từ 0 tới 255.” (0.947): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chữ thứ 9 là B, rơi đúng vào ô ngay sau mảng, tức byte cờ, nên byte cờ bằng 66.", reason: "ASR chép “Chữ thứ 9 là b, rơi đúng vào ôn ngay sau mảnh, tích bai cờ, nên bai cờ bằng 66.” (0.773): “ô” (ô nhớ) ASR chép “ôn”; byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: mảng tức (trong “mảng tức byte” → “mảnh tích bai”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hình vẽ mô hình bộ nhớ, mảng 8 byte màu xanh nằm sát ngay trước byte cờ quản trị.", reason: "ASR chép “Hình về mô hình bộ nhớ, mảng 8 bai màu xanh nằm xác ngay trước bai cờ quản trị.” (0.789): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: vẽ/về, sát/xác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước ba, cách sửa là chép có kiểm độ dài, chỉ giữ 7 chữ cộng byte kết thúc cho vừa 8 byte.", reason: "ASR chép “Bước 3. Các sữa là chép có kiểm độ dài, chỉ giữ 7 chữ cộng bay kết thúc cho vừa 8 bay.” (0.818): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: cách sửa/các sữa — NOT_VERIFIED bằng tai người"}
  - {sentence: "Khi đó không byte nào tràn, và byte cờ vẫn bằng 0.", reason: "ASR chép “Khi đó không bay nào tràn và bay cờ vẫn bằng không.” (0.833): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Cần chép 9 chữ cộng một byte kết thúc, tức 10 byte, vào chỗ chỉ có 8, nên tràn 2 byte.", reason: "ASR chép “Cần chép 9 chữ cộng 1 bay kết thúc, tức 10 bay, vào chỗ chỉ có 8, nên tràn 2 bay.” (0.857): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đếm tay, 9 cộng 1 trừ 8 bằng 2 byte tràn, khớp mô hình.", reason: "ASR chép “Đếm tay, 9 cộng 1 trừ 8 bằng hai bay tràng, khớp mô hình.” (0.857): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: tràn (trong “byte tràn” → “bay tràng”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chạy lại mô hình với bản có kiểm độ dài, không byte nào tràn và cờ vẫn bằng 0.", reason: "ASR chép “Chạy lại mô hình với bảng có kiểm độ dài, không bay nào tràn và cờ vẫn bằng không.” (0.895): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: bản/bảng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chép 10 byte vào chỗ chỉ có 8 mà không kiểm độ dài, hai byte cuối tràn sang ô hàng xóm, tô đỏ.", reason: "ASR chép “Chép 10 bay vào chỗ chỉ có 8 mà không kiểm độ dài, 2 bay cuối tràn sang ô hàng xóm, tô đỏ.” (0.913): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bước hai, với tràn bộ đệm, xét mô hình một mảng 8 ký tự nằm ngay trước một byte cờ quản trị bằng 0.", reason: "ASR chép “Bước 2, với trang bộ đệm, xét mô hình một mảng 8 ký tự nằm ngay trước một bay cờ quản trị bằng 0.” (0.917): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); lệch âm/thanh thuần Việt: tràn/trang — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, cần 12 cộng 1 bằng 13 byte, trong khi chỗ chỉ có 8, nên tràn 13 trừ 8 bằng 5 byte.", reason: "ASR chép “Câu 2, cần 12 cộng 1 bằng 13 bai, trong khi chỗ chỉ có 8, nên tràn 13 trừ 8 bằng 5 bai.” (0.923): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Byte cờ bị ghi thành 66, mã của chữ B, dù không ai cấp quyền.", reason: "ASR chép “Bay cờ bị ghi thành 66, mã của chữ B, dù không ai cấp quyền.” (0.941): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Byte cờ thành mã của chữ B, bằng 66, khác 0, và người dùng thành quản trị.", reason: "ASR chép “bay cờ thành mã của chữ B bằng 66, khác không và người dùng thành quản trị.” (0.947): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hãy dùng hàm chép có giới hạn, luôn chừa chỗ cho ký tự kết thúc, khi đó chuỗi 9 ký tự bị cắt còn 7, và byte cờ vẫn là 0.", reason: "ASR chép “khi đó chủ chính ký tự bị cắt còn bảy và bay cờ vẫn là không”: chuỗi chín → “chủ chính” như câu khung 12, “byte” viết “bay” như probe CSA p1 (8/8); số 7 và 0 chép đúng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu hai, chép chuỗi 12 ký tự cộng ký tự kết thúc vào mảng 8 ký tự mà không kiểm độ dài, thì tràn bao nhiêu byte?", reason: "ASR chép nguyên văn trừ “byte” → “bay”, đúng như probe CSA p1 (8/8); độ khớp 0,964 — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đăng nhập không cần mật khẩu"
    checks:
      - "alg.sql_concat_vs_param(\"' OR '1'='1\")[1:] == (2, 0)"
    steps:
      - show: |
          <p>Ô tên đăng nhập, gõ: <code>' OR '1'='1</code>. Chương trình ghép thẳng vào câu truy vấn, điều kiện thành “tên rỗng <b>hoặc</b> 1 = 1” — luôn đúng → trả về <b>mọi</b> người dùng.</p>
          <div class="box key">Hôm nay: hai lỗi bảo mật kinh điển đến từ cùng một gốc — <b>dữ liệu bị hiểu nhầm thành mã</b>: chèn mã và tràn bộ đệm.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, ở ô tên đăng nhập, kẻ tấn công gõ chuỗi như trên màn hình. Chương trình ghép thẳng chuỗi đó vào câu truy vấn, và điều kiện thành tên rỗng hoặc 1 bằng 1, luôn đúng, nên trả về mọi người dùng. Hôm nay ta học hai lỗi bảo mật kinh điển đến từ cùng một gốc, dữ liệu bị hiểu nhầm thành mã, đó là chèn mã và tràn bộ đệm."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chuỗi, dấu nháy, và mỗi ký tự là một byte"
    checks:
      - "'xin' + 'chao' == 'xinchao' and ord('A') == 65 and ord('B') == 66 and len('AAAAAAAAB'.encode() + bytes([0])) == 10"
      - "2 ** 8 - 1 == 255 and alg.sql_concat_vs_param('alice')[1:] == (1, 1)"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>ví dụ</th></tr>
          <tr><td>chuỗi nằm giữa hai dấu nháy</td><td><code>'alice'</code> — dấu nháy cho biết chuỗi bắt đầu và kết thúc ở đâu</td></tr>
          <tr><td>ghép chuỗi bằng dấu cộng</td><td><code>'xin' + 'chao'</code> → <code>'xinchao'</code></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ta ôn lại hai ý quan trọng về chuỗi ký tự. Trong mã, chuỗi nằm giữa hai dấu nháy, và dấu nháy cho biết chuỗi bắt đầu và kết thúc ở đâu. Dấu cộng ghép hai chuỗi, xin cộng chào thành xin chào viết liền."
      - show: |
          <p><b>Byte</b>: một ô nhớ nhỏ chứa một số từ 0 tới 255. Máy lưu chữ bằng cách gán cho mỗi chữ một mã số: mỗi chữ cái tiếng Anh nằm trong <b>một byte</b>, A có mã 65, B có mã 66. Trong ngôn ngữ C, chuỗi kết thúc bằng một byte 0 để máy biết chỗ dừng, nên chuỗi 9 chữ cần <b>10 byte</b>.</p>
        say: "Tiếp theo, byte là một ô nhớ nhỏ chứa một số từ 0 tới 255. Máy lưu chữ bằng cách gán cho mỗi chữ một mã số, mỗi chữ cái tiếng Anh nằm trong một byte, chữ A có mã 65, chữ B có mã 66. Trong ngôn ngữ C, chuỗi kết thúc bằng một byte 0 để máy biết chỗ dừng, nên chuỗi 9 chữ cần 10 byte."
      - clear: true
        show: |
          <p><b>Cơ sở dữ liệu</b> lưu dữ liệu thành các bảng; chương trình hỏi nó bằng một <b>câu truy vấn</b>:</p>
          <div class="code"><div>SELECT name FROM users WHERE name = 'alice'</div></div>
          <p>nghĩa là: lấy cột <code>name</code> (tên) trong bảng <code>users</code> (người dùng), ở những dòng mà điều kiện <code>name = 'alice'</code> đúng. Trong điều kiện, <code>OR</code> nghĩa là “hoặc”: chỉ cần một vế đúng là cả điều kiện đúng.</p>
        focus: [1, 3, 3]
        say: "Cuối cùng, cơ sở dữ liệu lưu dữ liệu thành các bảng, và chương trình hỏi nó bằng một câu truy vấn. Câu trên màn hình nghĩa là lấy cột tên trong bảng người dùng, ở những dòng mà tên bằng giá trị trong dấu nháy. Trong điều kiện, chữ hoặc nghĩa là chỉ cần một trong hai vế đúng thì cả điều kiện đúng."

  - id: sym
    kind: symbol
    title: "Giải mã: ghép chuỗi và tham số hoá"
    checks:
      - "alg.sql_concat_vs_param(\"' OR '1'='1\")[0] == \"SELECT name FROM users WHERE name = '' OR '1'='1'\""
    steps:
      - show: |
          <div class="code"><div><span class="cm"># ghép chuỗi: đầu vào trở thành một phần của câu lệnh</span></div><div>q = "SELECT name FROM users WHERE name = '" + ten + "'"</div><div><span class="cm"># → SELECT name FROM users WHERE name = '' OR '1'='1'</span></div><div></div><div><span class="cm"># tham số hoá: câu lệnh cố định, đầu vào chỉ là dữ liệu</span></div><div>db.execute("SELECT name FROM users WHERE name = ?", (ten,))</div></div>
          <div class="box key">Tham số hoá gửi câu lệnh và dữ liệu <b>riêng</b>. Cơ sở dữ liệu chỉ <b>phân tích cú pháp</b> câu lệnh cố định — đọc câu, tách thành từng từ, dựng lại cấu trúc để biết đâu là lệnh, đâu là giá trị; phần dữ liệu không bao giờ được phân tích như mã.</div>
        focus: [1, 1, 1, 2, 2, 2]
        say: "Cách thứ nhất là ghép chuỗi, đầu vào trở thành một phần của câu lệnh. Dấu nháy trong đầu vào đóng chuỗi sớm, và phần còn lại được hiểu là điều kiện mới. Cách thứ hai là tham số hoá, câu lệnh cố định với một chỗ trống, đầu vào chỉ là dữ liệu điền vào chỗ trống. Hai thứ được gửi riêng, nên cơ sở dữ liệu chỉ phân tích cú pháp câu lệnh cố định. Phân tích cú pháp là đọc câu, tách thành từng từ, rồi dựng lại cấu trúc để biết đâu là lệnh, đâu là giá trị. Phần dữ liệu không bao giờ được phân tích như mã."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Dữ liệu tràn sang ô hàng xóm"
    steps:
      - show: |
          <div><svg width="1500" height="320" viewBox="0 0 1500 320"><g fill="#1f2937"><rect x="140" y="110" width="105" height="90" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="192" y="168" text-anchor="middle" font-size="30">A</text><rect x="255" y="110" width="105" height="90" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="307" y="168" text-anchor="middle" font-size="30">A</text><rect x="370" y="110" width="105" height="90" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="422" y="168" text-anchor="middle" font-size="30">A</text><rect x="485" y="110" width="105" height="90" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="537" y="168" text-anchor="middle" font-size="30">A</text><rect x="600" y="110" width="105" height="90" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="652" y="168" text-anchor="middle" font-size="30">A</text><rect x="715" y="110" width="105" height="90" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="767" y="168" text-anchor="middle" font-size="30">A</text><rect x="830" y="110" width="105" height="90" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="882" y="168" text-anchor="middle" font-size="30">A</text><rect x="945" y="110" width="105" height="90" rx="6" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="997" y="168" text-anchor="middle" font-size="30">A</text><rect x="1060" y="110" width="105" height="90" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1112" y="168" text-anchor="middle" font-size="30">B</text><rect x="1175" y="110" width="105" height="90" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1227" y="168" text-anchor="middle" font-size="30">0</text><rect x="1290" y="110" width="105" height="90" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1342" y="168" text-anchor="middle" font-size="30">…</text><line x1="140" y1="85" x2="1055" y2="85" stroke="#2a78d6" stroke-width="3"/><text x="597" y="70" text-anchor="middle" font-size="23" fill="#2a78d6">mảng 8 byte</text><text x="1062" y="250" text-anchor="middle" font-size="23" fill="#b91c1c">byte cờ quản trị</text><text x="1062" y="282" text-anchor="middle" font-size="21" fill="#b91c1c">bị ghi thành 66</text><text x="400" y="260" font-size="22">chép 9 chữ + byte kết thúc = 10 byte vào chỗ chỉ có 8</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ mô hình bộ nhớ, mảng 8 byte màu xanh nằm sát ngay trước byte cờ quản trị. Chép 10 byte vào chỗ chỉ có 8 mà không kiểm độ dài, hai byte cuối tràn sang ô hàng xóm, tô đỏ. Byte cờ bị ghi thành 66, mã của chữ B, dù không ai cấp quyền."

  - id: example
    kind: example
    title: "Chạy thật trên bảng hai người dùng"
    checks:
      - "alg.sql_concat_vs_param(\"' OR '1'='1\")[1:] == (2, 0) and alg.sql_concat_vs_param('alice')[1:] == (1, 1)"
      - "alg.overflow_sim('AAAAAAAAB') == (66, 2) and alg.overflow_sim('AAAAAAAAB', checked=True) == (0, 0)"
    steps:
      - show: |
          <table class="t"><tr><th>đầu vào</th><th>ghép chuỗi</th><th>tham số hoá</th></tr>
          <tr><td><code>alice</code></td><td>1 dòng</td><td>1 dòng</td></tr>
          <tr><td><code>' OR '1'='1</code></td><td><b class="red">2 dòng — mọi người dùng</b></td><td>0 dòng (không ai tên như vậy)</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước một, chạy thật trên một bảng có hai người dùng. Với một tên hợp lệ, cả hai cách đều trả về 1 dòng. Với chuỗi tấn công, cách ghép chuỗi trả về cả 2 dòng, tức mọi người dùng, còn cách tham số hoá trả về 0 dòng vì không ai có tên như vậy."
      - clear: true
        show: |
          <p><b>Bước 2 — tràn bộ đệm</b> (mô hình): mảng 8 ký tự nằm ngay trước byte cờ <code>la_quan_tri = 0</code>. Chép <code>AAAAAAAAB</code> không kiểm độ dài:</p>
          <table class="t"><tr><th>cần chép</th><th>chỗ có</th><th>tràn</th><th>byte cờ</th></tr>
          <tr><td>9 chữ + 1 byte kết thúc = 10</td><td>8</td><td>2 byte</td><td>mã chữ B $= \hl{66} \ne 0$: thành quản trị</td></tr></table>
          <p class="note">Kiểu tấn công kinh điển (mô tả năm 1996): phần tràn ghi đè địa chỉ mà hàm sẽ quay về khi xong, để máy nhảy tới byte do kẻ tấn công đưa vào. Máy và trình biên dịch ngày nay thêm lớp chặn: cấm chạy mã trong vùng dữ liệu, giá trị canh đặt trước địa chỉ quay về, xáo trộn địa chỉ bộ nhớ. Các lớp đó chỉ làm khó thêm; cách sửa gốc vẫn là chép có kiểm độ dài.</p>
        focus: [1, 2, "2.2", 3, 3, 3]
        say: "Bước hai, với tràn bộ đệm, xét mô hình một mảng 8 ký tự nằm ngay trước một byte cờ quản trị bằng 0. Cần chép 9 chữ cộng một byte kết thúc, tức 10 byte, vào chỗ chỉ có 8, nên tràn 2 byte. Byte cờ thành mã của chữ B, bằng 66, khác 0, và người dùng thành quản trị. Trong kiểu tấn công kinh điển được mô tả từ năm 1996, phần tràn ghi đè địa chỉ mà hàm sẽ quay về khi xong, nên máy nhảy tới các byte do kẻ tấn công đưa vào. Máy và trình biên dịch ngày nay thêm lớp chặn, như cấm chạy mã trong vùng dữ liệu, đặt giá trị canh trước địa chỉ quay về, và xáo trộn địa chỉ bộ nhớ. Các lớp đó chỉ làm khó kẻ tấn công thêm, còn cách sửa gốc vẫn là chép có kiểm độ dài."
      - show: |
          <p><b>Bước 3 — sửa</b>: chép có kiểm độ dài, cắt còn 7 chữ + byte kết thúc → tràn $\hl{0}$ byte, byte cờ vẫn 0.</p>
        say: "Bước ba, cách sửa là chép có kiểm độ dài, chỉ giữ 7 chữ cộng byte kết thúc cho vừa 8 byte. Khi đó không byte nào tràn, và byte cờ vẫn bằng 0."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "len('AAAAAAAAB') + 1 - 8 == alg.overflow_sim('AAAAAAAAB')[1] == 2 and ord('B') == alg.overflow_sim('AAAAAAAAB')[0] == 66"
      - "alg.overflow_sim('AAAAAAAAB', checked=True) == (0, 0)"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>2 byte tràn</td><td>đếm tay: 9 + 1 − 8</td><td>2 ✓</td></tr>
          <tr><td>byte cờ = 66</td><td>chữ thứ 9 là B, rơi đúng vào ô thứ 9 (ô ngay sau mảng)</td><td>mã B = 66 ✓</td></tr>
          <tr><td>bản có kiểm</td><td>máy chạy lại mô hình</td><td>0 byte tràn, cờ = 0 ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác. Đếm tay, 9 cộng 1 trừ 8 bằng 2 byte tràn, khớp mô hình. Chữ thứ 9 là B, rơi đúng vào ô ngay sau mảng, tức byte cờ, nên byte cờ bằng 66. Chạy lại mô hình với bản có kiểm độ dài, không byte nào tràn và cờ vẫn bằng 0."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.sql_concat_error(\"O'Brien\") == ('OperationalError', 1)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tự lọc ký tự nguy hiểm thay cho tham số hoá <b class="red">(sai)</b>
          <br><span class="note">Rất dễ sót một cách viết khác lọt qua (mã hoá ký tự, ngữ cảnh khác). Ghép chuỗi còn làm hỏng cả đầu vào hợp lệ: tên <code>O'Brien</code> gây lỗi cú pháp. Tham số hoá xử lý đúng cả hai.</span></div>
        say: "Lỗi thứ nhất, tự lọc ký tự nguy hiểm thay cho tham số hoá. Rất dễ sót một cách viết khác lọt qua, như mã hoá ký tự hay một ngữ cảnh khác. Ghép chuỗi còn làm hỏng cả đầu vào hợp lệ, một cái tên có dấu nháy gây lỗi cú pháp, trong khi tham số hoá xử lý đúng cả hai."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chép chuỗi không kiểm độ dài (C) <b class="red">(nguy hiểm)</b>
          <br><span class="note">Dùng hàm chép có giới hạn, luôn chừa chỗ cho ký tự kết thúc. Với giới hạn, <code>AAAAAAAAB</code> bị cắt còn 7 ký tự, byte cờ vẫn là 0.</span></div>
        say: "Lỗi thứ hai, trong ngôn ngữ C, chép chuỗi mà không kiểm độ dài. Hãy dùng hàm chép có giới hạn, luôn chừa chỗ cho ký tự kết thúc, khi đó chuỗi 9 ký tự bị cắt còn 7, và byte cờ vẫn là 0."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Tin dữ liệu từ phía người dùng vì “đã kiểm ở giao diện” <b class="red">(sai)</b>
          <br><span class="note">Kẻ tấn công gửi thẳng yêu cầu, bỏ qua giao diện. Kiểm và tham số hoá ở <b>phía máy chủ</b>, nơi cuối cùng dữ liệu được dùng.</span></div>
        say: "Lỗi thứ ba, tin dữ liệu từ phía người dùng vì đã kiểm ở giao diện. Kẻ tấn công gửi thẳng yêu cầu và bỏ qua giao diện, nên phải kiểm và tham số hoá ở phía máy chủ, nơi dữ liệu cuối cùng được dùng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.sql_concat_vs_param(\"x' OR 1=1 --\")[1:] == (2, 0)"
      - "alg.overflow_sim('AAAAAAAAAAAA')[1] == 12 + 1 - 8 == 5"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Đầu vào <code>x' OR 1=1 --</code> (<code>--</code> mở đầu chú thích, bỏ phần còn lại của dòng). Ghép chuỗi trả mấy dòng? Tham số hoá trả mấy dòng?</td></tr>
          <tr><td>2</td><td>Chép chuỗi 12 ký tự (cộng ký tự kết thúc) vào mảng 8 ký tự, không kiểm độ dài: tràn bao nhiêu byte?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, với đầu vào như trên màn hình, trong đó hai gạch ngang mở đầu một chú thích và bỏ phần còn lại của dòng. Ghép chuỗi trả về mấy dòng, tham số hoá trả về mấy dòng? Câu hai, chép chuỗi 12 ký tự cộng ký tự kết thúc vào mảng 8 ký tự mà không kiểm độ dài, thì tràn bao nhiêu byte? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Điều kiện thành “tên là x <b>hoặc</b> 1 = 1”, dấu nháy thừa bị chú thích nuốt → ghép chuỗi: $\hl{2}$ dòng; tham số hoá: $\hl{0}$ dòng (cả chuỗi chỉ là một cái tên lạ).</p>
        say: "Đáp án câu một, điều kiện thành tên là x hoặc 1 bằng 1, dấu nháy thừa bị chú thích nuốt mất, nên ghép chuỗi trả về 2 dòng. Tham số hoá trả về 0 dòng, vì cả chuỗi chỉ được coi là một cái tên lạ."
      - show: |
          <p>② Cần $12 + 1 = 13$ byte, chỗ có 8 → $13 - 8 = \hl{5}$ byte tràn.</p>
        say: "Câu hai, cần 12 cộng 1 bằng 13 byte, trong khi chỗ chỉ có 8, nên tràn 13 trừ 8 bằng 5 byte."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">dữ liệu bị hiểu thành mã</span><span class="a">→</span>
          <span class="n">chèn mã: tham số hoá</span><span class="a">→</span>
          <span class="n">tràn bộ đệm: chép có giới hạn</span><span class="a">→</span>
          <span class="n">kiểm ở phía máy chủ</span></div>
        say: "Tổng kết lại, cả hai lỗi đều do dữ liệu bị hiểu thành mã. Chống chèn mã bằng tham số hoá, chống tràn bộ đệm bằng hàm chép có giới hạn, và luôn kiểm ở phía máy chủ."
      - show: |
          <div class="box key"><b>Tư duy:</b> giữ ranh giới rõ giữa <b>mã</b> và <b>dữ liệu</b>. Mọi chỗ đầu vào từ bên ngoài đi vào một bộ thông dịch (chương trình đọc và chạy câu lệnh, như cơ sở dữ liệu đọc câu truy vấn) là một chỗ có thể bị tấn công.</div>
        say: "Điều cần mang theo, hãy giữ ranh giới rõ giữa mã và dữ liệu. Mọi chỗ đầu vào từ bên ngoài đi vào một bộ thông dịch, tức chương trình đọc và chạy câu lệnh như cơ sở dữ liệu, là một chỗ có thể bị tấn công."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): <b>tình huống chuyên gia theo dòng thời gian</b> — một kho mã chung cho hàng chục nghìn kỹ sư, từ hơn 5000 lập trình viên (2010) tới khoảng 50&nbsp;000 kỹ sư (2020).</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta đi lại mười năm của một kho mã chung cho hàng chục nghìn kỹ sư, từ hơn 5000 lập trình viên năm 2010 tới khoảng 50 nghìn năm 2020. Ta sẽ thấy kiểm thử trước khi gộp, thay đổi lớn tự động và chủ sở hữu mã ra đời từ điểm nghẽn nào. Hẹn gặp bạn ở bài tiếp theo."
