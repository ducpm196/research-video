      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ mô hình bộ nhớ, mảng 8 byte màu xanh nằm sát ngay trước byte cờ quản trị. Chép 10 byte vào chỗ chỉ có 8 mà
      không kiểm độ dài, hai byte cuối tràn sang ô hàng xóm, tô đỏ. Byte cờ bị ghi thành 66, mã của chữ B, dù không ai cấp
      quyền. Ghép chuỗi câu lệnh giống đọc trực tiếp lá đơn khách hàng ghi tay mà không phân biệt tên khách với mệnh lệnh
      hành chính. Truy vấn tham số hoá giống điền từng ô biểu mẫu in sẵn có khung kính đóng kín không thể viết lem ra ngoài
      khung mệnh lệnh.
- id: example
  kind: example
  title: Chạy thật trên bảng hai người dùng
  checks:
  - alg.sql_concat_vs_param("' OR '1'='1")[1:] == (2, 0) and alg.sql_concat_vs_param('alice')[1:] == (1, 1)
  - alg.overflow_sim('AAAAAAAAB') == (66, 2) and alg.overflow_sim('AAAAAAAAB', checked=True) == (0, 0)
  steps:
  - show: '<table class="t"><tr><th>đầu vào</th><th>ghép chuỗi</th><th>tham số hoá</th></tr>

      <tr><td><code>alice</code></td><td>1 dòng</td><td>1 dòng</td></tr>

      <tr><td><code>'' OR ''1''=''1</code></td><td><b class="red">2 dòng — mọi người dùng</b></td><td>0 dòng (không ai tên
      như vậy)</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Bước một, chạy thật trên một bảng có hai người dùng. Với một tên hợp lệ, cả hai cách đều trả về 1 dòng. Với chuỗi
      tấn công, cách ghép chuỗi trả về cả 2 dòng, tức mọi người dùng, còn cách tham số hoá trả về 0 dòng vì không ai có tên
      như vậy.
  - clear: true
    show: '<p><b>Bước 2 — tràn bộ đệm</b> (mô hình): mảng 8 ký tự nằm ngay trước byte cờ <code>la_quan_tri = 0</code>. Chép
      <code>AAAAAAAAB</code> không kiểm độ dài:</p>

      <table class="t"><tr><th>cần chép</th><th>chỗ có</th><th>tràn</th><th>byte cờ</th></tr>

      <tr><td>9 chữ + 1 byte kết thúc = 10</td><td>8</td><td>2 byte</td><td>mã chữ B $= \hl{66} \ne 0$: thành quản trị</td></tr></table>

      <p class="note">Kiểu tấn công kinh điển (mô tả năm 1996): phần tràn ghi đè địa chỉ mà hàm sẽ quay về khi xong, để máy
      nhảy tới byte do kẻ tấn công đưa vào. Máy và trình biên dịch ngày nay thêm lớp chặn: cấm chạy mã trong vùng dữ liệu,
      giá trị canh đặt trước địa chỉ quay về, xáo trộn địa chỉ bộ nhớ. Các lớp đó chỉ làm khó thêm; cách sửa gốc vẫn là chép
      có kiểm độ dài.</p>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - 3
    - 3
    - 3
    say: Bước hai, với tràn bộ đệm, xét mô hình một mảng 8 ký tự nằm ngay trước một byte cờ quản trị bằng 0. Cần chép 9 chữ
      cộng một byte kết thúc, tức 10 byte, vào chỗ chỉ có 8, nên tràn 2 byte. Byte cờ thành mã của chữ B, bằng 66, khác 0,
      và người dùng thành quản trị. Trong kiểu tấn công kinh điển được mô tả từ năm 1996, phần tràn ghi đè địa chỉ mà hàm
      sẽ quay về khi xong, nên máy nhảy tới các byte do kẻ tấn công đưa vào. Máy và trình biên dịch ngày nay thêm lớp chặn,
      như cấm chạy mã trong vùng dữ liệu, đặt giá trị canh trước địa chỉ quay về, và xáo trộn địa chỉ bộ nhớ. Các lớp đó chỉ
      làm khó kẻ tấn công thêm, còn cách sửa gốc vẫn là chép có kiểm độ dài.
  - show: '<p><b>Bước 3 — sửa</b>: chép có kiểm độ dài, cắt còn 7 chữ + byte kết thúc → tràn $\hl{0}$ byte, byte cờ vẫn 0.</p>

      '
    say: Bước ba, cách sửa là chép có kiểm độ dài, chỉ giữ 7 chữ cộng byte kết thúc cho vừa 8 byte. Khi đó không byte nào
      tràn, và byte cờ vẫn bằng 0.
  - show: '<div class=''code''><div><span class=''cm''>// C: sao chép có giới hạn + giữ chỗ byte 0 cuối</span></div><div>strncpy(buf,
      inp, 7); buf[7] = ''\0'';</div><div><span class=''cm''># Python SQLite: tách câu lệnh khỏi giá trị qua ?</span></div><div>safe
      = c.execute("SELECT * FROM u WHERE n=?", (pay,)).fetchall()</div></div>'
    say: Bước bốn, chốt lại hai mẫu mã phòng thủ chuẩn mực ngay trong ví dụ. Với bộ đệm 8 ký tự bên C, chỉ chép tối đa 7 ký
      tự rồi khoá cứng ký tự kết thúc không tại vị trí cuối để không thể tràn sang biến bên cạnh. Còn trên SQLite, truyền
      dữ liệu người dùng vào dấu chấm hỏi riêng biệt giúp câu truy vấn luôn bất biến trước mọi ký tự đặc biệt.
- id: check
  kind: check
  title: Tự kiểm bằng đường khác
  checks:
  - len('AAAAAAAAB') + 1 - 8 == alg.overflow_sim('AAAAAAAAB')[1] == 2 and ord('B') == alg.overflow_sim('AAAAAAAAB')[0] ==
    66
  - alg.overflow_sim('AAAAAAAAB', checked=True) == (0, 0)
  steps:
  - show: '<table class="t"><tr><th>con số</th><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>2 byte tràn</td><td>đếm tay: 9 + 1 − 8</td><td>2 ✓</td></tr>

      <tr><td>byte cờ = 66</td><td>chữ thứ 9 là B, rơi đúng vào ô thứ 9 (ô ngay sau mảng)</td><td>mã B = 66 ✓</td></tr>

      <tr><td>bản có kiểm</td><td>máy chạy lại mô hình</td><td>0 byte tràn, cờ = 0 ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Kiểm bằng đường khác. Đếm tay, 9 cộng 1 trừ 8 bằng 2 byte tràn, khớp mô hình. Chữ thứ 9 là B, rơi đúng vào ô ngay
      sau mảng, tức byte cờ, nên byte cờ bằng 66. Chạy lại mô hình với bản có kiểm độ dài, không byte nào tràn và cờ vẫn bằng
      0.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  checks:
  - alg.sql_concat_error("O'Brien") == ('OperationalError', 1)
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Tự lọc ký tự nguy hiểm thay cho tham số hoá <b class="red">(sai)</b>

      <br><span class="note">Rất dễ sót một cách viết khác lọt qua (mã hoá ký tự, ngữ cảnh khác). Ghép chuỗi còn làm hỏng
      cả đầu vào hợp lệ: tên <code>O''Brien</code> gây lỗi cú pháp. Tham số hoá xử lý đúng cả hai.</span></div>

      '
    say: Lỗi thứ nhất, tự lọc ký tự nguy hiểm thay cho tham số hoá. Rất dễ sót một cách viết khác lọt qua, như mã hoá ký tự
      hay một ngữ cảnh khác. Ghép chuỗi còn làm hỏng cả đầu vào hợp lệ, một cái tên có dấu nháy gây lỗi cú pháp, trong khi
      tham số hoá xử lý đúng cả hai. Dựa vào danh sách đen tự chế cố lọc bỏ vài từ khoá hay ký tự nguy hiểm thay vì dùng cơ
      chế tham số hoá chuẩn.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Chép chuỗi không kiểm độ dài (C) <b class="red">(nguy hiểm)</b>

      <br><span class="note">Dùng hàm chép có giới hạn, luôn chừa chỗ cho ký tự kết thúc. Với giới hạn, <code>AAAAAAAAB</code>
      bị cắt còn 7 ký tự, byte cờ vẫn là 0.</span></div>

      '
    say: Lỗi thứ hai, trong ngôn ngữ C, chép chuỗi mà không kiểm độ dài. Hãy dùng hàm chép có giới hạn, luôn chừa chỗ cho
      ký tự kết thúc, khi đó chuỗi 9 ký tự bị cắt còn 7, và byte cờ vẫn là 0. Chỉ kiểm tra độ dài và định dạng ở giao diện
      trình duyệt phía người dùng rồi bỏ trống xác thực ở cổng tiếp nhận máy chủ.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Tin dữ liệu từ phía người dùng vì “đã kiểm ở giao diện” <b class="red">(sai)</b>

      <br><span class="note">Kẻ tấn công gửi thẳng yêu cầu, bỏ qua giao diện. Kiểm và tham số hoá ở <b>phía máy chủ</b>, nơi
      cuối cùng dữ liệu được dùng.</span></div>

      '
    say: Lỗi thứ ba, tin dữ liệu từ phía người dùng vì đã kiểm ở giao diện. Kẻ tấn công gửi thẳng yêu cầu và bỏ qua giao diện,
      nên phải kiểm và tham số hoá ở phía máy chủ, nơi dữ liệu cuối cùng được dùng.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.sql_concat_vs_param("x' OR 1=1 --")[1:] == (2, 0)
  - alg.overflow_sim('AAAAAAAAAAAA')[1] == 12 + 1 - 8 == 5
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Đầu vào <code>x'' OR 1=1 --</code> (<code>--</code> mở đầu chú thích, bỏ phần còn lại của dòng). Ghép
      chuỗi trả mấy dòng? Tham số hoá trả mấy dòng?</td></tr>

      <tr><td>2</td><td>Chép chuỗi 12 ký tự (cộng ký tự kết thúc) vào mảng 8 ký tự, không kiểm độ dài: tràn bao nhiêu byte?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, với đầu vào như trên màn hình, trong đó hai gạch ngang mở đầu một chú thích
      và bỏ phần còn lại của dòng. Ghép chuỗi trả về mấy dòng, tham số hoá trả về mấy dòng? Câu hai, chép chuỗi 12 ký tự cộng
      ký tự kết thúc vào mảng 8 ký tự mà không kiểm độ dài, thì tràn bao nhiêu byte? Dừng video và làm ra giấy. Nhận diện
      cơ chế gốc của lỗ hổng chèn câu lệnh khi phần dữ liệu vượt biên sang tầng phân tích cú pháp.
    pause: 15
  - show: '<p>① Điều kiện thành “tên là x <b>hoặc</b> 1 = 1”, dấu nháy thừa bị chú thích nuốt → ghép chuỗi: $\hl{2}$ dòng;
      tham số hoá: $\hl{0}$ dòng (cả chuỗi chỉ là một cái tên lạ).</p>

      '
    say: Đáp án câu một, điều kiện thành tên là x hoặc 1 bằng 1, dấu nháy thừa bị chú thích nuốt mất, nên ghép chuỗi trả về
      2 dòng. Tham số hoá trả về 0 dòng, vì cả chuỗi chỉ được coi là một cái tên lạ.
  - show: '<p>② Cần $12 + 1 = 13$ byte, chỗ có 8 → $13 - 8 = \hl{5}$ byte tràn.</p>

      '
    say: Câu hai, cần 12 cộng 1 bằng 13 byte, trong khi chỗ chỉ có 8, nên tràn 13 trừ 8 bằng 5 byte. Chuyển đổi truy vấn cộng
      chuỗi dễ bị tấn công trong đoạn mã mẫu sang truy vấn tham số hoá kèm kiểm tra cận độ dài bộ đệm.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/SWF/L12
  steps:
  - show: <table class='t'><tr><th>Thực hành SWF:L12</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Dùng
      truy vấn tham số hoá và hàm chép có kiểm độ dài</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>payload=' OR '1'='1</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh SWF L12 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr><tr><td><b>Bảng
      &amp; dữ liệu SQLite</b></td><td><code>CREATE TABLE u(n TEXT, r TEXT)</code> chứa 2 dòng <code>('an', 'user')</code>
      và <code>('root', 'admin')</code></td></tr></table>
    say: Mời bạn tự thực hành bài số 12 đối chiếu truy vấn ghép chuỗi dễ bị tấn công với truy vấn tham số hoá dấu chấm hỏi
      trên SQLite. Dựa trên nền tảng đọc luồng chuẩn từ khoá Python cơ bản, bạn dùng sys chấm stdin chấm read để tách các
      cặp khoá giá trị. Đầu vào là một chuỗi payload truyền qua khoá cùng tên. Bạn tạo bảng u trong bộ nhớ chứa hai dòng dữ
      liệu mẫu là an và root rồi đếm số dòng trả về của hai cách viết truy vấn để chứng minh tham số hoá vô hiệu hoá chèn
      mã.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <table class='t'><tr><th>Gợi ý triển khai SWF:L12</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (tạo bảng mẫu)</b></td><td>Khởi tạo kết nối bộ nhớ SQLite và chèn các dòng người dùng chuẩn</td></tr><tr><td><b>Bước
      2 (ghép chuỗi)</b></td><td>Thử truy vấn ghép chuỗi trực tiếp để đo số dòng rò rỉ</td></tr><tr><td><b>Bước 3 (tham số
      hóa)</b></td><td>Thay bằng dấu chấm hỏi giữ chỗ truyền dữ liệu tách biệt cú pháp</td></tr><tr><td><b>Khung đọc stdin
      &amp; SQL</b></td><td><code>pay = sys.stdin.read().strip().split('=', 1)[1]</code>; dùng <code>SELECT * FROM
      u WHERE n=?</code></td></tr></table>
    say: Gợi ý cài đặt bài số 12 gồm ba bước chuẩn xác. Bước một, tách lấy phần payload sau dấu bằng đầu tiên, tạo bảng u
      có hai cột chữ trong bộ nhớ và chèn hai dòng an với root. Bước hai, chạy câu truy vấn ghép chuỗi trực tiếp định dạng
      f-string để thấy chuỗi tấn công rút cả hai dòng dữ liệu. Bước ba, chạy lại bằng truy vấn tham số hoá truyền payload
      qua dấu chấm hỏi rồi đếm số dòng và bật cờ chặn tấn công.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>unsafe_rows_leaked=2</div><div>param_rows_returned=0</div><div>sqli_blocked=1</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">dữ liệu bị hiểu thành mã</span><span class="a">→</span>

      <span class="n">chèn mã: tham số hoá</span><span class="a">→</span>

      <span class="n">tràn bộ đệm: chép có giới hạn</span><span class="a">→</span>

      <span class="n">kiểm ở phía máy chủ</span></div>

      '
    say: Tổng kết lại, cả hai lỗi đều do dữ liệu bị hiểu thành mã. Chống chèn mã bằng tham số hoá, chống tràn bộ đệm bằng
      hàm chép có giới hạn, và luôn kiểm ở phía máy chủ. Mọi dữ liệu vượt qua ranh giới tin cậy đều là mối nghi ngại cho tới
      khi được kiểm tra biên và phân lập bằng tham số hoá.
  - show: '<div class="box key"><b>Tư duy:</b> giữ ranh giới rõ giữa <b>mã</b> và <b>dữ liệu</b>. Mọi chỗ đầu vào từ bên ngoài
      đi vào một bộ thông dịch (chương trình đọc và chạy câu lệnh, như cơ sở dữ liệu đọc câu truy vấn) là một chỗ có thể bị
      tấn công.</div>

      <p class="note"><b>So sánh hai quy mô:</b> một chuỗi 13 byte vào đệm 8 byte hoặc 1 lệnh SQLi đánh lừa bảng 2 dòng lẫn
      kho <code>1 000 000</code> dòng — tham số hoá <code>?</code> và kiểm độ dài ở máy chủ chặn ở mọi quy mô với chi phí
      gần 0.</p>

      '
    focus:
    - 1
    - 1
    say: Điều cần mang theo, hãy giữ ranh giới rõ giữa mã và dữ liệu. Mọi chỗ đầu vào từ bên ngoài đi vào một bộ thông dịch,
      tức chương trình đọc và chạy câu lệnh như cơ sở dữ liệu, là một chỗ có thể bị tấn công.
  - clear: true
    show: '<p class="note">Bài sau (bài 13): <b>tình huống chuyên gia theo dòng thời gian</b> — một kho mã chung cho hàng
      chục nghìn kỹ sư, từ hơn 5000 lập trình viên (2010) tới khoảng 50&nbsp;000 kỹ sư (2020).</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 13, ta đi lại mười năm của một kho mã chung cho hàng chục nghìn kỹ sư, từ hơn 5000 lập trình viên
      năm 2010 tới khoảng 50 nghìn năm 2020. Ta sẽ thấy kiểm thử trước khi gộp, thay đổi lớn tự động và chủ sở hữu mã ra đời
      từ điểm nghẽn nào. Hẹn gặp bạn ở bài tiếp theo. Toàn bộ hành trình kỹ nghệ phần mềm từ đặc tả hợp đồng, bất biến, kiểm
      thử tới bảo mật hợp nhất tạo nền móng vững chắc cho mọi hệ thống thực tế.
