- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">bất biến: đúng trước mỗi vòng</span><span class="a">→</span>

      <span class="n">khởi đầu</span><span class="a">→</span>

      <span class="n">duy trì</span><span class="a">→</span>

      <span class="n">kết thúc ⇒ hậu điều kiện</span></div>

      '
    introduces:
    - implies
    say: Tổng kết lại, bất biến là mệnh đề đúng trước mỗi vòng. Chứng minh qua ba bước khởi đầu, duy trì, kết thúc, và bước
      kết thúc cùng điều kiện dừng suy ra hậu điều kiện. Bất biến vòng lặp tách bài toán chứng minh hàng triệu bước chạy thành
      ba câu kiểm tra tĩnh gọn nhẹ độc lập thời gian.
  - show: '<div class="box key"><b>Tư duy:</b> đừng nghĩ về cả vòng lặp một lúc. Chỉ cần tin một vòng giữ được điều đúng —
      quy nạp lo phần còn lại.</div>

      <p class="note"><b>So sánh hai quy mô:</b> kiểm bằng tay thử trên <code>n = 1..10</code>, nhưng bất biến vòng lặp chứng
      minh luôn cho <code>n = 1 000 000</code> mà không cần chạy thử mọi giá trị.</p>

      '
    focus:
    - 1
    - 1
    - 1
    say: Điều cần mang theo, đừng nghĩ về cả vòng lặp một lúc. Chỉ cần tin một vòng giữ được điều đúng, quy nạp sẽ lo phần
      còn lại. Khởi tạo đúng, duy trì bền vững và kết thúc suy ra hậu điều kiện là bộ ba hoàn chỉnh cho tính đúng từng phần
      của vòng lặp.
  - clear: true
    show: '<p class="note">Bài sau (bài 2): vòng lặp có chắc <b>dừng</b> không — <b>hàm biến thiên</b>.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 2, ta hỏi vòng lặp có chắc dừng không, với hàm biến thiên. Hẹn gặp bạn ở bài tiếp theo. Tuy nhiên
      chứng minh vòng lặp đúng nếu có kết thúc mới giải quyết một nửa bài toán vì còn phải bảo đảm vòng lặp thực sự sẽ dừng.
