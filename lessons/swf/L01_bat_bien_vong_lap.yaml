      quân đều đổ</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: 'Hình dung một hàng quân cờ đô-mi-nô. Đẩy quân đầu tiên là bước khởi đầu, còn việc quân nào đổ cũng đẩy quân kế tiếp
      là bước duy trì. Hai điều đó đủ để chắc chắn mọi quân đều đổ, dù hàng dài bao nhiêu, và đó là bước kết thúc. Giống người
      thủ kho kiểm kê dãy hàng dài: sau mỗi bước tiến lên một kệ, ông bảo đảm quyển sổ cầm trên tay luôn phản ánh đúng tổng
      khối lượng các kệ đã đi qua. Đến lúc đi hết kệ cuối cùng của nhà kho, con số ghi trong quyển sổ nghiễm nhiên chính là
      tổng kiểm kê chuẩn xác của cả kho hàng.'
- id: example
  kind: example
  title: Chứng minh vòng cộng dồn
  checks:
  - alg.sum_loop_invariant(5) == [(0, 0), (1, 0), (2, 1), (3, 3), (4, 6), (5, 10)] and all(s == i * (i - 1) // 2 for i, s
    in alg.sum_loop_invariant(5))
  - sp.simplify(sp.Symbol('i') * (sp.Symbol('i') - 1) / 2 + sp.Symbol('i') - (sp.Symbol('i') + 1) * sp.Symbol('i') / 2) ==
    0
  steps:
  - show: '<p>Bất biến: trước vòng có chỉ số $i$, $\ s = \dfrac{i(i-1)}{2}$.</p>

      <table class="t"><tr><th>$i$</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5 (dừng)</td></tr>

      <tr><th>$s$</th><td>0</td><td>0</td><td>1</td><td>3</td><td>6</td><td>$\hl{10}$</td></tr>

      <tr><th>$\frac{i(i-1)}{2}$</th><td>0</td><td>0</td><td>1</td><td>3</td><td>6</td><td>10</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    say: Bước một, đoán bất biến, trước vòng có chỉ số i, s bằng i nhân i trừ 1, chia 2. Bảng này chạy thử với n bằng 5. Hàng
      thứ hai là giá trị s trước mỗi vòng, và sau vòng cuối s bằng 10. Hàng thứ ba tính theo công thức, khớp từng cột.
  - clear: true
    show: '<p><b>Bước 2 — khởi đầu:</b> trước vòng đầu, $i = 0$ và $s = 0$; công thức cho $\frac{0 \cdot (0 - 1)}{2} = 0$.
      ✓</p>

      '
    introduces:
    - cdot
    say: Bước hai, khởi đầu. Trước vòng đầu, i bằng 0 và s bằng 0, công thức cho 0 nhân âm 1 chia 2, cũng bằng 0, nên bất
      biến đúng.
  - show: '<p><b>Bước 3 — duy trì:</b> thân vòng làm $s \leftarrow s + i$. Giả sử bất biến đúng trước vòng, thay vào rồi quy
      đồng:</p>

      $$\frac{i(i-1)}{2} + i = \frac{i(i-1) + 2i}{2} = \frac{(i+1)\,i}{2}$$

      <p>Đúng bất biến với chỉ số kế tiếp $i + 1$. Làm thử $i = 3$: $3 + 3 = 6 = \frac{4 \cdot 3}{2}$ ✓</p>

      '
    introduces:
    - assign
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Bước ba, duy trì, thân vòng thay s bằng s cộng i. Giả sử bất biến đúng trước vòng, thay vào rồi quy đồng, i nhân
      i trừ 1 chia 2, cộng i, bằng i cộng 1 nhân i chia 2. Đó chính là bất biến với chỉ số kế tiếp i cộng 1. Làm thử với i
      bằng 3, s bằng 3 cộng 3 là 6, đúng bằng 4 nhân 3 chia 2.
  - show: '<p><b>Bước 4 — kết thúc:</b> sau vòng cuối (chỉ số $n - 1$), chỉ số kế tiếp là $i = n$ và vòng dừng, nên $s = \frac{n(n-1)}{2}
      = 0 + 1 + \dots + (n-1)$ — đúng hậu điều kiện. ✓</p>

      '
    introduces:
    - dots
    say: Bước bốn, kết thúc, sau vòng cuối có chỉ số n trừ 1, chỉ số kế tiếp là n và vòng dừng, nên s bằng n nhân n trừ 1
      chia 2. Đó đúng là tổng từ 0 tới n trừ 1, tức hậu điều kiện, và chứng minh đúng với mọi n chứ không chỉ mười lần chạy
      thử.
  - show: <table class='t'><tr><th>ứng viên bất biến</th><th>duy trì</th><th>kết thúc</th></tr><tr><td><code>s &gt;= 0</code>
      (quá yếu)</td><td>đúng mỗi vòng</td><td class='red'>không suy ra <code>s = n*(n-1)//2</code></td></tr><tr><td><code>s
      == i*(i-1)//2</code> (đủ mạnh)</td><td>đúng mỗi vòng</td><td class='green'>suy thẳng hậu điều kiện</td></tr></table>
    say: Bước năm, chọn bất biến đủ mạnh thay vì bất biến yếu. Mệnh đề s không âm cũng giữ được qua từng vòng, nhưng lúc vòng
      dừng ở i bằng n ta không suy ra được tổng thật. Ngược lại, bất biến s bằng i nhân i trừ 1 chia 2 vừa duy trì được vừa
      suy thẳng ra hậu điều kiện khi thoát vòng.
- id: check
  kind: check
  title: 'Tự kiểm: ghép cặp kiểu Gauss'
  checks:
  - sum(range(5)) == 5 * 4 // 2 == 10 and sum(range(100)) == 100 * 99 // 2 == 4950
  - all(a + b == 4 for a, b in zip(range(5), reversed(range(5))))
  steps:
  - show: '<table class="t"><tr><th>cách khác</th><th>với n = 5</th><th>kết quả</th></tr>

      <tr><td>viết tổng xuôi rồi ngược, cộng từng cặp</td><td>(0 + 4), (1 + 3), (2 + 2), (3 + 1), (4 + 0): 5 cặp, mỗi cặp
      4</td><td>$\frac{5 \cdot 4}{2} = 10$ ✓</td></tr>

      <tr><td>n = 100, cộng bằng máy</td><td>0 + 1 + … + 99</td><td>4950 = $\frac{100 \cdot 99}{2}$ ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Kiểm bằng đường khác, viết tổng xuôi rồi viết ngược, cộng từng cặp. Với n bằng 5 có 5 cặp, mỗi cặp bằng 4, nên tổng
      gấp đôi là 20 và tổng thật là 10, khớp công thức. Cộng bằng máy với n bằng 100 được 4950, cũng đúng bằng 100 nhân 99
      chia 2.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Bất biến đúng nhưng quá yếu <b class="red">(không dùng được)</b>

      <br><span class="note">“$s \ge 0$” đúng trước mọi vòng, nhưng khi dừng không suy ra được $s$ bằng tổng. Bất biến phải
      đủ mạnh cho bước kết thúc.</span></div>

      '
    say: Lỗi thứ nhất, chọn bất biến đúng nhưng quá yếu, như s không âm. Mệnh đề đó đúng trước mọi vòng, nhưng khi dừng không
      suy ra được s bằng tổng, nên bất biến phải đủ mạnh cho bước kết thúc. Chọn mệnh đề bất biến quá hời hợt chỉ nói về giới
      hạn biến đếm mà không gắn kết với giá trị thật bên trong mảng kết quả. Bất biến yếu tuy rất dễ duy trì qua từng lượt
      nhưng đến lúc kết thúc vòng lặp lại bất lực không suy ra được hậu điều kiện mong muốn.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Chỉ kiểm bất biến ở cuối <b class="red">(thiếu)</b>

      <br><span class="note">Đúng ở cuối chưa đủ; bước duy trì mới là phần chứng minh cho mọi vòng.</span></div>

      '
    say: Lỗi thứ hai, chỉ kiểm bất biến ở cuối. Đúng ở cuối chưa đủ, chính bước duy trì mới là phần chứng minh cho mọi vòng.
      Quên kiểm chứng bất biến khi mảng truyền vào rỗng hoặc chỉ có một phần tử làm bước khởi tạo gán phần tử đầu gây lỗi
      truy cập ngoài biên.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Lẫn “trước vòng” và “sau vòng” <b class="red">(lệch một)</b>

      <br><span class="note">Nếu viết $s = \frac{i(i+1)}{2}$ (tính cả $i$ hiện tại) thì khởi đầu vẫn đúng ($i = 0$ cho 0)
      nhưng duy trì hỏng: trước vòng $i = 1$, $s = 0$ mà công thức cho 1; tin công thức thì khi dừng ra $\frac{n(n+1)}{2}$,
      thừa $n$. Ghi rõ bất biến được kiểm ở thời điểm nào.</span></div>

      '
    say: Lỗi thứ ba, lẫn thời điểm trước vòng và sau vòng. Nếu viết s bằng i nhân i cộng 1 chia 2, tức tính cả i hiện tại,
      thì khởi đầu vẫn đúng nhưng bước duy trì hỏng. Trước vòng i bằng 1, s mới là 0 mà công thức đã cho 1, và nếu tin công
      thức thì khi dừng nó cho thừa n so với tổng thật. Vì vậy phải ghi rõ bất biến được kiểm ở thời điểm nào. Nhầm lẫn dấu
      nhỏ hơn nghiêm ngặt với nhỏ hơn hoặc bằng trong phép cập nhật biên làm bất biến bị lệch đúng một bước sau khi kết thúc.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '(lambda a: [max(a[:i]) for i in range(1, len(a) + 1)])([3, 9, 2, 7]) == [3, 9, 9, 9]'
  - max([3, 9, 2, 7]) == 9
  steps:
  - show: '<div class="code"><div><span class="cm"># tiền điều kiện: a không rỗng</span></div><div>m = a[0]</div><div>for
      i in range(1, len(a)):</div><div>    m = max(m, a[i])</div></div>

      <table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Viết bất biến trước vòng có chỉ số <code>i</code>.</td></tr>

      <tr><td>2</td><td>Kiểm ba bước. Với <code>a = [3, 9, 2, 7]</code>, kết quả là gì?</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm với vòng tìm số lớn nhất trong mảng a không rỗng. Biến m bắt đầu bằng a 0, rồi với i
      từ 1, m thành số lớn hơn giữa m và a i. Câu một, viết bất biến trước vòng có chỉ số i. Câu hai, kiểm ba bước. Với mảng
      3, 9, 2, 7 thì kết quả là gì? Dừng video và làm ra giấy. Luôn rà soát đủ ba chặng khởi tạo, duy trì và kết thúc trước
      khi đặt bút khẳng định một vòng lặp là chính xác tuyệt đối.
    pause: 20
  - clear: true
    show: '<p>① Bất biến: <code>m</code> = số lớn nhất trong <code>a[0], …, a[i−1]</code>.</p>

      <table class="t"><tr><th>trước vòng i</th><td>1</td><td>2</td><td>3</td><td>4 (dừng)</td></tr>

      <tr><th>m</th><td>3</td><td>9</td><td>9</td><td>$\hl{9}$</td></tr>

      <tr><th>lớn nhất của a[0..i−1]</th><td>3</td><td>9</td><td>9</td><td>9</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.3'
    say: Đáp án câu một, bất biến là m bằng số lớn nhất trong các phần tử từ a 0 tới a i trừ 1. Bảng chạy thử với mảng 3,
      9, 2, 7. Hàng m lần lượt là 3, 9, 9, 9. Hàng số lớn nhất của phần đầu mảng cũng vậy, khớp từng cột. Thay từng trạng
      thái biến mẫu vào mệnh đề bất biến sau hai lượt lặp đầu tiên để bắt ngay chỗ bị gãy trước khi phân tích tổng quát.
  - show: '<p>② Khởi đầu: <code>i = 1</code>, <code>m = a[0]</code> ✓. Duy trì: lấy số lớn hơn với <code>a[i]</code> → lớn
      nhất trong <code>a[0..i]</code> ✓. Kết thúc: sau vòng cuối, chỉ số kế tiếp là <code>len(a)</code> → lớn nhất của cả
      mảng: 9.</p>

      '
    say: Câu hai, khởi đầu, i bằng 1 và m bằng a 0, đúng. Duy trì, lấy số lớn hơn với a i cho số lớn nhất tới vị trí i. Kết
      thúc, sau vòng cuối chỉ số kế tiếp là độ dài mảng, nên m là số lớn nhất của cả mảng, ở đây là 9. Kết hợp bất biến vừa
      tìm được với điều kiện dừng của vòng lặp để kiểm chứng biểu thức kết quả trả về khớp hậu điều kiện.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/SWF/L01
  steps:
  - show: <table class='t'><tr><th>Thực hành SWF:L01</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Chọn
      bất biến đủ mạnh</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n=20</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash
      labs/cham.sh SWF L01 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 1 kiểm chứng bất biến vòng lặp cộng dồn từ 0 tới n trừ 1. Dựa trên nền tảng đọc luồng
      chuẩn từ khoá Python cơ bản, bạn dùng sys chấm stdin chấm read để tách các cặp khoá giá trị. Đầu vào chỉ có một số nguyên
      n đọc từ khoá cùng tên. Bạn chạy vòng lặp tăng chỉ số i từ 0 tới n trừ 1, ở mỗi bước kiểm khẳng định bất biến tổng s
      bằng i nhân i trừ 1 chia 2 trước khi cộng thêm i.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <table class='t'><tr><th>Gợi ý triển khai SWF:L01</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (đọc n)</b></td><td>Tách số vòng lặp mục tiêu từ đầu vào chuẩn</td></tr><tr><td><b>Bước 2 (kiểm bất biến)</b></td><td>Ở
      đầu mỗi vòng xác nhận tổng tích lũy khớp công thức Gauss</td></tr><tr><td><b>Bước 3 (sau vòng lặp)</b></td><td>Xác nhận
      lại lần cuối ở trạng thái kết thúc và in tổng</td></tr><tr><td><b>Khung đọc stdin</b></td><td><code>n = int(sys.stdin.read().strip().split('=')[1])</code>
      rồi dùng <code>assert s == i * (i - 1) // 2</code></td></tr></table>
    say: Gợi ý cài đặt bài số 1 đi qua ba bước ngắn gọn. Bước một, tách lấy số nguyên n từ luồng chuẩn và khởi tạo s bằng
      0 cùng biến cờ bất biến đúng bằng 1. Bước hai, qua từng lượt i từ 0 tới n trừ 1, kiểm tra biểu thức i nhân i trừ 1 chia
      2 khớp s trước khi cộng dồn i. Bước ba, kiểm lại bất biến một lần nữa ngay sau khi thoát vòng lặp rồi in đủ ba dòng
