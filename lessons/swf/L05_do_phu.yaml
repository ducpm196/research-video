id: L05
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 5 — Độ phủ kiểm thử: lệnh, nhánh, đường đi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L05; audit/swf/verify_swf.py L05; P. Ammann, J. Offutt, Introduction to Software Testing, 2nd ed. (2016), chương 7; RTCA DO-178C (2011) (độ phủ quyết định cho phần mềm hàng không)"
assumes: [arith, ltgt, power]
# Quy ước: “if” độc lập = mỗi câu if không phụ thuộc kết quả câu khác; mỗi ca kiểm là một bộ đúng/sai cho các điều kiện.
#   Số nhánh, số đường do alg.branch_path_cover; ví dụ chia cho 0 chạy thật bằng Python trong checks.
objectives:
  - "Phân biệt độ phủ lệnh, nhánh, đường đi"
  - "Tính số ca tối thiểu cho mỗi loại độ phủ"
  - "Biết độ phủ cao không có nghĩa là đã kiểm mọi hành vi"
asr_reviewed:
  - {sentence: "Dòng mã nói nếu x dương thì đặt y bằng 10.", reason: "ASR chép “Dòng mã nói nếu quyết dương thì đặt y bằng mươi.” (0.818): tên chữ cái x (“ích”) bị nghe thành “quyết”; “mười/mươi” lệch thanh, số 10 hiện trên màn hình — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "100% dòng lệnh đã chạy — vẫn chia cho 0"
    checks:
      - "(lambda g: (g(5), g(-1)))(lambda x: (lambda y: 100 / y if y else 'ZeroDivisionError')(10 if x > 0 else 0)) == (10.0, 'ZeroDivisionError')"
    steps:
      - show: |
          <div class="code"><div>def g(x):</div><div>    y = 0</div><div>    if x &gt; 0: y = 10</div><div>    return 100 / y</div></div>
          <p>Một ca <code>g(5)</code> chạy qua <b>mọi dòng</b> và trả 10. Công cụ báo “độ phủ 100%”. Nhưng <code>g(−1)</code> chia cho 0.</p>
          <div class="box key">Hôm nay: các loại <b>độ phủ</b> — lệnh, nhánh, đường đi — và điều mỗi loại không nói được.</div>
        focus: [1, 2, 2, 3]
        say: "Chào bạn, hàm g đặt y bằng 0, nếu x dương thì đặt y bằng 10, rồi trả về 100 chia y. Một ca kiểm với x bằng 5 chạy qua mọi dòng và trả về 10, công cụ báo độ phủ 100 phần trăm. Nhưng với x bằng âm 1, hàm chia cho 0. Hôm nay ta học các loại độ phủ, lệnh, nhánh, đường đi, và điều mỗi loại không nói được."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: câu if và quy tắc nhân"
    checks:
      - "2 * 3 == 6 == 3 + 3 and len(list(__import__('itertools').product([True, False], repeat=2))) == 4"
    steps:
      - show: |
          <div class="code"><div>if x &gt; 0: y = 10</div></div>
          <p>Câu <b>if</b> chia đường chạy làm hai: điều kiện <b>đúng</b> thì chạy lệnh sau dấu hai chấm, <b>sai</b> thì bỏ qua lệnh đó.</p>
        focus: [1, 1, 2]
        say: "Trước hết, ôn câu điều kiện. Dòng mã nói nếu x dương thì đặt y bằng 10. Câu điều kiện chia đường chạy làm hai, điều kiện đúng thì chạy lệnh phía sau, sai thì bỏ qua lệnh đó."
      - show: |
          <p><b>Quy tắc nhân</b>: các lựa chọn độc lập thì số tổ hợp bằng <b>tích</b> số cách của từng lựa chọn. Vì sao: mỗi áo đi được với cả 3 quần, nên 2 áo cho 3 + 3 = 6 bộ, đúng bằng 2 nhân 3.</p>
          <table class="t"><tr><th>ví dụ</th><th>số tổ hợp</th></tr><tr><td>2 áo, 3 quần</td><td>2 nhân 3 = 6 bộ</td></tr><tr><td>2 câu if, mỗi câu đúng hoặc sai</td><td>2 nhân 2 = 4 khả năng: (đ, đ), (đ, s), (s, đ), (s, s)</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Tiếp theo, ta cần quy tắc nhân, các lựa chọn độc lập thì số tổ hợp bằng tích số cách của từng lựa chọn. Lý do là mỗi áo đi được với cả 3 quần, nên 2 áo cho 3 cộng 3 bằng 6 bộ, đúng bằng 2 nhân 3. Bảng có hai ví dụ. 2 áo và 3 quần cho 6 bộ. 2 câu điều kiện, mỗi câu đúng hoặc sai, cho 2 nhân 2 bằng 4 khả năng, là đúng đúng, đúng sai, sai đúng, và sai sai."

  - id: sym
    kind: symbol
    title: "Giải mã: ba mức độ phủ"
    steps:
      - show: |
          <table class="t"><tr><th>độ phủ</th><th>yêu cầu</th><th>với <code>g</code></th></tr>
          <tr><td>lệnh</td><td>mỗi dòng lệnh chạy ít nhất một lần</td><td><code>g(5)</code> đủ</td></tr>
          <tr><td>nhánh</td><td>mỗi điều kiện có lúc <b>đúng</b>, có lúc <b>sai</b></td><td>cần thêm <code>x ≤ 0</code> → bắt được chia cho 0</td></tr>
          <tr><td>đường đi</td><td>mỗi <b>tổ hợp</b> lựa chọn từ đầu tới cuối hàm</td><td>2 đường</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Có ba mức độ phủ. Độ phủ lệnh yêu cầu mỗi dòng lệnh chạy ít nhất một lần, với hàm g chỉ cần ca x bằng 5. Độ phủ nhánh yêu cầu mỗi điều kiện có lúc đúng có lúc sai, nên phải thêm một ca x không dương, và ca đó bắt được lỗi chia cho 0. Độ phủ đường đi yêu cầu mỗi tổ hợp lựa chọn từ đầu tới cuối hàm, với g có 2 đường."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hai đường qua hàm g"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><defs><marker id="arS5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="24" text-anchor="middle" fill="#1f2937"><rect x="80" y="135" width="200" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="180" y="178">y = 0</text><polygon points="470,90 600,170 470,250 340,170" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="470" y="178">x &gt; 0 ?</text><rect x="720" y="40" width="220" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="830" y="83">y = 10</text><rect x="1090" y="135" width="260" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1220" y="178">100 / y</text><text x="640" y="80" fill="#059669">đúng</text><text x="760" y="290" fill="#b91c1c">sai: y vẫn 0 → chia cho 0</text></g><g fill="none" stroke-width="4"><line x1="280" y1="170" x2="338" y2="170" stroke="#1f2937" marker-end="url(#arS5)"/><path d="M600,170 C650,170 660,75 718,75" stroke="#059669" marker-end="url(#arS5)"/><path d="M940,75 C1020,75 1020,160 1088,165" stroke="#059669" marker-end="url(#arS5)"/><path d="M470,250 C520,320 1000,320 1088,190" stroke="#b91c1c" stroke-dasharray="12 8" marker-end="url(#arS5)"/></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ các đường chạy qua hàm g. Đường xanh đi qua nhánh đúng, chạy cả lệnh y bằng 10, nên ca x bằng 5 đã chạm mọi ô lệnh. Đường đỏ đứt nét đi qua nhánh sai, không ô lệnh mới nào, nhưng chính đường này dẫn tới chia cho 0."

  - id: example
    kind: example
    title: "Ba câu if độc lập"
    checks:
      - "alg.branch_path_cover(3, [(True, True, True), (False, False, False)]) == (6, 6, 2, 8)"
      - "alg.branch_path_cover(3, list(__import__('itertools').product([True, False], repeat=3))) == (6, 6, 8, 8) and 2 ** 3 == 8"
    steps:
      - show: |
          <div class="code"><div>def f(a, b, c):</div><div>    s = 0</div><div>    if a: s += 1</div><div>    if b: s += 2</div><div>    if c: s += 4</div><div>    return s</div></div>
        say: "Bước một, xét hàm f có ba câu điều kiện độc lập, mỗi câu cộng thêm 1, 2 hay 4 vào s."
      - show: |
          <table class="t"><tr><th>ca</th><th>if a</th><th>if b</th><th>if c</th></tr>
          <tr><td>(đúng, đúng, đúng)</td><td>nhánh đúng</td><td>nhánh đúng</td><td>nhánh đúng</td></tr>
          <tr><td>(sai, sai, sai)</td><td>nhánh sai</td><td>nhánh sai</td><td>nhánh sai</td></tr></table>
          <p><b>Bước 2 — nhánh</b>: 3 điều kiện, mỗi điều kiện 2 nhánh → 6 nhánh; hai ca trên phủ đủ cả 6 → $\hl{2}$ ca.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước hai, đếm nhánh. Ca tất cả đúng đi vào nhánh đúng của cả ba câu. Ca tất cả sai đi vào nhánh sai của cả ba câu. Ba điều kiện, mỗi điều kiện hai nhánh, nên có 6 nhánh, và hai ca trên phủ đủ cả 6."
      - clear: true
        show: |
          <p><b>Bước 3 — đường đi</b>: mỗi câu if 2 lựa chọn, độc lập → $2 \cdot 2 \cdot 2 = 2^3 = \hl{8}$ đường.</p>
          <table class="t"><tr><th>(a, b, c)</th><th>s</th></tr><tr><td>s, s, s</td><td>0</td></tr><tr><td>s, s, đ</td><td>4</td></tr><tr><td>s, đ, s</td><td>2</td></tr><tr><td>s, đ, đ</td><td>6</td></tr><tr><td>đ, s, s</td><td>1</td></tr><tr><td>đ, s, đ</td><td>5</td></tr><tr><td>đ, đ, s</td><td>3</td></tr><tr><td>đ, đ, đ</td><td>7</td></tr></table>
        introduces: [cdot]
        focus: [1, 2, 2]
        say: "Bước ba, đếm đường đi. Theo quy tắc nhân, mỗi câu điều kiện có hai lựa chọn độc lập, nên có 2 nhân 2 nhân 2, bằng 8 đường, ứng với s từ 0 tới 7. Hai ca ở bước hai chỉ phủ 2 trong 8 đường."
      - clear: true
        show: |
          <p><b>Bước 4</b> — số đường tăng <b>theo hàm mũ</b>: 10 câu if độc lập → $2^{10} = 1024$ đường; một vòng lặp chạy đúng 20 lần với một if bên trong → $2^{20}$ đường (số vòng thay đổi thì còn nhiều hơn).</p>
          <div class="box key">Phủ hết đường đi thường không làm nổi. Thực tế đặt mục tiêu <b>phủ nhánh</b>, rồi thêm ca theo phân hoạch và biên (bài 4: chia đầu vào thành các lớp, thử thêm ở ranh giới giữa các lớp).</div>
        focus: [1, 1, 2, 2]
        say: "Bước bốn, số đường đi tăng theo hàm mũ, 10 câu điều kiện độc lập đã có một nghìn không trăm hai mươi tư đường. Một vòng lặp chạy đúng 20 lần với một câu điều kiện bên trong đã có 2 mũ 20 đường, và nếu số vòng thay đổi thì còn nhiều hơn. Phủ hết đường đi thường không làm nổi. Thực tế ta đặt mục tiêu phủ nhánh, rồi thêm ca theo phân hoạch và biên như bài 4, tức chia đầu vào thành các lớp và thử thêm ở ranh giới giữa các lớp."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê 8 đường và đếm"
    checks:
      - "sorted(a * 1 + b * 2 + c * 4 for a, b, c in __import__('itertools').product([0, 1], repeat=3)) == list(range(8))"
      - "alg.branch_path_cover(3, [(True, True, True), (False, False, False)])[2] == 2"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>8 đường</td><td>8 giá trị s khác nhau 0, 1, …, 7 — mỗi giá trị chỉ một đường tạo ra</td><td>8 ✓</td></tr>
          <tr><td>2 ca phủ mấy đường?</td><td>s = 7 và s = 0</td><td>2 trên 8 ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Vì 1, 2 và 4 cộng các tập con khác nhau luôn ra tổng khác nhau, 8 đường cho đúng 8 giá trị s từ 0 tới 7. Hai ca tất cả đúng và tất cả sai chỉ cho s bằng 7 và s bằng 0, tức 2 trên 8 đường."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda g, m: (g(5), m(5), g(0), m(0)))(lambda x: (lambda y: 100 / y if y else 'chia 0')(10 if x > 0 else 0), lambda x: (lambda y: 100 / y if y else 'chia 0')(10 if x >= 0 else 0)) == (10.0, 10.0, 'chia 0', 10.0)"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi 100% độ phủ lệnh là “đã kiểm xong” <b class="red">(sai)</b>
          <br><span class="note">Như hàm <code>g</code>: mọi dòng đã chạy, lỗi vẫn còn ở nhánh chưa đi.</span></div>
        say: "Lỗi thứ nhất, coi 100 phần trăm độ phủ lệnh là đã kiểm xong. Như hàm g, mọi dòng đã chạy mà lỗi vẫn nằm ở nhánh chưa đi."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Viết ca kiểm chỉ để tăng con số độ phủ <b class="red">(vô ích)</b>
          <br><span class="note">Ca kiểm chạy qua mã mà không <b>kiểm kết quả</b> vẫn làm tăng độ phủ, nhưng không bắt được lỗi nào.</span></div>
        say: "Lỗi thứ hai, viết ca kiểm chỉ để tăng con số độ phủ. Một ca chạy qua mã mà không kiểm kết quả vẫn làm tăng độ phủ, nhưng không bắt được lỗi nào."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Quên rằng độ phủ không thấy được mã <b>còn thiếu</b> <b class="red">(giới hạn)</b>
          <br><span class="note">Nếu chương trình quên xử lý một trường hợp, không có dòng nào để phủ. Chỉ đặc tả (điều hàm phải làm, bài 0) và phân hoạch (các lớp đầu vào, bài 4) mới chỉ ra được.</span></div>
        say: "Lỗi thứ ba, quên rằng độ phủ không thấy được mã còn thiếu. Nếu chương trình quên xử lý một trường hợp, sẽ không có dòng nào để phủ. Chỉ đặc tả, tức điều hàm phải làm, cùng phân hoạch thành các lớp đầu vào mới chỉ ra được."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Không hỏi “bộ ca kiểm có <b>bắt</b> được lỗi không” <b class="red">(độ phủ không đo điều này)</b>
          <br><span class="note">Người làm nghề dùng <b>kiểm thử đột biến</b>: cố tình sửa nhỏ mã, như <code>x &gt; 0</code> thành <code>x &gt;= 0</code>, rồi chạy lại bộ ca. Ca nào cũng qua thì bộ ca còn yếu.</span></div>
          <table class="t"><tr><th>ca</th><th>mã gốc</th><th>bản đột biến <code>x &gt;= 0</code></th><th>phân biệt được?</th></tr>
          <tr><td><code>g(5)</code></td><td>10</td><td>10</td><td>không</td></tr>
          <tr><td><code>g(0)</code></td><td>chia cho 0</td><td>10</td><td>có ✓</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3"]
        say: "Lỗi thứ tư, không hỏi bộ ca kiểm có bắt được lỗi hay không, vì độ phủ không đo điều này. Người làm nghề dùng kiểm thử đột biến, cố tình sửa nhỏ mã, như đổi lớn hơn 0 thành lớn hơn hoặc bằng 0, rồi chạy lại bộ ca. Bảng so kết quả của hai ca kiểm trên cả hai bản. Ca x bằng 5 cho 10 ở cả hai bản, nên không phân biệt được. Ca x bằng 0 làm mã gốc chia cho 0 nhưng bản đột biến trả 10, nên ca này bắt được đột biến."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.branch_path_cover(4, [(True,) * 4, (False,) * 4])[:2] == (8, 8) and 2 ** 4 == 16"
    steps:
      - show: |
          <p>Hàm có 4 câu if độc lập.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Phủ nhánh cần tối thiểu mấy ca?</td></tr><tr><td>2</td><td>Có bao nhiêu đường đi?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, với một hàm có 4 câu điều kiện độc lập. Câu một, phủ nhánh cần tối thiểu mấy ca? Câu hai, có bao nhiêu đường đi? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $\hl{2}$ ca: tất cả đúng, tất cả sai → đủ 4 nhân 2 = 8 nhánh. Một ca không đủ, vì mỗi điều kiện cần cả lúc đúng lẫn lúc sai.</p>
        say: "Đáp án câu một, 2 ca, tất cả đúng và tất cả sai, phủ đủ 4 nhân 2 bằng 8 nhánh. Một ca không đủ, vì mỗi điều kiện cần cả lúc đúng lẫn lúc sai."
      - show: |
          <p>② Theo quy tắc nhân: $2 \cdot 2 \cdot 2 \cdot 2 = 2^4 = \hl{16}$ đường — gấp đôi hàm 3 câu if.</p>
        say: "Câu hai, theo quy tắc nhân, 2 nhân 2 nhân 2 nhân 2 bằng 16 đường, gấp đôi hàm có 3 câu điều kiện."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">lệnh → nhánh → đường đi: mạnh dần</span><span class="a">→</span>
          <span class="n">đường tăng theo hàm mũ</span><span class="a">→</span>
