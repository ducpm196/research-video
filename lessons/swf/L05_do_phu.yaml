          <span class="n">độ phủ không thấy mã thiếu</span></div>
        say: "Tổng kết lại, phủ đường đi thì phủ nhánh, phủ nhánh thì phủ lệnh. Số đường tăng theo hàm mũ, nên mục tiêu thực tế là phủ nhánh, và độ phủ không thấy được mã còn thiếu."
