- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">đúng (bài 1) + dừng (bài này)</span><span class="a">→</span>

      <span class="n">hàm biến thiên: số nguyên</span><span class="a">→</span>

      <span class="n">bị chặn dưới</span><span class="a">→</span>

      <span class="n">giảm thật sự mỗi vòng</span></div>

      '
    say: Tổng kết lại, một vòng lặp đúng hoàn toàn khi vừa đúng như bài 1 vừa dừng như bài này. Hàm biến thiên là một số nguyên
      bị chặn dưới, và giảm thật sự sau mỗi vòng. Bất biến bảo đảm kết quả đúng nếu dừng, còn hàm biến thiên đóng dấu bảo
      chứng rằng chương trình chắc chắn sẽ dừng lại.
  - show: '<div class="box key"><b>Tư duy:</b> để chứng minh một quá trình kết thúc, hãy tìm một “đồng hồ đếm ngược” bằng
      số nguyên mà mỗi bước đều làm nó nhích xuống.</div>

      <p class="note"><b>So sánh hai quy mô:</b> Euclid với <code>b = 35</code> dừng trong 3 bước; dù đầu vào lên tới <code>10<sup>9</sup></code>,
      hàm biến thiên <code>b ≥ 0</code> giảm chặt vẫn bảo đảm dừng sau hữu hạn bước (nhưng đổi <code>b</code> thành số thực
      không bị chặn bước rời rạc thì có thể lặp vô hạn).</p>

      '
    focus:
    - 1
    - 1
    say: Điều cần mang theo, để chứng minh một quá trình kết thúc, hãy tìm một đồng hồ đếm ngược bằng số nguyên mà mỗi bước
      đều làm nó nhích xuống. Kết hợp cả hai tạo nên chứng minh tính đúng toàn phần trọn vẹn cho mọi thuật toán lặp và đệ
      quy.
  - clear: true
    show: '<p class="note">Bài sau (bài 3): <b>lỗi lệch một</b> và phân tích biên.</p>

      '
    forward_ref: true
