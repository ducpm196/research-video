  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/SWF/L02
  steps:
  - show: <table class='t'><tr><th>Thực hành SWF:L02</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Nhận
      ra đại lượng giảm mà không chứng minh được dừng</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>a=1071 b=462</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh SWF L02 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 2 với hàm biến thiên trên thuật toán Euclid tìm ước chung lớn nhất. Dựa trên nền tảng
      đọc luồng chuẩn từ khoá Python cơ bản, bạn dùng sys chấm stdin chấm read để tách các cặp khoá giá trị. Đầu vào gồm hai
      số nguyên không âm a và b. Trong vòng lặp chia lấy dư khi b khác 0, bạn đếm số vòng lặp và kiểm chứng hàm biến thiên
      b luôn không âm và giảm thật sự sau mỗi vòng.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: '<table class=''t''><tr><th>Gợi ý triển khai SWF:L02</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước
      1 (chia lấy dư)</b></td><td>Tính phần dư kế tiếp bằng phép chia lấy dư trong mỗi vòng</td></tr><tr><td><b>Bước 2 (hàm
      biến thiên)</b></td><td>Kiểm tra phần dư mới nhỏ hơn chặt số chia cũ và không âm</td></tr><tr><td><b>Bước 3 (cập nhật)</b></td><td>Hoán
      vị cặp giá trị cho tới khi số chia về không</td></tr><tr><td><b>Khung đọc stdin</b></td><td><code>kv = {k:
      int(v) for k, v in (t.split(''='') for t in sys.stdin.read().split())}</code></td></tr></table>'
    say: Gợi ý cài đặt bài số 2 gồm ba bước rõ ràng. Bước một, đọc a và b từ luồng chuẩn rồi đặt biến đếm bước bằng 0 và cờ
      giảm ngặt bằng 1. Bước hai, khi b lớn hơn 0, gán a, b mới bằng b và a chia b lấy dư, đồng thời xác nhận b mới luôn nhỏ
      hơn chặt b cũ và không âm. Bước ba, khi vòng dừng thì a là ước chung lớn nhất, in đủ ba dòng theo đúng khuôn dạng.
