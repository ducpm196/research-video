id: L02
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 2 — Hàm biến thiên và chứng minh chương trình dừng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L02; audit/swf/verify_swf.py L02; R. W. Floyd, Assigning Meanings to Programs (1967); D. Gries, The Science of Programming (1981), mục 11.3; J. C. Lagarias, The 3x + 1 Problem and its Generalizations, Amer. Math. Monthly 92 (1985)"
assumes: [arith, ltgt]
# Quy ước: “hàm biến thiên” = một số nguyên tính từ biến của vòng lặp, ≥ 0 khi vòng còn chạy, và giảm THẬT SỰ sau mỗi vòng.
#   a mod b là phần dư (DMS). Vết Euclid do alg.euclid_trace; vết tìm kiếm nhị phân do alg.bin_search; vòng chia đôi số thực chạy thật
#   bằng Python (IEEE 754 nhị phân 64 bit). Bài toán 3x + 1 nêu như ví dụ chưa ai chứng minh được, không khẳng định gì thêm.
objectives:
  - "Phát biểu hàm biến thiên"
  - "Chứng minh vòng lặp dừng"
  - "Nhận ra đại lượng giảm mà không chứng minh được dừng"
asr_reviewed:
  - {sentence: "V giảm thật sự vì phần dư khi chia cho b luôn nhỏ hơn b, nên b mới nhỏ hơn b cũ.", reason: "ASR chép “Vế giảm thật sự vì phần dư khi chia cho bê luôn nhỏ hơn bê, nên bê mới nhỏ hơn bê cũ.” (0.955): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hàm biến thiên V là một số nguyên tính từ các biến của vòng lặp, thoả hai điều.", reason: "ASR chép “Hàm biến thiên với là … vòng lập”: tên chữ cái V đọc kiểu Việt “vê” bị nghe thành “với”, lặp/lập lệch thanh (đã biết); ký hiệu V hiện trên màn hình — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đúng — nếu nó dừng"
    steps:
      - show: |
          <p>Bài 1 chứng minh: <b>nếu</b> vòng lặp dừng thì kết quả đúng. Một vòng lặp chạy mãi cũng “không bao giờ cho kết quả sai”.</p>
          <div class="box key">Hôm nay: chứng minh vòng lặp <b>dừng</b> bằng <b>hàm biến thiên</b>.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, bài 1 chứng minh rằng nếu vòng lặp dừng thì kết quả đúng. Nhưng một vòng lặp chạy mãi cũng không bao giờ cho kết quả sai. Hôm nay ta chứng minh vòng lặp dừng bằng hàm biến thiên."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: phép chia lấy dư và vòng while"
    checks:
      - "252 % 105 == 42 and 252 == 2 * 105 + 42 and all(0 <= x % 7 < 7 for x in range(50))"
    steps:
      - show: |
          <p><b>Chia lấy dư</b> (khoá Toán rời rạc): <code>a % b</code> là phần dư khi chia <code>a</code> cho <code>b</code>.</p>
          <table class="t"><tr><th>phép</th><th>viết lại</th><th>dư</th></tr>
          <tr><td>252 % 105</td><td>252 = 2 lần 105 cộng 42</td><td>42</td></tr>
          <tr><td>chia cho 7</td><td>dư chỉ có thể là 0, 1, …, 6</td><td>luôn từ 0 tới 6</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Ở khoá Toán rời rạc, ta đã học phép chia lấy dư, a phần trăm b là phần dư khi chia a cho b. Bảng có hai ví dụ. 252 bằng 2 lần 105 cộng 42, nên dư là 42. Chia cho 7 thì dư chỉ có thể từ 0 tới 6, tức luôn không âm và nhỏ hơn số chia."
      - show: |
          <div class="code"><div>while b != 0:</div><div>    <span class="cm"># thân vòng</span></div></div>
          <p>Vòng <b>while</b> kiểm điều kiện <b>trước mỗi lần</b> chạy thân; điều kiện sai thì dừng. Nếu thân vòng không bao giờ làm điều kiện sai, vòng chạy mãi.</p>
        focus: [1, 2, 2]
        say: "Dòng trên là một vòng lặp chạy chừng nào b còn khác 0. Vòng này kiểm điều kiện trước mỗi lần chạy thân, điều kiện sai thì dừng. Nếu thân vòng không bao giờ làm điều kiện sai, vòng sẽ chạy mãi."

  - id: sym
    kind: symbol
    title: "Giải mã: hàm biến thiên"
    steps:
      - show: |
          <p><b>Hàm biến thiên</b> $V$: một số <b>nguyên</b> tính từ các biến của vòng lặp, sao cho:</p>
          <ol><li>$V \ge 0$ mỗi khi vòng lặp còn chạy (bị chặn dưới);</li><li>mỗi vòng, $V$ <b>giảm thật sự</b> (ít nhất 1).</li></ol>
          <div class="box key">Số nguyên không âm không thể giảm mãi: sau tối đa $V$ ban đầu vòng, vòng lặp phải dừng.</div>
        focus: [1, "2.1", "2.2", 3]
        say: "Hàm biến thiên V là một số nguyên tính từ các biến của vòng lặp, thoả hai điều. Một, V không âm mỗi khi vòng lặp còn chạy, tức bị chặn dưới. Hai, mỗi vòng V giảm thật sự, ít nhất 1 đơn vị. Số nguyên không âm không thể giảm mãi, nên sau tối đa V ban đầu vòng, vòng lặp phải dừng."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cầu thang đi xuống có sàn"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><line x1="280" y1="282" x2="1300" y2="282" stroke="#b91c1c" stroke-width="5"/><g font-size="25" fill="#1f2937"><rect x="330" y="70" width="150" height="210" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="405" y="58" text-anchor="middle">b = 105</text><rect x="560" y="196" width="150" height="84" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="635" y="184" text-anchor="middle">b = 42</text><rect x="790" y="238" width="150" height="42" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="865" y="226" text-anchor="middle">b = 21</text><rect x="1020" y="280" width="150" height="4" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="1095" y="268" text-anchor="middle">b = 0</text><text x="1310" y="290" fill="#b91c1c">sàn 0</text><text x="40" y="120">mỗi vòng</text><text x="40" y="155">bậc thang</text><text x="40" y="190">xuống ít nhất 1</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình dung hàm biến thiên như một cầu thang đi xuống tới một cái sàn là 0. Mỗi vòng ta bước xuống ít nhất một bậc, và không thể đi xuyên sàn. Vì cầu thang chỉ có hữu hạn bậc, ta chắc chắn phải dừng."

  - id: example
    kind: example
    title: "Euclid dừng vì b giảm"
    checks:
      - "alg.euclid_trace(252, 105) == [(252, 105), (105, 42), (42, 21), (21, 0)]"
      - "all(b2 < b1 for (_, b1), (_, b2) in zip(alg.euclid_trace(252, 105), alg.euclid_trace(252, 105)[1:]))"
    steps:
      - show: |
          <div class="code"><div>while b != 0:</div><div>    a, b = b, a % b</div></div>
          <p><b>Bước 1</b> — tiền điều kiện: $a, b$ là số nguyên không âm. Chọn $V = b$.</p>
        focus: [1, 2]
        say: "Bước một, thuật toán tìm ước chung lớn nhất lặp chừng nào b còn khác 0, mỗi vòng thay cặp a, b bằng b và a chia b lấy dư. Với tiền điều kiện a và b là số nguyên không âm, ta chọn hàm biến thiên V bằng b."
      - show: |
          <table class="t"><tr><th>điều kiện</th><th>vì sao đúng</th></tr>
          <tr><td>bị chặn dưới: $V \ge 0$</td><td>$b$ mới là một phần dư, mà phần dư luôn không âm</td></tr>
          <tr><td>giảm thật sự</td><td>phần dư khi chia cho $b$ luôn $\lt b$, nên $b$ mới nhỏ hơn $b$ cũ</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước hai, kiểm hai điều kiện. V bị chặn dưới vì b mới là một phần dư, mà phần dư luôn không âm. V giảm thật sự vì phần dư khi chia cho b luôn nhỏ hơn b, nên b mới nhỏ hơn b cũ."
      - clear: true
        show: |
          <table class="t"><tr><th>vòng</th><th>a</th><th>b</th><th>a % b</th></tr>
          <tr><td>1</td><td>252</td><td>105</td><td>42</td></tr>
          <tr><td>2</td><td>105</td><td>42</td><td>21</td></tr>
          <tr><td>3</td><td>42</td><td>21</td><td>0</td></tr>
          <tr><td>dừng</td><td>$\hl{21}$</td><td>0</td><td>—</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bước ba, chạy thử với 252 và 105. Vòng một, 252 chia 105 dư 42. Vòng hai, 105 chia 42 dư 21. Vòng ba, 42 chia 21 dư 0. Lúc này b bằng 0 nên vòng dừng, và a bằng 21 là ước chung lớn nhất."
      - show: |
          <p><b>Bước 4</b> — $b$ đi 105, 42, 21, 0: giảm và dừng sau 3 vòng, ít hơn nhiều so với giới hạn 105 vòng mà hàm biến thiên bảo đảm.</p>
        say: "Bước bốn, b đi qua 105, 42, 21 rồi 0, giảm thật sự và dừng sau 3 vòng. Con số này ít hơn nhiều so với giới hạn 105 vòng mà hàm biến thiên bảo đảm, vì V ban đầu là 105."

  - id: check
    kind: check
    title: "Tự kiểm: liệt kê ước chung"
    checks:
      - "[d for d in range(1, 106) if 252 % d == 0 and 105 % d == 0] == [1, 3, 7, 21] and math.gcd(252, 105) == 21"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>liệt kê mọi số chia hết cả 252 và 105</td><td>1, 3, 7, 21 → lớn nhất là 21 ✓</td></tr>
          <tr><td>thử lại: 252 : 21 và 105 : 21</td><td>12 và 5, đều là số nguyên ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, chậm nhưng dễ hiểu. Liệt kê mọi số chia hết cả 252 và 105, ta được 1, 3, 7 và 21, nên lớn nhất là 21, khớp kết quả. Thử lại, 252 chia 21 bằng 12 và 105 chia 21 bằng 5, đều là số nguyên."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "(lambda xs: xs[:4] == [5, 3, 1, -1] and 0 not in xs)([5 - 2 * k for k in range(1000)])"
      - "alg.halving_steps(1.0) == 1075"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đại lượng giảm nhưng không bị chặn dưới <b class="red">(không chứng minh được)</b>
          <br><span class="note"><code>while x != 0: x = x - 2</code> với <code>x = 5</code>: 5, 3, 1, −1, −3… giảm mãi, không bao giờ bằng 0. Phải chỉ ra $V \ge 0$ khi vòng còn chạy.</span></div>
        say: "Lỗi thứ nhất, chọn đại lượng giảm nhưng không bị chặn dưới. Vòng trừ 2 chừng nào x khác 0, bắt đầu từ 5, đi qua 5, 3, 1, âm 1, âm 3, giảm mãi mà không bao giờ bằng 0. Vì vậy phải chỉ ra V không âm khi vòng còn chạy."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng số thực làm hàm biến thiên <b class="red">(sai lập luận)</b>
          <br><span class="note">Chia đôi một số thực dương: trên giấy giảm mãi mà không tới 0. Trên máy lại dừng sau $\hl{1075}$ vòng vì số quá nhỏ bị làm tròn về 0 — dừng do làm tròn, không do lập luận. Hàm biến thiên phải là số nguyên.</span></div>
        say: "Lỗi thứ hai, dùng số thực làm hàm biến thiên. Chia đôi một số thực dương thì trên giấy nó giảm mãi mà không tới 0. Trên máy, vòng lại dừng sau 1075 lần vì số quá nhỏ bị làm tròn về 0, tức dừng do làm tròn chứ không do lập luận. Hàm biến thiên phải là số nguyên."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Nghĩ chạy thử nhiều lần là chứng minh dừng <b class="red">(chưa đủ)</b>
          <br><span class="note">Vòng “chẵn thì chia đôi, lẻ thì nhân 3 cộng 1” dừng ở 1 với mọi số đã thử (27 cần 111 bước), nhưng tới nay chưa ai chứng minh được nó luôn dừng.</span></div>
        say: "Lỗi thứ ba, nghĩ chạy thử nhiều lần là chứng minh dừng. Vòng chẵn thì chia đôi, lẻ thì nhân 3 cộng 1, dừng ở 1 với mọi số đã thử, số 27 cần 111 bước. Vậy mà tới nay chưa ai chứng minh được nó luôn dừng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Vòng chờ dịch vụ bên ngoài không có hàm biến thiên <b class="red">(treo trong thực tế)</b>
          <br><span class="note">“Gọi lại tới khi máy chủ trả lời” phụ thuộc thứ ta không kiểm soát. Người làm nghề thêm bộ đếm: tối đa 5 lần thử, $V$ = số lần thử còn lại — giảm 1 mỗi vòng, chạm 0 thì dừng và báo lỗi.</span></div>
          <table class="t"><tr><th>sau lần thử</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><th>V còn lại</th><td>4</td><td>3</td><td>2</td><td>1</td><td>0 → dừng, báo lỗi</td></tr></table>
        focus: [1, 1, 2]
        say: "Lỗi thứ tư, viết vòng chờ một dịch vụ bên ngoài mà không có hàm biến thiên, như gọi lại tới khi máy chủ trả lời. Điều này phụ thuộc thứ ta không kiểm soát, nên người làm nghề thêm bộ đếm, tối đa 5 lần thử. Khi đó V là số lần thử còn lại, giảm 1 mỗi vòng, chạm 0 thì dừng và báo lỗi."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "[h - l for l, h, _ in alg.bin_search([1, 3, 5, 7, 9, 11], 4)[1]] == [6, 3, 1]"
      - "alg.euclid_trace(100, 35) == [(100, 35), (35, 30), (30, 5), (5, 0)]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Tìm kiếm nhị phân bài 0 (<code>while lo &lt; hi</code>, gán <code>lo = mid + 1</code> hoặc <code>hi = mid</code>, với <code>lo ≤ mid &lt; hi</code>): chọn hàm biến thiên nào?</td></tr>
          <tr><td>2</td><td>Ghi dãy <code>b</code> của Euclid với $(100, 35)$.</td></tr></table>
        focus: [0, "1.2", "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, xét tìm kiếm nhị phân ở bài 0, vòng chạy khi lo nhỏ hơn hi. Mỗi vòng gán lo bằng điểm giữa cộng 1, hoặc hi bằng điểm giữa, với điểm giữa nằm từ lo tới trước hi. Nên chọn hàm biến thiên nào? Câu hai, ghi dãy b của thuật toán tìm ước chung lớn nhất với 100 và 35. Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $V = hi - lo$: $\ge 0$ khi còn chạy; <code>lo = mid + 1 &gt; lo</code> hoặc <code>hi = mid &lt; hi</code> → giảm thật sự. Tìm 4 trong <code>[1, 3, 5, 7, 9, 11]</code>: $V$ = 6, 3, 1, rồi 0 thì dừng.</p>
        focus: [1, 1, 1]
        say: "Đáp án câu một, chọn V bằng hi trừ lo. V không âm khi vòng còn chạy, và mỗi vòng hoặc lo tăng hoặc hi giảm, nên V giảm thật sự. Ví dụ tìm 4 thì V đi 6, 3, 1, rồi 0 và dừng."
      - clear: true
        show: |
          <table class="t"><tr><th>a</th><th>b</th><th>a % b</th></tr>
          <tr><td>100</td><td>35</td><td>30</td></tr><tr><td>35</td><td>30</td><td>5</td></tr><tr><td>30</td><td>5</td><td>0</td></tr></table>
          <p>② $b$: 35, 30, 5, 0 → ước chung lớn nhất $= \hl{5}$.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Câu hai, chạy từng vòng. 100 chia 35 dư 30. 35 chia 30 dư 5. 30 chia 5 dư 0. Vậy b đi 35, 30, 5, 0, và ước chung lớn nhất là 5."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đúng (bài 1) + dừng (bài này)</span><span class="a">→</span>
          <span class="n">hàm biến thiên: số nguyên</span><span class="a">→</span>
          <span class="n">bị chặn dưới</span><span class="a">→</span>
          <span class="n">giảm thật sự mỗi vòng</span></div>
        say: "Tổng kết lại, một vòng lặp đúng hoàn toàn khi vừa đúng như bài 1 vừa dừng như bài này. Hàm biến thiên là một số nguyên bị chặn dưới, và giảm thật sự sau mỗi vòng."
      - show: |
          <div class="box key"><b>Tư duy:</b> để chứng minh một quá trình kết thúc, hãy tìm một “đồng hồ đếm ngược” bằng số nguyên mà mỗi bước đều làm nó nhích xuống.</div>
        say: "Điều cần mang theo, để chứng minh một quá trình kết thúc, hãy tìm một đồng hồ đếm ngược bằng số nguyên mà mỗi bước đều làm nó nhích xuống."
      - clear: true
        show: |
