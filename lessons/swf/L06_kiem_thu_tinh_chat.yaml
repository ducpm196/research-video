id: L06
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 6 — Kiểm thử ngẫu nhiên và kiểm thử dựa trên tính chất"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L06; audit/swf/verify_swf.py L06; K. Claessen, J. Hughes, QuickCheck: A Lightweight Tool for Random Testing of Haskell Programs, ICFP 2000; B. P. Miller, L. Fredriksen, B. So, An Empirical Study of the Reliability of UNIX Utilities, CACM 33(12), 1990"
assumes: [arith, power]
# Quy ước: “tính chất” = một khẳng định phải đúng với MỌI đầu vào, viết thành hàm trả đúng/sai. Bài dùng vét cạn mọi danh sách nhỏ
#   (độ dài 0..4, giá trị 0..2: 121 danh sách) thay cho sinh ngẫu nhiên, để mọi con số tái lập được; thứ tự duyệt theo độ dài tăng
#   nên phản ví dụ đầu tiên là phản ví dụ ngắn nhất. Mọi kết quả do alg.find_counterexample trong checks.
objectives:
  - "Viết tính chất thay cho từng ca kiểm"
  - "Phân biệt tính chất mạnh và tính chất yếu"
  - "Tìm phản ví dụ nhỏ nhất"
asr_reviewed:
  - {sentence: "Lỗi thứ hai, dùng chính mã đang kiểm làm trọng tài.", reason: "ASR chép “Lội thứ hai, dùng chín mã đang kiểm làm trọng tay”: lỗi/lội lệch thanh (đã biết ở PLC), chính/chín lệch âm cuối, tài/tay lệch vần; câu 10 từ khớp 0,727 — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ai nghĩ ra ca kiểm thứ một nghìn?"
    steps:
      - show: |
          <p>Bài 4 chọn ca kiểm bằng tay (chia lớp đầu vào, thử ở biên). Nhưng người viết ca kiểm thường nghĩ giống người viết mã — và bỏ sót cùng một chỗ.</p>
          <p>Năm 1990, một nhóm nghiên cứu đưa chuỗi ký tự <b>ngẫu nhiên</b> vào các chương trình tiện ích của UNIX: từ khoảng <b>một phần tư tới một phần ba</b> số chương trình bị sập hoặc treo, tuỳ phiên bản.</p>
          <div class="box key">Hôm nay: để máy sinh rất nhiều ca, và viết <b>tính chất</b> thay vì viết từng đáp án.</div>
        focus: [1, 1, 2, 2, 3]
        say: "Chào bạn, ở bài 4 ta chọn ca kiểm bằng tay, bằng cách chia lớp đầu vào và thử ở biên. Nhưng người viết ca kiểm thường nghĩ giống người viết mã, và bỏ sót cùng một chỗ. Năm 1990, một nhóm nghiên cứu đưa chuỗi ký tự ngẫu nhiên vào các chương trình tiện ích có sẵn trên hệ điều hành. Kết quả là từ khoảng một phần tư tới một phần ba số chương trình bị sập hoặc treo, tuỳ phiên bản. Hôm nay ta để máy sinh rất nhiều ca, và viết tính chất thay vì viết từng đáp án."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: hoán vị, và đếm số danh sách"
    checks:
      - "sorted([2, 0, 2]) == [0, 2, 2] and [2, 0, 2].count(2) == 2 and 3 ** 2 == 9"
      - "[list(v) for v in __import__('itertools').product(range(3), repeat=2)] == [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]]"
    steps:
      - show: |
          <p><b>Hoán vị</b>: hai danh sách là hoán vị của nhau khi có cùng các phần tử, mỗi phần tử <b>cùng số lần</b>, chỉ khác thứ tự.</p>
          <table class="t"><tr><th>hai danh sách</th><th>đếm số lần</th><th>hoán vị?</th></tr>
          <tr><td>[2, 0, 2] và [0, 2, 2]</td><td>số 0: 1 và 1; số 2: 2 và 2</td><td>có</td></tr>
          <tr><td>[0, 0] và [0]</td><td>số 0: 2 và 1</td><td>không</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Trước hết, hai danh sách là hoán vị của nhau khi có cùng các phần tử, mỗi phần tử xuất hiện cùng số lần, chỉ khác thứ tự. Bảng có hai ví dụ. 2, 0, 2 và 0, 2, 2 là hoán vị, vì số 0 xuất hiện một lần và số 2 hai lần ở cả hai bên. 0, 0 và 0 thì không, vì số 0 xuất hiện hai lần bên trái nhưng một lần bên phải."
      - show: |
          <p><b>Đếm danh sách</b> bằng <b>quy tắc nhân</b>: các lựa chọn độc lập thì số tổ hợp bằng tích số cách. Độ dài $n$, mỗi vị trí chọn 1 trong 3 giá trị 0, 1, 2 → $3 \cdot 3 \cdots 3 = 3^n$ danh sách.</p>
          <p>Độ dài 2: $3^2 = 9$ — [0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2].</p>
        introduces: [cdot, dots]
        focus: [1, 1, 2]
        say: "Để đếm danh sách, ta dùng quy tắc nhân, các lựa chọn độc lập thì số tổ hợp bằng tích số cách. Danh sách độ dài n, mỗi vị trí chọn một trong 3 giá trị 0, 1, 2, nên có 3 nhân 3 nhân cứ thế n lần, tức 3 mũ n danh sách. Ví dụ độ dài 2 có 3 mũ 2 bằng 9 danh sách, liệt kê đủ trên màn hình."

  - id: sym
    kind: symbol
    title: "Giải mã: tính chất"
    steps:
      - show: |
          <p>Kiểm thử ngẫu nhiên cần một <b>trọng tài</b>: biết kết quả đúng hay sai mà không cần tính trước đáp án.</p>
          <p><b>Tính chất</b> là trọng tài như vậy. Với hàm sắp xếp <code>sort</code>, ba tính chất:</p>
          <ol><li>kết quả không giảm;</li><li>kết quả là hoán vị của đầu vào (cùng các phần tử, cùng số lần);</li><li><code>sort(sort(x)) = sort(x)</code>.</li></ol>
        focus: [1, 2, "3.1", "3.2", "3.3"]
        say: "Kiểm thử ngẫu nhiên cần một trọng tài, biết kết quả đúng hay sai mà không cần tính trước đáp án. Tính chất chính là trọng tài như vậy, và với hàm sắp xếp ta có ba tính chất. Một, kết quả không giảm. Hai, kết quả là hoán vị của đầu vào, tức cùng các phần tử với cùng số lần xuất hiện. Ba, sắp xếp hai lần cho cùng kết quả với sắp xếp một lần."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Máy sinh ca, trọng tài chấm"
    steps:
      - show: |
          <div><svg width="1500" height="300" viewBox="0 0 1500 300"><defs><marker id="arS6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><g stroke="#eb6834" stroke-width="3"><line x1="290" y1="150" x2="350" y2="150" marker-end="url(#arS6)"/><line x1="620" y1="150" x2="680" y2="150" marker-end="url(#arS6)"/><line x1="950" y1="150" x2="1010" y2="150" marker-end="url(#arS6)"/></g><g font-size="24" text-anchor="middle" fill="#1f2937"><rect x="40" y="90" width="250" height="120" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="165" y="142" font-weight="bold">máy sinh</text><text x="165" y="178" font-size="20">121 danh sách</text><rect x="355" y="90" width="265" height="120" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="487" y="142" font-weight="bold">hàm cần kiểm</text><text x="487" y="178" font-size="20">sort_loi(x)</text><rect x="685" y="90" width="265" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="817" y="142" font-weight="bold">trọng tài</text><text x="817" y="178" font-size="20">tính chất đúng/sai</text><rect x="1015" y="90" width="330" height="120" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1180" y="142" font-weight="bold">phản ví dụ ngắn nhất</text><text x="1180" y="178" font-size="20">[0, 0]</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ cách làm. Máy sinh rất nhiều đầu vào và đưa vào hàm cần kiểm. Trọng tài là tính chất, chấm đúng hay sai mà không cần biết trước đáp án. Hễ có ca sai, ta giữ lại phản ví dụ ngắn nhất, vì danh sách càng ngắn thì càng dễ đọc và dễ tìm chỗ sửa."

  - id: example
    kind: example
    title: "Bắt hàm sắp xếp làm mất phần tử trùng"
    checks:
      - "len([list(v) for n in range(5) for v in __import__('itertools').product(range(3), repeat=n)]) == 121"
      - "alg.find_counterexample(lambda x: sorted(sorted(set(x))) == sorted(x), [list(v) for n in range(5) for v in __import__('itertools').product(range(3), repeat=n)]) == [0, 0]"
      - "alg.find_counterexample(lambda v: sorted(sorted(v)) == sorted(v), __import__('itertools').product(range(3), repeat=4)) is None"
    steps:
      - show: |
          <p><b>Bước 1</b> — một hàm sắp xếp lỗi: <code>sort_loi(x) = sorted(set(x))</code> — bỏ phần tử trùng rồi mới sắp.</p>
        say: "Bước một, xét một hàm sắp xếp lỗi, nó bỏ phần tử trùng rồi mới sắp."
      - show: |
          <table class="t"><tr><th>độ dài</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>cộng</td></tr>
          <tr><th>số danh sách $3^n$</th><td>1</td><td>3</td><td>9</td><td>27</td><td>81</td><td>$\hl{121}$</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước hai, sinh mọi danh sách độ dài từ 0 tới 4 với giá trị 0, 1, 2. Theo quy tắc nhân có 1, 3, 9, 27 và 81 danh sách, cộng lại là 121."
      - clear: true
        show: |
          <table class="t"><tr><th>thứ tự duyệt</th><th>đầu vào</th><th><code>sort_loi</code></th><th>hoán vị?</th></tr>
          <tr><td>1</td><td>[ ]</td><td>[ ]</td><td>✓</td></tr>
          <tr><td>2 tới 4</td><td>[0], [1], [2]</td><td>như cũ</td><td>✓</td></tr>
          <tr><td>5</td><td>[0, 0]</td><td>[0]</td><td class="red">sai</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước ba, cho trọng tài chấm tính chất hoán vị theo thứ tự độ dài tăng. Danh sách rỗng không có gì để mất, nên qua. Ba danh sách một phần tử cũng qua. Danh sách thứ năm là 0, 0, hàm lỗi trả về chỉ một số 0, nên tính chất sai."
      - show: |
          <p><b>Bước 4</b> — duyệt theo độ dài tăng nên $\hl{\texttt{[0, 0]}}$ là phản ví dụ <b>ngắn nhất</b> — dễ đọc, dễ sửa. Hàm <code>sorted</code> thật qua cả ba tính chất trên toàn bộ 81 danh sách độ dài 4.</p>
        say: "Bước bốn, vì duyệt theo độ dài tăng, danh sách 0, 0 là phản ví dụ ngắn nhất, dễ đọc và dễ sửa. Hàm sắp xếp thật thì qua cả ba tính chất trên toàn bộ 81 danh sách độ dài 4."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "(3 ** 5 - 1) // 2 == 121 == len([list(v) for n in range(5) for v in __import__('itertools').product(range(3), repeat=n)])"
      - "3 * (1 + 3 + 9 + 27 + 81) - (1 + 3 + 9 + 27 + 81) == 243 - 1 == 242 and 3 * 81 == 243"
      - "[0, 0].count(0) == 2 and sorted(set([0, 0])).count(0) == 1"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>121 danh sách</td><td>gọi $S = 1 + 3 + 9 + 27 + 81$; $3S = 3 + 9 + 27 + 81 + 243$; lấy $3S - S$, các số giữa triệt tiêu: $2S = 243 - 1 = 242$</td><td>$S = \frac{242}{2} = 121$ ✓</td></tr>
          <tr><td>[0, 0] sai</td><td>đếm số 0: đầu vào 2 lần, kết quả 1 lần</td><td>không phải hoán vị ✓</td></tr></table>
        introduces: [frac]
        focus: [1, "1.2", "1.2", "1.2", "1.3"]
        say: "Kiểm bằng đường khác, không cần cộng từng số. Gọi S là tổng 1 cộng 3 cộng 9 cộng 27 cộng 81, nhân 3 thì được 3 cộng 9 cộng 27 cộng 81 cộng 243. Lấy 3 S trừ S, các số ở giữa triệt tiêu nhau, còn 2 S bằng 243 trừ 1, bằng 242. Vậy S bằng 242 chia 2, đúng 121. Đếm số 0 trong ca 0, 0, đầu vào có 2 lần nhưng kết quả chỉ 1 lần, nên đúng là không phải hoán vị."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.find_counterexample(lambda x: len([0] * len(x)) == len(x), [list(v) for n in range(5) for v in __import__('itertools').product(range(3), repeat=n)]) is None"
      - "alg.find_counterexample(lambda x: sorted([0] * len(x)) == sorted(x), [list(v) for n in range(5) for v in __import__('itertools').product(range(3), repeat=n)]) == [1]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tính chất quá yếu <b class="red">(an toàn giả)</b>
          <br><span class="note">Chỉ kiểm “kết quả cùng độ dài”: hàm trả toàn số 0 <code>[0] * len(x)</code> qua hết 121 ca. Thêm tính chất hoán vị → sai ngay ở <code>[1]</code>.</span></div>
        say: "Lỗi thứ nhất, viết tính chất quá yếu, như chỉ kiểm kết quả có cùng độ dài. Một hàm trả về toàn số 0 với đúng độ dài qua hết 121 ca. Thêm tính chất hoán vị thì sai ngay ở danh sách chỉ có số 1."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng chính mã đang kiểm làm trọng tài <b class="red">(vòng quẩn)</b>
          <br><span class="note">So <code>sort(x)</code> với một bản chép của <code>sort</code> thì lỗi giống nhau, so khớp vẫn đúng. Tính chất phải đến từ đặc tả.</span></div>
        say: "Lỗi thứ hai, dùng chính mã đang kiểm làm trọng tài. So hàm sắp xếp với một bản chép của chính nó thì lỗi giống nhau và so khớp vẫn đúng, nên tính chất phải đến từ đặc tả."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Sinh ngẫu nhiên mà không ghi lại hạt giống <b class="red">(không tái lập)</b>
          <br><span class="note"><b>Hạt giống</b> là con số khởi đầu của bộ sinh ngẫu nhiên: cùng hạt giống thì sinh lại đúng cùng dãy. Không ghi nó, lỗi xuất hiện một lần rồi không chạy lại được. Ghi hạt giống, và giữ phản ví dụ thành ca kiểm cố định.</span></div>
        say: "Lỗi thứ ba, sinh ngẫu nhiên mà không ghi lại hạt giống. Hạt giống là con số khởi đầu của bộ sinh ngẫu nhiên, cùng hạt giống thì máy sinh lại đúng cùng một dãy. Lỗi xuất hiện một lần rồi không chạy lại được, nên hãy ghi hạt giống, và giữ phản ví dụ thành một ca kiểm cố định."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.find_counterexample(lambda x: (lambda rb: rb(rb(x)) == x)(lambda y: y[::-1][:-1] if y else []), [list(v) for n in range(5) for v in __import__('itertools').product(range(3), repeat=n)]) == [0]"
    steps:
      - show: |
          <p>Hàm đảo ngược lỗi: đảo rồi <b>bỏ phần tử cuối</b>. Tính chất: đảo hai lần thì về như cũ.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Duyệt mọi danh sách theo độ dài tăng (giá trị 0, 1, 2): phản ví dụ đầu tiên là gì?</td></tr>
          <tr><td>2</td><td>Viết thêm một tính chất nữa cho hàm đảo ngược.</td></tr></table>
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, với một hàm đảo ngược lỗi, đảo xong lại bỏ phần tử cuối. Tính chất là đảo hai lần thì về như cũ. Câu một, duyệt mọi danh sách theo độ dài tăng, phản ví dụ đầu tiên là gì? Câu hai, viết thêm một tính chất nữa cho hàm đảo ngược. Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>đầu vào</th><th>đảo lỗi lần 1</th><th>đảo lỗi lần 2</th><th>về như cũ?</th></tr>
          <tr><td>[ ]</td><td>[ ]</td><td>[ ]</td><td>✓</td></tr>
          <tr><td>[0]</td><td>[ ]</td><td>[ ]</td><td class="red">sai</td></tr></table>
          <p>① Phản ví dụ đầu tiên: $\hl{\texttt{[0]}}$.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Đáp án câu một, chạy theo thứ tự độ dài tăng. Danh sách rỗng đảo hai lần vẫn rỗng, nên qua. Danh sách chỉ có số 0 bị đảo và bỏ cuối thành rỗng, đảo lần hai vẫn rỗng, khác ban đầu. Vậy phản ví dụ đầu tiên là danh sách chỉ có số 0."
      - show: |
          <p>② Ví dụ: độ dài không đổi; phần tử đầu của kết quả là phần tử cuối của đầu vào. Tính chất độ dài bắt được lỗi này ngay ở <code>[0]</code>.</p>
        say: "Câu hai, chẳng hạn độ dài không đổi, hoặc phần tử đầu của kết quả là phần tử cuối của đầu vào. Tính chất độ dài bắt được lỗi này ngay ở danh sách một phần tử."

