    - '1.4'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>valid_cycle_ok=1</div><div>skip_green_to_red_rejected=1</div><div>final_state=RED</div></div>
