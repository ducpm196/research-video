- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">một biến trạng thái có tên</span><span class="a">→</span>

      <span class="n">một bảng chuyển</span><span class="a">→</span>

      <span class="n">kiểm an toàn bằng cách đọc mọi ô</span><span class="a">→</span>

      <span class="n">sự kiện lạ: trạng thái LỖI</span></div>

      '
    say: Tổng kết lại, dùng một biến trạng thái có tên và một bảng chuyển. Kiểm tính chất an toàn bằng cách đọc mọi ô, và đưa sự kiện lạ về trạng thái lỗi tường minh. Máy trạng thái biến các trạng thái phi lý thành không thể biểu diễn thay vì trông chờ lập trình viên tự nhớ không được gán nhầm. Bảng chuyển trạng thái khép kín giúp mỗi sự kiện lạ không bao giờ đẩy thực thể sang tổ hợp cờ vô lý.
  - show: '<div class="box key"><b>Tư duy:</b> làm cho trạng thái sai <b>không thể biểu diễn</b> được, thay vì cố nhớ để tránh nó.</div>

      '
    say: Điều cần mang theo, hãy làm cho trạng thái sai không thể biểu diễn được, thay vì cố nhớ để tránh nó. Bảng chuyển trạng thái rõ ràng là cầu nối hoàn hảo giữ đặc tả nghiệp vụ và mã nguồn vận hành khớp nhau một đối một.
  - clear: true
    show: '<p class="note">Bài sau (bài 9): <b>đồng thời trong mã</b> — tranh chấp, khoá, bế tắc.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 9, ta học đồng thời trong mã, với tranh chấp, khoá, và bế tắc. Hẹn gặp bạn ở bài tiếp theo. Khi nhiều luồng cùng tác động lên cùng một máy trạng thái, vấn đề tranh chấp thời gian đồng thời đòi hỏi cơ chế đồng bộ chặt chẽ.
