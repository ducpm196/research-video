scenes:
- id: hook
  kind: hook
  title: Ba biến đúng/sai, tám tổ hợp, chỉ ba hợp lệ
  checks:
  - 2 ** 3 == 8 and 8 - 3 == 5
  steps:
  - show: '<div class="code"><div>dang_do = True; dang_xanh = False; dang_vang = False</div></div>

      <p>Ba biến đúng/sai cho $2^3 = 8$ tổ hợp, nhưng đèn chỉ có 3 trạng thái hợp lệ. Năm tổ hợp còn lại — như “vừa đỏ vừa xanh” — là trạng thái <b>không tên</b>, chỉ cần một dòng mã quên tắt cờ là rơi vào.</p>

      <div class="box key">Hôm nay: <b>máy trạng thái hữu hạn</b> — mỗi lúc đúng một trạng thái có tên, chuyển theo một bảng.</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 3
    - 3
    - 3
    say: Chào bạn, điều khiển đèn giao thông bằng ba biến đúng sai, đang đỏ, đang xanh, đang vàng. Ba biến cho 2 mũ 3 bằng 8 tổ hợp, nhưng đèn chỉ có 3 trạng thái hợp lệ. Năm tổ hợp còn lại, như vừa đỏ vừa xanh, là trạng thái không tên, chỉ cần một dòng mã quên tắt cờ là rơi vào. Hôm nay ta học máy trạng thái hữu hạn, mỗi lúc đúng một trạng thái có tên, chuyển theo một bảng. Dùng năm biến cờ đúng sai rời rạc để quản lý một đơn hàng dễ đẻ ra ba mươi hai tổ hợp kỳ dị như vừa huỷ xong lại vẫn đang giao hàng. Máy trạng thái hữu hạn gom toàn bộ vòng đời thực thể vào tập trạng thái hợp lệ tường minh và quy tắc chuyển dịch không thể bẻ cong.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: máy trạng thái nhỏ nhất, công tắc đèn'
  checks:
  - 'alg.fsm_run({(''TẮT'', ''nhấn''): ''BẬT'', (''BẬT'', ''nhấn''): ''TẮT''}, ''TẮT'', [''nhấn'', ''nhấn'', ''nhấn'']) == [''TẮT'', ''BẬT'', ''TẮT'', ''BẬT'']'
  steps:
  - show: '<table class="t"><tr><th>đang ở</th><th>sự kiện “nhấn”</th></tr><tr><td>TẮT</td><td>BẬT</td></tr><tr><td>BẬT</td><td>TẮT</td></tr></table>

      <p>Công tắc đèn có 2 <b>trạng thái</b>; mỗi <b>sự kiện</b> “nhấn” đưa nó sang trạng thái kia. Bắt đầu TẮT, nhấn 3 lần: TẮT → BẬT → TẮT → BẬT.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Trước hết, xét máy trạng thái nhỏ nhất, một công tắc đèn có hai trạng thái, tắt và bật. Mỗi sự kiện nhấn đưa nó sang trạng thái kia, như bảng chỉ ra. Bắt đầu từ tắt, nhấn 3 lần thì đèn đi tắt, bật, tắt, bật. Một máy trạng thái gồm tập hữu hạn trạng thái phân biệt, một trạng thái khởi đầu, bảng các sự kiện kích hoạt và hàm chuyển trạng thái. Tại bất kỳ thời điểm nào, thực thể bắt buộc nằm tại đúng một trạng thái duy nhất thay vì mập mờ giữa nhiều biến cờ rời rạc.
  - show: '<p>Máy như vậy có tên là <b>ôtômat hữu hạn đơn định</b> (ôtômat: máy tự chạy theo luật). <b>Hữu hạn</b>: số trạng thái đếm được hết. <b>Đơn định</b>: mỗi lúc ở <b>đúng một</b> trạng thái, và mỗi cặp (trạng thái, sự kiện) chỉ dẫn tới <b>một</b> trạng thái.</p>

      '
    say: Máy như vậy có tên là ô-tô-mát hữu hạn đơn định, trong đó ô-tô-mát nghĩa là máy tự chạy theo luật. Hữu hạn vì số trạng thái đếm được hết. Đơn định vì mỗi lúc máy ở đúng một trạng thái, và mỗi cặp trạng thái với sự kiện chỉ dẫn tới một trạng thái. Tính định hướng rõ ràng quy định trước mỗi sự kiện tại từng trạng thái hoặc chuyển tới trạng thái đích xác định hoặc bị từ chối rõ ràng. Các ô trống trên bảng chuyển trạng thái thể hiện những thao tác bất hợp pháp cần chặn đứng ngay bằng ngoại lệ rõ nghĩa.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
- id: sym
  kind: symbol
  title: 'Giải mã: bảng chuyển trạng thái'
  steps:
  - show: '<p>Một máy trạng thái hữu hạn gồm ba phần: tập trạng thái, trạng thái đầu, và <b>bảng chuyển</b> (trạng thái, sự kiện) → trạng thái mới.</p>

      <table class="t"><tr><th>trạng thái \ sự kiện</th><th>hết giờ</th><th>bấm nút (người đi bộ)</th></tr>

      <tr><td>XANH</td><td>VÀNG</td><td>VÀNG (rút ngắn đèn xanh)</td></tr>

      <tr><td>VÀNG</td><td>ĐỎ</td><td>VÀNG</td></tr>

      <tr><td>ĐỎ</td><td>XANH</td><td>ĐỎ</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.4'
    - '2.4'
    say: Một máy trạng thái hữu hạn gồm ba phần, là tập trạng thái, trạng thái đầu, và bảng chuyển. Bảng cho biết ở trạng thái nào gặp sự kiện nào thì sang trạng thái nào. Bảng cho đèn có hai sự kiện, hết giờ và người đi bộ bấm nút. Đèn xanh hết giờ hay bị bấm nút đều sang vàng, bấm nút làm rút ngắn đèn xanh. Đèn vàng hết giờ thì sang đỏ. Đèn đỏ hết giờ thì sang xanh. Biểu diễn trực quan dưới dạng đồ thị có hướng hoặc bảng chuyển đổi hai chiều giúp lập trình viên lẫn chuyên viên nghiệp vụ cùng đối chiếu trọn vẹn. Mọi đường mũi tên trên đồ thị chính là đặc tả sống không thể giấu ngầm trong hàng loạt câu điều kiện lồng ghép khó đọc.
- id: intuition
  kind: intuition
  title: Đèn giao thông là ba vòng tròn và các mũi tên
  steps:
  - show: '<div><svg width="1500" height="340" viewBox="0 0 1500 340"><defs><marker id="arS8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><circle cx="300" cy="170" r="70" fill="#bbf7d0" stroke="#1f2937" stroke-width="3"/><text x="300" y="180" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">XANH</text><circle cx="750" cy="170" r="70" fill="#fef08a" stroke="#1f2937" stroke-width="3"/><text x="750" y="180" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">VÀNG</text><circle cx="1200" cy="170" r="70" fill="#fecaca" stroke="#1f2937" stroke-width="3"/><text x="1200" y="180" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">ĐỎ</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="372" y1="170" x2="676" y2="170" marker-end="url(#arS8)"/><line x1="822" y1="170" x2="1126" y2="170" marker-end="url(#arS8)"/><path d="M1170,105 C1050,10 450,10 330,105" marker-end="url(#arS8)"/></g><path d="M330,240 C450,330 1050,330 1170,240" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="12 10"/><g font-size="22" text-anchor="middle" fill="#1f2937"><text x="524" y="155">hết giờ / bấm nút</text><text x="974" y="155">hết giờ</text><text x="750" y="72">hết giờ</text><text x="750" y="275" fill="#b91c1c">không có mũi tên XANH → ĐỎ</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: 'Hình vẽ bảng chuyển dưới dạng sơ đồ, mỗi trạng thái là một vòng tròn, mỗi ô của bảng là một mũi tên. Xanh sang vàng, vàng sang đỏ, đỏ quay về xanh. Đường đỏ đứt nét ở dưới nhắc rằng không hề có mũi tên nào đi thẳng từ xanh sang đỏ. Đèn giao thông là chiếc máy trạng thái mẫu mực: chỉ đi tuần tự xanh sang vàng rồi đỏ và tuyệt đối không nhảy cóc ngược từ đỏ sang vàng. Nếu dùng ba công tắc bật đèn xanh vàng đỏ rời rạc không khoá chéo, chỉ một thao tác sai sẽ làm cả ba bóng cùng sáng gây tai nạn.'
- id: example
  kind: example
  title: Chạy máy và kiểm tính chất an toàn
  checks:
  - alg.fsm_run(alg.TRAFFIC, 'ĐỎ', ['hết giờ', 'bấm nút', 'hết giờ', 'hết giờ']) == ['ĐỎ', 'XANH', 'VÀNG', 'ĐỎ', 'XANH']
  - '[k for k, v in alg.TRAFFIC.items() if k[0] == ''XANH'' and v == ''ĐỎ''] == []'
  steps:
  - show: '<table class="t"><tr><th>bước</th><th>đang ở</th><th>sự kiện</th><th>sang</th></tr>

      <tr><td>1</td><td>ĐỎ</td><td>hết giờ</td><td>XANH</td></tr>

      <tr><td>2</td><td>XANH</td><td>bấm nút</td><td>VÀNG</td></tr>

      <tr><td>3</td><td>VÀNG</td><td>hết giờ</td><td>ĐỎ</td></tr>

      <tr><td>4</td><td>ĐỎ</td><td>hết giờ</td><td>$\hl{\text{XANH}}$</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    say: Bước một, chạy thử từ đỏ, mỗi dòng tra một ô của bảng. Đỏ gặp hết giờ thì sang xanh. Xanh gặp bấm nút thì sang vàng. Vàng gặp hết giờ thì sang đỏ. Đỏ gặp hết giờ lại sang xanh.
  - clear: true
    show: '<p><b>Bước 2 — tính chất an toàn</b>: không bao giờ XANH → ĐỎ trực tiếp. Đọc <b>mọi ô</b> của hàng XANH:</p>

      <table class="t"><tr><th>ô</th><th>sang</th><th>là ĐỎ?</th></tr><tr><td>(XANH, hết giờ)</td><td>VÀNG</td><td>không</td></tr><tr><td>(XANH, bấm nút)</td><td>VÀNG</td><td>không</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    say: Bước hai, kiểm tính chất an toàn, không bao giờ chuyển thẳng từ xanh sang đỏ. Ta đọc mọi ô của hàng xanh trong bảng. Ô xanh gặp hết giờ dẫn tới vàng, không phải đỏ. Ô xanh gặp bấm nút cũng dẫn tới vàng.
  - show: '<div class="box key">Bảng chỉ có 2 ô ở hàng XANH, đọc hết là xong → tính chất đúng với <b>mọi</b> dãy sự kiện, dài bao nhiêu cũng vậy, không cần chạy thử.</div>

      '
    say: Bước ba, vì hàng xanh chỉ có 2 ô và cả hai đều không dẫn tới đỏ, tính chất đúng với mọi dãy sự kiện, dài bao nhiêu cũng vậy, không cần chạy thử.
- id: check
  kind: check
  title: 'Tự kiểm: cho máy chạy mọi dãy ngắn'
  checks:
  - '(lambda runs: len(runs) == 96 and all(not (a == ''XANH'' and b == ''ĐỎ'') for r in runs for a, b in zip(r, r[1:])))([alg.fsm_run(alg.TRAFFIC, s, list(ev)) for s in (''ĐỎ'', ''XANH'', ''VÀNG'') for ev in __import__(''itertools'').product([''hết giờ'', ''bấm nút''], repeat=5)])'
  steps:
  - show: '<table class="t"><tr><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>mọi dãy 5 sự kiện: $2^5 = 32$ dãy, từ cả 3 trạng thái đầu</td><td>96 lần chạy</td></tr>

      <tr><td>số lần thấy XANH ngay trước ĐỎ</td><td>0 ✓ — khớp kết luận đọc bảng</td></tr></table>

      '
    introduces:
    - power
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác, vì đọc bảng cũng có thể đọc sót. Ta cho máy chạy mọi dãy 5 sự kiện, có 2 mũ 5 bằng 32 dãy, xuất phát từ cả 3 trạng thái, tổng cộng 96 lần chạy. Không lần nào thấy xanh đứng ngay trước đỏ, khớp kết luận đọc bảng. Nhưng chạy thử chỉ phủ dãy ngắn, còn đọc bảng thì phủ mọi dãy.
  - show: <table class='t'><tr><th>cách lưu trạng thái</th><th>tổ hợp có thể (3 trạng thái)</th><th>sự kiện lạ không có trong bảng</th></tr><tr><td>3 cờ đúng/sai rời rạc</td><td class='red'>2<sup>3</sup> = 8 tổ hợp (5 vô nghĩa)</td><td class='red'>tự đoán âm thầm hoặc kẹt</td></tr><tr><td>1 biến trạng thái có tên</td><td class='green'>đúng 3 trạng thái hợp lệ</td><td class='green'>chuyển về trạng thái lỗi tường minh (<code>ERROR</code>)</td></tr></table>
    say: Kiểm chứng luôn lợi ích của biến trạng thái tường minh so với dùng nhiều cờ đúng sai. Với 3 trạng thái, ba biến cờ đẻ ra 8 tổ hợp trong đó tới 5 tổ hợp phi lý, còn một biến trạng thái cộng trạng thái lỗi tường minh khoá chặt mọi đường đi.
- id: pitfalls
  kind: pitfall
  title: 4 lỗi người mới hay mắc
  checks:
  - alg.fsm_run(alg.TRAFFIC, 'ĐỎ', ['hết giờ', 'khẩn cấp', 'hết giờ']) == ['ĐỎ', 'XANH', 'LỖI', 'LỖI']
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Không có trạng thái lỗi tường minh <b class="red">(thiếu)</b>

      <br><span class="note">Sự kiện lạ “khẩn cấp” không có trong bảng. Đưa về trạng thái <b>LỖI</b> có tên (ví dụ nhấp nháy vàng), không để chương trình tự đoán: ĐỎ → XANH → LỖI → LỖI.</span></div>

      '
    say: Lỗi thứ nhất, không có trạng thái lỗi tường minh. Sự kiện lạ như khẩn cấp không có trong bảng, nên phải đưa về một trạng thái lỗi có tên, ví dụ nhấp nháy vàng, thay vì để chương trình tự đoán. Sử dụng quá nhiều biến cờ rời rạc đại diện từng pha làm bùng nổ hàng loạt trạng thái rác không bao giờ nên tồn tại trong nghiệp vụ.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng nhiều cờ đúng/sai thay cho một biến trạng thái <b class="red">(rủi ro)</b>

      <br><span class="note">Như mở đầu: 8 tổ hợp, 5 tổ hợp vô nghĩa. Một biến nhận đúng một trong ba giá trị không thể vừa đỏ vừa xanh.</span></div>

      '
    say: Lỗi thứ hai, dùng nhiều cờ đúng sai thay cho một biến trạng thái. Như phần mở đầu, có 8 tổ hợp mà 5 tổ hợp vô nghĩa, còn một biến nhận đúng một trong ba giá trị thì không thể vừa đỏ vừa xanh. Im lặng nuốt sự kiện bất hợp pháp thay vì từ chối tường minh làm sai lệch dấu vết lịch sử đơn hàng hay phiên thanh toán.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Rải logic chuyển trạng thái khắp nơi <b class="red">(khó kiểm)</b>

      <br><span class="note">Mỗi hàm tự đổi trạng thái thì không còn bảng để đọc mọi ô. Giữ <b>một</b> bảng, một hàm chuyển.</span></div>

      '
    say: Lỗi thứ ba, rải logic chuyển trạng thái khắp nơi. Mỗi hàm tự đổi trạng thái thì không còn một bảng để đọc mọi ô, nên hãy giữ một bảng và một hàm chuyển duy nhất. Quên đồng bộ chuyển đổi trạng thái vào giao dịch nguyên tử khi hai yêu cầu đến gần như cùng lúc tạo trạng thái dở dang.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4.</b> Thêm sự kiện mới mà quên điền đủ bảng <b class="red">(ô trống)</b>

      <br><span class="note">Thêm sự kiện “khẩn cấp” thì bảng phải có 3 trạng thái nhân 3 sự kiện = 9 ô, không phải 6. Người làm nghề cho máy kiểm bảng <b>đủ ô</b>, và ô nào cố ý bỏ trống thì dẫn tới LỖI tường minh.</span></div>

      <table class="t"><tr><th>số sự kiện</th><th>số ô cần điền</th></tr><tr><td>2</td><td>3 nhân 2 = 6</td></tr><tr><td>3 (thêm “khẩn cấp”)</td><td>3 nhân 3 = 9</td></tr></table>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Lỗi thứ tư, thêm một sự kiện mới mà quên điền đủ bảng. Thêm sự kiện khẩn cấp thì bảng phải có 3 trạng thái nhân 3 sự kiện, bằng 9 ô, chứ không còn là 6 ô. Người làm nghề cho máy kiểm bảng có đủ ô, và ô nào cố ý bỏ trống thì dẫn tới trạng thái lỗi tường minh. Như vậy một sự kiện lạ không bao giờ đẩy máy vào một trạng thái không tên. Để sót trạng thái kết thúc nhưng không chặn thao tác quay lui làm chứng từ đã quyết toán bị mở sửa trái phép.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.fsm_run(alg.TRAFFIC, 'XANH', ['bấm nút', 'hết giờ', 'bấm nút']) == ['XANH', 'VÀNG', 'ĐỎ', 'ĐỎ']
  - 2 ** 4 == 16 and 16 - 4 == 12
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Bắt đầu XANH, sự kiện: bấm nút, hết giờ, bấm nút. Đèn đi qua những trạng thái nào?</td></tr>

      <tr><td>2</td><td>Máy có 4 trạng thái, cài bằng 4 cờ đúng/sai: bao nhiêu tổ hợp không hợp lệ?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, bắt đầu từ xanh, với các sự kiện bấm nút, hết giờ, bấm nút, đèn đi qua những trạng thái nào? Câu hai, một máy có 4 trạng thái được cài bằng 4 cờ đúng sai, có bao nhiêu tổ hợp không hợp lệ? Dừng video và làm ra giấy. Chuyển từ tư duy biến cờ rẽ nhánh sang bảng chuyển trạng thái tường minh định nghĩa trước mọi cặp trạng thái và sự kiện.
    pause: 15
  - show: '<table class="t"><tr><th>đang ở</th><th>sự kiện</th><th>sang</th></tr>

      <tr><td>XANH</td><td>bấm nút</td><td>VÀNG</td></tr><tr><td>VÀNG</td><td>hết giờ</td><td>ĐỎ</td></tr><tr><td>ĐỎ</td><td>bấm nút</td><td>$\hl{\text{ĐỎ}}$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Đáp án câu một, tra từng ô. Xanh gặp bấm nút sang vàng. Vàng gặp hết giờ sang đỏ. Đỏ gặp bấm nút vẫn là đỏ, vì bấm nút khi đèn đỏ không đổi gì.
  - show: '<p>② 4 cờ cho $2^4 = 16$ tổ hợp; hợp lệ chỉ 4 (đúng một cờ bật) → $16 - 4 = \hl{12}$ tổ hợp không hợp lệ.</p>

      '
    say: Câu hai, 4 cờ cho 2 mũ 4 bằng 16 tổ hợp, nhưng chỉ 4 tổ hợp có đúng một cờ bật là hợp lệ. Vậy có 16 trừ 4, bằng 12 tổ hợp không hợp lệ.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/SWF/L08
  steps:
  - show: <table class='t'><tr><th>Thực hành SWF:L08</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Dùng trạng thái lỗi tường minh thay cho cờ rời rạc</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>start=RED seq=GREEN,YELLOW,RED bad_from=GREEN bad_to=RED</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh SWF L08 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 8 cài đặt máy trạng thái hữu hạn cho đèn giao thông từ bảng chuyển hợp lệ. Dựa trên nền tảng đọc luồng chuẩn từ khoá Python cơ bản, bạn dùng sys chấm stdin chấm read để tách các cặp khoá giá trị. Đầu vào gồm trạng thái bắt đầu, chuỗi trạng thái đi qua, và một cặp trạng thái thử nhảy tắt. Bạn khai báo bảng chuyển cho phép đúng chu trình đỏ sang xanh, xanh sang vàng, vàng về đỏ, rồi kiểm tra cả chuỗi hợp lệ lẫn cặp nhảy tắt bị chặn.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <table class='t'><tr><th>Gợi ý triển khai SWF:L08</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (bảng chuyển)</b></td><td>Khai báo tập trạng thái kế tiếp hợp lệ cho từng trạng thái hiện tại</td></tr><tr><td><b>Bước 2 (chạy chuỗi)</b></td><td>Duyệt từng bước chuyển tiếp và dừng báo sai ngay khi gặp cạnh cấm</td></tr><tr><td><b>Bước 3 (thử nhảy tắt)</b></td><td>Kiểm tra cặp chuyển trực tiếp bị cấm có nằm ngoài bảng hay không</td></tr><tr><td><b>Khung đọc stdin</b></td><td>Khai báo từ điển <code>nxt = {'RED':'GREEN','GREEN':'YELLOW','YELLOW':'RED'}</code></td></tr></table>
    say: 'Gợi ý cài đặt bài số 8 gồm ba bước rành mạch. Bước một, đọc các tham số từ luồng chuẩn và khai báo ánh xạ trạng thái kế tiếp hợp lệ duy nhất cho ba màu đèn. Bước hai, duyệt lần lượt từng trạng thái trong chuỗi đầu vào: nếu khớp trạng thái kế tiếp hợp lệ thì chuyển tiếp, ngược lại đánh dấu vi phạm. Bước ba, kiểm tra cặp nhảy tắt từ xanh sang đỏ bị từ chối và in đủ ba dòng theo đúng khuôn mẫu.'
