id: L00
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 0 — Đặc tả: tiền điều kiện và hậu điều kiện"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L00; audit/swf/verify_swf.py L00; C. A. R. Hoare, An Axiomatic Basis for Computer Programming, CACM 12(10), 1969; B. Meyer, Applying “Design by Contract”, IEEE Computer 25(10), 1992"
assumes: [arith]
# Quy ước: mảng đánh số từ 0, viết a[i] trong <code>; “−1” nghĩa là không tìm thấy. Tìm kiếm nhị phân trên khoảng nửa mở [lo, hi)
#   như alg.bin_search; mọi vết (lo, hi, mid) và kết quả do alg.bin_search trong checks. Đặc tả viết bằng lời trong khung, không dùng
#   ký hiệu logic hình thức (∀, ⇒) để người mới đọc được.
objectives:
  - "Viết tiền điều kiện và hậu điều kiện cho một hàm"
  - "Biết ai chịu trách nhiệm khi tiền điều kiện sai"
  - "Dùng đặc tả để quyết định một kết quả là đúng hay sai"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hàm tìm kiếm trả −1 dù số có trong mảng"
    checks:
      - "alg.bin_search([5, 8, 2], 2)[0] == -1"
    steps:
      - show: |
          <p>Gọi hàm tìm kiếm nhị phân tìm số 2 trong mảng <code>[5, 8, 2]</code>: hàm trả <code>−1</code> (“không có”). Số 2 rõ ràng có ở vị trí 2. Hàm sai, hay người gọi sai?</p>
          <div class="box key">Hôm nay: <b>đặc tả</b> — một hợp đồng giữa hàm và người gọi: <b>tiền điều kiện</b> và <b>hậu điều kiện</b>. Không có đặc tả thì không ai nói được thế nào là “đúng”.</div>
        focus: [1, 1, 1, 2, 2]
        say: "Chào bạn, gọi hàm tìm kiếm nhị phân tìm số 2 trong mảng 5, 8, 2. Hàm trả về âm 1, nghĩa là không có. Số 2 rõ ràng có ở vị trí 2, vậy hàm sai hay người gọi sai? Hôm nay ta học đặc tả, một hợp đồng giữa hàm và người gọi, gồm tiền điều kiện và hậu điều kiện. Không có đặc tả thì không ai nói được thế nào là đúng."

  - id: prereq
    kind: prereq
    title: "Chuẩn bị: mảng, vị trí, và ý tưởng chia đôi"
    checks:
      - "[2, 5, 8, 12, 16, 23, 38][5] == 23 and 2 ** 20 == 1048576"
    steps:
      - show: |
          <table class="t"><tr><th>vị trí</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr>
          <tr><th>giá trị</th><td>2</td><td>5</td><td>8</td><td>12</td><td>16</td><td>23</td><td>38</td></tr></table>
          <p><b>Mảng</b> là dãy giá trị xếp hàng; vị trí đánh số <b>từ 0</b>. Viết <code>a[5]</code> nghĩa là giá trị ở vị trí 5, ở đây là 23. Mảng này <b>sắp tăng dần</b>: mỗi số không nhỏ hơn số đứng trước.</p>
        focus: [1, 2, 2, 2]
        say: "Trước hết, ôn hai ý nền. Mảng là một dãy giá trị xếp hàng, và vị trí được đánh số từ 0. Viết a mở ngoặc vuông 5 nghĩa là giá trị ở vị trí 5, ở đây là 23. Mảng này sắp tăng dần, nghĩa là mỗi số không nhỏ hơn số đứng trước nó."
      - show: |
          <p><b>Tìm kiếm nhị phân</b>: nhìn số ở giữa; nếu nhỏ hơn số cần tìm thì bỏ nửa trái, nếu lớn hơn thì bỏ nửa phải. Mỗi lần nhìn, vùng còn lại giảm một nửa.</p>
          <table class="t"><tr><th>số phần tử</th><th>số lần chia đôi tới khi còn 1</th></tr>
          <tr><td>8</td><td>3</td></tr><tr><td>1 048 576 (khoảng một triệu)</td><td>20</td></tr></table>
        focus: [1, 1, "2.2", "2.3"]
        say: "Tìm kiếm nhị phân nhìn số ở giữa, nếu số đó nhỏ hơn số cần tìm thì bỏ nửa trái, nếu lớn hơn thì bỏ nửa phải. Mỗi lần nhìn, vùng còn lại giảm một nửa. Bảng cho thấy 8 phần tử chỉ cần 3 lần chia đôi. Khoảng một triệu phần tử chỉ cần 20 lần, vì 2 mũ 20 bằng 1 triệu 48 nghìn 576."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: sym
    kind: symbol
    title: "Giải mã: hợp đồng hai phía"
    steps:
      - show: |
          <p><b>Tiền điều kiện</b>: điều <b>người gọi</b> phải bảo đảm trước khi gọi.</p>
          <p><b>Hậu điều kiện</b>: điều <b>hàm</b> hứa sẽ đúng khi trả về — <b>nếu</b> tiền điều kiện đã đúng.</p>
          <div class="box key">Tiền điều kiện sai → hàm được làm bất cứ gì; lỗi thuộc về người gọi. Tiền điều kiện đúng mà hậu điều kiện sai → lỗi thuộc về hàm.</div>
        focus: [1, 2, 3, 3]
        say: "Tiền điều kiện là điều người gọi phải bảo đảm trước khi gọi. Hậu điều kiện là điều hàm hứa sẽ đúng khi trả về, với điều kiện tiền điều kiện đã đúng. Nếu tiền điều kiện sai, hàm được phép làm bất cứ gì, và lỗi thuộc về người gọi. Nếu tiền điều kiện đúng mà hậu điều kiện sai, lỗi thuộc về hàm."

  - id: intuition
    kind: intuition
    title: "Hợp đồng có hai cổng"
    steps:
      - show: |
          <div><svg width="1500" height="300" viewBox="0 0 1500 300"><defs><marker id="arS0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
          <g stroke="#eb6834" stroke-width="3"><line x1="270" y1="150" x2="380" y2="150" marker-end="url(#arS0)"/><line x1="660" y1="150" x2="770" y2="150" marker-end="url(#arS0)"/><line x1="1000" y1="150" x2="1110" y2="150" marker-end="url(#arS0)"/></g>
          <g font-size="25" text-anchor="middle" fill="#1f2937">
          <rect x="40" y="100" width="230" height="100" rx="10" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="155" y="158">người gọi</text>
          <rect x="385" y="70" width="275" height="160" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="522" y="125" font-weight="bold">cổng vào</text><text x="522" y="165" font-size="22">tiền điều kiện</text><text x="522" y="198" font-size="20">người gọi lo</text>
          <rect x="775" y="100" width="225" height="100" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="887" y="158">hàm chạy</text>
          <rect x="1115" y="70" width="290" height="160" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1260" y="125" font-weight="bold">cổng ra</text><text x="1260" y="165" font-size="22">hậu điều kiện</text><text x="1260" y="198" font-size="20">hàm lo</text></g>
          </svg></div>
        focus: [1, 1, 1]
        say: "Hình dung hợp đồng như hai cổng. Cổng vào màu vàng là tiền điều kiện, người gọi phải lo cho nó đúng trước khi đưa dữ liệu vào. Cổng ra màu xanh là hậu điều kiện, hàm phải lo cho nó đúng khi trả kết quả."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: example
    kind: example
    title: "Đặc tả của tìm kiếm nhị phân"
    checks:
      - "alg.bin_search([2, 5, 8, 12, 16, 23, 38], 23) == (5, [(0, 7, 3), (4, 7, 5)])"
      - "alg.bin_search([2, 5, 8, 12, 16, 23, 38], 7)[0] == -1"
      - "len(alg.bin_search(list(range(10 ** 6)), -1)[1]) == 20"
    steps:
      - show: |
          <div class="box"><b>tim(a, x)</b><br>
          <b>Tiền điều kiện:</b> mảng <code>a</code> sắp tăng dần.<br>
          <b>Hậu điều kiện:</b> trả <code>i</code> với <code>a[i] = x</code>; nếu <code>x</code> không có trong <code>a</code> thì trả <code>−1</code>.</div>
        focus: [1, "1.2", "1.3"]
        say: "Bước một, viết đặc tả cho hàm tìm kiếm trong mảng. Tiền điều kiện là mảng a đã sắp tăng dần. Hậu điều kiện là hàm trả về vị trí i có a i bằng x, còn nếu x không có trong mảng thì trả âm 1."
      - show: |
          <p><b>Bước 2</b> — tìm 23 trong <code>[2, 5, 8, 12, 16, 23, 38]</code>:</p>
          <table class="t"><tr><th>lần</th><th>vùng [lo, hi)</th><th>giữa</th><th>a[giữa]</th><th>quyết định</th></tr>
          <tr><td>1</td><td>[0, 7)</td><td>3</td><td>12</td><td>12 &lt; 23 → bỏ nửa trái, lo = 4</td></tr>
          <tr><td>2</td><td>[4, 7)</td><td>5</td><td>23</td><td>bằng → trả $\hl{5}$</td></tr></table>
        focus: [1, 2, "2.2", "2.3"]
        say: "Bước hai, tìm 23 trong mảng bảy số. Bảng ghi từng lần nhìn. Lần một, vùng từ 0 tới 7, vị trí giữa là 3 có giá trị 12, nhỏ hơn 23 nên bỏ nửa trái. Lần hai, vùng từ 4 tới 7, vị trí giữa là 5 có đúng 23, nên trả về 5."
      - show: |
          <p><b>Bước 3</b> — tìm 7: nhìn vị trí 3 (12), rồi 1 (5), rồi 2 (8); vùng rỗng → trả $\hl{-1}$. Cả 5 và −1 đều đúng hậu điều kiện.</p>
        say: "Bước ba, tìm 7, hàm nhìn vị trí 3 có 12, rồi vị trí 1 có 5, rồi vị trí 2 có 8. Vùng còn lại rỗng nên trả âm 1, và cả hai kết quả đều đúng hậu điều kiện."
      - clear: true
        show: |
          <div><svg width="1500" height="260" viewBox="0 0 1500 260"><g font-size="30" text-anchor="middle" fill="#1f2937"><rect x="560" y="90" width="120" height="90" rx="8" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="620" y="148">5</text><text x="620" y="215" font-size="21">vị trí 0</text><rect x="690" y="90" width="120" height="90" rx="8" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="750" y="148">8</text><text x="750" y="215" font-size="21">vị trí 1</text><rect x="820" y="90" width="120" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="880" y="148">2</text><text x="880" y="215" font-size="21">vị trí 2</text><text x="620" y="60" font-size="22" fill="#eb6834">nhìn lần 2</text><text x="750" y="60" font-size="22" fill="#eb6834">nhìn lần 1</text><text x="960" y="148" font-size="22" fill="#b91c1c" text-anchor="start">không bao giờ nhìn tới</text></g></svg></div>
          <p><b>Bước 4</b> — câu đố mở đầu: <code>[5, 8, 2]</code> <b>không</b> sắp tăng → tiền điều kiện sai → kết quả <code>−1</code> không vi phạm hợp đồng. Lỗi của <b>người gọi</b>.</p>
        focus: [1, 1, 2]
        say: "Bước bốn, quay lại câu đố mở đầu. Với mảng 5, 8, 2, hàm nhìn vị trí 1 có 8, lớn hơn 2 nên bỏ nửa phải, rồi nhìn vị trí 0, và không bao giờ nhìn tới vị trí 2. Mảng không sắp tăng, tiền điều kiện sai, nên kết quả âm 1 không vi phạm hợp đồng, lỗi thuộc về người gọi."
      - show: |
          <div class="box key">Hàm có thể tự kiểm tiền điều kiện (tốn thêm thời gian: với một triệu phần tử, kiểm sắp xếp mất cỡ một triệu bước, còn tìm chỉ mất khoảng 20 bước), hoặc không kiểm — nhưng phải <b>ghi rõ</b> ai chịu trách nhiệm.</div>
        say: "Hàm có thể tự kiểm tiền điều kiện, nhưng tốn thêm thời gian, với một triệu phần tử, kiểm sắp xếp mất cỡ một triệu bước, trong khi tìm chỉ mất khoảng 20 bước. Hàm cũng có thể không kiểm, nhưng phải ghi rõ ai chịu trách nhiệm."

  - id: check
    kind: check
    title: "Tự kiểm: so với cách dò từng ô"
    checks:
      - "[2, 5, 8, 12, 16, 23, 38].index(23) == alg.bin_search([2, 5, 8, 12, 16, 23, 38], 23)[0] == 5"
      - "7 not in [2, 5, 8, 12, 16, 23, 38] and [5, 8, 2].index(2) == 2 and [m for _, _, m in alg.bin_search([5, 8, 2], 2)[1]] == [1, 0]"
    steps:
      - show: |
          <table class="t"><tr><th>câu hỏi</th><th>dò từng ô từ trái sang</th><th>tìm nhị phân</th><th>khớp?</th></tr>
          <tr><td>23 ở đâu?</td><td>vị trí 5</td><td>5</td><td>✓</td></tr>
          <tr><td>7 có không?</td><td>không có</td><td>−1</td><td>✓</td></tr>
          <tr><td>2 trong [5, 8, 2]</td><td>vị trí 2</td><td>−1 (chỉ nhìn vị trí 1 và 0)</td><td>lệch — vì tiền điều kiện sai</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng một đường khác, dò từng ô từ trái sang, chậm nhưng chắc chắn đúng. Dò ra 23 ở vị trí 5, khớp tìm nhị phân. Dò ra 7 không có, cũng khớp. Chỉ trường hợp mảng 5, 8, 2 là lệch, vì tiền điều kiện sai, nên hai cách mới cho kết quả khác nhau."

  # ───────────────────────── 4. LỖI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    checks:
      - "alg.bin_search([], 3)[0] == -1"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Hậu điều kiện quá yếu <b class="red">(vô dụng)</b>
          <br><span class="note">“Trả về một số nguyên” — hàm luôn trả 0 cũng thoả. Hậu điều kiện phải nói đủ để phân biệt kết quả đúng với sai.</span></div>
        say: "Lỗi thứ nhất, viết hậu điều kiện quá yếu, chẳng hạn chỉ nói hàm trả về một số nguyên. Một hàm luôn trả 0 cũng thoả, nên hậu điều kiện phải nói đủ để phân biệt kết quả đúng với kết quả sai."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quên trường hợp rỗng, trường hợp không tìm thấy <b class="red">(thiếu)</b>
          <br><span class="note">Mảng rỗng là mảng sắp tăng hợp lệ. Đặc tả phải nói hàm trả gì: ở đây <code>−1</code>.</span></div>
        say: "Lỗi thứ hai, quên trường hợp rỗng hay trường hợp không tìm thấy. Mảng rỗng là một mảng sắp tăng hợp lệ, nên đặc tả phải nói hàm trả gì, ở đây là âm 1."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đặc tả nằm trong đầu người viết <b class="red">(rủi ro)</b>
          <br><span class="note">Người gọi không đọc được ý nghĩ. Ghi tiền, hậu điều kiện ngay ở đầu hàm; nếu ngôn ngữ cho phép, kiểm bằng lệnh khẳng định khi chạy thử.</span></div>
        say: "Lỗi thứ ba, để đặc tả nằm trong đầu người viết. Người gọi không đọc được ý nghĩ, nên hãy ghi tiền điều kiện và hậu điều kiện ngay ở đầu hàm, và nếu ngôn ngữ cho phép, kiểm chúng bằng lệnh khẳng định khi chạy thử."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.bin_search([1, 3, 5, 7, 9, 11], 9)[0] == 4 and alg.bin_search([1, 3, 5, 7, 9, 11], 4)[0] == -1"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Viết tiền và hậu điều kiện cho hàm <code>can_bac_hai(x)</code> trả căn bậc hai của số thực.</td></tr>
          <tr><td>2</td><td>Với <code>a = [1, 3, 5, 7, 9, 11]</code>, <code>tim(a, 9)</code> và <code>tim(a, 4)</code> phải trả gì theo đặc tả?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, viết tiền điều kiện và hậu điều kiện cho hàm tính căn bậc hai của một số thực. Câu hai, với mảng 1, 3, 5, 7, 9, 11, tìm 9 và tìm 4 phải trả gì theo đặc tả? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <div class="box"><b>can_bac_hai(x)</b><br><b>Tiền điều kiện:</b> <code>x ≥ 0</code> (người gọi lo).<br><b>Hậu điều kiện:</b> trả <code>r ≥ 0</code> với <code>r*r</code> gần <code>x</code> trong sai số cho phép.</div>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án câu một, đặc tả có hai phần. Tiền điều kiện là x không âm, và người gọi phải lo điều này. Hậu điều kiện là trả về r không âm, với r nhân r gần bằng x trong sai số cho phép."
      - show: |
          <p>② <code>tim(a, 9)</code>: nhìn vị trí 3 (7), 5 (11), 4 (9) → $\hl{4}$. <code>tim(a, 4)</code>: nhìn vị trí 3 (7), 1 (3), 2 (5) → $\hl{-1}$.</p>
        say: "Câu hai, tìm 9 thì hàm nhìn vị trí 3 có 7, vị trí 5 có 11, rồi vị trí 4 có 9, trả về 4. Tìm 4 thì nhìn vị trí 3, 1 rồi 2, không thấy, trả về âm 1."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
