id: L10
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 10 — Đo hiệu năng thực nghiệm có thống kê"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L10; audit/swf/verify_swf.py L10; T. Kalibera, R. Jones, Rigorous Benchmarking in Reasonable Time, ISMM 2013; A. Georges, D. Buytaert, L. Eeckhout, Statistically Rigorous Java Performance Evaluation, OOPSLA 2007; CS115 bài 44 (khoảng tin cậy, ghép cặp)"
assumes: [arith, frac, sqrt, pm, approx, sub, sum, cdot]
# Quy ước: số liệu là mô phỏng TÁI LẬP ĐƯỢC (alg.perf_data, hạt giống 7): 30 bộ dữ liệu cỡ khác nhau, đo A và B trên cùng bộ. Khoảng 95%:
#   trung bình ± hệ số · sai số chuẩn như CS115 bài 44; với 30 cặp dùng hệ số Student 2,045 (29 bậc tự do, kiểm bằng sympy trong
#   audit/swf/verify_swf.py) thay cho 1,96. Ghép cặp = alg.paired_ci; không ghép = alg.unpaired_ci. Số in làm tròn 2 chữ số.
objectives:
  - "Biết vì sao một lần đo không đủ"
  - "So sánh hai cách bằng hiệu ghép cặp và khoảng tin cậy"
  - "Tránh các bẫy đo: khởi động, môi trường, chọn số liệu"
asr_reviewed:
  - {sentence: "Khoảng 95 phần trăm là d ngang cộng trừ 2 phẩy 045 nhân sai số chuẩn, với n bằng 30.", reason: "ASR chép “Khoảng 95% là gian ngang cộng trừ 2,045 nhân sai số chuẩn với n bằng 30”: tên chữ cái d (“đê”) nghe thành “gian”; 2,045 chép đúng giá trị (cột khác biệt đọc lại thành chữ “nghìn không trăm” là do chuẩn hoá số của bộ so) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Với bộ thứ i, gọi d i là thời gian của A trừ thời gian của B, dương nghĩa là B nhanh hơn.", reason: "ASR chép “Với bộ thứ Y, gọi dY là thời gian của A trừ thời gian của B”: “d i” đọc liền được ASR viết “dY”, i đọc tên chữ cái “i” viết thành “Y”; ký hiệu dᵢ hiện trên màn hình — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lần đo đầu: 310 ms, các lần sau: 142 ms"
    checks:
      - "sum([310, 142, 141, 143, 140]) / 5 == 175.2 and sum([142, 141, 143, 140]) / 4 == 141.5"
    steps:
      - show: |
          <p>Chạy cùng một hàm năm lần: 310, 142, 141, 143, 140 ms. Lần đầu chậm gấp đôi vì bộ nhớ đệm còn lạnh, hoặc mã đang được biên dịch khi chạy. Trung bình cả năm: 175,2; bỏ lần đầu: 141,5.</p>
          <div class="box key">Hôm nay: đo hiệu năng sao cho kết luận “B nhanh hơn A” là <b>đáng tin</b> — nhiều lần đo, ghép cặp, khoảng tin cậy (như CS115).</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, chạy cùng một hàm năm lần được 310, 142, 141, 143, 140 mi li giây. Lần đầu chậm gấp đôi vì bộ nhớ đệm còn lạnh, hoặc vì mã đang được biên dịch ngay khi chạy. Trung bình cả năm lần là 175 phẩy 2, bỏ lần đầu thì còn 141 phẩy 5. Hôm nay ta học cách đo hiệu năng sao cho kết luận B nhanh hơn A là đáng tin, với nhiều lần đo, ghép cặp, và khoảng tin cậy như khoá Toán cho khoa học máy tính."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: trung bình, độ lệch chuẩn, sai số chuẩn"
    checks:
      - "__import__('statistics').mean([2, 4, 6]) == 4 and __import__('statistics').stdev([2, 4, 6]) == 2.0 and round(2 / math.sqrt(4), 1) == 1.0"
    steps:
      - show: |
          <table class="t"><tr><th>đại lượng</th><th>ví dụ với 2, 4, 6</th><th>nghĩa</th></tr>
          <tr><td>trung bình</td><td>$\frac{2 + 4 + 6}{3} = 4$</td><td>giá trị điển hình</td></tr>
          <tr><td>độ lệch chuẩn $s$</td><td>$\sqrt{\frac{(2-4)^2 + 0 + (6-4)^2}{3 - 1}} = 2$</td><td>các số tản ra quanh trung bình bao xa</td></tr></table>
        introduces: [power]
        focus: [1, "1.2", "1.3"]
        say: "Ở khoá Toán cho khoa học máy tính, ta đã học hai đại lượng. Trung bình của 2, 4, 6 là 12 chia 3, bằng 4, giá trị điển hình. Độ lệch chuẩn đo các số tản ra quanh trung bình bao xa, ở đây bằng căn của 4 cộng 0 cộng 4, chia 2, tức bằng 2."
      - show: |
          <p><b>Sai số chuẩn</b> của trung bình $= \frac{s}{\sqrt{n}}$: càng nhiều lần đo, trung bình càng ít dao động. Khoảng tin cậy 95% $\approx$ trung bình $\pm 1{,}96 \cdot$ sai số chuẩn.</p>
        say: "Sai số chuẩn của trung bình bằng độ lệch chuẩn chia căn n, nên càng nhiều lần đo thì trung bình càng ít dao động. Khoảng tin cậy 95 phần trăm xấp xỉ trung bình cộng trừ 1 phẩy 96 lần sai số chuẩn."

  - id: sym
    kind: symbol
    title: "Giải mã: hiệu ghép cặp"
    steps:
      - show: |
          <p>Đo A và B trên <b>cùng</b> $n$ bộ dữ liệu. Với bộ thứ $i$: $d_i = A_i - B_i$ (dương là B nhanh hơn).</p>
          <p>$\bar{d} = \dfrac{1}{n}\sum d_i$, sai số chuẩn $\dfrac{s_d}{\sqrt{n}}$ ($s_d$: độ lệch chuẩn của các $d_i$). Khoảng 95%: $\bar{d} \pm 2{,}045 \cdot \dfrac{s_d}{\sqrt{n}}$ với $n = 30$.</p>
          <p class="note">2,045 là hệ số Student cho 30 cặp, hơi lớn hơn 1,96 ở CS115 vì độ lệch chuẩn cũng được ước lượng từ mẫu.</p>
        introduces: [bar]
        focus: [1, 1, 2, 2, 3]
        say: "Đo A và B trên cùng n bộ dữ liệu. Với bộ thứ i, gọi d i là thời gian của A trừ thời gian của B, dương nghĩa là B nhanh hơn. Trung bình d ngang là tổng các d i chia n, sai số chuẩn là độ lệch chuẩn của các d i chia căn n. Khoảng 95 phần trăm là d ngang cộng trừ 2 phẩy 045 nhân sai số chuẩn, với n bằng 30. Hệ số 2 phẩy 045 hơi lớn hơn 1 phẩy 96 đã học, vì độ lệch chuẩn cũng được ước lượng từ mẫu."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Các bộ chênh nhau nhiều, mỗi cặp chênh rất ít"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><line x1="190" y1="305" x2="1340" y2="305" stroke="#6b7280" stroke-width="2"/><g fill="#1f2937"><line x1="230" y1="133" x2="280" y2="150" stroke="#6b7280" stroke-width="3"/><circle cx="230" cy="133" r="11" fill="#2a78d6"/><circle cx="280" cy="150" r="11" fill="#eb6834"/><text x="255" y="330" text-anchor="middle" font-size="20">bộ 1</text><line x1="420" y1="267" x2="470" y2="277" stroke="#6b7280" stroke-width="3"/><circle cx="420" cy="267" r="11" fill="#2a78d6"/><circle cx="470" cy="277" r="11" fill="#eb6834"/><text x="445" y="330" text-anchor="middle" font-size="20">bộ 2</text><line x1="610" y1="272" x2="660" y2="283" stroke="#6b7280" stroke-width="3"/><circle cx="610" cy="272" r="11" fill="#2a78d6"/><circle cx="660" cy="283" r="11" fill="#eb6834"/><text x="635" y="330" text-anchor="middle" font-size="20">bộ 3</text><line x1="800" y1="79" x2="850" y2="101" stroke="#6b7280" stroke-width="3"/><circle cx="800" cy="79" r="11" fill="#2a78d6"/><circle cx="850" cy="101" r="11" fill="#eb6834"/><text x="825" y="330" text-anchor="middle" font-size="20">bộ 4</text><line x1="990" y1="85" x2="1040" y2="108" stroke="#6b7280" stroke-width="3"/><circle cx="990" cy="85" r="11" fill="#2a78d6"/><circle cx="1040" cy="108" r="11" fill="#eb6834"/><text x="1015" y="330" text-anchor="middle" font-size="20">bộ 5</text><line x1="1180" y1="194" x2="1230" y2="210" stroke="#6b7280" stroke-width="3"/><circle cx="1180" cy="194" r="11" fill="#2a78d6"/><circle cx="1230" cy="210" r="11" fill="#eb6834"/><text x="1205" y="330" text-anchor="middle" font-size="20">bộ 6</text><text x="20" y="80" font-size="22">thời gian, ms</text><text x="20" y="115" font-size="20">88 tới 141</text><circle cx="1360" cy="90" r="11" fill="#2a78d6"/><text x="1380" y="98" font-size="22">A</text><circle cx="1360" cy="130" r="11" fill="#eb6834"/><text x="1380" y="138" font-size="22">B</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ 6 bộ dữ liệu đầu, chấm xanh là A, chấm cam là B. Từ bộ này sang bộ khác, thời gian lên xuống rất nhiều vì cỡ dữ liệu khác nhau. Nhưng trong mỗi cặp, B luôn thấp hơn A một chút, và ghép cặp chính là nhìn vào đoạn nối nhỏ đó."

  - id: example
    kind: example
    title: "Ghép cặp và không ghép cặp"
    checks:
      - "(lambda A, B: (min(A), max(A)) == (82.7, 203.9))(*alg.perf_data())"
      - "(lambda r: (round(r[0], 2), round(r[2], 2), round(r[3], 2)) == (4.99, 3.99, 5.99))(alg.paired_ci(*alg.perf_data(), z=2.045))"
      - "(lambda r: (round(r[2], 1), round(r[3], 1)) == (-16.5, 26.5))(alg.unpaired_ci(*alg.perf_data(), z=2.045))"
    steps:
      - show: |
          <p><b>Bước 1</b> — 30 bộ dữ liệu, thời gian của A từ 82,7 tới 203,9 ms — cỡ dữ liệu làm thời gian dao động rất mạnh. Hiệu trung bình A − B $= 4{,}99$ ms.</p>
        say: "Bước một, ta có 30 bộ dữ liệu, thời gian của A đi từ 82 phẩy 7 tới 203 phẩy 9 mi li giây, nghĩa là cỡ dữ liệu làm thời gian dao động rất mạnh. Hiệu trung bình của A trừ B là 4 phẩy 99 mi li giây."
      - show: |
          <table class="t"><tr><th>cách phân tích</th><th>hiệu trung bình</th><th>khoảng 95%</th><th>kết luận</th></tr>
          <tr><td>không ghép cặp (hai nhóm)</td><td>4,99 ms</td><td>[−16,5; 26,5]</td><td>chứa 0: chưa nói được gì</td></tr></table>
          <p><b>Bước 2</b> — sai số chuẩn khi coi hai nhóm rời: ≈ 10,5 ms, vì nó gồm cả dao động do cỡ dữ liệu.</p>
        focus: [1, "1.2", 2]
        say: "Bước hai, coi A và B là hai nhóm rời. Khoảng 95 phần trăm đi từ âm 16 phẩy 5 tới 26 phẩy 5, chứa 0, nên chưa nói được gì. Lý do là sai số chuẩn lúc này khoảng 10 phẩy 5 mi li giây, vì nó gồm cả dao động do cỡ dữ liệu."
      - clear: true
        show: |
          <table class="t"><tr><th>cách phân tích</th><th>hiệu trung bình</th><th>khoảng 95%</th><th>kết luận</th></tr>
          <tr><td>ghép cặp (từng bộ)</td><td>4,99 ms</td><td>$4{,}99 \pm 2{,}045 \cdot 0{,}488 = \hl{[3{,}99;\ 5{,}99]}$</td><td>B nhanh hơn chắc chắn</td></tr></table>
        focus: [1, "1.2", "1.2"]
        say: "Bước ba, ghép cặp từng bộ. Độ lệch chuẩn của 30 hiệu chỉ khoảng 2 phẩy 67, nên sai số chuẩn bằng 0 phẩy 488. Khoảng 95 phần trăm là từ 3 phẩy 99 tới 5 phẩy 99, nên B nhanh hơn một cách chắc chắn."
      - show: |
          <div class="box key"><b>Bước 4</b> — ghép cặp loại bỏ dao động do <b>cỡ dữ liệu</b> — thứ chung cho cả A và B — chỉ giữ lại khác biệt thật giữa A và B.</div>
        say: "Bước bốn, ghép cặp loại bỏ dao động do cỡ dữ liệu, thứ chung cho cả A và B, và chỉ giữ lại khác biệt thật giữa hai cách."

  - id: check
    kind: check
    title: "Tự kiểm bằng đường khác"
    checks:
      - "(lambda A, B: round(sum(A) / 30 - sum(B) / 30, 2) == round(sum(a - b for a, b in zip(A, B)) / 30, 2) == 4.99)(*alg.perf_data())"
      - "round(2.045 * 0.488, 2) == 1.0 and round(2.045 * 10.514, 1) == 21.5"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>hiệu trung bình</td><td>trung bình A trừ trung bình B (không cần ghép)</td><td>4,99 ✓ — hai cách chỉ khác ở <b>độ rộng</b> khoảng</td></tr>
          <tr><td>nửa độ rộng</td><td>$2{,}045 \cdot 0{,}488 \approx 1{,}0$ và $2{,}045 \cdot 10{,}51 \approx 21{,}5$</td><td>khớp hai khoảng ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Vì trung bình của hiệu bằng hiệu của hai trung bình, lấy trung bình A trừ trung bình B cũng ra 4 phẩy 99, nên hai cách chỉ khác ở độ rộng của khoảng. Nhân hệ số với từng sai số chuẩn được khoảng 1 và khoảng 21 phẩy 5, khớp với nửa độ rộng của hai khoảng."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Một lần đo, hoặc tính cả lần khởi động <b class="red">(sai)</b>
          <br><span class="note">Lần đầu chịu bộ nhớ đệm lạnh, biên dịch khi chạy. Chạy vài lần khởi động, bỏ đi, rồi mới đo nhiều lần.</span></div>
        say: "Lỗi thứ nhất, đo một lần, hoặc tính cả lần khởi động. Lần đầu chịu bộ nhớ đệm lạnh và biên dịch khi chạy, nên hãy chạy vài lần khởi động, bỏ đi, rồi mới đo nhiều lần."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đo A lúc máy rảnh, đo B lúc máy bận <b class="red">(không công bằng)</b>
          <br><span class="note">Xen kẽ A và B trên cùng máy, cùng bộ dữ liệu, thứ tự ngẫu nhiên; ghi lại cấu hình máy.</span></div>
        say: "Lỗi thứ hai, đo A lúc máy rảnh và đo B lúc máy bận. Hãy xen kẽ A và B trên cùng máy, cùng bộ dữ liệu, theo thứ tự ngẫu nhiên, và ghi lại cấu hình máy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ báo con số đẹp nhất <b class="red">(lừa dối)</b>
          <br><span class="note">Chọn lần chạy nhanh nhất của B so với trung bình của A là thiên lệch. Báo trung bình, khoảng tin cậy, số lần đo và cách đo.</span></div>
        say: "Lỗi thứ ba, chỉ báo con số đẹp nhất. Chọn lần chạy nhanh nhất của B để so với trung bình của A là thiên lệch, nên hãy báo trung bình, khoảng tin cậy, số lần đo và cách đo."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "(lambda m, se: (round(m - 2.045 * se, 3), round(m + 2.045 * se, 3)) == (-0.845, 3.245))(1.2, 1.0)"
      - "(lambda m, se: (round(m - 2.045 * se, 2), round(m + 2.045 * se, 2)) == (0.79, 1.61))(1.2, 0.2)"
    steps:
      - show: |
          <p>30 cặp. Hiệu trung bình $\bar{d} = 1{,}2$ ms.</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Sai số chuẩn 1,0 ms: khoảng 95%? Kết luận?</td></tr><tr><td>2</td><td>Sai số chuẩn 0,2 ms: khoảng 95%? Kết luận?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, với 30 cặp và hiệu trung bình 1 phẩy 2 mi li giây. Câu một, nếu sai số chuẩn là 1 phẩy 0, khoảng 95 phần trăm là gì, và kết luận ra sao? Câu hai, nếu sai số chuẩn là 0 phẩy 2 thì sao? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $1{,}2 \pm 2{,}045 \cdot 1{,}0 = [-0{,}845;\ 3{,}245]$: chứa 0 → <b>chưa đủ bằng chứng</b>.</p>
        say: "Đáp án câu một, nửa độ rộng là 2 phẩy 045 nhân 1, nên khoảng từ âm 0 phẩy 845 tới 3 phẩy 245. Khoảng chứa 0, nên chưa đủ bằng chứng."
      - show: |
          <p>② $1{,}2 \pm 2{,}045 \cdot 0{,}2 = 1{,}2 \pm 0{,}409 = [\hl{0{,}79};\ \hl{1{,}61}]$: không chứa 0 → B nhanh hơn, khoảng 0,8 tới 1,6 ms.</p>
        say: "Câu hai, nửa độ rộng là 2 phẩy 045 nhân 0 phẩy 2, bằng 0 phẩy 409, nên khoảng từ 0 phẩy 79 tới 1 phẩy 61. Khoảng không chứa 0, nên B nhanh hơn, khoảng 0 phẩy 8 tới 1 phẩy 6 mi li giây."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bỏ lần khởi động, đo nhiều lần</span><span class="a">→</span>
          <span class="n">cùng bộ dữ liệu: ghép cặp</span><span class="a">→</span>
          <span class="n">khoảng 95% của hiệu</span><span class="a">→</span>
          <span class="n">chứa 0: chưa kết luận</span></div>
        say: "Tổng kết lại, bỏ lần khởi động và đo nhiều lần. Đo trên cùng bộ dữ liệu thì ghép cặp, tính khoảng 95 phần trăm của hiệu, và nếu khoảng chứa 0 thì chưa kết luận."
      - show: |
