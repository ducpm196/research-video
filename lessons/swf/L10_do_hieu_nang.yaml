scenes:
- id: hook
  kind: hook
  title: 'Lần đo đầu: 310 ms, các lần sau: 142 ms'
  checks:
  - sum([310, 142, 141, 143, 140]) / 5 == 175.2 and sum([142, 141, 143, 140]) / 4 == 141.5
  steps:
  - show: '<p>Chạy cùng một hàm năm lần: 310, 142, 141, 143, 140 ms. Lần đầu chậm gấp đôi vì bộ nhớ đệm còn lạnh (chưa có sẵn dữ liệu), hoặc mã còn đang được dịch sang lệnh máy ngay khi chạy. Trung bình cả năm: 175,2; bỏ lần đầu: 141,5.</p>

      <div class="box key">Hôm nay: đo hiệu năng sao cho kết luận “B nhanh hơn A” là <b>đáng tin</b> — nhiều lần đo, ghép cặp, khoảng tin cậy.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, chạy cùng một hàm năm lần được 310, 142, 141, 143, 140 mi li giây. Lần đầu chậm gấp đôi vì bộ nhớ đệm còn lạnh, tức chưa có sẵn dữ liệu nào, hoặc vì máy còn đang dịch mã sang lệnh máy ngay trong lúc chạy. Trung bình cả năm lần là 175 phẩy 2, bỏ lần đầu thì còn 141 phẩy 5. Hôm nay ta học cách đo hiệu năng sao cho kết luận B nhanh hơn A là đáng tin, với nhiều lần đo, ghép cặp, và khoảng tin cậy. Tự tin khoe thuật toán mới nhanh gấp đôi đối thủ chỉ sau một lần bấm đồng hồ ngay sau lúc vừa khởi động chương trình là sai lầm cực kỳ phổ biến. Đo hiệu năng đáng tin cậy đòi hỏi tách bạch nhiễu hệ thống, hâm nóng trình biên dịch và công bố kết quả theo phân vị cùng phương sai.
- id: prereq
  kind: prereq
  title: 'Ôn lại: trung bình, độ lệch chuẩn, sai số chuẩn'
  checks:
  - __import__('statistics').mean([2, 4, 6]) == 4 and __import__('statistics').stdev([2, 4, 6]) == 2.0 and round(2 / math.sqrt(4), 1) == 1.0
  - 2 / math.sqrt(16) == 0.5 and round(math.erf(1.96 / math.sqrt(2)), 3) == 0.95
  steps:
  - show: '<table class="t"><tr><th>đại lượng</th><th>ví dụ với 2, 4, 6</th><th>nghĩa</th></tr>

      <tr><td>trung bình</td><td>$\frac{2 + 4 + 6}{3} = 4$</td><td>giá trị điển hình</td></tr>

      <tr><td>độ lệch chuẩn $s$</td><td>$\sqrt{\frac{(2-4)^2 + 0 + (6-4)^2}{3 - 1}} = 2$</td><td>các số tản ra quanh trung bình bao xa</td></tr></table>

      <p class="note">Cách tính $s$: lấy từng số trừ trung bình, bình phương, cộng lại, chia cho số phần tử trừ 1, rồi lấy căn. Chia $3 - 1$ chứ không chia 3, vì trung bình được tính từ chính các số này nên độ tản đo được hơi nhỏ hơn thật; chia cho số nhỏ hơn bù lại.</p>

      '
    introduces:
    - power
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - '1.3'
    - 2
    - 2
    - 2
    - 2
    say: Trước hết, ta cần hai đại lượng thống kê. Trung bình của 2, 4, 6 là 12 chia 3, bằng 4, giá trị điển hình. Độ lệch chuẩn đo các số tản ra quanh trung bình bao xa. Cách tính là lấy từng số trừ trung bình, bình phương, cộng lại, chia cho số phần tử trừ 1, rồi lấy căn. Ở đây được căn của 4 cộng 0 cộng 4, chia 2, tức căn 4, bằng 2. Ta chia cho 3 trừ 1 chứ không chia cho 3, vì trung bình được tính từ chính các số này, nên độ tản đo được hơi nhỏ hơn thật. Chia cho số nhỏ hơn một chút là để bù lại. Lượt chạy đầu tiên thường gánh trọn chi phí nạp dữ liệu nguội vào bộ nhớ đệm, mở kết nối và tối ưu động mã thực thi. Do đó vài lượt hâm nóng ban đầu bắt buộc phải tách riêng khỏi tập mẫu đo chính thức để tránh làm lệch thê thảm số đo thật.
  - clear: true
    show: '<p><b>Sai số chuẩn</b> của trung bình $= \frac{s}{\sqrt{n}}$: trung bình của $n$ lần đo còn dao động bao nhiêu nếu đo lại cả loạt. Ví dụ $s = 2$: với $n = 4$ được $\frac{2}{\sqrt{4}} = 1$; với $n = 16$ được $\frac{2}{4} = 0{,}5$ — đo gấp 4 lần thì dao động còn một nửa.</p>

      <p><b>Khoảng tin cậy 95%</b> $\approx$ trung bình $\pm 1{,}96 \cdot$ sai số chuẩn. Vì sao 1,96: khi đo đủ nhiều, trung bình dao động gần theo hình chuông, và 95% diện tích hình chuông nằm trong 1,96 sai số chuẩn quanh tâm. Làm theo cách này nhiều lần thì khoảng 95 trên 100 khoảng tính ra chứa giá trị thật.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Sai số chuẩn của trung bình bằng độ lệch chuẩn chia căn n, nó cho biết trung bình của n lần đo còn dao động bao nhiêu nếu ta đo lại cả loạt. Ví dụ độ lệch chuẩn bằng 2 và có 4 lần đo thì sai số chuẩn là 2 chia căn 4, bằng 1. Với 16 lần đo thì còn 2 chia 4, bằng 0 phẩy 5, tức đo gấp 4 lần thì dao động chỉ còn một nửa. Khoảng tin cậy 95 phần trăm xấp xỉ trung bình cộng trừ 1 phẩy 96 lần sai số chuẩn. Lý do là khi đo đủ nhiều, trung bình dao động gần theo hình chuông, và 95 phần trăm diện tích hình chuông nằm trong 1 phẩy 96 sai số chuẩn quanh tâm. Nếu làm theo cách này nhiều lần, khoảng 95 trên 100 khoảng tính ra sẽ chứa giá trị thật.
- id: sym
  kind: symbol
  title: 'Giải mã: hiệu ghép cặp'
  steps:
  - show: '<p>Đo A và B trên <b>cùng</b> $n$ bộ dữ liệu. Với bộ thứ $i$: $d_i = A_i - B_i$ (dương là B nhanh hơn).</p>

      <p>$\bar{d} = \dfrac{1}{n}\sum d_i$, sai số chuẩn $\dfrac{s_d}{\sqrt{n}}$ ($s_d$: độ lệch chuẩn của các $d_i$). Khoảng 95%: $\bar{d} \pm 2{,}045 \cdot \dfrac{s_d}{\sqrt{n}}$ với $n = 30$.</p>

      <p class="note">2,045 là hệ số Student cho 30 cặp, hơi lớn hơn 1,96 ở phần chuẩn bị vì độ lệch chuẩn cũng được ước lượng từ chính 30 cặp này; càng nhiều cặp, hệ số càng gần 1,96.</p>

      '
    introduces:
    - bar
    focus:
    - 1
    - 2
    - 3
    - 3
    - 3
    - 3
    - 3
    - 3
    - 3
    say: Đo A và B trên cùng n bộ dữ liệu. Với bộ thứ i, gọi d i là thời gian của A trừ thời gian của B, dương nghĩa là B nhanh hơn. Trung bình d ngang là tổng các d i chia n, sai số chuẩn là độ lệch chuẩn của các d i chia căn n. Khoảng 95 phần trăm là d ngang cộng trừ 2 phẩy 045 nhân sai số chuẩn, với n bằng 30. Hệ số 2 phẩy 045 hơi lớn hơn 1 phẩy 96 ở phần chuẩn bị, vì độ lệch chuẩn cũng được ước lượng từ chính 30 cặp này. Càng nhiều cặp thì hệ số càng gần 1 phẩy 96. Khi đo lặp, luôn giữ nguyên dữ liệu mồi và môi trường chạy để tránh nhiễu bộ nhớ đệm giả. Khi so sánh hai phương án A và B, cần kiểm tra độ chồng lấn khoảng tin cậy thay vì vội kết luận khi mức chênh còn nhỏ hơn sai số nền. Một phép đổi thuật toán chỉ đáng ăn mừng khi mức cải thiện vượt xa hẳn độ rộng dao động tự nhiên của máy đo.
- id: intuition
  kind: intuition
  title: Các bộ chênh nhau nhiều, mỗi cặp chênh rất ít
  steps:
  - show: '<div><svg width="1500" height="345" viewBox="0 0 1500 345"><line x1="190" y1="305" x2="1340" y2="305" stroke="#6b7280" stroke-width="2"/><g fill="#1f2937"><line x1="230" y1="133" x2="280" y2="150" stroke="#6b7280" stroke-width="3"/><circle cx="230" cy="133" r="11" fill="#2a78d6"/><circle cx="280" cy="150" r="11" fill="#eb6834"/><text x="255" y="330" text-anchor="middle" font-size="20">bộ 1</text><line x1="420" y1="267" x2="470" y2="277" stroke="#6b7280" stroke-width="3"/><circle cx="420" cy="267" r="11" fill="#2a78d6"/><circle cx="470" cy="277" r="11" fill="#eb6834"/><text x="445" y="330" text-anchor="middle" font-size="20">bộ 2</text><line x1="610" y1="272" x2="660" y2="283" stroke="#6b7280" stroke-width="3"/><circle cx="610" cy="272" r="11" fill="#2a78d6"/><circle cx="660" cy="283" r="11" fill="#eb6834"/><text x="635" y="330" text-anchor="middle" font-size="20">bộ 3</text><line x1="800" y1="79" x2="850" y2="101" stroke="#6b7280" stroke-width="3"/><circle cx="800" cy="79" r="11" fill="#2a78d6"/><circle cx="850" cy="101" r="11" fill="#eb6834"/><text x="825" y="330" text-anchor="middle" font-size="20">bộ 4</text><line x1="990" y1="85" x2="1040" y2="108" stroke="#6b7280" stroke-width="3"/><circle cx="990" cy="85" r="11" fill="#2a78d6"/><circle cx="1040" cy="108" r="11" fill="#eb6834"/><text x="1015" y="330" text-anchor="middle" font-size="20">bộ 5</text><line x1="1180" y1="194" x2="1230" y2="210" stroke="#6b7280" stroke-width="3"/><circle cx="1180" cy="194" r="11" fill="#2a78d6"/><circle cx="1230" cy="210" r="11" fill="#eb6834"/><text x="1205" y="330" text-anchor="middle" font-size="20">bộ 6</text><text x="20" y="80" font-size="22">thời gian, ms</text><text x="20" y="115" font-size="20">88 tới 141</text><circle cx="1360" cy="90" r="11" fill="#2a78d6"/><text x="1380" y="98" font-size="22">A</text><circle cx="1360" cy="130" r="11" fill="#eb6834"/><text x="1380" y="138" font-size="22">B</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ 6 bộ dữ liệu đầu, chấm xanh là A, chấm cam là B. Từ bộ này sang bộ khác, thời gian lên xuống rất nhiều vì cỡ dữ liệu khác nhau. Nhưng trong mỗi cặp, B luôn thấp hơn A một chút, và ghép cặp chính là nhìn vào đoạn nối nhỏ đó. Giống thử tốc độ hai chiếc xe đua khi mới nổ máy còn lạnh và đo xuyên qua bốn ngã tư kẹt đèn đỏ rồi tính trung bình cả tuần. Phải làm nóng động cơ trên đường đua tách biệt, chạy hàng chục vòng lặp và tách riêng vòng bị kẹt đèn bất ngờ.
- id: example
  kind: example
  title: Ghép cặp và không ghép cặp
  checks:
  - '(lambda A, B: (min(A), max(A)) == (82.7, 203.9))(*alg.perf_data())'
  - '(lambda r: (round(r[0], 2), round(r[2], 2), round(r[3], 2)) == (4.99, 3.99, 5.99))(alg.paired_ci(*alg.perf_data(), z=2.045))'
  - '(lambda r: (round(r[2], 1), round(r[3], 1)) == (-16.5, 26.5))(alg.unpaired_ci(*alg.perf_data(), z=2.045))'
  - '(lambda r: r[2] < 0 < r[3])(alg.unpaired_ci(*alg.perf_data(), z=2.0))'
  steps:
  - show: '<p><b>Bước 1</b> — 30 bộ dữ liệu, thời gian của A từ 82,7 tới 203,9 ms — cỡ dữ liệu làm thời gian dao động rất mạnh. Hiệu trung bình A − B $= 4{,}99$ ms.</p>

      '
    say: Bước một, ta có 30 bộ dữ liệu, thời gian của A đi từ 82 phẩy 7 tới 203 phẩy 9 mi li giây, nghĩa là cỡ dữ liệu làm thời gian dao động rất mạnh. Hiệu trung bình của A trừ B là 4 phẩy 99 mi li giây.
  - show: '<table class="t"><tr><th>cách phân tích</th><th>hiệu trung bình</th><th>khoảng 95%</th><th>kết luận</th></tr>

      <tr><td>không ghép cặp (hai nhóm)</td><td>4,99 ms</td><td>[−16,5; 26,5]</td><td>chứa 0: chưa nói được gì</td></tr></table>

      <p><b>Bước 2</b> — sai số chuẩn khi coi hai nhóm rời: ≈ 10,5 ms, vì nó gồm cả dao động do cỡ dữ liệu.</p>

      <p class="note">Để so công bằng, hai cách dùng cùng hệ số 2,045. Với hai nhóm rời, hệ số đúng nhỏ hơn chút (khoảng 2,00), khoảng vẫn chứa 0.</p>

      '
    focus:
    - 1
    - '1.2'
    - 2
    - 3
    say: Bước hai, coi A và B là hai nhóm rời. Khoảng 95 phần trăm đi từ âm 16 phẩy 5 tới 26 phẩy 5, chứa 0, nên chưa nói được gì. Lý do là sai số chuẩn lúc này khoảng 10 phẩy 5 mi li giây, vì nó gồm cả dao động do cỡ dữ liệu. Để so công bằng, hai cách dùng cùng hệ số 2 phẩy 045, còn với hai nhóm rời thì hệ số đúng nhỏ hơn chút, khoảng 2 phẩy 00, và khoảng vẫn chứa 0.
  - clear: true
    show: '<table class="t"><tr><th>cách phân tích</th><th>hiệu trung bình</th><th>khoảng 95%</th><th>kết luận</th></tr>

      <tr><td>ghép cặp (từng bộ)</td><td>4,99 ms</td><td>$4{,}99 \pm 2{,}045 \cdot 0{,}488 = \hl{[3{,}99;\ 5{,}99]}$</td><td>không chứa 0: bằng chứng rõ B nhanh hơn (độ tin cậy 95%)</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    say: Bước ba, ghép cặp từng bộ. Độ lệch chuẩn của 30 hiệu chỉ khoảng 2 phẩy 67, nên sai số chuẩn bằng 0 phẩy 488. Khoảng 95 phần trăm là từ 3 phẩy 99 tới 5 phẩy 99, không chứa 0, nên có bằng chứng rõ là B nhanh hơn, ở độ tin cậy 95 phần trăm.
  - show: '<div class="box key"><b>Bước 4</b> — ghép cặp loại bỏ dao động do <b>cỡ dữ liệu</b> — thứ chung cho cả A và B — chỉ giữ lại khác biệt thật giữa A và B.</div>

      '
    say: Bước bốn, ghép cặp loại bỏ dao động do cỡ dữ liệu, thứ chung cho cả A và B, và chỉ giữ lại khác biệt thật giữa hai cách. Trình bày độ lệch chuẩn và khoảng tin cậy giúp phân biệt rõ khác biệt thật với sai số ngẫu nhiên.
    focus:
    - '1.1'
    - '1.2'
- id: check
  kind: check
  title: Tự kiểm bằng đường khác
  checks:
  - '(lambda A, B: round(sum(A) / 30 - sum(B) / 30, 2) == round(sum(a - b for a, b in zip(A, B)) / 30, 2) == 4.99)(*alg.perf_data())'
  - round(2.045 * 0.488, 2) == 1.0 and round(2.045 * 10.514, 1) == 21.5
  steps:
  - show: '<table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>

      <tr><td>hiệu trung bình</td><td>trung bình A trừ trung bình B (không cần ghép)</td><td>4,99 ✓ — hai cách chỉ khác ở <b>độ rộng</b> khoảng</td></tr>

      <tr><td>nửa độ rộng</td><td>$2{,}045 \cdot 0{,}488 \approx 1{,}0$ và $2{,}045 \cdot 10{,}51 \approx 21{,}5$</td><td>khớp hai khoảng ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Kiểm bằng đường khác. Vì trung bình của hiệu bằng hiệu của hai trung bình, lấy trung bình A trừ trung bình B cũng ra 4 phẩy 99, nên hai cách chỉ khác ở độ rộng của khoảng. Nhân hệ số với từng sai số chuẩn được khoảng 1 và khoảng 21 phẩy 5, khớp với nửa độ rộng của hai khoảng.
  - show: <table class='t'><tr><th>nguyên nhân nhiễu</th><th>vì sao một lần đo không đủ</th><th>cách kiểm chuẩn</th></tr><tr><td>Lần đầu bộ đệm lạnh</td><td class='red'>310 ms (gấp đôi)</td><td class='green'>chạy khởi động bỏ qua trước khi đo</td></tr><tr><td>Môi trường không đồng đều</td><td class='red'>dao động theo nền</td><td class='green'>xen kẽ A, B ngẫu nhiên trên cùng máy</td></tr><tr><td>Chọn số đẹp nhất</td><td class='red'>bỏ qua phương sai</td><td class='green'>báo trung bình + khoảng tin cậy 95%</td></tr></table>
    say: Kiểm tra lại lý do một lần đo không đủ và ba cái bẫy đo hiệu năng. Lần chạy đầu chịu bộ nhớ đệm lạnh cao gấp đôi (310 so với 141 mi-li-giây), máy bận làm lệch kết quả và chỉ chọn số đẹp nhất sẽ giấu biến động. Luôn bỏ lượt khởi động, chạy xen kẽ A với B trên cùng dữ liệu, và báo cáo kèm khoảng tin cậy 95 phần trăm.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Một lần đo, hoặc tính cả lần khởi động <b class="red">(sai)</b>

      <br><span class="note">Lần đầu chịu bộ nhớ đệm lạnh, biên dịch khi chạy. Chạy vài lần khởi động, bỏ đi, rồi mới đo nhiều lần.</span></div>

      '
    say: Lỗi thứ nhất, đo một lần, hoặc tính cả lần khởi động. Lần đầu chịu bộ nhớ đệm lạnh và biên dịch khi chạy, nên hãy chạy vài lần khởi động, bỏ đi, rồi mới đo nhiều lần. Để trình tối ưu hoá loại bỏ hoàn toàn phép tính đo vì thấy kết quả tính xong không hề được sử dụng hay in ra màn hình.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Đo A lúc máy rảnh, đo B lúc máy bận <b class="red">(không công bằng)</b>

      <br><span class="note">Xen kẽ A và B trên cùng máy, cùng bộ dữ liệu, thứ tự ngẫu nhiên; ghi lại cấu hình máy.</span></div>

      '
    say: Lỗi thứ hai, đo A lúc máy rảnh và đo B lúc máy bận. Hãy xen kẽ A và B trên cùng máy, cùng bộ dữ liệu, theo thứ tự ngẫu nhiên, và ghi lại cấu hình máy. Chạy đo hiệu năng ngay trên máy cá nhân đang mở hàng chục phần mềm nền nặng khiến số liệu nhảy loạn xạ giữa hai lần đo.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Chỉ báo con số đẹp nhất <b class="red">(lừa dối)</b>

      <br><span class="note">Chọn lần chạy nhanh nhất của B so với trung bình của A là thiên lệch. Báo trung bình, khoảng tin cậy, số lần đo và cách đo.</span></div>

      '
    say: Lỗi thứ ba, chỉ báo con số đẹp nhất. Chọn lần chạy nhanh nhất của B để so với trung bình của A là thiên lệch, nên hãy báo trung bình, khoảng tin cậy, số lần đo và cách đo.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '(lambda m, se: (round(m - 2.045 * se, 3), round(m + 2.045 * se, 3)) == (-0.845, 3.245))(1.2, 1.0)'
  - '(lambda m, se: (round(m - 2.045 * se, 2), round(m + 2.045 * se, 2)) == (0.79, 1.61))(1.2, 0.2)'
  steps:
  - show: '<p>30 cặp. Hiệu trung bình $\bar{d} = 1{,}2$ ms.</p>

      <table class="t"><tr><th>câu</th><th>đề</th></tr><tr><td>1</td><td>Sai số chuẩn 1,0 ms: khoảng 95%? Kết luận?</td></tr><tr><td>2</td><td>Sai số chuẩn 0,2 ms: khoảng 95%? Kết luận?</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm, với 30 cặp và hiệu trung bình 1 phẩy 2 mi li giây. Câu một, nếu sai số chuẩn là 1 phẩy 0, khoảng 95 phần trăm là gì, và kết luận ra sao? Câu hai, nếu sai số chuẩn là 0 phẩy 2 thì sao? Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① $1{,}2 \pm 2{,}045 \cdot 1{,}0 = [-0{,}845;\ 3{,}245]$: chứa 0 → <b>chưa đủ bằng chứng</b>.</p>

      '
    say: Đáp án câu một, nửa độ rộng là 2 phẩy 045 nhân 1, nên khoảng từ âm 0 phẩy 845 tới 3 phẩy 245. Khoảng chứa 0, nên chưa đủ bằng chứng.
  - show: '<p>② $1{,}2 \pm 2{,}045 \cdot 0{,}2 = 1{,}2 \pm 0{,}409 = [\hl{0{,}79};\ \hl{1{,}61}]$: không chứa 0 → B nhanh hơn, khoảng 0,8 tới 1,6 ms.</p>

      '
    say: Câu hai, nửa độ rộng là 2 phẩy 045 nhân 0 phẩy 2, bằng 0 phẩy 409, nên khoảng từ 0 phẩy 79 tới 1 phẩy 61. Khoảng không chứa 0, nên B nhanh hơn, khoảng 0 phẩy 8 tới 1 phẩy 6 mi li giây. Tính khoảng tin cậy xấp xỉ cho chênh lệch hiệu năng trung bình từ hai bộ mẫu đo độc lập lặp lại.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/SWF/L10
  steps:
  - show: '<table class=''t''><tr><th>Thực hành SWF:L10</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Tránh các bẫy đo: khởi động, môi trường, chọn số liệu</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n=30 base=12.0 step=0.5</code> (mẫu <code>base + (i % 5 - 2) * step</code>, <code>t = 2.045</code>)</td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh SWF L10 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>'
    say: Mời bạn tự thực hành bài số 10 tính trung bình, độ lệch chuẩn mẫu, sai số chuẩn và khoảng tin cậy 95 phần trăm. Dựa trên nền tảng đọc luồng chuẩn từ khoá Python cơ bản, bạn dùng sys chấm stdin chấm read để tách các cặp khoá giá trị. Đầu vào gồm cỡ mẫu n, giá trị nền và bước dao động để tạo dãy n số thực theo công thức mẫu. Bạn tính độ lệch chuẩn mẫu chia cho n trừ 1, sai số chuẩn chia căn n và nhân hệ số t bằng 2 phẩy 045 để lập hai đầu khoảng tin cậy.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <table class='t'><tr><th>Gợi ý triển khai SWF:L10</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (sinh dãy đo)</b></td><td>Tạo danh sách mẫu chênh lệch hiệu năng quanh giá trị nền</td></tr><tr><td><b>Bước 2 (tính tán xạ)</b></td><td>Tính phương sai mẫu chia n trừ một rồi lấy căn và chia căn n</td></tr><tr><td><b>Bước 3 (khoảng tin cậy)</b></td><td>Lấy trung bình cộng trừ nửa bề rộng nhân hệ số tin cậy</td></tr><tr><td><b>Khung đọc stdin</b></td><td>Tạo <code>xs = [base + (i % 5 - 2) * step for i in range(n)]</code>; nhân nửa độ rộng với <code>t = 2.045</code></td></tr></table>
    say: Gợi ý cài đặt bài số 10 chia thành ba bước chính xác. Bước một, đọc ba tham số từ luồng chuẩn rồi sinh đủ n giá trị bằng biểu thức chia lấy dư 5 trừ 2 nhân bước dao động cộng nền. Bước hai, tính trung bình, lấy căn tổng bình phương sai lệch chia cho n trừ 1 thành độ lệch chuẩn mẫu, rồi chia căn n thành sai số chuẩn. Bước ba, cộng trừ 2 phẩy 045 lần sai số chuẩn quanh trung bình và định dạng hai hoặc ba chữ số thập phân.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>n=30 mean=12.00</div><div>sd=0.719 se=0.131</div><div>ci95=11.73,12.27</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">bỏ lần khởi động, đo nhiều lần</span><span class="a">→</span>

      <span class="n">cùng bộ dữ liệu: ghép cặp</span><span class="a">→</span>

      <span class="n">khoảng 95% của hiệu</span><span class="a">→</span>

      <span class="n">chứa 0: chưa kết luận</span></div>

      '
    say: Tổng kết lại, bỏ lần khởi động và đo nhiều lần. Đo trên cùng bộ dữ liệu thì ghép cặp, tính khoảng 95 phần trăm của hiệu, và nếu khoảng chứa 0 thì chưa kết luận. Đo hiệu năng thiếu kiểm soát môi trường và thiếu thống kê phân vị chỉ tạo ra những ảo giác số liệu dễ gây hiểu nhầm.
  - show: '<div class="box key"><b>Tư duy:</b> một con số đo được luôn có nhiễu. Kết luận chỉ đáng tin khi khác biệt lớn hơn nhiễu — và bạn đã đo được cả nhiễu.</div>

      '
    say: Điều cần mang theo, một con số đo được luôn có nhiễu. Kết luận chỉ đáng tin khi khác biệt lớn hơn nhiễu, và bạn đã đo được cả nhiễu.
  - clear: true
    show: '<p class="note">Bài sau (bài 11): <b>quản lý phiên bản</b> và hợp nhất ba chiều.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 11, ta học quản lý phiên bản và hợp nhất ba chiều. Hẹn gặp bạn ở bài tiếp theo. Khi đã tạo và tối ưu nhiều phiên bản mã nguồn sạch sẽ, thách thức tổ chức tiếp theo nằm ở phối hợp thay đổi song song trong kho lưu trữ nhóm.
