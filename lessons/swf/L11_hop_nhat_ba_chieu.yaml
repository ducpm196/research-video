- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">tổ tiên chung O</span><span class="a">→</span>

      <span class="n">chỉ một bên đổi: lấy bên đổi</span><span class="a">→</span>

      <span class="n">hai bên đổi khác: xung đột</span><span class="a">→</span>

      <span class="n">hợp nhất xong: chạy kiểm thử</span></div>

      '
    say: Tổng kết lại, hợp nhất ba chiều dựa vào tổ tiên chung. Chỉ một bên đổi thì lấy bên đổi, hai bên đổi khác nhau là
      xung đột, và hợp nhất xong thì phải chạy kiểm thử. Tổ tiên chung gần nhất chính là chìa khoá biến việc ghép mã nhóm
      từ thảm hoạ ghi đè thành quy trình khoa học rõ ràng.
  - show: '<div class="box key"><b>Tư duy:</b> muốn biết “cái gì đã thay đổi” phải có điểm gốc để so. Không có gốc, mọi khác
      biệt đều mơ hồ.</div>

      <p class="note"><b>So sánh hai quy mô:</b> so 2 bản mất chi phí xem mù; thêm tổ tiên chung <code>O</code> phân giải
      sạch xung đột trên đoạn 3 dòng lẫn tệp <code>10 000</code> dòng nhưng luôn cần chạy lại kiểm thử vì hợp nhất văn bản
      không hiểu ngữ nghĩa.</p>

      '
    focus:
    - 1
    - 1
    - 1
    say: Điều cần mang theo, muốn biết cái gì đã thay đổi thì phải có một điểm gốc để so. Không có gốc, mọi khác biệt đều
      mơ hồ. Tích hợp nhánh thường xuyên thành lô nhỏ, giữ thay đổi tập trung và chạy kiểm thử ngay sau hợp nhất giúp dập
      tắt lỗi tích tụ.
  - clear: true
    show: '<p class="note">Bài sau (bài 12): <b>bảo mật phần mềm</b> — tràn bộ đệm và chèn mã.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 12, ta học bảo mật phần mềm, với tràn bộ đệm và chèn mã. Hẹn gặp bạn ở bài tiếp theo. Mảnh ghép cuối
      hoàn chỉnh tư duy kỹ nghệ phần mềm chính là phòng thủ ngay tại từng dòng lệnh trước những lỗ hổng bảo mật chết người.
