id: L11
course: SWF
series: "SWF · Nền tảng phần mềm đúng đắn"
title: "Bài 11 — Quản lý phiên bản và hợp nhất ba chiều"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/swf.yaml L11; audit/swf/verify_swf.py L11; S. Khanna, K. Kuber, B. C. Pierce, A Formal Investigation of Diff3, FSTTCS 2007; S. Chacon, B. Straub, Pro Git, 2nd ed. (2014), mục 3.2"
assumes: [arith]
# Quy ước: tệp = danh sách dòng cùng số dòng (đơn giản hoá: không thêm/xoá dòng); hợp nhất từng dòng theo luật diff3 = alg.merge3.
#   Lỗi ngữ nghĩa sau hợp nhất chạy thật bằng alg.run_error. Lời đọc nói “nhánh”, “tổ tiên chung”, không đọc tên công cụ.
objectives:
  - "Hiểu vì sao hợp nhất cần tổ tiên chung"
  - "Áp dụng luật hợp nhất ba chiều từng dòng"
  - "Biết hợp nhất sạch chưa chắc đúng"
asr_reviewed:
  - {sentence: "Lỗi thứ ba, để nhánh sống quá lâu rồi mới gộp.", reason: "ASR chép “Lội thứ 3, để nhắn sống quá lâu rồi mới gục”: lỗi/lội lệch thanh (đã biết), nhánh/nhắn lệch vần, gộp/gục lệch vần; câu 10 từ khớp 0,727 — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hai người cùng sửa một tệp"
    steps:
      - show: |
          <p>An sửa dòng thứ nhất, Bình sửa dòng thứ ba, cùng một tệp, cùng lúc, trên hai nhánh. Gộp lại thế nào cho đúng? Nếu cả hai cùng sửa một dòng thì sao?</p>
          <div class="box key">Hôm nay: <b>quản lý phiên bản</b> và <b>hợp nhất ba chiều</b> — nhìn cả hai bản sửa lẫn <b>tổ tiên chung</b>.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, An sửa dòng đầu, Bình sửa dòng thứ ba, của cùng một tệp, cùng lúc, trên hai nhánh. Gộp lại thế nào cho đúng? Nếu cả hai cùng sửa một dòng thì sao? Hôm nay ta học quản lý phiên bản và hợp nhất ba chiều, nhìn cả hai bản sửa lẫn tổ tiên chung."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lưu nhiều bản, và so hai bản từng dòng"
    checks:
      - "[i + 1 for i, (u, v) in enumerate(zip(['a = 1', 'b = 1', 'c = 1'], ['a = 1', 'b = 2', 'c = 1'])) if u != v] == [2]"
    steps:
      - show: |
          <p>Người mới thường lưu tay: <code>bao_cao_v1</code>, <code>bao_cao_v2</code>, <code>bao_cao_cuoi_that</code>… Công cụ <b>quản lý phiên bản</b> làm việc đó tự động: mỗi lần lưu ghi lại cả tệp, ai lưu, lúc nào, và lưu từ bản nào.</p>
        say: "Người mới thường lưu tay nhiều bản, như báo cáo bản 1, bản 2, bản cuối thật. Công cụ quản lý phiên bản làm việc đó tự động, mỗi lần lưu ghi lại cả tệp, ai lưu, lúc nào, và lưu từ bản nào."
      - show: |
          <table class="t"><tr><th>dòng</th><th>bản cũ</th><th>bản mới</th><th>khác?</th></tr>
          <tr><td>1</td><td>a = 1</td><td>a = 1</td><td>—</td></tr>
          <tr><td>2</td><td>b = 1</td><td>b = 2</td><td><b>đổi</b></td></tr>
          <tr><td>3</td><td>c = 1</td><td>c = 1</td><td>—</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "So hai bản là đặt chúng cạnh nhau rồi xét từng dòng. Dòng đầu giống nhau. Dòng thứ hai đổi từ b bằng 1 sang b bằng 2. Dòng thứ ba giống nhau, nên chỉ dòng thứ hai bị đổi."

  - id: sym
    kind: symbol
    title: "Giải mã: nhánh, tổ tiên chung"
    steps:
      - show: |
          <p>Mỗi lần lưu là một <b>phiên bản</b>. Hai người tách từ cùng một phiên bản — gọi là <b>tổ tiên chung</b> O — rồi mỗi người sửa trên <b>nhánh</b> riêng: A và B.</p>
          <div class="box key">Chỉ so A với B (hai chiều) thì không biết ai đã đổi: dòng khác nhau có thể do A đổi, do B đổi, hoặc cả hai. Có O thì biết.</div>
        focus: [1, 1, 2, 2]
        say: "Mỗi lần lưu là một phiên bản. Hai người tách ra từ cùng một phiên bản, gọi là tổ tiên chung O, rồi mỗi người sửa trên một nhánh riêng, A và B. Nếu chỉ so A với B, gọi là so hai chiều, ta không biết ai đã đổi, vì dòng khác nhau có thể do A đổi, do B đổi, hoặc cả hai. Có tổ tiên chung O thì biết được."

  # ───────────────────────── 3. LUẬT ─────────────────────────
  - id: rule
    kind: concept
    title: "Luật hợp nhất ba chiều cho một dòng"
    checks:
      - "alg.merge3(['x = 1'], ['x = 2'], ['x = 1']) == ['x = 2'] and alg.merge3(['x = 1'], ['x = 2'], ['x = 3']) == [('XUNG ĐỘT', 'x = 2', 'x = 3')]"
    steps:
      - show: |
          <table class="t"><tr><th>O</th><th>A</th><th>B</th><th>kết quả</th></tr>
          <tr><td>x = 1</td><td>x = 1</td><td>x = 1</td><td>x = 1 (không ai đổi)</td></tr>
          <tr><td>x = 1</td><td><b>x = 2</b></td><td>x = 1</td><td>x = 2 (chỉ A đổi → lấy A)</td></tr>
          <tr><td>x = 1</td><td>x = 1</td><td><b>x = 3</b></td><td>x = 3 (chỉ B đổi → lấy B)</td></tr>
          <tr><td>x = 1</td><td><b>x = 2</b></td><td><b>x = 2</b></td><td>x = 2 (đổi giống nhau)</td></tr>
          <tr><td>x = 1</td><td><b>x = 2</b></td><td><b>x = 3</b></td><td><b class="red">xung đột</b>: người phải chọn</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Luật cho một dòng có năm trường hợp. Không ai đổi thì giữ nguyên. Chỉ A đổi thì lấy bản của A. Chỉ B đổi thì lấy bản của B. Cả hai đổi giống nhau thì lấy bản đó. Cả hai đổi khác nhau là xung đột, và người phải tự chọn."

  # ───────────────────────── 4. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Hình thoi: tách ra rồi gộp lại"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><defs><marker id="arS11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="350" y1="150" x2="640" y2="78" marker-end="url(#arS11)"/><line x1="350" y1="180" x2="640" y2="252" marker-end="url(#arS11)"/><line x1="745" y1="78" x2="1040" y2="150" marker-end="url(#arS11)"/><line x1="745" y1="252" x2="1040" y2="180" marker-end="url(#arS11)"/><path d="M350,165 C520,165 860,165 1035,165" stroke="#6b7280" stroke-dasharray="10 8"/></g><g fill="#1f2937"><circle cx="300" cy="165" r="52" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="300" y="175" text-anchor="middle" font-size="30" font-weight="bold">O</text><circle cx="695" cy="70" r="52" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="695" y="80" text-anchor="middle" font-size="30" font-weight="bold">A</text><circle cx="695" cy="260" r="52" fill="#ffedd5" stroke="#1f2937" stroke-width="3"/><text x="695" y="270" text-anchor="middle" font-size="30" font-weight="bold">B</text><circle cx="1090" cy="165" r="52" fill="#d1fae5" stroke="#1f2937" stroke-width="3"/><text x="1090" y="175" text-anchor="middle" font-size="30" font-weight="bold">M</text><g font-size="22"><text x="160" y="250">tổ tiên chung</text><text x="770" y="40">nhánh của An</text><text x="770" y="320">nhánh của Bình</text><text x="1160" y="160">bản hợp nhất</text><text x="1160" y="195">nhìn cả O, A, B</text></g></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình vẽ lịch sử như một hình thoi. Hai người tách ra từ cùng tổ tiên chung O, An sửa trên nhánh A, Bình sửa trên nhánh B. Bản hợp nhất M nhìn cả ba, nên với mỗi dòng nó biết ai đã đổi so với O. Đường đứt nét ở giữa nhắc rằng O là mốc so sánh, không phải một bản để chép đè."

  - id: example
    kind: example
    title: "Hợp nhất sạch mà chương trình hỏng"
    checks:
      - "alg.merge3(['def f(): return 1', 'y = 0'], ['def g(): return 1', 'y = 0'], ['def f(): return 1', 'y = f()']) == ['def g(): return 1', 'y = f()']"
      - "alg.run_error('def g(): return 1\\ny = f()') == 'NameError'"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>dòng thứ nhất</th><th>dòng thứ hai</th></tr>
          <tr><td>O</td><td><code>def f(): return 1</code></td><td><code>y = 0</code></td></tr><tr><td>A (đổi tên hàm)</td><td><code>def g(): return 1</code></td><td><code>y = 0</code></td></tr><tr><td>B (dùng hàm)</td><td><code>def f(): return 1</code></td><td><code>y = f()</code></td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước một, xét tệp hai dòng. Ở tổ tiên chung, dòng đầu định nghĩa hàm f, dòng hai đặt y bằng 0. Nhánh A đổi tên hàm thành g. Nhánh B dùng hàm f ở dòng hai."
      - show: |
          <table class="t"><tr><th>dòng</th><th>ai đổi so với O?</th><th>luật</th><th>lấy</th></tr>
          <tr><td>1</td><td>chỉ A</td><td>chỉ A đổi → lấy A</td><td><code>def g(): return 1</code></td></tr>
          <tr><td>2</td><td>chỉ B</td><td>chỉ B đổi → lấy B</td><td><code>y = f()</code></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước hai, áp luật từng dòng. Dòng một chỉ A đổi so với O, nên lấy bản của A. Dòng hai chỉ B đổi, nên lấy bản của B, và không có xung đột nào."
      - clear: true
        show: |
          <div class="code"><div>def g(): return 1</div><div>y = f()   <span class="cm"># NameError: f không còn tồn tại</span></div></div>
          <p><b>Bước 3</b> — chạy bản hợp nhất: <b class="red">lỗi</b>, vì hàm <code>f</code> đã bị đổi tên ở nhánh kia.</p>
        focus: [1, 2, 2]
        say: "Bước ba, chạy bản hợp nhất thì lỗi ngay ở dòng hai. Hàm f đã bị đổi tên thành g ở nhánh kia, nên lời gọi f không còn tìm thấy hàm nào. Lỗi kiểu này chỉ lộ ra khi chạy chương trình hoặc chạy kiểm thử, còn công cụ hợp nhất không bao giờ báo."
      - show: |
          <div class="box key"><b>Bước 4</b> — hợp nhất là theo <b>dòng chữ</b>, không hiểu <b>nghĩa</b>. Sau mỗi lần hợp nhất phải chạy lại toàn bộ kiểm thử.</div>
        say: "Bước bốn, rút ra bài học, hợp nhất làm việc theo dòng chữ, không hiểu nghĩa, nên sau mỗi lần hợp nhất phải chạy lại toàn bộ kiểm thử."

  - id: check
    kind: check
    title: "Tự kiểm: bỏ tổ tiên chung thì sao"
    checks:
      - "[u != v for u, v in zip(['def g(): return 1', 'y = 0'], ['def f(): return 1', 'y = f()'])] == [True, True]"
      - "alg.merge3(['def f(): return 1', 'y = 0'], ['def f(): return 1', 'y = f()'], ['def g(): return 1', 'y = 0']) == ['def g(): return 1', 'y = f()']"
    steps:
      - show: |
          <table class="t"><tr><th>kiểm</th><th>cách khác</th><th>kết quả</th></tr>
          <tr><td>so hai chiều A với B</td><td>cả 2 dòng đều khác</td><td>không biết lấy bên nào — phải hỏi người ✓</td></tr>
          <tr><td>đổi vai A và B</td><td>hợp nhất (O, B, A)</td><td>cùng kết quả — luật không thiên vị bên nào ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác. Nếu bỏ tổ tiên chung và chỉ so A với B, cả hai dòng đều khác, nên công cụ không biết lấy bên nào và phải hỏi người. Nếu đổi vai A và B, hợp nhất vẫn cho cùng kết quả, vì luật không thiên vị bên nào."

  - id: pitfalls
    kind: pitfall
    title: "4 lỗi người mới hay mắc"
    checks:
      - "alg.merge3(['a=1', 'b=1', 'c=1'], ['a = 1', 'b = 1', 'c = 1'], ['a=1', 'b=2', 'c=1'])[1][0] == 'XUNG ĐỘT'"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi “không xung đột” là “đúng” <b class="red">(sai)</b>
          <br><span class="note">Như ví dụ: xung đột ngữ nghĩa không hiện ra ở dòng chữ. Kiểm thử mới bắt được.</span></div>
        say: "Lỗi thứ nhất, coi không xung đột là đúng. Như ví dụ vừa rồi, xung đột về nghĩa không hiện ra ở dòng chữ, chỉ kiểm thử mới bắt được."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Giải xung đột bằng cách chọn đại một bên <b class="red">(mất thay đổi)</b>
          <br><span class="note">Mỗi bên đổi có lý do. Đọc cả hai, hiểu ý định, thường phải viết dòng mới kết hợp cả hai.</span></div>
        say: "Lỗi thứ hai, giải xung đột bằng cách chọn đại một bên. Mỗi bên đổi đều có lý do, nên hãy đọc cả hai, hiểu ý định, và thường phải viết một dòng mới kết hợp cả hai."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Để nhánh sống quá lâu rồi mới gộp <b class="red">(xung đột dồn)</b>
          <br><span class="note">Càng lâu, càng nhiều dòng cùng bị sửa ở hai bên. Gộp thường xuyên, mỗi lần một thay đổi nhỏ.</span></div>
        say: "Lỗi thứ ba, để nhánh sống quá lâu rồi mới gộp. Càng lâu thì càng nhiều dòng bị sửa ở cả hai bên, nên hãy gộp thường xuyên, mỗi lần một thay đổi nhỏ."

      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4.</b> Định dạng lại cả tệp chung với một thay đổi nội dung <b class="red">(xung đột giả)</b>
          <br><span class="note">A chỉ thêm dấu cách quanh dấu bằng ở mọi dòng; B sửa một dòng. Hợp nhất thấy dòng đó bị cả hai đổi khác nhau → xung đột, dù chẳng ai tranh nhau sửa nghĩa.</span></div>
          <table class="t"><tr><th>O</th><th>A (định dạng)</th><th>B (sửa)</th><th>kết quả</th></tr>
          <tr><td><code>b=1</code></td><td><code>b = 1</code></td><td><code>b=2</code></td><td><b class="red">xung đột</b></td></tr></table>
        focus: [1, 1, 2, "2.2"]
        say: "Lỗi thứ tư, định dạng lại cả tệp chung với một thay đổi nội dung. Giả sử A chỉ thêm dấu cách quanh dấu bằng ở mọi dòng, còn B sửa một dòng. Bảng cho thấy dòng đó bị cả hai đổi khác nhau, nên thành xung đột, dù chẳng ai tranh nhau sửa nghĩa. Người làm nghề tách việc định dạng thành một lần lưu riêng, báo trước cho cả nhóm, rồi mới tiếp tục sửa nội dung."
  # ───────────────────────── 6. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.merge3(['a = 1', 'b = 1', 'c = 1'], ['a = 1', 'b = 2', 'c = 3'], ['a = 5', 'b = 2', 'c = 4']) == ['a = 5', 'b = 2', ('XUNG ĐỘT', 'c = 3', 'c = 4')]"
    steps:
      - show: |
          <table class="t"><tr><th></th><th>dòng thứ nhất</th><th>dòng thứ hai</th><th>dòng thứ ba</th></tr>
          <tr><td>O</td><td>a = 1</td><td>b = 1</td><td>c = 1</td></tr>
          <tr><td>A</td><td>a = 1</td><td>b = 2</td><td>c = 3</td></tr>
          <tr><td>B</td><td>a = 5</td><td>b = 2</td><td>c = 4</td></tr></table>
          <p>Hợp nhất từng dòng ra gì?</p>
        focus: [1, 2, 0]
        say: "Bây giờ đến lượt bạn tự làm, với tổ tiên chung và hai nhánh A, B như trong bảng. Hợp nhất từng dòng thì ra gì? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>dòng</th><th>ai đổi so với O?</th><th>kết quả</th></tr>
          <tr><td>1</td><td>chỉ B</td><td><code>a = 5</code></td></tr>
          <tr><td>2</td><td>cả hai, giống nhau</td><td><code>b = 2</code></td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Đáp án, xét từng dòng. Dòng một chỉ B đổi, nên lấy a bằng 5. Dòng hai cả hai bên đổi giống nhau, nên lấy b bằng 2."
      - show: |
          <p>Dòng thứ ba: hai bên đổi <b>khác nhau</b> → $\hl{\text{xung đột}}$ (<code>c = 3</code> hay <code>c = 4</code>) — người phải đọc cả hai thay đổi rồi quyết định.</p>
        say: "Dòng ba, hai bên đổi khác nhau, nên là xung đột giữa c bằng 3 và c bằng 4. Người phải đọc cả hai thay đổi rồi mới quyết định."

  # ───────────────────────── 7. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tổ tiên chung O</span><span class="a">→</span>
          <span class="n">chỉ một bên đổi: lấy bên đổi</span><span class="a">→</span>
          <span class="n">hai bên đổi khác: xung đột</span><span class="a">→</span>
          <span class="n">hợp nhất xong: chạy kiểm thử</span></div>
        say: "Tổng kết lại, hợp nhất ba chiều dựa vào tổ tiên chung. Chỉ một bên đổi thì lấy bên đổi, hai bên đổi khác nhau là xung đột, và hợp nhất xong thì phải chạy kiểm thử."
      - show: |
          <div class="box key"><b>Tư duy:</b> muốn biết “cái gì đã thay đổi” phải có điểm gốc để so. Không có gốc, mọi khác biệt đều mơ hồ.</div>
        say: "Điều cần mang theo, muốn biết cái gì đã thay đổi thì phải có một điểm gốc để so. Không có gốc, mọi khác biệt đều mơ hồ."
      - clear: true
