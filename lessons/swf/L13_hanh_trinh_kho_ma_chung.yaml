scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Từ 5000 tới 50 nghìn kỹ sư trên một kho mã"
    checks:
      - "50000 // 5000 == 10 and 60000 > 50000"
    steps:
      - show: |
          <p>Năm 2010, Google có <b>hơn 5000</b> lập trình viên ở hơn 40 văn phòng, cùng làm trên <b>một cây mã nguồn chung</b>.</p>
          <p>Năm 2020: khoảng <b>50&nbsp;000</b> kỹ sư dùng chung <b>một kho</b>, với <b>60&nbsp;000 tới 70&nbsp;000</b> lần gộp mỗi ngày làm việc.</p>
          <p>Số người tăng gấp <b>10</b>. Vậy làm sao để mỗi lần gộp không phá việc của hàng nghìn người khác?</p>
          <div class="box key">Hôm nay: năm chặng từ 2010 tới 2020 — làm việc trên nhánh chính, kiểm tra trước khi gộp, thay đổi lớn tự động, chủ sở hữu mã.</div>
        focus: [1, 2, 3, 4]
        say: "Chào bạn, năm 2010, Google có hơn 5000 lập trình viên ở hơn 40 văn phòng, cùng làm trên một cây mã nguồn chung. Mười năm sau, khoảng 50 nghìn kỹ sư dùng chung một kho, với 60 tới 70 nghìn lần gộp mỗi ngày làm việc. Số người tăng gấp 10, vậy làm sao để mỗi lần gộp không phá việc của hàng nghìn người khác? Hôm nay ta đi qua năm chặng, với bốn thực hành, làm trên nhánh chính, kiểm tra trước khi gộp, thay đổi lớn tự động, và chủ sở hữu mã."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại bốn điều sẽ dùng"
    checks:
      - "1000 * 15 // 1000 == 15 and 1000 * 1.5 / 100 == 15"
      - "2 ** 4 == 16 and 16 // 2 // 2 // 2 // 2 == 1"
    steps:
      - show: |
          <table class="t"><tr><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 11: hai nhánh tách từ <b>tổ tiên chung</b>; chỉ một bên đổi thì lấy bên đó, cả hai đổi khác nhau là <b>xung đột</b></td><td>tổ tiên x = 1; A đổi thành 2, B giữ 1 → lấy 2</td></tr>
          <tr><td>bài 4: kiểm thử chỉ ra <b>có lỗi</b>, không chứng minh được không có lỗi</td><td>4 ca đều qua mà ba cạnh 1, 2, 3 vẫn bị xếp là tam giác</td></tr>
          <tr><td><b>phần trăm</b>: a% của N là N nhân a chia 100</td><td>1,5% của 1000 là 1000 nhân 1,5 chia 100 = 15</td></tr>
          <tr><td><b>chia đôi</b>: mỗi lần bỏ một nửa</td><td>16 → 8 → 4 → 2 → 1: 4 lần, vì 2 mũ 4 = 16</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng nhắc lại bốn điều. Ở bài 11, hai nhánh tách ra từ một tổ tiên chung, chỉ một bên đổi thì lấy bên đó, còn cả hai đổi khác nhau là xung đột. Ở bài 4, kiểm thử chỉ ra có lỗi, nó không chứng minh được không có lỗi, như bốn ca đều qua mà ba cạnh 1, 2, 3 vẫn bị xếp là tam giác. Phần trăm, 1 phẩy 5 phần trăm của 1000 là 1000 nhân 1 phẩy 5 chia 100, được 15. Chia đôi, 16 xuống 8, 4, 2, rồi 1, mất 4 lần, vì 2 mũ 4 bằng 16."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>kho đơn khối</b> (monorepo)</td><td>một kho chứa gần hết mã của cả công ty</td></tr>
          <tr><td><b>nhánh chính</b> (trunk)</td><td>bản chung mà mọi người gộp vào thường xuyên; không giữ nhánh riêng lâu</td></tr>
          <tr><td><b>kiểm tra trước khi gộp</b></td><td>chạy kiểm thử và duyệt mã trước khi thay đổi vào nhánh chính</td></tr>
          <tr><td><b>kiểm thử chập chờn</b> (flaky)</td><td>lúc qua lúc đỏ mà mã không đổi</td></tr>
          <tr><td><b>thay đổi lớn</b></td><td>nhiều sửa đổi cùng một ý, quá lớn để gộp trong một lần</td></tr>
          <tr><td><b>chủ sở hữu mã</b> (OWNERS)</td><td>người được quyền duyệt thay đổi trong một thư mục</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6", "1.7"]
        say: "Bài dùng sáu thuật ngữ. Kho đơn khối là một kho chứa gần hết mã của cả công ty. Nhánh chính là bản chung mà mọi người gộp vào thường xuyên, không ai giữ nhánh riêng lâu. Kiểm tra trước khi gộp là chạy kiểm thử và duyệt mã trước khi thay đổi vào nhánh chính. Kiểm thử chập chờn là kiểm thử lúc qua lúc đỏ mà mã không đổi. Thay đổi lớn là nhiều sửa đổi cùng một ý, quá lớn để gộp trong một lần. Chủ sở hữu mã là người được quyền duyệt thay đổi trong một thư mục."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="170" cy="150" r="15" fill="#9ca3af"/><text x="170" y="108" font-weight="bold">2010 → 2011</text><text x="170" y="200">hơn 5000 người</text><text x="170" y="232">chỉ chạy kiểm thử bị ảnh hưởng</text>
          <circle cx="510" cy="150" r="15" fill="#2a78d6"/><text x="510" y="108" font-weight="bold">2013</text><text x="510" y="200">máy tự sửa 35 nghìn chỗ</text><text x="510" y="232">chia thành phần nhỏ để duyệt</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2016</text><text x="850" y="200">2 tỉ dòng mã</text><text x="850" y="232">kiểm thử chập chờn</text>
          <circle cx="1190" cy="150" r="15" fill="#eb6834"/><text x="1190" y="108" font-weight="bold">2020</text><text x="1190" y="200">khoảng 50 nghìn kỹ sư</text><text x="1190" y="232">trước khi gộp, chủ sở hữu</text>
          <circle cx="1530" cy="150" r="15" fill="#059669"/><text x="1530" y="108" font-weight="bold">2020 →</text><text x="1530" y="200">một phiên bản</text><text x="1530" y="232">không hợp với mọi nơi</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô rất lớn → ổn định → tiếp tục phát triển</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Từ 2010 tới 2011, hơn 5000 người làm chung, và hệ thống chỉ chạy những kiểm thử bị thay đổi ảnh hưởng. Năm 2013, máy tự sửa 35 nghìn chỗ, chia thành phần nhỏ để duyệt, rồi năm 2016 kho có khoảng 2 tỉ dòng mã và gặp kiểm thử chập chờn. Năm 2020 là quy trình ổn định với khoảng 50 nghìn kỹ sư, và các bài học cho những nơi khác."

  # ───────────────────────── 5. CƠ CHẾ CHUNG ─────────────────────────
  - id: flow
    kind: concept
    title: "Đường đi của một thay đổi vào nhánh chính"
    steps:
      - show: |
          <div><svg width="1600" height="340" viewBox="0 0 1600 340">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="30" y="110" width="250" height="90" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/><text x="155" y="150">kỹ sư</text><text x="155" y="182">thay đổi nhỏ</text>
          <rect x="400" y="110" width="330" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="565" y="150">① trước khi gộp</text><text x="565" y="182">kiểm thử của dự án</text>
          <rect x="835" y="110" width="350" height="90" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="1010" y="150">② duyệt</text><text x="1010" y="182">đồng nghiệp + chủ sở hữu</text>
          <rect x="1270" y="110" width="300" height="90" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="1420" y="150">nhánh chính</text><text x="1420" y="182">một bản chung</text>
          </g>
          <line x1="280" y1="155" x2="395" y2="155" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="730" y1="155" x2="830" y2="155" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="1185" y1="155" x2="1265" y2="155" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <path d="M1420,200 L1420,270 L565,270" fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#ah)"/>
          <g font-size="22" text-anchor="middle">
          <text x="990" y="310" fill="#eb6834">③ sau khi gộp: chạy mọi kiểm thử bị ảnh hưởng; đỏ thì tìm thay đổi gây lỗi, hoàn tác</text>
          </g>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là đường đi chung của một thay đổi. Kỹ sư gửi một thay đổi nhỏ, và trước khi gộp, máy chạy kiểm thử của chính dự án đó. Một đồng nghiệp duyệt, cùng với chủ sở hữu của thư mục bị sửa, rồi thay đổi mới vào nhánh chính. Sau khi gộp, máy chạy mọi kiểm thử bị ảnh hưởng, và nếu có kiểm thử đỏ thì tìm thay đổi gây lỗi rồi hoàn tác nó."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2010 tới 2011 — khai sinh: một cây mã, chạy kiểm thử bị ảnh hưởng"
    stage: {year: "2010 → 2011", scale: "hơn 5000 lập trình viên, hơn 20 thay đổi mỗi phút, 50% mã đổi mỗi tháng, hơn 50 triệu ca kiểm thử mỗi ngày", source: "[ET11] [TB11]", practice: "một cây mã chung, phát triển trên nhánh chính, mọi bản phát hành dựng từ mã nguồn; mỗi thay đổi chỉ chạy các kiểm thử nó ảnh hưởng tới, theo đồ thị phụ thuộc"}
    checks:
      - "20 * 60 == 1200 and 1200 * 24 == 28800"
      - "len({'thư viện chung': {'A', 'B'}, 'dự án A': {'A'}}['thư viện chung']) == 2 and len({'dự án A': {'A'}}['dự án A']) == 1"
    steps:
      - show: |
          <p><b>Quy mô</b> (số liệu bài nói năm 2010, công bố 5/2011): hơn <b>5000</b> lập trình viên; <b>hơn 20 thay đổi mỗi phút</b>; <b>50%</b> mã đổi mỗi tháng; hơn <b>50 triệu</b> ca kiểm thử mỗi ngày.</p>
          <p><b>Cách làm:</b> một cây mã nguồn chung nhiều ngôn ngữ; phát triển trên <b>nhánh chính</b>; mọi bản phát hành dựng từ mã nguồn.</p>
          <p><b>Điểm nghẽn</b> (6/2011): mã càng nhiều, mỗi lần chạy sạch càng lâu, và càng nhiều thay đổi bị dồn vào một lần chạy. Khi đỏ, chỉ biết “thay đổi 2 hoặc 3” gây lỗi.</p>
        focus: [1, 2, 3, 3]
        say: "Ở chặng một, theo số liệu một bài nói năm 2010 của đội công cụ kỹ thuật, Google có hơn 5000 lập trình viên, hơn 20 thay đổi mỗi phút, và một nửa mã đổi mỗi tháng. Họ làm trên một cây mã nguồn chung, phát triển trên nhánh chính, và mọi bản phát hành dựng từ mã nguồn. Điểm nghẽn là mã càng nhiều thì mỗi lần chạy sạch càng lâu, và càng nhiều thay đổi bị dồn vào một lần chạy. Khi có kiểm thử đỏ, hệ thống chỉ biết thay đổi số 2 hoặc số 3 đã gây lỗi."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. thay đổi mỗi giờ</td><td>20 nhân 60</td><td>$\hlb{1200}$</td></tr>
          <tr><td>Bước 2. thay đổi mỗi ngày</td><td>1200 nhân 24</td><td>hơn $\hlg{28\,800}$</td></tr>
          <tr><td>Bước 3. đồ thị phụ thuộc (số minh hoạ): thư viện chung, dự án A và B cùng dùng nó</td><td>sửa thư viện chung → kiểm thử A và B; sửa dự án A → chỉ kiểm thử A</td><td>2 bộ, rồi 1 bộ</td></tr></table>
          <p class="note">Thực hành: chạy đúng các kiểm thử mà thay đổi ảnh hưởng tới, cho <b>từng</b> thay đổi, nên biết ngay thay đổi nào gây lỗi. Điều kiện: đồ thị phụ thuộc được máy dựng ra từ luật dựng, không phải người khai tay.</p>
        focus: ["1.2", "1.3", "1.4", 2, 2]
        say: "Bước một, 20 thay đổi mỗi phút nhân 60 phút được 1200 thay đổi mỗi giờ. Bước hai, nhân 24 giờ được hơn 28 nghìn 800 thay đổi mỗi ngày, không thể chạy hết mọi kiểm thử cho từng cái. Bước ba, với một đồ thị phụ thuộc nhỏ, sửa thư viện chung thì chạy kiểm thử của cả hai dự án, còn sửa dự án A chỉ chạy kiểm thử của A. Nhờ chạy đúng phần bị ảnh hưởng cho từng thay đổi, đội biết ngay thay đổi nào gây lỗi. Điều kiện là đồ thị phụ thuộc được máy dựng từ luật dựng, không phải người khai tay."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
  - id: stage2
    kind: example
    title: "Chặng 2, năm 2013 — tăng trưởng: để máy sửa hàng chục nghìn chỗ"
    stage: {year: "2013", scale: "kho đơn khối nhiều ngôn ngữ; một đợt sửa 35 000 chỗ gọi hàm trên 100 triệu dòng mã; 45 000 chỗ gọi hàm cũ", source: "[CM13]", practice: "công cụ tự sinh thay đổi, chỉ sửa chỗ chứng minh được là an toàn, chia thành nhiều phần nhỏ gửi duyệt riêng"}
    checks:
      - "round(35000 / 3100, 1) == 11.3 and 45000 - 35000 == 10000"
      - "3100 * 2 == 6200 and round(6200 / 60, 1) == 103.3"
    steps:
      - show: |
          <p><b>Quy mô:</b> Google giữ một kho mã nhiều ngôn ngữ trong <b>một kho duy nhất</b>. Một hàm tách chuỗi mới ra đời, nhưng còn khoảng <b>45&nbsp;000</b> chỗ gọi hàm cũ; sửa tay là bất khả.</p>
          <p><b>Cách xử lý</b> (bài báo năm 2013): công cụ đọc mã như trình biên dịch, tìm mọi chỗ gọi, <b>chỉ sửa chỗ chứng minh được là an toàn</b>, rồi tự sinh thay đổi.</p>
          <p>Kết quả: khoảng <b>35&nbsp;000</b> chỗ được sửa, gửi duyệt thành <b>3100 phần</b>; phân vị 80 của thời gian duyệt chỉ hơn <b>2 phút</b>; phần lớn xong trong hai tháng.</p>
        focus: [1, 1, 2, 3, 3]
        say: "Ở chặng hai, năm 2013, Google giữ một kho mã nhiều ngôn ngữ trong một kho duy nhất. Một hàm tách chuỗi mới ra đời, nhưng còn khoảng 45 nghìn chỗ gọi hàm cũ, và sửa tay là bất khả. Theo một bài báo năm 2013, công cụ đọc mã như trình biên dịch, tìm mọi chỗ gọi, và chỉ sửa chỗ chứng minh được là an toàn. Khoảng 35 nghìn chỗ được sửa, gửi duyệt thành 3100 phần. Tám mươi phần trăm số phần được duyệt trong khoảng 2 phút, và phần lớn xong trong hai tháng."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. chỗ sửa mỗi phần</td><td>35&nbsp;000 chia 3100</td><td>≈ $\hlb{11{,}3}$ chỗ</td></tr>
          <tr><td>Bước 2. chỗ máy chưa sửa</td><td>45&nbsp;000 trừ 35&nbsp;000</td><td>$\hl{10\,000}$ chỗ</td></tr>
          <tr><td>Bước 3. nếu mỗi phần duyệt 2 phút (số minh hoạ)</td><td>3100 nhân 2 = 6200 phút, chia 60</td><td>≈ $\hlg{103{,}3}$ giờ duyệt, chia cho nhiều người</td></tr></table>
          <p class="note">Thực hành: thay đổi lớn do máy sinh ra, mỗi phần nhỏ đủ để người duyệt hiểu trong vài phút. Điều kiện: công cụ hiểu mã như trình biên dịch, và bỏ qua chỗ nó không chứng minh được là an toàn.</p>
        focus: ["1.2", "1.3", "1.4", 2, 2]
        say: "Bước một, 35 nghìn chỗ chia cho 3100 phần, mỗi phần khoảng 11 phẩy 3 chỗ sửa, đủ nhỏ để đọc nhanh. Bước hai, 45 nghìn trừ 35 nghìn còn 10 nghìn chỗ máy chưa sửa, vì chưa chứng minh được là an toàn. Bước ba, nếu mỗi phần mất 2 phút duyệt, một số minh hoạ, thì 3100 phần mất 6200 phút, khoảng 103 giờ, chia cho nhiều người duyệt. Thực hành rút ra là để máy sinh thay đổi lớn, và chia nhỏ để người duyệt hiểu trong vài phút. Điều kiện là công cụ hiểu mã như trình biên dịch."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, năm 2016 — quy mô rất lớn: 2 tỉ dòng và kiểm thử chập chờn"
    stage: {year: "2016", scale: "khoảng 2 tỉ dòng mã trong một cây mã; mỗi ngày hơn 13 nghìn dự án, 800 nghìn lần dựng, 150 triệu lần chạy kiểm thử; 1,5% kết quả chập chờn", source: "[FT16] [TM17]", practice: "gom thay đổi vào từng mốc chạy, đo độ chập chờn của từng kiểm thử, chỉ báo đỏ khi đỏ 3 lần liên tiếp (đổi lại chậm phát hiện), gỡ kiểm thử chập chờn khỏi bước trước khi gộp"}
    checks:
      - "1000 * 1.5 / 100 == 15 and 16 / 100 > 1 / 7"
      - "15 * 3 == 45 and 24 * 60 // 45 == 32"
    steps:
      - show: |
          <p><b>Quy mô</b> (dữ liệu 2/2016, bài báo năm 2017): kho khoảng <b>2 tỉ dòng</b> mã, phần lớn là <b>một cây mã đơn khối</b>. Một ngày: hơn <b>13 nghìn</b> dự án, <b>800 nghìn</b> lần dựng, <b>150 triệu</b> lần chạy kiểm thử.</p>
          <p><b>Điểm nghẽn 1:</b> không chạy nổi mọi kiểm thử bị ảnh hưởng cho <b>từng</b> thay đổi; hệ thống gom thay đổi vào từng <b>mốc chạy</b>, giờ cao điểm khoảng <b>45 phút</b> một mốc.</p>
          <p><b>Điểm nghẽn 2</b> (blog 5/2016): khoảng <b>1,5%</b> lần chạy cho kết quả chập chờn; gần <b>16%</b> kiểm thử có lúc chập chờn; khoảng <b>84%</b> lần chuyển từ qua sang đỏ có dính kiểm thử chập chờn.</p>
        focus: [1, 1, 2, 2, 3, 3]
        say: "Ở chặng ba, theo dữ liệu tháng 2 năm 2016, kho có khoảng 2 tỉ dòng mã, phần lớn trong một cây mã đơn khối. Mỗi ngày có hơn 13 nghìn dự án, 800 nghìn lần dựng, và 150 triệu lần chạy kiểm thử. Điểm nghẽn thứ nhất là không chạy nổi mọi kiểm thử bị ảnh hưởng cho từng thay đổi, nên hệ thống gom thay đổi vào từng mốc chạy. Giờ cao điểm, cứ khoảng 45 phút có một mốc chạy. Điểm nghẽn thứ hai là kiểm thử chập chờn, khoảng 1 phẩy 5 phần trăm lần chạy cho kết quả chập chờn. Gần 16 phần trăm kiểm thử có lúc chập chờn, và khoảng 84 phần trăm lần chuyển từ qua sang đỏ có dính kiểm thử chập chờn."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. dự án trung bình có khoảng 1000 kiểm thử</td><td>1000 nhân 1,5 chia 100</td><td>$\hl{15}$ kiểm thử đỏ giả mỗi lần chạy</td></tr>
          <tr><td>Bước 2. kiểm thử bị đánh dấu chập chờn chỉ báo đỏ khi đỏ <b>3 lần liên tiếp</b>; ví dụ trong blog: kiểm thử 15 phút</td><td>15 nhân 3</td><td>$\hlg{45}$ phút mới biết lỗi thật</td></tr>
          <tr><td>Bước 3. nếu mỗi mốc 45 phút suốt 24 giờ</td><td>24 nhân 60 = 1440 phút, chia 45</td><td>$\hlb{32}$ mốc mỗi ngày</td></tr></table>
          <p class="note">Thực hành: đo độ chập chờn của từng kiểm thử; gỡ kiểm thử chập chờn khỏi bước trước khi gộp tới khi sửa xong. Điều kiện: có thống kê lịch sử chạy, để phân biệt “đỏ thật” với “đỏ giả”.</p>
        focus: ["1.2", "1.3", "1.3", "1.4", 2]
        say: "Bước một, bài viết năm 2016 ghi một dự án trung bình có khoảng 1000 kiểm thử, nên 1 phẩy 5 phần trăm là 15 kiểm thử đỏ giả mỗi lần chạy, mà ai cũng phải đi dò. Bước hai, kiểm thử bị đánh dấu chập chờn chỉ báo đỏ khi đỏ 3 lần liên tiếp. Bài viết ấy lấy ví dụ một kiểm thử 15 phút, 15 nhân 3 là 45 phút mới biết đó là lỗi thật, một cái giá phải trả. Bước ba, nếu cả ngày đều 45 phút một mốc, thì 1440 phút chia 45 được 32 mốc mỗi ngày. Thực hành là đo độ chập chờn từng kiểm thử, và gỡ nó khỏi bước trước khi gộp tới khi sửa xong."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
    title: "Chặng 4, năm 2020 — ổn định: trước khi gộp, sau khi gộp, chủ sở hữu"
    stage: {year: "2020", scale: "khoảng 50 000 kỹ sư; hơn 80 TB; 60 000 tới 70 000 lần gộp mỗi ngày làm việc; hơn 50 000 thay đổi và hơn 4 tỉ ca kiểm thử mỗi ngày", source: "[SE20]", practice: "trước khi gộp chỉ chạy kiểm thử của dự án, sau khi gộp chạy mọi kiểm thử bị ảnh hưởng; chia đôi lô để tìm thay đổi gây lỗi; một người đồng ý cộng chủ sở hữu thư mục; thay đổi lớn chia phần theo chủ sở hữu, một người duyệt chung"}
    checks:
      - "4 * 10**9 // 50000 == 80000"
      - "2 ** 4 == 16 and len([16, 8, 4, 2]) == 4"
      - "round(15000 / 700, 1) == 21.4"
    steps:
      - show: |
          <p><b>Quy mô</b> (sách năm 2020 của chính các kỹ sư Google): khoảng <b>50&nbsp;000</b> kỹ sư; hơn <b>80 TB</b> nội dung; <b>60&nbsp;000 tới 70&nbsp;000</b> lần gộp mỗi ngày làm việc, tính cả thay đổi tự động.</p>
          <table class="t"><tr><th>thực hành</th><th>cụ thể</th></tr>
          <tr><td>trước khi gộp</td><td>thường chỉ chạy kiểm thử của <b>dự án</b> đang sửa; không chạy kiểm thử chập chờn</td></tr>
          <tr><td>sau khi gộp</td><td>chạy mọi kiểm thử bị ảnh hưởng, kể cả kiểm thử lớn và chậm; mỗi ngày hơn <b>50&nbsp;000</b> thay đổi, hơn <b>4 tỉ</b> ca kiểm thử</td></tr>
          <tr><td>tìm lỗi trong lô</td><td>tách lô đỏ thành từng thay đổi, hoặc <b>chia đôi</b> lô</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Ở chặng bốn, theo cuốn sách năm 2020 của chính các kỹ sư Google, có khoảng 50 nghìn kỹ sư và 60 tới 70 nghìn lần gộp mỗi ngày làm việc, tính cả thay đổi tự động. Trước khi gộp, họ thường chỉ chạy kiểm thử của dự án đang sửa, và không chạy kiểm thử chập chờn. Sau khi gộp, máy chạy mọi kiểm thử bị ảnh hưởng, kể cả kiểm thử lớn và chậm, với hơn 50 nghìn thay đổi và hơn 4 tỉ ca kiểm thử mỗi ngày. Khi một lô bị đỏ, máy tách lô thành từng thay đổi, hoặc người dùng công cụ chia đôi lô."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. ca kiểm thử cho mỗi thay đổi</td><td>4&nbsp;000&nbsp;000&nbsp;000 chia 50&nbsp;000</td><td>$\hlb{80\,000}$ ca</td></tr>
          <tr><td>Bước 2. lô đỏ có 16 thay đổi (số minh hoạ), chia đôi</td><td>16 → 8 → 4 → 2 → 1</td><td>$\hlg{4}$ lần chạy, thay vì 16</td></tr>
          <tr><td>Bước 3. đợt thay đổi lớn: hơn 700 thay đổi, hơn 15&nbsp;000 tệp mỗi ngày</td><td>15&nbsp;000 chia 700</td><td>≈ $\hl{21{,}4}$ tệp mỗi thay đổi</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Bước một, 4 tỉ ca kiểm thử chia cho 50 nghìn thay đổi, mỗi thay đổi kéo theo khoảng 80 nghìn ca kiểm thử. Bước hai, nếu một lô đỏ có 16 thay đổi, một số minh hoạ, thì chia đôi 16, 8, 4, 2, 1 chỉ mất 4 lần chạy thay vì 16. Bước ba, ở đỉnh một đợt thay đổi lớn, máy gộp hơn 700 thay đổi, chạm hơn 15 nghìn tệp mỗi ngày, tức khoảng 21 phẩy 4 tệp mỗi thay đổi."
      - clear: true
        show: |
          <table class="t"><tr><th>chủ sở hữu và thay đổi lớn</th><th>vì sao</th></tr>
          <tr><td>mỗi thư mục có <b>tệp chủ sở hữu</b>; một tệp thuộc mọi chủ sở hữu ở các thư mục phía trên nó</td><td>biết ngay ai chịu trách nhiệm; dự án mới chỉ cần thêm một tệp</td></tr>
          <tr><td>gộp cần: <b>một</b> đồng nghiệp đồng ý, cộng chủ sở hữu thư mục duyệt</td><td>người duyệt xem đúng sai, chủ sở hữu xem có hợp chỗ này không</td></tr>
          <tr><td>thay đổi lớn: máy chia phần theo chủ sở hữu, giới hạn số phần đang chờ, chạy ưu tiên thấp; thường một người duyệt chung</td><td>chủ sở hữu từng thư mục không có quyền phủ quyết cả đợt</td></tr></table>
        focus: ["1.2", "1.3", "1.4"]
        say: "Còn chủ sở hữu mã, mỗi thư mục có một tệp chủ sở hữu, và một tệp thuộc mọi chủ sở hữu ở các thư mục phía trên nó, nên biết ngay ai chịu trách nhiệm. Muốn gộp cần một đồng nghiệp đồng ý, cộng chủ sở hữu thư mục duyệt, người thứ nhất xem đúng sai, người thứ hai xem có hợp chỗ này không. Với thay đổi lớn, máy chia phần theo chủ sở hữu, giới hạn số phần đang chờ, và thường một người duyệt chung cả đợt."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, năm 2020 — tiếp tục phát triển: một phiên bản cho mỗi phụ thuộc"
    stage: {year: "2020", scale: "khoảng 1000 đội trong kho, chỉ vài đội có nhánh phát triển; 10 tới 20% thay đổi của một dự án là thay đổi lớn; mọi chương trình đang chạy phải dựng lại ít nhất 6 tháng một lần", source: "[SE20]", practice: "luật một phiên bản cho mỗi phụ thuộc; nhánh rất ngắn hoặc không có; tắt tính năng chưa xong lúc chạy; quá 500 chỗ sửa thì dùng công cụ; kho đơn khối chỉ khi mọi dự án chung yêu cầu bảo mật, pháp lý"}
    checks:
      - "1000 * 10 // 100 == 100 and 1000 * 20 // 100 == 200"
      - "12 // 6 == 2 and 501 > 500"
    steps:
      - show: |
          <table class="t"><tr><th>thực hành (2020)</th><th>con số trong sách</th></tr>
          <tr><td><b>một phiên bản</b>: mỗi phụ thuộc trong kho chỉ có một phiên bản để chọn</td><td>tránh phụ thuộc hình thoi, cãi nhau cách gộp, mất việc</td></tr>
          <tr><td>gần như <b>không có nhánh dài</b>; việc chưa xong thì tắt lúc chạy</td><td>khoảng <b>1000</b> đội, chỉ <b>vài</b> đội có nhánh phát triển</td></tr>
          <tr><td>giới hạn độ lệch phiên bản</td><td>mọi chương trình đang chạy phải dựng lại ít nhất <b>6 tháng</b> một lần</td></tr>
          <tr><td>thay đổi lớn là việc thường ngày</td><td><b>10 tới 20%</b> thay đổi của một dự án; quá <b>500</b> chỗ sửa thì nên dùng công cụ</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.4", "1.5"]
        say: "Ở chặng năm, cũng theo sách năm 2020, thực hành đầu tiên là luật một phiên bản, mỗi phụ thuộc trong kho chỉ có một phiên bản để chọn. Luật ấy tránh phụ thuộc hình thoi, tránh cãi nhau về cách gộp và mất việc. Gần như không có nhánh dài, trong khoảng 1000 đội chỉ vài đội có nhánh phát triển, còn việc chưa xong thì tắt lúc chạy. Mọi chương trình đang chạy phải dựng lại ít nhất 6 tháng một lần. Thay đổi lớn chiếm 10 tới 20 phần trăm thay đổi của một dự án, và quá 500 chỗ sửa thì nên dùng công cụ."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. dự án 1000 thay đổi (số minh hoạ)</td><td>10% và 20% của 1000</td><td>$\hlb{100}$ tới $\hlb{200}$ thay đổi do người ngoài dự án</td></tr>
          <tr><td>Bước 2. dựng lại ít nhất 6 tháng một lần</td><td>12 tháng chia 6</td><td>ít nhất $\hlg{2}$ lần mỗi năm</td></tr></table>
          <div class="box key">Sách năm 2020 viết: kho đơn khối <b>không</b> phải câu trả lời cho mọi nơi. Điều quan trọng là <b>một phiên bản</b>. Mọi dự án cùng yêu cầu bảo mật, pháp lý, riêng tư thì một kho là ổn; nếu không, hãy nhắm tới chức năng của một kho bằng cách khác.</div>
        focus: ["1.2", "1.3", 2, 2]
        say: "Bước một, nếu một dự án có 1000 thay đổi, một số minh hoạ, thì 10 tới 20 phần trăm là 100 tới 200 thay đổi do người ngoài dự án làm. Bước hai, 12 tháng chia 6 nghĩa là mỗi chương trình được dựng lại ít nhất 2 lần mỗi năm. Chính cuốn sách viết rằng kho đơn khối không phải câu trả lời cho mọi nơi, điều quan trọng là một phiên bản. Nếu các dự án không cùng yêu cầu bảo mật, pháp lý và riêng tư, hãy đạt chức năng của một kho bằng cách khác."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số của hành trình"
    checks:
      - "28800 / 24 / 60 == 20"
      - "3100 * 11 < 35000 < 3100 * 12"
      - "15 / 1000 * 100 == 1.5"
      - "80000 * 50000 == 4 * 10**9"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>28&nbsp;800 thay đổi mỗi ngày</td><td>chia ngược: 28&nbsp;800 chia 24 chia 60 = 20 mỗi phút ✓</td></tr>
          <tr><td>11,3 chỗ mỗi phần</td><td>kẹp: 3100 nhân 11 = 34&nbsp;100, 3100 nhân 12 = 37&nbsp;200; 35&nbsp;000 nằm giữa ✓</td></tr>
          <tr><td>15 kiểm thử đỏ giả</td><td>tỉ lệ ngược: 15 chia 1000 nhân 100 = 1,5% ✓</td></tr>
          <tr><td>80&nbsp;000 ca mỗi thay đổi</td><td>nhân ngược: 80&nbsp;000 nhân 50&nbsp;000 = 4 tỉ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Chia ngược, 28 nghìn 800 chia 24 giờ rồi chia 60 phút đúng bằng 20 thay đổi mỗi phút. Kẹp hai đầu, 3100 nhân 11 là 34 nghìn 100, nhân 12 là 37 nghìn 200, và 35 nghìn nằm giữa, nên mỗi phần có từ 11 tới 12 chỗ. Tính tỉ lệ ngược, 15 chia 1000 nhân 100 đúng bằng 1 phẩy 5 phần trăm. Nhân ngược, 80 nghìn nhân 50 nghìn đúng bằng 4 tỉ."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Google dùng một kho, nên đội mình cũng phải dùng một kho”</td><td>sách năm 2020 viết: kho đơn khối không phải câu trả lời cho mọi nơi; nó cần công cụ tự xây rất lớn</td><td>giữ <b>một phiên bản</b> cho mỗi phụ thuộc, dù một kho hay nhiều kho</td></tr>
          <tr><td><b class="red">2.</b> “Thay đổi lớn thì gộp một lần cho gọn”</td><td>kho và số người càng lớn, thay đổi lớn nhất gộp được một lần càng <b>nhỏ</b>; lỗi trong 10&nbsp;000 tệp như kim đáy bể, trong 25 tệp thì dễ tìm</td><td>chia thành phần nhỏ, mỗi phần gộp và hoàn tác được riêng</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là nghĩ Google dùng một kho nên đội mình cũng phải dùng một kho. Cuốn sách năm 2020 viết rằng kho đơn khối không phải câu trả lời cho mọi nơi, nên hãy giữ một phiên bản cho mỗi phụ thuộc, dù một kho hay nhiều kho. Bài học sai thứ hai là gộp thay đổi lớn một lần cho gọn. Khi kho càng lớn, thay đổi lớn nhất gộp được một lần lại càng nhỏ, và tìm lỗi trong 10 nghìn tệp như mò kim đáy bể."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Chạy hết mọi kiểm thử trước khi gộp, đỏ là không ai được gộp”</td><td>sách 2020 gọi luật “không ai gộp khi kiểm tra chưa xanh” là có lẽ sai hướng; bước trước khi gộp chỉ chạy kiểm thử nhanh, tin cậy</td><td>kiểm thử nhanh trước khi gộp, kiểm thử lớn sau khi gộp, kèm hoàn tác</td></tr>
          <tr><td><b class="red">4.</b> “Đỏ hoài thì thôi, cứ bỏ qua” (thói quen của con người)</td><td>15 kiểm thử đỏ giả mỗi lần chạy làm người ta quen bỏ qua cả lần đỏ thật; blog năm 2016 so với phi công làm ngơ còi báo động</td><td>đo độ chập chờn, gỡ và sửa kiểm thử chập chờn; đừng tập cho đội thói quen làm ngơ</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba là chạy hết mọi kiểm thử trước khi gộp, và hễ đỏ thì không ai được gộp. Sách năm 2020 gọi luật như vậy là có lẽ sai hướng, nên chạy kiểm thử nhanh và tin cậy trước khi gộp. Kiểm thử lớn để sau khi gộp, kèm cách hoàn tác. Bài học sai thứ tư là thói quen của con người, đỏ hoài thì cứ bỏ qua. Mười lăm kiểm thử đỏ giả mỗi lần chạy làm người ta quen bỏ qua cả lần đỏ thật, nên hãy đo, gỡ và sửa kiểm thử chập chờn."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "40 * 2 == 80 and 80 * 15 == 1200"
      - "2 ** 3 == 8 and len([8, 4, 2]) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống: công ty 40 kỹ sư, 5 đội (số minh hoạ), mỗi người gộp 2 lần mỗi ngày</th></tr>
          <tr><td>1</td><td>một tính năng cần 3 tuần (15 ngày làm việc). Giữ nhánh riêng 3 tuần, hay gộp dần vào nhánh chính?</td></tr>
          <tr><td>2</td><td>5 đội đang ở 5 kho riêng, mỗi kho dùng một phiên bản thư viện ghi nhật ký khác nhau. Gộp thành một kho, hay giữ nhiều kho?</td></tr></table>
        focus: [1, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với một công ty 40 kỹ sư, 5 đội, một số minh hoạ, và mỗi người gộp 2 lần mỗi ngày. Câu một, một tính năng cần 3 tuần, tức 15 ngày làm việc, vậy giữ nhánh riêng 3 tuần hay gộp dần vào nhánh chính? Câu hai, 5 đội đang ở 5 kho riêng, mỗi kho dùng một phiên bản thư viện ghi nhật ký khác nhau, vậy gộp thành một kho hay giữ nhiều kho? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>gộp dần, tính năng chưa xong thì <b>tắt lúc chạy</b></td><td>mỗi lần gộp nhỏ; xung đột được thấy sớm; lỗi tìm bằng chia đôi</td><td>phải viết thêm cờ tắt tính năng, và gỡ cờ khi xong</td></tr>
          <tr><td>nhánh riêng 3 tuần</td><td>nhánh chính không thấy mã dở dang</td><td>nhánh chính đi trước 40 nhân 2 = 80 lần gộp mỗi ngày, 80 nhân 15 = 1200 lần sau 3 tuần; gộp một lần, xung đột dồn lại</td></tr></table>
          <p class="note">Chọn gộp dần. Điều kiện đổi: phần dở không tắt được lúc chạy, ví dụ đổi định dạng dữ liệu đã lưu — khi đó nhánh ngắn, gộp từng bước nhỏ theo thứ tự.</p>
        focus: [1, "1.2", "1.3", "1.3", 2]
        say: "Đáp án câu một có hai lựa chọn. Gộp dần và tắt tính năng chưa xong lúc chạy thì mỗi lần gộp nhỏ, xung đột được thấy sớm, đổi lại phải viết thêm cờ tắt và gỡ cờ khi xong. Nhánh riêng 3 tuần thì nhánh chính đi trước 40 nhân 2 bằng 80 lần gộp mỗi ngày. Sau 15 ngày là 80 nhân 15 bằng 1200 lần gộp, và mọi xung đột dồn vào một lần. Nên chọn gộp dần, trừ khi phần dở không tắt được lúc chạy."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>giữ nhiều kho, nhưng ép <b>một phiên bản</b> thư viện chung</td><td>ít công cụ phải xây; mỗi đội giữ quy trình riêng</td><td>phải có cách đồng bộ phiên bản giữa các kho</td></tr>
          <tr><td>gộp thành một kho</td><td>một phiên bản gần như tự có; đổi thư viện một lần cho cả 5 đội</td><td>cần công cụ kiểm thử theo phụ thuộc, chủ sở hữu từng thư mục</td></tr></table>
          <p class="note">Điều kiện đổi: một đội có yêu cầu bảo mật hay pháp lý riêng thì giữ kho riêng cho đội đó. Lỗi do thư viện chung, 8 thay đổi nghi vấn chia đôi chỉ mất 3 lần chạy.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Đáp án câu hai cũng là một đánh đổi. Giữ nhiều kho nhưng ép một phiên bản thư viện chung thì ít công cụ phải xây, đổi lại phải có cách đồng bộ phiên bản giữa các kho. Gộp thành một kho thì một phiên bản gần như tự có, nhưng cần công cụ kiểm thử theo phụ thuộc và chủ sở hữu từng thư mục. Nếu một đội có yêu cầu bảo mật hay pháp lý riêng, hãy giữ kho riêng cho đội đó. Dù chọn cách nào, 8 thay đổi nghi vấn chia đôi chỉ mất 3 lần chạy."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">một cây mã, chạy kiểm thử bị ảnh hưởng</span><span class="a">→</span>
          <span class="n">máy sửa thay đổi lớn, chia phần nhỏ</span><span class="a">→</span>
          <span class="n">đo và gỡ kiểm thử chập chờn</span><span class="a">→</span>
          <span class="n">trước khi gộp, sau khi gộp, chủ sở hữu</span><span class="a">→</span>
          <span class="n">một phiên bản, hợp với nơi mình</span></div>
        say: "Tổng kết lại hành trình. Một cây mã chung cần chạy đúng kiểm thử bị ảnh hưởng cho từng thay đổi. Thay đổi lớn để máy sửa và chia thành phần nhỏ. Ở quy mô rất lớn, phải đo và gỡ kiểm thử chập chờn. Quy trình ổn định gồm kiểm tra trước khi gộp, kiểm tra sau khi gộp và chủ sở hữu mã, rồi luật một phiên bản cho mọi phụ thuộc."
      - show: |
          <div class="box key"><b>Tư duy:</b> ở quy mô lớn, thay đổi an toàn là thay đổi <b>nhỏ, được máy kiểm và hoàn tác được</b>. Trước khi chép cách của người khổng lồ, hãy tính thử: đội mình bao nhiêu người, mỗi ngày bao nhiêu lần gộp?</div>
        say: "Điều cần mang theo, ở quy mô lớn, thay đổi an toàn là thay đổi nhỏ, được máy kiểm, và hoàn tác được. Trước khi chép cách của người khổng lồ, hãy tính thử đội mình bao nhiêu người, và mỗi ngày bao nhiêu lần gộp."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá SWF. Từ đặc tả, bất biến, kiểm thử, độ phủ, phiên bản và bảo mật, bạn đã đi tới cách hàng chục nghìn kỹ sư cùng giữ một kho mã chạy đúng.</p>
        say: "Đây là bài cuối của khoá nền tảng phần mềm đúng đắn. Từ đặc tả, bất biến, kiểm thử, độ phủ, phiên bản và bảo mật, bạn đã đi tới cách hàng chục nghìn kỹ sư cùng giữ một kho mã chạy đúng. Cảm ơn bạn đã theo học."
