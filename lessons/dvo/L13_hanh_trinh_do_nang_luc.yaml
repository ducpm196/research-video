        focus: [1, "2.2", "2.2", "2.3", "2.3"]
        say: "Ở chặng năm, năm 2023, báo cáo có dữ liệu từ hơn 36 nghìn người làm nghề trong gần mười năm. Lần này nhóm nghiên cứu sửa hai chỗ của chính thước đo. Trước kia, tỉ lệ thay đổi thất bại được chọn trong sáu khoảng như 0 tới 15 phần trăm. Từ 2023 nó là một thanh trượt, chọn bất kỳ giá trị nào từ 0 tới 100. Thời gian khôi phục trước kia gộp mọi sự cố, kể cả động đất làm hỏng trung tâm dữ liệu, nên từ 2023 chỉ tính khôi phục sau một lần triển khai lỗi."
