          <table class="t"><tr><th>năm 2024: năm chỉ số giao hàng</th><th>thuộc mặt nào</th></tr>
          <tr><td>thời gian đưa thay đổi lên; tần suất triển khai; thời gian khôi phục sau triển khai lỗi</td><td>thông lượng</td></tr>
          <tr><td>tỉ lệ thay đổi thất bại; <b>tỉ lệ triển khai phải làm lại</b>: lần triển khai ngoài kế hoạch để sửa lỗi</td><td>độ bất ổn</td></tr></table>
          <div class="box key">Thực hành của báo cáo 2023: lập <b>mốc ban đầu</b> rồi so <b>cùng một ứng dụng qua thời gian</b>; giảm <b>cỡ lô</b> thay đổi để cải thiện cả bốn chỉ số. Ổn định không có nghĩa là thước đo đứng yên.</div>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Năm 2024, nhóm nghiên cứu thêm chỉ số thứ năm, nên nay có năm chỉ số giao hàng. Ba chỉ số thuộc mặt thông lượng, gồm thời gian đưa lên, tần suất triển khai và thời gian khôi phục sau triển khai lỗi. Hai chỉ số thuộc mặt bất ổn, là tỉ lệ thất bại và tỉ lệ triển khai phải làm lại, tức lần triển khai ngoài kế hoạch để sửa lỗi. Báo cáo 2023 khuyên lập mốc ban đầu, rồi so cùng một ứng dụng qua thời gian, và giảm cỡ lô thay đổi. Ổn định không có nghĩa là thước đo đứng yên."

  # ───────────────────────── 11. TỰ KIỂM ─────────────────────────
  - id: check
    kind: check
    title: "Tự kiểm bốn con số bằng đường khác"
    checks:
      - "7 * 208 <= 1460 < 7 * 209"
      - "3.5 * 730 == 2555 and 2555 * 60 == 153300"
      - "round(26940 / 60) == 449 and 26940 / 60 != 440 and (10080 + 43800) / 2 == 26940"
      - "1.5 * 973 <= 1460 < 1.5 * 974"
    steps:
      - show: |
          <table class="t"><tr><th>con số</th><th>đường khác để kiểm</th></tr>
          <tr><td>≈ 208 lần (2016, 2019)</td><td>nhân ngược: 7 nhân 208 = 1456, 7 nhân 209 = 1463; 1460 nằm giữa ✓</td></tr>
          <tr><td>2555 lần (2016)</td><td>đổi đơn vị: 3,5 tháng nhân 730 giờ = 2555 giờ, nhân 60 = 153&nbsp;300 phút ✓</td></tr>
          <tr><td>973 lần (2021)</td><td>nhân ngược: 1,5 nhân 973 = 1459,5, chưa tới 1460 ✓</td></tr>
          <tr><td>440 lần (2017)</td><td>tính lại từ chính số của báo cáo: (10&nbsp;080 + 43&nbsp;800) chia 2 = 26&nbsp;940 phút; chia 60 ≈ <b class="red">449</b>, không phải 440 (lệch)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.5"]
        say: "Ta kiểm lại bốn con số theo đường khác. Nhân ngược, 7 nhân 208 là 1456, 7 nhân 209 là 1463, nên 1460 chia 7 nằm giữa 208 và 209. Đổi đơn vị, 3 phẩy 5 tháng nhân 730 giờ là 2555 giờ, nhân 60 là 153 nghìn 300 phút, khớp cách tính bằng phút. Nhân ngược, 1 phẩy 5 nhân 973 là 1459 phẩy 5, vừa chưa tới 1460. Riêng năm 2017, tính lại từ chính số của báo cáo, 26 nghìn 940 phút chia 60 được khoảng 449. Báo cáo lại ghi 440, nên ta ghi lại chỗ lệch này, và không đoán lý do."

  # ───────────────────────── 12. BÀI HỌC SAI ─────────────────────────
  - id: pitfalls
    kind: pitfall
    title: "Những bài học sai khi đọc hành trình này"
    steps:
      - show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">1.</b> “Cuối năm mọi đội phải thành nhóm tinh hoa”</td><td>báo cáo 2023 ghi: đặt chỉ số làm mục tiêu như vậy làm các đội dễ <b>lách số</b>; khi một số đo thành mục tiêu, nó không còn là số đo tốt</td><td>dùng chỉ số để tìm chỗ nghẽn, không để thi đua giữa các đội</td></tr>
          <tr><td><b class="red">2.</b> “Đội giỏi triển khai nhiều gấp 973 lần, ta mua đúng công cụ của họ là được”</td><td>bội số so hai đầu của cùng một năm, dựa trên điểm giữa của khoảng; 973 lớn vì nhóm thấp tụt</td><td>so đội mình với chính mình qua thời gian</td></tr></table>
        focus: [1, "1.2", "1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bảng có hai bài học sai đầu tiên. Bài học sai thứ nhất là ra lệnh cuối năm mọi đội phải thành nhóm tinh hoa. Báo cáo năm 2023 ghi rằng đặt chỉ số làm mục tiêu như vậy làm các đội dễ lách số. Đó là ý của một định luật kinh tế, khi một số đo thành mục tiêu, nó không còn là số đo tốt. Hãy dùng chỉ số để tìm chỗ nghẽn, không để thi đua giữa các đội. Bài học sai thứ hai là nghĩ đội giỏi triển khai nhiều gấp 973 lần, nên mua đúng công cụ của họ là được. Bội số chỉ so hai đầu của cùng một năm, dựa trên điểm giữa của khoảng, nên hãy so đội mình với chính mình qua thời gian."
      - clear: true
        show: |
          <table class="t"><tr><th>bài học sai</th><th>vì sao sai</th><th>nên làm</th></tr>
          <tr><td><b class="red">3.</b> “Tăng tốc trước, chất lượng tính sau”</td><td>năm 2017 nhóm thấp tăng tốc, nhưng khôi phục chậm từ 24 lên 96 lần, tỉ lệ thất bại gấp 5 thay vì gấp 3</td><td>tăng tần suất cùng với kiểm thử tự động và quay lui</td></tr>
          <tr><td><b class="red">4.</b> “Con số in trong báo cáo lớn là cứ thế mà trích”</td><td>tính lại năm 2017 ra 449, không phải 440; thước đo cũng đã được sửa năm 2023 và 2024</td><td>tự tính lại từ số gốc; ghi rõ năm và định nghĩa khi trích</td></tr></table>
        focus: ["1.2", "1.2", "1.3", "1.3", "1.3"]
        say: "Bài học sai thứ ba là tăng tốc trước, chất lượng tính sau. Năm 2017, nhóm thấp tăng tốc thật, nhưng khoảng cách khôi phục rộng từ 24 lên 96 lần, và tỉ lệ thất bại thành gấp 5 thay vì gấp 3. Bài học sai thứ tư là thấy con số in trong báo cáo lớn thì cứ thế mà trích. Tính lại năm 2017 ra 449 chứ không phải 440, và chính thước đo cũng đã được sửa trong năm 2023 và 2024. Hãy tự tính lại từ số gốc, và khi trích thì ghi rõ năm cùng định nghĩa."

  # ───────────────────────── 13. QUYẾT ĐỊNH ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Bạn sẽ làm gì ở quy mô của mình?"
    checks:
      - "3 / 12 == 0.25 and 15 < 25 < 64"
      - "__import__('math').ceil(__import__('math').log2(60)) == 6 and 60 // 4 == 15 and __import__('math').ceil(__import__('math').log2(15)) == 4 and 12 * 4 == 48"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>tình huống (số minh hoạ): một ứng dụng, mỗi tháng triển khai 1 lần, mỗi lần gom khoảng 60 thay đổi; năm qua 3 trong 12 lần gây lỗi</th></tr>
          <tr><td>1</td><td>tính tần suất và tỉ lệ thất bại. Đặt tỉ lệ đó cạnh bảng năm 2023, đội mình “thuộc nhóm nào”?</td></tr>
          <tr><td>2</td><td>lãnh đạo muốn ra chỉ tiêu “triển khai mỗi ngày từ quý sau”. Bạn chọn chỉ tiêu đó, hay giảm dần cỡ lô và đo chính mình?</td></tr></table>
        focus: [1, 1, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn ra quyết định, với một ứng dụng mỗi tháng triển khai một lần, mỗi lần gom khoảng 60 thay đổi. Năm qua, 3 trong 12 lần triển khai gây lỗi, đều là số minh hoạ. Câu một, hãy tính tần suất và tỉ lệ thất bại, rồi đặt cạnh bảng năm 2023 xem đội mình thuộc nhóm nào. Câu hai, lãnh đạo muốn ra chỉ tiêu triển khai mỗi ngày từ quý sau, vậy bạn chọn chỉ tiêu đó, hay giảm dần cỡ lô và đo chính mình? Dừng video và viết ra giấy."
        pause: 20
      - clear: true
        show: |
          <table class="t"><tr><th>câu 1: bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>Bước 1. tần suất</td><td>1 lần mỗi tháng</td><td>12 lần mỗi năm</td></tr>
          <tr><td>Bước 2. tỉ lệ thất bại</td><td>3 chia 12</td><td>$\hl{25\%}$</td></tr>
          <tr><td>Bước 3. so bảng 2023</td><td>15% của nhóm trung bình, 64% của nhóm thấp</td><td>25% nằm giữa hai mức</td></tr></table>
          <p class="note">Nhưng nhóm do báo cáo tạo ra từ <b>cả bốn chỉ số</b> của nhiều đội; một chỉ số không xếp được đội mình. Dùng 12 lần và 25% làm <b>mốc ban đầu</b>.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Đáp án câu một có ba bước. Bước một, một lần mỗi tháng là 12 lần mỗi năm. Bước hai, 3 chia 12 được tỉ lệ thất bại 25 phần trăm. Bước ba, 25 phần trăm nằm giữa 15 phần trăm của nhóm trung bình và 64 phần trăm của nhóm thấp trong bảng năm 2023. Nhưng nhóm do báo cáo tạo ra từ cả bốn chỉ số của nhiều đội, nên một chỉ số không xếp được đội mình, hãy dùng hai số này làm mốc ban đầu."
      - clear: true
        show: |
          <table class="t"><tr><th>câu 2: lựa chọn</th><th>được</th><th>mất</th></tr>
          <tr><td>chỉ tiêu “mỗi ngày” từ quý sau</td><td>số đẹp nhanh, dễ báo cáo</td><td>dễ lách số bằng chia nhỏ giả tạo (bài 9); thiếu kiểm thử tự động thì lặp lại năm 2017: nhanh hơn mà hỏng nhiều hơn</td></tr>
          <tr><td>giảm dần cỡ lô: mỗi tuần một lần, khoảng 60 chia 4 = 15 thay đổi</td><td>chia đôi tìm lỗi cần 4 lần thay vì 6; 48 lần mỗi năm; mỗi tháng so với mốc</td><td>phải đầu tư kiểm thử tự động và quay lui trước</td></tr></table>
          <p class="note">Chọn giảm dần cỡ lô. Điều kiện đổi: khi kiểm thử tự động và quay lui đã chạy tốt, tỉ lệ thất bại không tăng sau mỗi bước, mới tiến tiếp tới mỗi ngày.</p>
        focus: [1, "1.2", "1.3", "1.3", 2]
        say: "Đáp án câu hai là một đánh đổi. Chỉ tiêu mỗi ngày cho số đẹp nhanh, nhưng dễ bị lách bằng chia nhỏ giả tạo như ở bài 9, và thiếu kiểm thử tự động thì lặp lại năm 2017, nhanh hơn mà hỏng nhiều hơn. Giảm dần cỡ lô xuống mỗi tuần một lần thì 60 chia 4 còn khoảng 15 thay đổi, nên chia đôi tìm lỗi chỉ cần 4 lần thay vì 6. Đổi lại, phải đầu tư kiểm thử và quay lui trước. Chỉ khi hai thứ đó chạy tốt và tỉ lệ thất bại không tăng sau mỗi bước, mới tiến tiếp tới mỗi ngày."

  # ───────────────────────── 14. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi hành trình & tư duy chuyên gia"
    steps:
      - show: |
          <div class="chain"><span class="n">2014: ba chỉ số, đo cả hai mặt</span><span class="a">→</span>
          <span class="n">2016–2017: nhanh phải kèm chất lượng</span><span class="a">→</span>
          <span class="n">2018–2019: bốn chỉ số, nhóm tinh hoa</span><span class="a">→</span>
          <span class="n">2021: hai phần ba ở nhóm cao</span><span class="a">→</span>
          <span class="n">2023–2024: sửa thước đo, năm chỉ số</span></div>
        say: "Tổng kết lại hành trình. Năm 2014 có ba chỉ số đầu tiên, đo cả thông lượng lẫn độ ổn định. Năm 2016 và 2017 cho thấy nhanh phải kèm chất lượng. Năm 2018 và 2019 có bốn chỉ số và nhóm tinh hoa. Năm 2021, hai phần ba các đội ở nhóm cao. Năm 2023 và 2024, nhóm nghiên cứu sửa lại thước đo và nay dùng năm chỉ số."
      - show: |
          <div class="box key"><b>Tư duy:</b> một con số đo năng lực chỉ có ích khi bạn biết nó được <b>tạo ra thế nào</b>, so <b>với chính mình qua thời gian</b>, và đo <b>cả tốc độ lẫn độ ổn định</b>. Tự tính lại trước khi trích.</div>
        say: "Điều cần mang theo, một con số đo năng lực chỉ có ích khi bạn biết nó được tạo ra thế nào, so với chính mình qua thời gian, và đo cả tốc độ lẫn độ ổn định. Trước khi trích một con số, hãy tự tính lại."
      - clear: true
        show: |
          <p class="note">Đây là bài cuối của khoá DVO. Từ vòng phản hồi và lô nhỏ, qua tích hợp, đường ống, phát hành tiệm tiến, bốn chỉ số, sự cố và bảo mật đường ống, bạn đã đi tới cách đọc mười năm số liệu về năng lực giao phần mềm.</p>
        say: "Đây là bài cuối của khoá DevOps. Bạn đã đi từ vòng phản hồi và lô nhỏ, qua tích hợp, đường ống, phát hành tiệm tiến, bốn chỉ số, sự cố và bảo mật đường ống. Cuối cùng, bạn đã học cách đọc mười năm số liệu về năng lực giao phần mềm. Cảm ơn bạn đã theo học."
