          <tr><td>Bước 2. thời gian nhóm thấp: 1 tới 6 tháng</td><td>(730 + 4380) chia 2 giờ</td><td>2555 giờ</td></tr>
          <tr><td>Bước 3. nhóm tinh hoa: dưới 1 ngày, lấy 24 giờ</td><td>2555 chia 24</td><td>≈ $\hlg{106{,}5}$, báo cáo ghi 106 lần</td></tr></table>
          <p class="note">Thực hành: so <b>cả bốn chỉ số cùng lúc</b>. Điều kiện: báo cáo tự ghi mọi bội số là <b>tương đối</b>, so nhóm cao nhất với nhóm thấp nhất của từng năm.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 2]
        say: "Làm thử ba phép tính với số của năm 2019. Bước một, 20 chia 7 được khoảng 2 phẩy 86, đúng là gần gấp ba. Bước hai, nhóm thấp mất từ một tới sáu tháng, tức điểm giữa của 730 và 4380 giờ, được 2555 giờ. Bước ba, nhóm tinh hoa dưới một ngày, lấy 24 giờ, và 2555 chia 24 được khoảng 106 phẩy 5, báo cáo ghi 106 lần. Thực hành rút ra là so cả bốn chỉ số cùng lúc. Điều kiện là báo cáo tự ghi mọi bội số là tương đối, so nhóm cao nhất với nhóm thấp nhất của từng năm."

  # ───────────────────────── 9. CHẶNG 4 ─────────────────────────
  - id: stage4
    kind: example
