        say: "Báo cáo năm 2017 đoán rằng nhóm thấp tăng tốc mà chưa đầu tư xây chất lượng vào quy trình, nên sự cố lớn hơn và khôi phục lâu hơn. Thực hành rút ra là tăng tần suất cùng lúc với kiểm thử tự động và khả năng quay lui. Điều kiện để đọc đúng là bội số chỉ là so sánh tương đối giữa hai nhóm trong cùng năm."

  # ───────────────────────── 8. CHẶNG 3 ─────────────────────────
  - id: stage3
    kind: example
    title: "Chặng 3, 2018 tới 2019 — quy mô lớn: bốn chỉ số và nhóm tinh hoa"
    stage: {year: "2018 → 2019", scale: "hơn 31 000 người làm nghề; nhóm tinh hoa 7% (2018) lên 20% (2019)", source: "[SD18] [SD19] [DH26]", practice: "báo cáo trung vị vì phân bố lệch; so cả bốn chỉ số cùng lúc; đọc bội số như so sánh tương đối"}
    checks:
      - "round(20 / 7, 2) == 2.86 and 7 * 3 == 21"
      - "(730 + 4380) / 2 == 2555 and round(2555 / 24, 1) == 106.5 and round(1460 / 7) == 209"
    steps:
      - show: |
          <p><b>2018:</b> dữ liệu lộ ra một nhóm thứ tư, <b>nhóm tinh hoa</b>, chiếm <b>7%</b>. Báo cáo dùng <b>trung vị</b> vì phân bố không chuẩn. Bốn chỉ số được giữ làm lõi, thêm <b>độ sẵn sàng</b> để đo vận hành.</p>
          <table class="t"><tr><th>nhóm</th><th>2018</th><th>2019</th></tr>
          <tr><td>tinh hoa</td><td>7%</td><td>$\hlg{20\%}$</td></tr>
          <tr><td>cao</td><td>48%</td><td>23%</td></tr>
          <tr><td>trung bình</td><td>37%</td><td>44%</td></tr>
          <tr><td>thấp</td><td>15%</td><td>12%</td></tr></table>
        focus: [1, 1, 1, "2.2", "2.5"]
        say: "Ở chặng ba, năm 2018, dữ liệu lộ ra một nhóm thứ tư là nhóm tinh hoa, chiếm 7 phần trăm. Báo cáo dùng trung vị vì phân bố không chuẩn, đúng lý do ta đã gặp ở bài 9, khi một giá trị 26 giờ kéo trung bình lên 8 phẩy 8. Bốn chỉ số được giữ làm lõi, và báo cáo thêm độ sẵn sàng để đo phần vận hành. Bảng cho thấy từ 2018 sang 2019, nhóm tinh hoa tăng từ 7 lên 20 phần trăm. Nhóm thấp giảm từ 15 xuống 12 phần trăm."
      - clear: true
        show: |
          <table class="t"><tr><th>bước (số của báo cáo 2019)</th><th>phép tính</th><th>kết quả</th></tr>
