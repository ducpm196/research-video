# Quy ước: “nhóm hiệu năng” = cụm (cluster) mà báo cáo chia người trả lời: tinh hoa (elite), cao, trung bình, thấp.
#   “chuẩn hoá khoảng” = báo cáo đổi một khoảng trả lời (ví dụ “từ mỗi tháng một lần tới sáu tháng một lần”) thành một số, lấy điểm giữa.
#   “bội số” = số của nhóm thấp nhất chia số của nhóm cao nhất CÙNG năm (báo cáo gọi là “relative”).
#   Mọi sự kiện và con số có nguồn ghi trong audit/dvo/sources_L13.md. Con số khác là phép tính lại (checks) hoặc ghi “(số minh hoạ)”:
#   đội 12 lần mỗi năm, 20 và 10 lần lỗi, đội trong quiz (12 lần mỗi năm, 3 lần lỗi, lô 60 thay đổi) là SỐ MINH HOẠ.
#   Lời đọc không nói “DORA”, “Puppet”, “elite”, “MTTR”, “rework”: nói “chương trình nghiên cứu về DevOps, nay thuộc Google”,
#   “báo cáo Hiện trạng DevOps năm …”, “nhóm tinh hoa”, “thời gian khôi phục”, “tỉ lệ triển khai phải làm lại”. Phát âm: probe p2.
objectives:
  - "Kể lại mười năm đo năng lực giao phần mềm qua năm chặng từ 2014 tới 2024, mỗi chặng một điểm nghẽn và một cách xử lý"
  - "Tính lại các bội số của báo cáo từ cách chuẩn hoá khoảng, và tự phát hiện chỗ con số không khớp"
  - "Chọn cách cải thiện hợp với đội của chính mình, kèm điều kiện đổi lựa chọn"
asr_reviewed:
  - {sentence: "Nó ghi rằng triển khai thường là điểm đau lớn nhất khiến các đội bắt đầu làm DevOps.", reason: "ASR chép “Nó ghi rằng triển khai thường là điểm đau lớn nhất khiến các đội bắt đầu làm Devo” (0.944): DevOps đọc thô (probe DVO p1: 6/8, NOT_VERIFIED) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Triển khai nhiều gấp 973 lần, thật hay không?"
    checks:
      - "round(1460 / 1.5) == 973"
    steps:
      - show: |
          <p>Báo cáo Hiện trạng DevOps năm 2021 ghi: nhóm tinh hoa triển khai <b>thường xuyên hơn 973 lần</b> nhóm thấp nhất, và kèm một câu: “Yes, you read correctly. This is not an editorial error.”</p>
          <p>Năm 2014, chính nhóm nghiên cứu ấy còn chưa có một định nghĩa đo được cho “làm phần mềm giỏi”.</p>
          <div class="box key">Hôm nay: năm chặng từ 2014 tới 2024 — đo năng lực giao phần mềm thế nào, mỗi con số từ đâu ra, và dùng nó sao cho không tự lừa mình.</div>
        focus: [1, 1, 2, 3]
        say: "Chào bạn, báo cáo Hiện trạng DevOps năm 2021 ghi rằng nhóm tinh hoa triển khai thường xuyên hơn nhóm thấp nhất tới 973 lần. Báo cáo còn kèm một câu, bạn đọc không nhầm đâu, đây không phải lỗi biên tập. Thế mà năm 2014, chính nhóm nghiên cứu ấy còn chưa có định nghĩa đo được cho làm phần mềm giỏi. Hôm nay ta đi qua năm chặng từ 2014 tới 2024, xem mỗi con số từ đâu ra, và dùng nó thế nào để không tự lừa mình."

  # ───────────────────────── 2. ÔN NỀN ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại ba điều từ các bài trước"
    checks:
      - "3 / 40 == 0.075 and sorted([2, 5, 26, 8, 3])[2] == 5 and sum([2, 5, 26, 8, 3]) / 5 == 8.8"
      - "__import__('math').ceil(__import__('math').log2(300)) == 9 and __import__('math').ceil(__import__('math').log2(3)) == 2"
      - "round(720 / 721 * 100, 3) == 99.861"
    steps:
      - show: |
          <table class="t"><tr><th>bài</th><th>điều đã học</th><th>ví dụ số</th></tr>
          <tr><td>bài 0</td><td><b>lô nhỏ</b> dễ tìm lỗi: tìm thay đổi gây lỗi bằng chia đôi</td><td>lô 3 thay đổi → tối đa 2 lần dựng kiểm; lô 300 → 9 lần</td></tr>
          <tr><td>bài 9</td><td><b>bốn chỉ số</b>: tần suất triển khai, thời gian đưa thay đổi lên, tỉ lệ thay đổi thất bại, thời gian khôi phục</td><td>3 lần lỗi trong 40 lần → 7,5%; thời gian đưa lên 2, 5, 26, 8, 3 giờ → trung vị 5, trung bình 8,8</td></tr>
          <tr><td>bài 10</td><td><b>độ sẵn sàng</b> = thời gian chạy chia tổng thời gian</td><td>hỏng mỗi 720 giờ, sửa 1 giờ → 99,861%</td></tr></table>
        focus: [1, "1.2", "1.3", "1.3", "1.4"]
        say: "Bảng nhắc lại ba điều từ các bài trước. Ở bài 0, lô nhỏ dễ tìm lỗi, chia đôi một lô 3 thay đổi cần tối đa 2 lần dựng kiểm, còn lô 300 thay đổi cần 9 lần. Ở bài 9, bốn chỉ số là tần suất triển khai, thời gian đưa thay đổi lên, tỉ lệ thay đổi thất bại và thời gian khôi phục. Ví dụ 3 lần lỗi trong 40 lần là 7 phẩy 5 phần trăm, còn dãy 2, 5, 26, 8, 3 giờ có trung vị 5 mà trung bình 8 phẩy 8. Ở bài 10, hỏng mỗi 720 giờ và sửa mất 1 giờ thì độ sẵn sàng là 99 phẩy 861 phần trăm."

  # ───────────────────────── 3. NGÔN NGỮ ─────────────────────────
  - id: sym
    kind: symbol
    title: "Ngôn ngữ của hành trình"
    steps:
      - show: |
          <table class="t"><tr><th>thuật ngữ</th><th>nghĩa</th></tr>
          <tr><td><b>thông lượng</b></td><td>thay đổi đi qua nhanh và nhiều cỡ nào: tần suất triển khai, thời gian đưa thay đổi lên</td></tr>
          <tr><td><b>độ ổn định</b></td><td>thay đổi có làm hỏng không, hỏng thì bao lâu khôi phục</td></tr>
          <tr><td><b>nhóm hiệu năng</b></td><td>báo cáo chia người trả lời thành nhóm: tinh hoa, cao, trung bình, thấp</td></tr>
          <tr><td><b>chuẩn hoá khoảng</b></td><td>đổi một khoảng trả lời thành một con số, thường lấy điểm giữa</td></tr>
          <tr><td><b>bội số</b></td><td>số của nhóm thấp nhất chia số của nhóm cao nhất, trong cùng một năm</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5", "1.6"]
        say: "Bài dùng năm thuật ngữ. Thông lượng là thay đổi đi qua nhanh và nhiều cỡ nào, đo bằng tần suất triển khai và thời gian đưa thay đổi lên. Độ ổn định là thay đổi có làm hỏng gì không, và hỏng thì bao lâu khôi phục. Nhóm hiệu năng là cách báo cáo chia người trả lời thành nhóm tinh hoa, cao, trung bình và thấp. Chuẩn hoá khoảng là đổi một khoảng trả lời thành một con số, thường lấy điểm giữa. Bội số là số của nhóm thấp nhất chia số của nhóm cao nhất, trong cùng một năm."

  # ───────────────────────── 4. DÒNG THỜI GIAN ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Năm chặng trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1700" height="320" viewBox="0 0 1700 320">
          <line x1="30" y1="150" x2="1670" y2="150" stroke="#1f2937" stroke-width="3"/>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <circle cx="160" cy="150" r="15" fill="#9ca3af"/><text x="160" y="108" font-weight="bold">2014</text><text x="160" y="200">ba chỉ số đầu tiên</text><text x="160" y="232">9200 câu trả lời</text>
          <circle cx="500" cy="150" r="15" fill="#2a78d6"/><text x="500" y="108" font-weight="bold">2016 → 2017</text><text x="500" y="200">triển khai thường xuyên</text><text x="500" y="232">nhanh mà phải giữ ổn định</text>
          <circle cx="850" cy="150" r="15" fill="#7c3aed"/><text x="850" y="108" font-weight="bold">2018 → 2019</text><text x="850" y="200">bốn chỉ số, nhóm tinh hoa</text><text x="850" y="232">7% rồi 20%</text>
          <circle cx="1200" cy="150" r="15" fill="#eb6834"/><text x="1200" y="108" font-weight="bold">2021</text><text x="1200" y="200">hai phần ba ở nhóm cao</text><text x="1200" y="232">thêm độ tin cậy</text>
          <circle cx="1540" cy="150" r="15" fill="#059669"/><text x="1540" y="108" font-weight="bold">2023 → 2024</text><text x="1540" y="200">sửa chính thước đo</text><text x="1540" y="232">năm chỉ số giao hàng</text>
          </g>
          <text x="850" y="300" font-size="23" fill="#6b7280" text-anchor="middle">khai sinh → tăng trưởng → quy mô lớn → rất nhiều đội cùng đo → ổn định và tiếp tục cải tiến</text>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình là trục thời gian với năm chặng. Năm 2014, từ hơn 9200 câu trả lời, nhóm nghiên cứu chốt ba chỉ số đầu tiên, rồi 2016 và 2017 là chuyện triển khai thường xuyên mà vẫn giữ ổn định. Năm 2018 và 2019 có đủ bốn chỉ số và nhóm tinh hoa, tăng từ 7 lên 20 phần trăm. Năm 2021, hai phần ba ở nhóm cao, rồi 2023 và 2024 nhóm nghiên cứu sửa lại chính thước đo của mình."

  # ───────────────────────── 5. CƠ CHẾ CHUNG ─────────────────────────
  - id: normalize
    kind: concept
    title: "Cơ chế chung: một bội số được làm ra thế nào"
    checks:
      - "(2 + 12) / 2 == 7 and 4 * 365 == 1460 and round(1460 / 7, 1) == 208.6"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340">
          <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto"><path d="M0,0 L16,6 L0,12 z" fill="#1f2937"/></marker></defs>
          <g font-size="24" text-anchor="middle" fill="#1f2937">
          <rect x="40" y="40" width="420" height="110" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="250" y="82">nhóm thấp trả lời một khoảng</text><text x="250" y="118">từ 2 tới 12 lần mỗi năm</text>
          <rect x="40" y="200" width="420" height="110" rx="10" fill="#e0ecfb" stroke="#2a78d6" stroke-width="3"/><text x="250" y="242">nhóm cao: “theo nhu cầu”</text><text x="250" y="278">nhiều lần mỗi ngày</text>
          <rect x="600" y="40" width="380" height="110" rx="10" fill="#fff7ed" stroke="#eb6834" stroke-width="3"/><text x="790" y="82">lấy điểm giữa</text><text x="790" y="118">(2 + 12) chia 2 = 7</text>
          <rect x="600" y="200" width="380" height="110" rx="10" fill="#fff7ed" stroke="#eb6834" stroke-width="3"/><text x="790" y="242">chọn 4 lần mỗi ngày</text><text x="790" y="278">4 nhân 365 = 1460</text>
          <rect x="1120" y="120" width="340" height="110" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="1290" y="162">bội số</text><text x="1290" y="198">1460 chia 7 ≈ 208,6</text>
          </g>
          <line x1="460" y1="95" x2="595" y2="95" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="460" y1="255" x2="595" y2="255" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="980" y1="95" x2="1115" y2="160" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          <line x1="980" y1="255" x2="1115" y2="195" stroke="#1f2937" stroke-width="3" marker-end="url(#ah)"/>
          </svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình này là cơ chế chung của mọi bội số trong bài. Người trả lời khảo sát không ghi một con số, mà chọn một khoảng, ví dụ nhóm thấp chọn từ 2 tới 12 lần mỗi năm. Báo cáo đổi khoảng đó thành điểm giữa, 2 cộng 12 chia 2 là 7, còn nhóm cao triển khai theo nhu cầu được chọn là 4 lần mỗi ngày, tức 1460 lần mỗi năm. Chia 1460 cho 7 được khoảng 208 phẩy 6, và đó là gốc của câu triển khai thường xuyên hơn hai trăm lần."

  # ───────────────────────── 6. CHẶNG 1 ─────────────────────────
  - id: stage1
    kind: example
    title: "Chặng 1, năm 2014 — khai sinh: định nghĩa “làm phần mềm giỏi” bằng số"
    stage: {year: "2014", scale: "hơn 9200 câu trả lời khảo sát; năm trước nhóm cao triển khai thường gấp 30 lần, ít lỗi hơn 50%", source: "[SD14] [DH26]", practice: "đo cả thông lượng lẫn độ ổn định; quản lý phiên bản mọi thứ chạy thật, giao liên tục, kiểm thử tự động, theo dõi sức khoẻ hệ thống"}
    checks:
      - "12 * 30 == 360 and round(360 / 365, 2) == 0.99 and 20 * (1 - 0.5) == 10"
    steps:
      - show: |
          <p><b>Quy mô:</b> báo cáo 2014 phân tích <b>hơn 9200</b> câu trả lời. Nó ghi: triển khai thường là <b>điểm đau lớn nhất</b> khiến các đội bắt đầu làm DevOps.</p>
          <table class="t"><tr><th>điểm nghẽn: đo cái gì?</th><th>cách nhóm nghiên cứu xử lý</th></tr>
          <tr><td>bắt đầu từ bốn biến: tần suất triển khai, thời gian đưa thay đổi lên, thời gian khôi phục, tỉ lệ thay đổi thất bại</td><td>kiểm thống kê xem chúng có cùng đo một thứ không</td></tr>
          <tr><td>tỉ lệ thay đổi thất bại <b>không tương quan</b> đáng kể với ba biến kia</td><td>năm 2014 chỉ giữ <b>ba chỉ số</b>; đo theo hai mặt: thông lượng và độ ổn định</td></tr></table>
        focus: [1, 1, "2.2", "2.2", "2.3", "2.3"]
        say: "Ở chặng một, báo cáo năm 2014 phân tích hơn 9200 câu trả lời khảo sát. Nó ghi rằng triển khai thường là điểm đau lớn nhất khiến các đội bắt đầu làm DevOps. Điểm nghẽn đầu tiên là phải đo cái gì, nên nhóm nghiên cứu bắt đầu từ bốn biến. Họ kiểm bằng thống kê xem bốn biến có cùng đo một thứ không. Tỉ lệ thay đổi thất bại không tương quan đáng kể với ba biến kia. Vì thế năm 2014 họ chỉ giữ ba chỉ số, và đo theo hai mặt là thông lượng và độ ổn định."
      - clear: true
        show: |
          <table class="t"><tr><th>chỉ số</th><th>thực hành đi cùng (báo cáo 2014)</th></tr>
          <tr><td>tần suất triển khai</td><td>giao liên tục: phần mềm luôn ở trạng thái phát hành được; quản lý phiên bản mọi thứ chạy thật</td></tr>
          <tr><td>thời gian đưa thay đổi lên</td><td>quản lý phiên bản; bộ kiểm thử tự động đáng tin</td></tr>
          <tr><td>thời gian khôi phục</td><td>quản lý phiên bản để triển khai lại bản tốt gần nhất; theo dõi sức khoẻ hệ thống</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Báo cáo cũng ghi các thực hành đi cùng mỗi chỉ số. Tần suất triển khai đi cùng giao liên tục, khi phần mềm luôn ở trạng thái phát hành được, và quản lý phiên bản mọi thứ chạy thật. Thời gian đưa thay đổi lên đi cùng quản lý phiên bản và một bộ kiểm thử tự động đáng tin. Thời gian khôi phục đi cùng khả năng triển khai lại bản tốt gần nhất, và theo dõi sức khoẻ hệ thống."
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính (đội 12 lần mỗi năm, 20 lần lỗi — số minh hoạ)</th><th>kết quả</th></tr>
          <tr><td>Bước 1. gấp 30 lần</td><td>12 nhân 30</td><td>$\hlb{360}$ lần mỗi năm, gần 1 lần mỗi ngày</td></tr>
          <tr><td>Bước 2. ít lỗi hơn 50%</td><td>20 nhân (1 trừ 0,5)</td><td>$\hlg{10}$ lần lỗi</td></tr></table>
        focus: ["1.2", "1.3"]
        say: "Năm trước đó, nhóm cao triển khai thường gấp 30 lần, nên một đội 12 lần mỗi năm, số minh hoạ, nhân 30 thành 360 lần, gần một lần mỗi ngày. Ít lỗi hơn 50 phần trăm nghĩa là 20 lần lỗi còn 10 lần."
      - show: |
          <div class="box key">Thực hành: đo <b>cả hai mặt</b>, thông lượng lẫn độ ổn định, không đo riêng tốc độ. Điều kiện: đây là khảo sát, nên báo cáo nói thực hành <b>đi cùng</b> kết quả tốt, không chứng minh thực hành nào một mình gây ra kết quả.</div>
        say: "Thực hành rút ra là đo cả hai mặt, thông lượng lẫn độ ổn định, không đo riêng tốc độ. Điều kiện cần nhớ, đây là khảo sát, nên báo cáo nói thực hành đi cùng kết quả tốt, chứ không chứng minh một thực hành nào một mình gây ra kết quả."

  # ───────────────────────── 7. CHẶNG 2 ─────────────────────────
