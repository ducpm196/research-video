          <tr><td>chỉ số đo <b>kết quả ở mức hệ thống</b>, tránh đẩy các bộ phận chống nhau</td><td>đội phát triển và đội vận hành cùng chung một bảng số</td></tr>
          <tr><td><b>độ tin cậy</b>: khả năng giữ lời hứa về phần mềm mình vận hành</td><td>độ sẵn sàng ở bài 10 là một phần của nó</td></tr></table>
          <p class="note">Năm 2024, chính nhóm nghiên cứu viết lại: gọi độ tin cậy là “chỉ số thứ năm” năm 2021 là <b>chưa chính xác</b>, vì nó đo vận hành, không đo việc giao phần mềm.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.4", 2]
        say: "Bảng đọc kỹ điều báo cáo năm 2021 ghi. Con số 973 lớn chủ yếu vì nhóm thấp tụt xuống chưa tới hai lần mỗi năm, nên bội số đổi theo cả hai đầu. Báo cáo ghi các chỉ số đo kết quả ở mức hệ thống, để tránh đẩy các bộ phận chống nhau. Độ tin cậy là khả năng giữ lời hứa về phần mềm mình vận hành. Độ sẵn sàng ở bài 10 là một phần của nó. Về sau, chính nhóm nghiên cứu viết lại rằng gọi độ tin cậy là chỉ số thứ năm là chưa chính xác, vì nó đo vận hành."

  # ───────────────────────── 10. CHẶNG 5 ─────────────────────────
  - id: stage5
    kind: example
    title: "Chặng 5, 2023 tới 2024 — ổn định và tiếp tục cải tiến: sửa chính thước đo"
