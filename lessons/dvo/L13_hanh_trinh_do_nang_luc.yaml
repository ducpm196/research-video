          <tr><td>Bước 2. nhóm thấp: dưới sáu tháng một lần, lấy điểm giữa của 2 và 1</td><td>(2 + 1) chia 2</td><td>1,5 lần mỗi năm</td></tr>
          <tr><td>Bước 3. bội số tần suất</td><td>1460 chia 1,5</td><td>≈ $\hl{973{,}3}$, báo cáo ghi 973 lần</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4"]
        say: "Ở chặng bốn, năm 2021, báo cáo có dữ liệu từ hơn 32 nghìn người làm nghề qua bảy năm. Lần đầu tiên, nhóm cao và nhóm tinh hoa chiếm hai phần ba. Bước một, 26 phần trăm tinh hoa cộng 40 phần trăm nhóm cao được 66 phần trăm, khoảng hai phần ba. Bước hai, nhóm thấp triển khai chưa tới sáu tháng một lần, báo cáo lấy điểm giữa của 2 và 1, được 1 phẩy 5 lần mỗi năm. Bước ba, 1460 chia 1 phẩy 5 được khoảng 973 phẩy 3, chính là con số ở đầu bài."
