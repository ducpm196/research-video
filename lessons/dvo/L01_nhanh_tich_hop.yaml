id: L01
course: DVO
series: 'DVO · DevOps: tích hợp, triển khai liên tục và vận hành'
title: Bài 1 — Quy trình làm việc với nhánh và tích hợp liên tục
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/dvo.yaml L01; audit/dvo/verify_dvo.py L01; M. Fowler, Continuous Integration (martinfowler.com, 2006, cập nhật 2024); P. Hammant, Trunk Based Development (trunkbaseddevelopment.com); N. Forsgren, J. Humble, G. Kim, Accelerate (2018), chương 4
assumes:
- arith
- power
- approx
objectives:
- So sánh nhánh tính năng sống lâu và hợp nhất thường xuyên
- Viết điều kiện để được hợp nhất
- Hiểu tích hợp liên tục là thói quen, không chỉ là máy chạy kiểm thử
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: Ngày hợp nhất kinh hoàng
  checks:
  - round(float(alg.conflict_prob(40)), 3) == 0.871
  steps:
  - show: '<p>Hai bạn mỗi người làm một nhánh riêng suốt 3 tuần. Ngày hợp nhất: hàng chục chỗ xung đột, cả hai cùng sửa một hàm theo hai hướng, kiểm thử đỏ khắp nơi. Mất thêm một tuần chỉ để ghép lại.</p>

      <div class="box key">Hôm nay: <b>tích hợp liên tục</b> — hợp nhất nhỏ và thường xuyên, mỗi lần đều được kiểm tự động.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, hai bạn mỗi người làm một nhánh riêng suốt 3 tuần. Đến ngày hợp nhất thì có hàng chục chỗ xung đột, cả hai cùng sửa một hàm theo hai hướng, và kiểm thử đỏ khắp nơi. Mất thêm một tuần chỉ để ghép lại. Hôm nay ta học tích hợp liên tục, hợp nhất nhỏ và thường xuyên, mỗi lần đều được kiểm tự động. Giữ hàng chục nhánh tính năng kéo dài nhiều tháng dẫn tới địa ngục xung đột mã cứ mỗi thứ Sáu cuối tuần. Tích hợp liên tục trên nhánh chính với kiểm thử tự động mỗi cam kết biến hợp nhất mã thành thao tác nhẹ tênh.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: “không xảy ra” và “ít nhất một lần”'
  checks:
  - 5 / 100 == 0.05 and round(1 - 0.05, 2) == 0.95
  - round(0.95 * 0.95, 4) == 0.9025 and round(0.95 ** 3, 3) == 0.857 and round(1 - 0.9025, 4) == 0.0975
  steps:
  - show: '<p>Kho mã có 100 tệp, bạn đang sửa 5 tệp. Một người khác sửa đúng 1 tệp, chọn ngẫu nhiên:</p>

      <table class="t"><tr><th>chuyện có thể xảy ra</th><th>xác suất</th></tr>

      <tr><td>trúng một trong 5 tệp của bạn</td><td>$\frac{5}{100} = 0{,}05$</td></tr>

      <tr><td>không trúng (tránh được)</td><td>$1 - 0{,}05 = 0{,}95$</td></tr></table>

      '
    introduces:
    - frac
    focus:
    - 0
    - 1
    - '2.2'
    - '2.3'
    - '2.3'
    say: Trước hết, ôn hai phép tính xác suất sẽ dùng. Kho mã có 100 tệp, bạn đang sửa 5 tệp, và một người khác sửa đúng 1 tệp chọn ngẫu nhiên. Khả năng người đó trúng một tệp của bạn là 5 phần 100, bằng 0 phẩy 05. Khả năng không trúng là phần còn lại, 1 trừ 0 phẩy 05, bằng 0 phẩy 95. Gộp thường xuyên mỗi ngày giữ nhánh phát triển lệch tối đa vài chục dòng so với mã nguồn chung của đội.
  - show: '<p>Nhiều người, mỗi người chọn độc lập: muốn <b>không ai</b> trúng thì từng người đều phải tránh → <b>nhân</b> các xác suất.</p>

      <table class="t"><tr><th>số người khác</th><th>không ai trúng</th><th>ít nhất một người trúng</th></tr>

      <tr><td>1</td><td>0,95</td><td>0,05</td></tr>

      <tr><td>2</td><td>$0{,}95 \cdot 0{,}95 = 0{,}9025$</td><td>$1 - 0{,}9025 = 0{,}0975$</td></tr>

      <tr><td>3</td><td>$0{,}95^3 \approx 0{,}857$</td><td>$1 - 0{,}857 = 0{,}143$</td></tr></table>

      '
    introduces:
    - cdot
    focus:
    - 1
    - '2.3'
    - '2.3'
    - '2.4'
    - 0
    - 0
    say: Khi có nhiều người, mỗi người chọn độc lập, muốn không ai trúng thì từng người đều phải tránh, nên ta nhân các xác suất. Hai người thì không ai trúng là 0 phẩy 95 nhân 0 phẩy 95, bằng 0 phẩy 9025. Ít nhất một người trúng là phần còn lại, 1 trừ 0 phẩy 9025, bằng 0 phẩy 0975. Ba người thì là 0 phẩy 95 mũ 3, khoảng 0 phẩy 857, nên ít nhất một người trúng khoảng 0 phẩy 143. Nhớ mẹo này, ít nhất một lần bằng 1 trừ không lần nào. Khi quy mô đội ngũ tăng gấp đôi, số cặp xung đột giữa các nhánh dài tăng lên theo bình phương khó cứu.
- id: sym
  kind: symbol
  title: 'Giải mã: nhánh, hợp nhất, tích hợp liên tục'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>nhánh</b></td><td>một dòng thay đổi tách khỏi nhánh chính</td></tr>

      <tr><td><b>hợp nhất</b></td><td>đưa thay đổi của nhánh trở lại nhánh chính; <b>điều kiện để được hợp nhất</b>: dựng được và mọi kiểm thử xanh</td></tr>

      <tr><td><b>tích hợp liên tục</b></td><td>mọi người hợp nhất vào nhánh chính <b>ít nhất mỗi ngày</b>; mỗi lần hợp nhất được dựng và kiểm tự động; nhánh chính luôn ở trạng thái chạy được</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Bảng giới thiệu ba khái niệm. Nhánh là một dòng thay đổi tách khỏi nhánh chính. Hợp nhất là đưa thay đổi của nhánh trở lại nhánh chính, với điều kiện là dựng được và mọi kiểm thử đều xanh. Tích hợp liên tục là mọi người hợp nhất vào nhánh chính ít nhất mỗi ngày, mỗi lần hợp nhất được dựng và kiểm tự động, và nhánh chính luôn ở trạng thái chạy được. Thay vì chờ hoàn tất tính năng to mới gộp, ẩn mã nguồn dang dở sau cờ bật tắt cho phép tích hợp từng ngày.
