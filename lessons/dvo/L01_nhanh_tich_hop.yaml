- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc, 1 lỗi người đã đi làm
  checks:
  - '[__import__(''math'').comb(n, 2) for n in (2, 4, 8)] == [1, 6, 28] and 4 * 3 / 2 == 6 and 8 * 7 / 2 == 28'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Có máy chạy kiểm thử tự động là đủ <b class="red">(chưa phải tích hợp liên tục)</b>

      <br><span class="note">Máy kiểm từng nhánh nhưng mọi người vẫn hợp nhất vài tuần một lần: không có gì “liên tục” cả. Thước đo là <b>tần suất hợp nhất</b> vào nhánh chính.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ có máy chạy kiểm thử tự động là đủ. Máy kiểm từng nhánh nhưng mọi người vẫn hợp nhất vài tuần một lần thì chẳng có gì liên tục cả, thước đo là tần suất hợp nhất vào nhánh chính. Bỏ qua bước chạy bộ kiểm thử đơn vị lúc nhánh chính báo đỏ rồi vẫn tiếp tục gộp thêm mã mới lên trên. Tạo nhánh tính năng sống kéo dài bốn tuần mới hợp nhất một lần tạo ra hàng trăm xung đột hợp nhất đau đầu. Nuôi nhánh phát triển riêng rẽ một tháng làm công việc ghép mã cuối tháng mất sạch ba ngày sửa xung đột.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Để nhánh chính đỏ qua đêm <b class="red">(chặn cả nhóm)</b>

      <br><span class="note">Nhánh chính hỏng thì mọi người hợp nhất lên trên cái hỏng, lỗi chồng lỗi. Đỏ thì ưu tiên số một: sửa ngay hoặc gỡ thay đổi vừa vào.</span></div>

      '
    say: Lỗi thứ hai, để nhánh chính đỏ qua đêm. Nhánh chính hỏng thì mọi người hợp nhất lên trên cái hỏng, lỗi chồng lỗi. Khi đỏ, đó là ưu tiên số một, sửa ngay hoặc gỡ thay đổi vừa vào. Tách nhánh kéo dài quá hai tuần làm lập trình viên chần chừ không dám tái cấu trúc vì sợ xung đột lớn. Đưa mã chưa chạy kiểm thử tự động qua nhánh chung làm chặn đứng công việc của hàng chục đồng nghiệp khác. Cấm chạy kiểm thử trên nhánh chính làm đội ngũ mất niềm tin khi bản dựng liên tục báo đỏ suốt cả tuần.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Chờ tính năng xong hẳn mới hợp nhất <b class="red">(nhánh sống lâu)</b>

      <br><span class="note">Hợp nhất từng phần nhỏ, phần chưa xong giấu sau một <b>công tắc tính năng</b>: mã đã vào nhánh chính nhưng người dùng chưa thấy.</span></div>

      '
    say: Lỗi thứ ba, chờ tính năng xong hẳn mới hợp nhất. Hãy hợp nhất từng phần nhỏ, phần chưa xong thì giấu sau một công tắc tính năng, để mã đã vào nhánh chính mà người dùng chưa thấy. Để thời gian chạy bộ kiểm thử kéo dài hơn một tiếng làm nhóm mất kiên nhẫn và gom dồn nhiều cam kết cùng lúc. Quên bọc tính năng chưa xong sau cờ bật tắt làm lộ giao diện dở dang khi hợp nhất hàng ngày lên nhánh chính.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> “Ngày nào tôi cũng kéo nhánh chính về nhánh của mình, vậy là tích hợp liên tục rồi” <b class="red">(chỉ tích hợp một chiều)</b></div>

      <table class="t"><tr><th>số nhánh sống lâu chạy song song</th><th>số cặp nhánh chưa từng được ghép thử với nhau</th></tr>

      <tr><td>2</td><td>1</td></tr>

      <tr><td>4</td><td>$\frac{4 \cdot 3}{2} = 6$</td></tr>

      <tr><td>8</td><td>$\frac{8 \cdot 7}{2} = 28$</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.3'
    - '2.4'
    - 0
    - 0
    - 0
    say: Lỗi thứ tư hay gặp ở người đã đi làm, họ nói ngày nào tôi cũng kéo nhánh chính về nhánh của mình, vậy là tích hợp liên tục rồi. Việc đó chỉ ghép bạn với những gì đã vào nhánh chính, còn thay đổi của bạn vẫn nằm riêng, chưa ai khác thấy. Mỗi cặp nhánh sống lâu chạy song song là một cặp chưa từng được ghép thử với nhau. Bốn nhánh cho 4 nhân 3 chia 2, bằng 6 cặp. Tám nhánh cho 28 cặp, và mọi xung đột giữa các cặp đó chỉ lộ ra vào ngày hợp nhất. Thước đo đúng vẫn là thay đổi của bạn vào nhánh chính ít nhất mỗi ngày. Không rà soát chéo các thay đổi lớn trước khi gộp làm giảm chất lượng thiết kế chung của kho mã. Chạy tích hợp liên tục chỉ trên vài tệp đơn lẻ rồi bỏ qua kiểm thử tích hợp đường biên quan trọng.
