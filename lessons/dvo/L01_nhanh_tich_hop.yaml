    say: Hình vẽ kho mã thành 100 ô, mỗi ô là một tệp, 5 ô cam là các tệp bạn đang sửa. Mỗi thay đổi của người khác là một chấm rơi vào một ô ngẫu nhiên. Nhánh sống 1 ngày chỉ hứng 3 chấm, trung bình 3 nhân 0 phẩy 05, bằng 0 phẩy 15 chấm trúng ô cam, nên thường không chấm nào trúng. Nhánh sống 3 tuần hứng 40 chấm, trung bình 40 nhân 0 phẩy 05, bằng 2 chấm trúng ô cam, như hai chấm đỏ trong hình này. Mỗi chấm đỏ là một chỗ xung đột phải gỡ tay. Nhiều hoạ sĩ cùng vẽ chung một bức tranh cần đối chiếu nét thường xuyên thay vì giấu kín rồi ghép tranh cuối tháng.
- id: example
  kind: example
  title: Nhánh càng sống lâu, càng chắc xung đột
  checks:
  - round(float(alg.conflict_prob(40)), 3) == 0.871 and round(float(alg.conflict_prob(3)), 3) == 0.143 and round(1 - 0.95 ** 40, 3) == 0.871
  - round(0.95 ** 40, 3) == 0.129 and round(1 - 0.129, 3) == 0.871 and round(0.95 ** 3, 3) == 0.857 and round(1 - 0.857, 3) == 0.143 and 1 - 5 / 100 == 0.95
  steps:
  - show: '<p><b>Bước 1 — mô hình:</b> nhánh của bạn sửa 5 trong 100 tệp; mỗi thay đổi khác vào nhánh chính sửa 1 tệp ngẫu nhiên, nên tránh được tệp của bạn với xác suất</p>

      $$1 - \frac{5}{100} = 0{,}95$$

      '
    focus:
    - 1
    - 2
    say: Bước một, dựng mô hình. Nhánh của bạn sửa 5 trong 100 tệp, mỗi thay đổi khác vào nhánh chính sửa 1 tệp ngẫu nhiên, nên tránh được tệp của bạn với xác suất 1 trừ 5 phần 100, bằng 0 phẩy 95.
  - show: '<p><b>Bước 2 — nhánh sống 3 tuần</b>, 40 thay đổi chen vào, không cái nào trúng:</p>

      $$0{,}95^{40} \approx 0{,}129$$

      '
    focus:
    - 1
    - 2
    say: Bước hai, nhánh sống 3 tuần có 40 thay đổi khác chen vào. Xác suất không cái nào trúng là 0 phẩy 95 mũ 40, khoảng 0 phẩy 129.
  - show: '<p><b>Bước 3 — ít nhất một xung đột</b> = 1 trừ không xung đột nào:</p>

      $$1 - 0{,}129 = \hl{0{,}871}$$

      '
    say: Bước ba, xác suất có ít nhất một xung đột bằng 1 trừ xác suất không có xung đột nào, tức 1 trừ 0 phẩy 129, bằng 0 phẩy 871.
  - show: '<p><b>Bước 4 — nhánh sống 1 ngày</b>, chỉ 3 thay đổi chen vào:</p>

      $$1 - 0{,}95^{3} \approx 1 - 0{,}857 = \hl{0{,}143}$$

      '
    focus:
    - 1
    - 2
    say: Bước bốn, nhánh sống 1 ngày chỉ có 3 thay đổi chen vào. Xác suất có xung đột là 1 trừ 0 phẩy 95 mũ 3, tức 1 trừ 0 phẩy 857, bằng 0 phẩy 143.
  - clear: true
    show: '<table class="t"><tr><th>nhánh sống</th><th>thay đổi khác chen vào</th><th>xác suất có xung đột</th></tr>

      <tr><td>3 tuần</td><td>40</td><td>$1 - 0{,}95^{40} \approx \hl{0{,}871}$</td></tr>

      <tr><td>1 ngày</td><td>3</td><td>$1 - 0{,}95^{3} \approx \hl{0{,}143}$</td></tr></table>

      <div class="box key">Và xung đột nhỏ, mới thì dễ gỡ: người viết vẫn nhớ mình vừa sửa gì.</div>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    say: Bước năm, đặt hai cách làm cạnh nhau. Nhánh sống 3 tuần gần như chắc chắn xung đột, khoảng 0 phẩy 871. Nhánh sống 1 ngày chỉ khoảng 0 phẩy 143. Hơn nữa, xung đột nhỏ và mới thì dễ gỡ, vì người viết vẫn nhớ mình vừa sửa gì.
  - show: <p><b>Bước 4 — đo mức độ phân kỳ khi nhiều lập trình viên ôm nhánh tách rời bằng Python</b>:</p><div class="code"><div>devs, days = 4, 10</div><div>pair_conflicts = devs * (devs - 1) // 2</div><div>lines_diverged = devs * days * 25</div><div>print(f&#x27;pairs={pair_conflicts} diverged={lines_diverged}&#x27;)</div></div>
    say: Bước bốn, đoạn mã Python lượng hoá chi phí hợp nhất khi bốn kỹ sư tách nhánh suốt 10 ngày. Số cặp nhánh có khả năng xung đột nhau là 4 nhân 3 chia 2, bằng 6 cặp giao cắt tiềm ẩn. Nếu mỗi người viết 25 dòng mỗi ngày mà không hợp nhất, kho mã phát sinh khoảng 1000 dòng tách biệt cần giải quyết cùng lúc.
