/><circle cx="1025" cy="175" r="9" fill="#2a78d6"/><circle cx="1235" cy="355" r="9" fill="#2a78d6"/><circle cx="1085" cy="295" r="9" fill="#2a78d6"/><circle cx="1145" cy="235" r="9" fill="#2a78d6"/><circle cx="1025" cy="355" r="9" fill="#2a78d6"/><circle cx="1145" cy="295" r="9" fill="#2a78d6"/><circle cx="1115" cy="115" r="9" fill="#2a78d6"/><circle cx="965" cy="175" r="9" fill="#2a78d6"/><circle cx="1235" cy="295" r="9" fill="#2a78d6"/><circle cx="1025" cy="235" r="9" fill="#2a78d6"/><circle cx="1205" cy="355" r="9" fill="#2a78d6"/><circle cx="1055" cy="355" r="9" fill="#2a78d6"/><circle cx="1115" cy="85" r="9" fill="#2a78d6"/><circle cx="1175" cy="115" r="9" fill="#2a78d6"/><circle cx="1235" cy="175" r="9" fill="#2a78d6"/><circle cx="1115" cy="325" r="9" fill="#2a78d6"/><circle cx="1205" cy="115" r="9" fill="#2a78d6"/><circle cx="1145" cy="175" r="9" fill="#2a78d6"/><circle cx="1115" cy="295" r="9" fill="#2a78d6"/><circle cx="1205" cy="175" r="9" fill="#2a78d6"/><circle cx="1235" cy="115" r="9" fill="#2a78d6"/><circle cx="1175" cy="175" r="9" fill="#2a78d6"/><circle cx="1085" cy="235" r="9" fill="#2a78d6"/><circle cx="1085" cy="145" r="9" fill="#b91c1c"/><circle cx="995" cy="295" r="9" fill="#b91c1c"/><g font-size="26" text-anchor="middle" fill="#1f2937"><text x="400" y="50">nhánh sống 1 ngày: 3 thay đổi chen vào</text><text x="1100" y="50">nhánh sống 3 tuần: 40 thay đổi chen vào</text><text x="400" y="410" fill="#059669">không chấm nào trúng ô cam</text><text x="1100" y="410" fill="#b91c1c">2 chấm đỏ trúng ô cam: xung đột</text></g><g font-size="22" fill="#1f2937"><rect x="250" y="428" width="24" height="24" fill="#fed7aa" stroke="#eb6834" stroke-width="3"/><text x="284" y="448">5 tệp bạn đang sửa</text><circle cx="612" cy="440" r="9" fill="#2a78d6"/><text x="630" y="448">thay đổi của người khác</text><circle cx="950" cy="440" r="9" fill="#b91c1c"/><text x="968" y="448">trúng tệp của bạn</text></g></svg></div>
