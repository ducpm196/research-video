    - 1
    - 2
    - 2
    say: Đáp án câu một, hai bước. Xác suất không có xung đột nào là 0 phẩy 95 mũ 10, khoảng 0 phẩy 599. Vậy xác suất có xung đột là 1 trừ 0 phẩy 599, bằng 0 phẩy 401, gần một nửa chỉ sau một tuần. Đếm tổng số giờ công tiêu tốn vào giải quyết xung đột khi kéo dài tuổi thọ nhánh từ một ngày lên mười bốn ngày.
  - show: '<p>② Không xung đột: $0{,}95^{2} = 0{,}9025$.</p>

      <p>Có xung đột: $1 - 0{,}9025 = 0{,}0975 \approx \hl{0{,}098}$ — và nếu có, nó chỉ dính tới 1–2 thay đổi.</p>

      '
