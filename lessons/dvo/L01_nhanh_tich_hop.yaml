- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">hợp nhất ít nhất mỗi ngày</span><span class="a">→</span>

      <span class="n">mỗi lần dựng và kiểm tự động</span><span class="a">→</span>

      <span class="n">nhánh chính luôn chạy được</span><span class="a">→</span>

      <span class="n">phần chưa xong giấu sau công tắc tính năng</span></div>

      '
    say: Tổng kết lại, hợp nhất ít nhất mỗi ngày, mỗi lần dựng và kiểm tự động, giữ nhánh chính luôn chạy được, và giấu phần chưa xong sau công tắc tính năng. Tích hợp sớm và liên tục triệt tiêu hoàn toàn những tuần lễ khép nhánh đau khổ trước ngày phát hành. Hợp nhất thường xuyên thành từng lô nhỏ giữ nhánh chính luôn trong trạng thái sẵn sàng phát hành bất kỳ lúc nào.
  - show: '<div class="box key"><b>Tư duy:</b> chi phí ghép mã tăng nhanh hơn thời gian tách nhau. Ghép sớm, ghép nhỏ, ghép thường xuyên.</div>

      '
    say: Điều cần mang theo, chi phí ghép mã tăng nhanh hơn thời gian tách nhau. Hãy ghép sớm, ghép nhỏ, và ghép thường xuyên. Nhánh chính luôn sẵn sàng dựng phát hành mọi lúc chính là kết quả trực tiếp của kỷ luật nhánh ngắn. Cờ bật tắt tính năng kết hợp kiểm thử tự động biến tích hợp liên tục thành nhịp làm việc an toàn mỗi ngày.
