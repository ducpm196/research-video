    - 1
    - 2
    - 2
    - 2
    say: Câu hai, xác suất không có xung đột là 0 phẩy 95 nhân 0 phẩy 95, bằng 0 phẩy 9025. Vậy xác suất có xung đột là 1 trừ 0 phẩy 9025, bằng 0 phẩy 0975, khoảng 0 phẩy 098. Và nếu có xung đột thì nó chỉ dính tới một hai thay đổi, nên gỡ rất nhanh. Xác định điều kiện tiên quyết giúp tích hợp mã dang dở lên nhánh chính an toàn có kiểm chứng.
