        say: "Hình vẽ kho mã thành 100 ô, mỗi ô là một tệp, 5 ô cam là các tệp bạn đang sửa. Mỗi thay đổi của người khác là một chấm rơi vào một ô ngẫu nhiên. Nhánh sống 1 ngày chỉ hứng 3 chấm, trung bình 3 nhân 0 phẩy 05, bằng 0 phẩy 15 chấm trúng ô cam, nên thường không chấm nào trúng. Nhánh sống 3 tuần hứng 40 chấm, trung bình 40 nhân 0 phẩy 05, bằng 2 chấm trúng ô cam, như hai chấm đỏ trong hình này. Mỗi chấm đỏ là một chỗ xung đột phải gỡ tay."

  - id: example
    kind: example
    title: "Nhánh càng sống lâu, càng chắc xung đột"
    checks:
      - "round(float(alg.conflict_prob(40)), 3) == 0.871 and round(float(alg.conflict_prob(3)), 3) == 0.143 and round(1 - 0.95 ** 40, 3) == 0.871"
      - "round(0.95 ** 40, 3) == 0.129 and round(1 - 0.129, 3) == 0.871 and round(0.95 ** 3, 3) == 0.857 and round(1 - 0.857, 3) == 0.143 and 1 - 5 / 100 == 0.95"
    steps:
      - show: |
          <p><b>Bước 1 — mô hình:</b> nhánh của bạn sửa 5 trong 100 tệp; mỗi thay đổi khác vào nhánh chính sửa 1 tệp ngẫu nhiên, nên tránh được tệp của bạn với xác suất</p>
          $$1 - \frac{5}{100} = 0{,}95$$
        focus: [1, 2]
        say: "Bước một, dựng mô hình. Nhánh của bạn sửa 5 trong 100 tệp, mỗi thay đổi khác vào nhánh chính sửa 1 tệp ngẫu nhiên, nên tránh được tệp của bạn với xác suất 1 trừ 5 phần 100, bằng 0 phẩy 95."
      - show: |
          <p><b>Bước 2 — nhánh sống 3 tuần</b>, 40 thay đổi chen vào, không cái nào trúng:</p>
          $$0{,}95^{40} \approx 0{,}129$$
        focus: [1, 2]
        say: "Bước hai, nhánh sống 3 tuần có 40 thay đổi khác chen vào. Xác suất không cái nào trúng là 0 phẩy 95 mũ 40, khoảng 0 phẩy 129."
      - show: |
          <p><b>Bước 3 — ít nhất một xung đột</b> = 1 trừ không xung đột nào:</p>
          $$1 - 0{,}129 = \hl{0{,}871}$$
        say: "Bước ba, xác suất có ít nhất một xung đột bằng 1 trừ xác suất không có xung đột nào, tức 1 trừ 0 phẩy 129, bằng 0 phẩy 871."
      - show: |
          <p><b>Bước 4 — nhánh sống 1 ngày</b>, chỉ 3 thay đổi chen vào:</p>
          $$1 - 0{,}95^{3} \approx 1 - 0{,}857 = \hl{0{,}143}$$
        focus: [1, 2]
        say: "Bước bốn, nhánh sống 1 ngày chỉ có 3 thay đổi chen vào. Xác suất có xung đột là 1 trừ 0 phẩy 95 mũ 3, tức 1 trừ 0 phẩy 857, bằng 0 phẩy 143."
      - clear: true
        show: |
          <table class="t"><tr><th>nhánh sống</th><th>thay đổi khác chen vào</th><th>xác suất có xung đột</th></tr>
          <tr><td>3 tuần</td><td>40</td><td>$1 - 0{,}95^{40} \approx \hl{0{,}871}$</td></tr>
          <tr><td>1 ngày</td><td>3</td><td>$1 - 0{,}95^{3} \approx \hl{0{,}143}$</td></tr></table>
          <div class="box key">Và xung đột nhỏ, mới thì dễ gỡ: người viết vẫn nhớ mình vừa sửa gì.</div>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước năm, đặt hai cách làm cạnh nhau. Nhánh sống 3 tuần gần như chắc chắn xung đột, khoảng 0 phẩy 871. Nhánh sống 1 ngày chỉ khoảng 0 phẩy 143. Hơn nữa, xung đột nhỏ và mới thì dễ gỡ, vì người viết vẫn nhớ mình vừa sửa gì."

  - id: check
    kind: check
    title: "Tự kiểm: cộng từng trường hợp, và cho máy rút thăm"
    checks:
      - "round(0.05, 4) == 0.05 and round(0.95 * 0.05, 4) == 0.0475 and round(0.95 ** 2 * 0.05, 6) == 0.045125 and round(0.05 + 0.0475 + 0.045125, 6) == 0.142625 and round(0.142625, 3) == 0.143"
      - "(lambda r: abs(sum(any(r.randrange(100) < 5 for _ in range(40)) for _ in range(20000)) / 20000 - 0.871) < 0.005)(__import__('random').Random(1))"
    steps:
      - show: |
          <p>Đường khác cho nhánh 1 ngày: xung đột <b>đầu tiên</b> rơi vào thay đổi thứ mấy?</p>
          <table class="t"><tr><th>xung đột đầu tiên ở</th><th>cách tính</th><th>xác suất</th></tr>
          <tr><td>thay đổi thứ 1</td><td>trúng ngay</td><td>0,05</td></tr>
          <tr><td>thay đổi thứ 2</td><td>$0{,}95 \cdot 0{,}05$</td><td>0,0475</td></tr>
          <tr><td>thay đổi thứ 3</td><td>$0{,}95^2 \cdot 0{,}05$</td><td>0,045125</td></tr>
          <tr><td>cộng lại</td><td></td><td>$0{,}142625 \approx \hl{0{,}143}$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Kiểm bằng đường khác cho nhánh 1 ngày, ta hỏi xung đột đầu tiên rơi vào thay đổi thứ mấy, rồi cộng các trường hợp. Trúng ngay ở thay đổi thứ nhất có xác suất 0 phẩy 05. Tránh cái thứ nhất rồi trúng cái thứ hai là 0 phẩy 95 nhân 0 phẩy 05, bằng 0 phẩy 0475. Tránh hai cái rồi trúng cái thứ ba là 0 phẩy 045125. Cộng lại được 0 phẩy 142625, làm tròn là 0 phẩy 143, khớp với cách tính 1 trừ không lần nào."
      - show: |
          <table class="t"><tr><th>cho máy rút thăm thật</th><th>kết quả</th></tr>
          <tr><td>20 000 lần giả lập nhánh 3 tuần, mỗi lần 40 thay đổi rơi ngẫu nhiên</td><td>tỉ lệ có xung đột $\approx 0{,}87$ ✓</td></tr></table>
        say: "Với nhánh 3 tuần, ta cho máy rút thăm thật 20 nghìn lần, mỗi lần 40 thay đổi rơi vào tệp ngẫu nhiên, rồi đếm tỉ lệ lần có xung đột. Tỉ lệ đếm được khoảng 0 phẩy 87, khớp với 0 phẩy 871 tính bằng công thức."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "[__import__('math').comb(n, 2) for n in (2, 4, 8)] == [1, 6, 28] and 4 * 3 / 2 == 6 and 8 * 7 / 2 == 28"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Có máy chạy kiểm thử tự động là đủ <b class="red">(chưa phải tích hợp liên tục)</b>
          <br><span class="note">Máy kiểm từng nhánh nhưng mọi người vẫn hợp nhất vài tuần một lần: không có gì “liên tục” cả. Thước đo là <b>tần suất hợp nhất</b> vào nhánh chính.</span></div>
        say: "Lỗi thứ nhất, nghĩ có máy chạy kiểm thử tự động là đủ. Máy kiểm từng nhánh nhưng mọi người vẫn hợp nhất vài tuần một lần thì chẳng có gì liên tục cả, thước đo là tần suất hợp nhất vào nhánh chính."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Để nhánh chính đỏ qua đêm <b class="red">(chặn cả nhóm)</b>
          <br><span class="note">Nhánh chính hỏng thì mọi người hợp nhất lên trên cái hỏng, lỗi chồng lỗi. Đỏ thì ưu tiên số một: sửa ngay hoặc gỡ thay đổi vừa vào.</span></div>
        say: "Lỗi thứ hai, để nhánh chính đỏ qua đêm. Nhánh chính hỏng thì mọi người hợp nhất lên trên cái hỏng, lỗi chồng lỗi. Khi đỏ, đó là ưu tiên số một, sửa ngay hoặc gỡ thay đổi vừa vào."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chờ tính năng xong hẳn mới hợp nhất <b class="red">(nhánh sống lâu)</b>
          <br><span class="note">Hợp nhất từng phần nhỏ, phần chưa xong giấu sau một <b>công tắc tính năng</b>: mã đã vào nhánh chính nhưng người dùng chưa thấy.</span></div>
        say: "Lỗi thứ ba, chờ tính năng xong hẳn mới hợp nhất. Hãy hợp nhất từng phần nhỏ, phần chưa xong thì giấu sau một công tắc tính năng, để mã đã vào nhánh chính mà người dùng chưa thấy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> “Ngày nào tôi cũng kéo nhánh chính về nhánh của mình, vậy là tích hợp liên tục rồi” <b class="red">(chỉ tích hợp một chiều)</b></div>
          <table class="t"><tr><th>số nhánh sống lâu chạy song song</th><th>số cặp nhánh chưa từng được ghép thử với nhau</th></tr>
          <tr><td>2</td><td>1</td></tr>
          <tr><td>4</td><td>$\frac{4 \cdot 3}{2} = 6$</td></tr>
          <tr><td>8</td><td>$\frac{8 \cdot 7}{2} = 28$</td></tr></table>
        focus: [1, 1, 2, "2.3", "2.4", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, họ nói ngày nào tôi cũng kéo nhánh chính về nhánh của mình, vậy là tích hợp liên tục rồi. Việc đó chỉ ghép bạn với những gì đã vào nhánh chính, còn thay đổi của bạn vẫn nằm riêng, chưa ai khác thấy. Mỗi cặp nhánh sống lâu chạy song song là một cặp chưa từng được ghép thử với nhau. Bốn nhánh cho 4 nhân 3 chia 2, bằng 6 cặp. Tám nhánh cho 28 cặp, và mọi xung đột giữa các cặp đó chỉ lộ ra vào ngày hợp nhất. Thước đo đúng vẫn là thay đổi của bạn vào nhánh chính ít nhất mỗi ngày."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(float(alg.conflict_prob(10)), 3) == 0.401 and round(float(alg.conflict_prob(2)), 3) == 0.098"
      - "round(0.95 ** 10, 3) == 0.599 and round(1 - 0.599, 3) == 0.401 and round(0.95 ** 2, 4) == 0.9025 and round(1 - 0.9025, 4) == 0.0975"
    steps:
      - show: |
          <p>Vẫn mô hình trên (5 trong 100 tệp).</p>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Nhánh sống 1 tuần, có 10 thay đổi khác chen vào: xác suất xung đột?</td></tr>
          <tr><td>2</td><td>Hợp nhất 2 lần mỗi ngày, mỗi lần chỉ 2 thay đổi khác chen vào: xác suất xung đột mỗi lần?</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm, vẫn với mô hình 5 trong 100 tệp. Câu một, nhánh sống 1 tuần có 10 thay đổi khác chen vào, xác suất xung đột là bao nhiêu? Câu hai, hợp nhất 2 lần mỗi ngày, mỗi lần chỉ có 2 thay đổi khác chen vào, xác suất xung đột mỗi lần là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Không xung đột nào: $0{,}95^{10} \approx 0{,}599$.</p>
          <p>Có xung đột: $1 - 0{,}599 = \hl{0{,}401}$.</p>
        focus: [0, 1, 2]
        say: "Đáp án câu một, hai bước. Xác suất không có xung đột nào là 0 phẩy 95 mũ 10, khoảng 0 phẩy 599. Vậy xác suất có xung đột là 1 trừ 0 phẩy 599, bằng 0 phẩy 401, gần một nửa chỉ sau một tuần."
      - show: |
          <p>② Không xung đột: $0{,}95^{2} = 0{,}9025$.</p>
          <p>Có xung đột: $1 - 0{,}9025 = 0{,}0975 \approx \hl{0{,}098}$ — và nếu có, nó chỉ dính tới 1–2 thay đổi.</p>
        focus: [1, 2, 2]
        say: "Câu hai, xác suất không có xung đột là 0 phẩy 95 nhân 0 phẩy 95, bằng 0 phẩy 9025. Vậy xác suất có xung đột là 1 trừ 0 phẩy 9025, bằng 0 phẩy 0975, khoảng 0 phẩy 098. Và nếu có xung đột thì nó chỉ dính tới một hai thay đổi, nên gỡ rất nhanh."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hợp nhất ít nhất mỗi ngày</span><span class="a">→</span>
          <span class="n">mỗi lần dựng và kiểm tự động</span><span class="a">→</span>
          <span class="n">nhánh chính luôn chạy được</span><span class="a">→</span>
          <span class="n">phần chưa xong giấu sau công tắc tính năng</span></div>
        say: "Tổng kết lại, hợp nhất ít nhất mỗi ngày, mỗi lần dựng và kiểm tự động, giữ nhánh chính luôn chạy được, và giấu phần chưa xong sau công tắc tính năng."
      - show: |
          <div class="box key"><b>Tư duy:</b> chi phí ghép mã tăng nhanh hơn thời gian tách nhau. Ghép sớm, ghép nhỏ, ghép thường xuyên.</div>
        say: "Điều cần mang theo, chi phí ghép mã tăng nhanh hơn thời gian tách nhau. Hãy ghép sớm, ghép nhỏ, và ghép thường xuyên."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 2): <b>phiên bản ngữ nghĩa</b> và quản lý phụ thuộc.</p>
        forward_ref: true
        say: "Ở bài sau, bài 2, ta học phiên bản ngữ nghĩa và cách quản lý phụ thuộc. Hẹn gặp bạn ở bài tiếp theo."
