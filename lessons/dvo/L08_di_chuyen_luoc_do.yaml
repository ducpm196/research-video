scenes:
- id: hook
  kind: hook
  title: Đổi tên một cột, nửa số máy chủ báo lỗi
  checks:
  - alg.migration_sim('mot_buoc') == [('đổi tên cột', False, True)]
  steps:
  - show: '<p>Bản mới đổi tên cột <code>ten</code> thành <code>ho_ten</code> cho rõ nghĩa. Cập nhật cuốn chiếu đang chạy: một nửa máy chủ vẫn là bản cũ, vẫn đọc cột <code>ten</code> — giờ không còn tồn tại. Một nửa số đơn hàng lỗi.</p>

      <div class="box key">Hôm nay: di chuyển lược đồ theo kiểu <b>mở rộng rồi thu hẹp</b>, để bản cũ và bản mới cùng chạy được.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, bản mới đổi tên một cột trong bảng khách hàng cho rõ nghĩa. Cập nhật cuốn chiếu đang chạy, một nửa máy chủ vẫn là bản cũ, vẫn đọc cột tên cũ, mà cột đó giờ không còn tồn tại. Một nửa số đơn hàng bị lỗi. Hôm nay ta học di chuyển lược đồ theo kiểu mở rộng rồi thu hẹp, để bản cũ và bản mới cùng chạy được. Xoá thẳng hoặc đổi tên một cột dữ liệu khi máy chủ cũ vẫn đang phục vụ khách làm toàn bộ ứng dụng nổ lỗi tức thì. Quy trình bốn pha mở rộng rồi co lại giúp cập nhật lược đồ cơ sở dữ liệu trơn tru trong khi vẫn phục vụ lưu lượng liên tục.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: lược đồ là gì, cuốn chiếu là gì'
  checks:
  - '(lambda db: (db.execute(''CREATE TABLE kh (id INTEGER PRIMARY KEY, ten TEXT)''), db.execute(''INSERT INTO kh (ten) VALUES (?)'', (''An'',)), db.execute(''SELECT ten FROM kh'').fetchall() == [(''An'',)]))(__import__(''sqlite3'').connect('':memory:''))[2]'
  - '(lambda db: (db.execute(''CREATE TABLE kh (id INTEGER PRIMARY KEY, ten TEXT)''), db.execute(''ALTER TABLE kh RENAME COLUMN ten TO ho_ten''), alg.migration_sim(''mot_buoc'')[0][1] is False))(__import__(''sqlite3'').connect('':memory:''))[2]'
  - '[(4 - k, k) for k in range(5)] == [(4, 0), (3, 1), (2, 2), (1, 3), (0, 4)]'
  steps:
  - show: '<p>Nhắc lại từ đầu: cơ sở dữ liệu cất dữ liệu thành <b>bảng</b>; mỗi <b>dòng</b> là một khách hàng, mỗi <b>cột</b> là một loại thông tin. <b>Lược đồ</b> là tên bảng và tên các cột. Bảng khách hàng <code>kh</code>:</p>

      <table class="t"><tr><th>id</th><th>ten</th></tr><tr><td>1</td><td>An</td></tr></table>

      <p>Hỏi cột <code>ten</code> → được “An”. Hỏi một cột <b>không có</b> trong lược đồ → cơ sở dữ liệu báo lỗi, chương trình hỏng.</p>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 3
    - 3
    - 3
    say: Trước hết, nhắc lại từ đầu hai ý. Cơ sở dữ liệu cất dữ liệu thành bảng, mỗi dòng là một khách hàng, mỗi cột là một loại thông tin. Lược đồ là tên bảng và tên các cột. Ví dụ bảng khách hàng có cột mã số và cột tên, với một dòng là An. Khi hỏi giá trị ở cột tên, ta nhận được An. Nhưng hỏi một cột không có trong lược đồ thì cơ sở dữ liệu báo lỗi, và chương trình hỏng. Thêm cột mới có giá trị mặc định hay cho phép rỗng mở đường triển khai song song bản mới và bản cũ không đụng chạm.
  - show: '<p><b>Cập nhật cuốn chiếu</b>: thay bản mới cho từng máy chủ một, trong lúc các máy còn lại vẫn phục vụ người dùng, nên dịch vụ không phải tắt. Cái giá: có lúc hai bản cùng chạy.</p>

      <table class="t"><tr><th>lúc</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>

      <tr><td>máy chạy bản cũ</td><td>4</td><td>3</td><td>2</td><td>1</td><td>0</td></tr>

      <tr><td>máy chạy bản mới</td><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Ý thứ hai là cập nhật cuốn chiếu, tức thay bản mới cho từng máy chủ một, trong lúc các máy còn lại vẫn phục vụ người dùng, nên dịch vụ không phải tắt. Cái giá phải trả là có lúc hai bản cùng chạy. Với 4 máy, số máy chạy bản cũ giảm dần 4, 3, 2, 1, 0. Số máy chạy bản mới tăng dần 0, 1, 2, 3, 4. Ở ba lúc giữa, cả hai bản cùng đọc ghi một cơ sở dữ liệu.
- id: sym
  kind: symbol
  title: 'Giải mã: mở rộng rồi thu hẹp'
  steps:
  - show: '<p>Trong lúc cập nhật cuốn chiếu, <b>bản cũ và bản mới chạy cùng lúc</b> trên cùng cơ sở dữ liệu. Mọi trạng thái lược đồ trung gian phải hợp với <b>cả hai</b>.</p>

      <div class="chain"><span class="n">mở rộng: thêm cái mới, giữ cái cũ</span><span class="a">→</span><span class="n">chuyển dần mã sang cái mới</span><span class="a">→</span><span class="n">thu hẹp: bỏ cái cũ khi không còn ai dùng</span></div>

      <div class="box key">Mỗi bước là một lần triển khai riêng, có thể quay lui; thay đổi lược đồ và thay đổi mã <b>không</b> đi cùng một bước.</div>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Trong lúc cập nhật cuốn chiếu, bản cũ và bản mới chạy cùng lúc trên cùng một cơ sở dữ liệu, nên mọi trạng thái lược đồ trung gian phải hợp với cả hai. Cách làm là mở rộng trước, thêm cái mới mà giữ cái cũ, rồi chuyển dần mã sang cái mới, cuối cùng thu hẹp, bỏ cái cũ khi không còn ai dùng. Mỗi bước là một lần triển khai riêng có thể quay lui, và thay đổi lược đồ với thay đổi mã không đi cùng một bước. Quá trình chép ngược dữ liệu theo lô nhỏ bảo đảm không tạo khoá bảng làm đứng luồng ghi chính của khách.
