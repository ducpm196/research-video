  - show: '<div class="chain"><span class="n">bản cũ và mới chạy cùng lúc</span><span class="a">→</span>

      <span class="n">mở rộng: thêm, giữ cái cũ</span><span class="a">→</span>

      <span class="n">chuyển mã dần</span><span class="a">→</span>

      <span class="n">thu hẹp khi không còn ai dùng</span></div>

      '
    say: Tổng kết lại, bản cũ và bản mới chạy cùng lúc, nên ta mở rộng trước, thêm cái mới và giữ cái cũ, chuyển mã dần, rồi thu hẹp khi không còn ai dùng cái cũ. Quy luật mở rộng rồi mới co biến đổi lược đồ từ điểm rủi ro ngừng dịch vụ lớn nhất thành thao tác êm ả. Tuân thủ ba nhịp mở rộng cột mới, ghi song song hai nơi và thu hẹp bỏ cột cũ bảo đảm chuyển đổi không ngừng máy.
  - show: '<div class="box key"><b>Tư duy:</b> dữ liệu sống lâu hơn mã. Mọi thay đổi trên dữ liệu phải đi từng bước nhỏ, bước nào cũng quay lui được, trừ bước bỏ cột: phải sao lưu trước.</div>

      '
    say: Điều cần mang theo, dữ liệu sống lâu hơn mã. Mọi thay đổi trên dữ liệu phải đi từng bước nhỏ, và bước nào cũng quay lui được, trừ bước bỏ cột cuối cùng nên phải sao lưu trước. Đo hiệu quả tổng thể của quy trình giao hàng bằng bốn chỉ số khách quan trong bước kế.
