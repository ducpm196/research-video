id: L00
course: DVO
series: "DVO · DevOps: tích hợp, triển khai liên tục và vận hành"
title: "Bài 0 — DevOps là gì: vòng phản hồi từ mã tới người dùng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dvo.yaml L00; audit/dvo/verify_dvo.py L00; N. Forsgren, J. Humble, G. Kim, Accelerate (2018), chương 2; J. Humble, D. Farley, Continuous Delivery (2010), chương 1; SWF bài 11 (hợp đồng giữa các phần)"
assumes: [arith]
# Quy ước: “lần phát hành” gồm n thay đổi, đúng một thay đổi gây lỗi. Tìm nó bằng chia đôi: mỗi lần dựng-kiểm nửa đầu khoảng nghi ngờ
#   (alg.bisect_builds, đếm thật); số lần tối đa = số lần chia đôi n cho tới 1 (làm tròn lên mỗi lần).
objectives:
  - "Mô tả vòng lập kế hoạch – mã – dựng – kiểm – phát hành – vận hành – theo dõi"
  - "Giải thích vì sao lô thay đổi nhỏ ít rủi ro hơn"
  - "Hiểu DevOps là cách làm việc, không phải chức danh"
asr_reviewed:
  - {sentence: "Bước một, đề bài.", reason: "ASR chép “Bước 1. Đề bay” (0.75): lệch âm/thanh thuần Việt: bài/bay — NOT_VERIFIED bằng tai người"}
  - {sentence: "Tổng kết lại, DevOps rút ngắn vòng phản hồi từ mã tới người dùng.", reason: "ASR chép “Tổng kết lại, Devoop rút ngắn vòng phản hội từ mã tới người dung.” (0.786): DevOps đọc thô (probe DVO p1: 6/8, NOT_VERIFIED); lệch âm/thanh thuần Việt: hồi/hội, dùng/dung — NOT_VERIFIED bằng tai người"}
  - {sentence: "Hôm nay ta học DevOps, rút ngắn vòng phản hồi từ lúc viết mã tới lúc biết nó chạy đúng với người dùng.", reason: "ASR chép “Hôm nay ta học Devos, đúc ngắn vòng phản hồi từ lúc viết mã tới lúc biết nó chạy đúng với người dùng.” (0.913): DevOps đọc thô (probe DVO p1: 6/8, NOT_VERIFIED) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ba tháng phát hành một lần, lần nào cũng cháy"
    steps:
      - show: |
          <p>Nhóm gom 300 thay đổi, ba tháng phát hành một lần, vào cuối tuần. Lần nào cũng hỏng một thứ gì đó, và không ai biết thay đổi nào gây ra. Nhóm bên cạnh phát hành mỗi ngày, mỗi lần vài thay đổi — và ít sự cố hơn.</p>
          <div class="box key">Hôm nay: <b>DevOps</b> — rút ngắn <b>vòng phản hồi</b> từ lúc viết mã tới lúc biết nó chạy đúng với người dùng.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, một nhóm gom 300 thay đổi, ba tháng phát hành một lần, vào cuối tuần. Lần nào cũng hỏng một thứ gì đó, và không ai biết thay đổi nào gây ra. Nhóm bên cạnh phát hành mỗi ngày, mỗi lần vài thay đổi, và lại ít sự cố hơn. Hôm nay ta học DevOps, rút ngắn vòng phản hồi từ lúc viết mã tới lúc biết nó chạy đúng với người dùng."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chia đôi một khoảng, làm tròn lên"
    checks:
      - "(lambda h: h(h, 8))(lambda h, n: [n] if n == 1 else [n] + h(h, -(-n // 2))) == [8, 4, 2, 1] and 75 / 2 == 37.5 and -(-75 // 2) == 38"
      - "max(alg.bisect_builds(8, b) for b in range(8)) == 3"
    steps:
      - show: |
          <p>Trò đoán số: bạn nghĩ một số từ 1 tới 8, tôi chỉ hỏi “có nằm trong nửa đầu không?”.</p>
          <table class="t"><tr><th>số khả năng còn lại</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
          <tr><td>số câu đã hỏi</td><td>0</td><td>1</td><td>2</td><td>3</td></tr></table>
        focus: [1, 1, "2.1", "2.2"]
        say: "Trước hết, ôn một trò đoán số. Bạn nghĩ một số từ 1 tới 8, tôi chỉ được hỏi số đó có nằm trong nửa đầu không. Mỗi câu trả lời loại đi một nửa, nên 8 khả năng còn 4, rồi 2, rồi 1. Vậy chỉ cần 3 câu hỏi là chắc chắn đoán đúng."
      - show: |
          <p>Khi số lẻ, hai nửa không bằng nhau: 75 chia đôi được 37,5, tức một nửa có 37, nửa kia có 38.</p>
          <div class="box key">Lần nào cũng xét trường hợp <b>xấu nhất</b>: thứ cần tìm nằm ở nửa lớn hơn → <b>làm tròn lên</b>, 75 → 38.</div>
        focus: [1, 2, 2]
        say: "Khi số khả năng là số lẻ, hai nửa không bằng nhau, ví dụ 75 chia đôi được 37 phẩy 5, nên một nửa có 37, nửa kia có 38. Ta luôn xét trường hợp xấu nhất, thứ cần tìm nằm ở nửa lớn hơn. Vì thế mỗi lần chia đôi ta làm tròn lên, 75 thành 38."
      - show: |
          <p><b>Lô</b> = các thay đổi được phát hành cùng một lần. <b>Một lần dựng-kiểm</b> = dựng chương trình với một phần các thay đổi rồi chạy kiểm thử: <b class="green">xanh</b> là qua, <b class="red">đỏ</b> là hỏng.</p>
        say: "Thêm hai từ sẽ dùng cả bài. Lô là các thay đổi được phát hành cùng một lần. Một lần dựng kiểm là dựng chương trình với một phần các thay đổi rồi chạy kiểm thử, xanh là qua, đỏ là hỏng."

  - id: sym
    kind: symbol
    title: "Giải mã: vòng phản hồi"
    steps:
      - show: |
          <div class="chain"><span class="n">lập kế hoạch</span><span class="a">→</span><span class="n">viết mã</span><span class="a">→</span><span class="n">dựng</span><span class="a">→</span><span class="n">kiểm thử</span><span class="a">→</span><span class="n">phát hành</span><span class="a">→</span><span class="n">vận hành</span><span class="a">→</span><span class="n">theo dõi</span><span class="a">↺</span></div>
          <p><b>DevOps</b>: cách làm việc mà người viết mã và người vận hành cùng chịu trách nhiệm cho cả vòng; mọi bước lặp lại được thì <b>tự động hoá</b>, và vòng chạy càng nhanh càng tốt.</p>
          <div class="box key">Vòng càng ngắn, mỗi lần đi qua càng ít thay đổi → lỗi lộ ra sớm, dễ tìm, dễ quay lui.</div>
        focus: [1, 2, 3]
        say: "Vòng phản hồi gồm lập kế hoạch, viết mã, dựng, kiểm thử, phát hành, vận hành, theo dõi, rồi quay lại lập kế hoạch. DevOps là cách làm việc mà người viết mã và người vận hành cùng chịu trách nhiệm cho cả vòng, mọi bước lặp lại được thì tự động hoá, và vòng chạy càng nhanh càng tốt. Vòng càng ngắn thì mỗi lần đi qua càng ít thay đổi, nên lỗi lộ ra sớm, dễ tìm, và dễ quay lui."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Chia đôi lô 8 thay đổi, nhìn từng lần dựng-kiểm"
    checks:
      - "alg.bisect_builds(8, 5) == 3 and max(alg.bisect_builds(8, b) for b in range(8)) == 3"
    steps:
      - show: |
          <div><svg width="1500" height="420" viewBox="0 0 1500 420"><text x="60" y="76" font-size="26" fill="#1f2937">lần 1</text><rect x="230" y="30" width="100" height="70" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="280" y="76" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="346" y="30" width="100" height="70" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="396" y="76" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">2</text><rect x="462" y="30" width="100" height="70" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="512" y="76" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><rect x="578" y="30" width="100" height="70" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="628" y="76" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">4</text><rect x="694" y="30" width="100" height="70" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="744" y="76" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">5</text><rect x="810" y="30" width="100" height="70" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="860" y="76" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">6</text><rect x="926" y="30" width="100" height="70" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="976" y="76" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">7</text><rect x="1042" y="30" width="100" height="70" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1092" y="76" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">8</text><text x="1180" y="76" font-size="24" fill="#059669">xanh: lỗi ở 5 đến 8</text><text x="60" y="181" font-size="26" fill="#1f2937">lần 2</text><rect x="230" y="135" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="280" y="181" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="346" y="135" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="396" y="181" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">2</text><rect x="462" y="135" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="512" y="181" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><rect x="578" y="135" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="628" y="181" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">4</text><rect x="694" y="135" width="100" height="70" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="744" y="181" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">5</text><rect x="810" y="135" width="100" height="70" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="860" y="181" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">6</text><rect x="926" y="135" width="100" height="70" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="976" y="181" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">7</text><rect x="1042" y="135" width="100" height="70" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1092" y="181" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">8</text><text x="1180" y="181" font-size="24" fill="#b91c1c">đỏ: lỗi ở 5 hoặc 6</text><text x="60" y="286" font-size="26" fill="#1f2937">lần 3</text><rect x="230" y="240" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="280" y="286" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="346" y="240" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="396" y="286" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">2</text><rect x="462" y="240" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="512" y="286" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><rect x="578" y="240" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="628" y="286" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">4</text><rect x="694" y="240" width="100" height="70" rx="8" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/><text x="744" y="286" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">5</text><rect x="810" y="240" width="100" height="70" rx="8" fill="#fecaca" stroke="#1f2937" stroke-width="3"/><text x="860" y="286" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">6</text><rect x="926" y="240" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="976" y="286" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">7</text><rect x="1042" y="240" width="100" height="70" rx="8" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="1092" y="286" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">8</text><text x="1180" y="286" font-size="24" fill="#059669">xanh: lỗi là số 6</text><g font-size="22" fill="#1f2937"><rect x="230" y="358" width="40" height="30" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="282" y="382">phần đem dựng-kiểm</text><rect x="560" y="358" width="40" height="30" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="612" y="382">đã loại</text><rect x="760" y="358" width="40" height="30" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="812" y="382">thay đổi gây lỗi</text><text x="1180" y="382" fill="#2a78d6">8 thay đổi: 3 lần</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy chia đôi một lô 8 thay đổi, trong đó thay đổi số 6 gây lỗi. Lần đầu dựng với các thay đổi từ 1 tới 4, kết quả xanh, vậy lỗi ở 5 đến 8. Lần hai dựng thêm 5 và 6, kết quả đỏ, vậy lỗi ở 5 hoặc 6. Lần ba dựng tới số 5, kết quả xanh, nên thủ phạm là số 6, sau đúng 3 lần dựng kiểm."

  - id: example
    kind: example
    title: "Tìm thay đổi gây lỗi: 3 hay 300"
    checks:
      - "max(alg.bisect_builds(3, b) for b in range(3)) == 2 and max(alg.bisect_builds(300, b) for b in range(300)) == 9"
      - "(lambda h: h(h, 300))(lambda h, n: [n] if n == 1 else [n] + h(h, -(-n // 2))) == [300, 150, 75, 38, 19, 10, 5, 3, 2, 1] and (lambda h: h(h, 3))(lambda h, n: [n] if n == 1 else [n] + h(h, -(-n // 2))) == [3, 2, 1] and 4 + 5 == 9"
    steps:
      - show: |
          <p><b>Bước 1 — đề bài:</b> phát hành hỏng; biết chắc có đúng một thay đổi gây lỗi. Tìm bằng <b>chia đôi</b>: dựng và kiểm nửa đầu, hỏng thì lỗi ở nửa đầu, không thì ở nửa sau.</p>
        say: "Bước một, đề bài. Phát hành bị hỏng, và ta biết chắc có đúng một thay đổi gây lỗi. Ta tìm bằng chia đôi, dựng và kiểm nửa đầu, hỏng thì lỗi ở nửa đầu, không thì ở nửa sau."
      - show: |
          <p><b>Bước 2 — lô 3 thay đổi:</b> 3 → 2 → 1, tức $\hl{2}$ lần dựng-kiểm.</p>
        say: "Bước hai, lô 3 thay đổi. Chia đôi 3 được 1 phẩy 5, làm tròn lên thành 2, rồi 2 còn 1, vậy chỉ cần 2 lần dựng kiểm."
      - show: |
          <p><b>Bước 3 — lô 300, bốn lần đầu</b> (75 lẻ nên làm tròn lên 38):</p>
          <table class="t"><tr><th>số lần đã dựng-kiểm</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>khoảng nghi ngờ còn</td><td>300</td><td>150</td><td>75</td><td>38</td><td>19</td></tr></table>
        focus: [1, "2.2"]
        say: "Bước ba, lô 300 thay đổi, bốn lần chia đầu tiên. 300 còn 150, rồi 75, rồi 38 vì 75 lẻ nên làm tròn lên, rồi 19."
      - show: |
          <p><b>Bước 4 — lô 300, phần còn lại:</b> 19 → 10 → 5 → 3 → 2 → 1, thêm 5 lần; tổng $4 + 5 = \hl{9}$ lần.</p>
        say: "Bước bốn, đi tiếp từ 19 xuống 10, 5, 3, 2, rồi 1, thêm 5 lần nữa. Tổng cộng 4 cộng 5, bằng 9 lần dựng kiểm."
      - clear: true
        show: |
          <table class="t"><tr><th>số thay đổi trong lô</th><th>khoảng nghi ngờ sau mỗi lần chia</th><th>số lần dựng-kiểm</th></tr>
          <tr><td>3</td><td>3 → 2 → 1</td><td>$\hl{2}$</td></tr>
          <tr><td>300</td><td>300 → 150 → 75 → 38 → 19 → 10 → 5 → 3 → 2 → 1</td><td>$\hl{9}$</td></tr></table>
          <div class="box key">Lô lớn không chỉ khó tìm lỗi hơn: nó còn chứa nhiều thay đổi tương tác với nhau, nên <b>dễ hỏng hơn</b> ngay từ đầu.</div>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước năm, đặt hai lô cạnh nhau. Lô 3 thay đổi thu hẹp từ 3 xuống 2 rồi 1, chỉ cần 2 lần dựng kiểm. Lô 300 thay đổi phải chia đôi 9 lần mới còn 1. Lô lớn không chỉ khó tìm lỗi hơn, nó còn chứa nhiều thay đổi tương tác với nhau, nên dễ hỏng hơn ngay từ đầu."

  - id: check
    kind: check
    title: "Tự kiểm: đếm ngược bằng lũy thừa của 2"
    checks:
      - "2 ** 1 < 3 <= 2 ** 2 and 2 ** 8 == 256 and 2 ** 9 == 512 and 2 ** 8 < 300 <= 2 ** 9"
      - "[max(alg.bisect_builds(n, b) for b in range(n)) for n in (3, 300)] == [2, 9]"
    steps:
      - show: |
          <p>Đường khác: $k$ lần dựng-kiểm phân biệt được tối đa $2^k$ thay đổi (mỗi lần nhân đôi số khả năng phân biệt được).</p>
          <table class="t"><tr><th>số lần $k$</th><th>$2^k$</th><th>đủ cho lô?</th></tr>
          <tr><td>2</td><td>4</td><td>$4 \geq 3$: đủ cho lô 3 ✓</td></tr>
          <tr><td>8</td><td>256</td><td>256 &lt; 300: chưa đủ</td></tr>
          <tr><td>9</td><td>512</td><td>$512 \geq 300$: đủ cho lô 300 ✓</td></tr></table>
        introduces: [power, geq]
        focus: [0, 1, "2.2", "2.3", "2.4", 0]
        say: "Kiểm bằng đường khác, đếm ngược. Mỗi lần dựng kiểm nhân đôi số khả năng phân biệt được, nên k lần phân biệt được tối đa 2 mũ k thay đổi. Với 2 lần, 2 mũ 2 bằng 4, lớn hơn hoặc bằng 3, đủ cho lô 3. Với 8 lần, 2 mũ 8 bằng 256, nhỏ hơn 300, chưa đủ. Với 9 lần, 2 mũ 9 bằng 512, đủ cho lô 300. Hai đường cho cùng 2 lần và 9 lần, và máy thử hết mọi vị trí của thay đổi gây lỗi cũng ra đúng hai số đó."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "[max(alg.bisect_builds(n, b) for b in range(n)) * 30 for n in (3, 30, 300)] == [60, 150, 270] and 270 / 60 == 4.5 and 300 - 1 == 299"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Coi DevOps là một chức danh hay một công cụ <b class="red">(sai)</b>
          <br><span class="note">Đổi tên phòng vận hành thành “phòng DevOps” hay mua công cụ mới mà nhóm vẫn ném mã qua tường cho nhau thì vòng phản hồi không ngắn đi.</span></div>
        say: "Lỗi thứ nhất, coi DevOps là một chức danh hay một công cụ. Đổi tên phòng vận hành hay mua công cụ mới mà các nhóm vẫn ném mã qua tường cho nhau, thì vòng phản hồi không ngắn đi chút nào."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Tự động hoá một quy trình chậm và rủi ro <b class="red">(nhanh hơn về chỗ sai)</b>
          <br><span class="note">Tự động hoá lô 300 thay đổi vẫn là lô 300 thay đổi. Trước hết làm lô nhỏ đi, rồi tự động hoá.</span></div>
        say: "Lỗi thứ hai, tự động hoá một quy trình vốn chậm và rủi ro. Tự động hoá lô 300 thay đổi thì vẫn là lô 300 thay đổi, nên trước hết hãy làm lô nhỏ đi, rồi mới tự động hoá."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Phát hành xong là xong <b class="red">(vòng hở)</b>
          <br><span class="note">Không theo dõi sau phát hành thì không biết thay đổi có giúp người dùng không, hay âm thầm làm chậm hệ thống. Theo dõi là nửa sau của vòng.</span></div>
        say: "Lỗi thứ ba, coi phát hành xong là xong. Không theo dõi sau phát hành thì không biết thay đổi có giúp người dùng không, hay âm thầm làm chậm hệ thống, theo dõi chính là nửa sau của vòng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> “9 lần so với 2 lần, chênh có 7 lần” <b class="red">(quên rằng mỗi lần tốn thời gian thật)</b></div>
          <table class="t"><tr><th>lô</th><th>số lần dựng-kiểm</th><th>thời gian tìm, 30 phút mỗi lần (số minh hoạ)</th></tr>
          <tr><td>3</td><td>2</td><td>60 phút</td></tr>
          <tr><td>30</td><td>5</td><td>150 phút</td></tr>
          <tr><td>300</td><td>9</td><td>270 phút = 4,5 giờ</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0, 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, họ nói 9 lần so với 2 lần thì chênh có 7 lần, lô lớn cũng chẳng sao. Nhưng giả sử mỗi lần dựng kiểm mất 30 phút, đây là số minh hoạ, thì lô 3 tìm ra thủ phạm sau 60 phút. Lô 30 cần 150 phút. Lô 300 cần 270 phút, tức 4 phẩy 5 giờ, trong lúc người dùng vẫn đang gặp lỗi. Vì thế người làm nghề quay lui bản phát hành trước rồi mới tìm, nhưng quay lui lô 300 nghĩa là rút lại cả 299 thay đổi tốt. Lô nhỏ làm cả hai việc, quay lui và tìm lỗi, đều rẻ."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "max(alg.bisect_builds(30, b) for b in range(30)) == 5"
      - "(lambda h: h(h, 30))(lambda h, n: [n] if n == 1 else [n] + h(h, -(-n // 2))) == [30, 15, 8, 4, 2, 1] and 2 ** 4 == 16 and 2 ** 5 == 32 and 2 ** 4 < 30 <= 2 ** 5"
      - "25 * 13 == 325 and [max(alg.bisect_builds(n, b) for b in range(n)) for n in (25, 325)] == [5, 9]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Lô 30 thay đổi, đúng một thay đổi gây lỗi: chia đôi cần tối đa mấy lần dựng-kiểm? Viết dãy khoảng nghi ngờ.</td></tr>
          <tr><td>2</td><td>Nhóm muốn ít sự cố hơn nên đổi từ phát hành mỗi tuần sang mỗi quý. Lập luận này sai ở đâu?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, lô 30 thay đổi với đúng một thay đổi gây lỗi, chia đôi cần tối đa mấy lần dựng kiểm, và dãy khoảng nghi ngờ ra sao? Câu hai, nhóm muốn ít sự cố hơn nên đổi từ phát hành mỗi tuần sang mỗi quý, lập luận này sai ở đâu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① 30 → 15 → 8 → 4 → 2 → 1: $\hl{5}$ lần.</p>
          <p>Kiểm bằng lũy thừa: $2^4 = 16$ chưa đủ cho 30, còn $2^5 = 32 \geq 30$ ✓.</p>
        focus: [1, 1, 2]
        say: "Đáp án câu một, chia đôi từng bước. 30 xuống 15, rồi 8 vì 7 phẩy 5 làm tròn lên, rồi 4, 2, và 1, tức 5 lần. Kiểm bằng lũy thừa của 2, 2 mũ 4 bằng 16 chưa đủ cho 30, còn 2 mũ 5 bằng 32 thì đủ."
      - show: |
          <p>② Ít lần phát hành hơn nhưng mỗi lần <b>nhiều thay đổi hơn</b>. Nếu nhóm làm 25 thay đổi mỗi tuần, một quý 13 tuần gom $25 \cdot 13 = 325$ thay đổi:</p>
          <table class="t"><tr><th>nhịp phát hành</th><th>lô</th><th>số lần dựng-kiểm tối đa</th></tr>
          <tr><td>mỗi tuần</td><td>25</td><td>5</td></tr><tr><td>mỗi quý</td><td>325</td><td>9</td></tr></table>
        introduces: [cdot]
        focus: [1, 1, "2.2", "2.3", 0]
        say: "Câu hai, ít lần phát hành hơn nhưng mỗi lần chứa nhiều thay đổi hơn. Giả sử nhóm làm 25 thay đổi mỗi tuần, thì một quý 13 tuần gom 25 nhân 13, bằng 325 thay đổi. Phát hành mỗi tuần, lô 25, tìm lỗi tối đa 5 lần dựng kiểm. Phát hành mỗi quý, lô 325, cần tới 9 lần, lại thêm nhiều thay đổi tương tác nên dễ hỏng hơn và khó quay lui hơn. Vậy lập luận sai ở chỗ nó đếm số lần phát hành, mà quên đếm cỡ của mỗi lần."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">vòng phản hồi từ mã tới người dùng</span><span class="a">→</span>
          <span class="n">lô nhỏ: ít hỏng, dễ tìm lỗi</span><span class="a">→</span>
          <span class="n">tự động hoá bước lặp lại</span><span class="a">→</span>
          <span class="n">theo dõi để khép vòng</span></div>
        say: "Tổng kết lại, DevOps rút ngắn vòng phản hồi từ mã tới người dùng. Lô nhỏ thì ít hỏng và dễ tìm lỗi, các bước lặp lại thì tự động hoá, và theo dõi để khép vòng."
      - show: |
          <div class="box key"><b>Tư duy:</b> nếu một việc đau đớn, hãy làm nó <b>thường xuyên hơn</b> — cho tới khi nó nhỏ và tự động đến mức hết đau.</div>
        say: "Điều cần mang theo, nếu một việc đau đớn, hãy làm nó thường xuyên hơn, cho tới khi nó nhỏ và tự động đến mức hết đau."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>làm việc với nhánh</b> và <b>tích hợp liên tục</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học cách làm việc với nhánh và tích hợp liên tục. Hẹn gặp bạn ở bài tiếp theo."
