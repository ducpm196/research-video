    say: Hình cho thấy chia đôi một lô 8 thay đổi, trong đó thay đổi số 6 gây lỗi. Lần đầu dựng với các thay đổi từ 1 tới 4, kết quả xanh, vậy lỗi ở 5 đến 8. Lần hai dựng thêm 5 và 6, kết quả đỏ, vậy lỗi ở 5 hoặc 6. Lần ba dựng tới số 5, kết quả xanh, nên thủ phạm là số 6, sau đúng 3 lần dựng kiểm. Giống dây chuyền nướng bánh giao từng khay nhỏ liên tục thay vì dồn nguyên một tấn bột chờ hỏng cả mẻ.
- id: example
  kind: example
  title: 'Tìm thay đổi gây lỗi: 3 hay 300'
  checks:
  - max(alg.bisect_builds(3, b) for b in range(3)) == 2 and max(alg.bisect_builds(300, b) for b in range(300)) == 9
  - '(lambda h: h(h, 300))(lambda h, n: [n] if n == 1 else [n] + h(h, -(-n // 2))) == [300, 150, 75, 38, 19, 10, 5, 3, 2, 1] and (lambda h: h(h, 3))(lambda h, n: [n] if n == 1 else [n] + h(h, -(-n // 2))) == [3, 2, 1] and 4 + 5 == 9'
  steps:
  - show: '<p><b>Bước 1 — đề bài:</b> phát hành hỏng; biết chắc có đúng một thay đổi gây lỗi. Tìm bằng <b>chia đôi</b>: dựng và kiểm nửa đầu, hỏng thì lỗi ở nửa đầu, không thì ở nửa sau.</p>

      '
    say: Bước một, đề bài. Phát hành bị hỏng, và ta biết chắc có đúng một thay đổi gây lỗi. Ta tìm bằng chia đôi, dựng và kiểm nửa đầu, hỏng thì lỗi ở nửa đầu, không thì ở nửa sau.
  - show: '<p><b>Bước 2 — lô 3 thay đổi:</b> 3 → 2 → 1, tức $\hl{2}$ lần dựng-kiểm.</p>

      '
    say: Bước hai, lô 3 thay đổi. Chia đôi 3 được 1 phẩy 5, làm tròn lên thành 2, rồi 2 còn 1, vậy chỉ cần 2 lần dựng kiểm.
  - show: '<p><b>Bước 3 — lô 300, bốn lần đầu</b> (75 lẻ nên làm tròn lên 38):</p>

      <table class="t"><tr><th>số lần đã dựng-kiểm</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>

      <tr><td>khoảng nghi ngờ còn</td><td>300</td><td>150</td><td>75</td><td>38</td><td>19</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    say: Bước ba, lô 300 thay đổi, bốn lần chia đầu tiên. 300 còn 150, rồi 75, rồi 38 vì 75 lẻ nên làm tròn lên, rồi 19.
  - show: '<p><b>Bước 4 — lô 300, phần còn lại:</b> 19 → 10 → 5 → 3 → 2 → 1, thêm 5 lần; tổng $4 + 5 = \hl{9}$ lần.</p>

      '
    say: Bước bốn, đi tiếp từ 19 xuống 10, 5, 3, 2, rồi 1, thêm 5 lần nữa. Tổng cộng 4 cộng 5, bằng 9 lần dựng kiểm.
  - clear: true
    show: '<table class="t"><tr><th>số thay đổi trong lô</th><th>khoảng nghi ngờ sau mỗi lần chia</th><th>số lần dựng-kiểm</th></tr>

      <tr><td>3</td><td>3 → 2 → 1</td><td>$\hl{2}$</td></tr>

      <tr><td>300</td><td>300 → 150 → 75 → 38 → 19 → 10 → 5 → 3 → 2 → 1</td><td>$\hl{9}$</td></tr></table>

      <div class="box key">Lô lớn không chỉ khó tìm lỗi hơn: nó còn chứa nhiều thay đổi tương tác với nhau, nên <b>dễ hỏng hơn</b> ngay từ đầu.</div>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    say: Bước năm, đặt hai lô cạnh nhau. Lô 3 thay đổi thu hẹp từ 3 xuống 2 rồi 1, chỉ cần 2 lần dựng kiểm. Lô 300 thay đổi phải chia đôi 9 lần mới còn 1. Lô lớn không chỉ khó tìm lỗi hơn, nó còn chứa nhiều thay đổi tương tác với nhau, nên dễ hỏng hơn ngay từ đầu.
  - show: <p><b>Bước 4 — tính xác suất tích luỹ lỗi theo kích thước lô bằng Python</b>:</p><div class="code"><div>p_change_bug = 0.05</div><div>p_safe_1 = 1.0 - p_change_bug</div><div>p_safe_10 = (1.0 - p_change_bug) ** 10</div><div>print(f&#x27;bug1={1-p_safe_1:.1%} bug10={1-p_safe_10:.1%}&#x27;)</div></div>
    say: Bước bốn, đoạn mã Python chứng minh vì sao gộp 10 thay đổi vào một lần phát hành làm xác suất sự cố tăng vọt. Nếu mỗi thay đổi mang 5 phần trăm rủi ro phát sinh lỗi, phát hành từng thay đổi có tỉ lệ gặp lỗi chỉ 5 phần trăm. Khi gộp 10 thay đổi thành một lô lớn, rủi ro ít nhất một lỗi tăng lên 40 phẩy 1 phần trăm.
