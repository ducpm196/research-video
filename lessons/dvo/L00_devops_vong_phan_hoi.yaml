    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>bisect_steps_3=2</div><div>bisect_steps_300=9</div><div>found_bad_commit=187</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">vòng phản hồi từ mã tới người dùng</span><span class="a">→</span>

      <span class="n">lô nhỏ: ít hỏng, dễ tìm lỗi</span><span class="a">→</span>

      <span class="n">tự động hoá bước lặp lại</span><span class="a">→</span>

      <span class="n">theo dõi để khép vòng</span></div>

      '
    say: Tổng kết lại, DevOps rút ngắn vòng phản hồi từ mã tới người dùng. Lô nhỏ thì ít hỏng và dễ tìm lỗi, các bước lặp lại thì tự động hoá, và theo dõi để khép vòng. Mục tiêu cốt lõi của quy trình hiện đại là dòng chảy giá trị nhanh, ổn định và phản hồi liên tục. Vòng phản hồi ngắn rút từ vài tuần xuống vài phút giúp đội ngũ phát hiện lỗi lúc ngữ cảnh thay đổi vẫn còn mới tinh.
  - show: '<div class="box key"><b>Tư duy:</b> nếu một việc đau đớn, hãy làm nó <b>thường xuyên hơn</b> — cho tới khi nó nhỏ và tự động đến mức hết đau.</div>

      '
    say: Điều cần mang theo, nếu một việc đau đớn, hãy làm nó thường xuyên hơn, cho tới khi nó nhỏ và tự động đến mức hết đau. Rút ngắn kích thước mỗi lượt phát hành vừa giảm rủi ro vừa tăng tốc độ học hỏi từ người dùng thật. Tự động hoá dựng, kiểm thử và giám sát đồng bộ tạo sự ăn ý xuyên suốt từ máy lập trình viên tới người dùng cuối.
