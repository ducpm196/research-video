scenes:
- id: hook
  kind: hook
  title: Ba tháng phát hành một lần, lần nào cũng cháy
  steps:
  - show: '<p>Nhóm gom 300 thay đổi, ba tháng phát hành một lần, vào cuối tuần. Lần nào cũng hỏng một thứ gì đó, và không ai biết thay đổi nào gây ra. Nhóm bên cạnh phát hành mỗi ngày, mỗi lần vài thay đổi — và ít sự cố hơn.</p>

      <div class="box key">Hôm nay: <b>DevOps</b> — rút ngắn <b>vòng phản hồi</b> từ lúc viết mã tới lúc biết nó chạy đúng với người dùng.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, một nhóm gom 300 thay đổi, ba tháng phát hành một lần, vào cuối tuần. Lần nào cũng hỏng một thứ gì đó, và không ai biết thay đổi nào gây ra. Nhóm bên cạnh phát hành mỗi ngày, mỗi lần vài thay đổi, và lại ít sự cố hơn. Hôm nay ta học DevOps, rút ngắn vòng phản hồi từ lúc viết mã tới lúc biết nó chạy đúng với người dùng. Đoạn mã viết xong nhưng nằm kẹt nhiều tuần chờ kiểm tra thủ công khiến tốc độ giao giá trị sụt giảm thảm hại. Rút ngắn vòng phản hồi từ lúc viết dòng lệnh tới tay người dùng biến phát hành rủi ro thành nhịp đều hàng ngày.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: chia đôi một khoảng, làm tròn lên'
  checks:
  - '(lambda h: h(h, 8))(lambda h, n: [n] if n == 1 else [n] + h(h, -(-n // 2))) == [8, 4, 2, 1] and 75 / 2 == 37.5 and -(-75 // 2) == 38'
  - max(alg.bisect_builds(8, b) for b in range(8)) == 3
  steps:
  - show: '<p>Trò đoán số: bạn nghĩ một số từ 1 tới 8, tôi chỉ hỏi “có nằm trong nửa đầu không?”.</p>

      <table class="t"><tr><th>số khả năng còn lại</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>

      <tr><td>số câu đã hỏi</td><td>0</td><td>1</td><td>2</td><td>3</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.1'
    - '2.2'
    - '2.2'
    say: Trước hết, ôn một trò đoán số. Bạn nghĩ một số từ 1 tới 8, tôi chỉ được hỏi số đó có nằm trong nửa đầu không. Mỗi câu trả lời loại đi một nửa, nên 8 khả năng còn 4, rồi 2, rồi 1. Vậy chỉ cần 3 câu hỏi là chắc chắn đoán đúng. Thời gian chờ từ cam kết mã tới khi chạy thực tế đo lường trực tiếp độ trơn tru của toàn quy trình.
  - show: '<p>Khi số lẻ, hai nửa không bằng nhau: 75 chia đôi được 37,5, tức một nửa có 37, nửa kia có 38.</p>

      <div class="box key">Lần nào cũng xét trường hợp <b>xấu nhất</b>: thứ cần tìm nằm ở nửa lớn hơn → <b>làm tròn lên</b>, 75 → 38.</div>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Khi số khả năng là số lẻ, hai nửa không bằng nhau, ví dụ 75 chia đôi được 37 phẩy 5, nên một nửa có 37, nửa kia có 38. Ta luôn xét trường hợp xấu nhất, thứ cần tìm nằm ở nửa lớn hơn. Vì thế mỗi lần chia đôi ta làm tròn lên, 75 thành 38. Phát hành lô nhỏ hàng ngày hạ xác suất xung đột xuống gấp chục lần so với gom hàng tháng trời mới gộp.
  - show: '<p><b>Lô</b> = các thay đổi được phát hành cùng một lần. <b>Một lần dựng-kiểm</b> = dựng chương trình với một phần các thay đổi rồi chạy kiểm thử: <b class="green">xanh</b> là qua, <b class="red">đỏ</b> là hỏng.</p>

      '
    say: Thêm hai từ sẽ dùng cả bài. Lô là các thay đổi được phát hành cùng một lần. Một lần dựng kiểm là dựng chương trình với một phần các thay đổi rồi chạy kiểm thử, xanh là qua, đỏ là hỏng. Chia sẻ trách nhiệm chung giữa nhóm phát triển và vận hành xoá sạch bức tường đổ lỗi giữa hai bộ phận.
- id: sym
  kind: symbol
  title: 'Giải mã: vòng phản hồi'
  steps:
  - show: '<div class="chain"><span class="n">lập kế hoạch</span><span class="a">→</span><span class="n">viết mã</span><span class="a">→</span><span class="n">dựng</span><span class="a">→</span><span class="n">kiểm thử</span><span class="a">→</span><span class="n">phát hành</span><span class="a">→</span><span class="n">vận hành</span><span class="a">→</span><span class="n">theo dõi</span><span class="a">↺</span></div>

      <p><b>DevOps</b>: cách làm việc mà người viết mã và người vận hành cùng chịu trách nhiệm cho cả vòng; mọi bước lặp lại được thì <b>tự động hoá</b>, và vòng chạy càng nhanh càng tốt.</p>

      <div class="box key">Vòng càng ngắn, mỗi lần đi qua càng ít thay đổi → lỗi lộ ra sớm, dễ tìm, dễ quay lui.</div>

      '
    focus:
    - 1
    - 2
    - 3
    - 3
    say: Vòng phản hồi gồm lập kế hoạch, viết mã, dựng, kiểm thử, phát hành, vận hành, theo dõi, rồi quay lại lập kế hoạch. DevOps là cách làm việc mà người viết mã và người vận hành cùng chịu trách nhiệm cho cả vòng, mọi bước lặp lại được thì tự động hoá, và vòng chạy càng nhanh càng tốt. Vòng càng ngắn thì mỗi lần đi qua càng ít thay đổi, nên lỗi lộ ra sớm, dễ tìm, và dễ quay lui. Bốn thước đo cốt lõi cho thấy ngay nút thắt đang nằm ở bước kiểm thử chậm hay triển khai thủ công.
