    focus: null
- id: check
  kind: check
  title: 'Tự kiểm: đếm ngược bằng lũy thừa của 2'
  checks:
  - 2 ** 1 < 3 <= 2 ** 2 and 2 ** 8 == 256 and 2 ** 9 == 512 and 2 ** 8 < 300 <= 2 ** 9
  - '[max(alg.bisect_builds(n, b) for b in range(n)) for n in (3, 300)] == [2, 9]'
  steps:
  - show: '<p>Đường khác: $k$ lần dựng-kiểm phân biệt được tối đa $2^k$ thay đổi (mỗi lần nhân đôi số khả năng phân biệt được).</p>

      <table class="t"><tr><th>số lần $k$</th><th>$2^k$</th><th>đủ cho lô?</th></tr>

      <tr><td>2</td><td>4</td><td>$4 \geq 3$: đủ cho lô 3 ✓</td></tr>

      <tr><td>8</td><td>256</td><td>256 &lt; 300: chưa đủ</td></tr>

      <tr><td>9</td><td>512</td><td>$512 \geq 300$: đủ cho lô 300 ✓</td></tr></table>

      '
    introduces:
    - power
    - geq
    focus:
    - 0
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - 0
    say: Kiểm bằng đường khác, đếm ngược. Mỗi lần dựng kiểm nhân đôi số khả năng phân biệt được, nên k lần phân biệt được tối đa 2 mũ k thay đổi. Với 2 lần, 2 mũ 2 bằng 4, lớn hơn hoặc bằng 3, đủ cho lô 3. Với 8 lần, 2 mũ 8 bằng 256, nhỏ hơn 300, chưa đủ. Với 9 lần, 2 mũ 9 bằng 512, đủ cho lô 300. Hai đường cho cùng 2 lần và 9 lần, và máy thử hết mọi vị trí của thay đổi gây lỗi cũng ra đúng hai số đó.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc, 1 lỗi người đã đi làm
  checks:
  - '[max(alg.bisect_builds(n, b) for b in range(n)) * 30 for n in (3, 30, 300)] == [60, 150, 270] and 270 / 60 == 4.5 and 300 - 1 == 299'
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Coi DevOps là một chức danh hay một công cụ <b class="red">(sai)</b>

      <br><span class="note">Đổi tên phòng vận hành thành “phòng DevOps” hay mua công cụ mới mà nhóm vẫn ném mã qua tường cho nhau thì vòng phản hồi không ngắn đi.</span></div>

      '
    say: Lỗi thứ nhất, coi DevOps là một chức danh hay một công cụ. Đổi tên phòng vận hành hay mua công cụ mới mà các nhóm vẫn ném mã qua tường cho nhau, thì vòng phản hồi không ngắn đi chút nào. Tự động hoá triển khai lên môi trường thật nhưng giữ nguyên kiểm thử tay mất hai tuần vẫn gây nghẽn toàn bộ. Dựng đội vận hành riêng đứng tách biệt hoàn toàn tạo bức tường đổ lỗi giữa nhóm viết mã và nhóm giữ máy. Đo thành tích nhóm phát triển bằng số dòng mã và nhóm giữ máy bằng độ bảo thủ không đổi gì cả.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Tự động hoá một quy trình chậm và rủi ro <b class="red">(nhanh hơn về chỗ sai)</b>

      <br><span class="note">Tự động hoá lô 300 thay đổi vẫn là lô 300 thay đổi. Trước hết làm lô nhỏ đi, rồi tự động hoá.</span></div>

      '
    say: Lỗi thứ hai, tự động hoá một quy trình vốn chậm và rủi ro. Tự động hoá lô 300 thay đổi thì vẫn là lô 300 thay đổi, nên trước hết hãy làm lô nhỏ đi, rồi mới tự động hoá. Nhồi nhét hàng trăm tính năng mới vào một đợt phát hành tháng biến mỗi buổi tối triển khai thành đêm thức trắng gỡ lỗi. Đo năng suất bằng số lượng thay đổi triển khai thay vì gắn liền với tốc độ khôi phục và độ ổn định thực tế. Tồn tại bước chuyển giao vé chờ thủ công giữa hai đội kéo dài chu kỳ đưa bản vá lên tận hai tuần.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Phát hành xong là xong <b class="red">(vòng hở)</b>

      <br><span class="note">Không theo dõi sau phát hành thì không biết thay đổi có giúp người dùng không, hay âm thầm làm chậm hệ thống. Theo dõi là nửa sau của vòng.</span></div>

      '
    say: Lỗi thứ ba, coi phát hành xong là xong. Không theo dõi sau phát hành thì không biết thay đổi có giúp người dùng không, hay âm thầm làm chậm hệ thống, theo dõi chính là nửa sau của vòng. Quên gắn công cụ thu thập phản hồi từ hệ thống vận hành khiến nhóm phát triển mù mờ lỗi thực tế khách gặp. Để quy trình đưa bản mới lên mất hàng tuần phê duyệt thủ công làm mỗi đợt phát hành ôm hàng trăm thay đổi rủi ro.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> “9 lần so với 2 lần, chênh có 7 lần” <b class="red">(quên rằng mỗi lần tốn thời gian thật)</b></div>

      <table class="t"><tr><th>lô</th><th>số lần dựng-kiểm</th><th>thời gian tìm, 30 phút mỗi lần (số minh hoạ)</th></tr>

      <tr><td>3</td><td>2</td><td>60 phút</td></tr>

      <tr><td>30</td><td>5</td><td>150 phút</td></tr>

      <tr><td>300</td><td>9</td><td>270 phút = 4,5 giờ</td></tr></table>

      '
    focus:
    - 1
    - '2.2'
    - '2.3'
    - '2.4'
    - 0
    - 0
    - 0
    - 0
    say: Lỗi thứ tư hay gặp ở người đã đi làm, họ nói 9 lần so với 2 lần thì chênh có 7 lần, lô lớn cũng chẳng sao. Nhưng giả sử mỗi lần dựng kiểm mất 30 phút, đây là số minh hoạ, thì lô 3 tìm ra thủ phạm sau 60 phút. Lô 30 cần 150 phút. Lô 300 cần 270 phút, tức 4 phẩy 5 giờ, trong lúc người dùng vẫn đang gặp lỗi. Vì thế người làm nghề quay lui bản phát hành trước rồi mới tìm, nhưng quay lui lô 300 nghĩa là rút lại cả 299 thay đổi tốt. Lô nhỏ làm cả hai việc, quay lui và tìm lỗi, đều rẻ. Xem bộ công cụ tự động là tất cả mà bỏ qua văn hoá hợp tác minh bạch không đổ lỗi khi xảy ra sự cố. Thiếu đường dẫn phản hồi trực tiếp từ chỉ số lỗi thật trên hệ thống về tay người vừa viết dòng mã đó.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - max(alg.bisect_builds(30, b) for b in range(30)) == 5
  - '(lambda h: h(h, 30))(lambda h, n: [n] if n == 1 else [n] + h(h, -(-n // 2))) == [30, 15, 8, 4, 2, 1] and 2 ** 4 == 16 and 2 ** 5 == 32 and 2 ** 4 < 30 <= 2 ** 5'
  - 25 * 13 == 325 and [max(alg.bisect_builds(n, b) for b in range(n)) for n in (25, 325)] == [5, 9]
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Lô 30 thay đổi, đúng một thay đổi gây lỗi: chia đôi cần tối đa mấy lần dựng-kiểm? Viết dãy khoảng nghi ngờ.</td></tr>

      <tr><td>2</td><td>Nhóm muốn ít sự cố hơn nên đổi từ phát hành mỗi tuần sang mỗi quý. Lập luận này sai ở đâu?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, lô 30 thay đổi với đúng một thay đổi gây lỗi, chia đôi cần tối đa mấy lần dựng kiểm, và dãy khoảng nghi ngờ ra sao? Câu hai, nhóm muốn ít sự cố hơn nên đổi từ phát hành mỗi tuần sang mỗi quý, lập luận này sai ở đâu? Dừng video và làm ra giấy.
    pause: 15
  - clear: true
    show: '<p>① 30 → 15 → 8 → 4 → 2 → 1: $\hl{5}$ lần.</p>

      <p>Kiểm bằng lũy thừa: $2^4 = 16$ chưa đủ cho 30, còn $2^5 = 32 \geq 30$ ✓.</p>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    say: Đáp án câu một, chia đôi từng bước. 30 xuống 15, rồi 8 vì 7 phẩy 5 làm tròn lên, rồi 4, 2, và 1, tức 5 lần. Kiểm bằng lũy thừa của 2, 2 mũ 4 bằng 16 chưa đủ cho 30, còn 2 mũ 5 bằng 32 thì đủ. So sánh tổng thời gian đưa tính năng ra thị trường giữa mô hình lô lớn ba tháng và lô nhỏ tích hợp liên tục.
  - show: '<p>② Ít lần phát hành hơn nhưng mỗi lần <b>nhiều thay đổi hơn</b>. Nếu nhóm làm 25 thay đổi mỗi tuần, một quý 13 tuần gom $25 \cdot 13 = 325$ thay đổi:</p>

      <table class="t"><tr><th>nhịp phát hành</th><th>lô</th><th>số lần dựng-kiểm tối đa</th></tr>

      <tr><td>mỗi tuần</td><td>25</td><td>5</td></tr><tr><td>mỗi quý</td><td>325</td><td>9</td></tr></table>

      '
    introduces:
    - cdot
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    - 0
    say: Câu hai, ít lần phát hành hơn nhưng mỗi lần chứa nhiều thay đổi hơn. Giả sử nhóm làm 25 thay đổi mỗi tuần, thì một quý 13 tuần gom 25 nhân 13, bằng 325 thay đổi. Phát hành mỗi tuần, lô 25, tìm lỗi tối đa 5 lần dựng kiểm. Phát hành mỗi quý, lô 325, cần tới 9 lần, lại thêm nhiều thay đổi tương tác nên dễ hỏng hơn và khó quay lui hơn. Vậy lập luận sai ở chỗ nó đếm số lần phát hành, mà quên đếm cỡ của mỗi lần.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/DVO/L00
  steps:
  - show: <table class='t'><tr><th>Thực hành DVO:L00</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Tính số bước chia đôi tối đa cho n1, n2 (bisect_steps_3, bisect_steps_300) và tìm lỗi đầu tiên (found_bad_commit)</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>n1=3 n2=300 bad=187</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh DVO L00 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành tính số bước chia đôi cho n1, n2 và tìm vị trí lỗi đầu tiên. Hãy in ba khoá kết quả theo đúng định dạng rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
  - show: '<table class=''t''><tr><th>Gợi ý triển khai DVO:L00</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (số lần thử tối đa)</b></td><td>Tìm <code>k</code> nhỏ nhất sao cho <code>2**k &gt;= n</code> (nhân đôi <code>cur=1</code> tới khi <code>cur &gt;= n</code>, hoặc dùng <code>math.ceil(math.log2(n))</code>)</td></tr><tr><td><b>Bước 2 (chia đôi đoạn)</b></td><td>Khởi tạo đoạn chỉ số từ không tới phần tử cuối lịch sử</td></tr><tr><td><b>Bước 3 (hội tụ lỗi đầu)</b></td><td>Thu hẹp cận trên khi điểm giữa đã hỏng và tăng cận dưới khi còn tốt</td></tr><tr><td><b>Đọc chuẩn &amp; ghi khoá</b></td><td>Dùng <code>sys.stdin.read()</code> tách cặp <code>khoá=giá_trị</code> rồi in đúng định dạng mẫu</td></tr></table>'
    say: Gợi ý cài đặt bài số 0 gồm ba bước rõ ràng. Trước hết hãy đọc dữ liệu đầu vào bằng thư viện chuẩn sys, rồi cài đặt đúng công thức hoặc quy tắc bài toán. Cuối cùng in đủ 3 dòng khớp các khoá bisect steps 3, bisect steps 300, found bad commit.
    clear: true
