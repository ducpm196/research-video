id: L11
course: DVO
series: "DVO · DevOps: tích hợp, triển khai liên tục và vận hành"
title: "Bài 11 — Theo dõi và cảnh báo có ý nghĩa"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dvo.yaml L11; audit/dvo/verify_dvo.py L11; R. Ewaschuk, My Philosophy on Alerting (Google, 2013); Google SRE Book (2016), chương 6 (bốn tín hiệu vàng); CLD bài 11 (quan sát được)"
assumes: [arith, cdot]
# Quy ước: GB = 10^9 byte, 1 KB = 1000 byte; một ngày 86 400 giây. alg.log_volume(rps, byte mỗi yêu cầu, số ngày).
objectives:
  - "Cảnh báo theo triệu chứng người dùng thấy"
  - "Ước lượng dung lượng lưu nhật ký"
  - "Tránh mệt mỏi vì cảnh báo"
asr_reviewed:
  - {sentence: "Trước tiên, 1 ki lô byte gồm đúng 1000 byte.", reason: "ASR chép “Trước tiên, 1 kg bay gồm đúng 1.000 bay.” (0.667): “ki lô byte” ASR viết tắt “kg” rồi chép “byte” thành “bay” (cùng âm, probe p1 CSA “bay” 8/8); số 1 và 1000 khớp; mọi từ khác khớp — NOT_VERIFIED bằng tai người"}
  - {sentence: "1 GB là 1000 MB, tức một tỉ byte.", reason: "ASR chép “1 gigabyte là 1 nghìn megabyte, tức 1 tỷ byte.” (0.7): GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “GB/gigabyte”; MB đọc “mê-ga-byte” theo lexicon của khoá, ASR viết “MB/megabyte”; “tỉ” ASR viết chính tả “tỷ” (cùng âm) — NOT_VERIFIED bằng tai người"}
  - {sentence: "1 MB là 1000 ki lô byte, tức một triệu byte.", reason: "ASR chép “Một megabyte là một nghìn kilobytes, tức một triệu byte.” (0.727): MB đọc “mê-ga-byte” theo lexicon của khoá, ASR viết “MB/megabyte”; KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg” — NOT_VERIFIED bằng tai người"}
  - {sentence: "1000 nhân 1000 byte, bằng một triệu byte, tức 1 MB mỗi giây.", reason: "ASR chép “Một nghìn nhân một nghìn bay, bằng một triệu bay, tức một megabyte mỗi giây.” (0.8): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8); MB đọc “mê-ga-byte” theo lexicon của khoá, ASR viết “MB/megabyte” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nhánh trên là nhật ký, mỗi yêu cầu ghi một dòng chừng 1 ki lô byte, nên kho nhật ký phình theo đúng số yêu cầu.", reason: "ASR chép “Nhánh trên là nhật ký, mỗi yêu cầu ghi một dòng chừng 1 kg, nên khó nhật ký phình theo đúng số yêu cầu.” (0.88): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; lệch âm/thanh thuần Việt: kho/khó — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ví dụ, 3 tỉ byte là 3 GB, cứ mỗi lần lên một bậc thì chia cho 1000.", reason: "ASR chép “Ví dụ, 3 tỷ byte là 3GB, cứ mỗi lần lên một bật thì chia cho một nghìn.” (0.895): “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: bậc/bật — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở mức bình thường, mỗi yêu cầu ghi 1 ki lô byte, mỗi ngày 86 phẩy 4 GB, giữ 30 ngày là 2592 GB.", reason: "ASR chép “Ở mức bình thường, mỗi yêu cầu ghi 1 KB, mỗi ngày 86,4 GB, giữa 30 ngày là 2.592 GB.” (0.906): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg”; lệch âm/thanh thuần Việt: giữ/giữa — NOT_VERIFIED bằng tai người"}
  - {sentence: "Nếu mức chi tiết ghi 10 ki lô byte mỗi yêu cầu, đây là số minh hoạ, thì mỗi ngày thành 864 GB, và 30 ngày thành 25 nghìn 920 GB, gấp 10 lần.", reason: "ASR chép “Nếu mức chi tiết ghi 10 kilobytes mỗi yêu cầu, đây là số minh họa, thì mỗi ngày thành 864 GB và 30 ngày thành 25920 GB, gấp 10 lần.” (0.953): KB đọc “ki-lô-byte” theo lexicon của khoá, ASR viết “kilobyte/kg” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Làm từng bước, mỗi giây có 500 nhân 2000 byte, bằng một triệu byte, tức 1 MB, đúng bằng ví dụ lúc nãy.", reason: "ASR chép “Làm từng bước, mỗi dây có 500 nhân 2000 byte, bằng 1 triệu byte, tức 1 megabyte, đúng bằng ví dụ lúc nãy.” (0.96): MB đọc “mê-ga-byte” theo lexicon của khoá, ASR viết “MB/megabyte” — NOT_VERIFIED bằng tai người"}
  - {sentence: "Xét 1000 yêu cầu mỗi giây, mỗi yêu cầu ghi 1 ki lô byte nhật ký.", reason: "ASR chép “Xét 1.000 yêu cầu mỗi giây, mỗi yêu cầu ghi 1 kg 3 nhật ký.” (0.848): “ki-lô-byte” đọc tách âm tiết, ASR viết “kg” rồi chép “byte” thành “bay/ba”; byte đọc thô, ASR viết “bay” (probe CSA p1 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Câu một, 500 yêu cầu mỗi giây, 2 ki lô byte nhật ký mỗi yêu cầu, giữ 7 ngày, cần bao nhiêu GB?", reason: "ASR chép “Câu 1, 500 yêu cầu mỗi giây, 2 kg bay nhật ký mỗi yêu cầu, giữ 7 ngày, cần bao nhiêu GB?” (0.894): “ki-lô-byte” đọc tách âm tiết, ASR viết “kg” rồi chép “byte” thành “bay/ba”; byte đọc thô, ASR viết “bay” (probe CSA p1 8/8) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Đáp án câu một, 500 nhân 2000 nhân 86 nghìn 400 nhân 7, bằng 604 phẩy 8 GB.", reason: "ASR chép “Đáp án câu 1, 500 nhân 2.000 nhân 86.400 nhân 7, bằng 604,8 gigabyte.” (0.962): GB đọc “ghi-ga-byte” theo lexicon của khoá, ASR viết “gigabyte” — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Ba trăm cảnh báo mỗi tuần"
    steps:
      - show: |
          <p>Người trực nhận 300 cảnh báo mỗi tuần: “CPU máy 17 vượt 80%”, “ổ đĩa máy 4 còn 30%”… Gần như cái nào cũng tự hết. Rồi một đêm, cảnh báo thật về lỗi thanh toán lẫn giữa đám đó — và bị tắt đi như mọi cái khác.</p>
          <div class="box key">Hôm nay: <b>theo dõi và cảnh báo</b> — báo đúng thứ người dùng cảm thấy, và chỉ báo khi cần người làm gì đó.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, người trực nhận 300 cảnh báo mỗi tuần, như CPU máy 17 vượt 80 phần trăm, ổ đĩa máy 4 còn 30 phần trăm. Gần như cái nào cũng tự hết. Rồi một đêm, cảnh báo thật về lỗi thanh toán lẫn giữa đám đó, và bị tắt đi như mọi cái khác. Hôm nay ta học theo dõi và cảnh báo, báo đúng thứ người dùng cảm thấy, và chỉ báo khi cần người làm gì đó."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: byte, KB, GB và số giây trong một ngày"
    checks:
      - "10 ** 3 == 1000 and 10 ** 6 == 1000000 and 10 ** 9 == 1000000000 and 3000000000 / 10 ** 9 == 3"
      - "24 * 60 == 1440 and 1440 * 60 == 86400"
    steps:
      - show: |
          <table class="t"><tr><th>đơn vị</th><th>bằng bao nhiêu byte</th></tr>
          <tr><td>1 KB</td><td>1000</td></tr>
          <tr><td>1 MB</td><td>1000 KB = 1 000 000</td></tr>
          <tr><td>1 GB</td><td>1000 MB = 1 000 000 000</td></tr></table>
          <p>Ví dụ: 3 000 000 000 byte = 3 GB.</p>
        focus: [1, "1.2", "1.3", "1.4", 2]
        say: "Trước hết, ôn các đơn vị đo dung lượng. Trước tiên, 1 ki lô byte gồm đúng 1000 byte. 1 MB là 1000 ki lô byte, tức một triệu byte. 1 GB là 1000 MB, tức một tỉ byte. Ví dụ, 3 tỉ byte là 3 GB, cứ mỗi lần lên một bậc thì chia cho 1000."
      - show: |
          <p>Số giây trong một ngày, nhân từng bước:</p>
          <p>$24 \text{ giờ} \cdot 60 = 1440 \text{ phút}$, $\quad 1440 \cdot 60 = 86\,400 \text{ giây}$</p>
        focus: [1, 2, 2]
        say: "Tiếp theo, số giây trong một ngày, ta nhân từng bước. Một ngày có 24 giờ, nhân 60 được 1440 phút. 1440 phút nhân 60 được 86 nghìn 400 giây, con số này sẽ dùng suốt bài."

  - id: sym
    kind: symbol
    title: "Giải mã: triệu chứng, nguyên nhân, bốn tín hiệu"
    steps:
      - show: |
          <table class="t"><tr><th>loại cảnh báo</th><th>ví dụ</th><th>có nên đánh thức người?</th></tr>
          <tr><td><b>triệu chứng</b> (người dùng thấy)</td><td>tỉ lệ lỗi thanh toán 5%; 1% yêu cầu chậm nhất mất trên 2 giây</td><td><b>có</b></td></tr>
          <tr><td><b>nguyên nhân</b> (bên trong)</td><td>CPU một máy 85%</td><td>không — ghi lại, xem khi điều tra</td></tr></table>
          <p>Bốn tín hiệu nên theo dõi cho mỗi dịch vụ: <b>độ trễ</b>, <b>lưu lượng</b>, <b>lỗi</b>, <b>mức bão hoà</b> (tài nguyên gần đầy đến đâu).</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bảng phân biệt hai loại cảnh báo. Cảnh báo triệu chứng là thứ người dùng thấy, như tỉ lệ lỗi thanh toán 5 phần trăm, hay 1 phần trăm yêu cầu chậm nhất mất trên 2 giây, và nên đánh thức người. Cảnh báo nguyên nhân là thứ bên trong, như CPU một máy 85 phần trăm, không nên đánh thức ai, chỉ ghi lại để xem khi điều tra. Bốn tín hiệu nên theo dõi cho mỗi dịch vụ là độ trễ, lưu lượng, lỗi, và mức bão hoà, tức tài nguyên gần đầy đến đâu."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Mỗi yêu cầu để lại hai loại dấu vết"
    steps:
      - show: |
          <div><svg width="1500" height="370" viewBox="0 0 1500 370"><defs><marker id="arD11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="30" y="160" width="270" height="70" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="165" y="204" font-size="21" text-anchor="middle" fill="#1f2937">1000 yêu cầu mỗi giây</text><rect x="390" y="160" width="200" height="70" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="490" y="204" font-size="21" text-anchor="middle" fill="#1f2937">dịch vụ</text><rect x="700" y="40" width="380" height="70" rx="10" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="890" y="84" font-size="21" text-anchor="middle" fill="#1f2937">nhật ký: 1 KB mỗi yêu cầu</text><rect x="700" y="160" width="380" height="70" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="890" y="204" font-size="21" text-anchor="middle" fill="#1f2937">chỉ số: vài con số mỗi giây</text><rect x="1160" y="40" width="320" height="70" rx="10" fill="#fde68a" stroke="#1f2937" stroke-width="3"/><text x="1320" y="84" font-size="21" text-anchor="middle" fill="#d97706">kho: 86,4 GB mỗi ngày</text><rect x="1160" y="160" width="320" height="70" rx="10" fill="#fee2e2" stroke="#1f2937" stroke-width="3"/><text x="1320" y="204" font-size="21" text-anchor="middle" fill="#b91c1c">luật: chỉ theo triệu chứng</text><rect x="1160" y="280" width="320" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="1320" y="324" font-size="21" text-anchor="middle" fill="#1f2937">người trực bị gọi</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="300" y1="195" x2="386" y2="195" marker-end="url(#arD11)"/><line x1="590" y1="185" x2="696" y2="80" marker-end="url(#arD11)"/><line x1="590" y1="195" x2="696" y2="195" marker-end="url(#arD11)"/><line x1="1080" y1="75" x2="1156" y2="75" marker-end="url(#arD11)"/><line x1="1080" y1="195" x2="1156" y2="195" marker-end="url(#arD11)"/><line x1="1320" y1="230" x2="1320" y2="276" marker-end="url(#arD11)"/></g><text x="890" y="320" font-size="20" text-anchor="middle" fill="#6b7280">nhật ký lớn theo số yêu cầu, chỉ số thì không</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy mỗi yêu cầu đi qua dịch vụ để lại hai loại dấu vết. Nhánh trên là nhật ký, mỗi yêu cầu ghi một dòng chừng 1 ki lô byte, nên kho nhật ký phình theo đúng số yêu cầu. Nhánh dưới là chỉ số, chỉ vài con số mỗi giây như số yêu cầu, số lỗi, độ trễ, dù có bao nhiêu yêu cầu đi nữa. Luật cảnh báo đọc chỉ số, và chỉ gọi người trực khi người dùng đang thấy triệu chứng."

  - id: example
    kind: example
    title: "Nhật ký tốn bao nhiêu chỗ?"
    checks:
      - "alg.log_volume(1000, 1000) == 86.4 and alg.log_volume(1000, 1000, 30) == 2592.0"
      - "round(alg.log_volume(1000, 1000) * 0.01, 3) == 0.864"
      - "1000 * 1000 == 10 ** 6 and 86400 / 1000 == 86.4 and round(86.4 * 30, 6) == 2592 and round(2592 / 1000, 1) == 2.6"
    steps:
      - show: |
          <p><b>Bước 1 — mỗi giây:</b> 1000 yêu cầu mỗi giây, mỗi yêu cầu ghi 1 KB nhật ký:</p>
          $$1000 \cdot 1000 \text{ byte} = 1\,000\,000 \text{ byte} = 1 \text{ MB mỗi giây}$$
        focus: [1, 1, 2]
        say: "Bước một, tính cho mỗi giây. Xét 1000 yêu cầu mỗi giây, mỗi yêu cầu ghi 1 ki lô byte nhật ký. 1000 nhân 1000 byte, bằng một triệu byte, tức 1 MB mỗi giây."
      - show: |
          <p><b>Bước 2 — mỗi ngày:</b> nhân với 86 400 giây:</p>
          $$1 \text{ MB} \cdot 86\,400 = 86\,400 \text{ MB} = \hl{86{,}4} \text{ GB}$$
        focus: [1, 2]
        say: "Bước hai, một ngày có 86 nghìn 400 giây. Nhân lên được 86 nghìn 400 MB, chia 1000 thành 86 phẩy 4 GB mỗi ngày."
      - show: |
          <p><b>Bước 3 — giữ 30 ngày:</b></p>
          $$86{,}4 \cdot 30 = \hl{2592} \text{ GB} \approx 2{,}6 \text{ nghìn GB}$$
        introduces: [approx]
        focus: [1, 2]
        say: "Bước ba, giữ nhật ký 30 ngày. 86 phẩy 4 nhân 30, bằng 2592 GB, tức khoảng 2 phẩy 6 nghìn GB."
      - clear: true
        show: |
          <p><b>Bước 4 — lấy mẫu:</b> giữ 1% yêu cầu thành công (giữ đủ mọi yêu cầu lỗi):</p>
          $$86{,}4 \cdot 0{,}01 \approx 0{,}864 \text{ GB mỗi ngày cho phần thành công}$$
          <div class="box key">Lấy mẫu phần bình thường, giữ đủ phần lỗi. Chỉ số tổng hợp thì gần như không tốn chỗ.</div>
        focus: [1, 2, 3]
        say: "Bước bốn, lấy mẫu. Nếu lấy mẫu 1 phần trăm yêu cầu thành công mà vẫn giữ đủ mọi yêu cầu lỗi, phần thành công chỉ còn khoảng 0 phẩy 864 GB mỗi ngày. Còn chỉ số tổng hợp thì gần như không tốn chỗ."

  - id: check
    kind: check
    title: "Tự kiểm: đi qua từng giờ"
    checks:
      - "1 * 3600 / 1000 == 3.6 and round(3.6 * 24, 6) == 86.4 and 30 * 24 == 720 and round(3.6 * 720, 6) == 2592"
    steps:
      - show: |
          <p>Đường khác: đổi sang <b>mỗi giờ</b> trước, vì một giờ có 3600 giây.</p>
          <table class="t"><tr><th>khoảng</th><th>phép tính</th><th>dung lượng</th></tr>
          <tr><td>1 giờ</td><td>$1 \text{ MB} \cdot 3600$</td><td>3,6 GB</td></tr>
          <tr><td>1 ngày</td><td>$3{,}6 \cdot 24$</td><td>86,4 GB ✓</td></tr>
          <tr><td>30 ngày = 720 giờ</td><td>$3{,}6 \cdot 720$</td><td>2592 GB ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Kiểm bằng đường khác, ta đổi sang mỗi giờ trước, vì một giờ có 3600 giây. 1 MB mỗi giây nhân 3600 được 3 phẩy 6 GB mỗi giờ. Nhân 24 giờ được 86 phẩy 4 GB mỗi ngày, khớp bước hai. 30 ngày là 720 giờ, 3 phẩy 6 nhân 720 được 2592 GB, khớp bước ba. Hai đường đi khác nhau nhưng cho cùng kết quả."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "alg.log_volume(1000, 1000) == 86.4 and alg.log_volume(1000, 10000) == 864.0 and alg.log_volume(1000, 10000, 30) == 25920.0 and 25920 / 2592 == 10"
      - "86400 * 30 == 2592000 and round(1000 * 2592000 * 0.001) == 2592000 and round(1000 * 10 * 0.05) == 500 and round(500 / 2592000 * 100, 3) == 0.019"
      - "round(1000 * 3600 * 0.05) == 180000 and round(180000 / 2592000 * 100, 2) == 6.94 and 2592000 / 180000 == 14.4"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Cảnh báo quá nhiều <b class="red">(mệt mỏi vì cảnh báo)</b>
          <br><span class="note">Cảnh báo không cần làm gì dạy người trực bỏ qua cảnh báo. Mỗi cảnh báo phải trả lời: người nhận cần làm gì <b>ngay</b>? Không có câu trả lời thì đổi thành báo cáo hằng ngày.</span></div>
        say: "Lỗi thứ nhất, cảnh báo quá nhiều. Cảnh báo không cần làm gì sẽ dạy người trực bỏ qua cảnh báo. Mỗi cảnh báo phải trả lời được người nhận cần làm gì ngay, không có câu trả lời thì đổi thành báo cáo hằng ngày."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Cảnh báo theo ngưỡng tức thời <b class="red">(chập chờn)</b>
          <br><span class="note">Tỉ lệ lỗi chạm 5% trong 10 giây rồi tự hết. Cảnh báo theo mức <b>tiêu ngân sách lỗi</b> trong một khoảng thời gian (ví dụ 1 giờ) thì ít báo nhầm hơn.</span></div>
          <p><b>Ngân sách lỗi</b>: nếu nhóm cam kết 99,9% yêu cầu thành công trong 30 ngày, thì 0,1% còn lại là phần <b>được phép lỗi</b>. Với 1000 yêu cầu mỗi giây, 30 ngày có $86\,400 \cdot 30 = 2\,592\,000$ giây, nên ngân sách là $1000 \cdot 2\,592\,000 \cdot 0{,}001 = 2\,592\,000$ lỗi.</p>
        focus: [1, 1, 2, 2]
        say: "Lỗi thứ hai, cảnh báo theo ngưỡng tức thời. Tỉ lệ lỗi chạm 5 phần trăm trong 10 giây rồi tự hết, nên hãy cảnh báo theo mức tiêu ngân sách lỗi trong một khoảng thời gian, ví dụ 1 giờ, để ít báo nhầm hơn. Ngân sách lỗi nghĩa là nếu nhóm cam kết 99 phẩy 9 phần trăm yêu cầu thành công trong 30 ngày, thì 0 phẩy 1 phần trăm còn lại là phần được phép lỗi. Với 1000 yêu cầu mỗi giây, 30 ngày có 2 triệu 592 nghìn giây, nên ngân sách là 2 triệu 592 nghìn lỗi."
      - clear: true
        show: |
          <table class="t"><tr><th>tình huống, 1000 yêu cầu mỗi giây</th><th>số lỗi</th><th>phần ngân sách 30 ngày</th></tr>
          <tr><td>lỗi 5% trong 10 giây rồi tự hết</td><td>$1000 \cdot 10 \cdot 0{,}05 = 500$</td><td>$\approx 0{,}019\%$: không cần đánh thức ai</td></tr>
          <tr><td>lỗi 5% kéo dài 1 giờ</td><td>$1000 \cdot 3600 \cdot 0{,}05 = 180\,000$</td><td>$\approx 6{,}94\%$; cứ thế thì hết ngân sách sau $2\,592\,000 : 180\,000 = 14{,}4$ giờ → <b>gọi người</b></td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3"]
        say: "Làm thử hai tình huống với 1000 yêu cầu mỗi giây. Lỗi 5 phần trăm chỉ trong 10 giây cho 1000 nhân 10 nhân 0 phẩy 05, bằng 500 lỗi. Đó chỉ là khoảng 0 phẩy 019 phần trăm ngân sách, không cần đánh thức ai. Lỗi 5 phần trăm kéo dài 1 giờ cho 180 nghìn lỗi, tức khoảng 6 phẩy 94 phần trăm ngân sách chỉ trong một giờ. Cứ đà đó thì ngân sách cả tháng hết sau 14 phẩy 4 giờ, nên phải gọi người ngay."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Ghi nhật ký mọi thứ, giữ mãi mãi <b class="red">(tốn kém, lộ dữ liệu)</b>
          <br><span class="note">Nhật ký chứa thông tin cá nhân giữ vô thời hạn là rủi ro pháp lý. Đặt thời hạn lưu, lấy mẫu phần bình thường, che dữ liệu nhạy cảm.</span></div>
        say: "Lỗi thứ ba, ghi nhật ký mọi thứ và giữ mãi mãi. Nhật ký chứa thông tin cá nhân giữ vô thời hạn là rủi ro pháp lý, nên hãy đặt thời hạn lưu, lấy mẫu phần bình thường, và che dữ liệu nhạy cảm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Bật mức ghi <b>chi tiết</b> để điều tra một sự cố, rồi quên tắt <b class="red">(kho nhật ký phình gấp 10)</b></div>
          <table class="t"><tr><th>mức ghi, 1000 yêu cầu mỗi giây</th><th>mỗi yêu cầu</th><th>mỗi ngày</th><th>giữ 30 ngày</th></tr>
          <tr><td>bình thường</td><td>1 KB</td><td>86,4 GB</td><td>2592 GB</td></tr>
          <tr><td>chi tiết (số minh hoạ)</td><td>10 KB</td><td>864 GB</td><td>25 920 GB</td></tr></table>
        focus: [1, "2.2", "2.3", 0, 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, bật mức ghi chi tiết để điều tra một sự cố, rồi quên tắt. Ở mức bình thường, mỗi yêu cầu ghi 1 ki lô byte, mỗi ngày 86 phẩy 4 GB, giữ 30 ngày là 2592 GB. Nếu mức chi tiết ghi 10 ki lô byte mỗi yêu cầu, đây là số minh hoạ, thì mỗi ngày thành 864 GB, và 30 ngày thành 25 nghìn 920 GB, gấp 10 lần. Người làm nghề bật mức chi tiết có hẹn giờ tự tắt, hoặc chỉ cho một phần nhỏ yêu cầu. Họ cũng đặt cảnh báo cho chính tốc độ ghi nhật ký, để biết ngay khi nó tăng vọt."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.log_volume(500, 2000, 7), 1) == 604.8"
      - "500 * 2000 == 1000000 and alg.log_volume(500, 2000) == 86.4 and round(86.4 * 7, 6) == 604.8"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>500 yêu cầu mỗi giây, 2 KB nhật ký mỗi yêu cầu, giữ 7 ngày: cần bao nhiêu GB?</td></tr>
          <tr><td>2</td><td>Trong hai cảnh báo “CPU máy 9 trên 90%” và “10% yêu cầu đăng nhập lỗi trong 15 phút”, cái nào nên đánh thức người trực?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 500 yêu cầu mỗi giây, 2 ki lô byte nhật ký mỗi yêu cầu, giữ 7 ngày, cần bao nhiêu GB? Câu hai, giữa cảnh báo CPU máy 9 trên 90 phần trăm và cảnh báo 10 phần trăm yêu cầu đăng nhập lỗi trong 15 phút, cái nào nên đánh thức người trực? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>bước</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>mỗi giây</td><td>$500 \cdot 2000$ byte</td><td>1 000 000 byte = 1 MB</td></tr>
          <tr><td>mỗi ngày</td><td>$1 \text{ MB} \cdot 86\,400$</td><td>86,4 GB</td></tr>
          <tr><td>7 ngày</td><td>$86{,}4 \cdot 7$</td><td>$\hl{604{,}8}$ GB</td></tr></table>
        focus: [0, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, 500 nhân 2000 nhân 86 nghìn 400 nhân 7, bằng 604 phẩy 8 GB. Làm từng bước, mỗi giây có 500 nhân 2000 byte, bằng một triệu byte, tức 1 MB, đúng bằng ví dụ lúc nãy. Vì thế mỗi ngày cũng là 86 phẩy 4 GB. Giữ 7 ngày thì 86 phẩy 4 nhân 7, bằng 604 phẩy 8 GB."
      - show: |
          <table class="t"><tr><th>cảnh báo</th><th>người dùng có thấy?</th><th>đánh thức người trực?</th></tr>
          <tr><td>CPU máy 9 trên 90%</td><td>chưa chắc — là nguyên nhân bên trong</td><td>không, ghi lại để điều tra</td></tr>
          <tr><td>10% yêu cầu đăng nhập lỗi trong 15 phút</td><td>có — là triệu chứng</td><td><b>có</b></td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Câu hai, xét từng cảnh báo bằng một câu hỏi, người dùng có thấy không. CPU máy 9 trên 90 phần trăm là nguyên nhân bên trong, người dùng chưa chắc thấy gì, nên chỉ ghi lại để xem khi điều tra. Cảnh báo đăng nhập lỗi là triệu chứng người dùng thấy, nên đó là cái cần đánh thức người trực."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">bốn tín hiệu cho mỗi dịch vụ</span><span class="a">→</span>
          <span class="n">đánh thức người chỉ vì triệu chứng</span><span class="a">→</span>
          <span class="n">mỗi cảnh báo có việc cần làm</span><span class="a">→</span>
          <span class="n">nhật ký có hạn lưu, lấy mẫu</span></div>
        say: "Tổng kết lại, theo dõi bốn tín hiệu cho mỗi dịch vụ, chỉ đánh thức người vì triệu chứng, mỗi cảnh báo phải có việc cần làm, và nhật ký cần có hạn lưu và lấy mẫu."
      - show: |
          <div class="box key"><b>Tư duy:</b> sự chú ý của người trực là tài nguyên khan hiếm nhất của hệ thống. Đừng tiêu nó vào tiếng ồn.</div>
        say: "Điều cần mang theo, sự chú ý của người trực là tài nguyên khan hiếm nhất của hệ thống. Đừng tiêu nó vào tiếng ồn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 12): <b>bảo mật trong đường ống</b> — quét phụ thuộc, ký sản phẩm dựng, quyền tối thiểu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 12, ta học bảo mật trong đường ống, với quét phụ thuộc, ký sản phẩm dựng, và quyền tối thiểu. Hẹn gặp bạn ở bài tiếp theo."
