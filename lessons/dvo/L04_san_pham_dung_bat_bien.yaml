  - id: check
    kind: check
    title: "Tự kiểm: so thẳng từng byte của hai gói"
    checks:
      - "(lambda z, io, src: (lambda pk: (lambda a, b, c: (len(a), len(b), sum(x != y for x, y in zip(a, b)), [i for i, (x, y) in enumerate(zip(a, b)) if x != y], a == c, __import__('hashlib').sha256(a).hexdigest()[:12]))(pk((2026, 10, 1, 9, 0, 0)), pk((2026, 10, 2, 14, 30, 0)), pk((2026, 10, 1, 9, 0, 0))))(lambda mt: (lambda b: (lambda zf: (zf.writestr(z.ZipInfo('app.py', date_time=mt), src), zf.close(), b.getvalue())[2])(z.ZipFile(b, 'w', z.ZIP_STORED)))(io.BytesIO())))(__import__('zipfile'), __import__('io'), b'print(\"xin chao\")\\n') == (128, 128, 6, [10, 11, 12, 66, 67, 68], True, 'dac8a9bd655a')"
    steps:
      - show: |
          <p>Đường khác: không băm nữa, đặt hai gói cạnh nhau và so <b>từng byte</b>.</p>
          <table class="t"><tr><th>so</th><th>độ dài</th><th>số byte khác nhau</th></tr>
          <tr><td>lần 1 với lần 2</td><td>128 và 128</td><td>6, nằm ở 2 chỗ ghi thời điểm (đầu gói và mục lục cuối gói)</td></tr>
          <tr><td>lần 1 với lần 3</td><td>128 và 128</td><td>0 ✓ — trùng từng byte</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", 0]
        say: "Kiểm bằng đường khác, không băm nữa mà đặt hai gói cạnh nhau và so từng byte. Gói lần một và lần hai cùng dài 128 byte, nhưng khác nhau ở 6 byte. Cả 6 byte đó nằm ở hai chỗ ghi thời điểm, một ở đầu gói, một ở mục lục cuối gói. Gói lần một và lần ba thì trùng từng byte. Vậy mã băm khác nhau đúng vì thời điểm, không vì lý do nào khác."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "[d > 14 for d in (20, 10, 2)] == [True, False, False]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Dựng lại riêng cho môi trường thật <b class="red">(chưa từng được kiểm)</b>
          <br><span class="note">Thứ chạy thật là một sản phẩm mới mà chưa kiểm thử nào chạy qua. Thăng hạng chính sản phẩm đã kiểm, nhận diện bằng mã băm.</span></div>
        say: "Lỗi thứ nhất, dựng lại riêng cho môi trường thật. Thứ chạy thật khi đó là một sản phẩm mới mà chưa kiểm thử nào chạy qua. Hãy đưa lên chính sản phẩm đã kiểm, nhận diện bằng mã băm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Gọi bản bằng nhãn có thể di chuyển <b class="red">(không biết đang chạy gì)</b>
          <br><span class="note">Nhãn “mới nhất” hay “ổn định” có thể được gán lại cho bản khác. Ghi mã băm vào bản ghi triển khai để biết chính xác thứ đang chạy.</span></div>
        say: "Lỗi thứ hai, gọi bản bằng một nhãn có thể di chuyển. Nhãn mới nhất hay ổn định có thể được gán lại cho bản khác, nên hãy ghi mã băm vào bản ghi triển khai để biết chính xác thứ đang chạy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Đóng cấu hình môi trường vào sản phẩm <b class="red">(mỗi nơi một bản)</b>
          <br><span class="note">Địa chỉ cơ sở dữ liệu nằm trong gói thì thử nghiệm và thật phải là hai gói khác nhau — mất ý nghĩa “dựng một lần”. Cấu hình đưa vào lúc chạy.</span></div>
        say: "Lỗi thứ ba, đóng cấu hình môi trường vào sản phẩm. Địa chỉ cơ sở dữ liệu nằm trong gói thì thử nghiệm và môi trường thật phải là hai gói khác nhau, mất hẳn ý nghĩa dựng một lần. Cấu hình phải được đưa vào lúc chạy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Kho sản phẩm dựng tự dọn mọi bản cũ hơn 14 ngày <b class="red">(xoá mất bản đang chạy thật)</b></div>
          <table class="t"><tr><th>bản</th><th>dựng cách đây</th><th>đang chạy ở</th><th>dọn theo tuổi, giữ 14 ngày</th></tr>
          <tr><td>A</td><td>20 ngày</td><td>thật</td><td class="red">bị xoá</td></tr>
          <tr><td>B</td><td>10 ngày</td><td>thử nghiệm</td><td>còn</td></tr>
          <tr><td>C</td><td>2 ngày</td><td>chưa triển khai</td><td>còn</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 0, 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, kho sản phẩm dựng đầy dần, nên ai đó đặt luật tự dọn mọi bản cũ hơn 14 ngày. Bảng có ba bản. Bản A dựng cách đây 20 ngày, đang chạy ở môi trường thật, và bị xoá vì 20 lớn hơn 14. Bản B 10 ngày và bản C 2 ngày thì còn. Khi cần thêm máy hay quay lui về bản A, hệ thống tìm gói theo mã băm và không thấy, mà dựng lại thì ra gói khác chưa từng được kiểm. Người làm nghề dọn theo cách dùng, giữ mọi bản đang chạy ở bất kỳ môi trường nào cùng vài bản gần nhất từng lên thật, rồi mới dọn theo tuổi."

