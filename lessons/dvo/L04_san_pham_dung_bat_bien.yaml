- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">dựng một lần</span><span class="a">→</span>

      <span class="n">nhận diện bằng mã băm</span><span class="a">→</span>

      <span class="n">cùng sản phẩm qua mọi môi trường</span><span class="a">→</span>

      <span class="n">cố định thứ ngoài mã nguồn để tái lập</span></div>

      '
    say: Tổng kết lại, dựng một lần, nhận diện bằng mã băm, đưa cùng một sản phẩm qua mọi môi trường, và cố định mọi thứ ngoài mã nguồn để tái lập được. Sản phẩm dựng bất biến là sợi dây nối tin cậy có kiểm chứng giữa kiểm thử thành công và triển khai an toàn. Dựng đúng một gói bất biến duy nhất một lần và đẩy nguyên gói đó qua mọi môi trường kiểm thử tới sản xuất.
  - show: '<div class="box key"><b>Tư duy:</b> bằng chứng kiểm thử chỉ có giá trị cho <b>đúng</b> thứ đã được kiểm. Đổi một byte là phải kiểm lại.</div>

      '
    say: Điều cần mang theo, bằng chứng kiểm thử chỉ có giá trị cho đúng thứ đã được kiểm. Đổi một byte là phải kiểm lại. Quản lý cấu hình hạ tầng cũng tuân theo kỷ luật mã hoá và tái lập tương tự ở bước hạ tầng dạng mã. Nhờ tính bất biến gắn thẻ định danh, thao tác quay lui bản trước hoàn tất sạch sẽ chỉ trong vài giây.
  - clear: true
    show: '<p class="note">Bài sau (bài 5): <b>hạ tầng dạng mã</b> — khai báo và lũy đẳng.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 5, ta học hạ tầng dạng mã, với khai báo và lũy đẳng. Hẹn gặp bạn ở bài tiếp theo.
