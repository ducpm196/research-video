    focus:
    - '1.2'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai DVO:L05</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1 (hàm khai báo)</b></td><td>Luôn đưa hệ thống về trạng thái đích bất kể trạng thái hiện có</td></tr><tr><td><b>Bước 2 (hàm mệnh lệnh)</b></td><td>Áp dụng phép cộng tăng thêm mỗi lần chạy dẫn đến trôi trạng thái</td></tr><tr><td><b>Bước 3 (kiểm lũy đẳng)</b></td><td>Kiểm chạy thêm lần nữa vẫn giữ nguyên đích của hàm khai báo</td></tr><tr><td><b>Đọc chuẩn &amp; ghi khoá</b></td><td>Dùng <code>sys.stdin.read()</code> tách cặp <code>khoá=giá_trị</code> rồi in đúng định dạng mẫu</td></tr></table>
    say: Gợi ý cài đặt bài số 5 gồm ba bước rõ ràng. Trước hết hãy đọc dữ liệu đầu vào bằng thư viện chuẩn sys, rồi cài đặt đúng công thức hoặc quy tắc bài toán. Cuối cùng in đủ 3 dòng khớp các khoá decl after 2 runs, imp after 2 runs, decl is idempotent.
