    say: Mời bạn tự thực hành bài số 5 với dữ liệu đọc từ luồng chuẩn. Đọc kỹ định dạng tham số trong tệp đề bài, tách đúng các cặp khoá giá trị rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn.
    clear: true
