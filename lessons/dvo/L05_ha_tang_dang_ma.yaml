id: L05
course: DVO
series: "DVO · DevOps: tích hợp, triển khai liên tục và vận hành"
title: "Bài 5 — Hạ tầng dạng mã: khai báo và lũy đẳng"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dvo.yaml L05; audit/dvo/verify_dvo.py L05; K. Morris, Infrastructure as Code, 2nd ed. (O'Reilly, 2020), chương 4 và 6; CLD bài 5 (trạng thái mong muốn, vòng điều khiển)"
assumes: [arith]
# Quy ước: trạng thái hạ tầng mô hình hoá bằng từ điển {tài nguyên: số bản}. alg.iac_apply: khai báo (desired) đặt bằng giá trị mong muốn;
#   mệnh lệnh (add) cộng thêm. “Trôi cấu hình” = thực tế khác khai báo; phát hiện bằng so khác biệt.
objectives:
  - "So sánh hạ tầng khai báo và kịch bản mệnh lệnh"
  - "Hiểu lũy đẳng"
  - "Phát hiện cấu hình bị trôi"
asr_reviewed:
  - {sentence: "Vì thế công cụ xoá 3 máy web.", reason: "ASR chép “vì thế công cụ xóa 3 máy huét.” (0.875): web đọc thô (probe NET p2: 8/8), lần này ASR viết sai — NOT_VERIFIED bằng tai người"}
  - {sentence: "Bảng so hai cách mô tả hạ tầng.", reason: "ASR chép “Vãng so 2 cách mô tả hạ từng.” (0.75): lệch âm/thanh thuần Việt: bảng/vãng, tầng/từng — NOT_VERIFIED bằng tai người"}
  - {sentence: "Chào bạn, một kịch bản thêm 2 máy chủ web bị lỗi mạng giữa chừng, người trực chạy lại cho chắc.", reason: "ASR chép “Chào bạn, một kịch bản thêm hai máy chủ hét bị lỗi mạng giữa chừng, người trực chạy lại cho chắc.” (0.952): web đọc thô (probe NET p2: 8/8), lần này ASR viết sai — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Kịch bản chạy hai lần, tiền điện tăng gấp đôi"
    checks:
      - "alg.iac_apply(alg.iac_apply({'web': 3}, add={'web': 2}), add={'web': 2}) == {'web': 7}"
    steps:
      - show: |
          <p>Kịch bản “thêm 2 máy chủ web” bị lỗi mạng giữa chừng, người trực chạy lại cho chắc. Cả hai lần đều thành công: 3 máy thành $\hl{7}$ thay vì 5. Không ai biết cho tới khi nhận hoá đơn.</p>
          <div class="box key">Hôm nay: <b>hạ tầng dạng mã</b> — mô tả hạ tầng <b>muốn có</b> trong tệp, và áp bao nhiêu lần cũng ra cùng kết quả.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một kịch bản thêm 2 máy chủ web bị lỗi mạng giữa chừng, người trực chạy lại cho chắc. Cả hai lần đều thành công, 3 máy thành 7 thay vì 5, và không ai biết cho tới khi nhận hoá đơn. Hôm nay ta học hạ tầng dạng mã, mô tả hạ tầng muốn có trong tệp, và áp bao nhiêu lần cũng ra cùng kết quả."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: ghi trạng thái thành bảng, và vòng điều khiển"
    checks:
      - "{'web': 3, 'db': 1}['web'] + {'web': 3, 'db': 1}['db'] == 4 and 3 - 2 == 1"
    steps:
      - show: |
          <p>Ghi hạ tầng thành một bảng <b>tài nguyên → số bản</b>, viết gọn <code>{web: 3, db: 1}</code>:</p>
          <table class="t"><tr><th>tài nguyên</th><th>số bản</th></tr>
          <tr><td>web (máy chủ web)</td><td>3</td></tr>
          <tr><td>db (cơ sở dữ liệu)</td><td>1</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Trước hết, ta ghi hạ tầng thành một bảng, mỗi tài nguyên đi kèm số bản đang chạy, viết gọn trong hai dấu ngoặc nhọn. Dòng web nghĩa là có 3 máy chủ web. Dòng tiếp theo nghĩa là có 1 cơ sở dữ liệu. Tổng cộng hạ tầng này có 4 máy."
      - show: |
          <p>Ở khoá Hệ thống hướng dịch vụ, <b>vòng điều khiển</b> lặp mãi ba việc:</p>
          <table class="t"><tr><th>việc</th><th>ví dụ: muốn 3 bản, đang sống 2</th></tr>
          <tr><td>so mong muốn với thực tế</td><td>3 và 2</td></tr>
          <tr><td>tính khác biệt</td><td>$3 - 2 = 1$ bản thiếu</td></tr>
          <tr><td>chỉ làm phần khác biệt</td><td>tạo 1 bản → thực tế về 3</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Thứ hai, ở khoá Hệ thống hướng dịch vụ, ta đã gặp vòng điều khiển, lặp mãi ba việc. Việc đầu là so mong muốn với thực tế, ví dụ muốn 3 bản mà đang sống 2. Việc hai là tính khác biệt, 3 trừ 2 bằng 1 bản thiếu. Việc ba là chỉ làm phần khác biệt, tạo 1 bản, và thực tế về lại 3."

  - id: sym
    kind: symbol
    title: "Giải mã: khai báo, mệnh lệnh, lũy đẳng"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>viết</th><th>chạy lại</th></tr>
          <tr><td><b>mệnh lệnh</b></td><td>“thêm 2 máy”</td><td>thêm tiếp 2 máy</td></tr>
          <tr><td><b>khai báo</b></td><td>“web = 5 máy”</td><td>đã đủ 5 → không làm gì</td></tr></table>
          <p><b>Lũy đẳng</b>: làm một lần hay nhiều lần cho cùng kết quả. Công cụ khai báo tự tính <b>khác biệt</b> giữa thực tế và mong muốn, rồi chỉ làm phần khác biệt.</p>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Bảng so hai cách mô tả hạ tầng. Cách mệnh lệnh viết thêm 2 máy, chạy lại thì thêm tiếp 2 máy. Cách khai báo viết web bằng 5 máy, chạy lại khi đã đủ 5 thì không làm gì. Lũy đẳng nghĩa là làm một lần hay nhiều lần đều cho cùng kết quả. Công cụ khai báo tự tính khác biệt giữa thực tế và mong muốn, rồi chỉ làm phần khác biệt đó."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Một bên so rồi mới làm, một bên cứ làm"
    checks:
      - "5 - 3 == 2 and 5 - 5 == 0 and 3 + 2 == 5 and 5 + 2 == 7"
    steps:
      - show: |
          <div><svg width="1500" height="370" viewBox="0 0 1500 370"><defs><marker id="arD5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="20" y="100" font-size="24" font-weight="bold" fill="#059669">khai báo</text><text x="20" y="130" font-size="22" fill="#059669">web = 5</text><rect x="240" y="50" width="150" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="315" y="102" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><line x1="390" y1="90" x2="690" y2="90" stroke="#1f2937" stroke-width="3" marker-end="url(#arD5)"/><text x="540" y="38" font-size="20" text-anchor="middle" fill="#059669">lần 1: muốn 5, có 3</text><text x="540" y="64" font-size="20" text-anchor="middle" fill="#059669">thiếu 2, tạo 2</text><rect x="690" y="50" width="150" height="80" rx="10" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="765" y="102" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">5</text><line x1="840" y1="90" x2="1140" y2="90" stroke="#1f2937" stroke-width="3" marker-end="url(#arD5)"/><text x="990" y="38" font-size="20" text-anchor="middle" fill="#059669">lần 2: muốn 5, có 5</text><text x="990" y="64" font-size="20" text-anchor="middle" fill="#059669">đủ, không làm gì</text><rect x="1140" y="50" width="150" height="80" rx="10" fill="#bbf7d0" stroke="#059669" stroke-width="3"/><text x="1215" y="102" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">5</text><text x="20" y="280" font-size="24" font-weight="bold" fill="#b91c1c">mệnh lệnh</text><text x="20" y="310" font-size="22" fill="#b91c1c">thêm 2</text><rect x="240" y="230" width="150" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="315" y="282" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><line x1="390" y1="270" x2="690" y2="270" stroke="#1f2937" stroke-width="3" marker-end="url(#arD5)"/><text x="540" y="218" font-size="20" text-anchor="middle" fill="#b91c1c">lần 1</text><text x="540" y="244" font-size="20" text-anchor="middle" fill="#b91c1c">cộng 2</text><rect x="690" y="230" width="150" height="80" rx="10" fill="#fef08a" stroke="#d97706" stroke-width="3"/><text x="765" y="282" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">5</text><line x1="840" y1="270" x2="1140" y2="270" stroke="#1f2937" stroke-width="3" marker-end="url(#arD5)"/><text x="990" y="218" font-size="20" text-anchor="middle" fill="#b91c1c">lần 2</text><text x="990" y="244" font-size="20" text-anchor="middle" fill="#b91c1c">cộng 2 nữa</text><rect x="1140" y="230" width="150" height="80" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><text x="1215" y="282" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">7</text><text x="1320" y="100" font-size="22" fill="#059669">vẫn 5</text><text x="1320" y="280" font-size="22" fill="#b91c1c">thừa 2</text></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đặt hai cách cạnh nhau, cùng xuất phát từ 3 máy. Hàng trên là khai báo, lần đầu nó so muốn 5 với có 3, thấy thiếu 2 nên tạo 2 máy. Lần hai nó so muốn 5 với có 5, thấy đủ nên không làm gì, vẫn là 5. Hàng dưới là mệnh lệnh, nó không nhìn thực tế, cứ mỗi lần chạy lại cộng thêm 2, nên từ 3 thành 5 rồi thành 7."

  - id: example
    kind: example
    title: "Áp hai lần: 5 và 7"
    checks:
      - "alg.iac_apply({'web': 3}, desired={'web': 5}) == alg.iac_apply(alg.iac_apply({'web': 3}, desired={'web': 5}), desired={'web': 5}) == {'web': 5}"
      - "alg.iac_apply(alg.iac_apply({'web': 3}, add={'web': 2}), add={'web': 2}) == {'web': 7}"
    steps:
      - show: |
          <p><b>Bước 1 — trạng thái ban đầu:</b> cả hai cách cùng xuất phát từ <code>{web: 3}</code>.</p>
          <table class="t"><tr><th>lần</th><th>khai báo “web = 5”</th><th>mệnh lệnh “thêm 2”</th></tr>
          <tr><td>ban đầu</td><td>3</td><td>3</td></tr></table>
        focus: [1, "2.2"]
        say: "Bước một, ta áp hai cách lên cùng trạng thái ban đầu 3 máy. Ban đầu cả hai đều là 3."
      - show: |
          <p><b>Bước 2 — áp lần 1:</b></p>
          <table class="t"><tr><th>cách</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>khai báo</td><td>khác biệt $5 - 3 = 2$ → tạo 2</td><td>5</td></tr>
          <tr><td>mệnh lệnh</td><td>$3 + 2$</td><td>5</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Bước hai, áp lần một. Khai báo tính khác biệt 5 trừ 3 bằng 2, nên tạo 2 máy. Mệnh lệnh cộng 3 với 2. Cả hai đều thành 5, chưa thấy khác nhau."
      - clear: true
        show: |
          <p><b>Bước 3 — áp lần 2</b> (ví dụ do lỗi mạng giữa chừng, người trực chạy lại):</p>
          <table class="t"><tr><th>cách</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>khai báo</td><td>khác biệt $5 - 5 = 0$ → không làm gì</td><td>$\hl{5}$</td></tr>
          <tr><td>mệnh lệnh</td><td>$5 + 2$</td><td>$\hl{7}$</td></tr></table>
        focus: [1, "2.2", "2.3"]
        say: "Bước ba, áp lần hai, như khi người trực chạy lại vì lỗi mạng. Khai báo tính khác biệt 5 trừ 5 bằng 0, nên không làm gì, vẫn là 5. Mệnh lệnh lại cộng thêm 2, thành 7."
      - clear: true
        show: |
          <table class="t"><tr><th>lần</th><th>khai báo “web = 5”</th><th>mệnh lệnh “thêm 2”</th></tr>
          <tr><td>ban đầu</td><td>3</td><td>3</td></tr>
          <tr><td>áp lần 1</td><td>5</td><td>5</td></tr>
          <tr><td>áp lần 2</td><td>$\hl{5}$</td><td>$\hl{7}$</td></tr></table>
          <div class="box key">Vì lũy đẳng, khai báo có thể chạy lại an toàn khi lỗi giữa chừng, chạy định kỳ để kéo thực tế về đúng — như vòng điều khiển ở CLD.</div>
        focus: [1, "1.4", 2]
        say: "Bước bốn, đặt cả ba dòng cạnh nhau. Áp lần hai, khai báo vẫn là 5, còn mệnh lệnh thành 7. Vì lũy đẳng, khai báo có thể chạy lại an toàn khi lỗi giữa chừng, và chạy định kỳ để kéo thực tế về đúng, như vòng điều khiển ở khoá Hệ thống hướng dịch vụ."

  - id: check
    kind: check
    title: "Tự kiểm: cho máy áp nhiều lần và đếm"
    checks:
      - "[__import__('functools').reduce(lambda s, _: alg.iac_apply(s, desired={'web': 5}), range(k), {'web': 3}) for k in (1, 2, 3, 4)] == [{'web': 5}] * 4"
      - "[__import__('functools').reduce(lambda s, _: alg.iac_apply(s, add={'web': 2}), range(k), {'web': 3})['web'] for k in (1, 2, 3, 4)] == [3 + 2 * k for k in (1, 2, 3, 4)] == [5, 7, 9, 11]"
    steps:
      - show: |
          <p>Đường khác: cho máy áp $k$ lần liền, rồi so với công thức đếm tay $3 + 2 \cdot k$ của mệnh lệnh.</p>
          <table class="t"><tr><th>số lần áp $k$</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
          <tr><td>khai báo “web = 5”</td><td>5</td><td>5</td><td>5</td><td>5</td></tr>
          <tr><td>mệnh lệnh “thêm 2”</td><td>5</td><td>7</td><td>9</td><td>11</td></tr>
          <tr><td>$3 + 2 \cdot k$</td><td>5</td><td>7</td><td>9</td><td>11 ✓</td></tr></table>
        introduces: [cdot]
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Kiểm bằng đường khác, ta cho máy áp liền 1, 2, 3, rồi 4 lần, và so với công thức đếm tay của mệnh lệnh, 3 cộng 2 nhân k. Khai báo áp bao nhiêu lần cũng là 5, vì lần nào nó cũng đặt về đúng con số muốn có, đúng nghĩa lũy đẳng. Mệnh lệnh ra 5, 7, 9, 11, vì mỗi lần cộng thêm 2. Công thức 3 cộng 2 nhân k cũng ra đúng 5, 7, 9, 11. Ô áp lần 2 khớp với ví dụ, 5 và 7."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "alg.iac_apply({'web': 12}, desired={'web': 5}) == {'web': 5} and 12 - 5 == 7 and 5 <= 12 <= 15"
      - "(lambda want, real: {k: (want.get(k), real.get(k)) for k in want.keys() | real.keys() if want.get(k) != real.get(k)})({'web': 5, 'db': 1}, {'web': 7, 'db': 1}) == {'web': (5, 7)}"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Sửa tay trên máy chủ <b class="red">(trôi cấu hình)</b>
          <br><span class="note">Khai báo web = 5, ai đó thêm tay thành 7 lúc cao điểm: thực tế lệch khỏi mã. Lần áp sau sẽ xoá bớt 2 máy — có khi đúng lúc đang cần. Mọi thay đổi đi qua mã.</span></div>
        say: "Lỗi thứ nhất, sửa tay trên máy chủ. Khai báo web bằng 5, ai đó thêm tay thành 7 lúc cao điểm, nên thực tế lệch khỏi mã. Lần áp sau sẽ xoá bớt 2 máy, có khi đúng lúc đang cần, nên mọi thay đổi phải đi qua mã."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Không kiểm trôi định kỳ <b class="red">(lệch âm thầm)</b>
          <br><span class="note">So khai báo {web: 5, db: 1} với thực tế {web: 7, db: 1} → khác biệt chỉ ở <code>web: 5 → 7</code>. Chạy bước “xem kế hoạch” hằng ngày và cảnh báo khi có khác biệt.</span></div>
        say: "Lỗi thứ hai, không kiểm trôi cấu hình định kỳ. So khai báo với thực tế cho thấy khác biệt chỉ ở số máy web, 5 so với 7. Hãy chạy bước xem kế hoạch hằng ngày và cảnh báo khi có khác biệt."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Viết “khai báo” mà bên trong vẫn là lệnh tuần tự <b class="red">(giả lũy đẳng)</b>
          <br><span class="note">Một bước “chạy lệnh tạo người dùng” trong tệp khai báo vẫn tạo lần hai khi áp lại. Mỗi bước phải kiểm “đã có chưa” trước khi làm.</span></div>
        say: "Lỗi thứ ba, viết khai báo mà bên trong vẫn là lệnh tuần tự. Một bước chạy lệnh tạo người dùng trong tệp khai báo vẫn tạo lần hai khi áp lại, nên mỗi bước phải kiểm đã có chưa trước khi làm."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Mã khai báo <code>web = 5</code> trong khi bộ tự co giãn cũng chỉnh số máy web <b class="red">(hai bên giằng co)</b></div>
          <table class="t"><tr><th>lúc</th><th>bộ tự co giãn đặt</th><th>lần áp mã kế tiếp đặt</th><th>hệ quả</th></tr>
          <tr><td>cao điểm</td><td>12</td><td>5</td><td class="red">mất $12 - 5 = 7$ máy đúng lúc tải cao</td></tr>
          <tr><td>sửa: mã chỉ khai báo khoảng 5 tới 15</td><td>12</td><td>giữ 12</td><td>12 nằm trong khoảng</td></tr></table>
        focus: [1, "2.2", "2.2", "2.3", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, mã khai báo web bằng 5, trong khi bộ tự co giãn, thứ tự thêm bớt máy theo tải, cũng chỉnh chính con số đó. Lúc cao điểm, bộ tự co giãn đã nâng lên 12 máy. Lần áp mã định kỳ kế tiếp thấy khác biệt và kéo về 5, mất 7 máy đúng lúc tải cao nhất. Người làm nghề chia rõ ai sở hữu con số nào, mã chỉ khai báo khoảng từ 5 tới 15 máy, còn số bản cụ thể để bộ tự co giãn quyết. Quy tắc chung là mỗi giá trị chỉ có một chủ, nếu không thì lũy đẳng biến thành giằng co."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.iac_apply({'web': 8, 'db': 2}, desired={'web': 5, 'db': 2}) == {'web': 5, 'db': 2}"
      - "alg.iac_apply(alg.iac_apply(alg.iac_apply({'web': 3}, add={'web': 2}), add={'web': 2}), add={'web': 2}) == {'web': 9}"
      - "8 - 5 == 3 and 2 - 2 == 0 and [3 + 2 * k for k in range(4)] == [3, 5, 7, 9]"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Thực tế {web: 8, db: 2}, khai báo {web: 5, db: 2}. Áp khai báo: công cụ làm gì? Kết quả?</td></tr>
          <tr><td>2</td><td>Kịch bản “thêm 2 máy” chạy 3 lần từ 3 máy: còn bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, thực tế có 8 máy web và 2 cơ sở dữ liệu, còn khai báo là 5 máy web và 2 cơ sở dữ liệu. Áp khai báo thì công cụ làm gì, và kết quả ra sao? Câu hai, kịch bản thêm 2 máy chạy 3 lần từ 3 máy, còn bao nhiêu máy? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>tài nguyên</th><th>thực tế</th><th>khai báo</th><th>khác biệt</th><th>công cụ làm</th></tr>
          <tr><td>web</td><td>8</td><td>5</td><td>$8 - 5 = 3$ thừa</td><td>xoá 3 máy web</td></tr>
          <tr><td>db</td><td>2</td><td>2</td><td>0</td><td>không đụng</td></tr></table>
          <p>① Kết quả <code>{web: 5, db: 2}</code>.</p>
        focus: [0, "1.2", "1.2", "1.3", 2]
        say: "Đáp án câu một, ta tính khác biệt cho từng tài nguyên. Với web, thực tế 8, khai báo 5, thừa 8 trừ 5 bằng 3. Vì thế công cụ xoá 3 máy web. Với cơ sở dữ liệu, thực tế và khai báo đều là 2, khác biệt bằng 0, nên không đụng tới. Kết quả là 5 máy web và 2 cơ sở dữ liệu."
      - show: |
          <table class="t"><tr><th>lần chạy</th><th>0</th><th>1</th><th>2</th><th>3</th></tr>
          <tr><td>số máy</td><td>3</td><td>$3 + 2 = 5$</td><td>$5 + 2 = 7$</td><td>$7 + 2 = \hl{9}$</td></tr></table>
        focus: [0, "1.2", 0]
        say: "Câu hai, mệnh lệnh không nhìn thực tế, mỗi lần chạy cộng thêm 2. Từ 3 thành 5, rồi 7, rồi 9 máy. Kiểm bằng công thức 3 cộng 2 nhân 3, cũng bằng 9."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">khai báo trạng thái muốn có</span><span class="a">→</span>
          <span class="n">công cụ tính khác biệt</span><span class="a">→</span>
          <span class="n">lũy đẳng: chạy lại an toàn</span><span class="a">→</span>
          <span class="n">mọi thay đổi qua mã, kiểm trôi định kỳ</span></div>
        say: "Tổng kết lại, khai báo trạng thái muốn có, để công cụ tính khác biệt. Nhờ lũy đẳng nên chạy lại an toàn. Mọi thay đổi phải qua mã, và kiểm trôi cấu hình định kỳ."
      - show: |
          <div class="box key"><b>Tư duy:</b> hạ tầng nằm trong mã thì được xem lại, có lịch sử, và dựng lại được — như mọi mã khác.</div>
        say: "Điều cần mang theo, hạ tầng nằm trong mã thì được xem lại, có lịch sử, và dựng lại được, như mọi mã khác."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>quản lý cấu hình và bí mật</b> theo môi trường.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học quản lý cấu hình và bí mật theo từng môi trường. Hẹn gặp bạn ở bài tiếp theo."
