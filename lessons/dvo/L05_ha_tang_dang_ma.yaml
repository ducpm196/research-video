- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">khai báo trạng thái muốn có</span><span class="a">→</span>

      <span class="n">công cụ tính khác biệt</span><span class="a">→</span>

      <span class="n">lũy đẳng: chạy lại an toàn</span><span class="a">→</span>

      <span class="n">mọi thay đổi qua mã, kiểm trôi định kỳ</span></div>

      '
    say: Tổng kết lại, khai báo trạng thái muốn có, để công cụ tính khác biệt. Nhờ lũy đẳng nên chạy lại an toàn. Mọi thay đổi phải qua mã, và kiểm trôi cấu hình định kỳ. Mọi thay đổi hạ tầng đều phải đi qua kiểm duyệt mã nguồn và áp dụng tự động giống hệt mã ứng dụng. Khai báo hạ tầng dạng mã bảo đảm chạy lặp lại một hay mười lần đều hội tụ về đúng một trạng thái sạch sẽ.
  - show: '<div class="box key"><b>Tư duy:</b> hạ tầng nằm trong mã thì được xem lại, có lịch sử, và dựng lại được — như mọi mã khác.</div>

      '
    say: Điều cần mang theo, hạ tầng nằm trong mã thì được xem lại, có lịch sử, và dựng lại được, như mọi mã khác. Kiểm soát trạng thái cấu hình và bí mật ứng dụng theo từng môi trường là mắt xích kết tiếp không thể tách rời. Đưa mọi thay đổi hạ tầng qua quy trình kiểm duyệt mã nguồn giúp kiểm toán lịch sử dễ như đọc mã phần mềm.
  - clear: true
    show: '<p class="note">Bài sau (bài 6): <b>quản lý cấu hình và bí mật</b> theo môi trường.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 6, ta học quản lý cấu hình và bí mật theo từng môi trường. Hẹn gặp bạn ở bài tiếp theo.
