          <div class="chain"><span class="n">cấu hình đưa vào lúc chạy</span><span class="a">→</span>
          <span class="n">bí mật trong kho bí mật, mỗi môi trường riêng</span><span class="a">→</span>
          <span class="n">đã vào lịch sử = đã lộ → đổi ngay</span><span class="a">→</span>
          <span class="n">xoay vòng định kỳ</span></div>
        say: "Tổng kết lại, cấu hình đưa vào lúc chạy, bí mật để trong kho bí mật và mỗi môi trường một bộ riêng. Bí mật đã vào lịch sử là đã lộ, phải đổi ngay, và xoay vòng định kỳ."
      - show: |
          <div class="box key"><b>Tư duy:</b> giả định mọi bí mật rồi sẽ lộ, và thiết kế để khi lộ thì thiệt hại nhỏ, thời gian ngắn.</div>
        say: "Điều cần mang theo, hãy giả định mọi bí mật rồi sẽ lộ, và thiết kế để khi lộ thì thiệt hại nhỏ, thời gian ngắn."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>phát hành tiệm tiến</b> — phát hành thử, cờ tính năng, quay lui tự động.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học phát hành tiệm tiến, với phát hành thử, cờ tính năng, và quay lui tự động. Hẹn gặp bạn ở bài tiếp theo."
