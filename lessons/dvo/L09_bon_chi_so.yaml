id: L09
course: DVO
series: "DVO · DevOps: tích hợp, triển khai liên tục và vận hành"
title: "Bài 9 — Đo hiệu quả giao hàng: bốn chỉ số DORA"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dvo.yaml L09; audit/dvo/verify_dvo.py L09; N. Forsgren, J. Humble, G. Kim, Accelerate (2018), chương 2; DORA, State of DevOps Report (dora.dev); C. Goodhart (1975)"
assumes: [arith, frac]
# Quy ước: cửa sổ 30 ngày. Bốn chỉ số (alg.dora): tần suất triển khai (lần/ngày), thời gian đưa thay đổi lên (trung vị, giờ: từ lúc ghi mã tới lúc
#   chạy thật), tỉ lệ thay đổi thất bại (lần triển khai gây sự cố / tổng), thời gian khôi phục (trung bình, phút). DORA chỉ trên màn hình;
#   lời đọc “bốn chỉ số giao hàng”.
objectives:
  - "Tính bốn chỉ số"
  - "Hiểu hai chỉ số tốc độ và hai chỉ số ổn định đi cùng nhau"
  - "Tránh biến chỉ số thành mục tiêu tối ưu mù quáng"
asr_reviewed:
  - {sentence: "Vạch đỏ là lần triển khai gây sự cố, số vạch đỏ chia cho mọi vạch ra tỉ lệ thay đổi thất bại.", reason: "ASR chép “Vặt đỏ là lần triển khai ghê sự cuốn, số vặt đỏ chia cho mọi vặt ra tỷ lệ thay đổi thất bại.” (0.739): “tỉ” ASR viết chính tả “tỷ” (cùng âm); lệch âm/thanh thuần Việt: vạch/vặt, gây/ghê, cố/cuốn, vạch/vặt, vạch/vặt — NOT_VERIFIED bằng tai người"}
  - {sentence: "Mỗi vạch xanh là một lần triển khai, đếm số vạch mỗi ngày ra tần suất triển khai.", reason: "ASR chép “Mỗi vặt xanh là một lần triển khai, đếm số vặt mỗi ngày ra từng suốt triển khai.” (0.778): lệch âm/thanh thuần Việt: vạch/vặt, tần suất/từng suốt — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "“Nhóm mình nhanh hơn chưa?”"
    steps:
      - show: |
          <p>Sếp hỏi: nhóm có tiến bộ không? Người nói “làm nhiều việc hơn”, người nói “ít lỗi hơn”, người nói “cảm thấy ổn hơn”. Không ai có con số, nên không ai thuyết phục được ai.</p>
          <div class="box key">Hôm nay: <b>bốn chỉ số giao hàng</b> — hai đo <b>tốc độ</b>, hai đo <b>ổn định</b>, và đọc chúng cùng nhau.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, sếp hỏi nhóm có tiến bộ không. Người nói làm nhiều việc hơn, người nói ít lỗi hơn, người nói cảm thấy ổn hơn, mà không ai có con số, nên không ai thuyết phục được ai. Hôm nay ta học bốn chỉ số giao hàng, hai chỉ số đo tốc độ, hai chỉ số đo ổn định, và cách đọc chúng cùng nhau."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: trung bình, trung vị, phần trăm"
    checks:
      - "sum([1, 2, 9]) / 3 == 4 and sorted([9, 1, 2])[1] == 2 and __import__('statistics').median([1, 2, 9]) == 2"
      - "1 / 4 == 0.25 and 0.25 * 100 == 25"
    steps:
      - show: |
          <p>Ba lần chờ xe: 1, 2, 9 phút.</p>
          <table class="t"><tr><th>cách tóm tắt</th><th>cách tính</th><th>kết quả</th></tr>
          <tr><td><b>trung bình</b></td><td>$\frac{1 + 2 + 9}{3}$</td><td>4 phút</td></tr>
          <tr><td><b>trung vị</b></td><td>sắp tăng dần 1, <b>2</b>, 9, lấy số đứng giữa</td><td>2 phút</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 0]
        say: "Trước hết, ôn hai cách tóm tắt một dãy số, với ba lần chờ xe mất 1, 2 và 9 phút. Bảng tính cả hai cách. Trung bình là tổng chia số lần, 1 cộng 2 cộng 9 bằng 12, chia 3, được 4 phút. Trung vị thì sắp tăng dần rồi lấy số đứng giữa, ở đây là 2 phút. Một lần chờ lâu 9 phút kéo trung bình lên, còn trung vị gần với lần chờ thường gặp hơn."
      - show: |
          <p><b>Phần trăm</b>: 1 lần trễ trong 4 chuyến là $\frac{1}{4} = 0{,}25 = 25\%$.</p>
        say: "Thứ hai, phần trăm. Một lần trễ trong 4 chuyến là 1 chia 4, bằng 0 phẩy 25, tức 25 phần trăm."

  - id: sym
    kind: symbol
    title: "Giải mã: bốn chỉ số"
    steps:
      - show: |
          <table class="t"><tr><th>chỉ số</th><th>đo</th><th>loại</th></tr>
          <tr><td>tần suất triển khai</td><td>bao nhiêu lần đưa lên môi trường thật mỗi ngày</td><td>tốc độ</td></tr>
          <tr><td>thời gian đưa thay đổi lên</td><td>từ lúc ghi mã tới lúc chạy thật (trung vị)</td><td>tốc độ</td></tr>
          <tr><td>tỉ lệ thay đổi thất bại</td><td>phần lần triển khai gây sự cố</td><td>ổn định</td></tr>
          <tr><td>thời gian khôi phục</td><td>từ lúc sự cố bắt đầu tới lúc dịch vụ trở lại</td><td>ổn định</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng liệt kê bốn chỉ số. Tần suất triển khai đo bao nhiêu lần đưa lên môi trường thật mỗi ngày, thuộc nhóm tốc độ. Thời gian đưa thay đổi lên đo từ lúc ghi mã tới lúc chạy thật, lấy trung vị, cũng thuộc nhóm tốc độ. Tỉ lệ thay đổi thất bại đo phần lần triển khai gây sự cố, thuộc nhóm ổn định. Thời gian khôi phục đo từ lúc sự cố bắt đầu tới lúc dịch vụ trở lại, cũng thuộc nhóm ổn định."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Bốn chỉ số đọc trên một trục thời gian"
    steps:
      - show: |
          <div><svg width="1500" height="390" viewBox="0 0 1500 390"><line x1="100" y1="240" x2="1400" y2="240" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="205" x2="200" y2="275" stroke="#2a78d6" stroke-width="5"/><line x1="330" y1="205" x2="330" y2="275" stroke="#2a78d6" stroke-width="5"/><line x1="460" y1="205" x2="460" y2="275" stroke="#2a78d6" stroke-width="5"/><line x1="590" y1="205" x2="590" y2="275" stroke="#2a78d6" stroke-width="5"/><line x1="720" y1="205" x2="720" y2="275" stroke="#b91c1c" stroke-width="6"/><line x1="850" y1="205" x2="850" y2="275" stroke="#2a78d6" stroke-width="5"/><line x1="980" y1="205" x2="980" y2="275" stroke="#2a78d6" stroke-width="5"/><line x1="1110" y1="205" x2="1110" y2="275" stroke="#2a78d6" stroke-width="5"/><line x1="1240" y1="205" x2="1240" y2="275" stroke="#2a78d6" stroke-width="5"/><line x1="1370" y1="205" x2="1370" y2="275" stroke="#2a78d6" stroke-width="5"/><circle cx="330" cy="170" r="10" fill="#eb6834"/><line x1="330" y1="170" x2="590" y2="170" stroke="#eb6834" stroke-width="4"/><line x1="590" y1="170" x2="590" y2="205" stroke="#eb6834" stroke-width="3" stroke-dasharray="6 5"/><rect x="720" y="300" width="130" height="18" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><g font-size="22"><text x="100" y="40" fill="#2a78d6">vạch xanh: một lần triển khai, đếm mỗi ngày ra tần suất</text><text x="100" y="80" fill="#b91c1c">vạch đỏ: lần triển khai gây sự cố, chia cho mọi vạch ra tỉ lệ thất bại</text><text x="330" y="150" fill="#eb6834">ghi mã tới chạy thật: thời gian đưa lên</text><text x="880" y="316" fill="#b91c1c">sự cố tới lúc dịch vụ trở lại: thời gian khôi phục</text><text x="1385" y="225" fill="#1f2937">thời gian</text></g></svg></div>
        focus: [1, 1, 1, 1, 1]
        say: "Hình đặt bốn chỉ số lên cùng một trục thời gian. Mỗi vạch xanh là một lần triển khai, đếm số vạch mỗi ngày ra tần suất triển khai. Vạch đỏ là lần triển khai gây sự cố, số vạch đỏ chia cho mọi vạch ra tỉ lệ thay đổi thất bại. Đoạn cam đi từ lúc ghi mã tới lúc thay đổi đó chạy thật, là thời gian đưa lên. Thanh đỏ nằm dưới trục kéo từ lúc sự cố bắt đầu tới lúc dịch vụ trở lại, là thời gian khôi phục."

  - id: example
    kind: example
    title: "Một tháng của nhóm"
    checks:
      - "alg.dora(40, 3, [30, 90, 45], [2, 5, 26, 8, 3]) == (40 / 30, 0.075, 55.0, 5)"
      - "round(40 / 30, 2) == 1.33 and sorted([2, 5, 26, 8, 3])[2] == 5"
    steps:
      - show: |
          <p><b>Bước 1 — số liệu 30 ngày:</b></p>
          <table class="t"><tr><th>đại lượng</th><th>giá trị</th></tr>
          <tr><td>lần triển khai</td><td>40, trong đó 3 lần gây sự cố</td></tr>
          <tr><td>thời gian khôi phục 3 sự cố</td><td>30, 90, 45 phút</td></tr>
          <tr><td>thời gian đưa lên của 5 thay đổi mẫu</td><td>2, 5, 26, 8, 3 giờ</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Bước một, gom số liệu của 30 ngày. Nhóm triển khai 40 lần, trong đó 3 lần gây sự cố. Ba sự cố khôi phục mất 30, 90 và 45 phút. Thời gian đưa lên của 5 thay đổi mẫu là 2, 5, 26, 8, 3 giờ."
      - show: |
          <p><b>Bước 2 — tần suất triển khai:</b></p>
          $$\frac{40}{30} \approx \hl{1{,}33} \text{ lần mỗi ngày}$$
        focus: [1, 2]
        say: "Bước hai, tần suất triển khai. Lấy 40 lần chia 30 ngày, khoảng 1 phẩy 33 lần mỗi ngày."
      - show: |
          <p><b>Bước 3 — thời gian đưa lên, lấy trung vị:</b> sắp tăng dần</p>
          <table class="t"><tr><th>vị trí</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
          <tr><td>giờ</td><td>2</td><td>3</td><td>$\hl{5}$</td><td>8</td><td>26</td></tr></table>
        focus: [1, "2.2"]
        say: "Bước ba, thời gian đưa lên, lấy trung vị, nên ta sắp tăng dần 2, 3, 5, 8, 26. Số đứng giữa, ở vị trí thứ ba trong năm vị trí, là 5 giờ."
      - clear: true
        show: |
          <p><b>Bước 4 — tỉ lệ thay đổi thất bại:</b></p>
          $$\frac{3}{40} = 0{,}075 = \hl{7{,}5\%}$$
        focus: [1, 2]
        say: "Bước bốn, tỉ lệ thay đổi thất bại. Lấy 3 lần gây sự cố chia 40 lần triển khai, bằng 0 phẩy 075, tức 7 phẩy 5 phần trăm."
      - show: |
          <p><b>Bước 5 — thời gian khôi phục, lấy trung bình:</b></p>
          $$\frac{30 + 90 + 45}{3} = \frac{165}{3} = \hl{55} \text{ phút}$$
        focus: [1, 2]
        say: "Bước năm, thời gian khôi phục, lấy trung bình. Cộng 30, 90 và 45 được 165, chia 3, bằng 55 phút."
      - clear: true
        show: |
          <table class="t"><tr><th>chỉ số</th><th>tính</th><th>kết quả</th></tr>
          <tr><td>tần suất triển khai</td><td>$\frac{40}{30}$</td><td>$\hl{1{,}33}$ lần/ngày</td></tr>
          <tr><td>thời gian đưa lên (trung vị)</td><td>sắp 2, 3, <b>5</b>, 8, 26</td><td>$\hl{5}$ giờ</td></tr>
          <tr><td>tỉ lệ thay đổi thất bại</td><td>$\frac{3}{40}$</td><td>$\hl{7{,}5\%}$</td></tr>
          <tr><td>thời gian khôi phục (trung bình)</td><td>$\frac{30 + 90 + 45}{3}$</td><td>$\hl{55}$ phút</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Gom lại một bảng cho cả tháng. Tần suất triển khai khoảng 1 phẩy 33 lần mỗi ngày. Thời gian đưa lên, trung vị 5 giờ. Tỉ lệ thay đổi thất bại 7 phẩy 5 phần trăm. Thời gian khôi phục trung bình 55 phút."

  - id: check
    kind: check
    title: "Tự kiểm: nhân ngược về số liệu gốc"
    checks:
      - "round(1.33 * 30) == 40 and round(0.075 * 40, 6) == 3 and 55 * 3 == 165 == 30 + 90 + 45"
      - "len([x for x in [2, 5, 26, 8, 3] if x < 5]) == 2 == len([x for x in [2, 5, 26, 8, 3] if x > 5])"
    steps:
      - show: |
          <p>Đường khác: đi <b>ngược</b> từ kết quả về số liệu ban đầu.</p>
          <table class="t"><tr><th>kết quả</th><th>đi ngược</th><th>khớp?</th></tr>
          <tr><td>1,33 lần/ngày</td><td>$1{,}33 \cdot 30 \approx 40$ lần</td><td>✓</td></tr>
          <tr><td>7,5%</td><td>$0{,}075 \cdot 40 = 3$ sự cố</td><td>✓</td></tr>
          <tr><td>55 phút</td><td>$55 \cdot 3 = 165 = 30 + 90 + 45$</td><td>✓</td></tr>
          <tr><td>trung vị 5 giờ</td><td>2 số nhỏ hơn (2, 3), 2 số lớn hơn (8, 26)</td><td>✓</td></tr></table>
        introduces: [cdot]
        focus: [1, "2.2", "2.3", "2.4", "2.5"]
        say: "Kiểm bằng đường khác, đi ngược từ kết quả về số liệu ban đầu. 1 phẩy 33 nhân 30 ngày được khoảng 40 lần triển khai. 0 phẩy 075 nhân 40 được đúng 3 sự cố. 55 nhân 3 bằng 165, đúng bằng 30 cộng 90 cộng 45. Còn trung vị 5 giờ thì có đúng 2 số nhỏ hơn nó và 2 số lớn hơn nó, nên nó đứng giữa."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "40 + 50 == 90 and round((30 + 50 + 45) / 3, 1) == 41.7 and (30 + 90 + 45) / 3 == 55"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Biến chỉ số thành mục tiêu <b class="red">(định luật Goodhart)</b>
          <br><span class="note">Thưởng theo số lần triển khai → chia một thay đổi thành mười lần triển khai vô nghĩa. Chỉ số là để <b>thấy</b> chỗ cần cải thiện, không để thi đua.</span></div>
        say: "Lỗi thứ nhất, biến chỉ số thành mục tiêu. Thưởng theo số lần triển khai thì người ta chia một thay đổi thành mười lần triển khai vô nghĩa. Chỉ số là để thấy chỗ cần cải thiện, không phải để thi đua."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chỉ nhìn tốc độ hoặc chỉ nhìn ổn định <b class="red">(lệch)</b>
          <br><span class="note">Triển khai nhanh gấp đôi mà tỉ lệ thất bại cũng gấp đôi thì chưa tốt hơn. Nghiên cứu của nhóm DORA cho thấy nhóm tốt thường tốt <b>cả hai</b> mặt cùng lúc.</span></div>
        say: "Lỗi thứ hai, chỉ nhìn tốc độ hoặc chỉ nhìn ổn định. Triển khai nhanh gấp đôi mà tỉ lệ thất bại cũng gấp đôi thì chưa tốt hơn, và các nghiên cứu cho thấy nhóm tốt thường tốt cả hai mặt cùng lúc."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dùng trung bình cho thời gian đưa lên <b class="red">(bị kéo lệch)</b>
          <br><span class="note">Một thay đổi kẹt 26 giờ kéo trung bình 2, 3, 5, 8, 26 lên 8,8 giờ, trong khi phần lớn chỉ vài giờ. Dùng trung vị, và xem riêng các trường hợp kẹt lâu.</span></div>
        say: "Lỗi thứ ba, dùng trung bình cho thời gian đưa lên. Một thay đổi kẹt 26 giờ kéo trung bình lên 8 phẩy 8 giờ, trong khi phần lớn chỉ mất vài giờ. Hãy dùng trung vị, và xem riêng các trường hợp kẹt lâu."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Đo thời gian khôi phục từ lúc <b>có cảnh báo</b>, không phải từ lúc sự cố <b>bắt đầu</b> <b class="red">(mất phần không ai biết)</b></div>
          <table class="t"><tr><th>sự cố 90 phút của tháng này</th><th>phút</th></tr>
          <tr><td>sự cố bắt đầu → có cảnh báo</td><td>40</td></tr>
          <tr><td>có cảnh báo → dịch vụ trở lại</td><td>50</td></tr>
          <tr><td>trung bình tháng nếu đo sai: $\frac{30 + 50 + 45}{3}$</td><td>≈ 41,7 thay vì 55</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, đo thời gian khôi phục từ lúc có cảnh báo, chứ không phải từ lúc sự cố bắt đầu. Giả sử sự cố 90 phút của tháng này có 40 phút đầu người dùng đã gặp lỗi mà chưa ai biết. 50 phút còn lại là từ lúc có cảnh báo tới lúc dịch vụ trở lại, và công cụ chỉ ghi 50. Trung bình tháng khi đó là 30 cộng 50 cộng 45, chia 3, khoảng 41 phẩy 7 phút, đẹp hơn con số thật 55 phút. Người làm nghề ghi riêng hai đoạn, vì 40 phút không ai biết mới là chỗ cần sửa trước."

