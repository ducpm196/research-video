        say: "Câu hai, chu kỳ dài 1440 cộng 1, bằng 1441 giờ, độ sẵn sàng là 1440 chia 1441, cũng khoảng 99 phẩy 931 phần trăm. Hai kết quả không chỉ gần nhau mà bằng nhau đúng. Nhân cả tử và mẫu của câu một với 4, ta được 1440 trên 1441. Vậy khôi phục nhanh gấp 4 có tác dụng ngang với ít hỏng hơn 4 lần, và thường dễ đạt hơn nhiều."

