id: L12
course: DVO
series: "DVO · DevOps: tích hợp, triển khai liên tục và vận hành"
title: "Bài 12 — Bảo mật trong đường ống: quét phụ thuộc, ký sản phẩm dựng, quyền tối thiểu"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dvo.yaml L12; audit/dvo/verify_dvo.py L12; SLSA v1.0, Build Track (slsa.dev); R. L. Rivest, A. Shamir, L. Adleman, A Method for Obtaining Digital Signatures and Public-Key Cryptosystems, CACM 21(2), 1978; CISA, Defending Against Software Supply Chain Attacks (2021); NET bài 14, SWF bài 12"
assumes: [arith]
# Quy ước: chữ ký minh hoạ bằng RSA sách giáo khoa với khoá ĐỒ CHƠI p = 61, q = 53 (n = 3233, e = 17, d = 2753) trên phần dư mod n của mã băm
#   SHA-256 (alg.toy_sign, alg.toy_verify). Khoá thật dài hàng nghìn bit; ví dụ chỉ để thấy cơ chế. alg.vuln_scan so phiên bản bằng version_key.
objectives:
  - "Thêm bước quét lỗ hổng phụ thuộc"
  - "Ký và kiểm chữ ký sản phẩm dựng"
  - "Giới hạn quyền của đường ống"
asr_reviewed:
  - {sentence: "Câu hai, bước quét nên chặn lần dựng, và báo rõ hai thư viện cần nâng lên bản đã vá, a lên ít nhất 1 chấm 4 chấm 3, c lên ít nhất 1 chấm 0 chấm 0.", reason: "ASR chép “Câu 2, bước quét nên chặn lần dựng và báo rõ hai thư viện cần nâng lên bản đa vá, a lên ít nhất 1.4.3, cê lên ít nhất 1.0.0.” (0.889): chữ cái đứng riêng đọc tên kiểu Việt, ASR viết khác; lệch âm/thanh thuần Việt: đã/đa, chấm/∅, chấm/∅, chấm/∅, chấm/∅ — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ở bài 4, mã băm là dấu vân tay của nội dung, đổi một byte là đổi mã băm.", reason: "ASR chép “Ở bài 4, mã băm là giấu vân tay của nội dung. Đổi một bài là đổi mã băm.” (0.947): byte đọc thô, ASR viết “bay/bai/vai” (probe CSA p1: “bay” 8/8) — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Kẻ tấn công không cần vào máy chủ"
    steps:
      - show: |
          <p>Máy chủ được khoá kỹ. Kẻ tấn công nhắm vào chỗ khác: một thư viện nhỏ mà dự án phụ thuộc, hoặc khoá truy cập nằm trong đường ống dựng. Mã độc đi theo đường chính thức — được dựng, “kiểm thử”, và triển khai tự động.</p>
          <div class="box key">Hôm nay: <b>bảo mật trong đường ống</b> — quét phụ thuộc, ký sản phẩm dựng, và quyền tối thiểu.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, máy chủ được khoá kỹ, nên kẻ tấn công nhắm vào chỗ khác. Đó có thể là một thư viện nhỏ mà dự án phụ thuộc, hoặc khoá truy cập nằm trong đường ống dựng. Mã độc khi đó đi theo đường chính thức, được dựng, kiểm thử, và triển khai tự động. Hôm nay ta học bảo mật trong đường ống, với quét phụ thuộc, ký sản phẩm dựng, và quyền tối thiểu."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: chia lấy dư, lũy thừa rồi lấy dư, mã băm và so phiên bản"
    checks:
      - "17 // 5 == 3 and 17 % 5 == 2 and 2 ** 5 == 32 and 32 % 5 == 2"
      - "4 ** 7 == 16384 and 16384 % 33 == 16 and 16 ** 3 == 4096 and 4096 % 33 == 4 and pow(4, 7, 33) == 16 and pow(16, 3, 33) == 4 and (3 * 7) % ((3 - 1) * (11 - 1)) == 1 and 3 * 11 == 33"
      - "alg.version_key('2.10.1') > alg.version_key('2.9.0') and '2.10.1' < '2.9.0'"
    steps:
      - show: |
          <table class="t"><tr><th>phép tính</th><th>thương</th><th>số dư</th></tr>
          <tr><td>17 chia 5</td><td>3</td><td>2</td></tr>
          <tr><td>$2^5 = 32$, chia 5</td><td>6</td><td>2</td></tr></table>
        introduces: [power]
        focus: [1, "1.2", "1.3"]
        say: "Trước hết, ôn phép chia lấy dư, phép tính chính của chữ ký hôm nay. 17 chia 5 được 3, còn dư 2. Với lũy thừa, ta tính trước rồi mới chia, 2 mũ 5 bằng 32, chia 5 được 6, dư 2."
      - show: |
          <p>Khoá tí hon để làm thử: $n = 33$, khoá công khai 3, khoá bí mật 7.</p>
          <table class="t"><tr><th>việc</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>ký số 4 (khoá bí mật)</td><td>$4^7 = 16384$, chia 33 dư</td><td>16</td></tr>
          <tr><td>kiểm (khoá công khai)</td><td>$16^3 = 4096$, chia 33 dư</td><td>4 — đúng số ban đầu ✓</td></tr></table>
        focus: [1, "2.2", "2.3", 0]
        say: "Làm thử với một khoá tí hon, n bằng 33, khoá công khai là 3, khoá bí mật là 7. Để ký số 4, ta lấy 4 mũ 7 bằng 16384, chia 33 dư 16, vậy chữ ký là 16. Để kiểm, ta lấy 16 mũ 3 bằng 4096, chia 33 dư 4, đúng số ban đầu. Hai khoá đi thành cặp, cái này làm, cái kia gỡ, và đó là cơ chế của cả bài."
      - show: |
          <table class="t"><tr><th>đã học</th><th>nhắc lại</th></tr>
          <tr><td>mã băm (bài 4)</td><td>dấu vân tay của nội dung: đổi một byte là đổi mã băm</td></tr>
          <tr><td>so phiên bản (bài 2)</td><td>so <b>từng số</b>: 2.10.1 mới hơn 2.9.0 vì 10 lớn hơn 9; so như chuỗi thì ra ngược</td></tr></table>
        focus: [0, "1.2", "1.3"]
        say: "Bài này còn dùng lại hai điều đã học. Ở bài 4, mã băm là dấu vân tay của nội dung, đổi một byte là đổi mã băm. Ở bài 2, phiên bản phải so từng số, nên 2 chấm 10 chấm 1 mới hơn 2 chấm 9 chấm 0 vì 10 lớn hơn 9, còn so như chuỗi chữ thì ra kết quả ngược."

  - id: sym
    kind: symbol
    title: "Giải mã: ba lớp phòng thủ"
    steps:
      - show: |
          <table class="t"><tr><th>lớp</th><th>làm gì</th></tr>
          <tr><td><b>quét phụ thuộc</b></td><td>so tệp khoá với danh sách lỗ hổng đã công bố; có bản dính lỗi thì chặn</td></tr>
          <tr><td><b>ký sản phẩm dựng</b></td><td>đường ống ký mã băm bằng khoá <b>bí mật</b>; cụm máy kiểm bằng khoá <b>công khai</b> trước khi chạy</td></tr>
          <tr><td><b>quyền tối thiểu</b></td><td>mỗi bước của đường ống chỉ có đúng quyền nó cần, trong thời gian ngắn nhất</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bảng giới thiệu ba lớp phòng thủ. Quét phụ thuộc so tệp khoá với danh sách lỗ hổng đã công bố, có bản dính lỗi thì chặn. Ký sản phẩm dựng nghĩa là đường ống ký mã băm bằng khoá bí mật, còn cụm máy kiểm chữ ký bằng khoá công khai trước khi chạy. Quyền tối thiểu nghĩa là mỗi bước của đường ống chỉ có đúng quyền nó cần, trong thời gian ngắn nhất."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Khoá bí mật ở đâu, ai kiểm cái gì"
    steps:
      - show: |
          <div><svg width="1500" height="380" viewBox="0 0 1500 380"><defs><marker id="arD12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arD12r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect x="20" y="120" width="250" height="80" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/><text x="145" y="169" font-size="21" text-anchor="middle" fill="#1f2937">mã nguồn, tệp khoá</text><rect x="340" y="120" width="330" height="80" rx="10" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/><text x="505" y="169" font-size="21" text-anchor="middle" fill="#1f2937">đường ống: dựng, quét, ký</text><rect x="740" y="120" width="330" height="80" rx="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/><text x="905" y="169" font-size="21" text-anchor="middle" fill="#1f2937">kho ảnh: ảnh và chữ ký</text><rect x="1140" y="120" width="340" height="80" rx="10" fill="#dcfce7" stroke="#1f2937" stroke-width="3"/><text x="1310" y="169" font-size="21" text-anchor="middle" fill="#1f2937">cụm máy: kiểm chữ ký</text><g fill="none" stroke="#1f2937" stroke-width="3"><line x1="270" y1="160" x2="336" y2="160" marker-end="url(#arD12)"/><line x1="670" y1="160" x2="736" y2="160" marker-end="url(#arD12)"/><line x1="1070" y1="160" x2="1136" y2="160" marker-end="url(#arD12)"/></g><line x1="905" y1="330" x2="905" y2="206" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arD12r)"/><g font-size="22"><text x="505" y="90" text-anchor="middle" fill="#d97706">khoá bí mật chỉ nằm ở đây</text><text x="1310" y="90" text-anchor="middle" fill="#2a78d6">chỉ có khoá công khai</text><text x="935" y="320" fill="#b91c1c">kẻ tấn công sửa ảnh trong kho</text><text x="1310" y="250" text-anchor="middle" fill="#059669">khớp: chạy</text><text x="1310" y="290" text-anchor="middle" fill="#b91c1c">không khớp: từ chối</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình cho thấy sản phẩm dựng đi từ mã nguồn, qua đường ống, vào kho ảnh, rồi tới cụm máy. Khoá bí mật chỉ nằm trong đường ống, đúng chỗ ký, còn cụm máy chỉ giữ khoá công khai để kiểm. Nếu kẻ tấn công sửa ảnh nằm trong kho, mã băm đổi nên chữ ký cũ không còn khớp, và cụm máy từ chối chạy. Muốn tạo chữ ký khớp cho ảnh đã sửa, kẻ tấn công phải có khoá bí mật, vì thế đường ống là nơi phải giữ kỹ nhất."

  - id: example
    kind: example
    title: "Ký và kiểm một sản phẩm dựng (khoá đồ chơi)"
    checks:
      - "alg.toy_sign(b'anh-web-1.4.3') == (1917, 2336) and alg.toy_verify(b'anh-web-1.4.3', 2336) is True"
      - "alg.toy_verify(b'anh-web-1.4.3-sua', 2336) is False and 61 * 53 == 3233 and (17 * 2753) % (60 * 52) == 1"
      - "17 * 2753 == 46801 and 15 * 3120 + 1 == 46801 and 60 * 52 == 3120 and alg.toy_sign(b'anh-web-1.4.3-sua')[0] == 3216 and pow(2336, 17, 3233) == 1917"
    steps:
      - show: |
          <p><b>Bước 1 — khoá minh hoạ:</b> $n = 61 \cdot 53 = 3233$, công khai $e = 17$, bí mật $d = 2753$.</p>
          <p>Hai khoá đi thành cặp vì $17 \cdot 2753 = 46\,801 = 15 \cdot 3120 + 1$, với $3120 = 60 \cdot 52$.</p>
        introduces: [cdot]
        focus: [1, 1, 2]
        say: "Bước một, khoá minh hoạ. n bằng 61 nhân 53, bằng 3233, khoá công khai là 17, khoá bí mật là 2753. Hai khoá đi thành cặp vì 17 nhân 2753 bằng 46 nghìn 801, chia 3120 dư đúng 1, với 3120 là 60 nhân 52."
      - show: |
          <p><b>Bước 2 — băm:</b> SHA-256 của gói, rồi chia 3233 lấy dư:</p>
          $$\text{phần dư} = \hl{1917}$$
        focus: [1, 2]
        say: "Bước hai, băm sản phẩm, rồi chia cho 3233 lấy phần dư. Ta được 1917, đây là dấu vân tay của gói."
      - show: |
          <p><b>Bước 3 — đường ống ký</b> bằng khoá bí mật:</p>
          $$1917^{2753} \text{ chia } 3233 \text{ dư } \hl{2336} = \text{chữ ký}$$
        focus: [1, 2]
        say: "Bước ba, đường ống ký bằng khoá bí mật. Lấy 1917 mũ 2753, chia 3233 lấy dư, được chữ ký 2336."
      - show: |
          <p><b>Bước 4 — cụm máy kiểm</b> bằng khoá công khai:</p>
          $$2336^{17} \text{ chia } 3233 \text{ dư } 1917$$
          <p>Bằng đúng mã băm của gói → khớp → <b class="green">chạy</b>.</p>
        focus: [1, 2, 3]
        say: "Bước bốn, cụm máy kiểm bằng khoá công khai. Lấy 2336 mũ 17, chia 3233 lấy dư, được lại 1917. Số này bằng đúng mã băm của gói, nên khớp, và cụm máy cho chạy."
      - clear: true
        show: |
          <table class="t"><tr><th>gói</th><th>băm, chia 3233 lấy dư</th><th>chữ ký kiểm ra</th><th>kết quả</th></tr>
          <tr><td>gói gốc</td><td>1917</td><td>1917</td><td><b class="green">chạy</b></td></tr>
          <tr><td>gói bị sửa một chút</td><td>3216</td><td>1917</td><td><b class="red">từ chối</b></td></tr></table>
          <p class="note">Khoá thật dài hàng nghìn bit; con số nhỏ ở đây chỉ để thấy cơ chế. Ai không có khoá bí mật thì không tạo được chữ ký khớp.</p>
        focus: [1, "1.3", 2, 2]
        say: "Bước năm, gói bị sửa trên đường đi. Gói sửa băm ra 3216, trong khi chữ ký cũ vẫn kiểm ra 1917, không khớp, nên bị từ chối. Khoá thật dài hàng nghìn bit, con số nhỏ ở đây chỉ để thấy cơ chế. Ai không có khoá bí mật thì không tạo được chữ ký khớp."

  - id: check
    kind: check
    title: "Tự kiểm: tính 2336 mũ 17 bằng bình phương liên tiếp"
    checks:
      - "[pow(2336, 2 ** k, 3233) for k in range(5)] == [2336, 2825, 1581, 452, 625] and 2336 ** 2 % 3233 == 2825 and 2825 ** 2 % 3233 == 1581 and 1581 ** 2 % 3233 == 452 and 452 ** 2 % 3233 == 625"
      - "16 + 1 == 17 and 625 * 2336 % 3233 == 1917 and pow(2336, 17, 3233) == 1917"
    steps:
      - show: |
          <p>Đường khác: không dùng máy tính một phát, mà bình phương từng bước, mỗi bước chia 3233 lấy dư (vì $17 = 16 + 1$).</p>
          <table class="t"><tr><th>lũy thừa</th><th>cách tính</th><th>dư khi chia 3233</th></tr>
          <tr><td>$2336^2$</td><td>bình phương 2336</td><td>2825</td></tr>
          <tr><td>$2336^4$</td><td>bình phương 2825</td><td>1581</td></tr>
          <tr><td>$2336^8$</td><td>bình phương 1581</td><td>452</td></tr>
          <tr><td>$2336^{16}$</td><td>bình phương 452</td><td>625</td></tr>
          <tr><td>$2336^{17}$</td><td>625 nhân 2336</td><td>$\hl{1917}$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4", "2.5", "2.6", 0]
        say: "Kiểm bằng đường khác, ta không tính một phát, mà bình phương từng bước, mỗi bước chia 3233 lấy dư, vì 17 bằng 16 cộng 1. 2336 bình phương, chia 3233 dư 2825. Bình phương tiếp được 1581. Bình phương lần ba được 452. Bình phương lần bốn được 625, đó là 2336 mũ 16. Nhân thêm 2336 một lần nữa, chia lấy dư, được 1917, khớp với mã băm ở bước hai. Lấy dư sau mỗi bước giữ các số luôn nhỏ, nên làm tay cũng được."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "365 * 24 * 60 == 525600 and 525600 / 15 == 35040"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đường ống giữ khoá quản trị toàn hệ thống <b class="red">(mục tiêu số một)</b>
          <br><span class="note">Ai chiếm được đường ống là chiếm được mọi thứ. Đường ống chỉ được <b>đẩy ảnh vào kho ảnh</b>; cụm máy tự kéo và chỉ chạy ảnh có chữ ký hợp lệ.</span></div>
        say: "Lỗi thứ nhất, để đường ống giữ khoá quản trị toàn hệ thống. Ai chiếm được đường ống là chiếm được mọi thứ. Đường ống chỉ nên được quyền đẩy ảnh vào kho ảnh, còn cụm máy tự kéo về và chỉ chạy ảnh có chữ ký hợp lệ."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Quét lỗ hổng một lần rồi thôi <b class="red">(lỗ hổng mới mỗi ngày)</b>
          <br><span class="note">Thư viện hôm qua sạch, hôm nay có thông báo lỗ hổng. Quét ở mỗi lần dựng <b>và</b> quét định kỳ những gì đang chạy.</span></div>
        say: "Lỗi thứ hai, quét lỗ hổng một lần rồi thôi. Thư viện hôm qua sạch, hôm nay đã có thông báo lỗ hổng, nên hãy quét ở mỗi lần dựng, và quét định kỳ cả những gì đang chạy."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chạy mã của người lạ trong đường ống có quyền cao <b class="red">(đề nghị hợp nhất độc)</b>
          <br><span class="note">Đề nghị hợp nhất từ người ngoài chạy kiểm thử với khoá bí mật của dự án → khoá bị đánh cắp. Mã chưa được duyệt chỉ chạy trong môi trường không có bí mật.</span></div>
        say: "Lỗi thứ ba, chạy mã của người lạ trong một đường ống có quyền cao. Đề nghị hợp nhất từ người ngoài mà chạy kiểm thử với khoá bí mật của dự án thì khoá bị đánh cắp. Mã chưa được duyệt chỉ được chạy trong môi trường không có bí mật."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Quyền đã hẹp, nhưng khoá truy cập của đường ống <b>sống cả năm</b> <b class="red">(lộ một lần, dùng được rất lâu)</b></div>
          <table class="t"><tr><th>khoá truy cập</th><th>còn dùng được sau khi lộ</th></tr>
          <tr><td>cấp một lần, sống 1 năm</td><td>tới $365 \cdot 24 \cdot 60 = 525\,600$ phút</td></tr>
          <tr><td>cấp riêng cho mỗi lần chạy, sống 15 phút (số minh hoạ)</td><td>tối đa 15 phút</td></tr></table>
        focus: [1, "2.2", "2.3", 0, 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, quyền của đường ống đã hẹp, nhưng khoá truy cập của nó được cấp một lần và sống cả năm. Nếu khoá lộ ra, chẳng hạn bị in nhầm vào nhật ký dựng, kẻ tấn công dùng được tới 365 nhân 24 nhân 60, bằng 525 nghìn 600 phút. Nếu mỗi lần chạy được cấp một khoá riêng chỉ sống 15 phút, đây là số minh hoạ, thì khoá lộ ra chỉ dùng được tối đa 15 phút, ngắn hơn 35 nghìn 40 lần. Quyền tối thiểu có hai chiều, làm được ít việc, và trong thời gian ngắn nhất. Người làm nghề còn kiểm định kỳ xem có khoá nào sống lâu hơn mức cho phép không."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.vuln_scan({'thu-vien-a': '1.4.2', 'thu-vien-b': '2.10.1', 'thu-vien-c': '0.9.0'}, {'thu-vien-a': '1.4.3', 'thu-vien-b': '2.9.0', 'thu-vien-c': '1.0.0'}) == ['thu-vien-a', 'thu-vien-c']"
      - "alg.version_key('1.4.2')[:2] == alg.version_key('1.4.3')[:2] and 2 < 3 and alg.version_key('2.10.1')[0] == alg.version_key('2.9.0')[0] and 10 > 9 and alg.version_key('0.9.0')[0] < alg.version_key('1.0.0')[0]"
    steps:
      - show: |
          <table class="t"><tr><th>thư viện</th><th>trong tệp khoá</th><th>thông báo: đã vá ở</th></tr>
          <tr><td>a</td><td>1.4.2</td><td>1.4.3</td></tr><tr><td>b</td><td>2.10.1</td><td>2.9.0</td></tr><tr><td>c</td><td>0.9.0</td><td>1.0.0</td></tr></table>
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Thư viện nào đang dính lỗ hổng?</td></tr><tr><td>2</td><td>Bước quét nên làm gì với lần dựng này?</td></tr></table>
        focus: [0, 1, 1, "2.2", "2.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Tệp khoá có thư viện a bản 1 chấm 4 chấm 2, b bản 2 chấm 10 chấm 1, c bản 0 chấm 9 chấm 0. Thông báo lỗ hổng nói a đã vá ở 1 chấm 4 chấm 3, b ở 2 chấm 9 chấm 0, c ở 1 chấm 0 chấm 0. Câu một, thư viện nào đang dính lỗ hổng? Câu hai, bước quét nên làm gì với lần dựng này? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>thư viện</th><th>so từng số với bản đã vá</th><th>dính lỗ hổng?</th></tr>
          <tr><td>a</td><td>1.4.2 và 1.4.3: số chính, số phụ bằng nhau; số vá 2 nhỏ hơn 3</td><td><b class="red">có</b></td></tr>
          <tr><td>b</td><td>2.10.1 và 2.9.0: số chính bằng nhau; số phụ 10 lớn hơn 9</td><td><b class="green">không</b></td></tr>
          <tr><td>c</td><td>0.9.0 và 1.0.0: số chính 0 nhỏ hơn 1</td><td><b class="red">có</b></td></tr></table>
        focus: [0, "1.2", "1.3", "1.4", 0]
        say: "Đáp án câu một, so từng số với bản đã vá. Thư viện a, số chính và số phụ bằng nhau, số vá 2 nhỏ hơn 3, nên đang dính lỗ hổng. Thư viện b, số chính bằng nhau, số phụ 10 lớn hơn 9, nên đã mới hơn bản vá và an toàn. Thư viện c, số chính 0 nhỏ hơn 1, nên đang dính lỗ hổng. Vậy thư viện a và c đang dính lỗ hổng, còn b an toàn."
      - show: |
          <p>② <b>Chặn</b> lần dựng, báo rõ hai thư viện cần nâng lên bản đã vá: a lên ít nhất 1.4.3, c lên ít nhất 1.0.0.</p>
          <p class="note">Lưu ý: nâng c từ 0.9.0 lên 1.0.0 là đổi số chính, có thể phá vỡ chương trình — cần chạy lại kiểm thử.</p>
        focus: [1, 2]
        say: "Câu hai, bước quét nên chặn lần dựng, và báo rõ hai thư viện cần nâng lên bản đã vá, a lên ít nhất 1 chấm 4 chấm 3, c lên ít nhất 1 chấm 0 chấm 0. Riêng c là đổi số chính, có thể phá vỡ chương trình, nên sau khi nâng phải chạy lại kiểm thử."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">quét phụ thuộc mỗi lần dựng và định kỳ</span><span class="a">→</span>
          <span class="n">ký bằng khoá bí mật, kiểm bằng khoá công khai</span><span class="a">→</span>
          <span class="n">đường ống quyền tối thiểu</span><span class="a">→</span>
          <span class="n">mã lạ không chạm bí mật</span></div>
        say: "Tổng kết bài này, quét phụ thuộc ở mỗi lần dựng và định kỳ, ký bằng khoá bí mật và kiểm bằng khoá công khai. Hãy cho đường ống quyền tối thiểu, và không để mã lạ chạm tới bí mật."
      - show: |
          <div class="box key"><b>Tư duy:</b> đường ống tự động là con đường ngắn nhất từ một dòng mã tới máy chủ thật — cho cả bạn lẫn kẻ tấn công. Bảo vệ nó như bảo vệ chính hệ thống.</div>
        say: "Điều cần mang theo, đường ống tự động là con đường ngắn nhất từ một dòng mã tới máy chủ thật, cho cả bạn lẫn kẻ tấn công. Hãy bảo vệ nó như bảo vệ chính hệ thống."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 13): <b>tình huống chuyên gia theo dòng thời gian</b> — mười năm báo cáo Hiện trạng DevOps, từ ba chỉ số đầu tiên năm 2014 tới năm chỉ số năm 2024.</p>
        forward_ref: true
        say: "Ở bài sau, bài 13, ta đi lại mười năm của một cuộc khảo sát lớn về cách các đội giao phần mềm, từ ba chỉ số đầu tiên năm 2014 tới năm chỉ số năm 2024. Ta sẽ tự tính lại từng con số nổi tiếng, và xem dùng chúng thế nào cho đúng. Hẹn gặp bạn ở bài tiếp theo."
