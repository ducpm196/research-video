- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">nhiều kiểm thử nhanh, ít kiểm thử chậm</span><span class="a">→</span>

      <span class="n">chập chờn nhân lên theo số lượng</span><span class="a">→</span>

      <span class="n">cách ly và sửa, không chạy lại cho qua</span><span class="a">→</span>

      <span class="n">màu đỏ phải có nghĩa</span></div>

      '
    say: Tổng kết lại, hãy có nhiều kiểm thử nhanh và ít kiểm thử chậm. Chập chờn nhân lên theo số lượng, nên cách ly và sửa, đừng chạy lại cho qua, để màu đỏ luôn có nghĩa. Đường ống kiểm thử nhanh, ổn định và cô lập giữ tốc độ gộp mã cao mà chất lượng vẫn đảm bảo vững vàng. Đường ống cô lập sạch sẽ chạy nhanh dưới mười phút là tuyến phòng thủ tin cậy nhất trước mỗi lần hợp nhất mã.
  - show: '<div class="box key"><b>Tư duy:</b> một tín hiệu chỉ có giá trị khi người ta tin nó. Đường ống đỏ vô cớ còn tệ hơn không có đường ống.</div>

      '
    say: Điều cần mang theo, một tín hiệu chỉ có giá trị khi người ta tin nó. Đường ống đỏ vô cớ còn tệ hơn không có đường ống. Mỗi sản phẩm sinh ra từ đường ống phải bất biến và tái lập hoàn hảo ở bất kỳ môi trường nào.
