id: L03
course: DVO
series: 'DVO · DevOps: tích hợp, triển khai liên tục và vận hành'
title: 'Bài 3 — Đường ống dựng và kiểm thử: nhanh, tin cậy, bị cô lập'
voice: vi-VN-NamMinhNeural
rate: -5%
depth: full
source: curriculum/dvo.yaml L03; audit/dvo/verify_dvo.py L03; J. Micco, Flaky Tests at Google and How We Mitigate Them (Google Testing Blog, 2016); M. Cohn, Succeeding with Agile (2009), mục “tháp kiểm thử”; SWF bài 4, bài 6 (kiểm thử)
assumes:
- arith
- power
- approx
objectives:
- Sắp các tầng kiểm thử theo tốc độ
- Phát hiện và cách ly kiểm thử chập chờn
- Giữ đường ống nhanh và tin được
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: Đỏ thì cứ bấm chạy lại
  checks:
  - round(alg.flaky_red(300, 0.005), 3) == 0.778
  steps:
  - show: '<p>Đường ống của nhóm đỏ gần 4 trên 5 lần dù chẳng ai làm hỏng gì. Mọi người quen tay bấm “chạy lại” cho tới khi xanh. Một hôm có lỗi thật — và nó cũng được bấm chạy lại cho tới khi “xanh”.</p>

      <div class="box key">Hôm nay: <b>đường ống dựng và kiểm thử</b> — nhanh, tin được, và mỗi lần chạy không phụ thuộc lần khác.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, đường ống của nhóm đỏ gần 4 trên 5 lần dù chẳng ai làm hỏng gì. Mọi người quen tay bấm chạy lại cho tới khi xanh. Một hôm có lỗi thật, và nó cũng được bấm chạy lại cho tới khi xanh. Hôm nay ta học đường ống dựng và kiểm thử, sao cho nhanh, tin được, và mỗi lần chạy không phụ thuộc lần khác. Đường ống dựng chạy mất nửa tiếng và cứ hai lần chạy lại trượt ngẫu nhiên một lần làm cả đội mất sạch niềm tin. Thiết kế tháp kiểm thử cân đối kết hợp bộ nhớ đệm chuẩn và cô lập hoàn toàn biến kiểm tự động thành người gác cổng sắc bén.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: phần trăm, “tất cả cùng xanh”, và “ít nhất một đỏ”'
  checks:
  - 0.5 / 100 == 0.005 and round(1 - 0.005, 3) == 0.995 and 78 / 100 == 0.78
  - round(0.995 ** 2, 6) == 0.990025 and round(1 - 0.990025, 6) == 0.009975 and round(0.009975, 2) == 0.01 and round(0.995 ** 10, 3) == 0.951 and round(1 - 0.951, 3) == 0.049
  steps:
  - show: '<table class="t"><tr><th>phần trăm</th><th>số thập phân</th><th>nghĩa</th></tr>

      <tr><td>0,5%</td><td>$\frac{0{,}5}{100} = 0{,}005$</td><td>một kiểm thử đỏ oan</td></tr>

      <tr><td>99,5%</td><td>$1 - 0{,}005 = 0{,}995$</td><td>kiểm thử đó xanh</td></tr></table>

      '
    introduces:
    - frac
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    say: Trước hết, ôn cách đổi phần trăm ra số thập phân. 0 phẩy 5 phần trăm nghĩa là 0 phẩy 5 chia 100, bằng 0 phẩy 005, đó là khả năng một kiểm thử đỏ oan dù mã đúng. Khả năng nó xanh là phần còn lại, 1 trừ 0 phẩy 005, bằng 0 phẩy 995, tức 99 phẩy 5 phần trăm. Hàng trăm kiểm thử đơn vị chạy trong bộ nhớ nhanh hàng trăm lần kiểm thử giao diện mở trình duyệt thật chậm chạp.
  - show: '<p>Ở bài 1, khi tính xung đột giữa các nhánh, ta đã dùng mẹo: các lần <b>độc lập</b> thì <b>nhân</b> xác suất, và “ít nhất một” = 1 − “không lần nào”.</p>

      <table class="t"><tr><th>số kiểm thử</th><th>tất cả cùng xanh</th><th>ít nhất một đỏ</th></tr>

      <tr><td>2</td><td>$0{,}995 \cdot 0{,}995 = 0{,}990025$</td><td>$\approx 0{,}01$</td></tr>

      <tr><td>10</td><td>$0{,}995^{10} \approx 0{,}951$</td><td>$1 - 0{,}951 = 0{,}049$</td></tr></table>

      '
    introduces:
    - cdot
    focus:
    - 1
    - '2.2'
    - '2.3'
    - 0
    - 0
    say: Ở bài 1, khi tính xác suất xung đột giữa các nhánh, ta đã dùng mẹo, các lần độc lập thì nhân xác suất, và ít nhất một bằng 1 trừ không lần nào. Hai kiểm thử cùng xanh là 0 phẩy 995 nhân 0 phẩy 995, bằng 0 phẩy 990025, nên ít nhất một cái đỏ khoảng 0 phẩy 01. Mười kiểm thử cùng xanh là 0 phẩy 995 mũ 10, khoảng 0 phẩy 951, nên ít nhất một cái đỏ là 0 phẩy 049. Càng nhiều kiểm thử, khả năng có một cái đỏ oan càng lớn. Chia song song nhiều luồng và tận dụng bộ đệm gói cài đặt cắt giảm thời gian phản hồi xuống vài phút.
- id: sym
  kind: symbol
  title: 'Giải mã: đường ống, tầng kiểm thử, chập chờn'
  steps:
  - show: '<table class="t"><tr><th>tầng</th><th>kiểm gì</th><th>thời gian mỗi cái</th><th>số lượng</th></tr>

      <tr><td>đơn vị</td><td>một hàm, một lớp</td><td>mi li giây</td><td>nhiều nhất</td></tr>

      <tr><td>tích hợp</td><td>vài thành phần cùng nhau (ví dụ cùng cơ sở dữ liệu thật)</td><td>giây</td><td>vừa</td></tr>

      <tr><td>đầu cuối</td><td>cả hệ thống qua giao diện người dùng</td><td>chục giây trở lên</td><td>ít nhất</td></tr></table>

      <p><b>Chập chờn</b>: kiểm thử có lúc đỏ, lúc xanh trên <b>cùng một mã</b> — do phụ thuộc thời gian, thứ tự, mạng, dữ liệu dùng chung.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - 2
    - 2
    say: Bảng xếp các tầng kiểm thử theo tốc độ. Kiểm thử đơn vị kiểm một hàm hay một lớp, mất vài mi li giây, và nên có nhiều nhất. Kiểm thử tích hợp kiểm vài thành phần cùng nhau, ví dụ cùng cơ sở dữ liệu thật, mất vài giây, số lượng vừa phải. Kiểm thử đầu cuối kiểm cả hệ thống qua giao diện người dùng, mất chục giây trở lên, và nên ít nhất. Kiểm thử chập chờn là kiểm thử có lúc đỏ, lúc xanh trên cùng một mã, do phụ thuộc thời gian, thứ tự, mạng, hay dữ liệu dùng chung. Kiểm thử đáng tin tuyệt đối phải cho kết quả y hệt nhau mỗi lần chạy trên cùng một cam kết bất chấp chạy ở đâu.
