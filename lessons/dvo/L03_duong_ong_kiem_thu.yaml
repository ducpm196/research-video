- id: example
  kind: example
  title: Chập chờn nhân lên theo số kiểm thử
  checks:
  - round(alg.flaky_red(300, 0.005), 3) == 0.778 and round(1 - 0.995 ** 300, 3) == 0.778
  - round(1 - 0.005, 3) == 0.995 and round(0.995 ** 300, 3) == 0.222 and round(1 - 0.222, 3) == 0.778 and round(0.778 * 100, 1) == 77.8 and 0.005 * 100 == 0.5
  steps:
  - show: '<p><b>Bước 1 — một kiểm thử:</b> đỏ oan 0,5% lần, nên xanh với xác suất</p>

      $$1 - 0{,}005 = 0{,}995$$

      '
    focus:
    - 1
    - 2
    say: Bước một, xét một kiểm thử. Nó đỏ oan 0 phẩy 5 phần trăm số lần, nên xanh với xác suất 1 trừ 0 phẩy 005, bằng 0 phẩy 995.
  - show: '<p><b>Bước 2 — cả 300 cùng xanh</b> (độc lập → nhân 300 lần):</p>

      $$0{,}995^{300} \approx 0{,}222$$

      '
    focus:
    - 1
    - 2
    say: Bước hai, đường ống chỉ xanh khi cả 300 kiểm thử cùng xanh. Các kiểm thử độc lập nên ta nhân 300 lần, được 0 phẩy 995 mũ 300, khoảng 0 phẩy 222.
  - show: '<p><b>Bước 3 — đường ống đỏ</b> = 1 − cả 300 cùng xanh:</p>

      $$P(\text{đỏ}) = 1 - 0{,}222 = \hl{0{,}778}$$

      '
    introduces:
    - prob
    focus:
    - 1
    - 2
    say: Bước ba, đường ống đỏ khi không phải cả 300 cùng xanh. Viết P của đỏ, đọc là xác suất đường ống đỏ, bằng 1 trừ 0 phẩy 222, bằng 0 phẩy 778.
  - clear: true
    show: '<table class="t"><tr><th>Bước 4 — đặt cạnh nhau</th><th>đỏ oan</th></tr>

      <tr><td>một kiểm thử</td><td>0,5% số lần</td></tr>

      <tr><td>đường ống 300 kiểm thử</td><td>$\hl{77{,}8\%}$ số lần</td></tr></table>

      <div class="box key">Mỗi kiểm thử “gần như ổn” (99,5%), nhưng đường ống thì đỏ gần 78% lần. Khi đỏ là chuyện thường, không ai còn tin màu đỏ nữa.</div>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    say: Bước bốn, đặt hai con số cạnh nhau. Một kiểm thử chỉ đỏ oan 0 phẩy 5 phần trăm số lần. Cả đường ống 300 kiểm thử thì đỏ oan 77 phẩy 8 phần trăm số lần. Mỗi kiểm thử gần như ổn, đạt 99 phẩy 5 phần trăm, nhưng đường ống thì đỏ gần 78 phần trăm số lần. Khi đỏ là chuyện thường, không ai còn tin màu đỏ nữa.
  - show: <p><b>Bước 5 — tính xác suất đường ống CI đỏ giả vì kiểm thử chập chờn bằng Python</b>:</p><div class="code"><div>tests, p_flaky = 300, 0.005</div><div>always_green = (1.0 - p_flaky) ** tests</div><div>fail_pct = (1.0 - always_green) * 100</div><div>print(f&#x27;fail={fail_pct:.1f}% green={always_green*100:.1f}%&#x27;)</div></div>
    say: Bước năm, bốn dòng Python cho thấy tác hại của hàng trăm bài kiểm thử dù tỉ lệ chập chờn rất nhỏ. Với 300 bài kiểm thử và mỗi bài chỉ chập chờn 0 phẩy 5 phần trăm, xác suất mọi bài cùng xanh chỉ là 0 phẩy 995 luỹ thừa 300, còn 22 phẩy 2 phần trăm. Nghĩa là 77 phẩy 8 phần trăm số lần chạy sẽ báo đỏ giả.
    clear: true
    focus: null
- id: isolation
  kind: concept
  title: 'Nhanh và cô lập: thời gian đường ống, kiểm thử không dính nhau'
  checks:
  - '[250 * 0.005, 40 * 2, 10 * 30] == [1.25, 80, 300] and 1.25 + 80 + 300 == 381.25 and round(381.25 / 60, 1) == 6.4 and round(300 / 381.25 * 100) == 79'
  - round(10 * 0.005 + 40 * 2 + 250 * 30, 2) == 7580.05 and round(7580.05 / 3600, 1) == 2.1
  - '(lambda f: f(''AB'') == {''A'': True, ''B'': False} and f(''BA'') == {''B'': True, ''A'': False} and f(''B'') == {''B'': True} and f(''AB'', True) == {''A'': True, ''B'': True})(lambda order, own=False: (lambda st: {t: (st.__setitem__(''n'', (0 if own else st[''n'']) + 1) or st[''n''] == 1) for t in order})({''n'': 0}))'
  steps:
  - show: '<table class="t"><tr><th>tầng (số minh hoạ)</th><th>số kiểm thử</th><th>mỗi cái</th><th>tổng</th></tr>

      <tr><td>đơn vị</td><td>250</td><td>5 mi li giây</td><td>$250 \cdot 0{,}005 = 1{,}25$ giây</td></tr>

      <tr><td>tích hợp</td><td>40</td><td>2 giây</td><td>$40 \cdot 2 = 80$ giây</td></tr>

      <tr><td>đầu cuối</td><td>10</td><td>30 giây</td><td>$10 \cdot 30 = 300$ giây</td></tr>

      <tr><td><b>cộng</b> (chạy lần lượt)</td><td>300</td><td></td><td>$381{,}25$ giây $\approx 6{,}4$ phút</td></tr></table>

      <p>Đảo ngược tỉ lệ: 10 đơn vị, 40 tích hợp, 250 đầu cuối thì $0{,}05 + 80 + 7500 \approx 7580$ giây, hơn <b>2 giờ</b> mỗi lần gộp mã.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    say: Bây giờ tính vì sao đường ống phải nhanh, với số minh hoạ. Có 250 kiểm thử đơn vị, mỗi cái 5 mi li giây, tổng 1 phẩy 25 giây. Có 40 kiểm thử tích hợp, mỗi cái 2 giây, tổng 80 giây. Có 10 kiểm thử đầu cuối, mỗi cái 30 giây, tổng 300 giây. Chạy lần lượt hết 381 phẩy 25 giây, khoảng 6 phẩy 4 phút, và 10 kiểm thử đầu cuối chiếm gần 79 phần trăm thời gian. Nếu đảo ngược tỉ lệ thì mỗi lần gộp mã mất hơn 2 giờ, nên người ta sẽ ngại gộp mã.
  - clear: true
    show: '<p><b>Cô lập</b>: mỗi kiểm thử tự dựng dữ liệu của riêng mình và dọn sau khi chạy, nên kết quả không phụ thuộc kiểm thử nào chạy trước. Hai kiểm thử A, B đều tạo một đơn hàng rồi đếm số đơn, mong được <b>1</b>:</p>

      <table class="t"><tr><th>cách chạy</th><th>kiểm thử A</th><th>kiểm thử B</th></tr>

      <tr><td>dùng chung một cơ sở dữ liệu, A rồi B</td><td class="green">xanh (đếm 1)</td><td class="red">đỏ (đếm 2)</td></tr>

      <tr><td>dùng chung, B rồi A</td><td class="red">đỏ (đếm 2)</td><td class="green">xanh (đếm 1)</td></tr>

      <tr><td>dùng chung, chạy B một mình</td><td>—</td><td class="green">xanh (đếm 1)</td></tr>

      <tr><td>mỗi kiểm thử dữ liệu riêng, dọn sau khi chạy</td><td class="green">xanh, mọi thứ tự</td><td class="green">xanh, mọi thứ tự</td></tr></table>

      '
    focus:
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    say: Còn chữ cô lập trong tên bài nghĩa là mỗi kiểm thử không dính vào kiểm thử khác. Giả sử hai kiểm thử A và B cùng tạo một đơn hàng rồi đếm số đơn, mong được 1. Nếu cùng dùng một cơ sở dữ liệu mà không dọn, chạy A rồi B thì A thấy 1 nên xanh, còn B thấy 2 nên đỏ. Chạy B rồi A thì ngược lại, A đỏ. Chạy B một mình thì xanh, nên lỗi chập chờn tuỳ thứ tự chạy. Cách chữa là mỗi kiểm thử dựng dữ liệu riêng và dọn sau khi chạy, nên mọi thứ tự đều cho cùng kết quả.
- id: check
  kind: check
  title: 'Tự kiểm: tách lũy thừa, và cho máy chạy thử'
  checks:
  - round(0.995 ** 100, 4) == 0.6058 and round(0.6058 ** 3, 4) == 0.2223 and round(1 - 0.2223, 4) == 0.7777 and round(0.7777, 3) == 0.778 and 100 * 3 == 300
  - abs((__import__('numpy').random.default_rng(3).random((20000, 300)) < 0.005).any(axis=1).mean() - 0.778) < 0.005
  steps:
