  - id: example
    kind: example
    title: "Chập chờn nhân lên theo số kiểm thử"
    checks:
      - "round(alg.flaky_red(300, 0.005), 3) == 0.778 and round(1 - 0.995 ** 300, 3) == 0.778"
      - "round(1 - 0.005, 3) == 0.995 and round(0.995 ** 300, 3) == 0.222 and round(1 - 0.222, 3) == 0.778 and round(0.778 * 100, 1) == 77.8 and 0.005 * 100 == 0.5"
    steps:
      - show: |
          <p><b>Bước 1 — một kiểm thử:</b> đỏ oan 0,5% lần, nên xanh với xác suất</p>
          $$1 - 0{,}005 = 0{,}995$$
        focus: [1, 2]
        say: "Bước một, xét một kiểm thử. Nó đỏ oan 0 phẩy 5 phần trăm số lần, nên xanh với xác suất 1 trừ 0 phẩy 005, bằng 0 phẩy 995."
      - show: |
          <p><b>Bước 2 — cả 300 cùng xanh</b> (độc lập → nhân 300 lần):</p>
          $$0{,}995^{300} \approx 0{,}222$$
        focus: [1, 2]
        say: "Bước hai, đường ống chỉ xanh khi cả 300 kiểm thử cùng xanh. Các kiểm thử độc lập nên ta nhân 300 lần, được 0 phẩy 995 mũ 300, khoảng 0 phẩy 222."
      - show: |
          <p><b>Bước 3 — đường ống đỏ</b> = 1 − cả 300 cùng xanh:</p>
          $$P(\text{đỏ}) = 1 - 0{,}222 = \hl{0{,}778}$$
        introduces: [prob]
        focus: [1, 2]
        say: "Bước ba, đường ống đỏ khi không phải cả 300 cùng xanh. Viết P của đỏ, đọc là xác suất đường ống đỏ, bằng 1 trừ 0 phẩy 222, bằng 0 phẩy 778."
      - clear: true
        show: |
          <table class="t"><tr><th>Bước 4 — đặt cạnh nhau</th><th>đỏ oan</th></tr>
          <tr><td>một kiểm thử</td><td>0,5% số lần</td></tr>
          <tr><td>đường ống 300 kiểm thử</td><td>$\hl{77{,}8\%}$ số lần</td></tr></table>
          <div class="box key">Mỗi kiểm thử “gần như ổn” (99,5%), nhưng đường ống thì đỏ gần 78% lần. Khi đỏ là chuyện thường, không ai còn tin màu đỏ nữa.</div>
        focus: [1, "1.2", "1.3", 2, 2]
        say: "Bước bốn, đặt hai con số cạnh nhau. Một kiểm thử chỉ đỏ oan 0 phẩy 5 phần trăm số lần. Cả đường ống 300 kiểm thử thì đỏ oan 77 phẩy 8 phần trăm số lần. Mỗi kiểm thử gần như ổn, đạt 99 phẩy 5 phần trăm, nhưng đường ống thì đỏ gần 78 phần trăm số lần. Khi đỏ là chuyện thường, không ai còn tin màu đỏ nữa."

  - id: check
    kind: check
    title: "Tự kiểm: tách lũy thừa, và cho máy chạy thử"
    checks:
      - "round(0.995 ** 100, 4) == 0.6058 and round(0.6058 ** 3, 4) == 0.2223 and round(1 - 0.2223, 4) == 0.7777 and round(0.7777, 3) == 0.778 and 100 * 3 == 300"
      - "abs((__import__('numpy').random.default_rng(3).random((20000, 300)) < 0.005).any(axis=1).mean() - 0.778) < 0.005"
    steps:
      - show: |
          <p>Đường khác: $300 = 100 \cdot 3$, nên $0{,}995^{300} = \left(0{,}995^{100}\right)^3$.</p>
          <table class="t"><tr><th>bước</th><th>kết quả</th></tr>
          <tr><td>$0{,}995^{100}$</td><td>$\approx 0{,}6058$</td></tr>
          <tr><td>$0{,}6058^{3}$</td><td>$\approx 0{,}2223$</td></tr>
          <tr><td>$1 - 0{,}2223$</td><td>$= 0{,}7777 \approx 0{,}778$ ✓</td></tr></table>
        focus: [1, "2.2", "2.3", "2.4"]
        say: "Kiểm bằng đường khác, tách lũy thừa, vì 300 bằng 100 nhân 3, nên 0 phẩy 995 mũ 300 bằng 0 phẩy 995 mũ 100, rồi lấy mũ 3. 0 phẩy 995 mũ 100 khoảng 0 phẩy 6058. Lấy mũ 3 được khoảng 0 phẩy 2223. 1 trừ 0 phẩy 2223 bằng 0 phẩy 7777, làm tròn là 0 phẩy 778, khớp với cách tính thẳng."
      - show: |
          <table class="t"><tr><th>cho máy chạy thử</th><th>kết quả</th></tr>
          <tr><td>20 000 lần chạy đường ống giả, mỗi lần 300 kiểm thử đỏ oan 0,5%</td><td>tỉ lệ lần đỏ $\approx 0{,}78$ ✓</td></tr></table>
        say: "Đường thứ hai không dùng công thức, mà cho máy giả lập 20 nghìn lần chạy đường ống, mỗi lần 300 kiểm thử, mỗi cái đỏ oan 0 phẩy 5 phần trăm. Tỉ lệ lần chạy bị đỏ đếm được khoảng 0 phẩy 78, nghĩa là khớp với công thức."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "round(1 - 0.3, 1) == 0.7 and round(0.3 ** 3, 3) == 0.027 and round(1 - 0.3 ** 3, 3) == 0.973"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chạy lại cho tới khi xanh <b class="red">(che lỗi thật)</b>
          <br><span class="note">Lỗi thật mà chỉ lộ ra một phần số lần (lỗi tranh chấp, lỗi thời gian) bị coi là “chập chờn” và lọt qua. Ghi lại mọi lần đỏ, gom thống kê theo từng kiểm thử.</span></div>
        say: "Lỗi thứ nhất, chạy lại cho tới khi xanh. Lỗi thật mà chỉ lộ ra một phần số lần, như lỗi tranh chấp hay lỗi thời gian, bị coi là chập chờn và lọt qua. Hãy ghi lại mọi lần đỏ, và gom thống kê theo từng kiểm thử."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Để kiểm thử chập chờn nằm trong đường ống chính <b class="red">(làm hỏng niềm tin)</b>
          <br><span class="note">Cách ly ngay vào nhóm “cách ly”, chạy riêng, có người chịu trách nhiệm sửa trong hạn định. Đường ống chính chỉ giữ kiểm thử đáng tin.</span></div>
        say: "Lỗi thứ hai, để kiểm thử chập chờn nằm trong đường ống chính. Hãy cách ly nó ngay vào một nhóm chạy riêng, có người chịu trách nhiệm sửa trong một hạn định, để đường ống chính chỉ giữ kiểm thử đáng tin."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Dồn phần lớn kiểm thử vào tầng đầu cuối <b class="red">(chậm và giòn)</b>
          <br><span class="note">Kiểm thử đầu cuối chậm, nhiều thành phần nên dễ chập chờn. Kiểm logic ở tầng đơn vị; chỉ vài kịch bản quan trọng nhất đi hết đầu cuối.</span></div>
        say: "Lỗi thứ ba, dồn phần lớn kiểm thử vào tầng đầu cuối. Kiểm thử đầu cuối chậm và có nhiều thành phần nên dễ chập chờn. Hãy kiểm logic ở tầng đơn vị, chỉ vài kịch bản quan trọng nhất mới đi hết đầu cuối."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Cài đường ống <b>tự chạy lại tối đa 3 lần</b>, một lần xanh là cho qua <b class="red">(lỗi thật lọt gần hết)</b></div>
          <table class="t"><tr><th>lỗi tranh chấp thật, làm kiểm thử đỏ 30% số lần</th><th>xác suất lỗi lọt qua</th></tr>
          <tr><td>chạy 1 lần</td><td>$1 - 0{,}3 = 0{,}7$</td></tr>
          <tr><td>tự chạy lại tối đa 3 lần</td><td>$1 - 0{,}3^3 = 1 - 0{,}027 = 0{,}973$</td></tr></table>
        focus: [1, 2, "2.2", "2.3", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, cài đường ống tự chạy lại tối đa 3 lần, chỉ cần một lần xanh là cho qua. Giả sử có một lỗi tranh chấp thật, làm kiểm thử đỏ 30 phần trăm số lần. Chạy một lần, lỗi lọt qua với xác suất 1 trừ 0 phẩy 3, bằng 0 phẩy 7. Tự chạy lại tới 3 lần, lỗi chỉ bị chặn khi cả 3 lần cùng đỏ, 0 phẩy 3 mũ 3 bằng 0 phẩy 027, nên lọt qua tới 0 phẩy 973. Người làm nghề vẫn có thể cho chạy lại, nhưng ghi lại mọi lần chạy lại, và kiểm thử nào cần chạy lại mới xanh thì đưa vào nhóm cách ly để sửa."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.flaky_red(100, 0.005), 3) == 0.394 and round(alg.flaky_red(300, 0.001), 3) == 0.259"
      - "round(0.995 ** 100, 3) == 0.606 and round(1 - 0.606, 3) == 0.394 and round(1 - 0.001, 3) == 0.999 and round(0.999 ** 300, 3) == 0.741 and round(1 - 0.741, 3) == 0.259 and round(1 / 0.259) == 4"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Cách ly bớt, chỉ còn 100 kiểm thử chập chờn 0,5%: xác suất đường ống đỏ?</td></tr>
          <tr><td>2</td><td>Giữ 300 kiểm thử nhưng sửa để mỗi cái chỉ chập chờn 0,1%: xác suất đỏ?</td></tr></table>
        focus: [0, "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, cách ly bớt, chỉ còn 100 kiểm thử chập chờn 0 phẩy 5 phần trăm, xác suất đường ống đỏ là bao nhiêu? Câu hai, giữ 300 kiểm thử nhưng sửa để mỗi cái chỉ chập chờn 0 phẩy 1 phần trăm, xác suất đỏ là bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <p>① Cả 100 cùng xanh: $0{,}995^{100} \approx 0{,}606$.</p>
          <p>Đường ống đỏ: $1 - 0{,}606 = \hl{0{,}394}$.</p>
        focus: [0, 1, 2]
        say: "Đáp án câu một, hai bước. Cả 100 kiểm thử cùng xanh với xác suất 0 phẩy 995 mũ 100, khoảng 0 phẩy 606. Vậy đường ống đỏ với xác suất 1 trừ 0 phẩy 606, bằng 0 phẩy 394."
      - show: |
          <p>② Một kiểm thử xanh: $1 - 0{,}001 = 0{,}999$; cả 300 cùng xanh: $0{,}999^{300} \approx 0{,}741$.</p>
          <p>Đường ống đỏ: $1 - 0{,}741 = \hl{0{,}259}$ — vẫn đỏ oan khoảng 1 lần trong 4: chập chờn phải tiến gần 0, không chỉ “ít”.</p>
        focus: [1, 1, 2, 2]
        say: "Câu hai, mỗi kiểm thử xanh với xác suất 1 trừ 0 phẩy 001, bằng 0 phẩy 999. Cả 300 cùng xanh là 0 phẩy 999 mũ 300, khoảng 0 phẩy 741. Vậy đường ống đỏ với xác suất 1 trừ 0 phẩy 741, bằng 0 phẩy 259, vẫn đỏ oan khoảng 1 lần trong 4. Kết luận, chập chờn phải tiến gần 0, chứ không chỉ là ít."

