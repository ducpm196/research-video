id: L02
course: DVO
series: "DVO · DevOps: tích hợp, triển khai liên tục và vận hành"
title: "Bài 2 — Phiên bản ngữ nghĩa và quản lý phụ thuộc"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/dvo.yaml L02; audit/dvo/verify_dvo.py L02; T. Preston-Werner, Semantic Versioning 2.0.0, mục 11 (thứ tự ưu tiên: so từng số) (semver.org); R. Cox, Surviving Software Dependencies, CACM 62(9), 2019; PEP 440 (so phiên bản Python)"
assumes: [arith, ltgt]
# Quy ước: phiên bản dạng chính.phụ.vá; so thứ tự bằng alg.version_key (bộ ba số nguyên). Khoảng cho phép viết “≥ 1.4.0 và < 2.0.0” trong <code>.
#   Lời đọc số phiên bản: “1 chấm 10 chấm 0” (dấu chấm thô dễ bị đọc như số thập phân hoặc ngày).
objectives:
  - "Đọc số phiên bản chính, phụ, vá"
  - "So phiên bản đúng cách"
  - "Ghim phụ thuộc bằng tệp khoá"
asr_reviewed:
  - {sentence: "1 chấm 10 chấm 0 thành 11000.", reason: "ASR chép “1.10.0 x 11.000” (0.75): lệch âm/thanh thuần Việt: chấm/∅, chấm/∅, thành/x — NOT_VERIFIED bằng tai người"}
  - {sentence: "1 chấm 2 chấm 0 thành 10200.", reason: "ASR chép “1.2.0x10.200” (0.778): lệch âm/thanh thuần Việt: chấm/∅, chấm/∅, thành/x — NOT_VERIFIED bằng tai người"}
  - {sentence: "Ma đứng trước mo vì ký tự đầu bằng nhau, ký tự thứ hai a đứng trước o.", reason: "ASR chép “mà đứng trước Mo vì ký tự đầu bằng nhau, ký tự thứ 2A đứng trước Co.” (0.889): “ma/mo” là hai chuỗi ví dụ, ASR viết hoa/đổi thanh; chữ cái đứng riêng a, o đọc tên kiểu Việt, ASR viết khác — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lỗi thứ nhất, tin rằng bản vá không bao giờ phá chương trình.", reason: "ASR chép “Lỗi thứ nhất, tình trạng bản vã không bao giờ phá chương trình.” (0.769): lệch âm/thanh thuần Việt: tin rằng/tình trạng, vá/vã — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Bản 1.10 bị coi là cũ hơn bản 1.9"
    checks:
      - "'1.10.0' < '1.9.3' and alg.version_key('1.10.0') > alg.version_key('1.9.3')"
    steps:
      - show: |
          <p>Kịch bản cập nhật tự động chọn “bản mới nhất” bằng cách so chuỗi. Nó thấy <code>"1.10.0" &lt; "1.9.3"</code>, nên giữ bản 1.9.3 cũ — kèm một lỗ hổng bảo mật đã được vá ở 1.10.0.</p>
          <div class="box key">Hôm nay: <b>phiên bản ngữ nghĩa</b> — đọc, so, và ghim phiên bản các thư viện ta phụ thuộc.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, một kịch bản cập nhật tự động chọn bản mới nhất bằng cách so chuỗi. Nó thấy chuỗi 1 chấm 10 chấm 0 nhỏ hơn chuỗi 1 chấm 9 chấm 3, nên giữ bản cũ, kèm một lỗ hổng bảo mật đã được vá ở bản mới. Hôm nay ta học phiên bản ngữ nghĩa, cách đọc, cách so, và cách ghim phiên bản các thư viện ta phụ thuộc."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: so như từ điển, và so như ngày tháng"
    checks:
      - "'an' < 'ba' and 'ma' < 'mo' and '10' < '9' and 10 > 9"
      - "(2024, 3, 15) < (2024, 11, 2) and '2024-11-02' < '2024-3-15'"
    steps:
      - show: |
          <p><b>So như từ điển</b> (so chuỗi): so ký tự đầu; bằng nhau mới so ký tự kế tiếp.</p>
          <table class="t"><tr><th>hai chuỗi</th><th>ký tự quyết định</th><th>chuỗi đứng trước</th></tr>
          <tr><td>an, ba</td><td>a và b (ký tự đầu)</td><td>an</td></tr>
          <tr><td>ma, mo</td><td>a và o (ký tự thứ hai)</td><td>ma</td></tr>
          <tr><td>10, 9</td><td>1 và 9 (ký tự đầu)</td><td><b class="red">10</b></td></tr></table>
        focus: [0, 1, "2.2", "2.3", "2.4"]
        say: "Trước hết, ôn hai cách so. Cách thứ nhất là so như từ điển, còn gọi là so chuỗi, so ký tự đầu, bằng nhau mới so ký tự kế tiếp. An đứng trước ba vì a đứng trước b. Ma đứng trước mo vì ký tự đầu bằng nhau, ký tự thứ hai a đứng trước o. Nhưng chuỗi 10 lại đứng trước chuỗi 9, vì ký tự đầu 1 đứng trước 9, dù số 10 lớn hơn số 9."
      - show: |
          <p><b>So như ngày tháng</b> (so bộ số): so năm trước, bằng nhau mới so tháng, rồi ngày; mỗi phần là một <b>số</b>.</p>
          <table class="t"><tr><th>ngày</th><th>năm</th><th>tháng</th><th>ngày</th></tr>
          <tr><td>15/3/2024</td><td>2024</td><td>3</td><td>15</td></tr>
          <tr><td>2/11/2024</td><td>2024</td><td>11</td><td>2</td></tr></table>
          <p>Năm bằng nhau; tháng $3 \lt 11$ → 15/3 sớm hơn, dù ngày 15 lớn hơn 2.</p>
        focus: [1, 2, 3, 3]
        say: "Cách thứ hai là so như ngày tháng, so năm trước, bằng nhau mới so tháng, rồi so ngày, và mỗi phần là một số. Lấy hai ngày, 15 tháng 3 và 2 tháng 11 năm 2024. Năm bằng nhau, nên so tháng, 3 nhỏ hơn 11. Vậy 15 tháng 3 sớm hơn, dù ngày 15 lớn hơn ngày 2, vì phần đứng trước đã quyết định rồi."

  - id: sym
    kind: symbol
    title: "Giải mã: chính.phụ.vá, tệp khoá"
    steps:
      - show: |
          <table class="t"><tr><th>phần</th><th>tăng khi</th></tr>
          <tr><td><b>chính</b></td><td>thay đổi phá vỡ tương thích</td></tr>
          <tr><td><b>phụ</b></td><td>thêm tính năng, vẫn tương thích</td></tr>
          <tr><td><b>vá</b></td><td>sửa lỗi, không đổi giao diện</td></tr></table>
          <p><b>So thứ tự</b>: so số chính trước, bằng nhau mới so số phụ, rồi số vá — mỗi phần là một <b>số nguyên</b>.</p>
          <p><b>Tệp khoá</b>: ghi chính xác phiên bản (và mã băm) của <b>mọi</b> thư viện đã cài, kể cả thư viện của thư viện, để lần cài sau giống hệt.</p>
        focus: [1, "1.2", "1.3", "1.4", 2, 3]
        say: "Bảng giới thiệu ba phần của số phiên bản. Số chính tăng khi có thay đổi phá vỡ tương thích. Số phụ tăng khi thêm tính năng mà vẫn tương thích. Số vá tăng khi sửa lỗi mà không đổi giao diện. Khi so thứ tự, ta so số chính trước, bằng nhau mới so số phụ, rồi số vá, và mỗi phần là một số nguyên. Tệp khoá ghi chính xác phiên bản và mã băm của mọi thư viện đã cài, kể cả thư viện của thư viện, để lần cài sau giống hệt."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cắt theo ký tự hay cắt theo số"
    checks:
      - "'1.10.0'[2] == '1' and '1.9.3'[2] == '9' and '1.10.0' < '1.9.3' and alg.version_key('1.10.0') == (1, 10, 0) and alg.version_key('1.9.3') == (1, 9, 3)"
    steps:
      - show: |
          <div><svg width="1500" height="400" viewBox="0 0 1500 400"><text x="40" y="105" font-size="26" font-weight="bold" fill="#b91c1c">so chuỗi</text><rect x="260" y="40" width="50" height="56" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="285" y="79" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="318" y="40" width="50" height="56" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="343" y="79" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">.</text><rect x="376" y="40" width="50" height="56" rx="6" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="401" y="79" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="434" y="40" width="50" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="459" y="79" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="492" y="40" width="50" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="517" y="79" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">.</text><rect x="550" y="40" width="50" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="575" y="79" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="260" y="110" width="50" height="56" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="285" y="149" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="318" y="110" width="50" height="56" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="343" y="149" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">.</text><rect x="376" y="110" width="50" height="56" rx="6" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="401" y="149" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">9</text><rect x="434" y="110" width="50" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="459" y="149" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">.</text><rect x="492" y="110" width="50" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="517" y="149" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><text x="680" y="85" font-size="24" fill="#b91c1c">ký tự thứ ba: 1 đứng trước 9</text><text x="680" y="140" font-size="24" fill="#b91c1c">nên 1.10.0 bị xếp trước: sai</text><line x1="40" y1="200" x2="1460" y2="200" stroke="#d1d5db" stroke-width="2"/><text x="40" y="295" font-size="26" font-weight="bold" fill="#059669">so từng số</text><rect x="260" y="230" width="100" height="56" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="310" y="269" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="390" y="230" width="100" height="56" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="440" y="269" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">10</text><rect x="520" y="230" width="100" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="570" y="269" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">0</text><rect x="260" y="300" width="100" height="56" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/><text x="310" y="339" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text><rect x="390" y="300" width="100" height="56" rx="6" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/><text x="440" y="339" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">9</text><rect x="520" y="300" width="100" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="570" y="339" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text><text x="680" y="275" font-size="24" fill="#059669">số chính bằng nhau, số phụ: 10 lớn hơn 9</text><text x="680" y="330" font-size="24" fill="#059669">nên 1.10.0 mới hơn: đúng</text><g font-size="20" fill="#1f2937"><text x="310" y="384" text-anchor="middle">chính</text><text x="440" y="384" text-anchor="middle">phụ</text><text x="570" y="384" text-anchor="middle">vá</text></g></svg></div>
        focus: [1, 1, 1, 1]
        say: "Hình đặt hai cách so cạnh nhau. Ở trên, so chuỗi cắt phiên bản thành từng ký tự, hai ký tự đầu bằng nhau, đến ký tự thứ ba thì 1 đứng trước 9, nên 1 chấm 10 chấm 0 bị xếp trước, sai. Ở dưới, so từng số cắt theo dấu chấm thành ba ô số chính, phụ, vá, số chính bằng nhau, số phụ 10 lớn hơn 9. Vậy 1 chấm 10 chấm 0 mới hơn, đúng như ý người viết thư viện."

  - id: example
    kind: example
    title: "So từng số, không so chuỗi"
    checks:
      - "sorted(['1.9.3', '1.10.0', '1.2.0'], key=alg.version_key) == ['1.2.0', '1.9.3', '1.10.0'] and sorted(['1.9.3', '1.10.0', '1.2.0']) == ['1.10.0', '1.2.0', '1.9.3']"
    steps:
      - show: |
          <p><b>Bước 1 — cắt theo dấu chấm</b> thành bộ ba số:</p>
          <table class="t"><tr><th>phiên bản</th><th>chính</th><th>phụ</th><th>vá</th></tr>
          <tr><td>1.9.3</td><td>1</td><td>9</td><td>3</td></tr>
          <tr><td>1.10.0</td><td>1</td><td>10</td><td>0</td></tr>
          <tr><td>1.2.0</td><td>1</td><td>2</td><td>0</td></tr></table>
        focus: [1, 2]
        say: "Bước một, cắt mỗi phiên bản theo dấu chấm thành bộ ba số. 1 chấm 9 chấm 3 cho 1, 9, 3, còn 1 chấm 10 chấm 0 cho 1, 10, 0, và 1 chấm 2 chấm 0 cho 1, 2, 0."
      - show: |
          <p><b>Bước 2 — so số chính:</b> cả ba đều là 1 → chưa phân thắng thua, chuyển sang số phụ.</p>
          $$1 = 1 = 1$$
        focus: [1, 2]
        say: "Bước hai, so số chính trước. Cả ba đều là 1, chưa phân thắng thua, nên chuyển sang số phụ."
      - show: |
          <p><b>Bước 3 — so số phụ:</b></p>
          $$2 \lt 9 \lt 10$$
          <p>→ thứ tự tăng dần: 1.2.0, 1.9.3, 1.10.0. Số phụ đã khác nhau nên không cần xét số vá.</p>
        focus: [1, 2, 3]
        say: "Bước ba, so số phụ, 2 nhỏ hơn 9, 9 nhỏ hơn 10. Vậy thứ tự tăng dần là 1 chấm 2 chấm 0, rồi 1 chấm 9 chấm 3, rồi 1 chấm 10 chấm 0. Số phụ đã khác nhau nên không cần xét đến số vá."
      - clear: true
        show: |
          <table class="t"><tr><th>cách so</th><th>sắp tăng dần 1.9.3, 1.10.0, 1.2.0</th></tr>
          <tr><td>so chuỗi (từng ký tự)</td><td>1.10.0, 1.2.0, 1.9.3 <b class="red">(sai)</b></td></tr>
          <tr><td>so từng số nguyên</td><td>1.2.0, 1.9.3, $\hl{1.10.0}$</td></tr></table>
          <p>So chuỗi: ký tự “1” của “10” nhỏ hơn ký tự “9”, nên “1.10.0” bị xếp trước. So số: $10 \gt 9$.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Bước bốn, đối chiếu với cách so chuỗi. So chuỗi từng ký tự cho thứ tự sai, bản 1 chấm 10 bị xếp đầu tiên. So từng số nguyên cho thứ tự đúng, bản 1 chấm 10 chấm 0 là mới nhất. Lý do là khi so chuỗi, ký tự 1 của số 10 nhỏ hơn ký tự 9, còn khi so số thì 10 lớn hơn 9."

  - id: check
    kind: check
    title: "Tự kiểm: gộp ba số thành một số"
    checks:
      - "[1 * 10000 + 9 * 100 + 3, 1 * 10000 + 10 * 100 + 0, 1 * 10000 + 2 * 100 + 0] == [10903, 11000, 10200] and 10200 < 10903 < 11000"
      - "all((a * 10000 + b * 100 + c < x * 10000 + y * 100 + z) == ((a, b, c) < (x, y, z)) for a, b, c, x, y, z in __import__('itertools').product(range(0, 100, 33), repeat=6))"
    steps:
      - show: |
          <p>Đường khác: khi mỗi phần nhỏ hơn 100, gộp thành <b>một số</b> = chính $\cdot$ 10000 + phụ $\cdot$ 100 + vá, rồi so số thường.</p>
          <table class="t"><tr><th>phiên bản</th><th>số gộp</th></tr>
          <tr><td>1.2.0</td><td>$10000 + 200 + 0 = 10200$</td></tr>
          <tr><td>1.9.3</td><td>$10000 + 900 + 3 = 10903$</td></tr>
          <tr><td>1.10.0</td><td>$10000 + 1000 + 0 = 11000$</td></tr></table>
          <p>$10200 \lt 10903 \lt 11000$ → cùng thứ tự 1.2.0, 1.9.3, 1.10.0 ✓</p>
        introduces: [cdot]
        focus: [1, 1, "2.2", "2.3", "2.4", 3]
        say: "Kiểm bằng đường khác, gộp ba số thành một số rồi so như số thường. Khi mỗi phần nhỏ hơn 100, lấy số chính nhân 10000, cộng số phụ nhân 100, cộng số vá. 1 chấm 2 chấm 0 thành 10200. 1 chấm 9 chấm 3 thành 10903. 1 chấm 10 chấm 0 thành 11000. Ba số này tăng dần đúng theo thứ tự đã tìm, nên kết quả so từng số là đúng."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc, 1 lỗi người đã đi làm"
    checks:
      - "[max(alg.bisect_builds(n, b) for b in range(n)) for n in (1, 5, 40, 300)] == [0, 3, 6, 9]"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin rằng bản vá không bao giờ phá chương trình <b class="red">(lời hứa, không phải bảo đảm)</b>
          <br><span class="note">Phiên bản ngữ nghĩa là lời hứa của người viết thư viện; họ có thể sai, hoặc chương trình của bạn dựa vào một lỗi vừa được “sửa”. Ghim, và chạy kiểm thử mỗi lần nâng cấp.</span></div>
        say: "Lỗi thứ nhất, tin rằng bản vá không bao giờ phá chương trình. Phiên bản ngữ nghĩa chỉ là lời hứa của người viết thư viện, họ có thể sai, hoặc chương trình của bạn dựa vào đúng một lỗi vừa được sửa. Hãy ghim phiên bản, và chạy kiểm thử mỗi lần nâng cấp."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chỉ ghim thư viện trực tiếp <b class="red">(phụ thuộc bắc cầu trôi)</b>
          <br><span class="note">Bạn ghim A, nhưng A dùng B “bản mới nhất”: hai lần cài ra hai bản B khác nhau. Tệp khoá ghim cả cây phụ thuộc.</span></div>
        say: "Lỗi thứ hai, chỉ ghim thư viện trực tiếp. Bạn ghim thư viện A, nhưng A dùng thư viện B bản mới nhất, nên hai lần cài ra hai bản B khác nhau. Cách sửa là dùng tệp khoá, ghim cả cây phụ thuộc đến từng phiên bản."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Ghim rồi không bao giờ nâng cấp <b class="red">(nợ bảo mật)</b>
          <br><span class="note">Ghim để tái lập, không phải để đóng băng. Nâng cấp đều đặn từng bước nhỏ, có kiểm thử; nhảy một lần qua ba bản chính thì rất đau.</span></div>
        say: "Lỗi thứ ba, ghim rồi không bao giờ nâng cấp. Ghim là để tái lập, không phải để đóng băng. Hãy nâng cấp đều đặn từng bước nhỏ có kiểm thử, vì nhảy một lần qua ba bản chính thì rất đau."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 4 (người đã đi làm).</b> Để nâng cấp dồn lại rồi nâng <b>40 thư viện trong một lần</b> <b class="red">(hỏng mà không biết do bản nào)</b></div>
          <table class="t"><tr><th>cách nâng cấp</th><th>thư viện mỗi lần</th><th>dựng-kiểm tối đa để tìm thủ phạm</th></tr>
          <tr><td>mỗi thư viện một lần</td><td>1</td><td>0, biết ngay</td></tr>
          <tr><td>gom theo tuần</td><td>5</td><td>3</td></tr>
          <tr><td>dồn cả năm</td><td>40</td><td>6</td></tr></table>
        focus: [1, 1, "2.2", "2.3", "2.4", 0]
        say: "Lỗi thứ tư hay gặp ở người đã đi làm, để các bản nâng cấp dồn lại, rồi nâng 40 thư viện trong một lần. Khi chương trình hỏng, không ai biết bản nào gây ra. Nâng mỗi thư viện một lần thì hỏng là biết ngay thủ phạm. Gom 5 thư viện một lần, chia đôi 5 thành 3, 2, rồi 1, cần tối đa 3 lần dựng kiểm. Dồn 40 thư viện, chia đôi 40 thành 20, 10, 5, 3, 2, 1, cần tối đa 6 lần, giống như lô thay đổi lớn ở bài 0, nơi lô 300 thay đổi cần 9 lần dựng kiểm. Người làm nghề để công cụ mở một yêu cầu nâng cấp riêng cho từng thư viện, mỗi cái có kiểm thử chạy riêng."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.version_key('2.0.10') > alg.version_key('2.0.9') and '2.0.10' < '2.0.9'"
      - "[v for v in ['1.3.9', '1.4.0', '1.12.1', '2.0.0'] if alg.version_key('1.4.0') <= alg.version_key(v) < alg.version_key('2.0.0')] == ['1.4.0', '1.12.1']"
      - "max(['1.4.0', '1.12.1'], key=alg.version_key) == '1.12.1' and '2.0.10'[4] == '1' and '2.0.9'[4] == '9' and alg.version_key('2.0.10') == (2, 0, 10)"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>2.0.10 và 2.0.9: bản nào mới hơn? So chuỗi cho kết quả gì?</td></tr>
          <tr><td>2</td><td>Khoảng cho phép <code>≥ 1.4.0 và &lt; 2.0.0</code>. Trong 1.3.9, 1.4.0, 1.12.1, 2.0.0, bản nào nằm trong khoảng? Nếu trình cài lấy bản mới nhất trong khoảng, nó lấy bản nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, giữa 2 chấm 0 chấm 10 và 2 chấm 0 chấm 9, bản nào mới hơn? So chuỗi cho kết quả gì? Câu hai, khoảng cho phép từ 1 chấm 4 chấm 0 trở lên và nhỏ hơn 2 chấm 0 chấm 0. Trong bốn bản trên màn hình, bản nào nằm trong khoảng? Nếu trình cài lấy bản mới nhất trong khoảng, nó lấy bản nào? Dừng video và làm ra giấy."
        pause: 15
      - clear: true
        show: |
          <table class="t"><tr><th>①</th><th>chính</th><th>phụ</th><th>vá</th></tr>
          <tr><td>2.0.10</td><td>2</td><td>0</td><td>$\hl{10}$</td></tr>
          <tr><td>2.0.9</td><td>2</td><td>0</td><td>9</td></tr></table>
          <p>Chính bằng, phụ bằng, vá $10 \gt 9$ → <b>2.0.10</b> mới hơn. So chuỗi: ký tự thứ năm “1” đứng trước “9” → nói ngược.</p>
        focus: [1, 2, 2]
        say: "Đáp án câu một, cắt thành bộ số, 2, 0, 10 và 2, 0, 9. Số chính bằng nhau, số phụ bằng nhau, số vá 10 lớn hơn 9, nên bản 2 chấm 0 chấm 10 mới hơn. So chuỗi thì đến ký tự thứ năm, 1 đứng trước 9, nên nó nói ngược."
      - show: |
          <table class="t"><tr><th>②</th><th>$\geq$ 1.4.0?</th><th>&lt; 2.0.0?</th><th>trong khoảng?</th></tr>
          <tr><td>1.3.9</td><td>không: phụ $3 \lt 4$</td><td>có</td><td>không</td></tr>
          <tr><td>1.4.0</td><td>có: bằng nhau</td><td>có</td><td>có</td></tr>
          <tr><td>1.12.1</td><td>có: phụ $12 \gt 4$</td><td>có: chính $1 \lt 2$</td><td>có</td></tr>
          <tr><td>2.0.0</td><td>có</td><td>không: bằng 2.0.0</td><td>không</td></tr></table>
          <p>Trong khoảng: 1.4.0 và 1.12.1; bản mới nhất trong khoảng là $\hl{1.12.1}$.</p>
        introduces: [geq]
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Câu hai, xét từng bản với hai điều kiện. Bản 1 chấm 3 chấm 9 có số phụ 3 nhỏ hơn 4, nên quá cũ. Bản 1 chấm 4 chấm 0 bằng đúng cận dưới, nên được nhận. Bản 1 chấm 12 chấm 1 có số phụ 12 lớn hơn 4, và số chính 1 nhỏ hơn 2, nên nằm trong khoảng. Bản 2 chấm 0 chấm 0 bằng cận trên, mà cận trên không được lấy, vì bản chính mới có thể phá vỡ tương thích. Vậy hai bản nằm trong khoảng là 1 chấm 4 chấm 0 và 1 chấm 12 chấm 1, và trình cài lấy bản mới nhất sẽ chọn 1 chấm 12 chấm 1."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">chính.phụ.vá: lời hứa tương thích</span><span class="a">→</span>
          <span class="n">so từng số nguyên</span><span class="a">→</span>
          <span class="n">tệp khoá ghim cả cây</span><span class="a">→</span>
          <span class="n">nâng cấp nhỏ, đều, có kiểm thử</span></div>
        say: "Tổng kết lại, số chính, phụ, vá là lời hứa về tương thích. So phiên bản bằng từng số nguyên, dùng tệp khoá ghim cả cây phụ thuộc, và nâng cấp nhỏ, đều, có kiểm thử."
      - show: |
          <div class="box key"><b>Tư duy:</b> mỗi thư viện bạn thêm là mã người khác viết mà bạn chịu trách nhiệm. Biết chính xác mình đang chạy bản nào.</div>
        say: "Điều cần mang theo, mỗi thư viện bạn thêm là mã người khác viết mà bạn phải chịu trách nhiệm. Hãy biết chính xác mình đang chạy bản nào."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 3): <b>đường ống dựng và kiểm thử</b> — nhanh, tin cậy, bị cô lập.</p>
        forward_ref: true
        say: "Ở bài sau, bài 3, ta học đường ống dựng và kiểm thử, sao cho nhanh, tin cậy, và cô lập. Hẹn gặp bạn ở bài tiếp theo."
