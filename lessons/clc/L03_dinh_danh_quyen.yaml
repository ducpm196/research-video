scenes:
- id: hook
  kind: hook
  title: Một khoá trong kho mã công khai
  steps:
  - show: '<p>Một lập trình viên dán khoá truy cập vào tệp cấu hình để chạy thử, rồi đẩy mã lên kho công khai. Vài phút sau,
      công cụ tự động của kẻ xấu đã tìm thấy khoá và bật hàng trăm máy ảo đào tiền ảo. Khoá đó có quyền <b>làm mọi thứ</b>,
      và <b>không bao giờ hết hạn</b>.</p>

      <div class="box key">Hôm nay: <b>định danh và quyền truy cập</b> — cách hệ thống quyết định “cho hay không”, và cách
      cấp đúng quyền, trong đúng thời gian.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, một lập trình viên dán khoá truy cập vào tệp cấu hình để chạy thử, rồi đẩy mã lên một kho công khai. Vài
      phút sau, công cụ tự động của kẻ xấu đã tìm thấy khoá và bật hàng trăm máy ảo đào tiền ảo. Khoá đó có quyền làm mọi
      thứ, và không bao giờ hết hạn. Hôm nay ta học định danh và quyền truy cập, cách hệ thống quyết định cho hay không, và
      cách cấp đúng quyền trong đúng thời gian. Chia sẻ khoá bí mật quản trị gốc cho mọi kỹ sư và lưu cứng trong mã nguồn
      là con đường ngắn nhất dẫn tới mất sạch hệ thống. Quản trị định danh đám mây dựa trên vai trò cấp thẻ ngắn hạn và quy
      tắc từ chối tường minh giúp giảm tối đa nguy cơ truy cập trái phép.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: xác thực khác cấp quyền, và dấu sao nghĩa là mọi'
  checks:
  - 3 >= 1
  steps:
  - show: '<table class="t"><tr><th>câu hỏi</th><th>tên gọi</th><th>ví dụ thẻ ra vào tòa nhà</th></tr>

      <tr><td>bạn là <b>ai</b>?</td><td>xác thực</td><td>quẹt thẻ, máy biết đó là thẻ của An</td></tr>

      <tr><td>bạn được làm <b>gì</b>?</td><td>cấp quyền</td><td>thẻ của An mở được tầng 3, không mở được phòng máy chủ</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.3'
    say: Trước hết, phân biệt hai câu hỏi. Bạn là ai là câu hỏi xác thực, như quẹt thẻ ra vào thì máy biết đó là thẻ của An.
      Bạn được làm gì là câu hỏi cấp quyền, như thẻ của An mở được tầng 3 nhưng không mở được phòng máy chủ, và bài hôm nay
      nói về câu hỏi thứ hai. Mọi yêu cầu gọi giao diện đám mây đều đi qua bộ đánh giá chính sách gồm danh sách cho phép và
      từ chối.
  - show: '<p>Trong chính sách, dấu sao <code>*</code> nghĩa là <b>mọi</b>: thao tác <code>*</code> là mọi thao tác (đọc,
      ghi, xoá…), tài nguyên <code>*</code> là mọi tài nguyên.</p>

      '
    say: Trong chính sách, dấu sao nghĩa là mọi. Thao tác dấu sao là mọi thao tác như đọc, ghi, xoá, còn tài nguyên dấu sao
      là mọi tài nguyên. Thứ tự đánh giá luôn ưu tiên lệnh từ chối tường minh thắng tuyệt đối bất kể có bao nhiêu lệnh cho
      phép khác đi kèm.
- id: sym
  kind: symbol
  title: 'Giải mã: chủ thể, chính sách, luật đánh giá'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>chủ thể</b></td><td>ai đang gọi: người dùng, hay <b>vai trò</b> mà một máy, một hàm đang mang</td></tr>

      <tr><td><b>câu lệnh chính sách</b></td><td>(cho phép / từ chối, thao tác, tài nguyên)</td></tr>

      <tr><td><b>vai trò</b></td><td>tập quyền mà chủ thể <b>mượn tạm</b>, nhận thông tin xác thực có hạn (ví dụ một giờ)</td></tr>

      <tr><td><b>khoá truy cập dài hạn</b></td><td>cặp mã định danh và chuỗi bí mật mà chương trình dùng thay mật khẩu; không
      tự hết hạn</td></tr></table>

      <p><b>Luật đánh giá</b> (bản rút gọn, bỏ qua điều kiện và giới hạn của tổ chức): ① có câu <b>từ chối</b> nào khớp (gọi
      là <b>từ chối tường minh</b>) → từ chối, dù có bao nhiêu câu cho phép ② không có, mà có câu <b>cho phép</b> khớp → cho
      ③ không câu nào khớp → <b>từ chối ngầm định</b>.</p>

      <p class="note"><b>Từ khoá phân quyền IAM:</b> hệ thống quản lý danh tính và quyền viết tắt là <b>IAM</b>; hai hiệu
      lực quy tắc là cho phép (<b>Allow</b>) và từ chối (<b>Deny</b>).</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    - 2
    - 3
    - 3
    say: Bảng có bốn khái niệm. Chủ thể là ai đang gọi, có thể là người dùng, hay một vai trò mà máy hoặc hàm đang mang. Câu
      lệnh chính sách gồm hiệu lực cho phép hay từ chối, thao tác, và tài nguyên. Vai trò là tập quyền mà chủ thể mượn tạm,
      và nhận thông tin xác thực có hạn, ví dụ một giờ. Khoá truy cập dài hạn là cặp mã định danh và chuỗi bí mật mà chương
      trình dùng thay cho mật khẩu, và nó không tự hết hạn. Luật đánh giá, ở bản rút gọn bỏ qua điều kiện và giới hạn của
      tổ chức, có ba bước. Một, nếu có câu từ chối nào khớp, gọi là từ chối tường minh, thì từ chối, dù có bao nhiêu câu cho
      phép. Hai, nếu không có từ chối mà có câu cho phép khớp thì cho, và ba, nếu không câu nào khớp thì từ chối ngầm định.
      Hệ thống phân quyền đám mây gọi tắt là IAM, trong đó hai nhãn quy tắc chính là cho phép và từ chối. Thay vì gắn khoá
      tĩnh lâu dài, vai trò tạm thời cấp thẻ phiên xoay vòng liên tục giảm thiểu thiệt hại nếu lỡ rò rỉ.
