- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - '[alg.iam_eval([(''allow'', {''đọc''}, ''*''), (''deny'', {''*''}, ''luong'')], a, r) for a, r in ((''đọc'', ''bao-cao''),
    (''đọc'', ''luong''), (''ghi'', ''bao-cao''))] == [''allow'', ''deny'', ''implicit-deny'']'
  steps:
  - show: '<div class="code"><div>① cho phép   thao tác: đọc    tài nguyên: *</div><div>② từ chối   thao tác: *      tài nguyên:
      kho "luong"</div></div>

      <table class="t"><tr><th>yêu cầu</th><th>thao tác</th><th>tài nguyên</th></tr><tr><td>(a)</td><td>đọc</td><td>bao-cao</td></tr><tr><td>(b)</td><td>đọc</td><td>luong</td></tr><tr><td>(c)</td><td>ghi</td><td>bao-cao</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một cho phép đọc mọi tài nguyên, câu hai từ chối mọi thao tác trên kho lương. Hãy
      đánh giá ba yêu cầu, đọc kho báo cáo, đọc kho lương, và ghi kho báo cáo. Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>(a) đọc bao-cao: không có từ chối khớp (② chỉ nói kho luong), ① cho phép → <b>cho</b>.</p>

      <p>(b) đọc luong: ② từ chối khớp → <b>từ chối</b>, dù ① cũng cho phép.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Đáp án, yêu cầu a đọc kho báo cáo không gặp câu từ chối nào, vì câu hai chỉ nói về kho lương, và câu một cho phép,
      nên được cho. Yêu cầu b đọc kho lương gặp ngay câu hai từ chối, nên bị từ chối, dù câu một cũng cho phép. Truy vết từng
      câu lệnh chính sách trên một hành động gọi xác định ngay kết quả cho phép, từ chối ngầm hay từ chối thẳng.
  - show: '<p>(c) ghi bao-cao: không có từ chối khớp, ① chỉ cho <b>đọc</b> → không câu nào cho phép ghi → <b>từ chối ngầm
      định</b>.</p>

      '
    say: Yêu cầu c ghi kho báo cáo không gặp câu từ chối nào, nhưng câu một chỉ cho phép đọc. Không câu nào cho phép ghi,
      nên bị từ chối ngầm định.
