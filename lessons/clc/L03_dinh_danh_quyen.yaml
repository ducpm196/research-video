      thông thường không giới hạn được nó. Khoá nó bằng xác thực nhiều lớp (mật khẩu cộng mã trên điện thoại), cất đi; làm
      việc hằng ngày bằng vai trò có giới hạn.</span></div>

      '
    say: Lỗi thứ ba, dùng tài khoản gốc hằng ngày, nên không giới hạn được gì. Tài khoản gốc là tài khoản tạo ra cả tài khoản
      đám mây, mặc định có mọi quyền, và chính sách quyền thông thường không giới hạn được nó. Hãy khoá nó bằng xác thực
      nhiều lớp, như mật khẩu cộng mã trên điện thoại, và cất đi, còn làm việc hằng ngày bằng vai trò có giới hạn.
