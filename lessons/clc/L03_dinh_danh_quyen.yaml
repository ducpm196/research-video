- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">mặc định: từ chối</span><span class="a">→</span>

      <span class="n">từ chối tường minh thắng mọi cho phép</span><span class="a">→</span>

      <span class="n">đặc quyền tối thiểu: đúng thao tác, đúng tài nguyên</span><span class="a">→</span>

      <span class="n">vai trò, thông tin xác thực tạm thời; cất tài khoản gốc</span></div>

      '
    say: Tổng kết lại, mặc định là từ chối, và từ chối tường minh thắng mọi cho phép. Hãy cấp đặc quyền tối thiểu, đúng thao
      tác trên đúng tài nguyên, dùng vai trò với thông tin xác thực tạm thời, và cất tài khoản gốc đi. Nguyên tắc cấp quyền
      tối thiểu đi kèm từ chối tường minh ngăn chặn thiệt hại dây chuyền ngay cả khi một tài khoản dịch vụ bị chiếm quyền
      kiểm soát. Vai trò ngắn hạn và ranh giới từ chối tường minh làm cột trụ không thể thiếu bảo vệ tài khoản đám mây. Quy
      tắc từ chối tường minh luôn chiếm ưu thế tuyệt đối làm chốt chặn cuối giữ an toàn tài khoản đám mây.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: '<div class="chain"><span class="n">mặc định: từ chối</span><span class="a">→</span>

      <span class="n">từ chối tường minh thắng mọi cho phép</span><span class="a">→</span>

      <span class="n">đặc quyền tối thiểu: đúng thao tác, đúng tài nguyên</span><span class="a">→</span>

      <span class="n">vai trò, thông tin xác thực tạm thời; cất tài khoản gốc</span></div>

      '
    say: Rà soát quyền hạn định kỳ kết hợp dùng vai trò truy cập tạm thời thay cho khoá cố định giúp thu hẹp tối đa vùng thiệt
      hại khi lộ thông tin. Quy tắc từ chối tường minh luôn thắng mọi lệnh cho phép trở thành hàng rào an toàn cuối cùng bảo
      vệ toàn bộ tài nguyên dùng chung. Tài khoản quản trị luôn được bảo vệ thêm lớp xác thực và ghi vết mọi thay đổi quyền
      hạn. Kiểm toán định kỳ loại bỏ mọi quyền dư thừa không sử dụng qua chín mươi ngày đóng kín mặt tấn công.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
  - show: '<div class="box key"><b>Tư duy:</b> câu hỏi đúng không phải “người này cần quyền gì?”, mà “<b>nếu</b> quyền này
      bị lộ thì mất bao nhiêu?”.</div>

      <p class="note"><b>So sánh hai quy mô:</b> một hàm thử nghiệm trên 1 kho hay tài khoản sản phẩm có 100+ kho và 50 vai
      trò đều đánh giá theo quy tắc: mặc định từ chối, từ chối tường minh thắng mọi cho phép; cấp hẹp bằng vai trò tạm thời
      giúp giới hạn thiệt hại khi có sự cố.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Điều cần mang theo, câu hỏi đúng không phải người này cần quyền gì, mà là nếu quyền này bị lộ thì mất bao nhiêu.
      Ở hai mức quy mô, dù 1 kho nhỏ hay tài khoản lớn hàng trăm kho và hàng chục vai trò đều theo một quy tắc. Mặc định từ
      chối, từ chối tường minh luôn thắng cho phép. Bước tiếp theo phân tích ba loại hình lưu trữ đám mây chủ lực về tốc độ,
      cách gắn kết và độ bền dữ liệu.
  - clear: true
    show: '<p class="note">Bài sau (bài 4): <b>lưu trữ</b> — đối tượng, khối, tệp và độ bền.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 4, ta học lưu trữ, với đối tượng, khối, tệp, và độ bền. Hẹn gặp bạn ở bài tiếp theo. Quản trị quyền
      vững chắc giúp toàn bộ dịch vụ lưu trữ sắp thiết lập an toàn ngay từ lớp tiếp cận đầu tiên.
