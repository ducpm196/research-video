      x="610" y="155" font-size="20">không</text><text x="1080" y="155" font-size="20">không</text></g><g stroke="#1f2937"
      stroke-width="3" fill="none"><line x1="180" y1="165" x2="268" y2="165" marker-end="url(#arC3)"/><line x1="590" y1="165"
      x2="738" y2="165" marker-end="url(#arC3)"/><line x1="1060" y1="165" x2="1148" y2="165" marker-end="url(#arC3)"/><line
      x1="430" y1="260" x2="430" y2="283" marker-end="url(#arC3)"/><line x1="900" y1="260" x2="900" y2="283" marker-end="url(#arC3)"/></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ luật đánh giá như hai câu hỏi theo đúng thứ tự. Câu đầu tiên luôn là có câu từ chối nào khớp không, có thì
      dừng ngay ở từ chối. Chỉ khi không có từ chối mới hỏi tới cho phép, và nếu cũng không có thì mặc định là từ chối. Giống
      thẻ ra vào khách thăm ngắn hạn tự huỷ cuối giờ thay cho bộ chìa khoá vạn năng đúc bằng đồng mang về nhà.
- id: example
  kind: example
  title: Hai câu lệnh, ba yêu cầu
  checks:
  - '[alg.iam_eval([(''allow'', {''*''}, ''bao-cao''), (''deny'', {''xoá''}, ''bao-cao'')], a, r) for a, r in ((''đọc'', ''bao-cao''),
    (''xoá'', ''bao-cao''), (''ghi'', ''kho-khac''))] == [''allow'', ''deny'', ''implicit-deny'']'
  steps:
  - show: '<div class="code"><div>① cho phép   thao tác: *      tài nguyên: kho "bao-cao"</div><div>② từ chối   thao tác:
      xoá    tài nguyên: kho "bao-cao"</div></div>

      '
    say: Bước một, đọc hai câu lệnh. Câu một cho phép mọi thao tác trên kho báo cáo, câu hai từ chối thao tác xoá trên kho
      báo cáo.
  - show: '<table class="t"><tr><th>yêu cầu</th><th>câu khớp</th><th>kết quả</th></tr>

      <tr><td>đọc kho bao-cao</td><td>① cho phép</td><td><b>cho</b></td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    say: Bước hai, xét yêu cầu đọc kho báo cáo. Không có câu từ chối nào khớp, vì câu hai chỉ nói về xoá, còn câu một cho
      phép, nên được cho.
  - clear: true
    show: '<table class="t"><tr><th>yêu cầu</th><th>câu khớp</th><th>kết quả</th></tr>

      <tr><td>xoá kho bao-cao</td><td>① cho phép, ② từ chối</td><td>$\hl{\text{từ chối}}$ — từ chối tường minh thắng</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    say: Bước ba, xét yêu cầu xoá kho báo cáo. Câu hỏi đầu tiên đã có câu hai khớp, nên dừng ngay ở từ chối, dù câu một cũng
      cho phép.
  - show: '<table class="t"><tr><th>yêu cầu</th><th>câu khớp</th><th>kết quả</th></tr>

      <tr><td>ghi kho kho-khac</td><td>không câu nào</td><td>từ chối ngầm định</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    say: Bước bốn, xét yêu cầu ghi vào một kho khác. Không câu nào nói về kho đó, nên rơi xuống ô cuối, từ chối ngầm định.
      Nguyên tắc từ chối ngầm định ở cuối bảng quy tắc khoá kín mọi đường truy cập chưa được cấp phép rõ ràng.
- id: check
  kind: check
  title: 'Tự kiểm: thử hết mọi tổ hợp'
  checks:
  - '[alg.iam_eval([(''allow'', {''*''}, ''bao-cao''), (''deny'', {''xoá''}, ''bao-cao'')], a, r) for r in (''bao-cao'', ''kho-khac'')
    for a in (''đọc'', ''ghi'', ''xoá'')] == [''allow'', ''allow'', ''deny'', ''implicit-deny'', ''implicit-deny'', ''implicit-deny'']'
  steps:
  - show: '<table class="t"><tr><th>tài nguyên \ thao tác</th><th>đọc</th><th>ghi</th><th>xoá</th></tr>

      <tr><td>bao-cao</td><td>cho</td><td>cho</td><td class="red">từ chối</td></tr>

      <tr><td>kho-khac</td><td>ngầm định từ chối</td><td>ngầm định từ chối</td><td>ngầm định từ chối</td></tr></table>

      <p class="note"><b>Đặc quyền tối thiểu:</b> chỉ mở đúng thao tác cần (như <code>đọc</code>) trên đúng tài nguyên thay vì mở toàn bộ <code>*</code>.</p>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    say: Kiểm bằng đường khác, vì chỉ có 3 thao tác và 2 kho, máy thử hết 6 tổ hợp. Ở kho báo cáo, đọc và ghi được cho, chỉ
      xoá bị từ chối. Ở kho khác, cả ba đều bị từ chối ngầm định, đúng như đi theo hình hai câu hỏi. Áp dụng đặc quyền tối
      thiểu nghĩa là chỉ mở đúng thao tác cần như đọc trên đúng kho thay vì dấu sao.

- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Khoá truy cập dài hạn trong mã nguồn <b class="red">(kiểu rò rỉ rất hay gặp)</b>

      <br><span class="note">Máy và hàm dùng <b>vai trò</b> gắn sẵn, nhận thông tin xác thực tạm thời tự xoay vòng. Người
      dùng đăng nhập qua hệ định danh của công ty. Quét kho mã để chặn khoá trước khi đẩy lên.</span></div>

      '
    say: Lỗi thứ nhất, để khoá truy cập dài hạn trong mã nguồn, một kiểu rò rỉ rất hay gặp. Máy và hàm nên dùng vai trò gắn
      sẵn, nhận thông tin xác thực tạm thời tự xoay vòng. Người dùng đăng nhập qua hệ định danh của công ty, và kho mã
      được quét để chặn khoá trước khi đẩy lên. Cấp quyền dấu sao toàn phần cho tiện chạy thử lúc đầu rồi quên siết lại
      trước ngày đưa lên sản xuất.
  - show: ''
    say: Tuân thủ quyền tối thiểu từ lúc khởi đầu buộc mỗi hàm hay máy ảo chỉ được chạm đúng một kho tài nguyên định sẵn. Cấp
      quyền cụ thể tới từng kho tài nguyên và thao tác cần thiết giảm bán kính ảnh hưởng khi lộ thông tin. Dán dấu sao
      toàn quyền lên mọi hành động lẫn tài nguyên chỉ để sửa nhanh một lỗi truy cập trong lúc phát triển. Quên bật xác
      thực nhiều bước cho tài khoản gốc đặt toàn bộ cụm máy chủ vào rủi ro chiếm quyền từ xa.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Cho quyền “*” cho nhanh <b class="red">(vi phạm đặc quyền tối thiểu)</b>

      <br><span class="note"><b>Đặc quyền tối thiểu</b>: mỗi chủ thể chỉ được đúng những quyền cần cho việc của nó, không
      hơn. Hệ nhỏ 1 kho dễ cấp nhầm cho tiện; trên hệ 100+ kho và 50 vai trò, chỉ một hàm có quyền “*” bị lỗi là kẻ xấu chiếm
      cả tài khoản. Cấp đúng thao tác, đúng tài nguyên; xem lại quyền không dùng tới.</span></div>

      '
    say: Lỗi thứ hai, cho quyền mọi thứ cho nhanh, vi phạm nguyên tắc đặc quyền tối thiểu. Nguyên tắc này nói mỗi chủ thể chỉ
      được đúng những quyền cần cho việc của nó, không hơn. Một hàm chỉ cần đọc một kho mà có quyền mọi thao tác trên mọi
      tài nguyên, thì một lỗi trong hàm là kẻ xấu có cả tài khoản. Hãy cấp đúng thao tác trên đúng tài nguyên, và định kỳ
      xem lại quyền không dùng tới.
  - show: ''
    say: Dùng khoá truy cập gốc cá nhân chạy cho máy chủ sản xuất khiến khi nhân sự nghỉ việc toàn bộ hạ tầng gãy đổ theo. Sử
      dụng thẻ phiên ngắn hạn gắn vai trò thay thế hoàn toàn khoá tĩnh gắn chặt trong biến cấu hình máy. Lưu khoá truy cập
      tĩnh trực tiếp vào kho mã nguồn công cộng tạo kẽ hở bị tin tặc tự động quét đánh chiếm sau ba phút.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Dùng tài khoản gốc hằng ngày <b class="red">(không giới hạn được)</b>

