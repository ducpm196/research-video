id: L05
course: CLC
series: "CLC · Điện toán đám mây"
title: "Bài 5 — Máy ảo, co giãn và cách trả tiền: theo giờ, đặt trước, giá rẻ có thể bị thu hồi"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/clc.yaml L05; audit/clc/verify_clc.py L05; tài liệu bảng giá và “Spot Instances” của các nhà cung cấp lớn (bản hiện hành, tên chỉ trên màn hình); bài 0, 1"
assumes: [arith, frac, cdot, approx]
# Quy ước: MỌI ĐƠN GIÁ LÀ SỐ MINH HOẠ (giá thật đổi theo vùng, loại máy và thời điểm). Một năm = 8760 giờ. Đặt trước: trả một lần cho cả năm, dùng
#   hay không cũng mất. Hoà vốn = tiền đặt trước / giá theo giờ (alg.breakeven_hours). $ đọc là “đô la”.
objectives:
  - "Tính điểm hoà vốn giữa trả theo giờ và đặt trước"
  - "Biết loại tải nào chạy được trên máy có thể bị thu hồi"
  - "Dùng co giãn theo tải"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Đặt trước để tiết kiệm, rồi trả tiền cho máy ngồi không"
    checks:
      - "10 * 22 * 12 == 2640 and round(2640 * 0.10) == 264"
    steps:
      - show: |
          <p>Nhóm phân tích chạy máy tính toán 10 giờ mỗi ngày làm việc. Ai đó đọc rằng “đặt trước rẻ hơn tới 40%”, liền đặt trước cả năm với 500 đô la. Cuối năm tính lại: trả theo giờ chỉ tốn <b>264 đô la</b>. Đặt trước chỉ rẻ khi máy chạy đủ nhiều giờ.</p>
          <div class="box key">Hôm nay: <b>máy ảo và cách trả tiền</b> — theo giờ, đặt trước, giá rẻ có thể bị thu hồi — và cách tính điểm hoà vốn.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, nhóm phân tích chạy máy tính toán 10 giờ mỗi ngày làm việc. Ai đó đọc rằng đặt trước rẻ hơn tới 40 phần trăm, liền đặt trước cả năm với 500 đô la. Cuối năm tính lại, trả theo giờ chỉ tốn 264 đô la. Đặt trước chỉ rẻ khi máy chạy đủ nhiều giờ. Hôm nay ta học máy ảo và các cách trả tiền, theo giờ, đặt trước, và giá rẻ có thể bị thu hồi, cùng cách tính điểm hoà vốn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: vé lượt hay vé tháng — điểm hoà vốn"
    checks:
      - "round(200 / 7, 1) == 28.6 and 28 * 7 == 196 and 29 * 7 == 203 and 365 * 24 == 8760"
    steps:
      - show: |
          <p>Xe buýt (số minh hoạ): vé lượt 7 nghìn đồng, vé tháng 200 nghìn đồng. Đi bao nhiêu lượt thì vé tháng có lợi? Chia: $\frac{200}{7} \approx 28{,}6$ lượt — gọi là <b>điểm hoà vốn</b>.</p>
        say: "Trước hết, một bài toán đời thường với số minh hoạ. Vé lượt xe buýt 7 nghìn đồng, vé tháng 200 nghìn đồng, vậy đi bao nhiêu lượt thì vé tháng có lợi? Ta chia 200 cho 7, được khoảng 28 phẩy 6 lượt, gọi là điểm hoà vốn."
      - show: |
          <table class="t"><tr><th>số lượt trong tháng</th><th>tiền vé lượt</th><th>chọn</th></tr>
          <tr><td>28</td><td>196 nghìn &lt; 200</td><td>vé lượt</td></tr>
          <tr><td>29</td><td>203 nghìn &gt; 200</td><td>vé tháng</td></tr></table>
          <p>Thuê máy cũng vậy, chỉ thay “lượt” bằng “giờ” — một năm có $365 \cdot 24 = 8760$ giờ.</p>
        introduces: [cdot]
        focus: [1, "1.2", "1.3", 2]
        say: "Bảng kiểm hai bên điểm hoà vốn. Đi 28 lượt thì vé lượt hết 196 nghìn, rẻ hơn vé tháng. Đi 29 lượt thì hết 203 nghìn, nên vé tháng có lợi hơn. Thuê máy cũng vậy, chỉ thay lượt bằng giờ, và một năm có 365 nhân 24, bằng 8760 giờ."

  - id: sym
    kind: symbol
    title: "Giải mã: ba cách trả tiền"
    steps:
      - show: |
          <table class="t"><tr><th>cách</th><th>đặc điểm</th><th>hợp với</th></tr>
          <tr><td><b>theo giờ</b> (theo nhu cầu)</td><td>bật tắt bất cứ lúc nào, trả theo thời gian chạy</td><td>tải thất thường, thử nghiệm</td></tr>
          <tr><td><b>đặt trước</b> (1–3 năm)</td><td>giá mỗi giờ thấp hơn, nhưng trả cả năm dù không dùng</td><td>tải nền chạy suốt ngày đêm</td></tr>
          <tr><td><b>giá rẻ có thể bị thu hồi</b> (spot)</td><td>rẻ hơn nhiều, nhưng nhà cung cấp lấy lại máy với báo trước rất ngắn</td><td>việc chia nhỏ được, làm lại được: dựng mã, xử lý lô, huấn luyện có điểm lưu</td></tr></table>
          <p><b>Hoà vốn</b> = tiền đặt trước / giá theo giờ: chạy nhiều giờ hơn mức này thì đặt trước rẻ hơn.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.4", 2]
        say: "Bảng so ba cách trả tiền. Trả theo giờ, hay theo nhu cầu, cho bật tắt bất cứ lúc nào và trả theo thời gian chạy, hợp với tải thất thường và thử nghiệm. Đặt trước một tới ba năm có giá mỗi giờ thấp hơn, nhưng phải trả cả năm dù không dùng, hợp với tải nền chạy suốt ngày đêm. Giá rẻ có thể bị thu hồi thì rẻ hơn nhiều, nhưng nhà cung cấp lấy lại máy với báo trước rất ngắn. Cách này hợp với việc chia nhỏ được và làm lại được, như dựng mã, xử lý theo lô, hay huấn luyện có điểm lưu. Điểm hoà vốn bằng tiền đặt trước chia giá theo giờ, chạy nhiều giờ hơn mức này thì đặt trước rẻ hơn."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Đường dốc gặp đường phẳng"
    steps:
      - show: |
          <div><svg width="1500" height="340" viewBox="0 0 1500 340"><g fill="#1f2937"><line x1="200" y1="290" x2="1290" y2="290" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="290" x2="200" y2="30" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="290" x2="1250" y2="47" stroke="#2a78d6" stroke-width="4"/><line x1="200" y1="151" x2="1250" y2="151" stroke="#eb6834" stroke-width="4"/><line x1="799" y1="151" x2="799" y2="290" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6"/><circle cx="799" cy="151" r="10" fill="#b91c1c"/><g font-size="22"><text x="799" y="318" text-anchor="middle" fill="#b91c1c">5000 giờ: hoà vốn</text><text x="1240" y="35" text-anchor="end" fill="#2a78d6">theo giờ: 0,10 đô la mỗi giờ</text><text x="236" y="139" fill="#eb6834">đặt trước: 500 đô la cả năm</text><text x="1300" y="298">giờ chạy</text><text x="210" y="28">tiền mỗi năm</text><text x="440" y="257" font-size="20">ít giờ: theo giờ rẻ hơn</text><text x="955" y="184" font-size="20">nhiều giờ: đặt trước rẻ hơn</text></g></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ tiền phải trả theo số giờ chạy trong năm. Trả theo giờ là đường xanh dốc lên đều, đặt trước là đường cam nằm ngang, dùng hay không cũng mất 500 đô la. Hai đường gặp nhau ở 5000 giờ, bên trái điểm đó trả theo giờ rẻ hơn, bên phải thì đặt trước rẻ hơn."

  - id: example
    kind: example
    title: "0,10 đô la mỗi giờ hay 500 đô la mỗi năm"
    checks:
      - "round(alg.breakeven_hours(500, 0.10)) == 5000 and round(5000 / 8760 * 100, 1) == 57.1 and round(8760 * 0.10) == 876 and round(2640 * 0.10) == 264"
    steps:
      - show: |
          <p><b>Bước 1 — hoà vốn</b> (số minh hoạ): $\frac{500}{0{,}10} = \hl{5000}$ giờ.</p>
        say: "Bước một, với số minh hoạ, điểm hoà vốn bằng 500 chia 0 phẩy 10, bằng 5000 giờ."
      - show: |
          <p><b>Bước 2 — đổi ra phần năm:</b> $\frac{5000}{8760} \approx 57{,}1\%$ — máy phải chạy hơn một nửa thời gian trong năm thì đặt trước mới có lợi.</p>
        say: "Bước hai, đổi ra phần của năm, 5000 chia 8760, khoảng 57 phẩy 1 phần trăm. Vậy máy phải chạy hơn một nửa thời gian trong năm thì đặt trước mới có lợi."
      - clear: true
        show: |
          <table class="t"><tr><th>tải</th><th>số giờ</th><th>theo giờ</th><th>so với đặt trước 500</th></tr>
          <tr><td>chạy suốt năm</td><td>8760</td><td>$8760 \cdot 0{,}10 = 876$ đô la</td><td>đặt trước rẻ hơn 376</td></tr>
          <tr><td>10 giờ × 22 ngày × 12 tháng</td><td>2640</td><td>$2640 \cdot 0{,}10 = 264$ đô la</td><td>theo giờ rẻ hơn 236</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước ba, thử hai loại tải. Tải chạy suốt năm, 8760 giờ, trả theo giờ hết 876 đô la, nên đặt trước rẻ hơn 376 đô la. Tải giờ hành chính, 10 giờ mỗi ngày, 22 ngày mỗi tháng, 12 tháng, là 2640 giờ, trả theo giờ chỉ 264 đô la, rẻ hơn đặt trước 236 đô la."
      - show: |
          <p><b>Bước 4 — quy tắc:</b> tách tải thành <b>phần nền</b> (luôn chạy → đặt trước) và <b>phần dao động</b> (co giãn theo giờ, hoặc máy có thể bị thu hồi nếu làm lại được).</p>
        say: "Bước bốn, rút ra quy tắc, tách tải thành phần nền luôn chạy để đặt trước, và phần dao động để co giãn theo giờ. Phần dao động cũng có thể dùng máy dễ bị thu hồi, nếu việc đó làm lại được."

  - id: check
    kind: check
    title: "Tự kiểm: thử hai bên điểm hoà vốn"
    checks:
      - "round(5000 * 0.10, 6) == 500 and round(4900 * 0.10) == 490 and round(5100 * 0.10) == 510"
      - "round(876 - 500) == 376 and round(500 - 264) == 236"
    steps:
      - show: |
          <table class="t"><tr><th>giờ chạy</th><th>theo giờ</th><th>đặt trước</th><th>rẻ hơn</th></tr>
          <tr><td>4900</td><td>490</td><td>500</td><td>theo giờ</td></tr>
          <tr><td>5000</td><td>500</td><td>500</td><td>bằng nhau ✓</td></tr>
          <tr><td>5100</td><td>510</td><td>500</td><td>đặt trước</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, vì điểm hoà vốn là chỗ hai cách bằng tiền, ta thử ba số giờ quanh nó. Chạy 4900 giờ thì theo giờ hết 490, rẻ hơn. Đúng 5000 giờ thì cả hai cùng 500 đô la. Chạy 5100 giờ thì theo giờ hết 510, nên đặt trước rẻ hơn."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Đặt trước cho tải không ổn định <b class="red">(trả tiền cho máy ngồi không)</b>
          <br><span class="note">Đo mức dùng thật vài tháng trước khi cam kết. Chỉ đặt trước phần nền thấp nhất luôn chạy.</span></div>
        say: "Lỗi thứ nhất, đặt trước cho tải không ổn định, nên trả tiền cho máy ngồi không. Hãy đo mức dùng thật vài tháng trước khi cam kết, và chỉ đặt trước phần nền thấp nhất luôn chạy."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Chạy cơ sở dữ liệu duy nhất trên máy có thể bị thu hồi <b class="red">(mất máy giữa chừng)</b>
          <br><span class="note">Máy giá rẻ có thể bị lấy lại bất cứ lúc nào. Chỉ chạy việc không trạng thái, có điểm lưu, chịu được dừng đột ngột.</span></div>
        say: "Lỗi thứ hai, chạy cơ sở dữ liệu duy nhất trên máy có thể bị thu hồi, nên mất máy giữa chừng. Máy giá rẻ có thể bị lấy lại bất cứ lúc nào, nên chỉ chạy việc không trạng thái, có điểm lưu, và chịu được dừng đột ngột."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn máy to “cho chắc” <b class="red">(trả gấp đôi cho tải dùng 20%)</b>
          <br><span class="note">Theo dõi mức dùng bộ xử lý và bộ nhớ; chọn cỡ vừa, rồi để nhóm máy tự co giãn theo tải thay vì một máy to cố định.</span></div>
        say: "Lỗi thứ ba, chọn máy to cho chắc, nên trả gấp đôi cho một tải chỉ dùng 20 phần trăm. Hãy theo dõi mức dùng bộ xử lý và bộ nhớ, chọn cỡ vừa, rồi để nhóm máy tự co giãn theo tải thay vì một máy to cố định."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.breakeven_hours(1100, 0.20)) == 5500 and round(5500 / 8760 * 100, 1) == 62.8 and round(5000 * 0.20) == 1000"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Theo giờ 0,20 đô la, đặt trước 1 năm 1100 đô la. Điểm hoà vốn bao nhiêu giờ, bao nhiêu phần trăm năm?</td></tr>
          <tr><td>2</td><td>Tải chạy 5000 giờ mỗi năm. Chọn cách nào, chênh bao nhiêu?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, theo giờ 0 phẩy 20 đô la, đặt trước một năm 1100 đô la. Điểm hoà vốn là bao nhiêu giờ, và bao nhiêu phần trăm của năm? Câu hai, tải chạy 5000 giờ mỗi năm, chọn cách nào, và chênh bao nhiêu? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $\frac{1100}{0{,}20} = \hl{5500}$ giờ; $\frac{5500}{8760} \approx 62{,}8\%$ năm.</p>
        say: "Đáp án câu một, 1100 chia 0 phẩy 20, bằng 5500 giờ. Chia cho 8760 giờ trong năm, được khoảng 62 phẩy 8 phần trăm."
      - show: |
          <p>② 5000 &lt; 5500 → nằm bên trái điểm hoà vốn → <b>theo giờ</b>: $5000 \cdot 0{,}20 = 1000$ đô la, rẻ hơn đặt trước 1100 đô la đúng 100 đô la.</p>
        say: "Câu hai, 5000 nhỏ hơn 5500, tức nằm bên trái điểm hoà vốn, nên chọn trả theo giờ. Hết 5000 nhân 0 phẩy 20, bằng 1000 đô la, rẻ hơn đặt trước đúng 100 đô la."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">hoà vốn = tiền đặt trước / giá theo giờ</span><span class="a">→</span>
          <span class="n">phần nền: đặt trước</span><span class="a">→</span>
          <span class="n">phần dao động: theo giờ, co giãn</span><span class="a">→</span>
          <span class="n">việc làm lại được: máy có thể bị thu hồi</span></div>
        say: "Tổng kết lại, điểm hoà vốn bằng tiền đặt trước chia giá theo giờ. Phần nền thì đặt trước, phần dao động thì trả theo giờ và co giãn, còn việc làm lại được thì dùng máy có thể bị thu hồi."
      - show: |
          <div class="box key"><b>Tư duy:</b> trên đám mây, kiến trúc <b>là</b> hoá đơn — mỗi quyết định thiết kế đều có một con số tiền đi kèm.</div>
        say: "Điều cần mang theo, trên đám mây kiến trúc chính là hoá đơn, mỗi quyết định thiết kế đều có một con số tiền đi kèm."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 6): <b>hàm theo sự kiện</b> — khởi động lạnh, giới hạn và mô hình chi phí.</p>
        forward_ref: true
        say: "Ở bài sau, bài 6, ta học hàm theo sự kiện, với khởi động lạnh, giới hạn, và mô hình chi phí. Hẹn gặp bạn ở bài tiếp theo."
