scenes:
- id: hook
  kind: hook
  title: Đặt trước để tiết kiệm, rồi trả tiền cho máy ngồi không
  checks:
  - 10 * 22 * 12 == 2640 and round(2640 * 0.10) == 264 and round((1 - 500 / 876) * 100) == 43
  steps:
  - show: '<p>Nhóm phân tích chạy máy tính toán 10 giờ mỗi ngày làm việc. Ai đó đọc rằng “đặt trước rẻ hơn tới 43%”, liền
      đặt trước cả năm với 500 đô la. Cuối năm tính lại: trả theo giờ chỉ tốn <b>264 đô la</b> (mọi giá trong bài là số minh
      hoạ). Đặt trước chỉ rẻ khi máy chạy đủ nhiều giờ.</p>

      <div class="box key">Hôm nay: <b>máy ảo và cách trả tiền</b> — theo giờ, đặt trước, giá rẻ có thể bị thu hồi — và cách
      tính điểm hòa vốn.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, nhóm phân tích chạy máy tính toán 10 giờ mỗi ngày làm việc. Ai đó đọc rằng đặt trước rẻ hơn tới 43 phần
      trăm, liền đặt trước cả năm với 500 đô la. Cuối năm tính lại, trả theo giờ chỉ tốn 264 đô la, và mọi giá trong bài đều
      là số minh hoạ. Đặt trước chỉ rẻ khi máy chạy đủ nhiều giờ. Hôm nay ta học máy ảo và các cách trả tiền, theo giờ, đặt
      trước, và giá rẻ có thể bị thu hồi, cùng cách tính điểm hòa vốn. Thuê cố định mười máy lớn nhất phục vụ lượng khách
      cao điểm hai tiếng mỗi tối làm lãng phí chín mươi phần trăm ngân sách. Kết hợp hợp đồng đặt trước cho tải nền ổn định
      cùng máy giá rẻ dễ thu hồi và co giãn tự động tối ưu chi phí tới tận xu.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: vé lượt hay vé tháng — điểm hoà vốn'
  checks:
  - round(200 / 7, 1) == 28.6 and 28 * 7 == 196 and 29 * 7 == 203 and 365 * 24 == 8760
  steps:
  - show: '<p>Xe buýt (số minh hoạ): vé lượt 7 nghìn đồng, vé tháng 200 nghìn đồng. Đi bao nhiêu lượt thì vé tháng có lợi?
      Chia: $\frac{200}{7} \approx 28{,}6$ lượt — gọi là <b>điểm hòa vốn</b>.</p>

      '
    say: Trước hết, một bài toán đời thường với số minh hoạ. Vé lượt xe buýt 7 nghìn đồng, vé tháng 200 nghìn đồng, vậy đi
      bao nhiêu lượt thì vé tháng có lợi? Ta chia 200 cho 7, được khoảng 28 phẩy 6 lượt, gọi là điểm hòa vốn. Thanh toán theo
      giờ linh hoạt tránh bỏ vốn đầu tư phần cứng ban đầu nhưng đơn giá cao nhất nếu chạy quanh năm.
  - show: '<table class="t"><tr><th>số lượt trong tháng</th><th>tiền vé lượt</th><th>chọn</th></tr>

      <tr><td>28</td><td>196 nghìn &lt; 200</td><td>vé lượt</td></tr>

      <tr><td>29</td><td>203 nghìn &gt; 200</td><td>vé tháng</td></tr></table>

      <p>Thuê máy cũng vậy, chỉ thay “lượt” bằng “giờ” — một năm có $365 \cdot 24 = 8760$ giờ.</p>

      '
    introduces:
    - cdot
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    - 2
    say: Bảng kiểm hai bên điểm hòa vốn. Đi 28 lượt thì vé lượt hết 196 nghìn, rẻ hơn vé tháng. Đi 29 lượt thì hết 203 nghìn,
      nên vé tháng có lợi hơn. Thuê máy cũng vậy, chỉ thay lượt bằng giờ, và một năm có 365 nhân 24, bằng 8760 giờ. Gói đặt
      trước giảm giá sâu tới phân nửa đổi lấy cam kết dung lượng ổn định dài hạn từ một tới ba năm.
- id: sym
  kind: symbol
  title: 'Giải mã: ba cách trả tiền'
  steps:
  - show: '<table class="t"><tr><th>cách</th><th>đặc điểm</th><th>hợp với</th></tr>

      <tr><td><b>theo giờ</b> (theo nhu cầu)</td><td>bật tắt bất cứ lúc nào, trả theo thời gian chạy</td><td>tải thất thường,
      thử nghiệm</td></tr>

      <tr><td><b>đặt trước</b> (1–3 năm)</td><td>giá mỗi giờ thấp hơn, nhưng trả cả năm dù không dùng</td><td>tải nền chạy
      suốt ngày đêm</td></tr>

      <tr><td><b>giá rẻ có thể bị thu hồi</b> (spot)</td><td>rẻ hơn nhiều, nhưng nhà cung cấp lấy lại máy với báo trước rất
      ngắn</td><td>việc chia nhỏ được, làm lại được: dựng mã, xử lý lô, huấn luyện có điểm lưu</td></tr></table>

      <p><b>Hòa vốn</b> = tiền đặt trước / giá theo giờ: chạy nhiều giờ hơn mức này thì đặt trước rẻ hơn.</p>

      <p class="note"><b>Các gói thuê và đơn vị tiền:</b> gói trả linh hoạt theo nhu cầu là <b>On-Demand</b>, gói cam kết
      1–3 năm là <b>Reserved</b>, tính cước theo đơn vị đô la Mỹ (<b>USD</b>).</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - 2
    - 3
    - 3
    say: Bảng so ba cách trả tiền. Trả theo giờ, hay theo nhu cầu, cho bật tắt bất cứ lúc nào và trả theo thời gian chạy,
      hợp với tải thất thường và thử nghiệm. Đặt trước một tới ba năm có giá mỗi giờ thấp hơn, nhưng phải trả cả năm dù không
      dùng, hợp với tải nền chạy suốt ngày đêm. Giá rẻ có thể bị thu hồi thì rẻ hơn nhiều, nhưng nhà cung cấp lấy lại máy
      với báo trước rất ngắn. Cách này hợp với việc chia nhỏ được và làm lại được, như dựng mã, xử lý theo lô, hay huấn luyện
      có điểm lưu. Điểm hòa vốn bằng tiền đặt trước chia giá theo giờ, chạy nhiều giờ hơn mức này thì đặt trước rẻ hơn. Hai
      gói thuê phổ biến là trả theo nhu cầu linh hoạt và đặt trước có cam kết thời hạn, thường niêm yết theo đồng đô la Mỹ.
      Máy giá rẻ dư công suất rẻ hơn bảy mươi phần trăm nhưng nhà cung cấp có thể thu hồi bất kỳ lúc nào cần thông báo trước.
- id: intuition
  kind: intuition
  title: Đường dốc gặp đường phẳng
  steps:
  - show: '<div><svg width="1500" height="340" viewBox="0 0 1500 340"><g fill="#1f2937"><line x1="200" y1="290" x2="1290"
      y2="290" stroke="#6b7280" stroke-width="2"/><line x1="200" y1="290" x2="200" y2="30" stroke="#6b7280" stroke-width="2"/><line
      x1="200" y1="290" x2="1250" y2="47" stroke="#2a78d6" stroke-width="4"/><line x1="200" y1="151" x2="1250" y2="151" stroke="#eb6834"
      stroke-width="4"/><line x1="799" y1="151" x2="799" y2="290" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6"/><circle
      cx="799" cy="151" r="10" fill="#b91c1c"/><g font-size="22"><text x="799" y="318" text-anchor="middle" fill="#b91c1c">5000
      giờ: hòa vốn</text><text x="1240" y="35" text-anchor="end" fill="#2a78d6">theo giờ: 0,10 đô la mỗi giờ</text><text x="236"
      y="139" fill="#eb6834">đặt trước: 500 đô la cả năm</text><text x="1300" y="298">giờ chạy</text><text x="210" y="28">tiền
      mỗi năm</text><text x="440" y="257" font-size="20">ít giờ: theo giờ rẻ hơn</text><text x="955" y="184" font-size="20">nhiều
      giờ: đặt trước rẻ hơn</text></g></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình vẽ tiền phải trả theo số giờ chạy trong năm. Trả theo giờ là đường xanh dốc lên đều, đặt trước là đường cam
      nằm ngang, dùng hay không cũng mất 500 đô la. Hai đường gặp nhau ở 5000 giờ, bên trái điểm đó trả theo giờ rẻ hơn, bên
      phải thì đặt trước rẻ hơn. Đặt trước bàn ăn cố định cho bữa cơm gia đình hàng ngày còn tiệc cuối tuần đông khách đặt
      thêm bàn theo giờ linh hoạt.
- id: example
  kind: example
  title: 0,10 đô la mỗi giờ hay 500 đô la mỗi năm
  checks:
  - round(alg.breakeven_hours(500, 0.10)) == 5000 and round(5000 / 8760 * 100, 1) == 57.1 and round(8760 * 0.10) == 876 and
    round(2640 * 0.10) == 264
  - 6 * 24 == 144 and 6 * 10 + 2 * 14 == 88 and 10 + 14 == 24 and round((1 - 88 / 144) * 100, 1) == 38.9
  steps:
  - show: '<p><b>Bước 1 — hòa vốn</b> (số minh hoạ): $\frac{500}{0{,}10} = \hl{5000}$ giờ.</p>

      '
    say: Bước một, với số minh hoạ, điểm hòa vốn bằng 500 chia 0 phẩy 10, bằng 5000 giờ.
  - show: '<p><b>Bước 2 — đổi ra phần năm:</b> $\frac{5000}{8760} \approx 57{,}1\%$ — máy phải chạy hơn một nửa thời gian
      trong năm thì đặt trước mới có lợi.</p>

      '
    say: Bước hai, đổi ra phần của năm, 5000 chia 8760, khoảng 57 phẩy 1 phần trăm. Vậy máy phải chạy hơn một nửa thời gian
      trong năm thì đặt trước mới có lợi.
  - clear: true
    show: '<table class="t"><tr><th>tải</th><th>số giờ</th><th>theo giờ</th><th>so với đặt trước 500</th></tr>

      <tr><td>chạy suốt năm</td><td>8760</td><td>$8760 \cdot 0{,}10 = 876$ đô la</td><td>đặt trước rẻ hơn 376</td></tr>

      <tr><td>10 giờ × 22 ngày × 12 tháng</td><td>2640</td><td>$2640 \cdot 0{,}10 = 264$ đô la</td><td>theo giờ rẻ hơn 236</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Bước ba, thử hai loại tải. Tải chạy suốt năm, 8760 giờ, trả theo giờ hết 876 đô la, nên đặt trước rẻ hơn 376 đô la.
      Tải giờ hành chính, 10 giờ mỗi ngày, 22 ngày mỗi tháng, 12 tháng, là 2640 giờ, trả theo giờ chỉ 264 đô la, rẻ hơn đặt
      trước 236 đô la.
  - show: '<p><b>Bước 4 — quy tắc:</b> tách tải thành <b>phần nền</b> (luôn chạy → đặt trước) và <b>phần dao động</b> (co
      giãn theo giờ, hoặc máy có thể bị thu hồi nếu làm lại được).</p>

      '
    say: Bước bốn, rút ra quy tắc, tách tải thành phần nền luôn chạy để đặt trước, và phần dao động để co giãn theo giờ. Phần
      dao động cũng có thể dùng máy dễ bị thu hồi, nếu việc đó làm lại được.
  - clear: true
    show: '<p><b>Bước 5 — co giãn tự động</b> cho phần dao động: nhóm máy được đặt số máy tối thiểu, tối đa và một ngưỡng
      (ví dụ giữ mức dùng bộ xử lý trung bình quanh 50%); tải vượt ngưỡng thì <b>thêm</b> máy, tải giảm thì <b>bớt</b> máy.</p>

      <table class="t"><tr><th>cách chạy (số minh hoạ)</th><th>giờ máy mỗi ngày</th></tr>

      <tr><td>cố định 6 máy suốt 24 giờ</td><td>$6 \cdot 24 = 144$</td></tr>

      <tr><td>co giãn: 6 máy trong 10 giờ cao điểm, 2 máy trong 14 giờ còn lại</td><td>$6 \cdot 10 + 2 \cdot 14 = 88$, ít
      hơn ≈ 38,9%</td></tr></table>

      '
    focus:
    - 1
    - 1
    - '2.2'
    - '2.3'
    say: Bước năm, phần dao động dùng co giãn tự động. Nhóm máy được đặt số máy tối thiểu, tối đa, và một ngưỡng, ví dụ giữ
      mức dùng bộ xử lý trung bình quanh 50 phần trăm, tải vượt ngưỡng thì thêm máy, tải giảm thì bớt máy. Với số minh hoạ,
      chạy cố định 6 máy suốt 24 giờ là 6 nhân 24, bằng 144 giờ máy mỗi ngày. Co giãn với 6 máy trong 10 giờ cao điểm và 2
      máy trong 14 giờ còn lại là 6 nhân 10 cộng 2 nhân 14, bằng 88 giờ máy, ít hơn khoảng 38 phẩy 9 phần trăm.
- id: check
  kind: check
  title: 'Tự kiểm: thử hai bên điểm hoà vốn'
  checks:
  - round(5000 * 0.10, 6) == 500 and round(4900 * 0.10) == 490 and round(5100 * 0.10) == 510
  - round(876 - 500) == 376 and round(500 - 264) == 236
  steps:
  - show: '<table class="t"><tr><th>giờ chạy</th><th>theo giờ</th><th>đặt trước</th><th>rẻ hơn</th></tr>

      <tr><td>4900</td><td>490</td><td>500</td><td>theo giờ</td></tr>

      <tr><td>5000</td><td>500</td><td>500</td><td>bằng nhau ✓</td></tr>

      <tr><td>5100</td><td>510</td><td>500</td><td>đặt trước</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Kiểm bằng đường khác, vì điểm hòa vốn là chỗ hai cách bằng tiền, ta thử ba số giờ quanh nó. Chạy 4900 giờ thì theo
      giờ hết 490, rẻ hơn. Đúng 5000 giờ thì cả hai cùng 500 đô la. Chạy 5100 giờ thì theo giờ hết 510, nên đặt trước rẻ hơn.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Đặt trước cho tải không ổn định <b class="red">(trả tiền cho máy ngồi không)</b>

      <br><span class="note">Đo mức dùng thật vài tháng trước khi cam kết. Chỉ đặt trước phần nền thấp nhất luôn chạy.</span></div>

      '
    say: Lỗi thứ nhất, đặt trước cho tải không ổn định, nên trả tiền cho máy ngồi không. Hãy đo mức dùng thật vài tháng trước
      khi cam kết, và chỉ đặt trước phần nền thấp nhất luôn chạy. Đưa cơ sở dữ liệu đơn bản hoặc phiên chạy đơn lẻ quan
      trọng lên máy giá rẻ có thể mất sạch dữ liệu khi máy bị thu hồi.
  - show: ''
    say: Chỉ sử dụng máy giá rẻ cho tác vụ lô không trạng thái, xử lý hàng đợi có thể khởi động lại tức thì trên máy khác.
      Kết hợp máy giá rẻ dễ thu hồi cho hàng đợi chạy nền cắt giảm mạnh chi phí xử lý lô dữ liệu lớn. Đặt ngưỡng tăng máy
      quá sát một trăm phần trăm làm máy mới khởi động xong thì cơn bão lưu lượng đã đánh sập cụm cũ.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Chạy cơ sở dữ liệu duy nhất trên máy có thể bị thu hồi <b class="red">(mất
      máy giữa chừng)</b>

      <br><span class="note">Máy giá rẻ có thể bị lấy lại bất cứ lúc nào. Chỉ chạy việc không trạng thái (không giữ dữ liệu
      cần thiết trên chính máy đó), có điểm lưu, chịu được dừng đột ngột.</span></div>

      '
    say: Lỗi thứ hai, chạy cơ sở dữ liệu duy nhất trên máy có thể bị thu hồi, nên mất máy giữa chừng. Máy giá rẻ có thể bị
      lấy lại bất cứ lúc nào, nên chỉ chạy việc có điểm lưu và chịu được dừng đột ngột. Việc đó còn phải không trạng thái,
      tức không giữ dữ liệu cần thiết trên chính máy đó.
  - show: ''
    say: Đặt ngưỡng co giãn tăng máy quá muộn hoặc thiếu thời gian ổn định làm dịch vụ sập trước khi máy mới kịp khởi động.
      Thử tải kỹ nhịp khởi động máy mới giúp đặt ngưỡng tăng bản sao sớm đủ thời gian ứng cứu giờ cao điểm. Chọn toàn bộ
      cụm chỉ dùng máy giá rẻ dễ thu hồi cho dịch vụ cốt lõi gây rớt đồng loạt lúc nhu cầu tăng cao.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Chọn máy to “cho chắc” <b class="red">(trả gấp đôi cho tải dùng 20%)</b>

      <br><span class="note">Theo dõi mức dùng bộ xử lý và bộ nhớ; chọn cỡ vừa, rồi để nhóm máy tự co giãn theo tải thay vì
      một máy to cố định.</span></div>

      '
    say: Lỗi thứ ba, chọn máy to cho chắc, nên trả gấp đôi cho một tải chỉ dùng 20 phần trăm. Hãy theo dõi mức dùng bộ xử lý
      và bộ nhớ, chọn cỡ vừa, rồi để nhóm máy tự co giãn theo tải thay vì một máy to cố định.
  - show: ''
    say: Cam kết gói đặt trước quá sát đỉnh tải rồi lại mất khách dẫn tới phải gồng trả tiền hàng năm cho những máy bỏ trống.
      Đo sát mức tải nền ổn định qua nhiều tháng trước khi ký cam kết hợp đồng máy đặt trước dài hạn. Chạy thử tải không
      kèm thời gian làm ấm bộ đệm khiến quy mô co giãn tự động phản ứng chậm hơn thực tế.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(alg.breakeven_hours(1100, 0.20)) == 5500 and round(5500 / 8760 * 100, 1) == 62.8 and round(5000 * 0.20) == 1000
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Theo giờ 0,20 đô la, đặt trước 1 năm 1100 đô la. Điểm hòa vốn bao nhiêu giờ, bao nhiêu phần trăm năm?</td></tr>

      <tr><td>2</td><td>Tải chạy 5000 giờ mỗi năm. Chọn cách nào, chênh bao nhiêu?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, theo giờ 0 phẩy 20 đô la, đặt trước một năm 1100 đô la. Điểm hòa vốn là bao
      nhiêu giờ, và bao nhiêu phần trăm của năm? Câu hai, tải chạy 5000 giờ mỗi năm, chọn cách nào, và chênh bao nhiêu? Dừng
      video và làm ra giấy.
    pause: 15
  - show: '<p>① $\frac{1100}{0{,}20} = \hl{5500}$ giờ; $\frac{5500}{8760} \approx 62{,}8\%$ năm.</p>

      '
    say: Đáp án câu một, 1100 chia 0 phẩy 20, bằng 5500 giờ. Chia cho 8760 giờ trong năm, được khoảng 62 phẩy 8 phần trăm.
      Tính hỗn hợp tối ưu giữa máy đặt trước giữ tải đáy ổn định và phần co giãn theo nhu cầu biến động từng giờ.
  - show: '<p>② 5000 &lt; 5500 → nằm bên trái điểm hòa vốn → <b>theo giờ</b>: $5000 \cdot 0{,}20 = 1000$ đô la, rẻ hơn đặt
      trước 1100 đô la đúng 100 đô la.</p>

      '
    say: Câu hai, 5000 nhỏ hơn 5500, tức nằm bên trái điểm hòa vốn, nên chọn trả theo giờ. Hết 5000 nhân 0 phẩy 20, bằng 1000
      đô la, rẻ hơn đặt trước đúng 100 đô la. Kiểm chứng tổng tiền hàng tháng theo từng mức độ tải thấp cao giúp chốt cơ cấu
      đội máy kinh tế nhất.
