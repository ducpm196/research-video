- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">hòa vốn = tiền đặt trước / giá theo giờ</span><span class="a">→</span>

      <span class="n">phần nền: đặt trước</span><span class="a">→</span>

      <span class="n">phần dao động: theo giờ, co giãn</span><span class="a">→</span>

      <span class="n">việc làm lại được: máy có thể bị thu hồi</span></div>

      '
    say: Tổng kết lại, điểm hòa vốn bằng tiền đặt trước chia giá theo giờ. Phần nền thì đặt trước, phần dao động thì trả theo
      giờ và co giãn, còn việc làm lại được thì dùng máy có thể bị thu hồi. Theo dõi tỉ lệ tận dụng giờ máy theo từng ca trong
      ngày giúp điều chỉnh đúng ngưỡng pha trộn giữa thuê dài hạn và co giãn theo tải. Theo dõi sát hiệu suất sử dụng hằng
      ngày giúp nhóm vận hành tránh trả tiền cho hàng trăm giờ máy nhàn rỗi vào ban đêm và cuối tuần. Phối hợp thông minh
      ba mức giá thuê giúp hệ thống đàn hồi theo nhịp sống thật mà vẫn tối ưu kinh phí vận hành. Phối hợp hài hoà ba hình
      thức thuê máy ảo giúp hệ thống co giãn êm mượt với chi phí cực kỳ hợp lý.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
  - show: '<div class="chain"><span class="n">hòa vốn = tiền đặt trước / giá theo giờ</span><span class="a">→</span>

      <span class="n">phần nền: đặt trước</span><span class="a">→</span>

      <span class="n">phần dao động: theo giờ, co giãn</span><span class="a">→</span>

      <span class="n">việc làm lại được: máy có thể bị thu hồi</span></div>

      '
    say: Nhờ cân đối đúng tỉ lệ thuê bao dài hạn và co giãn linh hoạt, chi phí luôn đi sát tải thật. Bất cứ bài toán xử lý
      hàng đợi chịu gián đoạn nào đều là ứng viên vàng tận dụng máy dư công suất giá rẻ. Đối với tải thưa ngắt quãng chỉ chạy
      vài giây mỗi đợt, mô hình hàm sự kiện loại bỏ triệt để thời gian máy nhàn rỗi.
  - show: '<div class="box key"><b>Tư duy:</b> trên đám mây, kiến trúc <b>là</b> hoá đơn — mỗi quyết định thiết kế đều có
      một con số tiền đi kèm.</div>

      <p class="note"><b>So sánh hai quy mô:</b> tải thưa 2 640 giờ/năm trả theo giờ (264 đô la) rẻ hơn đặt trước (500 đô
      la); chạy đủ cả năm 8 760 giờ thì đặt trước tiết kiệm 376 đô la/máy, và kết hợp co giãn 2–6 máy giảm 38,9% giờ máy hằng
      ngày.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Điều cần mang theo, trên đám mây kiến trúc chính là hoá đơn, mỗi quyết định thiết kế đều có một con số tiền đi kèm.
      Ở hai mức quy mô, tải thưa 2 640 giờ nên trả theo giờ cho rẻ. Chạy đều cả năm 8 760 giờ thì mua gói đặt trước tiết kiệm
      lớn, kết hợp co giãn từng ngày. Khi lưu lượng rất thưa theo từng đợt ngắn, mô hình hàm theo sự kiện sẽ triệt tiêu nốt
      phần máy ngồi chờ.
  - clear: true
    show: '<p class="note">Bài sau (bài 6): <b>hàm theo sự kiện</b> — khởi động lạnh, giới hạn và mô hình chi phí.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 6, ta học hàm theo sự kiện, với khởi động lạnh, giới hạn, và mô hình chi phí. Hẹn gặp bạn ở bài tiếp
      theo. Bài tiếp theo đi sâu vào chi phí tính tiền mi-li giây và hiện tượng khởi động lạnh của hàm sự kiện.
