  steps:
  - show: <table class='t'><tr><th>Thực hành CLC:L05</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Tính điểm hoà vốn giữa trả theo giờ và đặt trước</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>hourly=0.15 reserved=840</code></td></tr><tr><td><b>Chấm
      bài</b></td><td><code>bash labs/cham.sh CLC L05 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 5 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Từ đơn giá trả theo giờ và giá gói đặt trước cả năm, chia
      để tìm số giờ hoà vốn cần bật máy liên tục. Chia tiếp cho tám nghìn bảy trăm sáu mươi giờ trong năm rồi tính số tiền
      đô la tiết kiệm nếu chạy trọn cả năm.
    clear: true
