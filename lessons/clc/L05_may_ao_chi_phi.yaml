    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai CLC:L05</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (chia lấy giờ hòa vốn)</b></td><td>Chia chi phí trả trước gói năm cho đơn giá thuê theo giờ</td></tr><tr><td><b>Bước
      2 (tỉ lệ trên năm)</b></td><td>Chia số giờ hòa vốn cho tám nghìn bảy trăm sáu mươi giờ cả năm</td></tr><tr><td><b>Bước
      3 (tiền tiết kiệm năm)</b></td><td>Lấy chi phí chạy theo giờ trọn năm trừ đi gói trả trước</td></tr></table>
    say: Gợi ý cài đặt bài số 5 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 3 dòng khớp định dạng. In đủ ba dòng gồm số giờ hoà vốn
      làm tròn nguyên, phần trăm thời gian năm làm tròn một chữ số kèm ký hiệu phần trăm và số tiền tiết kiệm cả năm.
