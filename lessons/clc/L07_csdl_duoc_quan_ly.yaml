    say: Hình vẽ trục thời gian quanh một sự cố lúc 15 giờ 23. Mỗi vạch xanh là một lần nhật ký giao dịch được đẩy ra nơi
      an toàn, cứ 5 phút một lần. Dữ liệu ghi sau vạch cuối, đoạn đỏ, chưa kịp đẩy nên có thể mất, và đoạn này không bao giờ
      dài quá 5 phút. Giống thuê xưởng bảo dưỡng định kỳ thay dầu phanh tự động nhưng chủ xe vẫn phải thử đường tránh trước
      ngày bão lớn.
- id: example
  kind: example
  title: Hai cấu hình sao lưu
  checks:
  - alg.worst_data_loss_minutes(24 * 60, 5) == 5 and alg.worst_data_loss_minutes(24 * 60) == 1440 and round(500e9 / 200e6
    / 60, 1) == 41.7
  steps:
  - show: '<p><b>Bước 1</b> — chỉ chụp nhanh mỗi ngày: sự cố xảy ra ngay trước lần chụp kế tiếp thì mất cả ngày, tức tới <b>24
      giờ</b> dữ liệu.</p>

      '
    say: Bước một, nếu chỉ chụp nhanh mỗi ngày, sự cố xảy ra ngay trước lần chụp kế tiếp sẽ làm mất cả ngày, tức tới 24 giờ
      dữ liệu.
  - show: '<p><b>Bước 2</b> — thêm đẩy nhật ký mỗi 5 phút: mất tối đa $\hl{5}$ phút, và chọn được thời điểm quay về, ví dụ
      15 giờ 06, ngay trước một lệnh xoá nhầm.</p>

      '
    say: Bước hai, thêm đẩy nhật ký mỗi 5 phút thì mất tối đa 5 phút, và còn chọn được thời điểm quay về, ví dụ 15 giờ 06,
      ngay trước một lệnh xoá nhầm.
  - clear: true
    show: '<table class="t"><tr><th>thời gian khôi phục</th><th>phép tính</th><th>kết quả</th></tr>

      <tr><td>dựng 500 GB từ bản chụp ở 200 MB/s (số minh hoạ)</td><td>$\frac{500\,000}{200}$</td><td>2500 s ≈ 41,7 phút</td></tr>

      <tr><td>phát lại nhật ký</td><td>từ lúc chụp tới 15 giờ 06</td><td>cộng thêm</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Bước ba, tính thời gian khôi phục. Dựng cơ sở dữ liệu 500 GB từ bản chụp ở tốc độ minh hoạ 200 MB mỗi giây mất 2500
      giây, khoảng 41 phẩy 7 phút. Sau đó còn phải phát lại nhật ký từ lúc chụp tới 15 giờ 06, nên tổng còn dài hơn.
  - show: '<p><b>Bước 4 — đối chiếu mục tiêu:</b> mục tiêu “chạy lại trong 15 phút” thì khôi phục từ sao lưu <b>không đạt</b>;
      cần bản sao chờ lên thay. Sao lưu lo việc <b>quay về đúng thời điểm</b>, bản sao lo việc <b>chạy lại nhanh</b>.</p>

      '
    say: Bước bốn, đối chiếu mục tiêu, nếu cần chạy lại trong 15 phút thì khôi phục từ sao lưu không đạt, phải có bản sao
      chờ lên thay. Sao lưu lo việc quay về đúng thời điểm, còn bản sao lo việc chạy lại nhanh, hai thứ bổ sung cho nhau.
- id: check
  kind: check
  title: 'Tự kiểm: đổi tốc độ ra GB mỗi phút'
  checks:
  - 200e6 * 60 / 1e9 == 12 and round(500 / 12, 1) == 41.7
  steps:
  - show: '<table class="t"><tr><th>cách khác</th><th>phép tính</th><th>kết quả</th></tr>

      <tr><td>đổi tốc độ</td><td>200 MB/s nhân 60 giây</td><td>12 000 MB = 12 GB mỗi phút</td></tr>

      <tr><td>chia thẳng theo phút</td><td>$\frac{500}{12}$</td><td>≈ 41,7 phút ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    say: Kiểm bằng đường khác, đổi tốc độ ra GB mỗi phút trước khi chia, vì một phút có 60 giây. 200 MB mỗi giây nhân 60 giây
      bằng 12 nghìn MB, tức 12 GB mỗi phút. 500 GB chia 12 GB mỗi phút được khoảng 41 phẩy 7 phút, khớp kết quả.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Coi bản sao là bản sao lưu <b class="red">(lệnh xoá được sao chép ngay)</b>

      <br><span class="note">Bản sao chống hỏng máy, không chống sai dữ liệu. Ở quy mô nhỏ 5 GB chỉ mất ~25 giây khôi phục;
      nhưng lên 500 GB (~41,7 phút ở 200 MB/s), nếu mục tiêu chạy lại là 15 phút thì cần cả hai: bản sao chờ cho thời gian
      khôi phục ngắn, chụp nhanh + nhật ký cho quay về thời điểm.</span></div>

      '
    say: Lỗi thứ nhất, coi bản sao là bản sao lưu, trong khi lệnh xoá được sao chép sang ngay. Bản sao chống hỏng máy, không
      chống sai dữ liệu. Cần cả hai, bản sao chờ cho thời gian khôi phục ngắn, và chụp nhanh cộng nhật ký để quay về một
      thời điểm. Cắm đầu viết nhầm lệnh xoá sạch bảng nhưng quên rằng thao tác sai cũng được chép ngay lập tức sang bản
      sao dự phòng.
  - show: ''
    say: Khôi phục theo thời điểm về đúng một giây trước lúc gõ nhầm mới là chiếc phao cứu sinh thật sự trước lỗi con người.
      Thiết lập cửa sổ khôi phục theo từng giây ngăn thiệt hại nặng do nhầm lẫn xoá bảng ngay trong giờ làm việc. Chỉ lưu
      mỗi bản chụp cuối ngày mà không bật nhật ký giao dịch điểm thời gian làm mất sạch hai mươi bốn giờ đơn hàng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Chưa bao giờ thử khôi phục <b class="red">(sao lưu hỏng mà không biết)</b>

      <br><span class="note">Khôi phục định kỳ ra một cơ sở dữ liệu thử, đếm dòng, chạy truy vấn kiểm tra, ghi lại thời gian
      thật — đó mới là thời gian khôi phục bạn có.</span></div>

      '
    say: Lỗi thứ hai, chưa bao giờ thử khôi phục, nên bản sao lưu hỏng mà không biết. Hãy khôi phục định kỳ ra một cơ sở dữ
      liệu thử, đếm dòng, chạy truy vấn kiểm tra, và ghi lại thời gian thật, vì đó mới là thời gian khôi phục bạn có.
  - show: ''
    say: Chưa từng chạy diễn tập phục hồi thật từ bản sao lưu khiến lúc gặp hoạ mới phát hiện bản lưu bị lỗi hoặc mất thời
      gian quá lâu. Thực hành khôi phục định kỳ từ bản chụp trên môi trường tách biệt đo chính xác tốc độ phục hồi thực
      tế. Chưa từng đo tốc độ khôi phục từ bản sao lưu thật dẫn tới mục tiêu thời gian khôi phục chỉ đẹp trên giấy tờ.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Bản sao lưu cùng tài khoản, cùng quyền <b class="red">(kẻ xấu xoá luôn sao
      lưu)</b>

      <br><span class="note">Mã độc tống tiền có quyền quản trị là xoá được cả bản sao lưu. Sao chép bản sao lưu sang tài
      khoản khác, khoá chống xoá có thời hạn.</span></div>

      '
    say: Lỗi thứ ba, để bản sao lưu cùng tài khoản và cùng quyền, nên kẻ xấu xoá luôn sao lưu. Mã độc tống tiền có quyền quản
      trị là xoá được cả bản sao lưu. Hãy sao chép bản sao lưu sang tài khoản khác, và khoá chống xoá có thời hạn.
  - show: ''
    say: Dồn quá nhiều truy vấn đọc báo cáo nặng vào máy chính thay vì đẩy sang các bản sao đọc làm chậm giao dịch mua hàng.
      Tách luồng đọc báo cáo sang các bản sao độc lập bảo vệ toàn vẹn hiệu năng phục vụ giao dịch chính. Ép luồng báo cáo
      nặng chạy thẳng lên máy chủ ghi chính đẩy độ trễ giao dịch khách hàng tăng vọt.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - alg.worst_data_loss_minutes(360, 1) == 1 and alg.worst_data_loss_minutes(360) == 360 and round(200e9 / 100e6 / 60, 1)
    == 33.3
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Chụp nhanh mỗi 6 giờ, đẩy nhật ký mỗi 1 phút. Mất tối đa bao nhiêu dữ liệu? Nếu tắt đẩy nhật ký?</td></tr>

      <tr><td>2</td><td>Cơ sở dữ liệu 200 GB, khôi phục ở 100 MB/s. Riêng dựng từ bản chụp mất bao lâu? Mục tiêu 15 phút có
      đạt không?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, chụp nhanh mỗi 6 giờ, đẩy nhật ký mỗi 1 phút. Mất tối đa bao nhiêu dữ liệu,
      và nếu tắt đẩy nhật ký thì sao? Câu hai, cơ sở dữ liệu 200 GB, khôi phục ở 100 MB mỗi giây. Riêng việc dựng từ bản chụp
      mất bao lâu, và mục tiêu 15 phút có đạt không? Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① Có đẩy nhật ký: mất tối đa khoảng giữa hai lần đẩy = <b>1 phút</b>. Tắt đẩy nhật ký: chỉ còn bản chụp, mất
      tới <b>6 giờ</b>.</p>

      '
    say: Đáp án câu một, có đẩy nhật ký thì mất tối đa bằng khoảng giữa hai lần đẩy, tức 1 phút. Tắt đẩy nhật ký thì chỉ còn
      bản chụp, có thể mất tới 6 giờ. Phân biệt rõ độ trễ bản sao ảnh hưởng tới mất dữ liệu còn tốc độ dựng lại ảnh hưởng
      tới thời gian chờ phục hồi.
  - show: '<p>② 200 GB $= 200\,000$ MB → $\frac{200\,000}{100} = 2000$ s ≈ $\hl{33{,}3}$ phút &gt; 15 → <b>không đạt</b>.
      Cần bản sao chờ sẵn (chuyển trong vài phút) — khôi phục từ sao lưu là lưới an toàn cuối.</p>

      '
    say: Câu hai, 200 GB bằng 200 nghìn MB, chia 100 được 2000 giây, khoảng 33 phẩy 3 phút, lớn hơn 15 nên không đạt. Cần
      một bản sao chờ sẵn để chuyển trong vài phút, còn khôi phục từ sao lưu là lưới an toàn cuối cùng.
