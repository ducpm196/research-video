- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">bản sao: chống hỏng máy, thời gian khôi phục ngắn</span><span class="a">→</span>

      <span class="n">chụp nhanh + nhật ký: quay về một thời điểm</span><span class="a">→</span>

      <span class="n">mất tối đa = khoảng đẩy nhật ký</span><span class="a">→</span>

      <span class="n">thử khôi phục định kỳ; sao lưu tách quyền</span></div>

      '
    say: Tổng kết lại, bản sao chống hỏng máy và cho thời gian khôi phục ngắn, còn chụp nhanh cộng nhật ký cho quay về một
      thời điểm. Lượng dữ liệu mất tối đa bằng khoảng đẩy nhật ký, và hãy thử khôi phục định kỳ, sao lưu tách quyền. Ghi trước
      nhật ký thay đổi và ảnh chụp định kỳ giúp rút ngắn thời gian khôi phục xuống vài phút. Diễn tập phục hồi định kỳ trên
      bản sao dữ liệu thực tế đo chính xác thời gian khởi động lại và phát hiện sớm tệp sao lưu hỏng ngầm. Dịch vụ quản lý
      giải phóng đội kỹ sư khỏi công việc lặt vặt lặp lại để tập trung tối ưu dữ liệu nghiệp vụ. Cân bằng chỉ tiêu thời gian
      dừng và giới hạn mất dữ liệu định hướng mọi lựa chọn kiến trúc sao lưu tin cậy.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
  - show: '<div class="chain"><span class="n">bản sao: chống hỏng máy, thời gian khôi phục ngắn</span><span class="a">→</span>

      <span class="n">chụp nhanh + nhật ký: quay về một thời điểm</span><span class="a">→</span>

      <span class="n">mất tối đa = khoảng đẩy nhật ký</span><span class="a">→</span>

      <span class="n">thử khôi phục định kỳ; sao lưu tách quyền</span></div>

      '
    say: Trong kiến trúc cơ sở dữ liệu được quản lý, tách riêng mục tiêu thời gian khôi phục khỏi mục tiêu mất dữ liệu tối
      đa giúp chọn đúng gói dự phòng. Việc chạy thử quy trình khôi phục từ bản sao lưu định kỳ biến cam kết phục hồi trên
      giấy thành năng lực thực sự đo được trên cụm máy thật. Mỗi lần diễn tập khôi phục đều giúp kiểm chứng cả tốc độ tải
      dữ liệu lẫn kịch bản chuyển hướng kết nối. Luôn bảo vệ dữ liệu trước lỗi thao tác bằng cơ chế tua lùi theo thời điểm
      và diễn tập định kỳ hằng quý.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.3'
  - show: '<div class="box key"><b>Tư duy:</b> bản sao lưu chưa từng khôi phục thử <b>chưa phải</b> bản sao lưu — chỉ là hy
      vọng.</div>

      <p class="note"><b>So sánh hai quy mô:</b> cơ sở dữ liệu nhỏ 5 GB dựng lại trong ~25 giây; ở quy mô 500 GB (tốc độ 200
      MB/s mất ~41,7 phút), không đạt mục tiêu chạy lại 15 phút nếu thiếu bản sao chờ, còn mất dữ liệu tối đa giảm 288 lần
      (24 giờ → 5 phút) nhờ đẩy nhật ký.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Điều cần mang theo, bản sao lưu chưa từng được khôi phục thử thì chưa phải là bản sao lưu, mà chỉ là hy vọng. Xét
      hai mức quy mô, kho 5 GB dựng lại từ sao lưu chỉ mất 25 giây. Kho 500 GB dựng hết gần 42 phút nên bắt buộc có bản chờ
      sẵn và đẩy nhật ký từng 5 phút. Kiểm soát chặt các bản sao dọc vùng đặt nền móng vững chắc cho bài toán quản lý chi
      phí toàn hệ kế tiếp.
  - clear: true
    show: '<p class="note">Bài sau (bài 8): <b>chi phí đám mây</b> — dữ liệu ra ngoài, gắn nhãn, chi phí trên một đơn vị.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 8, ta học chi phí đám mây, với dữ liệu ra ngoài, gắn nhãn, và chi phí trên một đơn vị. Hẹn gặp bạn
      ở bài tiếp theo. Bước kế tiếp vạch trần những khoản phụ phí ngầm đắt đỏ như cước truyền dữ liệu ra ngoài ít ai để ý
      ban đầu.
