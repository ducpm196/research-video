      nguyên RPO snapshot cho RPO dùng nhật ký WAL</td></tr></table>
    say: Gợi ý cài đặt bài số 7 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
