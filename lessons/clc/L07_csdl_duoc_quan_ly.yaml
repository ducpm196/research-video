scenes:
- id: hook
  kind: hook
  title: Lệnh xoá lúc 15 giờ 07
  steps:
  - show: '<p>15 giờ 07, một kỹ sư chạy lệnh xoá trên nhầm cơ sở dữ liệu thật. Cơ sở dữ liệu có bản sao ở vùng sẵn sàng khác
      — và bản sao cũng xoá theo ngay trong một giây. Câu hỏi còn lại: khôi phục về <b>15 giờ 06</b> được không, và mất bao
      lâu?</p>

      <div class="box key">Hôm nay: <b>cơ sở dữ liệu được quản lý</b> — bản sao để chịu lỗi, sao lưu để quay ngược thời gian,
      và hai con số mục tiêu.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, lúc 15 giờ 07 phút, một kỹ sư chạy lệnh xoá trên nhầm cơ sở dữ liệu thật. Cơ sở dữ liệu có bản sao ở vùng
      sẵn sàng khác, và bản sao cũng xoá theo ngay trong một giây. Câu hỏi còn lại là khôi phục về 15 giờ 06 phút được không,
      và mất bao lâu? Hôm nay ta học cơ sở dữ liệu được quản lý, với bản sao để chịu lỗi, sao lưu để quay ngược thời gian,
      và hai con số mục tiêu. Tự cài đặt sao lưu, vá lỗi nhân và đồng bộ bản sao cơ sở dữ liệu phân tán tiêu tốn trọn công
      sức một đội ngũ riêng. Dịch vụ được quản lý gánh trọn phần vận hành nặng nề trong khi vẫn buộc bạn chủ động đặt đúng
      mục tiêu mất mát và khôi phục.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: thời gian bằng khối lượng chia tốc độ'
  checks:
  - 500e9 / 1e6 == 500000 and 500000 / 200 == 2500 and round(2500 / 60, 1) == 41.7
  steps:
  - show: '<p>Chép 500 GB ở tốc độ 200 MB mỗi giây mất bao lâu? Trước hết đổi cùng đơn vị: với MB $= 10^6$ byte và GB $= 10^9$
      byte, 500 GB $= 500\,000$ MB.</p>

      '
    say: Trước hết, một bài toán quen thuộc, chép 500 GB ở tốc độ 200 MB mỗi giây mất bao lâu. Đổi cùng đơn vị, với MB bằng
      10 mũ 6 byte và GB bằng 10 mũ 9 byte, 500 GB bằng 500 nghìn MB. Mục tiêu điểm khôi phục đo khoảng dữ liệu tối đa chấp
      nhận bị mất lùi lại khi xảy ra thảm hoạ.
  - show: '$$\text{thời gian} = \frac{\text{khối lượng}}{\text{tốc độ}} = \frac{500\,000}{200} = 2500 \text{ giây} \approx
      41{,}7 \text{ phút}$$

      '
    say: Thời gian bằng khối lượng chia tốc độ, 500 nghìn chia 200, bằng 2500 giây, chia 60 được khoảng 41 phẩy 7 phút. Mục
      tiêu thời gian khôi phục đặt trần thời lượng hệ thống được phép ngừng chạy trước lúc hoạt động trở lại bình thường.
- id: sym
  kind: symbol
  title: 'Giải mã: bản sao, sao lưu, hai mục tiêu'
  steps:
  - show: '<table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>

      <tr><td><b>bản sao chờ</b> (vùng sẵn sàng khác)</td><td>nhận mọi thay đổi gần như tức thì; máy chính hỏng thì lên thay
      — chống <b>hỏng máy</b></td></tr>

      <tr><td><b>bản sao đọc</b></td><td>chia tải đọc; có thể trễ vài giây</td></tr>

      <tr><td><b>chụp nhanh + nhật ký</b></td><td>bản chụp định kỳ (toàn bộ dữ liệu tại một lúc), cộng <b>nhật ký giao dịch</b>
      (ghi lần lượt mọi thay đổi: thêm, sửa, xoá) đẩy đi mỗi vài phút; khôi phục = bản chụp rồi làm lại các thay đổi trong
      nhật ký tới thời điểm chọn — chống <b>sai dữ liệu</b>, quay về một thời điểm</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
    - '1.4'
    say: Bảng có ba khái niệm. Bản sao chờ ở vùng sẵn sàng khác nhận mọi thay đổi gần như tức thì, và lên thay khi máy chính
      hỏng, tức chống hỏng máy. Bản sao đọc dùng để chia tải đọc, và có thể trễ vài giây. Chụp nhanh cộng nhật ký là bản chụp
      định kỳ toàn bộ dữ liệu, cộng nhật ký giao dịch được đẩy đi mỗi vài phút. Nhật ký giao dịch ghi lần lượt mọi thay đổi
      như thêm, sửa, xoá, nên khôi phục là lấy bản chụp rồi làm lại các thay đổi tới thời điểm ta chọn. Cách này dùng để chống
      sai dữ liệu và quay về một thời điểm. Lưu liên tục bản chụp hằng ngày kết hợp nhật ký giao dịch mở ra năng lực tua ngược
      khôi phục tới từng giây.
  - clear: true
    show: '<table class="t"><tr><th>mục tiêu</th><th>nghĩa</th></tr>

      <tr><td><b>điểm khôi phục mục tiêu</b> (RPO)</td><td>tối đa mất bao nhiêu phút dữ liệu</td></tr>

      <tr><td><b>thời gian khôi phục mục tiêu</b> (RTO)</td><td>tối đa bao lâu thì chạy lại</td></tr></table>

      <p class="note"><b>Ảnh chụp nhanh và nhật ký ghi trước:</b> bản sao toàn bộ ổ đĩa tại một mốc là ảnh chụp (<b>snapshot</b>);
      nhật ký ghi mọi thay đổi liên tục giữa các lần chụp là <b>WAL</b> (Write-Ahead Log).</p>

      '
    focus:
    - '1.2'
    - '1.3'
    - 2
    - 2
    say: Điểm khôi phục mục tiêu là tối đa mất bao nhiêu phút dữ liệu. Thời gian khôi phục mục tiêu là tối đa bao lâu thì
      hệ chạy lại. Bản sao định kỳ toàn bộ đĩa là ảnh chụp nhanh, còn nhật ký ghi liên tiếp từng thay đổi giúp khôi phục theo
      từng giây gọi là nhật ký ghi trước. Chuyển đổi sang bản sao dự phòng tự động hạ thời gian chết xuống chỉ còn vài chục
      giây mất kết nối ngắn.
