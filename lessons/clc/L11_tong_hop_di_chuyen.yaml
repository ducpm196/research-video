      x="965" y="110" text-anchor="middle">+2 máy giờ cao điểm</text><rect x="600" y="150" width="230" height="62" rx="8"
      fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="715" y="190" text-anchor="middle">được quản lý</text><rect
