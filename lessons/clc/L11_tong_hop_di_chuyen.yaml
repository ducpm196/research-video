scenes:
- id: hook
  kind: hook
  title: Lên mây mà hoá đơn cao hơn tại chỗ
  checks:
  - round(3 * 730 * 0.20) == 438
  steps:
  - show: '<p>Công ty chuyển nguyên hệ thống từ phòng máy lên đám mây. Riêng phần ứng dụng là ba máy ảo cùng cỡ, chạy suốt
      ngày đêm: khoảng <b>438 đô la</b> mỗi tháng — chưa kể máy cơ sở dữ liệu và máy xử lý ảnh, tổng đắt hơn tiền điện và
      khấu hao cũ. Ban giám đốc hỏi: lên mây để làm gì? Câu trả lời nằm ở chỗ chưa dùng tới: co giãn, dịch vụ được quản lý,
      trả theo mức dùng.</p>

      <div class="box key">Hôm nay: <b>tổng hợp</b> — chọn chiến lược di chuyển cho từng thành phần, và rà thiết kế theo <b>sáu
      trụ cột</b>.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, một công ty chuyển nguyên hệ thống từ phòng máy lên đám mây. Riêng phần ứng dụng đã là ba máy ảo cùng cỡ
      chạy suốt ngày đêm, tốn khoảng 438 đô la mỗi tháng. Chưa kể máy cơ sở dữ liệu và máy xử lý ảnh, tổng đã đắt hơn tiền
      điện và khấu hao cũ. Ban giám đốc hỏi chuyển hệ thống lên đám mây để làm gì. Câu trả lời nằm ở những chỗ chưa dùng tới,
      là co giãn, dịch vụ được quản lý, và trả theo mức dùng. Hôm nay ta tổng hợp, chọn chiến lược di chuyển cho từng thành
      phần, và rà thiết kế theo sáu trụ cột. Chuyển cả một hệ thống phức tạp lên đám mây không phải bê nguyên đống máy ảo
      lên mà đòi hỏi tái thiết kế cân bằng theo sáu trụ cột. Áp dụng đồng thời tối ưu vận hành, bảo mật, tin cậy, hiệu năng,
      tiết kiệm và bền vững biến di chuyển thành bước nhảy vọt.
- id: prereq
  kind: prereq
  title: 'Ôn lại: ba công cụ tiết kiệm đã học'
  checks:
  - 8 * 22 == 176 and round(730 * 0.20) == 146
  steps:
  - show: '<table class="t"><tr><th>công cụ</th><th>ý chính</th></tr>

      <tr><td>trả theo giờ, co giãn (bài 5)</td><td>máy chỉ tốn tiền khi bật; máy 0,20 đô la mỗi giờ chạy cả tháng 730 giờ
      hết 146 đô la; <b>co giãn theo nhóm</b>: nhóm máy tự thêm máy khi tải cao, bớt máy khi tải thấp</td></tr>

      <tr><td>hàm theo sự kiện (bài 6)</td><td>chỉ trả cho lần chạy, hợp với tải thưa, theo đợt</td></tr>

      <tr><td>cơ sở dữ liệu được quản lý (bài 7)</td><td>nhà cung cấp lo vá, sao lưu, bản sao chờ</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    say: Trước hết, ôn ba công cụ tiết kiệm đã học. Ở bài 5, trả theo giờ nghĩa là máy chỉ tốn tiền khi bật, máy 0 phẩy 20
      đô la mỗi giờ chạy cả tháng 730 giờ hết 146 đô la. Co giãn theo nhóm nghĩa là nhóm máy tự thêm máy khi tải cao, và bớt
      máy khi tải thấp. Ở bài 6, hàm theo sự kiện chỉ trả cho lần chạy, hợp với tải thưa và theo đợt. Ở bài 7, cơ sở dữ liệu
      được quản lý để nhà cung cấp lo vá, sao lưu và bản sao chờ. Tận dụng dịch vụ quản lý và hàm sự kiện giải phóng nhóm
      kỹ sư khỏi công việc cài đặt bảo trì lặp đi lặp lại.
  - show: '<p>Giờ cao điểm (số minh hoạ): 8 giờ mỗi ngày, 22 ngày làm việc mỗi tháng → $8 \cdot 22 = 176$ giờ.</p>

      '
    say: Với số minh hoạ, giờ cao điểm là 8 giờ mỗi ngày trong 22 ngày làm việc, tức 8 nhân 22, bằng 176 giờ mỗi tháng.
- id: sym
  kind: symbol
  title: 'Giải mã: chiến lược di chuyển và sáu trụ cột'
  steps:
  - show: '<table class="t"><tr><th>chiến lược</th><th>nghĩa</th></tr>

      <tr><td><b>chuyển nguyên</b></td><td>máy cũ thành máy ảo, không sửa mã — nhanh, ít lợi</td></tr>

      <tr><td><b>chuyển có chỉnh</b></td><td>giữ mã, đổi phần nền: cơ sở dữ liệu tự cài → được quản lý</td></tr>

      <tr><td><b>viết lại</b></td><td>tách, dùng hàm theo sự kiện, hàng đợi — lợi nhiều nhất, tốn công nhất</td></tr>

      <tr><td><b>mua thay</b>, <b>giữ lại</b>, <b>bỏ đi</b></td><td>dùng phần mềm như dịch vụ; để lại tại chỗ; tắt hẳn thứ
      không ai dùng</td></tr></table>

      <p><b>Sáu trụ cột</b>: vận hành xuất sắc, an toàn, tin cậy, hiệu năng, tối ưu chi phí, bền vững — mỗi quyết định được
      rà theo cả sáu.</p>

      <p class="note"><b>Nhắc lại ký hiệu kiến trúc:</b> phân tách tối thiểu qua hai vùng sẵn sàng (<b>AZ</b>) để loại bỏ
      điểm hỏng đơn lẻ duy nhất (<b>SPOF</b>, Single Point of Failure); với giả định các vùng hỏng độc lập, độ sẵn sàng song song qua $k$ vùng đạt $1 - (1 - a)^k$.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 3
    - 3
    say: Bảng có các chiến lược di chuyển. Chuyển nguyên biến máy cũ thành máy ảo mà không sửa mã, nhanh nhưng ít lợi. Chuyển
      có chỉnh giữ mã nhưng đổi phần nền, như từ cơ sở dữ liệu tự cài sang dịch vụ được quản lý. Viết lại là tách ra, dùng
      hàm theo sự kiện và hàng đợi, lợi nhiều nhất nhưng tốn công nhất. Mua thay là dùng phần mềm như dịch vụ, giữ lại là
      để tại chỗ, còn bỏ đi là tắt hẳn thứ không ai dùng. Sáu trụ cột là vận hành xuất sắc, an toàn, tin cậy, hiệu năng, tối
      ưu chi phí, và bền vững, mỗi quyết định được rà theo cả sáu. Một hệ kiến trúc tốt luôn tránh điểm hỏng đơn lẻ có thể
      làm sập cả hệ thống nhờ trải ra ít nhất hai vùng sẵn sàng. Rà soát kỹ mọi quyết định di chuyển qua sáu trụ cột kiến
      trúc phát hiện sớm đánh đổi giữa chi phí và độ chịu lỗi.
