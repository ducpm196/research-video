- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">mỗi thành phần một chiến lược</span><span class="a">→</span>

      <span class="n">chuyển nguyên để rời, rồi tối ưu tiếp</span><span class="a">→</span>

      <span class="n">dịch vụ được quản lý, co giãn, trả theo mức dùng</span><span class="a">→</span>

      <span class="n">rà theo sáu trụ cột, di chuyển theo đợt</span></div>

      '
    say: Tổng kết lại, mỗi thành phần một chiến lược, chuyển nguyên để rời phòng máy rồi tối ưu tiếp, với dịch vụ được quản
      lý, co giãn, và trả theo mức dùng. Rà mọi quyết định theo sáu trụ cột, và di chuyển theo từng đợt. Dùng cơ sở dữ liệu
      được quản lý và bỏ trạng thái cục bộ trên máy ứng dụng giúp loại bỏ điểm hỏng đơn. Đưa ứng dụng lên đám mây thành công
      đòi hỏi đồng bộ hoá kiến trúc đám mây gốc thay vì sao chép nguyên bản cũ. Ứng dụng trưởng thành trên đám mây biết tự
      động điều chỉnh dung lượng, tự sửa lỗi và minh bạch chi phí từng xu.
  - show: '<div class="box key"><b>Tư duy:</b> đám mây không làm hệ thống tốt hơn — <b>thiết kế cho đám mây</b> mới làm.</div>

      <p class="note"><b>So sánh hai quy mô:</b> với 1 máy đơn lẻ chưa thấy rõ, nhưng ở cụm 3 máy (438 đô la/tháng giảm 50,6%
      xuống 216,4 đô la nhờ 1 máy nền + 2 máy giờ cao điểm) hay 30 máy, kết hợp co giãn và rà cả 6 trụ cột mới vừa bền vừa
      tiết kiệm.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    say: Điều cần mang theo, đám mây không tự làm hệ thống tốt hơn, chỉ thiết kế cho đám mây mới làm được điều đó. Ở hai mức
      quy mô, trên 1 máy đơn chưa thấy khác nhiều. Trên cụm 3 máy thật, giữ 1 máy nền và bật thêm 2 máy giờ cao điểm cắt giảm
      tới 50 phẩy 6 phần trăm tiền. Tối ưu theo sáu trụ cột giúp doanh nghiệp đồng thời giảm tới nửa hoá đơn và nâng độ ổn
      định vượt bậc.
  - clear: true
    forward_ref: true
    show: '<p class="note">Bạn đã đi qua định nghĩa và trách nhiệm, vùng sẵn sàng, mạng ảo, quyền truy cập, lưu trữ, máy ảo,
      hàm, chi phí, mã hoá, khôi phục thảm hoạ và di chuyển.</p>

      <p class="note">Bài 12 là <b>tình huống chuyên gia theo dòng thời gian</b>: kho lưu trữ đối tượng từ 2006 tới 2022 —
      lớn lên tới hàng trăm nghìn tỉ đối tượng mà vẫn ổn định.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Bạn đã đi qua định nghĩa và trách nhiệm, vùng sẵn sàng, mạng ảo, quyền truy cập, lưu trữ, máy ảo, hàm, chi phí, mã
      hoá, khôi phục thảm hoạ và di chuyển. Bài 12 là tình huống chuyên gia theo dòng thời gian. Ta theo một kho lưu trữ đối
      tượng từ năm 2006 tới 2022, lớn lên tới hàng trăm nghìn tỉ đối tượng mà vẫn ổn định. Cảm ơn bạn đã theo học. Chúc mừng
      bạn nắm trọn bản thiết kế hạ tầng đám mây vững vàng sẵn sàng giải quyết các bài toán thực tế lớn.
