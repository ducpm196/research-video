    say: Mời bạn tự thực hành bài số 11 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Với giả định các vùng sẵn sàng hỏng độc lập, tính độ sẵn
      sàng tầng dữ liệu đa vùng từ xác suất một vùng và số vùng đặt dữ liệu. In khoảng số máy ứng dụng tối thiểu tối đa, cờ
      xác nhận xoá điểm hỏng đơn lẻ và số lượng sáu trụ cột kiến trúc.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
  - show: <table class='t'><tr><th>Gợi ý triển khai CLC:L11</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (độ sẵn sàng DB)</b></td><td>Lấy một trừ xác suất một vùng hỏng lũy thừa số vùng DB rồi nhân trăm</td></tr><tr><td><b>Bước
      2 (kiểm xóa SPOF)</b></td><td>Yêu cầu tầng DB đặt ít nhất hai vùng và ứng dụng chạy tối thiểu hai máy</td></tr><tr><td><b>Bước
      3 (xuất biên & trụ cột)</b></td><td>In khoảng min max bản sao và đủ sáu trụ cột kiến trúc tốt</td></tr></table>
    say: Gợi ý cài đặt bài số 11 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 4 dòng khớp định dạng. In đủ bốn dòng gồm phần trăm sẵn
      sàng đa vùng làm tròn sáu chữ số thập phân, biên tối thiểu tối đa, cờ xoá điểm hỏng đơn và cố định sáu trụ cột.
