title: "Bài 11 — Tổng hợp: đưa một ứng dụng lên đám mây theo các trụ cột kiến trúc tốt"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/clc.yaml L11; audit/clc/verify_clc.py L11; AWS Well-Architected Framework — sáu trụ cột (bản hiện hành, tên chỉ trên màn hình); S. Orban, “6 Strategies for Migrating Applications to the Cloud” (2016) và bản mở rộng 7 chiến lược; bài 0–10"
assumes: [arith, frac, cdot]
# Quy ước: đơn giá 0,20 đô la mỗi giờ mỗi máy, 730 giờ mỗi tháng, giờ cao điểm 8 giờ × 22 ngày = 176 giờ là SỐ MINH HOẠ. Chiến lược di chuyển gọi bằng
#   tên tiếng Việt: giữ lại, bỏ đi, chuyển nguyên, chuyển có chỉnh, mua thay, viết lại.
objectives:
  - "Chọn chiến lược di chuyển cho từng thành phần"
  - "Rà thiết kế theo sáu trụ cột"
  - "Thấy vì sao chuyển nguyên trạng thường đắt"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Lên mây mà hoá đơn cao hơn tại chỗ"
    checks:
      - "round(3 * 730 * 0.20) == 438"
    steps:
      - show: |
          <p>Công ty chuyển nguyên hệ thống từ phòng máy lên đám mây. Riêng phần ứng dụng là ba máy ảo cùng cỡ, chạy suốt ngày đêm: khoảng <b>438 đô la</b> mỗi tháng — chưa kể máy cơ sở dữ liệu và máy xử lý ảnh, tổng đắt hơn tiền điện và khấu hao cũ. Ban giám đốc hỏi: lên mây để làm gì? Câu trả lời nằm ở chỗ chưa dùng tới: co giãn, dịch vụ được quản lý, trả theo mức dùng.</p>
          <div class="box key">Hôm nay: <b>tổng hợp</b> — chọn chiến lược di chuyển cho từng thành phần, và rà thiết kế theo <b>sáu trụ cột</b>.</div>
        focus: [1, 1, 1, 1, 1, 2]
        say: "Chào bạn, một công ty chuyển nguyên hệ thống từ phòng máy lên đám mây. Riêng phần ứng dụng đã là ba máy ảo cùng cỡ chạy suốt ngày đêm, tốn khoảng 438 đô la mỗi tháng. Chưa kể máy cơ sở dữ liệu và máy xử lý ảnh, tổng đã đắt hơn tiền điện và khấu hao cũ. Ban giám đốc hỏi chuyển hệ thống lên đám mây để làm gì. Câu trả lời nằm ở những chỗ chưa dùng tới, là co giãn, dịch vụ được quản lý, và trả theo mức dùng. Hôm nay ta tổng hợp, chọn chiến lược di chuyển cho từng thành phần, và rà thiết kế theo sáu trụ cột."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: ba công cụ tiết kiệm đã học"
    checks:
      - "8 * 22 == 176 and round(730 * 0.20) == 146"
    steps:
      - show: |
          <table class="t"><tr><th>công cụ</th><th>ý chính</th></tr>
          <tr><td>trả theo giờ, co giãn (bài 5)</td><td>máy chỉ tốn tiền khi bật; máy 0,20 đô la mỗi giờ chạy cả tháng 730 giờ hết 146 đô la; <b>co giãn theo nhóm</b>: nhóm máy tự thêm máy khi tải cao, bớt máy khi tải thấp</td></tr>
          <tr><td>hàm theo sự kiện (bài 6)</td><td>chỉ trả cho lần chạy, hợp với tải thưa, theo đợt</td></tr>
          <tr><td>cơ sở dữ liệu được quản lý (bài 7)</td><td>nhà cung cấp lo vá, sao lưu, bản sao chờ</td></tr></table>
        focus: [1, "1.2", "1.2", "1.3", "1.4"]
        say: "Trước hết, ôn ba công cụ tiết kiệm đã học. Ở bài 5, trả theo giờ nghĩa là máy chỉ tốn tiền khi bật, máy 0 phẩy 20 đô la mỗi giờ chạy cả tháng 730 giờ hết 146 đô la. Co giãn theo nhóm nghĩa là nhóm máy tự thêm máy khi tải cao, và bớt máy khi tải thấp. Ở bài 6, hàm theo sự kiện chỉ trả cho lần chạy, hợp với tải thưa và theo đợt. Ở bài 7, cơ sở dữ liệu được quản lý để nhà cung cấp lo vá, sao lưu và bản sao chờ."
      - show: |
          <p>Giờ cao điểm (số minh hoạ): 8 giờ mỗi ngày, 22 ngày làm việc mỗi tháng → $8 \cdot 22 = 176$ giờ.</p>
        say: "Với số minh hoạ, giờ cao điểm là 8 giờ mỗi ngày trong 22 ngày làm việc, tức 8 nhân 22, bằng 176 giờ mỗi tháng."

  - id: sym
    kind: symbol
    title: "Giải mã: chiến lược di chuyển và sáu trụ cột"
    steps:
      - show: |
          <table class="t"><tr><th>chiến lược</th><th>nghĩa</th></tr>
          <tr><td><b>chuyển nguyên</b></td><td>máy cũ thành máy ảo, không sửa mã — nhanh, ít lợi</td></tr>
          <tr><td><b>chuyển có chỉnh</b></td><td>giữ mã, đổi phần nền: cơ sở dữ liệu tự cài → được quản lý</td></tr>
          <tr><td><b>viết lại</b></td><td>tách, dùng hàm theo sự kiện, hàng đợi — lợi nhiều nhất, tốn công nhất</td></tr>
          <tr><td><b>mua thay</b>, <b>giữ lại</b>, <b>bỏ đi</b></td><td>dùng phần mềm như dịch vụ; để lại tại chỗ; tắt hẳn thứ không ai dùng</td></tr></table>
          <p><b>Sáu trụ cột</b>: vận hành xuất sắc, an toàn, tin cậy, hiệu năng, tối ưu chi phí, bền vững — mỗi quyết định được rà theo cả sáu.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2]
        say: "Bảng có các chiến lược di chuyển. Chuyển nguyên biến máy cũ thành máy ảo mà không sửa mã, nhanh nhưng ít lợi. Chuyển có chỉnh giữ mã nhưng đổi phần nền, như từ cơ sở dữ liệu tự cài sang dịch vụ được quản lý. Viết lại là tách ra, dùng hàm theo sự kiện và hàng đợi, lợi nhiều nhất nhưng tốn công nhất. Mua thay là dùng phần mềm như dịch vụ, giữ lại là để tại chỗ, còn bỏ đi là tắt hẳn thứ không ai dùng. Sáu trụ cột là vận hành xuất sắc, an toàn, tin cậy, hiệu năng, tối ưu chi phí, và bền vững, mỗi quyết định được rà theo cả sáu."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Từ máy chạy suốt thành ba cách chạy khác nhau"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><defs><marker id="arC11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><g font-size="21" fill="#1f2937"><text x="160" y="40" text-anchor="middle" font-weight="bold">trước: mọi máy chạy suốt</text><rect x="45" y="70" width="230" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="160" y="110" text-anchor="middle">3 máy ứng dụng</text><rect x="45" y="150" width="230" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="160" y="190" text-anchor="middle">cơ sở dữ liệu tự cài</text><rect x="45" y="230" width="230" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="160" y="270" text-anchor="middle">xử lý ảnh</text><line x1="320" y1="170" x2="560" y2="170" stroke="#1f2937" stroke-width="4" marker-end="url(#arC11)"/><text x="1000" y="40" text-anchor="middle" font-weight="bold">sau: mỗi phần một chiến lược</text><rect x="600" y="70" width="230" height="62" rx="8" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="715" y="110" text-anchor="middle">máy nền</text><rect x="850" y="70" width="230" height="62" rx="8" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="965" y="110" text-anchor="middle">+2 máy giờ cao điểm</text><rect x="600" y="150" width="230" height="62" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="715" y="190" text-anchor="middle">được quản lý</text><rect x="600" y="230" width="230" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="715" y="270" text-anchor="middle">hàm theo sự kiện</text><text x="1110" y="190" font-size="20">chuyển có chỉnh</text><text x="1110" y="270" font-size="20">viết lại</text><text x="1110" y="160" font-size="20">co giãn theo nhóm</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình so trước và sau khi di chuyển. Trước, ba máy ứng dụng, máy cơ sở dữ liệu và máy xử lý ảnh đều chạy suốt ngày đêm, dù tải lên xuống. Sau, mỗi thành phần chọn cách chạy hợp với nó, máy ứng dụng co giãn theo giờ, cơ sở dữ liệu thành dịch vụ được quản lý, còn xử lý ảnh viết lại thành hàm theo sự kiện."

  - id: example
    kind: example
    title: "Ba thành phần, ba chiến lược"
    checks:
      - "round(3 * 730 * 0.20) == 438 and round(730 * 0.20 + 2 * 8 * 22 * 0.20, 1) == 216.4 and round((1 - 216.4 / 438) * 100, 1) == 50.6"
    steps:
      - show: |
          <table class="t"><tr><th>thành phần</th><th>chiến lược</th><th>vì sao</th></tr>
          <tr><td>cơ sở dữ liệu</td><td>chuyển có chỉnh → được quản lý</td><td>vá, sao lưu, bản sao chờ có sẵn (bài 7)</td></tr>
          <tr><td>máy chủ ứng dụng</td><td>chuyển nguyên trước, rồi co giãn theo nhóm</td><td>nhanh; tiết kiệm nhờ co giãn</td></tr>
          <tr><td>xử lý ảnh tải lên</td><td>viết lại thành hàm theo sự kiện</td><td>tải thưa, theo đợt (bài 6)</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước một, chọn chiến lược cho ba thành phần. Cơ sở dữ liệu chuyển có chỉnh sang dịch vụ được quản lý, để có sẵn vá, sao lưu và bản sao chờ. Máy chủ ứng dụng chuyển nguyên trước cho nhanh, rồi co giãn theo nhóm để tiết kiệm. Phần xử lý ảnh tải lên được viết lại thành hàm theo sự kiện, vì tải thưa và theo đợt."
      - clear: true
        show: |
          <p><b>Bước 2 — trước:</b> 3 máy ứng dụng chạy suốt: $3 \cdot 730 \cdot 0{,}20 = 438$ đô la mỗi tháng.</p>
        say: "Bước hai, tính tiền máy chủ ứng dụng trước khi đổi. Ba máy chạy suốt, 3 nhân 730 nhân 0 phẩy 20, bằng 438 đô la mỗi tháng."
      - show: |
          <p><b>Bước 3 — sau:</b> 1 máy nền + 2 máy chỉ bật giờ cao điểm:</p>
          $$730 \cdot 0{,}20 + 2 \cdot 176 \cdot 0{,}20 = 146 + 70{,}4 = \hl{216{,}4} \text{ đô la}$$
        focus: [1, 2]
        say: "Bước ba, sau khi co giãn, giữ 1 máy nền chạy suốt và 2 máy chỉ bật trong 176 giờ cao điểm. Tiền là 730 nhân 0 phẩy 20, bằng 146, cộng 2 nhân 176 nhân 0 phẩy 20, bằng 70 phẩy 4, tổng 216 phẩy 4 đô la."
      - show: |
          <p><b>Bước 4 — so sánh:</b> $1 - \frac{216{,}4}{438} \approx 50{,}6\%$ tiết kiệm trên tiền máy ứng dụng, mà vẫn đủ máy giờ cao điểm.</p>
        say: "Bước bốn, so sánh, 1 trừ 216 phẩy 4 chia 438, được khoảng 50 phẩy 6 phần trăm tiết kiệm trên tiền máy ứng dụng, mà vẫn đủ máy trong giờ cao điểm."

  - id: check
    kind: check
    title: "Tự kiểm: đếm giờ máy thay vì đếm tiền"
    checks:
      - "3 * 730 == 2190 and 730 + 2 * 176 == 1082 and round((1 - 1082 / 2190) * 100, 1) == 50.6"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>giờ máy mỗi tháng</th></tr>
          <tr><td>trước: 3 máy × 730 giờ</td><td>2190</td></tr>
          <tr><td>sau: 730 + 2 × 176</td><td>1082</td></tr>
          <tr><td>giảm</td><td>$1 - \frac{1082}{2190} \approx 50{,}6\%$ ✓</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Kiểm bằng đường khác, đếm giờ máy thay vì đếm tiền, vì mọi máy cùng đơn giá. Trước là 3 nhân 730, bằng 2190 giờ máy. Sau là 730 cộng 2 nhân 176, bằng 1082 giờ máy. Giảm khoảng 50 phẩy 6 phần trăm, khớp phép tính bằng tiền."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Chuyển nguyên trạng rồi dừng ở đó <b class="red">(đắt hơn tại chỗ)</b>
          <br><span class="note">Chuyển nguyên chỉ là bước đầu để rời phòng máy. Lập kế hoạch bước sau: co giãn, dịch vụ được quản lý, tắt thứ thừa — nếu không, lợi ích không bao giờ đến.</span></div>
        say: "Lỗi thứ nhất, chuyển nguyên trạng rồi dừng ở đó, nên đắt hơn tại chỗ. Chuyển nguyên chỉ là bước đầu để rời phòng máy. Hãy lập kế hoạch cho bước sau, gồm co giãn, dịch vụ được quản lý, và tắt thứ thừa, nếu không thì lợi ích không bao giờ đến."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Viết lại mọi thứ cùng lúc <b class="red">(dự án không bao giờ xong)</b>
          <br><span class="note">Chọn thành phần có lợi rõ nhất để viết lại; phần còn lại chuyển nguyên hoặc chuyển có chỉnh. Di chuyển theo đợt, mỗi đợt có cách quay lui.</span></div>
        say: "Lỗi thứ hai, viết lại mọi thứ cùng lúc, nên dự án không bao giờ xong. Hãy chọn thành phần có lợi rõ nhất để viết lại, còn phần khác chuyển nguyên hoặc chuyển có chỉnh. Di chuyển theo từng đợt, và mỗi đợt có cách quay lui."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Rà theo một trụ cột <b class="red">(rẻ mà không an toàn, nhanh mà không tin cậy)</b>
          <br><span class="note">Máy có thể bị thu hồi cho cơ sở dữ liệu thì rẻ nhưng hỏng trụ cột tin cậy; mở cổng cho nhanh thì hỏng trụ cột an toàn. Mỗi quyết định ghi rõ nó được và mất ở trụ cột nào.</span></div>
        say: "Lỗi thứ ba, chỉ rà theo một trụ cột, nên rẻ mà không an toàn, hay nhanh mà không tin cậy. Dùng máy có thể bị thu hồi cho cơ sở dữ liệu thì rẻ, nhưng hỏng trụ cột tin cậy, còn mở cổng cho nhanh thì hỏng trụ cột an toàn. Mỗi quyết định nên ghi rõ nó được và mất ở trụ cột nào."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(2 / 30 * 100) == 7 and round(500 / 0.10 / 8760 * 100) == 57"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hệ thư điện tử nội bộ tự cài trên một máy cũ, không ai muốn bảo trì. Chọn chiến lược nào?</td></tr>
          <tr><td>2</td><td>Ứng dụng tính lương chạy 2 ngày cuối tháng, máy tắt những ngày còn lại. Chọn cách chạy và cách trả tiền nào? Trụ cột nào được lợi?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, hệ thư điện tử nội bộ tự cài trên một máy cũ, và không ai muốn bảo trì. Chọn chiến lược nào? Câu hai, ứng dụng tính lương chỉ chạy 2 ngày cuối tháng, máy tắt những ngày còn lại. Chọn cách chạy và cách trả tiền nào? Và trong sáu trụ cột kiến trúc, trụ cột nào được lợi? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Không ai muốn bảo trì → để người khác bảo trì → <b>mua thay</b>: dùng thư điện tử như dịch vụ — nhà cung cấp lo vá và chống thư rác (vận hành, an toàn).</p>
        say: "Đáp án câu một, không ai muốn bảo trì thì để người khác bảo trì, nên chọn mua thay, dùng thư điện tử như dịch vụ. Nhà cung cấp lo vá và chống thư rác, lợi cho trụ cột vận hành và an toàn."
      - show: |
          <p>② Chạy khoảng 2 trên 30 ngày, tức chừng 7% thời gian — dưới xa điểm hoà vốn ở bài 5 (số giờ chạy mà từ đó đặt trước mới rẻ hơn; với số minh hoạ ở bài đó là khoảng 57% thời gian) → chạy theo lịch, <b>trả theo giờ</b> hoặc xử lý theo lô; <b>không</b> đặt trước — lợi trụ cột <b>chi phí</b> và <b>bền vững</b>.</p>
