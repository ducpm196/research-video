  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (4 dòng)</b></p><div class="code"><div>multi_az_avail=99.999900%</div><div>app_bounds=3,12</div><div>spof_cleared=1</div><div>pillars=6</div></div>
    say: Màn hình hiện 4 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
