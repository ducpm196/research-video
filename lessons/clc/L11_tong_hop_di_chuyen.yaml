    say: Hình so trước và sau khi di chuyển. Trước, ba máy ứng dụng, máy cơ sở dữ liệu và máy xử lý ảnh đều chạy suốt ngày
      đêm, dù tải lên xuống. Sau, mỗi thành phần chọn cách chạy hợp với nó, máy ứng dụng co giãn theo giờ, cơ sở dữ liệu thành
      dịch vụ được quản lý, còn xử lý ảnh viết lại thành hàm theo sự kiện. Thay vì đặt nguyên khối máy phát điện cũ vào tàu
      điện mới, tách từng thành phần gắn khít vào mạng lưới điện có sẵn.
- id: example
  kind: example
  title: Ba thành phần, ba chiến lược
  checks:
  - round(3 * 730 * 0.20) == 438 and round(730 * 0.20 + 2 * 8 * 22 * 0.20, 1) == 216.4 and round((1 - 216.4 / 438) * 100,
    1) == 50.6
  steps:
  - show: '<table class="t"><tr><th>thành phần</th><th>chiến lược</th><th>vì sao</th></tr>

      <tr><td>cơ sở dữ liệu</td><td>chuyển có chỉnh → được quản lý</td><td>vá, sao lưu, bản sao chờ có sẵn (bài 7)</td></tr>

      <tr><td>máy chủ ứng dụng</td><td>chuyển nguyên trước, rồi co giãn theo nhóm</td><td>nhanh; tiết kiệm nhờ co giãn</td></tr>

      <tr><td>xử lý ảnh tải lên</td><td>viết lại thành hàm theo sự kiện</td><td>tải thưa, theo đợt (bài 6)</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Bước một, chọn chiến lược cho ba thành phần. Cơ sở dữ liệu chuyển có chỉnh sang dịch vụ được quản lý, để có sẵn vá,
      sao lưu và bản sao chờ. Máy chủ ứng dụng chuyển nguyên trước cho nhanh, rồi co giãn theo nhóm để tiết kiệm. Phần xử
      lý ảnh tải lên được viết lại thành hàm theo sự kiện, vì tải thưa và theo đợt.
  - clear: true
    show: '<p><b>Bước 2 — trước:</b> 3 máy ứng dụng chạy suốt: $3 \cdot 730 \cdot 0{,}20 = 438$ đô la mỗi tháng.</p>

      '
    say: Bước hai, tính tiền máy chủ ứng dụng trước khi đổi. Ba máy chạy suốt, 3 nhân 730 nhân 0 phẩy 20, bằng 438 đô la mỗi
      tháng.
  - show: '<p><b>Bước 3 — sau:</b> 1 máy nền + 2 máy chỉ bật giờ cao điểm:</p>

      $$730 \cdot 0{,}20 + 2 \cdot 176 \cdot 0{,}20 = 146 + 70{,}4 = \hl{216{,}4} \text{ đô la}$$

      '
    focus:
    - 1
    - 2
    say: Bước ba, sau khi co giãn, giữ 1 máy nền chạy suốt và 2 máy chỉ bật trong 176 giờ cao điểm. Tiền là 730 nhân 0 phẩy
      20, bằng 146, cộng 2 nhân 176 nhân 0 phẩy 20, bằng 70 phẩy 4, tổng 216 phẩy 4 đô la.
  - show: '<p><b>Bước 4 — so sánh:</b> $1 - \frac{216{,}4}{438} \approx 50{,}6\%$ tiết kiệm trên tiền máy ứng dụng, mà vẫn
      đủ máy giờ cao điểm.</p>

      '
    say: Bước bốn, so sánh, 1 trừ 216 phẩy 4 chia 438, được khoảng 50 phẩy 6 phần trăm tiết kiệm trên tiền máy ứng dụng, mà
      vẫn đủ máy trong giờ cao điểm.
  - clear: true
    show: '<table class="t"><tr><th>trụ cột</th><th>rà trên kiến trúc mới</th></tr>

      <tr><td>vận hành, an toàn</td><td>dịch vụ được quản lý tự vá, sao lưu; thu hẹp quyền từng lớp</td></tr>

      <tr><td>tin cậy, hiệu năng</td><td>cơ sở dữ liệu $\ge 2$ vùng sẵn sàng ($1-(1-a)^k$); tự co giãn, tách hàm ảnh</td></tr>

      <tr><td>chi phí, bền vững</td><td>giảm 50,6% tiền máy ứng dụng; tắt máy rỗi ngoài giờ cao điểm</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Bước năm, rà nhanh cả sáu trụ cột cho kiến trúc sau khi chỉnh. Về vận hành và an toàn, dùng dịch vụ được quản lý
      tự vá lỗi, sao lưu và thu hẹp quyền từng lớp. Về tin cậy và hiệu năng, đặt cơ sở dữ liệu tối thiểu hai vùng sẵn
      sàng để xoá điểm hỏng đơn lẻ, kèm tự co giãn và hàm theo sự kiện. Về chi phí và bền vững, giảm 50 phẩy 6 phần trăm
      tiền máy ứng dụng và tránh chạy máy rỗi.
- id: check
  kind: check
  title: 'Tự kiểm: đếm giờ máy thay vì đếm tiền'
  checks:
  - 3 * 730 == 2190 and 730 + 2 * 176 == 1082 and round((1 - 1082 / 2190) * 100, 1) == 50.6
  steps:
  - show: '<table class="t"><tr><th>cách khác</th><th>giờ máy mỗi tháng</th></tr>

      <tr><td>trước: 3 máy × 730 giờ</td><td>2190</td></tr>

      <tr><td>sau: 730 + 2 × 176</td><td>1082</td></tr>

      <tr><td>giảm</td><td>$1 - \frac{1082}{2190} \approx 50{,}6\%$ ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    say: Kiểm bằng đường khác, đếm giờ máy thay vì đếm tiền, vì mọi máy cùng đơn giá. Trước là 3 nhân 730, bằng 2190 giờ máy.
      Sau là 730 cộng 2 nhân 176, bằng 1082 giờ máy. Giảm khoảng 50 phẩy 6 phần trăm, khớp phép tính bằng tiền.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Chuyển nguyên trạng rồi dừng ở đó <b class="red">(đắt hơn tại chỗ)</b>

      <br><span class="note">Trên 1 máy nhỏ thì chạy cố định ít lộ chi phí; ở cụm 3 máy 438 đô la/tháng co giãn còn 216,4
      (−50,6%), và lên 30 máy sẽ tiết kiệm hàng nghìn đô la mỗi tháng. Chuyển nguyên chỉ là bước đầu để rời phòng máy. Hãy
      lập kế hoạch bước sau: co giãn, dịch vụ được quản lý, tắt thứ thừa — nếu không, lợi ích không bao giờ đến.</span></div>

      '
    say: Lỗi thứ nhất, chuyển nguyên trạng rồi dừng ở đó, nên đắt hơn tại chỗ. Chuyển nguyên chỉ là bước đầu để rời phòng
      máy. Hãy lập kế hoạch cho bước sau, gồm co giãn, dịch vụ được quản lý, và tắt thứ thừa, nếu không thì lợi ích không
      bao giờ đến. Bê nguyên hệ thống cũ giữ nguyên kiến trúc nặng nề lên đám mây rồi ngỡ ngàng vì chi phí đắt đỏ gấp đôi
      trước kia.
  - show: ''
    say: Phải từng bước tái cấu trúc các tác vụ thưa sang hàm sự kiện và tách tầng lưu trữ sang kho đối tượng đám mây. Tận
      dụng tối đa lưu trữ quản lý và co giãn đàn hồi thay vì bê nguyên máy ảo cũ chạy đều hai bốn giờ. Tối ưu quá mức một
      trụ cột hiệu năng mà bỏ mặc hoàn toàn bảo mật và sao lưu dự phòng trên bản thiết kế tổng thể. Cộng dồn nhiều thành
      phần phức tạp vượt nhu cầu hiện tại làm tăng gấp đôi chi phí vận hành hằng tháng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Viết lại mọi thứ cùng lúc <b class="red">(dự án không bao giờ xong)</b>

      <br><span class="note">Chọn thành phần có lợi rõ nhất để viết lại; phần còn lại chuyển nguyên hoặc chuyển có chỉnh.
      Di chuyển theo đợt, mỗi đợt có cách quay lui.</span></div>

      '
    say: Lỗi thứ hai, viết lại mọi thứ cùng lúc, nên dự án không bao giờ xong. Hãy chọn thành phần có lợi rõ nhất để viết
      lại, còn phần khác chuyển nguyên hoặc chuyển có chỉnh. Di chuyển theo từng đợt, và mỗi đợt có cách quay lui. Cắt
      chuyển cùng một ngày toàn bộ hàng chục dịch vụ lõi lên môi trường mới đẩy rủi ro mất kiểm soát lên cực đại.
  - show: ''
    say: Chia từng đợt nhỏ gọn có đường quay lui tức thì biến dự án chuyển dịch dài hơi thành chuỗi nâng cấp an toàn. Chuyển
      đổi dần từng phân hệ nhỏ có kiểm chứng số liệu cắt giảm rủi ro sập hệ thống diện rộng. Thiếu bản hướng dẫn kiến trúc
      ghi rõ điểm sập đơn lẻ lẫn chỉ tiêu khôi phục mục tiêu khiến đội ngũ bối rối lúc ứng cứu.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Rà theo một trụ cột <b class="red">(rẻ mà không an toàn, nhanh mà không tin
      cậy)</b>

      <br><span class="note">Máy có thể bị thu hồi cho cơ sở dữ liệu thì rẻ nhưng hỏng trụ cột tin cậy; mở cổng cho nhanh
      thì hỏng trụ cột an toàn. Mỗi quyết định ghi rõ nó được và mất ở trụ cột nào.</span></div>

      '
    say: Lỗi thứ ba, chỉ rà theo một trụ cột, nên rẻ mà không an toàn, hay nhanh mà không tin cậy. Dùng máy có thể bị thu hồi
      cho cơ sở dữ liệu thì rẻ, nhưng hỏng trụ cột tin cậy, còn mở cổng cho nhanh thì hỏng trụ cột an toàn. Mỗi quyết định
      nên ghi rõ nó được và mất ở trụ cột nào.
  - show: ''
    say: Theo đuổi một trụ cột chi phí cực đoan tới mức phá vỡ sạch các lớp dự phòng vùng sẵn sàng gây sập dịch vụ giờ cao
      điểm. Đánh giá đồng thời tác động trên đủ sáu trụ cột kiến trúc trước khi phê duyệt thay đổi hạ tầng lớn. Triển khai
      thẳng thay đổi hạ tầng lên môi trường thật bằng tay thay vì qua khuôn mẫu khai báo lặp lại.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(2 / 30 * 100) == 7 and round(500 / 0.10 / 8760 * 100) == 57
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Hệ thư điện tử nội bộ tự cài trên một máy cũ, không ai muốn bảo trì. Chọn chiến lược nào?</td></tr>

      <tr><td>2</td><td>Ứng dụng tính lương chạy 2 ngày cuối tháng, máy tắt những ngày còn lại. Chọn cách chạy và cách trả
      tiền nào? Trụ cột nào được lợi?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, hệ thư điện tử nội bộ tự cài trên một máy cũ, và không ai muốn bảo trì. Chọn
      chiến lược nào? Câu hai, ứng dụng tính lương chỉ chạy 2 ngày cuối tháng, máy tắt những ngày còn lại. Chọn cách chạy
      và cách trả tiền nào? Và trong sáu trụ cột kiến trúc, trụ cột nào được lợi? Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① Không ai muốn bảo trì → để người khác bảo trì → <b>mua thay</b>: dùng thư điện tử như dịch vụ — nhà cung cấp
      lo vá và chống thư rác (vận hành, an toàn).</p>

      '
    say: Đáp án câu một, không ai muốn bảo trì thì để người khác bảo trì, nên chọn mua thay, dùng thư điện tử như dịch vụ.
      Nhà cung cấp lo vá và chống thư rác, lợi cho trụ cột vận hành và an toàn. Đánh giá tác động của từng cải tiến kiến trúc
      xem nó cộng điểm hay đánh đổi với trụ cột vận hành và bảo mật.
  - show: '<p>② Chạy khoảng 2 trên 30 ngày, tức chừng 7% thời gian — dưới xa điểm hòa vốn ở bài 5 (số giờ chạy mà từ đó đặt
      trước mới rẻ hơn; với số minh hoạ ở bài đó là khoảng 57% thời gian) → chạy theo lịch, <b>trả theo giờ</b> hoặc xử lý
      theo lô; <b>không</b> đặt trước — lợi trụ cột <b>chi phí</b> và <b>bền vững</b>.</p>

      '
    say: Câu hai, ứng dụng chạy khoảng 2 trên 30 ngày, chừng 7 phần trăm thời gian, dưới xa điểm hòa vốn ở bài 5. Nhắc lại,
      điểm hòa vốn là số giờ chạy mà từ đó đặt trước mới rẻ hơn, với số minh hoạ ở bài 5 là khoảng 57 phần trăm thời gian.
      Vậy chạy theo lịch, trả theo giờ hoặc xử lý theo lô, không đặt trước, lợi cho trụ cột chi phí và bền vững, vì không
      chạy máy ngồi không.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/CLC/L11
  steps:
  - show: <table class='t'><tr><th>Thực hành CLC:L11</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Thấy
      vì sao chuyển nguyên trạng thường đắt</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>db_az=2 az_av=0.999 min_app=3
      max_app=12</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash labs/cham.sh CLC L11 duong_dan/bai_cua_ban.py</code>
