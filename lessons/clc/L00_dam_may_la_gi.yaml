id: L00
course: CLC
series: "CLC · Điện toán đám mây"
title: "Bài 0 — Đám mây là gì: năm đặc tính, mô hình dịch vụ, trách nhiệm chia sẻ"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/clc.yaml L00; audit/clc/verify_clc.py L00; P. Mell, T. Grance, NIST SP 800-145, The NIST Definition of Cloud Computing (2011); tài liệu “Shared Responsibility Model” của các nhà cung cấp lớn (bản hiện hành, tên chỉ trên màn hình)"
assumes: [arith]
# Quy ước: năm đặc tính và ba mô hình dịch vụ theo NIST SP 800-145; “hàm theo sự kiện” (FaaS) là mô hình sau này, không có trong NIST 2011.
#   Bảng trách nhiệm là nguyên tắc chung; ranh giới cụ thể từng dịch vụ đọc theo tài liệu nhà cung cấp. Tên IaaS, PaaS, SaaS chỉ trên màn hình.
objectives:
  - "Nêu năm đặc tính của điện toán đám mây"
  - "Phân biệt hạ tầng, nền tảng, phần mềm như dịch vụ và hàm theo sự kiện"
  - "Xác định phần trách nhiệm của khách hàng"
asr_reviewed: []
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Dữ liệu lộ, ai chịu trách nhiệm?"
    steps:
      - show: |
          <p>Một công ty đưa kho ảnh hồ sơ khách hàng lên đám mây. Vài tháng sau, hàng nghìn hồ sơ bị lộ: kho lưu trữ được đặt chế độ <b>ai cũng đọc được</b>. Công ty nghĩ “đám mây lo an toàn rồi”. Nhà cung cấp trả lời: hạ tầng không hề bị xâm nhập — cấu hình quyền là việc của khách.</p>
          <div class="box key">Hôm nay: đám mây là gì theo định nghĩa chuẩn, các mô hình dịch vụ, và <b>đường ranh trách nhiệm</b> giữa nhà cung cấp và bạn.</div>
        focus: [1, 1, 1, 1, 2]
        say: "Chào bạn, một công ty đưa kho ảnh hồ sơ khách hàng lên đám mây. Vài tháng sau, hàng nghìn hồ sơ bị lộ, vì kho lưu trữ được đặt chế độ ai cũng đọc được. Công ty nghĩ đám mây lo an toàn rồi. Nhà cung cấp trả lời rằng hạ tầng không hề bị xâm nhập, và cấu hình quyền là việc của khách. Hôm nay ta học đám mây là gì theo định nghĩa chuẩn, các mô hình dịch vụ, và đường ranh trách nhiệm giữa nhà cung cấp và bạn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: bảy tầng của một hệ thống chạy ứng dụng"
    checks:
      - "[7, 4, 2, 1] == sorted([7, 4, 2, 1], reverse=True) and all(n >= 1 for n in [7, 4, 2, 1]) and len(['dữ liệu và quyền', 'ứng dụng', 'phần mềm nền', 'hệ điều hành', 'ảo hoá', 'mạng', 'phần cứng']) == 7"
    steps:
      - show: |
          <table class="t"><tr><th>tầng (từ dưới lên)</th><th>gồm</th></tr><tr><td>1</td><td>phần cứng</td></tr><tr><td>2</td><td>mạng</td></tr><tr><td>3</td><td>ảo hoá</td></tr><tr><td>4</td><td>hệ điều hành</td></tr><tr><td>5</td><td>phần mềm nền</td></tr><tr><td>6</td><td>ứng dụng</td></tr><tr><td>7</td><td>dữ liệu và quyền</td></tr></table>
        focus: [1, "1.2", "1.8"]
        say: "Trước hết, một ứng dụng chạy được là nhờ bảy tầng chồng lên nhau. Dưới cùng là phần cứng, mạng và lớp ảo hoá, rồi tới hệ điều hành, phần mềm nền như cơ sở dữ liệu, rồi ứng dụng. Trên cùng là dữ liệu và quyền, tức ai được đọc, ai được sửa."
      - show: |
          <p>Tự vận hành <b>tại chỗ</b> (máy chủ đặt ở công ty): bạn lo <b>cả 7 tầng</b>, từ mua máy, thay ổ đĩa hỏng, tới vá hệ điều hành và cấp quyền.</p>
        say: "Khi tự vận hành tại chỗ, tức máy chủ đặt ở công ty, bạn lo cả bảy tầng, từ mua máy, thay ổ đĩa hỏng, tới vá hệ điều hành và cấp quyền. Đám mây là thuê người khác lo bớt một số tầng."

  - id: sym
    kind: symbol
    title: "Giải mã: năm đặc tính và các mô hình dịch vụ"
    checks:
      - "len(['tự phục vụ', 'mạng rộng', 'gộp chung', 'co giãn', 'đo lường']) == 5"
    steps:
      - show: |
          <p><b>Năm đặc tính</b> (NIST, 2011): ① tự phục vụ theo nhu cầu, ② truy cập qua mạng rộng, ③ gộp chung tài nguyên, ④ co giãn nhanh, ⑤ đo lường mức dùng (trả theo mức dùng).</p>
          <table class="t"><tr><th>mô hình</th><th>nhà cung cấp lo</th><th>bạn lo</th></tr>
          <tr><td><b>hạ tầng như dịch vụ</b> (IaaS): máy ảo</td><td>phần cứng, mạng vật lý, lớp ảo hoá</td><td>hệ điều hành, vá lỗi, phần mềm, dữ liệu, quyền</td></tr>
          <tr><td><b>nền tảng như dịch vụ</b> (PaaS): cơ sở dữ liệu được quản lý</td><td>thêm: hệ điều hành, phần mềm cơ sở dữ liệu, vá lỗi</td><td>lược đồ, dữ liệu, quyền truy cập</td></tr>
          <tr><td><b>phần mềm như dịch vụ</b> (SaaS): thư điện tử</td><td>gần như tất cả</td><td>tài khoản, quyền, dữ liệu đưa vào</td></tr>
          <tr><td><b>hàm theo sự kiện</b> (FaaS, ra đời sau định nghĩa 2011)</td><td>máy chủ, co giãn, môi trường chạy</td><td>mã hàm, quyền của hàm, dữ liệu</td></tr></table>
        focus: [1, 1, 2, "2.2", "2.3", "2.4", "2.5"]
        say: "Theo định nghĩa của Viện Tiêu chuẩn và Công nghệ Quốc gia Hoa Kỳ năm 2011, đám mây có năm đặc tính. Đó là tự phục vụ theo nhu cầu, truy cập qua mạng rộng, gộp chung tài nguyên, co giãn nhanh, và đo lường mức dùng. Bảng so các mô hình dịch vụ, ba mô hình đầu theo định nghĩa trên, còn hàm theo sự kiện là mô hình ra đời sau. Với hạ tầng như dịch vụ, ví dụ máy ảo, nhà cung cấp lo phần cứng, mạng vật lý và lớp ảo hoá, còn bạn lo hệ điều hành, vá lỗi, phần mềm, dữ liệu và quyền. Với nền tảng như dịch vụ, ví dụ cơ sở dữ liệu được quản lý, nhà cung cấp lo thêm hệ điều hành và vá lỗi, còn bạn lo lược đồ, dữ liệu và quyền truy cập. Với phần mềm như dịch vụ, ví dụ thư điện tử, nhà cung cấp lo gần như tất cả, còn bạn lo tài khoản, quyền và dữ liệu đưa vào. Với hàm theo sự kiện, nhà cung cấp lo máy chủ, co giãn và môi trường chạy, còn bạn lo mã hàm, quyền của hàm và dữ liệu."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Phần màu cam co lại, nhưng không bao giờ biến mất"
    steps:
      - show: |
          <div><svg width="1500" height="345" viewBox="0 0 1500 345"><g font-size="22" fill="#1f2937"><text x="350" y="40" text-anchor="middle" font-weight="bold">tại chỗ</text><rect x="230" y="60" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="230" y="97" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="230" y="134" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="230" y="171" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="230" y="208" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="230" y="245" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="230" y="282" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><text x="650" y="40" text-anchor="middle" font-weight="bold">hạ tầng</text><rect x="530" y="60" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="530" y="97" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="530" y="134" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="530" y="171" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="530" y="208" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="530" y="245" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="530" y="282" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="950" y="40" text-anchor="middle" font-weight="bold">nền tảng</text><rect x="830" y="60" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="830" y="97" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="830" y="134" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="830" y="171" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="830" y="208" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="830" y="245" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="830" y="282" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="1250" y="40" text-anchor="middle" font-weight="bold">phần mềm</text><rect x="1130" y="60" width="240" height="33" rx="4" fill="#ffedd5" stroke="#eb6834" stroke-width="2"/><rect x="1130" y="97" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="1130" y="134" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="1130" y="171" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="1130" y="208" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="1130" y="245" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><rect x="1130" y="282" width="240" height="33" rx="4" fill="#dbeafe" stroke="#2a78d6" stroke-width="2"/><text x="210" y="83" text-anchor="end" font-size="19">dữ liệu và quyền</text><text x="210" y="120" text-anchor="end" font-size="19">ứng dụng</text><text x="210" y="157" text-anchor="end" font-size="19">phần mềm nền</text><text x="210" y="194" text-anchor="end" font-size="19">hệ điều hành</text><text x="210" y="231" text-anchor="end" font-size="19">ảo hoá</text><text x="210" y="268" text-anchor="end" font-size="19">mạng</text><text x="210" y="305" text-anchor="end" font-size="19">phần cứng</text><rect x="230" y="322" width="22" height="18" fill="#ffedd5" stroke="#eb6834"/><text x="260" y="338" font-size="20">bạn lo</text><rect x="400" y="322" width="22" height="18" fill="#dbeafe" stroke="#2a78d6"/><text x="430" y="338" font-size="20">nhà cung cấp lo</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình đặt bảy tầng cạnh nhau cho bốn cách vận hành, màu cam là phần bạn lo, màu xanh là phần nhà cung cấp lo. Từ tại chỗ sang hạ tầng, nền tảng rồi phần mềm như dịch vụ, phần cam co dần từ 7 tầng xuống 4, 2 rồi 1. Nhưng ô trên cùng, dữ liệu và quyền, luôn luôn màu cam."

  - id: example
    kind: example
    title: "Ba sự cố, ai phải sửa?"
    checks:
      - "len(['hệ điều hành chưa vá', 'phần mềm cơ sở dữ liệu', 'quyền công khai']) == 3"
    steps:
      - show: |
          <table class="t"><tr><th>sự cố</th><th>dịch vụ</th><th>tầng bị lỗi</th><th>trách nhiệm</th></tr>
          <tr><td>lỗ hổng hệ điều hành chưa vá</td><td>máy ảo</td><td>hệ điều hành</td><td><b>khách</b> — ở máy ảo, tầng này màu cam</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước một, xét lỗ hổng hệ điều hành chưa vá trên máy ảo. Tầng bị lỗi là hệ điều hành, mà ở mô hình hạ tầng như dịch vụ, tầng này màu cam, nên trách nhiệm là của khách."
      - show: |
          <table class="t"><tr><th>sự cố</th><th>dịch vụ</th><th>tầng bị lỗi</th><th>trách nhiệm</th></tr>
          <tr><td>lỗ hổng phần mềm cơ sở dữ liệu</td><td>cơ sở dữ liệu được quản lý</td><td>phần mềm nền</td><td><b>nhà cung cấp</b> vá</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước hai, xét lỗ hổng phần mềm cơ sở dữ liệu trên dịch vụ được quản lý. Tầng bị lỗi là phần mềm nền, mà ở mô hình nền tảng như dịch vụ, tầng này màu xanh, nên nhà cung cấp vá."
      - clear: true
        show: |
          <table class="t"><tr><th>sự cố</th><th>dịch vụ</th><th>tầng bị lỗi</th><th>trách nhiệm</th></tr>
          <tr><td>kho lưu trữ đặt quyền công khai</td><td>bất kỳ</td><td>dữ liệu và quyền</td><td>$\hl{\text{khách}}$ — tầng trên cùng <b>luôn</b> là phần của bạn</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước ba, xét kho lưu trữ đặt quyền công khai, trên bất kỳ dịch vụ nào. Tầng bị lỗi là dữ liệu và quyền, tầng trên cùng, luôn màu cam, nên trách nhiệm luôn là của khách, đúng như câu chuyện mở đầu."
      - show: |
          <p><b>Bước 4 — quy tắc:</b> tìm <b>tầng</b> bị lỗi, rồi xem tầng đó màu gì ở mô hình đang dùng. Càng lên mô hình cao, phần của bạn càng nhỏ — nhưng <b>dữ liệu, tài khoản và quyền</b> không bao giờ chuyển đi.</p>
        say: "Bước bốn, rút ra quy tắc, tìm tầng bị lỗi rồi xem tầng đó màu gì ở mô hình đang dùng. Càng lên mô hình cao, phần của bạn càng nhỏ, nhưng dữ liệu, tài khoản và quyền không bao giờ chuyển đi."

  - id: check
    kind: check
    title: "Tự kiểm: đếm tầng màu cam"
    checks:
      - "[7, 4, 2, 1] == sorted([7, 4, 2, 1], reverse=True) and all(n >= 1 for n in [7, 4, 2, 1]) and len(['dữ liệu và quyền', 'ứng dụng', 'phần mềm nền', 'hệ điều hành', 'ảo hoá', 'mạng', 'phần cứng']) == 7"
    steps:
      - show: |
          <table class="t"><tr><th>mô hình</th><th>số tầng bạn lo</th><th>có “dữ liệu và quyền”?</th></tr>
          <tr><td>tại chỗ</td><td>7</td><td>có</td></tr><tr><td>hạ tầng như dịch vụ</td><td>4</td><td>có</td></tr>
          <tr><td>nền tảng như dịch vụ</td><td>2</td><td>có</td></tr><tr><td>phần mềm như dịch vụ</td><td>1</td><td>có ✓</td></tr></table>
        focus: [1, "1.2", "1.4", "1.5"]
        say: "Kiểm bằng đường khác, vì quy tắc dựa vào màu từng tầng, ta đếm số tầng màu cam ở từng mô hình. Tại chỗ là 7 tầng, hạ tầng như dịch vụ là 4. Nền tảng như dịch vụ chỉ còn 2. Phần mềm như dịch vụ còn đúng 1, và ở cả bốn mô hình, tầng dữ liệu và quyền đều nằm trong phần của bạn."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Nghĩ “lên đám mây là an toàn” <b class="red">(trách nhiệm không chuyển hết)</b>
          <br><span class="note">Rất nhiều sự cố dữ liệu trên đám mây đến từ cấu hình của khách: quyền quá rộng, khoá truy cập lộ, kho để công khai. Kiểm cấu hình tự động, chặn công khai mặc định.</span></div>
        say: "Lỗi thứ nhất, nghĩ lên đám mây là an toàn, trong khi trách nhiệm không chuyển hết. Rất nhiều sự cố dữ liệu trên đám mây đến từ cấu hình của khách, như quyền quá rộng, khoá truy cập bị lộ, hay kho để công khai. Hãy kiểm cấu hình tự động, và chặn công khai theo mặc định."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng đám mây như trung tâm dữ liệu cũ <b class="red">(trả tiền mà không co giãn)</b>
          <br><span class="note">Thuê máy lớn chạy 24/7 cho tải chỉ cao giờ hành chính là bỏ qua đặc tính “co giãn nhanh” và “trả theo mức dùng”.</span></div>
        say: "Lỗi thứ hai, dùng đám mây như trung tâm dữ liệu cũ, nên trả tiền mà không co giãn. Thuê máy lớn chạy suốt ngày đêm cho một tải chỉ cao trong giờ hành chính là bỏ qua hai đặc tính co giãn nhanh và trả theo mức dùng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chọn mô hình thấp vì “kiểm soát được nhiều hơn” <b class="red">(tự gánh việc vá)</b>
          <br><span class="note">Tự cài cơ sở dữ liệu trên máy ảo nghĩa là tự vá, tự sao lưu, tự chuyển dự phòng. Chỉ chọn khi thật cần kiểm soát đó.</span></div>
        say: "Lỗi thứ ba, chọn mô hình thấp vì nghĩ kiểm soát được nhiều hơn, nên phải tự gánh việc vá. Tự cài cơ sở dữ liệu trên máy ảo nghĩa là tự vá, tự sao lưu, và tự chuyển dự phòng. Chỉ chọn cách đó khi thật sự cần mức kiểm soát ấy."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Hàm theo sự kiện đọc dữ liệu thẻ thanh toán nhưng được cấp quyền đọc <b>mọi</b> kho lưu trữ. Ai chịu trách nhiệm sửa?</td></tr>
          <tr><td>2</td><td>Nhóm cần một cơ sở dữ liệu quan hệ, không có người quản trị cơ sở dữ liệu riêng. Chọn mô hình nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, một hàm theo sự kiện đọc dữ liệu thẻ thanh toán, nhưng được cấp quyền đọc mọi kho lưu trữ. Ai chịu trách nhiệm sửa? Câu hai, nhóm cần một cơ sở dữ liệu quan hệ, và không có người quản trị cơ sở dữ liệu riêng. Vậy nên chọn mô hình dịch vụ nào? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① Tầng bị lỗi: <b>dữ liệu và quyền</b> → luôn màu cam → <b>khách</b> sửa: thu hẹp quyền của hàm về đúng kho cần đọc.</p>
        say: "Đáp án câu một, tầng bị lỗi là dữ liệu và quyền, luôn màu cam, nên khách chịu trách nhiệm. Cách sửa là thu hẹp quyền của hàm về đúng kho cần đọc."
      - show: |
          <p>② Không có người quản trị cơ sở dữ liệu → muốn nhà cung cấp lo tầng <b>phần mềm nền</b> → <b>cơ sở dữ liệu được quản lý</b> (nền tảng như dịch vụ): nhà cung cấp lo vá, sao lưu tự động, chuyển dự phòng; nhóm lo lược đồ, dữ liệu, quyền.</p>
        say: "Câu hai, không có người quản trị cơ sở dữ liệu, nên ta muốn nhà cung cấp lo tầng phần mềm nền. Vậy chọn cơ sở dữ liệu được quản lý, tức nền tảng như dịch vụ, nhà cung cấp lo vá, sao lưu và chuyển dự phòng, còn nhóm lo lược đồ, dữ liệu và quyền."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">năm đặc tính: tự phục vụ, mạng, gộp, co giãn, đo lường</span><span class="a">→</span>
          <span class="n">hạ tầng → nền tảng → phần mềm → hàm</span><span class="a">→</span>
          <span class="n">càng cao càng ít việc</span><span class="a">→</span>
          <span class="n">dữ liệu, tài khoản, quyền: luôn là của bạn</span></div>
        say: "Tổng kết lại, đám mây có năm đặc tính là tự phục vụ, truy cập qua mạng, gộp chung tài nguyên, co giãn, và đo lường. Đi từ hạ tầng lên nền tảng, phần mềm và hàm thì càng ít việc, nhưng dữ liệu, tài khoản và quyền luôn là của bạn."
      - show: |
          <div class="box key"><b>Tư duy:</b> thuê ngoài được <b>công việc</b>, không thuê ngoài được <b>trách nhiệm</b>.</div>
        say: "Điều cần mang theo, ta thuê ngoài được công việc, nhưng không thuê ngoài được trách nhiệm."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 1): <b>vùng, vùng sẵn sàng</b> và thiết kế chịu lỗi.</p>
        forward_ref: true
        say: "Ở bài sau, bài 1, ta học vùng, vùng sẵn sàng, và thiết kế chịu lỗi. Hẹn gặp bạn ở bài tiếp theo."
