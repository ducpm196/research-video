- id: example
  kind: example
  title: Ba sự cố, ai phải sửa?
  checks:
  - 4 >= 1
  steps:
  - show: '<table class="t"><tr><th>sự cố</th><th>dịch vụ</th><th>tầng bị lỗi</th><th>trách nhiệm</th></tr>

      <tr><td>lỗ hổng hệ điều hành chưa vá</td><td>máy ảo</td><td>hệ điều hành</td><td><b>khách</b> — ở máy ảo, tầng này màu
      cam</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    say: Bước một, xét lỗ hổng hệ điều hành chưa vá trên máy ảo. Tầng bị lỗi là hệ điều hành, mà ở mô hình hạ tầng như dịch
      vụ, tầng này màu cam, nên trách nhiệm là của khách.
  - show: '<table class="t"><tr><th>sự cố</th><th>dịch vụ</th><th>tầng bị lỗi</th><th>trách nhiệm</th></tr>

      <tr><td>lỗ hổng phần mềm cơ sở dữ liệu</td><td>cơ sở dữ liệu được quản lý</td><td>phần mềm nền</td><td><b>nhà cung cấp</b>
      vá</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    say: Bước hai, xét lỗ hổng phần mềm cơ sở dữ liệu trên dịch vụ được quản lý. Tầng bị lỗi là phần mềm nền, mà ở mô hình
      nền tảng như dịch vụ, tầng này màu xanh, nên nhà cung cấp vá.
  - clear: true
    show: '<table class="t"><tr><th>sự cố</th><th>dịch vụ</th><th>tầng bị lỗi</th><th>trách nhiệm</th></tr>

      <tr><td>kho lưu trữ đặt quyền công khai</td><td>bất kỳ</td><td>dữ liệu và quyền</td><td>$\hl{\text{khách}}$ — tầng trên
      cùng <b>luôn</b> là phần của bạn</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    say: Bước ba, xét kho lưu trữ đặt quyền công khai, trên bất kỳ dịch vụ nào. Tầng bị lỗi là dữ liệu và quyền, tầng trên
      cùng, luôn màu cam, nên trách nhiệm luôn là của khách, đúng như câu chuyện mở đầu.
  - show: '<p><b>Bước 4 — quy tắc:</b> tìm <b>tầng</b> bị lỗi, rồi xem tầng đó màu gì ở mô hình đang dùng. Ở mô hình cao hơn,
      phần bạn tự quản lý nhỏ hơn — nhưng <b>dữ liệu, tài khoản và quyền</b> không bao giờ chuyển đi.</p>

      '
    say: Bước bốn, rút ra quy tắc, tìm tầng bị lỗi rồi xem tầng đó màu gì ở mô hình đang dùng. Ở mô hình cao hơn, phần bạn
      tự quản lý nhỏ hơn, nhưng dữ liệu, tài khoản và quyền không bao giờ chuyển đi.
- id: check
  kind: check
  title: 'Tự kiểm: đếm tầng màu cam'
  checks:
  - '[7, 4, 2, 1] == sorted([7, 4, 2, 1], reverse=True) and all(n >= 1 for n in [7, 4, 2, 1]) and len([''dữ liệu và quyền'',
    ''ứng dụng'', ''phần mềm nền'', ''hệ điều hành'', ''ảo hoá'', ''mạng'', ''phần cứng'']) == 7'
  steps:
  - show: '<table class="t"><tr><th>mô hình</th><th>số tầng bạn lo</th><th>có “dữ liệu và quyền”?</th></tr>

      <tr><td>tại chỗ</td><td>7</td><td>có</td></tr><tr><td>hạ tầng như dịch vụ</td><td>4</td><td>có</td></tr>

      <tr><td>nền tảng như dịch vụ</td><td>2</td><td>có</td></tr><tr><td>phần mềm như dịch vụ</td><td>1</td><td>có ✓</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.4'
    - '1.5'
    say: Kiểm bằng đường khác, vì quy tắc dựa vào màu từng tầng, ta đếm số tầng màu cam ở từng mô hình. Tại chỗ là 7 tầng,
      hạ tầng như dịch vụ là 4. Nền tảng như dịch vụ chỉ còn 2. Phần mềm như dịch vụ còn đúng 1, và ở cả bốn mô hình, tầng
      dữ liệu và quyền đều nằm trong phần của bạn.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Nghĩ “lên đám mây là an toàn” <b class="red">(trách nhiệm không chuyển hết)</b>

      <br><span class="note">Rất nhiều sự cố dữ liệu trên đám mây đến từ cấu hình của khách: quyền quá rộng, khoá truy cập
      lộ, kho để công khai. Kiểm cấu hình tự động, chặn công khai mặc định.</span></div>

      '
    say: Lỗi thứ nhất, nghĩ lên đám mây là an toàn, trong khi trách nhiệm không chuyển hết. Rất nhiều sự cố dữ liệu trên đám
      mây đến từ cấu hình của khách, như quyền quá rộng, khoá truy cập bị lộ, hay kho để công khai. Hãy kiểm cấu hình tự
      động, và chặn công khai theo mặc định. Chuyển thẳng máy chủ cũ lên đám mây mà giữ máy chạy liên tục hai bốn giờ
      thường đắt hơn hẳn thuê chỗ đặt.
  - show: ''
    say: Lợi ích kinh tế thật chỉ xuất hiện khi tắt máy tự động ban đêm và co giãn ngang theo nhịp lưu lượng. Khai thác tối
      đa bật tắt theo nhu cầu biến mô hình trả tiền theo giờ thành lợi thế tiết kiệm rõ rệt. Chuyển nguyên máy ảo cổ điển
      lên đám mây mà chạy liên tục cả đêm cuối tuần làm hoá đơn đắt gấp ba máy chủ cũ tại chỗ. Chạy thử máy lớn quanh năm
      không tắt biến ưu thế co giãn đám mây thành lãng phí cố định hằng tháng.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Dùng đám mây như trung tâm dữ liệu cũ <b class="red">(trả tiền mà không co
      giãn)</b>

      <br><span class="note">Thuê 1 máy nhỏ chạy 24/7 chỉ tốn ít, nhưng ở quy mô 100 máy cho tải chỉ cao 8 giờ hành chính
      mỗi ngày là trả thừa 66,7% tiền máy vì bỏ qua hai đặc tính “co giãn nhanh” và “trả theo mức dùng”.</span></div>

      '
    say: Lỗi thứ hai, dùng đám mây như trung tâm dữ liệu cũ, nên trả tiền mà không co giãn. Thuê máy lớn chạy suốt ngày đêm
      cho một tải chỉ cao trong giờ hành chính là bỏ qua hai đặc tính co giãn nhanh và trả theo mức dùng. Đổ lỗi cho nhà
      cung cấp khi sập dữ liệu vì mở công khai kho lưu trữ là hiểu nhầm tai hại về ranh giới trách nhiệm.
  - show: ''
    say: Bật kiểm soát phân quyền chặt chẽ ngay từ ngày khởi tạo tài khoản gốc chặn đứng sự cố rò rỉ ngầm. Thiết lập mặc định
      chế độ đóng mọi kho lưu trữ ngay từ ngày đầu tạo tài khoản đám mây. Nhầm lẫn trách nhiệm sao lưu bảo mật ứng dụng
      với phần bảo trì phần cứng vốn thuộc nhà cung cấp hạ tầng.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Chọn mô hình thấp vì “kiểm soát được nhiều hơn” <b class="red">(tự gánh việc
      vá)</b>

      <br><span class="note">Tự cài cơ sở dữ liệu trên máy ảo nghĩa là tự vá, tự sao lưu, tự chuyển dự phòng. Chỉ chọn khi
      thật cần kiểm soát đó.</span></div>

      '
    say: Lỗi thứ ba, chọn mô hình thấp vì nghĩ kiểm soát được nhiều hơn, nên phải tự gánh việc vá. Tự cài cơ sở dữ liệu trên
      máy ảo nghĩa là tự vá, tự sao lưu, và tự chuyển dự phòng. Chỉ chọn cách đó khi thật sự cần mức kiểm soát ấy.
  - show: ''
    say: Quên gắn giới hạn ngân sách và cảnh báo sớm khi thử nghiệm dịch vụ đắt tiền dễ nhận hoá đơn bất ngờ cuối tháng. Cấu
      hình cảnh báo vượt ngân sách nhiều ngưỡng bảo vệ đội ngũ trước bất kỳ sự cố vòng lặp vô hạn nào. Không gắn thẻ chi
      phí theo dự án khiến cuối tháng tài chính chẳng biết đội ngũ nào tiêu tốn ngân sách đám mây.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>Hàm theo sự kiện đọc dữ liệu thẻ thanh toán nhưng được cấp quyền đọc <b>mọi</b> kho lưu trữ. Ai chịu
      trách nhiệm sửa?</td></tr>

      <tr><td>2</td><td>Nhóm cần một cơ sở dữ liệu quan hệ, không có người quản trị cơ sở dữ liệu riêng. Chọn mô hình nào?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, một hàm theo sự kiện đọc dữ liệu thẻ thanh toán, nhưng được cấp quyền đọc mọi
      kho lưu trữ. Ai chịu trách nhiệm sửa? Câu hai, nhóm cần một cơ sở dữ liệu quan hệ, và không có người quản trị cơ sở
      dữ liệu riêng. Vậy nên chọn mô hình dịch vụ nào? Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① Tầng bị lỗi: <b>dữ liệu và quyền</b> → luôn màu cam → <b>khách</b> sửa: thu hẹp quyền của hàm về đúng kho
      cần đọc.</p>

      '
    say: Đáp án câu một, tầng bị lỗi là dữ liệu và quyền, luôn màu cam, nên khách chịu trách nhiệm. Cách sửa là thu hẹp quyền
      của hàm về đúng kho cần đọc. Đối chiếu danh mục trách nhiệm từng tầng từ hạ tầng thô tới phần mềm hoàn chỉnh xác định
      ngay ai lo phần vá nhân.
  - show: '<p>② Không có người quản trị cơ sở dữ liệu → muốn nhà cung cấp lo tầng <b>phần mềm nền</b> → <b>cơ sở dữ liệu được
      quản lý</b> (nền tảng như dịch vụ): nhà cung cấp lo vá, sao lưu tự động, chuyển dự phòng; nhóm lo lược đồ, dữ liệu,
      quyền.</p>

      '
    say: Câu hai, không có người quản trị cơ sở dữ liệu, nên ta muốn nhà cung cấp lo tầng phần mềm nền. Vậy chọn cơ sở dữ
      liệu được quản lý, tức nền tảng như dịch vụ, nhà cung cấp lo vá, sao lưu và chuyển dự phòng, còn nhóm lo lược đồ, dữ
      liệu và quyền. Kiểm tra năm đặc tính chuẩn nhận biết ngay dịch vụ nào chỉ đổi tên máy chủ ảo truyền thống.
- id: practice
  kind: practice
  title: Tự làm bài thực hành và chấm thật
  lab: labs/CLC/L00
  steps:
  - show: <table class='t'><tr><th>Thực hành CLC:L00</th><th>Yêu cầu &amp; dữ liệu mẫu (stdin)</th></tr><tr><td><b>Mục tiêu</b></td><td>Xác
      định phần trách nhiệm của khách hàng</td></tr><tr><td><b>Dữ liệu mẫu</b></td><td><code>layers=Hardware,OS,Runtime,App,Data
      iaas=OS,Runtime,App,Data paas=App,Data faas=App,Data saas=Data</code></td></tr><tr><td><b>Chấm bài</b></td><td><code>bash
      labs/cham.sh CLC L00 duong_dan/bai_cua_ban.py</code> (kèm 2 ca ẩn)</td></tr></table>
    say: Mời bạn tự thực hành bài số 0 với dữ liệu đọc động. Đọc kỹ cấu trúc đầu vào trong tệp đề bài, giữ nguyên tên khoá
      ở từng dòng đầu ra rồi chạy lệnh tự chấm cùng hai ca kiểm ẩn. Hãy đọc kỹ từng dòng dữ liệu mẫu trên màn hình và thiết
      kế hàm đọc từ luồng chuẩn thật linh hoạt để xử lý gọn mọi bộ kiểm thử ẩn. Đọc danh sách tên các lớp cùng tập lớp tự
      quản ứng với từng mô hình triển khai đám mây khác nhau. Đếm số lớp khách hàng tự chịu trách nhiệm ở mỗi mô hình rồi
      tính mức chênh lệch giữa hạ tầng và phần mềm như dịch vụ.
    clear: true
    pause: 30
    focus:
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
    - '1.4'
  - show: <table class='t'><tr><th>Gợi ý triển khai CLC:L00</th><th>Các bước cài đặt trọng tâm</th></tr><tr><td><b>Bước 1
      (chuẩn hóa tập lớp)</b></td><td>Tách danh sách các tầng hệ thống từ tham số chuẩn đầu vào</td></tr><tr><td><b>Bước 2
      (đếm theo mô hình)</b></td><td>Đếm số tầng nằm trong phần khách hàng tự quản của bốn mô hình</td></tr><tr><td><b>Bước
      3 (so hai cực)</b></td><td>Trừ số tầng của SaaS khỏi số tầng IaaS để đo mức chênh trách nhiệm</td></tr></table>
    say: Gợi ý cài đặt bài số 0 chia thành ba bước rõ ràng. Đầu tiên đọc tham số đầu vào từ luồng chuẩn, sau đó tính toán
      đúng công thức hoặc mô phỏng quy tắc bài toán, cuối cùng in đủ 3 dòng khớp định dạng. In đủ ba dòng gồm số lớp tự quản
      của mô hình hạ tầng, ba số cách nhau dấu phẩy của ba mô hình còn lại và hiệu số lớp giữa mô hình đầu với cuối.
    clear: true
    focus:
    - '1.2'
    - '1.3'
    - '1.3'
  - show: <p><b>Kết quả mong đợi với dữ liệu mẫu (3 dòng)</b></p><div class="code"><div>iaas_layers=4</div><div>paas_faas_saas=2,2,1</div><div>iaas_minus_saas=3</div></div>
    say: Màn hình hiện 3 dòng kết quả mong đợi ứng với dữ liệu mẫu. Hãy bảo đảm chương trình của bạn xử lý đúng cả dữ liệu
      mẫu lẫn hai bộ dữ liệu kiểm ẩn trước khi chuyển bài.
    clear: true
    focus:
    - 1
    - 2
- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">năm đặc tính: tự phục vụ, mạng, gộp, co giãn, đo lường</span><span class="a">→</span>

      <span class="n">hạ tầng → nền tảng → phần mềm → hàm</span><span class="a">→</span>

      <span class="n">tầng cao hơn, tự lo ít việc hơn</span><span class="a">→</span>

      <span class="n">dữ liệu, tài khoản, quyền: luôn là của bạn</span></div>

      '
    say: Tổng kết lại, đám mây có năm đặc tính là tự phục vụ, truy cập qua mạng, gộp chung tài nguyên, co giãn, và đo lường.
      Đi từ hạ tầng lên nền tảng, phần mềm và hàm thì bạn tự lo ít việc hơn, nhưng dữ liệu, tài khoản và quyền luôn là của
      bạn.
  - show: ''
    say: Bảng trách nhiệm chung chỉ rõ ranh giới nơi nhà cung cấp dừng lại và nơi đội ngũ của bạn phải tự thiết lập giám sát
      bảo mật hằng ngày. Đám mây mang lại tốc độ thử nghiệm và đàn hồi vượt trội nếu bạn làm chủ kỷ luật tắt mở theo nhu
      cầu. Làm chủ ranh giới trách nhiệm và co giãn tự động là nền tảng vững vàng bước vào kỷ nguyên đám mây.
  - show: '<div class="box key"><b>Tư duy:</b> thuê ngoài được <b>công việc</b>, không thuê ngoài được <b>trách nhiệm</b>.</div>

      <p class="note"><b>So sánh hai quy mô:</b> với 1 máy ảo hay 100 máy cho tải giờ hành chính (8/24 giờ), tách phần co
      giãn giúp tránh trả thừa 66,7% giờ rảnh; dù thuê hạ tầng (4 lớp tự quản trên phần cứng), nền tảng (2 lớp) hay phần mềm
      (1 lớp), dữ liệu và quyền luôn là trách nhiệm của bạn.</p>

      '
    focus:
    - 1
    - 2
    - 2
    - 2
    - 2
    say: Điều cần mang theo, ta thuê ngoài được công việc, nhưng không thuê ngoài được trách nhiệm. Xét hai mức quy mô, từ
      1 máy đơn tới 100 máy giờ hành chính đều hưởng lợi nếu tách co giãn. Dù dùng hạ tầng, nền tảng hay phần mềm, dữ liệu
      và quyền luôn là trách nhiệm của bạn. Nắm chắc ranh giới trách nhiệm chia sẻ đặt nền tảng an toàn cho mọi kiến trúc
      triển khai kế tiếp. Triển khai dự phòng nhiều cụm sẵn sàng bảo đảm ứng dụng đứng vững khi hạ tầng vật lý gặp trục trặc.
  - clear: true
    show: '<p class="note">Bài sau (bài 1): <b>vùng, vùng sẵn sàng</b> và thiết kế chịu lỗi.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 1, ta học vùng, vùng sẵn sàng, và thiết kế chịu lỗi. Hẹn gặp bạn ở bài tiếp theo. Bài tiếp theo giải
      thích cách đặt bản sao qua nhiều vùng sẵn sàng nhằm bảo vệ dịch vụ đứng vững trước sự cố điện mạng.
