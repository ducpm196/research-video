- Phân biệt hạ tầng, nền tảng, phần mềm như dịch vụ và hàm theo sự kiện
- Xác định phần trách nhiệm của khách hàng
asr_reviewed: []
scenes:
- id: hook
  kind: hook
  title: Dữ liệu lộ, ai chịu trách nhiệm?
  steps:
  - show: '<p>Một công ty đưa kho ảnh hồ sơ khách hàng lên đám mây. Vài tháng sau, hàng nghìn hồ sơ bị lộ: kho lưu trữ được
      đặt chế độ <b>ai cũng đọc được</b>. Công ty nghĩ “đám mây lo an toàn rồi”. Nhà cung cấp trả lời: hạ tầng không hề bị
      xâm nhập — cấu hình quyền là việc của khách.</p>

      <div class="box key">Hôm nay: đám mây là gì theo định nghĩa chuẩn, các mô hình dịch vụ, và <b>đường ranh trách nhiệm</b>
      giữa nhà cung cấp và bạn.</div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, một công ty đưa kho ảnh hồ sơ khách hàng lên đám mây. Vài tháng sau, hàng nghìn hồ sơ bị lộ, vì kho lưu
      trữ được đặt chế độ ai cũng đọc được. Công ty nghĩ đám mây lo an toàn rồi. Nhà cung cấp trả lời rằng hạ tầng không hề
      bị xâm nhập, và cấu hình quyền là việc của khách. Hôm nay ta học đám mây là gì theo định nghĩa chuẩn, các mô hình dịch
      vụ, và đường ranh trách nhiệm giữa nhà cung cấp và bạn. Thuê hạ tầng đám mây không chỉ là dời máy chủ ra ngoài mà thay
      đổi tận gốc cách cấp phát và trả tiền. Hiểu năm đặc tính cốt lõi cùng mô hình trách nhiệm chia sẻ giúp bạn tránh lỗ
      hổng cấu hình đắt giá.
- id: prereq
  kind: prereq
  title: 'Chuẩn bị: bảy tầng của một hệ thống chạy ứng dụng'
  checks:
  - '[7, 4, 2, 1] == sorted([7, 4, 2, 1], reverse=True) and all(n >= 1 for n in [7, 4, 2, 1]) and len([''dữ liệu và quyền'',
    ''ứng dụng'', ''phần mềm nền'', ''hệ điều hành'', ''ảo hoá'', ''mạng'', ''phần cứng'']) == 7'
  steps:
  - show: '<table class="t"><tr><th>tầng (từ dưới lên)</th><th>gồm</th></tr><tr><td>1</td><td>phần cứng</td></tr><tr><td>2</td><td>mạng</td></tr><tr><td>3</td><td>ảo
      hoá</td></tr><tr><td>4</td><td>hệ điều hành</td></tr><tr><td>5</td><td>phần mềm nền</td></tr><tr><td>6</td><td>ứng dụng</td></tr><tr><td>7</td><td>dữ
      liệu và quyền</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    - '1.8'
    - '1.8'
    say: Trước hết, một ứng dụng chạy được là nhờ bảy tầng chồng lên nhau. Dưới cùng là phần cứng, mạng và lớp ảo hoá, rồi
      tới hệ điều hành, phần mềm nền như cơ sở dữ liệu, rồi ứng dụng. Trên cùng là dữ liệu và quyền, tức ai được đọc, ai được
      sửa. Khả năng tự phục vụ theo nhu cầu biến quy trình chờ duyệt máy vài tuần xuống chỉ còn vài giây gọi lệnh.
  - show: '<p>Tự vận hành <b>tại chỗ</b> (máy chủ đặt ở công ty): bạn lo <b>cả 7 tầng</b>, từ mua máy, thay ổ đĩa hỏng, tới
      vá hệ điều hành và cấp quyền.</p>

      '
    say: Khi tự vận hành tại chỗ, tức máy chủ đặt ở công ty, bạn lo cả bảy tầng, từ mua máy, thay ổ đĩa hỏng, tới vá hệ điều
      hành và cấp quyền. Đám mây là thuê người khác lo bớt một số tầng. Đo lường chính xác theo mức tiêu thụ giúp các đội
      sản phẩm gắn trực tiếp chi phí máy vào từng tính năng.
- id: sym
  kind: symbol
  title: 'Giải mã: năm đặc tính và các mô hình dịch vụ'
  checks:
  - 2011 >= 1
  steps:
  - show: '<p><b>Năm đặc tính</b> (NIST, 2011): ① tự phục vụ theo nhu cầu, ② truy cập qua mạng rộng, ③ gộp chung tài nguyên,
      ④ co giãn nhanh, ⑤ đo lường mức dùng (trả theo mức dùng).</p>

      <table class="t"><tr><th>mô hình</th><th>nhà cung cấp lo</th><th>bạn lo</th></tr>

      <tr><td><b>hạ tầng như dịch vụ</b> (IaaS): máy ảo</td><td>phần cứng, mạng vật lý, lớp ảo hoá</td><td>hệ điều hành, vá
      lỗi, phần mềm, dữ liệu, quyền</td></tr>

      <tr><td><b>nền tảng như dịch vụ</b> (PaaS): cơ sở dữ liệu được quản lý</td><td>thêm: hệ điều hành, phần mềm cơ sở dữ
      liệu, vá lỗi</td><td>lược đồ, dữ liệu, quyền truy cập</td></tr>

      <tr><td><b>phần mềm như dịch vụ</b> (SaaS): thư điện tử</td><td>gần như tất cả</td><td>tài khoản, quyền, dữ liệu đưa
      vào</td></tr>

      <tr><td><b>hàm theo sự kiện</b> (FaaS, ra đời sau định nghĩa 2011)</td><td>máy chủ, co giãn, môi trường chạy</td><td>mã
      hàm, quyền của hàm, dữ liệu</td></tr></table>

      '
    focus:
    - 1
    - 1
    - 2
    - '2.2'
    - '2.3'
    - '2.4'
    - '2.5'
    - '2.5'
    - '2.5'
    say: Theo định nghĩa của Viện Tiêu chuẩn và Công nghệ Quốc gia Hoa Kỳ năm 2011, đám mây có năm đặc tính. Đó là tự phục
      vụ theo nhu cầu, truy cập qua mạng rộng, gộp chung tài nguyên, co giãn nhanh, và đo lường mức dùng. Bảng so các mô hình
      dịch vụ, ba mô hình đầu theo định nghĩa trên, còn hàm theo sự kiện là mô hình ra đời sau. Với hạ tầng như dịch vụ, ví
      dụ máy ảo, nhà cung cấp lo phần cứng, mạng vật lý và lớp ảo hoá, còn bạn lo hệ điều hành, vá lỗi, phần mềm, dữ liệu
      và quyền. Với nền tảng như dịch vụ, ví dụ cơ sở dữ liệu được quản lý, nhà cung cấp lo thêm hệ điều hành và vá lỗi, còn
      bạn lo lược đồ, dữ liệu và quyền truy cập. Với phần mềm như dịch vụ, ví dụ thư điện tử, nhà cung cấp lo gần như tất
      cả, còn bạn lo tài khoản, quyền và dữ liệu đưa vào. Với hàm theo sự kiện, nhà cung cấp lo máy chủ, co giãn và môi trường
      chạy, còn bạn lo mã hàm, quyền của hàm và dữ liệu. Ranh giới giữa nhà cung cấp đám mây và khách hàng dịch chuyển tuỳ
      theo từng tầng dịch vụ thuê ngoài. Dù thuê tới dịch vụ quản lý hoàn toàn, trách nhiệm bảo mật dữ liệu và phân quyền
      truy cập luôn thuộc về bạn.
