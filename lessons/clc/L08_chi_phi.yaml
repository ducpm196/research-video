      kế hàm đọc từ luồng chuẩn thật linh hoạt để xử lý gọn mọi bộ kiểm thử ẩn. Quy đổi lượng dữ liệu truyền ra ngoài từ tê
      ra bai sang ghi ga bai theo hệ nhị phân nhân một nghìn hai mươi tư. Tính tiền cước hằng tháng theo đơn giá rồi tính
