scenes:
- id: hook
  kind: hook
  title: Dòng hoá đơn không ai tính trước
  checks:
  - round(alg.egress_cost(50, 0.09)) == 4608
  steps:
  - show: '<p>Nhóm so sánh kỹ giá máy ảo và giá lưu trữ trước khi chuyển dịch vụ xem video lên đám mây. Tháng đầu, hoá đơn
      có một dòng lớn không ai tính: <b>dữ liệu ra Internet</b> — 50 TB (khoảng 51 nghìn GB), khoảng <b>4608 đô la</b> (số
      minh hoạ), nhiều hơn cả tiền máy.</p>

      <div class="box key">Hôm nay: <b>chi phí đám mây</b> — các khoản hay bị quên, gắn nhãn để biết ai tiêu, và chi phí trên
      một đơn vị nghiệp vụ.</div>

      '
    focus:
    - 1
    - 1
    - 2
    - 2
    - 2
    say: Chào bạn, nhóm so sánh kỹ giá máy ảo và giá lưu trữ trước khi chuyển dịch vụ xem video lên đám mây. Tháng đầu, hoá
      đơn có một dòng lớn không ai tính, là dữ liệu ra Internet, khoảng 51 nghìn GB, hết khoảng 4608 đô la theo số minh hoạ,
      nhiều hơn cả tiền máy. Hôm nay ta học chi phí đám mây, các khoản hay bị quên, gắn nhãn để biết ai tiêu, và chi phí trên
      một đơn vị nghiệp vụ. Nhiều dự án nhỏ ngã ngửa khi tiền băng thông đẩy dữ liệu ra mạng ngoài chiếm tới quá nửa tổng
      hoá đơn đám mây cuối tháng. Quản trị chi phí đám mây hiện đại đo từng phân bổ qua gắn nhãn rõ ràng và quy về chi phí
      phục vụ một giao dịch khách hàng.
- id: prereq
  kind: prereq
  title: 'Ôn lại: phần trăm thay đổi, và chia để so cho công bằng'
  checks:
  - (15000 - 12000) / 12000 == 0.25 and 2000000 / 100 == 20000 and 3000000 / 200 == 15000
  steps:
  - show: '$$\text{phần trăm thay đổi} = \frac{\text{mới} - \text{cũ}}{\text{cũ}}: \quad \frac{15\,000 - 12\,000}{12\,000}
      = 0{,}25 = 25\%$$

      '
    say: Trước hết, phần trăm thay đổi bằng mới trừ cũ, chia cũ. Ví dụ 15 nghìn so với 12 nghìn tăng 3 nghìn, chia 12 nghìn
      được 0 phẩy 25, tức 25 phần trăm. Dữ liệu nạp vào thường miễn phí hoàn toàn nhưng dữ liệu chảy xuyên vùng hay ra mạng
      công cộng luôn bị tính phí cao.
  - show: '<p>So hai quán ăn: quán A tốn 2 triệu đồng mỗi ngày phục vụ 100 khách, quán B tốn 3 triệu phục vụ 200 khách. Tổng
      của B lớn hơn, nhưng <b>mỗi khách</b>: A 20 nghìn, B chỉ 15 nghìn. Chia cho số đơn vị thì mới so công bằng.</p>

      '
    say: So hai quán ăn với số minh hoạ, quán A tốn 2 triệu đồng mỗi ngày cho 100 khách, quán B tốn 3 triệu cho 200 khách.
      Tổng của B lớn hơn, nhưng tính mỗi khách thì A là 20 nghìn, còn B chỉ 15 nghìn. Chia cho số đơn vị thì mới so sánh công
      bằng. Hệ thống gắn nhãn theo đội ngũ, dịch vụ và môi trường cắt sạch vùng mù khiến không còn tài nguyên vô chủ.
- id: sym
  kind: symbol
  title: 'Giải mã: các khoản tiền và chi phí đơn vị'
  steps:
  - show: '<table class="t"><tr><th>khoản</th><th>tính theo</th><th>hay bị quên vì</th></tr>

      <tr><td>máy, hàm</td><td>giờ, GB-giây</td><td>máy thử quên tắt</td></tr>

      <tr><td>lưu trữ</td><td>GB mỗi tháng, số lần đọc ghi</td><td>bản chụp cũ, nhật ký không có hạn xoá</td></tr>

      <tr><td><b>dữ liệu ra ngoài</b></td><td>GB ra Internet, GB giữa các vùng</td><td>không thấy khi thử với ít người dùng</td></tr>

      <tr><td>dịch vụ được quản lý</td><td>giờ chạy + yêu cầu</td><td>cổng dịch địa chỉ, bộ cân bằng tải chạy suốt</td></tr></table>

      <p><b>Gắn nhãn</b>: mỗi tài nguyên mang nhãn nhóm, dự án, môi trường. <b>Chi phí đơn vị</b> = tổng chi phí / số đơn
      vị nghiệp vụ — cho biết tăng chi phí là do <b>lớn lên</b> hay do <b>lãng phí</b>.</p>

      <p class="note"><b>Lưu lượng ra và mạng phân phối nội dung:</b> cước truyền dữ liệu rời khỏi vùng đám mây là cước ra
      (<b>Egress</b>), tính bằng đồng <b>USD</b>; lớp máy đệm đặt gần người dùng giúp giảm cước ra gọi là <b>CDN</b>.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - 2
    - 2
    - 3
    - 3
    say: Bảng liệt kê các khoản tiền. Máy và hàm tính theo giờ và GB giây, hay bị quên vì máy thử quên tắt. Lưu trữ tính theo
      GB mỗi tháng và số lần đọc ghi, hay bị quên vì bản chụp cũ và nhật ký không có hạn xoá. Dữ liệu ra ngoài tính theo GB
      ra Internet và GB giữa các vùng, hay bị quên vì không thấy khi thử với ít người dùng. Dịch vụ được quản lý tính theo
      giờ chạy và số yêu cầu, hay bị quên vì cổng dịch địa chỉ hay bộ cân bằng tải chạy suốt ngày đêm. Gắn nhãn nghĩa là mỗi
      tài nguyên mang nhãn nhóm, dự án và môi trường. Chi phí đơn vị bằng tổng chi phí chia số đơn vị nghiệp vụ, cho biết
      chi phí tăng là do lớn lên hay do lãng phí. Cước đẩy dữ liệu rời đám mây ra internet gọi là cước ra, giảm tải hiệu quả
      bằng mạng phân phối nội dung gần người dùng gần đó. Thước đo chi phí đơn vị tính theo mỗi đơn hàng hay người dùng hoạt
      động phản ánh hiệu suất thật chứ không chỉ nhìn tổng tiền.
- id: intuition
  kind: intuition
  title: Cột bên trái cao lên, cột bên phải thấp xuống
  steps:
  - show: '<div><svg width="1500" height="330" viewBox="0 0 1500 330"><g fill="#1f2937" font-size="22"><text x="330" y="40"
      text-anchor="middle" font-weight="bold">tổng chi phí mỗi tháng</text><rect x="200" y="130" width="110" height="150"
