- id: recap
  kind: recap
  title: Chuỗi logic & tư duy cần mang theo
  steps:
  - show: '<div class="chain"><span class="n">máy, lưu trữ, dữ liệu ra, dịch vụ chạy suốt</span><span class="a">→</span>

      <span class="n">dữ liệu ra ngoài: tính trước, đặt gần nhau</span><span class="a">→</span>

      <span class="n">gắn nhãn bắt buộc từ ngày đầu</span><span class="a">→</span>

      <span class="n">theo dõi chi phí đơn vị, không chỉ tổng</span></div>

      '
    say: Tổng kết lại, tiền gồm máy, lưu trữ, dữ liệu ra ngoài, và các dịch vụ chạy suốt. Dữ liệu ra ngoài phải tính trước
      và đặt các dịch vụ gần nhau. Gắn nhãn bắt buộc từ ngày đầu, và theo dõi chi phí đơn vị, không chỉ tổng. Lưu lượng truyền
      dữ liệu ra ngoài qua mạng biên và bộ đệm nội dung chiếm phần lớn hoá đơn nếu không kiểm soát. Đặt cảnh báo ngân sách
      tự động theo chi phí trên mỗi đơn hàng phơi bày sớm các lỗi vòng lặp gọi dư hoặc lưu trữ rác chưa được dọn. Gắn nhãn
      bắt buộc ngay từ mẫu mã hoá hạ tầng giúp mọi khoản chi phí trở nên minh bạch từng đội một. Gắn nhãn chi tiết mọi tài
      nguyên từ đầu mở đường minh bạch kiểm soát ngân sách đám mây theo từng sản phẩm.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.5'
    - '1.5'
    - '1.5'
  - show: '<div class="chain"><span class="n">máy, lưu trữ, dữ liệu ra, dịch vụ chạy suốt</span><span class="a">→</span>

      <span class="n">dữ liệu ra ngoài: tính trước, đặt gần nhau</span><span class="a">→</span>

      <span class="n">gắn nhãn bắt buộc từ ngày đầu</span><span class="a">→</span>

      <span class="n">theo dõi chi phí đơn vị, không chỉ tổng</span></div>

      '
    say: Giám sát hoá đơn theo đơn vị từng người dùng hoặc từng giao dịch phơi bày sớm những đoạn mã gọi lặp hoặc rò rỉ băng
      thông biên. Đặt lớp đệm nội dung hợp lý kết hợp hạn mức cảnh báo tự động giúp đội ngũ làm chủ hoàn toàn chi phí khi
      lưu lượng tăng nhanh. Kiểm soát tốt điểm truyền ra ngoài và phân bổ bộ đệm hợp lý mang lại hiệu quả tiết kiệm bền vững
      lâu dài. Ngoài ra cần rà lại dung lượng thừa định kỳ hàng tháng để cắt giảm phần lưu trữ không còn ai dùng. Theo dõi
      chi phí trên từng giao dịch giúp biến câu chuyện cắt giảm tiền bạc thành cuộc tối ưu kiến trúc thông minh.
    focus:
    - '1.1'
    - '1.2'
    - '1.3'
    - '1.4'
    - '1.4'
  - show: '<div class="box key"><b>Tư duy:</b> chi phí là một <b>chỉ số kỹ thuật</b> như độ trễ — đo nó, đặt mục tiêu cho
      nó, và cảnh báo khi nó lệch.</div>

      <p class="note"><b>So sánh hai quy mô:</b> ở mức 8 TB ra ngoài chưa lộ, nhưng lên 50 TB/tháng tiền truyền dữ liệu đạt
      4 608 đô la (giảm 70% còn 1 382 đô la nếu có lớp đệm biên); đồng thời phải tính chi phí đơn vị khi người dùng tăng từ
      400 000 lên 600 000.</p>

      '
    focus:
    - 1
    - 2
    - 2
    say: Điều cần mang theo, chi phí là một chỉ số kỹ thuật như độ trễ, nên hãy đo nó, đặt mục tiêu cho nó, và cảnh báo khi
      nó lệch. Xét hai mức quy mô, mức 8 tê ra bai truyền ra ngoài chưa thấy tốn nhiều. Giảm lưu lượng truyền dư thừa qua
      mạng công cộng bằng bộ nhớ đệm sát biên hạ đồng thời cả độ trễ lẫn tiền mạng.
  - clear: true
    show: '<p class="note">Bài sau (bài 9): <b>bảo vệ dữ liệu trên đám mây</b> — mã hoá khi lưu, quản lý khoá, mã hoá phong
      bì.</p>

      '
    forward_ref: true
    say: Ở bài sau, bài 9, ta học bảo vệ dữ liệu trên đám mây, với mã hoá khi lưu, quản lý khoá, và mã hoá phong bì. Hẹn gặp
      bạn ở bài tiếp theo. Bài tiếp theo chuyển sang bảo vệ an ninh lớp dữ liệu lõi bằng kỹ thuật quản lý khoá và mã hoá phong
      bì.
