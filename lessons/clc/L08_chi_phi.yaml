      y="92" width="110" height="188" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="405" y="82" text-anchor="middle">15
      000</text><text x="255" y="310" text-anchor="middle">tháng 1</text><text x="405" y="310" text-anchor="middle">tháng
      2</text><text x="1050" y="40" text-anchor="middle" font-weight="bold">chi phí mỗi người dùng</text><rect x="920" y="130"
      width="110" height="150" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><text x="975" y="120" text-anchor="middle">0,030</text><rect
      x="1070" y="155" width="110" height="125" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><text x="1125" y="145" text-anchor="middle">0,025</text><text
      x="975" y="310" text-anchor="middle">tháng 1</text><text x="1125" y="310" text-anchor="middle">tháng 2</text><line x1="180"
      y1="280" x2="480" y2="280" stroke="#6b7280" stroke-width="2"/><line x1="900" y1="280" x2="1200" y2="280" stroke="#6b7280"
      stroke-width="2"/><text x="680" y="170" text-anchor="middle" fill="#059669">tổng tăng, mỗi người giảm</text></g></svg></div>

      '
    focus:
    - 1
    - 1
    - 1
    - 1
    say: Hình đặt hai biểu đồ cạnh nhau. Bên trái, tổng chi phí tháng hai cao hơn tháng một, nhìn qua tưởng là lãng phí. Bên
      phải, chi phí trên mỗi người dùng lại thấp xuống, nghĩa là hệ thống đang lớn lên một cách hiệu quả. Hoá đơn tổng tăng
      thêm hai mươi phần trăm là tín hiệu rất tốt nếu cùng lúc số lượng khách hàng tăng lên gấp đôi.
- id: example
  kind: example
  title: Dữ liệu ra ngoài và chi phí mỗi người dùng
  checks:
  - round(alg.egress_cost(50, 0.09)) == 4608 and 50 * 1024 == 51200
  steps:
  - show: '<p><b>Bước 1 — dữ liệu ra ngoài</b> (số minh hoạ): nhiều bảng giá tính 1 TB = 1024 GB, nên 50 TB $= 50 \cdot 1024
      = 51\,200$ GB; nhân 0,09 đô la mỗi GB → $\hl{4608}$ đô la mỗi tháng.</p>

      '
    say: Bước một, với số minh hoạ, lượng dữ liệu là 50 lần 1024 GB, theo cách nhiều bảng giá tính, tức 50 nhân 1024, bằng
      51200 GB. Nhân 0 phẩy 09 đô la mỗi GB được khoảng 4608 đô la mỗi tháng, một khoản không thấy khi chỉ thử với ít người
      dùng.
  - show: '<table class="t"><tr><th>tháng</th><th>tổng chi phí (đô la)</th><th>người dùng</th><th>mỗi người (đô la)</th></tr>

      <tr><td>1</td><td>12 000</td><td>400 000</td><td>$\frac{12\,000}{400\,000} = 0{,}03$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    say: Bước hai, chi phí đơn vị tháng một. Tổng 12 nghìn đô la cho 400 nghìn người dùng, chia ra được 0 phẩy 03 đô la mỗi
      người.
  - show: '<table class="t"><tr><th>tháng</th><th>tổng chi phí (đô la)</th><th>người dùng</th><th>mỗi người (đô la)</th></tr>

      <tr><td>2</td><td>15 000</td><td>600 000</td><td>$\frac{15\,000}{600\,000} = 0{,}025$</td></tr></table>

      '
    focus:
    - 1
    - '1.2'
    say: Bước ba, chi phí đơn vị tháng hai. Tổng 15 nghìn đô la cho 600 nghìn người dùng, chia ra chỉ còn 0 phẩy 025 đô la
      mỗi người.
  - clear: true
    show: '<p><b>Bước 4 — đọc kết quả:</b> tổng tăng 25%, người dùng tăng 50%, nên chi phí mỗi người <b>giảm</b> — tăng trưởng
      lành mạnh, không phải lãng phí.</p>

      '
    say: Bước bốn, đọc kết quả, tổng chi phí tăng 25 phần trăm nhưng người dùng tăng 50 phần trăm. Vì người dùng tăng nhanh
      hơn chi phí, chi phí mỗi người giảm, đó là tăng trưởng lành mạnh, không phải lãng phí.
- id: check
  kind: check
  title: 'Tự kiểm: tính theo tỉ lệ tăng'
  checks:
  - round(0.03 * 1.25 / 1.5, 3) == 0.025
  steps:
  - show: '<table class="t"><tr><th>cách khác</th><th>phép tính</th><th>kết quả</th></tr>

      <tr><td>chi phí nhân 1,25, người dùng nhân 1,5</td><td>$0{,}03 \cdot \frac{1{,}25}{1{,}5}$</td><td>0,025 ✓</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.2'
    say: Kiểm bằng đường khác, không chia lại từ đầu. Vì tổng nhân 1 phẩy 25 còn số người nhân 1 phẩy 5, chi phí mỗi người
      nhân 1 phẩy 25 chia 1 phẩy 5, nên 0 phẩy 03 thành đúng 0 phẩy 025. Đo chi phí trên từng đơn vị người dùng phơi bày rõ
      hiệu quả kinh tế theo quy mô khi hạ tầng phình to.
- id: pitfalls
  kind: pitfall
  title: 3 lỗi người mới hay mắc
  steps:
  - show: '<div class="box warn"><b>Lỗi 1.</b> Không gắn nhãn từ ngày đầu <b class="red">(không biết ai tiêu tiền)</b>

      <br><span class="note">Một năm sau, hoá đơn có 3000 tài nguyên không rõ chủ. Bắt buộc nhãn khi tạo (chính sách từ chối
      tài nguyên thiếu nhãn), rồi báo cáo chi phí theo nhóm.</span></div>

      '
    say: Lỗi thứ nhất, không gắn nhãn từ ngày đầu, nên không biết ai tiêu tiền. Một năm sau, hoá đơn có 3000 tài nguyên không
      rõ chủ. Hãy bắt buộc nhãn khi tạo, bằng chính sách từ chối tài nguyên thiếu nhãn, rồi báo cáo chi phí theo nhóm. Cắt
      bớt máy một cách mù quáng khi thấy tổng hoá đơn nhích lên mà không kiểm lượng tải phục vụ sẽ giết chết độ tin cậy.
  - show: ''
    say: Phải luôn đặt ngân sách máy cạnh doanh thu hay lưu lượng giao dịch để tính đúng chi phí một đơn vị nghiệp vụ. So
      sánh trực diện chi phí hạ tầng trên mỗi đơn vị giao dịch khách hàng giúp đánh giá đúng sức khoẻ tài chính. Chuyển
      khối dữ liệu khổng lồ đi ra mạng ngoài liên tục biến chi phí băng thông thành khoản chi lớn nhất hàng tháng. Chuyển
      khối dữ liệu lớn giữa hai vùng qua đường mạng ngoài đẩy cước băng thông ra vượt quá tiền thuê máy.
  - show: '<div class="box warn"><b>Lỗi 2.</b> Đặt các dịch vụ nói chuyện nhiều ở khác vùng <b class="red">(trả tiền cho mỗi
      GB qua lại)</b>

      <br><span class="note">Truyền giữa vùng, và nhiều nơi cả giữa vùng sẵn sàng, đều tính tiền. Đặt dịch vụ gọi nhau nhiều
      ở gần nhau; dùng mạng phân phối nội dung (các máy đặt gần người dùng, giữ sẵn bản sao nội dung hay được xem) cho dữ
      liệu ra người dùng.</span></div>

      '
    say: Lỗi thứ hai, đặt các dịch vụ nói chuyện nhiều với nhau ở khác vùng, nên trả tiền cho mỗi GB qua lại. Truyền giữa các
      vùng, và nhiều nơi cả giữa các vùng sẵn sàng, đều tính tiền. Hãy đặt các dịch vụ gọi nhau nhiều ở gần nhau, và dùng
      mạng phân phối nội dung cho dữ liệu đi ra người dùng. Mạng này gồm các máy đặt gần người dùng, giữ sẵn bản sao của
      nội dung hay được xem.
  - show: ''
    say: Cho các dịch vụ trò chuyện dày đặc chạy xuyên qua hai cụm sẵn sàng khác nhau biến phí chuyển dữ liệu thành núi tiền
      ngầm. Giữ giao tiếp nội bộ dày đặc nằm cùng một cụm sẵn sàng xoá sạch khoản phụ phí truyền dữ liệu chéo vùng. Đặt
      ứng dụng nói chuyện dày đặc ở hai cụm sẵn sàng khác nhau phát sinh phụ phí truyền tải dữ liệu chéo cụm không đáng
      có.
  - clear: true
    show: '<div class="box warn"><b>Lỗi 3.</b> Chỉ nhìn tổng hoá đơn <b class="red">(phạt nhóm đang tăng trưởng)</b>

      <br><span class="note">Tổng tăng có thể là dấu hiệu tốt. Đặt mục tiêu trên chi phí đơn vị, và cảnh báo khi chi phí đơn
      vị tăng đột ngột.</span></div>

      '
    say: Lỗi thứ ba, chỉ nhìn tổng hoá đơn, nên phạt nhầm nhóm đang tăng trưởng. Tổng tăng có thể là dấu hiệu tốt. Hãy đặt
      mục tiêu trên chi phí đơn vị, và cảnh báo khi chi phí đơn vị tăng đột ngột. Bỏ quên hàng trăm ổ đĩa mồ côi vẫn còn giữ
      nguyên trên hệ thống sau khi người dùng đã tắt máy ảo chạy thử. Tự động rà quét dọn sạch ổ đĩa và địa chỉ mạng bỏ hoang
      hằng tuần giúp không còn chi phí âm thầm rò rỉ. Quên cài cảnh báo ngân sách tự động khiến một vòng lặp lỗi gây hoá đơn
      hàng trăm triệu đồng chỉ sau cuối tuần.
- id: quiz
  kind: quiz
  title: Đến lượt bạn
  checks:
  - round(alg.egress_cost(8, 0.09), 2) == 737.28 and round(9000 / 300000, 3) == 0.03 and round(9900 / 300000, 3) == 0.033
  steps:
  - show: '<table class="t"><tr><th>câu</th><th>đề</th></tr>

      <tr><td>1</td><td>8 TB (mỗi TB 1024 GB) ra Internet mỗi tháng, 0,09 đô la mỗi GB. Bao nhiêu tiền?</td></tr>

      <tr><td>2</td><td>Tháng này 9900 đô la cho 300 000 đơn hàng, tháng trước 9000 đô la cho cùng số đơn. Chi phí mỗi đơn
      đổi thế nào, có đáng lo không?</td></tr></table>

      '
    focus:
    - 0
    - '1.2'
    - '1.3'
    - '1.3'
    - 0
    say: Bây giờ đến lượt bạn tự làm. Câu một, mỗi tháng có 8 lần 1024 GB ra Internet, giá 0 phẩy 09 đô la mỗi GB, tốn bao
      nhiêu tiền? Câu hai, tháng này 9900 đô la cho 300 nghìn đơn hàng, tháng trước 9000 đô la cho cùng số đơn. Chi phí mỗi
      đơn đổi thế nào, và có đáng lo không? Dừng video và làm ra giấy.
    pause: 15
  - show: '<p>① $8 \cdot 1024 = 8192$ GB; $8192 \cdot 0{,}09 = \hl{737{,}28}$ đô la.</p>

      '
    say: Đáp án câu một, 8 nhân 1024 bằng 8192 GB, nhân 0 phẩy 09 đô la mỗi GB, bằng 737 phẩy 28 đô la. Tính chính xác tổng
      chi phí băng thông xuyên vùng kết hợp cước lưu trữ để tìm ra khoản rò tiền lớn nhất.
  - show: '<table class="t"><tr><th>tháng</th><th>tổng</th><th>đơn hàng</th><th>mỗi đơn</th></tr>

      <tr><td>trước</td><td>9000</td><td>300 000</td><td>0,030</td></tr>

      <tr><td>này</td><td>9900</td><td>300 000</td><td>0,033</td></tr></table>

      <p>② Tăng $\frac{0{,}033 - 0{,}030}{0{,}030} = 10\%$ mà số đơn <b>không đổi</b> → đáng lo; tìm theo nhãn xem nhóm nào,
      dịch vụ nào tăng.</p>

      '
    focus:
    - 1
    - '1.2'
    - '1.3'
    - 2
    say: Câu hai, chia ra từng tháng. Tháng trước 0 phẩy 030 đô la mỗi đơn. Tháng này 0 phẩy 033 đô la mỗi đơn. Tăng 10 phần
      trăm mà số đơn không đổi, nên đáng lo, hãy tìm theo nhãn xem nhóm nào, dịch vụ nào tăng.
