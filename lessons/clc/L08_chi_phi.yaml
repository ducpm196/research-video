scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Dòng hoá đơn không ai tính trước"
    checks:
      - "round(alg.egress_cost(50, 0.09)) == 4608"
    steps:
      - show: |
          <p>Nhóm so sánh kỹ giá máy ảo và giá lưu trữ trước khi chuyển dịch vụ xem video lên đám mây. Tháng đầu, hoá đơn có một dòng lớn không ai tính: <b>dữ liệu ra Internet</b> — 50 TB, khoảng <b>4608 đô la</b>, nhiều hơn cả tiền máy.</p>
          <div class="box key">Hôm nay: <b>chi phí đám mây</b> — các khoản hay bị quên, gắn nhãn để biết ai tiêu, và chi phí trên một đơn vị nghiệp vụ.</div>
        focus: [1, 1, 2]
        say: "Chào bạn, nhóm so sánh kỹ giá máy ảo và giá lưu trữ trước khi chuyển dịch vụ xem video lên đám mây. Tháng đầu, hoá đơn có một dòng lớn không ai tính, là dữ liệu ra Internet, khoảng 51 nghìn GB, hết khoảng 4608 đô la, nhiều hơn cả tiền máy. Hôm nay ta học chi phí đám mây, các khoản hay bị quên, gắn nhãn để biết ai tiêu, và chi phí trên một đơn vị nghiệp vụ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Ôn lại: phần trăm thay đổi, và chia để so cho công bằng"
    checks:
      - "(15000 - 12000) / 12000 == 0.25 and (600000 - 400000) / 400000 == 0.5 and 50 * 1024 == 51200"
    steps:
      - show: |
          $$\text{phần trăm thay đổi} = \frac{\text{mới} - \text{cũ}}{\text{cũ}}: \quad \frac{15\,000 - 12\,000}{12\,000} = 0{,}25 = 25\%$$
        say: "Trước hết, phần trăm thay đổi bằng mới trừ cũ, chia cũ. Ví dụ 15 nghìn so với 12 nghìn tăng 3 nghìn, chia 12 nghìn được 0 phẩy 25, tức 25 phần trăm."
      - show: |
          <p>So hai quán ăn: quán A tốn 2 triệu đồng mỗi ngày phục vụ 100 khách, quán B tốn 3 triệu phục vụ 200 khách. Tổng của B lớn hơn, nhưng <b>mỗi khách</b>: A 20 nghìn, B chỉ 15 nghìn. Chia cho số đơn vị thì mới so công bằng.</p>
        say: "So hai quán ăn với số minh hoạ, quán A tốn 2 triệu đồng mỗi ngày cho 100 khách, quán B tốn 3 triệu cho 200 khách. Tổng của B lớn hơn, nhưng tính mỗi khách thì A là 20 nghìn, còn B chỉ 15 nghìn. Chia cho số đơn vị thì mới so sánh công bằng."

  - id: sym
    kind: symbol
    title: "Giải mã: các khoản tiền và chi phí đơn vị"
    steps:
      - show: |
          <table class="t"><tr><th>khoản</th><th>tính theo</th><th>hay bị quên vì</th></tr>
          <tr><td>máy, hàm</td><td>giờ, GB-giây</td><td>máy thử quên tắt</td></tr>
          <tr><td>lưu trữ</td><td>GB mỗi tháng, số lần đọc ghi</td><td>bản chụp cũ, nhật ký không có hạn xoá</td></tr>
          <tr><td><b>dữ liệu ra ngoài</b></td><td>GB ra Internet, GB giữa các vùng</td><td>không thấy khi thử với ít người dùng</td></tr>
          <tr><td>dịch vụ được quản lý</td><td>giờ chạy + yêu cầu</td><td>cổng dịch địa chỉ, bộ cân bằng tải chạy suốt</td></tr></table>
          <p><b>Gắn nhãn</b>: mỗi tài nguyên mang nhãn nhóm, dự án, môi trường. <b>Chi phí đơn vị</b> = tổng chi phí / số đơn vị nghiệp vụ — cho biết tăng chi phí là do <b>lớn lên</b> hay do <b>lãng phí</b>.</p>
        focus: [1, "1.2", "1.3", "1.4", "1.5", 2, 2]
        say: "Bảng liệt kê các khoản tiền. Máy và hàm tính theo giờ và GB giây, hay bị quên vì máy thử quên tắt. Lưu trữ tính theo GB mỗi tháng và số lần đọc ghi, hay bị quên vì bản chụp cũ và nhật ký không có hạn xoá. Dữ liệu ra ngoài tính theo GB ra Internet và GB giữa các vùng, hay bị quên vì không thấy khi thử với ít người dùng. Dịch vụ được quản lý tính theo giờ chạy và số yêu cầu, hay bị quên vì cổng dịch địa chỉ hay bộ cân bằng tải chạy suốt ngày đêm. Gắn nhãn nghĩa là mỗi tài nguyên mang nhãn nhóm, dự án và môi trường. Chi phí đơn vị bằng tổng chi phí chia số đơn vị nghiệp vụ, cho biết chi phí tăng là do lớn lên hay do lãng phí."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Cột bên trái cao lên, cột bên phải thấp xuống"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><g fill="#1f2937" font-size="22"><text x="330" y="40" text-anchor="middle" font-weight="bold">tổng chi phí mỗi tháng</text><rect x="200" y="130" width="110" height="150" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="255" y="120" text-anchor="middle">12 000</text><rect x="350" y="92" width="110" height="188" fill="#93c5fd" stroke="#2a78d6" stroke-width="2"/><text x="405" y="82" text-anchor="middle">15 000</text><text x="255" y="310" text-anchor="middle">tháng 1</text><text x="405" y="310" text-anchor="middle">tháng 2</text><text x="1050" y="40" text-anchor="middle" font-weight="bold">chi phí mỗi người dùng</text><rect x="920" y="130" width="110" height="150" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><text x="975" y="120" text-anchor="middle">0,030</text><rect x="1070" y="155" width="110" height="125" fill="#fed7aa" stroke="#eb6834" stroke-width="2"/><text x="1125" y="145" text-anchor="middle">0,025</text><text x="975" y="310" text-anchor="middle">tháng 1</text><text x="1125" y="310" text-anchor="middle">tháng 2</text><line x1="180" y1="280" x2="480" y2="280" stroke="#6b7280" stroke-width="2"/><line x1="900" y1="280" x2="1200" y2="280" stroke="#6b7280" stroke-width="2"/><text x="680" y="170" text-anchor="middle" fill="#059669">tổng tăng, mỗi người giảm</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình đặt hai biểu đồ cạnh nhau. Bên trái, tổng chi phí tháng hai cao hơn tháng một, nhìn qua tưởng là lãng phí. Bên phải, chi phí trên mỗi người dùng lại thấp xuống, nghĩa là hệ thống đang lớn lên một cách hiệu quả."

  - id: example
    kind: example
    title: "Dữ liệu ra ngoài và chi phí mỗi người dùng"
    checks:
      - "round(alg.egress_cost(50, 0.09)) == 4608 and 50 * 1024 == 51200"
      - "round(12000 / 400000, 3) == 0.03 and round(15000 / 600000, 3) == 0.025"
    steps:
      - show: |
          <p><b>Bước 1 — dữ liệu ra ngoài</b> (số minh hoạ): 50 TB $= 50 \cdot 1024 = 51\,200$ GB; nhân 0,09 đô la mỗi GB → $\hl{4608}$ đô la mỗi tháng.</p>
        say: "Bước một, với số minh hoạ, 50 nghìn GB theo cách tính của bảng giá là 50 nhân 1024, bằng 51200 GB. Nhân 0 phẩy 09 đô la mỗi GB được khoảng 4608 đô la mỗi tháng, một khoản không thấy khi chỉ thử với ít người dùng."
      - show: |
          <table class="t"><tr><th>tháng</th><th>tổng chi phí</th><th>người dùng</th><th>mỗi người</th></tr>
          <tr><td>1</td><td>12 000</td><td>400 000</td><td>$\frac{12\,000}{400\,000} = 0{,}03$</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước hai, chi phí đơn vị tháng một. Tổng 12 nghìn đô la cho 400 nghìn người dùng, chia ra được 0 phẩy 03 đô la mỗi người."
      - show: |
          <table class="t"><tr><th>tháng</th><th>tổng chi phí</th><th>người dùng</th><th>mỗi người</th></tr>
          <tr><td>2</td><td>15 000</td><td>600 000</td><td>$\frac{15\,000}{600\,000} = 0{,}025$</td></tr></table>
        focus: [1, "1.2"]
        say: "Bước ba, chi phí đơn vị tháng hai. Tổng 15 nghìn đô la cho 600 nghìn người dùng, chia ra chỉ còn 0 phẩy 025 đô la mỗi người."
      - clear: true
        show: |
          <p><b>Bước 4 — đọc kết quả:</b> tổng tăng 25%, người dùng tăng 50%, nên chi phí mỗi người <b>giảm</b> — tăng trưởng lành mạnh, không phải lãng phí.</p>
        say: "Bước bốn, đọc kết quả, tổng chi phí tăng 25 phần trăm nhưng người dùng tăng 50 phần trăm. Vì người dùng tăng nhanh hơn chi phí, chi phí mỗi người giảm, đó là tăng trưởng lành mạnh, không phải lãng phí."

  - id: check
    kind: check
    title: "Tự kiểm: tính theo tỉ lệ tăng"
    checks:
      - "round(0.03 * 1.25 / 1.5, 4) == 0.025"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>chi phí nhân 1,25, người dùng nhân 1,5</td><td>$0{,}03 \cdot \frac{1{,}25}{1{,}5}$</td><td>0,025 ✓</td></tr></table>
        focus: [1, "1.2"]
        say: "Kiểm bằng đường khác, không chia lại từ đầu. Vì tổng nhân 1 phẩy 25 còn số người nhân 1 phẩy 5, chi phí mỗi người nhân 1 phẩy 25 chia 1 phẩy 5, nên 0 phẩy 03 thành đúng 0 phẩy 025."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Không gắn nhãn từ ngày đầu <b class="red">(không biết ai tiêu tiền)</b>
          <br><span class="note">Một năm sau, hoá đơn có 3000 tài nguyên không rõ chủ. Bắt buộc nhãn khi tạo (chính sách từ chối tài nguyên thiếu nhãn), rồi báo cáo chi phí theo nhóm.</span></div>
        say: "Lỗi thứ nhất, không gắn nhãn từ ngày đầu, nên không biết ai tiêu tiền. Một năm sau, hoá đơn có 3000 tài nguyên không rõ chủ. Hãy bắt buộc nhãn khi tạo, bằng chính sách từ chối tài nguyên thiếu nhãn, rồi báo cáo chi phí theo nhóm."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Đặt các dịch vụ nói chuyện nhiều ở khác vùng <b class="red">(trả tiền cho mỗi GB qua lại)</b>
          <br><span class="note">Truyền giữa vùng, và nhiều nơi cả giữa vùng sẵn sàng, đều tính tiền. Đặt dịch vụ gọi nhau nhiều ở gần nhau; dùng mạng phân phối nội dung cho dữ liệu ra người dùng.</span></div>
        say: "Lỗi thứ hai, đặt các dịch vụ nói chuyện nhiều với nhau ở khác vùng, nên trả tiền cho mỗi GB qua lại. Truyền giữa các vùng, và nhiều nơi cả giữa các vùng sẵn sàng, đều tính tiền. Hãy đặt các dịch vụ gọi nhau nhiều ở gần nhau, và dùng mạng phân phối nội dung cho dữ liệu đi ra người dùng."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Chỉ nhìn tổng hoá đơn <b class="red">(phạt nhóm đang tăng trưởng)</b>
          <br><span class="note">Tổng tăng có thể là dấu hiệu tốt. Đặt mục tiêu trên chi phí đơn vị, và cảnh báo khi chi phí đơn vị tăng đột ngột.</span></div>
        say: "Lỗi thứ ba, chỉ nhìn tổng hoá đơn, nên phạt nhầm nhóm đang tăng trưởng. Tổng tăng có thể là dấu hiệu tốt. Hãy đặt mục tiêu trên chi phí đơn vị, và cảnh báo khi chi phí đơn vị tăng đột ngột."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "round(alg.egress_cost(8, 0.09), 2) == 737.28 and round(9000 / 300000, 3) == 0.03 and round(9900 / 300000, 3) == 0.033"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>8 TB ra Internet mỗi tháng, 0,09 đô la mỗi GB. Bao nhiêu tiền?</td></tr>
          <tr><td>2</td><td>Tháng này 9900 đô la cho 300 000 đơn hàng, tháng trước 9000 đô la cho cùng số đơn. Chi phí mỗi đơn đổi thế nào, có đáng lo không?</td></tr></table>
        focus: [0, "1.2", "1.3", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 8 nghìn 192 GB ra Internet mỗi tháng, 0 phẩy 09 đô la mỗi GB, tốn bao nhiêu tiền? Câu hai, tháng này 9900 đô la cho 300 nghìn đơn hàng, tháng trước 9000 đô la cho cùng số đơn. Chi phí mỗi đơn đổi thế nào, và có đáng lo không? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $8 \cdot 1024 = 8192$ GB; $8192 \cdot 0{,}09 = \hl{737{,}28}$ đô la.</p>
        say: "Đáp án câu một, 8 nhân 1024 bằng 8192 GB, nhân 0 phẩy 09 đô la mỗi GB, bằng 737 phẩy 28 đô la."
      - show: |
          <table class="t"><tr><th>tháng</th><th>tổng</th><th>đơn hàng</th><th>mỗi đơn</th></tr>
          <tr><td>trước</td><td>9000</td><td>300 000</td><td>0,030</td></tr>
          <tr><td>này</td><td>9900</td><td>300 000</td><td>0,033</td></tr></table>
          <p>② Tăng $\frac{0{,}033 - 0{,}030}{0{,}030} = 10\%$ mà số đơn <b>không đổi</b> → đáng lo; tìm theo nhãn xem nhóm nào, dịch vụ nào tăng.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, chia ra từng tháng. Tháng trước 0 phẩy 030 đô la mỗi đơn. Tháng này 0 phẩy 033 đô la mỗi đơn. Tăng 10 phần trăm mà số đơn không đổi, nên đáng lo, hãy tìm theo nhãn xem nhóm nào, dịch vụ nào tăng."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">máy, lưu trữ, dữ liệu ra, dịch vụ chạy suốt</span><span class="a">→</span>
          <span class="n">dữ liệu ra ngoài: tính trước, đặt gần nhau</span><span class="a">→</span>
