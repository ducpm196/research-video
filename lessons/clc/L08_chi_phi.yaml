# Quy ước: MỌI ĐƠN GIÁ LÀ SỐ MINH HOẠ. Tính 1 TB = 1024 GB như nhiều bảng giá (alg.egress_cost). Dữ liệu VÀO thường miễn phí, dữ liệu RA Internet tính
#   theo GB. Chi phí đơn vị = tổng chi phí / số đơn vị nghiệp vụ (người dùng, đơn hàng). Tên TB chỉ trên màn hình; lời đọc nói “nghìn GB”.
objectives:
  - "Ước lượng chi phí truyền dữ liệu ra ngoài"
  - "Gắn nhãn để biết ai tiêu tiền"
  - "Theo dõi chi phí trên một người dùng hay một giao dịch"
