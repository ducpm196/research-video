id: L04
course: CLC
series: "CLC · Điện toán đám mây"
title: "Bài 4 — Lưu trữ: đối tượng, khối, tệp và độ bền"
voice: vi-VN-NamMinhNeural
rate: "-5%"
depth: full
source: "curriculum/clc.yaml L04; audit/clc/verify_clc.py L04; tài liệu lưu trữ đối tượng của một nhà cung cấp lớn — “designed for 99.999999999% durability” (bản hiện hành, tên chỉ trên màn hình); bài 0, 3"
assumes: [arith, power, cdot]
# Quy ước: độ bền năm d = xác suất một đối tượng KHÔNG mất trong một năm do hỏng phần cứng; kỳ vọng mất = n · (1 − d) (alg.expected_object_loss).
#   Độ bền là con số THIẾT KẾ của nhà cung cấp, không phải cam kết hợp đồng; không tính xoá nhầm, mã độc, lỗi phần mềm của khách.
#   Tên S3, EBS, EFS chỉ trên màn hình.
objectives:
  - "Chọn loại lưu trữ theo mẫu truy cập"
  - "Hiểu đúng con số độ bền"
  - "Biết độ bền không thay được sao lưu"
asr_reviewed:
  - {sentence: "Lưu trữ khối là một ổ đĩa thường gắn vào một máy ảo, sửa từng khối nhỏ với độ trễ thấp, hợp với ổ hệ điều hành và cơ sở dữ liệu tự quản.", reason: "ASR chép “Lưu trữ khối là một ổ đĩa thương gắn vào một máy ảo, sự từng khối nhỏ với độ trễ thấp, hợp với ô hệ điều hành và cơ sở dữ liệu tư quản.” (0.882): lệch âm/thanh thuần Việt: thường/thương, sửa/sự, ổ/ô, tự/tư (bản chép “tư quản”; bộ so khớp ghép nhầm cặp “tự/bốn”) — NOT_VERIFIED bằng tai người"}
  - {sentence: "Lưu trữ đối tượng đọc ghi cả đối tượng qua HTTP theo khoá, không sửa giữa chừng, và gần như không giới hạn dung lượng, hợp với ảnh, video, sao lưu, nhật ký và hồ dữ liệu.", reason: "ASR chép “Lưu trữ đối tượng đọc ghi cả đối tượng qua Http theo khóa, không sửa giữa chân và gần như không giới hạn dung lượng, hợp với ảnh, video, sao lưu, nhật ký và hồ dữ liệu.” (0.973): lệch âm/thanh thuần Việt: chừng/chân — NOT_VERIFIED bằng tai người"}
scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Mười một số 9 — và vẫn mất dữ liệu"
    checks:
      - "round(1 - 0.99999999999, 11) == 1e-11"
    steps:
      - show: |
          <p>Kho lưu trữ đối tượng quảng cáo độ bền thiết kế <b>99,999999999%</b> — mười một chữ số 9. Thế mà một công ty vẫn mất toàn bộ ảnh sản phẩm trong một buổi chiều: một kịch bản dọn dẹp chạy sai thư mục và <b>xoá</b> chúng. Phần cứng không hỏng gì cả.</p>
          <div class="box key">Hôm nay: ba loại <b>lưu trữ</b> trên đám mây, cách đọc đúng con số độ bền, và điều độ bền <b>không</b> bảo vệ.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, kho lưu trữ đối tượng quảng cáo độ bền thiết kế 99 phẩy, rồi chín chữ số 9, tổng cộng mười một chữ số 9. Thế mà một công ty vẫn mất toàn bộ ảnh sản phẩm trong một buổi chiều, vì một kịch bản dọn dẹp chạy sai thư mục và xoá chúng. Phần cứng không hỏng gì cả. Hôm nay ta học ba loại lưu trữ trên đám mây, cách đọc đúng con số độ bền, và điều mà độ bền không bảo vệ."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: lũy thừa âm của 10, và kỳ vọng bằng số lần nhân xác suất"
    checks:
      - "10 ** -3 == 0.001 and 7 + (-11) == -4 and round(1000 * 0.001, 9) == 1"
      - "[10 ** 2, 10 ** 1, 10 ** 0] == [100, 10, 1] and round(10 ** -1, 9) == 0.1 and 10 ** 2 * 10 ** 3 == 100 * 1000 == 10 ** 5"
    steps:
      - show: |
          <table class="t"><tr><th>lũy thừa</th><th>bằng</th></tr>
          <tr><td>$10^2$</td><td>100</td></tr><tr><td>$10^1$</td><td>10</td></tr><tr><td>$10^0$</td><td>1</td></tr>
          <tr><td>$10^{-1}$</td><td>0,1</td></tr><tr><td>$10^{-3}$</td><td>0,001</td></tr></table>
          <p>Mỗi lần số mũ giảm 1 là <b>chia 10</b>, nên số mũ âm nghĩa là 1 chia: $10^{-3}$ = 1 chia $10^3$.</p>
        introduces: [inverse]
        focus: ["1.2", 2, "1.6"]
        say: "Trước hết, nhắc lại từ đầu về lũy thừa của 10, ví dụ 10 mũ 2 là 100, còn 10 mũ 1 là 10. Mỗi lần số mũ giảm 1 thì ta chia cho 10, nên 10 mũ 0 bằng 1, và 10 mũ âm 1 bằng 0 phẩy 1. Cứ thế, 10 mũ âm 3 bằng 1 chia 10 mũ 3, tức 0 phẩy 001."
      - show: |
          <p>Nhân hai lũy thừa của 10 thì <b>cộng</b> số mũ, vì mỗi số mũ đếm số lần nhân (hay chia) cho 10: $10^2 \cdot 10^3 = 100 \cdot 1000 = 10^5$, và $10^{7} \cdot 10^{-11} = 10^{7 + (-11)} = 10^{-4}$.</p>
        say: "Nhân hai lũy thừa của 10 thì cộng số mũ, vì mỗi số mũ đếm số lần nhân hay chia cho 10. Ví dụ 10 mũ 2 nhân 10 mũ 3 là 100 nhân 1000, bằng 10 mũ 5. Tương tự, 10 mũ 7 nhân 10 mũ âm 11 bằng 10 mũ âm 4, vì 7 cộng âm 11 bằng âm 4."
      - clear: true
        show: |
          <p><b>Kỳ vọng</b> là số lần xảy ra <b>trung bình</b> nếu lặp lại rất nhiều lần. Có $n$ lần thử, mỗi lần xảy ra với xác suất $p$, thì mỗi lần góp trung bình $p$, cả thảy $n \cdot p$ lần.</p>
          <p>1000 tấm vé, mỗi vé trúng với xác suất 0,001 → trung bình trúng $1000 \cdot 0{,}001 = 1$ vé. Có đợt trúng 0 vé, có đợt trúng 2 vé, nhưng tính trung bình qua nhiều đợt thì gần 1.</p>
        focus: [1, 1, 2, 2]
        say: "Còn kỳ vọng là số lần xảy ra trung bình, nếu ta lặp lại rất nhiều lần. Có n lần thử, mỗi lần xảy ra với xác suất p, thì mỗi lần góp trung bình p, cả thảy n nhân p lần. Ví dụ 1000 tấm vé, mỗi vé trúng với xác suất 0 phẩy 001, thì trung bình trúng 1000 nhân 0 phẩy 001, bằng 1 vé. Có đợt trúng 0 vé, có đợt trúng 2 vé, nhưng tính trung bình qua nhiều đợt thì gần 1."

  - id: sym
    kind: symbol
    title: "Giải mã: ba loại lưu trữ"
    steps:
      - show: |
          <table class="t"><tr><th>loại</th><th>cách dùng</th><th>hợp với</th></tr>
          <tr><td><b>đối tượng</b></td><td>đọc ghi cả đối tượng qua HTTP (giao thức của web) theo <b>khoá</b> — tên duy nhất của đối tượng, ví dụ <code>anh/2024/meo.jpg</code>, không phải khoá mật mã; không sửa giữa chừng; gần như không giới hạn dung lượng</td><td>ảnh, video, sao lưu, nhật ký, hồ dữ liệu (nơi gom dữ liệu thô)</td></tr>
          <tr><td><b>khối</b></td><td>một “ổ đĩa” thường gắn vào <b>một</b> máy ảo, sửa từng khối nhỏ, độ trễ thấp</td><td>ổ hệ điều hành, cơ sở dữ liệu tự quản</td></tr>
          <tr><td><b>tệp</b></td><td>hệ thống tệp dùng chung, nhiều máy cùng gắn</td><td>thư mục chia sẻ, ứng dụng cũ cần đường dẫn tệp</td></tr></table>
          <p><b>Độ bền</b>: xác suất không mất do hỏng phần cứng; <b>độ sẵn sàng</b>: xác suất đọc được ngay lúc này — hai con số khác nhau.</p>
        focus: [1, "1.2", "1.2", "1.3", "1.4", 2]
        say: "Bảng so ba loại lưu trữ. Lưu trữ đối tượng đọc ghi cả đối tượng qua HTTP theo khoá, không sửa giữa chừng, và gần như không giới hạn dung lượng, hợp với ảnh, video, sao lưu, nhật ký và hồ dữ liệu. HTTP là giao thức của web, còn khoá ở đây là tên duy nhất của mỗi đối tượng, như một đường dẫn ảnh, không phải khoá mật mã, và hồ dữ liệu là nơi gom dữ liệu thô. Lưu trữ khối là một ổ đĩa thường gắn vào một máy ảo, sửa từng khối nhỏ với độ trễ thấp, hợp với ổ hệ điều hành và cơ sở dữ liệu tự quản. Lưu trữ tệp là hệ thống tệp dùng chung, nhiều máy cùng gắn, hợp với thư mục chia sẻ và ứng dụng cũ cần đường dẫn tệp. Độ bền là xác suất không mất do hỏng phần cứng, còn độ sẵn sàng là xác suất đọc được ngay lúc này, hai con số khác nhau."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Kho đồ có số, ổ đĩa riêng, thư mục chung"
    steps:
      - show: |
          <div><svg width="1500" height="330" viewBox="0 0 1500 330"><g font-size="22" fill="#1f2937"><rect x="40" y="60" width="400" height="200" rx="16" fill="#dbeafe" stroke="#2a78d6" stroke-width="3"/><text x="240" y="45" text-anchor="middle" font-weight="bold">đối tượng</text><rect x="70" y="85" width="100" height="65" rx="6" fill="#ffffff" stroke="#2a78d6"/><text x="120" y="125" text-anchor="middle" font-size="18">khoá 1</text><rect x="190" y="85" width="100" height="65" rx="6" fill="#ffffff" stroke="#2a78d6"/><text x="240" y="125" text-anchor="middle" font-size="18">khoá 2</text><rect x="310" y="85" width="100" height="65" rx="6" fill="#ffffff" stroke="#2a78d6"/><text x="360" y="125" text-anchor="middle" font-size="18">khoá 3</text><rect x="70" y="170" width="100" height="65" rx="6" fill="#ffffff" stroke="#2a78d6"/><text x="120" y="210" text-anchor="middle" font-size="18">khoá 4</text><rect x="190" y="170" width="100" height="65" rx="6" fill="#ffffff" stroke="#2a78d6"/><text x="240" y="210" text-anchor="middle" font-size="18">khoá 5</text><rect x="310" y="170" width="100" height="65" rx="6" fill="#ffffff" stroke="#2a78d6"/><text x="360" y="210" text-anchor="middle" font-size="18">khoá 6</text><text x="240" y="295" text-anchor="middle" font-size="20">lấy cả đối tượng theo khoá</text><text x="750" y="45" text-anchor="middle" font-weight="bold">khối</text><rect x="600" y="70" width="300" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="750" y="118" text-anchor="middle">máy ảo</text><line x1="750" y1="150" x2="750" y2="185" stroke="#eb6834" stroke-width="5"/><rect x="640" y="185" width="220" height="75" rx="10" fill="#ffedd5" stroke="#eb6834" stroke-width="3"/><text x="750" y="230" text-anchor="middle">ổ đĩa</text><text x="750" y="295" text-anchor="middle" font-size="20">gắn vào đúng một máy</text><text x="1250" y="45" text-anchor="middle" font-weight="bold">tệp</text><rect x="1060" y="70" width="115" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1117" y="112" text-anchor="middle" font-size="19">máy 1</text><line x1="1117" y1="140" x2="1250" y2="190" stroke="#059669" stroke-width="3"/><rect x="1195" y="70" width="115" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1252" y="112" text-anchor="middle" font-size="19">máy 2</text><line x1="1252" y1="140" x2="1250" y2="190" stroke="#059669" stroke-width="3"/><rect x="1330" y="70" width="115" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="1387" y="112" text-anchor="middle" font-size="19">máy 3</text><line x1="1387" y1="140" x2="1250" y2="190" stroke="#059669" stroke-width="3"/><rect x="1120" y="190" width="260" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="1250" y="232" text-anchor="middle">/du_lieu/anh</text><text x="1250" y="295" text-anchor="middle" font-size="20">nhiều máy, một đường dẫn</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình so ba loại lưu trữ. Lưu trữ đối tượng giống kho đồ có số, đưa khoá thì nhận lại cả món. Lưu trữ khối là ổ đĩa riêng cắm vào đúng một máy, còn lưu trữ tệp là một thư mục chung mà nhiều máy cùng mở theo một đường dẫn."

  - id: example
    kind: example
    title: "Mười triệu đối tượng mất bao nhiêu mỗi năm?"
    checks:
      - "abs(alg.expected_object_loss(1e7, 0.99999999999) - 1e-4) < 1e-10 and round(1 / alg.expected_object_loss(1e7, 0.99999999999)) == 10000"
    steps:
      - show: |
          <p><b>Bước 1</b> — độ bền 99,999999999% (11 chữ số 9) $= 0{,}99999999999$ → xác suất mất một đối tượng mỗi năm $1 - 0{,}99999999999 = 10^{-11}$.</p>
        say: "Bước một, độ bền 99 phẩy 999999999 phần trăm, tức mười một chữ số 9, bằng 0 phẩy 99999999999. Vậy xác suất mất một đối tượng mỗi năm là 1 trừ con số đó, bằng 10 mũ âm 11."
      - show: |
          <p><b>Bước 2</b> — kỳ vọng mất với $10^7$ đối tượng $= n \cdot p = 10^7 \cdot 10^{-11} = \hl{10^{-4}}$ đối tượng mỗi năm.</p>
        say: "Bước hai, kỳ vọng mất với 10 mũ 7 đối tượng bằng n nhân p, tức 10 mũ 7 nhân 10 mũ âm 11, bằng 10 mũ âm 4 đối tượng mỗi năm."
      - clear: true
        show: |
          <p><b>Bước 3</b> — đổi ra thời gian: $\frac{1}{10^{-4}} = 10^4 = 10\,000$ → trung bình mất 1 đối tượng mỗi <b>10 000 năm</b>.</p>
        say: "Bước ba, đổi ra thời gian, 1 chia 10 mũ âm 4 bằng 10 mũ 4, nên trung bình mất 1 đối tượng mỗi 10 nghìn năm."
      - show: |
          <table class="t"><tr><th>nguyên nhân mất dữ liệu</th><th>độ bền có che không?</th></tr>
          <tr><td>ổ đĩa, máy chủ hỏng</td><td>có — gần như không bao giờ mất</td></tr>
          <tr><td>người xoá nhầm, phần mềm ghi đè, mã độc mã hoá</td><td><b class="red">không</b> — kho làm đúng lệnh “xoá”</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Bước bốn, so các nguyên nhân mất dữ liệu. Với ổ đĩa và máy chủ hỏng, độ bền che được, nên gần như không bao giờ mất. Với người xoá nhầm, phần mềm ghi đè hay mã độc mã hoá, độ bền không che được gì, vì kho chỉ làm đúng lệnh xoá."

  - id: check
    kind: check
    title: "Tự kiểm: đếm theo đối tượng nhân năm"
    checks:
      - "abs(1e7 * 1e4 * 1e-11 - 1) < 1e-9 and str(99.999999999).count('9') == 11"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>10 triệu đối tượng giữ suốt 10 000 năm</td><td>$10^7 \cdot 10^4 = 10^{11}$ “đối tượng nhân năm”</td><td></td></tr>
          <tr><td>mỗi đối tượng nhân năm mất với xác suất $10^{-11}$</td><td>$10^{11} \cdot 10^{-11}$</td><td>đúng 1 lần mất ✓</td></tr></table>
        focus: [1, "1.2", "1.3"]
        say: "Kiểm bằng đường khác, đếm theo đối tượng nhân năm. 10 triệu đối tượng giữ suốt 10 nghìn năm là 10 mũ 11 đối tượng nhân năm. Vì mỗi đối tượng nhân năm mất với xác suất 10 mũ âm 11, kỳ vọng đúng bằng 1 lần mất, khớp kết quả 1 đối tượng mỗi 10 nghìn năm."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Tin độ bền thay cho sao lưu <b class="red">(xoá nhầm vẫn mất)</b>
          <br><span class="note">Độ bền giữ đúng những gì bạn ra lệnh — kể cả lệnh xoá. Bật <b>phiên bản hoá</b> (kho giữ lại bản cũ khi đối tượng bị ghi đè hay xoá), <b>khoá chống xoá có thời hạn</b> (trong thời hạn đó, chế độ chặt nhất không ai xoá được), và sao lưu sang tài khoản khác với quyền tách biệt.</span></div>
        say: "Lỗi thứ nhất, tin độ bền thay cho sao lưu, nên xoá nhầm vẫn mất. Độ bền giữ đúng những gì bạn ra lệnh, kể cả lệnh xoá. Hãy bật phiên bản hoá, tức kho giữ lại bản cũ khi đối tượng bị ghi đè hay xoá, và khoá chống xoá có thời hạn, trong thời hạn đó, chế độ chặt nhất không ai xoá được. Thêm nữa, hãy sao lưu sang một tài khoản khác với quyền tách biệt."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Dùng lưu trữ đối tượng như ổ đĩa <b class="red">(sửa từng dòng rất chậm)</b>
          <br><span class="note">Với đối tượng thông thường, muốn thêm một dòng vào tệp nhật ký 1 GB là phải ghi lại cả 1 GB. Ghi thành nhiều đối tượng nhỏ theo thời gian, hoặc dùng lưu trữ khối cho dữ liệu sửa liên tục.</span></div>
        say: "Lỗi thứ hai, dùng lưu trữ đối tượng như một ổ đĩa, nên sửa từng dòng rất chậm. Với đối tượng thông thường, muốn thêm một dòng vào tệp nhật ký 1 GB là phải ghi lại cả 1 GB. Hãy ghi thành nhiều đối tượng nhỏ theo thời gian, hoặc dùng lưu trữ khối cho dữ liệu sửa liên tục."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Ổ khối chỉ ở một vùng sẵn sàng <b class="red">(vùng hỏng, ổ không gắn được chỗ khác)</b>
          <br><span class="note">Ổ khối gắn với một vùng sẵn sàng (một hay vài trung tâm dữ liệu có điện, mạng riêng). <b>Chụp nhanh</b> định kỳ — bản sao toàn bộ ổ tại một thời điểm, nằm ở lưu trữ đối tượng, dùng được ở vùng sẵn sàng khác — hoặc dùng cơ sở dữ liệu có bản sao.</span></div>
        say: "Lỗi thứ ba, ổ khối chỉ nằm ở một vùng sẵn sàng, tức một hay vài trung tâm dữ liệu có điện và mạng riêng, nên khi vùng đó hỏng thì ổ không gắn được chỗ khác. Hãy chụp nhanh định kỳ, tức chép toàn bộ ổ tại một thời điểm, hoặc dùng cơ sở dữ liệu có bản sao. Bản chụp nằm ở lưu trữ đối tượng, nên dùng được ở vùng sẵn sàng khác."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "abs(alg.expected_object_loss(1e9, 0.99999999999) - 0.01) < 1e-8 and round(1 / alg.expected_object_loss(1e9, 0.99999999999)) == 100"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>Một tỉ đối tượng, cùng độ bền thiết kế. Kỳ vọng mất bao nhiêu mỗi năm? Trung bình bao nhiêu năm mất một đối tượng?</td></tr>
          <tr><td>2</td><td>Ứng dụng chỉnh ảnh cần một thư mục mà ba máy ảo cùng đọc ghi theo đường dẫn tệp. Chọn loại lưu trữ nào?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, có một tỉ đối tượng, cùng độ bền thiết kế. Kỳ vọng mất bao nhiêu mỗi năm, và trung bình bao nhiêu năm mất một đối tượng? Câu hai, ứng dụng chỉnh ảnh cần một thư mục mà ba máy ảo cùng đọc ghi theo đường dẫn tệp, chọn loại lưu trữ nào? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <p>① $10^9 \cdot 10^{-11} = 10^{-2} = \hl{0{,}01}$ đối tượng mỗi năm → $\frac{1}{0{,}01} = 100$: trung bình 1 đối tượng mỗi <b>100</b> năm.</p>
        say: "Đáp án câu một, 10 mũ 9 nhân 10 mũ âm 11, bằng 10 mũ âm 2, tức 0 phẩy 01 đối tượng mỗi năm. 1 chia 0 phẩy 01 bằng 100, nên trung bình 1 đối tượng mỗi 100 năm."
      - show: |
          <table class="t"><tr><th>yêu cầu</th><th>đối tượng</th><th>khối</th><th>tệp</th></tr>
          <tr><td>ba máy cùng gắn</td><td>—</td><td>không (một máy)</td><td>có</td></tr>
          <tr><td>đường dẫn tệp</td><td>không</td><td>có</td><td>có</td></tr></table>
          <p>② Chỉ <b>lưu trữ tệp</b> thoả cả hai.</p>
        focus: [1, "1.2", "1.3", 2]
        say: "Câu hai, so hai yêu cầu với ba loại. Ba máy cùng gắn thì ổ khối không làm được, vì chỉ gắn một máy. Đường dẫn tệp thì lưu trữ đối tượng không có. Chỉ lưu trữ tệp dùng chung thoả cả hai yêu cầu."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">đối tượng: theo khoá, không giới hạn</span><span class="a">→</span>
          <span class="n">khối: một máy, sửa nhỏ, nhanh</span><span class="a">→</span>
          <span class="n">tệp: nhiều máy dùng chung</span><span class="a">→</span>
          <span class="n">độ bền chống hỏng máy, không chống xoá nhầm</span></div>
        say: "Tổng kết lại, lưu trữ đối tượng đọc theo khoá và gần như không giới hạn, lưu trữ khối gắn một máy và sửa nhỏ rất nhanh, còn lưu trữ tệp cho nhiều máy dùng chung. Độ bền chống hỏng máy, nhưng không chống xoá nhầm."
      - show: |
          <div class="box key"><b>Tư duy:</b> hãy hỏi một con số <b>bảo vệ khỏi điều gì</b> — 11 số 9 trước sét đánh, 0 số 9 trước lệnh xoá sai.</div>
        say: "Điều cần mang theo, hãy hỏi một con số bảo vệ khỏi điều gì, mười một số 9 trước sét đánh, nhưng không số 9 nào trước một lệnh xoá sai."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 5): <b>máy ảo, co giãn và cách trả tiền</b>.</p>
        forward_ref: true
        say: "Ở bài sau, bài 5, ta học máy ảo, co giãn, và cách trả tiền. Hẹn gặp bạn ở bài tiếp theo."
