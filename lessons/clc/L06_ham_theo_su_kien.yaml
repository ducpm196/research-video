# Quy ước: chi phí = GB-giây · đơn giá + (số lần gọi / 10^6) · đơn giá mỗi triệu lần (alg.faas_cost); GB-giây = số lần · giây mỗi lần · GB bộ nhớ.
#   Đơn giá 0,0000166667 đô la mỗi GB-giây và 0,20 đô la mỗi triệu lần gọi, máy ảo nhỏ 0,05 đô la mỗi giờ, 730 giờ mỗi tháng: SỐ MINH HOẠ, chưa trừ
#   hạn mức miễn phí. Độ trễ khởi động lạnh 800 ms là SỐ MINH HOẠ.
objectives:
  - "Tính chi phí theo số lần gọi và GB-giây"
  - "Giải thích khởi động lạnh và cách giảm"
  - "Biết khi nào máy chạy liên tục rẻ hơn"
