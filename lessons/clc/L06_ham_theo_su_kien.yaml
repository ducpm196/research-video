scenes:
  # ───────────────────────── 1. HOOK ─────────────────────────
  - id: hook
    kind: hook
    title: "Hoá đơn 2 đô la hay 90 đô la"
    checks:
      - "round(alg.faas_cost(1e6, 0.2, 0.5, 0.0000166667, 0.20), 2) == 1.87 and round(alg.faas_cost(5e7, 0.1, 1, 0.0000166667, 0.20), 2) == 93.33"
    steps:
      - show: |
          <p>Dịch vụ tạo ảnh thu nhỏ chạy bằng hàm theo sự kiện: mỗi tháng một triệu ảnh, hoá đơn chưa tới <b>2 đô la</b> — không có máy chủ nào phải trông. Một dịch vụ khác cũng chạy bằng hàm, 50 triệu lần mỗi tháng, hoá đơn hơn <b>90 đô la</b>, trong khi một máy ảo nhỏ chạy cả tháng chỉ khoảng 36,5 đô la (mọi giá trong bài là số minh hoạ).</p>
          <div class="box key">Hôm nay: <b>hàm theo sự kiện</b> — trả theo từng lần chạy, khởi động lạnh, và điểm mà máy chạy liên tục trở nên rẻ hơn.</div>
        focus: [1, 1, 1, 2]
        say: "Chào bạn, dịch vụ tạo ảnh thu nhỏ chạy bằng hàm theo sự kiện, mỗi tháng một triệu ảnh, hoá đơn chưa tới 2 đô la, và không có máy chủ nào phải trông. Một dịch vụ khác cũng chạy bằng hàm, 50 triệu lần mỗi tháng, hoá đơn hơn 90 đô la, trong khi một máy ảo nhỏ chạy cả tháng chỉ khoảng 36 phẩy 5 đô la. Mọi giá nêu trong bài này đều là số minh hoạ. Hôm nay ta học hàm theo sự kiện, trả theo từng lần chạy, khởi động lạnh, và điểm mà máy chạy liên tục trở nên rẻ hơn."

  # ───────────────────────── 2. KÝ HIỆU ─────────────────────────
  - id: prereq
    kind: prereq
    title: "Chuẩn bị: đổi đơn vị trước khi nhân"
    checks:
      - "200 / 1000 == 0.2 and 512 / 1024 == 0.5 and 10 ** 6 == 1000000 and 0.05 * 730 == 36.5"
    steps:
      - show: |
          <table class="t"><tr><th>đổi</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>200 mi li giây ra giây</td><td>$\frac{200}{1000}$</td><td>0,2 giây</td></tr>
          <tr><td>512 MB ra GB</td><td>$\frac{512}{1024}$</td><td>0,5 GB</td></tr>
          <tr><td>một triệu</td><td>$10^6$</td><td>1 000 000</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Trước hết, đổi đơn vị trước khi nhân, vì đơn giá tính theo giây và GB. 200 mi li giây chia 1000 bằng 0 phẩy 2 giây. 512 MB chia 1024 bằng 0 phẩy 5 GB. Một triệu viết là 10 mũ 6."
      - show: |
          <p>Ở bài 5: máy ảo trả <b>theo giờ chạy</b>, dù máy đang rảnh. Một tháng tính 730 giờ: máy 0,05 đô la mỗi giờ (số minh hoạ) hết $0{,}05 \cdot 730 = 36{,}5$ đô la.</p>
        say: "Ở bài 5, máy ảo trả theo giờ chạy, dù máy đang rảnh. Một tháng tính 730 giờ, nên máy 0 phẩy 05 đô la mỗi giờ, một số minh hoạ, hết 0 phẩy 05 nhân 730, bằng 36 phẩy 5 đô la."

  - id: sym
    kind: symbol
    title: "Giải mã: GB-giây, khởi động lạnh, giới hạn"
    steps:
      - show: |
          <table class="t"><tr><th>khái niệm</th><th>nghĩa</th></tr>
          <tr><td><b>hàm theo sự kiện</b></td><td>một đoạn mã chạy khi có sự kiện (ảnh mới, yêu cầu HTTP, tin nhắn), nhà cung cấp lo máy và co giãn</td></tr>
          <tr><td><b>GB-giây</b></td><td>số lần gọi nhân thời gian mỗi lần (giây) nhân bộ nhớ cấp (GB) — đơn vị tính tiền chính</td></tr>
          <tr><td><b>khởi động lạnh</b></td><td>lần gọi phải dựng môi trường mới: nạp mã, khởi tạo thư viện — chậm hơn nhiều so với gọi “ấm”</td></tr>
          <tr><td><b>giới hạn</b></td><td>thời gian chạy tối đa mỗi lần, bộ nhớ tối đa, số bản chạy đồng thời</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4", "1.5"]
        say: "Bảng có bốn khái niệm. Hàm theo sự kiện là một đoạn mã chạy khi có sự kiện, như ảnh mới, yêu cầu HTTP, hay tin nhắn, và nhà cung cấp lo máy cùng việc co giãn. GB giây bằng số lần gọi nhân thời gian mỗi lần tính bằng giây, nhân bộ nhớ cấp tính bằng GB, là đơn vị tính tiền chính. Khởi động lạnh là lần gọi phải dựng môi trường mới, nạp mã và khởi tạo thư viện, nên chậm hơn nhiều so với gọi ấm. Giới hạn gồm thời gian chạy tối đa mỗi lần, bộ nhớ tối đa, và số bản chạy đồng thời."

  # ───────────────────────── 3. VÍ DỤ ─────────────────────────
  - id: intuition
    kind: intuition
    title: "Lạnh, ấm, rồi lạnh lại"
    steps:
      - show: |
          <div><svg width="1500" height="320" viewBox="0 0 1500 320"><g font-size="22" fill="#1f2937"><rect x="60" y="110" width="260" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="190" y="153" text-anchor="middle">lạnh</text><rect x="360" y="110" width="60" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="390" y="153" text-anchor="middle">ấm</text><rect x="460" y="110" width="60" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="490" y="153" text-anchor="middle">ấm</text><rect x="560" y="110" width="60" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="590" y="153" text-anchor="middle">ấm</text><rect x="1080" y="110" width="260" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1210" y="153" text-anchor="middle">lạnh</text><line x1="40" y1="210" x2="1420" y2="210" stroke="#6b7280" stroke-width="2"/><text x="1380" y="245">thời gian</text><text x="190" y="95" text-anchor="middle" font-size="20">dựng môi trường, nạp mã</text><text x="490" y="95" text-anchor="middle" font-size="20">dùng lại môi trường</text><rect x="660" y="125" width="400" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="8 6"/><text x="860" y="152" text-anchor="middle" font-size="20">lâu không có sự kiện: môi trường bị thu hồi</text><text x="740" y="290" text-anchor="middle">chỉ trả tiền cho phần có màu, khoảng nghỉ không tốn</text></g></svg></div>
        focus: [1, 1, 1]
        say: "Hình vẽ các lần gọi một hàm theo thời gian. Lần đầu là khởi động lạnh, ô đỏ dài, vì phải dựng môi trường và nạp mã, các lần ngay sau dùng lại môi trường nên ngắn, ô xanh. Lâu không có sự kiện thì môi trường bị thu hồi, lần sau lại lạnh, và ta chỉ trả tiền cho phần có màu."

  - id: example
    kind: example
    title: "Một triệu lần, 200 mi li giây, nửa GB"
    checks:
      - "alg.faas_gb_seconds(1e6, 0.2, 0.5) == 100000 and round(100000 * 0.0000166667, 2) == 1.67 and round(alg.faas_cost(1e6, 0.2, 0.5, 0.0000166667, 0.20), 2) == 1.87"
      - "round(36.5 / alg.faas_cost(1, 0.2, 0.5, 0.0000166667, 0.20) / 1e6, 1) == 19.6 and round(0.05 * 730, 1) == 36.5"
    steps:
      - show: |
          <p><b>Bước 1 — GB-giây</b> (số minh hoạ): $10^6 \cdot 0{,}2 \cdot 0{,}5 = \hl{100\,000}$ GB-giây (lần nhân giây nhân GB).</p>
        say: "Bước một, với số minh hoạ, tính GB giây bằng 10 mũ 6 lần nhân 0 phẩy 2 giây nhân 0 phẩy 5 GB, bằng 100 nghìn GB giây."
      - show: |
          <table class="t"><tr><th>khoản tiền</th><th>phép tính</th><th>đô la</th></tr>
          <tr><td>GB-giây</td><td>$100\,000 \cdot 0{,}0000166667$</td><td>≈ 1,67</td></tr>
          <tr><td>số lần gọi</td><td>$1 \cdot 0{,}20$ (1 triệu lần, 0,20 đô la mỗi triệu)</td><td>0,20</td></tr>
          <tr><td>tổng</td><td></td><td>≈ 1,87</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Bước hai, cộng hai khoản tiền. Tiền GB giây là 100 nghìn nhân đơn giá, khoảng 1 phẩy 67 đô la. Tiền số lần gọi là 1 triệu lần nhân 0 phẩy 20 đô la mỗi triệu, bằng 0 phẩy 20 đô la. Tổng khoảng 1 phẩy 87 đô la cho một triệu lần."
      - clear: true
        show: |
          <p><b>Bước 3 — so với máy ảo</b> 36,5 đô la mỗi tháng: mỗi lần gọi tốn $\frac{1{,}867}{10^6} \approx 0{,}000001867$ đô la (giữ thêm một chữ số để phép chia không lệch) → hoà vốn $\frac{36{,}5}{0{,}000001867} \approx \hl{19{,}6}$ triệu lần mỗi tháng.</p>
        say: "Bước ba, so với máy ảo 36 phẩy 5 đô la mỗi tháng. Mỗi lần gọi tốn khoảng 1 phẩy 867 phần triệu đô la, ta giữ thêm một chữ số cho phép chia khỏi lệch. Vậy hoà vốn ở 36 phẩy 5 chia số đó, khoảng 19 phẩy 6 triệu lần mỗi tháng."
      - show: |
          <p><b>Bước 4 — quyết định:</b> dưới khoảng 19,6 triệu lần mỗi tháng, hàm rẻ hơn; nhiều hơn, máy chạy liên tục rẻ hơn (nếu một máy gánh nổi) — giống điểm hoà vốn ở bài 5.</p>
        say: "Bước bốn, quyết định, dưới khoảng 19 phẩy 6 triệu lần mỗi tháng thì hàm rẻ hơn, nhiều hơn thì máy chạy liên tục rẻ hơn, nếu một máy gánh nổi. Đây đúng là bài toán điểm hoà vốn ở bài 5."

  - id: check
    kind: check
    title: "Tự kiểm: tính lại tại điểm hoà vốn"
    checks:
      - "round(alg.faas_cost(19.6e6, 0.2, 0.5, 0.0000166667, 0.20), 1) == 36.6 and round(36.5 / alg.faas_cost(1, 0.2, 0.5, 0.0000166667, 0.20) / 1e6, 1) == 19.6"
    steps:
      - show: |
          <table class="t"><tr><th>cách khác</th><th>phép tính</th><th>kết quả</th></tr>
          <tr><td>tính thẳng tiền hàm với 19,6 triệu lần</td><td>$19{,}6 \cdot 1{,}867$ đô la</td><td>≈ 36,6 đô la ≈ giá máy 36,5 ✓</td></tr></table>
        focus: [1, "1.2"]
        say: "Kiểm bằng đường khác, vì tại điểm hoà vốn hai cách phải tốn bằng nhau, ta tính thẳng tiền hàm với 19 phẩy 6 triệu lần. Kết quả khoảng 36 phẩy 6 đô la, gần đúng bằng giá máy 36 phẩy 5 đô la, chênh chỉ do làm tròn."

  - id: pitfalls
    kind: pitfall
    title: "3 lỗi người mới hay mắc"
    steps:
      - show: |
          <div class="box warn"><b>Lỗi 1.</b> Bỏ qua khởi động lạnh cho đường cần nhanh <b class="red">(lần đầu chậm cả giây)</b>
          <br><span class="note">Gọi ấm 20 ms, khởi động lạnh 800 ms (số minh hoạ): người dùng đầu tiên sau lúc vắng chờ lâu. Giảm kích thước gói mã, khởi tạo ngoài hàm xử lý, giữ sẵn vài bản ấm cho đường quan trọng.</span></div>
        say: "Lỗi thứ nhất, bỏ qua khởi động lạnh cho đường cần nhanh, nên lần đầu chậm cả giây. Gọi ấm mất 20 mi li giây, còn khởi động lạnh mất 800 mi li giây, theo số minh hoạ, nên người dùng đầu tiên sau lúc vắng phải chờ lâu. Hãy giảm kích thước gói mã, khởi tạo ở ngoài hàm xử lý, và giữ sẵn vài bản ấm cho đường quan trọng."
      - show: |
          <div class="box warn"><b>Lỗi 2.</b> Co giãn vô hạn đè sập cơ sở dữ liệu <b class="red">(mỗi bản một kết nối)</b>
          <br><span class="note">Tải tăng vọt, nhà cung cấp chạy 1000 bản hàm cùng lúc, mỗi bản mở một kết nối: cơ sở dữ liệu chỉ nhận 200 (số minh hoạ). Đặt giới hạn đồng thời cho hàm; dùng <b>bộ gộp kết nối</b> (giữ sẵn ít kết nối, cho nhiều bản hàm dùng chung) hoặc <b>hàng đợi</b> ở giữa (việc xếp hàng chờ, xử lý dần).</span></div>
        say: "Lỗi thứ hai, co giãn vô hạn đè sập cơ sở dữ liệu, vì mỗi bản mở một kết nối. Tải tăng vọt, nhà cung cấp chạy 1000 bản hàm cùng lúc, mỗi bản mở một kết nối, trong khi cơ sở dữ liệu chỉ nhận 200, theo số minh hoạ. Hãy đặt giới hạn đồng thời cho hàm, và dùng bộ gộp kết nối, tức giữ sẵn ít kết nối cho nhiều bản hàm dùng chung. Cách khác là đặt một hàng đợi ở giữa, để việc xếp hàng chờ và được xử lý dần."
      - clear: true
        show: |
          <div class="box warn"><b>Lỗi 3.</b> Hàm gọi hàm và chờ <b class="red">(trả tiền hai lần cho thời gian chờ)</b>
          <br><span class="note">Hàm A gọi đồng bộ hàm B rồi ngồi chờ: cả hai đều tính GB-giây. Nối bằng hàng đợi hay sự kiện; việc dài thì dùng bộ điều phối luồng công việc.</span></div>
        say: "Lỗi thứ ba, để hàm gọi hàm rồi chờ, nên trả tiền hai lần cho thời gian chờ. Hàm A gọi đồng bộ hàm B rồi ngồi chờ thì cả hai đều tính GB giây. Hãy nối bằng hàng đợi hay sự kiện, còn việc dài thì dùng một bộ điều phối luồng công việc."

  # ───────────────────────── 5. TỰ LÀM ─────────────────────────
  - id: quiz
    kind: quiz
    title: "Đến lượt bạn"
    checks:
      - "alg.faas_gb_seconds(5e7, 0.1, 1) == 5e6 and round(5e6 * 0.0000166667, 2) == 83.33 and round(alg.faas_cost(5e7, 0.1, 1, 0.0000166667, 0.20), 2) == 93.33"
    steps:
      - show: |
          <table class="t"><tr><th>câu</th><th>đề</th></tr>
          <tr><td>1</td><td>50 triệu lần mỗi tháng, mỗi lần 100 ms, 1 GB, cùng đơn giá. GB-giây và tổng tiền?</td></tr>
          <tr><td>2</td><td>So với máy ảo 36,5 đô la mỗi tháng (giả sử một máy gánh được tải): nên chọn gì?</td></tr></table>
        focus: [0, "1.2", "1.2", "1.3", 0]
        say: "Bây giờ đến lượt bạn tự làm. Câu một, 50 triệu lần mỗi tháng, mỗi lần 100 mi li giây, 1 GB, cùng đơn giá. GB giây và tổng tiền là bao nhiêu? Câu hai, so với máy ảo 36 phẩy 5 đô la mỗi tháng, giả sử một máy gánh được tải, nên chọn gì? Dừng video và làm ra giấy."
        pause: 15
      - show: |
          <table class="t"><tr><th>khoản</th><th>phép tính</th><th>đô la</th></tr>
          <tr><td>GB-giây</td><td>$5 \cdot 10^7 \cdot 0{,}1 \cdot 1 = 5 \cdot 10^6$ → nhân đơn giá</td><td>≈ 83,33</td></tr>
          <tr><td>số lần gọi</td><td>$50 \cdot 0{,}20$</td><td>10</td></tr>
          <tr><td>tổng</td><td></td><td>$\hl{93{,}33}$</td></tr></table>
        focus: [1, "1.2", "1.3", "1.4"]
        say: "Đáp án câu một, tính từng khoản. GB giây bằng 5 nhân 10 mũ 7 nhân 0 phẩy 1 nhân 1, bằng 5 triệu, nhân đơn giá được khoảng 83 phẩy 33 đô la. Tiền số lần gọi là 50 triệu nhân 0 phẩy 20 mỗi triệu, bằng 10 đô la. Tổng là 93 phẩy 33 đô la."
      - show: |
          <p>② 50 triệu lần vượt xa điểm hoà vốn → <b>máy ảo</b> chạy liên tục rẻ hơn: $\frac{93{,}33}{36{,}5} \approx 2{,}6$ lần — tải đều và cao là vùng của máy, không phải của hàm.</p>
        say: "Câu hai, 50 triệu lần vượt xa điểm hoà vốn, nên chọn máy ảo chạy liên tục. Hàm đắt hơn khoảng 93 phẩy 33 chia 36 phẩy 5, gần 2 phẩy 6 lần, vì tải đều và cao là vùng của máy, không phải của hàm."

  # ───────────────────────── 6. TỔNG KẾT ─────────────────────────
  - id: recap
    kind: recap
    title: "Chuỗi logic & tư duy cần mang theo"
    steps:
      - show: |
          <div class="chain"><span class="n">tiền = GB-giây + số lần gọi</span><span class="a">→</span>
          <span class="n">tải thưa, thất thường: hàm rẻ</span><span class="a">→</span>
          <span class="n">tải đều, cao: máy chạy liên tục rẻ</span><span class="a">→</span>
          <span class="n">khởi động lạnh, giới hạn đồng thời, không gọi chờ nhau</span></div>
        say: "Tổng kết lại, tiền của hàm gồm GB giây cộng số lần gọi. Tải thưa và thất thường thì hàm rẻ, tải đều và cao thì máy chạy liên tục rẻ hơn. Nhớ khởi động lạnh, giới hạn đồng thời, và đừng để hàm gọi chờ nhau."
      - show: |
          <div class="box key"><b>Tư duy:</b> “không máy chủ” không có nghĩa “không chi phí” — nó đổi chi phí <b>cố định</b> thành chi phí <b>theo từng lần</b>, và điều đó chỉ có lợi tới một ngưỡng.</div>
        say: "Điều cần mang theo, không máy chủ không có nghĩa là không chi phí, nó đổi chi phí cố định thành chi phí theo từng lần, và điều đó chỉ có lợi tới một ngưỡng."
      - clear: true
        show: |
          <p class="note">Bài sau (bài 7): <b>cơ sở dữ liệu được quản lý</b> — bản sao, khôi phục theo thời điểm, điểm và thời gian khôi phục mục tiêu.</p>
        forward_ref: true
        say: "Ở bài sau, bài 7, ta học cơ sở dữ liệu được quản lý, với bản sao, khôi phục theo thời điểm, và điểm cùng thời gian khôi phục mục tiêu. Hẹn gặp bạn ở bài tiếp theo."
